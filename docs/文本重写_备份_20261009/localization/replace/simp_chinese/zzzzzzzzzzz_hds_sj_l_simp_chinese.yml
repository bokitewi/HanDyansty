l_simp_chinese:
 hds_sj_heavy_army:0 "孙氏江东重步军"
 HDS_WU_INVASION_WAR_NAME:0 "孙氏进取丹阳之战"
 hds.5000.t:0 "渴望土地"
 hds.5000.desc:0 "替袁术奔走了这些年，我手下的人跟着我转战各地，名下却始终只有一座庄园。每回清点部众，总有人在帐外低声问：我们究竟为谁而战？\n\n江东的舆图就摊在案头，丹阳山川纵横，各据其地的人也不是打不下来。自己的土地，终究要自己去取；旁人的旗号底下，永远只能分到旁人留下的残羹。\n\n我把袁术最近的军令推到一边，叫人去点兵。"
 hds.5000.a:0 "不再寄人篱下，自立门户，进取丹阳。"
 hds.5000.b:0 "时机未到，再忍一年。"
 hds.5001.t:0 "密谋孙坚"
 hds.5001.desc:0 "孙坚弃我而去，自立旗号，更要紧的是，传国玉玺还攥在他手里。\n\n刘表的使者已在厅外候了两日，信里说得很明白：此人若得江东，得玺，便不会再听任何人的号令。荆州与我并无旧怨，眼下却有同一个对头。\n\n我提笔写了回信，只有寥寥数语：事成之后，各取所需。"
 hds.5001.a:0 "与刘表约定，除去孙坚。"
 hds.5002.t:0 "风声"
 hds.5002.desc:0 "营中近来多了些陌生面孔，往来的信使也比往日勤。有人悄悄递来口信：袁术与刘表之间，似乎在商议什么与我有关的事。\n\n玉玺在我手中，已是天下人都知道的事。我并非没有想过会有这一天，只是没想到来得这样快。\n\n我命人加强戒备，可荆州与寿春都不是我能一口气防住的地方。"
 hds.5002.a:0 "整军戒备，静观其变。"
 hds.5003.t:0 "岘山之祸"
 hds.5003.desc:0 "我率轻骑出营，本是去探一探荆襄虚实，山道两侧忽然箭如雨下。\n\n黄祖的伏兵早已在林中等候，退路被截，随行的人一个接一个倒下。我在乱箭中拔剑，才想起那封未曾拆开的密信，想起袁术与刘表的笑脸。\n\n玉玺，大约终究要换主人了。"
 hds.5003.a:0 "中伏而亡。"
