 dynastic_cycle_participant_group_hd_siyi_movement: "四夷"
 dynastic_cycle_participant_group_hd_siyi_movement_desc: "所有身处中华而非汉文化传承的[characters|E]。\n\n四夷不预朝政，没有朋党，也不参与党争。"
 dynastic_cycle_participant_group_undecided_movement: "宦官"
