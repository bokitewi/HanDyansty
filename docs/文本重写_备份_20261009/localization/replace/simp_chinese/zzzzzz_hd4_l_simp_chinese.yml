l_simp_chinese:
 hd4_continue:0 "此事已定。"
 hd4_wait:0 "暂缓半年，再议此事。"
 hd4_close:0 "知晓了。"
 HD4_TAO_STORY_STATUS:0 "徐州经略：整合法理郡国，事成之后守境安民。"
 hd4_story_tao:0 "陶谦：经略徐州"
 hd4_tao.0001.t:0 "割据徐州"
 hd4_tao.0001.desc:0 "讨董诸军各自散去，徐州的事务却一件也不能随之搁下。各郡的来书排在案前，兵粮、守备、地方争端，都等着我给出新的安排。\n\n三千丹阳精兵已经集结，这份兵力应先用来稳住州境。我让人查报诸郡情形，不愿一面高谈天下，一面任自己治下的道路与城池失去号令。\n\n昔日会盟时，可以把许多难题推到共讨董卓之后；如今那个时候已经到了。徐州若要成为可靠的根本，便得从收整眼前这些分散的军民与郡国做起。"
 hd4_tao.0002.t:0 "臧霸归附"
 hd4_tao.0002.desc:0 "臧霸归附的文书已经办妥，他所领的力量也纳入我的节制。来报的人喜形于色，仿佛只凭这一件事，徐州便能够自此安稳。\n\n我请他将部众与辖地的情形说完，再命人安排后续交接。肯承认州府的号令固然可贵，原先各自经营的人今后怎样相互照应，却还须一件件商量。\n\n案上徐州的图籍又多了一处可以接续的标记。州中兵力得以联结，便少一处分散相争的隐患；只是归附已有名分，治理仍须实做，不能把一封来书当成全部结果。"
 hd4_tao.0003.t:0 "徐州既定"
 hd4_tao.0003.desc:0 "徐州诸郡的归属终于归于一处，过去反复催问的辖境，如今都已纳入我与所属官吏的治理之下。\n\n我将各处回报放好，转而询问百姓归业与守军轮替。继续出征总有新的理由，可若连眼前所得都无暇安顿，越打越远，州中的根本反会渐渐空去。\n\n此后我不再主动另开征服之战。已在进行的军务还须收尾，外敌来犯仍须抵御，但新的号令应更多送向田里、仓中与县署。徐州既定，守住它也值得用尽心力。"
 hd4_tao_danyang_army:0 "陶谦丹阳兵"
 hd4_cao_laiwu_army:0 "莱芜丹阳兵"
 hd4_tao_guarding_xuzhou:0 "守境安民"
 hd4_tao_guarding_xuzhou_desc:0 "陶谦已经整合徐州法理郡国，不再主动兴兵。此为个人故事状态，不随头衔传给继任者。"
 hd4_tao_story_ai:0 "经略徐州"
 hd4_tao_story_ai_desc:0 "陶谦专注于徐州境内的历史整合，不主动向州外扩张。"
 hd4_tao_continue_xuzhou_decision:0 "继续经略徐州"
 hd4_tao_continue_xuzhou_decision_desc:0 "在徐州尚未归附的法理郡国中寻找合法的进攻目标。只在战争名额、停战、盟约和兵力条件均允许时发动专用历史战争；暂时无目标不会视为统一完成。"
 hd4_tao_continue_xuzhou_decision_tooltip:0 "尝试发动一次徐州境内的历史整合战争。"
 hd4_tao_continue_xuzhou_decision_confirm:0 "整军经略徐州"
 hd4_tao_xuzhou_cb:0 "经略徐州"
 HD4_TAO_WAR_NAME:0 "徐州郡国统一之战"
 hd4_tao_victory_desc:0 "陶谦取得目标郡国范围内属于敌方的领土及相应隶属关系。"
 hd4_tao_no_conquest_desc:0 "此次战争不转移目标领土。陶谦的徐州整合计划不会因此被永久关闭。"
 hd4_gsz_invite.t:0 "袁绍邀攻冀州"
 hd4_gsz_invite.desc:0 "袁绍来书邀我南下，说韩馥迟疑可图，冀州大有可为。我把信看完，问使者收获如何分，他却又说了一遍“合力”二字。\n\n本初的笔一向好看，真要取地，却须我的骑兵先去踏开道路。不过若始终坐看他经营，日后冀州成了谁的根本，也未必容我再从容商量。\n\n我将信推到舆图旁。应邀以后，仍须待现有军务与旧约允许，才可发兵；若暂不答应，也可半年后再议。使者还等着，我倒想知道本初盼我这封回书，盼得究竟有多急。"
 hd4_gsz_accept:0 "应邀南下，待可出兵时进取冀州。"
 hd4_gsz_defeat_desc:0 "公孙瓒败于这场冀州历史战争，将走向自尽；其原领地内可独立的伯爵级及以上封臣将在三十天内分离。"
 hd4_gsz_end.t:0 "公孙氏败亡"
 hd4_gsz_end.desc:0 "公孙瓒兵败身死的消息终于传来。先前仍自称奉其号令的各处部属，如今有人闭门自守，有人遣使别寻依附，回报中的旗号比往日杂乱了许多。\n\n我让报信者将各地情形分开说明。一个主帅的死，能使原先连在一起的州郡忽然失去共同号令，却不能让那些守将与兵众同时消失。幽州旧势既已瓦解，新的争夺很快便会沿着这些空隙展开。\n\n我收下军报，望着图上尚未改动的标记。昨日还是一整片需要提防的力量，今日便须逐处重新估量。"
 hd4_north_two.t:0 "北方双雄"
 hd4_north_two.desc:0 "新送来的北方图籍上，往日那些各据一处的旗号渐渐少去。如今各县已归于曹操与袁绍两方，边界比从前清楚，彼此能够回避的余地却也更小了。\n\n我听着军吏逐处报说，将新旧回报对在一起。昔日可以先对付一个小敌、再借另一个强邻相助，如今无论怎样调动，最后都绕不开对面的那股力量。\n\n帐中有人谈起早年共同起兵时的情形，很快又住了口。交情可以留在记忆里，粮道与兵势却都摆在眼前。下一步，北方不会再容许我们只顾各自经营。"
 hd4_guandu_invite.t:0 "统一河北"
 hd4_guandu_invite.desc:0 "帐中议来议去，终于只剩袁绍一个名字。我将笔搁下，让诸将先说完：有人已等不及北进，有人还在反复数粮，连现有旧约也被重新翻出来。\n\n本初家大业大，压到面前时声势自然好看。我却不愿只因声势便替他认下这北方的高低。先打通边境道路，才有往河北伸手的地方；至于何时真能出兵，也得将眼前条件一项项办妥。\n\n我抬眼扫过众人。是定下北伐之议，待可行时开战，还是再缓半年？说到最后，仍要等我这支笔落在哪里。"
 hd4_guandu_accept:0 "定下北伐之议，待可出兵时发动官渡之战。"
 hd4_guandu_cb:0 "官渡历史入侵"
 HD4_GUANDU_WAR_NAME:0 "官渡之战：统一河北"
 hd4_guandu_victory_desc:0 "曹操取得开战时确定的边境目标郡国中属于敌方的领土，并获得袁绍所持可宣称头衔的强宣称。袁绍气急攻心，身负重伤并承受严重健康惩罚；其后死亡时，存活成年儿子将瓜分其剩余领地。"
 hd4_guandu_defeat_desc:0 "曹操未能取胜。袁绍获得曹操所持可宣称头衔的宣称，不触发袁绍的重伤与战后分国。"
 hd4_guandu_white_peace_desc:0 "双方议和，不执行官渡胜利或失败的特殊奖励与惩罚。"
 hd4_guandu_win.t:0 "官渡告捷"
 hd4_guandu_win.desc:0 "报捷的人一口气念了许多地名，念到后面，竟有些喘。我笑着让他慢些，又叫人把新得的边境郡国标出来。\n\n这一仗总算赢了。袁绍尚有河北，我却已不必站在原处等他压来。左右正要接着说恭贺的话，我先问留下多少可用的兵，粮道何时能通；再好的贺辞，也不能替前军多运一车粮。\n\n图上那些未得之地仍在，我的目光沿着边界向北走了一程。名分与主张已经有了，城门还须逐一打开。今日先把胜果拿稳，往后有的是话可以让本初听。"
 hd4_guandu_loss.t:0 "官渡守成"
 hd4_guandu_loss.desc:0 "曹操败退的消息送来，帐中原先那些不安的低语，忽然都换成了称贺。我听他们说了一阵，才叫来人把战果从头禀明。\n\n孟德自以为能趁势北来，如今总该重新掂量袁氏的分量了。将对方各处名位一一列下，便是往后争取的凭据；地尚未尽入我手，不妨先让众人知道，我并不准备就此罢休。\n\n我将战报放到案前，叫人清点兵众，重查边界。今日这场胜利，不必说得像侥幸躲过一劫。北方的事，仍轮不到曹操替我定。"
 hd4_yuan_grief:0 "官渡败后重创"
 hd4_yuan_grief_desc:0 "官渡战败使袁绍遭受严重打击，健康显著恶化。该修正不叠加，也不直接保证死亡。"
 hd4_yuan_grief.t:0 "气急攻心"
 hd4_yuan_grief.desc:0 "官渡的败报已经读过，胸中的闷痛却没有随着文书合起而消散。失去的边境郡国一处处报来，帐中每个人都比平日说得慢些，像是怕再添一个地名，我便承受不住。\n\n我试着起身，身体却先于意志软了下去。昔日可以争论到深夜的军议，如今听不多时便觉疲惫。有人提到诸子今后的安排，又立刻收住话头。\n\n北方大业尚无定论，旁人却已开始盘算我不在之后的事。我望向尚未收起的舆图，想开口斥退他们，最后只叫人把灯移近一些。"
 hd4_yuan_partition.t:0 "袁氏分国"
 hd4_yuan_partition.desc:0 "父亲身后领地的分配已经定下，交到我面前的簿籍，清楚列着此后由我独自掌管的地方。兄弟各有立足之地，也不再共同听命于其中一人。\n\n我看着那些熟悉的县名，忽然觉得它们与昨日不同了。过去发生争执，还能将事情递到父亲案前；如今彼此如何来往、旧部听谁号令，都要由各家重新说定。袁氏的姓氏并未改变，能使众人暂且退让的那个人，却已不在。\n\n门外有人等候新的军令。我将分配文书收好。眼前这份基业既已交到自己手上，往后便须自己担起它的安危。"
 hd_cao_chain.0094.t:0 "莱芜整众"
 hd_cao_chain.0094.desc:0 "莱芜城外又添了营帐。宗族与旧部的消息陆续送来，能够相从的人各携部曲家资，不能亲至的，也遣人探问军中所缺。几日前还得提防沿途追骑，如今已有人等我发令。\n\n粮资与丹阳兵众的名册送到案前，我逐项看过，才将它压在舆图一角。立足之地既有，接下来要做的便不只是躲过董卓的追索。散在四方的愤怒，总须有人把它变成军令、粮道和肯向前走的队伍。\n\n我命营中重新列伍。天下未定，曹氏不能只做一个暂且有处栖身的逃亡之家。"
 hd_cao_chain.0094.a:0 "以莱芜为基，整军待发。"
 hd_cao_chenliu_danyang_army:0 "莱芜丹阳兵"
