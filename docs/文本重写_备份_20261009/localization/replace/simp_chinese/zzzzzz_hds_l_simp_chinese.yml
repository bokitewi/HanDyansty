l_simp_chinese:
 hds.1000.t:0 "荆州立足"
 hds.1000.desc:0 "讨董诸军各归州郡，昔日会盟时尚肯相让的事情，如今都得重新商量。荆州也不能只靠一纸名位，便使各处兵众与官署自行安定。\n\n我把州内的舆图展在面前，请熟知乡里的士人说明道路与人情。有人所领兵众虽少，却扼着水陆要冲；有人并不出面，宗族与宾客的话却能传遍数县。若只凭外来号令逐一压服，未必比耐心联结他们更快。\n\n先在荆州立足，再收整诸郡。天下既已纷乱，我总得先使自己治下的人，知道明日该向何处听令。"
 hds.1000.a:0 "接掌荆州，先结州中士人。"
 hds.1001.t:0 "蒯越归附"
 hds.1001.desc:0 "蒯越的来意终于说得明白：他愿将所领之地归入我的节制，也愿与我订盟，共安荆州。\n\n我没有急着把话说满，而是请他将当地的兵众、道路与难处逐项道来。异度熟悉乡里，许多在州府簿册上只有一个名字的人，到他口中便各有来历与牵连。要使这些人承认同一道号令，不能只改一处文书上的署名。\n\n谈到暮色入堂，我们才将交接之事议定。我为他留下一席，也为此后的相互援应留下一份承诺。荆州的根基，便从这些肯坐下来共议的人身上扎起。"
 hds.1001.a:0 "纳其归属，与异度订盟。"
 hds.1002.t:0 "蔡瑁归附"
 hds.1002.desc:0 "蔡瑁愿率所属归附的消息送来，州中事务又有了一处可以落实的依凭。我命人请他入议，不必先把礼辞说得周全，只须将实际所领的人马与地方说明。\n\n荆州道路沿江汉相接，一处关津不通，邻近郡县也难独自安稳。德珪的归附，既是增加一份兵力，也使原先各有号令的人能够开始共议守备。\n\n我将面前的舆图向他推近些。日后的约束与援应，今日就应说清，免得各自回去以后，又把同一场会面讲成两种许诺。"
 hds.1002.a:0 "接纳蔡氏部属，与德珪订盟。"
 hds.1003.t:0 "荆州已定"
 hds.1003.desc:0 "州内最后几份交割文书终于送齐。荆州诸郡如今都已归入我的节制，旧日需要遣使反复问讯的地方，开始按同一套次序报送事务。\n\n左右有人借机谈起向外进兵，我却先问各县仓储与守备。收取一座城，可以凭军势；使拿下的地方不再生乱，却要多花许多不见声势的工夫。新归的官吏、地方的旧族、兵众与百姓，都在看州府接下来打算向他们索取什么。\n\n我把外征的议论暂且压下。荆州既定，往后应以守境为先；已开的战事仍须收尾，来犯之敌也不能放任。"
 hds.1003.a:0 "以守境安民为先，不再主动外征。"
 hds.2000.t:0 "出逃南阳"
 hds.2000.desc:0 "董卓的甲士又从府门外经过，车轮声停下之后，堂中连说话都轻了。我看着左右那副怕惹事的神情，越发不愿再在雒阳多住一日。\n\n袁氏的门第，难道还要靠他肯不肯放行来维持？宛城有庄业可依，所属之人也可一并迁去。留在这里陪那些失势公卿低头，倒真像我已无处可走。\n\n书吏捧来行装清单，我叫他先点家资与随行人众。宅第带不走便留着，日后自会有人愿来南阳见我；不必都挤在董卓的门前。"
 hds.2000.a:0 "迁家业于宛城，离开京中。"
 hds.2001.t:0 "孙坚来投"
 hds.2001.desc:0 "孙坚说愿替我取南阳，我便让人将酒再添上。文台开口不绕弯，既带得来兵，也肯做事，比那些只会拿着空名求见的人强得多。\n\n他说到原任职掌与孙氏家业的交割，我听罢点头。至于南阳旧守肯不肯，倒不必先让他把我们的酒兴败尽；若处处等旁人相让，又何须请文台来谈？\n\n我将舆图向他推过去。袁氏有根基，孙氏有锐兵，彼此各取所需，正该成一番事。南阳落定以后，便让来往的人知道，这里已不是旧日那一套号令。"
 hds.2001.a:0 "借文台之力取南阳，接纳孙氏。"
 hds.2002.t:0 "南阳自立"
 hds.2002.desc:0 "讨董联盟散了，旧日共同进退的名义也渐渐失去分量。案前仍放着会盟时留下的文书，门外来问的，却已经是南阳今后的兵粮与疆界。\n\n我将旧盟书收起。袁氏在这里有家业，有部属，也有足以向邻州发声的兵众；若仍事事等着昔日盟主安排，便只会把眼前的机会让给旁人。\n\n豫州与扬州都在我的经营之望中，第一步却须先看豫州。南阳是立足之地，不能只是暂避雒阳风波的一间客舍。我命人另拟军议，自此为自家基业发令。"
 hds.2002.a:0 "据南阳自立，主张豫扬，先图豫州。"
 hds.3000.t:0 "掌中玉玺"
 hds.3000.desc:0 "讨董之战已胜，诸军却陆续收兵。传国玉玺辗转送到我手中时，身旁的人先屏住了呼吸，仿佛这方玉比帐外未散的兵马还要沉重。\n\n我将它翻看，刻文映在灯下。出兵时所称的是扶持汉室，如今象征天子权柄的东西却落到自己手里，往后无论藏与露，都不再是寻常器物的处置。\n\n有人想开口，我先合上匣盖。持有玉玺，并不等于四方已经听命于我；但消息若传出去，觊觎它的人绝不会等我把道理想清。此物须先妥善收存。"
 hds.3000.a:0 "收存玉玺，慎防外泄。"
 hds.4000.t:0 "承继父业"
 hds.4000.desc:0 "家中旧物一件件送到我面前，来交割的人仍顺口称着父亲，话到一半才忙着改口。我没有催他，等他把那一声称呼咽下去。\n\n簿籍上的庄业与名位，如今都归我承接。父亲留下的人还在，先前想做而未做成的事也在，只是再没有人会坐在上首，替我把最后一句话说完。\n\n我翻开簿册，很快便嫌那些数目看得人胸口发闷，索性叫旧部近前议事。孙氏不能只剩一堆等我保管的家当。先把父业接稳，往后的路，我要亲自走出去。"
 hds.4000.a:0 "接住父业，承担孙氏诸事。"
 hds.4001.t:0 "转向江东"
 hds.4001.desc:0 "袁术的军令又摆到案上，我只看了几行，便将它挪到一旁。父亲留下的人难道要一直替旁人奔走，孙氏自己的旗，便永远只跟在别家旗后？\n\n江东的舆图展开，我用指节敲了敲扬州所在。离开这里，庄业仍是孙氏的庄业；所缺的兵，若玉玺尚在，便拿去与袁术换。他看重匣中那方玉，我要的是五千能够随我向前的甲士。\n\n若玉玺已经不在，也不能就此又坐回原处。我叫人点清部众。去意已定，余下便看这一步怎样迈出去。"
 hds.4001.a:0 "脱离袁术，经营江东；有玺便以玺换兵。"
 hds.4002.t:0 "周瑜来归"
 hds.4002.desc:0 "听说周瑜来了，我将案上的军报一推，起身便往外迎。公瑾尚未把礼行完，我已拉着他问起随来的兵众，连旁人准备的客套话也没留空。\n\n两千轻步兵固然可喜，更可喜的是终于有人能与我坐下来，把江东的打算从头说个痛快。旧职与家业尚有交割，便安排人料理；眼前的舆图，却不必再等。\n\n我们从渡口说到粮道，又为一处进军方向争了几句。我原先积在胸中的烦闷，不知何时已散了。公瑾既至，许多只在心里转过的事，终于可以拿出来做了。"
 hds.4002.a:0 "迎公瑾与兵众，共议江东。"
 hds.4003.t:0 "先取丹阳"
 hds.4003.desc:0 "“先取丹阳。”我将手按在舆图上，帐中几人顺着看过来，方才还散在扬州各处的议论，总算有了落脚的地方。\n\n离开袁术以后，我已听够旁人问孙氏准备往哪里去。丹阳有山川关津，也有各据其地的人；先打眼前这个敌手，余下的再一处处收拾，不能因为还未尽得全郡，便连第一步都不敢走。\n\n帐外的兵众已经待令，我也不愿继续坐着数图上的城。江东不是旁人肯给才有的地方。先在丹阳立住，再让他们看看这面孙氏旗号会到哪里。"
 hds.4003.a:0 "以丹阳为先，整军进取。"
 hds.4004.t:0 "丹阳立足"
 hds.4004.desc:0 "丹阳诸处交割的回报终于齐了。我让人把那些尚标着别家归属的地方逐一改过，看着图上的孙氏疆土连到一起，竟比听一番颂功还痛快。\n\n有人问可否暂收军议，我没有答，只将扬州的舆图又展开一些。丹阳已定，粮道与城邑总算有了根本；后面还有诸郡，也还有等着看我止步于此的人。\n\n新得之地须安置，下一步用兵也得有分寸，这些我自然知道。但留在案上的图不必急着卷起。好容易有了自己的立足处，岂是为了从此不再向前？"
 hds.4004.a:0 "以丹阳为本，继续经营扬州。"
