l_simp_chinese:
 tgp_interaction_event.0010.a:0 "由我办理参战援助。"
 tgp_interaction_event.0010.b:0 "遣定好的武官加入战事。"
 tgp_interaction_event.0010.c:0 "另行挑选援军安排。"
 tgp_interaction_event.0010.desc:0 "军前仍在交战，所需援助不敢迟报，谨遣使请调兵相援。各路有各路的难处，来书未必尽能说明，仍盼先给一个明确答复。\n\n若可亲自加入，军中自有所倚；若另有军务，也请遣合用武官前来，共担现有战局。至于从何处接应、各部如何相通，得有了定议，才好继续安排。\n\n此请并非另开战争。若答复时人事或节制已有变化，也请据实告知，免使我们仍按原望等候。军情多变，使者不宜久留，谨候裁处。"
