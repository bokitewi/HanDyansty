l_simp_chinese:
 hd_peach_garden.0001.t:0 "桃园结义"
 hd_peach_garden.0001.desc:0 "昨日，我还站在招军榜下，为无钱募兵而叹息。张飞的一声喝问，却将我带进了酒肆。他愿出资招募乡勇；随后进店的关羽，本是赶来投军，听罢我的志向，也移席与我们同坐。谈至兴起，翼德邀我们到庄上，提出结为兄弟。\n\n此刻，庄后的桃花开得正盛。乌牛白马的祭礼已经备齐，香烟从供案前升起。昨日说要倾财举事的翼德收住了笑，云长整衣立在一旁，等我上前。\n\n我低头理平衣襟。身为汉室宗亲，至今却只能以织席贩履奉养老母；如今有人肯拿出家资，有人肯将性命相托，我又岂能辜负？\n\n我在二人之间跪下。眼前这炷香烧尽，我们便不再只是同路投军的陌生人了。"
 hd_peach_garden.0001.a:0 "不求同年同日生，但求同年同日死"
