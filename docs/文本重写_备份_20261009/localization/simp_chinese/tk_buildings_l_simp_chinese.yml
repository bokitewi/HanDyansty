 building_TK_20_83_ZuoDuJinKuang1Ji_desc: "佐渡金矿：佐渡国是日本古代令制国之一，辖区为今新潟县佐渡岛全境。文武天皇四年（700年）初见记载，原属越国，743年划归越后国管辖，752年正式分立设国。境内分设羽茂、杂太、贺茂三郡，以佐渡金山、大须银山、鹤子银山等金银矿著称，主要特产包括金、银、铜及玛瑙。初级金矿规模。"
