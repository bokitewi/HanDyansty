 TK_20_88_YunXiXiKuang1Ji: "郧西锡矿Ⅰ级"
 building_TK_20_88_YunXiXiKuang1Ji: "$TK_20_88_YunXiXiKuang1Ji$"
 building_TK_20_88_YunXiXiKuang1Ji_desc: "郧西锡矿：据《汉书·地理志》及专家研究，汉代以前只有今云南石室山、贲古和湖北郧西有锡矿。云南距朝歌太远，郧西锡矿成为国矿，“莽曰钖治”就是因为郧西锡矿丰富。《郧县志》马安锡洞沟，从商朝中期一直开采到2010年。初级锡矿规模。"
