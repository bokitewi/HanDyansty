 building_TK_20_81_DaYeTieKuang1Ji: "$TK_20_81_DaYeTieKuang1Ji$"
 building_TK_20_81_DaYeTieKuang1Ji_desc: "大冶铁矿：自三国·吴·黄武五年（公元226年）开采迄今已有1700余年。吴大帝孙权在这里造过刀剑，隋炀帝杨广在这里铸过钱。宋代岳飞在这里铸过剑，到现代的大冶铁矿开采，这里最终形成了“亚洲第一采坑”的壮丽景象。初级铁矿规模。"
