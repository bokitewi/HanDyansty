 building_TK_20_81_JinChengTieKuang1Ji: "$TK_20_81_JinChengTieKuang1Ji$"
 building_TK_20_81_JinChengTieKuang1Ji_desc: "晋城铁矿：晋城大阳古镇曾是北方制造兵器所需生铁的重要产地，古时与干将莫邪齐名的春秋战国名剑阳阿古剑就产自于此。北宋年间，泽州“大广冶”为冶铁官炉，所铸“大观通宝”被誉为史上最美铁母（钱）。明清时期，泽州府的采煤、炼铁和铸造行业极为鼎盛，泽州府境内的大阳镇被誉为“九州针都”，生产的“大德”牌钢针畅销海内外。初级铁矿规模。"
