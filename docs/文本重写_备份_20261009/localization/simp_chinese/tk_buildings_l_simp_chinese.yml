 building_TK_20_82_ShaoGuanYinKuang1Ji_desc: "韶关银矿：刘宋文帝初年，始兴郡领有银民三百多户，专事开采银矿。《始兴记》:“泠君西北有小首山，宋元嘉元年夏，霖雨山崩，自巅及麓，崩处有光耀，有若星辰焉。居人往观，皆是银铄，铸得银也。”初级银矿规模。"
