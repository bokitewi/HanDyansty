 TK_20_86_KeShiMiErBaoShiKuang1Ji: "克什米尔宝石矿Ⅰ级"
 building_TK_20_86_KeShiMiErBaoShiKuang1Ji: "$TK_20_86_KeShiMiErBaoShiKuang1Ji$"
 building_TK_20_86_KeShiMiErBaoShiKuang1Ji_desc: "克什米尔宝石矿：又称“矢车菊”蓝宝石，是产自印度喀什米尔扎斯卡山脉的稀有宝石品种，因矿脉枯竭现多存于博物馆及私人收藏领域。其颜色呈现略带紫色的天鹅绒般浓艳蓝色，内部含有雪片状内含物与乳白色条带，形成独特的丝绒质感。该宝石摩氏硬度达9级，与红宝石并称“姊妹宝石”。初级玉矿规模。"
