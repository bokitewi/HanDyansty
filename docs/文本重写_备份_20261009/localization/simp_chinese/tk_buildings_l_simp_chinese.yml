 building_TK_20_81_TangXiTieKuang1Ji: "$TK_20_81_TangXiTieKuang1Ji$"
 building_TK_20_81_TangXiTieKuang1Ji_desc: "棠溪铁矿：天下之剑韩为众（战国时期，西平县属于韩国）。一曰棠溪，二曰墨曜（墨阳），三曰合伯，四曰邓师，五曰宛冯，六曰龙泉，七曰太阿，八曰莫邪，九曰干将。春秋时期，棠溪已开始专门铸剑，战国时宝剑更是是名冠中国九大名剑之首。棠溪县之所以出名，原因之一即依靠棠溪的优质铁矿。初级铁矿规模。"
