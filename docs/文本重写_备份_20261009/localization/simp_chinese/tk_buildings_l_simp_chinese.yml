 building_TK_20_84_ShuoFangQingYan1Ji_desc: "朔方青盐：《汉书·地理志》朔方郡朔方县：“金连盐泽、青盐泽皆在南。”《水经·河水注》：“《魏土地记》曰：(朔方)县有大盐池，其盐大而青白，名曰青盐，又名戎盐，入药分，汉置典盐官。”初级盐矿规模。"
