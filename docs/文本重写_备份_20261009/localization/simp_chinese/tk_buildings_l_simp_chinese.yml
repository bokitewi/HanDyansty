 building_TK_20_84_HeDongChiYan1Ji: "$TK_20_84_HeDongChiYan1Ji$"
 building_TK_20_84_HeDongChiYan1Ji_desc: "河东池盐：河东池盐的历史可以追溯到上古时期，具体时间可以上溯到黄帝炎帝时期。早在五千多年前，我们的祖先就在运城盐湖发现并食用盐。河东盐池古称“渤澥”，所以盐池的盐被称为“解盐”，在历史上有着“解梁之盐”的美誉。河东池盐的生产方式独特，主要通过日晒风成，生产方式最为省力。初级盐矿规模。"
