 building_TK_20_81_LiaoDongTieKuang3Ji: "$TK_20_81_LiaoDongTieKuang3Ji$"
 building_TK_20_81_LiaoDongTieKuang3Ji_desc: "辽东铁矿：汉武帝在全国出产铁矿的郡县设立了48个铁官，下面设有炼铁场，组织开采、冶炼及铸造铁器。在48个炼铁场中，辽宁占有一席之地，即辽东郡平郭县炼铁场，位于今天营口市鲅鱼圈区熊岳镇。高级铁矿规模。"
