 building_type_TK_20_88_HeXianXiKuang1Ji_desc: "锡矿"
 TK_20_88_HeXianXiKuang1Ji: "贺县锡矿Ⅰ级"
 building_TK_20_88_HeXianXiKuang1Ji: "$TK_20_88_HeXianXiKuang1Ji$"
 building_TK_20_88_HeXianXiKuang1Ji_desc: "贺县锡矿：指位于贺州的锡矿。西汉时期，贺州的锡矿就已经大规模开采。唐时贺州之“贺”已经成了锡的代名词，宋时，贺州平均每年外运铸钱的锡占全国的62%，可以说，在那个时代，一天没有贺州锡矿的供应，全国就没钱用。初级锡矿规模。"
