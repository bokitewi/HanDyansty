 building_TK_20_84_ZiGongJingYan1Ji: "$TK_20_84_ZiGongJingYan1Ji$"
 building_TK_20_84_ZiGongJingYan1Ji_desc: "自贡井盐：自贡井盐生产历史可追溯至周秦时代，距今已有2000多年，最早由秦蜀郡守李冰主持开凿（双流县境），被誉为“井盐之父”。东汉时期富顺县出现标志性盐井“富世盐井”，持续生产1400余年，至明代卤水枯竭后，自流井、贡井地区崛起，最终促成1939年自贡建市。初级盐矿规模。"
