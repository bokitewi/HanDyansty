 TK_20_84_WuXiBaYan1Ji: "巫溪巴盐Ⅰ级"
 building_TK_20_84_WuXiBaYan1Ji: "$TK_20_84_WuXiBaYan1Ji$"
 building_TK_20_84_WuXiBaYan1Ji_desc: "巫溪巴盐：宝源山是中国已知最早的盐泉，距今有5000年历史。远古时代，渝东、鄂西一带的天然盐泉有重庆巫溪宝源山、彭水郁山伏牛山，湖北长阳清江三大天然盐泉，所产之盐或名巴盐，或名盐巴。秦国蜀郡太守李冰主持发明深井采卤技术前，整个汉中盆地、两湖盆地、四川盆地、武陵山区、乌蒙山区、云贵高原等地的食盐，主要靠巴盐供应。初级盐矿规模。"
