 building_type_TK_20_85_PaGanYuShiKuang1Ji_desc: "玉石矿"
 TK_20_85_PaGanYuShiKuang1Ji: "帕敢玉石矿Ⅰ级"
 building_TK_20_85_PaGanYuShiKuang1Ji: "$TK_20_85_PaGanYuShiKuang1Ji$"
 building_TK_20_85_PaGanYuShiKuang1Ji_desc: "帕敢玉石矿：位于缅甸北部克钦邦乌鲁江中游地带，属冲积或残-坡积矿床，为缅甸历史最悠久的翡翠产区之一，开采活动始于公元一世纪。该场口以产出颗粒感强、结构细腻的翡翠著称，尤以蓝水翡翠和老油青种为主要特色。矿层深度达五层约30米，山石类原石以乌黑砂、黄盐沙等品质最佳，水石则多分布于沙土中呈现砾石状。初级玉矿规模。"
