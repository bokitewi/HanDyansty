l_simp_chinese:

 #####三国新增建筑
 building_type_TK_20_10_WaHuangGong: "陵墓祖地"
 building_type_TK_20_10_WaHuangGong_desc: "陵墓祖地"
 TK_20_10_WaHuangGong: "娲皇宫"
 building_TK_20_10_WaHuangGong: "$TK_20_10_WaHuangGong$"
 building_TK_20_10_WaHuangGong_desc: "娲皇宫为传说中女娲抟土造人、炼石补天的地方。传说农历三月十八为女娲生日，为了祭祀，娲皇宫会在农历三月初一到三月十八举行庙会。"
 building_type_TK_20_10_FuXiMiao: "陵墓祖地"
 building_type_TK_20_10_FuXiMiao_desc: "陵墓祖地"
 TK_20_10_FuXiMiao: "伏羲庙"
 building_TK_20_10_FuXiMiao: "$TK_20_10_FuXiMiao$"
 building_TK_20_10_FuXiMiao_desc: "原名太昊宫，俗称人宗庙。相传正月十六是伏羲诞辰，按照传统人们要到伏羲庙“朝人宗”，这便是伏羲庙庙会。"
 building_type_TK_20_10_HuangDiLing: "陵墓祖地"
 building_type_TK_20_10_HuangDiLing_desc: "陵墓祖地"
 TK_20_10_HuangDiLing: "黄帝陵"
 building_TK_20_10_HuangDiLing: "$TK_20_10_HuangDiLing$"
 building_TK_20_10_HuangDiLing_desc: "古称“桥陵”，是轩辕黄帝的陵寝，是历代帝王和名人祭祀黄帝的场所。"
 building_type_TK_20_10_YanDiLing: "陵墓祖地"
 building_type_TK_20_10_YanDiLing_desc: "陵墓祖地"
 TK_20_10_YanDiLing: "炎帝陵"
 building_TK_20_10_YanDiLing: "$TK_20_10_YanDiLing$"
 building_TK_20_10_YanDiLing_desc: "炎帝陵是中华民族始祖炎帝神农氏的安息地，享有“神州第一陵”之誉。"
 building_type_TK_20_10_DaYuLing: "陵墓祖地"
 building_type_TK_20_10_DaYuLing_desc: "陵墓祖地"
 TK_20_10_DaYuLing: "大禹陵"
 building_TK_20_10_DaYuLing: "$TK_20_10_DaYuLing$"
 building_TK_20_10_DaYuLing_desc: "大禹是上古时代一位治水英雄，中国第一个王朝，夏朝的开国之君，被后人尊为“立国之祖”。大禹陵，古称禹穴，是大禹的葬地。大禹陵由禹陵、禹祠、禹庙三部分组成。"
 building_type_TK_20_10_MaZuMiao: "陵墓祖地"
 building_type_TK_20_10_MaZuMiao_desc: "陵墓祖地"
 TK_20_10_MaZuMiao: "妈祖庙"
 building_TK_20_10_MaZuMiao: "$TK_20_10_MaZuMiao$"
 building_TK_20_10_MaZuMiao_desc: "妈祖庙，即“湄洲妈祖祖庙”，位于福建省莆田市湄洲岛，始建于北宋雍熙四年（987年），是妈祖文化的起源地。"
 building_type_TK_20_10_DaHuaiShu: "陵墓祖地"
 building_type_TK_20_10_DaHuaiShu_desc: "陵墓祖地"
 TK_20_10_DaHuaiShu: "大槐树"
 building_TK_20_10_DaHuaiShu: "$TK_20_10_DaHuaiShu$"
 building_TK_20_10_DaHuaiShu_desc: "京津冀鲁豫和江淮地区，有一首传唱了数百年的民谣：“问我祖先来何处，山西洪洞大槐树。”洪洞大槐树一般是指明初移民后代寻宗觅祖所追寻到的祭祖之地，更早出名记载为唐洪洞广济寺，当时已有大量的移民记录。"
 building_type_TK_20_10_QianLing: "陵墓祖地"
 building_type_TK_20_10_QianLing_desc: "陵墓祖地"
 TK_20_10_QianLing: "乾陵"
 building_TK_20_10_QianLing: "$TK_20_10_QianLing$"
 building_TK_20_10_QianLing_desc: "乾陵是陕西关中地区唐十八陵之一，为唐高宗李治与武则天的合葬墓，位于陕西省咸阳市乾县北部，距离县城6千米的梁山上，距古都西安76公里。乾陵建成于唐光宅元年（684年），神龙二年（706年）加盖，采用“因山为陵”的建造方式，陵区仿京师长安城建制。除主墓外，乾陵还有十七个小型陪葬墓，葬有其他皇室成员与功臣。"
 building_type_TK_20_20_TianZhaoShenGong: "寺庙神社"
 building_type_TK_20_20_TianZhaoShenGong_desc: "寺庙神社"
 TK_20_20_TianZhaoShenGong: "天照神宫"
 building_TK_20_20_TianZhaoShenGong: "$TK_20_20_TianZhaoShenGong$"
 building_TK_20_20_TianZhaoShenGong_desc: "天照神宫为邪马台国国主以侍奉天照大神而建立的神社。神社祭司称巫女，国主卑弥呼以王女兼巫女而出名。"
 building_type_TK_20_20_BaiMaSi: "寺庙神社"
 building_type_TK_20_20_BaiMaSi_desc: "寺庙神社"
 TK_20_20_BaiMaSi: "白马寺"
 building_TK_20_20_BaiMaSi: "$TK_20_20_BaiMaSi$"
 building_TK_20_20_BaiMaSi_desc: "白马寺始建于东汉永平十一年（公元68年），是佛教传入中国后兴建的第一座官办寺院，乃中国、越南、朝鲜、日本及欧美国家的“释源”和“祖庭”。"
 building_type_TK_20_20_FaMenSi: "寺庙神社"
 building_type_TK_20_20_FaMenSi_desc: "寺庙神社"
 TK_20_20_FaMenSi: "法门寺"
 building_TK_20_20_FaMenSi: "$TK_20_20_FaMenSi$"
 building_TK_20_20_FaMenSi_desc: "法门寺始建于东汉末年桓灵年间，距今约有1700多年历史，有“关中塔庙始祖”之称，周魏以前称作“阿育王寺”，隋文帝时改称“成实道场”，唐高祖时改名“法门寺”。法门寺被誉为皇家寺庙，因安置释迦牟尼佛指骨舍利而成为举国仰望的佛教圣地。法门寺佛塔被誉为“护国真身宝塔”。"
 building_type_TK_20_20_ChuYunDaShe: "寺庙神社"
 building_type_TK_20_20_ChuYunDaShe_desc: "寺庙神社"
 TK_20_20_ChuYunDaShe: "出云大社"
 building_TK_20_20_ChuYunDaShe: "$TK_20_20_ChuYunDaShe$"
 building_TK_20_20_ChuYunDaShe_desc: "出云大社位于岛根县出云市，是日本最古老的神社之一，也是日本被冠有“大社”之名的神社之一。供奉的神是被称为“国中第一之灵神”的大国主大神。据说每一年的“神无月”（10月），全国的八百万神灵都聚集到此进行神议，对于出云大社来说，就是“神在月”，因此举行盛大的神在祭（农历10月11日-17日）。"
 building_type_TK_20_20_HaiYinSi: "寺庙神社"
 building_type_TK_20_20_HaiYinSi_desc: "寺庙神社"
 TK_20_20_HaiYinSi: "海印寺"
 building_TK_20_20_HaiYinSi: "$TK_20_20_HaiYinSi$"
 building_TK_20_20_HaiYinSi_desc: "海印寺是位于韩国伽耶山的寺庙，在新罗时期是华严宗十大道场之一，现为曹溪宗五大丛林、三大寺、三十一座禅教大本山之一。"
 building_type_TK_20_20_WuDangShanDaoGuan: "寺庙神社"
 building_type_TK_20_20_WuDangShanDaoGuan_desc: "寺庙神社"
 TK_20_20_WuDangShanDaoGuan: "武当山道观"
 building_TK_20_20_WuDangShanDaoGuan: "$TK_20_20_WuDangShanDaoGuan$"
 building_TK_20_20_WuDangShanDaoGuan_desc: "武当山道教宫观以天柱峰为控制中心，按“天路历程”规划模式布局，划分为道教“天、地、人”空间体系。宫观建筑沿剑河与水磨河间神道线性分布，院落空间分为生活区、修炼区及祭祀区，其中祭祀区包含过渡、核心与后续空间。南岩宫作为典型代表，运用因借地形、逻辑空间组织等营造手法，天门、牌坊、桥等要素构成“天门+神道”引导空间模式。明代武当山被敕封为“大岳”“玄岳”。"
 building_type_TK_20_20_ShaoLinSi: "寺庙神社"
 building_type_TK_20_20_ShaoLinSi_desc: "寺庙神社"
 TK_20_20_ShaoLinSi: "少林寺"
 building_TK_20_20_ShaoLinSi: "$TK_20_20_ShaoLinSi$"
 building_TK_20_20_ShaoLinSi_desc: "少林寺不仅是禅宗的发祥地，还是中国功夫的发祥地，有“禅宗祖庭，功夫圣地”之称，被誉为“天下第一名刹”。因其历代少林武僧潜心研创和不断发展的少林功夫而名扬天下，素有“天下功夫出少林，少林功在永化堂”之说。始建于北魏太和十九年（495年），是孝文帝为了安顿印度高僧跋陀落迹传教而兴建的一座寺院，因坐落于嵩山腹地少室山茂密丛林之中，故名“少林寺”。"
 building_type_TK_20_20_LingYinSi: "寺庙神社"
 building_type_TK_20_20_LingYinSi_desc: "寺庙神社"
 TK_20_20_LingYinSi: "灵隐寺"
 building_TK_20_20_LingYinSi: "$TK_20_20_LingYinSi$"
 building_TK_20_20_LingYinSi_desc: "灵隐寺又名云林寺，地处浙江省杭州市西湖以西，背靠北高峰，面朝飞来峰，为杭州最早的名刹，始建于东晋咸和元年（公元326年），灵隐寺开山祖师为西印度僧人慧理和尚，南朝梁武帝赐田并扩建。五代吴越王钱镠命请永明延寿大师重兴开拓，并赐名灵隐新寺。宋宁宗嘉定年间，灵隐寺被誉为江南禅宗“五山”之一。清顺治年间，具德和尚住持灵隐，筹资重建，使其规模跃居“东南之冠”。"
 building_type_TK_20_20_DaYanTa: "寺庙神社"
 building_type_TK_20_20_DaYanTa_desc: "寺庙神社"
 TK_20_20_DaYanTa: "大雁塔"
 building_TK_20_20_DaYanTa: "$TK_20_20_DaYanTa$"
 building_TK_20_20_DaYanTa_desc: "大雁塔位于唐长安城（今陕西省西安市）晋昌坊的大慈恩寺内，又名“慈恩寺塔”。唐永徽三年（652年），玄奘为保存由天竺经丝绸之路带回长安的经卷佛像，主持修建了大雁塔，最初五层，武则天长安年间将塔身改至七层，此后一直保持着七层的外观至今。"
 building_type_TK_20_20_XuanKongSi: "寺庙神社"
 building_type_TK_20_20_XuanKongSi_desc: "寺庙神社"
 TK_20_20_XuanKongSi: "悬空寺"
 building_TK_20_20_XuanKongSi: "$TK_20_20_XuanKongSi$"
 building_TK_20_20_XuanKongSi_desc: "悬空寺原叫“玄空阁” ，位于山西省大同市浑源县城东南4千米恒山磁窑峡（亦称金龙峡） 翠屏峰西侧，是儒释道三教合一的寺庙建筑群。悬空寺始建于北魏太和十五年（491年），历代皆有修缮，其中金、元时期，南楼、北楼及悬空栈桥已大致形成现今的空间格局，中华民国时期的悬空寺与与如今所见基本一致，且现存建筑主要为明清时期修建。"
 building_type_TK_20_20_YanDaoShenShe_01: "寺庙神社"
 building_type_TK_20_20_YanDaoShenShe_01_desc: "寺庙神社"
 TK_20_20_YanDaoShenShe_01: "严岛神社"
 building_TK_20_20_YanDaoShenShe_01: "$TK_20_20_YanDaoShenShe_01$"
 building_TK_20_20_YanDaoShenShe_01_desc: "严岛神社是位于日本广岛县廿日市严岛的神道教神社，创建于593年，主祭宗像三女神。神社建筑群修筑于濑户内海潮间带上，以朱红色海上大鸟居著称，其矗立海中的巨型鸟居构成"日本三景"核心景观。现存社殿以1168年平清盛建造的寝殿造建筑为核心，21栋建筑通过300米回廊连接形成飞鸟状布局，神社建筑及藏品多被指定为国宝。"
 building_type_TK_20_20_YanDaoShenShe_02: "寺庙神社"
 building_type_TK_20_20_YanDaoShenShe_02_desc: "寺庙神社"
 TK_20_20_YanDaoShenShe_02: "严岛神社高级"
 building_TK_20_20_YanDaoShenShe_02: "$TK_20_20_YanDaoShenShe_02$"
 building_TK_20_20_YanDaoShenShe_02_desc: "严岛神社是位于日本广岛县廿日市严岛的神道教神社，创建于593年，主祭宗像三女神。神社建筑群修筑于濑户内海潮间带上，以朱红色海上大鸟居著称，其矗立海中的巨型鸟居构成"日本三景"核心景观。现存社殿以1168年平清盛建造的寝殿造建筑为核心，21栋建筑通过300米回廊连接形成飞鸟状布局，神社建筑及藏品多被指定为国宝。"
 building_type_TK_20_20_YiShiShenGong: "寺庙神社"
 building_type_TK_20_20_YiShiShenGong_desc: "寺庙神社"
 TK_20_20_YiShiShenGong: "伊势神宫"
 building_TK_20_20_YiShiShenGong: "$TK_20_20_YiShiShenGong$"
 building_TK_20_20_YiShiShenGong_desc: "伊势神宫是位于日本三重县伊势市的神社，主要由内宫（皇大神宫）和外宫（丰受大神宫）构成。伊势神宫的创建时间不晚于持统天皇四年（690年），日本史学界一般认为创建于天武天皇时期。伊势神宫的建筑样式来源于日本弥生时代的米仓。"
 building_type_TK_20_20_HuangLongSi: "寺庙神社"
 building_type_TK_20_20_HuangLongSi_desc: "寺庙神社"
 TK_20_20_HuangLongSi: "皇龙寺"
 building_TK_20_20_HuangLongSi: "$TK_20_20_HuangLongSi$"
 building_TK_20_20_HuangLongSi_desc: "皇龙寺是新罗真兴王14年（553年）始建于庆州半月城附近平原的古刹，历时17年于569年完工，曾是韩国历史上规模最大的佛教寺院。1238年蒙古入侵高丽期间，该寺被焚毁。"
 building_type_TK_20_20_TianTaiZongSiYuan: "寺庙神社"
 building_type_TK_20_20_TianTaiZongSiYuan_desc: "寺庙神社"
 TK_20_20_TianTaiZongSiYuan: "天台宗寺院"
 building_TK_20_20_TianTaiZongSiYuan: "$TK_20_20_TianTaiZongSiYuan$"
 building_TK_20_20_TianTaiZongSiYuan_desc: "天台宗寺院指净居寺，位于浙江省台州市仙居县景星岩腹地，始建于唐代。宋代高僧行机曾在此结庐而居，明代石奇、清代湛庵相继扩建，清顺治十五年（1658年）毁于山寇围剿。截至2024年，现住持妙德历经数十年重修殿宇，恢复原有规模。寺院现存明代龙柱等建筑遗存，西侧有摘星台、读书堂古迹，西北为响铃岩，东侧矗立玉柱峰。所在景星岩为仙居八景之一"景星夜月"，建有专门赏月设施。"
 building_type_TK_20_20_NanHuaSi: "寺庙神社"
 building_type_TK_20_20_NanHuaSi_desc: "寺庙神社"
 TK_20_20_NanHuaSi: "南华寺"
 building_TK_20_20_NanHuaSi: "$TK_20_20_NanHuaSi$"
 building_TK_20_20_NanHuaSi_desc: "南华寺，位于广东省韶关市曲江区马坝镇东南郊，南华寺始建于南北朝梁天监元年（502年），后又先后更名为“中兴寺”“法泉寺”。宋开宝元年（968年），宋太祖敕赐“南华禅寺”。南华寺是中国重要佛教古刹，也是禅宗六祖惠能弘扬禅法的发源地。"
 building_type_TK_20_20_DaZhaoSi: "寺庙神社"
 building_type_TK_20_20_DaZhaoSi_desc: "寺庙神社"
 TK_20_20_DaZhaoSi: "大昭寺"
 building_TK_20_20_DaZhaoSi: "$TK_20_20_DaZhaoSi$"
 building_TK_20_20_DaZhaoSi_desc: "昭寺是藏传佛教的圣地，也是拉萨老城区的核心，我来给你介绍一下它的基本情况。它位于拉萨市城关区八廓西街2号，始建于公元647年，由藏王松赞干布为纪念文成公主入藏而建，距今已有1300多年历史。寺内供奉着文成公主带来的释迦牟尼12岁等身像，是无数信徒心中的朝圣终点。"
 building_type_TK_20_21_ChangAnCheng: "文化古城"
 building_type_TK_20_21_ChangAnCheng_desc: "文化古城"
 TK_20_21_ChangAnCheng: "长安城"
 building_TK_20_21_ChangAnCheng: "$TK_20_21_ChangAnCheng$"
 building_TK_20_21_ChangAnCheng_desc: "长安城：西安的古称，是中国历史上建都朝代最多、时间最长的都城。作为华夏文明重要发祥地，蓝田猿人、半坡遗址及杨官寨遗址等印证了早期人类活动。周、秦、汉、隋、唐等13个朝代相继定都于此，其“前朝后市”“坊市分离”等规划理念深刻影响了东亚都城形制。长安是丝绸之路的东方起点，唐代时成为世界最大国际都市，与300多个国家地区交往。"
 building_type_TK_20_21_LuoYangCheng: "文化古城"
 building_type_TK_20_21_LuoYangCheng_desc: "文化古城"
 TK_20_21_LuoYangCheng: "洛阳城"
 building_TK_20_21_LuoYangCheng: "$TK_20_21_LuoYangCheng$"
 building_TK_20_21_LuoYangCheng_desc: "洛阳城：居天下之中，因地处洛水之阳而得名，有5000多年文明史、4000多年建城史、1500多年建都史，是华夏文明的重要发源地、炎黄二帝的诞生地、汉字的发源地 、丝绸之路的东方起点、隋唐大运河的中心、儒释道三教祖庭，先后有夏、商、西周、东周、东汉、曹魏、西晋、北魏、隋、唐（含武周）、后梁、后唐、后晋等13个王朝定都于此，是中国建都时间最早、定都朝代最多、历时最长的城市，被誉为“中华第一古都”、“世界四大圣城”之一 ，也是中国唯一被联合国授予“世界文化名城”荣誉的城市，世界古都论坛永久会址。"
 building_type_TK_20_21_ZiJinCheng: "文化古城"
 building_type_TK_20_21_ZiJinCheng_desc: "文化古城"
 TK_20_21_ZiJinCheng: "紫禁城"
 building_TK_20_21_ZiJinCheng: "$TK_20_21_ZiJinCheng$"
 building_TK_20_21_ZiJinCheng_desc: "北京故宫，位于中国北京市，是明清两代的皇家宫殿，旧称紫禁城，位于北京中轴线的中心。故宫于明永乐四年（1406年）开始建设，以南京故宫为蓝本营建，到永乐十八年（1420年）建成，成为明清两朝二十四位皇帝的皇宫。民国十四年（1925年）10月10日，故宫博物院正式成立开幕。北京故宫南北长961米，东西宽753米，四面围有高10米的城墙，城外有宽52米的护城河。故宫有四座城门，南面为午门，北面为神武门，东面为东华门，西面为西华门。城墙的四角各有一座风姿绰约的角楼，民间有九梁十八柱七十二条脊之说，形容其结构的复杂。"
 building_type_TK_20_21_JinGuanCheng: "文化古城"
 building_type_TK_20_21_JinGuanCheng_desc: "文化古城"
 TK_20_21_JinGuanCheng: "锦官城"
 building_TK_20_21_JinGuanCheng: "$TK_20_21_JinGuanCheng$"
 building_TK_20_21_JinGuanCheng_desc: "锦官城即成都城，为古蜀文明的重要发源地，有着世界罕见的3500年建城，2500年城名不改的历史特征。早在距今约4500年至3700年以前，成都平原已出现被后世称为“宝墩文化”的一系列古蜀先民聚落中心。前316年秦灭蜀始设蜀郡并成都县，为蜀郡治所。前311年修筑大城和少城，被后世公认为是有文献记载的成都建城标志。此后，蜀郡守李冰主持修建都江堰水利工程，使成都平原成为 “天府之国” ，成都成为西南地区的经济、政治、文化中心。"
 building_type_TK_20_21_GuSuCheng: "文化古城"
 building_type_TK_20_21_GuSuCheng_desc: "文化古城"
 TK_20_21_GuSuCheng: "姑苏城"
 building_TK_20_21_GuSuCheng: "$TK_20_21_GuSuCheng$"
 building_TK_20_21_GuSuCheng_desc: "姑苏城，即今江苏省苏州市，古称吴，简称苏，别称姑苏、平江等，是中国重要的历史文化名城。地处长江三角洲中部、太湖东岸，属江南水乡，水网密布，素有“人间天堂”美誉。建城史可追溯至春秋时期（公元前514年），距今逾2500年，为吴文化发祥地。城内古典园林（如拙政园、留园）为世界文化遗产，昆曲、评弹等非物质文化遗产闻名遐迩。"
 building_type_TK_20_21_YangZhouCheng: "文化古城"
 building_type_TK_20_21_YangZhouCheng_desc: "文化古城"
 TK_20_21_YangZhouCheng: "扬州城"
 building_TK_20_21_YangZhouCheng: "$TK_20_21_YangZhouCheng$"
 building_TK_20_21_YangZhouCheng_desc: "扬州城，江苏省扬州市主城区，位于长江北岸、京杭大运河与长江交汇处，总面积6591平方千米，该城始建于春秋时期吴国所筑邗城，公元前319年楚建广陵城。隋开皇九年（589年）定名扬州，唐代形成子城与罗城双城格局，成为漕运枢纽；北宋商税年入八万贯居全国前列，明清新旧城并行，1916年拆除城际隔墙。小秦淮河为明清新旧城分界，现存11座古桥中半数属明清遗存。"
 building_type_TK_20_21_JingZhouCheng: "文化古城"
 building_type_TK_20_21_JingZhouCheng_desc: "文化古城"
 TK_20_21_JingZhouCheng: "荆州城"
 building_TK_20_21_JingZhouCheng: "$TK_20_21_JingZhouCheng$"
 building_TK_20_21_JingZhouCheng_desc: "荆州城，古称江陵，位于湖北省中南部长江中游江汉平原腹地，东连吴越，西通巴蜀，南临长江，北接汉水，是连东西贯南北的交通要塞，现为荆州市主城区。荆州城历史悠久，早在公元前689年楚文王迁都郢(今荆州城北5公里的纪南城)后，这里就是楚国的官船码头。而自楚文王定都郢始，先后有6个朝代34位帝王在此建都，是荆楚文化的发祥地，也是著名的三国古战场。"
 building_type_TK_20_21_ShiTouCheng: "文化古城"
 building_type_TK_20_21_ShiTouCheng_desc: "文化古城"
 TK_20_21_ShiTouCheng: "石头城"
 building_TK_20_21_ShiTouCheng: "$TK_20_21_ShiTouCheng$"
 building_TK_20_21_ShiTouCheng_desc: "石头城被称为石城，广义上它是如今南京的别称，狭义上它是指南京老城城西的石头山或石城山，位于南京市鼓楼区，是一处六朝时期的著名遗迹。遗址位于现清凉山一带，有“东吴第一军事要塞”之称，筑于楚威王七年（前333年）。东汉建安十六年（211年），东吴孙权迁至秣陵（今南京），在石头山金陵邑原址筑城，取名石头城。它扼守秦淮河与长江的交汇口，“因山以为城，因江以为池，地形险固，尤有奇势”，是保障首都建康城西部安全的军事重镇，也是兵家必争之地，素有“石城虎踞”之称。"
 building_type_TK_20_21_KaiFengHuangCheng: "文化古城"
 building_type_TK_20_21_KaiFengHuangCheng_desc: "文化古城"
 TK_20_21_KaiFengHuangCheng: "开封皇城"
 building_TK_20_21_KaiFengHuangCheng: "$TK_20_21_KaiFengHuangCheng$"
 building_TK_20_21_KaiFengHuangCheng_desc: "开封皇城：北宋建隆元年（960年），宋朝定都开封，史称东京城，历经九代帝王168年，形成由外城、内城、皇城三座城池相套的宏大城郭。据史记载：北宋后期，东京外城周长50里165步，高4丈，宽5丈9尺，居住人口达150余万。"
 building_type_TK_20_21_LinAnHuangCheng: "文化古城"
 building_type_TK_20_21_LinAnHuangCheng_desc: "文化古城"
 TK_20_21_LinAnHuangCheng: "临安皇城"
 building_TK_20_21_LinAnHuangCheng: "$TK_20_21_LinAnHuangCheng$"
 building_TK_20_21_LinAnHuangCheng_desc: "临安皇城即指南宋临安宫城，又称南宋皇宫、南宋故宫，俗称“南内”或“大内”，位于浙江省杭州市凤凰山东麓，占地面积约50万至60万平方米，为南宋都城皇宫所在。其以隋唐州治及吴越国子城为基础扩建，宋高宗赵构定都杭州后，在凤凰山东麓营建宫城禁苑，设丽正门、和宁门、东华门三座城门，内分朝会区、后寝区、后苑区等六大功能区。正殿大庆殿兼具大典、科举策试等多重功能，垂拱殿用于日常政务，集英殿举行科举策试，部分殿宇通过更换牌匾实现功能转换。"
 building_type_TK_20_21_PingYaoGuCheng: "文化古城"
 building_type_TK_20_21_PingYaoGuCheng_desc: "文化古城"
 TK_20_21_PingYaoGuCheng: "平遥古城"
 building_TK_20_21_PingYaoGuCheng: "$TK_20_21_PingYaoGuCheng$"
 building_TK_20_21_PingYaoGuCheng_desc: "平遥古城始建于西周宣王时期（前827年—前782年），于明代洪武三年（1370年）重建、扩修城池，是现今中国境内保存最为完整的一座古代县城，整座城池宛如乌龟向南爬行，因此有“龟城”之称。"
 building_type_TK_20_21_FengDuGuiCheng: "文化古城"
 building_type_TK_20_21_FengDuGuiCheng_desc: "文化古城"
 TK_20_21_FengDuGuiCheng: "丰都鬼城"
 building_TK_20_21_FengDuGuiCheng: "$TK_20_21_FengDuGuiCheng$"
 building_TK_20_21_FengDuGuiCheng_desc: "丰都鬼城旧名酆都鬼城，古为“巴子别都”，东汉和帝永元二年置县，已有近2000年的历史，位于重庆市下游丰都县的长江北岸，与丰都新县城隔江相望。"
 building_type_TK_20_21_LouLanGuGuo: "文化古城"
 building_type_TK_20_21_LouLanGuGuo_desc: "文化古城"
 TK_20_21_LouLanGuGuo: "楼兰古国"
 building_TK_20_21_LouLanGuGuo: "$TK_20_21_LouLanGuGuo$"
 building_TK_20_21_LouLanGuGuo_desc: "楼兰古国是古丝绸之路上的一个小国，位于罗布泊西部，处于西域的枢纽，在古代丝绸之路上占有极为重要的地位。楼兰古国在公元前176年前建国，公元630年却突然神秘消失，共持续800多年的历史，现今只留下了一片废墟遗迹。"
 building_type_TK_20_21_JingJueGuCheng: "文化古城"
 building_type_TK_20_21_JingJueGuCheng_desc: "文化古城"
 TK_20_21_JingJueGuCheng: "精绝古城"
 building_TK_20_21_JingJueGuCheng: "$TK_20_21_JingJueGuCheng$"
 building_TK_20_21_JingJueGuCheng_desc: "精绝古城是西汉时期西域地区一个比较小的城邦国家的都城。精绝国位于尼雅河畔的一处绿洲之上，西域36国之一。精绝国以农业为主，是丝绸之路的必经之地，商贾云集，繁华富庶。东汉后期被鄯善国兼并，后受魏晋王朝节制。唐朝时其都城尚存，称尼壤城，清代称为尼雅城。"
 building_type_TK_20_21_GaoChangGuCheng: "文化古城"
 building_type_TK_20_21_GaoChangGuCheng_desc: "文化古城"
 TK_20_21_GaoChangGuCheng: "高昌故城"
 building_TK_20_21_GaoChangGuCheng: "$TK_20_21_GaoChangGuCheng$"
 building_TK_20_21_GaoChangGuCheng_desc: "高昌故城是西汉至元明时期（公元前1世纪—公元14世纪）吐鲁番盆地中心城镇，历经西汉高昌壁、高昌郡、高昌国、唐代西州和高昌回鹘等时期，时间跨度长达1400年左右，高昌故城在13世纪末的战乱中废弃，大部分建筑物消失无存。"
 building_type_TK_20_21_GeShengGuCheng: "文化古城"
 building_type_TK_20_21_GeShengGuCheng_desc: "文化古城"
 TK_20_21_GeShengGuCheng: "纥升骨城"
 building_TK_20_21_GeShengGuCheng: "$TK_20_21_GeShengGuCheng$"
 building_TK_20_21_GeShengGuCheng_desc: "纥升骨城：高句丽开国君主高朱蒙自夫余避祸南逃，于西汉初年年在卒本川建国称王，筑纥升骨城，作为王都。纥升骨城，学术界大都认为高句骊在此定都历时40年。"
 building_type_TK_20_21_MingTiePeiGuCheng: "文化古城"
 building_type_TK_20_21_MingTiePeiGuCheng_desc: "文化古城"
 TK_20_21_MingTiePeiGuCheng: "明铁佩古城"
 building_TK_20_21_MingTiePeiGuCheng: "$TK_20_21_MingTiePeiGuCheng$"
 building_TK_20_21_MingTiePeiGuCheng_desc: "明铁佩古城作为公元前后费尔干纳盆地内面积最大的古城，明铁佩古城不仅有功能完善的城墙、城门、马面等城防设施，城内外也有规模宏大的大型建筑和道路系统，还有建筑格局清晰、功能完备的手工业作坊，而城外发现的墓葬区则进一步扩大了古城的文化内涵。"
 building_type_TK_20_21_AiLaoGuGuo: "文化古城"
 building_type_TK_20_21_AiLaoGuGuo_desc: "文化古城"
 TK_20_21_AiLaoGuGuo: "哀牢古国"
 building_TK_20_21_AiLaoGuGuo: "$TK_20_21_AiLaoGuGuo$"
 building_TK_20_21_AiLaoGuGuo_desc: "哀牢古国：是一个存在于3000多年前的古国，诞生于3000多年前新石器时代末期的沧怒女神沙壹，在“创世”哀牢王“九隆”之后，滇西澜沧江和怒江流域中的九隆族人遂以“十男娶十女”的方式迅速繁衍和强盛起来。从公元前109年西汉设治不韦县到公元69年东汉“柳貌归汉”时，共有178年的时间是汉朝不韦县与古代哀牢国在滇西地区同时期并存的历史阶段。"
 building_type_TK_20_21_WuGeKu: "文化古城"
 building_type_TK_20_21_WuGeKu_desc: "文化古城"
 TK_20_21_WuGeKu: "吴哥窟"
 building_TK_20_21_WuGeKu: "$TK_20_21_WuGeKu$"
 building_TK_20_21_WuGeKu_desc: "吴哥窟意思为“毗湿奴的神殿”，中国佛学古籍称之为“桑香佛舍”。吴哥于公元9至15世纪高棉王国将吴哥通王城作为都城，辉煌一时；始建于1113-1150年的吴哥窟寺，是苏利耶跋摩二世的骨灰埋葬地，后逐渐发展为吴哥王朝的国寺。15世纪，吴哥王朝衰败后，这些古迹群淹没于茫茫丛林，直到1861年被法国人发现后，才重现世人面前，并被视为东方四大奇迹之一。"
 building_type_TK_20_21_GongShanCheng: "文化古城"
 building_type_TK_20_21_GongShanCheng_desc: "文化古城"
 TK_20_21_GongShanCheng: "公山城"
 building_TK_20_21_GongShanCheng: "$TK_20_21_GongShanCheng$"
 building_TK_20_21_GongShanCheng_desc: "公山城位于韩国忠清南道公州市，是百济时期（234-678年）建造的山城遗址，城墙最初为土城结构，后扩建为石城。公山城曾为百济王朝都城（475-538年），城内保留镇南楼、临流阁等景观，现存城郭沿锦江蜿蜒而建，沿途散布荷花池、玉女峰等遗迹。"
 building_type_TK_20_21_PingAnJing: "文化古城"
 building_type_TK_20_21_PingAnJing_desc: "文化古城"
 TK_20_21_PingAnJing: "平安京"
 building_TK_20_21_PingAnJing: "$TK_20_21_PingAnJing$"
 building_TK_20_21_PingAnJing_desc: "平安京别名洛阳、京洛，是日本京都的古称，位于日本本州岛中西部京都盆地北部。794年桓武天皇迁都至此，作为日本首都直至1868年，城市布局效仿隋唐长安和洛阳，以朱雀大路为轴，分东西二京（左京称洛阳，右京称长安），街道呈棋盘形。作为政治、经济和文化中心约1200年，平安京留下了许多寺院和神社，包括清水寺、二条城等世界文化遗产。"
 building_type_TK_20_21_ShengLongHuangCheng01: "文化古城"
 building_type_TK_20_21_ShengLongHuangCheng01_desc: "文化古城"
 TK_20_21_ShengLongHuangCheng01: "升龙城"
 building_TK_20_21_ShengLongHuangCheng01: "$TK_20_21_ShengLongHuangCheng01$"
 building_TK_20_21_ShengLongHuangCheng01_desc: "升龙城：始建于621年，初名紫城，唐代改称宋平，886年扩建为大罗城。位于越南首都河内市，皇城遗迹展现了7至19世纪的历史文化层叠，包括升龙前期至河内时期的建筑痕迹与文物，集中体现了雕刻艺术、城市规划技术和造景艺术的独特价值。考古发现涉及地基、砖墙、排水系统、“御河”等遗迹，以及素砖、花砖、陶瓷、铜钱等器物，其中包含越南本土及中国、日本、中东等地文物。"
 building_type_TK_20_21_ShengLongHuangCheng02: "文化古城"
 building_type_TK_20_21_ShengLongHuangCheng02_desc: "文化古城"
 TK_20_21_ShengLongHuangCheng02: "升龙皇城"
 building_TK_20_21_ShengLongHuangCheng02: "$TK_20_21_ShengLongHuangCheng02$"
 building_TK_20_21_ShengLongHuangCheng02_desc: "升龙皇城：始建于621年，初名紫城，唐代改称宋平，886年扩建为大罗城。位于越南首都河内市，皇城遗迹展现了7至19世纪的历史文化层叠，包括升龙前期至河内时期的建筑痕迹与文物，集中体现了雕刻艺术、城市规划技术和造景艺术的独特价值。考古发现涉及地基、砖墙、排水系统、“御河”等遗迹，以及素砖、花砖、陶瓷、铜钱等器物，其中包含越南本土及中国、日本、中东等地文物。"
 building_type_TK_20_22_DaWenKouYiZhi: "村落遗址"
 building_type_TK_20_22_DaWenKouYiZhi_desc: "村落遗址"
 TK_20_22_DaWenKouYiZhi: "大汶口遗址"
 building_TK_20_22_DaWenKouYiZhi: "$TK_20_22_DaWenKouYiZhi$"
 building_TK_20_22_DaWenKouYiZhi_desc: "大汶口遗址是约6100—4600年前的新石器时代晚期父系氏族遗址，是新石器时代氏族公共墓地，于1959年首次发现并挖掘。"
 building_type_TK_20_22_BanPoYiZhi: "村落遗址"
 building_type_TK_20_22_BanPoYiZhi_desc: "村落遗址"
 TK_20_22_BanPoYiZhi: "半坡遗址"
 building_TK_20_22_BanPoYiZhi: "$TK_20_22_BanPoYiZhi$"
 building_TK_20_22_BanPoYiZhi_desc: "半坡遗址是黄河流域一个典型的母系氏族公社村落遗址，属仰韶文化的一种早期类型，距今约6000年。"
 building_type_TK_20_22_HeMuDuYiZhi: "村落遗址"
 building_type_TK_20_22_HeMuDuYiZhi_desc: "村落遗址"
 TK_20_22_HeMuDuYiZhi: "河姆渡遗址"
 building_TK_20_22_HeMuDuYiZhi: "$TK_20_22_HeMuDuYiZhi$"
 building_TK_20_22_HeMuDuYiZhi_desc: "河姆渡遗址位于浙江省宁波市余姚市河姆渡镇河姆渡村的东北，是中国南方早期新石器时代（约7000—5000年前）遗址。"
 building_type_TK_20_22_ShiGangPingYuan: "村落遗址"
 building_type_TK_20_22_ShiGangPingYuan_desc: "村落遗址"
 TK_20_22_ShiGangPingYuan: "石缸平原"
 building_TK_20_22_ShiGangPingYuan: "$TK_20_22_ShiGangPingYuan$"
 building_TK_20_22_ShiGangPingYuan_desc: "石缸平原又译为查尔平原、石缸阵，官方名称为川圹巨石缸遗址——石缸平原，位于老挝川圹省查尔平原。"查尔"在老挝语中意为"石缸"，该名称源自平原上分布的大量石缸。遗址由15个部分组成，现存多个整石雕凿而成的巨型石缸，重量不等。"
 building_type_TK_20_23_BaiLuDongShuYuan: "书院大学"
 building_type_TK_20_23_BaiLuDongShuYuan_desc: "书院大学"
 TK_20_23_BaiLuDongShuYuan: "白鹿洞书院"
 building_TK_20_23_BaiLuDongShuYuan: "$TK_20_23_BaiLuDongShuYuan$"
 building_TK_20_23_BaiLuDongShuYuan_desc: "白鹿洞书院，位于江西省九江市庐山市五老峰南麓，始建于唐代宝历年间，李渤兄弟隐居读书时驯养白鹿，故得名。南宋淳熙六年（1179年）朱熹主持修复，增设建筑并制定《白鹿洞书院揭示》，确立讲学规制。"
 building_type_TK_20_23_ShiGuShuYuan: "书院大学"
 building_type_TK_20_23_ShiGuShuYuan_desc: "书院大学"
 TK_20_23_ShiGuShuYuan: "石鼓书院"
 building_TK_20_23_ShiGuShuYuan: "$TK_20_23_ShiGuShuYuan$"
 building_TK_20_23_ShiGuShuYuan_desc: "石鼓书院，位于湖南省衡阳市石鼓区潇湘街道湘江北路69号，地处衡阳市城北蒸、湘、耒三水汇聚的石鼓山上，始建于唐元和五年（810年），是湖湘文化重要发源地之一，明徐霞客赞誉称“石鼓书院兼具滕王阁、黄鹤楼名胜之优越”；石鼓书院是中国宋代四大书院之一，有学者将其与长沙岳麓书院、江西白鹿洞书院、河南应天书院、嵩阳书院相提并论。素有“衡湘洙泗”“道南正脉”之誉。"
 building_type_TK_20_23_CuLaiShuYuan: "书院大学"
 building_type_TK_20_23_CuLaiShuYuan_desc: "书院大学"
 TK_20_23_CuLaiShuYuan: "徂徕书院"
 building_TK_20_23_CuLaiShuYuan: "$TK_20_23_CuLaiShuYuan$"
 building_TK_20_23_CuLaiShuYuan_desc: "徂徕书院是北宋四大书院之一，为北宋时期创办的私立学院，位于中国山东徂徕山。南宋宰相范成大在《骖鸾录》中首次提出古代四大书院之说。书院由孙复和石介创建，石介于宋宝元元年（1038年）至康定元年（1040年）在长春岭建徂徕书院。它是山东境内最早、最著名的书院，开启了宋代古文运动的序幕，并形成了泰山学派。"
 building_type_TK_20_23_LiZeShuYuan: "书院大学"
 building_type_TK_20_23_LiZeShuYuan_desc: "书院大学"
 TK_20_23_LiZeShuYuan: "丽泽书院"
 building_TK_20_23_LiZeShuYuan: "$TK_20_23_LiZeShuYuan$"
 building_TK_20_23_LiZeShuYuan_desc: "丽泽书院为南宋著名思想家、史学家、文学家、教育家吕祖谦（1137-1181，金华人）讲学会友之所，设于宋乾道初（约1165-1166）。“其地在光孝观侧（清金华县学后，今市内一览亭东北），四方学者皆受业于此”（宋·楼钥《东莱吕太史祠堂记》）。因屋前临二湖，故取堂名为“丽泽”，人称“丽泽书堂”。"
 building_type_TK_20_23_MaoShanShuYuan: "书院大学"
 building_type_TK_20_23_MaoShanShuYuan_desc: "书院大学"
 TK_20_23_MaoShanShuYuan: "茅山书院"
 building_TK_20_23_MaoShanShuYuan: "$TK_20_23_MaoShanShuYuan$"
 building_TK_20_23_MaoShanShuYuan_desc: "茅山书院，又名金山书院，由句容人处士侯遗创建于北宋天圣二年(1024)，地点位于江苏金坛的茅山，是北宋六大书院之一。现已无存宋仁宗时处士侯遗所建，院址在江宁府三茅山后侧，故称茅山书院。侯氏在此教授生徒十余年。仁宗天圣二年（1024年），经江宁知府王随奏请，朝廷赐给田亩，充书院经费。南宋咸淳七年（1271年），迁至金坛县顾龙山之麓。"
 building_type_TK_20_23_JiXiaXueGong: "书院大学"
 building_type_TK_20_23_JiXiaXueGong_desc: "书院大学"
 TK_20_23_JiXiaXueGong: "稷下学宫"
 building_TK_20_23_JiXiaXueGong: "$TK_20_23_JiXiaXueGong$"
 building_TK_20_23_JiXiaXueGong_desc: "稷下学宫是战国时期齐国的高等学府，因设于都城临淄（今山东省淄博市临淄区）的稷门附近而得名。稷下学宫汇聚道家、儒家、法家等多个学派，会定期举行学术聚会，围绕白马非马等议题展开辩论。同时，稷下学宫的游学者众多，他们被统称为学士，其中资历较深者被称为先生，受到特别推崇的则被称为老师。学士们受到齐王厚待，淳于髡等名士被封为上大夫，得赐高门大宅作为居所。他们虽不担任具体官职，却可议论政事，向君王献策；并且还著书立说，论述国家治理之道，许多论作被汇编在《管子》一书中。"
 building_type_TK_20_23_JiXianShuYuan: "书院大学"
 building_type_TK_20_23_JiXianShuYuan_desc: "书院大学"
 TK_20_23_JiXianShuYuan: "集贤书院"
 building_TK_20_23_JiXianShuYuan: "$TK_20_23_JiXianShuYuan$"
 building_TK_20_23_JiXianShuYuan_desc: "集贤书院又名丽正书院，位于唐东都洛阳紫微城，是中国最早的官办书院，由唐玄宗创立于开元五年（公元717年），作为官方的修书机构，其首要任务是搜书、校书、藏书，是中国第一书院。开元十三年（公元725年），改称为集贤殿书院，简称“集贤书院”。"
 building_type_TK_20_23_NiShanShuYuan: "书院大学"
 building_type_TK_20_23_NiShanShuYuan_desc: "书院大学"
 TK_20_23_NiShanShuYuan: "尼山书院"
 building_TK_20_23_NiShanShuYuan: "$TK_20_23_NiShanShuYuan$"
 building_TK_20_23_NiShanShuYuan_desc: "尼山孔庙和书院，位于山东省济宁市曲阜市东南约28千米处的尼山东麓，是明代至清代时期的建筑遗存。宋庆历三年（1043年），尼山孔庙发展成为授徒讲学的地方；元至元二年（1336年），中书左丞王懋德奏请在尼山创建书院，并保举彭璠为山长，创建尼山书院。此时的尼山孔庙已公开称为尼山书院，完全具备了祭祀和教育两种功能，成为真正意义上的庙学合一。"
 building_type_TK_20_23_SongYangShuYuan: "书院大学"
 building_type_TK_20_23_SongYangShuYuan_desc: "书院大学"
 TK_20_23_SongYangShuYuan: "嵩阳书院"
 building_TK_20_23_SongYangShuYuan: "$TK_20_23_SongYangShuYuan$"
 building_TK_20_23_SongYangShuYuan_desc: "嵩阳书院，是中国古代高等学府，位于河南省郑州市登封市区北3千米峻极峰下。始建于北魏太和八年（484年），初名嵩阳寺，为佛教寺院。宋景祐二年（1035年）重修太室书院时赐名嵩阳书院，并设院长掌理院务。嵩阳书院为宋代程朱理学的发源地之一。其建筑风格是研究中国古代书院建筑、教育制度以及儒家文化的“标本”。"
 building_type_TK_20_23_YuLuShuYuan: "书院大学"
 building_type_TK_20_23_YuLuShuYuan_desc: "书院大学"
 TK_20_23_YuLuShuYuan: "岳麓书院"
 building_TK_20_23_YuLuShuYuan: "$TK_20_23_YuLuShuYuan$"
 building_TK_20_23_YuLuShuYuan_desc: "岳麓书院是中国历史上赫赫闻名的四大书院之一，位于中国历史文化名城湖南长沙湘江西岸的岳麓山脚下，是世界上最古老的学府之一。北宋开宝九年（976年），潭州太守朱洞在僧人办学的基础上，由官府捐资兴建，正式创立岳麓书院。"
 building_type_TK_20_23_YingTianShuYuan: "书院大学"
 building_type_TK_20_23_YingTianShuYuan_desc: "书院大学"
 TK_20_23_YingTianShuYuan: "应天书院"
 building_TK_20_23_YingTianShuYuan: "$TK_20_23_YingTianShuYuan$"
 building_TK_20_23_YingTianShuYuan_desc: "应天府书院，又称应天书院、睢阳书院、南京书院、南都书院、南京国子监，位于河南省商丘市睢阳区商丘古城南湖畔，是中国古代四大书院之一，后晋天福年间（936-947年）杨悫私人创办睢阳学舍，至大中祥符二年（1009年），经扩建获赐"应天府书院"，史载“州郡置学始于此”。"
 building_type_TK_20_23_AnDingShuYuan: "书院大学"
 building_type_TK_20_23_AnDingShuYuan_desc: "书院大学"
 TK_20_23_AnDingShuYuan: "安定书院"
 building_TK_20_23_AnDingShuYuan: "$TK_20_23_AnDingShuYuan$"
 building_TK_20_23_AnDingShuYuan_desc: "安定书院位于江苏省泰州市迎春西路泰州中学校园内，始建于南宋宝庆二年（1226年），由泰州知州陈垓在北宋教育家胡瑗讲学旧址创建，是江苏省最古老的书院之一。胡瑗为北宋理学先驱，在此确立“明体达用”教育思想，首创分科教学法，其讲学旧址现存千年银杏一株。"
 building_type_TK_20_23_WanSongShuYuan: "书院大学"
 building_type_TK_20_23_WanSongShuYuan_desc: "书院大学"
 TK_20_23_WanSongShuYuan: "万松书院"
 building_TK_20_23_WanSongShuYuan: "$TK_20_23_WanSongShuYuan$"
 building_TK_20_23_WanSongShuYuan_desc: "万松书院位于杭州市凤凰山北万松岭，三面环山，一面环水，其前身为唐贞元年间（785—804年）所建报恩寺。明弘治十一年（1498年），浙江右参政周木在报恩寺旧址改建万松书院，聘请孔氏南宗后裔孔衢、孔绩主持院务，曾名太和书院、敷文书院，是明清时期杭州规模最大、历时最久的书院。"
 building_type_TK_20_23_EHuShuYuan: "书院大学"
 building_type_TK_20_23_EHuShuYuan_desc: "书院大学"
 TK_20_23_EHuShuYuan: "鹅湖书院"
 building_TK_20_23_EHuShuYuan: "$TK_20_23_EHuShuYuan$"
 building_TK_20_23_EHuShuYuan_desc: "鹅湖书院位于上饶铅山县鹅湖镇鹅湖山麓，为古代江西四大书院之一。宋淳熙二年（1175）朱熹、吕祖谦、陆九龄、陆九渊等会讲鹅湖寺，各持己见，“相与讲其所闻之学”，这就是哲学史上著名的“鹅湖之会”。宋淳祐十年（1250），改名为“文宗书院”。"
 building_type_TK_20_23_LiZhengShuYuan: "书院大学"
 building_type_TK_20_23_LiZhengShuYuan_desc: "书院大学"
 TK_20_23_LiZhengShuYuan: "丽正书院"
 building_TK_20_23_LiZhengShuYuan: "$TK_20_23_LiZhengShuYuan$"
 building_TK_20_23_LiZhengShuYuan_desc: "丽正书院：唐玄宗开元五年（公元717年）于唐东都洛阳创建官方第一书院，随后又于长安创建同名丽正书院的官办学院。"
 building_type_TK_20_24_YangGuangDaJinTa: "标建遗址"
 building_type_TK_20_24_YangGuangDaJinTa_desc: "标建遗址"
 TK_20_24_YangGuangDaJinTa: "仰光大金塔"
 building_TK_20_24_YangGuangDaJinTa: "$TK_20_24_YangGuangDaJinTa$"
 building_TK_20_24_YangGuangDaJinTa_desc: "瑞德宫大金塔又称仰光大金塔，是缅甸仰光的一座标志性佛教佛塔，坐落于茵雅湖畔的圣山上，以其高达98米的金色外观和宏伟规模闻名，是缅甸最神圣的佛塔之一。"
 building_type_TK_20_24_WuHouCi: "标建遗址"
 building_type_TK_20_24_WuHouCi_desc: "标建遗址"
 TK_20_24_WuHouCi: "武侯祠"
 building_TK_20_24_WuHouCi: "$TK_20_24_WuHouCi$"
 building_TK_20_24_WuHouCi_desc: "成都武侯祠博物馆位于四川省成都市武侯区武侯祠大街231号，占地面积15万平方米。 成都武侯祠肇始于魏文帝黄初（222年）三年。是全国唯一一座纪念刘备、诸葛亮、关羽、张飞等蜀汉英雄的君臣合祀祠庙，也是全世界影响最大的三国遗迹博物馆。"
 building_type_TK_20_24_YingXianMuTa: "标建遗址"
 building_type_TK_20_24_YingXianMuTa_desc: "标建遗址"
 TK_20_24_YingXianMuTa: "应县木塔"
 building_TK_20_24_YingXianMuTa: "$TK_20_24_YingXianMuTa$"
 building_TK_20_24_YingXianMuTa_desc: "佛宫寺释迦塔，又称应县木塔，位于山西省朔州市应县佛宫寺内，始建于辽清宁二年（1056年），是世界上现存最高大、最古老纯木结构楼阁式建筑，与意大利比萨斜塔、巴黎埃菲尔铁塔并称“世界三大奇塔”"
 building_type_TK_20_24_ZhaoZhouQiao: "标建遗址"
 building_type_TK_20_24_ZhaoZhouQiao_desc: "标建遗址"
 TK_20_24_ZhaoZhouQiao: "赵州桥"
 building_TK_20_24_ZhaoZhouQiao: "$TK_20_24_ZhaoZhouQiao$"
 building_TK_20_24_ZhaoZhouQiao_desc: "安济桥，是一座位于河北省石家庄市赵县城南洨河之上的石拱桥，因赵县古称赵州又称赵州桥。当地人称之为大石桥，以区别于城西门外的永通桥（小石桥）。安济桥始建于隋代，由匠师李春设计建造，后由宋哲宗赵煦赐名安济桥，并以之为正名。"
 building_type_TK_20_24_FaShiLvGuan: "标建遗址"
 building_type_TK_20_24_FaShiLvGuan_desc: "标建遗址"
 TK_20_24_FaShiLvGuan: "法师旅馆"
 building_TK_20_24_FaShiLvGuan: "$TK_20_24_FaShiLvGuan$"
 building_TK_20_24_FaShiLvGuan_desc: "法师旅馆位于日本石川县栗津温泉，创立于718年，是吉尼斯世界纪录认证的全球现存最古老旅馆。，旅馆的主人以世袭制代代相传，由长子继承家业，到今天法师善五郎已是第46代了。旅馆的仆人以世袭制代代相传，由少女承继家业。其建筑保留传统温泉旅馆特色，设男女露天温泉及74间和风客房，并提供以加贺时令食材烹制的传统料理。"
 building_type_TK_20_24_GuangZhouFanFang: "标建遗址"
 building_type_TK_20_24_GuangZhouFanFang_desc: "标建遗址"
 TK_20_24_GuangZhouFanFang: "广州蕃坊"
 building_TK_20_24_GuangZhouFanFang: "$TK_20_24_GuangZhouFanFang$"
 building_TK_20_24_GuangZhouFanFang_desc: "蕃坊位于广州市越秀区光塔路一带，范围约今中山路以南、人民路以东、大德路以北、解放路以西区域。据传，因唐宋时为外国客商的居住地（粤语称外国人为番人），故名。唐代阿拉伯、波斯商人在此聚居，建有怀圣寺与光塔，其中光塔始建于唐贞观元年（627年），兼具导航灯塔与宗教功能。蕃坊设蕃长管理，由官府任命外侨担任，负责宗教事务与民事纠纷调解。光塔路、玛瑙巷等地名均保留蕃坊印记，普宁巷原名蒲夷人巷，为蒲姓阿拉伯人聚居地。"
 building_type_TK_20_24_DaLiShiKu: "标建遗址"
 building_type_TK_20_24_DaLiShiKu_desc: "标建遗址"
 TK_20_24_DaLiShiKu: "大理三塔"
 building_TK_20_24_DaLiShiKu: "$TK_20_24_DaLiShiKu$"
 building_TK_20_24_DaLiShiKu_desc: "大理三塔又名崇圣寺三塔，位于大理古城西北部1.5公里处，西对苍山应乐峰，东对洱海，距山脚约为1500米。南336米处有桃溪向东流过。北76米处有梅溪，东靠滇藏公路。三塔由一大二小组成。大塔名千寻塔，始建于南诏劝丰佑时期（公元823年～859年），为16级方形密檐式空心砖塔，属典型的唐代建筑风格，塔高69.13米。南北两座小塔外观轮廓线为锥形，是典型的宋代建筑风格，建造于大理国段正严、段正兴时期（公元1108～1172年），两小塔相距97米，皆高42.19米，是一对10级八角形密檐式砖塔。三座塔鼎足而立，千寻塔居中，二小塔南北拱卫。1977年维修过程中于千寻塔内清理出南诏、大理时期文物600余件，包含佛像、写本佛经及刻字铜片等。"
 building_type_TK_20_24_CangZhouTieShiZi: "标建遗址"
 building_type_TK_20_24_CangZhouTieShiZi_desc: "标建遗址"
 TK_20_24_CangZhouTieShiZi: "沧州铁狮子"
 building_TK_20_24_CangZhouTieShiZi: "$TK_20_24_CangZhouTieShiZi$"
 building_TK_20_24_CangZhouTieShiZi_desc: "沧州铁狮子又称镇海吼，位于河北省沧州市沧县旧州镇东关村23号，始建于后周广顺三年（953年）。沧州铁狮子身高5.78米，长5.34米，宽3.17米，体重约40吨。头顶及项下各铸有“狮子王”，腹腔内满铸有《金刚经》文，但因年代久远，字迹多漫灭不全。右项及边皆铸有“大周广顺三年精造”字样，右肋有“山东李云造”5个字。背负巨盆，面南尾北，昂首挺胸，巨口大张，四肢呈行走态。沧州铁狮子是中国现存年代最久、形体最大的铸铁狮子，充分显示了古代工匠的智慧和巨大的创造力，采用泥范明浇法铸造，在世界冶金史上占有重要地位，以及具有里程碑的意义，显示了中国古代铸造工艺的高度成就，是研究中国古代铸造技术的重要实物资料，同时也是研究当时社会生产力发展水平和佛教的重要实物资料。"
 building_type_TK_20_24_YueYangLou: "标建遗址"
 building_type_TK_20_24_YueYangLou_desc: "标建遗址"
 TK_20_24_YueYangLou: "岳阳楼"
 building_TK_20_24_YueYangLou: "$TK_20_24_YueYangLou$"
 building_TK_20_24_YueYangLou_desc: "岳阳楼，位于湖南省岳阳市的西门城头、紧靠洞庭湖畔，总高19.42米，进深14.54米，宽17.42米。始建于三国东吴（229年—280年）时期。岳阳楼因唐代诗人杜甫和孟浩然的诗句而著称于世，被誉为“洞庭天下水，岳阳天下楼”。现存岳阳楼则是于1984年5月1日重修后所建。"
 building_type_TK_20_24_HuangHeLou: "标建遗址"
 building_type_TK_20_24_HuangHeLou_desc: "标建遗址"
 TK_20_24_HuangHeLou: "黄鹤楼"
 building_TK_20_24_HuangHeLou: "$TK_20_24_HuangHeLou$"
 building_TK_20_24_HuangHeLou_desc: "黄鹤楼，位于湖北省武汉市武昌区蛇山之巅，通高51.4米，底层边宽30米，顶层边宽18米。始建于三国时期吴黄武二年（223年）。黄鹤楼因唐代诗人李白和崔颢的千古绝句名扬四海，享有“天下江山第一楼“和“天下绝景”之称。现存黄鹤楼则是于1985年6月重修后所建。"
 building_type_TK_20_24_TengWangGe: "标建遗址"
 building_type_TK_20_24_TengWangGe_desc: "标建遗址"
 TK_20_24_TengWangGe: "滕王阁"
 building_TK_20_24_TengWangGe: "$TK_20_24_TengWangGe$"
 building_TK_20_24_TengWangGe_desc: "滕王阁，位于江西省南昌市东湖区西北部沿江路赣江东岸，主体建筑净高57.5米，建筑面积13000平方米。始建于唐永徽四年（653年）。因由滕王李元婴任洪州都督时修建，故称滕王阁，属于中国古代皇家歌舞楼阁，后因初唐四杰之首才子王勃的《滕王阁序》中的经典名句而名扬天下，被誉为“西江第一楼”，现存滕王阁则是于1989年10月8日重修后所建。"
 building_type_TK_20_24_PengLaiGe: "标建遗址"
 building_type_TK_20_24_PengLaiGe_desc: "标建遗址"
 TK_20_24_PengLaiGe: "蓬莱阁"
 building_TK_20_24_PengLaiGe: "$TK_20_24_PengLaiGe$"
 building_TK_20_24_PengLaiGe_desc: "蓬莱阁，位于山东省烟台市蓬莱区迎宾路7号蓬莱水城景区内，地处丹崖山上，始建于北宋嘉祐六年（1061年），历代屡加修葺，没有经过重建，至今仍保持北宋原貌；因“八仙过海”传说和“海市蜃楼”奇观而闻名四海，“蓬莱十大景”中有八景位于蓬莱阁；自古有“人间仙境”之美誉，与湖南岳阳岳阳楼、江西南昌滕王阁、湖北武汉黄鹤楼并称为“中国四大名楼”、是“中国十大历史文化名楼”之一，世称“江北第一阁”。"
 building_type_TK_20_24_GuanQueLou: "标建遗址"
 building_type_TK_20_24_GuanQueLou_desc: "标建遗址"
 TK_20_24_GuanQueLou: "鹳雀楼"
 building_TK_20_24_GuanQueLou: "$TK_20_24_GuanQueLou$"
 building_TK_20_24_GuanQueLou_desc: "鹳雀楼，又名鹳鹊楼，因时有鹳雀栖其上而得名，位于晋秦豫三省交界的山西永济蒲州古城西郊外的黄河岸畔。唐代诗人王之涣的一首《登鹳雀楼》“白日依山尽，黄河入海流。欲穷千里目，更上一层楼。”使其名扬天下声播四海，为黄河流域的标志性建筑。鹳雀楼始建于北周时期，大约在公元557－581年，由北周大将军宇文护建造，为一座军事戍楼，历唐经宋存世约七百余年，于元朝初年毁于战火，直到1997年得以第一次重修，于2002年9月正式对游人开放。"
 building_type_TK_20_30_MingTiaoZhiZhan: "古战场"
 building_type_TK_20_30_MingTiaoZhiZhan_desc: "古战场"
 TK_20_30_MingTiaoZhiZhan: "鸣条之战"
 building_TK_20_30_MingTiaoZhiZhan: "$TK_20_30_MingTiaoZhiZhan$"
 building_TK_20_30_MingTiaoZhiZhan_desc: "鸣条之战是夏朝末年（约公元前1600年）在商灭夏的战争中，商汤率领商部落士兵与夏军在鸣条进行的一场决战。战争的结果导致夏王朝灭亡，商汤建立了中国的第二个王朝——商朝。"
 building_type_TK_20_30_MuYeZhiZhan: "古战场"
 building_type_TK_20_30_MuYeZhiZhan_desc: "古战场"
 TK_20_30_MuYeZhiZhan: "牧野之战"
 building_TK_20_30_MuYeZhiZhan: "$TK_20_30_MuYeZhiZhan$"
 building_TK_20_30_MuYeZhiZhan_desc: "牧野之战是武王伐纣的决胜战，是周商军队在牧野（今淇县南、卫河以北，新乡市附近）进行的决战。战役以周武王胜利终结，结束了商朝统治，建立了为期800年的周天下。"
 building_type_TK_20_30_ChangShaoZhiZhan: "古战场"
 building_type_TK_20_30_ChangShaoZhiZhan_desc: "古战场"
 TK_20_30_ChangShaoZhiZhan: "长勺之战"
 building_TK_20_30_ChangShaoZhiZhan: "$TK_20_30_ChangShaoZhiZhan$"
 building_TK_20_30_ChangShaoZhiZhan_desc: "长勺之战，发生在中国春秋时代齐国与鲁国之间的一场战役，发生于公元前684年的长勺（今山东省莱芜）。此次战役以鲁国取胜终结，战后间接促成数年后齐鲁息兵言和。"
 building_type_TK_20_30_ChangPingZhiZhan: "古战场"
 building_type_TK_20_30_ChangPingZhiZhan_desc: "古战场"
 TK_20_30_ChangPingZhiZhan: "长平之战"
 building_TK_20_30_ChangPingZhiZhan: "$TK_20_30_ChangPingZhiZhan$"
 building_TK_20_30_ChangPingZhiZhan_desc: "长平之战，是秦昭襄王四十七年（公元前260年）5月至10月秦国赵国为争夺上党地区，在长平（今山西省晋城高平市西北）一带爆发发生的战争。战役以秦国进占长平，斩首坑杀赵军约45万结束，战后赵国精锐损失殆尽，再无力与秦抗衡。"
 building_type_TK_20_30_GaiXiaZhiZhan: "古战场"
 building_type_TK_20_30_GaiXiaZhiZhan_desc: "古战场"
 TK_20_30_GaiXiaZhiZhan: "垓下之战"
 building_TK_20_30_GaiXiaZhiZhan: "$TK_20_30_GaiXiaZhiZhan$"
 building_TK_20_30_GaiXiaZhiZhan_desc: "垓下之战是汉高帝五年十二月（公元前203年12月—前202年1月）楚汉两军在垓下进行的一场战略决战。它既是楚汉相争的终结点，又是汉王朝繁荣强盛的起点，更是中国历史上具有里程碑意义的转折点，它结束了秦末混战的局面，统一了中国，奠定了汉王朝四百年基业。"
 building_type_TK_20_30_KunYangZhiZhan: "古战场"
 building_type_TK_20_30_KunYangZhiZhan_desc: "古战场"
 TK_20_30_KunYangZhiZhan: "昆阳之战"
 building_TK_20_30_KunYangZhiZhan: "$TK_20_30_KunYangZhiZhan$"
 building_TK_20_30_KunYangZhiZhan_desc: "昆阳之战是新朝末年，新汉两军在中原地区昆阳一线（今河南省叶县）的会战。战役以玄汉胜利告终，而东汉开国皇帝刘秀凭此战名震天下，为起义军胜利进军洛阳、长安，最终推翻新莽统治创造了有利的条件。"
 building_type_TK_20_30_ChiBiZhiZhan: "古战场"
 building_type_TK_20_30_ChiBiZhiZhan_desc: "古战场"
 TK_20_30_ChiBiZhiZhan: "赤壁之战"
 building_TK_20_30_ChiBiZhiZhan: "$TK_20_30_ChiBiZhiZhan$"
 building_TK_20_30_ChiBiZhiZhan_desc: "赤壁之战，是指东汉末年孙权、刘备联军于建安十三年（208年）在长江赤壁（今湖北省赤壁市西北）一带大破曹操大军的战役。这是中国历史上著名的以少胜多、以弱胜强的战役之一，是三国时期“三大战役”中最为著名的一场，也是继阖闾破楚之后的又一次在长江流域进行的大规模江河作战。"
 building_type_TK_20_30_YiLingZhiZhan: "古战场"
 building_type_TK_20_30_YiLingZhiZhan_desc: "古战场"
 TK_20_30_YiLingZhiZhan: "夷陵之战"
 building_TK_20_30_YiLingZhiZhan: "$TK_20_30_YiLingZhiZhan$"
 building_TK_20_30_YiLingZhiZhan_desc: "夷陵之战，又称彝陵之战、猇亭之战，古地名，在今湖北宜都北，是三国时期蜀汉昭烈帝刘备对东吴发动的大规模战役，是中国古代战争史上一次著名的积极防御的成功战例，也是三国“三大战役”的最后一场。"
 building_type_TK_20_30_FeiShuiZhiZhan: "古战场"
 building_type_TK_20_30_FeiShuiZhiZhan_desc: "古战场"
 TK_20_30_FeiShuiZhiZhan: "淝水之战"
 building_TK_20_30_FeiShuiZhiZhan: "$TK_20_30_FeiShuiZhiZhan$"
 building_TK_20_30_FeiShuiZhiZhan_desc: "淝水之战，是公元383年东晋和前秦之间发生在淝水（今安徽省寿县的东南方）的一场战争。最终东晋仅以八万军力大胜八十七万的前秦军。淝水之战是中国历史上著名的以少胜多的战例。拥有绝对优势的前秦败给了东晋，国家也因此衰败，北方各民族纷纷脱离了前秦的统治，分裂为后秦和后燕为主的几个政权。而东晋则趁此北伐，把边界线推进到了黄河南部。"
 building_type_TK_20_30_CanHePoZhiZhan: "古战场"
 building_type_TK_20_30_CanHePoZhiZhan_desc: "古战场"
 TK_20_30_CanHePoZhiZhan: "参合陂之战"
 building_TK_20_30_CanHePoZhiZhan: "$TK_20_30_CanHePoZhiZhan$"
 building_TK_20_30_CanHePoZhiZhan_desc: "参合陂之战是十六国后期，北魏在参合陂（今内蒙古凉城东北，一说在今山西阳高）大败后燕的一场重大战役。登国十年（公元395年）五月至十一月，后燕太子慕容宝率领八万后燕军进攻北魏。北魏道武帝拓跋珪采取“敌进我退，诱敌深入，拖而不打”的战略，渡黄河南下，与后燕军队隔河对峙。后燕军队长途跋涉，不能速战速决，加之天气渐冷，又误信慕容垂去世的消息，决定撤兵。被拓跋珪率领的二万北魏军在参合陂大败。这场战役加速了后燕的灭亡，也奠定了北魏统一中国北方的基础。"
 building_type_TK_20_30_BaiJiangKouZhiZhan: "古战场"
 building_type_TK_20_30_BaiJiangKouZhiZhan_desc: "古战场"
 TK_20_30_BaiJiangKouZhiZhan: "白江口之战"
 building_TK_20_30_BaiJiangKouZhiZhan: "$TK_20_30_BaiJiangKouZhiZhan$"
 building_TK_20_30_BaiJiangKouZhiZhan_desc: "白江口之战，亦称白村江之战，指的是663年8月27日至8月28日，唐朝与日本于白江口（今韩国锦江入海口）发生的一次水战。663年，日军（4万余人，战船1000余艘），唐军（1.3万人，战舰170余艘）在百济白江口展开了激烈海战。唐朝水军充分发挥自身优势，将兵力、船舰皆数倍于己的日本水军打得大败，堪称一次以少胜多的经典水战。"
 building_type_TK_20_30_XiangJiSiZhiZhan: "古战场"
 building_type_TK_20_30_XiangJiSiZhiZhan_desc: "古战场"
 TK_20_30_XiangJiSiZhiZhan: "香积寺之战"
 building_TK_20_30_XiangJiSiZhiZhan: "$TK_20_30_XiangJiSiZhiZhan$"
 building_TK_20_30_XiangJiSiZhiZhan_desc: "香积寺之战，又名沣水之战，唐天宝十四年（公元755年）冬，节度使安禄山叛变反唐，史称“安史之乱”。安禄山叛军连战连胜，攻陷东都，潼关失守，唐玄宗仓皇出逃长安，留太子李亨收拾残局，叛军攻陷长安登基称帝。至德二年（公元757年）九月，唐军集兵15万合回纥借兵4千，行至长安城南香积寺附近，与安史将领安守忠、李归仁所率10万叛军遭遇。激战两个时辰，唐军攻克长安，叛军溃败东逃潼关，安史叛军在关中地区的主力一朝丧尽，长安得以迅速收复，使得唐肃宗“再造唐室 ”的计划得以初步实现。"
 building_type_TK_20_30_GaoLiangHeZhiZhan: "古战场"
 building_type_TK_20_30_GaoLiangHeZhiZhan_desc: "古战场"
 TK_20_30_GaoLiangHeZhiZhan: "高粱河之战"
 building_TK_20_30_GaoLiangHeZhiZhan: "$TK_20_30_GaoLiangHeZhiZhan$"
 building_TK_20_30_GaoLiangHeZhiZhan_desc: "高粱河之战是指宋太平兴国四年（979），宋军为夺取幽州，在高梁河（今北京西直门外）被辽军击败的一次作战。宋太宗为夺回五代时后晋石敬瑭割给契丹的燕云十六州，于太平兴国四年五月平北汉后，未经休整和准备，即转兵攻辽，企图乘其不备，一举夺取幽州。辽景宗耶律贤得知幽州被困，急令精骑增援。辽军反击，宋军三面受敌，顿时大乱，全线溃退，死者万余人，宋太宗乘驴车逃走。此次战争结束了宋朝统一的步伐，并且在军事上总体开始处于劣势，对以后与辽作战造成了不利的影响。"
 building_type_TK_20_31_DuJiangYan: "水利工程"
 building_type_TK_20_31_DuJiangYan_desc: "水利工程"
 TK_20_31_DuJiangYan: "都江堰"
 building_TK_20_31_DuJiangYan: "$TK_20_31_DuJiangYan$"
 building_TK_20_31_DuJiangYan_desc: "是公元前256年，战国时期秦国蜀郡太守李冰率众修建的都江堰水利工程。秦时称为“湔堋”；三国蜀汉时期称为“都安堰”，又叫“金堤”；唐时称为“楗尾堰”；从宋代开始，把整个都江堰水利系统的工程概括起来，叫都江堰，才较为准确地代表了整个水利工程系统，一直沿用至今。"
 building_type_TK_20_31_LingQu: "水利工程"
 building_type_TK_20_31_LingQu_desc: "水利工程"
 TK_20_31_LingQu: "灵渠"
 building_TK_20_31_LingQu: "$TK_20_31_LingQu$"
 building_TK_20_31_LingQu_desc: "灵渠古称秦凿渠、零渠、陡河、兴安运河、湘桂运河，是古代中国劳动人民创造的一项伟大工程，于公元前214年凿成通航。灵渠流向由东向西，将湘水和漓水相连，是世界上最古老的运河之一，有着“世界古代水利建筑明珠”的美誉。"
 building_type_TK_20_31_KanErJing: "水利工程"
 building_type_TK_20_31_KanErJing_desc: "水利工程"
 TK_20_31_KanErJing: "坎儿井"
 building_TK_20_31_KanErJing: "$TK_20_31_KanErJing$"
 building_TK_20_31_KanErJing_desc: "坎儿井是在干旱地的劳动人民漫长的历史发展中创造的一种地下水利工程。坎儿井引出了地下水，让沙漠变成绿洲，古代称作“井渠”。坎儿井的主要工作原理是人们将春夏季节渗入地下的大量雨水、冰川及积雪融水通过利用山体的自然坡度，引出地表进行灌溉，以满足沙漠地区的生产生活用水需求。"
 building_type_TK_20_32_MoGaoKu: "窟碑古刻"
 building_type_TK_20_32_MoGaoKu_desc: "窟碑古刻"
 TK_20_32_MoGaoKu: "莫高窟"
 building_TK_20_32_MoGaoKu: "$TK_20_32_MoGaoKu$"
 building_TK_20_32_MoGaoKu_desc: "莫高窟俗称千佛洞，始建于前秦建元二年(东晋太和元年，即366年)，历经十六国、北魏、西魏、北周、隋、唐等十个朝代，至元代基本成型，连续营造达千年之久，是世界上现存规模最宏大、保存最完整的佛教艺术宝库。据传说，336年，一个名叫乐樽的和尚来到了鸣沙山。当时已是傍晚，他忽然看到眼前的鸣沙山金光闪烁，像有无数的佛像在山间跃动。天地间没有一点儿声息，只有光的流溢，色的笼罩。乐樽和尚为眼前这庄严肃穆的景象震惊万分，既而有所顿悟。他庄重地跪下，朗声发愿：从今要广为化缘，在此筑窟造佛像，使此地成为佛教圣地。"
 building_type_TK_20_32_YunGangShiKu: "窟碑古刻"
 building_type_TK_20_32_YunGangShiKu_desc: "窟碑古刻"
 TK_20_32_YunGangShiKu: "云冈石窟"
 building_TK_20_32_YunGangShiKu: "$TK_20_32_YunGangShiKu$"
 building_TK_20_32_YunGangShiKu_desc: "云冈石窟原名武州（周）山石窟寺，明代开始改称云冈石窟。北魏和平元年（460年），北魏文成帝复兴佛法，命昙曜高僧主持开凿了规模宏大的云冈石窟。石窟依山开凿，规模恢弘、气势雄浑，东西绵延约1公里，窟区自东而西依自然山势分为东、中、西三区。现存主要洞窟45个，附属洞窟209个，雕刻面积达18000余平方米。造像最高为17米，最小为2厘米，佛龛约计1100多个，大小造像59000余尊。云冈石窟按照开凿的时间可分为早、中、晚三期，不同时期的石窟造像风格也各有特色。云冈石窟的造像气势宏伟，内容丰富多彩，堪称公元5世纪中国石刻艺术之冠，被誉为中国古代雕刻艺术的宝库。"
 building_type_TK_20_32_LongMenShiKu: "窟碑古刻"
 building_type_TK_20_32_LongMenShiKu_desc: "窟碑古刻"
 TK_20_32_LongMenShiKu: "龙门石窟"
 building_TK_20_32_LongMenShiKu: "$TK_20_32_LongMenShiKu$"
 building_TK_20_32_LongMenShiKu_desc: "龙门石窟于北魏孝文帝迁都洛阳（493年）前开凿。石窟现存2345座佛龛，10万余尊造像，2800余块碑刻题记，是世界上造像最多、规模最大的石刻艺术宝库，被联合国教科文组织评为“中国石刻艺术的最高峰”，位居中国各大石窟之首。"
 building_type_TK_20_32_DaZuShiKe: "窟碑古刻"
 building_type_TK_20_32_DaZuShiKe_desc: "窟碑古刻"
 TK_20_32_DaZuShiKe: "大足石刻"
 building_TK_20_32_DaZuShiKe: "$TK_20_32_DaZuShiKe$"
 building_TK_20_32_DaZuShiKe_desc: "大足石刻是大足区境内石窟寺及石窟造像的总称，是集儒、释、道三教造像于一体的大型石窟造像群。最初开凿于初唐永徽元年，历经晚唐、五代，盛于两宋，明清时期亦有所增刻，最终形成了一处规模庞大，集中国石刻艺术精华之大成的石刻群，其内容为释、儒、道三教合一，堪称中国晚期石窟艺术的代表。"
 building_type_TK_20_32_LeShanDaFu: "窟碑古刻"
 building_type_TK_20_32_LeShanDaFu_desc: "窟碑古刻"
 TK_20_32_LeShanDaFu: "乐山大佛"
 building_TK_20_32_LeShanDaFu: "$TK_20_32_LeShanDaFu$"
 building_TK_20_32_LeShanDaFu_desc: "乐山大佛古称“弥勒大像”“嘉定大佛”，又名凌云大佛，全称为“嘉州凌云寺大弥勒石像”。乐山大佛建造从唐开元初年（713年）修建到唐贞元十九年（803年），历经三代建造者，四位皇帝，历时90年才完工。乐山大佛头与山齐，头高14.7米、宽10米，发髻1051个，耳长7米，依山凿成临江危坐，神势肃穆，大气磅礴。乐山大佛是世界现存最大的一尊摩崖石像，有“山是一尊佛，佛是一座山”的称誉。"
 building_type_TK_20_32_MaiJiShanShiKu: "窟碑古刻"
 building_type_TK_20_32_MaiJiShanShiKu_desc: "窟碑古刻"
 TK_20_32_MaiJiShanShiKu: "麦积山石窟"
 building_TK_20_32_MaiJiShanShiKu: "$TK_20_32_MaiJiShanShiKu$"
 building_TK_20_32_MaiJiShanShiKu_desc: "麦积山石窟位于甘肃省天水市麦积区，是麦积山风景名胜区核心景点。麦积山石窟位于秦岭西端北侧，是小陇山中的一座孤峰，高142米，因山形似农家麦垛而得名。麦积山石窟与莫高窟、龙门石窟、云冈石窟并称为中国四大石窟。麦积山石窟始建于十六国后秦（384年—417年）时期，历经北魏、西魏、北周、隋、唐、五代、宋、元、明、清等十余个王朝、1600余年的开凿和修缮，现存窟龛221个，各类造像3938件10632身，壁画979.54平方米。麦积山石窟保存的造像以泥塑为主，保留有大量的宗教、艺术、建筑等方面的实物资料，体现了千余年来各个时代塑像的特点，反映了中国泥塑艺术发展和演变过程，丰富了中国古代文化史，为后世研究中国佛教文化提供了丰富的资料和史实，有“东方雕塑陈列馆”的美誉。"
 building_type_TK_20_36_YanMenGuan: "关卡险隘"
 building_type_TK_20_36_YanMenGuan_desc: "关卡险隘"
 TK_20_36_YanMenGuan: "雁门关"
 building_TK_20_36_YanMenGuan: "$TK_20_36_YanMenGuan$"
 building_TK_20_36_YanMenGuan_desc: "雁门关是长城上的重要关隘，以“险”著称，被誉为“中华第一关”，有“天下九塞，雁门为首”之说。与宁武关、偏头关合称为“外三关”。"
 building_type_TK_20_36_YuMenGuan: "关卡险隘"
 building_type_TK_20_36_YuMenGuan_desc: "关卡险隘"
 TK_20_36_YuMenGuan: "玉门关"
 building_TK_20_36_YuMenGuan: "$TK_20_36_YuMenGuan$"
 building_TK_20_36_YuMenGuan_desc: "玉门关故址在今甘肃省敦煌市西北小方盘城，始置于汉武帝时期，为汉时通往西域各地的门户。元鼎或元封中（公元前116年至前105年）修筑酒泉至玉门间的长城，玉门关当随之设立。"
 building_type_TK_20_36_YangGuan: "关卡险隘"
 building_type_TK_20_36_YangGuan_desc: "关卡险隘"
 TK_20_36_YangGuan: "阳关"
 building_TK_20_36_YangGuan: "$TK_20_36_YangGuan$"
 building_TK_20_36_YangGuan_desc: "阳关位于甘肃省敦煌市西南70千米的古董滩。始建于公元前1世纪西汉武帝时期，与玉门关同为当时对西域的门户，丝绸之路南路必经的关隘。因在玉门关之南，故名。"
 building_type_TK_20_36_JianMenGuan: "关卡险隘"
 building_type_TK_20_36_JianMenGuan_desc: "关卡险隘"
 TK_20_36_JianMenGuan: "剑门关"
 building_TK_20_36_JianMenGuan: "$TK_20_36_JianMenGuan$"
 building_TK_20_36_JianMenGuan_desc: "剑门关为古蜀道金牛道（石牛道）要隘。因两崖对峙，其峰如剑，其势如门，故曰“剑门”。"
 building_type_TK_20_36_WuGuan: "关卡险隘"
 building_type_TK_20_36_WuGuan_desc: "关卡险隘"
 TK_20_36_WuGuan: "武关"
 building_TK_20_36_WuGuan: "$TK_20_36_WuGuan$"
 building_TK_20_36_WuGuan_desc: "武关，春秋时称“少习关”，为“三秦要塞”，“秦楚咽喉”。自春秋始,历来武关均设防守，为兵家必争。与函谷关、萧关、大散关成为“秦之四塞”。"
 building_type_TK_20_36_HuLaoGuan: "关卡险隘"
 building_type_TK_20_36_HuLaoGuan_desc: "关卡险隘"
 TK_20_36_HuLaoGuan: "虎牢关"
 building_TK_20_36_HuLaoGuan: "$TK_20_36_HuLaoGuan$"
 building_TK_20_36_HuLaoGuan_desc: "虎牢关，又称汜水关、成皋关、古崤关，洛阳八关之一，是洛阳东边门户和重要的关隘。虎牢关之名相传因河南地区鲜有老虎，周穆王曾将老虎关押在此地而得名。此关南连嵩岳，北濒黄河，山岭交错，自成天险。大有“一夫当关，万夫莫开”之势，为历代兵家必争之地。"
 building_type_TK_20_36_DaSanGuan: "关卡险隘"
 building_type_TK_20_36_DaSanGuan_desc: "关卡险隘"
 TK_20_36_DaSanGuan: "大散关"
 building_TK_20_36_DaSanGuan: "$TK_20_36_DaSanGuan$"
 building_TK_20_36_DaSanGuan_desc: "大散关为周朝散国之关隘，故称散关，中国关中四关之一。秦汉时期（前206年），刘邦“明修栈道，暗度陈仓”就从这里经过。三国时期，曹操西征张鲁亦经由此地。据陈寿《三国志》记载：“（建兴六年）春，亮复出散关，围陈仓，曹真拒之。”散关是一个交通枢纽，具有很重要的战略位置。南宋著名诗人陆游著有《书愤》其一“楼船夜雪瓜洲渡，铁马秋风大散关”。因其扼南北交通咽喉，自古为“川陕咽喉”、兵家必争之地。"
 building_type_TK_20_36_TongGuan: "关卡险隘"
 building_type_TK_20_36_TongGuan_desc: "关卡险隘"
 TK_20_36_TongGuan: "潼关"
 building_TK_20_36_TongGuan: "$TK_20_36_TongGuan$"
 building_TK_20_36_TongGuan_desc: "潼关北临黄河，南踞山腰。《水经注》载：“河在关内南流潼激关山，因谓之潼关。”过去人们常以“细路险与猿猴争”、“人间路止潼关险”来比拟这里形势的险要。因为潼关地处黄河渡口，位居晋、陕、豫三省要冲，扼长安至洛阳驿道的要冲，是进出三秦之锁钥，所以成为汉末以来东入中原和西进关中、西域的必经之地及关防要隘，历来为兵家必争之地，素有“畿内首险”、“四镇咽喉”、“百二重关”之誉。"
 building_type_TK_20_36_ShanHaiGuan: "关卡险隘"
 building_type_TK_20_36_ShanHaiGuan_desc: "关卡险隘"
 TK_20_36_ShanHaiGuan: "山海关"
 building_TK_20_36_ShanHaiGuan: "$TK_20_36_ShanHaiGuan$"
 building_TK_20_36_ShanHaiGuan_desc: "山海关又称榆关、渝关、临闾关，是明长城的东北关隘之一，被认为是明长城东端起点，素有中国长城“三大奇观之一”（东有山海关、中有镇北台、西有嘉峪关）、“天下第一关”、“边郡之咽喉，京师之保障”之称，与万里之外的嘉峪关遥相呼应，闻名天下。"
 building_type_TK_20_36_XiaoGuan: "关卡险隘"
 building_type_TK_20_36_XiaoGuan_desc: "关卡险隘"
 TK_20_36_XiaoGuan: "萧关"
 building_TK_20_36_XiaoGuan: "$TK_20_36_XiaoGuan$"
 building_TK_20_36_XiaoGuan_desc: "萧关：关中4大关隘之一，在今宁夏回族自治区固原东南。六盘山山脉横亘于关中西北，为其西北屏障。自陇上进入关中的通道主要是渭河、泾河等河流穿切成的河谷低地。"
 building_type_TK_20_37_QuanZhouGang: "港口渡峡"
 building_type_TK_20_37_QuanZhouGang_desc: "港口渡峡"
 TK_20_37_QuanZhouGang: "泉州港"
 building_TK_20_37_QuanZhouGang: "$TK_20_37_QuanZhouGang$"
 building_TK_20_37_QuanZhouGang_desc: "泉州港原名刺桐港，是中国福建省泉州市境内的港口，位于泉州市东南晋江下游滨海的港湾，区域北至泉州湄洲湾内澳，南至泉州围头湾同安区莲河。南朝时期，印度僧人拘那罗陀于陈武帝永定二年（558年）和陈文帝天嘉六年（565年）两次到泉州，在泉州西郊九日山上翻译《金刚经》，后由泉州乘船到棱加修国（今马来半岛）和优禅尼国（今印度），泉州港始名，后经唐发展，五代拓展，至宋时达到繁荣。"
 building_type_TK_20_37_BoDuoGang: "港口渡峡"
 building_type_TK_20_37_BoDuoGang_desc: "港口渡峡"
 TK_20_37_BoDuoGang: "博多港"
 building_TK_20_37_BoDuoGang: "$TK_20_37_BoDuoGang$"
 building_TK_20_37_BoDuoGang_desc: "博多港位于日本九州的西北博多湾内，邻福冈市，西至佐世保126海里，至上海约500海里，西北至釜山约120海里，至北九州约60海里，临朝鲜海峡国际航道。642年日本大化改新后，设立太宰府，博多港随之发展起来。"
 building_type_TK_20_37_BiLanDu: "港口渡峡"
 building_type_TK_20_37_BiLanDu_desc: "港口渡峡"
 TK_20_37_BiLanDu: "碧澜渡"
 building_TK_20_37_BiLanDu: "$TK_20_37_BiLanDu$"
 building_TK_20_37_BiLanDu_desc: "碧澜渡位于朝鲜半岛开城市西郊礼成江边的渡口，作为王氏高丽统一时代最为重要的对外货贸渡口，对高丽的经济繁荣做出了巨大贡献。"
 building_type_TK_20_40_DongYueTaiShan: "五岳"
 building_type_TK_20_40_DongYueTaiShan_desc: "五岳"
 TK_20_40_DongYueTaiShan: "东岳泰山"
 building_TK_20_40_DongYueTaiShan: "$TK_20_40_DongYueTaiShan$"
 building_TK_20_40_DongYueTaiShan_desc: "东岳泰山又名岱山、岱宗、岱岳、东岳、泰岳，为五岳之一，有“五岳之首”“五岳独尊”“天下第一山”之称，被中外学者称为“中国的奥林匹斯山”。泰山相伴上下五千年的华夏文明传承历史，集国家兴盛、民族存亡的象征于一身，是中华民族的精神家园，也是历代帝王告天、祭祖、封禅的主要祭祀地点。"
 building_type_TK_20_40_NanYueHengShan: "五岳"
 building_type_TK_20_40_NanYueHengShan_desc: "五岳"
 TK_20_40_NanYueHengShan: "南岳衡山"
 building_TK_20_40_NanYueHengShan: "$TK_20_40_NanYueHengShan$"
 building_TK_20_40_NanYueHengShan_desc: "南岳衡山又名南岳、寿岳、南山，主体部分位于湖南省衡阳市南岳区、衡山县和衡阳县东部。据战国时期《甘石星经》记载，因其位于星座二十八宿的轸星之翼，“变应玑衡”，“铨德钧物”，犹如衡器，可称天地，故名衡山。"
 building_type_TK_20_40_XiYueHuaShan: "五岳"
 building_type_TK_20_40_XiYueHuaShan_desc: "五岳"
 TK_20_40_XiYueHuaShan: "西岳华山"
 building_TK_20_40_XiYueHuaShan: "$TK_20_40_XiYueHuaShan$"
 building_TK_20_40_XiYueHuaShan_desc: "西岳华山古称“西岳”，雅称“太华山”，为中国著名五岳之一。华山是中华文明的发祥地，“中华”“华夏”中的“华”字就源于华山，因此此地有着“华夏之根”之称；华山还是祭祀神山，秦始皇、汉武帝、武则天、唐玄宗等帝王在此曾进行过大规模祭祀活动。另外，华山是道教全真派的发祥地之一。"
 building_type_TK_20_40_BeiYueHengShan: "五岳"
 building_type_TK_20_40_BeiYueHengShan_desc: "五岳"
 TK_20_40_BeiYueHengShan: "北岳恒山"
 building_TK_20_40_BeiYueHengShan: "$TK_20_40_BeiYueHengShan$"
 building_TK_20_40_BeiYueHengShan_desc: "北岳恒山亦名“太恒山”，古称玄武山、崞山，高是山，玄岳等，明末清初被确定为“五岳”之北岳恒山。清初，北岳国家祭祀也逐渐由河北曲阳移至浑源恒山，五岳文化融入恒山文化中。古代这里是大同盆地经倒马关、紫荆关至河北平原的必经之地。主峰天峰岭，号称“人天北柱”、“绝塞名山”，叠嶂拔峙，气势雄伟，被誉为北国万山之宗主。"
 building_type_TK_20_40_ZhongYueSongShan: "五岳"
 building_type_TK_20_40_ZhongYueSongShan_desc: "五岳"
 TK_20_40_ZhongYueSongShan: "中岳嵩山"
 building_TK_20_40_ZhongYueSongShan: "$TK_20_40_ZhongYueSongShan$"
 building_TK_20_40_ZhongYueSongShan_desc: "中岳嵩山是五岳之一的中岳，属于秦岭山系东延的余脉。嵩山有72峰，太室山和少室山各占三十六峰。早在夏禹时称嵩高、崇山，商汤时称嵩高，西周时称天室山。公元前770年平王迁都洛阳后，以“嵩为中央、左岱、右华”，为“天地之中”，称中岳嵩山。嵩山被誉为“华夏之中岳”，是中国地理的重要象征之一；亦是历代帝王祭祀和封禅巡游的首选之地。"
 building_type_TK_20_41_HuangShan: "名山"
 building_type_TK_20_41_HuangShan_desc: "名山"
 TK_20_41_HuangShan: "黄山"
 building_TK_20_41_HuangShan: "$TK_20_41_HuangShan$"
 building_TK_20_41_HuangShan_desc: "黄山原名黟山，因峰岩青黑，遥望苍黛而得名。与长江、长城、黄河同为中华壮丽山河和灿烂文化的杰出代表，被誉为“人间仙境”、“天下第一奇山”。黄山不仅有黄山四绝，还有号称“三十六大峰，三十六小峰”。"
 building_type_TK_20_41_LuShan: "名山"
 building_type_TK_20_41_LuShan_desc: "名山"
 TK_20_41_LuShan: "庐山"
 building_TK_20_41_LuShan: "$TK_20_41_LuShan$"
 building_TK_20_41_LuShan_desc: "庐山又名匡山、匡庐；此外还有南彰山、天子彰等别名；汉司马迁《史记》载：“余南登庐山，观禹疏九江。”自此始名。庐山以雄、奇、险、秀闻名于世，被誉为“人文圣山”，素有“匡庐奇秀甲天下”之誉。"
 building_type_TK_20_41_ShenNongShan: "名山"
 building_type_TK_20_41_ShenNongShan_desc: "名山"
 TK_20_41_ShenNongShan: "神农山"
 building_TK_20_41_ShenNongShan: "$TK_20_41_ShenNongShan$"
 building_TK_20_41_ShenNongShan_desc: "神农山是集雄、险、奇、秀、幽、神为一体的山区。因炎帝神农氏在这里辨五谷、尝百草、设坛祭天而得名。神农山风景区代表景点有龙脊长城、紫金顶、静应湖等。"
 building_type_TK_20_41_LaoJunShan: "名山"
 building_type_TK_20_41_LaoJunShan_desc: "名山"
 TK_20_41_LaoJunShan: "老君山"
 building_TK_20_41_LaoJunShan: "$TK_20_41_LaoJunShan$"
 building_TK_20_41_LaoJunShan_desc: "老君山原名景室山，是秦岭余脉八百里伏牛山的主峰，有“天下无双圣境，世界第一仙山”之称。春秋时期，被公认为道教始祖的老子李耳到此归隐修炼，使之成为“道源”和“祖庭”。距今已有两千多年人文历史，是道教中历史最长的山脉。"
 building_type_TK_20_41_WuDangShan: "名山"
 building_type_TK_20_41_WuDangShan_desc: "名山"
 TK_20_41_WuDangShan: "武当山"
 building_TK_20_41_WuDangShan: "$TK_20_41_WuDangShan$"
 building_TK_20_41_WuDangShan_desc: "武当山又名太和山、谢罗山、参上山、仙室山，古有“太岳”、“玄岳”、“大岳”之称，是道教五大仙山之一。明代，武当山被皇帝封为“大岳”、“治世玄岳”，被尊为“皇室家庙”。武当山以“四大名山皆拱揖，五方仙岳共朝宗”的“五岳之冠”地位闻名于世，是道教名山和武当武术的发源地，被称为“亘古无双胜境，天下第一仙山”。"
 building_type_TK_20_41_LongHuShan: "名山"
 building_type_TK_20_41_LongHuShan_desc: "名山"
 TK_20_41_LongHuShan: "龙虎山"
 building_TK_20_41_LongHuShan: "$TK_20_41_LongHuShan$"
 building_TK_20_41_LongHuShan_desc: "龙虎山是中国道教的发祥地、道教四大名山、五大仙山之一，与道教圣地、碧水丹山与古崖墓群被誉为“三绝”。宋元明时期，历代天师被敕封“一品”，龙虎山统领江南道教，成为中国道教的传播中心、“百神授职之所”。"
 building_type_TK_20_41_QingChengShan: "名山"
 building_type_TK_20_41_QingChengShan_desc: "名山"
 TK_20_41_QingChengShan: "青城山"
 building_TK_20_41_QingChengShan: "$TK_20_41_QingChengShan$"
 building_TK_20_41_QingChengShan_desc: "青城山又称丈人山，相传轩辕黄帝时有宁封子，居青城山修道，曾向黄帝传授御风云的“龙跻之术”，黄帝筑坛拜其为“五岳丈人”而名，是道教五大仙山之一。东汉汉安二年（143年），在写毕二十四道书两年后，张道陵到达青城山，在此结茅传道，创立了中国的本土宗教——道教，使青城山成为了中国四大道教名山之首。"
 building_type_TK_20_41_QiYunShan: "名山"
 building_type_TK_20_41_QiYunShan_desc: "名山"
 TK_20_41_QiYunShan: "齐云山"
 building_TK_20_41_QiYunShan: "$TK_20_41_QiYunShan$"
 building_TK_20_41_QiYunShan_desc: "齐云山古称白岳，因遥观山顶与云平齐得名；中国道教五大仙山之一。明洪武十五年（1382年）朝廷置道会司于县城崇寿观，主领全县道教事，山上道士有被任命为道会司的；嘉靖十一年（1532年）龙虎山正一嗣教真人张天师驻山，因世宗祈嗣灵应，敕建玄天太素宫，置真人府，配各级道官：太素宫置提点，真人府设赞教、知事，山、庙有住持，县设道会司，州设道正司，府设道纪司，中枢最高设道箓司等机构。"
 building_type_TK_20_41_JingFuShan: "名山"
 building_type_TK_20_41_JingFuShan_desc: "名山"
 TK_20_41_JingFuShan: "景福山"
 building_TK_20_41_JingFuShan: "$TK_20_41_JingFuShan$"
 building_TK_20_41_JingFuShan_desc: "景福山古名灵仙岩，一名玄陇，一名灵仙岩，一名龙门，北岳佐理之山；中国道教五大仙山之一。元世祖忽必烈下诏命担任道教陇西路提点的张志宽和副提点贺志真率道众赵大全等12人来到龙门山，以继承丘处机香火并祈国家景福为宗旨，命名此山为景福山。“其景福也”，取大福之义，被尊为至高无上的“隐士仙山”、“灵仙福岩”。景福以“岳镇乾坤胜景，峰连霄汉名山”之冠的显赫地位闻名于世。"
 building_type_TK_20_41_MaoShan: "名山"
 building_type_TK_20_41_MaoShan_desc: "名山"
 TK_20_41_MaoShan: "茅山"
 building_TK_20_41_MaoShan: "$TK_20_41_MaoShan$"
 building_TK_20_41_MaoShan_desc: "茅山故名句曲山，因山势曲折，形似“已”字而名；又名金陵地肺山，道家称“句曲之金陵，是养真之福境，成神之灵墟”；中国道教四大名山之一。西汉年间，陕西咸阳茅氏三兄弟茅盈、茅固、茅衷来句曲山修道行善，益泽世人。后人为纪念茅氏功德，遂改句曲山为三茅山，简称茅山。"
 building_type_TK_20_41_WuTaiShan: "名山"
 building_type_TK_20_41_WuTaiShan_desc: "名山"
 TK_20_41_WuTaiShan: "五台山"
 building_TK_20_41_WuTaiShan: "$TK_20_41_WuTaiShan$"
 building_TK_20_41_WuTaiShan_desc: "五台山古称紫府山，因当地神仙方士居所名紫府而名；也称作五峰山道场，曾建有紫府庙，是道士们修行的地方；佛教传入后又改称清凉山；中国佛教四大名山之一。《清凉山志》称佛教的文殊菩萨初来中国时，居于石盆洞中，而石盆在道家的玄真观内，这说明当时五台山为道家所居。"
 building_type_TK_20_41_EMeiShan: "名山"
 building_type_TK_20_41_EMeiShan_desc: "名山"
 TK_20_41_EMeiShan: "峨眉山"
 building_TK_20_41_EMeiShan: "$TK_20_41_EMeiShan$"
 building_TK_20_41_EMeiShan_desc: "峨眉山也作“峨嵋山”，相传为普贤菩萨的道场，中国佛教四大名山之一。峨眉山平畴突起，巍峨、秀丽、古老、神奇。它以优美的自然风光、悠久的佛教文化、丰富的动植物资源、独特的地质地貌而著称于世。被人们称之为“仙山佛国”、“植物王国”、“动物乐园”、“地质博物馆”等，素有“峨眉天下秀”之美誉。"
 building_type_TK_20_41_PuTuoShan: "名山"
 building_type_TK_20_41_PuTuoShan_desc: "名山"
 TK_20_41_PuTuoShan: "普陀山"
 building_TK_20_41_PuTuoShan: "$TK_20_41_PuTuoShan$"
 building_TK_20_41_PuTuoShan_desc: "普陀山全称普陀洛迦山，相传为观音菩萨的道场，中国佛教四大名山之一。普陀山的名称，出自佛教《华严经》等六十八卷，全称为：“补坦洛迦”、“普陀洛迦”，是梵语的译音，意为“美丽的小白花”，由于中国历代帝王多建都在北方，所以自元朝以来，惯称此山为“南海普陀”。普陀山又有“五朝恩赐无双地，四海尊崇第一山”的美誉。"
 building_type_TK_20_41_JiuHuaShan: "名山"
 building_type_TK_20_41_JiuHuaShan_desc: "名山"
 TK_20_41_JiuHuaShan: "九华山"
 building_TK_20_41_JiuHuaShan: "$TK_20_41_JiuHuaShan$"
 building_TK_20_41_JiuHuaShan_desc: "九华山名称源于李白“妙有分二气，灵山开九华”的诗句，属黄山山脉支脉；相传为地藏王菩萨的道场，中国佛教四大名山之一。九华山共有99座山峰，寺庙80余座，僧尼300余人，在中国佛教四大名山中，九华山独领风骚，以“香火甲天下”、“东南第一山”的双重桂冠而闻名于海内外。"
 building_type_TK_20_41_FanJingShan: "名山"
 building_type_TK_20_41_FanJingShan_desc: "名山"
 TK_20_41_FanJingShan: "梵净山"
 building_TK_20_41_FanJingShan: "$TK_20_41_FanJingShan$"
 building_TK_20_41_FanJingShan_desc: "梵净山史载于汉代，称为三山谷，是“武陵蛮”崇拜的神山、圣山。；唐代改称辰山；宋代称思邛山，佛教传入后改称梵净山。明初，梵净山已是佛教名山，同有数名并称：“九龙山”“饭甑山”“梵净山”“大佛山”。清代，梵净山称“月镜山”“卓山”。"
 building_type_TK_20_41_KongDongShan: "名山"
 building_type_TK_20_41_KongDongShan_desc: "名山"
 TK_20_41_KongDongShan: "崆峒山"
 building_TK_20_41_KongDongShan: "$TK_20_41_KongDongShan$"
 building_TK_20_41_KongDongShan_desc: "崆峒山最早史载于春秋《尔雅》：“北戴斗极为崆峒”，一般注释为山名；西晋经学博士孔晃所著的《周书》解字：崆峒应是周时一个强大氏族部落的名称，又有商代始祖契的后代分封于空桐，当地有山故名崆峒山。《庄子》载黄帝问道于崆峒山仙人广成子，所以崆峒山早期就成为了道教名山之一，有“中华道教第一山”的美誉；后崆峒山“三教洞”祀孔子、老子和释迦牟尼，儒、释、道“三教”融合共存于崆峒山，后誉称中国最美宗教名山之一。"
 building_type_TK_20_41_XuanWuShan: "名山"
 building_type_TK_20_41_XuanWuShan_desc: "名山"
 TK_20_41_XuanWuShan: "玄武山"
 building_TK_20_41_XuanWuShan: "$TK_20_41_XuanWuShan$"
 building_TK_20_41_XuanWuShan_desc: "玄武山早期为碣石镇乡民在北郊的山岗，奉“北极玄武，元天上帝”之神像建小庙；明洪武二十七年（1394年），碣石卫总兵建筑碣石卫城时，将小庙改建为“玄武庙”；后碣石卫总又扩玄武庙，始称“玄山寺”，其中居僧礼佛，香火日盛。随着庙宇的扩建和兴旺，“玄山寺”及“玄武”（元天上帝别号）之名开始传播，而民间则把山和庙统称为“玄武山”，并有“玄山寺”、“玄武山寺”称谓。"
 building_type_TK_20_41_YanDangShan: "名山"
 building_type_TK_20_41_YanDangShan_desc: "名山"
 TK_20_41_YanDangShan: "雁荡山"
 building_TK_20_41_YanDangShan: "$TK_20_41_YanDangShan$"
 building_TK_20_41_YanDangShan_desc: "雁荡山，简称雁山、雁岩；雁荡山分为南雁荡山和北雁荡山，瓯江断裂以北称为北雁荡，以南称为南雁荡，这里是指北雁荡山，北雁荡山自古就有“寰中绝胜”之誉，是全国十大名山之一。雁荡，原意是指鸿雁栖息的水荡，说的是原雁荡山西部高峰顶上的一个湖--雁湖，湖因遭淤塞长草而改名称雁荡，后逐渐将此山作雁荡山山名。"
 building_type_TK_20_41_SanQingShan: "名山"
 building_type_TK_20_41_SanQingShan_desc: "名山"
 TK_20_41_SanQingShan: "三清山"
 building_TK_20_41_SanQingShan: "$TK_20_41_SanQingShan$"
 building_TK_20_41_SanQingShan_desc: "三清山又名少华山、丫山，因玉京、玉虚、玉华三峰宛如道教玉清、上清、太清三位尊神列坐山巅而得名。三清山道教始于晋代葛洪于山结庐炼丹，葛洪便成了三清山的“开山始祖”。唐宋道教大兴时相继扩建老子宫观、葛仙观等“三清福地”，历朝皆有扩建引入，又因与龙虎山相近，方士交流频繁密切，三清山教务又受到天师府控制，道教活动日益鼎盛，山上道教建筑也如雨后春笋般大量出现，三清山逐渐成为了道教名山。"
 building_type_TK_20_41_LaoShan: "名山"
 building_type_TK_20_41_LaoShan_desc: "名山"
 TK_20_41_LaoShan: "崂山"
 building_TK_20_41_LaoShan: "$TK_20_41_LaoShan$"
 building_TK_20_41_LaoShan_desc: "崂山古代又曾称牢山、劳山、鳌山等，是中国旅游名山，也是中国海岸线第一高峰，有着海上“第一名山”之称。崂山是中国道教重要发祥地之一，有“道教全真天下第二丛林”之美誉，盛时有“九宫八观七十二庵”之说。自春秋时期，崂山就聚集了一批长期从事养生修身的方士之流，明代志书曾载“吴王夫差尝登崂山得灵宝度人经”。到战国后期，崂山已成为享誉海内的“东海仙山”。"
 building_type_TK_20_41_ZhongNanShan: "名山"
 building_type_TK_20_41_ZhongNanShan_desc: "名山"
 TK_20_41_ZhongNanShan: "终南山"
 building_TK_20_41_ZhongNanShan: "$TK_20_41_ZhongNanShan$"
 building_TK_20_41_ZhongNanShan_desc: "终南山，又名太乙山、地肺山、中南山、周南山，简称南山，古城长安（西安）之南，“寿比南山”、“终南捷径”等典故的诞生地，是中国重要的地理标志。素有“仙都”、“洞天之冠”和“天下第一福地”的美称。长期以来，由于终南山隐居修炼的高道大德辈出，道法道术日显，促进了道门分化衍生出楼观派、钟吕金丹派、全真派等；终南山也因高道云集、仙人出没自然形成道教诸多神仙信仰的发源地。"
 building_type_TK_20_41_MangDangShan: "名山"
 building_type_TK_20_41_MangDangShan_desc: "名山"
 TK_20_41_MangDangShan: "芒砀山"
 building_TK_20_41_MangDangShan: "$TK_20_41_MangDangShan$"
 building_TK_20_41_MangDangShan_desc: "芒砀山是上古时期著名的采石场，黄帝曾到芒砀山巡视，蚩尤曾在此活动。汉时皇帝多分封梁国，梁国诸侯王将芒砀山视为最终归宿，多建墓室，也因此后世多有盗墓文化兴盛于此，比如汉末曹操设立了摸金校尉、发丘将军等盗取汉梁王墓群宝物。"
 building_type_TK_20_41_KunLunShan: "名山"
 building_type_TK_20_41_KunLunShan_desc: "名山"
 TK_20_41_KunLunShan: "昆仑山"
 building_TK_20_41_KunLunShan: "$TK_20_41_KunLunShan$"
 building_TK_20_41_KunLunShan_desc: "昆仑山，又称昆仑虚、昆仑丘或玉山。中国道教文化里，昆仑山被誉为“万山之祖”，是中国古神话中的神山，道教奉为神仙所居的仙山。中国古老的地理著作《山海经》、《禹贡》和《水经注》中对昆仑山都不只一次提到，其中大多记述都带有神奇的色彩。"
 building_type_TK_20_41_QiLianDaXueShan: "名山"
 building_type_TK_20_41_QiLianDaXueShan_desc: "名山"
 TK_20_41_QiLianDaXueShan: "祁连大雪山"
 building_TK_20_41_QiLianDaXueShan: "$TK_20_41_QiLianDaXueShan$"
 building_TK_20_41_QiLianDaXueShan_desc: "祁连大雪山是祁连山的中断块而成的一个完整的小山地，最高峰5483米，是祁连山北端最高的山体。大雪山东界疏勒河峡谷，南临野马河谷地，西至公岔达阪山口，由于地处西北气流直下的要冲，高山降水丰富，水草丰盛，北边昌马盆地成美丽的高山牧场。这里也是金庸小说中雪山派的原型地。"
 building_type_TK_20_41_ZhuMuLangMaFeng: "名山"
 building_type_TK_20_41_ZhuMuLangMaFeng_desc: "名山"
 TK_20_41_ZhuMuLangMaFeng: "珠穆朗玛峰"
 building_TK_20_41_ZhuMuLangMaFeng: "$TK_20_41_ZhuMuLangMaFeng$"
 building_TK_20_41_ZhuMuLangMaFeng_desc: "珠穆朗玛峰简称珠峰。朱母朗马是藏语的音译，阿林是满语，意为“山峰”。在西藏佛经里，“朱母”是女神，“朗马”有“高山柳”“母象”“第三”等多种意思，因珠穆朗玛峰附近还有四座山峰，珠穆朗玛峰位居第三，故称“女神第三”或“第三女神”。“珠穆朗玛”也有多种文化含义：“天地之母”“圣母之地”“长寿五天女所居住的宫室”等。如果将“朱母朗马阿林”意译出来，就是“神女峰”。"
 building_type_TK_20_41_BaiTouShan: "名山"
 building_type_TK_20_41_BaiTouShan_desc: "名山"
 TK_20_41_BaiTouShan: "白头山"
 building_TK_20_41_BaiTouShan: "$TK_20_41_BaiTouShan$"
 building_TK_20_41_BaiTouShan_desc: "长白山是作为中国十大名山之一并与五岳齐名、名光秀丽、景色迷人的关东第一山。以长白山天池为代表，集瀑布、温泉、峡谷、地下森林、火山熔岩林、高山大花园、地下河、原始森林、云雾、冰雪等旅游景观为一体，构成了一道亮丽迷人的风景线。"
 building_type_TK_20_41_WuLiangShan: "名山"
 building_type_TK_20_41_WuLiangShan_desc: "名山"
 TK_20_41_WuLiangShan: "无量山"
 building_TK_20_41_WuLiangShan: "$TK_20_41_WuLiangShan$"
 building_TK_20_41_WuLiangShan_desc: "无量山古称蒙乐山，无量山气候多以亚热带季风气候为主，山高形成垂直带谱发育，动植物资源丰富。这里是金庸武侠小说无量剑派的原型地。"
 building_type_TK_20_41_DianCangShan: "名山"
 building_type_TK_20_41_DianCangShan_desc: "名山"
 TK_20_41_DianCangShan: "点苍山"
 building_TK_20_41_DianCangShan: "$TK_20_41_DianCangShan$"
 building_TK_20_41_DianCangShan_desc: "点苍山简称苍山，因含苍翠黛绿之意，故名点苍山，在古籍中又有玷苍山、熊苍山、大理山之称。点苍山是“大理岩”和“大理冰期”的命名地，云南省滇西北生物多样性最丰富的地区之一；同时也是武侠小说点苍派的驻地。"
 building_type_TK_20_41_YaoShan: "名山"
 building_type_TK_20_41_YaoShan_desc: "名山"
 TK_20_41_YaoShan: "尧山"
 building_TK_20_41_YaoShan: "$TK_20_41_YaoShan$"
 building_TK_20_41_YaoShan_desc: "尧山得名很早，《山海经》中有“大尧之山”之称，关于称名尧山的原因，曾做过鲁阳太守的我国著名的地理学者北魏郦道元就认为：“鲁县立尧祠於西山，谓之尧山也。”即尧山因尧帝裔孙刘累祭祖立尧祠于此而得名。尧山是刘姓御龙堂的发源地，也是战国时期思想家墨子的故里。"
 building_type_TK_20_41_LangJiXuShan: "名山"
 building_type_TK_20_41_LangJiXuShan_desc: "名山"
 TK_20_41_LangJiXuShan: "狼居胥山"
 building_TK_20_41_LangJiXuShan: "$TK_20_41_LangJiXuShan$"
 building_TK_20_41_LangJiXuShan_desc: "狼居胥山，古山名，汉元狩四年（公元前一一九年），西汉大将霍去病出兵漠北攻打匈奴，取得大胜，封狼居胥山。封狼居胥成为后世将军抵御外族建功立业的崇高理想之一。"
 building_type_TK_20_41_ZiJinShan: "名山"
 building_type_TK_20_41_ZiJinShan_desc: "名山"
 TK_20_41_ZiJinShan: "紫金山"
 building_TK_20_41_ZiJinShan: "$TK_20_41_ZiJinShan$"
 building_TK_20_41_ZiJinShan_desc: "紫金山，古名金陵山，汉称钟山。三国时孙权为避祖讳，改名蒋山。据说晋元帝司马睿南渡后，因常见山顶紫气缭绕，自此始称紫金山。南朝曾称北山、圣游山，明嘉靖帝为纪念太祖朱元璋，亦曾改为神烈山，是宁镇山脉的最高峰。紫金山是南京的母亲山，也是江南四大名山之一，有“金陵毓秀”的美誉。"
 building_type_TK_20_41_JinGangShan: "名山"
 building_type_TK_20_41_JinGangShan_desc: "名山"
 TK_20_41_JinGangShan: "金刚山"
 building_TK_20_41_JinGangShan: "$TK_20_41_JinGangShan$"
 building_TK_20_41_JinGangShan_desc: "金刚山是位于朝鲜和韩国交界的山脉，大部分山峰位于朝鲜境内，素有朝鲜第一山之称。其山由花岗岩组成，主峰海拔1638米，为太白山的最高峰。另外金刚山按季节享有各种美称，春天的奇景像纯净透明的金刚石，名为金刚山，夏季因它与蓬莱相媲美，名为蓬莱山，秋日漫山红叶如丹，名为枫岳山，冬天奇岩怪石，瘦骨零丁，名为皆骨山。"
 building_type_TK_20_41_FuShiShan: "名山"
 building_type_TK_20_41_FuShiShan_desc: "名山"
 TK_20_41_FuShiShan: "富士山"
 building_TK_20_41_FuShiShan: "$TK_20_41_FuShiShan$"
 building_TK_20_41_FuShiShan_desc: "富士山本为火山，古代日本人祭拜的神山之一，其名字由来统计有超150种叫法。富士山这个文字组合最初出现于平安时期的《续日本纪》：“天应元年七月六日，骏河国言。富士山下雨灰。”而现在意思上使用的“富士山”其含义是“对士来说是富有的山”之意。这是武士道草创期的镰仓时代生出的意思。"
 building_type_TK_20_50_ChangBaiShanTianChi: "湖泊水泽"
 building_type_TK_20_50_ChangBaiShanTianChi_desc: "湖泊水泽"
 TK_20_50_ChangBaiShanTianChi: "长白山天池"
 building_TK_20_50_ChangBaiShanTianChi: "$TK_20_50_ChangBaiShanTianChi$"
 building_TK_20_50_ChangBaiShanTianChi_desc: "长白山天池又称白头山天池，是中国境内保存最为完整的新生代多成因复合火山湖，也是世界上“海拔最高的火山湖”。据《长白山江冈志略》记载：“天池在长白山巅的中心点，群峰环抱，离地高约20余里，故名为天池。”天池周围火山口壁陡峭，并形成十几座环状山山峰，海拔均在2500米以上，长白山天池也是松花江、鸭绿江以及图们江的发源地，素有“三江之源”的雅称。"
 building_type_TK_20_50_XiHu: "湖泊水泽"
 building_type_TK_20_50_XiHu_desc: "湖泊水泽"
 TK_20_50_XiHu: "西湖"
 building_TK_20_50_XiHu: "$TK_20_50_XiHu$"
 building_TK_20_50_XiHu_desc: "西湖又名钱塘湖，位于中国浙江省杭州市西湖区，为江南三大名湖之一。西湖南、西、北三面环山，东邻城区，南部和钱塘江隔山相邻，湖中白堤、苏堤、杨公堤、赵公堤将湖面分割成若干水面，湖中有三岛，西湖群山以西湖为中心，由近及远可分为四个层次。西湖自古以来便流传着《白蛇传》《梁山伯与祝英台》《苏小小》等民间传说和神话故事。白蛇传中的“断桥相会”“白娘子被压雷峰塔”等情节与西湖十景有着联系。"
 building_type_TK_20_50_QingHaiHu: "湖泊水泽"
 building_type_TK_20_50_QingHaiHu_desc: "湖泊水泽"
 TK_20_50_QingHaiHu: "青海湖"
 building_TK_20_50_QingHaiHu: "$TK_20_50_QingHaiHu$"
 building_TK_20_50_QingHaiHu_desc: "青海湖古称“西海”，又称“仙海”“鲜水海”“卑禾羌海”。北魏以后，始称青海。蒙语称“库库诺尔”，意皆为蓝色或青色的湖。青海湖之名始于近代，1949年后才普遍称青海湖。青海湖是中国面积最大的高原内陆咸水湖，也是是世界上海拔最高的湖泊之一。"
 building_type_TK_20_50_YunMengZe: "湖泊水泽"
 building_type_TK_20_50_YunMengZe_desc: "湖泊水泽"
 TK_20_50_YunMengZe: "云梦泽"
 building_TK_20_50_YunMengZe: "$TK_20_50_YunMengZe$"
 building_TK_20_50_YunMengZe_desc: "云梦泽又称云梦大泽，中国湖北省江汉平原上的古代湖泊群的总称。先秦时这一湖群的范围周长约450公里。后因长江和汉水带来的泥沙不断沉积，汉江三角洲不断伸展，云梦泽范围逐渐减小。魏晋南北朝时期已缩小一半，唐宋时解体为星罗棋布的小湖群。此后有的小湖逐渐淤平，有的则有扩展，洪湖就是在清中叶以后迅速扩展成的大湖。如今，云梦泽古代湖泊群，已消褪为一些相互分离的湖泊。"
 building_type_TK_20_50_DongTingHu: "湖泊水泽"
 building_type_TK_20_50_DongTingHu_desc: "湖泊水泽"
 TK_20_50_DongTingHu: "洞庭湖"
 building_TK_20_50_DongTingHu: "$TK_20_50_DongTingHu$"
 building_TK_20_50_DongTingHu_desc: "洞庭湖历史上有云梦、云梦泽、九江、五渚、五湖、三湖、重湖、太湖之称，是古云梦泽的南部部分。《湘妃庙记略》称：“洞庭盖神仙洞府之一也，以其为洞庭之庭，故曰洞庭。后世以其汪洋一片，洪水滔天，无得而称，遂指洞庭之山以名湖曰洞庭湖。”这就是洞庭湖名称的由来。"
 building_type_TK_20_50_TaiHu: "湖泊水泽"
 building_type_TK_20_50_TaiHu_desc: "湖泊水泽"
 TK_20_50_TaiHu: "太湖"
 building_TK_20_50_TaiHu: "$TK_20_50_TaiHu$"
 building_TK_20_50_TaiHu_desc: "太湖位于长江三角洲的南缘，古称震泽、具区，又名五湖、笠泽，是中国五大淡水湖之一。春秋战国以前，太湖地区原是陆地的冲积平原；唐代湖水可达吴江塘岸。按照海迹湖，地理上称“泻湖”构成来说，由于江口三角洲不断淤积封闭形成了闭塞湖，加之河水雨水流入逐年淡化，最终形成淡水湖，因此也有人称太湖为“海的儿子”。"
 building_type_TK_20_50_ChaoHu: "湖泊水泽"
 building_type_TK_20_50_ChaoHu_desc: "湖泊水泽"
 TK_20_50_ChaoHu: "巢湖"
 building_TK_20_50_ChaoHu: "$TK_20_50_ChaoHu$"
 building_TK_20_50_ChaoHu_desc: "巢湖又称焦湖，传说后人因敬仰焦姥舍己救人的高尚品德，遂命名为“焦湖”，湖中的一山也被命名为“姥山”。巢湖是我国五大淡水湖之一，宛如一面宝镜镶嵌在江淮大地，有“八百里湖天”之称。"
 building_type_TK_20_50_PoYangHu: "湖泊水泽"
 building_type_TK_20_50_PoYangHu_desc: "湖泊水泽"
 TK_20_50_PoYangHu: "鄱阳湖"
 building_TK_20_50_PoYangHu: "$TK_20_50_PoYangHu$"
 building_TK_20_50_PoYangHu_desc: "鄱阳湖，古称彭蠡泽、彭泽、官亭湖、扬澜、担石湖，是中国第一大淡水湖，也是中国第二大湖，仅次于青海湖。《舆地纪胜》卷23饶州载，“湖中有鄱阳山，故名鄱阳湖。其湖绵亘数百里，亦名彭蠡湖”。《读史方舆纪要》亦称鄱阳湖是“炀帝时，以鄱阳山所接，兼有鄱阳之称”。不管是以地为名还是以山为名皆和鄱阳山有关，所以鄱阳湖之名应为岁时开始称谓。"
 building_type_TK_20_50_RiYueTan: "湖泊水泽"
 building_type_TK_20_50_RiYueTan_desc: "湖泊水泽"
 TK_20_50_RiYueTan: "日月潭"
 building_TK_20_50_RiYueTan: "$TK_20_50_RiYueTan$"
 building_TK_20_50_RiYueTan_desc: "日月潭旧称水沙连、龙湖、水社大湖、珠潭、双潭，亦名水里社，因其中有一小岛远望好像浮在水面上的一颗珠子，名拉鲁岛，以此岛为界，北半湖形状如圆日，南半湖形状如弯月，日月潭因此而得名。"
 building_type_TK_20_50_YueYaQuan: "湖泊水泽"
 building_type_TK_20_50_YueYaQuan_desc: "湖泊水泽"
 TK_20_50_YueYaQuan: "月牙泉"
 building_TK_20_50_YueYaQuan: "$TK_20_50_YueYaQuan$"
 building_TK_20_50_YueYaQuan_desc: "月牙泉在汉代时称为沙井，唐代时称药泉，清代始称月牙泉，因形状酷似一弯新月而得名。历史上，月牙泉南岸从东到西曾有娘娘殿、龙王宫、菩萨楼、药王洞、玉泉阁、雷神台及经堂共百余间，后来被毁。在民间，自汉唐以来，当地百姓就有在月牙泉“龙舟竞渡”的风俗习惯，清代后又有农历四月二十八举行“药王”庙会和六月六在泉边采集艾草、煎汤沐浴和月牙瑶池蟠桃会等民俗活动。"
 building_type_TK_20_50_LuGuHu: "湖泊水泽"
 building_type_TK_20_50_LuGuHu_desc: "湖泊水泽"
 TK_20_50_LuGuHu: "泸沽湖"
 building_TK_20_50_LuGuHu: "$TK_20_50_LuGuHu$"
 building_TK_20_50_LuGuHu_desc: "泸沽湖古名勒得海、鲁枯湖，纳西族摩梭语“泸”为山沟，“沽”为里，意即山沟里的湖。又因西岸盐源县元、明、清三代设左所土司千户所，解放后设左所自治区，又名左所海，俗称亮海，泸沽湖。"
 building_type_TK_20_50_SaiLiMuHu: "湖泊水泽"
 building_type_TK_20_50_SaiLiMuHu_desc: "湖泊水泽"
 TK_20_50_SaiLiMuHu: "赛里木湖"
 building_TK_20_50_SaiLiMuHu: "$TK_20_50_SaiLiMuHu$"
 building_TK_20_50_SaiLiMuHu_desc: "赛里木湖古称“净海”，因湖水清澈透底而名。赛里木湖由于地形闭塞、湖水低温清澈，故而没有鱼类迁徙条件和生存条件，直至1998年从俄罗斯引进高白鲑、凹目白鲑等冷水鱼养殖才有了鱼类，而且经过10多年发展，赛里木湖已成为新疆重要的冷水鱼生产基地。"
 building_type_TK_20_51_HuangGuoShuPuBu: "瀑布激流"
 building_type_TK_20_51_HuangGuoShuPuBu_desc: "瀑布激流"
 TK_20_51_HuangGuoShuPuBu: "黄果树瀑布"
 building_TK_20_51_HuangGuoShuPuBu: "$TK_20_51_HuangGuoShuPuBu$"
 building_TK_20_51_HuangGuoShuPuBu_desc: "黄果树瀑布即黄果树大瀑布；古称白水河瀑布，亦名“黄葛墅”瀑布或“黄葛树”瀑布，贵州民间自古以来就流传有黄果树瀑布的神话故事，黄果树瀑布的名称就来自这个神话故事中结“黄果”的树。黄果树瀑布出名始于明代旅行家徐霞客，经过历代名人的游历、传播，成为知名景点。"
 building_type_TK_20_51_HuKouPuBu: "瀑布激流"
 building_type_TK_20_51_HuKouPuBu_desc: "瀑布激流"
 TK_20_51_HuKouPuBu: "壶口瀑布"
 building_TK_20_51_HuKouPuBu: "$TK_20_51_HuKouPuBu$"
 building_TK_20_51_HuKouPuBu_desc: "壶口瀑布是中国第二大瀑布，世界上最大的黄色瀑布。黄河奔流至此，两岸石壁峭立，河口收束狭如壶口，故名壶口瀑布。瀑布将上游300米款的合面在500米内压缩到20-30米宽度，并从20多米高的陡崖倾泻而下，形成为了“千里黄河一壶收”的奇景。"
 building_type_TK_20_52_QinHuaiHe: "水上风光"
 building_type_TK_20_52_QinHuaiHe_desc: "水上风光"
 TK_20_52_QinHuaiHe: "秦淮河"
 building_TK_20_52_QinHuaiHe: "$TK_20_52_QinHuaiHe$"
 building_TK_20_52_QinHuaiHe_desc: "秦淮河，古称龙藏浦，汉代起称淮水，唐以后改称秦淮，实是唐杜牧《泊秦淮》诗行世后，秦淮河之名始盛于天下。秦淮河还是城市景观的重要组成部分，其内侧的秦淮河被誉为“十里秦淮”，沿岸文旅景点众多，包括夫子庙瞻园、愚园、中华门等。"
 building_type_TK_20_52_MiLuoJiang: "水上风光"
 building_type_TK_20_52_MiLuoJiang_desc: "水上风光"
 TK_20_52_MiLuoJiang: "汨罗江"
 building_TK_20_52_MiLuoJiang: "$TK_20_52_MiLuoJiang$"
 building_TK_20_52_MiLuoJiang_desc: "汨罗江因主河道汨水和支流罗水相汇得名，《水经注》称㵋水。汨罗江的出名，主要是因屈原的关系。战国末期，楚国著名的政治家、诗人屈原被流放时，曾在汨罗江畔的玉笥山上住过。公元前278年，楚国都城郢（今湖北荆州市）被秦军攻破，屈原感到救国无望，投汨罗江而死。"
 building_type_TK_20_52_LiJiang: "水上风光"
 building_type_TK_20_52_LiJiang_desc: "水上风光"
 TK_20_52_LiJiang: "漓江"
 building_TK_20_52_LiJiang: "$TK_20_52_LiJiang$"
 building_TK_20_52_LiJiang_desc: "漓江又称六峒河、大溶江、桂江、丽水、离水、漓水。传统意义上的漓江，起点为桂江源头越城岭猫儿山，现代水文定义为兴安县溶江镇灵渠口，终点为平乐三江口。漓江的文化和旅游资源丰富，上游的灵渠，中下游的桂林山水、岩溶地貌皆为沿岸带来了不菲的经济效益。"
 building_type_TK_20_60_JiuZhaiGou: "综合景区"
 building_type_TK_20_60_JiuZhaiGou_desc: "综合景区"
 TK_20_60_JiuZhaiGou: "九寨沟"
 building_TK_20_60_JiuZhaiGou: "$TK_20_60_JiuZhaiGou$"
 building_TK_20_60_JiuZhaiGou_desc: "九寨沟全称阿坝藏族羌族自治州九寨沟景区；九寨沟的得名来自于景区内九个藏族寨子（树正寨、则查洼寨、黑角寨、荷叶寨、盘亚寨、亚拉寨、尖盘寨、热西寨、郭都寨），这九个寨子又称为“和药九寨”。由于有九个寨子的藏民世代居住于此，故名为“九寨沟”。"
 building_type_TK_20_60_HuangLongJingQu: "综合景区"
 building_type_TK_20_60_HuangLongJingQu_desc: "综合景区"
 TK_20_60_HuangLongJingQu: "黄龙景区"
 building_TK_20_60_HuangLongJingQu: "$TK_20_60_HuangLongJingQu$"
 building_TK_20_60_HuangLongJingQu_desc: "黄龙景区是中国唯一保护完好的高原湿地，在一条由南向北逐渐隆起的山脊上。黄龙地名由来，涪源桥是龙尾，五彩池为龙首，彩池如龙鳞泛金；滩流、瀑布如龙爪舞动，黄龙之名，由此而得。其核心区域点缀着三千多个彩池，以结构奇巧、色彩丰艳的地表钙华景观为主景；由黄龙沟、丹云峡、牟尼沟、雪宝鼎、红军长征纪念碑碑园等组成。"
 building_type_TK_20_61_CangShanErHai: "水光山色"
 building_type_TK_20_61_CangShanErHai_desc: "水光山色"
 TK_20_61_CangShanErHai: "苍山洱海"
 building_TK_20_61_CangShanErHai: "$TK_20_61_CangShanErHai$"
 building_TK_20_61_CangShanErHai_desc: "苍山洱海由苍山、洱海两部分组成；苍山又名点苍山，古籍中另有玷苍山、熊苍山、大理山之称；洱海古代文献中曾称为叶榆泽、昆弥川、西洱河、西二河等；大理古城西靠苍山，东临洱海构成了大理难得一遇的自然风景。"
 building_type_TK_20_61_TianYaHaiJiao: "水光山色"
 building_type_TK_20_61_TianYaHaiJiao_desc: "水光山色"
 TK_20_61_TianYaHaiJiao: "天涯海角"
 building_TK_20_61_TianYaHaiJiao: "$TK_20_61_TianYaHaiJiao$"
 building_TK_20_61_TianYaHaiJiao_desc: "天涯海角因景区两块巨石分别刻有“天涯”“海角”及郭沫若先生题写的“天涯海角游览区”而得名。景区的自然景观是由大型海滩岩、下马岭、天涯湾以及沙滩和海水组成。游览区主要有“天涯”石、“海角”石、“南天一柱”等景点。"
 building_type_TK_20_61_CaiShiJi: "水光山色"
 building_type_TK_20_61_CaiShiJi_desc: "水光山色"
 TK_20_61_CaiShiJi: "采石矶"
 building_TK_20_61_CaiShiJi: "$TK_20_61_CaiShiJi$"
 building_TK_20_61_CaiShiJi_desc: "采石矶全称马鞍山市长江采石矶文化生态旅游区，简称采石矶景区。采石矶古称牛渚矶，绝壁临江、水湍石奇、与岳阳城陵矶、南京燕子矶并称“长江三矶”。因集“雄、奇、秀、险”于一身，被誉为三矶之首，素有千古一秀的美称。"
 building_type_TK_20_61_GuLangYu: "水光山色"
 building_type_TK_20_61_GuLangYu_desc: "水光山色"
 TK_20_61_GuLangYu: "鼓浪屿"
 building_TK_20_61_GuLangYu: "$TK_20_61_GuLangYu$"
 building_TK_20_61_GuLangYu_desc: "鼓浪屿原名“圆沙洲”，别名“圆洲仔”，南宋时，它的名字是“五龙屿”，明朝改称“鼓浪屿”。乃因岛西南方有一礁石，每当涨潮水涌，浪击礁石，声似擂鼓，人们称“鼓浪石”，鼓浪屿因此而得名。"
 building_type_TK_20_61_KeKeXiLi: "水光山色"
 building_type_TK_20_61_KeKeXiLi_desc: "水光山色"
 TK_20_61_KeKeXiLi: "可可西里"
 building_TK_20_61_KeKeXiLi: "$TK_20_61_KeKeXiLi$"
 building_TK_20_61_KeKeXiLi_desc: "可可西里基本地貌类型除南北边缘山地为大、中起伏的高山和极高山外广大地区主要为中小起伏的高山和高海拔丘陵、台地和平原。保护区主要是保护藏羚羊、野牦牛、藏野驴、藏原羚等珍稀野生动物，现有高等植物约202种，分属30科102属。动植物资源丰富，是天然的自然保护区。"
 building_type_TK_20_61_LanYanJing: "水光山色"
 building_type_TK_20_61_LanYanJing_desc: "水光山色"
 TK_20_61_LanYanJing: "蓝眼睛"
 building_TK_20_61_LanYanJing: "$TK_20_61_LanYanJing$"
 building_TK_20_61_LanYanJing_desc: "贝加尔湖中国古称北海，被誉为“西伯利亚的蓝眼睛”，有“西伯利亚明珠”之称。冬季，贝加尔湖的冰面宛如一面巨大的镜子，会出现各种奇妙的裂纹和蓝冰景观。这些蓝冰在阳光的照耀下，呈现出梦幻般的色彩，宛如一块巨大的蓝宝石，吸引着众多摄影爱好者前来捕捉这美丽瞬间。"
 building_type_TK_20_62_XuanLanJiGuang: "自然景观"
 building_type_TK_20_62_XuanLanJiGuang_desc: "自然景观"
 TK_20_62_XuanLanJiGuang: "绚烂极光"
 building_TK_20_62_XuanLanJiGuang: "$TK_20_62_XuanLanJiGuang$"
 building_TK_20_62_XuanLanJiGuang_desc: "极光源于拉丁文伊欧斯一词，传说伊欧斯是希腊神话中“黎明”的化身；在芬兰语中，北极光直译过来则是狐狸之火。部分萨米人和西伯利亚人相信北极光来自于逝者的创伤，不过这多彩的天空并不是痛苦的征兆，相反的，而是幽灵们在后世玩球类运动或骑马奔跑时受伤所留下的血迹。"
 building_type_TK_20_62_ChiLeChuan: "自然景观"
 building_type_TK_20_62_ChiLeChuan_desc: "自然景观"
 TK_20_62_ChiLeChuan: "敕勒川"
 building_TK_20_62_ChiLeChuan: "$TK_20_62_ChiLeChuan$"
 building_TK_20_62_ChiLeChuan_desc: "敕勒川本为敕勒民族居住处之意，但一般认为是指出自鲜卑语译成汉语的北朝乐府民歌《敕勒歌》描述的“天苍苍，野茫茫，风吹草低见牛羊”的美丽草原风景。"
 building_type_TK_20_62_DaoChengYaDingJingQu: "自然景观"
 building_type_TK_20_62_DaoChengYaDingJingQu_desc: "自然景观"
 TK_20_62_DaoChengYaDingJingQu: "稻城亚丁景区"
 building_TK_20_62_DaoChengYaDingJingQu: "$TK_20_62_DaoChengYaDingJingQu$"
 building_TK_20_62_DaoChengYaDingJingQu_desc: "稻城亚丁景区藏语名为“念青贡嘎日松贡布”，意为“三座护法大雪山之圣地”。亚丁景区内北峰“仙乃日”意为观音菩萨，南峰“央迈勇”意为文殊菩萨，东峰“夏诺多吉”意为金刚手菩萨。稻城亚丁景区因其独特的地貌和原生态的自然风光，被誉为“中国香格里拉之魂”，被国际友人誉为“水蓝色星球上的最后一片净土”，是摄影爱好者的天堂。"
 building_type_TK_20_62_ShuNanZhuHai: "自然景观"
 building_type_TK_20_62_ShuNanZhuHai_desc: "自然景观"
 TK_20_62_ShuNanZhuHai: "蜀南竹海"
 building_TK_20_62_ShuNanZhuHai: "$TK_20_62_ShuNanZhuHai$"
 building_TK_20_62_ShuNanZhuHai_desc: "蜀南竹海原名万岭箐，内有竹海博物馆、花溪十三桥、海中海等自然景观和古刹等人文景观。拥有世界上集中面积最大的天然竹林，人称“蜀南竹海”。"
 building_type_TK_20_62_LinZhiTaoHuaYuan: "自然景观"
 building_type_TK_20_62_LinZhiTaoHuaYuan_desc: "自然景观"
 TK_20_62_LinZhiTaoHuaYuan: "林芝桃花源"
 building_TK_20_62_LinZhiTaoHuaYuan: "$TK_20_62_LinZhiTaoHuaYuan$"
 building_TK_20_62_LinZhiTaoHuaYuan_desc: "林芝桃花源位于西藏林芝，当地桃花繁盛似锦，江水碧绿如玉，雪山挣脱云雾的缠绕，俊美而挺拔，被誉为雪域高原的小江南。"
 building_type_TK_20_62_LinHaiXueYuan: "自然景观"
 building_type_TK_20_62_LinHaiXueYuan_desc: "自然景观"
 TK_20_62_LinHaiXueYuan: "林海雪原"
 building_TK_20_62_LinHaiXueYuan: "$TK_20_62_LinHaiXueYuan$"
 building_TK_20_62_LinHaiXueYuan_desc: "林海雪原让我们看到山的宁静、雪的洁白，走进寂静的山林，踏入及膝的雪径，在从天而降的雪道上飞驰，在童话般的雪堡中嬉戏，这里是雪的世界，这里是银色的乐园。林海雪原是指黑龙江省东南部长白山支脉张广才岭及其周边地区，地貌以山地、浅山、丘陵为主，素有“九山半水半分田”之称。"
 building_type_TK_20_63_WuXia: "河谷风光"
 building_type_TK_20_63_WuXia_desc: "河谷风光"
 TK_20_63_WuXia: "巫峡"
 building_TK_20_63_WuXia: "$TK_20_63_WuXia$"
 building_TK_20_63_WuXia_desc: "巫峡自巫山县城东大宁河起，至巴东县官渡口止，全长46公里，有大峡之称。巫峡绮丽幽深，以俊秀著称天下，两岸群峰，它们各具特色。有诗曰：巴东三峡巫峡长，猿鸣三声泪沾裳。"
 building_type_TK_20_63_YiLiHeGu: "河谷风光"
 building_type_TK_20_63_YiLiHeGu_desc: "河谷风光"
 TK_20_63_YiLiHeGu: "伊犁河谷"
 building_TK_20_63_YiLiHeGu: "$TK_20_63_YiLiHeGu$"
 building_TK_20_63_YiLiHeGu_desc: "伊犁河谷位于中国天山山脉西部，三面环山，构成“三山夹两谷”的地貌轮廓。河谷气候温和湿润，植被资源丰富；雪峰巍峨、冰川瑰丽、草原无垠、林海苍茫，自然风光绮丽。伊犁河谷素有“西域湿岛”“塞外江南”之美称。"
 building_type_TK_20_63_YaLuCangBuDaXiaGu: "河谷风光"
 building_type_TK_20_63_YaLuCangBuDaXiaGu_desc: "河谷风光"
 TK_20_63_YaLuCangBuDaXiaGu: "雅鲁藏布大峡谷"
 building_TK_20_63_YaLuCangBuDaXiaGu: "$TK_20_63_YaLuCangBuDaXiaGu$"
 building_TK_20_63_YaLuCangBuDaXiaGu_desc: "雅鲁藏布大峡谷是世界上最大、最深的峡谷，是世界第一大峡谷。整个峡谷地区冰川、绝壁、陡坡、泥石流和巨浪滔天的大河交错在一起，环境十分恶劣。许多地区至今仍无人涉足，堪称“地球上最后的秘境”，是地质工作少有的空白区之一。"
 building_type_TK_20_64_ZhangYeDanXiaDiMao: "地貌景观"
 building_type_TK_20_64_ZhangYeDanXiaDiMao_desc: "地貌景观"
 TK_20_64_ZhangYeDanXiaDiMao: "张掖丹霞地貌"
 building_TK_20_64_ZhangYeDanXiaDiMao: "$TK_20_64_ZhangYeDanXiaDiMao$"
 building_TK_20_64_ZhangYeDanXiaDiMao_desc: "张掖丹霞地貌位于临泽倪家营南台村，距张掖市40公里。在方圆一百平方山地丘陵地带，有造型奇特，色彩斑谰，气势磅礴的丹霞地貌。丹霞是指红色砂砾岩经长期风化剥离和流水侵蚀，形成的孤立的山峰和陡峭的奇岩怪石。这里的丹霞地貌是中国干旱地区最典型和面积最大的丹霞地貌景观。"
 building_type_TK_20_64_BaDanJiLinShaMo: "地貌景观"
 building_type_TK_20_64_BaDanJiLinShaMo_desc: "地貌景观"
 TK_20_64_BaDanJiLinShaMo: "巴丹吉林沙漠"
 building_TK_20_64_BaDanJiLinShaMo: "$TK_20_64_BaDanJiLinShaMo$"
 building_TK_20_64_BaDanJiLinShaMo_desc: "巴丹吉林沙漠是中国第三大沙漠、第二大流动沙漠。主要景点有巴丹湖、巴丹吉林庙、必鲁图沙山等，是观光戈壁与沙漠的极好景点。"
 building_type_TK_20_64_GuiLinQiXingYan: "地貌景观"
 building_type_TK_20_64_GuiLinQiXingYan_desc: "地貌景观"
 TK_20_64_GuiLinQiXingYan: "桂林七星岩"
 building_TK_20_64_GuiLinQiXingYan: "$TK_20_64_GuiLinQiXingYan$"
 building_TK_20_64_GuiLinQiXingYan_desc: "桂林七星岩因七星山而得名，又叫栖霞洞、碧虚岩，在普陀山西侧山腰。是桂林旅游景点溶洞中较为出名的一个岩洞，位于桂林七星公园内，原来是一段地下河，至今已有百万余年历史。在漫长的岁月里，雨水沿洞顶不断渗入，溶解石灰石，并在洞内结晶，于是形成了千姿百态，玉雪晶莹的石钟乳、石柱、石笋、石幔。七星岩分上、中、下三层。上层仅存老君台等残存的洞迹，下层是脚下仍在发育的地下河，现在供游览的是中层。"
 building_type_TK_20_64_WuLingYuan: "地貌景观"
 building_type_TK_20_64_WuLingYuan_desc: "地貌景观"
 TK_20_64_WuLingYuan: "武陵源"
 building_TK_20_64_WuLingYuan: "$TK_20_64_WuLingYuan$"
 building_TK_20_64_WuLingYuan_desc: "武陵源是典型的石灰岩喀斯特地貌，经亿万年河流变迁降位侵蚀溶解，形成了无数的溶洞、落水洞、天窗、群泉。由于武陵源地处石英砂岩与石灰岩结合部。景区经亿万年河流变迁降位侵蚀溶解，形成了无数的溶洞、落水洞、天窗、群泉。景区森林覆盖率高，奇峰异石、珍禽异兽多，也成为了著名的电影取景点。"
 building_type_TK_20_64_YunNanShiLin: "地貌景观"
 building_type_TK_20_64_YunNanShiLin_desc: "地貌景观"
 TK_20_64_YunNanShiLin: "云南石林"
 building_TK_20_64_YunNanShiLin: "$TK_20_64_YunNanShiLin$"
 building_TK_20_64_YunNanShiLin_desc: "石林地质公园的岩溶地貌景观根据其发育的程度、组合形态等，可以分化出落水洞、溶斗、溶沟、石柱、石笋、石芽、孤峰、峰林和峰丛等等，对岩溶地貌的研究具有重要的科学价值。石林地质公园遍布岩溶峰林群，奇石拔地而起、千姿百态、巧夺天工，被誉为“天下第一奇观”。"
 building_type_TK_20_64_HaiShangShiLin: "地貌景观"
 building_type_TK_20_64_HaiShangShiLin_desc: "地貌景观"
 TK_20_64_HaiShangShiLin: "海上石林"
 building_TK_20_64_HaiShangShiLin: "$TK_20_64_HaiShangShiLin$"
 building_TK_20_64_HaiShangShiLin_desc: "吉婆岛上遍布落水洞、溶斗、溶沟、石柱、石笋、石芽、孤峰、峰林和峰丛等等岩溶地貌景观，不同于桂林石林，这些景观似乎在海上一样。"
 building_type_TK_20_80_ShouShanTongKuang1Ji: "铜矿"
 building_type_TK_20_80_ShouShanTongKuang1Ji_desc: "铜矿"
 TK_20_80_ShouShanTongKuang1Ji: "首山铜矿Ⅰ级"
 building_TK_20_80_ShouShanTongKuang1Ji: "$TK_20_80_ShouShanTongKuang1Ji$"
 building_TK_20_80_ShouShanTongKuang1Ji_desc: "首山铜矿即《论衡·道虚篇》：“黄帝采首山铜,铸鼎于荆山下.鼎既成,有龙垂胡髯,下迎黄帝。”中所言首山之铜的产地。初级铜矿规模。"
 building_type_TK_20_80_ShouShanTongKuang2Ji: "铜矿"
 building_type_TK_20_80_ShouShanTongKuang2Ji_desc: "铜矿"
 TK_20_80_ShouShanTongKuang2Ji: "首山铜矿Ⅱ级"
 building_TK_20_80_ShouShanTongKuang2Ji: "$TK_20_80_ShouShanTongKuang2Ji$"
 building_TK_20_80_ShouShanTongKuang2Ji_desc: "首山铜矿即《论衡·道虚篇》：“黄帝采首山铜,铸鼎于荆山下.鼎既成,有龙垂胡髯,下迎黄帝。”中所言首山之铜的产地。中级铜矿规模。"
 building_type_TK_20_80_ShouShanTongKuang3Ji: "铜矿"
 building_type_TK_20_80_ShouShanTongKuang3Ji_desc: "铜矿"
 TK_20_80_ShouShanTongKuang3Ji: "首山铜矿Ⅲ级"
