 building_TK_20_87_YuanLingZhuShaKuang1Ji_desc: "沅陵朱砂矿：又称辰州砂，简称辰砂。辰砂之名源于其古代主要产地辰州（今湖南沅陵等地），因其在该产地品质上乘而得名，并逐渐成为全国通用的矿物名称。初级朱砂矿规模。"
