 building_TK_20_81_LinQiongTieKuang2Ji_desc: "临邛铁矿在春秋时期已开始冶炼。《史记货殖列传》记载卓文君的家族当初就在赵国冶铁，后来秦国攻破赵国。卓氏主动请求迁到汶山之下的沃野，到了临邛后即“铁山鼓铸”，运筹策，倾滇蜀之民。秦代在蜀郡设立了铁官，这里说的铁山即指临邛铁矿在内的矿山地点。中级铁矿规模。"
