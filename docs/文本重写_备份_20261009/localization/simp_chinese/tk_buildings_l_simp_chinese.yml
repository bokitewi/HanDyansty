 building_TK_20_85_HeTianYuShiKuang1Ji_desc: "和田玉石矿：中国四大名玉之一，传统狭义范畴特指新疆和田地区出产的玉石，以和田“子料”为代表闻名于世；广义的和田玉指软玉（Nephrite）。和田玉虽然因新疆和田而命名，但其本身不是地域概念，并非特指新疆和田地区出产的玉，而是一类产品的名称。初级玉矿规模。"
