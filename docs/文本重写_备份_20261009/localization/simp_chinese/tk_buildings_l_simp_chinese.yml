 building_TK_20_85_XiuYanYuShiKuang1Ji: "$TK_20_85_XiuYanYuShiKuang1Ji$"
 building_TK_20_85_XiuYanYuShiKuang1Ji_desc: "岫岩玉石矿：也被称为蛇纹岩质玉，中国四大名玉之一。因产于辽宁岫岩而得名，最早的玉名见自西汉《尔雅》：“东方之美者，有医无闾之殉圩琪焉”。岫玉的认识与开发在中国已有长达8000余年的历程，其制品从新石器时期一直延续至明清时期，始终是中国产量领先且应用最为普遍的中低档玉石。初级玉矿规模。"
