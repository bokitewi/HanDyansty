 building_TK_20_81_BianDanShanTieKuang1Ji: "$TK_20_81_BianDanShanTieKuang1Ji$"
 building_TK_20_81_BianDanShanTieKuang1Ji_desc: "扁担山铁矿：扁担山脉是柬埔寨与泰国的天然边界山脉，该山脉由砂岩构成，北坡为热带雨林，南坡以落叶林为主，铁矿资源丰富。公元前3世纪冶铁传入东南亚，冶铁开始，三国志吴书记载扶南国制造数可载百人的铁甲木船，可见此地区的铁矿冶炼早已成熟。初级铁矿规模。"
