 TK_20_87_WanShanZhuShaKuang1Ji: "万山朱砂矿Ⅰ级"
 building_TK_20_87_WanShanZhuShaKuang1Ji: "$TK_20_87_WanShanZhuShaKuang1Ji$"
 building_TK_20_87_WanShanZhuShaKuang1Ji_desc: "万山朱砂矿：自秦汉时期开始采掘，万山的汞矿开采冶炼已有两千多年的历史。万山汞矿曾是中国最大的汞工业生产基地，汞的储量和产量曾居全国第一、亚洲第二、世界第三，享有“中国汞都”的美誉。秦时巴寡妇清向秦始皇所献丹砂大概率即处于此地。初级朱砂矿规模。"
