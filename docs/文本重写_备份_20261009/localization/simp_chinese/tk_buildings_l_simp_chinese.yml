 building_type_TK_20_84_YanChengHaiYan1Ji_desc: "盐矿"
 TK_20_84_YanChengHaiYan1Ji: "盐城海盐Ⅰ级"
 building_TK_20_84_YanChengHaiYan1Ji: "$TK_20_84_YanChengHaiYan1Ji$"
 building_TK_20_84_YanChengHaiYan1Ji_desc: "盐城海盐：盐城古称“盐渎”，西汉高帝六年（前201年），始建盐渎县。东晋晋安帝义熙九年（413年）改名盐城县。盐城因盐而得名，因煮盐而筑城，因运盐河而发展。两淮出产的食盐也成为淮盐，在波澜壮阔的千年盐业史上，淮盐有着“煮海之利，重于东南，两淮为最”之称，人们更是用“淮盐出，天下咸”来形容淮盐在古代盐业史上的地位。初级盐矿规模。"
