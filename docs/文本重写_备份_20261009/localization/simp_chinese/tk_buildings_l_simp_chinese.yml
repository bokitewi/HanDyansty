 building_type_TK_20_86_MoGuBaoShiKuang1Ji: "宝石矿"
 building_type_TK_20_86_MoGuBaoShiKuang1Ji_desc: "宝石矿"
 TK_20_86_MoGuBaoShiKuang1Ji: "抹谷宝石矿Ⅰ级"
 building_TK_20_86_MoGuBaoShiKuang1Ji: "$TK_20_86_MoGuBaoShiKuang1Ji$"
 building_TK_20_86_MoGuBaoShiKuang1Ji_desc: "抹谷宝石矿：位于曼德勒东北，由多个山谷城镇构成，拥有数百年宝石开采历史。缅甸“抹谷之王”红宝石是产自缅甸抹谷地区的红宝石原石，抹谷以大理岩型矿床著称，红宝石含矿母岩为大理岩与花岗质正长岩接触带，其出产的“鸽血红”红宝石属Vivid Red级别，颜色呈现玫红至红色调，并具有流动旋涡状“糖蜜状”构造。初级玉矿规模。"
