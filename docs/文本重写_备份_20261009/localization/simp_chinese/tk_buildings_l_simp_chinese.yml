 TK_20_85_DuShanYuShiKuang1Ji: "独山玉石矿Ⅰ级"
 building_TK_20_85_DuShanYuShiKuang1Ji: "$TK_20_85_DuShanYuShiKuang1Ji$"
 building_TK_20_85_DuShanYuShiKuang1Ji_desc: "独山玉石矿：也称“南阳玉”或“河南玉”或“独玉”，是中国四大名玉之一，有南阳翡翠之称。东汉张衡《南都赋》:“其宝利珍怪，则金采玉璞，随珠夜光，珍馐琅珩，充溢圆方，琢雕狎猎，金珠琳琅”；《汉书》记载南阳独山脚下的沙岗店，即为当时全国闻名的“玉街寺”，是南阳玉雕生产和销售贸易的集散地；这些古籍皆记载先秦到汉代曾是玉石中的珍品。初级玉矿规模。"
