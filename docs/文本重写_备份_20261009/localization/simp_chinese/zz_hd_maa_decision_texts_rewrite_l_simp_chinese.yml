 # ══════════════════════════════════════════════════════════════════
 # 汉晋春秋 · 兵制修改包 —— 决议文本（后汉书文风）
 #
 # 状态：定稿。已纳入本修改包，待主 mod 作者整合。
 # 范围：17 个「建立军制」决议 × 5 键 + 8 个「操练勋号兵」决议 × 4 键 = 117 条
 #
 # 体例说明：
 #   · title / desc / effect  —— 纯后汉书文风（文言叙事）
 #   · tooltip / confirm      —— 措辞古典化，但游戏数值保留阿拉伯数字，便于玩家核对
 #   · 本文件只替换措辞；所有键名、数值与机制描述均与原文一一对应，不改动任何游戏数据
 # ══════════════════════════════════════════════════════════════════

 # ─────────────── 一、建立军制决议（17） ───────────────

 # 1. 幽州突骑
 hd_establish_youzhou_tuqi_decision:0 "立幽州突骑制"
 hd_establish_youzhou_tuqi_decision_desc:0 "夫骑者，军之锋也。昔耿弇言渔阳、上谷突骑为天下所闻，其地固宜马，其民习鞍马、识边路，非一日之力也。\n\n然边郡之兵，聚散无常。临敌而征，则马不给、人不集，虽有劲骑之名，无劲骑之实。今欲为之立制：定军籍、备刍给、明赏罚，使弓马之士有所系属。所费钱帛不为少，然制立而后，招募扩编皆有所循，不必每战而求人。"
 hd_establish_youzhou_tuqi_decision_tooltip:0 "立幽州突骑之制。初立须早于公元400年。兵源：于幽州亲辖一县，其县控制力不下50，土人传承相合；封臣之县不与焉。失其县、其传承或控制力者，募兵与扩编俱停，然已立之军不解。制系于立制时之主衔，随衔而移；400年之限，唯施于初立。"
 hd_establish_youzhou_tuqi_decision_confirm:0 "输150金、300威望以立制。制立则军未立——本决议不即得军团。"
 hd_establish_youzhou_tuqi_decision_effect:0 "幽州突骑之制已立。兵源足时，可募可扩。"

 # 2. 白马义从
 hd_establish_baima_yicong_decision:0 "立白马义从制"
 hd_establish_baima_yicong_decision_desc:0 "右北平之骑，世称白马。昔公孙瓒与善射之士数十人皆乘白马，以为左右翼，自号「白马义从」，其名遂著。然名者，末也；马上之人能随旗进退、能驰突而开弓者，本也。\n\n若编当地骑射之士入于定制，则义从不必徒恃一时之聚。征募有籍，给养有出，乃可按军中所须渐次招集。所费不为立见之骑，而为异日驰突之地。"
 hd_establish_baima_yicong_decision_tooltip:0 "立白马义从之制。初立须早于公元400年。兵源：于右北平亲辖一县，其县控制力不下50，土人传承相合；封臣之县不与焉。失其县、其传承或控制力者，募兵与扩编俱停，然已立之军不解。制系于立制时之主衔，随衔而移；400年之限，唯施于初立。"
 hd_establish_baima_yicong_decision_confirm:0 "输200金、400威望以立制。制立则军未立——本决议不即得军团。"
 hd_establish_baima_yicong_decision_effect:0 "白马义从之制已立。兵源足时，可募可扩。"

 # 3. 乌桓骑从
 hd_establish_wuhuan_qicong_decision:0 "立乌桓骑从制"
 hd_establish_wuhuan_qicong_decision_desc:0 "敌在数十里外，帐中舆图不能自开其口。必有人逾前军、觇虚实，且能于既觉之后全躯而返，此骑之职也。\n\n乌桓之众，长于骑射驰逐，正可任此。若一定征集、给养与约束之法，则骑从可自当地续募，不至每出师而四求。与其临事而索人，不若及今为之立制。"
 hd_establish_wuhuan_qicong_decision_tooltip:0 "立乌桓骑从之制。初立须早于公元400年。兵源：于乌桓故地亲辖一县，其县控制力不下50，土人传承相合；封臣之县不与焉。失其县、其传承或控制力者，募兵与扩编俱停，然已立之军不解。制系于立制时之主衔，随衔而移；400年之限，唯施于初立。"
 hd_establish_wuhuan_qicong_decision_confirm:0 "输120金、250威望以立制。制立则军未立——本决议不即得军团。"
 hd_establish_wuhuan_qicong_decision_effect:0 "乌桓骑从之制已立。兵源足时，可募可扩。"

 # 4. 冀州强弩
 hd_establish_jizhou_qiangnu_decision:0 "立冀州强弩制"
 hd_establish_jizhou_qiangnu_decision_desc:0 "一弩可授之壮夫，一列之弩则须有人教之何时张、何时发。若但求弩多，临敌各射，则军中徒增箭耗而已。\n\n昔虞诩在武都，令强弩勿发而潜发小弩，羌人以为力弱，遂进，诩乃以强弩齐发，所中皆倒。弩之利，在号令，不在器数。今欲为冀州弩手别立征募之制，兼正军籍、器械与给养。制立而后，乃可依需招集。"
 hd_establish_jizhou_qiangnu_decision_tooltip:0 "立冀州强弩之制。初立须早于公元400年。兵源：于冀州亲辖一县，其县控制力不下50，土人传承相合；封臣之县不与焉。失其县、其传承或控制力者，募兵与扩编俱停，然已立之军不解。制系于立制时之主衔，随衔而移；400年之限，唯施于初立。"
 hd_establish_jizhou_qiangnu_decision_confirm:0 "输150金、300威望以立制。制立则军未立——本决议不即得军团。"
 hd_establish_jizhou_qiangnu_decision_effect:0 "冀州强弩之制已立。兵源足时，可募可扩。"

 # 5. 先登锐士
 hd_establish_xiandeng_ruishi_decision:0 "立先登锐士制"
 hd_establish_xiandeng_ruishi_decision_desc:0 "每攻城，辄有攘臂请行者；及矢石交下，能随其后者几人，未可知也。所求先登，非徒一往之血气。\n\n若自冀州立为定源，按籍选募、按伍整练，则敢战者有其伴，进退相持。先费钱帛以定其制，后按战事而招之，胜于临阵以重赏驱人。"
 hd_establish_xiandeng_ruishi_decision_tooltip:0 "立先登锐士之制。初立须早于公元400年。兵源：于冀州亲辖一县，其县控制力不下50，土人传承相合；封臣之县不与焉。失其县、其传承或控制力者，募兵与扩编俱停，然已立之军不解。制系于立制时之主衔，随衔而移；400年之限，唯施于初立。"
 hd_establish_xiandeng_ruishi_decision_confirm:0 "输220金、400威望以立制。制立则军未立——本决议不即得军团。"
 hd_establish_xiandeng_ruishi_decision_effect:0 "先登锐士之制已立。兵源足时，可募可扩。"

 # 6. 青州兵
 hd_establish_qingzhou_bing_decision:0 "立青州兵制"
 hd_establish_qingzhou_bing_decision_desc:0 "青州军籍摊于案上，可征之丁不为少。逐行阅之，所虑者不在其数之可观，而在入营之后谁统之、何处给粮。\n\n若立为定制，则后有征募皆有所循，不必每战而重整其众。可先为青州兵定编伍、备供给，乃按需招集。军中不可使同旗之下，各人只识各人之令。"
 hd_establish_qingzhou_bing_decision_tooltip:0 "立青州兵之制。初立须早于公元400年。兵源：于青州亲辖一县，其县控制力不下50，土人传承相合；封臣之县不与焉。失其县、其传承或控制力者，募兵与扩编俱停，然已立之军不解。制系于立制时之主衔，随衔而移；400年之限，唯施于初立。"
 hd_establish_qingzhou_bing_decision_confirm:0 "输100金、200威望以立制。制立则军未立——本决议不即得军团。"
 hd_establish_qingzhou_bing_decision_effect:0 "青州兵之制已立。兵源足时，可募可扩。"

 # 7. 六郡良家子
 hd_establish_liujun_liangjiazi_decision:0 "立六郡良家子制"
 hd_establish_liujun_liangjiazi_decision_desc:0 "陇西六郡良家子，材力过人，自幼习射，素为军中所重。昔赵充国愿以六郡良家子为兵，汉廷从之，卒以制羌。\n\n若必待急用而始念之，则良马、弓矢与熟练之骑，安能拱候吾檄？不若先定征募之制，使地方军籍与营中给养相接。所费虽重，而后日招募扩编有所凭。所求者，能随军远行之骑卒，非一册备载名号而临战无可征发之簿也。"
 hd_establish_liujun_liangjiazi_decision_tooltip:0 "立六郡良家子之制。初立须早于公元400年。兵源：于陇西六郡亲辖一县，其县控制力不下50，土人传承相合；封臣之县不与焉。失其县、其传承或控制力者，募兵与扩编俱停，然已立之军不解。制系于立制时之主衔，随衔而移；400年之限，唯施于初立。"
 hd_establish_liujun_liangjiazi_decision_confirm:0 "输300金、500威望以立制。制立则军未立——本决议不即得军团。"
 hd_establish_liujun_liangjiazi_decision_effect:0 "六郡良家子之制已立。兵源足时，可募可扩。"

 # 8. 湟中义从
 hd_establish_huangzhong_yicong_decision:0 "立湟中义从制"
 hd_establish_huangzhong_yicong_decision_desc:0 "湟中之骑，熟于舆图上仅存一线之道。何处可饮马，何处容队转身，有时胜于多披数副之甲。\n\n使义从有常籍、有常给，则缓急之际可依制而募，不需临时四求。可拨钱帛，先立征集之法。欲其愿随旗而来，亦须使军中知所以处此骑者。"
 hd_establish_huangzhong_yicong_decision_tooltip:0 "立湟中义从之制。初立须早于公元400年。兵源：于湟中亲辖一县，其县控制力不下50，土人传承相合；封臣之县不与焉。失其县、其传承或控制力者，募兵与扩编俱停，然已立之军不解。制系于立制时之主衔，随衔而移；400年之限，唯施于初立。"
 hd_establish_huangzhong_yicong_decision_confirm:0 "输160金、300威望以立制。制立则军未立——本决议不即得军团。"
 hd_establish_huangzhong_yicong_decision_effect:0 "湟中义从之制已立。兵源足时，可募可扩。"

 # 9. 板楯賨兵
 hd_establish_bandun_congbing_decision:0 "立板楯賨兵制"
 hd_establish_bandun_congbing_decision_desc:0 "广阵之令，至巴郡山径未必可用。昔板楯蛮以盾前矛后，数为汉室征伐之助，其习险阻、能近战，非他卒所及。\n\n欲长久用之，必先定征募、军籍与给养，而非遇险始思山中之人。可为板楯賨兵立制，后按需招集扩编，使盾后之人知与谁并肩。"
 hd_establish_bandun_congbing_decision_tooltip:0 "立板楯賨兵之制。初立须早于公元400年。兵源：于巴郡亲辖一县，其县控制力不下50，土人传承相合；封臣之县不与焉。失其县、其传承或控制力者，募兵与扩编俱停，然已立之军不解。制系于立制时之主衔，随衔而移；400年之限，唯施于初立。"
 hd_establish_bandun_congbing_decision_confirm:0 "输150金、300威望以立制。制立则军未立——本决议不即得军团。"
 hd_establish_bandun_congbing_decision_effect:0 "板楯賨兵之制已立。兵源足时，可募可扩。"

 # 10. 无当飞军
 hd_establish_wudang_feijun_decision:0 "立无当飞军制"
 hd_establish_wudang_feijun_decision_desc:0 "每遇山道险阻，报者辄言大队难行。然敌不因吾阵之不能展，而自退于平地。\n\n南中有习走山路、兼能使弓弩短兵者，可为别立军制。征募与供给能继，则异日有余地以组无当飞军，按需渐扩。先握此源为稳，胜于临险而见诸将指图摇首。"
 hd_establish_wudang_feijun_decision_tooltip:0 "立无当飞军之制。初立须早于公元400年。兵源：于南中亲辖一县，其县控制力不下50，土人传承相合；封臣之县不与焉。失其县、其传承或控制力者，募兵与扩编俱停，然已立之军不解。制系于立制时之主衔，随衔而移；400年之限，唯施于初立。"
 hd_establish_wudang_feijun_decision_confirm:0 "输250金、500威望以立制。制立则军未立——本决议不即得军团。"
 hd_establish_wudang_feijun_decision_effect:0 "无当飞军之制已立。兵源足时，可募可扩。"

 # 11. 五溪蛮兵
 hd_establish_wuxi_manbing_decision:0 "立五溪蛮兵制"
 hd_establish_wuxi_manbing_decision_desc:0 "武陵五溪之道曲折，循溪而行者未必闻隔山之鼓。用兵于彼，习水道山路之卒，胜于徒增行伍。\n\n可编当地部众入于定募之制，备给养、正军籍，乃依战事而招集扩军。今所费者，为使后日之檄有所往，非即刻可于营门见一新军也。"
 hd_establish_wuxi_manbing_decision_tooltip:0 "立五溪蛮兵之制。初立须早于公元400年。兵源：于武陵五溪亲辖一县，其县控制力不下50，土人传承相合；封臣之县不与焉。失其县、其传承或控制力者，募兵与扩编俱停，然已立之军不解。制系于立制时之主衔，随衔而移；400年之限，唯施于初立。"
 hd_establish_wuxi_manbing_decision_confirm:0 "输100金、200威望以立制。制立则军未立——本决议不即得军团。"
 hd_establish_wuxi_manbing_decision_effect:0 "五溪蛮兵之制已立。兵源足时，可募可扩。"

 # 12. 山越甲士
 hd_establish_shanyue_jiashi_decision:0 "立山越甲士制"
 hd_establish_shanyue_jiashi_decision_desc:0 "山越之众，不乏能负重越岭、近身接斗者。招之旗下，特其始也；若各循旧习，遇敌仍难为一军。\n\n可为山越甲士别定军制，合选募、甲械与军籍为一。先有可继之征集，乃能按需组扩部伍。与其战迫而临时发令，不若及今为此山中军士留入营之路。"
 hd_establish_shanyue_jiashi_decision_tooltip:0 "立山越甲士之制。初立须早于公元400年。兵源：于山越诸郡亲辖一县，其县控制力不下50，土人传承相合；封臣之县不与焉。失其县、其传承或控制力者，募兵与扩编俱停，然已立之军不解。制系于立制时之主衔，随衔而移；400年之限，唯施于初立。"
 hd_establish_shanyue_jiashi_decision_confirm:0 "输150金、300威望以立制。制立则军未立——本决议不即得军团。"
 hd_establish_shanyue_jiashi_decision_effect:0 "山越甲士之制已立。兵源足时，可募可扩。"

 # 13. 丹阳精兵
 hd_establish_danyang_jingbing_decision:0 "立丹阳精兵制"
 hd_establish_danyang_jingbing_decision_desc:0 "丹阳精兵之名，传之甚远。然名不能为我守一阵。所重者，其地之卒能否续募，入营之后有无常给与定属。\n\n若为之立常制，后日需步军时，可依籍而募、渐次而扩。所费钱帛先通此来路，军团仍须别招。不欲待用兵之日，持一响亮之名而问人在何处。"
 hd_establish_danyang_jingbing_decision_tooltip:0 "立丹阳精兵之制。初立须早于公元400年。兵源：于丹阳亲辖一县，其县控制力不下50，土人传承相合；封臣之县不与焉。失其县、其传承或控制力者，募兵与扩编俱停，然已立之军不解。制系于立制时之主衔，随衔而移；400年之限，唯施于初立。"
 hd_establish_danyang_jingbing_decision_confirm:0 "输200金、400威望以立制。制立则军未立——本决议不即得军团。"
 hd_establish_danyang_jingbing_decision_effect:0 "丹阳精兵之制已立。兵源足时，可募可扩。"

 # 14. 涪陵连弩士
 hd_establish_fuling_liannushi_decision:0 "立涪陵连弩士制"
 hd_establish_fuling_liannushi_decision_desc:0 "险路前后相接，敌未必并驱而入吾刃。所欲者，一支能守狭处、使弩矢续发之伍，涪陵弩士正可当选募。\n\n然弩虽多，亦须有人熟其机括，且矢簇常继。可先定征募之制，并此事与军籍同落实，乃按需招集扩编。至用兵时，不当只问携弩几何，更当问能发几许有用之矢。"
 hd_establish_fuling_liannushi_decision_tooltip:0 "立涪陵连弩士之制。初立须早于公元400年。兵源：于涪陵亲辖一县，其县控制力不下50，土人传承相合；封臣之县不与焉。失其县、其传承或控制力者，募兵与扩编俱停，然已立之军不解。制系于立制时之主衔，随衔而移；400年之限，唯施于初立。"
 hd_establish_fuling_liannushi_decision_confirm:0 "输180金、350威望以立制。制立则军未立——本决议不即得军团。"
 hd_establish_fuling_liannushi_decision_effect:0 "涪陵连弩士之制已立。兵源足时，可募可扩。"

 # 15. 羌骑
 hd_establish_qiang_qi_decision:0 "立羌骑制"
 hd_establish_qiang_qi_decision_desc:0 "西道宽狭不一，敌骑来则扬尘，退则散入远际。以步卒逐尘而走，往往终不知其所之。\n\n可于羌人聚居之地立为常源，为羌骑定征募给养之制。后按所需招集扩充，不必每事而求骑手。先使军籍钱粮有所着，乃可使之代吾争战场之疾徐。"
 hd_establish_qiang_qi_decision_tooltip:0 "立羌骑之制。初立须早于公元400年。兵源：于羌人聚居地亲辖一县，其县控制力不下50，土人传承相合；封臣之县不与焉。失其县、其传承或控制力者，募兵与扩编俱停，然已立之军不解。制系于立制时之主衔，随衔而移；400年之限，唯施于初立。"
 hd_establish_qiang_qi_decision_confirm:0 "输120金、250威望以立制。制立则军未立——本决议不即得军团。"
 hd_establish_qiang_qi_decision_effect:0 "羌骑之制已立。兵源足时，可募可扩。"

 # 16. 并州边骑
 hd_establish_bingzhou_bianqi_decision:0 "立并州边骑制"
 hd_establish_bingzhou_bianqi_decision_desc:0 "并州边郡之骑识塞路，知何时当催马，何时当蓄力。若纳之常制，则行军不必事事俟步队之至而后有报。\n\n征募、给养与军籍皆须有人久理，不能徒以一赏聚兵。可先拨钱帛立制定额，后按战事招募扩编。欲马蹄之能远，案上此数笔开支省不得。"
 hd_establish_bingzhou_bianqi_decision_tooltip:0 "立并州边骑之制。初立须早于公元400年。兵源：于并州亲辖一县，其县控制力不下50，土人传承相合；封臣之县不与焉。失其县、其传承或控制力者，募兵与扩编俱停，然已立之军不解。制系于立制时之主衔，随衔而移；400年之限，唯施于初立。"
 hd_establish_bingzhou_bianqi_decision_confirm:0 "输150金、300威望以立制。制立则军未立——本决议不即得军团。"
 hd_establish_bingzhou_bianqi_decision_effect:0 "并州边骑之制已立。兵源足时，可募可扩。"

 # 17. 藤甲兵
 hd_establish_tengjia_decision:0 "立藤甲兵制"
 hd_establish_tengjia_decision_desc:0 "南中军士习于林间进退，藤甲则其地可用之护具。不望一甲而使人刀枪不入，所重者披甲之后，部伍犹能随号令。\n\n若为藤甲兵定征募之制，可自当地按需选人，渐次招集扩编。今所付钱帛先以立制；其真成军，尚须合用之人与甲械并备，不能仅得一奇异之名。"
 hd_establish_tengjia_decision_tooltip:0 "立藤甲兵之制。初立须早于公元400年。兵源：于南中亲辖一县，其县控制力不下50，土人传承相合；封臣之县不与焉。失其县、其传承或控制力者，募兵与扩编俱停，然已立之军不解。制系于立制时之主衔，随衔而移；400年之限，唯施于初立。"
 hd_establish_tengjia_decision_confirm:0 "输180金、350威望以立制。制立则军未立——本决议不即得军团。"
 hd_establish_tengjia_decision_effect:0 "藤甲兵之制已立。兵源足时，可募可扩。"

 # ─────────────── 二、操练勋号兵决议（8） ───────────────

 # 1. 陷阵营
 hd_train_xianzhenying_decision:0 "练陷阵营"
 hd_train_xianzhenying_decision_desc:0 "军中不乏攘臂请战者，所乏者，陷阵之后犹能闻身后之令者也。若选勇健，配甲执盾，授之能将，则陷阵之军可成。\n\n此非一纸募檄可增之常伍。须别择主者、定其投入，乃观选练所得；后若散之，须待再练。吾愿为此前锋特留钱粮否？"
 hd_train_xianzhenying_decision_tooltip:0 "须有持[GetAccoladeType('stalwart_attribute').GetName]之勋号骑士；再由军事不下15、武勇不下16、具组织者之特质者主练。视主者军事、武勇、投入与随机之数，组陷阵营800至1500人；本兵种冷却一年。　决议须金100、威望150；投入于次一事件择定并即付，随即结算成军。"
 hd_train_xianzhenying_decision_confirm:0 "始筹陷阵营。费用于下一步择投入时输之。"

 # 2. 虎豹骑
 hd_train_hubaoqi_decision:0 "练虎豹骑"
 hd_train_hubaoqi_decision_desc:0 "追及敌人，一事也；敢迎敌阵而驰入之，又一事也。欲自骑军中简善战者，别为虎豹骑，以待决战之投。\n\n人马甲械不可徒求其数，更须授之能将选练。此筹别有投入，成军亦视训练所得；一散之后，须待再练。若愿为此留钱粮，则当先定主者。"
 hd_train_hubaoqi_decision_tooltip:0 "须有持[GetAccoladeType('vanguard_attribute').GetName]之勋号骑士；再由军事、武勇俱不下18、具组织者或进攻大师之特质而不怯懦者主练。视主者军事、武勇、投入与随机之数，组虎豹骑800至1500人；本兵种冷却一年。　决议须金100、威望150；投入于次一事件择定并即付，随即结算成军。"
 hd_train_hubaoqi_decision_confirm:0 "始筹虎豹骑。费用于下一步择投入时输之。"

 # 3. 白毦
 hd_train_baier_decision:0 "练白毦"
 hd_train_baier_decision_desc:0 "人皆愿立旗下受赏；及敌迫近，犹肯立彼处者，乃真可用。所需者，一支持甲之卫：能定阵脚，亦能于险路护其同伴。\n\n若别择能将，自军中选人操练，则白毦可筹。此精锐须专有投入，不能如常募之法随意扩充；散后亦须待再练。为身旁与阵后之安，吾愿出资几何？"
 hd_train_baier_decision_tooltip:0 "须有持[GetAccoladeType('disciplinarian_attribute').GetName]之勋号骑士；再由军事不下16、武勇不下18、具勇敢或不屈防御者之特质者主练。视主者军事、武勇、投入与随机之数，组白毦800至1500人；本兵种冷却一年。　决议须金100、威望150；投入于次一事件择定并即付，随即结算成军。"
 hd_train_baier_decision_confirm:0 "始筹白毦。费用于下一步择投入时输之。"

 # 4. 解烦兵
 hd_train_jiefanbing_decision:0 "练解烦兵"
 hd_train_jiefanbing_decision_desc:0 "急报送至而后临时聚兵，往往队伍未集，前线已易其形。欲选练解烦兵一支，使林泽之间卒有可调之军。\n\n须由能将主之，别备钱粮以选募操练，乃可见终局成军几何。不能如常军团随时扩充，散后亦须待下次操练。欲于骤起之战少些周章，此筹便当先行。"
 hd_train_jiefanbing_decision_tooltip:0 "须有持[GetAccoladeType('reeve_attribute').GetName]之勋号骑士；再由军事不下16、武勇不下15、具灵活之将领或组织者之特质者主练。视主者军事、武勇、投入与随机之数，组解烦兵800至1500人；本兵种冷却一年。　决议须金100、威望150；投入于次一事件择定并即付，随即结算成军。"
 hd_train_jiefanbing_decision_confirm:0 "始筹解烦兵。费用于下一步择投入时输之。"

 # 5. 麴义先登
 hd_train_quyi_xiandeng_decision:0 "练麴义先登"
 hd_train_quyi_xiandeng_decision_desc:0 "骑至而弩手先乱，则强弩亦只落于泥中。欲依麴义先登之法，选练一支敢迎骑、能待令而后发矢之伍。\n\n此须有能将主之，别备选募与军械之费，非悬一军号即可常募。成军几何视选练所得，散后亦须待再练。为一阵可恃之弩矢，吾愿先付此功否？"
 hd_train_quyi_xiandeng_decision_tooltip:0 "须有持[GetAccoladeType('tactician_attribute').GetName]之勋号骑士；再由军事不下17、武勇不下16、具进攻大师或开阔地形专家之特质者主练。视主者军事、武勇、投入与随机之数，组麴义先登800至1500人；本兵种冷却一年。　决议须金100、威望150；投入于次一事件择定并即付，随即结算成军。"
 hd_train_quyi_xiandeng_decision_confirm:0 "始筹麴义先登。费用于下一步择投入时输之。"

 # 6. 宿卫虎士
 hd_train_suwei_hushi_decision:0 "练宿卫虎士"
 hd_train_suwei_hushi_decision_desc:0 "门前之卫举止整肃，然不欲待真有人闯至，方知其能守几时。宿卫之军须勇健，亦须可信，不能但以形貌选人。\n\n若择忠勇善战之将主之，专拨资以选练，则虎士可成。不能随常募任意扩充，后若散之，亦须待下次操练。吾将以何样之伍，置于最近之处？"
 hd_train_suwei_hushi_decision_tooltip:0 "须有持[GetAccoladeType('valiant_attribute').GetName]之勋号骑士；再由军事不下12、武勇不下22、具勇敢且于吾好感不下80者主练。视主者军事、武勇、投入与随机之数，组宿卫虎士800至1500人；本兵种冷却一年。　决议须金100、威望150；投入于次一事件择定并即付，随即结算成军。"
 hd_train_suwei_hushi_decision_confirm:0 "始筹宿卫虎士。费用于下一步择投入时输之。"

 # 7. 南蛮象兵
 hd_train_nanman_xiangbing_decision:0 "练南蛮象兵"
 hd_train_nanman_xiangbing_decision_desc:0 "战象之影，足以使人多顾；所当虑者，其惊时向何处走。若无合用驭手与将，则虽大其势，未必向敌。\n\n可别拨资财，择人主象兵之练，按终局所得组为殊异之军。此类不能随常规招募扩充，散后亦须待再练。欲使庞然之物听命于军令，及今便当始筹。"
 hd_train_nanman_xiangbing_decision_tooltip:0 "须有持[GetAccoladeType('elephantry_attribute').GetName]之勋号骑士；再由军事不下15、武勇不下12、具崎岖地形专家或组织者之特质者主练。视主者军事、武勇、投入与随机之数，组南蛮象兵800至1500人；本兵种冷却一年。　决议须金100、威望150；投入于次一事件择定并即付，随即结算成军。　域内尚须含宁州之县。"
 hd_train_nanman_xiangbing_decision_confirm:0 "始筹南蛮象兵。费用于下一步择投入时输之。"

 # 8. 白衣兵
 hd_train_baiyibing_decision:0 "练白衣兵"
 hd_train_baiyibing_decision_desc:0 "敌望旗号乃知大军至；若有人能先抵近，探明道路与退处，则正接之时不至于处处受制。欲别练白衣兵，用于林岭间之追蹑、截击与掩护。\n\n此须择能将，专拨资选人操练，不能随常征任意扩编。后若散之，亦须待再练。所求非声势浩大之伍，乃一来到得及时、退得干净之部。"
 hd_train_baiyibing_decision_tooltip:0 "须有持[GetAccoladeType('marauder_attribute').GetName]之勋号骑士；再由军事不下15、武勇不下14、谋略不下12、具灵活之将领或劫掠者之特质者主练。视主者军事、武勇、投入与随机之数，组白衣兵800至1500人；本兵种冷却一年。　决议须金100、威望150；投入于次一事件择定并即付，随即结算成军。"
 hd_train_baiyibing_decision_confirm:0 "始筹白衣兵。费用于下一步择投入时输之。"
