l_simp_chinese:
 hd_dc_support.0008.b: "没有保障家人与封地的盟书，我不承诺。"
 hd_dc_support.0008.b.tt: "暂不入派、不领取酬金，要求候选本人在三个月内答复五年保护条款。候选先对你−5；实际接受后对你+15、动员+10。签约时逐人冻结你与当时存活近亲、各人当时所持头衔：约束候选本人不得无合法依据拘押、处死具名受保护者或撤销相应头衔，不约束第三方，不赦免此后真实罪责。承诺成立不等于五年义务完成。"
 hd_dc_support.0208.t: "回书中的具名保障"
 hd_dc_support.0208.desc: "回书没有许诺兵马，先列明了[scope:hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName]关心的事：自身、眼下仍在世的近亲，以及这些人此时的封地。\n\n“若连这些都无法明言，我怎敢把家人交给一句来日的封赏？”\n\n对方要求我本人承担五年约束。新生的后辈和日后取得的头衔不会自动添入名册，真实犯罪也仍可依法处置。我可以签，也可以拒绝，不能把对方的请求当成已经加入派系。"
 hd_dc_support.0208.a: "按今日名册签下，我本人守约五年。"
 hd_dc_support.0208.b: "这份约束，我不接受。"
 hd_dc_support.0408.t: "盟书的回音"
 hd_dc_support.0408.accepted: "候选已亲自接受条款，名册与头衔清单按签约当日的实际情况封存。五年期限从现在开始。\n\n这份盟书没有代替我加入任何派系，也没有先付一笔想象中的封赏。此后是否守约，须看签约者真正做了什么。"
 hd_dc_support.0408.rejected: "候选退回了保护条款，没有承担这份五年约束。\n\n我也没有因此加入派系，或得到一笔未曾支付的钱。这次往来就按未能达成约定记下。"
 hd_dc_support.0408.a: "留好这份回书。"
