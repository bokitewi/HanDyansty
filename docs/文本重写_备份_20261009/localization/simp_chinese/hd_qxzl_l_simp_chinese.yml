l_simp_chinese:
 hd_qxzl.0001.t:0 "群雄逐鹿"
 hd_qxzl.0001.desc:0 "讨董盟约散去之后，各地传来的号令愈来愈不一致。旧日一同起兵的人各归本镇，朝廷文书仍在往来，真正能使兵马出动的，却多是各家手中的钱粮。\n\n我也有自己的属吏与治下百姓。继续奉事领主，仍可借原有名分维持上下；若就此脱离节制，所领地方便由自己承担安危，再不能事事等待上面的答复。\n\n案前有人问下一份文书仍该送往何处。我看着尚未封好的信，明白今日的选择不在一句豪言，而在以后每一道命令，究竟由谁落印。"
 hd_qxzl.0001.a:0 "脱离节制，自掌所领州郡。"
 hd_qxzl.0001.b:0 "仍奉原主，这次不自立。"
 hd_qxzl_independence_tt:0 "立即脱离当前领主，成为独立统治者。"
 hd_qxzl_wait_tt:0 "维持现有隶属关系，不获得额外奖励或惩罚。"
 hd_qxzl_ineligible_tt:0 "你的头衔、隶属或领地条件已经变化，本次不再执行独立。"
