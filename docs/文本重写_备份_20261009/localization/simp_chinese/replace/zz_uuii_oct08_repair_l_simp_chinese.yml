 WJ_mt_already_picked_tt:0 "此角色已被选为这一端；若要改选，请选择另一角色，或将其改为另一端。"
 WJ_mt_different_pair_tt:0 "转移方与接收方须为不同角色。"
 WJ_miaoshi_text_prompt:0 "请输入拟定的称号"
 WJ_miaoshi_text_required_tt:0 "请先输入庙号或谥号，再行钦定；如不填写，请返回上一级选择预设称号。"
 WJ_miaoshi_back:0 "返回上一级"
 WJ_peer_choose_ting_tt:0 "择一亭为封号，系其食邑岁禄。受封者的军功或政绩须达到25。"
 WJ_peer_choose_hou_tt:0 "择一县为封号，系其食邑岁禄。受封者的军功或政绩须达到50。"
 WJ_peer_choose_county_princess_tt:0 "择一县为公主封号；只授爵禄，不移交土地与官职。"
 WJ_peer_choose_duchy_princess_tt:0 "择一郡为公主封号，取其法理首府为食邑；不移交土地与官职。"
 WJ_peer_back_tt:0 "返回上一级；不授爵，不扣除资费。"
 WJ_peer_rank_desc:0 "为[ROOT.Char.MakeScope.Var('wj_peer_target').Char.GetFirstNameNoTooltip]议定爵号。功臣因勋业受爵，宗女依亲谊册为公主。虚爵与食邑相系，不移交土地，亦不改变既有官职。"
 WJ_peer_choose_rank_tt:0 "议定爵等，再择封号与食邑。"
 WJ_peer_choose_place_tt:0 "择上级地区继续浏览；择定合资格食邑，即颁下册封诏命。"
 WJ_peer_pick_desc:0 "从本朝疆域中择取封号与食邑。只有仍可授予的地区才列于册中；选定食邑，即完成册封。"
 WJ_peer_navigation_tt:0 "继续择地；不授爵，不扣除资费。"
 WJ_peer_cancel_tt:0 "收回本次册封安排；不授爵，不扣除资费。"
 game_concept_governor:0 "官员"
 game_concept_governor_possessive:0 "官员"
 game_concept_governors:0 "官员"
 game_concept_governors_possessive:0 "官员"
 game_concept_governorship:0 "官职"
 game_concept_governorships:0 "官职"
 game_concept_governor_desc:0 "[government_bureaucratic_gov|E]的官员受命治理[realm|E]中的土地，凭借[governor_efficiency|E]处理赋税、民生与兵务。\n\n官员所掌的[title|E]及其下属[counties|E]合称[province|E]。辖区出现[governance_issues|E]时，须由官员处置。\n\n官员可以积累[influence|E]，参与其它官职的任命与[succession|E]。"
 game_concept_province:0 "郡县"
 game_concept_provinces:0 "郡县"
 game_concept_provincial:0 "郡县"
 game_concept_province_desc:0 "[province|E]是[government_bureaucratic_type|E]下由[governor|E]掌治的辖区，包括其[title|E]与所属县邑。\n\n辖区的[province_administration|E]决定治理所重，并影响税收、兵务等效益。"
 game_concept_province_administration:0 "辖区行政"
 game_concept_province_administrations:0 "辖区行政"
 game_concept_province_administration_desc:0 "[government_bureaucratic_type|E][realm|E]的[province|E]依职责设定行政类型，由[liege|E]与[governor|E]议定。\n\n每个辖区同时只能采用一种行政类型。"
 game_concept_wj_xianwang_level_xian_desc:0 "才行初著，乡里称誉。士人已获一方信重，可为县务之选；能否受任，仍须奉朝廷之命。"
 game_concept_wj_xianwang_level_jun_desc:0 "声闻郡中，治事有称。郡中贤士与官员渐知其才，可荐膺一郡之任。"
 game_concept_wj_xianwang_level_zhou_desc:0 "士林推重，誉满州境。才学与功业已为一州所知，足以列于地方重任之选。"
 game_concept_wj_xianwang_level_chao_desc:0 "名著海内，为朝野所重。其德望与治绩皆有凭据，可列公卿之选，承掌朝廷重务。"
 game_concept_wj_xianwang_level_gong_desc:0 "天下所宗，望重士林。德行、功业与声誉卓然，足为公辅之选；受任之后，方可执掌相应职事。"
