 # 割地求和
 hd_dc_sta_cede_land_interaction: "割地求和"
 hd_dc_sta_cede_land_interaction_desc: "战事不利时，向敌方战争首领割让一[duchy|E]（郡），换取立即罢兵（白和）并[truce|E] #V 10#! 年。\n选择一个直辖[county|E]（或所持郡号）：割让其所在之郡内你直辖的全部县，以及治所在该郡的直属[vassals|E]。治所所在之郡不可割让。"
 hd_dc_sta_cede_land_interaction_notification: "[actor.GetShortUIName|U]遣使请和，愿割地以求罢兵。"
