 # 策反：事件
 hd_dc_sta.0101.t: "策反独立：成功！"
 hd_dc_sta.0101.desc: "使者回报：[target.GetShortUIName]终于下定决心，举兵反叛[target.GetHerHis]主君，自立门户。敌国从此多了一桩心腹之患。"
 hd_dc_sta.0101.a: "让他们自相残杀吧。"
 hd_dc_sta.0102.t: "策反投靠：成功！"
 hd_dc_sta.0102.desc: "[target.GetShortUIName]应约而来，携其封土改换门庭，奉我为主。敌国失一臂，我得一臂。"
 hd_dc_sta.0102.a: "良禽择木而栖。"
 hd_dc_sta.0103.t: "煽动谋反：成功！"
 hd_dc_sta.0103.desc: "[target.GetShortUIName]已被说动，与[target.GetHerHis]主君的嫌隙日深，正在串联同道、厉兵秣马。"
 hd_dc_sta.0103.a: "火已点着了。"
 hd_dc_sta.subversion_target_gone.desc: "使者回报：时移事易，[target.GetShortUIName]的处境已与当初不同，此番策反无从说起。"
 hd_dc_sta.0109.t: "策反失败"
 hd_dc_sta.0109.desc: "[target.GetShortUIName]对我的使者虚与委蛇，终究不肯背弃[target.GetHerHis]主君。好在此事尚未声张出去。"
 hd_dc_sta.0109.desc_reported: "[target.GetShortUIName]不但拒绝了我的使者，还把此事原原本本地告诉了[target.GetHerHis]主君。如今两国之间，恐怕再无信义可言。"
 hd_dc_sta.0109.a: "可惜。"
