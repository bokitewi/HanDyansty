 # 策反：互动
 hd_dc_sta_incite_independence_interaction: "策反独立#weak （计谋）#!"
 hd_dc_sta_incite_independence_interaction_desc: "暗中游说敌国的这位[vassal|E]，使其起兵独立，与其主君反目。"
 hd_dc_sta_incite_defection_interaction: "策反投靠#weak （计谋）#!"
 hd_dc_sta_incite_defection_interaction_desc: "暗中游说敌国的这位[vassal|E]，使其带着领地前来投靠你。对方须与你的[realm|E]接壤，否则极难成功。"
 hd_dc_sta_incite_faction_interaction: "煽动谋反#weak （计谋）#!"
 hd_dc_sta_incite_faction_interaction_desc: "暗中煽动敌国的这位[vassal|E]，使其加入或建立反对其主君的[faction|E]，并壮大派系声势。"
 hd_dc_sta_subversion_started_toast: "开始策反"

 # 策反：阴谋
 hd_dc_sta_incite_independence: "策反独立"
 hd_dc_sta_incite_independence_action: "策反独立："
 hd_dc_sta_incite_independence_desc: "我将游说[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip]起兵独立。"
 hd_dc_sta_incite_independence_desc_general: "$hd_dc_sta_incite_independence$是一种隐秘的敌对[scheme|E]：游说敌国[vassal|E]对其主君发动独立战争。\n该计谋主要依赖你的[diplomacy|E]。\n\n[success_chance|E]主要取决于你的[diplomacy|E]与对方对其主君的[opinion|E]。若被对方[spymaster|E]察觉，将与其主君交恶，并被视为背盟毁约。"
 HD_DC_STA_INCITE_INDEPENDENCE_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U]将对其主君发动独立战争"
 hd_dc_sta_incite_defection: "策反投靠"
 hd_dc_sta_incite_defection_action: "策反投靠："
 hd_dc_sta_incite_defection_desc: "我将游说[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip]带地来投。"
 hd_dc_sta_incite_defection_desc_general: "$hd_dc_sta_incite_defection$是一种隐秘的敌对[scheme|E]：游说敌国[vassal|E]带着领地改换门庭，前来投靠你。\n该计谋主要依赖你的[diplomacy|E]。\n\n[success_chance|E]主要取决于你的[diplomacy|E]、对方对其主君的[opinion|E]，以及你与其主君的强弱。若被对方[spymaster|E]察觉，将与其主君交恶，并被视为背盟毁约。"
 HD_DC_STA_INCITE_DEFECTION_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U]将带着领地成为你的[vassal|E]"
 hd_dc_sta_incite_faction: "煽动谋反"
 hd_dc_sta_incite_faction_action: "煽动谋反："
 hd_dc_sta_incite_faction_desc: "我将煽动[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip]与其主君为敌。"
 hd_dc_sta_incite_faction_desc_general: "$hd_dc_sta_incite_faction$是一种隐秘的敌对[scheme|E]：煽动敌国[vassal|E]加入或建立反对其主君的[faction|E]，派系[discontent|E] #N +30#!，对方[levies|E] #P +30%#!（5 年）。\n该计谋主要依赖你的[diplomacy|E]。\n\n若被对方[spymaster|E]察觉，将与其主君交恶，并被视为背盟毁约。"
 HD_DC_STA_INCITE_FACTION_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U]将加入或建立反对其主君的[faction|E]"
 HD_DC_STA_SUBVERSION_DISCOVERY_DESC: "你与敌国之主交恶，并被视为背盟毁约"
