 # 来源：localization/simp_chinese/WJ_mingshi_track_loc_l_simp_chinese.yml
 trait_track_jungong:0 "武勋"
 trait_track_jungong_desc:0 "由亲历战阵、统军制胜与平定乱事积累。随阶位提高[martial_i]军事与骑士战斗力；军中威信愈隆，麾下勇士愈肯效死。"
 trait_track_qingtan:0 "清议"
 trait_track_qingtan_desc:0 "由清议论辩、人物品题与士林交游积累。随阶位提高[learning_i]学识，并降低压力获取；在纷纭毁誉中养成不为外物所动的气度。"
 trait_track_zhengji:0 "治绩"
 trait_track_zhengji_desc:0 "由考课、巡视、工程、赈灾与治理经验积累。随阶位提高[stewardship_i]管理与敌对计谋成功率；洞悉簿书、人情和地方利害，行事布局更为周密。"
 trait_track_zili:0 "仕历"
 trait_track_zili_desc:0 "由长期任官与朝廷历练积累。随阶位提高[diplomacy_i]外交与每月影响力；熟谙朝章、人事和门径，进退之间更能经营声援。"

 # 来源：localization/simp_chinese/WJ_office_roads_loc_l_simp_chinese.yml
 trait_track_WJ_mingshi_trait:0 "宦海沉浮"
 trait_track_WJ_mingshi_trait_desc:0 "清议、仕历、武勋、治绩共同构成一生仕履。四线各分四阶，随经历积累提高对应能力与专长；每线最高贡献两级贤望等第上限，兼通四途者足以名重天下。"
 trait_WJ_langguan_trait:0 "郎官"
 trait_WJ_langguan_trait_desc:0 "经举孝廉入郎官署为郎，须通过郎官考校方可正式获得举孝廉出身。"
 trait_WJ_mingshi_trait:0 "宦海沉浮"
 trait_WJ_mingshi_trait_desc:0 "仕途如海，一朝显达不足尽其人，一时沉沦亦不能抹去旧日声名。辟召、察举与任官开启仕履；此后清谈品题、久任官署、临阵建功、牧民理政，都会在人物一生中留下不可割裂的痕迹。故纵经罢黜、失势或改朝换代，既有经历仍随其身；若再逢时运，凭旧望重登公卿亦合乎人情。\n\n该角色获得[diplomacy_i]外交、[martial_i]军事、[stewardship_i]管理与[learning_i]学识各#P +1#!。#Y 清议#!、#Y 仕历#!、#Y 武勋#!、#Y 治绩#!四条[trait_level_track_xp|E]各自成长：每线达到#Y 25#!点便提高一级贤望等第上限，达到#Y 100#!点时该线累计提高两级；同时逐级强化该路线所代表的专长。"

 # 来源：localization/simp_chinese/WJ_yangwang_l_simp_chinese.yml
 WJ_yangwang_trait:0 "隐士"
 WJ_yangwang_trait_desc:0 "此人辞官隐居，闭门读书，与乡里和故交往来。拒绝一切任命、宫廷与议会职位，不任骑士，不统兵。学识＋2，压力增长－20%；清议付费筹备每项只需30金。雅号只改名称，效果相同。"
