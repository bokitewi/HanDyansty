l_simp_chinese:
 # 天朝循环·时代特色：进取期套件（docs/天朝循环_时代特色重制计划.md §3.2）

 # ---------- 决议 ----------
 hd_dc_kit_adv_compile_canon_decision: "修纂大典"
 hd_dc_kit_adv_compile_canon_decision_desc: "盛世修典，所以垂范后世。开馆延揽天下宿儒，汇集群书，编为一代大典。"
 hd_dc_kit_adv_compile_canon_decision_tooltip: "开馆修书，五年后大典告成"
 hd_dc_kit_adv_compile_canon_decision_confirm: "开馆修书"
 hd_dc_kit_adv_compile_canon_decision_effect_tt: "选定至多三名学识最高的廷臣、封臣（含礼部尚书）参修\n五年后大典成书：\n$EFFECT_LIST_BULLET$[prestige|E] #P +500#!\n$EFFECT_LIST_BULLET$本族[culture|E]当前风尚进度 #P +15%#!（无风尚时改为文化风尚加成十年）\n$EFFECT_LIST_BULLET$参修学者[learning|E] #P +1#!\n$EFFECT_LIST_BULLET$获得典籍宝物《钦定大典》\n修大典与修律令共用 #high 20#! 年冷却"
 hd_dc_kit_adv_compile_code_decision: "删定律令"
 hd_dc_kit_adv_compile_code_decision_desc: "刑律繁苛，吏得为奸。命有司删繁就简，删定一代律令，颁行天下。"
 hd_dc_kit_adv_compile_code_decision_tooltip: "删定律令，一年后颁行"
 hd_dc_kit_adv_compile_code_decision_confirm: "删定律令"
 hd_dc_kit_adv_compile_code_decision_effect_tt: "一年后律令颁行：\n$EFFECT_LIST_BULLET$获得修正[GetModifier('hd_dc_kit_adv_code_modifier').GetNameWithTooltip]，持续 #high 20#! 年\n$EFFECT_LIST_BULLET$获得典籍宝物《钦定律令》\n修大典与修律令共用 #high 20#! 年冷却"
 hd_dc_kit_adv_reform_decision: "变法图强"
 hd_dc_kit_adv_reform_decision_desc: "积弊日深，非更张不足以振起。择能臣主持新法，清丈田亩、均平赋役——只是世家大族必不甘心。"
 hd_dc_kit_adv_reform_decision_tooltip: "推行新法，五年后见分晓"
 hd_dc_kit_adv_reform_decision_confirm: "诏行新法"
 hd_dc_kit_adv_reform_decision_effect_tt: "由天朝大臣中[stewardship|E]最高者主持，进入五年事件链，寒门与世族角力\n成功率：基础 #high 50%#!；寒门党势力大于世族党 #P +20%#!；主持大臣[stewardship|E]不低于 20 #P +10%#!；事件选择另有增减\n成功：获得[GetModifier('hd_dc_kit_adv_reform_modifier').GetNameWithTooltip]，直辖各县[county_control|E] #P +15#!\n失败：[prestige|E] #N −200#!，朝野失望五年\n每位天子只能变法一次"
 hd_dc_kit_adv_compile_cd_tt: "近二十年内已修过大典或律令"
 hd_dc_kit_adv_compiling_tt: "修书尚未完成"
 hd_dc_kit_adv_reform_once_tt: "本朝天子已经变过法"

 # ---------- 修正 ----------
 hd_dc_kit_adv_code_modifier: "律令颁行"
 hd_dc_kit_adv_code_modifier_desc: "新律简要，吏治清明，政令通达。"
 hd_dc_kit_adv_reform_modifier: "新法成效"
 hd_dc_kit_adv_reform_modifier_desc: "新法推行有成，赋役均平，府库充盈。"
 hd_dc_kit_adv_reform_failed_modifier: "新法挫败"
 hd_dc_kit_adv_reform_failed_modifier_desc: "变法功败垂成，朝野失望。"
 hd_dc_kit_adv_canon_culture_modifier: "大典流布"
 hd_dc_kit_adv_canon_culture_modifier_desc: "钦定大典颁行天下，士林争相传抄。"
 hd_dc_kit_adv_taixue_student_modifier: "太学盛况"
 hd_dc_kit_adv_taixue_student_modifier_desc: "文治盛世，太学弦歌不辍，学子日进。"

 # ---------- 好感 ----------
 hd_dc_kit_adv_gathering_opinion: "文会唱和"
 hd_dc_kit_adv_compile_opinion: "参修大典"
 hd_dc_kit_adv_reform_angered_opinion: "强推新法"
 hd_dc_kit_adv_reform_promoted_opinion: "推行新法"
 hd_dc_kit_adv_poem_praised_opinion: "诗赋相得"
 hd_dc_kit_adv_poem_mocked_opinion: "当众讥讽"
 hd_dc_kit_adv_qingyi_heeded_opinion: "纳谏如流"
 hd_dc_kit_adv_qingyi_suppressed_opinion: "钳制清议"
 hd_party_hostile_half_opinion: "朋党对立（盛世缓和）"
 hd_party_hostile_double_opinion: "朋党对立（党争内耗）"
 hd_party_coop_double_opinion: "朋党合作（盛世和衷）"

 # ---------- 典籍宝物 ----------
 hd_dc_adv_canon_book_name: "钦定大典"
 hd_dc_adv_canon_book_desc: "盛世所修的一代大典，汇集经史子集，卷帙浩繁，为后世学者所宗。"
 hd_dc_adv_code_book_name: "钦定律令"
 hd_dc_adv_code_book_desc: "删定颁行的一代律令，条目简要，刑名有准，为天下守法之本。"

 # ---------- 修典事件 ----------
 hd_dc_adv.0001.t: "开馆修书"
 hd_dc_adv.0001.desc: "诏书既下，史馆大开。天下藏书源源不断运抵京师，宿儒学士分门编次，校雠讹误。\n\n这将是一项绵延数年的大业。"
 hd_dc_adv.0001.a: "务求精审，以垂后世。"
 hd_dc_adv.0001.a.tt: "五年后大典成书"
 hd_dc_adv.0002.t: "今古文之争"
 hd_dc_adv.0002.desc: "大典修至经部，馆中诸儒为采用古文还是今文争执不下。宗古文者多出世家旧族，主今文者多为寒素新进，各执一词，书稿因此搁置。"
 hd_dc_adv.0002.a: "宗古文，存先王之旧。"
 hd_dc_adv.0002.b: "立今文，通当世之用。"
 hd_dc_adv.0002.c: "兼采众说，不偏一家。"
 hd_dc_adv.0003.t: "大典告成"
 hd_dc_adv.0003.desc: "历时五载，大典终于告成。总纂官率诸儒捧书上殿，卷帙堆满丹墀。\n\n自此以后，天下学者皆以此书为宗。"
 hd_dc_adv.0003.a: "藏之秘阁，副本颁行天下。"
 hd_dc_adv.0011.t: "律令颁行"
 hd_dc_adv.0011.desc: "新律删定已毕，条目简要，刑名有准。有司将新律刊刻成书，颁行郡县。"
 hd_dc_adv.0011.a: "自今以后，一依新律。"

 # ---------- 变法事件 ----------
 hd_dc_adv.0021.t: "诏行新法"
 hd_dc_adv.0021.desc: "变法诏书颁下，朝野震动。[hd_dc_adv_reform_minister_scope.GetShortUIName]奉命主持新法，清丈田亩、均平赋役的条令次第推行。\n\n寒门士子拍手称快，世家大族却暗中串联，五年之内，成败未可知也。"
 hd_dc_adv.0021.desc_nominister: "变法诏书颁下，朝野震动。朝中却无天朝大臣可以主持新法，只能由天子亲自督责。清丈田亩、均平赋役的条令次第推行，世家大族暗中串联，五年之内，成败未可知也。"
 hd_dc_adv.0021.a: "朕意已决。"
 hd_dc_adv.0021.a.tt: "当前成功率：#high [ROOT.Char.MakeScope.ScriptValue('hd_dc_kit_adv_reform_chance_value')|0]%#!（五年后判定）"
 hd_dc_adv.0022.t: "世族抵制"
 hd_dc_adv.0022.desc: "清丈田亩触动了世家大族的根本。各地豪右隐匿田产、阻挠丈量，世族党人更在朝中连章上疏，指新法扰民。"
 hd_dc_adv.0022.a: "雷厉风行，敢阻新法者严惩不贷。"
 hd_dc_adv.0022.b: "稍示宽容，徐图后效。"
 hd_dc_adv.0023.t: "寒门新进"
 hd_dc_adv.0023.desc: "新法推行数年，各地涌现出一批熟悉新法的寒门干吏。主持大臣上奏，请破格拔擢，以充实推行新法的人手。"
 hd_dc_adv.0023.a: "破格擢用。"
 hd_dc_adv.0023.b: "仍当循资按序。"
 hd_dc_adv.0023.c: "遣主持大臣巡行郡县，督察新法。"
 hd_dc_adv.0024.t: "新法成败"
 hd_dc_adv.0024.desc_success: "五年过去，新法终于扎下根来。田亩清丈完毕，隐户纷纷著籍，府库日渐充盈。世家大族虽有怨言，却已无力回天。\n\n（判定时成功率：[SCOPE.ScriptValue('hd_dc_adv_reform_roll')|0]%）"
 hd_dc_adv.0024.desc_failure: "五年过去，新法终究未能推行下去。豪右阳奉阴违，地方官吏敷衍塞责，新法名存实亡，朝野一片失望之声。\n\n（判定时成功率：[SCOPE.ScriptValue('hd_dc_adv_reform_roll')|0]%）"
 hd_dc_adv.0024.a: "事已至此。"
 hd_dc_adv_reform_chance_up_tt: "变法成功率提高"
 hd_dc_adv_reform_chance_down_tt: "变法成功率降低"

 # ---------- 文会雅集 ----------
 hd_dc_adv.0101.t: "曲水流觞"
 hd_dc_adv.0101.desc: "辩论间隙，众人移步后园，引水为渠，羽觞随波而下，停在谁面前，谁便要即席赋诗。\n\n酒杯悠悠转转，恰在我面前停住。"
 hd_dc_adv.0101.a: "举杯一饮，援笔立成。"
 hd_dc_adv.0101.b: "将佳句推让给[hd_dc_adv_guest.GetShortUIName]。"
 hd_dc_adv.0102.t: "清谈玄理"
 hd_dc_adv.0102.desc: "[hd_dc_adv_guest.GetShortUIName]执麈尾而谈，自有无之辨说到言意之分，四座倾听。待到话锋一转，众人的目光都落在了我身上。"
 hd_dc_adv.0102.a: "援儒入玄，以名教折之。"
 hd_dc_adv.0102.b: "随其所之，共论有无。"
 hd_dc_adv.0103.t: "斗诗"
 hd_dc_adv.0103.desc: "我刚吟罢一首，[hd_dc_adv_guest.GetShortUIName]便抚掌冷笑，说此诗格调卑弱，不过是拾人牙慧。席间顿时安静下来。"
 hd_dc_adv.0103.a: "反唇相讥。"
 hd_dc_adv.0103.b: "一笑置之。"
 hd_dc_adv.0104.t: "题壁"
 hd_dc_adv.0104.desc: "会馆粉壁上已题满前人诗句，墨迹新旧不一。主人捧来笔墨，请诸位留题。"
 hd_dc_adv.0104.a: "挥毫题壁。"
 hd_dc_adv.0104.b: "细读前人题咏。"

 # ---------- 太学 ----------
 hd_dc_adv.0201.t: "太学生入仕"
 hd_dc_adv.0201.desc: "太学课试，[hd_dc_adv_student.GetShortUIName]名列高第，文名播于京师。博士们纷纷举荐，说此人可堪大用。"
 hd_dc_adv.0201.a: "辟为掾属。"
 hd_dc_adv.0201.b: "荐于天子。"
 hd_dc_adv.0202.t: "太学清议"
 hd_dc_adv.0202.desc: "太学诸生聚于讲堂，品评公卿，议论朝政，言辞激切。有人把诸生的议论抄录成帖，已在城中流传开来。"
 hd_dc_adv.0202.a: "清议乃公论所在，纳其直言。"
 hd_dc_adv.0202.b: "学子妄议朝政，当禁绝之。"
