 WJ_court_taiyiling:0 "太医令"
 WJ_court_taiyiling_desc:0 "$WJ_court_taiyiling$负责其身处[court|E]的健康与福祉。他们会尽其所能治疗疾病、缝合伤口。"
 WJ_court_yishi:0 "医师"
 WJ_court_yishi_desc:0 "$WJ_court_yishi$负责其身处[court|E]的健康与福祉。他们会尽其所能治疗疾病、缝合伤口。"
 WJ_court_jiayi:0 "家医"
 WJ_court_jiayi_desc:0 "$WJ_court_jiayi$负责其身处[court|E]的健康与福祉。他们会尽其所能治疗疾病、缝合伤口。"
 WJ_court_shaofucheng:0 "少府丞"
 WJ_court_shaofucheng_desc:0 "$WJ_court_shaofucheng$在皇家的每日生活中担当着重要角色，管理仆从并确保所有事情运作顺利。"
 WJ_court_taizhongdafu:0 "太中大夫"
 WJ_court_taizhongdafu_desc:0 "$WJ_court_taizhongdafu$负责宫廷所有儿童的[education|E]，其能力会影响学生。儿童仍可以有自己的[guardians|E]。"
 WJ_court_jingshi:0 "经师"
 WJ_court_jingshi_desc:0 "$WJ_court_jingshi$负责宫廷所有儿童的[education|E]，其能力会影响学生。儿童仍可以有自己的[guardians|E]。"
 WJ_court_jiashushi:0 "家塾师"
 WJ_court_jiashushi_desc:0 "$WJ_court_jiashushi$负责宫廷所有儿童的[education|E]，其能力会影响学生。儿童仍可以有自己的[guardians|E]。"
 WJ_court_zhongchangshi:0 "中常侍"
 WJ_court_zhongchangshi_desc:0 "$WJ_court_zhongchangshi$是负责宫廷中宦官的受信任的仆人。仆人和宗室中没什么事情逃得过太监的耳朵。"
 WJ_court_muli:0 "牧吏"
 WJ_court_muli_desc:0 "$WJ_court_muli$负责领主的威猛马匹和马厩。这个职位工作任务艰巨，因为精心照料的马匹在战场和道路上的都有着裨益。"
 WJ_court_yuzhe:0 "御者"
 WJ_court_yuzhe_desc:0 "$WJ_court_yuzhe$负责皇帝的威猛马匹和马厩。这个职位工作任务艰巨，因为精心照料的马匹在战场和道路上的都有着裨益。"
 WJ_court_sanqishilang:0 "散骑侍郎"
 WJ_court_sanqishilang_desc:0 "$WJ_court_sanqishilang$是字词与诗句的行家，为领主和宫廷的所有人提供愉悦、智力上的刺激和情感上的经验。"
 WJ_court_wenxue:0 "文学"
 WJ_court_wenxue_desc:0 "$WJ_court_wenxue$是字词与诗句的行家，为领主和宫廷的所有人提供愉悦、智力上的刺激和情感上的经验。"
 WJ_court_yuegong:0 "乐工"
 WJ_court_yuegong_desc:0 "$WJ_court_yuegong$是用歌唱和演奏娱乐领主和宫廷的艺术家。"
 WJ_court_yueshi:0 "乐师"
 WJ_court_yueshi_desc:0 "$WJ_court_yueshi$是用歌唱和演奏娱乐领主和宫廷的艺术家。"
 WJ_court_hubenlang:0 "虎贲郎"
 WJ_court_hubenlang_desc:0 "$WJ_court_hubenlang$是应对任何攻击者的最后一道防线，负责保卫的人去哪他们就去哪，面对潜伏的危险时会毫不迟疑地挡在前面。"
 WJ_court_suwei:0 "宿卫"
