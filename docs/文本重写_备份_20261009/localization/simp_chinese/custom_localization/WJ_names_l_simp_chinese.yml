 WJ_court_guangludafu:0 "光禄大夫"
 WJ_court_guangludafu_desc:0 "$WJ_court_guangludafu$是宫廷内的道德楷模。他们的职责便是躬行仁义，为百官作为表率。"
 WJ_court_sanqichangshi:0 "散骑常侍"
 WJ_court_sanqichangshi_desc:0 "$WJ_court_sanqichangshi$肩负着宗室子弟教育与引导的重任，他们致力于确保下一代能不偏离于先祖所树立的典范。"
 WJ_court_zhonghujun:0 "中护军"
 WJ_court_zhonghujun_desc:0 "$WJ_court_zhonghujun$是帝国的栋梁与干城，他们凭借赫赫战功与韬略受到所有人的尊敬。"
 WJ_court_shizhong:0 "侍中"
 WJ_court_shizhong_desc:0 "$WJ_court_shizhong$为君主近侍，备顾问应对，参与朝政。其职能与收益由宫廷职位及所选任务决定。"
