 # 内阁tooltip原生scope：councillor_liege是实际雇主。假定任职接口也支持空席。
 WJ_desc_councillor_chancellor: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_chancellor', SCOPE.sC('councillor_liege'))]是最高等级的[minister|E]并负责外交事务，通常兼任[grand_secretariat_director|E]。\n\n[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_chancellor', SCOPE.sC('councillor_liege'))]可以被指定为[grand_secretariat_director|E]，这取决于#V [GetLawGroup('grand_secretariat_laws').GetName]#![law|E]。\n\n$WJ_desc_councillor_chancellor_actions$"
 WJ_desc_councillor_chancellor_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_chancellor', SCOPE.sC('councillor_liege'))]可以：\n$BULLET$使用[GetDecision('favored_movement_consults_heaven_decision').GetName|V][decision|E]\n$BULLET$通过[GetDecision('tgp_minister_recruit_courtiers_decision').GetName|V][decision|E]召唤任意类型的[courtier|E]\n$BULLET$发起[GetGreatProjectType('minister_compel_religious_uniformity').GetName|V][great_project|E]\n$BULLET$以更低的花费使用特殊#V $influence_meritorious_career_interaction$#![interaction|E]选项#!#!"
 WJ_desc_councillor_chancellor_local: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_chancellor', SCOPE.sC('councillor_liege'))]是负责[realm|E]内外的交际工作的[councillor|E]。"
 WJ_desc_councillor_steward: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_steward', SCOPE.sC('councillor_liege'))]是负责[taxation|E]的[minister|E]，在[treasury|E]事务上辅佐[son_of_heaven|E]。\n\n$WJ_desc_councillor_steward_actions$"
 WJ_desc_councillor_steward_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_steward', SCOPE.sC('councillor_liege'))]可以：\n$BULLET$帮助#V $celestial_request_treasury_interaction$#!的[vassals|E]\n$BULLET$使用[GetDecision('tgp_suggest_budget_change_decision').GetName|V][decision|E]\n$BULLET$发起[GetGreatProjectType('minister_project_conduct_census').GetName|V][great_project|E]\n$BULLET$使用#V $pay_treasury_debt_interaction$#![interaction|E]偿清[civilian_governors|E]的[treasury_debt|E]会触发#V “$catalyst_cleared_treasury_debt$”#![dynastic_cycle_catalyst|E]\n$BULLET$使用特殊#V $influence_meritorious_career_interaction$#![interaction|E]选项#!#!"
 WJ_desc_councillor_steward_local: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_steward', SCOPE.sC('councillor_liege'))]是负责[domain|E]管理的[councillor|E]，例如[taxation|E]、[culture|E]和[development|E]事务。"
 WJ_desc_councillor_marshal: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_marshal', SCOPE.sC('councillor_liege'))]是负责部队军政管理的[minister|E]。当下属[governors|E]需要军事援助时，[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_marshal', SCOPE.sC('councillor_liege'))]可以派遣武职官员施以援手。\n\n该朝臣并非[commander|E]，不会领导军队。那是[minister_grand_marshal|E]的工作。\n\n#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_marshal', SCOPE.sC('councillor_liege'))]可以：\n$BULLET$向可以#V $celestial_request_military_aid_interaction$#!的处于[war|E]中的[vassals|E]派遣援助\n$BULLET$命令[military_governors|E]加入其他[governors|E]的[wars|E]#!#!\n\n$WJ_desc_councillor_marshal_actions$"
 WJ_desc_councillor_marshal_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_marshal', SCOPE.sC('councillor_liege'))]可以：\n$BULLET$向在[war|E]中#V $celestial_request_military_aid_interaction$#!的[vassals|E]派出援兵\n$BULLET$命令[military_governors|E]加入其他[governors|E]的[wars|E]\n$BULLET$发起[GetGreatProjectType('minister_project_train_troops').GetName|V][great_project|E]\n$BULLET$使用#V $pay_treasury_debt_interaction$#![interaction|E]为[military_governors|E]偿清[treasury_debt|E]，并处罚#V “$catalyst_cleared_treasury_debt$”#![dynastic_cycle_catalyst|E]\n$BULLET$使用特殊#V $influence_meritorious_career_interaction$#![interaction|E]选项#!#!"
 WJ_desc_councillor_marshal_local: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_marshal', SCOPE.sC('councillor_liege'))]是你的最高[commander|E]和总领军事事务的[councillor|E]。"
 WJ_desc_councillor_spymaster: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_spymaster', SCOPE.sC('councillor_liege'))]是负责阴谋与情报的[minister|E]。\n\n谨防[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_spymaster', SCOPE.sC('councillor_liege'))]不忠，因为他们能轻易隐瞒甚至参与对你和你[close_family|E]的[schemes|E]！\n\n[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_spymaster', SCOPE.sC('councillor_liege'))]可以被指定为[grand_secretariat_director|E]，这取决于[GetLawGroup('grand_secretariat_laws').GetName|V][law|E]。\n\n$WJ_desc_councillor_spymaster_actions$"
 WJ_desc_councillor_spymaster_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_spymaster', SCOPE.sC('councillor_liege'))]可以：\n$BULLET$使用#V $censor_find_secrets_interaction$#![interaction|E]在[vassal|E]的[courts|E]查找[secrets|E]，你可以藉此获得[liege|E]的[gold_i][gold|E]奖赏或是获得[hooks|E]\n$BULLET$[blackmail|E]会触发#V “$catalyst_minister_blackmailed$”#![dynastic_cycle_catalyst|E]\n$BULLET$使用特殊#V $influence_meritorious_career_interaction$#![interaction|E]选项#!#!"
 WJ_desc_councillor_spymaster_local: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_spymaster', SCOPE.sC('councillor_liege'))]是负责密谋和谍报的[councillor|E]。谨防[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_spymaster', SCOPE.sC('councillor_liege'))]不忠，因为他们能轻易隐瞒甚至参与对你和你至亲的[GetScheme('murder').GetTypeName]！"
 WJ_desc_councillor_court_chaplain: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_court_chaplain', SCOPE.sC('councillor_liege'))]是负责宗教和精神事务的[minister|E]，并可帮助[governors|E]主持[examinations|E]。\n\n$WJ_desc_councillor_court_chaplain_actions$"
 WJ_desc_councillor_court_chaplain_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_court_chaplain', SCOPE.sC('councillor_liege'))]可以：\n$BULLET$发起[GetGreatProjectType('minister_project_culture').GetName|V][great_project|E]\n$BULLET$发起[GetGreatProjectType('minister_compel_religious_uniformity').GetName|V][great_project|E]\n$BULLET$协助[vassals|E]举行[examinations|E]\n$BULLET$对[faith_hostile|E]或[faith_evil|E][faiths|E]的[characters|E]#V $demand_conversion_minister_rites_interaction$#!\n$BULLET$使用特殊#V $influence_meritorious_career_interaction$#![interaction|E]选项#!#!"
 WJ_desc_minister_personnel: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_personnel', SCOPE.sC('councillor_liege'))]是全权掌管[appointments|E]事务的[minister|E]，能大幅影响其他[characters|E]的[candidate_score|E]。\n\n$WJ_desc_minister_personnel_actions$"
 WJ_desc_minister_personnel_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_personnel', SCOPE.sC('councillor_liege'))]可以：\n$BULLET$无视[GetLawGroup('celestial_retirement_law').GetName][law|E]使用#V $force_governor_removal_interaction$#![interaction|E]开除[governors|E]\n$BULLET$使用[GetDecision('tgp_minister_recruit_courtiers_decision').GetName|V][decision|E]邀请任意类型的[courtier|E]\n$BULLET$强制对方接受#V $offer_courtier_interaction$#!和#V $demand_courtier_interaction$#![interactions|E]\n$BULLET$以更低的花费使用特殊#V $influence_meritorious_career_interaction$#![interaction|E]选项#!#!"
 WJ_desc_minister_justice: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_justice', SCOPE.sC('councillor_liege'))]是负责法律事务的[minister|E]，辅佐[son_of_heaven|E]维系正义。\n\n$WJ_desc_minister_justice_actions$"
 WJ_desc_minister_justice_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_justice', SCOPE.sC('councillor_liege'))]可以：\n$BULLET$发起[GetGreatProjectType('minister_project_establish_control').GetName|V][great_project|E]\n$BULLET$对[vassals|E]和[courtiers|E]使用#V $imprison_interaction$#![interaction|E]，对方无法拒绝\n$BULLET$对犯下[crimes|E]的[characters|E]使用#V $pardon_interaction$#![interaction|E]\n$BULLET$使用$censor_find_secrets_interaction$[interaction|E]在[vassal|E][courts|E]查找[secrets|E]，并[imprison|E]或赦免已知的[criminals|E]\n$BULLET$曝光[secrets|E]会触发“$catalyst_minister_exposed_secret$”[dynastic_cycle_catalyst|E]\n$BULLET$使用特殊#V $influence_meritorious_career_interaction$#![interaction|E]选项#!#!"
 WJ_desc_minister_works: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_works', SCOPE.sC('councillor_liege'))]是负责[realm|E]建造与发展的[minister|E]，并可以发起[great_projects|E]。\n\n$WJ_desc_minister_works_actions$"
 WJ_desc_minister_works_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_works', SCOPE.sC('councillor_liege'))]可以：\n$BULLET$发起[GetGreatProjectType('minister_project_development').GetName|V][great_project|E]\n$BULLET$发起[GetGreatProjectType('grand_canals').GetName|V][great_project|E]\n$BULLET$发起[GetGreatProjectType('great_wall').GetName|V][great_project|E]\n$BULLET$可以在[realm|E]内建造[buildings|E]和[holdings|E]\n$BULLET$[GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName][dynastic_cycle_era_short|E]中可以在[son_of_heaven|E]的[tributaries|E]领地内建造[buildings|E]和[holdings|E]\n$BULLET$使用特殊#V $influence_meritorious_career_interaction$#![interaction|E]选项#!#!"
 WJ_desc_minister_grand_marshal: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_grand_marshal', SCOPE.sC('councillor_liege'))]是[realm|E]的最高武官，指挥一支[title_men_at_arms|E][army|E]。\n\n[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_grand_marshal', SCOPE.sC('councillor_liege'))]可以被指定为[grand_secretariat_director|E]，这取决于#V [GetLawGroup('grand_secretariat_laws').GetName]#![law|E]。\n\n$WJ_desc_minister_grand_marshal_actions$"
 WJ_desc_minister_grand_marshal_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_grand_marshal', SCOPE.sC('councillor_liege'))]可以：\n$BULLET$发起#V 开边#![great_project|E]\n$BULLET$发起[GetGreatProjectType('construct_great_barracks').GetName|V][great_project|E]\n$BULLET$在[GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName]和[GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability_conquest').GetName][dynastic_cycle_eras_short|E]使用#V $CHINA_SEIZE_COUNTY_CB_NAME$#!和#V $CHINA_SEIZE_DUCHY_CB_NAME$#![casus_bellis|E]\n$BULLET$使用特殊#V $influence_meritorious_career_interaction$#![interaction|E]选项#!#!"

 # 宫廷任务GUI持有明确雇主才用此桥；未知任务及非汉晋保留原描述。
 WJ_court_task_description: "[Select_CString(And(GetScriptedGui('WJ_name_tooltip_hanjin').IsShown(GuiScope.SetRoot(Character.MakeScope).End), Not(ObjectsEqual(Concatenate('WJ_desc_', CourtPositionTaskType.GetKey), Localize(Concatenate('WJ_desc_', CourtPositionTaskType.GetKey))))), Localize(Concatenate('WJ_desc_', CourtPositionTaskType.GetKey)), CourtPositionTaskType.GetDescription)]"
 WJ_desc_court_poet_court_position_task_create_poetry: "你的[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)]会创作和朗诵歌颂你、你的领地和你的成就的美妙诗歌。"
 WJ_desc_grand_guardian_court_position_task_guard_the_capital: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)]将负责保护帝都的安全。"
 WJ_desc_grand_guardian_court_position_task_shield_the_realm: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)]将施展他们的武功与韬略保卫整个帝国。"
 WJ_desc_grand_guardian_court_position_task_instill_martial_discipline: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)]将努力将他们于行伍之间所积累的经验传授给那些尚未亲临战阵的人。"
 WJ_desc_grand_mentor_court_position_task_teach_liege: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)]将致力于教育其领主。"
 WJ_desc_grand_mentor_court_position_task_edify_heirs: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)]会致力于培养帝国的下一代。"
 WJ_desc_grand_mentor_court_position_task_train_officials: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)]将确保全领地的官员都拥有同他们一样的智慧、美德与技能。"
 WJ_desc_grand_preceptor_court_position_task_instill_righteousness: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)]将代替这些臣属的领主对他们导正心性。"
 WJ_desc_grand_preceptor_court_position_task_propagate_civic_virtue: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)]将负责在普通民众之中传播礼乐教化。"
 WJ_desc_grand_preceptor_court_position_task_exalt_imperial_deeds: "作为[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)]，该角色的言论蕴含着深厚的道德力量，许多人倾向于将其视为真理。"

