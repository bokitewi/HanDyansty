l_simp_chinese:
 # 天朝循环·时代特色：扩张期套件（开边 CB / 册封朝贡 / 屯田 / 军功）

 # ---------- 开边 CB ----------
 hd_dc_exp_frontier_cb: "开边"
 hd_dc_exp_frontier_cb_name: "开边"
 hd_dc_exp_frontier_cb_war_name: "[ATTACKER.GetShortUINamePossessive]开边之战"
 hd_dc_exp_frontier_cb_victory_desc_attacker: "你将夺取[defender.GetShortUINamePossessive]所有与你疆域接壤的郡中属于[defender.GetHerHim]的全部县，并与[defender.GetHerHim]停战十年。"
 hd_dc_exp_frontier_cb_victory_desc: "[attacker.GetShortUIName|U]夺取[defender.GetShortUINamePossessive]所有与天朝疆域接壤的郡中属于[defender.GetHerHim]的全部县，双方停战十年。"
 hd_dc_exp_frontier_cb_white_peace_desc: "两国罢兵，各守其疆。"
 hd_dc_exp_frontier_cb_defeat_desc: "王师失利，[attacker.GetShortUIName|U]须向[defender.GetShortUIName]支付赔款。"

 # ---------- 册封朝贡 ----------
 hd_dc_exp_investiture_interaction: "册封朝贡"
 hd_dc_exp_investiture_interaction_desc: "遣使携厚礼册封[recipient.GetShortUINameNoTooltip]，令其奉天朝正朔，成为你的[tributary|E]。对方接受时你须支付 100 金钱作为赐物。"
 hd_dc_exp_investiture_interaction_notification: "天朝使节携诏书与赐物而来，欲册封[recipient.GetShortUIName]为藩属。"
 hd_dc_exp_investiture_cooldown_tt: "[recipient.GetShortUINameNoTooltip|U]近年曾拒受天朝册封，数年内不会再接受"
 hd_dc_exp_investiture_reason_gift: "天朝赐物：$VALUE|=+0$"
 hd_dc_exp_investiture_reason_weak: "实力不及天子之半：$VALUE|=+0$"
 hd_dc_exp_investiture_reason_strong: "实力强于天子：$VALUE|=+0$"
 hd_dc_exp_investiture_reason_king: "身为君王：$VALUE|=+0$"
 hd_dc_exp_investiture_reason_emperor: "身为皇帝：$VALUE|=+0$"
 hd_dc_exp_investiture_reason_rival: "与天子为宿敌：$VALUE|=+0$"
 hd_dc_exp_investiture_reason_nemesis: "与天子为死敌：$VALUE|=+0$"
 hd_dc_exp_investiture_reason_proud: "傲慢或野心勃勃：$VALUE|=+0$"
 hd_dc_exp_investiture_accepted_opinion: "受天朝册封"
 hd_dc_exp_investiture_declined_opinion: "拒受天朝册封"

 # ---------- 屯田 ----------
 hd_dc_exp_tuntian_decision: "屯田"
 hd_dc_exp_tuntian_decision_desc: "募兵民于边地开垦屯田，戍守与耕作并举。选择一个边州，其中属于你疆域的各县十年内补给上限与征兵大增。"
 hd_dc_exp_tuntian_decision_tooltip: "在边州兴办屯田"
 hd_dc_exp_tuntian_decision_confirm: "兴办屯田"
 hd_dc_exp_tuntian_border_tt: "疆域内至少有一个与外界接壤的边县"
 hd_dc_exp_tuntian_decision_effect_tt: "选择一个边州（王国级）：其中属于你疆域的各县获得#P 补给上限 +50%、征兵 +15%#!，持续十年"
 hd_dc_exp_tuntian_apply_tt: "该州内属于你疆域的各县获得县修正「屯田」，持续十年"
 hd_dc_exp_tuntian_modifier: "屯田"
 hd_dc_exp_tuntian_modifier_desc: "边地兵民且耕且守，粮秣充足，兵源丰沛。"

 # ---------- 军功 ----------
 hd_dc_exp_military_merit_decision: "军功授爵"
 hd_dc_exp_military_merit_decision_desc: "王师新破外寇，当论功行赏。从此战中领兵的将领里择一人加官晋爵。"
 hd_dc_exp_military_merit_decision_tooltip: "为一名立功将领授爵"
 hd_dc_exp_military_merit_decision_confirm: "论功行赏"
 hd_dc_exp_merit_window_tt: "一年内曾战胜天下之外的势力"
 hd_dc_exp_merit_candidate_tt: "该战中至少有一名仍在你疆域内的领兵将领"
 hd_dc_exp_merit_decision_effect_tt: "选择一名参战将领：其资望特质的武勋轨道 +25（爵位资格升一档；无此特质者改得 20 年「军功」修正），威望 +150，你与其互相好感 +30"
 hd_dc_exp_merit_open_peerage_tt: "该将领尚无爵位且已符合授爵资格：将打开授爵互动，由你选定封邑"
 hd_dc_exp_merit_window_toast: "王师凯旋"
 hd_dc_exp_merit_window_toast_desc: "一年内可颁行「军功授爵」，为参战将领论功行赏"
 hd_dc_exp_military_merit_modifier: "军功"
 hd_dc_exp_military_merit_modifier_desc: "此人以战功受天子封赏，名动一时。"
 hd_dc_exp_military_merit_opinion: "军功授爵"

 # ---------- 事件 ----------
 hd_dc_exp.0100.t: "兴办屯田"
 hd_dc_exp.0100.desc: "户部与将作的奏疏堆满案头：边地荒田连片，戍卒往返转运，糜费无算。若募兵民就地开垦，且耕且守，则粮不待转输而足。\n\n诸边州中，当先于何处兴办屯田？"
 hd_dc_exp.0100.a: "屯田于[hd_dc_exp_slot_1.GetName]"
 hd_dc_exp.0100.b: "屯田于[hd_dc_exp_slot_2.GetName]"
 hd_dc_exp.0100.c: "屯田于[hd_dc_exp_slot_3.GetName]"
 hd_dc_exp.0100.d: "屯田于[hd_dc_exp_slot_4.GetName]"
 hd_dc_exp.0100.e: "边地已无可屯之处，钱粮归库"
 hd_dc_exp.0200.t: "论功行赏"
 hd_dc_exp.0200.desc: "王师凯旋，诸将列于阶下。此役斩将搴旗者众，然爵赏贵在得人——天子当亲择其中功劳最著者，加以殊荣。"
 hd_dc_exp.0200.a: "封赏[hd_dc_exp_merit_1.GetShortUIName]"
 hd_dc_exp.0200.b: "封赏[hd_dc_exp_merit_2.GetShortUIName]"
 hd_dc_exp.0200.c: "封赏[hd_dc_exp_merit_3.GetShortUIName]"
 hd_dc_exp.0200.d: "封赏[hd_dc_exp_merit_4.GetShortUIName]"
 hd_dc_exp.0200.e: "诸将或殁或去，无人可赏"
