 WJ_kaoke_request_burden_reason:0 "所请求的考课加分"
 WJ_kaoke_request_gain_20_tt:0 "本期考课获得#P +20分#!；尚书令审批记中央朝廷认可，王国长官审批记上级认可"
 WJ_kaoke_request_gain_30_tt:0 "本期考课获得#P +30分#!；尚书令审批记中央朝廷认可，王国长官审批记上级认可"
 WJ_kaoke_request_gain_50_tt:0 "本期考课获得#P +50分#!；尚书令审批记中央朝廷认可，王国长官审批记上级认可"
 WJ_kaoke_request_minister_tt:0 "王国辖下伯爵、公爵须由实际王国长官审批；其余由本朝在任尚书令办理，不由皇帝代批"
 WJ_kaoke_request_one_score_tt:0 "20、30、50分必须恰好选择一档"
 WJ_kaoke_request_options:0 "分数恰选一档；筹码可多选（强弱承诺互斥）"
 WJ_kaoke_request_period_tt:0 "本人须在有效的当前个人考期，且本期尚未成功请求加分"
 WJ_kaoke_request_secret_known_tt:0 "知晓审批者此次徇私舞弊的秘密；本考期不能再次请求加分"
 WJ_kaoke_request_secret_owner_tt:0 "获得或累加徇私舞弊秘密，申请人知晓此秘密"
 WJ_kaoke_request_willingness_tt:0 "审批者意愿至少为0；鼠标移至下方意愿条可查看逐项明细"
 WJ_kaoke_result_desc:0 "书吏将最后一页考课簿递来，改定之处已经归入中央分项。我看过，示意收卷，他却在封存以前又核了一遍名字。\n\n笔下改动留下了痕迹，各官的考赏还须待本期结算。至于日后有没有人来问这些评语的来由，此刻谁也没有提起。文书收走，案上倒忽然空了许多。\n\n#weak 本批净影响：[wj_kaoke_committed_m|0]；舞弊秘密风险：[wj_kaoke_committed_risk|0]%。本人下次可用日期：[GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.Char.MakeScope, 'wj_kaoke_central_cooldown'))]。#!"
 WJ_kaoke_result_emperor_desc:0 "最后一份考课簿也已收齐。书吏将改定之处逐人念过，念到某个名字时，又停下看我，仿佛想从脸上再讨一句准话。\n\n我让他依已定记录归簿，不必再问。那些远在州县的人眼下尚未听见，日后的课第却已经添进了今日御前这一笔。至于正式考赏，仍待各官本期结算。\n\n#weak 本批净影响：[wj_kaoke_committed_m|0]。已计入中央分项；本人下次可用日期：[GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.Char.MakeScope, 'wj_kaoke_central_cooldown'))]。#!"
 WJ_kaoke_result_title:0 "中央调分已落账"

