 WJ_LUZHI_DESC_CHU_NO_ROAD:0 "你目前既无实际官职，也没有辟召、孝廉或茂才出身，因此显示为[wj_chushi|E]。贤望只能提高未来任官上限；先取得正式入仕资格并实际获任后，才会按官职确定[wj_luyi|E]。"
 WJ_LUZHI_DESC_CHU_WITH_ROAD:0 "你虽已取得正式入仕资格，但目前没有实际官职，因此仍以[wj_chushi|E]身份居于朝野。下方的贤望任官上限只表示可以受任的最高范围，实际获任后才按官职确定[wj_luyi|E]。"
 WJ_LUZHI_DESC_OFFICIAL:0 "你当前为[Character.Custom('WJ_BandWord')]，这是依最高实际官职确定的正式[wj_luyi|E]。入仕途径决定能否列入任命候选，贤望决定可以受任的最高范围；二者都不会脱离实际官职直接改变当前禄秩。"
 WJ_LUZHI_DESC_SHI_NO_ROAD:0 "你目前没有实际官职，也尚未取得辟召、孝廉或茂才出身；无地士族身份使你显示为[wj_shizu|E]，但士族身份本身不是官职或禄秩。须先取得正式入仕资格并实际获任，才会按官职确定[wj_luyi|E]。"
 WJ_LUZHI_DESC_SHI_WITH_ROAD:0 "你虽已取得正式入仕资格，但目前没有实际官职；无地士族身份使你当前显示为[wj_shizu|E]。下方的贤望任官上限只表示可以受任的最高范围，实际获任后才按官职确定[wj_luyi|E]。"
 WJ_LUZHI_DESC_SHOU:0 "你已有实际官职，但尚无辟召、孝廉或茂才这一正式入仕资格，因此现职只能暂以[wj_shishou|E]任事，尚未正式取得该官职对应的[wj_luyi|E]。下方的贤望任官上限只表示声望允许的最高候选范围，不等于当前禄秩；试守满一年并通过考课后，才会按届时实际官职取得入仕出身并正式定秩。"
