 WJ_bizhao_recruit_desc:0 "邀请[recipient.Custom('WJ_GetLinkedUIName')]担任所选空缺幕职。接受时重新核对资格与筹码；府主获得对僚属的强牵制，离幕后保留。基本花费：$WJ_BIZHAO_BASE_COST|0$影响力。"

 # 来源：localization/simp_chinese/WJ_kaoke_assessment_additions_l_simp_chinese.yml
 WJ_kaoke_active_disfavor_opinion:0 "考课打压"
 WJ_kaoke_active_favor_opinion:0 "考课提携"
 WJ_kaoke_trial_notice_maocai:0 "试守的评定已经下来，列为优等，茂才资格也已正式授予。我将文书看了两遍，才真正明白，先前那份尚待考验的身份，到今日终于有了新的交代。\n\n此后任事仍须承担功过，不能以一纸资格便自称已经无所不通。但平日所做并未落空，这份认可也足以让我更坦然地面对来问政务的人。\n\n普通考课的奖励仍在本次结算中另行选择，不因转正便一并发下。我把资格文书收好，准备继续处理该办的事务。"
 WJ_kaoke_trial_notice_title:0 "试守考成，资格已授"
 WJ_kaoke_trial_notice_xiaolian:0 "本次试守评为良等，正式授予孝廉资格。送来文书的人读完以后，仍等我回话，我却先把列明的评语从头又看了一遍。\n\n其中既有肯定，也有尚须用心之处。试守至此，总算不必再以同样的身份等待下一次证明；然而能够正式入仕，与以后每件事都办得妥当，仍隔着许多实际工夫。\n\n普通考课奖励还须在本次结算中另选，不因这份资格而全部取得。我收好文书，让来人继续报说手头事务。"

 # 来源：localization/simp_chinese/WJ_kaoke_central_l_simp_chinese.yml
 WJ_kaoke_case_arrest:0 "据此罪责，尝试将其逮捕。"
 WJ_kaoke_case_desc:0 "[wj_kaoke_offender.Custom('WJ_GetLinkedUIName')]徇私改动考课的案卷已经公开。书吏指着相关记录念下去，我听到一半，便叫他将那页摊平，重新核看。\n\n事情已经摆在眼前，如何处分却仍等我裁定。宽恕、尝试收捕，或先留着案由，都有可行之处；课簿上的旧改动与已经转手的钱财，却不会随这一句处分自行复原。\n\n#weak 涉及影响值：[wj_kaoke_case_influence|0]。本案罪责提供逮捕与剥夺头衔理由，好感惩罚为−30、十年递减；如何处分，由下方选择决定。#!"
 WJ_kaoke_case_dismiss:0 "暂不处理，合上案卷。"
