 # 来源：localization/simp_chinese/WJ_ai_routes_l_simp_chinese.yml
 WJ_ai_bizhao_letter:0 "久闻足下才识，府中正有幕职虚席，愿请入幕共事。近来文书堆案，属吏各有所长，却少一个可以从容商议的人；每遇难决之事，便想起足下。\n\n我不敢只用几句过誉之辞相邀，所拟职任与酬答，皆附在书后。若肯屈就，便请依约任事，遇有异议，也盼当面相告。\n\n此书所求，是能与我共担事务的同僚，并非席间一位点头称善的客人。去留如何，愿得亲复，府中虚席以待。"
 WJ_ai_bizhao_role_1:0 "\n拟任幕职：[scope:actor.Custom('WJ_mufu_role_1')]。"
 WJ_ai_bizhao_role_2:0 "\n拟任幕职：[scope:actor.Custom('WJ_mufu_role_2')]。"
 WJ_ai_bizhao_role_3:0 "\n拟任幕职：[scope:actor.Custom('WJ_mufu_role_3')]。"
 WJ_ai_bizhao_role_4:0 "\n拟任幕职：[scope:actor.Custom('WJ_mufu_role_4')]。"
 WJ_ai_bizhao_role_5:0 "\n拟任幕职：[scope:actor.Custom('WJ_mufu_role_5')]。"
 WJ_ai_bizhao_strong_hook:0 "\n入幕后，府主将获得对你的强牵制。"
 WJ_ai_kaoke_accept:0 "收下三百金，为其本期考课加三十分。"
 WJ_ai_kaoke_award:0 "褒奖官员"
 WJ_ai_kaoke_award_desc:0 "认可亲近官员的本期表现，给予考课30分。"
 WJ_ai_kaoke_awarded:0 "[scope:actor.Custom('WJ_GetLinkedUIName')]给予你本期考课30分"
 WJ_ai_kaoke_desc:0 "[scope:actor.Custom('WJ_GetLinkedUIName')]起初只谈任事艰难，绕了许久，才将三百金推到我面前。“本期课第，还望照拂。”\n\n我没有伸手，先看了一眼考课簿。所求是加上三十分，笔下几划，便能让旁人一时难以分辨哪些来自政绩，哪些来自眼前的礼物。来人见我不答，又将声音压低些。\n\n门外似有脚步经过，那只递礼的手立刻停了。我看着钱，再看着簿。此刻回绝，还是把这份好处收下，都只须一句话；只是往后若有人翻起记录，未必还能如此轻松。"
 WJ_ai_kaoke_just_tt:0 "公正的官员不会徇私批准此项请分。"
 WJ_ai_kaoke_last_superior_summary:0 "\n上期上级认可：[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_last_superior_value')|=+0]分。"
 WJ_ai_kaoke_personality:0 "审批者的性格：$VALUE|=+0$"
 WJ_ai_kaoke_superior_summary:0 "\n上级认可：[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_superior_value')|=+0]分。"
 WJ_ai_kaoke_title:0 "一封请分书"
 WJ_ai_maocai_letter:0 "谨奉书请举茂才。平日论事，常恨所见只能留在席间；如今愿列任用之选，试将所学用于真正的政务，故不敢再以寻常问候掩去此来之意。\n\n才具如何，尚须明公审察，我也不敢预言自己无事不能。只是若从未获一试之机，往后纵有得失，也无从使人知晓。\n\n所议酬答附于书后，愿得裁量。蒙举，自当尽力任事；不蒙许，也请明告。世路未易，今日肯把这份请求写出，已经不愿只待旁人偶然想起。"
 WJ_ai_offer_gold:0 "\n若蒙应允，我将奉上[gold_i]300。"
 WJ_ai_offer_hook:0 "\n若蒙应允，我愿欠下一份人情：你将获得对我的弱牵制。"
 WJ_ai_xiaolian_letter:0 "谨奉书求举孝廉。此事本可托人婉转陈说，我思量再三，仍愿亲自写明：平日所守所学，盼能有一条入仕之路。\n\n乡里的评议，不敢说尽是好话；若有所疑，也愿受问。只是久候无门，纵有任事之心，终究难以自达，故冒昧奉书，请垂察录。\n\n所议酬答附后，愿明公一并裁量。若蒙见举，自当记住知遇；若此时不许，也请赐复，使我不至日日等候而不知进退。"

