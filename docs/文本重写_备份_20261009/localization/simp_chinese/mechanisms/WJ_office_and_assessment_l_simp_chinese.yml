 WJ_kaoke_reward_you:0 "考第优，荐举、国库拨款、贤望、宦海研习四选一。\n"
 WJ_kaoke_rules_page:0 "哪些事有功，哪些事有过？"
 WJ_kaoke_scoring_rules:0 "总分＝50＋公务＋军功（限−60至60）＋吏治＋中央调分。优≥100，良80—99，平50—79，差30—49，劣＜30。\n良／优考赏四选一：候选分30／60、国库150／300、贤望75／150、正式官员宦海经验2／3；仅荐举给候选分。差／劣扣候选分15／30、直属领主好感10／20，并有五年减益，不扣已有贤望，不叠历届考第。\n"
 WJ_kaoke_settlement_end:0 "\n本期已结，新期从50分起算。差劣处罚已生效；良优请择一考赏，未领可由考课簿重开，至下次结算或失去资格时清除。"
 WJ_kaoke_settlement_intro:0 "五年任事的簿册已经合到一处。书吏逐项核过功过，将本期课第呈到我面前。\n\n"
 WJ_kaoke_task_rules:0 "公务：完成地图治理任务才计数，同一合同一次，工程不计；功过依选项提示。军功：亲任指挥官或骑士实战，胜＋10、败−10。吏治：每年一案，尽责得功、折衷可持平、谋私减分，能力挑战有成败。\n"
 WJ_kaoke_trial_continue:0 "未及良等，继续试守，参加下次五年考课。\n"
 WJ_kaoke_trial_maocai:0 "试守优等，已授茂才、正式入仕；不补试守期宦海经验。\n"
 WJ_kaoke_trial_rules:0 "试守：良举孝廉、优举茂才；未及良则续任再考。转正不占自选考赏。\n"
 WJ_kaoke_trial_xiaolian:0 "试守良等，已授孝廉、正式入仕；不补试守期宦海经验。\n"

