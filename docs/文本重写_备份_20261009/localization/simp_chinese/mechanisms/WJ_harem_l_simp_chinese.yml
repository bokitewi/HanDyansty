 HouGong_ShiHao.012_t: "册谥"
 HouGong_ShiHao.012_d:0 "候选暂且不用，谥字由我亲拟。礼官将笔放好，退开半步，原先不断的解释声也随之止住。\n\n我望着案前空白，忽然想起往日有人叫起她时的声音。以后旁人再提及，便会添上今日这一个字；可无论怎样写，也不会再有人为自己应一声了。\n\n请填写谥字，并按本页格式确认身后称谓。"
 HouGong_ShiHao.012.a: "主者施行  #weak (仅输入单字谥号)#!"
 WJ_harem_selection_origin_desc:0 "选纳的名册尚未发出，侍者先来问出身之别：取良家女子，还是优先从名门中择选？我听他念完，才发现他连笔都已备在袖旁。\n\n这道吩咐一出，便有人欢喜，有人猜测。我看着尚空的名册，想到日后宫中每一个姓氏背后，都可能多出登门问讯的人。取名门者不足时，仍须由良家补齐；无论怎样选，最终去留与位号还待以后。\n\n侍者不再说话，等我落定。此刻取消，也尚来得及。\n\n#weak 取消退还已付费用，但仍保留本次冷却。#!"
