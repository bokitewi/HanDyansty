 WJ_harem_guiren:0 "贵人"
 WJ_harem_guiren_desc:0 "汉制内宫位号，在皇后之下，有爵秩。"
 WJ_harem_meiren:0 "美人"
 WJ_harem_gongren:0 "宫人"
 WJ_harem_cainv:0 "采女"
 WJ_harem_unranked_desc:0 "汉制内宫称号，不另设后世妃嫔爵秩；不依此建立自动逐级晋升阶梯。"
 SanGong_CeliHuanghou_interaction:0 "册立皇后"
 WJ_harem_crown_desc:0 "册立正配或贵人为皇后。仅容一位在任皇后；更换正配时，原配按现有机制转为贵人。"
 SanGong_divorce_character_interaction:0 "废黜皇后"
 WJ_harem_depose_desc:0 "依天家规则，须有合法囚禁理由。按过错轻重承受威望、压力及正统性代价，解除婚姻及皇后身份。"
 WJ_harem_rank_interaction:0 "钦定位份"
 WJ_harem_rank_title:0 "钦定内宫位号"
 WJ_harem_rank_desc:0 "[recipient.GetFirstNameNoTooltip]的名字写在名册上，旁边的位号仍空着。侍者念过几个称谓，便停下来，仿佛怕多说一个字，也会被当作我的意思。\n\n我又看了一眼那个名字。贵人、美人、宫人、采女，字数相差不多，宫中人往后说出口时，分量却各不相同。今日若落定，消息恐怕比正式文书还会传得快。\n\n笔已经备好。我可以从眼前名目中选定一个，也可以暂将名册合上。门外等着回话的人，却显然盼我现在便给个答案。"
 WJ_harem_rank_notice:0 "内宫位号已定"
 WJ_harem_rank_notice_desc:0 "[recipient.Custom('WJ_GetUIName')]的身份已经更新。"
 QianSan_chuGong_interaction:0 "遣散出宫"
 WJ_harem_crown_title:0 "册立皇后诏"
 WJ_harem_crown_notice:0 "册文送到，[huanghou.Custom('WJ_GetUIName')]已经正位中宫。侍者说起新定称谓，比平日慢了些，连近旁的人也特意听着，免得以后叫错。\n\n我将文书读过，放到案边。一个位号落定，宫中许多细事便跟着换了轻重：向谁先禀，在哪里候见，谁的一句话值得反复揣摩，往后大概都有人议论。\n\n侍者问是否收存，我点了点头。礼已办妥，文书也可以入藏；至于宫门里面那些尚未说出口的话，恐怕今日才刚刚开始。"
 WJ_harem_depose_title:0 "废后诏"
 WJ_harem_depose_notice:0 "[huanghou.GetFirstNameNoTooltip]的废后诏命已经生效，侍者将新名册送来，读到原先的位号时竟顿了一下，随即换成改定后的称呼。\n\n我看见那一处涂改，才觉得诏书已经真正传进宫里。往后的请见、禀报与礼数，都须跟着变化；有人会松一口气，也有人未必肯把怨言留在心里。\n\n我让名册暂留案上。处分已经落定，宫务仍要继续。门外的人还在等新的安排，他们不可能只因我这一刻不说话，就从此不知道该怎样往来。"
 WJ_harem_ack:0 "主者施行"
 SanGong_ShiQin:0 "召幸后宫"
 WJ_harem_intimacy_title:0 "内宫起居"
 WJ_harem_intimacy_desc:0 "与[ShiQie.Custom('WJ_GetUIName')]相对坐下，门外那些催促回话的声音终于远了。灯芯轻响，我才发觉自己仍把白日一句未说完的话攥在心里。\n\n我放松肩背，望向身旁之人。今夜可以亲近些，也可以到此便止；若不愿留下孕育的可能，也须在此刻先作安排，不能等到后来再懊悔自己只顾片刻。\n\n灯影在帷边摇动。我伸手拨正案上的小盏，迟迟没有叫人进来。接下来这一段安静，仍由我决定怎样度过。"
 WJ_harem_allow_birth:0 "顺其自然，期许子嗣"
 WJ_harem_prevent_birth:0 "暂不求嗣"
 SanGong_XuanXiu_decisions:0 "采选入宫"
 WJ_harem_selection_decision_desc:0 "依天家采选规模选入二十名成年采女，列入后宫待选名单。由人物交互钦定位份或遣散；不自动建立婚姻，也不影响其余宫廷职位。"
 WJ_harem_selection_confirm:0 "命有司采选"
 WJ_harem_selection_title:0 "采选名册已至"
 WJ_harem_selection_desc:0 "名册读到第二十个名字，侍者终于停下。我原以为一一听过便能记住，待他问有何吩咐，脑中却已有几个名字混在了一处。\n\n本次选纳的二十名成年采女都在册中，来历也各自列明。我让他将册子留下，待我另看，不必现在便催着定完去留与位号。宫中传话快，随口一句称许也会被反复猜测。\n\n侍者退开，我又翻回第一页。方才唱名时每个人停顿的那一瞬，如今都只剩下几行字；以后的安排，还须从这份名册继续办理。"
 SanGong_FaSongXiuNV_decisions:0 "遣还未选宫人"
 WJ_harem_release_desc:0 "遣还年满二十五、尚未成为配偶或侧室且未任宫廷职位的采女。既有后妃和宫廷任职不受影响。"
 WJ_harem_release_confirm:0 "准予遣还"

 HouGong_ShiHao.001_t: "大行[HuangHou.Custom('WJ_HaremRank')]崩逝"
 HouGong_ShiHao.001_d_start:0 "[HuangHou.Custom('WJ_HaremRank')]去世的消息已经入报，宫中平日熟悉的往来忽然安静了。\n\n"
 HouGong_ShiHao.001_d1:0 "我听完丧仪的安排，又问了一遍尚待办理的事情。皇后之位牵着宫中礼序，也牵着许多早已习以为常的日常；如今人不在了，原来不必问的细事，竟都须重新有人回答。\n\n哀痛不能使政务全停，却也不该只剩一份照例支出的簿册。我让有司先按礼料理，所需费用与身后议谥一并办理。能为逝者做的事情已经不多，更不愿在这最后几项里草率过去。"
 HouGong_ShiHao.001_d2:0 "有司陈说丧仪时，我几次望向话音传来的方向，仿佛太后还会像往常一样，令人送来一句自己的意思。等了片刻，才想起如今所有安排，都不会再有她的答复。\n\n宫中的尊位仍须依礼记录，身后之谥也要郑重议定。但眼前先该办好的，是那些不能因悲痛便无人料理的丧事。\n\n我让人记下所需费用，依次办理。朝廷有朝廷的礼序，失去一位长者留下的空处，却不会因此立即填满。"
 HouGong_ShiHao.001_d3:0 "太皇太后的丧报送入，宫中许多侍奉已久的人一时不知该先做哪件事。她在这里留下的年月比我更长，有些旧例的来处，也只有近旁老人还记得。\n\n我让有司按礼陈明安排，先将该办的事情定下，不把哀伤变成各处彼此等候。身后之谥尚须另议，眼前的丧仪与费用却已不能耽搁。\n\n文书读完，殿中又静下来。一个尊位可以写入记录，一个长久在场的人不再回来，却要花更久才能习惯。"
 HouGong_ShiHao.001.a:0 "依礼治丧，备资百金，再议尊谥。"
 HouGong_ShiHao.011_t: "拟谥号"
 HouGong_ShiHao.011_d_start:0 "丧仪已有安排，有司接着呈来谥号之议，等待我为逝者择定身后称呼。\n\n"
 HouGong_ShiHao.011_d1:0 "皇后的称谓往日常在耳边，如今礼官问起，却是在问应该添上哪一个身后之字。我接过候选，看了片刻，又翻回前面记述生平的那一页。\n\n有些字太重，有些字仿佛仍不能尽意。堂下已经说过许多理由，我却想起几件并未写在礼文中的小事，一时没有答话。\n\n礼官的笔仍候着。从现有名目中择定，或另行亲拟，都由我最后说一句。以后旁人会照着称呼，她却再也不会听见了。"
 HouGong_ShiHao.011_d2:0 "太后的尊位已经记明，礼官接着问身后之谥。我沿着候选看过，几个熟悉的字念到口边，又没有立刻说出。\n\n往日若有难决之事，还能听一听她的意思；今日这些字都与她有关，殿中却再没人能替她答话。礼官似乎以为我未听清，正要重读，我抬手让他稍候。\n\n从候选中择定，或亲自拟名，都还来得及。我将文书放平，想把那个最后会留下的称呼，再认真想一遍。"
 HouGong_ShiHao.011_d3:0 "太皇太后的谥议到了案前，有司不再问仪物多少，只问以后怎样称呼她。平日早已叫惯的尊号，如今忽然也有了需要我定下的部分。\n\n我望着候选，想到宫中许多老人提起她时的神情。有些往事连我也未亲历，只能听他们慢慢说，听过以后，眼前这几个字倒更不容易轻取。\n\n礼官候着，名目也已列齐。若有合意的便择一，若仍不足，就亲自拟定。总得让这一场身后礼议，有一个能够留下的称呼。"
