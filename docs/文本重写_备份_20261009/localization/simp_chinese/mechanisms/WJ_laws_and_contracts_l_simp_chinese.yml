l_simp_chinese:
# 汉晋风华：按类型整合；键名与现行文本保留。来源逐键见本批manifest。

 # 来源：localization/simp_chinese/WJ_contract_privileges_l_simp_chinese.yml
 WJ_chijie:0 "持节"
 WJ_chijie_desc:0 "持节：平战均可节制本区公爵及以下合资格官员，可征召援军、移交军法罪人，并在武官管理中调拨头衔兵、改编私兵。援军按令参战，不以普通求援拒绝记罪。$WJ_mt_jie_transfer_rules$\n任内可改授，离任清节，开府独立。"
 WJ_chijie_short:0 "持节"
 WJ_huangyue_grant:0 "授予假黄钺"
 WJ_huangyue_grant_desc:0 "奉诏假黄钺：仅依附有效都督中外身份保有，失去实际摄政即一并撤去。平时可对全朝王国级及以下文武官员行军法，战时扩至本朝所有封臣及朝臣；皇帝与实际摄政本人除外。可强制定罪、羁押及不经囚禁祭旗，沿既有军法代价。普通改约不得单独开启或撤销。"
 WJ_huangyue_grant_short:0 "假黄钺"
 WJ_huangyue_none:0 "未假黄钺"
 WJ_huangyue_none_desc:0 "未授假黄钺。只能由合资格玩家决议触发诏命，与都督中外诸军事同时获得；普通改约不可主动开启。"
 WJ_huangyue_none_short:0 "未授予"
 WJ_jiajie:0 "假节"
 WJ_jiajie_desc:0 "假节：都督本人战时，节制本区公爵及以下合资格官员。可征召援军、将军法罪人交现任廷尉羁押，并在武官管理中调拨头衔兵、改编私兵。$WJ_mt_jie_transfer_rules$\n任内可改授另一节、不可撤为空；离任清节，开府独立。"
 WJ_jiajie_short:0 "假节"
 WJ_kaifu_grant:0 "授予开府"
 WJ_kaifu_grant_desc:0 "独立授予开府。朝臣或持有王国级及以上地方实职者可获授；辟召交互读取此契约权限，不再依赖开府修饰符。六职在任自动开府，不能取消；原有独立授予在离开六职后仍有合法资格时保留。"
 WJ_kaifu_grant_short:0 "开府"
 WJ_kaifu_none:0 "未另授开府"
 WJ_kaifu_none_desc:0 "未独立授予开府；六职在任的自动开府另行保留。"
 WJ_kaifu_none_short:0 "未另授"
 WJ_kaifu_office:0 "在任开府"
 WJ_kaifu_office_grant:0 "六职在任开府"
 WJ_kaifu_office_grant_desc:0 "大将军、太傅、丞相、司徒、司空、太尉在任自动开府，不能取消；离开六职后撤销此项。独立授予的开府另行保留。"
 WJ_kaifu_office_grant_short:0 "在任开府"
 WJ_kaifu_office_none:0 "无在任开府"
 WJ_kaifu_office_none_desc:0 "未持有六职在任开府。"
 WJ_kaifu_office_none_short:0 "无在任开府"
 WJ_mt_jie_transfer_rules:0 "\n调兵仅限本区，爵级限制针对其他受调官员，本人亦可充任A／B。头衔兵互转两端须公爵及以上；私兵允许伯爵转出、公爵及以上接收。两项均先选A／B、列待转军团，再统一确认；只判A意愿，本人A必成，合法调令不奉则A记军法公罪，B无罚。接收可超团数及规模上限。私兵改编由发令者国库补偿A私人金币，包括A就是发令者。"
 WJ_privilege_kaifu_locked_tt:0 "六职在任自动开府，不能更改；原有独立授予保留"
 WJ_privilege_kaifu_rank_tt:0 "须为汉晋天朝的现任朝臣，或持有王国级及以上地方实职；家族及朝臣头衔不计入地方爵级"
 WJ_privilege_sanjie_eligible_tt:0 "须为已建立都督区的现任都督；军戍或司隶契约本身不授予旄节资格。首次授节只在创建都督区时选择"
 WJ_privilege_six_offices_tt:0 "仅大将军、太傅、丞相、司徒、司空、太尉在任可授假黄钺"
 WJ_sanjie_none_desc:0 "未任都督者没有旄节特权。皇帝在军事窗口“都督区”页或右键合资格王国级武官建区，必须初授假节、持节或使持节之一；契约界面只办理在任改授。"
 WJ_shichijie:0 "使持节"
 WJ_shichijie_desc:0 "使持节：平战均可调度本区王国级及以下合资格官员，含头衔兵调拨及私兵改编。$WJ_mt_jie_transfer_rules$\n战时可强制定罪，增加暴政与恐怖；有罪者可交廷尉、自行囚禁或直接斩立决祭旗。祭旗增益一年，不叠加，重复执行刷新期限。军法公罪战后不自动消失。"
 WJ_shichijie_short:0 "使持节"

 # 来源：localization/simp_chinese/WJ_province_boundary_l_simp_chinese.yml
 WJ_province_type_closed_hanjin_tt:0 "汉晋制度不开放监、都会与都护契约，本次请求不予执行。仅保留郡县、军戍与司隶。"

 # 来源：localization/simp_chinese/WJ1_laws_l_simp_chinese.yml

 WJ_zhoumu:0 "[wj_zhoumu|E]"
 WJ_zhoumu_none:0 "仍任刺史"
 WJ_zhoumu_none_short:0 "刺史"
 WJ_zhoumu_none_desc:0 "循军戍旧任，仍以刺史治州，不享州牧之增俸与兵额。"
 WJ_zhoumu_grant:0 "擢任州牧"
 WJ_zhoumu_grant_short:0 "州牧"
 WJ_zhoumu_grant_desc:0 "擢刺史为州牧，增其俸给与头衔兵额，亦使天子对其权势有所戒惧（皇帝对该官员的好感#N -15#!）。任命不授都督之权，亦不另授节、开府或军职。自行请任须实际使用对皇帝的可用[hook|E]，天子直接授任则不需牵制。"
 WJ_zhoumu_eligible_tt:0 "须为汉晋天朝王国级地方军戍官员，非朝臣、非士族家主，且不持有皇帝首都所属的法理王国"
 WJ_zhoumu_batch_tt:0 "擢任须由本朝皇帝处理，申请者须符合州牧资格；同次修改不可转为非军戍契约"
 WJ_zhoumu_hook_tt:0 "自行申请擢任州牧，须勾选并实际使用对皇帝的可用牵制"
 WJ_zhoumu_imperial_distrust:0 "州牧权重"
