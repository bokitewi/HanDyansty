 ZongWang_ShiHao.022_t: "追谥太子"
 ZongWang_ShiHao.022_d:0 "太子的谥号将由我亲拟。候选收起以后，案上只剩笔与空白，那些关于储位与身后礼制的解释，也终于暂时停了。\n\n我将手放在案边，迟迟没有握笔。生前那么多人替东宫设想往后，如今却都退到一旁，等我留下最后这一个称呼。\n\n请输入所拟谥号，依本页格式确认。未落定之前，我还可以再想一想。"
 ZongWang_ShiHao.022.a: "自定义谥号"
 SanGong_Zongzu.002.t: "册立太孙"
 SanGong_Zongzu.002.d:0 "[Taizi.GetName]已逝，丧事尚在料理，储嗣的名册便又送到我面前。我听见那熟悉的称呼，手指在案边停了一下，才让来人继续。\n\n这一支后嗣中，是否另择一人承续储位？名字一个个读过，我试着将每张面孔想清。亡者留下的是空处，站到那里的人，却不能只被当成填补空处的一笔。\n\n我把名册留在手边，没有催人起草颂辞。此时可择定，也可暂缓。堂下所等的只是一个名字，我眼前想到的，却是那个人日后再也回不去的寻常日子。"
 SanGong_Zongzu.002.a: "立为太孙"
 SanGong_Zongzu.002.b: "不立太孙，另择储君"
