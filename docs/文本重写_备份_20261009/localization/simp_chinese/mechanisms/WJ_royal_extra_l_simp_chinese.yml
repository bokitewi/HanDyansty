 ZongWang_ShiHao.020.event_title: "追谥太子"
 ZongWang_ShiHao.020.event_desc:0 "太子身后的礼议呈到案前，有司问应定何谥。我听见东宫二字，先想到的仍是那些尚未办完的事情，片刻后才把目光移到候选上。\n\n人已不在，来人却还得按次序问下去。曾经留给往后的许多打算，如今都只剩怎样写入身后记录；翻过生平一页，后面竟已没有新事可添。\n\n我将候选再看一遍。可从现有名目择定，也可亲拟。礼官持笔等着，不敢催促，空白处却终究须有一个称呼留下。"
