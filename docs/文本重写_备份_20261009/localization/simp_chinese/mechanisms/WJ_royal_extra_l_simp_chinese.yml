 ZongWang_ShiHao.021.event_title: "追谥太子"
 ZongWang_ShiHao.021.event_desc:0 "太子年幼而逝，东宫许多安排尚未真正展开，便已转成身后之事。有司呈上谥号候选，声音比平日放得更轻，仿佛怕这些郑重的字也会显得过重。\n\n我看着那份短短的生平记录，不愿将尚未来得及发生的事情填进去。一个孩子未能长成，不需要先有一段圆满功业，才值得被认真哀悼。\n\n身后之谥仍须定下，可以从眼前选择，也可另行亲拟。只是落笔时，应记得所要留下的是这段真实而短暂的生命，而不是众人曾替它设想的将来。"
