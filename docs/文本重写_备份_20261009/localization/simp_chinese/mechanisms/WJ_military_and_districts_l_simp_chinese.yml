 # 来源：localization/simp_chinese/WJ_district_expansion_l_simp_chinese.yml
 WJ_dd_custom_name_1:0 "[ROOT.Title.GetHolder.GetLocalizedText('wj_dd_custom_name_1')]"
 WJ_dd_custom_name_2:0 "[ROOT.Title.GetHolder.GetLocalizedText('wj_dd_custom_name_2')]"
 WJ_dd_petition_acceptance_tt:0 "帝意与资望：皇帝对申请人好感，加武勋任命分；忠顺加20、奸猾减20、同宗加20。假节须达0，持节须达20，使持节须达40；扩区须达20。玩家达标即获准，不抽签。中外在任时由其代为受理，不改变本项评分。"
 WJ_dd_petition_approve:0 "制曰：可。其依所请。"
 WJ_dd_petition_approved_opinion:0 "表奏获准"
 WJ_dd_petition_create_letter:0 "臣所领一方军务，往往牵涉邻境诸军。将士虽各有统属，道路与守备却难截然分开，临事再遣人往返请示，常使援应迟滞。\n\n谨请以臣所领军府为核心，置都督，统州郡诸军事，授予旄节等，使臣得以统筹军务。\n\n若蒙允准，臣当照所授权限行事，不将临军之任据为世业。是否可行，伏候裁定。"
 WJ_dd_petition_create_letter_1:0 "$WJ_dd_petition_create_letter$\n\n#high 本表所请：假节。#!"
 WJ_dd_petition_create_letter_2:0 "$WJ_dd_petition_create_letter$\n\n#high 本表所请：持节。#!"
 WJ_dd_petition_create_letter_3:0 "$WJ_dd_petition_create_letter$\n\n#high 本表所请：使持节。#!"
 WJ_dd_petition_decline:0 "此议未允，仍守旧制。"
 WJ_dd_petition_declined_opinion:0 "表奏被却"
 WJ_dd_petition_expand_letter:0 "臣所领都督区与[scope:wj_dd_petitioner.MakeScope.Var('wj_dd_petition_target').Char.Custom('WJ_GetLinkedUIName')]辖境相接。近来议及防守援应，常须跨区往返，军令与道路难以彼此兼顾。\n\n谨请将该官所领、与本区相连且尚未入他区之州郡纳入节制，以便统一调度。此议只改军务统属。\n\n所请范围至此，愿先说清，再候俞允；若不宜扩区，臣仍照现有辖境尽职。"
 WJ_dd_qinwang_gate:0 "皇帝须领衔可获支援的战争，有100影响力、150威望、25正统性；此人为本朝现任都督且可按既有援军规则参战。仅协助方战争不计。"
 WJ_dd_rename_desc:0 "请录入此都督区的完整显示名。此名只用于都督区界面，不改真实头衔、辖境或封臣关系；更换都督、正常继任仍沿用此名。右键点击区名旁的改名图标，可恢复自动命名。"
 WJ_dd_rename_title:0 "更定都督区名"
 WJ_dd_reset_name:0 "复名"

