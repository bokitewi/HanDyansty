 # 来源：localization/simp_chinese/WJ_district_orders_l_simp_chinese.yml
 WJ_dd_action_execute:0 "斩立决，祭旗"
 WJ_dd_action_execute_tt:0 "地方须使持节且本人处于战争，目标为本区王国级及以下军法罪人；有效假黄钺平时及全朝王国级以下官员，战时及本朝封臣与朝臣。皇帝与摄政本人除外。无需先囚禁，执行会杀死目标。"
 WJ_dd_action_force:0 "宣布违犯军法"
 WJ_dd_action_force_tt:0 "地方须使持节且本人处于战争，目标在本区、不高于王国级；有效假黄钺平时及全朝王国级以下文武官员，战时及本朝封臣与朝臣。排除皇帝与摄政本人；目标未被囚禁且尚无本朝军法罪名。强制定罪增加暴政与恐怖值。"
 WJ_dd_action_justice:0 "移交廷尉羁押"
 WJ_dd_action_justice_tt:0 "目标须有本朝军法罪名、处于当前旄节或有效黄钺权限范围，尚未被囚禁；本朝现任廷尉须能实际执行。地方假节仅战时可用。"
 WJ_dd_action_self:0 "由本府羁押"
 WJ_dd_action_self_tt:0 "须使持节且战时，或有效假黄钺；目标在相应权限范围内，有本朝军法罪名且未被囚禁。"
 WJ_dd_cancel:0 "取消／军令已失效"
 WJ_dd_jie_acceptance_reason:0 "本区现任都督的有效旄节"
 WJ_dd_order_invalid_desc:0 "官职、辖区、旄节、参战立场或目标状态已变化，不能继续这道军令。若你正在反对皇帝，也不能凭朝廷授权调遣或处置仍效忠皇帝的官员。"
 WJ_dd_order_invalid_title:0 "军令未能执行"

