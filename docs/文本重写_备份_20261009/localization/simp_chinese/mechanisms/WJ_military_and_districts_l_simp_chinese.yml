# 汉晋风华：按类型整合；键名与现行文本保留。来源逐键见本批manifest。

 # 来源：localization/simp_chinese/WJ_conquest_l_simp_chinese.yml
 WJ_conquest_accepted_desc:0 "征讨之命已奉行，我已向[secondary_recipient.Custom('WJ_GetLinkedUIName')]治下的[target.GetName]开战，谨先报知。\n\n军令既出，兵粮与各部进退皆须随敌情安排。使者启程之时，军中事务尚繁，不能将一封出师之报写作报捷；往后所得所失，自当续报，不使上府只听见最初这一声应命。\n\n所得土地，仍依征讨之制归最高领主节制。领兵之责既已接下，我亦不敢再以未得明令为辞。愿上下军情相通，使这道号令真能行到阵前。"
 WJ_conquest_acknowledge:0 "知悉。"
 WJ_conquest_commission_accept_tt:0 "重新核验现任发令官职、同朝归属、原都督区及原定目标；有效时由受命都督发动朝廷征讨战争。"
 WJ_conquest_commission_decline_tt:0 "拒绝仍有效的征讨命令，沿原版损失影响力；电脑发令者降低好感。失效请求不追罚。"
 WJ_conquest_commission_proposal:0 "命你率部征讨[target.GetNameNoTier]。所得领土依朝廷征讨之制归属最高领主。"
 WJ_conquest_declined_desc:0 "征讨之命已收，我再三思量，此次仍不能领受，谨先奉书明告。\n\n知道军前不宜久候，原想将辞谢写得婉转些；然而说得再多，终究没有兵马随这封信一道出发。与其让上府误以为我尚在筹办，不如将不能出战的话说在前头。\n\n此次征讨，请另作安排，勿再候我这里应命。此答或非所望，我也不能用一封好听的回书将它改成允诺。愿使者尽快奉达，免使原有部署因我继续耽搁。"
 WJ_conquest_invalid_desc:0 "原拟发往军前的文书又回到了案上。属官指着其中几处名目，解释往返之间节制与目标已有变化，这道征讨之命，如今办不下去了。\n\n我让他再说一遍，听罢才将文书放下。先前的声势已经张扬出去，兵却没有因此出战；若还照旧令催促，下面大概只会把同一封退回的文书再递上来。\n\n我在原议旁注明作止，目光仍停在那个尚未实现的目标上。此事只能另作打算。\n\n#weak 此次未发动战争；已付威望不退，原冷却仍保留。#!"
 WJ_conquest_invalid_title:0 "征讨之命失效"
 WJ_conquest_no_target_tt:0 "须存在与受命都督陆地相邻、已经创建且位于本朝境外的公国"
 WJ_conquest_reply_opening:0 "[recipient.Custom2('AppropriateGreetingPositive', ROOT.Char)]"

