 WJ_celestial_province_sili_benefits:0 "#emphasis #bold 官员增益：#!#!\n$EFFECT_LIST_BULLET$直辖税收#P +15%#!，发展度增长#P +15%#!\n$EFFECT_LIST_BULLET$沿用[GetLaw('celestial_military_appointment_succession_law').GetName]，按原有爵级条件拥有头衔兵\n$EFFECT_LIST_BULLET$根据缴纳给领主的赋税及头衔兵获得贤望\n$EFFECT_LIST_BULLET$专属交互：#high 逮捕在京官员#!（预留接口，暂未开放）\n\n#alert_trial @alert_icon!同一天朝最多一位；须实际持有皇帝首都所在法理王国。#!"
