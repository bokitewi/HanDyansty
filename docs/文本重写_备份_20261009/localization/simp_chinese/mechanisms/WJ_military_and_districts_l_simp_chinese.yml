 WJ_dd_civilian_contract_blocked_tt:0 "现任都督不能改为郡县；请先更换都督或撤销都督区。合法的军戍与司隶转换不受此项限制。中外在任时，三节与开府由其接管，不能通过普通改约绕过；其余契约仍按原规则处理。"
 WJ_dd_remove_connected_tt:0 "移除此王国后，其余辖区必须仍与都督核心连通（如区划刚发生变化，请刷新都督区页）"
 WJ_dd_ui_rules:0 "都督军法只管理本区合资格武官，不要求直属；文官仍可入区及求援。反叛朝廷时，不能凭朝廷授权调遣或处置仍效忠皇帝的官员。"

