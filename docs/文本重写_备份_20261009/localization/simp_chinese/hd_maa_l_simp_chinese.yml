l_simp_chinese:
 hd_youzhou_tuqi:0 "幽州突骑"
 hd_youzhou_tuqi_flavor:0 "#F 塞上出身的骑卒随旗疾驰，以突击撕开敌阵。骑者须敢于迎刃，坐骑也须经得起长途奔走。#!"
 hd_maa_source.0001.t:0 "幽州突骑兵源断绝"
 hd_maa_source.0001.desc:0 "幽州的募兵回报只剩几行，我却看了很久。原拟添进突骑的军额，旁边一概写着不能征集。案上还留着下一路行军的部署，哪里缺骑兵，都曾指望从这里补上。\n\n我把两份文书并排放好，方才顺畅的打算顿时处处打结。旧有突骑仍可调遣，但新募与扩编都须等兵源恢复。眼下这一程，只能靠已经握在手里的马蹄了。"
 hd_maa_source.0001.a:0 "先按现有骑军安排。"
 hd_maa_source.0002.t:0 "幽州突骑兵源恢复"
 hd_maa_source.0002.desc:0 "“幽州又能征骑了。”书吏报到这里，我叫他先别往下念，将先前搁置的募兵文书取来。那些空下的名额，总算不必原样抄到下一份军议中。\n\n兵还没有到，钱粮也须另拨，但招募与扩编已经恢复。若再有人问骑军从何而来，我至少不必只指着现有几营，让他们自己想办法腾挪。"
 hd_maa_source.0002.a:0 "幽州的骑卒，又可为我所用了。"
 hd_baima_yicong:0 "白马义从"
 hd_baima_yicong_flavor:0 "#F 白马列于旗前，骑者挟弓而进。这支右北平骑军以机动与骑射争先，马色醒目，号令更不可紊乱。#!"
 hd_gongsun_baima_event_army:0 "公孙瓒白马义从"
 hd_maa_source.0003.t:0 "白马义从兵源断绝"
 hd_maa_source.0003.desc:0 "白马义从的增募停了。我先问右北平别处是否还有兵源，回报仍摇头，书吏手中那支准备添写军额的笔，只好悬着。\n\n现有军团不会散去，可再添新骑，眼下已无从办理。我看了一眼旧募令上写得漂亮的数目，叫人先收起来。旗上画多少白马都容易，要让它们真奔到阵前，却不能只靠笔墨。"
 hd_maa_source.0003.a:0 "白马之名，先由现有军士守住。"
 hd_maa_source.0004.t:0 "白马义从兵源恢复"
 hd_maa_source.0004.desc:0 "右北平的回报这次没有列出一串难处，开头便说义从兵源已复。我把先前收起的军额再翻出来，纸边仍留着搁置时压下的折痕。\n\n招募与扩编都可以重办了。添不添兵，还要看我愿付多少军费；但那支曾只能在原有数目上反复盘算的白马骑军，如今终于有了增添人马的余地。"
 hd_maa_source.0004.a:0 "可再议招募义从。"
 hd_wuhuan_qicong:0 "乌桓骑从"
 hd_wuhuan_qicong_flavor:0 "#F 乌桓骑手挟弓逐敌，来去迅疾。长于袭扰和追击的骑从，能使敌军在接战以前便不得安歇。#!"
 hd_maa_source.0005.t:0 "乌桓骑从兵源断绝"
 hd_maa_source.0005.desc:0 "乌桓骑从不能再增募了。消息说得明白，我却仍沿着舆图上的前军路线看了一遍：这里要探路，那里要追击，原来有这么多地方都等着新骑手。\n\n已经编成的军团仍在，停下的是招募与扩编。我让书吏把这些未发的募令另放一处，免得军前仍空等添援。熟悉骑射的人，也不是从步营里换一面旗就能凑出来的。"
 hd_maa_source.0005.a:0 "暂缓增募，勿以虚数充军额。"
 hd_maa_source.0006.t:0 "乌桓骑从兵源恢复"
 hd_maa_source.0006.desc:0 "乌桓骑从的征募又可办理，书吏报完，我便想到那几处一直缺少骑手的部署。图上的路没有变，只是我终于不必再将同一营人来回指派。\n\n当然，兵源恢复还不是新军到来。要招多少、扩充哪营，都须我另拨钱粮。但这一次，募令总算有地方可以发去了。"
 hd_maa_source.0006.a:0 "再有征募之需，便可着手。"
 hd_jizhou_qiangnu:0 "冀州强弩"
 hd_jizhou_qiangnu_flavor:0 "#F 弩臂张满，机牙待发。冀州弩手以成列的强弩迎敌，锋镝所指，披甲之士也不能轻进。#!"
 hd_maa_source.0007.t:0 "冀州强弩兵源断绝"
 hd_maa_source.0007.desc:0 "冀州强弩的募额被退回来了。书吏指着空下的名字说兵源已断，我低头看见旁边备械的旧议，忽然觉得那串弩数也没了原先的分量。\n\n弩可以买，射弩的人却不能凭空添上。现有军团照旧听用，新募与扩编暂时都办不了。等兵源恢复之前，下一道布阵之令须按实有弩手来写。"
 hd_maa_source.0007.a:0 "按实有弩手布阵。"
 hd_maa_source.0008.t:0 "冀州强弩兵源恢复"
 hd_maa_source.0008.desc:0 "冀州弩手又可以征集，案上那份搁置已久的募额终于等到回音。我让书吏将它展开，重新看过原先打算添兵的地方。\n\n招募与扩编已经恢复，弩阵却还须另费钱粮组建。若眼下要添，这次便不必再听一句“有械无人”；若暂不添，也总算是我自己可以作的决定。"
 hd_maa_source.0008.a:0 "可以重新筹募弩手了。"
 hd_xiandeng_ruishi:0 "先登锐士"
 hd_xiandeng_ruishi_flavor:0 "#F 临阵向前者先受锋刃，也先争战功。冀州锐士以甲盾护身，凭严整步阵迎敌，替后军争取立足之处。#!"
 hd_maa_source.0009.t:0 "先登锐士兵源断绝"
 hd_maa_source.0009.desc:0 "“先登锐士的募额，暂时办不成了。”我听着冀州来报，把刚拿起的军务文书又放下。最需要他们的地方，偏偏不能用一个空数去搪塞。\n\n现有锐士仍可调遣，并不因此解散。但要另立新营、扩充旧阵，都须等兵源恢复。先前拟好的几路部署，如今得重新看看，哪一路真有足够的人向前。"
 hd_maa_source.0009.a:0 "先登锐士，暂不增募。"
 hd_maa_source.0010.t:0 "先登锐士兵源恢复"
 hd_maa_source.0010.desc:0 "冀州又能选募锐士了。我读罢来报，手指在旧军额上停了一下，那几处空白原来已经看得十分习惯。\n\n如今招募与扩编恢复，才发现先前放弃的打算，并非都得一直放弃。甲械与给养仍须另备，可只要愿意投入，便又有人可以征集。下一次问谁来充实前阵，不必总让现有几营勉强分担。"
 hd_maa_source.0010.a:0 "再议选募敢战之士。"
 hd_qingzhou_bing:0 "青州兵"
 hd_qingzhou_bing_flavor:0 "#F 青州壮丁编伍执兵，在严整号令下结成步阵。兵众之多须有军纪相持，才能把人群变成可用之军。#!"
 hd_maa_source.0011.t:0 "青州兵兵源断绝"
 hd_maa_source.0011.desc:0 "青州的募兵文书送回来时，原定军额旁多了一条停办的记录。我让书吏重新报一遍，听清不能继续征集，才把案上的部署拿近。\n\n已经编成的青州兵仍可听令，缺的是原想再添的那一批人。新募与扩编都得等兵源恢复。我划掉一处多算的兵额；不把它划掉，军前也不会因此真多出一个人。"
 hd_maa_source.0011.a:0 "先把实有军额记清。"
 hd_maa_source.0012.t:0 "青州兵兵源恢复"
 hd_maa_source.0012.desc:0 "青州兵源恢复，停下的募额又能办理了。我原已习惯每逢问起都听到同一句推迟，今日这份回报，倒叫人特意多看了一遍。\n\n尚未有新兵直接入营，钱粮也仍须另拨。不过，招募与扩编的路已经重新打开。那些曾经划去的数目，若确有需要，如今可以认真写回去了。"
 hd_maa_source.0012.a:0 "青州兵可以重新征募了。"
 hd_liujun_liangjiazi:0 "六郡良家子"
 hd_liujun_liangjiazi_flavor:0 "#F 六郡良家子以弓马入军，既能驰射，也敢接刃。边地养成的骑战本领，经军中约束后更见锋芒。#!"
 hd_maa_source.0013.t:0 "六郡良家子兵源断绝"
 hd_maa_source.0013.desc:0 "六郡良家子的增募停下，书吏将未能落实的军额另列一牍。我接过来，先前打算调往几处的骑军，竟都靠着这一页尚不存在的人。\n\n现有军团依旧可用，新增与扩编却须等兵源恢复。我把未发军令暂且抽出。善骑之士从来不是招呼一声便有，可直到今日，这句话才真正落在我自己的部署上。"
 hd_maa_source.0013.a:0 "骑阵暂按旧额。"
 hd_maa_source.0014.t:0 "六郡良家子兵源恢复"
 hd_maa_source.0014.desc:0 "六郡良家子又可征集了。来报念到兵源已复，我便让人把旧军籍找出，连方才还在商议的事情也暂且停了。\n\n先前缺少骑军的几处，总算又有办法可想。要募多少，仍须看钱粮；新的部伍不会随回报自己走来。但再议扩军时，我已经可以把六郡重新算作一条实在的来路。"
 hd_maa_source.0014.a:0 "六郡弓马，又可入我军籍。"
 hd_huangzhong_yicong:0 "湟中义从"
 hd_huangzhong_yicong_flavor:0 "#F 湟中义从熟习边路，能骑射、善驰逐。分散时可探敌虚实，聚合时又能随号令投入战阵。#!"
 hd_maa_source.0015.t:0 "湟中义从兵源断绝"
 hd_maa_source.0015.desc:0 "湟中义从的征募已停。我听完回报，又看向图上几条准备交给骑从探行的边路，迟迟没有继续落笔。\n\n旧军仍可调遣，新的名额却无处征集。直到兵源恢复以前，招募与扩编都须搁置。图上每条路我都认得，真正能替我沿路走过去的人，却比原先打算的少了。"
 hd_maa_source.0015.a:0 "先按现有义从用兵。"
 hd_maa_source.0016.t:0 "湟中义从兵源恢复"
 hd_maa_source.0016.desc:0 "湟中又有合用兵源，义从可以重新招募、扩编。我将回报放在舆图旁，忽然又想起几路因人手不足而搁下的安排。\n\n眼前尚无新军，仍须另拨资财招集。但总算不必每次谈到边路，便先问哪支旧部还能再抽几人。原来的募额留了许久，今日终于有了可以续办的理由。"
 hd_maa_source.0016.a:0 "湟中义从可再招集。"
 hd_bandun_congbing:0 "板楯賨兵"
 hd_bandun_congbing_flavor:0 "#F 板楯在前，短兵随后。巴郡賨兵沿山路进退，以盾护住近身搏杀的同伴，在狭地也能结队接战。#!"
 hd_maa_source.0017.t:0 "板楯賨兵兵源断绝"
 hd_maa_source.0017.desc:0 "巴郡的募令没有带回我想要的答复。板楯賨兵的兵源已断，原拟增加的军额只能停下，书吏说到这里便不再往下念。\n\n我看着准备发往险路的部署，叫他先别收。现有军团仍在，可新募与扩编已无从办理。要等兵源恢复之前，那些狭路上的差遣，只能让手中实有的部伍承担。"
 hd_maa_source.0017.a:0 "先用好现有板楯賨兵。"
 hd_maa_source.0018.t:0 "板楯賨兵兵源恢复"
 hd_maa_source.0018.desc:0 "巴郡又能征集賨兵，先前停办的募额终于有了回音。我将文书读完，最先想到的便是几处险路守备。\n\n招募与扩编可以重开，军费仍须另行支出；此刻并没有新盾阵凭空列在营前。然而总算又有了愿意筹钱便能着手的事，不必只对着现有军籍，拆来拆去。"
 hd_maa_source.0018.a:0 "巴郡的盾阵，又可添人。"
 hd_wudang_feijun:0 "无当飞军"
 hd_wudang_feijun_flavor:0 "#F 山路狭处，弓弩与短兵各有用场。无当飞军循险而进，能在重阵难以展开的地方接敌、掩护与转战。#!"
 hd_maa_source.0019.t:0 "无当飞军兵源断绝"
 hd_maa_source.0019.desc:0 "无当飞军的兵源已断，南中来报将此事写得明白。我将原拟增募的文书翻回第一页，才发现那道催办之令甚至还没来得及发出。\n\n现有军团仍可用，往后新募与扩编却须暂缓。山路不会等人，缺下的军士又不能凭声名补齐。我将催令收起，只留下现有部伍的名数，重新看眼前的军务。"
 hd_maa_source.0019.a:0 "山地用兵，先量现有兵力。"
 hd_maa_source.0020.t:0 "无当飞军兵源恢复"
 hd_maa_source.0020.desc:0 "南中兵源恢复，无当飞军又可以增募了。我叫人将旧定额取来，先前不得不留空的几处，也终于有了继续商议的余地。\n\n新的军士尚须花钱粮征集，并未随这份回报直接到来。可下一次遇到险地用兵，便不必只问现有诸营还能抽多少人；至少这条募兵的路，已经重新握在我手里。"
 hd_maa_source.0020.a:0 "无当飞军可再征集。"
 hd_wuxi_manbing:0 "五溪蛮兵"
 hd_wuxi_manbing_flavor:0 "#F 五溪军士习于山林水道，以轻捷步阵追踪、伏击。循溪而行的人，往往比沿大道进军的人更早发现敌踪。#!"
 hd_maa_source.0021.t:0 "五溪蛮兵兵源断绝"
 hd_maa_source.0021.desc:0 "五溪军士的增募停了。回报送到，我望着图上蜿蜒的水道，才意识到那几条线原先都等着同一批新兵。\n\n现有军团仍然听调，只是招募与扩编都已受阻，须待兵源恢复。我让书吏暂撤未发的募令。军前若还依原数筹划，等到的便只有一份迟来的解释。"
 hd_maa_source.0021.a_keep:0 "暂缓增募五溪军士。"
 hd_maa_source.0022.t:0 "五溪蛮兵兵源恢复"
 hd_maa_source.0022.desc:0 "五溪兵源重新具备，原先停下的招募又能办理。我将回报与军籍对过，心里已经开始盘算哪些缺口值得先补。\n\n军士尚未入营，钱粮也要另筹；恢复的是新募与扩编的来路。但再碰到林泽间的用兵难处，我总算不必只指着旧军额，让各处自己设法周转。"
 hd_maa_source.0022.a:0 "山路水道，又有可募之人。"
 hd_shanyue_jiashi:0 "山越甲士"
 hd_shanyue_jiashi_flavor:0 "#F 山越部众选其强健者披甲编伍，在林岭间结成步阵。熟悉险路的脚步，须与军中号令一同进退。#!"
 hd_maa_source.0023.t:0 "山越甲士兵源断绝"
 hd_maa_source.0023.desc:0 "山越甲士的增募文书被退到案前，我先看见熟悉的军额，再看见旁边不能办理的说明。兵源不足，这几个字把原先的筹划截得干净。\n\n现有军团并不解散，仍可调遣；新募与扩编却须等条件恢复。我将那份纸翻过去，开始按已有的部伍重算。算来算去，少的人始终不会自己回来。"
 hd_maa_source.0023.a:0 "现有甲士照旧听令。"
 hd_maa_source.0024.t:0 "山越甲士兵源恢复"
 hd_maa_source.0024.desc:0 "山越甲士又能征募，先前收起的军额终于可再议。我把回报递回书吏手里，让他和旧文书放在一处，免得下次还按停办处置。\n\n如今恢复了招募与扩编，是否立即增兵，仍看我的军费和部署。新军尚未成形，但能筹办与不能筹办，毕竟已经是两种局面。"
 hd_maa_source.0024.a:0 "可再选募披甲之士。"
 hd_danyang_jingbing:0 "丹阳精兵"
 hd_danyang_jingbing_flavor:0 "#F 丹阳步卒持兵相接，敢于近战。山地出身的强健军士编成严整营伍，便不只各凭一身勇力。#!"
 hd_maa_source.0025.t:0 "丹阳精兵兵源断绝"
 hd_maa_source.0025.desc:0 "丹阳的兵源已断，原拟招来的步卒一时都没有着落。我翻看回报，问是否连扩充旧部也不成，来人低头答是。\n\n现有丹阳精兵仍归我调遣，并未失去。可新军额既然落空，先前几项部署便不能只凭旧稿传下。我把未发文书留在手边，得等兵源恢复，再把那些缺下的人重新算进去。"
 hd_maa_source.0025.a:0 "用兵先计实数。"
 hd_maa_source.0026.t:0 "丹阳精兵兵源恢复"
 hd_maa_source.0026.desc:0 "丹阳又能征集步卒了。我听到消息，便将原先停下的军额翻出，纸边已被别的文书压得卷起。\n\n招募与扩编都可恢复，添一营的费用却仍须实付。是否现在增兵，还要我来定；好在下次有人提起丹阳精兵，终于不必只谈名声与旧部，而能谈怎样再招一支。"
 hd_maa_source.0026.a:0 "丹阳精兵，可以再募。"
 hd_fuling_liannushi:0 "涪陵连弩士"
 hd_fuling_liannushi_flavor:0 "#F 涪陵弩士以接续的弩矢封住狭路。军械、矢簇与射者须彼此相济，才能使来敌难以乘隙逼近。#!"
 hd_maa_source.0027.t:0 "涪陵连弩士兵源断绝"
 hd_maa_source.0027.desc:0 "涪陵不能继续征集连弩士了。书吏把募额放下，我却先问那些拟添的弩械如今如何安排，话出口才想起，眼下缺的并不只是器物。\n\n现有连弩士仍可听令，新募与扩编都须等待兵源恢复。没有合用军士，再多弩机也只会列在库中。我将扩军之议暂收，先按手里实有的弩阵筹划。"
 hd_maa_source.0027.a:0 "先按现有弩士安排守备。"
 hd_maa_source.0028.t:0 "涪陵连弩士兵源恢复"
 hd_maa_source.0028.desc:0 "涪陵弩士的兵源恢复，旧募额终于可以继续办理。我把回报放在备械文书旁，这两份先前总接不起来的账，如今又能一同商量。\n\n招募多少、扩充哪营，仍要另付钱粮。新军不会自己到来，但至少不必再因无处征人，任那一叠拟好的计划长久压在案底。"
 hd_maa_source.0028.a:0 "弩士可募，旧议可续。"
 hd_qiang_qi:0 "羌骑"
 hd_qiang_qi_flavor:0 "#F 羌骑长于驰射，散而不乱，逐敌不舍。熟悉西部地势的骑手，以马力争取接敌与脱离的时机。#!"
 hd_maa_source.0029.t:0 "羌骑兵源断绝"
 hd_maa_source.0029.desc:0 "羌骑的征募已经停下。我看着回报，手指仍顺着原拟骑军走的路线慢慢划过，到转折处才停住。\n\n旧有军团并未散去，缺的是预备增添的人马。新募与扩编须等兵源恢复，那几路行军却已不能继续照原数安排。我叫人把军籍拿来，先看手里到底还有多少可用的骑手。"
 hd_maa_source.0029.a:0 "先按实有羌骑筹划。"
 hd_maa_source.0030.t:0 "羌骑兵源恢复"
 hd_maa_source.0030.desc:0 "羌骑又有合用兵源，招募和扩编都能重新办理了。我将旧募令读过一遍，发现先前不少不敢再提的部署，如今都还有重议的余地。\n\n钱粮仍须另拨，军士也还得实际招集；这份回报给我的，是重新选择的机会。至少下一次需要快骑，不必只让现有部伍一趟接一趟地奔走。"
 hd_maa_source.0030.a:0 "又可征集西部骑手了。"
 hd_bingzhou_bianqi:0 "并州边骑"
 hd_bingzhou_bianqi_flavor:0 "#F 并州边骑识塞路、惯驰逐，能在转战中寻机接敌。骑阵的锋芒来自军士与坐骑共同经受的奔走。#!"
 hd_maa_source.0031.t:0 "并州边骑兵源断绝"
 hd_maa_source.0031.desc:0 "并州边骑的募兵来路断了。我听完回报，暂时没有叫书吏退下，而是让他重报一遍现有骑军的数目。\n\n原想添募的人不在里面，怎么核也不会多出来。现有军团仍可调遣，往后新募与扩编则须等兵源恢复。我将下一路军令移到近处，有些先后，今日就得重新定过。"
 hd_maa_source.0031.a:0 "先量现有骑军再发令。"
 hd_maa_source.0032.t:0 "并州边骑兵源恢复"
 hd_maa_source.0032.desc:0 "并州的来报终于说可以再募边骑。我将前几次未办成的募额找出，原先那句反复出现的停办，如今总算能划去了。\n\n新募与扩编已经恢复，要多少人还须另作投入。军籍上的空处并未立刻填满，但若确有需要，已能着手办理。我让书吏把这条记清，免得下次议兵仍漏掉并州。"
 hd_maa_source.0032.a:0 "边骑可募，行军又多一分余地。"
 hd_tengjia:0 "藤甲兵"
 hd_tengjia_flavor:0 "#F 藤甲军士负甲穿行林间，以盾与短兵相持。这身装具自有用处，却不能替持兵者抵挡所有锋刃。#!"
 hd_maa_source.0033.t:0 "藤甲兵兵源断绝"
 hd_maa_source.0033.desc:0 "藤甲兵的兵源已断，南中送来的回报让扩编之议停在了案上。我将原拟增添的军额再看一遍，叫书吏先不要往下催。\n\n已成军的部伍仍可听调，不会因此解散；停下的是新募与扩编。等条件恢复以前，那些尚未入营的人便只能留在纸上。眼前要用多少兵，还须重新对照实有军籍。"
 hd_maa_source.0033.a:0 "既有部伍，照旧听调。"
 hd_maa_source.0034.t:0 "藤甲兵兵源恢复"
 hd_maa_source.0034.desc:0 "南中又能为藤甲兵提供兵源，原先停下的募令可以重新议办。我接过回报，先将它放到旧军额旁，免得这件事再沉进别的文书底下。\n\n如今招募与扩编皆可恢复，甲械、军士仍须另花资财筹集。是否马上增兵尚待我定；但原来只能搁着的事，今日终于又成了可以选择的事。"
 hd_maa_source.0034.a:0 "藤甲军士，可以再募。"
 hd_maa_training_no_valid_trainer:0 "没有合格的训练者，操练已经中止。"
 hd_debug_prepare_youzhou_tuqi_decision:0 "【调试】建立幽州突骑军制"
 hd_debug_prepare_youzhou_tuqi_decision_desc:0 "无视常规条件建立幽州突骑军制，并补足直辖兵源测试所需的控制力。"
 hd_debug_prepare_youzhou_tuqi_decision_tooltip:0 "用于测试幽州突骑的招募、扩编和兵源变化。"
 hd_debug_prepare_youzhou_tuqi_decision_effect:0 "幽州突骑测试条件已经建立。"
 hd_debug_train_xianzhenying_decision:0 "【调试】操练陷阵营"
 hd_debug_train_xianzhenying_decision_desc:0 "以我本人为训练者，直接进入陷阵营训练事件。"
 hd_debug_train_xianzhenying_decision_tooltip:0 "用于测试陷阵营的投入和成军结果。"
 hd_xianzhenying:0 "陷阵营"
 hd_xianzhenying_flavor:0 "#F 重甲相接，号令不紊。陷阵营以整齐步阵迎向锋刃，凭相互掩护的盾与兵器打开敌阵。#!"
 hd_xianzhenying_army:0 "陷阵营"
 hd_maa_training.1000.t:0 "操练陷阵营"
 hd_maa_training.1000.desc:0 "[hd_maa_trainer.GetTitledFirstName]将选练之议呈上，先说甲盾，再说军纪。人要敢战，也要肯在同伴身旁站住；只挑最先冲出去的，未必挑得出能一同回来的。\n\n我伸手掂了掂案边的甲片。“这些都齐备，要多少钱？”[hd_maa_trainer.GetSheHe]把所需逐项指出：从现有军士中择勇，花费最省；厚加赏赐，便能争取更多好手；若肯大开府库，选人和装具都有更大余地。\n\n我的手停在钱粮簿上。这支军队还未成形，开支倒已经排成了阵。"
 hd_maa_training.1000.a:0 "依现有资用，择勇成军。（100金币，150威望）"
 hd_maa_training.1000.b:0 "厚赏选卒，备足甲械。（250金币，300威望）"
 hd_maa_training.1000.c:0 "不吝府库，尽力选练！（500金币，500威望）"
 hd_maa_training.1001.t:0 "陷阵营成军"
 hd_maa_training.1001.desc_tier1:0 "陷阵营的成军回报送来，我先看人数，再看检阅所记。队伍已经编成，却仍有转阵稍慢、前后相接不够紧密之处，不能拿一个响亮的军号把这些都遮过去。\n\n我把那几行评语多读了一遍。好歹已有可用之军，不必再从空名起步；往后派到何处，却应记着他们眼下的本领。军籍落定，八百至一千名甲士已可听调。\n\n案外传来催问军令的声音。我合上回报，先让这支新军有个稳当去处。"
 hd_maa_training.1001.desc_tier2:0 "成军回报里的评语比我预想的平实：甲械齐备，列伍有序，进退大体能随号令。我翻到末尾，才见那句“可以听用”，墨迹落得很稳。\n\n这便够我认真筹划一番了。陷阵之名不是喊给自家人听的，到了阵前，还须靠盾后每一个人守住位置。我没有急着将他们说成无敌之军，只把新编的九百至一千二百名甲士记入可调兵力。\n\n从此再有人问谁能向前，我总算多了一支可以考虑的部伍。"
 hd_maa_training.1001.desc_tier3:0 "检阅的回报送到，几处最要紧的地方都写得明白：前列举盾，后队接进，收兵时也无人只顾争先。读到这里，我才把压在军籍上的手松开。\n\n陷阵营没有只剩一群披甲的好勇之徒。号令能贯通前后，才配得上让我在敌阵前信任他们。如今一千一百至一千四百名甲士已经成军，我先前付出的资财，总算有了看得见的着落。\n\n我将这份回报留在案上，重新翻开下一路用兵的文书。"
 hd_maa_training.1001.desc_tier4:0 "“收阵时，末一列也没有乱。”来报的军吏说到这里，竟抬起两手，比出甲士持盾相接的样子。我示意他继续，连送到手边的饮水都忘了接。\n\n前列接敌，后队补上，号令一转，整营又能依次退回。陷阵营这一回选练所得，确实不只多了几副漂亮甲械。一千三百至一千五百名甲士已经成军，光听这番检阅，我便忍不住想把他们放到下一次军议里。\n\n军吏说完，我才发觉手边的水已经凉了。好，让我看看，这支新军还能为我做些什么。"
 hd_maa_training.1001.a:0 "陷阵之士，听我军令。"
 hd_hubaoqi:0 "虎豹骑"
 hd_hubaoqi_flavor:0 "#F 劲骑披甲，策马向前。虎豹骑以迅猛冲击争取破阵之机，尤其能在开阔地上发挥骑军的锋芒。#!"
 hd_hubaoqi_army:0 "虎豹骑"
 hd_maa_training.1100.t:0 "操练虎豹骑"
 hd_maa_training.1100.desc:0 "[hd_maa_trainer.GetTitledFirstName]谈起选练虎豹骑，先将马匹所需的费用指给我看。我还没说话，[hd_maa_trainer.GetSheHe]又添上甲械与选募之费，钱粮簿上几乎没有一处可以轻轻带过。\n\n“骑者敢进，马也须进得去。”这句话倒比那些数目更直截了当。我想象骑阵接敌时的轰响，再看眼前这张安静的账目，终于明白两者并不是不相干的事。\n\n是就现有资用择优编练，还是加厚赏赐，乃至尽力供给？驰向敌阵以前，这支骑军得先从我的府库前走过。"
 hd_maa_training.1100.a:0 "先从现有骑者中择优。（100金币，150威望）"
 hd_maa_training.1100.b:0 "厚赏骑士，充实马甲。（250金币，300威望）"
 hd_maa_training.1100.c:0 "良马锐士，不吝资财！（500金币，500威望）"
 hd_maa_training.1101.t:0 "虎豹骑成军"
 hd_maa_training.1101.desc_tier1:0 "虎豹骑已经成军，回报却没有我想象中那般痛快。骑者各有本领，合在一处变换阵势时，前后仍有参差，不能一听鼓响就指望人人同进同退。\n\n我把检阅所记细看一遍，略有失望，却还不至于推开这份军籍。八百至一千名新骑已经可用，至少不再只是一项筹募打算。真正派他们接敌时，我得记住今日读到的这些迟疑。\n\n虎豹之名可以先立，能否不负这个名字，还要看日后的军令与战阵。"
 hd_maa_training.1101.desc_tier2:0 "虎豹骑的成军文书送来，检阅中最使我留意的，是骑队接续进退时没有乱了次序。能催马向前的人不少，肯依号令收住的人，同样不能少。\n\n如今九百至一千二百名骑军已可调遣，甲械与编伍也都妥当。我将军籍收好，没有因这份顺利便夸口下一战必胜；不过，再议开阔地上的接战时，我手里总算有了新的分量。\n\n花出去的钱帛不能追回，眼前这支骑军却可以向前。想到这里，我才略略舒了口气。"
 hd_maa_training.1101.desc_tier3:0 "读到虎豹骑的检阅回报，我原本绷着的脸色终于松动。队列展开有序，突进后能随令收转，骑者与坐骑的配合也经得起查验。\n\n这不是只靠一身胆气便能凑成的部伍。一千一百至一千四百名骑军已经成形，选练时费下的钱帛，如今换成了可以听命的马蹄。我将原先的用兵文书重新打开，在最需要骑军的一处停住目光。\n\n该让他们去哪一面接敌，仍须谨慎；但至少这回，我不必先为骑阵的空缺发愁。"
 hd_maa_training.1101.desc_tier4:0 "报信者说到虎豹骑突进时，手指沿案边一划，险些碰翻水盏。我本要叫他稳重些，听见后面骑队如何齐齐收转，又把话咽了回去。\n\n一千三百至一千五百名精骑已经成军，甲械、马匹与阵列皆得上评。那些起初看着颇重的费用，如今听来，竟仿佛只是一阵尚未传到耳边的马蹄声。\n\n我将舆图展开，让来人先别走。还有几处检阅细节要问，也有几路原先不敢多想的部署，如今很值得再想一想。"
 hd_maa_training.1101.a:0 "虎豹已集，待令驰突。"
 hd_baier:0 "白毦"
 hd_baier_flavor:0 "#F 白毦甲士持阵护卫，临危不轻离本位。在崎岖地上相互掩护的步军，能为身后的同伴守住退路。#!"
 hd_baier_army:0 "白毦"
 hd_maa_training.1200.t:0 "操练白毦"
 hd_maa_training.1200.desc:0 "[hd_maa_trainer.GetTitledFirstName]将白毦选练之议呈上。我原先问有多少勇士可选，[hd_maa_trainer.GetSheHe]却先谈遇敌时谁来守住空处，谁来掩护收队。\n\n我听了一阵，才把视线移到资用簿上。护卫之军不只要甲好、力强，还得能在旁人退时维持自己的位置。若只图省事随意编出一队，到了最需要他们的时候，军号再好听也无济于事。\n\n如今选人的办法有了，钱粮尚待我定。可以从现有资用中筹办，也可以厚赏优选；若尽力供给，便给这番选练留更大的余地。"
 hd_maa_training.1200.a:0 "依现有资用，选练护卫。（100金币，150威望）"
 hd_maa_training.1200.b:0 "厚赏优选，备足甲械。（250金币，300威望）"
 hd_maa_training.1200.c:0 "护卫之军，尽力供给。（500金币，500威望）"
 hd_maa_training.1201.t:0 "白毦成军"
 hd_maa_training.1201.desc_tier1:0 "白毦的回报已经送到。军队编成了，检阅中却还有几处相互掩护不够利落的记录，我看到那里，不自觉地皱起眉头。\n\n护卫之军最怕的，便是在需要补位时迟疑。但这支新军并非不可用，八百至一千名甲士已经听调，不能因我原先期望更高，就当这些人全无所得。\n\n我将文书上的不足重新看过，才收起军籍。往后用他们守在何处，须照眼下的本领安排，不能只凭白毦两个字便放心背过身去。"
 hd_maa_training.1201.desc_tier2:0 "白毦已经成军，检阅所记颇为稳当：列伍不乱，前后能够相持，收队时也有人照应后列。我读完才发觉，自己最在意的始终是最后那几行。\n\n九百至一千二百名甲士如今可供调遣。未必个个都能独当一面，可编在一处，已经像一支有统属的护卫，而不是各自逞勇的人群。\n\n我将新军籍归入军务文书，原先几处难以兼顾的守备，也可以再想一想了。这番选练谈不上惊人，至少没有辜负我的投入。"
 hd_maa_training.1201.desc_tier3:0 "白毦的检阅回报中，有一处写得很细：前列收转时，后队及时接住空隙，直到整队完毕也未失了照应。我停在那里，比看成军人数还多看了一会儿。\n\n一千一百至一千四百名甲士已经可用，选练的结果比我原先所望更好。能在进退之间守住同伴的人，才值得托付身后的路。\n\n我将回报放回案上，终于不再反复盘算这笔钱帛是否花得冤枉。新的部伍已经交到手里，该如何使用，便是我的事了。"
 hd_maa_training.1201.desc_tier4:0 "白毦的回报读到一半，我叫人停下，再把后队接住前列的那段念一遍。旁人只顾听军额，我却忽然对这个细节格外在意。\n\n一千三百至一千五百名甲士，进退严整，收转时彼此相护。若有一天军前不得不退，我希望看见的正是这样的队伍，而不是每个人只认得自己脚下的路。\n\n后面的检阅也都上佳。我将军籍拿在手中，方才还觉得这笔选练之费沉重，此刻却很难再挑出一句不值来。这些人既已听调，往后的部署也终于可以宽些了。"
 hd_maa_training.1201.a:0 "白毦成军，可托阵后。"
 hd_jiefanbing:0 "解烦兵"
 hd_jiefanbing_flavor:0 "#F 解烦兵轻捷应变，能在林泽间接战转移。遇急而动、得隙而进，既可追敌，也能为友军解围。#!"
 hd_jiefanbing_army:0 "解烦兵"
 hd_maa_training.1300.t:0 "操练解烦兵"
 hd_maa_training.1300.desc:0 "[hd_maa_trainer.GetTitledFirstName]展开选练之议，谈起解烦兵应如何拆队接应、遇敌再合。我听着，想到那些一封比一封催得急的军报。\n\n快并不只是跑得快。兵器与行装不能拖累脚步，小队离开大阵也须认得号令，否则赶到得早，反会散得更早。[hd_maa_trainer.GetSheHe]将几项开支列明，便不再往下说了。\n\n眼下轮到我定钱粮。依现有资用也可开办，厚赏能够争取更多合用军士；若肯尽力支持，选练自然多些余地。要替军中解烦，倒先得让我解开这笔账。"
 hd_maa_training.1300.a:0 "就现有军士择优编练。（100金币，150威望）"
 hd_maa_training.1300.b:0 "厚赏选募，充实部伍。（250金币，300威望）"
 hd_maa_training.1300.c:0 "应急之军，尽力筹备！（500金币，500威望）"
 hd_maa_training.1301.t:0 "解烦兵成军"
 hd_maa_training.1301.desc_tier1:0 "解烦兵已经编成，回报中却仍有转队时呼应不够迅速的记载。我读到这里，将原先准备交付的一项急务暂且放回案边。\n\n八百至一千名军士已经可用，不能说一无所得；只是要他们在紧迫之际独自应变，还不宜抱太满的指望。我将检阅所记细看一遍，免得只听见“成军”二字，就忘了后面的不足。\n\n军号已经立下，能调之兵也确实多了。往后怎样把这支队伍用得恰当，仍要由我费心。"
 hd_maa_training.1301.desc_tier2:0 "解烦兵的成军回报送来，检阅所记令人稍安：各队能分能合，接到号令也能及时转向，没有只顾往前跑而失了照应。\n\n如今九百至一千二百名军士已列入军籍。我将先前那些难以派兵兼顾的地方重新看过，心里总算不再只有拆东补西的打算。虽不能凭这一支新军包办所有急务，却已有了实在可调的人手。\n\n我合起回报，把它放在待发的军务文书旁。若再有紧要军情，至少又多一支队伍可以考虑。"
 hd_maa_training.1301.desc_tier3:0 "回报上说，解烦兵检阅时各队交替进退，接应与收束都做得利落。我沿着所记看下去，原来担心他们一分便散，此刻才略略放下心来。\n\n一千一百至一千四百名军士已经成军，既有奔走之力，也能听见同伴的号令。这才像一支可以用于应急的队伍，而不是换了名号的普通步卒。\n\n我将文书留下，重看林泽一带的部署。能不能及时赶上真正的急难，还要看我的调遣；但这一次，军中确实多了可用之才。"
 hd_maa_training.1301.desc_tier4:0 "来报者说起解烦兵分队接应，一口气讲了许多，我听到后来，索性让他把各队去向在图上指明。原先担心一分便散，眼前却每一路都能重新合回。\n\n一千三百至一千五百名军士已经成军，检阅各项皆优。我将先前搁置的一份军务文书抽出，忍不住又看了两眼。那时处处缺人，怎样挪都嫌慢，如今总算多了一支能应变的部伍。\n\n来报者还等着下文。我让他将细目留下，自己却已沿着舆图，想着第一道真正交给他们的军令。"
 hd_maa_training.1301.a:0 "军中有急，可调解烦。"
 hd_quyi_xiandeng:0 "麴义先登"
 hd_quyi_xiandeng_flavor:0 "#F 强弩隐于步阵，待敌逼近而齐发。这支沿麴义先登之法编练的弩军，以稳住阵脚迎击疾驰的骑兵。#!"
 hd_quyi_xiandeng_army:0 "麴义先登"
 hd_maa_training.1400.t:0 "操练麴义先登"
 hd_maa_training.1400.desc:0 "[hd_maa_trainer.GetTitledFirstName]说起操练先登弩军，先问军士能否在敌骑逼近时稳住手。我原本正看弩机所需的钱数，听到这里，才抬起头。\n\n强弩可以买来，肯等号令的人却须挑。[hd_maa_trainer.GetSheHe]指着选练之议，说要把持盾、张弩与齐射接在一处，不能各练各的。若我愿多拨资财，选人和备械便都宽裕些。\n\n帐外有人候着传令，案上却还缺最后一项。我可以依现有资用开办，也可以厚赏广选；最重的一笔开支，仍须我亲自点头。"
 hd_maa_training.1400.a:0 "依现有资用，选练弩阵。（100金币，150威望）"
 hd_maa_training.1400.b:0 "厚赏择人，备足弩械。（250金币，300威望）"
 hd_maa_training.1400.c:0 "尽力供给，练成先登！（500金币，500威望）"
 hd_maa_training.1401.t:0 "麴义先登成军"
 hd_maa_training.1401.desc_tier1:0 "先登弩军已经编成，检阅回报却记着几次号令未到便先行放矢。我把那几处圈出，不愿让“强弩破骑”的好听名号盖过它们。\n\n八百至一千名军士已可听用，阵列总算有了根基。只是临敌时能稳到哪一步，尚不能依我所愿夸大。往后真要他们迎击骑阵，得先记住这一回选练中的迟疑。\n\n我将文书合起，重新看过用兵打算。新军可以用，如何用，却不能省掉我这一番掂量。"
 hd_maa_training.1401.desc_tier2:0 "先登弩军的回报送到，盾列与弩手已能相互照应，齐射时也听得进号令。我看完检阅所记，才把军籍上的人数一并核过。\n\n九百至一千二百名军士已经成军。还谈不上能在任何敌阵前不动如山，却已有一支弩军该有的规矩；这番钱粮，至少换来了可供调遣的部伍。\n\n下一次议及骑兵威胁，我不必只想着怎样退开。不过，在真正交锋以前，这些射向靶场的弩矢，仍不能替我预先赢下一场仗。"
 hd_maa_training.1401.desc_tier3:0 "检阅回报中，弩阵等令、齐发、重整的次序记得分明。我一行行看下去，最先担心的抢射与散乱，都没有出现在这次评语里。\n\n一千一百至一千四百名先登军士已编练成形，盾与弩不再各自为战。若能选好接敌之处，便有希望让来骑付出代价。我把原先的军务文书移近，认真盘算这支新军可用在哪里。\n\n先登之法不是一声壮语，如今终于化成了我手里一支可以发令的队伍。"
 hd_maa_training.1401.desc_tier4:0 "“令未下，弩阵无人先发。”这句话使我抬起头来。来报者随后又说起齐射与重整，盾列如何遮护，前后如何接续，竟每一处都有可说的好处。\n\n一千三百至一千五百名先登军士已经听命。我拿过检阅文书，想起先前面对骑军时不得不一再更改的部署，指尖不觉将纸边捏紧。\n\n强弩已经练成，接下来便该挑一个能使它发挥的地方。我把折痕抚平，叫人重取军图。那些原先只好避让的道路，今日可以再仔细看一遍。"
 hd_maa_training.1401.a:0 "令至齐发，勿乱阵脚。"
 hd_suwei_hushi:0 "宿卫虎士"
 hd_suwei_hushi_flavor:0 "#F 宿卫虎士披坚持兵，守在主君与军阵要处。近身护卫所需的不只是勇力，更有临危不离的可靠。#!"
 hd_suwei_hushi_army:0 "宿卫虎士"
 hd_maa_training.1500.t:0 "操练宿卫虎士"
 hd_maa_training.1500.desc:0 "[hd_maa_trainer.GetTitledFirstName]来议虎士选练，行礼后仍立在近处。我看着这个将要替我挑选近卫的人，忽然觉得钱粮簿上的数目也没有那么刺眼了。\n\n[hd_maa_trainer.GetSheHe]所列的办法很明白：先择勇健，再看能否守令，甲械与赏赐也须相称。近卫若只在无事时好看，便不值得另立军号。\n\n我伸手将簿册翻到资用一页。依现有财力筹办、厚赏优选，或是尽力供给，三条路都摆着。要他们替我挡住的，也许正是将来某个来不及后悔的瞬间。"
 hd_maa_training.1500.a:0 "依现有资用，择勇为卫。（100金币，150威望）"
 hd_maa_training.1500.b:0 "厚赏优选，充实近卫。（250金币，300威望）"
 hd_maa_training.1500.c:0 "近身之军，不惜资用。（500金币，500威望）"
 hd_maa_training.1501.t:0 "宿卫虎士成军"
 hd_maa_training.1501.desc_tier1:0 "虎士的成军回报送到，队伍已可听令，检阅所记却仍有衔接迟缓之处。我读着这些不足，心里并不十分痛快。\n\n近卫站得近，细小的疏漏也显得格外扎眼。但八百至一千名军士毕竟已经成形，不能因为未尽我意，就当这一番选练白费了。哪处可以托付，哪处还须小心，我得记得比旁人更清楚。\n\n我收好军籍，回头看了一眼门外。军号已经立下，往后再如何调遣，不能只凭“虎士”两字便安心。"
 hd_maa_training.1501.desc_tier2:0 "虎士已经编成，回报里写着甲械齐备、换列有序，各处号令也能相接。我读到末尾，才发觉一直压在案边的手已经松开。\n\n九百至一千二百名军士如今可供调遣。这支新军不必被说成无所不能，只要能够守住自己的位置，便值得留下。我将军籍放在近处，先前几项难以兼顾的护卫安排，也可以重新商议了。\n\n门外仍与方才一样安静。可知道手中又多了一支可用之军，这份安静，似乎也踏实了几分。"
 hd_maa_training.1501.desc_tier3:0 "虎士的检阅回报写得细致：接令、换列、相互掩护，都没有哪一处只靠几句好话敷衍。我不由把文书移近些，又看了一遍。\n\n一千一百至一千四百名甲士已经成军，所付钱粮终究换来了像样的护卫。想到若有急变，不必再临时从别处抽人填补，心里原先绷着的一根弦才略略松下。\n\n我将军籍收妥，没有急于称赏不败。可靠的部伍已经交到手里，往后放在哪里、怎样使用，还须我给出可靠的军令。"
 hd_maa_training.1501.desc_tier4:0 "虎士的成军回报读毕，门外恰有人走过，我下意识看了一眼，才转回案前。原来谈起宿卫，人最先想到的，仍是离自己最近的那几步路。\n\n一千三百至一千五百名精锐甲士已经编成，换列、掩护与号令皆得上评。我让人将检阅再读一遍，听到几处相互接应的细节，终于点了点头。\n\n那笔钱确实没有白花。军籍放回手边，我忽然不再急着问还能省下多少资财。至少今日，知道又有这样一支部伍听命，已经足以使人安心几分。"
 hd_maa_training.1501.a:0 "虎士听命，宿卫有备。"
 hd_nanman_xiangbing:0 "南蛮象兵"
 hd_nanman_xiangbing_flavor:0 "#F 战象负重向前，驭手控其进退。这支象军在丛林尤具威势，也能于平地冲击敌阵；庞大的身躯仍须听从号令。#!"
 hd_nanman_xiangbing_army:0 "南蛮象兵"
 hd_maa_training.1600.t:0 "操练南蛮象兵"
 hd_maa_training.1600.desc:0 "[hd_maa_trainer.GetTitledFirstName]将象兵操练的开支列在案上，草料、装具、驭手，一项接着一项。我看过那份数目，险些以为军中要养的不只是象，还有一张永远填不满的嘴。\n\n[hd_maa_trainer.GetSheHe]却先谈进退的号令。战象能冲开前路，也须有人让它停下、转向；若只会催它向前，站在后面的军士同样不会安心。\n\n我点头听完，再把钱粮簿推近。依现有资用筹办，可以省下一些；厚加投入，选练便更从容。至于是否尽力供给，终究还得由我下决心。"
 hd_maa_training.1600.a:0 "依现有资用筹办象军。（100金币，150威望）"
 hd_maa_training.1600.b:0 "增拨资财，充实选练。（250金币，300威望）"
 hd_maa_training.1600.c:0 "象军所需，尽力供给。（500金币，500威望）"
 hd_maa_training.1601.t:0 "南蛮象兵成军"
 hd_maa_training.1601.desc_tier1:0 "象兵已经成军，回报中却仍记着几次转向不够顺畅的情形。我读到那里，眼前仿佛又浮起那些庞大的身躯，不由停了一停。\n\n八百至一千名象兵已经可用，驭手与部伍也已编列，只是检阅未尽人意。派往何处、如何接战，都不能只看它们声势骇人便随意决定；若军令安排不当，先受惊的未必是敌人。\n\n我将回报收好，另看眼前用兵之需。象军既然交到手里，便要使它成为助力，而非一项需要处处绕开的难题。"
 hd_maa_training.1601.desc_tier2:0 "象兵的回报终于送来，驭手能够随令驱进、收转，护从也已编列妥当。我反复看过检阅一节，才放下先前对这支新军的顾虑。\n\n九百至一千二百名象兵已经成军。这些军士和驭手所撑起的威势，不能只拿寻常步阵的办法估量；真正接敌时，要留够施展的地方，也要顾好后队。\n\n所费资财总算有了着落。我将文书放在军籍旁，开始琢磨哪里既需要这样的冲击，又不至于让庞大的队伍无处进退。"
 hd_maa_training.1601.desc_tier3:0 "检阅回报里，象兵的驱进、转向与收束都记得清楚，驭手和护从也能相互配合。我看完一遍，才觉得那笔沉重的开支有了分量相当的回报。\n\n一千一百至一千四百名象兵已编成可用之军。它们的威势不再只是远望时令人惊叹，已经能够随军令安排。我沿着舆图看过几处可能接敌之地，又将目光移回回报。\n\n真到出兵时，仍须把给养和行进之路顾全。今日所得越好，越不能让往后的草率调遣白白毁了它。"
 hd_maa_training.1601.desc_tier4:0 "来报者说起象阵驱进，张开双臂比了一个宽度，见我看着，又急忙放下。我反倒笑了，让他继续说，尤其把如何收转讲清。\n\n驭手随令，护从接应，检阅中的进退竟比我原先所望还要妥帖。一千三百至一千五百名象兵已经成军；起初那张近乎吓人的资用簿，如今总算换来了同样有分量的东西。\n\n我把舆图拉近，先看道路，再看可展开之处。若有一天敌军真望见象阵向前，我希望他们脸上的神情，也值得这样细细报来。"
 hd_maa_training.1601.a:0 "象军成列，待令而进。"
 hd_baiyibing:0 "白衣兵"
 hd_baiyibing_flavor:0 "#F 白衣兵轻装疾行，善于林岭间的追踪与截击。接敌可进，掩护可退，靠的是脚力、隐蔽与相互照应。#!"
 hd_baiyibing_army:0 "白衣兵"
 hd_maa_training.1700.t:0 "操练白衣兵"
 hd_maa_training.1700.desc:0 "[hd_maa_trainer.GetTitledFirstName]说起白衣兵的选练，没有先数甲械，而是问谁能辨路，谁能在离开大队后仍记得约定的去处。\n\n我听着这番话，伸手将舆图上的一面小旗挪到路旁。轻装不是少领几件东西便算数，分队也不是把人随意撒出去；若到时找不到彼此，再快的脚步也只会把队伍带得更散。\n\n[hd_maa_trainer.GetSheHe]将选募之费列明。我可以依现有资用开办，也可以厚赏争取好手，或为这次选练尽力供给。临敌时要他们走得轻，眼下的钱粮却不能不掂量。"
 hd_maa_training.1700.a:0 "就现有军士择优选练。（100金币，150威望）"
 hd_maa_training.1700.b:0 "厚赏好手，充实部伍。（250金币，300威望）"
 hd_maa_training.1700.c:0 "精练轻兵，尽力支持。（500金币，500威望）"
 hd_maa_training.1701.t:0 "白衣兵成军"
 hd_maa_training.1701.desc_tier1:0 "白衣兵已经编成，检阅回报却记着几处接应不够利落的地方。我看过之后，把原想交给他们的一项冒险差事暂且搁下。\n\n八百至一千名军士已可调遣，轻捷之长也并非全无所得；只是散开后如何再聚，还不能像我原先想的那样省心。若只因军号好听，便把他们送得太远，吃亏的终究还是我的兵。\n\n我将不足之处记在心里，收好军籍。新军已经有了，下一步是给他们一个合乎本领的去处。"
 hd_maa_training.1701.desc_tier2:0 "白衣兵的成军回报颇为平稳，分队与接应都能依令，检阅中也没有谁只顾争快便失了同伴。我看到这里，才把先前的担心略略放下。\n\n九百至一千二百名军士已在军籍。这支队伍尚不值得夸成来去无踪，却已经能派上用场；往后遇到需要追踪或掩护的军务，不必总让笨重的大队兼顾。\n\n我将回报移到舆图旁，重新看过几条林间道路。用得好，这些未必显眼的人，也能替我省去不少硬碰硬的麻烦。"
 hd_maa_training.1701.desc_tier3:0 "白衣兵的检阅回报送来，各队离合有序，接应及时，转移时也未暴露出原先担心的散乱。我把那几处评语看完，才觉这次选练很值得。\n\n一千一百至一千四百名军士已经成军，脚力之外，还有一套能够彼此衔接的号令。若要在林岭间追敌、截路或掩护收兵，如今总算多了合用的部伍。\n\n我没有立即给他们许下夸耀的军功，只将新军籍好好收起。越是不靠正面声势吃饭的队伍，越要把第一道军令想清楚。"
 hd_maa_training.1701.desc_tier4:0 "白衣兵的检阅回报很快念完，我却将其中一段留下细问：各队离开大阵以后，究竟怎样循路接应，又怎样按令收回？\n\n来报逐项说清，我便顺着图上的小路看过去。那些不起眼的岔道，忽然都像有了用处。一千三百至一千五百名军士已经成军，检阅各项皆佳，选出的并非只会独自争快的人。\n\n我将文书放在图边，没有再问军号是否足够响亮。若到临敌时，能让对方直到兵至才明白谁来了，那才真正值得我记住。"
 hd_maa_training.1701.a:0 "轻兵已备，慎定进退。"
