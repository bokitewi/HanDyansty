l_simp_chinese:
 hd_yuan_jizhou.0001.t:0 "借兵图冀"
 hd_yuan_jizhou.0001.desc:0 "讨董诸军散去，渤海的粮道却仍要看韩馥的脸色。我听完催粮的回报，转而问起冀州北面的动静。\n\n韩馥坐拥富庶州郡，若无外患，未必肯认真听我相助之言。公孙瓒的兵马恰在北方；邀他南下，既可逼韩馥重新估量自己的处境，也能使我不必永远守着渤海等待周济。\n\n北上的书信已经发出。纸上写的是共同进取，真正落子之后，却还要看韩馥如何求援、公孙瓒如何用兵。我将回书的位置空在案上，等那两处消息先后送来。"
 hd_yuan_jizhou.0001.a:0 "静候北方兵势与冀州回音。"
 hd_yuan_jizhou.0002.t:0 "冀州易主"
 hd_yuan_jizhou.0002.desc:0 "韩馥的州印终于摆到我面前。我接过时，手上竟没有想象中沉，倒是随同交来的簿籍，一卷接着一卷，铺满了案。\n\n他的州郡与部众如今归我节制，本人也已入府安置。北边旧战随之停下，公孙瓒盼望的好处，却没有照先前那样落到手里。左右提起此事，我只让他们先把冀州交割办妥。\n\n粮道不必再仰人鼻息，袁氏终于握住一州根本。至于伯圭，他愿意怎样想，自有日后的来书。今日这方州印，先由我收好了。"
 hd_yuan_jizhou.0002.a:0 "收好州印，料理冀州新局。"
 hd_yuan_jizhou_cb:0 "争夺冀州"
 HD_YUAN_JIZHOU_WAR_NAME:0 "[ATTACKER.GetShortUIName]争夺冀州之战"
 hd_yuan_jizhou_victory_desc:0 "进攻方夺取冀州战争目标及相应领土与封臣。"
 hd_yuan_jizhou_no_conquest_desc:0 "双方结束争夺冀州之战；已完成的韩馥让地不会撤销。"
 hd_yuan_jizhou_handover_peace_desc:0 "韩馥让出冀州后，本次历史战争立即结束，不转移给袁绍；已完成的领地交接不会撤销。"
 hd_yuan_life_jizhou:0 "入主冀州"
