l_simp_chinese:
 # 天朝循环·时代特色：新朝征服期套件（圈地 / 天子改文化 / 汉化改制 / 保俗 / 前朝遗民 / 前朝复辟 / 本族叛乱）

 # ---------- 圈地（打压汉人） ----------
 hd_dc_con_quandi_decision: "圈地"
 hd_dc_con_quandi_decision_desc: "汉地沃土，岂容南人独享？择一州，把其中天子直辖的汉人县尽数赐予本族功臣，以酬从龙之劳。\n\n本族封臣将为此欢欣，但失地的汉人必然怨声载道。"
 hd_dc_con_quandi_decision_tooltip: "把一州的汉人县赏给本族功臣"
 hd_dc_con_quandi_decision_confirm: "圈地赐功"
 hd_dc_con_quandi_land_tt: "直辖至少一个都城以外的汉人（中华传承文化）县"
 hd_dc_con_quandi_decision_effect_tt: "选择一州：其中你直辖的汉人县（都城除外）赐予一名本族功臣（现有本族廷臣，没有则新募一人）为封臣\n本族封臣对你#P 好感 +15#!（十年），受封功臣#P 好感 +40#!\n这些县#N 控制 -30#!，县民#N 好感 -30#!（十年）\n计为「强制改俗」"
 hd_dc_con_quandi_county_modifier: "圈地之怨"
 hd_dc_con_quandi_county_modifier_desc: "祖产被夺以赏胡人功臣，此地汉民怨恨不已。"
 hd_dc_con_quandi_native_opinion: "圈地赏功"
 hd_dc_con_quandi_grantee_opinion: "受赐圈地"

 # ---------- 天子改文化 ----------
 hd_dc_con_hybrid_culture_decision: "胡汉合流"
 hd_dc_con_hybrid_culture_decision_desc: "入主中原日久，旧俗与汉制早已交融。以本族文化与都城的汉文化相合，另立新的文化，并承中华之统。"
 hd_dc_con_hybrid_culture_decision_tooltip: "创建胡汉混合文化"
 hd_dc_con_hybrid_culture_decision_confirm: "胡汉一家"
 hd_dc_con_capital_han_tt: "都城所在县为汉人（中华传承）文化"
 hd_dc_con_can_hybridize_tt: "可以与都城文化混合（需开启文化混合功能及相应游戏规则）"
 hd_dc_con_hybrid_heritage_tt: "新文化的传承改为#P 中华传承#!；你直辖的本族文化县与同宫的配偶、子女随之改用新文化"

 # ---------- 汉化改制 ----------
 hd_dc_con_sinicization_decision: "汉化改制"
 hd_dc_con_sinicization_decision_desc: "效法孝文故事，迁都、易服、改姓、禁胡语，尽革旧俗而行汉制。改制一经颁行便次第推进，每一步都会激起本族贵族的不满，甚至兵变。"
 hd_dc_con_sinicization_decision_tooltip: "颁行汉化改制"
 hd_dc_con_sinicization_decision_confirm: "诏行汉化"
 hd_dc_con_sinicization_decision_effect_tt: "开始汉化改制：迁都、易服、改姓、禁胡语四步依次推行（每 2~3 年自动推进一步，每步均可放弃）\n每完成一步：本族封臣对你#N 好感 -10#!（可叠加），汉人封臣#P 好感 +5#!（可叠加），并有#N 20%#!几率引发本族叛乱\n四步全部完成后，你改用胡汉混合文化\n与「保俗」互斥"
 hd_dc_con_sinicization_active_tt: "汉化改制已在推行中"
 hd_dc_con_baosu_blocks_tt: "已颁行「保俗」，不能同时推行汉化"
 hd_dc_con_sinicization_abandoned_tt: "十年内曾放弃汉化改制"
 hd_dc_con_native_revolt_risk_tt: "本族封臣中最强的不满者起兵叛乱"
 hd_dc_con_capital_already_han_tt: "都城已在汉地，无须再迁"
 hd_dc_con_sinicization_native_opinion: "汉化改制"
 hd_dc_con_sinicization_han_opinion: "汉化改制"
 hd_dc_con_yifu_modifier: "易服"
 hd_dc_con_yifu_modifier_desc: "天子改着汉家衣冠，以示华夏正统。"

 # ---------- 保俗 ----------
 hd_dc_con_baosu_decision: "保俗"
 hd_dc_con_baosu_decision_desc: "国之根本在于本族弓马。严守祖宗旧俗，厚待本族将士，汉人之怨言不足为虑。"
 hd_dc_con_baosu_decision_tooltip: "保持本族旧俗"
 hd_dc_con_baosu_decision_confirm: "恪守祖制"
 hd_dc_con_baosu_decision_effect_tt: "二十年内：与你同文化的封臣#P 征兵 +20%#!，汉人（中华传承）封臣对你#N 好感 -10#!\n期间不能推行汉化改制"
 hd_dc_con_sinicization_blocks_tt: "已推行或完成汉化改制"
 hd_dc_con_baosu_active_tt: "「保俗」仍在施行中"
 hd_dc_con_baosu_levy_modifier: "保俗"
 hd_dc_con_baosu_levy_modifier_desc: "天子恪守祖制、厚待本族，族中子弟踊跃从军。"
 hd_dc_con_baosu_han_opinion: "保俗轻汉"

 # ---------- 前朝遗民 ----------
 hd_dc_con_watched_tt: "此人将被暗中监视十年，起兵复辟的可能减半"
 hd_dc_con_remnant_honored_opinion: "优待前朝宗室"
 hd_dc_con_remnant_honored_han_opinion: "优待前朝遗民"
 hd_dc_con_remnant_killed_han_opinion: "诛杀前朝宗室"

 # ---------- 事件：圈地 ----------
 hd_dc_con.0100.t: "圈地"
 hd_dc_con.0100.desc: "从龙诸将屡屡进言：中原膏腴之地，正当分赐功臣。至于田中汉民，或逐或役，悉听新主。\n\n当圈哪一州之地？"
 hd_dc_con.0100.a: "圈[hd_dc_con_slot_1.GetName]之地"
 hd_dc_con.0100.b: "圈[hd_dc_con_slot_2.GetName]之地"
 hd_dc_con.0100.c: "圈[hd_dc_con_slot_3.GetName]之地"
 hd_dc_con.0100.d: "圈[hd_dc_con_slot_4.GetName]之地"
 hd_dc_con.0100.e: "暂且作罢"

 # ---------- 事件：汉化改制 ----------
 hd_dc_con.0201.t: "汉化改制：迁都"
 hd_dc_con.0201.desc: "旧都僻处一隅，风俗粗犷，非经营天下之所。朝议迁都于汉地腹心，以便亲近中原士民。本族勋贵恋土难离，群情汹汹。"
 hd_dc_con.0201.a: "迁都，势在必行"
 hd_dc_con.0201.b: "众意难违，罢议改制"
 hd_dc_con.0202.t: "汉化改制：易服"
 hd_dc_con.0202.desc: "新都既定，诏令朝野改着汉家衣冠，禁用胡服。老臣们抚着旧日的袍服，沉默不语。"
 hd_dc_con.0202.a: "衣冠既易，人心乃新"
 hd_dc_con.0202.b: "罢易服之令，改制作罢"
 hd_dc_con.0203.t: "汉化改制：改姓"
 hd_dc_con.0203.desc: "宗室与勋贵的复姓多出自部落旧称。诏改汉姓，定其门第，使之与中原士族比肩。"
 hd_dc_con.0203.a: "颁行汉姓，定其门第"
 hd_dc_con.0203.b: "祖姓难改，改制作罢"
 hd_dc_con.0204.t: "汉化改制：禁胡语"
 hd_dc_con.0204.desc: "最后一道诏书：凡在朝之人，不得再操本族之语，违者降爵黜官。此诏一下，改制便大功告成。"
 hd_dc_con.0204.a: "断北语，一从正音"
 hd_dc_con.0204.b: "此令太过，改制作罢"

 # ---------- 事件：前朝遗民 ----------
 hd_dc_con.0300.t: "前朝遗民"
 hd_dc_con.0300.desc: "前朝宗室[hd_dc_con_remnant.GetShortUIName]仍在人间。故国遗民对其念念不忘，朝中议论纷纷：有人主张厚加优待以收汉人之心，有人主张严加监视，也有人低声说，斩草须除根。"
 hd_dc_con.0300.desc.landed: "\n\n此人如今仍据有封地，不可不防。"
 hd_dc_con.0300.desc.landless: "\n\n此人如今流落无依，正可厚待以示宽仁。"
 hd_dc_con.0300.a: "优待前朝宗室"
 hd_dc_con.0300.b: "严加监视"
 hd_dc_con.0300.c: "斩草除根"
