 # ==========================================================================
 # 隐士故事循环（养望重制，2026-10-09）
 # ==========================================================================
 story_WJ_yinshi:0 "隐居"
 WJ_YINSHI_STORY_INFORMATION_STRING:0 "隐居山林，读书交游，不受任命。每隔数月会遇到一件学习、探究、乡里或朋友之间的小事，偶尔也会有人登门征辟。"

 WJ_yinshi_enter_decision:0 "隐居养望"
 WJ_yinshi_enter_decision_desc:0 "辞去一切官职，闭门读书，与乡里和故交往来，以学问与操守积累清望。"
 WJ_yinshi_enter_decision_tooltip:0 "辞官归隐，开启个人故事"
 WJ_yinshi_enter_decision_confirm:0 "归去来兮"
 WJ_yinshi_enter_decision_effect_tt:0 "获得特质[GetTrait('WJ_yangwang_trait').GetName( GetNullCharacter )]，拒绝一切任命、宫廷与议会职位，不再担任骑士或统兵\n开启个人故事“隐居”：每 4–8 个月发生一件隐居生活事件"
 WJ_yinshi_enter_decision_resign_tt:0 "所持男爵级以上非家族头衔连同附庸，全部交还直属上级"
 WJ_yinshi_cooldown_tt:0 "出山未满十五年，须至 [GetPlayer.MakeScope.Var('wj_yinshi_cooldown_end').GetValue|0] 年方可再次隐居"
 WJ_yinshi_blocked_tt:0 "此人正在隐居，不受任命"

 WJ_yinshi_exit_decision:0 "出山"
 WJ_yinshi_exit_decision_desc:0 "结束隐居，重新接受朝廷与诸侯的任命。"
 WJ_yinshi_exit_decision_tooltip:0 "结束隐居，恢复接受任命"
 WJ_yinshi_exit_decision_confirm:0 "出山"
 WJ_yinshi_exit_decision_effect_tt:0 "失去特质[GetTrait('WJ_yangwang_trait').GetName( GetNullCharacter )]，结束个人故事，恢复接受任命\n十五年内不能再次隐居"

 WJ_yinshi_risk_success:0 "所为有成"
 WJ_yinshi_risk_fail:0 "事与愿违"
 WJ_yinshi_friend_reason:0 "隐居时相知"

 # ---------------------------------------------------------------- 学习
 WJ_yinshi.1001.t:0 "灯下校古注"
 WJ_yinshi.1001.desc:0 "借来的抄本终于送到，几处文字却与家中旧卷不同。同一章句，一家重礼制，一家辨名实；门下后学各执一说，连午食时也争论不休。\n\n夜深后，我仍对着两份抄本。贸然立异，容易博得一时声名；但明知旧解未安而不发一言，也算不得诚于学问。灯芯烧短了一截，案上还留着足够写下新解的空纸。"
 WJ_yinshi.1001.a:0 "先校定文字，疑处不妨仍存其疑。"
 WJ_yinshi.1001.b:0 "逐条辨明异同，今夜便成此论。"
 WJ_yinshi.1001.c:0 "一字一句对勘到天明。"

 WJ_yinshi.1002.t:0 "旧注重开"
 WJ_yinshi.1002.desc:0 "翻检旧箧时，我找出一卷家中传下的经注。纸边已有虫蚀，几处批语仍能辨认：有的是前人郑重下笔，有的只是读到兴起时的疑问。如今再读，那些曾被奉为定论的解释，竟与我近年的见闻颇有抵牾。屋外风过竹叶，案上的旧字却让我迟迟不能翻页。\n\n若另写新说，后来读书的人或许能少走弯路，却也可能只记得我的辩驳，忘了旧学原有的长处。若只补缀残缺，家学便能完整传下，但我心中的疑问终究无处安放。灯下两张素纸，一张可写辨疑，一张可录旧注；今夜总要先落笔。"
 WJ_yinshi.1002.a:0 "先补全旧注，让后人看清家学本来的面目。"
 WJ_yinshi.1002.b:0 "另作辨疑，旧说与我的异议一并留存。"

 WJ_yinshi.1003.t:0 "两本异文"
 WJ_yinshi.1003.desc:0 "借来的一卷抄本与我手边旧本互有出入。同一句话，换了一个字，意思便从劝人持重变成催人进取；旁边的小注又像是后人误抄进了正文。我反复读了几遍，两种说法竟各有可通之处。纸页的磨损、墨色的深浅，都不能替我轻易判定谁先谁后。\n\n若选定一种读法誊入正文，读者不必处处分心，却会把我的判断当成古书本有的面貌。若并列异文，把取舍暂留给后来者，文字固然显得繁碎，却能让疑处继续被看见。案上摊着两卷书，我忽然不愿再用一个干脆的改字遮住抄传的曲折。"
 WJ_yinshi.1003.a:0 "两说并存，把不能断定之处明白标出。"
 WJ_yinshi.1003.b:0 "择一读法入正文，另注选择的理由。"
 WJ_yinshi.1003.c:0 "不急于断定，再借几种抄本来比勘。"

 WJ_yinshi.1004.t:0 "夜诵"
 WJ_yinshi.1004.desc:0 "入夜后山中格外安静，只听得见檐下滴水。白日里读过的一章经文，句句都认得，合上书却说不出它前后如何连贯。少年时师长要求熟诵，我曾嫌它笨拙；如今才觉，许多道理要在口中反复过几遍，才肯在心里落定。\n\n今夜可以只把这一章读熟，明日再往下走；也可以趁着清静一气读完全篇，看能否在倦意袭来之前，把散落的章句串成一条线。"
 WJ_yinshi.1004.a:0 "只把这一章读熟，明日再往下走。"
 WJ_yinshi.1004.b:0 "通宵诵读全篇，求一个贯通。"

 WJ_yinshi.1005.t:0 "临碑习字"
 WJ_yinshi.1005.desc:0 "友人托樵夫捎来一份旧碑拓本，墨色浓淡不匀，有几处字口已经漫漶。笔画间的气象却很开阔，与时下流行的书风颇不相同。我铺纸试写了几行，手腕总不听使唤，写出来的字只得其形。\n\n照着拓本一笔一画摹写，是最稳当的功夫；也有人说，学书到了一定地步，便该丢开范本，写出自己的面目。"
 WJ_yinshi.1005.a:0 "每日摹写一页，先求形似。"
 WJ_yinshi.1005.b:0 "撇开拓本，试着写出自己的体势。"

 WJ_yinshi.1006.t:0 "读律"
 WJ_yinshi.1006.desc:0 "乡里有人因一桩田产官司来问律文，我才发觉自己读了许多经书，对现行律令反倒生疏。借来的律本条目繁杂，同一桩事前后几条规定，轻重竟不一样。读书人常说律令是刀笔吏的学问，可乡人吃亏，往往正是吃在不明律文上。\n\n可以先把律本完整抄读一遍，熟悉条目；也可以试着把各条之间的道理疏通出来，写成一篇能让乡人看懂的解说。"
 WJ_yinshi.1006.a:0 "先完整抄读一遍，熟悉条目。"
 WJ_yinshi.1006.b:0 "疏通律意，写一篇乡人看得懂的解说。"
 WJ_yinshi.1006.c:0 "为乡人逐条核对，务求公允。"

 WJ_yinshi.1007.t:0 "九章算术"
 WJ_yinshi.1007.desc:0 "检书时翻出一部《九章算术》，是早年为应付课业买来的，书页几乎没有翻动过。随手看了几题，均输、方田都与乡中实事相关：分摊徭役、丈量田亩，都离不开这些算法。乡里的账目常有争执，多半也是因为没人算得清。\n\n可以从头一题一题演算，把基本算法练熟；也可以试着把书中的法则推到眼前的实事上，看能否求出一种更简便的算法。"
 WJ_yinshi.1007.a:0 "从头演算习题，把基本算法练熟。"
 WJ_yinshi.1007.b:0 "把法则推到乡中实事上，推求新术。"

 WJ_yinshi.1008.t:0 "观星记历"
 WJ_yinshi.1008.desc:0 "连日晴夜，星象格外分明。我对照手边的历书，发觉书中所载节气与眼前所见有一两日的出入。历法关系农时与祭祀，一向由太史掌管，山中隐者本不必过问；但这点出入若是真的，乡人播种便可能差上几天。\n\n可以先把历书所载抄录整齐，留作日后对照；也可以连着几夜观测，亲自推步，看看差在哪里。"
 WJ_yinshi.1008.a:0 "先把历书抄录整齐，留作对照。"
 WJ_yinshi.1008.b:0 "连夜观测推步，查明出入所在。"

 # ---------------------------------------------------------------- 探究
 WJ_yinshi.2001.t:0 "垄上问学"
 WJ_yinshi.2001.desc:0 "清早走到田边，我看见同一片坡地上的禾苗有高有低。乡人谈起土色、日照与雨水去向，所用的词并不见于我熟读的篇章，判断却往往切中眼前情形。我问得仔细，才知道自己过去一句笼统的顺天时，放到垄亩之间竟须拆成许多不同的工夫。\n\n把今日听来的经验依次记下，再于不同天气时回来看，或能留成一份可信的农事札记。若先去翻检旧书中论稼穑的文字，逐条与乡人的说法相较，也许能辨出哪些成说只适用于别处。泥土沾在履边，我不愿回屋之后便把这些话当作闲谈忘掉。"
 WJ_yinshi.2001.a:0 "留在田间逐次观察，先把本地经验记实。"
 WJ_yinshi.2001.b:0 "借一块薄田，亲自试种新法。"

 WJ_yinshi.2002.t:0 "采药识草"
 WJ_yinshi.2002.desc:0 "山后有位采药的老人，常背着竹篓从屋前经过。今日他停下来讨水，篓里的草叶我大半叫不出名字。老人说哪种可以退热，哪种只有晒干才能入药，哪种看着相似却会害人，说得头头是道，却说不出在哪本书里。\n\n我可以随他上山走一趟，一边看一边记；也可以把几种草带回来，按古书所载逐一辨认药性，必要时亲口尝一尝。"
 WJ_yinshi.2002.a:0 "随老人上山，一边看一边记。"
 WJ_yinshi.2002.b:0 "带回草叶，对照古书亲尝辨性。"

 WJ_yinshi.2003.t:0 "纸背另有春秋"
 WJ_yinshi.2003.desc:0 "裁理旧纸时，我在一页经文背面看到几行日用记事：某日借谷，某日返还，又有一句久雨难行的抱怨。字迹潦草，显然不是为留名而写。若照平常习惯裁去破边，最先消失的正是这些零散小字；但它们让我看见了正面端整章句之外的一段日子。\n\n把纸背杂记另行誊存，可以留下寻常人的劳作与往还，却须避免凭几句话猜出一整段身世。若将原页完整夹藏，只在目录中注明有杂记，后来的读者还能自己辨认笔迹与先后，只是查阅时不如抄成一卷便利。我停下裁纸的手，不愿再把无名当作无用。"
 WJ_yinshi.2003.a:0 "保留整页原貌，把正反两面的文字一同编目。"
 WJ_yinshi.2003.b:0 "追查这些杂记的来历，考证写于何时何人。"

 WJ_yinshi.2004.t:0 "山川地志"
 WJ_yinshi.2004.desc:0 "读地志时，我发觉书中记载的水道与乡人所说并不一致：书上说某水东流入河，乡人却说那条水早已改道，如今往南汇入另一条溪。地志多是前人辗转抄来，未必有人亲自走过。\n\n可以把几种地志的说法抄在一处，注明异同；也可以收拾行装，沿着水道亲自走上几日。"
 WJ_yinshi.2004.a:0 "抄录几种地志，注明异同。"
 WJ_yinshi.2004.b:0 "沿水道亲自踏勘几日。"

 WJ_yinshi.2005.t:0 "问疾"
 WJ_yinshi.2005.desc:0 "邻家孩子发热数日不退，家人请不起医者，便来问我书中有没有方子。我读过几卷医经，却从未替人诊过病。医书所言阴阳表里，落到一个发烫的孩子身上，竟不知从何处下手。\n\n我可以把医经中相关的篇章找出来，与他们一同斟酌，再劝他们去请医者；也可以亲自去看一看，照书中之法试着诊治。"
 WJ_yinshi.2005.a:0 "找出医经相关篇章，劝其请医者。"
 WJ_yinshi.2005.b:0 "亲自去诊视，照书中之法试治。"

 WJ_yinshi.2006.t:0 "樵径改道"
 WJ_yinshi.2006.desc:0 "惯走的山径被雨水冲坏了一段，松动的土沿下露出树根。熟路的人尚能绕过，挑担者却须多费许多工夫。有人提议另辟近道，也有人说，新路会穿过容易积水的低处。我沿着坡势走了一遭，发觉纸上看似省下的路程，到了脚下未必真能省力。\n\n顺着旧径察看排水与落脚处，先把险段的位置说明，可以保留众人熟悉的走法，但往后仍要随雨水查看。若把两条绕路各走一遍，记下晴雨时的差别，再供行人自择，眼前较为稳妥，却不能替所有人的担荷找到同一个答案。归途鞋履尽湿，我倒比来时更明白。"
 WJ_yinshi.2006.a:0 "细察旧径险处，写清雨后应当怎样绕行。"
 WJ_yinshi.2006.b:0 "分别踏看两条新路，勘出一条可走的道。"

 WJ_yinshi.2007.t:0 "谈玄"
 WJ_yinshi.2007.desc:0 "一位云游的道人借宿一晚，夜里与我对坐。他不谈符箓丹药，只问我读《老子》《庄子》读到了哪里。我说了几句平日的体会，他笑说那些都是书上的话。\n\n我可以只把他的话当作闲谈，继续按自己的路数读书；也可以放下成见，与他论一夜道，看看书外还有什么。"
 WJ_yinshi.2007.a:0 "照自己的路数读老庄，只当是闲谈。"
 WJ_yinshi.2007.b:0 "放下成见，与道人论一夜道。"
 WJ_yinshi.2007.c:0 "得失皆在其中，安然听之。"

 WJ_yinshi.2008.t:0 "自省"
 WJ_yinshi.2008.desc:0 "雨天不能出门，我翻看去年写下的几页日札。有些话如今读来幼稚，有些当时以为想通了的事，至今仍在反复。隐居原是为了读书，可读得越多，越觉得自己的脾性比书上任何一个难题都难解。\n\n可以照旧写几页日札，记下近来所思；也可以闭门几日，什么书都不读，只同自己好好谈一谈。"
 WJ_yinshi.2008.a:0 "照旧写几页日札，记下近来所思。"
 WJ_yinshi.2008.b:0 "闭门静思几日，什么书都不读。"
 WJ_yinshi.2008.c:0 "心平气和，看清自己便好。"

 # ---------------------------------------------------------------- 当地人
 WJ_yinshi.3001.t:0 "衡门前的乡争"
 WJ_yinshi.3001.desc:0 "两户乡人带着各家的长者来到门前，为共用水道的先后争执不下。一方持旧约，一方说田中禾苗已不能再等。众人不愿先诉于官，推说我读过书，又与两家都无私怨，盼我评个公道。\n\n我没有官印，不能替县中断案。但若一句『隐者不问俗事』便将人推开，所谓乡里清望，又究竟落在何处？"
 WJ_yinshi.3001.a:0 "请两家与乡老坐下，由乡老议定。"
 WJ_yinshi.3001.b:0 "查明旧约与实情，亲自断一个曲直。"
 WJ_yinshi.3001.c:0 "不偏不倚，照约秉公而论。"

 WJ_yinshi.3002.t:0 "蒙童叩门"
 WJ_yinshi.3002.desc:0 "几名乡中少年结伴到门前，带来的不是束脩，而是一叠练字的废纸。他们识得些常用字，读起短章却常把句读分错。领头的少年问，若白日还要帮家里劳作，是否就学不得经书。我望着他们指间的墨痕，想起自己初学时也曾被长篇章句吓住。\n\n照旧日师法，从一部经书逐字讲起，根基虽稳，未必有人能把漫长的课业坚持到底。若先取书信、契券中用得着的语句教他们，读书很快便能帮上家中，却也容易止于应付眼前事务。门外的脚步仍未散去，我该给他们怎样一个开头？"
 WJ_yinshi.3002.a:0 "先教读写日用文字，使他们今日便有所用。"
 WJ_yinshi.3002.b:0 "收他们为学生，从一部经书的句读教起。"

 WJ_yinshi.3003.t:0 "渡口让路"
 WJ_yinshi.3003.desc:0 "经过渡口时，几名行人正为先后次序争执。携物多的说不便久候，赶远路的说日暮难行，还有人早已等在岸边，却始终插不上话。没有谁愿意先认自己占了便宜，越辩越把小事说成了品行。我站在一旁，忽觉书中礼让二字到这里也须有个落脚处。\n\n按到岸早晚排次序，办法最明白，也能让不善言辞的人有所依凭；若先照顾眼前确有急难者，或更近乎体恤，却须把缘由讲清，免得人人都争称紧迫。水面上已有归鸟掠过，再拖延下去谁也难行。我可以劝他们守一条共同认可的次序，也可以先替沉默者说话。"
 WJ_yinshi.3003.a:0 "请众人依抵岸先后，各守一个明白次序。"
 WJ_yinshi.3003.b:0 "先问清急难，替不敢开口的人陈说。"

 WJ_yinshi.3004.t:0 "送终之议"
 WJ_yinshi.3004.desc:0 "乡中有人议论丧葬，说近来几家竞相厚备棺椁，连家境窘迫者也怕被指作不孝。另一种说法则引古人薄葬之言，主张一概从简。议论并非因我家有丧，却仍有人请我写几句话作参考。我翻过礼书，发现书上详列仪节，未替每一户人家量过生计。\n\n若直陈厚葬之弊，或可替困窘之家卸下一层重担，却容易被说成轻看亲情。若分别论明哀敬与器用，让各家依其所能行礼，言辞更周全，也可能被好奢者借来替旧习开脱。我不愿用别人的哀痛成就自己的议论，只能把每个字写得更慎重。"
 WJ_yinshi.3004.a:0 "逐项分说礼意与器用，留出因家制宜的余地。"
 WJ_yinshi.3004.b:0 "直言厚葬之弊，劝乡里一概从简。"

 WJ_yinshi.3005.t:0 "周急有序"
 WJ_yinshi.3005.desc:0 "连日道路泥泞，几户人家的柴粮一时接续不上。乡里并非无人愿意相助，只是各自听来的情形不同，有人反复受到照看，也有人不好意思开口，直到邻人偶然提起才被记住。来问主意的人坐在檐下，我听完才明白，眼前所缺的不全是慷慨。\n\n先把急需照应的情形逐户问清，再商定轮流探望，能够少些遗漏，却须格外谨慎，不使窘况成了众人的谈资。若只请熟悉各家的近邻私下相通，颜面较易保全，彼此掌握的消息又未必齐全。纸上可排出先后，人心却不能像数目一样轻易归拢。"
 WJ_yinshi.3005.a:0 "由近邻私下问候，让求助不必当众开口。"
 WJ_yinshi.3005.b:0 "召集乡人，共议一份周急次序。"
 WJ_yinshi.3005.c:0 "先拿出自家的存粮。"

 WJ_yinshi.3006.t:0 "篱边一尺"
 WJ_yinshi.3006.desc:0 "修整篱边杂草时，我发现一丛新竹生在两处旧界标之间。邻里说法不一：有人认树根为界，有人只记得多年前小径的位置。竹笋眼下还不值多少，争的却是往后该依什么作准。我本可闭门不问，但若只劝众人宽厚，今日含混之处来年还会重新长出来。\n\n同看旧标与地势，把能够确认的边界先记明，再把难定之处留待共议，可以少些日后的争执，却要容忍眼前仍有空缺。若先议定篱边共同行走与取用的办法，暂不争这一尺归谁，邻情或更容易保全，只是便利的约定也需要众人长久记得。"
 WJ_yinshi.3006.a:0 "先约定篱边如何共用，让往来不被小争隔断。"
 WJ_yinshi.3006.b:0 "同看旧标与地势，辨清界址。"

 WJ_yinshi.3007.t:0 "乡塾共读"
 WJ_yinshi.3007.desc:0 "乡中议起借一处空屋让少年共读，难处却不在有没有书。各家愿教的篇目不同，有人看重识字写札，有人坚持先读经书，还有人担心农忙时课业中断，反叫孩子落下怠学的名声。我听罢众人的说法，才知一间小小书屋，也承着许多不同的指望。\n\n先选人人用得上的短章，约定闲时聚读、忙时各自温习，较容易让这件事开始，却未必能使有余力者读得深入。若按程度分作几席，由先学者领着初学者复述，就能兼顾进退，只须防止课席高下变成孩子间的轻慢。书可以分卷，人却不该因起步早晚便被分出贵贱。"
 WJ_yinshi.3007.a:0 "先定共同短课，让各家都能从眼前做起。"
 WJ_yinshi.3007.b:0 "亲自主持乡塾，分席授读。"

 WJ_yinshi.3008.t:0 "社饮之间"
 WJ_yinshi.3008.desc:0 "乡社相聚，席间有人依旧例劝饮，说不尽杯便是疏远乡情。我并非厌恶与人同坐，只是看见几位不善饮者勉强应酬，笑意渐渐变得拘谨。若我此时起身辞席，旁人或会把养望之人想成不肯亲近乡里的冷客；若仍随众相劝，又与心中所见不合。\n\n留在席上谈些农时与旧闻，借着话头缓下劝饮，或能让众人不伤和气地换一种相聚法。若当面说明饮量各异，不应以杯数论亲疏，道理更为清楚，也免不了使守旧例者一时难堪。杯中酒还未凉，我愿意与人相近，却不愿把勉强也叫作礼数。"
 WJ_yinshi.3008.a:0 "明言亲疏不在杯数，请各人量力而饮。"
 WJ_yinshi.3008.b:0 "留在席上谈乡事，让席间不再围着酒杯转。"
 WJ_yinshi.3008.c:0 "举杯与众同乐，一席尽欢。"

 # ---------------------------------------------------------------- 朋友
 WJ_yinshi.4001.t:0 "暮雨到书札"
 WJ_yinshi.4001.desc:0 "暮雨中，行人带来[wj_yinshi_friend.GetName]的一封书札。前半叙别后近况，后半谈到进退之难：顺众意未必心安，独持己见又恐失却相知。写到末尾，只问我山中近来读些什么。\n\n我把信读了两遍。故交并非缺少一番大道理，不过想知道，旧日同席论学的人是否还肯认真听。回书该论世事，还是先劝其保重自身？"
 WJ_yinshi.4001.a:0 "先叙故情，劝其保重自身。"
 WJ_yinshi.4001.b:0 "详论所问，知己之间不必避讳。"

 WJ_yinshi.4002.t:0 "柴门留札"
 WJ_yinshi.4002.desc:0 "循着旧日记得的小径访友，我到时却只见柴门虚掩，院中晾着新洗的布，炉灰早已冷了。隔篱问讯，也只得一句外出未归。来前积了许多想说的话，从一处经义到路上所见，此刻都悬在心里。山色渐暗，等候似乎也成了这趟行程的一部分。\n\n我可以在门旁留下短札，把最要紧的疑问写清，改日不必再让友人猜测我的来意；也可以先收住议论，只留一句问安，待彼此都有闲暇时再面对面细谈。纸上容得下长篇道理，却未必容得下交谈中那些迟疑、停顿与会心的一笑。"
 WJ_yinshi.4002.a:0 "只留问安短句，把长谈留给下一次相见。"
 WJ_yinshi.4002.b:0 "留札列出疑问，在附近住下等[wj_yinshi_friend.GetFirstName]归来。"

 WJ_yinshi.4003.t:0 "故人所托"
 WJ_yinshi.4003.desc:0 "一封辗转送来的书札请我替一篇文章作序。写信的人有旧交之谊，文中又多称许我的清望，读来很难不动情。可是细看所附篇章，几处论断失之偏颇，还把传闻写得过于确实。我知道，一旦在卷首署名，旁人未必分得清我赞的是情谊还是见解。\n\n婉辞作序而详写修改意见，可以守住自己的判断，却可能让对方觉得我以学问自高。若仍为其作序，只说文章的可取之处，并把保留意见交代清楚，旧情或可顾全，但读者也可能略过那些限制。山中得以从容下笔，不等于每一笔都能两全。"
 WJ_yinshi.4003.a:0 "为可取之处作序，同时明言尚待商榷。"
 WJ_yinshi.4003.b:0 "不作序，另写一封认真商榷的回信。"
 WJ_yinshi.4003.c:0 "直言其失，故人之间不说违心话。"

 WJ_yinshi.4004.t:0 "借书的期限"
 WJ_yinshi.4004.desc:0 "借出的书过了约期仍未送回，我案上正在写的札记因而缺了两处引文。想起对方来借时那份郑重，我不愿轻易疑人；但山路辗转，口信稍有差池，书卷就可能被忘在别处。若人人都只凭一时好意借取，藏书再丰也难供长久往还。\n\n写信催还并说明急用之处，既守约定，也让对方知道迟延确有不便，只怕语气稍重便损了相借的情分。若暂借另一抄本继续校读，再与对方另约归期，眼前较为宽缓，却也不能让期限从此成了空话。我取出旧借札，把责人的句子改了又改。"
 WJ_yinshi.4004.a:0 "另寻抄本续读，重新约定一个能践行的归期。"
 WJ_yinshi.4004.b:0 "说明急用，按原约请[wj_yinshi_friend.GetFirstName]尽快归还。"

 WJ_yinshi.4005.t:0 "清名与旧识"
 WJ_yinshi.4005.desc:0 "有人劝我少与一位旧识往来，说此人近来依附权门，名声已不如从前。我所知道的却只是早年相处的几件小事，既不能替如今的行止作保，也不愿把乡谈当作亲见。闭门之后，世事总隔着几层传闻抵达，偏偏关于节义的判断又最催人表态。\n\n若先致书询问，坦言所闻与疑惑，至少给旧交一个自陈的机会，却可能被外人看作曲为回护。若暂缓往来而不随众品评，可以守住自己的分寸，也可能在对方最需要直言时失了朋友之责。我把未写完的称谓停在纸头，觉得真正难守的是不轻率。"
 WJ_yinshi.4005.a:0 "暂缓往还，也不把未明之事传给第三人。"
 WJ_yinshi.4005.b:0 "致书直问，以旧交之分求一个明白答复。"

 WJ_yinshi.4006.t:0 "断弦会友"
 WJ_yinshi.4006.desc:0 "[wj_yinshi_friend.GetName]来访时，我正好把久置的琴从布囊中取出，才试数声，一根旧弦便松断了。[wj_yinshi_friend.GetFirstName]笑说来得不巧，又说自己也许久不曾抚琴。窗外有风，断音散得很快，指下却还留着方才未成的曲意。\n\n两人可以一同理弦，把旧曲一段一段寻回来；也可以就着断弦后的余音，即席合一支新曲，成与不成都由它。"
 WJ_yinshi.4006.a:0 "一同理弦，把旧曲慢慢寻回。"
 WJ_yinshi.4006.b:0 "就着余音即席合一支新曲。"

 WJ_yinshi.4007.t:0 "竹林清谈"
 WJ_yinshi.4007.desc:0 "几位朋友约在竹林边小坐，[wj_yinshi_friend.GetName]也在其中。话题从一句经义谈到时局，又从时局谈回人性善恶，越谈越远。有人辞锋犀利，有人只是含笑不语。轮到我时，众人都静了下来。\n\n我可以只听不说，让这一席谈尽兴而散；也可以接过话头，把自己近来的心得和盘托出。"
 WJ_yinshi.4007.a:0 "静听众人所论，偶尔插一两句。"
 WJ_yinshi.4007.b:0 "接过话头，主持这一席清谈。"

 WJ_yinshi.4008.t:0 "雪夜访友"
 WJ_yinshi.4008.desc:0 "夜里落了一场大雪，推窗只见四野皆白。我忽然很想见一见[wj_yinshi_friend.GetName]，想同其围炉说话。可是雪深路远，此时动身，到时恐怕已经天明，对方未必在家，也未必方便。\n\n可以先写一封信，约个雪停后的日子；也可以乘兴而往，到了门前再说。"
 WJ_yinshi.4008.a:0 "写一封信，约个雪停后的日子。"
 WJ_yinshi.4008.b:0 "乘兴而往，到了门前再说。"

 # ---------------------------------------------------------------- 邀请
 WJ_yinshi.5001.t:0 "辟书叩衡门"
 WJ_yinshi.5001.desc:0 "庭中尚带宿雨，门外忽有车马停下。来使拂去衣上尘土，奉上[actor.GetName]的辟书：府中留有实缺，愿请我出山共议事务。书中没有铺陈官禄，只说天下未宁，读书之人亦当有所担当。\n\n我将书置于案头，久久未答。闭门可以守住一己志趣，却不能使世事也停在门外；应召或可稍展所学，也须从此面对府主的知遇与责任。使者仍在阶下候着，等我写下回书。"
 WJ_yinshi.5001.a:0 "收拾书卷，随使者赴府。"
 WJ_yinshi.5001.b:0 "谨谢知遇，此身尚不能出。"

 WJ_yinshi.5002.t:0 "乡论入郡府"
 WJ_yinshi.5002.desc:0 "来访的乡老说，我虽少赴宴集，名字却已在乡里议论中传开。有人称许操守，也有人说，世家子弟受乡党扶持，终须为乡党做些事情。如今[actor.GetName]愿据此举我为孝廉，荐于[actor.GetTopLiege.GetPrimaryTitle.GetNameNoTier]。\n\n举状送到了面前，末尾尚待我的答复。受荐并不等于立刻束带赴官，但这份乡评一旦归于我名下，往后言行便不再只是自家之事。"
 WJ_yinshi.5002.a:0 "受此乡举，就此出山。"
 WJ_yinshi.5002.b:0 "德行未充，请另举乡中贤者。"

 WJ_yinshi.5003.t:0 "山中亦有经世学"
 WJ_yinshi.5003.desc:0 "[actor.GetName]的来书压在一卷旧注之上。信中提及我近来的议论，说山林中不乏识时务之人，愿以茂才荐我。纸上几句称许，偏偏都是我以为无人留意的见解。\n\n我本不愿以文章干进，却也未曾认定所学只能留在书斋。受下荐举，是承认这番学问仍可见用于世；至于何时出仕、为谁效力，仍当慎重自择。"
 WJ_yinshi.5003.a:0 "受此荐举，就此出山。"
 WJ_yinshi.5003.b:0 "名实未副，不敢以虚誉居先。"

 WJ_yinshi.5101.t:0 "官诰到门"
 WJ_yinshi.5101.desc:0 "使者带来的文书写得明白：上头授我官职，即日赴任。乡人闻讯都来道贺，说隐者终究还是要出来做事的。我看着案上未读完的书，一时不知该先放下哪一件。\n\n受下这份官职，便是出山，往后的日子不再只属于自己；若辞而不受，就把文书原封送还上级，继续过我的山居日子。"
 WJ_yinshi.5101.a:0 "受官出山。"
 WJ_yinshi.5101.b:0 "辞而不受，将官职交还上级。"
