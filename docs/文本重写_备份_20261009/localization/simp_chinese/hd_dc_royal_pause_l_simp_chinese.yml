l_simp_chinese:
 hd_dc_support.0008.d: "先还我这份人情，停下一年的动员。"
 hd_dc_support.0008.d.tt: "消耗你对候选人实际可用的人情，危机冲突值−15；该宣称者派系暂停本系统新招募、最后通牒与新开战命令一年。成员和不满保留，已经发生的战争不受影响。候选人对你好感−10，受保护君主对你好感+10。到期重新核验被延后的命令，不保证发动战争。"
 hd_dc_support.0308.t: "暂且收起兵谏书"
 hd_dc_support.0308.desc: "来往的书信旁添了一道新的期限：一年。先前欠下的人情已经用在这次要求上，动员的文书暂且压住。\n\n派系中的人没有因此散去，他们的不满也仍在。期限结束后，尚有依据的命令才会重新核验；眼下没有一场已经发生的战争被这封信改写。"
 hd_dc_support.0308.a: "把期限记清楚。"
 hd_dc_support.paused_demand: "动员已有暂缓之约，先将这份要求封存。"
