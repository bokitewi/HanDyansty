 # REV-01 184.6 交趾柱天将军
 hd_historical_revolts.0001.t:0 "柱天将军"
 hd_historical_revolts.0001.desc:0 "交趾的急报送到，龙编屯兵已经举事，[hd_revolt_leader.GetName]被推为渠帅，自号柱天将军。来报者先将沿途可通行的道路说了一遍，竟比叛军的兵数还难说清。\n\n我看着图上相隔甚远的郡县。岭外山川阻隔，一处屯营生乱，邻近县邑未必立刻知道；待消息送到我这里，又有多少人已随叛旗改换了去向？\n\n堂下问该将这一封急报转交何处。我将它留在案前。战事既已牵到我的治下，便不能只把柱天将军当成一个荒唐名号，说笑之后便放过去。"
 # REV-02 184.10 北宫伯玉
 hd_historical_revolts.0002.t:0 "湟中羌胡反"
 hd_historical_revolts.0002.desc:0 "金城方向的军报带来了湟中、河关起兵的消息。[hd_revolt_leader.GetName]聚合诸部，凉州的道路与关隘已不再像旧图上那样安稳。\n\n报信者说到骑兵踪迹，伸手在图上连划几处。我按住图角，让他分清亲眼所见与沿途传闻。边地每夸大一队骑卒，后方就可能空撤一处守军；可若只因消息纷乱便迟疑不办，真正到来的敌兵也不会等候。\n\n从凉州通向三辅的道路，此刻忽然都变得狭窄。我重新点过需要查报的地方，这场战事已到了不能避开的眼前。"
 # REV-03 185.2 黑山军
 hd_historical_revolts.0003.t:0 "黑山军起"
 hd_historical_revolts.0003.desc:0 "太行山中的部众不再只是分散劫道，已经推起共同旗号。[hd_revolt_leader.GetName]聚众起兵，关于黑山军的报讯从不同县署接连送来。\n\n我让书吏将山口与受扰的地方标在一起，才看见这些看似零散的消息，沿着山谷一处处接了起来。平地上的军队容易查报，入了山，几条岔路便足以让踪迹重新散去。\n\n有人仍习惯称他们是小股群盗，我指了指案上越来越厚的急报。名字可以仍写得轻慢，防备却不能照旧。如今与我交战的，是已经能够合起兵势的人。"
 # REV-04 185.4 江夏蛮（设计性日期后移：史载主要叛乱约180年）
 hd_historical_revolts.0004.t:0 "江夏蛮叛"
 hd_historical_revolts.0004.desc:0 "江夏来报，竟陵附近诸部已经聚众出山，[hd_revolt_leader.GetName]所领人众开始侵扰县邑。急信之外，另有商旅递来改道的消息，水陆行程都比平日迟了。\n\n我询问军吏，哪里能够追击，哪里只宜扼守。他说起林莽与水泽，一处处都不是舆图上画出界线便能看守的地方。对手进退熟悉道路，我们若处处跟随，反可能把军众拖散。\n\n案前两份报讯指向同一片地方，字里却各有轻重。我将它们并置，先认清这个已经向我举兵的敌人。"
 # REV-05 187.4 王国
 hd_historical_revolts.0005.t:0 "王国举兵"
 hd_historical_revolts.0005.desc:0 "汉阳方面传来消息，[hd_revolt_leader.GetName]已经举兵，兵势向陈仓方向伸来。帐中原在议论别处军务的人，听到这个地名，都停了一停。\n\n我将关中西面的图籍取来，沿道路看向凉州。前一处战场究竟平定与否，不能替眼前这一股力量作数；陈仓若受威胁，粮运与关隘便都须重新查报。\n\n来人问，是否仍依旧有部署传令。我没有凭过去的报捷作答，而是让他先将这次敌军的动静说清。关门是否守得住，要靠今日在那里的兵，不能靠昨日留在文书里的声名。"
 # REV-06 187.6 张纯、张举
 hd_historical_revolts.0006.t:0 "张举称天子"
 hd_historical_revolts.0006.desc:0 "肥如方向的急报送来，张举、张纯已经与乌桓势力联结，举兵作乱。报中一面列着天子与将军的新号，一面催问边郡应如何应敌。\n\n我将那些夸张的称号读过，目光停在后面的道路与城邑上。称帝的话可以一日传遍，真正使州郡不安的，却是随旗而来的骑兵，以及原本各自观望的人是否就此响应。\n\n门外又有人求见，带来的仍是北方消息。我让书吏别只抄录檄文，务必将各处军情分开。对方已经以兵戈向我作答，我也不能只在名号上与他们争论。"
 # REV-07 188.3 休屠各胡
 hd_historical_revolts.0007.t:0 "休屠各胡反"
 hd_historical_revolts.0007.desc:0 "美稷一带的动乱终于演成战事。休屠各诸部随[hd_revolt_leader.GetName]举兵，并州方面的急报夹在一起，旧日关于道路平靖的回书已不再可信。\n\n我听人逐项说明诸部去向，才发觉不能只凭旧有归属判断谁还肯听令。有的部众仍守原处，有的已经随新的号令行动，县署与军中送来的名字也未必一致。\n\n我把含混的几处圈出，叫来人重新查明。此刻最要紧的，是知道哪条道路仍可行、哪一处真有守军，而不是拿多年前的安置簿，替今日的边地作证。"
 # REV-08 188.6 马相
 hd_historical_revolts.0008.t:0 "益州黄巾"
 hd_historical_revolts.0008.desc:0 "绵竹方面的急报先说黄巾聚起，后来的文书却已经提到称帝。[hd_revolt_leader.GetName]的旗号在蜀地展开，县邑与道路的消息也愈来愈急。\n\n我将先后两报对在一起，中间相隔的时日不算长，情形却已变了许多。山川能阻外兵，也能使州内的告急来得更迟；等到一处真正失守，邻近地方未必还有从容准备的余地。\n\n有人劝我先辨这是否只是旧日黄巾余众换了名字。我让他先查兵众去向。无论他们借哪一面旗起事，眼下已经是向我举兵的敌人。"
 # REV-09 196.1 严白虎
 hd_historical_revolts.0009.t:0 "严白虎屯聚"
 hd_historical_revolts.0009.desc:0 "吴郡诸处的来报都提到了[hd_revolt_leader.GetName]。原先分据坞壁的人众正在聚起，水陆要冲出现新的旗帜，过路商旅也开始探问该向谁交涉。\n\n我看过各县回信，发现他们写得最含混的，恰是那些离城较远的地方。守住县门是一回事，使山水之间的道路仍听同一道号令，又是另一回事。\n\n堂下有人仍把此事称作乡间屯聚，我让他看看已经送到的战讯。江东的归属不能只写在县署匾额上，真正能够控制往来、聚起兵众的人，已经在与我相争。"

 hd_historical_revolts.0010.t:0 "胁迫加入"
 hd_historical_revolts.0010.desc:0 "[hd_beigong_victor.GetName]的使者走进来，先将军中号令宣读一遍，随后才说到我的去处。他要我归附，往后以其为领主，已经不准备再听一番漫长的推辞。\n\n我低头看着手边的印信。名位尚在，能够凭它驱使的人，却已不足以将这道命令挡在境外。帐下无人接话，连来回传递文书的脚步也轻了许多。\n\n这不是以厚礼相请的盟约。我可以不愿，却不能凭这份不愿改变已经到来的兵势。如今要做的，是把归附之事说清，保住还能继续经营的地方。"
 hd_historical_revolts.0010.a:0 "领受号令，归其节制。"

 hd_historical_revolts.a:0 "战事已起，记清各路军情。"
