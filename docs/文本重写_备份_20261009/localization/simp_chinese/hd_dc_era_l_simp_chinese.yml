l_simp_chinese:
 hd_dc_era.0001.t: "诏令未至之地"
 hd_dc_era.0001.desc: "案上的舆图已许久没有换过，各地送来的文书却渐渐改了称谓。有的仍奉朝廷正朔，有的只谈本境军粮，还有几处迟迟不见回音。\n\n这些界线并非今日才出现。经年的离散，终于成了无人能够回避的局面。新的盟约、征伐与建国之议，将从这些已经改变的关系中生长出来。"
 hd_dc_era.0001.a: "先看清天下，再定自己的去路。"
 hd_dc_era_rules_tt: "局势紧张时天子所控法理伯爵领不足两成，或崩溃期霸权头衔无主、天子所控法理伯爵领不足四成、天子君权未达最高一级，天下立即进入群雄割据。朝贡与军事占领不计入控制率。乱世只能由「终结乱世」决议结束，须控制天下八成法理伯爵领。"
 hd_dc_era_no_sovereignty_change_tt: "乱世之中，县级以上封臣可向主君「要求独立」：允则和平自立并停战五年；不允亦自立，但原主君十年内可以「讨逆」征讨。进入群雄割据本身不改变任何头衔与朝贡关系。"
 hd_dc_mandate_observation_tt: "政权交接照常执行；同一人在本次群雄割据期间只领取一次宣告天命的奖励，日后重新取得霸权不受此限制。群雄割据的结束恢复原版天命进程判定。"
 hd_dc_mandate_once_per_era_tt: "你尚未领取本次天命奖励，或当前尚未持有中华霸权"
