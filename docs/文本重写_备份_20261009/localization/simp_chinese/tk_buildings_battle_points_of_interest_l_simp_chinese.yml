l_simp_chinese:

 #####三国新增建筑战场本地化

 BattlePoIHistoricalNameZhuoLu: "涿鹿之战"
 BattlePoIHistoricalDescZhuoLu: "#emp 胜者：黄帝部落\n败者：蚩尤部落\n日期：公元前4700年#!\n#weak 黄帝应炎帝之邀讨伐西进攻击炎帝的蚩尤部落，双方战于涿鹿之野。\n\n黄帝部落的军队起初因实力装备皆不及蚩尤部落处于劣势，但由于黄帝皆知人善用，善假势力，最终击败蚩尤部落。\n\n这场战役后使炎黄为代表的华夏部族开始融合东夷部族向文明时代演进。#!"
 BattlePoIHistoricalNameMingTiao: "鸣条之战"
 BattlePoIHistoricalDescMingTiao: "#emp 胜者：商汤\n败者：夏桀\n日期：公元前1600年#!\n#weak 商汤率领商部落士兵与夏军在鸣条进行的一场决战。\n\n夏朝末年，夏王桀不修内政，骄奢淫逸，致使民心尽失。而商汤在伊尹等的辅佐下积极进取，争取诸侯，剪除夏朝羽翼，最终开始灭夏之战，双方战于鸣条，结果夏朝军队大败。\n\n这场战役导致夏朝灭亡，商汤建立了商朝。#!"
 BattlePoIHistoricalNameChangShao: "长勺之战"
 BattlePoIHistoricalDescChangShao: "#emp 胜者：鲁庄公\n败者：齐桓公\n日期：公元前684年#!\n#weak 齐桓公为报鲁国争夺王位纠纷之仇攻打鲁国，双方战于长勺。\n\n公元前684初，齐国军队进攻鲁国。鲁庄公在鲁人曹刿的建议下暂避齐军锋芒，撤退到有利于反攻的地方长勺，由于干时战争的胜利，齐军轻视鲁军，最终失败。\n\n这场战役以弱胜强，视为防守反击战的典范。#!"
 BattlePoIHistoricalNameChangPing: "长平之战"
 BattlePoIHistoricalDescChangPing: "#emp 胜者：秦昭襄王\n败者：赵孝成王\n日期：公元前260年#!\n#weak 秦国率军在赵国的长平一带同赵国军队发生战争。\n\n公元前260年，秦、赵两国因争夺上党爆发战争。初赵国见势不利，采用廉颇的固守策略，但赵王受秦反间，迫使赵括求胜心切最终惨败。\n\n此战之后，赵国元气大伤，加速了中国统一进程。#!"
 BattlePoIHistoricalNameGaiXia: "垓下之战"
 BattlePoIHistoricalDescGaiXia: "#emp 胜者：刘邦\n败者：项羽\n日期：公元前203年#!\n#weak 楚汉两军在垓下进行的一场战略决战。\n\n公元前203年，处于不利的项羽签署鸿沟和议后，向楚地回撤。张良、陈平见楚军疲乏，遂建议刘邦乘机背袭，刘邦采纳向楚军发起战略追击作战，最终项羽兵败生死。\n\n此战之后，结束了秦末混战的局面，统一了中国，奠定了汉王朝四百年基业。#!"
 BattlePoIHistoricalNameKunYang: "昆阳之战"
 BattlePoIHistoricalDescKunYang: "#emp 胜者：玄汉\n败者：新朝\n日期：公元23年#!\n#weak 新汉两军在昆阳一线的交战。\n\n公元23年，新军因绿林军新立玄汉未稳，回调主力军进攻汉军，双方战于昆阳。汉军统帅怯战欲降，奈何新军不允，遂采纳刘秀建议与决策固守待援。后李轶、刘秀等率援军击败新朝大军，新军仅千余逃回长安\n\n昆阳大捷后，天下震动，加速了新朝灭亡，也为刘秀建立东汉开辟了道路。#!"


