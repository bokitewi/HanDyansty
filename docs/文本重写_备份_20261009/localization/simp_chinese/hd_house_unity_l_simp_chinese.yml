 hd_unity_bloc_joined.desc: "家族集团结盟"
 hd_unity_bloc_left.desc: "退出家族集团"
 hd_unity_bloc_kicked.desc: "被逐出家族集团"
 hd_unity_bloc_leadership_lost.desc: "集团盟主之位被夺"
 hd_unity_bloc_relation.desc: "家族集团内关系改善"
 hd_unity_aspiration_drift_up.desc: "家族志向凝聚人心"
 hd_unity_aspiration_drift_down.desc: "家族志向导致人心浮动"
 hd_unity_aspiration_cap.desc: "家族志向限制了团结的上限"
 hd_unity_discord_mediated.desc: "家主出面调停族内纷争"
 hd_unity_discord_favouritism.desc: "家主偏袒一方"
 hd_unity_discord_ignored.desc: "族内纷争无人过问"
 hd_unity_split_relief.desc: "离心者分门立户，家族得以喘息"
 hd_unity_goodwill_opinion: "厚礼致意"
 hd_unity_suspicion_opinion: "树大招风，心存猜忌"
 hd_unity_forced_stay_opinion: "被强行挽留"
 hd_unity.0001.t: "族内倾轧"
 hd_unity.0001.desc: "族中人心不齐，各房为了职司、田产与荫补争执不休，[hd_unity_branch.GetShortUIName]一房尤甚，私下串联、互相攻讦之声已传到我耳中。若再不处置，只怕家丑要外扬了。"
 hd_unity.0001.a: "召集宗亲，居中调停"
 hd_unity.0001.b: "偏袒[hd_unity_branch.GetShortUIName]一房"
 hd_unity.0001.c: "家务小事，不予理会"
 hd_unity.0002.t: "树大招风"
 hd_unity.0002.desc: "我家上下同心，宗族兴旺，子弟遍布朝堂州郡。然而盛极必衰，[hd_unity_liege.GetShortUIName]近来对我家多有疑忌，朝中已有人暗示“外戚宗室，不可不防”。"
 hd_unity.0002.a: "约束子弟，主动自抑"
 hd_unity.0002.b: "献上厚礼，以示忠心"
 hd_unity.0002.c: "清者自清，不必理会"
 hd_unity.0003.t: "分门立户"
 hd_unity.0003.desc: "族内离心已久，[hd_unity_branch.GetShortUIName]一房屡次提出要别立门户、自开宗支。若强行拦阻，恐怕伤了情分；若放任不管，家族又将进一步衰微。"
 hd_unity.0003.a: "允其分门，另立宗支"
 hd_unity.0003.b: "以家法强行挽留"
 hd_unity.0003.c: "无可奈何，听之任之"
