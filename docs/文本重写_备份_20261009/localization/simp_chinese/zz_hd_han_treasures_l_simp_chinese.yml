l_simp_chinese:
 han_artifact_sunzi_bingfa_name:0 "《孙子兵法》善本"
 han_artifact_sunzi_bingfa_description:0 "孙武所传兵法圣典，十三篇言简意深，自春秋以来为将者必读。这部善本简册齐整，丝绳编联，历经数百年战火而字迹如新，藏于汉廷秘阁，价值连城。"
 han_artifact_liutao_name:0 "《六韬》秘本"
 han_artifact_liutao_description:0 "托名姜太公所著的兵法秘籍，以文、武、龙、虎、豹、犬六韬论治国用兵之道。汉廷藏书与兵家名士世代传抄，视之为太公遗法，临阵决机，皆可师法。"
 han_artifact_sanlue_name:0 "《三略》秘本"
 han_artifact_sanlue_description:0 "托名黄石公所传的兵书，杂采儒道法兵诸家之言，专论将略与治国之要。传说黄石公于圯上授书张良，其说虽不可尽考，而其法确乎可用。"
 han_artifact_simafa_name:0 "《司马法》古本"
 han_artifact_simafa_description:0 "司马穰苴所传古兵法，虽亡佚过半，犹存三代军礼古义。太尉府藏本简册齐整，将军们从中学得以仁为本、以义治之的古军礼，整军经武，威行天下。"
 han_artifact_wuzi_name:0 "《吴子》古本"
 han_artifact_wuzi_description:0 "吴起与魏文侯论兵的记录，内修文德，外治武备。这部古本藏于府库之中，是选将练兵、严明军法的范本，百战名将多自此出。"
 han_artifact_sunbin_bingfa_name:0 "《孙膑兵法》残卷"
 han_artifact_sunbin_bingfa_description:0 "孙膑遗著，久已散佚，这部残卷自古墓旧藏中重见天日。断简残编之间，围魏救赵、减灶诱敌的奇谋依稀可辨。可惜编绳朽坏，纸墨日损，若不加以整理修复，恐将化为尘土。"
 han_artifact_weiliaozi_name:0 "《尉缭子》校本"
 han_artifact_weiliaozi_description:0 "尉缭子论兵刑政令之书，汉代校书者以朱笔勘定文字，官修简册之上校记俨然。治军严整者读之，可知令行禁止、明法审令之道，军政之要尽在其中。"
 han_artifact_mengde_xinshu_name:0 "《孟德新书》"
 han_artifact_mengde_xinshu_description:0 "曹操撰述的兵法新书，集合数十年用兵心得，简册之上时有朱批。据传张松阅过之后轻蔑一笑，曹操遂焚其书——传闻真假难辨，而书中韬略，字字皆是实战所得。"
 han_artifact_bingfa_24_name:0 "《兵法二十四篇》"
 han_artifact_bingfa_24_description:0 "诸葛亮晚年所著兵法，共二十四篇，尽平生所学。临终遗命授于姜维，蜀汉将士由此得窥丞相用兵之精义。木牛流马、八阵图法，皆散见篇中。"
 han_artifact_qingnang_shu_name:0 "《青囊书》"
 han_artifact_qingnang_shu_description:0 "华佗毕生医术精华尽录于此书，外科剖腹、麻沸散之法俱在卷中。华佗临刑之际欲焚其书，幸有残卷辗转流传。得之者如得神医亲授，可活人不救之人。"
 han_artifact_shanghan_zabing_lun_name:0 "《伤寒杂病论》"
 han_artifact_shanghan_zabing_lun_description:0 "张仲景痛宗族数百人死于大疫，乃勤求古训、博采众方而成此书。理法谨严，方证俱备，辨六经而析病机，后世尊之为方书之祖。医家得此一卷，胜得千金。"
 han_artifact_taiping_qingling_dao_name:0 "《太平清领道》"
 han_artifact_taiping_qingling_dao_description:0 "于吉所传道书，以符水治病，教人叩头思过。江东百姓信之如神，官府则斥其惑众。是医书还是禁书，全看此书落在何人手中。"
 han_artifact_dunjia_tianshu_name:0 "《遁甲天书》"
 han_artifact_dunjia_tianshu_description:0 "方士秘传的奇书，载遁甲术数、推步占验之法。磨损的帛卷古旧朴拙，山中隐者偶得授书，习之可窥天机一角，也可能招来杀身之祸。真伪难辨，祸福难料。"
 han_artifact_taiping_yaoshu_name:0 "《太平要术》"
 han_artifact_taiping_yaoshu_description:0 "传南华老仙授于张角的三卷天书，能呼风唤雨，以符水治病。张角借此号令天下：苍天已死，黄天当立。黄巾若败，此书或被官军缴获，或由信徒藏于深山。"
 han_artifact_shanhaijing_name:0 "《山海经》异本"
 han_artifact_shanhaijing_description:0 "记山川草木、异兽神祇的古老博物之书。这部异本与秘阁藏本互有异同，校勘者可据以考订地理，谈助者可据以畅叙奇闻，太史官与方士皆视若珍宝。"
 han_artifact_xishu_map_name:0 "西蜀地形图"
 han_artifact_xishu_map_description:0 "益州官府绘制的蜀道山川险易之图，帛上朱墨标注阡陌关隘。得之者入蜀如履平地，失之者虽有雄兵也难越剑阁。帛图日久，墨迹渐淡，宜早用之。"
 han_artifact_imperial_seal_name:0 "传国玉玺"
 han_artifact_imperial_seal_description:0 "秦始皇以和氏璧琢成的传国玉玺，上镌受命于天，既寿永昌八字。秦亡汉兴，玺归汉室，历代帝王奉若神明。谁执此玺，谁便是天命所归；玺失其所，则天下共逐之。"
 han_artifact_wang_mang_head_name:0 "王莽头"
 han_artifact_wang_mang_head_description:0 "篡汉者王莽的首级。据后世史书记载，更始帝于公元23年将其枭首漆藏，此后与孔子屐、汉高祖斩蛇剑同列皇家武库累代异宝，直至晋代武库大火方才焚毁。汉廷将此物陈列武库，以儆效尤：篡逆者的下场，尽在此一颗枯颅之上。"
 han_artifact_confucius_shoes_name:0 "孔子屐"
 han_artifact_confucius_shoes_description:0 "相传为孔子所着的木履，圣人遗迹，儒生见之肃然。东汉已有尊孔护持剑履遗物之说；据后世记载，此履最终征入皇家武库，与王莽头等同为累代异宝。184年归于汉廷收藏，系由后世武库旧藏向前推定。"
 han_artifact_zhou_ding_name:0 "周鼎"
 han_artifact_zhou_ding_description:0 "周室宗庙重器，饕餮蟠螭纹间隐见铭文，虽历数百年而威仪不改。鼎在德不在鼎——自古问鼎之轻重者，皆是不臣之辈。得此鼎者，宗庙生辉，宗族与有荣焉。"
 han_artifact_heshi_bi_name:0 "和氏璧"
 han_artifact_heshi_bi_description:0 "卞和所献荆山之玉，完璧归赵传奇的主角。秦王愿以十五城相易而终不可得，璞玉浑然，温润有光。世人皆言传国玉玺即以此璧琢成，真伪难考，而天下至宝之名，千年不移。"
 han_artifact_four_spirits_mirror_name:0 "四灵文镜"
 han_artifact_four_spirits_mirror_description:0 "镜背铸青龙、白虎、朱雀、玄武四灵之象，铭带环绕，青铜莹然。汉人持此镜者，谓可照见精怪、辟除不祥；婚嫁之家，更以此为重礼。铜镜日久生绿锈，宜常加磨拭。"
 han_artifact_seismograph_name:0 "地动仪"
 han_artifact_seismograph_description:0 "张衡于公元132年铸成的候风地动仪，圆腹铜器，八龙衔珠，蟾蜍承之，地动则龙口吐珠报其所向。朝臣初皆不信其能，直至陇西地震驿传至京，皆叹服其妙。"
 han_artifact_zhinan_che_name:0 "指南车"
 han_artifact_zhinan_che_description:0 "车上木人指南，无论车行何向、山回路转，其手常指南方。相传黄帝作之以破蚩尤迷雾，汉代名匠屡欲仿制，成者寥寥。机括精微，最忌风雨侵蚀。"
 han_artifact_white_feather_fan_name:0 "白羽扇"
 han_artifact_white_feather_fan_description:0 "素白羽片、竹木扇柄的羽扇，形制古朴。诸葛孔明披鹤氅、挥白羽，于帷幄之中运筹，决胜于千里之外。羽扇轻摇，谈笑间强敌灰飞烟灭。"
 han_artifact_shenshou_inkstone_name:0 "神兽砚"
 han_artifact_shenshou_inkstone_description:0 "兽形石砚，雕刻古拙，墨池深广，研面细腻。尚书台官员与文士以此砚起草诏令、校勘典籍，视为文房珍品，名士之间转相赠答。"
 han_artifact_bianzhong_name:0 "编钟"
 han_artifact_bianzhong_description:0 "木架悬列的成套青铜编钟，大小相次，宫商角徵羽依律而铸。宗庙祭祀、宫廷宴乐皆不可缺，钟声一响，礼乐自兴。战乱之中易被拆散，成套者尤为难得。"
 han_artifact_tongque_name:0 "铜雀"
 han_artifact_tongque_description:0 "铸于邺城铜雀台的铜雀陈设，青铜雀鸟昂首欲飞，锈色斑驳而气象雄浑。曹操筑台于漳水之上，以彰天下归心之志。铜雀春深锁二乔——诗人千年之后犹在吟咏。"
 han_artifact_bronze_chariot_name:0 "铜马车"
 han_artifact_bronze_chariot_description:0 "依照汉家车马制度铸造的缩尺铜车马，舆服轮辕莫不合度，公卿列侯陈之于府第，以彰显朝廷仪制之尊。也有能工巧匠以之赠遗权贵，或出自大墓陪葬。"
 han_artifact_boshanlu_name:0 "错金博山炉"
 han_artifact_boshanlu_description:0 "炉盖铸成海上仙山之形，错金为纹，山峦叠嶂，烟孔隐布其间。焚香时青烟自山间升起，如云雾缭绕峰峦，满室若有仙气。宴饮雅集，此炉为上品。"
 han_artifact_changxin_lamp_name:0 "长信宫灯"
 han_artifact_changxin_lamp_description:0 "西汉宫廷旧藏的鎏金铜灯，宫女跪坐执灯，灯烟入袖而不散于室，设计之巧令人绝倒。旧宫尘封多年，拭去浮尘，犹见当年宫闱气象。"
 han_artifact_crane_feather_fan_name:0 "鹤羽扇"
 han_artifact_crane_feather_fan_description:0 "以灰白鹤羽制成的长柄羽扇，较白羽扇更为凝练沉稳，非军师宿将不能持。运筹之际徐徐挥之，指挥三军如臂使指。得此扇者，当为一代军师。"
