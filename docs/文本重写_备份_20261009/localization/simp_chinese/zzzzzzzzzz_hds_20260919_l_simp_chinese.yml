l_simp_chinese:
 hds_nr.1.t:0 "南阳黄巾来降"
 hds_nr.1.desc:0 "南阳流散的黄巾部众遣人请降。名册念到后来，来人已口干舌燥，我让他先停下饮水，自己翻看后面的名字。\n\n三万五千九百四十九人，数目报得一丝不差，真编起伍来却不知还要费多少工夫。刘辟、黄邵、何仪、何曼等旧部也列在其中；能来相从的将领，自会陆续报到，不必全挤在今日这一份许诺里。\n\n我将名册留在案前。营门不能只管放人进来，谁领哪一队、谁听哪道令，都得接着分明。人既肯归，总比继续散在乡间，与我的兵隔着田埂相望要好。"
 hds_nr.1.a:0 "纳降整编，等可来之将陆续归队。"
 hds_nr_nanyang_yellow_turbans:0 "南阳黄巾降军"
 hds_nr_sun_jian_mortal_risk:0 "江东猛虎的险途"
 hds_nr_sun_jian_mortal_risk_desc:0 "讨董联军散去后，孙坚仍屡冒锋镝，身处险局。常规战死分支权重提高，健康、谋略防范与旅途安全下降。"
