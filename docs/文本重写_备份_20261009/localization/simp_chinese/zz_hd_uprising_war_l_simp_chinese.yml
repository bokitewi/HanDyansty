l_simp_chinese:
 HD_UPRISING_WAR_NAME:0 "起义战争"
 hd_peasant_populist_uprising_war_victory_desc:0 "起义军赢得了战争。强制执行诉求时，仍由进攻方实际控制的每个伯爵领都会转给当前实际占领者，主要进攻领袖则脱离原领主独立。"
 hd_peasant_populist_uprising_war_white_peace_desc:0 "双方停战；本场战争不会转移任何伯爵领。"
 hd_peasant_populist_uprising_war_defeat_desc:0 "起义失败；进攻方不会因本场战争获得伯爵领。"
 hd_uprising_war_victory_desc:0 "起义军赢得了战争，进攻方现在脱离原领主独立。"
 hd_yellow_turban_war_victory_desc:0 "这一路黄巾军赢得战争并强制执行诉求。战争期间夺取的伯爵领由各实际占领者继续持有。"
 hd_uprising_war_white_peace_desc:0 "双方停战；战争期间已经转让的领地维持现状。"
 hd_uprising_war_defeat_desc:0 "起义失败，本场战争所有进攻方在战争期间夺取的伯爵领归还防守方。"
 hd_yellow_turban.0001.t:0 "苍天已死"
 hd_yellow_turban.0001.desc:0 "雒阳的急信送到，我才展开，便看见[tang_zhou.GetName]告密的消息。三十六方的布置已露，[ma_yuan_yi.GetName]也已被捕处死；原定举事的日子尚未到，官府的搜捕却不会等。\n\n传信的人伏在面前，袖边尽是赶路留下的泥。我问还有多少人知道，他只摇头。此刻多迟疑一日，便可能再少一路肯举黄旗的信众。\n\n南阳有张曼成，颍川有波才，各方虽分领部众，却还能够同时起兵。我将急信按在案上，命人重传号令。既然已无路退回从前，那便不再等到三月五日。"
 hd_yellow_turban.0001.a:0 "苍天已死，黄天当立！"
 hd_yellow_turban.0002.t:0 "黄天得胜"
 hd_yellow_turban.0002.desc:0 "黄巾得胜的消息送到了我这里。来报者先说攻下了哪些地方，再说汉廷已在一路战场上认败，末了却又补上一句：其余军中的刀兵，尚未都停。\n\n我让他把经过说清。三路黄旗分别举起，如今已有一路站稳了脚跟，亲手攻得的县土，也仍由攻取它们的人握着。这场胜利足以动摇汉廷的威望，却不能让各路兵马、各处乡里的难题随之消失。\n\n门外有人已在议论天命更替。我望着尚未收起的军报，知道无论该为这消息欢喜还是忧惧，往后的安排都得重新打算。"
 hd_yellow_turban.0002.a:0 "黄旗已胜一路，天下须重新权衡。"
 hd_yellow_turban.0003.t:0 "黄天倾覆"
 hd_yellow_turban.0003.desc:0 "关于黄巾的末一封战报送来，三路大军都已败下阵去。昔日接连告急的地方，如今开始报送收复的县邑与溃散的人众，传话的人终于敢把声音放大些。\n\n我却没有立即将这些文书归入旧箧。战事能以一封报捷收尾，荒下的田、空去的里舍，却不会随着封泥落定便恢复原样。汉廷保住了名位，地方上握过兵权的人，也都记得自己曾经如何发令。\n\n我把最后一页读完。黄巾这场起事已告失败，接下来要面对的，是它在州郡与人心里留下的空缺。"
 hd_yellow_turban.0003.a:0 "黄巾已败，州郡仍须收拾。"
 hd_zhuojun_rangers:0 "涿郡义从"
 hd_zhuojun_rangers_adj:0 "涿郡义从"
