l_simp_chinese:
 hd_peach_garden.0001.t:0 "桃园一誓"
 hd_peach_garden.0001.desc:0 "酒已斟好，关羽与张飞在我身旁站定。园外仍有人谈论各地乱事，话音隔着院墙传来，到了这里，只剩风吹枝叶的声响。\n\n我们相识未久，却已说过许多不能向旁人轻许的话。云长将衣襟理好，翼德也收住了平日的高声，等我先开口。眼前没有官爵可分，也没有富贵可以许诺；我能拿出来的，不过是往后遇事不肯独自退走的一颗心。\n\n我接过酒盏。今日若以兄弟相称，便不能等到刀兵临身时，再问彼此究竟是什么人。"
 hd_peach_garden.0001.a:0 "结为兄弟，此后患难相扶。"
 hd_peach_garden.0002.t:0 "义旗初立"
 hd_peach_garden.0002.desc:0 "结义的酒器才收起不久，门外便来了愿意资助义军的客人。张世平、苏双的援助送到，钱帛与兵众的数目逐项报入，我终于不必只凭一番壮志招呼乡人。\n\n三千兵众待我编列，三千金足以支应眼前的军需。院中一下拥挤起来：有人问到哪里领兵器，有人等着分派营伍，还有人只想知道何时能吃上饭。起兵救民的话，我已说出口；这些肯把身家性命交来的人，更不能任其失望。\n\n我收下资助，命人先整名册。义旗之下，该有一支真正能够行军的队伍了。"
 hd_peach_garden.0002.a:0 "收下资助，整编三千义众。"
 hd_liu_bei_sponsored_army:0 "中山义商义兵"
