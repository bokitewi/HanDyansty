l_simp_chinese:
 hd_dong_aftermath.0010.t:0 "宫门换戍"
 hd_dong_aftermath.0010.desc:0 "宫门外的甲兵声稍稍止住，王允入殿禀报董卓已死，吕布立在阶下，身后军士换了号令。那一刻，我几乎以为连日压在殿中的空气也松开了。\n\n可接着呈来的，是朝政与军镇的新安排。王允主持政务，吕布掌握长安附近兵众，四方州郡却并未因董卓伏诛，便重新将印信与兵权奉到御前。\n\n我听他们逐项说完，望向殿外。杀死一个挟制天子的人，与使天子真正能够发令，原来并不是同一件事。如今能先守住的，仍只是这几重宫门与尚肯听命的人。"
 hd_dong_aftermath.0010.a:0 "先安宫城，再图朝政。"
 hd_li_jue_changan_cb:0 "夺取长安"
 hd_li_jue_changan_cb_name:0 "夺取长安"
 HD_LI_JUE_CHANGAN_WAR_NAME:0 "李傕进攻长安之战"
 hd_li_jue_event_troops:0 "凉州旧部"
 hd_li_jue_changan_victory_desc:0 "李傕取得京兆公国及其法理领土和关中帝国头衔，臣属于汉帝，成为权力最高的固化摄政；汉帝此时低于帝国等级的其余直属封臣转归李傕。三公九卿保留官职与持有人，继续直属汉帝。王允及结算前身处汉帝境内的亲属、配偶与养女貂蝉将被处决。"
 hd_li_jue_changan_no_victory_desc:0 "李傕未能取得长安，不获得关中帝国头衔或汉帝摄政权。剩余事件兵继续保留，不补充兵员。"
