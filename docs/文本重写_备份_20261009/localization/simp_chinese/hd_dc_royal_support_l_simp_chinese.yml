l_simp_chinese:
 hd_dc_request_royal_support_interaction: "请求支持王位"
 hd_dc_request_royal_support_interaction_desc: "送出一封具名邀约，请对方支持你对天命的真实宣称。所列酬金在对方本人同意并实际加入指定派系后，立即从你的私产支付；寄信与口头应允本身都不付钱。"
 hd_dc_support_reward_g1: "加入后支付30金"
 hd_dc_support_reward_g2: "加入后支付100金"
 hd_dc_support_reward_g3: "加入后支付300金"
 hd_dc_support.0008.t: "请君支持王位"
 hd_dc_support.0008.desc: "[hd_dc_support_claimant.GetTitledFirstName]的信没有再绕弯子。问候家眷之后，纸上列出了[hd_dc_support_claimant.GetHerHis]的皇位主张，以及要求我公开支持的具名派系。\n\n信末的酬金写得很清楚：[hd_dc_support.Var('hd_dc_support_reward_gold').GetValue|0]金，在我实际加入之后立即支付。收信还不等于答应。我要亲自决定，是否让自己的名字出现在这份主张之下。"
 hd_dc_support.0008.a: "我同意。把我的名字列入支持者中。"
 hd_dc_support.0008.a.tt: "重新核验资格后确定性加入信中指定的真实宣称者派系，成功后才支付约定私金。同一人在同一危机中的动员奖励最多一次，首次成功加入为候选动员+15；候选对你+25，在位者对你−20，其他候选对你−10，持续5年。没有额外拒绝抽签，也没有十年禁止退出。"
 hd_dc_support.0008.c: "我仍支持在位之君。"
 hd_dc_support.0008.c.tt: "明确拒绝本次招揽：该候选动员−5；在位者对你+15，候选对你−20，持续5年。这一对角色2年内不再重复本次邀请，不扣款、不加入派系。"
 hd_dc_support.0008.invalid: "此信所依据的局势已经改变。"
 hd_dc_support.0108.t: "名字落定之后"
 hd_dc_support.0108.paid: "回信与名册已核对无误。受邀者确已加入原信指定的派系，约定的酬金也已从邀请人的私产实际转交。\n\n这一笔招揽已办结。此后的战争仍须依照真实局势展开，不能凭一封答书就写下胜负。"
 hd_dc_support.0108.unpaid: "名册确认了实际加入，但款项尚未完整交付。经手人把原收据留在案上，没有再开出第二张相同的付款令。\n\n尚欠的部分仍在原账里，既不能当作已经履约，也不能用第二次扣款掩盖第一笔账。"
 hd_dc_support.0108.refused: "回信写得明确：受邀者仍支持在位之君，不愿加入这份皇位主张。\n\n这一答复没有带来新的派系成员，也没有产生酬金支出。双方都已经知道彼此的立场，这封信暂时不必再寄。"
 hd_dc_support.0108.failed: "答复已经送回，执行时却未能确认受邀者加入原信指定的派系。\n\n经手人停止了后续酬金支付，没有把口头应允当成已经到手的支持，也没有偷偷改投另一份派系。"
 hd_dc_support.0108.a: "按实际结果记下。"
