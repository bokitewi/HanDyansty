 uuii_bm_group_184: "公元184年"
 bm_uuii_184: "184年"
 bm_uuii_184_desc: "中平元年，汉廷的权威仍笼罩天下，但在权力蔓延不到的阴影之下，汉朝威严逐渐松动。宫中宦官与外戚相争，地方豪强走上权力舞台，连年的灾疫与徭役也让百姓对朝廷失去了耐心。\n\n百姓的怒火在张角的太平道下被组织成三十六方，只待一声号令，便能改天换地。腐朽的汉室步履维艰，在自己命运的转折点上，各方势力暗流涌动，虎视眈眈地想要篡夺权力。"
uuii_book_cao_cao_name_subheading: "治世之能臣，乱世之奸雄"
uuii_book_liu_bei_name_subheading: "其德昭昭，其志烈烈"
uuii_book_yuan_shao_name_subheading: "高风义轨，冠冕海内"
uuii_book_sun_jian_name_subheading: "破虏将军"
uuii_book_zhang_jiao_name_subheading: "大贤良师"
 uuii_book_cao_cao_name_desc: "曹操出身沛国曹氏。他才略过人，也因祖父曹腾的身份屡受非议。对他而言，家世既能打开仕途，也是一道必须越过的门槛。\n\n汉庭即将倾覆，曹操怀有一腔报国热血，誓要为国效力。\n\n#bold 你是将选择成为治世之能臣，还是乱世之奸雄？#!"

 uuii_book_yuan_shao_name_desc: "汝南袁氏四世三公，门生故吏遍布天下。袁绍凭借家声和善于交结的名望，已经成为士人中的瞩目人物，在权力的中心如鱼得水。\n\n宫中宦官与外戚的争斗日益激烈，朝野都在等待有人率先出手。袁绍拥有号召群士的声望，却必须决定要把这份声望用在何处。\n\n#bold 你能否聚拢天下英杰，在即将到来的乱世中让汝南袁氏登上权力之巅？#!"

 uuii_book_liu_bei_name_desc: "刘备自称中山靖王之后，但这一支宗室早已衰落，好在有同宗接济，刘备得以前往洛阳求学，幸而成为了卢植的门生。\n\n汉朝的动荡在边地幽州激起涟漪，不安的情绪在蔓延。刘备怀着一腔爱国热忱，意图召集志同道合之人，平息动乱，中兴汉室。可是刘备除了汉室宗亲的名分和早年游侠积累的声望外，他手中没有足以左右天下的力量。\n\n#bold 你能否从涿郡起步，聚拢愿与你并肩之人，为自己赢得一片立足之地并带领汉室走向中兴？#!"

 uuii_book_sun_jian_name_desc: "孙坚出身吴郡，早年的经历已经显露出他的果断与勇气。如今升任下邳县令，他有了更广阔的视野，但也必须面对南方盘根错节的豪族与盗寇。\n\n北方的动乱很快就会波及各州。孙坚需要谨慎抉择在乱世中的立场，究竟是奉汉廷之命征战，还是把握机会扬名立万，为孙氏争取更远大的前程。\n\n#bold 你能否步步为营，在乱世中开创属于江东孙氏的基业？#!"

 uuii_book_zhang_jiao_name_desc: "在见识了民间疾苦后，张角以拯救天下苍生为己任，又创建太平道在民间传教。经过多年经营，超过三十六万信众跨州连郡，视大贤良师为救世主。\n\n起事的日期已经定下，京师内应与各方渠帅也在暗中准备。然而参与者越多，消息便越难保守；朝廷一旦有所察觉，所有布置都可能付诸东流。\n\n#bold 苍天将死。你能否实现自己的愿望，以黄天之名改写天命？#!"

