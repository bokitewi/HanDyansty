l_simp_chinese:
 # Interaction & Basic Strings #
 sworn_brotherhood_interaction:0 "立下义结金兰"
 sworn_brotherhood_interaction_desc:0 "提议缔结神圣的义结金兰，创造如传说中桃园结义般牢不可破的羁绊。"
 SWORN_BROTHERHOOD_NORMAL:0 "提议结拜兄弟"
 opinion_sworn_brotherhood:0 "金兰之谊"
 sworn_brotherhood_modifier:0 "神圣盟约约束"
 broke_sworn_brotherhood_oath:0 "背誓之人"
 friend_relation_effect_actor:0 "成为[recipient.GetTitledFirstName]的结拜兄弟"
 friend_relation_effect_recipient:0 "成为你的结拜兄弟"
 
 # AI Traits
 AI_TRAIT_LOYAL:0 "忠诚"
 AI_TRAIT_JUST:0 "正直"
 AI_TRAIT_HONEST:0 "诚实"
 AI_TRAIT_BRAVE:0 "勇敢"
 AI_TRAIT_DECEITFUL:0 "狡诈"
 AI_TRAIT_ARBITRARY:0 "反复无常"
 AI_TRAIT_AMBITIOUS:0 "野心勃勃"
 AI_TRAIT_PARANOID:0 "多疑"
 AI_STRATEGIC_NEED:0 "当前处境需要可靠盟友"
 
 # Peach Garden Oath Ceremony
 sworn_brotherhood_events.0001.t:0 "桃园结义"
 
 # Dynamic Event Descriptions
 sworn_brotherhood_events.0001.desc.intro:0 "酒礼已经备妥，我与[blood_bro.GetTitledFirstName]相对站定。旁人渐渐止住说笑，我才发觉，平日熟悉的称呼到了今日，忽然多出一份郑重。\n\n"
 sworn_brotherhood_events.0001.desc.outro:0 "\n\n我接过酒盏。誓言不必说尽天下所有好话，只须选准最愿守住的一句，并记得以后怎样照它行事。"
 sworn_brotherhood_events.0001.desc.just:0 "谈到往后如何相待，话终究落在信义二字上。若只在得意时相称兄弟，到了利害面前却换一副说法，今日的仪礼再周全，也不过徒增笑谈。"
 sworn_brotherhood_events.0001.desc.brave:0 "说起往后的险难，彼此都没有回避。勇武能使人向前，肯不肯在身旁之人遭难时仍然向前，却是另一回事。今日的酒，应为这后一件事而饮。"
 sworn_brotherhood_events.0001.desc.loyal:0 "相交至今，彼此已经有了可以托付的信任。我不愿只把这份信任留在一句客套之中；往后消息纷乱、利害相争时，总该记得今日仍肯当面说清的话。"
 sworn_brotherhood_events.0001.desc.ambitious:0 "我们都不愿只守着眼前的日子，谈起将来，也各有要成的事情。志向相近固然能使人相聚，如何不因所争相近而反目，才值得在今日郑重立约。"
 sworn_brotherhood_events.0001.desc.generic:0 "未必事事同心，也未必处处相似，但相交以来，彼此都有不愿轻弃的情分。今日愿以兄弟相称，便是要把这份情分看得比寻常往来更重一些。"
 
 # Oath Options
 sworn_brotherhood_events.0001.a:0 "以信义为先，郑重行礼。"
 sworn_brotherhood_events.0001.b:0 "以忠诚相托，立誓相守。"
 sworn_brotherhood_events.0001.c:0 "愿共赴险难，以勇相许。"
 sworn_brotherhood_events.0001.d:0 "不多铺张，以一盏酒明心。"
 
 # Oath Tooltips
 sworn_brotherhood_righteous_path_tt:0 "以义结拜，我们将获得额外的荣誉，并有几率变得更加正直。此路径效法刘备之遗风。"
 sworn_brotherhood_loyalty_path_tt:0 "以忠结拜，我们将获得军事才能并对誓言更加坚定。此路径效法关羽之忠义。"
 sworn_brotherhood_ferocity_path_tt:0 "以勇结拜，我们将获得战斗力和坚定的决心。此路径效法张飞之勇武。"
 sworn_brotherhood_simple_path_tt:0 "立下简单而真诚的兄弟盟约，获得适度的仪式性荣誉。"
 
 # Follow-up Event
 sworn_brotherhood_events.0002.t:0 "情谊考验"
 sworn_brotherhood_events.0002.desc:0 "自我与[blood_bro.GetTitledFirstName]结为兄弟，已有数月。当日酒礼中的许多细节渐渐模糊，几句认真说过的话，却仍会在想到往后来往时重新浮起。\n\n誓言立下，并不意味着从此不用再照顾这段关系。有人提议再申相守之意，有人说，愿共赴险难才最见真心；也可以只承认这些日子的情分，或不再添设仪典。\n\n我想起结义时彼此郑重的神色。该以什么方式继续相待，终究不由旁人替我们决定。今日所选，也该是以后愿意记住的一种承诺。"

 sworn_brotherhood_events.0002.a:0 "重申相守之誓，彼此以忠。"
 sworn_brotherhood_events.0002.b:0 "重申共赴险难之志，彼此以勇。"
 sworn_brotherhood_events.0002.c:0 "记取这段情分，厚结兄弟之谊。"
 sworn_brotherhood_events.0002.d:0 "情分已明，不再添设仪典。"

 sworn_brotherhood_strengthened_tt:0 "我们结拜的情谊历经共患难而更加坚固。"
 
 # Modifier Names & Descriptions
 brotherhood_loyalty_modifier:0 "忠义相连"
 brotherhood_loyalty_modifier_desc:0 "神圣的誓言在结拜兄弟之间铸就了牢不可破的忠诚纽带。"
 
 brotherhood_ferocity_modifier:0 "勇烈兄弟"  
 brotherhood_ferocity_modifier_desc:0 "结拜的盟约点燃了守护血盟兄弟的炽烈怒火。"
 
 tested_brotherhood_modifier:0 "历劫情谊"
 tested_brotherhood_modifier_desc:0 "时间与考验证明了这份义结金兰的真实与持久。"
 
 brotherhood_ambition_modifier:0 "雄心之盟"
 brotherhood_ambition_modifier_desc:0 "已与血盟兄弟立下雄心之誓，为成就大业而联合。"
 
 # Oath Breaking Penalties
 oath_breaker_modifier:0 "背誓之人"
 oath_breaker_modifier_desc:0 "此角色背弃了神圣的义结金兰，因而遭受鄙夷与不信任。"
 
 dishonorable_modifier:0 "无信之徒"
 dishonorable_modifier_desc:0 "此角色背叛结拜兄弟的行为，标志着其本质上的无信无义。"
 
 # Oath-Breaking Events
 sworn_brotherhood_events.0003.t:0 "兄弟背叛"
 sworn_brotherhood_events.0003.desc.intro:0 "[actor.GetName]背弃兄弟誓言的消息到了。我将来报听完，仍让对方再说一遍，直到再无借口把它当作一句传错的话。\n\n"
 sworn_brotherhood_events.0003.desc.just_betrayed:0 "我最不能忍受的，正是当日以信义相许，今日却任它作废。往后再听见郑重誓言，大概也不能像从前那样不存疑虑。"
 sworn_brotherhood_events.0003.desc.wrathful_betrayed:0 "怒气使我几乎立刻起身。熟悉的人最知道一刀应落在何处，这份背弃也因此比寻常敌意更难吞下。"
 sworn_brotherhood_events.0003.desc.cynical_betrayed:0 "我并非不曾怀疑誓言的分量，只是总以为眼前这一份可以例外。如今连这点侥幸，也被[actor.GetSheHe]亲手打消了。"
 sworn_brotherhood_events.0003.desc.generic_betrayed:0 "我想起当初相对举杯时的神色，试着将那一刻与眼前消息放在一起，却怎么也接不成原来的关系。"
 sworn_brotherhood_events.0003.desc.outro:0 "\n\n来报的人还在等我开口。旧誓已经不能约束对方，接下来如何回应，却仍将决定别人怎样看我，也决定我往后怎样相信人。"
 sworn_brotherhood_events.0003.a:0 "背誓之名该让人知道；我也不再轻信。"
 sworn_brotherhood_events.0003.b:0 "既然背我，便以仇敌相待。"
 sworn_brotherhood_events.0003.c:0 "认清这份背弃，保住自己的声名。"
 
 # Betrayer Event
 sworn_brotherhood_events.0004.t:0 "誓言破碎"
 sworn_brotherhood_events.0004.desc:0 "我已经背弃了与[actor.GetName]立下的兄弟誓言。无论当时有何理由，失信的污名都将由我承担。"
 sworn_brotherhood_events.0004.a:0 "懊悔背叛之行"
 sworn_brotherhood_events.0004.b:0 "拥抱野心"
 
# Opinion Modifiers & Tooltips
 hd_sworn_brotherhood_declined:0 "结拜兄弟背叛"
 opinion_betrayed_me:0 "背叛了我"
 opinion_broken_oath_justice:0 "背叛神圣盟约"
 opinion_expected_betrayal:0 "早料其奸"
 stress_broken_oath_tt:0 "结拜兄弟的背叛动摇了你的心魄。"
 stress_vengeful_rage_tt:0 "正义的怒火吞噬着你，却无法带来平静。"
 
 # Enhanced Follow-up Event Options
 sworn_brotherhood_loyalty_strengthened_tt:0 "我们的忠诚纽带历经考验，比以往任何时候都更加牢固。"
 sworn_brotherhood_ferocity_strengthened_tt:0 "我们炽烈的兄弟情谊在时间的熔炉中证明了其价值。"
 sworn_brotherhood_tested_tt:0 "我们的义结金兰经受住了时间的考验，并因此更加坚固。"
 sworn_brotherhood_humble_refusal_tt:0 "我们谦逊地承认，彼此的情谊无需更多的仪式或奖赏。"
