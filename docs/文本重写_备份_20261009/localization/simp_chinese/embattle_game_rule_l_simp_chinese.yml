l_simp_chinese:
 rule_embattle_side_advantage_multiplier:0 "布阵——旧版优势乘数（已停用）"
 setting_embattle_side_advantage_1x:0 "旧版选项"
 setting_embattle_side_advantage_1x_desc:0 "兼容旧版文本；现行副将军事修正使用军事平均值公式。"
 setting_embattle_side_advantage_0.5x:0 "旧版选项"
 setting_embattle_side_advantage_0.5x_desc:0 "兼容旧版文本；现行副将军事修正使用军事平均值公式。"
 rule_embattle_side_commander_traits_sharing:0 "布阵——副将战斗特质共享"
 setting_embattle_side_commander_traits_sharing_enable:0 "启用"
 setting_embattle_side_commander_traits_sharing_enable_desc:0 "玩家军队的主将在实际战斗中共享指定的副将战斗特质。同种特质取最高经验档位，不重复累计。AI军队仍可自动任命副将；本补丁保留原有玩家军队加成范围。"
 setting_embattle_side_commander_traits_sharing_disable:0 "禁用"
 setting_embattle_side_commander_traits_sharing_disable_desc:0 "不共享副将战斗特质；副将任命和军事平均修正不受此开关影响。已有共享特质在下次有效维护时移除。"
 rule_embattle_side_commander_appointor:0 "布阵——副将手动任免"
 setting_embattle_side_commander_appointor_ai_only_except_own_troop:0 "仅亲征部队"
 setting_embattle_side_commander_appointor_ai_only_except_own_troop_desc:0 "玩家只能手动任免亲征部队的副将。其他部队仍可自动任命。关闭任免窗口不再清除合法的自动任命。"
 setting_embattle_side_commander_appointor_player_exempt:0 "任何己方部队"
 setting_embattle_side_commander_appointor_player_exempt_desc:0 "玩家可以手动任免自己军队的副将，不要求本人担任主将。"
 rule_embattle_tactic:0 "布阵——旧版战术（已移除）"
 setting_embattle_tactic_enabled:0 "已停用（旧档兼容）"
 setting_embattle_tactic_enabled_desc:0 "本补丁已移除战术抽选、兵种计数、战术克制和多样性奖励。此旧存档选项不会重新启用战术。"
 setting_embattle_tactic_disabled:0 "已停用"
 setting_embattle_tactic_disabled_desc:0 "战术机制已移除。保留此标识仅用于兼容旧存档。"
 rule_embattle_side_commanders_trait_xp:0 "布阵——副将额外特质经验"
 setting_embattle_side_commanders_trait_xp_enabled:0 "启用"
 setting_embattle_side_commanders_trait_xp_enabled_desc:0 "保留原有副将行军、攻城和劫掠额外经验公式与资格范围。行军额外经验适用于玩家军队；攻城、劫掠保留原有双方适用范围。副将须仍在本军队且已有对应特质。"
 setting_embattle_side_commanders_trait_xp_disabled:0 "禁用"
 setting_embattle_side_commanders_trait_xp_disabled_desc:0 "停用本系统额外给予副将的行军、攻城和劫掠经验。不修改原版主将经验机制。"
 rule_embattle_acotw_compatch:0 "布阵——旧兼容选项（已停用）"
 setting_embattle_acotw_compatch_enabled:0 "已停用（旧档兼容）"
 setting_embattle_acotw_compatch_enabled_desc:0 "保留旧存档标识，不再依赖第三方遮蔽特质。AI副将任命使用本补丁的单军队、失败暂停逻辑。"
 setting_embattle_acotw_compatch_disabled:0 "已停用"
 setting_embattle_acotw_compatch_disabled_desc:0 "旧兼容筛选已停用；不影响玩家和AI副将自动任命。"
