l_simp_chinese:
 hd_subdue_qingzhou_huangjin_decision:0 "招降青州黄巾"
 hd_subdue_qingzhou_huangjin_decision_desc:0 "青州黄巾百万之众，正辗转于青、兖之间，且战且饥。遣使招抚，收其精壮，可成一支劲旅。\n\n然而能否收其众、安其食、结其心，尽在三验：阅其营垒（军事），屯其就食（管理），盟其渠帅（外交）。每验有成，得青州军4000人；三验俱成，更增10000人，直辖诸县亦蒙屯垦之利。\n\n#weak 此议天下仅有三次尝试之机，一人毕生只可一试。任一验出现大成功，或有人三验俱成，此议即对天下永久关闭。#!"
 hd_subdue_qingzhou_huangjin_decision_tooltip:0 "通过军事、管理、外交三重鉴定，收编青州黄巾的精壮为青州军。"
 hd_subdue_qingzhou_huangjin_decision_confirm:0 "受降如受战：阅其众、安其食、结其心，三验定成败。"
 hd_hj_qingzhou_army:0 "青州军"
 hd_hj_qingzhou_reclaim_county_modifier:0 "青州军屯"
 hd_hj_qingzhou_reclaim_county_modifier_desc:0 "受降的黄巾部众被编为军屯，且耕且战，乡野日渐繁庶。"
 hd_huangjin.1.t:0 "辕门受降"
 hd_huangjin.1.desc_fail:0 "鼓声已经响过，后列还在乱动。我站在辕门前，看着一面令旗竟传不动这许多人，方才那点收得强兵的期待也冷了下来。\n\n近看才知，兵器残缺，行伍不明，许多人不过是跟着人群寻口饭吃。渠帅急着解释，我抬手叫他停下：若连自己的部众都数不清，到了阵前，准备拿谁听令？\n\n他垂下头，周围也没人再吭声。我将阅众的事暂且收住。军中要的是能用之兵，可营外这些嘴还等着吃饭。明日先议粮食，看看这场招抚究竟还能留住什么。"
 hd_huangjin.1.desc_success:0 "鼓令传了几遍，降众才逐渐排齐。我沿着行伍走过去，有人还在找自己该站的位置，也有人一听喝令便立刻收住脚步。\n\n后面那些，是用得上的。我指给左右看，没有因为前列混乱便把所有人一概赶开。兵器可以配，营伍可以整；乱世里还能肯听号令、拿得动刀枪的人，不该轻轻放过。\n\n渠帅见我开始记名，忙问何时能入营。我没有立刻许下军额，只问他们有多少食口。话音一落，周围比方才整队时还静。原来他们最怕的，始终是这一问没有下文。"
 hd_huangjin.1.desc_crit:0 "辕门外降众列得密密层层。我原以为还须吼上几遍，鼓声一起，前后各队竟依次站定，连旗尾的人也没有乱动。\n\n我沿队走过，停在几个肩背结实的军士面前。他们手里的兵器杂，望向令旗的眼神却不含糊。“从前便这样列阵？”我问。渠帅赶忙答话，语气里终于有了些底气。\n\n这些人若只当流散饥民放走，倒是我看走眼了。我回身叫人记下可用之众，又问营中还有多少口粮。要他们替我打仗，总得先让他们明白，归来以后有路可走。"
 hd_huangjin.1.a:0 "阅众已毕，明日议其粮食。"
 hd_huangjin.2.t:0 "且耕且战"
 hd_huangjin.2.desc_fail:0 "昨日的鼓声还像留在耳边，今日摊开的粮簿却先给了我一盆冷水。报来多少食口，便要真拿出多少粮；那些尚未开垦的田，眼下连一餐也抵不了。\n\n书吏算到第三遍，声音越来越低。我将他写错的一处指出，待改过以后，缺口反倒更清楚了。营外又有人来问接济，左右互相看着，没有一个愿先出去。\n\n我按住簿册，让人将难处照实记下。明日还要见渠帅，今日这笔粮账却怎么也糊弄不过去。招人时说一句收留容易，真正让他们留下，竟如此费力。"
 hd_huangjin.2.desc_success:0 "今天不再试弓刀，先算饭食。随营的老弱与精壮各有名数，我一项项问过，最不愿听的便是有人把所有食口都报作兵额。\n\n几番核对，总算议出安置的办法。能战的编伍，其余另行安顿，眼前存粮与日后耕作都勉强接得上。我让书吏重誊一份，空处宁可留着，也别为讨一句好话添出并不存在的粮。\n\n章程放回案上，我又看了一眼。算得过来，未必就办得顺；明日还须与渠帅当面说清，让他们知道我肯给什么，也知道归我号令便须守什么。"
 hd_huangjin.2.desc_crit:0 "昨日阅众之后，我已叫人把食口与田地分别查报。今日几份簿册铺开，先前各说各的数目，竟能一项项接上。\n\n能战者入伍，其余人众安置耕作，眼前接济也找到了可行的办法。我听到最后，拿起笔亲自对了两处，才让那口一直提着的气落下。若只把人聚来吃粮，再大的府库也养不起一场没有尽头的受降。\n\n“照此办理。”我把簿册递回去。地里还没有收成，但至少不必再拿空话答应饥民了。明日见诸渠帅，我也终于有些实在的话可说。"
 hd_huangjin.2.a:0 "记下安置结果，明日与诸渠帅立约。"
 hd_huangjin.3.t:0 "歃血为誓"
 hd_huangjin.3.desc_fail:0 "话说到长久听命，诸渠帅的答复便慢了。有的望着地面，有的只说愿暂留，方才还肯应声的人，也把嘴闭得紧紧的。\n\n我将条件重说一遍，耐心却已不如开头。“入了军中，不能各行各令。”此话一出，帐内越发安静。直到散去，也没人肯给我一句足可凭信的话。\n\n我看着空下的坐席，把前两日的军籍与安置簿取回案前。能留下多少人，还得从这些实在的结果中找；若连可用精壮和给养都无着落，这场招抚便真要空手而归了。"
 hd_huangjin.3.desc_success:0 "诸渠帅进帐后，我先讲这两日核查所得，再将军中约束说清。有人听到后面，终于忍不住追问：“若有冤抑，也许我等再来陈说么？”\n\n我看了他一眼，让他把话讲完。他肯问，总胜过低着头只说唯唯。几番往返之后，众人终于愿意立约，先前绷紧的肩背也放松了些。\n\n我端起手边的水，才觉说得口干。人心暂且稳住，接着便要把可用之众与粮食安置相互对过，定下最后的军额。帐外已有候令的人，今日不必再让他们只带着疑虑散去。"
 hd_huangjin.3.desc_crit:0 "诸渠帅依约入帐，起初各自坐得拘谨。我没有催他们起誓，先把编伍、安置与军中约束一条条说开，问还有哪处不明白。\n\n终于有人抬头，问家口能否安顿；又有人问入营以后听谁号令。话一多，先前那层防备倒渐渐散了。最后一人应诺时，旁人也跟着俯身，声音比来时齐整得多。\n\n我叫他们起身，心里已开始掂量前两日留下的名册与粮数。肯归心，是一件好事；究竟留多少人执兵，还要看能挑出多少精壮、安置多少食口。今日这番话，总算没有白说。"
 hd_huangjin.3.a:0 "定下军额，收整降众。"
 hd_huangjin.3.reward_full:0 "三验俱成！得青州军22000人（每验4000，全过另增10000）；直辖诸县发展度增长+30%，为期20年。"
 hd_huangjin.3.reward_8000:0 "得青州军8000人。"
 hd_huangjin.3.reward_4000:0 "得青州军4000人。"
 hd_huangjin.3.reward_none:0 "三验皆败，降众散去，一无所获。"
 hd_huangjin.3.closed_crit:0 "鉴定中出现大成功——“招降青州黄巾”决议已对天下所有人永久关闭。"
 hd_huangjin.3.closed_full:0 "三验全过——“招降青州黄巾”决议已对天下所有人永久关闭。"
 hd_huangjin.3.closed_third:0 "此为天下第三次尝试——“招降青州黄巾”决议已彻底关闭。"
