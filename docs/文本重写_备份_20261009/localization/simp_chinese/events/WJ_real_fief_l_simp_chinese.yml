l_simp_chinese:
 WJ_rf_grant:0 "册封实封公（测试）"
 WJ_rf_grant_desc:0 "选择三郡建立世袭封国。成功后皇帝损失200正统性；取消不扣。"
 WJ_rf_request_decision:0 "申请封公（测试）"
 WJ_rf_request_decision_desc:0 "须为在任六职之一且已有侯爵，天子为本人的傀儡；本人或直接门生、幕僚须任录尚书事，直接门生、幕僚须掌握侍中、大司马、尚书令中的两种职位。达标后由本人选择封国。"
 WJ_rf_request_decision_tooltip:0 "开始三郡选地；条件有效必然批准。"
 WJ_rf_request_decision_confirm:0 "开始选地"
 WJ_rf_expand_decision:0 "申请扩国（测试）"
 WJ_rf_expand_decision_desc:0 "增加一个与封国实辖土地陆地接壤的郡。本人每三年一次。"
 WJ_rf_expand_decision_tooltip:0 "选择一个接壤郡，不迁都。"
 WJ_rf_expand_decision_confirm:0 "开始选地"
 WJ_rf_promote_decision:0 "请求晋封为王（测试）"
 WJ_rf_promote_decision_desc:0 "天子须为本人的傀儡，本人或直接门生、幕僚须任录尚书事；实封国须至少拥有100个实际县，且最高领主为霸权。晋封后不因失地自动降爵。"
 WJ_rf_promote_decision_tooltip:0 "建立帝国级王号，原公国继续保留。"
 WJ_rf_promote_decision_confirm:0 "晋封为王"
 WJ_rf_pick:0 "选择实封国疆域"
 WJ_rf_pick_desc:0 "为[ROOT.Char.MakeScope.Var('wj_rf_target').Char.GetUIName]选择封国。\n\n[ROOT.Char.Custom('WJ_rf_step_desc')]\n\n只改所选郡的法理；实际跳过外朝县。保留郡县官，兼持官员的其余辖区可随本人转属。取消不交地、不扣费、不启动冷却。"
 WJ_rf_success:0 "封国事务完成"
 WJ_rf_success_desc:0 "[wj_rf_beneficiary.GetUIName]的封国事务已结算。"
 WJ_rf_failed:0 "头衔交易未达到预期"
 WJ_rf_failed_desc:0 "本次交易的持有人结果未达到预期，未扣正统性或启动成功冷却。请保留当次日志核对原生交易；不把此提示当成已自动回滚。"
