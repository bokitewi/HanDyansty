 HuangDi_miaoshi.081.e:0 "蚤孤短折，恭仁短折曰哀，谥 #Y 【哀】"
 HuangDi_miaoshi.081.f:0 "不显尸国，隐拂不成曰隐，谥 #Y 【隐】"
 HuangDi_miaoshi.081.g:0 "好更改旧，轻变成法曰易，谥 #Y 【易】"
