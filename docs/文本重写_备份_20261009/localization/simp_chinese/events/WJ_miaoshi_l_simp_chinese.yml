 HuangDi_miaoshi.011_d:0 "礼官又呈上一份文书，这一回是身后之谥。候选与字义并列，我沿着看下去，忽然觉得每个短短的字后面，都站着不同的说法。\n\n有人愿重功业，有人更顾哀敬，前面那些议论已经说过许多。我没有让他们重新争起，只将先帝记录放在手边，再看眼前名目。\n\n殿中等着最后裁定。无论取哪一个，往后的礼文都将沿用；此刻，先由我把它念出来。"
