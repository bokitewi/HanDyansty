 HuangDi_miaoshi.081.j:0 "谋虑不成，欲为而止曰息，谥 #Y 【息】"
 HuangDi_miaoshi.081.k:0 "述义不克，迷而不悌曰丁，谥 #Y 【丁】"
 HuangDi_miaoshi.081.l:0 "举事而迟，从容安和曰舒，谥 #Y 【舒】"
 HuangDi_miaoshi.081.m:0 "幼少短折，怀虚守静曰冲，谥 #Y 【冲】"
