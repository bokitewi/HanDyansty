l_simp_chinese:
 Color_EHuang:0 "#color:{0.745,0.541,0.184}; #bold "
 HouGong_ShiHao.021_desc:0 "我决定亲拟谥号，礼官便将原来的候选收开。方才满案的字撤去，留下的一处空白，倒比任何候选更难使人移开目光。\n\n想说的尚多，能写进正式称谓的却不必全说。我握笔在手，将拟好的字默念一遍，等心里那点犹疑安定下来。\n\n请输入谥号，再依下方选项确认。"
 HouGong_ShiHao.021_title:0 "钦定先帝尊谥（自定）"
 HuangDi_miaoshi.001.a:0 "先帝肇启鸿图，底定四海，宜尊为开基定鼎之祖"
 HuangDi_miaoshi.001.b:0 "先帝戡定祸乱，光复宗祧，宜尊为再造中兴之祖"
 HuangDi_miaoshi.001.c:0 "先帝躬亲庶务，海宇乂安，宜尊为弘化致治之宗"
 HuangDi_miaoshi.001.d:0 "先帝恪遵遗宪，保全基业，宜尊为承绪守文之宗"
 HuangDi_miaoshi.001.e:0 "先帝怠荒政事，功乏可称，难拟祖宗崇号"
 HuangDi_miaoshi.001.e1:0 "准予追立庙号，崇奉遗祀"
 HuangDi_miaoshi.001.event_title:0 "宗庙定谥"
 HuangDi_miaoshi.001.j:0 "典礼无征，出自圣裁#weak (自定义庙号)"
 HuangDi_miaoshi.001_tt:0 "先帝拥有[GetTrait('SanGong_HunJun').GetName( GetNullCharacter )][trait|E]"
 HuangDi_miaoshi.003.a:0 "肇造区夏、始受天命，曰太，定先帝庙号为$Color_EHuang$ #bold 太祖"
 HuangDi_miaoshi.003.b:0 "德覆万方、首启皇基，曰高，定先帝庙号为$Color_EHuang$ #bold 高祖"
 HuangDi_miaoshi.003_d:0 "开国之业议罢，礼官将庙号候选捧来。我接过文书，方才读到的旧事仍在耳边，眼前却已只剩几个郑重的字。\n\n后人未必能记住每一道军令、每一次艰难，却会在祭祀与文书中反复提到今日所选的称呼。案旁有人轻声问是否再读一遍，我摇头，自己将诸号逐项看过。\n\n此处先定庙号，随后再议谥。礼官已备好笔，等着我从这些候选中指出一个。"
 HuangDi_miaoshi.003_t:0 "追尊先帝庙号"
 HuangDi_miaoshi.004.a:0 "复国再造、重安社稷，曰世，定先帝庙号为$Color_EHuang$ #bold 世祖"
 HuangDi_miaoshi.004.b:0 "扶危定倾、光启中兴，曰中，定先帝庙号为$Color_EHuang$ #bold 中祖"
 HuangDi_miaoshi.004.c:0 "光复山河、继绝兴邦，曰代，定先帝庙号为$Color_EHuang$ #bold 代祖"
 HuangDi_miaoshi.004.d:0 "继统开基、光复宗祧，曰高，定先帝庙号为$Color_EHuang$ #bold 高祖"
 HuangDi_miaoshi.004.e:0 "戡乱定难、终成中兴，曰成，定先帝庙号为$Color_EHuang$ #bold 成祖"
 HuangDi_miaoshi.004.f:0 "戡平祸乱、安世保宗，曰烈，定先帝庙号为$Color_EHuang$ #bold 烈祖"
 HuangDi_miaoshi.004_d:0 "中兴之业议定，礼官将庙号候选呈到近前。文书换了一份，刚才那些国统几乎难续的旧事，却仍使殿中显得沉静。\n\n我把候选一一读过。有的字威重，有的字平和，落在先帝身后，便都不再是寻常辞句。有人想继续陈说理由，我抬手让他稍候；前面听得已够多，最后这一处仍须我自己定。\n\n选下庙号，后续还有谥议。眼前这几个字，却要先从我的口中说出。"
 HuangDi_miaoshi.004_t:0 "议定先帝庙号"
 HuangDi_miaoshi.005.a:0 "功德莫过、其业煌煌，曰太，定先帝庙号为$Color_EHuang$ #bold 太宗"
 HuangDi_miaoshi.005.e:0 "中兴有为、德高可尊，曰高，定先帝庙号为$Color_EHuang$ #bold 高宗"
 HuangDi_miaoshi.005.f:0 "中兴有功、百世不迁，曰世，定先帝庙号为$Color_EHuang$ #bold 世宗"
 HuangDi_miaoshi.005.g:0 "中兴有功、百世不迁，曰代，定先帝庙号为$Color_EHuang$ #bold 代宗"
 HuangDi_miaoshi.005.h:0 "中兴神器、复振宗祚，曰中，定先帝庙号为$Color_EHuang$ #bold 中宗"
 HuangDi_miaoshi.005.i:0 "盛德巍巍、於穆不已，曰仁，定先帝庙号为$Color_EHuang$ #bold 仁宗"
 HuangDi_miaoshi.005.k:0 "功光四海、仁行千载，曰显，定先帝庙号为$Color_EHuang$ #bold 显宗"
 HuangDi_miaoshi.005.l:0 "乃圣乃神、益称尧德，曰神，定先帝庙号为$Color_EHuang$ #bold 神宗"
 HuangDi_miaoshi.005.m:0 "无所不通、峻德垂统，曰圣，定先帝庙号为$Color_EHuang$ #bold 圣宗"
 HuangDi_miaoshi.005.o:0 "刚德克就、重明六合，曰肃，定先帝庙号为$Color_EHuang$ #bold 肃宗"
 HuangDi_miaoshi.005.p:0 "至仁至孝、善继善述，曰孝，定先帝庙号为$Color_EHuang$ #bold 孝宗"
 HuangDi_miaoshi.005.q:0 "惟天聪明，惟圣时宪，曰宪，定先帝庙号为$Color_EHuang$ #bold 宪宗"
 HuangDi_miaoshi.005.r:0 "圣善周闻、政教广布，曰宣，定先帝庙号为$Color_EHuang$ #bold 宣宗"
 HuangDi_miaoshi.005.s:0 "烈宗成德、受命溥将，曰烈，定先帝庙号为$Color_EHuang$ #bold 烈宗"
 HuangDi_miaoshi.005.t:0 "照临四方、德象神尧，曰明，定先帝庙号为$Color_EHuang$ #bold 明宗"
 HuangDi_miaoshi.005.u:0 "立成功成、奄有四方，曰成，定先帝庙号为$Color_EHuang$ #bold 成宗"
 HuangDi_miaoshi.005.v:0 "安乐抚民、庶几成康，曰康，定先帝庙号为$Color_EHuang$ #bold 康宗"
 HuangDi_miaoshi.005.w:0 "至道至真、玄之又玄，曰玄，定先帝庙号为$Color_EHuang$ #bold 玄宗"
 HuangDi_miaoshi.005.x:0 "治近至道、德以称宗，曰真，定先帝庙号为$Color_EHuang$ #bold 真宗"
 HuangDi_miaoshi.005.y:0 "克定祸乱、刑民克服，曰武，定先帝庙号为$Color_EHuang$ #bold 武宗"
 HuangDi_miaoshi.005_d:0 "礼官以先帝经略之业呈来候选庙号，念完以后，殿中便只剩衣袖轻动的声音。我将文书拿近，想到那些生前在朝堂上引起争论的政事。\n\n如今做事的人已不在，议论的人却还站在这里，等着为其择一个长久的称呼。我看过诸号，一时没有落定；换一个字，侧重的地方便也随之不同。\n\n礼官不敢催，只把笔搁稳。此处选定庙号，再继续议谥，总得有人先将这最后的犹疑收住。"
 HuangDi_miaoshi.005_t:0 "议定先帝庙号"
 HuangDi_miaoshi.006.a:0 "经天纬地、慈惠爱民，曰文，定先帝庙号为$Color_EHuang$ #bold 文宗"
 HuangDi_miaoshi.006.b:0 "英异之主、出类拔萃，曰英，定先帝庙号为$Color_EHuang$ #bold 英宗"
 HuangDi_miaoshi.006.c:0 "惟睿作圣、智虑深远，曰睿，定先帝庙号为$Color_EHuang$ #bold 睿宗"
 HuangDi_miaoshi.006.d:0 "尧曰知人、世有哲王，曰哲，定先帝庙号为$Color_EHuang$ #bold 哲宗"
 HuangDi_miaoshi.006.e:0 "坟史征德、生安允迪，曰德，定先帝庙号为$Color_EHuang$ #bold 德宗"
 HuangDi_miaoshi.006.f:0 "崇德报本，尊祖隆宗，曰崇，定先帝庙号为$Color_EHuang$ #bold 崇宗"
 HuangDi_miaoshi.006.g:0 "布德执以、德容静深，曰穆，定先帝庙号为$Color_EHuang$ #bold 穆宗"
 HuangDi_miaoshi.006.h:0 "光大有功、能绍前业，曰光，定先帝庙号为$Color_EHuang$ #bold 光宗"
 HuangDi_miaoshi.006.i:0 "由义而济、光有令绪，曰景，定先帝庙号为$Color_EHuang$ #bold 景宗"
 HuangDi_miaoshi.006.j:0 "不为而成、不疾而速，曰顺，定先帝庙号为$Color_EHuang$ #bold 顺宗"
 HuangDi_miaoshi.006.k:0 "善合法典、庄敬严威，曰敬，定先帝庙号为$Color_EHuang$ #bold 敬宗"
 HuangDi_miaoshi.006.l:0 "渊衷湛一、宁考安康，曰宁，定先帝庙号为$Color_EHuang$ #bold 宁宗"
 HuangDi_miaoshi.006.m:0 "兴有大业、圣图丕振，曰兴，定先帝庙号为$Color_EHuang$ #bold 兴宗"
 HuangDi_miaoshi.006.n:0 "体道得一，天纵自然，曰道，定先帝庙号为$Color_EHuang$ #bold 道宗"
 HuangDi_miaoshi.006.o:0 "法度明大、出言有文，曰章，定先帝庙号为$Color_EHuang$ #bold 章宗"
 HuangDi_miaoshi.006.p:0 "温和圣善、爱民质渊，曰懿，定先帝庙号为$Color_EHuang$ #bold 懿宗"
 HuangDi_miaoshi.006.q:0 "法度明大、出言有文，曰章，定先帝庙号为$Color_EHuang$ #bold 章宗"
 HuangDi_miaoshi.006.r:0 "果敢坚毅，秉性刚断，曰毅，定先帝庙号为$Color_EHuang$ #bold 毅宗"
 HuangDi_miaoshi.006.s:0 "宽仁得众，厚德承统，曰裕，定先帝庙号为$Color_EHuang$ #bold 裕宗"
 HuangDi_miaoshi.006.t:0 "政平刑肃、表章道术，曰理，定先帝庙号为$Color_EHuang$ #bold 理宗"
 HuangDi_miaoshi.006.u:0 "胜敌志强、威仪不忒，曰庄，定先帝庙号为$Color_EHuang$ #bold 庄宗"
 HuangDi_miaoshi.006.v:0 "盛明熙和、敬德光辉，曰熙，定先帝庙号为$Color_EHuang$ #bold 熙宗"
 HuangDi_miaoshi.006_d:0 "先帝守成的在位记录已经读毕，礼官奉上庙号候选，问我取哪一名。我将文书接到手中，先前密密的年月，如今只剩几个待选的字。\n\n没有开国时那般鲜明的刀兵可说，日常政务却一项项接续到今日。殿中有人想再添颂辞，我让他停下，自己沿候选看过。话已经说得够多了。\n\n选定庙号以后，尚须议谥。眼前先把这一处落定，使宗庙中的称呼不再悬而未决。"
 HuangDi_miaoshi.006_t:0 "议定先帝庙号"
 HuangDi_miaoshi.007.a:0 "和气广敷、有功安人，曰熹，定先帝庙号为$Color_EHuang$ #bold 熹宗"
 HuangDi_miaoshi.007.b:0 "质渊受谏、慈惠爱亲，曰僖，定先帝庙号为$Color_EHuang$ #bold 僖宗"
 HuangDi_miaoshi.007.c:0 "博闻多能，惠而内德，曰献，定先帝庙号为$Color_EHuang$ #bold 献宗"
 HuangDi_miaoshi.007.d:0 "道德纯一、体仁长民，曰元，定先帝庙号为$Color_EHuang$ #bold 元宗"
 HuangDi_miaoshi.007.e:0 "福庆绵延，善继承宗，曰庆，定先帝庙号为$Color_EHuang$ #bold 庆宗"
 HuangDi_miaoshi.007.f:0 "奉义顺则，恭俭庄敬，曰礼，定先帝庙号为$Color_EHuang$ #bold 礼宗"
 HuangDi_miaoshi.007.g:0 "元德充美、雅韵昭彰，曰徽，定先帝庙号为$Color_EHuang$ #bold 徽宗"
 HuangDi_miaoshi.007.h:0 "容仪恭美，昭德有劳，曰昭，定先帝庙号为$Color_EHuang$ #bold 昭宗"
 HuangDi_miaoshi.007.i:0 "爱民好与、柔质受谏，曰惠，定先帝庙号为$Color_EHuang$ #bold 惠宗"
 HuangDi_miaoshi.007.j:0 "强毅执政、庄以临下，曰威，定先帝庙号为$Color_EHuang$ #bold 威宗"
 HuangDi_miaoshi.007.k:0 "尊贤贵义、正德美容，曰恭，定先帝庙号为$Color_EHuang$ #bold 恭宗"
 HuangDi_miaoshi.007.l:0 "好和不争、兆民宁赖，曰安，定先帝庙号为$Color_EHuang$ #bold 安宗"
 HuangDi_miaoshi.007.m:0 "疏远继位、绍继前业，曰绍，定先帝庙号为$Color_EHuang$ #bold 绍宗"
 HuangDi_miaoshi.007.n:0 "威仪悉备、敬事节用，曰钦，定先帝庙号为$Color_EHuang$ #bold 钦宗"
 HuangDi_miaoshi.007.o:0 "虑深通敏、追悔前过，曰思，定先帝庙号为$Color_EHuang$ #bold 思宗"
 HuangDi_miaoshi.007.p:0 "进退可轨、从容有常，曰度，定先帝庙号为$Color_EHuang$ #bold 度宗"
 HuangDi_miaoshi.007.q:0 "守礼执义、圣修式化，曰端，定先帝庙号为$Color_EHuang$ #bold 端宗"
 HuangDi_miaoshi.007.r:0 "克敬勤民、能成武志，曰桓，定先帝庙号为$Color_EHuang$ #bold 桓宗"
 HuangDi_miaoshi.007.s:0 "甲胄有劳、协赞有成，曰襄，定先帝庙号为$Color_EHuang$ #bold 襄宗"
 HuangDi_miaoshi.007.t:0 "统承大绪，总御万方，曰统，定先帝庙号为$Color_EHuang$ #bold 统宗"
 HuangDi_miaoshi.007.u:0 "安民大虑，纯行不二，曰定，定先帝庙号为$Color_EHuang$ #bold 定宗"
 HuangDi_miaoshi.007_d:0 "说到先帝的过失，殿中比方才更静。礼官将存祀的庙号候选呈来，措辞小心，仿佛哪一个字读重了，都可能使人以为另有所指。\n\n我看着那些名目，又看一眼前面的政事记录。人已去世，许多难处却仍留给活着的人；此时定下一个称呼，也不会使堂下所有人都作同样想法。\n\n礼官仍候着。眼下要在存祀之议中择定庙号，随后再办谥议。最后的字既须由我指出，旁人的沉默便不能替我作答。"
 HuangDi_miaoshi.007_t:0 "追尊先帝庙号"
 HuangDi_miaoshi.008.a:0 "庙号为：祖"
 HuangDi_miaoshi.008.b:0 "庙号为：宗"
 HuangDi_miaoshi.008.c:0 "返回上一页"
 HuangDi_miaoshi.008_d:0 "候选都已看过，我仍决定另拟庙号。礼官将原稿收开，留下笔与空白文书，案前一下显得空了许多。\n\n方才不满意时，可以逐一说出理由；如今轮到自己落字，那些理由却不能替我写下一个名字。我将笔转正，重新想着先帝最应留在宗庙中的称呼。\n\n请输入所拟庙号，并在下方确认祖、宗格式；确认以前，仍可斟酌。"
 HuangDi_miaoshi.008_t:0 "自定义庙号"
 HuangDi_miaoshi.009.a:0 "#v 谨依礼制，议定庙谥，昭告四海#!"
 HuangDi_miaoshi.009.b:0 "#v 幼主早崩，不立庙号，循礼定谥，昭告天下#!"
 HuangDi_miaoshi.009.desc.1:0 "大行皇帝已经去世，议定庙谥的文书送到我面前。生前的许多事情还来不及分清轻重，礼官却已须准备怎样称呼这位逝去的君主。\n\n我让人先把功业与身后礼制分别说明。不论亲疏，落定的名号都将被后人沿用，不能只以今日的哀痛代替全部判断。\n\n"
 HuangDi_miaoshi.009.desc.2:0 "先帝有开国之业，今议庙号，应先顾及这一层根本。创下的基业仍在，怎样为其立名，却要由继起的人郑重决定。"
 HuangDi_miaoshi.009.desc.3:0 "礼官提起先帝中兴之功，原先低着头的人也抬起眼来。一度难以接续的国统，如今仍在，庙中该怎样称呼那位扶持它的人，正等我裁定。"
 HuangDi_miaoshi.009.desc.4:0 "先帝经略治世的记述宣读已毕，礼官呈上雄主一类的候选庙号。那些生前足以争论许久的事情，如今都等着收进寥寥几字里。"
 HuangDi_miaoshi.009.desc.5:0 "先帝守成之业已议明，礼官将相应候选奉到案前。我翻过那份在位记录，日常政务写得密密，今日却只须择一个长久沿用的称呼。"
 HuangDi_miaoshi.009.desc.6:0 "礼官读到先帝年岁，声音停了一下，才接着陈说身后礼议。许多未及施行的打算，如今都不必再等答复了。"
 HuangDi_miaoshi.009.desc.7:0 "先帝生前政事失当，今日哀痛不能使这些记录自行消失。如何在存祀与褒贬之间作出选择，正是案前这份礼议最难落笔之处。"
 HuangDi_miaoshi.009.event_title:0 "议谥尊号"
 HuangDi_miaoshi.011.a:0 "经天纬地曰文，定先帝谥号为 $Color_EHuang$ #bold 文"
 HuangDi_miaoshi.011.aa:0 "号令悦民曰和，定先帝谥号为 $Color_EHuang$ #bold 和"
 HuangDi_miaoshi.011.ab:0 "蓄义丰功曰仁，定先帝谥号为 $Color_EHuang$ #bold 仁"
 HuangDi_miaoshi.011.ac:0 "赏善罚恶曰宪，定先帝谥号为 $Color_EHuang$ #bold 宪"
 HuangDi_miaoshi.011.ad:0 "肇敏行成曰真，定先帝谥号为 $Color_EHuang$ #bold 真"
 HuangDi_miaoshi.011.ae:0 "行见中外曰显，定先帝谥号为 $Color_EHuang$ #bold 显"
 HuangDi_miaoshi.011.af:0 "尊明胜患曰智，定先帝谥号为 $Color_EHuang$ #bold 智"
 HuangDi_miaoshi.011.ag:0 "出类拔萃曰英，定先帝谥号为 $Color_EHuang$ #bold 英"
 HuangDi_miaoshi.011.ah:0 "聪哲明达曰睿，定先帝谥号为 $Color_EHuang$ #bold 睿"
 HuangDi_miaoshi.011.ai:0 "柔质慈民曰惠，定先帝谥号为 $Color_EHuang$ #bold 惠"
 HuangDi_miaoshi.011.aj:0 "才理审谛曰理，定先帝谥号为 $Color_EHuang$ #bold 理"
 HuangDi_miaoshi.011.ak:0 "中正精粹曰纯，定先帝谥号为 $Color_EHuang$ #bold 纯"
 HuangDi_miaoshi.011.al:0 "温柔贤善曰懿，定先帝谥号为 $Color_EHuang$ #bold 懿"
 HuangDi_miaoshi.011.an:0 "治而无眚曰平，定先帝谥号为 $Color_EHuang$ #bold 平"
 HuangDi_miaoshi.011.ao:0 "固节干事曰贞，定先帝谥号为 $Color_EHuang$ #bold 贞"
 HuangDi_miaoshi.011.ap:0 "畏天爱民曰敬，定先帝谥号为 $Color_EHuang$ #bold 敬"
 HuangDi_miaoshi.011.aq:0 "美化及远曰广，定先帝谥号为 $Color_EHuang$ #bold 广"
 HuangDi_miaoshi.011.ar:0 "应事有功曰敏，定先帝谥号为 $Color_EHuang$ #bold 敏"
 HuangDi_miaoshi.011.as:0 "好和不争曰安，定先帝谥号为 $Color_EHuang$ #bold 安"
 HuangDi_miaoshi.011.at:0 "安民大虑曰定，定先帝谥号为 $Color_EHuang$ #bold 定"
