l_simp_chinese:
 WJ_rf_ministry_grant:0 "承爵复任"
 WJ_rf_ministry_grant_desc:0 "朝廷使者奉诏而来，所持印绶，正是前任生前任职的凭信。\n\n封国之爵已由我承袭，朝廷如今又命我接掌[wj_rf_inherited_office.GetNameNoTierNoTooltip]之职。府中旧吏相顾而喜：若能续掌朝政，先君留下的基业便不止于一国之内。\n\n诏书既下，现任将交还印绶，由我赴任。"
 WJ_rf_ministry_accept:0 "谨奉诏命，承任其职。"
 WJ_rf_ministry_refused:0 "朝廷不予补授"
 WJ_rf_ministry_refused_desc:0 "朝廷对承袭者的任职资格作了复核，未允将[wj_rf_inherited_office.GetNameNoTierNoTooltip]之职补授于我。\n\n封爵可以承袭，朝职却不是爵位的附属。先君在朝时的权势，并未随印绶一并落入我手。朝廷已将这一职位重新掌握，我须另寻立足之道。"
 WJ_rf_ministry_refused_accept:0 "此事暂且记下。"
