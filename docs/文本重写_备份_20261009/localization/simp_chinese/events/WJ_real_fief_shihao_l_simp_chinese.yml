l_simp_chinese:
 WJ_rf_shihao.title:0 "议定先君之谥"
 WJ_rf_shihao.desc:0 "[XianDi.GetUIName]已经辞世。掌故官将先君治国行事的记录呈到案前，奉请议定谥号。\n\n谥以彰行，不因继承人的亲疏而改写前人的功过。我须据其生平择字，定下后世所用的称号。礼官将依所议告成，先君仍以公王之爵称之，不拟帝号，也不立庙号。"
 WJ_rf_shihao.finish:0 "以此定谥，告成礼典"
 WJ_rf_shihao.double:0 "再议一字，合成谥号"
 WJ_rf_shihao.custom:0 "另拟谥号"
 WJ_rf_shihao.granted_tt:0 "所议谥号已授予辞世的先君，公王身份不变。"
