l_simp_chinese:
 hd_liu_bei_rise.0100.t:0 "黄旗遍野"
 hd_liu_bei_rise.0100.desc:0 "急报里的地名一个接着一个，黄旗所至，官军与乱众已经交兵。报信的人说到逃难百姓，抬袖擦了擦脸，再开口时嗓子都哑了。\n\n我让他坐下饮水，自己又看了一遍军报。这些州县有的近，有的远，可谁不是为了保住妻儿才踏上那条路？若今日只因兵少便收起旗号，往后又拿什么向愿意跟随我的人开口？\n\n帐外有人问将往何处。我望向那些等候的面孔，忽然觉得这一句话比平日更重。愿去救人，也须带着眼前这些人一道去。"
 hd_liu_bei_rise.0100.a:0 "率部助汉军，讨平黄巾。"
 hd_liu_bei_rise.0100.b:0 "这一回不参战，先顾好部众。"
 hd_liu_bei_rise.0200.t:0 "关东义旗"
 hd_liu_bei_rise.0200.desc:0 "关东诸侯起兵讨董的消息到了。来人谈起盟书上的名号，指着各家旌旗说得兴起，问到我的旗号时，却一时停了口。\n\n我不在那些诸侯的席位之中，麾下兵众也不能与大军相比。然而董卓挟制朝廷，远近皆知；若只因无人将我列入盟书，便认定此事与我无关，往日所言又值几何？\n\n我把军情听完，命人查点行装。可以随讨董诸军作战，也可以就此回绝。无论如何，部众仍由我领着，他们要听的，是我自己的决定。"
 hd_liu_bei_rise.0200.a:0 "不必列名会盟，我也愿出兵讨董。"
 hd_liu_bei_rise.0200.b:0 "这次讨董，我不参加。"
 hd_liu_bei_rise.0300.t:0 "一封故人书"
 hd_liu_bei_rise.0300.desc:0 "“刘玄德如今在何处？”讨董诸军散去一月，我翻到他的消息，便将书吏叫住。别人都在数自己带回多少兵粮，我倒想知道这位旧日同窗又落脚在哪里。\n\n玄德说起志向时，总比手中的兵多些底气。这未必是坏事，只是乱世里光有一口气，也撑不起一座营。我这里若多一个肯相助的人，南面的军务便也多一分照应。\n\n我让书吏取来新牍，措辞却不必像召属吏那样生硬。既邀故人，就把结盟之意写明；他若仍带着营众奔走，这里也容得下。"
 hd_liu_bei_rise.0300.a:0 "请玄德来共事，营众亦可安顿。"
 hd_liu_bei_rise.0300.b:0 "暂不相邀，仍各自经营。"
 hd_liu_bei_rise.0301.t:0 "伯圭来书"
 hd_liu_bei_rise.0301.desc:0 "“伯圭兄仍记着我。”我读到信中那句相邀，嘴角已先松开。使者随后说起结盟，又说若我还带着营众奔走，可到公孙瓒治所驻扎。\n\n我请他坐近些，问起故人近况。一路辗转，听惯了量我兵少、嫌我名轻的话，这封信倒没有先问我能带去多少。可一旦相许，便不能只把那里当作借宿之处；伯圭有事，我也须尽自己的力。\n\n信纸在手中微微卷起。我抚平边角，再望向使者。既是故人来问，回话便该出自我心，不能只叫他带走几句客套。"
 hd_liu_bei_rise.0301.a:0 "愿与伯圭相助；营众亦可北上。"
 hd_liu_bei_rise.0301.b:0 "谢过伯圭，我另作打算。"
 hd_liu_bei_rise.0400.t:0 "相知子龙"
 hd_liu_bei_rise.0400.desc:0 "在公孙瓒境内停留这些日子，我渐渐熟悉了军中一些面孔。赵云便是其中一个：谈起兵事时不多炫耀，问到乡里与流民，却总肯多说几句。\n\n这日闲谈又落到从军的缘故。他说，人逢乱世，总盼能追随肯使百姓安顿下来的人。我本已起身，听见这句话，又坐回原处。这样的话并不难说，难的是说过以后，遇到利害还肯记得。\n\n他如今仍在伯圭麾下任事，我也无意立刻向故人索取一员将领。今日先得一位知心朋友，已经是难得的收获。"
 hd_liu_bei_rise.0400.a:0 "子龙之志，与我相合。"
 hd_liu_bei_rise.0410.t:0 "旧友叩门"
 hd_liu_bei_rise.0410.desc:0 "来人尚未报完姓名，我已从门边站起。赵云到了，行装随身，神色仍是初识时那样沉静。\n\n自从在伯圭处相交，我们便知道彼此想做什么，只是各有去处，不能一句相惜便改变所有安排。如今他已离开原来的处所，能够自行择主，才到我这里，问是否还愿与他同行。\n\n我看了看他带来的行装，原想说些郑重的礼聘之言，到了嘴边，却只问他一路可曾歇息。朋友愿将往后的路交来一道走，比许多慷慨的誓言都更重。"
 hd_liu_bei_rise.0410.a:0 "请子龙留下，与我共事。"
 hd_liu_bei_rise.0500.t:0 "徐州城下的阴影"
 hd_liu_bei_rise.0500.desc:0 "曹操据有兖州，又把势力向邻州伸展。州府收到的军报一封紧似一封，徐州的城池与粮道，已不能只按平日的情形处置。\n\n我让人重查所领诸县的守备，坏损的城堞、空缺的戍卒，都在簿上列着。修备可以先做，外援却须有人肯来。刘玄德素有扶危之志，若遣使相邀，也许愿与我订盟，在徐州相助。\n\n案前同时摆着守城簿与尚未封好的书信。若仍不作安排，下一回听见的，便可能不是邻州的消息了。"
 hd_liu_bei_rise.0500.a:0 "修整所领城防，遣使邀刘备结盟。"
 hd_liu_bei_rise.0500.b:0 "维持现有部署，暂不相邀。"
 hd_liu_bei_rise.0501.t:0 "来自徐州的邀约"
 hd_liu_bei_rise.0501.desc:0 "陶谦的使者立在面前，衣上尘土未净，说起徐州守备时，却顾不得先讨一口水。“使君所望，正在玄德。”他说完，仍不肯坐。\n\n我伸手接过来书，又请他将州中情形说细些。那些地名落到耳中，想到的便不只是城池，还有城里尚不知大军将至的人。可我身后也有部众，也有人指望我替他们寻一条路。\n\n陶使君愿结盟相助；若我仍率营众漂泊，也愿接纳迁营。我将信合起。应下这声玄德，往后便要有真正能给出的援手，不能只让来人欢喜一程。"
 hd_liu_bei_rise.0501.a:0 "与陶使君结盟；营众可移往徐州。"
 hd_liu_bei_rise.0501.b:0 "此约我暂不能应，请据实回报。"
 hd_liu_bei_rise.0600.t:0 "麋氏的心意"
 hd_liu_bei_rise.0600.desc:0 "麋竺谈起相助，没有急着问我能给什么官位，倒先问我的部众如今怎样安顿。我答过，他才说起麋芳，又将话慢慢引到两家的婚姻上。\n\n我放下酒盏，向他郑重一揖。奔走以来，少有人肯将家门的打算也与我相连，这份心意不能轻看。只是人各有牵挂，麋氏兄弟能否离开原处，婚姻是否合宜，都要先说分明。\n\n子仲仍等着我的答话。人才我愿延请，情义我愿领受；至于是否进一步结亲，不能只因席间投契便替旁人定下一生。"
 hd_liu_bei_rise.0600.a:0 "延请麋氏相助；婚配合宜，亦愿结亲。"
 hd_liu_bei_rise.0600.b:0 "愿请二君相助，婚事不议。"
 hd_liu_bei_rise.0700.t:0 "病榻上的州印"
 hd_liu_bei_rise.0700.desc:0 "一叠待阅文书送到榻前，我看了许久，却连最上面一牍也没有展开。病势一日重似一日，州中大小事务，已不是凭一句强撑便能料理的。\n\n刘备如今就在徐州。若将我所掌的州郡与部众交付于他，或可免去临终之后仓促争夺。可这终究不是借一队兵、请一次援；一旦交出去，治下官吏往后听谁发令，便有了新的答案。\n\n我让人将州印放近些。家族自有家族的承继，徐州的军民，却需要一个还能坐在堂上决事的人。"
 hd_liu_bei_rise.0700.a:0 "请玄德接掌州郡，保全徐州。"
 hd_liu_bei_rise.0700.b:0 "不另行让州，仍依原来的承继安排。"
 hd_liu_bei_rise.0701.t:0 "托付徐州"
 hd_liu_bei_rise.0701.desc:0 "使者将陶谦的意思说了两遍，我仍没有伸手去接那份州郡簿籍。来徐州时所答应的是相助，谁知今日竟要接过陶使君肩上的整个重担。\n\n“此非虚让。”来人说得很轻，却把文书向前又推了一寸。我望见上面密密的县名，眼前仿佛便是城门、村舍，以及那些等着守军不再更换旗号的人。陶氏家业另有承继，交到我手里的，是这些州郡往后的安危。\n\n我起身走了两步，又回到案前。辞让容易，可陶使君病中还在等，徐州也总须有人担下。"
 hd_liu_bei_rise.0701.a:0 "我愿接掌州郡，不负所托。"
 hd_liu_bei_rise.0701.b:0 "此任太重，我不能接受。"
 HD_LIU_BEI_RISE_STORY_STATUS:0 "刘备崛起：黄巾从军、讨董、故人相邀、子龙与麋氏、徐州相托。各节点依人物和局势条件推进，不强制复活人物或夺取其既有领地。"
 hd_lb_xuzhou_prepared_defenses:0 "徐州整饬守备"
 hd_lb_xuzhou_prepared_defenses_desc:0 "经陶谦整修的城防与守备。"
 hd_lb_no_effect_tt:0 "不改变结盟、战争、头衔或营地；本次邀请不再重复。"
 hd_lb_yellow_join_tt:0 "加入当前仍在进行、且可以加入的黄巾战争防御方；不新建战争，不改变已加入的阵营。"
 hd_lb_dong_join_tt:0 "参加讨董战争的进攻方；若战争尚未开始，则在正式开战后加入。不会成为讨董联盟的正式成员。"
 hd_lb_gongsun_send_tt:0 "向刘备发送结盟与迁营邀请，由刘备决定是否接受。"
 hd_lb_gongsun_accept_tt:0 "与公孙瓒结盟；仍为冒险者时，将现有营地迁往他当前的首府，已有领地则不改变。正在旅行时，迁营延后至旅行结束后的检查。"
 hd_lb_zhao_friend_tt:0 "刘备与赵云成为好友；赵云仍留在公孙瓒宫廷，不在此事件中被强行调走。"
 hd_lb_zhao_join_tt:0 "仍为无地且能够自由行动的赵云加入刘备的宫廷或营地，不剥夺其已有领地。"
 hd_lb_tao_defense_tt:0 "陶谦实际控制的徐州法理伯爵领获得5年守备修正：堡垒等级+1、驻军规模+20%。同时邀请刘备。"
 hd_lb_tao_accept_tt:0 "与陶谦结盟；仍为冒险者时，迁营至其控制的徐州县城，已有领地则不改变。不因此加入其所有战争。"
 hd_lb_mi_visit_tt:0 "麋竺、麋芳在无地、未被囚禁且可行动时加入。优先选择麋氏作为婚配对象，否则从麋竺同一宗族选择合法的未婚成年女子；无合适对象则只投效、不结婚。"
 hd_lb_mi_recruit_only_tt:0 "只处理麋竺、麋芳投效，不安排婚姻。受旅行、囚禁或领地身份阻碍者，在条件允许后再投效。"
 hd_lb_bequest_tao_tt:0 "将陶谦当前持有的所有正常领土头衔及相应封臣移交刘备，排除世族与无地特殊头衔。交接完成后陶谦病逝。若刘备也是玩家，须由其另行接受。"
 hd_lb_bequest_liu_tt:0 "先移交并核对陶谦的全部正常领土头衔与封臣，保留世族头衔，再处理陶谦病逝。刘备成为有地统治者并使用天朝制。"
 hd_lb_bequest_decline_tt:0 "不转移任何头衔，不强制陶谦死亡，本次让徐州事件结束。"
