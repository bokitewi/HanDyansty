l_simp_chinese:
 hd_palace_crisis.0001.t:0 "宫廷阴影"
 hd_palace_crisis.0001.desc:0 "雒阳来的消息比军报还杂。何进与宦官相争，今日说已有定议，明日又说太后不许；每个传话的人，都先问我这里愿信哪一种说法。\n\n我把信交给左右再看，自己走到帐口。凉州兵卒照旧点校马具，京师宫门里的一次争执，于他们不过是很远的事；可若朝中真有人想借外兵分出胜负，这些人便会忽然成为最要紧的筹码。\n\n信中还没有正式召令。我不必先替任何一方表态，只须留意：争执的人何时不再靠口舌，而要把我的兵马写进他们的打算。"
 hd_palace_crisis.0001.a:0 "继续听取京中消息。"
 hd_palace_crisis.0002.t:0 "最终手段"
 hd_palace_crisis.0002.desc:0 "京中的争执终于有了新的办法。传来的消息说，袁绍劝何进召外兵入京，以兵势迫使宫中除去宦官；被提到的领兵之人，正有我。\n\n我将那几行字看了两遍。何进或许只想借一阵甲兵声，令久议不决的事落定，却未必想过，兵马一旦到了城下，便不会只是一封能够收回的奏书。\n\n左右询问是否立即行动，我摆手止住。消息终究不是诏命。粮秣可以先查，道路可以先问，但究竟以什么名义入京，还得等那份真正送到军前的文书。"
 hd_palace_crisis.0002.a:0 "留意召令，先把军中情形查清。"
 hd_palace_crisis.0003.t:0 "进京？"
 hd_palace_crisis.0003.desc:0 "召令终于到了。我展开文书，读到要我率军入京，便将那一处按住，让左右再听一遍。帐外一匹马嘶鸣起来，倒像比他们更早明白这是个好消息。\n\n朝里那些人争来争去，末了还是要借我的兵。有人问到了雒阳听谁节制，我抬眼看他；他赶忙改口，转问粮秣。兵都没有带到，倒先替别人想起如何约束我了。\n\n我卷起召令，敲了敲案沿。京师门槛再高，也总有请人进去的时候。如今文书在手，甲兵在侧，还有什么值得迟疑？"
 hd_palace_crisis.0003.a:0 "应召，准备率军赴京。"
 hd_palace_crisis.0004.t:0 "宫门合拢"
 hd_palace_crisis.0004.desc:0 "宫门在身后合拢时，我还以为只是照例清道。直到前方也有人拦住去路，我才发觉，方才随行的声音已经听不见了。\n\n宦官们不再像往日那样委婉说话。他们提到将至的外兵，提到我与袁绍的议论，语气里已没有等待分辩的余地。我喝问谁敢阻拦大将军，回答我的却是逼近的脚步与出鞘的刀。\n\n我伸手按住衣带，忽然想起那些仍在宫门外等候的人。他们看得见我的车马，却看不见此刻围上来的兵器。那封召外兵的文书，终究来不及替我打开这一扇门。"
 hd_palace_crisis.0004.a:0 "门外的兵马……为何还不来？"
 hd_palace_crisis.0005.t:0 "血染宫门"
 hd_palace_crisis.0005.desc:0 "何进被杀的消息传出宫门，方才还在等待的兵士顿时乱了。我率人闯入，禁门后的呼喝声与奔逃声混在一起，再没有谁肯停下来听完整的一道命令。\n\n宦官及其党羽已经被清剿，檐下与甬道间却仍留着血迹。我走过方才有人把守的门，才发现拔刀除去一群人，并不等于有人能够立刻接住朝廷的号令。\n\n城外又有董卓兵马逼近的消息。原先请外兵来，是为了迫使宫中退让；如今何进死了，宫门破了，接下来谁来向那支军队说明，它已经不必再进城？"
 hd_palace_crisis.0005.cao_desc:0 "袁绍已死，何进又在宫中遇害。消息一到，等待已成了最危险的事。我率兵冲进禁门，先前彼此探问的低语，转眼都变成了追逐与喝令。\n\n宦官及其党羽已经遭到清剿，我站在满地凌乱的宫道上，却找不到一个能将残局说清的人。有人求我继续搜捕，有人只想知道天子何在，还有人忙着分辩自己从未参与此事。\n\n董卓的兵马仍向雒阳逼近。宫里的仇敌虽已倒下，城外那封出自何进之手的召令，却不会随着他的死自动作废。"
 hd_palace_crisis.0005.dong_desc:0 "袁绍、曹操皆已身死，何进也遭宦官杀害。京中送来的急报先是求援，后来便成了各处兵士自行围捕的消息，连写信的人也说不清还有谁在主持朝局。\n\n我命人追究宦官及其党羽，清剿的结果很快报来。可这些名字从名册上划去以后，空出的宫门、失去节制的兵众，并没有因此恢复旧日的次序。\n\n我把军报收好，转而询问赴京的道路。既然召我来的人已死，宫里又无人收拾残局，这支军队入城以后该听谁发令，便不能仍照原来的想法处置。"
 hd_palace_crisis.0005.a:0 "清剿虽毕，残局未收。"
 hd_palace_crisis.0007.t:0 "凉州兵入雒"
 hd_palace_crisis.0007.desc:0 "雒阳城门就在前面，守卒望见旗号，先忙着报问，竟半晌没说清该向谁禀告。我听得不耐，将马往前催了一步。\n\n何进死了，宦官也遭了诛，满城的人倒像都在等另一个人先开口。朝廷用得着我的兵时，召令发得何等急；如今兵到了，却连一个肯出来料理事情的人也寻不见。\n\n我回头看过身后的行伍，叫前军依次入城。宫门要守，司隶的军政要有人掌着。既然旁人都只会互相张望，便让他们看清楚，往后该向谁回话。"
 hd_palace_crisis.0007.a:0 "进驻雒阳，接掌司隶军政。"
 hd_palace_crisis.0015.t:0 "废立"
 hd_palace_crisis.0015.desc:0 "入京以来，宫门守卫与司隶军政渐渐都照我的意思运转，殿上的名位却仍横在每一道命令之前。群臣谈论祖制时，眼睛总有意无意地转向御座。\n\n我将废立之议摆到他们面前。刘辩退位，另立刘协，写在诏书上不过数行；可这几行一旦落定，朝中那些尚存的迟疑与侥幸，便都须换一种说法。有人握紧了笏，有人垂首不语，等待我收回这番话。\n\n我没有收回。兵权已经握住，若连天子由谁来做都不能定，又谈什么总摄朝政？"
 hd_palace_crisis.0015.a:0 "废刘辩，立刘协。"
 hd_palace_crisis.0016.t:0 "公开对峙"
 hd_palace_crisis.0016.desc:0 "董卓将废立之议说出口，殿前竟有片刻无人答话。我看着那些避开目光的同僚，终于按剑向前，问他凭什么擅易天子。\n\n话已出口，便再不能装作只是一次寻常争论。董卓的兵在城中，我的愤怒却不能变成足以与他对峙的甲士。周围有人试图劝解，更多的人只盼我们不要当场拔刀。\n\n我退到殿外，才松开紧绷的手。留在这里，不过把性命交给他的迟疑；渤海尚可经营，何必将往后的大事，全压在这一场无援的争执上。"
 hd_palace_crisis.0016.a:0 "离开雒阳，往渤海立足。"
 hd_palace_crisis.0021.t:0 "并州旧部"
 hd_palace_crisis.0021.desc:0 "董卓的兵往前逼了几步，我身旁的吕布便迎上去。看着对面忽然迟下来的阵势，我冷笑一声：凉州兵敢在京师横行，也不是没有怕的人。\n\n奉先退回来时，我叫他留心营中，再将并州旧部收拢。城里近来尽传董卓如何封赏，又有何人夜里往来，听得人心烦。朝廷的事还未说清，倒先有人忙着替自己找门路。\n\n吕布应了一声，没有多言。我看了他一眼，仍将下一道军令交过去。有他在近旁，这场争执便还轮不到董卓说完就算。"
 hd_palace_crisis.0021.a:0 "奉先，营中诸事还须你用心。"
 hd_palace_crisis.0022.t:0 "近身之刃"
 hd_palace_crisis.0022.desc:0 "吕布进帐，我还当有新的军报，叫了一声奉先，让他近前。他却没有行礼，手始终按在兵器上。\n\n“你这是何意？”我说完才站起来。他提到董卓，提到新的去处，那语气竟像在回一桩已经办好的军务。我猛地望向帐口，熟悉的营声仍在，却没有人进来。\n\n昨日他还替我挡住董卓，今日这柄兵器便对着我。我伸手去按佩剑，怒意已将余下的话堵在喉中。奉先——我叫他留心营中，竟是将自己的命也交到了他手里！"
 hd_palace_crisis.0022.a:0 "奉先，你竟要向我动手？"
 hd_palace_crisis.0023.t:0 "迁都的怒火"
 hd_palace_crisis.0023.desc:0 "关东诸军已经举兵，讨董檄文也传到了雒阳。那些先前各守州郡的人，如今将我的名字写在同一纸罪状上，倒比朝中群臣说得齐整。\n\n左右劝我西迁长安，凭关中险固再作打算。我将来报掷在案上，殿下顿时没了声音。舍下雒阳固然可恨，留在这里等诸军逼近，却更不合我的心意。\n\n宫室、府库、军民的迁徙，都得随这道命令一起动起来。我看着地图上通往关中的道路，终于叫人近前：既然要走，便不能给追来的人留下一个从容接手的京师。"
 hd_palace_crisis.0023.a:0 "迁往长安，撤去雒阳旧有根基。"


