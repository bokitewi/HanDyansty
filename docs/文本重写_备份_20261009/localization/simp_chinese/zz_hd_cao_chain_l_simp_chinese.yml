l_simp_chinese:
 hd_cao_chain.0001.t:0 "宫门血迹"
 hd_cao_chain.0001.desc:0 "伍浮行刺董卓未成，已遭处决。消息送来时，旁人先看了看门外，才把声音压低，仿佛提到那把刀，也会招来杀身之祸。\n\n我听着行刺的经过，手指停在案沿。满朝不乏痛骂董卓的人，真正走到他面前的，却已成了众人不敢多谈的一具尸首。伍浮没能杀他，反使他更有理由把兵士布在宫门，把猜忌加在每一个近身之人身上。\n\n若只肯等别人先动手，我们大概还能这样低声议论许多年。只是到了那时，朝廷里还能剩下谁？"
 hd_cao_chain.0001.a:0 "记住伍浮，也记住他如何失败。"
 hd_cao_chain.0002.t:0 "满座泪痕"
 hd_cao_chain.0002.desc:0 "伍浮死后，朝中的议论越发小心。王允借宴饮聚起旧臣，门一关，席间便有人垂下头，继而掩袖失声。酒还没喝几口，哭声已压过了说话声。\n\n我听他们数落董卓的罪行：哪一人被逐，哪一事被夺，天子如何受制。说到后来，众人只剩一句汉室将亡，仿佛把悲痛说得足够真切，便算尽了臣子的本分。\n\n一声笑从我口中漏了出来。几双带泪的眼睛转向我，王允也收住了话。满座终于不再哭了，却都在等我解释，为何还能笑得出来。"
 hd_cao_chain.0002.a:0 "哭到明日，董卓也不会因此死去。"
 hd_cao_chain.0003.t:0 "借刀"
 hd_cao_chain.0003.desc:0 "那场宴后，王允没有忘记我的笑声。再议除董之事时，他先屏退左右，问我当日所言，究竟是一时激愤，还是已有打算。\n\n“哭不能除贼，刀或许能。”我将话说得很慢。董卓尚许我近身，旁人踏不过的门槛，我还有机会走进去。王允久久不答，末了才取出七星宝刀，放到我们之间。\n\n我握住刀柄，稍稍抽开，冷光便照在指节上。借刀容易，真正拔出它时，却没有满座公卿替我担险。这一回，我得自己走到董卓面前。"
 hd_cao_chain.0003.a:0 "刀已在手，余下的事交给我。"
 hd_cao_chain.0004.t:0 "镜中寒光"
 hd_cao_chain.0004.desc:0 "七星刀藏在身侧，隔着衣料仍能觉出刀鞘的棱。我走近董卓，等他的目光移开，才缓缓握住刀柄。\n\n偏在刀锋出鞘时，铜镜里闪过一点亮光。董卓猛然回首，问我持刀何为。我来不及再想，将刀横捧，俯身称是特来进献的宝物。那道目光仍在我背上停着；多站片刻，方才的借口便未必经得起追问。\n\n我终于退到门外，掌心已经湿透。除贼的打算落了空，下一道传召却绝不能再接。如今唯一要紧的，是在追骑出城以前走得足够远。"
 hd_cao_chain.0004.a:0 "不能再留，立即脱身！"
 hd_cao_chain.0006.t:0 "途中旧血"
 hd_cao_chain.0006.desc:0 "莱芜的屋舍安顿妥当，门外终于不再有追骑的动静。我解下佩剑，才发现自己仍在听每一个经过门前的脚步。\n\n吕伯奢家的血也跟着我到了这里。说客与流言各有一套说法，仿佛只要替我定下善恶，便能把那一夜重新过一遍。我却记得刀落下时，自己并没有他们说得那么从容。\n\n灯火将剑影投在案上。我伸手把它转开，叫门外的人进来。有人还肯追随，有人已等着看我如何败亡；这时候停下来向每个人分辩，倒真要遂了他们的愿。"
 hd_cao_chain.0006.a:0 "既已走到这里，便不能再回头。"
 hd_cao_chain.0094.t:0 "莱芜整众"
 hd_cao_chain.0094.desc:0 "莱芜城外又添了营帐。宗族与旧部的消息陆续送来，能够相从的人各携部曲家资，不能亲至的，也遣人探问军中所缺。几日前还得提防沿途追骑，如今已有人等我发令。\n\n粮资与丹阳兵众的名册送到案前，我逐项看过，才将它压在舆图一角。立足之地既有，接下来要做的便不只是躲过董卓的追索。散在四方的愤怒，总须有人把它变成军令、粮道和肯向前走的队伍。\n\n我命营中重新列伍。天下未定，曹氏不能只做一个暂且有处栖身的逃亡之家。"
 hd_cao_chain.0094.a:0 "以莱芜为基，整军待发。"
 hd_cao_chenliu_danyang_army:0 "陈留丹阳精兵"
