 wj_temp_official_kaoke_decision_desc:0 "你以假吏身份试守已满一年，可以向吏部陈报任内簿书与治绩，接受三轮能力考课。考课以管理能力为主；四十分及格。通过时按当前最高非家族官职定其出身：男爵、伯爵级授举孝廉，公国级及以上授举茂才。"
 wj_temp_official_kaoke_decision_tooltip:0 "参加假吏考课，以当前官职等级确定正式入仕途径"

