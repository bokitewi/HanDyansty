 trait_character_interloper_of_zhou_dynasty:0 "攪乱者"
 trait_character_interloper_of_zhou_dynasty_desc:0 "あなたは周室の党に属さず、いずれの側にも立とうとせず、もっぱら情勢をかき乱して漁夫の利を得ることを得意とする。"
 trait_character_involve_neutral_of_zhou_dynasty:0 "中立派"
 trait_character_involve_neutral_of_zhou_dynasty_desc:0 "あなたは不偏不党で、周室の争いの中で独り身を保つ。誰が勝とうが負けようが、あなたにはさしたる関わりはない。"
 trait_character_involve_opponents_of_zhou_dynasty:0 "覇道派"
 trait_character_involve_opponents_of_zhou_dynasty_desc:0 "あなたは周室にかねてから服さず、天子を虚名とみなし、これに対抗することを誓っている。"
 trait_character_involve_supporters_of_zhou_dynasty:0 "王道派"
 trait_character_involve_supporters_of_zhou_dynasty_desc:0 "あなたは周室の正統を重んじ、進んで天子の擁護者となり、尊王攘夷を掲げて背くことはない。"
 trait_tk_fictional_character01:0 "架空人物（一）"
 trait_tk_fictional_character01_desc:0 "この人物は演義小説に由来し、その人となりや事績の多くは後世の人々によって脚色されている。"
 trait_tk_fictional_character02:0 "架空人物（二）"
 trait_tk_fictional_character02_desc:0 "この人物は戯曲や講談に由来し、その姿は語り手と聴衆によって共に彩られてきた。"
 trait_tk_historical_character01:0 "歴史人物（一）"
 trait_tk_historical_character01_desc:0 "この人物の原型は史書に見え、その生涯は史料によって裏付けられる。"
 trait_tk_historical_character02:0 "歴史人物（二）"
 trait_tk_historical_character02_desc:0 "この人物の原型は史書に見え、その事績は世に伝わっている。"
 trait_tk_historical_character03:0 "歴史人物（三）"
 trait_tk_historical_character03_desc:0 "この人物の原型は史書に見え、その名声は後世に残っている。"
