l_japanese:
 appoint_a_righteous_caliph_decision_mutazila_variant:0 "理に基づき正統なカリフを立てる"
 appoint_a_righteous_caliph_decision_mutazila_variant_desc:0 "教団の首長は民衆から遠く、教義にも明るくなく、ウンマを率いるに足りない。理性の道に従えば、カリフは賢者が務めるべきである。私は真に是非を見分けられる正統なカリフを別に立てねばならない。"
 cancel:0 "キャンセル"
 childhood.2200.desc:0 "[educator.GetNameNoTooltip]の傍らに付き従っていたあなたは、ふと[educator.GetSheHe]の口にする言葉が宮廷の人々のそれとまったく同じであることに気づいた。よく耳を傾けると、なんとなく少しは分かる気がする。努力すれば、この宮廷の言葉を本当に身につけられるかもしれない。"
 create_dar_al_islam_decision_tooltip:0 "諸派を統合してダール・アル＝イスラームを建て、それをあなたの[primary_title|E]とする"
 demand_faction_switch_bribe_large_desc:0 "莫大な金を贈り、他の派閥へ鞍替えするよう説得する。"
 demand_faction_switch_bribe_medium_desc:0 "相当な額の金品で報い、他の派閥へ鞍替えするよう説得する。"
 demand_faction_switch_bribe_small_desc:0 "わずかな金品で報い、他の派閥へ鞍替えするよう説得する。"
 demand_faction_switch_force_desc:0 "威圧をもって迫り、他の派閥へ鞍替えさせる。"
 demand_faction_switch_hook_desc:0 "手中の弱みを盾に脅し、他の派閥へ鞍替えさせる。"
 fp3_name_read_in_friday_prayer_decision:0 "金曜礼拝での名の読み上げ"
 fp3_name_read_in_friday_prayer_decision_desc:0 "金曜礼拝の場で誰の名を読み上げるかこそ、私の立場を最もよく示すものである。私は衆人の前で、誰を正統と奉ずるのかを明言せねばならない。"
 fp3_promote_persian_scripture_decision:0 "ペルシア語経典を推進する"
 fund_inspiration.0051.burma:0 "ビルマへ向かえ！"
 hd_debug_prepare_youzhou_tuqi_decision_confirm:0 "直ちに編制せよ！"
 hd_debug_train_xianzhenying_decision_confirm:0 "直ちに訓練せよ！"
 hd_leave_defensive_league_decision_confirm:0 "これにてお別れだ！"
 hd_unify_defensive_league_decision_confirm:0 "一つにまとまれ！"
 liberty_war_victory_defender_desc_admin:0 "あなたの[defender.Custom('GetGovernmentAuthority')]は一段階下がり、[liberty_faction|E]の各構成員に[favor|E]を1つずつ借りることになる。"
 liberty_war_victory_defender_desc_tribal:0 "部族内でのあなたの[defender.Custom('GetGovernmentAuthority')]は一段階下がり、部衆の心は離れ、[liberty_faction|E]の各構成員に[favor|E]を1つずつ借りることになる。"
 liberty_war_victory_desc_admin:0 "[defender.GetPrimaryTitle.GetName]の[defender.Custom('GetGovernmentAuthority')]は一段階下がり、[defender.GetShortUIName]は[liberty_faction|E]の各構成員に[favor|E]を1つずつ借りることになる。"
 liberty_war_victory_desc_tribal:0 "[defender.GetPrimaryTitle.GetName]の部族内の[defender.Custom('GetGovernmentAuthority')]は一段階下がり、[defender.GetShortUIName]は[liberty_faction|E]の各構成員に[favor|E]を1つずつ借りることになる。"
 petition_ceremonial_liege_decision_tooltip:0 "あなたの[ceremonial_liege|E]に陳情する"
 religious_interaction.1021:0 "教団の長老たちは、あなたを[actor.GetFaith.GetAdjective]の信仰から追放することを決議した。以後、教団の祭儀に加わることは許されない。[actor.GetFaith.HighGodName]があなたの魂を憐れまんことを。"
 struggle_persia_ending_assertion_decision:0 "カリフ国を再興する"
 struggle_persia_ending_assertion_decision_tooltip:0 "正統なカリフを守り、ウンマの敵を塵の中に踏みにじらねばならない。"
 struggle_persia_ending_foundation_decision:0 "アッバースの屈辱"
 struggle_persia_ending_foundation_decision_tooltip:0 "旧きカリフ国は時と忍耐を使い果たした。ウンマは安定と新たな指導者を求めている。"
 struggle_persia_ending_rekindle_iran_decision:0 "ペルシアの復興"
 struggle_persia_ending_rekindle_iran_decision_tooltip:0 "ペルシアの諸民族は長らく異邦人に隷属してきた。彼らにペルシアの力を思い出させねばならない。"
 submit_to_the_great_khan_decision_desc:0 "我が国土は灰燼に帰し、民は白骨となり、我が身も千々に切り刻まれるであろう……天下を征した大ハーンに命乞いをする以外に、もはや道はない。"
 trait_SanGong_GongWei_1:0 "皇后"
 trait_SanGong_Sizi:0 "嗣子"
