l_english:
 WJ_ab.1.desc:0 "The Son of Heaven's envoy brings an edict: the imperial throne is no family's private possession. With the hopes of all now turning to me, the emperor offers to entrust me with rule over the realm. The assembled officials hold their breath; the seal and ribbon lie within reach on the desk.\n\nThis is edict number [ROOT.Char.MakeScope.Var('wj_ab_round').GetValue|0]. I have already declined [ROOT.Char.MakeScope.Var('wj_ab_declines').GetValue|0] times."
 WJ_ab.1.t:0 "The Edict of Abdication"
 WJ_ab.2.desc:0 "The edict has arrived, but a close adviser speaks up: the realm will judge the new dynasty by today's transfer of power. To accept at the first word may invite accusations of haste to seize the throne. Better to submit another memorial declining it, so the officials know Your Majesty does not covet the Son of Heaven's exalted position."
 WJ_ab.2.t:0 "The Rites Must Be Observed"
 WJ_ab.3.desc:0 "Three edicts, three refusals. The assembled officials bow once more and urge me to ascend: the rites of transfer are complete, and the realm must not be kept waiting any longer. They ask me to take the imperial throne, honor the ancestral temples, and settle the realm name."
 WJ_ab.3.t:0 "Three Refusals Complete"
 WJ_ab.4.desc:0 "Imperial rule has been transferred, and the existing provinces, commanderies, and subjects have passed with it to the new dynasty. The former emperor's relatives and old courtiers will not be relocated separately. We must now settle the former emperor's nominal title and stipend estate to complete the rites of transfer; once the arrangements are complete, the temporary protection granted during the abdication will be removed."
 WJ_ab.4.t:0 "Provide for the Former Emperor"
 WJ_ab.accept:0 "Accept the edict and assume imperial rule."
 WJ_ab.accept_advice:0 "Sound advice. Submit another memorial declining."
 WJ_ab.decline:0 "My virtue is slight; I dare not accept this burden."
 WJ_ab.early_accept_tt:0 "Accepting the abdication at the first edict costs 2000 Legitimacy; accepting at the second costs 1000. Base Legitimacy is 1000, with another 1000 added for each actual refusal. All of this is settled together only after the imperial throne is successfully transferred."
 WJ_ab.final_accept:0 "Reverently accept the edict and announce it to Heaven and Earth."
 WJ_ab.insist:0 "The realm cannot long lack a ruler. No further refusal."
 WJ_ab.place_commandery:0 "Grant a commandery dukedom, named for a commandery."
 WJ_ab.place_king:0 "Grant a royal title, named for a commandery."
 WJ_ab.place_village:0 "Grant a village dukedom, with a village or hamlet as its stipend estate."
 WJ_ab_fief_country_name:0 "[ROOT.Char.MakeScope.Var('wj_ab_country_stem').Title.Custom('WJ_rf_title_stem')]"
 WJ_ab_new_country_name:0 "[ROOT.Char.Custom('WJ_ab_country_name')]"
 WJ_ab_other_country_name:0 "[ROOT.Char.MakeScope.Var('wj_ab_country_stem').Title.GetBaseNameNoTierNoTooltip]"
 WJ_cr.1.a:0 "Consult the old precedents and complete the ceremonial procedures."
 WJ_cr.1.b:0 "Cut needless expense, but preserve the essential rites."
 WJ_cr.1.desc:0 "The ritual officials lay the ceremonial procedures of past dynasties before me, while my subjects' carriages arrive in the capital one after another. These accession rites are more than a hurried change of title: the order of the court audience, the rules governing seals and ribbons, and the duties of subjects must all be made clear to those present.\n\nI order the procedures checked. We may weigh simplicity against elaboration, but the presentation of the seal and the proclamation cannot be omitted."
 WJ_cr.1.t:0 "Prepare the Rites"
 WJ_cr.2.a:0 "Proclaim the accession throughout the realm and receive congratulations at court."
 WJ_cr.2.desc.accession:0 "I already hold the imperial throne. Today's rites announce the accession at the ancestral temple, present the seal, and open the court audience. The ritual officials finish reading the accession document, and my subjects enter the hall in order of rank.\n\nI look toward the throne and the officials below it. This exalted seat bears more than seals and ceremonial robes: it bears the people of every province and commandery, and the affairs of state and war. The realm's reports and edicts will all converge here."
 WJ_cr.2.t:0 "Announce the Accession and Hold Court"
 # 2026-10-23 补全立誓流程
 WJ_cr.3.a:0 "Swear to Secure Alliances: keep good faith and win allied realms to my side."
 WJ_cr.3.b:0 "Swear to Ensure Peace: lay down arms and let the people rest."
 WJ_cr.3.c:0 "Offer counsel only, and swear no oath."
 WJ_cr.3.desc:0 "The rites complete, a banquet is laid out, and my subjects exchange congratulations across the tables. A new ruler hears many words of praise, but praise cannot be all I hear.\n\nI raise my cup to still the noise and tell everyone how I intend to govern. By the old rites, a new ruler may swear an oath before the assembled court here: to keep good faith and win allied realms, or to lay down arms and give the realm lasting peace. An oath carries a deadline, and one left unfulfilled will cost me the trust of the realm; if I am unsure, I may offer counsel alone and swear nothing. What I promise today must be put into practice tomorrow, rather than remain fine words spoken over a feast."
 WJ_cr.3.t:0 "Counsel at the Banquet"
 WJ_cr.4.a:0 "The rites are complete. Settle the realm name."
 WJ_cr.4.desc:0 "The accession document, presentation of the seal, court congratulations, and banquet are all complete. The ritual officials enter the completed rites into the official statutes, then present the candidates for the realm name.\n\nThe accession rites are now concluded; military posts granted by the former dynasty are removed as well."
 WJ_cr.4.t:0 "The Accession Rites Complete"
 # 2026-10-23 补全立誓流程
 WJ_cr_oath_on_complete_tt:0 "The oath is formally sworn on the day the accession rites are complete, and its deadline is counted from that day."
 WJ_cr.5.a:0 "Suspend the rites for now. We will reconsider another day."
 WJ_cr.5.desc:0 "Circumstances concerning the throne, the attendees, or the ceremony's host have changed, and the planned rites could not continue. The ritual officials put away the unused ceremonial procedures and send word of the suspension to the subjects.\n\nNo accession law is granted on this occasion, nor is the realm name changed because of it. The existing imperial title will not be removed merely because the rites were suspended. Once the conditions are met, the rites may be planned again."
 WJ_cr.5.t:0 "The Accession Rites Suspended"
 WJ_cr.6.a:0 "Order the officials to prepare the rites and await my subjects."
 WJ_cr.6.desc:0 "The imperial throne has been inherited. The ritual officials have been ordered to revise the ceremonial procedures and send invitations to the subjects. The capital will prepare a court hall, ritual vessels, and a banquet for the ceremony.\n\nThe subjects must still enter the city, and the accession documents must still be checked. This is only the beginning of preparations: the announcement at the ancestral temple, the court audience, and the banquet are not yet complete. The imperial title does not change because the preparations remain unfinished."
 WJ_cr.6.t:0 "Prepare and Announce the Ceremony"
 WJ_cr_native_king_stem:0 "[ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 WJ_kaoke_rules_summary:0 "Assessments assign a grade based on merits and faults in office, with results settled every five years; those rated Good or Excellent may choose one assessment reward.\n\nRead more: [wj_kaoke_grades|E], [wj_kaoke_rewards|E], [wj_kaoke_duties|E], and [wj_kaoke_cycle|E]."
 WJ_kaoke_trial_failed_grade:0 "Your probationary assessment is rated [ROOT.Char.Custom('WJKaokeGrade')]. The authorities consider your duties unfulfilled, have denied continued probation, and have arranged the handover under the appointment rules.\n"
 WJ_kaoke_trial_retired:0 "Your probationary assessment is Poor or Inferior. The authorities have ordered you to relinquish your local offices, which will pass to the previously appointed successor. Your gentry standing and existing noble titles remain unchanged; this departure does not count as reclusion and grants no additional retirement reward.\n"
 WJ_qingyi.4101.a:0 "Clarify names and realities before reaching a judgment."
 WJ_qingyi.4101.b:0 "First share this insight with everyone."
 WJ_qingyi.4101.desc:0 "Even after a round of debate, everyone at the gathering still holds to a different view. Some put names first, others reality; by the end of the argument, the subject itself has been pushed aside.\n\nAs I work through their claims again, I suddenly realize that the dispute may not lie in the reasoning itself. Beneath the same word, each person means a different thing. If I can make that distinction clear, today's gain will be more than a passing victory."
 WJ_qingyi.4101.t:0 "Between Names and Realities"
 WJ_qingyi.4102.a:0 "Set aside rival schools and draw on their strengths."
 WJ_qingyi.4102.b:0 "Record the schools' arguments for later study."
 WJ_qingyi.4102.desc:0 "The two schools' arguments clash head on, and almost no one at the gathering is willing to yield. I had already formed an opinion myself, but as I listen, I notice that each school's strengths can make up for the other's shortcomings.\n\nTo win applause from the whole gathering, I need only refute one side. To make real progress, I must set aside allegiance to a school and examine both arguments closely."
 WJ_qingyi.4102.t:0 "When Different Views Meet"
 WJ_qingyi.4103.a:0 "Study the passages closely and write an essay on this new interpretation."
 WJ_qingyi.4103.b:0 "Today has already taught me much. Let us talk at leisure."
 WJ_qingyi.4103.desc:0 "A passage of the Classics that I have long known well reveals a different meaning in today's discussion. The old commentary still has its merits, but it cannot fully resolve the question before me.\n\nThe others gradually turn to different subjects, yet the new interpretation in my mind grows ever clearer. If I bring the surrounding chapters together afresh, perhaps I can write an argument that stands on its own."
 WJ_qingyi.4103.t:0 "A New Reading of the Classics"
 WJ_qingyi_yd_log_capacity:0 "The Monthly Appraisal awards reputation by final placement: nominees are Recognized by the Scholarly Community, finalists gain a Distinguished Reputation, and the winner is Foremost of the Age."
 WJ_rf_native_stem:0 "[ROOT.Char.MakeScope.Var('wj_rf_owned_title').Title.Custom('WJ_rf_title_stem')]"
 WJ_rf_promote_ineligible_desc:0 "The conditions for promotion to king are not yet met, so no edict could be issued.\n\nYou must hold a landed duchy and remain a subject of this dynasty; your highest liege must hold a hegemony and be a puppet under your control. The Supervisor of the Secretariat must be you, one of your current protégés, or a retainer directly under you, and the duchy's actual territory must contain at least one hundred counties.\n\nThese conditions are checked again when the title is actually granted. Merely bypassing the decision's entry restrictions will not establish a royal title directly. No titles were changed on this occasion."
 WJ_rf_title_county_name:0 "[ROOT.Title.MakeScope.Var('wj_rf_stem_capital').Title.GetNameNoTierNoTooltip]"
 WJ_trial_nominal_sponsor_notice:0 "\nThe document admitting you to office names [ROOT.Char.MakeScope.Var('wj_trial_nominal_sponsor').Char.GetFullNameNoTooltip] as your recommending sponsor. This is the formal signature after a completed assessment; it establishes no additional teacher-disciple agreement."
 WJ_yinshi.6001.a:0 "Cut the excess, fill the gaps, and make a work of my own."
 WJ_yinshi.6001.b:0 "First put my past studies in order. The book can wait."
 WJ_yinshi.6001.desc:0 "Years of notes have piled up on my desk: reflections on my reading, lessons from worldly successes and failures, and a few pages left unfinished halfway through. Now that I am far from government service, I finally have time to examine them one by one.\n\nA common thread gradually emerges among these seemingly scattered fragments. If I take the trouble to revise and fill the gaps, these unfinished pieces could become more than private notes: a work that later generations can consult and test for themselves."
 WJ_yinshi.6001.t:0 "From Fragments to a Book"
 WJ_yinshi.6002.a:0 "Judge impartially, without favoring those close to me."
 WJ_yinshi.6002.b:0 "First urge the two families to reconcile before the dispute grows."
 WJ_yinshi.6002.desc:0 "A dispute has broken out locally, and several elders come to my door asking for my judgment. Though I have long been out of office, they are willing to entrust me with a matter they cannot settle.\n\nIf I simply urge both sides to stop quarreling, the matter can be over today. If I establish the whole course of events and earn people's trust with an impartial judgment, perhaps the community will face fewer such troubles in future."
 WJ_yinshi.6002.t:0 "The Community Seeks a Judgment"
 WJ_yinshi.6003.a:0 "Teach them, and use their questions to examine my own understanding."
 WJ_yinshi.6003.b:0 "First talk through the young scholars' questions at leisure."
 WJ_yinshi.6003.desc:0 "Several young scholars have made their way here, hoping to hear me teach. Not all are quick to learn, yet their questions often strike at things I have never considered closely.\n\nHanding someone a scroll is easy; explaining its reasoning clearly means reexamining my own learning. I begin to understand that leaving an official career behind does not mean my studies must stop."
 WJ_yinshi.6003.t:0 "Teaching in the Mountains"
 cancel:0 "Cancel"
 childhood.2200.desc:0 "As you follow [educator.GetNameNoTooltip], you suddenly notice that [educator.GetSheHe] speaks just like everyone at court. Listening closely, you find you can almost understand some of it. With a little effort, perhaps you could truly learn this court language."
 fund_inspiration.0051.burma:0 "To Burma!"
 religious_interaction.1021:0 "The elders have decided to expel you from the [actor.GetFaith.GetAdjective] faith; henceforth, you may no longer attend its religious rites. May [actor.GetFaith.HighGodName] have mercy on your soul."
