 WJ_langguan_xuncha.0001.a:0 "整饬仪仗，巡视四境。"
 WJ_langguan_xuncha.0001.desc:0 "你率属吏出城巡察，沿途吏民夹道相迎。"
 WJ_langguan_xuncha.0001.t:0 "郎官出巡·巡察"
 WJ_langguan_xuncha.0002.a:0 "升堂问案，明断是非。"
 WJ_langguan_xuncha.0002.desc:0 "县衙里积案如山，吏民争讼不休。"
 WJ_langguan_xuncha.0002.t:0 "郎官出巡·断案"
 WJ_langguan_xuncha.0003.a:0 "访贫问苦，体察民情。"
 WJ_langguan_xuncha.0003.desc:0 "田间老农与市井商贩，各有苦乐。"
 WJ_langguan_xuncha.0003.t:0 "郎官出巡·问民情"
 WJ_langguan_xuncha.0100.a:0 "此番出巡，获益良多。"
 WJ_langguan_xuncha.0100.desc:0 "巡行数月，政事渐熟，贤望渐增。"
 WJ_langguan_xuncha.0100.t:0 "郎官出巡·返署"
 WJ_recommendation_reply.0001.a:0 "善，当为朝廷得一士。"
 WJ_recommendation_reply.0001.t:0 "孝廉察举之复"
 WJ_recommendation_reply.0002.a:0 "既不愿受举，本年名额仍在。"
 WJ_recommendation_reply.0002.desc:0 "明公推举孝廉的来书已经读过，盛意甚厚。只是此次尚不能应受，故郑重奉复，愿明公早知。\n\n写下辞谢二字并不容易，我也知道一份名额来之不易。可若先因感激而应下，再让举主为我的迟疑另费周折，终究更负今日相许。所拟举状，请暂不列我，另求适合之人。\n\n未能受举，仍感知遇。此书不是留待再劝的客套，只是眼下去留确已如此；愿明公不必为我空候，谨此奉告。"
 WJ_recommendation_reply.0002.t:0 "孝廉察举之复"
 WJ_recommendation_reply.0101.a:0 "谨谢知遇。"
 WJ_recommendation_reply.0101.t:0 "请求举孝廉之复"
 WJ_recommendation_reply.0102.a:0 "只得另候机缘。"
 WJ_recommendation_reply.0102.desc:0 "来请已经细看，但本年孝廉名额，不能据此授予[secondary_actor.Custom('WJ_GetLinkedUIName')]。回书说得直接，望勿以为慢待使者。\n\n受人请托，最容易先留一句转圜的话；可对方既把仕进寄望在此，我若迟迟不明告，便只使人空等。眼下我尚不能作这一份推许，故宁愿在举状未定之前说清。\n\n此次所请，请就此作罢。日后若有别的机缘，自可另论；今日这封回书，确为辞谢，并非已经暗许了名额。"
 WJ_recommendation_reply.0102.t:0 "请求举孝廉之复"
 WJ_recommendation_reply.0201.a:0 "此举当不负公论。"
 WJ_recommendation_reply.0201.desc:0 "蒙明公举为茂才，我愿应受。来书读罢，先前那些只在案头琢磨的事，忽然都像有了真正付诸一试的机会。\n\n平日论政可以说得从容，到了任事之时，才见学问有多少用处。我不敢只凭获荐便夸自己足以料理万端，但若因此一味辞让，也辜负明公今日推许。\n\n前议诸项，皆已明白，自当践约。谨先奉此书，以明应举之意。所承知遇，往后当以实际任事作答，不使明公所举止于一个好听的名字。"
 WJ_recommendation_reply.0201.t:0 "茂才察举之复"
 WJ_recommendation_reply.0202.a:0 "既如此，本年名额仍在。"
 WJ_recommendation_reply.0202.desc:0 "明公愿举茂才，来书已收，厚意不敢轻忘。只是此次实不能接受，故先奉书辞谢，不使举状仍为我留着空处。\n\n得人推许本是可喜之事，提笔回绝，也经过一番犹疑。然而眼下既不能定心承担，就不该先取名分，等以后再找理由说明。此事若使明公失望，亦是我所不愿。\n\n所议荐举，还请另择其人。愿使者将这份明确答复带回，免去徒劳往返；未能相从，却仍感念明公肯以此事相许。"
 WJ_recommendation_reply.0202.t:0 "茂才察举之复"
 WJ_recommendation_reply.0301.a:0 "谨谢举主。"
 WJ_recommendation_reply.0301.desc:0 "来请已阅，我愿以本年名额举[secondary_actor.Custom('WJ_GetLinkedUIName')]为茂才。此意已定，可据此办理，不必再候。\n\n荐人于朝，说到底是将自己的判断也交了出去。我肯作此推许，正是愿见受举者有施展之地；盼日后再闻其名，带来的不只是旧日才名，还有切实政绩。\n\n前议诸项，一并照约办理。请代传允举之意，也传我这一层期望。今日先替其开一扇门，往后能走多远，终究还须凭自己的脚步。"
 WJ_recommendation_reply.0301.t:0 "请求举茂才之复"
 WJ_recommendation_reply.0302.a:0 "只得另访举主。"
 WJ_recommendation_reply.0302.desc:0 "所请举茂才一事，我已考虑，今不能以本年名额举[secondary_actor.Custom('WJ_GetLinkedUIName')]，谨书明告。\n\n来人陈说恳切，我亦听过，只是尚不足以使我在荐书上落名。若先许一句“再议”，让诸位仍为此奔走，日后又不能兑现，反而更伤往来。既不能应允，便不敢借迟复来躲避辞谢。\n\n此次所议到此为止，请勿再为本年这份荐书等候。厚意仍领，去取也已说清；愿这封回书不再使人误会另有未明之许。"
 WJ_recommendation_reply.0302.t:0 "请求举茂才之复"
 wj_temp_official.1000.a:0 "逐项勾稽，直指数目相悖之处"
 wj_temp_official.1000.b:0 "依旧式复核，只呈确定无疑之误"
 wj_temp_official.1000.desc:0 "[scope:wj_assessment_examiner.Custom('WJ_GetLinkedUIName')]将一册计簿推到我面前，先不问治国之道，只让我看其中户口、田租与仓谷的数目。\n\n我翻过几处，发现前后有些地方并不相合。若逐项勾稽，或能指出刻意藏下的舛误，却也可能因判断失当，暴露自己平日任事的疏漏；若只依旧式复核，便少些出错的机会，也难望凭此取得出色评语。\n\n考官没有催促，案旁的笔却已经备好。这一轮要呈上的，是我真正看明白的东西，不能靠一段空泛的善政之言带过。"
 wj_temp_official.1000.t:0 "假吏考课：清核簿书"
 wj_temp_official.1001.a:0 "权衡缓急，提出一套可行章程"
 wj_temp_official.1001.b:0 "谨循常例，先赈后征"
 wj_temp_official.1001.desc:0 "计簿已经收走，考官随即换了一个问题：水旱之后，仓中粮食有限，来请赈贷的人却不少，地方豪强还想先得一份。我该怎样安排？\n\n方才面对的是写在簿上的数目，如今每一个先后都牵着不同的人。要另拟一套可行章程，便须顾到赈给、催科与治安之间的牵连；若谨守常例，虽较稳妥，也可能只得一个不出错的回答。\n\n我把已经到了嘴边的仁政二字收住。考官要听的不是我赞成善待百姓，而是粮食当真不足时，准备先做哪一件事。"
 wj_temp_official.1001.t:0 "假吏考课：临事处断"
 wj_temp_official.1002.a:0 "据实陈奏，并条列后续改弦之策"
 wj_temp_official.1002.b:0 "只答成例与已成之事，不作虚言"
 wj_temp_official.1002.desc:0 "簿书与治事的两问已过，[scope:wj_assessment_examiner.Custom('WJ_GetLinkedUIName')]却没有放下笔。“说说你自己，试守以来，哪件事办得最好，哪件最该改？”\n\n我原先准备的几句套话，忽然都不好出口了。前面尚可说别处的县邑、假设中的灾荒，这一问却连人名和经过都有据可查。讲得深些，或能见出本领；讲得不好，也可能把平日藏住的疏漏亲手递过去。\n\n我坐直身子，停了一息。是只循旧式答那些稳妥之事，还是把真正想过的改弦之策说出来？考官的笔尖仍悬着，等我第一句话。"
 wj_temp_official.1002.t:0 "假吏考课：吏部奏对"
 wj_temp_official.1005.a:0 "奉受课第，正式入仕"
 wj_temp_official.1005.b:0 "谨记所失，来年复考"
 wj_temp_official.1005.desc:0 "簿书、治事与最后的陈奏皆已结束。考官把几轮记录合在一处，又参看我平日的贤望，这才将课第交到面前。\n\n方才还能用言语补充的地方，如今都已留在记录里。我望着那份评定，等候对试守去留的最后说明。\n\n"
 wj_temp_official.1005.desc_fail:0 "未及合格。我先看见这几个字，才读清官职暂留、仍以假吏试守，来年再考。方才答得不稳的地方忽然全涌回来，可此时再说一遍，已没人替我记入课第了。"
 wj_temp_official.1005.desc_good:0 "课第列良，现任官职的入仕资格已获正式确认。我看到这里，先前悬着的心终于落下。评语还有可改之处，却不妨碍我将这份结果好好收起。"
 wj_temp_official.1005.desc_high:0 "课第列优，现任官职的入仕资格已获正式确认。我把“优”字看了两遍，才发现来人还等着收走簿册。那些考前反复斟酌的话，总算没有白费。"
 wj_temp_official.1005.desc_pass:0 "课第合格，现任官职的入仕资格已获正式确认。我沿着评语往下读，几处失当仍赫然在目，好在最后没有将我拦在门外。这次总算过了。"
 wj_temp_official.1005.t:0 "假吏考课：定课"

