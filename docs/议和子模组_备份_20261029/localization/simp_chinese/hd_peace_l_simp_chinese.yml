 hd_peace_all_clauses_valid_tt:0 "条款对象、金币、牲畜、人质、宣称、政体及交战领袖在签约时仍须有效；整片头衔仍须在你的等级之内且含有对方县份；战争目标不得与其他割地、整片头衔或释臣条款重叠。"
 hd_peace_entry_explanation:0 "普通战争均可使用“和约”页，无需达到100战争分，实际结果以签署条款为准。历史／任务剧情、派系及政治制度战争使用专用规则。"
 hd_peace_open_no_pending_tt:0 "没有等待对方答复的已发送和约。"
 hd_peace_open_leader_tt:0 "你是本场战争的进攻方或防守方领袖。"
 hd_peace_open_ordinary_tt:0 "本场战争允许协商和约。仅历史／任务剧情、派系及政治制度战争使用专用结算；其他战争打开和约页不要求100战争分。"
 hd_peace_scripted_settle:0 "按专用规则结算"
 hd_peace_scripted_settle_tt:0 "任一方达到100战争分数后，执行本场剧情战争的专用胜负结果。剧情事件也可以按既定条件提前结束战争。"
 hd_peace_objective_toggle:0 "加入／移除：实现进攻方战争目标"
 hd_peace_objective_tt:0 "仅进攻方可选，按本场宣战理由实现完整目标：独立、正式臣服、兑现宣称、目标领土转移，或下方列明的宝物移交、毁坏特殊建筑、迁徙安置。\n不得同时选择其他割地、整片头衔、释臣或朝贡条款。价格：[GetPlayer.MakeScope.ScriptValue('hd_peace_objective_price_value')|0]点，为完整条款价的五分之一；领土目标只计仍属对方的县，已被我方阵营占领的县再半价。总价超过100时不能强制签署。目标失效时须重新拟约。"
 hd_peace_objective_selected:0 "已列入完整战争目标，价格[GetPlayer.MakeScope.ScriptValue('hd_peace_objective_price_value')|0]点。受益人：[GetPlayer.MakeScope.Var('hd_peace_objective_claimant').Char.GetTitledFirstName]。本场涉及的目标头衔如下（非领土战争可为空）："
 hd_peace_event_objective:0 "\n• 承认进攻方在[hd_peace_event_war.GetName]中的完整战争目标。受益人：[hd_peace_event_proposer.MakeScope.Var('hd_peace_objective_claimant').Char.GetShortUIName]。价格：[hd_peace_event_proposer.MakeScope.ScriptValue('hd_peace_objective_price_value')|0]点。\n独立、臣服与宣称按对应关系或受益人处理；普通领土目标转移仍属敌方的目标县份；宝物、毁城及迁徙的特殊内容列在下方。"
 hd_peace_artifact_objective_details:0 "本场目标：将下列[GetPlayer.MakeScope.Var('hd_peace_objective_artifact_count').GetValue|0]件宝物移交给进攻方，共[GetPlayer.MakeScope.ScriptValue('hd_peace_objective_price_value')|0]点（完整条款价100点的五分之一）。普通宝物战争仅列符合个人或家族宣称条件的宝物；圣物战争仅列原宣战条件允许夺回的圣物。清单在拟约时固定，不夺取后来出现的其他宝物。"
 hd_peace_raze_objective_details:0 "本场目标：毁坏[GetPlayer.MakeScope.Var('hd_peace_objective_raze_province').GetProvince.GetName]的曼荼罗首都特殊建筑，共[GetPlayer.MakeScope.ScriptValue('hd_peace_objective_price_value')|0]点（完整条款价100点的五分之一）。同时解除守方与该建筑关联的神王身份及浴火重生修正；不摧毁其他建筑，不附送原战争威望或虔诚奖惩。"
 hd_peace_migration_objective_details:0 "本场目标：完成宣战时选定的迁徙，共[GetPlayer.MakeScope.ScriptValue('hd_peace_objective_price_value')|0]点（完整条款价100点的五分之一）。按原迁徙规则接收目的地头衔和直辖领地，处理旧领地与随迁封臣，并将首都、营地迁入新居地。保留迁徙后的控制度变化、冷却与安置流程，不附送原胜利声望。"
 hd_peace_event_artifact_objective:0 "\n宝物条款：移交拟约时列明的[hd_peace_event_proposer.MakeScope.Var('hd_peace_objective_artifact_count').GetValue|0]件宝物。将鼠标移至接受选项可查看逐件清单；失去宣称、易主到第三方或宝物消失都会使原提案失效。"
 hd_peace_event_raze_objective:0 "\n毁城条款：毁坏[hd_peace_event_proposer.MakeScope.Var('hd_peace_objective_raze_province').GetProvince.GetName]的曼荼罗首都特殊建筑，并解除与其关联的神王身份及浴火重生修正。其他建筑保留。"
 hd_peace_event_migration_objective:0 "\n迁徙条款：按本场宣战时选定的目的地与直辖领地完成迁徙，接收相关头衔、处理旧领地与随迁封臣，迁移首都和营地，并执行原迁徙后的控制度变化、冷却与安置流程。"
 hd_peace_relocation_objective_details:0 "本场目标：完成冒险征服并迁都，共[GetPlayer.MakeScope.ScriptValue('hd_peace_objective_price_value')|0]点（完整条款价100点的五分之一）。按对应战争规则接收目标头衔、迁入新领地并处理政体与臣属关系。瓦兰吉冒险和传说远征还会依原规则放弃、移交旧领地并安置随迁家族；无地冒险者入侵按原规则成为有地统治者，适用时履行与资助者的臣属约定。不会附送原胜利赏金、声望、特质或家族创建奖励。"
 hd_peace_event_relocation_objective:0 "\n冒险迁都条款：接收本场目标领地，迁都并按原规则处理政体与臣属关系。瓦兰吉冒险、传说远征包含放弃或移交旧领地及随迁家族安置；无地冒险者入侵包含成为有地统治者，适用时向资助者臣服。原胜利赏金、声望、特质及家族创建奖励不包含在条约中。"
 hd_peace_cb_result_desc:0 "普通战争仅执行和约列明条款；剧情战争按专用规则结算。"
 hd_peace_cb_invalidated_desc:0 "战争因宣战理由失效而结束，不签署和约，也不发放普通战争奖惩。"
 hd_peace_select_demand_titles:0 "索要头衔"
 hd_peace_cat_title_cost:0 "按县"
 hd_peace_demand_titles_tt:0 "索要整片法理头衔：取得对方在该公国、王国或帝国范围内持有的全部县份；头衔若由对方阵营持有，也一并移交。\n可选头衔最高与你的最高头衔同级；低于你等级的头衔价格减10%。数量不限。强制签署时，所取县份须全部属于宣战目标。"
 hd_peace_map_demand_titles_title:0 "对方割让整片头衔"
 hd_peace_title_picker_subtitle:0 "公国级及以上头衔，最高与你同级，数量不限。"
 hd_peace_title_picker_empty:0 "没有可索要的整片头衔。你须持有公国级及以上头衔，且对方在该法理头衔范围内持有县份。"
 hd_peace_title_picker_desc:0 "选择更大的头衔时，其中已选的县份和较小头衔会自动并入。"
 hd_peace_demand_title_row_tt:0 "索取#high [Title.GetName]#!：取得对方在此法理范围内持有的全部县份；该头衔若由对方阵营持有，一并移交。"
