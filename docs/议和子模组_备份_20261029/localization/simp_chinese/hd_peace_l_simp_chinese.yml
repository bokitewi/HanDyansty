 hd_peace_title_row_discount:0 "#P 低于你的等级·减10%#!"
 hd_peace_demand_title_price_tt:0 "#T [Title.GetNameNoTier]#!\n条款价格：#high [GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('county', Title.MakeScope).ScriptValue('hd_peace_demand_title_row_price_value')|0]#!点。\n按对方在此持有的[GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('county', Title.MakeScope).ScriptValue('hd_peace_demand_title_row_county_count_value')|0]个县逐县计价：发展度越高越贵，持有者首府另加价；已被我方阵营占领的县半价。头衔等级低于你的最高头衔时，总价再减10%。"
