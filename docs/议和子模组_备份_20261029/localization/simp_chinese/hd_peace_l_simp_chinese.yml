 hd_peace_summary_demand_titles:0 "我方取得整片头衔："
 hd_peace_summary_title_item:0 "• [Title.GetNameNoTooltip]（[GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('county', Title.MakeScope).ScriptValue('hd_peace_demand_title_row_county_count_value')|0]县）"
 hd_peace_county_holder_occupied:0 "持有者：[Title.GetHolder.GetUIName]·#P 我方已占领，半价#!"
 hd_peace_demand_county_price_tt:0 "#T [Title.GetNameNoTier]#!\n条款价格：#high [GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('county', Title.MakeScope).ScriptValue('hd_peace_demand_county_row_price_value')|0]#!点（基础[GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('county', Title.MakeScope).ScriptValue('hd_peace_demand_county_row_base_price_value')|0]点）。\n发展度越高，价格越高；持有者首府另加价。已被我方阵营占领的县半价；你持有公国级及以上头衔时，再减10%。"
