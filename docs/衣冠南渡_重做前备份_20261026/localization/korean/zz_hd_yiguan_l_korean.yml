 hd_yiguan_protest_opinion: "이치로 힘껏 다투다"
 hd_yiguan_south_contact_opinion: "남북 수교"
 hd_yiguan_favor_up_opinion: "지원을 받음"
 hd_yiguan_favor_down_opinion: "냉대를 받음"
 hd_yiguan_tuduan_opinion: "토단"
 hd_yiguan_beifu_split_opinion: "병권 분할"
 hd_yiguan_beifu_strip_opinion: "병권 박탈"
