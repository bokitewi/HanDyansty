l_korean:
 # 衣冠南渡（docs/衣冠南渡_设计草案.md）

 # ---------- 游戏规则 ----------
 rule_hd_yiguan_rule: "의관남도"
 setting_hd_yiguan_rule_on: "#high 활성화#!"
 setting_hd_yiguan_rule_on_desc: "북방이 호인의 손에 넘어간 뒤 천하는 의관남도의 국면에 들어서며, 중원 광복, 호인의 한화, 중원 함락 또는 남북 분치에 이를 때까지 이어집니다."
 setting_hd_yiguan_rule_off: "#high 비활성화#!"
 setting_hd_yiguan_rule_off_desc: "의관남도가 일어나지 않습니다."

 # ---------- 局势 ----------
 situation_type_hd_yiguan_nandu: "의관남도"
 situation_type_hd_yiguan_nandu_desc: "호족 기병이 남하하여 중원이 뒤흔들렸다. 북방의 세가 대족은 노인을 부축하고 아이를 이끌고 회수와 장강을 건너 강좌로 달아났다. 북방에 남은 한인들은 호인의 치하에서 굴욕을 참으며 살아남기를 도모하거나, 오벽에 의지해 스스로를 지키거나, 무리를 모아 의거했다.\n\n남방의 군주는 유민을 받아들이고 교치 주군을 세우며 북부군을 편성하고, 북방의 호인 군주는 탄압과 회유 사이를 오간다. 이 대이주는 결국 중원 광복, 호한 합류, 중원 함락 또는 남북 분치로 막을 내릴 것이다."
 situation_hd_yiguan_nandu: "$situation_type_hd_yiguan_nandu$"
 situation_hd_yiguan_nandu_desc: "[SITUATION.GetType.GetDesc]"

 hd_yiguan_phase_sangluan: "상란"
 hd_yiguan_phase_sangluan_desc: "호족 기병이 이르는 곳마다 성읍이 폐허가 된다. 북방의 사민들이 무리를 지어 남쪽으로 피란하니, 길에는 노인을 부축하고 아이를 이끈 유민들이 가득하다."
 hd_yiguan_nandu_hd_yiguan_phase_sangluan_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"
 hd_yiguan_nandu_hd_yiguan_phase_sangluan_situation_phase_desc: "$hd_yiguan_phase_sangluan_desc$"
 hd_yiguan_phase_nandu: "남도"
 hd_yiguan_phase_nandu_desc: "유민들이 차츰 강좌에 자리를 잡는다. 조정은 교치 주군을 세워 북방 사람들을 정착시키고, 남북의 사족이 같은 조정에서 함께 일하지만 때때로 마찰도 생긴다."
 hd_yiguan_nandu_hd_yiguan_phase_nandu_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"
 hd_yiguan_nandu_hd_yiguan_phase_nandu_situation_phase_desc: "$hd_yiguan_phase_nandu_desc$"
 hd_yiguan_phase_duizhi: "대치"
 hd_yiguan_phase_duizhi_desc: "남북이 회수와 장강을 사이에 두고 마주 보고 있다. 강남은 군사를 훈련하고 곡식을 쌓아 회복을 도모하고, 북방은 호인과 한인이 섞여 살며 의군이 때때로 일어난다. 천하의 귀속은 이후의 성패에 달려 있다."
 hd_yiguan_nandu_hd_yiguan_phase_duizhi_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"
 hd_yiguan_nandu_hd_yiguan_phase_duizhi_situation_phase_desc: "$hd_yiguan_phase_duizhi_desc$"

 hd_yiguan_sangluan_effects: "상란"
 hd_yiguan_nandu_effects: "남도"
 hd_yiguan_duizhi_effects: "대치"

 hd_yiguan_nandu_sub_region_hd_yiguan_north: "함락 지역"
 hd_yiguan_nandu_sub_region_hd_yiguan_north_desc: "북방 여러 주 가운데, 백성은 여전히 화하의 유민이지만 종주는 이미 호인인 [counties|E]"
 hd_yiguan_nandu_sub_region_hd_yiguan_south: "강좌"
 hd_yiguan_nandu_sub_region_hd_yiguan_south_desc: "형주와 양주"
 hd_yiguan_nandu_sub_region_hd_yiguan_front: "전선"
 hd_yiguan_nandu_sub_region_hd_yiguan_front_desc: "함락 지역과 접한 전선 군수의 영지"

 hd_yiguan_nandu_participant_group_hd_yiguan_south_lord: "남방 종주"
 hd_yiguan_nandu_participant_group_hd_yiguan_south_lord_desc: "영지가 강좌에 있는 왕국급 이상의 화하 독립 [rulers|E]"
 hd_yiguan_nandu_participant_group_hd_yiguan_front_duke: "전선 군수"
 hd_yiguan_nandu_participant_group_hd_yiguan_front_duke_desc: "영지가 함락 지역과 접한 공작급 화하 독립 [rulers|E]"
 hd_yiguan_nandu_participant_group_hd_yiguan_south_vassal: "남방 봉신"
 hd_yiguan_nandu_participant_group_hd_yiguan_south_vassal_desc: "남방 종주의 치하에 있으며 영지가 강좌에 있는 공작급 이상 [vassals|E]"
 hd_yiguan_nandu_participant_group_hd_yiguan_hu_lord: "호인 종주"
 hd_yiguan_nandu_participant_group_hd_yiguan_hu_lord_desc: "함락 지역에 영지를 가진 호인 독립 [rulers|E]"
 hd_yiguan_nandu_participant_group_hd_yiguan_han_vassal: "한인 봉신"
 hd_yiguan_nandu_participant_group_hd_yiguan_han_vassal_desc: "함락 지역 안의 화하 전통을 지닌 공작급 이상 [vassals|E]"
 hd_yiguan_nandu_hd_yiguan_south_lord: "의관남도: #weak 남방 종주#!"
 hd_yiguan_nandu_hd_yiguan_front_duke: "의관남도: #weak 전선 군수#!"
 hd_yiguan_nandu_hd_yiguan_south_vassal: "의관남도: #weak 남방 봉신#!"
 hd_yiguan_nandu_hd_yiguan_hu_lord: "의관남도: #weak 호인 종주#!"
 hd_yiguan_nandu_hd_yiguan_han_vassal: "의관남도: #weak 한인 봉신#!"

 # ---------- 修正 ----------
 hd_yiguan_nanlai_county_modifier: "남쪽으로 온 호구"
 hd_yiguan_nanlai_county_modifier_desc: "북방 유민이 노인을 부축하고 아이를 이끌고 찾아와, 황무지가 차츰 개간되고 호구가 날로 늘어납니다."
 hd_yiguan_nanlai_big_county_modifier: "남쪽으로 온 호구"
 hd_yiguan_nanlai_big_county_modifier_desc: "관선이 북방 사람들을 모두 실어 건네니, 한때 강가에 사람이 가득하고 묵은 밭이 모두 개간되었습니다."
 hd_yiguan_qiaojun_county_modifier: "교군"
 hd_yiguan_qiaojun_county_modifier_desc: "이곳에 북방의 군현을 교치하여 유민을 정착시키니, 호적은 따로 장부를 두고 부역은 가볍게 합니다."
 hd_yiguan_liusan_county_modifier: "호구 유산"
 hd_yiguan_liusan_county_modifier_desc: "백성이 서로 이끌고 남쪽으로 달아나 열 집 가운데 아홉 집이 비고 전답이 황폐해졌습니다."
 hd_yiguan_wubao_county_modifier: "오보"
 hd_yiguan_wubao_county_modifier_desc: "향리의 호족이 오벽을 쌓아 스스로를 지키고 일족끼리 모여 사니, 호족 기병이 범하기 어렵습니다."
 hd_yiguan_buqu_modifier: "유민 부곡"
 hd_yiguan_buqu_modifier_desc: "이 인물은 북쪽에서 온 유민을 거두어 부곡으로 편성하여 병력의 원천이 풍부합니다."
 hd_yiguan_fenzhi_modifier: "호한 분치"
 hd_yiguan_fenzhi_modifier_desc: "호인과 한인이 각기 관청을 두고 각자의 풍속을 따릅니다."
 hd_yiguan_zhuoyong_modifier: "한인 사인 등용"
 hd_yiguan_zhuoyong_modifier_desc: "이 인물은 한인 사족을 막부에 끌어들여 그들의 전장 제도에 대한 식견에 의지합니다."
 hd_yiguan_qiangya_modifier: "한인 강압"
 hd_yiguan_qiangya_modifier_desc: "이 인물은 엄한 형벌과 가혹한 법으로 한인을 탄압하니, 사람들이 모두 곁눈질합니다."
 hd_yiguan_beifu_commander_modifier: "북부 통수"
 hd_yiguan_beifu_commander_modifier_desc: "북부의 여러 장수가 명을 받아 군대를 정비하니, 정병이 날로 늘어납니다."
 hd_yiguan_beifu_yongbing_modifier: "북부의 병권 장악"
 hd_yiguan_beifu_yongbing_modifier_desc: "북부의 장수들이 대군을 손에 쥐고 있어, 조정의 호령이 경구에 미치기 어렵습니다."
 hd_yiguan_pianan_modifier: "강좌에 안주함"
 hd_yiguan_pianan_modifier_desc: "중원을 되찾을 수 없게 되자, 군신은 오직 강남에서 경내를 지키고 백성을 쉬게 하기만을 바랍니다."
 hd_yiguan_ruzhu_modifier: "중원 입주"
 hd_yiguan_ruzhu_modifier_desc: "이 인물은 중원의 옛 땅을 차지하여 명성과 위세가 멀리 퍼졌습니다."
 hd_yiguan_heliu_modifier: "호한 합류"
 hd_yiguan_heliu_modifier_desc: "호인과 한인 사이의 간극이 차츰 사라져 모두 같은 편호의 백성이 되었습니다."
 hd_yiguan_zhongxing_modifier: "중흥"
 hd_yiguan_zhongxing_modifier_desc: "왕사가 옛 도읍을 수복하니, 천하가 중흥의 군주를 우러러봅니다."
 hd_yiguan_beiding_modifier: "왕사의 북방 평정"
 hd_yiguan_beiding_modifier_desc: "이 인물은 중원 수복의 싸움에 참여하여 이름이 멀리 퍼졌습니다."
 hd_yiguan_fenzhi_south_modifier: "남북 분치"
 hd_yiguan_fenzhi_south_modifier_desc: "남북이 강을 사이에 두고 대치하며 각자의 경계를 지킵니다."
 hd_yiguan_fenzhi_north_modifier: "남북 분치"
 hd_yiguan_fenzhi_north_modifier_desc: "남북이 강을 사이에 두고 대치하며 각자의 경계를 지킵니다."

 # ---------- 好感 ----------
 hd_yiguan_chase_opinion: "유민 추포"
 hd_yiguan_kin_south_opinion: "남쪽으로 온 자제"
 hd_yiguan_persuade_opinion: "백성에게 귀부를 권함"
 hd_yiguan_report_opinion: "의군 고발"
