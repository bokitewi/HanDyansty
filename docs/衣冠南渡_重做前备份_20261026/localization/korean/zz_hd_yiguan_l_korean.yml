 hd_yiguan_rebel_ally_opinion: "역적에 가담"
 hd_yiguan_refused_opinion: "받아들이지 않은 데 대한 원한"

 # ---------- 兵种 ----------
 hd_yiguan_beifu: "북부병"
 hd_yiguan_beifu_flavor: "#F 경구와 광릉 일대의 북쪽에서 온 유민으로, 오랜 전장을 겪어 날래고 용맹하며 죽음을 두려워하지 않는다. 이들을 모아 병사로 삼고 북부라 부르니, 가는 곳마다 승리가 많았다.#!"
 hd_yiguan_uprising_army: "의군"
 hd_yiguan_liumin_army: "유민군"

 # ---------- 侨州 ----------

 # ---------- 宣战理由 ----------
 hd_yiguan_uprising_cb: "의군 봉기"
 HD_YIGUAN_UPRISING_WAR_NAME: "[ATTACKER.GetShortUIName]의 의거"
 hd_yiguan_uprising_victory_desc: "[attacker.GetShortUIName|U](이)가 다투던 군현을 차지하고 한 지방에 자립하여 [GetGovernment('celestial_government').GetName](으)로 바꿉니다."
 hd_yiguan_uprising_white_peace_desc: "의군이 군사를 거두고 각자 흩어집니다."
 hd_yiguan_uprising_defeat_desc: "의군이 무너져 흩어지고, 다투던 군현은 여전히 [defender.GetShortUIName]에게 귀속됩니다."
 hd_yiguan_guinan_cb: "주를 들어 남조에 귀부"
 HD_YIGUAN_GUINAN_WAR_NAME: "[ATTACKER.GetShortUIName]의 남조 귀부 전쟁"
 hd_yiguan_guinan_victory_desc: "[attacker.GetShortUIName|U](이)가 [defender.GetShortUIName]에게서 벗어나 주를 들어 남조에 귀부합니다."
 hd_yiguan_guinan_white_peace_desc: "양측이 군사를 거두고, [attacker.GetShortUIName](은)는 여전히 [defender.GetShortUIName](을)를 주군으로 받듭니다."
 hd_yiguan_guinan_defeat_desc: "[attacker.GetShortUIName|U]의 남조 귀부가 실패하여 위명이 땅에 떨어집니다."

 # ---------- 决定 ----------
 hd_yiguan_guinan_decision: "주를 들어 남조에 귀부"
 hd_yiguan_guinan_decision_desc: "호인의 통치는 날로 가혹해지고, 남방의 조정은 지척에 있다. 의기를 들고 남조의 군대와 남북에서 호응한다면, 나의 주군을 이끌고 화하로 돌아갈 수 있다."
 hd_yiguan_guinan_decision_tooltip: "거병하여 당신의 [liege|E]에게서 벗어나, 인접한 남방 종주에게 귀부한다"
 hd_yiguan_guinan_decision_confirm: "주를 들어 남조로 돌아가라!"
 hd_yiguan_guinan_decision_effect_tt: "거병하여 당신의 [liege|E]에게서 벗어나며, 인접한 남방 종주가 군사를 보내 지원합니다. #EMP 승리하면 남조를 받들게 됩니다.#!"
 hd_yiguan_guinan_border_tt: "당신의 영지가 남방 종주나 전선 군수와 접해 있어야 함"
 hd_yiguan_guinan_cd_tt: "최근에 주를 들어 남조에 귀부한 적이 없음"
 hd_yiguan_sinicization_decision: "$hd_dc_con_sinicization_decision$"
 hd_yiguan_sinicization_decision_desc: "$hd_dc_con_sinicization_decision_desc$"
 hd_yiguan_sinicization_decision_tooltip: "$hd_dc_con_sinicization_decision_tooltip$"
 hd_yiguan_sinicization_decision_confirm: "$hd_dc_con_sinicization_decision_confirm$"
 hd_yiguan_celestial_decision: "천조 제도 수립"
 hd_yiguan_celestial_decision_desc: "나의 왕조는 이미 복식과 성을 바꾸고 한제를 모두 시행했으니, 이제 중원의 전장 제도를 본떠 천조의 체제를 세울 때다."
 hd_yiguan_celestial_decision_tooltip: "[GetGovernment('celestial_government').GetName](으)로 전환"
 hd_yiguan_celestial_decision_confirm: "제도를 세우고 조정을 연다!"
 hd_yiguan_celestial_decision_effect_tt: "[GetGovernment('celestial_government').GetName](으)로 전환합니다."
 hd_yiguan_return_capital_decision: "옛 도읍으로 환도"
 hd_yiguan_return_capital_decision_desc: "옛 도읍을 되찾았고, 종묘와 능침은 모두 북방에 있다. 옛 도읍으로 돌아가야만 열조열종을 위로하고, 천하에 정삭이 어디에 있는지 알릴 수 있다."
 hd_yiguan_return_capital_decision_tooltip: "낙양 또는 장안으로 천도한다"
 hd_yiguan_return_capital_decision_confirm: "옛 도읍으로 돌아가라!"
 hd_yiguan_return_capital_hold_tt: "낙양 또는 장안을 직할해야 함"
 hd_yiguan_return_capital_already_tt: "당신의 도읍이 아직 낙양이나 장안에 있지 않음"

 # ---------- 通告 ----------
 hd_yiguan_toast_start: "북방이 호인에게 함락되어 의관 사족이 잇달아 남쪽으로 건너갔습니다."
 hd_yiguan_toast_phase2: "남쪽으로 온 유민들이 이미 강좌에 자리를 잡았습니다."
 hd_yiguan_toast_phase3: "남북이 강을 사이에 두고 대치하는 형세가 굳어졌습니다."
 hd_yiguan_toast_restored: "왕사가 중원을 수복하여 의관남도가 이로써 끝났습니다."
 hd_yiguan_toast_sinicized: "북방의 호인이 모두 한제를 시행하여 호인과 한인이 차츰 하나가 되었습니다."
 hd_yiguan_toast_lost: "중원이 모두 호인의 손에 들어가고, 강좌는 한구석에 안주하게 되었습니다."
 hd_yiguan_toast_partition: "남북 분치가 확정되었습니다."

 hd_yiguan.0001.t: "의관남도"
 hd_yiguan.0001.desc: "호족 기병이 중원을 짓밟았다는 소식이 한 통 또 한 통 도착한다. 북방의 성읍이 잇달아 함락되고, 호인의 군왕이 옛 궁궐에서 즉위하여 호를 칭했다. 세가 대족은 노인을 부축하고 아이를 이끌고 회수와 장강을 건너 남쪽으로 달아났고, 미처 떠나지 못한 이들은 호인의 치하에서 굴욕을 참으며 살아남기를 도모할 수밖에 없었다.\n\n나루터에는 남쪽으로 달아나는 수레와 말이 가득하고, 사족의 의관과 백성의 해진 솜옷이 한데 뒤섞였다. 천하의 중심이 조용히 남쪽으로 옮겨 가고 있다."
 hd_yiguan.0001.a: "천하는 어디로 향할 것인가?"
 hd_yiguan.0002.t: "자리 잡는 유민"
 hd_yiguan.0002.desc: "상란이 조금 가라앉자, 남쪽으로 온 유민들이 강좌에 자리를 잡았다. 조정은 그들을 위해 군현을 교치했고, 북방의 옛 가문들은 새 땅에서 문벌을 다시 세웠다. 남북의 사인들이 같은 조정에서 함께 일하지만, 때때로 마찰도 있다."
 hd_yiguan.0002.a: "우선 자리를 잡자."
 hd_yiguan.0003.t: "남북 대치"
 hd_yiguan.0003.desc: "이십여 년이 지나자 남북의 구도가 차츰 분명해졌다. 강남은 군사를 훈련하고 곡식을 쌓으며, 북방은 호인과 한인이 섞여 살고, 양측은 회수와 장강을 사이에 두고 마주 보고 있다. 북벌과 남침의 논의는 조정에서 한 번도 가라앉은 적이 없다."
 hd_yiguan.0003.a: "앞날은 아직 길다."
 hd_yiguan.0011.t: "중원 광복"
 hd_yiguan.0011.desc: "왕사가 북상하여 깃발이 다시 중원의 성 위에 꽂혔다. 강남에 떠돌며 살던 사족들은 멀리 고향 땅을 바라보며, 그 자리에서 목 놓아 우는 이가 적지 않았다. 의관남도의 세월은 이로써 마침표를 찍었다."
 hd_yiguan.0011.a: "옛 도읍이 다시 빛나리라!"
 hd_yiguan.0012.t: "호한 합류"
 hd_yiguan.0012.desc: "북방의 호인 군주가 복식과 성을 바꾸고 한제를 시행하니, 지난날 호인과 한인의 구별이 날로 흐려졌다. 남방의 사인들은 여전히 정삭이 자신들에게 있다고 자부하지만, 북방은 더 이상 그들의 기억 속에 있는 호인의 먼지 날리는 땅이 아니다."
 hd_yiguan.0012.a: "예악이 있는 곳이 곧 화하다."
 hd_yiguan.0013.t: "중원 함락"
 hd_yiguan.0013.desc: "북방에 남은 마지막 한인 거점들이 잇달아 함락되어, 중원이 모두 호인의 손에 들어갔다. 강좌의 군신은 마침내 북쪽으로 돌아갈 날이 아득하다는 것을 깨닫고, 강남에서 이 한 귀퉁이의 의관을 지킬 수밖에 없었다."
 hd_yiguan.0013.a: "신주가 가라앉으니, 탄식한들 무엇하리."
 hd_yiguan.0014.t: "남북 분치"
 hd_yiguan.0014.desc: "의관남도 이래로 이미 한 세기 반이 지났다. 남북 양측 모두 상대를 병탄할 힘이 없어, 강을 사이에 둔 분치가 일상이 되었다. 강남의 자제들은 이미 이곳에서 나고 자랐으며, 북방의 옛 꿈은 족보와 시부 속에만 남아 있다."
 hd_yiguan.0014.a: "남북이 각자 천명을 따른다."

 # ---------- 南方·难民 ----------
 hd_yiguan.1001.t: "낙양의 사녀"
 hd_yiguan.1001.desc: "성문 밖에 북쪽에서 온 수레와 말이 가득 서 있다. 앞장선 것은 북방 옛 가문의 자제 몇 사람으로, 의관은 이미 해졌으나 말씨에는 여전히 중주 명사의 기품이 묻어난다. 그들 뒤로는 가족과 부곡, 의탁한 소작인들이 끝이 보이지 않을 만큼 따르고 있다.\n\n그들은 당신에게 몸 붙일 땅을 청하며, 출사하여 힘쓰기도 원한다."
 hd_yiguan.1001.a: "명사를 초빙하고 그 가족을 안돈시킨다."
 hd_yiguan.1001.b: "그 부곡을 거두어 군대에 편입한다."
 hd_yiguan.1001.c: "성안에 남은 땅이 없으니 다른 곳으로 가 주시오."
 hd_yiguan.1002.t: "길 위의 유랑"
 hd_yiguan.1002.desc: "여름이 시작된 뒤로 북방의 유민이 무리 지어 잇달아 당신의 경내로 밀려들었다. 그들은 몸을 가릴 옷도 없이 굶주렸고, 도중에 길가에 쓰러져 죽은 노약자도 적지 않았다. 지방 관리의 문서는 한 통 한 통 더 급박해진다. 일찍 안치하지 않으면 변란이 일어날까 두렵다고."
 hd_yiguan.1002.a: "창고를 열어 곡식을 풀고 유민을 안정시킨다."
 hd_yiguan.1002.b: "그 가운데 장정을 골라 부곡으로 편성한다."
 hd_yiguan.1002.c: "관문을 닫고 스스로 지키며 유민을 받지 않는다."
 hd_yiguan.1003.t: "강북에서 건너기를 기다리는 이들"
 hd_yiguan.1003.desc: "장강 북쪽 기슭에 북쪽에서 온 난민이 대거 모여 있다. 나룻배는 적고 사람은 많아, 날마다 자리 하나를 다투다 물에 빠져 죽는 이가 있고, 건너편의 울음소리가 물 건너까지 들린다. 당신의 속료들은 관선을 더 보내 강을 건너게 하자고 건의하지만, 그것 또한 적지 않은 비용이다."
 hd_yiguan.1003.d: "관선을 모두 내어 북방 사람들을 실어 건넨다."
 hd_yiguan.1003.a: "창고를 열어 구휼하며 천천히 건넨다."
 hd_yiguan.1003.b: "그 가운데 장정을 골라 부곡으로 편성한다."
 hd_yiguan.1003.c: "강 방어가 중요하니 함부로 건너지 못하게 한다."

 # ---------- 南方·流民帅 ----------
 hd_yiguan.1101.t: "중류에서 노를 치다"
 hd_yiguan.1101.desc: "[hd_yiguan_shuai.GetName](이)가 수백 가의 고향 사람들을 이끌고 남쪽으로 와 당신에게 의탁했다. 이 사람은 북방에 있을 때부터 무리를 모아 스스로를 지키며 호족 기병을 여러 차례 꺾었다. 강을 건널 때는 강 한가운데서 노를 치며 맹세했다고 한다. 중원을 맑게 하지 못하고 다시 건너온다면 이 대강과 같으리라고.\n\n그는 북방으로 돌아갈 수 있도록 당신에게 병사와 군량을 청한다."
 hd_yiguan.1101.a: "변경의 현을 주어 전선을 지키게 한다."
 hd_yiguan.1101.b: "장수로 남겨 유민을 거느리게 한다."
 hd_yiguan.1101.c: "북벌을 지원하여 회복을 도모한다."
 hd_yiguan.1101.d: "이자는 다루기 어려우니 거절하는 편이 낫다."
 hd_yiguan.1102.t: "유민 종주"
 hd_yiguan.1102.desc: "[hd_yiguan_shuai.GetName](이)가 고향의 천여 가를 이끌고 남쪽으로 왔다. 그는 북방의 난리 속에서 무리에게 종주로 추대되었고, 기근 때에는 식량을 나누어 함께 먹었으니, 사람들은 그 은혜를 잊지 않고 죽음으로 따르기를 맹세했다. 이 사람은 신중하고 지모가 있어 유민을 안정시킬 줄도 알고, 각 방면을 조율할 줄도 안다."
 hd_yiguan.1102.a: "변경의 현을 주어 유민을 안정시키게 한다."
 hd_yiguan.1102.b: "장수로 남겨 그 부중을 거느리게 한다."
 hd_yiguan.1102.c: "북방으로 돌려보내 기회를 보아 회복하게 한다."
 hd_yiguan.1102.d: "경내에 받아들일 땅이 없다."
 hd_yiguan.1103.t: "교만한 병사와 사나운 장수"
 hd_yiguan.1103.desc: "[hd_yiguan_shuai.GetName](이)가 사나운 유민군 한 무리를 이끌고 당신의 경내에 왔다. 그의 부중은 대부분 북방에서 목숨을 내놓고 떠도는 무뢰배로 싸움은 흉포하나 군기는 극히 나쁘며, 도중에 이미 노략했다는 소문이 돌았다. 그 자신도 말투가 오만하고 요구하는 값이 적지 않다."
 hd_yiguan.1103.a: "현 하나를 주어 그 무리를 기미한다."
 hd_yiguan.1103.b: "휘하로 거두어 엄히 단속한다."
 hd_yiguan.1103.c: "북쪽으로 몰아내어 독으로 독을 친다."
 hd_yiguan.1103.d: "이 무리는 호랑이와 이리 같으니 결코 남겨 둘 수 없다."
 hd_yiguan_shuai_refuse_tt: "#EMP 이 사람은 원한을 품었다가 훗날 난을 일으킬 수 있습니다.#!"
 hd_yiguan.1111.t: "유민의 난"
 hd_yiguan.1111.desc: "지난날 당신이 문전박대했던 [hd_yiguan_shuai.GetName](이)가 이제 당신의 경내에서 무리를 모아 거병했다. 그가 당신이 북방 사람들을 박대한다고 사방에 떠벌리자, 갈 곳 없는 유민들이 잇달아 그의 깃발 아래로 몰려들었다."
 hd_yiguan.1111.a: "이놈이 감히!"

 # ---------- 南方·侨置 ----------
 hd_yiguan.1201.t: "주군 교치"
 hd_yiguan.1201.desc: "북방의 고향 땅은 이미 함락되었으나, 남쪽으로 온 사족들은 여전히 고향의 군망을 자랑으로 여긴다. 누군가 상소를 올려 [hd_yiguan_qiao_title.GetName](을)를 교치하여, 떠도는 이들이 소속될 곳을 갖게 하고 천하에 당신이 북방을 잊지 않았음을 알리자고 청했다."
 hd_yiguan.1201.a: "주군을 교치하여 인심을 붙든다."
 hd_yiguan.1201.b: "이 일은 나중에 다시 논의하겠다."
 hd_yiguan.1202.t: "교군의 호구 안정"
 hd_yiguan.1202.desc: "남쪽으로 온 유민들이 각지에 흩어져 살아 호적이 어지럽고 부역을 거두기 어렵다. 당신의 속료들은 한 곳을 골라 군현을 교치하고, 이 북방 사람들을 장부에 올려 따로 관할하며 부역을 너그럽게 하여 마음 놓고 개간하게 하자고 건의한다."
 hd_yiguan.1202.a: "군현을 교치하여 유민을 안치한다."
 hd_yiguan.1202.b: "유민은 마땅히 현지 호적에 편입해야 한다."
 hd_yiguan.1203.t: "교성과 구성의 다툼"
 hd_yiguan.1203.desc: "당상에서 또 다툼이 일었다. 북쪽에서 온 교성 사족은 강남의 옛 가문을 업신여기며 촌스럽다고 비웃고, 강남의 오성 호족은 북방 사람들이 관직과 좋은 밭을 차지했다고 원망한다. 양측이 저마다 제 말만 하며 모두 당신의 태도를 지켜보고 있다."
 hd_yiguan.1203.a: "북쪽에서 온 사족은 나라의 동량이다."
 hd_yiguan.1203.b: "강동의 옛 가문은 나라를 세운 근본이다."
 hd_yiguan.1203.c: "후하게 상을 내려 양측을 조화시킨다."
 hd_yiguan.1210.t: "토단"
 hd_yiguan.1210.desc: "교군과 교현이 세워진 지 오래되어, 유민들은 이미 남방에 밭을 사고 집을 마련했으나, 여전히 북방의 군망을 내걸고 감면된 부역을 누리고 있다. 누군가 상소를 올려 토단을 시행하자고 청했다. 교치를 폐지하고 이들을 모두 사는 곳의 군현 호적에 편입하자는 것이다.\n\n이 조치는 분명 부고를 채울 수 있겠지만, 북쪽에서 온 사족들을 크게 실망시킬 것이다."
 hd_yiguan.1210.a: "토단을 시행하여 모두 같은 편호로 삼는다."
 hd_yiguan.1210.b: "북방 사람들이 돌아가기를 그리워하니, 서둘러 끊을 수 없다."

 # ---------- 南方·北府军 ----------
 hd_yiguan.1301.t: "북부의 창설"
 hd_yiguan.1301.desc: "경구와 광릉 일대에 북쪽에서 온 유민이 대거 모여 있는데, 이들은 오랜 전장을 겪어 날래고 싸움에 능하다. 누군가 당신에게 계책을 바쳤다. 이 북방 사람들을 그 자리에서 모집하여 정병을 편성하고 단련해 북방을 막는 것이 어떻겠느냐고."
 hd_yiguan.1301.a: "북방 사람들을 모집해 병사로 삼고 북부라 부른다."
 hd_yiguan.1301.a.tt: "#EMP 의관남도 기간 동안 경구와 광릉에서 북부병을 모집할 수 있습니다.#!"
 hd_yiguan.1302.t: "북부의 명장"
 hd_yiguan.1302.desc: "북부군에서 날랜 장수 [hd_yiguan_beifu_general.GetName](이)가 나왔다. 그는 북방의 한미한 가문 출신으로, 싸울 때면 늘 몸소 병사들의 앞장을 서니 북부의 장병들이 모두 그를 위해 목숨을 바치려 한다. 이제 여러 장수가 그를 북부의 통수로 추대하며 당신의 허락만 기다리고 있다."
 hd_yiguan.1302.a: "병권을 맡겨 북부를 전담하게 한다."
 hd_yiguan.1302.b: "병권을 한 사람에게 몰아줄 수는 없다."
 hd_yiguan.1303.t: "북부의 병권 장악"
 hd_yiguan.1303.desc: "[hd_yiguan_beifu_general.GetName](이)가 여러 해 동안 북부를 거느리니, 장병들은 장군만 알고 조정은 알지 못한다. 근래 그는 거듭 전출 명령을 거역했고, 경구에서 오는 군보도 갈수록 줄어든다. 당신의 근신들은 크게 우려한다. 북부가 딴마음을 품는다면 도성이 위태롭다고."
 hd_yiguan.1303.a: "병권을 빼앗아 후환을 끊는다."
 hd_yiguan.1303.a.tt: "#EMP 이 사람은 경구를 차지하고 거병할 수 있습니다.#!"
 hd_yiguan.1303.b: "관직과 작위를 높여 그 마음을 안심시킨다."
 hd_yiguan.1303.c: "그냥 내버려 둔다."

 # ---------- 北方·流民逃窜 ----------
 hd_yiguan.2001.t: "한인의 남쪽 도주"
 hd_yiguan.2001.desc: "치하의 한인들이 또 한 무리 달아났다. 그들은 밤을 틈타 가족을 이끌고 관문을 넘어 남쪽으로 도망쳤고, 텅 빈 마을과 거둘 사람 없는 밭만 남았다. 당신의 부장은 군사를 내어 뒤쫓겠다고 청한다."
 hd_yiguan.2001.a: "군사를 내어 붙잡아 와 본보기로 삼는다."
 hd_yiguan.2001.b: "달아날 테면 달아나라지, 신경 쓸 것 없다."
 hd_yiguan.2001.c: "부역을 너그럽게 하여 남은 백성을 달랜다."
 hd_yiguan.2002.t: "오주의 출분"
 hd_yiguan.2002.desc: "[hd_yiguan_occ_county.GetName]의 한 한인 오주가 오벽의 부중을 모두 이끌고 보루를 버린 채 남쪽으로 떠났다. 그는 떠나기 전에 오벽의 곡식 창고를 불태우고, 죽을지언정 호인의 노복은 되지 않겠다고 큰소리쳤다."
 hd_yiguan.2002.a: "기병을 보내 쫓아 하나도 놓치지 마라."
 hd_yiguan.2002.b: "가게 내버려 두어라."
 hd_yiguan.2002.c: "창고를 열어 백성을 달래 인심을 거둔다."
 hd_yiguan.2003.t: "비어 가는 변경 현"
 hd_yiguan.2003.desc: "지방관의 보고에 따르면, [hd_yiguan_occ_county.GetName]의 한인은 이미 태반이 달아나 밭이 황폐해지고 부세조차 거둘 수 없다고 한다. 남은 이들도 형세를 살피며 때가 되면 남쪽으로 내려가려 한다."
 hd_yiguan.2003.a: "관문과 나루를 엄히 검문하여 도망자를 붙잡는다."
 hd_yiguan.2003.b: "되는 대로 내버려 둔다."
 hd_yiguan.2003.c: "창고를 열어 구휼하고 떠돈 이들을 불러들인다."
 hd_yiguan.2011.t: "족인들의 남도 논의"
 hd_yiguan.2011.desc: "집안의 어른들이 한자리에 모여 족중의 자제들을 남쪽으로 건너보내 강좌에 의탁하게 할지 의논한다. 북방에 남으면 결국 호인의 눈치를 보며 살아야 한다. 그러나 온 일족이 남쪽으로 옮겨 간다면 조상의 무덤과 전답을 어찌 버리겠는가? 마지막에는 모두가 당신을 바라보았다."
 hd_yiguan.2011.a: "자제들을 남쪽으로 보내 종사를 보존한다."
 hd_yiguan.2011.b: "오벽에 의지해 스스로 지키며 고향을 떠나지 않는다."
 hd_yiguan.2011.c: "고을 사람들을 타일러 마음 놓고 주인을 섬기게 한다."
 hd_yiguan.2012.t: "부로들의 청원"
 hd_yiguan.2012.desc: "고을의 부로들이 당신의 문 앞에 무릎 꿇고, 호인 병사들이 또 군량을 징발하고 장정을 잡아가 많은 집이 더는 살아갈 수 없다고 했다. 그들은 당신에게 결정을 내려 달라고 청한다. 남방으로 달아날 것인가, 아니면 고을에 오벽을 쌓아 스스로를 지킬 것인가?"
 hd_yiguan.2012.a: "자제들을 먼저 남쪽으로 보낸다."
 hd_yiguan.2012.b: "오벽을 쌓고 무리를 모아 고향을 지키기로 맹세한다."
 hd_yiguan.2012.c: "잠시 참으며 백성에게 귀부를 권한다."
 hd_yiguan.2013.t: "남조의 밀사"
 hd_yiguan.2013.desc: "남조에서 왔다고 자칭하는 사자가 밤을 틈타 찾아왔다. 그는 남방이 자리를 비워 두고 북방의 충의지사를 기다리고 있다며, 당신에게 뜻이 있다면 먼저 자제를 남쪽으로 보내 성의를 보이라고 한다."
 hd_yiguan.2013.a: "자제들을 사자와 함께 남쪽으로 돌려보낸다."
 hd_yiguan.2013.b: "남조는 길이 머니, 스스로 지키는 편이 낫다."
 hd_yiguan.2013.c: "이 일은 다시 꺼내지 마라."

 # ---------- 北方·义军起义 ----------
 hd_yiguan.2101.t: "오보의 거병"
 hd_yiguan.2101.desc: "[hd_yiguan_occ_county.GetName]의 한인 호족 [hd_yiguan_new_leader.GetName](이)가 오벽에 의지해 거병하여, 당신이 보낸 관리를 죽이고 고을 사람들에게 호인을 몰아내자고 호소했다. 소식이 전해지자 인근의 한인들이 모두 들썩이고 있다."
 hd_yiguan.2101.a: "군사를 내어 토벌하라!"
 hd_yiguan.2101.b: "관직을 약속하여 그 무리를 초안한다."
 hd_yiguan.2101.c: "재물로 그 부중을 흩어 놓는다."
 hd_yiguan.2102.t: "걸활군"
 hd_yiguan.2102.desc: "걸활군이라 자칭하는 유민 무장 세력이 [hd_yiguan_occ_county.GetName]에 나타났다. 그들은 본래 북방의 굶주린 백성으로, 무리를 지어 먹을 것을 구하다가 지금은 [hd_yiguan_new_leader.GetName]의 통솔 아래 각지를 전전하며 오로지 호인과 맞서 싸운다."
 hd_yiguan.2102.a: "걸활군을 소탕하여 지방을 안정시킨다."
 hd_yiguan.2102.b: "거두어 내가 쓴다."
 hd_yiguan.2102.c: "돈과 군량을 주어 흩어지게 한다."
 hd_yiguan.2103.t: "호걸의 의거"
 hd_yiguan.2103.desc: "[hd_yiguan_new_leader.GetName](이)가 [hd_yiguan_occ_county.GetName]에서 팔을 휘두르며 한 번 외치자, 사방의 한인이 구름처럼 모여 호응했다. 그는 오랑캐를 주멸한다는 깃발을 내걸었고, 지나는 곳마다 호인이 모조리 도륙당하니, 그 기세는 평범한 난민과 비할 바가 아니다."
 hd_yiguan.2103.a: "나라의 모든 군사를 동원해서라도 반드시 소탕하라!"
 hd_yiguan.2103.b: "높은 지위를 약속하여 그 세력을 분열시킨다."
 hd_yiguan.2103.c: "거금으로 매수하여 잠시 예봉을 늦춘다."
 hd_yiguan.2111.t: "이웃 현의 의거"
 hd_yiguan.2111.desc: "이웃한 [hd_yiguan_up_county.GetName]에서 누군가 호인에 맞서 군사를 일으켰다. 우두머리인 [hd_yiguan_new_leader.GetName](은)는 사방에 격문을 돌려 각지의 한인에게 함께 의기를 들자고 호소한다. 종주는 아직 당신의 태도를 모르지만, 이 한 걸음을 잘못 디디면 멸문의 화를 입는다."
 hd_yiguan.2111.a: "함께 의기를 들어 오랑캐를 몰아낸다."
 hd_yiguan.2111.b: "종주에게 알려 충성을 드러낸다."
 hd_yiguan.2111.c: "몰래 군량과 병기를 보낸다."
 hd_yiguan.2112.t: "의군의 사자"
 hd_yiguan.2112.desc: "[hd_yiguan_new_leader.GetName]의 사자가 행상으로 변장하고 조용히 당신의 저택에 찾아와 편지 한 통을 전했다. 의군이 이미 [hd_yiguan_up_county.GetName]에서 일어났으니, 당신이 높은 곳에 올라 한 번 외쳐 안팎에서 호응해 주기만을 바란다는 것이다."
 hd_yiguan.2112.a: "안팎에서 호응하여 함께 의거를 이룬다."
 hd_yiguan.2112.b: "그 사자를 묶어 종주에게 바친다."
 hd_yiguan.2112.c: "군량과 병기를 대 주되 흔적은 드러내지 않는다."
 hd_yiguan.2113.t: "옛 벗의 초청"
 hd_yiguan.2113.desc: "거병한 [hd_yiguan_new_leader.GetName](은)는 당신의 옛 지인이다. 그는 사람을 통해 전갈을 보내, 지난날 동창이던 시절에 화하를 바로잡자고 약속하지 않았느냐며, 이제 때가 되었으니 그날의 약속을 아직 기억하느냐고 묻는다."
 hd_yiguan.2113.a: "옛 약속을 마음에 품고 있으니 어찌 저버리겠는가."
 hd_yiguan.2113.b: "시절이 바뀌었으니 명을 따르기 어렵네."
 hd_yiguan.2113.c: "몰래 옛 벗에게 힘을 보탠다."
 hd_yiguan.2120.t: "남조 귀부의 논의"
 hd_yiguan.2120.desc: "의군이 승리하여 당신은 이미 호인의 굴레에서 벗어났다. 남방에서 사람을 보내 무리를 이끌고 귀부하여 이제부터 남조의 정삭을 받들라고 청한다. 한편으로는 남에게 얹혀살 필요 없이 자립하라고 권하는 이도 있다."
 hd_yiguan.2120.a: "남조에 귀부하여 신하의 절개를 온전히 한다."
 hd_yiguan.2120.b: "자립하여 남에게 기대지 않는다."

 # ---------- 北方·胡汉对峙 ----------
 hd_yiguan.2201.t: "호인과 한인의 땅 다툼"
 hd_yiguan.2201.desc: "호인 부락과 한인 농가가 땅 때문에 또 충돌했다. 호인은 방목을 하려 하고 한인은 농사를 지으려 하니, 양측이 패싸움을 벌여 여러 사람이 죽었다. 양쪽의 우두머리가 모두 당신의 장막 앞에 무릎 꿇고 결단을 기다린다."
 hd_yiguan.2201.a: "호인과 한인을 나누어 다스려 각자 생업에 안주하게 한다."
 hd_yiguan.2201.b: "한인은 농사에 능하니 그 장점을 써야 한다."
 hd_yiguan.2201.c: "한인은 교활하고 완고하니 엄히 단속한다."
 hd_yiguan.2202.t: "한인을 능멸하는 호인"
 hd_yiguan.2202.desc: "당신의 본족 장병들이 성안에서 횡포를 부리며 한인의 재물을 빼앗고 한인 부녀자를 욕보인다. 한인들은 분노하면서도 감히 말하지 못하지만, 몰래 남방의 노래를 퍼뜨리고 있다."
 hd_yiguan.2202.a: "호인과 한인은 각자 제자리로 돌아가고, 서로 침범하지 못한다."
 hd_yiguan.2202.b: "본족을 처벌하여 한인의 마음을 얻는다."
 hd_yiguan.2202.c: "한인이 원망을 품으니, 바로 위엄을 보일 때다."
 hd_yiguan.2203.t: "한인 사인의 진언"
 hd_yiguan.2203.desc: "한 한인 사인이 당신 앞에서 거침없이 논한다. 말 위에서 천하를 얻을 수는 있어도 말 위에서 다스릴 수는 없으니, 오래도록 안정을 누리려면 한인의 전장 제도를 쓰고 한인의 어진 인재를 등용해야 한다고. 당신의 본족 장수들은 곁에서 연신 냉소한다."
 hd_yiguan.2203.a: "호인에게는 호인의 법이, 한인에게는 한인의 제도가 있다."
 hd_yiguan.2203.b: "선생의 말씀이 지당하오."
 hd_yiguan.2203.c: "썩은 선비의 망언이니, 장막 밖으로 쫓아내라."
 hd_yiguan.2211.t: "호인 관리의 모욕"
 hd_yiguan.2211.desc: "종주가 보낸 호인 관리가 당신의 영지에서 위세를 부리며, 사람들 앞에서 당신의 가족을 채찍질하고 한인은 노복에 불과하다고 큰소리친다. 당신의 족인들이 모두 당신이 어떻게 대응할지 지켜보고 있다."
 hd_yiguan.2211.a: "굴욕을 참고 무거운 짐을 지며 잠시 견딘다."
 hd_yiguan.2211.b: "종주에게 상서하여 이치에 따라 힘써 다툰다."
 hd_yiguan.2211.c: "몰래 남조와 내통하여 뒷날을 도모한다."
 hd_yiguan.2212.t: "종주의 징발"
 hd_yiguan.2212.desc: "종주가 또 남정을 한다며 당신의 영지에서 장정과 군량을 징발하라고 명했다. 그러나 징발되어 간 이들 가운데 돌아온 이는 거의 없으니, 고을에는 원성이 자자하다."
 hd_yiguan.2212.a: "명을 삼가 받들어 감히 어기지 않는다."
 hd_yiguan.2212.b: "백성의 힘이 다했으니 징발을 줄여 달라고 청한다."
 hd_yiguan.2212.c: "겉으로는 따르는 척하며 몰래 남조에 사람을 보낸다."
 hd_yiguan.2213.t: "북쪽으로 전해진 남방의 소리"
 hd_yiguan.2213.desc: "남방의 시문과 소식이 이리저리 거쳐 북방에 전해졌다. 강좌의 의관과 풍류는 당신의 족인들의 마음을 설레게 하고, 호인의 치하에서 구차하게 사느니 일찌감치 대비하는 것이 낫다고 몰래 수군거리는 이도 있다."
 hd_yiguan.2213.a: "말을 삼가라! 화는 입에서 나온다."
 hd_yiguan.2213.b: "호인과 한인은 한 몸이니, 종주께서는 한인을 잘 대하셔야 한다."
 hd_yiguan.2213.c: "사람을 남쪽으로 보내 몰래 강좌와 결탁한다."

 # ---------- 举州归南·通知 ----------
 hd_yiguan.3101.t: "주를 들어 귀순하다"
 hd_yiguan.3101.desc: "북방의 [hd_yiguan_gn_vassal.GetName](이)가 거병하여 호인에게서 벗어나, 사자를 보내 주를 들어 당신에게 귀부하겠다고 한다. 당신은 이미 군사를 보내 북상하여 맞이하게 했다."
 hd_yiguan.3101.a: "왕사가 북상하여 의사를 맞이하라!"
