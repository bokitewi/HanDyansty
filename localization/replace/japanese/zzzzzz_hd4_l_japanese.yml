l_japanese:
 hd4_wait:0 "しばらく時を置き、改めて議しても遅くはない。"
 hd4_close:0 "承知した。"
 HD4_TAO_STORY_STATUS:0 "陶謙は徐州の諸郡を収め整えつつある。州全体が帰順すれば、兵を休めて境を守り、民を安んずることに専念するだろう。"
 hd4_story_tao:0 "陶謙：徐州経略"
 hd4_tao.0001.t:0 "徐州に割拠"
 hd4_tao.0001.desc:0 "董卓討伐の諸軍はそれぞれ散っていったが、徐州の政務は一つとして放っておけない。各郡からの書簡が机の前に積まれ、兵糧、守備、地方の争いが、どれもあなたの判断を待っている。\n\n丹陽の精兵はすでに州治に集結している。この兵馬はまず州境を安定させるために用いるべきだと分かっているあなたは、諸郡の情勢を調べて報告するよう命じた――天下を高らかに論じながら、治下の道路や城池が号令を失うのを放っておくわけにはいかない。\n\n会盟の頃は、多くの難題を董卓を討ち平らげた「後」に先送りできた。今やその「後」が来たのである。徐州を頼りになる根拠地とするには、目の前の散り乱れた軍民と郡国を取りまとめることから始めねばならない。"
 hd4_tao.0002.t:0 "臧霸の帰順"
 hd4_tao.0002.desc:0 "臧霸の帰順の文書はすでに整い、その麾下の兵衆もあなたの節制下に入った。報告に来た者は喜色満面で、まるでこの一件だけで徐州が安泰になるかのようである。\n\nあなたは臧霸の部衆と所轄地の状況を最後まで話させてから、引き継ぎを処理するよう命じた。州府の号令に従うと言うのは確かに貴いが、これまでそれぞれ別に営んできた者たちが今後どう助け合うかは、一つ一つ話し合わねばならない。\n\n机上の徐州の図籍には、また一つつなぎ合わせられる地が増えた。州の兵力が一つにつながれば、各自ばらばらに戦う憂いが一つ減る。ただ名分が定まっても、統治は自ら行わねばならず、一枚の書簡をすべてと見なすことはできない。"
 hd4_tao.0003.t:0 "徐州平定"
 hd4_tao.0003.desc:0 "徐州の諸郡はついにすべて一つにまとまり、かつて繰り返し問い合わせねばならなかった管轄地も、今ではすべてあなたと属吏の統治下にある。\n\nあなたは各地からの報告をしまい込み、民の帰農と守備兵の交代について尋ねた。出征を続ける理由はいつでも見つかる。だが目の前の獲得地すら落ち着かせる暇がないまま、戦えば戦うほど遠くへ行けば、州の根本はかえって次第に空洞になっていく。\n\nこれより先、あなたが自ら新たな戦端を開くことはない。進行中の軍務は締めくくらねばならず、外敵が侵してくれば防がねばならないが、新たな号令はむしろ田畑や倉廩や県署へと送るべきである。徐州が定まった今、それを守ることにも全力を尽くす価値がある。"
 hd4_tao_danyang_army:0 "陶謙の丹陽兵"
 hd4_cao_laiwu_army:0 "莱蕪丹陽兵"
 hd4_tao_guarding_xuzhou:0 "境を守り民を安んず"
 hd4_tao_guarding_xuzhou_desc:0 "徐州の諸郡がすでに帰順したため、この人物は兵を休めて境を守り、民を安んずることに専念している。"
 hd4_tao_story_ai:0 "徐州経略"
 hd4_tao_story_ai_desc:0 "この人物は徐州の境内の経営に専念しており、州外に兵を用いる気はない。"
 hd4_tao_continue_xuzhou_decision:0 "徐州経略を続ける"
 hd4_tao_continue_xuzhou_decision_desc:0 "徐州の諸郡には、いまだ州府の号令に従わない者がいる。彼らが自ら帰順してくるのを座して待つより、兵馬を整え、近くて手に入れやすいところから先に取り、州境を早く一つにつなげるほうがよい。"
 hd4_tao_continue_xuzhou_decision_tooltip:0 "徐州の境内でまだ帰順していない郡国に兵を用いる"
 hd4_tao_continue_xuzhou_decision_confirm:0 "軍を整えて徐州を経略せよ！"
 hd4_tao_xuzhou_cb:0 "徐州経略"
 HD4_TAO_WAR_NAME:0 "徐州郡国統一の戦い"
 hd4_tao_victory_desc:0 "陶謙は対象の郡国のうち敵方が占める地を奪い、その地の封臣は徐州の号令に従うことになる。"
 hd4_tao_no_conquest_desc:0 "対象の郡国はそれぞれ現状を保つ。陶謙の徐州経略の志は変わらず、後日改めて図ることができる。"
 hd4_gsz_invite.t:0 "袁紹、冀州攻めに誘う"
 hd4_gsz_invite.desc:0 "袁紹から書簡が届き、兵を南下させるよう誘ってきた。韓馥はためらっていて付け入る隙があり、冀州には大いに可能性があるという。手紙を読み終えたあなたが、事が成った後に地をどう分けるのかと使者に問うと、使者はまたしても「協力」の二字を繰り返すばかりだった。\n\n本初の文章はいつも見事だが、実際に地を取るとなれば、まずあなたの騎兵が道を切り開かねばならない。とはいえ、彼の経営をずっと傍観していれば、いずれ冀州が誰の根拠地となるにせよ、あなたにゆっくり相談する余地が残されているとは限らない。\n\nあなたは手紙を輿図の脇へ押しやった。使者はまだ堂下で返書を待っている。本初がこの返事をいったいどれほど切実に待ちわびているのか、知りたいものだ。"
 hd4_gsz_accept:0 "本初の誘いに応じ、南下して冀州を図る。"
 hd4_gsz_defeat_desc:0 "公孫瓚は敗れて自害し、配下で郡県を占めていた者たちはほどなくそれぞれ離散して自立した。"
 hd4_gsz_end.t:0 "公孫氏の滅亡"
 hd4_gsz_end.desc:0 "公孫瓚が敗れて死んだという知らせがついに届いた。それまでその号令に従っていた各地の部下は、門を閉ざして自守する者もいれば、使者を送って別の拠り所を探す者もおり、軍報に見える旗印は以前よりずっと入り乱れている。\n\nあなたは知らせを持ってきた者に、各地の状況を分けてはっきり説明させた。一人の総帥の死は、一つにつながっていた州郡からにわかに号令を奪うことはできても、守将や兵衆までも一緒に消し去ることはできない。幽州の旧勢力が瓦解した以上、新たな争奪はすぐにその隙間に沿って始まるだろう。\n\nあなたは軍報を受け取り、図上のまだ書き換えられていない旗印を眺めた。昨日までは一つの塊として警戒すべき勢力だったものを、今日からは一か所ずつ改めて見積もらねばならない。"
 hd4_north_two.t:0 "北方の両雄"
 hd4_north_two.desc:0 "新たに届いた北方の図籍では、かつてそれぞれ一方に割拠していた旗印がしだいにまばらになっていた。今や北地の諸県はことごとく曹操と袁紹の両家に帰し、境界は以前よりはっきりしたが、互いに立ち回る余地はかえって狭くなった。\n\nあなたは軍吏が一か所ずつ報告するのを聞き、新旧の報告を突き合わせた。以前ならまず小敵を片づけ、もう一方の強い隣人の助けを借りることもできた。だが今では、どう采配しようとも、最後には向こうの一家を避けて通ることはできない。\n\n帳中で誰かが昔ともに挙兵した頃のことを口にしかけ、途中で口をつぐんだ。交情は記憶の中にとどめておけても、糧道と兵勢はすべて目の前にある。これからの北方は、もはや両家がそれぞれ自分の経営だけを顧みていられる場所ではない。"
 hd4_guandu_invite.t:0 "河北統一"
 hd4_guandu_invite.desc:0 "帳中で議論を重ねた末に、残ったのは袁紹という一つの名だけだった。あなたは筆を置き、まず諸将に言い尽くさせた。北進が待ちきれない者もいれば、兵糧をいまだに何度も計算し直している者もおり、両家のかつての約定まで掘り返されている。\n\n本初は家柄も大きく基業も厚い。目の前に迫れば、その声勢は当然見事に映る。だがあなたは、声勢だけを理由に、この北方の優劣を彼に認めてやるつもりはない。まず国境の道を開いてこそ、河北に手を伸ばす足場ができる。\n\nあなたは目を上げて一同を見渡した。北伐の議が決まるか否か、結局のところ、あなたのこの筆がどこに落ちるかにかかっている。"
 hd4_guandu_accept:0 "北伐を決し、本初と雌雄を決する。"
 hd4_guandu_cb:0 "官渡の歴史的侵攻"
 HD4_GUANDU_WAR_NAME:0 "官渡の戦い：河北統一"
 hd4_guandu_victory_desc:0 "曹操は国境の諸郡のうち袁紹側が占める地を奪い、袁紹の称号に対する[pressed_claims|E]を得る。袁紹は憂憤のあまり病に倒れて深い痛手を負い、死後その遺業は諸子によって分割される。"
 hd4_guandu_defeat_desc:0 "曹操は敗れて退却し、袁紹は逆に曹操の称号に対する[pressed_claims|E]を得る。"
 hd4_guandu_white_peace_desc:0 "両家は兵を収めて和を結び、官渡の争いはここに終わる。"
 hd4_guandu_win.t:0 "官渡の勝利"
 hd4_guandu_win.desc:0 "勝報を伝える者は一息に多くの地名を読み上げ、終わりの頃にはいささか息を切らしていた。あなたは笑ってゆっくりでよいと言い、新たに得た国境の郡国を図上に記させた。\n\nこの一戦にはどうにか勝った。袁紹にはまだ河北があるが、あなたはもはや元の場所で彼が押し寄せてくるのを待つ必要はない。側近たちが祝いの言葉を続けようとしたところで、あなたはまず、使える兵がどれだけ残っているか、糧道はいつ通じるのかを尋ねた――どれほど見事な祝辞も、前軍に一車の兵糧を余計に運んではくれない。\n\n図上には未だ得ていない地が残っている。あなたの視線は国境に沿ってしばらく北へとたどった。名分はすでに手中にあるが、城門は一つ一つ開けていかねばならない。今日はまず勝利の果実を確実にしておこう。本初に言ってやりたいことは、この先いくらでもある。"
 hd4_guandu_loss.t:0 "官渡を守り抜く"
 hd4_guandu_loss.desc:0 "曹操敗退の知らせが届くと、帳中にそれまで漂っていた不安なささやきは、たちまち祝いの言葉に変わった。あなたはしばらくそれを聞いてから、使者に戦果を初めから報告させた。\n\n孟徳は勢いに乗って北上できると思い込んでいたが、今こそ袁氏の重みを量り直すべきだろう。あなたは彼の各地の名位を一つ残らず書き留めさせた――これこそ後日取り立てるための証拠である。地はまだすべて手に入ってはいないが、あなたがこれで手を引くつもりはないことを、まず皆に知らしめておくのも悪くない。\n\nあなたは戦報を机に戻し、兵衆を点検させ、国境を調べ直させた。今日のこの勝利を、辛くも難を逃れたかのように語る必要はない。北方のことを、曹操に代わりに決めてもらう筋合いはないのだ。"
 hd4_yuan_grief:0 "官渡敗戦後の重い痛手"
 hd4_yuan_grief_desc:0 "官渡の敗戦により、この人物は憂憤のあまり病に倒れ、心身ともに損なわれている。"
 hd4_yuan_grief.t:0 "憤懣、胸を衝く"
 hd4_yuan_grief.desc:0 "官渡の敗報はすでに読み終えたが、胸中の鈍い痛みは文書を閉じても消えなかった。失った国境の郡国が一つずつ報告され、帳中の誰もがいつもよりゆっくりと話す。まるで地名をもう一つ読み上げれば、あなたが耐えきれなくなるとでも恐れているかのように。\n\n立ち上がろうとしても、心より先に体が崩れ落ちる。かつては深夜まで論じ合えた軍議も、今ではしばらく聞いただけで疲れを覚える。誰かが諸子の今後の処遇を口にしかけ、すぐに言葉を呑み込んだ。\n\n北方の大業にはまだ決着がついていないのに、周りの者たちはすでにあなたの死後のことを算段し始めている。あなたはまだ片づけられていない輿図に目をやり、彼らを叱りつけて退けようとしたが、結局は灯を近くへ寄せるよう命じただけだった。"
 hd4_yuan_partition.t:0 "袁氏の分国"
 hd4_yuan_partition.desc:0 "父の死後の領地の分配はすでに議決され、目の前に届けられた簿籍には、今後あなたが一人で治める地がはっきりと列記されている。兄弟たちもそれぞれ立つ地を得て、もはや一人の号令に共に従うことはない。\n\nあなたは見慣れた県の名を眺めながら、それらが昨日とは違って見えることにふと気づいた。以前は争いが起きても父の机に持ち込むことができた。だが今では、互いにどう付き合うか、旧部が誰の指図に従うかを、各家が改めて取り決めねばならない。袁氏の姓は変わらないが、皆をひとまず引き下がらせることのできたあの人は、もういない。\n\n門外では新たな軍令を待つ者がいる。あなたは分配の文書をしまった。目の前のこの基業が自分の手に渡った以上、これからその安危は自分で背負わねばならない。"
 hd_cao_chain.0094.t:0 "莱蕪にて衆を整う"
 hd_cao_chain.0094.desc:0 "莱蕪の城外にはまた天幕が増えた。一族や旧部の知らせが次々と届き、馳せ参じることのできる者はそれぞれ部曲と家財を携え、自ら来られない者も、軍中に何が足りぬかを人を遣わして尋ねてきた。数日前までは道々の追手を警戒しなければならなかったが、今では命令を待つ者がいる。\n\n銭糧と丹陽兵の名簿が机の前に届けられ、あなたは一項ずつ目を通して、地図の片隅に重しとして置いた。足場はもう得た。次になすべきは、もはや董卓の追及を逃れることだけではない。四方に散らばる憤りを、誰かが軍令と糧道と前へ進む部隊に変えなければならないのだ。\n\nあなたは陣中に隊列を組み直すよう命じた。天下はいまだ定まらぬ。曹氏は、ひとまず身を寄せる場所を得ただけの逃亡の一家で終わるわけにはいかない。"
 hd_cao_chain.0094.a:0 "莱蕪を基とし、軍を整えて出陣を待つ。"
 hd_cao_chenliu_danyang_army:0 "莱蕪丹陽兵"
 hd4_tao.0001.a:0 "まず州境を安んじ、それから他を図る。"
 hd4_tao.0002.a:0 "宣高が来たからには、徐州の憂いが一つ減った。"
 hd4_tao.0003.a:0 "兵を休めて境を守り、民と共に休息する。"
 hd4_north_two.a:0 "河北のことは、いずれ決着をつけねばならぬ。"
 hd4_guandu_win.a:0 "勝ちに乗じて北を望めば、河北は図れる。"
 hd4_guandu_loss.a:0 "孟徳が退いた以上、後日改めて彼と勘定をつけよう。"
 hd4_yuan_grief.a:0 "天は我を佑けず、如何せん！"
 hd4_yuan_partition.a:0 "亡き父の基業、当然これを守る。"
 hd4_gsz_end.a:0 "伯圭が亡んだ今、北の憂いはない。"
