l_japanese:
 # 原版丝路参与组说明中的旧六区引用必须覆盖
 silk_road_situation_participant_group_china_realm_desc:0 "この人物はシルクロード東段に領地を持つ、非[nomadic|E]の[independent_ruler|E]である。"
 silk_road_situation_participant_group_silk_road_domain_desc:0 "この人物は非[nomadic|E]の[ruler|E]であり、その[domain|E]は[GetGeographicalRegion('dlc_tgp_silk_road_route_region').GetName]上に直接位置している。"
 silk_road_situation_participant_group_silk_road_realm_desc:0 "この人物は非[nomadic|E]の[ruler|E]であり、その[realm|E]の一部が[GetGeographicalRegion('dlc_tgp_silk_road_route_region').GetName]とつながっている。"
 silk_road_situation_participant_group_silk_road_periphery_desc:0 "この人物は非[nomadic|E]の[ruler|E]であり、[GetGeographicalRegion('tgp_silk_road_region').GetName]内に位置しているが、より直接的なシルクロード参加グループには属していない。"
 visit_silk_road_market_decision_changan:0 "$building_changan_market_01$ #weak （[GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_eastern_section').MakeScope.Var('innovation').CultureInnovationType.GetName]）#!"

 # 仍在使用的运河催化剂改用四区键
 catalyst_silk_road_china_grand_canal_expanded_desc:0 "$great_project_type_grand_canals$の[great_project|E]が完成 #weak （[GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_eastern_section').GetName]）#!"
 catalyst_silk_road_china_grand_canal_expanded_secondary_desc:0 "$great_project_type_grand_canals$の[great_project|E]が完成 #weak （[GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_middle_northern_route').GetName]、[GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_middle_southern_route').GetName]）#!"
 catalyst_silk_road_china_grand_canal_expanded_tertiary_desc:0 "$great_project_type_grand_canals$の[great_project|E]が完成 #weak （[GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_western_section').GetName]）#!"

 # 保留原版大草原显示名，只覆盖三个项目地图说明
 the_great_steppe_sub_region_steppe_west_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak 西部草原は涼州の諸郡を含む。河西一帯は東は中原に連なり、西は西域に通じる。水草の豊凶、旱魃や厳寒が、常に牧畜の群れの生息と移動を左右している。#!"
 the_great_steppe_sub_region_steppe_central_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak 中部草原は并州の諸郡を含む。この地は農耕の腹地と北方の草原の間にあり、山嶺・河谷・辺塞が入り組み、水草を追って暮らす生業を育んできた。#!"
 the_great_steppe_sub_region_steppe_east_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak 東部草原は幽州の諸郡を含む。燕山の南北と遼西の辺地は東北の草原へ通じる門戸であり、寒暑の移り変わりが牧場の肥沃さと遊牧の部衆の行方を左右している。#!"
