l_japanese:
 hds_sj_heavy_army:0 "孫氏の江東重歩兵"
 hds.5000.t:0 "自立の心"
 hds.5000.desc:0 "袁術のために長年奔走してきた。あなたの麾下の者たちはあなたに従って各地を転戦したが、あなたの名義の下には相変わらず荘園が一つあるだけだ。部衆を点検するたびに、帳の外で誰かが小声で問う――我らはいったい誰のために戦っているのか、と。\n\n江東の輿図が机の上に広げられている。丹陽は山川が縦横に走り、地に拠って自守する者たちも打ち破れぬ相手ではない。自分の土地は結局自分で取りに行くしかない。他人の旗印の下にいては、永遠に他人の食べ残しにしかありつけない。\n\nあなたは袁術の最近の軍令を脇へ押しやり、長いこと黙り込んでいた。"
 hds.5000.a:0 "もはや人の軒下に身を寄せはせぬ。自ら丹陽を取る！"
 hds.5000.b:0 "時機はまだ来ていない。ひとまずもう少し耐えよう。"
 hds.5001.t:0 "孫堅に対する密謀"
 hds.5001.desc:0 "孫堅はあなたを見捨てて去り、自ら旗を掲げた。さらに重大なことに、伝国の玉璽はまだ彼の手に握られている。\n\n劉表の使者はすでに二日も広間の外で待っており、手紙にははっきりとこう書かれていた――この男が江東を得て、さらに玉璽まで得れば、もはや誰の号令にも従わなくなるだろう、と。荊州とあなたの間に古い恨みはないが、今は同じ敵を抱えている。\n\nあなたは筆を取って返書をしたためた。ただ数語のみ――事成りし後は、各々必要なものを取ろう、と。"
 hds.5001.a:0 "景升と約し、共に文台を図る。"
 hds.5002.t:0 "風聞"
 hds.5002.desc:0 "近頃、陣中に見慣れぬ顔が増え、行き交う使者も以前より頻繁になった。ある者がひそかに一言の伝言を届けてきた――袁術と劉表の間で、どうやらあなたに関わることが相談されているらしい、と。\n\n玉璽があなたの手中にあることは、とうに天下周知の事実である。この日が来ることを考えなかったわけではないが、これほど早く来るとは思っていなかった。\n\nあなたは警戒を強めるよう命じたが、荊襄と袁術の両方を一度に防ぎきれるものではない。"
 hds.5002.a:0 "兵来たらば将もて防ぐのみ、何ぞ言うに足らん。"
 hds.5003.t:0 "峴山の禍"
 hds.5003.desc:0 "あなたは軽騎を率いて陣を出た。荊襄の虚実を探るつもりだったが、山道の両側から突如として矢が雨のように降り注いだ。\n\n黄祖の伏兵はとうに林の中で待ち構えていた。退路は断たれ、随行の者たちが一人また一人と倒れていく。乱れ飛ぶ矢の中で剣を抜いたとき、あなたはふと、陣中に届けられたあの伝言と、今この時の袁術と劉表の笑顔を思い浮かべた。\n\n玉璽は、ついに主を替えることになるのだ。"
 hds.5003.a:0 "江東に帰れぬのが無念だ！"
