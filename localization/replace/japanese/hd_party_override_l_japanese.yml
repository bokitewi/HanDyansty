l_japanese:
 # 天朝循环大修·朋党：参与者组改为"身份"，覆盖原版组名与简称
 dynastic_cycle_participant_group_hegemon_ruler: "天子"
 dynastic_cycle_participant_group_other_rulers: "諸侯"
 dynastic_cycle_participant_group_other_rulers_desc: "[GetSituation('dynastic_cycle').GetTopSubRegion.GetName]内にあり、[son_of_heaven|E]に臣従していないすべての独立した[rulers|E]。\n\n乱世においては、帝国級の諸侯はそれぞれ自国の朋党を持つ。"
 dynastic_cycle_participant_group_hd_siyi_movement: "四夷"
 dynastic_cycle_participant_group_hd_siyi_movement_desc: "中華にありながら漢文化の伝統を継がないすべての[characters|E]。\n\n四夷は朝政に関与せず、朋党を持たず、党争にも加わらない。"
 dynastic_cycle_participant_group_undecided_movement: "宦官"
 dynastic_cycle_participant_group_undecided_movement_desc: "君主の左右に仕える閹宦。\n\n#weak 身分：閹人、または宦官の門生。#!"
 dynastic_cycle_participant_group_pro_hegemon_movement: "外戚"
 dynastic_cycle_participant_group_pro_hegemon_movement_desc: "君主の母方の一族、后妃の一族、および君主の子女の姻戚となった一族。\n\n#weak 身分：成年であり、所属する一族が君主の后族または姻戚であるか、外戚の門生。#!"
 dynastic_cycle_participant_group_expansion_movement: "武勲"
 dynastic_cycle_participant_group_expansion_movement_desc: "軍功によって身を起こした将校と軍鎮。\n\n#weak 身分：武官の軍階を持つ、軍事要員である、三級以上の軍事教育を受けている、または武勲の門生。#!\n$unlockables_expansion$"
 dynastic_cycle_participant_group_conservative_movement: "世族"
 dynastic_cycle_participant_group_conservative_movement_desc: "代々公卿を出してきた門閥の大族。\n\n#weak 身分：豪族または主導家族であり、世族の称号を持つか、王朝の威信が「世に名高い」に達している。#!\n$unlockables_conservative$"
 dynastic_cycle_participant_group_advancement_movement: "寒門"
 dynastic_cycle_participant_group_advancement_movement_desc: "寒微の出身ながら才学によって身を立てた士人と庶民。\n\n#weak 身分：他のいずれの身分にも属さない者。#!\n$unlockables_advancement$"
 dynastic_cycle_hd_siyi_movement: "[dynastic_cycle_era_type|E]#weak （$dynastic_cycle_participant_group_hd_siyi_movement$）#!"
 my_pro_hegemon_movement_short: "外戚"
 my_expansion_movement_short: "武勲"
 my_advancement_movement_short: "寒門"
 my_conservative_movement_short: "世族"
 my_undecided_movement_short: "宦官"
 SELECT_FAVOR_MOVEMENT: "運動を選択する"
 dynastic_cycle_tab_movements: "政治運動"
 favor_movement_decision: "運動を支持する"
