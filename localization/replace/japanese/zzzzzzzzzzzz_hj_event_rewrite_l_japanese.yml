l_japanese:
 tgp_interaction_event.0010.a:0 "我自ら一軍を率いて援けに赴こう。"
 tgp_interaction_event.0010.b:0 "ただちに麾下の武官を馳せ参じさせる。"
 tgp_interaction_event.0010.c:0 "別の良将を選ばせてもらいたい。"
 tgp_interaction_event.0010.desc:0 "前線の戦はいまだ止まず、軍情は切迫しており、報告せずにはいられない。今、使者を遣わして書を奉り、兵を発して援けてくださるよう切にお願い申し上げる。\n\nもしあなたが自ら一軍を率いて来てくだされば、我が軍の上下は頼るべきものを得る。もし他の軍務に縛られているならば、有能な武官一人に兵を率いて馳せ参じさせ、共にこの危局を支えていただきたい。どこで合流するか、各部がどう連絡を取り合うかは、ご返答をいただき次第、こちらですぐに手配する。\n\n軍情は刻一刻と変わるゆえ、使者は長く留まることができない。謹んでご返事をお待ちする。"
