l_japanese:
 hds.1000.t:0 "荊州に足場を築く"
 hds.1000.desc:0 "董卓討伐の諸軍はそれぞれの州郡に戻り、かつて会盟の際には譲り合えたことも、今ではすべて改めて話し合わねばならない。荊州もまた、一枚の名位だけで各地の兵衆や官署が自ずと落ち着くわけではない。\n\nあなたは州内の輿図を目の前に広げ、郷里に詳しい士人に道路と人情を説明させた。率いる兵は少なくとも水陸の要衝を押さえている者もいれば、決して表に出ないのに宗族や賓客を通じてその言葉が数県に広まる者もいる。外来の号令だけで一つずつ押さえつけるのは、根気よく彼らを取り込むより早いとは限らない。\n\nまず荊州に足場を築き、それから諸郡を取りまとめる。天下がすでに乱れた以上、治下の人々に明日どこの命に従えばよいのかを、まず知らしめねばならない。"
 hds.1000.a:0 "荊州を引き継ぎ、まず州の士人と結ぶ。"
 hds.1001.t:0 "蒯越の帰順"
 hds.1001.desc:0 "蒯越の来意がようやく明らかになった。彼は自らの領地をあなたの節制下に入れ、またあなたと盟約を結んで共に荊州を安んじたいという。\n\nあなたは急いで大きな約束はせず、現地の兵衆、道路、難題を一つずつ語ってもらった。異度は郷里に通じており、州府の簿冊にはただ名前があるだけの多くの人々も、彼の口から語られればそれぞれ来歴としがらみを持っている。こうした人々を同じ号令に従わせるのは、文書の署名を一か所書き換えるだけでできることではない。\n\n話は夕闇が堂に差し込むまで続き、ようやく引き継ぎの件がまとまった。あなたは彼のために一席を設け、また後日互いに援け合うという約束も残した。荊州の根は、こうして腰を据えて共に議する人々の上に張られていくのである。"
 hds.1001.a:0 "帰属を受け入れ、異度と盟約を結ぶ。"
 hds.1002.t:0 "蔡瑁の帰順"
 hds.1002.desc:0 "蔡瑁が配下を率いて帰順したいという知らせが届き、州の政務にまた一つ頼れるところが増えた。あなたは彼を議に招き、礼辞を整える必要はない、率いる人馬と地域のことをはっきり話せばよいと伝えさせた。\n\n荊州の道路は江漢に沿ってつながっており、一か所の関津が通じなければ、近隣の郡県も単独では安定しがたい。徳珪が来帰したことで兵力が一つ加わり、またこれまでそれぞれ別の号令に従っていた人々が一堂に会して守備を議することができるようになった。\n\nあなたは目の前の輿図を彼の方へ少し押しやった。今後どう統制し、どう援け合うかは、今日のうちにはっきりさせておくべきだ。さもなければ各自が帰った後、同じ会見をそれぞれ別の約束として語りかねない。"
 hds.1002.a:0 "蔡氏の部属を受け入れ、徳珪と盟約を結ぶ。"
 hds.1003.t:0 "荊州平定"
 hds.1003.desc:0 "州内の最後の引き渡し文書がようやくすべて届いた。荊州の諸郡は今やすべてあなたの節制下にあり、かつては何度も使者を送って問い合わせねばならなかった地も、同じ手順で政務を報告し始めている。\n\n側近の中には勢いに乗って外へ兵を進めることを論じる者もいたが、あなたはまず各県の倉の備蓄と守備について尋ねた。城一つを取るには軍勢に頼ればよい。だが取った地が再び乱れないようにするには、目立たぬ手間を多くかけねばならない。新たに帰順した官吏、地方の旧家、兵衆と民衆が、みな州府が次に何を求めてくるのかを見守っている。\n\nあなたは外征の議論をひとまず抑えた。荊州が定まった以上、今後は境を守ることを先とする。すでに始まった戦は締めくくらねばならず、侵してくる敵を座視することもできない。"
 hds.1003.a:0 "境を保ち民を安んじ、もはや外征せず。"
 hds.2000.t:0 "南陽へ逃れる"
 hds.2000.desc:0 "董卓の甲士がまた屋敷の門前を通り過ぎ、車輪の音が止むと、堂の中では話し声さえひそめられた。左右の者たちの面倒事を恐れる顔つきを見るにつけ、あなたは雒陽にもう一日たりとも留まりたくなくなった。\n\n袁氏の家門が、まさか彼が通してくれるかどうかで保たれるというのか？ 宛城には頼れる荘園があり、一族の者たちも一緒に移ることができる。ここに留まって失脚した公卿たちと共に頭を下げていては、本当に行き場を失ったかのようではないか。\n\n書吏が旅装の目録を捧げ持ってきたので、あなたはまず家財と随行の人数を点検させた。屋敷は持っていけないなら置いていけばよい。いずれ南陽まであなたに会いに来ようとする者が現れるだろう。皆で董卓の門前にひしめく必要はない。"
 hds.2000.a:0 "家業を宛に移し、この是非の地を去る。"
 hds.2001.t:0 "孫堅の来投"
 hds.2001.desc:0 "孫堅があなたのために南陽を取ってみせると言うので、あなたは酒をもっと注ぐよう命じた。文台は話に回りくどさがなく、兵を連れてくることもでき、仕事もする。空しい名ばかりを掲げて目通りを求めに来る連中よりはるかにましだ。\n\n彼が元の職務と孫氏の家業の引き継ぎについて語るのを聞いて、あなたはうなずいた。南陽の旧守については――道を譲るならそれでよし、譲らぬなら、文台の手の刀はいつも往来の文書より速い。\n\nあなたは輿図を彼の方へ押しやった。袁氏には地盤があり、孫氏には鋭兵がある。互いに必要なものを取り合えば、ちょうど一つの事業を成せる。南陽が落ち着けば、行き交う者たちも、ここがもはや昔の号令の下にはないことを知るだろう。"
 hds.2001.a:0 "文台の兵を借りて、南陽の地を取る。"
 hds.2002.t:0 "南陽で自立"
 hds.2002.desc:0 "董卓討伐の連合は解散し、かつて共に進退するという名目もしだいに重みを失った。机上には会盟の際に残された文書がまだ置かれているが、門外に尋ねてくる者たちが問うのは、すでに南陽の今後の兵糧と境界である。\n\nあなたは古い盟書をしまい込んだ。袁氏はここに家業があり、部属があり、隣州に向かって声を上げるに足る兵衆もいる。何事もかつての盟主の差配を待っていては、目の前の機会を他人に譲るだけだ。\n\n豫・揚の二州はともにあなたの経営の視野にあるが、第一歩はまず豫州に目を向けねばならない。南陽は立脚の地であって、雒陽の騒動から一時避難するための宿であってはならない。あなたは新たに軍議を起こすよう命じた――これより先は、自家の基業のために号令を発する。"
 hds.2002.a:0 "南陽に拠って自立し、まず豫州を図る。"
 hds.3000.t:0 "手中の玉璽"
 hds.3000.desc:0 "董卓討伐の戦いは勝利に終わり、諸軍は次々と兵を収めている。伝国の玉璽が巡り巡ってあなたの手に届けられたとき、そばにいた者たちはまず息を呑んだ。まるでこの玉が、帳の外にまだ散らずにいる兵馬よりも重いとでもいうかのように。\n\nあなたはそれを裏返してじっくりと眺めた。「受命于天、既寿永昌」の八字が灯の下で光を放っている。出兵の際に掲げたのは漢室を扶けるという旗印だったが、今や天子の権柄を象徴する物が自らの手に落ちた。これから隠すにせよ示すにせよ、もはや尋常の器物の扱いでは済まない。\n\n誰かが何か言いかけてためらったが、あなたは先に箱の蓋を閉じた。玉璽を握っても、それで四方が命に従うわけではない。だが噂がひとたび広まれば、これを狙う者たちはあなたが道理を考え抜くのを待ってはくれない。この品はまず厳重にしまっておかねばならない。"
 hds.3000.a:0 "玉璽をしまい、外に漏れるのを慎重に防ぐ。"
 hds.4000.t:0 "父の遺業を継ぐ"
 hds.4000.desc:0 "家中の遺品が一つ一つあなたの前に運ばれてくる。引き渡しに来た者はいまだに口癖で父のことを呼び、半ばまで言いかけて慌てて言い直した。あなたは急かさず、彼がその呼び名を呑み込むのを待った。\n\n簿籍にある荘園と名位は、今やすべてあなたが継ぐ。父の残した人々はまだここにおり、父がやろうとして果たせなかったこともまだ残っている。ただ、もう上座に座って最後の一言を代わりに言ってくれる人はいない。\n\nあなたは簿冊を開いたが、少し目を通しただけで、それらの数字に胸が締めつけられるような息苦しさを覚え、いっそ旧部を呼び寄せて事を議することにした。孫氏を、あなたが番をするだけの家財の山にしてしまうわけにはいかない。まず父の業をしっかりと受け継ぎ、この先の道は自ら切り開いていくのだ。"
 hds.4000.a:0 "父の遺業を継ぎ、失墜させるわけにはいかない。"
 hds.4001.t:0 "江東へ転ずる"
 hds.4001.desc:0 "袁術の軍令がまた机に置かれた。あなたは数行読んだだけで、それを脇へ押しやった。父の残した者たちは、いつまでも他人のために奔走せねばならないのか？ 孫氏自身の旗は、永遠に他家の旗の後ろについていくだけなのか？\n\n江東の輿図を広げ、あなたは指の関節で揚州のあたりを叩いた。ここを離れても、荘園は孫氏の荘園のままだ。足りない兵は、玉璽がまだあるなら、それで袁術と取引すればよい――彼は箱の中のあの玉を重んじているが、あなたが欲しいのは自分について前に進める甲士である。\n\nもし玉璽がもう手元になくとも、だからといって元の場所に座り込むわけにはいかない。あなたは部衆を点検させた。去る決意は固まった。残るは、この一歩をどう踏み出すかだけである。"
 hds.4001.a:0 "袁術に別れを告げ、兵を率いて東へ渡る。"
 hds.4002.t:0 "周瑜の来帰"
 hds.4002.desc:0 "周瑜が到着したと聞くと、あなたは机上の軍報を押しのけ、立ち上がって出迎えに向かった。公瑾がまだ礼を終えないうちに、あなたはもう彼の手を取って随行の兵衆について尋ね、周りの者が用意していた挨拶の言葉を挟む隙さえ与えなかった。\n\n彼が連れてきた兵馬はもちろん喜ばしいが、それ以上に喜ばしいのは、ようやくあなたと腰を据えて、江東の構想を初めから存分に語り合える者が現れたことだ。彼の旧職と家業は誰かが処理してくれる。だが目の前のこの輿図は、もう待つ必要はない。\n\nあなたたちは渡し場から糧道まで語り合い、進軍の方向をめぐって何度か言い争いもした。長く胸に溜まっていた鬱屈は、いつの間にか消えていた。公瑾が来たからには、これまで心の中で巡らせるだけだった多くのことを、ついに実行に移すことができる。"
 hds.4002.a:0 "公瑾とその兵衆を迎え、共に江東を議する。"
 hds.4003.t:0 "まず丹陽を取る"
 hds.4003.desc:0 "「まず丹陽を取る」あなたが輿図に手を押し当てると、帳中の数人がそれに沿って目を向けた。先ほどまで揚州の各地に散らばっていた議論が、ようやく落ち着く先を得た。\n\n袁術のもとを離れて以来、孫氏はどこへ向かうのかと人に問われるのはもう聞き飽きた。丹陽には山川や関津があり、地に拠って自守する豪強もいる。まず目の前のこの相手を討ち、残りは一つずつ片づけていけばよい。郡全体を得ていないからといって、最初の一歩すら踏み出せないようではいけない。\n\n帳の外では兵衆がすでに命を待っており、あなたもこれ以上座って図上の城池を数えていたくはない。江東は、他人が与えてくれて初めて手に入る場所ではない。まず丹陽に足場を築き、それから孫氏の旗がどこまで進めるかを彼らに見せてやるのだ。"
 hds.4003.a:0 "丹陽を最優先とし、軍を整えて進取する。"
 hds.4004.t:0 "丹陽に足場を築く"
 hds.4004.desc:0 "丹陽各地の引き渡しの報告がようやくすべて揃った。あなたは図上でまだ他家の所属と記されている地を一つずつ書き換えさせ、孫氏の領土が一つにつながるのを眺めた。それはどんな功績の賛辞を聞くよりも痛快だった。\n\n軍議をしばらく休めてはどうかと問う者がいたが、あなたは答えず、ただ揚州の輿図をさらに広げた。丹陽が定まり、糧道と城邑にようやく根本ができた。この先にはまだ諸郡があり、あなたがここで足を止めるのを見届けようと待っている者たちもいる。\n\n新たに得た地は落ち着かせねばならず、次の用兵にも節度が必要だ。それはもちろん分かっている。だが机上の図を急いで巻く必要はない――ようやく手に入れた自分の足場は、これ以上前に進まないためのものだろうか？"
 hds.4004.a:0 "丹陽を本拠とし、進んで揚州を図る。"
 hds_sc_heavy_army:0 "江東重歩兵"
 hds_sc_light_army:0 "周瑜の江東義従"
 hds_sc_base_army:0 "孫氏の江東旧部"
 hds_war_victory_desc:0 "攻撃側は対象の郡内で敵方が占める地を奪い、その地の封臣は鞍替えする。"
 hds_war_no_conquest_desc:0 "この戦いで得るものはなく、双方は元の境を守る。時機が再び訪れれば、改めて図ることができる。"
 hds_liu_guarding_jingzhou:0 "荊州を守り抜く"
 hds_liu_guarding_jingzhou_desc:0 "荊州の諸郡はことごとく節制下に入り、この人物はこれより境を保ち民を安んじ、外征する気はない。"
 hds_southern_campaign_ai:0 "南方の歴史的進取"
 hds_southern_campaign_ai_desc:0 "この人物は地に拠って自ら雄を称し、常に四方へ兵を用いることを考えている。"
