l_japanese:
 situation_dynastic_cycle_phase_chaos_desc_short: "天子の号令は京畿の外に及ばず、州郡はそれぞれ兵馬を擁し、群雄は土地・盟約・刀兵によって進退を決する。"
 situation_dynastic_cycle_phase_chaos_desc: "$situation_dynastic_cycle_phase_chaos_desc_short$\n\n$hd_dc_era_rules_tt$\n\n#S この$game_concept_dynastic_cycle_era_short$の開始後#!\n$BULLET$[son_of_heaven|E]はこれによって廃されることはなく、直轄地を保持し続ける。ただしその直属の[vassals|E]（朝官を除く）はそれぞれ土地を擁して自立し、朝貢関係もすべて断絶する。[son_of_heaven|E]は十年以内であれば「討逆」によってこれを征伐できる\n$BULLET$従来の輔政の臣はただちに天子を擁して諸侯に号令する。郡国制の諸侯は「天子を擁す」の名目で兵を挙げることができ、京城を攻め落とした者が天子を擁する\n$BULLET$県級以上の[vassals|E]は主君に「独立を要求」できる。主君が承諾すれば平和裏に自立し、双方に[truce|E]が五年間結ばれる。承諾しなければそのまま自立するが、元の主君は十年以内であれば「討逆」によってこれを征伐できる\n$BULLET$群雄は漢を尊ぶか、あるいは逆を謀り、「併呑」をもって相争う"
 # 天朝循环大修：斗争期（chaos）改名；夺取天命决议即'终结乱世'
 situation_dynastic_cycle_phase_chaos: "群雄割拠"
 situation_dynastic_cycle_claim_mandate_decision: "乱世を終わらせる"
