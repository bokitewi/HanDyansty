l_korean:
 situation_dynastic_cycle_phase_chaos_desc_short: "천자의 호령은 경기를 벗어나지 못하고, 주군은 저마다 병마를 거느리며, 군웅은 땅과 맹약과 칼로 진퇴를 정합니다."
 situation_dynastic_cycle_phase_chaos_desc: "$situation_dynastic_cycle_phase_chaos_desc_short$\n\n$hd_dc_era_rules_tt$\n\n#S 이 $game_concept_dynastic_cycle_era_short$(이)가 시작된 뒤#!\n$BULLET$[son_of_heaven|E](은)는 이로 인해 폐위되지 않고 직할지를 그대로 보유합니다. 그러나 직속 [vassals|E](조정 관원 제외)는 저마다 땅을 차지하고 자립하며 조공 관계도 모두 끊어지고, [son_of_heaven|E](은)는 10년 안에 「토역」으로 이들을 정벌할 수 있습니다\n$BULLET$기존의 보정 대신은 곧 천자를 끼고 제후를 호령하게 됩니다. 군국제 제후는 「협천자」의 명분으로 군사를 일으킬 수 있으며, 경성을 함락한 자가 천자를 끼게 됩니다\n$BULLET$현급 이상의 [vassals|E](은)는 주군에게 「독립 요구」를 할 수 있습니다. 주군이 응하면 평화롭게 자립하고 양측은 5년간 [truce|E](을)를 맺습니다. 응하지 않아도 자립하지만, 원래 주군은 10년 안에 「토역」으로 이를 정벌할 수 있습니다\n$BULLET$군웅은 한을 받들거나 역모를 꾀하며 「병탄」으로 서로 다툽니다"
 # 天朝循环大修：斗争期（chaos）改名；夺取天命决议即'终结乱世'
 situation_dynastic_cycle_phase_chaos: "군웅축록"
 situation_dynastic_cycle_claim_mandate_decision: "난세 종결"
