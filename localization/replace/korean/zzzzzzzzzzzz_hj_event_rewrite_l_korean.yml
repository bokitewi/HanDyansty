l_korean:
 tgp_interaction_event.0010.a:0 "내가 몸소 한 군을 이끌고 구원하러 가겠소."
 tgp_interaction_event.0010.b:0 "즉시 휘하 무관을 보내 구원하게 하겠소."
 tgp_interaction_event.0010.c:0 "내가 따로 뛰어난 장수를 고르게 해 주시오."
 tgp_interaction_event.0010.desc:0 "전선의 전투가 그치지 않고 군정이 위급하여 감히 알리지 않을 수 없습니다. 이제 사신을 보내 서신을 올리니, 군사를 보내 도와주시기를 간청합니다.\n\n그대가 몸소 한 군을 이끌고 와 준다면 우리 군 상하가 기댈 곳을 얻을 것이고, 다른 군무에 매여 있다면 유능한 무관 한 명에게 군사를 이끌고 달려오게 하여 함께 위기를 버티게 해 주십시오. 어디서 맞이할지, 각 부대가 어떻게 연락을 주고받을지는 그대의 답을 받는 즉시 이쪽에서 준비하겠습니다.\n\n군정은 순식간에 변하니 사신이 오래 머물 수 없습니다. 삼가 회답을 기다립니다."
