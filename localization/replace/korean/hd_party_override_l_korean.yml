l_korean:
 # 天朝循环大修·朋党：参与者组改为"身份"，覆盖原版组名与简称
 dynastic_cycle_participant_group_hegemon_ruler: "천자"
 dynastic_cycle_participant_group_other_rulers: "제후"
 dynastic_cycle_participant_group_other_rulers_desc: "[GetSituation('dynastic_cycle').GetTopSubRegion.GetName] 안에 있으면서 [son_of_heaven|E]에게 신속하지 않은 모든 독립 [rulers|E].\n\n난세에는 제국급 제후가 저마다 자국의 붕당을 거느립니다."
 dynastic_cycle_participant_group_hd_siyi_movement: "사이"
 dynastic_cycle_participant_group_hd_siyi_movement_desc: "중화에 있으면서 한 문화 전승에 속하지 않는 모든 [characters|E].\n\n사이는 조정에 관여하지 않으며, 붕당이 없고 당쟁에도 참여하지 않습니다."
 dynastic_cycle_participant_group_undecided_movement: "환관"
 dynastic_cycle_participant_group_undecided_movement_desc: "군주 곁에서 시중드는 환관입니다.\n\n#weak 신분: 엄인이거나 환관의 문생.#!"
 dynastic_cycle_participant_group_pro_hegemon_movement: "외척"
 dynastic_cycle_participant_group_pro_hegemon_movement_desc: "군주의 모족, 후비의 일족, 그리고 군주 자녀의 인척 가문입니다.\n\n#weak 신분: 성년이며 소속 가문이 군주의 후족 또는 인척이거나, 외척의 문생.#!"
 dynastic_cycle_participant_group_expansion_movement: "무훈"
 dynastic_cycle_participant_group_expansion_movement_desc: "군공으로 입신한 장교와 군진입니다.\n\n#weak 신분: 무관 군함을 지녔거나 군사 인원이거나, 3단계 이상의 군사 교육을 받았거나, 무훈의 문생.#!\n$unlockables_expansion$"
 dynastic_cycle_participant_group_conservative_movement: "세족"
 dynastic_cycle_participant_group_conservative_movement_desc: "대대로 공경을 배출한 문벌 대족입니다.\n\n#weak 신분: 호족 또는 주도 가문이거나, 세족 작위를 보유했거나, 가문 위신이 세상에 이름난 단계에 도달함.#!\n$unlockables_conservative$"
 dynastic_cycle_participant_group_advancement_movement: "한문"
 dynastic_cycle_participant_group_advancement_movement_desc: "한미한 출신으로 재학을 통해 입신한 사인과 서민입니다.\n\n#weak 신분: 다른 어떤 신분에도 속하지 않는 자.#!\n$unlockables_advancement$"
 dynastic_cycle_hd_siyi_movement: "[dynastic_cycle_era_type|E]#weak （$dynastic_cycle_participant_group_hd_siyi_movement$）#!"
 my_pro_hegemon_movement_short: "외척"
 my_expansion_movement_short: "무훈"
 my_advancement_movement_short: "한문"
 my_conservative_movement_short: "세족"
 my_undecided_movement_short: "환관"
 SELECT_FAVOR_MOVEMENT: "계파 선택"
 dynastic_cycle_tab_movements: "정치 계파"
 favor_movement_decision: "계파 우대"
