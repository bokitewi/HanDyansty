l_korean:
 hd4_wait:0 "잠시 시일을 늦추어 다시 논의해도 늦지 않다."
 hd4_close:0 "알겠다."
 HD4_TAO_STORY_STATUS:0 "도겸은 서주의 여러 군을 수습하고 있습니다. 온 주가 귀부하면 군사를 거두고 경계를 지키며 오로지 백성을 안정시키는 데 힘쓸 것입니다."
 hd4_story_tao:0 "도겸: 서주 경략"
 hd4_tao.0001.t:0 "서주 할거"
 hd4_tao.0001.desc:0 "동탁 토벌군이 저마다 흩어졌지만, 서주의 일은 하나도 미룰 수 없습니다. 각 군에서 온 서신이 책상 앞에 쌓여 있고, 병량과 수비, 지방의 분쟁이 모두 당신의 결정을 기다리고 있습니다.\n\n단양의 정예병이 이미 주치에 집결했습니다. 당신은 이 병마를 먼저 주의 경계를 안정시키는 데 써야 함을 알기에, 사람을 시켜 여러 군의 사정을 조사해 보고하게 했습니다. 한편으로는 천하를 논하면서 다른 한편으로는 다스리는 땅의 길과 성이 호령을 잃게 내버려 둘 수는 없는 노릇입니다.\n\n회맹 때에는 많은 난제를 동탁을 토평한 뒤로 미룰 수 있었습니다. 이제 그 '뒤'가 찾아왔습니다. 서주가 믿을 만한 근본이 되려면, 눈앞의 흩어진 군민과 군국을 거두어들이는 일부터 시작해야 합니다."
 hd4_tao.0002.t:0 "장패의 귀부"
 hd4_tao.0002.desc:0 "장패의 귀부 문서가 처리되었고, 그 휘하의 병사들도 당신의 지휘 아래 들어왔습니다. 보고하러 온 이는 기쁜 기색이 역력하여, 마치 이 일 하나만으로 서주가 곧 안정될 것처럼 굽니다.\n\n당신은 그에게 장패의 부중과 관할지 사정을 끝까지 말하게 한 뒤, 사람을 시켜 인수인계를 처리하게 했습니다. 주부의 호령을 받들겠다는 것은 물론 귀한 일이지만, 원래 저마다 꾸려 오던 이들이 앞으로 어떻게 서로 돕게 할지는 하나하나 상의해야 합니다.\n\n책상 위의 서주 지도에 이어 붙일 수 있는 곳이 한 군데 늘었습니다. 주의 병력이 하나로 이어지면 저마다 따로 싸우는 우환이 한 곳 줄어듭니다. 다만 명분이 정해졌어도 다스림은 여전히 몸소 행해야 하니, 서신 한 장을 전부로 여겨서는 안 됩니다."
 hd4_tao.0003.t:0 "서주 평정"
 hd4_tao.0003.desc:0 "서주의 여러 군이 마침내 모두 하나로 돌아와, 지난날 거듭 재촉해 묻던 관할지가 이제 모두 당신과 속리들의 다스림 아래 있습니다.\n\n당신은 각처의 회보를 잘 거두어 두고, 백성의 생업 복귀와 수비군의 교대에 대해 물었습니다. 원정을 계속할 이유는 언제든 새로 찾을 수 있습니다. 그러나 눈앞에 얻은 것조차 수습할 겨를이 없다면, 싸울수록 멀어져 주의 근본이 도리어 점점 비어 갈 것입니다.\n\n이제부터 당신은 스스로 새 전쟁을 일으키지 않습니다. 진행 중인 군무는 마무리해야 하고 외적이 침범하면 막아야 하지만, 새 호령은 들판과 곳간과 현청으로 더 많이 보내야 할 것입니다. 서주가 평정되었으니, 이를 지키는 데에도 온 힘을 쏟을 가치가 있습니다."
 hd4_tao_danyang_army:0 "도겸의 단양병"
 hd4_cao_laiwu_army:0 "내무 단양병"
 hd4_tao_guarding_xuzhou:0 "경내를 지키고 백성을 편안케 함"
 hd4_tao_guarding_xuzhou_desc:0 "서주의 여러 군이 이미 귀부하였으므로, 이 인물은 군사를 거두고 경계를 지키며 오로지 백성을 안정시키는 데 힘씁니다."
 hd4_tao_story_ai:0 "서주 경략"
 hd4_tao_story_ai_desc:0 "이 인물은 서주 경내를 다스리는 데 전념하며 주 밖으로 군사를 쓸 뜻이 없습니다."
 hd4_tao_continue_xuzhou_decision:0 "서주 경략 계속"
 hd4_tao_continue_xuzhou_decision_desc:0 "서주의 여러 군 가운데 아직 주부의 호령을 받들지 않는 곳이 있습니다. 그들이 스스로 귀부하기를 앉아서 기다리느니, 병마를 정비하여 가깝고 도모할 만한 곳부터 먼저 취해 주의 경계를 하루속히 하나로 잇는 편이 낫습니다."
 hd4_tao_continue_xuzhou_decision_tooltip:0 "서주 경내에서 아직 귀부하지 않은 군국에 군사를 씁니다"
 hd4_tao_continue_xuzhou_decision_confirm:0 "군을 정비하여 서주를 경략하라!"
 hd4_tao_victory_desc:0 "도겸이 대상 군국에서 적이 차지한 땅을 빼앗고, 현지 봉신들은 이에 따라 서주의 호령을 받들게 됩니다."
 hd4_tao_no_conquest_desc:0 "대상 군국은 각자 원래 상태를 유지합니다. 서주를 경략하려는 도겸의 뜻은 변함없으니, 훗날 다시 도모할 수 있습니다."
 hd4_gsz_invite.t:0 "원소의 기주 공격 초청"
 hd4_gsz_invite.desc:0 "원소가 서신을 보내 당신에게 군사를 이끌고 남하하라 청하며, 한복은 우유부단하니 도모할 만하고 기주에는 큰 기회가 있다고 합니다. 당신은 서신을 다 읽고 사신에게 일이 이루어진 뒤 땅을 어떻게 나눌지 물었지만, 그는 '협력'이라는 두 글자만 또 되풀이할 뿐입니다.\n\n본초의 문장은 늘 보기 좋지만, 정작 땅을 취하려면 당신의 기병이 먼저 나가 길을 열어야 합니다. 그렇다 해도 그가 경영하는 것을 끝내 앉아서 지켜보기만 한다면, 훗날 기주가 누구의 근본이 될지 당신이 다시 느긋하게 상의할 수 있으리라는 보장도 없습니다.\n\n당신은 서신을 지도 옆으로 밀어 두었습니다. 사신은 아직 당 아래에서 답장을 기다리고 있으니, 본초가 이 답장을 대체 얼마나 애타게 기다리는지 당신도 알고 싶어집니다."
 hd4_gsz_accept:0 "본초의 초청에 응하여 남하해 기주를 도모한다."
 hd4_gsz_defeat_desc:0 "공손찬이 패하여 자결하자, 휘하에서 군현을 차지하고 있던 자들은 머지않아 저마다 흩어져 자립했습니다."
 hd4_gsz_end.t:0 "공손씨의 패망"
 hd4_gsz_end.desc:0 "공손찬이 패하여 죽었다는 소식이 마침내 전해졌습니다. 이전까지 그의 호령을 받들던 각처의 부하들 가운데 어떤 이는 문을 닫고 스스로 지키며, 어떤 이는 사신을 보내 따로 의탁할 곳을 찾으니, 군보에 실린 깃발이 예전보다 훨씬 어지러워졌습니다.\n\n당신은 소식을 전한 이에게 각지의 사정을 나누어 분명히 말하게 했습니다. 주장 한 사람의 죽음은 본래 하나로 이어져 있던 주군이 갑자기 호령을 잃게 할 수는 있어도, 그 수장들과 병사들까지 함께 사라지게 하지는 못합니다. 유주의 옛 세력이 이미 무너졌으니, 새로운 쟁탈이 곧 이 틈새를 따라 펼쳐질 것입니다.\n\n당신은 군보를 받아 두고, 지도 위에 아직 고치지 않은 깃발들을 바라보았습니다. 어제까지만 해도 하나로 경계해야 할 세력이었던 것을, 오늘부터는 한 곳 한 곳 다시 헤아려야 합니다."
 hd4_north_two.t:0 "북방의 두 영웅"
 hd4_north_two.desc:0 "새로 보내온 북방 지도에서 지난날 저마다 한 지방을 차지하던 깃발들이 점점 드물어졌습니다. 이제 북쪽 땅의 여러 현은 모두 조조와 원소 두 집안에 돌아가, 경계는 예전보다 분명해졌지만 서로 운신할 여지는 오히려 더 좁아졌습니다.\n\n당신은 군리들이 곳곳의 상황을 아뢰는 것을 들으며 새 보고와 옛 보고를 맞추어 보았습니다. 예전에는 작은 적을 먼저 상대하고 다른 강한 이웃의 도움을 빌릴 수도 있었지만, 이제는 어떻게 군사를 움직이든 결국 맞은편의 그 집안을 피해 갈 수 없습니다.\n\n장막 안에서 누군가 젊은 날 함께 군사를 일으키던 일을 꺼내다가 반쯤 말하고는 입을 다물었습니다. 우정은 기억 속에 남겨 둘 수 있으나, 양도와 병세는 모두 눈앞에 놓여 있습니다. 앞으로의 북방은 더 이상 두 집안이 저마다 제 경영만 돌보도록 놓아두지 않을 것입니다."
 hd4_guandu_invite.t:0 "하북 통일"
 hd4_guandu_invite.desc:0 "장막 안에서 이리저리 논의한 끝에 결국 원소라는 이름 하나만 남았습니다. 당신은 붓을 내려놓고 장수들이 먼저 말을 다 하게 했습니다. 어떤 이는 북진을 더 기다릴 수 없다 하고, 어떤 이는 군량을 거듭 따져 보고 있으며, 두 집안의 옛 약속까지 다시 들춰졌습니다.\n\n본초는 집안이 크고 기업이 커서 눈앞으로 밀려들 때의 기세야 물론 볼만합니다. 그러나 당신은 기세만으로 이 북방의 우열을 그에게 인정해 주고 싶지 않습니다. 먼저 변경의 길을 뚫어야 하북으로 손을 뻗을 자리가 생깁니다.\n\n당신은 눈을 들어 사람들을 둘러보았습니다. 북벌의 논의가 정해지느냐 마느냐는, 결국 당신의 이 붓이 어디에 떨어지느냐에 달려 있습니다."
 hd4_guandu_accept:0 "북벌을 결정하고 본초와 결판을 낸다."
 hd4_guandu_victory_desc:0 "조조가 변경의 여러 군에서 원소 측이 차지한 땅을 빼앗고 원소의 작위에 대해 [pressed_claims|E](을)를 얻습니다. 원소는 근심과 분노로 병이 들어 큰 타격을 입으며, 그가 죽은 뒤 남은 기업은 여러 아들이 나누어 차지하게 됩니다."
 hd4_guandu_defeat_desc:0 "조조가 패하여 돌아가고, 원소가 거꾸로 조조의 작위에 대해 [pressed_claims|E](을)를 얻습니다."
 hd4_guandu_white_peace_desc:0 "두 집안이 군사를 거두고 화친하여, 관도의 다툼은 이로써 끝납니다."
 hd4_guandu_win.t:0 "관도의 승전"
 hd4_guandu_win.desc:0 "승전을 알리러 온 이가 단숨에 많은 지명을 읽어 내려가다가, 나중에는 숨이 찰 지경이었습니다. 당신은 웃으며 천천히 하라 이르고, 새로 얻은 변경의 군국을 지도에 표시하게 했습니다.\n\n이번 싸움은 마침내 이겼습니다. 원소에게는 아직 하북이 있지만, 당신은 더 이상 제자리에 서서 그가 밀려오기를 기다릴 필요가 없습니다. 좌우가 막 축하의 말을 이으려 하자, 당신은 먼저 쓸 수 있는 병력이 얼마나 남았는지, 양도는 언제 통하는지 물었습니다. 아무리 좋은 축사라도 전군에 군량 한 수레를 더 실어 나르지는 못합니다.\n\n지도 위에 아직 얻지 못한 땅들이 그대로 있고, 당신의 눈길은 경계를 따라 북쪽으로 한참 나아갔습니다. 명분은 이미 손에 넣었으나 성문은 하나하나 열어야 합니다. 오늘은 먼저 승리의 성과를 굳게 다지고, 본초에게 할 말은 앞으로 얼마든지 있습니다."
 hd4_guandu_loss.t:0 "관도 수성"
 hd4_guandu_loss.desc:0 "조조가 패퇴했다는 소식이 전해지자, 장막 안에 감돌던 불안한 속삭임이 갑자기 모두 축하의 말로 바뀌었습니다. 당신은 그들의 말을 한동안 듣고서야 전령을 불러 전과를 처음부터 아뢰게 했습니다.\n\n맹덕은 기세를 타고 북쪽으로 올 수 있다고 여겼으나, 이제는 원씨의 무게를 다시 헤아려야 할 것입니다. 당신은 사람을 시켜 그의 여러 명위를 하나하나 기록하게 했습니다. 이것이 곧 훗날 토벌의 근거가 될 것입니다. 땅이 아직 모두 당신 손에 들어오지는 않았으나, 당신이 여기서 그만둘 생각이 없다는 것을 먼저 모두에게 알려 두어도 좋을 것입니다.\n\n당신은 전보를 책상 위에 다시 내려놓고, 병력을 점검하고 경계를 다시 살피게 했습니다. 오늘의 승리를 요행히 화를 피한 것처럼 말할 필요는 없습니다. 북방의 일은 아직 조조가 당신 대신 정할 차례가 아닙니다."
 hd4_yuan_grief:0 "관도 패전 후의 중상"
 hd4_yuan_grief_desc:0 "관도의 패배로 이 인물은 근심과 분노로 병이 들어 몸과 마음이 모두 상했습니다."
 hd4_yuan_grief.t:0 "울화가 치밀어 오름"
 hd4_yuan_grief.desc:0 "관도의 패보는 이미 읽었지만, 가슴속의 답답한 아픔은 문서를 덮는다고 흩어지지 않았습니다. 잃은 변경의 군국이 하나하나 보고되자, 장막 안의 모두가 평소보다 말을 천천히 합니다. 마치 지명 하나를 더 읽으면 당신이 견디지 못할까 두려워하는 듯합니다.\n\n당신은 일어나려 했지만, 몸이 마음보다 먼저 무너져 내렸습니다. 예전에는 밤늦도록 다툴 수 있던 군의도 이제는 얼마 듣지 않아 피로가 몰려옵니다. 누군가 여러 아들의 훗날 안배를 꺼냈다가 곧바로 말을 거두었습니다.\n\n북방의 대업은 아직 결론이 나지 않았는데, 다른 이들은 벌써 당신의 사후를 셈하기 시작했습니다. 당신은 아직 거두지 않은 지도를 바라보며 그들을 꾸짖어 물리려 입을 열었지만, 결국 등불을 좀 더 가까이 옮기라고만 일렀습니다."
 hd4_yuan_partition.t:0 "원씨의 분국"
 hd4_yuan_partition.desc:0 "아버지가 남긴 영지의 분배가 결정되었습니다. 당신 앞에 놓인 장부에는 이제부터 당신 홀로 맡을 곳들이 분명히 적혀 있습니다. 형제들은 저마다 설 땅을 얻었고, 더는 한 사람의 호령을 함께 듣지 않습니다.\n\n당신은 익숙한 현의 이름들을 바라보다가, 문득 그것들이 어제와 달라졌다고 느낍니다. 예전에는 다툼이 생기면 아버지의 책상 앞으로 가져갈 수 있었지만, 이제는 서로 어떻게 왕래할지, 옛 부하들이 누구의 지휘를 받을지 모두 각 집안이 새로 정해야 합니다. 원씨라는 성은 바뀌지 않았으나, 모두를 잠시나마 물러서게 할 수 있던 그 사람은 이미 없습니다.\n\n문밖에서는 누군가 새 군령을 기다리고 있습니다. 당신은 분배 문서를 거두어 두었습니다. 눈앞의 이 기업이 이미 자기 손에 넘어왔으니, 앞으로 그 안위는 스스로 짊어져야 합니다."
 hd_cao_chain.0094.t:0 "내무에서 무리를 정비하다"
 hd_cao_chain.0094.desc:0 "내무성 밖에 또 막사가 늘었다. 종족과 옛 부하들의 소식이 잇달아 전해지니, 올 수 있는 이들은 저마다 부곡과 가산을 이끌고 왔고, 직접 오지 못하는 이들도 사람을 보내 군중에 부족한 것이 무엇인지 물었다. 며칠 전만 해도 길목마다 추격하는 기병을 경계해야 했는데, 이제는 당신의 명령을 기다리는 이들이 있다.\n\n돈과 곡식, 단양병의 명부가 책상 앞에 올라오자, 당신은 하나하나 살펴본 뒤 지도의 한 귀퉁이에 눌러 두었다. 발 디딜 곳이 이미 생겼으니, 이제 해야 할 일은 동탁의 추적을 피하는 것만이 아니다. 사방에 흩어진 분노를 누군가는 군령과 군량 길, 그리고 기꺼이 앞으로 나아갈 대오로 바꾸어야 한다.\n\n당신은 진영에 대오를 다시 정비하라고 명했다. 천하가 아직 정해지지 않았으니, 조씨는 잠시 몸 둘 곳을 얻은 도망자 집안으로만 머물러서는 안 된다."
 hd_cao_chain.0094.a:0 "내무를 기반으로 삼아 군을 정비하고 출격을 기다리라."
 hd_cao_chenliu_danyang_army:0 "내무 단양병"
 hd4_tao.0001.a:0 "먼저 주의 경계를 안정시키고, 나머지는 그 뒤에 도모한다."
 hd4_tao.0002.a:0 "선고가 왔으니 서주의 근심이 하나 줄었도다."
 hd4_tao.0003.a:0 "군사를 거두고 경계를 지키며 백성과 함께 쉰다."
 hd4_north_two.a:0 "하북의 일은 결국 결판을 내야 하리라."
 hd4_guandu_win.a:0 "승세를 타고 북쪽을 바라보니, 하북을 도모할 만하도다."
 hd4_guandu_loss.a:0 "맹덕이 물러갔으니, 훗날 다시 그와 셈하리라."
 hd4_yuan_grief.a:0 "하늘이 나를 돕지 않으니, 어찌하랴!"
 hd4_yuan_partition.a:0 "선친의 기업은 마땅히 지켜야 하리라."
 hd4_gsz_end.a:0 "백규가 죽었으니 북쪽에는 근심이 없도다."
