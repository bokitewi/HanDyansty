l_korean:
 hds.1000.t:0 "형주에 발을 딛다"
 hds.1000.desc:0 "동탁 토벌군이 저마다 주군으로 돌아가자, 지난날 회맹 때 서로 양보하던 일들도 이제는 모두 다시 상의해야 합니다. 형주 또한 명위가 적힌 종이 한 장만으로 각처의 병사와 관서가 저절로 안정되지는 않습니다.\n\n당신은 주 안의 지도를 앞에 펼치고, 향리 사정에 밝은 사인들에게 길과 인심을 설명해 달라고 청했습니다. 어떤 이는 거느린 병사는 적어도 수륙의 요충을 틀어쥐고 있고, 어떤 이는 결코 나서지 않지만 그 종족과 빈객의 말은 여러 현에 두루 퍼집니다. 밖에서 온 호령만으로 하나하나 굴복시키려 한다면, 인내심을 갖고 그들과 교분을 맺는 것보다 빠르다고 할 수 없습니다.\n\n먼저 형주에 발을 디딘 뒤 여러 군을 수습해야 합니다. 천하가 이미 어지러우니, 무엇보다 다스리는 이들에게 내일 어디서 명을 들어야 할지 알려 주어야 합니다."
 hds.1000.a:0 "형주를 맡아, 먼저 주의 사인들과 교분을 맺는다."
 hds.1001.t:0 "괴월의 귀부"
 hds.1001.desc:0 "괴월이 온 뜻이 마침내 분명해졌습니다. 그는 자신이 거느린 땅을 당신의 지휘 아래 두고, 당신과 맹약을 맺어 함께 형주를 안정시키고자 합니다.\n\n당신은 서둘러 말을 다 하지 않고, 그에게 그곳의 병사와 길, 어려움을 하나하나 말해 달라고 청했습니다. 이도는 향리 사정에 밝아, 주부의 장부에 이름 하나만 적혀 있던 이들이 그의 입을 거치면 저마다 내력과 얽힌 관계가 드러납니다. 이들이 같은 호령을 받들게 하는 일은 문서 한 곳의 서명을 고친다고 될 일이 아닙니다.\n\n어스름이 당 안에 들 무렵에야 인수인계가 결정되었습니다. 당신은 그를 위해 자리 하나를 남겨 두고, 훗날 서로 돕겠다는 약속도 남겼습니다. 형주의 뿌리는 바로 이렇게 기꺼이 마주 앉아 함께 논의하는 이들에게서부터 내리게 될 것입니다."
 hds.1001.a:0 "귀부를 받아들이고 이도와 맹약을 맺는다."
 hds.1002.t:0 "채모의 귀부"
 hds.1002.desc:0 "채모가 휘하를 이끌고 귀부하겠다는 소식이 전해지자, 주의 일에 기댈 곳이 한 군데 더 늘었습니다. 당신은 사람을 보내 그를 논의 자리에 청하고, 예의 바른 인사말을 먼저 갖출 것 없이 거느린 인마와 땅에 대해서만 분명히 말하게 했습니다.\n\n형주의 길은 강한을 따라 이어져 있어, 한 곳의 관문이나 나루가 막히면 이웃 군현도 홀로 안정되기 어렵습니다. 덕규가 귀부하니 병력이 한몫 늘었을 뿐 아니라, 원래 저마다 호령하던 이들이 한자리에 앉아 수비를 함께 논의할 수 있게 되었습니다.\n\n당신은 앞의 지도를 그에게 좀 더 가까이 밀어 주었습니다. 앞으로 어떻게 단속하고 어떻게 서로 도울지는 오늘 분명히 해 두어야 합니다. 그래야 각자 돌아간 뒤에 같은 만남을 두 가지 약속으로 말하는 일이 없을 것입니다."
 hds.1002.a:0 "채씨의 부하들을 받아들이고 덕규와 맹약을 맺는다."
 hds.1003.t:0 "형주 평정"
 hds.1003.desc:0 "주 안의 마지막 인수인계 문서들이 마침내 모두 도착했습니다. 형주의 여러 군이 이제 모두 당신의 지휘 아래 들어왔고, 예전에는 사신을 보내 거듭 물어야 했던 곳들도 같은 절차에 따라 사무를 보고하기 시작했습니다.\n\n좌우의 누군가가 이 기세를 타서 밖으로 진군하자고 말을 꺼냈지만, 당신은 먼저 각 현의 창고와 수비를 물었습니다. 성 하나를 취하는 것은 군세로 할 수 있으나, 손에 넣은 땅이 다시 어지러워지지 않게 하려면 겉으로 드러나지 않는 수고를 훨씬 많이 들여야 합니다. 새로 귀부한 관리들, 지방의 옛 일족들, 병사와 백성 모두가 주부가 다음에 그들에게 무엇을 요구할지 지켜보고 있습니다.\n\n당신은 원정에 대한 논의를 잠시 눌러 두었습니다. 형주가 평정되었으니 앞으로는 경계를 지키는 것을 우선해야 합니다. 이미 벌어진 전쟁은 마무리해야 하고, 쳐들어오는 적도 앉아서 보고만 있을 수는 없습니다."
 hds.1003.a:0 "경계를 지키고 백성을 안정시키며, 더는 원정하지 않는다."
 hds.2000.t:0 "남양으로 탈출"
 hds.2000.desc:0 "동탁의 갑사들이 또 부문 밖을 지나갔고, 수레바퀴 소리가 멎은 뒤로 당 안에서는 말소리마저 낮아졌습니다. 일에 휘말릴까 두려워하는 좌우의 표정을 보니, 낙양에 하루라도 더 머물고 싶지 않습니다.\n\n원씨의 문벌이 어찌 그가 길을 열어 주느냐 마느냐에 기대어 유지되어야 한단 말입니까? 완성에는 기댈 만한 장원이 있고, 집안 식솔도 함께 옮겨 갈 수 있습니다. 여기 남아 권세를 잃은 공경들과 함께 고개를 숙인다면, 정말로 당신에게 갈 길이 없는 것처럼 보일 것입니다.\n\n서리가 짐 목록을 받쳐 들고 오자, 당신은 먼저 가산과 수행할 식솔부터 점검하게 했습니다. 가져갈 수 없는 저택은 그냥 두면 됩니다. 훗날 당신을 만나러 남양으로 오려는 이들이 절로 생길 테니, 모두 동탁의 문 앞에 몰려 있을 필요는 없습니다."
 hds.2000.a:0 "가업을 완으로 옮겨 이 시비의 땅을 떠난다."
 hds.2001.t:0 "손견의 귀순"
 hds.2001.desc:0 "손견이 당신을 위해 남양을 취하겠다고 하자, 당신은 사람을 시켜 술을 더 따르게 했습니다. 문대는 말을 에두르지 않고, 병사를 데려올 수도 있고 일도 기꺼이 맡으니, 빈 이름만 받쳐 들고 찾아오는 자들보다 훨씬 낫습니다.\n\n그가 원래의 직무와 손씨 가업의 인계에 대해 말하자, 당신은 듣고 고개를 끄덕였습니다. 남양의 옛 태수는 길을 비켜 준다면 그만이고, 그러지 않는다면 문대의 칼이 오가는 문서보다 늘 빨랐습니다.\n\n당신은 지도를 그에게 밀어 주었습니다. 원씨에게는 기반이 있고 손씨에게는 날랜 병사가 있으니, 서로 필요한 것을 취하면 마침 한바탕 대업을 이룰 수 있습니다. 남양이 정해지고 나면, 오가는 이들은 이곳이 더 이상 예전의 호령 아래 있지 않음을 저절로 알게 될 것입니다."
 hds.2001.a:0 "문대의 병사를 빌려 남양 땅을 취한다."
 hds.2002.t:0 "남양 자립"
 hds.2002.desc:0 "동탁 토벌 연맹은 흩어졌고, 예전에 함께 나아가고 물러서던 명분도 점점 무게를 잃었습니다. 책상 위에는 여전히 회맹 때 남긴 문서가 놓여 있지만, 문밖에서 묻는 것은 이미 남양의 앞으로의 병량과 경계입니다.\n\n당신은 옛 맹약서를 거두어 두었습니다. 원씨는 이곳에 가업이 있고 부하가 있으며, 이웃 주에 목소리를 낼 만한 병력도 있습니다. 여전히 모든 일을 지난날의 맹주가 정해 주기를 기다린다면, 눈앞의 기회를 남에게 넘겨줄 뿐입니다.\n\n예주와 양주가 모두 당신의 경략 대상이지만, 첫걸음은 예주부터 살펴야 합니다. 남양은 발을 디딜 땅이지, 낙양의 풍파를 잠시 피하는 객사여서는 안 됩니다. 당신은 사람을 시켜 군의를 새로 마련하게 했습니다. 이제부터는 자기 가문의 기업을 위해 명을 내립니다."
 hds.2002.a:0 "남양을 근거로 자립하고, 먼저 예주를 도모한다."
 hds.3000.t:0 "손안의 옥새"
 hds.3000.desc:0 "동탁 토벌전에서 승리하자 여러 군대가 잇달아 군사를 거두었습니다. 전국옥새가 돌고 돌아 당신 손에 들어왔을 때, 곁의 사람들은 먼저 숨을 죽였습니다. 마치 이 옥이 장막 밖에 아직 흩어지지 않은 병마보다 더 무겁다는 듯이.\n\n당신이 그것을 뒤집어 자세히 살피니, '수명어천 기수영창' 여덟 글자가 등불 아래 빛납니다. 출병할 때 내건 것은 한 왕실을 떠받친다는 기치였는데, 이제 천자의 권위를 상징하는 물건이 자기 손에 떨어졌으니, 앞으로 숨기든 드러내든 더는 평범한 물건처럼 다룰 수 없습니다.\n\n누군가 무언가 말하려다 그만두자, 당신이 먼저 함 뚜껑을 닫았습니다. 옥새를 쥐었다고 사방이 곧 명을 따르는 것은 아닙니다. 그러나 소식이 한번 새어 나가면, 이를 노리는 자들은 당신이 이치를 다 따져 볼 때까지 기다려 주지 않을 것입니다. 이 물건은 먼저 잘 보관해 두어야 합니다."
 hds.3000.a:0 "옥새를 보관하고 누설을 삼가 막는다."
 hds.4000.t:0 "부업 계승"
 hds.4000.desc:0 "집안의 옛 물건들이 하나하나 당신 앞으로 옵니다. 인계하러 온 이는 여전히 버릇처럼 아버지를 부르다가, 말을 반쯤 하고서야 허둥지둥 고쳐 말합니다. 당신은 재촉하지 않고, 그가 그 호칭을 삼킬 때까지 기다렸습니다.\n\n장부에 적힌 장원과 명위는 이제 모두 당신이 이어받습니다. 아버지가 남긴 사람들도 그대로 있고, 하려다 이루지 못한 일들도 그대로 있습니다. 다만 더는 윗자리에 앉아 당신 대신 마지막 한마디를 해 줄 사람이 없을 뿐입니다.\n\n장부를 펼쳤지만 얼마 보지도 않아 그 숫자들이 답답해 가슴이 조여 오니, 아예 옛 부하들을 가까이 불러 일을 논의하게 했습니다. 손씨가 당신이 지켜보기만 하는 살림살이 더미로만 남을 수는 없습니다. 먼저 부업을 굳건히 이어받고, 앞으로의 길은 당신이 직접 걸어 나가야 합니다."
 hds.4000.a:0 "아버지가 남긴 기업을 이어받아 감히 무너뜨리지 않으리라."
 hds.4001.t:0 "강동으로 방향을 틀다"
 hds.4001.desc:0 "원술의 군령이 또 책상 위에 놓였지만, 당신은 몇 줄만 보고 옆으로 밀어 두었습니다. 아버지가 남긴 사람들이 언제까지나 남을 위해 뛰어다녀야 한단 말입니까? 손씨의 깃발은 영원히 남의 깃발 뒤만 따라야 한단 말입니까?\n\n강동의 지도를 펼치고, 당신은 손가락 마디로 양주가 있는 곳을 두드렸습니다. 이곳을 떠나면 손씨의 얼마 안 되는 장원도 더는 붙들지 않고, 아버지의 옛 부하들을 데리고 역양에 진영을 세울 것입니다. 부족한 병사는, 옥새가 아직 있다면 그것으로 원술과 바꾸면 됩니다. 그는 함 속의 그 옥을 중히 여기고, 당신이 원하는 것은 당신을 따라 앞으로 나아갈 갑사들입니다.\n\n옥새가 이미 손에 없다 해도, 이대로 제자리에 주저앉을 수는 없습니다. 당신은 사람을 시켜 부하들을 점검하게 했습니다. 떠날 뜻은 이미 굳었으니, 남은 것은 이 한 걸음을 어떻게 내딛느냐뿐입니다."
 hds.4001.a:0 "원술에게 작별을 고하고 군사를 이끌고 동쪽으로 건너간다."
 hds.4002.t:0 "주유의 귀순"
 hds.4002.desc:0 "주유가 왔다는 말을 듣자, 당신은 책상 위의 군보를 밀어 두고 일어나 맞으러 나갔습니다. 공근이 예를 다 올리기도 전에 당신은 이미 그를 붙들고 함께 온 병사들에 대해 묻느라, 남들이 준비해 둔 인사말이 끼어들 틈조차 남기지 않았습니다.\n\n그가 데려온 병마도 물론 반갑지만, 더 반가운 것은 마침내 당신과 마주 앉아 강동의 계획을 처음부터 시원하게 이야기할 사람이 생겼다는 것입니다. 그의 옛 직무와 가업은 맡아 처리할 사람이 따로 있지만, 눈앞의 이 지도는 더 기다릴 필요가 없습니다.\n\n둘은 나루에서 양도까지 이야기하다가, 진군 방향 한 곳을 두고 몇 마디 다투기도 했습니다. 가슴에 오래 쌓였던 답답함은 어느새 흩어져 있었습니다. 공근이 왔으니, 마음속으로만 굴리던 많은 일들을 마침내 꺼내어 실행할 수 있게 되었습니다."
 hds.4002.a:0 "공근과 그 병사들을 맞이하여 함께 강동을 논한다."
 hds.4003.t:0 "먼저 단양을 취하다"
 hds.4003.desc:0 "“먼저 단양을 취한다.” 당신이 지도에 손을 짚자, 장막 안의 몇 사람이 그 손을 따라 시선을 옮겼습니다. 방금까지 양주 곳곳에 흩어져 있던 논의가 마침내 발 디딜 곳을 찾았습니다.\n\n원술을 떠난 뒤로 당신은 손씨가 어디로 갈 것이냐는 남들의 물음을 질리도록 들었습니다. 단양에는 산천과 관문, 나루가 있고, 땅을 차지하고 스스로 지키는 호족들도 있습니다. 눈앞의 이 상대를 먼저 치고 나머지는 하나씩 정리하면 됩니다. 군 전체를 얻지 못했다고 첫걸음조차 내딛지 못해서야 되겠습니까.\n\n장막 밖의 병사들은 이미 명을 기다리고 있으니, 당신도 더는 앉아서 지도 위의 성들을 세고 있고 싶지 않습니다. 강동은 남이 내어 주어야 생기는 땅이 아닙니다. 먼저 단양에 발을 디딘 뒤, 손씨의 깃발이 어디까지 갈 수 있는지 그들에게 보여 줄 것입니다."
 hds.4003.a:0 "단양을 우선하여 군을 정비하고 진취한다."
 hds.4004.t:0 "단양에 발을 딛다"
 hds.4004.desc:0 "단양 각처의 인계 보고가 마침내 모두 도착했습니다. 당신은 지도에서 아직 다른 집안 소속으로 표시된 곳들을 하나하나 고치게 했고, 손씨의 강토가 하나로 이어지는 것을 보니 공을 칭송하는 말을 듣는 것보다도 통쾌했습니다.\n\n누군가 군의를 잠시 쉬어도 되겠느냐고 물었지만, 당신은 대답하지 않고 양주의 지도를 조금 더 펼쳤을 뿐입니다. 단양이 평정되어 양도와 성읍에 마침내 근본이 생겼지만, 그 뒤로도 여러 군이 남아 있고, 당신이 여기서 멈추기를 지켜보는 이들도 있습니다.\n\n새로 얻은 땅을 안정시켜야 하고 다음 용병에도 분별이 있어야 한다는 것은 당신도 물론 압니다. 그러나 책상 위의 지도를 서둘러 말아 둘 필요는 없습니다. 어렵사리 자신만의 발판을 얻은 것이, 어찌 이로써 더는 나아가지 않기 위함이겠습니까?"
 hds.4004.a:0 "단양을 근본으로 삼아 양주를 도모한다."
 hds_sc_heavy_army:0 "강동 중보병"
 hds_sc_light_army:0 "주유의 강동 의종"
 hds_sc_base_army:0 "손씨의 강동 옛 부하"
 hds_war_victory_desc:0 "공격 측이 대상 군 안에서 적이 차지한 땅을 빼앗고, 현지 봉신들은 이에 따라 소속을 바꿉니다."
 hds_war_no_conquest_desc:0 "이 전쟁으로 얻은 것이 없어 각자 원래의 경계를 지킵니다. 다시 때가 오면 또 도모할 수 있습니다."
 hds_liu_guarding_jingzhou:0 "형주 수성"
 hds_liu_guarding_jingzhou_desc:0 "형주의 여러 군이 모두 지휘 아래 들어왔으므로, 이 인물은 이제부터 경계를 지키고 백성을 안정시키며 원정할 뜻이 없습니다."
 hds_southern_campaign_ai:0 "남방 역사적 진취"
 hds_southern_campaign_ai_desc:0 "이 인물은 땅을 차지하고 스스로 웅거하며, 늘 사방으로 군사를 쓸 생각을 합니다."
