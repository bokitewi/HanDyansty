l_korean:
 hds_sj_heavy_army:0 "손씨의 강동 중보병"
 HDS_WU_INVASION_WAR_NAME:0 "손씨의 단양 진취 전쟁"
 hds.5000.t:0 "자립의 뜻"
 hds.5000.desc:0 "여러 해 동안 원술을 위해 뛰어다니며 당신 휘하의 사람들은 당신을 따라 각지를 전전했지만, 당신 이름으로 된 것은 여전히 장원 한 곳뿐입니다. 부하들을 점검할 때마다 장막 밖에서 누군가 낮은 목소리로 묻습니다. 우리는 대체 누구를 위해 싸우는가?\n\n강동의 지도가 책상 머리에 펼쳐져 있습니다. 단양은 산천이 종횡으로 얽혀 있지만, 땅을 차지하고 스스로 지키는 자들을 무찌르지 못할 것도 없습니다. 자신의 땅은 결국 스스로 취해야 합니다. 남의 깃발 아래에서는 영원히 남이 먹다 남긴 찌꺼기만 나눠 받을 뿐입니다.\n\n당신은 원술의 최근 군령을 옆으로 밀어 두고, 오랫동안 말이 없었습니다."
 hds.5000.a:0 "더는 남의 울타리 아래 기대지 않으리라. 스스로 단양을 취하겠다!"
 hds.5000.b:0 "아직 때가 아니니, 잠시 더 참으리라."
 hds.5001.t:0 "손견 모살 음모"
 hds.5001.desc:0 "손견이 당신을 버리고 떠나 자립의 깃발을 세웠습니다. 더 중요한 것은 전국옥새가 아직 그의 손에 쥐어져 있다는 사실입니다.\n\n유표의 사신은 이미 이틀째 청 밖에서 기다리고 있으며, 서신의 내용은 분명합니다. 이자가 강동을 얻고 옥새까지 얻는다면 더는 누구의 호령도 듣지 않으리라는 것입니다. 형주와 당신 사이에는 묵은 원한이 없지만, 지금은 같은 적을 두고 있습니다.\n\n당신은 붓을 들어 단 몇 마디로 답장을 썼습니다. 일이 이루어진 뒤 각자 필요한 것을 취하자고."
 hds.5001.a:0 "경승과 함께 문대를 도모하기로 약조한다."
 hds.5002.t:0 "풍문"
 hds.5002.desc:0 "요즘 진영에 낯선 얼굴이 늘었고, 오가는 전령들도 예전보다 잦아졌습니다. 누군가 몰래 한마디 전갈을 가져왔습니다. 원술과 유표 사이에 당신과 관련된 일이 논의되고 있는 듯하다는 것입니다.\n\n옥새가 당신 손에 있다는 것은 이미 천하가 다 아는 일입니다. 이런 날이 오리라 생각하지 않은 것은 아니지만, 이렇게 빨리 올 줄은 몰랐습니다.\n\n당신은 경계를 강화하라고 명했지만, 형양과 원술 양쪽을 한꺼번에 막아 낼 수는 없습니다."
 hds.5002.a:0 "군사가 오면 장수로 막으면 그만, 무엇을 걱정하랴."
 hds.5003.t:0 "현산의 화"
 hds.5003.desc:0 "당신은 경기병을 이끌고 진영을 나서 형양의 허실을 살피려 했는데, 산길 양쪽에서 갑자기 화살이 비처럼 쏟아졌습니다.\n\n황조의 복병이 진작부터 숲속에서 기다리고 있었고, 퇴로는 끊겼으며, 따르던 이들이 하나둘 쓰러졌습니다. 어지러이 날아드는 화살 속에서 칼을 뽑아 든 당신은, 문득 진영에 전해졌던 그 전갈과 지금 이 순간 원술과 유표가 짓고 있을 웃음을 떠올립니다.\n\n옥새는 결국 주인을 바꾸게 되는구나."
 hds.5003.a:0 "강동으로 돌아가지 못함이 한스럽구나!"
