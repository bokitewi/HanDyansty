l_korean:
 # 原版丝路参与组说明中的旧六区引用必须覆盖
 silk_road_situation_participant_group_china_realm_desc:0 "이 인물은 비단길 동부 구간에 영지를 가진 비[nomadic|E] [independent_ruler|E]입니다."
 silk_road_situation_participant_group_silk_road_domain_desc:0 "이 인물은 비[nomadic|E] [ruler|E]이며, 그 [domain|E](이)가 [GetGeographicalRegion('dlc_tgp_silk_road_route_region').GetName] 위에 직접 위치합니다."
 silk_road_situation_participant_group_silk_road_realm_desc:0 "이 인물은 비[nomadic|E] [ruler|E]이며, 그 [realm|E]의 일부가 [GetGeographicalRegion('dlc_tgp_silk_road_route_region').GetName](와)과 연결되어 있습니다."
 silk_road_situation_participant_group_silk_road_periphery_desc:0 "이 인물은 비[nomadic|E] [ruler|E]이며, [GetGeographicalRegion('tgp_silk_road_region').GetName] 안에 있지만 더 직접적인 비단길 참여 그룹에는 속하지 않습니다."
 visit_silk_road_market_decision_changan:0 "$building_changan_market_01$ #weak （[GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_eastern_section').MakeScope.Var('innovation').CultureInnovationType.GetName]）#!"

 # 仍在使用的运河催化剂改用四区键
 catalyst_silk_road_china_grand_canal_expanded_desc:0 "$great_project_type_grand_canals$ [great_project|E] 완공 #weak ([GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_eastern_section').GetName])#!"
 catalyst_silk_road_china_grand_canal_expanded_secondary_desc:0 "$great_project_type_grand_canals$ [great_project|E] 완공 #weak ([GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_middle_northern_route').GetName], [GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_middle_southern_route').GetName])#!"
 catalyst_silk_road_china_grand_canal_expanded_tertiary_desc:0 "$great_project_type_grand_canals$ [great_project|E] 완공 #weak ([GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_western_section').GetName])#!"

 # 保留原版大草原显示名，只覆盖三个项目地图说明
 the_great_steppe_sub_region_steppe_west_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak 서부 초원은 양주의 여러 군을 아우릅니다. 하서 일대는 동쪽으로 중원과 이어지고 서쪽으로 서역과 통하며, 물과 풀의 풍흉, 가뭄과 혹한이 늘 가축 무리의 생장과 이동을 좌우합니다.#!"
 the_great_steppe_sub_region_steppe_central_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak 중부 초원은 병주의 여러 군을 아우릅니다. 이곳은 농경 중심지와 북방 초원 사이에 있어 산과 계곡과 변새가 뒤얽혀 있으며, 물과 풀을 따라 옮겨 사는 생업을 길러 냈습니다.#!"
 the_great_steppe_sub_region_steppe_east_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak 동부 초원은 유주의 여러 군을 아우릅니다. 연산 남북과 요서 변경은 동북 초원으로 통하는 관문이며, 계절의 변화가 목장의 비옥함과 유목 부족의 향방을 좌우합니다.#!"
