l_english:
 dynastic_cycle_participant_group_other_rulers:0 "Regional Lords"
 dynastic_cycle_participant_group_other_rulers_desc:0 "All independent [rulers|E] within [GetSituation('dynastic_cycle').GetTopSubRegion.GetName] who are not subject to the [son_of_heaven|E].\n\nIn the age of chaos, each empire-tier lord has the Factions of their own realm."
 dynastic_cycle_participant_group_hd_siyi_movement:0 "Four Barbarians"
 dynastic_cycle_participant_group_hd_siyi_movement_desc:0 "All [characters|E] living in China who are not of Han cultural heritage.\n\nThe Four Barbarians take no part in court affairs; they have no Factions and do not join factional struggles."
 dynastic_cycle_participant_group_undecided_movement:0 "Eunuchs"
 dynastic_cycle_participant_group_undecided_movement_desc:0 "The castrated attendants who serve at the ruler's side.\n\n#weak Identity: a eunuch, or a protege of the Eunuchs.#!"
 dynastic_cycle_participant_group_pro_hegemon_movement:0 "Consort Kin"
 dynastic_cycle_participant_group_pro_hegemon_movement_desc:0 "The ruler's maternal clan, the clans of empresses and consorts, and the clans related by marriage to the ruler's children.\n\n#weak Identity: an adult whose house is the ruler's consort clan or in-law clan, or a protege of the Consort Kin.#!"
 dynastic_cycle_participant_group_expansion_movement:0 "Military Nobility"
 dynastic_cycle_participant_group_expansion_movement_desc:0 "Officers and garrison lords who rose through military merit.\n\n#weak Identity: holds a military rank, is military personnel, has a Martial Education of tier three or higher, or is a protege of the Military Nobility.#!\n$unlockables_expansion$"
 dynastic_cycle_participant_group_conservative_movement:0 "Hereditary Gentry"
 dynastic_cycle_participant_group_conservative_movement_desc:0 "Great Gentry Clans who have produced high ministers for generations.\n\n#weak Identity: belongs to a powerful or Dominant Family, holds a gentry title, or has house Renown of at least Famous.#!\n$unlockables_conservative$"
 dynastic_cycle_participant_group_advancement_movement:0 "Humble Scholars"
 dynastic_cycle_participant_group_advancement_movement_desc:0 "Scholars and commoners of humble birth who advance through talent and learning.\n\n#weak Identity: anyone who does not belong to any other identity.#!\n$unlockables_advancement$"
 dynastic_cycle_hd_siyi_movement:0 "[dynastic_cycle_era_type|E]#weak ($dynastic_cycle_participant_group_hd_siyi_movement$)#!"
 my_pro_hegemon_movement_short:0 "Consort Kin"
 my_expansion_movement_short:0 "Military Nobility"
 my_advancement_movement_short:0 "Humble Scholars"
 my_conservative_movement_short:0 "Hereditary Gentry"
 my_undecided_movement_short:0 "Eunuchs"
