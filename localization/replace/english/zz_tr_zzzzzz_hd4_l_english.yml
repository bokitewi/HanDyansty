l_english:
 hd4_wait:0 "Let us wait a while; there is still time to discuss it."
 hd4_close:0 "Understood."
 HD4_TAO_STORY_STATUS:0 "Tao Qian is bringing the commanderies of Xu Province under control; once the whole province submits, he will lay down arms, guard his borders, and devote himself to the people's welfare."
 hd4_story_tao:0 "Tao Qian: Securing Xu Province"
 hd4_tao.0001.t:0 "Holding Xu Province"
 hd4_tao.0001.desc:0 "The armies of the coalition against Dong Zhuo have gone their separate ways, yet not a single matter in Xu Province can be set aside. Letters from the commanderies pile up on your desk; troops and grain, defenses, local disputes, all await your decision.\n\nThe elite Danyang troops have already assembled at the provincial seat. You know this force must first be used to steady the province, so you order reports on the state of every commandery. One cannot talk grandly of the realm while letting the roads and cities under one's own rule slip out of command.\n\nDuring the alliance, many hard problems could be put off until after Dong Zhuo was defeated; now that 'after' has arrived. If Xu Province is to become a dependable foundation, it must begin with gathering up the scattered soldiers, people, and commanderies before your eyes."
 hd4_tao.0002.t:0 "Zang Ba Submits"
 hd4_tao.0002.desc:0 "The documents of Zang Ba's submission have been completed, and the troops under him now come under your command. The messenger is beaming, as if this one matter alone would bring Xu Province lasting peace.\n\nYou ask him to finish describing the state of Zang Ba's followers and territory, then order the handover to be arranged. Willingness to obey the provincial government is precious indeed, but how those who once managed their own affairs will cooperate from now on must still be worked out one item at a time.\n\nThe registers of Xu Province on your desk now include one more place that can be joined to the whole. With the province's forces linked together, there is one less danger of each fighting on its own; yet though the titles are settled, governance must still be carried out in person, and a single letter cannot be taken as the whole of it."
 hd4_tao.0003.t:0 "Xu Province Secured"
 hd4_tao.0003.desc:0 "The commanderies of Xu Province are at last united as one. The territories you once pressed again and again are now all under the administration of you and your officials.\n\nYou put away the reports from each place and turn to ask about the people returning to their trades and the rotation of the garrisons. There will always be new reasons to keep campaigning; but if you have no time to settle what is already in hand, the farther you fight, the more the province's foundation will gradually hollow out.\n\nFrom now on, you will no longer start new wars of your own accord. Campaigns already underway must still be concluded, and foreign invaders must still be repelled, but new orders should go more often to the fields, the granaries, and the county offices. With Xu Province secured, holding it is worth all your effort."
 hd4_tao_danyang_army:0 "Tao Qian's Danyang Troops"
 hd4_cao_laiwu_army:0 "Laiwu Danyang Troops"
 hd4_tao_guarding_xuzhou:0 "Guarding the Borders, Soothing the People"
 hd4_tao_guarding_xuzhou_desc:0 "With the commanderies of Xu Province brought into submission, this character has laid down arms to guard the borders and devote themselves to the people's welfare."
 hd4_tao_story_ai:0 "Securing Xu Province"
 hd4_tao_story_ai_desc:0 "This character is wholly devoted to managing affairs within Xu Province and has no intention of campaigning beyond it."
 hd4_tao_continue_xuzhou_decision:0 "Continue Securing Xu Province"
 hd4_tao_continue_xuzhou_decision_desc:0 "Some commanderies of Xu Province still refuse the provincial government's orders. Rather than wait for them to submit of their own accord, better to put the troops in order and first take those nearby and within reach, so the province may soon be joined as one."
 hd4_tao_continue_xuzhou_decision_tooltip:0 "Wage war on the commanderies and kingdoms within Xu Province that have not yet submitted"
 hd4_tao_continue_xuzhou_decision_confirm:0 "Muster the army to secure Xu Province!"
 hd4_tao_xuzhou_cb:0 "Securing Xu Province"
 HD4_TAO_WAR_NAME:0 "War to Unify the Commanderies of Xu Province"
 hd4_tao_victory_desc:0 "Tao Qian seizes the lands held by the enemy in the targeted commanderies, and the local vassals turn to obey the orders of Xu Province."
 hd4_tao_no_conquest_desc:0 "The targeted commanderies remain as they were; Tao Qian's resolve to secure Xu Province is unchanged, and he may try again another day."
 hd4_gsz_invite.t:0 "Yuan Shao Invites an Attack on Ji Province"
 hd4_gsz_invite.desc:0 "A letter arrives from Yuan Shao, inviting you to lead your army south. He says Han Fu is hesitant and vulnerable, and that great things can be done in Ji Province. Having read the letter, you ask the envoy how the land will be divided once it is done, but he merely repeats the words 'joining forces' once more.\n\nBenchu's prose has always been fine, but if land is really to be taken, it is your cavalry that must clear the road first. Even so, if you simply sit and watch him build his position, then once Ji Province becomes someone's foundation, you may not be given another leisurely chance to negotiate.\n\nYou push the letter to one side of the map. The envoy still waits below the hall for your reply, and you would rather like to know just how eagerly Benchu longs for this answer."
 hd4_gsz_accept:0 "Answer Benchu's invitation and march south against Ji."
 hd4_gsz_defeat_desc:0 "Gongsun Zan, defeated, takes his own life, and those under him who held commanderies and counties soon scatter to set themselves up independently."
 hd4_gsz_end.t:0 "The Fall of the Gongsun"
 hd4_gsz_end.desc:0 "News has finally arrived that Gongsun Zan has been defeated and killed. Of the subordinates who still obeyed his orders, some now shut their gates to defend themselves, while others send envoys in search of new masters; the banners in the military reports are far more jumbled than before.\n\nYou have the messenger explain the situation in each place separately. The death of one commander can suddenly leave once-united provinces and commanderies without orders, but it cannot make those garrison commanders and soldiers vanish along with him. With the old power in You Province collapsed, new struggles will soon spread along these cracks.\n\nYou accept the report and gaze at the banners on the map, not yet changed. Yesterday it was a single mass of strength to be wary of; today each part must be weighed anew."
 hd4_north_two.t:0 "Two Heroes of the North"
 hd4_north_two.desc:0 "On the newly delivered maps of the north, the banners of those who once each held their own corner have grown sparse. Now all the counties of the north belong to the two houses of Cao Cao and Yuan Shao; the borders are clearer than before, but the room for maneuver between them is smaller.\n\nYou listen as the military clerks report on each place in turn, laying the new reports beside the old. Before, one could deal with a small foe first and then borrow a strong neighbor's help against another; now, however you arrange things, in the end there is no way around the house on the other side.\n\nSomeone in the tent recalls the days when you raised troops together in your youth, then falls silent halfway through. Friendship can remain in memory, but supply lines and military might are laid out before your eyes. From now on, the north will no longer allow the two houses to tend only to their own affairs."
 hd4_guandu_invite.t:0 "Unify Hebei"
 hd4_guandu_invite.desc:0 "The debate in the tent goes round and round until only one name remains: Yuan Shao. You set down your brush and let the generals finish speaking. Some can hardly wait to advance north, others are still tallying the grain over and over, and even the old agreements between the two houses have been dug up again.\n\nBenchu's house is great and his holdings vast, and when it bears down upon you its might naturally looks impressive; but you are unwilling to concede the mastery of the north to him on the strength of appearances alone. Only by first opening the roads across the border will you have somewhere to reach into Hebei.\n\nYou raise your eyes and sweep them over the assembly. Whether the northern campaign is decided or not, in the end it depends on where your brush comes down."
 hd4_guandu_accept:0 "Resolve on the northern campaign and settle matters with Benchu."
 hd4_guandu_cb:0 "Historical Invasion of Guandu"
 HD4_GUANDU_WAR_NAME:0 "Battle of Guandu: Unifying Hebei"
 hd4_guandu_victory_desc:0 "Cao Cao seizes the lands held by Yuan Shao's side in the border commanderies and gains [pressed_claims|E] on Yuan Shao's titles; Yuan Shao falls ill from grief and rage and is gravely stricken, and his remaining domain will be divided among his sons."
 hd4_guandu_defeat_desc:0 "Cao Cao is defeated and withdraws, and Yuan Shao in turn gains [pressed_claims|E] on Cao Cao's titles."
 hd4_guandu_white_peace_desc:0 "The two houses lay down their arms and make peace, and the struggle at Guandu comes to an end."
 hd4_guandu_win.t:0 "Victory at Guandu"
 hd4_guandu_win.desc:0 "The bearer of the victory report reads out a great many place names in one breath, and by the end he is almost panting. You laugh and tell him to slow down, then order the newly won border commanderies marked on the map.\n\nThis battle has been won at last. Yuan Shao still holds Hebei, but you no longer need to stand in place waiting for him to bear down on you. As your attendants are about to continue with their congratulations, you first ask how many usable troops remain and when the supply lines will open; even the finest congratulations cannot carry one more cart of grain to the front.\n\nThe lands not yet taken remain on the map, and your gaze travels north along the border for a while. The claims are already in hand, but the city gates must still be opened one by one. Today, first secure the fruits of victory; there will be plenty to say to Benchu later."
 hd4_guandu_loss.t:0 "Holding at Guandu"
 hd4_guandu_loss.desc:0 "News arrives that Cao Cao has retreated in defeat, and the uneasy murmurs in the tent suddenly turn to congratulations. You listen to them for a while, then have the messenger report the results of the battle from the beginning.\n\nMengde thought he could ride his momentum north; now he must surely reconsider the weight of the Yuan. You order his various titles and ranks recorded one by one; these will be the grounds for future demands. Though the land has not all come into your hands, it does no harm to let everyone know first that you have no intention of letting the matter rest.\n\nYou set the battle report back on the desk and have the troops counted and the borders reexamined. Today's victory need not be spoken of as a narrow escape from disaster. The affairs of the north are not for Cao Cao to decide on your behalf."
 hd4_yuan_grief:0 "Gravely Stricken after Guandu"
 hd4_yuan_grief_desc:0 "The defeat at Guandu has left this character ill with grief and rage, ravaged in body and spirit."
 hd4_yuan_grief.t:0 "Overcome with Rage"
 hd4_yuan_grief.desc:0 "You have already read the report of the defeat at Guandu, but the dull ache in your chest has not dispersed when the document was closed. The lost border commanderies are reported one after another, and everyone in the tent speaks more slowly than usual, as if afraid that one more place name might be more than you can bear.\n\nYou try to rise, but your body gives way before your will. Councils of war that once ran late into the night now weary you after only a short while. Someone raises the future arrangements for your sons, then immediately breaks off.\n\nThe great cause in the north is still undecided, yet others have already begun planning for what comes after you. You gaze at the map not yet put away and wish to open your mouth and dismiss them, but in the end you only have the lamp moved a little closer."
 hd4_yuan_partition.t:0 "The Yuan Domain Divided"
 hd4_yuan_partition.desc:0 "The division of your father's lands after his death has been settled, and the registers set before you clearly list the places you will govern alone from now on. Your brothers each have their own footholds and no longer heed the orders of one man.\n\nLooking at those familiar county names, you suddenly feel they are different from yesterday. Before, when disputes arose, they could still be brought to your father's desk; now how you deal with one another and whom the old retainers obey must all be settled anew by each house. The Yuan name has not changed, but the man who could make everyone yield for a time is gone.\n\nSomeone waits outside the door for new military orders. You put away the documents of the division. Since this inheritance has been placed in your own hands, from now on its safety is yours alone to bear."
 hd4_tao.0001.a:0 "First secure the province, then plan for the rest."
 hd4_tao.0002.a:0 "With Xuangao come over, Xu Province has one less worry."
 hd4_tao.0003.a:0 "Lay down arms, guard the borders, and let the people rest."
 hd4_north_two.a:0 "The matter of Hebei must be settled in the end."
 hd4_guandu_win.a:0 "Press on north while victorious; Hebei can be taken."
 hd4_guandu_loss.a:0 "Mengde has withdrawn; I will settle accounts with him another day."
 hd4_yuan_grief.a:0 "Heaven does not favor me. What can be done!"
 hd4_yuan_partition.a:0 "My late father's legacy, I shall preserve."
 hd4_gsz_end.a:0 "With Bogui gone, the north is no longer a worry."
