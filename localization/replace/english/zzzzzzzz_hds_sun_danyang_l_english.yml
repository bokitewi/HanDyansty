 hds.4003.t:0 "Danyang First"
 hds.4003.desc:0 "“Danyang first.” You press your hand to the map, and the men in the tent turn to look. At last, the discussion wandering across Yangzhou has a firm destination.\n\nSince leaving Yuan Shu, you have heard enough questions about where the Sun house intends to go. Danyang has mountains, rivers, passes, and ferries, as well as powerful clans guarding their own lands. Defeat the enemy before you, then deal with the rest one by one. Failure to hold the whole commandery is no reason to fear the first step.\n\nThe soldiers outside await your orders. You have no wish to sit counting cities on a map any longer. Jiangdong need not wait for someone else to grant it to you. First gain a foothold in Danyang; then show them how far the Sun banners can march."
 hds.4003.a:0 "Danyang first. Muster the army and advance."
 hds.4004.t:0 "A Foothold in Danyang"
 hds.4004.desc:0 "The reports of the handovers across Danyang have finally all arrived. You order each place still marked as another house’s land corrected on the map. Seeing the Sun domains joined together gives you more pleasure than any speech of praise.\n\nSomeone asks whether the council of war may adjourn. You offer no answer, merely unrolling the map of Yangzhou a little farther. Danyang is secure; your supply routes and cities now have a firm base. More commanderies lie ahead, and more men are waiting to see whether you stop here.\n\nYou know the new lands must be settled, and the next campaign undertaken with care. But there is no need to roll up the map just yet. You have fought hard for a foothold of your own. Surely it was not so that you might advance no farther?"
 hds.4004.a:0 "Make Danyang our base. Advance into Yangzhou."
