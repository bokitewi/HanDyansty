 hds.4003.t:0 "The Invasion of Danyang"
 hds.4003.desc:0 "With the pressed claim to Yangzhou established, Danyang becomes the first objective. Sun Ce launches a historical invasion to seize all enemy-held titles within Danyang; if another independent power still holds part of the duchy, the campaign remains open until Danyang is fully secured."
 hds.4003.a:0 "Secure Danyang first."
 hds.4004.t:0 "A Foothold in Jiangdong"
 hds.4004.desc:0 "Danyang is fully secured. Sun Ce's personal historical offensive pulse will now continue checking the rest of Yangzhou and launch further regional wars when eligible."
 hds.4004.a:0 "From Danyang, unite Yangzhou."
 hds_wu_invasion_cb:0 "Invasion of Danyang"
 hds_wu_invasion_cb_name:0 "Invasion of Danyang"
 HDS_WU_INVASION_WAR_NAME:0 "Sun Ce's Invasion of Danyang"
