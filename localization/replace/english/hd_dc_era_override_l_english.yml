l_english:
 situation_dynastic_cycle_phase_chaos_desc_short: "The emperor's commands reach no farther than the capital region. Provinces and commanderies muster their own armies, and rival warlords determine their course through land, alliances, and force of arms."
 situation_dynastic_cycle_phase_chaos_desc: "$situation_dynastic_cycle_phase_chaos_desc_short$\n\n$hd_dc_era_rules_tt$\n\n#S When this $game_concept_dynastic_cycle_era_short$ begins#!\n$BULLET$The [son_of_heaven|E] is not deposed and retains his personal domain. His direct [vassals|E], except court officials, become independent with their lands, and tributary ties end. The [son_of_heaven|E] may wage Suppress Rebellion wars against them for ten years\n$BULLET$The former regent controls the emperor and commands the lords in his name. Rulers under the commandery–kingdom system may wage war to Control the Emperor; whoever captures the capital gains control of him\n$BULLET$[vassals|E] of county rank or above may Demand Independence from their liege. If accepted, they separate peacefully with a five-year [truce|E]. If refused, they still become independent, but their former liege may wage a Suppress Rebellion war against them for ten years\n$BULLET$Warlords may honor the Han or plot its overthrow, competing through Annexation wars"
