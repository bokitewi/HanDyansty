 situation_dynastic_cycle_phase_chaos_desc_short: "The authority of the court can no longer maintain order across the realm; factions advance or retreat based on their actual territories, alliances, and military strength."
 situation_dynastic_cycle_phase_chaos_desc: "The $situation_dynastic_cycle_phase_chaos_desc_short$\n\n$hd_dc_era_rules_tt$\n\n era confirms that it does not depose the Son of Heaven, does not destroy titles, nor alters vassal and tributary relationships. Independence, enthronement, and conquest must be achieved through corresponding political actions or actual warfare. The number of Crisis Points measures the pressure endured by order and does not independently determine whether the world is divided."
