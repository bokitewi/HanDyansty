l_english:
 hds_sj_heavy_army:0 "Sun Clan Jiangdong Heavy Infantry"
 hds.5000.t:0 "The Will to Stand Alone"
 hds.5000.desc:0 "After years of running Yuan Shu’s errands, your men have followed you from battlefield to battlefield, yet you still hold only one estate in your own name. Whenever the troops are counted, someone whispers outside the tent: whom are we really fighting for?\n\nThe map of Jiangdong lies open on your desk. Danyang’s mountains and rivers are formidable, but the men who hold it are not unbeatable. You must take your own land yourself. Beneath another man’s banner, you will only ever receive his scraps.\n\nYou push Yuan Shu’s latest orders aside and remain silent for a long while."
 hds.5000.a:0 "No more living under another’s roof. Take Danyang!"
 hds.5000.b:0 "The time has not come. Endure a little longer."
 hds.5001.t:0 "A Plot Against Sun Jian"
 hds.5001.desc:0 "Sun Jian has abandoned you and raised his own banner. Worse still, the Imperial Seal remains in his hands.\n\nLiu Biao’s envoy has waited outside the hall for two days. The letter is plain: if this man wins Jiangdong and keeps the Seal, he will answer to no one. You have no old quarrel with Jingzhou, but you now share an enemy.\n\nYou take up your brush and write only a few words: when it is done, each shall take what he needs."
 hds.5001.a:0 "Join Jingsheng in a plot against Wentai."
 hds.5002.t:0 "Whispers"
 hds.5002.desc:0 "Unfamiliar faces have appeared in camp, and messengers come and go more often than before. Someone quietly brings a warning: Yuan Shu and Liu Biao seem to be discussing a matter that concerns you.\n\nThe whole realm knows the Imperial Seal is in your hands. You knew this day might come; you simply did not expect it so soon.\n\nYou order the guards to be more vigilant, but you cannot defend against Jingxiang and Yuan Shu at once."
 hds.5002.a:0 "Let them come. We shall meet them in battle."
 hds.5003.t:0 "The Ambush at Mount Xian"
 hds.5003.desc:0 "You ride out of camp with light cavalry to scout Jingxiang. Suddenly, arrows rain down from both sides of the mountain path.\n\nHuang Zu’s ambush has been waiting in the woods. Your retreat is cut off, and your companions fall one after another. Drawing your sword amid the arrows, you remember the warning brought to camp and imagine Yuan Shu and Liu Biao smiling now.\n\nThe Imperial Seal will change hands after all."
 hds.5003.a:0 "If only I could return to Jiangdong!"
