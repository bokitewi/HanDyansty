l_english:
 hds_sj_heavy_army:0 "Sun Clan Jiangdong Heavy Infantry"
 HDS_WU_INVASION_WAR_NAME:0 "Sun Clan's Invasion of Danyang"
 hds.5000.t:0 "Hunger for Land"
 hds.5000.desc:0 "After all these years running Yuan Shu's errands, my men have followed me from battle to battle, yet I own nothing but a single estate. Whenever I count the host, someone whispers outside the tent: whom are we really fighting for?\n\nThe map of Jiangdong lies open on my desk. Danyang is rugged, but its lords are not unbeatable. Land must be taken by one's own hand; beneath another man's banner I will only ever get his leftovers.\n\nI push Yuan Shu's latest orders aside and call for the muster rolls."
 hds.5000.a:0 "Live under no one's roof. Strike out alone and take Danyang."
 hds.5000.b:0 "The time is not right. Endure one more year."
 hds.5001.t:0 "A Plot Against Sun Jian"
 hds.5001.desc:0 "Sun Jian has left me and raised his own banner. Worse, the Imperial Seal is in his hands.\n\nLiu Biao's envoy has waited two days outside my hall. His letter is plain: a man who holds Jiangdong and the Seal will answer to no one. Jingzhou and I have no old quarrel, only a common enemy.\n\nI write a reply of a few words: when it is done, each takes his share."
 hds.5001.a:0 "Agree with Liu Biao to remove Sun Jian."
 hds.5002.t:0 "Whispers"
 hds.5002.desc:0 "Strange faces have appeared in the camp lately, and messengers come and go more often than before. Someone quietly passes me a warning: Yuan Shu and Liu Biao seem to be discussing something that concerns me.\n\nThat the Seal is in my hands is known to the whole realm. I had imagined this day might come, only not so soon.\n\nI order the guard doubled, but neither Jingzhou nor Shouchun is a place I can defend all at once."
 hds.5002.a:0 "Stand to arms and watch."
 hds.5003.t:0 "The Ambush at Mount Xian"
 hds.5003.desc:0 "I rode out with a light escort to scout Jingxiang, and arrows rained down on both sides of the mountain path.\n\nHuang Zu's men had been waiting in the trees. The way back was cut and my companions fell one by one. Drawing my sword amid the arrows, I remembered the unopened letter and the smiling faces of Yuan Shu and Liu Biao.\n\nThe Seal, it seems, will finally change hands."
 hds.5003.a:0 "Fall in the ambush."
