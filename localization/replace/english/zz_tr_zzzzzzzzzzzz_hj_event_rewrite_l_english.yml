l_english:
 tgp_interaction_event.0010.a:0 "I shall lead an army to the rescue myself."
 tgp_interaction_event.0010.b:0 "I will at once send one of my military officers to the rescue."
 tgp_interaction_event.0010.c:0 "Allow me to choose another able general."
 tgp_interaction_event.0010.desc:0 "The fighting at the front has not ceased and the situation is urgent; I dare not fail to report it. I now send an envoy bearing this letter to earnestly request that you send troops to our aid.\n\nIf you can lead an army here yourself, our whole army will have something to rely on; if you are tied up with other military affairs, please send a capable military officer at the head of troops to our rescue, so that together we may hold up against this crisis. As for where to meet and how the various units will keep in contact, I will arrange it at once upon your reply.\n\nThe military situation changes in an instant; the envoy dares not linger, and respectfully awaits your answer."
