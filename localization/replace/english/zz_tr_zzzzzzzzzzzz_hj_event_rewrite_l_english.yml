l_english:
 tgp_interaction_event.0010.a:0 "I shall lead an army to the rescue myself."
 tgp_interaction_event.0010.b:0 "Send one of my military officers to reinforce them at once."
 tgp_interaction_event.0010.c:0 "Allow me to choose another able general."
 tgp_interaction_event.0010.desc:0 "The fighting at the front continues, and the situation is too urgent to leave unreported. I send this letter with an envoy to beg for reinforcements.\n\nIf you can lead an army here yourself, every soldier will have someone to rely upon. If other military duties keep you occupied, please send a capable officer with troops so that we may face this crisis together. Once your reply arrives, I will arrange where to meet and how our forces are to maintain contact.\n\nThe situation changes from moment to moment. The envoy cannot stay long. I await your answer."
