l_english:
 hds_sc_heavy_army:0 "Jiangdong Heavy Infantry"
 hds_sc_light_army:0 "Zhou Yu's Volunteers"
 hds_regional_cb:0 "Historical Regional Unification"
 hds_regional_cb_name:0 "Historical Regional Unification"
 hds_wu_invasion_cb:0 "Invasion of Wu"
 hds_wu_invasion_cb_name:0 "Invasion of Wu"
 HDS_REGIONAL_WAR_NAME:0 "[ATTACKER.GetShortUIName]'s War for [TITLE.GetBaseNameNoTier]"
 HDS_WU_INVASION_WAR_NAME:0 "Sun Ce's Invasion of Wu"
 hds_war_victory_desc:0 "Take enemy-held titles within the target duchy. Neutral third-party territory is excluded."
 hds_war_no_conquest_desc:0 "No territory changes hands. Unfinished historical objectives can be retried after conditions recover."
 hds_liu_guarding_jingzhou:0 "Guarding Jingzhou"
 hds_liu_guarding_jingzhou_desc:0 "All de jure duchies of Jingzhou are under this ruler. No further proactive wars."
 hds_southern_campaign_ai:0 "Southern Historical Campaign"
 hds_southern_campaign_ai_desc:0 "Dedicated regional campaign checks, without a full war chest or general peace requirement."
 hds.1000.t:0 "Establishing Jingzhou"
 hds.1000.desc:0 "After the coalition dissolves, I will establish a base in Jingzhou and unite its duchies without conquering outside the province."
 hds.1000.a:0 "Proceed."
 hds.1001.t:0 "Kuai Yue Swears Fealty"
 hds.1001.desc:0 "Kuai Yue will retain his political identity while becoming my vassal and ally."
 hds.1001.a:0 "Proceed."
 hds.1002.t:0 "Cai Mao Swears Fealty"
 hds.1002.desc:0 "Cai Mao will enter my vassal hierarchy and conclude a real alliance with me."
 hds.1002.a:0 "Proceed."
 hds.1003.t:0 "Jingzhou Secured"
 hds.1003.desc:0 "Every de jure duchy of Jingzhou is held by me or by a vassal under me. I will now guard the province instead of starting new wars."
 hds.1003.a:0 "Proceed."
 hds.2000.t:0 "Flight to Nanyang"
 hds.2000.desc:0 "Dong Zhuo has entered the capital. I will move my existing estate to Wan in Nanyang."
 hds.2000.a:0 "Proceed."
 hds.2001.t:0 "Sun Jian Enters Service"
 hds.2001.desc:0 "Sun Jian will help me take Nanyang, execute its incumbent governor, surrender his territorial offices, and retain the Sun family estate while serving under me."
 hds.2001.a:0 "Proceed."
 hds.2002.t:0 "Independence in Nanyang"
 hds.2002.desc:0 "The coalition has ended. I will become independent in Nanyang, press claims on Yu and Yang, and campaign first in Yu."
 hds.2002.a:0 "Proceed."
 hds.3000.t:0 "The Imperial Seal"
 hds.3000.desc:0 "I participated in the victorious anti-Dong war. With the coalition now dissolved, the unique Imperial Seal will pass into my keeping."
 hds.3000.a:0 "Proceed."
 hds.4000.t:0 "Inheriting the Sun Estate"
 hds.4000.desc:0 "My father has died. His original estate and the captured inheritance titles have passed to me; this is the existing family estate, not a new camp."
 hds.4000.a:0 "Proceed."
 hds.4001.t:0 "Turning toward Jiangdong"
 hds.4001.desc:0 "I will leave Yuan Shu with the inherited estate, become independent, and claim Yang. If I own the Imperial Seal, delivering it to Yuan Shu earns five thousand heavy infantry."
 hds.4001.a:0 "Proceed."
 hds.4002.t:0 "Zhou Yu Arrives"
 hds.4002.desc:0 "My closest friend Zhou Yu will join my court with two thousand light infantry. Temporary imprisonment or an incompatible office delays the arrival without duplicating troops."
 hds.4002.a:0 "Proceed."
 hds.4003.t:0 "The Invasion of Wu"
 hds.4003.desc:0 "Wu is my first objective in Jiangdong. I authorize a real invasion against its current territorial holder; temporary failure does not abandon the objective."
 hds.4003.a:0 "Proceed."
 hds.4004.t:0 "A Foothold in Jiangdong"
 hds.4004.desc:0 "Wu now provides a foothold. Further historical campaigns will target the remaining enemy territories of Yang."
 hds.4004.a:0 "Proceed."
