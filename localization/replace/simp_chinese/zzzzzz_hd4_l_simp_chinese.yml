l_simp_chinese:
 hd4_wait:0 "且缓些时日，再议不迟。"
 hd4_close:0 "知晓了。"
 HD4_TAO_STORY_STATUS:0 "陶谦正收整徐州诸郡；待全州归附，便息兵守境，专意安民。"
 hd4_story_tao:0 "陶谦：经略徐州"
 hd4_tao.0001.t:0 "割据徐州"
 hd4_tao.0001.desc:0 "讨董诸军各自散去，徐州的事务却一件也搁不下。各郡的来书堆在案前，兵粮、守备、地方争端，都等着你拿主意。\n\n丹阳精兵已在州治集结。你知道这支兵马该先用来稳住州境，便命人查报诸郡情形——总不能一面高谈天下，一面任治下的道路与城池失了号令。\n\n会盟之时，许多难题都可推到讨平董卓之后；如今那个“之后”已经到了。徐州若要成为可靠的根本，便得从收拢眼前这些散乱的军民与郡国做起。"
 hd4_tao.0002.t:0 "臧霸归附"
 hd4_tao.0002.desc:0 "臧霸归附的文书已经办妥，他麾下的兵众也归入你的节制。来报的人喜形于色，仿佛单凭这一件事，徐州便能就此安稳。\n\n你请他把臧霸部众与辖地的情形说完，再命人料理交接。肯奉州府号令固然可贵，可原先各自经营的人往后如何相互照应，还须一件件商量。\n\n案上的徐州图籍又多了一处可以接续的地方。州中兵力连成一气，便少一处各自为战的隐患；只是名分已定，治理仍须躬行，不能把一纸来书当作全部。"
 hd4_tao.0003.t:0 "徐州既定"
 hd4_tao.0003.desc:0 "徐州诸郡终于尽归一处，往日反复催问的辖境，如今都已在你与属吏的治理之下。\n\n你把各处回报收好，转而问起百姓归业与守军轮替。继续出征总能找到新的理由；可若连眼前所得都无暇安顿，越打越远，州中的根本反会渐渐空了。\n\n从今往后，你不再主动另启战端。在途的军务仍须收尾，外敌来犯仍须抵御，但新的号令，应多送往田间、仓廪与县署。徐州既定，守住它，也值得倾尽心力。"
 hd4_tao_danyang_army:0 "陶谦丹阳兵"
 hd4_cao_laiwu_army:0 "莱芜丹阳兵"
 hd4_tao_guarding_xuzhou:0 "守境安民"
 hd4_tao_guarding_xuzhou_desc:0 "徐州诸郡既已归附，该角色息兵守境，专意安民。"
 hd4_tao_story_ai:0 "经略徐州"
 hd4_tao_story_ai_desc:0 "该角色一心经营徐州境内，无意向州外用兵。"
 hd4_tao_continue_xuzhou_decision:0 "继续经略徐州"
 hd4_tao_continue_xuzhou_decision_desc:0 "徐州诸郡仍有不奉州府号令者。与其坐等他们自来归附，不如整顿兵马，择其近而可图者先取之，使州境早日连成一片。"
 hd4_tao_continue_xuzhou_decision_tooltip:0 "向徐州境内尚未归附的郡国用兵"
 hd4_tao_continue_xuzhou_decision_confirm:0 "整军经略徐州！"
 hd4_tao_xuzhou_cb:0 "经略徐州"
 HD4_TAO_WAR_NAME:0 "徐州郡国统一之战"
 hd4_tao_victory_desc:0 "陶谦夺取目标郡国中敌方所据之地，当地封臣随之改奉徐州号令。"
 hd4_tao_no_conquest_desc:0 "目标郡国各守原状；陶谦经略徐州之志未改，来日仍可再图。"
 hd4_gsz_invite.t:0 "袁绍邀攻冀州"
 hd4_gsz_invite.desc:0 "袁绍来书，邀你挥师南下，说韩馥迟疑可图，冀州大有可为。你把信看完，问使者事成之后如何分地，他却又把“合力”二字说了一遍。\n\n本初的文章向来好看，可真要取地，还得你的骑兵先去踏开道路。话虽如此，若始终坐看他经营，日后冀州成了谁的根本，也未必容你再从容商量。\n\n你将信推到舆图一旁。使者还在堂下候着回书，你倒想知道，本初盼这一封回信，究竟盼得有多急。"
 hd4_gsz_accept:0 "应本初之邀，南下图冀。"
 hd4_gsz_defeat_desc:0 "公孙瓒兵败自尽，麾下据有郡县者不久便各自离散自立。"
 hd4_gsz_end.t:0 "公孙氏败亡"
 hd4_gsz_end.desc:0 "公孙瓒兵败身死的消息终于传来。先前仍奉其号令的各处部属，如今有人闭门自守，有人遣使另寻依附，军报里的旗号比往日杂乱了许多。\n\n你让报信的人把各地情形分开说清。一员主帅身死，能使原本连成一片的州郡骤失号令，却不能叫那些守将与兵众一同消失。幽州旧势既已瓦解，新的争夺很快便会沿着这些缝隙展开。\n\n你收下军报，望着图上尚未改动的旗号。昨日还是一整片须提防的力量，今日便得逐处重新掂量。"
 hd4_north_two.t:0 "北方双雄"
 hd4_north_two.desc:0 "新送来的北方图籍上，往日那些各据一方的旗号渐渐稀了。如今北地诸县已尽归曹操与袁绍两家，疆界比从前分明，彼此回旋的余地却也更小了。\n\n你听军吏逐处禀报，把新旧回报对在一处。从前尚可先对付一个小敌，再借另一个强邻相助；如今无论怎样调度，最后都绕不开对面那一家。\n\n帐中有人说起早年一同起兵的情形，话到一半又住了口。交情可以留在记忆里，粮道与兵势却都摆在眼前。往后的北方，再不容两家只顾各自经营。"
 hd4_guandu_invite.t:0 "统一河北"
 hd4_guandu_invite.desc:0 "帐中议来议去，最后只剩下袁绍一个名字。你搁下笔，让诸将先把话说完：有人已等不及北进，有人还在一遍遍核算粮草，连两家旧日的约定也被重新翻了出来。\n\n本初家大业大，压到面前时声势自然好看；你却不愿只因声势，便替他认下这北方的高低。先打通边境的道路，才有向河北伸手的地方。\n\n你抬眼扫过众人。北伐之议定与不定，说到底，还要看你这支笔落在哪里。"
 hd4_guandu_accept:0 "议定北伐，与本初一决。"
 hd4_guandu_cb:0 "官渡历史入侵"
 HD4_GUANDU_WAR_NAME:0 "官渡之战：统一河北"
 hd4_guandu_victory_desc:0 "曹操夺取边境诸郡中袁绍一方所据之地，并对袁绍的头衔取得[pressed_claims|E]；袁绍忧愤成疾，身受重创，身后余业将由诸子分据。"
 hd4_guandu_defeat_desc:0 "曹操兵败而还，袁绍反对曹操的头衔取得[pressed_claims|E]。"
 hd4_guandu_white_peace_desc:0 "两家罢兵言和，官渡之争就此作罢。"
 hd4_guandu_win.t:0 "官渡告捷"
 hd4_guandu_win.desc:0 "报捷的人一口气念了许多地名，念到后来，竟有些喘。你笑着叫他慢些，又命人把新得的边境郡国在图上标出来。\n\n这一仗总算赢了。袁绍尚有河北，你却已不必站在原处等他压来。左右正要接着说恭贺的话，你先问还剩多少可用之兵，粮道几时能通——再好的贺辞，也替前军多运不了一车粮。\n\n图上那些未得之地仍在，你的目光沿着边界向北走了一程。名分已经在手，城门还须一座座打开。今日先把胜果拿稳，往后有的是话说给本初听。"
 hd4_guandu_loss.t:0 "官渡守成"
 hd4_guandu_loss.desc:0 "曹操败退的消息送到，帐中先前那些不安的低语，忽然都换成了称贺。你听他们说了一阵，才叫来人把战果从头禀明。\n\n孟德自以为能趁势北来，如今总该重新掂量袁氏的分量了。你命人将他的各处名位一一录下——这便是日后讨取的凭据。地虽未尽入你手，不妨先让众人知道，你并不打算就此罢休。\n\n你把战报放回案上，叫人清点兵众、重查边界。今日这一胜，不必说得像侥幸躲过一劫。北方的事，还轮不到曹操来替你定。"
 hd4_yuan_grief:0 "官渡败后重创"
 hd4_yuan_grief_desc:0 "官渡之败令该角色忧愤成疾，形神俱损。"
 hd4_yuan_grief.t:0 "气急攻心"
 hd4_yuan_grief.desc:0 "官渡的败报已经读过，胸中那团闷痛却没有随文书合上而散去。失去的边境郡国一处处报来，帐中人人都比平日说得慢些，仿佛怕再多念一个地名，你便承受不住。\n\n你试着起身，身子却先于心意软了下去。往日能争到深夜的军议，如今听不多时便觉疲惫。有人提起诸子日后的安排，又立刻收住了话头。\n\n北方大业尚无定论，旁人却已开始盘算你的身后之事。你望向尚未收起的舆图，想开口斥退他们，最后只叫人把灯移近一些。"
 hd4_yuan_partition.t:0 "袁氏分国"
 hd4_yuan_partition.desc:0 "父亲身后领地的分配已经议定，送到你面前的簿籍，清楚列着此后由你独自掌管的地方。兄弟们各有立足之地，也不再同听一人号令。\n\n你看着那些熟悉的县名，忽然觉得它们与昨日不同了。从前起了争执，还能递到父亲案前；如今彼此如何来往、旧部听谁调遣，都得由各家重新说定。袁氏的姓氏未改，那个能叫众人暂且退让的人，却已不在了。\n\n门外有人候着新的军令。你把分配的文书收好。眼前这份基业既已交到自己手上，往后它的安危，便得自己担起来。"
 hd_cao_chain.0094.t:0 "莱芜整众"
 hd_cao_chain.0094.desc:0 "莱芜城外又添了营帐。宗族与旧部的消息陆续送来，能来相从的各携部曲家资，不能亲至的，也遣人来问军中所缺。几日前还得提防沿途追骑，如今已有人等你发令。\n\n钱粮与丹阳兵的名册送到案前，你逐项看过，压在舆图一角。立足之地既已有了，接下来要做的，便不只是躲过董卓的追索。散在四方的愤懑，总得有人把它变成军令、粮道和肯向前走的队伍。\n\n你命营中重新列伍。天下未定，曹氏不能只做一户暂有栖身之所的逃亡之家。"
 hd_cao_chain.0094.a:0 "以莱芜为基，整军待发。"
 hd_cao_chenliu_danyang_army:0 "莱芜丹阳兵"
 hd4_tao.0001.a:0 "先安州境，再图其余。"
 hd4_tao.0002.a:0 "宣高既来，徐州少一忧。"
 hd4_tao.0003.a:0 "息兵守境，与民休息。"
 hd4_north_two.a:0 "河北之事，终须一决。"
 hd4_guandu_win.a:0 "乘胜北顾，河北可图。"
 hd4_guandu_loss.a:0 "孟德既退，来日再与他计较。"
 hd4_yuan_grief.a:0 "天不佑我，奈何！"
 hd4_yuan_partition.a:0 "先父基业，自当守之。"
 hd4_gsz_end.a:0 "伯圭既亡，北顾无忧。"
