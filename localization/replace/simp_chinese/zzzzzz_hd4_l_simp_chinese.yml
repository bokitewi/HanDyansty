l_simp_chinese:
 hd4_continue:0 "此事已定。"
 hd4_wait:0 "暂且筹备，日后再议。"
 hd4_close:0 "知晓了。"
 HD4_TAO_STORY_STATUS:0 "徐州经略：整合法理郡国，事成之后守境安民。"
 hd4_story_tao:0 "陶谦：经略徐州"
 hd4_tao.0001.t:0 "割据徐州"
 hd4_tao.0001.desc:0 "讨董诸军既散，州郡之间再无统一号令。我当立足徐州，收整郡国，安定军民。三千丹阳精兵已受命集结，将随我经略州境。"
 hd4_tao.0002.t:0 "臧霸归附"
 hd4_tao.0002.desc:0 "臧霸已归入我的封臣体系。徐州又添一支可用之力，此后当与诸郡协力，收拾州内纷争。"
 hd4_tao.0003.t:0 "徐州既定"
 hd4_tao.0003.desc:0 "徐州法理范围内的郡国，已经全部归于我本人或我的封臣。经略至此，当以守境安民为务，不再主动发动新的征服战争。尚存的战事仍须妥善收尾，来犯之敌亦不可不防。"
 hd4_tao_danyang_army:0 "陶谦丹阳兵"
 hd4_cao_laiwu_army:0 "莱芜丹阳兵"
 hd4_tao_guarding_xuzhou:0 "守境安民"
 hd4_tao_guarding_xuzhou_desc:0 "陶谦已经整合徐州法理郡国，不再主动兴兵。此为个人故事状态，不随头衔传给继任者。"
 hd4_tao_story_ai:0 "经略徐州"
 hd4_tao_story_ai_desc:0 "陶谦专注于徐州境内的历史整合，不主动向州外扩张。"
 hd4_tao_continue_xuzhou_decision:0 "继续经略徐州"
 hd4_tao_continue_xuzhou_decision_desc:0 "在徐州尚未归附的法理郡国中寻找合法的进攻目标。只在战争名额、停战、盟约和兵力条件均允许时发动专用历史战争；暂时无目标不会视为统一完成。"
 hd4_tao_continue_xuzhou_decision_tooltip:0 "尝试发动一次徐州境内的历史整合战争。"
 hd4_tao_continue_xuzhou_decision_confirm:0 "整军经略徐州"
 hd4_tao_xuzhou_cb:0 "经略徐州"
 HD4_TAO_WAR_NAME:0 "徐州郡国统一之战"
 hd4_tao_victory_desc:0 "陶谦取得目标郡国范围内属于敌方的领土及相应隶属关系。"
 hd4_tao_no_conquest_desc:0 "此次战争不转移目标领土。陶谦的徐州整合计划不会因此被永久关闭。"
 hd4_gsz_invite.t:0 "袁绍邀攻冀州"
 hd4_gsz_invite.desc:0 "我已取得幽州头衔。袁绍来书，邀我兴兵南向，共图冀州。若应此约，待停战、盟约和军务条件允许，便向当时合法的冀州敌手出兵。"
 hd4_gsz_accept:0 "引兵南下，进取冀州！"
 hd4_gsz_defeat_desc:0 "公孙瓒败于这场冀州历史战争，将走向自尽；其原领地内可独立的伯爵级及以上封臣将在三十天内分离。"
 hd4_gsz_end.t:0 "公孙氏败亡"
 hd4_gsz_end.desc:0 "冀州战败之后，公孙瓒自尽。昔日统属于他的州郡失去共同号令，旧部陆续自立，原有势力已经分崩离析。"
 hd4_north_two.t:0 "北方双雄"
 hd4_north_two.desc:0 "北方范围内的各县，已经归入曹操与袁绍两方。其余割据势力不复存在，往日共同起兵的故人，如今终须面对这场决断北方归属的争夺。"
 hd4_guandu_invite.t:0 "统一河北"
 hd4_guandu_invite.desc:0 "北方只余我与袁绍两大势力。今当整军北向，以边境郡国为目标，开启官渡之战。此战只能由我亲自发起；选择出兵后，若当前尚有停战或其他阻碍，将继续等待合法的开战时机。"
 hd4_guandu_accept:0 "挥师北伐，决战官渡！"
 hd4_guandu_cb:0 "官渡历史入侵"
 HD4_GUANDU_WAR_NAME:0 "官渡之战：统一河北"
 hd4_guandu_victory_desc:0 "曹操取得开战时确定的边境目标郡国中属于敌方的领土，并获得袁绍所持可宣称头衔的强宣称。袁绍气急攻心，身负重伤并承受严重健康惩罚；其后死亡时，存活成年儿子将瓜分其剩余领地。"
 hd4_guandu_defeat_desc:0 "曹操未能取胜。袁绍获得曹操所持可宣称头衔的宣称，不触发袁绍的重伤与战后分国。"
 hd4_guandu_white_peace_desc:0 "双方议和，不执行官渡胜利或失败的特殊奖励与惩罚。"
 hd4_guandu_win.t:0 "官渡告捷"
 hd4_guandu_win.desc:0 "袁军败退，边境郡国依约归入我的势力。对于袁绍其余可宣称的头衔，我亦已取得强宣称。此番胜利为继续北进奠定了基础。"
 hd4_guandu_loss.t:0 "官渡守成"
 hd4_guandu_loss.desc:0 "曹操的北伐已经失败。我取得了对其所持可宣称头衔的宣称，往后的北方争夺，将由新的形势决定。"
 hd4_yuan_grief:0 "官渡败后重创"
 hd4_yuan_grief_desc:0 "官渡战败使袁绍遭受严重打击，健康显著恶化。该修正不叠加，也不直接保证死亡。"
 hd4_yuan_grief.t:0 "气急攻心"
 hd4_yuan_grief.desc:0 "官渡败报接连传来，边境郡国相继失去。我愤懑难平，伤病交加，已无复往日之健。北方大业尚未有定论，诸子却已开始思量各自的将来。"
 hd4_yuan_partition.t:0 "袁氏分国"
 hd4_yuan_partition.desc:0 "袁绍去世后，其剩余领地按实际县数分配给了存活的成年儿子。各支各有立足之地，不再共同臣属于其中一位兄弟。"
 hd_cao_chain.0094.t:0 "莱芜起兵"
 hd_cao_chain.0094.desc:0 "我已在莱芜安顿下来。宗族与旧部逐渐聚集，粮资和丹阳精兵也已备齐。天下纷乱至此，当以这片立足之地重整旗鼓。"
 hd_cao_chain.0094.a:0 "立足莱芜，整军待发。"
 hd_cao_chenliu_danyang_army:0 "莱芜丹阳兵"
