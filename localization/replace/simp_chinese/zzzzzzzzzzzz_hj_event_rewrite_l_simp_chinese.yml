l_simp_chinese:
 tgp_interaction_event.0010.a:0 "吾当亲提一军往援。"
 tgp_interaction_event.0010.b:0 "即遣麾下武官驰援。"
 tgp_interaction_event.0010.c:0 "容吾另择良将。"
 tgp_interaction_event.0010.desc:0 "前线战事未息，军情紧急，不敢不报。今遣使奉书，恳请发兵相援。\n\n若你能亲提一军前来，我军上下便有了倚仗；若你另有军务缠身，也请遣一员得力武官领兵驰援，共支危局。至于从何处接应、各部如何声气相通，待你答复之后，我这里即刻安排。\n\n军情瞬息万变，使者不敢久留，谨候回音。"
