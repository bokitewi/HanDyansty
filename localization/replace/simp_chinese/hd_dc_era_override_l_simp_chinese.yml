 situation_dynastic_cycle_phase_chaos_desc_short: "天子号令不出京畿，州郡各拥兵马，群雄以土地、盟约与刀兵定进退。"
 situation_dynastic_cycle_phase_chaos_desc: "$situation_dynastic_cycle_phase_chaos_desc_short$\n\n$hd_dc_era_rules_tt$\n\n#S 该$game_concept_dynastic_cycle_era_short$开始后#!\n$BULLET$[son_of_heaven|E]不会因此被废黜，仍保有直辖之地；但其直属[vassals|E]（朝官除外）各自拥地自立，朝贡关系一并断绝，[son_of_heaven|E]十年之内可以「讨逆」征之\n$BULLET$原有辅政之臣即挟天子以令诸侯；郡国制诸侯可以「挟天子」之名兴兵，攻下京城者即挟天子\n$BULLET$县级以上的[vassals|E]可向主君「要求独立」：主君应允，则和平自立，双方[truce|E]五年；不允，亦即自立，而原主君十年之内可以「讨逆」征之\n$BULLET$群雄或尊汉、或谋逆，以「吞并」相争"
 # 天朝循环大修：斗争期（chaos）改名；夺取天命决议即'终结乱世'
