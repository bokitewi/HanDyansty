l_simp_chinese:
 hds.4003.t:0 "进取丹阳"
 hds.4003.desc:0 "扬州强宣称既已确立，江东事业当先取丹阳。我将发动历史入侵，夺取丹阳郡中属于敌方势力的全部头衔；若丹阳尚有其他独立势力盘踞，之后继续整军进取，直至全郡归于孙氏。"
 hds.4003.a:0 "先定丹阳。"
 hds.4004.t:0 "立足江东"
 hds.4004.desc:0 "丹阳已尽归孙氏掌握。此后个人历史进攻脉冲将持续检定扬州诸郡，在条件允许时继续发动统一扬州的战争。"
 hds.4004.a:0 "由丹阳而定扬州。"
 hds_wu_invasion_cb:0 "进取丹阳"
 hds_wu_invasion_cb_name:0 "进取丹阳"
 HDS_WU_INVASION_WAR_NAME:0 "孙策进取丹阳之战"
