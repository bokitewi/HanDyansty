l_simp_chinese:
 hds.4003.t:0 "先取丹阳"
 hds.4003.desc:0 "“先取丹阳。”你将手按在舆图上，帐中几人顺着看过来，方才还散在扬州各处的议论，总算有了落脚之处。\n\n离开袁术以后，你已听够了旁人问孙氏要往哪里去。丹阳有山川关津，也有据地自守的豪强；先打眼前这个对手，余下的再一处处收拾，总不能因为全郡未得，便连第一步都不敢迈。\n\n帐外的兵众已在待命，你也不愿再坐着数图上的城池。江东不是旁人肯给才有的地方。先在丹阳立住脚，再让他们看看，孙氏的旗号能走到哪里。"
 hds.4003.a:0 "以丹阳为先，整军进取。"
 hds.4004.t:0 "丹阳立足"
 hds.4004.desc:0 "丹阳各处交割的回报终于到齐。你叫人把图上那些尚标着别家归属的地方逐一改过，看着孙氏的疆土连成一片，竟比听一番颂功还要痛快。\n\n有人问可否暂罢军议，你没有答，只把扬州的舆图又展开了些。丹阳已定，粮道与城邑总算有了根本；后头还有诸郡，也还有等着看你止步于此的人。\n\n新得之地须安置，下一步用兵也得有分寸，这些你自然清楚。可案上的图不必急着卷起——好容易有了自己的立足之处，岂是为了从此不再向前？"
 hds.4004.a:0 "以丹阳为本，进图扬州。"
 hds_wu_invasion_cb:0 "进取丹阳"
 hds_wu_invasion_cb_name:0 "进取丹阳"
 HDS_WU_INVASION_WAR_NAME:0 "孙氏进取丹阳之战"
