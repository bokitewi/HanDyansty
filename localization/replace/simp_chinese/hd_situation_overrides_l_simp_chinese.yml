 # 保留原版大草原显示名，只覆盖三个项目地图说明
 the_great_steppe_sub_region_steppe_west_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak 西部草原囊括凉州诸郡。河西一带东连中原、西通西域，水草丰歉、旱魃与严寒，时时左右着牧群的生息与迁徙。#!"
 the_great_steppe_sub_region_steppe_central_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak 中部草原囊括并州诸郡。此地介于农耕腹地与北方草原之间，山岭、河谷与边塞交错，养成了逐水草而居的生计。#!"
 the_great_steppe_sub_region_steppe_east_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak 东部草原囊括幽州诸郡。燕山南北与辽西边地是通往东北草原的门户，寒暑更替左右着牧场的肥瘠与游牧部众的去向。#!"
