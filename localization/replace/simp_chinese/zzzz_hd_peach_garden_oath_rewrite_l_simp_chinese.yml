l_simp_chinese:
 hd_peach_garden.0001.t:0 "桃园结义"
 hd_peach_garden.0001.desc:0 "昨日，你还站在招军榜下，为无钱募兵而长叹。张飞一声喝问，把你拉进了酒肆。他愿出家资招募乡勇；随后进店的关羽，本是赶来投军的，听罢你的志向，也移席与你们同坐。谈到兴起处，翼德邀你们到他庄上去，提出结为兄弟。\n\n此刻，庄后的桃花开得正盛。乌牛白马的祭礼已经备齐，香烟从供案前袅袅升起。昨日说要倾家举事的翼德收住了笑，云长整衣立在一旁，等你上前。\n\n你低头理平衣襟。身为汉室宗亲，至今却只能靠织席贩履奉养老母；如今有人肯拿出家资，有人肯以性命相托，你又岂能辜负？\n\n你在二人之间跪下。眼前这炷香燃尽，你们便不再只是同路投军的陌路人了。"
 hd_peach_garden.0001.a:0 "不求同年同日生，但求同年同日死"
