l_simp_chinese:
 hds_sj_heavy_army:0 "孙氏江东重步军"
 hds.5000.t:0 "自立之心"
 hds.5000.desc:0 "部曲收拾好行装，又来问我下一步往哪里去。我还未回答，又有军令送来，催我们替人征战。跟了我这么久，这些人却还没有一处能安顿家小的地方。\n\n我让众人留下，把丹阳一带的道路摊开来议。那里有人据城，也有人守着山险，绝非举旗便能收入囊中。跟随我的旧部却已经等得太久：他们肯冒箭石，总不能叫他们永远替别人开路。\n\n可一旦另立旗号，兵粮与家眷的安危便都要自己承担，不能再指望旧主替我们筹粮发兵。我抚平图上的折痕。众人渐渐安静下来，等着我说这一次究竟替谁出兵。"
 hds.5000.a:0 "不复寄人篱下，自取丹阳！"
 hds.5000.b:0 "时机未至，姑且再忍。"
 hds.5001.t:0 "密谋孙坚"
 hds.5001.desc:0 "刘表送来的信没有与公文放在一处。使者亲手交给我，退开几步，仍留在门内等候回音。孙坚已不再听我的号令，传国玉玺也还在他手中。\n\n信中并未许下多少漂亮话，只说此人若在江东站稳脚跟，荆州与南阳都难安枕。我把信折回原样，想到文台从前带兵来投时那副有话便直说的模样；如今再想借他出力，已不是一道军令便能办到。\n\n使者问是否还有话带给刘荆州。我没有立刻回答。应下这桩事后，消息若泄露，旁人便会知道我与刘表联手谋害旧部；可任孙坚携玉玺远走，旁人又会怎样看袁氏的声势？墨已经磨好，回信仍等着落笔。"
 hds.5001.a:0 "约景升共图文台。"
 hds.5002.t:0 "风声"
 hds.5002.desc:0 "送口信的人不肯久留，连水也只喝了半盏。他说袁术与刘表近日往来密切，又压低声音劝我，出入务必多带些人。追问消息从何而来，他却只摇头。\n\n我叫人送他离开，重新查看近日收下的书信。字句都还寻常，再读时，连平常的问候也让我生疑。玉玺仍在我手里，这便足够招人惦记；至于他们究竟商议过什么，我还没有凭据。\n\n门前的卫士换了班，甲叶相碰的声音传进来。若听一则风声便闭门不出，部众如何看我？可旧日同席饮酒的人，也未必还肯替我挡下一箭。我吩咐近侍留心来往之人，消息未经证实，先别让军中乱了人心。"
 hds.5002.a:0 "兵来将挡，何足道哉。"
 hds.5003.t:0 "岘山之祸"
 hds.5003.desc:0 "前骑忽然勒马，山路上接连滚下几块石头。还不等我问话，林间的弓弦便响了，身旁一名骑士扑倒在地，缰绳从我膝边拖过。\n\n“护住将军！”有人抢到前面，盾上立刻钉进数支箭。我拔剑催马，想从来路冲出去，后方却也传来了喊杀声。伏兵认准了我的旗号，箭矢追着马匹落下；那则来历不明的口信，此刻才显出分量。\n\n我仍不知道是谁把行踪送到了这里，也顾不上再想玉玺的事。手臂渐渐使不上力，替我牵马的人满脸是血，却还在喊我向前。我还没有带这些人找到安身之地，不能全折在这条山道上。"
 hds.5003.a:0 "恨不能归江东！"
