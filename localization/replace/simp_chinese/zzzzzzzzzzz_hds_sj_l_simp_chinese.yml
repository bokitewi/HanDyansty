l_simp_chinese:
 hds_sj_heavy_army:0 "孙氏江东重步军"
 HDS_WU_INVASION_WAR_NAME:0 "孙氏进取丹阳之战"
 hds.5000.t:0 "自立之心"
 hds.5000.desc:0 "替袁术奔走了这些年，你麾下的人随你转战各地，你名下却始终只有一处庄园。每回清点部众，总有人在帐外低声相问：我们究竟为谁而战？\n\n江东的舆图就摊在案头。丹阳山川纵横，据地自守的人也不是打不下来。自己的土地终究要自己去取；在旁人的旗号底下，永远只能分到旁人剩下的残羹。\n\n你把袁术最近的军令推到一边，久久没有出声。"
 hds.5000.a:0 "不复寄人篱下，自取丹阳！"
 hds.5000.b:0 "时机未至，姑且再忍。"
 hds.5001.t:0 "密谋孙坚"
 hds.5001.desc:0 "孙坚弃你而去，自立旗号；更要紧的是，传国玉玺还攥在他手里。\n\n刘表的使者已在厅外候了两日，信里说得明白：此人若得江东、又得玉玺，便不会再听任何人的号令。荆州与你并无旧怨，眼下却有同一个对头。\n\n你提笔回信，只寥寥数语：事成之后，各取所需。"
 hds.5001.a:0 "约景升共图文台。"
 hds.5002.t:0 "风声"
 hds.5002.desc:0 "营中近来多了些生面孔，往来的信使也比往日勤了。有人悄悄捎来一句口信：袁术与刘表之间，似乎正商议着与你有关的事。\n\n玉玺在你手中，早已是天下皆知的事。你并非没想过会有这一天，只是没料到来得这样快。\n\n你命人加紧戒备，可荆襄与袁术两头，都不是你能一口气防住的。"
 hds.5002.a:0 "兵来将挡，何足道哉。"
 hds.5003.t:0 "岘山之祸"
 hds.5003.desc:0 "你率轻骑出营，本想去探一探荆襄虚实，山道两侧忽然箭如雨下。\n\n黄祖的伏兵早已在林中等候，退路被截，随行的人一个接一个倒下。你在乱箭中拔剑，忽然想起那句捎到营中的口信，想起袁术与刘表此刻的笑脸。\n\n玉玺，终究要换主人了。"
 hds.5003.a:0 "恨不能归江东！"
