l_simp_chinese:
 hds.1000.t:0 "荆州立足"
 hds.1000.desc:0 "讨董诸侯各自散去，荆州亦须有人主持大局。我将接掌荆州，依靠本地士人逐步整合各郡，而不向州外发动征服。"
 hds.1000.a:0 "先安荆州，再定诸郡。"
 hds.1001.t:0 "蒯越归附"
 hds.1001.desc:0 "蒯越愿以其所领之地归入我的治下。我将接纳他为封臣，与之订盟，共同稳定荆州。"
 hds.1001.a:0 "与异度共安荆楚。"
 hds.1002.t:0 "蔡瑁归附"
 hds.1002.desc:0 "蔡瑁愿率其部属归附。荆州水陆相接，唯有把州内势力联结起来，才能使百姓免于无休止的争战。"
 hds.1002.a:0 "与德珪订立盟约。"
 hds.1003.t:0 "荆州已定"
 hds.1003.desc:0 "荆州法理范围内的各郡，如今皆由我本人或我的封臣持有。州内大局已定，此后当以守境安民为先，不再主动兴兵。"
 hds.1003.a:0 "保境安民，不复外征。"
 hds.2000.t:0 "出逃南阳"
 hds.2000.desc:0 "董卓已经入京。京中局势不再容我久留，南阳宛城正可作为新的立足之地。我将迁移原有庄园，保全家业与部属。"
 hds.2000.a:0 "迁庄宛城。"
 hds.2001.t:0 "孙坚来投"
 hds.2001.desc:0 "孙坚率部前来，愿助我取得南阳。他将处置现任南阳太守，交出原有的地方统治头衔，只保留孙氏庄园与家业，迁来南阳为我效力。"
 hds.2001.a:0 "据南阳，纳文台。"
 hds.2002.t:0 "南阳自立"
 hds.2002.desc:0 "讨董联盟已经解散，旧日共同进退的约束也随之结束。我将以南阳为根基自立，主张豫州与扬州的统治权，先以豫州为进取方向。"
 hds.2002.a:0 "以南阳为基，先图豫州。"
 hds.3000.t:0 "受命于天"
 hds.3000.desc:0 "我曾亲身参与讨董之战，而联盟最终得胜。如今诸侯散去，传国玉玺辗转来到我的手中。此物事关天下名分，务必妥为保管。"
 hds.3000.a:0 "谨守此玺。"
 hds.4000.t:0 "承继父业"
 hds.4000.desc:0 "父亲已经去世，孙氏原有庄园与应继承的头衔已交到我的手中。家业并非从头再建，父亲留下的根基仍在；接下来，该由我决定孙氏的道路。"
 hds.4000.a:0 "承家业，续父志。"
 hds.4001.t:0 "转向江东"
 hds.4001.desc:0 "依附袁术并非长久之计。我将带着继承的孙氏庄园独立，主张扬州的统治权，转向江东。若传国玉玺确在我手中，便交给袁术换取五千重步兵。"
 hds.4001.a:0 "脱离袁术，进取江东。"
 hds.4002.t:0 "周瑜来归"
 hds.4002.desc:0 "至交周瑜愿来与我共事，并带来两千轻步兵。待他交接旧职、安顿家业，我们便能共图江东。"
 hds.4002.a:0 "公瑾，与我共成大业。"
 hds.4003.t:0 "进取吴郡"
 hds.4003.desc:0 "江东事业，先从吴郡开始。我将率军进取吴郡，夺取孙氏的立足之地。若时机尚未成熟，便整军待机，不轻弃此志。"
 hds.4003.a:0 "先定吴郡。"
 hds.4004.t:0 "立足江东"
 hds.4004.desc:0 "吴郡已成为孙氏在江东的立足之地。此后当以吴郡为根基，逐步整合扬州诸郡，开创孙氏的江东基业。"
 hds.4004.a:0 "由吴郡而定扬州。"
 hds_sc_heavy_army:0 "江东重步军"
 hds_sc_light_army:0 "周瑜江东义从"
 hds_regional_cb:0 "个人历史统一"
 hds_regional_cb_name:0 "个人历史统一"
 hds_wu_invasion_cb:0 "进取吴郡"
 hds_wu_invasion_cb_name:0 "进取吴郡"
 HDS_REGIONAL_WAR_NAME:0 "[ATTACKER.GetShortUIName]整合[TITLE.GetBaseNameNoTier]之战"
 HDS_WU_INVASION_WAR_NAME:0 "孙策进取吴郡之战"
 hds_war_victory_desc:0 "取得目标郡范围内应转移的敌方头衔及其男爵领；中立第三方领地不在此次结算中。"
 hds_war_no_conquest_desc:0 "不转移领土。本次战事结束后，尚未完成的个人历史目标仍可在条件恢复时重新判定。"
 hds_liu_guarding_jingzhou:0 "荆州守成"
 hds_liu_guarding_jingzhou_desc:0 "荆州全部法理郡国已归本人的封臣体系，此后保境安民，不再主动宣战。"
 hds_southern_campaign_ai:0 "南方历史进取"
 hds_southern_campaign_ai_desc:0 "由专用历史调度判定区域进攻，不额外要求满额战备金或完全和平。"
