l_simp_chinese:
 hds.1000.t:0 "荆州立足"
 hds.1000.desc:0 "讨董诸军各归州郡，昔日会盟时尚肯相让的事，如今都得重新商量。荆州也不能单凭一纸名位，便叫各处兵众与官署自行安定。\n\n你把州内舆图在面前展开，请熟知乡里的士人说明道路与人情。有人所领兵众虽少，却扼着水陆要冲；有人从不出面，宗族宾客的话却能传遍数县。若只凭外来的号令逐一压服，未必比耐心结纳他们来得快。\n\n先在荆州立足，再收整诸郡。天下既已纷乱，你总得先让治下的人知道，明日该向何处听令。"
 hds.1000.a:0 "接掌荆州，先结州中士人。"
 hds.1001.t:0 "蒯越归附"
 hds.1001.desc:0 "蒯越的来意终于说明白了：他愿将所领之地归入你的节制，也愿与你订盟，共安荆州。\n\n你没有急着把话说满，而是请他将当地的兵众、道路与难处逐一道来。异度熟知乡里，许多在州府簿册上只有一个名字的人，到他口中便各有来历与牵连。要叫这些人奉同一道号令，不是改一处文书上的署名便能办到的。\n\n谈到暮色入堂，交接之事才算议定。你为他留下一席，也为日后的彼此援应留下一份承诺。荆州的根基，便从这些肯坐下来共议的人身上扎起。"
 hds.1001.a:0 "纳其归属，与异度订盟。"
 hds.1002.t:0 "蔡瑁归附"
 hds.1002.desc:0 "蔡瑁愿率所部归附的消息送来，州中事务又多了一处可依凭的地方。你命人请他入议，不必先把礼辞说得周全，只须把所领的人马与地方说个明白。\n\n荆州道路沿江汉相连，一处关津不通，邻近郡县也难独自安稳。德珪来归，既添了一份兵力，也让原先各有号令的人能坐到一处共议守备。\n\n你将面前的舆图向他推近些。日后如何约束、如何援应，今日便该说清，免得各自回去以后，又把同一场会面讲成两样许诺。"
 hds.1002.a:0 "接纳蔡氏部属，与德珪订盟。"
 hds.1003.t:0 "荆州已定"
 hds.1003.desc:0 "州内最后几份交割文书终于送齐。荆州诸郡如今都已归你节制，往日要遣使反复问讯的地方，开始按同一套次序报送事务。\n\n左右有人趁势谈起向外进兵，你却先问各县仓储与守备。取一座城可以凭军势；要让拿下的地方不再生乱，却得多花许多不见声势的工夫。新附的官吏、地方的旧族、兵众与百姓，都在看州府接下来要向他们索取什么。\n\n你把外征的议论暂且压下。荆州既定，往后当以守境为先；已开的战事仍须收尾，来犯之敌也不能坐视。"
 hds.1003.a:0 "保境安民，不复外征。"
 hds.2000.t:0 "出逃南阳"
 hds.2000.desc:0 "董卓的甲士又从府门外经过，车轮声停下之后，堂中连说话都轻了。你看着左右那副怕惹事的神情，越发不愿在雒阳多住一日。\n\n袁氏的门第，难道还要靠他肯不肯放行来维持？宛城有庄业可依，家中人众也可一并迁去。留在这里陪那些失势的公卿低头，倒真像你已无路可走了。\n\n书吏捧来行装清单，你叫他先点家资与随行人众。宅第带不走便留着，日后自会有人愿往南阳来见你，不必都挤在董卓门前。"
 hds.2000.a:0 "迁家业于宛，去此是非之地。"
 hds.2001.t:0 "孙坚来投"
 hds.2001.desc:0 "孙坚说愿替你取下南阳，你便叫人把酒再添上。文台说话不绕弯子，既带得来兵，也肯办事，比那些捧着空名来求见的人强得多。\n\n他说到原任职守与孙氏家业的交割，你听罢点头。至于南阳旧守——他若肯让路便罢，若是不肯，文台手中的刀，向来比往来的文书快。\n\n你将舆图向他推过去。袁氏有根基，孙氏有锐兵，彼此各取所需，正好成一番事业。南阳落定以后，往来之人自会知道，这里已不是旧日的号令了。"
 hds.2001.a:0 "借文台之兵，取南阳之地。"
 hds.2002.t:0 "南阳自立"
 hds.2002.desc:0 "讨董联盟散了，旧日同进同退的名义也渐渐没了分量。案上仍放着会盟时留下的文书，门外来问的，却已是南阳今后的兵粮与疆界。\n\n你将旧盟书收起。袁氏在此有家业，有部属，也有足以向邻州发声的兵众；若仍事事等昔日盟主安排，便只会把眼前的机会让给旁人。\n\n豫、扬二州都在你的经营之中，第一步却须先看豫州。南阳是立足之地，不能只是暂避雒阳风波的一间客舍。你命人另拟军议——自此，为自家基业发令。"
 hds.2002.a:0 "据南阳自立，先图豫州。"
 hds.3000.t:0 "掌中玉玺"
 hds.3000.desc:0 "讨董之战已胜，诸军陆续收兵。传国玉玺辗转送到你手中时，身旁的人先屏住了呼吸，仿佛这方玉比帐外未散的兵马还要沉重。\n\n你将它翻转细看，“受命于天，既寿永昌”八字在灯下泛着光。出兵时打的是扶持汉室的旗号，如今象征天子权柄之物却落到自己手里，往后无论藏是露，都不再是寻常器物的处置。\n\n有人欲言又止，你先合上了匣盖。握有玉玺，并不等于四方从此听命；可消息一旦传出去，觊觎它的人绝不会等你把道理想清。此物须先妥善收存。"
 hds.3000.a:0 "收存玉玺，慎防外泄。"
 hds.4000.t:0 "承继父业"
 hds.4000.desc:0 "家中旧物一件件送到你面前，来交割的人仍顺口称着父亲，话说到一半才慌忙改口。你没有催他，等他把那一声称呼咽了回去。\n\n簿籍上的庄业与名位，如今都归你承接。父亲留下的人还在，先前想做而未成的事也还在，只是再不会有人坐在上首，替你把最后一句话说完。\n\n你翻开簿册，看不多时便嫌那些数目闷得胸口发紧，索性叫旧部近前议事。孙氏不能只剩一堆等你看管的家当。先把父业接稳，往后的路，你要亲自走出去。"
 hds.4000.a:0 "承父遗业，不敢失坠。"
 hds.4001.t:0 "转向江东"
 hds.4001.desc:0 "袁术的军令又摆到案上，你只看了几行，便将它推到一旁。父亲留下的人难道要一直替旁人奔走？孙氏自己的旗，难道永远只跟在别家旗后？\n\n江东的舆图展开，你用指节叩了叩扬州所在。离开这里，庄业仍是孙氏的庄业；所缺的兵，若玉玺尚在，便拿去与袁术换——他看重匣中那方玉，你要的，是能随你向前的甲士。\n\n若玉玺已不在手，也不能就此坐回原处。你叫人点清部众。去意已决，余下的，只看这一步怎样迈出去。"
 hds.4001.a:0 "辞别袁术，引兵东渡。"
 hds.4002.t:0 "周瑜来归"
 hds.4002.desc:0 "听说周瑜到了，你把案上的军报一推，起身便往外迎。公瑾的礼还没行完，你已拉着他问起随行的兵众，连旁人备好的客套话也没留个空。\n\n他带来的兵马固然可喜，更可喜的是终于有人能与你坐下来，把江东的打算从头说个痛快。他的旧职与家业自有人去料理，眼前这张舆图，却不必再等。\n\n你们从渡口说到粮道，又为一处进兵方向争了几句。积在胸中许久的烦闷，不知何时已散了。公瑾既至，许多只在心里转过的事，终于可以拿出来做了。"
 hds.4002.a:0 "迎公瑾与兵众，共议江东。"
 hds.4003.t:0 "先取丹阳"
 hds.4003.desc:0 "“先取丹阳。”你将手按在舆图上，帐中几人顺着看过来，方才还散在扬州各处的议论，总算有了落脚之处。\n\n离开袁术以后，你已听够了旁人问孙氏要往哪里去。丹阳有山川关津，也有据地自守的豪强；先打眼前这个对手，余下的再一处处收拾，总不能因为全郡未得，便连第一步都不敢迈。\n\n帐外的兵众已在待命，你也不愿再坐着数图上的城池。江东不是旁人肯给才有的地方。先在丹阳立住脚，再让他们看看，孙氏的旗号能走到哪里。"
 hds.4003.a:0 "以丹阳为先，整军进取。"
 hds.4004.t:0 "丹阳立足"
 hds.4004.desc:0 "丹阳各处交割的回报终于到齐。你叫人把图上那些尚标着别家归属的地方逐一改过，看着孙氏的疆土连成一片，竟比听一番颂功还要痛快。\n\n有人问可否暂罢军议，你没有答，只把扬州的舆图又展开了些。丹阳已定，粮道与城邑总算有了根本；后头还有诸郡，也还有等着看你止步于此的人。\n\n新得之地须安置，下一步用兵也得有分寸，这些你自然清楚。可案上的图不必急着卷起——好容易有了自己的立足之处，岂是为了从此不再向前？"
 hds.4004.a:0 "以丹阳为本，进图扬州。"
