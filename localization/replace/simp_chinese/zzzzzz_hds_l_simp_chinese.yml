 HDS_REGIONAL_WAR_NAME:0 "[ATTACKER.GetShortUIName]整合[TITLE.GetBaseNameNoTier]之战"
 HDS_WU_INVASION_WAR_NAME:0 "孙氏进取丹阳之战"
 hds_war_victory_desc:0 "进攻方夺取目标郡内敌方所据之地，当地封臣随之改投。"
 hds_war_no_conquest_desc:0 "此战无所得，各守原境；待时机再至，仍可再图。"
 hds_liu_guarding_jingzhou:0 "荆州守成"
 hds_liu_guarding_jingzhou_desc:0 "荆州诸郡尽归节制，该角色从此保境安民，无意外征。"
 hds_southern_campaign_ai:0 "南方历史进取"
 hds_southern_campaign_ai_desc:0 "该角色据地自雄，常思向四方用兵。"
