l_english:
 # English translations of the existing Chinese event text for the 22, 370, and 531 bookmarks.

 hd_22.0110.t:0 "The Meeting at Yiqiu"
 hd_22.0110.desc:0 "The Liu brothers face Zhen Fu in Nanyang with only a small force. Hearing that the Xiajiang army is encamped at Yiqiu, Liu Yan comes in person to explain why they should join forces. Most of the Xiajiang commanders are unconvinced. Only Wang Chang argues firmly in his favor: Wang Mang's rule is cruel, the people long for the Han, and the Liu brothers are certain to achieve great things."
 hd_22.0110.a:0 "Join the Chunling army against Zhen Fu."
 hd_22.0110.b:0 "The Xiajiang army will find its own way."
 hd_22.0120.t:0 "Liu Xuan Proclaimed Emperor"
 hd_22.0120.desc:0 "The Lulin commanders want to proclaim a member of the Liu imperial clan emperor, so that they can issue commands to the realm in his name. Liu Yan's prestige is too great: the commanders of Xinshi and Pinglin fear that they could not control him if he took the throne. Instead, they put forward the timid Liu Xuan. An altar is raised beside the Yu River, where Liu Xuan ascends the throne and proclaims the Gengshi era. Will you acknowledge him as your sovereign?"
 hd_22.0120.a:0 "Acknowledge the Gengshi Emperor."
 hd_22.0120.b:0 "I will not serve this man. I will follow my own course."
 hd_22.0130.t:0 "The Siege of Kunyang"
 hd_22.0130.desc:0 "Wang Mang has sent Grand Minister of Works Wang Yi and Minister of the Masses Wang Xun with a great army. Their banners and baggage stretch for a thousand li, and their lines encircle Kunyang many times over. With troops and provisions limited inside the city, the commanders all want to abandon the city. I press my hand against the map. ‘We have few soldiers and little grain,’ I tell them. ‘If we scatter, the enemy will hunt us down one by one. Our best chance is to hold Kunyang together.’"
 hd_22.0130.a:0 "Hold Kunyang. We must stand together."
 hd_22.0130.b:0 "We are hopelessly outnumbered. Abandon the city."
 hd_22.0140.t:0 "Independence in Shu"
 hd_22.0140.desc:0 "Since word arrived from Kunyang, local leaders across the realm have killed Xin governors, declared themselves generals, and adopted Han era names. The leading men of Shu come to urge you to act as well: The realm is in turmoil, and Shu is protected by formidable terrain. We can hold it and await developments."
 hd_22.0140.a:0 "Hold Shu as an independent ruler."
 hd_22.0140.b:0 "Continue to serve Xin."
 hd_22.0145.t:0 "Rebellion on Every Side"
 hd_22.0145.desc:0 "Reports arrive one after another: Wei Xiao has risen in Tianshui, Gongsun Shu has declared himself independent in Shu Commandery, and governors east of the passes have killed your envoys or simply opened their gates to the Han. The ritual masters in the palace urge you to worship Heaven and plead in tears; your ministers advise a general amnesty to regain the people's allegiance."
 hd_22.0145.a:0 "Order a campaign against the rebels. Punish the traitors."
 hd_22.0145.b:0 "Grant a general amnesty to reassure the people."
 hd_22.0150.t:0 "The Fall of Chang'an"
 hd_22.0150.desc:0 "Han troops enter through Xuanping Gate. Young men of the city, including Zhu Di and Zhang Yu, set fire to the Zuoshi Gate, and the flames spread to the inner palace. Clutching the ritual Dipper, you sit in the front hall of Xuanshi Palace and murmur: Heaven has bestowed virtue upon me. What can the Han troops do to me? Your ministers urge you to move to Jiantai Terrace, while others advise fleeing in the confusion."
 hd_22.0150.a:0 "Abandon the city. Yield Heaven's Mandate to the Han."
 hd_22.0150.b:0 "Heaven's Mandate is mine. I will hold my ground."
 hd_22.0155.t:0 "West through Wuguan"
 hd_22.0155.desc:0 "Governors across the realm are abandoning Xin, and the leading men of Guanzhong await the Han armies. Deng Ye and Yu Kuang of Xi County have already risen in support and offer to lead the way. The time has come to send commanders west through Wuguan Pass and strike directly at Chang'an."
 hd_22.0155.a:0 "Send commanders west through Wuguan."
 hd_22.0155.b:0 "Guanzhong is well defended. Delay the advance."

 hd_370.0110.t:0 "The Siege of Jinyong"
 hd_370.0110.desc:0 "Wang Meng's letter arrives inside the walls. Its tone is courteous: Luoyang is isolated, he writes, and relief may never come; I would do well to consider my position. I read it twice, then send someone to the battlements to look for signal fires toward Shimen.\n\nThe Prince of Le'an's reinforcements have indeed arrived, but still there is no word from them. Our provisions will last a while longer; confidence is dwindling faster than grain. If I open the gates, the townspeople and I may survive, but Yan will lose Luoyang. If I hold out, I must trust that the relieving army can actually defeat Qin."
 hd_370.0110.a:0 "Open the gates and surrender to Qin."
 hd_370.0110.b:0 "Hold Jinyong and await reinforcements."
 hd_370.0120.t:0 "The Campaign against Yan"
 hd_370.0120.desc:0 "Wang Meng lays out his route on the table: out through Puban, across Huguan, on to Jinyang, then straight down to Ye. Yan looks vast, he says, but ruler and ministers are estranged. Murong Ping thinks only of enriching himself; when fighting comes, few may be willing to die for him.\n\nYet once this war begins, there will be no turning back. Qin's forces are far smaller than Yan's. If our army becomes bogged down beneath a fortified city, Guanzhong itself will be left exposed. Wang Meng waits for me to speak."
 hd_370.0120.a:0 "Order Wang Meng to march east."
 hd_370.0120.b:0 "The time is not yet right. Rest the troops."
 hd_370.0130.t:0 "The Fall of Ye"
 hd_370.0130.desc:0 "In the night, the north gate suddenly opens. A hostage from Buyeo has let the Qin troops into the city. By the time someone wakes me, fires are burning everywhere beyond the palace.\n\nThose around me urge me to slip out in the confusion and return north to Longcheng, where the Murong clan first rose to power. There, I could gather an army again. Others say the King of Qin has always been merciful: if I go out and surrender, I can at least save my clan. All I have left is this palace enclosure. Where am I to go?"
 hd_370.0130.a:0 "Go out and offer my surrender."
 hd_370.0130.b:0 "Escape north to Longcheng in the confusion."
 hd_370.0135.t:0 "The End of Yan"
 hd_370.0135.desc:0 "Ye has fallen. When word arrives that the emperor has surrendered, more than half my followers disappear overnight. The Qin will surely hold me to account for the defeat at Luchuan, and for the riches I have amassed over the years.\n\nGoguryeo to the east may still shelter me, but I would be living at another ruler's mercy, with an uncertain future. If I stay and beg the King of Qin's forgiveness, my life will rest entirely on his decision."
 hd_370.0135.a:0 "Seek refuge in Goguryeo."
 hd_370.0135.b:0 "Stay and await judgment."
 hd_370.0140.t:0 "A Campaign against Shouchun"
 hd_370.0140.desc:0 "The Grand Marshal's memorial reaches the palace. The Yuan clan has rebelled at Shouchun and conspired with Yan and Qin, he writes, asking the court to issue an edict against them. His words are full of righteous indignation. Everyone knows that once this war is over, Huan Wen's standing will rise higher still.\n\nYet as long as Shouchun remains in rebel hands, Huainan will have no peace. An edict would rid the realm of a threat, but also give the Grand Marshal another victory to his name. Withholding it may not stop him from acting on his own."
 hd_370.0140.a:0 "Issue an edict to attack Shouchun."
 hd_370.0140.b:0 "The court will send no troops."
 hd_370.0145.t:0 "The Shouchun Campaign"
 hd_370.0145.desc:0 "The court's edict has arrived in Guangling, ordering me to lead an army against Shouchun. After my defeat at Fangtou, I badly need a victory to restore my reputation. But Shouchun has strong walls and ample supplies, and the Yuan clan has reinforcements from both Yan and Qin. A prolonged siege would only invite more ridicule.\n\nXi Chao urges me to march. Take Shouchun, he says, and the realm will forget Fangtou. The officers and men are waiting for my orders too."
 hd_370.0145.a:0 "Lead the army to besiege Shouchun in person."
 hd_370.0145.b:0 "Let the court fight its own war."
 hd_370.0148.t:0 "Shouchun Besieged"
 hd_370.0148.desc:0 "The Jin army has made camp outside the city, and its trenches grow deeper every day. The reinforcements promised by Yan have not arrived. Qin's envoys have come and gone, leaving only empty words.\n\nThe officers and men within the walls still obey me, and our granaries are not yet empty. If I hold out, our fortunes may change. If I open the gates, the court may never forgive my rebellion."
 hd_370.0148.a:0 "Hold Shouchun to the last."
 hd_370.0148.b:0 "Open the gates and surrender."
 hd_370.0150.t:0 "A Change of Emperor"
 hd_370.0150.desc:0 "Xi Chao visits me at night. Since Fangtou, he says, I no longer command the allegiance I once did. To restore my authority, I must act as Yi Yin and Huo Guang did. The emperor has committed no fault during his reign, so Xi Chao proposes finding a plausible pretext among the affairs of the inner palace.\n\nThe Prince of Kuaiji has long enjoyed an unblemished reputation. His accession would probably meet with little opposition at court or beyond. Once I do this, there can be no retreat. Yet if I do nothing, the prestige I have built over so many years may slowly slip away."
 hd_370.0150.a:0 "Depose the Duke of Haixi and enthrone the Prince of Kuaiji."
 hd_370.0150.b:0 "This cannot be done."
 hd_370.0160.t:0 "The Empress Dowager's Decree"
 hd_370.0160.desc:0 "The Grand Marshal enters the palace with the assembled officials and asks the Empress Dowager to order my deposition. He claims I am impotent, and that none of the children in the palace are mine. No one in the hall speaks in my defense. Even my closest attendants keep their heads bowed.\n\nIf I comply, I am agreeing to relinquish the throne. Where I go from there will be for others to decide. If I refuse, I can only hope that someone beyond the palace is still willing to fight for the Son of Heaven. Huan Wen's army is already outside the city."
 hd_370.0160.a:0 "Agree to abdicate."
 hd_370.0160.b:0 "I am the Son of Heaven. I will never abdicate."
 hd_370.0170.t:0 "Called to the Throne"
 hd_370.0170.desc:0 "The officials arrive at my residence bearing the imperial seal and ask me, the Prince of Kuaiji, to ascend the throne. I know this is the Grand Marshal's will, not Heaven's. From now on, I may sit upon the dragon throne without being the one who governs.\n\nRefusal might preserve the unblemished reputation I have kept for so many years, but Huan Wen's next choice may be less suited to the task. Acceptance means becoming an emperor who must tread carefully beneath the Grand Marshal's gaze."
 hd_370.0170.a:0 "Ascend the imperial throne."
 hd_370.0170.b:0 "Refuse without yielding."

 hd_531.0110.t:0 "An Emperor at Xindu"
 hd_531.0110.desc:0 "When Gao Qian and Sun Teng mention Yuan Lang, the men who were arguing over troops and grain fall silent. The two urge me to acknowledge another member of the imperial clan as sovereign. The emperor in Luoyang was installed by the Erzhu. If Hebei continues to obey the same decrees, it will be difficult to explain the grounds for our uprising to the provinces.\n\nI have someone inquire closely into Yuan Lang's circumstances. A prince's name can be written into a proclamation, but the man brought before the army will be a living sovereign. He may not consent to being merely a banner in my hands. For now, the armies need to unite, and the scholars of Hebei need to know whom they serve. A new emperor would give them an answer. I look at the two men, still waiting. Once I declare my allegiance, old ties alone will no longer suffice between the Erzhu and me."
 hd_531.0110.a:0 "Enthrone Yuan Lang and proclaim the Zhongxing era."
 hd_531.0110.b:0 "It is too soon to break openly with the Erzhu."
 hd_531.0120.t:0 "The Attack on Ye"
 hd_531.0120.desc:0 "When Ye is mentioned, the commanders go over the roads of Hebei once again. We have secured a foothold in Ji Province, but the city held by Liu Dan still constrains the movement of our grain and troops to the south. If we mean to join our holdings together, we cannot keep going around it forever.\n\nI call for the reports on the city's defenses. How many men can we muster, and how much grain can we take? Those questions must be answered first. Whether Liu Dan will give way is another matter; I cannot answer for him. Ye is a vital position, but attacking it will inevitably widen the conflict. Those eager to fight say they are ready to march. The cautious insist that we secure Ji Province first. I listen to both sides and set down the dispatch in my hand. If I order an advance today, next time I must answer with results on the battlefield."
 hd_531.0120.a:0 "March on Ye."
 hd_531.0120.b:0 "Secure Ji Province first."
 hd_531.0130.t:0 "Muster South of Ye"
 hd_531.0130.desc:0 "The converging armies report in one after another. When the commanders speak of Gao Huan, their voices are louder than before. He may hold Ye, they say, but his troops are far fewer than ours. We need only attack together to reclaim Hebei.\n\nI look at the different banners and listen as they argue over who will lead the vanguard and who will guard the supply routes. They all bear the Erzhu name, yet each has his own old grievances and designs. Marching arrangements agreed yesterday are already being changed on one pretext or another. Whether Gao Huan can be captured will be decided after the battle. Whether these troops can obey a single command must be settled now. If I advance, I take this discord with me. If I do not, I leave him to grow stronger. The officer reporting to me still stands nearby, waiting for my decision."
 hd_531.0130.a:0 "Combine our armies and attack Ye."
 hd_531.0130.b:0 "Each branch has its own designs. We will not march."
 hd_531.0140.t:0 "Defeat at Hanling"
 hd_531.0140.desc:0 "On hearing of the rout at Hanling, I first order the city gates secured, yet men are still slipping away. Many of the troops counted yesterday are already missing. When I ask where they have gone, the camps give vague answers, as though silence will keep the men on the rolls.\n\nSomeone urges me to go south and seek refuge in Liang: better that than waiting here for Gao Huan. The suggestion suddenly feels very close. Abandoning the city might let me escape the defeat, but I would have to relinquish my provinces and commanderies, and everything I have spent years building. I look at the subordinates still willing to stay. They want to know whether I too will leave. Gao Huan's troops are not yet before us, but I cannot wait until we are surrounded to decide. Do I head south while I can, or remain here and hold this city with them?"
 hd_531.0140.a:0 "Abandon the city and flee south to Liang."
 hd_531.0140.b:0 "Hold the city to the last."
 hd_531.0150.t:0 "An Emperor in Luoyang"
 hd_531.0150.desc:0 "Husi Chun's messenger does not linger before the army. He says only that allies are ready in Luoyang and can act once I march south. After hearing him out, I send him away and ask whom we should enthrone upon entering the city. The answers gradually settle on Yuan Xiu, Prince of Pingyang.\n\nVictory at Hanling has broken the Erzhu's former ascendancy. Yet if I remain in Hebei, others will still wield the titles and decrees of Luoyang. Entering the capital and enthroning Yuan Xiu would put the court's power in my hands, but would also mean that the new emperor and I would hold one another in check. I remember the cause under which I first gathered my followers. Each time I change the emperor I support, I must explain myself to them again. Others have opened the road south for me. Whether I follow it into Luoyang is now mine to decide."
 hd_531.0150.a:0 "Enter Luoyang and enthrone the Prince of Pingyang."
 hd_531.0150.b:0 "Stay out of Luoyang and remain independent in Hebei."
 hd_531.0160.t:0 "Husi Chun's Coup"
 hd_531.0160.desc:0 "The gatekeeper runs back to say that soldiers have blocked the streets outside. I rise and start toward the door, but those beside me stop me. Husi Chun has risen in Luoyang and is hunting down members of the Erzhu clan. If I go out now, I may never return.\n\nWord of the defeat at Hanling has barely arrived, yet familiar visitors are already disappearing. I ask how many guards the household can gather, and whether the road to my own lands remains open. Both questions draw answers, but no one dares promise safety. The power I gained by remaining at court now marks me out to those pursuing me. If I leave by night, I may reach my lands and preserve my troops. If I bar the doors and resist, I will have to fight Gao Huan in earnest. Another knock comes from outside. This time, no one gives a name."
 hd_531.0160.a:0 "Flee by night and return to my own lands."
 hd_531.0160.b:0 "Bar the doors. Fight Gao Huan to the death."
 hd_531.0170.t:0 "Abdication"
 hd_531.0170.desc:0 "Gao Huan's envoy asks me to step aside. I was installed by the Erzhu, he says, and the people have not given me their allegiance. I should yield the throne to the Prince of Pingyang. He speaks respectfully, but the troops outside the hall make every courteous word require no further explanation.\n\nAt the Prince of Pingyang's name, I look at the ministers present. They stood here offering congratulations when the Erzhu raised me to the throne. Now the man commanding the armies has changed, and someone has once again prepared the words for me, this time to leave the imperial seat. An edict of abdication would at least avert an immediate clash, but I would surrender the imperial succession and all its authority along with it. If I refuse, I must face the assault of Gao Huan's army. The envoy remains prostrate, waiting and pressing me for an answer he can take back to the camp."
 hd_531.0170.a:0 "Issue an edict of abdication."
 hd_531.0170.b:0 "I am the Son of Heaven. I will not yield."
