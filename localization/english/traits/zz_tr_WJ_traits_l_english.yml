l_english:
 trait_WJ_mr_jiangjun_anbei_desc:0 "The title Anbei, 'Pacifier of the North', is named for bringing peace to the northern frontier. The court bestowed it on this character hoping they would guard the passes and pacify the Hu, so that the border folk may sleep soundly."
 trait_WJ_mr_jiangjun_andong_desc:0 "The title Andong, 'Pacifier of the East', is named for calming the eastern lands. The court bestowed it on this character hoping they would soothe Qing and Xu and bring the scattered people back to their fields."
 trait_WJ_mr_jiangjun_annan_desc:0 "The title Annan, 'Pacifier of the South', is named for quieting the southern lands. The court bestowed it on this character hoping they would subdue the Shanyue south of the Yangtze with both kindness and might."
 trait_WJ_mr_jiangjun_anxi_desc:0 "The title Anxi, 'Pacifier of the West', is named for securing the western frontier. The court bestowed it on this character hoping they would garrison Longyou and gradually bring the Qiang and Di to submit to royal rule."
 trait_WJ_mr_jiangjun_caiguan_desc:0 "Caiguan originally meant strongmen able to draw powerful crossbows, and the General of Caiguan is so named for commanding such men. This character leads troops under this title, relying chiefly on the strength of foot soldiers."
 trait_WJ_mr_jiangjun_dangkou_desc:0 "The title Dangkou means to sweep away bandits. This character holds it as a special commission to hunt down outlaws, and brigands everywhere should flee at the mere rumor of their coming."
 trait_WJ_mr_jiangjun_dingbei_desc:0 "Titled Dingbei, meaning to subdue the north. Having received it, this character must draw the bow on the frontier and drive the northern barbarians far away."
 trait_WJ_mr_jiangjun_dingdong_desc:0 "Titled Dingdong, meaning to subdue the east. Having received it, this character must extend their might over the Huai and the sea, so that the local magnates restrain themselves."
 trait_WJ_mr_jiangjun_dingnan_desc:0 "Titled Dingnan, meaning to subdue the southern frontier. Having received it, this character must march deep into the miasmic lands and awe the many Man tribes with military might."
 trait_WJ_mr_jiangjun_dingnan_variant_2_desc:0 "The title 'Quells Calamity' means to put down disaster and disorder. Such men are usually commissioned amid chaos, charged with restoring order with but a single brigade."
 trait_WJ_mr_jiangjun_dingxi_desc:0 "The title 'Settles the West' means to subdue the western marches. Having received it, this character must ride across Hexi and Longyou until no Qiang or Hu within reach of their orders dares disobey."
 trait_WJ_mr_jiangjun_duliao_desc:0 "This title was first created for campaigns across the Liao River beyond the frontier; later its holders garrisoned the border commanderies and watched over the Hu tribes. Its bearer should know frontier affairs and the ways of the Hu intimately."
 trait_WJ_mr_jiangjun_fenwei_desc:0 "The title 'Roused Might' means to stir up martial power. This character is full of fiery spirit and should strive to be first in every battle."
 trait_WJ_mr_jiangjun_fenwu_desc:0 "The title 'Roused Valor' means to rouse martial courage. In times of chaos it is often given to newly risen heroes, and this character too expects to win renown through deeds."
 trait_WJ_mr_jiangjun_fubei_desc:0 "This title stresses conciliation of the northern frontier. Its bearer should open border markets and befriend Hu chieftains, keeping the lands beyond the passes at peace through good faith."
 trait_WJ_mr_jiangjun_fubo_desc:0 "The title 'Calms the Waves' means to subdue the billows; Ma Yuan once bore it on his southern campaign to Jiaozhi, and his fame spread far. Its bearer should master naval warfare and cross rivers and seas as if on level ground."
 trait_WJ_mr_jiangjun_fudong_desc:0 "This title stresses conciliation of the east. Its bearer should balance leniency with severity and win the hearts of the coastal people through virtue."
 trait_WJ_mr_jiangjun_fuguo_desc:0 "The title 'Supports the State' means to uphold the altars of the realm. This character regards themselves as a bulwark of the state, and their prestige exceeds that of ordinary generals."
 trait_WJ_mr_jiangjun_fujun_desc:0 "The title 'Supports the Army' means to act as a wing to the main host. This character often assists the commander in directing troops, advancing and withdrawing with good order."
 trait_WJ_mr_jiangjun_funan_desc:0 "This title stresses conciliation of the southern lands. Its bearer should treat the Yi and Yue well and bind distant peoples through kindness and trust."
 trait_WJ_mr_jiangjun_fuxi_desc:0 "This title stresses conciliation of the western marches. Its bearer should keep the Qiang and Di under loose rein; the best course is to replace war with peace."
 trait_WJ_mr_jiangjun_fuyuan_desc:0 "The title 'Soothes the Distant Lands' means to pacify faraway regions. This character often guards the outer frontier and should draw distant peoples in through kindness and trust."
 trait_WJ_mr_jiangjun_guanjun_desc:0 "The title 'Champion' means bravest of all three armies. This character prides themselves on their valor and often longs to hold a front alone."
 trait_WJ_mr_jiangjun_hengye_desc:0 "The title 'Sweeps the Plains' means to range freely across the open country. This character excels at leading light troops in dashing raids across the plains, coming and going like the wind."
 trait_WJ_mr_jiangjun_hou_desc:0 "One of the four Generals of the Front, Rear, Left and Right. The General of the Rear steadily guards the rear, and the army's advances and retreats depend on their firm foundation; this character should hold to calm resolve."
 trait_WJ_mr_jiangjun_hujun_desc:0 "The Protector of the Army oversees the generals and selects military officers. Holding this weighty title, this character moves among the generals, and much of the army's personnel business passes through their hands."
 trait_WJ_mr_jiangjun_huwei_desc:0 "The title 'Tiger Might' takes the might of a fierce tiger. This character should lead troops like a tiger crouching in the mountain forest, so that soldiers tremble at the sight."
 trait_WJ_mr_jiangjun_jianwei_desc:0 "The title 'Establishes Might' means to build a fearsome name. This character is eager to win merit and fame and does not shun hazards on the march."
 trait_WJ_mr_jiangjun_jianwu_desc:0 "The title 'Establishes Valor' means to achieve martial deeds. This character rose through battlefield merit and has known no rest from the saddle."
 trait_WJ_mr_jiangjun_jianzhong_desc:0 "The title 'Establishes Loyalty' means to stand for loyal integrity. This character holds themselves to loyalty and righteousness and has sworn their life to the state."
 trait_WJ_mr_jiangjun_jingbei_desc:0 "Titled 'Secures the North' in the hope of clearing the northern frontier. This character should hold the passes firmly so that Hu horsemen dare not knock at the border."
 trait_WJ_mr_jiangjun_jingbian_desc:0 "The title 'Secures the Frontier' means to bring peace to the borderlands. Long stationed on the frontier, this character knows the beacon towers and scouts well."
 trait_WJ_mr_jiangjun_jingdong_desc:0 "Titled 'Secures the East' in the hope of clearing the eastern lands. This character should put discipline first in commanding troops, so that coastal pirates scatter at the news."
 trait_WJ_mr_jiangjun_jinglue_desc:0 "The title 'Strategic Command' means to plan and manage. This character excels at planning; in attack and defense, advance and retreat, they follow sound method."
 trait_WJ_mr_jiangjun_jingnan_desc:0 "Titled 'Secures the South' in the hope of clearing the southern lands. This character should combine suppression with amnesty, until no more outlaw bands gather among the rivers and lakes."
 trait_WJ_mr_jiangjun_jingnan_zhong_desc:0 "The title 'Quells Disorder' means to put down calamity and rebellion. Commissioned in a time of peril, this character should step forward to prop up what is toppling."
 trait_WJ_mr_jiangjun_jingxi_desc:0 "Titled 'Secures the West' in the hope of clearing the western marches. This character should patrol the frontier and drive off raiders, so that the Long roads open again to merchants."
 trait_WJ_mr_jiangjun_jinu_desc:0 "This title is named for the command of strong crossbowmen. This character excels at arraying crossbow formations; under their rain of bolts, enemy horsemen can hardly approach."
 trait_WJ_mr_jiangjun_lingjun_desc:0 "The title 'Proclaims Might' means to make the state's power known. Whether sent as envoy to the frontier or leading troops on campaign, this character should display the court's power through military might."
 trait_WJ_mr_jiangjun_longxiang_desc:0 "'Soaring Dragon' evokes a dragon raising its head and leaping skyward. Bearing this weighty title, this character should carry themselves with grandeur and harbor ambitions that swallow wind and cloud."
 trait_WJ_mr_jiangjun_louchuan_desc:0 "This title is named for the command of fleets and warships. Well versed in naval warfare, this character often leads towered ships sailing down the Yangtze."
 trait_WJ_mr_jiangjun_piaoyao_desc:0 "'Piaoyao' describes swift ferocity; Huo Qubing once raided far with light cavalry as Colonel of Swift Valor, and the title became famous thereby. Bearing this weighty title, this character should excel at swift, long-range raids."
 trait_WJ_mr_jiangjun_pingbei_desc:0 "The title 'Subdues the North' aims to sweep the northern frontier clean. Leading troops under it, this character should pursue fleeing foes beyond the passes, so that the dust of the Hu never again blows south."
 trait_WJ_mr_jiangjun_pingdong_desc:0 "The title 'Subdues the East' aims to sweep the east clean. Leading troops under it, this character should wipe out the remaining bandits of Hai-Dai and restore peace to the eastern lands."
 trait_WJ_mr_jiangjun_pingnan_desc:0 "The title 'Subdues the South' aims to sweep the south clean. Leading troops under it, this character should cross south over the Jiang and Han, chastise the defiant and crush rebellion."
 trait_WJ_mr_jiangjun_pingxi_desc:0 "The title 'Subdues the West' aims to sweep the western marches clean. Leading troops under it, this character should fight across Guanzhong and Longyou and stamp out the Qiang uprisings."
 trait_WJ_mr_jiangjun_qian_desc:0 "The four Generals of the Front, Rear, Left and Right are all senior titles. The General of the Front leads the whole army into battle; this character should charge the enemy lines at the head of their troops."
 trait_WJ_mr_jiangjun_qingche_desc:0 "This title is named for the command of chariots and light troops. This character excels at swift charges and moves troops rapidly."
 trait_WJ_mr_jiangjun_saoni_desc:0 "The title 'Sweeps Away Rebels' means to clear away traitors and disorder. This character's charge is to hunt down rebels alone, and the disloyal tremble at their name."
 trait_WJ_mr_jiangjun_tunqi_desc:0 "The title 'Garrison Cavalry' means to command stationed horsemen. Under this title, this character leads a cavalry force of their own, ranging far afield."
 trait_WJ_mr_jiangjun_weibei_desc:0 "This title overawes the northern frontier with military might. Wherever this character's great banner turns, the tribes beyond the passes should bow at the sight of its dust."
 trait_WJ_mr_jiangjun_weidong_desc:0 "This title overawes the east with military might. Bearing this illustrious name, this character makes the eastern warlords think thrice before daring to stir."
 trait_WJ_mr_jiangjun_weinan_desc:0 "This title overawes the southern lands with military might. When this character comes to the river under it, the barbarian chiefs must reckon with their blades."
 trait_WJ_mr_jiangjun_weishuo_desc:0 "The title 'Guards the Northern Marches' means to protect Shuofang. Bearing this weighty title, this character should garrison the north for long years, weathered by wind and frost yet unshaken in resolve."
 trait_WJ_mr_jiangjun_weixi_desc:0 "This title overawes the western marches with military might. Once this character's name is heard, the Qiang and Hu beyond the Long slopes know the court has able men."
 trait_WJ_mr_jiangjun_wuwei_desc:0 "The Martial Guard commands the personal troops who stand watch within the palace. This character leads the household guard, protecting the sovereign's side day and night; none but trusted confidants may hold this post."
 trait_WJ_mr_jiangjun_wuyi_desc:0 "The title 'Martial Resolve' means to be firm and decisive. This character spurs themselves on by this title and should be resolute and fearless in battle."
 trait_WJ_mr_jiangjun_xiaoqi_desc:0 "The title 'Valiant Cavalry' speaks of the courage of horsemen. Astride their steed with halberd swinging, this character should charge the enemy line as if no one stood in the way."
 trait_WJ_mr_jiangjun_xuanfeng_desc:0 "The title 'Spreads Civility' means to promote moral transformation. This character should be versed in both letters and arms, advancing military might and civilizing teaching together."
 trait_WJ_mr_jiangjun_xuanrui_desc:0 "The title 'Proclaims Vigor' means to spread a keen spirit. This character excels at inspiring soldiers; when they raise the war cry, all three armies are roused."
 trait_WJ_mr_jiangjun_yangwu_desc:0 "The title 'Displays Valor' means to make martial might shine. This character is full of high spirits and often dreams of winning fame by defeating the enemy."
 trait_WJ_mr_jiangjun_yaowu_desc:0 "The title 'Flaunts Valor' means to show off martial might. This character loves to array troops in formation and cow the enemy with a magnificent host."
 trait_WJ_mr_jiangjun_yijun_desc:0 "The title 'Assists the Army' means to guard the main host. This character often protects the commander's side and can be trusted for loyal diligence."
 trait_WJ_mr_jiangjun_yingyang_desc:0 "The title 'Soaring Hawk' takes the bearing of a hawk in flight. This character has a keen eye and should strike like a hawk swooping on a hare."
 trait_WJ_mr_jiangjun_you_desc:0 "One of the four Generals of the Front, Rear, Left and Right. The General of the Right shields the right flank of the central army; this character should work in concert with the left wing to protect the center."
 trait_WJ_mr_jiangjun_youji_desc:0 "This title is named for leading mobile troops that move to support wherever needed. Bound to no single place, this character watches for gaps in the enemy and strikes with surprise forces."
 trait_WJ_mr_jiangjun_yulin_desc:0 "The name 'Feathered Forest' means to be the wings of the state, as numerous as a forest. Leading troops under this title, this character's host rivals the imperial guard in splendor."
 trait_WJ_mr_jiangjun_zhechong_desc:0 "The title 'Breaks Charges' means to break the enemy's onslaught. This character excels at crushing strongpoints and elite troops, blunting the enemy's edge."
 trait_WJ_mr_jiangjun_zhenbei_desc:0 "'Guards the North' is one of the Four Guardians, charged with holding a region. Bearing this title, this character must hold the frontier passes of You and Bing so the beacon fires never flare."
 trait_WJ_mr_jiangjun_zhendong_desc:0 "'Guards the East' is one of the Four Guardians, charged with holding a region. Bearing this title, this character must garrison the Huai and Si and hold Hai-Dai, keeping the eastern lands as peaceful as ever."
 trait_WJ_mr_jiangjun_zhengbei_desc:0 "'Conquers the North' ranks among the Four Conquerors, charged with campaigns on the northern frontier, a great regional responsibility. Bearing this weighty title, this character should control You and Bing so the Hu dare not come south to graze their horses."
 trait_WJ_mr_jiangjun_zhengdong_desc:0 "'Conquers the East' ranks among the Four Conquerors, charged with campaigns in the east, a great regional responsibility. Bearing this weighty title, this character should march east and bring Qing, Xu and Hai-Dai wholly under command."
 trait_WJ_mr_jiangjun_zhengnan_desc:0 "'Conquers the South' ranks among the Four Conquerors, charged with campaigns in the south, a great regional responsibility. Bearing this weighty title, this character should sail the Jiang and Han, so that Jing, Yang and the Hundred Yue dare not defy orders."
 trait_WJ_mr_jiangjun_zhenguo_desc:0 "The title 'Guards the State' means to defend the nation. Bearing it, this character carries the safety of the realm on their shoulders, with prestige enough to hold a whole region in awe."
 trait_WJ_mr_jiangjun_zhengxi_desc:0 "'Conquers the West' ranks among the Four Conquerors, charged with campaigns in the western marches, a great regional responsibility. Bearing this weighty title, this character should march west through Guanzhong and Longyou, so that the Qiang and Di fear their very name."
 trait_WJ_mr_jiangjun_zhenjun_desc:0 "The title 'Steadies the Army' means to keep the six armies in order. Holding this weighty title, this character should be steady and composed, a pillar for all the armies."
 trait_WJ_mr_jiangjun_zhennan_desc:0 "'Guards the South' is one of the Four Guardians, charged with holding a region. Bearing this title, this character must hold the barriers of the Jiang and Han and shield Jing and Yang for the court."
 trait_WJ_mr_jiangjun_zhenwei_desc:0 "The title 'Exalts Might' means to raise the army's prowess. Whenever this character arrives among the troops, morale should be renewed."
 trait_WJ_mr_jiangjun_zhenwu_desc:0 "The title 'Exalts Valor' means to revive martial affairs. This character takes the drilling of troops as their duty, and their command is strict and clear."
 trait_WJ_mr_jiangjun_zhenxi_desc:0 "'Guards the West' is one of the Four Guardians, charged with holding a region. Bearing this title, this character must hold the vital passes of Guanzhong and Longyou, so the Qiang of Hexi dare not cast covetous eyes."
 trait_WJ_mr_jiangjun_zuo_desc:0 "One of the four Generals of the Front, Rear, Left and Right. The General of the Left shields the left flank of the central army; this character should be the commander's right hand, supporting them in advance and retreat."
 trait_WJ_mr_xiaowei_anbei_desc:0 "A colonel titled 'Pacifies the North'. This character leads a battalion guarding the northern frontier, watching the beacon towers day and night."
 trait_WJ_mr_xiaowei_anding_desc:0 "A colonel titled 'Pacifies the East'. This character leads a battalion protecting the villages of the east against bandits."
 trait_WJ_mr_xiaowei_andingyi_desc:0 "The title 'Settles the Yi' means to put down barbarian unrest. This character leads a battalion stationed on the outer frontier, keeping the tribes in check."
 trait_WJ_mr_xiaowei_annan_desc:0 "A colonel titled 'Pacifies the South'. This character leads a battalion stationed in the south, guarding against Shanyue raids."
 trait_WJ_mr_xiaowei_anxi_desc:0 "A colonel titled 'Pacifies the West'. This character leads a battalion guarding the western marches and protecting passing merchants."
 trait_WJ_mr_xiaowei_bingbu_desc:0 "The Colonel of Infantry is one of the Five Colonels of the Northern Army, in charge of the troops stationed at the gates of the Shanglin Park. This character drills foot soldiers well, and their ranks are neat."
 trait_WJ_mr_xiaowei_bingwei_desc:0 "The Colonel of the Guards commands guard troops. This character leads a battalion of guardsmen protecting the gates of government offices."
 trait_WJ_mr_xiaowei_canjun_desc:0 "The Colonel of Military Counsel advises on military affairs. This character is often in the commander's tent offering plans."
 trait_WJ_mr_xiaowei_ceying_desc:0 "The Colonel of Support is charged with backing up the other units. This character rushes to and fro bringing relief, filling gaps in the line."
 trait_WJ_mr_xiaowei_chengmen_desc:0 "The Colonel of the City Gates commands the troops at the capital's gates, a post of considerable standing. This character controls the opening and closing of the gates, and the capital's safety rests on them."
 trait_WJ_mr_xiaowei_chengwei_desc:0 "The Colonel of the City Guard is charged with defending the city. This character leads a battalion on the walls, sounding the watchman's clapper night after night."
 trait_WJ_mr_xiaowei_chijie_desc:0 "The Colonel Bearing the Tally travels as an envoy holding the imperial tally. This character carries the tally to every corner, conveying the court's commands."
 trait_WJ_mr_xiaowei_dangkou_desc:0 "A colonel titled 'Sweeps Away Bandits'. This character roams the countryside hunting down brigands."
 trait_WJ_mr_xiaowei_dianhou_desc:0 "The Colonel of the Rearguard covers the army's rear. Calm and steadfast, this character alone holds off pursuers when the army withdraws."
 trait_WJ_mr_xiaowei_dianjun_desc:0 "The Colonel Who Directs the Army is one of the Eight Colonels of the Western Garden, in charge of the imperial troops. This character runs a strict army with orderly commands."
 trait_WJ_mr_xiaowei_dianjunqi_desc:0 "The Colonel of Arms and Armor oversees a battalion's weapons and equipment. This character is often in the armory counting blades and armor and repairing what is damaged."
 trait_WJ_mr_xiaowei_dianma_desc:0 "The Colonel of Horses oversees the rearing of army horses. This character often sleeps beside the stables, keeping an eye on the horses' condition."
 trait_WJ_mr_xiaowei_diannong_desc:0 "The Colonel of Agriculture manages the military farms within a commandery. This character works in the fields in person, urging the farming colonists to clear and till the land."
 trait_WJ_mr_xiaowei_dingbei_desc:0 "The title 'Settles the North' means to subdue the northern frontier. This character leads a battalion of light cavalry pursuing Hu raiders who violate the border."
 trait_WJ_mr_xiaowei_dingdong_desc:0 "The title 'Settles the East' means to subdue the eastern lands. This character leads a battalion clearing out coastal pirates."
 trait_WJ_mr_xiaowei_dingnan_desc:0 "The title 'Settles the South' means to subdue the south. This character leads a battalion over mountains and ridges, hunting down rebellious Man tribes."
 trait_WJ_mr_xiaowei_dingnan_variant_2_desc:0 "A colonel titled 'Quells Calamity'. This character rushes between troubled lands, rescuing the desperate and resolving crises."
 trait_WJ_mr_xiaowei_dingxi_desc:0 "The title 'Settles the West' means to subdue the western marches. This character leads a battalion to the relief of Longshang, contending with Qiang horsemen."
 trait_WJ_mr_xiaowei_fenwu_desc:0 "A colonel titled 'Roused Valor'. Newly given command of a battalion, this character is eager to prove themselves through battlefield merit."
 trait_WJ_mr_xiaowei_fubei_desc:0 "The title 'Soothes the North' means to conciliate the northern frontier. This character deals with the Hu tribes beyond the passes, explaining where their interests lie."
 trait_WJ_mr_xiaowei_fudong_desc:0 "The title 'Soothes the East' means to conciliate the eastern lands. This character leads a battalion stationed among the villages and is on good terms with the elders."
 trait_WJ_mr_xiaowei_fuguo_desc:0 "The title 'Supports the State' means to assist the nation. This character serves the crown loyally and diligently and is gradually coming to the notice of superiors."
 trait_WJ_mr_xiaowei_funan_desc:0 "The title 'Soothes the South' means to conciliate the south. This character is learning the Yue tongue and is gradually building ties with the mountain tribes."
 trait_WJ_mr_xiaowei_furong_desc:0 "The title 'Soothes the Rong' means to pacify the western Rong. This character wins over the Qiang and Hu through kindness and trust."
 trait_WJ_mr_xiaowei_fuxi_desc:0 "The title 'Soothes the West' means to conciliate the western marches. This character travels among the tents of the tribes, mediating disputes over pasture."
 trait_WJ_mr_xiaowei_fuyu_desc:0 "The Colonel Who Attends the Carriage helps steady the imperial carriage and guards the procession. This character is often at the sovereign's side, careful and cautious."
 trait_WJ_mr_xiaowei_fuyuan_desc:0 "The title 'Soothes the Distant Lands' means to pacify faraway regions. This character leads a battalion in a frontier commandery, receiving Hu merchants and envoys from afar."
 trait_WJ_mr_xiaowei_guanjun_desc:0 "A colonel titled 'Champion'. Young, brave and keen, this character is set on making a name."
 trait_WJ_mr_xiaowei_guanwei_desc:0 "The Colonel of the Pass Guard leads a battalion holding a pass. Day and night this character checks travel permits, letting no villain in or out."
 trait_WJ_mr_xiaowei_huaiyuan_desc:0 "The title 'Embraces the Distant' means to conciliate faraway peoples. This character guards the outer frontier and welcomes distant tribes with courtesy."
 trait_WJ_mr_xiaowei_huben_desc:0 "The Colonel of the Rapid Tigers leads a battalion of Tiger Rusher braves. Fierce as a tiger, this character rushes about guarding the sovereign's side."
 trait_WJ_mr_xiaowei_hudi_desc:0 "The Colonel Protector of the Di oversees the northern Di tribes. Stationed on the frontier, this character often mediates disputes among the tribes."
 trait_WJ_mr_xiaowei_hujie_desc:0 "The Colonel of the Tiger Tally holds the tiger tally as warrant and oversees the mobilization of troops. This character guards the tally carefully and dares not act rashly."
 trait_WJ_mr_xiaowei_hujun_desc:0 "The Colonel Protector of the Army supervises a battalion. This character inspects military discipline and reports those who break orders."
 trait_WJ_mr_xiaowei_human_desc:0 "The Colonel Protector of the Man oversees the southern Man tribes. This character leads a battalion stationed at the edge of Man country, watching which way they lean."
 trait_WJ_mr_xiaowei_huqi_desc:0 "The Colonel of Hu Cavalry leads a battalion of Hu horsemen who have submitted to the realm. This character eats and sleeps alongside the Hu soldiers and has won their hearts."
 trait_WJ_mr_xiaowei_huqiang_desc:0 "The Colonel Protector of the Qiang oversees the western Qiang, long a vital post in Liang Province. Stationed in Huangzhong, this character must attend to all Qiang affairs, great and small."
 trait_WJ_mr_xiaowei_hurong_desc:0 "The Colonel Protector of the Rong oversees the western Rong. This character travels throughout Longyou, keeping the tribes on a loose rein."
 trait_WJ_mr_xiaowei_huwu_desc:0 "The Colonel Protector of the Wuhuan oversees the Wuhuan beyond the frontier of You Province, presiding over border markets and mediating among the tribes. This character should know the ways of the Hu and act with sound judgment."
 trait_WJ_mr_xiaowei_huxiongnu_desc:0 "The Colonel Protector of the Xiongnu oversees the Xiongnu tribes that have submitted to the realm. This character leads a battalion encamped near the tribes, guarding against revolt."
 trait_WJ_mr_xiaowei_huyi_desc:0 "The Colonel Protector of the Yi oversees the southwestern Yi. This character often carries the court's gifts into Yi lands to make friends with the tribal chiefs."
 trait_WJ_mr_xiaowei_jianjun_desc:0 "The Colonel Supervising the Army is commissioned to oversee an army. This character marches with the troops and must report all that they see and hear."
 trait_WJ_mr_xiaowei_jianning_desc:0 "The title 'Jianning' means to establish peace. This character guards Nanzhong, defending the borders and securing the people."
 trait_WJ_mr_xiaowei_jianwei_desc:0 "A colonel titled 'Establishes Might'. This character drills troops diligently and longs to win merit."
 trait_WJ_mr_xiaowei_jianzhong_desc:0 "A colonel titled 'Establishes Loyalty'. This character serves superiors respectfully and has never wavered in loyalty."
 trait_WJ_mr_xiaowei_jieying_desc:0 "The Colonel of Reinforcement is charged with supporting the vanguard. This character often lies in wait at the rear to rescue retreating forces."
 trait_WJ_mr_xiaowei_jingbei_desc:0 "The title 'Secures the North' means to clear the northern frontier. This character leads a battalion along the passes, capturing and slaying roving horsemen."
 trait_WJ_mr_xiaowei_jingbian_desc:0 "The title 'Secures the Frontier' means to bring peace to the borderlands. This character leads a battalion at the frontier posts and knows the mountains, rivers and roads well."
 trait_WJ_mr_xiaowei_jingdong_desc:0 "The title 'Secures the East' means to clear the eastern lands. This character leads a battalion guarding the post roads and protecting travelers."
 trait_WJ_mr_xiaowei_jinglue_desc:0 "A colonel titled 'Strategic Command'. Skilled at planning, this character often offers counsel to superiors."
 trait_WJ_mr_xiaowei_jingman_desc:0 "The title 'Secures the Man' means to quell Man unrest. This character often leads a battalion deep into the valley settlements, using both force and amnesty."
 trait_WJ_mr_xiaowei_jingnan_desc:0 "The title 'Secures the South' means to clear the southern lands. This character leads a battalion patrolling the ferries and catching bandits."
 trait_WJ_mr_xiaowei_jingnan_variant_2_desc:0 "A colonel titled 'Quells Disorder'. This character leads a battalion ready to be called to the rescue at any moment."
 trait_WJ_mr_xiaowei_jingxi_desc:0 "The title 'Secures the West' means to clear the western marches. This character leads a battalion escorting envoys and grain convoys."
 trait_WJ_mr_xiaowei_liadong_desc:0 "The Colonel of Liaodong is named for guarding Liaodong. Stationed on the shores of the Liao sea, this character guards against Goguryeo and the Xianbei."
 trait_WJ_mr_xiaowei_lide_desc:0 "The title 'Upholds Virtue' means to establish virtuous conduct. Upright in character, this character leads by example."
 trait_WJ_mr_xiaowei_longxiang_desc:0 "A colonel titled 'Soaring Dragon'. Young and spirited, this character harbors lofty ambitions."
 trait_WJ_mr_xiaowei_nuqi_desc:0 "The Colonel of Crossbow Cavalry leads crossbowmen and horsemen. This character is skilled at mounted archery and excels at fighting from range."
 trait_WJ_mr_xiaowei_pingbei_desc:0 "The title 'Subdues the North' means to pacify the northern frontier. This character leads a battalion at the passes, ready at any moment to meet Hu horsemen."
 trait_WJ_mr_xiaowei_pingdong_desc:0 "The title 'Subdues the East' means to pacify the east. This character leads a battalion fighting across Qing and Xu, putting down small bands of rebels."
 trait_WJ_mr_xiaowei_pinghu_desc:0 "The title 'Subdues the Hu' means to put down Hu unrest. Familiar with Hu cavalry tactics, this character can hold them off with infantry in formation."
 trait_WJ_mr_xiaowei_pingnan_desc:0 "The title 'Subdues the South' means to pacify the south. This character leads a battalion south, storming mountain strongholds."
 trait_WJ_mr_xiaowei_pingxi_desc:0 "The title 'Subdues the West' means to pacify the west. This character leads a battalion to relieve frontier commanderies and strike rebel Qiang."
 trait_WJ_mr_xiaowei_polu_desc:0 "The title 'Smashes the Caitiffs' means to crush the enemy. Brave and skilled in war, this character often dreams of slaying generals and seizing banners."
 trait_WJ_mr_xiaowei_saoni_desc:0 "A colonel titled 'Sweeps Away Rebels'. This character leads a battalion hunting down rebels, undaunted by hardship."
 trait_WJ_mr_xiaowei_shesheng_desc:0 "The Colonel of Archers Who Shoot at Sound is one of the Five Colonels of the Northern Army, leading the sound-shooting archers. A superb archer, this character often competes with the soldiers at the butts."
 trait_WJ_mr_xiaowei_shuijun_desc:0 "The Colonel of the Navy leads a battalion of boats and marines. At home on the water, this character handles oar and helm with skill."
 trait_WJ_mr_xiaowei_sima_desc:0 "The Sima Colonel manages the deployment of troops and horses in camp. This character counts soldiers and assigns companies, a heavy load of duties."
 trait_WJ_mr_xiaowei_taolu_desc:0 "The title 'Attacks the Caitiffs' means to punish the enemy. Young and eager to advance, this character longs to win fame in a single battle."
 trait_WJ_mr_xiaowei_taoni_desc:0 "The title 'Attacks the Rebels' means to chastise traitors. This character leads a battalion on campaign and repeatedly asks to serve as vanguard."
 trait_WJ_mr_xiaowei_tianlu_desc:0 "The title 'Exterminates the Caitiffs' means to annihilate the enemy. This character fights ferociously and gives no quarter."
 trait_WJ_mr_xiaowei_tiaobeilu_desc:0 "The Colonel Who Levies the North raises troops and horses in the north. This character travels among the frontier commanderies, conscripting soldiers and moving provisions."
 trait_WJ_mr_xiaowei_tiaoman_desc:0 "The Colonel Who Levies the Man dispatches southern Man troops. Fluent in the Man tongue, this character can make Man soldiers serve the court."
 trait_WJ_mr_xiaowei_tiaonan_desc:0 "The Colonel Who Levies the South raises troops and horses in the south. This character hurries among the commanderies, conscripting soldiers and transporting supplies."
 trait_WJ_mr_xiaowei_tunqi_desc:0 "The Colonel of Garrison Cavalry is one of the Five Colonels of the Northern Army, leading horsemen stationed to guard the capital. This character handles cavalry well, and the ranks are in good order."
 trait_WJ_mr_xiaowei_weibei_desc:0 "The title 'Overawes the North' means to strike awe into the northern frontier. Brave and bold, this character hopes the Hu horsemen will dread their very name."
 trait_WJ_mr_xiaowei_weidong_desc:0 "The title 'Overawes the East' means to strike awe into the east. Running a stern camp, this character hopes to make the region's bandits vanish."
 trait_WJ_mr_xiaowei_weinan_desc:0 "The title 'Overawes the South' means to strike awe into the south. Proud of their ferocity, this character hopes to make a name in Jiangnan."
 trait_WJ_mr_xiaowei_weishuo_desc:0 "The title 'Guards the Northern Marches' means to protect Shuofang. This character leads a battalion stationed in Shuofang and never stops patrolling, even in winter."
 trait_WJ_mr_xiaowei_weixi_desc:0 "The title 'Overawes the West' means to strike awe into the western marches. Riding across Longyou, this character hopes the Qiang will flee at the sight of their banners."
 trait_WJ_mr_xiaowei_wuling_desc:0 "The Colonel of Wuling is named for guarding the Wuling mountains. Familiar with the Five Creeks Man, this character uses both force and conciliation."
 trait_WJ_mr_xiaowei_wuwei_desc:0 "A colonel titled 'Martial Guard', in charge of the personal guard. This character leads a battalion of guards on night watch, never taking off their armor."
 trait_WJ_mr_xiaowei_wuyi_desc:0 "A colonel titled 'Martial Resolve'. Of firm and unyielding temper, this character would rather break than bend."
 trait_WJ_mr_xiaowei_xianfeng_desc:0 "The Colonel of the Vanguard leads a battalion at the front. In every battle this character is first up the walls, the bravest in the army."
 trait_WJ_mr_xiaowei_xiongjie_desc:0 "The title 'Bear Valor' takes the courage of bears. This character is powerfully built and of extraordinary strength."
 trait_WJ_mr_xiaowei_xiping_desc:0 "The title 'Xiping' means to pacify the west. This character is stationed between the Yellow and Huang rivers, guarding against Qiang unrest."
 trait_WJ_mr_xiaowei_xuanfeng_desc:0 "A colonel titled 'Spreads Civility'. Learned and courteous, this character also teaches propriety and righteousness alongside running the camp."
 trait_WJ_mr_xiaowei_xuanrui_desc:0 "A colonel titled 'Proclaims Vigor'. Young and hot-blooded, this character often rouses subordinates with bold words."
 trait_WJ_mr_xiaowei_xuanwei_desc:0 "A colonel titled 'Proclaims Might'. This character delights in a smart, disciplined host with bright banners."
 trait_WJ_mr_xiaowei_xuanyi_desc:0 "A colonel titled 'Proclaims Righteousness'. This character rallies followers with loyalty and righteousness."
 trait_WJ_mr_xiaowei_xunwei_desc:0 "The Colonel of the Patrol Guard is charged with patrols and policing. This character leads a battalion through the streets, arresting wrongdoers."
 trait_WJ_mr_xiaowei_yangwu_desc:0 "A colonel titled 'Displays Valor'. Brave and competitive, this character always takes first place in drills."
 trait_WJ_mr_xiaowei_yaowei_desc:0 "A colonel titled 'Flaunts Might'. Whenever this character rides out on patrol, it is in fine clothes on a spirited horse, to swell the battalion's prestige."
 trait_WJ_mr_xiaowei_yaowu_desc:0 "A colonel titled 'Flaunts Valor'. This character takes great care of armor and weapons, and the battalion looks quite splendid."
 trait_WJ_mr_xiaowei_yifeng_desc:0 "A colonel titled 'Assists the Army'. This character leads a battalion attending the central army, awaiting orders."
 trait_WJ_mr_xiaowei_yingyang_desc:0 "A colonel titled 'Soaring Hawk'. Sharp-eyed and quick-handed, this character excels at seizing fleeting opportunities in battle."
 trait_WJ_mr_xiaowei_yongchang_desc:0 "The Colonel of Yongchang is named for guarding the frontier commandery of Yongchang. Far away on the southwestern edge of the realm, this character lives among the Ailao and other Yi peoples."
 trait_WJ_mr_xiaowei_yueqi_desc:0 "The Colonel of Elite Cavalry is one of the Five Colonels of the Northern Army, leading the elite horsemen. This character often personally selects brave men to fill the ranks."
 trait_WJ_mr_xiaowei_yulin_desc:0 "The Colonel of the Feathered Forest leads a battalion of Feathered Forest cavalry. Raised in the imperial guard, this character learned bow and horse from youth."
 trait_WJ_mr_xiaowei_yuqi_desc:0 "The Colonel of Carriage Cavalry commands the horsemen who guard the imperial carriage. This character accompanies the sovereign's processions with stately ceremony."
 trait_WJ_mr_xiaowei_zhangshi_desc:0 "The Chief Clerk Colonel handles the camp's documents. Skilled with registers and records, this character relieves the commander of many burdens."
 trait_WJ_mr_xiaowei_zhangshui_desc:0 "The Colonel of the Chang River is one of the Five Colonels of the Northern Army, leading the Hu cavalry of the Chang River. Moving through the camp, this character commands Hu and Han soldiers alike, putting each to good use."
 trait_WJ_mr_xiaowei_zhaowu_desc:0 "A colonel titled 'Manifest Valor'. Rising through accumulated merit, this character's reputation is growing."
 trait_WJ_mr_xiaowei_zhechong_desc:0 "A colonel titled 'Breaks Charges'. Calm in battle, this character keeps the battalion steady as a rock."
 trait_WJ_mr_xiaowei_zhengdi_desc:0 "The Colonel Who Conquers the Di is charged with campaigns against the northern Di. This character leads light cavalry beyond the frontier, chasing the fleeing foe northward."
 trait_WJ_mr_xiaowei_zhenglu_desc:0 "The Colonel Who Conquers the Caitiffs is charged with campaigns against the Hu. This character charges bravely and fears no strong foe."
 trait_WJ_mr_xiaowei_zhengman_desc:0 "The Colonel Who Conquers the Man is charged with campaigns against the southern Man. This character leads a battalion of mountain troops accustomed to forest warfare."
 trait_WJ_mr_xiaowei_zhengrong_desc:0 "The Colonel Who Conquers the Rong is charged with campaigns against the western Rong. This character leads a battalion of horse and foot, often joining the great army's western campaigns."
 trait_WJ_mr_xiaowei_zhenguo_desc:0 "The title 'Guards the State' means to defend the nation. Though of low rank, this character still keeps the protection of the realm in mind."
 trait_WJ_mr_xiaowei_zhengyi_desc:0 "The Colonel Who Conquers the Yi is charged with campaigns against the eastern Yi. Familiar with the mountain and sea routes of the east, this character often guides the great army."
 trait_WJ_mr_xiaowei_zhenshuo_desc:0 "The title 'Guards the Northern Frontier' means to hold Shuofang. This character leads a battalion stationed at the passes, making steadfast defense their foundation."
 trait_WJ_mr_xiaowei_zhenwei_desc:0 "A colonel titled 'Exalts Might'. This character can restore the morale of weary troops."
 trait_WJ_mr_xiaowei_zhenwu_desc:0 "A colonel titled 'Exalts Valor'. Newly in command of a battalion, this character personally drills the soldiers in thrust and strike every day."
 trait_WJ_mr_xiaowei_zhonglei_desc:0 "The Colonel of the Central Camp oversees the ramparts of the Northern Army. This character inspects the gate watch day and night, and all who enter or leave must be checked."
 trait_WJ_mr_zhonglang_anbei_desc:0 "A General of the Household entrusted with pacifying the northern frontier. This character leads a detachment stationed at the passes and should make repairing the watchtowers and ramparts their task."
 trait_WJ_mr_zhonglang_anding_desc:0 "A General of the Household entrusted with pacifying the eastern lands. This character leads a detachment on the coast and should make defending the borders and securing the people their task."
 trait_WJ_mr_zhonglang_annan_desc:0 "A General of the Household entrusted with pacifying the south. This character leads a detachment on the river and should make securing the riverside commanderies and counties their task."
 trait_WJ_mr_zhonglang_anxi_desc:0 "A General of the Household entrusted with pacifying the western marches. This character leads a detachment stationed in Hexi and should make settling the commanderies their task."
 trait_WJ_mr_zhonglang_anyi_desc:0 "The title 'Pacifies the Yi' means to soothe the barbarians. Often dealing with frontier peoples, this character should master the art of the loose rein."
 trait_WJ_mr_zhonglang_bei_desc:0 "One of the four Generals of the Household of the cardinal directions, commissioned to campaign in the north. Though ranked below a general, this character should still hold a front alone and lead troops against rebels."
 trait_WJ_mr_zhonglang_bingwei_desc:0 "The General of the Household of the Guards commands guard troops. This character's detachment should be well drilled and orderly, protecting the peace of the region."
 trait_WJ_mr_zhonglang_caiguan_desc:0 "The General of the Household of Skilled Soldiers leads a detachment of skilled strongmen. Of extraordinary strength, this character can draw a powerful crossbow."
 trait_WJ_mr_zhonglang_changshui_desc:0 "The name 'Chang River' derives from the Hu cavalry of the Chang River. This character leads a detachment of elite horsemen whose mounted archery should be the finest in the army."
 trait_WJ_mr_zhonglang_chengmen_desc:0 "The General of the Household of the City Gates commands the troops at the city gates. This character patrols the gates day and night, questioning all who pass, never slackening."
 trait_WJ_mr_zhonglang_chengwei_desc:0 "The General of the Household of the City Guard is charged with defending the city. This character should repair the defenses and drill the garrison until the walls are impregnable."
 trait_WJ_mr_zhonglang_chijie_desc:0 "The General of the Household Bearing the Tally travels with the imperial tally, proclaiming the court's authority. Wherever this character's banner goes, provinces and commanderies must receive it with honor."
 trait_WJ_mr_zhonglang_dianjun_desc:0 "The General of the Household Who Directs the Army oversees military affairs. This character manages the detachment's rolls and companies and should know every matter, great and small."
 trait_WJ_mr_zhonglang_dianjunqi_desc:0 "The General of the Household of Arms and Armor oversees weapons and equipment. This character supervises the making of blades, armor, bows and crossbows, ensuring the army's arms are sharp and sound."
 trait_WJ_mr_zhonglang_dianma_desc:0 "The General of the Household of Horses oversees the rearing and allocation of army horses. This character should be a good judge of horses and keep the stud in good order."
 trait_WJ_mr_zhonglang_diannong_desc:0 "The General of the Household of Agriculture oversees military farms and grain stores. This character leads the farming colonists to till and fight alike, laying up provisions for the great army."
 trait_WJ_mr_zhonglang_dingyuan_desc:0 "The title 'Settles the Distant Lands' calls to mind how Ban Chao threw down his brush to join the army and won glory in far-off lands. This character too should cherish ambitions spanning ten thousand li."
 trait_WJ_mr_zhonglang_dong_desc:0 "The four Generals of the Household of the East, South, West and North are each commissioned to campaign in one direction. Though the Eastern General of the Household ranks below a general, this character may lead an army alone and fight across Qing and Xu."
 trait_WJ_mr_zhonglang_fengche_desc:0 "The General of the Household of the Imperial Carriage manages the sovereign's carriage. This character attends the sovereign at all times; none but trusted intimates may hold this post."
 trait_WJ_mr_zhonglang_fenwei_desc:0 "A General of the Household titled 'Roused Might'. Leading a detachment of keen soldiers, this character should press forward boldly and never flinch before the enemy."
 trait_WJ_mr_zhonglang_fenwu_desc:0 "A General of the Household titled 'Roused Valor'. Leading a detachment of daring fighters, this character often volunteers for battle."
 trait_WJ_mr_zhonglang_fubei_desc:0 "A General of the Household charged with conciliating the northern frontier. This character often receives and sees off Hu envoys at the passes, treating them with courtesy."
 trait_WJ_mr_zhonglang_fubo_desc:0 "The General of the Household Who Calms the Waves leads a detachment of boats. Ranging over rivers and streams, this character hopes to live up to the name and still the wind and waves."
 trait_WJ_mr_zhonglang_fudong_desc:0 "A General of the Household charged with conciliating the eastern lands. This character encourages farming and sericulture and calls scattered refugees home."
 trait_WJ_mr_zhonglang_fujun_desc:0 "The title 'Comforts the Army' means to care for the soldiers. This character looks after the troops, and the soldiers should be glad to serve."
 trait_WJ_mr_zhonglang_funan_desc:0 "A General of the Household charged with conciliating the southern lands. This character often sends envoys into the mountains bearing salt and cloth, to win over the Man and Yi."
 trait_WJ_mr_zhonglang_fuxi_desc:0 "A General of the Household charged with conciliating the western marches. This character often holds covenants and feasts with Qiang and Di chieftains, binding them with favor."
 trait_WJ_mr_zhonglang_guanjun_desc:0 "A General of the Household titled 'Champion'. Of outstanding martial skill, this character often hopes to win fame in a single battle."
 trait_WJ_mr_zhonglang_guanwei_desc:0 "The General of the Household of the Pass Guard is charged with defending passes. Holding a vital crossing and inspecting all comers, this character should have the air of one man holding the pass against ten thousand."
 trait_WJ_mr_zhonglang_huaihua_desc:0 "The title 'Embraces the Converts' means to welcome those who submit. Often dealing with frontier peoples who have come over, this character should win their hearts through kindness."
 trait_WJ_mr_zhonglang_huben_desc:0 "'Tiger Rushers' are braves who charge like fierce tigers. This character leads the Tiger Rusher guard at the sovereign's side and should be known for loyalty and courage."
 trait_WJ_mr_zhonglang_hujun_desc:0 "The General of the Household Protector of the Army accompanies the army to oversee the generals. This character harmonizes the units' movements and assists with personnel matters."
 trait_WJ_mr_zhonglang_human_desc:0 "The General of the Household Protector of the Man oversees the southern Man. Moving among the valley settlements of southern Jing, this character soothes those who submit and punishes those who rebel."
 trait_WJ_mr_zhonglang_huqi_desc:0 "The General of the Household of Hu Cavalry leads Hu horsemen who have submitted to the realm. Versed in Hu customs, this character should be able to command them with both favor and awe."
 trait_WJ_mr_zhonglang_huqiang_desc:0 "The General of the Household Protector of the Qiang oversees the western Qiang. This character should know the feuds of every Qiang clan and divide and win them over as each case requires."
 trait_WJ_mr_zhonglang_huwei_desc:0 "A General of the Household titled 'Tiger Might'. Fierce and fiery, this character should strike fear into the enemy in battle."
 trait_WJ_mr_zhonglang_huwuhuan_desc:0 "The General of the Household Protector of the Wuhuan oversees the Wuhuan tribes beyond the frontier of You Province. Moving on both sides of the Great Wall, this character keeps the Hu horsemen in check with favor and awe."
 trait_WJ_mr_zhonglang_huxiongnu_desc:0 "The General of the Household Protector of the Xiongnu oversees the Xiongnu tribes that have submitted to the realm. Stationed in Bing Province, this character deals with the Chanyu and watches their every move."
 trait_WJ_mr_zhonglang_huyi_desc:0 "The General of the Household Protector of the Yi oversees the southwestern Yi. Traveling the mountains and rivers of Nanzhong, this character wins over the Yi chiefs through kindness and trust."
 trait_WJ_mr_zhonglang_jianjun_desc:0 "The General of the Household Supervising the Army is commissioned to oversee the armies. This character assesses the generals' merits and faults, serving as the court's eyes and ears."
 trait_WJ_mr_zhonglang_jianwu_desc:0 "A General of the Household titled 'Establishes Valor'. Day and night this character dreams of great deeds that will carry them further."
 trait_WJ_mr_zhonglang_jingbei_desc:0 "A General of the Household entrusted with clearing the northern frontier. This character leads a detachment patrolling the passes and driving off raiders, so the beacons rarely flare."
 trait_WJ_mr_zhonglang_jingdong_desc:0 "A General of the Household entrusted with clearing the eastern lands. This character leads a detachment hunting pirates and mountain bandits to reopen the roads."
 trait_WJ_mr_zhonglang_jingnan_desc:0 "A General of the Household entrusted with clearing the southern lands. This character leads a detachment across rivers and lakes, wiping out river pirates."
 trait_WJ_mr_zhonglang_jingnan_variant_2_desc:0 "A General of the Household titled 'Quells Disorder'. Whenever unrest breaks out, this character speeds to the rescue with their own detachment."
 trait_WJ_mr_zhonglang_jingxi_desc:0 "A General of the Household entrusted with clearing the western marches. This character leads a detachment stationed on the Long slopes, suppressing raiding Qiang and Hu."
 trait_WJ_mr_zhonglang_lingjun_desc:0 "The General of the Household Commanding the Army leads a detachment of imperial troops. This character keeps the ranks in order and runs a strict army."
 trait_WJ_mr_zhonglang_longxiang_desc:0 "A General of the Household titled 'Soaring Dragon'. High-spirited, this character is unwilling to remain beneath others for long."
 trait_WJ_mr_zhonglang_louchuan_desc:0 "The General of the Household of Towered Ships leads a detachment of warships. Long at sea, this character can command calmly even amid wind and waves."
 trait_WJ_mr_zhonglang_nan_desc:0 "One of the four Generals of the Household of the cardinal directions, commissioned to campaign in the south. Leading troops southward, this character should range among rivers, lakes, mountains and marshes, chastising the defiant."
 trait_WJ_mr_zhonglang_pinglu_desc:0 "The title 'Subdues the Caitiffs' means to put down the Hu. Often crossing swords with Hu horsemen, this character knows their strengths and weaknesses well."
 trait_WJ_mr_zhonglang_qingche_desc:0 "The General of the Household of Light Chariots leads a detachment of light chariots and picked troops. Skilled at swift raids, this character often strikes when least expected."
 trait_WJ_mr_zhonglang_shesheng_desc:0 "'Shooting at Sound' means to hit a target by its sound alone. This character leads skilled archers, whose arrows should not miss even in the dark of night."
 trait_WJ_mr_zhonglang_sima_desc:0 "The Sima General of the Household manages rewards, punishments and troop deployment. This character should enforce the law impartially and keep military discipline strict."
 trait_WJ_mr_zhonglang_taoni_desc:0 "The title 'Attacks the Rebels' means to chastise traitors. This character makes the destruction of the disloyal their duty and shows their edge openly."
 trait_WJ_mr_zhonglang_tianjin_desc:0 "The General of the Household of the Fords guards ferries and bridges. Holding the river crossings, this character controls all boat traffic."
 trait_WJ_mr_zhonglang_tunqi_desc:0 "The General of the Household of Garrison Cavalry leads a detachment of stationed horsemen. Skilled in mounted combat, this character advances and withdraws swiftly."
 trait_WJ_mr_zhonglang_wuguan_desc:0 "The General of the Household of the Five Offices leads the Gentlemen of the Five Offices, long a post of pure prestige. Holding it, this character's every move draws the attention of court and country."
 trait_WJ_mr_zhonglang_wuwei_desc:0 "The General of the Household of the Martial Guard leads the personal guard attending the sovereign. Brave, loyal and careful, this character enjoys deep trust."
 trait_WJ_mr_zhonglang_xi_desc:0 "One of the four Generals of the Household of the cardinal directions, commissioned to campaign in the west. Marching westward, this character should contend with the Qiang and Hu in Guanzhong and Longyou."
 trait_WJ_mr_zhonglang_xiaoqi_desc:0 "The General of the Household of Valiant Cavalry leads a detachment of brave horsemen. Skilled with bow and horse, this character charges at the front in every battle."
 trait_WJ_mr_zhonglang_xunwei_desc:0 "The General of the Household of the Patrol Guard is charged with patrols and policing. This character makes rounds everywhere, so petty villains dare not stir up trouble."
 trait_WJ_mr_zhonglang_yangwei_desc:0 "The title 'Displays Might' means to make the army's power known. This character loves to parade troops and show off arms to swell their prestige."
 trait_WJ_mr_zhonglang_yingyang_desc:0 "A General of the Household titled 'Soaring Hawk'. This character often climbs high to study the enemy's formation, waiting for the moment to strike."
 trait_WJ_mr_zhonglang_you_desc:0 "The Generals of the Household of the Right and Left share command of the palace gentlemen guards. This character moves within the palace gates and may also be commissioned to lead troops against rebels."
 trait_WJ_mr_zhonglang_youji_desc:0 "The General of the Household of Mobile Strikes leads mobile troops that move to support wherever needed. Never staying long in one place, this character rides wherever the situation is tight."
 trait_WJ_mr_zhonglang_yueqi_desc:0 "'Elite Cavalry' means horsemen of surpassing talent and strength. Every man in this character's detachment is a brave and skilled rider; charging the enemy line, they should sweep all before them."
 trait_WJ_mr_zhonglang_yulin_desc:0 "The General of the Household of the Feathered Forest leads the Feathered Forest cavalry guarding the palace. This character should be skilled with bow and horse and keep strict command."
 trait_WJ_mr_zhonglang_zhangjun_desc:0 "The General of the Household Who Commands the Army controls a detachment's orders. Running the army well, this character advances and withdraws strictly by the rules."
 trait_WJ_mr_zhonglang_zhangshi_desc:0 "The Chief Clerk General of the Household assists in the affairs of the Military Headquarters. Thorough and capable, this character is relied on by the commander as a right arm."
 trait_WJ_mr_zhonglang_zhechong_desc:0 "A General of the Household titled 'Breaks Charges'. This character leads a detachment arrayed at the front, specializing in stopping enemy charges."
 trait_WJ_mr_zhonglang_zhengdi_desc:0 "The General of the Household Who Conquers the Di is charged with campaigns against the northern Di. This character leads a detachment across the lands beyond the frontier, contending with Hu horsemen."
 trait_WJ_mr_zhonglang_zhengman_desc:0 "The General of the Household Who Conquers the Man is charged with campaigns against the southern Man. This character leads a detachment through malarial lands, putting down unrest in the valley settlements."
 trait_WJ_mr_zhonglang_zhengrong_desc:0 "The General of the Household Who Conquers the Rong is charged with campaigns against the western Rong. This character leads a detachment fighting across the Yellow and Huang rivers, contending with the Qiang and Di."
 trait_WJ_mr_zhonglang_zhengyi_desc:0 "The General of the Household Who Conquers the Yi is charged with campaigns against the eastern Yi. This character leads a detachment across seas and ridges, proclaiming the realm's might in the east."
 trait_WJ_mr_zhonglang_zhenjun_desc:0 "The title 'Steadies the Army' means to keep the troops in order. Holding a detachment, this character remains unshaken in a crisis."
 trait_WJ_mr_zhonglang_zhenshuo_desc:0 "The title 'Guards the Northern Frontier' means to hold Shuofang. Long years guarding the frontier, with wind and sand, have tempered this character into steel."
 trait_WJ_mr_zhonglang_zhenwei_desc:0 "A General of the Household titled 'Exalts Might'. Under this character, the detachment is smart and disciplined, with drums and horns answering one another."
 trait_WJ_mr_zhonglang_zhenwu_desc:0 "A General of the Household titled 'Exalts Valor'. This character drives the ranks very strictly, and drills never cease."
 trait_WJ_mr_zhonglang_zhonglei_desc:0 "The name 'Central Camp' means to guard the army's ramparts. This character should run a tight camp with formidable walls."
 trait_WJ_mr_zhonglang_zuo_desc:0 "The General of the Household of the Left originally commanded the palace gentlemen of the hall, a post of pure distinction. In these troubled times, this character may lead troops on campaign abroad or guard the palace at home."
 trait_WJ_kaoke_malpractice:0 "Corrupt Practices"
 trait_WJ_kaoke_malpractice_desc:0 "This character manipulated the merit evaluations for personal gain, and the deed has come to light. Even if pardoned, the stain will follow them for life."
 trait_WJ_zhongwai:0 "Commander of All Armies Within and Without"
 trait_WJ_zhongwai_desc:0 "By imperial edict this character commands all armies within and without the capital, bearing the yellow battle-axe, leading the Six Armies and enforcing military law. This command came with the regency, and with the regency it will go."
 trait_WJ_mr_jiangjun_anbei:0 "General Who Pacifies the North"
 trait_WJ_mr_jiangjun_andong:0 "General Who Pacifies the East"
 trait_WJ_mr_jiangjun_annan:0 "General Who Pacifies the South"
 trait_WJ_mr_jiangjun_anxi:0 "General Who Pacifies the West"
 trait_WJ_mr_jiangjun_caiguan:0 "General of Skilled Soldiers"
 trait_WJ_mr_jiangjun_dangkou:0 "General Who Sweeps Away Bandits"
 trait_WJ_mr_jiangjun_dingbei:0 "General Who Settles the North"
 trait_WJ_mr_jiangjun_dingdong:0 "General Who Settles the East"
 trait_WJ_mr_jiangjun_dingnan:0 "General Who Settles the South"
 trait_WJ_mr_jiangjun_dingnan_variant_2:0 "General Who Quells Calamity"
