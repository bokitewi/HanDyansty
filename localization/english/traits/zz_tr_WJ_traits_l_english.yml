 trait_track_jungong:0 "Martial Merit"
 trait_track_jungong_desc:0 "Fighting in the ranks, leading armies to victory, putting down disorder: all fame is won by the blade. The greater one's standing in the army, the more willing the brave men under one's banner are to die for it."
 trait_track_qingtan:0 "Pure Criticism"
 trait_track_qingtan_desc:0 "Through debate and pure conversation, judging men's characters and mixing with the literati, one gradually develops a bearing unmoved by the tumult of praise and blame."
 trait_track_zhengji:0 "Governance Record"
 trait_track_zhengji_desc:0 "Evaluations, tours of inspection, public works, famine relief: honed by one matter of state after another, one comes to know registers, human relations and local interests by heart, and one's plans grow ever more thorough."
 trait_track_zili:0 "Official Career"
 trait_track_zili_desc:0 "Long service in office and seasoning at court bring familiarity with court protocol, personnel and the paths to advancement; whether rising or falling, one never lacks support."
 trait_track_WJ_mingshi_trait:0 "Tides of Officialdom"
 trait_track_WJ_mingshi_trait_desc:0 "Pure Criticism, Official Career, Martial Merit and Governance Record: four paths together make a lifetime's career. One versed in all four may become renowned throughout the realm."
 trait_WJ_langguan_trait:0 "Court Gentleman"
 trait_WJ_langguan_trait_desc:0 "Recommended as Filial and Incorrupt, this character entered service as a Court Gentleman, standing guard with halberd in the palace halls while awaiting examination and appointment to office."
 trait_WJ_mingshi_trait:0 "Tides of Officialdom"
 trait_WJ_mingshi_trait_desc:0 "An official career is like the sea: a day of glory does not define a man, nor can a spell of obscurity erase an old reputation. Since entering office by summons or recommendation, this character's pure conversation and judgments of others, long service in office, deeds on the battlefield and governance of the people have all stayed with them; even through dismissal, loss of power or a change of dynasty, the old renown remains, and should fortune smile again, a return to the ranks of the high ministers would be no surprise."
 WJ_yangwang_trait:0 "Recluse"
 WJ_yangwang_trait_desc:0 "This character has resigned office and retired into seclusion, reading behind closed doors, declining all summons, refusing court posts and staying out of military affairs, associating only with old friends of the locality."
