 hd_nbc_luxun_army_name:0 "Celestial Masters' Followers"
 hd_nbc.0100.t:0 "Gravely Ill"
 hd_nbc.0100.desc:0 "Since autumn began, your illness has worsened with each passing day. The imperial physicians dare not raise their eyes as they leave your bedchamber, and your closest attendants have already begun whispering about what comes after.\n\nIn the histories, your life ends here."
 hd_nbc.0100.a:0 "Such is Heaven's will. Let me give my final instructions."
 hd_nbc.0100.b:0 "I cannot die yet! (Hold on for another year.)"
 hd_nbc.0110.t:0 "The Fall of Cheng-Han"
 hd_nbc.0110.desc:0 "Three battles, three victories: your army marches straight to the walls of Chengdu. Li Shi comes to the army gate with his hands bound behind his back and a coffin on a cart, surrendering himself to your judgment. More than forty years after Li Te seized Shu, the land returns to Jin.\n\nThe news of victory reaches Jiankang and shakes the court and the realm. From this day onward, no one can dismiss you."
 hd_nbc.0110.a:0 "Proclaim the victory and send Li Shi to Jiankang."
 hd_nbc.0120.t:0 "Yan Marches South"
 hd_nbc.0120.desc:0 "With Shi Hu dead, the princes of Zhao turn on one another, plunging Hebei into chaos. The garrison commanders of You Province either surrender or flee, leaving Jicheng's gates wide open.\n\nYour generals all agree: the Central Plains have no master. The time has come for Yan to enter the passes."
 hd_nbc.0120.a:0 "Advance in three columns. Take Jicheng first!"
 hd_nbc.0120.b:0 "Hold our position and watch events unfold."
 hd_nbc.0130.t:0 "Ran Min Kills Shi Jian"
 hd_nbc.0130.desc:0 "Less than a year after Shi Hu's death, Ye has already changed masters three times. The new ruler, Shi Jian, wants you dead, yet he cannot even send an assassin beyond the palace gates.\n\nThe people of Zhao throughout the city await a word from you. Strike, and Ye is yours."
 hd_nbc.0130.a:0 "Kill Shi Jian and take the imperial throne of Great Wei!"
 hd_nbc.0130.b:0 "The Shi family raised me, after all."
 hd_nbc.0140.t:0 "West into Guanzhong"
 hd_nbc.0140.desc:0 "Ma Qiu poisoned your father, Fu Hong. With his dying breath, he urged you to march west and take Guanzhong. The Di and Qiang at Fangtou await your command.\n\nRival warlords now contend across Guanzhong. None can stand in your way."
 hd_nbc.0140.a:0 "Burn the bridges, march west, and enter Chang'an!"
 hd_nbc.0140.b:0 "Stay at Fangtou and wait a little longer."
 hd_nbc.0150.t:0 "The Northern Expedition"
 hd_nbc.0150.desc:0 "Nearly forty years have passed since Luoyang fell, and the five imperial mausoleums lie neglected. You petition for a northern expedition, and the court dares not refuse.\n\nYour army leaves Jiangling, marches north through Nanyang, and heads straight for the Yi River."
 hd_nbc.0150.a:0 "March on the Yi and Luo rivers. Recover the old capital!"
 hd_nbc.0150.b:0 "The time has not yet come."
 hd_nbc.0160.t:0 "Whips Enough to Dam the River"
 hd_nbc.0160.desc:0 "The north is pacified; only a corner south of the Yangtze remains. You summon your ministers to discuss plans for an attack on Jin.\n\nOn his deathbed, Wang Meng warned that although Jin held only a corner of the realm, it still carried on the legitimate imperial line and should not be attacked lightly. Yet a million men serve under you. If they threw their whips into the river, they could stop its flow."
 hd_nbc.0160.a:0 "Launch a great campaign to the south!"
 hd_nbc.0160.b:0 "I should heed Wang Jinglüe's words."
 hd_nbc.0161.t:0 "After the Fei River"
 hd_nbc.0161.desc:0 "After the defeat at the Fei River, every gust of wind and cry of a crane sounds like pursuit; every tree and blade of grass seems an enemy soldier. When you flee back north, little more than a thousand horsemen remain at your side.\n\nThe generals of the various peoples had only submitted to you for the time being. Now they see that you can no longer restrain them, and one by one they leave."
 hd_nbc.0161.a:0 "How have I wronged them..."
 hd_nbc.0210.t:0 "Mount Fuzhou"
 hd_nbc.0210.desc:0 "Only days after the uprising at Jingkou, the Beifu Army of Restoration has reached the northern outskirts of Jiankang. On Mount Fuzhou, your great army collapses without a fight, and Liu Yu's banners rise over Mount Jiang.\n\nYin Zhongwen urges you to take the emperor west to Jiangling, where the Huan clan still has its power base."
 hd_nbc.0210.a:0 "Abandon Jiankang and take the emperor west to Jiangling."
 hd_nbc.0210.b:0 "Hold Jiankang to the death!"
 hd_nbc.0220.t:0 "Zhengrong Islet"
 hd_nbc.0220.desc:0 "After Huan Xuan flees west, the commanderies of Jing Province wait to see what happens. Liu Yi and He Wuji lead the fleet upriver and meet Huan Xuan's tower ships at Zhengrong Islet.\n\nWin this battle, and Jin can be restored."
 hd_nbc.0220.a:0 "Attack Huan Xuan and bring the emperor back!"
 hd_nbc.0220.b:0 "Secure Jiangdong first."
 hd_nbc.0230.t:0 "Sailing South"
 hd_nbc.0230.desc:0 "After Sun En's death, his surviving followers chose you as their leader and spent years wandering at sea. Now Jiangdong is in chaos and Guang Province lies poorly defended. Its inspector, Wu Yinzhi, has only a few thousand men.\n\nYour followers urge you to sail south to Panyu and establish a foothold in Lingnan."
 hd_nbc.0230.a:0 "Set sail south and seize Panyu!"
 hd_nbc.0230.b:0 "We are free at sea. Why go ashore?"
 hd_nbc.0240.t:0 "Campaign against Southern Yan"
 hd_nbc.0240.desc:0 "Murong Chao of Southern Yan has repeatedly invaded the lands north of the Huai River and carried off their people. Most at court argue that powerful enemies surround you in the north, making a rash expedition unwise.\n\nBut you see Murong Chao's arrogance and excess. The isolated city of Guanggu can be taken."
 hd_nbc.0240.a:0 "March north against Guanggu!"
 hd_nbc.0240.b:0 "We should not set out lightly."
 hd_nbc.0250.t:0 "Campaign against Later Qin"
 hd_nbc.0250.desc:0 "Yao Xing of Later Qin is dead. His sons fight for the throne, and Guanzhong's people have lost their loyalty. The two old capitals, Luoyang and Chang'an, lie before you.\n\nThe armies and fleets are assembled, awaiting your command."
 hd_nbc.0250.a:0 "Advance by land and water. Recover both capitals!"
 hd_nbc.0250.b:0 "Let the troops recover for a few more years."
 hd_nbc.0260.t:0 "The Abdication"
 hd_nbc.0260.desc:0 "You subdued Lu Xun in the south and destroyed Yan and Qin in the north. Your achievements surpass those of every powerful minister before you. Fu Liang has already drafted the abdication edict and awaits only your assent.\n\nAfter more than a hundred and fifty years, the Jin dynasty ends here."
 hd_nbc.0260.a:0 "Accept the abdication and found Great Song."
 hd_nbc.0260.b:0 "Wait a little longer."
 hd_nbc.0901.t:0 "Huan Wen Pacifies Shu"
 hd_nbc.0901.desc:0 "[hd_news_a.GetName], Jin's Inspector of Jing Province, has sailed upriver into Shu and taken Chengdu. Cheng-Han has fallen."
 hd_nbc.0902.t:0 "Former Qin Victorious in the South"
 hd_nbc.0902.desc:0 "[hd_news_a.GetName] has launched a great southern campaign and defeated Jin's army between the Huai and Fei rivers. The balance between north and south has changed."
 hd_nbc.0903.t:0 "The Battle of the Fei River"
 hd_nbc.0903.desc:0 "[hd_news_a.GetName]'s army of a million has collapsed at the Fei River. Every gust of wind and cry of a crane sounds like pursuit; every tree and blade of grass seems an enemy soldier. Generals of the various peoples declare themselves independent, and the north is divided once more."
 hd_nbc.0904.t:0 "Ran Min Proclaims Himself Emperor"
 hd_nbc.0904.desc:0 "[hd_news_a.GetName] has killed Shi Jian at Ye and proclaimed himself emperor of Great Wei. Hebei is in chaos."
 hd_nbc.0905.t:0 "Fu Jian Enters the Passes"
 hd_nbc.0905.desc:0 "[hd_news_a.GetName] has led his Di and Qiang followers west into Guanzhong, occupied Chang'an, and proclaimed himself Heavenly King of Great Qin."
 hd_nbc.0910.t:0 "Huan Xuan Flees West"
 hd_nbc.0910.desc:0 "[hd_news_a.GetName] has routed the Chu army on Mount Fuzhou and entered Jiankang. [hd_news_b.GetName] has taken Emperor An of Jin hostage and fled west to Jiangling."
 hd_nbc.0911.t:0 "The Restoration of Jin"
 hd_nbc.0911.desc:0 "Huan Xuan has been defeated at Zhengrong Islet and killed. [hd_news_b.GetName] has been restored to the throne and adopted the era name Yixi. [hd_news_a.GetName] now supervises the affairs of the Imperial Secretariat and controls the government."
 hd_nbc.0920.t:0 "Liu Song Replaces Jin"
 hd_nbc.0920.desc:0 "[hd_news_a.GetName] has accepted Jin's abdication and taken the imperial throne, naming the state Great Song. After more than a hundred and fifty years, the Jin dynasty has come to an end."
 bm_hd_346_shi_hu:0 "Shi Hu"
 bm_hd_346_shi_hu_subheading:0 "Heavenly King of Great Zhao"
 bm_hd_346_shi_hu_desc:0 "Shi Hu, Shi Le's nephew, is renowned for cruelty and prowess in battle. He deposed and killed Shi Le's son, took power, and moved the capital to Ye. With Guandong, Hebei, and Guanzhong in his hands, he is the strongest ruler in the realm. Yet he is past fifty, and his sons already harbor ambitions of their own."
 bm_hd_346_murong_huang:0 "Murong Huang"
 bm_hd_346_murong_huang_subheading:0 "King of Yan"
 bm_hd_346_murong_huang_desc:0 "Murong Huang reigns as King of Yan at Longcheng. He has defeated Goguryeo to the east and destroyed the Yuwen tribe to the north; this year, he has also defeated Fuyu. He acknowledges Jin's legitimacy, yet already plans to rule the Central Plains, waiting only for Shi Zhao to reveal a weakness."
 bm_hd_346_zhang_zhonghua:0 "Zhang Zhonghua"
 bm_hd_346_zhang_zhonghua_subheading:0 "Governor of Liang Province, Duke of Xiping"
 bm_hd_346_zhang_zhonghua_desc:0 "The Zhang clan has held Liang Province for four generations, acknowledging Jin's legitimacy while guarding its borders and keeping its people safe. Zhang Zhonghua has only just inherited power this year, at twenty-one. Already, Ma Qiu of Later Zhao has reached the walls of Fuhan."
 bm_hd_404_yao_xing:0 "Yao Xing"
 bm_hd_404_yao_xing_subheading:0 "Heavenly King of Later Qin"
 bm_hd_404_yao_xing_desc:0 "Since succeeding his father, Yao Xing has destroyed the remnants of Former Qin, forced Later Liang to submit, and taken Luoyang. Guanzhong and Longyou now belong entirely to Later Qin. He reveres Buddhism, honors the worthy, and has relinquished the imperial title in favor of Heavenly King. Western Qin and Southern Liang acknowledge him as their liege. Yet defeat by Northern Wei at Chaibi has blocked his path east."
 bm_hd_404_tuoba_gui:0 "Tuoba Gui"
 bm_hd_404_tuoba_gui_subheading:0 "Emperor of Wei"
 bm_hd_404_tuoba_gui_desc:0 "Tuoba Gui restored his state while still young, massacred the Yan army at Canhe Slope, and seized Bing Province and Hebei. In 398, he established his capital at Pingcheng and proclaimed himself emperor. A ruler of great talent and ambition, he grows ever more suspicious and cruel. Everyone in the palace fears for their life."
 bm_hd_404_murong_de:0 "Murong De"
 bm_hd_404_murong_de_subheading:0 "Emperor of Southern Yan"
 bm_hd_404_murong_de_desc:0 "After Northern Wei shattered Later Yan, Murong De led his people south across the Yellow River, seized Qing Province, and proclaimed himself emperor at Guanggu. He is nearly seventy and has no son; his nephew Murong Chao is far away in Chang'an."
 hd_nbc.0145.t:0 "The Coup at Yunlong Gate"
 hd_nbc.0145.desc:0 "Since taking the throne, Fu Sheng has given himself to drunkenness and killing. Every courtier fears for their life. Wang Meng and Lü Polou urge you to act before Fu Sheng kills the entire imperial clan.\n\nSome of the palace guards are already willing to open the gates for you."
 hd_nbc.0145.a:0 "Lead the troops into the palace and depose the tyrant!"
 hd_nbc.0145.b:0 "I cannot cross the line between ruler and subject."
 hd_nbc.0906.t:0 "Fu Jian Takes the Throne"
 hd_nbc.0906.desc:0 "[hd_news_a.GetName] has entered Chang'an's palace at night, deposed and killed the tyrant, and proclaimed himself Heavenly King of Great Qin."
