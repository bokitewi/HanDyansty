l_english:
 bm_hd_group_nbc:0 "Northern and Southern Dynasties"
 bm_hd_346:0 "Subduing the Min and E Mountains"
 bm_hd_346_desc:0 "In the winter of the second year of Yonghe, Shi Hu holds Ye and styles himself Heavenly King of Zhao, ruling Guandong, Hebei, and Guanzhong. Murong Huang reigns as King of Yan in Liaoxi, Zhang Zhonghua has just inherited Liang Province, and Li Shi's debauchery has cost him his people's support in Chengdu. South of the Yangtze, a child sits on the Jin throne while Empress Dowager Chu governs the court.\n\nOn the Xinwei day of the eleventh month, Huan Wen, Inspector of Jing Province, sets out from Jiangling and sails upriver against Shu without waiting for the court's orders.\n\n#bold The confrontation between north and south begins here.#!"
 bm_hd_404:0 "Rising at Jingkou"
 bm_hd_404_desc:0 "In the winter of the second year of Yuanxing, Huan Xuan deposes Emperor An of Jin and proclaims himself Emperor of Chu. In the north, Tuoba Gui has founded Wei at Pingcheng, Yao Xing holds Guanzhong, Murong De has founded Yan at Guanggu, and several Liang states stand side by side in Hexi.\n\nOn the Yimao day of the second month of Yuanxing's third year, the former Beifu officer Liu Yu joins Liu Yi, He Wuji, Meng Chang, and more than twenty others at Jingkou. They kill Huan Xiu, Inspector of Xu Province, and rise to overthrow Huan Xuan.\n\n#bold Whether Chu will endure and Jin will be restored is decided now.#!"
 bm_hd_346_huan_wen:0 "Huan Wen"
 bm_hd_346_huan_wen_subheading:0 "General Who Pacifies the West, Inspector of Jing Province"
 bm_hd_346_huan_wen_desc:0 "Huan Wen married the Senior Princess of Nankang and took command of Jing Province at thirty-four. With Cheng-Han in turmoil, he submitted a memorial and set out at once, leading a small force upriver into Shu. If this campaign succeeds, his renown will overshadow every great man at court."
 bm_hd_346_yin_hao:0 "Yin Hao"
 bm_hd_346_yin_hao_subheading:0 "General Who Establishes Valor, Inspector of Yang Province"
 bm_hd_346_yin_hao_desc:0 "Yin Hao spent ten years in seclusion, earning renown for philosophical discourse. Sima Yu, Prince of Kuaiji, brought him into office to govern Yang Province and counterbalance Huan Wen. He must prove that a renowned scholar can also govern a state and command an army."
 bm_hd_346_liu_qun:0 "Liu Qun"
 bm_hd_346_liu_qun_subheading:0 "Inspector of Qin Province"
 bm_hd_346_liu_qun_desc:0 "Liu Qun is the son of Liu Kun, Jin's Minister of Works. After his father's death, he wandered through Hebei before entering the service of the Shi clan. Though he serves at a Hu court, he has not forgotten the old acquaintances of the Central Plains."
 bm_hd_346_liu_xuan:0 "Liu Xuan"
 bm_hd_346_liu_xuan_subheading:0 "Duke of Anle of Han"
 bm_hd_346_liu_xuan_desc:0 "Liu Xuan is a great-grandson of Shu Han's last ruler. The chaos of the Yongjia era nearly wiped out the Liu descendants; he alone fled to Shu, where Cheng-Han made him Duke of Anle to maintain the last ruler's ancestral rites. He has no land and no army, only a surname."
 bm_hd_346_yang_chu:0 "Yang Chu"
 bm_hd_346_yang_chu_subheading:0 "Duke of Chouchi"
 bm_hd_346_yang_chu_desc:0 "The Yang clan of the Baima Di has held Mount Chouchi for more than a century, maneuvering among Jin, Zhao, Liang, and Cheng. Yang Chu must keep this mountain stronghold alive between the great powers."
 bm_hd_404_huan_xuan:0 "Huan Xuan"
 bm_hd_404_huan_xuan_subheading:0 "Emperor of Chu"
 bm_hd_404_huan_xuan_desc:0 "Huan Xuan is Huan Wen's youngest son, heir to his father's influence. Barely three months have passed since he usurped Jin and founded Chu. His kinsmen command the provinces, yet news of a mutiny has arrived from Jingkou."
 bm_hd_404_liu_yu:0 "Liu Yu"
 bm_hd_404_liu_yu_subheading:0 "General Who Establishes Valor, Administrator of Pengcheng"
 bm_hd_404_liu_yu_desc:0 "Born into poverty, Liu Yu rose through the Beifu Army and made his name suppressing Sun En's rebellion. Now he has raised the banner at Jingkou with little more than a hundred conspirators, challenging all of Huan Chu with the troops of a single corner of the realm."
 bm_hd_404_fu_hong:0 "Fu Hong"
 bm_hd_404_fu_hong_subheading:0 "Inspector of Liang Province"
 bm_hd_404_fu_hong_desc:0 "Fu Hong was once crown prince of Former Qin. Exiled south of the Yangtze after the Battle of the Fei River, he now serves Huan Chu as Inspector of Liang Province. His former state is long gone; he can only stake his fate on Huan Xuan."
 hd_nbc_beifu_army_name:0 "Beifu Army of Restoration"
 hd_nbc_war_cb:0 "Northern and Southern Campaign"
 hd_nbc_war_cb_desc:0 "A historical war of the Northern and Southern Dynasties, initiated only through scripted events."
 HD_NBC_WAR_NAME:0 "[ATTACKER.GetPrimaryTitle.GetNameNoTierNoTooltip] Campaign against [DEFENDER.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 hd_nbc_war_victory_desc:0 "[attacker.GetShortUIName|U] takes the disputed lands."
 hd_nbc_war_white_peace_desc:0 "Both sides cease fighting and retain their former lands."
 hd_nbc_war_defeat_desc:0 "[attacker.GetShortUIName|U] returns in defeat."
