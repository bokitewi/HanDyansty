 hd_nbc_xishu_army_name:0 "Shu Mutineers"
 hd_nbc.0001.t:0 "The River Mouth at Wucheng"
 hd_nbc.0001.desc:0 "Under Mao Qu's orders, the troops of Shu march east against the Huan clan. By the time they reach the river mouth at Wucheng, complaints fill the ranks. Yi Province lies on the frontier, and the people of Shu have long suffered conscription and forced labor. Why should they give their lives for Jiangdong?\n\nHou Hui and Yang Mei burst into your tent with a band of soldiers. Kneeling before you, they ask you to lead them back to seize Chengdu. Refuse, and they may not spare you; agree, and you become another Li Te."
 hd_nbc.0001.a:0 "Then turn the army back to Chengdu!"
 hd_nbc.0001.b:0 "I cannot do such a thing. (Leap into the water to escape.)"
