l_english:
 # Two Jins and Sixteen Kingdoms unified historical line, 395 section, southern line (6-S): events hd_j16.5245-5360, modifiers, titles, truce name, army names

 hd_j16.5245.t:0 "Director of the Secretariat"
 hd_j16.5245.desc:0 "Wang Mi is dead, and the seal of the Imperial Secretariat lies unclaimed. [hd_j16_ev_liu.GetName] raised his army at Jingkou and restored the Jin at Jiangling; most of the generals at court are his old comrades, and the grain of Yangzhou reaches Jiankang only through his hands. Some urge Your Majesty to summon him to court as Director of the Secretariat. Others whisper that power once handed over is never handed back.\n\nThe edict is drafted. It only lacks the seal."
 hd_j16.5245.a:0 "Summon him and entrust him with the government"
 hd_j16.5245.b:0 "We shall govern Ourselves"

 hd_j16.5246.t:0 "Liu Yu Directs the Secretariat"
 hd_j16.5246.desc:0 "[hd_news_a.GetName] has come to court as Director of the Secretariat and Inspector of Yangzhou. Edicts in Jiankang now issue from his office, his Beifu veterans hold the key garrisons, and both the army and the government of the Jin rest in the hands of the general from Jingkou."

 hd_j16.5253.t:0 "A Request for a Command"
 hd_j16.5253.desc:0 "[hd_j16_cz_who.GetName] petitions to be posted to [hd_j16_cz_duchy.GetName]. Remnants of the Huan clan still roam the middle Yangtze, and the upriver commanderies have long lacked a trustworthy governor; with the men of Jingkou holding key posts, Jiankang would gain another shield. Yet a regional command once granted may not be easy to recall."
 hd_j16.5253.a:0 "Grant the request"
 hd_j16.5253.b:0 "Not yet"

 hd_j16.5261.t:0 "The Matter of Lingnan"
 hd_j16.5261.desc:0 "[hd_j16_ev_lu.GetName] has held Panyu for more than a year and now sends envoys with a memorial calling himself a loyal subject of the Jin. The court, worn out by Huan Xuan's rebellion, must still garrison Jiangling and Xunyang; a far expedition to Lingnan now could cost more than it gains. But to accept his tribute is to admit that the southern commanderies are his."
 hd_j16.5261.a:0 "Name him Inspector of Guangzhou and keep the south quiet"
 hd_j16.5261.b:0 "He is Sun En's heir in all but name; send an army against him"

 hd_j16.5262.t:0 "An Edict from the Court"
 hd_j16.5262.desc:0 "An envoy from Jiankang has reached Panyu with an edict naming me Inspector of Guangzhou and General Who Pacifies the South. The wording is courteous, but it is plain the court offers this only because it cannot reach so far. Xu Daofu advises me to accept, rest the troops and wait for an opening; others say that bowing to the Jin court betrays the cause we took to the sea for."
 hd_j16.5262.a:0 "Accept, and build strength in the south"
 hd_j16.5262.b:0 "Refuse the Jin court's offices"

 hd_j16.5263.t:0 "Lu Xun Named Inspector of Guangzhou"
 hd_j16.5263.desc:0 "The Jin court has named [hd_news_a.GetName] Inspector of Guangzhou. Panyu is once more Jin territory on the map, but the troops and grain of Lingnan answer to Lu Xun alone, and the court's officials wait outside the city for a reply that seldom comes."

 hd_j16.5270.t:0 "The Fall of Guanggu"
 hd_j16.5270.desc:0 "After a siege of many months, Guanggu has fallen with its granaries empty. The ruler of the Southern Yan has been sent captive to Jiankang and the commanderies of Qingzhou now belong to the Jin. The name of [hd_news_a.GetName] is feared north of the Yellow River."

 hd_j16.5300.t:0 "A Chance to Strike North"
 hd_j16.5300.desc:0 "Scouts report that Liu Yu's whole army is in Qingzhou, still besieging Guanggu, and that only a few thousand men guard Jiankang. Xu Daofu came in the night to urge me to sail downriver at once: the ships at Shixing are ready, and Yuzhang and Xunyang may not hold. Miss this chance, and once Liu Yu returns, we can only sit and wait in the south."
 hd_j16.5300.a:0 "Sail north and strike at Jiankang"
 hd_j16.5300.b:0 "Hold Lingnan and take no risks"

 hd_j16.5301.t:0 "Lu Xun Marches North"
 hd_j16.5301.desc:0 "[hd_news_a.GetName] and Xu Daofu have risen in Lingnan; their fleets are sailing down the Gan River toward Jiangzhou. The Jin court is in uproar. Liu Yu is still in Qingzhou, and the generals left behind can only shut their gates and hold."

 hd_j16.5302.t:0 "Lu Xun Falls Back to Xunyang"
 hd_j16.5302.desc:0 "The fleets of [hd_news_a.GetName] failed to take Jiankang. Liu Yu raced back from the north and held the Stone City; Lu Xun hesitated, and when his grain ran out he fell back to Xunyang with his army already beginning to scatter."

 hd_j16.5305.t:0 "By Sea to Panyu"
 hd_j16.5305.desc:0 "Lu Xun's main army is locked with mine in Jiangzhou, and only the old and weak guard Panyu. Sun Chu asks for a flotilla to sail by sea straight to Guangzhou and take the enemy from behind. The winds and waves are uncertain; if the fleet is lost, it is lost for nothing. If it succeeds, Lu Xun will have no home to return to."
 hd_j16.5305.a:0 "Send Sun Chu by sea"
 hd_j16.5305.b:0 "The sea is too dangerous"

 hd_j16.5306.t:0 "Panyu Retaken"
 hd_j16.5306.desc:0 "A Jin fleet appeared from the sea and stormed Panyu. Lu Xun could not return in time, his followers scattered, and the commanderies of Lingnan submitted one after another. [hd_news_a.GetName] has ended the sea-borne rebellion that Sun En and Lu Xun had kept alive for two generations."

 hd_j16.5310.t:0 "Liu Yi Asks for Jingzhou"
 hd_j16.5310.desc:0 "[hd_j16_ev_yi.GetName] petitions to take over Jingzhou, since Liu Daogui is gravely ill. Jingzhou sits on the upper Yangtze with strong troops and good horses, and has always been the one place that could rival Jiankang. He rose with me at Jingkou and has never been content to stand below anyone. To give him Jiangling is to reward a comrade, and to raise a tiger."
 hd_j16.5310.a:0 "Grant it"
 hd_j16.5310.b:0 "Jingzhou cannot be his"

 hd_j16.5311.t:0 "A Command in Jingzhou"
 hd_j16.5311.desc:0 "Liu Daogui is gravely ill and Jingzhou lies open. Jiangling sits on the upper Yangtze; with a command there, I would no longer depend on anyone's favour. At Jingkou Liu Yu and I stood side by side. Now he governs the realm while I keep a corner at Gushu. Once this memorial is sent, everyone at court will understand what I mean by it."
 hd_j16.5311.a:0 "Petition for Jingzhou"
 hd_j16.5311.a.tt:0 "Once I move to Jiangling, my old command of Huainan will revert to the court."
 hd_j16.5311.b:0 "Stay at my post"

 hd_j16.5315.t:0 "Trouble at Jiangling"
 hd_j16.5315.desc:0 "Word from Jiankang: Liu Yu has sent troops upriver, and Wang Zhen'e's vanguard may arrive any day. My officers are divided. Some urge me to go to court in a light boat, beg pardon in person and surrender Jingzhou, and so perhaps save my life. Others say that to step back now is to die, and that I should hold Jiangling and fight it out."
 hd_j16.5315.a:0 "Go to court, beg pardon and give up Nanjun"
 hd_j16.5315.b:0 "Rise in arms from Jingzhou"

 hd_j16.5316.t:0 "Liu Yi's Intentions"
 hd_j16.5316.desc:0 "Since reaching Jiangling, [hd_j16_ev_yi.GetName] has replaced most of his staff and keeps up a busy correspondence with old friends at court. Wang Zhen'e proposes to take a hundred light boats upriver, pretending to escort Liu Fan to his new post, and seize Jiangling by surprise. If it works, the upper river is settled in a single stroke; if not, it means war with an old comrade."
 hd_j16.5316.a:0 "Send Wang Zhen'e against Jiangling"
 hd_j16.5316.b:0 "Let him be, for now"

 hd_j16.5317.t:0 "Wang Zhen'e Takes Jiangling"
 hd_j16.5317.desc:0 "Wang Zhen'e sailed upriver with a hundred boats, claiming to escort Liu Fan to his post, and reached the walls of Jiangling unopposed. Liu Yi fought in haste, his men broke, and he fled to a Buddhist temple, where he hanged himself. Of the men who rose at Jingkou, only [hd_news_a.GetName] now holds power."

 hd_j16.5320.t:0 "The Shu Campaign"
 hd_j16.5320.desc:0 "Qiao Zong has held Shu for nearly ten years, allied himself with Huan Qian and Lu Xun, and raided Jingzhou again and again. With the south now at peace, we can turn west. Zhu Lingshi is young for such a command, but steady and shrewd; if I lead in person the campaign will carry more weight, yet I cannot leave Jiankang for long."
 hd_j16.5320.a:0 "Send Zhu Lingshi"
 hd_j16.5320.b:0 "Lead the army into Shu myself"

 hd_j16.5321.t:0 "Shu Pacified"
 hd_j16.5321.desc:0 "The Jin army advanced up the Outer River straight to Chengdu. Qiao Zong abandoned the city and hanged himself at Fucheng. Shu is Jin territory once more, and the realm of [hd_news_a.GetName] reaches the Min Mountains."

 hd_j16.5325.t:0 "An Army at Jiangling"
 hd_j16.5325.desc:0 "[hd_j16_ev_liu.GetName]'s proclamation has arrived, accusing me of courting popular favour in Jingzhou and plotting rebellion. His army follows close behind. Lu Zongzhi of Yongzhou will stand with me, but our combined strength is no match. A prince of the Sima house can no longer hold even Jingzhou."
 hd_j16.5325.a:0 "Abandon Jiangling and flee north"
 hd_j16.5325.b:0 "Rise in arms from Jingzhou"

 hd_j16.5326.t:0 "Against Sima Xiuzhi"
 hd_j16.5326.desc:0 "[hd_j16_ev_xz.GetName] is well loved in Jingzhou and in close touch with Lu Zongzhi of Yongzhou. A prince of the blood holding the upper river ought to be the throne's bulwark; if he will not serve me, he is a danger sleeping beside my bed."
 hd_j16.5326.a:0 "Send an army against him"
 hd_j16.5326.b:0 "He is of the imperial clan; do not press him"

 hd_j16.5327.t:0 "Sima Xiuzhi Flees"
 hd_j16.5327.desc:0 "[hd_news_a.GetName] was defeated at Jiangling and has fled north with his sons and nephews. Jingzhou has changed hands, and the last prince of the Jin house able to lead an army has left the south."

 hd_j16.5329.t:0 "Xiangyang Alone"
 hd_j16.5329.desc:0 "Sima Xiuzhi has already fled north, and the Jin vanguard will reach Xiangyang any day. My son Gui and I hold a lonely city; we cannot advance to save Jiangling, and there is no road back. The Qin in the north may still take us in."
 hd_j16.5329.a:0 "Abandon Xiangyang and go north"
 hd_j16.5329.b:0 "Rise in arms from Xiangyang"

 hd_j16.5330.t:0 "Luoyang Recovered"
 hd_j16.5330.desc:0 "The Jin vanguard has entered Luoyang. The old capital of a century past belongs to the Jin again, and its elders came out to greet the imperial army. [hd_news_a.GetName] sent envoys to pay respects at the five imperial tombs and posted guards there."

 hd_j16.5331.t:0 "The Fall of the Later Qin"
 hd_j16.5331.desc:0 "Wang Zhen'e led the fleet up the Wei River to the walls of Chang'an. The ruler of Qin surrendered, and the Later Qin is no more. For the first time since the Yongjia disaster, a Jin army stands in the old capital of Guanzhong. The northern expedition of [hd_news_a.GetName] has succeeded."

 hd_j16.5335.t:0 "Return to the East?"
 hd_j16.5335.desc:0 "Grim news from Jiankang: Liu Muzhi is dead. With no one to hold the court, staying long in Guanzhong may cost me the heartland. Yet Chang'an has only just been taken, the generals here are at odds, and Helian Bobo watches from the north. If I leave Yizhen, he is only twelve; if I stay, the south must be entrusted to others."
 hd_j16.5335.a:0 "Return to Jiankang and leave Yizhen in Guanzhong"
 hd_j16.5335.b:0 "Stay in Chang'an and hold Guanzhong"

 hd_j16.5336.t:0 "Liu Yu Returns East"
 hd_j16.5336.desc:0 "On hearing of Liu Muzhi's death, [hd_news_a.GetName] hurried back to the south, leaving his son to hold Chang'an with Wang Xiu, Wang Zhen'e, Shen Tianzi and others to assist him. The elders of Guanzhong followed him as far as Bashang, weeping and begging him to stay, but could not hold him."

 hd_j16.5340.t:0 "The Nine Bestowments"
 hd_j16.5340.desc:0 "The edict has come: I am to be Duke of Song, granted the Nine Bestowments, with Pengcheng as my state. Since Wang Mang and Cao Cao, everyone knows what such an edict means. Custom says I must first decline and let the court insist, but decline too long and the mood of the court may change."
 hd_j16.5340.a:0 "Decline thrice, then accept"
 hd_j16.5340.b:0 "Refuse firmly, and wait another year"

 hd_j16.5341.t:0 "Liu Yu Receives the Nine Bestowments"
 hd_j16.5341.desc:0 "The Jin court has made [hd_news_a.GetName] Duke of Song with the Nine Bestowments and the state of Song at Pengcheng. The officials offered their congratulations, and every one of them understood that the fate of the Jin no longer lies with the Sima."

 hd_j16.5355.t:0 "Elevation to King"
 hd_j16.5355.desc:0 "The state of Song has stood for a year, and again there are memorials asking that I be raised to King of Song. Above a duke is a king, and above a king there is only one seat left. The court awaits my answer."
 hd_j16.5355.a:0 "Accept"
 hd_j16.5355.b:0 "Decline, and wait another year"

 hd_j16.5356.t:0 "King of Song"
 hd_j16.5356.desc:0 "The Jin court has raised [hd_news_a.GetName] to King of Song. The palaces and officials of Song follow the rites of the Son of Heaven himself, and the Jin emperor in Jiankang keeps only an empty hall."

 hd_j16.5345.t:0 "Chang'an in Peril"
 hd_j16.5345.desc:0 "The generals of Guanzhong have turned on one another, and the Xia army has swept south through the gap; the towns north of the Wei have fallen one after another. Grain is running out and the city is in panic. The road east is still open, but once we leave, the old capital of the former emperors will be handed to the enemy."
 hd_j16.5345.a:0 "Abandon Chang'an and return east"
 hd_j16.5345.b:0 "Hold Chang'an to the last"

 hd_j16.5346.t:0 "The Fall of Chang'an"
 hd_j16.5346.desc:0 "The army of [hd_news_a.GetName] has entered Guanzhong. The retreating Jin troops were routed at Qingni, and Zhu Lingshi, Fu Hongzhi and others fell in battle. The Guanzhong that Liu Yu's northern expedition had won is lost again in less than two years."

 hd_j16.5350.t:0 "Emperor Gong Ascends the Throne"
 hd_j16.5350.desc:0 "Emperor An has died in the Eastern Hall. Rumour says Wang Shaozhi strangled him with a robe on orders from above. The Prince of Langya, [hd_news_a.GetName], has ascended the throne and proclaimed the Yuanxi era. From the first day of his reign the new emperor knows he is only a name to be signed on an edict of abdication."

 # Modifiers
 hd_j16_guangzhou_cishi_modifier:0 "Inspector of Guangzhou"
 hd_j16_guangzhou_cishi_modifier_desc:0 "Nominally appointed Inspector of Guangzhou by the Jin court, while in fact holding Lingnan for himself."
 hd_j16_liuyi_xiezui_modifier:0 "Begged Pardon at Court"
 hd_j16_liuyi_xiezui_modifier_desc:0 "Gave up a regional command and went to court to beg pardon, at great cost to reputation."

