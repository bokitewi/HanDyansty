l_english:
 siege_development_decline_desc:0 "The long siege has left the fields outside the walls to ruin and cut off the merchants; the region's vitality withers by the day."
 siege_epidemic_resistance_decrease_desc:0 "Soldiers and civilians are trapped in a corner of the city, people and livestock crowded together and filth piling up; pestilence spreads easily."
 siege_encampment_desc:0 "The besieging army digs trenches and builds ramparts outside the walls. Its camp grows stronger by the day, and the defenders' advantage of their walls dwindles accordingly."
 scorched_earth_county_modifier_desc:0 "This land has lately suffered a massacre. The walls lie in ruins, nine houses in ten stand empty, and the surviving people seethe with resentment."
 scorched_earth_province_modifier_desc:0 "Farmhouses burned and granaries emptied; armies wintering here can scarcely live off the land."
