l_english:
 hd_liu_bei_rise.0100.t:0 "The Yellow Turbans Rise"
 hd_liu_bei_rise.0100.desc:0 "The Yellow Turban armies have risen against the Han. Reports of fighting arrive from several fronts. The time has come to decide whether our company will fight in the dynasty’s defense."
 hd_liu_bei_rise.0100.a:0 "We shall fight in defense of the Han!"
 hd_liu_bei_rise.0100.b:0 "We must first put our own affairs in order."
 hd_liu_bei_rise.0200.t:0 "The Coalition Against Dong Zhuo"
 hd_liu_bei_rise.0200.desc:0 "The eastern lords have formed a coalition against Dong Zhuo. Our company need not become a member of their league to fight alongside its armies."
 hd_liu_bei_rise.0200.a:0 "We will join the campaign against Dong Zhuo!"
 hd_liu_bei_rise.0200.b:0 "We should not become involved."
 hd_liu_bei_rise.0300.t:0 "An Invitation to an Old Friend"
 hd_liu_bei_rise.0300.desc:0 "Thirty days have passed since the coalition dissolved. Liu Bei and his followers may welcome a place to establish their camp. I could offer him an alliance and invite him to my present capital."
 hd_liu_bei_rise.0300.a:0 "Send an invitation to Liu Bei."
 hd_liu_bei_rise.0300.b:0 "For now, we should follow separate paths."
 hd_liu_bei_rise.0301.t:0 "Gongsun Zan’s Invitation"
 hd_liu_bei_rise.0301.desc:0 "Gongsun Zan offers an alliance and invites our company to establish its camp at his current capital. Our followers would remain under my command; this is an alliance, not an oath of vassalage."
 hd_liu_bei_rise.0301.a:0 "We shall accept his invitation."
 hd_liu_bei_rise.0301.b:0 "I must seek another course."
 hd_liu_bei_rise.0400.t:0 "Zhao Zilong of Changshan"
 hd_liu_bei_rise.0400.desc:0 "While our camp rests in Gongsun Zan’s lands, I become acquainted with Zhao Yun. Our conversations reveal a shared concern for those caught in the turmoil. I have found a friend worthy of trust."
 hd_liu_bei_rise.0400.a:0 "I am fortunate to count Zilong as a friend."
 hd_liu_bei_rise.0410.t:0 "Zilong Comes to Serve"
 hd_liu_bei_rise.0410.desc:0 "Zhao Yun has left Gongsun Zan’s court and has come to find me. Our friendship has endured, and he now offers to join my household and serve beside me."
 hd_liu_bei_rise.0410.a:0 "Zilong, you are most welcome!"
 hd_liu_bei_rise.0500.t:0 "Preparing Xuzhou’s Defenses"
 hd_liu_bei_rise.0500.desc:0 "Cao Cao controls Yanzhou and has extended his authority into Yuzhou or Qingzhou. Xuzhou must prepare. I can strengthen the counties still under my rule and invite Liu Bei’s company to assist us."
 hd_liu_bei_rise.0500.a:0 "Prepare the defenses and send for Liu Bei."
 hd_liu_bei_rise.0500.b:0 "Make no new arrangements for now."
 hd_liu_bei_rise.0501.t:0 "An Envoy from Xuzhou"
 hd_liu_bei_rise.0501.desc:0 "Tao Qian offers an alliance and invites our company to Xuzhou. We would establish our camp at his capital within the province, or in another Xuzhou county under his rule should his capital lie elsewhere."
 hd_liu_bei_rise.0501.a:0 "We shall go to his assistance."
 hd_liu_bei_rise.0501.b:0 "We should not commit ourselves."
 hd_liu_bei_rise.0600.t:0 "The Mi Family of Donghai"
 hd_liu_bei_rise.0600.desc:0 "In Xuzhou, I meet Mi Zhu to discuss the uncertain future. He and Mi Fang may join my household when their circumstances permit. An eligible unmarried adult woman of their house could also seal our friendship through marriage."
 hd_liu_bei_rise.0600.a:0 "Let us unite our fortunes."
 hd_liu_bei_rise.0600.b:0 "Welcome the brothers, but arrange no marriage."
 hd_liu_bei_rise.0700.t:0 "Entrusting Xuzhou"
 hd_liu_bei_rise.0700.desc:0 "My health is failing, and I can no longer bear the burden of governing Xuzhou. Liu Bei is here. Entrusting my territorial titles and their vassals to him may prevent a succession struggle. My noble-family identities will remain outside this settlement."
 hd_liu_bei_rise.0700.a:0 "Entrust Xuzhou to Liu Bei."
 hd_liu_bei_rise.0700.b:0 "Leave the existing succession arrangements in place."
 hd_liu_bei_rise.0701.t:0 "Taking Charge of Xuzhou"
 hd_liu_bei_rise.0701.desc:0 "Tao Qian is gravely ill and offers me the territorial titles and vassals under his rule. His noble-family identities remain outside the settlement. If I accept, the transfer must be completed before his final affairs are settled."
 hd_liu_bei_rise.0701.a:0 "I accept the charge of protecting these lands."
 hd_liu_bei_rise.0701.b:0 "I cannot accept this responsibility."
 HD_LIU_BEI_RISE_STORY_STATUS:0 "Liu Bei’s rise: the Yellow Turbans, the coalition, Gongsun Zan, Zhao Yun, the Mi family, and Xuzhou. Progress follows the living characters and current political situation."
 hd_lb_xuzhou_prepared_defenses:0 "Prepared Defenses of Xuzhou"
 hd_lb_xuzhou_prepared_defenses_desc:0 "Fortifications and garrisons prepared under Tao Qian."
 hd_lb_no_effect_tt:0 "No alliance, war, title, or camp changes. This invitation will not repeat."
 hd_lb_yellow_join_tt:0 "Join the defensive side of eligible active Yellow Turban wars. No new war is created and no existing side is reversed."
 hd_lb_dong_join_tt:0 "Join the attacking side of the anti-Dong campaign, or wait for its declaration. This does not add Liu Bei to the confederation."
 hd_lb_gongsun_send_tt:0 "Send Liu Bei an offer of alliance and a place for his camp."
 hd_lb_gongsun_accept_tt:0 "Form an alliance with Gongsun Zan. An adventurer relocates the existing camp to his current capital; landed rulers retain their lands and capital. Active travel is allowed to finish before relocation."
 hd_lb_zhao_friend_tt:0 "Liu Bei and Zhao Yun become friends. Zhao Yun remains at Gongsun Zan’s court for now."
 hd_lb_zhao_join_tt:0 "Zhao Yun joins Liu Bei’s household while free and unlanded. Existing landed domains are never confiscated."
 hd_lb_tao_defense_tt:0 "Xuzhou counties actually ruled by Tao gain +1 fort level and +20% garrison size for five years. Liu Bei receives an invitation."
 hd_lb_tao_accept_tt:0 "Ally with Tao Qian. Adventurers move their camp to a Xuzhou county he controls; landed rulers retain their lands and capital. This does not automatically join all of his wars."
 hd_lb_mi_visit_tt:0 "The Mi brothers join when unlanded and free. Mi Huan is preferred as a bride; otherwise an eligible unmarried adult from Mi Zhu’s house is selected. No eligible bride means recruitment only."
 hd_lb_mi_recruit_only_tt:0 "Recruit the Mi brothers without arranging a marriage. Temporary travel, imprisonment, or landholding obstacles postpone recruitment."
 hd_lb_bequest_tao_tt:0 "Transfer Tao Qian’s territorial titles and their vassals to Liu Bei, excluding noble-family and special landless titles. Tao dies of illness only after transfer succeeds. A player-controlled Liu Bei must also accept."
 hd_lb_bequest_liu_tt:0 "Transfer and verify Tao’s territorial titles and their vassals, leave family identities intact, then resolve his death from illness. Liu Bei becomes a landed Celestial ruler."
 hd_lb_bequest_decline_tt:0 "No titles are transferred and Tao Qian is not killed. This cession opportunity closes."
