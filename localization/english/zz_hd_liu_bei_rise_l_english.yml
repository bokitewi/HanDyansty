l_english:
 hd_liu_bei_rise.0100.t:0 "Yellow Banners Across the Land"
 hd_liu_bei_rise.0100.desc:0 "The urgent dispatch lists one place after another. Wherever the Yellow Turbans advance, imperial troops are already fighting the rebels. When the messenger speaks of the people fleeing their homes, he wipes his face with his sleeve. His voice is hoarse when he begins again.\n\nI have him sit and drink some water, then read the dispatch once more. Some of these districts are near, others far away, but are those fleeing not all trying to save their wives and children? If I furl my banner today simply because we are few, what could I ever say to those willing to follow me?\n\nSomeone outside the tent asks where we are going. Looking at the faces awaiting my answer, I feel the weight of that question as never before. To save others, I must take these men with me."
 hd_liu_bei_rise.0100.a:0 "Lead our men into the campaign against the Yellow Turbans."
 hd_liu_bei_rise.0100.b:0 "We have too few men and commanders. Protect our followers first."
 hd_liu_bei_rise.0200.t:0 "Righteous Banners in the East"
 hd_liu_bei_rise.0200.desc:0 "Word has arrived that the eastern lords have taken up arms against Dong Zhuo. The messenger eagerly recounts the names on their pact and describes each lord's banners. When asked about mine, he suddenly falls silent.\n\nI have no seat among those lords, nor can my men compare with their great armies. Yet everyone knows that Dong Zhuo holds the imperial court in his grasp. If I decide this is no concern of mine merely because my name is absent from their pact, what are my past words worth?\n\nAfter hearing his report, I order our baggage counted. My followers remain under my command. The decision they await must be my own."
 hd_liu_bei_rise.0200.a:0 "My name is absent from the pact, but I will fight the usurper."
 hd_liu_bei_rise.0200.b:0 "I will take no part in this campaign against Dong Zhuo."
 hd_liu_bei_rise.0300.t:0 "A Letter to an Old Friend"
 hd_liu_bei_rise.0300.desc:0 "\"Where is Liu Xuande these days?\" A month has passed since the armies raised against Dong Zhuo dispersed. Coming across news of him, I call my scribe back. Others are counting the soldiers and supplies they brought home; I would rather know where my old fellow student has found a place to stay.\n\nXuande has always had more confidence in his ambitions than troops to support them. That is no bad thing, but resolve alone will not sustain a camp in these troubled times. Another willing ally would be useful to me, too, especially with military affairs to the south demanding attention.\n\nI ask the scribe for fresh writing slips. There is no need for the stiff language of a summons to a subordinate. This is an invitation to an old friend. Let the offer of an alliance be plain; if he is still wandering with his followers, I have room for them here."
 hd_liu_bei_rise.0300.a:0 "Write to Xuande and invite him north."
 hd_liu_bei_rise.0300.b:0 "Send no invitation for now. Let each of us attend to his own affairs."
 hd_liu_bei_rise.0301.t:0 "A Letter from Bogui"
 hd_liu_bei_rise.0301.desc:0 "“My old friend Bogui still remembers me.” A smile comes to my lips as I read his invitation. The envoy then speaks of an alliance: if I am still on the move with my followers, we may make camp at Gongsun Zan's seat.\n\nI ask him to sit closer and tell me how my friend fares. In all my wanderings, I have grown used to hearing that my troops are too few and my name counts for too little. This letter does not begin by asking how many men I can bring. Yet if I accept, I cannot treat his home as a mere lodging. When Bogui needs me, I must do my part.\n\nThe paper curls a little in my hand. I smooth its edges and look back at the envoy. An old friend has reached out; my answer must be sincere, not a few empty courtesies for him to carry home."
 hd_liu_bei_rise.0301.a:0 "I will stand with Bogui. Move our camp north."
 hd_liu_bei_rise.0301.b:0 "Thank Bogui for his kindness. I must seek another course."
 hd_liu_bei_rise.0400.t:0 "A Kindred Spirit in Zilong"
 hd_liu_bei_rise.0400.desc:0 "After some days in Gongsun Zan's lands, I begin to recognize faces among his soldiers. Zhao Yun is one of them. He never boasts when we speak of warfare, but ask about his home or the refugees, and he always has more to say.\n\nToday our conversation turns again to why he joined the army. In troubled times, he says, people hope to follow someone who can give them a life in peace. I have already risen to leave, but at those words I sit down again. Such things are easy to say. The difficulty is remembering them when one's own interests are at stake.\n\nHe still serves under Bogui, and I have no wish to ask my old friend to surrender one of his officers. For today, finding a friend who understands me is reward enough."
 hd_liu_bei_rise.0400.a:0 "Zilong's hopes are my own."
 hd_liu_bei_rise.0410.t:0 "An Old Friend at the Door"
 hd_liu_bei_rise.0410.desc:0 "Before the visitor's name has even been announced in full, I rise by the door. Zhao Yun has come, his belongings with him, his expression as composed as when we first met.\n\nEver since we became friends at Bogui's, we have known what each of us hopes to accomplish. But we each had our own duties; a few words of mutual admiration could not change everything. Now he has left his former post and is free to choose whom he serves. Only now has he come to ask whether I still wish him to walk beside me.\n\nI glance at his baggage. I mean to offer him a solemn welcome into my service, but instead I ask whether he has had any rest on the road. A friend willing to entrust the road ahead to me means more than any number of grand vows."
 hd_liu_bei_rise.0410.a:0 "Stay with me, Zilong. We have much to accomplish together."
 hd_liu_bei_rise.0500.t:0 "A Shadow over Xuzhou's Walls"
 hd_liu_bei_rise.0500.desc:0 "Cao Cao holds Yanzhou and is extending his reach into the neighboring provinces. Each military dispatch arriving at the provincial offices is more urgent than the last. Xuzhou's fortifications and supply routes can no longer be managed as though these were ordinary times.\n\nI order another inspection of the defenses in the counties under my rule. Crumbling battlements and gaps in the garrisons are entered in the registers, one by one. Repairs can begin at once, but outside help requires someone willing to come. Liu Xuande is known for helping those in distress. An envoy's invitation might persuade him to ally with me and come to Xuzhou's aid.\n\nThe defense registers lie on my desk beside an unsealed letter. If I make no arrangements now, the next report may bring news from far closer than a neighboring province."
 hd_liu_bei_rise.0500.a:0 "Repair the defenses and send an envoy to invite Xuande."
 hd_liu_bei_rise.0500.b:0 "Leave the defenses as they are. Send no invitation for now."
 hd_liu_bei_rise.0501.t:0 "An Invitation from Xuzhou"
 hd_liu_bei_rise.0501.desc:0 "Tao Qian's envoy stands before me, the dust still clinging to his clothes. So eager is he to speak of Xuzhou's defenses that he has not even asked for water. “My lord places his hopes in you, Xuande.” Even after saying this, he will not sit.\n\nI take the letter and ask him to tell me more of the province's plight. The place names call to mind more than walls and towns: there are people within them who do not yet know an army may be coming. Yet I too have followers, people who look to me to find them a way forward.\n\nLord Tao offers an alliance and mutual aid. If I am still wandering with my company, he also welcomes me to move our camp to Xuzhou. I fold the letter. If I answer his appeal to “Xuande,” I must give real help, not send his envoy away with hopes I will never fulfill."
 hd_liu_bei_rise.0501.a:0 "I will stand with Lord Tao. Move our camp to Xuzhou."
 hd_liu_bei_rise.0501.b:0 "I cannot accept so hastily. Please convey my answer."
 hd_liu_bei_rise.0600.t:0 "The Mi Family's Goodwill"
 hd_liu_bei_rise.0600.desc:0 "When Mi Zhu speaks of helping me, he does not immediately ask what office I might promise him. First he asks how my followers are housed. Only after I have answered does he mention Mi Fang, then gently turn the conversation toward a marriage between our families.\n\nI set down my wine cup and bow to him in earnest. In all my wanderings, few have been willing to bind their family's future to mine. I cannot take such goodwill lightly. Yet everyone has ties that hold them: whether the Mi brothers can leave their present posts, and whether this marriage is suitable, must first be made clear.\n\nZizhong still awaits my answer. I welcome their service and gratefully accept their friendship. But a pleasant conversation over wine cannot give us the right to decide another person's whole life."
 hd_liu_bei_rise.0600.a:0 "I welcome help from you both, and a marriage between our families."
 hd_liu_bei_rise.0600.b:0 "I welcome your aid, but let us put marriage aside."
 hd_liu_bei_rise.0700.t:0 "The Provincial Seal by My Sickbed"
 hd_liu_bei_rise.0700.desc:0 "A stack of documents is brought to my bedside. I stare at them for a long while, unable even to unroll the one on top. My illness grows worse by the day. The affairs of the province, great and small, are no longer something I can manage through sheer determination.\n\nLiu Bei is here in Xuzhou. Entrusting my territories and followers to him might spare them a hasty struggle after my death. Yet this is no mere loan of troops or request for aid. Once I hand them over, the officials under my rule will have a new master to answer to.\n\nI ask for the provincial seal to be brought closer. The Tao family has its own line of succession, but the soldiers and people of Xuzhou need someone who can still sit in the hall and govern."
 hd_liu_bei_rise.0700.a:0 "Only Liu Bei can bring peace to this province."
 hd_liu_bei_rise.0700.b:0 "My estate has its rightful heirs. I need not yield the province."
 hd_liu_bei_rise.0701.t:0 "Entrusted with Xuzhou"
 hd_liu_bei_rise.0701.desc:0 "The envoy explains Tao Qian's wishes twice, yet I still do not reach for the territorial registers. When I came to Xuzhou, I promised to help. Who could have known I would now be asked to shoulder Lord Tao's entire burden?\n\n“This is no empty gesture.” The envoy speaks softly, but pushes the documents an inch closer. Looking at the densely written county names, I seem to see gates, villages, and people hoping their garrisons will no longer change banners. The Tao family's estate has its own heirs. What is being placed in my hands is the future safety of these territories.\n\nI rise, take a few steps, then return to the desk. Refusing would be easy, but Lord Tao lies ill, waiting for my reply. Someone must take responsibility for Xuzhou."
 hd_liu_bei_rise.0701.a:0 "I accept this trust, and will strive to prove worthy of it."
 hd_liu_bei_rise.0701.b:0 "The burden is too great. I dare not accept."
 HD_LIU_BEI_RISE_STORY_STATUS:0 "Current Chapter: #V [Story.MakeScope.Var('hd_liu_bei_life_phase').GetFlagName]#!\nLiu Xuande began in Zhuo Commandery, weaving mats and selling sandals, yet claimed descent from Prince Jing of Zhongshan. Amid the turmoil, he travels from place to place with followers willing to live and die beside him, seeking somewhere to settle his company and fulfill his ambitions."
 hd_lb_xuzhou_prepared_defenses:0 "Xuzhou's Defenses Reorganized"
 hd_lb_xuzhou_prepared_defenses_desc:0 "Tao Qian has ordered the battlements repaired and the garrison reinforced, renewing the defenses here."
 hd_lb_no_effect_tt:0 "No alliances, wars, titles, or political alignments change. This invitation will not be offered again."
 hd_lb_yellow_join_tt:0 "You lead your followers into the imperial army to fight the Yellow Turbans."
 hd_lb_dong_join_tt:0 "You will march against Dong Zhuo alongside the eastern armies, although your name is absent from their pact."
 hd_lb_gongsun_send_tt:0 "The letter will reach Xuande. Whether to accept is his decision."
 hd_lb_gongsun_accept_tt:0 "If you are still wandering with your company, you will move your camp north to Bogui's seat."
 hd_lb_zhao_friend_tt:0 "Liu Bei and Zhao Yun become friends. Zhao Yun remains under Gongsun Zan's command for now."
 hd_lb_zhao_join_tt:0 "Zhao Yun joins Liu Bei’s household while free and unlanded. Existing landed domains are never confiscated."
 hd_lb_tao_defense_tt:0 "You send an envoy to Liu Xuande, asking him to come to Xuzhou's aid."
 hd_lb_tao_accept_tt:0 "If you are still wandering with your company, you will move your camp to Xuzhou to lend aid nearby."
 hd_lb_mi_visit_tt:0 "Mi Zhu and Mi Fang will join your company in due course. If a suitable woman of the Mi family is available, she will be married to you."
 hd_lb_mi_recruit_only_tt:0 "Mi Zhu and Mi Fang will join your company in due course."
 hd_lb_bequest_tao_tt:0 "You entrust all the territories and followers under your rule to Liu Xuande. #EMP Once the transfer is complete, you too will pass away.#!"
 hd_lb_bequest_liu_tt:0 "You take charge of Tao Qian's territories and followers, becoming the ruler of Xuzhou. Once the transfer is complete, Lord Tao passes away."
 hd_lb_bequest_decline_tt:0 "No titles are transferred, and Tao Qian is not killed. This opportunity to receive his lands comes to an end."
