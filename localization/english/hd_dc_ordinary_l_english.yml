l_english:
 hd_dc_ord.0009.t: "The cost required to return home"
 hd_dc_ord.0009.desc: "The document delivered bears the name of [hd_dc_prisoner.GetTitledFirstName]. The person remains held by [hd_dc_captor.GetTitledFirstName]; after several inquiries by their relatives, the response always revolves around the word 'price'. \n\n I may propose exchanging the captive for one hundred gold, or temporarily refuse this transaction. Should the other party's relatives also be imprisoned in my custody, there is still room for exchange. Regardless of how it is written, the document must reach the hands of those truly empowered to release the prisoner."
 hd_dc_ord.0009.a: "Redeem for one hundred gold taels, without political allegiance attached."
 hd_dc_ord.0009.a.tt: "Propose a ransom of 100 gold to the current captor, awaiting their acceptance or rejection; if no response is received within three months, the proposal will be cancelled. Upon acceptance, funds and actual imprisonment status will be re-verified; settlement occurs only after deduction, receipt, and release are all completed: the released individual and their surviving close relatives grant you +25 reputation, while the recipient grants you +5 reputation, both lasting for 5 years. Submitting this proposal incurs no payment, does not result in release, and provides no increase in governance points."
 hd_dc_ord.0009.b: "Reject this deal and seek another solution."
 hd_dc_ord.0009.b.tt: "Chaotic Era +1; the surviving close relative of a prisoner reduces your influence by 15. If you have a real minister advocating for a hardline stance, their support increases your influence by 10, lasting for 5 years. Captives remain held by their original captors and will not die from this option."
 hd_dc_ord.0009.c: "Propose an exchange of the relatives actually held by both parties."
 hd_dc_ord.0009.c.tt: "Both parties must possess genuine captives eligible for lawful release. Upon actual acceptance by the opposing side, a re-inspection and release of the two individuals documented in the release documents will be conducted at no cost. Only when both have been released does the world crisis decrease by 1. Each party's family members gain +10 from the ruler who releases their relative, while true enemies' close associates who oppose the release suffer a -15 penalty to you for five years. Refusal, transfer of custody, or failure to release either individual does not constitute a completed exchange."
 hd_dc_ord09_a_terms: "[hd_dc_proposer.GetTitledFirstName] proposes to redeem [hd_dc_prisoner.GetTitledFirstName], still held by [hd_dc_recipient.GetTitledFirstName], for 100 gold in private assets. This document contains only monetary and release terms, with no clauses of loyalty, leverage, or future support. A response is required within three months; upon acceptance, the prisoner's confinement and funds must be re-inspected."
 hd_dc_ord09_c_terms: "[hd_dc_recipient.GetTitledFirstName] releases [hd_dc_prisoner.GetTitledFirstName]; [hd_dc_proposer.GetTitledFirstName] releases [hd_dc_exchange_prisoner.GetTitledFirstName]. Both parties must still hold the respective individuals and be legally authorized to release them. No additional payment, loyalty, or hostages are required; both must be released for the agreement to be fulfilled. Reply within three months."
 hd_dc_ord.0209.t: "After the reply letter arrives"
 hd_dc_ord.0209.ransomed: "The return on collecting ransom and releasing prisoners has been verified. The ransom proposed this time has indeed reached the captor's hands, and the person I seek to redeem has been released from captivity. \n\n Relatives can finally prepare to receive them, and this document on the desk may now be put away."
 hd_dc_ord.0209.exchanged: "Both sides have sent word confirming the release of prisoners. The two captives named in the documents have been freed individually, with no additional names substituted. \n\n Both parties have fulfilled this exchange. As for other disputes, they must be left for future resolution."
 hd_dc_ord.0209.rejected: "The opposing party returned the document and did not affix their seal at the agreed location. \n\n The ransom was not paid, and no one was released based on this invalid agreement. I must find another way."
 hd_dc_ord.0209.partial: "The reply only confirmed that one side had released their prisoners, while the other side's release was not yet finalized. \n\nThis was not a single completed exchange. The officials involved have recorded the actual events separately; a simple statement of \"both sides fulfilling their obligations\" cannot smooth over this gap."
 hd_dc_ord.0209.unpaid: "Although the official document has been agreed upon, the payment has not been fully fulfilled. The person in charge has halted the release arrangements and is verifying the refundable amount based on actual receipts and payments. \n\n This redemption has not been completed, so it cannot be recorded as a merit for saving people."
 hd_dc_ord.0209.failed: "The release of prisoners after payment has not been verified. The handler has reconciled the accounts for the refunded actual receipts; any remaining discrepancies remain in the original ledger. \n\n has not received authentic documentation confirming their release, so this matter cannot be recorded as completed."
 hd_dc_ord.0209.cancelled: "Before the agreement is finalized, the waiting period or the circumstances of the individuals involved may have changed. The old documents are no longer sufficient to demand payment from anyone or release prisoners. \n\n The person handling this matter has canceled this proposal and will not use it to impersonate a still-valid agreement."
 hd_dc_ord.0209.a: "Record according to the actual results."
 hd_dc_ord.0019.t: "The children of your enemies walk into your hall."
 hd_dc_ord.0019.desc: "[hd_dc_visitor.GetTitledFirstName] halted before the steps and announced his name. I already knew who [hd_dc_visitor.GetSheHe]'s child he was. The name [hd_dc_enemy_parent.GetTitledFirstName] always evoked another chapter of my past.\n\nBut upon examining the visitor himself, there is no known lawful cause for detention at this moment. Who owes what from old accounts, and how to treat him today, are two matters requiring separate answers."
 hd_dc_ord.0019.a: "Treat [hd_dc_visitor.GetHerHim] according to this person's conduct."
 hd_dc_ord.0019.a.tt: "Dangerous Times -1; Guest gives you +20. If there is a close minister seeking revenge against someone from your father's generation who was indeed an enemy, that minister will give you -15 for 5 years. Preserve your genuine enmity with your father's enemies; do not grant the guest immunity, titles, or political power."
 hd_dc_ord.0019.b: "I still remember what your family has done."
 hd_dc_ord.0019.b.tt: "Chaotic Times +2; the guest suffers -30 reputation for your hostile reception. If any close minister with a vendetta against their father avenges this, they gain +15 reputation toward you for 5 years. As there is no legal basis for detention, you will not imprison, execute, or strip the guest of their title, nor will they automatically become an enemy."
 hd_dc_ord.0013.t: "The memorials piled on the desk grow ever higher."
 hd_dc_ord.0013.desc: "The document handed over by [hd_dc_petitioner.GetTitledFirstName] was added to the pile on my desk. Control over my directly administered regions had already fallen below half, yet I still had to review and approve each item individually upon request. I opened the top scroll, read two lines, then closed it again. Fatigue would not simply vanish just because official business was urgent. People were still standing outside the door, and someone had to handle the matters on the desk. \n\n"
 hd_dc_ord.0013.a: "Acknowledge the need for assistance and share administrative duties according to clearly defined authorities."
 hd_dc_ord.0013.a.tt: "Spend 30 gold from private funds on clerical work and administrative staff, allowing the current Councilor to take actual responsibility for native internal affairs. Upon task confirmation: Pressure −15; Allies gain +15 toward you; Delayed petitioning vassals lose −10 toward you; lasts 5 years; remains unchanged in times of crisis. The arrogant will additionally suffer a base pressure increase of 20, subject to actual pressure bonus modifiers. This action changes the current cabinet task of that Councilor; if the task fails, the actual expenditure is refunded without pressure reduction."
 hd_dc_ord.0013.b: "Vent your anger on the last person to bring bad news."
 hd_dc_ord.0013.b.tt: "Stress -5, Chaotic World +1; those who are repelled by you suffer a -25 penalty, while anyone explicitly praising you gains +10 toward you for 5 years. Those with compassion or forgiveness incur an additional base stress increase of 20, subject to actual stress gain modifiers; both personality traits are not charged separately. If stress levels remain afterward and the corresponding native mental breakdown is not on cooldown, the next day will follow the native process to select eligible events, with their choices and actual consequences handled normally."
 hd_dc_ord.0013.c: "Confide in those you trust; the final decision remains mine."
 hd_dc_ord.0013.c.tt: "Seek assistance from a genuine friend or trusted relative within your current diplomatic range; they will respond within three months without the need to be in the same court. After providing actual aid, pressure −20, perilous world −1, and the helper gains +20 toward you. Vassals of factions actively claiming against you suffer −10 from you for 5 years. Paranoids additionally endure a base pressure increase of 20 upon confession, subject to actual pressure gain modifiers. The act of seeking aid does not reduce pressure nor grants regency authority."
 hd_dc_ord.invalidated: "The situation has changed; this request to discontinue is hereby withdrawn."
 hd_dc_ord.0113.t: "Those words not written in the memorial"
 hd_dc_ord.0113.desc: "The private letter from [hd_dc_ordinary_ruler.GetTitledFirstName] dispenses with official formulas.\n\n'I am not asking you to decide for me. There are simply things I wish to tell someone I trust.' The following pages are filled with paperwork, requests for instructions, and reasons for lying awake late into the night.\n\nWeariness runs through every line. I can read it carefully and offer my own counsel, or admit that I cannot share the burden just now. How to answer is my decision."
 hd_dc_ord.0113.a: "Write down my thoughts one by one, so this letter may accompany you through these difficult times."
 hd_dc_ord.0113.a.tt: "Actually read private messages, sort out concerns, and reply with advice: the other party's stress -20, regional crisis -1, your favor towards them +20, lasting for 5 years. No transfer of any ruling authority was made."
 hd_dc_ord.0113.b: "I'm sorry, I have no strength left to bear this today either."
 hd_dc_ord.0213.t: "The small space left on the desk"
 hd_dc_ord.0213.helped: "After reading the reply, none of the memorials on my desk vanished into thin air, but I finally could distinguish which matters must be decided today and which may wait until tomorrow. \n\n Someone has carefully read through those worries and written explanations for each one, which has already lightened my burden considerably. The decisions still rest with me; however, I now have a clearer understanding of what the next imperial edict should contain."
 hd_dc_ord.0213.declined: "My plea for assistance did not receive the response I had expected. The reply stated that they were currently unable to share the burden, so I ceased to urge them further. \n\nThe scrolls on my desk remain in their original place. This request has not alleviated my pressure, yet it should not be recorded as a promise never made."
 hd_dc_ord.0213.a: "Continue with the tasks that need to be done today."
 hd_dc_ordinary_response_opinion: "Correspondence and Private Replies"
