l_english:
 hd_dc_ord.0019.c: "Let someone we both trust stand surety, and begin with letters."
 hd_dc_ord.0019.c.tt: "If both [hd_dc_visitor.GetTitledFirstName] and the guarantor agree, you will give [hd_dc_visitor.GetHerHim] a small gift as a token of sincerity, then exchange letters:"
 hd_dc_ord.0119.t: "An Unsealed Letter"
 hd_dc_ord.0119.desc: "The envoy unfolds an unsealed letter. It says nothing of office or troops, asking only whether you are willing to deal openly with one another.\n\n[scope:hd_dc_ordinary.Var('hd_dc_actor').Char.GetTitledFirstName] makes the proposal plain: set aside the old grievances with [scope:hd_dc_ordinary.Var('hd_dc_visitor').Char.GetTitledFirstName]'s forebears for now, with [scope:hd_dc_ordinary.Var('hd_dc_guarantor').Char.GetTitledFirstName] standing surety. The letters can begin only once both agree, and [scope:hd_dc_ordinary.Var('hd_dc_actor').Char.GetSheHe] will prepare a small gift to show sincerity.\n\nThe old accounts remain unsettled. But this new entry must be written by the people here today."
 hd_dc_ord.0119.a: "I will sign my name and answer in person."
 hd_dc_ord.0119.b: "I regret that I cannot agree."
 hd_dc_ord.0219.t: "Your Turn to Take the Brush"
 hd_dc_ord.0219.desc: "Both have agreed, and the gift from [scope:hd_dc_ordinary.Var('hd_dc_actor').Char.GetTitledFirstName] has reached [scope:hd_dc_ordinary.Var('hd_dc_visitor').Char.GetTitledFirstName]. The clerk pushes the paper toward you and waits for your name.\n\nSending this letter will make your intentions public. You can still change your mind, but no one else may sign this line for you."
 hd_dc_ord.0219.a: "State my intention to correspond, and sign my name."
 hd_dc_ord.0219.b: "Set down the brush. I cannot keep this promise."
 hd_dc_ord_correspondence_archive_title: "A Bundle of Letters"
 hd_dc_ord.0319.completed: "The replies from [scope:hd_dc_ordinary.Var('hd_dc_visitor').Char.GetTitledFirstName] and [scope:hd_dc_ordinary.Var('hd_dc_guarantor').Char.GetTitledFirstName] have both arrived. The clerk places them with the letter sent by [scope:hd_dc_ordinary.Var('hd_dc_actor').Char.GetTitledFirstName] and binds them with a silk cord.\n\nThe old grievances between their forebears have not vanished. Yet the people here now have something new on which to build their dealings."
 hd_dc_ord.0319.rejected: "Someone declined the letter, and the two parties could not agree. No gift was sent, and the correspondence never began.\n\nFor now, this gesture of goodwill must be put away."
 hd_dc_ord.0319.unpaid: "Both agreed, but the small gift could not be delivered in full. The clerk's brush stops above the ledger, and the correspondence is set aside.\n\nWith neither the gift complete nor the letters exchanged, a good undertaking ends halfway through."
 hd_dc_ord.0319.withdrawn: "Halfway through the letter, someone sets down the brush and withdraws their consent.\n\nThe gift has already been sent, but the letters were never exchanged. This attempt at reconciliation falls short at the final step."
 hd_dc_ord.0319.expired: "Day after day passes, and the expected replies never all arrive.\n\nThe clerk stacks the letters already received and puts them away. The unfinished half remains blank."
 hd_dc_ord.0319.invalidated: "Circumstances have changed. Some of those who agreed to correspond can no longer proceed as intended. The clerk stops pressing for replies and gathers the letters already received.\n\nThis exchange has come to no conclusion."
 hd_dc_ord.0319.a: "Keep the letters safe for now."
