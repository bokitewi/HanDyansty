l_english:
 hd_dc_ord.0019.c: "Let a person you both trust act as guarantor; first, exchange an open letter."
 hd_dc_ord.0019.c.tt: "Select an actual guarantor with whom you and the youth both have a mutual affinity of at least 60. Both the youth and the guarantor must be accepted within three months; thereafter, pay the youth 30 gold as correspondence expenses. Then grant both parties three months to submit signed public responses. Once both documents are complete, World Crisis −2, and your affinity with each person increases by +15. Actual retainers harboring old grudges may suffer a −10 penalty. Refusal, invalidation, or failure to succeed within the deadline yields no reward; records of payments already made are retained."
 hd_dc_ord.0119.t: "Two signatures awaiting removal"
 hd_dc_ord.0119.desc: "The envoy unfolds an unsealed letter. There is no official title or military command mentioned, only a request that I openly state how I wish to correspond with the other party. \n\n[scope:hd_dc_ordinary.Var('hd_dc_actor').Char.GetTitledFirstName] Please have the youth and the guarantor each provide their response; once both names are collected, the expenses for processing the correspondence will be disbursed. The old grudge of my father's generation still lingers, yet this letter must be penned by the person standing before us now."
 hd_dc_ord.0119.a: "I am willing to sign my name and will personally respond."
 hd_dc_ord.0119.b: "I am unwilling to make commitments regarding this exchange."
 hd_dc_ord.0219.t: "It's my turn to take the brush."
 hd_dc_ord.0219.desc: "Two consents have been delivered, and the expenses for correspondence have already been paid to the youth. The clerk pushed the paper before me, waiting for me to write my own name. \n\n I may publicly confirm my willingness to engage in this limited exchange, or admit that I no longer wish to continue. This entry shall be recorded as my personal response and cannot be signed by anyone else on my behalf."
 hd_dc_ord.0219.a: "Express the intent of correspondence and sign with my name."
 hd_dc_ord.0219.b: "Stop the brush. I cannot continue this promise."
 hd_dc_ord.0319.t: "Letters Archived"
 hd_dc_ord.0319.completed: "The clerks combined the two signed replies. The youth and the guarantor fulfilled their respective promises, with actual records of expenses incurred and payments received. \n\n This round of correspondence is now concluded. It did not erase old grievances between generations but left behind a new matter upon which these people present can base their future interactions."
 hd_dc_ord.0319.rejected: "The refusal has been archived. The required consent is incomplete, no fees have been incurred, and no one has been recorded as having completed the collaboration."
 hd_dc_ord.0319.unpaid: "The clerk paused his pen at the income and expenditure columns: expenses were not fully collected or paid. Correspondence collaboration cannot continue with the currently allocated funds. Amounts already deducted or received remain on the ledger and cannot be covered by a single successful case closure."
 hd_dc_ord.0319.withdrawn: "Someone retracted their promise before putting pen to paper. Responses already sent remain on record with names attached, while incomplete portions are left blank as they should be. \n\n This collaboration was not completed. Receipts and payments have separate accounts; archiving does not mean the money was never received."
 hd_dc_ord.0319.expired: "When the deadline arrived, the clerks had still not collected all the required responses. The archived pages recorded who had agreed, who actually replied, and the payments already made; blank spaces would not be backdated to indicate success."
 hd_dc_ord.0319.invalidated: "The originally agreed counterpart can no longer continue under the original terms. The clerk ceases to urge for replies, filing existing responses together with revenue and expenditure records. \n\n Uncompleted cooperation yields no success reward, and existing accounts will not be erased."
 hd_dc_ord.0319.a: "Archive according to actual events."
