l_english:
 HD_UPRISING_WAR_NAME:0 "Uprising War"
 hd_peasant_populist_uprising_war_victory_desc:0 "The rebel army won the war. When enforcing demands, each county lordship still under actual control by the attacking side will be transferred to the current occupier, while the primary attacking leader will break away from their original lord and become independent."
 hd_peasant_populist_uprising_war_white_peace_desc:0 "Both sides cease hostilities; no earldoms will be transferred in this war."
 hd_peasant_populist_uprising_war_defeat_desc:0 "The uprising failed; the attacking side will not gain a county lordship from this war."
 hd_uprising_war_victory_desc:0 "The rebel army has won the war; the attacking force is now independent from its original lord."
 hd_yellow_turban_war_victory_desc:0 "Along this route, the Yellow Turban Army wins the war and enforces its demands. The counties captured during the war remain under the control of their actual occupiers."
 hd_uprising_war_white_peace_desc:0 "Both sides agree to a ceasefire; territories transferred during the war shall remain in their current status."
 hd_uprising_war_defeat_desc:0 "The uprising failed; all counties captured by the attacking side during this war will be returned to the defending side."
 hd_yellow_turban.0001.t:0 "The Blue Sky Has Died"
 hd_yellow_turban.0001.desc:0 "Before dawn, a messenger burst into the tent with urgent news from Luoyang. The armor leaves and copper bells jingled wildly in the biting cold.\n\n\"The Great Sage of Benevolence, our plans have been exposed!\"\n\nMy disciple [tang_zhou.GetName] has already informed the court. The arrangements across thirty-six regions and the original plan to rise on the fifth day of the third month have all been leaked. [ma_yuan_yi.GetName] was also captured and executed in Luoyang. The authorities are launching a massive manhunt for followers of the Way of Great Peace, and imperial edicts ordering my arrest have already been sent to Jizhou.\n\nZhang Mancheng has gathered crowds in Nanyang, while Bo Cai can raise troops from Yingchuan. Regional chieftains command their own forces, waiting only for the same day to unfurl the yellow flags. If we still wait until the original date, our three armies will be crushed one by one by the court. We can no longer wait."
 hd_yellow_turban.0001.a:0 "The blue sky has perished; the yellow sky shall rise!"
 hd_yellow_turban.0002.t:0 "The Yellow Heaven Prevails"
 hd_yellow_turban.0002.desc:0 "The Yellow Banners have already pressed upon the Han army's fortifications, and reports of victory spread through every camp with the beating of drums. Though Zhang Jiao, Zhang Mancheng, and Bo Cai each command their own forces, one of these routes has forced the Han court to acknowledge defeat; battles continue raging on other fronts. The counties seized by Yellow Turban soldiers with blood remain in the hands of those who personally captured them."
 hd_yellow_turban.0002.a:0 "A new mandate of heaven has descended."
 hd_yellow_turban.0003.t:0 "The Yellow Heaven has fallen."
 hd_yellow_turban.0003.desc:0 "The last yellow banner fell into the dust. The three uprisings led by Zhang Jiao, Zhang Mancheng, and Bo Cai failed to force the Han court to submit; the commanderies seized by local chieftains reverted with the defeat. The House of Han temporarily preserved its realm, but this turmoil had already torn open fissures in the empire—neither the imperial court nor the provinces would ever return to their former tranquility."
 hd_yellow_turban.0003.a:0 "The chaotic era has only just begun."
 hd_zhuojun_rangers:0 "Zhuo Commandery Righteous Followers"
 hd_zhuojun_rangers_adj:0 "Zhuo Commandery Righteous Followers"
