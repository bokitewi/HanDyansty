l_english:
 HD_UPRISING_WAR_NAME:0 "Uprising War"
 hd_peasant_populist_uprising_war_victory_desc:0 "The uprising has won. Every county still controlled by an attacker is granted to its current occupier when the demands are enforced, while the attacking leader becomes independent from the former liege."
 hd_peasant_populist_uprising_war_white_peace_desc:0 "The two sides make peace. This war transfers no counties."
 hd_peasant_populist_uprising_war_defeat_desc:0 "The uprising has failed. This war grants no counties to the attacking side."
 hd_uprising_war_victory_desc:0 "The uprising has won. The attacking leader is now independent from the former liege."
 hd_yellow_turban_war_victory_desc:0 "This Yellow Turban host enforces its demands. Counties seized during the war remain with the participants who actually occupied them."
 hd_uprising_war_white_peace_desc:0 "The two sides make peace. Titles transferred during the war remain where they are."
 hd_uprising_war_defeat_desc:0 "The uprising has failed. Counties seized by any attacker in this war are returned to the defender."
 hd_yellow_turban.0001.t:0 "The Yellow Heaven Rises"
 hd_yellow_turban.0001.desc:0 "Before dawn, a messenger bursts into the camp with an urgent report from Luoyang. The plan has been exposed, Ma Yuanyi has been seized and executed, and the court is hunting the Taiping Dao. Zhang Mancheng is ready in Nanyang, Bo Cai can rise in Yingchuan, and the regional commanders wait beneath their own yellow banners. If they wait for the appointed day, the three hosts will be destroyed one by one."
 hd_yellow_turban.0001.a:0 "The Azure Heaven is dead; the Yellow Heaven shall rise!"
 hd_yellow_turban.0002.t:0 "The Yellow Heaven Prevails"
 hd_yellow_turban.0002.desc:0 "One Yellow Turban host has broken the Han defenses and forced the court to concede. Zhang Jiao, Zhang Mancheng, and Bo Cai command separate campaigns, so the other fronts continue to fight. Counties taken in blood remain in the hands of the commanders who occupied them."
 hd_yellow_turban.0002.a:0 "A new Mandate has arrived."
 hd_yellow_turban.0003.t:0 "The Yellow Heaven Falls"
 hd_yellow_turban.0003.desc:0 "The last yellow banner falls into the dust. The separate uprisings of Zhang Jiao, Zhang Mancheng, and Bo Cai have all failed to force the Han court to submit. The dynasty survives, but the rebellion has torn open the empire's old foundations."
 hd_yellow_turban.0003.a:0 "The age of disorder has only begun."
 hd_zhuojun_rangers:0 "Righteous Men of Zhuojun"
 hd_zhuojun_rangers_adj:0 "Righteous Men of Zhuojun"
