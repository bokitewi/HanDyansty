l_english:
 HD_UPRISING_WAR_NAME:0 "Uprising War"
 hd_peasant_populist_uprising_war_victory_desc:0 "The rebels prevail. Captured commanderies and counties pass to their occupiers, and the uprising’s leader becomes independent of the former liege."
 hd_peasant_populist_uprising_war_white_peace_desc:0 "Both sides lay down arms. Commanderies and counties retain their former allegiance."
 hd_peasant_populist_uprising_war_defeat_desc:0 "The uprising collapses. The rebels gain nothing, and their leader is taken prisoner."
 hd_uprising_war_victory_desc:0 "The rebels prevail, and their leader becomes independent of the former liege."
 hd_yellow_turban_war_victory_desc:0 "This Yellow Turban army prevails. Commanderies and counties captured during the war remain with their occupiers."
 hd_uprising_war_white_peace_desc:0 "Both sides lay down arms. Commanderies and counties that changed hands during the war remain as they are."
 hd_uprising_war_defeat_desc:0 "The uprising fails. All commanderies and counties seized by the rebels during the war return to their former holders."
 hd_yellow_turban.0001.t:0 "The Azure Heaven Is Dead"
 hd_yellow_turban.0001.desc:0 "An urgent letter arrives from Luoyang. As soon as you unfold it, you see the news of [tang_zhou.GetName]’s betrayal. The plans of all thirty-six divisions have been exposed, and [ma_yuan_yi.GetName] has been arrested and executed. The appointed day has not yet come, but the authorities’ manhunt will not wait.\n\nThe messenger kneels before you, his sleeves caked with mud from the road. You ask how many others know; he only shakes his head. Every day of hesitation may cost you another band of believers willing to raise the yellow banner.\n\nZhang Mancheng is in Nanyang and Bo Cai in Yingchuan. Though the divisions command separate forces, they can still rise together. You press the letter to your desk and order the call to arms sent again. There is no returning to what came before. There is no need to wait until the fifth day of the third month."
 hd_yellow_turban.0001.a:0 "The Azure Heaven is dead; the Yellow Heaven shall rise!"
 hd_yellow_turban.0002.t:0 "The Yellow Turbans Prevail"
 hd_yellow_turban.0002.desc:0 "News of a Yellow Turban victory spreads. The messenger first lists the places taken, then reports that the Han court has admitted defeat on one front. At last he adds that the fighting on the other fronts has yet to end.\n\nThree yellow banners rose separately. One now holds its ground, and the towns its soldiers took remain in the hands of their conquerors. This victory shakes the Han court’s authority, but it cannot sweep away the troubles facing every army and every village.\n\nOutside, people are already speaking of a change in the Mandate. Whether this news brings joy or dread, plans for the days ahead must be made anew."
 hd_yellow_turban.0002.a:0 "The realm will know much turmoil from this day."
 hd_yellow_turban.0003.t:0 "The Yellow Turbans Fall"
 hd_yellow_turban.0003.desc:0 "The final dispatch about the Yellow Turbans arrives: all three great armies have been defeated. Places that once sent urgent pleas now report recovered towns and scattered rebels. At last the messengers dare to speak a little louder.\n\nA victory report may end a war, but abandoned fields and empty homes do not recover the moment its seal is set. The Han court has preserved its standing, and the men who wielded military power in the provinces remember how they once gave orders.\n\nThe Yellow Turban uprising has failed. What remains is the void it has left in the provinces and in the people’s hearts."
 hd_yellow_turban.0003.a:0 "The rebellion is quelled; its wounds remain."
 hd_zhuojun_rangers:0 "Zhuojun Volunteer Cavalry"
 hd_zhuojun_rangers_adj:0 "Zhuojun Volunteer Cavalry"
