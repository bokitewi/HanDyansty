l_english:
 hd_dc_kit_adv_compile_canon_decision:0 "Compile a Great Canon"
 hd_dc_kit_adv_compile_canon_decision_desc:0 "An age of prosperity compiles its canon, to stand as a model for posterity. Open a compilation bureau, summon the venerable scholars of the realm, gather every book, and assemble the great canon of the age."
 hd_dc_kit_adv_compile_canon_decision_tooltip:0 "Open a bureau and compile the great canon of the age"
 hd_dc_kit_adv_compile_canon_decision_confirm:0 "Open the Bureau"
 hd_dc_kit_adv_compile_canon_decision_effect_tt:0 "An edict opens the History Bureau, summoning the most learned courtiers and vassals to take part. After five years the canon is complete; the scholars who worked on it grow in learning, the canon is kept in your Secret Pavilion, and your house's literary tradition flourishes:"
 hd_dc_kit_adv_compile_code_decision:0 "Revise the Statutes"
 hd_dc_kit_adv_compile_code_decision_desc:0 "The penal code is complex and harsh, and clerks exploit it for gain. Order the officials to trim and simplify, revise the statutes of the age, and promulgate them throughout the realm."
 hd_dc_kit_adv_compile_code_decision_tooltip:0 "Trim and simplify, revising the statutes of the age"
 hd_dc_kit_adv_compile_code_decision_confirm:0 "Revise the Statutes"
 hd_dc_kit_adv_compile_code_decision_effect_tt:0 "The officials revise a new code; a year later it is promulgated throughout the realm, and printed as a book kept in your Secret Pavilion:"
 hd_dc_kit_adv_reform_decision:0 "Reform to Strengthen the State"
 hd_dc_kit_adv_reform_decision_desc:0 "Abuses grow deeper by the day, and only change can revive the state. Choose a capable minister to lead new laws, survey the land and equalize taxes and corvee — though the great clans will surely resist."
 hd_dc_kit_adv_reform_decision_tooltip:0 "Survey the land, equalize taxes and corvee"
 hd_dc_kit_adv_reform_decision_confirm:0 "Enact the New Laws"
 hd_dc_kit_adv_reform_decision_effect_tt:0 "The Celestial minister most skilled in finance will lead the new laws. Over the next five years, humble scholars and great clans will struggle without end, and your responses will decide the outcome; if the humble prevail over the clans and the leading minister is a master of finance, the new laws will take hold more easily. The current odds are about #high [ROOT.Char.MakeScope.ScriptValue('hd_dc_kit_adv_reform_chance_value')|0]%#!."
 hd_dc_kit_adv_if_success_tt:0 "If the new laws succeed:"
 hd_dc_kit_adv_if_failure_tt:0 "If the new laws fail:"
 hd_dc_kit_adv_reform_county_tt:0 "Every [county|E] you hold directly"
 hd_dc_kit_adv_compile_cd_tt:0 "Has not compiled a canon or statutes in the last twenty years"
 hd_dc_kit_adv_compiling_tt:0 "The History Bureau has no unfinished work"
 hd_dc_kit_adv_reform_once_tt:0 "You have not yet enacted a reform"
 hd_dc_kit_adv_code_modifier:0 "Statutes Promulgated"
 hd_dc_kit_adv_code_modifier_desc:0 "The new code is concise, administration is clean, and orders are carried out swiftly."
 hd_dc_kit_adv_reform_modifier:0 "Fruits of the New Laws"
 hd_dc_kit_adv_reform_modifier_desc:0 "The new laws have succeeded: taxes and corvee are fair, and the treasury is full."
 hd_dc_kit_adv_reform_failed_modifier:0 "New Laws Thwarted"
 hd_dc_kit_adv_reform_failed_modifier_desc:0 "The reform failed on the verge of success, and court and country alike are disappointed."
 hd_dc_kit_adv_canon_culture_modifier:0 "The Canon Spreads"
 hd_dc_kit_adv_canon_culture_modifier_desc:0 "The imperial canon is promulgated throughout the realm, and scholars vie to copy it."
 hd_dc_kit_adv_taixue_student_modifier:0 "Flourishing Academy"
 hd_dc_kit_adv_taixue_student_modifier_desc:0 "In an age of letters, the Imperial Academy rings with recitation and its students advance daily."
 hd_dc_kit_adv_gathering_opinion:0 "Literary Gathering"
 hd_dc_kit_adv_compile_opinion:0 "Compiled the Canon"
 hd_dc_kit_adv_reform_angered_opinion:0 "Forced the New Laws"
 hd_dc_kit_adv_reform_promoted_opinion:0 "Promoted the New Laws"
 hd_dc_kit_adv_poem_praised_opinion:0 "Kindred Poets"
 hd_dc_kit_adv_poem_mocked_opinion:0 "Publicly Mocked"
 hd_dc_kit_adv_qingyi_heeded_opinion:0 "Heeds Remonstrance"
 hd_dc_kit_adv_qingyi_suppressed_opinion:0 "Silenced Pure Criticism"
 hd_dc_kit_adv_recommend_opinion:0 "Recommended the Worthy"
 hd_party_hostile_half_opinion:0 "Factional Rivalry (Eased by Prosperity)"
 hd_party_hostile_double_opinion:0 "Factional Rivalry (Factional Strife)"
 hd_party_coop_double_opinion:0 "Factional Cooperation (Prosperous Harmony)"
 hd_dc_adv_canon_book_name:0 "Imperial Canon"
 hd_dc_adv_canon_book_desc:0 "The great canon of a prosperous age, gathering the classics, histories, masters and collected works in countless scrolls, revered by scholars of later generations."
 hd_dc_adv_code_book_name:0 "Imperial Statutes"
 hd_dc_adv_code_book_desc:0 "The revised and promulgated statutes of the age, concise in their articles and exact in their penalties, the foundation of law for all the realm."
 hd_dc_adv.0001.t:0 "The Bureau Opens"
 hd_dc_adv.0001.desc:0 "The edict issued, the History Bureau throws open its doors. Books from every corner of the realm pour into the capital, and venerable scholars sort and arrange them, collating errors.\n\nThis will be a great undertaking lasting years."
 hd_dc_adv.0001.a:0 "Let it be exacting, to stand for posterity."
 hd_dc_adv.0001.a.tt:0 "The canon will take about five years to complete."
 hd_dc_adv.0002.t:0 "Old Text versus New Text"
 hd_dc_adv.0002.desc:0 "When the canon reaches the classics section, the scholars of the bureau deadlock over whether to follow the Old Text or the New Text. The Old Text partisans come mostly from old great clans, the New Text advocates mostly from humble newcomers; each holds to its view, and the manuscript stalls."
 hd_dc_adv.0002.a:0 "Follow the Old Text, preserving the ways of the ancient kings."
 hd_dc_adv.0002.b:0 "Adopt the New Text, for use in the present age."
 hd_dc_adv.0002.c:0 "Draw on all views, favoring none."
 hd_dc_adv.0003.t:0 "The Canon Completed"
 hd_dc_adv.0003.desc:0 "After five years, the canon is at last complete. The chief compiler leads the scholars to present it in the hall, its scrolls piled high upon the vermilion steps.\n\nFrom this day on, all scholars of the realm will take this work as their authority."
 hd_dc_adv.0003.a:0 "Store it in the Secret Pavilion, and distribute copies throughout the realm."
 hd_dc_adv.0011.t:0 "Statutes Promulgated"
 hd_dc_adv.0011.desc:0 "The new code has been revised, concise in its articles and exact in its penalties. The officials have it printed as a book and promulgated to the commanderies and counties."
 hd_dc_adv.0011.a:0 "From now on, the new code alone shall govern."
 hd_dc_adv.0021.t:0 "Enact the New Laws"
 hd_dc_adv.0021.desc:0 "The reform edict is issued, and court and country are shaken. [hd_dc_adv_reform_minister_scope.GetShortUIName] is charged with leading the new laws, and the ordinances for surveying land and equalizing taxes and corvee are rolled out one by one.\n\nHumble scholars applaud, but the great clans conspire in secret. Whether it succeeds within five years, no one can yet say."
 hd_dc_adv.0021.desc_nominister:0 "The reform edict is issued, and court and country are shaken. Yet there is no Celestial minister at court able to lead the new laws, so the Son of Heaven must oversee them personally. The ordinances for surveying land and equalizing taxes and corvee are rolled out one by one, while the great clans conspire in secret. Whether it succeeds within five years, no one can yet say."
 hd_dc_adv.0021.a:0 "My mind is made up."
 hd_dc_adv.0021.a.tt:0 "In five years, the fate of the new laws will be clear. The current odds are about #high [ROOT.Char.MakeScope.ScriptValue('hd_dc_kit_adv_reform_chance_value')|0]%#!."
 hd_dc_adv.0022.t:0 "The Clans Resist"
 hd_dc_adv.0022.desc:0 "The land survey strikes at the very roots of the great clans. Local magnates hide their estates and obstruct the surveyors, while clan partisans at court submit memorial after memorial, claiming the new laws harass the people."
 hd_dc_adv.0022.a:0 "Act swiftly and sternly; any who obstruct the new laws will be punished without mercy."
 hd_dc_adv.0022.b:0 "Show some leniency and seek results gradually."
 hd_dc_adv.0023.t:0 "Rise of the Humble"
 hd_dc_adv.0023.desc:0 "After several years of the new laws, a cadre of capable officials of humble birth, well versed in the new laws, has emerged across the realm. The leading minister petitions that they be promoted beyond the usual rank, to staff the reform."
 hd_dc_adv.0023.a:0 "Promote them beyond the usual rank."
 hd_dc_adv.0023.b:0 "Promotion should still follow seniority."
 hd_dc_adv.0023.c:0 "Send the leading minister to tour the commanderies and oversee the new laws."
 hd_dc_adv.0024.t:0 "The Fate of the New Laws"
 hd_dc_adv.0024.desc_success:0 "Five years have passed, and the new laws have finally taken root. The land survey is complete, hidden households have registered en masse, and the treasury fills by the day. The great clans grumble, but they are powerless to turn back the tide."
 hd_dc_adv.0024.desc_failure:0 "Five years have passed, and the new laws have ultimately failed to take hold. The magnates comply in word but defy in deed, local officials shirk their duties, and the new laws exist in name only. Court and country are filled with disappointment."
 hd_dc_adv.0024.a:0 "So be it."
 hd_dc_adv.0024.a_success:0 "The new laws are in place; guard them well."
 hd_dc_adv_reform_chance_up_tt:0 "The new laws grow more likely to succeed"
 hd_dc_adv_reform_chance_down_tt:0 "The new laws grow harder still"
 hd_dc_adv.0101.t:0 "Flowing Water and Floating Cups"
 hd_dc_adv.0101.desc:0 "During a pause in the debate, the company moves to the rear garden, where water is channeled into a stream and winged cups float down the current; whoever the cup stops before must compose a poem on the spot.\n\nThe cup drifts and turns, and comes to rest right in front of you."
 hd_dc_adv.0101.a:0 "Drain the cup and write a poem in an instant."
 hd_dc_adv.0101.b:0 "Yield the fine verse to [hd_dc_adv_guest.GetShortUIName]."
 hd_dc_adv.0102.t:0 "Pure Conversation on the Mysteries"
 hd_dc_adv.0102.desc:0 "[hd_dc_adv_guest.GetShortUIName] holds forth with a whisk of deer tail, from the debate on being and non-being to the distinction between words and meaning, and all present listen intently. Then the discussion turns, and every eye falls upon you."
 hd_dc_adv.0102.a:0 "Bring Confucianism into the Mysteries, and refute with the teachings of propriety."
 hd_dc_adv.0102.b:0 "Follow where it leads, and discuss being and non-being together."
 hd_dc_adv.0103.t:0 "Poetry Duel"
 hd_dc_adv.0103.desc:0 "You have just finished reciting a poem when [hd_dc_adv_guest.GetShortUIName] claps and sneers, declaring the verse feeble and nothing but borrowed words. The banquet falls silent."
 hd_dc_adv.0103.a:0 "Retort in kind."
 hd_dc_adv.0103.b:0 "Laugh it off."
 hd_dc_adv.0104.t:0 "Writing on the Wall"
 hd_dc_adv.0104.desc:0 "The whitewashed walls of the hall are already covered with verses by those who came before, the ink of varying age. The host brings brush and ink and invites each guest to leave a poem."
 hd_dc_adv.0104.a:0 "Wield the brush and write upon the wall."
 hd_dc_adv.0104.b:0 "Read carefully the verses of those before."
 hd_dc_adv.0201.t:0 "An Academy Student Enters Office"
 hd_dc_adv.0201.desc:0 "In the Imperial Academy examinations, [hd_dc_adv_student.GetShortUIName] places among the top, and their literary fame spreads through the capital. The Erudites recommend them one after another, saying this one is fit for great things."
 hd_dc_adv.0201.a:0 "Appoint them as a staff officer."
 hd_dc_adv.0201.b:0 "Recommend them to the Son of Heaven."
 hd_dc_adv.0202.t:0 "Pure Criticism at the Academy"
 hd_dc_adv.0202.desc:0 "The students of the Imperial Academy gather in the lecture hall, appraising the high ministers and debating court affairs in fiery terms. Someone has copied their discussions onto placards, which are already circulating in the city."
 hd_dc_adv.0202.a:0 "Pure Criticism is the voice of public opinion; heed their frank words."
 hd_dc_adv.0202.b:0 "Students presume to criticize the court; this must be banned."
