l_english:
 # Southern Migration of the Gentry - core logic (module A2): notice events 0001-0004, 0011-0014, toasts, ending decisions and tooltips

 ############################
 # Ending decisions
 ############################
 hd_yiguan_ending_guangfu_decision:0 "Restoration of the Central Plains"
 hd_yiguan_ending_guangfu_decision_desc:0 "The royal army marches north, and the old capitals are within sight. Most of the eight northern provinces have returned to the realm, and Han banners fly once more above the palaces of Luoyang and Chang'an. Only by proclaiming to all under Heaven that the Central Plains are restored can we console the gentry and common folk who have wandered homeless since the migration south."
 hd_yiguan_ending_guangfu_decision_tooltip:0 "Proclaim the restoration of the Central Plains, ending the Southern Migration of the Gentry"
 hd_yiguan_ending_guangfu_decision_confirm:0 "The old capital shines again!"
 hd_yiguan_ending_heliu_decision:0 "Fusion of Hu and Han"
 hd_yiguan_ending_heliu_decision_desc:0 "The northern dynasties have long since changed their dress and adopted Han institutions; Hu and Han stand side by side at court and intermarry in the villages. The sharp line drawn at the time of the migration south has blurred beyond recognition. Let the mightiest Sinicized Regime of the north proclaim to all under Heaven: henceforth, no one shall be judged as Hu or Han."
 hd_yiguan_ending_heliu_decision_tooltip:0 "Proclaim the fusion of Hu and Han, ending the Southern Migration of the Gentry"
 hd_yiguan_ending_heliu_decision_confirm:0 "Where rites and music dwell, there is Huaxia."
 hd_yiguan_ending_lunsang_decision:0 "Fall of the Gentry"
 hd_yiguan_ending_lunsang_decision_desc:0 "Both capitals are in our grasp, the northern provinces submit at our approach, and the petty court of Jiangzuo no longer has the strength to look north. The time has come to proclaim to the four quarters: the Central Plains have a new master."
 hd_yiguan_ending_lunsang_decision_tooltip:0 "Proclaim mastery of the Central Plains, ending the Southern Migration of the Gentry"
 hd_yiguan_ending_lunsang_decision_confirm:0 "The realm is settled!"

 # Ending condition tooltips
 hd_yiguan_end_phase_taowang_tt:0 "The Southern Migration of the Gentry must be in its #high Flight#! phase"
 hd_yiguan_end_phase_chongtu_tt:0 "The Southern Migration of the Gentry must be in its #high Conflict#! phase"
 hd_yiguan_end_phase_tingzhi_tt:0 "The Southern Migration of the Gentry must be in its #high Stalemate#! phase"
 hd_yiguan_end_kingdom_tt:0 "You must hold a landed title of #high kingdom tier#! or higher"
 hd_yiguan_end_guangfu_capital_tt:0 "Your realm (including vassals) must hold #high Luoyang#! or #high Chang'an#!"
 hd_yiguan_end_guangfu_share_tt:0 "Your realm (including vassals) must hold at least #Z [SCOPE.ScriptValue('hd_yiguan_end_guangfu_pct_value')|0]%#! of the counties in the eight northern provinces (currently: #Z [SCOPE.ScriptValue('hd_yiguan_realm_north_pct_value')|0]%#!)"
 hd_yiguan_end_heliu_share_tt:0 "All Sinicized Regimes combined must hold at least #Z [SCOPE.ScriptValue('hd_yiguan_end_heliu_pct_value')|0]%#! of the counties in the eight northern provinces (currently: #Z [SCOPE.ScriptValue('hd_yiguan_north_sin_pct_value')|0]%#!)"
 hd_yiguan_end_heliu_largest_tt:0 "You must be the Sinicized Regime holding the most counties in the north (your realm currently holds #Z [SCOPE.ScriptValue('hd_yiguan_realm_north_counties_value')|0]#! northern counties)"
 hd_yiguan_end_lunsang_capitals_tt:0 "Your realm (including vassals) must hold both #high Luoyang#! and #high Chang'an#!"
 hd_yiguan_end_lunsang_share_tt:0 "Your realm (including vassals) must hold at least #Z [SCOPE.ScriptValue('hd_yiguan_end_lunsang_pct_value')|0]%#! of the counties in the eight northern provinces (currently: #Z [SCOPE.ScriptValue('hd_yiguan_realm_north_pct_value')|0]%#!)"
 hd_yiguan_end_lunsang_han_tt:0 "Counties in the eight northern provinces held by Han rulers must be fewer than #Z [SCOPE.ScriptValue('hd_yiguan_end_lunsang_han_max_pct_value')|0]%#! (currently: #Z [SCOPE.ScriptValue('hd_yiguan_north_han_pct_value')|0]%#!)"

 # Ending effect tooltips
 hd_yiguan_ending_guangfu_effect_tt:0 "The Southern Migration of the Gentry ends here:\n • All counties of Huaxia culture in the eight northern provinces gain #high Royal Army Pacifies the North#! (15 years)\n • All other Southern Regimes and the Northern Han gain #high Royal Army Pacifies the North#! (20 years)\n • All #high Occupied#! penalties on northern counties are removed\n • For the next 20 years, whoever holds [GetTitleByKey('h_china').GetName] and directly controls Luoyang or Chang'an may take the decision #high Return to the Old Capital#!"
 hd_yiguan_ending_heliu_effect_tt:0 "The Southern Migration of the Gentry ends here:\n • All Sinicized Regimes gain #high Fusion of Hu and Han#! (50 years)\n • Your culture and every Huaxia culture currently present in the eight northern provinces gain #P +50#! cultural acceptance with each other\n • All #high Occupied#! penalties on northern counties are removed"
 hd_yiguan_ending_lunsang_effect_tt:0 "The Southern Migration of the Gentry ends here:\n • Other Hu Regimes gain a halved #high Master of the Central Plains#! (20 years)\n • Southern Regimes gain #high Content in Jiangzuo#! (50 years)\n • The #high Occupied#! penalty on northern counties becomes #high Scars of Occupation#!, which fades after 30 years\n • The de jure empires of Yu-Yan-Qing-Xu, You-Ji and Bing break away from the Han hegemony and pass to #high the Northern Realm#!"
 hd_yiguan_heliu_acceptance_desc:0 "Fusion of Hu and Han"

 # Nickname (for the one who proclaims the Restoration of the Central Plains)
 nick_hd_yiguan_zhongxing:0 "the Restorer"
 nick_hd_yiguan_zhongxing_desc:0 "After the Central Plains fell to the Hu dust and the gentry fled south, #EMP [Select_CString(CHARACTER.IsLocalPlayer, 'you', Select_CString(CHARACTER.IsFemale, 'she', 'he' ))]#! led the royal army to retake the old lands and restore the dynasty to its glory."

 # Notice option tooltip
 hd_yiguan_notice_phase_tt:0 "Open the Southern Migration of the Gentry situation window to see each group's effects in this phase, the available decisions, and the progress toward each outcome."

 ############################
 # Toasts (non-participant players)
 ############################
 hd_yiguan_toast_start:0 "The north has fallen to the Hu, and the gentry flee south in droves."
 hd_yiguan_toast_taowang:0 "Hu horsemen rage once more, and the people of the north flee south again. The Southern Migration of the Gentry returns to its Flight phase."
 hd_yiguan_toast_chongtu:0 "North and South take up arms; the Southern Migration of the Gentry enters its Conflict phase."
 hd_yiguan_toast_tingzhi:0 "North and South now stand opposed across the river; the Southern Migration of the Gentry enters its Stalemate phase."
 hd_yiguan_toast_restored:0 "The royal army has recovered the Central Plains; the Southern Migration of the Gentry is at an end."
 hd_yiguan_toast_sinicized:0 "The northern dynasties have all adopted Han institutions, and Hu and Han are becoming one; the Southern Migration of the Gentry is at an end."
 hd_yiguan_toast_lost:0 "The Central Plains have fallen wholly to the Hu, and Jiangzuo clings to its corner of the realm; the Southern Migration of the Gentry is at an end."
 hd_yiguan_toast_fallback_guangfu:0 "Two hundred years after the migration south, most of the north has returned to Han hands; the Southern Migration of the Gentry ends in the Restoration of the Central Plains."
 hd_yiguan_toast_fallback_heliu:0 "Two hundred years after the migration south, the north belongs wholly to Sinicized dynasties; the Southern Migration of the Gentry ends in the Fusion of Hu and Han."
 hd_yiguan_toast_fallback_lunsang:0 "Two hundred years after the migration south, the north has at last become the domain of the Hu; the Southern Migration of the Gentry ends in the Fall of the Gentry."

 ############################
 # 0001 Opening
 ############################
 hd_yiguan.0001.t:0 "Southern Migration of the Gentry"
 hd_yiguan.0001.desc:0 "By the time the messenger described the ferry landing, his voice was hoarse: cart wheels sank in the mud, those carrying children could not push through to the boats, and even gentry who once would not share a mat with others now fought for a place to stand. I told him to catch his breath, but he only asked, anxiously, where the people behind him could still go.\n\nOne after another, the letters from the north have fallen silent, and rumors multiply of cities changing hands and villages scattered. Some travel south clutching their genealogies; others stay behind to guard their wubao. The names of the same hometowns now appear on pleas for help written a thousand li apart.\n\nI listen to the reports that still have not ceased outside my door. Whatever one makes of this upheaval, what lies ahead is no longer merely a few cities flying new banners."
 hd_yiguan.0001.a:0 "Whither goes the realm?"
 hd_yiguan.0001.desc_north:0 "The news of victory arrived at night. The messenger knelt before my tent and reeled off the names of several cities in one breath, and only at the end did he say: Luoyang and Chang'an are both taken. My generals erupted in congratulations; someone spread the treasures carried out of the palace across the floor and asked which band should receive them.\n\nNews from the south trickled in as well. The Han nobles and gentry, leading old and young, were racing to cross the Yangtze and the Huai, and many wubao now stood empty; some magnates had barred their gates and sent men to sound out my intentions. Taking cities is not hard. But who will till these abandoned fields, and to whom will the scattered households pay their taxes? For now, no one can say.\n\nI had the maps spread out. These Central Plains I once knew only from the tales of old men; now they lie beneath our horses' hooves. Holding them firmly is the true challenge."
 hd_yiguan.0001.b:0 "The Central Plains lie beneath our hooves."

 ############################
 # 0002 Return to Flight
 ############################
 hd_yiguan.0002.t:0 "The Hu Dust Rises Again"
 hd_yiguan.0002.desc:0 "Another band of refugees, leading old and young, has arrived outside the walls. Asked where they came from, they all name places recovered only a few years ago and now lost again. Some carry freshly copied household registers on their backs; some have saved nothing but a bundle of ancestral tablets. They do not weep; they only ask, again and again, which ferry still has boats.\n\nNews from the north grows more urgent by the day: cities change hands, their commanders slain or surrendered, and Hu scouts already roam north of the Huai. The plans of recent years, to return to the old homeland and reopen its fields, have turned to empty words overnight, and many families must pack their belongings once more.\n\nI ordered more gruel kitchens set up by the city gates. Once again the people flood toward the river, and this time no one can say how far they may yet have to retreat."
 hd_yiguan.0002.a:0 "Hold fast along the Yangtze and the Huai."
 hd_yiguan.0002.desc_north:0 "The cities we lost in years past have been retaken this year, one after another. The southern garrisons surrendered or fled, and the captives say that when the townsfolk heard our war drums, they fled south with household registers on their backs and ancestral tablets in their arms.\n\nMy generals ask leave to press the advantage: some urge a drive straight into the lands north of the Huai, others counsel me to first pacify the newly won commanderies. All that the southerners built here these past years, reopening the fields and gathering in the displaced, has come to nothing in an instant.\n\nI stand on the city wall and gaze down the road leading south, where the crowds stretch on beyond sight. The land has come back to us, but its people have left once more."
 hd_yiguan.0002.b:0 "Press on and take the lands north of the Huai."

 ############################
 # 0003 Entering Conflict
 ############################
 hd_yiguan.0003.t:0 "North and South at War"
 hd_yiguan.0003.desc:0 "The drums on the drill ground beat faster than in years past. Most of the new recruits speak with northern accents, and when asked why they enlisted, they all give the same answer: my home is in Hebei, and I want to go back and see it. The generals crowd around the maps arguing red-faced, some insisting on taking the lands north of the Huai first, others on marching straight for Luoyang.\n\nThe Hu lords of the north have not been idle either. The border forts send one urgent alarm after another; magnates in their wubao pay tribute to the Hu court while secretly sending men south to make contact; and the sons of the émigré clans, who have lived for years under other men's roofs, have begun selling off their lands and houses to raise private retainers.\n\nAs I leaf through the military dispatches, I know the days of peace are over. From now on, the land between the Yangtze and the Huai is not merely a border but a front line."
 hd_yiguan.0003.a:0 "We sleep on our spears and wait for dawn."
 hd_yiguan.0003.desc_north:0 "Spies in the south report that recruiting has begun again between the Yangtze and the Huai. The camps are full of refugee sons with northern accents who drill day and night and talk of nothing but fighting their way home. The border forts send one urgent alarm after another, and several wubao that openly pay me tribute are secretly exchanging letters with the southerners.\n\nThe court is abuzz with debate. Some urge a pre-emptive strike across the Huai to sweep the enemy away; others fear the Han within our borders will rise in answer, and counsel me first to tighten the defenses of every commandery. I hear that the gentry sons who fled south years ago are also selling their lands and houses to raise private retainers.\n\nI read the border reports to the last. This frontier will know no more peace; rather than wait for them to strike, better to prepare early."

 ############################
 # 0004 Entering Stalemate
 ############################
 hd_yiguan.0004.t:0 "North and South at a Standoff"
 hd_yiguan.0004.desc:0 "A guest pointed to the Huai on the map and spoke of a certain ferry, still able to call the villages along its banks by their old names; yet my young attendant had to lean in close to see where the place actually lay. The upheaval has dragged on so long that the same river now lies at such different distances in different hearts.\n\nThe south farms its military colonies and stores grain; the north pacifies its commanderies. The news passing between them has gradually turned from attack and defense to border markets, envoys, and marriage proposals. Some say the recovery will never come, others that this is just the time to rest; their words are opposite, yet both must admit that neither side can swallow the other.\n\nI hear the guest speak once more of a homecoming that never came to pass. No one can promise him whether the border before us will ever change; but North and South each holding its own half must now be dealt with as the reality of the day."
 hd_yiguan.0004.a:0 "There is time yet."

 ############################
 # 0011 Restoration of the Central Plains
 ############################
 hd_yiguan.0011.t:0 "The Central Plains Restored"
 hd_yiguan.0011.desc_ender:0 "The edict of #high [hd_yiguan_ender.GetTitledFirstName]#! spreads through North and South: the royal army has recovered the Central Plains, and the Southern Migration of the Gentry has come to an end.\n\n"
 hd_yiguan.0011.desc:0 "When the reading of the victory dispatch reached the old capital, an old man beside me suddenly asked to hear it again. He did not ask how many enemies had been slain, but whether the roads to his old home were open now; once answered, he lowered his head, wiped his eyes, and said nothing for a long while.\n\nThe royal army holds the lands of the Central Plains once more, and the matter that has weighed on so many hearts since the migration south has at last been settled. Yet I still hear people asking after land deeds, ancestral graves, and lost kin: cities can be recovered, but not all who left back then can return to what they were.\n\nThe news spread quickly, and those who heard it felt both joy and sorrow. I put the war reports away, thinking of the younger generation who know the north only from what their families have told them: for them, the names of these old homelands are at last more than places in a story."
 hd_yiguan.0011.a:0 "The old capital shines again!"
 hd_yiguan.0011.desc_north:0 "When news came that the Han army had entered the city, no one in the hall spoke for a long time. Several old ministers still remembered the splendor of the day we first became masters of the Central Plains; now they must debate where to retreat and how many troops to leave behind as a rearguard.\n\nSome of the Han townsfolk stay behind closed doors; others already burn incense at the street corners to welcome the royal army. My people pack their carts and tents and each seek their own way north. The palaces we built and the laws we laid down over those years will soon fly someone else's banner.\n\nI took one last look at this city. When we took it, I thought it could be passed down to my sons and grandsons; only now do I understand that holding a land is far harder than seizing it."
 hd_yiguan.0011.b:0 "Fall back to our old lands and await another day."

 ############################
 # 0012 Fusion of Hu and Han
 ############################
 hd_yiguan.0012.t:0 "Fusion of Hu and Han"
 hd_yiguan.0012.desc_ender:0 "#high [hd_yiguan_ender.GetTitledFirstName]#! proclaims to all under Heaven: Hu and Han are one, sharing the same rites and customs. The Southern Migration of the Gentry has come to a close.\n\n"
 hd_yiguan.0012.desc:0 "As we spoke of the new policies in the north, the guest brought out a letter and asked me to look at its forms of address and its signature. Many matters, he said, must now be handled according to the rites of the Central Plains, and the line that once divided Hu from Han is no longer as clear as before. Some around us nodded; others still refused to believe it.\n\nI read it line by line, in no hurry to pass judgment on anyone. A change of dress, language, and statutes can be written into edicts; whether neighbors will draw close and old grudges be laid to rest depends on how people treat one another in the days to come. Still, to describe the north as wholly what it once was would plainly be untrue as well.\n\nThe guest awaited my reply. I folded the letter as it had been: the question left by this migration south now has an answer other than the sword."
 hd_yiguan.0012.a:0 "Where rites and music dwell, there is Huaxia."

 ############################
 # 0013 Fall of the Gentry
 ############################
 hd_yiguan.0013.t:0 "The Central Plains Lost"
 hd_yiguan.0013.desc_ender:0 "#high [hd_yiguan_ender.GetTitledFirstName]#! has seized both capitals and taken every province of the north, proclaiming to the four quarters: the Central Plains have a new master.\n\n"
 hd_yiguan.0013.desc:0 "When word came that the last northern stronghold had fallen, those who had been arguing over relief forces slowly fell silent. A guest who knew the roads of that country asked a few questions, then asked no more, and simply rolled up the old map he had brought.\n\nFor years, many had pinned their hopes of holding out, of flight, and of rising in arms on that place; now that every town is lost, one can no longer even point to a foothold for any talk of relief. Those arriving from Jiangzuo still argue over whether to march again, but gazing north across the Yangtze and the Huai, they must admit that the balance of arms has changed.\n\nI looked at the rolled-up map. It has not lost a single road or village name for all this; yet from now on, anyone who still speaks of going home must first explain how they mean to cross the many passes that now stand in between."
 hd_yiguan.0013.a:0 "The Divine Land has sunk; what can be done?"
 hd_yiguan.0013.desc_victor:0 "The last Han stronghold holding out behind its walls has opened its gates in surrender, and the news of victory has spread through all the tribes. The soldiers drink and sing in camp; someone brought me the seals and ribbons of the old dynasty they had captured and asked what should be done with them.\n\nThe southern court holds only its corner of Jiangzuo and no longer has the strength to look north. The magnates and wubao lords of the northern provinces send their sons to court one after another, ready to pay tribute and call themselves vassals; the gentry who would not bow have long since crossed the river. From Hebei to Guanzhong, no one remains who can contest this land with us.\n\nI had the seals stored in the treasury. The Central Plains have changed masters more than once since ancient times; how the historians will write of us depends on how we govern this realm."
 hd_yiguan.0013.b:0 "The Mandate is ours!"

 ############################
 # 0014 The Verdict of Two Centuries (fallback)
 ############################
 hd_yiguan.0014.t:0 "The Verdict of Two Centuries"
 hd_yiguan.0014.desc_guangfu:0 "Two hundred years have passed since the migration south. Those who fled across the river in haste are long dead, but generation after generation their descendants fought their way back: Huaibei, Henan, Guanzhong, the old commanderies and counties entered one by one into the Han registers again.\n\nNo single ruler can claim all the credit for this restoration. It is the fruit of many northern expeditions, many wubao, and many émigré clans, each taking up where the last left off; only when the historians looked back to take stock did they find that most of the north had long since returned to Han hands.\n\nI listened as the household counts from every region were read out, and thought of the northern genealogy my forebears left behind. The names of the old homeland can at last be written into the gazetteers of our own day."
 hd_yiguan.0014.desc_heliu:0 "Two hundred years have passed since the migration south. The northern dynasties have changed their dress and revised their rites and laws; the Hu sons who enter office study the same classics, and village marriages have long since ceased to ask about lineage.\n\nNo edict ever proclaimed this fusion; it was only that, year after year, the old line faded of its own accord. By the time anyone thought to ask what divided Hu from Han, it had become hard to say.\n\nI look at the state letter presented by the envoy from the north: its language is elegant, no different from that of Jiangzuo. The question left by this migration south has, in the end, been answered by the years."
 hd_yiguan.0014.desc_lunsang:0 "Two hundred years have passed since the migration south. The cities of the north have changed masters several times over, yet never returned to Han hands; when the people of Jiangzuo speak of the Central Plains, it is now in the tone of a distant tale.\n\nFewer and fewer proclamations for a northern expedition are written. The names of the émigré provinces still hang over southern commanderies, but no one truly believes they can return home by them anymore. The young were born and raised in Jiangnan, and all they know of the north is a few lines in books.\n\nListening to the talk at the table of harvests and canal transport, I understand that these are now two separate realms. The migration south has long ceased to be a temporary refuge; it is the settled home of generation after generation."
 hd_yiguan.0014.desc_guangfu_north:0 "Two hundred years have passed since the migration south. The commanderies our forefathers conquered have been taken back by the Han one by one: some lost in defeat, others surrendered when the townsfolk opened the gates. Today, most of the north has been entered once more into the Han registers.\n\nThe elders of the clan still tell of the days when we first became masters of the Central Plains, but to the young it sounds distant. Some of our people have returned to the old northern lands; others remained in the Central Plains and have gradually learned to farm and to read.\n\nI look at the Han histories the envoy brought back, recording the rise and fall of the many Hu. The story of these two hundred years will, in the end, be written by others."
 hd_yiguan.0014.desc_heliu_north:0 "Two hundred years have passed since the migration south. The forefathers who first became masters of the Central Plains spoke another tongue and wore other garments; now the edicts of the northern court and the classics of its academies are no different from those of Jiangzuo.\n\nMarriage between Hu and Han has long been commonplace; the sons of our clan study the same classics and write in the same style. Now and then someone thinks to tell apart who is Hu and who is Han, only to find it hard to say.\n\nI leaf through the newly compiled code of rites. The line left by the migration south was never erased by the sword, yet it has faded of its own accord with the years."
 hd_yiguan.0014.desc_lunsang_north:0 "Two hundred years have passed since the migration south. The Central Plains our forefathers conquered have been handed down through several generations. The southerners still hold Jiangzuo, and the names of émigré provinces still hang over their commanderies, but their proclamations for a northern expedition grow ever fewer.\n\nThe sons of our clan were born and raised in the Central Plains; when they speak of their grandfathers' old lands, it sounds like a distant tale. The Han magnates of the wubao long ago paid tribute as vassals, and now marry with us and serve at the same court.\n\nListening to the talk at the table of harvests and canal transport, I understand that these are now two separate realms. This land has become the place where our descendants make their home."
 hd_yiguan.0014.a:0 "The rise and fall of ages, all left to the historian's brush."
