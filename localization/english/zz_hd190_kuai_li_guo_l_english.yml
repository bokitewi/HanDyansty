l_english:
 # 2026-10-25：190 历史事件新增——蒯越献策平定江南（hd190.0002~0005）、李傕郭汜相攻（hd190.0006~0007）
 hd190.0002.t:0 "Kuai Yue's Counsel"
 hd190.0002.desc:0 "In the first year of Chuping you were appointed Inspector of Jingzhou by imperial edict. The clan bandits south of the Yangtze are at their height: Su Dai has made himself Administrator of Changsha and Bei Yu, Chief of Huarong, holds his troops against all comers; the Jiangxia bandits Zhang Hu and Chen Sheng have seized the city of Xiangyang with their followers. Yuan Shu, camped at Luyang, blocks the roads, and no inspector can reach his seat.\n\nYou rode alone into Yicheng and called on Kuai Liang and Kuai Yue, notables of Nan Commandery, to plan with you. Kuai Yue said: \"Those who govern in peace put benevolence first; those who govern in chaos put stratagem first. The bandit chiefs are mostly greedy and cruel, hated by their own men. I have people I have long cultivated; let them be shown profit, and the chiefs will surely come with their followers. Put the lawless to death, take in and use the rest, and the whole province will be glad to live under you. With troops gathered and the people won, hold Jiangling in the south and Xiangyang in the north, and the eight commanderies of Jingzhou can be settled by proclamation alone.\""
 hd190.0002.a:0 "We follow Yidu's plan."
 hd190.0002.a.tt:0 "Half a year from now, the bandit chiefs of the south will answer the summons and be executed at the banquet, and Zhang Hu and Chen Sheng will surrender and join your staff. Changsha, Nanping, Xiangyang and Nanxiang will all come under your direct rule, and you will move your seat to Xiangyang."
 hd190.0002.b:0 "The bandits can wait."
 hd190.0002.b.tt:0 "Kuai Yue's plan is set aside; the southern chiefs will have to be put down by arms some other day."
 hd190.0003.t:0 "The Banquet at Yicheng"
 hd190.0003.desc:0 "An envoy arrives from Liu Biao bearing a letter. Jingzhou is newly settled, it says, and he would plan great affairs together with the strong men of the commanderies; he invites you to a banquet at Yicheng and promises office and rank. The envoy adds that dozens of chiefs from south of the river have already set out.\n\nOne of your men leans close and speaks quietly: Liu Jingsheng rode into Jingzhou alone with hardly a soldier to his name. Why would he treat bandit chiefs so generously?"
 hd190.0003.a:0 "Attend the banquet."
 hd190.0003.b:0 "Plead illness and stay away."
 hd190.0003.b.tt:0 "Liu Biao will march against you."
 hd190.0004.t:0 "Riding Alone to Parley"
 hd190.0004.desc:0 "Kuai Yue and Pang Ji ride up to your camp alone, without a single soldier, and ask to see you. Kuai Yue lays out the situation plainly: every southern chief who answered the banquet summons has been put to death, Lord Liu's troops are gathered and the people have come over to him, and what you hold is a lone city that could fall any day. Lay down your arms and surrender, and you will keep your life and a place on his staff."
 hd190.0004.a:0 "Lay down arms and surrender."
 hd190.0004.b:0 "Hold the city to the last."
 hd190.0004.b.tt:0 "Liu Biao will march against you."
 hd190.0005.t:0 "The South Is Pacified"
 hd190.0005.desc:0 "Following Kuai Yue's plan, you sent invitations to every bandit chief south of the river to feast at Yicheng. Those who came were all put to death at the table, and their followers passed into your service. Kuai Yue and Pang Ji then rode alone to Xiangyang, and Zhang Hu and Chen Sheng surrendered one after the other.\n\nAll who answered the summons are subdued; any who refused to come can only be met with troops. The eight commanderies of Jingzhou can now be settled by proclamation."
 hd190.0005.a:0 "Yidu's scheme was worth a hundred thousand men."
 hd190.0006.t:0 "Li Jue and Guo Si at War"
 hd190.0006.desc_fan:0 "In the spring of the second year of Xingping, you had Hu Feng seize and kill Fan Chou where he sat, and from then on every general harbored fear and suspicion. Guo Si often came to feast with you and sometimes stayed the night. His wife, afraid you would win his affections with your maids and concubines, slipped fermented beans into the food you sent him and showed it to him as poison, saying that one roost cannot hold two cocks. Later you invited Guo Si to drink again; he went home dead drunk, suspected poison, and only recovered after drinking dung water.\n\nSo Guo Si raised his troops against you. You hold [hd190_lg_li_duchy.GetName], and Guo Si has withdrawn to [hd190_lg_guo_duchy.GetName]; the remaining counties of Guanzhong each look to their own defense and no longer obey."
 hd190.0006.desc:0 "In the spring of the second year of Xingping, Guo Si often came to feast with you and sometimes stayed the night. His wife, afraid you would win his affections with your maids and concubines, slipped fermented beans into the food you sent him and showed it to him as poison, saying that one roost cannot hold two cocks. Later you invited Guo Si to drink again; he went home dead drunk, suspected poison, and only recovered after drinking dung water.\n\nSo Guo Si raised his troops against you. You hold [hd190_lg_li_duchy.GetName], and Guo Si has withdrawn to [hd190_lg_guo_duchy.GetName]; the remaining counties of Guanzhong each look to their own defense and no longer obey."
 hd190.0006.a:0 "How dare that wretch!"
 hd190.0007.t:0 "One Roost, Two Cocks"
 hd190.0007.desc_fan:0 "In the spring of the second year of Xingping, Li Jue had Hu Feng seize and kill Fan Chou where he sat, and from then on every general harbored fear and suspicion. You often went to feast with Li Jue and sometimes stayed the night. Your wife, afraid Li Jue would win your affections with his maids and concubines, slipped fermented beans into the food he sent you and showed it to you as poison, saying that one roost cannot hold two cocks. Later Li Jue invited you to drink again; you went home dead drunk, suspected poison, and only recovered after drinking dung water.\n\nNow you have withdrawn to [hd190_lg_guo_duchy.GetName], and you and Li Jue each hold a commandery; the remaining counties of Guanzhong each look to their own defense. Will you raise your troops against Li Jue at once?"
 hd190.0007.desc:0 "In the spring of the second year of Xingping, you often went to feast with Li Jue and sometimes stayed the night. Your wife, afraid Li Jue would win your affections with his maids and concubines, slipped fermented beans into the food he sent you and showed it to you as poison, saying that one roost cannot hold two cocks. Later Li Jue invited you to drink again; you went home dead drunk, suspected poison, and only recovered after drinking dung water.\n\nNow you have withdrawn to [hd190_lg_guo_duchy.GetName], and you and Li Jue each hold a commandery; the remaining counties of Guanzhong each look to their own defense. Will you raise your troops against Li Jue at once?"
 hd190.0007.a:0 "To arms at once!"
 hd190.0007.a.tt:0 "Declare an Annexation war on Li Jue; once the war begins you receive a force of 35 regiments of heavy infantry and 60 regiments of heavy cavalry."
 hd190.0007.b:0 "Hold the troops back for now."
 hd190.0008.t:0 "Guo Si Takes Fufeng"
 hd190.0008.desc:0 "In the spring of the second year of Xingping, Li Jue and Guo Si, each suspecting the other of poisoning him, turned their troops on one another in Chang'an. Guo Si led his followers west, seized Mei, and took all of Fufeng.\n\nYour holdings in Fufeng have either been seized by Guo Si, or you have had no choice but to accept him as your lord."
 hd190.0008.a:0 "Against rampaging soldiers, what can be done?"
 hd190_rival_li_guo:0 "[CHARACTER.GetShortUIName|U] and [TARGET_CHARACTER.GetShortUIName] suspected each other of poisoning at their feasts and ended up at war"
