l_english:
 # Historical invasions x Two Jin and Sixteen Kingdoms line (p5-C): rules and event text for Western Yan, Southern Yan and Sun En; A6-F10 realm name keys
 rule_hd_hi_rule_murongchong:0 "Historical Invasion: Murong Chong and Western Yan"
 setting_hd_hi_murongchong_on:0 "#high On#!"
 setting_hd_hi_murongchong_on_desc:0 "Between 384 and 390, Murong Chong will rise in arms when the time is ripe; in the Two Jin and Sixteen Kingdoms scenarios he appears in turn after the collapse of Former Qin. If the moment is unfavorable, he will abandon his base and bide his time abroad with his old followers and his claim."
 setting_hd_hi_murongchong_off:0 "#high Off#!"
 setting_hd_hi_murongchong_off_desc:0 "Murong Chong and Western Yan will not occur."
 rule_hd_hi_rule_murongde:0 "Historical Invasion: Murong De and Southern Yan"
 setting_hd_hi_murongde_on:0 "#high On#!"
 setting_hd_hi_murongde_on_desc:0 "Between 397 and 405, Murong De will rise in arms when the time is ripe; in the Two Jin and Sixteen Kingdoms scenarios he rises after the Yan capital in Hebei falls. If the moment is unfavorable, he will abandon his base and bide his time abroad with his old followers and his claim."
 setting_hd_hi_murongde_off:0 "#high Off#!"
 setting_hd_hi_murongde_off_desc:0 "Murong De and Southern Yan will not occur."
 rule_hd_hi_rule_sunen:0 "Historical Invasion: Sun En's Rebellion"
 setting_hd_hi_sunen_on:0 "#high On#!"
 setting_hd_hi_sunen_on_desc:0 "Between 399 and 402, Sun En, leader of the Celestial Masters, will rise in arms when the time is ripe; if the moment is unfavorable, he will abandon his base and bide his time abroad with his old followers and his claim."
 setting_hd_hi_sunen_off:0 "#high Off#!"
 setting_hd_hi_sunen_off_desc:0 "Sun En's Rebellion will not occur."
 hd_hi.murongchong.t:0 "Western Yan Rises"
 hd_hi.murongchong.ctx:0 "After the fall of Yan, Murong Chong and his brothers were moved into Guanzhong with their clan and lived for years under another's roof. Now the Qin armies have just been defeated, and the old Xianbei followers in Guanzhong are quietly in contact, waiting only for someone to raise the call."
 hd_hi.murongchong.rise:0 "\n\nMurong Hong first gathers followers at Huayin, and Murong Chong at once raises troops in answer. The Xianbei of Guanzhong rise at the news, and their banners point straight at Chang'an."
 hd_hi.murongchong.wait:0 "\n\nGuanzhong is still closely guarded, so Murong Chong can only bear it in silence, quietly winning over the old Xianbei followers."
 hd_hi.murongde.t:0 "Southern Yan Is Founded"
 hd_hi.murongde.ctx:0 "Murong De, the youngest brother of Murong Chui, is a seasoned commander of great renown. The Yan capital Zhongshan has fallen and the commanderies of Hebei are scattering, yet the troops under him remain intact."
 hd_hi.murongde.rise:0 "\n\nMurong De leads his men south across the Yellow River, takes Huatai and proclaims himself King of Yan, then seizes Qing and Qi to the east and makes Guanggu his capital."
 hd_hi.murongde.wait:0 "\n\nThe situation is still unclear, so Murong De holds where he is, gathering the scattered Yan soldiers and waiting for the moment to march south."
 hd_hi.sunen.t:0 "Sun En's Rebellion"
 hd_hi.sunen.ctx:0 "Sun En comes from the Sun clan of Langya, followers of the Five Pecks of Rice for generations. After his uncle Sun Tai was executed by the court, he fled to an island, where believers secretly supplied him and his following grew larger by the day."
 hd_hi.sunen.rise:0 "\n\nSun En lands from the sea with his followers and takes Kuaiji. Believers across the Three Wu commanderies kill their officials and rise in answer, and within ten days his host numbers in the hundreds of thousands."
 hd_hi.sunen.wait:0 "\n\nThe forces east of the Yangtze are still strong, so Sun En can only stay on his island, waiting for a rift between the court and the provinces."
