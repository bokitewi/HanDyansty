l_english:
 WJ_cp_selected_task:0 "Selected Position: [Select_CString( ObjectsEqual( CharacterInteractionConfirmationWindow.GetPuppetOrActor.GetLiege.Self, CharacterInteractionConfirmationWindow.GetRecipient.Self ), CourtTaskInteractionWindow.GetSelectedPosition.CalcTriggeredNameNoTooltip( CharacterInteractionConfirmationWindow.GetRecipient ), CourtTaskInteractionWindow.GetSelectedPosition.CalcTriggeredNameNoTooltip( CharacterInteractionConfirmationWindow.GetPuppetOrActor ) )]"
 WJ_CP_minister_bureaucrat_ministry_desc:0 "Handles the office's paperwork and daily business, assisting its head with the work of government."
 WJ_CP_travel_leader_desc:0 "Arranges journeys, transport, and guards for the road, accompanying their lord on inspections and longer travels."
 WJ_CP_antiquarian_desc:0 "Safeguards the court's collection of objects, keeping them in order and arranging repairs."
 WJ_CP_chronicler_desc:0 "Records their lord's deeds and compiles the history of the court and its ruling family."
 WJ_CP_court_champion_desc:0 "Serves their lord through martial skill, representing the court in contests and protecting its ruler."
 WJ_CP_court_artificer_desc:0 "Makes and repairs tools and furnishings, supplying the court with useful goods."
 WJ_CP_court_physician_desc:0 "Treats illnesses and injuries, tending to their lord and the members of the court."
 WJ_CP_seneschal_desc:0 "Oversees the court's daily business, checking accounts, stores, and the work of its servants."
 WJ_CP_court_tutor_desc:0 "Teaches the classics to the court's children and oversees their studies."
 WJ_CP_wet_nurse_desc:0 "Nurses young children and tends to their daily needs so that they can grow up safely."
 WJ_CP_chief_eunuch_desc:0 "Serves the inner court and conveys matters between it and the outer court. Employed only at the imperial court or in the households of landed dukes and kings."
 WJ_CP_master_of_horse_desc:0 "Manages the stables, overseeing the horses' feeding and training and preparing mounts for travel."
 WJ_CP_master_of_hunt_desc:0 "Tends to hunting equipment and animals, arranges hunts, and guards the hunting grounds."
 WJ_CP_court_gardener_desc:0 "Maintains gardens, tending to the trees, flowers, and ponds of the estate."
 WJ_CP_royal_architect_desc:0 "Oversees construction and repairs at the palace and residence, surveys building works, and keeps labor and material costs down."
 WJ_CP_court_poet_desc:0 "Composes poems and prose at their lord's request and takes part in the court's literary pursuits."
 WJ_CP_court_musician_desc:0 "Practices and performs music for the court's banquets and ceremonies."
 WJ_CP_cupbearer_desc:0 "Serves wine at banquets and tends to the drinking vessels and tables. Employed only at the imperial court or in the households of landed dukes and kings."
 WJ_CP_food_taster_desc:0 "Inspects food and drink and tastes meals to guard against poisoning. Employed only at the imperial court or in the households of landed dukes and kings."
 WJ_CP_bodyguard_desc:0 "Keeps close watch over their lord, accompanying them and guarding against attack."
 WJ_CP_grand_preceptor_desc:0 "Respected at court for learning and character, teaches the old traditions and stands ready to advise their lord."
 WJ_CP_grand_mentor_desc:0 "Takes part in the court's deliberations and offers their lord informed advice."
 WJ_CP_grand_guardian_desc:0 "Advises the court on military matters, drawing on experience to discuss its guards and armed forces."
