l_english:
 # 2026-10-26：190 曹操陈留—兖州接力（hd190.0102~0103）
 hd190.0102.t:0 "Designs on Chenliu"
 hd190.0102.desc:0 "Dong Zhuo is dead and the coalition long scattered; every lord has gone home to guard his own commanderies. You hold only a few small towns on Chenliu's western edge, Jiwu, Xiangyi and Yongqiu, and your troops there live on supplies from [hd190_relay_def.GetName].

One of your officers speaks up: \"Chenliu lies at the crossroads of the realm. [hd190_relay_def.GetName] is your old friend, but he is lenient and indecisive, no man to hold a land. Every lord now harbors his own ambitions. If you do not take Chenliu, someone else will. Hold Chenliu, and Yanzhou can be had.\""
 hd190.0102.a:0 "Chenliu must be ours. March at once."
 hd190.0102.a.tt:0 "Declare an annexation war on [hd190_relay_def.GetName] targeting all of their lands. After victory, the campaign continues into Yanzhou"
 hd190.0102.b:0 "Mengzhuo is an old friend. Not now."
 hd190.0103.t:0 "Eastward into Yanzhou"
 hd190.0103.desc:0 "The newly won towns are not yet settled when scouts report that the commanderies of Yanzhou each stand alone, answering to no one, and the troops of [hd190_relay_def.GetName] are just beyond the border.

Your advisers say Yanzhou is the heart of the realm, open to attack on every side; without it you have no footing. While the lords have not yet joined forces, they can be taken one by one."
 hd190.0103.a:0 "Press on east against [hd190_relay_def.GetName]."
 hd190.0103.a.tt:0 "Declare an annexation war on [hd190_relay_def.GetName] targeting their lands in Yanzhou. After victory, the campaign continues until you control seventy percent of Yanzhou's counties"
 hd190.0103.b:0 "The troops are weary. Let them rest."
