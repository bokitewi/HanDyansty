 hd_submission_momentum_1:0 "Unification Momentum 1"
 hd_submission_momentum_1_desc:0 "Recent expansion victories inspire submission. Submission acceptance +5. The dedicated follow-up scheduler requires 65% of maximum military strength before considering war. No combat, levy or income bonus. After three years without a victory or successful submission, momentum decays by one level at each annual check."
