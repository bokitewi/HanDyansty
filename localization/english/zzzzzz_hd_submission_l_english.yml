l_english:
 hd_warlord_offer_vassalization_interaction:0 "Invite Submission"
 hd_warlord_offer_vassalization_interaction_desc:0 "Invite a neighboring independent ruler to become your vassal while retaining their titles and vassals. Acceptance considers de jure authority, personality, relationships, opinion, strength and unification momentum."
 hd_sub_request_notification:0 "These troubled times offer little security to those who stand alone. Accept my protection and become my vassal, retaining your lands and subjects. What is your answer?"
 hd_sub_accept_summary_tt:0 "The recipient becomes a vassal together with their existing lands and subjects; their titles are not confiscated. The proposer gains 50 Prestige. Existing momentum is refreshed without gaining a level. AI recipients receive a five-year faction cooldown. Legal conditions are checked again when the request is accepted."
 hd_sub_decline_summary_tt:0 "Declining does not transfer land or automatically start a war. The same proposer cannot use this interaction against you again for two years."
 hd_sub_no_personality_veto_tt:0 "AI rulers refuse rivals and nemeses. Zealous AI rulers refuse a different faith or cultural heritage. Player recipients retain their choice."
 hd_sub_no_outgoing_request_tt:0 "The proposer has no other submission request awaiting a reply."
 hd_sub_inbox_free_tt:0 "The recipient has no pending request, no refusal cooldown against this proposer, and no active annual player inbox cooldown."
 hd_sub_success_title:0 "A Ruler Submits"
 hd_sub_cancelled_title:0 "Submission Request Invalidated"
 hd_sub_cancelled_desc:0 "Eligibility, borders, war status, vassal capacity or the pending request changed. No submission was performed."
