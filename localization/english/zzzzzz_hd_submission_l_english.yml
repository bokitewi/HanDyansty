 hd_submission_recently_submitted:0 "Recently Submitted"
 hd_submission_recently_submitted_desc:0 "This ruler recently accepted submission. AI rulers additionally receive the native five-year faction cooldown; players do not receive that automatic restriction. The marker itself grants no military bonus and does not change government."
