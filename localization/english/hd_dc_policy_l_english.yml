l_english:
 hd_dc_par_tax_relief_modifier:0 "Trial Relief and Tax Reduction"
 hd_dc_policy_silenced_opinion:0 "Policy Rebuffed"
 hd_dc_policy_retained_opinion:0 "Memorial Accepted"
 hd_dc_policy_trial_selected_opinion:0 "Chosen to Trial a New Policy"
 hd_dc_policy_trial_passed_over_opinion:0 "Another Proposal Tried First"
 hd_dc_par.1101.t:0 "The Tax Relief Decree Arrives"
 hd_dc_par.1101.desc:0 "The receipt from [hd_dc_policy_county.GetName] reaches your desk. One hundred gold has been delivered, and local tax relief has begun.\n\nAnother column is left blank in the ledger, ready to record the state of governance and livelihoods a year from now. All that can be known today is that the decree has been put into effect. Its results will depend on how the locality fares in the months ahead."
 hd_dc_par.1101.a:0 "Keep the receipt. Review it in a year."
 hd_dc_par.1101.a.tt: "The case has been settled with 100 gold already paid and received; the tax reduction initiative is now in effect: taxes −10%, development growth +25%, public opinion +20, duration 12 months. Governance points will be verified upon expiration of the term; this receipt incurs no additional fees or point adjustments."
 hd_dc_par.1201.t:0 "The Trial Ends"
 hd_dc_par.1201.fulfilled:0 "The final page has been added to the trial ledger for [hd_dc_policy_county.GetName]. A year has passed. The official responsible remained in office, and tax relief continued without interruption.\n\nLocal conditions at the beginning and end have both been recorded. The ledger faithfully shows what changed. It proves the work was completed; it cannot pronounce any faction’s policy suitable everywhere."
 hd_dc_par.1201.authority_lost:0 "The trial ledger for [hd_dc_policy_county.GetName] returns, but its final page is not the review you expected. The official responsible is no longer in office, and the agreement cannot continue as before.\n\nTax relief ends here. The money already delivered is still recorded, but this attempt cannot be called a success from beginning to end."
 hd_dc_par.1201.interrupted:0 "The trial in [hd_dc_policy_county.GetName] was interrupted. Tax relief did not last to the end of the term, and this attempt must be recorded as incomplete.\n\nThe earlier payment remains on record. The treasury has issued no further coin because of this outcome."
 hd_dc_par.1201.a:0 "Record its course and attach it to the agreement."
 hd_dc_par.1201.q.tt: "The actual fulfillment of this task has already recorded +5 Governance Points (Q) in the corresponding crisis, and it is settled only once. Reading this receipt will not grant additional points."
 hd_dc_par.1201.no_q.tt: "No new governance points were recorded this time. Actual payment records are retained; this receipt does not authorize additional payments or refunds."
 hd_dc_par.1001.t:0 "Begin with One Commandery"
 hd_dc_par.1001.desc:0 "A request for policy advice reaches your desk, the envoy’s fingerprints still visible in the sealing clay. Disaster has struck [hd_dc_case_county.GetName], and the court asks for your memorial on the matter.\n\n[hd_dc_case_ruler.GetTitledFirstName] puts the question plainly: reduce taxes for a year to let the locality recover, or continue collecting them to maintain government expenditure? This time, a few empty lines praising good and condemning evil will not suffice. Your name must go on the memorial."
 hd_dc_par.1001.a:0 "Reduce taxes first. I shall submit it in my name."
 hd_dc_par.1001.a.tt:0 "Your memorial will be presented to the throne alongside another leader’s opinion."
 hd_dc_par.1001.b:0 "Keep collecting. First establish income and expenditure."
 hd_dc_par.1001.b.tt:0 "Your memorial will be presented to the throne alongside another leader’s opinion."
 hd_dc_par.1001.c:0 "I will not lead this discussion."
 hd_dc_par.1001.c.tt:0 "Decline to take part in this policy debate. This case will not trigger a Factional Strife crisis or a fifty-year cooldown, and refusal is not treated as support for either side."
 hd_dc_par.window_closed: "This case has been handled separately."
 hd_dc_par01_local_relief_terms:0 "[hd_dc_proposer.GetTitledFirstName] will provide 100 gold to [hd_dc_recipient.GetTitledFirstName] for a year of tax relief in the afflicted commandery, easing the people’s hardship. Work begins when the money arrives. At the end of the term, local governance and livelihoods must be reported. This agreement grants no new office and guarantees no improvement. If no reply arrives within three months, the proposal lapses."
 hd_dc_par_tax_relief_modifier_desc:0 "The court temporarily reduces this commandery’s taxes to allow its people to recover."
 hd_dc_par01_relief_leadership_terms:0 "[hd_dc_proposer.GetTitledFirstName] asks [hd_dc_recipient.GetTitledFirstName] to lead a one-year trial of tax relief, followed by a joint review. The court will separately provide 100 gold to the afflicted commandery’s local official to begin the work, payable only after that official agrees. This agreement grants neither office nor title and does not commit the court to favoring one faction. If no reply arrives within three months, the proposal lapses."
 hd_dc_par.1202.t:0 "A Trial That Never Began"
 hd_dc_par.1202.rejected:0 "The documents sent to [hd_dc_policy_county.GetName] return. The reply states a clear refusal to undertake the task, and no seal has been placed beneath the agreement.\n\nThe case for tax relief remains in the memorial. Proposing it is one thing; agreeing to carry it out is another. This proposal ends here."
 hd_dc_par.1202.expired:0 "The clerk removes the document for [hd_dc_policy_county.GetName] from the box of pending business. The reply deadline has long passed, and the space for a signature remains blank.\n\nThe court has sent no money, and the locality has introduced no tax relief under this proposal. If the matter is raised again, today’s silence cannot be counted as an earlier promise."
 hd_dc_par.1202.funding_failed:0 "The signature from [hd_dc_policy_county.GetName] arrives, but the treasury cannot deliver the full payment. Tax relief has not begun, and the year-long trial cannot start.\n\nThe clerk records only the money actually received and paid out. Money never sent is not entered as payment."
 hd_dc_par.1202.invalidated:0 "When the documents for [hd_dc_policy_county.GetName] arrive again, circumstances have changed. The official responsible, the authority to govern, or the case itself is no longer as it was.\n\nThis agreement will go no further. The clerk attaches the reason to the old documents, lest a void agreement be mistaken for work accomplished."
 hd_dc_par.1202.a:0 "Keep the proposal and reply together."
 hd_dc_par.1202.a.tt: "This proposal has not been implemented on a trial basis and will not contribute to governance points. This acknowledgment shall not result in further disbursements, reimbursements, or refunds; actual payments made and outstanding differences remain unaffected."
