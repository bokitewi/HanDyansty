l_english:
 hd_dc_par_tax_relief_modifier: "Relief and Tax Reduction Pilot Program"
 hd_dc_policy_silenced_opinion: "Ordered to cease the debate"
 hd_dc_policy_retained_opinion: "The court retained my policy of submitting memorials."
 hd_dc_policy_trial_selected_opinion: "My policy has been approved for actual implementation."
 hd_dc_policy_trial_passed_over_opinion: "The court first implemented the other party's policies on a trial basis."
 hd_dc_par.1101.t: "The decree to reduce taxes has been issued to the commanderies."
 hd_dc_par.1101.desc: "The receipt for [scope:hd_dc_policy_county.GetName] has been presented. One hundred taels of gold have been transferred, and the local authorities have begun reducing taxes as agreed. An additional column has been reserved in \n\n, noting that control and livelihood conditions must be verified after one year. It can now be confirmed that this decree has been implemented; how much effect it will yield remains to be seen when localities submit their subsequent actual figures."
 hd_dc_par.1101.a: "Keep the certificate of establishment safe; verification will be conducted upon expiration."
 hd_dc_par.1101.a.tt: "The case has been settled with 100 gold already paid and received; the tax reduction initiative is now in effect: taxes −10%, development growth +25%, public opinion +20, duration 12 months. Governance points will be verified upon expiration of the term; this receipt incurs no additional fees or point adjustments."
 hd_dc_par.1201.t: "The last page of the trial version"
 hd_dc_par.1201.fulfilled: "The trial ledger for [scope:hd_dc_policy_county.GetName] has finally received its last page. Twelve months have passed, the administrator still has authority to govern, and verification found no interruption to the tax reduction during the agreed term.\n\nControl and development at the beginning and end have been recorded separately. The ledger faithfully records local changes; it proves that this agreement was fulfilled, but cannot establish that any school's policy will work everywhere."
 hd_dc_par.1201.authority_lost: "The trial copy of [scope:hd_dc_policy_county.GetName] has been returned, but the final page does not contain the scheduled acceptance. The authority for handling or the settlement conditions for this case have changed; therefore, this original agreement cannot continue to be verified according to the original counterpart and authority. The tax reduction granted in \n\n for this case has ended. Although there is still evidence for the money previously actually delivered, we cannot record termination as performance, nor can we record the paid funds as never having occurred."
 hd_dc_par.1201.interrupted: "The trial record of [scope:hd_dc_policy_county.GetName] shows a break. Upon verification, the tax reduction in the original agreement cannot be continuously confirmed for this case; this round must be marked as incomplete. \n\n Receipts remain receipts, and incomplete cases remain incomplete. The accounting office retains the actual delivery records, with no additional funds disbursed due to this reply letter, and no one's account is credited for any returned amounts."
 hd_dc_par.1201.a: "Attach the verification results to the original agreement."
 hd_dc_par.1201.q.tt: "The actual fulfillment of this task has already recorded +5 Governance Points (Q) in the corresponding crisis, and it is settled only once. Reading this receipt will not grant additional points."
 hd_dc_par.1201.no_q.tt: "No new governance points were recorded this time. Actual payment records are retained; this receipt does not authorize additional payments or refunds."
 hd_dc_par.1001.t: "First ask a commandery"
 hd_dc_par.1001.desc: "A memorial requesting policy advice has been delivered to my desk, with the seal clay on the envelope still bearing the impression of the envoy's thumb. [scope:hd_dc_case_county.GetName] There is indeed a disaster; the court requests that I submit a report on this matter. \n\n[scope:hd_dc_case_ruler.GetTitledFirstName] The inquiry is quite explicit: shall we defer taxes for one year to allow localities to recover, or maintain current collection to preserve official expenditures? This time, I cannot merely write a few words of exhortation and reprimand; my name must appear on the memorial."
 hd_dc_par.1001.a: "First reduce the taxes. I will write this proposal in my memorial to the emperor."
 hd_dc_par.1001.a.tt: "Submit this specific policy proposal advocating for tax reduction. At this time, do not allocate funds or implement policies; if another party leader presents an opposing proposal, submit it to the court for deliberation."
 hd_dc_par.1001.b: "Maintain the current levies; first explain where the funds come from and where they are spent."
 hd_dc_par.1001.b.tt: "Submit the proposal to store the policy as a draft. At this time, no taxes are levied and no additional funds are added to the treasury; your proposal and the opponent's actual response are saved separately."
 hd_dc_par.1001.c: "I am unwilling to preside over this case in the name of our party."
 hd_dc_par.1001.c.tt: "Decline to participate in this policy debate. This case will not trigger the Factional Strife crisis, will not impose a fifty-year cooldown, and will not treat refusal as support for either side."
 hd_dc_par.window_closed: "This case has been handled separately."
 hd_dc_par01_local_relief_terms: "The proposer shall pay 100 gold to the current local official for a pilot reduction of taxes in the affected commandery concerning this case. Upon full collection and retention of administrative authority, the initiative may commence; it will be piloted for 12 months. At expiration, records of actual controlled territory and development level shall be compiled, followed by a review of performance. This agreement confers no new official position and does not guarantee inevitable improvement in local conditions."
 hd_dc_par_tax_relief_modifier_desc: "This commandery respectfully proposes to implement a one-year trial reduction in taxes. Local officials must maintain records of their governance and undergo review upon expiration; this trial does not signify the court's permanent support for any faction."
 hd_dc_par01_relief_leadership_terms: "The case shall be overseen for a twelve-month trial period followed by review upon expiration, led by the party leader advocating tax reduction who submitted the memorial. Upon acceptance of this agreement, the court will separately deliver to the current local officials in charge of this case a proposal worth 100 gold pieces for implementing tax reduction; local officials must still voluntarily accept it and complete full delivery before commencing operations. This agreement does not transfer titles or court positions, does not constitute permanent support for this party, and signing it neither allocates funds nor contributes to governance scores."
 hd_dc_par.1202.t: "Trial that failed to be implemented"
 hd_dc_par.1202.rejected: "The documents regarding the case sent to [scope:hd_dc_policy_county.GetName] have been returned. The respondent clearly wrote a refusal and did not affix their seal after the agreed date. \n\n's proposal for tax reduction remains in the original memorial, but proposing it is different from being willing to undertake its execution. This proposal ends here; an unaccepted commission cannot be recorded as fulfilled."
 hd_dc_par.1202.expired: "The clerk took out the document for [scope:hd_dc_policy_county.GetName] from the pending box. The deadline for response had passed, and the blank signature field remained empty. \n\n The court did not allocate funds for execution based on this, nor did the local authorities begin a trial implementation according to this proposal. If discussed again later, today's silence cannot be taken as yesterday's promise."
 hd_dc_par.1202.funding_failed: "The signature for Case [scope:hd_dc_policy_county.GetName] has been submitted, but the accounting office failed to provide sufficient vouchers for payment. The reduction of taxes has not yet been implemented, and the originally planned annual verification cannot be calculated from paper records. The handlers have left only the actual deduction and receipt records; funds that were not incurred shall not be recorded as paid. \n\n"
 hd_dc_par.1202.invalidated: "When the documents for Case [scope:hd_dc_policy_county.GetName] were resubmitted, the circumstances under which they had originally been signed had already changed. The current handlers, administrative authorities, or policy proposals no longer matched each item as they did when submitted. Proposal \n\n would no longer be carried forward. The case clerk appended the reasons for the change to the original documents, so that future generations would not mistake an invalidated agreement for accomplished achievements."
 hd_dc_par.1202.a: "Preserve the original texts and replies, and file them truthfully."
 hd_dc_par.1202.a.tt: "This proposal has not been implemented on a trial basis and will not contribute to governance points. This acknowledgment shall not result in further disbursements, reimbursements, or refunds; actual payments made and outstanding differences remain unaffected."
