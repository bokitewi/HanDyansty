l_english:
 # Southern Migration of the Gentry: adapted legacy events (docs/衣冠南渡_重做设计.md §5.10, §5.12 Module E)
 # Only retained events, the Beifu men-at-arms and event armies remain here; situation/group/phase/modifier/opinion/rule/toast/decision/casus belli keys have moved to each module's own localization files

 # ---------- Men-at-arms and event armies ----------
 hd_yiguan_beifu:0 "Beifu Army"
 hd_yiguan_beifu_flavor:0 "#F Northern refugees around Jingkou and Guangling, hardened by long war, brave and heedless of death. Recruited as soldiers and named the Beifu, they won victory wherever they went.#!"
 hd_yiguan_uprising_army:0 "Righteous Army"
 hd_yiguan_liumin_army:0 "Refugee Army"

 # ---------- South: Refugees (Southern Regimes, Northern Han) ----------
 hd_yiguan.1001.t:0 "Gentlefolk of Luoyang"
 hd_yiguan.1001.desc:0 "Before he was shown in, the visitor brushed the dust from his robe at the door, yet his bow was still faultless. He named his ancestral commandery in the north and spoke of kin lost along the way; only when I asked how many people he had brought did he at last leave off his lineage and turn to point at the family, retainers and tenants waiting outside the gate.\n\nThey had shielded the old and the young all the way south, and besides bedding their carts held books they would not abandon. Their leader offered to stay and serve, asking only for a place where all of them might settle. My officials reminded me that grain and land would have to be found for them, though the able-bodied among them could fill out the ranks.\n\nI saw that the visitor had never stopped watching my face. For all his composed courtesy, he could not hide a family's anxious wait for an answer."
 hd_yiguan.1001.a:0 "Welcome the scholars and settle their families."
 hd_yiguan.1001.b:0 "Take their retainers into the army."
 hd_yiguan.1001.c:0 "There is no room in the city; go elsewhere."
 hd_yiguan.1002.t:0 "Wanderers on the Road"
 hd_yiguan.1002.desc:0 "A patrolling clerk brought in a father and his son. The boy clutched half a length of straw rope; its other end had once been tied to the family ox. Now the ox and their baggage were both gone, and only the father still glanced back now and then, counting the people who had followed them in. Several such columns had already come this month.\n\nThe local petitions for grain grew ever more urgent: some of the newcomers lodged in village houses, others crowded along the roadside, and the households nearby feared their own stores would not last until the autumn harvest. My officers had their eye on the able-bodied, saying that if they were enrolled as retainers they would be fed, and would add some useful soldiers besides.\n\nI asked the father what he meant to do. He did not answer, only drew the boy a little closer. Shelter them, recruit them, or shut the gates: the answer could be put off no longer."
 hd_yiguan.1002.a:0 "Open the granaries to settle the refugees."
 hd_yiguan.1002.b:0 "Choose the able-bodied and enroll them as retainers."
 hd_yiguan.1002.c:0 "Close the passes and admit no refugees."
 hd_yiguan.1003.t:0 "Waiting to Cross the River"
 hd_yiguan.1003.desc:0 "The ferry officer brought me a cloth shoe fished from the water and said that someone else had fallen in while fighting for a boat. I asked how many had been saved; he lowered his head and gave the number, then added that many of the old and weak still waited on the north bank. They had been there for days, and pressed forward the moment a boat drew near.\n\nMy officials urged me to send out the official boats, since a few more trips would bring many across. The grain stewards, though, reckoned up the boatmen's rations and the cost of settlement, and advised relief first, ferrying people over little by little. My officers had other ideas, wishing to pick out the able-bodied for their retainers, while others feared that unchecked comings and goings would undermine the river defenses.\n\nI looked at the shoe, still dripping. Those on the far bank could not hear this debate, but whether the next boat went or not, I had to give a clear word before nightfall."
 hd_yiguan.1003.d:0 "Send every official boat to ferry the northerners."
 hd_yiguan.1003.a:0 "Open the granaries for relief, and ferry them over little by little."
 hd_yiguan.1003.b:0 "Choose the able-bodied and enroll them as retainers."
 hd_yiguan.1003.c:0 "River defense comes first; no unauthorized crossings."
 hd_yiguan.1003.t_north:0 "Waiting on the Far Bank"
 hd_yiguan.1003.desc_north:0 "The ferry officer brought me a cloth shoe fished from the water and said that someone else had fallen in while fighting for a boat. I asked how many had been saved; he lowered his head and gave the number, then added that many of the old and weak who had escaped Hu rule still waited on the far bank. They had been there for days, and pressed forward the moment a boat drew near.\n\nMy officials urged me to send out the official boats, since a few more trips would bring many across. The grain stewards, though, reckoned up the boatmen's rations and the cost of settlement, and advised relief first, ferrying people over little by little. My officers had other ideas, wishing to pick out the able-bodied for their retainers, while others feared that Hu riders might follow in among the crowds and breach the river defenses.\n\nI looked at the shoe, still dripping. Those on the far bank could not hear this debate, but whether the next boat went or not, I had to give a clear word before nightfall."
 hd_yiguan.1003.c_north:0 "Hold the river line; no unauthorized crossings."

 # ---------- South: Refugee Commanders (Southern Regimes, Northern Han) ----------
 hd_yiguan.1101.t:0 "Striking the Oar Midstream"
 hd_yiguan.1101.desc:0 "[hd_yiguan_shuai.GetName] strode into the hall and, rather than first reciting his lineage, asked my leave to go back north of the river. His companions said that while crossing he had struck his oar and sworn never to cross back until the Central Plains were cleansed; before they had finished, he was already pointing out to me, one by one, the roads still passable along the way.\n\nSeveral hundred households from his home district had followed him south and were still waiting to be settled. What he asked for was troops, grain and a title, yet all he spoke of was the north, as if the ground beneath his feet were only a ferry landing where he paused to rest. My officers reminded me that granting him a county would set him to guard the frontier, keeping him would put him in command of the refugees, and funding his return north would mean raising grain and arms for that army.\n\nHe let his hand fall and waited for my answer. How far that oath could carry him depended first on which step I would let him take."
 hd_yiguan.1101.desc_north:0 "[hd_yiguan_shuai.GetName] strode into the hall and, rather than first reciting his lineage, asked my leave to fight his way back to his homeland. His companions said that on his flight here he had struck his oar at a ferry and sworn never to turn back until the Central Plains were cleansed; before they had finished, he was already pointing out to me, one by one, the Hu strongholds along the way.\n\nSeveral hundred households from his home district had followed him here and were still waiting to be settled. What he asked for was troops, grain and a title, yet all he spoke of was his lost homeland, as if this place were only a post station where he paused to rest. My officers reminded me that granting him a county would set him to guard the frontier, keeping him would put him in command of the refugees, and funding his campaign would mean raising grain and arms for that army.\n\nHe let his hand fall and waited for my answer. How far that oath could carry him depended first on which step I would let him take."
 hd_yiguan.1101.a:0 "Grant him a frontier county to guard the front."
 hd_yiguan.1101.b:0 "Keep him as a general to lead the refugees."
 hd_yiguan.1101.c:0 "Fund his Northern Expedition to seek restoration."
 hd_yiguan.1101.d:0 "This man is hard to control; better to refuse him."
 hd_yiguan.1102.t:0 "Refugee Patriarch"
 hd_yiguan.1102.desc:0 "When [hd_yiguan_shuai.GetName] came in, several of his followers outside the gate were still arguing over how much grain each family should receive. He turned and said a few words, telling them to record it first by the number of old and young, and the quarrel died down for the moment. Only when he faced me again did he beg my pardon, saying that his kinsmen had followed him all this way and he could not seek a place for himself alone.\n\nAccording to his followers, when famine and chaos struck the north he had shared his grain and eaten alongside everyone, and so more than a thousand households chose him as their head and to this day refuse to scatter. He was willing to take my orders, but hoped these people might live together and earn their keep, no longer begging along the roads.\n\nI studied the column outside the gate, quiet now. Such a man could hold a county or serve as a general; but in settling him, I would also take on the livelihood of all who followed him."
 hd_yiguan.1102.a:0 "Grant him a frontier county to settle the refugees."
 hd_yiguan.1102.b:0 "Keep him as a general to command his followers."
 hd_yiguan.1102.c:0 "Send him back north to seek restoration when the time is right."
 hd_yiguan.1102.d:0 "There is no land within our borders for them."
 hd_yiguan.1103.t:0 "Arrogant Troops, Fierce Commander"
 hd_yiguan.1103.desc:0 "Before [hd_yiguan_shuai.GetName] had even been shown in, his soldiers were already quarrelling with my guards outside over where to stable their horses. Hearing the noise, he only barked a single word over his shoulder, then turned to discuss settlement and grain with me, in the tone of a man haggling over a bargain in which each side needed something.\n\nThis refugee army could certainly fight, and villagers along their route had come to complain that they extorted grain and goods. He argued that if his men went hungry no one could hold them back, and offered to brave danger in battle on my behalf, if only I gave them somewhere to stop. The officers beside me wore mixed expressions, and the noise outside gradually died away.\n\nI did not agree at once. Granting him a county might give him something to lose; taking his men into my army would mean restraining them myself. As for sending him north, or simply turning him away, each had its own difficulties."
 hd_yiguan.1103.a:0 "Give him a county to keep his men in check."
 hd_yiguan.1103.b:0 "Take them under my banner and hold them on a tight rein."
 hd_yiguan.1103.c:0 "Drive them north to fight poison with poison."
 hd_yiguan.1103.d:0 "These men are tigers and wolves; they must not stay."
 hd_yiguan_shuai_refuse_tt:0 "#EMP This man may harbor resentment and rebel one day.#!"
 hd_yiguan.1111.t:0 "Refugee Revolt"
 hd_yiguan.1111.desc:0 "The garrison officer brought me the words the enemy had been spreading, and when he reached 'mistreats the northerners' he suddenly stopped. I told him to go on, and only then did I learn that the man who had raised troops was [hd_yiguan_shuai.GetName], whom I had once turned away. He had since gathered a host and was striking at the towns within my borders.\n\nSome urged me to punish those who had aided him along the way; others said the refugees nearby had nowhere to settle, and so were easily stirred up by him. Before the two sides had finished arguing, fresh reports arrived confirming that this was no mere grumbling: troops were on the move, the districts were begging for aid, and the defenders of the towns anxiously awaited my reply.\n\nI remembered that when I gave my answer that day, everyone was still debating whether these newcomers could be taken in. Arguing today over who had been right then would save none of the towns under attack. All I could do was have the officer first lay out the situation before us."
 hd_yiguan.1111.a:0 "How dare this whelp!"

 # ---------- South: Émigré Jurisdictions and Tuduan (Southern Regimes) ----------
 hd_yiguan.1201.t:0 "Émigré Provinces and Commanderies"
 hd_yiguan.1201.desc:0 "The scholar who had sought an audience gave his name, then solemnly added the ancestral commandery of his old home. I asked how many years he had been in the south; he hesitated, then said his youngest son no longer remembered their house in the north, yet the native registry handed down from their forebears could not simply be disowned. Then he presented a petition to establish [hd_yiguan_qiao_title.GetName] as an émigré jurisdiction.\n\nHe hoped that his exiled fellow countrymen might have a jurisdiction of their own, and hoped too that, though their homeland was lost, the court would still keep its name. My officials reminded me that an émigré jurisdiction needed someone to run it and could not be a mere added title; and the local people would ask why an old commandery should be raised anew within their own lands.\n\nI looked again at the petitioner. What he sought was both a way to settle his people and an answer he could carry back to his kinsmen: now that they had come south, did the court still recognize the registry their ancestors had left them?"
 hd_yiguan.1201.a:0 "Establish émigré provinces and commanderies to bind men's hearts."
 hd_yiguan.1201.b:0 "This can be discussed later."
 hd_yiguan.1202.t:0 "Settling Households in Émigré Commanderies"
 hd_yiguan.1202.desc:0 "The clerk registering the refugees laid several rolls side by side and asked me to look at a single household: their residence was entered under this county, their native registry under the north, and the last place they had stopped had recorded them once more besides. When labor service came due, each office pushed them onto the other, and no one could say whom they answered to.\n\nOne of my staff proposed setting up a separate émigré commandery, gathering the scattered northerners into a single register, easing their taxes and corvee for a time, and letting them settle down to clear the land. Another asked why, if they already lived here, they should be kept apart from the local people. Tilling the same fields while owing different service would sooner or later stir up quarrels.\n\nI turned to that household's entry; beside it a newborn child had been recorded. Where the registers placed them would fall upon household after household that had already begun to make a life here."
 hd_yiguan.1202.a:0 "Establish émigré commanderies and counties to settle the refugees."
 hd_yiguan.1202.b:0 "Set up no separate émigré commandery for now."
 hd_yiguan.1203.t:0 "Émigrés versus Natives"
 hd_yiguan.1203.desc:0 "When someone at the banquet praised the worthies of the north, a scholar of Jiangdong set down his cup and asked: if the southern lands were so unworthy, why had you gentlemen crossed the river at all? The northern guest's face changed, and he began to speak of his forebears' offices and renown, his words gradually betraying a disdain the other would not accept.\n\nI cut the quarrel short, and only then heard what they truly meant to say: one side hoped the court would employ the talented men of the old families, the other resented that offices and lands had been parcelled out to newcomers from the north. A moment before, it had been a dispute over a single remark; now the retainers of both sides were looking to me.\n\nEach wished to hear a fair judgment, yet each hoped that judgment would first take his side. If the two were to be reconciled for now, empty talk of common purpose would hardly suffice; I had to decide what I was willing to put forward to settle this quarrel."
 hd_yiguan.1203.a:0 "The northern gentry are the pillars of the state."
 hd_yiguan.1203.b:0 "The old clans of Jiangdong are the foundation of the state."
 hd_yiguan.1203.c:0 "Reward both richly and reconcile them."
 hd_yiguan.1210.t:0 "Tuduan Registration Reform"
 hd_yiguan.1210.desc:0 "The census clerk pointed to an estate: when this family came south they had not even a house; now they had fields and a residence, yet their names were still listed under an émigré commandery, and their taxes and corvee remained as light as ever. I was about to press further when a northern scholar sitting with us spoke first: our homeland is not yet recovered, so how can you cut off everyone's road home?\n\nMy staff urged me to carry out Tuduan, registering households where they actually lived so that émigrés and natives would gradually bear the same burdens. Its opponents said the settlement had come with promises; to change it suddenly now would only make people feel the court had broken faith.\n\nI looked at the two sets of registers that had run side by side for so long. Some used them to escape service; others still held them as their warrant to return home. If I put brush to paper and settled the matter, I would gain households to levy, but what I touched would be more than a few numbers."
 hd_yiguan.1210.a:0 "Carry out Tuduan and register all households alike."
 hd_yiguan.1210.b:0 "The northerners long to return; this cannot be rushed."

 # ---------- South: Beifu Army (Southern Regimes) ----------
 hd_yiguan.1301.t:0 "Founding of the Beifu"
 hd_yiguan.1301.desc:0 "As we spoke of the northerners at Jingkou and Guangling, the officer putting forward the proposal suddenly asked me: these men once banded together to survive the wars, so why leave them scattered now, untrained? He said there were plenty of fighters among them, but each band of kinsmen had its own leader, and without a single command they would struggle to support one another in the face of the enemy.\n\nI listened as he explained how they might be recruited. Their lost northern homeland could rouse men to action, but it might also make them follow only the leaders of their own district; to forge them into a usable elite force, a name alone would not do. They must also know who led them and what they fought for.\n\nThe officer asked leave to recruit northerners in this region and name them the Beifu. I turned my gaze to those waiting nearby for orders. Once these ranks were formed, the river defenses would have one more force to lean on."
 hd_yiguan.1301.a:0 "Recruit the northerners as soldiers, and name them the Beifu."
 hd_yiguan.1301.a.tt:0 "#EMP During the Southern Migration of the Gentry, the Beifu Army can be recruited at Jingkou and Guangling.#!"
 hd_yiguan.1302.t:0 "A Famed Beifu General"
 hd_yiguan.1302.desc:0 "When the generals put forward [hd_yiguan_beifu_general.GetName], they spoke first of several battles: while others were still forming ranks, this man was already leading his troops forward, and whatever he shared out among the soldiers after a fight was always remembered by someone. He did not interrupt as they told it, answering briefly only when asked about military matters.\n\nHis sponsors said the Beifu units all accepted his authority, and asked me to entrust the command to him alone, so that orders would not be divided. My close ministers warned, however, that while a general who could make soldiers die for him was valuable, the court could not rely on one man's prestige to control its army.\n\nI regarded this general, newly thrust before everyone. Placing the troops in his hands might bring the army into order; dividing them among several commanders would not leave present goodwill unharmed. The recommendation had been submitted and awaited only my decision."
 hd_yiguan.1302.a:0 "Entrust him with sole command of the Beifu."
 hd_yiguan.1302.b:0 "Military power must not rest in one man's hands."
 hd_yiguan.1303.t:0 "Beifu Ascendancy"
 hd_yiguan.1303.desc:0 "The man sent to press for military news had come back again, bringing the same vague reply. [hd_yiguan_beifu_general.GetName] kept failing to act on his transfer orders, and military reports from Jingkou were growing scarce. Some said the army knew only its general; when I demanded proof, my close ministers pointed to several orders that had gone unexecuted and left me to judge for myself.\n\nIf I now sent someone to strip him of command, I must guard against the soldiers refusing to obey; if I rewarded him, it might ease the present rift, but would not necessarily make my orders flow freely from then on. Others advised me to bear with it for now, and not throw my own army into disorder while enemies were at hand.\n\nI asked the messenger once more whether the man had named a firm date for carrying out the orders. He shook his head. Whatever that man intended, the court could not keep waiting here for a belated reply."
 hd_yiguan.1303.a:0 "Strip him of command to forestall disaster."
 hd_yiguan.1303.a.tt:0 "#EMP He may rise up in arms at Jingkou.#!"
 hd_yiguan.1303.b:0 "Reward him richly to set his heart at ease."
 hd_yiguan.1303.c:0 "Let him be for now."

 # ---------- North: Flight of the People (Hu Regimes / Han of the Occupied North) ----------
 hd_yiguan.2001.t:0 "Han Flee South"
 hd_yiguan.2001.desc:0 "The scouting riders came back with only a few things picked up by the roadside: worn straw sandals, a broken cart rope, and a clay jar that could not be carried off. Another batch of Han households had left the village, slipping away south by night with their whole families. My general asked to send troops in pursuit, saying that if this were tolerated, those who remained would grow even more restless.\n\nThe official in charge of land rents was thinking of something else: if people kept scattering, there would be no one to bring in the harvest, and the few households left could not bear the old levies. He asked me first to lighten their burdens, so that those still wavering would know they could make a living if they stayed.\n\nI had someone find out which passes the fugitives had gone through. Whether to drive people back with pursuing troops, or spend money to settle those who had not yet left, one course had to be chosen today."
 hd_yiguan.2001.a:0 "Send troops to bring them back, as a warning to others."
 hd_yiguan.2001.b:0 "Let them run; it's hardly worth mentioning."
 hd_yiguan.2001.c:0 "Lighten taxes and corvee to soothe those who remain."
 hd_yiguan.2002.t:0 "A Wubao Master Departs"
 hd_yiguan.2002.desc:0 "The man back from [hd_yiguan_occ_county.GetName] still smelled of smoke. He said the Han wubao master had led his people south; the grain in his granary had not been carried off, but put to the torch. The words left behind were harsher still: they would rather die on the road than be driven by us any longer.\n\nHearing this, my general asked to give chase, to show the other wubao masters that they could not simply walk away. My official asked instead about the farming households nearby: with the granary destroyed, what would those who had not left live on? If only cavalry were sent, everyone would take fright, and several more villages' worth of households might be lost.\n\nI did not wish to act in a fit of temper over an insult carried back to me. But the burned grain would not come back, and the empty fortress needed someone to deal with it; the possible courses all lay before me."
 hd_yiguan.2002.a:0 "Send riders after him; let none escape."
 hd_yiguan.2002.b:0 "Let him go."
 hd_yiguan.2002.c:0 "Open the granaries to comfort the people and win their hearts."
 hd_yiguan.2003.t:0 "Frontier Counties Emptied"
 hd_yiguan.2003.desc:0 "The local official of [hd_yiguan_occ_county.GetName] was halfway through his report when he lowered his voice: ripe crops still stood in the fields, yet the villages could not muster enough hands, and even the grain owed this season could not be collected. I asked where those people had gone; he could only answer that most had probably gone south.\n\nMy general said the passes and fords must be strictly watched, and people could no longer be allowed to cross the border at will. The local official begged me first to give those who remained a way to live; if levies were still pressed at the old quotas, even more would flee. As they argued, one was counting the crossings that could be held, the other the villages not yet emptied.\n\nI told them to stop. A strict order could not fill the emptiness of a frontier county; yet to let it be would be to watch the land in my hands slowly lose the people who tilled it."
 hd_yiguan.2003.a:0 "Inspect the passes and fords strictly and hunt down the fugitives."
 hd_yiguan.2003.b:0 "Let things take their course."
 hd_yiguan.2003.c:0 "Open the granaries for relief and invite the fugitives back."
 hd_yiguan.2011.t:0 "The Clan Debates Going South"
 hd_yiguan.2011.desc:0 "The family elders called in several of the young men, then sent them to wait outside the door before speaking of crossing south. One argued for sending a few to Jiangzuo first, so that if the north fell into chaos again the clan would still have somewhere to go; another at once asked: if everyone left, who would keep the ancestral tombs and estates?\n\nListening to them argue, I knew this was not yet a migration of the whole clan. The young men willing to go needed someone to receive them, and those who stayed needed to be able to protect themselves; building a wubao and gathering people would take great effort, while urging the villagers to serve our overlord would surely be denounced as caring only for safety in the moment.\n\nLow voices asked questions outside the door; clearly the young men were waiting for news as well. I looked at the kinsmen filling the room. Who would go south, and who would stay to face the wars to come, could not be settled by an appeal to principle alone."
 hd_yiguan.2011.a:0 "Send the young men south to preserve the ancestral rites."
 hd_yiguan.2011.b:0 "Hold out in our wubao; we will not leave our homeland."
 hd_yiguan.2011.c:0 "Counsel the villagers to serve our lord in peace."
 hd_yiguan.2012.t:0 "The Elders' Plea"
 hd_yiguan.2012.desc:0 "The elders came carrying several rolls the families had drawn up together. One old man pointed to the names on them, saying the grain levies and labor drafts came one after another, until some households could scarcely keep anyone to work the fields. At last he asked whether, if they were to build a wubao, they could still begin before the next troops passed through.\n\nOthers had heard that Jiangzuo would take in northerners, and begged me to send some young men ahead to find out. I warned them the road was hard and their families might not be able to follow at once, but the old man answered that as long as one of them gained a foothold first, it was better than having no retreat anywhere. Those beside him still could not bear to leave their ancestors' land.\n\nEach had his own view, yet none would decide alone. Looking at those rolls, I knew that whether I urged them to stay, sent men south, or gathered the people to defend themselves, the villagers would carry my words back to every household."
 hd_yiguan.2012.a:0 "Send the young men south ahead of us."
 hd_yiguan.2012.b:0 "Build a wubao, gather the people, and swear to defend our home."
 hd_yiguan.2012.c:0 "Endure for now, and urge the people to submit."
 hd_yiguan.2013.t:0 "Secret Envoy of the Southern Court"
 hd_yiguan.2013.desc:0 "Once inside, the visitor first made sure no one was in the corridor, then said he came at the command of Jiangzuo. I asked what he sought; he did not press me to raise troops at once, saying only that the south was willing to take in northern scholars, and that if I still had doubts, I could first send some young men of my clan with him to see how things truly stood there.\n\nThis touched the matter at hand more closely than empty promises of high office, yet it was not without danger. Once the young men left, if their comings and goings were discovered, our overlord would surely demand answers; yet if we clung to a single wubao forever, how were we to face the next levy and the next war?\n\nI did not let him go on with his grand exhortations, and first asked about the roads and where they would be met. Having answered each in turn, he fell silent and waited for me to decide whether to keep a road south open for my house, or still stake our livelihood on this place."
 hd_yiguan.2013.a:0 "Send the young kinsmen south with the envoy."
 hd_yiguan.2013.b:0 "The Southern Court is far; better to defend ourselves."
 hd_yiguan.2013.c:0 "Speak of this no more."

 # ---------- North: Righteous Uprisings (Hu Regimes / Han of the Occupied North) ----------
 hd_yiguan.2101.t:0 "Wubao Uprising"
 hd_yiguan.2101.desc:0 "The clerk who had fled back would go no further, saying that the wubao at [hd_yiguan_occ_county.GetName] had shut its gates and risen in arms; the man sent there on business had been killed, and the district was answering a call to join in driving us out. The leader's name he gave was [hd_yiguan_new_leader.GetName].\n\nMy general asked to send troops at once and root out this source of trouble before the other wubao nearby could answer the call. Others urged me to offer office: these magnates could gather men in any case, and if they accepted my commission they might in turn hold the district for me. The keeper of the treasury proposed handing out goods to try to persuade those who had gathered to disperse.\n\nI asked how many soldiers were really in the wubao; the man could give only a rough figure. I had him sit and rest, and went on asking what he had seen along the way. The news was still incomplete, but the district could not wait for me to learn everything before I responded."
 hd_yiguan.2101.a:0 "Send troops to crush them!"
 hd_yiguan.2101.b:0 "Offer them office and win them over."
 hd_yiguan.2101.c:0 "Scatter his followers with money and goods."
 hd_yiguan.2102.t:0 "The Qihuo Army"
 hd_yiguan.2102.desc:0 "The district reported a name: 'Qihuo', begging for life. When I first heard it, I took it for nothing more than starving folk seeking food, until the messenger told of the roads cut off in [hd_yiguan_occ_county.GetName]; only then did I understand that they now had weapons, and a leader as well: [hd_yiguan_new_leader.GetName].\n\nIt was reported that these people fought from place to place to survive, taking their families with them; they would fight to the death for grain, and kept gathering in the scattered and displaced to stand against our forces. My general wanted to send troops to crush them, but my official said that if their leader were given a post, or money and grain to disband, perhaps not every starving man need be driven onto the battlefield.\n\nI had men look again into where they were camped, and asked how many more nearby might go over to them. Whether this so-called begging for life still left room for negotiation depended on what I was prepared to send first."
 hd_yiguan.2102.a:0 "Wipe out the Qihuo to bring peace to the region."
 hd_yiguan.2102.b:0 "Take them into my service."
 hd_yiguan.2102.c:0 "Give them money and grain and have them disperse."
 hd_yiguan.2103.t:0 "Heroes Raise the Righteous Banner"
 hd_yiguan.2103.desc:0 "The news from [hd_yiguan_occ_county.GetName] grew ever more urgent. Since [hd_yiguan_new_leader.GetName] took up arms, the Han nearby had risen one after another in answer, and the proclamations that reached us were full of calls to exterminate the Hu; those who escaped the area added that many of our kinsmen had already been killed in the turmoil.\n\nMy general asked me to gather troops and meet them, rather than let them keep drawing in followers. Another urged me first to lure them with high office and find a way to divide their forces; if their edge could be blunted for a while, even sending a sum of wealth first would be safer than rushing into battle. At the height of their argument, both demanded that I declare myself at once.\n\nI first asked whether those who had fled to us had been given shelter. The threat before me was greater than any ordinary gathering of rebels, and all the less to be handled in anger alone; once the order to march was given, this could no longer be treated as a local dispute."
 hd_yiguan.2103.a:0 "Send every soldier in the realm; they must be crushed!"
 hd_yiguan.2103.b:0 "Offer him high office to divide his strength."
 hd_yiguan.2103.c:0 "Bribe him richly to blunt his advance for now."
 hd_yiguan.2111.t:0 "Uprising in the Neighboring County"
 hd_yiguan.2111.desc:0 "Men had risen in neighboring [hd_yiguan_up_county.GetName]. A proclamation from [hd_yiguan_new_leader.GetName] had been quietly smuggled in to me, declaring that the Han everywhere should rise together. As I read to the end, those beside me asked: should this be kept safe, or handed over to our overlord?\n\nIf I answered the call openly, my soldiers would have to stand shoulder to shoulder with the righteous army, and win or lose I could no longer stand aside; if I informed on them, I might win my overlord's trust, but would make enemies of those who had risen. Someone suggested in a low voice that I might first send some grain and arms, without showing my own banner.\n\nI looked up toward the door. Outside, people came and went as on any ordinary day, but the messenger still waited within for me to speak. The answer I had him carry back would decide whether, when next we met, we would be comrades in arms or enemies."
 hd_yiguan.2111.a:0 "Raise the righteous banner together and drive out the Hu."
 hd_yiguan.2111.b:0 "Report to my overlord to prove my loyalty."
 hd_yiguan.2111.c:0 "Secretly send grain and weapons."
 hd_yiguan.2112.t:0 "Envoy of the Righteous Army"
 hd_yiguan.2112.desc:0 "The peddler stayed until last, and only when my attendants had gone did he take a letter from [hd_yiguan_new_leader.GetName] out of his bundle. He said the righteous army had risen in [hd_yiguan_up_county.GetName] and asked me to send troops in support; if I still hesitated, at least not to leave them standing alone.\n\nI did not set my seal to a reply at once. To raise my banner openly would mean crossing blades with my overlord; to present the letter to him would mean cutting off these dealings with my own hand. Seeing me silent, my attendant added that grain and weapons could also meet the need; sending troops was not the only way.\n\nSomeone passed in the corridor, and the man fell silent at once, arranging the small wares scattered before him back into a display of goods. I waited for the footsteps to fade before signing to him to keep waiting. This time he could not carry back merely a vague word."
 hd_yiguan.2112.a:0 "Strike from within and join the righteous cause."
 hd_yiguan.2112.b:0 "Present the letter to my overlord."
 hd_yiguan.2112.c:0 "Supply them with grain and weapons, leaving no trace."
 hd_yiguan.2113.t:0 "An Old Friend's Invitation"
 hd_yiguan.2113.desc:0 "The visitor brought a message on behalf of [hd_yiguan_new_leader.GetName]: all in the north suffered alike from the wars, and he begged me, for the bond we shared as men of Huaxia, to send troops to help. I first asked where his troops were now, and how much longer their grain could last.\n\nOnly when the talk turned to practical matters did he explain that the righteous army hoped I would openly answer their call; if I could not raise my banner yet, secret aid in grain and arms would also serve. This plea, falling on me now, had become a question of where my soldiers would march and whether my house would be safe. Reporting the news to our overlord would likewise be a road not easily retraced.\n\nWhen he had said his last, I still kept the envoy waiting. He could repeat his plea again and again, but how to bear the consequences of taking up arms was, in the end, mine alone to decide."
 hd_yiguan.2113.a:0 "Send troops in answer and share this burden."
 hd_yiguan.2113.b:0 "Report to my overlord, and spare my house from ruin."
 hd_yiguan.2113.c:0 "Secretly aid the righteous army."
 hd_yiguan.2120.t:0 "Debate on Joining the South"
 hd_yiguan.2120.desc:0 "Those celebrating the victory had not yet all dispersed when the envoy from the south asked where our allegiance would lie from now on. Having broken free of our old master, he said, why not lead our people to submit to Jiangzuo, so that north and south might honor a single legitimate calendar? Yet some of those who had risen in arms with me shook their heads, holding that after winning our independence so dearly, we should not take another's orders again.\n\nI looked at these faces, worn thin by the war. Submission would give the victory before us something to rest on, but it would also mean accepting a new order of superior and inferior; remaining independent would leave the many burdens of handling our neighbors, raising grain and holding our land on our own shoulders.\n\nThe envoy awaited my answer and pressed no further. The war had won me back room to decide, but had not decided for me how to use it. The reply to be sent south would settle our standing from now on."
 hd_yiguan.2120.a:0 "Submit to the Southern Court and keep faith as a subject."
 hd_yiguan.2120.b:0 "Stand on our own; we need depend on no one."

 # ---------- North: Hu and Han at Odds (Hu Regimes / Han of the Occupied North) ----------
 hd_yiguan.2201.t:0 "Hu and Han Dispute Land"
 hd_yiguan.2201.desc:0 "Both sides in the land dispute brought in a broken length of timber along with their wounded. One side said the old track their herds used had been ploughed up, leaving their animals nowhere to go; the other said their newly sprouted grain had been trampled, and if they could not even keep their fields, what would their families eat this winter? Before they had finished, they were again blaming each other for the dead and wounded of the earlier brawl.\n\nI had the leaders of each side restrain their people first. My official proposed drawing clear lines between where each lived and worked, so that Hu and Han would each answer to their own courts; the Han scholars asked instead that cases be judged by the actual state of the fields, with those who knew farming taking part in governance. The generals of my own people disagreed, saying only that defiance must not be indulged.\n\nThat broken timber on the ground had once marked a field boundary; what the two sides were fighting over now was whose rules they would obey from here on."
 hd_yiguan.2201.a:0 "Hu and Han shall be governed apart, each secure in his own livelihood."
 hd_yiguan.2201.b:0 "The Han are skilled at tilling the fields; put their strengths to use."
 hd_yiguan.2201.c:0 "The Han are cunning and stubborn; hold them on a tight rein."
 hd_yiguan.2202.t:0 "Hu Oppress the Han"
 hd_yiguan.2202.desc:0 "When the merchant households of the city came to lodge their complaint, they still recited the stolen goods one by one, and when they came to the women of their families who had been violated, they could not go on. I asked who had led the soldiers; the man with them first glanced at the general of my own people beside me, then quietly named him. The general said the soldiers had only taken what they needed, so why listen to exaggerations?\n\nNow that the complaint had reached me, I could not pretend not to have heard. Making Hu and Han each keep to their own places might mean fewer disputes; employing Han scholars who knew the locality might mean such grievances need no longer wind their way up to me. If I simply silenced the complaints by force, it might be quiet for now, but how would that peace be kept afterward?\n\nI let the complainants finish what they had left unsaid. Everyone around was listening, and the answer I gave now would soon spread throughout the city."
 hd_yiguan.2202.a:0 "Hu and Han shall keep to their own places and not trouble one another."
 hd_yiguan.2202.b:0 "Promote Han scholars and set the district in order."
 hd_yiguan.2202.c:0 "The Han grow resentful; it is time to show them our might."
 hd_yiguan.2203.t:0 "A Han Scholar Counsels"
 hd_yiguan.2203.desc:0 "When the Han scholar first spoke of land rents and lawsuits he was somewhat guarded, but seeing that I would listen, he said plainly that cavalry could take cities but could not settle a city's affairs by the sword day after day. A general of my own people sneered beside me, asking whether, under his scheme, the soldiers of greatest merit should take orders from bookworms.\n\nThe Han scholar did not back down, only asked me to consider: levying grain, registering households, judging cases, which of these did not require someone who knew the locality? What he sought was not idle talk, but a place for the Han in governance. Others proposed keeping the courts separate, each following its own customs, lest sudden change breed resentment.\n\nI drew the talk back from the quarrel and asked them first to say to whom the matter at hand should be entrusted. To be willing to hear an argument is easy; to let the man who makes it take charge is where a real choice must be made."
 hd_yiguan.2203.a:0 "The Hu have Hu laws; the Han have Han institutions."
 hd_yiguan.2203.b:0 "Master, you speak wisely."
 hd_yiguan.2203.c:0 "The prattle of a pedantic Confucian. Throw him out of the tent."
 hd_yiguan.2211.t:0 "Humiliated by Hu Officials"
 hd_yiguan.2211.desc:0 "When my kinsman came home, there were bloodstains on his sleeve. Before I could learn what had happened, my clansmen rushed to tell me: an official sent by our overlord had flogged him in public and reviled the Han as nothing but slaves. Some wanted to go at once to demand redress; others had already shut the gate, afraid that if the dispute got out it would only bring heavier punishment.\n\nI had the injured man sit down and heard the whole story. Enduring in silence might keep my house safe for now, but we would still have to bear a resentment no one could voice; laying the rights and wrongs of it before our overlord would at least show I would not let my people be abused, though whether he would listen I could not be sure. Our dealings with the south were quietly raised once more.\n\nMy family never pressed me. Yet this circle of silent faces was waiting to see what means I still had to protect them."
 hd_yiguan.2211.a:0 "Swallow the insult and bear the burden, for now."
 hd_yiguan.2211.b:0 "Petition the overlord and argue on principle."
 hd_yiguan.2211.c:0 "Secretly reach out to the Southern Court and plan for the future."
 hd_yiguan.2212.t:0 "The Overlord's Levy"
 hd_yiguan.2212.desc:0 "When the levy order reached the district, several elders hurried to see me. They asked how many able-bodied men and how much grain must go this time, then counted out to me, one by one, those who had not come back from the last levy, saying there was still work in the fields and old and young at home; they truly could not bear another draft.\n\nOur overlord was pressing hard, and the bearer of the order still awaited a reply. Obeying would spare me any suspicion of defiance for now, but would do nothing to ease the exhaustion of the villages; petitioning for a reduction would mean voicing these people's hardships on their behalf. When the attendants had withdrawn, someone advised me in a low voice: why not send someone else to Jiangzuo to see how things stood?\n\nI had the elders leave the true circumstances of each household with me first. What tone to take in replying to our overlord, and what to say to those waiting outside the gate, could no longer be passed on to the next clerk."
 hd_yiguan.2212.a:0 "Obey the order dutifully; we dare not defy it."
 hd_yiguan.2212.b:0 "The people are exhausted; I ask that the levy be reduced."
 hd_yiguan.2212.c:0 "Send envoys to the Southern Court and seek another patron."
 hd_yiguan.2213.t:0 "Southern Voices Reach the North"
 hd_yiguan.2213.desc:0 "The young men of the clan had been reading an essay come up from the south, and it set off a debate over the figures of Jiangzuo: the gentlemen there, they said, could indulge in pure conversation at their leisure, unlike us, constrained at every turn. The elders hastily signaled with their eyes; seeing me enter, they put the scroll away, and the room was suddenly filled with nothing but deliberately hushed pleasantries.\n\nI told them there was no need to hide it. The elegance on paper was one thing, and the news that reached us was not necessarily all true; yet what they longed for was, in the end, a dignity they would rather not name aloud. Merely urging caution might spare us loose talk for now; petitioning our overlord, or sending men south, would each carry this discontent somewhere different.\n\nThe young men still watched my hands, waiting to see whether I would take the scroll away or give it back. I knew that what I was about to say would not be taken merely as talk of literary style."
 hd_yiguan.2213.a:0 "Guard your tongue! Careless words bring disaster."
 hd_yiguan.2213.b:0 "Hu and Han are one; the overlord should treat the Han well."
 hd_yiguan.2213.c:0 "Send men south to forge secret ties with Jiangzuo."
