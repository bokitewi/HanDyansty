l_english:
 rule_hd_yiguan_rule:0 "Southern Migration of the Gentry"
 setting_hd_yiguan_rule_on:0 "#high On#!"
 setting_hd_yiguan_rule_on_desc:0 "Once the north falls to the Hu, the realm enters the Southern Migration of the Gentry, lasting until the Central Plains are restored, the Hu are sinicized, the Central Plains are lost, or North and South are divided."
 setting_hd_yiguan_rule_off:0 "#high Off#!"
 setting_hd_yiguan_rule_off_desc:0 "The Southern Migration of the Gentry will not occur."
 situation_type_hd_yiguan_nandu:0 "Southern Migration of the Gentry"
 situation_type_hd_yiguan_nandu_desc:0 "Hu horsemen sweep south and the Central Plains are in turmoil. The great clans of the north, leading old and young, cross the Huai and the Yangtze and flee to Jiangzuo; the Han who remain in the north endure humiliation under Hu rule to survive, some holding out in fortified wubao, others rising in righteous revolt.\n\nSouthern rulers take in refugees, establish lodged provinces and commanderies, and train the Beifu Army; northern Hu rulers waver between repression and conciliation. This great migration will end in the restoration of the Central Plains, the fusion of Hu and Han, the loss of the Central Plains, or the division of North and South."
 hd_yiguan_phase_sangluan:0 "Upheaval"
 hd_yiguan_phase_sangluan_desc:0 "Wherever the Hu horsemen go, cities are reduced to ruins. The gentry and commoners of the north flee south in droves, and the roads are thronged with refugees leading old and young."
 hd_yiguan_phase_nandu:0 "Southern Crossing"
 hd_yiguan_phase_nandu_desc:0 "The refugees gradually settle in Jiangzuo. The court establishes lodged provinces and commanderies for the northerners, and gentry of north and south serve together at court, though not without friction."
 hd_yiguan_phase_duizhi:0 "Stalemate"
 hd_yiguan_phase_duizhi_desc:0 "North and South face each other across the Huai and the Yangtze. The south trains troops and stores grain, seeking restoration; in the north, Hu and Han live intermingled and righteous armies rise from time to time. Who holds the realm will be decided by what follows."
 hd_yiguan_sangluan_effects:0 "Upheaval"
 hd_yiguan_nandu_effects:0 "Southern Crossing"
 hd_yiguan_duizhi_effects:0 "Stalemate"
 hd_yiguan_nandu_sub_region_hd_yiguan_north:0 "Occupied Lands"
 hd_yiguan_nandu_sub_region_hd_yiguan_north_desc:0 "[counties|E] in the northern provinces whose people are still Huaxia but whose overlords are now Hu"
 hd_yiguan_nandu_sub_region_hd_yiguan_south:0 "Jiangzuo"
 hd_yiguan_nandu_sub_region_hd_yiguan_south_desc:0 "Jing and Yang Provinces"
 hd_yiguan_nandu_sub_region_hd_yiguan_front:0 "Front Line"
 hd_yiguan_nandu_sub_region_hd_yiguan_front_desc:0 "Lands of frontline Administrators bordering the occupied lands"
 hd_yiguan_nandu_participant_group_hd_yiguan_south_lord:0 "Southern Overlords"
 hd_yiguan_nandu_participant_group_hd_yiguan_south_lord_desc:0 "Independent Huaxia [rulers|E] of kingdom tier or above with lands in Jiangzuo"
 hd_yiguan_nandu_participant_group_hd_yiguan_front_duke:0 "Frontline Administrators"
 hd_yiguan_nandu_participant_group_hd_yiguan_front_duke_desc:0 "Independent duke-tier Huaxia [rulers|E] whose lands border the occupied lands"
 hd_yiguan_nandu_participant_group_hd_yiguan_south_vassal:0 "Southern Vassals"
 hd_yiguan_nandu_participant_group_hd_yiguan_south_vassal_desc:0 "Duke-tier or higher [vassals|E] under a southern overlord with lands in Jiangzuo"
 hd_yiguan_nandu_participant_group_hd_yiguan_hu_lord:0 "Hu Overlords"
 hd_yiguan_nandu_participant_group_hd_yiguan_hu_lord_desc:0 "Independent Hu [rulers|E] holding lands in the occupied lands"
 hd_yiguan_nandu_participant_group_hd_yiguan_han_vassal:0 "Han Vassals"
 hd_yiguan_nandu_participant_group_hd_yiguan_han_vassal_desc:0 "Duke-tier or higher [vassals|E] of Huaxia heritage within the occupied lands"
 hd_yiguan_nandu_hd_yiguan_south_lord:0 "Southern Migration: #weak Southern Overlord#!"
 hd_yiguan_nandu_hd_yiguan_front_duke:0 "Southern Migration: #weak Frontline Administrator#!"
 hd_yiguan_nandu_hd_yiguan_south_vassal:0 "Southern Migration: #weak Southern Vassal#!"
 hd_yiguan_nandu_hd_yiguan_hu_lord:0 "Southern Migration: #weak Hu Overlord#!"
 hd_yiguan_nandu_hd_yiguan_han_vassal:0 "Southern Migration: #weak Han Vassal#!"
 hd_yiguan_nanlai_county_modifier:0 "Southbound Households"
 hd_yiguan_nanlai_county_modifier_desc:0 "Northern refugees have come leading old and young; wasteland is gradually opened and households grow by the day."
 hd_yiguan_nanlai_big_county_modifier:0 "Southbound Households"
 hd_yiguan_nanlai_big_county_modifier_desc:0 "Every official boat ferried the northerners across; for a time the riverbank teemed with people and every barren field was tilled."
 hd_yiguan_qiaojun_county_modifier:0 "Lodged Commandery"
 hd_yiguan_qiaojun_county_modifier_desc:0 "Lodged northern commanderies and counties have been established here to settle refugees, with separate household registers and lighter taxes and corvee."
 hd_yiguan_liusan_county_modifier:0 "Scattered Households"
 hd_yiguan_liusan_county_modifier_desc:0 "The people have fled south together; nine homes in ten stand empty and the fields lie waste."
 hd_yiguan_wubao_county_modifier:0 "Wubao Fortresses"
 hd_yiguan_wubao_county_modifier_desc:0 "Local magnates have built fortified wubao for self-defense, where whole clans dwell together beyond the reach of Hu horsemen."
 hd_yiguan_buqu_modifier:0 "Refugee Retainers"
 hd_yiguan_buqu_modifier_desc:0 "This character has enrolled northern refugees as private retainers, providing ample manpower."
 hd_yiguan_fenzhi_modifier:0 "Separate Rule of Hu and Han"
 hd_yiguan_fenzhi_modifier_desc:0 "Hu and Han each have their own officials and follow their own customs."
 hd_yiguan_zhuoyong_modifier:0 "Promoting Han Scholars"
 hd_yiguan_zhuoyong_modifier_desc:0 "This character has brought Han gentry into their administration, relying on their mastery of statutes and rites."
 hd_yiguan_qiangya_modifier:0 "Suppressing the Han"
 hd_yiguan_qiangya_modifier_desc:0 "This character suppresses the Han with harsh laws and cruel punishments, and all regard them with fear."
 hd_yiguan_beifu_commander_modifier:0 "Beifu Commander"
 hd_yiguan_beifu_commander_modifier_desc:0 "The Beifu generals have been ordered to reorganize the army, and its elite troops grow by the day."
 hd_yiguan_beifu_yongbing_modifier:0 "Beifu Ascendancy"
 hd_yiguan_beifu_yongbing_modifier_desc:0 "The Beifu generals command powerful armies, and the court's orders scarcely reach Jingkou."
 hd_yiguan_pianan_modifier:0 "Content in Jiangzuo"
 hd_yiguan_pianan_modifier_desc:0 "With the Central Plains beyond recovery, ruler and ministers seek only to guard their borders and give the people rest in Jiangnan."
 hd_yiguan_ruzhu_modifier:0 "Master of the Central Plains"
 hd_yiguan_ruzhu_modifier_desc:0 "This character holds the old lands of the Central Plains, and their renown spreads far."
 hd_yiguan_heliu_modifier:0 "Fusion of Hu and Han"
 hd_yiguan_heliu_modifier_desc:0 "The barriers between Hu and Han gradually fade, and both are registered subjects alike."
 hd_yiguan_zhongxing_modifier:0 "Restoration"
 hd_yiguan_zhongxing_modifier_desc:0 "The royal army has recovered the old capital, and the realm looks up to the lord of the restoration."
 hd_yiguan_beiding_modifier:0 "Northern Pacification"
 hd_yiguan_beiding_modifier_desc:0 "This character took part in the campaign to recover the Central Plains, and their fame spreads far."
 hd_yiguan_fenzhi_south_modifier:0 "Division of North and South"
 hd_yiguan_fenzhi_south_modifier_desc:0 "North and South face each other across the river, each guarding its own borders."
 hd_yiguan_fenzhi_north_modifier:0 "Division of North and South"
 hd_yiguan_fenzhi_north_modifier_desc:0 "North and South face each other across the river, each guarding its own borders."
 hd_yiguan_chase_opinion:0 "Hunted Refugees"
 hd_yiguan_kin_south_opinion:0 "Kin Sent South"
 hd_yiguan_persuade_opinion:0 "Urged the People to Submit"
 hd_yiguan_report_opinion:0 "Informed on the Rebels"
 hd_yiguan_amnesty_native_opinion:0 "Pardoned the Rebels"
 hd_yiguan_forbear_opinion:0 "Patient Obedience"
 hd_yiguan_protest_opinion:0 "Argued on Principle"
 hd_yiguan_south_contact_opinion:0 "Ties with the South"
 hd_yiguan_favor_up_opinion:0 "Received Support"
 hd_yiguan_favor_down_opinion:0 "Was Slighted"
 hd_yiguan_tuduan_opinion:0 "Household Registration by Residence"
 hd_yiguan_beifu_split_opinion:0 "Divided Command"
 hd_yiguan_beifu_strip_opinion:0 "Stripped of Command"
 hd_yiguan_celestial_native_opinion:0 "Adopted Han Institutions"
 hd_yiguan_rebel_ally_opinion:0 "Sided with Rebels"
 hd_yiguan_refused_opinion:0 "Resentment at Being Turned Away"
 hd_yiguan_beifu:0 "Beifu Army"
 hd_yiguan_beifu_flavor:0 "#F Northern refugees around Jingkou and Guangling, hardened by long war, brave and heedless of death. Recruited as soldiers and named the Beifu, they won victory wherever they went.#!"
 hd_yiguan_uprising_army:0 "Righteous Army"
 hd_yiguan_liumin_army:0 "Refugee Army"
 hd_yiguan_uprising_cb:0 "Righteous Uprising"
 HD_YIGUAN_UPRISING_WAR_NAME:0 "[ATTACKER.GetShortUIName]'s Righteous Uprising"
 hd_yiguan_uprising_victory_desc:0 "[attacker.GetShortUIName|U] takes the contested commanderies and counties, rules them independently, and adopts the [GetGovernment('celestial_government').GetName]."
 hd_yiguan_uprising_white_peace_desc:0 "The righteous army lays down its arms and disperses."
 hd_yiguan_uprising_defeat_desc:0 "The righteous army is scattered, and the contested commanderies and counties remain with [defender.GetShortUIName]."
 hd_yiguan_guinan_cb:0 "Defect to the South"
 HD_YIGUAN_GUINAN_WAR_NAME:0 "[ATTACKER.GetShortUIName]'s Defection to the South"
 hd_yiguan_guinan_victory_desc:0 "[attacker.GetShortUIName|U] breaks away from [defender.GetShortUIName] and brings the whole province over to the Southern Court."
 hd_yiguan_guinan_white_peace_desc:0 "Both sides lay down their arms, and [attacker.GetShortUIName] still acknowledges [defender.GetShortUIName] as lord."
 hd_yiguan_guinan_defeat_desc:0 "[attacker.GetShortUIName|U] fails to defect to the South, and their reputation is ruined."
 hd_yiguan_guinan_decision:0 "Defect to the South"
 hd_yiguan_guinan_decision_desc:0 "Hu rule grows ever more cruel, while the Southern Court lies close at hand. If I raise the banner of righteousness and act in concert with the southern armies, I can bring my province back to Huaxia."
 hd_yiguan_guinan_decision_tooltip:0 "Rise up against your [liege|E] and join a bordering southern overlord"
 hd_yiguan_guinan_decision_confirm:0 "Bring the province over to the South!"
 hd_yiguan_guinan_decision_effect_tt:0 "You will rise up against your [liege|E], and a bordering southern overlord will send troops to aid you. #EMP If victorious, you will serve the Southern Court.#!"
 hd_yiguan_guinan_border_tt:0 "Your lands must border a southern overlord or a frontline Administrator"
 hd_yiguan_guinan_cd_tt:0 "Has not defected to the South in recent years"
 hd_yiguan_celestial_decision:0 "Establish the Celestial Government"
 hd_yiguan_celestial_decision_desc:0 "My dynasty has changed its dress and surname and fully adopted Han institutions. It is time to follow the statutes of the Central Plains and establish the Celestial system."
 hd_yiguan_celestial_decision_tooltip:0 "Adopt the [GetGovernment('celestial_government').GetName]"
 hd_yiguan_celestial_decision_confirm:0 "Found the institutions, establish the court!"
 hd_yiguan_celestial_decision_effect_tt:0 "You will adopt the [GetGovernment('celestial_government').GetName]."
 hd_yiguan_return_capital_decision:0 "Return to the Old Capital"
 hd_yiguan_return_capital_decision_desc:0 "The old capital has been recovered, and the ancestral temples and tombs all lie in the north. Only by returning to the old capital can we console our ancestors and show the realm where legitimacy rests."
 hd_yiguan_return_capital_decision_tooltip:0 "Move the capital to Luoyang or Chang'an"
 hd_yiguan_return_capital_decision_confirm:0 "Return to the old capital!"
 hd_yiguan_return_capital_hold_tt:0 "You must directly hold Luoyang or Chang'an"
 hd_yiguan_return_capital_already_tt:0 "Your capital is not yet in Luoyang or Chang'an"
 hd_yiguan_toast_start:0 "The north has fallen to the Hu, and the gentry flee south in droves."
 hd_yiguan_toast_phase2:0 "The southbound refugees have settled in Jiangzuo."
 hd_yiguan_toast_phase3:0 "North and South now stand opposed across the river."
 hd_yiguan_toast_restored:0 "The royal army has recovered the Central Plains; the Southern Migration of the Gentry is at an end."
 hd_yiguan_toast_sinicized:0 "The northern Hu have fully adopted Han institutions, and Hu and Han are becoming one."
 hd_yiguan_toast_lost:0 "The Central Plains have fallen wholly to the Hu; Jiangzuo clings to its corner of the realm."
 hd_yiguan_toast_partition:0 "The division of North and South is now settled."
 hd_yiguan.0001.t:0 "Southern Migration of the Gentry"
 hd_yiguan.0001.desc:0 "One dispatch after another brings news that Hu horsemen have overrun the Central Plains. The cities of the north fall one by one, and Hu kings are enthroned in the old palaces. The great clans, leading old and young, cross the Huai and the Yangtze and flee south; those who could not leave in time must endure humiliation under Hu rule to survive.\n\nThe ferry landings are crammed with carts and horses fleeing south, the robes of the gentry mingling with the rags of the common folk. The center of the realm is quietly shifting south."
 hd_yiguan.0001.a:0 "Whither goes the realm?"
 hd_yiguan.0002.t:0 "The Refugees Settle"
 hd_yiguan.0002.desc:0 "The upheaval has eased a little, and the southbound refugees have settled in Jiangzuo. The court has established lodged commanderies and counties for them, and the old northern clans rebuild their houses on new soil; gentry of north and south serve together at court, though not without friction."
 hd_yiguan.0002.a:0 "Let us settle in for now."
 hd_yiguan.0003.t:0 "North and South at a Standoff"
 hd_yiguan.0003.desc:0 "More than twenty years have passed, and the shape of North and South has grown clear. The south trains troops and stores grain; in the north, Hu and Han live intermingled; the two face each other across the Huai and the Yangtze. Debate over marching north or invading south has never ceased at court."
 hd_yiguan.0003.a:0 "There is time yet."
 hd_yiguan.0011.t:0 "The Central Plains Restored"
 hd_yiguan.0011.desc:0 "The royal army has marched north, and its banners fly once more over the walls of the Central Plains. The gentry exiled in Jiangnan gaze toward their homeland, and many weep openly. The years of the Southern Migration of the Gentry have come to an end."
 hd_yiguan.0011.a:0 "The old capital shines again!"
 hd_yiguan.0012.t:0 "Fusion of Hu and Han"
 hd_yiguan.0012.desc:0 "The Hu rulers of the north have changed their dress and surnames and adopted Han institutions, and the old divide between Hu and Han blurs by the day. The southern gentry still claim to be the seat of legitimacy, but the north is no longer the land of barbarian dust they remember."
 hd_yiguan.0012.a:0 "Where rites and music dwell, there is Huaxia."
 hd_yiguan.0013.t:0 "The Central Plains Lost"
 hd_yiguan.0013.desc:0 "The last Han strongholds of the north have fallen one after another, and the Central Plains belong wholly to the Hu. The ruler and ministers of Jiangzuo at last understand that the day of return is distant beyond hope; they can only preserve this corner of civilization in Jiangnan."
 hd_yiguan.0013.a:0 "The Divine Land has sunk; what can be done?"
 hd_yiguan.0014.t:0 "Division of North and South"
 hd_yiguan.0014.desc:0 "A century and a half has passed since the Southern Migration of the Gentry. Neither North nor South can swallow the other, and division across the river has become the norm. The sons of Jiangnan were long since born and raised here, and the old dream of the north lives on only in genealogies and poems."
 hd_yiguan.0014.a:0 "North and South, each to its own fate."
 hd_yiguan.1001.t:0 "Gentlefolk of Luoyang"
 hd_yiguan.1001.desc:0 "Carts and horses from the north crowd outside the city gates. At their head are several sons of old northern families; though their robes are worn, their speech still bears the air of renowned scholars of the Central Provinces. Behind them follow their families, retainers and dependent tenants, stretching beyond sight.\n\nThey ask you for a place to settle, and offer to serve in office."
 hd_yiguan.1001.a:0 "Welcome the scholars and settle their families."
 hd_yiguan.1001.b:0 "Take their retainers into the army."
 hd_yiguan.1001.c:0 "There is no room in the city; go elsewhere."
 hd_yiguan.1002.t:0 "Wanderers on the Road"
 hd_yiguan.1002.desc:0 "Since summer began, wave after wave of northern refugees has poured into your lands. Their clothes are in rags and they are starving; many of the old and weak have already fallen dead by the roadside. Reports from local officials grow more urgent with each one: if they are not settled soon, unrest may follow."
 hd_yiguan.1002.a:0 "Open the granaries to settle the refugees."
 hd_yiguan.1002.b:0 "Choose the able-bodied and enroll them as retainers."
 hd_yiguan.1002.c:0 "Close the passes and admit no refugees."
 hd_yiguan.1003.t:0 "Waiting to Cross the River"
 hd_yiguan.1003.desc:0 "Great crowds of refugees from the north have gathered on the north bank of the river. Ferries are few and people many; every day some drown fighting for a place, and their wailing can be heard across the water. Your officials propose sending more official boats across, but that would be no small expense."
 hd_yiguan.1003.d:0 "Send every official boat to ferry the northerners."
 hd_yiguan.1003.a:0 "Open the granaries for relief and ferry them in time."
 hd_yiguan.1003.b:0 "Choose the able-bodied and enroll them as retainers."
 hd_yiguan.1003.c:0 "River defense comes first; no unauthorized crossings."
 hd_yiguan.1101.t:0 "Striking the Oar Midstream"
 hd_yiguan.1101.desc:0 "[hd_yiguan_shuai.GetName] has come south to join you with several hundred households from his home district. In the north he rallied men for self-defense and repeatedly checked the Hu horsemen; while crossing the river, he struck his oar midstream and swore: if I do not cleanse the Central Plains and cross back, let me be as this great river.\n\nHe asks you for troops and provisions so that he may return north."
 hd_yiguan.1101.a:0 "Grant him a frontier county to guard the front."
 hd_yiguan.1101.b:0 "Keep him as a general to lead the refugees."
 hd_yiguan.1101.c:0 "Fund his northern expedition to seek restoration."
 hd_yiguan.1101.d:0 "This man is hard to control; better to refuse him."
 hd_yiguan.1102.t:0 "Refugee Patriarch"
 hd_yiguan.1102.desc:0 "[hd_yiguan_shuai.GetName] has led over a thousand households from his home district south. Amid the chaos in the north he was chosen as their patriarch; in times of famine he shared his grain with all, and in gratitude they swore to follow him to the death. He is steady and resourceful, able both to settle refugees and to reconcile all parties."
 hd_yiguan.1102.a:0 "Grant him a frontier county to settle the refugees."
 hd_yiguan.1102.b:0 "Keep him as a general to command his followers."
 hd_yiguan.1102.c:0 "Send him back north to seek restoration when the time is right."
 hd_yiguan.1102.d:0 "There is no land within our borders for them."
 hd_yiguan.1103.t:0 "Arrogant Troops, Fierce Commander"
 hd_yiguan.1103.desc:0 "[hd_yiguan_shuai.GetName] has entered your lands with a fierce refugee army. His men are mostly desperadoes from the north, savage in battle but utterly undisciplined, and there are already rumors of plunder along their way. He himself speaks arrogantly and asks a high price."
 hd_yiguan.1103.a:0 "Give him a county to keep his men in check."
 hd_yiguan.1103.b:0 "Take them under my banner and hold them on a tight rein."
 hd_yiguan.1103.c:0 "Drive them north to fight poison with poison."
 hd_yiguan.1103.d:0 "These men are tigers and wolves; they must not stay."
 hd_yiguan_shuai_refuse_tt:0 "#EMP This man may harbor resentment and rebel one day.#!"
 hd_yiguan.1111.t:0 "Refugee Revolt"
 hd_yiguan.1111.desc:0 "[hd_yiguan_shuai.GetName], whom you once turned away, has now raised troops within your own lands. He spreads word everywhere that you mistreat northerners, and desperate refugees flock to his banner."
 hd_yiguan.1111.a:0 "How dare this whelp!"
 hd_yiguan.1201.t:0 "Lodged Provinces and Commanderies"
 hd_yiguan.1201.desc:0 "Though their northern homeland has fallen, the gentry who came south still pride themselves on the commanderies of their origin. Someone has petitioned to establish a lodged [hd_yiguan_qiao_title.GetName], so that the exiles may have a jurisdiction to belong to, and so the realm will know you have not forgotten the north."
 hd_yiguan.1201.a:0 "Establish lodged provinces to bind men's hearts."
 hd_yiguan.1201.b:0 "This can be discussed later."
 hd_yiguan.1202.t:0 "Settling Households in Lodged Commanderies"
 hd_yiguan.1202.desc:0 "The refugees who came south live scattered everywhere; their registers are in disorder and taxes and corvee are hard to levy. Your officials propose choosing a place to establish lodged commanderies and counties, registering these northerners and governing them separately, with lighter taxes and corvee, so that they may settle and till the land in peace."
 hd_yiguan.1202.a:0 "Establish lodged commanderies to settle the refugees."
 hd_yiguan.1202.b:0 "The refugees should be entered in the local registers."
 hd_yiguan.1203.t:0 "Emigres versus Natives"
 hd_yiguan.1203.desc:0 "Another quarrel breaks out in the hall. The emigre gentry from the north look down on the old clans of Jiangnan and mock them as boorish; the great Wu clans of Jiangnan resent the northerners for taking their offices and fine fields. Each side holds to its own argument, and all watch to see where you stand."
 hd_yiguan.1203.a:0 "The northern gentry are the pillars of the state."
 hd_yiguan.1203.b:0 "The old clans of Jiangdong are the foundation of the state."
 hd_yiguan.1203.c:0 "Reward both richly and reconcile them."
 hd_yiguan.1210.t:0 "Household Registration by Residence"
 hd_yiguan.1210.desc:0 "The lodged commanderies and counties have stood for a long time. The refugees have long since bought land and settled in the south, yet still carry their northern commandery names and enjoy reduced taxes and corvee. Someone has petitioned to carry out registration by residence: abolish the lodged jurisdictions and enter all these people into the registers of the commanderies and counties where they live.\n\nThis would surely fill the treasury, but would also bitterly disappoint the northern gentry."
 hd_yiguan.1210.a:0 "Register them by residence, all alike."
 hd_yiguan.1210.b:0 "The northerners long to return; this cannot be rushed."
 hd_yiguan.1301.t:0 "Founding of the Beifu"
 hd_yiguan.1301.desc:0 "Around Jingkou and Guangling gather great numbers of northern refugees, hardened by long war and fierce fighters. Someone offers you a proposal: why not recruit these northerners on the spot and train an elite army to hold off the north?"
 hd_yiguan.1301.a:0 "Recruit the northerners as soldiers, and name them the Beifu."
 hd_yiguan.1301.a.tt:0 "#EMP During the Southern Migration of the Gentry, the Beifu Army can be recruited at Jingkou and Guangling.#!"
 hd_yiguan.1302.t:0 "A Famed Beifu General"
 hd_yiguan.1302.desc:0 "A valiant general has emerged in the Beifu Army: [hd_yiguan_beifu_general.GetName]. Born to a humble northern family, he always leads from the front in battle, and the Beifu soldiers would gladly die for him. Now the generals have put him forward to command the Beifu, awaiting only your nod."
 hd_yiguan.1302.a:0 "Entrust him with sole command of the Beifu."
 hd_yiguan.1302.b:0 "Military power must not rest in one man's hands."
 hd_yiguan.1303.t:0 "Beifu Ascendancy"
 hd_yiguan.1303.desc:0 "[hd_yiguan_beifu_general.GetName] has commanded the Beifu for many years, and his soldiers know only their general, not the court. Lately he has repeatedly defied transfer orders, and military reports from Jingkou grow ever scarcer. Your close ministers are deeply worried: should the Beifu turn disloyal, the capital will be in peril."
 hd_yiguan.1303.a:0 "Strip him of command to forestall disaster."
 hd_yiguan.1303.a.tt:0 "#EMP He may rise up in arms at Jingkou.#!"
 hd_yiguan.1303.b:0 "Grant him office and rank to set his heart at ease."
 hd_yiguan.1303.c:0 "Let him be for now."
 hd_yiguan.2001.t:0 "Han Flee South"
 hd_yiguan.2001.desc:0 "Another group of Han under your rule has fled. They took their families by night across the passes toward the south, leaving empty villages and unharvested fields behind. Your generals ask to send troops in pursuit."
 hd_yiguan.2001.a:0 "Send troops to bring them back, as a warning to others."
 hd_yiguan.2001.b:0 "Let them run; it's hardly worth mentioning."
 hd_yiguan.2001.c:0 "Lighten taxes and corvee to soothe those who remain."
 hd_yiguan.2002.t:0 "A Wubao Master Departs"
 hd_yiguan.2002.desc:0 "A Han wubao master of [hd_yiguan_occ_county.GetName] has abandoned his fortress and gone south with all its people. Before leaving he burned the fortress granary, declaring he would rather die than be a slave to the Hu."
 hd_yiguan.2002.a:0 "Send riders after him; let none escape."
 hd_yiguan.2002.b:0 "Let him go."
 hd_yiguan.2002.c:0 "Open the granaries to comfort the people and win their hearts."
 hd_yiguan.2003.t:0 "Frontier Counties Emptied"
 hd_yiguan.2003.desc:0 "Local officials report that more than half the Han of [hd_yiguan_occ_county.GetName] have fled, the fields lie waste, and not even taxes can be collected. Those who remain are watching too, waiting only for the chance to go south."
 hd_yiguan.2003.a:0 "Inspect the passes and fords strictly and hunt down the fugitives."
 hd_yiguan.2003.b:0 "Let things take their course."
 hd_yiguan.2003.c:0 "Open the granaries for relief and invite the fugitives back."
 hd_yiguan.2011.t:0 "The Clan Debates Going South"
 hd_yiguan.2011.desc:0 "The elders of the family have gathered to debate whether to send the clan's young men south to Jiangzuo. Staying in the north means living forever at the mercy of the Hu; yet how could they bear to leave the ancestral tombs and estates if the whole clan moved south? In the end, everyone turns to look at you."
 hd_yiguan.2011.a:0 "Send the young men south to preserve the ancestral rites."
 hd_yiguan.2011.b:0 "Hold out in our wubao; we will not leave our homeland."
 hd_yiguan.2011.c:0 "Counsel the villagers to serve our lord in peace."
 hd_yiguan.2012.t:0 "The Elders' Plea"
 hd_yiguan.2012.desc:0 "The elders of the district kneel at your gate, saying Hu soldiers have come again to requisition grain and press men into service, and many households can no longer survive. They beg you to decide: flee to the south, or build a wubao in the district for self-defense?"
 hd_yiguan.2012.a:0 "Send the young men south ahead of us."
 hd_yiguan.2012.b:0 "Build a wubao, gather the people, and swear to defend our home."
 hd_yiguan.2012.c:0 "Endure for now, and urge the people to submit."
 hd_yiguan.2013.t:0 "Secret Envoy of the Southern Court"
 hd_yiguan.2013.desc:0 "An envoy claiming to come from the Southern Court visits by night. He says the south holds places open for loyal and righteous men of the north; if you are willing, you may first send your young kinsmen south as a sign of good faith."
 hd_yiguan.2013.a:0 "Send the young kinsmen south with the envoy."
 hd_yiguan.2013.b:0 "The Southern Court is far; better to defend ourselves."
 hd_yiguan.2013.c:0 "Speak of this no more."
 hd_yiguan.2101.t:0 "Wubao Uprising"
 hd_yiguan.2101.desc:0 "[hd_yiguan_new_leader.GetName], a Han magnate of [hd_yiguan_occ_county.GetName], has risen in arms from his wubao, killed the officials you sent, and called on the district to drive out the Hu. As the news spreads, the Han nearby grow restless."
 hd_yiguan.2101.a:0 "Send troops to crush them!"
 hd_yiguan.2101.b:0 "Offer them office and win them over."
 hd_yiguan.2101.c:0 "Scatter his followers with money and goods."
 hd_yiguan.2102.t:0 "The Qihuo Army"
 hd_yiguan.2102.desc:0 "An armed refugee band calling itself the Qihuo Army, 'Beggars for Life', has appeared in [hd_yiguan_occ_county.GetName]. Once starving northerners who banded together to find food, they are now led by [hd_yiguan_new_leader.GetName], fighting from place to place as sworn enemies of the Hu."
 hd_yiguan.2102.a:0 "Wipe out the Qihuo to bring peace to the region."
 hd_yiguan.2102.b:0 "Take them into my service."
 hd_yiguan.2102.c:0 "Give them money and grain and have them disperse."
 hd_yiguan.2103.t:0 "Heroes Raise the Righteous Banner"
 hd_yiguan.2103.desc:0 "[hd_yiguan_new_leader.GetName] has raised the call in [hd_yiguan_occ_county.GetName], and Han from all around flock to answer. Under the banner of exterminating the Hu, he slaughters every Hu in his path, and his momentum far exceeds that of ordinary rebels."
 hd_yiguan.2103.a:0 "Send every soldier in the realm; they must be crushed!"
 hd_yiguan.2103.b:0 "Offer him high office to divide his strength."
 hd_yiguan.2103.c:0 "Bribe him richly to blunt his advance for now."
 hd_yiguan.2111.t:0 "Uprising in the Neighboring County"
 hd_yiguan.2111.desc:0 "In neighboring [hd_yiguan_up_county.GetName], men have risen against the Hu. Their leader [hd_yiguan_new_leader.GetName] has sent proclamations far and wide, calling on Han everywhere to raise the righteous banner together. Your overlord does not yet know where you stand, but one wrong step here could mean the destruction of your entire house."
 hd_yiguan.2111.a:0 "Raise the righteous banner together and drive out the Hu."
 hd_yiguan.2111.b:0 "Report to my overlord to prove my loyalty."
 hd_yiguan.2111.c:0 "Secretly send grain and weapons."
 hd_yiguan.2112.t:0 "Envoy of the Righteous Army"
 hd_yiguan.2112.desc:0 "An envoy of [hd_yiguan_new_leader.GetName], disguised as a peddler, slips quietly into your residence bearing a letter: the righteous army has risen in [hd_yiguan_up_county.GetName] and hopes only that you will raise the call and strike from within while they strike from without."
 hd_yiguan.2112.a:0 "Strike from within and join the righteous cause."
 hd_yiguan.2112.b:0 "Bind the envoy and hand him to my overlord."
 hd_yiguan.2112.c:0 "Supply them with grain and weapons, leaving no trace."
 hd_yiguan.2113.t:0 "An Old Friend's Invitation"
 hd_yiguan.2113.desc:0 "[hd_yiguan_new_leader.GetName], who has risen in arms, is an old acquaintance of yours. He sends word that when you studied together you vowed to uphold Huaxia; now the time has come, and he asks whether you still remember that pledge."
 hd_yiguan.2113.a:0 "I hold the old pledge in my heart; how could I betray it?"
 hd_yiguan.2113.b:0 "Times have changed; I must decline."
 hd_yiguan.2113.c:0 "Secretly lend my old friend a hand."
 hd_yiguan.2120.t:0 "Debate on Joining the South"
 hd_yiguan.2120.desc:0 "The righteous army has triumphed, and you have broken free of the Hu yoke. The south has sent envoys asking you to lead your people over and henceforth follow the calendar of the Southern Court. Others urge you to stand on your own rather than live under another's roof."
 hd_yiguan.2120.a:0 "Submit to the Southern Court and keep faith as a subject."
 hd_yiguan.2120.b:0 "Stand on our own; we need depend on no one."
 hd_yiguan.2201.t:0 "Hu and Han Dispute Land"
 hd_yiguan.2201.desc:0 "Hu tribes and Han farmers have clashed over land again. The Hu want to graze and the Han want to till, and several have died in the brawling. The leaders of both sides kneel before your tent, awaiting your judgment."
 hd_yiguan.2201.a:0 "Hu and Han shall be governed apart, each secure in his own livelihood."
 hd_yiguan.2201.b:0 "The Han are skilled at tilling the fields; put their strengths to use."
 hd_yiguan.2201.c:0 "The Han are cunning and stubborn; hold them on a tight rein."
 hd_yiguan.2202.t:0 "Hu Oppress the Han"
 hd_yiguan.2202.desc:0 "Warriors of your own people run rampant in the cities, plundering Han property and abusing Han women. The Han dare not voice their anger, yet in private they sing the songs of the south."
 hd_yiguan.2202.a:0 "Hu and Han shall keep to their own places and not trouble one another."
 hd_yiguan.2202.b:0 "Punish our own people to win the hearts of the Han."
 hd_yiguan.2202.c:0 "The Han grow resentful; it is time to show them our might."
 hd_yiguan.2203.t:0 "A Han Scholar Counsels"
 hd_yiguan.2203.desc:0 "A Han scholar speaks before you with great eloquence: an empire may be won on horseback, but it cannot be ruled from horseback. If you seek lasting peace and order, you must adopt the institutions of the Han and employ Han men of talent. Beside you, the generals of your own people sneer without end."
 hd_yiguan.2203.a:0 "The Hu have Hu laws; the Han have Han institutions."
 hd_yiguan.2203.b:0 "Master, you speak wisely."
 hd_yiguan.2203.c:0 "The prattle of a pedantic Confucian. Throw him out of the tent."
 hd_yiguan.2211.t:0 "Humiliated by Hu Officials"
 hd_yiguan.2211.desc:0 "The Hu officials sent by your overlord lord it over your lands, flogging your kin in public and declaring that the Han are nothing but slaves. Your clansmen are all watching you, waiting to see how you will respond."
 hd_yiguan.2211.a:0 "Swallow the insult and bear the burden, for now."
 hd_yiguan.2211.b:0 "Petition the overlord and argue on principle."
 hd_yiguan.2211.c:0 "Secretly reach out to the Southern Court and plan for the future."
 hd_yiguan.2212.t:0 "The Overlord's Levy"
 hd_yiguan.2212.desc:0 "Once again the overlord has ordered a levy of the able-bodied men and grain of your lands, claiming it is for a southern campaign. Yet few of those taken ever return, and the villages are filled with complaints."
 hd_yiguan.2212.a:0 "Obey the order dutifully; we dare not defy it."
 hd_yiguan.2212.b:0 "The people are exhausted; I ask that the levy be reduced."
 hd_yiguan.2212.c:0 "Comply in public, defy in secret, and send envoys south."
 hd_yiguan.2213.t:0 "Southern Voices Reach the North"
 hd_yiguan.2213.desc:0 "Poems and news from the south have made their way north by winding paths. The refined gentry culture of Jiangzuo fills your clansmen with longing, and some whisper in private: rather than eke out a life under Hu rule, better to make plans early."
 hd_yiguan.2213.a:0 "Guard your tongue! Careless words bring disaster."
 hd_yiguan.2213.b:0 "Hu and Han are one; the overlord should treat the Han well."
 hd_yiguan.2213.c:0 "Send men south to forge secret ties with Jiangzuo."
 hd_yiguan.3101.t:0 "A Province Comes Over"
 hd_yiguan.3101.desc:0 "[hd_yiguan_gn_vassal.GetName] in the north has risen against the Hu and sent envoys, offering to bring the entire province over to you. You have already sent troops north to meet them."
 hd_yiguan.3101.a:0 "The royal army marches north to receive the righteous!"
