l_english:
 hd_j16.5800.t:0 "Taking the Throne at Zhongshan"
 hd_j16.5800.desc:0 "Old servants of Yan arrive from every quarter, and the streets of Zhongshan are crowded with officials. The ministers jointly petition you: the Qin ruler is dead, the Mandate has returned to Yan, and you should take the imperial title to settle the hearts of Hebei."
 hd_j16.5800.a:0 "Take the imperial throne and proclaim the era Jianxing."
 hd_j16.5800.b:0 "Remain King of Yan for now."
 hd_j16.5810.t:0 "A New Master for Western Yan"
 hd_j16.5810.desc:0 "After Murong Chong's death the Xianbei in Guanzhong raised one leader after another and murdered them just as quickly. At last they settled on [hd_news_a.GetName], who led the whole Xianbei host out of Chang'an and eastward, looking for a foothold in Hedong and Shangdang."
 hd_j16.5810.desc_player:0 "After Murong Chong's death the Xianbei in Guanzhong grew restless, and more than one plot to raise a new leader was crushed by [hd_news_a.GetName]. The whole Xianbei host now longs to go home to the east, and Hedong and Shangdang are where their eyes turn."
 hd_j16.5820.t:0 "Kuduo Contends for the Throne"
 hd_j16.5820.desc:0 "Your uncle Tuoba Kuduo has marched south with troops lent by Liu Xian of the Dugu, and many tribes quietly favor him; even men close to you are wavering. The Helan cannot be relied upon. The only power that can send help is Yan at Zhongshan."
 hd_j16.5820.a:0 "Send envoys to Zhongshan and ask Yan for troops."
 hd_j16.5820.b:0 "Settle this ourselves, without outside help."
 hd_j16.5840.t:0 "March on Western Yan"
 hd_j16.5840.desc:0 "[hd_j16_e4b_xy.GetName] has gathered the Xianbei who came east out of Guanzhong and set up a realm of their own, so the land now has two Yans. With Hebei at peace, our hands are free to strike west and bring the old Murong lands back under one house."
 hd_j16.5840.a:0 "Advance on Western Yan by several roads."
 hd_j16.5840.b:0 "Delay the western campaign and watch."
 hd_j16.5841.t:0 "Yan Troops at the Border"
 hd_j16.5841.desc:0 "Scouts report that the Yan army of [hd_j16_e4b_yan.GetName] is moving west by several routes. Troops have been seen in the passes of the Taihang, all heading for our lands."
 hd_j16.5841.a:0 "Hold the strongpoints."
 hd_j16.5850.t:0 "Enthroned at Niuchuan"
 hd_j16.5850.desc:0 "The tribal chiefs met at Niuchuan and made you King of Dai. Your following grows by the day, and the chief clerk Zhang Gun and others urge you to take the title King of Wei, to show you are more than a chief of the old Dai tribes."
 hd_j16.5850.a:0 "Take the title King of Wei."
 hd_j16.5850.b:0 "Remain King of Dai."
 hd_j16.5860.t:0 "Against the Tiefu"
 hd_j16.5860.desc:0 "Liu Weichen sent his son Liu Zhilidi against us and was driven back. The Tiefu sit across the Yellow River and have never kept faith with our house. While they reel from defeat, we can cross the river and end this threat for good."
 hd_j16.5860.a:0 "Cross the river at Wuyuan and strike at Yueba."
 hd_j16.5860.b:0 "Hold the army back for now."
 hd_j16.5861.t:0 "Wei Crosses the River"
 hd_j16.5861.desc:0 "The Wei army has crossed the river at Wuyuan, and its vanguard is close to our tents. The people are panicking, and some are already thinking of going over to another master."
 hd_j16.5861.a:0 "Gather the people and meet them."
 hd_j16.5870.t:0 "Taking the Throne at Chang'an"
 hd_j16.5870.desc:0 "The old capital of Qin is ours. The generals ask you to follow the old Qin forms, take the imperial title, and command Guanzhong. Yin Wei and others say that only a settled title will settle men's hearts."
 hd_j16.5870.a:0 "Take the throne at Chang'an and proclaim the era Jianchu."
 hd_j16.5870.b:0 "Remain King of Qin for now."
 hd_j16.5880.t:0 "Battle at Feiqiao"
 hd_j16.5880.desc:0 "[hd_j16_e4b_fd.GetName] keeps coming with the remnants of Former Qin, carrying Fu Jian's spirit tablet and swearing to fight to the death. Scouts say the enemy has marched east with everything they have and little grain. If we seize Feiqiao and its water first, we can wait for their army to fall apart."
 hd_j16.5880.a:0 "Hold Feiqiao and let them come to us."
 hd_j16.5880.b:0 "Rest the army and watch."
 hd_j16.5881.t:0 "The Yao Army Attacks"
 hd_j16.5881.desc:0 "The army of [hd_j16_e4b_hq.GetName] has taken Feiqiao first and cut us off from water. Our men are short of water and grain, and their spirit is failing."
 hd_j16.5881.a:0 "Form up and fight to the death."
 hd_j16.5890.t:0 "Raised by the Chiefs"
 hd_j16.5890.desc:0 "Qifu Guoren is dead and his son is too young. The people fear there is no one to lead them, and the chiefs come together to ask you to take his place and hold Yuanchuan."
 hd_j16.5890.desc_ruler:0 "Qifu Guoren is dead and his people are already yours. The chiefs come together to ask you to take a proper title as Prince of Henan and settle the hearts of Yuanchuan."
 hd_j16.5890.a:0 "Accept and reign as Prince of Henan."
 hd_j16.5890.b:0 "Decline and serve Guoren's heir."
 hd_j16.5890.c:0 "Titles can wait. I will not claim the princely style yet."
 hd_j16.5892.t:0 "King of the Three Rivers"
 hd_j16.5892.desc:0 "Since your return from the Western Regions you have held Guzang firmly, and the commanderies of Hexi have submitted. Your staff urge you to take a title of your own to govern the lands of the Three Rivers."
 hd_j16.5892.a:0 "Take the title King of the Three Rivers and proclaim the era Linjia."
 hd_j16.5892.b:0 "Remain Governor of Liang."
 hd_j16.5894.t:0 "King of Qin"
 hd_j16.5894.desc:0 "Most of the tribes of Longyou have submitted, and Yuanchuan grows stronger every year. Your ministers ask you to take the title King of Qin and carry on the name of Qin."
 hd_j16.5894.a:0 "Take the title King of Qin."
 hd_j16.5894.b:0 "Remain Prince of Henan."
 hd_j16_yanwei_peace_modifier:0 "Yan-Wei Accord"
 hd_j16_yanwei_peace_modifier_desc:0 "Yan and Wei are allied states and have agreed not to attack each other."
 hd_j16_xiyan_dongjin_modifier:0 "Western Yan Moves East"
 hd_j16_xiyan_dongjin_modifier_desc:0 "The Xianbei have left Guanzhong for the east and urgently need land to settle."
 hd_j16_yanwei_peace_opinion:0 "Yan-Wei Accord"
 hd_j16_helan_support_opinion:0 "Raised at Niuchuan"
 hd_j16_e4b_army_xiyan_name:0 "Yan Western Expedition"
 hd_j16_e4b_army_tiefu_name:0 "Wei Western Expedition"
 hd_j16_e4b_army_feiqiao_name:0 "Yao Army"
