 hd_unity.0001.t: "Strife Within the Family"
 hd_unity.0001.desc: "Your family is divided. Its branches quarrel endlessly over offices, estates, and appointments secured through family privilege, with the branch of [hd_unity_branch.GetShortUIName] especially vocal. Reports of secret alliances and mutual accusations have reached you. Unless you act, this family disgrace may soon become public."
 hd_unity.0001.a: "Gather the family and mediate."
 hd_unity.0001.b: "[hd_unity_branch.GetShortUIName]'s branch has a point."
 hd_unity.0001.c: "These household trifles need no attention."
 hd_unity.0002.t: "A Tall Tree Catches the Wind"
 hd_unity.0002.desc: "Your family stands united and prospers, its members filling offices at court and throughout the provinces and commanderies. Yet prosperity invites a fall. [hd_unity_liege.GetShortUIName] has lately grown suspicious of your family, and voices at court have begun to warn: \"Powerful clans must be watched.\""
 hd_unity.0002.a: "Restrain the younger generation and keep a low profile."
 hd_unity.0002.b: "Offer a generous gift to demonstrate our loyalty."
 hd_unity.0002.c: "An innocent conscience needs no defense."
 hd_unity.0003.t: "A Separate Household"
 hd_unity.0003.desc: "Disunity has long troubled the family. The branch of [hd_unity_branch.GetShortUIName] has repeatedly asked to establish a household and lineage of its own. Force them to stay, and you risk harming the bonds of kinship; let them go, and the family may gradually decline."
 hd_unity.0003.a: "Allow them to leave and found a separate branch."
 hd_unity.0003.b: "Family law forbids this division."
 hd_unity.0003.c: "Set this matter aside for now."
