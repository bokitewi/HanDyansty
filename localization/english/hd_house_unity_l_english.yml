 hd_unity.0001.t: "Discord Within the House"
 hd_unity.0001.desc: "The branches of our house bicker over posts, estates and patronage, and the branch of [hd_unity_branch.GetShortUIName] most of all. Their scheming and mutual slander has reached my ears. If I do nothing, our dirty laundry will soon be public."
 hd_unity.0001.a: "Gather the kin and mediate"
 hd_unity.0001.b: "Side with [hd_unity_branch.GetShortUIName]"
 hd_unity.0001.c: "A family matter. Ignore it"
 hd_unity.0002.t: "The Tall Tree Draws the Wind"
 hd_unity.0002.desc: "Our house is united and prosperous, with kin in every court office and province. But the higher we rise, the more [hd_unity_liege.GetShortUIName] eyes us with suspicion, and courtiers whisper that great houses must be watched."
 hd_unity.0002.a: "Restrain the kin and keep a low profile"
 hd_unity.0002.b: "Send lavish gifts to show loyalty"
 hd_unity.0002.c: "A clear conscience needs no answer"
 hd_unity.0003.t: "Founding a Separate Branch"
 hd_unity.0003.desc: "Our house has been drifting apart for years, and [hd_unity_branch.GetShortUIName] has repeatedly asked to found a separate branch. Forbidding it would hurt our bonds; letting things slide will only weaken the house further."
 hd_unity.0003.a: "Let them found their own branch"
 hd_unity.0003.b: "Hold them to house law"
 hd_unity.0003.c: "Nothing can be done"
