l_english:
 hd_popclean_decision:0 "Remove Excess Characters"
 hd_popclean_decision_desc:0 "The courts and roads of the realm teem with nameless wanderers. Remove a group of landless courtiers and wanderers with no dynasty to reduce the game’s workload."
 hd_popclean_decision_tooltip:0 "Remove 7,000 landless courtiers and wanderers with no dynasty."
 hd_popclean_decision_confirm:0 "Remove Them"
 hd_popclean_decision_effect_tt:0 "Over the next three months, 7000 courtiers and wanderers without dynasty or land will silently vanish. Courts of counts and barons outside hegemonies are purged first, along with tribal, feudal, nomadic and herder courts; courts of dukes and above within hegemonies are unaffected. Rulers' spouses, concubines and children, current councillors of duke-level or higher courts, officials, knights and commanders, historical figures, and those of outstanding skill or good congenital traits are always kept."
 hd_popclean_message_title:0 "Character Cleanup Scheduled"
 hd_popclean_message_desc:0 "Over the next three months, [GetGlobalVariable('hd_popclean_scheduled').GetValue|0] people will silently vanish."
