l_english:
 hd_popclean_decision:0 "Purge Surplus Population"
 hd_popclean_decision_desc:0 "The courts and roads of the realm teem with nameless nobodies. Purge a batch of courtiers and wanderers without dynasty or land to lighten the game's load."
 hd_popclean_decision_tooltip:0 "Purge 7000 courtiers and wanderers without dynasty or land."
 hd_popclean_decision_confirm:0 "Purge"
 hd_popclean_decision_effect_tt:0 "Over the next three months, 7000 courtiers and wanderers without dynasty or land will silently vanish. Courts of counts and barons outside hegemonies are purged first, along with tribal, feudal, nomadic and herder courts; courts of dukes and above within hegemonies are unaffected. Rulers' spouses, concubines and children, current councillors, officials, knights and commanders, historical figures, and those of outstanding skill or good congenital traits are always kept."
 hd_popclean_message_title:0 "Population Purge Scheduled"
 hd_popclean_message_desc:0 "Over the next three months, [GetGlobalVariable('hd_popclean_scheduled').GetValue|0] people will silently vanish."
