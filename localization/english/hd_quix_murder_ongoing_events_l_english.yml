l_english:
 murder_event_title:0 "Assassination:"
 quix_murder_ongoing.3010.t:0 "$murder_event_title$ Sadistic Assassin"
 quix_murder_ongoing.3010.desc_opening:0 "[agent_in_question.GetTitledFirstName] seems to have invested too much passion in this murder."
 quix_murder_ongoing.3010.desc_hero:0 "Every plan proposed by [agent_in_question.GetTitledFirstName] pursues torment, making the killing of [scheme.GetTarget.GetTitledFirstName] a secondary objective. This cruelty has enraged [agent_hero_of_the_moment.GetTitledFirstName]—[scheme.GetTarget.GetTitleAsNamePossessiveNoTooltip][target.Custom2('RelationToMe', SCOPE.sC('agent_hero_of_the_moment'))]. Without restraint, both are likely to ruin the entire scheme."
 quix_murder_ongoing.3010.desc:0 "Every plan proposed by [agent_in_question.GetTitledFirstName] pursues torment, making the killing of [scheme.GetTarget.GetTitledFirstName] a secondary objective. While [agent_in_question.GetHerHis]'s abilities are indeed useful, such cruelty could also expose the entire operation."
 quix_murder_ongoing.3010.a:0 "[agent_in_question.GetFirstNameNoTooltip]This enthusiasm should be a model for all of us!"
 quix_murder_ongoing.3010.a.success:0 "This obsession of [agent_in_question.GetHerHis|U] is priceless."
 quix_murder_ongoing.3010.a.failure:0 "[agent_in_question.GetSheHe|U] exposed [agent_in_question.GetHerselfHimself]"
 quix_murder_ongoing.3010.b:0 "[agent_in_question.GetTitledFirstNameNoTooltip] will be tied up with a leather strap."
 quix_murder_ongoing.3010.c:0 "We cannot bear any responsibility."
 quix_murder_ongoing.3301.t:0 "$murder_event_title$ Foolish Conspiracy"
 quix_murder_ongoing.3301.desc:0 "I went to great lengths to arrange a secret meeting with my co-conspirators to discuss how to kill [target.GetTitledFirstName]. However, the debate lasted all night; we failed to reach any agreement and became even more hesitant than before."
 quix_murder_ongoing.3301.a:0 "Why is there such a complicated matter!?"
