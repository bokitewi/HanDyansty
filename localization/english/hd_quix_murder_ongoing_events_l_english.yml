l_english:
 murder_event_title:0 "Murder:"
 quix_murder_ongoing.3010.t:0 "$murder_event_title$ A Sadistic Assassin"
 quix_murder_ongoing.3010.desc_opening:0 "[agent_in_question.GetTitledFirstName] seems rather too enthusiastic about this murder."
 quix_murder_ongoing.3010.desc_hero:0 "Every plan [agent_in_question.GetTitledFirstName] proposes puts torture first; killing [scheme.GetTarget.GetTitledFirstName] seems almost an afterthought. This cruelty has enraged [agent_hero_of_the_moment.GetTitledFirstName], [scheme.GetTarget.GetTitleAsNamePossessiveNoTooltip] [target.Custom2('RelationToMe', SCOPE.sC('agent_hero_of_the_moment'))]. Unless kept in check, both could ruin the entire plot."
 quix_murder_ongoing.3010.desc:0 "Every plan [agent_in_question.GetTitledFirstName] proposes centers on torture; killing [scheme.GetTarget.GetTitledFirstName] seems almost an afterthought. [agent_in_question.GetHerHis|U] skills are useful, but such cruelty could expose the entire plot."
 quix_murder_ongoing.3010.a:0 "Let [agent_in_question.GetFirstNameNoTooltip]'s enthusiasm be an example to us all!"
 quix_murder_ongoing.3010.a.success:0 "[agent_in_question.GetHerHis|U] obsession is a priceless asset."
 quix_murder_ongoing.3010.a.failure:0 "[agent_in_question.GetSheHe|U] gives [agent_in_question.GetHerselfHimself] away"
 quix_murder_ongoing.3010.b:0 "Bind [agent_in_question.GetTitledFirstNameNoTooltip] with leather straps."
 quix_murder_ongoing.3010.c:0 "We will accept no responsibility for this."
 quix_murder_ongoing.3301.t:0 "$murder_event_title$ An Inconclusive Council"
 quix_murder_ongoing.3301.desc:0 "After considerable difficulty, you secretly gather your accomplices to discuss how to eliminate [target.GetTitledFirstName]. Yet an entire night of argument yields no agreement. If anything, everyone leaves more hesitant than before."
 quix_murder_ongoing.3301.a:0 "Why must this be so difficult?!"
