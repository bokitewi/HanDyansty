 dynasty_celestial_favor_interaction_modifier:0 "Grace of the Son of Heaven"
 WJ_bizhao_modifier:0 "Summoned to Office"
 WJ_bizhao_modifier_desc:0 "This character was summoned onto the staff by the head of an office, entering officialdom thereby, and honors that patron as their mentor."
 WJ_maocai_modifier:0 "Recommended as Flourishing Talent"
 WJ_maocai_modifier_desc:0 "This character was recommended as Flourishing Talent; their talent is valued by the provinces and commanderies, and their career runs more smoothly than most."
 WJ_refused_bizhao_modifier:0 "Refused a Summons"
 WJ_refused_bizhao_modifier_desc:0 "This character declined a summons to office, indifferent to fleeting favor, and their reputation grew all the greater for it."
 WJ_temp_official_modifier:0 "Acting Probationary Official"
 WJ_temp_official_modifier_desc:0 "This character has no qualification by summons, Filial and Incorrupt, or Flourishing Talent, yet already holds a real post, and so can only serve as an acting probationer: the pay is meager, and colleagues hold them in some contempt."
 WJ_xiaolian_modifier:0 "Recommended as Filial and Incorrupt"
 WJ_yinshi_local_modifier:0 "Recluse's Influence"
 WJ_yinshi_local_modifier_desc:0 "A recluse reads and lectures here, and local customs grow steadily purer."
