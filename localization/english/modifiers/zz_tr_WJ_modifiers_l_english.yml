l_english:
 WJ_xiaolian_modifier_desc:0 "This character was once recommended as Filial and Incorrupt and holds a formal qualification for office."
 WJ_dd_execution_modifier:0 "Executing an Officer to Consecrate the Banner"
 WJ_dd_execution_modifier_desc:0 "Military law has stiffened the ranks, and orders are obeyed throughout the army."
 WJ_dd_public_crime_modifier:0 "Violated Military Law"
 WJ_dd_public_crime_modifier_desc:0 "This character once broke military law; the crime remains on record and has not yet been pardoned."
 wj_kaoke_duties_boundaries_modifier:0 "Clear Field Boundaries"
 wj_kaoke_duties_boundaries_modifier_desc:0 "Old deeds and field boundaries have been fairly settled, and the villagers again trust the government to uphold justice."
 wj_kaoke_duties_exactions_modifier:0 "Harsh Exactions"
 wj_kaoke_duties_exactions_modifier_desc:0 "Officials have profited from grain taxes, land suits, or corvée, filling the villagers with resentment toward the government."
 wj_kaoke_duties_post_roads_modifier:0 "Orderly Post Duties"
 wj_kaoke_duties_post_roads_modifier_desc:0 "Transport and corvée are well arranged, the post stations keep running, and the farmers keep their time for the fields."
 wj_kaoke_duties_relief_modifier:0 "Verified Disaster Relief"
 wj_kaoke_duties_relief_modifier_desc:0 "Local officials verified the disaster and spared afflicted households extra levies, so the villages could farm in peace."
 WJ_kaoke_bad_modifier:0 "Failing Evaluation"
 WJ_kaoke_bad_modifier_desc:0 "The evaluation records show more failures than successes. The officials have cut their salary and ordered them to put their administration in order."
 WJ_kaoke_poor_modifier:0 "Poor Evaluation"
 WJ_kaoke_poor_modifier_desc:0 "The officials fault their incomplete handling of affairs and have temporarily suppressed their merit and salary, to see how they fare hereafter."
