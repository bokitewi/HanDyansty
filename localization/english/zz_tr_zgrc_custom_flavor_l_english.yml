 # 2026-11-01 汉地风俗 1.5.3（创意工坊 3812432062）并入的新键
 zgrc_custom_flavor.0001.t:0 "Notes on Customs"
 zgrc_custom_flavor.0001.desc:0 "The village elders come to tell me that this year's gathering of customs has its rites set, and they ask [ROOT.Char.GetName] to attend.\n\n(Placeholder text: a traditional flavour event sample, used to verify the custom event background.)"
 zgrc_custom_flavor.0001.a:0 "Very well. Let us go and see."
 zgrc_custom_flavor.1001.t:0 "A Shaman at the Door"
 zgrc_custom_flavor.1001.desc:0 "A shaman stands at my door, road-dust on him, and the moment he opens his mouth I hear the Chu burr.\n\nThe men of Chu honour ghosts; a shaman or two about the village is nothing strange. What is strange is that he calls [zgrc_hun_target.GetName] by name.\n\n“The body is still here. The soul is gone.” He peers past me into the house. “This is no sickness. It is a loss — and I have a way with it.”\n\nThen he tucks his hands into his sleeves and says no more, as if waiting to see how much sincerity is in me."
 zgrc_custom_flavor.1001.a:0 "Come in. You will not find me short on incense money."
 zgrc_custom_flavor.1001.b:0 "Nonsense."
 zgrc_custom_flavor.1002.t:0 "O Soul, Come Back"
 zgrc_custom_flavor.1002.desc:0 "An open place, the night black as ink.\n\nI do as the shaman taught me, and call the name of [zgrc_hun_target.GetName]:\n\n“O soul, come back!”\n“Why leave your body and wander to the four quarters?”\n\nMy voice scatters into the dark. The fields are silent."
 zgrc_custom_flavor.1002.a:0 "O soul, come back!"
 zgrc_custom_flavor.1002.b:0 "Nothing but flowers in a mirror."
 zgrc_custom_flavor.1003.t:0 "Which Way the Soul Goes"
 zgrc_custom_flavor.1003.desc:0 "Somewhere in the haze a call comes from very far away. Once. Again.\n\nI know that voice — it is [zgrc_hun_helper.GetName].\nHe is calling my name.\n\nI seem to have been out of my body a long time, and I do not know where I stand. The four quarters are dim; only a thread of light shows the way.\n\nWhich way do I go?"
 zgrc_custom_flavor.1003.dong:0 "East?"
 zgrc_custom_flavor.1003.nan:0 "South?"
 zgrc_custom_flavor.1003.xi:0 "West?"
 zgrc_custom_flavor.1003.bei:0 "North?"
 zgrc_custom_flavor.1003.none:0 "All four quarters walked; nowhere left for the soul."
 zgrc_custom_flavor.1004.t:0 "The Soul Wanders"
 zgrc_custom_flavor.1004.desc_dong:0 "The East is no place to tarry.\nGiants a thousand fathoms tall go hunting souls.\nTen suns rise in turn, melting metal and dissolving stone.\nMen there are used to it; a soul would surely be undone.\nCome back! You cannot tarry there.\n\nI follow the thread of light. Beneath my feet, an endless golden waste."
 zgrc_custom_flavor.1004.desc_nan:0 "The South is no place to rest.\nVipers in swarms, great foxes a thousand miles.\nThe great serpent has nine heads, swift as the wind, and swallows men to glut its heart.\nCome back! Do not linger there.\n\nI follow the thread of light. The wind is all scorching heat and sweet rank stench."
 zgrc_custom_flavor.1004.desc_xi:0 "The West — shifting sands a thousand miles.\nWhirled into the Thunder Pit, scattered, and no way to stop.\nIf by luck you escape, outside lies a vast empty void.\n\nI follow the thread of light. Visions pile upon visions, like water, like glass."
 zgrc_custom_flavor.1004.desc_bei:0 "The North is no place to rest.\nHeaped ice towering, flying snow a thousand miles.\nCome back! Do not stay long.\n\nI follow the thread of light. Between heaven and earth, only wind and snow."
 zgrc_custom_flavor.1004.a:0 "Follow the voice."
 zgrc_custom_flavor.1005.t:0 "Return to the Old Abode"
 zgrc_custom_flavor.1005.desc:0 "A call arrives, and it draws me back as if by a rope.\n\nMy eyes fly open. First my fingers move, then my arms — limb by limb I am my own again. I nearly laugh out loud.\n\nThe call still rings in my ears. It is [zgrc_hun_helper.GetName]'s voice.\n\nIt was him — call after call — who brought me back from the four quarters."
 zgrc_custom_flavor.1005.a:0 "I must go and thank him."
 zgrc_custom_flavor.1006.t:0 "Reunion"
 zgrc_custom_flavor.1006.desc:0 "Someone is at the door.\n\nIt is [zgrc_hun_target.GetName], holding on to the door frame, still pale, still short of breath.\n\nWhen he sees me, something lights in his eyes. The name I called a thousand times these days now stands before me."
 zgrc_custom_flavor.1006.a:0 "You have come back at last."
 zgrc_custom_flavor.1007.t:0 "Reunion"
 zgrc_custom_flavor.1007.desc:0 "I followed the voice.\n\nAnd there he was — as if he had called a thousand times already. When he saw me, his lips moved, but nothing came out.\n\nA thousand mountains, ten thousand miles — and still I came back."
 zgrc_custom_flavor.1007.a:0 "I am back."
 zgrc_custom_flavor.1008.t:0 "Into the Silence Again"
 zgrc_custom_flavor.1008.desc:0 "The call has stopped.\n\nAt first I waited for the next one, for it to come again. But the wilderness is silent — not one more call.\n\nThe dark of the four quarters closes in again and covers the last thread of light.\n\nSilence. Silence again."
 zgrc_custom_flavor.1008.a:0 "…"
 zgrc_custom_flavor.1011.t:0 "A Shaman at the Door"
 zgrc_custom_flavor.1011.desc:0 "The shaman of Chu is at my door again, road-dust on his face.\n\nI speak the name of [zgrc_hun_target.GetName]. He narrows his eyes and shakes his head.\n\n“The dead are long scattered to the four quarters. A living man you may call back. A dead one, no — that much I will tell you straight.”\n\n“But —” he pauses, and tucks his hands into his sleeves, “if your sincerity is real, I will teach you the way all the same.”\n\nHe says nothing more. He only waits."
 zgrc_custom_flavor.1011.a:0 "Call him, then. You will not find me short on incense money."
 zgrc_custom_flavor.1011.b:0 "A man dies as a lamp goes out. Let it be."
 zgrc_custom_flavor.1012.t:0 "O Soul, Come Back"
 zgrc_custom_flavor.1012.desc:0 "I do as the shaman taught me, and call the name of [zgrc_hun_target.GetName]:\n\n“O soul, come back!”\n“Return to your old abode.”\n\nThe wilderness says nothing."
 zgrc_custom_flavor.1012.a:0 "O soul, come back!"
 zgrc_custom_flavor.1012.b:0 "Nothing but flowers in a mirror."
 zgrc_custom_flavor.3101.t:0 "A Crack in the Shadowed Cliff"
 zgrc_custom_flavor.3101.desc:0 "A hairline crack in the rock; cold air seeps out of it, carrying the smell of iron.\n\nFlakes of rust lie in the cleft. Half the steps have fallen away, and grass grows out of the seams.\n\nIron is not a smell that stone should have."
 zgrc_custom_flavor.3101.a:0 "Go in and look."
 zgrc_custom_flavor.3101.b:0 "Leave the ill thing alone."
 zgrc_custom_flavor.3102.t:0 "The Cold Spring Casket"
 zgrc_custom_flavor.3102.desc:0 "It is cold enough in the cave that my breath shows.\n\nA bronze casket rests on the stone bench. Its lock has rotted away; only a spring catch still bites the rim.\n\nFour characters are graven into the lid — eaten by rust past all reading."
 zgrc_custom_flavor.3102.a:0 "Open it."
 zgrc_custom_flavor.3102.b:0 "Back out."
 zgrc_custom_flavor.3103.t:0 "A Pair of Swords"
 zgrc_custom_flavor.3103.desc:0 "The lid lifts, and cold air strikes my face.\nTwo swords lie side by side, one male, one female; the light runs once down the ridge of each.\n#EMP Ganjiang and Moye#!.\n\n\n#flavor The King of Chu ordered Ganjiang to forge a sword, and three years it took. Ganjiang knew the king would kill him, so he hid the male blade and gave up the female. His wife Moye was with child; at parting he told her: 'If a son is born, tell him — go out and look south, where the pine grows from the rock, the sword lies at its back.'\nGanjiang died. His son was named Chi, called Chibi by later folk; when he was grown he found the male blade as bidden. The King of Chu dreamed the boy would seek revenge, and set a thousand in gold upon his head. Fleeing, Chibi met a man of honor on the road, who said: 'I hear the king offers a thousand for your head; bring me your head and the sword, and I will avenge you.' Chibi cut his own throat and gave both.\nThe stranger bore the head to the king. The king had it boiled in a cauldron, but for three days it would not boil down; the head leapt out of the boiling water and glared at him. The stranger begged the king to come and look — and struck off his head, which fell into the cauldron; then he cut his own. All three heads boiled to rags, past telling apart, and were buried apart: the Tomb of Three Kings.#!"
 zgrc_custom_flavor.3103.a:0 "Take them."
 zgrc_custom_flavor.3101.avoid_tt:0 "The ground gives under my foot. I stop, shift my weight back onto solid stone, and only then see that the step has rotted through."
 zgrc_custom_flavor.3101.hurt_tt:0 "The step gives way. I slide down the slope and leave a layer of skin on the rock."
 zgrc_custom_flavor.3101.collapse_tt:0 "The dust settles; the mouth of the cleft no longer looks like a way in."
 zgrc_custom_flavor.3102.avoid_tt:0 "The catch still holds its tension. I press the leaf down, and only then lift the lid."
 zgrc_custom_flavor.3102.hurt_tt:0 "The catch snaps open; a rusted spur bites into my palm."
 zgrc_custom_flavor.3104.t:0 "A Sword Comes to Light"
 zgrc_custom_flavor.3104.desc:0 "Word runs through the countryside of late: a treasure sword has come to light. They say [ROOT.Var('zgrc_sword_finder').Char.GetName] drew a pair of swords out of a crack in the rock — one male, one female, with names inlaid on them.\n'Ganjiang. Moye.' Country talk is worth little. But these two names are more than a village smith could carry.\n\n\n#flavor The King of Chu ordered Ganjiang to forge a sword, and three years it took. Ganjiang knew the king would kill him, so he hid the male blade and gave up the female. His wife Moye was with child; at parting he told her: 'If a son is born, tell him — go out and look south, where the pine grows from the rock, the sword lies at its back.'\nGanjiang died. His son was named Chi, called Chibi by later folk; when he was grown he found the male blade as bidden. The King of Chu dreamed the boy would seek revenge, and set a thousand in gold upon his head. Fleeing, Chibi met a man of honor on the road, who said: 'I hear the king offers a thousand for your head; bring me your head and the sword, and I will avenge you.' Chibi cut his own throat and gave both.\nThe stranger bore the head to the king. The king had it boiled in a cauldron, but for three days it would not boil down; the head leapt out of the boiling water and glared at him. The stranger begged the king to come and look — and struck off his head, which fell into the cauldron; then he cut his own. All three heads boiled to rags, past telling apart, and were buried apart: the Tomb of Three Kings.#!"
 zgrc_custom_flavor.3104.a:0 "Write and demand them; promise gold."
 zgrc_custom_flavor.3104.b:0 "An omen. Let it be proclaimed."
 zgrc_custom_flavor.3105.t:0 "The Swords Are Asked For"
 zgrc_custom_flavor.3105.desc:0 "A letter from [ROOT.Var('zgrc_sword_liege').Char.GetName] has come.\n\nIt says he has heard I came by two swords; that he has some acquaintance with such blades; that I should send them to him, and that he will repay me well in gold.\n\nThe ink is fresh, the folds worn deep — this letter was written more than once."
 zgrc_custom_flavor.3105.a:0 "Send them all."
 zgrc_custom_flavor.3105.b:0 "Let them be sold."
 zgrc_custom_flavor.3105.c:0 "Send the female one."
 zgrc_custom_flavor.3105.d:0 "Refuse with an excuse."
 zgrc_custom_flavor.3106.t:0 "Empty-Handed"
 zgrc_custom_flavor.3106.desc:0 "The man sent back says the two swords are a poor pair, and no Ganjiang or Moye.\n\n'Village talk, my lord. You were misled.'"
 zgrc_custom_flavor.3106.a:0 "Find a charge that fits him."
 zgrc_custom_flavor.3106.b:0 "Let it lie."

 # 2026-11-01 上游无英文的键：本 mod 自译（吴越剑客 3001、宝剑、Debug 宝物决议）
 zgrc_artifact_wuyue_sword_name:0 "Sword of Wu-Yue"
 zgrc_artifact_wuyue_sword_desc:0 "A keen blade forged by the smiths of Wu and Yue. No divine weapon, yet drawn from the fine iron of Jiangnan, its cold gleam like water."
 zgrc_artifact_ganjiang_name:0 "Ganjiang"
 zgrc_artifact_ganjiang_desc:0 "The male sword, its blade inscribed. Legend tells that when it was forged the metal would not melt, until Moye cut her hair and nails and cast them into the furnace; only then was this sword made. United with its pair, the divine blades reveal their full power."
 zgrc_artifact_moye_name:0 "Moye"
 zgrc_artifact_moye_desc:0 "The female sword, born of the same furnace as Ganjiang, one male and one female. Held alone, its edge lies hidden; united with its pair, its might is revealed."
 zgrc_custom_flavor.3001.t:0 "Swordsman of Wu-Yue"
 zgrc_custom_flavor.3001.desc:0 "A man with a sword at his hip stands across the road. His clothes are half worn, yet the scabbard is polished spotless, as though wiped every day.

'Sir.' He unfastens the long sword at his waist and draws it half an inch. In its cold light runs a faint dark line, and it is not rust.

'The swords of Wu and Yue have no equal under heaven. I have fallen on hard times and have nothing left but this, the one thing still worth some coin.'

The hand on the hilt is steady, the knuckles white. There is no pleading in his eyes; he seems rather to be waiting to see what I will do."
 zgrc_custom_flavor.3001.a:0 "I will buy this sword."
 zgrc_custom_flavor.3001.b:0 "Draw your blade."
 zgrc_custom_flavor.3001.b_tt:0 "Duel him. The victor takes the sword; #EMP life and death lie with Heaven#!."
 zgrc_custom_flavor.3001.c:0 "Stay, and be my retainer."
 zgrc_custom_flavor.3001.d:0 "Pass him by."
 zgrc_custom_flavor.3001.win_t:0 "A Fine Sword Goes to the Worthy"
 zgrc_custom_flavor.3001.win_tt:0 "When he falls, his hand is still on the hilt. You stoop to take the sword; the blade is still warm."
 zgrc_custom_flavor.3001.lose_t:0 "Outmatched"
 zgrc_custom_flavor.3001.lose_tt:0 "The blade grazes past your ear. He sheathes his sword, gives you one look, says nothing, and walks away."
 zgrc_debug_get_artifacts_decision:0 "Debug: Obtain Treasures"
 zgrc_debug_get_artifacts_decision_desc:0 "(Debug) Instantly obtain every treasure of the Han lands: the Sword of Wu-Yue, Moye (female) and Ganjiang (male)."
 zgrc_debug_get_artifacts_decision_tooltip:0 "Gain: Sword of Wu-Yue, Moye, Ganjiang."
 zgrc_debug_get_artifacts_decision_confirm:0 "Obtain Treasures"
