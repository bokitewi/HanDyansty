l_english:
 hjbz_yulin_wei:0 "Yulin Guards"
 hjbz_yulin_wei_flavor:0 "#F Yulin means wings to shelter the realm, as abundant as the trees of a forest. Emperor Wu of Han first established the Jianzhang cavalry camp, later renaming it Yulin. He also raised the descendants of soldiers killed in service among the guards and trained them in the five weapons; they were known as the Yulin Orphans. These men wear heavy armor and advance with shields in square formations. Their strength lies in holding firm, rather than in pursuit.#!"
 hjbz_yulin_qi:0 "Yulin Cavalry"
 hjbz_yulin_qi_flavor:0 "#F The Yulin cavalry have long shared the palace watch with the court gentlemen. Chosen from respectable families for their strength and skill, they are accomplished riders who remain close to the palace. They attend the imperial carriage in peacetime and guard the flanks of the central army in war. Their horses need not wear heavy armor: discipline in advance and retreat matters more than speed alone.#!"
 hjbz_zhijinwu_jishi:0 "Zhijinwu Halberdiers"
 hjbz_zhijinwu_jishi_flavor:0 "#F The Zhijinwu keeps watch outside the palace, handles unforeseen dangers from fire and flood, and oversees weapons. His men patrol the palace perimeter three times each month. Halberdiers line the roads to guard against emergencies and maintain order in the capital. They are not field troops, but when trouble threatens the city, they can stand firm in its streets and deter disorder.#!"
 hjbz_zhijinwu_tiqi:0 "Zhijinwu Red Riders"
 hjbz_zhijinwu_tiqi_flavor:0 "#F Ti refers to a reddish yellow. The Zhijinwu commands two hundred riders whose distinctive dress sets them apart from other troops. Before he rose to power, Emperor Guangwu once remarked: 'If I enter office, let me be Zhijinwu.' His ceremonial escort fills the roads with splendor, surpassing that of other officials. Yet these riders serve to patrol and suppress violence, rather than break enemy formations.#!"
 hjbz_rebuild_yulin_decision:0 "Reestablish the Yulin Guards"
 hjbz_rebuild_yulin_decision_desc:0 "The Yulin Guards were founded to protect the palace and meet unforeseen dangers. Emperor Wu raised the descendants of soldiers killed in service and trained them in the five weapons, preserving their families' calling. From the reigns of Emperors Xuan and Yuan onward, they became an elite force within the palace. Their name survives today, but their organization has long fallen into neglect, and other troops have sometimes taken over the palace watch. This does little to secure the heart of the realm.\n\nYour servant has heard that a realm needs wings to shelter it, just as a forest flourishes through the support of its trees. Restore the old institution and select strong, able men from respectable families for two forces: one to wear heavy armor, bear shields, and guard the palace in square formations; the other to ride and shoot, attend the imperial carriage, and undertake pursuit. Together they will give the central army dependable support and command the respect of the capital.\n\nA single decree cannot accomplish this. Registers, armor, weapons, and provisions require lasting arrangements, and command must be entrusted to capable men. May Your Majesty first establish the institution, then consider its strength."
 hjbz_rebuild_yulin_decision_tooltip:0 "Reestablish the Yulin institution, enabling recruitment of #Y Yulin Guards#! and #Y Yulin Cavalry#!.\n\n#EMP First, secure the authority to act:#! rule the Chinese Hegemony and concentrate power in your own hands. Imperial bureaucracy must be at least Limited Civil Service, and the military system at least Shared Military Administration. Prestige level 3, influence level 3, and legitimacy level 7 are all required.\n\nYour position must also be secure: all powerful vassals must have an opinion of you above 50, and you must either hold the Sili office yourself or win its holder's support. If you share power with a co-ruler, that co-ruler must be loyal, or the balance of power must remain sufficiently favorable."
 hjbz_rebuild_yulin_decision_confirm:0 "Spend 500 treasury funds, or 500 gold if you have no treasury, and 1,000 prestige to establish the institution. This decision does not immediately grant regiments."
 hjbz_rebuild_yulin_decision_effect:0 "The Yulin institution has been reestablished. Yulin Guards and Yulin Cavalry can now be recruited."
 hjbz_rebuild_zhijinwu_decision:0 "Reestablish the Zhijinwu"
 hjbz_rebuild_zhijinwu_decision_desc:0 "The Zhijinwu is an official of the full two-thousand-bushel rank. He guards the palace exterior, handles unforeseen dangers from fire and flood, and oversees weapons, with patrols around the palace three times each month. Under him serve two hundred Red Riders and five hundred and twenty halberdiers, their splendid escort filling the roads. Before his rise, Emperor Guangwu once remarked: 'If I enter office, let me be Zhijinwu.' Such was the office's grandeur.\n\nAfter repeated changes of capital, the office has become an empty title, leaving the outer palace watch without proper command. A palace's security depends on patrols and preparations for emergencies, rather than the height of its walls. Restore the office, station able halberdiers along the roads, and send the Red Riders to patrol the streets. Then the dangers of fire and the crimes of the lanes will once again fall under a responsible authority.\n\nThis institution cannot be directed from afar. It must operate within the capital, close to the throne. Luoyang and Chang'an were both imperial capitals of old; establish it according to where the court resides."
 hjbz_rebuild_zhijinwu_decision_tooltip:0 "Reestablish the Zhijinwu institution, enabling recruitment of #Y Zhijinwu Halberdiers#! and #Y Zhijinwu Red Riders#!.\n\n#EMP First, secure its foundation:#! rule the Chinese Hegemony, with your capital in #Y Luoyang#! or #Y Chang'an#! and capital control above 80. Prestige level 2 and influence level 2 are both required.\n\nYou must also retain command: if you share power with a co-ruler, that co-ruler must be loyal, or the balance of power must remain sufficiently favorable."
 hjbz_rebuild_zhijinwu_decision_confirm:0 "Spend 200 gold and 300 prestige to establish the institution. This decision does not immediately grant regiments."
 hjbz_rebuild_zhijinwu_decision_effect:0 "The Zhijinwu institution has been reestablished. Zhijinwu Halberdiers and Zhijinwu Red Riders can now be recruited."
