l_english:
 hd_j16.1420.t:0 "Qin Marches Out of the Passes"
 hd_j16.1420.desc:0 "Chang'an is mustering troops again. [hd_news_a.GetName]'s orders go out to camp after camp; the grain carts move first and the cavalry follows, and the spearhead points at the lands of [hd_news_b.GetName].\n\nIn the market I hear people counting the years: the year the Qin entered the passes, the year they marched out again. No one asks any longer whether the Qin army will come out, only which way it will go this time."
 hd_j16.1420.t_s1:0 "Qin Secures Guanzhong"
 hd_j16.1420.desc_s1:0 "Even after the Fu clan took Chang'an and proclaimed their state, many towns in Guanzhong kept their gates shut and waited to see how things would go. [hd_news_a.GetName] will wait no longer for their surrender: generals have been sent out in every direction, starting with the lands of [hd_news_b.GetName].\n\nIn the villages along the Wei, people hide their grain in cellars and fill the cellar mouths back in. I asked an old farmer whether he was afraid. Fear does no good, he said: Guanzhong has changed masters several times these past years, and every time they said it would be the last."
 hd_j16.1420.t_s2:0 "Qin Climbs the Long Slopes"
 hd_j16.1420.desc_s2:0 "No sooner is Guanzhong settled than [hd_news_a.GetName]'s army crosses the Long Mountains toward Tianshui and Nan'an. The commanderies of Longyou each had their own allegiances; [hd_news_b.GetName] is the first to bear the blow.\n\nThe road up the slopes is narrow, and the pack animals carrying grain climb one after another; from below they look like a rope with no end. The Qiang and Di tribes in the hills send men down to watch, and the word they carry back is simple: this time Qin means to take Longyou for itself."
 hd_j16.1420.t_s3:0 "Qin Gathers the Lands of Yan"
 hd_j16.1420.desc_s3:0 "Ye has fallen, yet the remnants of the house of Yan are still scattered through the towns of Hebei and You province, some holding their walls, some waiting to see which way to turn. [hd_news_a.GetName] sends troops east, and they come first to [hd_news_b.GetName].\n\nThe chariots from Guanzhong travel back along the road the Yan army once took south. The people by the roadside watched the Yan banners for years and now they watch the Qin banners; some have learned to hang nothing over their doors at all."
 hd_j16.1420.t_s4:0 "Qin Attacks Chouchi"
 hd_j16.1420.desc_s4:0 "Mount Chouchi is walled by cliffs on every side, and the Yang clan has held it for decades, playing Jin and Qin against each other. Now [hd_news_a.GetName] will no longer tolerate this double allegiance; a great army marches south on Wudu, and [hd_news_b.GetName] can only make a stand behind the heights.\n\nThe people below the mountain say there are fields and springs up there, enough to hold out for a year or so. They also know that holding the mountain is not holding the roads beneath it; once the roads are cut, those on the mountain will have to come down sooner or later."
 hd_j16.1420.t_s6:0 "Qin Turns West toward Guzang"
 hd_j16.1420.desc_s6:0 "The Zhang clan has held Hexi for generations, always keeping the Jin calendar and facing Guanzhong across the Yellow River. Now [hd_news_a.GetName]'s army has crossed the river westward and meets [hd_news_b.GetName] in battle.\n\nThe merchants of Hexi hear first; caravans halfway along the road turn back. In Guzang some say that Liang province has mountains and rivers enough to defend it, while others quietly ask how the Qin treat those who surrender."
 hd_j16.1420.t_s7:0 "Qin Marches North out of Yunzhong"
 hd_j16.1420.desc_s7:0 "On the steppe north of Dai, the grudges between the Tuoba and the other tribes run deep. Taking advantage of their discord, [hd_news_a.GetName] sends troops north against [hd_news_b.GetName].\n\nThe autumn grass is high, and the herders drive their horses northward; whole camps are struck in a single night. The army from the south moves slowly, but it has the grain of Guanzhong behind it, and the people of the steppe understand that better than anyone."
 hd_j16_border_cb:0 "Border Dispute"
 hd_j16_border_cb_desc:0 "A small contest along the border between two realms over a single county. Can only be started by scripted events."
 HD_J16_BORDER_WAR_NAME:0 "[ATTACKER.GetPrimaryTitle.GetNameNoTierNoTooltip]'s Raid on the [DEFENDER.GetPrimaryTitle.GetNameNoTierNoTooltip] Border"
 hd_j16_border_victory_desc:0 "[attacker.GetShortUIName|U] takes the disputed county, and both sides agree to three years without war."
 hd_j16_border_white_peace_desc:0 "Both sides lay down arms; [attacker.GetShortUIName|U] pays a small indemnity, and there will be no war for three years."
 hd_j16_border_defeat_desc:0 "[attacker.GetShortUIName|U] returns in defeat and must pay reparations to the defender; there will be no war for three years."
