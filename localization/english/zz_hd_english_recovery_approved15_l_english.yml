 WJ_council_independent_marshal:0 "General-in-Chief"
 WJ_cr_empire_found_tt:0 "With a royal title already established, build upon that foundation to assume the imperial throne and gain 1000 Legitimacy. This is applied only when the imperial throne is first established."
 WJ_cr_empire_usurp_t:0 "Usurp Imperial Rank"
 WJ_cr_empire_usurp_tt:0 "Proclaiming yourself emperor without first establishing a royal title costs 1000 Legitimacy. This is applied only when the imperial throne is first established."
