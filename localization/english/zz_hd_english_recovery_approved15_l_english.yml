 hd218_wang_proclaim_emperor_decision:0 "Ascend the Imperial Throne"
 hd218_wang_proclaim_emperor_decision_desc:0 "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] already holds sway over a region, and the ministers have repeatedly urged an accession. I can ascend the altar, receive the mandate and take the imperial throne."
 hd218_wang_proclaim_emperor_decision_tooltip:0 "Change your title from King to Emperor."
 hd218_wang_proclaim_emperor_decision_confirm:0 "Ascend the Altar and Take the Throne"
 hd218_wang_proclaim_emperor_decision_effect_tt:0 "Your royal title becomes an imperial title, and you will henceforth be called Emperor."
 hd_sg218_war_cb:0 "Rivalry at the End of the Han"
 hd_sg218_war_cb_desc:0 "A historical war in the rivalry among the three powers, which can only be initiated by the story."
 HD_SG218_WAR_NAME:0 "War between [ATTACKER.GetPrimaryTitle.GetNameNoTierNoTooltip] and [DEFENDER.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 hd_sg218_war_victory_desc:0 "[attacker.GetShortUIName|U] takes the contested commanderies."
 hd_sg218_baiyi_cb:0 "Crossing the River in White"
 hd_sg218_baiyi_cb_desc:0 "The historical war in which Lü Meng crosses the river disguised as merchants and seizes Jingzhou. It can only be initiated by the story."
 HD_SG218_BAIYI_WAR_NAME:0 "Crossing the River in White"
 hd_sg218_xiangfan_cb:0 "Battle of Xiangfan"
 hd_sg218_xiangfan_cb_desc:0 "The historical war in which Guan Yu marches north against Xiangyang and Fancheng. It can only be initiated by the story."
 HD_SG218_XIANGFAN_WAR_NAME:0 "Battle of Xiangfan"
 hd_sg218_war_white_peace_desc:0 "Both sides lay down arms, and the borders remain unchanged."
 hd_sg218_war_defeat_desc:0 "The attacker gains nothing, and the borders remain unchanged."
 hd_sg218_victory_momentum_modifier:0 "Momentum of Victory"
 hd_sg218_victory_momentum_modifier_desc:0 "After a great victory, the soldiers fight bravely and the enemy trembles at their approach."
 hd_sg218_army_shaken_modifier:0 "Shaken Army Morale"
 hd_sg218_army_shaken_modifier_desc:0 "News of the commander's death and the army's destruction spreads through the camp, leaving the soldiers fearful and unsettled."
 hd_sg218_awe_huaxia_modifier:0 "Might That Shakes Huaxia"
 hd_sg218_awe_huaxia_modifier_desc:0 "After the flooding of the seven armies, bandit leaders south of Xu received seals and titles from afar and became supporters. This renown shook the Central Plains."
 hd_sg218_lianying_modifier:0 "Camps Set Ablaze"
 hd_sg218_lianying_modifier_desc:0 "The chain of camps stretching seven hundred li has gone up in flames. The elite troops are lost, and almost all military supplies and equipment have been destroyed."
 hd_sg218_jieting_modifier:0 "Loss of Jieting"
 hd_sg218_jieting_modifier_desc:0 "Jieting has fallen, the commanderies of Longyou have rebelled again, and the army has no secure base for its advance."
 hd_sg218_tuogu_modifier:0 "Entrusted with the Regency by the Late Emperor"
 hd_sg218_tuogu_modifier_desc:0 "On his deathbed, the late emperor entrusted this character with the care of his heir. All affairs of government, great and small, are decided by this character."
 hd_sg218_established_rule_modifier:0 "Long-Established Regional Rule"
 hd_sg218_established_rule_modifier_desc:0 "After years of governing this region, officials and commoners alike have given their allegiance. There is none of the uncertainty surrounding a newly enthroned ruler."
 hd_sg218_hanzhong_supply_modifier:0 "Resources of Hanzhong"
 hd_sg218_hanzhong_supply_modifier_desc:0 "With Hanzhong taken, the gateway to the Qinchuan plain is held and its granaries are full. Supplies flow steadily from Shu, so armies marching through the mountain roads never lack provisions."
 bm_218_cao_cao_name:0 "Cao Cao"
 bm_218_cao_cao_name_subheading:0 "King of Wei"
 bm_218_cao_cao_name_desc:0 "Cao Cao, already Chancellor, has risen to the rank of King of Wei. He serves the Son of Heaven at Xu, and the nine provinces of the north are under his rule. Yet he is growing old, Hanzhong is in peril, and some in Xu still hold the Han house dear. Can he establish an unshakable foundation for the Cao family before his life ends?"
 bm_218_liu_bei_name:0 "Liu Bei"
 bm_218_liu_bei_name_subheading:0 "King of Hanzhong"
 bm_218_liu_bei_name_desc:0 "After a lifetime of wandering, Liu Bei has finally secured a foothold in Yi Province and is contesting Hanzhong with Cao Cao's army. He champions loyalty to the Han, with Guan Yu holding Jing Province and Zhuge Liang administering Shu. For the first time, the restoration of the Han seems within reach."
 bm_218_sun_quan_name:0 "Sun Quan"
 bm_218_sun_quan_name_subheading:0 "Master of the Southeast"
 bm_218_sun_quan_name_desc:0 "Sun Quan has inherited his father and brother's enterprise and held Jiangdong for nearly twenty years. His alliance with Liu Bei is increasingly hollow, and Guan Yu upstream in Jing Province keeps him awake at night. Will he honor the alliance or seize an opportunity to strike?"
 bm_218_guan_yu_name:0 "Guan Yu"
 bm_218_guan_yu_name_subheading:0 "Area Commander of Jing Province"
 bm_218_guan_yu_name_desc:0 "Guan Yu bears the Staff of Authority and commands Jing Province, with Mi Fang, Meng Da and Shi Ren under him. Cao Ren holds Fan to the north, while Sun Quan watches for an opening to the east. His reputation can shake Huaxia, but Jing Province behind him is less secure than it appears."
 bm_218_zhu_ge_liang_name:0 "Zhuge Liang"
 bm_218_zhu_ge_liang_name_subheading:0 "General of Military Counsel"
 bm_218_zhu_ge_liang_name_desc:0 "While Liu Bei marches north to contest Hanzhong, Zhuge Liang remains in Chengdu, managing the affairs of the General of the Left's headquarters and supplying the front with food and troops. He is Liu Bei's most trusted adviser, yet holds no fief of his own. Will he devote himself to restoring the Han for his lord, or one day stand at the helm himself?"
 bm_218_si_ma_yi_name:0 "Sima Yi"
 bm_218_si_ma_yi_name_subheading:0 "Assistant Gentleman of the Crown Prince's Household"
 bm_218_si_ma_yi_name_desc:0 "Sima Yi, from Wen County in Henei, was compelled by Cao Cao to enter service and now attends Crown Prince Cao Pi. Cao Cao remains wary of him, while he keeps his abilities carefully concealed. Into whose hands will the Cao family's enterprise ultimately fall?"
