 hd_dc_end_luanshi_claim_tt:0 "The Mandate is yours: if the Chinese [hegemony|E] has no holder, you take control of it, adopting the Commandery-Kingdom government and moving to its de jure capital if necessary. Those receiving the Mandate's reward for the first time also gain [dynasty|E] Renown and a Mandate bonus, and Control rises in their Chinese [counties|E]. The age of turmoil ends, and the realm enters Recovery (or New Dynasty Conquest if a foreign people takes power)."
 hd_dc_end_luanshi_regent_tt:0 "You end the age of turmoil on behalf of the Son of Heaven: the Mandate remains with him, and he receives its reward. The age of turmoil ends, and the realm enters Recovery."
