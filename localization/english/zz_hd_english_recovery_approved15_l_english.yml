 WJ_ab_decision:0 "Accept the Abdication and Ascend the Throne"
 WJ_ab_decision_desc:0 "The court's power is already in my hands, and the Son of Heaven is subject to my control. If the realm publicly endorses his abdication, I can inherit the imperial succession. Yet the gestures of refusal and the rites observed during the transfer will also shape the new dynasty's reputation.\n\nAt a hegemonic court, you must hold a landed royal title; at an independent imperial court, you must hold a landed duchy within that realm and remain a subject of the reigning emperor. You must be the emperor's regent with level 5 power, and the emperor must be your original puppet. Abdication may also be accepted during the Warlord phase."
 WJ_ab_ready_tt:0 "An adult player with the Commandery-Kingdom government; the Coronation DLC and rule are enabled, and no investiture or abdication process is in progress"
 WJ_ab_real_king_tt:0 "Hold a landed royal title at a hegemonic court, or a landed duchy within an independent imperial realm; administrative office titles do not count"
 WJ_ab_emperor_tt:0 "Remain a subject of a living hegemonic Son of Heaven or an independent emperor"
 WJ_ab_power_tt:0 "The emperor is your original puppet, and you are the emperor's regent with level 5 power"
 WJ_ab_decision_tooltip:0 "Begin the abdication edict process, with three refusals and three offers"
 WJ_ab_decision_confirm:0 "Have the ritual officials settle the abdication rites"
 WJ_ab.village_duke:0 "Village Duke"
 WJ_ab_protection:0 "Protection During the Abdication Rites"
 activity_wj_coronation:0 "Ceremony of Accession"
 activity_wj_coronation_desc:0 "With the throne inherited, the officials solemnly prepare the rites. Announce the succession at the ancestral temple, receive the imperial seal and ribbon, and hold court to accept congratulations, affirming the duties of ruler and subject before the realm."
 activity_wj_coronation_host_desc:0 "On completion, gain the law for accession to the imperial throne and determine the realm name through the existing process; military posts granted by the former dynasty are also removed."
 activity_wj_coronation_guest_desc:0 "Attend to witness the accession and affirm your obligations as a subject to the ruler."
 WJ_cr_type_accession:0 "Accession Ceremony"
 WJ_cr_type_accession_desc:0 "$BULLET_WITH_TAB$Gain the [GetLaw('crowned_emperor').GetName] [law|E]
$BULLET_WITH_TAB$Gain [legitimacy_i][legitimacy|E] and the [opinion_i][opinion|E] of [vassals|E] according to the ceremony's magnificence
$BULLET_WITH_TAB$Announce the succession at the ancestral temple, receive the seal and hold court; you may swear an [oath|E] at the banquet
$BULLET_WITH_TAB$Afterwards, choose the realm name; military posts granted by the former dynasty are removed
$BULLET_WITH_TAB$@alert_icon!#alert_trial Only for independent emperors under the Commandery-Kingdom System, held in your own capital#!

#weak With the throne inherited, the officials solemnly prepare the rites: announcing the succession at the ancestral temple, receiving the imperial seal and ribbon, and holding court to accept congratulations, so that the duties of ruler and subject are made plain to all.#!"
 WJ_cr_location_desc:0 "Hold the accession rites in your own capital; no religious holy site or clerical host is required."
 WJ_cr_phase_preparation:0 "Prepare the Rites"
 WJ_cr_phase_preparation_desc:0 "Consult on the ceremonial procedures, revise the investiture documents, and await the arrival of your subjects."
 WJ_cr_phase_investiture:0 "Announce the Accession and Hold Court"
 WJ_cr_phase_investiture_desc:0 "Announce the succession at the ancestral temple, read the accession document, and receive your subjects' congratulations."
 WJ_cr_phase_banquet:0 "Conclude with a Banquet"
 WJ_cr_phase_banquet_desc:0 "Feast with your subjects, declare your new policies, and complete the rites."
 WJ_cr_conclusion_desc:0 "The accession rites are complete; the ceremonial laws and realm name are settled according to the actual results of this ceremony."
