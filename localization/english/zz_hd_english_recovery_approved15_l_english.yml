 WJ_cr_advance_king_decision:0 "Assume a Royal Title"
 WJ_cr_advance_king_decision_desc:0 "My provinces and commanderies now form a broad domain, and my old office title no longer conveys my standing in the realm. I will assume a royal title and choose a realm name from the existing regional candidates.\n\nThe royal title is attached to the primary title and inherited by its successor. It grants no coronation law and creates no new empire title."
 WJ_cr_advance_king_decision_tooltip:0 "Your primary title gains a hereditary royal title, followed by a choice of realm name; military posts from the former dynasty are removed."
 WJ_cr_advance_king_decision_confirm:0 "Assume a royal title and choose a realm name"
 WJ_cr_advance_king_valid_tt:0 "An independent local kingdom ruler with the Commandery-Kingdom government who has not yet assumed a royal title, actually controls at least 110 counties, and has no unfinished realm-name selection."
 WJ_cr_empire_found_t:0 "Found a Dynasty and Proclaim Yourself Emperor"
