 WJ_emperor_puppet_decision:0 "Control the Son of Heaven"
 WJ_emperor_puppet_decision_desc:0 "Use the authority of the regency to oversee affairs at court and in the provinces, bringing the Son of Heaven of this court under my control. I must personally serve as regent, have regency power at level four, have a Prestige level above three, and be Commander of All Military Affairs at Court and in the Provinces. I also need the support of two different senior ministers of the inner court, unless the Son of Heaven is a child or incapable.\n\nThe existing puppet relationship, DLC requirements and limits apply. A player-controlled Son of Heaven cannot be controlled."
 WJ_emperor_puppet_qualification_tt:0 "Personally serve as regent with power of at least level four and Prestige above level three, and hold the office of Commander of All Military Affairs at Court and in the Provinces. At least two different serving holders of the offices of General-in-Chief, Palace Attendant, Grand Marshal or Regular Palace Attendant must be your pupils or direct staff, or under your strong hooks, unless the Son of Heaven is underage or incapable"
 WJ_emperor_puppet_decision_tooltip:0 "Make this court's AI Son of Heaven your ruler puppet under the existing system."
