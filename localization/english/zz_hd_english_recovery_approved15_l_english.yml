 hd_refill_maa_gold_interaction_desc:0 "Spend [gold|E] to recruit soldiers immediately and refill depleted [men_at_arms|E] [regiments|E]."
 hjbz_yulin_rebuilder_modifier:0 "Restorer of the Yulin Guard"
 hjbz_yulin_rebuilder_modifier_desc:0 "This character has restored the old Yulin Guard, selecting men from respectable families to serve as palace guards and strengthening the defenses of the palace. Many soldiers who hear their name are willing to serve them, while would-be conspirators must first weigh their own strength."
 hjbz_yulin_guard_modifier:0 "Yulin Guard"
 hjbz_yulin_guard_modifier_desc:0 "The Yulin Guard is always at this character's side. With armor and weapons ready and guards on duty, enemies can find no opening in their movements."
 hjbz_zhijinwu_renewed_modifier:0 "Restored Bearer of the Gilded Mace"
 hjbz_zhijinwu_renewed_modifier_desc:0 "The office of the Bearer of the Gilded Mace has been restored. Red-clad riders patrol, halberd-bearers line the roads, and the palace is circled three times a month. No alarm drums sound, travelers can go out safely at night, and the streets and markets gradually regain their former order."
 hjbz_zhijinwu_collapsed_modifier:0 "Collapsed Bearer of the Gilded Mace"
 hjbz_zhijinwu_collapsed_modifier_desc:0 "The office of the Bearer of the Gilded Mace has fallen into disuse, with no one performing its duties. Its riders and halberd-bearers have scattered: the cunning serve powerful families as henchmen, while the less resourceful consort with bandits. Even by day, the streets are no longer safe from plunder."
 hjbz_yulin_escort_travel_option:0 "Yulin Guard Escort"
 hjbz_yulin_escort_travel_option_desc:0 "Choose soldiers of the Yulin Guard to accompany you. Experienced in palace guard duty and accustomed to vigilance, they scout the conditions ahead along the route. Even if conspirators lurk on the journey, they will find no chance to act."
