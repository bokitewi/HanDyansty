l_english:
 game_concept_wj_kaifu:0 "Open Office"
 game_concept_wj_zhoumu:0 "Appointment as Governor"
 game_concept_wj_huangyue:0 "Borrowed Yellow Axe"
 game_concept_wj_kaifu_desc:0 "Open Office is a special grant conferred by the court through a contract, allowing one to appoint one's own staff and summon clerks. The Grand General, Grand Tutor, Chancellor, Minister over the Masses, Minister of Works and Grand Commandant may open an office while in post; other high ministers must be granted it separately."
 game_concept_wj_maojie:0 "Yak-Tail Tally"
 game_concept_wj_maojie_desc:0 "The Yak-Tail Tally comes in three grades: Borrowed Tally, Bearing Tally and Envoy Bearing Tally, and a person may hold only one. The Son of Heaven establishes districts and grants tallies on the 'Area Command' page of the military window; a grant may be changed during tenure, but never revoked outright. When a core substantive office passes by normal succession, the new holder inherits the tally and the predecessor is dismissed. A tally holder commands every eligible official in the district, not only direct subordinates; but should they raise arms against the court, they may no longer invoke the court's authority to command loyal officials. Military law is enforced through 'Issue Area Command Orders', while Open Office is judged separately."
 game_concept_wj_chushi:0 "Private Scholar"
 game_concept_wj_chushi_desc:0 "Those who hold no office and are not landless gentry are called [wj_chushi|E], dwelling between court and countryside. Being eligible for office does not mean one already has a [wj_luyi|E]."
 game_concept_wj_guanyuan:0 "Official"
 game_concept_wj_guanyuan_desc:0 "[wj_guanyuan|E] are [liege|E] vassals who govern localities by appointment under the [wj_junguozhi|E]. Officials are appointed by their lord and use [governor_efficiency|E] to administer lands within the [realm|E]; whether a post is civil or military is set by the contract of the province held.\n\nAn official's [title|E] and the [counties|E] beneath it form a [province|E], and the [governance_issues|E] within it are handled by the serving official.\n\nOfficials can accumulate [influence|E] to sway the [succession|E] of other offices.\n\n#F Hold the post and bear its duties; guard the land by imperial decree and submit to evaluation in due season.#!"
 game_concept_wj_junguozhi:0 "Commandery-Kingdom System"
 game_concept_wj_luyi:0 "Salary Rank"
 game_concept_wj_luyi_desc:0 "[wj_luyi|E] is fixed by office, and salary follows promotion; it shows the salary grade of the office a character holds.\n\nBaron-tier offices are [wj_luzhi_liubaishi|E], count-tier [wj_luzhi_qianerbai|E], duchy-tier [wj_luzhi_bierqian|E], kingdom-tier [wj_luzhi_zhongerqian|E], and empire-tier and above [wj_luzhi_wanshi|E].\n\nThose without office are called [wj_chushi|E] or [wj_shizu|E]; those who take office before entering by a formal path serve on [wj_shishou|E], and must pass an evaluation of ability when the term ends."
 game_concept_wj_luzhi_bierqian:0 "Equivalent Two Thousand Bushels"
 game_concept_wj_luzhi_bierqian_desc:0 "[wj_luzhi_bierqian|E] is the rank of duchy-tier offices."
 game_concept_wj_luzhi_liubaishi:0 "Six Hundred Bushels"
 game_concept_wj_luzhi_liubaishi_desc:0 "[wj_luzhi_liubaishi|E] is the rank of baron-tier offices."
 game_concept_wj_luzhi_qianerbai:0 "Twelve Hundred Bushels"
 game_concept_wj_luzhi_qianerbai_desc:0 "[wj_luzhi_qianerbai|E] is the rank of count-tier offices."
 game_concept_wj_luzhi_wanshi:0 "Ten Thousand Bushels"
 game_concept_wj_luzhi_wanshi_desc:0 "[wj_luzhi_wanshi|E] is the rank of empire-tier and higher offices."
 game_concept_wj_luzhi_zhongerqian:0 "Full Two Thousand Bushels"
 game_concept_wj_luzhi_zhongerqian_desc:0 "[wj_luzhi_zhongerqian|E] is the rank of kingdom-tier offices."
 game_concept_wj_mingwang:0 "Virtuous Repute"
 game_concept_wj_ruzhi:0 "Paths to Office"
 game_concept_wj_ruzhi_desc:0 "In the Han and Jin there are three paths to office:\n\nSummons — joining a patron's Military Headquarters and entering service under their sponsorship.\n\nFilial and Incorrupt — duchy-tier officials nominate those without office to the Office of the Gentlemen, who gain Filial and Incorrupt standing after passing examination.\n\nFlourishing Talent — officials of kingdom tier and above nominate men of talent; serving officials and those of Filial and Incorrupt or Summons standing may also be nominated, gaining a higher qualification for office.\n\nThose who take office without a formal path serve on probation and face an evaluation of ability when the term ends: those who pass in baron- or count-tier offices are granted Filial and Incorrupt, and those who pass in duchy-tier or higher offices are granted Flourishing Talent."
 game_concept_wj_shishou:0 "Probation"
 game_concept_wj_shishou_desc:0 "Those who take a substantive post without a formal path to office serve on [wj_shishou|E]. During probation they bear the acting-official penalty, and must pass an evaluation of ability when the term ends to gain formal qualification for office."
 game_concept_wj_shizu:0 "Gentry"
 game_concept_wj_shizu_desc:0 "Those who hold a landless gentry family title but no office are called [wj_shizu|E]. Once those with formal qualification take office, their [wj_luyi|E] is set by the office held; those who take office without qualification still await evaluation on [wj_shishou|E]."
 game_concept_wj_xianwang_level_chao:0 "Renowned Within the Seas"
 game_concept_wj_xianwang_level_gong:0 "Revered by All Under Heaven"
 game_concept_wj_xianwang_level_jun:0 "Known in the Commandery"
 game_concept_wj_xianwang_level_xian:0 "Praised in the Village"
 game_concept_wj_xianwang_level_zhou:0 "Lauded by the Literati"
 game_concept_WJ_maocai:0 "Nominate Flourishing Talent"
 game_concept_WJ_maocai_desc:0 "Officials of kingdom tier and above may nominate talented scholars of the same celestial realm as Flourishing Talent. Serving officials and those of Filial and Incorrupt or Summons standing may be nominated again, but those already Flourishing Talent may not be nominated twice. The nominee gains formal qualification for office, though their salary rank is still set by the office held; the nominator may also take the occasion to make them a protégé."
 game_concept_wj_zhoumu_desc:0 "$WJ_zhoumu_grant_desc$"
 game_concept_wj_huangyue_desc:0 "$WJ_huangyue_grant_desc$"
 game_concept_wj_luyi_i:0 "@merit_icon!"
 game_concept_wj_mingwang_i:0 "@merit_icon!"
 game_concept_wj_ruzhi_i:0 "@merit_icon!"
