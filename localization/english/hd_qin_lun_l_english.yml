l_english:
 hd_qin_lun_name:0 "Qin Lun"
 hd_qin_lun.0001.t:0 "A Visitor from Distant Lands"
 hd_qin_lun.0001.desc:0 "A stranger with a high nose and deep-set eyes has been recommended to you and asks for an audience. He calls himself Qin Lun, a native of Daqin, a country thousands of miles away. He has come by sea through Jiaozhi, and speaks knowledgeably of astronomy, mathematics, and the books of foreign lands.\n\nThose assembled in the hall have never seen anyone quite like him and begin to whisper. He offers his respects without losing his composure. He wishes to place a lifetime of learning at the service of a worthy lord, asking only for a place to make his home."
 hd_qin_lun.0001.a:0 "His talents will be useful. Keep him at my side."
 hd_qin_lun.0001.b:0 "Give him money for the road and send him on his way."
