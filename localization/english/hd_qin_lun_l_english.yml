l_english:
 hd_qin_lun_name:0 "Qin Lun"
 hd_qin_lun.0001.t:0 "A Guest from Afar"
 hd_qin_lun.0001.desc:0 "A deep-eyed stranger is brought before the hall. He calls himself Qin Lun, from the distant land of Daqin, who has crossed the seas by way of Jiaozhi, learned in the stars, numbers and foreign scripture.\n\nHe bows calmly and offers his learning, asking only for shelter."
 hd_qin_lun.0001.a:0 "He may prove useful. Welcome him to court."
 hd_qin_lun.0001.b:0 "Send him on his way with provisions."
