l_english:
 hd_form_saved_k_yongzhou_decision:0 "Establish Yong Province"
 hd_form_saved_k_yongzhou_decision_desc:0 "Between Anding and Fengyi, each commandery and county has its own jurisdiction, yet their correspondence must ultimately converge in one place. Now that these commanderies are gradually falling into my hands, the name of Yong Province deserves a provincial seat that truly commands its four borders."
 hd_form_saved_k_yongzhou_decision_tooltip:0 "Unite the commanderies formerly under its jurisdiction and establish Yong Province"
 hd_form_saved_k_yongzhou_decision_confirm:0 "Found the province and fix its institutions."
 hd_form_saved_k_yongzhou_decision_requirement:0 "Yong Province has no holder, and you fully control at least six of the seven commanderies formerly under its jurisdiction"
 hd_form_saved_k_yongzhou_decision_effect:0 "You hold Yong Province, and its seven former commanderies return to its [de_jure|E] jurisdiction"
 hd_form_saved_k_qinzhou_decision:0 "Establish Qin Province"
 hd_form_saved_k_qinzhou_decision_desc:0 "West of Mount Long, the commanderies of Tianshui and Wudu control the mountain and river roads. If the army's grain and the government's orders here are no longer to go their separate ways, I must turn the borders drawn on my desk into the statutes of a single province."
 hd_form_saved_k_qinzhou_decision_tooltip:0 "Unite the commanderies formerly under its jurisdiction and establish Qin Province"
 hd_form_saved_k_qinzhou_decision_confirm:0 "Found the province and fix its institutions."
 hd_form_saved_k_qinzhou_decision_requirement:0 "Qin Province has no holder, and you fully control at least six of the seven commanderies formerly under its jurisdiction"
 hd_form_saved_k_qinzhou_decision_effect:0 "You hold Qin Province, and its seven former commanderies return to its [de_jure|E] jurisdiction"
 hd_form_saved_k_hezhou_decision:0 "Establish He Province"
 hd_form_saved_k_hezhou_decision_desc:0 "Envoys from Jincheng and Longxi arrive at my court one after another, yet they still bring only the registers of their separate commanderies. If the commanderies of He Province can be united under one office, the passes, granaries, and levies along the river will have a common master."
 hd_form_saved_k_hezhou_decision_tooltip:0 "Unite the commanderies formerly under its jurisdiction and establish He Province"
 hd_form_saved_k_hezhou_decision_confirm:0 "Found the province and fix its institutions."
 hd_form_saved_k_hezhou_decision_requirement:0 "He Province has no holder, and you fully control at least four of the five commanderies formerly under its jurisdiction"
 hd_form_saved_k_hezhou_decision_effect:0 "You hold He Province, and its five former commanderies return to its [de_jure|E] jurisdiction"
 hd_form_saved_k_luozhou_decision:0 "Establish Luo Province"
 hd_form_saved_k_luozhou_decision_desc:0 "Luoyang's ancient prestige endures, yet the commanderies of the capital region cannot be held together by an old name alone. I shall summon my officials and redraw the provincial jurisdiction, so that dispatches from every quarter have somewhere to go and decrees have a road to travel."
 hd_form_saved_k_luozhou_decision_tooltip:0 "Unite the commanderies formerly under its jurisdiction and establish Luo Province"
 hd_form_saved_k_luozhou_decision_confirm:0 "Found the province and fix its institutions."
 hd_form_saved_k_luozhou_decision_requirement:0 "Luo Province has no holder, and you fully control at least five of the six commanderies formerly under its jurisdiction"
 hd_form_saved_k_luozhou_decision_effect:0 "You hold Luo Province, and its six former commanderies return to its [de_jure|E] jurisdiction"
 hd_form_saved_k_sizhou_decision:0 "Establish Si Province"
 hd_form_saved_k_sizhou_decision_desc:0 "The roads between Wei Commandery and Henei are already in my grasp, yet the commandery officials coming and going each still keep to their own old customs. I need a common provincial name to bind the taxes, levies, and commands of these commanderies together once more."
 hd_form_saved_k_sizhou_decision_tooltip:0 "Unite the commanderies formerly under its jurisdiction and establish Si Province"
 hd_form_saved_k_sizhou_decision_confirm:0 "Found the province and fix its institutions."
 hd_form_saved_k_sizhou_decision_requirement:0 "Si Province has no holder, and you fully control at least four of the five commanderies formerly under its jurisdiction"
 hd_form_saved_k_sizhou_decision_effect:0 "You hold Si Province, and its five former commanderies return to its [de_jure|E] jurisdiction"
 hd_form_saved_k_uuii_bingzhou_decision:0 "Establish Bing Province"
 hd_form_saved_k_uuii_bingzhou_decision_desc:0 "Urgent reports from the frontier commanderies lie on my desk beside the registers of Taiyuan, reminding me that holding a land is not the same as uniting its commanderies in purpose. If I establish the provincial seat of Bing Province, these military and civil affairs will at last have a proper home."
 hd_form_saved_k_uuii_bingzhou_decision_tooltip:0 "Unite the commanderies formerly under its jurisdiction and establish Bing Province"
 hd_form_saved_k_uuii_bingzhou_decision_confirm:0 "Found the province and fix its institutions."
 hd_form_saved_k_uuii_bingzhou_decision_requirement:0 "Bing Province has no holder, and you fully control at least ten of the twelve commanderies formerly under its jurisdiction"
 hd_form_saved_k_uuii_bingzhou_decision_effect:0 "You hold Bing Province, and its twelve former commanderies return to its [de_jure|E] jurisdiction"
 hd_form_saved_k_jiangzhou_decision:0 "Establish Jiang Province"
 hd_form_saved_k_jiangzhou_decision_desc:0 "Boats ply freely between the riverside commanderies, yet decrees do not always reach them along with the current. Now that I can unite most of them, it is time to establish a provincial seat under the name of Jiang Province to govern all the commanderies."
 hd_form_saved_k_jiangzhou_decision_tooltip:0 "Unite the commanderies formerly under its jurisdiction and establish Jiang Province"
 hd_form_saved_k_jiangzhou_decision_confirm:0 "Found the province and fix its institutions."
 hd_form_saved_k_jiangzhou_decision_requirement:0 "Jiang Province has no holder, and you fully control at least eleven of the thirteen commanderies formerly under its jurisdiction"
 hd_form_saved_k_jiangzhou_decision_effect:0 "You hold Jiang Province, and its thirteen former commanderies return to its [de_jure|E] jurisdiction"
 hd_form_saved_k_xiangzhou_decision:0 "Establish Xiang Province"
 hd_form_saved_k_xiangzhou_decision_desc:0 "Envoys from both banks of the Xiang River wait in the corridor, each clutching the documents of his own commandery. Having studied the map, I know these lands cannot govern themselves separately forever. The name of Xiang Province shall be the beginning of their union."
 hd_form_saved_k_xiangzhou_decision_tooltip:0 "Unite the commanderies formerly under its jurisdiction and establish Xiang Province"
 hd_form_saved_k_xiangzhou_decision_confirm:0 "Found the province and fix its institutions."
 hd_form_saved_k_xiangzhou_decision_requirement:0 "Xiang Province has no holder, and you fully control at least eight of the nine commanderies formerly under its jurisdiction"
 hd_form_saved_k_xiangzhou_decision_effect:0 "You hold Xiang Province, and its nine former commanderies return to its [de_jure|E] jurisdiction"
 hd_form_saved_k_suozhou_decision:0 "Establish Shuo Province"
 hd_form_saved_k_suozhou_decision_desc:0 "The passes of Beidi and Shuofang link a long, long frontier. With each commandery guarding only its own gates, it will never be able to face troubles from every side. I shall establish Shuo Province, so that military reports, grain transport, and commands all have a proper home."
 hd_form_saved_k_suozhou_decision_tooltip:0 "Unite the commanderies formerly under its jurisdiction and establish Shuo Province"
 hd_form_saved_k_suozhou_decision_confirm:0 "Found the province and fix its institutions."
 hd_form_saved_k_suozhou_decision_requirement:0 "Shuo Province has no holder, and you fully control at least ten of the twelve commanderies formerly under its jurisdiction"
 hd_form_saved_k_suozhou_decision_effect:0 "You hold Shuo Province, and its twelve former commanderies return to its [de_jure|E] jurisdiction"
 hd_form_saved_k_uuii_jiaozhou_decision:0 "Establish Jiao Province"
 hd_form_saved_k_uuii_jiaozhou_decision_desc:0 "The southern roads are long, and by the time the commandery envoys arrive, months of old reports have often piled up on the desk. If I am to govern this land for long, I must establish the jurisdiction of Jiao Province, so that near and distant counties alike recognize the same seal."
 hd_form_saved_k_uuii_jiaozhou_decision_tooltip:0 "Unite the commanderies formerly under its jurisdiction and establish Jiao Province"
 hd_form_saved_k_uuii_jiaozhou_decision_confirm:0 "Found the province and fix its institutions."
 hd_form_saved_k_uuii_jiaozhou_decision_requirement:0 "Jiao Province has no holder, and you fully control at least five of the six commanderies formerly under its jurisdiction"
 hd_form_saved_k_uuii_jiaozhou_decision_effect:0 "You hold Jiao Province, and its six former commanderies return to its [de_jure|E] jurisdiction"
 hd_form_saved_k_yingzhou_decision:0 "Establish Ying Province"
 hd_form_saved_k_yingzhou_decision_desc:0 "Documents from Nanyang, Nan Commandery, and the lands of Jianghan cover my desk. Now that the borders have gradually joined into one, I can no longer let decrees halt at the old boundaries. Ying Province shall give these commanderies a common provincial seat."
 hd_form_saved_k_yingzhou_decision_tooltip:0 "Unite the commanderies formerly under its jurisdiction and establish Ying Province"
 hd_form_saved_k_yingzhou_decision_confirm:0 "Found the province and fix its institutions."
 hd_form_saved_k_yingzhou_decision_requirement:0 "Ying Province has no holder, and you fully control at least seven of the eight commanderies formerly under its jurisdiction"
 hd_form_saved_k_yingzhou_decision_effect:0 "You hold Ying Province, and its eight former commanderies return to its [de_jure|E] jurisdiction"
 hd_form_saved_k_pingzhou_decision:0 "Establish Ping Province"
 hd_form_saved_k_pingzhou_decision_desc:0 "The commanderies of Liaodong lie beyond distant passes and mountains, and sending orders back and forth is no easy matter. Now that these lands are gradually coming under my rule, I shall raise the provincial seat of Ping Province, so that the frontier commanderies no longer face troubles from every quarter on their own."
 hd_form_saved_k_pingzhou_decision_tooltip:0 "Unite the commanderies formerly under its jurisdiction and establish Ping Province"
 hd_form_saved_k_pingzhou_decision_confirm:0 "Found the province and fix its institutions."
 hd_form_saved_k_pingzhou_decision_requirement:0 "Ping Province has no holder, and you fully control at least seven of the eight commanderies formerly under its jurisdiction"
 hd_form_saved_k_pingzhou_decision_effect:0 "You hold Ping Province, and its eight former commanderies return to its [de_jure|E] jurisdiction"
