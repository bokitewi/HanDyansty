l_english:
 # Submission negotiation (2026-10-25)
 # Offer vassalization: acceptance entries
 hd_neg_reason_gold:0 "Gold promised: $VALUE|=+0$"
 hd_neg_reason_prestige:0 "Prestige promised: $VALUE|=+0$"
 hd_neg_reason_influence:0 "Influence ceded: $VALUE|=+0$"
 hd_neg_reason_warlord:0 "Warlord status granted: $VALUE|=+0$"
 hd_neg_not_petitioning_tt:0 "They are not currently petitioning someone else for vassalage"
 # Offer vassalization: concessions in the window
 hd_neg_o_gold1:0 "Grant @gold_icon!$HD_NEG_GOLD1|0$ Gold (about half a year of their income)"
 hd_neg_o_gold2:0 "Grant @gold_icon!$HD_NEG_GOLD2|0$ Gold (about a year of their income)"
 hd_neg_o_gold3:0 "Grant @gold_icon!$HD_NEG_GOLD3|0$ Gold (about two years of their income)"
 hd_neg_o_gold_desc:0 "Paid from your [gold|E] on the day they submit; the amount scales with their wealth. If you cannot pay then, the deal is off."
 hd_neg_o_prestige1:0 "Grant @prestige_icon!$HD_NEG_PRESTIGE1|0$ Prestige"
 hd_neg_o_prestige2:0 "Grant @prestige_icon!$HD_NEG_PRESTIGE2|0$ Prestige"
 hd_neg_o_prestige_desc:0 "Honors and rich gifts: on the day they submit you lose this much [prestige|E] and they gain the same. If you cannot pay then, the deal is off."
 hd_neg_o_influence1:0 "Cede @influence_icon!$HD_NEG_INFLUENCE1|0$ Influence"
 hd_neg_o_influence2:0 "Cede @influence_icon!$HD_NEG_INFLUENCE2|0$ Influence"
 hd_neg_o_influence_desc:0 "On the day they submit you hand this much [influence|E] to them. If you cannot pay then, the deal is off."
 hd_neg_o_warlord:0 "Grant Warlord status"
 hd_neg_o_warlord_desc:0 "Once they submit they become a Warlord: no taxes, no levies, acclamation succession, and your opinion of them does not drop for it.\nIf you revoke their power within ten years you break your word: [prestige|E] #N -350#!, and all your vassals' opinion of you #N -15#! (fading over five years)."
 hd_neg_accept_terms_tt:0 "Promised terms are honored on the day they submit. A greedy, ambitious or arrogant ruler who sees no concession from you may name a further price, and will not submit unless you meet it."
 hd_neg_decline_counter_tt:0 "If the gap is small (60 acceptance or less), they will write back with their terms."
 # Petition for vassalage: acceptance entries
 hd_neg_reason_cannot_pay:0 "Cannot meet their terms: $VALUE|=+0$"
 hd_neg_reason_no_warlord:0 "Unwilling to make them a Warlord: $VALUE|=+0$"
 # Settlement
 hd_neg_warlord_term_tt:0 "Becomes a #V Warlord#! on submitting; their power will not be revoked for ten years (revoking earlier breaks your word)"
 hd_neg_void_title:0 "Submission Called Off"
 hd_neg_void_desc:0 "The promised terms could not be paid when the time came, so the deal is void."
 hd_neg_haggle_ok_title:0 "Haggling Succeeded"
 hd_neg_haggle_fail_title:0 "Haggling Failed"
 hd_neg_haggle_fail_desc:0 "They would not budge, and the talks of submission are over."
 hd_neg_petition_uncond_ok_title:0 "Envoy Accepts Unconditional Submission"
 hd_neg_petition_uncond_fail_title:0 "Envoy Leaves in Anger"
 hd_neg_petition_uncond_fail_desc:0 "They refuse to submit without terms, and the matter is dropped."
 hd_neg_warlord_refused_title:0 "Demand Refused"
 hd_neg_warlord_refused_desc:0 "They will not let you keep your own army, and the talks break down."
 # Breach
 hd_neg_breach_tt:0 "Broke the promise not to revoke their power for ten years"
 hd_neg_breach_opinion:0 "Broke Their Word"
 # Term list (event descriptions)
 hd_neg_terms_header:0 "\n\nTheir terms:"
 hd_neg_term_gold_line:0 "\n• Grant @gold_icon!#V [hd_neg_v.MakeScope.Var('hd_neg_gold').GetValue|0]#! Gold"
 hd_neg_term_prestige_line:0 "\n• Grant @prestige_icon!#V [hd_neg_v.MakeScope.Var('hd_neg_prestige').GetValue|0]#! Prestige"
 hd_neg_term_influence_line:0 "\n• Cede @influence_icon!#V [hd_neg_v.MakeScope.Var('hd_neg_influence').GetValue|0]#! Influence"
 hd_neg_term_warlord_line:0 "\n• Grant #V Warlord#! status, not to be revoked for ten years"
 # hd_neg.0001 Counter-offer
 hd_neg.0001.t:0 "The Envoy Names a Price"
 hd_neg.0001.desc_gap:0 "[hd_neg_v.GetTitledFirstName] sends back a letter: \"Your kindness honors me, and I would gladly obey. But my men and their families all depend on me, and submitting empty-handed would unsettle them. Grant me the following, and I will bring my people over at once.\""
 hd_neg.0001.desc_opportunist:0 "[hd_neg_v.GetTitledFirstName] agrees to submit, but the envoy adds: \"My lord has given his word to submit. There is only one more thing he asks of you.\""
 hd_neg.0001.a:0 "Grant what they ask"
 hd_neg.0001.b:0 "Haggle"
 hd_neg.0001.b.tt:0 "Push the last thing they asked for down one tier (Warlord status becomes ceded influence or a large gold grant; the lowest tier becomes nothing).\nChance of success: #V [hd_neg_v.MakeScope.Var('hd_neg_haggle_chance').GetValue|0]%#!. If it fails, the talks break down."
 hd_neg.0001.c:0 "Never mind"
 hd_neg.0001.c.tt:0 "The talks of submission end here, and cannot be raised again for two years."
 # hd_neg.0011 A powerful neighbor urges submission
 hd_neg.0011.t:0 "A Powerful Neighbor Urges Submission"
 hd_neg.0011.desc:0 "An envoy from [hd_neg_l.GetTitledFirstName] urges me to submit with all my lands: \"The realm is in chaos, and holding out alone cannot last. Let us settle the bond of lord and vassal; your lands and vassals will stay as they are.\"\n\nThe envoy is earnest. Whether to submit, and on what terms, is still open to discussion."
 hd_neg.0011.a:0 "Submit without conditions"
 hd_neg.0011.a.tt:0 "Submit to [hd_neg_l.GetTitledFirstName], keeping your lands and vassals as they are."
 hd_neg.0011.b:0 "Demand @gold_icon![ROOT.Char.MakeScope.Var('hd_neg_show_gold').GetValue|0] Gold"
 hd_neg.0011.c:0 "Demand @prestige_icon![ROOT.Char.MakeScope.Var('hd_neg_show_prestige').GetValue|0] Prestige"
 hd_neg.0011.d:0 "Demand @influence_icon![ROOT.Char.MakeScope.Var('hd_neg_show_influence').GetValue|0] Influence"
 hd_neg.0011.e:0 "Demand Warlord status"
 hd_neg.0011.e.yes:0 "They are strong enough to keep you in check and will agree: you become a Warlord on submitting, and your power will not be revoked for ten years."
 hd_neg.0011.e.no:0 "They will not agree (their army is less than three times yours, they are paranoid, or they dislike you), and the talks will break down."
 hd_neg.0011.paid.tt:0 "They can afford it and will agree; it is paid on the day you submit."
 hd_neg.0011.f:0 "Politely decline"
 # hd_neg.0021 A conditional petition
 hd_neg.0021.t:0 "An Envoy Offers Submission"
 hd_neg.0021.desc:0 "[hd_neg_v.GetTitledFirstName] sends a letter: \"My lands are small and my forces weak. I wish to bring my people under your banner and serve you as a loyal vassal. But my followers may not all be convinced, so I ask that you grant me the following.\""
 hd_neg.0021.a:0 "Grant their terms and accept them"
 hd_neg.0021.b:0 "Accept them only without conditions"
 hd_neg.0021.b.tt:0 "Chance they agree: #V [hd_neg_v.MakeScope.Var('hd_neg_haggle_chance').GetValue|0]%#!. If not, the matter is dropped."
 hd_neg.0021.b.must:0 "This one aims high and will never come without terms; the matter will be dropped."
 hd_neg.0021.c:0 "Turn them away"
