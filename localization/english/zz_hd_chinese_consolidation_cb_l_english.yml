 hd_chinese_consolidation_cb_victory_desc:0 "[attacker.GetShortUIName|U] will receive the title of War Objective for this campaign. Furthermore, other Chinese counties held by counts within [defender.GetShortUINamePossessive]'s territory that were occupied by the aggressor will be plundered: the aggressor gains gold coins, while the control and development levels of these counties are reduced, buildings may be destroyed, and they fall into a \"Recently Plundered\" status for five years."
