l_english:
 hds_sq_base_army:0 "Sun Clan Veterans of the Rebellion Campaigns"
 hds.5100.t:0 "Death on Xianshan"
 hds.5100.desc:0 "An order from Yuan Shu sends you south against Liu Biao. Victory follows victory as you cross the Hanshui and surround Xiangyang so tightly that nothing can pass.\n\nTonight, you leave camp with only a few riders, intending to climb Xianshan by moonlight and examine the city. The mountain path is narrow, the bamboo thick, and the silence uncanny.\n\nBowstrings sound from the woods all at once. Jingzhou troops have been waiting in ambush, and it is too late to turn your horse. Amid the flight of arrows, the last thing you see is firelight flickering on Xiangyang's walls."
 hds.5100.a:0 "Bofu... Jiangdong is yours to protect now..."
 hds.4100.t:0 "Taking Charge of Jiangdong"
 hds.4100.desc:0 "Your elder brother's death came too suddenly. Yesterday he was drawing his bow on the parade ground; today, white funeral banners cover the camp gates.\n\nAll the generals are looking at you. On his deathbed, your brother placed his seal and ribbon in your hands and said only this: ‘In leading the men of Jiangdong, seizing the moment between opposing armies, and contending with the realm's great powers, you are not my equal. In appointing the worthy, winning each man's wholehearted service, and preserving Jiangdong, I am not yours.’\n\nYou grip the seal tightly. The path your father and brother left unfinished is now yours to follow."
 hds.4100.a:0 "Carry on my father and brother's work. Secure Jiangdong."
