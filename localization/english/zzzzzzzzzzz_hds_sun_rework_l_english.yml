l_english:
 hds_sq_base_army:0 "Sun Family Old Guard"
 hds.5100.t:0 "Death at Mount Xian"
 hds.5100.desc:0 "Yuan Shu's orders sent you south against Liu Biao. Victory followed victory; you crossed the Han River and ringed Xiangyang in a tight siege.\n\nTonight you rode out with only a few horsemen, hoping to climb Mount Xian by moonlight and look down into the city. The path was narrow, the bamboo thick, and the hills unnaturally quiet.\n\nThe bowstrings sang all at once from the grove. Jing Province's ambushers had been waiting, and there was no time to turn. Amid the falling arrows, the last thing you saw was torchlight flickering on the walls of Xiangyang."
 hds.5100.a:0 "Bofu... Jiangdong is yours now..."
 hds.4100.t:0 "Master of Jiangdong"
 hds.4100.desc:0 "Your brother was taken far too suddenly. Yesterday he was drawing a bow on the training ground; today white mourning banners hang over the camp gate.\n\nEvery officer is looking at you. With his last breath your brother pressed the seal of office into your hands: \"In leading the host of Jiangdong into battle to contend with the realm, you are not my equal. In raising the able and winning men's hearts to hold Jiangdong, I am not yours.\"\n\nYou close your hand around the seal. The road your father and brother left unfinished is yours to walk now."
 hds.4100.a:0 "I will finish what they began."
