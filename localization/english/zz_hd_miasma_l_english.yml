l_english:
 hd_miasma_county_modifier:0 "Miasma"
 hd_miasma_county_modifier_desc:0 "The forest is deep and dense, the air hot and humid, and miasma rife. When troops enter this region, disease and plague follow; when civilians dwell on this land, reclaiming it proves arduous. \n\n#X @warning_icon! Once the [county|E] of [development|E] is raised to #V  30#! or higher, its directly governed lord can remove this modifier via [GetDecisionWithKey('hd_clear_miasma_decision').GetName][decision|E]. #!\n\n"
 hd_clear_miasma_decision:0 "Clear the miasma"
 hd_clear_miasma_decision_desc:0 "South of the Jiangling Ridge, the land is low-lying and damp, with oppressive heat; miasmic clouds linger without dispersal. Inhabitants suffer from plagues, and travelers are warned against the roads. \n\n Now that the population within our borders grows daily and fields gradually expand, it is precisely the time to dispatch medical artisans, drain marshes, burn rotting vegetation, and relocate sickly citizens, thereby restoring this region's water and soil to clarity. \n\n Expenses are calculated based on the number of qualifying counties; one clearance will remove all [development|E] direct-controlled miasma-affected counties with a value not less than #V  30#!."
 hd_clear_miasma_decision_tooltip:0 "Remove all direct-controlled [counties|E] where all [development|E] are not less than or equal to #V  30 #!, from [GetModifier('hd_miasma_county_modifier').GetNameWithTooltip][county_modifier|E]."
 hd_clear_miasma_decision_confirm:0 "Confirm"
 hd_miasma_county_eligible_removal_tt:0 "At least one direct-controlled [county|E] possesses [GetModifier('hd_miasma_county_modifier').GetName][county_modifier|E], and [development|E] is not less than #V  30#!."
 hd_miasma_removal_tt:0 "[GetModifier('hd_miasma_county_modifier').GetNameWithTooltip] will be removed from all direct [county|E] with a value of #V 30#! or more in [development|E]."
 hd_miasma_no_counties_meet_criteria_tt:0 "@alert_icon!#alert_trial There are currently no directly governed earldoms that meet this criterion!#!"
 hd_miasma_cleared.t:0 "Miasma has been cleared"
 hd_miasma_cleared.desc:0 "[ROOT.Char.GetFullName]Dredge the waters and marshes, dispatch medical artisans widely, and restore clarity to lands plagued by miasma."
