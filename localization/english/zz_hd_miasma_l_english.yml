l_english:
 hd_miasma_county_modifier:0 "Miasma"
 hd_miasma_county_modifier_desc:0 "Deep forests, steaming wetlands and pestilential airs shroud this land. Armies sicken on the march, and settlers struggle to break ground.\n\n#X @warning_icon!Once this [county|E] reaches [development|E] #V 30#! or higher, its direct holder may remove this modifier via the [GetDecisionWithKey('hd_clear_miasma_decision').GetName] [decision|E]!#!\n\n"
 hd_clear_miasma_decision:0 "Clear the Miasma"
 hd_clear_miasma_decision_desc:0 "South of the rivers and beyond the ridges, miasmic clouds linger over damp, sweltering lowlands, sickening folk and barring the roads.\n\nYet the land grows more settled by the year: send physicians, drain the marshes, burn the rotting thickets, and give this land back its clean air.\n\nThe cost scales with the number of qualifying counties; all directly held miasma counties with [development|E] of at least #V 30#! are cleared at once."
 hd_clear_miasma_decision_tooltip:0 "Remove the [GetModifier('hd_miasma_county_modifier').GetNameWithTooltip] [county_modifier|E] from every directly held [county|E] with [development|E] of at least #V 30#!"
 hd_clear_miasma_decision_confirm:0 "Confirm"
 hd_miasma_county_eligible_removal_tt:0 "At least one directly held [county|E] has the [GetModifier('hd_miasma_county_modifier').GetName] [county_modifier|E] and [development|E] of at least #V 30#!"
 hd_miasma_removal_tt:0 "The [GetModifier('hd_miasma_county_modifier').GetNameWithTooltip] will be removed from every directly held [county|E] with [development|E] of at least #V 30#!"
 hd_miasma_no_counties_meet_criteria_tt:0 "@alert_icon!#alert_trial No counties currently meet the criteria!#!"
 hd_miasma_cleared.t:0 "Miasma Cleared"
 hd_miasma_cleared.desc:0 "[ROOT.Char.GetFullName] has drained the marshes and dispatched physicians; the miasmic lands breathe clear again."
