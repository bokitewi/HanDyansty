l_english:
 hd_miasma_county_modifier:0 "Miasma"
 hd_miasma_county_modifier_desc:0 "Dense forests trap humid heat, and disease runs rampant. Troops entering this land fall ill; its inhabitants struggle to clear and cultivate it.\n\n#X @warning_icon!Once the [development|E] of this [county|E] reaches #V 30#! or higher, its direct holder can remove this hazard through the [GetDecisionWithKey('hd_clear_miasma_decision').GetName] [decision|E]!#!\n\n"
 hd_clear_miasma_decision:0 "Clear the Miasma"
 hd_clear_miasma_decision_desc:0 "South of the rivers and mountain ranges, the low, damp land swelters under clouds of miasma. Residents sicken, and travelers fear the roads.\n\nNow that your population is growing and more fields are being cleared, you can send physicians, drain the marshes, burn rotting vegetation, and move the sick to healthier ground, restoring this land to health."
 hd_clear_miasma_decision_tooltip:0 "Remove [GetModifier('hd_miasma_county_modifier').GetNameWithTooltip] from directly held [counties|E] in your domain that have sufficient [development|E]"
 hd_clear_miasma_decision_confirm:0 "Burn the brush and drain the marshes!"
 hd_miasma_county_eligible_removal_tt:0 "At least one [county|E] in your domain has the [GetModifier('hd_miasma_county_modifier').GetName] [county_modifier|E] and [development|E] of at least #V 30#!"
 hd_miasma_removal_tt:0 "All [counties|E] in your domain with [development|E] of at least #V 30#! will be free of [GetModifier('hd_miasma_county_modifier').GetNameWithTooltip]"
 hd_miasma_no_counties_meet_criteria_tt:0 "@alert_icon!#alert_trial No county in your domain currently meets these requirements!#!"
 hd_miasma_cleared.t:0 "The Miasma Recedes"
 hd_miasma_cleared.desc:0 "[ROOT.Char.GetFullName] has drained the marshes and dispatched physicians throughout the domain, restoring health to lands afflicted by miasma."
