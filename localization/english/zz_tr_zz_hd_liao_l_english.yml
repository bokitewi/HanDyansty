l_english:
 rule_hd_liao_migration_rule:0 "Liao Migration into Shu"
 setting_hd_liao_rule_historical:0 "#high Historical#!"
 setting_hd_liao_rule_historical_desc:0 "After the year 280, when the dynastic cycle is in the Turmoil, Chaos or Collapse phase and the defenders of Shu have no more than twice the troops of the Liao chief (including event troops), the AI has a 10% chance each year to launch the Liao migration into Shu."
 setting_hd_liao_rule_random:0 "#high Random#!"
 setting_hd_liao_rule_random_desc:0 "Regardless of the year, the AI may launch the Liao migration into Shu whenever conditions are met."
 setting_hd_liao_rule_player_only:0 "#high Players Only#!"
 setting_hd_liao_rule_player_only_desc:0 "The AI will not launch the Liao migration into Shu; only players can initiate it via decision."
 setting_hd_liao_rule_off:0 "#high Off#!"
 setting_hd_liao_rule_off_desc:0 "Disable the Liao migration into Shu."
 hd_liao_migration_decision:0 "Lead the People into Shu"
 hd_liao_migration_decision_desc:0 "Shu has suffered years of war: its fields lie fallow and its towns stand empty. More and more Liao gather in the mountain valleys, and the old lands can no longer feed so many. To the north, the fertile plains of Ba-Shu await those who would till them."
 hd_liao_migration_decision_tooltip:0 "Lead the whole clan north and occupy Shu"
 hd_liao_migration_decision_confirm:0 "Order all the tribes to prepare to march north!"
 hd_liao_migration_decision_flavour_effect:0 "You gain a one-time [hd_liao_migration_casus_belli|E]"
 hd_liao_migration_decision_year_ok:0 "The time to march north has come"
 hd_liao_migration_decision_phase_ok:0 "The dynastic cycle is in the Turmoil, Conquest, Struggle, Standoff or Collapse phase"
 hd_liao.0001.t:0 "The Liao Enter Shu"
 hd_liao.0001.desc:0 "Life in the mountains grows harder every year. Each cave and stockade has more mouths to feed, yet the arable slopes remain as few as ever.\n\nScouts returning from the north report that after years of war in Shu, many commanderies and counties have only a handful of households left; the fields lie untended and the officials cannot cope.\n\nIf you lead your people north, your kin can put down roots in Ba-Shu."
 hd_liao.0001.a:0 "March on Shu!"
 hd_liao.0001.a.tt:0 "You may use a special one-time [hd_liao_migration_casus_belli|E] against the rulers of Shu"
 hd_liao.0002.desc:0 "Your vassal [hd_liao_invader.GetShortUIName] has unexpectedly gathered all the Liao tribes and means to lead the whole people north into Shu.\n\nShould this succeed, your hold over that region may well be lost."
 hd_liao.0002.a:0 "Foolhardy and witless!"
 hd_liao.0002.a.tt:0 "The Liao begin the [hd_liao_migration|E]"
 hd_liao.0003.desc:0 "Ill news comes from the south. [hd_liao_invader.GetShortUIName], a Liao chieftain, has gathered every man under him and intends to march north in force to seize Shu.\n\nEven now, the Liao tribes are mustering..."
 hd_liao.0003.a:0 "How could mountain savages cross the ridges?"
 HD_LIAO_MIGRATION_WAR_NAME:0 "Liao Migration into [TITLE.GetBaseName]"
 HD_LIAO_MIGRATION_CB_NAME:0 "Liao Migration into Shu"
 hd_liao_migration_war_victory_desc_attacker:0 "You will seize all of [defender.GetShortUINamePossessive] titles in Shu. All holdings outside Shu will be abandoned."
 hd_liao_migration_war_victory_desc:0 "Seize all of [defender.GetShortUINamePossessive] titles in Shu. All holdings outside Shu will be abandoned."
 hd_liao_migration_war_warning_desc:0 "\n\n#X The Liao Migration into Shu can happen only once per game.#!"
 game_concept_hd_liao_migration_casus_belli:0 "$HD_LIAO_MIGRATION_CB_NAME$ Casus Belli"
 game_concept_hd_liao_migration_casus_belli_desc:0 "A powerful [casus_belli|E] usable only once per game, targeting all territory in the heartland of Shu and Baxi.\n\nOn victory, the Liao chieftain moves his capital to Shu, the new capital adopts Liao culture, and the surrounding counties gradually become Liao over time. Vassals and holdings outside Shu are abandoned to local warlords."
 hd_liao_migration_effect.tt.new_capital:0 "Move the capital to the most developed directly held county in Shu"
 hd_liao_migration_effect.tt.capital_culture:0 "The [county|E] of the new capital adopts $liaoren$ culture"
 hd_liao_migration_effect.tt.destroy_other_kingdoms:0 "All other held [kingdoms|E] besides the [primary_title|E] are destroyed"
 hd_liao_migration_effect.tt.non_liao_vassals:0 "Non-$liaoren$ [vassals|E] outside Shu become [independent|E]"
 hd_liao_migration_effect.tt.liao_vassals:0 "$liaoren$ [vassals|E] outside Shu receive [titles|E] from the newly won lands in Shu"
 hd_liao_migration_effect.tt.former_territories:0 "Former lands outside Shu are handed to local warlords"
 hd_liao_migration_effect.tt.settlement_story:0 "Each year thereafter, a neighboring [county|E] may adopt $liaoren$ culture"
 hd_liao_horde_title_name:0 "Liao Tribes"
 hd_liao_horde_title_adj:0 "Liao"
 hd_liao_conquer_army_name:0 "Liao Host into Shu"
 hd_liao_hold_army_name:0 "Liao Garrison"
 hd_foreign_settlement_county_modifier:0 "Mixed Foreign Settlement"
 hd_foreign_settlement_county_modifier_desc:0 "Newly arrived foreign tribes live side by side with the old inhabitants; it will take time for them to grow used to one another."
 HD_LIAO_MIGRATION_WAR_NAME_BASE:0 ""
 hd_liao_migration_cb:0 "$HD_LIAO_MIGRATION_CB_NAME$"
 game_concept_hd_liao_migration:0 "$HD_LIAO_MIGRATION_CB_NAME$"
