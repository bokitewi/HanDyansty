 hd_historical_world.0188.t:0 "Pacifying Jingzhou"
 hd_historical_world.0188.desc:0 "The court has charged me with governing Jingzhou and restoring order along the Han and Yangtze. The former inspector's offices, commanderies, and armies must pass into my hands; from this day onward, Jingzhou answers to me."
 hd_historical_world.0188.a:0 "Assume command and restore order."
