l_english:
 # 2026-10-24 boki：徐州内斗削弱刘备（徐州未附、丹阳兵之乱），见 zz_hd_lbxz_effects.txt 节点 0、2b
 hd_lbxz_xuzhou_unsettled:0 "Xu Province Unreconciled"
 hd_lbxz_xuzhou_unsettled_desc:0 "Tao Qian is newly dead. His Danyang veterans and the local gentry of Xu alike refuse to accept this outsider, and every levy and tax meets resistance."
 hd_lbxz.0210.t:0 "Mutiny of the Danyang Troops"
 hd_lbxz.0210.desc_killed:0 "Urgent news reaches the camp: while you were away with the army, Zhang Fei quarrelled with Cao Bao, Chancellor of Xiapi, and killed him in a rage. The Danyang troops in the city were Governor Tao's old men and had never accepted you, an outsider, as their lord. Their commander [hd_lbxz_dy_leader_e.GetName] shut the gates overnight and took the provincial seat for himself.\n\nThe gentry of Xu watch and wait, and most of the officers left behind have gone over to the mutineers. Zhang Fei cut his way out with your household and now kneels to beg forgiveness. The province Governor Tao entrusted to you is lost."
 hd_lbxz.0210.desc:0 "Urgent news reaches the camp: while you were away with the army, the Danyang troops in the city mutinied. They were Governor Tao's old men and had never accepted you, an outsider, as their lord. [hd_lbxz_dy_leader_e.GetName] seized the moment, shut the gates and took the provincial seat for himself.\n\nThe gentry of Xu watch and wait, and most of the officers left behind have gone over to the mutineers. The province Governor Tao entrusted to you is lost."
 hd_lbxz.0210.a:0 "Gather what men remain and fall back to Xiaopei."
 hd_lbxz_danyang_tt:0 "[hd_lbxz_dy_leader_e.GetName] takes all your lands and AI vassals and assumes your position. You and your followers become a wandering band again and camp at Xiaopei. Player vassals become independent where they stand."
