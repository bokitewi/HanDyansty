l_english:
 hd_palace_crisis.0001.t:0 "Shadows at Court"
 hd_liu_hong_timeline_protection:0 "Illness Held at Bay"
 hd_liu_hong_timeline_protection_desc:0 "The emperor's illness is temporarily held at bay while the court preserves a fragile order."
 hd_palace_crisis.0001.desc:0 "Inside the Luoyang palace, the struggle between the Ten Attendants and General-in-Chief He Jin has passed the point of return. Each side is searching for a way to destroy the other, and every whisper in the court could be the prelude to bloodshed."
 hd_palace_crisis.0001.a:0 "Watch who draws first."
 hd_palace_crisis.0002.t:0 "The Final Measure"
 hd_palace_crisis.0002.desc:0 "Yuan Shao takes He Jin aside with a dangerous proposal: if the eunuchs cannot be removed inside the palace, summon the armies of Liangzhou and use an outside force to break their grip. It may destroy the Attendants—or set all the realm alight."
 hd_palace_crisis.0002.a:0 "Send the letter to Liangzhou."
 hd_palace_crisis.0003.t:0 "March to Luoyang?"
 hd_palace_crisis.0003.desc:0 "The summons reaches the Liangzhou army. Your adviser warns that the call to Luoyang may be the court's last gamble: entering the capital could change the realm, but it would also place your army in the middle of a palace crisis."
 hd_palace_crisis.0003.a:0 "March to Luoyang."
 hd_palace_crisis.0004.t:0 "The Palace Doors Close"
 hd_palace_crisis.0004.desc:0 "The Ten Attendants learn that an outside army is on its way and strike first. He Jin is trapped behind the palace gates; one door after another closes, and he realizes that he will not leave the palace alive."
 hd_palace_crisis.0004.a:0 "The die is cast…"
 hd_palace_crisis.0005.t:0 "Blood at the Palace Gate"
 hd_palace_crisis.0005.desc:0 "News of He Jin's murder reaches Yuan Shao and Cao Cao. Their soldiers storm the palace, breaking through the forbidden gates as the Ten Attendants flee through the firelight. The court struggle ends in blood."
 hd_palace_crisis.0005.a:0 "Let none of them escape."
 hd_palace_crisis.0006.t:0 "Calm Waters?"
 hd_palace_crisis.0006.desc:0 "He Jin is dead, and the Ten Attendants have been purged. Without a Liangzhou army storming the gates, authority over Sili has fallen to you; yet the court's calm is only the surface of a greater storm."
 hd_palace_crisis.0006.a:0 "Stabilize the court first."
 hd_palace_crisis.0010.t:0 "March with the Army?"
 hd_palace_crisis.0010.desc:0 "The Liangzhou army has broken camp and begun its march to Luoyang. Your lord offers a simple choice: bring your estate and followers, or remain in Liangzhou to guard your own foundation."
 hd_palace_crisis.0010.a:0 "March with my lord."
 hd_palace_crisis.0010.b:0 "I will remain in Liangzhou."
 hd_palace_crisis.0015.t:0 "Deposition"
 hd_palace_crisis.0015.desc:0 "The regent now controls the palace gates, the army, and Sili. The emperor's position is only a decree away from changing; the ministers rage, and you must decide whether to replace the Son of Heaven with another Liu kinsman. After the deposition, several unannounced killings will follow inside the palace."
 hd_palace_crisis.0015.a:0 "Replace the emperor."
 hd_palace_crisis.0016.t:0 "Open Defiance"
 hd_palace_crisis.0016.desc:0 "Yuan Shao challenges your deposition in open court. His voice shakes the ministers, but he lacks the troops to remain in the capital. After the confrontation, he leaves Luoyang to seek his fortune in Bohai."
 hd_palace_crisis.0016.a:0 "Let him go."
 hd_palace_crisis.0021.t:0 "Ding Yuan's Old Guard"
 hd_palace_crisis.0021.desc:0 "Ding Yuan arrives with his Bingzhou veterans. Lü Bu's presence briefly checks Dong Zhuo's boldness, but his silence reveals the danger beneath the meeting: this confrontation will not end with Ding Yuan's loyalty."
 hd_palace_crisis.0021.a:0 "Hear what Lü Bu will choose."
 hd_palace_crisis.0022.t:0 "Buy Lü Bu"
 hd_palace_crisis.0022.desc:0 "Dong Zhuo offers Lü Bu rank, reward, and a future. Ding Yuan does not see the blade behind him until it is too late; Lü Bu accepts the bargain and takes the title of Dong Zhuo's adopted son."
 hd_palace_crisis.0022.a:0 "Bring Ding Yuan's old guard into the fold."
 hd_palace_crisis.0023.t:0 "Anger and Relocation"
 hd_palace_crisis.0023.desc:0 "Yuan Shao's proclamation spreads through the commanderies, and an anti-Dong coalition is taking shape. An adviser urges Dong Zhuo to withdraw to Chang'an; furious, Dong chooses to leave Luoyang—and its resisters—behind."
 hd_palace_crisis.0023.a:0 "Move to Chang'an and raze Luoyang."


