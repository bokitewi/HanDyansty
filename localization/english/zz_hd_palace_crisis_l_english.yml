l_english:
 hd_palace_crisis.0001.t:0 "Rumors from the Capital"
 hd_palace_crisis.0001.desc:0 "The news from Luoyang is more tangled than any dispatch from the front. He Jin is at odds with the eunuchs. One day, I hear that a settlement has been reached; the next, that the Empress Dowager will not allow it. Every messenger first tries to discover which account I would prefer to believe.\n\nI pass the letters to my attendants and step to the entrance of my tent. The soldiers of Liangzhou are checking their tack as usual. A quarrel behind the palace gates means little to them, so far away. Yet if someone at court seeks to settle it with troops from outside the capital, these men will suddenly become very valuable indeed.\n\nThere is no formal summons in the letters. I need not declare for either side just yet. I need only watch for the moment when words cease to suffice, and my army finds a place in their calculations."
 hd_palace_crisis.0001.a:0 "Wait and watch the capital."
 hd_palace_crisis.0002.t:0 "Summoning Outside Troops"
 hd_palace_crisis.0002.desc:0 "The quarrel in the capital has finally found another course. Word has reached me that Yuan Shao has urged He Jin to summon outside troops, using their strength to force the Empress Dowager to put the eunuchs to death. My name is among those mentioned to lead them.\n\nI read those few lines twice. He Jin may only want the clatter of armor to settle a dispute that has dragged on too long. But has he considered that an army at the city walls is no memorial he can simply withdraw?\n\nMy attendants ask whether we should act at once. I wave them to silence. News is not an imperial command. We can check the provisions and inquire about the roads, but the authority under which we enter the capital must wait for a proper summons to reach the army."
 hd_palace_crisis.0002.a:0 "Check the supply routes. Await the summons."
 hd_palace_crisis.0003.t:0 "Summoned to the Capital"
 hd_palace_crisis.0003.desc:0 "The summons has finally arrived. I unfold it, and when I reach the order to lead my army into the capital, I press a finger to the line and have it read aloud once more. A horse neighs outside the tent, as though it understands sooner than my attendants what good fortune this is.\n\nAfter all their quarreling, the men at court still need my soldiers. Someone asks whose command we will be under in Luoyang. I look up at him; he hastily changes the subject to provisions. We have not even brought the troops there, and already someone is thinking how others might restrain me.\n\nI roll up the summons and tap it against the edge of the table. However forbidding the capital's palace gates may be, there comes a time when they must invite someone through. With the summons in my hand and armed men at my side, why should I hesitate?"
 hd_palace_crisis.0003.a:0 "We march by imperial command. Set out today."
 hd_palace_crisis.0004.t:0 "The Palace Gates Close"
 hd_palace_crisis.0004.desc:0 "When the palace gates close behind me, I think it is merely the usual clearing of the way. Only when men block the passage ahead do I realize that I can no longer hear those who came with me.\n\nThe eunuchs have abandoned their accustomed courtesies. They speak of the approaching troops, of my secret discussions with Yuan Shao. Their tone leaves no room for an answer. I demand to know who dares obstruct the General-in-Chief. Advancing footsteps and drawn blades are their only reply.\n\nMy hand goes to my belt, and I suddenly think of those still waiting outside the palace gates. They can see my carriage and horses, but not the weapons closing around me. In the end, the summons I sent for outside troops cannot open this door for me."
 hd_palace_crisis.0004.a:0 "The troops outside... Why have they not come?"
 hd_palace_crisis.0005.t:0 "Blood on the Palace Gates"
 hd_palace_crisis.0005.desc:0 "Word of He Jin's murder reaches the palace gates, and the soldiers who were waiting there erupt into confusion. I lead them inside. Shouts and the cries of fleeing men mingle beyond the forbidden gates; no one will stop long enough to hear an order through.\n\nThe eunuchs and their followers have been purged, yet blood still stains the passages and the ground beneath the eaves. As I pass a gate that was guarded only moments ago, I understand that drawing swords against one faction does not mean someone else can immediately take command of the court.\n\nFresh word comes from outside the city: Dong Zhuo's army is drawing near. We called in outside troops to force the palace to yield. Now He Jin is dead and the palace gates are broken. Who will tell that army it no longer needs to enter the city?"
 hd_palace_crisis.0005.cao_desc:0 "Yuan Shao is dead, and now He Jin has been murdered in the palace. Once the news arrives, waiting any longer is the greatest danger of all. I lead my troops through the forbidden gates. The wary whispers of a moment before become shouts of pursuit and command.\n\nThe eunuchs and their followers have been purged. I stand amid the wreckage of a palace passage, but cannot find anyone who can make sense of what remains. Some beg me to continue the search; others want only to know where the Emperor is. Others still are busy protesting that they never knew anything of this affair.\n\nDong Zhuo's army is still approaching Luoyang. Our enemies within the palace have fallen, but the summons He Jin issued to the army beyond the city will not lose its force merely because he is dead."
 hd_palace_crisis.0005.dong_desc:0 "Yuan Shao and Cao Cao are both dead, and He Jin has been killed by the eunuchs. The urgent dispatches from the capital first begged for aid; now they report soldiers conducting searches on their own authority. Even the men writing to me cannot say who still directs the court.\n\nI order the eunuchs and their followers hunted down. Reports of the purge soon arrive. Yet striking those names from the rolls has done nothing to restore order to the unguarded palace gates or the soldiers who no longer answer to anyone.\n\nI put the dispatches away and ask instead about the road to the capital. The man who summoned me is dead, and no one in the palace can set matters right. Once this army enters the city, whose orders it obeys need no longer follow the original plan."
 hd_palace_crisis.0005.a:0 "The purge is over. The turmoil remains."
 hd_palace_crisis.0007.t:0 "Liangzhou Troops Enter Luoyang"
 hd_palace_crisis.0007.desc:0 "Luoyang's gates stand before me. The guards see our banners and hurry to report them, yet after all their fumbling they cannot even say to whom they should report. Impatient, I urge my horse a step forward.\n\nHe Jin is dead, the eunuchs have been executed, and everyone in the city seems to be waiting for someone else to speak first. How urgently the court sent its summons when it needed my soldiers! Now that they have arrived, there is no one willing to come out and take charge.\n\nI glance back at the ranks behind me and order the vanguard into the city in turn. Someone must guard the palace gates; someone must direct military and civil affairs in Sili. If all the others can do is look at one another, let them see plainly to whom they must answer from now on."
 hd_palace_crisis.0007.a:0 "Enter Luoyang. Take command of Sili."
 hd_palace_crisis.0015.t:0 "Deposing and Enthroning"
 hd_palace_crisis.0015.desc:0 "Since my arrival in the capital, the palace guards and Sili's military and civil administration have increasingly followed my wishes. Yet the dignity of the throne still stands in the way of every command. Whenever the ministers speak of ancestral precedent, their eyes turn, deliberately or otherwise, toward the imperial seat.\n\nI lay my proposal before them: depose Liu Bian and enthrone Liu Xie. It would take only a few lines in an edict. But once those lines are settled, every lingering hesitation and vain hope at court will have to find another guise. Some clutch their court tablets; others bow their heads in silence, waiting for me to take back my words.\n\nI do not. Military power is already in my hands. If I cannot even decide who sits upon that throne, how can I claim to direct the affairs of state?"
 hd_palace_crisis.0015.a:0 "Depose Liu Bian. Enthrone Liu Xie."
 hd_palace_crisis.0016.t:0 "A Bow with Blade in Hand"
 hd_palace_crisis.0016.desc:0 "Dong Zhuo announces his intention to replace the Emperor, and for a moment no one before the hall replies. I look at my colleagues as they avert their eyes. At last, I step forward with my hand on my sword and demand what right he has to depose and enthrone the Son of Heaven at his whim.\n\nOnce spoken, the words cannot be dismissed as an ordinary disagreement. Dong Zhuo's troops are in the city, and my anger cannot become enough armed men to face them. A few around us try to soothe the quarrel. More simply hope that neither of us draws a blade here and now.\n\nWith my blade held across me, I make a formal bow and leave the hall. Only outside do I loosen my clenched hand. To stay would be to stake my life on his momentary hesitation. There is still a future to build in Bohai. Why wager everything to come on this quarrel, with no support at my back?"
 hd_palace_crisis.0016.a:0 "Hang my token of office at the Shangdong Gate and leave for Bohai."
 hd_palace_crisis.0021.t:0 "The Old Bingzhou Troops"
 hd_palace_crisis.0021.desc:0 "Dong Zhuo's soldiers press a few steps closer, and Lu Bu moves forward from my side to meet them. At the sudden hesitation in the ranks opposite us, I give a cold laugh. The Liangzhou troops may swagger through the capital, but there are still men they fear.\n\nWhen Fengxian returns, I tell him to keep an eye on the camp and gather the old Bingzhou troops together. Lately the city has been full of talk of Dong Zhuo's rewards and who visits whom at night. It sets my teeth on edge. The court's affairs are still unresolved, yet men are already busy finding opportunities for themselves.\n\nLu Bu acknowledges the order and says little more. I give him a glance, then place the next command in his hands all the same. With him beside me, Dong Zhuo does not yet get to decide how this dispute ends."
 hd_palace_crisis.0021.a:0 "Fengxian, the camp still needs your care."
 hd_palace_crisis.0022.t:0 "A Blade at My Side"
 hd_palace_crisis.0022.desc:0 "When Lu Bu enters my tent, I assume he brings another military report. I call him Fengxian and bid him come closer. But he does not bow, and his hand never leaves his weapon.\n\n“What is the meaning of this?” Only as the words leave my mouth do I rise. He mentions Dong Zhuo and a new place for himself, in a tone that might be a report on some duty already completed. I turn sharply toward the tent's entrance. The familiar sounds of the camp go on outside, but no one comes in.\n\nYesterday he stood between Dong Zhuo and me. Today his weapon is pointed at me. I reach for my sword, anger choking off the rest of my words. Fengxian! I entrusted the camp to him, and with it, my very life!"
 hd_palace_crisis.0022.a:0 "Fengxian, you would turn your weapon on me?"
 hd_palace_crisis.0023.t:0 "Luoyang Burns, the Court Moves West"
 hd_palace_crisis.0023.desc:0 "The manifesto of the coalition against Dong Zhuo spread throughout the commanderies, and the allied forces have already raised their banners. Advisors urged Dong Zhuo to temporarily avoid the enemy's sharp edge and relocate the capital to Chang'an; enraged beyond measure, Dong Zhuo decided to leave Luoyang behind along with all who opposed him."
 hd_palace_crisis.0023.a:0 "Move the capital to Chang'an and burn Luoyang."


