l_english:
 hd_palace_crisis.0001.t:0 "Shadows of the Palace"
 hd_liu_hong_timeline_protection:0 "The condition has temporarily stabilized."
 hd_liu_hong_timeline_protection_desc:0 "The Emperor's condition has temporarily stabilized, yet the court continues to maintain a facade of order."
 hd_palace_crisis.0001.desc:0 "Within the gates of the Luoyang Palace, the struggle between the Ten Attendants and General He Jin has reached a point of no return. Each side seeks an opportunity to destroy the other, leaving every official in the court trembling with fear. Every hushed whisper you hear could be the prelude to the next outbreak of bloodshed."
 hd_palace_crisis.0001.a:0 "First, see who will draw their sword first."
 hd_palace_crisis.0002.t:0 "Last Resort"
 hd_palace_crisis.0002.desc:0 "Yuan Shao invited He Jin to a side hall and proposed a dangerous plan: since it was impossible to act within the palace, why not summon troops from Liangzhou to intimidate the Ten Attendants with foreign forces? This move might eliminate the eunuchs, or it could ignite blades that burn from the palace gates all the way across the realm."
 hd_palace_crisis.0002.a:0 "Send this letter to Liangzhou."
 hd_palace_crisis.0003.t:0 "Enter the capital?"
 hd_palace_crisis.0003.desc:0 "The imperial edict has reached the army in Liangzhou. Your military advisor whispers that the summons from Luoyang is likely the court's last desperate gamble: entering the capital could change the fate of the realm, but it also means handing your army over to a high-stakes palace wager."
 hd_palace_crisis.0003.a:0 "Enter the capital."
 hd_palace_crisis.0004.t:0 "The palace gates are closed."
 hd_palace_crisis.0004.desc:0 "Upon learning that external forces were approaching, the Ten Attendants launched a preemptive assassination. He Jin fell into a trap within the palace gate; doors closed one after another around him. He finally realized he had no chance to survive and escape this imperial city."
 hd_palace_crisis.0004.a:0 "The tide has turned..."
 hd_palace_crisis.0005.t:0 "Bloodstained Palace Gates"
 hd_palace_crisis.0005.desc:0 "News of He Jin's assassination spread, and you led troops to storm the palace. The forbidden gates were breached, torchlight illuminating the ten eunuchs fleeing in panic; this court struggle ended at last in bloodshed."
 hd_palace_crisis.0005.cao_desc:0 "Yuan Shao has already perished, and He Jin was slain by the eunuchs. You lead your troops to charge into the palace gates, purging the Ten Attendants and their accomplices. The blood and fire within the palace have not yet subsided, while Dong Zhuo's forces from Liangzhou are drawing near Luoyang."
 hd_palace_crisis.0005.dong_desc:0 "Yuan Shao and Cao Cao have both perished, while He Jin was slain by eunuchs. Soldiers within the palace are rounding up the Ten Attendants; you issue orders to pursue their accomplices. The Han court is powerless to restore order, as troops from Liangzhou are advancing toward Luoyang."
 hd_palace_crisis.0005.a:0 "Let none of them escape."
 hd_palace_crisis.0007.t:0 "Liangzhou troops enter Luoyang"
 hd_palace_crisis.0007.desc:0 "The military forces of Liangzhou have finally arrived in Luoyang. Order within and outside the palace gates has collapsed. Dong Zhuo now holds the seal of the Siming Commandery, and with this army, he will decide the fate of the Han Dynasty."
 hd_palace_crisis.0007.a:0 "Take control of the Commandery of Si Li and advance to Luoyang."
 hd_palace_crisis.0015.t:0 "Deposition and Establishment"
 hd_palace_crisis.0015.desc:0 "The regent has already seized control of the palace gates, military forces, and the Si Li commandery. The emperor's title remains just one imperial edict away from reality; court officials are furious, and you must decide whether to tear this document in half and install another member of the Liu clan as ruler. Following such a deposition or enthronement, several unannounced bloodbaths will unfold within the palace."
 hd_palace_crisis.0015.a:0 "Change the emperor."
 hd_palace_crisis.0016.t:0 "Open Confrontation"
 hd_palace_crisis.0016.desc:0 "Yuan Shao publicly challenged your decision to depose and replace the emperor before the palace. His voice shook the ministers, yet he lacked sufficient troops stationed within the city. After a tense standoff, he was forced to depart Luoyang and seek new ambitions in Bohai."
 hd_palace_crisis.0016.a:0 "Let him go."
 hd_palace_crisis.0021.t:0 "Former troops of Bingzhou"
 hd_palace_crisis.0021.desc:0 "Ding Yuan led his former troops from Bingzhou to pay a visit. Lu Bu's imposing presence caused Dong Zhuo to temporarily hold back, but only Lu Bu's silence revealed another layer of danger: this conflict would not end with Ding Yuan's loyalty."
 hd_palace_crisis.0021.a:0 "Listen to how Lu Bu chooses his path."
 hd_palace_crisis.0022.t:0 "Bribe Lu Bu"
 hd_palace_crisis.0022.desc:0 "Dong Zhuo tempted Lu Bu with heavy rewards and a promising future. Ding Yuan had not yet noticed the glint of steel behind him, but Lu Bu had already accepted this bargain; from that moment on, he would serve his new lord as an adopted son."
 hd_palace_crisis.0022.a:0 "Bring Ding Yuan's former subordinates under your command."
 hd_palace_crisis.0023.t:0 "Wrath of the Capital Relocation"
 hd_palace_crisis.0023.desc:0 "The manifesto of the coalition against Dong Zhuo spread throughout the commanderies, and the allied forces have already raised their banners. Advisors urged Dong Zhuo to temporarily avoid the enemy's sharp edge and relocate the capital to Chang'an; enraged beyond measure, Dong Zhuo decided to leave Luoyang behind along with all who opposed him."
 hd_palace_crisis.0023.a:0 "Move the capital to Chang'an and burn Luoyang."


