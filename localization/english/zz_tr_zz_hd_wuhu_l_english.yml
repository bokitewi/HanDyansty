l_english:
 rule_hd_wuhu_rule:0 "Submission of the Five Barbarians"
 setting_hd_wuhu_rule_historical:0 "#high Historical#!"
 setting_hd_wuhu_rule_historical_desc:0 "The Southern Xiongnu, Wudu Di and Wuhuan come seeking land in their historical years; in the chaos after 280, the settled Hu will rise up and declare independence, and Liu Yuan, Shi Le and others will rise around their historical dates. From 439 on, frontier refuge, generic land petitions, the foreign resettlement decision and gradual Hu assimilation no longer occur."
 setting_hd_wuhu_rule_random:0 "#high Random#!"
 setting_hd_wuhu_rule_random_desc:0 "Ignores year windows; events may occur whenever conditions are met. The 439 cutoff still applies."
 setting_hd_wuhu_rule_player_only:0 "#high Players Only#!"
 setting_hd_wuhu_rule_player_only_desc:0 "The AI will not seek land, rise up or push for independence on its own; frontier refuge and gradual Hu assimilation occur as normal, and players may still use the related decisions."
 setting_hd_wuhu_rule_off:0 "#high Off#!"
 setting_hd_wuhu_rule_off_desc:0 "Disables the Submission of the Five Barbarians."
 hd_wuhu_land_seized_opinion:0 "Seized Fief to Settle the Hu"
 hd_wuhu.2000.t:0 "Frontier Hu Seek Submission"
 hd_wuhu.2000.desc:0 "The Hu tribes around [hd_wuhu_nomads_county.GetNameNoTier] have been grazing across the border, quarreling bitterly with the local people over pasture and water.\n\nToday their chieftain [turkic_leader.GetName] has come to see you in person. [turkic_leader.GetSheHe|U] says the tribe can no longer survive beyond the frontier and asks only for a place to settle within your lands; in return, [turkic_leader.GetHerHis] riders will fight for you."
 hd_wuhu.2000.a:0 "Take them in and put them to use."
 hd_wuhu.2000.b:0 "The Hu are fickle. Send them back beyond the frontier."
 hd_wuhu.2001_opening:0 "To my lord, with respect"
 hd_wuhu.2001_letter:0 "I send you two orphans. Their parents have starved to death, because the herds of the [turkic_leader.GetCulture.GetName] trampled their family's crops and orchards. Since my lord treats the Hu so generously, surely you will also bear responsibility for those the Hu have ruined."
 hd_wuhu.2001.a:0 "What insolence..."
 hd_wuhu.2002_opening:0 "To my lord, with respect"
 hd_wuhu.2002_letter:0 "In the matter of the Hu, I overstepped, and I regret it to this day. I hear they have left [nomads_county.GetNameNoTier] and the quarrels with the people have gradually subsided. I still believe my lord should be wary of the Hu, and humbly present several gold cakes brought by Hu merchants of the Western Regions as a token of my respect."
 hd_wuhu.2002.a:0 "The gift is received; the past is wiped clean."
 hd_wuhu.2002.b:0 "I return it to you. Mind yourself."
 hd_wuhu.2003.t:0 "Taxing the Hu Tribe"
 hd_wuhu.2003_beginning:0 "It seems your [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('greedy_chaplain'))] [greedy_chaplain.GetFirstName] has had an eye on [turkic_leader.GetName] and [turkic_leader.GetHerHis] people for some time.\n\n'[ROOT.Char.Custom('FormOfAddressForLiege')],' says [greedy_chaplain.GetFirstNameNoTooltip], 'those Hu live on our land and eat our grass, yet pay no taxes as registered households."
 hd_wuhu.2003_jizya:0 "In my view, they should pay an additional head tax.'\n\n"
 hd_wuhu.2003_not_jizya:0 "In my view, they should pay an extra levy for each tent. You have been generous enough to them.'\n\n"
 hd_wuhu.2003_ending:0 "'This is unjust!' [turkic_leader.GetFirstNameNoTooltip] protests. 'I lead my mounted archers in your service myself. If only you do not tax us this way, I shall remember your kindness.'"
 hd_wuhu.2003.a:0 "Every coin your tribe hides shall be found!"
 hd_wuhu.2003.b:0 "[greedy_chaplain.GetFirstNameNoTooltip] is right; you shall pay taxes."
 hd_wuhu.2003.c:0 "Enough. [turkic_leader.GetFirstNameNoTooltip] has a point too."
 hd_wuhu.2004.t:0 "Orphans of the Hu Riders"
 hd_wuhu.2004.desc:0 "[orphan_girl.GetName] stands before you, a truly pitiful sight; her younger brother [orphan_boy.GetName] is the same, covered in wounds.\n\n'Please, [ROOT.Char.GetTitleTierName],' she says, her voice trembling, 'we haven't eaten in days. Could you give me some food? Even if it's spoiled...'\n\nPressed further, she cannot really say who is to blame. 'Men on horses trampled our crops and took our sheep... and then they were gone. I don't know what we'll do now, and I'm sorry [upset_vassal.GetTitledFirstName] troubled you with such a small matter.'"
 hd_wuhu.2004.a:0 "Don't be afraid. Stay with me."
 hd_wuhu.2004.b:0 "It is only fair that [turkic_leader.GetFirstNamePossessiveNoTooltip] tribe adopt you."
 hd_wuhu.2004.c:0 "Send them to a temple, under the care of those beyond the world."
 hd_wuhu.2004.d:0 "What does [upset_vassal.GetFirstNameNoTooltip] mean by this? Find somewhere else to go."
 hd_wuhu.2005.t:0 "Hu Riders Join the War"
 hd_wuhu.2005.desc:0 "As you fret over the war, [turkic_leader.GetName] arrives with a band of riders.\n\n'[ROOT.Char.GetTitleTierName],' [turkic_leader.GetSheHe] says with a bow, 'I promised to support you, and so did my tribe. Since you are at war, we will lend you another band of skilled mounted archers, for this war only. When the fighting is over, they must return to their tents and families. We ask only that you remember this favor.'"
 hd_wuhu.2005.a:0 "Very well, I will remember this favor."
 hd_wuhu.2005.b:0 "Speak no more of favors!"
 hd_wuhu.2005.c:0 "I appreciate the thought, but I can handle this war myself."
 hd_wuhu.2006.t:0 "A Stray Arrow"
 hd_wuhu.2006_beginning:0 "[one_eyed_child.GetName] was running about the [ROOT.Char.Custom('ResidenceBuilding')] as usual when disaster struck. [turkic_leader.GetName] was drilling [turkic_leader.GetHerHis] warriors at archery, and a stray arrow struck your mischievous [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('one_eyed_child'))] in the eye."
 hd_wuhu.2006_has_court_physician:0 "'[one_eyed_child.GetSheHe|U] will live,' says the physician [scoped_physician.GetFirstName], 'but sadly the eye cannot be saved. If I may speak plainly, there had best be less archery in the courtyard from now on.'\n\n"
 hd_wuhu.2006_no_court_physician:0 "The local healer hastily summoned says [one_eyed_child.GetSheHe] will recover, but that eye will never see again.\n\n"
 hd_wuhu.2006_ending:0 "'It was an accident,' [turkic_leader.GetFirstName] pleads. 'Please do not rush to punish me, [ROOT.Char.Custom('FormOfAddressForLiege')]. If we do not drill, how are we to defend this land for you?'"
 hd_wuhu.2006.a:0 "To the dungeon; let them reflect on their archery there."
 hd_wuhu.2006.b:0 "From now on, archery is forbidden near the [ROOT.Char.Custom('ResidenceBuilding')]."
 hd_wuhu.2006.c:0 "It was Heaven's will, no one's fault."
 hd_wuhu.2007.t:0 "Trade Route Raided"
 hd_wuhu.2007.desc:0 "'[ROOT.Char.GetTitleTierName],' says your [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('warmonger_councillor'))] [warmonger_councillor.GetFirstName], 'the merchants of [bandits_county.GetName] report being robbed by horse bandits. Caravans now go around that area and trade has ground to a halt. Let me look into the matter.'\n\n'No need,' [turkic_leader.GetName] cuts in, 'I can send my warriors to guard the trade route permanently, so long as we may graze our herds in [bandits_county.GetNameNoTierNoTooltip] from now on. Isn't that a better way?'\n\n[warmonger_councillor.GetFirstNameNoTooltip] objects: 'Careful, [ROOT.Char.Custom('FormOfAddressForLiege')]. Nothing angers the common folk more than letting the Hu roam wherever they please.'"
 hd_wuhu.2007.a:0 "[turkic_leader.GetFirstNamePossessiveNoTooltip] plan is better."
 hd_wuhu.2007.b:0 "I leave this matter to you."
 hd_wuhu.2007.c:0 "Give it time, and the merchants will return."
 hd_wuhu.2099.t:0 "[turkic_leader.GetFirstNamePossessiveNoTooltip] Request for Land"
 hd_wuhu.2099.desc:0 "[turkic_leader.GetName] and [turkic_leader.GetHerHis] people have served you for many years. Today [turkic_leader.GetSheHe] comes before you in all solemnity.\n\n'[ROOT.Char.Custom('FormOfAddressForLiege')], our people have borne children and buried elders in your lands, and long ago came to call this place home. Yet we still live under another's roof. I beg you to grant us a piece of land so that my people may truly settle.'\n\nThis time, [turkic_leader.GetSheHe] clearly will not leave empty-handed."
 hd_wuhu.2099.a:0 "I grant you [hd_wuhu_grant_county_1.GetNameNoTier]."
 hd_wuhu.2099.b:0 "How about [hd_wuhu_grant_county_2.GetNameNoTier]?"
 hd_wuhu.2099.c:0 "Only [hd_wuhu_grant_county_3.GetNameNoTier] can be given."
 hd_wuhu.2099.d:0 "This cannot be done."
 hd_wuhu.2099.d.tt:0 "#EMP [turkic_leader.GetFirstNameNoTooltip] may storm off, or raise the tribe in revolt.#!"
 hd_wuhu.3001.t:0 "Hu Tribe Seeks Submission"
 hd_wuhu.3001.desc:0 "A [hd_wuhu_chief.GetCulture.GetNameNoTooltip] tribe from beyond the frontier has come to your border, and its chieftain [hd_wuhu_chief.GetName] sends word asking to see you. They wish to settle in [hd_wuhu_petition_target.GetNameNoTier], "
 hd_wuhu.3001.desc_vassal:0 "becoming your vassals and fighting for you in war, in exchange for a place to live under your rule.\n\nClearly they have nowhere else to go. But precisely because they have no other path, conflict is all but certain if you refuse."
 hd_wuhu.3001.desc_independent:0 "acknowledging you as their lord and serving you, in exchange for a piece of land under your rule.\n\nThey may well have nowhere else to go, but looking at those fierce horsemen, this is less a request than an ultimatum."
 hd_wuhu.3001.a:0 "Heed my commands, and [hd_wuhu_petition_target.GetNameNoTierNoTooltip] is yours."
 hd_wuhu.3001.b:0 "Never! Not an inch of land to the barbarians!"
 HD_WUHU_PETITION_CB_NAME:0 "Hu Land Petition"
 HD_WUHU_PETITION_WAR_NAME:0 "[ATTACKER.GetCulture.GetNameNoTooltip] Tribe's Claim on [TITLE.GetNameNoTier]"
 hd_wuhu_petition_cb_victory_desc:0 "The Hu tribe seizes the contested [titles|E] by force."
 hd_wuhu_petition_cb_victory_desc_attacker:0 "You seize the contested [titles|E] by force."
 hd_wuhu_petition_cb_defeat_desc:0 "The Hu tribe is routed and forced to leave your lands."
 hd_wuhu_petition_cb_defeat_desc_attacker:0 "You are forced to seek a home elsewhere."
 hd_wuhu_petition_cb_white_peace_desc:0 "In recognition of their valor, the Hu tribe is granted land and becomes your vassal."
 hd_wuhu_petition_cb_white_peace_desc_attacker:0 "You obtain land to settle and become a vassal of the defender."
 hd_wuhu_frontier_army_name:0 "Submitted Hu Cavalry"
 hd_wuhu_frontier_revolt_army_name:0 "Rebel Hu"
 hd_wuhu_petition_army_name:0 "Settled Hu Tribe"
 hd_wuhu_chanyu_decision:0 "Rise in Arms and Stand Alone"
 hd_wuhu_chanyu_decision_desc:0 "The realm is in chaos; the princes of the Jin house wage war on one another and the court can no longer look after the frontier. My people have lived scattered within the passes for generations, driven and abused all the while. Now is the time to rally the tribes and found a house of our own."
 hd_wuhu_chanyu_decision_tooltip:0 "Rally the tribes to arms and found your own state"
 hd_wuhu_chanyu_decision_confirm:0 "To arms!"
 hd_wuhu_chanyu_decision_year_ok:0 "The year for rising has come"
 hd_wuhu_chanyu_decision_phase_ok:0 "The dynastic cycle is in the Turmoil, New Dynasty Conquest, Struggle, Stalemate or Collapse phase"
 hd_wuhu_chanyu_decision_effect_tt:0 "You will rally the tribes and march against the lord who holds the most cities in this province, and Hu horsemen from all around will flock to you. If victorious, you will take the province and proclaim a dynastic name."
 HD_WUHU_CHANYU_CB_NAME:0 "Rise in Arms and Stand Alone"
 HD_WUHU_CHANYU_WAR_NAME:0 "[ATTACKER.GetFirstNameNoTooltip]'s Rising in [TITLE.GetBaseName]"
 hd_wuhu_chanyu_war_victory_desc_attacker:0 "You will seize all of [defender.GetShortUINamePossessive] titles within the de jure bounds of the target kingdom, and take the kingdom."
 hd_wuhu_chanyu_war_victory_desc:0 "Seize all of [defender.GetShortUINamePossessive] titles within the de jure bounds of the target kingdom, and take the kingdom."
 hd_wuhu_chanyu_war_victory_crown_tt:0 "The attacker gains or creates the target kingdom and proclaims a dynastic name"
 hd_wuhu_chanyu_conquer_army_name:0 "Risen Hu Cavalry"
 hd_wuhu_chanyu_hold_army_name:0 "Tribal Guard"
 hd_wuhu_petition_cb:0 "$HD_WUHU_PETITION_CB_NAME$"
 HD_WUHU_CHANYU_WAR_NAME_BASE:0 ""
 hd_wuhu_chanyu_cb:0 "$HD_WUHU_CHANYU_CB_NAME$"
