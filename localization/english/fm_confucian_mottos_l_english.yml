 motto_fm_confucian_1222:0 "Near shame and disgrace, the forested marsh offers a fortunate refuge."
 motto_fm_confucian_1223:0 "Two Shus saw the situation and resigned from office; who forced them?"
 motto_fm_confucian_1224:0 "Living alone in seclusion, silent and desolate"
 motto_fm_confucian_1225:0 "Seeking the ancients, pondering theories, letting go of worries, and roaming freely."
 motto_fm_confucian_1226:0 "Joy comes and burdens depart; sorrow withdraws and happiness arrives."
 motto_fm_confucian_1227:0 "The lotus in the canal stands tall; the garden's wild grass sends up new shoots."
 motto_fm_confucian_1228:0 "Loquat stays green late; wutong sheds its leaves early."
 motto_fm_confucian_1229:0 "Old roots wither; fallen leaves drift and sway."
 motto_fm_confucian_1230:0 "The lone flying roc soars alone above the crimson heavens."
 motto_fm_confucian_1231:0 "Indulging in reading, playing in the market, gazing at bags and boxes."
 motto_fm_confucian_1232:0 "Beware of careless words; ears may be pressed against the walls."
 motto_fm_confucian_1233:0 "Provide meals that are palatable and fill the belly."
 motto_fm_confucian_1234:0 "Feast to fullness on cooked meats; when hungry, be content with lees and bran."
 motto_fm_confucian_1235:0 "Relatives, old friends, young and old receive different rations."
 motto_fm_confucian_1236:0 "The women spin and weave, serving with towels in the inner chambers."
 motto_fm_confucian_1237:0 "Round fans of silk are pure and clean; silver candles burn brightly."
 motto_fm_confucian_1238:0 "Sleeping by day and dreaming at night on blue bamboo mats and ivory beds"
 motto_fm_confucian_1239:0 "Strings of music and songs accompany wine banquets; cups are raised and goblets lifted."
 motto_fm_confucian_1240:0 "Clap hands and stomp feet in joy and contentment."
 motto_fm_confucian_1241:0 "Legitimate heir to continue the ancestral sacrifices during winter and autumn offerings."
 motto_fm_confucian_1242:0 "Kneeling with bowed head, I bow twice in trembling fear and awe."
 motto_fm_confucian_1243:0 "Keep documents concise, and make replies carefully and in detail."
 motto_fm_confucian_1244:0 "When your body is dirty, you wish to bathe; when holding something hot, you wish for coolness."
 motto_fm_confucian_1245:0 "Donkeys, mules, calves, and oxen startle, leap, and gallop."
 motto_fm_confucian_1246:0 "Execute bandits and thieves; capture rebels and defectors."
 motto_fm_confucian_1247:0 "Bu's archery, Liao's marbles, Ji's zither, and Ruan's whistle"
 motto_fm_confucian_1248:0 "Tian's brush, Lun's paper, Jun's craftsmanship, Ren's fishing hook."
 motto_fm_confucian_1249:0 "Resolving disputes and benefiting the people are both excellent and wonderful."
 motto_fm_confucian_1250:0 "Mao and Shi were graceful beauties, lovely in frowns and smiles."
 motto_fm_confucian_1251:0 "The year's arrow hastens; the morning sun shines brightly."
 motto_fm_confucian_1252:0 "The celestial mechanism turns; the moon's changing light circles on."
 motto_fm_confucian_1253:0 "Tending the firewood to cultivate blessings, ensuring eternal peace and prosperity."
 motto_fm_confucian_1254:0 "Walk with measured steps and lift your gaze, bowing and looking up in the court halls."
 motto_fm_confucian_1255:0 "Girding his belt with dignity, he paced back and forth, gazing out at the horizon."
 motto_fm_confucian_1256:0 "My ignorance and lack of knowledge invite such reproaches."
 motto_fm_confucian_1257:0 "As for grammatical particles, there are yan, zai, hu, and ye"
 motto_fm_confucian_1258:0 "To judge the present, look to the past."
 motto_fm_confucian_1259:0 "No past, no present."
 motto_fm_confucian_1260:0 "Know yourself and know your enemy; compare hearts with hearts."
 motto_fm_confucian_1261:0 "Drink with a kindred spirit when wine is found"
 motto_fm_confucian_1262:0 "Recite poetry to those who understand it."
 motto_fm_confucian_1263:0 "Acquaintances fill the world."
 motto_fm_confucian_1264:0 "How many hearts can truly understand?"
 motto_fm_confucian_1265:0 "Meeting again feels like meeting for the first time."
 motto_fm_confucian_1266:0 "To the end, no resentment remains in my heart."
 motto_fm_confucian_1267:0 "Those who live near water know the nature of fish."
 motto_fm_confucian_1268:0 "Know the bird's song by the nearby mountains"
 motto_fm_confucian_1269:0 "Easy to rise and easy to recede, the mountain stream water."
 motto_fm_confucian_1270:0 "Easily reversed and overturned are the hearts of petty men."
 motto_fm_confucian_1271:0 "When fortune turns, gold becomes iron."
 motto_fm_confucian_1272:0 "When times are favorable, iron is worth gold."
 motto_fm_confucian_1273:0 "Reading requires intention."
 motto_fm_confucian_1274:0 "A single character is worth a thousand gold."
 motto_fm_confucian_1275:0 "When you meet someone, speak only part of what is in your heart."
 motto_fm_confucian_1276:0 "Cannot fully give one's heart"
 motto_fm_confucian_1277:0 "When one tries to plant a flower, it may not bloom."
 motto_fm_confucian_1278:0 "A willow planted without intent grows into a shade."
 motto_fm_confucian_1279:0 "Drawing a tiger's skin is easy; drawing its bone is hard."
 motto_fm_confucian_1280:0 "Know the person, know the face, but not the heart."
 motto_fm_confucian_1281:0 "Money is as worthless as excrement."
 motto_fm_confucian_1282:0 "Benevolence and righteousness are worth a thousand gold."
 motto_fm_confucian_1283:0 "The flowing water rushes down the rapids without intent."
 motto_fm_confucian_1284:0 "White clouds emerge from the peaks without intent."
 motto_fm_confucian_1285:0 "If one had not climbed high to gaze at the scene back then"
 motto_fm_confucian_1286:0 "Who believes the eastward-flowing ocean is deep?"
 motto_fm_confucian_1287:0 "The road tests the horse's strength."
 motto_fm_confucian_1288:0 "Time reveals true character."
 motto_fm_confucian_1289:0 "Two people share the same heart."
 motto_fm_confucian_1290:0 "Though penniless, together you can afford gold."
 motto_fm_confucian_1291:0 "One person, one heart."
 motto_fm_confucian_1292:0 "Money can't buy a needle."
 motto_fm_confucian_1293:0 "It is easy to find favor when we meet."
 motto_fm_confucian_1294:0 "Living together for long makes getting along difficult."
 motto_fm_confucian_1295:0 "Horses lack strength solely because they are thin."
 motto_fm_confucian_1296:0 "Men are not romantic only because of poverty."
 motto_fm_confucian_1297:0 "Forgiving others does not make one a fool."
 motto_fm_confucian_1298:0 "A fool does not know how to forgive."
 motto_fm_confucian_1299:0 "Some are kin, yet do not act like kin."
 motto_fm_confucian_1300:0 "Not by blood, yet kin indeed."
 motto_fm_confucian_1301:0 "Fine or not, it is the water of one's hometown."
 motto_fm_confucian_1302:0 "Kin or not, people from home feel close."
 motto_fm_confucian_1303:0 "The orioles and flowers still fear the spring light will fade."
 motto_fm_confucian_1304:0 "How can one let others waste the spring in vain?"
 motto_fm_confucian_1305:0 "Meeting without drinking is to return in vain."
 motto_fm_confucian_1306:0 "The peach blossoms at the cave entrance also seem to laugh at us."
 motto_fm_confucian_1307:0 "Fair maidens should not be allowed to age"
 motto_fm_confucian_1308:0 "Don't let the wandering rogue fall into poverty."
 motto_fm_confucian_1309:0 "At home, one cannot welcome guests properly."
 motto_fm_confucian_1310:0 "Only when traveling do you learn how few welcoming hosts there are."
 motto_fm_confucian_1311:0 "Gold is not counterfeit, but Awei is not genuine."
