 motto_fm_confucian_220:0 "A craftsman must first sharpen his tools before he can do his work well."
 motto_fm_confucian_221:0 "He who has no long-term plan will have immediate worries."
 motto_fm_confucian_222:0 "Hold oneself to strict standards while being lenient in judging others."
 motto_fm_confucian_223:0 "The gentleman seeks within himself; the petty man seeks in others."
 motto_fm_confucian_224:0 "The gentleman is dignified but does not contend."
 motto_fm_confucian_225:0 "United but not factionalized"
 motto_fm_confucian_226:0 "A small lack of patience can disrupt a grand plan."
 motto_fm_confucian_227:0 "All who hate him must be scrutinized."
 motto_fm_confucian_228:0 "All who praise him must be scrutinized."
 motto_fm_confucian_229:0 "To err and not to correct is indeed an error."
 motto_fm_confucian_230:0 "When faced with righteousness, one should not hesitate to take the lead even before a teacher."

 # 孟子
 motto_fm_confucian_231:0 "Born in adversity, perished in ease."
 motto_fm_confucian_232:0 "Wealth cannot corrupt us; poverty cannot change us."
 motto_fm_confucian_233:0 "Cannot be bowed by might"
 motto_fm_confucian_234:0 "He who follows the Way receives many helpers; he who does not finds few."
 motto_fm_confucian_235:0 "Heavenly timing is not as important as advantageous terrain."
 motto_fm_confucian_236:0 "Geographical advantage is not as important as unity among people."
 motto_fm_confucian_237:0 "Heaven is about to entrust a great mission to this person."
 motto_fm_confucian_238:0 "First, he must harden his mind through hardship."
 motto_fm_confucian_239:0 "Exhaust their muscles and bones; starve their bodies and skin."
 motto_fm_confucian_240:0 "Deprive him of his livelihood"
 motto_fm_confucian_241:0 "Administer punishment to disrupt his actions."
 motto_fm_confucian_242:0 "Therefore, stir the heart and temper the character."
 motto_fm_confucian_243:0 "Increase what he was previously unable to do."
 motto_fm_confucian_244:0 "When in a difficult situation, one should cultivate oneself."
 motto_fm_confucian_245:0 "When successful, one should benefit the world."
 motto_fm_confucian_246:0 "Respect the elderly among us, and extend that respect to the elderly of others."
 motto_fm_confucian_247:0 "Care for my own young, and extend that care to the young of others."
 motto_fm_confucian_248:0 "The people are most important; the state comes next; the ruler is least of all."
 motto_fm_confucian_249:0 "Those who delight in the joys of their people will also find joy in the people's happiness."
 motto_fm_confucian_250:0 "Those who worry about the people's troubles will also be worried by the people."
 motto_fm_confucian_251:0 "No shame before heaven above or man below."
 motto_fm_confucian_252:0 "Fish is what I desire; bear's paw is also what I desire."
 motto_fm_confucian_253:0 "One cannot have both."
 motto_fm_confucian_254:0 "One who discards fish to take bear's paw."
 motto_fm_confucian_255:0 "Life is also what I desire."
 motto_fm_confucian_256:0 "Righteousness is also what I desire."
 motto_fm_confucian_257:0 "One who sacrifices life to uphold righteousness."
 motto_fm_confucian_258:0 "The path to learning is nothing else but..."
 motto_fm_confucian_259:0 "Seek only to restore one's peace of mind."
 motto_fm_confucian_260:0 "He who exhausts his heart knows his nature."
 motto_fm_confucian_261:0 "Knowing its nature is to know Heaven."
 motto_fm_confucian_262:0 "Preserve their hearts and nurture their natures."
 motto_fm_confucian_263:0 "Thus it is to serve Heaven."
 motto_fm_confucian_264:0 "In poverty, one does not lose righteousness; in success, one does not abandon the Way."
 motto_fm_confucian_265:0 "The gentleman has three joys."
 motto_fm_confucian_266:0 "Both parents are alive, and there is no trouble with the brothers."
 motto_fm_confucian_267:0 "No guilt before heaven"
 motto_fm_confucian_268:0 "Do not feel ashamed before others."
 motto_fm_confucian_269:0 "To educate the talented from across the land"
 motto_fm_confucian_270:0 "The trouble with people is that they like to act as teachers for others."
 motto_fm_confucian_271:0 "Those who possess virtue, wisdom, skill, and insight"
 motto_fm_confucian_272:0 "Endurance lies in adversity."
 motto_fm_confucian_273:0 "Born in adversity"
 motto_fm_confucian_274:0 "He who strives is like one digging a well."
