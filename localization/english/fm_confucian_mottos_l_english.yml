 motto_fm_confucian_294:0 "The mind's function is to think."
 motto_fm_confucian_295:0 "Thought leads to attainment."
 motto_fm_confucian_296:0 "If you do not think, you will not gain anything."
 motto_fm_confucian_297:0 "Heaven is about to bestow a great responsibility"
