 motto_fm_confucian_1334:0 "Regretting that the branches bear no leaves."
 motto_fm_confucian_1335:0 "Do not blame the sun for its bias."
 motto_fm_confucian_1336:0 "Everything is governed by fate."
 motto_fm_confucian_1337:0 "Not even the slightest part is within human control."
 motto_fm_confucian_1338:0 "The planning of a year lies in spring."
 motto_fm_confucian_1339:0 "The day begins at Yin."
 motto_fm_confucian_1340:0 "The prosperity of a household depends on harmony."
 motto_fm_confucian_1341:0 "A lifetime's plan lies in diligence."
 motto_fm_confucian_1342:0 "Judge yourself with the same severity you judge others."
 motto_fm_confucian_1343:0 "Forgive others with the same heart you forgive yourself."
 motto_fm_confucian_1344:0 "Keep your mouth shut like a bottle; guard your mind like a fortress."
 motto_fm_confucian_1345:0 "Better that others betray me than I betray them."
 motto_fm_confucian_1346:0 "Never let me betray others."
 motto_fm_confucian_1347:0 "Think carefully, again and again."
 motto_fm_confucian_1348:0 "First, do not deceive your heart."
 motto_fm_confucian_1349:0 "Even an unfamiliar tiger may be approached."
 motto_fm_confucian_1350:0 "Too familiar to be trusted"
 motto_fm_confucian_1351:0 "Those who bring you gossip—"
 motto_fm_confucian_1352:0 "Are themselves troublemakers."
 motto_fm_confucian_1353:0 "Distant water cannot put out a nearby fire."
 motto_fm_confucian_1354:0 "A distant relative is not as good as a near neighbor."
 motto_fm_confucian_1355:0 "With tea and wine, many brothers gather together."
 motto_fm_confucian_1356:0 "In times of urgent distress, who has ever seen a single person?"
 motto_fm_confucian_1357:0 "Human feelings are as thin as sheets of paper."
 motto_fm_confucian_1358:0 "Worldly affairs are like chess: every game is new."
 motto_fm_confucian_1359:0 "There are also thousand-year trees in the mountains."
 motto_fm_confucian_1360:0 "It is rare to find a person who lives to be one hundred years old in this world."
 motto_fm_confucian_1361:0 "When strength wanes, do not bear heavy burdens."
 motto_fm_confucian_1362:0 "Light words should not persuade others."
 motto_fm_confucian_1363:0 "No money, no entry to the crowd."
 motto_fm_confucian_1364:0 "Seek no kin in times of calamity"
 motto_fm_confucian_1365:0 "Never do anything that will weigh on your conscience."
 motto_fm_confucian_1366:0 "Then no one should gnash their teeth in hatred of you."
 motto_fm_confucian_1367:0 "Scholars are the treasure of the state."
 motto_fm_confucian_1368:0 "The Confucian is a treasure at the table."
 motto_fm_confucian_1369:0 "If you wish to stop drinking alcohol"
 motto_fm_confucian_1370:0 "Sober eyes watch the drunkard"
 motto_fm_confucian_1371:0 "Seek help from a man of integrity"
 motto_fm_confucian_1372:0 "Help others when they are in dire need."
 motto_fm_confucian_1373:0 "A single drop when thirsty is like sweet nectar."
 motto_fm_confucian_1374:0 "Another cup after you are drunk is worse than none."
 motto_fm_confucian_1375:0 "Long residence breeds contempt."
 motto_fm_confucian_1376:0 "Frequent visits make even close relations distant."
 motto_fm_confucian_1377:0 "A true gentleman remains silent in the wine."
 motto_fm_confucian_1378:0 "A true man is clear about money."
 motto_fm_confucian_1379:0 "Keep the resolve you had when first entering monastic life, and Buddhahood is within reach."
 motto_fm_confucian_1380:0 "Accumulating a thousand taels of gold is not as valuable as clearly understanding the classics."
 motto_fm_confucian_1381:0 "Raising a son without teaching him is like raising a donkey."
 motto_fm_confucian_1382:0 "Raising a daughter without teaching her is like raising pigs."
 motto_fm_confucian_1383:0 "If fields are left unplanted, the granaries will be empty."
 motto_fm_confucian_1384:0 "With books unread, descendants remain foolish."
 motto_fm_confucian_1385:0 "When the granaries are empty, the years bring want."
 motto_fm_confucian_1386:0 "Descendants are foolish; rites and righteousness are lax."
 motto_fm_confucian_1387:0 "A conversation with you"
 motto_fm_confucian_1388:0 "It is worth more than ten years of reading."
 motto_fm_confucian_1389:0 "One who fails to understand the past and present"
 motto_fm_confucian_1390:0 "Is like a horse or ox dressed in human clothes."
 motto_fm_confucian_1391:0 "Across the vast four seas lie countless people."
 motto_fm_confucian_1392:0 "Which man is a true hero?"
 motto_fm_confucian_1393:0 "White liquor brewed for the sake of hospitality"
 motto_fm_confucian_1394:0 "Gold spent to gather books"
 motto_fm_confucian_1395:0 "Saving a life is better than building a seven-story pagoda."
 motto_fm_confucian_1396:0 "A fire at the city gate brings disaster to the fish in the moat."
 motto_fm_confucian_1397:0 "Auspicious grass grows before the courtyard"
 motto_fm_confucian_1398:0 "Better to have nothing than something good."
 motto_fm_confucian_1399:0 "To seek wealth and honor"
 motto_fm_confucian_1400:0 "Must put in relentless effort"
 motto_fm_confucian_1401:0 "A century's worth of effort is not enough to achieve it."
 motto_fm_confucian_1402:0 "Yet a single day is more than enough to ruin it."
 motto_fm_confucian_1403:0 "Human hearts are like iron; official laws are like a furnace."
 motto_fm_confucian_1404:0 "Good influence falls short; harmful influence abounds."
 motto_fm_confucian_1405:0 "When water is too clear, there are no fish."
 motto_fm_confucian_1406:0 "Too much scrutiny leaves no followers."
 motto_fm_confucian_1407:0 "With understanding, it is halved; with reflection, it vanishes."
 motto_fm_confucian_1408:0 "At home, one follows the father; upon marriage, one follows the husband."
 motto_fm_confucian_1409:0 "A foolish man fears his wife; a worthy woman respects her husband."
 motto_fm_confucian_1410:0 "Gossip goes on all day; ignore it, and it fades away."
 motto_fm_confucian_1411:0 "Better to be upright even if it means falling short"
 motto_fm_confucian_1412:0 "Never gain abundance through wrongdoing."
 motto_fm_confucian_1413:0 "Better to believe it's true"
 motto_fm_confucian_1414:0 "Rather than assume it does not exist."
 motto_fm_confucian_1415:0 "Bamboo fences and thatched cottages present a charming scene."
 motto_fm_confucian_1416:0 "Neither Daoist cloisters nor Buddhist halls can compare."
 motto_fm_confucian_1417:0 "What is destined to be yours will eventually come to you."
 motto_fm_confucian_1418:0 "Do not force what fate has not allotted you."
 motto_fm_confucian_1419:0 "The Daoist Court Welcomes Immortal Guests"
 motto_fm_confucian_1420:0 "The Scholar Secluded in the Hall of Learning"
 motto_fm_confucian_1421:0 "Courtyard planted with phoenix-nesting bamboo"
 motto_fm_confucian_1422:0 "Raise fish in the pond that may transform into dragons."
 motto_fm_confucian_1423:0 "Seek friends who surpass yourself."
 motto_fm_confucian_1424:0 "Friends no better than me are no better than none."
 motto_fm_confucian_1425:0 "But just wait a few days"
 motto_fm_confucian_1426:0 "The later meeting is not like the first."
 motto_fm_confucian_1427:0 "Human feelings are like water, flowing at different levels."
 motto_fm_confucian_1428:0 "The world's affairs are like clouds, free to curl or spread at will."
 motto_fm_confucian_1429:0 "If you speak well, speak in public."
 motto_fm_confucian_1430:0 "If you cannot speak well, speak only at home."
 motto_fm_confucian_1431:0 "Grinding the blade with regret that it is not sharp enough"
 motto_fm_confucian_1432:0 "Sharp blades wound the fingers."
 motto_fm_confucian_1433:0 "Desperate to make a fortune"
 motto_fm_confucian_1434:0 "Wealth brings harm to oneself."
 motto_fm_confucian_1435:0 "Contentment brings lasting honor throughout one's life."
 motto_fm_confucian_1436:0 "Know when to stop; always know when to stop—never ashamed throughout your life."
 motto_fm_confucian_1437:0 "Fortune brings harm to wealth; misfortune harms only oneself."
 motto_fm_confucian_1438:0 "A slight deviation at the beginning leads to a great error at the end."
 motto_fm_confucian_1439:0 "To climb high, begin from low ground."
 motto_fm_confucian_1440:0 "If venturing far, begin from the near."
 motto_fm_confucian_1441:0 "Think thrice before acting; a second thought is advisable."
 motto_fm_confucian_1442:0 "It's better to walk yourself than to rely on others."
 motto_fm_confucian_1443:0 "Better to seek help from oneself than from others."
 motto_fm_confucian_1444:0 "They were brothers when they were young."
 motto_fm_confucian_1445:0 "Once grown, each lives in a different place."
 motto_fm_confucian_1446:0 "Envy wealth, not food."
 motto_fm_confucian_1447:0 "Resentment arises from the living, not the dead."
 motto_fm_confucian_1448:0 "People see white hair and resent it"
