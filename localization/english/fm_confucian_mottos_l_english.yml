 motto_fm_confucian_1044:0 "Father and son in love, husband and wife in accord"
 motto_fm_confucian_1045:0 "Elder brother friendly, younger brother respectful"
 motto_fm_confucian_1046:0 "Order of age, friends and companions"
 motto_fm_confucian_1047:0 "Lord reverent, minister loyal"
 motto_fm_confucian_1048:0 "These ten duties are common to all"
 motto_fm_confucian_1049:0 "In teaching the young, be exacting"
 motto_fm_confucian_1050:0 "Explain words clearly and mark the sentences"
