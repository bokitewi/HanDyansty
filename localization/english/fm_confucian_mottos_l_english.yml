 motto_fm_confucian_728:0 "Time-honored heroes of the ages"
 motto_fm_confucian_729:0 "Chaos of rocks pierces the sky; thunderous waves crash against the shore."
 motto_fm_confucian_730:0 "Rolling up a thousand piles of snow"
 motto_fm_confucian_731:0 "The land is like a painting; how many heroes lived here then!"
 motto_fm_confucian_732:0 "Life is like a dream; let me pour the wine upon the river moon."
 motto_fm_confucian_733:0 "The rolling Yangtze River flows eastward to the sea."
 motto_fm_confucian_734:0 "The waves have washed away all heroes."
 motto_fm_confucian_735:0 "Right and wrong, success and failure, all turn to nothing in an instant."
 motto_fm_confucian_736:0 "The green mountains remain as they were; how many times has the setting sun turned red?"
 motto_fm_confucian_737:0 "White-haired fishermen and woodcutters on the river islet"
 motto_fm_confucian_738:0 "Accustomed to watching the autumn moon and spring breeze"
 motto_fm_confucian_739:0 "Over a pot of cloudy wine, we rejoice in meeting."
 motto_fm_confucian_740:0 "Countless affairs of past and present become tales told with laughter."
 motto_fm_confucian_741:0 "Boundless leaves fall with a rustling sound."
 motto_fm_confucian_742:0 "The endless Yangtze River rolls on endlessly."
 motto_fm_confucian_743:0 "Ten thousand li of sorrow in autumn, always a guest away from home."
 motto_fm_confucian_744:0 "Ill through my waning years, I climb the terrace alone."
 motto_fm_confucian_745:0 "The setting sun is infinitely beautiful, yet it approaches the twilight."
 motto_fm_confucian_746:0 "As evening approaches, feeling ill at ease, I drive my carriage up the ancient hill."
 motto_fm_confucian_747:0 "The spring silkworm spins its thread until it dies."
 motto_fm_confucian_748:0 "Only when the candle turns to ash do its tears dry."
 motto_fm_confucian_749:0 "Without the colorful phoenix's paired wings to fly together"
 motto_fm_confucian_750:0 "A spark of understanding connects us instantly."
 motto_fm_confucian_751:0 "It is hard to meet, and even harder to part."
 motto_fm_confucian_752:0 "The east wind is weak; a hundred flowers wither."
 motto_fm_confucian_753:0 "When shall we together trim the candle at the west window?"
 motto_fm_confucian_754:0 "Yet we speak of the night rain over Bashan."
 motto_fm_confucian_755:0 "You ask about the return date, but there is no set date yet."
 motto_fm_confucian_756:0 "Night rain in Bashan swells the autumn pool."
 motto_fm_confucian_757:0 "The brocade zither has fifty strings without cause."
 motto_fm_confucian_758:0 "One string, one peg, thoughts drift to the bygone years."
 motto_fm_confucian_759:0 "Zhuang Sheng's morning dream of being lost in a butterfly"
 motto_fm_confucian_760:0 "Emperor Wang entrusts his spring longing to the cuckoo."
 motto_fm_confucian_761:0 "The moon shines over the vast sea, and pearls weep tears."
 motto_fm_confucian_762:0 "Sunlight warms Lantian; mist rises from the jade."
 motto_fm_confucian_763:0 "This feeling can only become a memory to be cherished later."
 motto_fm_confucian_764:0 "It was already lost back then."
 motto_fm_confucian_765:0 "Having once seen the vast ocean, no other waters can compare."
 motto_fm_confucian_766:0 "Beyond the Wushan Mountains, there are no other clouds."
 motto_fm_confucian_767:0 "I lazily turn my gaze away from the flowers in succession."
 motto_fm_confucian_768:0 "Half due to the pursuit of immortality, half due to you."
 motto_fm_confucian_769:0 "The human face is gone; I know not where it has gone."
 motto_fm_confucian_770:0 "The peach blossoms still smile at the spring breeze."
 motto_fm_confucian_771:0 "In this gate on this day last year"
 motto_fm_confucian_772:0 "Human faces and peach blossoms reflect each other in red."
 motto_fm_confucian_773:0 "Stopping the carriage to admire the maple forest at dusk, where the frost-kissed leaves are redder than flowers in February."
