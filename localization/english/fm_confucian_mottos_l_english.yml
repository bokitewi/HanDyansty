 motto_fm_confucian_1071:0 "The Dai elders annotated the Book of Rites"
 motto_fm_confucian_1072:0 "Relating the sages' words, rites and music complete"
 motto_fm_confucian_1073:0 "The Airs, the Odes, and the Hymns"
 motto_fm_confucian_1074:0 "Called the four kinds of song, they should be chanted"
 motto_fm_confucian_1075:0 "When the Odes perished, the Annals were written"
 motto_fm_confucian_1076:0 "Holding praise and blame, telling good from evil"
