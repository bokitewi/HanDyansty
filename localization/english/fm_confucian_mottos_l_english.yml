 motto_fm_confucian_1485:0 "Encountering a perilous road is hard to avoid."
 motto_fm_confucian_1486:0 "By the end of it all, there is no freedom left."
 motto_fm_confucian_1487:0 "Medicine can cure fake illnesses."
 motto_fm_confucian_1488:0 "Wine cannot dispel true sorrow."
 motto_fm_confucian_1489:0 "The poor keep silent; level water does not flow."
 motto_fm_confucian_1490:0 "A family with a daughter is sought by hundreds of households."
 motto_fm_confucian_1491:0 "One horse cannot move; a hundred horses worry."
