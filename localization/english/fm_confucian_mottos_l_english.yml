 motto_fm_confucian_1319:0 "Without money, truth is doubted"
 motto_fm_confucian_1320:0 "If you doubt it, watch the wine at a feast"
 motto_fm_confucian_1321:0 "Every cup is first offered to the rich"
 motto_fm_confucian_1322:0 "Money dwells in the bustle, peace in the quiet"
 motto_fm_confucian_1323:0 "Come like wind and rain, go like drifting dust"
 motto_fm_confucian_1324:0 "The rear waves of the Yangtze push on the front"
 motto_fm_confucian_1325:0 "Newcomers of the world press after the old"
 motto_fm_confucian_1326:0 "The tower by the water first catches the moon"
 motto_fm_confucian_1327:0 "Flowers facing the sun first meet the spring"
 motto_fm_confucian_1328:0 "Do not boast that you set out early"
 motto_fm_confucian_1329:0 "There are those who set out earlier still"
 motto_fm_confucian_1330:0 "Do not trust the straight within the straight"
 motto_fm_confucian_1331:0 "Beware the benevolence that is not benevolent"
 motto_fm_confucian_1332:0 "The mountains have straight trees"
 motto_fm_confucian_1333:0 "But the world has no perfectly straight men"
 motto_fm_confucian_1334:0 "Blame yourself that the branch bears no leaves"
 motto_fm_confucian_1335:0 "Do not resent the sun for leaning away"
 motto_fm_confucian_1336:0 "All is a matter of fate"
 motto_fm_confucian_1337:0 "Not half a step is within one's own power"
 motto_fm_confucian_1338:0 "The year's plan lies in the spring"
 motto_fm_confucian_1339:0 "The day's plan lies in the early morning"
 motto_fm_confucian_1340:0 "The family's plan lies in harmony"
 motto_fm_confucian_1341:0 "A life's plan lies in diligence"
 motto_fm_confucian_1342:0 "Judge yourself with the heart you use to judge others"
 motto_fm_confucian_1343:0 "Forgive others with the heart you use to forgive yourself"
 motto_fm_confucian_1344:0 "Seal your mouth like a vase, guard your mind like a wall"
 motto_fm_confucian_1345:0 "Better that others wrong me"
 motto_fm_confucian_1346:0 "Than that I wrong another"
 motto_fm_confucian_1347:0 "Again and again, be careful of your intent"
 motto_fm_confucian_1348:0 "First of all, do not deceive your own heart"
 motto_fm_confucian_1349:0 "A live tiger may yet be approached"
 motto_fm_confucian_1350:0 "A familiar man is not to be trusted"
 motto_fm_confucian_1351:0 "He who comes to speak of others' wrongs"
 motto_fm_confucian_1352:0 "Is himself the maker of wrongs"
 motto_fm_confucian_1353:0 "Distant water cannot quench a nearby fire"
 motto_fm_confucian_1354:0 "A distant kinsman is not as good as a near neighbor"
 motto_fm_confucian_1355:0 "With tea and wine you have many brothers"
 motto_fm_confucian_1356:0 "But in dire straits not one is to be seen"
 motto_fm_confucian_1357:0 "Human feeling is thin as paper, sheet upon sheet"
 motto_fm_confucian_1358:0 "Worldly affairs are like chess, each round new"
 motto_fm_confucian_1359:0 "The mountains hold trees of a thousand years"
 motto_fm_confucian_1360:0 "The world rarely sees a man of a hundred"
 motto_fm_confucian_1361:0 "If your strength is small, do not bear heavy loads"
 motto_fm_confucian_1362:0 "If your words are light, do not try to counsel"
 motto_fm_confucian_1363:0 "Without money, do not join the crowd"
 motto_fm_confucian_1364:0 "In misfortune, do not seek out kin"
 motto_fm_confucian_1365:0 "Never in your life do a deed to furrow the brow"
 motto_fm_confucian_1366:0 "And the world should hold no one gnashing his teeth at you"
 motto_fm_confucian_1367:0 "The scholar is the treasure of the state"
 motto_fm_confucian_1368:0 "The Confucian is a jewel at the feast"
 motto_fm_confucian_1369:0 "If you would break the habit of wine"
 motto_fm_confucian_1370:0 "Watch the drunkard with sober eyes"
 motto_fm_confucian_1371:0 "Ask aid only of a true man"
 motto_fm_confucian_1372:0 "Give aid only to those in urgent need"
 motto_fm_confucian_1373:0 "When thirsty, one drop is like sweet dew"
 motto_fm_confucian_1374:0 "After drunkenness, more cups are worse than none"
 motto_fm_confucian_1375:0 "A long stay makes one cheap"
 motto_fm_confucian_1376:0 "Frequent visits cool even kin"
 motto_fm_confucian_1377:0 "Silent over wine, a true gentleman"
 motto_fm_confucian_1378:0 "Clear in money matters, a great man indeed"
 motto_fm_confucian_1379:0 "Keep a beginner's heart and enlightenment overflows"
 motto_fm_confucian_1380:0 "A thousand taels of gold are not worth a clear reading of the classics"
 motto_fm_confucian_1381:0 "To raise a son without teaching is to raise a donkey"
 motto_fm_confucian_1382:0 "To raise a daughter without teaching is to raise a swine"
 motto_fm_confucian_1383:0 "Fields unplowed, the granary stands empty"
 motto_fm_confucian_1384:0 "Books unread, the children grow foolish"
 motto_fm_confucian_1385:0 "When the granary is empty, the years are hard"
 motto_fm_confucian_1386:0 "When children are foolish, rites and duty are neglected"
 motto_fm_confucian_1387:0 "One talk with a worthy man"
 motto_fm_confucian_1388:0 "Is worth ten years of reading"
 motto_fm_confucian_1389:0 "A man who knows not past and present"
 motto_fm_confucian_1390:0 "Is a horse or ox in human dress"
 motto_fm_confucian_1391:0 "Countless are the people across the four seas"
 motto_fm_confucian_1392:0 "Which of the men among them is a true man"
 motto_fm_confucian_1393:0 "Wine is brewed to welcome good guests"
 motto_fm_confucian_1394:0 "Gold is scattered to gather books"
 motto_fm_confucian_1395:0 "Saving one life outranks building a seven-story pagoda"
 motto_fm_confucian_1396:0 "A fire at the city gate brings disaster to the fish in the moat"
 motto_fm_confucian_1397:0 "Auspicious plants may grow in the courtyard"
 motto_fm_confucian_1398:0 "But a good deed may still be better undone"
 motto_fm_confucian_1399:0 "If you seek riches and honor in life"
 motto_fm_confucian_1400:0 "You must put in deadly earnest effort"
 motto_fm_confucian_1401:0 "A hundred years may not suffice to build"
 motto_fm_confucian_1402:0 "A single day is more than enough to ruin"
 motto_fm_confucian_1403:0 "The heart is like iron, the law like a furnace"
 motto_fm_confucian_1404:0 "Good influence falls short, bad influence runs over"
 motto_fm_confucian_1405:0 "Too clear water holds no fish"
 motto_fm_confucian_1406:0 "A man too keen-eyed keeps no followers"
 motto_fm_confucian_1407:0 "The knowing are halved, the saving are none"
 motto_fm_confucian_1408:0 "At home follow the father, married follow the husband"
 motto_fm_confucian_1409:0 "The fool fears his wife, the worthy wife honors her husband"
 motto_fm_confucian_1410:0 "Gossip lasts all day, but unheeded it dies of itself"
 motto_fm_confucian_1411:0 "Better upright and lacking"
 motto_fm_confucian_1412:0 "Than crooked and overflowing"
 motto_fm_confucian_1413:0 "Better to believe it is so"
 motto_fm_confucian_1414:0 "Than to believe it is not"
 motto_fm_confucian_1415:0 "A bamboo fence and thatched hut have their own charm"
 motto_fm_confucian_1416:0 "Daoist courts and monkish halls cannot compare"
 motto_fm_confucian_1417:0 "What fate holds, in time you will have"
 motto_fm_confucian_1418:0 "What fate denies, do not force by striving"
 motto_fm_confucian_1419:0 "The Daoist court welcomes wandering immortals"
 motto_fm_confucian_1420:0 "The study hall hides scholars fit to be ministers"
 motto_fm_confucian_1421:0 "In the courtyard plant bamboo for the phoenix to roost"
 motto_fm_confucian_1422:0 "In the pond raise fish that may turn to dragons"
 motto_fm_confucian_1423:0 "Make friends with those who surpass you"
 motto_fm_confucian_1424:0 "Those just like yourself are better not had"
 motto_fm_confucian_1425:0 "Just watch for three or five days"
 motto_fm_confucian_1426:0 "And meeting again is not like the first time"
 motto_fm_confucian_1427:0 "Human feeling is like water, flowing high and low"
 motto_fm_confucian_1428:0 "Worldly affairs are like clouds, rolling and unrolling freely"
 motto_fm_confucian_1429:0 "A good talker speaks of the city"
 motto_fm_confucian_1430:0 "A poor talker speaks of his own room"
 motto_fm_confucian_1431:0 "Sharpening a knife, you regret it is not keener"
 motto_fm_confucian_1432:0 "Yet a keen knife cuts the finger"
 motto_fm_confucian_1433:0 "Seeking wealth, you regret not getting it"
 motto_fm_confucian_1434:0 "Yet too much wealth harms yourself"
 motto_fm_confucian_1435:0 "Content with enough, you are never disgraced"
 motto_fm_confucian_1436:0 "Knowing when to stop, you are never ashamed"
 motto_fm_confucian_1437:0 "With fortune, wealth is spent; without it, the self is harmed"
 motto_fm_confucian_1438:0 "A hair's breadth of error leads a thousand miles astray"
 motto_fm_confucian_1439:0 "To climb high, you must begin low"
 motto_fm_confucian_1440:0 "To travel far, you must begin near"
 motto_fm_confucian_1441:0 "Think thrice before acting; twice is enough"
 motto_fm_confucian_1442:0 "Doing it yourself beats sending word"
 motto_fm_confucian_1443:0 "Asking yourself beats asking others"
 motto_fm_confucian_1444:0 "As children, you were brothers"
 motto_fm_confucian_1445:0 "Grown up, each lives in his own village"
 motto_fm_confucian_1446:0 "Envy wealth, but not another's food"
 motto_fm_confucian_1447:0 "Blame the living, but not the dead"
 motto_fm_confucian_1448:0 "Others scowl at seeing gray hair"
 motto_fm_confucian_1449:0 "I rejoice at seeing gray hair"
 motto_fm_confucian_1450:0 "How many die young"
 motto_fm_confucian_1451:0 "Never living to see gray hair"
 motto_fm_confucian_1452:0 "Walls have cracks, and walls have ears"
 motto_fm_confucian_1453:0 "Good deeds never leave the house"
 motto_fm_confucian_1454:0 "Bad deeds travel a thousand miles"
 motto_fm_confucian_1455:0 "A thief is a small man whose wit outruns a gentleman's"
 motto_fm_confucian_1456:0 "The gentleman holds firm in poverty"
 motto_fm_confucian_1457:0 "The small man, in poverty, breaks all bounds"
 motto_fm_confucian_1458:0 "The poor live at ease, the rich bear many cares"
 motto_fm_confucian_1459:0 "They count not my virtue but turn it into enmity"
 motto_fm_confucian_1460:0 "Better to take by the straight path"
 motto_fm_confucian_1461:0 "Than to seek by crooked ways"
 motto_fm_confucian_1462:0 "When the weather is fair you will not leave"
 motto_fm_confucian_1463:0 "And wait until the rain drenches your head"
 motto_fm_confucian_1464:0 "What is done, speak no more of"
 motto_fm_confucian_1465:0 "Spilt water cannot be gathered back"
 motto_fm_confucian_1466:0 "Trouble comes only from talking too much"
 motto_fm_confucian_1467:0 "Worry comes from pushing yourself too far forward"
 motto_fm_confucian_1468:0 "Endure a moment's anger"
 motto_fm_confucian_1469:0 "And escape a hundred days of grief"
 motto_fm_confucian_1470:0 "Of late I have learned the turtle's way"
 motto_fm_confucian_1471:0 "When you can pull in your head, pull it in"
 motto_fm_confucian_1472:0 "Those who respect the law are happy every day"
 motto_fm_confucian_1473:0 "Those who cheat the public worry every day"
 motto_fm_confucian_1474:0 "A man lives one life, the grass grows one spring"
 motto_fm_confucian_1475:0 "Black-haired, you know not the value of early study"
 motto_fm_confucian_1476:0 "And before you know it, you are white-haired"
 motto_fm_confucian_1477:0 "After the full moon, its light begins to wane"
 motto_fm_confucian_1478:0 "Past middle age, all affairs draw to a close"
 motto_fm_confucian_1479:0 "Children have their own blessings"
 motto_fm_confucian_1480:0 "Do not slave like a horse or ox for your children"
 motto_fm_confucian_1481:0 "A man's life does not reach a hundred years"
 motto_fm_confucian_1482:0 "Yet he carries a thousand years of worry"
 motto_fm_confucian_1483:0 "With wine today, be drunk today"
 motto_fm_confucian_1484:0 "Tomorrow's sorrow, worry tomorrow"
 motto_fm_confucian_1485:0 "On a dangerous road, there is no turning aside"
 motto_fm_confucian_1486:0 "When the matter comes to a head, you are not free"
 motto_fm_confucian_1487:0 "Medicine can cure a feigned illness"
 motto_fm_confucian_1488:0 "Wine cannot dissolve true sorrow"
 motto_fm_confucian_1489:0 "The poor stay silent, level water does not flow"
 motto_fm_confucian_1490:0 "One daughter in the house, a hundred families court her"
 motto_fm_confucian_1491:0 "One horse that will not move brings a hundred horses to worry"
 motto_fm_confucian_1492:0 "With flowers, only then pour the wine"
 motto_fm_confucian_1493:0 "Without the moon, do not climb the tower"
 motto_fm_confucian_1494:0 "Three cups open the great way"
 motto_fm_confucian_1495:0 "One bout of drunkenness dissolves a thousand sorrows"
 motto_fm_confucian_1496:0 "Deep mountains after all hide fierce tigers"
 motto_fm_confucian_1497:0 "The great sea in the end must take in the small streams"
 motto_fm_confucian_1498:0 "Cherishing flowers, be careful of yourself"
 motto_fm_confucian_1499:0 "Loving the moon, do not even comb your hair"
 motto_fm_confucian_1500:0 "Choose her above all for a fine frame and bearing"
 motto_fm_confucian_1501:0 "With no rouge at all she is still alluring"
 motto_fm_confucian_1502:0 "At the height of favor, you should first step back"
 motto_fm_confucian_1503:0 "At the peak of success, you may well rest"
 motto_fm_confucian_1504:0 "Do not let idle gossip reach your ears"
 motto_fm_confucian_1505:0 "For former love may turn to enmity"
 motto_fm_confucian_1506:0 "Keep the bright moon over the five lakes"
 motto_fm_confucian_1507:0 "And you need not worry where to cast your golden hook"
 motto_fm_confucian_1508:0 "Do not leave a place that has fish"
 motto_fm_confucian_1509:0 "Or cling to a shallow shore"
 motto_fm_confucian_1510:0 "What must go will in the end go"
 motto_fm_confucian_1511:0 "No urging can make it stay"
 motto_fm_confucian_1512:0 "Hold back one word and still one anger"
 motto_fm_confucian_1513:0 "Yield one move and step back one pace"
 motto_fm_confucian_1514:0 "Not bold at thirty, not rich at forty"
 motto_fm_confucian_1515:0 "At fifty you will be seeking a way to ruin"
 motto_fm_confucian_1516:0 "In life none mind your soul, in death none claim your corpse"
 motto_fm_confucian_1517:0 "Deep as a parent's love is, in the end comes parting"
 motto_fm_confucian_1518:0 "Heavy as a couple's bond is, they too must part"
 motto_fm_confucian_1519:0 "Life is like birds roosting in one wood"
 motto_fm_confucian_1520:0 "When the final hour comes, each flies its own way"
 motto_fm_confucian_1521:0 "The kind are bullied by others"
 motto_fm_confucian_1522:0 "The gentle horse is ridden by others"
 motto_fm_confucian_1523:0 "No windfall, no riches"
 motto_fm_confucian_1524:0 "No night fodder, no fat horse"
 motto_fm_confucian_1525:0 "The wicked, others fear, but heaven does not"
 motto_fm_confucian_1526:0 "The kind, others bully, but heaven does not"
 motto_fm_confucian_1527:0 "Good and evil in the end receive their due"
 motto_fm_confucian_1528:0 "Only sooner or later the reckoning comes"
 motto_fm_confucian_1529:0 "Even the Yellow River has its day of clearing"
 motto_fm_confucian_1530:0 "How then can a man never see his fortune turn"
 motto_fm_confucian_1531:0 "In favor, think of disgrace; at ease, think of peril"
 motto_fm_confucian_1532:0 "Every thought as on the day of facing the foe"
 motto_fm_confucian_1533:0 "Every heart as when crossing a bridge"
 motto_fm_confucian_1534:0 "Heroes walk the dangerous path"
 motto_fm_confucian_1535:0 "Riches and honor are like a flowering branch"
 motto_fm_confucian_1536:0 "Do not say the spring's light is always fair"
 motto_fm_confucian_1537:0 "Only fear that autumn brings a chill"
 motto_fm_confucian_1538:0 "However far you send a friend, parting must come"
 motto_fm_confucian_1539:0 "Just watch the crab with a cold eye"
 motto_fm_confucian_1540:0 "And see how long he can crawl sideways"
 motto_fm_confucian_1541:0 "What you see, do not tell; what you are asked, claim not to know"
 motto_fm_confucian_1542:0 "Mind not idle affairs, and come home early when there is none"
 motto_fm_confucian_1543:0 "False satin dyed a true red"
 motto_fm_confucian_1544:0 "Is still talked of by others as false"
 motto_fm_confucian_1545:0 "Good deeds may be done, evil deeds must not"
 motto_fm_confucian_1546:0 "A thing once promised, a thousand gold cannot move it"
 motto_fm_confucian_1547:0 "A dragon begets dragons, a tiger begets leopards"
 motto_fm_confucian_1548:0 "A dragon in shallow water is mocked by shrimp"
 motto_fm_confucian_1549:0 "A tiger fallen to the plain is bullied by dogs"
 motto_fm_confucian_1550:0 "At one stroke, your name tops the dragon-tiger list"
 motto_fm_confucian_1551:0 "In ten years, you reach the Phoenix Pool"
 motto_fm_confucian_1552:0 "Ten years beneath the window, no one asks after you"
 motto_fm_confucian_1553:0 "One success and the whole world knows your name"
 motto_fm_confucian_1554:0 "Wine debts are common wherever you go"
 motto_fm_confucian_1555:0 "Since olden times, few men live to seventy"
 motto_fm_confucian_1556:0 "Raise sons for your old age, store grain against famine"
 motto_fm_confucian_1557:0 "Keep fowl, pigs, dogs, and swine"
 motto_fm_confucian_1558:0 "Do not miss their seasons"
 motto_fm_confucian_1559:0 "Then a family of several mouths"
 motto_fm_confucian_1560:0 "May go without hunger"
 motto_fm_confucian_1561:0 "In days of plenty, think of days of want"
 motto_fm_confucian_1562:0 "Do not treat a time of want as a time of plenty"
 motto_fm_confucian_1563:0 "With fortune, a fair wind carries you to the Tengwang Pavilion"
 motto_fm_confucian_1564:0 "With fortune gone, thunder strikes the Jianfu stele"
 motto_fm_confucian_1565:0 "Entering the gate, ask not of rise and fall"
 motto_fm_confucian_1566:0 "A glance at the face will tell you all"
 motto_fm_confucian_1567:0 "When the magistrate is honest, his clerks grow thin"
 motto_fm_confucian_1568:0 "When the god is potent, the temple keeper grows fat"
 motto_fm_confucian_1569:0 "Quell the wrath of thunder"
 motto_fm_confucian_1570:0 "Lay down the might of tiger and wolf"
 motto_fm_confucian_1571:0 "Forgiving others is the root of reckoning"
 motto_fm_confucian_1572:0 "Yielding to others is the pivot of reckoning"
 motto_fm_confucian_1573:0 "Kind words come hard, harsh words come easy"
 motto_fm_confucian_1574:0 "A word once spoken, four horses cannot catch it"
 motto_fm_confucian_1575:0 "He who praises me to my face is my thief"
 motto_fm_confucian_1576:0 "He who faults me to my face is my teacher"
 motto_fm_confucian_1577:0 "Meeting a swordsman on the road, present your sword"
 motto_fm_confucian_1578:0 "If you are no poet, do not offer your verses"
 motto_fm_confucian_1579:0 "When a man's wish is good, heaven is sure to aid him"
 motto_fm_confucian_1580:0 "Do not drink wine in the early morning"
 motto_fm_confucian_1581:0 "Or you will be drunk till evening"
 motto_fm_confucian_1582:0 "Do not scold your wife in the evening"
 motto_fm_confucian_1583:0 "Or you will pass the night alone and cold"
 motto_fm_confucian_1584:0 "Plant hemp and get hemp, plant beans and get beans"
 motto_fm_confucian_1585:0 "Heaven's net is vast, its mesh wide, yet nothing slips through"
 motto_fm_confucian_1586:0 "Before an official, do not press forward"
 motto_fm_confucian_1587:0 "As a guest, do not lag behind"
 motto_fm_confucian_1588:0 "Better to add a measure of grain"
 motto_fm_confucian_1589:0 "Than to add another mouth to feed"
 motto_fm_confucian_1590:0 "The mantis stalks the cicada"
 motto_fm_confucian_1591:0 "Little knowing the oriole waits behind"
 motto_fm_confucian_1592:0 "Seek not heaps of gold and jade"
 motto_fm_confucian_1593:0 "Only wish that every child and grandchild be worthy"
 motto_fm_confucian_1594:0 "One day as husband and wife, a bond of a hundred lives"
 motto_fm_confucian_1595:0 "A hundred lives of merit to cross in one boat"
 motto_fm_confucian_1596:0 "A thousand lives of merit to share one pillow"
 motto_fm_confucian_1597:0 "Kill ten thousand and you lose three thousand of your own"
 motto_fm_confucian_1598:0 "One wounding word cuts sharper than a knife"
 motto_fm_confucian_1599:0 "A withered tree meeting spring may sprout again"
 motto_fm_confucian_1600:0 "But a man cannot pass through youth twice"
 motto_fm_confucian_1601:0 "Seek lodging before the day grows late"
 motto_fm_confucian_1602:0 "At cockcrow, look early at the sky"
 motto_fm_confucian_1603:0 "A general's brow can let a horse trot across"
 motto_fm_confucian_1604:0 "A duke's belly can float a boat"
 motto_fm_confucian_1605:0 "The rich think of next year"
 motto_fm_confucian_1606:0 "The poor think of the moment before them"
 motto_fm_confucian_1607:0 "If you want goodwill in the world"
 motto_fm_confucian_1608:0 "Sell goods on credit and do not press for payment"
 motto_fm_confucian_1609:0 "Strike a stone and there is fire within"
 motto_fm_confucian_1610:0 "Strike it not and no smoke rises"
 motto_fm_confucian_1611:0 "Only through learning does a man know the Way"
 motto_fm_confucian_1612:0 "Without learning, all is in vain"
 motto_fm_confucian_1613:0 "Do not laugh at others for growing old"
 motto_fm_confucian_1614:0 "In the end, you too must reach old age"
 motto_fm_confucian_1615:0 "Only keep to your proper lot"
 motto_fm_confucian_1616:0 "And in the end you will be free of trouble"
 motto_fm_confucian_1617:0 "A gentleman loves wealth but gains it by the right way"
 motto_fm_confucian_1618:0 "A chaste wife loves beauty but keeps it within the rites"
 motto_fm_confucian_1619:0 "Good has its reward and evil its recompense"
 motto_fm_confucian_1620:0 "If not yet repaid, the day has not yet come"
 motto_fm_confucian_1621:0 "One man tells a falsehood, a thousand pass it as true"
 motto_fm_confucian_1622:0 "To make any matter right, ask the elders of three villages"
 motto_fm_confucian_1623:0 "Contend over trifles and you lose the great way"
 motto_fm_confucian_1624:0 "Every year guard against famine, every night against thieves"
 motto_fm_confucian_1625:0 "The learned are like standing grain"
 motto_fm_confucian_1626:0 "The unlearned are like weeds and brush"
 motto_fm_confucian_1627:0 "When it is time to drink, then drink"
 motto_fm_confucian_1628:0 "Where you may sing aloud, then sing"
 motto_fm_confucian_1629:0 "Blow the fire with the wind and it costs little effort"
 motto_fm_confucian_1630:0 "Without the fisherman's guidance"
 motto_fm_confucian_1631:0 "How would you ever see the waves"
 motto_fm_confucian_1632:0 "Ask for nothing and goodwill meets you everywhere"
 motto_fm_confucian_1633:0 "If you do not drink, let the wine be dear as it will"
 motto_fm_confucian_1634:0 "Know fewer affairs and you have fewer worries"
 motto_fm_confucian_1635:0 "Know more people and you meet more gossip"
 motto_fm_confucian_1636:0 "In the mountains, fear not the man-eating tiger"
 motto_fm_confucian_1637:0 "Only fear the double-edged blade of human feeling"
 motto_fm_confucian_1638:0 "Behind the strong there is always one stronger"
 motto_fm_confucian_1639:0 "A wicked man must be ground down by a wicked man"
 motto_fm_confucian_1640:0 "Skill at spending does not lie in a wealthy house"
 motto_fm_confucian_1641:0 "Elegance does not depend on many clothes"
 motto_fm_confucian_1642:0 "Time flies like an arrow, days and months like a shuttle"
 motto_fm_confucian_1643:0 "Gold is not the most precious"
 motto_fm_confucian_1644:0 "Peace and joy are worth far more"
 motto_fm_confucian_1645:0 "All callings of the world are lowly"
 motto_fm_confucian_1646:0 "Think on it, and only study stands high"
 motto_fm_confucian_1647:0 "All the fine words of the world are in books"
 motto_fm_confucian_1648:0 "All the famed mountains are held by monks"
 motto_fm_confucian_1649:0 "Doing good is the greatest joy; evil cannot escape"
 motto_fm_confucian_1650:0 "The lamb kneels to nurse, repaying the gift of milk"
 motto_fm_confucian_1651:0 "The crow feeds its mother, repaying the gift of care"
 motto_fm_confucian_1652:0 "You may be anxious while another is not"
 motto_fm_confucian_1653:0 "A man at rest still has a restless heart"
 motto_fm_confucian_1654:0 "Hide faults, spread goodness, and hold to both ends"
 motto_fm_confucian_1655:0 "A worthy wife brings few misfortunes"
 motto_fm_confucian_1656:0 "A filial son sets his father's heart at ease"
 motto_fm_confucian_1657:0 "Once the pot is broken, looking back does no good"
 motto_fm_confucian_1658:0 "Water once spilled is truly hard to gather"
 motto_fm_confucian_1659:0 "When is a man ever content with contentment"
 motto_fm_confucian_1660:0 "The old steal their ease, and ease is all they have"
 motto_fm_confucian_1661:0 "Wherever a green willow can tether a horse"
 motto_fm_confucian_1662:0 "Everywhere a road leads through to Chang'an"
 motto_fm_confucian_1663:0 "Watching is easy, learning is hard"
 motto_fm_confucian_1664:0 "Do not treat what came easily"
 motto_fm_confucian_1665:0 "As a thing of little worth"
 motto_fm_confucian_1666:0 "Scheme with all your heart and every step goes wrong"
 motto_fm_confucian_1667:0 "Step back and ponder, and every matter is hard"
 motto_fm_confucian_1668:0 "Paths differ, but raising a family is the same"
 motto_fm_confucian_1669:0 "From thrift to luxury is easy"
 motto_fm_confucian_1670:0 "From luxury to thrift is hard"
 motto_fm_confucian_1671:0 "Tell your music only to one who understands"
 motto_fm_confucian_1672:0 "If none understands, do not play for them"
 motto_fm_confucian_1673:0 "Turn stone to gold with a touch"
 motto_fm_confucian_1674:0 "And the human heart is still not satisfied"
 motto_fm_confucian_1675:0 "Trust your belly and you will sell your house"
 motto_fm_confucian_1676:0 "Others watching flowers need not catch your eye"
 motto_fm_confucian_1677:0 "Others toiling busily need not move your feet"
 motto_fm_confucian_1678:0 "Who does not love worthy children and grandchildren"
 motto_fm_confucian_1679:0 "Who does not love a thousand measures of grain"
 motto_fm_confucian_1680:0 "Do not waste your true heart on idle schemes"
 motto_fm_confucian_1681:0 "The five elements are not the point of this matter"
 motto_fm_confucian_1682:0 "At odds with someone, urge him to raise geese"
 motto_fm_confucian_1683:0 "At feud with someone, urge him to build a house"
 motto_fm_confucian_1684:0 "Only do good deeds and ask not what lies ahead"
 motto_fm_confucian_1685:0 "When the river is narrow, the current is swift; pressed, a plan is born"
 motto_fm_confucian_1686:0 "You know full well the mountain holds a tiger"
 motto_fm_confucian_1687:0 "Then do not walk toward the tiger's mountain"
 motto_fm_confucian_1688:0 "A road not walked is not reached"
 motto_fm_confucian_1689:0 "A deed not done is not accomplished"
 motto_fm_confucian_1690:0 "A man not urged is not made good"
 motto_fm_confucian_1691:0 "A bell not struck does not sound"
 motto_fm_confucian_1692:0 "Only with no money does one give up wine"
 motto_fm_confucian_1693:0 "Only in old age does one first read the scriptures"
 motto_fm_confucian_1694:0 "Light a seven-story pagoda"
 motto_fm_confucian_1695:0 "And it is not worth one lamp in a dark place"
 motto_fm_confucian_1696:0 "In all things, urge people not to hide the truth"
 motto_fm_confucian_1697:0 "Three feet above your head there is a spirit watching"
 motto_fm_confucian_1698:0 "Keep only a small plot of land in your heart"
 motto_fm_confucian_1699:0 "And leave it for your descendants to till"
 motto_fm_confucian_1700:0 "Put out the fire in your heart"
 motto_fm_confucian_1701:0 "And trim the lamp before the Buddha"
 motto_fm_confucian_1702:0 "The clear-sighted are never content"
 motto_fm_confucian_1703:0 "The muddled rise to high office"
 motto_fm_confucian_1704:0 "The many stars shine bright"
 motto_fm_confucian_1705:0 "But not like the lone moon shining alone"
 motto_fm_confucian_1706:0 "Brothers who harm each other are worse than friends"
 motto_fm_confucian_1707:0 "What is reasonable may be done; over small gains do not fight"
 motto_fm_confucian_1708:0 "The peony is lovely, but only pleases the eye"
 motto_fm_confucian_1709:0 "The jujube flower is small, yet bears real fruit"
 motto_fm_confucian_1710:0 "You may slight the old, but do not slight the young"
 motto_fm_confucian_1711:0 "To cheat another shows a heart unclear"
 motto_fm_confucian_1712:0 "Plow and hoe as is your lot and reap the land's bounty"
 motto_fm_confucian_1713:0 "When later you are full, give thanks to heaven"
 motto_fm_confucian_1714:0 "Where you can bear it, bear it; where you can endure, endure"
 motto_fm_confucian_1715:0 "Bear not and endure not, and small matters grow large"
 motto_fm_confucian_1716:0 "Strive to outdo each other in heroics"
 motto_fm_confucian_1717:0 "And the family fortunes slowly decline"
 motto_fm_confucian_1718:0 "A worthy wife makes her husband honored"
 motto_fm_confucian_1719:0 "A wicked wife brings her husband ruin"
 motto_fm_confucian_1720:0 "When one man is blessed, the myriad people rely on it"
 motto_fm_confucian_1721:0 "The man is old, but his heart is not"
 motto_fm_confucian_1722:0 "The man is poor, but his will must not be"
 motto_fm_confucian_1723:0 "No man enjoys a thousand days of favor"
 motto_fm_confucian_1724:0 "No flower stays red for a hundred days"
 motto_fm_confucian_1725:0 "Murder may be forgiven, but not against sense and feeling"
 motto_fm_confucian_1726:0 "Newly rich, you know not how to enjoy it"
 motto_fm_confucian_1727:0 "Newly poor, you cannot shed the old family ways"
 motto_fm_confucian_1728:0 "The seats at the table are always full"
 motto_fm_confucian_1729:0 "The wine in the goblet is never empty"
 motto_fm_confucian_1730:0 "The roof leaks and meets a night of endless rain"
 motto_fm_confucian_1731:0 "The boat is slow and meets a headwind"
 motto_fm_confucian_1732:0 "The shoot sheds its sheath to become bamboo"
 motto_fm_confucian_1733:0 "The fish strains against the current to become a dragon"
 motto_fm_confucian_1734:0 "Remember the boy riding his bamboo horse"
 motto_fm_confucian_1735:0 "Unmoved by favor or disgrace, watch the courtyard flowers bloom and fall"
 motto_fm_confucian_1736:0 "Careless of going or staying, gaze at the clouds roll and unroll"
 motto_fm_confucian_1737:0 "In friendship, keep a touch of chivalry"
 motto_fm_confucian_1738:0 "In living, keep a plain and honest heart"
 motto_fm_confucian_1739:0 "Worldly affairs are like chess; yielding one move costs me nothing"
 motto_fm_confucian_1740:0 "A heart like the sea, taking in all rivers, shows a tolerant man"
 motto_fm_confucian_1741:0 "If heaven thins my fortune, I thicken my virtue to meet it"
 motto_fm_confucian_1742:0 "A gentleman's thoughts are clear as the blue sky and bright as day"
 motto_fm_confucian_1743:0 "A gentleman's talents are hidden like jade and pearls"
 motto_fm_confucian_1744:0 "Rich, fat, spicy, and sweet are not the true flavor"
 motto_fm_confucian_1745:0 "The true flavor is only plainness"
 motto_fm_confucian_1746:0 "The marvelous and exceptional is not the perfect man"
 motto_fm_confucian_1747:0 "The perfect man is only ordinary"
 motto_fm_confucian_1748:0 "Virtue grows with capacity, capacity with understanding"
 motto_fm_confucian_1749:0 "In stillness, look at the heart and truth and falsehood both appear"
 motto_fm_confucian_1750:0 "Wind stirs the sparse bamboo, but passing, leaves no sound"
 motto_fm_confucian_1751:0 "Geese cross the cold pool, but gone, leave no shadow"
 motto_fm_confucian_1752:0 "When affairs come, the gentleman's heart appears"
 motto_fm_confucian_1753:0 "When affairs go, the heart becomes empty again"
 motto_fm_confucian_1754:0 "In stillness, thoughts and cares run clear"
 motto_fm_confucian_1755:0 "In leisure, the bearing is calm and easy"
 motto_fm_confucian_1756:0 "In haste, examine your conduct"
 motto_fm_confucian_1757:0 "Heaven and earth rest in silence, unmoving"
 motto_fm_confucian_1758:0 "Yet the breath of life never pauses"
 motto_fm_confucian_1759:0 "Sun and moon race on by day and night"
 motto_fm_confucian_1760:0 "Yet their steadfast light never changes through the ages"
 motto_fm_confucian_1761:0 "Keep still and then you know the weariness of restless motion"
 motto_fm_confucian_1762:0 "Keep silent and then you know the rashness of much talk"
 motto_fm_confucian_1763:0 "A poor scholar who cannot help others with goods"
 motto_fm_confucian_1764:0 "May speak one word to rouse a man from delusion"
 motto_fm_confucian_1765:0 "May speak one word to rescue a man in distress"
 motto_fm_confucian_1766:0 "That too is merit beyond measure"
 motto_fm_confucian_1767:0 "Hear the bell in the still night and wake from the dream within the dream"
 motto_fm_confucian_1768:0 "See the moon's reflection in the clear pool and glimpse the self beyond the self"
 motto_fm_confucian_1769:0 "A loss in worldly affairs is fortune; a cool affection lasts"
 motto_fm_confucian_1770:0 "A bitter heart often gains the joy of a glad heart"
 motto_fm_confucian_1771:0 "In success lies the seed of the sorrow of failure"
 motto_fm_confucian_1772:0 "In adversity, all around you are needles and healing herbs"
 motto_fm_confucian_1773:0 "In prosperity, before your eyes are all blades and spears"
 motto_fm_confucian_1774:0 "Heaven and earth endure forever, but this body comes but once"
 motto_fm_confucian_1775:0 "A man's life is but a hundred years, and this day passes most easily"
 motto_fm_confucian_1776:0 "The fortunate among us must know the joy of being alive"
 motto_fm_confucian_1777:0 "And must also bear the fear of a life lived in vain"
 motto_fm_confucian_1778:0 "Hardship and joy temper each other"
 motto_fm_confucian_1779:0 "Happiness forged to the limit is the happiness that lasts"
 motto_fm_confucian_1780:0 "Doubt and trust check each other"
 motto_fm_confucian_1781:0 "Knowledge refined to the limit is the knowledge that is true"
 motto_fm_confucian_1782:0 "The heart must be empty, and emptied, principle comes to dwell"
 motto_fm_confucian_1783:0 "The heart must be full, and full, desire cannot enter"
 motto_fm_confucian_1784:0 "Your bearing should be broad and high, but not reckless"
 motto_fm_confucian_1785:0 "Your mind should be careful and fine, but not petty"
 motto_fm_confucian_1786:0 "Your tastes should be plain and quiet, but not barren"
 motto_fm_confucian_1787:0 "Your integrity should be strict and clear, but not harsh"
 motto_fm_confucian_1788:0 "A writing done to its utmost has no special wonder"
 motto_fm_confucian_1789:0 "It is only exactly right"
 motto_fm_confucian_1790:0 "A character refined to its utmost has no strange mark"
 motto_fm_confucian_1791:0 "It is only what is natural"
 motto_fm_confucian_1792:0 "Doing good shows no gain, like the melon hidden under the grass"
 motto_fm_confucian_1793:0 "Doing evil shows no loss, like the spring snow in the courtyard"
 motto_fm_confucian_1794:0 "Do not let the doubts of many block your own insight"
 motto_fm_confucian_1795:0 "Do not let your own will cast aside the words of others"
 motto_fm_confucian_1796:0 "Do not trade small private favors against the greater good"
 motto_fm_confucian_1797:0 "Do not borrow public opinion to serve private feeling"
 motto_fm_confucian_1798:0 "Virtue is the master of talent, talent the servant of virtue"
 motto_fm_confucian_1799:0 "Talent without virtue is a house without a master, the servant running wild"
 motto_fm_confucian_1800:0 "In office be just and honest, at home be forgiving and thrifty"
 motto_fm_confucian_1801:0 "Rise at dawn and sweep the courtyard clean"
 motto_fm_confucian_1802:0 "Rest at dusk and lock the doors and gates"
 motto_fm_confucian_1803:0 "For every bowl of gruel and rice, think how hard it came"
 motto_fm_confucian_1804:0 "For every thread and fiber, remember the toil behind it"
 motto_fm_confucian_1805:0 "Mend the roof before the rain falls"
 motto_fm_confucian_1806:0 "Do not dig a well only when you are thirsty"
 motto_fm_confucian_1807:0 "Keep your own wants simple and frugal"
 motto_fm_confucian_1808:0 "When hosting guests, do not linger in feasting"
 motto_fm_confucian_1809:0 "Plain and clean vessels beat gold and jade"
 motto_fm_confucian_1810:0 "Simple and fine fare surpasses delicacies"
 motto_fm_confucian_1811:0 "Do not build a grand house or covet rich fields"
 motto_fm_confucian_1812:0 "Gossiping women are brokers of lust and theft"
 motto_fm_confucian_1813:0 "Pretty maids and dainty concubines are no blessing to a home"
 motto_fm_confucian_1814:0 "Do not keep handsome servants"
 motto_fm_confucian_1815:0 "Wives and concubines must avoid gaudy dress"
 motto_fm_confucian_1816:0 "However distant the ancestors, sacrifices must be sincere"
 motto_fm_confucian_1817:0 "However dull the children, the classics must be read"
 motto_fm_confucian_1818:0 "In your own life, seek plainness and honesty"
 motto_fm_confucian_1819:0 "In teaching your children, follow the right method"
 motto_fm_confucian_1820:0 "Do not covet windfall wealth"
 motto_fm_confucian_1821:0 "Do not drink wine beyond measure"
 motto_fm_confucian_1822:0 "In trading with peddlers, do not squeeze their profit"
 motto_fm_confucian_1823:0 "Seeing poor and troubled kin and neighbors, give them warmth and aid"
 motto_fm_confucian_1824:0 "A family built on harshness cannot long enjoy its gains"
 motto_fm_confucian_1825:0 "When proper bonds are broken, ruin is swift"
 motto_fm_confucian_1826:0 "Brothers and nephews should share surplus with the needy"
 motto_fm_confucian_1827:0 "Elders and juniors, within and without, keep order strict and words severe"
 motto_fm_confucian_1828:0 "To heed a wife and break with kin is no true man"
 motto_fm_confucian_1829:0 "To prize wealth and slight one's parents is no true son"
 motto_fm_confucian_1830:0 "Marry a daughter to a good man, not for a rich betrothal"
 motto_fm_confucian_1831:0 "Take a daughter-in-law for her virtue, not for her dowry"
 motto_fm_confucian_1832:0 "To fawn before the rich and noble is most shameful"
 motto_fm_confucian_1833:0 "To put on airs before the poor is the basest of all"
 motto_fm_confucian_1834:0 "At home, avoid lawsuits, for lawsuits end in ruin"
 motto_fm_confucian_1835:0 "In the world, avoid much talk, for much talk brings error"
 motto_fm_confucian_1836:0 "Do not use power to oppress widows and orphans"
 motto_fm_confucian_1837:0 "Do not glut your appetite by wantonly killing creatures"
 motto_fm_confucian_1838:0 "Self-willed and odd, regrets and errors will be many"
 motto_fm_confucian_1839:0 "Lazy and self-indulgent, the family's way will fail"
 motto_fm_confucian_1840:0 "Befriend wicked youths and in time you will share their burden"
 motto_fm_confucian_1841:0 "Bow to the seasoned and steady, and in need you can lean on them"
 motto_fm_confucian_1842:0 "Hear words lightly, how know they are not slander against another"
 motto_fm_confucian_1843:0 "You must endure and think thrice"
 motto_fm_confucian_1844:0 "In a quarrel, how know the fault is not your own"
 motto_fm_confucian_1845:0 "You must weigh it with a calm heart"
 motto_fm_confucian_1846:0 "Give favors without remembering, receive kindness without forgetting"
 motto_fm_confucian_1847:0 "In all things, leave some room to spare"
 motto_fm_confucian_1848:0 "In success, do not press your advantage again"
 motto_fm_confucian_1849:0 "At another's joy, do not let envy arise"
 motto_fm_confucian_1850:0 "At another's misfortune, do not let secret glee arise"
 motto_fm_confucian_1851:0 "Good done to be seen is not true good"
 motto_fm_confucian_1852:0 "Evil done but feared to be known is the greatest evil"
 motto_fm_confucian_1853:0 "Lust at the sight of beauty brings retribution on wife and daughter"
 motto_fm_confucian_1854:0 "Hiding resentment and shooting in the dark brings ruin on descendants"
 motto_fm_confucian_1855:0 "A home in harmony, though meals be meager, still has joy to spare"
 motto_fm_confucian_1856:0 "Taxes paid early, though the purse be empty, brings its own delight"
 motto_fm_confucian_1857:0 "In study, aim to be a sage or worthy"
 motto_fm_confucian_1858:0 "In office, keep your lord and country in your heart"
 motto_fm_confucian_1859:0 "Keep your lot, rest in your fate, follow the seasons, heed heaven"
 motto_fm_confucian_1860:0 "To live thus is near enough to the Way"
 motto_fm_confucian_1861:0 "Make things easy for others and things are easy for you"
 motto_fm_confucian_1862:0 "Befriend others well and long respect will follow"
 motto_fm_confucian_1863:0 "The poor lose ambition, the lean horse shows its bones"
 motto_fm_confucian_1864:0 "To remonstrate is doubly fine, to slander is doubly wounding"
 motto_fm_confucian_1865:0 "Praise and blessing grow, scheming and evil grow"
 motto_fm_confucian_1866:0 "A house that heaps up good is sure to have joy to spare"
 motto_fm_confucian_1867:0 "A house that heaps up evil is sure to have woe to spare"
 motto_fm_confucian_1868:0 "Do not fight over idle anger, for the sun must set each day"
 motto_fm_confucian_1869:0 "What comes by ill means goes just as easily"
 motto_fm_confucian_1870:0 "In honor think of disgrace, in safety think of danger"
 motto_fm_confucian_1871:0 "Lamb is sweet, yet many mouths are hard to please"
 motto_fm_confucian_1872:0 "Think thrice on a matter to spare yourself later regret"
 motto_fm_confucian_1873:0 "The prince enters school by the same rule as the commoner"
 motto_fm_confucian_1874:0 "Rise to the first rank, and still every law has its order"
 motto_fm_confucian_1875:0 "Gain has its root, loss lacks its root"
 motto_fm_confucian_1876:0 "In all things be honest, and fortune will pile up of itself"
 motto_fm_confucian_1877:0 "To take reward without merit leaves you restless in rest and meal"
 motto_fm_confucian_1878:0 "Wealth makes the voice bold, power makes men bully"
 motto_fm_confucian_1879:0 "Much talk loses words, much food harms the heart"
 motto_fm_confucian_1880:0 "See a friend off with wine, and eat your three meals a day"
 motto_fm_confucian_1881:0 "Drink less wine and learn more of affairs"
 motto_fm_confucian_1882:0 "To quarrel and bring suit does no good in ten thousand ways"
 motto_fm_confucian_1883:0 "A gift offered to another seeks something in return"
 motto_fm_confucian_1884:0 "In dwelling, choose good neighbors; in friendship, choose good friends"
 motto_fm_confucian_1885:0 "Those who follow heaven endure, those who defy it perish"
 motto_fm_confucian_1886:0 "Men die for wealth as birds die for food"
 motto_fm_confucian_1887:0 "Receive an ox from another, return a horse"
 motto_fm_confucian_1888:0 "The honest man endures, the deceitful man always fails"
 motto_fm_confucian_1889:0 "Mount Tai does not refuse the smallest dust"
 motto_fm_confucian_1890:0 "Small heaps pile up into something high and great"
 motto_fm_confucian_1891:0 "Ten million in wealth is not worth one humble skill"
 motto_fm_confucian_1892:0 "Of skills easy to learn and worth the most, none surpasses reading"
 motto_fm_confucian_1893:0 "In early youth the mind is keen and single"
 motto_fm_confucian_1894:0 "Once grown, thoughts scatter and drift"
 motto_fm_confucian_1895:0 "Therefore teach them early and miss not the moment"
 motto_fm_confucian_1896:0 "To learn young is like the light of the rising sun"
 motto_fm_confucian_1897:0 "To learn old is like walking at night with a candle"
 motto_fm_confucian_1898:0 "Yet still better than shutting one's eyes and seeing nothing"
 motto_fm_confucian_1899:0 "Dwelling with the good is like entering a room of orchids"
 motto_fm_confucian_1900:0 "And in time you are fragrant of yourself"
 motto_fm_confucian_1901:0 "Dwelling with the wicked is like entering a fish market"
 motto_fm_confucian_1902:0 "And in time you reek of yourself"
 motto_fm_confucian_1903:0 "At night see the day's wrong, today regret yesterday's fault"
 motto_fm_confucian_1904:0 "Read not all books under heaven and dare not scribble lightly"
 motto_fm_confucian_1905:0 "What is learned and known, when applied, reaches everywhere"
 motto_fm_confucian_1906:0 "Learning is for the sake of seeking gain"
 motto_fm_confucian_1907:0 "Some read a few dozen scrolls and think themselves great"
 motto_fm_confucian_1908:0 "Slighting their elders and scorning their equals"
 motto_fm_confucian_1909:0 "Others hate them as enemies"
 motto_fm_confucian_1910:0 "And despise them as owls"
 motto_fm_confucian_1911:0 "Thus with learning they only harm themselves"
 motto_fm_confucian_1912:0 "Better to have no learning at all"
 motto_fm_confucian_1913:0 "Custom and teaching flow from above down to those below"
 motto_fm_confucian_1914:0 "Thus a father unkind, a son unfilial"
 motto_fm_confucian_1915:0 "An elder brother unfriendly, a younger brother disrespectful"
 motto_fm_confucian_1916:0 "A husband unjust, a wife disobedient"
 motto_fm_confucian_1917:0 "A kind father, a rebellious son; a friendly brother, a proud younger"
 motto_fm_confucian_1918:0 "A just husband and a domineering wife"
 motto_fm_confucian_1919:0 "These are heaven's fierce folk, fit for the executioner's grip"
 motto_fm_confucian_1920:0 "Living in this world, one ought to have a calling"
 motto_fm_confucian_1921:0 "Set the heart right for heaven and earth"
 motto_fm_confucian_1922:0 "Set the life right for the people"
 motto_fm_confucian_1923:0 "Carry on the lost learning of the past sages"
 motto_fm_confucian_1924:0 "Open a lasting peace for all generations"
 motto_fm_confucian_1925:0 "Knowledge and action are one"
 motto_fm_confucian_1926:0 "Attain the innate good conscience"
 motto_fm_confucian_1927:0 "The heart itself is principle"
 motto_fm_confucian_1928:0 "Bandits in the hills are easy, bandits in the heart are hard"
 motto_fm_confucian_1929:0 "This heart is bright, what more is there to say"
 motto_fm_confucian_1930:0 "Youth passes easily, learning is hard to perfect"
 motto_fm_confucian_1931:0 "Not an inch of time may be treated lightly"
 motto_fm_confucian_1932:0 "Before you know it, the pond's spring grass has been a dream"
 motto_fm_confucian_1933:0 "And the parasol leaves on the steps already sound of autumn"
 motto_fm_confucian_1934:0 "A half-acre square pond opens like a mirror"
 motto_fm_confucian_1935:0 "Sky light and cloud shadows linger and drift together"
 motto_fm_confucian_1936:0 "Rising from the mud, yet unstained"
 motto_fm_confucian_1937:0 "Washed in clear ripples, yet not seductive"
 motto_fm_confucian_1938:0 "Hollow within, straight without, no creeping vine, no stray branch"
 motto_fm_confucian_1939:0 "Its scent spreads far and clean, standing tall and pure"
 motto_fm_confucian_1940:0 "To be viewed from afar, never played with close at hand"
 motto_fm_confucian_1941:0 "Who shares my love of the lotus"
 motto_fm_confucian_1942:0 "Self-cultivation requires reverence"
 motto_fm_confucian_1943:0 "Advance in learning lies in extending knowledge"
 motto_fm_confucian_1944:0 "Preserve heavenly principle, extinguish selfish desire"
 motto_fm_confucian_1945:0 "Investigate things, extend knowledge, make the will sincere, set the heart right"
 motto_fm_confucian_1946:0 "Read widely and probe the principle of things"
 motto_fm_confucian_1947:0 "Stillness cultivates the self, thrift nourishes virtue"
 motto_fm_confucian_1948:0 "Plain living clears the aim, quietness reaches far"
 motto_fm_confucian_1949:0 "Bend your back to the end and only then rest"
 motto_fm_confucian_1950:0 "Your aim should be set high and far"
 motto_fm_confucian_1951:0 "The resolute man seeks not to live at the cost of benevolence"
 motto_fm_confucian_1952:0 "There are those who give their lives to perfect benevolence"
 motto_fm_confucian_1953:0 "Those whose ways differ do not counsel one another"
 motto_fm_confucian_1954:0 "Three friends profit, three friends harm"
 motto_fm_confucian_1955:0 "The straight, the honest, and the learned are friends who profit"
 motto_fm_confucian_1956:0 "The flattering, the fawning, and the glib are friends who harm"
 motto_fm_confucian_1957:0 "The gentleman keeps three cautions"
 motto_fm_confucian_1958:0 "In youth, the blood is unsteady, beware of lust"
 motto_fm_confucian_1959:0 "In manhood, the blood is bold, beware of strife"
 motto_fm_confucian_1960:0 "In old age, the blood is spent, beware of greed"
 motto_fm_confucian_1961:0 "The gentleman stands in awe of three things"
 motto_fm_confucian_1962:0 "Heaven's decree and great men"
 motto_fm_confucian_1963:0 "And the words of the sages"
 motto_fm_confucian_1964:0 "Those born knowing are the highest"
 motto_fm_confucian_1965:0 "Those who learn to know are next"
 motto_fm_confucian_1966:0 "Those who learn through hardship come after them"
 motto_fm_confucian_1967:0 "Those in hardship who still do not learn are the lowest of the people"
 motto_fm_confucian_1968:0 "The gentleman has nine thoughts"
 motto_fm_confucian_1969:0 "To see clearly and to hear keenly"
 motto_fm_confucian_1970:0 "A warm countenance and a respectful bearing"
 motto_fm_confucian_1971:0 "Faithful words and reverent deeds"
 motto_fm_confucian_1972:0 "To ask in doubt and think of the cost in anger"
 motto_fm_confucian_1973:0 "To think of duty at the sight of gain"
 motto_fm_confucian_1974:0 "Clever words corrupt virtue"
 motto_fm_confucian_1975:0 "In teaching, there is no distinction of kind"
 motto_fm_confucian_1976:0 "Fine words and a flattering face have little benevolence"
 motto_fm_confucian_1977:0 "The gentleman worries over his own lack of ability"
 motto_fm_confucian_1978:0 "Not that others do not know him"
 motto_fm_confucian_1979:0 "The gentleman does not raise a man for his words"
 motto_fm_confucian_1980:0 "Nor discard words because of the man"
 motto_fm_confucian_1981:0 "To withhold words from one you should speak to is to lose the man"
 motto_fm_confucian_1982:0 "To speak to one you should not is to waste the words"
 motto_fm_confucian_1983:0 "The wise lose neither the man nor the words"
 motto_fm_confucian_1984:0 "The benevolent man has no enemy"
 motto_fm_confucian_1985:0 "To trust a book wholly is worse than no book at all"
 motto_fm_confucian_1986:0 "Without a heart of compassion, one is not human"
 motto_fm_confucian_1987:0 "Without a heart of shame, one is not human"
 motto_fm_confucian_1988:0 "Without a heart of deference, one is not human"
 motto_fm_confucian_1989:0 "Without a heart of right and wrong, one is not human"
 motto_fm_confucian_1990:0 "To nourish the heart, nothing is better than few desires"
 motto_fm_confucian_1991:0 "A man must not be without shame"
 motto_fm_confucian_1992:0 "To be ashamed of being shameless is to be without shame"
 motto_fm_confucian_1993:0 "Shame matters greatly to a man"
 motto_fm_confucian_1994:0 "Not to be ashamed of falling short of others"
 motto_fm_confucian_1995:0 "Then in what will you match them"
 motto_fm_confucian_1996:0 "The worthy kings of old loved goodness and forgot their power"
 motto_fm_confucian_1997:0 "They rejoiced in their way and forgot the power of others"
 motto_fm_confucian_1998:0 "Therefore if lords did not show full honor and courtesy"
 motto_fm_confucian_1999:0 "They could not gain audience with them often"
 motto_fm_confucian_2000:0 "Much less take them as ministers"