 motto_fm_confucian_775:0 "Rain falls in scattered showers on the Qingming Festival."
 motto_fm_confucian_776:0 "Pedestrians on the road are in a state of desolation."
 motto_fm_confucian_777:0 "Where is the wine shop?"
 motto_fm_confucian_778:0 "The shepherd boy points to the apricot blossom village."
 motto_fm_confucian_779:0 "Thousand miles of warbler songs, green leaves reflecting red blossoms"
 motto_fm_confucian_780:0 "Water villages and mountain citadels with the wind fluttering the wine flags"
 motto_fm_confucian_781:0 "Four hundred and eighty temples in the Southern Dynasties"
 motto_fm_confucian_782:0 "How many towers stand in the misty rain?"
 motto_fm_confucian_783:0 "Mist shrouds the cold waters; moonlight veils the sand."
 motto_fm_confucian_784:0 "Moored at night near the tavern by Qinhuai River"
 motto_fm_confucian_785:0 "The singing girls do not know the sorrow of a fallen state."
 motto_fm_confucian_786:0 "Across the river they still sing 'Flowers of the Rear Courtyard'."
 motto_fm_confucian_787:0 "Silver candles cast a cold glow upon the painted screen in autumn light."
 motto_fm_confucian_788:0 "With a small light silk fan, I chase the drifting fireflies."
 motto_fm_confucian_789:0 "On the palace steps, the night is cool as water."
 motto_fm_confucian_790:0 "Sitting and watching the Altair and Vega stars"
 motto_fm_confucian_791:0 "How lovely is the night of the third day of the ninth month!"
 motto_fm_confucian_792:0 "The dew resembles pearls; the moon looks like a bow."
 motto_fm_confucian_793:0 "A sliver of the setting sun spreads across the water."
 motto_fm_confucian_794:0 "Half the river shimmers in emerald green, half in crimson red."
 motto_fm_confucian_795:0 "A few peach blossoms bloom outside the bamboo."
 motto_fm_confucian_796:0 "The ducks are the first to know when the spring waters warm up."
 motto_fm_confucian_797:0 "Mugwort covers the ground; the reed shoots are still short."
 motto_fm_confucian_798:0 "This is precisely the time when pufferfish begin to swim upstream."
 motto_fm_confucian_799:0 "The young lotus just shows its pointed tip."
 motto_fm_confucian_800:0 "A dragonfly has already perched upon its tip."
 motto_fm_confucian_801:0 "Disciple's Code: The Sage's Instruction"
 motto_fm_confucian_802:0 "Filial piety and brotherly love come first; caution and trustworthiness come next."
 motto_fm_confucian_803:0 "Love the multitude with universal benevolence and be intimate with those who are virtuous."
 motto_fm_confucian_804:0 "If there is spare energy, then study literature."
 motto_fm_confucian_805:0 "Parents call; respond without delay."
 motto_fm_confucian_806:0 "Obey your parents' commands without laziness."
 motto_fm_confucian_807:0 "Parents' teachings must be listened to with respect."
 motto_fm_confucian_808:0 "Accept your parents' reproaches respectfully."
 motto_fm_confucian_809:0 "Warm in winter and cool in summer."
 motto_fm_confucian_810:0 "In the morning, one attends to their parents; in the evening, one ensures they are settled."
 motto_fm_confucian_811:0 "Departure must be reported; return must be face-to-face."
 motto_fm_confucian_812:0 "Keep regular habits and do not change your occupation lightly."
 motto_fm_confucian_813:0 "Even if the matter is small, do not act on your own authority."
 motto_fm_confucian_814:0 "If you act on your own, you will be deficient in the way of a son."
 motto_fm_confucian_815:0 "Even small items should not be kept privately."
 motto_fm_confucian_816:0 "If you secretly keep things for yourself, you hurt your parents' hearts."
 motto_fm_confucian_817:0 "What the elders favor, we shall prepare accordingly."
 motto_fm_confucian_818:0 "What the relatives detest, I will diligently remove."
 motto_fm_confucian_819:0 "Injury to one's body brings worry to one's parents."
 motto_fm_confucian_820:0 "Virtue marred brings shame to one's parents."
 motto_fm_confucian_821:0 "If my parents love me, how hard can filial devotion be?"
 motto_fm_confucian_822:0 "If my parents dislike me, filial devotion is all the more worthy."
 motto_fm_confucian_823:0 "When a relative commits an offense, offer remonstrance to induce them to change."
 motto_fm_confucian_824:0 "Cheer my countenance, soften my voice."
 motto_fm_confucian_825:0 "If advice is not accepted, offer it again when they are in better spirits."
 motto_fm_confucian_826:0 "Plead with tears; even if beaten, bear no resentment."
 motto_fm_confucian_827:0 "Relatives with illness must have medicine tasted first."
 motto_fm_confucian_828:0 "Attend at their bedside day and night without leaving."
 motto_fm_confucian_829:0 "Mourned for three years, always sorrowful and weeping"
 motto_fm_confucian_830:0 "Change your living arrangements and abstain from wine and meat."
 motto_fm_confucian_831:0 "Observe funeral rites fully, and make offerings with sincerity."
 motto_fm_confucian_832:0 "Treat the deceased as if they were still alive."
 motto_fm_confucian_833:0 "Brothers should be kind to one another; younger brothers should show respect to their elders."
 motto_fm_confucian_834:0 "Brothers in harmony find filial piety within."
 motto_fm_confucian_835:0 "When wealth is valued lightly, what cause for resentment arises?"
 motto_fm_confucian_836:0 "Restrain your speech, and anger will fade away."
 motto_fm_confucian_837:0 "Some are eating and drinking; others are sitting or walking."
 motto_fm_confucian_838:0 "The elders go first; the juniors follow."
 motto_fm_confucian_839:0 "When an elder calls for someone, call that person on their behalf."
 motto_fm_confucian_840:0 "If that person is absent, go to the elder yourself."
 motto_fm_confucian_841:0 "Address elders by title, not by name."
 motto_fm_confucian_842:0 "Do not show off your abilities before elders or superiors."
 motto_fm_confucian_843:0 "When you meet an elder on the road, approach quickly and bow."
 motto_fm_confucian_844:0 "If the elder says nothing, step back and stand respectfully."
 motto_fm_confucian_845:0 "Dismount from your horse or step down from your carriage."
 motto_fm_confucian_846:0 "Wait until the elder has passed more than a hundred paces away."
 motto_fm_confucian_847:0 "When an elder stands, the young should not sit."
 motto_fm_confucian_848:0 "When an elder sits, sit only when invited."
 motto_fm_confucian_849:0 "Lower your voice before elders."
 motto_fm_confucian_850:0 "Yet speaking too softly to be heard is also improper."
 motto_fm_confucian_851:0 "Advance with haste; retreat with delay."
 motto_fm_confucian_852:0 "When asked a question, stand to answer and keep your gaze steady."
 motto_fm_confucian_853:0 "Treat your elders with the same respect as you would treat your father."
 motto_fm_confucian_854:0 "Treat your brothers as you would treat your own elder brother."
 motto_fm_confucian_855:0 "Rise early in the morning, sleep late at night."
 motto_fm_confucian_856:0 "Old age comes easily; cherish this time."
 motto_fm_confucian_857:0 "In the morning, one must wash and rinse the mouth."
 motto_fm_confucian_858:0 "Clean hands immediately after relieving oneself."
 motto_fm_confucian_859:0 "The cap must be worn straight; the knot must be tied properly."
 motto_fm_confucian_860:0 "The socks and shoes are both tight."
 motto_fm_confucian_861:0 "Place crowns and robes in their designated positions."
 motto_fm_confucian_862:0 "Do not toss or drop things carelessly to avoid soiling them."
 motto_fm_confucian_863:0 "Clothing should be clean rather than ornate."
 motto_fm_confucian_864:0 "Dress according to your station and your family's means."
 motto_fm_confucian_865:0 "Do not be picky about food and drink."
 motto_fm_confucian_866:0 "Eat to your fill but do not overindulge."
 motto_fm_confucian_867:0 "Young in years, do not drink wine."
 motto_fm_confucian_868:0 "Drinking wine until drunk is the most ugly."
 motto_fm_confucian_869:0 "Walk with composure, stand upright and dignified."
 motto_fm_confucian_870:0 "Bows deeply with respectful courtesy"
 motto_fm_confucian_871:0 "Do not step on the threshold; do not lean with a limp."
 motto_fm_confucian_872:0 "Do not sit with legs spread wide, nor swing your thighs."
 motto_fm_confucian_873:0 "Open the curtain slowly without making a sound."
 motto_fm_confucian_874:0 "Make wide turns to avoid hitting corners."
 motto_fm_confucian_875:0 "Hold an empty vessel as if it were full."
 motto_fm_confucian_876:0 "Enter the empty room as if someone is there."
 motto_fm_confucian_877:0 "Do not rush; haste leads to many mistakes."
 motto_fm_confucian_878:0 "Do not fear difficult tasks or treat them carelessly."
 motto_fm_confucian_879:0 "Avoid noisy places entirely."
 motto_fm_confucian_880:0 "Do not inquire about evil or deviant matters."
 motto_fm_confucian_881:0 "Before entering, ask who is present."
 motto_fm_confucian_882:0 "The voice must be raised when entering the hall."
 motto_fm_confucian_883:0 "When someone asks who you are, answer with your name."
 motto_fm_confucian_884:0 "Saying only 'I' or 'me' does not make your identity clear."
 motto_fm_confucian_885:0 "Ask clearly before using another person's belongings."
 motto_fm_confucian_886:0 "If you do not inquire, it is considered theft."
 motto_fm_confucian_887:0 "Return another person's belongings promptly after borrowing them."
 motto_fm_confucian_888:0 "Thereafter, borrowing in urgent need is not difficult."
 motto_fm_confucian_889:0 "Always keep your words trustworthy as the first priority."
 motto_fm_confucian_890:0 "How can deceit and falsehood be tolerated?"
 motto_fm_confucian_891:0 "Fewer words are better than many."
 motto_fm_confucian_892:0 "Be true in this; do not be deceitful or cunning."
 motto_fm_confucian_893:0 "Deceitful words and filthy language"
 motto_fm_confucian_894:0 "Avoid the vulgarity of the marketplace."
 motto_fm_confucian_895:0 "Do not speak lightly unless you see the truth."
 motto_fm_confucian_896:0 "Do not lightly spread what is unknown."
 motto_fm_confucian_897:0 "Do not lightly promise what is not appropriate."
 motto_fm_confucian_898:0 "If one lightly makes promises, one will err in advancing or retreating."
 motto_fm_confucian_899:0 "Speak each word clearly and at an unhurried pace."
 motto_fm_confucian_900:0 "Do not rush; do not blur."
 motto_fm_confucian_901:0 "People gossip about this person's merits and that person's faults."
 motto_fm_confucian_902:0 "Mind your own business."
 motto_fm_confucian_903:0 "When encountering someone virtuous, reflect on how to emulate them."
 motto_fm_confucian_904:0 "Even if you fall far short, improve gradually."
 motto_fm_confucian_905:0 "When seeing others' faults, reflect inwardly on oneself."
 motto_fm_confucian_906:0 "If you share the fault, correct it; if not, guard against it."
 motto_fm_confucian_907:0 "Only virtue, learning, talent, and skills"
 motto_fm_confucian_908:0 "If you fall short of others, work to improve yourself."
 motto_fm_confucian_909:0 "Whether in clothing or food"
 motto_fm_confucian_910:0 "If your clothing or food falls short of others', do not be distressed."
 motto_fm_confucian_911:0 "Anger at criticism, delight in praise."
 motto_fm_confucian_912:0 "Harmful friends will come, and helpful friends will withdraw."
 motto_fm_confucian_913:0 "Hear praise with fear, hear criticism with joy."
 motto_fm_confucian_914:0 "The upright and honest scholar gradually grows closer in friendship."
 motto_fm_confucian_915:0 "Unintentional mistakes are called errors."
 motto_fm_confucian_916:0 "Deliberate wrongdoing is called evil."
 motto_fm_confucian_917:0 "Errors can be corrected and return to nothingness."
 motto_fm_confucian_918:0 "If you conceal a fault, you add another offense."
 motto_fm_confucian_919:0 "All people must be loved."
 motto_fm_confucian_920:0 "Heaven covers, Earth bears."
 motto_fm_confucian_921:0 "Those whose conduct is noble naturally earn a good name."
 motto_fm_confucian_922:0 "What people value is not outward appearance."
 motto_fm_confucian_923:0 "Those of great ability naturally earn high esteem."
 motto_fm_confucian_924:0 "People's respect is not won by boastful words."
 motto_fm_confucian_925:0 "Those who possess ability should not hoard it for themselves."
 motto_fm_confucian_926:0 "Do not belittle other people's abilities."
 motto_fm_confucian_927:0 "Do not flatter the wealthy; do not despise the poor."
 motto_fm_confucian_928:0 "Do not tire of the old nor delight in the new."
 motto_fm_confucian_929:0 "Do not disturb someone who is busy."
 motto_fm_confucian_930:0 "Do not disturb those who are uneasy."
