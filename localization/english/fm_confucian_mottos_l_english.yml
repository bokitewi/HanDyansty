 motto_fm_confucian_627:0 "The bright moon rises from the Tianshan Mountains amidst the vast sea of clouds."
 motto_fm_confucian_628:0 "The long wind blows across ten thousand li to pass the Yumen Pass."
 motto_fm_confucian_629:0 "The moon of Qin, the pass of Han"
 motto_fm_confucian_630:0 "Ten thousand li of the long march, yet no one has returned."
 motto_fm_confucian_631:0 "But if the Flying General of Longcheng were still there,"
 motto_fm_confucian_632:0 "Do not let the Hu cavalry cross Yin Mountain."
 motto_fm_confucian_633:0 "The Yellow River flows far away among the white clouds."
 motto_fm_confucian_634:0 "A lone city stands before ten thousand fathoms of mountains."
 motto_fm_confucian_635:0 "Why need the Qiang flute to complain of the willows?"
 motto_fm_confucian_636:0 "The spring breeze does not cross the Yumen Pass."
 motto_fm_confucian_637:0 "Fine grape wine fills luminous cups."
 motto_fm_confucian_638:0 "As we are about to drink, the pipa sounds urgently from horseback."
 motto_fm_confucian_639:0 "Drunk upon the battlefield, do not mock me."
 motto_fm_confucian_640:0 "How many return from the wars since ancient times?"
 motto_fm_confucian_641:0 "Long clouds over Qinghai darken the snowy mountains."
 motto_fm_confucian_642:0 "A lone city gazes afar at Yumen Pass"
 motto_fm_confucian_643:0 "Yellow sand and a hundred battles wear through golden armor"
 motto_fm_confucian_644:0 "We shall not return until Loulan is conquered."
 motto_fm_confucian_645:0 "I urge you to finish one more cup of wine."
 motto_fm_confucian_646:0 "No old friends west of the Yang Pass"
 motto_fm_confucian_647:0 "The morning rain in Weicheng dampens the light dust."
 motto_fm_confucian_648:0 "The guesthouse is green with fresh willow hues."
 motto_fm_confucian_649:0 "The sea-born sun rises as the night wanes; the river's spring enters the old year."
 motto_fm_confucian_650:0 "Where can I send my letter home? Returning geese head toward Luoyang."
 motto_fm_confucian_651:0 "The tide is level, the two banks are wide; the wind is right, a single sail hangs suspended."
 motto_fm_confucian_652:0 "Thousand sails pass by beside the sunken boat."
 motto_fm_confucian_653:0 "Before the sick tree, ten thousand trees bloom in spring."
 motto_fm_confucian_654:0 "The swallows of old times before the halls of Wang and Xie"
 motto_fm_confucian_655:0 "Fly into the homes of ordinary people"
 motto_fm_confucian_656:0 "Wildflowers bloom by the Vermilion Bird Bridge."
 motto_fm_confucian_657:0 "The setting sun slants over the entrance to Wuyi Lane."
 motto_fm_confucian_658:0 "Mountains rise in layers, waters repeat their course; one doubts there is a path ahead."
 motto_fm_confucian_659:0 "Willow shadows give way to bright flowers, revealing another village ahead."
 motto_fm_confucian_660:0 "Fear not that the road ahead lacks a soulmate."
 motto_fm_confucian_661:0 "Who in the world does not know you?"
 motto_fm_confucian_662:0 "A thousand li of yellow clouds dim the white sun"
 motto_fm_confucian_663:0 "The north wind blows, geese fly south, snow falls in flakes."
 motto_fm_confucian_664:0 "The water of Taohua Pool is a thousand chi deep."
 motto_fm_confucian_665:0 "Yet it is not as deep as Wang Lun's affection as he sees me off."
 motto_fm_confucian_666:0 "The lone sail's distant shadow vanishes against the azure sky."
 motto_fm_confucian_667:0 "I see only the Yangtze flowing toward the horizon."
 motto_fm_confucian_668:0 "An old friend bids farewell to the Yellow Crane Tower in the west"
 motto_fm_confucian_669:0 "In the flowery haze of the third month, he journeys down to Yangzhou."
 motto_fm_confucian_670:0 "Farewell to the White Emperor City amidst the colorful clouds"
 motto_fm_confucian_671:0 "Return to Jiangling a thousand li in one day"
 motto_fm_confucian_672:0 "The cries of the monkeys on both banks do not cease."
 motto_fm_confucian_673:0 "The light boat has already passed ten thousand mountains."
 motto_fm_confucian_674:0 "Sunlight strikes Incense Burner Peak, raising purple mist."
 motto_fm_confucian_675:0 "From afar I see the waterfall hanging before the river."
 motto_fm_confucian_676:0 "Flying water rushes down three thousand feet"
 motto_fm_confucian_677:0 "It seems the Milky Way has fallen from the nine heavens."
 motto_fm_confucian_678:0 "Alone in a foreign land, I am a stranger here."
 motto_fm_confucian_679:0 "On every festive occasion, I miss my family even more."
 motto_fm_confucian_680:0 "From afar I know my brothers climb the high ground"
 motto_fm_confucian_681:0 "Each wears a sprig of dogwood, yet one person is missing."
 motto_fm_confucian_682:0 "The empty mountains are fresh after the rain; evening brings the autumn air."
 motto_fm_confucian_683:0 "The bright moon shines among the pines; clear springs flow over the stones."
 motto_fm_confucian_684:0 "Bamboo rustles as the laundry girls return; lotus blooms stir beneath the fishing boat."
 motto_fm_confucian_685:0 "The spring fragrance fades at will; the young noble may remain here."
 motto_fm_confucian_686:0 "When the journey reaches the end of the water, sit and watch the clouds rise."
 motto_fm_confucian_687:0 "The desert's dust and wind darken the sunlight."
 motto_fm_confucian_688:0 "Red flags half-rolled out from the gate"
 motto_fm_confucian_689:0 "The vanguard fought at night north of the Tao River."
 motto_fm_confucian_690:0 "Reported as having captured the Tuyuhun alive"
 motto_fm_confucian_691:0 "The moon sets, the crows cry, and frost fills the sky."
 motto_fm_confucian_692:0 "River maples and fishing lights face my troubled sleep."
 motto_fm_confucian_693:0 "Outside the City of Gusu, the Temple of Cold Mountain"
 motto_fm_confucian_694:0 "Midnight bell sounds reach the guest boat"
 motto_fm_confucian_695:0 "The spring river's tide connects with the sea in levelness."
 motto_fm_confucian_696:0 "The bright moon rises with the tide upon the sea."
 motto_fm_confucian_697:0 "By the riverbank, who first gazed upon the moon?"
 motto_fm_confucian_698:0 "When did the river moon first shine upon people?"
 motto_fm_confucian_699:0 "Who knows what person the river moon awaits?"
 motto_fm_confucian_700:0 "Only the Yangtze River sends forth its flowing waters."
 motto_fm_confucian_701:0 "The sunset glow and a lone wild duck fly together."
 motto_fm_confucian_702:0 "The autumn waters share the same hue as the vast sky."
 motto_fm_confucian_703:0 "Though old, I grow stronger; how could my heart change with white hair?"
 motto_fm_confucian_704:0 "Though poor, one becomes even more resolute in not abandoning the ambition to reach the lofty heights of the blue sky."
 motto_fm_confucian_705:0 "Worry before the world worries"
 motto_fm_confucian_706:0 "Enjoy the happiness of the world after others have done so."
 motto_fm_confucian_707:0 "Not elated by external gains nor saddened by personal losses."
 motto_fm_confucian_708:0 "Heaven and earth possess a righteous spirit, which is bestowed upon all forms in a mingled manner."
 motto_fm_confucian_709:0 "Who in history has not died since the beginning of life?"
 motto_fm_confucian_710:0 "Keep a loyal heart to shine upon the annals of history."
 motto_fm_confucian_711:0 "Fear not the floating clouds that obscure one's view."
 motto_fm_confucian_712:0 "Standing at the highest level, one sees from a unique vantage point."
 motto_fm_confucian_713:0 "Ask how it can be so clear."
 motto_fm_confucian_714:0 "Because fresh water flows in from its source."
 motto_fm_confucian_715:0 "What is gained from books is always shallow."
 motto_fm_confucian_716:0 "Only by practicing can one truly know."
 motto_fm_confucian_717:0 "A sword's keen edge comes from honing."
 motto_fm_confucian_718:0 "The fragrance of the plum blossom comes from enduring bitter cold."
 motto_fm_confucian_719:0 "The time will come when we shall ride the wind and break the waves."
 motto_fm_confucian_720:0 "Directly hoist the cloud-sail to cross the vast sea."
 motto_fm_confucian_721:0 "Heaven has created me with a purpose; I shall surely find my use."
 motto_fm_confucian_722:0 "A thousand pieces of gold scattered away will return again."
 motto_fm_confucian_723:0 "Draw the sword to sever the water, yet the water flows even more."
 motto_fm_confucian_724:0 "Raising a cup to dispel sorrow only deepens the sorrow."
 motto_fm_confucian_725:0 "Seize the day while you're at your peak of success."
 motto_fm_confucian_726:0 "Let not the golden cup stand empty before the moon."
