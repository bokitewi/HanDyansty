 motto_fm_confucian_1494:0 "Three cups reveal the Great Dao"
 motto_fm_confucian_1495:0 "One drink to wash away a thousand sorrows"
 motto_fm_confucian_1496:0 "Deep mountains ultimately hide fierce tigers."
