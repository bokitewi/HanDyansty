 motto_fm_confucian_1095:0 "King Wu of Zhou first slew the tyrant Zhou"
 motto_fm_confucian_1096:0 "Eight hundred years, the longest of all"
 motto_fm_confucian_1097:0 "Zhou moved east and the royal rule declined"
 motto_fm_confucian_1098:0 "Wars were waged and wandering counsel prized"
 motto_fm_confucian_1099:0 "The Spring and Autumn began, the Warring States ended"
 motto_fm_confucian_1100:0 "Five hegemons rose and seven powers emerged"
