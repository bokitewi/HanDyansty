 motto_fm_confucian_1837:0 "Do not be greedy for food and indulge in wantonly killing living creatures."
 motto_fm_confucian_1838:0 "Oddity and self-righteousness lead to many regrets and mistakes."
 motto_fm_confucian_1839:0 "Indolence leads to ruin; the family path cannot be achieved."
 motto_fm_confucian_1840:0 "Familiarity with scoundrels will inevitably bring you trouble in the long run."
 motto_fm_confucian_1841:0 "Defer to mature, experienced people, and you can rely on them in a crisis."
 motto_fm_confucian_1842:0 "If you readily believe a report, how do you know it is not slander?"
 motto_fm_confucian_1843:0 "You should be patient and think it over three times."
 motto_fm_confucian_1844:0 "Disputes arising from specific matters—how can one know it is not my own fault?"
 motto_fm_confucian_1845:0 "Take a moment to calm your mind and reflect quietly."
 motto_fm_confucian_1846:0 "Bestow kindness without thought; never forget the grace received."
 motto_fm_confucian_1847:0 "Leave room for everything."
 motto_fm_confucian_1848:0 "Pride should not be carried too far."
 motto_fm_confucian_1849:0 "When someone experiences joyous occasions, one should not harbor feelings of jealousy."
 motto_fm_confucian_1850:0 "When misfortune befalls a person, one must not harbor feelings of joy or complacency."
 motto_fm_confucian_1851:0 "True goodness is not sought to be seen by others."
 motto_fm_confucian_1852:0 "Evil that one fears others will discover is grave evil indeed."
 motto_fm_confucian_1853:0 "Seeing beauty arouses lustful thoughts; retribution falls upon one's wife and daughters."
 motto_fm_confucian_1854:0 "Hide resentment and strike with a hidden arrow, bringing disaster upon one's descendants."
 motto_fm_confucian_1855:0 "A harmonious family brings joy even when food is scarce."
 motto_fm_confucian_1856:0 "Once the national tax is paid early, one's pockets are empty, yet one finds true joy in this state of contentment."
 motto_fm_confucian_1857:0 "Reading aims at sages and worthies."
 motto_fm_confucian_1858:0 "Serve the state with loyalty to the ruler"
 motto_fm_confucian_1859:0 "Accept one's fate, abide by one's station, follow the times, and listen to heaven."
 motto_fm_confucian_1860:0 "If one's character is thus, then one is nearly there."
 motto_fm_confucian_1861:0 "Convenience for others brings convenience for oneself."
 motto_fm_confucian_1862:0 "In dealing well with others, remain respectful even after long acquaintance."
 motto_fm_confucian_1863:0 "When people are poor, their ambitions shrink; when horses are thin, their manes grow long."
 motto_fm_confucian_1864:0 "Admonition benefits both sides; slander harms them both."
 motto_fm_confucian_1865:0 "Praise brings blessings; forming thoughts brings evil."
 motto_fm_confucian_1866:0 "A family that accumulates good deeds will inevitably have blessings left over."
 motto_fm_confucian_1867:0 "A house that has accumulated evil will inevitably be left with lingering calamity."
 motto_fm_confucian_1868:0 "Do not quarrel over trifles; every day the sun sets in the west."
 motto_fm_confucian_1869:0 "Ill-gotten gains are easily lost."
 motto_fm_confucian_1870:0 "In honor, remember disgrace; in safety, remember danger."
 motto_fm_confucian_1871:0 "Lamb may be delicious, but it is hard to please everyone's taste."
 motto_fm_confucian_1872:0 "Consider matters thrice to avoid toil and regret."
 motto_fm_confucian_1873:0 "When the crown prince enters school, the same rules apply as to commoners."
 motto_fm_confucian_1874:0 "Reaching the First Rank, All Laws Follow the Code"
 motto_fm_confucian_1875:0 "Gain it with foundation, lose it without foundation."
 motto_fm_confucian_1876:0 "Accumulate virtue through sincerity in all things to enrich oneself."
 motto_fm_confucian_1877:0 "To accept a salary without merit brings unease in sleep and food."
 motto_fm_confucian_1878:0 "Wealthy, bold, and powerful enough to bully others."
 motto_fm_confucian_1879:0 "Too many words lead to mistakes; too much food harms the heart."
 motto_fm_confucian_1880:0 "Give friends wine; eat three meals a day."
 motto_fm_confucian_1881:0 "Drink less wine, know more affairs."
 motto_fm_confucian_1882:0 "Quarreling and bringing lawsuits have no benefit."
 motto_fm_confucian_1883:0 "Courtesy bestowed upon others must have some request behind it."
 motto_fm_confucian_1884:0 "Choose your neighbors wisely; befriend only good companions."
 motto_fm_confucian_1885:0 "Those who follow heaven shall survive; those who defy it shall perish."
 motto_fm_confucian_1886:0 "Men die for wealth; birds perish for food."
 motto_fm_confucian_1887:0 "Receive a cow from someone, and repay them with a horse."
 motto_fm_confucian_1888:0 "Honesty endures; deceit repeatedly fails."
 motto_fm_confucian_1889:0 "Mount Tai does not reject even the smallest speck of dust."
 motto_fm_confucian_1890:0 "Accumulate small piles to build great heights."
 motto_fm_confucian_1891:0 "Accumulating millions of wealth is not as valuable as possessing a modest skill."
 motto_fm_confucian_1892:0 "Among the skills that are easy to learn yet highly valuable, none surpasses reading books."
 motto_fm_confucian_1893:0 "In our youth, we possessed a sharp mind and keen spirit."
 motto_fm_confucian_1894:0 "Once grown, he becomes scattered in thought and carefree."
 motto_fm_confucian_1895:0 "Indeed, early education is essential; do not miss the opportunity."
 motto_fm_confucian_1896:0 "Those who study from a young age are like the light of the rising sun."
 motto_fm_confucian_1897:0 "Old age in learning is like carrying a candle to walk at night."
 motto_fm_confucian_1898:0 "Yet this is better than closing one's eyes and seeing nothing."
 motto_fm_confucian_1899:0 "Being in the company of good people is like entering a room filled with orchids and calamus."
 motto_fm_confucian_1900:0 "And so, one's virtue will naturally become fragrant over time."
 motto_fm_confucian_1901:0 "Associating with evil people is like entering a shop filled with salted fish."
 motto_fm_confucian_1902:0 "In time, you too take on the foul smell."
 motto_fm_confucian_1903:0 "At night, recognize the morning's errors; today, regret yesterday's mistakes."
 motto_fm_confucian_1904:0 "Do not rashly pass judgment on the affairs of the world until you have thoroughly read all the books under heaven."
 motto_fm_confucian_1905:0 "What is learned in study can be applied everywhere without fail."
 motto_fm_confucian_1906:0 "Scholars study to seek improvement."
 motto_fm_confucian_1907:0 "Some people read a few dozen volumes and immediately think themselves superior."
 motto_fm_confucian_1908:0 "They belittle their elders and treat their peers with contempt."
 motto_fm_confucian_1909:0 "People regard them as their mortal enemies."
 motto_fm_confucian_1910:0 "Hate them like owls and hawks."
 motto_fm_confucian_1911:0 "Thus, one harms oneself through learning."
 motto_fm_confucian_1912:0 "Better to have no learning at all."
 motto_fm_confucian_1913:0 "The influence of moral cultivation flows from above to below."
 motto_fm_confucian_1914:0 "Therefore, if the father is not kind, the son will not be filial."
 motto_fm_confucian_1915:0 "If the elder brother is not friendly, the younger brother will not be respectful."
 motto_fm_confucian_1916:0 "If the husband is not righteous, the wife will not be compliant."
 motto_fm_confucian_1917:0 "The father is kind but the son rebellious; the elder brother is friendly but the younger brother arrogant."
 motto_fm_confucian_1918:0 "The husband is righteous, yet the wife is overbearing."
 motto_fm_confucian_1919:0 "Those who are rebellious against heaven shall be restrained by punishment and execution."
 motto_fm_confucian_1920:0 "In life, one must have a career."
 motto_fm_confucian_1921:0 "Establish the heart of heaven and earth"
 motto_fm_confucian_1922:0 "Establish the destiny of the people"
 motto_fm_confucian_1923:0 "Carry on the learning of past sages"
 motto_fm_confucian_1924:0 "Open up a peaceful world for future generations"
 motto_fm_confucian_1925:0 "Unity of Knowledge and Action"
 motto_fm_confucian_1926:0 "Realize one's innate moral knowledge."
 motto_fm_confucian_1927:0 "The mind is principle itself."
 motto_fm_confucian_1928:0 "It is easy to defeat the bandits in the mountains, but difficult to conquer the bandits within one's heart."
 motto_fm_confucian_1929:0 "With this heart enlightened, what more need be said?"
 motto_fm_confucian_1930:0 "Youth fades quickly; learning is hard to master."
 motto_fm_confucian_1931:0 "Not an inch of time should be taken lightly."
 motto_fm_confucian_1932:0 "Unaware of the dream of spring grass in the pond"
 motto_fm_confucian_1933:0 "Before the steps, wu leaves already bear the sound of autumn."
 motto_fm_confucian_1934:0 "A half-mu square pond opens like a mirror"
 motto_fm_confucian_1935:0 "Skylight and cloud shadows wander together."
 motto_fm_confucian_1936:0 "Growing out of the mud yet unstained by it"
 motto_fm_confucian_1937:0 "Washed by clear ripples yet not vain."
 motto_fm_confucian_1938:0 "Hollow within and straight without, with neither tendrils nor branches."
 motto_fm_confucian_1939:0 "The fragrance spreads far and grows clearer; the lotus stands tall and pure, rooted firmly in the water."
 motto_fm_confucian_1940:0 "It may be admired from afar but not trifled with."
 motto_fm_confucian_1941:0 "Who loves the lotus as I do?"
 motto_fm_confucian_1942:0 "Cultivation requires reverence."
 motto_fm_confucian_1943:0 "Advancement in learning lies in acquiring knowledge."
 motto_fm_confucian_1944:0 "Preserve Heavenly Principle and Exterminate Human Desire"
 motto_fm_confucian_1945:0 "Investigate things to extend knowledge; be sincere in one's intentions and correct one's heart."
 motto_fm_confucian_1946:0 "Study diligently to grasp the principles of things."
 motto_fm_confucian_1947:0 "Quietness cultivates the self; frugality nurtures virtue."
 motto_fm_confucian_1948:0 "Simplicity clarifies one's aspirations; tranquility enables far-reaching vision."
 motto_fm_confucian_1949:0 "Serve with utmost dedication until death comes as the end."
 motto_fm_confucian_1950:0 "One's ambition should be lofty and far-reaching."
 motto_fm_confucian_1951:0 "The resolute and benevolent never seek life at the expense of benevolence."
 motto_fm_confucian_1952:0 "They may give their lives to fulfill benevolence."
 motto_fm_confucian_1953:0 "Those who follow different paths cannot plot together."
 motto_fm_confucian_1954:0 "Three friends who benefit; three friends who harm."
 motto_fm_confucian_1955:0 "A friend who is upright, trustworthy, and knowledgeable is beneficial."
 motto_fm_confucian_1956:0 "Friends who flatter, feign friendliness, or speak glibly are harmful."
 motto_fm_confucian_1957:0 "The gentleman has three things to guard against."
 motto_fm_confucian_1958:0 "In my youth, my blood and qi were not yet settled; I was warned to guard against lust."
 motto_fm_confucian_1959:0 "When he reaches maturity, his blood and qi are at their peak; beware of fighting."
 motto_fm_confucian_1960:0 "When one grows old, the vital energy wanes; beware of greed."
 motto_fm_confucian_1961:0 "The gentleman has three fears"
 motto_fm_confucian_1962:0 "Stand in awe of Heaven's mandate and of great men."
 motto_fm_confucian_1963:0 "Fear the words of the sages"
 motto_fm_confucian_1964:0 "Those who are born with knowledge are the highest."
 motto_fm_confucian_1965:0 "Those who learn and then know are second in rank."
 motto_fm_confucian_1966:0 "Learning in times of adversity is the next best thing."
 motto_fm_confucian_1967:0 "He who is in distress yet refuses to learn is the lowest of the people."
 motto_fm_confucian_1968:0 "A gentleman has nine things to consider."
 motto_fm_confucian_1969:0 "Look to see clearly; listen to hear acutely."
 motto_fm_confucian_1970:0 "Consider warmth in your expression and respect in your bearing."
 motto_fm_confucian_1971:0 "Speak with loyalty; act with reverence."
 motto_fm_confucian_1972:0 "When in doubt, think of asking; when angry, consider the trouble it may cause."
 motto_fm_confucian_1973:0 "When you see a gain to be had, consider what is right."
 motto_fm_confucian_1974:0 "Flattering words corrupt virtue."
 motto_fm_confucian_1975:0 "Education without distinction"
 motto_fm_confucian_1976:0 "Flattery is rarely a sign of true benevolence."
 motto_fm_confucian_1977:0 "The gentleman laments his own lack of ability."
 motto_fm_confucian_1978:0 "He does not worry that others fail to recognize him."
 motto_fm_confucian_1979:0 "A gentleman does not promote someone on words alone."
 motto_fm_confucian_1980:0 "Do not discard a statement because of the speaker."
 motto_fm_confucian_1981:0 "Fail to speak to someone worth addressing, and you lose that person."
 motto_fm_confucian_1982:0 "One who cannot be spoken to should not be addressed; if one speaks to them, it is a lost word."
 motto_fm_confucian_1983:0 "The wise neither miss a person nor miss a word."
 motto_fm_confucian_1984:0 "The benevolent have no rivals."
 motto_fm_confucian_1985:0 "To trust the book too much is worse than having no book at all."
 motto_fm_confucian_1986:0 "One who lacks compassion is not truly human."
 motto_fm_confucian_1987:0 "One who lacks a sense of shame and moral repugnance is not truly human."
 motto_fm_confucian_1988:0 "One who lacks a heart of humility is not truly human."
 motto_fm_confucian_1989:0 "One who lacks a sense of right and wrong is not truly human."
 motto_fm_confucian_1990:0 "There is no better way to cultivate the heart than by reducing one's desires."
 motto_fm_confucian_1991:0 "A man cannot be shameless."
 motto_fm_confucian_1992:0 "Be ashamed of shamelessness, and you will no longer be shameless."
 motto_fm_confucian_1993:0 "Shame is of great importance to people."
 motto_fm_confucian_1994:0 "If you feel no shame at being inferior to others,"
 motto_fm_confucian_1995:0 "How could one ever be as good as others?"
 motto_fm_confucian_1996:0 "Ancient wise kings cherished virtue while forgetting their status."
 motto_fm_confucian_1997:0 "Follow one's own path and forget the power of others."
 motto_fm_confucian_1998:0 "Thus, unless kings and nobles show full respect and courtesy,"
 motto_fm_confucian_1999:0 "Then he could not see him frequently."
 motto_fm_confucian_2000:0 "How much less could they make him their subject?"
