l_english:
 motto_confucian_motto:0 "$1$"

 # 大学
 motto_fm_confucian_001:0 "The way of the great learning lies in manifesting one's illustrious virtue."
 motto_fm_confucian_002:0 "To be near the people and to rest in supreme goodness."
 motto_fm_confucian_003:0 "Know when to stop, and then you will have stability."
 motto_fm_confucian_004:0 "Establish order before achieving tranquility."
 motto_fm_confucian_005:0 "After quietness comes tranquility."
 motto_fm_confucian_006:0 "Only after establishing security can one consider strategy."
 motto_fm_confucian_007:0 "Consider before you can achieve."
 motto_fm_confucian_008:0 "Things have their roots and ends; affairs have their beginnings and conclusions."
 motto_fm_confucian_009:0 "Knowing the order of things brings one closer to the Dao."
 motto_fm_confucian_010:0 "Those of old who wished to manifest virtue throughout the world"
 motto_fm_confucian_011:0 "First govern your state"
 motto_fm_confucian_012:0 "He who would govern his state must first regulate his family."
 motto_fm_confucian_013:0 "He who wishes to regulate his family must first cultivate himself."
 motto_fm_confucian_014:0 "He who would cultivate his character must first rectify his heart."
 motto_fm_confucian_015:0 "To rectify one's heart, first make one's intentions sincere."
 motto_fm_confucian_016:0 "To make one's intentions sincere, first cultivate one's knowledge."
 motto_fm_confucian_017:0 "Knowledge is attained through the investigation of things."
 motto_fm_confucian_018:0 "When things are fully understood, knowledge reaches its utmost."
 motto_fm_confucian_019:0 "Knowing the utmost leads to sincerity of mind."
 motto_fm_confucian_020:0 "Sincerity of intent leads to rectitude of heart."
 motto_fm_confucian_021:0 "When the heart is upright, the self is cultivated."
 motto_fm_confucian_022:0 "Cultivate yourself first, then bring your family into order."
 motto_fm_confucian_023:0 "When the family is in order, the state will be governed well."
 motto_fm_confucian_024:0 "When the state is well-governed, then the world will be at peace."
 motto_fm_confucian_025:0 "From the Son of Heaven down to the common people"
 motto_fm_confucian_026:0 "The first is to cultivate oneself as the foundation."
 motto_fm_confucian_027:0 "If one can renew oneself today, one can renew oneself every day, and continue to renew oneself day after day."
 motto_fm_confucian_028:0 "As if cut, as if polished, as if carved, as if ground."
 motto_fm_confucian_029:0 "Mind absent, eyes blind to what is seen"
 motto_fm_confucian_030:0 "When one family is benevolent, the whole nation flourishes in benevolence."

 # 中庸
 motto_fm_confucian_031:0 "Nature is called the Mandate of Heaven; following nature is called the Way."
 motto_fm_confucian_032:0 "Cultivating the Dao is called education."
 motto_fm_confucian_033:0 "The Dao cannot be separated from us even for a moment."
 motto_fm_confucian_034:0 "Joy, anger, sorrow, and happiness before they are expressed is called Zhong."
 motto_fm_confucian_035:0 "When actions are initiated and all fall within the proper measure, this is called harmony."
 motto_fm_confucian_036:0 "The Center is the fundamental root of the world."
 motto_fm_confucian_037:0 "Harmony is the universal way of the world."
 motto_fm_confucian_038:0 "Achieve harmony, and heaven and earth will find their proper places."
 motto_fm_confucian_039:0 "All things are nurtured therein."
 motto_fm_confucian_040:0 "The gentleman follows the Doctrine of the Mean; the petty man deviates from it."
 motto_fm_confucian_041:0 "The gentleman embodies the Doctrine of the Mean; he is a gentleman who maintains proper conduct at all times."
 motto_fm_confucian_042:0 "The gentleman is harmonious yet does not drift with the times."
 motto_fm_confucian_043:0 "Neutral without leaning"
 motto_fm_confucian_044:0 "The gentleman acts according to his position."
 motto_fm_confucian_045:0 "Unwilling to look beyond its borders"
 motto_fm_confucian_046:0 "The superior is not blamed by the world, nor does he blame others."
 motto_fm_confucian_047:0 "The gentleman abides in ease and awaits his destiny."
 motto_fm_confucian_048:0 "The petty man takes risks in the hope of good fortune."
 motto_fm_confucian_049:0 "Shooting resembles the conduct of a gentleman."
 motto_fm_confucian_050:0 "Missing the target, one looks to oneself for the cause."
 motto_fm_confucian_051:0 "The way of the gentleman is like traveling a long distance; one must begin by starting near at hand."
 motto_fm_confucian_052:0 "Be extensive in learning; be critical in questioning."
 motto_fm_confucian_053:0 "Think carefully, distinguish clearly, and act with determination."
 motto_fm_confucian_054:0 "If one can do it, I will try a hundred times."
 motto_fm_confucian_055:0 "Ten people can achieve what one thousand cannot."
 motto_fm_confucian_056:0 "If this path can be followed"
 motto_fm_confucian_057:0 "Though foolish, one shall become wise; though soft, one shall become strong."
 motto_fm_confucian_058:0 "Honesty is the Way of Heaven."
 motto_fm_confucian_059:0 "Sincerity is the way of man."
 motto_fm_confucian_060:0 "Honesty is achieved without effort."
 motto_fm_confucian_061:0 "Achieving the Dao effortlessly without conscious effort."
 motto_fm_confucian_062:0 "Sincerity is the beginning and end of all things."
 motto_fm_confucian_063:0 "Without sincerity, there is nothing."
 motto_fm_confucian_064:0 "Sincerity without cessation"
 motto_fm_confucian_065:0 "If one does not cease, longevity is achieved; if one persists, conquest follows."
 motto_fm_confucian_066:0 "When advancing, one reaches far; when retreating, one becomes vast and profound."
 motto_fm_confucian_067:0 "Baohou then Gaoming"
 motto_fm_confucian_068:0 "Bó hòu suǒ yǐ zài wù yě"
 motto_fm_confucian_069:0 "High wisdom is what covers all things."
 motto_fm_confucian_070:0 "Long duration is what gives rise to things."

 # 论语
 motto_fm_confucian_071:0 "Is it not joyous to learn and then practice what one has learned at proper times?"
 motto_fm_confucian_072:0 "Is it not joyful to have friends come from afar?"
 motto_fm_confucian_073:0 "Is it not the mark of a gentleman to be free from resentment when others are unaware of one's virtues?"
 motto_fm_confucian_074:0 "I examine myself three times a day."
 motto_fm_confucian_075:0 "Have I been unfaithful in planning for others?"
 motto_fm_confucian_076:0 "Do I deal with my friends in good faith?"
 motto_fm_confucian_077:0 "Do I practice what I have learned?"
 motto_fm_confucian_078:0 "In a state with a thousand chariots, govern with reverence and maintain trustworthiness."
 motto_fm_confucian_079:0 "Practice economy in spending and love the people; employ them at appropriate times."
 motto_fm_confucian_080:0 "A disciple should be filial at home and respectful to elders outside the home."
 motto_fm_confucian_081:0 "Be cautious and trustworthy; love the multitude and draw near to benevolence."
 motto_fm_confucian_082:0 "When there is surplus energy, then study literature."
 motto_fm_confucian_083:0 "A gentleman who lacks gravity will lack authority."
 motto_fm_confucian_084:0 "Learning prevents rigidity."
 motto_fm_confucian_085:0 "Loyalty, trustworthiness, and integrity; do not associate with those who are inferior to yourself."
 motto_fm_confucian_086:0 "If you err, do not fear to correct it."
 motto_fm_confucian_087:0 "Carefully conclude the final rites and honor the distant ancestors; then the people's virtue will return to its proper depth."
 motto_fm_confucian_088:0 "The value of ritual lies in harmony."
 motto_fm_confucian_089:0 "The way of the former kings is thus most excellent."
 motto_fm_confucian_090:0 "Know harmony but do not regulate it with propriety."
 motto_fm_confucian_091:0 "The gentleman does not seek satiety in his food nor comfort in his dwelling."
 motto_fm_confucian_092:0 "Quick in action but cautious in speech."
 motto_fm_confucian_093:0 "There is the Way to follow and to correct oneself accordingly."
 motto_fm_confucian_094:0 "Truly a model of diligence in learning."
 motto_fm_confucian_095:0 "Poor yet not obsequious; wealthy yet not arrogant."
 motto_fm_confucian_096:0 "Better to be poor yet content than rich but lacking in virtue; better to embrace wealth with joy than to reject it while neglecting propriety."
 motto_fm_confucian_097:0 "Do not worry that others do not understand you."
 motto_fm_confucian_098:0 "Suffering from not knowing people"
 motto_fm_confucian_099:0 "To govern with virtue is like the North Star."
 motto_fm_confucian_100:0 "Abide in your place, and the myriad stars will revolve around you."
 motto_fm_confucian_101:0 "The Book of Songs can be summarized in one sentence."
 motto_fm_confucian_102:0 "It is said that there is no malice in the thoughts."
 motto_fm_confucian_103:0 "At the age of fifteen, I set my heart on learning."
 motto_fm_confucian_104:0 "At thirty one establishes himself; at forty he is no longer confused."
 motto_fm_confucian_105:0 "At fifty, one knows the will of heaven."
 motto_fm_confucian_106:0 "At sixty, one's ears are attuned to harmony."
 motto_fm_confucian_107:0 "At seventy, one can follow their heart's desires without transgressing the rules."
 motto_fm_confucian_108:0 "Reviewing the past allows one to understand the new; thus, one can become a teacher."
 motto_fm_confucian_109:0 "Learning without thinking leads to confusion."
 motto_fm_confucian_110:0 "Thinking without learning leads to confusion."
 motto_fm_confucian_111:0 "Know what you know; admit what you do not know."
 motto_fm_confucian_112:0 "It is knowledge."
 motto_fm_confucian_113:0 "A man without trustworthiness is not to be known."
 motto_fm_confucian_114:0 "To see righteousness and fail to act is to lack courage."
 motto_fm_confucian_115:0 "Once a matter is accomplished, it should not be discussed; once a decision is made, it should not be remonstrated against."
 motto_fm_confucian_116:0 "No blame for past actions."
 motto_fm_confucian_117:0 "To learn the Way in the morning is enough; one may die in the evening."
 motto_fm_confucian_118:0 "The scholar who aspires to the Way yet feels ashamed of wearing coarse clothes or eating meager food"
 motto_fm_confucian_119:0 "The gentleman understands righteousness; the petty person understands profit."
 motto_fm_confucian_120:0 "See the virtuous and strive to equal them."
 motto_fm_confucian_121:0 "When one sees someone who is not virtuous, one should reflect inwardly on oneself."
 motto_fm_confucian_122:0 "Advise your parents gently when they are in error."
 motto_fm_confucian_123:0 "When parents are alive, do not travel far; if you must travel, have a clear purpose."
 motto_fm_confucian_124:0 "One must know the ages of one's parents."
 motto_fm_confucian_125:0 "A gentleman should be slow in speech but quick in action."
 motto_fm_confucian_126:0 "Virtue is never lonely; it always has neighbors."
 motto_fm_confucian_127:0 "Rotten wood cannot be carved."
 motto_fm_confucian_128:0 "Quick-witted and eager to learn, he does not disdain asking questions of those below him."
 motto_fm_confucian_129:0 "Think thrice before acting."
 motto_fm_confucian_130:0 "Lord Ning Wuzi: When the Way prevails, one displays wisdom."
 motto_fm_confucian_131:0 "Those who are wise can be reached; those who are foolish cannot be reached."
 motto_fm_confucian_132:0 "When substance outweighs culture, one becomes uncouth; when culture outweighs substance, one becomes pedantic."
 motto_fm_confucian_133:0 "Cultivate both substance and refinement; only then can one be a true gentleman."
 motto_fm_confucian_134:0 "Those who know it are not as good as those who love it."
 motto_fm_confucian_135:0 "Those who love it are not as good as those who enjoy it."
 motto_fm_confucian_136:0 "Those above the average can be spoken to about higher matters."
 motto_fm_confucian_137:0 "The wise find joy in water; the benevolent find joy in mountains."
 motto_fm_confucian_138:0 "The wise move; the benevolent remain still."
 motto_fm_confucian_139:0 "The wise find joy; the benevolent enjoy longevity."
 motto_fm_confucian_140:0 "One who wishes to establish himself must also help others establish themselves."
 motto_fm_confucian_141:0 "One who wishes to succeed should help others to succeed."
 motto_fm_confucian_142:0 "Learn silently without growing weary of study."
 motto_fm_confucian_143:0 "Why should I tire of teaching others?"
 motto_fm_confucian_144:0 "Do not startle the student until he is frustrated; do not inspire him until he is eager to speak."
 motto_fm_confucian_145:0 "If one corner is not understood, the other three will not be inferred."
 motto_fm_confucian_146:0 "Then it will no longer be so."
 motto_fm_confucian_147:0 "Use it to act; set it aside to hide."
 motto_fm_confucian_148:0 "If wealth can be sought, even a man who holds the reins of a horse-drawn carriage may pursue it."
 motto_fm_confucian_149:0 "So do I."
 motto_fm_confucian_150:0 "Eat coarse food and drink water."
 motto_fm_confucian_151:0 "Resting one's elbow to use it as a pillow."
 motto_fm_confucian_152:0 "Unjustly rich and noble"
 motto_fm_confucian_153:0 "To me like floating clouds"
 motto_fm_confucian_154:0 "Forget food in one's zeal to work; forget worries in one's joy."
 motto_fm_confucian_155:0 "I did not know that old age was approaching."
 motto_fm_confucian_156:0 "Among the three of us, there must be someone I can learn from."
 motto_fm_confucian_157:0 "Choose the good aspects of them to follow."
 motto_fm_confucian_158:0 "Imitate the good in others and correct their faults."
 motto_fm_confucian_159:0 "The gentleman is open and expansive; the petty person is always anxious and worried."
 motto_fm_confucian_160:0 "Respectfulness without propriety leads to exhaustion."
 motto_fm_confucian_161:0 "Cautiousness without propriety leads to timidity."
 motto_fm_confucian_162:0 "Courage without propriety leads to chaos."
 motto_fm_confucian_163:0 "Straightness without propriety leads to constriction."
 motto_fm_confucian_164:0 "A scholar cannot but be broad-minded and determined."
 motto_fm_confucian_165:0 "The task is arduous and the road long."
 motto_fm_confucian_166:0 "Is it not heavy to take benevolence as one's own responsibility?"
 motto_fm_confucian_167:0 "Is it not far to die before ceasing?"
 motto_fm_confucian_168:0 "Achieved through music, established by ritual, and originated from poetry."
 motto_fm_confucian_169:0 "Firmly believe in learning, uphold life with virtue, and persevere in the right path."
 motto_fm_confucian_170:0 "Do not meddle in affairs outside one's station."
 motto_fm_confucian_171:0 "Learning is like reaching out to something; one fears losing it even before attaining it."
 motto_fm_confucian_172:0 "Great indeed was Yao as a ruler!"
 motto_fm_confucian_173:0 "Vast indeed is only Heaven."
 motto_fm_confucian_174:0 "Time flows on like a river, day and night without ceasing."
 motto_fm_confucian_175:0 "The young are to be feared."
 motto_fm_confucian_176:0 "Who knows that the future may not be as good as the present?"
 motto_fm_confucian_177:0 "The commander of the three armies can be taken away."
 motto_fm_confucian_178:0 "Even a commoner's aspirations cannot be taken from him."
 motto_fm_confucian_179:0 "Only in the severest cold do we know that pines and cypresses are the last to shed their leaves."
 motto_fm_confucian_180:0 "The wise are not confused; the benevolent are not worried."
 motto_fm_confucian_181:0 "The valiant fear not."
 motto_fm_confucian_182:0 "Restrain oneself and return to ritual is benevolence."
 motto_fm_confucian_183:0 "One day of self-restraint and adherence to ritual"
 motto_fm_confucian_184:0 "The world returns to benevolence."
 motto_fm_confucian_185:0 "Do not look at what is improper; do not listen to what is improper."
 motto_fm_confucian_186:0 "Do not speak what is improper; do not act what is improper."
 motto_fm_confucian_187:0 "Do not do to others what you do not wish for yourself."
 motto_fm_confucian_188:0 "Life and death are determined by fate; wealth and status depend on heaven."
 motto_fm_confucian_189:0 "All within the four seas are brothers."
 motto_fm_confucian_190:0 "A gentleman helps others achieve their aspirations."
 motto_fm_confucian_191:0 "Not to commit evil deeds against others"
 motto_fm_confucian_192:0 "The virtue of the gentleman is like the wind; the virtue of the petty person is like grass."
 motto_fm_confucian_193:0 "The wind blowing over the grass must cause it to bow."
 motto_fm_confucian_194:0 "The gentleman gathers friends through literature."
 motto_fm_confucian_195:0 "Assist benevolence with friendship"
 motto_fm_confucian_196:0 "When the leader is upright, orders need not be given for actions to follow."
 motto_fm_confucian_197:0 "If one's conduct is not upright, orders will not be obeyed."
 motto_fm_confucian_198:0 "Haste makes waste."
 motto_fm_confucian_199:0 "Seeing small profits leads to the failure of great undertakings."
 motto_fm_confucian_200:0 "The gentleman harmonizes without being uniform."
 motto_fm_confucian_201:0 "The small people may be united in appearance but not in harmony."
 motto_fm_confucian_202:0 "The gentleman is serene but not arrogant."
 motto_fm_confucian_203:0 "The humble are arrogant but not haughty."
 motto_fm_confucian_204:0 "Steadfastness, simplicity, and reticence are close to benevolence."
 motto_fm_confucian_205:0 "When the state is well-governed, it is shameful to be poor and lowly."
 motto_fm_confucian_206:0 "In a state without righteousness, wealth and nobility are shameful."
 motto_fm_confucian_207:0 "When the state is in order, speak boldly and act uprightly."
 motto_fm_confucian_208:0 "When the state is in disorder, act cautiously and speak humbly."
 motto_fm_confucian_209:0 "Those with virtue must have words."
 motto_fm_confucian_210:0 "Those who speak need not possess virtue."
 motto_fm_confucian_211:0 "The benevolent must also be brave."
 motto_fm_confucian_212:0 "A hero need not possess benevolence."
 motto_fm_confucian_213:0 "It is difficult to be poor without resentment, but easy to be wealthy without arrogance."
 motto_fm_confucian_214:0 "A gentleman feels shame when his words exceed his actions."
 motto_fm_confucian_215:0 "A steed is praised not for its strength but for its virtue."
 motto_fm_confucian_216:0 "Respond to resentment with justice, repay kindness with virtue."
 motto_fm_confucian_217:0 "Blame neither heaven nor man."
 motto_fm_confucian_218:0 "Learn from below and reach above"
