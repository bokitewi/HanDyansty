 motto_fm_confucian_1450:0 "How many youths have perished?"
 motto_fm_confucian_1451:0 "They died before their hair turned white."
 motto_fm_confucian_1452:0 "There are cracks in the wall and ears in the partition."
 motto_fm_confucian_1453:0 "Good deeds rarely make it out the door."
 motto_fm_confucian_1454:0 "Evil deeds spread a thousand li."
 motto_fm_confucian_1455:0 "Bandits are petty men whose cunning surpasses that of gentlemen."
 motto_fm_confucian_1456:0 "A gentleman remains steadfast in poverty."
 motto_fm_confucian_1457:0 "The petty person becomes reckless when poor."
 motto_fm_confucian_1458:0 "Poverty brings freedom; wealth brings worry."
 motto_fm_confucian_1459:0 "You do not consider me a benefactor but rather an enemy."
 motto_fm_confucian_1460:0 "Better to take from the straight path"
 motto_fm_confucian_1461:0 "Never seek gain through crooked means."
 motto_fm_confucian_1462:0 "You refuse to set out while the weather is fine and dry."
 motto_fm_confucian_1463:0 "Wait until the rain soaks your head."
 motto_fm_confucian_1464:0 "Do not dwell on what is already done."
 motto_fm_confucian_1465:0 "Water poured out cannot be retrieved."
 motto_fm_confucian_1466:0 "Trouble often arises from speaking too much."
 motto_fm_confucian_1467:0 "All troubles stem from forcing oneself to stand out."
 motto_fm_confucian_1468:0 "Endure a moment's anger"
 motto_fm_confucian_1469:0 "To avoid a hundred days of worry"
 motto_fm_confucian_1470:0 "Recently learned the turtle method"
 motto_fm_confucian_1471:0 "When it's time to tuck your head in, do so."
 motto_fm_confucian_1472:0 "Fear the law to enjoy joy every day"
 motto_fm_confucian_1473:0 "Deceiving the public brings daily worry."
 motto_fm_confucian_1474:0 "A life for a person, a spring for grass."
 motto_fm_confucian_1475:0 "With black hair, one remains unaware of the need to study diligently early on."
 motto_fm_confucian_1476:0 "Before long, you are a white-haired old man."
 motto_fm_confucian_1477:0 "The moon's light wanes by the fifteenth day."
 motto_fm_confucian_1478:0 "By middle age, all things come to an end."
 motto_fm_confucian_1479:0 "Children and grandchildren have their own blessings."
 motto_fm_confucian_1480:0 "Do not become a beast of burden for your children and grandchildren."
 motto_fm_confucian_1481:0 "Life is rarely a hundred years."
