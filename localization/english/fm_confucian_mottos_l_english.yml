l_english:
 motto_confucian_motto:0 "$1$"

 # Great Learning
 motto_fm_confucian_001:0 "The way of great learning is bright virtue"
 motto_fm_confucian_002:0 "To renew the people, to rest in the highest good"
 motto_fm_confucian_003:0 "Knowing the stop, one is settled"
 motto_fm_confucian_004:0 "Settled, then calm"
 motto_fm_confucian_005:0 "Calm, then at peace"
 motto_fm_confucian_006:0 "At peace, then able to reflect"
 motto_fm_confucian_007:0 "Reflect, then able to attain"
 motto_fm_confucian_008:0 "Things have root and branch, affairs have end and start"
 motto_fm_confucian_009:0 "Know the order, near the Way"
 motto_fm_confucian_010:0 "The ancients who would brighten the world"
 motto_fm_confucian_011:0 "First ordered their state"
 motto_fm_confucian_012:0 "To order the state, first regulate the house"
 motto_fm_confucian_013:0 "To regulate the house, first cultivate the self"
 motto_fm_confucian_014:0 "To cultivate the self, first rectify the heart"
 motto_fm_confucian_015:0 "To rectify the heart, first make the will sincere"
 motto_fm_confucian_016:0 "To make the will sincere, first extend knowledge"
 motto_fm_confucian_017:0 "Extending knowledge lies in investigating things"
 motto_fm_confucian_018:0 "Things investigated, knowledge becomes complete"
 motto_fm_confucian_019:0 "Knowledge complete, the will becomes sincere"
 motto_fm_confucian_020:0 "Will sincere, the heart becomes upright"
 motto_fm_confucian_021:0 "Heart upright, the self is cultivated"
 motto_fm_confucian_022:0 "Self cultivated, the house is regulated"
 motto_fm_confucian_023:0 "House regulated, the state is ordered"
 motto_fm_confucian_024:0 "State ordered, the world is at peace"
 motto_fm_confucian_025:0 "From the Son of Heaven to the common man"
 motto_fm_confucian_026:0 "All take self-cultivation as the root"
 motto_fm_confucian_027:0 "If renewed daily, renew day by day"
 motto_fm_confucian_028:0 "As cut and filed, as carved and polished"
 motto_fm_confucian_029:0 "The mind absent, one looks but does not see"
 motto_fm_confucian_030:0 "One house humane, a state becomes humane"

 # Doctrine of the Mean
 motto_fm_confucian_031:0 "Heaven's decree is nature, following nature is the Way"
 motto_fm_confucian_032:0 "Cultivating the Way is teaching"
 motto_fm_confucian_033:0 "The Way may not be left for a moment"
 motto_fm_confucian_034:0 "Joy, anger, sorrow, pleasure not yet stirred is the mean"
 motto_fm_confucian_035:0 "Stirred and all in due measure is harmony"
 motto_fm_confucian_036:0 "The mean is the great root of the world"
 motto_fm_confucian_037:0 "Harmony is the world's great path"
 motto_fm_confucian_038:0 "Attain the mean and harmony, heaven and earth in place"
 motto_fm_confucian_039:0 "All things nourished"
 motto_fm_confucian_040:0 "The noble keep the mean, the petty oppose it"
 motto_fm_confucian_041:0 "The noble's mean is timely"
 motto_fm_confucian_042:0 "The noble harmonize without drifting"
 motto_fm_confucian_043:0 "Stand firm without leaning"
 motto_fm_confucian_044:0 "The noble act according to their station"
 motto_fm_confucian_045:0 "Wishing not beyond it"
 motto_fm_confucian_046:0 "Blame not heaven above, nor man below"
 motto_fm_confucian_047:0 "The noble dwell at ease awaiting destiny"
 motto_fm_confucian_048:0 "The petty take risks for luck"
 motto_fm_confucian_049:0 "Archery is like the noble"
 motto_fm_confucian_050:0 "Missing the mark, seek the cause in oneself"
 motto_fm_confucian_051:0 "The noble's way, like a long road, begins near"
 motto_fm_confucian_052:0 "Learn broadly, inquire earnestly"
 motto_fm_confucian_053:0 "Think carefully, discern clearly, practice sincerely"
 motto_fm_confucian_054:0 "What others do once, do a hundred times"
 motto_fm_confucian_055:0 "What others do ten times, do a thousand"
 motto_fm_confucian_056:0 "If one can truly follow this way"
 motto_fm_confucian_057:0 "Even the dull become bright, the weak strong"
 motto_fm_confucian_058:0 "Sincerity is the way of heaven"
 motto_fm_confucian_059:0 "Seeking sincerity is the way of man"
 motto_fm_confucian_060:0 "The sincere attain without effort"
 motto_fm_confucian_061:0 "Attain without thinking, calmly in the Way"
 motto_fm_confucian_062:0 "Sincerity is the beginning and end of things"
 motto_fm_confucian_063:0 "Without sincerity, there is nothing"
 motto_fm_confucian_064:0 "Utmost sincerity never ceases"
 motto_fm_confucian_065:0 "Ceaseless, it endures; enduring, it shows"
 motto_fm_confucian_066:0 "Showing, it is far-reaching; far, it is broad and deep"
 motto_fm_confucian_067:0 "Broad and deep, it is lofty and bright"
 motto_fm_confucian_068:0 "Broad and deep, it bears all things"
 motto_fm_confucian_069:0 "Lofty and bright, it covers all things"
 motto_fm_confucian_070:0 "Long and enduring, it completes all things"

 # Analects
 motto_fm_confucian_071:0 "To learn and practice, is it not a joy"
 motto_fm_confucian_072:0 "Friends from afar, is it not a delight"
 motto_fm_confucian_073:0 "Not vexed when unknown, is that not noble"
 motto_fm_confucian_074:0 "I reflect on myself thrice daily"
 motto_fm_confucian_075:0 "Loyal in serving others"
 motto_fm_confucian_076:0 "True in dealings with friends"
 motto_fm_confucian_077:0 "Practiced what was taught"
 motto_fm_confucian_078:0 "Rule a state of a thousand chariots with reverence and trust"
 motto_fm_confucian_079:0 "Spare in use, love the people, employ them in season"
 motto_fm_confucian_080:0 "At home filial, abroad respectful"
 motto_fm_confucian_081:0 "Earnest and true, love all, draw near the humane"
 motto_fm_confucian_082:0 "With strength to spare, then study letters"
 motto_fm_confucian_083:0 "The noble without weight is not respected"
 motto_fm_confucian_084:0 "Learning is not rigid"
 motto_fm_confucian_085:0 "Hold loyalty and trust, no friend lesser than oneself"
 motto_fm_confucian_086:0 "Having faults, fear not to mend them"
 motto_fm_confucian_087:0 "Revere the end, recall the past, the people turn to virtue"
 motto_fm_confucian_088:0 "In rites, harmony is most precious"
 motto_fm_confucian_089:0 "The way of the former kings is beautiful"
 motto_fm_confucian_090:0 "Harmony without rites will not do"
 motto_fm_confucian_091:0 "The noble seek no full belly or ease in dwelling"
 motto_fm_confucian_092:0 "Quick in deed, careful in word"
 motto_fm_confucian_093:0 "Follow the Way and be upright"
 motto_fm_confucian_094:0 "That may be called love of learning"
 motto_fm_confucian_095:0 "Poor without flattery, rich without pride"
 motto_fm_confucian_096:0 "Better poor and glad, rich and loving rites"
 motto_fm_confucian_097:0 "Worry not of being unknown"
 motto_fm_confucian_098:0 "Worry of not knowing others"
 motto_fm_confucian_099:0 "Govern with virtue, like the North Star"
 motto_fm_confucian_100:0 "Staying in place, all stars turn to it"
 motto_fm_confucian_101:0 "Three hundred odes, one line covers them"
 motto_fm_confucian_102:0 "Have no crooked thoughts"
 motto_fm_confucian_103:0 "At fifteen I set my heart on learning"
 motto_fm_confucian_104:0 "At thirty I stood firm, at forty no doubt"
 motto_fm_confucian_105:0 "At fifty I knew heaven's decree"
 motto_fm_confucian_106:0 "At sixty my ear was attuned"
 motto_fm_confucian_107:0 "At seventy, follow the heart without overstepping"
 motto_fm_confucian_108:0 "Review the old to know the new, one may teach"
 motto_fm_confucian_109:0 "Learning without thought is confusion"
 motto_fm_confucian_110:0 "Thought without learning is peril"
 motto_fm_confucian_111:0 "Know what you know and what you do not"
 motto_fm_confucian_112:0 "That is knowledge"
 motto_fm_confucian_113:0 "A man without trust, what can he do"
 motto_fm_confucian_114:0 "To see right and not act is cowardice"
 motto_fm_confucian_115:0 "What is done, speak not; what is done, remonstrate not"
 motto_fm_confucian_116:0 "Bygones are bygones"
 motto_fm_confucian_117:0 "Hear the Way in the morning, die content at dusk"
 motto_fm_confucian_118:0 "One set on the Way, ashamed of poor food"
 motto_fm_confucian_119:0 "The noble seek right, the petty seek gain"
 motto_fm_confucian_120:0 "See the worthy, think to equal them"
 motto_fm_confucian_121:0 "See the unworthy, reflect on oneself"
 motto_fm_confucian_122:0 "Serve parents with gentle remonstrance"
 motto_fm_confucian_123:0 "While parents live, travel not far; if far, with a place"
 motto_fm_confucian_124:0 "The years of parents must not be unknown"
 motto_fm_confucian_125:0 "The noble are slow in word, quick in deed"
 motto_fm_confucian_126:0 "Virtue is never alone, it has neighbors"
 motto_fm_confucian_127:0 "Rotten wood cannot be carved"
 motto_fm_confucian_128:0 "Quick to learn, not ashamed to ask below"
 motto_fm_confucian_129:0 "Think thrice before acting"
 motto_fm_confucian_130:0 "Ning Wuzi, when the way prevailed, was wise"
 motto_fm_confucian_131:0 "His wisdom we may match, his folly not"
 motto_fm_confucian_132:0 "Substance over form is crude, form over substance is pedantic"
 motto_fm_confucian_133:0 "Form and substance blended, then the noble"
 motto_fm_confucian_134:0 "Knowing is less than loving"
 motto_fm_confucian_135:0 "Loving is less than delighting"
 motto_fm_confucian_136:0 "Above the average, one may speak of higher things"
 motto_fm_confucian_137:0 "The wise delight in water, the humane in mountains"
 motto_fm_confucian_138:0 "The wise are active, the humane are still"
 motto_fm_confucian_139:0 "The wise are joyful, the humane long-lived"
 motto_fm_confucian_140:0 "Wishing to stand, help others stand"
 motto_fm_confucian_141:0 "Wishing to advance, help others advance"
 motto_fm_confucian_142:0 "Remember in silence, learn without tiring"
 motto_fm_confucian_143:0 "Teach without wearying, what is that to me"
 motto_fm_confucian_144:0 "Teach not until the mind yearns"
 motto_fm_confucian_145:0 "Show one corner, and if not three returned"
 motto_fm_confucian_146:0 "Then teach not again"
 motto_fm_confucian_147:0 "When employed, act; when set aside, hide"
 motto_fm_confucian_148:0 "If wealth could be rightly sought, even as a whip-holder"
 motto_fm_confucian_149:0 "I would do it"
 motto_fm_confucian_150:0 "Plain rice and water"
 motto_fm_confucian_151:0 "A bent arm for a pillow"
 motto_fm_confucian_152:0 "Unrighteous wealth and rank"
 motto_fm_confucian_153:0 "Are to me like floating clouds"
 motto_fm_confucian_154:0 "Forget food in effort, forget worry in joy"
 motto_fm_confucian_155:0 "Knowing not that age is coming"
 motto_fm_confucian_156:0 "Among three walkers, one is my teacher"
 motto_fm_confucian_157:0 "Choose the good and follow it"
 motto_fm_confucian_158:0 "The bad, and mend it"
 motto_fm_confucian_159:0 "The noble are at ease, the petty anxious"
 motto_fm_confucian_160:0 "Respect without rites is toil"
 motto_fm_confucian_161:0 "Caution without rites is timidity"
 motto_fm_confucian_162:0 "Courage without rites is disorder"
 motto_fm_confucian_163:0 "Straightness without rites is harshness"
 motto_fm_confucian_164:0 "The noble must be resolute"
 motto_fm_confucian_165:0 "The burden is heavy, the road long"
 motto_fm_confucian_166:0 "Virtue as duty, is it not heavy"
 motto_fm_confucian_167:0 "Only death as the end, is it not far"
 motto_fm_confucian_168:0 "Rise with poetry, stand with rites, complete with music"
 motto_fm_confucian_169:0 "Firm in faith, love learning, keep the good way to death"
 motto_fm_confucian_170:0 "Not in office, plan not its affairs"
 motto_fm_confucian_171:0 "Learn as if never reaching, fear losing it"
 motto_fm_confucian_172:0 "Great was Yao as a ruler"
 motto_fm_confucian_173:0 "Only heaven is great"
 motto_fm_confucian_174:0 "Time flows on, never ceasing day or night"
 motto_fm_confucian_175:0 "The young are to be feared"
 motto_fm_confucian_176:0 "Who knows the future may not equal now"
 motto_fm_confucian_177:0 "An army may lose its leader"
 motto_fm_confucian_178:0 "A common man cannot lose his will"
 motto_fm_confucian_179:0 "Cold seasons show the pine's strength"
 motto_fm_confucian_180:0 "The wise are not confused, the humane not worried"
 motto_fm_confucian_181:0 "The brave are not afraid"
 motto_fm_confucian_182:0 "Restrain the self and return to rites, that is humanity"
 motto_fm_confucian_183:0 "For one day restrain the self and return to rites"
 motto_fm_confucian_184:0 "The world returns to humanity"
 motto_fm_confucian_185:0 "Look not, listen not, against rites"
 motto_fm_confucian_186:0 "Speak not, move not, against rites"
 motto_fm_confucian_187:0 "Do not do to others what you dislike"
 motto_fm_confucian_188:0 "Life and death are fate, wealth and rank in heaven"
 motto_fm_confucian_189:0 "Within the four seas, all are brothers"
 motto_fm_confucian_190:0 "The noble help good"
 motto_fm_confucian_191:0 "Not evil"
 motto_fm_confucian_192:0 "The noble's virtue is wind, the petty's is grass"
 motto_fm_confucian_193:0 "Wind over grass, it bends"
 motto_fm_confucian_194:0 "The noble meet friends through culture"
 motto_fm_confucian_195:0 "With friends, aid humanity"
 motto_fm_confucian_196:0 "When one is upright, all follow without command"
 motto_fm_confucian_197:0 "When not upright, none follow even with command"
 motto_fm_confucian_198:0 "Haste fails"
 motto_fm_confucian_199:0 "Small gains ruin great plans"
 motto_fm_confucian_200:0 "The noble harmonize yet differ"
 motto_fm_confucian_201:0 "The petty differ yet cannot harmonize"
 motto_fm_confucian_202:0 "The noble are calm, not proud"
 motto_fm_confucian_203:0 "The petty are proud, not calm"
 motto_fm_confucian_204:0 "Firm, resolute, simple, near virtue"
 motto_fm_confucian_205:0 "In a well-ruled state, poverty is shameful"
 motto_fm_confucian_206:0 "In a misruled state, wealth is shameful"
 motto_fm_confucian_207:0 "In a well-ruled state, speak boldly and act boldly"
 motto_fm_confucian_208:0 "In a misruled state, act boldly but speak cautiously"
 motto_fm_confucian_209:0 "The virtuous have words"
 motto_fm_confucian_210:0 "Those with words are not always virtuous"
 motto_fm_confucian_211:0 "The humane are brave"
 motto_fm_confucian_212:0 "The brave are not always humane"
 motto_fm_confucian_213:0 "Poverty without complaint is hard, wealth without pride easy"
 motto_fm_confucian_214:0 "The noble are ashamed of words exceeding deeds"
 motto_fm_confucian_215:0 "A fine horse is praised for virtue, not strength"
 motto_fm_confucian_216:0 "Repay wrong with right, virtue with virtue"
 motto_fm_confucian_217:0 "Blame not heaven, nor man"
 motto_fm_confucian_218:0 "Learn the lower to reach the higher"
 motto_fm_confucian_219:0 "Do what one knows cannot be done"
 motto_fm_confucian_220:0 "To do a job well, first sharpen the tools"
 motto_fm_confucian_221:0 "Without foresight, near worry"
 motto_fm_confucian_222:0 "Blame oneself more, others less"
 motto_fm_confucian_223:0 "The noble seek within, the petty without"
 motto_fm_confucian_224:0 "The noble are dignified, not contentious"
 motto_fm_confucian_225:0 "Together, not as factions"
 motto_fm_confucian_226:0 "Small impatience ruins great plans"
 motto_fm_confucian_227:0 "What all dislike, examine it"
 motto_fm_confucian_228:0 "What all like, examine it"
 motto_fm_confucian_229:0 "To err and not mend is to err indeed"
 motto_fm_confucian_230:0 "Yield not in virtue even to a teacher"

 # Mencius
 motto_fm_confucian_231:0 "Born in hardship, die in ease"
 motto_fm_confucian_232:0 "Not moved by wealth, not moved by poverty"
 motto_fm_confucian_233:0 "Not subdued by force"
 motto_fm_confucian_234:0 "With the Way, help; without it, none"
 motto_fm_confucian_235:0 "Heaven's time is not as earth's place"
 motto_fm_confucian_236:0 "Earth's place is not as man's harmony"
 motto_fm_confucian_237:0 "When heaven is about to place a great charge on one"
 motto_fm_confucian_238:0 "It first distresses the mind"
 motto_fm_confucian_239:0 "Toils the sinews, starves the body"
 motto_fm_confucian_240:0 "Empties him of all"
 motto_fm_confucian_241:0 "Thwarts all his undertakings"
 motto_fm_confucian_242:0 "Thus to stir the heart and steel the nature"
 motto_fm_confucian_243:0 "And add to what he could not do"
 motto_fm_confucian_244:0 "In poverty, perfect oneself"
 motto_fm_confucian_245:0 "In success, perfect the world"
 motto_fm_confucian_246:0 "Honor the old of others as your own"
 motto_fm_confucian_247:0 "Care for the young of others as your own"
 motto_fm_confucian_248:0 "The people first, the state next, the ruler last"
 motto_fm_confucian_249:0 "Rejoice in the people's joy, they rejoice in yours"
 motto_fm_confucian_250:0 "Sorrow at the people's sorrow, they sorrow at yours"
 motto_fm_confucian_251:0 "Ashamed of nothing before heaven or man"
 motto_fm_confucian_252:0 "Fish I desire, bear's paw I also desire"
 motto_fm_confucian_253:0 "The two cannot both be had"
 motto_fm_confucian_254:0 "I take the bear's paw over the fish"
 motto_fm_confucian_255:0 "Life I desire"
 motto_fm_confucian_256:0 "Righteousness I also desire"
 motto_fm_confucian_257:0 "I give life to take righteousness"
 motto_fm_confucian_258:0 "The way of learning is nothing else"
 motto_fm_confucian_259:0 "But to seek the lost heart"
 motto_fm_confucian_260:0 "To exhaust the mind is to know one's nature"
 motto_fm_confucian_261:0 "Know one's nature, then know heaven"
 motto_fm_confucian_262:0 "Preserve the mind, nourish the nature"
 motto_fm_confucian_263:0 "Thus to serve heaven"
 motto_fm_confucian_264:0 "In poverty, lose not righteousness; in success, leave not the Way"
 motto_fm_confucian_265:0 "The noble have three joys"
 motto_fm_confucian_266:0 "Parents alive, brothers without mishap"
 motto_fm_confucian_267:0 "Ashamed of nothing before heaven"
 motto_fm_confucian_268:0 "Nor before man"
 motto_fm_confucian_269:0 "To gather the world's finest and teach them"
 motto_fm_confucian_270:0 "Man's flaw is loving to be another's teacher"
 motto_fm_confucian_271:0 "Those with virtue, wisdom, skill, and knowledge"
 motto_fm_confucian_272:0 "Often rise from trouble"
 motto_fm_confucian_273:0 "Born in hardship"
 motto_fm_confucian_274:0 "The doer is like one digging a well"
 motto_fm_confucian_275:0 "Digging nine fathoms without reaching the spring"
 motto_fm_confucian_276:0 "It is still an abandoned well"
 motto_fm_confucian_277:0 "With the self-ruined, one cannot speak"
 motto_fm_confucian_278:0 "With the self-abandoned, one cannot do"
 motto_fm_confucian_279:0 "Words against propriety and righteousness are self-ruin"
 motto_fm_confucian_280:0 "Not to dwell in benevolence and follow righteousness"
 motto_fm_confucian_281:0 "That is self-abandonment"
 motto_fm_confucian_282:0 "The humane love others"
 motto_fm_confucian_283:0 "The courteous respect others"
 motto_fm_confucian_284:0 "Who loves others is always loved"
 motto_fm_confucian_285:0 "Who respects others is always respected"
 motto_fm_confucian_286:0 "Wealth and rank cannot seduce"
 motto_fm_confucian_287:0 "Poverty cannot move"
 motto_fm_confucian_288:0 "The way of the great man"
 motto_fm_confucian_289:0 "This is the great man"
 motto_fm_confucian_290:0 "I am skilled at nourishing my vast qi"
 motto_fm_confucian_291:0 "This qi is greatest and firmest"
 motto_fm_confucian_292:0 "Nourished with uprightness, unharmed"
 motto_fm_confucian_293:0 "It fills heaven and earth"
 motto_fm_confucian_294:0 "The heart's office is to think"
 motto_fm_confucian_295:0 "Think, and it is gained"
 motto_fm_confucian_296:0 "Think not, and it is lost"
 motto_fm_confucian_297:0 "Heaven is about to place a great charge"
 motto_fm_confucian_298:0 "All men have a heart that cannot bear others' pain"
 motto_fm_confucian_299:0 "Compassion is the seed of benevolence"
 motto_fm_confucian_300:0 "Shame is the seed of righteousness"
 motto_fm_confucian_301:0 "Deference is the seed of propriety"
 motto_fm_confucian_302:0 "Right and wrong is the seed of wisdom"
 motto_fm_confucian_303:0 "Man has these four seeds"
 motto_fm_confucian_304:0 "As he has four limbs"
 motto_fm_confucian_305:0 "Fill them, enough to protect the four seas"
 motto_fm_confucian_306:0 "Fill them not, not enough to serve parents"
 motto_fm_confucian_307:0 "Take good from others"
 motto_fm_confucian_308:0 "That is doing good with others"
 motto_fm_confucian_309:0 "The noble's greatest deed is doing good with others"
 motto_fm_confucian_310:0 "The people are the most precious"
 motto_fm_confucian_311:0 "The ruler is the lightest"
 motto_fm_confucian_312:0 "Everyone can become Yao or Shun"
 motto_fm_confucian_313:0 "The doer may be like them"
 motto_fm_confucian_314:0 "Though ten thousand oppose, I go on"
 motto_fm_confucian_315:0 "If the deed is not satisfied in the heart"
 motto_fm_confucian_316:0 "It starves"
 motto_fm_confucian_317:0 "Born of accumulated righteousness"
 motto_fm_confucian_318:0 "Not seized by a single righteous act"
 motto_fm_confucian_319:0 "Cultivate deeply with the Way"
 motto_fm_confucian_320:0 "Wishing to attain it oneself"
 motto_fm_confucian_321:0 "Attaining it, one dwells at peace"
 motto_fm_confucian_322:0 "Dwelling at peace, one draws deep"
 motto_fm_confucian_323:0 "Drawing deep, one meets the source on all sides"
 motto_fm_confucian_324:0 "Thus the noble wish to attain it themselves"
 motto_fm_confucian_325:0 "Learn broadly and explain in detail"
 motto_fm_confucian_326:0 "Then return to the essential"
 motto_fm_confucian_327:0 "What man does without learning"
 motto_fm_confucian_328:0 "Is his good ability"
 motto_fm_confucian_329:0 "What he knows without thinking"
 motto_fm_confucian_330:0 "Is his good knowledge"
 motto_fm_confucian_331:0 "To love parents is benevolence"
 motto_fm_confucian_332:0 "To respect elders is righteousness"
 motto_fm_confucian_333:0 "Nothing else, extend it to the world"
 motto_fm_confucian_334:0 "Honor the old"
 motto_fm_confucian_335:0 "Care for the young"
 motto_fm_confucian_336:0 "Weigh, then know heavy and light"
 motto_fm_confucian_337:0 "Measure, then know long and short"
 motto_fm_confucian_338:0 "All things so, the heart most of all"
 motto_fm_confucian_339:0 "The heart thinks, thinking gains"
 motto_fm_confucian_340:0 "Follow benevolence and righteousness, not just act them"

 # Book of Songs
 motto_fm_confucian_341:0 "Guan guan cry the ospreys on the river islet"
 motto_fm_confucian_342:0 "The gentle lady, the noble's good match"
 motto_fm_confucian_343:0 "The peach tree, tender and bright its flowers"
 motto_fm_confucian_344:0 "This maiden goes home, fitting for her house"
 motto_fm_confucian_345:0 "Long ago we left, willows swaying"
 motto_fm_confucian_346:0 "Now we return, rain and snow falling"
 motto_fm_confucian_347:0 "Reeds and rushes, white dew turns to frost"
 motto_fm_confucian_348:0 "The one I seek is on the water's far side"
 motto_fm_confucian_349:0 "In life and death, apart or close, a pledge with you"
