 motto_fm_confucian_1056:0 "Speaking of the Way and of benevolence and duty"
 motto_fm_confucian_1057:0 "The Doctrine of the Mean is by Zisi's brush"
 motto_fm_confucian_1058:0 "Balanced without leaning, constant and unchanged"
 motto_fm_confucian_1059:0 "The Great Learning is by Zengzi"
 motto_fm_confucian_1060:0 "From self-cultivation to ordering the realm"
