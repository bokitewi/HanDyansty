l_english:
 motto_confucian_motto:0 "$1$"

 # 大学
 motto_fm_confucian_001:0 "The way of great learning is to bring luminous virtue to light."
 motto_fm_confucian_002:0 "Care for the people, and rest in the highest good."
 motto_fm_confucian_003:0 "Know where to rest, and your purpose becomes settled."
 motto_fm_confucian_004:0 "With settled purpose comes stillness."
 motto_fm_confucian_005:0 "With stillness comes peace of mind."
 motto_fm_confucian_006:0 "With peace of mind comes careful reflection."
 motto_fm_confucian_007:0 "With reflection comes attainment."
 motto_fm_confucian_008:0 "Things have roots and branches; affairs have beginnings and ends."
 motto_fm_confucian_009:0 "Know what comes first and last, and you approach the Way."
 motto_fm_confucian_010:0 "Those of old who wished to illuminate virtue throughout the realm."
 motto_fm_confucian_011:0 "First put their states in order."
 motto_fm_confucian_012:0 "To order your state, first set your household in order."
 motto_fm_confucian_013:0 "To order your household, first cultivate yourself."
 motto_fm_confucian_014:0 "To cultivate yourself, first set your heart right."
 motto_fm_confucian_015:0 "To set your heart right, first make your intentions sincere."
 motto_fm_confucian_016:0 "To make your intentions sincere, first extend your knowledge."
 motto_fm_confucian_017:0 "Knowledge is extended by investigating things."
 motto_fm_confucian_018:0 "Once things are investigated, knowledge is complete."
 motto_fm_confucian_019:0 "When knowledge is complete, intentions become sincere."
 motto_fm_confucian_020:0 "When intentions are sincere, the heart is set right."
 motto_fm_confucian_021:0 "When the heart is right, the self is cultivated."
 motto_fm_confucian_022:0 "When the self is cultivated, the household is ordered."
 motto_fm_confucian_023:0 "When the household is ordered, the state is governed well."
 motto_fm_confucian_024:0 "When the state is governed well, peace comes to the realm."
 motto_fm_confucian_025:0 "From the Son of Heaven to the common people."
 motto_fm_confucian_026:0 "All alike take self-cultivation as their foundation."
 motto_fm_confucian_027:0 "If you can renew yourself for a day, renew yourself every day, and yet again."
 motto_fm_confucian_028:0 "As if cut and filed, as if carved and polished."
 motto_fm_confucian_029:0 "When the heart is absent, the eyes look but do not see."
 motto_fm_confucian_030:0 "One benevolent household stirs a whole state to benevolence."

 # 中庸
 motto_fm_confucian_031:0 "What Heaven ordains is nature; following nature is the Way."
 motto_fm_confucian_032:0 "Cultivating the Way is education."
 motto_fm_confucian_033:0 "The Way cannot be left for even a moment."
 motto_fm_confucian_034:0 "Before joy, anger, sorrow, and pleasure arise, there is equilibrium."
 motto_fm_confucian_035:0 "When they arise in due measure, there is harmony."
 motto_fm_confucian_036:0 "Equilibrium is the great foundation of the world."
 motto_fm_confucian_037:0 "Harmony is the universal Way of the world."
 motto_fm_confucian_038:0 "Bring equilibrium and harmony to perfection, and Heaven and Earth find their places."
 motto_fm_confucian_039:0 "All things flourish."
 motto_fm_confucian_040:0 "The gentleman follows the mean; the petty person opposes it."
 motto_fm_confucian_041:0 "The gentleman follows the mean by acting as the moment requires."
 motto_fm_confucian_042:0 "The gentleman is harmonious without drifting with the crowd."
 motto_fm_confucian_043:0 "Stand at the center without leaning to either side."
 motto_fm_confucian_044:0 "The gentleman acts according to the position they occupy."
 motto_fm_confucian_045:0 "Do not crave what lies beyond your station."
 motto_fm_confucian_046:0 "Do not resent Heaven above or blame people below."
 motto_fm_confucian_047:0 "The gentleman lives at ease, awaiting what fate brings."
 motto_fm_confucian_048:0 "The petty person courts danger in the hope of luck."
 motto_fm_confucian_049:0 "Archery resembles the gentleman's conduct."
 motto_fm_confucian_050:0 "When you miss the mark, seek the fault in yourself."
 motto_fm_confucian_051:0 "The gentleman's Way is like a long journey: begin nearby."
 motto_fm_confucian_052:0 "Learn broadly and question closely."
 motto_fm_confucian_053:0 "Reflect carefully, discern clearly, and act steadfastly."
 motto_fm_confucian_054:0 "What another does once, do a hundred times yourself."
 motto_fm_confucian_055:0 "What another does ten times, do a thousand times yourself."
 motto_fm_confucian_056:0 "If you truly follow this course."
 motto_fm_confucian_057:0 "Even the foolish become wise, and the weak become strong."
 motto_fm_confucian_058:0 "Sincerity is the Way of Heaven."
 motto_fm_confucian_059:0 "Striving for sincerity is the human Way."
 motto_fm_confucian_060:0 "The sincere find the right measure without effort."
 motto_fm_confucian_061:0 "They understand without deliberation and follow the mean at ease."
 motto_fm_confucian_062:0 "Sincerity is the beginning and end of all things."
 motto_fm_confucian_063:0 "Without sincerity, nothing is complete."
 motto_fm_confucian_064:0 "Perfect sincerity never ceases."
 motto_fm_confucian_065:0 "Unceasing, it endures; enduring, it becomes manifest."
 motto_fm_confucian_066:0 "Manifest, it reaches far; reaching far, it becomes broad and deep."
 motto_fm_confucian_067:0 "Broad and deep, it becomes lofty and luminous."
 motto_fm_confucian_068:0 "Breadth and depth sustain all things."
 motto_fm_confucian_069:0 "Loftiness and clarity shelter all things."
 motto_fm_confucian_070:0 "Long endurance brings all things to fulfillment."

 # 论语
 motto_fm_confucian_071:0 "To learn and practice what you have learned: is this not a delight?"
 motto_fm_confucian_072:0 "To have friends come from afar: is this not a joy?"
 motto_fm_confucian_073:0 "To feel no resentment when others fail to recognize you: is this not the gentleman's way?"
 motto_fm_confucian_074:0 "Each day I examine myself on three matters."
 motto_fm_confucian_075:0 "Have I been faithful in acting for others?"
 motto_fm_confucian_076:0 "Have I been trustworthy in dealing with friends?"
 motto_fm_confucian_077:0 "Have I practiced what I was taught?"
 motto_fm_confucian_078:0 "Govern a state of a thousand chariots with care and good faith."
 motto_fm_confucian_079:0 "Spend sparingly, care for people, and call on their labor at the proper season."
 motto_fm_confucian_080:0 "At home, the young should honor their parents; abroad, respect their elders."
 motto_fm_confucian_081:0 "Be careful and trustworthy, love all people, and draw close to the benevolent."
 motto_fm_confucian_082:0 "With strength left after fulfilling your duties, study the written arts."
 motto_fm_confucian_083:0 "Without gravity, the gentleman commands no respect."
 motto_fm_confucian_084:0 "Nor will their learning be firmly grounded."
 motto_fm_confucian_085:0 "Make loyalty and trustworthiness your principles; befriend none who fall short of them."
 motto_fm_confucian_086:0 "Do not fear correcting your faults."
 motto_fm_confucian_087:0 "Honor the dead and remember distant ancestors, and the people's virtue will deepen."
 motto_fm_confucian_088:0 "In the practice of ritual, harmony is most precious."
 motto_fm_confucian_089:0 "This was the beauty of the ancient kings' Way."
 motto_fm_confucian_090:0 "Seeking harmony alone, without the bounds of ritual, is not enough."
 motto_fm_confucian_091:0 "The gentleman seeks neither a full table nor an easy dwelling."
 motto_fm_confucian_092:0 "Be diligent in action and careful in speech."
 motto_fm_confucian_093:0 "Seek those who possess the Way, and let them correct you."
 motto_fm_confucian_094:0 "Such a person may be called devoted to learning."
 motto_fm_confucian_095:0 "Be poor without flattery, and rich without arrogance."
 motto_fm_confucian_096:0 "Better still: poor yet joyful, rich yet devoted to ritual."
 motto_fm_confucian_097:0 "Do not worry that others fail to know you."
 motto_fm_confucian_098:0 "Worry that you fail to know others."
 motto_fm_confucian_099:0 "Governing through virtue is like the Pole Star."
 motto_fm_confucian_100:0 "It remains in place, and all the stars turn toward it."
 motto_fm_confucian_101:0 "The three hundred poems can be summed up in one phrase."
 motto_fm_confucian_102:0 "Let your thoughts be free of evil."
 motto_fm_confucian_103:0 "At fifteen, I set my heart on learning."
 motto_fm_confucian_104:0 "At thirty, I stood firm; at forty, I was free of doubt."
 motto_fm_confucian_105:0 "At fifty, I understood Heaven's mandate."
 motto_fm_confucian_106:0 "At sixty, my ear was attuned."
 motto_fm_confucian_107:0 "At seventy, I followed my heart's desires without crossing the bounds."
 motto_fm_confucian_108:0 "Review the old and understand the new, and you may teach others."
 motto_fm_confucian_109:0 "Learning without reflection leaves you bewildered."
 motto_fm_confucian_110:0 "Reflection without learning leaves you in danger."
 motto_fm_confucian_111:0 "Know what you know, and admit what you do not know."
 motto_fm_confucian_112:0 "That is wisdom."
 motto_fm_confucian_113:0 "I cannot see how a person without trustworthiness can succeed."
 motto_fm_confucian_114:0 "To see what is right and leave it undone is a lack of courage."
 motto_fm_confucian_115:0 "Do not explain what is finished or remonstrate over what is already done."
 motto_fm_confucian_116:0 "Do not lay blame for what has passed."
 motto_fm_confucian_117:0 "Hear the Way in the morning, and you may die content that evening."
 motto_fm_confucian_118:0 "A scholar sets their heart on the Way, yet is ashamed of coarse clothes and poor food."
 motto_fm_confucian_119:0 "The gentleman understands righteousness; the petty person understands profit."
 motto_fm_confucian_120:0 "When you see the worthy, strive to equal them."
 motto_fm_confucian_121:0 "When you see the unworthy, examine yourself."
 motto_fm_confucian_122:0 "Remonstrate gently with your parents."
 motto_fm_confucian_123:0 "While your parents live, do not journey far; if you travel, let your destination be known."
 motto_fm_confucian_124:0 "You must always know your parents' ages."
 motto_fm_confucian_125:0 "The gentleman wishes to be slow in speech and swift in action."
 motto_fm_confucian_126:0 "Virtue never stands alone; it always finds companions."
 motto_fm_confucian_127:0 "Rotten wood cannot be carved."
 motto_fm_confucian_128:0 "Be quick to learn, love learning, and feel no shame in asking those below you."
 motto_fm_confucian_129:0 "Think three times before you act."
 motto_fm_confucian_130:0 "When his state followed the Way, Ning Wuzi showed wisdom."
 motto_fm_confucian_131:0 "His wisdom could be matched; his apparent foolishness could not."
 motto_fm_confucian_132:0 "Substance without refinement is rough; refinement without substance is empty display."
 motto_fm_confucian_133:0 "Only when refinement and substance are balanced is there a gentleman."
 motto_fm_confucian_134:0 "Knowing something is not as good as loving it."
 motto_fm_confucian_135:0 "Loving something is not as good as taking joy in it."
 motto_fm_confucian_136:0 "With those above average ability, one may discuss higher matters."
 motto_fm_confucian_137:0 "The wise delight in water; the benevolent delight in mountains."
 motto_fm_confucian_138:0 "The wise are active; the benevolent are still."
 motto_fm_confucian_139:0 "The wise are joyful; the benevolent live long."
 motto_fm_confucian_140:0 "Wishing to establish yourself, help others establish themselves."
 motto_fm_confucian_141:0 "Wishing to succeed, help others succeed."
 motto_fm_confucian_142:0 "Remember quietly, and learn without tiring."
 motto_fm_confucian_143:0 "Teach others without weariness: what claim can I make to these virtues?"
 motto_fm_confucian_144:0 "Do not enlighten those who do not struggle to understand, or explain to those who do not strive to speak."
 motto_fm_confucian_145:0 "If shown one corner, they cannot infer the other three."
 motto_fm_confucian_146:0 "I will not repeat the lesson."
 motto_fm_confucian_147:0 "When called to serve, act; when set aside, withdraw."
 motto_fm_confucian_148:0 "If wealth could rightly be pursued, even as a whip-bearing servant."
 motto_fm_confucian_149:0 "I would take up that work."
 motto_fm_confucian_150:0 "Eat coarse food and drink water."
 motto_fm_confucian_151:0 "Bend your arm and use it as a pillow."
 motto_fm_confucian_152:0 "Wealth and rank gained unrighteously."
 motto_fm_confucian_153:0 "Are drifting clouds to me."
 motto_fm_confucian_154:0 "In eager study I forget food; in joy I forget sorrow."
 motto_fm_confucian_155:0 "And do not notice old age approaching."
 motto_fm_confucian_156:0 "Among three people walking together, there is surely someone I can learn from."
 motto_fm_confucian_157:0 "Choose their good qualities and follow them."
 motto_fm_confucian_158:0 "See their faults, and correct your own."
 motto_fm_confucian_159:0 "The gentleman is open and at ease; the petty person is always troubled."
 motto_fm_confucian_160:0 "Respect without ritual becomes burdensome."
 motto_fm_confucian_161:0 "Caution without ritual becomes timidity."
 motto_fm_confucian_162:0 "Courage without ritual becomes disorder."
 motto_fm_confucian_163:0 "Frankness without ritual becomes harshness."
 motto_fm_confucian_164:0 "A scholar must be broad-minded and resolute."
 motto_fm_confucian_165:0 "The burden is heavy, and the road is long."
 motto_fm_confucian_166:0 "To take benevolence as your charge: is this not a heavy burden?"
 motto_fm_confucian_167:0 "To stop only at death: is this not a long road?"
 motto_fm_confucian_168:0 "Be stirred by poetry, established through ritual, and fulfilled through music."
 motto_fm_confucian_169:0 "Hold firm convictions, love learning, and defend the good Way even unto death."
 motto_fm_confucian_170:0 "Do not plan the affairs of an office you do not hold."
 motto_fm_confucian_171:0 "Learn as though you could never catch up, and fear losing what you have gained."
 motto_fm_confucian_172:0 "How great was Yao as a ruler!"
 motto_fm_confucian_173:0 "How lofty! Heaven alone is truly great."
 motto_fm_confucian_174:0 "What passes flows like this stream, never ceasing by day or night."
 motto_fm_confucian_175:0 "The young deserve our respect."
 motto_fm_confucian_176:0 "How can we know that those to come will not equal us today?"
 motto_fm_confucian_177:0 "An army may be deprived of its commander."
 motto_fm_confucian_178:0 "An ordinary person cannot be deprived of their resolve."
 motto_fm_confucian_179:0 "Only in winter's cold do we learn that pines and cypresses are the last to wither."
 motto_fm_confucian_180:0 "The wise are free of doubt; the benevolent are free of worry."
 motto_fm_confucian_181:0 "The courageous are free of fear."
 motto_fm_confucian_182:0 "Master yourself and return to ritual: that is benevolence."
 motto_fm_confucian_183:0 "Once you master yourself and return to ritual."
 motto_fm_confucian_184:0 "The world will turn to benevolence."
 motto_fm_confucian_185:0 "Look at nothing improper; listen to nothing improper."
 motto_fm_confucian_186:0 "Say nothing improper; do nothing improper."
 motto_fm_confucian_187:0 "Do not impose on others what you would not wish for yourself."
 motto_fm_confucian_188:0 "Life and death are ordained; wealth and rank rest with Heaven."
 motto_fm_confucian_189:0 "Within the four seas, all are brothers."
 motto_fm_confucian_190:0 "The gentleman helps others fulfill what is good in them."
 motto_fm_confucian_191:0 "Never help others fulfill what is evil in them."
 motto_fm_confucian_192:0 "The gentleman's virtue is wind; the petty person's virtue is grass."
 motto_fm_confucian_193:0 "When the wind blows over grass, the grass must bend."
 motto_fm_confucian_194:0 "The gentleman gathers friends through learning."
 motto_fm_confucian_195:0 "Through friendship, nurture benevolence."
 motto_fm_confucian_196:0 "When a ruler is upright, people act without orders."
 motto_fm_confucian_197:0 "When a ruler is not upright, even orders go unheeded."
 motto_fm_confucian_198:0 "Haste defeats its own purpose."
 motto_fm_confucian_199:0 "Chasing small gains prevents great achievements."
 motto_fm_confucian_200:0 "The gentleman seeks harmony without uniformity."
 motto_fm_confucian_201:0 "The petty person seeks uniformity without harmony."
 motto_fm_confucian_202:0 "The gentleman is at ease without arrogance."
 motto_fm_confucian_203:0 "The petty person is arrogant without ease."
 motto_fm_confucian_204:0 "Firmness, resolve, simplicity, and restraint in speech approach benevolence."
 motto_fm_confucian_205:0 "When a state follows the Way, poverty and low standing are shameful."
 motto_fm_confucian_206:0 "When a state lacks the Way, wealth and high standing are shameful."
 motto_fm_confucian_207:0 "When a state follows the Way, speak uprightly and act uprightly."
 motto_fm_confucian_208:0 "When a state lacks the Way, act uprightly but speak cautiously."
 motto_fm_confucian_209:0 "The virtuous will have something worth saying."
 motto_fm_confucian_210:0 "Those with something to say are not necessarily virtuous."
 motto_fm_confucian_211:0 "The benevolent will have courage."
 motto_fm_confucian_212:0 "The courageous are not necessarily benevolent."
 motto_fm_confucian_213:0 "Poverty without resentment is hard; wealth without arrogance is easy."
 motto_fm_confucian_214:0 "The gentleman is ashamed when words exceed deeds."
 motto_fm_confucian_215:0 "A fine horse is praised for its character, not its strength."
 motto_fm_confucian_216:0 "Answer resentment with justice, and kindness with kindness."
 motto_fm_confucian_217:0 "Neither resent Heaven nor blame others."
 motto_fm_confucian_218:0 "Learn from earthly matters and reach higher understanding."
 motto_fm_confucian_219:0 "Know it cannot be done, and do it nonetheless."
 motto_fm_confucian_220:0 "A craftsman who would do good work must first sharpen the tools."
 motto_fm_confucian_221:0 "Without foresight, troubles will soon be at hand."
 motto_fm_confucian_222:0 "Demand much of yourself and little of others."
 motto_fm_confucian_223:0 "The gentleman looks to themself; the petty person looks to others."
 motto_fm_confucian_224:0 "The gentleman has dignity without contention."
 motto_fm_confucian_225:0 "Be sociable without forming factions."
 motto_fm_confucian_226:0 "Impatience in small matters ruins great plans."
 motto_fm_confucian_227:0 "When everyone hates someone, investigate."
 motto_fm_confucian_228:0 "When everyone loves someone, investigate."
 motto_fm_confucian_229:0 "To leave a fault uncorrected is the true fault."
 motto_fm_confucian_230:0 "In doing what is benevolent, do not yield even to your teacher."

 # 孟子
 motto_fm_confucian_231:0 "Hardship sustains life; ease brings ruin."
 motto_fm_confucian_232:0 "Wealth and rank cannot corrupt you; poverty and low standing cannot sway you."
 motto_fm_confucian_233:0 "Might and force cannot make you yield."
 motto_fm_confucian_234:0 "Those who follow the Way gain many allies; those who lose it gain few."
 motto_fm_confucian_235:0 "Favorable timing is less valuable than favorable terrain."
 motto_fm_confucian_236:0 "Favorable terrain is less valuable than unity among people."
 motto_fm_confucian_237:0 "When Heaven is about to entrust someone with a great charge."
 motto_fm_confucian_238:0 "It first afflicts their heart and resolve."
 motto_fm_confucian_239:0 "It wearies their sinews and bones and subjects their body to hunger."
 motto_fm_confucian_240:0 "It leaves them destitute."
 motto_fm_confucian_241:0 "It frustrates and disrupts their undertakings."
 motto_fm_confucian_242:0 "Thus stirring the heart and strengthening endurance."
 motto_fm_confucian_243:0 "And increasing what they are capable of."
 motto_fm_confucian_244:0 "In adversity, perfect your own conduct."
 motto_fm_confucian_245:0 "In success, bring benefit to the whole world."
 motto_fm_confucian_246:0 "Care for your elders, and extend that care to the elders of others."
 motto_fm_confucian_247:0 "Care for your children, and extend that care to the children of others."
 motto_fm_confucian_248:0 "The people come first, the altars of state next, and the ruler last."
 motto_fm_confucian_249:0 "Share the people's joys, and they will share yours."
 motto_fm_confucian_250:0 "Share the people's worries, and they will share yours."
 motto_fm_confucian_251:0 "Look up without shame before Heaven, and down without shame before others."
 motto_fm_confucian_252:0 "I desire fish, and I also desire bear's paw."
 motto_fm_confucian_253:0 "If I cannot have both."
 motto_fm_confucian_254:0 "I would forgo the fish and choose the bear's paw."
 motto_fm_confucian_255:0 "I desire life."
 motto_fm_confucian_256:0 "I also desire righteousness."
 motto_fm_confucian_257:0 "I would forgo life and choose righteousness."
 motto_fm_confucian_258:0 "The way of learning is nothing other than this."
 motto_fm_confucian_259:0 "Recover the heart that has strayed."
 motto_fm_confucian_260:0 "Fully understand your heart, and you understand your nature."
 motto_fm_confucian_261:0 "Understand your nature, and you understand Heaven."
 motto_fm_confucian_262:0 "Preserve your heart and nourish your nature."
 motto_fm_confucian_263:0 "This is how to serve Heaven."
 motto_fm_confucian_264:0 "In adversity, do not lose righteousness; in success, do not leave the Way."
 motto_fm_confucian_265:0 "The gentleman has three joys."
 motto_fm_confucian_266:0 "Both parents alive, and brothers free from misfortune."
 motto_fm_confucian_267:0 "Look up without shame before Heaven."
 motto_fm_confucian_268:0 "Look down without shame before others."
 motto_fm_confucian_269:0 "Find the finest talents in the world and teach them."
 motto_fm_confucian_270:0 "People's failing is their eagerness to teach others."
 motto_fm_confucian_271:0 "Those endowed with virtue, wisdom, skill, and understanding."
 motto_fm_confucian_272:0 "Have often endured suffering and hardship."
 motto_fm_confucian_273:0 "Life is sustained through hardship."
 motto_fm_confucian_274:0 "To undertake something is like digging a well."
 motto_fm_confucian_275:0 "Dig nine fathoms without reaching water."
 motto_fm_confucian_276:0 "And it is still an abandoned well."
 motto_fm_confucian_277:0 "You cannot reason with those who harm themselves."
 motto_fm_confucian_278:0 "You cannot work with those who abandon themselves."
 motto_fm_confucian_279:0 "To speak against ritual and righteousness is to harm yourself."
 motto_fm_confucian_280:0 "To say, \"I cannot dwell in benevolence or follow righteousness.\""
 motto_fm_confucian_281:0 "Is to abandon yourself."
 motto_fm_confucian_282:0 "The benevolent love others."
 motto_fm_confucian_283:0 "Those who observe ritual respect others."
 motto_fm_confucian_284:0 "Those who love others are always loved in return."
 motto_fm_confucian_285:0 "Those who respect others are always respected in return."
 motto_fm_confucian_286:0 "Wealth and rank cannot corrupt you."
 motto_fm_confucian_287:0 "Poverty and low standing cannot sway you."
 motto_fm_confucian_288:0 "This is the way of a person of true stature."
 motto_fm_confucian_289:0 "Such a person is truly great."
 motto_fm_confucian_290:0 "I am skilled at nourishing my vast, flowing spirit."
 motto_fm_confucian_291:0 "This spirit is supremely great and supremely firm."
 motto_fm_confucian_292:0 "Nourish it through uprightness, without doing it harm."
 motto_fm_confucian_293:0 "And it fills the space between Heaven and Earth."
 motto_fm_confucian_294:0 "The heart's office is to think."
 motto_fm_confucian_295:0 "By thinking, you attain understanding."
 motto_fm_confucian_296:0 "Without thinking, you do not attain it."
 motto_fm_confucian_297:0 "Heaven is about to bestow a great charge."
 motto_fm_confucian_298:0 "Everyone has a heart that cannot bear others' suffering."
 motto_fm_confucian_299:0 "Compassion is the beginning of benevolence."
 motto_fm_confucian_300:0 "Shame and moral aversion are the beginning of righteousness."
 motto_fm_confucian_301:0 "Deference and humility are the beginning of ritual propriety."
 motto_fm_confucian_302:0 "A sense of right and wrong is the beginning of wisdom."
 motto_fm_confucian_303:0 "People have these four beginnings."
 motto_fm_confucian_304:0 "Just as they have four limbs."
 motto_fm_confucian_305:0 "Fully develop them, and you can protect all within the four seas."
 motto_fm_confucian_306:0 "Fail to develop them, and you cannot even serve your parents."
 motto_fm_confucian_307:0 "Draw on others to cultivate goodness."
 motto_fm_confucian_308:0 "That is helping others to do good."
 motto_fm_confucian_309:0 "Nothing is greater for the gentleman than helping others to do good."
 motto_fm_confucian_310:0 "The people are most precious."
 motto_fm_confucian_311:0 "The ruler is least important."
 motto_fm_confucian_312:0 "Everyone can become a Yao or a Shun."
 motto_fm_confucian_313:0 "Those who make the effort can achieve the same."
 motto_fm_confucian_314:0 "Even against ten million, I will go forward."
 motto_fm_confucian_315:0 "When your deeds leave your heart dissatisfied."
 motto_fm_confucian_316:0 "Your spirit falters."
 motto_fm_confucian_317:0 "It grows from accumulated acts of righteousness."
 motto_fm_confucian_318:0 "It cannot be seized through a single righteous act."
 motto_fm_confucian_319:0 "Advance deeply through the Way."
 motto_fm_confucian_320:0 "Seek understanding for yourself."
 motto_fm_confucian_321:0 "Understand it for yourself, and you dwell in it at ease."
 motto_fm_confucian_322:0 "Dwell in it at ease, and you draw on it deeply."
 motto_fm_confucian_323:0 "Draw on it deeply, and its source meets you wherever you turn."
 motto_fm_confucian_324:0 "Thus the gentleman seeks understanding for themself."
 motto_fm_confucian_325:0 "Learn broadly and explain in detail."
 motto_fm_confucian_326:0 "So that you may return to the essential principles."
