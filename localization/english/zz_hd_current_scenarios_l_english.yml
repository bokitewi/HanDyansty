l_english:
 bm_hd_253:0 "Jiang Wei's Northern Expedition"
 bm_hd_253_desc:0 "In the first month of the sixteenth year of Yanxi, at the New Year gathering in Hanshou, the Wei defector Guo Xun draws his blade and assassinates General-in-Chief Fei Yi. Since Chancellor Zhuge Liang's death, Jiang Wan and Fei Yi have governed in turn, giving the army rest and the people peace for nineteen years. Now only General of the Guard Jiang Wei still dreams of marching north.\n\nTo the north, in Luoyang, the young emperor Cao Fang sits on the throne, but the prestige of General-in-Chief Sima Shi and his father already overshadows the house of Cao. To the east, in Jianye, ten-year-old Sun Liang has just succeeded to the throne. Grand Tutor Zhuge Ke, fresh from defeating Wei at Dongxing, is committing the strength of the entire state to a northern campaign.\n\nThat summer, Jiang Wei marches out from Shiying and besieges Didao, while Zhuge Ke besieges Hefei Xincheng. Wei faces a crisis on both its eastern and western fronts.\n\n#bold The Chancellor's final ambition remains unfulfilled. Longyou or Huainan—which front will break first?#!"
 bm_hd_253_jiang_wei:0 "Jiang Wei"
 bm_hd_253_jiang_wei_subheading:0 "General of the Guard, Supervisor of Secretariat Affairs"
 bm_hd_253_jiang_wei_desc:0 "Jiang Wei was originally a general from Tianshui who surrendered and was personally taught the art of war by the Chancellor. While Fei Yi lived, each expedition was limited to ten thousand men. That restraint is now gone: all the armies of Hanzhong are in Jiang Wei's hands, and his great host is already marching on Didao."
 bm_hd_253_guo_huai:0 "Guo Huai"
 bm_hd_253_guo_huai_subheading:0 "General of Chariots and Cavalry, Military Commander of Yongzhou and Liangzhou"
 bm_hd_253_guo_huai_desc:0 "Guo Huai has defended Guanzhong and Longyou for more than thirty years, getting the better of both Zhuge Liang and Jiang Wei. Now past seventy, he faces Shu's armies crossing the Long Mountains once again."
 bm_hd_253_si_ma_shi:0 "Sima Shi"
 bm_hd_253_si_ma_shi_subheading:0 "General-in-Chief, Supervisor of Secretariat Affairs"
 bm_hd_253_si_ma_shi_desc:0 "After Sima Yi's death, his eldest son Sima Shi took command of the armies, and the affairs of court came under his control. He accepted responsibility for last winter's defeat at Dongxing, while Xiahou Xuan, Li Feng, and others are secretly plotting against him."
 bm_hd_253_cao_fang:0 "Cao Fang"
 bm_hd_253_cao_fang_subheading:0 "Emperor of Wei"
 bm_hd_253_cao_fang_desc:0 "Cao Fang ascended the throne at eight and is now twenty-two, yet he has never ruled in his own right. His trusted attendants urge him to remove the Sima clan. Success or failure hangs on a single decision."
 bm_hd_253_zhu_ge_ke:0 "Zhuge Ke"
 bm_hd_253_zhu_ge_ke_subheading:0 "Grand Tutor, Governor of Jingzhou and Yangzhou"
 bm_hd_253_zhu_ge_ke_desc:0 "Zhuge Ke, the eldest son of Zhuge Jin, was entrusted with the regency by Sun Quan's final decree. After routing Wei at Dongxing, he ignored the entire court's remonstrances and committed two hundred thousand men to march north and besiege Hefei Xincheng."
 bm_hd_253_guan_qiu_jian:0 "Guanqiu Jian"
 bm_hd_253_guan_qiu_jian_subheading:0 "General Who Guards the East, Military Commander of Yangzhou"
 bm_hd_253_guan_qiu_jian_desc:0 "Guanqiu Jian twice captured Goguryeo's capital at Wandu. Now he guards Huainan, where Wu's army is besieging Xincheng. Grateful to Cao Rui for recognizing his talents, he has long resented the Sima clan's monopoly on power."
 hd253_wu_name:0 "Wu"
 hd253_wu_name_adj:0 "Wu"
 SG_nianhao_jiaping:0 "Jiaping"
 SG_nianhao_jiaping_tt:0 "Meaning 'Beautiful Peace'#weak (Era name of Cao Fang, the young emperor of Wei)#!"
 SG_nianhao_yanxi:0 "Yanxi"
 SG_nianhao_yanxi_tt:0 "Meaning 'Continuing Radiance'#weak (Era name of Liu Shan, the Later Ruler of Han)#!"
 hd253_beifa_opening_cb_desc:0 "March out from Shiying and besiege Didao."
 hd253_beifa_cb_desc:0 "March out from Hanzhong, cross the Qinling Mountains, and fight Wei's frontier commanders to seize their lands."
 HD253_BEIFA_CB_NAME:0 "Northern Expedition to the Central Plains"
 HD253_BEIFA_WAR_NAME:0 "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')][ATTACKER.GetPrimaryTitle.GetAdjective] Northern Expedition to [TITLE.GetBaseName]"
 HD253_BEIFA_WAR_NAME_BASE:0 "[ATTACKER.GetPrimaryTitle.GetAdjective] Northern Expedition"
 hd253_beifa_cb_victory_desc_attacker:0 "You seize the contested lands."
 hd253_beifa_cb_victory_desc:0 "[attacker.GetShortUIName|U] seizes the contested lands."
 hd253_beifa_cb_white_peace_desc:0 "Both armies stand down, and the borders remain unchanged."
 hd253_beifa_cb_defeat_desc_defender:0 "You hold the contested lands."
 hd253_beifa_cb_defeat_desc:0 "[defender.GetShortUIName|U] holds the contested lands."
 HD253_HISTORY_WAR_CB_NAME:0 "Struggle of the Three Kingdoms"
 HD253_HISTORY_WAR_NAME:0 "[ATTACKER.GetPrimaryTitle.GetAdjective] Attack on [TITLE.GetBaseName]"
 hd253_history_war_victory_desc:0 "[attacker.GetShortUIName|U] seizes the contested lands."
 hd253_history_war_white_peace_desc:0 "Both sides stand down, and the borders remain unchanged."
 hd253_history_war_defeat_desc:0 "The attackers return empty-handed, and the borders remain unchanged."
 hd253_beifa_army_name:0 "Northern Expedition Army"
 hd253_beifa_army_toast:0 "The Northern Expedition Army Marches Out"
 hd253_qianghu_army_name:0 "Qiang and Hu Volunteers"
 hd253_xincheng_army_name:0 "Wu Army"
 hd253_rebel_army_name:0 "Army Against the Rebels"
 hd253_fashu_army_name:0 "Army of the Shu Campaign"
 hd253_zhuge_legacy_modifier:0 "Zhuge Liang's Legacy"
 hd253_zhuge_legacy_modifier_desc:0 "The Chancellor's military laws, agricultural colonies, and plank roads endure. The soldiers of Hanzhong still have the strength to fight."
 hd253_beifa_rest_modifier:0 "Resting the Army"
 hd253_beifa_rest_modifier_desc:0 "The army has only just returned. Its soldiers are exhausted and supplies have yet to arrive, making another campaign impossible for now."
 hd253_grain_shortage_modifier:0 "Failing Supplies"
 hd253_grain_shortage_modifier_desc:0 "Grain must travel a thousand li along the roads of Shu. The troops at the front are already on reduced rations, and dispatches demanding more grain reach the rear one after another."
 hd253.0010.t:0 "Marching Out from Shiying"
 hd253.0010.desc:0 "Fei Yi's funeral has barely ended when you submit your petition for troops. This time, no one at court stands in your way.\n\nTens of thousands of Shu soldiers march out from Shiying, cross the Long Mountains, and head straight for Didao, the seat of Longxi Commandery. Hearing the news, the Qiang and Hu tribes send envoys bearing wine and meat."
 hd253.0010.a:0 "I shall carry on the Chancellor's ambition."
 hd253.0020.t:0 "Besieging Xincheng"
 hd253.0020.desc:0 "After the great victory at Dongxing, you disregard the court officials' earnest remonstrances and levy two hundred thousand men from the provinces and commanderies to march north.\n\nThe army crosses Chao Lake and surrounds Hefei Xincheng. Zhang Te, the commander within, has no more than three thousand soldiers, yet for months he has refused to open the gates."
 hd253.0020.a:0 "Take this city, and Huainan can be subdued."
 hd253.0100.t:0 "The Qiang and Hu Join Us"
 hd253.0100.desc:0 "Word of your campaign in Longyou spreads. Tribal leaders from the Tao River and the Qiang lands arrive at your camp one after another, offering cavalry to aid your cause. They ask only for rewards."
 hd253.0100.a:0 "Reward them generously and enlist their cavalry."
 hd253.0100.b:0 "Hu cavalry are hard to control. We have no need of them."
 hd253.0110.t:0 "Out of Grain"
 hd253.0110.desc:0 "The army has been on campaign for eight months. Grain carts from Hanzhong take a month to reach you, and little remains by the time they arrive. Soldiers have begun slaughtering horses for food. Your generals come to ask: do we keep fighting?"
 hd253.0110.a:0 "The grain is gone. Withdraw the army."
 hd253.0110.b:0 "Hold on a little longer. Our fortunes will turn."
 hd253.0120.t:0 "A Wei General Surrenders"
 hd253.0120.desc:0 "[hd253_defector.GetName] has long been frustrated in Wei's service. Seeing the strength of your advance, the general arrives at your camp gate with a few personal retainers and asks to surrender."
 hd253.0120.desc_none:0 "Wei's army withdraws, leaving all the contested lands in your hands. As the spoils are counted in camp, a rare look of joy appears on your soldiers' faces."
 hd253.0120.a:0 "Receive the general with courtesy and a place in my command."
 hd253.0120.b:0 "Return with the lands won in this campaign."
 hd253.0200.t:0 "Sun Jun's Banquet"
 hd253.0200.desc:0 "You returned from the New City with nothing to show for the campaign, and grievances now ring out at court and across the realm. Back in Jianye, Sun Jun, General of the Military Guard, invites you to a banquet in the palace.\n\nAs you prepare to leave, your clothes become wet for no apparent reason, and your dog seizes the hem of your robe and refuses to let go."
 hd253.0200.a:0 "Attend the banquet in the palace."
 hd253.0200.b:0 "Plead illness and stay away."
 hd253.0300.t:0 "A Question of Deposition"
 hd253.0300.desc:0 "The plot against you by Li Feng, Director of the Palace Secretariat, and Xiahou Xuan, Minister of Ceremonies, has been exposed. You have already imprisoned and executed them both. But Emperor Cao Fang was in league with them, and some in the palace still urge him to strip you of your military command.\n\nYour uncle Sima Fu and the others look to you, waiting for your word."
 hd253.0300.a:0 "Depose the emperor and make him Prince of Qi; enthrone the Duke of Gaogui."
 hd253.0300.b:0 "Deposing him now may cost me the people's support."
 hd253.0305.t:0 "A Question of Deposition"
 hd253.0305.desc:0 "The plot against Sima Shi by Li Feng, Director of the Palace Secretariat, and Xiahou Xuan, Minister of Ceremonies, has been exposed. Sima Shi has imprisoned them both. Now he enters the palace bearing the empress dowager's decree, demanding that you abdicate and become Prince of Qi so that the Duke of Gaogui can take the throne.\n\nArmored soldiers fill the hall. Your attendants keep their heads bowed."
 hd253.0305.a:0 "Endure the humiliation and abdicate to save my life."
 hd253.0305.b:0 "I am the Son of Heaven! How can I suffer such humiliation?"
 hd253.0310.t:0 "Reduced to Prince of Qi"
 hd253.0310.desc:0 "By order of the empress dowager, Sima Shi has deposed you and made you Prince of Qi. As you leave Taiji Hall, some of the officials seeing you off cover their faces and weep, but not one dares step forward to speak."
 hd253.0310.a:0 "(Climb into the carriage in silence.)"
 hd253.0400.t:0 "Huainan Rises"
 hd253.0400.desc:0 "Sima Shi has taken it upon himself to depose one emperor and enthrone another. The late emperor treated you with great favor; you cannot stand idly by. Wen Qin, Inspector of Yangzhou, is willing to join you in this undertaking.\n\nForge a decree from the empress dowager and send proclamations throughout the realm, and the armies of Huainan can rise together."
 hd253.0400.a:0 "Forge the dowager's decree and rise against the Sima clan."
 hd253.0400.b:0 "The time has not come. Bide my time in silence."
 hd253.0500.t:0 "Zhuge Dan Rises"
 hd253.0500.desc:0 "You have seen the fates of Guanqiu Jian, Xiahou Xuan, and Wang Ling. Now the Sima clan summons you to court as Minister of Works. You know that if you go, you will never return.\n\nYou command more than a hundred thousand troops in Huainan, and Wu is willing to send reinforcements."
 hd253.0500.a:0 "Gather the troops, hold our ground, and seek aid from Wu."
 hd253.0500.b:0 "Obey the decree and go to court."
 hd253.0505.t:0 "Zhuge Dan Seeks Aid"
 hd253.0505.desc:0 "The Wei general [hd253_rebel.GetName] has risen against the Sima clan and sent his chief clerk to Jianye. He offers to make Huainan a buffer for Wu, asking only that you send troops to save him."
 hd253.0505.a:0 "Send troops to his aid."
 hd253.0505.b:0 "Watch and wait for the outcome."
 hd253.0600.t:0 "The General-in-Chief Dies"
 hd253.0600.desc:0 "Sima Shi has died of illness in the army camp at Xuchang. His younger brother Sima Zhao has led the troops back to the outskirts of Luoyang. The court awaits your decree: who will serve as regent?"
 hd253.0600.a:0 "Appoint Sima Zhao General-in-Chief and continue the regency."
 hd253.0600.b:0 "I shall take charge of the court myself."
 hd253.0610.t:0 "A Brother's Successor"
 hd253.0610.desc:0 "Your elder brother Sima Shi has died of illness at Xuchang. The troops under his command and his allies at court are all waiting for your word."
 hd253.0610.a:0 "Take up my brother's office and serve as the emperor's regent."
 hd253.0610.b:0 "Decline the appointment."
 hd253.0510.t:0 "Jiang Wei Besieges Didao"
 hd253.0510.desc:0 "Han's General of the Guard [hd_news_a.GetName] has marched into Longyou and laid siege to Didao, defended by [hd_news_b.GetName]."
 hd253.0520.t:0 "Zhuge Ke Besieges the New City"
 hd253.0520.desc:0 "Wu's Grand Tutor [hd_news_a.GetName] has led a great army against Hefei's New City. [hd_news_b.GetName] has shut the gates and holds firm."
 hd253.0530.t:0 "Zhuge Ke Killed"
 hd253.0530.desc:0 "Wu's Grand Tutor [hd_news_a.GetName] entered the palace for a banquet and was cut down by troops that [hd_news_b.GetName] had stationed in ambush."
 hd253.0540.t:0 "Sima Shi Deposes the Emperor"
 hd253.0540.desc:0 "Wei's General-in-Chief [hd_news_a.GetName] has deposed Emperor [hd_news_b.GetName] by order of the empress dowager and enthroned Cao Mao, Duke of Gaogui, in his place."
 hd253.0550.t:0 "Huainan Rises"
 hd253.0550.desc:0 "Wei's General Who Guards the East [hd_news_a.GetName] has risen in Huainan, denouncing [hd_news_b.GetName]."
 hd253.0560.t:0 "Zhuge Dan Rises"
 hd253.0560.desc:0 "The Wei general [hd_news_a.GetName] has risen in Huainan and broken with [hd_news_b.GetName]. Wu has sent troops to his aid."
 hd253.0700.t:0 "Sima Zhao's Ambition"
 hd253.0700.desc:0 "Sima Zhao grows more domineering by the day. At court, men acknowledge only the General-in-Chief and forget the emperor. You summon Palace Attendant Wang Shen, Secretariat Minister Wang Jing, and Regular Cavalier Attendant Wang Ye, and speak the words: Sima Zhao's ambition is known to every passerby.\n\nWang Jing urges you to be patient. But you will no longer sit and wait to be deposed."
 hd253.0700.a:0 "I would rather die than become Duke of Changdao."
 hd253.0700.b:0 "Endure a little longer."
 hd253.0705.t:0 "The South Gate Crisis"
 hd253.0705.desc:0 "The emperor has drawn his sword and marched out of the palace against you, personally leading several hundred palace guards and servants. Jia Chong, Commander of the Central Guard, leads troops to confront him beneath the south gate towers. Cheng Ji, an attendant to the crown prince, asks Jia Chong what he should do.\n\nJia Chong turns to look at you."
 hd253.0705.a:0 "My lord has maintained you all for this very day."
 hd253.0705.b:0 "Seize the emperor, but spare his life."
 hd253.0710.t:0 "Plans to Conquer Shu"
 hd253.0710.desc:0 "The eunuch Huang Hao holds sway in Shu. Jiang Wei has withdrawn to farm at Tazhong to escape trouble, leaving the fortified camps of Hanzhong thinly defended. Zhong Hui, Colonel Director of Retainers, and Deng Ai, General Who Conquers the West, both say the time has come.\n\nSome at court still counsel caution, warning of the perilous roads into Shu."
 hd253.0710.a:0 "Zhong Hui through Luo Valley, Deng Ai toward Tazhong. Advance on separate routes."
 hd253.0710.b:0 "The roads into Shu are perilous. Let us delay our plans."
 hd253.0720.t:0 "The Surrender of Chengdu"
 hd253.0720.desc:0 "Wei's army has reached the city walls. Qiao Zhou, Grandee of Splendid Happiness, urges you to surrender. Liu Chen, Prince of Beidi, weeps as he begs you to fight with the city at your back, so that ruler and ministers may die together for the realm."
 hd253.0720.a:0 "Bring a coffin and surrender to spare the people."
 hd253.0720.b:0 "Fight with the city at our backs!"
 hd253.0570.t:0 "Cao Mao Murdered"
 hd253.0570.desc:0 "Wei's Emperor [hd_news_b.GetName] personally led the palace guards against General-in-Chief [hd_news_a.GetName] and was murdered beneath the south gate towers. Cao Huan, Duke of Changdao, has been brought in and enthroned."
 hd253.0580.t:0 "Wei Invades Shu"
 hd253.0580.desc:0 "Wei has sent a great army against Shu. Zhong Hui and Deng Ai advance on separate routes, and Han's Emperor [hd_news_b.GetName] faces imminent ruin."
 hd253.0590.t:0 "The Han Emperor Surrenders"
 hd253.0590.desc:0 "Han's Emperor [hd_news_a.GetName] has come out to surrender, bringing a coffin with him. After forty-three years, the state of Shu Han has passed into Wei's hands."
 bm_hd_304:0 "A King Rises in Zuoguo"
 bm_hd_304_desc:0 "In the first year of Jianwu, the eight princes have been fighting one another for almost four years. Ying, Prince of Chengdu, has lost Ye and fled to Luoyang with Emperor Hui, only to fall under the control of Zhang Fang, a general serving Yong, Prince of Hejian. Yue, Prince of Donghai, has withdrawn to Donghai. Wang Jun of Youzhou has brought Xianbei and Wuhuan forces south, while Sima Teng of Bingzhou has also sought support from non-Han cavalry. The Son of Heaven is trapped in Luoyang, his commands reaching no farther than the palace gates.\n\nThat October, Liu Yuan, the Xiongnu Left Wise King, returns to Zuoguo City, where the people of the Five Divisions acclaim him as Great Chanyu. He builds an altar in the southern suburbs, proclaims himself King of Han, and posthumously honors the last ruler of Shu, rallying followers to restore the Han dynasty. In the same month, Li Xiong proclaims himself King of Chengdu.\n\n#bold The Jin dynasty fractures, and the upheaval of the Five Peoples begins.#!"
 bm_hd_304_liu_yuan:0 "Liu Yuan"
 bm_hd_304_liu_yuan_subheading:0 "King of Han, Great Chanyu"
 bm_hd_304_liu_yuan_desc:0 "Liu Yuan, courtesy name Yuanhai, descends from the chanyus of the Southern Xiongnu. As a young hostage in Luoyang, he read widely in the classics and histories and formed ties with many Jin ministers and nobles. Ying, Prince of Chengdu, allowed him to return to Bingzhou, but he proclaimed himself King of Han in Zuoguo City. He holds only a corner of Xihe and the cavalry of the Five Divisions, while Sima Teng's great army is already marching north."
 bm_hd_304_si_ma_teng:0 "Sima Teng"
 bm_hd_304_si_ma_teng_subheading:0 "Duke of Dongying, Inspector of Bingzhou"
 bm_hd_304_si_ma_teng_desc:0 "The younger brother of Yue, Prince of Donghai, holds Jinyang. Bingzhou has suffered years of famine, and Liu Yuan has now raised troops in Xihe. Teng's general Nie Xuan has already marched on Daling. Tuoba Yituo to the north is willing to send reinforcements, but whether Bingzhou can be held depends entirely on this battle."
 bm_hd_304_si_ma_yong:0 "Sima Yong"
 bm_hd_304_si_ma_yong_subheading:0 "Prince of Hejian, Military Commander of Guanzhong"
 bm_hd_304_si_ma_yong_desc:0 "Based in Chang'an, he has stationed his general Zhang Fang and an army in Luoyang, leaving the Son of Heaven effectively in his hands. Ying, Prince of Chengdu, has just been defeated, and Yue, Prince of Donghai, is far away in Donghai. Guanzhong is strongest for now, but the other princes are all waiting for him to make a mistake."
 bm_hd_304_si_ma_ying:0 "Sima Ying"
 bm_hd_304_si_ma_ying_subheading:0 "Prince of Chengdu, Heir Apparent and Younger Brother of the Emperor"
 bm_hd_304_si_ma_ying_desc:0 "He captured the Son of Heaven at the Battle of Dangyin and rose to the status of the emperor's younger brother and heir apparent. Yet in August, Wang Jun took Ye. Ying fled to Luoyang with the emperor, only to fall into Zhang Fang's hands. His former followers in Hebei still remember him fondly. Whether he can recover his fortunes depends on how many are still willing to take up arms for him."
 bm_hd_304_si_ma_yue:0 "Sima Yue"
 bm_hd_304_si_ma_yue_subheading:0 "Prince of Donghai"
 bm_hd_304_si_ma_yue_desc:0 "In July, he took the Son of Heaven north on a campaign against Ye, suffered a crushing defeat at Dangyin, and fled alone on horseback to his principality of Donghai. His two younger brothers command Bingzhou and Qingzhou, and Wang Jun of Youzhou also stands with him. If he can rebuild his army, he may yet be the next to enter Luoyang and govern on the emperor's behalf."
 bm_hd_304_wang_jun:0 "Wang Jun"
 bm_hd_304_wang_jun_subheading:0 "Commander of All Military Affairs in Youzhou"
 bm_hd_304_wang_jun_desc:0 "A member of the Wang clan of Taiyuan, he married his daughter to Wuwuchen, leader of the Duan Xianbei, and commands Xianbei and Wuhuan cavalry. In August, he took Ye and returned with vast plunder. No one in Hebei can stand against him now."
 bm_hd_304_li_xiong:0 "Li Xiong"
 bm_hd_304_li_xiong_subheading:0 "King of Chengdu"
 bm_hd_304_li_xiong_desc:0 "He is the son of Li Te, leader of the displaced Ba-Di people. After his father and uncle fell in battle one after the other, he took command of their followers, captured Chengdu, and drove out Luo Shang, Inspector of Yizhou. In October, he proclaimed himself King of Chengdu. Luo Shang still holds Ba Commandery, and Shu has yet to be pacified."
 bm_hd_304_zhang_gui:0 "Zhang Gui"
 bm_hd_304_zhang_gui_subheading:0 "Inspector of Liangzhou"
 bm_hd_304_zhang_gui_desc:0 "A member of the Zhang clan of Anding, he has governed from Guzang for three years, founding schools and subduing the Xianbei. Liangzhou enjoys peace. While the princes of the Central Plains fight one another, Hexi has become a refuge for scholars and commoners alike."
 bm_hd_304_shi_le:0 "Shi Le"
 bm_hd_304_shi_le_subheading:0 "A Jie Man Sold into Slavery"
 bm_hd_304_shi_le_desc:0 "A Jie man from Wuxiang in Shangdang. During the famine in Bingzhou, Sima Teng seized non-Han people and sold them in Shandong to buy provisions for his army. Shi Le was among them, sold into slavery in Chiping. He has befriended Ji Sang, a leader of herdsmen, and gathered a dozen or so mounted companions around him. They are waiting for the realm to descend into chaos."
 bm_hd_304_liu_kun:0 "Liu Kun"
 bm_hd_304_liu_kun_subheading:0 "Retainer of the Prince of Fanyang"
 bm_hd_304_liu_kun_desc:0 "Liu Kun of Zhongshan, courtesy name Yueshi, shared a bed with Zu Ti in his youth; at the sound of the rooster, they would rise to practice swordplay. He was counted among the Twenty-Four Friends of the Golden Valley. He now serves in the retinue of Sima Xiao, Prince of Fanyang. If Bingzhou falls, few men at court will be able to salvage the situation."
 d_hd_304_shile_camp:0 "Shi Le's Followers"
 d_hd_304_shile_camp_adj:0 "Shi Le"
 d_hd_304_liukun_camp:0 "Liu Kun's Retinue"
 d_hd_304_liukun_camp_adj:0 "Liu Kun"
 hd_304_wubu_army_name:0 "Xiongnu of the Five Divisions"
 hd_304_shile_army_name:0 "Shi Le's Troops"
 hd_304_yongjia_army_name:0 "Han Army"
 hd_304_mandate_lock_tt:0 "The War of the Eight Princes is raging. The princes pay nominal tribute, but each commands his own army and pursues his own power. The Son of Heaven's commands reach no farther than Luoyang (the age of disorder can only be ended after the Yongjia upheaval)."
 SG_nianhao_yuanxi:0 "Yuanxi"
 SG_nianhao_yuanxi_tt:0 "Meaning 'the dawn of a bright beginning'#weak (Liu Yuan's era name in Han-Zhao)#!"
 hd_304.0110.t:0 "Taking Command in Jianye"
 hd_304.0110.desc:0 "Yue, Prince of Donghai, submits a memorial requesting that Rui, Prince of Langye, be appointed General Who Pacifies the East and Commander of All Military Affairs in Yangzhou, and sent to take command in Jianye. His adviser Wang Dao says that Jiangdong is prosperous: if the north is thrown into turmoil, it could preserve a foothold."
 hd_304.0110.a:0 "Approved. The Prince of Langye shall depart south at once."
 hd_304.0110.b:0 "Too many imperial kinsmen already hold regional commands. Denied."
 hd_304.0120.t:0 "Seeking Liu Yuan's Protection"
 hd_304.0120.desc:0 "Ji Sang has been defeated, and his companions have scattered. Hearing that Liu Yuan is recruiting men of ability in Hedong, you discuss it with Zhang Beidu. Why not join him and use Han's troops to carve out a realm?"
 hd_304.0120.a:0 "Join the King of Han."
 hd_304.0120.b:0 "Make my own way. I will depend on no one."
 hd_304.0121.t:0 "A Non-Han General Offers His Service"
 hd_304.0121.desc:0 "Shi Le, a Jie man, arrives with his followers and offers to conquer Hebei for Han. He is fierce in battle and full of stratagems. Accept him, and Jizhou could be gained without a fight; yet he is no Xiongnu and may not obey your orders in the future."
 hd_304.0121.a:0 "Accept him and appoint him General Who Supports Han."
 hd_304.0121.b:0 "Turn him away."
 hd_304.0130.t:0 "Ascending the Imperial Throne"
 hd_304.0130.desc:0 "Four years have passed since the King of Han took the throne. Hedong and Pingyang have submitted in succession, and the ministers jointly urge him to assume the imperial title. The Director of the Grand Scribes reports auspicious purple vapors over Pingyang: the capital could be established there."
 hd_304.0130.a:0 "Ascend the imperial throne and proclaim the Yongfeng era."
 hd_304.0130.b:0 "The time has not come. Remain King of Han."
 hd_304.0140.t:0 "Besieging Luoyang"
 hd_304.0140.desc:0 "The princes of Jin have fought one another for years, exhausting the military strength of the lands east of the passes. Luoyang is short of grain. The Son of Heaven has tried several times to leave the city and seek refuge, but has never managed to escape.\n\nThe generals all say that now is the time to take Luoyang."
 hd_304.0140.a:0 "Send Liu Yao, Wang Mi, and Shi Le to surround Luoyang."
 hd_304.0140.b:0 "Wait a little longer."
 bm_hd_group_sanguo:0 "The Three Kingdoms"
 hd_hb_choice_title:0 "Under the Han"
 hd_hb_choice_desc:0 "The coalition against Dong Zhuo has dissolved. The court's commands remain, but the bonds between those above and those below grow looser by the day.\n\nI look down at the papers on my desk. Will I continue to serve [hd_hb_choice_liege.GetTitledFirstName] as my liege, or make my own decisions from now on? This choice will determine my realm's allegiance."
 hd_hb_choice_independence:0 "From now on, I will make my own decisions."
 hd_hb_choice_stay:0 "I will continue to obey my liege."
 hd_qixing_jia_name:0 "Unusual Armor"
 hd_qixing_jia_desc:0 "An ancient suit of armor of unusual design. Its broad shoulder guards and overlapping plates are laced together with cords, and its helmet and leg guards have survived with it. Though its origins can no longer be traced, its thorough protection and intricate craftsmanship still inspire wonder."
 hd_qixing_dao_name:0 "Unusual Saber"
 hd_qixing_dao_desc:0 "A long saber of unusual design, with a slightly curved blade, a keen single edge, and a long grip suited to two-handed use. No one knows who forged it. Though the years have passed, its edge remains sharp."
 hd_yellow_turban_rebellion_war:0 "Yellow Turban Rebellion"
