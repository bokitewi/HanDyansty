 building_type_hd_wancheng_city_01:0 "Wancheng"
 building_type_hd_wancheng_city_01_desc:0 "Wan is the seat of Nanyang Commandery, a thriving center of ironworking and trade. Under Wang Mang it ranked with Luoyang, Handan, Linzi, and Chengdu as one of the realm’s five great cities. Emperor Guangwu rose to power in Nanyang. The commandery holds many families of meritorious officials and imperial relatives, earning it the name “the Emperor’s Homeland.”"
