l_english:
 hd_qixing_baodao_name:0 "Seven-Star Treasure Blade"
 hd_qixing_baodao_description:0 "The blade is slender and long, with a sharp spine that rises and falls in undulating waves; the guard is adorned with patterns resembling a constellation. It is said that Wang Yun kept this blade hidden within his residence, waiting for one worthy of bearing the weight of the world to wield it against the traitors of the state."
