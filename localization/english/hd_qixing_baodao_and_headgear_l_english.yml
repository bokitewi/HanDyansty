l_english:
 hd_qixing_baodao_name:0 "Seven-Star Precious Saber"
 hd_qixing_baodao_description:0 "The long blade has a sweeping edge and spine, and the ornaments on its guard form a pattern like seven stars. Cold light flashes from it when it is drawn. Said to be a treasured possession of the Wang clan of Taiyuan, this peerless saber can cut through iron as though it were mud."
