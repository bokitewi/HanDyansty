 motto_fm_buddhist_279:0 "High mountains and long waters; flowing water never rots."
 motto_fm_buddhist_280:0 "Time flows on like a river, never ceasing day or night."
 motto_fm_buddhist_281:0 "Time flies like an arrow; days and months pass like a shuttle."
 motto_fm_buddhist_282:0 "An inch of time is worth an inch of gold."
 motto_fm_buddhist_283:0 "Time waits for no one; the moment is fleeting."
 motto_fm_buddhist_284:0 "Seize the moment and live in the present."
 motto_fm_buddhist_285:0 "Do not let time slip away; cherish every step along the way."
 motto_fm_buddhist_286:0 "Life is like a temporary lodging; existence is as fleeting as a dream."
 motto_fm_buddhist_287:0 "Illusions like dreams, bubbles, shadows, dew, and lightning."
 motto_fm_buddhist_288:0 "The world is like a game of chess; life is like tea."
 motto_fm_buddhist_289:0 "A mixture of joy and sorrow; a blend of grief and happiness."
 motto_fm_buddhist_290:0 "Ordinary mind is the Way; every day is a good day."
 motto_fm_buddhist_291:0 "Everywhere is a place of practice."
 motto_fm_buddhist_292:0 "Firewood, rice, oil, and salt are all part of the cultivation."
 motto_fm_buddhist_293:0 "Carrying water and chopping wood are no less than the sublime Dao."
 motto_fm_buddhist_294:0 "Eating and dressing are both manifestations of Zen."
 motto_fm_buddhist_295:0 "Walking, staying, sitting, and lying down are all practices of cultivation."
 motto_fm_buddhist_296:0 "Zen Tea, One Flavor; Tea Zen, One Taste"
 motto_fm_buddhist_297:0 "One Meeting, One Moment; Eternity in an Instant"
 motto_fm_buddhist_298:0 "One flower, one world; one leaf, one Bodhi."
 motto_fm_buddhist_299:0 "One sand grain, one world; a single thought, pure and serene."
 motto_fm_buddhist_300:0 "One good deed is a Bodhi; one act of practice is cultivation."
 motto_fm_buddhist_301:0 "The heart is like a clear mirror; it must be diligently polished at all times."
 motto_fm_buddhist_302:0 "Clear mirror, still water; heart like still water."
 motto_fm_buddhist_303:0 "The surface remains calm while the waters beneath run deep."
 motto_fm_buddhist_304:0 "Kindness flows like water, nourishing all things."
 motto_fm_buddhist_305:0 "Softness overcomes hardness; gentleness conquers strength."
 motto_fm_buddhist_306:0 "Showing weakness is not true weakness; it is a strategy to compete."
 motto_fm_buddhist_307:0 "Stick to simplicity, embrace the unadorned, return to nature's truth."
 motto_fm_buddhist_308:0 "See simplicity and embrace the unadorned; possess little self-interest and few desires."
 motto_fm_buddhist_309:0 "Maintain tranquility and self-discipline; cultivate virtue through stillness."
 motto_fm_buddhist_310:0 "Practice frugality to cultivate virtue; embrace simplicity to clarify one's aspirations."
 motto_fm_buddhist_311:0 "Without simplicity and detachment, one cannot clarify their aspirations."
 motto_fm_buddhist_312:0 "Without tranquility, one cannot attain greatness."
 motto_fm_buddhist_313:0 "Read ten thousand volumes of books and travel ten thousand miles."
 motto_fm_buddhist_314:0 "The sea of knowledge has no shore; learning knows no bounds."
 motto_fm_buddhist_315:0 "Learn until you die."
 motto_fm_buddhist_316:0 "Learn from the past to understand the present, and follow what is good."
 motto_fm_buddhist_317:0 "Among three people walking together, there will be someone who can serve as my teacher."
 motto_fm_buddhist_318:0 "See the virtuous and strive to match them; see the unworthy and reflect upon oneself."
 motto_fm_buddhist_319:0 "The gentleman reflects upon himself three times a day."
 motto_fm_buddhist_320:0 "To know one's mistakes and correct them is the greatest of virtues."
 motto_fm_buddhist_321:0 "Committing a fault but correcting it shows true repentance and renewal."
 motto_fm_buddhist_322:0 "A prodigal son who turns back is worth more than gold."
 motto_fm_buddhist_323:0 "Lay down the butcher's knife and become a Buddha right here on earth."
 motto_fm_buddhist_324:0 "The bitter sea has no bounds; turning back leads to the shore."
 motto_fm_buddhist_325:0 "Return from the wrong path; rein in at the cliff's edge."
 motto_fm_buddhist_326:0 "It is never too late to mend the fold after losing sheep."
 motto_fm_buddhist_327:0 "Start from scratch and rise again in the east."
 motto_fm_buddhist_328:0 "After the rain clears and the sky brightens, a rebound occurs at the bottom."
 motto_fm_buddhist_329:0 "Resurrection from the brink of death; a sudden turn of fortune where willows darken and flowers brighten."
 motto_fm_buddhist_330:0 "Mountains rise in layers, waters repeat their course; one doubts there is a path ahead, yet suddenly, amidst the shade of willows and brightness of flowers, another village appears."
 motto_fm_buddhist_331:0 "When the carriage reaches the mountain's front, there will always be a road ahead."
 motto_fm_buddhist_332:0 "When the boat reaches the bridge, it naturally straightens itself out."
 motto_fm_buddhist_333:0 "There is no dead end for humanity."
 motto_fm_buddhist_334:0 "As long as the green hills remain, there is no fear of running out of firewood."
 motto_fm_buddhist_335:0 "When a person passes, their name remains; when a goose flies by, its sound lingers."
 motto_fm_buddhist_336:0 "Your name shall be recorded in history, your legacy will endure through the ages."
 motto_fm_buddhist_337:0 "Though dead, their spirit lives on forever."
 motto_fm_buddhist_338:0 "Green pines and verdant cypress remain evergreen through the cold of winter."
 motto_fm_buddhist_339:0 "A strong wind reveals the tough grass; a fierce fire tests the true gold."
 motto_fm_buddhist_340:0 "True gold fears not the fire's test."
 motto_fm_buddhist_341:0 "The road reveals the strength of a horse; time reveals the heart of a person."
 motto_fm_buddhist_342:0 "True friendship is revealed in times of hardship; sending charcoal when it snows."
 motto_fm_buddhist_343:0 "Relieve the distressed, support the endangered, uphold righteousness, and generously part with wealth."
 motto_fm_buddhist_344:0 "Acting bravely to help others and drawing a sword to assist them"
 motto_fm_buddhist_345:0 "Warm-hearted and generous in giving to the good"
 motto_fm_buddhist_346:0 "Accumulate virtue and do good to others"
 motto_fm_buddhist_347:0 "Promote the good in others by extending oneself to them."
 motto_fm_buddhist_348:0 "Do not do to others what you do not wish for yourself."
 motto_fm_buddhist_349:0 "Treat others as you would like to be treated, and repay ingratitude with kindness."
 motto_fm_buddhist_350:0 "Enemies should be reconciled rather than estranged."
 motto_fm_buddhist_351:0 "Turn spears into jade and silk"
 motto_fm_buddhist_352:0 "Let others off when you can."
 motto_fm_buddhist_353:0 "Great volume brings great fortune; a prime minister's stomach can hold a boat."
 motto_fm_buddhist_354:0 "With tolerance, virtue becomes great; without desire, the mind finds peace."
 motto_fm_buddhist_355:0 "Contentment brings lasting joy; endurance ensures inner peace."
 motto_fm_buddhist_356:0 "A small lack of patience can disrupt a grand plan."
 motto_fm_buddhist_357:0 "A hundred acts of patience make gold; harmony brings wealth."
 motto_fm_buddhist_358:0 "Harmony at home brings prosperity to all; united brothers achieve great success."
 motto_fm_buddhist_359:0 "Unity is strength; the whole people stand as one."
 motto_fm_buddhist_360:0 "United in heart and spirit, sharing weal and woe together"
 motto_fm_buddhist_361:0 "Share the same boat in adversity and stand together through hardships."
 motto_fm_buddhist_362:0 "Mutual aid and harmony among neighbors"
 motto_fm_buddhist_363:0 "A distant relative is not as good as a near neighbor."
 motto_fm_buddhist_364:0 "Proximity to cinnabar makes one red; proximity to ink makes one black."
 motto_fm_buddhist_365:0 "Birds of a feather flock together; people of a kind gather in groups."
 motto_fm_buddhist_366:0 "Closely associating with the virtuous brings wisdom; choose what is good and follow it."
 motto_fm_buddhist_367:0 "Accept good advice readily and take pleasure in hearing of one's faults."
 motto_fm_buddhist_368:0 "Humility brings progress; arrogance leads to decline."
 motto_fm_buddhist_369:0 "Modesty brings benefit; arrogance invites loss."
 motto_fm_buddhist_370:0 "Humble as a valley, a model of gentlemanly virtue."
 motto_fm_buddhist_371:0 "Warm and gentle as jade, a gentleman refined like jade."
 motto_fm_buddhist_372:0 "Modest, amiable, and well-mannered"
 motto_fm_buddhist_373:0 "Refined in demeanor and well-read with poetry and books."
 motto_fm_buddhist_374:0 "Poetry and classics passed down through the family; farming and reading passed down through the family."
 motto_fm_buddhist_375:0 "Frugality and diligence in managing the household; integrity and honesty passed down through generations."
 motto_fm_buddhist_376:0 "A family that accumulates good deeds will inevitably have blessings left over."
 motto_fm_buddhist_377:0 "A house that has accumulated evil will inevitably be left with lingering calamity."
 motto_fm_buddhist_378:0 "Fatherly kindness, filial piety, brotherly love, and fraternal respect."
 motto_fm_buddhist_379:0 "The husband leads and the wife follows; they hold their trays level with each other's brows."
 motto_fm_buddhist_380:0 "Respect each other like guests, grow old together in harmony."
 motto_fm_buddhist_381:0 "A century of harmony, like the zither and lute playing in perfect unison."
 motto_fm_buddhist_382:0 "Flowers bloom, the moon is full, and the years are peaceful."
 motto_fm_buddhist_383:0 "Peace and joy in this world"
 motto_fm_buddhist_384:0 "Longevity, health, prosperity, and a hundred years of life"
 motto_fm_buddhist_385:0 "May your life be as long as Mount Nan and your fortune as vast as the Eastern Sea."
 motto_fm_buddhist_386:0 "Longevity of the Pine and Crane; Five Blessings Arrive at the Door"
 motto_fm_buddhist_387:0 "A thousand auspicious signs gather, and ten thousand blessings arrive in abundance."
 motto_fm_buddhist_388:0 "Purple Qi arrives from the east, auspiciousness fills the gate."
 motto_fm_buddhist_389:0 "Auspicious stars shine brightly; good fortune is at its peak."
 motto_fm_buddhist_390:0 "Fortune turns, bitterness ends, sweetness returns."
 motto_fm_buddhist_391:0 "Bitterness first, sweetness later; endure the bitterness within the bitterness."
 motto_fm_buddhist_392:0 "The sharp edge of a sword is forged through grinding; the fragrance of plum blossoms comes from enduring bitter cold."
 motto_fm_buddhist_393:0 "How can one attain the fragrance of plum blossoms without enduring the biting cold?"
 motto_fm_buddhist_394:0 "Without polishing, jade remains unformed; without learning, one remains ignorant of righteousness."
 motto_fm_buddhist_395:0 "Ten years to sharpen a sword; one minute on stage, ten years of effort behind the scenes."
 motto_fm_buddhist_396:0 "Three feet of ice is not formed in a single day."
 motto_fm_buddhist_397:0 "A journey of a thousand miles begins with a single step."
 motto_fm_buddhist_398:0 "Without accumulating small steps, one cannot reach a thousand li."
 motto_fm_buddhist_399:0 "Without accumulating small streams, one cannot form a river or sea."
 motto_fm_buddhist_400:0 "Gather sand to build a tower; collect underarm fat to make a fur coat."
 motto_fm_buddhist_401:0 "Accumulate strength to unleash power later; conserve energy and sharpen resolve."
 motto_fm_buddhist_402:0 "Observe the situation calmly to control it through stillness."
 motto_fm_buddhist_403:0 "Wait for the enemy to tire before striking decisively."
 motto_fm_buddhist_404:0 "Prepare in advance to prevent trouble before it arises."
 motto_fm_buddhist_405:0 "Think of danger in times of peace; preparedness prevents trouble."
 motto_fm_buddhist_406:0 "A warning from the past is a lesson for the future."
 motto_fm_buddhist_407:0 "Learn from one's mistakes."
 motto_fm_buddhist_408:0 "Failure is the mother of success."
 motto_fm_buddhist_409:0 "Victory does not breed arrogance; defeat does not breed despair."
 motto_fm_buddhist_410:0 "An arrogant army is sure to fail; a grieving army is sure to win."
 motto_fm_buddhist_411:0 "Know yourself and know your enemy; in a hundred battles you will never be in peril."
 motto_fm_buddhist_412:0 "A craftsman must first sharpen his tools before he can do his work well."
 motto_fm_buddhist_413:0 "Sharpening the axe does not delay the woodcutting."
 motto_fm_buddhist_414:0 "Twice the results with half the effort; adapt measures to local conditions."
 motto_fm_buddhist_415:0 "Follow the momentum and act in accordance with the situation."
 motto_fm_buddhist_416:0 "Leverage others' strength to move a thousand pounds with two ounces."
 motto_fm_buddhist_417:0 "A clever victory with small odds against great strength"
 motto_fm_buddhist_418:0 "Strike when they are unprepared and attack where they are undefended."
 motto_fm_buddhist_419:0 "Attack the east to strike the west; military tactics know no bounds when it comes to deception."
 motto_fm_buddhist_420:0 "Strike first; speed is paramount in warfare."
 motto_fm_buddhist_421:0 "Act swiftly and decisively when the moment arises."
 motto_fm_buddhist_422:0 "Hesitation causing a missed opportunity"
 motto_fm_buddhist_423:0 "Opportunities are never repeated; once lost, they are gone forever."
 motto_fm_buddhist_424:0 "Strike while the iron is hot; keep up the momentum."
 motto_fm_buddhist_425:0 "Begin well and end well; have both a beginning and an end."
 motto_fm_buddhist_426:0 "Abandoning the journey halfway means all prior efforts are in vain."
 motto_fm_buddhist_427:0 "A failure at the last hurdle means a journey of one hundred li is only half complete."
 motto_fm_buddhist_428:0 "Perseverance until the end leads to victory."
 motto_fm_buddhist_429:0 "Never give up, never abandon, never surrender."
 motto_fm_buddhist_430:0 "The more setbacks faced, the braver one becomes; never giving up despite repeated failures."
 motto_fm_buddhist_431:0 "Unyielding in resolve, steadfast in purpose"
 motto_fm_buddhist_432:0 "Unwavering and steadfast"
 motto_fm_buddhist_433:0 "Only by not forgetting one's original aspiration can one achieve the ultimate goal."
 motto_fm_buddhist_434:0 "Carry forward the legacy and forge ahead with determination"
 motto_fm_buddhist_435:0 "Steady progress leads to far-reaching success; perseverance yields lasting achievements."
 motto_fm_buddhist_436:0 "Heaven rewards diligence; Earth rewards kindness."
 motto_fm_buddhist_437:0 "Humanity rewards sincerity; commerce rewards trust."
 motto_fm_buddhist_438:0 "One part of effort yields one part of harvest."
 motto_fm_buddhist_439:0 "Plant melons and get melons; plant beans and get beans."
 motto_fm_buddhist_440:0 "Spring sowing and autumn harvest follow the four seasons."
 motto_fm_buddhist_441:0 "Work at sunrise and rest at sunset."
 motto_fm_buddhist_442:0 "Heaven and earth follow order; all things abide by their constant ways."
 motto_fm_buddhist_443:0 "The Dharma is thus in accordance with causes and conditions."
 motto_fm_buddhist_444:0 "Follow the flow of fate, act without intention, and respond naturally."
 motto_fm_buddhist_445:0 "When the mind is pure and thoughts are clear, stillness brings clarity."
 motto_fm_buddhist_446:0 "Cultivate diligence and virtue as deep as the earth."
 motto_fm_buddhist_447:0 "The gentleman attends to the root; when the root is established, the Way springs forth."
 motto_fm_buddhist_448:0 "Cultivate oneself, regulate the family, govern the state, and bring peace to the world."
 motto_fm_buddhist_449:0 "Investigate things to extend knowledge; be sincere in one's intentions and correct one's heart."
 motto_fm_buddhist_450:0 "The Way of the University ends in supreme goodness."
 motto_fm_buddhist_451:0 "If one can renew oneself today, one can renew oneself every day, and continue to renew oneself day after day."
 motto_fm_buddhist_452:0 "Rapidly evolving with constant innovation"
 motto_fm_buddhist_453:0 "Discard the old and establish the new; advance with the times."
 motto_fm_buddhist_454:0 "Pioneering innovation and leading with courage"
 motto_fm_buddhist_455:0 "Boldly advancing, standing at the forefront of the tide"
 motto_fm_buddhist_456:0 "Ride the wind and waves, set sail on a grand voyage."
 motto_fm_buddhist_457:0 "Soar high and achieve great ambitions"
 motto_fm_buddhist_458:0 "The heart-lamp shines ever bright, dispelling the darkness of ignorance."
 motto_fm_buddhist_459:0 "A lamp of heart's light illuminates the lost path."
 motto_fm_buddhist_460:0 "The Bodhi Heart Lamp Shall Never Be Extinguished"
 motto_fm_buddhist_461:0 "The Dharma brings joy; meditation is one's food."
 motto_fm_buddhist_462:0 "Suffering is enlightenment; life and death are nirvana."
 motto_fm_buddhist_463:0 "One thought of ignorance cuts off Prajna; one thought of wisdom births Prajna."
 motto_fm_buddhist_464:0 "All sentient beings possess Buddha-nature."
 motto_fm_buddhist_465:0 "All beings can attain Buddhahood."
 motto_fm_buddhist_466:0 "All beings are equal; there is no distinction of high or low."
 motto_fm_buddhist_467:0 "Let go of self-attachment; let go of distinctions."
 motto_fm_buddhist_468:0 "No self, no person, no sentient beings."
 motto_fm_buddhist_469:0 "All phenomena are manifestations of the mind and transformations of consciousness."
 motto_fm_buddhist_470:0 "When the mind is pure, the land becomes pure; when the mind is defiled, the land becomes defiled."
 motto_fm_buddhist_471:0 "One thought of heaven, one thought of hell."
 motto_fm_buddhist_472:0 "Good and evil lie in a single thought."
 motto_fm_buddhist_473:0 "The realm is forged by the mind; appearances arise from the heart."
 motto_fm_buddhist_474:0 "The mind follows the environment—that is the realm of ordinary beings; the heart follows the mind—that is the realm of sages."
 motto_fm_buddhist_475:0 "See through and let go; be free and follow fate."
 motto_fm_buddhist_476:0 "Seeing through is wisdom; letting go is cultivation."
 motto_fm_buddhist_477:0 "Attachment brings suffering; letting go brings blessings."
 motto_fm_buddhist_478:0 "To gain, one must first give; to achieve, one must sacrifice."
 motto_fm_buddhist_479:0 "Great sacrifice brings great gain; small sacrifice brings small gain."
 motto_fm_buddhist_480:0 "The perfection of giving dispels stinginess and greed."
 motto_fm_buddhist_481:0 "Holding precepts brings coolness; enduring humiliation brings tranquility."
 motto_fm_buddhist_482:0 "Diligence without slackness; meditation unwavering."
 motto_fm_buddhist_483:0 "The wisdom of Prajna illuminates all things."
 motto_fm_buddhist_484:0 "Six degrees of perfection, complete with Bodhi"
 motto_fm_buddhist_485:0 "The Four Immeasurable Minds of Compassion, Loving-kindness, Joy, and Equanimity"
 motto_fm_buddhist_486:0 "Do not kill, do not steal, do not commit sexual misconduct."
 motto_fm_buddhist_487:0 "Do not speak falsely, do not drink alcohol, observe the five precepts"
 motto_fm_buddhist_488:0 "Ten Good Deeds Path: Cultivating Both Virtue and Wisdom"
 motto_fm_buddhist_489:0 "Repent karmic obstacles and awaken the Bodhi mind."
 motto_fm_buddhist_490:0 "Dedicate merit to all sentient beings to attain Buddhahood together."
 motto_fm_buddhist_491:0 "Honor the land and benefit all sentient beings."
 motto_fm_buddhist_492:0 "Report the fourfold grace above, relieve the suffering of the three paths below."
 motto_fm_buddhist_493:0 "One lamp can dispel a thousand years of darkness; one wisdom can extinguish ten thousand years of ignorance."
 motto_fm_buddhist_494:0 "Faith is the source of the Way and the mother of merit."
 motto_fm_buddhist_495:0 "The power of will is boundless and inconceivable."
 motto_fm_buddhist_496:0 "Recite the Buddha's name once, and sins as countless as the sands of a river are extinguished."
 motto_fm_buddhist_497:0 "The Western Pure Land of Ultimate Bliss is majestic and solemn."
 motto_fm_buddhist_498:0 "Lotus Pond Gathering, Flowers Bloom to See the Buddha"
 motto_fm_buddhist_499:0 "Nine-rank lotus as parents"
 motto_fm_buddhist_500:0 "Amitabha Buddha's light is boundless."
 motto_fm_buddhist_501:0 "Namo Amitabha Buddha Six-Character Great Name"
 motto_fm_buddhist_502:0 "Evening drum and morning bell at the Zen temple's daily recitation"
 motto_fm_buddhist_503:0 "The morning bell and evening drum awaken the dreamer from his delusion."
 motto_fm_buddhist_504:0 "The sound of wooden fish awakens the dust-laden heart."
 motto_fm_buddhist_505:0 "The sacred chants wash away worldly concerns."
 motto_fm_buddhist_506:0 "Incense smoke curls upward to reach before the Buddha."
 motto_fm_buddhist_507:0 "Prostrate in utmost sincerity to invoke a response"
 motto_fm_buddhist_508:0 "Take refuge in the Three Jewels and dedicate body and mind to them."
 motto_fm_buddhist_509:0 "Take refuge in the Buddha, take refuge in the Dharma, take refuge in the Sangha."
 motto_fm_buddhist_510:0 "The Three Jewels of Self-Nature are inherently complete."
 motto_fm_buddhist_511:0 "Delve deep into the scriptures, and wisdom shall be as vast as the ocean."
 motto_fm_buddhist_512:0 "The sequential practice of hearing, contemplating, meditating, and realizing wisdom."
 motto_fm_buddhist_513:0 "Recite the sutra a thousand times, and its meaning will naturally reveal itself."
 motto_fm_buddhist_514:0 "Meditate in Zen to illuminate the mind and realize one's true nature"
 motto_fm_buddhist_515:0 "The moment doubt arose, suspicion instantly took hold."
 motto_fm_buddhist_516:0 "Who is chanting the Buddha's name? Have you penetrated the true nature?"
 motto_fm_buddhist_517:0 "Take a moment to address this matter."
 motto_fm_buddhist_518:0 "Let go of all worldly ties and hold fast to a single thought."
 motto_fm_buddhist_519:0 "When not a single thought arises, the whole self is revealed."
 motto_fm_buddhist_520:0 "Six roots just move, then clouds obscure them."
 motto_fm_buddhist_521:0 "If the heart remains unmoved, what can the wind do?"
 motto_fm_buddhist_522:0 "The wild heart ceases instantly; cessation is Bodhi."
 motto_fm_buddhist_523:0 "Where delusions cease is Bodhi."
 motto_fm_buddhist_524:0 "Ignorance is the true nature; that is the Buddha-nature."
 motto_fm_buddhist_525:0 "The Transformed Void Body is the Dharma Body."
 motto_fm_buddhist_526:0 "Purifying the mind is the teaching of all Buddhas."
 motto_fm_buddhist_527:0 "Pure heart brings a pure land; peace of mind brings peace to all beings."
 motto_fm_buddhist_528:0 "The Pure Land of Ultimate Bliss is a realm of the mind."
 motto_fm_buddhist_529:0 "Self-Nature Amitabha, Pure Land of the Mind"
 motto_fm_buddhist_530:0 "The flower blooms to reveal the Buddha, awakening to non-birth."
 motto_fm_buddhist_531:0 "Lotus-born, nine grades of rebirth in the Pure Land"
 motto_fm_buddhist_532:0 "The three ranks and nine grades shall all attain rebirth in the Pure Land."
 motto_fm_buddhist_533:0 "Reborn with karma carried over, returning by the power of vows"
 motto_fm_buddhist_534:0 "Turn the chariot to guide the compassionate voyage and save all sentient beings."
 motto_fm_buddhist_535:0 "Bodhisattvas fear the cause; sentient beings fear the result."
 motto_fm_buddhist_536:0 "To know the cause of a former life, one must look at the suffering endured in this present life."
 motto_fm_buddhist_537:0 "To know the fruit of the next life is to understand the cause of this present life; the author is..."
 motto_fm_buddhist_538:0 "The cycle of cause and effect across three lifetimes is not empty."
 motto_fm_buddhist_539:0 "All worldly possessions cannot be taken; only karma accompanies the soul."
 motto_fm_buddhist_540:0 "Cause and effect span three lifetimes; good and evil deeds are all reaped accordingly."
 motto_fm_buddhist_541:0 "Karma follows like a shadow, never false."
 motto_fm_buddhist_542:0 "To eliminate karmic obstacles, one must sincerely repent."
 motto_fm_buddhist_543:0 "Sin arises from the heart; repenting with the heart extinguishes it. When the heart is put to rest, sin perishes as well."
 motto_fm_buddhist_544:0 "When the mind is void of sin and both are empty, this is truly called repentance."
 motto_fm_buddhist_545:0 "All evil karma created in the past stems from endless greed, anger, and ignorance."
 motto_fm_buddhist_546:0 "I now repent of all that arises from body, speech, and mind."
 motto_fm_buddhist_547:0 "Repentance is like clear water that washes away all defilements."
 motto_fm_buddhist_548:0 "Correct the past, cultivate the future, and thoroughly amend one's former mistakes."
 motto_fm_buddhist_549:0 "Brave and diligent as if saving one's head from fire"
 motto_fm_buddhist_550:0 "But remember impermanence; beware of negligence."
 motto_fm_buddhist_551:0 "This day has passed; life too diminishes with it."
 motto_fm_buddhist_552:0 "Work diligently with the urgency of saving one's head from fire."
 motto_fm_buddhist_553:0 "The human body is hard to obtain; now it has been obtained. The Dharma is hard to hear; now it has been heard."
 motto_fm_buddhist_554:0 "This body shall not be saved in this life; then in what other life will it be saved?"
 motto_fm_buddhist_555:0 "Do not wait until old age to seek the Dao; most solitary graves belong to the young."
 motto_fm_buddhist_556:0 "Hearing the Way knows no order of first or last; realizing the Dao disregards age or seniority."
 motto_fm_buddhist_557:0 "When I was a monk thirty years ago, before I had attained Zen, I saw the mountain as merely a mountain."
 motto_fm_buddhist_558:0 "And later, when I personally encountered a person of knowledge and understanding."
 motto_fm_buddhist_559:0 "Now I have found a place of rest, where the mountain is just the mountain."
 motto_fm_buddhist_560:0 "Look at the mountain, it's still a mountain; look at the water, it's still water."
 motto_fm_buddhist_561:0 "Seeing mountains is not seeing mountains; seeing waters is not seeing waters."
 motto_fm_buddhist_562:0 "Empty-handed holding a hoe, walking while riding a water buffalo."
 motto_fm_buddhist_563:0 "When hungry, eat; when tired, sleep. Walking, staying, sitting, or lying down—all are Zen."
 motto_fm_buddhist_564:0 "Peace of mind makes every place a hometown."
 motto_fm_buddhist_565:0 "Spring has a hundred flowers, autumn has the moon, summer has cool breezes, and winter has snow."
 motto_fm_buddhist_566:0 "When there are no worldly cares to hang upon one's mind, it is the finest season in the world."
 motto_fm_buddhist_567:0 "Eternal sky, a moment of wind and moon."
 motto_fm_buddhist_568:0 "The sound of the stream and the hues of the mountains are all imbued with Zen meaning."
 motto_fm_buddhist_569:0 "The sound of the stream is nothing but the tongue of the Buddha; the color of the mountains is nothing but the pure body of enlightenment."
 motto_fm_buddhist_570:0 "A pool of lotus leaves provides endless clothing; countless pine blossoms offer surplus food."
 motto_fm_buddhist_571:0 "The moon shines not to light the night's path; the wind blows strong yet the pine stands unbent."
 motto_fm_buddhist_572:0 "Bamboo shadows sweep the steps while dust remains still; the moon's wheel pierces the sea water leaving no trace."
 motto_fm_buddhist_573:0 "Clouds in the blue sky, water in the bottle."
 motto_fm_buddhist_574:0 "Cup the water to hold the moon in hand; play with the flowers to fill your clothes with their fragrance."
 motto_fm_buddhist_575:0 "When the journey reaches the end of the water, sit and watch the clouds rise."
 motto_fm_buddhist_576:0 "Mountain light delights the birds' nature; pool reflections empty the human heart."
 motto_fm_buddhist_577:0 "All sounds are silent here; only the sound of bells and stone chimes remains."
 motto_fm_buddhist_578:0 "Where the winding path leads to a secluded place, the hermit's dwelling is deep among flowers and trees."
 motto_fm_buddhist_579:0 "The empty mountain hides no people, yet the sound of human voices can be heard."
 motto_fm_buddhist_580:0 "The bright moon shines among the pines; clear springs flow over the stones."
 motto_fm_buddhist_581:0 "Watch the flowing water while walking; gaze at the clouds while seated."
 motto_fm_buddhist_582:0 "Gazing beyond the horizon, clouds roll and drift at will."
 motto_fm_buddhist_583:0 "The water flows but the heart does not compete; clouds linger in thought, all moving slowly together."
 motto_fm_buddhist_584:0 "Falling petals, a person stands alone; in the light rain, swallows fly in pairs."
 motto_fm_buddhist_585:0 "Sparse shadows stretch across the shallow water; faint fragrance drifts in the twilight moonlight."
 motto_fm_buddhist_586:0 "Picking chrysanthemums beneath the eastern fence, I leisurely see Mount Nan in the distance."
 motto_fm_buddhist_587:0 "There is a true meaning here; I wish to distinguish it but have already forgotten the words."
 motto_fm_buddhist_588:0 "The heart far away, the place naturally secluded, without the clamor of carriages and horses."
 motto_fm_buddhist_589:0 "Building a hut amidst the human world, yet free from the clamor of carriages and horses."
 motto_fm_buddhist_590:0 "Ask you how this can be; when the heart is distant, the place becomes secluded by itself."
 motto_fm_buddhist_591:0 "After long confinement in the cage, I have finally returned to nature."
 motto_fm_buddhist_592:0 "The caged bird longs for its old forest; the pond fish yearns for its former deep waters."
 motto_fm_buddhist_593:0 "Young with no affinity for worldly customs, my nature has always loved the hills and mountains."
 motto_fm_buddhist_594:0 "Life's journey everywhere—what does it resemble? It should be like a flying goose leaving footprints on snow-covered earth."
 motto_fm_buddhist_595:0 "By chance, my traces remain on the mud; now that the wild geese have flown away, I no longer count east or west."
 motto_fm_buddhist_596:0 "One cannot see the true face of Mount Lu because one is already within its mountains."
 motto_fm_buddhist_597:0 "Viewed from the front it forms ridges; seen from the side it becomes peaks—each at a different distance, height, or elevation appears unique."
 motto_fm_buddhist_598:0 "Who fears a single cloak of misty rain?"
 motto_fm_buddhist_599:0 "Return; there is neither wind nor rain, nor sunshine."
 motto_fm_buddhist_600:0 "May people live long and share the beauty of the moon across a thousand miles."
 motto_fm_buddhist_601:0 "People have joys and sorrows, partings and reunions; the moon has its phases of waxing and waning."
 motto_fm_buddhist_602:0 "The moon rises over the sea; at this moment, we share it from afar."
 motto_fm_buddhist_603:0 "The great river flows eastward, washing away the heroes of ages past."
 motto_fm_buddhist_604:0 "Chaos of rocks pierces the sky; thunderous waves crash against the shore, rolling up a thousand mounds of snow."
 motto_fm_buddhist_605:0 "The land is as picturesque as a painting; how many heroes have there been in this fleeting moment?"
 motto_fm_buddhist_606:0 "Life is like a dream; let me pour the wine upon the river moon."
 motto_fm_buddhist_607:0 "The surging Yangtze River flows eastward, washing away the heroes with its waves."
 motto_fm_buddhist_608:0 "Success or failure turns to emptiness when one looks back."
 motto_fm_buddhist_609:0 "With white hair, the fisherman and woodcutter stand on the riverbank, accustomed to watching the autumn moon and spring breeze."
 motto_fm_buddhist_610:0 "In the laughter of past and present, countless events are left to be told."
 motto_fm_buddhist_611:0 "The setting sun flies alongside a lone sandpiper; the autumn waters share one color with the vast sky."
 motto_fm_buddhist_612:0 "Though old, I grow stronger; how could my heart change with white hair?"
 motto_fm_buddhist_613:0 "Though poor, one becomes even more resolute in not abandoning the ambition to reach the lofty heights of the blue sky."
 motto_fm_buddhist_614:0 "Worry before the world worries, and rejoice after the world rejoices."
 motto_fm_buddhist_615:0 "Not elated by external gains nor saddened by personal losses."
 motto_fm_buddhist_616:0 "When high in the temple hall, one worries for the people."
 motto_fm_buddhist_617:0 "Heaven and earth possess a righteous spirit, which is bestowed upon all forms in a mingled manner."
 motto_fm_buddhist_618:0 "Who in history has escaped death? Let my loyal heart shine through the annals of history."
 motto_fm_buddhist_619:0 "Wealth cannot corrupt us; poverty cannot change us; force cannot break us."
 motto_fm_buddhist_620:0 "Before heaven entrusts a great mission to someone, it must first torment their mind and will."
 motto_fm_buddhist_621:0 "Born in adversity but perishing in comfort"
 motto_fm_buddhist_622:0 "The road ahead is long and arduous; I will seek it out above and below."
 motto_fm_buddhist_623:0 "For what my heart holds dear, though I die nine times, I shall never regret it."
 motto_fm_buddhist_624:0 "To learn the Way in the morning is enough; one may die in the evening."
 motto_fm_buddhist_625:0 "A scholar cannot but be broad-minded and determined, for his burden is heavy and his road long."
 motto_fm_buddhist_626:0 "One who wishes to establish himself must also help others establish themselves; one who wishes to achieve success must also help others achieve it."
 motto_fm_buddhist_627:0 "Learn widely and hold fast to your aspirations; ask earnestly and think practically."
 motto_fm_buddhist_628:0 "Learning without thought is labor lost; thought without learning is perilous."
 motto_fm_buddhist_629:0 "Reviewing the past allows one to understand the new; thus, one can become a teacher."
 motto_fm_buddhist_630:0 "To know what you know is to know; to admit what you do not know is also knowledge."
 motto_fm_buddhist_631:0 "Quick-witted and eager to learn, he does not disdain asking questions of those below him."
 motto_fm_buddhist_632:0 "Do not worry that others do not know you; worry that you do not know others."
 motto_fm_buddhist_633:0 "The gentleman is open and expansive; the petty person is always anxious and worried."
 motto_fm_buddhist_634:0 "The gentleman harmonizes without being uniform; the petty man seeks uniformity but fails to achieve harmony."
 motto_fm_buddhist_635:0 "Only in the severest cold do we know that pines and cypresses are the last to shed their leaves."
 motto_fm_buddhist_636:0 "Heaven moves with strength; the superior man makes himself strong and unceasing in his self-improvement."
 motto_fm_buddhist_637:0 "Quietness cultivates the self; frugality nurtures virtue."
 motto_fm_buddhist_638:0 "Without simplicity of mind, one cannot clarify one's ambition; without tranquility, one cannot achieve far-reaching goals."
 motto_fm_buddhist_639:0 "One's ambition should be lofty and far-reaching."
 motto_fm_buddhist_640:0 "The mountains are never weary of height; the seas are never weary of depth."
 motto_fm_buddhist_641:0 "The sea is vast enough for fish to leap; the sky is high enough for birds to fly."
 motto_fm_buddhist_642:0 "When I reach the very peak, I'll survey the smallness of all other mountains."
 motto_fm_buddhist_643:0 "To see a thousand miles further, climb one more step."
 motto_fm_buddhist_644:0 "Fear not the floating clouds that obscure one's view; it is because one stands at the highest level."
 motto_fm_buddhist_645:0 "Ask the channel how it can be so clear; it is because there is fresh water from its source."
 motto_fm_buddhist_646:0 "What is gained from books is always shallow; to truly understand this matter, one must practice it personally."
 motto_fm_buddhist_647:0 "Without tempering, one cannot become a vessel."
 motto_fm_buddhist_648:0 "The time will come when I shall ride the wind and break the waves, hoisting my cloud-sail to cross the vast sea."
 motto_fm_buddhist_649:0 "Heaven has given me talent that must find its use; even if I scatter a thousand gold, it will return again."
 motto_fm_buddhist_650:0 "By the sunken boat a thousand sails pass; before the withered tree ten thousand trees spring anew."
 motto_fm_buddhist_651:0 "Falling petals are not heartless things; they turn to spring mud to protect the flowers even more."
 motto_fm_buddhist_652:0 "The spring silkworm spins its thread until death; the wax candle weeps until it turns to ash."
 motto_fm_buddhist_653:0 "Wild fire cannot burn it down; the spring breeze will make it grow again."
 motto_fm_buddhist_654:0 "The sky street's light rain moistens like su; the grass color is seen from afar but disappears when approached."
 motto_fm_buddhist_655:0 "The sun rises over the river flowers, red brighter than fire; spring comes, and the river water turns green like indigo."
 motto_fm_buddhist_656:0 "Just as the young lotus bud first peeks out from the water, an early dragonfly perches upon its tip."
 motto_fm_buddhist_657:0 "Lotus leaves stretch to the sky in endless green, reflecting the sun's glow; lotus flowers bloom with a unique red hue."
 motto_fm_buddhist_658:0 "Outside the bamboo, a few peach blossoms bloom; in the warm spring waters of the river, ducks are the first to know."
 motto_fm_buddhist_659:0 "Stopping the carriage to admire the maple forest at dusk, where the frost-kissed leaves are redder than flowers in February."
 motto_fm_buddhist_660:0 "After gathering flowers to make honey, who do you toil for and whose sweetness do you provide?"
 motto_fm_buddhist_661:0 "After a thousand trials and ten thousand blows, it remains strong; let the east wind, west wind, north wind, or south wind blow as they will."
 motto_fm_buddhist_662:0 "Do not let others praise its vibrant hue; leave only the pure fragrance to fill the universe."
