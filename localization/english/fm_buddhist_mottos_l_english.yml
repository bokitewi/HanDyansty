 motto_fm_buddhist_679:0 "Though heaven and earth may endure forever, this sorrow knows no end."
 motto_fm_buddhist_680:0 "Having once seen the vast ocean, no other water can compare; apart from the clouds of Wushan, no other cloud is true."
