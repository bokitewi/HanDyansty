 motto_fm_buddhist_664:0 "Understanding the world is knowledge; mastering human relations is literature."
 motto_fm_buddhist_665:0 "Reading ten thousand volumes makes one's pen move as if by a god."
 motto_fm_buddhist_666:0 "The work of a thousand ages is known only to the heart's gain and loss."
 motto_fm_buddhist_667:0 "Two lines take three years to compose; tears flow in pairs as I recite them."
 motto_fm_buddhist_668:0 "To perfect a single word, I'd snap several strands of beard."
 motto_fm_buddhist_669:0 "Birds roost by the pool's edge; a monk knocks at the door beneath the moon."
 motto_fm_buddhist_670:0 "Though my body lacks the colorful phoenix's twin wings, our hearts are connected by a single point of understanding."
 motto_fm_buddhist_671:0 "The sash grows thin, yet I never regret it; I have grown gaunt for her sake."
 motto_fm_buddhist_672:0 "Seeking him among the crowds a thousand times"
 motto_fm_buddhist_673:0 "If the two hearts are meant to last forever, why must they be together every morning and evening?"
 motto_fm_buddhist_674:0 "When golden wind and jade dew meet once, it surpasses countless encounters in the mortal world."
 motto_fm_buddhist_675:0 "Though the mountain vow remains, it is hard to entrust a letter—mo mo mo."
