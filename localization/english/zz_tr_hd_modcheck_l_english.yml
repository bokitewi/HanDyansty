l_english:
 hd_modcheck.0002.t:0 "Incompatible Mod Detected"
 hd_modcheck.0002.desc:0 "Some core files of The Annal of Han-Jin have been overwritten by another mod. Continuing may cause scenario events not to fire, wars that cannot be concluded, a broken dynastic cycle, and other problems.\n\nPlease quit the game and, in the launcher, disable every mod except The Annal of Han-Jin and its required HanJIn_Clothes (especially the old internal-test version of this mod, sub-mods that have since been merged into it, and mods that change the map or history), then start a new game."
 hd_modcheck.0002.a:0 "Understood"
