l_english:
 # Two Jins and Sixteen Kingdoms unified historical line, 370 section, Eastern Jin part (5-A2): events hd_j16.4500-4595, 5000-5043, modifiers, opinions, army names

 hd_j16.4500.t:0 "The Testament That Never Came"
 hd_j16.4500.desc:0 "Emperor Jianwen has died. On his deathbed he meant to entrust the realm to you as the Duke of Zhou once ruled for his young king, but Wang Tanzhi tore up the draft before the throne and had it rewritten: 'All affairs of state shall be referred to the Grand Marshal, as with Zhuge Liang and Chancellor Wang Dao.' The crown prince has taken the throne and the Empress Dowager rules from behind the screen. Abdication and regency are now empty words.\n\nYour hopes dashed, your anger is plain to all, and you openly blame Xie An and Wang Tanzhi."
 hd_j16.4500.a:0 "Swallow it, and bide my time"
 hd_j16.4500.b:0 "Go to court and demand an explanation"

 hd_j16.4501.t:0 "Emperor Xiaowu Ascends"
 hd_j16.4501.desc:0 "Emperor Jianwen has died and the crown prince [hd_news_a.GetName], ten years old, has taken the throne. Empress Dowager Chu once again rules from behind the screen, leaving the government to the Grand Marshal and the lords of the Wang and Xie clans."

 hd_j16.4510.t:0 "The Meeting at Xinting"
 hd_j16.4510.desc:0 "Grand Marshal Huan Wen has come up from Gushu and camped his troops at Xinting, ordering the officials to bow by the roadside. The capital is in uproar: all say he has come to kill Wang and Xie and seize the throne. Wang Tanzhi's robes are soaked with sweat and he holds his tablet upside down.\n\nHow will you attend the meeting?"
 hd_j16.4510.a:0 "Take my seat calmly and chant 'Vast the Flowing Waters' in the Luoyang manner"
 hd_j16.4510.b:0 "Humble myself and side with the Huan"
 hd_j16.4510.c:0 "Plead illness and stay away"

 hd_j16.4511.t:0 "The Meeting at Xinting"
 hd_j16.4511.desc:0 "You have camped at Xinting with the officials bowing by the road. Xie An takes his seat unruffled and says: 'I have heard that a lord who keeps the Way guards his borders, not his walls. Why must Your Excellency hide men behind the screen?'\n\nArmed men wait behind the curtain for a single word."
 hd_j16.4511.a:0 "Laugh, dismiss the hidden men, and return to my post"
 hd_j16.4511.b:0 "Nothing can be done while Wang and Xie live"

 hd_j16.4520.t:0 "The Nine Bestowments"
 hd_j16.4520.desc:0 "Gravely ill, you have hinted that the court should grant you the Nine Bestowments, and Yuan Hong was told to draft the edict. Yet every time Xie An and Wang Tanzhi see the text they demand changes, and days pass without it being finished."
 hd_j16.4520.a:0 "Press them, no more delays"
 hd_j16.4520.b:0 "Let the matter drop"

 hd_j16.4521.t:0 "The Text of the Bestowments"
 hd_j16.4521.desc:0 "The Grand Marshal lies gravely ill and has hinted that he wants the Nine Bestowments. Yuan Hong's draft lies before you. Huan Wen grows worse by the day, and every day sooner the text is finished, the greater the danger to the house of Jin."
 hd_j16.4521.a:0 "Keep revising it and play for time"
 hd_j16.4521.b:0 "Grant it quickly and avoid trouble"

 hd_j16.4530.t:0 "Death of Huan Wen"
 hd_j16.4530.desc:0 "Grand Marshal Huan Wen has died at Gushu. By his last command his brother Huan Chong leads his forces and his youngest son Huan Xuan inherits the title Duke of Nanjun. His heir Huan Xi plotted against his uncle; the plot was discovered and he was banished to Changsha. Command of the armies of Jing and Xu now passes to Huan Chong."

 hd_j16.4540.t:0 "Who Will Govern"
 hd_j16.4540.desc:0 "With Huan Wen dead, the court has no master. Xie An is widely respected and Wang Tanzhi is loyal and upright. Opinion holds that Xie An should take charge of the government, with Wang Tanzhi to assist him."
 hd_j16.4540.a:0 "Entrust the government to Xie An, with Wang Tanzhi as Secretariat Director"
 hd_j16.4540.b:0 "I will govern myself"

 hd_j16.4541.t:0 "Huan Chong Leaves Yangzhou"
 hd_j16.4541.desc:0 "With your brother gone, you command the forces of the Huan and hold Yangzhou close to the court. Your staff urge you to seize power and kill Xie An, but you have always prided yourself on loyalty and restraint."
 hd_j16.4541.a:0 "Give up Yangzhou and take a post outside the capital"
 hd_j16.4541.b:0 "Keep my position"

 hd_j16.4550.t:0 "The Dowager Returns Power"
 hd_j16.4550.desc:0 "[hd_news_a.GetName] has come of age. Empress Dowager Chu has issued an edict returning the government to him and retired to the Chongde Palace. The Son of Heaven now rules in person."

 hd_j16.4560.t:0 "Promoting Kin on Merit"
 hd_j16.4560.desc:0 "The men of Qin raid the Huai and Si again and again, and the court seeks able commanders to hold the north. Your nephew Xie Xuan has the talent of a statesman, but recommending one's own kin will surely draw criticism."
 hd_j16.4560.a:0 "Merit before kinship: recommend Xie Xuan for Guangling"
 hd_j16.4560.b:0 "Recommend someone else"

 hd_j16.4561.t:0 "Xie An Recommends Xie Xuan"
 hd_j16.4561.desc:0 "Xie An has memorialized the throne recommending his nephew Xie Xuan to command the armies north of the Yangtze from Guangling and to recruit the bold men of Jingkou and Jinling against the Qin. Hearing of it, Xi Chao sighed: 'An goes against the crowd to raise his own kin, which shows his discernment; Xuan will surely live up to it, which shows his talent.'"
 hd_j16.4561.a:0 "Approve"
 hd_j16.4561.b:0 "Refuse"

 hd_j16.4580.t:0 "March North on the Victory"
 hd_j16.4580.desc:0 "The Qin army has just been routed at the Fei River. The north is shaken and the commanderies beyond the Huai are wavering. Xie An has asked the throne to press the victory into the Central Plain, and the court orders you to lead the armies north."
 hd_j16.4580.a:0 "Lead the army north"
 hd_j16.4580.b:0 "Hold the border and keep the peace"

 hd_j16.4590.t:0 "Withdrawing to Guangling"
 hd_j16.4590.desc:0 "Sima Daozi, Prince of Kuaiji, is taking more and more of the government into his own hands. Petty men flock to him and slander you before the emperor day and night. Your merits have made you a target. What will you do?"
 hd_j16.4590.a:0 "Ask to take up a post at Guangling and step out of his way"
 hd_j16.4590.b:0 "Stay at court and contend with him"

 hd_j16.4595.t:0 "Entrusting the Government to Daozi"
 hd_j16.4595.desc:0 "Xie An is dead and no one leads the court. Sima Daozi, Prince of Kuaiji, is your full brother, and opinion holds that he should be made Director of the Secretariat and run the government."
 hd_j16.4595.a:0 "Entrust the government to Daozi"
 hd_j16.4595.b:0 "Do not"

 hd_j16.5000.t:0 "The Sudden Death of Emperor Xiaowu"
 hd_j16.5000.desc:0 "Emperor Xiaowu made a drunken jest that Lady Zhang never forgave; that night she smothered him with a quilt and claimed he had died of a nightmare. The crown prince [hd_news_a.GetName] has taken the throne. The new emperor cannot speak and does not know heat from cold, and the government falls entirely to the Prince of Kuaiji and his son."

 hd_j16.5010.t:0 "Wang Gong Raises Troops"
 hd_j16.5010.desc:0 "General of the Van Wang Gong has sent up a memorial from Jingkou listing Wang Guobao's crimes and is marching on the capital. Wang Guobao is terrified and at a loss."
 hd_j16.5010.a:0 "Hand Wang Guobao to the Justiciar and order his death to appease Wang Gong"
 hd_j16.5010.b:0 "Refuse, and fight Wang Gong"

 hd_j16.5011.t:0 "Toward Jiankang"
 hd_j16.5011.desc:0 "You have listed Wang Guobao's crimes and raised troops at Jingkou. An envoy from the Prince of Kuaiji says he will put Wang Guobao to death to atone to the realm, and asks you to stand down."
 hd_j16.5011.a:0 "The traitor is dead; stand down and return to my post"
 hd_j16.5011.b:0 "March on Jiankang and purge the emperor's side"

 hd_j16.5012.t:0 "Wang Guobao Executed"
 hd_j16.5012.desc:0 "When Wang Gong raised troops at Jingkou, the frightened Prince of Kuaiji handed Wang Guobao to the Justiciar and ordered his death, executed Wang Xu in the market and apologized at length. [hd_news_a.GetName] then stood down and returned to his post."

 hd_j16.5020.t:0 "A Second Rising"
 hd_j16.5020.desc:0 "Sima Yuanxian holds power and has carved four commanderies out of Jiangzhou for Wang Yu, angering every frontier governor. Yin Zhongkan, Huan Xuan and Yang Quanqi have sent envoys proposing that you lead them against the capital once more."
 hd_j16.5020.a:0 "Rise again and march on the capital"
 hd_j16.5020.b:0 "Do not rise"

 hd_j16.5021.t:0 "Turning Coat on the Field"
 hd_j16.5021.desc:0 "Wang Gong has made you his vanguard. Sima Yuanxian's agents have come with rich bribes and the promise of Wang Gong's own posts. Wang Gong has always prided himself on his lineage and treats you as nothing more than a soldier."
 hd_j16.5021.a:0 "Turn on Wang Gong"
 hd_j16.5021.b:0 "Stand by Wang Gong to the end"

 hd_j16.5022.t:0 "Liu Laozhi Turns Coat"
 hd_j16.5022.desc:0 "The Northern Garrison general [hd_news_a.GetName] has turned on Wang Gong in the field. Wang Gong's army broke; he fled alone toward Qu'e, was seized and sent to Jiankang."

 hd_j16.5025.t:0 "Striking Yin and Yang"
 hd_j16.5025.desc:0 "You, Yin Zhongkan and Yang Quanqi are allies in name and rivals in truth. Floods have struck Jingzhou, and Zhongkan has emptied his granaries to feed the hungry, leaving his men short of food. The moment is now."
 hd_j16.5025.a:0 "Sail downstream and strike Jiangling"
 hd_j16.5025.b:0 "Stay put"

 hd_j16.5026.t:0 "Huan Xuan Takes Jing and Jiang"
 hd_j16.5026.desc:0 "[hd_news_a.GetName] has stormed Jiangling. Yin Zhongkan and Yang Quanqi are both dead. Huan Xuan now commands eight provinces along the middle Yangtze, and his strength is beyond the court's control."

 hd_j16.5030.t:0 "Punishing Huan Xuan"
 hd_j16.5030.desc:0 "Huan Xuan holds Jing and Jiang, sends no tribute and writes to the throne with open arrogance. Sima Yuanxian wishes to punish him by imperial decree, with Liu Laozhi as vanguard. Zhang Fashun urges: 'Xuan holds the upper river; we must move against him early.'"
 hd_j16.5030.a:0 "Issue the decree to punish him"
 hd_j16.5030.b:0 "Honor him with special favor and placate him"

 hd_j16.5031.t:0 "Turning Coat on the Field"
 hd_j16.5031.desc:0 "You lead the Northern Garrison as vanguard against Huan Xuan, camped at Lizhou. Huan Xuan has sent your kinsman He Mu to say: 'Since ancient times, who has borne a power that awes his lord and merits that cannot be rewarded, and lived?'"
 hd_j16.5031.a:0 "Turn coat and go over to Huan Xuan"
 hd_j16.5031.b:0 "Fight to the death"

 hd_j16.5032.t:0 "Down the River"
 hd_j16.5032.desc:0 "Sima Yuanxian has forged an edict listing your crimes and is about to send troops against you. You hold the upper river, and your fleet can sail straight down to Jiankang."
 hd_j16.5032.a:0 "Denounce Yuanxian and sail east"
 hd_j16.5032.b:0 "Stay put"

 hd_j16.5033.t:0 "Huan Xuan Enters Jiankang"
 hd_j16.5033.desc:0 "[hd_news_a.GetName] has entered Jiankang and made himself Grand Commandant, head of all officials and Director of the Secretariat. Sima Yuanxian has been executed and Sima Daozi, Prince of Kuaiji, exiled to Ancheng. The government of Jin now belongs to the Huan."

 hd_j16.5034.t:0 "Liu Laozhi Turns Coat"
 hd_j16.5034.desc:0 "The Northern Garrison general [hd_news_a.GetName] has gone over to Huan Xuan in the field, and Yuanxian's army has scattered without a fight."

 hd_j16.5040.t:0 "Accepting the Abdication"
 hd_j16.5040.desc:0 "You have long held the government, been raised to Chancellor of State, enfeoffed as King of Chu and granted the Nine Bestowments. The officials urge you to take the throne, and the Jin emperor is ready to abdicate in your favor."
 hd_j16.5040.a:0 "Accept, and name the dynasty Chu"
 hd_j16.5040.b:0 "Firmly decline"

 hd_j16.5041.t:0 "Huan Xuan Usurps Jin"
 hd_j16.5041.desc:0 "[hd_news_a.GetName] has raised an altar north of Mount Jiujing and taken the throne by abdication from Jin, naming the dynasty Chu and the era Yongshi. The Jin emperor has been moved to Xunyang."

 hd_j16_wangjue_modifier:0 "Hopes Dashed"
 hd_j16_wangjue_modifier_desc:0 "The testament never came; abdication and regency have come to nothing."
 hd_j16_shaxin_modifier:0 "Murderous Intent"
 hd_j16_shaxin_modifier_desc:0 "The men hidden at Xinting were never withdrawn; the lives of Wang and Xie hang by a thread."
 hd_j16_jiuxi_modifier:0 "Nine Bestowments"
 hd_j16_jiuxi_modifier_desc:0 "Carriage, robes, music, vermilion doors, the inner stair, guards, bow and arrows, axe and the sacrificial wine: the highest honors a subject can hold."
 hd_j16_liufang_modifier:0 "Banished"
 hd_j16_liufang_modifier_desc:0 "A plot against an uncle was discovered, and banishment followed."
 hd_j16_beifu_modifier:0 "Northern Garrison"
 hd_j16_beifu_modifier_desc:0 "The bold men of Jingkou and Jinling, recruited as the Northern Garrison army, win every battle and are feared by every enemy."
 hd_j16_fanfu_modifier:0 "Turncoat"
 hd_j16_fanfu_modifier_desc:0 "A man who has betrayed three masters; everyone distrusts him."
 hd_j16_xunyang_modifier:0 "Moved to Xunyang"
 hd_j16_xunyang_modifier_desc:0 "After the abdication he was moved to Xunyang, a prisoner in all but name."

 hd_j16_xinting_calm_opinion:0 "Composed at Xinting"
 hd_j16_xinting_yifu_opinion:0 "Sided with the Huan"
 hd_j16_shaxin_opinion:0 "Sought to Kill Wang and Xie"
 hd_j16_huanxi_plot_opinion:0 "Plotted Against His Uncle"
 hd_j16_huanchong_rang_opinion:0 "Gave Up Yangzhou"
 hd_j16_huanchong_juwei_opinion:0 "Clung to His Post"
 hd_j16_daozi_xiang_opinion:0 "Contended at Court"
 hd_j16_daoge_opinion:0 "Turned Coat on the Field"
 hd_j16_zhu_guobao_opinion:0 "Executed Wang Guobao to Appease Me"

 hd_j16_370b_beifu_army_name:0 "Northern Garrison"
 hd_j16_370b_wanggong_army_name:0 "Jingkou Army"
 hd_j16_370b_huanxuan_army_name:0 "Jing-Jiang Army"
