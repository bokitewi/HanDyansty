 hd_fo_bio_she_mo_teng:0 "A monk of central India who came east with the Han envoys, sutras loaded on a white horse."
 hd_fo_bio_zhu_fa_lan:0 "A teacher of Indian scholars who knew tens of thousands of verses and slipped away from his pupils to follow."
 hd_fo_bio_an_shi_gao:0 "A Parthian prince who yielded his throne to his uncle, versed in medicine, omens and the five phases."
 hd_fo_bio_zhi_lou_jia_chen:0 "A Yuezhi monk of pure conduct and great diligence, bringing the Mahayana Perfection of Wisdom."
 hd_fo_bio_zhu_fo_shuo:0 "An Indian monk who carried the Daoxing Sutra to Luoyang and translated it with Lokaksema."
 hd_fo_bio_an_xuan:0 "A Parthian lay believer who came to trade, earned the title of Cavalry Commandant, upright and deep."
 hd_fo_bio_yan_fo_tiao:0 "A man of Linhuai, quick and studious, the first Han to take the tonsure."
 hd_fo_bio_zhi_yao:0 "A Yuezhi monk who translated the Chengju Guangming Sutra in Luoyang."
 hd_fo_bio_kang_ju:0 "A Sogdian monk bent on wandering teaching, whose translations were plain and true."
 hd_fo_bio_kang_meng_xiang:0 "A Sogdian monk whose translation of the Zhongben Qi Sutra was rich and elegant."
 hd_fo_bio_mou_zi:0 "A scholar of Cangwu, learned in the classics and Laozi, who wrote the Disposing of Error in Jiaozhi."
 hd_fo_bio_zhi_qian:0 "Of Yuezhi descent but born in Han lands, he spoke six languages and read everything."
 hd_fo_bio_wei_qi_nan:0 "An Indian monk, once a fire worshipper, converted by a monk's wonders, bringing the Dharmapada."
 hd_fo_bio_kang_seng_hui:0 "Of Sogdian stock, raised in Jiaozhi, he vowed to bring forth relics to convince the ruler of Wu."
 hd_fo_bio_tan_ke_jia_luo:0 "A central Indian monk, gifted from youth, who sought to establish ordination in China."
 hd_fo_bio_kang_seng_kai:0 "A foreign monk who reached Luoyang late in the Jiaping era and translated the Sutra of Infinite Life."
 hd_fo_bio_zhu_shi_xing:0 "A man of Yingchuan, upright and unshakable, who vowed to seek scripture in the Western Regions."
 hd_fo_bio_zhu_fa_hu:0 "A Yuezhi of Dunhuang who spoke thirty-six tongues, called the Bodhisattva of Dunhuang."
 hd_fo_bio_bo_yuan:0 "A man of Henei, so quick he recited thousands of words a day, preaching from his hermitage in Chang'an."
 hd_fo_bio_fo_tu_cheng:0 "A monk of the Western Regions, a master of spells and omens, set on converting the barbarian lords."
 hd_fo_bio_zhu_dao_qian:0 "A son of the Wang clan of Langya, of noble bearing, who left the vermilion gates for the gate of emptiness."
 hd_fo_bio_dao_an:0 "A man of Changshan, ugly of face yet able to recite anything at a glance, bent on ordering the sangha."
 hd_fo_bio_zhi_dun:0 "A man of Chenliu, master of pure conversation, whose commentary on Free Wandering the literati prized."
 hd_fo_bio_hui_yuan:0 "A Confucian youth of Yanmen who, hearing Dao'an, called all other schools mere chaff."
 hd_fo_bio_jiu_mo_luo_shi:0 "Son of an Indian father and a Kuchean princess, a monk at seven who recited a thousand verses a day."
 hd_fo_bio_seng_zhao:0 "A poor copyist of Jingzhao who read everything, and set off to follow Kumarajiva."
 hd_fo_bio_fa_xian:0 "A man of Pingyang, a monk from childhood, grieved at the incomplete Vinaya and resolved to go west."
 hd_fo_bio_dao_sheng:0 "A man of Julu, so precocious he lectured from the high seat at fifteen."
 hd_fo_bio_tan_wu_chen:0 "A central Indian monk called the Great Spellmaster, carrying the first part of the Nirvana Sutra."
 hd_fo_bio_tan_yao:0 "A monk of Liangzhou who kept his robes through the persecution, waiting for the Dharma to return."
 hd_fo_bio_ba_tuo:0 "An Indian monk who loved secluded places and came wandering to the north."
 hd_fo_bio_pu_ti_liu_zhi:0 "A monk of north India versed in all three baskets, devoted to spreading the Dharma."
 hd_fo_bio_pu_ti_da_mo:0 "A monk of south India who crossed the sea to the far south, teaching wall-gazing meditation."
 hd_fo_bio_hui_ke:0 "A man of Hulao, once a Confucian scholar, who renounced the world."
 hd_fo_bio_bao_zhi:0 "A wonder-working monk, barefoot in brocade, with scissors and a mirror hung from his staff."
 hd_fo_bio_seng_you:0 "A man of Jianye at Dinglin Temple, learned in monastic law and skilled in making images."
 hd_fo_bio_tan_luan:0 "A man of Yanmen who studied the Four Treatises in youth on Mount Wutai."
 hd_fo_bio_zhen_di:0 "A man of Ujjain who crossed the sea with two hundred and forty bundles of Sanskrit texts."
 hd_fo_bio_hui_si:0 "A man of Wujin, a monk at fifteen, devoted to meditation."
 hd_fo_bio_zhi_yi:0 "A man of Huarong in Jingzhou, a monk at eighteen, brilliant beyond others."
 hd_fo_bio_ji_zang:0 "Of Parthian descent, born in Jinling, Indian in looks but Chinese in speech."
 hd_fo_bio_xin_xing:0 "A man of Weijun, a monk at seventeen, known for his austerities."
 hd_fo_bio_dao_xin:0 "A man of Henei who studied meditation with Sengcan as a boy."
 hd_fo_bio_du_shun:0 "A man of Wannian who became a monk at eighteen and was famed for healing wonders."
 hd_fo_bio_dao_xuan:0 "A man of Wuxing, tonsured at sixteen, devoted to the Vinaya."
 hd_fo_bio_unknown:0 "A monk who has come from afar."
