 innovation_zgrc_han_bingfa:0 "Huaxia Art of War"
 innovation_zgrc_han_bingfa_desc:0 "The strategies of Sun and Wu and the Methods of the Sima have been passed down through the ages. Drills are orderly and clear; orders are obeyed and prohibitions observed."
 innovation_zgrc_han_wubei:0 "Imperial Armaments"
 innovation_zgrc_han_wubei_desc:0 "The arts of smelting and forging are mastered, and the making of armor, weapons, bows and crossbows is complete. Heavy infantry and cavalry are formed into armies by regulation."
 zgrc_rende_modifier:0 "Benevolent Gentleman"
 zgrc_rende_modifier_desc:0 "When volunteer troops came to join, this character could not bear to drive them onto the blades, and his name for benevolence spread far and wide."
 zgrc_gouquan_modifier:0 "Clinging to Life"
 zgrc_gouquan_modifier_desc:0 "War is perilous, and this character chose wisdom and self-preservation. Though he may live out his years in peace, holding back while comrades marched to danger weighs on his heart."
 zgrc_zhongyi_modifier:0 "Loyal and Righteous"
 zgrc_zhongyi_modifier_desc:0 "Spent the family fortune to raise troops and rescue lord and father from peril. The community praises this righteousness, and gentry and commoners alike give their hearts."
 zgrc_yexin_modifier:0 "Ambition"
 zgrc_yexin_modifier_desc:0 "This character betrayed their former lord and raised their own banner. Some fear their armies; others despise their character."
 zgrc_ci_zhong:0 "Shrine of the Loyal Martyr"
 zgrc_ci_zhong_desc:0 "The locals have raised a shrine to honor a loyal martyr. Where this righteous fame reaches, the people are stirred to action."
 zgrc_ci_ren:0 "Shrine of Benevolence"
 zgrc_ci_ren_desc:0 "The locals have raised a shrine in gratitude for benevolence. Where this kindly fame reaches, the people are content in their work."
 zgrc_xiang_zui:0 "Statue of Shame"
 zgrc_xiang_zui_desc:0 "An iron statue inscribed with the subject's crimes, so that passersby may take warning."
 zgrc_xiang_ni:0 "Statue of the Spat-Upon Traitor"
 zgrc_xiang_ni_desc:0 "An iron statue that every passing local spits upon; the infamy has yet to fade."
 zgrc_shengci_modifier:0 "Living Shrine"
 zgrc_shengci_modifier_desc:0 "The locals have raised a shrine to worship this character, its incense never ceasing. A worthy name spreads afar, praised in every quarter."
 zgrc_tuozhi_modifier:0 "Spat Upon by All"
 zgrc_tuozhi_modifier_desc:0 "Notorious, with an iron statue in the home district for spitting upon. Everyone on the street gives sidelong glances."
 zgrc_tuozhi_ni_modifier:0 "Infamous in the Homeland"
 zgrc_tuozhi_ni_modifier_desc:0 "For the crime of siding with rebels, shunned by the whole community. Spat upon in life, and in death the soul may yet be punished."
 zgrc_jidan_modifier:0 "Wary"
 zgrc_jidan_modifier_desc:0 "With such ill repute abroad, everyone is on guard. This character keeps a low profile and hides their edge, not daring to act openly again."
 zgrc_opinion_zhongyi:0 "Reputation for Loyalty"
 zgrc_opinion_rende:0 "Reputation for Benevolence"
 zgrc_opinion_yexin:0 "Reputation for Ambition"
 zgrc_opinion_funi:0 "Reputation as a Collaborator"
 zgrc_zufeng_yanzhao_qilu_modifier:0 "Ancestral Ways of Yan-Zhao"
 zgrc_zufeng_yanzhao_qilu_modifier_desc:0 "Their fiery blood remains, ill-suited to gentle customs; out of step with local etiquette, their spirit finds no peace."
 zgrc_zufeng_yanzhao_sanhe_modifier:0 "Ancestral Ways of Yan-Zhao"
 zgrc_zufeng_yanzhao_sanhe_modifier_desc:0 "Too sharp an edge draws the locals' sidelong glances; neither scheming nor speech can be brought to bear."
 zgrc_zufeng_yanzhao_qinlong_modifier:0 "Ancestral Ways of Yan-Zhao"
 zgrc_zufeng_yanzhao_qinlong_modifier_desc:0 "Horse and bow as ever, but the local dialect is unintelligible; longing for home grows daily, and they are melancholy."
 zgrc_zufeng_yanzhao_jingwu_modifier:0 "Ancestral Ways of Yan-Zhao"
 zgrc_zufeng_yanzhao_jingwu_modifier_desc:0 "Their courage is undiminished, but people are not warm to them; their schemes find no outlet, and their mind is uneasy."
 zgrc_zufeng_yanzhao_dongyi_modifier:0 "Ancestral Ways of Yan-Zhao"
 zgrc_zufeng_yanzhao_dongyi_modifier_desc:0 "Their prowess with horse and bow remains; but the speech and customs beyond the frontier are alien, and relations are distant."
 zgrc_zufeng_qilu_yanzhao_modifier:0 "Ancestral Ways of Qi-Lu"
 zgrc_zufeng_qilu_yanzhao_modifier_desc:0 "Their habit of strings and song lingers, but this fierce land scorns letters; their etiquette finds no use, and their schemes no outlet."
 zgrc_zufeng_qilu_sanhe_modifier:0 "Ancestral Ways of Qi-Lu"
 zgrc_zufeng_qilu_sanhe_modifier_desc:0 "Learning shares a common root, but rites and laws are rigid here; schemes are hard to pursue, and words easily misspoken."
 zgrc_zufeng_qilu_qinlong_modifier:0 "Ancestral Ways of Qi-Lu"
 zgrc_zufeng_qilu_qinlong_modifier_desc:0 "The passes and mountains are perilous and remote, the speech and customs strange; a wandering scholar adrift, gloom hard to dispel."
 zgrc_zufeng_qilu_jingwu_modifier:0 "Ancestral Ways of Qi-Lu"
 zgrc_zufeng_qilu_jingwu_modifier_desc:0 "The teachings of the classics remain, but the people of this damp lowland are distant; their schemes go unnoticed, and their mind is uneasy."
 zgrc_zufeng_qilu_dongyi_modifier:0 "Ancestral Ways of Qi-Lu"
 zgrc_zufeng_qilu_dongyi_modifier_desc:0 "They keep up their study of the classics; but the speech and customs of the Liao seacoast are alien, and relations are distant."
 zgrc_zufeng_sanhe_yanzhao_modifier:0 "Ancestral Ways of Three Rivers"
 zgrc_zufeng_sanhe_yanzhao_modifier_desc:0 "Their diligent, steady nature remains, but this fierce land does not prize prudence; etiquette is hard to practice, and their spirit finds no peace."
 zgrc_zufeng_sanhe_qilu_modifier:0 "Ancestral Ways of Three Rivers"
 zgrc_zufeng_sanhe_qilu_modifier_desc:0 "Their farming ways are similar, but in matters of etiquette there is always a barrier; their spirit finds no peace."
 zgrc_zufeng_sanhe_qinlong_modifier:0 "Ancestral Ways of Three Rivers"
 zgrc_zufeng_sanhe_qinlong_modifier_desc:0 "Cut off by passes and mountains, their native accent slowly fades; gazing west toward home, their sorrow is hard to ease."
 zgrc_zufeng_sanhe_jingwu_modifier:0 "Ancestral Ways of Three Rivers"
 zgrc_zufeng_sanhe_jingwu_modifier_desc:0 "Though diligent in making a living, the ways of the rivers and lakes are hard to fathom; their schemes go unnoticed, and their mind is uneasy."
 zgrc_zufeng_sanhe_dongyi_modifier:0 "Ancestral Ways of Three Rivers"
 zgrc_zufeng_sanhe_dongyi_modifier_desc:0 "Old customs are hard to practice in this cold frontier; speech and customs are alien, and relations are distant."
 zgrc_zufeng_qinlong_yanzhao_modifier:0 "Ancestral Ways of Qin-Long"
 zgrc_zufeng_qinlong_yanzhao_modifier_desc:0 "Their skill at riding remains, but this fierce land scorns letters; their etiquette finds no use, and their schemes no outlet."
 zgrc_zufeng_qinlong_qilu_modifier:0 "Ancestral Ways of Qin-Long"
 zgrc_zufeng_qinlong_qilu_modifier_desc:0 "Their saddle-borne habits linger, ill at ease in this land of bows and courtesies; their spirit finds no peace."
 zgrc_zufeng_qinlong_sanhe_modifier:0 "Ancestral Ways of Qin-Long"
 zgrc_zufeng_qinlong_sanhe_modifier_desc:0 "Their galloping nature cannot abide the rites and laws of the Central Plains; neither scheming nor speech can be brought to bear."
 zgrc_zufeng_qinlong_jingwu_modifier:0 "Ancestral Ways of Qin-Long"
 zgrc_zufeng_qinlong_jingwu_modifier_desc:0 "Trading saddle for boat, their conduct fits poorly; their schemes go unnoticed, and their mind is uneasy."
 zgrc_zufeng_qinlong_dongyi_modifier:0 "Ancestral Ways of Qin-Long"
 zgrc_zufeng_qinlong_dongyi_modifier_desc:0 "Ten thousand li beyond the passes, their old skills find no use; speech and customs are alien, and relations are distant."
 zgrc_zufeng_jingwu_yanzhao_modifier:0 "Ancestral Ways of Jing-Wu"
 zgrc_zufeng_jingwu_yanzhao_modifier_desc:0 "Their river-hardened bodies remain strong, but this fierce land does not prize gentleness, and etiquette is hard to practice."
 zgrc_zufeng_jingwu_qilu_modifier:0 "Ancestral Ways of Jing-Wu"
 zgrc_zufeng_jingwu_qilu_modifier_desc:0 "Their courage in riding the tides remains, but they are ill at ease in this land of rites and righteousness; their spirit finds no peace."
 zgrc_zufeng_jingwu_sanhe_modifier:0 "Ancestral Ways of Jing-Wu"
 zgrc_zufeng_jingwu_sanhe_modifier_desc:0 "Their nimble nature cannot abide the gravity of the Central Plains; neither scheming nor speech can be brought to bear."
 zgrc_zufeng_jingwu_qinlong_modifier:0 "Ancestral Ways of Jing-Wu"
 zgrc_zufeng_jingwu_qinlong_modifier_desc:0 "Abandoning boat for horse in a land utterly different; unable to make themselves understood, their gloom is hard to dispel."
 zgrc_zufeng_jingwu_dongyi_modifier:0 "Ancestral Ways of Jing-Wu"
 zgrc_zufeng_jingwu_dongyi_modifier_desc:0 "The land is utterly unlike Jiangnan; speech and customs are alien, and relations are distant."
 zgrc_zufeng_dongyi_yanzhao_modifier:0 "Ancestral Ways of Dongyi"
 zgrc_zufeng_dongyi_yanzhao_modifier_desc:0 "Their gentle, faithful ways remain, but in this land of bold spirits every move draws blame; their schemes find no use."
 zgrc_zufeng_dongyi_qilu_modifier:0 "Ancestral Ways of Dongyi"
 zgrc_zufeng_dongyi_qilu_modifier_desc:0 "Rites and righteousness are shared at heart; only speech and etiquette still require adjustment."
 zgrc_zufeng_dongyi_sanhe_modifier:0 "Ancestral Ways of Dongyi"
 zgrc_zufeng_dongyi_sanhe_modifier_desc:0 "The rules are rigid; schemes are hard to pursue, and words easily misspoken."
 zgrc_zufeng_dongyi_qinlong_modifier:0 "Ancestral Ways of Dongyi"
 zgrc_zufeng_dongyi_qinlong_modifier_desc:0 "The land is utterly different and the speech unintelligible; their gloom is hard to dispel."
 zgrc_zufeng_dongyi_jingwu_modifier:0 "Ancestral Ways of Dongyi"
 zgrc_zufeng_dongyi_jingwu_modifier_desc:0 "The people of the rivers and lakes are glib and slippery, and the gentle are easily taken advantage of; their schemes go unnoticed, and their mind is uneasy."
