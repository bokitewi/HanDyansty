l_english:
 trait_zgrc_hanjia_guandai:0 "Han Cap and Sash"
 trait_zgrc_hanjia_guandai_desc:0 "This character comes from a Han family of cap and sash, refined in conduct and proper in attire."
 trait_zgrc_hanjia_guandai_character_desc:0 "Born to a family of cap and sash, versed in rites and music and devoted to honor, respected by the whole community."
