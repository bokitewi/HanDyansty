 rule_zgrc_luanshi_xiangying:0 "The Realm Answers"
 setting_zgrc_luanshi_xiangying_disabled:0 "Off"
 setting_zgrc_luanshi_xiangying_disabled_desc:0 "In times of chaos, vassals are no longer asked to take a stance."
 setting_zgrc_luanshi_xiangying_player_only:0 "Players Only"
 setting_zgrc_luanshi_xiangying_player_only_desc:0 "Only you (while a vassal) will be asked to take a stance; AI vassals are not troubled by this event."
 setting_zgrc_luanshi_xiangying_enabled:0 "All Characters"
 setting_zgrc_luanshi_xiangying_enabled_desc:0 "Both you and AI vassals will be asked to take a stance in extraordinary times: most AI rally to the throne, a few rise in revolt or wait and see."
 zgrc_innovation_sync_toast_title:0 "Huaxia Innovations Arrive"
 zgrc_innovation_sync_toast_desc:0 "The states of Huaxia are in constant contact, and the new laws and fine institutions of other lands have spread among your people."
 zgrc_hanjia_yiyong:0 "Han Volunteers"
 zgrc_hanjia_yiyong_flavor:0 "These village militiamen farm in peacetime, but take up spears and follow when the beacon fires are lit. Their spear lines are crude yet dense and hard to break, and in sieges they gladly fill the moats and storm the walls."
 zgrc_yuyang_tuqi:0 "Heshuo Flying Cavalry"
 zgrc_yuyang_tuqi_flavor:0 "The horse archers of the Heshuo frontier commanderies excel at mounted archery. Their arrows fall light, swift and unending, and they are superb at pursuing routed foes, leaving raiding horsemen little chance of escape."
 zgrc_liujun_liangjiazi:0 "Six Commanderies Iron Cavalry"
 zgrc_liujun_liangjiazi_flavor:0 "Sons of good families from Tianshui, Longxi and the other Six Commanderies, of exceptional strength and trained in archery from childhood. Clad in heavy armor they become elite iron cavalry, unstoppable in the charge."
 zgrc_hexi_muqi:0 "Hexi Shock Cavalry"
 zgrc_hexi_muqi_flavor:0 "The rich pastures of Hexi and Liang Province produce light cavalry, lightly equipped and skilled archers. Long garrisoned on the frontier, they come and go like the wind, excelling at harassment and pursuit."
 zgrc_jingchu_weishi:0 "Jingchu Guards"
 zgrc_jingchu_weishi_flavor:0 "The land of Jingchu has long been famed for its powerful crossbows, with many skilled crossbowmen among its hills and marshes. These guards form ranks by the water and loose volley upon volley, their bolts darkening the sky."
 zgrc_wuyue_jianshi:0 "Wuyue Swordsmen"
 zgrc_wuyue_jianshi_flavor:0 "The land of Wuyue has prized the sword since antiquity. In close combat these swordsmen are swift as a gale, adept at surging through forests and marshes to cut down the foe, fierce and heedless of death."
 zgrc_wuling_caiguan:0 "Wuling Crossbowmen"
 zgrc_wuling_caiguan_flavor:0 "Among the Five Mausoleum towns of Guanzhong, where powerful clans amassed land, sons of good families were chosen as crossbowmen. They span strong crossbows with their feet, wear heavy armor and hold shields like a wall, reckoned the elite of Guanzhong."
 zgrc_zhongyuan_jieshi:0 "Central Plains Armored Men"
 zgrc_zhongyuan_jieshi_flavor:0 "'Jie' means armor. The armored men of the Central Plains wear light armor and move swiftly, coming and going like the wind. They excel at fighting among field ridges and town streets: gathered, they form a line; scattered, they are hard to find."
 zgrc_beiwei_zhongbu:0 "Beiwei Heavy Infantry"
 zgrc_beiwei_zhongbu_flavor:0 "The personal guard of the commanding general, all chosen from the bravest men. Heavily armored like a wall, steady as a mountain in battle, they shatter the enemy's spearhead when they advance."
 zgrc_beiwei_zhongqi:0 "Beiwei Heavy Cavalry"
 zgrc_beiwei_zhongqi_flavor:0 "The general's personal horsemen, riders and mounts alike clad in iron. In battle they strike like thunder, trampling the enemy camp when they advance."
 zgrc_han_ruishi:0 "Huaxia Elite Soldiers"
 zgrc_han_ruishi_flavor:0 "Heavily armored elite soldiers wielding two-handed long blades, combining protection with killing power. They excel in close combat at cutting down horses and breaking formations, scattering the enemy's front ranks."
 zgrc_han_tuqi:0 "Huaxia Shock Cavalry"
 zgrc_han_tuqi_flavor:0 "Heavily armored elite riders strike the enemy line like a thunderclap. They can crush enemy ranks in a charge across open plains, and also screen the flanks of allied troops."
