 setting_zgrc_init_gongyang_rite_disabled_desc:0 "Do not distribute the Gongyang School at game start; characters may still choose the Gongyang School or their personal tenet when eligible."
 zgrc_debug_distribute_gongyang_rite_decision:0 "Debug: Initialize Gongyang School"
 zgrc_debug_distribute_gongyang_rite_decision_desc:0 "The vanilla-map distribution does not apply to the main mod; this debug decision is disabled."
 zgrc_debug_distribute_gongyang_rite_decision_tooltip:0 "The vanilla Gongyang School distribution does not run on the current map."
 zgrc_debug_distribute_gongyang_rite_decision_confirm:0 "Initialize Gongyang School"
 zgrc_bugongdaitian_opinion:0 "Mortal Enemy"
 nick_zgrc_liezhangfu:0 "the Valiant"
 nick_zgrc_liezhangfu_desc:0 "Slew their great enemy by their own hand, wiping away the shame before all the realm. A truly valiant soul."
