l_english:
 hd_story_yuan_expansion:0 "Yuan Shao: Northern Expansion"
 hd_story_yuan_expansion_desc:0 "With Jizhou as his base, Yuan Shao advances north into Youzhou, east into Qingzhou, and west across the Taihang Mountains. He seeks Shangdang, Henei, Leping, Taiyuan, Xinxing, Yanmen, and Xihe, intending to bring all Hebei under his rule."
 HD_YUAN_EXPANSION_STORY_STATUS:0 "Yuan Shao is campaigning in the chosen direction. Once that campaign is settled, or no enemy remains to be attacked there, another direction can be considered. Yuan Shao must personally order the wars of this campaign."
 HD_YUAN_NORTHERN_LIFE_STORY_STATUS:0 "$HD_YUAN_LIFE_STORY_STATUS$\n\nJizhou, Youzhou, Qingzhou, and the commanderies west of the Taihang Mountains are the foundations of Hebei that Benchu longs to hold. Whoever possesses them all will command the north."
 hd_yuan_expansion.1000.t:0 "A Council of War in Hebei"
 hd_yuan_expansion.1000.desc:0 "The maps and registers of Hebei are laid out again. You study the names of the men who once held its separate territories. Some now answer to the Yuan house; others stubbornly cling to a corner of their own. Your officers report on the last campaign. Only when they have finished do you ask where to march next.\n\nThere is still ground to be gained in Jizhou, Youzhou, and Qingzhou. West of the Taihang Mountains lie Bingzhou and the northern frontier. Many officers want to fight, but your supply lines cannot stretch in every direction they suggest at once.\n\nYou signal the generals to speak one at a time. Today you must decide which campaign comes first; settled lands can be tended in their turn. With soldiers and provisions waiting upon your command, this council must not dissolve into a table of irreconcilable plans."
 hd_yuan_expansion.1000.a:0 "Secure Jizhou first."
 hd_yuan_expansion.1000.b:0 "Advance into Youzhou."
 hd_yuan_expansion.1000.c:0 "Take Qingzhou in the east."
 hd_yuan_expansion.1000.d:0 "Seize Shangdang."
 hd_yuan_expansion.jizhou_tt:0 "Your forces will first turn against the lands of Jizhou that have not submitted. Once this campaign ends, the next move can be considered."
 hd_yuan_expansion.youzhou_tt:0 "Your forces will turn north into Youzhou. Once this campaign ends, the next move can be considered."
 hd_yuan_expansion.qingzhou_tt:0 "Your forces will turn east into Qingzhou. Once this campaign ends, the next move can be considered."
 hd_yuan_expansion.finished_tt:0 "The provinces and commanderies of Hebei are all held by the Yuan house. The campaign to secure the north is complete."
 hd_yuan_expansion_cb:0 "Northern Expansion"
 hd_yuan_expansion_cb_name:0 "Northern Expansion"
 hd_yuan_expansion_cb_war:0 "Yuan Shao's Northern Expansion War"
 hd_yuan_expansion_cb_war_name:0 "Yuan Shao's Northern Expansion War"
 hd_yuan_expansion_cb_victory_desc:0 "Yuan Shao takes all the enemy’s lands: every title held by the defender passes to him, and every vassal beneath the defender transfers allegiance to Yuan Shao."
 hd_yuan_expansion_cb_white_peace_desc:0 "Both sides lay down arms and retain their former borders."
 hd_yuan_expansion_cb_defeat_desc:0 "Yuan Shao returns without gaining ground. Both sides retain their former borders."
 hd_yuan_expansion_cb_invalidated_desc:0 "The grounds for this war no longer stand. It ends with both sides retaining their former borders."
