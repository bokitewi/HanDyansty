l_english:
 hd_story_yuan_expansion:0 "Yuan Shao: Northern Expansion"
 hd_story_yuan_expansion_desc:0 "Consolidate Jizhou and advance into Youzhou and Qingzhou through one regional campaign at a time."
 HD_YUAN_EXPANSION_STORY_STATUS:0 "The active region is checked every 60 days. AI Yuan Shao may start at most one regional war per check when participating in fewer than three wars and the target has no more than twice his current military strength. Each concluded campaign opens a new direction choice. Player Yuan Shao declares his own wars."
 HD_YUAN_NORTHERN_LIFE_STORY_STATUS:0 "$HD_YUAN_LIFE_STORY_STATUS$\n\nNorthern expansion begins in Jizhou after the anti-Dong coalition ends and the existing Han Fu handover war is settled. Every campaign checks its region at 60-day intervals. The Northern Expansion event returns after each campaign, allowing another attempt at any unconsolidated region of Jizhou, Youzhou or Qingzhou. The expansion system ends once all three regions belong to Yuan Shao or his vassals."
 hd_yuan_expansion.1000.t:0 "Northern Expansion"
 hd_yuan_expansion.1000.desc:0 "This phase of the campaign has drawn to a close. Perhaps its counties now acknowledge my authority; perhaps the remaining powers must await a more favorable opportunity. Our deployments must be reconsidered.\n\nJizhou is the foundation of my power, Youzhou guards the northern frontier, and Qingzhou commands the lands toward the sea. I summon my officers to the map: where shall we march next?"
 hd_yuan_expansion.1000.a:0 "Jizhou is not yet secure."
 hd_yuan_expansion.1000.b:0 "Advance into Youzhou."
 hd_yuan_expansion.1000.c:0 "Take Qingzhou in the east."
 hd_yuan_expansion.1000.d:0 "The north is secured; greater ambitions await."
 hd_yuan_expansion.jizhou_tt:0 "Receive a pressed claim on Jizhou unless you already own the title or have a claim, and begin a new 60-day Jizhou campaign. An unfinished Jizhou can be selected again. Northern Expansion will return when this campaign ends."
 hd_yuan_expansion.youzhou_tt:0 "Receive a pressed claim on Youzhou unless you already own the title or have a claim, and begin a new 60-day Youzhou campaign. Northern Expansion will return when this campaign ends."
 hd_yuan_expansion.qingzhou_tt:0 "Receive a pressed claim on Qingzhou unless you already own the title or have a claim, and begin a new 60-day Qingzhou campaign. Northern Expansion will return when this campaign ends."
 hd_yuan_expansion.finished_tt:0 "All de jure counties of Jizhou, Youzhou and Qingzhou belong to Yuan Shao or his vassals. End regional expansion permanently. Other historical stories retain their existing conditions."
 hd_yuan_expansion_cb:0 "Northern Expansion"
 hd_yuan_expansion_cb_name:0 "Northern Expansion"
 hd_yuan_expansion_cb_war:0 "Yuan Shao's Northern Expansion War"
 hd_yuan_expansion_cb_war_name:0 "Yuan Shao's Northern Expansion War"
 hd_yuan_expansion_cb_victory_desc:0 "Yuan Shao takes the defender-owned counties within this war's target kingdom. County vassals follow the native title transaction. No land outside that region or owned by an unrelated realm is taken, and the kingdom title is not automatically transferred."
 hd_yuan_expansion_cb_white_peace_desc:0 "A truce is established. No land changes hands."
 hd_yuan_expansion_cb_defeat_desc:0 "Yuan Shao loses this campaign. A truce is established, and no land changes hands."
 hd_yuan_expansion_cb_invalidated_desc:0 "The regional war ends because Yuan Shao is no longer valid, the realms are no longer enemies, or no original target land remains. No land changes hands."
