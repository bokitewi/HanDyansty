l_english:
 han_artifact_sunzi_bingfa_name:0 "A fine copy of The Art of War by Sun Tzu"
 han_artifact_sunzi_bingfa_description:0 "The military classics transmitted by Sun Wu, comprising thirteen chapters that are concise yet profound, have been essential reading for generals since the Spring and Autumn period. This well-preserved manuscript is neatly bound with silk cords; despite enduring centuries of warfare, its characters remain as fresh as ever. Kept in the secret archives of the Han court, it is worth a fortune."
 han_artifact_liutao_name:0 "Secret Edition of the Six Tactics"
 han_artifact_liutao_description:0 "A military treatise attributed to Jiang Taigong, expounding on the principles of governing and warfare through the Six Tactics: Wen, Wu, Dragon, Tiger, Leopard, and Dog. Preserved in the Han court's archives and copied down through generations by scholars of the martial arts, it is regarded as the legacy of Taigong; its strategies may be emulated when making critical decisions on the battlefield."
 han_artifact_sanlue_name:0 "Secret Edition of the San Lue"
 han_artifact_sanlue_description:0 "A military treatise attributed to the Yellow Stone Hermit, drawing from Confucian, Daoist, Legalist, and military schools of thought, focusing exclusively on generalship and the essentials of governing the state. Legend has it that the Yellow Stone Hermit bestowed this book upon Zhang Liang at a bridge; while its origins cannot be fully verified, its methods are indeed practical and effective."
 han_artifact_simafa_name:0 "Ancient Edition of the Book of Sima"
 han_artifact_simafa_description:0 "The ancient military treatises transmitted by Sima Rangju, though more than half lost, still preserve the ancient rites of military ceremony from the Three Dynasties. The manuscripts kept in the Taifu are neatly organized; from them, generals learn the ancient military rites grounded in benevolence and governed by righteousness, thereby organizing their armies and strengthening their martial prowess, commanding awe throughout the realm."
 han_artifact_wuzi_name:0 "Ancient Edition of Wu Zi"
 han_artifact_wuzi_description:0 "Records of Wu Qi's discussions on warfare with Marquis Wen of Wei, emphasizing internal cultivation of virtue and external preparation for military defense. This ancient manuscript is preserved in the government storehouse and serves as a model for selecting generals, training soldiers, and enforcing strict military discipline. Many renowned commanders who achieved victory in hundreds of battles emerged from this tradition."
 han_artifact_sunbin_bingfa_name:0 "Remnant Scroll of Sun Bin's Art of War"
 han_artifact_sunbin_bingfa_description:0 "The lost works of Sun Bin have long been scattered, but this fragment has resurfaced from ancient tomb collections. Amidst the broken slips and incomplete texts, traces of his brilliant strategies—such as surrounding Wei to rescue Zhao and reducing cooking fires to lure the enemy—are still faintly discernible. Alas, the binding cords have rotted and the paper and ink are deteriorating daily; without restoration and organization, these precious remnants will soon turn to dust."
 han_artifact_weiliaozi_name:0 "Wei Liaozi Critical Edition"
 han_artifact_weiliaozi_description:0 "The \"Wei Liaozi,\" a treatise on military strategy, punishment, and governance, was meticulously annotated by Han dynasty scholars with red ink, leaving official revision marks clearly visible on the imperial bamboo slips. Those who study this work will understand the principles of strict discipline, clear orders, and effective command—wherein lies the essence of military administration."
 han_artifact_mengde_xinshu_name:0 "The New Book of Mengde"
 han_artifact_mengde_xinshu_description:0 "A new treatise on military strategy authored by Cao Cao, compiling decades of battlefield experience; red annotations occasionally appear on the scrolls. It is said that Zhang Song sneered after reading it, prompting Cao Cao to burn the book—whether this tale is true or false remains uncertain, yet every word within contains tactics forged in actual combat."
 han_artifact_bingfa_24_name:0 "Twenty-Four Treatises on Military Strategy"
 han_artifact_bingfa_24_description:0 "The military treatises written by Zhuge Liang in his later years consist of twenty-four chapters, encompassing all the knowledge he acquired throughout his life. Before passing away, he bequeathed them to Jiang Wei; through these texts, the soldiers and generals of Shu Han were able to glimpse the essence of the Prime Minister's tactics. The Wooden Ox and Flowing Horse, as well as the Eight Arrays Formation method, are all mentioned within the chapters."
 han_artifact_qingnang_shu_name:0 "The Green Bag Book"
 han_artifact_qingnang_shu_description:0 "This book contains the entirety of Hua Tuo's medical mastery throughout his life, including surgical procedures such as laparotomy and the formula for Ma Fei San, an anesthetic. At the moment of his execution, Hua Tuo intended to burn this manuscript; fortunately, fragments survived and circulated through various hands. Those who obtain it are as if receiving direct instruction from the Divine Physician themselves, capable of saving lives that would otherwise be lost."
 han_artifact_shanghan_zabing_lun_name:0 "Shanghan Zabing Lun"
 han_artifact_shanghan_zabing_lun_description:0 "Zhang Zhongjing, deeply moved by the death of hundreds of his clan members in a great epidemic, diligently sought ancient teachings and widely collected various prescriptions to compose this book. Its principles are rigorous, its methods complete, it distinguishes the Six Channels and analyzes disease mechanisms; later generations revered it as the ancestor of prescription books. For physicians, possessing this single volume is worth more than acquiring ten thousand pieces of gold."
 han_artifact_taiping_qingling_dao_name:0 "Taiping Qingling Dao"
 han_artifact_taiping_qingling_dao_description:0 "The scripture transmitted by Yu Ji, using talismanic water to cure illnesses and teaching people to bow their heads in repentance. The common people of Jiangdong believed in him as if he were a deity, while the government authorities denounced him for misleading the masses. Whether this is a medical text or a forbidden book depends entirely on who holds it."
 han_artifact_dunjia_tianshu_name:0 "Tunjia Celestial Scripture"
 han_artifact_dunjia_tianshu_description:0 "A mysterious tome passed down by alchemists, containing the secrets of Dunjia divination and methods for predicting celestial movements and verifying omens. The worn silk scroll is ancient and unadorned; if an hermit in the mountains obtains it by chance and studies its teachings, he may glimpse a fragment of heaven's will—or invite disaster upon himself. Its authenticity remains uncertain, and fortune or misfortune cannot be foretold."
 han_artifact_taiping_yaoshu_name:0 "The Essential Techniques of Great Peace"
 han_artifact_taiping_yaoshu_description:0 "The Three Volumes of Heavenly Scripture, transmitted by the Immortal Nanhua Laoxian to Zhang Jiao, grant the power to summon wind and rain and cure illnesses with talismanic water. With this, Zhang Jiao commanded the world: \"The Blue Sky has died; the Yellow Sky shall rise.\" Should the Yellow Turbans fall, these scriptures may be seized by imperial troops or hidden away in deep mountains by their followers."
 han_artifact_shanhaijing_name:0 "Strange Version of the Classic of Mountains and Seas"
 han_artifact_shanhaijing_description:0 "An ancient compendium of mountains, rivers, flora, fauna, exotic beasts, and deities. This variant differs from the copies preserved in the Secret Archives; collators may use it to verify geographical records, while storytellers can draw upon it to recount wondrous tales. Both the Imperial Historian's Office and alchemists regard it as a precious treasure."
 han_artifact_xishu_map_name:0 "Map of the Western Shu terrain"
 han_artifact_xishu_map_description:0 "The map of the treacherous and easy paths of the Shu Road, drawn by the Yizhou government offices, with red and black ink marking the fields and passes on silk. Whoever possesses it can enter Shu as if walking on flat ground; whoever loses it will find even a mighty army unable to cross Jie Gate. The silk map has aged over time, and the ink traces are gradually fading; it is advisable to use it soon."
 han_artifact_imperial_seal_name:0 "Imperial Seal of the Realm"
 han_artifact_imperial_seal_description:0 "The Imperial Seal of the State, carved from the He Shi Bi jade by Qin Shi Huang, bears the eight characters \"Received Mandate from Heaven, Longevity and Eternal Prosperity.\" With the fall of Qin and the rise of Han, the seal returned to the House of Han. Successive emperors revered it as divine. Whoever holds this seal is destined by heaven; if the seal is lost, all under heaven will pursue it."
 han_artifact_wang_mang_head_name:0 "Wang Mang's Head"
 han_artifact_wang_mang_head_description:0 "The severed head of Wang Mang, the usurper who overthrew the Han. According to later historical records, Emperor Gengshi had his head displayed on a pole and preserved in lacquer in 23 AD. Thereafter, it was ranked among the imperial armory's treasured artifacts alongside Confucius's wooden clogs and the sword with which High Ancestor Liu Bang beheaded a snake, until it was destroyed in a great fire at the armory during the Jin Dynasty. The Han court displayed this object in the armory as a warning: the fate of traitors is fully embodied in this single withered skull."
 han_artifact_confucius_shoes_name:0 "Confucius's Clogs"
 han_artifact_confucius_shoes_description:0 "The wooden clogs traditionally attributed to Confucius, a relic of the Sage; scholars approach them with solemn reverence. By the Eastern Han Dynasty, there already existed beliefs honoring Confucius and protecting his sword-and-clogs relics. According to later records, these clogs were eventually requisitioned into the imperial armory, where they were counted among accumulated treasures alongside Wang Mang's severed head. In 184 AD, they came under the collection of the Han court, a dating inferred from earlier holdings in the imperial armory by later generations."
 han_artifact_zhou_ding_name:0 "Zhou Ding"
 han_artifact_zhou_ding_description:0 "The ancestral temple's sacred vessel of the Zhou house, adorned with taotie and coiled dragon patterns that subtly reveal an inscribed message. Though it has endured for several centuries, its majesty remains unaltered. The true worth lies not in the ding itself but in the virtue it embodies—since ancient times, those who have sought to weigh the ding are all traitors. Whoever possesses this vessel shall bring glory to the ancestral temple and honor to their clan."
 han_artifact_heshi_bi_name:0 "He Shi Bi"
 han_artifact_heshi_bi_description:0 "The jade of Mount Jing presented by Bian He, the legendary artifact that returned intact to Zhao. The King of Qin offered fifteen cities in exchange but could never obtain it; the unpolished gem remained whole, warm and radiant. All people say the imperial seal of the State of Yan was carved from this jade disc, though its authenticity remains uncertain. Yet the name of this supreme treasure of the world has endured unchanged for a thousand years."
 han_artifact_four_spirits_mirror_name:0 "Four Spirits Mirror"
 han_artifact_four_spirits_mirror_description:0 "The reverse of the mirror is cast with images of the Four Spirits: Azure Dragon, White Tiger, Vermilion Bird, and Black Tortoise. An inscription band encircles it, while the bronze gleams brightly. Those who hold such a mirror claim it can reveal spirits and ward off misfortune; families celebrating weddings regard it as a precious gift. Over time, copper mirrors develop green patina and should be polished regularly."
 han_artifact_seismograph_name:0 "Seismoscope"
 han_artifact_seismograph_description:0 "Zhang Heng's Houfeng Didong Yi, cast in 132 AD, was a round-bodied bronze vessel with eight dragons holding pearls and toads beneath them to receive them; when the earth shook, the dragons would spit out their pearls to indicate the direction of the tremor. Initially, court officials did not believe in its capabilities, but after an earthquake struck Longxi and the news reached the capital, they all expressed admiration for its ingenuity."
 han_artifact_zhinan_che_name:0 "South Pointing Chariot"
 han_artifact_zhinan_che_description:0 "The wooden man on the carriage always points south, regardless of the direction the vehicle travels or how the mountain roads wind and turn. It is said that Emperor Huangdi created this device to dispel Chiyou's fog; throughout the Han Dynasty, many renowned craftsmen attempted to replicate it, but few succeeded. The mechanism is exquisitely intricate and most vulnerable to erosion from wind and rain."
 han_artifact_white_feather_fan_name:0 "White Feather Fan"
 han_artifact_white_feather_fan_description:0 "A feather fan with a white feather blade and bamboo or wooden handle, featuring an ancient design. Zhuge Kongming draped in a crane-feather cloak waves the white feather fan, strategizing within the tent to decide victory beyond a thousand li. With a gentle sway of the fan, he talks and laughs while strong enemies are reduced to ashes."
 han_artifact_shenshou_inkstone_name:0 "Divine Beast Inkstone"
 han_artifact_shenshou_inkstone_description:0 "Beast-shaped stone inkstone, carved with an archaic simplicity; its inkwell is deep and spacious, while the grinding surface is fine and smooth. Officials of the Shushang Tai (Department of Imperial Edicts) and scholars used this inkstone to draft imperial decrees and collate classics, regarding it as a treasure of the study. Among renowned gentlemen, it was exchanged as gifts in mutual correspondence."
 han_artifact_bianzhong_name:0 "Chime Bells"
 han_artifact_bianzhong_description:0 "A complete set of bronze chimes suspended on wooden frames, arranged by size and cast according to the musical scales of Gong, Shang, Jue, Zhi, and Yu. Indispensable for ancestral temple sacrifices and court banquets, the sound of the bells instantly revives ritual music. In times of war, they are easily dismantled; a complete set is especially rare."
 han_artifact_tongque_name:0 "Copper Crow Tower"
 han_artifact_tongque_description:0 "The bronze furnishings of the Copper Crow Terrace at Ye City, where bronze birds stand poised to take flight amidst mottled rust and majestic grandeur. Cao Cao erected this terrace upon the Zhang River to manifest his aspiration for the hearts of the world to turn toward him. \"The deep spring of the Copper Crow locks the two Qiaos\"—poets still recite these lines a millennium later."
 han_artifact_bronze_chariot_name:0 "Bronze Carriage of the Horse"
 han_artifact_bronze_chariot_description:0 "The scaled-down bronze chariots and horses, cast according to the Han dynasty's regulations for vehicles and horses, feature carriages, clothing, wheels, and axles that all conform precisely to prescribed standards. High-ranking officials and marquis display them in their residences to honor the dignity of court ceremonial protocols. Some were crafted by skilled artisans as gifts bestowed upon the powerful, while others originated as burial offerings placed within grand tombs."
 han_artifact_boshanlu_name:0 "Bronze Incense Burner with Gold Inlay"
 han_artifact_boshanlu_description:0 "The incense burner is cast in the shape of an immortal mountain from the sea, with gold-inlaid patterns depicting layered peaks and hidden smoke vents throughout. When burning incense, blue smoke rises from between the mountains, swirling around the peaks like clouds and mist, filling the room with an ethereal aura. For banquets and scholarly gatherings, this burner is a superior piece."
 han_artifact_changxin_lamp_name:0 "Changxin Palace Lamp"
 han_artifact_changxin_lamp_description:0 "A gilded bronze lamp from the imperial collection of the Western Han Dynasty, depicting a kneeling maid holding the lamp; its smoke enters her sleeve without dispersing into the room—a design so ingenious it leaves one in awe. After years sealed within the old palace and dust wiped away, the grandeur of the court from those days remains visible."
 han_artifact_crane_feather_fan_name:0 "Crane Feather Fan"
 han_artifact_crane_feather_fan_description:0 "A long-handled feather fan crafted from the gray-and-white feathers of a crane, more refined and steady than the white-feathered variety; only a strategist or veteran general may wield it. When deployed in planning, wave it gently to command the three armies as if moving one's own limbs. Whoever obtains this fan shall be a strategist of an era."
