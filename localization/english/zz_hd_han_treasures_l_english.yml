l_english:
 han_artifact_sunzi_bingfa_name:0 "Fine Copy of The Art of War"
 han_artifact_sunzi_bingfa_description:0 "The supreme classic of warfare handed down from Sunzi, thirteen chapters of concentrated wisdom that every commander since Spring and Autumn times has studied. This fine copy, its bamboo slips neatly bound with silk cord, has survived centuries of war with its characters still fresh. Kept in the Han imperial library, it is worth a fortune."
 han_artifact_liutao_name:0 "Secret Text of the Six Secret Teachings"
 han_artifact_liutao_description:0 "A military classic attributed to Grand Duke Jiang Taigong, expounding the arts of statecraft and war through six teachings: civil, martial, dragon, tiger, leopard and hound. Transmitted among the imperial library and famous strategists for generations, it is revered as the Grand Duke's living method."
 han_artifact_sanlue_name:0 "Secret Text of the Three Strategies"
 han_artifact_sanlue_description:0 "A military treatise attributed to the Sage Huang Shigong, weaving together Confucian, Daoist, Legalist and military thought on generalship and governance. Legend says Huang Shigong bestowed it upon Zhang Liang on a bridge — the tale may strain belief, but the method proves itself in practice."
 han_artifact_simafa_name:0 "Ancient Copy of the Methods of Sima"
 han_artifact_simafa_description:0 "The old military methods of Sima Rangju, half lost to time yet preserving the martial rites of the ancient kings. The Grand Commandant's copy is neatly bound, and from it generals learn the ancient principle that benevolence is the root and righteousness the rule of armies."
 han_artifact_wuzi_name:0 "Ancient Copy of the Wuzi"
 han_artifact_wuzi_description:0 "Records of Wu Qi's discourses on war with Marquis Wen of Wei: cultivate virtue within, prepare arms without. This ancient copy rests in the vaults, a model text for selecting generals, drilling troops and enforcing discipline."
 han_artifact_sunbin_bingfa_name:0 "Fragmentary Scroll of Sun Bin's Art of War"
 han_artifact_sunbin_bingfa_description:0 "The lost work of Sun Bin, recovered in fragments from an old tomb hoard. Among the broken slips one can still trace the stratagems of besieging Wei to rescue Zhao and the deceptive stoves that lured Pang Juan to his death. But the binding cords are rotten and the ink fades daily — without careful restoration, it will crumble to dust."
 han_artifact_weiliaozi_name:0 "Collated Edition of the Weiliaozi"
 han_artifact_weiliaozi_description:0 "Wei Liao's treatise on military command, law and governance, its text collated in vermillion ink by Han court scholars. The commander who studies it in earnest will grasp the way of strict orders and iron discipline — the very marrow of military administration."
 han_artifact_mengde_xinshu_name:0 "Mengde's New Book"
 han_artifact_mengde_xinshu_description:0 "Cao Cao's new treatise on war, distilling decades of battlefield experience, its slips annotated in his own vermillion hand. Legend claims Zhang Song smirked after reading it, and Cao Cao burned the book in fury — apocryphal perhaps, yet every stratagem in these pages was bought with real blood."
 han_artifact_bingfa_24_name:0 "Twenty-Four Chapters on the Art of War"
 han_artifact_bingfa_24_description:0 "Zhuge Liang's late-life treatise on war, twenty-four chapters containing the sum of his learning. On his deathbed he ordered it bestowed upon Jiang Wei, and through it the soldiers of Shu Han glimpsed the essence of the Chancellor's generalship — the wooden ox, the flowing horse, the Eight Formations."
 han_artifact_qingnang_shu_name:0 "The Book of the Green Satchel"
 han_artifact_qingnang_shu_description:0 "The lifetime medical learning of Hua Tuo inscribed in this book — the arts of opening the abdomen and the powder of mafeisan all recorded within. Facing execution, Hua Tuo sought to burn it, yet a fragment survived and passed from hand to hand. Its keeper is as though taught by the divine physician himself, able to save those beyond saving."
 han_artifact_shanghan_zabing_lun_name:0 "Treatise on Cold Damage and Miscellaneous Diseases"
 han_artifact_shanghan_zabing_lun_description:0 "Zhang Zhongjing, grieving the hundreds of his kin carried off by pestilence, sought the ancient teachings and gathered every remedy to complete this work. Rigorous in principle, complete in prescriptions, distinguishing the six channels of disease — later ages honor it as the ancestor of all formularies. One volume in hand is worth a thousand in gold to a physician."
 han_artifact_taiping_qingling_dao_name:0 "The Taiping Qingling Dao"
 han_artifact_taiping_qingling_dao_description:0 "The sacred book of the tradition of Yu Ji, healing with talisman water and teaching penitence. The common folk of Jiangdong revere it as divine; the officials condemn it as sedition. Scripture or forbidden text — it all depends upon whose hands it falls into."
 han_artifact_dunjia_tianshu_name:0 "The Celestial Book of Dunjia"
 han_artifact_dunjia_tianshu_description:0 "A rare book secretly transmitted among fangshi adepts, recording the arts of dunjia divination and celestial reckoning. A worn silk scroll, plain and ancient. Some hermit in the mountains may chance to receive it — mastering a corner of heaven's design, or drawing death upon himself. Genuine or false, blessing or bane, none can say."
 han_artifact_taiping_yaoshu_name:0 "The Taiping Yaoshu"
 han_artifact_taiping_yaoshu_description:0 "The three celestial volumes the immortal of the Southern Flower bestowed upon Zhang Jue, granting power over wind and rain and healing through talisman water. With this book Zhang Jue rallied the realm: the Azure Heaven is dead, the Yellow Heaven shall rise. Should the Yellow Turbans fall, it will be seized by imperial troops or hidden away by faithful hands."
 han_artifact_shanhaijing_name:0 "Variant Edition of the Classic of Mountains and Seas"
 han_artifact_shanhaijing_description:0 "The ancient book of mountains, rivers, strange beasts and spirits. This variant edition differs here and there from the imperial library copy — collators may use it to settle questions of geography, raconteurs to fuel tales of wonder. Astrologers and fangshi alike treasure it."
 han_artifact_xishu_map_name:0 "Map of Western Shu"
 han_artifact_xishu_map_description:0 "The map of Shu's mountain passes and river crossings drawn by the Yi Province administration, its roads and fortresses marked in vermillion and ink. With it, one enters Shu as if strolling a plain; without it, even a mighty host cannot force the Sword Pavilion. The silk ages and the ink fades — use it soon."
 han_artifact_imperial_seal_name:0 "Heirloom Imperial Seal"
 han_artifact_imperial_seal_description:0 "The seal of state carved by the First Emperor from the jade of He, inscribed with the eight characters: Having received the Mandate of Heaven, may the Emperor live long and prosper eternally. Qin fell, Han rose, and the seal passed to the House of Han, revered by successive sovereigns. Whoever holds this seal holds the Mandate itself; when it is lost, all under heaven give chase."
 han_artifact_wang_mang_head_name:0 "Head of Wang Mang"
 han_artifact_wang_mang_head_description:0 "The severed head of Wang Mang, usurper of the Han throne. Later histories record that in 23 AD the Gengshi Emperor had it lacquered and preserved, thereafter kept among the dynastic treasures of the imperial armory alongside Confucius's shoe and the Founder's snake-slaying sword, until an armory fire in a later age consumed it. The Han court displays it as a warning: such is the fate of usurpers, sealed in one withered skull."
 han_artifact_confucius_shoes_name:0 "Shoes of Confucius"
 han_artifact_confucius_shoes_description:0 "The wooden clogs said to have been worn by the Sage himself; scholars bow in reverence at the sight. By the Eastern Han the protection of the Master's sword and shoes was already an honored tradition, and later records tell how the shoe entered the imperial armory among the dynastic treasures alongside the head of Wang Mang. Its presence in the Han collection by 184 AD is an inference drawn from these later armory records."
 han_artifact_zhou_ding_name:0 "Bronze Ding of Zhou"
 han_artifact_zhou_ding_description:0 "A ritual cauldron of the Zhou royal ancestral temple, taotie and coiled-dragon designs half-concealing ancient inscriptions, its majesty undimmed after centuries. The virtue lies not in the ding but in its keeper — yet those who inquire after the ding's weight have always been disloyal men. The hall that holds it shines, and the whole clan shares the honor."
 han_artifact_heshi_bi_name:0 "Jade of He"
 han_artifact_heshi_bi_description:0 "The jade of Mount Jing presented by Bian He, hero of the legend of returning the bi intact to Zhao. The King of Qin offered fifteen cities for it and never obtained it. Uncut and unpolished, warm and luminous — men say the Heirloom Seal was carved from this very stone. True or not, its name as the foremost treasure under heaven has not shifted in a thousand years."
 han_artifact_four_spirits_mirror_name:0 "Mirror of the Four Spirits"
 han_artifact_four_spirits_mirror_description:0 "A bronze mirror cast on its back with the four spirits — Azure Dragon, White Tiger, Vermilion Bird and Black Tortoise — ringed by an inscribed band. Its Han owner believes it can reveal demons and ward off misfortune; bridal families count it among the grandest gifts. Bronze clouds green with age — polish it often."
 han_artifact_seismograph_name:0 "Earthquake Weathervane"
 han_artifact_seismograph_description:0 "The seismoscope cast by Zhang Heng in 132 AD: a round bronze vessel with eight dragons holding balls, toads beneath to receive them — when the earth moves, a dragon drops its ball to show the quarter. The court scoffed at first, until the earthquake in Longxi arrived by post and every skeptic was silenced."
 han_artifact_zhinan_che_name:0 "South-Pointing Chariot"
 han_artifact_zhinan_che_description:0 "A chariot whose wooden figure points south no matter how the vehicle turns, through winding mountains and reversed roads. The Yellow Emperor is said to have built one to pierce Chiyou's mists; Han master craftsmen have tried to copy it, and few have succeeded. Its mechanism is delicate — rain and wind are its enemies."
 han_artifact_white_feather_fan_name:0 "White Feather Fan"
 han_artifact_white_feather_fan_description:0 "A fan of plain white feathers on a bamboo handle, of ancient and unadorned form. Zhuge Kongming, draped in crane-feather cloak, waved this white fan while planning in his tent and deciding victory a thousand li away. One light flick of the feathers, and a mighty enemy turns to ash amid talk and laughter."
 han_artifact_shenshou_inkstone_name:0 "Divine Beast Inkstone"
 han_artifact_shenshou_inkstone_description:0 "A beast-shaped stone inkstone, carved with rugged simplicity, its ink pool deep and grinding face fine. Secretariat officials and men of letters draft edicts and collate classics upon it, prizing it among the treasures of the study, passing it from hand to hand as a treasured gift."
 han_artifact_bianzhong_name:0 "Chime Bells"
 han_artifact_bianzhong_description:0 "A matched set of bronze chime bells hung in graded sizes from a wooden frame, cast to the pitches of the five tones. No ancestral sacrifice or court banquet can do without them — one strike, and rites and music arise of themselves. Easily scattered in wartime; a complete set is rare indeed."
 han_artifact_tongque_name:0 "Bronze Sparrow"
 han_artifact_tongque_description:0 "The bronze sparrow cast for the Bronze Sparrow Terrace in Ye, head high and wings gathered for flight, its verdigris mottling a majestic form. Cao Cao raised the terrace above the Zhang River to proclaim the realm's hearts turning toward him. Spring deepens on the terrace, locking up the two Qiaos — poets still sing of it a thousand years on."
 han_artifact_bronze_chariot_name:0 "Bronze Chariot and Horses"
 han_artifact_bronze_chariot_description:0 "A scale-model chariot and horses cast according to Han court regulations, carriage, shafts and wheels all true to rule. Ministers and marquises display it in their mansions to honor the majesty of imperial institutions — or craftsmen present it to the powerful, or it emerges from some great tomb."
 han_artifact_boshanlu_name:0 "Gold-Inlaid Boshan Censer"
 han_artifact_boshanlu_description:0 "A censer whose lid is cast as immortal isles rising from the sea, inlaid with gold, peaks stacked upon peaks and apertures hidden throughout. When incense burns, blue smoke rises through the mountains like mists wreathing the summits, filling the room with an air of immortals. The finest piece for any banquet."
 han_artifact_changxin_lamp_name:0 "Changxin Palace Lamp"
 han_artifact_changxin_lamp_description:0 "A gilded bronze lamp from the old Western Han palaces: a palace maid kneels holding the lamp, and the smoke is drawn into her sleeve so none scatters through the room — a design of astonishing ingenuity. Long sealed in dust in the old palace, wiped clean it still bears the air of the inner court of its day."
 han_artifact_crane_feather_fan_name:0 "Crane Feather Fan"
 han_artifact_crane_feather_fan_description:0 "A long-handled fan of grey-white crane feathers, weightier and more composed than the white feather fan — none but a seasoned strategist should bear it. Waved slowly amid the councils of war, it directs three armies like one's own arm. Its keeper is destined to be a master strategist of the age."
