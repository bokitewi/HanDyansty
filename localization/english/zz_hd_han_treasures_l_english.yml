l_english:
 han_artifact_sunzi_bingfa_name:0 "A fine copy of The Art of War by Sun Tzu"
 han_artifact_sunzi_bingfa_description:0 "The thirteen chapters of military strategy handed down by Sun Wu are concise yet profound, studied by generals since the Spring and Autumn period. This fine copy has neatly arranged bamboo slips bound with silk cords. Long kept in the private archives, its writing is still fresh."
 han_artifact_liutao_name:0 "Secret Edition of the Six Tactics"
 han_artifact_liutao_description:0 "Traditionally attributed to Taigong Wang, this work discusses government and warfare through its Six Tactics: Civil, Military, Dragon, Tiger, Leopard and Dog. Military scholars have copied it for generations, regarding it as Taigong's legacy and following its methods when making decisions in battle."
 han_artifact_sanlue_name:0 "Secret Edition of the San Lue"
 han_artifact_sanlue_description:0 "Legend says that Huangshi Gong gave Zhang Liang this work on a bridge. Drawing on the teachings of various schools, the Three Strategies focus on generalship and the essentials of government. Though their origins cannot be fully verified, their methods remain useful."
 han_artifact_simafa_name:0 "Ancient Edition of the Book of Sima"
 han_artifact_simafa_description:0 "The ancient military teachings passed down by Sima Rangju preserve the old military rites of the Three Dynasties, though more than half of their chapters have been lost. Generals who read them can learn how the ancients grounded warfare in benevolence and conducted their armies with righteousness."
 han_artifact_wuzi_name:0 "Ancient Edition of Wu Zi"
 han_artifact_wuzi_description:0 "Wu Qi's discussions of warfare with Marquis Wen of Wei advocate cultivating civil virtue at home and maintaining military readiness abroad. This book serves as a model for selecting generals, training troops and enforcing strict military law."
 han_artifact_sunbin_bingfa_name:0 "Remnant Scroll of Sun Bin's Art of War"
 han_artifact_sunbin_bingfa_description:0 "Sun Bin's writings have long been lost and scattered, but this fragment has resurfaced from an old collection in an ancient tomb. Among its broken slips and incomplete text, strategies such as besieging Wei to rescue Zhao and reducing cooking fires to lure the enemy can still faintly be discerned. Yet its binding cords have rotted and the ink on the slips grows fainter by the day. Without arranging and preserving it, the work may soon crumble to dust."
 han_artifact_weiliaozi_name:0 "Wei Liaozi Critical Edition"
 han_artifact_weiliaozi_description:0 "A work by Wei Liao on warfare, punishment, and government. Earlier scholars corrected its official bamboo slips in red ink, leaving clear collation notes. Commanders who read it learn the importance of discipline, clear laws, and carefully considered orders."
 han_artifact_mengde_xinshu_name:0 "The New Book of Mengde"
 han_artifact_mengde_xinshu_description:0 "Cao Cao compiled the military teachings of earlier schools and combined them with lessons from his own campaigns to write this book. Red annotations appear among the bamboo slips; every word comes from the battlefield."
 han_artifact_bingfa_24_name:0 "Twenty-Four Treatises on Military Strategy"
 han_artifact_bingfa_24_description:0 "Zhuge Liang set down the essentials of a lifetime of command in twenty-four chapters. Methods for marching, forming ranks, and managing armies appear throughout, alongside diagrams of the Eight Arrays and designs for the Wooden Ox and Flowing Horse."
 han_artifact_qingnang_shu_name:0 "The Green Bag Book"
 han_artifact_qingnang_shu_description:0 "Hua Tuo recorded his lifetime of medical knowledge here, including abdominal surgery, washing the intestines, and the use of Ma Fei San. Few copies circulate. Possessing one is like receiving instruction from the Divine Physician himself, allowing its reader to save those whom others cannot."
 han_artifact_shanghan_zabing_lun_name:0 "Shanghan Zabing Lun"
 han_artifact_shanghan_zabing_lun_description:0 "Grieving the loss of many clansmen to epidemic disease, Zhang Zhongjing sought ancient teachings and gathered prescriptions to compile this book. It distinguishes the Six Channels, examines how illnesses develop, and sets out both prescriptions and the symptoms they treat. To a physician, this volume is worth more than a thousand pieces of gold."
 han_artifact_taiping_qingling_dao_name:0 "Taiping Qingling Dao"
 han_artifact_taiping_qingling_dao_description:0 "A Daoist scripture transmitted by Yu Ji, using talismanic water to treat illness and teaching people to bow their heads and reflect on their faults. The people of Jiangdong revere him as a god, while officials denounce his teachings as deceitful delusions. Whether this book brings relief to the world or deceives the masses depends on whose hands it reaches."
 han_artifact_dunjia_tianshu_name:0 "Tunjia Celestial Scripture"
 han_artifact_dunjia_tianshu_description:0 "A secret book handed down by masters of esoteric arts, containing Dunjia calculations and methods for divination and testing omens. Its silk scroll is old; tradition says a mountain recluse passed it on. Studying it may reveal a glimpse of Heaven's secrets, or bring death upon its reader."
 han_artifact_taiping_yaoshu_name:0 "The Essential Techniques of Great Peace"
 han_artifact_taiping_yaoshu_description:0 "Tradition says the Immortal Nanhua gave Zhang Jiao these three volumes of heavenly scripture, with which he could summon wind and rain and heal through talismanic water. Zhang Jiao preached from them for more than ten years, drawing followers throughout Qing, Xu, You, Ji, Jing, Yang, Yan, and Yu provinces."
 han_artifact_shanhaijing_name:0 "Variant of the Classic of Mountains and Seas"
 han_artifact_shanhaijing_description:0 "An ancient compendium of mountains, rivers, flora, fauna, exotic beasts, and deities. This variant differs from the copies preserved in the Secret Archives; collators may use it to verify geographical records, while storytellers can draw upon it to recount wondrous tales. Both the Imperial Historian's Office and alchemists regard it as a precious treasure."
 han_artifact_xishu_map_name:0 "Map of the Western Shu terrain"
 han_artifact_xishu_map_description:0 "A silk map drawn by the officials of Yizhou, showing the terrain of Shu and marking roads and passes in red and black ink. Its holder can enter Shu as though walking on level ground; without it, even a mighty army can only lament the difficulty of the Shu roads. The map is old, and its ink is fading."
 han_artifact_imperial_seal_name:0 "Imperial Seal of the Realm"
 han_artifact_imperial_seal_description:0 "The seal made by the First Emperor of Qin, traditionally said to have been carved from the He Shi Bi, bears the inscription: Received the mandate from Heaven, may longevity and prosperity endure. When Qin fell and Han rose, the seal passed to the Han house, whose emperors revered it as sacred. Its holder seems favored by Heaven; if it is lost, all under heaven will pursue it."
 han_artifact_wang_mang_head_name:0 "Wang Mang's Head"
 han_artifact_wang_mang_head_description:0 "The severed head of Wang Mang, who usurped the Han. When Han troops entered Chang'an, he died at Jiantai. His head was sent to the market at Wan, where people fought to strike it; some even cut off and ate his tongue. It was later kept in the armory beside Confucius's clogs and Gaozu's snake-slaying sword as a treasured relic and a warning to usurpers."
 han_artifact_confucius_shoes_name:0 "Confucius's Clogs"
 han_artifact_confucius_shoes_description:0 "Wooden clogs traditionally said to have been worn by Confucius. Confucian scholars approach this relic of the Sage with reverence. Kept in the armory, the clogs stand alongside Gaozu's snake-slaying sword and Wang Mang's head among the treasures inherited through the generations."
 han_artifact_zhou_ding_name:0 "Zhou Ding"
 han_artifact_zhou_ding_description:0 "The ancestral temple's sacred vessel of the Zhou house, adorned with taotie and coiled dragon patterns that subtly reveal an inscribed message. Though it has endured for several centuries, its majesty remains unaltered. The true worth lies not in the ding itself but in the virtue it embodies—since ancient times, those who have sought to weigh the ding are all traitors. Whoever possesses this vessel shall bring glory to the ancestral temple and honor to their clan."
 han_artifact_heshi_bi_name:0 "He Shi Bi"
 han_artifact_heshi_bi_description:0 "Bian He found this uncut jade at Mount Jing and presented it to the kings of Chu three times, suffering the loss of his feet twice before the jade within was revealed. The King of Qin offered fifteen cities for it, but Lin Xiangru returned it intact to Zhao. People say the Imperial Seal was carved from this disc, though the truth is uncertain. Its fame as a supreme treasure has endured."
 han_artifact_four_spirits_mirror_name:0 "Four Spirits Mirror"
 han_artifact_four_spirits_mirror_description:0 "The reverse of the mirror is cast with images of the Four Spirits: Azure Dragon, White Tiger, Vermilion Bird, and Black Tortoise. An inscription band encircles it, while the bronze gleams brightly. Those who hold such a mirror claim it can reveal spirits and ward off misfortune; families celebrating weddings regard it as a precious gift. Over time, copper mirrors develop green patina and should be polished regularly."
 han_artifact_seismograph_name:0 "Seismoscope"
 han_artifact_seismograph_description:0 "In the first year of Yangjia, the Grand Historian Zhang Heng cast this seismoscope. Its round body resembles a wine vessel; eight dragons hold balls above waiting toads. When the earth moves, a dragon releases its ball to show the direction. Once, a ball fell without any tremor being felt in the capital, leaving scholars doubtful. Days later, a courier reported an earthquake in Longxi, and they marveled at the device."
 han_artifact_zhinan_che_name:0 "South Pointing Chariot"
 han_artifact_zhinan_che_description:0 "A wooden figure on this chariot points south with an outstretched arm. Whatever direction the vehicle takes along winding mountain roads, its hand still points south. Tradition says the Yellow Emperor made it to overcome Chiyou's fog. Master craftsmen across the ages have tried to reproduce it, with few successes. Its delicate mechanism is especially vulnerable to wind and rain."
 han_artifact_white_feather_fan_name:0 "White Feather Fan"
 han_artifact_white_feather_fan_description:0 "A plain white feather fan with a bamboo or wooden handle, simple in form. Learned gentlemen discussing ideas and advisers planning campaigns wave it slowly, composed and unhurried, as though entire armies rested upon each movement."
 han_artifact_shenshou_inkstone_name:0 "Divine Beast Inkstone"
 han_artifact_shenshou_inkstone_description:0 "A beast-shaped stone inkstone, carved in an archaic style, with a deep, broad inkwell and a fine grinding surface. Officials of the Secretariat and scholars use it to draft edicts and collate texts, treasuring it as an object of the study and exchanging it as a gift among learned gentlemen."
 han_artifact_bianzhong_name:0 "Chime Bells"
 han_artifact_bianzhong_description:0 "A complete set of bronze chimes suspended on wooden frames, arranged by size and cast according to the musical scales of Gong, Shang, Jue, Zhi, and Yu. Indispensable for ancestral temple sacrifices and court banquets, the sound of the bells instantly revives ritual music. In times of war, they are easily dismantled; a complete set is especially rare."
 han_artifact_tongque_name:0 "Bronze Sparrow"
 han_artifact_tongque_description:0 "The bronze sparrow from the terrace at Ye raises its head and spreads its wings as if about to take flight, its mottled rust lending it a solemn grandeur. Cao Cao built the terrace beside the Zhang River and composed poetry there, expressing his hope that the realm would turn to him."
 han_artifact_bronze_chariot_name:0 "Bronze Carriage of the Horse"
 han_artifact_bronze_chariot_description:0 "The scaled-down bronze chariots and horses, cast according to the Han dynasty's regulations for vehicles and horses, feature carriages, clothing, wheels, and axles that all conform precisely to prescribed standards. High-ranking officials and marquis display them in their residences to honor the dignity of court ceremonial protocols. Some were crafted by skilled artisans as gifts bestowed upon the powerful, while others originated as burial offerings placed within grand tombs."
 han_artifact_boshanlu_name:0 "Bronze Incense Burner with Gold Inlay"
 han_artifact_boshanlu_description:0 "The lid of this incense burner is cast as an immortal mountain rising from the sea, its layered peaks traced in gold inlay and pierced by hidden smoke vents. When incense burns, blue smoke curls between the peaks like clouds and mist, filling the room with an otherworldly air. It is prized at banquets and scholarly gatherings."
 han_artifact_changxin_lamp_name:0 "Changxin Palace Lamp"
 han_artifact_changxin_lamp_description:0 "A gilded bronze lamp once kept in Changxin Palace in the western capital. A kneeling palace maid holds the light, drawing its smoke into her sleeve rather than letting it fill the room. Its ingenious design inspires admiration. Brushing away the dust of years reveals something of the old court's splendor."
 han_artifact_crane_feather_fan_name:0 "Crane Feather Fan"
 han_artifact_crane_feather_fan_description:0 "A long-handled fan made from gray-white crane feathers, more restrained and dignified than a white feather fan, befitting a master strategist. Waved slowly before the battle lines, it commands the armies as readily as one moves a hand."
