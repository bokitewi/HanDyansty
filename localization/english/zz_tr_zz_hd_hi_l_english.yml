 hd_hi.kebineng.t:0 "Ke Bineng Raids the Frontier"
 hd_hi.kebineng.ctx:0 "After Tanshihuai's death, the Xianbei tribes went their separate ways. Ke Bineng, born of a minor tribe, was fair in reward and punishment, and gradually gathered the tribes south of the desert, commanding over a hundred thousand mounted archers."
 hd_hi.kebineng.rise:0 "\n\nKe Bineng gathers the horsemen of the tribes, crosses the Great Wall, and strikes straight at Dai and Shanggu Commanderies. The frontier beacons all blaze up in a single night."
 hd_hi.kebineng.wait:0 "\n\nThe Han frontier commanderies are still well defended, and Ke Bineng dares not move rashly. Beyond the wall he gathers scattered tribesmen, hones his horsemen and bows, and awaits the moment to strike south."
 hd_hi.shujineng.t:0 "The Rebellion of Shujineng"
 hd_hi.shujineng.ctx:0 "Years of severe drought have struck the Qin and Liang regions, and officials press hard for taxes and labor; resentment runs deep among the Hexi Xianbei and the Qiang. Shujineng of the Tufa tribe is brave and resourceful, and many of the Hu are willing to follow his command."
 hd_hi.shujineng.rise:0 "\n\nShujineng slays the Inspector sent to suppress him; the Hu of Hexi rise in answer, and the roads of Liang Province are cut."
 hd_hi.shujineng.wait:0 "\n\nThe court keeps strong forces garrisoned in Qin and Liang, so Shujineng bides his time, secretly contacting the Qiang tribes and carrying his hatred on his blade."
 hd_hi.muronghui.t:0 "The Rise of Murong Hui"
 hd_hi.muronghui.ctx:0 "The Murong tribe has long dwelt in Liaoxi, contending with the Duan and Yuwen tribes. When the young Murong Hui inherited the tribe, he taught his people farming and sericulture and welcomed exiled scholars from the Central Plains, and his following grew by the day."
 hd_hi.muronghui.rise:0 "\n\nMurong Hui reorganizes his people, attacks Fuyu to the east and resists the Duan and Yuwen to the west, determined to bring all of Liaoxi and Liaodong under the Murong banner."
 hd_hi.muronghui.wait:0 "\n\nThe tribes of Liaodong are evenly matched, so Murong Hui sheathes his blade for now, settling refugees while waiting for his rivals to show a weakness."
 hd_hi.murongjun.t:0 "Former Yan Enters the Central Plains"
 hd_hi.murongjun.ctx:0 "The Central Plains are in great turmoil: Ran Min has massacred the Hu, Hu and Han slaughter one another, and Hebei is scorched earth. The Murong of Liaoxi, strong in troops and horses, watch from north of the Great Wall."
 hd_hi.murongjun.rise:0 "\n\nMurong Jun marches south in three columns, crosses the Lulong Pass, and strikes straight at Jicheng. The iron cavalry of Yan mean to take all of Hebei."
 hd_hi.murongjun.wait:0 "\n\nWithin the passes things remain fairly stable, so Murong Jun holds his troops, sharpening his weapons and feeding his horses in Liaoxi while awaiting upheaval in the Central Plains."
 hd_hi.tuobagui.t:0 "Tuoba Gui Restores Dai and Founds Wei"
 hd_hi.tuobagui.ctx:0 "After the fall of Dai, the descendants of the Tuoba scattered among other tribes. The young Tuoba Gui lives as a dependent under another's roof, yet the old followers have never forgotten the Tuoba's kindness."
 hd_hi.tuobagui.rise:0 "\n\nAt Niuchuan, Tuoba Gui convenes a great assembly of the tribes and takes the throne as King of Dai, soon renaming his state Wei. Tuoba horsemen once again gallop at the foot of the Yin Mountains."
 hd_hi.tuobagui.wait:0 "\n\nThe tribal chiefs each harbor their own designs, and Tuoba Gui's wings are not yet grown. He must shelter among his kin, cultivating old followers while awaiting Heaven's moment."
 hd_hi.murongchui.t:0 "Murong Chui Restores His State"
 hd_hi.murongchui.ctx:0 "Long ago Murong Chui fled to another state to escape disaster, his talents left unused. Now the realm is in upheaval, and the remnant people of old Yan still wait in Hebei for the Murong to return."
 hd_hi.murongchui.rise:0 "\n\nAt Xingyang, Murong Chui proclaims himself King of Yan. His old followers flock to him at the news, and his great army crosses the Yellow River northward, heading straight for Ye."
 hd_hi.murongchui.wait:0 "\n\nFor now the times are not yet in chaos, and Murong Chui can only bide his time, gathering the young men of the Murong clan and awaiting a moment when a single call will rally hundreds."
 hd_hi.yaochang.t:0 "Yao Chang Founds Qin"
 hd_hi.yaochang.ctx:0 "The Yao clan of the Qiang has long dwelt in Guanzhong, numbering tens of thousands. Yao Chang spent half his life campaigning alongside his father and brothers; now his brothers are all dead, and the fate of the Qiang rests on him alone."
 hd_hi.yaochang.rise:0 "\n\nYao Chang flees north of the Wei River, where the Qiang tribes acclaim him their leader. He proclaims himself Grand Chanyu and King of Qin of Wannian, and war rises again in Guanzhong."
 hd_hi.yaochang.wait:0 "\n\nGuanzhong still has a strong master, so Yao Chang bows his head for now, drawing the Qiang chiefs to his side one by one."
 hd_hi.qifuguoren.t:0 "Qifu Guoren Founds Western Qin"
 hd_hi.qifuguoren.ctx:0 "The Qifu tribe has long dwelt in Longxi, more than once submitting to strong neighbors. Qifu Guoren is brave and resourceful beyond others, and his people all hope he will lead the Qifu to independence."
 hd_hi.qifuguoren.rise:0 "\n\nQifu Guoren summons the tribes of Longxi, proclaims himself Grand Commander-in-Chief and Grand Chanyu, and builds a city at Yongshichuan to found his state."
 hd_hi.qifuguoren.wait:0 "\n\nStrong neighbors still hold Longyou, so Qifu Guoren must feign compliance while secretly gathering the Longxi Xianbei."
 hd_hi.lvguang.t:0 "Lu Guang Returns to Hexi"
 hd_hi.lvguang.ctx:0 "Lu Guang, sent on a western expedition, subdued more than thirty states of the Western Regions and turned east with twenty thousand horsemen, countless camels and horses, and the treasures of Kucha. On the way came the news: the Central Plains have fallen into chaos."
 hd_hi.lvguang.rise:0 "\n\nLu Guang's army marches through Yumen Pass, and the commanderies of Hexi surrender at the sight. At Guzang he proclaims himself Governor of Liang Province, and from now on Hexi belongs to the Lu."
 hd_hi.lvguang.wait:0 "\n\nThe Hexi garrison commanders can still hold their own, so Lu Guang's army must halt at Dunhuang, men and horses exhausted, waiting for the situation to change."
 hd_hi.tufawugu.t:0 "Tufa Wugu Founds Southern Liang"
 hd_hi.tufawugu.ctx:0 "A century has passed since Shujineng's defeat, yet the Tufa tribe has never forgotten the glory of its forebears. Wugu promotes farming and martial training and recruits men of talent, and his people grow ever stronger."
 hd_hi.tufawugu.rise:0 "\n\nTufa Wugu proclaims himself King of Xiping, his spearheads pointing at the Huang River and Jincheng; the Hexi Xianbei take up blades and spears once more."
 hd_hi.tufawugu.wait:0 "\n\nLiang Province still has a strong master, so Wugu must declare himself a vassal and pay tribute, hiding his ambition behind deferential words."
 hd_hi.juqumengxun.t:0 "Juqu Mengxun Seizes Liang"
 hd_hi.juqumengxun.ctx:0 "The Juqu of the Lu River Hu have been tribal chieftains for generations. Mengxun is widely read in history and versed in astronomy, and his people say he has the talent of a great hero."
 hd_hi.juqumengxun.rise:0 "\n\nJuqu Mengxun gathers ten thousand men, occupies Jinshan, and plots an uprising with the magnates of Zhangye; the commanderies of Hexi are shaken."
 hd_hi.juqumengxun.wait:0 "\n\nThe master of Hexi is still strong, so Mengxun must feign submission, quietly bringing the Lu River Hu tribes under his wing one by one."
 hd_hi.helianbobo.t:0 "Helian Bobo Founds Xia"
 hd_hi.helianbobo.ctx:0 "When the Tiefu tribe was crushed by Northern Wei, the young Bobo narrowly escaped and drifted from patron to patron. Eight chi five cun tall and fierce by nature, he has never forgotten the destruction of his clan."
 hd_hi.helianbobo.rise:0 "\n\nBobo ambushes and kills his father-in-law, seizes his people, and proclaims himself Heavenly King of Great Xia. The Xia army comes and goes like the wind, and the cities north of the ridges cannot count on surviving the day."
 hd_hi.helianbobo.wait:0 "\n\nStrong powers surround him beyond the frontier, so Bobo must live under another's roof, burying both hatred and ambition deep in his heart."
 hd_hi.shelun.t:0 "Shelun Proclaims Himself Khagan"
 hd_hi.shelun.ctx:0 "Repeatedly defeated by Northern Wei, the Rouran under Shelun fled far north of the desert with their remnants. There the pastures are rich and the Gaoche tribes scattered, an ideal place to rebuild the tribe."
 hd_hi.shelun.rise:0 "\n\nShelun absorbs the Gaoche tribes and styles himself Qiudoufa Khagan, establishing military law: a thousand men to a regiment, a hundred to a company. Rouran horsemen begin raiding south."
 hd_hi.shelun.wait:0 "\n\nThe strong enemy to the south is at the height of its power, so Shelun can only roam north of the desert, subduing scattered tribes and waiting for the south to show a weakness."
 hd_hi.tande.t:0 "Gwanggaeto Expands the Realm"
 hd_hi.tande.ctx:0 "Goguryeo struggles to survive in the narrow gap between Liaodong and Baekje, and generations of its kings have died with bitter regret on the battlefield. The young Damdeok ascends the throne, vowing to avenge the shame of his forebears."
 hd_hi.tande.rise:0 "\n\nDamdeok personally leads infantry and cavalry west across the Liao River, then turns south, and the cities of Baekje fall one after another. The people of Goguryeo name him the Great King Gwanggaeto, Broad Expander of Territory, Bringer of Peace."
 hd_hi.tande.wait:0 "\n\nThe strong neighbor in Liaodong has not yet weakened, so Damdeok must drill his army and build his strength, awaiting a good chance to expand the realm."
 hd_hi.balin.t:0 "The Six Garrisons Rebellion"
 hd_hi.balin.ctx:0 "The soldiers of the Six Northern Garrisons were once the claws and teeth of the state, but now they have been reduced to garrison households, cold, hungry and abused. Poliuhan Baling of the Woye garrison has long been respected in the army."
 hd_hi.balin.rise:0 "\n\nBaling gathers a following, kills the garrison commander, and changes the era name to Zhenwang. The starving people of the Six Garrisons rise in answer, and a wildfire spreads across the north."
 hd_hi.balin.wait:0 "\n\nThe garrison commanders can still keep order, so Baling buries his rage, secretly contacting the strongmen of every garrison."
 hd_hi.tumen.t:0 "The Rise of the Turks"
 hd_hi.tumen.ctx:0 "For generations the Turks forged iron for the Rouran and were called their smith-slaves. As Tumen's people grew strong, he asked the Rouran khagan for a bride, and received only abuse in return."
 hd_hi.tumen.rise:0 "\n\nTumen joins with the Gaoche tribes to crush the Rouran and styles himself Illig Khagan. From now on, the masters of the steppe are the Turks."
 hd_hi.tumen.wait:0 "\n\nThe Rouran khagan's forces are still strong, so Tumen must swallow his humiliation and keep forging iron for the Rouran, quietly gathering his people."
 hd_hi.muhan.t:0 "Muqan Khagan Invades the South"
 hd_hi.muhan.ctx:0 "Muqan Khagan is of remarkable appearance, bold and resourceful. He has crushed the Hephthalites in the west, driven off the Khitan in the east, and annexed the Kyrgyz in the north, and the lands beyond the frontier bow to his might. The two states to the south vie to win his favor."
 hd_hi.muhan.rise:0 "\n\nMuqan Khagan leads a hundred thousand horsemen south and joins forces from the Central Plains to attack Jinyang. For the first time, Turkic iron cavalry tread the soil of Bing Province."
 hd_hi.muhan.wait:0 "\n\nThe southern forces are still strong, so Muqan Khagan simply collects annual tribute from both states and calmly watches them slaughter each other."
 hd_hi.shabolue.t:0 "Ishbara Raids the Frontier"
 hd_hi.shabolue.ctx:0 "Ishbara Khagan's khatun comes from a fallen dynasty of the Central Plains. Since her dynasty was overthrown, she has begged the khagan day and night to avenge her ancestral state."
 hd_hi.shabolue.rise:0 "\n\nIshbara Khagan joins the other khagans with four hundred thousand men and breaks through the frontier by the Muxia and Shimen routes; Hexi, Longyou and Daibei all send urgent alarms at once."
 hd_hi.shabolue.wait:0 "\n\nThe new master of the Central Plains is not yet secure but his forces are at their height, so Ishbara must hold his troops and leave the khatun to weep day and night."
 hd_hi.liuyu.t:0 "Liu Yu Rises at Jingkou"
 hd_hi.liuyu.ctx:0 "Liu Yu came from humble origins, selling straw sandals in his youth, and made his name in the Beifu Army through deeds in battle. Now a powerful minister at court has usurped the throne, and the whole realm waits to see who dares to stand up first."
 hd_hi.liuyu.rise:0 "\n\nAt Jingkou, Liu Yu gathers righteous men, slays the garrison commander, and sends proclamations in every direction. The stalwarts of the Beifu Army follow him across the river and westward, carrying all before them."
 hd_hi.liuyu.wait:0 "\n\nThe powerful minister at court is firmly entrenched, so Liu Yu must bide his time, forming bonds with like-minded brothers in the Beifu Army."
 hd_hi.erzhurong.t:0 "Erzhu Rong Enters Luoyang"
 hd_hi.erzhurong.ctx:0 "The Erzhu clan has long dwelt along the Xiurong River, its cattle, sheep, camels and horses covering the hills. When the Six Garrisons revolted, Erzhu Rong spent the family fortune recruiting volunteers, and now commands the finest cavalry in the north."
 hd_hi.erzhurong.rise:0 "\n\nUnder the pretext of avenging the late emperor, Erzhu Rong marches south, crosses the Yellow River, and enters Luoyang. Every minister at court fears for his life."
 hd_hi.erzhurong.wait:0 "\n\nThe court at Luoyang can still command the realm, so Erzhu Rong must remain at Xiurong, absorbing refugees while watching the court for an opening."
 hd_hi.gaohuan.t:0 "Gao Huan Rises at Xindu"
 hd_hi.gaohuan.ctx:0 "Gao Huan grew up in the Huaishuo garrison and knows well the sufferings of the Six Garrisons' soldiers. He once served under the Erzhu, and now holds two hundred thousand surrendered garrison households in his hand."
 hd_hi.gaohuan.rise:0 "\n\nGao Huan raises troops at Xindu and allies with the magnates of Hebei, vowing to sweep away the Erzhu and command the realm."
 hd_hi.gaohuan.wait:0 "\n\nThe Erzhu are strong in troops and horses, so Gao Huan must feign obedience, keeping a firm grip on the surrendered garrison households."
 hd_hi.yuwentai.t:0 "Yuwen Tai Holds Guanzhong"
 hd_hi.yuwentai.ctx:0 "Yuwen Tai came from the Wuchuan garrison and won repeated merit after entering the passes with the army. The soldiers of Guanlong say he has vision and capacity, and are willing to follow him."
 hd_hi.yuwentai.rise:0 "\n\nChosen as commander by the generals, Yuwen Tai marches east and takes Chang'an; from now on Guanzhong is a state of its own."
 hd_hi.yuwentai.wait:0 "\n\nGuanzhong's commander is still in place, so Yuwen Tai must hold back, drawing his old friends from Wuchuan to his side one by one."
 hd_hi.houjing.t:0 "The Hou Jing Rebellion"
 hd_hi.houjing.ctx:0 "Hou Jing's right leg is short, and he is no great archer or rider, but he excels at stratagem. After drifting from master to master he went over to the Southern court, and now, garrisoned at Shouyang, he learns that he may be traded away in a prisoner exchange."
 hd_hi.houjing.rise:0 "\n\nIn the name of purging the evil ministers around the throne, Hou Jing leads eight thousand men across the Yangtze and besieges the Palace City. A century of Jiangnan's splendor goes up in smoke."
 hd_hi.houjing.wait:0 "\n\nThe Jiangnan court still has substantial forces, so Hou Jing can only gather desperate men at Shouyang and await his moment."
 hd_hi.yangjian.t:0 "Yang Jian Supplants Zhou"
 hd_hi.yangjian.ctx:0 "Yang Jian comes from a family of Guanlong generals, of extraordinary appearance, said by all to bear the look of an emperor. A child sovereign has taken the throne, and power at court is gradually falling into his hands."
 hd_hi.yangjian.rise:0 "\n\nYang Jian takes over the government, suppresses the rebellions of the Three Parties, and soon accepts the abdication to become emperor, naming his dynasty Sui. His gaze is already turned south of the Yangtze."
 hd_hi.yangjian.wait:0 "\n\nThe imperial clan at court is still strong, so Yang Jian must tread carefully, winning over the generals of Guanlong one by one."
 hd_hi.0200.ok:0 "\n\nYou have waited many years. Now the defenses in every direction are slackening, and old followers and bold men come to your door in droves, all asking the same thing: when do we strike?"
 hd_hi.0200.bad:0 "\n\nYou have waited many years, yet your foes remain strong, and meeting them head-on would only throw away your people. Some urge you to abandon all you have, take your trusted men far away to your old homeland, and bide your time under your old claim."
 hd_hi.0200.vassal:0 "\n\nOnce you rise, the bond between you and your liege ends here."
 hd_hi.0200.a:0 "Time waits for no one: raise the army!"
 hd_hi.0200.b:0 "Abandon our lands and bide our time."
 hd_hi.0200.c:0 "Avoid their edge and await Heaven's moment."
 hd_hi.0200.d:0 "Keep to our station and hold our troops."
 hd_hi.0300.desc:0 "\n\n[hd_hi_leader.GetFirstNameNoTooltip] has lately been in frequent contact with his old followers. Last night he came before you and asked you to let him go, to do what he has always wanted to do."
 hd_hi.0300.a:0 "Each man has his own ambition; let him go."
 hd_hi.0300.b:0 "This man must not be released; keep him here."
 hd_hi.1001.a:0 "Wait and see."
 hd_hi.1001.b:0 "Throw ourselves into it."
 hd_hi.1002.desc:0 "\n\nThe lands under your rule have caught his eye."
 hd_hi.1002.a:0 "Tighten our defenses."
