l_english:
 hd_j16.5400.t:0 "The Campaign against Wei"
 hd_j16.5400.desc:0 "Tuoba Gui has broken with Yan and set himself up as a king, raiding the frontier again and again. The generals urge that Crown Prince Murong Bao lead Murong Nong and Murong Lin north and crush the Dai lands at a stroke. The Grand Astrologer warns that the heavens are unfavourable."
 hd_j16.5400.a:0 "Send the crown prince against Wei."
 hd_j16.5400.b:0 "The time is not right. Hold back."
 hd_j16.5401.t:0 "The Yan Army Approaches"
 hd_j16.5401.desc:0 "A great Yan host is marching north, its banners covering the plain, aimed straight at our realm. The tribes are shaken; some urge you to avoid its edge, others to lie in wait at the passes."
 hd_j16.5401.a:0 "Muster the army."
 hd_j16.5405.t:0 "Personal Campaign to Pingcheng"
 hd_j16.5405.desc:0 "The defeat at Canhe Slope has destroyed the flower of the Yan army; the crown prince barely escaped. Old and ailing as you are, you know that if you do not take the field yourself, the realm has no general left. Your officers propose cutting a road through the mountains to fall on Pingcheng by surprise."
 hd_j16.5405.a:0 "Lead the army in person through the mountains."
 hd_j16.5405.b:0 "I am too old. Stand down and rest the army."
 hd_j16.5410.t:0 "Zhongshan in Peril"
 hd_j16.5410.desc:0 "Wei troops ring the city on every side; the granaries of Zhongshan are empty and hearts are wavering. Some urge you to break out by night and return north to the old capital Longcheng to preserve the ancestral temples; others say Zhongshan is the root of the realm, and once abandoned it will never be regained."
 hd_j16.5410.a:0 "Abandon Zhongshan and flee north to Longcheng."
 hd_j16.5410.b:0 "Stand or fall with Zhongshan."
 hd_j16.5420.t:0 "Lan Han Sends Greetings"
 hd_j16.5420.desc:0 "The southern expedition has collapsed and you are retreating north. Lan Han at Longcheng sends envoys to say the palace has been swept clean and awaits your return. He is your grand-uncle and Murong Sheng's father-in-law, yet some of your attendants whisper that he commands a strong army and his intentions are hard to read."
 hd_j16.5420.a:0 "Lan Han is family. Return to Longcheng."
 hd_j16.5420.b:0 "Camp outside and do not enter the city."
 hd_j16.5430.t:0 "Yan Strikes Goguryeo"
 hd_j16.5430.desc:0 "King [hd_news_b.GetName] of Goguryeo has repeatedly raided Liaodong. The ruler of Yan, [hd_news_a.GetName], led a great army east, took the fortresses of Xincheng and Nansu, extended the border by more than seven hundred li, and carried off five thousand households."
 hd_j16.5431.t:0 "Before the Walls of Liaodong"
 hd_j16.5431.desc:0 "The ruler of Yan, [hd_news_a.GetName], attacked the Goguryeo city of Liaodong. Just as it was about to fall, he forbade his men to enter until the walls had been levelled so that he and the empress could ride in by carriage. The defenders used the respite to repair the walls, the Yan army never took the city, and [hd_news_b.GetName] kept Liaodong."
 hd_j16.5440.t:0 "Coup at the Palace Gates"
 hd_j16.5440.desc:0 "You have exhausted the realm building a tomb for Empress Fu and followed her hearse out of the city on foot. Feng Ba and his brothers seized the moment, shut the gates and raised Murong Yun (Gao Yun) as ruler. The gates are closed and your escort is scattering. What will you do?"
 hd_j16.5440.a:0 "All is lost. Yield the throne to Gao Yun."
 hd_j16.5440.a.tt:0 "You hand over the throne of Yan and withdraw to the palace. Yet a new ruler seldom tolerates the old one: abdication may not spare your life."
 hd_j16.5440.b:0 "Never! Retake the palace by force!"
 hd_j16.5450.t:0 "The Court Turns to Feng Ba"
 hd_j16.5450.desc:0 "The Heavenly King Gao Yun has been stabbed to death in the eastern hall by his favourites Li Ban and Tao Ren. You led troops into the palace, cut the two men down and restored order. The ministers kneel and beg you to take the throne to steady the people."
 hd_j16.5450.a:0 "Heaven wills it. Take the throne."
 hd_j16.5450.b:0 "Raise another worthy man instead."
 hd_j16.5470.t:0 "Flight to Guanggu"
 hd_j16.5470.desc:0 "In Chang'an you have feigned madness to escape the notice of the Qin. Your uncle Murong De, now emperor at Guanggu and without a son, has sent agents in secret to bring you to him and promises you the succession. If the Qin find out, it will cost you your life."
 hd_j16.5470.a:0 "Slip out of Chang'an and go south to your uncle."
 hd_j16.5470.b:0 "Stay in Chang'an and take no risks."
 hd_j16.5500.t:0 "The Fall of Jinyang"
 hd_j16.5500.desc:0 "[hd_news_a.GetName] led more than four hundred thousand foot and horse south out of Mayi and over Mount Gouzhu, banners stretching for two thousand li, drums beating as they advanced. The Yan commander of Bingzhou abandoned Jinyang and fled east, and all the commanderies of Bingzhou passed to Wei."
 hd_j16.5510.t:0 "The Advance on Ye"
 hd_j16.5510.desc:0 "With Zhongshan taken, the cities of Hebei submit one after another; only Ye remains in enemy hands. Ye was the old capital of Cao Cao, with stout walls and full granaries. Take it and all Hebei is ours."
 hd_j16.5510.a:0 "March south and take Ye."
 hd_j16.5510.b:0 "Rest the horses. There is no hurry."
 hd_j16.5520.t:0 "The Qin Army Comes East"
 hd_j16.5520.desc:0 "The ruler of Qin has sent Yao Ping east with forty thousand foot and horse; they have taken Qianbi and their spearhead points at Pingyang. Your generals urge you to lead the army in person and surround the Qin force while it is cut off deep in our land."
 hd_j16.5520.a:0 "Lead the army out to meet them."
 hd_j16.5520.b:0 "Hold the border forts and avoid battle."
 hd_j16.5521.t:0 "Wei Marches West"
 hd_j16.5521.desc:0 "Tuoba Gui of Wei is coming west in force, and the border forts around Pingyang and Hedong are calling for help. Do we send troops to fight, or send envoys to sue for peace and avoid his edge for now?"
 hd_j16.5521.a:0 "Send troops to fight."
 hd_j16.5521.b:0 "Sue for peace and avoid battle."
 hd_j16.5540.t:0 "Murder in the Palace"
 hd_j16.5540.desc:0 "Your father the emperor was murdered in the night in the Tian'an Hall by your younger brother Tuoba Shao. Shao has shut the palace gates and summoned the officials with a forged edict, and the court is in terror. You are in hiding outside, and guards and ministers are flocking to you, begging you to enter the palace, kill the traitor and take the throne."
 hd_j16.5540.a:0 "Lead them into the palace and kill the traitor."
 hd_j16.5540.b:0 "The situation is unclear. Wait and see."
 hd_j16.5550.t:0 "Taking Luoyang"
 hd_j16.5550.desc:0 "The Jin court is in turmoil and Luoyang stands isolated south of the river with a weak garrison. Yao Chong asks to lead foot and horse east and recover the old capital at a stroke."
 hd_j16.5550.a:0 "Send Yao Chong east to take Luoyang."
 hd_j16.5550.b:0 "Not now."
 hd_j16.5551.t:0 "Qin Troops Leave the Passes"
 hd_j16.5551.desc:0 "A Qin general has marched east and laid siege to Luoyang. The commander in Henan sends urgent letters begging the court for reinforcements."
 hd_j16.5551.a:0 "Order the generals to find a way to relieve it."
 hd_j16.5560.t:0 "Against the Qifu"
 hd_j16.5560.desc:0 "Qifu Qiangui holds Longxi and wavers between submission and revolt. Your uncle Yao Shuode asks to lead foot and horse west and force him to become a vassal."
 hd_j16.5560.a:0 "Send Yao Shuode west."
 hd_j16.5560.b:0 "Keep him on a loose rein. No need for war."
 hd_j16.5561.t:0 "Qin at the Border"
 hd_j16.5561.desc:0 "The Qin general Yao Shuode is coming west with a great army in fine fighting trim. Your officers urge you to submit as a vassal of Qin for now to preserve the clan and bide your time; others say the Qifu have always been masters of their own land and will never bow to the Qiang."
 hd_j16.5561.a:0 "Send envoys and submit to preserve the clan."
 hd_j16.5561.b:0 "Better to fight than surrender."
 hd_j16.5562.t:0 "Defeat and Terms"
 hd_j16.5562.desc:0 "The Qin have won a great victory, our army is scattered and the capital is in danger. Qin envoys say that if you agree to become a vassal, you may keep your old lands."
 hd_j16.5562.a:0 "Submit to Qin."
 hd_j16.5562.b:0 "Refuse. Gather the survivors and fight on."
 hd_j16.5570.t:0 "Against the Lü"
 hd_j16.5570.desc:0 "The Lü clan holds Guzang, their court torn by usurpations and harried in turn by Southern and Northern Liang; they are at the end of their strength. Your generals ask to march west and force them to submit."
 hd_j16.5570.a:0 "March west against the Lü."
 hd_j16.5570.b:0 "Not now."
 hd_j16.5571.t:0 "Qin Comes West"
 hd_j16.5571.desc:0 "The Qin army is coming west, Guzang is in a panic, and the two Liangs to north and south watch like tigers. Your ministers urge you to become a vassal of Qin and lean on its strength to survive."
 hd_j16.5571.a:0 "Send envoys and submit to Qin."
 hd_j16.5571.b:0 "Hold the city to the death."
 hd_j16.5572.t:0 "Defeat and Terms"
 hd_j16.5572.desc:0 "The Qin have won a great victory and Guzang stands alone. Qin envoys say that if you agree to become a vassal, you may keep your old lands."
 hd_j16.5572.a:0 "Submit to Qin."
 hd_j16.5572.b:0 "Refuse and fight on."
 hd_j16.5580.t:0 "The Succession Quarrel"
 hd_j16.5580.desc:0 "You are growing old. Crown Prince Yao Hong is kind but weak, while your second son Yao Bi enjoys your favour, gathers a faction and schemes to take the succession. Your ministers press you to settle the matter before it leads to bloodshed."
 hd_j16.5580.a:0 "Confirm Yao Hong and punish Yao Bi's faction."
 hd_j16.5580.b:0 "Do nothing for now."
 hd_j16.5590.t:0 "A Change of Master"
 hd_j16.5590.desc:0 "[hd_j16_n1_abd_to.GetName] already holds real power at court; the ministers are flocking to him and demand that you give up the throne."
 hd_j16.5590.desc_none:0 "A powerful minister already holds real power at court; the ministers are flocking to him and demand that you give up the throne."
 hd_j16.5590.desc_lanhan:0 "Murong Bao is dead. Lan Han holds Longcheng and has proclaimed himself Grand Commander, Grand Chanyu and Prince of Changli, and most of the generals have gone over to him. You stand alone, and he sends envoys demanding that you yield the throne of Yan."
 hd_j16.5590.desc_sheng:0 "Lan Han is dead. Murong Sheng, as the late emperor's son, has won back the hearts of the people, and the clansmen and old ministers have all gone over to him. They ask you to yield to him for the sake of the dynasty."
 hd_j16.5590.desc_xi:0 "Murong Sheng has been murdered. Empress Dowager Ding and the ministers have agreed to raise Murong Xi, Duke of Hejian, saying that in troubled times the realm needs a grown ruler. They demand that you yield the throne of Yan."
 hd_j16.5590.desc_gaoyun:0 "Murong Xi is dead. Feng Ba and his brothers have raised Murong Yun (Gao Yun) as ruler, all Longcheng obeys him, and you are asked to yield to him."
 hd_j16.5590.desc_fengba:0 "Gao Yun has been assassinated. Feng Ba has restored order and the ministers all urge him to take the throne; you are asked to step aside."
 hd_j16.5590.desc_tuobasi:0 "Tuoba Gui has been murdered. Tuoba Si entered the palace and killed the traitor, the guards and ministers have all gone over to him, and you are asked to give up the throne."
 hd_j16.5590.a:0 "All is lost. Abdicate."
 hd_j16.5590.b:0 "Refuse!"
 hd_j16_n1_army_canhe_name:0 "Murong Bao's Army"
 hd_j16_n1_army_pingcheng_name:0 "Murong Chui's Guard"
 hd_j16_n1_army_weiye_name:0 "Wei Southern Army"
 hd_j16_n1_army_chaibi_wei_name:0 "Tuoba Gui's Army"
 hd_j16_n1_army_chaibi_qin_name:0 "Yao Ping's Army"
 hd_j16_n1_army_yaoluo_name:0 "Yao Chong's Army"
 hd_j16_canhe_shang_modifier:0 "Grief of Canhe"
 hd_j16_canhe_shang_modifier_desc:0 "At Canhe Slope the flower of the Yan army was lost and tens of thousands of prisoners were buried alive. The whole realm mourns and new levies are hard to raise."
 hd_j16_canhe_cuofeng_modifier:0 "Blunted Edge"
 hd_j16_canhe_cuofeng_modifier_desc:0 "Worsted in battle with Yan, the army's edge is blunted and the tribes are wavering."
