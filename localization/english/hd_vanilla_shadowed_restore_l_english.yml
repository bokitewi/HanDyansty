 farm_estates_3_4_trigger: "Requires one of the following:\n$EFFECT_LIST_BULLET$[holder_possessive|E] [culture|E] has the #V $innovation_manorialism$#! [innovation|E], and this [barony|E] is [GetTerrain( 'farmlands' ).GetName] and has a Level 2 [holding|E]\n$EFFECT_LIST_BULLET$[holder_possessive|E] [culture|E] has the [GetCultureTradition('tradition_pastoralists').GetName|V] [tradition|E], and this [holding|E] has the [GetBuilding('pastures_04').GetName] [building|E]\n$EFFECT_LIST_BULLET$[holder_possessive|E] [culture|E] has the #V $innovation_manorialism$#! and #V $innovation_champa_rice$#! [innovations|E], this [barony|E] has a Level 2 [holding|E] and access to the [GetBuilding('paddy_fields_01').GetName] line of [buildings|E]"
