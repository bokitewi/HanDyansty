 building_great_project_cathedral_01: "Romanesque Grand Cathedral"
 building_great_project_cathedral_01_desc: "An early standing cathedral, seat of a bishop and a beacon for Christian pilgrims. Beneath heavy rounded arches and stately vaults, sacred relics and altars await the faithful.\n\n[building|E] Effects: [GetDomicileBuilding('ecclesiastical_domicile_main_02').GetName] in [cathedral_complex|E]"
 building_type_great_project_cathedral_under_construction: "Cathedral"
 building_great_project_cathedral_under_construction: "Cathedral Under Construction"
 building_great_project_cathedral_under_construction_desc: "Rising up within treadwheel cranes and countless scaffolds, this incomplete edifice of rough stone prepares to one day host a holy seat."
 building_type_great_project_cathedral_02: "$building_great_project_cathedral_02$"
 building_great_project_cathedral_02: "Gothic Grand Cathedral"
 building_great_project_cathedral_02_desc: "Built on the legacy of the already imposing [GetBuilding('great_project_cathedral_01').GetName], soaring vaults and traceried windows lift the eye to the highs of heaven. Stone lacework and pointed arches crown a roof reborn in the sensibilities of a new age.\n\n[building|E] Effects: [GetDomicileBuilding('ecclesiastical_domicile_main_03').GetName] in [cathedral_complex|E]"
 building_type_great_project_cathedral_03: "$building_great_project_cathedral_03$"
 building_great_project_cathedral_03: "Flamboyant Grand Cathedral"
 building_great_project_cathedral_03_desc: "Built upon the already resplendent [GetBuilding('great_project_cathedral_02').GetName], flame-like tracery and curling stone crown this cathedral as a great church of Christendom.\n\n[building|E] Effects: [GetDomicileBuilding('ecclesiastical_domicile_main_04').GetName] in [cathedral_complex|E]"
