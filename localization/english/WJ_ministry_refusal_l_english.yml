l_english:
 WJ_ministry_refuse_decision:0 "Decline Court Appointments"
 WJ_ministry_refuse_decision_desc:0 "I wish to preserve my present duties and way of life, and will decline new appointments to central office. I will retain my current posts and lands. Should I change my mind, I can declare myself willing to serve at court again."
 WJ_ministry_refuse_decision_tooltip:0 "Declare that you decline new appointments to central office"
 WJ_ministry_refuse_decision_confirm:0 "Decline new appointments"
 WJ_ministry_refuse_decision_effect_tt:0 "Decline new central offices through ordinary appointment channels. This does not remove current posts or restrict local appointments and territorial inheritance. You can withdraw this declaration through Accept Court Appointments Again."
 WJ_ministry_resume_decision:0 "Accept Court Appointments Again"
 WJ_ministry_resume_decision_desc:0 "I am willing to consider appointments to central office once more. Withdrawing my declaration restores my ordinary eligibility; it does not itself grant an office or change my lands."
 WJ_ministry_resume_decision_tooltip:0 "Withdraw your declaration and accept consideration for central office"
 WJ_ministry_resume_decision_confirm:0 "Consider me for office"
 WJ_ministry_resume_decision_effect_tt:0 "Withdraw your refusal and resume ordinary consideration for central office. Your existing posts and lands remain unchanged."
 WJ_ministry_refusal_blocks_appointment_tt:0 "This character has not declined new appointments to central office"
