l_english:
 # Historical events game rule (English for zz_hd_history_events_rule_l_simp_chinese.yml; added 10-27 for the Jin/Sixteen Kingdoms line close-out)
 rule_hd_history_events_rule: "Historical Events"
 setting_hd_history_events_on: "#high Enabled#!"
 setting_hd_history_events_on_desc: "Each scenario's historical events unfold by year and condition, such as the death of Emperor Ling, the coalition against Dong Zhuo, Cao Pi's accession, Zhong Hui's invasion of Shu, the Battle of the Fei River, the Liu Song succession to Jin, and the Tang accession."
 setting_hd_history_events_off: "#high Disabled#!"
 setting_hd_history_events_off_desc: "The starting situation is unchanged, and wars under way on the start date (including the Yellow Turban Rebellion of 184) proceed as normal. Afterwards no scenario's historical events, historical wars, depositions and abdications, historical arrivals or historical deaths take place, and the lock on ending the age of chaos lifts at its preset year. The Wuhu migrations, the Liao migration into Shu, the Southern Exodus and historical invasions keep their own rules."
 hd_hev_window_rule_off: "#X Historical events are disabled in this game's rules: apart from wars under way on the start date, no scenario's historical events will occur. The Wuhu, Southern Exodus and Liao migration entries in the long-term group still follow their own rules.#!"
