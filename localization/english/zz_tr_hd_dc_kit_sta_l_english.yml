 hd_dc_sta_border_market_interaction:0 "Border Market"
 hd_dc_sta_border_market_interaction_desc:0 "Open the border passes for trade with a neighboring state; merchants come and go, and both sides profit."
 hd_dc_sta_border_market_interaction_notification:0 "[actor.GetShortUIName|U] has sent an envoy proposing to open the passes for trade with you, for the benefit of merchants and craftsmen."
 hd_dc_sta_border_market_at_war_tt:0 "The two sides are at war"
 hd_dc_sta_border_market_already_tt:0 "The two sides are already trading"
 hd_dc_sta_border_market_interaction.toast:0 "Border Market Opened"
 hd_dc_sta_border_market_interaction.declined:0 "They refuse to trade"
 hd_dc_sta_border_market_ai_profit:0 "Profit of Trade"
 hd_dc_sta_border_market_ai_greedy:0 "Greedy"
 hd_dc_sta_border_market_ai_rival:0 "Rival"
 hd_dc_sta_border_market_ai_paranoid:0 "Paranoid"
 hd_dc_sta_border_market_modifier:0 "Border Market"
 hd_dc_sta_border_market_modifier_desc:0 "The passes are open for trade with a neighbor; merchants come and go, and the treasury slowly fills."
 hd_dc_sta_border_market_opinion:0 "Trading Partners"
 hd_dc_sta_cede_land_interaction:0 "Cede Land for Peace"
 hd_dc_sta_cede_land_interaction_desc:0 "When the war goes badly, cede a commandery to the enemy commander to end the fighting. The chosen county is ceded together with its entire commandery; the commandery of your seat cannot be ceded."
 hd_dc_sta_cede_land_interaction_notification:0 "[actor.GetShortUIName|U] has sent an envoy suing for peace, offering to cede land to end the fighting."
 hd_dc_sta_cede_land_interaction.toast:0 "Land Ceded for Peace"
 hd_dc_sta_cede_land_interaction.toast_recipient:0 "The Enemy Cedes Land for Peace"
 hd_dc_sta_cede_land_interaction.declined:0 "They refuse to make peace"
 hd_dc_sta_cede_land_ai_winning_big:0 "Victory Assured"
 hd_dc_sta_cede_land_ai_winning:0 "War Going Well"
 hd_dc_sta_cede_land_ai_losing:0 "War Going Badly"
 hd_dc_sta_ceded_land_opinion:0 "Ceded Land for Peace"
 HD_DC_STA_TRUCE_CEDED_LAND:0 "Ceded Land for Peace"
 HD_DC_STA_TRUCE_HOSTAGE:0 "Son Sent as Hostage"
 hd_dc_sta_border_clash_cb:0 "Border Commandery Clash"
 HD_DC_STA_BORDER_CLASH_CB_NAME:0 "Contest [TITLE.GetBaseNameNoTier]"
 HD_DC_STA_BORDER_CLASH_WAR_NAME:0 "[ATTACKER.GetPrimaryTitle.GetAdjective] War for [TITLE.GetBaseNameNoTier]"
 HD_DC_STA_BORDER_CLASH_WAR_NAME_BASE:0 "[ATTACKER.GetPrimaryTitle.GetAdjective]-[DEFENDER.GetPrimaryTitle.GetAdjective] Border Clash"
 hd_dc_sta_border_clash_cb_victory_desc:0 "[attacker.GetShortUIName|U] seizes every [county|E] in the target commandery that they occupy when the war ends."
 hd_dc_sta_border_clash_cb_victory_tt:0 "Every [county|E] in the target commandery occupied by the attacker when the war ends passes to the attacker"
 hd_dc_sta_border_clash_cb_white_peace_desc:0 "Both sides lay down arms, and [attacker.GetShortUIName] loses [prestige|E]."
 hd_dc_sta_border_clash_cb_defeat_desc:0 "[attacker.GetShortUIName|U] is defeated, pays reparations to [defender.GetShortUIName] and loses [prestige|E]."
 hd_dc_sta_border_clash_truce_tt:0 "A five-year [truce|E] between both sides"
 hd_dc_sta_incite_independence_interaction:0 "Incite Independence#weak (Scheme)#!"
 hd_dc_sta_incite_independence_interaction_desc:0 "Secretly persuade this enemy [vassal|E] to rise up for independence and turn against their liege."
 hd_dc_sta_incite_defection_interaction:0 "Incite Defection#weak (Scheme)#!"
 hd_dc_sta_incite_defection_interaction_desc:0 "Secretly persuade this enemy [vassal|E] to come over to you with their lands. They must border your [realm|E], or success is very unlikely."
 hd_dc_sta_incite_faction_interaction:0 "Incite Sedition#weak (Scheme)#!"
 hd_dc_sta_incite_faction_interaction_desc:0 "Secretly stir up this enemy [vassal|E] to join or found a [faction|E] against their liege, and swell its strength."
 hd_dc_sta_subversion_started_toast:0 "Subversion Begun"
 hd_dc_sta_incite_independence:0 "Incite Independence"
 hd_dc_sta_incite_independence_action:0 "Incite Independence:"
 hd_dc_sta_incite_independence_desc:0 "I will persuade [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] to rise up for independence."
 hd_dc_sta_incite_independence_desc_general:0 "$hd_dc_sta_incite_independence$ is a secret hostile [scheme|E]: persuade an enemy [vassal|E] to wage a war of independence against their liege.\nThis scheme relies mainly on your [diplomacy|E].\n\nThe [success_chance|E] depends mainly on your [diplomacy|E] and the target's [opinion|E] of their liege. If discovered by the target's [spymaster|E], you will fall out with their liege and earn a name for breaking faith."
 HD_DC_STA_INCITE_INDEPENDENCE_SUCCESS_DESC:0 "[TARGET_CHARACTER.GetShortUIName|U] will wage a war of independence against their liege"
 hd_dc_sta_incite_defection:0 "Incite Defection"
 hd_dc_sta_incite_defection_action:0 "Incite Defection:"
 hd_dc_sta_incite_defection_desc:0 "I will persuade [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] to come over to me with their lands."
 hd_dc_sta_incite_defection_desc_general:0 "$hd_dc_sta_incite_defection$ is a secret hostile [scheme|E]: persuade an enemy [vassal|E] to change allegiance and come over to you with their lands.\nThis scheme relies mainly on your [diplomacy|E].\n\nThe [success_chance|E] depends mainly on your [diplomacy|E], the target's [opinion|E] of their liege, and your strength relative to their liege. If discovered by the target's [spymaster|E], you will fall out with their liege and earn a name for breaking faith."
 HD_DC_STA_INCITE_DEFECTION_SUCCESS_DESC:0 "[TARGET_CHARACTER.GetShortUIName|U] will become your [vassal|E] along with their lands"
 hd_dc_sta_incite_faction:0 "Incite Sedition"
 hd_dc_sta_incite_faction_action:0 "Incite Sedition:"
 hd_dc_sta_incite_faction_desc:0 "I will stir up [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] against their liege."
 hd_dc_sta_incite_faction_desc_general:0 "$hd_dc_sta_incite_faction$ is a secret hostile [scheme|E]: stir up an enemy [vassal|E] to join or found a [faction|E] against their liege, making the faction more discontented and its armies larger.\nThis scheme relies mainly on your [diplomacy|E].\n\nIf discovered by the target's [spymaster|E], you will fall out with their liege and earn a name for breaking faith."
 HD_DC_STA_INCITE_FACTION_SUCCESS_DESC:0 "[TARGET_CHARACTER.GetShortUIName|U] will join or found a [faction|E] against their liege"
 HD_DC_STA_SUBVERSION_DISCOVERY_DESC:0 "You fall out with the enemy ruler and earn a name for breaking faith"
