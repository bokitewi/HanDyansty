 hd_dc_sta_subversion_exposed_owner_toast:0 "Subversion Exposed"
 hd_dc_sta_subversion_exposed_owner_tt:0 "Your subversion scheme has been discovered, and relations sour"
 hd_dc_sta_subversion_exposed_opinion:0 "Subverted My Vassal"
 hd_dc_sta_defected_opinion:0 "Defected to Another Realm"
 hd_dc_sta_incited_rebellion_modifier:0 "Incited"
 hd_dc_sta_incited_rebellion_modifier_desc:0 "Someone is secretly funding this person against their liege, and they have raised many troops."
 hd_dc_sta.0101.t:0 "The Banner of Revolt Is Raised"
 hd_dc_sta.0101.desc:0 "The envoy reports: [target.GetShortUIName] has at last made up their mind, rising in revolt against [target.GetHerHis] liege to stand alone. The enemy realm now has a grave affliction at its heart."
 hd_dc_sta.0101.a:0 "Let us sit back and watch them tear at each other."
 hd_dc_sta.0102.t:0 "Coming Over with Lands"
 hd_dc_sta.0102.desc:0 "[target.GetShortUIName] has come as agreed, bringing their fief to change allegiance and serve you. The enemy loses an arm, and you gain one."
 hd_dc_sta.0102.a:0 "A good bird chooses its tree."
 hd_dc_sta.0103.t:0 "Trouble Within the Walls"
 hd_dc_sta.0103.desc:0 "[target.GetShortUIName] has been won over; the rift with [target.GetHerHis] liege deepens by the day, and they are rallying allies and sharpening weapons."
 hd_dc_sta.0103.a:0 "The fire is lit; wait for it to spread."
 hd_dc_sta.subversion_target_gone.desc:0 "The envoy reports: times have changed, and [target.GetShortUIName]'s circumstances are no longer what they were. There is nothing left to subvert."
 hd_dc_sta.0109.t:0 "Persuasion Fails"
 hd_dc_sta.0109.desc:0 "[target.GetShortUIName] humored your envoy but in the end refused to betray [target.GetHerHis] liege. Fortunately, the matter has not yet come to light."
 hd_dc_sta.0109.desc_reported:0 "[target.GetShortUIName] not only rejected your envoy, but told [target.GetHerHis] liege the whole story. Between the two realms, there can be no more trust."
 hd_dc_sta.0109.a:0 "A pity."
