l_english:

 #####三国新增建筑战场本地化

 BattlePoIHistoricalNameZhuoLu: "Battle of Zhuolu"
 BattlePoIHistoricalDescZhuoLu: "#emp  Winner: Yellow Emperor's Tribe \n Loser: Chiyou's Tribe \n Date: 4700 BC #!\n#weak  The Yellow Emperor, at the invitation of the Yan Emperor, launched a campaign against Chiyou's Tribe, which had advanced westward to attack the Yan Emperor. The two forces clashed on the plains of Zhuolu. \n\n Initially, the army of the Yellow Emperor's Tribe was at a disadvantage due to inferior strength and equipment compared to that of Chiyou's Tribe; however, because the Yellow Emperor knew how to utilize people effectively and leverage external forces, he ultimately defeated Chiyou's Tribe. \n\n Following this battle, the Huaxia tribes represented by the Yan and Huang began to integrate with the Dongyi tribes, advancing into the era of civilization. #!"
 BattlePoIHistoricalNameMingTiao: "Battle of Mingtiao"
 BattlePoIHistoricalDescMingTiao: "#emp Victor: Tang of Shang\nDefeated: Jie of Xia\nDate: 1600 BC#!\n#weak A decisive battle between the forces of the Shang tribe led by Tang and the army of Xia at Mingtiao.\n\nIn the late years of the Xia Dynasty, King Jie neglected internal governance, indulged in extravagance and debauchery, causing the loss of public support. Meanwhile, under the guidance of Yi Yin and others, Tang actively advanced, won over feudal lords, eliminated Xia's allies, and ultimately initiated the war to overthrow Xia. The two armies clashed at Mingtiao, resulting in a crushing defeat for the Xia forces.\n\nThis battle led to the fall of the Xia Dynasty and the establishment of the Shang Dynasty by Tang.#!"
 BattlePoIHistoricalNameChangShao: "Battle of Changshao"
 BattlePoIHistoricalDescChangShao: "#emp Winner: Duke Zhuang of Lu\nLoser: Duke Huan of Qi\nDate: 684 BC#!\n#weak Duke Huan of Qi attacked Lu to avenge the dispute over the throne between the two states. The battle took place at Changshao.\n\nIn early 684 BC, the army of Qi invaded Lu. Following the advice of Cao Gui, Duke Zhuang of Lu temporarily retreated from the sharp edge of the Qi army and withdrew to Changshao, a location favorable for counterattack. Due to the victory in the Battle of Gan Shi, the Qi army underestimated the Lu army and ultimately suffered defeat.\n\nThis battle was a victory for the weak over the strong and is regarded as a model of defensive counterattacks.#!"
 BattlePoIHistoricalNameChangPing: "Battle of Changping"
 BattlePoIHistoricalDescChangPing: "#emp Victor: King Zhaoxiang of Qin \nDefeated: King Xiaocheng of Zhao \nDate: 260 BC #!\n#weak The Qin army engaged the forces of Zhao in war around Changping in the state of Zhao. \n\nIn 260 BC, war broke out between Qin and Zhao over Shangdang. Initially, seeing the unfavorable situation, the state of Zhao adopted Lian Po's strategy of holding fast, but King Zhao was influenced by Qin's counter-intelligence, forcing Zhao Kuo to be eager for victory and ultimately suffer a disastrous defeat. \n\nAfter this battle, the state of Zhao was severely weakened, accelerating the process of Chinese unification. #!"
 BattlePoIHistoricalNameGaiXia: "Battle of Gaixia"
 BattlePoIHistoricalDescGaiXia: "#emp Winner: Liu Bang\nLoser: Xiang Yu\nDate: 203 BC#!\n#weak A strategic decisive battle between the Chu and Han armies at Gaixia.\n\nIn 203 BC, the disadvantaged Xiang Yu signed the Honggou Peace Agreement and retreated to the Chu region. Seeing the Chu army exhausted, Zhang Liang and Chen Ping suggested that Liu Bang take advantage of the opportunity to launch a surprise attack. Liu Bang adopted this suggestion and launched a strategic pursuit operation against the Chu army, ultimately leading to Xiang Yu's defeat and death.\n\nAfter this battle, the chaos of the end of the Qin Dynasty came to an end, China was unified, and the foundation for the Han Dynasty's four-century rule was laid.#!"
 BattlePoIHistoricalNameKunYang: "Battle of Kunyang"
 BattlePoIHistoricalDescKunYang: "#emp Victor: Xuan Han\nDefeated: Xin Dynasty\nDate: 23 AD#!\n#weak Clash between the armies of Xuan Han and Xin along the Kunyang front.\n\nIn 23 AD, as the Green Lin Army had just established Xuan Han and its position was not yet stable, the Xin army withdrew its main forces to attack the Han army. The two sides fought at Kunyang. The commander of the Han army feared battle and wished to surrender, but the Xin army refused to accept it. Thus, Liu Xiu's advice was adopted to hold out and wait for reinforcements. Later, Li Yi, Liu Xiu, and others led relief forces that defeated the great Xin army. Only a thousand or so soldiers from the Xin army escaped back to Chang'an.\n\nAfter the great victory at Kunyang, the whole world was shaken, accelerating the fall of the Xin Dynasty and paving the way for Liu Xiu to establish the Eastern Han.#!"


