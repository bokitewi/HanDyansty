l_english:

 #####三国新增建筑战场本地化

 BattlePoIHistoricalNameZhuoLu: "Battle of Zhuolu"
 BattlePoIHistoricalDescZhuoLu:0 "#emp Victor: Huangdi\nDefeated: Chi You\nDate: The age of Huangdi#!\n#weak Chi You rebelled and refused the emperor’s commands. Huangdi mustered the armies of the lords and fought him on the plain of Zhuolu, where Chi You was captured and killed.\n\nThe lords then honored Huangdi as the Son of Heaven, and he succeeded the house of Shennong as ruler of the realm.#!"
 BattlePoIHistoricalNameMingTiao: "Battle of Mingtiao"
 BattlePoIHistoricalDescMingTiao:0 "#emp Victor: Tang of Shang\nDefeated: Jie of Xia\nDate: The end of Jie’s reign#!\n#weak Jie of Xia was corrupt and licentious, and the people turned against him. Assisted by Yi Yin, Tang of Shang cultivated virtue and benevolent rule, winning the allegiance of the lords. Tang marched against Jie, and their armies met on the plain of Mingtiao. The Xia army was routed.\n\nJie fled to Nanchao, and Tang succeeded the Xia as ruler of the realm.#!"
 BattlePoIHistoricalNameChangShao: "Battle of Changshao"
 BattlePoIHistoricalDescChangShao:0 "#emp Victor: Duke Zhuang of Lu\nDefeated: Duke Huan of Qi\nDate: The tenth year of Duke Zhuang’s reign#!\n#weak After Duke Huan took the throne of Qi, he invaded Lu the following year in revenge for Lu’s support of Prince Jiu’s rival claim. Cao Gui, a man of Lu, sought an audience with Duke Zhuang and accompanied his army to Changshao. He waited until the Qi army had sounded its drums three times before ordering the attack. Qi was defeated.\n\nCao Gui explained: “Battle depends on courage. The first drumbeat rouses it; the second weakens it; the third exhausts it.” This victory of the weak over the strong has long been praised by military thinkers.#!"
 BattlePoIHistoricalNameChangPing: "Battle of Changping"
 BattlePoIHistoricalDescChangPing:0 "#emp Victor: King Zhao of Qin\nDefeated: King Xiaocheng of Zhao\nDate: The forty-seventh year of King Zhao’s reign#!\n#weak Qin attacked Shangdang in Han, but its administrator Feng Ting surrendered the commandery to Zhao. Qin and Zhao thus faced one another at Changping. Lian Po held the Zhao army behind its fortifications. Deceived by Qin’s rumors, the king replaced him with Zhao Kuo, who rashly sought battle. Bai Qi cut his supply lines and surrounded him.\n\nAfter forty-six days without food, the Zhao soldiers surrendered. More than four hundred thousand were buried alive, and Zhao never recovered its former strength.#!"
 BattlePoIHistoricalNameGaiXia: "Battle of Gaixia"
 BattlePoIHistoricalDescGaiXia:0 "#emp Victor: The King of Han\nDefeated: Xiang Yu\nDate: The fifth year of Han#!\n#weak Chu and Han agreed to divide the realm at the Honggou Canal, and Xiang Yu withdrew east. Zhang Liang and Chen Ping urged the King of Han to pursue the exhausted Chu army. Joining forces with Han Xin and Peng Yue, he surrounded Xiang Yu at Gaixia.\n\nDefeated, Xiang Yu took his own life at Wujiang, and the realm passed to the Han.#!"
 BattlePoIHistoricalNameKunYang: "Battle of Kunyang"
 BattlePoIHistoricalDescKunYang:0 "#emp Victor: The Han Army\nDefeated: Wang Mang’s Army\nDate: The first year of Gengshi#!\n#weak Wang Mang sent Wang Yi, Minister of Works, and Wang Xun, Minister over the Masses, to besiege Kunyang with a great army. The generals within the city were terrified and wanted to disperse. The future Emperor Guangwu, then a subordinate general, urged them to hold firm while he broke out to gather reinforcements.\n\nWhen the reinforcements arrived, Guangwu led picked men into the enemy ranks. The garrison sallied out with a roar, striking the besiegers from within and without. Wang Xun was killed and Wang Mang’s army collapsed. Uprisings spread throughout the realm, and Wang Mang soon fell.#!"


