l_english:
 building_baijing_01:0 "Baijing"
 building_baijing_01_desc:0 "North of Gong County in Henei, a road cut through the Taihang Mountains winds between sheer cliffs, leading east to Henei and west into Shangdang. Carts and horses have worn its stone surface smooth. In times of peace it is a shortcut for travelers and merchants; when war comes, it becomes a vital pass to defend."
 building_dagu_01:0 "Dayuguan Pass"
 building_dagu_01_desc:0 "A deep valley lies among the mountains southeast of Luoyang. Formerly called Tonggu, it offers a shortcut south from the capital to Yingchuan and Runan. Its narrow road can be blocked by an ambush, cutting off travel between north and south. The court has established passes around the capital, and this is one of them."
 building_dasanguan_01:0 "Dashan Pass"
 building_dasanguan_01_desc:0 "Sanguan stands on the Dasan Ridge south of Chencang, traditionally said to have been the pass of the Zhou-era state of San. Northward lie the fertile plains of Guanzhong; southward, the old road leads directly to Hanzhong. Emperor Gaozu once took this route north to launch his surprise attack against Zhang Han, King of Yong."
 building_dasuisai_01:0 "Great Tunnel Blocked"
 building_dasuisai_01_desc:0 "This pass lies south of the Huai River among the Dabie Mountains and was often named alongside Zhiyuan and Ming'e. During the Spring and Autumn period, when King Helü of Wu attacked Chu, the Chu official Shen Yinxu proposed destroying the Wu fleet and blocking all three passes to cut off its retreat."
 building_dujiangyan_01:0 "Dujiangyan"
 building_dujiangyan_01_desc:0 "Under the Qin, Li Bing, governor of Shu, built a diversion barrier that split the Min River in two and led water across the Chengdu Plain for both navigation and irrigation. From then on, the people of Shu could control floods and droughts and knew no famine, earning their land the name of Heaven's Storehouse."
 building_fengyue_01:0 "Fengyue Pass"
 building_fengyue_01_desc:0 "West of Wu'an in Wei Commandery, the Fu River emerges from the mountains. Two opposing heights leave a narrow opening between them, called Fukou. Travelers going west from Ye across the Taihang Mountains to Shangdang often take this route."
 building_guancheng_01:0 "Guancheng"
 building_guancheng_01_desc:0 "North of the Ru River lies the Son of Heaven's Guangcheng hunting park. To its south, two mountains enclose a river valley, where the court has established a pass to guard the route from the capital toward the Ru and Ying regions. Ma Rong's Rhapsody on Guangcheng celebrated the park and its grand hunts."
 building_type_guancheng_01_desc:0 "$building_guancheng_01_desc$"
 building_hanguguan_01:0 "Hangu Pass"
 building_hanguguan_01_desc:0 "Among the Xiao Mountains lies a valley as deep and enclosed as a box. Neither carts nor pairs of horses can travel side by side, making it the eastern gateway of Guanzhong. The Qin held it against the allied armies of the Six States. Under Emperor Xiaowu, Yang Pu, General of the Towered Ships, resented living outside the pass and petitioned to move its fortification east to Xin'an."
 building_hongzhisai_01:0 "Hongchi Pass"
 building_hongzhisai_01_desc:0 "Among the Taihang Mountains northwest of Changshan Commandery, opposing peaks enclose steep mountain paths. The Zhao had already established a barrier here during the Warring States period. It opens north to Dai Commandery and protects Changshan to the south, guarding the western approaches of Yan and Zhao."
 building_huangjintai_01:0 "Golden Terrace"
 building_huangjintai_01_desc:0 "Seeking revenge against Qi, King Zhao of Yan built a palace for Guo Wei and honored him as a teacher. Yue Yi came from Wei, Zou Yan from Qi, and Ju Xin from Zhao, as talented men throughout the realm flocked to Yan. Later tradition held that the king built a high terrace and placed gold upon it to attract talent, giving the terrace its name."
 building_hulaoguan_01:0 "Hulao Pass"
 building_hulaoguan_01_desc:0 "Chenggao was formerly called Hulao, where King Mu of Zhou was said to have kept captured tigers. Its fortified heights overlook the great river to the north, making it the most important eastern gateway to Luoyang. During the struggle between Chu and Han, Emperor Gaozu and Xiang Yu fought repeatedly over it, remaining locked in conflict for years."
 building_jianmenguan_01:0 "Jian Gate"
 building_jianmenguan_01_desc:0 "Between the Dajian and Xiaojian Mountains, a break in the cliffs leaves two opposing faces like the sides of a gate. The Stone Ox Road passes between them, winding up along sheer rock. Travelers must climb their way through; one defender can hold off a host of thousands."
 building_jingjinguan_01:0 "Jingxing Pass"
 building_jingjinguan_01_desc:0 "In Jingxing County of Changshan Commandery, the Taihang Mountains rise on all four sides around a low center resembling the bottom of a well, giving the pass its name. Counted among the realm's Nine Barriers, it was crossed by Han Xin before he formed his army with its back to the water and defeated Zhao in a single battle."
 building_Jixiaxuegong_01:0 "Jixia Academy"
 building_Jixiaxuegong_01_desc:0 "Below the Ji Gate of Linzi, the capital of Qi, King Xuan of Qi gathered scholars and persuaders from throughout the realm. He granted them residences and let them debate affairs of state without holding administrative duties, bringing the Hundred Schools together in contention. Xun Qing was the most senior among them and served three times as the academy's head."
 building_juyongguan_01:0 "Juyongguan"
 building_juyongguan_01_desc:0 "South of Juyong County in Shanggu Commandery, a long valley winds for dozens of li through the Jundu Mountains between sheer heights. The fortified pass stands in the valley and is counted among the realm's Nine Barriers. It guards the main road north from Ji into the lands beyond the frontier, and northern horsemen often approach through it on their way south."
 building_lingqu_01:0 "Lingqu Canal"
 building_lingqu_01_desc:0 "When the First Emperor sent an army south against the Baiyue, he ordered the overseer Lu to cut a canal linking the Xiang and Li rivers. Ships carrying provisions could then travel from Jianghan directly toward Lingnan. Though narrow, the canal joined the northern and southern waterways, bringing Lingnan closer to the heartland."
 building_loufan_01:0 "Lufan Pass"
 building_loufan_01_desc:0 "Loufan was originally the name of a northern people skilled in mounted archery. After King Wuling of Zhao defeated them, he established a pass among the valleys of the upper Fen River to defend against northern peoples. Its fortification controls Yanmen to the north and protects Taiyuan to the south."
 building_mengjin_01:0 "Mengjin"
 building_mengjin_01_desc:0 "A crossing of the great river north of Luoyang, Mengjin is also known as the Crossing of the Alliance. Tradition says the lords gathered here without prior arrangement when King Wu set out against King Zhou of Shang, before crossing north. Its gentle waters make it the capital's most important northern crossing, and it is among the passes established around the capital by the court."
 building_mineguan_01:0 "Ming'ai Pass"
 building_mineguan_01_desc:0 "Ming'e, also called Miansai, is a dangerous pass among the Dabie Mountains between the Huai and Han rivers, listed in Lü's Spring and Autumn Annals as one of the realm's Nine Barriers. It shields Jianghan to the south and looks north toward the Central Plains. During the wars between Wu and Chu in the Spring and Autumn period, the Chu planned to block it."
 building_piantou_01:0 "Piantou Pass"
 building_piantou_01_desc:0 "The great river comes east from beyond the frontier before turning south here. The eastern slopes are higher on their east side and lower on the west, giving the terrain a slanted appearance. Between Yanmen and Xihe, this is a vital point on Bing Province's northwestern frontier, where Xiongnu horsemen often cross the frozen river in winter to raid southward."
 building_tianjing_01:0 "Tianjing Pass"
 building_tianjing_01_desc:0 "South of Gaodu County in Shangdang Commandery, a fortified pass stands atop the Taihang Mountains. Three unfathomably deep spring wells lie before it, giving it the name of Heavenly Wells. The road leads south into Henei and north into Shangdang, making it the key to the southern Taihang."
 building_tongguan_01:0 "Tongguan Pass"
 building_tongguan_01_desc:0 "Northeast of Mount Hua, deep gullies cut the heights along the southern bank of the great river. The road can only wind through their bottoms and along the riverbank, making the terrain narrow and treacherous. Anciently called the Taolin Barrier, it was said to be where King Wu released cattle after conquering Shang, declaring that the realm would no longer resort to war."
 building_wuguan_01:0 "Wuguan Pass"
 building_wuguan_01_desc:0 "Wuguan lies in the Dan River valley east of Shang County. Known as Shaoxi during the Spring and Autumn period, it controls the southeastern route from Guanzhong toward Nanyang, Jing, and Chu. King Zhao of Qin lured King Huai of Chu here and captured him; Emperor Gaozu also broke through this pass before advancing west into Xianyang."
 building_wushengguan_01:0 "Wusheng Pass"
 building_wushengguan_01_desc:0 "Zhiyuan is a pass among the Dabie Mountains, where a single road runs between two opposing heights. It has long carried north-south traffic south of the Huai River. During the Spring and Autumn period, it formed Chu's northern defenses together with Dasui and Ming'e, guarding against threats from the north."
 building_xiameng_01:0 "Xiawomen Pass"
 building_xiameng_01_desc:0 "In Jiameng County of Guanghan Commandery, the Western Han River meets the White River amid surrounding mountains. This was anciently the domain of the lord of Ju; when King Hui of Qin attacked Shu, the king of Shu was defeated at Jiameng. The city opens north toward Hanzhong and south toward Chengdu, making it a vital entrance to Shu."
 building_xiaoguan_01:0 "Xiaoguan Pass"
 building_xiaoguan_01_desc:0 "Xiaoguan lies in Chaona County of Anding Commandery, backed by the Long Mountains and guarding the valleys of the upper Jing River. It is the key to Guanzhong's northwestern approaches. Under Emperor Xiaowen, the Xiongnu broke through the pass, and warning fires reached as far as Ganquan Palace, alarming both court and country."
 building_xiaopingjin_01:0 "Xiao Pingjin"
 building_xiaopingjin_01_desc:0 "Another crossing of the great river north of Luoyang, Xiaopingjin ranks just below Mengjin in importance. Sandbars dot its gently flowing waters. It is among the passes established around the capital, with a commandant stationed here to defend the crossing."
 building_xuanmen_01:0 "Xuanmen Pass"
 building_xuanmen_01_desc:0 "West of Chenggao, winding mountain slopes resemble a doorway, giving Xuanmen its name. Traveling east with her son, Ban Zhao passed through and described the meeting of the He and Luo rivers and the scenery of Chenggao and Xuanmen in her Rhapsody on an Eastern Journey. For those leaving Luoyang to the east, no further natural defenses remain beyond this point."
 building_xuanyuan_01:0 "Xuanyuan Pass"
 building_xuanyuan_01_desc:0 "Between Mount Taishi and Mount Shaoshi, the mountain road twists and loops, seeming to return just as it departs, giving Huanyuan its name. It offers a shortcut southeast from Luoyang to Yingchuan and is among the passes established around the capital by the court."
 building_yangguan_01:0 "Yangguan Pass"
 building_yangguan_01_desc:0 "In Longle County of Dunhuang Commandery, Yangguan takes its name from its position south of Yumen Pass. It is the gateway to the southern road west beyond the frontier. Outside stretch vast sands with little water or pasture; envoys and merchants reaching it must bid farewell to the Central Plains."
 building_yangping_01:0 "Yangping Pass"
 building_yangping_01_desc:0 "In the valleys on the western edge of Hanzhong Commandery, two mountains rise on the north bank of the Han River. The fortified pass guards the roads west toward Wudu and north toward Chencang. It is Hanzhong's western gate; as long as it holds, Nanzheng can rest secure."
 building_yanmenguan_01:0 "Yanmen Pass"
 building_yanmenguan_01_desc:0 "The steep Gouzhu Mountains stretch across the southern part of Yanmen Commandery. A pass breaks through them, traditionally said to be the route taken by migrating geese. The Gouzhu Barrier on the mountain is counted among the realm's Nine Barriers and forms Bing Province's most important northern defense against northern horsemen."
 building_yaoguan_01:0 "Yaoguan Pass"
 building_yaoguan_01_desc:0 "South of Lantian County, a dangerous pass between the Yao and Kui mountains forms the final gateway into Guanzhong along the Wuguan road. Advancing west toward Xianyang, Emperor Gaozu first tempted the Qin commanders with rich gifts, then went around the pass and crossed Mount Kui to defeat their army, reaching Bashang directly."
 building_yijue_01:0 "Yique Pass"
 building_yijue_01_desc:0 "South of Luoyang, two mountains face each other from east and west, with the Yi River flowing between them. Their resemblance to palace gate towers gives Yique its name. During the Warring States period, the Qin general Bai Qi defeated the armies of Han and Wei here. Yique is also among the passes established around the capital by the court."
 building_yumen_01:0 "Yumen Pass"
 building_yumen_01_desc:0 "Emperor Xiaowu established the commanderies of Hexi and extended frontier fortifications to Dunhuang, building Yumen Pass to open the route to the Western Regions. Foreign envoys and merchants entered through it, beyond which shifting sands stretched for a thousand li. After years of service in the Western Regions, the aging Ban Chao petitioned for only one thing: to return alive through Yumen Pass."
 building_zhanghuagong_01:0 "Zhanghua Palace"
 building_zhanghuagong_01_desc:0 "King Ling of Chu built this lofty terrace and detached palace, with a broad platform and magnificent halls. He invited the lords to celebrate its completion. The king favored slender waists, and many at his court starved themselves to death in pursuit of that ideal; later generations often cited it as a warning."
 building_zhugong_01:0 "Zhugong"
 building_zhugong_01_desc:0 "A detached palace of Chu stands on a river islet southeast of the capital at Ying. The king of Chu conducts affairs here beside the river, watching boats travel along the great river and the Han, and using it as a residence during his southern tours."
 building_gusugong_01:0 "Gusu Terrace"
 building_gusugong_01_desc:0 "Begun by King Helü of Wu and enlarged by Fuchai, this high terrace stands on Mount Gusu southwest of Wu County. Its connected halls overlook the misty waters of Lake Tai and the surrounding fields and villages. After the fall of Wu, the buildings gradually became ruins, leaving only their site for later visitors to reflect upon."
 building_zhennan_01:0 "Zhennan Pass"
 building_zhennan_01_desc:0 "Between Yulin and Jiaozhi, layered mountains enclose deep forests and dark valleys. A pass through them controls the land route from Lingnan toward Jiaozhi. Under Emperor Guangwu, Ma Yuan, General Who Calms the Waves, opened roads along the mountains on his southern campaign so that the army could advance."
 building_zhouwanggong_01:0 "King Zhou's Palace"
 building_zhouwanggong_01_desc:0 "After King Ping of Zhou moved east, the Son of Heaven resided in the royal city at Luoyi. Amid towering halls and winding corridors, he received the lords and offered sacrifices to Heaven and Earth. The old royal city stands in Henan County, where elders can still point out the former palace sites."
 building_zijin_01:0 "Zijing Pass"
 building_zijin_01_desc:0 "In the valleys of the upper Yi River, two mountains face each other across slopes thick with redbud trees. The fortified pass follows the hillside beside the water. It guards the route west from Zhuo Commandery into the Taihang Mountains toward Dai, and large garrisons often stand here when danger threatens the northern frontier."

 building_jiaodong_golden_mines_01:0 "Jiaodong Gold Mine"
 building_jiaodong_golden_mines_01_desc:0 "$building_type_jiaodong_golden_mines_01_desc$"
 building_jiaodong_golden_mines_02:0 "The expanded Jiaodong gold mine"
 building_jiaodong_golden_mines_02_desc:0 "As the pits grow deeper, craftsmen brace their walls with timber and follow the gold veins farther underground."
 building_jiaodong_golden_mines_03:0 "Large Jiaodong Gold Mine"
 building_jiaodong_golden_mines_03_desc:0 "More families take up gold mining. Rows of washing grounds and furnaces rise at the foot of the mountains, and batches of cast gold ingots are sent to the commandery offices."
 building_jiaodong_golden_mines_04:0 "Jiaodong Gold Deposit Group"
 building_jiaodong_golden_mines_04_desc:0 "Mining pits cover the mountains. Separate specialists handle extraction, washing, and casting, keeping a steady stream of gold flowing into the treasury."
