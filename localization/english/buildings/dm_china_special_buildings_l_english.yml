 building_jiaodong_crystal_mines_01:0 "Jiaodong Crystal Mine"
 building_jiaodong_crystal_mines_01_desc:0 "$building_type_jiaodong_crystal_mines_01_desc$"
 building_jiaodong_crystal_mines_02:0 "Expanded Jiaodong Crystal Mine"
 building_jiaodong_crystal_mines_02_desc:0 "The tunnels extend into the mountains, yielding ever more fine stone. Craftsmen specializing in carving and polishing jade gradually gather in the town."
 building_linzi_iron_mines_01:0 "Linqi Iron Mine"
 building_linzi_iron_mines_01_desc:0 "$building_type_linzi_iron_mines_01_desc$"
 building_xuzhou_iron_mines_01:0 "Xuzhou Iron Mine"
 building_xuzhou_iron_mines_01_desc:0 "$building_type_xuzhou_iron_mines_01_desc$"
 building_xuzhou_iron_mines_02:0 "Expanded Xuzhou Iron Mine"
 building_xuzhou_iron_mines_02_desc:0 "The pits expand year by year. The iron office adds more workers and furnaces, steadily increasing the output of iron."
 building_xuzhou_iron_mines_03:0 "Large Xuzhou iron mine"
 building_xuzhou_iron_mines_03_desc:0 "Ironworking shops spread along the mountains, their leather bellows working day and night. The plows, hoes, knives, and halberds they cast are sent far and wide."
 building_xuzhou_iron_mines_04:0 "Xuzhou Iron Ore Cluster"
 building_xuzhou_iron_mines_04_desc:0 "Pits and smelting works join together, their furnace fires lighting half the mountainside red. The iron produced here can supply an entire province with farming tools, arms, and armor."
