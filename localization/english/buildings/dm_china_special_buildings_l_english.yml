l_english:
 building_baijing_01:0 "Baijing"
 building_baijing_01_desc:0 "Baijing commands the mountain pass and serves as a critical fortress within the local defense and transportation system."
 building_dagu_01:0 "Dayuguan Pass"
 building_dagu_01_desc:0 "Dayuguan Pass controls the valley route, capable of blocking enemy forces and protecting traveling merchants."
 building_dasanguan_01:0 "Dashan Pass"
 building_dasanguan_01_desc:0 "Dashan Pass, situated against the mountains and leveraging its strategic advantages, serves as the southwestern gateway to Guanzhong."
 building_dasuisai_01:0 "Great Tunnel Blocked"
 building_dasuisai_01_desc:0 "Daixui relies on its rugged terrain to guard the surrounding territories."
 building_dujiangyan_01:0 "Dujiangyan"
 building_dujiangyan_01_desc:0 "The Dujiangyan system diverts and channels water to irrigate fields, enabling the Chengdu Plain to enjoy the benefits of fertile land."
 building_fengyue_01:0 "Fengyue Pass"
 building_fengyue_01_desc:0 "Fengyue Pass guards the mountain pass, providing a solid barrier for surrounding territories."
 building_guancheng_01:0 "Guancheng"
 building_guancheng_01_desc:0 "The fortified pass city is garrisoned with troops and controls the nearby roads and passes."
 building_type_guancheng_01_desc:0 "$building_guancheng_01_desc$"
 building_hanguguan_01:0 "Hangu Pass"
 building_hanguguan_01_desc:0 "Hangu Pass boasts a formidable terrain and serves as the strategic gateway to Guanzhong."
 building_hongzhisai_01:0 "Hongchi Pass"
 building_hongzhisai_01_desc:0 "Hongchi Pass guards a critical chokepoint in the transportation network, capable of delaying invading forces."
 building_huangjintai_01:0 "Golden Terrace"
 building_huangjintai_01_desc:0 "The Golden Terrace symbolizes respect for talent and humility toward scholars, attracting brilliant minds from across the realm to serve."
 building_hulaoguan_01:0 "Hulao Pass"
 building_hulaoguan_01_desc:0 "Hulao Pass boasts formidable mountainous terrain and has long been a fiercely contested strategic stronghold in the Central Plains."
 building_jianmenguan_01:0 "Jian Gate"
 building_jianmenguan_01_desc:0 "Jian Gate is flanked by mountain ranges and serves as one of the most formidable passes guarding the northern approaches to Shu."
 building_jingjinguan_01:0 "Jingxing Pass"
 building_jingjinguan_01_desc:0 "Jingxing Pass is situated at the strategic pass of Taihang Mountain, controlling a vital route for east-west travel."
 building_Jixiaxuegong_01:0 "Jixia Academy"
 building_Jixiaxuegong_01_desc:0 "The Jixia Academy gathers scholars from various schools of thought, allowing diverse doctrines to contend with one another."
 building_juyongguan_01:0 "Juyongguan"
 building_juyongguan_01_desc:0 "Juyong Pass, situated where it commands the mountain and overlooks the valley, guards the vital route from the north leading into the hinterlands."
 building_lingqu_01:0 "Lingqu Canal"
 building_lingqu_01_desc:0 "The Lingqu Canal connects water systems, facilitates grain transport, and irrigates fields along its banks."
 building_loufan_01:0 "Lufan Pass"
 building_loufan_01_desc:0 "Lufan Pass guards the northern mountain pass and serves as a crucial stronghold for defending against enemies from the grasslands."
 building_mengjin_01:0 "Mengjin"
 building_mengjin_01_desc:0 "Mengjin is a crucial ferry crossing on the Yellow River, facilitating military movements and commercial trade."
 building_mineguan_01:0 "Ming'ai Pass"
 building_mineguan_01_desc:0 "The Mian'ai Pass features narrow and treacherous roads, where a small garrison can hold the strategic high ground to repel enemy forces."
 building_piantou_01:0 "Piantou Pass"
 building_piantou_01_desc:0 "Piantou Pass controls the river valley and border route, serving as a crucial component of the northern frontier defense line."
 building_tianjing_01:0 "Tianjing Pass"
 building_tianjing_01_desc:0 "Tianjing Pass looms high over the Taihang Mountain pass, making it easy to defend but difficult to attack."
 building_tongguan_01:0 "Tongguan Pass"
 building_tongguan_01_desc:0 "Tongguan Fortress, backed by mountains and flanked by rivers, guards the eastern gateway of Guanzhong."
 building_wuguan_01:0 "Wuguan Pass"
 building_wuguan_01_desc:0 "Wuguan controls the north-south passage between Qin and Chu, holding a strategically vital position."
 building_wushengguan_01:0 "Wusheng Pass"
 building_wushengguan_01_desc:0 "Wusheng Pass is situated between treacherous defiles and serves as a critical node for north-south transportation."
 building_xiameng_01:0 "Xiawomen Pass"
 building_xiameng_01_desc:0 "Xiaguan Gate guards the entrance to the valley, effectively blocking enemy forces from advancing deeper."
 building_xiaoguan_01:0 "Xiaoguan Pass"
 building_xiaoguan_01_desc:0 "Xiaoguan Pass is a traditional frontier fortress in the northwest, guarding the road leading to Guanzhong."
 building_xiaopingjin_01:0 "Xiao Pingjin"
 building_xiaopingjin_01_desc:0 "Xiao Pingjin controls the Yellow River ferry, facilitating the movement of troops and supplies."
 building_xuanmen_01:0 "Xuanmen Pass"
 building_xuanmen_01_desc:0 "Xuanmen Pass is strategically positioned at a defensible location to guard the nearby transportation routes."
 building_xuanyuan_01:0 "Xuanyuan Pass"
 building_xuanyuan_01_desc:0 "Xuan Yuan Pass is built along the mountain and serves as a vital pass connecting the Central Plains with surrounding regions."
 building_yangguan_01:0 "Yangguan Pass"
 building_yangguan_01_desc:0 "Yangguan guards the Western Regions road, providing shelter for distant travelers and armies."
 building_yangping_01:0 "Yangping Pass"
 building_yangping_01_desc:0 "Yangping Pass controls the gateway to Hanzhong and is a strategically vital location for military movements into and out of Shu."
 building_yanmenguan_01:0 "Yanmen Pass"
 building_yanmenguan_01_desc:0 "Yanmen Pass stands majestically in the northern mountain range, long guarding the northern frontier of Central China."
 building_yaoguan_01:0 "Yaoguan Pass"
 building_yaoguan_01_desc:0 "Yaoguan Pass features treacherous roads and serves as a strategic corridor between Guanzhong and the Central Plains."
 building_yijue_01:0 "Yique Pass"
 building_yijue_01_desc:0 "Yique features two mountains facing each other with the Yellow River flowing through, serving as a natural gateway to the south of Luoyang."
 building_yumen_01:0 "Yumen Pass"
 building_yumen_01_desc:0 "Yumen Pass guards the long route leading to the Western Regions, serving as a hub for border trade and defense."
 building_zhanghuagong_01:0 "Zhanghua Palace"
 building_zhanghuagong_01_desc:0 "The Hall of Emperor Zhang Hua boasts magnificent palaces that manifest the majesty of the ruler and the might of the nation."
 building_zhugong_01:0 "Zhugong"
 building_zhugong_01_desc:0 "Zhugong is situated southeast of Yingdu, serving both as a vantage point to monitor shipping on the Han River and the Yangtze River, and as a resting place for imperial inspections in the south."
 building_gusugong_01:0 "Gusu Terrace"
 building_gusugong_01_desc:0 "The Gusu Terrace stands tall and majestic; from its summit, one can gaze far across the lakes and mountains of Jiangnan. It is a renowned palace terrace in the Wu region."
 building_zhennan_01:0 "Zhennan Pass"
 building_zhennan_01_desc:0 "Zhen'nan Pass guards the southern passage, providing a strong defensive line for the border."
 building_zhouwanggong_01:0 "King Zhou's Palace"
 building_zhouwanggong_01_desc:0 "The Zhou Palace serves as the political center where the Son of Heaven holds court and conducts state rituals."
 building_zijin_01:0 "Zijing Pass"
 building_zijin_01_desc:0 "Zijing Pass controls the pass of Taihang Mountain and serves as an important barrier guarding the northern hinterland."

 building_jiaodong_golden_mines_01:0 "Jiaodong Gold Mine"
 building_jiaodong_golden_mines_01_desc:0 "The gold mines in Jiaodong bring stable and substantial wealth to the local region."
 building_jiaodong_golden_mines_02:0 "The expanded Jiaodong gold mine"
 building_jiaodong_golden_mines_02_desc:0 "The expanded mine can now extract deeper gold veins."
 building_jiaodong_golden_mines_03:0 "Large Jiaodong Gold Mine"
 building_jiaodong_golden_mines_03_desc:0 "Large-scale mining and smelting facilities significantly increased gold production."
 building_jiaodong_golden_mines_04:0 "Jiaodong Gold Deposit Group"
 building_jiaodong_golden_mines_04_desc:0 "The vast Jiaodong gold mine cluster is a major source of state revenue."
 building_Xinglong_golden_mines_01:0 "Xinglong Gold Mine"
 building_Xinglong_golden_mines_01_desc:0 "The Xinglong Gold Mine produces precious gold ore."
 building_Xinglong_golden_mines_02:0 "Expanded Xinglong Gold Mine"
 building_Xinglong_golden_mines_02_desc:0 "The expanded Xinglong Gold Mine boasts more comprehensive mining facilities."
 building_Xinglong_golden_mines_03:0 "Large Xinglong Gold Mine"
 building_Xinglong_golden_mines_03_desc:0 "A large number of miners and craftsmen extract and refine gold here."
 building_Xinglong_golden_mines_04:0 "Xinglong Gold Deposit Group"
 building_Xinglong_golden_mines_04_desc:0 "The Xinglong Gold Mine Cluster continuously supplies wealth to the national treasury."
 building_lishui_golden_mines_01:0 "Lishui Gold Mine"
 building_lishui_golden_mines_01_desc:0 "The gold mines in the mountainous areas of Lishui have provided a new source of revenue for the local region."
 building_lishui_golden_mines_02:0 "The expanded Lishui gold mine"
 building_lishui_golden_mines_02_desc:0 "Deeper mines and improved tools increased the output of gold from the Lishui mine."
 building_lishui_golden_mines_03:0 "Large Lishui Gold Mine"
 building_lishui_golden_mines_03_desc:0 "Large-scale mining settlements gradually formed around the Lishui gold mine."
 building_lishui_golden_mines_04:0 "Lishui Gold Mine Cluster"
 building_lishui_golden_mines_04_desc:0 "The mature Lishui gold mine cluster brings in massive gold revenues."
 building_yaan_golden_mines_01:0 "Yaan Gold Mine"
 building_yaan_golden_mines_01_desc:0 "Vein deposits of gold can be mined from the mountains in Ya'an."
 building_yaan_golden_mines_02:0 "Expanded Ya'an Gold Mine"
 building_yaan_golden_mines_02_desc:0 "The expanded Ya'an gold mine offers higher mining efficiency."
 building_yaan_golden_mines_03:0 "Large Ya'an Gold Mine"
 building_yaan_golden_mines_03_desc:0 "Improved mines and smelting workshops increased gold production."
 building_yaan_golden_mines_04:0 "Yaan Gold Deposit Cluster"
 building_yaan_golden_mines_04_desc:0 "The Ya'an gold deposit cluster has become the pillar of the local economy."
 building_jiaodong_crystal_mines_01:0 "Jiaodong Crystal Mine"
 building_jiaodong_crystal_mines_01_desc:0 "The Jiaodong vein produces crystal that is clear as glass and of great value."
 building_jiaodong_crystal_mines_02:0 "Expanded Jiaodong Crystal Mine"
 building_jiaodong_crystal_mines_02_desc:0 "The expanded mine can steadily supply a greater amount of high-quality crystal."
 building_linzi_iron_mines_01:0 "Linqi Iron Mine"
 building_linzi_iron_mines_01_desc:0 "The iron mines in Linzi supply abundant iron for agricultural tools, weapons, and construction."
 building_xuzhou_iron_mines_01:0 "Xuzhou Iron Mine"
 building_xuzhou_iron_mines_01_desc:0 "The iron mines in Xu Province begin supplying iron ore to nearby workshops."
 building_xuzhou_iron_mines_02:0 "Expanded Xuzhou Iron Mine"
 building_xuzhou_iron_mines_02_desc:0 "The expanded iron ore production in Xuzhou has stabilized and grown steadily."
 building_xuzhou_iron_mines_03:0 "Large Xuzhou iron mine"
 building_xuzhou_iron_mines_03_desc:0 "Large mines and iron smelting workshops support a thriving military supply production."
 building_xuzhou_iron_mines_04:0 "Xuzhou Iron Ore Cluster"
 building_xuzhou_iron_mines_04_desc:0 "The iron ore deposits in Xuzhou provide the entire territory with abundant high-quality iron materials."
