l_english:
 quix_seduce_outcome.2000.t:0 "Imperial Aura"
 quix_seduce_outcome.2000.desc:0 "I wait in the splendid hall of [target.GetTitledFirstNamePossessive], with only wine and fruit beside me. \n\n[target.GetSheHe|U] sees me without surprise, instead smiling as he approaches. After a few probing remarks, we no longer conceal our feelings for each other."
 quix_seduce_outcome.2000.a:0 "I can get used to this!"
 quix_seduce_outcome.2000.b:0 "I come, I see, I conquer!"
 hd_quix_seduce_outcome.2010.t:0 "Intent of sadism"
 quix_seduce_outcome.2010.desc:0 "[target.GetTitledFirstName]invited me to a secret meeting in the dungeon. Candles had already been lit, and flower petals were scattered beside the torture instruments; [target.GetSheHe]clearly, everything was arranged in advance. \"\n\nListen to me tonight,\" [target.GetSheHe]said. What happened next proved that [target.GetHerHis]the interest went far beyond ordinary pleasure."
 quix_seduce_outcome.2010.a:0 "I am a sadist, not a masochist."
 quix_seduce_outcome.2020.t:0 "The rolling dust within the haystack"
 quix_seduce_outcome.2020.desc:0 "I could never find a moment alone with [target.GetName], so I slipped a note to [target.GetHerHim], arranging to meet at the Hay Pavilion. \n\nThe bleating of livestock drowned out our conversation. [target.GetSheHe|U]As she/he drew near, I knew how this secret meeting would end."
 quix_seduce_outcome.2020.a:0 "I need a secret chamber..."
 quix_seduce_outcome.2020.b:0 "That's interesting, but I'm going to take a shower now. Goodbye."
 quix_seduce_outcome.2021.t:0 "Temple of the God of Love"
 quix_seduce_outcome.2021.desc:0 "[target.GetName] invited me to the temple under the pretext of praying all day. Upon arriving at dusk, only [target.GetHerHim], dressed in a simple robe, was inside the temple; no one else was present. \n\n[target.GetSheHe|U] had intended to discuss love and piety, but we quickly forgot our prepared words. This prayer ultimately yielded a different outcome."
 quix_seduce_outcome.2021.a:0 "The will of the gods!"
 quix_seduce_outcome.2021.b:0 "I have spent a sacred time."
 quix_seduce_outcome.2022.t:0 "Joy of the Afternoon"
 quix_seduce_outcome.2022.desc:0 "I received an invitation to a friend's manor, and upon arrival, I discovered that the person truly waiting for me was [target.GetTitledFirstName]. \n\nWe strolled, dined, and our conversation gradually became more personal. In the afternoon, [target.GetSheHe]invited me upstairs to continue our discussion; the nominal host never appeared throughout the entire weekend."
 quix_seduce_outcome.2022.a:0 "When it is right, it is right!"
 quix_seduce_outcome.2022.b:0 "We will forever possess the memories that belong to us."
 quix_seduce_outcome.2023.t:0 "Depth of Enthusiasm"
 quix_seduce_outcome.2023.desc:0 "To avoid servants and courtiers, I arranged to meet [target.GetTitledFirstName] at an ancient tomb. Though cold here, no one would disturb us.\n\nI was about to express my feelings when [target.GetSheHe] spoke the same words first. The long silence that followed needs no further explanation."
 quix_seduce_outcome.2023.a:0 "We won't always have to do this here..."
 quix_seduce_outcome.2023.b:0 "We should give the ancients some room to think."
 quix_seduce_outcome.2024.t:0 "Original Experience"
 quix_seduce_outcome.2024.desc:0 "[target.GetTitledFirstName] agreed to meet me secretly in a wooden cabin in the wilderness. With no servants and no eavesdroppers, we were finally able to speak frankly. \n\n After nightfall, [target.GetSheHe] directly asked about my feelings. I did not avoid the question, and [target.GetSheHe] also accepted my answer."
 quix_seduce_outcome.2024.b:0 "I will cherish this experience forever."
 quix_seduce_outcome.2025.t:0 "In leisure time"
 quix_seduce_outcome.2025.desc:0 "I invited [target.GetTitledFirstName] to stay at my countryside estate, hoping that solitude would bring our relationship closer. After a day of walking and talking, we stood on the terrace watching the sky darken. \n\n Finally unable to hide their feelings, they took the initiative to kiss me. [target.GetSheHe|U]"
 quix_seduce_outcome.2025.a:0 "Taking a vacation with you is truly wonderful."
 quix_seduce_outcome.2025.b:0 "You bring me great comfort."
 quix_seduce_outcome.2026.t:0 "Boat of Rock"
 quix_seduce_outcome.2026.desc:0 "I borrowed a pleasure boat and invited [target.GetTitledFirstName] to go out with me alone. After dinner, we conversed on the deck adorned with lanterns. \n\n[target.GetSheHe|U] thanked me for arranging this gathering and kissed me as I finished speaking. The initial surprise quickly faded, and we did not rush back to shore."
 quix_seduce_outcome.2026.a:0 "I think I want to buy a ship!"
 quix_seduce_outcome.2026.b:0 "I feel a bit uncomfortable."
 quix_seduce_outcome.2027.t:0 "A great classic"
 quix_seduce_outcome.2027.desc:0 "A few months of probing have been sufficient. I arranged to meet [target.GetTitledFirstName] in the wine cellar, a secluded place where no one would seek us out. As soon as \n\n[target.GetSheHe|U] climbed down the ladder, he made his intentions clear. I responded with equal candor, and the meeting quickly transcended words."
 quix_seduce_outcome.2027.a:0 "Now, how about a drink!?"
 quix_seduce_outcome.2027.b:0 "You can bring a bottle with you when you go."
 quix_seduce_outcome.2028.t:0 "Honest Method"
 quix_seduce_outcome.2028.desc:0 "After much deliberation, I finally decided to directly express my feelings to [target.GetTitledFirstName]. During our secret meeting, [target.GetSheHe] was initially confused but never left. \n\nUpon hearing my words, [target.GetSheHe] responded with a kiss. It turns out [target.GetSheHe] had felt the same way all along, just unsure if I was serious."
 quix_seduce_outcome.2028.a:0 "Honesty is the best policy."
 quix_seduce_outcome.2028.b:0 "You know what? I've got a second idea."
 quix_seduce_outcome.2029.t:0 "Impatient."
 quix_seduce_outcome.2029.desc:0 "I have grown weary of [target.GetTitledFirstName]'s evasive attitude, so I arranged a secret meeting to demand a clear answer from [target.GetHerHim]. \n\n[target.GetSheHe|U] denied that I was being played and admitted they had long intended it. Once the misunderstanding was cleared up, we smiled at each other and then embraced."
 quix_seduce_outcome.2029.a:0 "I should have said it sooner."
 quix_seduce_outcome.2029.b:0 "I am very pleased that this is my plan!"
 quix_seduce_outcome.2030.t:0 "Unrestrained passion"
 quix_seduce_outcome.2030.desc:0 "I and [target.GetTitledFirstName] have both understood each other's desires; further probing is pointless. Our confidant has arranged a secluded meeting place for us.\n\nAs I was about to confess, [target.GetFirstName]silenced me with a finger. From then on, our encounters became passionate and direct, requiring no further promises."
 quix_seduce_outcome.2030.a:0 "I like to make love with you!"
 quix_seduce_outcome.2030.b:0 "I am very happy to be with you."
 quix_seduce_outcome.2031.t:0 "I think we are alone..."
 quix_seduce_outcome.2031.desc:0 "I can see that [target.GetTitledFirstName] has feelings for me, but there are always people around. So I suggested leaving to [target.GetHerHis], and we slipped out of the gathering together when no one was watching. \n\nOnce away from the crowd, [target.GetSheHe]admitted they had been looking for a moment alone all evening. We finally didn't have to keep pretending."
 quix_seduce_outcome.2031.a:0 "We need a good excuse!"
 quix_seduce_outcome.2031.b:0 "Perhaps it would be best for us to part ways..."
 quix_seduce_outcome.2301.t:0 "Secret Date"
 quix_seduce_outcome.2301.desc:0 "My spy has arranged a secret meeting place where I can meet with [target.GetTitledFirstName] without being seen. \n\nAfter confirming no one was following me, I entered the room and found [target.GetSheHe]already waiting by the fireplace. \"Take off your outer robe.\" It seems my thoughts have never been hidden from [target.GetHerHim]."
 quix_seduce_outcome.2301.b:0 "Can you please keep your voice down?"
 quix_seduce_outcome.2302.t:0 "Storage Locker"
 quix_seduce_outcome.2302.desc:0 "The distance had always hindered my pursuit of [target.GetTitledFirstName], so [target.GetSheHe] secretly came under the guise of pilgrimage and temporarily stayed in an inconspicuous servant's quarters. \n\n We conversed through the night, neither directly revealing our intentions. Yet after returning to our respective rooms, [target.GetFirstName] quietly approached my bedside again."
 quix_seduce_outcome.2302.a:0 "Please stay a little longer!"
 quix_seduce_outcome.2302.b:0 "There is such a mythical inn..."
 quix_seduce_outcome.2303.t:0 "I have cast a spell upon you..."
 quix_seduce_outcome.2303.desc:0 "I invited [target.GetTitledFirstName] to the Secret Woods at midnight under the guise of the Horned God ritual. We both understood that this gathering had ulterior motives. Once the \n\n ritual began, [target.GetSheHe] followed my signal. Amidst the chanting of the crowd, we completed this secret sacrifice in our own ways."
 quix_seduce_outcome.2303.a:0 "Because you belong to me!"
 quix_seduce_outcome.2303.b:0 "Why do you sing?"
 quix_seduce_outcome.2304.t:0 "Festival Gala"
 quix_seduce_outcome.2304.desc:0 "Every year, [target.GetName] would attend the local festival alone, and I would also slip into the crowd. We drank wine and danced together, quickly shedding our usual identities. After returning to the tent outside the city, I finally confessed my feelings. \n\n She merely smiled and replied, \"I saw that long ago.\" [target.GetSheHe|U]"
 quix_seduce_outcome.2304.a:0 "Let's make this a tradition!"
 quix_seduce_outcome.2304.b:0 "What an ancient and charming small town."
 quix_seduce_outcome.2305.t:0 "Suitable for the King"
 quix_seduce_outcome.2305.desc:0 "I and [target.GetName] were invited to a banquet in a foreign land. Away from the familiar courtiers and spies, we sat together all night drinking and conversing. After the feast, \n\n, [target.GetSheHe] quietly tapped my hand. We took our leave in turn, and finally reunited in my chamber; this time, [target.GetSheHe] no longer concealed his desire."
 quix_seduce_outcome.2305.a:0 "We should stay a little longer!"
 quix_seduce_outcome.2305.b:0 "What happens wherever this is?"
 quix_seduce_outcome.3000.desc:0 "[owner.GetTitledFirstName] is waiting in an opulent room, with only wine and fruit beside him. \n\n I approach with a smile and begin to feed [owner.GetHerHim] the fruit by hand. [owner.GetSheHe|U] He does not refuse, and soon we no longer conceal our feelings for one another."
 quix_seduce_outcome.3000.a:0 "[owner.GetTitledFirstName]seems to be deeply impressed."
 quix_seduce_outcome.3010.desc:0 "[owner.GetTitledFirstName] has been pursuing me for several months, so I have decided to give [owner.GetHerHim] one final test in the dungeon. Candles, flower petals, and instruments of torture are all prepared. \"\n\n, listen to me tonight,\" I said to [owner.GetHerHim]. [owner.GetSheHe|U] accepted the invitation and everything I arranged."
 quix_seduce_outcome.3010.a:0 "[owner.GetSheHe] is sufficient."
 quix_seduce_outcome.3020.desc:0 "I have finally decided to respond to [owner.GetTitledFirstNamePossessive]'s advances, sending a note to arrange a meeting with [owner.GetHerHim] at the Hay Pavilion. \n\nThe sounds of livestock drowned out our conversation. [owner.GetSheHe|U]As she/he drew near, I no longer feigned reserve."
 quix_seduce_outcome.3020.a:0 "Next time, I'll sneak into the bedroom..."
 quix_seduce_outcome.3021.desc:0 "I invited [owner.GetTitledFirstName] to a secluded shrine under the guise of daily prayer. By evening, no one else remained within the temple but us.\n\nI had intended to discuss love and piety first, but[owner.GetSheHe]soon realized the true nature of my invitation. The prepared words were never spoken."
 quix_seduce_outcome.3021.a:0 "The will of the gods!"
 quix_seduce_outcome.3022.desc:0 "[owner.GetName] has been pursuing me for some time, so I arranged a secret meeting at a friend's estate where the host would not be present.\n\nWe strolled and dined together, and our conversation gradually became more intimate. In the afternoon, I invited [owner.GetHerHim] to come upstairs to continue our talk, and [owner.GetSheHe] happily accepted."
 quix_seduce_outcome.3022.a:0 "When it is right, it is right!"
 quix_seduce_outcome.3023.desc:0 "[owner.GetTitledFirstName] invited me to meet at an ancient tomb. Though the place is cold and damp, no one will disturb us there. \n\n[owner.GetSheHe|U] Just as I was about to explain my purpose, I blurted out my feelings first. It turns out this was precisely why [owner.GetHerHis] summoned me here."
 quix_seduce_outcome.3023.a:0 "We put on an unforgettable show for the ancients!"
 quix_seduce_outcome.3024.desc:0 "I agreed to meet [owner.GetTitledFirstName] secretly in a cabin in the wilderness. Without servants or eavesdroppers, we could finally speak frankly. \n\nAfter nightfall, I directly asked about [owner.GetHerHis]'s purpose. [owner.GetSheHe|U]admitted their feelings, and I accepted this confession."
 quix_seduce_outcome.2024.a:0 "My beloved!"
 quix_seduce_outcome.3025.desc:0 "[owner.GetTitledFirstName] invites me to stay at a country estate. I know [owner.GetSheHe] intends to court me; I merely want to hear [owner.GetHerHim] admit it.\n\nAfter a day of walks and conversation, [owner.GetSheHe] still hesitates to speak. Unwilling to wait any longer, I take the initiative and kiss [owner.GetHerHim] on the terrace."
 quix_seduce_outcome.3025.a:0 "What a delightful day it is."
 quix_seduce_outcome.3026.desc:0 "[owner.GetTitledFirstName] invited me to travel by boat, knowing that [owner.GetSheHe] wished to be alone with me. After dinner, we conversed on the lantern-lit deck. \n\n I thanked [owner.GetHerHim] for arranging this gathering and kissed [owner.GetHerHim] as the words fell from my lips. [owner.GetSheHe|U] did not refuse, and neither of us hurried back to shore."
 quix_seduce_outcome.3026.a:0 "I think I want to buy a ship!"
 quix_seduce_outcome.3027.desc:0 "[owner.GetTitledFirstName]Agreed to meet me in the wine cellar. Seizing the opportunity to express my feelings, I arrived alone on time. \n\nAs soon as I climbed down the ladder, I directly asked about [owner.GetHerHis]'s true intentions. [owner.GetSheHe|U]With a silent nod, the last hesitation between us vanished."
 quix_seduce_outcome.3027.a:0 "What happiness!"
 quix_seduce_outcome.3028.desc:0 "[owner.GetTitledFirstName] invited me to a secret meeting and frankly admitted his feelings for me. \n\n I responded with a kiss. In truth, I had felt the same way long ago; I was simply unsure whether [owner.GetSheHe] took it seriously. Now there is no need to continue doubting."
 quix_seduce_outcome.3028.a:0 "Honesty is the best policy."
 quix_seduce_outcome.3029.desc:0 "[owner.GetTitledFirstName]arranged a secret meeting and accused me of knowing [owner.GetHerHis]'s feelings yet deliberately delaying. \n\nI immediately denied it, as I had also secretly admired [owner.GetHerHim]. Once the misunderstanding was cleared, we smiled at each other and then embraced."
 quix_seduce_outcome.3029.a:0 "I should have said it sooner."
 quix_seduce_outcome.3030.desc:0 "I and [owner.GetTitledFirstName] have both understood each other's desires; further probing is pointless. A trusted confidant has arranged a secluded meeting place for us. Just as \n\n[owner.GetSheHe|U] was about to confess, I silenced [owner.GetHerHis] with a gesture. From then on, our encounters became passionate and direct, requiring no further promises."
 quix_seduce_outcome.3030.a:0 "I like to make love with you!"
 quix_seduce_outcome.3301.desc:0 "[owner.GetTitledFirstName] has arranged a secret retreat and invites me to visit away from prying eyes. I can guess [owner.GetHerHis] purpose, and it suits me perfectly.\n\nAfter making sure no one has followed me, I enter the room first and wait. When [owner.GetSheHe|U] arrives, I say only one thing: 'Take off your outer robe.'"
 quix_seduce_outcome.2301.a:0 "Yes, yes!"
 quix_seduce_outcome.3302.desc:0 "I knew [owner.GetTitledFirstName] had long desired to court me, so I secretly traveled under the guise of pilgrimage to [owner.GetHerHis]'s palace and took up residence in an inconspicuous servant's quarters. \n\nWe conversed until midnight, neither directly revealing our intentions. After returning to our respective chambers, I changed my mind and quietly approached [owner.GetFirstName]'s bedside."
 quix_seduce_outcome.3302.a:0 "Do you mind if I stay a little longer?"
 quix_seduce_outcome.3303.desc:0 "[owner.GetTitledFirstName]invited me to attend the Horned God ritual at midnight. We both understood that this secret gathering in the woods had another purpose.\n\nOnce the ritual began, I accepted [owner.GetHerHis]'s gesture. Accompanied by the chanting of the crowd, we completed this clandestine sacrifice in our own ways."
 quix_seduce_outcome.3303.a:0 "I love this song!"
 quix_seduce_outcome.3304.desc:0 "I attend local festivals alone each year, temporarily escaping the pressures of the palace. This year, [owner.GetTitledFirstName] also appeared among the crowd. \n\nWe drank and danced together, then went to a tent outside the city. [owner.GetSheHe|U]Finally revealing my feelings, I only smiled and replied: \"I saw that long ago.\""
 quix_seduce_outcome.3304.a:0 "Let's make this a tradition!"
 quix_seduce_outcome.3305.desc:0 "I and [owner.GetName] were invited to a banquet in a foreign land. I knew that [owner.GetSheHe] had long desired to pursue me, and being away from familiar eyes and ears provided us with an opportunity. \n\n We sat together all night, drinking and conversing. After the banquet, I quietly touched [owner.GetHerHis]'s hand; we took our leave in turn, and finally reunited in [owner.GetHerHis]'s chamber."
 quix_seduce_outcome.3305.a:0 "We should stay a little longer!"
