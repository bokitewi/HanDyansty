l_english:
 hd_youzhou_tuqi:0 "Youzhou Cavalry"
 hd_youzhou_tuqi_flavor:0 "#F Youzhou lies near the frontier, where people grow up in the saddle and excel at bold charges. Emperor Guangwu once used assault cavalry from Yuyang and Shanggu to pacify Hebei; ever since, Youzhou has ranked foremost whenever fine cavalry is discussed.#!"
 hd_establish_youzhou_tuqi_decision:0 "Establish the Youzhou Cavalry Corps System"
 hd_establish_youzhou_tuqi_decision_desc:0 "Youzhou borders the Wuhuan and Xianbei to the north. The people of Zhuo, Yuyang, and Shanggu grow up on horseback, knowing the frontier roads and excelling at charges and pursuit. Geng Yan once urged Emperor Guangwu to call up the shock cavalry of Yuyang and Shanggu, helping pacify Hebei. Youzhou still ranks foremost wherever fine cavalry are discussed.\n\nFrontier troops gather and disperse unpredictably; hasty musters often lack men or horses. By recording local men on military rolls, storing fodder and grain, and using your reputation to recruit frontier heroes, you can keep the Youzhou Shock Cavalry ready at all times."
 hd_establish_youzhou_tuqi_decision_tooltip:0 "Record the Youzhou Shock Cavalry on military rolls for recruitment"
 hd_establish_youzhou_tuqi_decision_confirm:0 "Enroll the Shock Cavalry!"
 hd_establish_youzhou_tuqi_decision_effect:0 "You can now recruit Youzhou Shock Cavalry as your [men_at_arms|E]. Recruitment and expansion require a county you still personally hold in Youzhou and a settled local population. This system is tied to your [primary_title|E] and passes with it."
 hd_maa_source.0001.t:0 "The cavalry source of Youzhou has been cut off."
 hd_maa_source.0001.desc:0 "I can no longer requisition knights and mounts from Youzhou. The existing Youzhou Cavalry will still remain loyal, but recruitment or expansion is not possible until troop reserves are restored."
 hd_maa_source.0001.a:0 "The current troops can still be maintained."
 hd_maa_source.0002.t:0 "Youzhou Cavalry Corps Source Restored"
 hd_maa_source.0002.desc:0 "I have once again secured sufficient manpower from Youzhou; the recruitment and expansion of Youzhou Cavalry are now restored."
 hd_maa_source.0002.a:0 "I can recruit them again."
 hd_baima_yicong:0 "White Horse Cavalry"
 hd_baima_yicong_flavor:0 "#F Youbeiping lies on the frontier. Its skilled archers band together as volunteers, each riding a white horse and carrying a bow. When masses of white horses charge, the peoples beyond the border see them from afar and know better than to provoke them.#!"
 hd_gongsun_baima_event_army:0 "Gongsun Zan's White Horse Righteous Cavalry"
 hd_establish_baima_yicong_decision:0 "Establish the White Horse Righteous Escort Army system"
 hd_establish_baima_yicong_decision_desc:0 "Youbeiping lies on the frontier, facing the Wuhuan and Xianbei across the mountains. Its young men grow up hunting and shooting from horseback, gathering in bands with white horses as their emblem and calling one another companions.\n\nThey respect heroes who lead them to great deeds, rather than written muster orders. You must meet their leaders and win them through your reputation, then register their men and provide fodder for their horses. Only then will the White Horse Companions answer your call."
 hd_establish_baima_yicong_decision_tooltip:0 "Record the White Horse Companions of Youbeiping on military rolls for recruitment"
 hd_establish_baima_yicong_decision_confirm:0 "Enroll the Companions!"
 hd_establish_baima_yicong_decision_effect:0 "You can now recruit White Horse Companions as your [men_at_arms|E]. Recruitment and expansion require a county you still personally hold in Youbeiping and a settled local population. This system is tied to your [primary_title|E] and passes with it."
 hd_maa_source.0003.t:0 "The source of troops for the White Horse Cavalry has been cut off."
 hd_maa_source.0003.desc:0 "I can no longer requisition White Horse Cavalry from Youbeiping. The existing White Horse Righteous Followers will remain loyal, but recruitment or expansion is prohibited until troop reserves are restored."
 hd_maa_source.0003.a:0 "The current troops can still be maintained."
 hd_maa_source.0004.t:0 "Baima Yicong troop recruitment restored"
 hd_maa_source.0004.desc:0 "I have once again secured sufficient manpower from Youbeiping; the recruitment and expansion of the White Horse Cavalry have been restored."
 hd_maa_source.0004.a:0 "I can recruit them again."
 hd_wuhuan_qicong:0 "Wuhuan Auxiliary Cavalry"
 hd_wuhuan_qicong_flavor:0 "#F The Wuhuan follow water and pasture, and their men learn to ride and shoot from childhood. The Han often recruits them as auxiliary cavalry for campaigns across the realm. Swift in coming and going, they excel at harassment and pursuing routed enemies.#!"
 hd_establish_wuhuan_qicong_decision:0 "Establish the cavalry unit of the Wuhuan auxiliary army"
 hd_establish_wuhuan_qicong_decision_desc:0 "The Wuhuan descend from the Donghu. Since Emperor Xiaowu's time, they have lived beyond the frontier from Shanggu and Yuyang to Liaodong, following water and pasture. Their men learn to ride and shoot from childhood. Han commanders often recruit them as cavalry auxiliaries for scouting, harassment, and pursuit.\n\nEach Wuhuan tribe has its own chieftain and follows only those it trusts. Send envoys to cultivate these leaders, agree upon terms of service, and provide grain and fodder. Then their riders can follow you beyond the frontier whenever called."
 hd_establish_wuhuan_qicong_decision_tooltip:0 "Agree on terms with the Wuhuan tribes to recruit cavalry auxiliaries"
 hd_establish_wuhuan_qicong_decision_confirm:0 "Make a pact with the Wuhuan!"
 hd_establish_wuhuan_qicong_decision_effect:0 "You can now recruit Wuhuan Cavalry Auxiliaries as your [men_at_arms|E]. Recruitment and expansion require a county you still personally hold in the old Wuhuan lands from Shanggu to Liaodong and a settled local population. This system is tied to your [primary_title|E] and passes with it."
 hd_maa_source.0005.t:0 "The Wuhuan cavalry has run out of recruits."
 hd_maa_source.0005.desc:0 "I can no longer recruit tribal riders from the former territory of the Wuhuan. Existing Wuhuan cavalry units will continue to serve, but recruitment or expansion is not possible until troop sources are restored."
 hd_maa_source.0005.a:0 "The current troops can still be maintained."
 hd_maa_source.0006.t:0 "Wuhuan cavalry recruitment restored"
 hd_maa_source.0006.desc:0 "I have once again gained control over sufficient manpower from the former lands of the Wuhuan. Recruitment and expansion of the Wuhuan Cavalry Corps have been restored."
 hd_maa_source.0006.a:0 "I can recruit them again."
 hd_jizhou_qiangnu:0 "Jizhou Heavy Crossbow"
 hd_jizhou_qiangnu_flavor:0 "#F Jizhou infantry train to span powerful crossbows with their feet. Their crossbowmen fire in alternating ranks, sending bolts like swarms of locusts; even armored troops charging their lines struggle to draw near.#!"
 hd_establish_jizhou_qiangnu_decision:0 "Establish the Jizhou Heavy Crossbow System"
 hd_establish_jizhou_qiangnu_decision_desc:0 "Jizhou is broad and populous, with many trained soldiers skilled in powerful Dahuang and Juezhang crossbows. Such weapons demand great strength and years of practice; ranks of crossbowmen firing in turns can halt charging armored cavalry. When Yu Xu defended Wudu, he first showed weakness with lighter crossbows to lure the Qiang closer, then loosed heavy volleys that brought down all they struck. The crossbow's strength lies in disciplined command.\n\nRecord Jizhou's crossbowmen on military rolls and equip them with mechanisms and bolts. Use your reputation to invite veteran marksmen to train younger recruits, and the Jizhou Heavy Crossbowmen can endure through the generations."
 hd_establish_jizhou_qiangnu_decision_tooltip:0 "Record Jizhou's crossbowmen on military rolls for recruitment"
 hd_establish_jizhou_qiangnu_decision_confirm:0 "Enroll the Heavy Crossbowmen!"
 hd_establish_jizhou_qiangnu_decision_effect:0 "You can now recruit Jizhou Heavy Crossbowmen as your [men_at_arms|E]. Recruitment and expansion require a county you still personally hold in Jizhou and a settled local population. This system is tied to your [primary_title|E] and passes with it."
 hd_maa_source.0007.t:0 "The strong-archery troops of Jizhou have run out of recruits."
 hd_maa_source.0007.desc:0 "I can no longer requisition crossbowmen and military households from Jizhou. Existing heavy crossbow units in Jizhou will remain loyal, but recruitment or expansion is prohibited until troop replenishment is restored."
 hd_maa_source.0007.a:0 "The current troops can still be maintained."
 hd_maa_source.0008.t:0 "Jizhou Heavy Crossbowman Recruitment Restored"
 hd_maa_source.0008.desc:0 "I have once again secured sufficient manpower from Jizhou, and the recruitment and expansion of Jizhou's heavy crossbowmen have been restored."
 hd_maa_source.0008.a:0 "I can recruit them again."
 hd_xiandeng_ruishi:0 "Elite Assault Vanguard"
 hd_xiandeng_ruishi_flavor:0 "#F Every siege and assault needs men to lead the way. Armored and shield-bearing, these Jizhou elites brave arrows and stones to climb the walls first or break into enemy lines, seeking rewards for being first to the assault.#!"
 hd_establish_xiandeng_ruishi_decision:0 "Establish the First-to-the-Wall Elites"
 hd_establish_xiandeng_ruishi_decision_desc:0 "At every siege, someone volunteers to be first over the walls. Once arrows and stones begin to fall, few can follow him to the top. Jizhou's people are fierce, and its bold men prize courage in the face of death: an ideal place to recruit such soldiers.\n\nSelect men willing to fight and register them in squads, so comrades know and trust one another with their lives. Your reputation must guarantee this system. When rewards are offered, Jizhou's elite warriors will then come to enlist."
 hd_establish_xiandeng_ruishi_decision_tooltip:0 "Establish the First-to-the-Wall Elites in Jizhou for recruitment"
 hd_establish_xiandeng_ruishi_decision_confirm:0 "Establish the First-to-the-Wall Corps!"
 hd_establish_xiandeng_ruishi_decision_effect:0 "You can now recruit First-to-the-Wall Elites as your [men_at_arms|E]. Recruitment and expansion require a county you still personally hold in Jizhou and a settled local population. This system is tied to your [primary_title|E] and passes with it."
 hd_maa_source.0009.t:0 "The source of the vanguard elite soldiers has been cut off."
 hd_maa_source.0009.desc:0 "I can no longer conscript brave warriors from Jizhou. The Xian Deng elite troops will continue to serve, but recruitment or expansion is not possible until troop replenishment is restored."
 hd_maa_source.0009.a:0 "The current troops can still be maintained."
 hd_maa_source.0010.t:0 "First Ascent Sharp Soldiers Source Recovery"
 hd_maa_source.0010.desc:0 "I have once again secured sufficient manpower from Jizhou, and the recruitment and expansion of the Xian Deng Ruishi have been restored."
 hd_maa_source.0010.a:0 "I can recruit them again."
 hd_qingzhou_bing:0 "Qingzhou Soldiers"
 hd_qingzhou_bing_flavor:0 "#F Coastal Qingzhou has a fierce population that bands together for protection in times of turmoil. Its men fight boldly but are hard to discipline; with firm orders and proper organization, they become a formidable infantry force.#!"
 hd_establish_qingzhou_bing_decision:0 "Establish the military system of the Qingzhou Army"
 hd_establish_qingzhou_bing_decision_desc:0 "Qingzhou lies beside the sea in the old lands of Qi. Its fields are narrow and its population dense; famine quickly drives many into exile. The young men are bold and quarrelsome, gathering in fortified camps to protect one another during disorder. Their commands may be confused, but their courage rivals that of any province.\n\nScattered, such men become bandits; gathered, they become soldiers. Muster the able-bodied, organize their ranks, and make clear whose orders they obey and where they receive grain. They can become useful infantry, provided your prestige is great enough to win their willing service."
 hd_establish_qingzhou_bing_decision_tooltip:0 "Record Qingzhou's able-bodied men on military rolls for recruitment"
 hd_establish_qingzhou_bing_decision_confirm:0 "Enroll the Qingzhou Troops!"
 hd_establish_qingzhou_bing_decision_effect:0 "You can now recruit Qingzhou Troops as your [men_at_arms|E]. Recruitment and expansion require a county you still personally hold in Qingzhou and a settled local population. This system is tied to your [primary_title|E] and passes with it."
 hd_maa_source.0011.t:0 "The source of the Qingzhou soldiers has been cut off."
 hd_maa_source.0011.desc:0 "I can no longer conscript military households and able-bodied men from Qingzhou. Existing Qingzhou troops will continue to serve, but recruitment or expansion is prohibited until the troop reserves are restored."
 hd_maa_source.0011.a:0 "The current troops can still be maintained."
 hd_maa_source.0012.t:0 "Qingzhou Army Recruitment Restored"
 hd_maa_source.0012.desc:0 "I have once again gained control over sufficient manpower from the Qingzhou troops, and their recruitment and expansion have been restored."
 hd_maa_source.0012.a:0 "I can recruit them again."
 hd_liujun_liangjiazi:0 "Sons of Good Families from the Six Commanderies"
 hd_liujun_liangjiazi_flavor:0 "#F Longxi, Tianshui, Anding, Beidi, Shangjun and Xihe lie close to frontier peoples. Their inhabitants prize strength and military readiness, especially mounted archery. Many of the Han's Feathered Forest and Qimen guards were chosen here, and many renowned generals came from these six commanderies.#!"
 hd_establish_liujun_liangjiazi_decision:0 "Establish the Six Commanderies' Good-Family Troops"
 hd_establish_liujun_liangjiazi_decision_desc:0 "The Six Commanderies lie near the Qiang and Hu. Their households are accustomed to war, and their sons train in riding and archery from childhood. The court often selects its Yulin and Qimen guards from these respectable families. Zhao Chongguo entered the Yulin in this way before becoming renowned among the western Qiang.\n\nMen of respectable birth will not rank themselves with street ruffians; recruiting them requires honor. Invite them personally, record their names, and provide saddles, horses, bows, and arrows. The sons of the Six Commanderies will then eagerly join your army."
 hd_establish_liujun_liangjiazi_decision_tooltip:0 "Record the Good-Family Troops of the Six Commanderies on military rolls for recruitment"
 hd_establish_liujun_liangjiazi_decision_confirm:0 "Enroll the Good-Family Troops!"
 hd_establish_liujun_liangjiazi_decision_effect:0 "You can now recruit Six Commanderies' Good-Family Troops as your [men_at_arms|E]. Recruitment and expansion require a county you still personally hold in the Six Commanderies and a settled local population. This system is tied to your [primary_title|E] and passes with it."
 hd_maa_source.0013.t:0 "The recruitment of soldiers from the six prefectures' gentry families has been cut off."
 hd_maa_source.0013.desc:0 "I can no longer recruit noble families' cavalrymen from the six commanderies of Longxi. The existing nobles from these six commanderies will still serve, but recruitment or expansion is prohibited until troop replenishment is restored."
 hd_maa_source.0013.a:0 "The current troops can still be maintained."
 hd_maa_source.0014.t:0 "Recruitment of soldiers from the six prefectures' gentry families has been restored."
 hd_maa_source.0014.desc:0 "I have once again secured sufficient manpower from the six commanderies of Longxi, and recruitment and expansion of the Liangjiazi (well-born families) have been restored."
 hd_maa_source.0014.a:0 "I can recruit them again."
 hd_huangzhong_yicong:0 "Huangzhong Yi Cong"
 hd_huangzhong_yicong_flavor:0 "#F The Yuezhi peoples of Huangzhong submit to the Han and are known as volunteer auxiliaries. Familiar with the mountains and rivers of Hehuang and skilled with horse and bow, they often join Han campaigns against the Qiang. Dispersed, they scout the enemy; massed, they can break enemy lines.#!"
 hd_establish_huangzhong_yicong_decision:0 "Establish the system of Huangzhong Volunteer Army"
 hd_establish_huangzhong_yicong_decision_desc:0 "Huangzhong lies between the Yellow and Huang rivers, where descendants of the Yuezhi live among Qiang tribes. The Hu riders who submitted to the Han and served its armies for generations are known as companions. They know every patch of water and pasture: where horses can drink and where a troop can turn, often better than any map.\n\nThese companions value promises and honor. Reach agreements with their chieftains, promise rewards, and pledge your reputation. Then the Huangzhong Volunteers will ride beneath your banner."
 hd_establish_huangzhong_yicong_decision_tooltip:0 "Agree on service with the Hu volunteers of Huangzhong for recruitment"
 hd_establish_huangzhong_yicong_decision_confirm:0 "Make a pact with the Volunteers!"
 hd_establish_huangzhong_yicong_decision_effect:0 "You can now recruit Huangzhong Volunteers as your [men_at_arms|E]. Recruitment and expansion require a county you still personally hold in Huangzhong and a settled local population. This system is tied to your [primary_title|E] and passes with it."
 hd_maa_source.0015.t:0 "The supply of Huangzhong volunteer soldiers has been cut off."
 hd_maa_source.0015.desc:0 "I can no longer conscript Qiang and Hu auxiliaries from Huangzhong. Existing Huangzhong auxiliaries will continue to serve, but recruitment or expansion is prohibited until troop replenishment is restored."
 hd_maa_source.0015.a:0 "The current troops can still be maintained."
 hd_maa_source.0016.t:0 "Huangzhong volunteer troops recruitment restored"
 hd_maa_source.0016.desc:0 "I have once again gained control over sufficient troops from the Huangzhong region, and recruitment and expansion of the Huangzhong Yizong forces have resumed."
 hd_maa_source.0016.a:0 "I can recruit them again."
 hd_bandun_congbing:0 "Bandun Cong Troops"
 hd_bandun_congbing_flavor:0 "#F The Bandun tribes of Ba Commandery use wooden boards as shields. Fierce and brave, they sing and dance before battle. Emperor Gaozu used them to reconquer the Three Qin, and Han armies often relied on them to repel Qiang incursions into Hanchuan, earning them the name Divine Troops.#!"
 hd_establish_bandun_congbing_decision:0 "Establish the Board-Shield Cong Troops"
 hd_establish_bandun_congbing_decision_desc:0 "The Board-Shield people of Ba Commandery's mountains fight with wooden shields and are renowned for strength and courage. They pay cong money instead of taxes and labor dues, and are therefore also called the Cong people. The court often calls them up against Qiang rebellions; they cross difficult terrain as though it were level ground.\n\nThey remember old kindnesses and old grievances, rebelling when the court treats them poorly. Offer generous rewards and use your reputation to win their chieftains. Their sons can then be registered as Cong troops and summoned whenever needed."
 hd_establish_bandun_congbing_decision_tooltip:0 "Record the Board-Shield people of Ba on military rolls for recruitment"
 hd_establish_bandun_congbing_decision_confirm:0 "Enroll the Cong Troops!"
 hd_establish_bandun_congbing_decision_effect:0 "You can now recruit Board-Shield Cong Troops as your [men_at_arms|E]. Recruitment and expansion require a county you still personally hold in Ba and a settled local population. This system is tied to your [primary_title|E] and passes with it."
 hd_maa_source.0017.t:0 "The source of the Banqun troops has been cut off."
 hd_maa_source.0017.desc:0 "I can no longer conscript the Chong people military households from Ba Commandery. Existing Ban Shen Chong troops will continue to serve, but recruitment or expansion is not possible until manpower reserves are restored."
 hd_maa_source.0017.a:0 "The current troops can still be maintained."
 hd_maa_source.0018.t:0 "Restoration of the source of troops for the Banshen Cong soldiers"
 hd_maa_source.0018.desc:0 "I have once again secured sufficient manpower from Ba Commandery, and the recruitment and expansion of Ban Shen Chong troops have been restored."
 hd_maa_source.0018.a:0 "I can recruit them again."
 hd_wudang_feijun:0 "Wudang Flying Army"
 hd_wudang_feijun_flavor:0 "#F Amid Nanzhong's deep mountains and dense forests, hardy tribal soldiers cross ridges as easily as level ground. Skilled with bows, crossbows and short weapons, they sweep aside opposition and are called the Flying Army. Rough ground where great armies cannot deploy is where they choose to fight.#!"
 hd_establish_wudang_feijun_decision:0 "Establish the military system of the Wu Dang Flying Army"
 hd_establish_wudang_feijun_decision_desc:0 "Nanzhong lies far south of Yizhou, amid high mountains, deep thickets, and mists of miasma that linger all year. Large armies from the Central Plains often cannot even form ranks there. Local warriors are accustomed to narrow paths, climbing cliffs with crossbows on their backs and moving as swiftly as flight.\n\nSelect their strongest men, organize them, and provide food and weapons. You will gain troops able to fight across the mountains rather than halt helplessly before them. The tribes of Nanzhong respect strength; you must have sufficient fame and authority to win their allegiance."
 hd_establish_wudang_feijun_decision_tooltip:0 "Establish the Wudang Flying Army in Nanzhong for recruitment"
 hd_establish_wudang_feijun_decision_confirm:0 "Establish the Flying Army!"
 hd_establish_wudang_feijun_decision_effect:0 "You can now recruit Wudang Flying Army troops as your [men_at_arms|E]. Recruitment and expansion require a county you still personally hold in Nanzhong and a settled local population. This system is tied to your [primary_title|E] and passes with it."
 hd_maa_source.0019.t:0 "The Wudang Flying Army has run out of recruits."
 hd_maa_source.0019.desc:0 "I can no longer conscript mountain troops from the Southern Regions. The Wu Dang Flying Army remains loyal, but recruitment and expansion are prohibited until troop replenishment is restored."
 hd_maa_source.0019.a:0 "The current troops can still be maintained."
 hd_maa_source.0020.t:0 "Wudang Flying Army Recruitment Restored"
 hd_maa_source.0020.desc:0 "I have once again secured sufficient manpower from the Southern Regions, and recruitment and expansion of the Wu Dang Fei Jun are now restored."
 hd_maa_source.0020.a:0 "I can recruit them again."
 hd_wuxi_manbing:0 "Wuxi Tribal Soldiers"
 hd_wuxi_manbing_flavor:0 "#F Among Wuling's five streams, tribal peoples live beside mountains and waters, accustomed to moving unseen through forests and ambushing beside streams. General Who Calms the Waves Ma Yuan reached this region on his southern campaign, succumbed to its pestilential climate and never returned.#!"
 hd_establish_wuxi_manbing_decision:0 "Establish the Five Creeks Man Troops"
 hd_establish_wuxi_manbing_decision_desc:0 "Five streams wind among Wuling Commandery's mountains, with roads following their bends. A single ridge can keep the sound of drums from reaching the next valley. When Ma Yuan, General Who Calms the Waves, marched against the Five Creeks, his army became trapped in the valleys, and he died of illness among his troops.\n\nRather than fight the tribes in these valleys, take their men into your service. Send envoys to agree upon terms, command respect with your authority, and offer generous rewards. Registered in your army, the Five Creeks Man troops can guide your forces and open the way."
 hd_establish_wuxi_manbing_decision_tooltip:0 "Agree on terms with the Five Creeks tribes to recruit their troops"
 hd_establish_wuxi_manbing_decision_confirm:0 "Make a pact with the Five Creeks!"
 hd_establish_wuxi_manbing_decision_effect:0 "You can now recruit Five Creeks Man Troops as your [men_at_arms|E]. Recruitment and expansion require a county you still personally hold in Wuling's Five Creeks and a settled local population. This system is tied to your [primary_title|E] and passes with it."
 hd_maa_source.0021.t:0 "The source of the Five Streams Miao troops has been cut off."
 hd_maa_source.0021.desc:0 "I can no longer conscript tribal soldiers from the Wu Ling Five Creeks. The existing Five Creek Miao troops will continue to serve, but recruitment or expansion is prohibited until troop sources are restored."
 hd_maa_source.0021.a_keep:0 "The current troops can still be maintained."
 hd_maa_source.0022.t:0 "Five Streams Miao Troops Recruitment Restored"
 hd_maa_source.0022.desc:0 "I have once again gained control over sufficient manpower from the Wu Ling Five Creeks, and recruitment and expansion of the Five Creek barbarian troops have been restored."
 hd_maa_source.0022.a:0 "I can recruit them again."
 hd_shanyue_jiashi:0 "Armored Shanyue Infantry"
 hd_shanyue_jiashi_flavor:0 "#F The Shanyue shelter in rugged mountains and refuse royal taxes. They mine copper and iron there and forge their own armor and weapons. Once subdued, their strongest men are enrolled in the army, armored and accustomed to fighting among forests and ridges.#!"
 hd_establish_shanyue_jiashi_decision:0 "Establish the Shanyue Armored Troops"
 hd_establish_shanyue_jiashi_decision_desc:0 "Mountains stretch for hundreds of li across Jiangdong's Danyang, Kuaiji, and Yuzhang commanderies. Clans inhabit them together, refusing labor dues and taxes. When imperial troops attack, they withdraw into the deep mountains and defend difficult ground; once the army leaves, they return.\n\nMany Shanyue men are strong and eager to fight. Secure their surrender, enter them on military rolls, and give them armor and weapons: they can become formidable troops in wooded hills. Their loyalty will take time to win. You must combine rewards and authority, using your reputation to overawe their clan leaders."
 hd_establish_shanyue_jiashi_decision_tooltip:0 "Record the surrendered Shanyue on military rolls for recruitment"
 hd_establish_shanyue_jiashi_decision_confirm:0 "Enroll the Shanyue!"
 hd_establish_shanyue_jiashi_decision_effect:0 "You can now recruit Shanyue Armored Troops as your [men_at_arms|E]. Recruitment and expansion require a county you still personally hold in Jiangdong's Shanyue commanderies and a settled local population. This system is tied to your [primary_title|E] and passes with it."
 hd_maa_source.0023.t:0 "The supply line of the Shanyue soldiers has been cut off."
 hd_maa_source.0023.desc:0 "I can no longer conscript Mountain Yue troops from the various Mountain Yue commanderies. Existing Mountain Yue soldiers will continue to serve, but recruitment or expansion of forces is prohibited until troop replenishment is restored."
 hd_maa_source.0023.a:0 "The current troops can still be maintained."
 hd_maa_source.0024.t:0 "Shanyue Armor Soldier Source Restoration"
 hd_maa_source.0024.desc:0 "I have once again gained control over sufficient manpower from the Yue Mountain commanderies; recruitment and expansion of the Yue Mountain armored troops have been restored."
 hd_maa_source.0024.a:0 "I can recruit them again."
 hd_danyang_jingbing:0 "Elite Soldiers of Danyang"
 hd_danyang_jingbing_flavor:0 "#F Danyang's rugged hills breed resolute, vigorous people who prize strength and train for war. Its soldiers are often held up as the finest, and when provinces or commanderies face emergencies, envoys come here to recruit them.#!"
 hd_establish_danyang_jingbing_decision:0 "Establish the Dan Yang Elite Troops System"
 hd_establish_danyang_jingbing_decision_desc:0 "Danyang lies between Wu and Yue, with many mountains and little farmland. Its people gather copper in the hills and hunt in the forests, growing strong and hardy. Young men prize honor above their lives: quick to draw blades in quarrels, they are also the most willing to risk death in battle.\n\nDanyang's soldiers have a great reputation, but reputation alone cannot defend a camp. Establish recruitment, register the troops, provide regular pay, and use your standing to invite local heroes to command them. When you need infantry, you will no longer have to beg for recruits at the last moment."
 hd_establish_danyang_jingbing_decision_tooltip:0 "Establish recruitment in Danyang to prepare for musters"
 hd_establish_danyang_jingbing_decision_confirm:0 "Establish the Danyang recruitment system!"
 hd_establish_danyang_jingbing_decision_effect:0 "You can now recruit Danyang Elite Troops as your [men_at_arms|E]. Recruitment and expansion require a county you still personally hold in Danyang and a settled local population. This system is tied to your [primary_title|E] and passes with it."
 hd_maa_source.0025.t:0 "The source of elite troops from Danyang has been cut off."
 hd_maa_source.0025.desc:0 "I can no longer conscript mountain people soldiers from Dan Yang. Existing elite troops of Dan Yang will still serve, but recruitment or expansion is not possible until the troop source is restored."
 hd_maa_source.0025.a:0 "The current troops can still be maintained."
 hd_maa_source.0026.t:0 "Recovery of Man-Dangyuan Elite Troop Recruitment Pool"
 hd_maa_source.0026.desc:0 "I have once again secured sufficient manpower from the Dan Yang region; recruitment and expansion of elite Dan Yang troops have been restored."
 hd_maa_source.0026.a:0 "I can recruit them again."
 hd_fuling_liannushi:0 "Fuling Repeating Crossbowmen"
 hd_fuling_liannushi_flavor:0 "#F Fuling's mountain people are blunt and brave, accustomed to hunting with bows. Their repeating crossbows fire in relays, keeping bolts flying without pause. At mountain passes and narrow roads, enemies find no opening to approach.#!"
 hd_establish_fuling_liannushi_decision:0 "Establish the Fuling Repeating Crossbowmen System"
 hd_establish_fuling_liannushi_decision_desc:0 "Fuling lies southeast of Ba Commandery, where the river winds through the mountains and narrow paths cling to sheer cliffs on either bank. The mountain people have hunted with crossbows in the forests for generations; a crossbow is as familiar in their hands as a hoe in a farmer's.\n\nYet these intricate weapons need skilled hands to maintain them, and their bolts are spent so quickly that craftsmen must keep making more. Use your standing to gather Fuling's skilled marksmen, enter them on the military rolls, and secure a supply of crossbows and bolts. Only then will these repeating crossbowmen be ready whenever you call."
 hd_establish_fuling_liannushi_decision_tooltip:0 "Establish a repeating crossbowmen system in Fuling to prepare for recruitment."
 hd_establish_fuling_liannushi_decision_confirm:0 "Establish the repeating crossbowmen system!"
 hd_establish_fuling_liannushi_decision_effect:0 "You can now recruit Fuling Repeating Crossbowmen as your [men_at_arms|E]. Recruitment and expansion require a county you still personally hold in Fuling and a settled local population. This system is tied to your [primary_title|E] and passes with it."
 hd_maa_source.0027.t:0 "Fuling Crossbowmen Unit Source Depleted"
 hd_maa_source.0027.desc:0 "I can no longer requisition crossbowmen and craftsmen from Fuling. Existing Fuling Crossbowmen will continue to serve, but recruitment or expansion is prohibited until troop replenishment is restored."
 hd_maa_source.0027.a:0 "The current troops can still be maintained."
 hd_maa_source.0028.t:0 "Fuling Crossbowman Source Restoration"
 hd_maa_source.0028.desc:0 "I have once again secured sufficient manpower from Fuling; the recruitment and expansion of Fuling Crossbowmen have been restored."
 hd_maa_source.0028.a:0 "I can recruit them again."
 hd_qiang_qi:0 "Qiang Cavalry"
 hd_qiang_qi_flavor:0 "#F The western Qiang peoples are scattered across Longyou and Hehuang, living by herding and hunting. Their cavalry comes and goes like the wind, forming ranks when gathered and proving hard to pursue when scattered. Liangzhou strongmen often rely on them as their fighting arm.#!"
 hd_establish_qiang_qi_decision:0 "Establish the Qiang Cavalry Regiment System"
 hd_establish_qiang_qi_decision_desc:0 "In the valleys of Jincheng and Longxi, the Qiang tribes each hold their own lands and follow water and pasture with their herds. Every man knows how to ride. They arrive in clouds of dust and retreat into distant valleys; infantry pursuing them often cannot even tell where they have gone.\n\nMake a pact for military service with the Qiang tribes, promise rewards, and enroll their horsemen, and you will have cavalry that can match the enemy for speed. The Qiang respect courage and value good faith. Your own standing must guarantee this agreement."
 hd_establish_qiang_qi_decision_tooltip:0 "Make a pact for military service with the Qiang tribes of Longyou to prepare for recruiting Qiang cavalry."
 hd_establish_qiang_qi_decision_confirm:0 "Make a pact with the Qiang tribes!"
 hd_establish_qiang_qi_decision_effect:0 "You can now recruit Qiang Cavalry as your [men_at_arms|E]. Recruitment and expansion require a county you still personally hold in the Qiang lands of Jincheng and Longxi and a settled local population. This system is tied to your [primary_title|E] and passes with it."
 hd_maa_source.0029.t:0 "The Qiang cavalry supply has been cut off."
 hd_maa_source.0029.desc:0 "I can no longer requisition tribal riders from Qiang settlements. Existing Qiang cavalry will remain in service, but recruitment or expansion is prohibited until troop sources are restored."
 hd_maa_source.0029.a:0 "The current troops can still be maintained."
 hd_maa_source.0030.t:0 "Qiang Cavalry Source Restored"
 hd_maa_source.0030.desc:0 "I have once again gained control over sufficient Qiang-inhabited territories for recruitment; the recruitment and expansion of Qiang cavalry units have been restored."
 hd_maa_source.0030.a:0 "I can recruit them again."
 hd_bingzhou_bianqi:0 "Bingzhou Border Cavalry"
 hd_bingzhou_bianqi_flavor:0 "#F Bingzhou borders the Xiongnu and Xianbei to the north. Its frontier people grow up in the saddle, know the border roads and are used to swift pursuits. In times of trouble, the lords compete to recruit Bingzhou's formidable cavalry.#!"
 hd_establish_bingzhou_bianqi_decision:0 "Establish the Bingzhou Border Cavalry System"
 hd_establish_bingzhou_bianqi_decision_desc:0 "Yanmen, Yunzhong and Shuofang lie in the far north of Bingzhou. Beacon towers stand within sight of one another, and Hu horsemen often raid the frontier. The sons of these border commanderies grow up hearing the alarms. Riding comes as naturally as walking; they know when to spur their mounts and when to hold the reins and conserve their strength.\n\nEstablish these border riders as a standing force, and your army will no longer have to wait for its infantry before receiving every report. Recruitment, fodder and military rolls need lasting management; a brief offer of lavish rewards cannot sustain the force. Draw frontier heroes to you through your standing, and allocate money and provisions to establish the system. Then Bingzhou's border cavalry can remain at your service."
 hd_establish_bingzhou_bianqi_decision_tooltip:0 "Enroll riders from Bingzhou's border commanderies to prepare for recruitment."
 hd_establish_bingzhou_bianqi_decision_confirm:0 "Enter the border cavalry on the rolls!"
 hd_establish_bingzhou_bianqi_decision_effect:0 "You can now recruit Bingzhou Border Cavalry as your [men_at_arms|E]. Recruitment and expansion require a county you still personally hold in Bingzhou's border commanderies and a settled local population. This system is tied to your [primary_title|E] and passes with it."
 hd_maa_source.0031.t:0 "The supply line of the border cavalry in Bingzhou has been cut off."
 hd_maa_source.0031.desc:0 "I can no longer requisition border prefecture cavalry from Bingzhou. Existing Bingzhou border cavalry will continue to serve, but recruitment or expansion is not possible until troop sources are restored."
 hd_maa_source.0031.a:0 "The current troops can still be maintained."
 hd_maa_source.0032.t:0 "Bingzhou Border Cavalry Source Restored"
 hd_maa_source.0032.desc:0 "I have once again secured sufficient manpower from Bingzhou, and the recruitment and expansion of Bingzhou border cavalry have been restored."
 hd_maa_source.0032.a:0 "I can recruit them again."
 hd_tengjia:0 "Vine-Armored Soldier"
 hd_tengjia_flavor:0 "#F The tribes of Yongchang soak mountain vines in oil, dry them repeatedly and weave them into armor. Light and tough, it resists blades and arrows and keeps its wearers afloat. Yet rattan armor is especially vulnerable to fire and cannot withstand the bitter cold of the north.#!"
 hd_establish_tengjia_decision:0 "Establish the system of vine-armored soldiers"
 hd_establish_tengjia_decision_desc:0 "Yongchang lies far to the west of Nanzhong, in the former lands of the Ailao peoples. Old vines abound in the mountains, and the local peoples weave them into armor. Wearing it, they move through dense forests far more nimbly than soldiers from the Central Plains clad in iron.\n\nAn unusual suit of armor alone does not make a man impervious to blades and spears. What matters is whether the armored ranks can still advance and retreat at a command. Recruit local warriors in Yongchang, enter them on the military rolls, equip them with rattan armor, and use your standing to win over their tribal leaders. Only then can these soldiers serve you."
 hd_establish_tengjia_decision_tooltip:0 "Establish a rattan-armored troop system in Yongchang to prepare for recruitment."
 hd_establish_tengjia_decision_confirm:0 "Establish the rattan armor system!"
 hd_establish_tengjia_decision_effect:0 "You can now recruit Rattan-Armored Troops as your [men_at_arms|E]. Recruitment and expansion require a county you still personally hold in Yongchang and a settled local population. This system is tied to your [primary_title|E] and passes with it."
 hd_maa_source.0033.t:0 "Bamboo-Armored Soldiers' Recruitment Cut Off"
 hd_maa_source.0033.desc:0 "I can no longer requisition the Rattan Armor Army from Southern Zhong. Existing Rattan Armor troops will remain loyal, but recruitment or expansion is prohibited until troop replenishment is restored."
 hd_maa_source.0033.a:0 "The current troops can still be maintained."
 hd_maa_source.0034.t:0 "Rattan Armor Troop Recruitment Restored"
 hd_maa_source.0034.desc:0 "I have once again secured sufficient manpower from the Southern Regions, and the recruitment and expansion of Mantra-Clad Soldiers have been restored."
 hd_maa_source.0034.a:0 "I can recruit them again."
 hd_maa_training_no_valid_trainer:0 "No qualified trainer is available among your subordinates; the training must be abandoned."
 hd_debug_prepare_youzhou_tuqi_decision:0 "(Debug) Establish the Youzhou Assault Cavalry System"
 hd_debug_prepare_youzhou_tuqi_decision_desc:0 "Establish the Youzhou Cavalry Corps system regardless of normal conditions, and supplement the control power required for the direct-controlled troop recruitment test."
 hd_debug_prepare_youzhou_tuqi_decision_tooltip:0 "Used to test the recruitment, expansion, and troop source changes of the Youzhou Cavalry."
 hd_debug_prepare_youzhou_tuqi_decision_effect:0 "The prerequisite conditions for the Youzhou Cavalry have been established."
 hd_debug_train_xianzhenying_decision:0 "(Debug) Drill the Formation-Breaking Camp"
 hd_debug_train_xianzhenying_decision_desc:0 "With me as the trainer, directly enter the Formation-Breaking Camp training event."
 hd_debug_train_xianzhenying_decision_tooltip:0 "Used to test the investment in and formation of the Formation-Breaking Camp."
 hd_xianzhenying:0 "Formation-Breaking Camp"
 hd_xianzhenying_flavor:0 "#F Gao Shun commanded only a small force, but its armor and equipment were finely made and orderly. Every assault broke through, earning it the name Formation-Breaking Camp. With heavy armor shoulder to shoulder and flawless discipline, it is a blade for cutting through enemy lines.#!"
 hd_xianzhenying_army:0 "Formation-Breaking Camp"
 hd_train_xianzhenying_decision:0 "Train the Formation-Breaking Corps"
 hd_train_xianzhenying_decision_desc:0 "An army never lacks men who raise their arms and volunteer for battle. It lacks men who can still hear orders behind them after charging into the enemy ranks. Heavy armor, strong shields and sharp blades can all be bought, but making an entire corps advance and retreat as one before the blades takes a skilled commander drilling them day and night.\n\nSuch elite soldiers must be chosen one by one and trained in person; a recruitment notice cannot fill their ranks. Once dismissed, they can only be trained again from the beginning. If you intend to forge a weapon that can break the enemy's formation, first provide its money and supplies."
 hd_train_xianzhenying_decision_tooltip:0 "Choose a capable commander to select and train a Formation-Breaking Corps."
 hd_train_xianzhenying_decision_confirm:0 "Select and train the formation-breakers!"
 hd_maa_training.1000.t:0 "Train the Trap Formation Army"
 hd_maa_training.1000.desc:0 "I have ordered [hd_maa_trainer.GetTitledFirstName] to oversee the training. [hd_maa_trainer.GetSheHe] has already drafted regulations; the more resources invested, the more recruits and equipment will be secured."
 hd_maa_training.1000.a:0 "Recruit Locally (100 gold, 150 prestige)"
 hd_maa_training.1000.b:0 "Generous Rewards for Elite Soldiers (250 Gold, 300 Prestige)"
 hd_maa_training.1000.c:0 "Train with full effort (500 gold, 500 prestige)"
 hd_maa_training.1001.t:0 "The Trapped Formation is established."
 hd_maa_training.1001.desc_tier1:0 "The training was rushed, but I already have between 800 and 1,000 members of the Fallen Camp ready for duty. If they are disbanded, we can only wait until next time to rebuild them through further training."
 hd_maa_training.1001.desc_tier2:0 "The training has gone smoothly, and I have assembled a Battle Array of 900 to 1,200 troops in perfect formation. If they are disbanded now, we will have to wait until the next training session to rebuild them."
 hd_maa_training.1001.desc_tier3:0 "The training has yielded excellent results; the Xian Army now consists of 1,100 to 1,400 soldiers, with their equipment and command signals thoroughly tested."
 hd_maa_training.1001.desc_tier4:0 "This drill was a resounding success; the elite Xian Zhenzheng Division, numbering between 1,300 and 1,500 soldiers, is now arrayed and awaiting orders."
 hd_maa_training.1001.a:0 "First to scale the walls and break the formation."
 hd_hubaoqi:0 "Tiger and Leopard Cavalry"
 hd_hubaoqi_flavor:0 "#F The Cao clan personally commands this elite cavalry, often selecting its soldiers from officers who led a hundred men. Renowned for unmatched valor, they charge in armor, excel at breaking formations on open ground and relentlessly pursue routed armies.#!"
 hd_hubaoqi_army:0 "Tiger and Leopard Cavalry"
 hd_train_hubaoqi_decision:0 "Drill the Tiger and Leopard Cavalry"
 hd_train_hubaoqi_decision_desc:0 "Pursuing beaten soldiers is one thing; riding straight into an enemy formation is another. You intend to choose the boldest of your cavalry and form them into a separate force, with men and horses in heavy armor, ready to break the enemy ranks in a single charge at the decisive moment.\n\nNumbers alone will not suffice when choosing mounts, armor and weapons. Their commander must be a valiant officer who understands warfare and never flinches in battle. Such elite riders must be selected and trained; a recruitment notice cannot expand their ranks. Once dismissed, they must be trained anew."
 hd_train_hubaoqi_decision_tooltip:0 "Choose a valiant commander to select and train Tiger and Leopard Cavalry."
 hd_train_hubaoqi_decision_confirm:0 "Select and train the Tiger and Leopard riders!"
 hd_maa_training.1100.t:0 "Drill the Tiger and Leopard Cavalry"
 hd_maa_training.1100.desc:0 "I have ordered [hd_maa_trainer.GetTitledFirstName] to oversee the training of the Tiger and Leopard Cavalry. [hd_maa_trainer.GetSheHe] has already drafted the regulations; I only await your decision to deploy them."
 hd_maa_training.1100.a:0 "Recruit Locally (100 gold, 150 prestige)"
 hd_maa_training.1100.b:0 "Generous Rewards for Elite Soldiers (250 Gold, 300 Prestige)"
 hd_maa_training.1100.c:0 "Train with full effort (500 gold, 500 prestige)"
 hd_maa_training.1101.t:0 "Tiger and Leopard Cavalry Formed"
 hd_maa_training.1101.desc_tier1:0 "The training was rushed, but I already have between 800 and 1,000 Tiger and Leopard Cavalry ready for duty. If they are disbanded, we can only wait until the next round of training to rebuild them."
 hd_maa_training.1101.desc_tier2:0 "The training has proceeded smoothly, and I now possess 900 to 1,200 Tiger and Leopard Cavalry units in perfect formation. If they are disbanded, we will have to wait for the next round of training to rebuild them."
 hd_maa_training.1101.desc_tier3:0 "The training has yielded excellent results; the Tiger and Leopard Cavalry, numbering between 1,100 and 1,400 soldiers, is now fully formed, with their weaponry and commands thoroughly tested."
 hd_maa_training.1101.desc_tier4:0 "This drill was a resounding success; 1,300 to 1,500 elite Tiger and Leopard Cavalry are now arrayed and awaiting orders."
 hd_maa_training.1101.a:0 "Charge forward to secure victory."
 hd_baier:0 "White-Plumed Guards"
 hd_baier_flavor:0 "#F Liu Bei's personal guards take their name from their white plume ornaments. Chen Dao commands them and, like Zhao Yun, is renowned for loyalty and courage. They protect their lord in danger and never lightly leave their assigned formation.#!"
 hd_baier_army:0 "White-Plumed Guards"
 hd_train_baier_decision:0 "Train the White Feathers"
 hd_train_baier_decision_desc:0 "Everyone wants to stand beneath the banner and receive a reward. When the enemy draws near, those who will still hold their ground are the men you can truly use. You need an armored personal guard that can steady the battle line and protect its comrades on dangerous roads.\n\nEntrust this task to a brave, resolute commander skilled in defense, who will select and train men from the army. A personal guard needs quality rather than numbers. Each man must be chosen individually; their ranks cannot be filled through public recruitment. Once dismissed, they must be trained again from the beginning."
 hd_train_baier_decision_tooltip:0 "Choose a loyal and brave commander to select and train the White Feather Guard."
 hd_train_baier_decision_confirm:0 "Select and train the White Feather Guard!"
 hd_maa_training.1200.t:0 "Train the White Feathers"
 hd_maa_training.1200.desc:0 "I have ordered [hd_maa_trainer.GetTitledFirstName] to oversee the training of the Baife. [hd_maa_trainer.GetSheHe] has already drafted the regulations and awaits my decision to implement them."
 hd_maa_training.1200.a:0 "Recruit Locally (100 gold, 150 prestige)"
 hd_maa_training.1200.b:0 "Generous Rewards for Elite Soldiers (250 Gold, 300 Prestige)"
 hd_maa_training.1200.c:0 "Train with full effort (500 gold, 500 prestige)"
 hd_maa_training.1201.t:0 "White Fei Formed Army"
 hd_maa_training.1201.desc_tier1:0 "The training was rushed, but I already have between 800 and 1,000 Baimao troops available for duty. If they are disbanded, we can only wait until the next round of training to rebuild them."
 hd_maa_training.1201.desc_tier2:0 "The training has proceeded smoothly, and I have secured 900 to 1,200 Bai Fei soldiers with perfectly formed formations. If they are disbanded now, we will have to wait until the next training cycle to rebuild their ranks."
 hd_maa_training.1201.desc_tier3:0 "Training results are excellent; 1,100 to 1,400 Bai Fei soldiers have been formed into a unit, and their equipment and commands have proven reliable."
 hd_maa_training.1201.desc_tier4:0 "This drill was a resounding success; 1,300 to 1,500 elite Baifei soldiers are now in formation and awaiting orders."
 hd_maa_training.1201.a:0 "Loyal and brave, he can be relied upon."
 hd_jiefanbing:0 "Relief Troops"
 hd_jiefanbing_flavor:0 "#F The Relief Troops are a formidable force of Sun Wu's central army, named for relieving their lord of troubles. At every alarm, trusted generals lead them through the night to reinforce threatened positions, campaigning with ease through forests and marshes.#!"
 hd_jiefanbing_army:0 "Relief Troops"
 hd_train_jiefanbing_decision:0 "Train the Jiefan troops"
 hd_train_jiefanbing_decision_desc:0 "If you gather troops only after an urgent dispatch arrives, the situation at the front may have changed before the ranks are even assembled. You intend to train Jiefan Troops to rush to crises in all directions, able to move and fight freely amid forests and marshes.\n\nTheir commander must be adaptable and skilled in directing troops, and their money and provisions must be secured separately. Such soldiers require special training; ordinary recruitment cannot expand their ranks. Once dismissed, they must wait to be trained again another day."
 hd_train_jiefanbing_decision_tooltip:0 "Choose a capable commander to select and train Jiefan Troops."
 hd_train_jiefanbing_decision_confirm:0 "Select and train the Jiefan Troops!"
 hd_maa_training.1300.t:0 "Train the Jiefan troops"
 hd_maa_training.1300.desc:0 "I have ordered [hd_maa_trainer.GetTitledFirstName] to oversee the training of the Jiefan troops. [hd_maa_trainer.GetSheHe] has already drafted the regulations and is awaiting my decision to deploy them."
 hd_maa_training.1300.a:0 "Recruit Locally (100 gold, 150 prestige)"
 hd_maa_training.1300.b:0 "Generous Rewards for Elite Soldiers (250 Gold, 300 Prestige)"
 hd_maa_training.1300.c:0 "Train with full effort (500 gold, 500 prestige)"
 hd_maa_training.1301.t:0 "Relief Troops Formed"
 hd_maa_training.1301.desc_tier1:0 "The training was rushed, but I already have between 800 and 1,000 Xiefan soldiers available for duty. If they are disbanded, we can only wait until the next round of training to rebuild them."
 hd_maa_training.1301.desc_tier2:0 "The training has proceeded smoothly, and I have assembled 900 to 1,200 well-disciplined Xiefan soldiers. If they are disbanded now, we will have to wait until the next training cycle to rebuild them."
 hd_maa_training.1301.desc_tier3:0 "The training has yielded excellent results; 1,100 to 1,400 Jiefan soldiers have been fully recruited, and their equipment and commands have proven reliable."
 hd_maa_training.1301.desc_tier4:0 "This drill was a resounding success; 1,300 to 1,500 elite Xiefan soldiers are now arrayed and awaiting orders."
 hd_maa_training.1301.a:0 "Adapt to counter the enemy."
 hd_quyi_xiandeng:0 "Qu Yi's First Assault"
 hd_quyi_xiandeng_flavor:0 "#F Qu Yi spent many years in Liangzhou and knew Qiang methods of fighting. At Jieqiao, he ordered his assault troops to crouch beneath their shields, supported by powerful crossbows. They waited until the enemy cavalry drew close before firing together, routing the White Horse Cavalry.#!"
 hd_quyi_xiandeng_army:0 "Qu Yi's First Assault"
 hd_train_quyi_xiandeng_decision:0 "Train Qu Yi's Vanguard"
 hd_train_quyi_xiandeng_decision_desc:0 "If crossbowmen panic when enemy cavalry arrives, even the strongest crossbows can only send their bolts into the mud. You intend to follow Qu Yi's vanguard method and train men who dare to form up before horsemen and wait for the order to shoot: the front ranks crouch beneath shields while strong crossbows support them from behind.\n\nA commander willing to fight and familiar with battles on the plains must oversee this work, and recruitment and equipment costs must be provided separately. This force cannot be recruited regularly simply by raising a banner. Once dismissed, it must be trained again from the beginning."
 hd_train_quyi_xiandeng_decision_tooltip:0 "Choose a capable commander to select and train a vanguard in Qu Yi's manner."
 hd_train_quyi_xiandeng_decision_confirm:0 "Select and train the vanguard!"
 hd_maa_training.1400.t:0 "Train Qu Yi's Vanguard"
 hd_maa_training.1400.desc:0 "I have ordered [hd_maa_trainer.GetTitledFirstName] to oversee the training of Qu Yi's Vanguard. [hd_maa_trainer.GetSheHe] has already drafted the regulations and awaits my decision to deploy them."
 hd_maa_training.1400.a:0 "Recruit Locally (100 gold, 150 prestige)"
 hd_maa_training.1400.b:0 "Generous Rewards for Elite Soldiers (250 Gold, 300 Prestige)"
 hd_maa_training.1400.c:0 "Train with full effort (500 gold, 500 prestige)"
 hd_maa_training.1401.t:0 "Qu Yi Leads the Vanguard in Battle"
 hd_maa_training.1401.desc_tier1:0 "The training was rushed, but I already have between 800 and 1,000 men from Qu Yi's Xian Deng available for duty. If they are disbanded, we can only wait until the next round of training to rebuild them."
 hd_maa_training.1401.desc_tier2:0 "The training has gone smoothly; I have secured 900 to 1,200 well-disciplined Qū Yì Xiāndēng troops. If they are disbanded, we can only wait for the next round of training to rebuild them."
 hd_maa_training.1401.desc_tier3:0 "Training has yielded excellent results; the Qu Yi Xian Deng, numbering between 1,100 and 1,400 soldiers, are now ready for deployment. Their equipment and command signals have been thoroughly tested and proven reliable."
 hd_maa_training.1401.desc_tier4:0 "This drill was a resounding success; 1,300 to 1,500 elite soldiers of Qu Yi's Xian Deng have taken formation and await orders."
 hd_maa_training.1401.a:0 "Heavy crossbows break the cavalry charge."
 hd_suwei_hushi:0 "Guardian Tiger Warriors"
 hd_suwei_hushi_flavor:0 "#F Xu Chu's personal guards are known as Tiger Warriors. Many are bold fighters who followed him when he first rose. Day and night they attend their lord, allowing neither assassins nor unruly soldiers to approach.#!"
 hd_suwei_hushi_army:0 "Guardian Tiger Warriors"
 hd_train_suwei_hushi_decision:0 "Train the Household Tiger Warriors"
 hd_train_suwei_hushi_decision_desc:0 "The guards at your gates stand in orderly ranks, but you do not wish to wait for an assassin to break in before discovering how long they can hold. Household guards need exceptional strength and courage, but also loyalty you can trust. An imposing build alone is no reason to choose a man.\n\nEntrust this task only to a warrior of extraordinary prowess and unwavering loyalty to you, who will choose and drill the men himself. Such guards cannot be gathered by a public recruitment notice. Once dismissed, others must be selected and trained from the beginning."
 hd_train_suwei_hushi_decision_tooltip:0 "Choose a loyal and brave warrior to select and train the Household Tiger Warriors."
 hd_train_suwei_hushi_decision_confirm:0 "Select and train the Household Tiger Warriors!"
 hd_maa_training.1500.t:0 "Train the Guarded Tiger Warriors"
 hd_maa_training.1500.desc:0 "I have ordered [hd_maa_trainer.GetTitledFirstName] to oversee the training of the palace guard tiger warriors. [hd_maa_trainer.GetSheHe] has already drafted the regulations and awaits my decision to implement them."
 hd_maa_training.1500.a:0 "Recruit Locally (100 gold, 150 prestige)"
 hd_maa_training.1500.b:0 "Generous Rewards for Elite Soldiers (250 Gold, 300 Prestige)"
 hd_maa_training.1500.c:0 "Train with full effort (500 gold, 500 prestige)"
 hd_maa_training.1501.t:0 "Guardian Tiger Soldiers Formed in Army"
 hd_maa_training.1501.desc_tier1:0 "The training was rushed, but I already have between 800 and 1,000 veteran guard warriors available for duty. If they are disbanded, we can only wait until the next round of training to rebuild them."
 hd_maa_training.1501.desc_tier2:0 "The training has proceeded smoothly, and I have secured 900 to 1,200 elite guards with disciplined formations. If they are disbanded now, we will have to wait until the next training session to rebuild them."
 hd_maa_training.1501.desc_tier3:0 "Training has yielded excellent results; 1,100 to 1,400 elite guardsmen have been formed into a unit, and their equipment and commands have proven reliable."
 hd_maa_training.1501.desc_tier4:0 "This drill was a resounding success; 1,300 to 1,500 elite guardsmen have taken their positions and await orders."
 hd_maa_training.1501.a:0 "The Imperial Guard is now formed."
 hd_nanman_xiangbing:0 "Southern Barbarian Elephants"
 hd_nanman_xiangbing_flavor:0 "#F Tribes beyond Nanzhong's frontier train elephants for war. Drivers sit upon their backs and drive them into enemy ranks, scattering every formation in their path. Central Plains troops encountering such beasts for the first time are often terrified before battle begins.#!"
 hd_nanman_xiangbing_army:0 "Southern Barbarian Elephants"
 hd_train_nanman_xiangbing_decision:0 "Train the Southern Barbarian Elephant Troops"
 hd_train_nanman_xiangbing_decision_desc:0 "The sight of a war elephant is enough to unsettle enemy ranks, but the real concern is which way it will charge when frightened. Without experienced handlers and a knowledgeable commander, even the grandest elephant may not charge toward the enemy.\n\nThe tribes beyond Nanzhong's frontier train elephants for war. If your realm reaches Nanzhong, you can obtain elephants and handlers there. A commander familiar with mountains and skilled in directing troops must lead them. These unusual troops cannot be recruited and expanded through the ordinary system; once dismissed, they can only be trained again from the beginning."
 hd_train_nanman_xiangbing_decision_tooltip:0 "Choose a capable commander, tame elephants and select soldiers to train Southern Barbarian Elephant Troops."
 hd_train_nanman_xiangbing_decision_confirm:0 "Tame elephants and train the troops!"
 hd_maa_training.1600.t:0 "Train the Southern Barbarian Elephant Troops"
 hd_maa_training.1600.desc:0 "I have ordered [hd_maa_trainer.GetTitledFirstName] to oversee the training of the elephant corps. [hd_maa_trainer.GetSheHe] has already drafted the regulations and awaits my decision to implement them."
 hd_maa_training.1600.a:0 "Recruit Locally (100 gold, 150 prestige)"
 hd_maa_training.1600.b:0 "Generous Rewards for Elite Soldiers (250 Gold, 300 Prestige)"
 hd_maa_training.1600.c:0 "Train with full effort (500 gold, 500 prestige)"
 hd_maa_training.1601.t:0 "Southern Barbarian Elephant Infantry Formed"
 hd_maa_training.1601.desc_tier1:0 "The training was rushed, but I already have between 800 and 1,000 elephants available for duty. If this elephant corps is disbanded, we can only wait until the next training cycle to rebuild them."
 hd_maa_training.1601.desc_tier2:0 "The training has gone smoothly, and I have secured between 900 and 1,200 well-trained war elephants. If this elephant corps is disbanded, we will have to wait for the next round of training to rebuild it."
 hd_maa_training.1601.desc_tier3:0 "The training has yielded excellent results; between 1,100 and 1,400 war elephants are now armored and ready for battle, with their handlers able to follow orders proficiently."
 hd_maa_training.1601.desc_tier4:0 "This drill was a resounding success; 1,300 to 1,500 armored elephant troops are now in formation and awaiting orders."
 hd_maa_training.1601.a:0 "All elephants, take your orders."
 hd_baiyibing:0 "White-Clothed Soldiers"
 hd_baiyibing_flavor:0 "#F When Lu Meng seized Jiangling, he hid elite troops aboard boats and dressed the rowers in white as merchants. Traveling day and night, they captured every beacon guard along the river without raising an alarm. Ever since, lightly equipped raiding troops have often taken white clothing as their emblem.#!"
 hd_baiyibing_army:0 "White-Clothed Soldiers"
 hd_train_baiyibing_decision:0 "Train the White-Clothed Soldiers"
 hd_train_baiyibing_decision_desc:0 "Only when the enemy sees your banners does it know that your army has arrived. If men can first slip close enough to scout the roads and routes of retreat, you need not be constrained at every turn when the armies clash. You intend to train White-Clothed Soldiers to pursue, intercept and provide cover among forests and hills.\n\nTheir commander must be resourceful and cunning, experienced in swift raids. You seek a force that arrives in time and withdraws cleanly, rather than an imposing mass of troops. These soldiers must be specially selected and trained; ordinary recruitment cannot expand their ranks. Once dismissed, they too must be trained again from the beginning."
 hd_train_baiyibing_decision_tooltip:0 "Choose a capable commander to select and train White-Clothed Soldiers."
 hd_train_baiyibing_decision_confirm:0 "Select and train the White-Clothed Soldiers!"
 hd_maa_training.1700.t:0 "Train the White-Clothed Soldiers"
 hd_maa_training.1700.desc:0 "I have ordered [hd_maa_trainer.GetTitledFirstName] to oversee the training of the White Robed soldiers. [hd_maa_trainer.GetSheHe] has already drafted the regulations and awaits my decision to implement them."
 hd_maa_training.1700.a:0 "Recruit Locally (100 gold, 150 prestige)"
 hd_maa_training.1700.b:0 "Generous Rewards for Elite Soldiers (250 Gold, 300 Prestige)"
 hd_maa_training.1700.c:0 "Train with full effort (500 gold, 500 prestige)"
 hd_maa_training.1701.t:0 "White-clad soldiers form an army"
 hd_maa_training.1701.desc_tier1:0 "The training was rushed, but I already have between 800 and 1,000 White Robed soldiers available for duty. If they are disbanded, we can only wait until the next round of training to rebuild them."
 hd_maa_training.1701.desc_tier2:0 "The training has gone smoothly, and I have secured between 900 and 1,200 White-Cloth soldiers in perfect formation. If they are disbanded now, we will have to wait until the next training session to rebuild their ranks."
 hd_maa_training.1701.desc_tier3:0 "Training has yielded excellent results; 1,100 to 1,400 White Robed soldiers have been fully mobilized, and their equipment and commands have proven reliable."
 hd_maa_training.1701.desc_tier4:0 "This drill was a resounding success; 1,300 to 1,500 elite White Robed soldiers are now arrayed and awaiting orders."
 hd_maa_training.1701.a:0 "Vanishing without a trace."
