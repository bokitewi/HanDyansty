l_english:
 hd_youzhou_tuqi:0 "Youzhou Cavalry"
 hd_youzhou_tuqi_flavor:0 "#F The cavalry of the frontier commanderies in Youzhou have long been seasoned in border warfare and excel at rapid charges and raids. #!"
 hd_establish_youzhou_tuqi_decision:0 "Establish the Youzhou Cavalry Corps System"
 hd_establish_youzhou_tuqi_decision_desc:0 "The cavalry of the frontier commanderies in Youzhou are seasoned in border warfare and excel at rapid charges and raids. \n\n I can reorganize the military registers of Youzhou and establish a system for the Youzhou Shock Cavalry. Once this system is established, provided there is sufficient manpower, we can recruit and expand the force independently."
 hd_establish_youzhou_tuqi_decision_tooltip:0 "Establish the Youzhou Cavalry Corps system. Prior to AD 400, at least one county must be directly administered in Youzhou, with a control level of no less than 50 and local cultural heritage meeting recruitment requirements. Recruitment and expansion will be suspended if the directly administered county, cultural heritage, or control level conditions are lost, but existing legions will not be disbanded."
 hd_establish_youzhou_tuqi_decision_confirm:0 "Pay 150 gold and 300 prestige to establish the military system; this resolution will not directly grant legions."
 hd_establish_youzhou_tuqi_decision_effect:0 "Establish the Youzhou Cavalry Corps system. When troop sources are sufficient, recruit and expand this unit type."
 hd_maa_source.0001.t:0 "The cavalry source of Youzhou has been cut off."
 hd_maa_source.0001.desc:0 "I can no longer requisition knights and mounts from Youzhou. The existing Youzhou Cavalry will still remain loyal, but recruitment or expansion is not possible until troop reserves are restored."
 hd_maa_source.0001.a:0 "The current troops can still be maintained."
 hd_maa_source.0002.t:0 "Youzhou Cavalry Corps Source Restored"
 hd_maa_source.0002.desc:0 "I have once again secured sufficient manpower from Youzhou; the recruitment and expansion of Youzhou Cavalry are now restored."
 hd_maa_source.0002.a:0 "I can recruit them again."
 hd_baima_yicong:0 "White Horse Cavalry"
 hd_baima_yicong_flavor:0 "#F Youbeiping is abundant in strong horses; the White Horse Cavalry, skilled in mounted archery, can serve as vanguard. #!"
 hd_gongsun_baima_event_army:0 "Gongsun Zan's White Horse Righteous Cavalry"
 hd_establish_baima_yicong_decision:0 "Establish the White Horse Righteous Escort Army system"
 hd_establish_baima_yicong_decision_desc:0 "Right Beiping is abundant in strong horses; the White Horse Cavalry, skilled in mounted archery, can serve as vanguard troops. \n\n I can organize the military registers of Right Beiping and establish the White Horse Cavalry system. Once the system is established, provided there are sufficient recruits, we can independently recruit and expand the forces."
 hd_establish_baima_yicong_decision_tooltip:0 "Establish the White Horse Righteous Escort military system. Prior to AD 400, at least one county must be directly administered in Youbeiping, with a control level of no less than 50 and local cultural heritage meeting recruitment requirements. Recruitment and expansion will be suspended if direct administration, cultural heritage, or control level conditions are lost, but existing legions will not be disbanded."
 hd_establish_baima_yicong_decision_confirm:0 "Pay 200 gold and 400 prestige to establish the military system; this resolution will not directly grant legions."
 hd_establish_baima_yicong_decision_effect:0 "Establish the White Horse Cavalry Corps. When troop sources are sufficient, recruit and expand this unit type."
 hd_maa_source.0003.t:0 "The source of troops for the White Horse Cavalry has been cut off."
 hd_maa_source.0003.desc:0 "I can no longer requisition White Horse Cavalry from Youbeiping. The existing White Horse Righteous Followers will remain loyal, but recruitment or expansion is prohibited until troop reserves are restored."
 hd_maa_source.0003.a:0 "The current troops can still be maintained."
 hd_maa_source.0004.t:0 "Baima Yicong troop recruitment restored"
 hd_maa_source.0004.desc:0 "I have once again secured sufficient manpower from Youbeiping; the recruitment and expansion of the White Horse Cavalry have been restored."
 hd_maa_source.0004.a:0 "I can recruit them again."
 hd_wuhuan_qicong:0 "Huáncí Cavalry"
 hd_wuhuan_qicong_flavor:0 "#F The Wuhun riders excel in mounted archery and are well-suited for reconnaissance, harassment, and pursuit along the frontiers. #!"
 hd_establish_wuhuan_qicong_decision:0 "Establish the cavalry unit of the Wuhuan auxiliary army"
 hd_establish_wuhuan_qicong_decision_desc:0 "The Wuhun riders excel in mounted archery, making them ideal for reconnaissance, harassment, and pursuit along the frontiers. \n\n I can reorganize the military registers of former Wuhun territories and establish a system of Wuhun cavalry units. Once this system is established, provided there are sufficient recruits, we can independently enlist and expand our forces."
 hd_establish_wuhuan_qicong_decision_tooltip:0 "Establish the system of deploying Huān cavalry troops. Prior to AD 400, at least one county must be directly administered in the ancestral lands of the Huān people, with a control level not lower than 50 and local cultural heritage meeting recruitment requirements. Recruitment and expansion will be suspended if direct administration, cultural heritage, or control level conditions are lost, but existing legions will not be disbanded."
 hd_establish_wuhuan_qicong_decision_confirm:0 "Pay 120 gold and 250 prestige to establish the military system; this resolution will not directly grant legions."
 hd_establish_wuhuan_qicong_decision_effect:0 "Establish the Wuhuan Cavalry Auxiliary Corps. When troop sources are sufficient, recruit and expand this unit type."
 hd_maa_source.0005.t:0 "The Wuhuan cavalry has run out of recruits."
 hd_maa_source.0005.desc:0 "I can no longer recruit tribal riders from the former territory of the Wuhuan. Existing Wuhuan cavalry units will continue to serve, but recruitment or expansion is not possible until troop sources are restored."
 hd_maa_source.0005.a:0 "The current troops can still be maintained."
 hd_maa_source.0006.t:0 "Wuhuan cavalry recruitment restored"
 hd_maa_source.0006.desc:0 "I have once again gained control over sufficient manpower from the former lands of the Wuhuan. Recruitment and expansion of the Wuhuan Cavalry Corps have been restored."
 hd_maa_source.0006.a:0 "I can recruit them again."
 hd_jizhou_qiangnu:0 "Jizhou Heavy Crossbow"
 hd_jizhou_qiangnu_flavor:0 "#F  The Jizhou crossbowmen employ heavy crossbows in rapid volleys, sufficient to impede armored enemies. #!"
 hd_establish_jizhou_qiangnu_decision:0 "Establish the Strong Crossbow Army system in Jizhou Commandery"
 hd_establish_jizhou_qiangnu_decision_desc:0 "The archers of Jizhou use powerful crossbows to fire in dense volleys, sufficient to impede armored enemies. \n\n I can organize the military registers of Jizhou and establish a system for the Jizhou Heavy Crossbow Corps. Once this system is established, as long as there are sufficient recruits, we can independently recruit and expand the force."
 hd_establish_jizhou_qiangnu_decision_tooltip:0 "Establish the Jizhou Heavy Crossbow Army system. Prior to AD 400, at least one county must be directly administered in Jizhou, with a control level of no less than 50 and local cultural heritage meeting recruitment requirements. Recruitment and expansion will be suspended if the directly administered county, cultural heritage, or control level conditions are lost, but existing legions will not be disbanded."
 hd_establish_jizhou_qiangnu_decision_confirm:0 "Pay 150 gold and 300 prestige to establish the military system; this resolution will not directly grant legions."
 hd_establish_jizhou_qiangnu_decision_effect:0 "Establish the Jizhou Heavy Crossbow Unit system. When troop sources are sufficient, recruit and expand this unit type."
 hd_maa_source.0007.t:0 "The strong-archery troops of Jizhou have run out of recruits."
 hd_maa_source.0007.desc:0 "I can no longer requisition crossbowmen and military households from Jizhou. Existing heavy crossbow units in Jizhou will remain loyal, but recruitment or expansion is prohibited until troop replenishment is restored."
 hd_maa_source.0007.a:0 "The current troops can still be maintained."
 hd_maa_source.0008.t:0 "Jizhou Heavy Crossbowman Recruitment Restored"
 hd_maa_source.0008.desc:0 "I have once again secured sufficient manpower from Jizhou, and the recruitment and expansion of Jizhou's heavy crossbowmen have been restored."
 hd_maa_source.0008.a:0 "I can recruit them again."
 hd_xiandeng_ruishi:0 "Vanguard Sharpshooters"
 hd_xiandeng_ruishi_flavor:0 "#F  Vanguard Sharpshooters clad in armor and wielding weapons specialize in leading the charge into enemy formations during assaults. #!"
 hd_establish_xiandeng_ruishi_decision:0 "Establish the Vanguard Sharpshooter Army System"
 hd_establish_xiandeng_ruishi_decision_desc:0 "The Vanguard Sharpshooters, clad in armor and wielding weapons, specialize in leading the charge into enemy formations during assaults. \n\n I can organize the military registers of Jizhou to establish the Vanguard Sharpshooter system. Once established, as long as there is a sufficient supply of recruits, they can be independently recruited and expanded."
 hd_establish_xiandeng_ruishi_decision_tooltip:0 "Establish the Vanguard Sharpshooter Legion system. Prior to AD 400, at least one county must be directly administered in Jizhou, with a control level of no less than 50 and local cultural heritage meeting recruitment requirements. Recruitment and expansion will be suspended if direct administration, cultural heritage, or control level conditions are lost, but existing legions will not be disbanded."
 hd_establish_xiandeng_ruishi_decision_confirm:0 "Pay 220 gold and 400 prestige to establish the military system; this resolution will not directly grant legions."
 hd_establish_xiandeng_ruishi_decision_effect:0 "Establish the Vanguard Sharpshooter Corps system. When troop reserves are sufficient, recruit and expand this unit type."
 hd_maa_source.0009.t:0 "The source of the vanguard elite soldiers has been cut off."
 hd_maa_source.0009.desc:0 "I can no longer conscript brave warriors from Jizhou. The Xian Deng elite troops will continue to serve, but recruitment or expansion is not possible until troop replenishment is restored."
 hd_maa_source.0009.a:0 "The current troops can still be maintained."
 hd_maa_source.0010.t:0 "First Ascent Sharp Soldiers Source Recovery"
 hd_maa_source.0010.desc:0 "I have once again secured sufficient manpower from Jizhou, and the recruitment and expansion of the Xian Deng Ruishi have been restored."
 hd_maa_source.0010.a:0 "I can recruit them again."
 hd_qingzhou_bing:0 "Qingzhou Soldiers"
 hd_qingzhou_bing_flavor:0 "#F Qingzhou has a large population and can raise a substantial infantry force from the local military households. #!"
 hd_establish_qingzhou_bing_decision:0 "Establish the military system of the Qingzhou Army"
 hd_establish_qingzhou_bing_decision_desc:0 "The Qingzhou region has a large population, allowing for the formation of a substantial infantry force from local military households. \n\n I can organize Qingzhou's military registers and establish the Qingzhou Army system. Once this system is in place, with sufficient manpower, recruitment and expansion can be conducted independently."
 hd_establish_qingzhou_bing_decision_tooltip:0 "Establish the Qingzhou Army system. Prior to AD 400, at least one county must be directly administered in Qingzhou, with a control level of no less than 50 and local cultural heritage meeting recruitment requirements. Recruitment and expansion will be suspended if the directly administered county, cultural heritage, or control level conditions are lost, but existing legions will not be disbanded."
 hd_establish_qingzhou_bing_decision_confirm:0 "Pay 100 gold and 200 prestige to establish the military system; this resolution will not directly grant legions."
 hd_establish_qingzhou_bing_decision_effect:0 "Establish the Qingzhou Soldier military system. When sufficient manpower is available, recruit and expand this unit type."
 hd_maa_source.0011.t:0 "The source of the Qingzhou soldiers has been cut off."
 hd_maa_source.0011.desc:0 "I can no longer conscript military households and able-bodied men from Qingzhou. Existing Qingzhou troops will continue to serve, but recruitment or expansion is prohibited until the troop reserves are restored."
 hd_maa_source.0011.a:0 "The current troops can still be maintained."
 hd_maa_source.0012.t:0 "Qingzhou Army Recruitment Restored"
 hd_maa_source.0012.desc:0 "I have once again gained control over sufficient manpower from the Qingzhou troops, and their recruitment and expansion have been restored."
 hd_maa_source.0012.a:0 "I can recruit them again."
 hd_liujun_liangjiazi:0 "Six Commanderies' Noble Families"
 hd_liujun_liangjiazi_flavor:0 "#F The sons of respectable families from the six commanderies of Longxi practiced archery and horsemanship since childhood, serving as an important source of elite cavalry for the Han army. #!"
 hd_establish_liujun_liangjiazi_decision:0 "Establish the military system of the Six Commanderies' Noble Families' Sons"
 hd_establish_liujun_liangjiazi_decision_desc:0 "The six commanderies of Longxi have long been the source of elite cavalry for the Han army, as their families train in archery and horsemanship from childhood. \n\n I can reorganize the military registers of these six commanderies to establish a system for the Six Commanderies Good-Family Cavalry. Once this system is established, provided there are sufficient recruits, I may independently raise and expand the force."
 hd_establish_liujun_liangjiazi_decision_tooltip:0 "Establish the system of recruiting soldiers from the families of good men in the six commanderies. Before AD 400, at least one county must be directly administered in the Longxi Six Commanderies, with a control level not lower than 50 and local cultural heritage meeting the requirements for troop recruitment. Recruitment and expansion will be suspended if the directly administered county, cultural heritage, or control level conditions are lost, but existing legions will not be disbanded."
 hd_establish_liujun_liangjiazi_decision_confirm:0 "Pay 300 gold and 500 prestige to establish the military system; this resolution will not directly grant legions."
 hd_establish_liujun_liangjiazi_decision_effect:0 "Establish the system of recruiting sons of good families from six commanderies as soldiers. When there is a sufficient supply of recruits, this troop type can be recruited and expanded."
 hd_maa_source.0013.t:0 "The recruitment of soldiers from the six prefectures' gentry families has been cut off."
 hd_maa_source.0013.desc:0 "I can no longer recruit noble families' cavalrymen from the six commanderies of Longxi. The existing nobles from these six commanderies will still serve, but recruitment or expansion is prohibited until troop replenishment is restored."
 hd_maa_source.0013.a:0 "The current troops can still be maintained."
 hd_maa_source.0014.t:0 "Recruitment of soldiers from the six prefectures' gentry families has been restored."
 hd_maa_source.0014.desc:0 "I have once again secured sufficient manpower from the six commanderies of Longxi, and recruitment and expansion of the Liangjiazi (well-born families) have been restored."
 hd_maa_source.0014.a:0 "I can recruit them again."
 hd_huangzhong_yicong:0 "Huangzhong Yi Cong"
 hd_huangzhong_yicong_flavor:0 "#F The Huangzhong Qiang and Hu volunteers are familiar with border affairs, capable of riding and shooting in battle, and able to pursue enemy forces. #!"
 hd_establish_huangzhong_yicong_decision:0 "Establish the system of Huangzhong Volunteer Army"
 hd_establish_huangzhong_yicong_decision_desc:0 "The Huangzhong Qiang and Hu volunteers are familiar with border affairs, capable of mounted archery and combat, and able to pursue enemy forces. \n\n I can organize the military registers of Huangzhong and establish the system for the Huangzhong Volunteers. Once this system is established, as long as there is a sufficient supply of recruits, we can independently recruit and expand the force."
 hd_establish_huangzhong_yicong_decision_tooltip:0 "Establish the Huangzhong Yi Cong Jun system. Prior to AD 400, at least one county must be directly administered in Huangzhong, with a control level of no less than 50 and local cultural heritage meeting recruitment requirements. Recruitment and expansion will be suspended if the directly administered county, cultural heritage, or control level conditions are lost, but existing legions will not be disbanded."
 hd_establish_huangzhong_yicong_decision_confirm:0 "Pay 160 gold and 300 prestige to establish the military system; this resolution will not directly grant legions."
 hd_establish_huangzhong_yicong_decision_effect:0 "Establish the Huanzhong Yicong Army system. When sufficient manpower is available, recruit and expand this unit type."
 hd_maa_source.0015.t:0 "The supply of Huangzhong volunteer soldiers has been cut off."
 hd_maa_source.0015.desc:0 "I can no longer conscript Qiang and Hu auxiliaries from Huangzhong. Existing Huangzhong auxiliaries will continue to serve, but recruitment or expansion is prohibited until troop replenishment is restored."
 hd_maa_source.0015.a:0 "The current troops can still be maintained."
 hd_maa_source.0016.t:0 "Huangzhong volunteer troops recruitment restored"
 hd_maa_source.0016.desc:0 "I have once again gained control over sufficient troops from the Huangzhong region, and recruitment and expansion of the Huangzhong Yizong forces have resumed."
 hd_maa_source.0016.a:0 "I can recruit them again."
 hd_bandun_congbing:0 "Banshen Chong Soldiers"
 hd_bandun_congbing_flavor:0 "#F The people of Baxing hold the ban-shield for battle, skilled in scaling mountain ridges and engaging in close-quarters combat. #!"
 hd_establish_bandun_congbing_decision:0 "Establish the system of Banquan Chong troops"
 hd_establish_bandun_congbing_decision_desc:0 "The people of Cang from Ba Commandery wielded the ban-shield in battle, excelling at scaling mountain ridges and engaging in close-quarters combat. \n\n I can organize the military registers of Ba Commandery and establish a standing force of Ban-Shield soldiers. Once this system is established, provided there are sufficient recruits, we may enlist and expand the ranks independently."
 hd_establish_bandun_congbing_decision_tooltip:0 "Establish the Banquan Chen military system. Prior to AD 400, at least one county in Ba Commandery must be directly administered by the state, with a control level of no less than 50 and local cultural heritage meeting recruitment requirements. Recruitment and expansion will be suspended if direct administration, cultural heritage, or control level conditions are lost, but existing legions will not be disbanded."
 hd_establish_bandun_congbing_decision_confirm:0 "Pay 150 gold and 300 prestige to establish the military system; this resolution will not directly grant legions."
 hd_establish_bandun_congbing_decision_effect:0 "Establish the Banquan Jie military system. When troop sources are sufficient, recruit and expand this unit type."
 hd_maa_source.0017.t:0 "The source of the Banqun troops has been cut off."
 hd_maa_source.0017.desc:0 "I can no longer conscript the Chong people military households from Ba Commandery. Existing Ban Shen Chong troops will continue to serve, but recruitment or expansion is not possible until manpower reserves are restored."
 hd_maa_source.0017.a:0 "The current troops can still be maintained."
 hd_maa_source.0018.t:0 "Restoration of the source of troops for the Banshen Cong soldiers"
 hd_maa_source.0018.desc:0 "I have once again secured sufficient manpower from Ba Commandery, and the recruitment and expansion of Ban Shen Chong troops have been restored."
 hd_maa_source.0018.a:0 "I can recruit them again."
 hd_wudang_feijun:0 "Wudang Flying Army"
 hd_wudang_feijun_flavor:0 "#F The southern army soldiers are accustomed to traversing mountain paths and can engage in combat on difficult terrain using bows, crossbows, and short weapons. #!"
 hd_establish_wudang_feijun_decision:0 "Establish the military system of the Wu Dang Flying Army"
 hd_establish_wudang_feijun_decision_desc:0 "The southern army soldiers are accustomed to mountain paths and can fight in difficult terrain using bows, crossbows, and short weapons. \n\n I can organize the military registers of the south and establish the Wudang Flying Army system. Once the system is established, as long as there is a sufficient supply of recruits, we can independently recruit and expand the army."
 hd_establish_wudang_feijun_decision_tooltip:0 "Establish the Wudang Flying Army system. Prior to AD 400, at least one county must be directly administered in Southern Zhong with a control level of no less than 50, and local cultural heritage must meet recruitment requirements. Recruitment and expansion will be suspended if direct administration, cultural heritage, or control level conditions are lost, but existing legions will not be disbanded."
 hd_establish_wudang_feijun_decision_confirm:0 "Pay 250 gold and 500 prestige to establish the military system; this resolution will not directly grant legions."
 hd_establish_wudang_feijun_decision_effect:0 "Establish the Wu Dang Flying Army unit system. When sufficient troop sources are available, recruit and expand this unit type."
 hd_maa_source.0019.t:0 "The Wudang Flying Army has run out of recruits."
 hd_maa_source.0019.desc:0 "I can no longer conscript mountain troops from the Southern Regions. The Wu Dang Flying Army remains loyal, but recruitment and expansion are prohibited until troop replenishment is restored."
 hd_maa_source.0019.a:0 "The current troops can still be maintained."
 hd_maa_source.0020.t:0 "Wudang Flying Army Recruitment Restored"
 hd_maa_source.0020.desc:0 "I have once again secured sufficient manpower from the Southern Regions, and recruitment and expansion of the Wu Dang Fei Jun are now restored."
 hd_maa_source.0020.a:0 "I can recruit them again."
 hd_wuxi_manbing:0 "Five-River Miao Soldiers"
 hd_wuxi_manbing_flavor:0 "#F The soldiers of Wuxi are familiar with the mountain forests and waterways, skilled in ambushing and tracking enemy forces. #!"
 hd_establish_wuxi_manbing_decision:0 "Establish the military system of the Five-Xi Mian troops"
 hd_establish_wuxi_manbing_decision_desc:0 "The soldiers of the Five Creeks are familiar with mountain forests and waterways, skilled in ambushes and tracking enemy forces. \n\n I can organize the military registers of the Wu Ling Five Creeks and establish a military system for the Five Creek Barbarian troops. Once this system is established, as long as there is sufficient manpower, we can recruit and expand the forces independently."
 hd_establish_wuxi_manbing_decision_tooltip:0 "Establish the military system for the Five-Xi Mian troops. Prior to AD 400, at least one county must be directly administered in Wuling's Five-Xi region, with a control level of no less than 50 and local cultural heritage meeting recruitment requirements. Recruitment and expansion will be suspended if the directly administered county, cultural heritage, or control level conditions are lost, but existing legions will not be disbanded."
 hd_establish_wuxi_manbing_decision_confirm:0 "Pay 100 gold and 200 prestige to establish the military system; this resolution will not directly grant legions."
 hd_establish_wuxi_manbing_decision_effect:0 "Establish the Wu-Xi Man military system. When troop sources are sufficient, recruit and expand this unit type."
 hd_maa_source.0021.t:0 "The source of the Five Streams Miao troops has been cut off."
 hd_maa_source.0021.desc:0 "I can no longer conscript tribal soldiers from the Wu Ling Five Creeks. The existing Five Creek Miao troops will continue to serve, but recruitment or expansion is prohibited until troop sources are restored."
 hd_maa_source.0021.a:0 "The current troops can still be maintained."
 hd_maa_source.0022.t:0 "Five Streams Miao Troops Recruitment Restored"
 hd_maa_source.0022.desc:0 "I have once again gained control over sufficient manpower from the Wu Ling Five Creeks, and recruitment and expansion of the Five Creek barbarian troops have been restored."
 hd_maa_source.0022.a:0 "I can recruit them again."
 hd_shanyue_jiashi:0 "Shanyue Infantry"
 hd_shanyue_jiashi_flavor:0 "#F The Shanyue tribespeople have long inhabited rugged terrain; among them, the strong and robust can be equipped with armor and enlisted as infantry. #!"
 hd_establish_shanyue_jiashi_decision:0 "Establish the Mountain Yue Infantry System"
 hd_establish_shanyue_jiashi_decision_desc:0 "The Mountain Yue tribes have long inhabited rugged terrain; among them, the strong can be equipped with armor and organized into infantry. \n\n I can rectify the military registers of the Mountain Yue commanderies and establish a system for Mountain Yue armored soldiers. Once this system is established, provided there are sufficient recruits, I may independently enlist and expand the forces."
 hd_establish_shanyue_jiashi_decision_tooltip:0 "Establish the Mountain Yue Infantry Corps system. Prior to AD 400, at least one county must be directly administered in each of the Mountain Yue commanderies, with a control level not lower than 50 and local cultural heritage meeting recruitment requirements. Recruitment and expansion will be suspended if the directly administered county, cultural heritage, or control level conditions are lost, but existing legions will not be disbanded."
 hd_establish_shanyue_jiashi_decision_confirm:0 "Pay 150 gold and 300 prestige to establish the military system; this resolution will not directly grant legions."
 hd_establish_shanyue_jiashi_decision_effect:0 "Establish the Shan Yue armored soldier unit system. When sufficient manpower is available, recruit and expand this troop type."
 hd_maa_source.0023.t:0 "The supply line of the Shanyue soldiers has been cut off."
 hd_maa_source.0023.desc:0 "I can no longer conscript Mountain Yue troops from the various Mountain Yue commanderies. Existing Mountain Yue soldiers will continue to serve, but recruitment or expansion of forces is prohibited until troop replenishment is restored."
 hd_maa_source.0023.a:0 "The current troops can still be maintained."
 hd_maa_source.0024.t:0 "Shanyue Armor Soldier Source Restoration"
 hd_maa_source.0024.desc:0 "I have once again gained control over sufficient manpower from the Yue Mountain commanderies; recruitment and expansion of the Yue Mountain armored troops have been restored."
 hd_maa_source.0024.a:0 "I can recruit them again."
 hd_danyang_jingbing:0 "Elite Soldiers of Danyang"
 hd_danyang_jingbing_flavor:0 "#F The people of Danyang are fierce and resilient in battle; after reorganization, they can become reliable infantry. #!"
 hd_establish_danyang_jingbing_decision:0 "Establish the Dan Yang Elite Troops System"
 hd_establish_danyang_jingbing_decision_desc:0 "The people of Danyang are fierce, tough, and resilient in battle; once organized, they can become a reliable infantry force. \n\n I can rectify the military registers of Danyang and establish a system for elite Danyang troops. Once this system is established, as long as there is sufficient manpower, recruitment and expansion can be carried out independently."
 hd_establish_danyang_jingbing_decision_tooltip:0 "Establish the Dan Yang Elite Troops system. Prior to AD 400, at least one county must be directly administered in Dan Yang, with a control level of no less than 50 and local cultural heritage meeting recruitment requirements. Recruitment and expansion will be suspended if the directly administered county, cultural heritage, or control level conditions are lost, but existing legions will not be disbanded."
 hd_establish_danyang_jingbing_decision_confirm:0 "Pay 200 gold and 400 prestige to establish the military system; this resolution will not directly grant legions."
 hd_establish_danyang_jingbing_decision_effect:0 "Establish the Dan Yang Elite Soldier system. When troop sources are sufficient, recruit and expand this unit type."
 hd_maa_source.0025.t:0 "The source of elite troops from Danyang has been cut off."
 hd_maa_source.0025.desc:0 "I can no longer conscript mountain people soldiers from Dan Yang. Existing elite troops of Dan Yang will still serve, but recruitment or expansion is not possible until the troop source is restored."
 hd_maa_source.0025.a:0 "The current troops can still be maintained."
 hd_maa_source.0026.t:0 "Recovery of Man-Dangyuan Elite Troop Recruitment Pool"
 hd_maa_source.0026.desc:0 "I have once again secured sufficient manpower from the Dan Yang region; recruitment and expansion of elite Dan Yang troops have been restored."
 hd_maa_source.0026.a:0 "I can recruit them again."
 hd_fuling_liannushi:0 "Fuling Crossbowmen"
 hd_fuling_liannushi_flavor:0 "#F Fuling Crossbowmen use repeating crossbows to suppress approaching enemies at close range on mountain paths. #!"
 hd_establish_fuling_liannushi_decision:0 "Establish the Fuling Crossbowmen military system"
 hd_establish_fuling_liannushi_decision_desc:0 "Fuling crossbowmen use repeating crossbows to suppress approaching enemies at close range on mountain paths. \n\n I can organize Fuling's military registers and establish the Fuling Repeating Crossbowman system. Once the system is established, as long as there are sufficient recruits, we can independently recruit and expand the force."
 hd_establish_fuling_liannushi_decision_tooltip:0 "Establish the Fuling Crossbowmen military system. Prior to AD 400, at least one directly-administered county must be under control in Fuling, with a control level of no less than 50 and local cultural heritage meeting recruitment requirements. Recruitment and expansion will be suspended if the directly-administered county, cultural heritage, or control level conditions are lost, but existing legions will not be disbanded."
