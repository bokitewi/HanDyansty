l_english:
 hd_youzhou_tuqi:0 "Youzhou Assault Cavalry"
 hd_youzhou_tuqi_flavor:0 "Frontier horsemen of Yuyang and Shanggu, swift as the wind."
 hd_xianzhenying:0 "Camp-Rending Battalion"
 hd_xianzhenying_flavor:0 "Hand-picked braves under iron discipline. When they take the field, they rend the enemy line and break it."
 hd_xianzhenying_army:0 "Camp-Rending Battalion"
 hd_establish_youzhou_tuqi_decision:0 "Raise the Youzhou Assault Cavalry"
 hd_establish_youzhou_tuqi_decision_desc:0 "The frontier commanderies of Youzhou breed hardy folk: Zhuo and Jiproduce assault horsemen, while Yuyang and Shanggu raise sturdy mounts. By reorganizing the frontier registers and selecting the best riders, our army will field light cavalry second to none.\n\nThis permanently establishes the institution: as long as our realm retains sufficient recruiting grounds in Youzhou, we may raise and expand regiments of Youzhou Assault Cavalry. Losing the grounds will not disband existing regiments, but will halt new recruitment and expansion until the grounds are regained."
 hd_establish_youzhou_tuqi_decision_tooltip:0 "Permanently establish the Youzhou Assault Cavalry institution and gain the right to recruit it. Requires: an independent landed ruler, Chinese heritage, at least 24 valid counties in the Youzhou recruiting grounds (control of 50 or more; counties of a foreign culture require cultural acceptance above 20), and a date before AD 300. Existing regiments are never disbanded on losing the grounds; permission returns automatically once the grounds are regained. The decision grants no free regiments."
 hd_establish_youzhou_tuqi_decision_confirm:0 "Raising the Youzhou Assault Cavalry costs 150 gold and 300 prestige, and grants no free regiments — you must still recruit them in the Military view. Proceed?"
 hd_establish_youzhou_tuqi_decision_effect:0 "Establish the Youzhou Assault Cavalry institution. While we hold valid recruiting grounds in Youzhou, regiments may be recruited and expanded in the Military view."
 hd_train_xianzhenying_decision:0 "Drill the Camp-Rending Battalion"
 hd_train_xianzhenying_decision_desc:0 "Select the bravest, enforce strict command, and appoint one of our knights to master their drilling — thus is forged a battalion of armored elite that rends any line before it. The outcome depends on the trainer's talent, the treasury's investment, and the mettle of the men; nothing is fully guaranteed.\n\nThe battalion is created by drilling alone: it cannot normally be recruited or expanded, never reinforces on its own, and once disbanded is lost forever. Each elite corps may be drilled once every ten years."
 hd_train_xianzhenying_decision_tooltip:0 "Automatically appoint the most suitable knight (Martial 15+, Prowess 16+, with the Organizer trait) to lead the drilling, then choose the investment: frugal (100 gold, 150 prestige), generous (250 gold, 300 prestige), or lavish (500 gold, 500 prestige). The drill yields 200 to 700 men depending on the result."
 hd_train_xianzhenying_decision_confirm:0 "The investment will be chosen and paid in the drill that follows. Proceed?"
 hd_maa_training_no_valid_trainer:0 "No eligible trainer remains; the drilling is aborted."
 hd_maa_source.0001.t:0 "Youzhou Recruiting Grounds Lost"
 hd_maa_source.0001.desc:0 "With our rule over Youzhou gone, the local knights, horse-keepers and military households can no longer furnish new assault cavalry for the court. Our existing Youzhou Assault Cavalry will keep serving us, but we can recruit and expand no further until the grounds are regained."
 hd_maa_source.0001.a:0 "The frontier's sons are not easily gathered."
 hd_maa_source.0002.t:0 "Youzhou Recruiting Grounds Restored"
 hd_maa_source.0002.desc:0 "Youzhou is under our rule once more, and its military households and knights again answer the summons. Youzhou Assault Cavalry may now be recruited and expanded again."
 hd_maa_source.0002.a:0 "The edge of the assault cavalry returns to us."
 hd_maa_training.1000.t:0 "Raising the Camp-Rending Battalion"
 hd_maa_training.1000.desc:0 "A knight has been appointed to drill the Camp-Rending Battalion. The outcome depends on the trainer, the investment, and fortune. Choose the investment."
 hd_maa_training.1000.a:0 "Raise the Camp-Rending Battalion"
 hd_maa_training.1000.b:0 "Raise the Camp-Rending Battalion"
 hd_maa_training.1000.c:0 "Raise the Camp-Rending Battalion"
 hd_maa_training.1001.t:0 "The Battalion Takes Shape"
 hd_maa_training.1001.desc_tier1:0 "An army assembled in haste, serviceable at best. Such elites never reinforce on their own; once disbanded, lost forever."
 hd_maa_training.1001.desc_tier2:0 "A force fit for war, ranks in order. Such elites never reinforce on their own; once disbanded, lost forever."
 hd_maa_training.1001.desc_tier3:0 "A host of stern discipline; the edge is keen. Such elites never reinforce on their own; once disbanded, lost forever."
 hd_maa_training.1001.desc_tier4:0 "One chosen from a hundred! Such elites never reinforce on their own; once disbanded, lost forever."
 hd_maa_training.1001.a:0 "Rend the line, and the day is ours."
 hd_debug_prepare_youzhou_tuqi_decision:0 "[DEBUG] Establish Youzhou Assault Cavalry"
 hd_debug_prepare_youzhou_tuqi_decision_desc:0 "Debug: ignore all regular requirements, establish the institution outright, raise control by 60 in qualifying-ground counties below 50, and raise acceptance toward the Youzhou culture by 60."
 hd_debug_prepare_youzhou_tuqi_decision_tooltip:0 "Debug shortcut: adds the institution and source flags and patches control/acceptance, for immediate testing of recruitment, expansion, the frozen-state behavior and reinforcement."
 hd_debug_prepare_youzhou_tuqi_decision_effect:0 "Institution established and recruiting grounds patched."
 hd_debug_train_xianzhenying_decision:0 "[DEBUG] Drill the Camp-Rending Battalion (self as trainer)"
 hd_debug_train_xianzhenying_decision_desc:0 "Debug: bypass the knight requirements and enter the drilling event chain with yourself as the trainer."
 hd_debug_train_xianzhenying_decision_tooltip:0 "Debug shortcut: fires the training event directly, using your own Martial and Prowess in the roll."
 hd_maa_debug_acceptance_desc:0 "Debug: acceptance boost for testing"
