l_english:
 quix_murder_outcome.1001.t:0 "A warm and comfortable inn..."
 quix_murder_outcome.1001.d:0 "My accomplice has discovered that [target.GetTitledFirstName] will spend the night at a wooden inn during their journey. By setting fire to it in the dead of night, [target.GetSheHe] will find it difficult to escape, and everything will appear to be nothing more than an accident."
 quix_murder_outcome.1001.a:0 "Burn, baby, burn."
 quix_murder_outcome.1001.b:0 "I happen to like that inn..."
 quix_murder_outcome.1002.t:0 "An arrow is shot toward the balcony..."
 quix_murder_outcome.1002.d:0 "[target.GetTitledFirstName] often stands alone on the balcony in the afternoon, while the tavern across the street is just large enough to hide an archer. The distance is short; a single arrow can end it all."
 quix_murder_outcome.1002.a:0 "Pass the message to my best archer."
 quix_murder_outcome.1002.b:0 "No, that would be too dignified for [target.GetTitledFirstName]."
 quix_murder_outcome.1003.t:0 "Poisonous wine"
 quix_murder_outcome.1003.d:0 "As is well known, [target.GetName] has a fondness for fine wine. I can send him a rare vintage, poisoned beforehand and anonymously delivered under the guise of an admirer."
 quix_murder_outcome.1003.a:0 "Indeed a thoughtful gift!"
 quix_murder_outcome.1003.b:0 "I've thought about it, and I'll keep this poisoned wine for another occasion."
 quix_murder_outcome.1004.t:0 "Dangerous Night Road"
 quix_murder_outcome.1004.d:0 "My co-conspirator discovered that [target.GetName] has the habit of taking solitary walks at night. By ambushing along the roadside in advance, we can make [target.GetHerHim] vanish silently."
 quix_murder_outcome.1004.a:0 "It is a pity that no one will see the fear on [target.GetTitledFirstNamePossessive]'s face."
 quix_murder_outcome.1004.b:0 "Perhaps it is too simple; there must be a better way."
 quix_murder_outcome.1005.t:0 "Dangerous Falling Rocks"
 quix_murder_outcome.1005.d:0 "[target.GetName] often rests in the courtyard beneath the city wall. The wall has long been neglected, and if a few massive stones are loosened beforehand, they will fall precisely onto [target.GetHerHim]."
 quix_murder_outcome.1005.a:0 "Loosen these stones even more!"
 quix_murder_outcome.1005.b:0 "This is incorrect. [target.GetFirstNameNoTooltip] is not worth us destroying the wall."
 quix_murder_outcome.1006.t:0 "Neglect of Duty"
 quix_murder_outcome.1006.d:0 "A servant of [target.GetTitledFirstName] accepted my money and promised to let the conspirators into the bedroom at night. As long as this person keeps his word, [target.GetSheHe] will not survive tonight."
 quix_murder_outcome.1006.a:0 "Just make sure this servant doesn't speak out of turn."
 quix_murder_outcome.1006.b:0 "No, this is most likely a trap."
 quix_murder_outcome.1007.t:0 "A rash assassination plot"
 quix_murder_outcome.1007.d:0 "A secret tunnel leads to [target.GetTitledFirstNamePossessive]'s residence. My men are preparing to infiltrate through it, subdue the guards at the door, kill [target.GetHerHim], and then withdraw by the same route."
 quix_murder_outcome.1007.a:0 "May the goddess of fortune favor these brave assassins!"
 quix_murder_outcome.1007.b:0 "This plan is too rash; let us proceed with caution."
 quix_murder_outcome.1008.t:0 "Nightwalker"
 quix_murder_outcome.1008.d:0 "[target.GetName] is about to head to the nearby town and will inevitably return after nightfall. My men can intercept [target.GetHerHim] on fast horses along the road, then depart before the pursuing forces arrive."
 quix_murder_outcome.1008.a:0 "Then send my finest rider astride my swiftest horse."
 quix_murder_outcome.1008.b:0 "No, this plan is too despicable..."
 quix_murder_outcome.1009.t:0 "Imposter Doctor"
 quix_murder_outcome.1009.d:0 "[target.GetTitledFirstName] is seeking an audience with a physician renowned for treating ailments through bloodletting, and the relevant correspondence has fallen into our hands. As long as we send someone to impersonate him at the appointment, [target.GetSheHe] will willingly surrender his life to us."
 quix_murder_outcome.1009.a:0 "[target.GetTitledFirstNameNoTooltip] will make everything too easy, so just go ahead and execute it."
 quix_murder_outcome.1009.b:0 "No, if we accidentally cure [target.GetTitledFirstNamePossessive]'s illness, that would be disastrous."
 quix_murder_outcome.1010.t:0 "Masked Assassin"
 quix_murder_outcome.1010.d:0 "[target.GetTitledFirstName] will attend a masquerade party. My agents can don masks to blend in with the guests and approach [target.GetHerHim] without arousing suspicion."
 quix_murder_outcome.1010.a:0 "If this social gathering invites us, we will send an entire band to attend."
 quix_murder_outcome.1010.b:0 "Too simple; it sounds like a trap."
 quix_murder_outcome.1011.t:0 "Foreign Warrior"
 quix_murder_outcome.1011.d:0 "My co-conspirator has contacted a warrior from afar. This man is highly skilled in martial arts and adept at concealing his whereabouts; for the right price, he should be more than enough to take [target.GetTitledFirstNamePossessive]'s life."
 quix_murder_outcome.1011.a:0 "It is best to hire someone who has no connections or vested interests here..."
 quix_murder_outcome.1011.b:0 "This mission is too important to trust strangers."
 quix_murder_outcome.1012.t:0 "Scream in agony!"
 quix_murder_outcome.1012.d:0 "[target.GetName] enjoys walking alone in the wilderness. My men can release a few trained hunting dogs to stage [target.GetHerHim]'s death as an attack by wild beasts."
 quix_murder_outcome.1012.a:0 "Pick the largest one, then... make sure they are sufficiently hungry."
 quix_murder_outcome.1012.b:0 "No, I cannot believe a beast..."
 quix_murder_outcome.1013.t:0 "Bloodstained Pool"
 quix_murder_outcome.1013.d:0 "[target.GetName] visits the local bathhouse alone every week. There are no guards and no weapons there; it is a perfect opportunity to strike."
 quix_murder_outcome.1013.a:0 "I eagerly await news of his demise in the recuperation pool..."
 quix_murder_outcome.1013.b:0 "I have a bad feeling about this."
 quix_murder_outcome.1014.t:0 "Encounter"
 quix_murder_outcome.1014.d:0 "I unexpectedly encountered [target.GetName] standing alone by the riverbank during my journey. The water was rushing violently, and there were no people around; I only needed to give a push from behind."
 quix_murder_outcome.1014.a:0 "Perhaps we should go help [target.GetTitledFirstName] understand how to eliminate [target.GetHerHis]'s life........."
 quix_murder_outcome.1014.b:0 "Though tempting, I should not soil my hands."
 quix_murder_outcome.1015.t:0 "In broad daylight"
 quix_murder_outcome.1015.d:0 "I have waited long enough. Since no more clever method can be found, I will send men to directly attack [target.GetTitledFirstName]. The plan is simple, yet hardest to conceal."
 quix_murder_outcome.1015.a:0 "Order the assassin to carry out the mission immediately."
 quix_murder_outcome.1015.b:0 "No, no, we must formulate a more comprehensive plan."
 quix_murder_outcome.1016.t:0 "Non-existent arrest warrant"
 quix_murder_outcome.1016.d:0 "My men are prepared to forge an order and take [target.GetTitledFirstName] away under the pretext of arrest. As long as we can deceive the onlookers and guards, we can escort [target.GetHerHim] to a secluded place where no one will interfere for disposal."
 quix_murder_outcome.1016.a:0 "This sounds like a reliable plan."
 quix_murder_outcome.1016.b:0 "This sounds like an unreliable plan."
 quix_murder_outcome.1017.t:0 "Strange weapon..."
 quix_murder_outcome.1017.d:0 "My men have acquired a foreign weapon that can fire tiny needles from a distance. If poison is applied to the needles, they can even take [target.GetHerHis]'s life without approaching [target.GetName]."
 quix_murder_outcome.1017.a:0 "What a wonderful tool."
 quix_murder_outcome.1017.b:0 "I won't entrust such an important matter to a hollow stick!"
 quix_murder_outcome.1018.t:0 "Do it yourself"
 quix_murder_outcome.1018.d:0 "I have heard enough of the conspirators' arguments. Since I know where [target.GetTitledFirstName] is sleeping, I can personally infiltrate through the window and end everything before [target.GetSheHe] wakes up."
 quix_murder_outcome.1018.a:0 "Take my hood and dagger and set out!"
 quix_murder_outcome.1018.b:0 "Upon reflection, this is not suitable; if discovered, I would be disgraced and ruined."
 quix_murder_outcome.1019.t:0 "Master Duelist"
 quix_murder_outcome.1019.d:0 "A physically robust foreign warrior has come to my territory to make a living. Unable to speak the local language and hindered by old injuries, he is perfectly suited as a silent assassin to eliminate [target.GetTitledFirstName]."
 quix_murder_outcome.1019.a:0 "He is more than willing to serve me!"
 quix_murder_outcome.1019.b:0 "This is not the professional standard I expected."
 quix_murder_outcome.1020.t:0 "Secret Society"
 quix_murder_outcome.1020.d:0 "My co-conspirator contacted a mysterious organization that claimed they could eliminate [target.GetTitledFirstName] for me. I know almost nothing about them, but their reputation for reliability is well-deserved."
 quix_murder_outcome.1020.a:0 "Such mystery piques my interest; I am curious whether they can successfully complete the tasks I have assigned them."
 quix_murder_outcome.1020.b:0 "So mysterious, I don't think it's reliable."
 quix_murder_outcome.2001.t:0 "A warm and comfortable inn..."
 quix_murder_outcome.2001.opening_1:0 "[target.GetName] perished in the roaring flames."
 quix_murder_outcome.2001.opening_2:0 "Although not everything went according to plan, the arsonist still managed to trap several customers and [target.GetName] inside the inn's doorway, achieving their objective. Wrong place, wrong time!"
 quix_murder_outcome.2001.opening_3:0 "The plan was highly successful; the fire consumed the entire inn. [target.GetName] had no chance to escape."
 quix_murder_outcome.2001.heh:0 "\n Heat."
 quix_murder_outcome.2001.owner_is_known_1:0 "\n\nHowever, it seems everyone believes I orchestrated this accident."
 quix_murder_outcome.2001.owner_is_known_2:0 "\n\n It seems someone couldn't keep this secret; there are many speculating that I killed [target.GetTitledFirstName]."
 quix_murder_outcome.2001.no_awareness_1:0 "Fortunately, all buildings were burned down, and no one suspected me of involvement in this operation. \n\n"
 quix_murder_outcome.2001.no_awareness_2:0 "\n\nAll witnesses were burned along with the inn."
 quix_murder_outcome.2001.a.discovered:0 "But you are mistaken; he is merely an incompetent arsonist!"
 quix_murder_outcome.2001.a:0 "From now on, I always keep several large buckets of water by my bedside when sleeping... to prevent fires."
 quix_murder_outcome.2002.t:0 "An arrow is shot toward the balcony."
 quix_murder_outcome.2002.opening_1:0 "Rumors say the arrow struck [target.GetName]'s throat, and [target.GetSheHe] was choked to death by [target.GetHerHis] own blood."
 quix_murder_outcome.2002.opening_2:0 "Heard that after my assassin struck [target.GetName], [target.GetHerHis] fell off the balcony and landed right on a passing carriage..."
 quix_murder_outcome.2002.opening_3:0 "After [target.GetName] was struck in the abdomen by an arrow, [target.GetHerHis] dragged their injured body back into the room, and [target.GetSheHe] died shortly thereafter from [target.GetHerHis]'s injuries."
 quix_murder_outcome.2002.owner_is_known_1:0 "\n\nUnfortunately, the archers were captured and they also implicated me."
 quix_murder_outcome.2002.owner_is_known_2:0 "\n\n This flawless assassination left a deep impression on the archer, who has been boasting about it ever since, claiming that I paid him to kill [target.GetTitledFirstName]!"
 quix_murder_outcome.2002.no_awareness_1:0 "\n\n Although this was an obvious assassination, no one seems to have discovered that I was the mastermind behind it."
 quix_murder_outcome.2002.no_awareness_2:0 "\n\nAnd most importantly, the archers escaped cleanly and decisively."
 quix_murder_outcome.2002.a.discovered:0 "I told him to let that old and stupid donkey go, but he misunderstood my meaning!"
 quix_murder_outcome.2002.a:0 "Tonight, I'll go to the backyard to get some fresh air..."
 quix_murder_outcome.2003.t:0 "Poisonous wine"
 quix_murder_outcome.2003.opening_1:0 "[target.GetName] Died in a dream last night at [target.GetHerHis]."
 quix_murder_outcome.2003.opening_2:0 "It is said that the drunken [target.GetTitledFirstName] went mad for several hours until [target.GetSheHe] died from coughing up blood."
 quix_murder_outcome.2003.opening_3:0 "[target.GetTitledFirstName] has already died; the last few hours of [target.GetHersHis]'s life were filled with immense agony, screaming, coughing up blood, and roaring."
 quix_murder_outcome.2003.owner_is_known_1:0 "\n\nHowever, the bad news is that the wine deliverer implicated me! Before any torture was even applied, he confessed everything."
 quix_murder_outcome.2003.owner_is_known_2:0 "\n\n Terrible, I made a terrible mistake; it seems I've carved my name on the bottom of a wine bottle... truly a foolish error."
 quix_murder_outcome.2003.no_awareness_1:0 "\n\n It seems no one suspects this was murder, especially no one suspects I had anything to do with it."
 quix_murder_outcome.2003.no_awareness_2:0 "No one doubts that I was involved in this matter; the participants have kept it secret, and my role in this affair seems to remain unknown. \n\n"
 quix_murder_outcome.2003.a.discovered:0 "Oh my god... that bottle of wine was poisoned? Fortunately, I didn't drink it!"
 quix_murder_outcome.2003.a:0 "Finally, [target.GetSheHe] died from excessive drinking [target.GetHerselfHimself]!"
 quix_murder_outcome.2004.t:0 "Dangerous Night Road"
 quix_murder_outcome.2004.opening_1:0 "[target.GetName] was enjoying his usual evening stroll when our assassin leaped out from the shadows with a dagger. [target.GetHerHis] attempted to flee... but was knocked down and stabbed to death in the darkness by the assassin. [target.GetTitledFirstName]"
 quix_murder_outcome.2004.opening_2:0 "While [target.GetTitledFirstName] was still in shock, the cold dagger had already stabbed deeply into [target.GetHerHis]'s throat, with blood continuously flowing out. After a moment, [target.GetSheHe] lay dead in [target.GetHerHis]'s own pool of blood. This assassination mission was successful."
 quix_murder_outcome.2004.opening_3:0 "[target.GetTitledFirstName] was trailed by our assassins in the darkness, and the startled [target.GetHerHim] fled into the wilderness to evade pursuit by [target.GetHerHim], but all efforts were in vain; ultimately, [target.GetTitledFirstName] was stabbed mercilessly from behind by an assassin."
 quix_murder_outcome.2004.owner_is_known_1:0 "\n\nNot everything will go smoothly; a guard stationed not far from the crime scene successfully apprehended our assassin! Soon everyone will know that I was involved in this assassination plot!"
 quix_murder_outcome.2004.owner_is_known_2:0 "\n\nAn unfortunate event has occurred; shortly thereafter, the body was discovered, and our assassin was captured!"
 quix_murder_outcome.2004.no_awareness_1:0 "\n\nAnd after emptying the wallet of [target.GetTitledFirstNamePossessive], it looks like a murder triggered by a robbery."
 quix_murder_outcome.2004.no_awareness_2:0 "\n\nOur assassins successfully escaped the scene under the cover of darkness, leaving behind only a cold corpse."
 quix_murder_outcome.2004.a.discovered:0 "The night is so pitch-black, so perilous! Such an incident was inevitable..."
 quix_murder_outcome.2004.a:0 "Excellent..."
 quix_murder_outcome.2005.t:0 "Dangerous Falling Rocks"
 quix_murder_outcome.2005.opening_1:0 "[target.GetTitledFirstName] was instantly killed under the crushing weight of falling rocks, [target.GetHerHis] not even knowing how they died."
 quix_murder_outcome.2005.opening_2:0 "[target.GetTitledFirstName] is dead; [target.GetSheHe] crushed to death by falling rocks, [target.GetHerHis] limbs mangled beyond recognition, [target.GetSheHe] already deceased before being rescued by the guards."
 quix_murder_outcome.2005.opening_3:0 "It seemed that [target.GetTitledFirstName] heard the sound of bricks and stones shattering, turned around in the last second, and let out a bloody scream as the massive stone smashed [target.GetHerHim]."
 quix_murder_outcome.2005.owner_is_known_1:0 "\n\n Unfortunately, our assassin also fell from the city wall. The guards then captured him alive, and soon everyone will know that I was involved in this assassination plot!"
 quix_murder_outcome.2005.owner_is_known_2:0 "\n\nHowever, our assassin was discovered by the guards while attempting to descend from the city wall and was captured alive. Soon everyone will know that I participated in this assassination plot!"
 quix_murder_outcome.2005.no_awareness_1:0 "\n\n Everyone seems to attribute this incident to some kind of accident... I think so too!"
 quix_murder_outcome.2005.no_awareness_2:0 "It appears to have been nothing more than a tragic accident. Even if anyone had suspicions, they certainly wouldn't suspect me. \n\n"
 quix_murder_outcome.2005.a.discovered:0 "This incident reminded me to summon the artisans and have them inspect our city walls once more..."
 quix_murder_outcome.2005.a:0 "How was he crushed to death? I really want to go see the scene myself."
 quix_murder_outcome.2006.t:0 "Neglect of Duty"
 quix_murder_outcome.2006.opening_1:0 "The plan to assassinate [target.GetName] is proceeding smoothly. That servant's money allowed our assassin to enter the target's bedroom before sunrise."
 quix_murder_outcome.2006.opening_2:0 "[target.GetTitledFirstName]seized the servant who betrayed [target.GetHerHis]; even on his/her deathbed, [target.GetHerHis]cursed the traitor rather than the assassin."
 quix_murder_outcome.2006.opening_3:0 "After being let in by a disloyal servant, [target.GetTitledFirstName] was killed! They were brought to the private quarters, completely unaware, until the door opened and the assassin leaped inside."
 quix_murder_outcome.2006.owner_is_known_1:0 "\n\n Unfortunately, this assassination was not carried out silently; the assassins alerted the guards! We must prepare for the worst."
 quix_murder_outcome.2006.owner_is_known_2:0 "The assassin was arrested shortly after killing the target; by the time the body was discovered, everyone would know I was involved in this assassination plot! \n\n"
 quix_murder_outcome.2006.no_awareness_1:0 "\n\nWith the help of that servant, things went much smoother; our assassin completed the assassination mission and escaped unharmed before the guards even noticed."
 quix_murder_outcome.2006.no_awareness_2:0 "After \n\n killed [target.GetTitledFirstName], our assassin quietly left the crime scene."
 quix_murder_outcome.2006.a.discovered:0 "Oh my god... the bottle of wine I drank was poisoned? Fortunately, I didn't drink it!"
 quix_murder_outcome.2006.a:0 "Finding a good helper these days is so hard!"
 quix_murder_outcome.2007.t:0 "A Bold Assault"
 quix_murder_outcome.2007.opening_1:0 "[target.GetTitledFirstName] was beheaded by our warriors in the bedroom of [target.GetHerHis]! This raid was highly successful."
 quix_murder_outcome.2007.opening_2:0 "[target.GetName] was discovered asleep by our people, and they severed the throat of [target.GetHerHis]!"
 quix_murder_outcome.2007.opening_3:0 "Our men rushed in while [target.GetTitledFirstName] was having sex and knocked down [target.GetHerHim]!"
 quix_murder_outcome.2007.owner_is_known_1:0 "\n\n Unfortunately, not everything goes according to plan. These individuals were spotted by the guards upon entry and had to turn back! Some were injured, others captured—already mentioned!"
 quix_murder_outcome.2007.owner_is_known_2:0 "Although this surprise raid proceeded smoothly, it seems some participants may have acted out of loyalty. It appears that as long as a price is paid, one among them has already leaked the details of this plan, including my involvement! Despicable betrayal! \n\n"
 quix_murder_outcome.2007.no_awareness_1:0 "\n\nThese individuals were able to subdue anyone who stood in their path and flee back along the route they had come, completing the entire process in just a few minutes."
 quix_murder_outcome.2007.no_awareness_2:0 "Although the surprise attack succeeded, alarms were raised when these individuals attempted to flee, forcing them to make a desperate escape! Fortunately, they managed to reach the stables and departed stylishly on stolen mounts! No one was captured, and the identity of the attackers remains unknown! \n\n"
 quix_murder_outcome.2007.a.discovered:0 "Let them hate me. As long as they fear me."
 quix_murder_outcome.2007.a:0 "The men have eaten well tonight!"
 quix_murder_outcome.2008.t:0 "Nightwalker"
 quix_murder_outcome.2008.opening_1:0 "Our knights killed [target.GetTitledFirstNamePossessive]. He emerged from an abandoned hut, charged through his companions in [target.GetTitledFirstNamePossessive], and thrust a spear into [target.GetTitledFirstNamePossessive]'s heart before anyone knew what had happened!"
 quix_murder_outcome.2008.opening_2:0 "[target.GetName] has been killed. Our rider loosed an arrow from the woods and slew [target.GetName] on the spot!"
 quix_murder_outcome.2008.opening_3:0 "[target.GetName] has finally perished. Our stable boy rode past the retinue on horseback, drew his sword at the last moment, slew [target.GetTitledFirstName], and then galloped away."
 quix_murder_outcome.2008.owner_is_known_1:0 "\n\n Unfortunately, the horse stumbled, and the rider lost his seat. He was taken away, and the plot has already been revealed!"
 quix_murder_outcome.2008.owner_is_known_2:0 "Unfortunately for him, the rider crashed directly into a guard patrol that had heard the screams! The conspiracy has been exposed. \n\n"
 quix_murder_outcome.2008.no_awareness_1:0 "\n\n On our finest steed, our rider cannot outrun the pursuers; he has vanished into the woods!"
 quix_murder_outcome.2008.no_awareness_2:0 "\n\nOur riders have already left before anyone knew what had happened!"
 quix_murder_outcome.2008.a.discovered:0 "Poor fool for mistaking [target.GetName] for some evil beast; this is a forgivable error!"
 quix_murder_outcome.2008.a:0 "This road is extremely dangerous."
 quix_murder_outcome.2009.t:0 "Brave Blood Inscription"
 quix_murder_outcome.2009.opening_1:0 "[target.GetName] is dead! Our fake blood scribe drained [target.GetHerHim] completely and instructed the caretakers that [target.GetSheHe] must enter a deep sleep state and not be disturbed for an extended period."
 quix_murder_outcome.2009.opening_2:0 "[target.GetName] has already been eliminated by our impostors! Finally, [target.GetSheHe] handed over [target.GetHerHis]'s wrist to the assassin, closed [target.GetHerHis]'s eyes one last time, and lay down on some pillows to rest."
 quix_murder_outcome.2009.opening_3:0 "[target.GetName] welcomed the impostor into his home and even extended his wrist to accept bloodletting. Only when he lost too much blood did [target.GetSheHe] realize he had trusted the wrong person."
 quix_murder_outcome.2009.owner_is_known_1:0 "\n\nHowever, before our impostor could leave, they were discovered by those familiar with the true Blood Word! Our conspiracy has been uncovered!"
 quix_murder_outcome.2009.owner_is_known_2:0 "\n\nBut before we could leave, we were discovered and our people were captured! Now the whole thing is known."
 quix_murder_outcome.2009.no_awareness_1:0 "\n\nOur fake blood characters thus walked out of the gate and disappeared into the night!"
 quix_murder_outcome.2009.no_awareness_2:0 "\n\nHowever, before our men could flee, several others in the residence demanded his services! He spent the entire night bleeding others, then escaped at dawn. He spent a whole night bleeding others, then fled at daybreak."
 quix_murder_outcome.2009.a.discovered:0 "I sent my best blood letter; [target.GetSheHe] should feel honored!"
 quix_murder_outcome.2009.a:0 "All ailments of [target.GetSheHe] have been cured forever."
 quix_murder_outcome.2010.t:0 "Masked Assassin"
 quix_murder_outcome.2010.opening_1:0 "At the climax of the masquerade ball, [target.GetName] was killed in the dance floor! Our assassin, blending into the crowd, distracted them and stabbed [target.GetTitledFirstNamePossessive] in the back with a dagger!"
 quix_murder_outcome.2010.opening_2:0 "[target.GetName] was killed in the arena, before all the spectators. As our dagger pierced [target.GetHerHis]'s chest, they stood there in shock, thinking this was some bizarre act of stupidity!"
 quix_murder_outcome.2010.opening_3:0 "Our assassins have dragged [target.GetName] from the crowd into a secluded room—[target.GetSheHe] died screaming!"
 quix_murder_outcome.2010.owner_is_known_1:0 "\n\nOur men have fled, but one of them, covered in blood, has been captured! Our involvement is well known!"
 quix_murder_outcome.2010.owner_is_known_2:0 "\n\nHowever, there were many people fighting among the crowd. When [target.GetName] began to scream, a brawl erupted! Several of us were injured and captured; this plan is already common knowledge!"
 quix_murder_outcome.2010.no_awareness_1:0 "\n\n Our men fled in the chaos; once they reached a dark spot, they discarded their masks and long robes, wiped away bloodstains, and immediately dispersed one by one. Not a single person was caught!"
 quix_murder_outcome.2010.no_awareness_2:0 "\n\nThen, these individuals bravely emerged from the incident. Due to their anonymity within the crowd, they were able to overwhelm any opposition against them. No one was arrested, and it seemed that no one discovered our involvement."
 quix_murder_outcome.2010.a.discovered:0 "It sounds like just a noisy gathering; what does it have to do with me?"
 quix_murder_outcome.2010.a:0 "I should have gone myself; it would be quite interesting."
 quix_murder_outcome.2011.t:0 "Foreign Warrior"
 quix_murder_outcome.2011.opening_1:0 "[target.GetName] is already dead! As it turns out, this stranger was indeed a capable assassin, just as we had learned."
 quix_murder_outcome.2011.opening_2:0 "[target.GetTitledFirstNamePossessive] had his throat slit by the strange curved blade wielded by our hired assassin, completing the contract."
 quix_murder_outcome.2011.opening_3:0 "The assassin we hired—the foreign hero—secretly infiltrated the headquarters of [target.GetName] and successfully ended the life of [target.GetHerHis]!"
 quix_murder_outcome.2011.owner_is_known_1:0 "\n\nHowever, it turns out that this foreigner was not as good at escaping as we had been told; he has been captured!"
 quix_murder_outcome.2011.owner_is_known_2:0 "\n\nUnfortunately, although the assassin managed to escape the mansion, he was captured not far away due to his unfamiliarity with the area!"
 quix_murder_outcome.2011.no_awareness_1:0 "\n\n The warriors vanished immediately after completing their contracts! At least, that's what the guards believed. Our involvement and many details remained unknown!"
 quix_murder_outcome.2011.no_awareness_2:0 "\n\nThen, these individuals heroically struggled out of the incident. Due to their anonymity within the crowd, they were able to overwhelm any opposition against them. Not a single person was taken away!"
 quix_murder_outcome.2011.a.discovered:0 "Perhaps next time we should keep it inside..."
 quix_murder_outcome.2011.a:0 "He will dine with us tonight!"
 quix_murder_outcome.2012.t:0 "Cry and wail!"
 quix_murder_outcome.2012.opening_1:0 "[target.GetTitledFirstName] died screaming, torn apart by ferocious war dogs."
 quix_murder_outcome.2012.opening_2:0 "[target.GetTitledFirstName]runs out from the pack of dogs but is no match for wild beasts."
 quix_murder_outcome.2012.opening_3:0 "The throat of [target.GetTitledFirstNamePossessive] was torn open by our war dogs. We have finally succeeded in killing [target.GetHerHim]."
 quix_murder_outcome.2012.owner_is_known_1:0 "\n\nBut [target.GetSheHe]'s cry for help alerted the guards. The hunting dog was killed, the beast tamer was arrested, and during interrogation he revealed my name."
 quix_murder_outcome.2012.owner_is_known_2:0 "\n\n Subsequently, the starving dog, disregarding the trainer's timidity, began devouring the prey. Within minutes, this horrifying scene was discovered, and the trainer was consequently captured! Under coercion, he seemingly revealed my name."
 quix_murder_outcome.2012.no_awareness_1:0 "\n\n The dogs and their trainers simply walked back along the road and returned here without being stopped."
 quix_murder_outcome.2012.no_awareness_2:0 "The plan proceeds smoothly, estimated to be attributed to wolves, lions, chimeras, and others. \n\n"
 quix_murder_outcome.2012.a.discovered:0 "What a beast could do, how can I blame myself?"
 quix_murder_outcome.2012.a:0 "Good boy."
 quix_murder_outcome.2013.t:0 "Bloodstained Pool"
 quix_murder_outcome.2013.opening_1:0 "[target.GetTitledFirstName] was murdered by our people while bathing. They captured [target.GetHerHim], who was unaware, alone and defenseless; despite begging for mercy, they successfully killed [target.GetHerHim]."
 quix_murder_outcome.2013.opening_2:0 "Today, the blood of [target.GetName], slain by our assassins, has stained the healing pool red."
 quix_murder_outcome.2013.opening_3:0 "[target.GetTitledFirstName] attempted to fight our men while naked and engaged in a surprising battle, only to be drowned in their bathtub."
 quix_murder_outcome.2013.owner_is_known_1:0 "\n\nBut it seems the screams of [target.GetTitledFirstName] echoed through the bathing hall, alerting the guards. The guards arrived and were able to capture us!"
 quix_murder_outcome.2013.owner_is_known_2:0 "\n\n This battle left our assassins bleeding profusely. They didn't wash the blood off; instead, they fled. Soon after, they were discovered, covered in blood! They were captured, and we now know who among them played a role in this."
 quix_murder_outcome.2013.no_awareness_1:0 "\n\nThese people managed to escape unharmed, so our involvement remains unknown."
 quix_murder_outcome.2013.no_awareness_2:0 "The sounds of combat drew the attention of other bathhouse patrons, who were also dispatched by our assassins and subsequently departed. With no witnesses left, it is impossible for anyone to locate me now! \n\n"
 quix_murder_outcome.2013.a.discovered:0 "I believe this is a reshuffle."
 quix_murder_outcome.2013.a:0 "[target.GetFirstNameNoTooltip] is... all washed away?"
 quix_murder_outcome.2014.t:0 "Encounter"
 quix_murder_outcome.2014.opening_1:0 "I walked straight up behind [target.GetName], who stood motionless by the river, lost in thought. I shoved him, and he fell into the rushing water below! Our gazes met for only a moment before [target.GetHerHim]'s head was submerged. In the brief exchange of glances before [target.GetHerHis]'s head sank beneath the surface for the last time, I believe I was smiling."
 quix_murder_outcome.2014.opening_2:0 "Although I tried to move silently, [target.GetName] must have heard my approach and turned at the last moment. Farewell, I said as I pushed [target.GetHerHim] backward into the rushing river!"
 quix_murder_outcome.2014.opening_3:0 "I sprinted forward, using all my strength to kick [target.GetTitledFirstName] hard, sending them tumbling like a projectile into the rushing waters below. They crashed violently onto some rocks and drifted downstream like corpses."
 quix_murder_outcome.2014.owner_is_known_1:0 "\n\n Alas, my courage was too great; there is an unseen witness to my crimes!"
 quix_murder_outcome.2014.owner_is_known_2:0 "\n\nIt seems [target.GetSheHe] briefly reached a rock, where [target.GetSheHe] could shout to passersby that I had pushed [target.GetHerHim]! Even so, [target.GetSheHe] had been driven against the rock. Moments later, that grip of [target.GetHersHis] gave way, and the current swept the victim back into the river, presumably out to sea."
 quix_murder_outcome.2014.no_awareness_1:0 "\n\n I continued walking forward, spending the most pleasant afternoon."
 quix_murder_outcome.2014.no_awareness_2:0 "It seems \n\n thinks everyone agrees that [target.GetName] must have slipped!"
 quix_murder_outcome.2014.a.discovered:0 "That's not me; it's an imposter! I've been framed!"
 quix_murder_outcome.2014.a:0 "I thought I had made things too complicated."
 quix_murder_outcome.2015.t:0 "Under the bright sun"
 quix_murder_outcome.2015.opening_1:0 "[target.GetName] was captured by our people in the marketplace, taken away at a corner, and swiftly dispatched."
 quix_murder_outcome.2015.opening_2:0 "It seems that a conflict arose between our people and [target.GetName], who killed [target.GetHerHim] in the street, shocking everyone."
 quix_murder_outcome.2015.opening_3:0 "Our assassins set up stalls in the marketplace and, as soon as [target.GetName] wandered by, suddenly thrust a spear through [target.GetHerHis]'s heart."
 quix_murder_outcome.2015.owner_is_known_1:0 "The reputation of \n\n quickly rose, one of our subordinates was captured. It seems he has already revealed my name!"
 quix_murder_outcome.2015.owner_is_known_2:0 "\n\nHowever, the crowd turned against our people, and several individuals were caught while attempting to flee! Our involvement seems to have been exposed. It appears that our participation has already been revealed."
 quix_murder_outcome.2015.no_awareness_1:0 "\n\nThese individuals fled on foot; details of our involvement are unknown."
 quix_murder_outcome.2015.no_awareness_2:0 "\n\nThis single act of violence somehow triggered a riot! Fortunately, our people escaped unharmed in the chaos, while our role within it remains unknown!"
 quix_murder_outcome.2015.a.discovered:0 "I would never be so bold!"
 quix_murder_outcome.2015.a:0 "The best plan is a direct one."
 quix_murder_outcome.2016.t:0 "Captured Kill"
 quix_murder_outcome.2016.opening_1:0 "[target.GetTitledFirstName] stands before me! Captured by our people, they provided a chaotic confession listing several agencies, [target.GetName] subduing the enemy without fighting. The leader is sharpening an axe in the dungeon while we speak; [target.GetSheHe] has already died."
 quix_murder_outcome.2016.opening_2:0 "We have successfully captured [target.GetTitledFirstName]. Our assassin stopped a carriage that looked exactly as [target.GetSheHe] expected! When [target.GetSheHe] finally asked about the whereabouts of the carriage, it was too late."
 quix_murder_outcome.2016.opening_3:0 "We have successfully captured [target.GetTitledFirstName]. Finally, with only a burlap sack over their head and a nearby hay cart. [target.GetTitledFirstName] is busy begging for mercy while my lieutenants prepare to intercept. I truly enjoy this sound."
 quix_murder_outcome.2016.owner_is_known_1:0 "\n\n Unfortunately, one of them was bribed and revealed my involvement! That despicable traitor."
 quix_murder_outcome.2016.owner_is_known_2:0 "\n\nBut one of our assassins boasted about this plan! Now our involvement is already common knowledge."
 quix_murder_outcome.2016.no_awareness_1:0 "\n\nIt seems no one can track me down."
 quix_murder_outcome.2016.no_awareness_2:0 "\n\nNow I can leisurely enjoy a world without [target.GetName]!"
 quix_murder_outcome.2016.a.discovered:0 "I never intended to harm [target.GetTitledFirstName]; I only wanted to scare [target.GetHerHim], but things got out of hand!"
 quix_murder_outcome.2016.a:0 "Before we dispatch [target.GetHerHim], I have prepared a speech draft..."
 quix_murder_outcome.2017.t:0 "Exotic Weapon"
 quix_murder_outcome.2017.opening_1:0 "After the assassination attempt in [target.GetName], his complexion turned blue and he died from loss of breath. Our assassin waited outside the window of [target.GetHerHis] for several hours, biding time for the perfect moment to strike."
 quix_murder_outcome.2017.opening_2:0 "This strange weapon seemed to work; with just a touch of poison, it killed [target.GetName] on the small needle shot by an unseen assassin."
 quix_murder_outcome.2017.opening_3:0 "Although this strange weapon was novel, it proved to be effective. [target.GetName] Upon catching the dart through the open window, you turn blue and die. The plot has succeeded!"
 quix_murder_outcome.2017.owner_is_known_1:0 "\n\nUnfortunately, our assassins were originally less effective than weapons, and they were quickly captured during subsequent escapes!"
 quix_murder_outcome.2017.owner_is_known_2:0 "Although our assassin initially evaded capture, the appearance of a matching dart was sufficient to convict him... and he did get convicted, so I am also guilty! \n\n"
 quix_murder_outcome.2017.no_awareness_1:0 "\n\n seems that [target.GetName] did not initially understand the significance of the small courier, taking it away before death. Our involvement remains unclear!"
 quix_murder_outcome.2017.no_awareness_2:0 "It seems \n\n was not discovered by those who participated in the dart, cause of death unknown! [target.GetName]"
 quix_murder_outcome.2017.a.discovered:0 "Well, this is awkward..."
 quix_murder_outcome.2017.a:0 "Hand me the weapon... I want to keep it."
 quix_murder_outcome.2018.t:0 "Do it yourself"
 quix_murder_outcome.2018.opening_1:0 "Around sunset, I put on my least conspicuous clothes, hiding a dagger inside, and stealthily slipped from the window of my quarters to [target.GetName]'s residence. I found [target.GetHerHim] resting by the fire, reached out my hand to [target.GetHerHis]'s mouth, and quietly whispered in [target.GetHerHis]'s ear: \"\" Goodbye, [target.GetName]\",\" just enough for [target.GetSheHe] to realize it was me. A moment later, [target.GetHerHis]'s lifeblood spilled onto [target.GetHerHis]'s legs!"
 quix_murder_outcome.2018.opening_2:0 "The final moments of [target.GetTitledFirstNamePossessive]... surreal. I quietly slipped into [target.GetHerHis]'s room and found [target.GetHerHim] sitting at a table by the fireplace. I approached unnoticed, then sat down before [target.GetTitledFirstName], who was shocked to see me. After an awkward pause, [target.GetSheHe] asked if I intended to kill [target.GetHerHim]. I confirmed it, calmly stating my reasons in a flat tone. [target.GetName]... accepted. It's strange that killing someone after clearly explaining what would happen feels like there's no resistance at all."
 quix_murder_outcome.2018.opening_3:0 "I think it's best to stay at a bustling inn, so in the dead of night, I left dressed head to toe in black. I climbed onto the terrace outside [target.GetTitledFirstName]'s room with my dagger clenched in my teeth and peered inside through the open gap. I found [target.GetHerHim] asleep and quickly made a move on [target.GetHerHim]."
 quix_murder_outcome.2018.owner_is_known_1:0 "\n\n I spent some time washing up and composing myself before leaving, but in a cursed lapse of memory, I left behind my dagger! It bears my personal seal; they will certainly know it was me!"
 quix_murder_outcome.2018.owner_is_known_2:0 "\n\nThe entire process went smoothly... until a passerby spotted me approaching from the window! Worse still, they immediately recognized me and burst into tears! I barely escaped with my life."
 quix_murder_outcome.2018.no_awareness_1:0 "\n\nI slowly flipped through [target.GetTitledFirstNamePossessive]'s personal influence, and even helped myself eat a bit of [target.GetHerHis]'s food. After finishing, I simply walked out, completely unseen by anyone. I believe I am an excellent assassin..."
 quix_murder_outcome.2018.no_awareness_2:0 "\n\n Just as I made my move, I vanished right then and reappeared through the window. The hardest part was concealing my joy when passing by some guards!"
 quix_murder_outcome.2018.a.discovered:0 "Many people look like me! That could be anyone!"
 quix_murder_outcome.2018.a:0 "As I often say, if I want to do things right..."
 quix_murder_outcome.2019.t:0 "Champion Fighter"
 quix_murder_outcome.2019.opening_1:0 "[target.GetName] is dead! When [target.GetSheHe] went out for a stroll, he was strangled by the mighty hand of our fighter. The deed is done!"
 quix_murder_outcome.2019.opening_2:0 "[target.GetName] weakly attempts a counterattack, but [target.GetSheHe] is no match for the fighter we hired! I truly wish I could witness this match. They say [target.GetName] was badly beaten; without the birthmark, [target.GetSheHe] would be unrecognizable."
 quix_murder_outcome.2019.opening_3:0 "To [target.GetName]'s credit, [target.GetHerHis] courage was enough to face our boxer directly. Considering the difference in experience, that stand of [target.GetHersHis] against a champion fighter lasted... quite some time. At last, our fighter's punishing blows broke through [target.GetHerHis] guard, knocking [target.GetHerHim] onto the hard ground before a devastating kick finished the job."
 quix_murder_outcome.2019.owner_is_known_1:0 "\n\nHowever, since there were witnesses present, the boxer seemed to lack caution in killing! He was captured shortly thereafter. Soon after that, he was arrested."
 quix_murder_outcome.2019.owner_is_known_2:0 "The Tunnel Warrior fled on foot after committing the crime but was pursued and captured! He has already been executed, and our involvement has been discovered. \n\n"
 quix_murder_outcome.2019.no_awareness_1:0 "\n\n[target.GetName]There is only one person, and it seems no witnesses have discovered our people. The entire transaction has no issues."
 quix_murder_outcome.2019.no_awareness_2:0 "\n\n But when the guards of [target.GetName] attempted to confront him, our warriors seemed to have knocked down [target.GetHerHim] as well! He successfully escaped, protecting his knuckles. He successfully fled, tending to his injured knuckles."
 quix_murder_outcome.2019.a.discovered:0 "Did he implicate me? I've never met him; this must be the result of years of having my head beaten."
 quix_murder_outcome.2019.a:0 "What a terrifying method. Simply marvelous."
 quix_murder_outcome.2020.t:0 "Secret Society"
 quix_murder_outcome.2020.opening_1:0 "[target.GetName] is dead! Killed by an assassin's blade in the toilet. Such an undignified end."
 quix_murder_outcome.2020.opening_2:0 "The throat of [target.GetTitledFirstNamePossessive] was slit in the night! Finally, we have escaped from [target.GetHerHim]. An unknown organization has completed its mission according to our agreement..."
 quix_murder_outcome.2020.opening_3:0 "This shadowy organization was once highly effective at assassinations. At a social gathering, [target.GetName] was killed!"
 quix_murder_outcome.2020.owner_is_known_1:0 "\n\nBut the assassin did not remain hidden as we had hoped, for he was immediately detained and had already revealed my name."
 quix_murder_outcome.2020.owner_is_known_2:0 "\n\nHowever, the other party deliberately left a copy of the contract, pinning all the blame on me. It seems this deal was a trap against me from the very beginning."
 quix_murder_outcome.2020.no_awareness_1:0 "It seems that the assassin came and went without being noticed, so our role in this matter remains unknown. \n\n"
 quix_murder_outcome.2020.no_awareness_2:0 "\n\nThe assassin was like a ghost, completely undetected. No one knew the slightest clue about my involvement."
 quix_murder_outcome.2020.a.discovered:0 "This was clearly the work of some malevolent mastermind, not me!"
 quix_murder_outcome.2020.a:0 "Can we keep them in their posts?"
 quix_murder_outcome.4001.t:0 "A warm and comfortable inn..."
 quix_murder_outcome.4001.failure_declaration_1:0 "[target.GetTitledFirstName] is still alive!"
 quix_murder_outcome.4001.failure_declaration_2:0 "Our plot to end [target.GetTitledFirstName]'s life has failed!"
 quix_murder_outcome.4001.failure_declaration_3:0 "Killing [target.GetTitledFirstName] is not as easy as I imagined. [target.GetTitledFirstName] is still alive."
 quix_murder_outcome.4001.desc:0 "\n\n The arsonist mistook the inn. [target.GetName] Unharmed, they even walked to the street to watch the fire."
 quix_murder_outcome.4001.exposed_scheme:0 "The arsonist has been caught; the conspiracy is exposed!"
 quix_murder_outcome.4001.not_exposed_scheme:0 "The arsonist was almost caught but managed to escape on foot. [target.GetName] Now they will surely be on guard."
 quix_murder_outcome.4001.a.discovered:0 "I would never stoop to such a base act as murdering [target.GetTitledFirstName]! These are all delusions born of madness."
 quix_murder_outcome.4001.a:0 "[target.GetFirstNameNoTooltip] should be considered a blessing of [target.GetHerHis]!"
 quix_murder_outcome.4001.b:0 "I believe there is no plan that can be foolproof..."
 quix_murder_outcome.4002.t:0 "An arrow is shot toward the balcony."
 quix_murder_outcome.4002.failure_declaration_1:0 "The arrow missed its target! [target.GetName] is still alive."
 quix_murder_outcome.4002.failure_declaration_2:0 "Our plot to end [target.GetTitledFirstName]'s life has failed!"
 quix_murder_outcome.4002.failure_declaration_3:0 "The plan to take [target.GetTitledFirstName]'s life with an arrow has failed, what a pity."
 quix_murder_outcome.4002.desc:0 "\n\nWhen the assassin loosed an arrow, a flying pigeon happened to block it. [target.GetTitledFirstName]Thus, he escaped disaster."
 quix_murder_outcome.4002.exposed_scheme:0 "This drew the attention of [target.GetName], and the assassin was discovered and captured!"
 quix_murder_outcome.4002.not_exposed_scheme:0 "Fortunately, the archers are nimble on their feet and managed to escape before being captured, so our role in this matter remains unknown."
 quix_murder_outcome.4002.a.discovered:0 "My men are just looking for food! Leave us alone!"
 quix_murder_outcome.4002.a:0 "I've had enough of [target.GetFirstNameNoTooltip]!"
 quix_murder_outcome.4002.b:0 "The archer should fire again..."
 quix_murder_outcome.4003.t:0 "Drunk to the point of stupor"
 quix_murder_outcome.4003.failure_declaration_1:0 "Unfortunately, [target.GetTitledFirstName] has not yet left this world."
 quix_murder_outcome.4003.failure_declaration_2:0 "I thought wine would certainly become a bait for [target.GetTitledFirstName], but unfortunately, the plan failed."
 quix_murder_outcome.4003.failure_declaration_3:0 "[target.GetTitledFirstName] hasn't finished [target.GetHerHis]'s last cup. Alas, [target.GetSheHe] is still alive, at least for now, until we have a better opportunity."
 quix_murder_outcome.4003.desc:0 "\n\n[target.GetName] was familiar with the taste of this wine and sensed something amiss before taking a sip. Unexpectedly, [target.GetHerHis]'s knowledge of fine wine saved him."
 quix_murder_outcome.4003.exposed_scheme:0 "Even worse, it seems I made a momentary lapse in judgment by signing my own name on the letter! What a foolish mistake!"
 quix_murder_outcome.4003.not_exposed_scheme:0 "Fortunately, there is no way to know if it was me who sent it. Let's just pretend it never happened!"
 quix_murder_outcome.4003.a.discovered:0 "This is not poison... give it a try!"
 quix_murder_outcome.4003.a:0 "At least it gave me a chance to drink it..."
 quix_murder_outcome.4003.b:0 "Next time, I will be even more... proactive."
 quix_murder_outcome.4004.t:0 "Nightmare"
 quix_murder_outcome.4004.failure_declaration_1:0 "It seems that the attempt to take a walk with [target.GetTitledFirstName] at dusk has failed!"
 quix_murder_outcome.4004.failure_declaration_2:0 "Our assassins cannot end [target.GetTitledFirstNamePossessive]'s life!"
 quix_murder_outcome.4004.failure_declaration_3:0 "The plot to kill [target.GetFirstName] has failed! The entire affair was in vain!"
 quix_murder_outcome.4004.desc:0 "\n\n[target.GetName] Detected the assassin lurking in ambush ahead of their approach and summoned guards before they could get close."
 quix_murder_outcome.4004.exposed_scheme:0 "The guards have caught him; the traitor has already spoken! Now everyone knows about this plan."
 quix_murder_outcome.4004.not_exposed_scheme:0 "Fortunately, our assassin managed to slip away in the cover of darkness before being captured!"
 quix_murder_outcome.4004.a.discovered:0 "This absolutely ruined my night!"
 quix_murder_outcome.4004.a:0 "I'm getting more and more tired of this game."
 quix_murder_outcome.4004.b:0 "Next time, you won't be so lucky..."
 quix_murder_outcome.4005.t:0 "Stone Cold"
 quix_murder_outcome.4005.failure_declaration_1:0 "We failed to crush the conspiracy of [target.GetTitledFirstName] like insects [target.GetSheHe] beneath a stone."
 quix_murder_outcome.4005.failure_declaration_2:0 "Today is truly a terrible start. I received news that [target.GetTitledFirstName] was not crushed under the rocks!"
 quix_murder_outcome.4005.failure_declaration_3:0 "The giant stone failed to crush [target.GetTitledFirstName]!"
 quix_murder_outcome.4005.desc:0 "\n\n and his co-conspirators failed to loosen the massive boulder in time. By the moment the stone finally fell, [target.GetName] had already vacated the spot, left only to watch his empty seat shatter beneath the impact."
 quix_murder_outcome.4005.exposed_scheme:0 "Our assassin was immediately captured and revealed my name!"
 quix_murder_outcome.4005.not_exposed_scheme:0 "Fortunately, from the city walls, our inept assassins were able to leap onto some rooftops and lose their pursuers. Our role in the plot remains unknown!"
 quix_murder_outcome.4005.a.discovered:0 "A massive boulder seems utterly secure..."
 quix_murder_outcome.4005.a:0 "Very good, [target.GetFirstNameNoTooltip] is not yet suffering enough from being crushed to death!"
 quix_murder_outcome.4005.b:0 "Next time, it will be an even simpler matter."
 quix_murder_outcome.4006.t:0 "Neglect of Duty"
 quix_murder_outcome.4006.failure_declaration_1:0 "Alas, our plan to end [target.GetName]'s life has failed."
 quix_murder_outcome.4006.failure_declaration_2:0 "Damn luck! [target.GetTitledFirstName] was not killed as scheduled."
 quix_murder_outcome.4006.failure_declaration_3:0 "Failed!"
 quix_murder_outcome.4006.desc:0 "\n\nThat servant never intended to honor the deal. The room was already ambushed, and the guards were waiting for my men to walk right into their trap."
 quix_murder_outcome.4006.exposed_scheme:0 "The entire plan is a trap! Now [target.GetTitledFirstName] knows about this plan!"
 quix_murder_outcome.4006.not_exposed_scheme:0 "\n\n However, for some reason, our assassin managed to escape despite all efforts. Those attempting to arrest him were pinned down by weapons and armor, while the assassin outpaced them during the foot chase and evaded capture throughout the entire night!"
 quix_murder_outcome.4006.a.discovered:0 "Ambush!"
 quix_murder_outcome.4006.a:0 "[target.GetFirstNameNoTooltip] might appear wiser than [target.GetSheHe]!"
 quix_murder_outcome.4006.b:0 "Setbacks are indeed setbacks."
 quix_murder_outcome.4007.t:0 "A Bold Assault"
 quix_murder_outcome.4007.failure_declaration_1:0 "I know the risk. The surprise attack to kill [target.GetTitledFirstName] failed."
 quix_murder_outcome.4007.failure_declaration_2:0 "The raid on [target.GetTitledFirstName] ended in failure!"
 quix_murder_outcome.4007.failure_declaration_3:0 "Our troops cannot kill [target.GetTitledFirstName]! This raid is a disaster."
 quix_murder_outcome.4007.desc:0 "My \n\n infiltrated the residence of [target.GetTitledFirstNamePossessive], where they encountered servants one after another. The commotion quickly alerted the guards, allowing [target.GetTitledFirstName] to escape in time."
 quix_murder_outcome.4007.exposed_scheme:0 "These individuals were captured after being confined in a room. Feeling their situation was desperate, they surrendered and abandoned my involvement!"
 quix_murder_outcome.4007.not_exposed_scheme:0 "The only good news is that they were able to escape before being captured."
 quix_murder_outcome.4007.a.discovered:0 "At least [target.GetTitledFirstName] knows I am someone to be feared!"
 quix_murder_outcome.4007.a:0 "It's only a matter of time, [target.GetFirstNameNoTooltip]!"
 quix_murder_outcome.4007.b:0 "I am weary of it all."
 quix_murder_outcome.4008.t:0 "Nightwalker"
 quix_murder_outcome.4008.failure_declaration_1:0 "[target.GetTitledFirstName] was not killed by our stable hands!"
 quix_murder_outcome.4008.failure_declaration_2:0 "The attempt to ambush [target.GetTitledFirstName] has failed!"
 quix_murder_outcome.4008.failure_declaration_3:0 "Curse! [target.GetTitledFirstName] is still alive. Our riders failed to kill [target.GetHerHim]!"
 quix_murder_outcome.4008.desc:0 "There happens to be an excellent archer standing beside \n\n[target.GetName]. Before the assassin could get close, he was shot from his horse by an arrow."
 quix_murder_outcome.4008.exposed_scheme:0 "The stable hand was captured alive and revealed my name during interrogation!"
 quix_murder_outcome.4008.not_exposed_scheme:0 "The only slim chance is that the person was killed in the collision, unable to reveal my role in the plot."
 quix_murder_outcome.4008.a.discovered:0 "Very well, let [target.GetTitledFirstName] know that I will witness the death of [target.GetHerHim]!"
 quix_murder_outcome.4008.a:0 "You will pay the price one day, [target.GetFirstNameNoTooltip]!"
 quix_murder_outcome.4008.b:0 "However, the matter of the horses is regrettable."
 quix_murder_outcome.4009.t:0 "Brave Blood Inscription"
 quix_murder_outcome.4009.failure_declaration_1:0 "[target.GetTitledFirstName] is still alive, at least for now."
 quix_murder_outcome.4009.failure_declaration_2:0 "Alas, [target.GetTitledFirstName] did not die from bloodshed. What a pity."
 quix_murder_outcome.4009.failure_declaration_3:0 "Our plan to use a fake to impersonate Bloodhand and kill [target.GetTitledFirstName] seems to have failed."
 quix_murder_outcome.4009.desc:0 "\n\nJust as the bloodletting was about to begin, a genuine physician suddenly appeared. The impostor was immediately exposed, and [target.GetTitledFirstName] was also instantly protected."
 quix_murder_outcome.4009.exposed_scheme:0 "When the imposter admitted that he was an assassin sent by me, it caused even greater commotion!"
 quix_murder_outcome.4009.not_exposed_scheme:0 "Fortunately, our aspiring assassin can still pretend to be impersonating the Blood Sect out of mere respect! After a few awkward exchanges, he packs his belongings and hurriedly departs."
 quix_murder_outcome.4009.a.discovered:0 "It's a complete mess!"
 quix_murder_outcome.4009.a:0 "I really want to make [target.GetFirstNameNoTooltip] flow like a river of blood!"
 quix_murder_outcome.4009.b:0 "It's just bad luck."
 quix_murder_outcome.4010.t:0 "Masked Assassin"
 quix_murder_outcome.4010.failure_declaration_1:0 "What really gets on my nerves is that [target.GetTitledFirstName] is still alive."
 quix_murder_outcome.4010.failure_declaration_2:0 "The plan to kill [target.GetTitledFirstName] at the masquerade ball has completely failed."
 quix_murder_outcome.4010.failure_declaration_3:0 "What bad luck! [target.GetTitledFirstName] was not killed by our assassins!"
 quix_murder_outcome.4010.desc:0 "\n\nAll guests wore masks, and my men could never determine who was [target.GetTitledFirstName]. By the end of the gathering, the assassin still had not found his target."
 quix_murder_outcome.4010.exposed_scheme:0 "After hours of effort, the target they selected turned out to be wrong! [target.GetTitledFirstName] was never involved at all! Our people were quickly captured. Who dares to speak?"
 quix_murder_outcome.4010.not_exposed_scheme:0 "Nothing happened except that our inept assassins spent a pleasant night!"
 quix_murder_outcome.4010.a.discovered:0 "It's just a case of mistaking one person for another!"
 quix_murder_outcome.4010.a:0 "It sounds like everyone has spent a wonderful time together, but unfortunately! I do not know."
 quix_murder_outcome.4010.b:0 "We should wait a little longer."
 quix_murder_outcome.4011.t:0 "Foreign Warrior"
 quix_murder_outcome.4011.failure_declaration_1:0 "The hired assassin failed to kill [target.GetTitledFirstName]!"
 quix_murder_outcome.4011.failure_declaration_2:0 "The plot to assassinate [target.GetTitledFirstName] has failed! The foreign assassins were not as effective as we had hoped."
 quix_murder_outcome.4011.failure_declaration_3:0 "Learning that [target.GetTitledFirstName] was not killed by that strange assassin, I am heartbroken!"
 quix_murder_outcome.4011.desc:0 "\n\nThe attire and weaponry of that foreign warrior were too conspicuous, quickly drawing the guards' interrogation. During the search, they also discovered the route map I had provided, exposing the murder plot."
 quix_murder_outcome.4011.not_exposed_scheme:0 "\n\nGood thing he can't be bound to me; he doesn't even know my name!"
 quix_murder_outcome.4011.exposed_scheme:0 "The file also contains details of the payment and instructions for remittance to me! Unfortunately, our names are on top."
 quix_murder_outcome.4011.a.discovered:0 "This is a misunderstanding; his meaning was lost in translation!"
 quix_murder_outcome.4011.a:0 "I'm tired of this!"
 quix_murder_outcome.4011.b:0 "Perhaps next time I can send two assassins to..."
 quix_murder_outcome.4012.t:0 "Cry and wail!"
 quix_murder_outcome.4012.failure_declaration_1:0 "Our plan to have [target.GetTitledFirstName] dragged to death by war dogs is regretfully unfulfilled."
 quix_murder_outcome.4012.failure_declaration_2:0 "Imagining [target.GetTitledFirstName] being killed by a dog brought me such joy, but unfortunately, the plan failed."
 quix_murder_outcome.4012.failure_declaration_3:0 "Perhaps sending a dog to kill [target.GetTitledFirstName] is not the best idea."
 quix_murder_outcome.4012.desc:0 "\n\n[target.GetName]Carrying dried meat with him, he timely soothed the hunting dogs with food. The hungry pack of dogs then turned on the beast tamer instead, and the plan was a complete failure."
 quix_murder_outcome.4012.exposed_scheme:0 "The assassin was captured after being brutally beaten. When they threatened to unleash the dogs a second time, he revealed my name!"
 quix_murder_outcome.4012.not_exposed_scheme:0 "The only mercy today is that the man was killed by his own dog before he could implicate me!"
 quix_murder_outcome.4012.a.discovered:0 "Bad dog!"
 quix_murder_outcome.4012.a:0 "[target.GetFirstNameNoTooltip], you have escaped the fate you truly deserved!"
 quix_murder_outcome.4012.b:0 "I will not let this ruin my day."
 quix_murder_outcome.4013.t:0 "Bloodstained Pool"
 quix_murder_outcome.4013.failure_declaration_1:0 "Unfortunately, [target.GetTitledFirstName] has not yet left this world."
 quix_murder_outcome.4013.failure_declaration_2:0 "How I wish to fall asleep tonight in a world without [target.GetName], but unfortunately, that is not the case."
 quix_murder_outcome.4013.failure_declaration_3:0 "[target.GetTitledFirstName] is a slippery toad! I thought I had mastered [target.GetHerHim], but [target.GetSheHe] still lives."
 quix_murder_outcome.4013.desc:0 "\n\nThe assassin drew a dagger from his towel, and [target.GetTitledFirstName]also retrieved the concealed weapon. [target.GetSheHe]Defend against the attack until the guards arrive upon hearing the commotion."
 quix_murder_outcome.4013.exposed_scheme:0 "The assassins fled the bath in panic, but everyone present recognized them and knew they were acting on my orders."
 quix_murder_outcome.4013.not_exposed_scheme:0 "The assassin covered his face with a towel and escaped from the bathhouse. No one recognized him, and naturally, no one discovered my involvement."
 quix_murder_outcome.4013.a.discovered:0 "It sounds like the responsibility for this lovers' quarrel lies with me!"
 quix_murder_outcome.4013.a:0 "At least the men have suffered enough humiliation."
 quix_murder_outcome.4013.b:0 "A baptism."
 quix_murder_outcome.4014.t:0 "Encounter"
 quix_murder_outcome.4014.failure_declaration_1:0 "Despite my best efforts, [target.GetTitledFirstName] still didn't drown in that river!"
 quix_murder_outcome.4014.failure_declaration_2:0 "Against all expectations, [target.GetTitledFirstName] was not washed out to sea by the rushing river waters!"
 quix_murder_outcome.4014.failure_declaration_3:0 "I thought [target.GetTitledFirstName] would not survive jumping into the river, but I was wrong!"
 quix_murder_outcome.4014.desc:0 "\n\nI forcefully pushed [target.GetHerHim] from behind, but [target.GetSheHe] did not fall into the river; instead, he rolled down the slope and stopped on the shore."
 quix_murder_outcome.4014.exposed_scheme:0 "But I slipped and fell into the river, chasing [target.GetHerHim]! We were both swept into the river until we spotted a fisherman lowering his net from the bridge! We grabbed the net and were pulled ashore, gasping for breath. As soon as I stood up, I set off, but [target.GetTitledFirstName] knew I wanted to kill [target.GetHerHim]!"
 quix_murder_outcome.4014.not_exposed_scheme:0 "But [target.GetSheHe] landed on a shallow ledge above the rocks, sustaining only minor injuries. Then [target.GetSheHe] began calling for help, so I fled before others could see me. Perhaps, at the very least, ruining [target.GetTitledFirstName] today was satisfying, but I hope to gain more!"
 quix_murder_outcome.4014.a.discovered:0 "I slipped and fell!"
 quix_murder_outcome.4014.a:0 "Cursed be you, [target.GetFirstNameNoTooltip]!"
 quix_murder_outcome.4014.b:0 "I should just press [target.GetHerHim] down."
 quix_murder_outcome.4015.t:0 "Under the bright sun"
 quix_murder_outcome.4015.failure_declaration_1:0 "Our people did not kill [target.GetTitledFirstName]."
 quix_murder_outcome.4015.failure_declaration_2:0 "The plot to assassinate [target.GetTitledFirstName] in the marketplace has failed!"
 quix_murder_outcome.4015.failure_declaration_3:0 "Alas, if success is not achieved, what plan could be more direct than directly assassinating [target.GetTitledFirstName]?"
 quix_murder_outcome.4015.desc:0 "\n\n[target.GetName] remained constantly surrounded by a crowd. When the assassin barely managed to approach, he was immediately blocked by everyone and had to give up the attack."
 quix_murder_outcome.4015.exposed_scheme:0 "An old vegetable vendor wielding a staff emerged from her stall and launched a fierce assault on the assassins, knocking one unconscious! The others fled, but the captured individual has already exposed my involvement!"
 quix_murder_outcome.4015.not_exposed_scheme:0 "Our assassins were forced to flee the market, pursued on foot by a mob of angry rioters. They spent an entire day being chased by riders but ultimately managed to escape. At least our involvement in this operation remains unknown."
 quix_murder_outcome.4015.a.discovered:0 "I believe we will also become a laughingstock!"
 quix_murder_outcome.4015.a:0 "Indeed, it is unfortunate."
 quix_murder_outcome.4015.b:0 "Do not lose heart."
 quix_murder_outcome.4016.t:0 "Captured Kill"
 quix_murder_outcome.4016.failure_declaration_1:0 "The plot to assassinate [target.GetTitledFirstName] failed."
 quix_murder_outcome.4016.failure_declaration_2:0 "Lost! [target.GetTitledFirstName] is still alive, still holding onto [target.GetHerHis]..."
 quix_murder_outcome.4016.failure_declaration_3:0 "[target.GetTitledFirstName] was not captured, and [target.GetSheHe] was not killed! This is truly disappointing. It's so disappointing."
 quix_murder_outcome.4016.desc:0 "\n\n[target.GetName] had originally believed the fake order, but unexpectedly, the person mentioned by the conspirator happened to be right nearby. The ruse was exposed on the spot, and the impersonated messenger could only flee."
 quix_murder_outcome.4016.exposed_scheme:0 "The situation soon turned around; our people were captured and forced to speak!"
 quix_murder_outcome.4016.not_exposed_scheme:0 "The only advantage is that these individuals can attribute this situation to poor communication and hastily withdraw. Fortunately, our role in this foolish incident remains unknown."
 quix_murder_outcome.4016.a.discovered:0 "I'm really looking forward to seeing [target.GetTitledFirstName]'s expression!!"
 quix_murder_outcome.4016.a:0 "How disappointing."
 quix_murder_outcome.4016.b:0 "I think we're back to square one again."
 quix_murder_outcome.4017.t:0 "Exotic Weapon"
 quix_murder_outcome.4017.failure_declaration_1:0 "[target.GetTitledFirstName] was not sent by our assassins!"
 quix_murder_outcome.4017.failure_declaration_2:0 "It seems we should stick to more conventional means, because [target.GetTitledFirstName] has not been killed!"
 quix_murder_outcome.4017.failure_declaration_3:0 "This strange little dart did not end [target.GetTitledFirstName]'s life!"
 quix_murder_outcome.4017.desc:0 "\n\nThe assassin had never tested this weapon before, and upon firing, the dart was deflected into his own throat. [target.GetName]Suffered no harm at all."
 quix_murder_outcome.4017.not_exposed_scheme:0 "Fortunately, the assassin died almost immediately. He was not one of our known individuals, so they could not trace it back to me!"
 quix_murder_outcome.4017.a.discovered:0 "Idiot!"
 quix_murder_outcome.4017.a:0 "Bad luck."
 quix_murder_outcome.4017.b:0 "There are reasons why the traditional approach is popular..."
 quix_murder_outcome.4018.t:0 "Do it yourself"
 quix_murder_outcome.4018.failure_declaration_1:0 "How could I be so bold? So foolish? The plot to kill [target.GetTitledFirstName] has failed."
 quix_murder_outcome.4018.failure_declaration_2:0 "Oh, cruel fate! I failed to kill [target.GetTitledFirstName]."
 quix_murder_outcome.4018.failure_declaration_3:0 "My plan to kill [target.GetTitledFirstName] is not feasible..."
 quix_murder_outcome.4018.desc:0 "\n\nI successfully infiltrated the bedroom through the window, but was discovered by a maid as I approached the bedside. Her scream woke [target.GetTitledFirstName], forcing me to flee immediately."
 quix_murder_outcome.4017.exposed_scheme:0 "Unfortunately, I turned directly and bumped into a wooden beam—head first! I was knocked down and sat on the ground in shock. [target.GetName]I sat up on the bed at [target.GetHerHis], unable to believe it. We exchanged glances for a long time until I heard footsteps pounding outside; only then did I snap back to reality and stumbled out through the window. They sent hunting dogs to chase me, so I had no choice but to hide in the marshes for the night!"
 quix_murder_outcome.4018.not_exposed_scheme:0 "I quickly pulled up my headscarf, leaped out of the window, and instantly landed on a nearby rooftop. I had never seen that maid before, and with the sky so dark, I was certain my identity had not been revealed. From now on, I will no longer underestimate my opponents..."
 quix_murder_outcome.4018.a.discovered:0 "I'm such an idiot!"
 quix_murder_outcome.4018.a:0 "As the old saying goes wrong"
 quix_murder_outcome.4018.b:0 "Perhaps this is best left to the professionals..."
 quix_murder_outcome.4019.t:0 "Champion Fighter"
 quix_murder_outcome.4019.failure_declaration_1:0 "[target.GetTitledFirstName] was not killed by a brawler we hired!"
 quix_murder_outcome.4019.failure_declaration_2:0 "The person we hired to kill [target.GetTitledFirstName] failed."
 quix_murder_outcome.4019.failure_declaration_3:0 "[target.GetTitledFirstName] is still alive, thanks to the incompetence of the hired burly giant."
 quix_murder_outcome.4019.desc:0 "\n\nAfter the warrior found [target.GetName], he surprisingly asked the other party to confirm their identity first. [target.GetTitledFirstName]Denied outright, he led the assassin elsewhere and easily escaped the attack in this manner."
 quix_murder_outcome.4019.exposed_scheme:0 "[target.GetTitledFirstName]Go find the guards immediately; they've caught that fool and he's already confessed everything to us! My involvement in the conspiracy is now known to everyone."
 quix_murder_outcome.4019.not_exposed_scheme:0 "[target.GetTitledFirstName] let out a shout, forcing our brave warriors to hide in an empty tomb on the outskirts until nightfall. Fortunately, he escaped capture and returned here with his tail between his legs. At least it remains unknown whether we are implicated in this foolish incident."
 quix_murder_outcome.4019.a.discovered:0 "Why would you believe the words of someone who is clearly suffering from severe brain damage!?"
 quix_murder_outcome.4019.a:0 "What a pity, but there are more important things in life."
 quix_murder_outcome.4019.b:0 "It doesn't matter anymore; this is just part of the process..."
 quix_murder_outcome.4020.t:0 "Secret Society"
 quix_murder_outcome.4020.failure_declaration_1:0 "[target.GetTitledFirstName] was not killed by our assassins!"
 quix_murder_outcome.4020.failure_declaration_2:0 "[target.GetTitledFirstName] was not killed!"
 quix_murder_outcome.4020.failure_declaration_3:0 "It is a pity that [target.GetTitledFirstName] is still alive."
 quix_murder_outcome.4020.desc:0 "\n\nThe so-called mysterious organization vanished completely after receiving the money. From the very beginning, this was a scam."
 quix_murder_outcome.4020.exposed_scheme:0 "Perhaps the forces we have faced all along were loyal to [target.GetTitledFirstName]? Perhaps some unknown third party? But whoever it is, they have already revealed the details of the plan to [target.GetTitledFirstName], and now the whole matter is common knowledge."
 quix_murder_outcome.4020.not_exposed_scheme:0 "Our assassins have lost all contact with the organization through designated channels. Our observers report that they made no attempt to carry out the planned conspiracy. They simply vanished. Perhaps it was a ruse? A ruse? An unfulfilled conspiracy? I can only suspect as much. Fortunately, in any case, it seems there were no consequences, for no one attempted to extort me from [target.GetTitledFirstName], nor did any rumors surface. Now, it remains a mystery..."
 quix_murder_outcome.4020.a.discovered:0 "Can you not see that this entire affair is manufactured? A conspiracy by some anonymous online weaver."
 quix_murder_outcome.4020.a:0 "I've been played!"
 quix_murder_outcome.4020.b:0 "Perhaps it's a scam... but what an interesting business model..."
 quix_murder_outcome.5001.generic:0 "An assassin suddenly appeared before me. I only had time to feel a surge of terror before realizing the enemy had succeeded. As my consciousness faded, the last thought that crossed my mind was the unknown realm beyond death."
 quix_murder_outcome.5002.generic:0 "A trustworthy person just came in to tell me that someone attempted to assassinate me, but was foiled! Those bastards will have to work even harder if they want to catch me!"
 quix_murder_outcome.1201.t:0 "Swimming Lesson"
 quix_murder_outcome.1201.desc:0 "[acting_agent.GetTitledFirstName] learns that the young [target.GetTitledFirstName] will be staying at the lakeside manor. [acting_agent.GetSheHe] can take advantage of the lack of supervision to lead the child into the water, making a murder appear as an accidental drowning."
 quix_murder_outcome.1201.no_acting_agent:0 "My co-conspirator learned that the young [target.GetTitledFirstName] would be staying at the lakeside villa. They could take the child into the water when no one was watching, making a murder appear to be an accidental drowning."
 quix_murder_outcome.1201.a:0 "Swimming is such a... rare skill."
 quix_murder_outcome.1201.b:0 "This is too exaggerated!"
 quix_murder_outcome.1202.t:0 "Trojan Horse"
 quix_murder_outcome.1202.desc:0 "[acting_agent.GetTitledFirstName] prepares to anonymously gift [target.GetTitledFirstName] a finely crafted wooden horse. Hidden inside the horse is a venomous spider; its mechanism will activate when children play with it, disguising death as an unfortunate insect bite."
 quix_murder_outcome.1202.no_acting_agent:0 "My co-conspirator is preparing to anonymously gift a finely crafted Trojan Horse to [target.GetTitledFirstName]. Hidden within the horse are poisonous spiders; the mechanism will activate when children play with it, disguising death as an unfortunate insect bite."
 quix_murder_outcome.1202.a:0 "If Odysseus is satisfied, I am also satisfied."
 quix_murder_outcome.1202.b:0 "No... it's not like that."
 quix_murder_outcome.1203.t:0 "Fugitive"
 quix_murder_outcome.1203.desc:0 "[acting_agent.GetTitledFirstName] has obtained the handwriting of [target.GetTitledFirstName], allowing them to forge a letter of departure. As long as this unsuspecting child is tricked away, others will believe that [target.GetSheHe] left on their own."
 quix_murder_outcome.1203.no_acting_agent:0 "My accomplice has obtained the handwriting of [target.GetTitledFirstName], allowing them to forge a letter of departure. As long as we deceive this unsuspecting child into leaving, others will believe that [target.GetSheHe] left on their own."
 quix_murder_outcome.1203.a:0 "Matters like this require... strategy."
 quix_murder_outcome.1203.b:0 "I don't like this."
 quix_murder_outcome.1204.t:0 "Infant with Bathwater"
 quix_murder_outcome.1204.desc:0 "[acting_agent.GetTitledFirstName] has bribed a guard of [target.GetTitledFirstName] and promised to help them escape afterward. The guard only needs to take advantage of the moment when no one is watching and place the infant into the moat."
 quix_murder_outcome.1204.no_acting_agent:0 "My accomplice has bribed a nurse at [target.GetTitledFirstName] and promised to help them escape afterward. The nurse only needs to take advantage of an unguarded moment to place the infant into the moat."
 quix_murder_outcome.1204.a:0 "This is a perfect place for children."
 quix_murder_outcome.1204.b:0 "The plot is too simple."
 quix_murder_outcome.1205.t:0 "Secret crush"
 quix_murder_outcome.1205.desc:0 "[acting_agent.GetTitledFirstName] learns that the young [target.GetFirstNameNoTooltip] is already taken, so he can impersonate her to arrange a midnight rendezvous. What awaits [target.GetHerHim] will not be his beloved, but my accomplice."
 quix_murder_outcome.1205.no_acting_agent:0 "My co-conspirator learned that the young [target.GetFirstNameNoTooltip] had a lover, so I could impersonate them to arrange a secret midnight meeting. Waiting for [target.GetHerHim] would not be their beloved, but one of my people."
 quix_murder_outcome.1205.a:0 "Love is a dangerous game."
 quix_murder_outcome.1205.b:0 "That is incorrect."
 quix_murder_outcome.1206.t:0 "Exposed"
 quix_murder_outcome.1206.desc:0 "[acting_agent.GetTitledFirstName] is preparing to infiltrate the nursery at night and quietly take away [target.GetTitledFirstName]. As long as the child is sent far from the palace, no one will be able to find them afterward."
 quix_murder_outcome.1206.no_acting_agent:0 "My co-conspirator is preparing to infiltrate the nursery at night and quietly take away [target.GetTitledFirstName]. Once the child is sent far from the palace, no one will be able to find them afterward."
 quix_murder_outcome.1206.a:0 "Please note."
 quix_murder_outcome.1206.b:0 "Thinking again..."
 quix_murder_outcome.1301.t:0 "Terrible air quality"
 quix_murder_outcome.1301.desc:0 "[target.GetTitledFirstName] is imprisoned in the dungeon of [prison_owner.GetTitledFirstNamePossessive], and I have bribed the food bearer. By gradually introducing small amounts of poison, [target.GetHerHis]'s death will be mistaken for a severe illness contracted during imprisonment."
 quix_murder_outcome.1301.a:0 "I believe [prison_owner.GetFirstNameNoTooltip] will not mind having one less mouth to feed."
 quix_murder_outcome.1301.b:0 "The timing is not right now."
 quix_murder_outcome.1302.t:0 "Rescue Operation"
 quix_murder_outcome.1302.desc:0 "[target.GetTitledFirstName] is always under guard while in house arrest. My men can pretend to rescue [target.GetHerHim], then exploit the chaos to engineer a fatal failure; this is one of the few ways to get close to [target.GetHerHim]."
 quix_murder_outcome.1302.a:0 "Very good, but use bandits, and do not tell them who they are working for."
 quix_murder_outcome.1302.b:0 "That's far too bold."
 quix_murder_outcome.1303.t:0 "Internal Trade"
 quix_murder_outcome.1303.desc:0 "It is difficult for outsiders to enter the dungeon of [prison_owner.GetTitledFirstNamePossessive], but messages can be passed through cracks in the foundation. I have promised to care for a prisoner's family, and in return, they are willing to kill the [target.GetTitledFirstName] sharing my cell."
 quix_murder_outcome.1303.a:0 "What losses do we have to suffer?"
 quix_murder_outcome.1303.b:0 "Do you say this is a good plan?"
 quix_murder_outcome.1304.t:0 "Burn down houses"
 quix_murder_outcome.1304.desc:0 "[target.GetTitledFirstName] has been under guard while in house arrest. My men are preparing to set fire at the rear gate, forcing [target.GetHerHim] to flee through the main gate, where archers hidden on the roof will then strike."
 quix_murder_outcome.1304.a:0 "I burn with passion."
 quix_murder_outcome.1304.b:0 "I think this is a bad idea."
 quix_murder_outcome.2201.t:0 "Swimming lesson failed"
 quix_murder_outcome.2201.opening:0 "[target.GetTitledFirstName] has drowned!\n\n[target.GetHerHis|U] final struggle in the water ended as the body sank to the bottom, where it remained undiscovered until the next day."
 quix_murder_outcome.2201.scheme_owner_known:0 "\n\nHowever, it seems there was a witness who saw the entire process! Our assassin has been arrested, and we were involved in this dark incident. Our assassin has been arrested, and we participated in this sinister act, which everyone now knows."
 quix_murder_outcome.2201.scheme_unknown:0 "\n\nAll signs point to a terrible accident. At least no one suspects me of having anything to do with it."
 quix_murder_outcome.2201.a.discovered:0 "This is why swimming lessons are so important!"
 quix_murder_outcome.2201.a:0 "One less trouble."
 quix_murder_outcome.2202.t:0 "Do not trust that horse!"
 quix_murder_outcome.2202.opening:0 "[target.GetTitledFirstName] is already dead! \n\n Our little spider Greek emerged from their hiding place, and their venom stopped the beating of the small heart of [target.GetHerHis]."
 quix_murder_outcome.2202.scheme_owner_known:0 "\n\n Unfortunately, this plan was not as foolproof as we had imagined. Once the hidden compartments were discovered, our assassins transporting them were found and captured! Now everyone knows that we have a stake in this matter."
 quix_murder_outcome.2202.scheme_unknown:0 "\n\nIt seems no one has grasped the sinister nature of a child's death."
 quix_murder_outcome.2202.a.discovered:0 "Come on, even I can't control the spider!"
 quix_murder_outcome.2202.a:0 "It will never go out of style."
 quix_murder_outcome.2203.t:0 "Fugitive"
 quix_murder_outcome.2203.opening:0 "The foolish [target.GetTitledFirstName] has been slain! \n\n[target.GetTitledFirstName] was ambushed while walking alone; our assassins carried the corpse far away and buried it in a concealed spot. We left a note in the child's own hand, explaining how the child now hates everyone and wishes only to be alone."
 quix_murder_outcome.2203.scheme_owner_known:0 "\n\nHowever, the bad news is that this will be sealed with our own fool's assassin using their own seal! This weak conspiracy has been exposed, and our involvement is well known."
 quix_murder_outcome.2203.scheme_unknown:0 "Children of that age have all run away; no one would suspect them! \n\n"
 quix_murder_outcome.2203.a.discovered:0 "I believe the little one will be home soon!"
 quix_murder_outcome.2203.a:0 "This is a dangerous world."
 quix_murder_outcome.2204.t:0 "Infant with Bathwater"
 quix_murder_outcome.2204.opening:0 "Little [target.GetTitledFirstName] is no longer here! \n\n This helpless child was thrown out of the window and met its end in the stagnant moat river. Indeed, this was a cruel fate."
 quix_murder_outcome.2204.scheme_owner_known:0 "\n\n Unfortunately, dozens of witnesses saw the nurse throw the baby out of the window! She was quickly arrested and immediately broke down during interrogation! Our role in this matter has been fully exposed."
 quix_murder_outcome.2204.scheme_unknown:0 "\n\n successfully escaped, and all of this seemed to be nothing more than a cruel tragedy."
 quix_murder_outcome.2204.a.discovered:0 "Despicable lies! She clearly made a mistake and is now making excuses..."
 quix_murder_outcome.2204.a:0 "If you ask me, that is an act of benevolence."
 quix_murder_outcome.2205.t:0 "Secret crush"
 quix_murder_outcome.2205.opening:0 "Our assassins have successfully eliminated the young [target.GetTitledFirstName]. Shortly after \n\n arrived at the designated meeting point, an assassin emerged from the shadows and crushed [target.GetTitledFirstName] to death with a large stone."
 quix_murder_outcome.2205.scheme_owner_known:0 "\n\nHowever, the child's cries before death startled some guards, who immediately caught the assassin! They exposed my role in this terrible incident."
 quix_murder_outcome.2205.scheme_unknown:0 "After disposing of the body, \n\nthe assassin slipped away under cover of darkness, and no one knew."
 quix_murder_outcome.2205.a.discovered:0 "Hmm, this is very inconvenient."
 quix_murder_outcome.2205.a:0 "Fair in both love and war..."
 quix_murder_outcome.2206.t:0 "Exposed"
 quix_murder_outcome.2206.opening:0 "The small [target.GetTitledFirstName] is no longer there. The \n\n plan proceeds smoothly; the child has been taken to a mountain peak deep in the countryside and left there, to be left to fate."
 quix_murder_outcome.2206.scheme_owner_known:0 "\n\nUnfortunately, our assassins' crime has led to a clue that implicates me!"
 quix_murder_outcome.2206.scheme_unknown:0 "To everyone's eyes, that child simply vanished. \n\n"
 quix_murder_outcome.2206.a.discovered:0 "Me? No. What? This is absurd!"
 quix_murder_outcome.2206.a:0 "Nature is cruel."
 quix_murder_outcome.2301.t:0 "Terrible air quality"
 quix_murder_outcome.2301.opening_1:0 "[target.GetTitledFirstName] collapsed in the dungeon of [prison_owner.GetTitledFirstName], seemingly struck by a sudden and terrifying illness. Within days, life slowly left [target.GetHerHim]."
 quix_murder_outcome.2301.heh:0 "To be honest, I wish this pain could last a little longer."
 quix_murder_outcome.2301.owner_is_known_1:0 "\n\nHowever, the bad news is that the dungeon guard was immediately suspected of taking bribes and collapsed under pressure! Our plan was discovered and exposed by [prison_owner.GetTitledFirstName]."
 quix_murder_outcome.2301.no_awareness_1:0 "\n\nOn the surface, it appears to be yet another victim of the foul air circulating underground."
 quix_murder_outcome.2301.a.discovered:0 "I do not understand why people are unhappy."
 quix_murder_outcome.2301.a:0 "Now, let me continue my day..."
 quix_murder_outcome.2302.t:0 "Rescue Operation"
 quix_murder_outcome.2302.opening_1:0 "[target.GetTitledFirstName] has been killed! The so-called rescuers rushed in, subdued the guards, captured [target.GetFirstNameNoTooltip], and placed [target.GetHerHim] on a horse to flee. After escaping, the assassins merely wounded [target.GetTitledFirstName] with arrows and discarded the body on the road, making it seem as though something had gone wrong with this operation."
 quix_murder_outcome.2302.owner_is_known_1:0 "\n\nThat plan is too clean. What a pity, the person we hired boasted about it all night long! Unfortunately, this secret is now public knowledge."
 quix_murder_outcome.2302.no_awareness_1:0 "\n\nThis scheme seems to have worked; no one considers this an assassination, but rather a heroic rescue mission that went awry! Needless to say, no one doubts my attempt to rescue [target.GetHerHim]."
 quix_murder_outcome.2302.a.discovered:1 "Do you trust the mob more than me?"
 quix_murder_outcome.2302.a:0 "Rescued! That's true!"
 quix_murder_outcome.2303.t:0 "Internal Trade"
 quix_murder_outcome.2303.opening_1:0 "[target.GetTitledFirstName] is already dead! Strangled to death by another prisoner. Such a shameless life has met a fittingly shameless end!"
 quix_murder_outcome.2303.heh:0 "I can even hear the sound of my trachea crackling! The music is playing in my ears. \n\n"
 quix_murder_outcome.2303.owner_is_known_1:0 "\n\n However, not everything is good news. Although we succeeded, the conversation seems to have been eavesdropped upon, and our assassin has been captured! They accuse me of being the mastermind behind it all."
 quix_murder_outcome.2303.no_awareness_1:0 "\n\nThe prisoner is in the dungeon like a rat in a pit. No one would believe I have anything to do with this matter."
 quix_murder_outcome.2303.a.discovered:0 "These accusations are utterly baseless!"
 quix_murder_outcome.2303.a:0 "Now I can relax."
 quix_murder_outcome.2304.t:0 "Burn down houses"
 quix_murder_outcome.2304.opening_1:0 "When [target.GetTitledFirstName] fled a burning building during the darkest night, [target.GetSheHe] was killed by a hidden archer. Several arrows hit the bullseye, and [target.GetSheHe] encountered [target.GetHerHis] on the steps."
 quix_murder_outcome.2304.owner_is_known_1:0 "\n\nBut everything did not go according to plan, as the archers were quickly captured and implicated me under duress!"
 quix_murder_outcome.2304.no_awareness_1:0 "\n\n The fire quickly got out of control, and the bodies were consumed by the flames! It seemed no one realized this was an attempt by assassins..."
 quix_murder_outcome.2304.a.discovered:1 "Do you trust those murderers?"
 quix_murder_outcome.2304.a:0 "Well done, perfectly cooked!"
 quix_murder_outcome.4201.t:0 "Swimming Lesson"
 quix_murder_outcome.4201.failure_declaration_1:0 "Little [target.GetTitledFirstName] is back to life! It seems this little fellow can swim like a fish now!"
 quix_murder_outcome.4201.failure_declaration_2:0 "Damn! That detestable child [target.GetTitledFirstName] evaded our plan! Our assassins believed the plan had succeeded until a few minutes later, when the child emerged from the other side of the lake."
 quix_murder_outcome.4201.failure_declaration_3:0 "[target.GetTitledFirstName] was drowned, but unfortunately, not drowned deeply enough! After a passerby rescued the child and somehow saved the lifeless corpse, the plan failed!"
 quix_murder_outcome.4201.agent.scheme_owner_known:0 "[acting_agent.GetFirstNameNoTooltip] was overwhelmed by guilt, yet he has already revealed my plans to you!"
 quix_murder_outcome.4201.noagent.scheme_owner_known:0 "However, my assassin was overwhelmed by guilt and betrayed my plans!"
 quix_murder_outcome.4201.agent.scheme_unknown:0 "However, [acting_agent.GetFirstNameNoTooltip] may no longer be teaching swimming lessons. Fortunately, no one realized this was a conspiracy."
 quix_murder_outcome.4201.noagent.scheme_unknown:0 "However, the only good news is that this failed conspiracy remains a secret."
 quix_murder_outcome.4201.a.discovered:0 "I just want to protect the children from harm caused by water!"
 quix_murder_outcome.4201.a:0 "You must hold him down!"
 quix_murder_outcome.4202.t:0 "Trojan Horse"
 quix_murder_outcome.4202.failure_declaration_1:0 "Our plot to kill [target.GetTitledFirstName] has failed! That child dismissed our gift and had it taken away!"
 quix_murder_outcome.4202.failure_declaration_2:0 "It seems our spider-laden steed failed to slay the young [target.GetTitledFirstName]. Whether it was a malfunction of the mechanism or the spiders unable to be awakened to carry out their mission, we shall never know."
 quix_murder_outcome.4202.failure_declaration_3:0 "We have not yet escaped [target.GetTitledFirstName], as it seems the spider has instead killed a cleaning woman!"
 quix_murder_outcome.4202.agent.scheme_owner_known:0 "[acting_agent.GetFirstNameNoTooltip] was overwhelmed by guilt, yet he has already revealed my plans to you!"
 quix_murder_outcome.4202.noagent.scheme_owner_known:0 "However, my assassin was overwhelmed by guilt and betrayed my plans!"
 quix_murder_outcome.4202.agent.scheme_unknown:0 "Fortunately, no one realized this was a conspiracy—at least not ours."
 quix_murder_outcome.4202.noagent.scheme_unknown:0 "Fortunately, this foolish act did not lead to anyone discovering our involvement. That could have been quite embarrassing."
 quix_murder_outcome.4202.a.discovered:0 "All of this is a lie! I will never approve such a foolish plan."
 quix_murder_outcome.4202.a:0 "I like spiders! Just keep them away from me."
 quix_murder_outcome.4203.t:0 "Fugitive"
 quix_murder_outcome.4203.failure_declaration_1:0 "Unfortunately, our assassin failed in the attempt to kill [target.GetTitledFirstName]. This child, more like a young adult, was able to mount fierce resistance, and our assassin's lower leg suffered severe injury during this attempt!"
 quix_murder_outcome.4203.failure_declaration_2:0 "Failed. [target.GetTitledFirstName] is still alive and remains a threat to us. After leaving, the note was immediately discovered, a search party was dispatched, and the child was rescued in time!"
 quix_murder_outcome.4203.failure_declaration_3:0 "Devastating defeat! [target.GetTitledFirstName] was not killed. In fact, he wasn't even harmed! This child managed to escape, evaded our assassins, cried for help, and foiled our plot!"
 quix_murder_outcome.4203.agent.scheme_owner_known:0 "[acting_agent.GetFirstNameNoTooltip] was caught on the spot, along with our correspondence!"
 quix_murder_outcome.4203.noagent.scheme_owner_known:0 "Our damn fool assassins have been caught; they carry our orders! This conspiracy is now exposed to all."
 quix_murder_outcome.4203.agent.scheme_unknown:0 "Our assassins wear masks, and for some reason, they have escaped this time! Our anonymity has been preserved, though we may not be so lucky next time."
 quix_murder_outcome.4203.noagent.scheme_unknown:0 "Our assassins wear hoods and visored helmets, allowing them to flee anonymously—a mercy in this cruel game."
 quix_murder_outcome.4203.a.discovered:0 "Me? You've caught the conspirators; I have nothing to do with them!"
 quix_murder_outcome.4203.a:0 "Next time, we will be more... direct."
 quix_murder_outcome.4204.t:0 "Infant with Bathwater"
 quix_murder_outcome.4204.failure_declaration_1:0 "The plan to kill the young [target.GetTitledFirstName] has failed! The child was thrown out of the window into the moat, where he was quickly rescued by a passerby!"
 quix_murder_outcome.4204.failure_declaration_2:0 "A complete failure. [target.GetTitledFirstName] was not drowned to death. The caretaker could not carry out this plan!"
 quix_murder_outcome.4204.failure_declaration_3:0 "I knew it was too easy! [target.GetTitledFirstName] is still alive. Although the plan initially succeeded, it seems the child was discovered by the town's guards, pulled out of the water, and somehow rescued!"
 quix_murder_outcome.4204.agent.scheme_owner_known:0 "The guard was caught and accused [acting_agent.GetFirstNameNoTooltip], who was apprehended while delivering our letter! Our role in this has been exposed."
 quix_murder_outcome.4204.noagent.scheme_owner_known:0 "This guard has been captured, implicating our assassin, who was arrested while composing a letter to us! Our involvement has been exposed. Our role in this matter has already been revealed."
 quix_murder_outcome.4204.agent.scheme_unknown:0 "Fortunately, [acting_agent.GetFirstNameNoTooltip] was able to see that the guard had fled; our role within this is unknown."
 quix_murder_outcome.4204.noagent.scheme_unknown:0 "Fortunately, the guardian escaped unscathed, while our role within it remains unknown."
 quix_murder_outcome.4204.a.discovered:0 "It's all a carefully devised plot to frame me!"
 quix_murder_outcome.4204.a:0 "Back to the drafting board..."
 quix_murder_outcome.4205.t:0 "Secret crush"
 quix_murder_outcome.4205.failure_declaration_1:0 "Our assassin failed to kill [target.GetTitledFirstName]! Upon reaching the meeting point, this child escaped!"
 quix_murder_outcome.4205.failure_declaration_2:0 "The attempt to kill [target.GetTitledFirstName] failed. It seems this child has fought back!"
 quix_murder_outcome.4205.failure_declaration_3:0 "Alas, [target.GetTitledFirstName] is still alive; this entire affair was a trap for us assassins!"
 quix_murder_outcome.4205.agent.scheme_owner_known:0 "[acting_agent.GetFirstNameNoTooltip] and our assassins have been captured, while the details of the conspiracy have been exposed."
 quix_murder_outcome.4205.noagent.scheme_owner_known:0 "Our assassin has been captured alive, and the traitor accuses me of being the mastermind."
 quix_murder_outcome.4205.agent.scheme_unknown:0 "The only good news is that the assassin escaped undetected."
 quix_murder_outcome.4205.noagent.scheme_unknown:0 "The only good news is that the assassin escaped undetected."
 quix_murder_outcome.4205.a.discovered:0 "Why would I harm [target.GetTitledFirstName]?"
 quix_murder_outcome.4205.a:0 "I also harbor great hopes for this plan."
 quix_murder_outcome.4206.t:0 "Exposed"
 quix_murder_outcome.4206.failure_declaration_1:0 "Alas, we have not yet resolved [target.GetTitledFirstName]!"
 quix_murder_outcome.4206.failure_declaration_2:0 "Little [target.GetTitledFirstName] is still alive!"
 quix_murder_outcome.4206.failure_declaration_3:0 "We failed to kill [target.GetTitledFirstName]."
 quix_murder_outcome.4206.agent.scheme_owner_known:0 "[acting_agent.GetFirstNameNoTooltip] was stopped and arrested during the operation. Upon interrogation, [acting_agent.GetSheHe] revealed some of our plans!"
 quix_murder_outcome.4206.noagent.scheme_owner_known:0 "Our assassin was stopped and arrested during the operation. After interrogation, the traitor revealed my name."
 quix_murder_outcome.4206.agent.scheme_unknown:0 "Although our assassins can escape undetected, the child has received far more protection at night than we anticipated. Our plan will not succeed as we had hoped."
 quix_murder_outcome.4206.noagent.scheme_unknown:0 "Although our assassins can escape undetected, the child has received far more protection at night than we anticipated. Our plan will not succeed as we had hoped."
 quix_murder_outcome.4206.a.discovered:0 "Lies! Can't you see this is extortion?"
 quix_murder_outcome.4206.a:0 "I know this is too simple."
 quix_murder_outcome.4301.t:0 "Terrible air quality"
 quix_murder_outcome.4301.failure:0 "Unfortunately, [target.GetTitledFirstName] remains securely locked there. The materials we obtained seem to have had no expected effect on [target.GetTitledFirstName]; it is said that he now feels better than before."
 quix_murder_outcome.4301.scheme_owner_known:0 "\n\nHowever, it turned out that this plan was worse than wasting time, as the jailer was suspected of accepting bribes due to his sudden and inexplicable wealth, and during the interrogation, he exposed my role in the conspiracy! My heart is shattered."
 quix_murder_outcome.4301.scheme_unknown:0 "\n\n Fortunately, no one knows what we initially attempted. However, that jailer seems already terrified by his relationship with us, and regardless, he is no longer open to future attempts."
 quix_murder_outcome.4301.a.discovered:0 "Lies! I have committed no crime, so how could I be accused?"
 quix_murder_outcome.4301.a:0 "Oh, very well..."
 quix_murder_outcome.4302.t:0 "Rescue Operation"
 quix_murder_outcome.4302.failure:0 "[target.GetTitledFirstName] is still alive! Our convoluted deployment plan for [target.GetHerHim] has completely failed. The guards mounted a strong defense and were quickly reinforced. It soon became clear that the opportunity had passed, and the attackers were forced to retreat."
 quix_murder_outcome.4302.scheme_owner_known:0 "\n\nThey attempted to retreat during the battle, but as more armed personnel responded, they were surrounded and surrendered! They took me as their employer!"
 quix_murder_outcome.4302.scheme_unknown:0 "\n\nA small act of mercy, at the very least allowing the soldiers to escape. In battle, they claimed they came to rescue [target.GetTitledFirstName]. This seemed to confuse the situation, as no one deduced that I was involved."
 quix_murder_outcome.4302.a.discovered:0 "Yes, I am guilty. I only wish to rescue [target.GetHerHim] from imprisonment!"
 quix_murder_outcome.4302.a:0 "We should have burned that building down..."
 quix_murder_outcome.4303.t:0 "Internal Trade"
 quix_murder_outcome.4303.failure:0 "Allowing some prisoners to arbitrarily kill the weak conspiracy of [target.GetTitledFirstName], as expected, ultimately yielded no results."
 quix_murder_outcome.4303.scheme_owner_known:0 "\n\nThe facts prove that this prisoner never existed! Our foolish assassins have been talking to a guard! They were speaking of the barracks, not the dungeon, and they have all been arrested!"
 quix_murder_outcome.4303.scheme_unknown:0 "It seems our assassins have been defeated in the struggle, their heads shattered on the stone floor! This is who our assassins were. At least with them died any understanding of their motives... \n\n"
 quix_murder_outcome.4303.a.discovered:0 "We have always known it was just a joke!"
 quix_murder_outcome.4303.a:0 "Nothing of value was lost."
 quix_murder_outcome.4304.t:0 "Burn down houses"
 quix_murder_outcome.4304.failure:0 "The plot to assassinate [target.GetTitledFirstName] has failed. The potential assassins decided to press forward despite the harsh weather, but when the hay cart failed to ignite, they were discovered attempting to charge directly at the building, only to be in vain."
 quix_murder_outcome.4304.scheme_owner_known:0 "Even worse, these fools had no ability to run and were quickly arrested! They told me that I was involved as well. They have already revealed my role within it! \n\n"
 quix_murder_outcome.4304.scheme_unknown:0 "\n\n Fortunately, they were able to explain their suspicious behavior and escape quickly. At least, my connection to this incident remains unknown."
 quix_murder_outcome.4304.a.discovered:0 "Obviously, these people were sent to frame me!"
 quix_murder_outcome.4304.a:0 "Perhaps we should be more direct?"
