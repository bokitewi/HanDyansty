 hd_asp_mod_xue_fangtou:0 "Fangtou Avenged"
 hd_asp_mod_xue_fangtou_desc:0 "This person avenged the defeat at Fangtou."
 hd_asp.0330.t:0 "The Resolve of Dongying"
 hd_asp.0330.desc:0 "Liu Yuan has proclaimed himself king at Zuoguo, and every day more Xiongnu horsemen ride through Bing. The granaries are empty and refugees stream east. You still command an army of Bing; it is time to decide where it will go."
 hd_asp.0330.a:0 "Lead the people of Bing east to feed them, and hold Ye."
 hd_asp.0330.b:0 "Hold Jinyang to the last as the court's northern gate."
 hd_asp.0330.c:0 "Bing Province is mine, and no one shall take it."
 hd_asp.0331.t:0 "The Resolve of Hejian"
 hd_asp.0331.desc:0 "Zhang Fang's troops are quartered in Luoyang, and the emperor still sits, in name, in the Hall of Supreme Ultimate. Guanzhong is your foundation, but the court is a thousand li away. Bring the emperor to your side, or hold the Guanzhong?"
 hd_asp.0331.a:0 "Carry the emperor west and make Chang'an the capital."
 hd_asp.0331.b:0 "Guanzhong is ringed by mountains; it is enough to stand alone."
 hd_asp.0331.c:0 "Zhang Fang is arrogant; he cannot be kept long."
 hd_asp.0332.t:0 "The Resolve of Chengdu"
 hd_asp.0332.desc:0 "The palaces of Ye still stand, but your place as Imperial Younger Brother is in peril. Wang Jun and the Xianbei to the north, the Prince of Donghai to the south, the Prince of Hejian to the west. What ending will you fight for?"
 hd_asp.0332.a:0 "Become Imperial Younger Brother again and inherit the throne."
 hd_asp.0332.b:0 "Rewrite the fate of Ye and rise again."
 hd_asp.0332.c:0 "Hold Hebei as a realm of my own."
 hd_asp.0333.t:0 "The Resolve of Donghai"
 hd_asp.0333.desc:0 "The emperor is in exile and every prince has his own designs. Your proclamation is written, and the Prince of Fanyang and Wang Jun are ready to march. But once the emperor is home, who will rule the realm?"
 hd_asp.0333.a:0 "Bring the emperor back to Luoyang and govern the court."
 hd_asp.0333.b:0 "Purge the emperor's side and hold power alone."
 hd_asp.0333.c:0 "Preserve the dynasty and hold back the barbarians."
 hd_asp.0334.t:0 "The Resolve of Pengzu"
 hd_asp.0334.desc:0 "The Xianbei cavalry of You are among the finest troops in the realm, and every prince courts you. North of Ji is your world, where imperial edicts are mere paper. How far do you mean to go?"
 hd_asp.0334.a:0 "Stand alone in You and claim supremacy in the north."
 hd_asp.0334.b:0 "Be the bulwark of the north against Shi Le."
 hd_asp.0334.c:0 "Bring the Xianbei tribes under my command."
 hd_asp.0335.t:0 "The Resolve of Zhongjun"
 hd_asp.0335.desc:0 "Chengdu is in your hands, and for the first time the refugees have a place to settle. Luo Shang has fallen back to Jiangyang, and Fan Changsheng of Mount Qingcheng has sent you a letter. What foundation will you build in Shu?"
 hd_asp.0335.a:0 "Ascend the throne and name the state Great Cheng."
 hd_asp.0335.b:0 "Hold all of Ba and Shu and seize Hanzhong to the north."
 hd_asp.0335.c:0 "Pass the throne to my son and secure it forever."
 hd_asp.0336.t:0 "The Resolve of Shiyan"
 hd_asp.0336.desc:0 "The Hexi corridor is full of wind and sand, yet it is a haven for scholars fleeing the Central Plain. The court at Luoyang grows weaker each year. How far will your descendants carry this land?"
 hd_asp.0336.a:0 "Hold Hexi and keep faith with the distant Jin."
 hd_asp.0336.b:0 "Become King of the West and stand alone."
 hd_asp.0336.c:0 "March east through Qin and Long to shield the Guanzhong."
 hd_asp.0337.t:0 "The Resolve of Shilong"
 hd_asp.0337.desc:0 "Once you wore a slave's collar and tilled the fields of Chiping. Now you command an army, and the bold men of Hebei flock to you. Have you ever wondered how far a slave can go?"
 hd_asp.0337.a:0 "Born a slave, crowned a Heavenly King."
 hd_asp.0337.b:0 "Gather the gentry and found the Gentlemen's Camp."
 hd_asp.0337.c:0 "Water my horses at the Yangzi and unite the Central Plain."
 hd_asp.0317.t:0 "Scion of Zhaolie"
 hd_asp.0317.desc:0 "You are a great-grandson of Emperor Zhaolie, yet you live in the Li family's Chengdu as Duke of Anle. The incense still burns in the ancestral temple, and some old men in the city still quietly call you \"Your Highness\". Is restoring the Han of the Liu only a dream?"
 hd_asp.0317.a:0 "Rebuild the Fiery Han, the Han of the Liu."
 hd_asp.0317.b:0 "A dream is a dream. Let me live in peace."
 hd_asp.0318.t:0 "The Resolve of Daoming"
 hd_asp.0318.desc:0 "You shelter in Qin. Fu Jian treats you as an honored guest; Wang Meng sees a tiger. The ancestral temples of Yan still stand in Ye, but there is no place for you there. For whom will you fight in this life?"
 hd_asp.0318.a:0 "Restore Yan and found it anew."
 hd_asp.0318.b:0 "Repay Qin's trust and die a loyal subject."
 hd_asp.0318.c:0 "Bring back my old sovereign and restore the Yan emperor."
 hd_asp.0319.t:0 "The Resolve of Anshi"
 hd_asp.0319.desc:0 "You have come down from Mount Dong and found your footing at court. Huan Wen's ambition is known to all, and Qin grows stronger in the north by the day. The young men of the Xie family all look to you. Where will you lead them?"
 hd_asp.0319.a:0 "Keep calm, plan far ahead, and turn back the enemy at the Fei."
 hd_asp.0319.b:0 "March north and return the capital to Luoyang."
 hd_asp.0319.c:0 "Let the house prosper, with Xie sons governing every frontier."
 hd_asp.0320.t:0 "The Resolve of Zhaocheng"
 hd_asp.0320.desc:0 "You have built palaces at Shengle and appointed your officials. But Liu Weichen has brought Qin's armies down on you, and to the south Bing and Ji belong to the Yan. How far will Dai go beneath the Yin Mountains?"
 hd_asp.0320.a:0 "Found the state in the north of Dai and subdue the Tiefu."
 hd_asp.0320.b:0 "Resist Qin, preserve Dai, and hold Yunzhong."
 hd_asp.0320.c:0 "Look south to Bing and Ji and water my horses in the Fen."
 hd_asp.0321.t:0 "Yuanzi's Last Ambition"
 hd_asp.0321.desc:0 "You are nearly sixty. Three northern expeditions brought victories and defeats, and Fangtou broke your edge. The Nine Bestowments still have not come, and the whole court is watching for your next move."
 hd_asp.0321.a:0 "Do as Yi Yin and Huo Guang did: depose an emperor to show my power."
 hd_asp.0321.b:0 "Receive the abdication and take the mandate for myself."
 hd_asp.0321.c:0 "Wipe out the shame of Fangtou and retake both capitals."
 hd_story_sima_teng_life:0 "Annals of Sima Teng"
 hd_story_sima_teng_life_desc:0 "Courtesy name Yuanmai, of Wen in Henei"
 HD_STORY_SIMA_TENG_LIFE_STATUS:0 "Sima Yuanmai is a grandson of Sima Kui, brother of Emperor Xuan of Jin. Enfeoffed as Duke of Dongying, he commands the armies of Bing Province from Jinyang. The Xiongnu Liu Yuan has risen at Zuoguo, famine grips Bing year after year and the people scatter. The only road left to him seems to lead east."
 hd_story_sima_yong_life:0 "Annals of Sima Yong"
 hd_story_sima_yong_life_desc:0 "Courtesy name Wenzai, of Wen in Henei"
 HD_STORY_SIMA_YONG_LIFE_STATUS:0 "Sima Wenzai is a grandson of Sima Fu, Prince Xian of Anping. As Prince of Hejian he holds the Guanzhong. He followed the Prince of Zhao, then the Prince of Qi, then rode the Prince of Chengdu's strength into power. Now the emperor is in the hands of his general Zhang Fang, and every move in the palace at Luoyang must first be cleared with Chang'an."
 hd_story_sima_ying_life:0 "Annals of Sima Ying"
 hd_story_sima_ying_life_desc:0 "Courtesy name Zhangdu, of Wen in Henei"
 HD_STORY_SIMA_YING_LIFE_STATUS:0 "Sima Zhangdu is the sixteenth son of Emperor Wu of Jin, Prince of Chengdu, holding Ye. He won fame across the realm by raising troops against the Prince of Zhao, and was named Imperial Younger Brother, directing the court from afar. At Dangyin the emperor fell into his hands, yet Wang Jun's Xianbei cavalry are already riding south."
 hd_story_sima_yue_life:0 "Annals of Sima Yue"
 hd_story_sima_yue_life_desc:0 "Courtesy name Yuanchao, of Wen in Henei"
 HD_STORY_SIMA_YUE_LIFE_STATUS:0 "Sima Yuanchao is the eldest son of Sima Tai, Prince Wenxian of Gaomi, and is Prince of Donghai. Well regarded from youth, modest and fond of scholars, he has risen and fallen more than once in the princes' struggles. Now that the emperor has been carried west, he gathers troops in Donghai and sends out proclamations to bring the emperor back."
 hd_story_wang_jun_life:0 "Annals of Wang Jun"
 hd_story_wang_jun_life_desc:0 "Courtesy name Pengzu, of Jinyang in Taiyuan"
 HD_STORY_WANG_JUN_LIFE_STATUS:0 "Wang Pengzu is the son of Wang Shen, Minister of Works. He rose as General Who Pacifies the North and Inspector of Qing, then took command of all forces in You. He married his daughters to the chiefs of the Duan and Yuwen Xianbei and commands Xianbei cavalry, the foremost power in Hebei."
 hd_story_li_xiong_life:0 "Annals of Li Xiong"
 hd_story_li_xiong_life_desc:0 "Courtesy name Zhongjun, of Dangqu in Baxi"
 HD_STORY_LI_XIONG_LIFE_STATUS:0 "Li Zhongjun is of the Cong people. His father Li Te led refugees from Qin and Yong into Shu and fought the Inspector of Yi, Luo Shang, year after year. After Li Te and Li Liu died in turn, the people chose him as leader. He took Chengdu and named himself King of Chengdu, and the hermit Fan Changsheng of Mount Qingcheng awaits him."
 hd_story_zhang_gui_life:0 "Annals of Zhang Gui"
 hd_story_zhang_gui_life_desc:0 "Courtesy name Shiyan, of Wushi in Anding"
 HD_STORY_ZHANG_GUI_LIFE_STATUS:0 "Zhang Shiyan is a seventeenth-generation descendant of Zhang Er, Prince Jing of Changshan under the Han, of a family of filial scholars, himself known for Confucian learning. Seeing the realm about to fall apart, he asked to be Inspector of Liang and held the Hexi corridor. Again and again Liang's troops and grain would cross the Long Mountains to relieve the court at Luoyang."
 hd_story_shi_le_life:0 "Annals of Shi Le"
 hd_story_shi_le_life_desc:0 "Courtesy name Shilong, of Wuxiang in Shangdang"
 HD_STORY_SHI_LE_LIFE_STATUS:0 "Shi Shilong is a Jie. In his youth the Inspector of Bing seized and sold him as a slave, and he tilled fields at Chiping. With Ji Sang he gathered herdsmen and outlaws, the Eighteen Riders, and has ranged across Hebei ever since. He cannot read, yet he loves to hear the histories read aloud."
 hd_story_liu_xuan_life:0 "Annals of Liu Xuan"
 hd_story_liu_xuan_life_desc:0 "Great-grandson of Emperor Zhaolie of Shu Han"
 HD_STORY_LIU_XUAN_LIFE_STATUS:0 "Liu Xuan is a great-grandson of Emperor Zhaolie of Shu Han and grandson of Liu Yong, Prince of Ganling. After Shu Han fell, the Liu descendants scattered; he alone stayed in Shu. When Li Xiong took Shu he made him Duke of Anle to keep the sacrifices of the Later Lord. In Chengdu there are still old men who remember the banners of the Fiery Han."
 hd_story_murong_chui_life:0 "Annals of Murong Chui"
 hd_story_murong_chui_life_desc:0 "Courtesy name Daoming, of Jicheng in Changli"
 HD_STORY_MURONG_CHUI_LIFE_STATUS:0 "Murong Daoming is the fifth son of Murong Huang, Emperor Wenming of Former Yan, once named Ba and ambitious from youth. At Fangtou he crushed Huan Wen, only to be suspected by the Grand Tutor Murong Ping and the empress dowager, and fled with his sons to Qin. Fu Jian rode out to greet him in person, while Wang Meng watched coldly from the side."
 hd_story_xie_an_life:0 "Annals of Xie An"
 hd_story_xie_an_life_desc:0 "Courtesy name Anshi, of Yangxia in Chen"
 HD_STORY_XIE_AN_LIFE_STATUS:0 "Xie Anshi was famous from youth yet refused office again and again, living at Mount Dong in Kuaiji and roaming the hills with Wang Xizhi and Xu Xun. Only past forty, when his kin had thinned, did he answer Huan Wen's summons. People said: \"If Anshi will not come forth, what will become of the common people?\""
 hd_story_shiyijian_life:0 "Annals of Shiyijian"
 hd_story_shiyijian_life_desc:0 "King of Dai, of the Tuoba"
 HD_STORY_SHIYIJIAN_LIFE_STATUS:0 "Tuoba Shiyijian is the son of Tuoba Yulü, King of Dai. As a youth he spent ten years as a hostage at Xiangguo in Later Zhao. Returning to take the throne, he proclaimed the era Jianguo, \"Founding the State\", first appointed a hundred officials to their duties, and built a city at Shengle. Now Liu Weichen of the Tiefu has gone over to Qin, and the wind blows colder on both sides of the Yin Mountains."
 nick_hd_asp_zhaolie_yiyin:0 "Scion of Zhaolie"
 nick_hd_asp_zhaolie_yiyin_desc:0 "Claiming descent from the Zhaolie Emperor of Han, this ruler raised the banner of Han again in Shu, and the people of Shu call them the last scion of the Han house."
