 hd_asp_mod_nan_kui_desc:0 "This person's cavalry rode south and watered their horses in the Fen."
 hd_asp_name_hw_yihuo:0 "Do as Yi Yin and Huo Guang"
 hd_asp_card_hw_yihuo:0 "Aspiration: $hd_asp_name_hw_yihuo$"
 hd_asp_card_hw_yihuo_desc:0 "#high Main Goal#!\n· The deposition is done (a new emperor enthroned), and you are alive and still the minister who holds the emperor\n#high Bonus Goals#!\n· The Jin army has taken Shouchun\n· Receive the Nine Bestowments, or a ducal or royal fief\n· Luoyang is within the Jin emperor's realm\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_yihuo$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_hw_yihuo:0 "From the Book of Jin, Biography of Huan Wen: confident in his talent and strength, Wen long harbored other ambitions... he deposed the emperor as Prince of Donghai and made the Chancellor, Sima Yu, Prince of Kuaiji, emperor."
 hd_asp.0100.desc.hw_yihuo:0 "The new emperor meets you in the Hall of Supreme Ultimate, trembling, tears streaming down his face. No one at court dares mention Fangtou any more."
 hd_asp_ps_hw_yihuo:0 "\n#weak From the Book of Jin, Biography of Huan Wen: confident in his talent and strength, Wen long harbored other ambitions... he deposed the emperor as Prince of Donghai and made the Chancellor, Sima Yu, Prince of Kuaiji, emperor.#!"
