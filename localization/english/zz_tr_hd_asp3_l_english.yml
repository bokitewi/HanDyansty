l_english:
 hd_asp_name_smteng_qihuo:0 "East in Search of Bread"
 hd_asp_card_smteng_qihuo:0 "Aspiration: $hd_asp_name_smteng_qihuo$"
 hd_asp_card_smteng_qihuo_desc:0 "#high Main Goal#!\n· Hold Wei Commandery, with at least two commanderies of Ji Province in your realm\n#high Bonus Goals#!\n· When the goal is reached, at least one commandery of Bing Province is still in your realm\n· You have taken in the Qihuo bands\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_qihuo$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_smteng_qihuo:0 "From the Book of Jin, Biography of the Duke of Dongying: when famine struck Bing, Teng led over twenty thousand officials and commoners to find grain in Ji; they were called the Qihuo."
 hd_asp.0100.desc.smteng_qihuo:0 "The starving of Bing have grain at last in Ye. From the Bronze Sparrow Terrace you watch the Qihuo banners cover the walls."
 hd_asp_ps_smteng_qihuo:0 "\n#weak From the Book of Jin, Biography of the Duke of Dongying: when famine struck Bing, Teng led over twenty thousand officials and commoners to find grain in Ji; they were called the Qihuo.#!"
