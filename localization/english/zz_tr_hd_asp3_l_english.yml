 hd_asp_card_xan_feishui:0 "Aspiration: $hd_asp_name_xan_feishui$"
 hd_asp_card_xan_feishui_desc:0 "#high Main Goal#!\n· The battle of the Fei River ended in a Jin victory or a draw while you are alive and a subject of Jin; or, after mid-384, Qin has collapsed and both Shouchun and Guangling are within the Jin emperor's realm\n#high Bonus Goals#!\n· Xie Xuan holds Guangling (the Northern Garrison)\n· You are Director of the Secretariat\n· You kept your composure at the Xinting meeting, or Huan Chong is alive and his opinion of you is at least 0\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_anshi_fengliu$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_xan_feishui:0 "From the Book of Jin, Biography of Xie An: when the courier brought word that Xuan had broken Fu Jian, An was playing weiqi with a guest. He read the letter, set it on the couch without a trace of joy, and went on with the game."
 hd_asp.0100.desc.xan_feishui:0 "When the dispatch arrived you were playing weiqi. Your guest asked what it said, and you replied only: \"The youngsters have beaten the enemy.\""
