 hd_asp_card_xan_huandu:0 "Aspiration: $hd_asp_name_xan_huandu$"
 hd_asp_card_xan_huandu_desc:0 "#high Main Goal#!\n· Luoyang is within the Jin emperor's realm, and the court's capital has moved back to Luoyang\n#high Bonus Goals#!\n· Chang'an is also within the Jin emperor's realm\n· Xie Xuan's northern expedition succeeded\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_huandu$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.xan_huandu:0 "The emperor's carriage has crossed the Huai, then the Yellow River. The palaces of Luoyang lay waste for seventy years; today someone sweeps them again."
