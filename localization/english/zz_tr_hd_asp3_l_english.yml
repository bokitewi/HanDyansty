 hd_asp_name_hw_fangtou:0 "Avenge Fangtou"
 hd_asp_card_hw_fangtou:0 "Aspiration: $hd_asp_name_hw_fangtou$"
 hd_asp_card_hw_fangtou_desc:0 "#high Main Goal#!\n· Luoyang and Xuchang are both within the Jin emperor's realm\n#high Bonus Goals#!\n· Murong Chui is dead or your prisoner\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_xue_fangtou$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.hw_fangtou:0 "You stand before Luoyang once more, and this time no one can make you turn back. The fire of Fangtou has finally gone out in your heart."
 hd_asp_ps_hw_fangtou:0 ""
