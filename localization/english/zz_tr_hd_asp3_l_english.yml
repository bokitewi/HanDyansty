 hd_asp_card_smyong_xidu_desc:0 "#high Main Goal#!\n· Be the minister who holds the emperor, with the court's capital at Chang'an\n#high Bonus Goals#!\n· The war to retrieve the emperor ended in your victory or a draw\n· Zhang Fang is alive\n· When the goal is reached, you still hold all four provinces of Yong, Qin, He and the Capital Province\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_xidu$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_smyong_xidu:0 "From the Book of Jin, Biography of the Prince of Hejian: Zhang Fang forced the emperor to Chang'an, and Yong met him at Bashang with thirty thousand men."
 hd_asp.0100.desc.smyong_xidu:0 "The emperor's carriage halts before the Weiyang Palace in Chang'an. Edicts now issue from your headquarters, and the princes east of the passes can only sigh at the gates."
