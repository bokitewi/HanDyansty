 hd_asp_name_syj_jianguo:0 "Found the State of Dai"
 hd_asp_card_syj_jianguo:0 "Aspiration: $hd_asp_name_syj_jianguo$"
 hd_asp_card_syj_jianguo_desc:0 "#high Main Goal#!\n· Hold the title of Shuo Province (or have Yunzhong or Tuoba commandery as your primary title), with Liu Weichen dead, your subject, or Shuofang in your realm\n#high Bonus Goals#!\n· Your capital is Shengle (Shaling county)\n· Your council is full (the hundred officials appointed)\n· You have a living spouse of the Murong\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_daibei_jianguo$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_syj_jianguo:0 "From the Book of Wei, Prefatory Annals: Emperor Zhaocheng took the throne north of Fanzhi and proclaimed the era Jianguo; he first appointed the hundred officials to their duties, and in the tenth month crossed the river to strike Weichen."
 hd_asp.0100.desc.syj_jianguo:0 "The Yellow River froze and your cavalry crossed on the ice. Liu Weichen fled at the sight, and no one on either side of the Ordos dares stand against Dai."
 hd_asp_ps_syj_jianguo:0 "\n#weak From the Book of Wei, Prefatory Annals: Emperor Zhaocheng took the throne north of Fanzhi and proclaimed the era Jianguo; he first appointed the hundred officials to their duties, and in the tenth month crossed the river to strike Weichen.#!"
