 hd_asp_card_mrc_baoqin:0 "Aspiration: $hd_asp_name_mrc_baoqin$"
 hd_asp_card_mrc_baoqin_desc:0 "#high Main Goal#!\n· After 386, Fu Jian is still alive and you are still his vassal or courtier\n#high Bonus Goals#!\n· After the defeat at Fei River you escorted the Heavenly King home\n· Hold one of the Three Excellencies, or at least two commanderies of Ji Province are in your realm\n· Yao Chang is dead or has lost all his land\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_qin_zhichen$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.mrc_baoqin:0 "After the Fei River every general urged you to strike out alone, yet you brought the Heavenly King back to Chang'an. Fu Jian held your hand and could not speak."
