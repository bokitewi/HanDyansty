 hd_asp_card_xan_menhu_desc:0 "#high Main Goal#!\n· At least two members of the Xie of Chen (you included) hold kingdom titles\n#high Bonus Goals#!\n· Be in Jiankang at the age of sixty-five\n· Xie Xuan and Xie Yan are both alive and each hold a commandery\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_wuyi_xie$\nEach bonus goal: $hd_asp_reward_small$"
