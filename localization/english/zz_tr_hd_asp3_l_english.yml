 hd_asp_pr_smteng_qihuo:0 "Main goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_qihuo$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_pd_smteng_qihuo:0 "The starving of Bing have grain at last in Ye. From the Bronze Sparrow Terrace you watch the Qihuo banners cover the walls."
