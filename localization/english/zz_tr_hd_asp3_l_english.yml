 hd_asp_name_mrc_yanyuan:0 "Restore Yan"
 hd_asp_card_mrc_yanyuan:0 "Aspiration: $hd_asp_name_mrc_yanyuan$"
 hd_asp_card_mrc_yanyuan_desc:0 "#high Main Goal#!\n· Be independent and of the Murong, with Ji Province in your realm and Ye or Zhongshan in your hands\n#high Bonus Goals#!\n· At least two of Murong Nong, Murong Bao and Murong De are alive and at your court or your vassals\n· Both Ye and Zhongshan are in your realm\n· Your primary title is an empire\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_yan_zhongxing$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_mrc_yanyuan:0 "From the Book of Jin, Record of Murong Chui: at Xingyang his followers begged him to take a royal title, so he called himself King of Yan and changed the era to Yanyuan; later he took the imperial throne at Zhongshan."
 hd_asp.0100.desc.mrc_yanyuan:0 "The banners of Yan fly over Zhongshan once more. You are past sixty, yet your cavalry is still unbeaten."
