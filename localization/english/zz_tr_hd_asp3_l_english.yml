 hd_asp_card_smyue_yingjia:0 "Aspiration: $hd_asp_name_smyue_yingjia$"
 hd_asp_card_smyue_yingjia_desc:0 "#high Main Goal#!\n· Be the minister who holds the emperor, with the court's capital at Luoyang\n#high Bonus Goals#!\n· Gou Xi is at your court or your vassal\n· Sima Yong is dead or no longer holds the emperor\n· You are Grand Tutor\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_bingzheng$\nEach bonus goal: $hd_asp_reward_small$"
