 hd_asp_card_mrc_fengying_desc:0 "#high Main Goal#!\n· After 371, Murong Wei is alive, independent and holding a kingdom or greater as primary title, and you are his vassal or councillor\n#high Bonus Goals#!\n· Murong Ping is dead or imprisoned\n· The seat of Changli (Fuli) is within Murong Wei's realm\n· At least one commandery of Ji Province is in your realm\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_yan_zhonglie$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.mrc_fengying:0 "You have set Murong Wei back on the throne of Yan. Those who once suspected you are still at court; you only smile."
