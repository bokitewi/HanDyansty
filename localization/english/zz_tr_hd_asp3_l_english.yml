 hd_asp_card_syj_kangqin:0 "Aspiration: $hd_asp_name_syj_kangqin$"
 hd_asp_card_syj_kangqin_desc:0 "#high Main Goal#!\n· After 378, you are still alive and independent, holding the title of Shuo Province (or with Yunzhong or Tuoba commandery as your primary title), with Yunzhong in your hands\n#high Bonus Goals#!\n· Fu Luo is dead or your prisoner\n· Liu Weichen is dead or your subject\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_yinshan_zhuang$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.syj_kangqin:0 "Qin's two hundred thousand have withdrawn south of the Great Wall. The histories should record that Dai fell this year, yet your banner still flies over Yunzhong."
