l_english:
 ###############################################################
 # 九场历史地方强制起义战争（第一阶段） 汉晋春秋
 ###############################################################

 # 共用CB
 hd_historical_revolt_cb:0 "Rebellious Warlordism"
 HD_HISTORICAL_REVOLT_WAR_NAME:0 "[ATTACKER.Custom('HD_HISTORICAL_REVOLT_NAME_BY_ATTACKER')]"
 hd_historical_revolt_war_victory_desc:0 "[attacker.GetShortUIName|U]Seize the commanderies designated as war objectives in this rebellion, break away from their original lords to become independent, and adopt [GetGovernment('celestial_government').GetName]."
 hd_historical_revolt_white_peace_desc:0 "Both sides cease hostilities; no transfer of territory occurs, and the rebel forces disperse separately."
 hd_historical_revolt_defeat_desc:0 "The rebellion has been suppressed; the land remains unharmed, and the rebel forces have scattered."

 # 战争名称（custom loc按起义领袖旗标分流）
 hd_revolt_war_name_jiaozhi:0 "General Zhutian's Uprising"
 hd_revolt_war_name_beigong:0 "Huangzhong Qiang Rebellion"
 hd_revolt_war_name_heishan:0 "Black Mountain Bandit Rebellion"
 hd_revolt_war_name_jiangxia:0 "Jiangxia Barbarian Rebellion"
 hd_revolt_war_name_wangguo:0 "Qiang Rebellion in the Northwest"
 hd_revolt_war_name_zhangchun:0 "Zhang Chun and Zhang Ju Rebellion"
 hd_revolt_war_name_bingzhou_hu:0 "Xiutu Hu"
 hd_revolt_war_name_maxiang:0 "Yizhou Yellow Turban Uprising"
 hd_revolt_war_name_yanbaihu:0 "Carve out a fiefdom"

 # 事件军名称
 hd_revolt_army_jiaozhi:0 "Jiaozhi Garrisoned Army"
 hd_revolt_army_beigong:0 "Huangzhong Righteous Followers Rebel Army"
 hd_revolt_army_heishan:0 "Black Mountain Army"
 hd_revolt_army_jiangxia:0 "Jiangxia Barbarians"
 hd_revolt_army_wangguo:0 "Kingdom of Liangzhou Army"
 hd_revolt_army_zhangchun:0 "Yuyang Rebels"
 hd_revolt_army_bingzhou_hu:0 "Xitugu Hu tribes"
 hd_revolt_army_maxiang:0 "Yizhou Yellow Turbans"
 hd_revolt_army_yanbaihu:0 "Yan Baitu's followers"

 # 生成首领称号名
 hd_jiaozhi_garrison_leader:0 "Jiaozhi Garrison Commander"
 nick_hd_zhutian_general:0 "General Pillar of Heaven"
 hd_jiangxia_manshuai:0 "Man"

 # REV-01 184.6 交趾柱天将军
 hd_historical_revolts.0001.t:0 "General Pillar of Heaven"
 hd_historical_revolts.0001.desc:0 "In the sweltering heat of June in Jiaozhi, a fire broke out first within the garrison camp at Longbian. \n\n The garrison soldiers seized the Inspector and the Administrator of HePu, installed a tribal chief as their leader, and proclaimed themselves \"General Who Supports the Sky.\" Proclamations had already spread throughout Jiuzhen and Rinan; all post roads beyond the mountains were cut off. \n\n The historical records do not even record [hd_revolt_leader.GetName]'s true name, but now he leads six thousand garrison troops to challenge the order of Jiaozhi. The story of Jia Cong pacifying Jiaozhi will only be reenacted when the court sends a new Inspector; for now, a rebel banner is hoisted atop Longbian City."
 # REV-02 184.10 北宫伯玉
 hd_historical_revolts.0002.t:0 "The Qiang and Hu tribes in Huangzhong rebelled."
 hd_historical_revolts.0002.desc:0 "The Qiang and Hu tribes of Huangzhong and Heguan rose in rebellion alongside the Xianlingi Qiang of Beidi, jointly electing [hd_revolt_leader.GetName] as general. The Xiongnu seized the Administrator of Jincheng, while the Protector of Qiang perished in the chaos of battle. \n\n The seat of Jincheng Commandery at Yunwu sent an urgent plea for aid; the route from Liangzhou to the Three Prefectures was on the verge of being severed. Scouts reported: rebel forces had mobilized tens of thousands of Qiang cavalry and Hu cavalry, advancing eastward. \n\n Liangzhou has never been a place known for obedience."
 # REV-03 185.2 黑山军
 hd_historical_revolts.0003.t:0 "Black Mountain Army Rises"
 hd_historical_revolts.0003.desc:0 "The bandits of the Taihang Valley have finally elected their own leader. \n\n[hd_revolt_leader.GetName] united forces with Zhang Niujiao to attack Xiantao, setting fire to Boling and Zhao Commandery everywhere. Within the army, they say this Changshan chushuai is as light as a swallow and brave and decisive, earning him the title \"Flying Swallow.\" The valleys are connected; large and small units each hold strategic positions, with Changshan and Zhao Commandery mountain passes filled with their scouts. \n\n In imperial edicts, they are merely called \"Heishan Bandits\"—but this bandit group will soon keep all of Hebei awake."
 # REV-04 185.4 江夏蛮（设计性日期后移：史载主要叛乱约180年）
 hd_historical_revolts.0004.t:0 "Jiangxia Barbarians Rebel"
 hd_historical_revolts.0004.desc:0 "In the mountains of Jingling, various tribes of the barbarians gathered. \n\n[hd_revolt_leader.GetName] They drove their forces out of the mountains and breached the county seat. The Man people of Jiangxia held sway over Yunmeng, relying on the mountains and rivers; when the imperial army advanced to suppress them, they scattered into the forests, but when the imperial army retreated, they emerged again to raid. \n\n The grain transport along the middle reaches of the Yangtze River once more fell into the hands of the Man people."
 # REV-05 187.4 王国
 hd_historical_revolts.0005.t:0 "Kingdom Raises Army"
 hd_historical_revolts.0005.desc:0 "A native of Hanyang, [hd_revolt_leader.GetName], took up the banner of the Liangzhou rebels. \n\n This time, their advance pointed directly at Chencang—the western gate of the Three Commanderies. If the conflict in Huangzhong remains unresolved, another rebel banner will rise in Liangzhou; if that situation is already settled, [hd_revolt_leader.GetName] they will strike alone at the pass. \n\n The old story of Huangfu Song pacifying Liangzhou back then is still remembered by some in the court. But now, fewer and fewer people remember it."
 # REV-06 187.6 张纯、张举
 hd_historical_revolts.0006.t:0 "Zhang Ju proclaimed himself emperor."
 hd_historical_revolts.0006.desc:0 "Former Zhongshan Xiang Zhang Chun and former Taishan Administrator Zhang Ju conspired with the Wuhuan chief Qi Liju to raise troops in Feiru. \n\n Zhang Ju proclaimed himself the Son of Heaven, while Zhang Chun styled himself \"General Who Calms the Heavens\" and \"King of Anding,\" serving as the supreme commander of all Wuhuan tribes. Hu cavalry breached the frontier passes; fire signals were raised across several commanderies in You and Ji provinces, and successive Protector of Wuhuan officers and county magistrates were slain. \n\n Order along the northern border was beginning to crumble, starting from Right Beiping."
 # REV-07 188.3 休屠各胡
 hd_historical_revolts.0007.t:0 "The Xiongruge Hu rebelled."
 hd_historical_revolts.0007.desc:0 "Meiji of Bingzhou—the former seat of the Southern Xiongnu—ignited a rebellion. \n\nThe Xiutuhe Hu [hd_revolt_leader.GetName]joined forces with the Right Wing of the Southern Xiongnu, amassing over 100,000 troops and advancing directly toward the Chanyu's court. The roads through Xihe and Shangjun were severed, causing turmoil among the Hu and Han peoples in Bingzhou. \n\nThe Hu tribes settled in the frontier commanderies over the past century had now become daggers thrust into the heart of the empire."
 # REV-08 188.6 马相
 hd_historical_revolts.0008.t:0 "Yizhou Yellow Turbans"
 hd_historical_revolts.0008.desc:0 "Mianzhu native [hd_revolt_leader.GetName] claimed the Yellow Turban banner, and within ten days, their numbers swelled to over ten thousand. \n\n The rebel forces killed the Mianzhu magistrate, breached Luocheng, and the Yizhou Inspector perished in the chaos of battle. [hd_revolt_leader.GetName] Riding this victory, he proclaimed himself Emperor; the Shu Commandery and Jianwei fell before his advance. \n\n The days when the Land of Heaven's Treasury could close its gates and defend itself are finally over."
 # REV-09 196.1 严白虎
 hd_historical_revolts.0009.t:0 "Yan Baitu gathered troops"
 hd_historical_revolts.0009.desc:0 "Yan Baitu of Wu, with over ten thousand followers, was stationed in various places. \n\n[hd_revolt_leader.GetName] Together with his faction, they each controlled fortified towers and guarded the key water and land routes of Wuxing Commandery. The Han government offices in Eastern Jiang had long been unable to issue orders beyond the commandery capital, while local warlords, clan leaders, and bandit chiefs ruled independently. \n\n Between Kuaiji and Wuxing, a new order was being written with swords."

 hd_historical_revolts.0010.t:0 "Forced to Join"
 hd_historical_revolts.0010.desc:0 "[hd_beigong_victor.GetName] has already seized the key strongholds of Liangzhou; wherever his army advances, no one dares to defy him. The envoy brings a military order: you must submit to Bei Gong Boyu and become his vassal. \n\n Your seal remains in your hand, yet the banners outside the city have changed. This submission is not a plea but coercion amidst the chaos of these times."
 hd_historical_revolts.0010.a:0 "Ordered to submit allegiance."

 hd_historical_revolts.a:0 "In this chaotic age, warlords each harbor their own ambitions."
