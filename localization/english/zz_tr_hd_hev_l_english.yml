 hd_hev_j16_liangshiwang_name:0 "The Assassination of Yang Chu"
 hd_hev_j16_liangshiwang_tt:0 "#high The Assassination of Yang Chu#!\nWindow 355.1.1 – 355.12.31\nYang Chu lives and Yang Songnu is in Qiuchi\nBoth deaths go to the death table and Yang Guo becomes heir"
 hd_hev_j16_zhangguan_name:0 "Zhang Guan Overthrows Zhang Zuo"
 hd_hev_j16_zhangguan_tt:0 "#high Zhang Guan Overthrows Zhang Zuo#!\nWindow 355.6.1 – 356.6.1\nZhang Zuo rules; Zhang Guan is landed in Liang\nZhang Zuo dies, Zhang Xuanjing takes the throne and Zhang Guan dominates; a player Zhang Zuo faces a civil war"
 hd_hev_346_05_name:0 "Huan Wen's Northern Expedition"
 hd_hev_346_05_tt:0 "#high Huan Wen's Northern Expedition#!\nWindow 356.1.1 – 362.1.1\nHuan Wen's Qin campaign is over; the emperor is a Henei Sima; Huan Wen is a Jin vassal at peace; Luoyang is not Jin's\nHuan Wen gets an event and marches on Henan. Lit when the war starts"
 hd_hev_j16_guanggu_name:0 "The Siege of Guanggu"
 hd_hev_j16_guanggu_tt:0 "#high The Siege of Guanggu#!\nWindow 356.1.1 – 357.12.31\nDuan Kan is independent, landed and borders Yan\nYan sends Murong Ke to besiege Guanggu (15,000); a player may decline\nLit when the war starts"
 hd_hev_j16_yangjun_name:0 "Yang Jun Kills Yang Guo"
 hd_hev_j16_yangjun_tt:0 "#high Yang Jun Kills Yang Guo#!\nWindow 356.1.1 – 356.12.31\nYang Guo rules Qiuchi and Yang Jun is within\nYang Jun takes power and Yang An flees to Qin; a player Yang Guo may be on guard"
 hd_hev_j16_sanyuan_name:0 "The Battle of Sanyuan"
 hd_hev_j16_sanyuan_tt:0 "#high The Battle of Sanyuan#!\nWindow 357.2.1 – 357.12.31\nYao Xiang is independent, landed and borders Qin\nQin attacks with 12,000 men; on victory Yao Xiang dies and Yao Chang submits; a player may decline\nLit when the war starts"
 hd_hev_346_06_name:0 "The Yunlong Gate Coup"
 hd_hev_346_06_tt:0 "#high The Yunlong Gate Coup#!\nWindow 357.6.1 – 360.1.1\nFu Jian has entered Guanzhong; Fu Jian (the younger) is adult and free; Chang'an is held by an AI Fu ruler (Fu Sheng)\nFu Jian gets an event to overthrow him, announced to the world. Lit on the historical choice"
 hd_hev_j16_wangmeng_name:0 "Wang Meng Joins Qin"
 hd_hev_j16_wangmeng_tt:0 "#high Wang Meng Joins Qin#!\nWindow 357.6.1 – 358.12.31\nFu Jian rules Qin; Wang Meng is landless and not yet in service\nWang Meng becomes chancellor and Fu Jian gains a lasting modifier; a player may decline"
 hd_hev_j16_qianye_name:0 "Yan Moves Its Capital to Ye"
 hd_hev_j16_qianye_tt:0 "#high Yan Moves Its Capital to Ye#!\nWindow 357.11.1 – 358.12.31\nThe Yan ruler holds Ye directly\nThe capital moves to Ye; a player may stay at Ji"
 hd_hev_j16_zhangping_name:0 "Zhang Ping Submits to Qin"
 hd_hev_j16_zhangping_tt:0 "#high Zhang Ping Submits to Qin#!\nWindow 358.1.1 – 359.8.1\nFu Jian rules Qin; Zhang Ping lives\nIf Zhang Ping is an independent lord Qin attacks him; Zhang Hao joins Qin as a peerless warrior\nLit when the war starts or Zhang Hao joins"
 hd_hev_j16_songhun_name:0 "Song Hun Destroys Zhang Guan"
 hd_hev_j16_songhun_tt:0 "#high Song Hun Destroys Zhang Guan#!\nWindow 359.6.1 – 359.12.31\nZhang Xuanjing rules; Zhang Guan and Song Hun live\nZhang Guan dies by the death table and Song Hun becomes chancellor; a player Song Hun may hold back"
 hd_hev_j16_huanwen_regent_name:0 "Huan Wen Takes the Regency"
 hd_hev_j16_huanwen_regent_tt:0 "#high Huan Wen Takes the Regency#!\nWindow 363.3.1 – 364.12.31\nHuan Wen is a landed direct vassal of the emperor and there is no regent\nHuan Wen becomes regent and chancellor, the emperor stays at Jiankang"
 hd_hev_j16_tianxi_name:0 "Zhang Tianxi Seizes Liang"
 hd_hev_j16_tianxi_tt:0 "#high Zhang Tianxi Seizes Liang#!\nWindow 363.6.1 – 364.6.1\nAn AI Zhang Xuanjing rules; Zhang Tianxi is adult and in the realm\nZhang Tianxi takes power (Xuanjing dies via the death table); a player may hold back"
 hd_hev_j16_luoyang365_name:0 "Yan Takes Luoyang"
 hd_hev_j16_luoyang365_tt:0 "#high Yan Takes Luoyang#!\nWindow 364.6.1 – 365.12.31\nHuan Wen's expedition is over, Luoyang belongs to the Jin emperor and Yan borders Jin\nYan sends Murong Ke against Henan (15,000); a player may decline\nLit when the war starts"
 hd_hev_j16_pingzhuan_name:0 "Murong Ke Dies, Murong Ping Dominates"
 hd_hev_j16_pingzhuan_tt:0 "#high Murong Ke Dies, Murong Ping Dominates#!\nWindow 367.5.1 – 367.12.31\nMurong Ke is dead; Murong Ping is at the Yan court\nThe Yan ruler gains a modifier and Murong Ping becomes chancellor; stays unlit if a player ruler governs himself"
 hd_hev_j16_sigong_name:0 "The Revolt of the Four Dukes"
 hd_hev_j16_sigong_tt:0 "#high The Revolt of the Four Dukes#!\nWindow 367.10.1 – 368.12.31\nFu Jian rules Qin; at least two of Fu Liu, Fu Shuang, Fu Sou and Fu Wu are landed\nThe largest breaks away and Fu Jian attacks (15,000); a player Fu Jian may conciliate\nLit when the war starts"
 hd_hev_j16_fangtou_name:0 "The Battle of Fangtou"
 hd_hev_j16_fangtou_tt:0 "#high The Battle of Fangtou#!\nWindow 369.4.1 – 369.12.31\nHuan Wen is landed and at peace; Yan borders Jin and holds Ji Commandery\nHuan Wen attacks Ji (20,000 vs 15,000) while Qin sends Gou Chi and Deng Qiang to help Yan; a player may decline\nLit when the war starts"
 hd_hev_j16_chui_benqin_name:0 "Murong Chui Flees to Qin"
 hd_hev_j16_chui_benqin_tt:0 "#high Murong Chui Flees to Qin#!\nWindow 369.10.1 – 370.2.12\nMurong Chui serves Yan; Yan won at Fangtou or Chui earned credit there; Qin exists\nChui defects to Qin and receives Huayin; a player may stay and defend himself"
 hd_hev_j16_dir_qin_s1_name:0 "Qin Director: Securing Guanzhong"
 hd_hev_j16_dir_qin_s1_tt:0 "#high Qin Director: Securing Guanzhong#!\nFirst stage of the Former Qin director\nThe Qin ruler (independent Fu lord of Chang'an) opens wars month by month for the commanderies of Guanzhong\nLit when the stage is truly complete"
 hd_hev_j16_dir_qin_s2_name:0 "Qin Director: Longyou and Qin Province"
 hd_hev_j16_dir_qin_s2_tt:0 "#high Qin Director: Longyou and Qin Province#!\nSecond stage of the Former Qin director\nTargets the commanderies of Longyou and Qin\nLit when the stage is truly complete"
 # 王猛伐燕与前秦一统（370–383；304、346、370 开局适用）
 hd_hev_j16_dir_qin_start_name:0 "Qin Director Begins"
 hd_hev_j16_dir_qin_start_tt:0 "#high Qin Director Begins#!\nWindow 351.1.1 – 382.6.1 (the 370 start launches it on the first tick)\nFu Jian has entered Guanzhong, a Qin ruler can be found and Qin has not collapsed\nThe director starts and expands Qin stage by stage"
 hd_hev_370_01_name:0 "The Siege of Jinyong (Battle of Luoyang)"
 hd_hev_370_01_tt:0 "#high The Siege of Jinyong (Battle of Luoyang)#!\nWindow 369.12.1 – 370.7.9\nThe Fu ruler of Chang'an and the Murong ruler of Henan are both independent; Jinyong belongs to Yan\nQin and Yan go to war (15,000 vs 8,000). Lit when Murong Zhu surrenders or Jinyong falls to Qin at the end of the war"
 hd_hev_370_04_name:0 "Ye Falls, Yan Is Destroyed"
 hd_hev_370_04_tt:0 "#high Ye Falls, Yan Is Destroyed#!\nWindow 369.12.1 – 372.1.1\nQin won the eastern campaign, or held Ye before 371.6.1; both rulers are alive and landed\nAn AI Yan ruler surrenders and his titles pass to Qin; a player may flee north to Longcheng"
 hd_hev_370_02_name:0 "The Eastern Campaign Against Yan"
 hd_hev_370_02_tt:0 "#high The Eastern Campaign Against Yan#!\nWindow 370.7.21 – 371.6.1\nThe Luoyang war has begun or ended; both rulers are independent and Ye belongs to Yan\nAn AI Qin ruler attacks Wei, Shangdang and Yang'e (a player may decline); one more attempt is allowed after a defeat"
 hd_hev_370_03_name:0 "The Shouchun Campaign"
 hd_hev_370_03_tt:0 "#high The Shouchun Campaign#!\nWindow 370.9.6 – 371.6.1\nA Yuan of Chen holds Shouchun independently and the emperor is a Henei Sima; outside the 370 start Jin must have lost at Fangtou and blamed Yuan Zhen\nThe emperor gets an event and Huan Wen joins the war; a player Yuan may hold out or surrender"
 hd_hev_j16_dir_qin_s3_name:0 "Qin Director: The Last of Yan"
 hd_hev_j16_dir_qin_s3_tt:0 "#high Qin Director: The Last of Yan#!\nContinues after Former Yan falls\nMops up the remaining commanderies of Yan\nLit when the stage is truly complete"
 hd_hev_370_05_name:0 "Huan Wen Deposes the Emperor"
 hd_hev_370_05_tt:0 "#high Huan Wen Deposes the Emperor#!\nWindow 371.12.24 – 373.1.1\nHuan Wen is landed under Sima Yi, who is still emperor; Sima Yu lives; in earlier starts Huan Wen must still be regent\nHuan Wen, Sima Yi and Sima Yu respond in turn (AI follows history); Sima Yu takes the throne and starts the Xian'an era"
 hd_hev_j16_dir_qin_s4_name:0 "Qin Director: Pacifying Qiuchi"
 hd_hev_j16_dir_qin_s4_tt:0 "#high Qin Director: Pacifying Qiuchi#!\nAfter the Qiuchi gate opens\nTakes Qiuchi\nLit only when Wudu belongs to Qin"
 hd_hev_j16_huanwen_dead_name:0 "Huan Wen Dies"
 hd_hev_j16_huanwen_dead_tt:0 "#high Huan Wen Dies#!\nWindow 373.3.1 – 384.1.1\nHuan Wen is alive at the start of the window and dies inside it\nLit after his death (the regency hand-off is blocked)"
 hd_hev_j16_mieliang_name:0 "The Conquest of Former Liang"
 hd_hev_j16_mieliang_tt:0 "#high The Conquest of Former Liang#!\nGate opens from 376.3.1 until the director stops\nThe Former Liang ruler is independent and borders Qin; the gate opens when Zhang Tianxi refuses (a player may submit)\nLit when Guzang belongs to Qin"
 hd_hev_j16_miedai_name:0 "The Conquest of Dai"
 hd_hev_j16_miedai_tt:0 "#high The Conquest of Dai#!\nAfter the Dai gate opens\nLit as soon as Yunzhong belongs to Qin\nWithin 376.6.1 – 379.1.1 Dai is divided between Liu Kuren and Liu Weichen"
 hd_hev_j16_beifu_name:0 "The Beifu Army"
 hd_hev_j16_beifu_tt:0 "#high The Beifu Army#!\nWindow 377.6.1 – 380.1.1\nXie Xuan serves Jin without a commandery; Guangling is held by an AI in the same realm\nGuangling is granted to Xie Xuan and the Beifu army is formed"
 hd_hev_j16_xiangyang_name:0 "The Siege of Xiangyang"
 hd_hev_j16_xiangyang_tt:0 "#high The Siege of Xiangyang#!\nWindow 377.10.1 – 380.1.1\nThe Qin ruler is independent, Xiangyang belongs to the Jin emperor and borders Qin\nQin sends Fu Pi with 15,000; a player may decline\nLit on a Qin victory; Zhu Xu joins Qin"
 hd_hev_j16_dir_qin_done_name:0 "Qin Director Finished"
 hd_hev_j16_dir_qin_done_tt:0 "#high Qin Director Finished#!\nAfter every stage is complete or abandoned\n—\nLit when the director wraps up"
 hd_hev_346_07_name:0 "Casting Whips to Dam the River (Battle of Fei)"
 hd_hev_346_07_tt:0 "#high Casting Whips to Dam the River (Battle of Fei)#!\nWindow 383.6.1 – 386.1.1\nThere is an emperor; the Qin ruler is independent with at least 100 counties, is not the emperor and is not already fighting him\nThe Qin ruler gets an event and attacks Jin for Yang. Lit when the war starts; the outcome is announced worldwide"
 hd_hev_346_08_name:0 "After the Fei (Former Qin Collapses)"
 hd_hev_346_08_tt:0 "#high After the Fei (Former Qin Collapses)#!\nQin loses or draws at the Fei\nThe Qin ruler, if alive, gets an event\nAll non-Di vassals of duke rank and above break away; announced worldwide"
 # 东晋末·王恭、孙恩与桓玄（396–404；304、346、370 开局适用）
 hd_hev_j16_wanggong_name:0 "Wang Gong Rises (Twice)"
 hd_hev_j16_wanggong_tt:0 "#high Wang Gong Rises (Twice)#!\nFirst rising 397.3.1 – 397.12.1; second 398.6.1 – 399.3.1\nWang Gong is landed in Jin; Wang Guobao and Sima Daozi are at court\nFirst: Daozi executes Wang Guobao; second: Liu Laozhi changes sides\nLit when either happens"
 hd_hev_j16_sunen_name:0 "Sun En Rises"
 hd_hev_j16_sunen_tt:0 "#high Sun En Rises#!\nYears 399 – 402, historical invasion Sun En\nSun En lives; the invasion rolls yearly\nLit when he rises (can happen in any start; shown as not this game outside the Jin starts)"
 hd_hev_j16_huanxuan_name:0 "Huan Xuan Enters Jiankang"
 hd_hev_j16_huanxuan_tt:0 "#high Huan Xuan Enters Jiankang#!\nWindow 401.12.1 – 403.1.1\nHuan Xuan holds a commandery under Jin; the Sima emperor has no regent; Sima Yuanxian is at court\nHuan Xuan purges the court by war (or peacefully) and becomes regent"
 hd_hev_j16_cuanchu_name:0 "Huan Xuan Usurps the Throne as Chu"
 hd_hev_j16_cuanchu_tt:0 "#high Huan Xuan Usurps the Throne as Chu#!\nWindow 403.9.1 – 404.3.1\nHuan Xuan has been regent for a year and is not emperor\nAn AI Huan Xuan accepts the abdication; a player may decline"
 # 北方诸国（395–412；参合陂至柴壁四行早于 404，404 开局显示开局前）
 hd_hev_j16_canhe_name:0 "The Battle of Canhe Slope"
 hd_hev_j16_canhe_tt:0 "#high The Battle of Canhe Slope#!\nWindow 395.5.1 – 396.3.1\nYan and Wei border each other at peace; Western Yan is gone\nYan sends Murong Bao against Wei; a player may decline\nLit when the war starts"
 hd_hev_j16_zhongshan_name:0 "Wei Takes Zhongshan"
 hd_hev_j16_zhongshan_tt:0 "#high Wei Takes Zhongshan#!\nWindow 397.1.1 – 398.6.1\nZhongshan belongs to Wei (taken by the Tuoba Gui invasion)\nWei gains prestige and the Yan treasury; Cui Hong joins Wei"
 hd_hev_j16_nanyan_di_name:0 "Southern Yan Becomes an Empire"
 hd_hev_j16_nanyan_di_tt:0 "#high Southern Yan Becomes an Empire#!\nWindow 399.6.1 – 401.6.1\nMurong De is independent and Guanggu is his\nHe becomes emperor, starts the Jianping era and moves to Guanggu"
 hd_hev_j16_chaibi_name:0 "The Battle of Chaibi"
 hd_hev_j16_chaibi_tt:0 "#high The Battle of Chaibi#!\nWindow 402.3.1 – 403.6.1\nWei and Later Qin border in Pingyang or Hedong at peace\nWei attacks in a border war; a player may decline or seek peace\nLit when the war starts"
 hd_hev_j16_xia_open_name:0 "Helian Bobo Founds Xia"
 hd_hev_j16_xia_open_tt:0 "#high Helian Bobo Founds Xia#!\nWindow 407.4.1 – 409.1.1\nBobo is landed (a Later Qin vassal, Later Qin is gone, or already independent)\nOpens the Helian Bobo invasion; lit once he has actually risen"
 hd_hev_j16_guzang_juqu_name:0 "Northern Liang Takes Guzang"
 hd_hev_j16_guzang_juqu_tt:0 "#high Northern Liang Takes Guzang#!\nWindow 410.1.1 – 413.6.1\nNorthern and Southern Liang border; Guzang belongs to Southern Liang\nNorthern Liang attacks; lit when Guzang actually belongs to Northern Liang"
 # 刘裕北伐与晋宋禅代（404–421；四个两晋开局都适用）
 hd_hev_404_01_name:0 "Fuzhou Hill (Huan Xuan Flees West)"
 hd_hev_404_01_tt:0 "#high Fuzhou Hill (Huan Xuan Flees West)#!\nFive days after the Jingkou rising (404.2.1 – 405.1.1, all starts) Huan Xuan gets an event; fallback window 404.3.29 – 405.1.1\nLiu Yu is fighting Huan Xuan for independence and Huan Xuan holds the realm\nHuan Xuan abandons the capital. Lit on the historical choice"
 hd_hev_404_02_name:0 "Zhengrong Isle (Jin Restored)"
 hd_hev_404_02_tt:0 "#high Zhengrong Isle (Jin Restored)#!\nWindow 404.6.10 – 405.6.1\nHuan Xuan has fled west; Liu Yu is independent; Huan Xuan holds the realm; Emperor An or Sima Dewen lives\nLiu Yu gets an event: against an AI Huan Xuan the Jin emperor is restored at once, against a player there is war. Lit on restoration or war"
 hd_hev_j16_liuyu_regent_name:0 "Liu Yu Takes Charge"
 hd_hev_j16_liuyu_regent_tt:0 "#high Liu Yu Takes Charge#!\nFallback window 404.7.1 – 409.4.1, from 408.2.1\nLiu Yu serves Jin, is not emperor, and the emperor has no regent\nLiu Yu becomes regent; also lit when the Zhengrong restoration makes him regent (the normal path)"
 hd_hev_404_03_name:0 "Lu Xun Takes Panyu"
 hd_hev_404_03_tt:0 "#high Lu Xun Takes Panyu#!\nWindow 404.10.15 – 406.1.1\nLu Xun is alive, adult and landless; Panyu is not his\nLu Xun gets an event to seize Panyu and attack Nanhai. Lit on the historical choice"
 hd_hev_404_04_name:0 "The Wucheng Mutiny (Qiao Zong)"
 hd_hev_404_04_tt:0 "#high The Wucheng Mutiny (Qiao Zong)#!\nHistorical invasion Qiao Zong, rolled yearly 404 – 412\nQiao Zong lives\nLit when the invasion rises (can happen in any start)"
 hd_hev_404_05_name:0 "The Conquest of Southern Yan"
 hd_hev_404_05_tt:0 "#high The Conquest of Southern Yan#!\nWindow 409.4.1 – 413.1.1\nLiu Yu is regent (or an independent king or higher) and not leading another historical war; an independent Murong holds Guanggu or Qi\nLiu Yu marches on Qing. Lit when the war starts or is judged"
 hd_hev_j16_luxun_north_name:0 "Lu Xun and Xu Daofu March North"
 hd_hev_j16_luxun_north_tt:0 "#high Lu Xun and Xu Daofu March North#!\nWindow 410.2.1 – 411.3.1\nLu Xun is independent with land in Nanhai; the emperor is a Sima; Liu Yu is fighting Southern Yan or it is past 410.4.1\nAn AI Lu Xun marches north; a player may hold Lingnan\nLit when the war starts"
 hd_hev_j16_tao_liuyi_name:0 "Liu Yi Is Destroyed"
 hd_hev_j16_tao_liuyi_tt:0 "#high Liu Yi Is Destroyed#!\nWindow 412.9.1 – 413.3.1\nLiu Yu is regent; Liu Yi is a landed Jin vassal\nLiu Yi falls (death table) and Nan Commandery later goes to Sima Xiuzhi"
 hd_hev_j16_pingshu_name:0 "Zhu Lingshi Pacifies Shu"
 hd_hev_j16_pingshu_tt:0 "#high Zhu Lingshi Pacifies Shu#!\nWindow 412.12.1 – 414.6.1\nAn independent Qiao rules Chengdu; Liu Yu is regent\nLiu Yu sends Zhu Lingshi against Shu; skipped if the Qiao Zong invasion never happened\nLit when the war starts"
 hd_hev_j16_tao_xiuzhi_name:0 "The Campaign Against Sima Xiuzhi"
 hd_hev_j16_tao_xiuzhi_tt:0 "#high The Campaign Against Sima Xiuzhi#!\nWindow 415.1.1 – 416.3.1\nSima Xiuzhi is a landed Jin vassal; Liu Yu is regent; Lu Zongzhi lives\nOne of Xiuzhi's commanderies goes to Liu Daolian and Xiuzhi flees; a player may rebel or decline"
 hd_hev_404_06_name:0 "The Conquest of Later Qin"
 hd_hev_404_06_tt:0 "#high The Conquest of Later Qin#!\nWindow 416.9.1 – 419.1.1\nSouthern Yan and Xiuzhi are dealt with; Liu Yu qualifies as above; an independent Yao holds Chang'an\nLiu Yu marches on Sili. Lit when the war starts or is judged"
 hd_hev_j16_songgong_name:0 "The Nine Bestowments, Duke of Song"
 hd_hev_j16_songgong_tt:0 "#high The Nine Bestowments, Duke of Song#!\nWindow 418.6.1 – 419.12.1\nLiu Yu is a landed regent; Later Qin has fallen or it is past 418.12.1\nA new kingdom-tier Song is created for Liu Yu; a player may decline once"
 hd_hev_j16_changan_lost_name:0 "Chang'an Is Lost"
 hd_hev_j16_changan_lost_tt:0 "#high Chang'an Is Lost#!\nWindow 418.9.1 – 419.6.1\nThe governor of Guanzhong holds Jingzhao or Chang'an; Helian Bobo is independent and borders him\nBobo takes Chang'an (if already at war, Xia only gets 8,000 troops)"
 hd_hev_j16_gongdi_name:0 "Emperor An Is Murdered, Emperor Gong Succeeds"
 hd_hev_j16_gongdi_tt:0 "#high Emperor An Is Murdered, Emperor Gong Succeeds#!\nWindow 418.12.1 – 419.6.1\nLiu Yu is Duke of Song; an AI Emperor An reigns; Sima Dewen lives\nAn names Dewen heir (An is murdered on 419.1.28); lit when Dewen takes the throne and starts the Yuanxi era"
 hd_hev_j16_songwang_name:0 "Liu Yu Becomes King of Song"
 hd_hev_j16_songwang_tt:0 "#high Liu Yu Becomes King of Song#!\nWindow 419.7.1 – 420.6.1\nLiu Yu holds Song and is regent\nA new empire-tier Song is created above it; a player may decline once"
 hd_hev_404_07_name:0 "Abdication (Song Replaces Jin)"
 hd_hev_404_07_tt:0 "#high Abdication (Song Replaces Jin)#!\nWindow 419.12.1 – 421.1.1\nLiu Yu is regent; he is King of Song or it is past 420.6.1; the emperor is not An or it is past 420.6.1\nAn AI Liu Yu accepts the abdication (a player may delay a year); the realm becomes Song, announced worldwide"
 hd_hev_531_01_name:0 "An Emperor Raised at Xindu"
 hd_hev_531_01_tt:0 "#high An Emperor Raised at Xindu#!\nFrom 531.10.31\nGao Huan is independent and free; Yuan Lang lives and is not emperor\nGao Huan raises Yuan Lang, starting the Zhongxing era as Wei"
 hd_hev_531_02_name:0 "The Attack on Ye"
 hd_hev_531_02_tt:0 "#high The Attack on Ye#!\nFrom 531.12.1\nGao Huan is independent and Liu Dan still holds Wei\nGao Huan attacks Ye (10,000 from Xindu); Liu Dan dies on victory"
 hd_hev_531_03_name:0 "The Battle of Hanling"
 hd_hev_531_03_tt:0 "#high The Battle of Hanling#!\n532.4.20 – 533.1.1\nGao Huan holds Ye and Erzhu Zhao is independent\nErzhu Zhao attacks Ye; Gao Huan wins if he holds it and Erzhu Zhongyuan flees to Liang"
 hd_hev_531_04_name:0 "Gao Huan Enters Luoyang"
 hd_hev_531_04_tt:0 "#high Gao Huan Enters Luoyang#!\nFrom 532.5, after Gao Huan wins at Hanling\nGao Huan is independent, Yuan Gong still reigns and Yuan Xiu lives\nHusi Chun kills Erzhu Shilong and others, Yuan Gong abdicates to Yuan Xiu and Gao Huan becomes chancellor"
 hd_hev_531_05_name:0 "Heba Yue Is Killed, Yuwen Tai Takes Guanzhong"
 hd_hev_531_05_tt:0 "#high Heba Yue Is Killed, Yuwen Tai Takes Guanzhong#!\nFrom 534.2\nHeba Yue is an alive, landed AI\nYuwen Tai, under the same liege, first takes all of Heba Yue's land, then Houmochen Yue kills him; no pop-up"
 hd_hev_617_01_name:0 "The Battle of Xihe"
 hd_hev_617_01_tt:0 "#high The Battle of Xihe#!\nAt the start Li Yuan is at war with Gao Deru of Xihe\nLi Yuan wins if Zishi ends up on his side\nOn victory Xihe goes to Li Yuan and Gao Deru dies"
 hd_hev_617_02_name:0 "The Siege of the Eastern Capital"
 hd_hev_617_02_tt:0 "#high The Siege of the Eastern Capital#!\nAt the start Li Mi is at war with Yang Tong for Henan\nLi Mi wins if Luoyang ends up on his side\nOn victory Henan goes to Li Mi"
 hd_hev_617_03_name:0 "Relieving the Eastern Capital"
 hd_hev_617_03_tt:0 "#high Relieving the Eastern Capital#!\n617.8.7 – 618.4.1\nWang Shichong holds Jiangdu and Yang Tong holds Luoyang and Yanshi\nWang Shichong (AI goes north at once) becomes Yang Tong's vassal with Yanshi and 10,000 troops"
 hd_hev_617_04_name:0 "Xue Ju Proclaims Himself Emperor"
 hd_hev_617_04_tt:0 "#high Xue Ju Proclaims Himself Emperor#!\nFrom 617.8.7\nXue Ju is alive and independent\nHe becomes emperor directly; no pop-up"
 hd_hev_617_05_name:0 "Li Yuan Marches on Chang'an"
 hd_hev_617_05_tt:0 "#high Li Yuan Marches on Chang'an#!\n617.8.10 – 618.6.1\nLi Yuan is independent with Taiyuan; Yang You still holds Jingzhao\nLi Yuan attacks (AI at once); a player Yang You may open the gates; Li Yuan becomes King of Tang on taking Chang'an"
 hd_hev_617_06_name:0 "Li Gui Rises"
 hd_hev_617_06_tt:0 "#high Li Gui Rises#!\n617.8.14 – 618.3.1\nLi Gui is alive and not independent; Wuwei is not taken by another rebel\nHe takes Wuwei, becomes independent Great King of Liang and starts the Anle era; no pop-up"
 hd_hev_617_07_name:0 "Xiao Xian Rises at Baling"
 hd_hev_617_07_tt:0 "#high Xiao Xian Rises at Baling#!\n617.11.4 – 618.3.1\nXiao Xian holds Luo County and is not independent\nHe rises (AI at once), takes Changsha and becomes Duke of Liang"
 hd_hev_617_08_name:0 "The Hongmen Banquet (Death of Zhai Rang)"
 hd_hev_617_08_tt:0 "#high The Hongmen Banquet (Death of Zhai Rang)#!\n617.12.4 – 618.6.1\nZhai Rang is an alive AI vassal of Li Mi\nLi Mi (AI at once) takes back his counties and kills him at a banquet"
 hd_hev_617_09_name:0 "Dou Jiande Becomes King of Xia"
 hd_hev_617_09_tt:0 "#high Dou Jiande Becomes King of Xia#!\nFrom 618.2.1\nDou Jiande is alive and independent\nHe renames his realm Xia as king and starts the Wufeng era; no pop-up"
 hd_hev_617_10_name:0 "The Jiangdu Coup"
 hd_hev_617_10_tt:0 "#high The Jiangdu Coup#!\n618.4.11 – 619.1.1\nEmperor Yang lives and still holds the realm and Guangling; Yuwen Huaji lives\nAn AI Emperor Yang is strangled, Yang Tong succeeds with the Huangtai era and Wang Shichong as chancellor; a player Emperor Yang survives but Yuwen Huaji seizes Jiangdu and attacks"
 hd_hev_617_11_name:0 "Xiao Xian Proclaims Himself Emperor"
 hd_hev_617_11_tt:0 "#high Xiao Xian Proclaims Himself Emperor#!\nFrom 618.5.1\nXiao Xian is alive, independent and has risen\nHe becomes emperor and starts the Mingfeng era; no pop-up"
 hd_hev_617_12_name:0 "The Abdication (Tang Is Founded)"
 hd_hev_617_12_tt:0 "#high The Abdication (Tang Is Founded)#!\n618.6.18 – 619.6.1\nLi Yuan is independent with Chang'an and someone else holds the realm\nLi Yuan (AI at once) takes the realm as Tang and starts the Wude era"
 hd_hev_617_13_name:0 "The King of Zheng Forces an Abdication"
 hd_hev_617_13_tt:0 "#high The King of Zheng Forces an Abdication#!\n619.5.1 – 620.1.1\nWang Shichong is Yang Tong's vassal and Yang Tong holds Luoyang\nA player on either side is asked (AIs resolve at once); Wang Shichong usurps as Zheng with the Kaiming era"
