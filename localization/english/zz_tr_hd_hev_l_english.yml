l_english:
 hd_hev_btn_tt:0 "Historical event list (debug)"
 hd_hev_btn_label:0 "Hist"
 hd_hev_window_title:0 "Historical Events"
 hd_hev_window_help:0 "#weak Triggered means the node has happened (wars count from the declaration; an event counts once fired even if a player chose another outcome). Expired, not yet due and usually player-refused nodes show Not yet; rows marked otherwise say so in their tooltip. Events from other starts show Not this game. In the Jin and Sixteen Kingdoms groups (304–421) rows earlier than the current start show Before start. Hover over a name for its conditions.#!"
 hd_hev_st_done:0 "#P Triggered#!"
 hd_hev_st_wait:0 "Not yet"
 hd_hev_st_na:0 "#weak Not this game#!"
 hd_hev_st_past:0 "#weak Before start#!"
 hd_hev_st_past_tt:0 "Already history before this game began: this event is earlier than the current start date, so the start marks it as having happened and it will not fire."
 hd_hev_grp_here:0 "#P (this game)#!"
 hd_hev_grp_22_name:0 "#high Eastern Han: The Chunling Uprising (22.11.13)#!"
 hd_hev_grp_89_name:0 "#high Eastern Han: The Yanran Inscription (89.1.30)#!"
 hd_hev_grp_184_name:0 "#high The Fall of Han (184.1.1)#!"
 hd_hev_grp_long_name:0 "#high Long-Running Lines: the Five Hu, the Southern Migration, Envoys from Da Qin (several starts)#!"
 hd_hev_grp_218_name:0 "#high The Three Kingdoms (218.1.1)#!"
 hd_hev_grp_253_name:0 "#high Jiang Wei's Northern Campaigns (253.3.1; the 218 start relays from 253.3.1; only the Wei invasion row applies to 263)#!"
 hd_hev_grp_263_name:0 "#high Zhong Hui Invades Shu (263.9.20; the 218 and 253 starts relay from 263.8.1)#!"
 hd_hev_grp_304_name:0 "#high Late Western Jin: the Eight Princes and the Yongjia Disaster (304–317; 304 start)#!"
 hd_hev_grp_346_name:0 "#high Later Zhao Collapses, Qin and Yan Rise (346–370; 304 and 346 starts)#!"
 hd_hev_grp_370_name:0 "#high Wang Meng Conquers Yan, Former Qin Unites the North (370–383; 304, 346 and 370 starts)#!"
 hd_hev_grp_404_name:0 "#high Liu Yu's Campaigns and the Song Usurpation (404–421; all four Jin starts)#!"
 hd_hev_grp_j16_e2_name:0 "#high Early Eastern Jin: the Two Zhaos (317–346; 304 start)#!"
 hd_hev_grp_j16_e5j_name:0 "#high Late Eastern Jin: Wang Gong, Sun En and Huan Xuan (396–404; 304, 346 and 370 starts)#!"
 hd_hev_grp_j16_e5_name:0 "#high The Northern States (395–412; the first four rows predate the 404 start)#!"
 hd_hev_grp_531_name:0 "#high Rising at Xindu (531.7.1)#!"
 hd_hev_grp_617_name:0 "#high Rising at Jinyang (617.6.23)#!"
 hd_hev_22_01_name:0 "The Chunling Uprising (Battle of Wan)"
 hd_hev_22_01_tt:0 "#high The Chunling Uprising (Battle of Wan)#!\nOn the 22.11.13 start day (after the lobby)\nIf Liu Yan is independent and Zhen Fu still holds Nanyang, Liu Yan opens a border war against him\nWang Kuang of Xinshi and Chen Mu of Pinglin join the attack\nHan wins if Wan ends up on its side; AI Zhen Fu and Liangqiu Ci die"
 hd_hev_22_02_name:0 "The Meeting at Yiqiu (Xiajiang Joins)"
 hd_hev_22_02_tt:0 "#high The Meeting at Yiqiu (Xiajiang Joins)#!\nFrom 22.12.13 until 23.6.1\nWang Chang is independent, landed and not at war, and Liu Yan is still fighting at Wan\nWang Chang's Xiajiang army joins the attack with 4,000 men\nA player Wang Chang may join or stay apart"
 hd_hev_22_03_name:0 "Liu Xuan Is Raised Up (Gengshi Emperor)"
 hd_hev_22_03_tt:0 "#high Liu Xuan Is Raised Up (Gengshi Emperor)#!\nFrom 23.3.11 until 24.1.1\nLiu Xuan is landless and at least 3 of Liu Yan, Wang Kuang, Chen Mu and Wang Chang are independent and landed\nLiu Xuan receives Sui or Yingshan, becomes Han emperor and starts the Gengshi era\nThe four leaders submit: AIs at once, players choose"
 hd_hev_22_04_name:0 "The Siege of Kunyang"
 hd_hev_22_04_tt:0 "#high The Siege of Kunyang#!\nFrom 23.5.8 until 24.1.1\nWang Mang still holds the realm, Liu Xuan is emperor and Liu Xiu is a landed Gengshi vassal\nKunyang goes to Liu Xiu and Wang Yi attacks with 30,000\nA player Liu Xiu may hold or abandon the city; a Han victory kills Wang Xun and costs Wang Mang prestige"
 hd_hev_22_05_name:0 "The Generals of Yingchuan"
 hd_hev_22_05_tt:0 "#high The Generals of Yingchuan#!\nFrom the end of Kunyang (or 23.8.1) until 24.6.1\nLiu Xiu is alive and landed\nFeng Yi, Ji Zun, Wang Ba, Yao Qi and others join his court (only unemployed AIs)\nA player Liu Xiu gets one notice"
 hd_hev_22_06_name:0 "The Death of Bosheng"
 hd_hev_22_06_tt:0 "#high The Death of Bosheng#!\nFrom 23.7.7 (after Kunyang, or 24.1.1)\nHan won at Kunyang, Liu Xuan is still emperor and Liu Yan is his AI vassal\nThe Gengshi emperor kills Liu Yan\nA player Liu Xiu may apologise or leave in anger (becoming a rival)"
 hd_hev_22_07_name:0 "The Plot of Liu Xin and Wang She"
 hd_hev_22_07_tt:0 "#high The Plot of Liu Xin and Wang She#!\n23.8.1\nOnly if Wang Mang still holds the realm\nAI Liu Xin and Wang She kill themselves and Dong Zhong is killed (players do not die)\nNo pop-up"
 hd_hev_22_08_name:0 "The Realm Rises Against Wang Mang"
 hd_hev_22_08_tt:0 "#high The Realm Rises Against Wang Mang#!\nFrom 23.8.1 until 24.1.1\nWang Mang still holds the realm\nWei Xiao rises at Tianshui, Gongsun Shu rises in Shu and Wang Mang's AI governors (except Sili) break away\nA player Wang Mang is notified"
 hd_hev_22_09_name:0 "The Fall of Chang'an (Through the Wu Pass)"
 hd_hev_22_09_tt:0 "#high The Fall of Chang'an (Through the Wu Pass)#!\nAfter the realm rises, the Gengshi emperor (or the strongest rebel) attacks Jingzhao through the Wu Pass\nWhen Chang'an falls Xin ends: the realm and the seal pass to the attacker and an AI Wang Mang dies\nA player attacker sees the march first; a player Wang Mang may flee or hold\nIf still untaken on 26.1.1 an uprising inside the city ends it (except for a player Wang Mang)"
 hd_hev_22_10_name:0 "Crossing North with the Credentials"
 hd_hev_22_10_tt:0 "#high Crossing North with the Credentials#!\nFrom 23.11.1 until 25.1.1\nLiu Xiu is alive and landed\nHe crosses north, takes Anping (Xindu) and 5,000 troops; Deng Yu, Ren Guang, Geng Chun and others join\nA player may go or stay; a player liege is asked first\n(Counts as soon as it fires)"
 hd_hev_22_11_name:0 "The King of Xiao Refuses the Summons"
 hd_hev_22_11_tt:0 "#high The King of Xiao Refuses the Summons#!\n120 days after crossing north (or after leaving in anger; retried from 25.8.5), until 27.1.1\nLiu Xiu holds a commandery or higher and is not independent\nHe breaks away as King of Xiao and becomes a conqueror\nA player Liu Xiu may refuse or obey; a player liege is notified"
 hd_hev_22_12_name:0 "March on Handan"
 hd_hev_22_12_tt:0 "#high March on Handan#!\nAfter Liu Xiu breaks away, until 26.1.1\nLiu Xiu is independent and landed and does not hold Handan\nHe attacks the holder of Handan (Xiangguo) with 10,000; an AI Wang Lang dies on defeat\nA player may march or wait; Geng Yan, Wu Han and others join"
 hd_hev_22_13_name:0 "Enthronement at Qianqiu Pavilion"
 hd_hev_22_13_tt:0 "#high Enthronement at Qianqiu Pavilion#!\nFrom 25.8.5 until 27.1.1\nLiu Xiu is independent and landed\nHe becomes emperor (new empire title or the realm) and starts the Jianwu era; Ma Wu and Cen Peng join\nA player may delay (asked again on 26.6.1)"
 # 汉代风味内容（2026-10-25）手工加行；生成器 build_data.py 未同步，勿直接重跑
 hd_hev_22_14_name:0 "The Failures of Xin"
 hd_hev_22_14_tt:0 "#high The Failures of Xin#!\nOne event each on days 20, 80 and 140 after the start, until 23.6.1\nWang Mang lives\nSent to Wang Mang and players in his realm; Xin counties get a three-year modifier at start (not if historical events are off)"
 hd_hev_22_15_name:0 "Fixing the Fire Virtue"
 hd_hev_22_15_tt:0 "#high Fixing the Fire Virtue#!\nAfter Liu Xiu becomes emperor, checked every 90 days until 30.1.1\nLiu Xiu lives as emperor\nHe fixes the dynastic virtue: Fire (legitimacy) or Water"
 hd_hev_89_01_name:0 "Inscription at Yanran (Battle of Mount Jiluo)"
 hd_hev_89_01_tt:0 "#high Inscription at Yanran (Battle of Mount Jiluo)#!\nFrom 89.6.27 until 90.1.19\nAn independent ruler other than the emperor holds Ongiin in the Gobi\nDou Xian (else Deng Hong, else the emperor) marches north with the Southern Chanyu\nOn victory Dou Xian carves the stone, becomes Grand General and Ongiin goes to Shuofang; a player may delay"
 hd_hev_89_02_name:0 "Mount Jinwei"
 hd_hev_89_02_tt:0 "#high Mount Jinwei#!\nFrom 91.3.9 until 92.1.27\nThe Northern Chanyu is independent and holds Gobi Altai (or Orkhon)\nGeng Kui and Ren Shang strike from Juyan with the Southern Chanyu\nOn victory the Northern Chanyu migrates west (a player may surrender instead) and eastern tribes take the name Xianbei"
 hd_hev_89_03_name:0 "Protector General of the Western Regions"
 hd_hev_89_03_tt:0 "#high Protector General of the Western Regions#!\nFrom 91.12.29 until 93.1.1\nBan Chao is alive and landed\nHe becomes Protector General with prestige, the Western Regions kingdom (as a Han vassal) and 8,000 men; war if Qiuci refuses\nA player king of Qiuci may submit or refuse"
 hd_hev_89_04_name:0 "Yuchujian Submits"
 hd_hev_89_04_tt:0 "#high Yuchujian Submits#!\nFrom 91.12.29 (after a Han win at Jinwei) until 93.1.1\nYuchujian is alive, independent and landed\nHe sends envoys and accepts Han as overlord\nA player may submit or stay independent"
 hd_hev_89_05_name:0 "The North Palace Gates Close (Fall of the Dou)"
 hd_hev_89_05_tt:0 "#high The North Palace Gates Close (Fall of the Dou)#!\nA year after both northern wars end, not before 92.8.14\nDou Xian lives and there is an emperor\nThe emperor and Zheng Zhong strip Dou Xian; AI Dou brothers return land and die, Deng Die and Guo Ju die in prison\nA player emperor may act or wait; a player Dou Xian may submit or rebel"
 hd_hev_89_06_name:0 "Yuchujian Rebels and Is Killed"
 hd_hev_89_06_tt:0 "#high Yuchujian Rebels and Is Killed#!\n93.7.1\nYuchujian has submitted and is AI\nHe rebels and is hunted down by Ren Shang\nNo pop-up"
 hd_hev_89_07_name:0 "The Campaign Against Yanqi"
 hd_hev_89_07_tt:0 "#high The Campaign Against Yanqi#!\nFrom 94.8.1 until 96.1.1\nBan Chao is landed and Yanqi has not submitted\nBan Chao leads eight states against Yanqi; on victory AI King Guang dies and Yuanmeng rules as a Han vassal\nPlayers on either side may decline or submit"
 hd_hev_89_08_name:0 "The Yuezhi Attack"
 hd_hev_89_08_tt:0 "#high The Yuezhi Attack#!\nFrom 90.6.1 until 91.6.1\nBan Chao is alive and landed\nThe Yuezhi viceroy Xie attacks with 70,000; an AI Ban Chao holds fast and gains prestige\nA player may hold or fight"
 hd_hev_89_09_name:0 "The Northern Xiongnu Migrate West"
 hd_hev_89_09_tt:0 "#high The Northern Xiongnu Migrate West#!\nAfter the Han win at Jinwei\nThe Northern Chanyu is AI or a player chose to flee\nYuchujian keeps two commanderies, the east becomes Xianbei, Gaochang and others break away; the Chanyu moves west and the Xiongnu empire title is destroyed\nNo pop-up"
 hd_hev_89_10_name:0 "The Campaign Against Qiuci"
 hd_hev_89_10_tt:0 "#high The Campaign Against Qiuci#!\nAfter the protectorate is set up and Qiuci still resists, until 93.1.1\nBan Chao is alive and landed\nHe attacks Qiuci; on victory the AI king is deposed and Bai Ba rules as his vassal\nPlayers on either side may decline or submit"
 hd_hev_89_11_name:0 "Marquis of Dingyuan"
 hd_hev_89_11_tt:0 "#high Marquis of Dingyuan#!\nFrom 95.3.1 (after victory at Yanqi) until 98.1.1\nBan Chao lives\nHe is enfeoffed with prestige and a title\nA player may accept or decline"
 hd_hev_89_12_name:0 "An Envoy to Da Qin"
 hd_hev_89_12_tt:0 "#high An Envoy to Da Qin#!\nFrom 97.1.1 until 99.1.1\nBan Chao is alive and landed\nGan Ying travels west to the sea and returns: prestige and a modifier\nA player may send him or not"
 hd_hev_89_13_name:0 "Home Through the Jade Gate"
 hd_hev_89_13_tt:0 "#high Home Through the Jade Gate#!\nMemorial 100.6.1, hand-over 102.8.1\nBan Chao is alive and landed\nRen Shang takes over the protectorate and an AI Ban Chao returns to Luoyang\nA player may return (keeping a seat of two counties) or stay"
 # 汉代风味内容（2026-10-25）手工加行；生成器 build_data.py 未同步，勿直接重跑
 hd_hev_89_14_name:0 "Ban Zhao Continues the History"
 hd_hev_89_14_tt:0 "#high Ban Zhao Continues the History#!\nUntil 110.1.1\nBan Gu is dead, Ban Zhao lives, there is an emperor\nIf approved the Book of Han is finished 3 – 5 years later; a player Ban Zhao gets an extra event"
 hd_hev_89_15_name:0 "The Book of Han Is Finished"
 hd_hev_89_15_tt:0 "#high The Book of Han Is Finished#!\n3 – 5 years after approval, until 120.1.1\nBan Zhao lives\nThe emperor receives the Book of Han artifact"
 hd_hev_89_16_name:0 "Cai Lun's Paper"
 hd_hev_89_16_tt:0 "#high Cai Lun's Paper#!\n105.1.1 – 112.1.1\nCai Lun lives and there is an emperor\nIf praised the emperor gains a five-year modifier; a player Cai Lun gets an event"
 hd_hev_89_17_name:0 "The Old Case of Consort Song"
 hd_hev_89_17_tt:0 "#high The Old Case of Consort Song#!\n121.1.1 – 125.1.1\nCai Lun is alive and free and not emperor\nSummoned to the court of justice, an AI Cai Lun takes poison; a player may drink or plead"
 hd_hev_89_18_name:0 "The Seismoscope (and the Longxi Quake)"
 hd_hev_89_18_tt:0 "#high The Seismoscope (and the Longxi Quake)#!\n132.1.1 – 138.1.1\nZhang Heng lives and there is an emperor\nThe emperor gains the seismoscope; placed at the observatory, a Longxi quake follows in 1 – 3 years (until 140.1.1)"
 hd_hev_89_19_name:0 "Debate on Abandoning Liang"
 hd_hev_89_19_tt:0 "#high Debate on Abandoning Liang#!\n110.1.1 – 113.1.1\nDeng Zhi lives and the emperor holds counties in Liang\nThe emperor chooses: abandon (Deng Zhi), hold (Yu Xu) or pacify"
 hd_hev_184_01_name:0 "The Blue Heaven Is Dead (Yellow Turban Rebellion)"
 hd_hev_184_01_tt:0 "#high The Blue Heaven Is Dead (Yellow Turban Rebellion)#!\nDay 2 after the 184.1.1 start\nMa Yuanyi is executed and Zhang Jue rises in Ji\nThree Yellow Turban armies declare war on Han\nAll players are notified"
 hd_hev_184_02_name:0 "The Peach Garden Oath (and Patrons for the Cause)"
 hd_hev_184_02_tt:0 "#high The Peach Garden Oath (and Patrons for the Cause)#!\nAfter the 184 lobby, from Liu Bei's life story\nLiu Bei, Guan Yu and Zhang Fei live and the Yellow Turban outcome is open\nThey swear brotherhood and Guan and Zhang join Liu Bei\n7 – 14 days later Zhang Shiping and Su Shuang give money and men"
 hd_hev_184_03_name:0 "The Pillar of Heaven General (Jiaozhi Mutiny)"
 hd_hev_184_03_tt:0 "#high The Pillar of Heaven General (Jiaozhi Mutiny)#!\nMonthly from 184.6 to 186.12\nThe Yellow Turbans have risen and Jiaozhi has a governor\nThe rebels attack the governor of Jiaozhi\nPop-up only for a player defender"
 hd_hev_184_04_name:0 "The Huangzhong Qiang Revolt (Beigong Boyu)"
 hd_hev_184_04_tt:0 "#high The Huangzhong Qiang Revolt (Beigong Boyu)#!\nMonthly from 184.10 to 186.12\nThe Yellow Turbans have risen and Jincheng or Guangwei has a governor\nBeigong Boyu, Han Sui and others rise\nNeighbours submit after a victory"
 hd_hev_184_05_name:0 "The Yellow Turban Outcome"
 hd_hev_184_05_tt:0 "#high The Yellow Turban Outcome#!\nAll three main wars ended with no rebel win: Han survives\nAny forced rebel win: Han falls\nAll players get the outcome event\nIf Han survives the palace crisis is scheduled"
 hd_hev_184_06_name:0 "The Black Mountain Bandits"
 hd_hev_184_06_tt:0 "#high The Black Mountain Bandits#!\nMonthly from 185.2 to 188.12\nThe Yellow Turbans have risen and Changshan or Zhao has a governor\nZhang Yan and the Black Mountain rise\nPop-up only for a player defender"
 hd_hev_184_07_name:0 "The Jiangxia Man Revolt"
 hd_hev_184_07_tt:0 "#high The Jiangxia Man Revolt#!\nMonthly from 185.4 to 187.12\nThe Yellow Turbans have risen and Jiangxia has a governor\nThe Man of Jiangxia rise\nPop-up only for a player defender"
 hd_hev_184_08_name:0 "Wang Guo Rises"
 hd_hev_184_08_tt:0 "#high Wang Guo Rises#!\nMonthly from 187.4 to 189.12\nThe Yellow Turbans have risen and Fufeng has a governor\nWang Guo rises and may join the Liang revolt\nPop-up only for a player defender"
 hd_hev_184_09_name:0 "Zhang Ju Claims the Throne (Zhang Chun Revolt)"
 hd_hev_184_09_tt:0 "#high Zhang Ju Claims the Throne (Zhang Chun Revolt)#!\nMonthly from 187.6 to 189.12\nThe Yellow Turbans have risen and Youbeiping, Liaoxi or Yuyang has a governor\nZhang Ju and Zhang Chun rise in You\nPop-up only for a player defender"
 hd_hev_184_10_name:0 "Pacifying Jing (Liu Biao Rides Alone)"
 hd_hev_184_10_tt:0 "#high Pacifying Jing (Liu Biao Rides Alone)#!\nAround 188.1.1 (historically 190)\nLiu Biao lives and Jing has a holder\nLiu Biao takes over Jing with its de jure land and vassals\nLiu Biao gets the event"
 hd_hev_184_11_name:0 "The Xiuchuge Revolt (Bing)"
 hd_hev_184_11_tt:0 "#high The Xiuchuge Revolt (Bing)#!\nMonthly from 188.3 to 190.12\nThe Yellow Turbans have risen and Xihe or Hexi has a governor\nThe Xiuchuge Hu rise in Bing\nPop-up only for a player defender"
 hd_hev_184_12_name:0 "The Yellow Turbans of Yi (Ma Xiang)"
 hd_hev_184_12_tt:0 "#high The Yellow Turbans of Yi (Ma Xiang)#!\nMonthly from 188.6 to 190.12\nThe Yellow Turbans have risen and Guanghan, Shu or Qianwei has a governor\nMa Xiang rises in Yi\nPop-up only for a player defender"
 hd_hev_184_13_name:0 "Emperor Ling Dies"
 hd_hev_184_13_tt:0 "#high Emperor Ling Dies#!\nForced death by 189.5.13 at the latest, possibly earlier\nHis titles and vassals pass to Liu Bian first\nAll players are notified\nThe palace crisis is then attempted"
 hd_hev_184_14_name:0 "Rumours in the Capital"
 hd_hev_184_14_tt:0 "#high Rumours in the Capital#!\nAfter a Han-survives outcome or Emperor Ling's death\nWith Dong Zhuo in control, 35 days later\nHe Jin summons outside troops and Dong Zhuo answers\nSent to Dong Zhuo and He Jin"
 hd_hev_184_15_name:0 "The Palace Gates Close (He Jin Killed)"
 hd_hev_184_15_tt:0 "#high The Palace Gates Close (He Jin Killed)#!\nAbout 35 days after Dong Zhuo is summoned\nZhang Rang (or Zhao Zhong) kills He Jin in the palace\nHe Jin gets the event\n35 days later the eunuchs are purged"
 hd_hev_184_16_name:0 "Blood at the Palace Gates (Eunuchs Purged)"
 hd_hev_184_16_tt:0 "#high Blood at the Palace Gates (Eunuchs Purged)#!\nAbout 35 days after He Jin dies\nYuan Shao (else Cao Cao, else Dong Zhuo) kills the Ten Attendants\nThe executor is notified\n35 days later Dong Zhuo enters Luoyang"
 hd_hev_184_17_name:0 "The Liang Army Enters Luoyang"
 hd_hev_184_17_tt:0 "#high The Liang Army Enters Luoyang#!\nAbout 35 days after the purge\nDong Zhuo moves to Luoyang and takes Sili and its vassals\nHe becomes the permanent regent (chancellor)\nAll players are notified"
 hd_hev_184_18_name:0 "Lü Bu Kills Ding Yuan"
 hd_hev_184_18_tt:0 "#high Lü Bu Kills Ding Yuan#!\nAbout 30 days after the deposition (historically before it, 189.8)\nDing Yuan gets an event as Lü Bu is bought\nLü Bu kills Ding Yuan and Bing passes to Dong Zhuo\nLü Bu takes Dong Zhuo as his adoptive father"
 hd_hev_184_19_name:0 "The Deposition (Liu Xie Enthroned)"
 hd_hev_184_19_tt:0 "#high The Deposition (Liu Xie Enthroned)#!\n365 days after Dong Zhuo enters Luoyang\nLiu Bian's titles and hegemony pass to Liu Xie\nDong Zhuo remains regent\n5 days later Liu Bian and Empress He are killed; all players are notified"
 hd_hev_184_20_name:0 "Yuan Shao Flees to Bohai"
 hd_hev_184_20_tt:0 "#high Yuan Shao Flees to Bohai#!\nAbout 35 days after the deposition\nYuan Shao lives and his early story is not done\nHe breaks with Dong Zhuo and flees to Bohai\nYuan Shao gets the event"
 hd_hev_184_21_name:0 "The Coalition Against Dong Zhuo"
 hd_hev_184_21_tt:0 "#high The Coalition Against Dong Zhuo#!\nAfter the deposition, raised by Yuan Shao and others\nInvitations go out when the coalition forms\nThe coalition declares war and all players are notified\nThe burning of Luoyang is scheduled the same day"
 hd_hev_184_22_name:0 "Luoyang Burns, the Court Moves West"
 hd_hev_184_22_tt:0 "#high Luoyang Burns, the Court Moves West#!\n1 day after the coalition forms\nDong Zhuo burns Luoyang and slaughters its families\nThe emperor and Dong Zhuo's core move to Chang'an\nAll players are notified"
 hd_hev_184_23_name:0 "The Coalition Disbands"
 hd_hev_184_23_tt:0 "#high The Coalition Disbands#!\nThe coalition ends with victory, failure or Dong Zhuo's death\nVassals of the emperor break away in proportion\nPlayer vassals choose whether to stay\nRechecked on day 3, then exclaves are handled"
 hd_hev_184_24_name:0 "The Warlords Rise"
 hd_hev_184_24_tt:0 "#high The Warlords Rise#!\n1 day after the coalition disbands and exclaves are handled\nAbout 40 leaders such as Zhang Yang, Yuan Shao, Cao Cao and Liu Biao rise in their historical lands\nPlayer leaders and player lieges decide for themselves\n(Counts as soon as it fires)"
 hd_hev_184_25_name:0 "Cao Cao Takes the Qingzhou Army"
 hd_hev_184_25_tt:0 "#high Cao Cao Takes the Qingzhou Army#!\nAbout a year after the coalition ends, not before 191\nCao Cao is alive and landed\nHe gains 22,000 Qingzhou troops and 20 years of military colonies\nCao Cao gets the event"
 hd_hev_184_26_name:0 "Wang Yun Kills Dong Zhuo"
 hd_hev_184_26_tt:0 "#high Wang Yun Kills Dong Zhuo#!\nFrom 192.5.1: Dong Zhuo is regent and Wang Yun is free\nA player Dong Zhuo may delay a year; a player Wang Yun or Lü Bu decides\nLü Bu kills Dong Zhuo if present, otherwise Wang Yun\nLü Bu gains Jingzhao, Wang Yun runs the Secretariat, Diaochan goes to Lü Bu"
 hd_hev_184_27_name:0 "The Liang Army Strikes Back at Chang'an"
 hd_hev_184_27_tt:0 "#high The Liang Army Strikes Back at Chang'an#!\nAfter Dong Zhuo's death is settled, Li Jue gains Hongnong and independence\nThe next day Li Jue attacks the holder of Jingzhao (Lü Bu)\nGuo Si joins Li Jue\nAll players are notified"
 hd_hev_184_28_name:0 "Defeat at Chang'an (Lü Bu Flees)"
 hd_hev_184_28_tt:0 "#high Defeat at Chang'an (Lü Bu Flees)#!\nLi Jue wins the war for Chang'an\nWang Yun and his kin die and Li Jue takes Jingzhao\nLü Bu loses his land and becomes a wandering camp with troops\nZhang Liao and Gao Shun follow; Chen Gong joins the next day"
 hd_hev_184_29_name:0 "Fleeing East to Yan"
 hd_hev_184_29_tt:0 "#high Fleeing East to Yan#!\nLü Bu's camp is ready\nThe camp moves to Chenliu with claims on Yan and Chenliu\n30 days later he attacks the holder of Chenliu\nLü Bu gets the event"
 hd_hev_184_30_name:0 "Yan Baihu Gathers"
 hd_hev_184_30_tt:0 "#high Yan Baihu Gathers#!\nMonthly from 196.1 to 199.12\nThe Yellow Turbans have risen and Wu has a governor\nYan Baihu rises in Wu\nPop-up only for a player defender"
 hd_hev_184_31_name:0 "Red Cliffs"
 hd_hev_184_31_tt:0 "#high Red Cliffs#!\nAfter Guandu, with Cao Cao, Sun Quan and Liu Bei alive\nThe holder of Jing submits to Cao or resists\nCao Cao decides whether to attack Sun Quan\nNorthern defeat: retreat; Sun defeat: the river defences break"
 hd_hev_184_32_name:0 "Liu Bei Joins the War on the Yellow Turbans"
 hd_hev_184_32_tt:0 "#high Liu Bei Joins the War on the Yellow Turbans#!\nDuring the 184 rebellion while Han fights the rebels\nLiu Bei (184 start, adult, landed or camp, free) gets it\nIf he agrees he joins the defence"
 hd_hev_184_33_name:0 "Cao Cao Plots Against Dong Zhuo"
 hd_hev_184_33_tt:0 "#high Cao Cao Plots Against Dong Zhuo#!\nAbout 35 days after the deposition\nFires if Cao Cao lives, for players and AI\nWu Fu fails to kill Dong Zhuo and Cao Cao begins to plot"
 hd_hev_184_34_name:0 "The Offered Sword"
 hd_hev_184_34_tt:0 "#high The Offered Sword#!\nAbout a month later\nCao Cao gets the Seven Star sword from Wang Yun and fails to kill Dong Zhuo\nThey become rivals"
 hd_hev_184_35_name:0 "Blood on the Road (Lü Boshe)"
 hd_hev_184_35_tt:0 "#high Blood on the Road (Lü Boshe)#!\nAfter the failed attempt, fleeing back to Dong (once settled at Dongwuyang)\nCao Cao kills Lü Boshe's household; Chen Gong leaves if present\nCao Cao becomes Callous"
 hd_hev_184_36_name:0 "Liu Bei Answers the Coalition"
 hd_hev_184_36_tt:0 "#high Liu Bei Answers the Coalition#!\nAfter the coalition forms\nLiu Bei joins the attack if he agrees\nNot after the coalition disbands"
 hd_hev_184_37_name:0 "Cao Cao Gathers His Men at Dong"
 hd_hev_184_37_tt:0 "#high Cao Cao Gathers His Men at Dong#!\nDays after the Lü Boshe event, if Cao Cao is landed\nHe becomes a conqueror and gains 6,000 gold and 4,000 Danyang troops\nXiahou and Cao kinsmen join"
 hd_hev_184_38_name:0 "Yuan Shao Settles in Bohai"
 hd_hev_184_38_tt:0 "#high Yuan Shao Settles in Bohai#!\nYuan Shao flees to Bohai during the coalition, sits at Qingchi and claims Ji\nOnce settled he gains 3,000 gold and 5,000 armoured men\nShen Pei, Tian Feng, Ju Shou, Yan Liang, Wen Chou and others join"
 hd_hev_184_39_name:0 "Yuan Shu Flees to Nanyang"
 hd_hev_184_39_tt:0 "#high Yuan Shu Flees to Nanyang#!\nAfter Dong Zhuo enters Luoyang\nFires if Yuan Shu is alive and free\nHis estate moves to Wan in Nanyang"
 hd_hev_184_40_name:0 "Yuan Shu Takes Nanyang, Sun Jian Follows"
 hd_hev_184_40_tt:0 "#high Yuan Shu Takes Nanyang, Sun Jian Follows#!\nYuan Shu is at Wan and Sun Jian is alive and free\nSun Jian kills the governor of Nanyang and the commandery goes to Yuan Shu\nSun Jian gives up his land and moves to Wan as Yuan Shu's vassal"
 hd_hev_184_41_name:0 "The Nanyang Yellow Turbans Surrender"
 hd_hev_184_41_tt:0 "#high The Nanyang Yellow Turbans Surrender#!\n30 days after Yuan Shu takes Nanyang\nHe gains about 36,000 surrendered Yellow Turbans\nNanyang figures are then recruited in two waves"
 hd_hev_184_42_name:0 "Sun Jian Finds the Imperial Seal"
 hd_hev_184_42_tt:0 "#high Sun Jian Finds the Imperial Seal#!\nAfter the coalition disbands\nSun Jian is alive and actually fought in the war\nHe takes the Imperial Seal"
 hd_hev_184_43_name:0 "Gongsun Zan Attacks Ji"
 hd_hev_184_43_tt:0 "#high Gongsun Zan Attacks Ji#!\nAfter the Dong Zhuo chain ends with Han Fu still in Ji\nGongsun Zan (holding You) is invited and attacks Han Fu if he agrees\nYuan Shao is notified"
 hd_hev_184_44_name:0 "Ji Changes Hands (Han Fu Yields)"
 hd_hev_184_44_tt:0 "#high Ji Changes Hands (Han Fu Yields)#!\nAbout 30 days after Gongsun Zan attacks\nWith both alive, Han Fu yields all of Ji to Yuan Shao\nYuan Shao and Gongsun Zan become rivals"
 hd_hev_184_45_name:0 "A Letter from Bogui (Liu Bei Joins Gongsun Zan)"
 hd_hev_184_45_tt:0 "#high A Letter from Bogui (Liu Bei Joins Gongsun Zan)#!\nAbout 30 days after the warlord era begins\nGongsun Zan decides to write, then Liu Bei decides\nOn alliance Liu Bei's camp moves to Gongsun Zan's capital"
 hd_hev_184_46_name:0 "Meeting Zilong"
 hd_hev_184_46_tt:0 "#high Meeting Zilong#!\nLiu Bei is allied with and camped in Gongsun Zan's land\nZhao Yun is at Gongsun Zan's court\nLiu Bei and Zhao Yun become friends"
 hd_hev_184_47_name:0 "An Old Friend Knocks (Zhao Yun Joins)"
 hd_hev_184_47_tt:0 "#high An Old Friend Knocks (Zhao Yun Joins)#!\nLiu Bei and Zhao Yun are friends\nZhao Yun is landless and leaves Gongsun Zan\nHe joins Liu Bei's court"
 hd_hev_184_48_name:0 "Tao Qian Holds Xu"
 hd_hev_184_48_tt:0 "#high Tao Qian Holds Xu#!\nAfter the Dong Zhuo chain\nIf Tao Qian lives he takes the Xu kingdom and its seat and becomes independent\nHe gains 3,000 Danyang troops"
 hd_hev_184_49_name:0 "Zang Ba Submits"
 hd_hev_184_49_tt:0 "#high Zang Ba Submits#!\nTao Qian holds Xu and the warlord era has begun\nZang Ba, if a minor independent lord, submits to Tao Qian\nTao Qian is notified"
 hd_hev_184_50_name:0 "Death at Mount Xian (Sun Jian)"
 hd_hev_184_50_tt:0 "#high Death at Mount Xian (Sun Jian)#!\nRandomly between 191.1 and 192.12 after the coalition disbands\nSun Jian has not broken away and Liu Biao is alive and free\nSun Jian attacks Liu Biao and dies in Huang Zu's ambush"
 hd_hev_184_51_name:0 "Yuan Shu Breaks Away"
 hd_hev_184_51_tt:0 "#high Yuan Shu Breaks Away#!\nYuan Shu holds Nanyang and the coalition has disbanded\nHe becomes independent\nHe gains claims on Yu and Yang and starts expanding into Yu"
 hd_hev_184_52_name:0 "Gongsun Zan Falls"
 hd_hev_184_52_tt:0 "#high Gongsun Zan Falls#!\nGongsun Zan loses his war for Ji\nHe kills himself and his vassals break away\nYuan Shao is notified"
 hd_hev_184_53_name:0 "Xu Is Secured (Tao Qian)"
 hd_hev_184_53_tt:0 "#high Xu Is Secured (Tao Qian)#!\nAfter Tao Qian takes Xu (the AI annexes automatically)\nAll de jure duchies of Xu belong to his camp\nTao Qian turns to defence"
 hd_hev_184_54_name:0 "Jing Is Secured (Liu Biao)"
 hd_hev_184_54_tt:0 "#high Jing Is Secured (Liu Biao)#!\nLiu Biao annexes Jing step by step\nAll de jure duchies of Jing belong to him or his vassals\nLiu Biao gains a defensive modifier"
 hd_hev_184_55_name:0 "Tao Qian Invites Liu Bei to Xu"
 hd_hev_184_55_tt:0 "#high Tao Qian Invites Liu Bei to Xu#!\nCao Cao controls Yan plus Yu or Qing and threatens Xu\nTao Qian prepares and invites Liu Bei, who accepts\nThey ally and Liu Bei's camp moves into Xu"
 hd_hev_184_56_name:0 "The Mi Family Joins Liu Bei"
 hd_hev_184_56_tt:0 "#high The Mi Family Joins Liu Bei#!\nLiu Bei's camp or land is in Xu\nMi Zhu lives\nMi Zhu and Mi Fang join; option a also brings Lady Mi as his wife"
 hd_hev_184_57_name:0 "Tao Qian Entrusts Xu"
 hd_hev_184_57_tt:0 "#high Tao Qian Entrusts Xu#!\nAfter 194, Tao Qian is gravely ill (health 2 or less) and Liu Bei is still an adventurer\nTao Qian entrusts and Liu Bei accepts; both AI resolve at once\nLiu Bei takes all of Xu and Tao Qian dies"
 hd_hev_184_58_name:0 "Sun Ce Inherits"
 hd_hev_184_58_tt:0 "#high Sun Ce Inherits#!\n2 days after Sun Jian dies\nIf Sun Ce lives he inherits Sun Jian's titles, land and seal\nSun Ce is notified"
 hd_hev_184_59_name:0 "Sun Ce Leaves Yuan Shu and Crosses the River"
 hd_hev_184_59_tt:0 "#high Sun Ce Leaves Yuan Shu and Crosses the River#!\nSun Ce has inherited, is adult and free; Sun Jian is dead\nHe trades the seal for troops, leaves his estate and camps at Liyang as an adventurer\nHe gains a claim on Yang and troops"
 hd_hev_184_60_name:0 "Zhou Yu Joins"
 hd_hev_184_60_tt:0 "#high Zhou Yu Joins#!\nSun Ce has crossed and is independent\nZhou Yu is alive and free\nZhou Yu gives up his land and joins; Sun Ce gains 2,000 troops"
 hd_hev_184_61_name:0 "Pacifying Danyang and Jiangdong"
 hd_hev_184_61_tt:0 "#high Pacifying Danyang and Jiangdong#!\nSun Ce campaigns in Danyang after crossing\nAll counties of Danyang belong to him or his vassals\nHe then turns to Yang"
 hd_hev_184_62_name:0 "The Little Conqueror"
 hd_hev_184_62_tt:0 "#high The Little Conqueror#!\nSun Ce first gains a kingdom or higher title\nHe gains the nickname, prestige, dread and 3,000 troops\nOnce per lifetime"
 hd_hev_184_63_name:0 "Lü Bu Seeks Refuge"
 hd_hev_184_63_tt:0 "#high Lü Bu Seeks Refuge#!\nAfter 195, Liu Bei holds Xu\nLü Bu is a landless adventurer not at war with Liu Bei\nLü Bu asks and Liu Bei takes him in at Xiaopei"
 hd_hev_184_64_name:0 "Receiving the Emperor"
 hd_hev_184_64_tt:0 "#high Receiving the Emperor#!\nAfter 196, Cao Cao has over 10,000 troops and enough land and Liu Xie still reigns\nCao Cao may attack whoever holds the emperor\nOn victory he receives the emperor and takes over the court"
 hd_hev_184_65_name:0 "Xiapi Falls (Lü Bu Seizes Xu)"
 hd_hev_184_65_tt:0 "#high Xiapi Falls (Lü Bu Seizes Xu)#!\nLü Bu has stayed a year (needs the adventurer DLC)\nLü Bu decides and Liu Bei responds\nLü Bu takes all of Xu and Liu Bei is an adventurer at Xiaopei again"
 hd_hev_184_66_name:0 "Liu Bei Goes South to Liu Biao"
 hd_hev_184_66_tt:0 "#high Liu Bei Goes South to Liu Biao#!\nLiu Bei wanders after losing Xu and Liu Biao holds Jing\nLiu Bei asks and Liu Biao accepts\nLiu Bei takes Xinye commandery (or another Jing commandery) as an independent tributary and ally of Liu Biao, with a 20-year truce; if none can be given, he camps at Liu Biao's capital as an ally"
 hd_hev_184_67_name:0 "Sun Jian Breaks Away (Fallback)"
 hd_hev_184_67_tt:0 "#high Sun Jian Breaks Away (Fallback)#!\nNon-historical fallback: Sun Jian lives to 200 without breaking away\nHe leaves his liege, sets up camp and gains a claim on Yang and 5,000 troops\nIf he holds the seal Yuan Shu and Liu Biao plot his death"
 hd_hev_184_68_name:0 "The Battle of Guandu"
 hd_hev_184_68_tt:0 "#high The Battle of Guandu#!\nCao and Yuan border each other with over 120 counties each, or it is 200\nCao Cao is invited to attack Yuan Shao\nThe battle begins (outcome in the next row)"
 hd_hev_184_69_name:0 "Victory at Guandu, Yuan Shao Despairs"
 hd_hev_184_69_tt:0 "#high Victory at Guandu, Yuan Shao Despairs#!\nCao Cao wins at Guandu\nHe takes the target duchy and claims on Yuan Shao's titles\nYuan Shao is badly wounded and despairs"
 hd_hev_184_70_name:0 "The Yuan Family Divides"
 hd_hev_184_70_tt:0 "#high The Yuan Family Divides#!\nYuan Shao dies after the defeat (with the split flag set)\nHis land is split between his adult sons\nThe sons are notified"
 hd_hev_184_71_name:0 "Sun Quan Succeeds His Brother"
 hd_hev_184_71_tt:0 "#high Sun Quan Succeeds His Brother#!\n2 days after Sun Ce dies (having inherited from Sun Jian)\nIf Sun Quan lives he takes Sun Ce's titles, claim and troops\nSun Quan is notified"
 hd_hev_184_72_name:0 "Three Visits to the Cottage (Longzhong Plan)"
 hd_hev_184_72_tt:0 "#high Three Visits to the Cottage (Longzhong Plan)#!\nAfter 201.7, Liu Bei has served Liu Biao for a year\nLiu Bei visits and a player Zhuge Liang may refuse\nZhuge Liang joins Liu Bei as a close friend"
 hd_hev_184_73_name:0 "An Envoy from Yi (Into Shu)"
 hd_hev_184_73_tt:0 "#high An Envoy from Yi (Into Shu)#!\nAfter 211, with the Longzhong plan done or skipped and Red Cliffs not underway\nLiu Bei breaks away if needed\nHe attacks the lord of Chengdu with reinforcements"
 hd_hev_184_74_name:0 "Before Chengdu (Liu Zhang Surrenders)"
 hd_hev_184_74_tt:0 "#high Before Chengdu (Liu Zhang Surrenders)#!\nThe Shu war ends with Chengdu held by Liu Bei or his vassal\nThe lord of Yi (a player may refuse) surrenders his land and joins Liu Bei\nLiu Bei moves his capital to Chengdu"
 # 汉代风味内容（2026-10-25）手工加行；生成器 build_data.py 未同步，勿直接重跑
 hd_hev_184_75_name:0 "Debasing the Wuzhu"
 hd_hev_184_75_tt:0 "#high Debasing the Wuzhu#!\nAfter the palace crisis, until 191.12.31\nDong Zhuo lives\nWorld notice; counties of Jingzhao, Fufeng and Pingyi suffer inflation for five years"
 hd_hev_184_76_name:0 "A Thousand Li of Grass (Ditty)"
 hd_hev_184_76_tt:0 "#high A Thousand Li of Grass (Ditty)#!\n190.9.1 – 191.5.20\nDong Zhuo is alive and regent\nWorld notice of the children's ditty"
 hd_hev_184_77_name:0 "The Death of Cai Yong"
 hd_hev_184_77_tt:0 "#high The Death of Cai Yong#!\nAfter Wang Yun kills Dong Zhuo, until 200.1.1\nCai Yong is alive and free and Wang Yun lives\nIf Cai Yong sighs he is jailed and dies 30 days later; a player may plead to finish the history"
 hd_hev_184_78_name:0 "Treatise on Cold Damage"
 hd_hev_184_78_tt:0 "#high Treatise on Cold Damage#!\n205.1.1 – 215.1.1\nZhang Ji (created at the 190 start) lives\nZhang Ji gains the Treatise artifact"
 hd_hev_long_01_name:0 "The Southern Xiongnu Settle in Bing"
 hd_hev_long_01_tt:0 "#high The Southern Xiongnu Settle in Bing#!\n188 – 226 (any year with random rules); historical or random rules only\nThe Xiuchuge revolt is settled or expired\nA yearly chance, certain from 216\nA Hu chief asks the lord of Pingyang or Taiyuan (or Xihe) for land"
 hd_hev_long_02_name:0 "The Wuhuan Move Inside"
 hd_hev_long_02_tt:0 "#high The Wuhuan Move Inside#!\n200 – 240; historical or random rules only\nA yearly chance, certain from 230\nQiuliju or Tadun (or a generated chief) asks the weakest neighbouring lord in You for land"
 hd_hev_long_03_name:0 "The Wudu Di Move to Guanzhong"
 hd_hev_long_03_tt:0 "#high The Wudu Di Move to Guanzhong#!\n200 – 250; historical or random rules only\nA yearly chance, certain from 240\nA Di chief asks the weaker lord of Fufeng or Tianshui for land"
 hd_hev_long_04_name:0 "Li Te Rises (Cheng)"
 hd_hev_long_04_tt:0 "#high Li Te Rises (Cheng)#!\nFrom 296, in a disorder, chaos or standoff phase\nLi Te (or Li Xiong) is adult, free and at peace\nThe AI rolls yearly; players may use the uprising decision\nThe rising takes Yi as Cheng"
 hd_hev_long_05_name:0 "Liu Yuan Rises (Han)"
 hd_hev_long_05_tt:0 "#high Liu Yuan Rises (Han)#!\nFrom 299, in a disorder phase\nLiu Yuan is adult and at peace\nThe AI rolls yearly; players may use the decision\nThe rising takes Bing as Han"
 hd_hev_long_06_name:0 "Shi Le Rises (Zhao)"
 hd_hev_long_06_tt:0 "#high Shi Le Rises (Zhao)#!\nFrom 305, in a disorder phase\nShi Le is adult and at peace\nThe AI rolls yearly; players may use the decision\nThe rising takes Ji as Zhao"
 hd_hev_long_07_name:0 "The Southern Migration Begins"
 hd_hev_long_07_tt:0 "#high The Southern Migration Begins#!\nThe Southern Migration rule is on\nThe north has two or more Hu powers (or one empire)\nAt least 50 northern counties have fallen\nChecked monthly (opened directly when Luoyang falls on the 304 line); announced worldwide"
 hd_hev_long_08_name:0 "The Liao Enter Shu"
 hd_hev_long_08_tt:0 "#high The Liao Enter Shu#!\nFrom 280 (any year with random rules), in a disorder phase\nAI: 10% yearly for a Liao chief near Ning or Ba (generated if needed) to attack Shu\nPlayer Liao rulers may use the major decision\nThe target is Yi"
 hd_hev_long_09_name:0 "Fu Hong Rises (Qin)"
 hd_hev_long_09_tt:0 "#high Fu Hong Rises (Qin)#!\nFrom 344, in a disorder phase\nFu Hong is adult and at peace\nThe AI rolls yearly; players may use the decision\nThe rising takes Sili as Qin"
 hd_hev_long_10_name:0 "Yao Yizhong Rises (Qin)"
 hd_hev_long_10_tt:0 "#high Yao Yizhong Rises (Qin)#!\nFrom 344, in a disorder phase\nYao Yizhong is adult and at peace\nThe AI rolls yearly; players may use the decision\nThe rising takes Sili based at Nan'an"
 hd_hev_long_11_name:0 "A Visitor from Afar (Qin Lun of Da Qin)"
 hd_hev_long_11_tt:0 "#high A Visitor from Afar (Qin Lun of Da Qin)#!\nAfter 226\nA ruler holding both the Yang kingdom and Changsha\nThe Roman Qin Lun visits and may join the court"
 hd_hev_218_01_name:0 "Men Fight, Women Haul (Hanzhong)"
 hd_hev_218_01_tt:0 "#high Men Fight, Women Haul (Hanzhong)#!\nOn the 218.1.1 start day Liu Bei attacks Xiahou Yuan for Hanzhong (border war)\nOn success Liu Bei gets another Hanzhong army and a levy bonus for 2 years\nCao and Liu get a 3-year truce; other players are notified on the first tick"
 hd_hev_218_02_name:0 "The Geng Ji Incident"
 hd_hev_218_02_tt:0 "#high The Geng Ji Incident#!\nBefore 218.3.1\nCao Cao is regent; Geng Ji (free) and Wang Bi live\nSent to Cao Cao: Wang Bi dies; the AI executes Geng Ji's faction, a player may imprison them"
 hd_hev_218_03_name:0 "Cao Zhang's Northern Campaign"
 hd_hev_218_03_tt:0 "#high Cao Zhang's Northern Campaign#!\nFrom 218.4.1 with Cao Cao and Cao Zhang alive\nNengchendi rebels with Dai if he holds it as Cao Cao's vassal\nSent to Cao Cao: the AI sends Cao Zhang, a player may pacify\nOn victory the north is declared settled"
 hd_hev_218_04_name:0 "Hou Yin Seizes Wan"
 hd_hev_218_04_tt:0 "#high Hou Yin Seizes Wan#!\nFrom 218.10.1 with Cao Cao landed\nHou Yin rebels if he holds Wan as Cao Cao's vassal\nSent to Cao Cao: the AI sends Cao Ren, a player may pacify"
 hd_hev_218_05_name:0 "Mount Dingjun"
 hd_hev_218_05_tt:0 "#high Mount Dingjun#!\nFrom 219.1.1 while the Hanzhong war goes on\nHuang Zhong and an AI Xiahou Yuan live\nSent to Liu Bei: Huang Zhong kills Xiahou Yuan; Shu morale up, Wei shaken for a year"
 hd_hev_218_06_name:0 "Hanzhong Changes Hands"
 hd_hev_218_06_tt:0 "#high Hanzhong Changes Hands#!\nLiu Bei wins the Hanzhong war (a white peace or invalidation counts; a player King of Wei is asked first)\nHanzhong, Shangyong, Fangling and Weixing go to the ruler of Shu\nAnnounced"
 hd_hev_218_07_name:0 "Guarding Hanzhong"
 hd_hev_218_07_tt:0 "#high Guarding Hanzhong#!\n3 days after Hanzhong changes hands\nWei Yan is alive, free and serves the ruler of Shu\nHanzhong is granted to Wei Yan as a direct vassal"
 hd_hev_218_08_name:0 "The Battle of Xiangfan"
 hd_hev_218_08_tt:0 "#high The Battle of Xiangfan#!\n4 months after Liu Bei takes Hanzhong\nGuan Yu holds Jing and Xiangyang is held by an enemy\nThe AI marches on Xiangyang (and Nanyang), a player may hold Jiangling; announced\nGuan Yu is lightly wounded in his first battle (leading to the bone scraping)"
 hd_hev_218_09_name:0 "Flooding the Seven Armies"
 hd_hev_218_09_tt:0 "#high Flooding the Seven Armies#!\nDuring Xiangfan, months 7 to 10\nGuan Yu, Yu Jin and Pang De live, the latter two with the defenders\nYu Jin is captured and Guan Yu's fame spreads for 3 years; the AI kills Pang De, a player may jail him"
 hd_hev_218_10_name:0 "Scraping the Bone"
 hd_hev_218_10_tt:0 "#high Scraping the Bone#!\nOnce, no date limit\nGuan Yu is alive, free and wounded; checked 7 days after his first Xiangfan battle\nIf Hua Tuo is dead or jailed a wandering Hua Tuo is created\nGuan Yu heals and gains prestige, influence and a 2-year modifier"
 hd_hev_218_11_name:0 "Cao Cao's Headaches"
 hd_hev_218_11_tt:0 "#high Cao Cao's Headaches#!\nFrom 219.9.1 while Cao Cao lives (5-year modifier)\nWorse after Guan Yu's death or on 220.3.1\nAn AI Cao Cao dies on 221.1.1 unless the surgery worked\nOnly a player Cao Cao sees the events"
 hd_hev_218_12_name:0 "Crossing in White (Sun Quan)"
 hd_hev_218_12_tt:0 "#high Crossing in White (Sun Quan)#!\nXiangfan has lasted 3 months\nGuan Yu and Lü Meng live and Sun Quan is independent\nSent to Sun Quan: the AI attacks Jing (Mi Fang and Shi Ren defect below 10 opinion), a player may wait\nAnnounced only if the war starts"
 hd_hev_218_13_name:0 "Grand Commander Lü Meng"
 hd_hev_218_13_tt:0 "#high Grand Commander Lü Meng#!\nFrom 219.10.1 before the crossing\nPath one: Liu Bei lost Hanzhong; path two: he holds it but Xiangfan is over or not fought by 220.6\nGuan Yu holds Jing, Lü Meng lives, Sun Quan is independent\nThe AI attacks; a player may keep the alliance (asked again a year later)"
 hd_hev_218_14_name:0 "Retreat to Maicheng (Guan Yu's Death)"
 hd_hev_218_14_tt:0 "#high Retreat to Maicheng (Guan Yu's Death)#!\nSun Quan wins the crossing war or captures Guan Yu\nGuan Yu and Sun Quan live\nThe AI executes Guan Yu (announced), a player may spare him"
 hd_hev_218_15_name:0 "Mourning Guan Yu"
 hd_hev_218_15_tt:0 "#high Mourning Guan Yu#!\nGuan Yu dies while Cao Cao lives\n10 days later Cao Cao buries him as a lord and gains prestige\nHis headaches worsen unless the surgery worked"
 hd_hev_218_16_name:0 "The Proposed Surgery"
 hd_hev_218_16_tt:0 "#high The Proposed Surgery#!\nCao Cao's headaches have worsened and he lives\nHua Tuo is alive and free\nThe AI executes Hua Tuo; a player may operate (5% cure, 95% death) or send him away"
 hd_hev_218_17_name:0 "The New King of Wei"
 hd_hev_218_17_tt:0 "#high The New King of Wei#!\n3 days after Cao Cao dies (any cause)\nCao Pi lives\nCao Cao's titles and vassals pass to Cao Pi as King of Wei and regent; announced"
 hd_hev_218_18_name:0 "Cao Pi Accepts the Abdication"
 hd_hev_218_18_tt:0 "#high Cao Pi Accepts the Abdication#!\n240 days after the succession\nCao Pi is alive, regent and at peace\nAIs complete it; a player Cao Pi may wait and a player Emperor Xian may refuse (twice, then he is deposed)\nCao Pi gains the seal and renames the realm Wei; announced"
 hd_hev_218_19_name:0 "Liu Bei Becomes Emperor"
 hd_hev_218_19_tt:0 "#high Liu Bei Becomes Emperor#!\nThe emperor is no longer of Emperor Xian's line\nLiu Bei is alive, independent and King of Hanzhong\nThe AI holds an enthronement and renames the realm Han (or simply becomes emperor after two years); a player may wait a year"
 hd_hev_218_20_name:0 "Zhang Fei Is Murdered"
 hd_hev_218_20_tt:0 "#high Zhang Fei Is Murdered#!\nFrom 221.6.1 after Liu Bei decides to become emperor\nZhang Fei is AI and Zhang Da lives\nZhang Da kills Zhang Fei and flees to Wu; announced"
 hd_hev_218_21_name:0 "The Battle of Yiling"
 hd_hev_218_21_tt:0 "#high The Battle of Yiling#!\nFrom 221.7.1; Guan Yu died at Wu's hands and Liu Bei rules Shu as emperor-elect\nSun Quan holds a commandery in Jing\nThe AI marches east on Nan; a player may heed advice (asked again a year later); announced"
 hd_hev_218_22_name:0 "Burning the Camps"
 hd_hev_218_22_tt:0 "#high Burning the Camps#!\nFrom 222.6.1 during Yiling\nLiu Bei is with the attackers and Lu Xun with the defenders\nShu is set back for a year, Lu Xun gains prestige; Feng Xi, Zhang Nan, Fu Rong and Cheng Ji die if present"
 hd_hev_218_23_name:0 "Entrusting the Heir at Baidi"
 hd_hev_218_23_tt:0 "#high Entrusting the Heir at Baidi#!\n3 days after Liu Bei dies\nThe new ruler is not Zhuge Liang, who is alive, free and in Yi\nZhuge Liang becomes chief minister with a 10-year regency modifier"
 hd_hev_218_24_name:0 "The Nanzhong Revolt"
 hd_hev_218_24_tt:0 "#high The Nanzhong Revolt#!\n2 months after Liu Bei dies\nAt least one of Yong Kai, Gao Ding and Zhu Bao is an AI Shu vassal\nThey break away and Meng Huo joins Yong Kai; announced"
 hd_hev_218_25_name:0 "The Chancellor Marches South"
 hd_hev_218_25_tt:0 "#high The Chancellor Marches South#!\nA year after the revolt with a rebel still independent\nZhuge Liang holds the regency\nThe AI opens a war on each rebel; a player may wait a year; announced"
 hd_hev_218_26_name:0 "Seven Captures of Meng Huo"
 hd_hev_218_26_tt:0 "#high Seven Captures of Meng Huo#!\nThe southern campaign was approved and no rebel is independent\nMeng Huo and the ruler of Shu live\nMeng Huo submits with +50 opinion of Zhuge Liang; announced"
 hd_hev_218_27_name:0 "The Memorial on the Expedition"
 hd_hev_218_27_tt:0 "#high The Memorial on the Expedition#!\n3 years after Liu Bei dies, with Zhuge Liang regent and the south pacified\nTianshui is held by a power independent of Shu\nThe AI marches north (Tianshui, Nan'an, Anding); a player may wait; announced"
 hd_hev_218_28_name:0 "Jiang Wei Submits"
 hd_hev_218_28_tt:0 "#high Jiang Wei Submits#!\nDuring the northern campaign\nJiang Wei is alive, landless, free and not at the Shu court\nHe joins the Shu court"
 hd_hev_218_29_name:0 "The Loss of Jieting"
 hd_hev_218_29_tt:0 "#high The Loss of Jieting#!\n2 months into the northern campaign while it continues\nMa Su is with the Shu army\nShu is set back for a year; the AI usually executes Ma Su but may only dismiss him; announced"
 hd_hev_218_30_name:0 "Sun Quan Becomes Emperor"
 hd_hev_218_30_tt:0 "#high Sun Quan Becomes Emperor#!\nThe emperor is not a Liu; 2 years after the Shu enthronement, or 229.5.23 if Shu never crowned one\nSun Quan is independent as King of Wu and Liu Bei's side has no enthronement pending\nThe AI holds an enthronement and renames the realm Wu; a player may wait"
 # 汉代风味内容（2026-10-25）手工加行；生成器 build_data.py 未同步，勿直接重跑
 hd_hev_218_31_name:0 "Debate on Mutilating Punishments"
 hd_hev_218_31_tt:0 "#high Debate on Mutilating Punishments#!\n218.6.1 – 219.12.31\nCao Cao lives\nCao Cao chooses: restore them (Chen Qun) or not (Wang Lang)"
 hd_hev_218_32_name:0 "Cao Pi's Final Instructions"
 hd_hev_218_32_tt:0 "#high Cao Pi's Final Instructions#!\nTwo years after the abdication, until 230.1.1\nCao Pi lives\nHe writes his instructions and frugal burial gains an extra line"
 hd_hev_253_01_name:0 "Jiang Wei Strikes at Taoxi"
 hd_hev_253_01_tt:0 "#high Jiang Wei Strikes at Taoxi#!\nOn the 253 start day (after the lobby)\nJiang Wei holds Liang, is at peace and Taoxi is held by a vassal under Cao Fang\nJiang Wei attacks Taoxi and the world is notified\nNot in the 218 or 263 starts"
 hd_hev_253_02_name:0 "Zhuge Ke Besieges Xincheng"
 hd_hev_253_02_tt:0 "#high Zhuge Ke Besieges Xincheng#!\nOn the 253 start day\nZhuge Ke and Guanqiu Jian are landed and Hefei belongs to Guanqiu Jian or his liege\nWu's Zhuge Ke attacks for Hefei with 20,000 extra troops\n253 start only"
 hd_hev_253_03_name:0 "Sun Jun's Banquet (Zhuge Ke Killed)"
 hd_hev_253_03_tt:0 "#high Sun Jun's Banquet (Zhuge Ke Killed)#!\nFrom 253.10.1 after the Xincheng war\nZhuge Ke is alive and at peace; Sun Jun is free\nAn AI Zhuge Ke attends and dies; a player may stay away\nThe 218 relay also needs Zhuge Ke as chief minister of an AI Wu emperor"
 hd_hev_253_04_name:0 "Sima Shi Deposes the Emperor"
 hd_hev_253_04_tt:0 "#high Sima Shi Deposes the Emperor#!\nFrom 254.10.1\nSima Shi is regent, Cao Fang reigns, Cao Mao is in Wei\nSent to Sima Shi (or to a player Cao Fang if Sima Shi is AI)\nCao Fang is deposed for Cao Mao after Xiahou Xuan is executed"
 hd_hev_253_05_name:0 "The Huainan Uprising (Guanqiu Jian, Wen Qin)"
 hd_hev_253_05_tt:0 "#high The Huainan Uprising (Guanqiu Jian, Wen Qin)#!\nFrom 255.2.1\nGuanqiu Jian is a landed vassal under the emperor and at peace\nAn AI rises in a war of independence with 15,000 extra; a player may wait\nThe 218 relay also needs Sima rule and a direct vassal"
 hd_hev_253_06_name:0 "Sima Shi Dies"
 hd_hev_253_06_tt:0 "#high Sima Shi Dies#!\nFrom 255.3.1 while an AI Sima Shi is regent and Sima Zhao is a landed vassal\nAfter the deposition and Huainan (or by 255.12.1); by 257.1.1 without a deposition\nSima Shi dies and the world is notified"
 hd_hev_253_07_name:0 "Sima Zhao Succeeds His Brother"
 hd_hev_253_07_tt:0 "#high Sima Zhao Succeeds His Brother#!\n3 days after Sima Shi dies as regent\nA player emperor or a player Sima Zhao decides; AIs proceed\nSima Zhao must be a landed vassal of the emperor"
 hd_hev_253_08_name:0 "Zhuge Dan Rises at Shouchun"
 hd_hev_253_08_tt:0 "#high Zhuge Dan Rises at Shouchun#!\nFrom 257.6.1\nZhuge Dan is a landed vassal under the emperor and at peace\nAn AI rises with 15,000 extra; an AI Wu emperor sends help, a player one is asked\nThe 218 relay also needs Sima rule and a direct vassal"
 hd_hev_253_09_name:0 "The South Gate Incident"
 hd_hev_253_09_tt:0 "#high The South Gate Incident#!\nFrom 260.6.1\nCao Mao reigns and Sima Zhao (or Sima Shi) is regent\nAn AI Cao Mao leads his guard out and is killed by Cheng Ji, Cao Huan is enthroned; a player may endure\nA player regent chooses to kill or depose"
 hd_hev_253_10_name:0 "Wei Invades Shu"
 hd_hev_253_10_tt:0 "#high Wei Invades Shu#!\n253 path: 263.9.1 – 268.1.1 with Sima Shi or Sima Zhao as regent and the Han emperor independent and at peace; a player emperor may refuse; up to 3 attempts\n263 path: attack at once after the start, one retry before 264.1.16\nThe Wei emperor attacks Han with Zhong Hui and Deng Ai"
 hd_hev_263_01_name:0 "Sima Zhao Becomes Duke of Jin"
 hd_hev_263_01_tt:0 "#high Sima Zhao Becomes Duke of Jin#!\nFrom 263.11.18\nSima Zhao is a landed regent and Cao Huan reigns\nA player Sima Zhao may decline and a player emperor may refuse\nA new Jin duchy (Bing) is created; a kingdom wraps it later and merges into the crown after the abdication"
 hd_hev_263_02_name:0 "Shu Han Surrenders"
 hd_hev_263_02_tt:0 "#high Shu Han Surrenders#!\nAbout 60 days into the Shu war with 50 warscore, or once Fu, Mianzhu, Luo or Chengdu falls, or after victory (fallbacks on 264.1.16, or 120 days in relays)\nAn AI Han emperor surrenders, a player may fight on\nJiang Wei submits to Zhong Hui and Yi goes to Deng Ai"
 hd_hev_263_03_name:0 "Deng Ai Is Arrested"
 hd_hev_263_03_tt:0 "#high Deng Ai Is Arrested#!\nAbout 30 days after the surrender\nDeng Ai holds Yi, Zhong Hui is landed and both serve the emperor\nPlayers Zhong Hui, Sima Zhao and Deng Ai are asked in turn; deadline 264.6.1 (150 days in relays)\nDeng Ai and Deng Zhong are imprisoned by Zhong Hui"
 hd_hev_263_04_name:0 "Zhong Hui's Revolt"
 hd_hev_263_04_tt:0 "#high Zhong Hui's Revolt#!\nAbout 30 days after Deng Ai's arrest\nZhong Hui holds Yi as a vassal at peace; deadline 264.9.1 (240 days in relays)\nAn AI Zhong Hui fails at once and dies with Jiang Wei\nA player Zhong Hui may truly rebel and a player Jiang Wei may try to restore Han"
 hd_hev_263_05_name:0 "Sima Zhao Becomes King of Jin"
 hd_hev_263_05_tt:0 "#high Sima Zhao Becomes King of Jin#!\nFrom 264.5.2 as Duke of Jin\nSima Zhao lives and still holds Jin\nA player may decline\nHis style becomes king and Wei starts the Xianxi era"
 hd_hev_263_06_name:0 "The King of Jin Dies (Sima Yan Succeeds)"
 hd_hev_263_06_tt:0 "#high The King of Jin Dies (Sima Yan Succeeds)#!\nAn AI Sima Zhao dies on 265.9.6 (relays wait for the Shu war, by 269.1.1); any other death also counts\n3 days later Sima Yan becomes King of Jin and regent\nA player emperor or a player Sima Yan is asked"
 hd_hev_263_07_name:0 "Wei Abdicates to Jin"
 hd_hev_263_07_tt:0 "#high Wei Abdicates to Jin#!\nFrom 266.2.8 (relays wait for the Shu war, by 269.6.1)\nCao Huan reigns and the regent is Sima Yan (or a living player Sima Zhao)\nA player recipient may decline and a player Cao Huan may refuse\nThe realm becomes Jin and the Taishi era begins"
 # 两晋十六国统一史实线（304–421）：F-1 手工维护（2026-10-27）；英文见 localization/english/zz_tr_hd_hev_l_english.yml，键一一对应
 # 西晋末·八王之乱与永嘉之乱（304–317；304 开局适用）
 hd_hev_j16_xiqian_name:0 "Zhang Fang Takes the Emperor West"
 hd_hev_j16_xiqian_tt:0 "#high Zhang Fang Takes the Emperor West#!\nWindow 304.11.25 – 305.3.1\nSima Yong is regent (or holds Jingzhao), Zhang Fang is at his court, the capital is still Luoyang\nAn AI Yong moves the court to Chang'an; a player Yong may keep it in Luoyang"
 hd_hev_j16_yingjia_name:0 "The Prince of Donghai Calls to Rescue the Emperor"
 hd_hev_j16_yingjia_tt:0 "#high The Prince of Donghai Calls to Rescue the Emperor#!\nWindow 305.7.1 – 306.6.1\nSima Yue is alive and independent (tributaries count) and not at war with the emperor; the capital is not Luoyang, or Yong is regent\nAn AI Yue raises troops (the emperor is the nominal defender; the winner only changes the regent, no land changes hands); a player Yue may wait\nLit when the war starts"
 hd_hev_j16_gongshi_name:0 "Gongshi Fan and Ji Sang Rise"
 hd_hev_j16_gongshi_tt:0 "#high Gongshi Fan and Ji Sang Rise#!\nWindow 305.8.1 – 306.12.1\nSima Ying has lost Ye or is landless; Shi Le, Gongshi Fan and Ji Sang are alive\nAn AI Shi Le joins Gongshi Fan; a player Shi Le may go his own way"
 hd_hev_j16_zongshe_name:0 "Yilu Unites the Three Tuoba Divisions"
 hd_hev_j16_zongshe_tt:0 "#high Yilu Unites the Three Tuoba Divisions#!\nWindow 305.8.1 – 308.12.31\nYituo and Luguan are gone; Yilu is alive and free\nEach tick, at most one of the three Tuoba commanderies held by another AI Tuoba passes to Yilu"
 hd_hev_j16_xuchang_name:0 "The Battle of Xuchang"
 hd_hev_j16_xuchang_tt:0 "#high The Battle of Xuchang#!\nWindow 305.10.1 – 306.3.1\nLiu Qiao and Sima Xiao are alive, Xiao holds Yingchuan, the rescue war has begun\nAn AI Liu Qiao sides with Yong and attacks Xiao; a player Liu Qiao may stay neutral"
 hd_hev_j16_zhangfang_name:0 "Yong Sacrifices Zhang Fang"
 hd_hev_j16_zhangfang_tt:0 "#high Yong Sacrifices Zhang Fang#!\nWindow 306.1.1 – 306.6.1\nZhang Fang is at Yong's court and the rescue war has lasted 90 days\nAn AI Yong kills Zhang Fang to sue for peace; a player Yong may spare him and keep his 8,000 troops"
 hd_hev_j16_wangmi_name:0 "Wang Mi Rises and Joins Han"
 hd_hev_j16_wangmi_tt:0 "#high Wang Mi Rises and Joins Han#!\nWindow 306.3.1 – 308.6.1\nWang Mi is alive and landless; a Han ruler (independent Xiongnu Liu holding Bing) exists\nAn AI Wang Mi joins the Han court and Han gains 5,000 troops; a player Wang Mi may stay with Jin"
 hd_hev_j16_huanluo_name:0 "The Emperor Returns to Luoyang"
 hd_hev_j16_huanluo_tt:0 "#high The Emperor Returns to Luoyang#!\nWindow 306.4.1 – 307.6.1\nYue is not yet regent; Yue won the rescue war, or holds Chang'an, or Yong is dead or out of power\nYue becomes regent and the capital returns to Luoyang; a player Yue may keep the court at Chang'an"
 hd_hev_j16_lixiong_emperor_name:0 "Li Xiong Proclaims Himself Emperor"
 hd_hev_j16_lixiong_emperor_tt:0 "#high Li Xiong Proclaims Himself Emperor#!\nWindow 306.6.1 – 307.6.1\nLi Xiong is independent, free and holds Shu Commandery\nAn AI Li Xiong becomes emperor of Cheng and Fan Changsheng joins as chancellor; a player may remain king"
 hd_hev_j16_yingsi_name:0 "The Death of Sima Ying"
 hd_hev_j16_yingsi_tt:0 "#high The Death of Sima Ying#!\nWindow 306.9.1 – 306.12.31\nYing is landless or imprisoned; Liu Yu is alive\nAn AI Ying is forced to die by Liu Yu's forged edict; a player Ying may accept or flee to Shi Le"
 hd_hev_j16_huaidi_name:0 "Emperor Hui Dies, Emperor Huai Succeeds"
 hd_hev_j16_huaidi_tt:0 "#high Emperor Hui Dies, Emperor Huai Succeeds#!\nWindow 306.11.1 – 308.4.1\nAn AI Emperor Hui restores Sima Chi as heir; Chi succeeds when Hui dies\nLit when Chi holds the realm and the era becomes Yongjia (the deaths of Yong and Tan are handled by the same node)"
 hd_hev_j16_qinwang_name:0 "Zhang Gui Sends Beigong Chun to Aid the Throne"
 hd_hev_j16_qinwang_tt:0 "#high Zhang Gui Sends Beigong Chun to Aid the Throne#!\nWindows 307.1.1 – 309.12.31 and 311.1.1 – 311.6.1\nZhang Gui holds Liang and serves the emperor; the emperor is the main defender in a war\nAn AI Zhang Gui sends 100 gold, joins the defence and adds Beigong Chun's 3,000 men; a player may stay home"
 hd_hev_j16_poye_name:0 "Ji Sang Sacks Ye"
 hd_hev_j16_poye_tt:0 "#high Ji Sang Sacks Ye#!\nWindow 307.3.1 – 307.12.31\nSima Teng holds Wei Commandery or a county in Ji; Ji Sang's employer is landed\nThe employer attacks Ye with 8,000 troops; on victory Teng is killed and the palace of Ye burns\nLit when the war starts"
 hd_hev_j16_zhuisang_name:0 "Gou Xi Crushes Ji Sang"
 hd_hev_j16_zhuisang_tt:0 "#high Gou Xi Crushes Ji Sang#!\nWindow 307.7.1 – 308.3.1\nThe attackers took Ye; Gou Xi is at Yue's court or landed; Ji Sang lives\nAn AI Yue sends Gou Xi with 12,000 men; on victory Ji Sang dies and Dong Commandery goes to Gou Xi\nLit when the war starts"
 hd_hev_304_01_name:0 "Garrisoning Jianye"
 hd_hev_304_01_tt:0 "#high Garrisoning Jianye#!\nWindow 307.9.1 – 312.1.1\nThe emperor is a Henei Sima; Sima Rui is alive and a subject; Danyang lies within the emperor's realm\nThe emperor gets an event (AI follows history); on approval Sima Rui takes Danyang and moves to Jianye. Lit on the historical choice"
 hd_hev_304_02_name:0 "Shi Le Joins Liu Yuan"
 hd_hev_304_02_tt:0 "#high Shi Le Joins Liu Yuan#!\nWindow 307.10.1 – 309.1.1\nThe Battle of Daling has begun or ended; a Han ruler reigns; Shi Le is adult, free and outside Han\nShi Le gets an event; a player Han ruler decides whether to accept him. Lit on the historical choice"
 hd_hev_j16_zhangbin_name:0 "Zhang Bin Joins Shi Le"
 hd_hev_j16_zhangbin_tt:0 "#high Zhang Bin Joins Shi Le#!\nWindow 308.1.1 – 311.12.31\nShi Le is landed and Zhang Bin alive\nZhang Bin joins Shi Le as chancellor and Shi Le gains the Gentlemen's Camp for 30 years; no choices"
 hd_hev_304_03_name:0 "Liu Yuan Proclaims Himself Emperor"
 hd_hev_304_03_tt:0 "#high Liu Yuan Proclaims Himself Emperor#!\nWindow 308.11.1 – 310.8.1\nLiu Yuan is independent, free and has a primary title\nLiu Yuan gets an event: become emperor, change the era to Yongfeng and move to Pingyang; he may decline. Lit on the historical choice"
 hd_hev_j16_duanbu_name:0 "Strife in the Duan Tribe"
 hd_hev_j16_duanbu_tt:0 "#high Strife in the Duan Tribe#!\nWindow 309.1.1 – 325.12.31\nThe Duan chieftains pass Wuwuchen → Jiluojuan → Shefuchen → Mobo; deaths come from the death table\nThe node sets heirs step by step; lit when Mobo kills Shefuchen and seizes power"
 hd_hev_j16_qingjun_name:0 "Yue Purges the Court"
 hd_hev_j16_qingjun_tt:0 "#high Yue Purges the Court#!\nWindow 309.3.1 – 309.12.31\nYue is regent, Emperor Huai holds the realm, Miao Bo is alive\nAn AI Yue executes Miao Bo and Miao Yin and becomes Overbearing for 5 years; a player Yue may spare them"
 hd_hev_j16_daigong_name:0 "Yilu Becomes Duke of Dai"
 hd_hev_j16_daigong_tt:0 "#high Yilu Becomes Duke of Dai#!\nWindow 310.1.1 – 315.6.1\nYilu is independent, free and holds a Tuoba commandery\nHe founds Dai as a duke; an AI Liu Kun allies with him"
 hd_hev_j16_qu_hanzhong_name:0 "Luo Shang Dies, Cheng Eyes Hanzhong"
 hd_hev_j16_qu_hanzhong_tt:0 "#high Luo Shang Dies, Cheng Eyes Hanzhong#!\nWindow 310.7.20 – 315.12.31\nLuo Shang is dead; Li Xiong is landed\nAn AI Li Xiong gains claims on Ba and Hanzhong; a player may refuse"
 hd_hev_j16_chutun_name:0 "Yue Marches Out, a Secret Edict for Gou Xi"
 hd_hev_j16_chutun_tt:0 "#high Yue Marches Out, a Secret Edict for Gou Xi#!\nWindow 310.11.1 – 311.4.23\nYue is regent; Shi Le and Gou Xi are landed\nYue moves to Chen; an AI emperor sends Gou Xi a secret edict; no choices"
 hd_hev_j16_ningping_name:0 "The Battle of Ningping"
 hd_hev_j16_ningping_tt:0 "#high The Battle of Ningping#!\nWindow 311.4.23 – 311.7.1\nYue is dead, Shi Le is landed and free, Wang Yan alive\nAn AI Shi Le intercepts: +1,000 prestige and 5,000 troops, Wang Yan and Sima Pi are executed; a player may let them pass"
 hd_hev_304_04_name:0 "The Siege of Luoyang (Yongjia Disaster)"
 hd_hev_304_04_tt:0 "#high The Siege of Luoyang (Yongjia Disaster)#!\nWindow 311.5.1 – 313.1.1\nLiu Cong's succession is settled; the Han ruler is free and borders the emperor's realm (or holds Hedong, Pingyang, Henei, Hongnong, Xingyang or Ji); Luoyang still belongs to the emperor\nAn AI Han ruler attacks Henan and Songshan (a player may decline); if Han takes Luoyang and the emperor is AI, he is captured and the Southern Migration begins. Lit when the war starts\nAlso: from 311 to 322 a yearly check starts the Southern Migration if Luoyang falls to a Hu realm"
 hd_hev_j16_daiwang_name:0 "Yilu Becomes King of Dai"
 hd_hev_j16_daiwang_tt:0 "#high Yilu Becomes King of Dai#!\nFrom 315.3.1 until 315.6.1\nAlready Duke of Dai; Yilu is still independent and landed\nHis style becomes king"
 hd_hev_j16_gebei_name:0 "Retreat from Gepi to Xiangguo"
 hd_hev_j16_gebei_tt:0 "#high Retreat from Gepi to Xiangguo#!\nWindow 312.2.1 – 312.12.31\nShi Le is landed but holds no county in Ji\nAn AI goes north to Xiangguo (claim and 5,000 troops); a player may march on Jianye instead (troops only)"
 hd_hev_j16_mindi_name:0 "Emperor Min Enthroned at Chang'an"
 hd_hev_j16_mindi_tt:0 "#high Emperor Min Enthroned at Chang'an#!\nWindow 312.9.1 – 313.8.1\nEmperor Huai is dead or a Hu prisoner; Sima Ye lives; Chang'an is not held by Hu\nSima Ye joins the lord of Chang'an and is made heir; if Chang'an is lost he goes to Sima Rui and this row stays unlit"
 hd_hev_j16_zuti_name:0 "Zu Ti's Northern Expedition"
 hd_hev_j16_zuti_tt:0 "#high Zu Ti's Northern Expedition#!\nWindow 313.8.1 – 321.11.22\nZu Ti serves Jin and Hu hold a county in Yu\nOnce: 2,000 troops and a claim on a Hu-held county in Yu"
 hd_hev_j16_jicheng_name:0 "The Seizure of Ji and Wang Jun"
 hd_hev_j16_jicheng_tt:0 "#high The Seizure of Ji and Wang Jun#!\nWindow 314.1.1 – 314.6.1\nWang Jun holds a county in You and Shi Le one in Ji, and they border\nAn AI Shi Le feigns surrender and strikes Ji with 8,000 men while Wang Jun is Credulous; a player may refrain\nLit when the war starts"
 hd_hev_j16_liuyi_fei_name:0 "The Deposition of Liu Yi"
 hd_hev_j16_liuyi_fei_tt:0 "#high The Deposition of Liu Yi#!\nWindow 314.1.1 – 317.5.29\nLiu Cong rules Han; Liu Yi and Liu Can live\nAn AI Liu Cong makes Liu Can heir; Liu Yi dies in 317 via the death table"
 hd_hev_j16_zhangshi_heir_name:0 "Zhang Gui Dies, Zhang Shi Succeeds"
 hd_hev_j16_zhangshi_heir_tt:0 "#high Zhang Gui Dies, Zhang Shi Succeeds#!\nWindow 314.3.1 – 314.6.1\nZhang Gui and Zhang Shi live\nZhang Gui names Zhang Shi heir (Zhang Gui dies 314.6.1)"
 hd_hev_j16_liuxiu_name:0 "The Revolt of Liuxiu"
 hd_hev_j16_liuxiu_tt:0 "#high The Revolt of Liuxiu#!\nWindow 316.3.1 – 316.6.30\nYilu lives; deaths come from the death table\nYilu names Pugen heir, then Pugen names Yulü; lit when Yilu dies inside the window"
 hd_hev_j16_changan316_name:0 "Liu Yao Takes Chang'an, Western Jin Falls"
 hd_hev_j16_changan316_tt:0 "#high Liu Yao Takes Chang'an, Western Jin Falls#!\nWindow 316.6.1 – 317.3.1\nEmperor Min holds the realm and Chang'an; Liu Yao is landed under the Xiongnu Liu and Han holds Pingyang or Hedong\nLiu Yao attacks Jingzhao with 20,000 men; a player may decline\nLit when the war starts"
 hd_hev_j16_bingzhou316_name:0 "Bing Falls, Liu Kun Flees to the Duan"
 hd_hev_j16_bingzhou316_tt:0 "#high Bing Falls, Liu Kun Flees to the Duan#!\nWindow 316.10.1 – 317.6.1\nLiu Kun holds a county in Bing; Shi Le is landed and they border\nShi Le attacks Liu Kun's capital commandery with 8,000 men; on victory Liu Kun flees to Duan Pidi\nLit when the war starts"
 # 东晋初·二赵相争（317–346；304 开局适用）
 hd_hev_j16_tuyuhun3_name:0 "Three Generations of Tuyuhun"
 hd_hev_j16_tuyuhun3_tt:0 "#high Three Generations of Tuyuhun#!\nWindow 316.11.2 – 329.12.31\nTuyuhun → Tuyan → Yeyan; deaths come from the death table\nThe node sets each heir in turn; lit once Tuyan is dead and Yeyan holds land"
 hd_hev_j16_daitong_name:0 "The Succession of Dai to Shiyijian"
 hd_hev_j16_daitong_tt:0 "#high The Succession of Dai to Shiyijian#!\nWindow 317.1.1 – 338.12.31\nYulü → Henou → Hena → Yihuai → Shiyijian; deaths come from the death table\nThe node sets each heir; Shiyijian becomes King of Dai and starts the Jianguo era"
 hd_hev_j16_jinwang_name:0 "Sima Rui Becomes King of Jin"
 hd_hev_j16_jinwang_tt:0 "#high Sima Rui Becomes King of Jin#!\nWindow 317.3.1 – 317.12.31\nNo free Jin emperor sits on the throne (vacant, not a Sima, or a Hu prisoner); Sima Rui lives\nSima Rui takes the title King of Jin"
 hd_hev_j16_jinjian_name:0 "Eastern Jin Is Founded"
 hd_hev_j16_jinjian_tt:0 "#high Eastern Jin Is Founded#!\nWindow 318.2.7 – 318.12.31\nRui is King of Jin; the captive emperor is dead; Rui is alive and free\nIf Rui already holds the realm nothing moves; if it is vacant or in Hu hands it passes to him; no choices"
 hd_hev_j16_baowang_name:0 "Sima Bao Styles Himself King of Jin at Shanggui"
 hd_hev_j16_baowang_tt:0 "#high Sima Bao Styles Himself King of Jin at Shanggui#!\nWindow 318.3.1 – 320.6.1\nEmperor Min is dead; Sima Bao is independent and holds Tianshui or a county in it\nHis realm is renamed Jin with the style of king"
 hd_hev_j16_jinzhun_name:0 "The Coup of Jin Zhun"
 hd_hev_j16_jinzhun_tt:0 "#high The Coup of Jin Zhun#!\nWindow 318.8.31 – 318.11.1\nLiu Cong is dead; Jin Zhun is at the Han court or a vassal\nJin Zhun takes over the Han realm (titles and vassals only, no one is killed on the spot) as Heavenly King; Liu Can dies via the death table; no choices"
 hd_hev_j16_liuyao_ji_name:0 "Liu Yao Takes the Throne"
 hd_hev_j16_liuyao_ji_tt:0 "#high Liu Yao Takes the Throne#!\nWindow 318.10.1 – 319.3.1\nJin Zhun's coup has happened (or Han has left the Xiongnu Liu); Liu Yao holds a county in Sili\nLiu Yao becomes independent with 15,000 troops and a claim on Bing; Shi Le gains a claim on Pingyang"
 hd_hev_j16_murong_jicheng_name:0 "Jicheng Breaks the Three-Realm Coalition"
