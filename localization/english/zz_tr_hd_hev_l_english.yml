l_english:
 hd_hev_btn_tt:0 "Historical event list (debug)"
 hd_hev_btn_label:0 "Hist"
 hd_hev_window_title:0 "Historical Events"
 hd_hev_window_help:0 "#weak Triggered means the node has happened (wars count from the declaration; an event counts once fired even if a player chose another outcome). Expired, not yet due and usually player-refused nodes show Not yet; rows marked otherwise say so in their tooltip. Events from other starts show Not this game. In the Jin and Sixteen Kingdoms groups (304–421) and the rows added on 2026-11-03 (invasions, the coming of Buddhism and others), rows earlier than the current start show Before start. Hover over a name for its conditions.#!"
 hd_hev_st_done:0 "#P Triggered#!"
 hd_hev_st_wait:0 "Not yet"
 hd_hev_st_na:0 "#weak Not this game#!"
 hd_hev_st_past:0 "#weak Before start#!"
 hd_hev_st_past_tt:0 "Already history before this game began: this event is earlier than the current start date, so the start marks it as having happened and it will not fire."
 hd_hev_grp_here:0 "#P (this game)#!"
 hd_hev_grp_22_name:0 "#high Eastern Han: The Chunling Uprising (22.11.13)#!"
 hd_hev_grp_89_name:0 "#high Eastern Han: The Yanran Inscription (89.1.30)#!"
 hd_hev_grp_184_name:0 "#high The Fall of Han (190.1.1)#!"
 hd_hev_grp_long_name:0 "#high Long-Running Lines: the Five Hu, the Southern Migration, Envoys from Da Qin (several starts)#!"
 hd_hev_grp_218_name:0 "#high The Three Kingdoms (218.1.1; the Zhuge Liang and Sima Yi chains, the Memorial and the new King of Wei also apply in the 190 start)#!"
 hd_hev_grp_253_name:0 "#high Jiang Wei's Northern Campaigns (253.3.1; the 218 start relays from 253.3.1; only the Wei invasion row applies to 263)#!"
 hd_hev_grp_263_name:0 "#high Zhong Hui Invades Shu (263.9.20; the 218 and 253 starts relay from 263.8.1)#!"
 hd_hev_grp_304_name:0 "#high Late Western Jin: the Eight Princes and the Yongjia Disaster (304–317; 304 start)#!"
 hd_hev_grp_346_name:0 "#high Later Zhao Collapses, Qin and Yan Rise (346–370; 304 and 346 starts)#!"
 hd_hev_grp_370_name:0 "#high Wang Meng Conquers Yan, Former Qin Unites the North (370–383; 304, 346 and 370 starts)#!"
 hd_hev_grp_404_name:0 "#high Liu Yu's Campaigns and the Song Usurpation (404–421; all four Jin starts)#!"
 hd_hev_grp_j16_e2_name:0 "#high Early Eastern Jin: the Two Zhaos (317–346; 304 start)#!"
 hd_hev_grp_j16_e5j_name:0 "#high Late Eastern Jin: Wang Gong, Sun En and Huan Xuan (396–404; 304, 346 and 370 starts)#!"
 hd_hev_grp_j16_e5_name:0 "#high The Northern States (395–412; the first four rows predate the 404 start)#!"
 hd_hev_grp_531_name:0 "#high Rising at Xindu (531.7.1)#!"
 hd_hev_grp_617_name:0 "#high Rising at Jinyang (617.6.23)#!"
 hd_hev_grp_hi_name:0 "#high Historical Invasions: Hu and Han Strongmen Rise Year by Year (210–590; from the 190 start on, by window)#!"
 hd_hev_grp_fo_name:0 "#high The Coming of Buddhism (65–645; all starts, earlier nodes show as before the start)#!"
 hd_hev_22_01_name:0 "The Chunling Uprising (Battle of Wan)"
 hd_hev_22_01_tt:0 "#high The Chunling Uprising (Battle of Wan)#!\nOn the 22.11.13 start day (after the lobby)\nIf Liu Yan is independent and Zhen Fu still holds Nanyang, Liu Yan opens a border war against him\nWang Kuang of Xinshi and Chen Mu of Pinglin join the attack\nHan wins if Wan ends up on its side; AI Zhen Fu and Liangqiu Ci die"
 hd_hev_22_02_name:0 "The Meeting at Yiqiu (Xiajiang Joins)"
 hd_hev_22_02_tt:0 "#high The Meeting at Yiqiu (Xiajiang Joins)#!\nFrom 22.12.13 until 23.6.1\nWang Chang is independent, landed and not at war, and Liu Yan is still fighting at Wan\nWang Chang's Xiajiang army joins the attack with 4,000 men\nA player Wang Chang may join or stay apart"
 hd_hev_22_03_name:0 "Liu Xuan Is Raised Up (Gengshi Emperor)"
 hd_hev_22_03_tt:0 "#high Liu Xuan Is Raised Up (Gengshi Emperor)#!\nFrom 23.3.11 until 24.1.1\nLiu Xuan is landless and at least 3 of Liu Yan, Wang Kuang, Chen Mu and Wang Chang are independent and landed\nLiu Xuan receives Sui or Yingshan, becomes Han emperor and starts the Gengshi era\nThe four leaders submit: AIs at once, players choose"
 hd_hev_22_04_name:0 "The Siege of Kunyang"
 hd_hev_22_04_tt:0 "#high The Siege of Kunyang#!\nFrom 23.5.8 until 24.1.1\nWang Mang still holds the realm, Liu Xuan is emperor and Liu Xiu is a landed Gengshi vassal\nKunyang goes to Liu Xiu and Wang Yi attacks with 30,000\nA player Liu Xiu may hold or abandon the city; a Han victory kills Wang Xun and costs Wang Mang prestige"
 hd_hev_22_05_name:0 "The Generals of Yingchuan"
 hd_hev_22_05_tt:0 "#high The Generals of Yingchuan#!\nFrom the end of Kunyang (or 23.8.1) until 24.6.1\nLiu Xiu is alive and landed\nFeng Yi, Ji Zun, Wang Ba, Yao Qi and others join his court (only unemployed AIs)\nA player Liu Xiu gets one notice"
 hd_hev_22_06_name:0 "The Death of Bosheng"
 hd_hev_22_06_tt:0 "#high The Death of Bosheng#!\nFrom 23.7.7 (after Kunyang, or 24.1.1)\nHan won at Kunyang, Liu Xuan is still emperor and Liu Yan is his AI vassal\nThe Gengshi emperor kills Liu Yan\nA player Liu Xiu may apologise or leave in anger (becoming a rival)"
 hd_hev_22_07_name:0 "The Plot of Liu Xin and Wang She"
 hd_hev_22_07_tt:0 "#high The Plot of Liu Xin and Wang She#!\n23.8.1\nOnly if Wang Mang still holds the realm\nAI Liu Xin and Wang She kill themselves and Dong Zhong is killed (players do not die)\nNo pop-up"
 hd_hev_22_08_name:0 "The Realm Rises Against Wang Mang"
 hd_hev_22_08_tt:0 "#high The Realm Rises Against Wang Mang#!\nFrom 23.8.1 until 24.1.1\nWang Mang still holds the realm\nWei Xiao rises at Tianshui, Gongsun Shu rises in Shu and Wang Mang's AI governors (except Sili) break away\nA player Wang Mang is notified"
 hd_hev_22_09_name:0 "The Fall of Chang'an (Through the Wu Pass)"
 hd_hev_22_09_tt:0 "#high The Fall of Chang'an (Through the Wu Pass)#!\nAfter the realm rises, the Gengshi emperor (or the strongest rebel) attacks Jingzhao through the Wu Pass\nWhen Chang'an falls Xin ends: the realm and the seal pass to the attacker and an AI Wang Mang dies\nA player attacker sees the march first; a player Wang Mang may flee or hold\nIf still untaken on 26.1.1 an uprising inside the city ends it (except for a player Wang Mang)"
 hd_hev_22_10_name:0 "Crossing North with the Credentials"
 hd_hev_22_10_tt:0 "#high Crossing North with the Credentials#!\nFrom 23.11.1 until 25.1.1\nLiu Xiu is alive and landed\nHe crosses north, takes Anping (Xindu) and 5,000 troops; Deng Yu, Ren Guang, Geng Chun and others join\nA player may go or stay; a player liege is asked first\n(Counts as soon as it fires)"
 hd_hev_22_11_name:0 "The King of Xiao Refuses the Summons"
 hd_hev_22_11_tt:0 "#high The King of Xiao Refuses the Summons#!\n120 days after crossing north (or after leaving in anger; retried from 25.8.5), until 27.1.1\nLiu Xiu holds a commandery or higher and is not independent\nHe breaks away as King of Xiao and becomes a conqueror\nA player Liu Xiu may refuse or obey; a player liege is notified"
 hd_hev_22_12_name:0 "March on Handan"
 hd_hev_22_12_tt:0 "#high March on Handan#!\nAfter Liu Xiu breaks away, until 26.1.1\nLiu Xiu is independent and landed and does not hold Handan\nHe attacks the holder of Handan (Xiangguo) with 10,000; an AI Wang Lang dies on defeat\nA player may march or wait; Geng Yan, Wu Han and others join"
 hd_hev_22_13_name:0 "Enthronement at Qianqiu Pavilion"
 hd_hev_22_13_tt:0 "#high Enthronement at Qianqiu Pavilion#!\nFrom 25.8.5 until 27.1.1\nLiu Xiu is independent and landed\nHe becomes emperor (new empire title or the realm) and starts the Jianwu era; Ma Wu and Cen Peng join\nA player may delay (asked again on 26.6.1)"
 # 汉代风味内容（2026-10-25）手工加行；生成器 build_data.py 未同步，勿直接重跑
 hd_hev_22_14_name:0 "The Failures of Xin"
 hd_hev_22_14_tt:0 "#high The Failures of Xin#!\nOne event each on days 20, 80 and 140 after the start, until 23.6.1\nWang Mang lives\nSent to Wang Mang and players in his realm; Xin counties get a three-year modifier at start (not if historical events are off)"
 hd_hev_22_15_name:0 "Fixing the Fire Virtue"
 hd_hev_22_15_tt:0 "#high Fixing the Fire Virtue#!\nAfter Liu Xiu becomes emperor, checked every 90 days until 30.1.1\nLiu Xiu lives as emperor\nHe fixes the dynastic virtue: Fire (legitimacy) or Water"
 hd_hev_89_01_name:0 "Inscription at Yanran (Battle of Mount Jiluo)"
 hd_hev_89_01_tt:0 "#high Inscription at Yanran (Battle of Mount Jiluo)#!\nFrom 89.6.27 until 90.1.19\nAn independent ruler other than the emperor holds Ongiin in the Gobi\nDou Xian (else Deng Hong, else the emperor) marches north with the Southern Chanyu\nOn victory Dou Xian carves the stone, becomes Grand General and Ongiin goes to Shuofang; a player may delay"
 hd_hev_89_02_name:0 "Mount Jinwei"
 hd_hev_89_02_tt:0 "#high Mount Jinwei#!\nFrom 91.3.9 until 92.1.27\nThe Northern Chanyu is independent and holds Gobi Altai (or Orkhon)\nGeng Kui and Ren Shang strike from Juyan with the Southern Chanyu\nOn victory the Northern Chanyu migrates west (a player may surrender instead) and eastern tribes take the name Xianbei"
 hd_hev_89_03_name:0 "Protector General of the Western Regions"
 hd_hev_89_03_tt:0 "#high Protector General of the Western Regions#!\nFrom 91.12.29 until 93.1.1\nBan Chao is alive and landed\nHe becomes Protector General with prestige, the Western Regions kingdom (as a Han vassal) and 8,000 men; war if Qiuci refuses\nA player king of Qiuci may submit or refuse"
 hd_hev_89_04_name:0 "Yuchujian Submits"
 hd_hev_89_04_tt:0 "#high Yuchujian Submits#!\nFrom 91.12.29 (after a Han win at Jinwei) until 93.1.1\nYuchujian is alive, independent and landed\nHe sends envoys and accepts Han as overlord\nA player may submit or stay independent"
 hd_hev_89_05_name:0 "The North Palace Gates Close (Fall of the Dou)"
 hd_hev_89_05_tt:0 "#high The North Palace Gates Close (Fall of the Dou)#!\nA year after both northern wars end, not before 92.8.14\nDou Xian lives and there is an emperor\nThe emperor and Zheng Zhong strip Dou Xian; AI Dou brothers return land and die, Deng Die and Guo Ju die in prison\nA player emperor may act or wait; a player Dou Xian may submit or rebel"
 hd_hev_89_06_name:0 "Yuchujian Rebels and Is Killed"
 hd_hev_89_06_tt:0 "#high Yuchujian Rebels and Is Killed#!\n93.7.1\nYuchujian has submitted and is AI\nHe rebels and is hunted down by Ren Shang\nNo pop-up"
 hd_hev_89_07_name:0 "The Campaign Against Yanqi"
 hd_hev_89_07_tt:0 "#high The Campaign Against Yanqi#!\nFrom 94.8.1 until 96.1.1\nBan Chao is landed and Yanqi has not submitted\nBan Chao leads eight states against Yanqi; on victory AI King Guang dies and Yuanmeng rules as a Han vassal\nPlayers on either side may decline or submit"
 hd_hev_89_08_name:0 "The Yuezhi Attack"
 hd_hev_89_08_tt:0 "#high The Yuezhi Attack#!\nFrom 90.6.1 until 91.6.1\nBan Chao is alive and landed\nThe Yuezhi viceroy Xie attacks with 70,000; an AI Ban Chao holds fast and gains prestige\nA player may hold or fight"
 hd_hev_89_09_name:0 "The Northern Xiongnu Migrate West"
 hd_hev_89_09_tt:0 "#high The Northern Xiongnu Migrate West#!\nAfter the Han win at Jinwei\nThe Northern Chanyu is AI or a player chose to flee\nYuchujian keeps two commanderies, the east becomes Xianbei, Gaochang and others break away; the Chanyu moves west and the Xiongnu empire title is destroyed\nNo pop-up"
 hd_hev_89_10_name:0 "The Campaign Against Qiuci"
 hd_hev_89_10_tt:0 "#high The Campaign Against Qiuci#!\nAfter the protectorate is set up and Qiuci still resists, until 93.1.1\nBan Chao is alive and landed\nHe attacks Qiuci; on victory the AI king is deposed and Bai Ba rules as his vassal\nPlayers on either side may decline or submit"
 hd_hev_89_11_name:0 "Marquis of Dingyuan"
 hd_hev_89_11_tt:0 "#high Marquis of Dingyuan#!\nFrom 95.3.1 (after victory at Yanqi) until 98.1.1\nBan Chao lives\nHe is enfeoffed with prestige and a title\nA player may accept or decline"
 hd_hev_89_12_name:0 "An Envoy to Da Qin"
 hd_hev_89_12_tt:0 "#high An Envoy to Da Qin#!\nFrom 97.1.1 until 99.1.1\nBan Chao is alive and landed\nGan Ying travels west to the sea and returns: prestige and a modifier\nA player may send him or not"
 hd_hev_89_13_name:0 "Home Through the Jade Gate"
 hd_hev_89_13_tt:0 "#high Home Through the Jade Gate#!\nMemorial 100.6.1, hand-over 102.8.1\nBan Chao is alive and landed\nRen Shang takes over the protectorate and an AI Ban Chao returns to Luoyang\nA player may return (keeping a seat of two counties) or stay"
 # 汉代风味内容（2026-10-25）手工加行；生成器 build_data.py 未同步，勿直接重跑
 hd_hev_89_14_name:0 "Ban Zhao Continues the History"
 hd_hev_89_14_tt:0 "#high Ban Zhao Continues the History#!\nUntil 110.1.1\nBan Gu is dead, Ban Zhao lives, there is an emperor\nIf approved the Book of Han is finished 3 – 5 years later; a player Ban Zhao gets an extra event"
 hd_hev_89_15_name:0 "The Book of Han Is Finished"
 hd_hev_89_15_tt:0 "#high The Book of Han Is Finished#!\n3 – 5 years after approval, until 120.1.1\nBan Zhao lives\nThe emperor receives the Book of Han artifact"
 hd_hev_89_16_name:0 "Cai Lun's Paper"
 hd_hev_89_16_tt:0 "#high Cai Lun's Paper#!\n105.1.1 – 112.1.1\nCai Lun lives and there is an emperor\nIf praised the emperor gains a five-year modifier; a player Cai Lun gets an event"
 hd_hev_89_17_name:0 "The Old Case of Consort Song"
 hd_hev_89_17_tt:0 "#high The Old Case of Consort Song#!\n121.1.1 – 125.1.1\nCai Lun is alive and free and not emperor\nSummoned to the court of justice, an AI Cai Lun takes poison; a player may drink or plead"
 hd_hev_89_18_name:0 "The Seismoscope (and the Longxi Quake)"
 hd_hev_89_18_tt:0 "#high The Seismoscope (and the Longxi Quake)#!\n132.1.1 – 138.1.1\nZhang Heng lives and there is an emperor\nThe emperor gains the seismoscope; placed at the observatory, a Longxi quake follows in 1 – 3 years (until 140.1.1)"
 hd_hev_89_19_name:0 "Debate on Abandoning Liang"
 hd_hev_89_19_tt:0 "#high Debate on Abandoning Liang#!\n110.1.1 – 113.1.1\nDeng Zhi lives and the emperor holds counties in Liang\nThe emperor chooses: abandon (Deng Zhi), hold (Yu Xu) or pacify"
 hd_hev_184_01_name:0 "The Blue Heaven Is Dead (Yellow Turban Rebellion)"
 hd_hev_184_01_tt:0 "#high The Blue Heaven Is Dead (Yellow Turban Rebellion)#!\nDay 2 after the 184.1.1 start\nMa Yuanyi is executed and Zhang Jue rises in Ji\nThree Yellow Turban armies declare war on Han\nAll players are notified"
 hd_hev_184_02_name:0 "The Peach Garden Oath (and Patrons for the Cause)"
 hd_hev_184_02_tt:0 "#high The Peach Garden Oath (and Patrons for the Cause)#!\nAfter the 184 lobby, from Liu Bei's life story\nLiu Bei, Guan Yu and Zhang Fei live and the Yellow Turban outcome is open\nThey swear brotherhood and Guan and Zhang join Liu Bei\n7 – 14 days later Zhang Shiping and Su Shuang give money and men"
 hd_hev_184_03_name:0 "The Pillar of Heaven General (Jiaozhi Mutiny)"
 hd_hev_184_03_tt:0 "#high The Pillar of Heaven General (Jiaozhi Mutiny)#!\nMonthly from 184.6 to 186.12\nThe Yellow Turbans have risen and Jiaozhi has a governor\nThe rebels attack the governor of Jiaozhi\nPop-up only for a player defender"
 hd_hev_184_04_name:0 "The Huangzhong Qiang Revolt (Beigong Boyu)"
 hd_hev_184_04_tt:0 "#high The Huangzhong Qiang Revolt (Beigong Boyu)#!\nMonthly from 184.10 to 186.12\nThe Yellow Turbans have risen and Jincheng or Guangwei has a governor\nBeigong Boyu, Han Sui and others rise\nNeighbours submit after a victory"
 hd_hev_184_05_name:0 "The Yellow Turban Outcome"
 hd_hev_184_05_tt:0 "#high The Yellow Turban Outcome#!\nAll three main wars ended with no rebel win: Han survives\nAny forced rebel win: Han falls\nAll players get the outcome event\nIf Han survives the palace crisis is scheduled"
 hd_hev_184_06_name:0 "The Black Mountain Bandits"
 hd_hev_184_06_tt:0 "#high The Black Mountain Bandits#!\nMonthly from 185.2 to 188.12\nThe Yellow Turbans have risen and Changshan or Zhao has a governor\nZhang Yan and the Black Mountain rise\nPop-up only for a player defender"
 hd_hev_184_07_name:0 "The Jiangxia Man Revolt"
 hd_hev_184_07_tt:0 "#high The Jiangxia Man Revolt#!\nMonthly from 185.4 to 187.12\nThe Yellow Turbans have risen and Jiangxia has a governor\nThe Man of Jiangxia rise\nPop-up only for a player defender"
 hd_hev_184_08_name:0 "Wang Guo Rises"
 hd_hev_184_08_tt:0 "#high Wang Guo Rises#!\nMonthly from 187.4 to 189.12\nThe Yellow Turbans have risen and Fufeng has a governor\nWang Guo rises and may join the Liang revolt\nPop-up only for a player defender"
 hd_hev_184_09_name:0 "Zhang Ju Claims the Throne (Zhang Chun Revolt)"
 hd_hev_184_09_tt:0 "#high Zhang Ju Claims the Throne (Zhang Chun Revolt)#!\nMonthly from 187.6 to 189.12\nThe Yellow Turbans have risen and Youbeiping, Liaoxi or Yuyang has a governor\nZhang Ju and Zhang Chun rise in You\nPop-up only for a player defender"
 hd_hev_184_10_name:0 "Pacifying Jing (Liu Biao Rides Alone)"
 hd_hev_184_10_tt:0 "#high Pacifying Jing (Liu Biao Rides Alone)#!\nAround 188.1.1 (historically 190)\nLiu Biao lives and Jing has a holder\nLiu Biao takes over Jing with its de jure land and vassals\nLiu Biao gets the event"
 hd_hev_190_02_name:0 "The South Is Pacified (Banquet at Yicheng / Riding Alone to Parley)"
 hd_hev_190_02_tt:0 "#high The South Is Pacified (Banquet at Yicheng / Riding Alone to Parley)#!\n190.9.1 (day 243), only if Kuai Yue's plan was adopted\nSu Dai and Bei Yu are killed at the Yicheng banquet; Zhang Hu and Chen Sheng surrender\nTheir lands go to Liu Biao's demesne and he moves his seat to Xiangyang\nOnly a player target may refuse, and Liu Biao then declares an annexation war"
 hd_hev_190_01_name:0 "Kuai Yue's Counsel"
 hd_hev_190_01_tt:0 "#high Kuai Yue's Counsel#!\n190.3.1 (day 59)\nLiu Biao is alive and landed, Kuai Yue is alive\nKuai Yue and Kuai Liang join Liu Biao's court with a plan against the clan bandits\nA player Liu Biao may refuse (the line ends); an AI Liu Biao adopts it"
 hd_hev_184_11_name:0 "The Xiuchuge Revolt (Bing)"
 hd_hev_184_11_tt:0 "#high The Xiuchuge Revolt (Bing)#!\nMonthly from 188.3 to 190.12\nThe Yellow Turbans have risen and Xihe or Hexi has a governor\nThe Xiuchuge Hu rise in Bing\nPop-up only for a player defender"
 hd_hev_184_12_name:0 "The Yellow Turbans of Yi (Ma Xiang)"
 hd_hev_184_12_tt:0 "#high The Yellow Turbans of Yi (Ma Xiang)#!\nMonthly from 188.6 to 190.12\nThe Yellow Turbans have risen and Guanghan, Shu or Qianwei has a governor\nMa Xiang rises in Yi\nPop-up only for a player defender"
 hd_hev_184_13_name:0 "Emperor Ling Dies"
 hd_hev_184_13_tt:0 "#high Emperor Ling Dies#!\nForced death by 189.5.13 at the latest, possibly earlier\nHis titles and vassals pass to Liu Bian first\nAll players are notified\nThe palace crisis is then attempted"
 hd_hev_184_14_name:0 "Rumours in the Capital"
 hd_hev_184_14_tt:0 "#high Rumours in the Capital#!\nAfter a Han-survives outcome or Emperor Ling's death\nWith Dong Zhuo in control, 35 days later\nHe Jin summons outside troops and Dong Zhuo answers\nSent to Dong Zhuo and He Jin"
 hd_hev_184_15_name:0 "The Palace Gates Close (He Jin Killed)"
 hd_hev_184_15_tt:0 "#high The Palace Gates Close (He Jin Killed)#!\nAbout 35 days after Dong Zhuo is summoned\nZhang Rang (or Zhao Zhong) kills He Jin in the palace\nHe Jin gets the event\n35 days later the eunuchs are purged"
 hd_hev_184_16_name:0 "Blood at the Palace Gates (Eunuchs Purged)"
 hd_hev_184_16_tt:0 "#high Blood at the Palace Gates (Eunuchs Purged)#!\nAbout 35 days after He Jin dies\nYuan Shao (else Cao Cao, else Dong Zhuo) kills the Ten Attendants\nThe executor is notified\n35 days later Dong Zhuo enters Luoyang"
 hd_hev_184_17_name:0 "The Liang Army Enters Luoyang"
 hd_hev_184_17_tt:0 "#high The Liang Army Enters Luoyang#!\nAbout 35 days after the purge\nDong Zhuo moves to Luoyang and takes Sili and its vassals\nHe becomes the permanent regent (chancellor)\nAll players are notified"
 hd_hev_184_18_name:0 "Lü Bu Kills Ding Yuan"
 hd_hev_184_18_tt:0 "#high Lü Bu Kills Ding Yuan#!\nAbout 30 days after the deposition (historically before it, 189.8)\nDing Yuan gets an event as Lü Bu is bought\nLü Bu kills Ding Yuan and Bing passes to Dong Zhuo\nLü Bu takes Dong Zhuo as his adoptive father"
 hd_hev_184_19_name:0 "The Deposition (Liu Xie Enthroned)"
 hd_hev_184_19_tt:0 "#high The Deposition (Liu Xie Enthroned)#!\n365 days after Dong Zhuo enters Luoyang\nLiu Bian's titles and hegemony pass to Liu Xie\nDong Zhuo remains regent\n5 days later Liu Bian and Empress He are killed; all players are notified"
 hd_hev_184_20_name:0 "Yuan Shao Flees to Bohai"
 hd_hev_184_20_tt:0 "#high Yuan Shao Flees to Bohai#!\nAbout 35 days after the deposition\nYuan Shao lives and his early story is not done\nHe breaks with Dong Zhuo and flees to Bohai\nYuan Shao gets the event"
 hd_hev_184_21_name:0 "The Coalition Against Dong Zhuo"
 hd_hev_184_21_tt:0 "#high The Coalition Against Dong Zhuo#!\nAfter the deposition, raised by Yuan Shao and others\nInvitations go out when the coalition forms\nThe coalition declares war and all players are notified\nThe burning of Luoyang is scheduled the same day"
 hd_hev_184_22_name:0 "Luoyang Burns, the Court Moves West"
 hd_hev_184_22_tt:0 "#high Luoyang Burns, the Court Moves West#!\n1 day after the coalition forms\nDong Zhuo burns Luoyang and slaughters its families\nThe emperor and Dong Zhuo's core move to Chang'an\nAll players are notified"
 hd_hev_184_23_name:0 "The Coalition Disbands"
 hd_hev_184_23_tt:0 "#high The Coalition Disbands#!\nThe coalition ends with victory, failure or Dong Zhuo's death\nVassals of the emperor break away in proportion\nPlayer vassals choose whether to stay\nRechecked on day 3, then exclaves are handled"
 hd_hev_184_24_name:0 "The Warlords Rise"
 hd_hev_184_24_tt:0 "#high The Warlords Rise#!\n1 day after the coalition disbands and exclaves are handled\nAbout 40 leaders such as Zhang Yang, Yuan Shao, Cao Cao and Liu Biao rise in their historical lands\nPlayer leaders and player lieges decide for themselves\n(Counts as soon as it fires)"
 hd_hev_184_25_name:0 "Cao Cao Takes the Qingzhou Army"
 hd_hev_184_25_tt:0 "#high Cao Cao Takes the Qingzhou Army#!\nAbout a year after the coalition ends, not before 191\nCao Cao is alive and landed\nHe gains 22,000 Qingzhou troops and 20 years of military colonies\nCao Cao gets the event"
 hd_hev_190_03_name:0 "Zhang Lu Seizes Hanzhong"
 hd_hev_190_03_tt:0 "#high Zhang Lu Seizes Hanzhong#!\n191.3.1 (day 424)\nZhang Lu is alive and landless; Su Gu still holds Hanzhong under Liu Yan\nZhang Lu kills Su Gu, takes Hanzhong and Wudu and breaks from Liu Yan\nAll players are notified"
 hd_hev_184_26_name:0 "Wang Yun Kills Dong Zhuo"
 hd_hev_184_26_tt:0 "#high Wang Yun Kills Dong Zhuo#!\nFrom 192.5.1: Dong Zhuo is regent and Wang Yun is free\nA player Dong Zhuo may delay a year; a player Wang Yun or Lü Bu decides\nLü Bu kills Dong Zhuo if present, otherwise Wang Yun\nLü Bu gains Jingzhao, Wang Yun runs the Secretariat, Diaochan goes to Lü Bu"
 hd_hev_184_27_name:0 "The Liang Army Strikes Back at Chang'an"
 hd_hev_184_27_tt:0 "#high The Liang Army Strikes Back at Chang'an#!\nAfter Dong Zhuo's death is settled, Li Jue gains Hongnong and independence\nThe next day Li Jue attacks the holder of Jingzhao (Lü Bu)\nGuo Si joins Li Jue\nAll players are notified"
 hd_hev_184_28_name:0 "Defeat at Chang'an (Lü Bu Flees)"
 hd_hev_184_28_tt:0 "#high Defeat at Chang'an (Lü Bu Flees)#!\nLi Jue wins the war for Chang'an\nWang Yun and his kin die and Li Jue takes Jingzhao\nLü Bu loses his land and becomes a wandering camp with troops\nZhang Liao and Gao Shun follow; Chen Gong joins the next day"
 hd_hev_184_29_name:0 "Fleeing East to Yan"
 hd_hev_184_29_tt:0 "#high Fleeing East to Yan#!\nLü Bu's camp is ready\nThe camp moves to Chenliu with claims on Yan and Chenliu\n30 days later he attacks the holder of Chenliu\nLü Bu gets the event"
 hd_hev_190_05_name:0 "Strife in Chang'an (Li and Guo Fall Out, the Emperor Returns East)"
 hd_hev_190_05_tt:0 "#high Strife in Chang'an (Li and Guo Fall Out, the Emperor Returns East)#!\nFrom 195.3.1, rechecked every 90 days up to 8 times\nLi Jue and Guo Si are alive AI rulers; Li Jue is landed and independent\nIf Li Jue holds Hongnong, Guo Si takes it and breaks away; the two despise each other\nAn AI emperor returns east to Luoyang; all players are notified"
 hd_hev_190_04_name:0 "Li Jue and Guo Si at War (One Roost, Two Cocks / Guo Si Takes Fufeng)"
 hd_hev_190_04_tt:0 "#high Li Jue and Guo Si at War (One Roost, Two Cocks / Guo Si Takes Fufeng)#!\nChecked every 30 days from 195.2.1 until 198.1.1\nLi Jue has taken Chang'an and is alive, landed and independent; Guo Si lives, landless or inside Li Jue's realm\nFan Chou is killed; Li Jue keeps Jingzhao, Guo Si takes Fufeng, the rest break away; the two become rivals\nAn AI Guo Si attacks at once; a player Guo Si chooses; a player Li Jue and those losing land in Fufeng are notified"
 hd_hev_184_30_name:0 "Yan Baihu Gathers"
 hd_hev_184_30_tt:0 "#high Yan Baihu Gathers#!\nMonthly from 196.1 to 199.12\nThe Yellow Turbans have risen and Wu has a governor\nYan Baihu rises in Wu\nPop-up only for a player defender"
 hd_hev_190_06_name:0 "Trouble in the South Seas (Zhu Fu Killed, Shi Xie Takes Jiaozhou)"
 hd_hev_190_06_tt:0 "#high Trouble in the South Seas (Zhu Fu Killed, Shi Xie Takes Jiaozhou)#!\nFrom 196.6.1, rechecked every 90 days up to 8 times\nZhu Fu is an alive AI; Shi Xie is alive and landed\nShi Xie takes Zhu Fu's lands and Jiaozhou and becomes independent; Zhu Fu is murdered\nShi Xie's brothers govern Hepu, Jiuzhen and Nanhai; all players are notified"
 hd_hev_184_31_name:0 "Red Cliffs"
 hd_hev_184_31_tt:0 "#high Red Cliffs#!\nAfter Guandu, with Cao Cao, Sun Quan and Liu Bei alive\nThe holder of Jing submits to Cao or resists\nCao Cao decides whether to attack Sun Quan\nNorthern defeat: retreat; Sun defeat: the river defences break"
 hd_hev_184_32_name:0 "Liu Bei Joins the War on the Yellow Turbans"
 hd_hev_184_32_tt:0 "#high Liu Bei Joins the War on the Yellow Turbans#!\nDuring the 184 rebellion while Han fights the rebels\nLiu Bei (184 start, adult, landed or camp, free) gets it\nIf he agrees he joins the defence"
 hd_hev_184_33_name:0 "Cao Cao Plots Against Dong Zhuo"
 hd_hev_184_33_tt:0 "#high Cao Cao Plots Against Dong Zhuo#!\nAbout 35 days after the deposition\nFires if Cao Cao lives, for players and AI\nWu Fu fails to kill Dong Zhuo and Cao Cao begins to plot"
 hd_hev_184_34_name:0 "The Offered Sword"
 hd_hev_184_34_tt:0 "#high The Offered Sword#!\nAbout a month later\nCao Cao gets the Seven Star sword from Wang Yun and fails to kill Dong Zhuo\nThey become rivals"
 hd_hev_184_35_name:0 "Blood on the Road (Lü Boshe)"
 hd_hev_184_35_tt:0 "#high Blood on the Road (Lü Boshe)#!\nAfter the failed attempt, fleeing back to Dong (once settled at Dongwuyang)\nCao Cao kills Lü Boshe's household; Chen Gong leaves if present\nCao Cao becomes Callous"
 hd_hev_184_36_name:0 "Liu Bei Answers the Coalition"
 hd_hev_184_36_tt:0 "#high Liu Bei Answers the Coalition#!\nAfter the coalition forms\nLiu Bei joins the attack if he agrees\nNot after the coalition disbands"
 hd_hev_184_37_name:0 "Cao Cao Gathers His Men at Dong"
 hd_hev_184_37_tt:0 "#high Cao Cao Gathers His Men at Dong#!\nDays after the Lü Boshe event, if Cao Cao is landed\nHe becomes a conqueror and gains 6,000 gold and 4,000 Danyang troops\nXiahou and Cao kinsmen join"
 hd_hev_190_09_name:0 "Guo Jia Arrives"
 hd_hev_190_09_tt:0 "#high Guo Jia Arrives#!\n196.3.1 (checked once)\nCao Cao is alive and landed; Guo Jia is an adult AI, landless, free and not in a player's court\nGuo Jia joins Cao Cao's court with +30 opinion\nA player lord receives A Scholar Arrives"
 hd_hev_190_08_name:0 "Cheng Yu Arrives"
 hd_hev_190_08_tt:0 "#high Cheng Yu Arrives#!\n192.6.1 (checked once)\nCao Cao is alive and landed; Cheng Yu is an adult AI, landless, free and not in a player's court\nCheng Yu joins Cao Cao's court with +30 opinion\nA player lord receives A Scholar Arrives"
 hd_hev_190_13_name:0 "The Chenliu Plot / Eastward into Yan (Cao Cao's Yan Province Relay)"
 hd_hev_190_13_tt:0 "#high The Chenliu Plot / Eastward into Yan (Cao Cao's Yan Province Relay)#!
From 10 days after Dong Zhuo falls and the warlord era begins (190 start only)
Cao Cao lives and is landed; he annexes Zhang Miao at Chenliu, then about 20 days after each win attacks the next bordering independent ruler holding de jure Yan counties
Stops at 70% of Yan or when no target is left; a loss or white peace ends it
A player Cao Cao gets an event for each war and may stop; lit when the first war starts"
 hd_hev_190_07_name:0 "Xun Yu Arrives"
 hd_hev_190_07_tt:0 "#high Xun Yu Arrives#!\n191.9.1 (checked once)\nCao Cao is alive and landed; Xun Yu is an adult AI, landless, free and not in a player's court\nXun Yu joins Cao Cao's court with +30 opinion\nA player lord receives A Scholar Arrives"
 hd_hev_184_38_name:0 "Yuan Shao Settles in Bohai"
 hd_hev_184_38_tt:0 "#high Yuan Shao Settles in Bohai#!\nYuan Shao flees to Bohai during the coalition, sits at Qingchi and claims Ji\nOnce settled he gains 3,000 gold and 5,000 armoured men\nShen Pei, Tian Feng, Ju Shou, Yan Liang, Wen Chou and others join"
 hd_hev_184_39_name:0 "Yuan Shu Flees to Nanyang"
 hd_hev_184_39_tt:0 "#high Yuan Shu Flees to Nanyang#!\nAfter Dong Zhuo enters Luoyang\nFires if Yuan Shu is alive and free\nHis estate moves to Wan in Nanyang"
 hd_hev_184_40_name:0 "Yuan Shu Takes Nanyang, Sun Jian Follows"
 hd_hev_184_40_tt:0 "#high Yuan Shu Takes Nanyang, Sun Jian Follows#!\nYuan Shu is at Wan and Sun Jian is alive and free\nSun Jian kills the governor of Nanyang and the commandery goes to Yuan Shu\nSun Jian gives up his land and moves to Wan as Yuan Shu's vassal"
 hd_hev_184_41_name:0 "The Nanyang Yellow Turbans Surrender"
 hd_hev_184_41_tt:0 "#high The Nanyang Yellow Turbans Surrender#!\n30 days after Yuan Shu takes Nanyang\nHe gains about 36,000 surrendered Yellow Turbans\nNanyang figures are then recruited in two waves"
 hd_hev_184_42_name:0 "Sun Jian Finds the Imperial Seal"
 hd_hev_184_42_tt:0 "#high Sun Jian Finds the Imperial Seal#!\nAfter the coalition disbands\nSun Jian is alive and actually fought in the war\nHe takes the Imperial Seal"
 hd_hev_184_43_name:0 "Gongsun Zan Attacks Ji"
 hd_hev_184_43_tt:0 "#high Gongsun Zan Attacks Ji#!\nAfter the Dong Zhuo chain ends with Han Fu still in Ji\nGongsun Zan (holding You) is invited and attacks Han Fu if he agrees\nYuan Shao is notified"
 hd_hev_184_44_name:0 "Ji Changes Hands (Han Fu Yields)"
 hd_hev_184_44_tt:0 "#high Ji Changes Hands (Han Fu Yields)#!\nAbout 30 days after Gongsun Zan attacks\nWith both alive, Han Fu yields all of Ji to Yuan Shao\nYuan Shao and Gongsun Zan become rivals"
 hd_hev_184_45_name:0 "A Letter from Bogui (Liu Bei Joins Gongsun Zan)"
 hd_hev_184_45_tt:0 "#high A Letter from Bogui (Liu Bei Joins Gongsun Zan)#!\nAbout 30 days after the warlord era begins\nGongsun Zan decides to write, then Liu Bei decides\nOn alliance Liu Bei's camp moves to Gongsun Zan's capital"
 hd_hev_184_46_name:0 "Meeting Zilong"
 hd_hev_184_46_tt:0 "#high Meeting Zilong#!\nLiu Bei is allied with and camped in Gongsun Zan's land\nZhao Yun is at Gongsun Zan's court\nLiu Bei and Zhao Yun become friends"
 hd_hev_184_47_name:0 "An Old Friend Knocks (Zhao Yun Joins)"
 hd_hev_184_47_tt:0 "#high An Old Friend Knocks (Zhao Yun Joins)#!\nLiu Bei and Zhao Yun are friends\nZhao Yun is landless and leaves Gongsun Zan\nHe joins Liu Bei's court"
 hd_hev_184_48_name:0 "Tao Qian Holds Xu"
 hd_hev_184_48_tt:0 "#high Tao Qian Holds Xu#!\nAfter the Dong Zhuo chain\nIf Tao Qian lives he takes the Xu kingdom and its seat and becomes independent\nHe gains 3,000 Danyang troops"
 hd_hev_184_49_name:0 "Zang Ba Submits"
 hd_hev_184_49_tt:0 "#high Zang Ba Submits#!\nTao Qian holds Xu and the warlord era has begun\nZang Ba, if a minor independent lord, submits to Tao Qian\nTao Qian is notified"
 hd_hev_184_50_name:0 "Death at Mount Xian (Sun Jian)"
 hd_hev_184_50_tt:0 "#high Death at Mount Xian (Sun Jian)#!\nRandomly between 191.1 and 192.12 after the coalition disbands\nSun Jian has not broken away and Liu Biao is alive and free\nSun Jian attacks Liu Biao and dies in Huang Zu's ambush"
 hd_hev_184_51_name:0 "Yuan Shu Breaks Away"
 hd_hev_184_51_tt:0 "#high Yuan Shu Breaks Away#!\nYuan Shu holds Nanyang and the coalition has disbanded\nHe becomes independent\nHe gains claims on Yu and Yang and starts expanding into Yu"
 hd_hev_184_52_name:0 "Gongsun Zan Falls"
 hd_hev_184_52_tt:0 "#high Gongsun Zan Falls#!\nGongsun Zan loses his war for Ji\nHe kills himself and his vassals break away\nYuan Shao is notified"
 hd_hev_184_53_name:0 "Xu Is Secured (Tao Qian)"
 hd_hev_184_53_tt:0 "#high Xu Is Secured (Tao Qian)#!\nAfter Tao Qian takes Xu (the AI annexes automatically)\nAll de jure duchies of Xu belong to his camp\nTao Qian turns to defence"
 hd_hev_184_54_name:0 "Jing Is Secured (Liu Biao)"
 hd_hev_184_54_tt:0 "#high Jing Is Secured (Liu Biao)#!\nLiu Biao annexes Jing step by step\nAll de jure duchies of Jing belong to him or his vassals\nLiu Biao gains a defensive modifier"
 hd_hev_190_10_name:0 "On the Xu Road (Cao Song Murdered)"
 hd_hev_190_10_tt:0 "#high On the Xu Road (Cao Song Murdered)#!\nChecked every 90 days from 193.6.1; dropped once Tao Qian has entrusted Xu, any of the three is gone, or 200 arrives\nCao Cao is independent and landed, holds Yanzhou and borders Tao Qian's Xu\nCao Song is murdered; Cao Cao hates Tao Qian and gains pressed claims on his Xu commanderies\nA player Cao Cao may march at once or bide his time; other players are notified"
 hd_hev_184_55_name:0 "Tao Qian Invites Liu Bei to Xu"
 hd_hev_184_55_tt:0 "#high Tao Qian Invites Liu Bei to Xu#!\nCao Cao controls Yan plus Yu or Qing and threatens Xu\nTao Qian prepares and invites Liu Bei, who accepts\nThey ally and Liu Bei's camp moves into Xu"
 hd_hev_184_56_name:0 "The Mi Family Joins Liu Bei"
 hd_hev_184_56_tt:0 "#high The Mi Family Joins Liu Bei#!\nLiu Bei's camp or land is in Xu\nMi Zhu lives\nMi Zhu and Mi Fang join; option a also brings Lady Mi as his wife"
 hd_hev_184_57_name:0 "Tao Qian Entrusts Xu"
 hd_hev_184_57_tt:0 "#high Tao Qian Entrusts Xu#!\nAfter 194, Tao Qian is gravely ill (health 2 or less) and Liu Bei is still an adventurer\nTao Qian entrusts and Liu Bei accepts; both AI resolve at once\nLiu Bei takes all of Xu and Tao Qian dies"
 hd_hev_184_58_name:0 "Sun Ce Inherits"
 hd_hev_184_58_tt:0 "#high Sun Ce Inherits#!\n2 days after Sun Jian dies\nIf Sun Ce lives he inherits Sun Jian's titles, land and seal\nSun Ce is notified"
 hd_hev_184_59_name:0 "Sun Ce Leaves Yuan Shu and Crosses the River"
 hd_hev_184_59_tt:0 "#high Sun Ce Leaves Yuan Shu and Crosses the River#!\nSun Ce has inherited, is adult and free; Sun Jian is dead\nHe trades the seal for troops, leaves his estate and camps at Liyang as an adventurer\nHe gains a claim on Yang and troops"
 hd_hev_184_60_name:0 "Zhou Yu Joins"
 hd_hev_184_60_tt:0 "#high Zhou Yu Joins#!\nSun Ce has crossed and is independent\nZhou Yu is alive and free\nZhou Yu gives up his land and joins; Sun Ce gains 2,000 troops"
 hd_hev_184_61_name:0 "Pacifying Danyang and Jiangdong"
 hd_hev_184_61_tt:0 "#high Pacifying Danyang and Jiangdong#!\nSun Ce campaigns in Danyang after crossing\nAll counties of Danyang belong to him or his vassals\nHe then turns to Yang"
 hd_hev_190_12_name:0 "Lu Su Arrives"
 hd_hev_190_12_tt:0 "#high Lu Su Arrives#!\n198.6.1 (checked once)\nSun Ce (else Sun Quan) is alive and landed; Lu Su is an adult AI, landless, free and not in a player's court\nLu Su joins Sun Ce (else Sun Quan)'s court with +30 opinion\nA player lord receives A Scholar Arrives"
 hd_hev_184_62_name:0 "The Little Conqueror"
 hd_hev_184_62_tt:0 "#high The Little Conqueror#!\nSun Ce first gains a kingdom or higher title\nHe gains the nickname, prestige, dread and 3,000 troops\nOnce per lifetime"
 hd_hev_184_63_name:0 "Lü Bu Seeks Refuge"
 hd_hev_184_63_tt:0 "#high Lü Bu Seeks Refuge#!\nAfter 195, Liu Bei holds Xu\nLü Bu is a landless adventurer not at war with Liu Bei\nLü Bu asks and Liu Bei takes him in at Xiaopei"
 hd_hev_184_64_name:0 "Receiving the Emperor"
 hd_hev_184_64_tt:0 "#high Receiving the Emperor#!\nAfter 196, Cao Cao has over 10,000 troops and enough land and Liu Xie still reigns\nCao Cao may attack whoever holds the emperor\nOn victory he receives the emperor and takes over the court"
 hd_hev_184_65_name:0 "Xiapi Falls (Lü Bu Seizes Xu)"
 hd_hev_184_65_tt:0 "#high Xiapi Falls (Lü Bu Seizes Xu)#!\nLü Bu has stayed a year (needs the adventurer DLC)\nLü Bu decides and Liu Bei responds\nLü Bu takes all of Xu and Liu Bei is an adventurer at Xiaopei again"
 hd_hev_190_11_name:0 "Tu Gao Shall Replace Han / An Emperor at Shouchun (Yuan Shu Takes the Throne)"
 hd_hev_190_11_tt:0 "#high Tu Gao Shall Replace Han / An Emperor at Shouchun (Yuan Shu Takes the Throne)#!\nFrom 197.3.1, rechecked every 90 days up to 8 times\nYuan Shu is independent, landed and not yet emperor, holding part of Shouchun, Jiujiang or Huainan, or 30 counties\nAn AI Yuan Shu proclaims himself emperor; a player Yuan Shu chooses\nThe proclamation is announced to the world"
 hd_hev_184_66_name:0 "Liu Bei Goes South to Liu Biao"
 hd_hev_184_66_tt:0 "#high Liu Bei Goes South to Liu Biao#!\nLiu Bei wanders after losing Xu and Liu Biao holds Jing\nLiu Bei asks and Liu Biao accepts\nLiu Bei takes Xinye commandery (or another Jing commandery) as an independent tributary and ally of Liu Biao, with a 20-year truce; if none can be given, he camps at Liu Biao's capital as an ally"
 hd_hev_184_67_name:0 "Sun Jian Breaks Away (Fallback)"
 hd_hev_184_67_tt:0 "#high Sun Jian Breaks Away (Fallback)#!\nNon-historical fallback: Sun Jian lives to 200 without breaking away\nHe leaves his liege, sets up camp and gains a claim on Yang and 5,000 troops\nIf he holds the seal Yuan Shu and Liu Biao plot his death"
 hd_hev_184_68_name:0 "The Battle of Guandu"
 hd_hev_184_68_tt:0 "#high The Battle of Guandu#!\nCao and Yuan border each other with over 120 counties each, or it is 200\nCao Cao is invited to attack Yuan Shao\nThe battle begins (outcome in the next row)"
 hd_hev_184_69_name:0 "Victory at Guandu, Yuan Shao Despairs"
 hd_hev_184_69_tt:0 "#high Victory at Guandu, Yuan Shao Despairs#!\nCao Cao wins at Guandu\nHe takes the target duchy and claims on Yuan Shao's titles\nYuan Shao is badly wounded and despairs"
 hd_hev_184_70_name:0 "The Yuan Family Divides"
 hd_hev_184_70_tt:0 "#high The Yuan Family Divides#!\nYuan Shao dies after the defeat (with the split flag set)\nHis land is split between his adult sons\nThe sons are notified"
 hd_hev_184_71_name:0 "Sun Quan Succeeds His Brother"
 hd_hev_184_71_tt:0 "#high Sun Quan Succeeds His Brother#!\n2 days after Sun Ce dies (having inherited from Sun Jian)\nIf Sun Quan lives he takes Sun Ce's titles, claim and troops\nSun Quan is notified"
 hd_hev_184_72_name:0 "Three Visits to the Cottage (Longzhong Plan)"
 hd_hev_184_72_tt:0 "#high Three Visits to the Cottage (Longzhong Plan)#!\nAfter 201.7, Liu Bei has served Liu Biao for a year\nLiu Bei visits and a player Zhuge Liang may refuse\nZhuge Liang joins Liu Bei as a close friend"
 hd_hev_184_73_name:0 "An Envoy from Yi (Into Shu)"
 hd_hev_184_73_tt:0 "#high An Envoy from Yi (Into Shu)#!\nAfter 211, with the Longzhong plan done or skipped and Red Cliffs not underway\nLiu Bei breaks away if needed\nHe attacks the lord of Chengdu with reinforcements"
 hd_hev_184_74_name:0 "Before Chengdu (Liu Zhang Surrenders)"
 hd_hev_184_74_tt:0 "#high Before Chengdu (Liu Zhang Surrenders)#!\nThe Shu war ends with Chengdu held by Liu Bei or his vassal\nThe lord of Yi (a player may refuse) surrenders his land and joins Liu Bei\nLiu Bei moves his capital to Chengdu"
 # 汉代风味内容（2026-10-25）手工加行；生成器 build_data.py 未同步，勿直接重跑
 hd_hev_184_75_name:0 "Debasing the Wuzhu"
 hd_hev_184_75_tt:0 "#high Debasing the Wuzhu#!\nAfter the palace crisis, until 191.12.31\nDong Zhuo lives\nWorld notice; counties of Jingzhao, Fufeng and Pingyi suffer inflation for five years"
 hd_hev_184_76_name:0 "A Thousand Li of Grass (Ditty)"
 hd_hev_184_76_tt:0 "#high A Thousand Li of Grass (Ditty)#!\n190.9.1 – 191.5.20\nDong Zhuo is alive and regent\nWorld notice of the children's ditty"
 hd_hev_184_77_name:0 "The Death of Cai Yong"
 hd_hev_184_77_tt:0 "#high The Death of Cai Yong#!\nAfter Wang Yun kills Dong Zhuo, until 200.1.1\nCai Yong is alive and free and Wang Yun lives\nIf Cai Yong sighs he is jailed and dies 30 days later; a player may plead to finish the history"
 hd_hev_184_78_name:0 "Treatise on Cold Damage"
 hd_hev_184_78_tt:0 "#high Treatise on Cold Damage#!\n205.1.1 – 215.1.1\nZhang Ji (created at the 190 start) lives\nZhang Ji gains the Treatise artifact"
 hd_hev_long_01_name:0 "The Southern Xiongnu Settle in Bing"
 hd_hev_long_01_tt:0 "#high The Southern Xiongnu Settle in Bing#!\n188 – 226 (any year with random rules); historical or random rules only\nThe Xiuchuge revolt is settled or expired\nA yearly chance, certain from 216\nA Hu chief asks the lord of Pingyang or Taiyuan (or Xihe) for land"
 hd_hev_long_02_name:0 "The Wuhuan Move Inside"
 hd_hev_long_02_tt:0 "#high The Wuhuan Move Inside#!\n200 – 240; historical or random rules only\nA yearly chance, certain from 230\nQiuliju or Tadun (or a generated chief) asks the weakest neighbouring lord in You for land"
 hd_hev_long_03_name:0 "The Wudu Di Move to Guanzhong"
 hd_hev_long_03_tt:0 "#high The Wudu Di Move to Guanzhong#!\n200 – 250; historical or random rules only\nA yearly chance, certain from 240\nA Di chief asks the weaker lord of Fufeng or Tianshui for land"
 hd_hev_long_04_name:0 "Li Te Rises (Cheng)"
 hd_hev_long_04_tt:0 "#high Li Te Rises (Cheng)#!\nFrom 296, in a disorder, chaos or standoff phase\nLi Te (or Li Xiong) is adult, free and at peace\nThe AI rolls yearly; players may use the uprising decision\nThe rising takes Yi as Cheng"
 hd_hev_long_05_name:0 "Liu Yuan Rises (Han)"
 hd_hev_long_05_tt:0 "#high Liu Yuan Rises (Han)#!\nFrom 299, in a disorder phase\nLiu Yuan is adult and at peace\nThe AI rolls yearly; players may use the decision\nThe rising takes Bing as Han"
 hd_hev_long_06_name:0 "Shi Le Rises (Zhao)"
 hd_hev_long_06_tt:0 "#high Shi Le Rises (Zhao)#!\nFrom 305, in a disorder phase\nShi Le is adult and at peace\nThe AI rolls yearly; players may use the decision\nThe rising takes Ji as Zhao"
 hd_hev_long_07_name:0 "The Southern Migration Begins"
 hd_hev_long_07_tt:0 "#high The Southern Migration Begins#!\nThe Southern Migration rule is on\nThe north has two or more Hu powers (or one empire)\nAt least 50 northern counties have fallen\nChecked monthly (opened directly when Luoyang falls on the 304 line); announced worldwide"
 hd_hev_long_08_name:0 "The Liao Enter Shu"
 hd_hev_long_08_tt:0 "#high The Liao Enter Shu#!\nFrom 280 (any year with random rules), in a disorder phase\nAI: 10% yearly for a Liao chief near Ning or Ba (generated if needed) to attack Shu\nPlayer Liao rulers may use the major decision\nThe target is Yi"
 hd_hev_long_09_name:0 "Fu Hong Rises (Qin)"
 hd_hev_long_09_tt:0 "#high Fu Hong Rises (Qin)#!\nFrom 344, in a disorder phase\nFu Hong is adult and at peace\nThe AI rolls yearly; players may use the decision\nThe rising takes Sili as Qin"
 hd_hev_long_10_name:0 "Yao Yizhong Rises (Qin)"
 hd_hev_long_10_tt:0 "#high Yao Yizhong Rises (Qin)#!\nFrom 344, in a disorder phase\nYao Yizhong is adult and at peace\nThe AI rolls yearly; players may use the decision\nThe rising takes Sili based at Nan'an"
 hd_hev_long_11_name:0 "A Visitor from Afar (Qin Lun of Da Qin)"
 hd_hev_long_11_tt:0 "#high A Visitor from Afar (Qin Lun of Da Qin)#!\nAfter 226\nA ruler holding both the Yang kingdom and Changsha\nThe Roman Qin Lun visits and may join the court"
 hd_hev_218_01_name:0 "Men Fight, Women Haul (Hanzhong)"
 hd_hev_218_01_tt:0 "#high Men Fight, Women Haul (Hanzhong)#!\nOn the 218.1.1 start day Liu Bei attacks Xiahou Yuan for Hanzhong (border war)\nOn success Liu Bei gets another Hanzhong army and a levy bonus for 2 years\nCao and Liu get a 3-year truce; other players are notified on the first tick"
 hd_hev_218_02_name:0 "The Geng Ji Incident"
 hd_hev_218_02_tt:0 "#high The Geng Ji Incident#!\nBefore 218.3.1\nCao Cao is regent; Geng Ji (free) and Wang Bi live\nSent to Cao Cao: Wang Bi dies; the AI executes Geng Ji's faction, a player may imprison them"
 hd_hev_218_03_name:0 "Cao Zhang's Northern Campaign"
 hd_hev_218_03_tt:0 "#high Cao Zhang's Northern Campaign#!\nFrom 218.4.1 with Cao Cao and Cao Zhang alive\nNengchendi rebels with Dai if he holds it as Cao Cao's vassal\nSent to Cao Cao: the AI sends Cao Zhang, a player may pacify\nOn victory the north is declared settled"
 hd_hev_218_04_name:0 "Hou Yin Seizes Wan"
 hd_hev_218_04_tt:0 "#high Hou Yin Seizes Wan#!\nFrom 218.10.1 with Cao Cao landed\nHou Yin rebels if he holds Wan as Cao Cao's vassal\nSent to Cao Cao: the AI sends Cao Ren, a player may pacify"
 hd_hev_218_05_name:0 "Mount Dingjun"
 hd_hev_218_05_tt:0 "#high Mount Dingjun#!\nFrom 219.1.1 while the Hanzhong war goes on\nHuang Zhong and an AI Xiahou Yuan live\nSent to Liu Bei: Huang Zhong kills Xiahou Yuan; Shu morale up, Wei shaken for a year"
 hd_hev_218_06_name:0 "Hanzhong Changes Hands"
 hd_hev_218_06_tt:0 "#high Hanzhong Changes Hands#!\nLiu Bei wins the Hanzhong war (a white peace or invalidation counts; a player King of Wei is asked first)\nHanzhong, Shangyong, Fangling and Weixing go to the ruler of Shu\nAnnounced"
 hd_hev_218_07_name:0 "Guarding Hanzhong"
 hd_hev_218_07_tt:0 "#high Guarding Hanzhong#!\n3 days after Hanzhong changes hands\nWei Yan is alive, free and serves the ruler of Shu\nHanzhong is granted to Wei Yan as a direct vassal"
 hd_hev_218_08_name:0 "The Battle of Xiangfan"
 hd_hev_218_08_tt:0 "#high The Battle of Xiangfan#!\n4 months after Liu Bei takes Hanzhong\nGuan Yu holds Jing and Xiangyang is held by an enemy\nThe AI marches on Xiangyang (and Nanyang), a player may hold Jiangling; announced\nGuan Yu is lightly wounded in his first battle (leading to the bone scraping)"
 hd_hev_218_09_name:0 "Flooding the Seven Armies"
 hd_hev_218_09_tt:0 "#high Flooding the Seven Armies#!\nDuring Xiangfan, months 7 to 10\nGuan Yu, Yu Jin and Pang De live, the latter two with the defenders\nYu Jin is captured and Guan Yu's fame spreads for 3 years; the AI kills Pang De, a player may jail him"
 hd_hev_218_10_name:0 "Scraping the Bone"
 hd_hev_218_10_tt:0 "#high Scraping the Bone#!\nOnce, no date limit\nGuan Yu is alive, free and wounded; checked 7 days after his first Xiangfan battle\nIf Hua Tuo is dead or jailed a wandering Hua Tuo is created\nGuan Yu heals and gains prestige, influence and a 2-year modifier"
 hd_hev_218_11_name:0 "Cao Cao's Headaches"
 hd_hev_218_11_tt:0 "#high Cao Cao's Headaches#!\nFrom 219.9.1 while Cao Cao lives (5-year modifier)\nWorse after Guan Yu's death or on 220.3.1\nAn AI Cao Cao dies on 221.1.1 unless the surgery worked\nOnly a player Cao Cao sees the events"
 hd_hev_218_12_name:0 "Crossing in White (Sun Quan)"
 hd_hev_218_12_tt:0 "#high Crossing in White (Sun Quan)#!\nXiangfan has lasted 3 months\nGuan Yu and Lü Meng live and Sun Quan is independent\nSent to Sun Quan: the AI attacks Jing (Mi Fang and Shi Ren defect below 10 opinion), a player may wait\nAnnounced only if the war starts"
 hd_hev_218_13_name:0 "Grand Commander Lü Meng"
 hd_hev_218_13_tt:0 "#high Grand Commander Lü Meng#!\nFrom 219.10.1 before the crossing\nPath one: Liu Bei lost Hanzhong; path two: he holds it but Xiangfan is over or not fought by 220.6\nGuan Yu holds Jing, Lü Meng lives, Sun Quan is independent\nThe AI attacks; a player may keep the alliance (asked again a year later)"
 hd_hev_218_14_name:0 "Retreat to Maicheng (Guan Yu's Death)"
 hd_hev_218_14_tt:0 "#high Retreat to Maicheng (Guan Yu's Death)#!\nSun Quan wins the crossing war or captures Guan Yu\nGuan Yu and Sun Quan live\nThe AI executes Guan Yu (announced), a player may spare him"
 hd_hev_218_15_name:0 "Mourning Guan Yu"
 hd_hev_218_15_tt:0 "#high Mourning Guan Yu#!\nGuan Yu dies while Cao Cao lives\n10 days later Cao Cao buries him as a lord and gains prestige\nHis headaches worsen unless the surgery worked"
 hd_hev_218_33_name:0 "Liu Feng's Crime"
 hd_hev_218_33_tt:0 "#high Liu Feng's Crime#!\n10 days after Guan Yu dies\nLiu Feng lives and holds Shangyong as Liu Bei's vassal; Zhuge Liang serves Liu Bei\nSent to Liu Bei: the AI revokes his lands and has him die; a player may pardon him"
 hd_hev_zgl_01_name:0 "Opening the Chancellery"
 hd_hev_zgl_01_tt:0 "#high Opening the Chancellery#!\nAbout 30 days after Zhuge Liang takes charge (entrusted regent, chief minister or chancellor seat)\nZhuge Liang lives under the ruler of Shu\nHe gains the chancellery modifier, +200 merit and the Marquisate of Wuxiang; an adult Jiang Wan in Shu becomes his disciple\nStarts the timers for the later reforms and Li Yan's request; only a player Zhuge Liang sees the event"
 hd_hev_zgl_02_name:0 "Promoting Jiang Wan and Fei Yi"
 hd_hev_zgl_02_tt:0 "#high Promoting Jiang Wan and Fei Yi#!\nAfter the chancellery opens, checked every pulse\nJiang Wan, Fei Yi and Dong Yun are adults in Shu\nEach becomes Zhuge Liang's disciple; Jiang Wan joins the office with +200 merit and an AI ruler makes him steward\nNo event; players and AI alike"
 hd_hev_zgl_03_name:0 "Strict Teaching and Discipline"
 hd_hev_zgl_03_tt:0 "#high Strict Teaching and Discipline#!\n1 year after the chancellery opens, Zhuge Liang still in charge\nThe ruler of Shu gains a 10-year modifier\nA player ruler is notified"
 hd_hev_zgl_04_name:0 "The Eight Formations"
 hd_hev_zgl_04_tt:0 "#high The Eight Formations#!\n3 years after the chancellery opens, Zhuge Liang still in charge\nZhuge Liang himself gains a lifelong modifier\nA player Zhuge Liang is notified"
 hd_hev_zgl_05_name:0 "Zhuge's Repeating Crossbow"
 hd_hev_zgl_05_tt:0 "#high Zhuge's Repeating Crossbow#!\n5 years after the chancellery opens, Zhuge Liang still in charge\nThe ruler of Shu gains a 20-year modifier\nA player ruler is notified"
 hd_hev_zgl_06_name:0 "Embassy to Wu"
 hd_hev_zgl_06_tt:0 "#high Embassy to Wu#!\nAfter the chancellery opens; Fei Yi is 20 or older and in Shu\nThe ruler of Shu is allied with the holder of Jiangdong\nFei Yi gains +200 prestige and +150 merit and Wu warms to Shu; a player Fei Yi is notified"
 hd_hev_zgl_07_name:0 "Li Yan Seeks His Own Office"
 hd_hev_zgl_07_tt:0 "#high Li Yan Seeks His Own Office#!\n3 years after the chancellery (218 start: after Baidi), Zhuge Liang still in charge\nLi Yan lives in Shu\nSent to Zhuge Liang: the AI refuses (Li Yan resents it, half the time a rivalry)\nA player may grant him Ba (modifier for Li Yan, -100 influence for Zhuge Liang)"
 hd_hev_zgl_08_name:0 "The Ziwu Valley Gambit"
 hd_hev_zgl_08_tt:0 "#high The Ziwu Valley Gambit#!\nDuring the first northern campaign\nWei Yan lives in Shu\nSent to a player Zhuge Liang (else a player ruler): accepting gives 5,000 troops in Hanzhong\nThe AI declines and Wei Yan sulks for 10 years"
 hd_hev_zgl_09_name:0 "Jiang Boyue"
 hd_hev_zgl_09_tt:0 "#high Jiang Boyue#!\nJiang Wei is an adult in Shu (in 218 usually right after he submits)\nHe becomes Zhuge Liang's disciple with +150 merit\nThe ruler of Shu gets 3,000 Tiger Guards in Hanzhong; a player Zhuge Liang is notified"
 hd_hev_zgl_10_name:0 "Through San Pass Again (Hao Zhao at Chencang)"
 hd_hev_zgl_10_tt:0 "#high Through San Pass Again (Hao Zhao at Chencang)#!\n1 year after the previous campaign ends; Zhuge Liang in charge, Nanzhong at peace, no Shu-Wei war\nShu attacks Fufeng (skipped if already Shu's); the AI marches at once, a player may wait a year\nAfter 90 days a player ruler gets Hao Zhao Holds Chencang: press the siege or make white peace"
 hd_hev_zgl_11_name:0 "Taking Wudu and Yinping"
 hd_hev_zgl_11_tt:0 "#high Taking Wudu and Yinping#!\n1 year after the second campaign ends, same conditions\nShu attacks Wudu and Yinping; the AI marches at once, a player may wait a year\nVictory gives Zhuge Liang +300 prestige (restored as chancellor)"
 hd_hev_zgl_12_name:0 "Wei Yan and Yang Yi at Odds"
 hd_hev_zgl_12_tt:0 "#high Wei Yan and Yang Yi at Odds#!\nZhuge Liang in charge, Wei Yan and Yang Yi both in Shu\n30% a year, at most 3 times\nThe AI soothes both (+20 stress for Zhuge Liang); a player may favor one"
 hd_hev_zgl_13_name:0 "Supplies Fail (Li Yan Deposed)"
 hd_hev_zgl_13_tt:0 "#high Supplies Fail (Li Yan Deposed)#!\nZhuge Liang in charge and a Shu-Wei war has lasted 180 days\nLi Yan lives in Shu\nSent to Zhuge Liang: the AI strips Li Yan to commoner (lands taken, moved to court), announced; a player may forgive\nA player Li Yan also gets Reduced to Commoner"
 hd_hev_zgl_14_name:0 "Back to Qishan"
 hd_hev_zgl_14_tt:0 "#high Back to Qishan#!\n1 year after the third campaign ends, same conditions\nShu attacks Tianshui and Nan'an; the AI marches at once, a player may wait a year\nThe Wooden Ox comes with the war"
 hd_hev_zgl_15_name:0 "The Wooden Ox"
 hd_hev_zgl_15_tt:0 "#high The Wooden Ox#!\nWhen the Qishan campaign starts\nThe ruler of Shu gains a 10-year modifier\nA player ruler is notified"
 hd_hev_zgl_16_name:0 "Secret Memorial to the Emperor"
 hd_hev_zgl_16_tt:0 "#high Secret Memorial to the Emperor#!\nZhuge Liang is 50 or older and in charge\nThe AI names Jiang Wan as his successor (Fei Yi if Jiang Wan is absent)\nA player may name Jiang Wan, Fei Yi or no one"
 hd_hev_zgl_17_name:0 "Camping at Wuzhangyuan"
 hd_hev_zgl_17_tt:0 "#high Camping at Wuzhangyuan#!\n1 year after the fourth campaign ends, same conditions\nShu attacks Fufeng and Jingzhao; the AI marches at once, a player may wait a year\nThe Gliding Horse comes with the war, plus a 1-year farming modifier"
 hd_hev_zgl_18_name:0 "The Gliding Horse"
 hd_hev_zgl_18_tt:0 "#high The Gliding Horse#!\nWhen the Wuzhangyuan campaign starts\nThe ruler of Shu gains a 10-year modifier\nA player ruler is notified"
 hd_hev_zgl_19_name:0 "The Star Falls at Wuzhangyuan"
 hd_hev_zgl_19_tt:0 "#high The Star Falls at Wuzhangyuan#!\nZhuge Liang dies during a Shu-Wei war; first pulse after his death\nAn AI ruler makes white peace on every front; a player may withdraw or fight on; announced\nSima Yi, if still serving the Cao, loses 100 prestige and gains 10 stress"
 hd_hev_zgl_20_name:0 "Wei Yan's Revolt"
 hd_hev_zgl_20_tt:0 "#high Wei Yan's Revolt#!\nAfter Zhuge Liang dies, Wei Yan and Yang Yi are both in Shu\nAn AI Wei Yan is executed; announced\nA landed player Wei Yan may rise demanding independence, or swallow it (-100 prestige)"
 hd_hev_zgl_21_name:0 "The Last Memorial"
 hd_hev_zgl_21_tt:0 "#high The Last Memorial#!\nAfter Zhuge Liang dies; his named successor (else Jiang Wan, then Fei Yi) is in Shu and the ruler is landed\nThe AI makes him chancellor and chief minister with +300 merit; announced\nA player ruler may decline"
 hd_hev_zgl_22_name:0 "Death of Li Ping"
 hd_hev_zgl_22_tt:0 "#high Death of Li Ping#!\nAfter Zhuge Liang dies\nLi Yan still carries the commoner modifier, lives and is AI\nLi Yan dies of illness; no event"
 hd_hev_zgl_23_name:0 "Yang Yi's Resentment"
 hd_hev_zgl_23_tt:0 "#high Yang Yi's Resentment#!\n1 year after Wei Yan's revolt\nYang Yi is in Shu and AI\nHe gains a resentment modifier and is reduced to commoner; no event"
 hd_hev_zgl_24_name:0 "Fei Yi Takes Over"
 hd_hev_zgl_24_tt:0 "#high Fei Yi Takes Over#!\nAfter the last memorial was carried out, Jiang Wan dies\nFei Yi is in Shu and the ruler is AI\nFei Yi becomes chancellor and chief minister with +300 merit; announced"
 hd_hev_smy_01_name:0 "The Crown Prince's Four Friends"
 hd_hev_smy_01_tt:0 "#high The Crown Prince's Four Friends#!\n60 days after the chain starts\nCao Pi lives and is Cao Cao's heir or already landed\nSima Yi befriends Cao Pi with +100 merit; Chen Qun, if in Wei, befriends him too\nA player Sima Yi is notified"
 hd_hev_smy_02_name:0 "Appointed to the Secretariat"
 hd_hev_smy_02_tt:0 "#high Appointed to the Secretariat#!\nCao Pi has become emperor\nSima Yi is in Wei\nAn AI emperor appoints Sima Yi to the secretariat; a player emperor may not\nStarts the 3-year timer for the next step"
 hd_hev_smy_03_name:0 "General Who Pacifies the Army"
 hd_hev_smy_03_tt:0 "#high General Who Pacifies the Army#!\n3 years after the secretariat post, with a Cao emperor\nSima Yi is in Wei\nHe gains a 10-year modifier, +150 merit, Henei commandery and the Marquisate of Wuyang\nA player Sima Yi may decline (+100 prestige)"
 hd_hev_smy_04_name:0 "Entrusted by the Late Emperor"
 hd_hev_smy_04_tt:0 "#high Entrusted by the Late Emperor#!\nAfter Cao Pi dies, with a Cao emperor\nSima Yi is in Wei with the Pacifier modifier or merit level 5\nAn AI emperor names Sima Yi, Cao Zhen, Cao Xiu and Chen Qun regents (10-year modifier), +200 merit for Sima Yi; announced\nA player emperor may refuse"
 hd_hev_smy_05_name:0 "Commander of Yong and Liang"
 hd_hev_smy_05_tt:0 "#high Commander of Yong and Liang#!\nA Shu-Wei war is on, with a Cao emperor\nSima Yi is in Wei, landed and not regent; Cao Zhen is gone or the northern threat reaches 40\nHe gets Yong province as a military district, ten governors as vassals, and joins the war with event troops; announced\nA player emperor may defer a year; each campaign repelled later rewards him"
 hd_hev_smy_06_name:0 "Holding Fast (The Woman's Garments)"
 hd_hev_smy_06_tt:0 "#high Holding Fast (The Woman's Garments)#!\nA Shu-Wei war Sima Yi fights in has lasted 120 days (once per war)\nThe AI holds fast (1-year modifier, -50 prestige); a player may hold or seek battle\n30 days later, with Zhuge Liang in charge, he is sent women's garments: the AI endures it (+20 stress), a player may laugh it off"
 hd_hev_smy_07_name:0 "Campaign against Liaodong"
 hd_hev_smy_07_tt:0 "#high Campaign against Liaodong#!\nFrom 237.1.1; Cao emperor, Sima Yi in Wei, Gongsun Yuan landed and independent\nAn AI emperor wages an annexation war with Sima Yi and 40,000 extra troops; a player may wait a year\nIf Gongsun Yuan dies or loses his realm: +300 merit and +500 prestige for Sima Yi, announced; otherwise retried a year later"
 hd_hev_smy_08_name:0 "Cao Rui's Deathbed Charge"
 hd_hev_smy_08_tt:0 "#high Cao Rui's Deathbed Charge#!\nAfter Cao Rui dies; the Cao emperor is a minor\nCao Shuang is in Wei\nCao Shuang becomes chief minister and Sima Yi gets a 10-year regent modifier; Cao Shuang's dominance is checked 2 years later; no event"
 hd_hev_smy_09_name:0 "Cao Shuang Monopolizes Power"
 hd_hev_smy_09_tt:0 "#high Cao Shuang Monopolizes Power#!\nCao Shuang is the emperor's chief minister (2 years after the charge, or otherwise), Sima Yi in Wei\nSima Yi is made Grand Tutor and his military district is dissolved\nThe AI feigns illness (may strike after 2 years); a player may feign illness or become Cao Shuang's rival"
 hd_hev_smy_10_name:0 "The Gaopingling Incident"
 hd_hev_smy_10_tt:0 "#high The Gaopingling Incident#!\n2 years after feigning illness, Cao Shuang still chief minister\n10% each pulse\nThe AI strikes: Cao Shuang is executed (a player one is reduced to commoner) and Sima Yi becomes regent and chancellor; announced\nA player Sima Yi may wait another half year"
 hd_hev_smy_11_name:0 "Proposed Nine Bestowments"
 hd_hev_smy_11_tt:0 "#high Proposed Nine Bestowments#!\n1 year after Gaopingling, Sima Yi is regent\nThe AI declines (+200 prestige)\nA player may accept the Duchy of Jin (new realm of seven Bing commanderies) or decline"
 hd_hev_smy_12_name:0 "Elevated to King of Jin"
 hd_hev_smy_12_tt:0 "#high Elevated to King of Jin#!\n2 years after accepting the Duchy of Jin and still holding it (players only)\nHe may become King of Jin (a new empire-tier realm over the duchy) or decline (+100 prestige)\nAn AI Sima Yi declines the bestowments, so never reaches this"
 hd_hev_218_16_name:0 "The Proposed Surgery"
 hd_hev_218_16_tt:0 "#high The Proposed Surgery#!\nCao Cao's headaches have worsened and he lives\nHua Tuo is alive and free\nThe AI executes Hua Tuo; a player may operate (5% cure, 95% death) or send him away"
 hd_hev_218_17_name:0 "The New King of Wei"
 hd_hev_218_17_tt:0 "#high The New King of Wei#!\n3 days after Cao Cao dies (any cause)\nCao Pi lives\nCao Cao's titles and vassals pass to Cao Pi as King of Wei and regent; announced
190 start: carried on by the Sima Yi chain after Cao Cao dies (same node)"
 hd_hev_218_18_name:0 "Cao Pi Accepts the Abdication"
 hd_hev_218_18_tt:0 "#high Cao Pi Accepts the Abdication#!\n240 days after the succession\nCao Pi is alive, regent and at peace\nAIs complete it; a player Cao Pi may wait and a player Emperor Xian may refuse (twice, then he is deposed)\nCao Pi gains the seal and renames the realm Wei; announced"
 hd_hev_218_19_name:0 "Liu Bei Becomes Emperor"
 hd_hev_218_19_tt:0 "#high Liu Bei Becomes Emperor#!\nThe emperor is no longer of Emperor Xian's line\nLiu Bei is alive, independent and King of Hanzhong\nThe AI holds an enthronement and renames the realm Han (or simply becomes emperor after two years); a player may wait a year"
 hd_hev_218_20_name:0 "Zhang Fei Is Murdered"
 hd_hev_218_20_tt:0 "#high Zhang Fei Is Murdered#!\nFrom 221.6.1 after Liu Bei decides to become emperor\nZhang Fei is AI and Zhang Da lives\nZhang Da kills Zhang Fei and flees to Wu; announced"
 hd_hev_218_21_name:0 "The Battle of Yiling"
 hd_hev_218_21_tt:0 "#high The Battle of Yiling#!\nFrom 221.7.1; Guan Yu died at Wu's hands and Liu Bei rules Shu as emperor-elect\nSun Quan holds a commandery in Jing\nThe AI marches east on Nan; a player may heed advice (asked again a year later); announced"
 hd_hev_218_22_name:0 "Burning the Camps"
 hd_hev_218_22_tt:0 "#high Burning the Camps#!\nFrom 222.6.1 during Yiling\nLiu Bei is with the attackers and Lu Xun with the defenders\nShu is set back for a year, Lu Xun gains prestige; Feng Xi, Zhang Nan, Fu Rong and Cheng Ji die if present"
 hd_hev_218_23_name:0 "Entrusting the Heir at Baidi"
 hd_hev_218_23_tt:0 "#high Entrusting the Heir at Baidi#!\n3 days after Liu Bei dies\nThe new ruler is not Zhuge Liang, who is alive, free and in Yi\nZhuge Liang becomes chief minister with a 10-year regency modifier"
 hd_hev_218_24_name:0 "The Nanzhong Revolt"
 hd_hev_218_24_tt:0 "#high The Nanzhong Revolt#!\n2 months after Liu Bei dies\nAt least one of Yong Kai, Gao Ding and Zhu Bao is an AI Shu vassal\nThey break away and Meng Huo joins Yong Kai; announced"
 hd_hev_218_25_name:0 "The Chancellor Marches South"
 hd_hev_218_25_tt:0 "#high The Chancellor Marches South#!\nA year after the revolt with a rebel still independent\nZhuge Liang holds the regency\nThe AI opens a war on each rebel; a player may wait a year; announced"
 hd_hev_218_26_name:0 "Seven Captures of Meng Huo"
 hd_hev_218_26_tt:0 "#high Seven Captures of Meng Huo#!\nThe southern campaign was approved and no rebel is independent\nMeng Huo and the ruler of Shu live\nMeng Huo submits with +50 opinion of Zhuge Liang; announced"
 hd_hev_218_27_name:0 "The Memorial on the Expedition"
 hd_hev_218_27_tt:0 "#high The Memorial on the Expedition#!\n3 years after Liu Bei dies, with Zhuge Liang regent and the south pacified\nTianshui is held by a power independent of Shu\nThe AI marches north (Tianshui, Nan'an, Anding); a player may wait; announced
190 start: once the Zhuge Liang chain rules Shu, the south is pacified and Shu and Wei are at peace, the AI marches; a player may wait a year"
 hd_hev_218_28_name:0 "Jiang Wei Submits"
 hd_hev_218_28_tt:0 "#high Jiang Wei Submits#!\nDuring the northern campaign\nJiang Wei is alive, landless, free and not at the Shu court\nHe joins the Shu court"
 hd_hev_218_29_name:0 "The Loss of Jieting"
 hd_hev_218_29_tt:0 "#high The Loss of Jieting#!\n2 months into the northern campaign while it continues\nMa Su is with the Shu army\nShu is set back for a year; the AI usually executes Ma Su but may only dismiss him; announced"
 hd_hev_218_30_name:0 "Sun Quan Becomes Emperor"
 hd_hev_218_30_tt:0 "#high Sun Quan Becomes Emperor#!\nThe emperor is not a Liu; 2 years after the Shu enthronement, or 229.5.23 if Shu never crowned one\nSun Quan is independent as King of Wu and Liu Bei's side has no enthronement pending\nThe AI holds an enthronement and renames the realm Wu; a player may wait"
 # 汉代风味内容（2026-10-25）手工加行；生成器 build_data.py 未同步，勿直接重跑
 hd_hev_218_31_name:0 "Debate on Mutilating Punishments"
 hd_hev_218_31_tt:0 "#high Debate on Mutilating Punishments#!\n218.6.1 – 219.12.31\nCao Cao lives\nCao Cao chooses: restore them (Chen Qun) or not (Wang Lang)"
 hd_hev_218_32_name:0 "Cao Pi's Final Instructions"
 hd_hev_218_32_tt:0 "#high Cao Pi's Final Instructions#!\nTwo years after the abdication, until 230.1.1\nCao Pi lives\nHe writes his instructions and frugal burial gains an extra line"
 hd_hev_253_01_name:0 "Jiang Wei Strikes at Taoxi"
 hd_hev_253_01_tt:0 "#high Jiang Wei Strikes at Taoxi#!\nOn the 253 start day (after the lobby)\nJiang Wei holds Liang, is at peace and Taoxi is held by a vassal under Cao Fang\nJiang Wei attacks Taoxi and the world is notified\nNot in the 218 or 263 starts"
 hd_hev_253_02_name:0 "Zhuge Ke Besieges Xincheng"
 hd_hev_253_02_tt:0 "#high Zhuge Ke Besieges Xincheng#!\nOn the 253 start day\nZhuge Ke and Guanqiu Jian are landed and Hefei belongs to Guanqiu Jian or his liege\nWu's Zhuge Ke attacks for Hefei with 20,000 extra troops\n253 start only"
 hd_hev_253_03_name:0 "Sun Jun's Banquet (Zhuge Ke Killed)"
 hd_hev_253_03_tt:0 "#high Sun Jun's Banquet (Zhuge Ke Killed)#!\nFrom 253.10.1 after the Xincheng war\nZhuge Ke is alive and at peace; Sun Jun is free\nAn AI Zhuge Ke attends and dies; a player may stay away\nThe 218 relay also needs Zhuge Ke as chief minister of an AI Wu emperor"
 hd_hev_253_04_name:0 "Sima Shi Deposes the Emperor"
 hd_hev_253_04_tt:0 "#high Sima Shi Deposes the Emperor#!\nFrom 254.10.1\nSima Shi is regent, Cao Fang reigns, Cao Mao is in Wei\nSent to Sima Shi (or to a player Cao Fang if Sima Shi is AI)\nCao Fang is deposed for Cao Mao after Xiahou Xuan is executed"
 hd_hev_253_05_name:0 "The Huainan Uprising (Guanqiu Jian, Wen Qin)"
 hd_hev_253_05_tt:0 "#high The Huainan Uprising (Guanqiu Jian, Wen Qin)#!\nFrom 255.2.1\nGuanqiu Jian is a landed vassal under the emperor and at peace\nAn AI rises in a war of independence with 15,000 extra; a player may wait\nThe 218 relay also needs Sima rule and a direct vassal"
 hd_hev_253_06_name:0 "Sima Shi Dies"
 hd_hev_253_06_tt:0 "#high Sima Shi Dies#!\nFrom 255.3.1 while an AI Sima Shi is regent and Sima Zhao is a landed vassal\nAfter the deposition and Huainan (or by 255.12.1); by 257.1.1 without a deposition\nSima Shi dies and the world is notified"
 hd_hev_253_07_name:0 "Sima Zhao Succeeds His Brother"
 hd_hev_253_07_tt:0 "#high Sima Zhao Succeeds His Brother#!\n3 days after Sima Shi dies as regent\nA player emperor or a player Sima Zhao decides; AIs proceed\nSima Zhao must be a landed vassal of the emperor"
 hd_hev_253_08_name:0 "Zhuge Dan Rises at Shouchun"
 hd_hev_253_08_tt:0 "#high Zhuge Dan Rises at Shouchun#!\nFrom 257.6.1\nZhuge Dan is a landed vassal under the emperor and at peace\nAn AI rises with 15,000 extra; an AI Wu emperor sends help, a player one is asked\nThe 218 relay also needs Sima rule and a direct vassal"
 hd_hev_253_09_name:0 "The South Gate Incident"
 hd_hev_253_09_tt:0 "#high The South Gate Incident#!\nFrom 260.6.1\nCao Mao reigns and Sima Zhao (or Sima Shi) is regent\nAn AI Cao Mao leads his guard out and is killed by Cheng Ji, Cao Huan is enthroned; a player may endure\nA player regent chooses to kill or depose"
 hd_hev_253_10_name:0 "Wei Invades Shu"
 hd_hev_253_10_tt:0 "#high Wei Invades Shu#!\n253 path: 263.9.1 – 268.1.1 with Sima Shi or Sima Zhao as regent and the Han emperor independent and at peace; a player emperor may refuse; up to 3 attempts\n263 path: attack at once after the start, one retry before 264.1.16\nThe Wei emperor attacks Han with Zhong Hui and Deng Ai"
 hd_hev_263_01_name:0 "Sima Zhao Becomes Duke of Jin"
 hd_hev_263_01_tt:0 "#high Sima Zhao Becomes Duke of Jin#!\nFrom 263.11.18\nSima Zhao is a landed regent and Cao Huan reigns\nA player Sima Zhao may decline and a player emperor may refuse\nA new Jin duchy (Bing) is created; a kingdom wraps it later and merges into the crown after the abdication"
 hd_hev_263_02_name:0 "Shu Han Surrenders"
 hd_hev_263_02_tt:0 "#high Shu Han Surrenders#!\nAbout 60 days into the Shu war with 50 warscore, or once Fu, Mianzhu, Luo or Chengdu falls, or after victory (fallbacks on 264.1.16, or 120 days in relays)\nAn AI Han emperor surrenders, a player may fight on\nJiang Wei submits to Zhong Hui and Yi goes to Deng Ai"
 hd_hev_263_03_name:0 "Deng Ai Is Arrested"
 hd_hev_263_03_tt:0 "#high Deng Ai Is Arrested#!\nAbout 30 days after the surrender\nDeng Ai holds Yi, Zhong Hui is landed and both serve the emperor\nPlayers Zhong Hui, Sima Zhao and Deng Ai are asked in turn; deadline 264.6.1 (150 days in relays)\nDeng Ai and Deng Zhong are imprisoned by Zhong Hui"
 hd_hev_263_04_name:0 "Zhong Hui's Revolt"
 hd_hev_263_04_tt:0 "#high Zhong Hui's Revolt#!\nAbout 30 days after Deng Ai's arrest\nZhong Hui holds Yi as a vassal at peace; deadline 264.9.1 (240 days in relays)\nAn AI Zhong Hui fails at once and dies with Jiang Wei\nA player Zhong Hui may truly rebel and a player Jiang Wei may try to restore Han"
 hd_hev_263_05_name:0 "Sima Zhao Becomes King of Jin"
 hd_hev_263_05_tt:0 "#high Sima Zhao Becomes King of Jin#!\nFrom 264.5.2 as Duke of Jin\nSima Zhao lives and still holds Jin\nA player may decline\nHis style becomes king and Wei starts the Xianxi era"
 hd_hev_263_06_name:0 "The King of Jin Dies (Sima Yan Succeeds)"
 hd_hev_263_06_tt:0 "#high The King of Jin Dies (Sima Yan Succeeds)#!\nAn AI Sima Zhao dies on 265.9.6 (relays wait for the Shu war, by 269.1.1); any other death also counts\n3 days later Sima Yan becomes King of Jin and regent\nA player emperor or a player Sima Yan is asked"
 hd_hev_263_07_name:0 "Wei Abdicates to Jin"
 hd_hev_263_07_tt:0 "#high Wei Abdicates to Jin#!\nFrom 266.2.8 (relays wait for the Shu war, by 269.6.1)\nCao Huan reigns and the regent is Sima Yan (or a living player Sima Zhao)\nA player recipient may decline and a player Cao Huan may refuse\nThe realm becomes Jin and the Taishi era begins"
 hd_hev_263_08_name:0 "Duke of Anle"
 hd_hev_263_08_tt:0 "#high Duke of Anle#!\n90 days after the ruler of Shu surrenders\nThe former ruler lives and is not the emperor\nHe and his children move to Luoyang as courtiers and he is made Duke of Anle; announced\nIf the peerage cannot be granted, he only moves to Luoyang"
 hd_hev_263_09_name:0 "The Royal Army Invades Wu"
 hd_hev_263_09_tt:0 "#high The Royal Army Invades Wu#!\n279.11.1 to 290.1.1; emperor and Wu ruler both landed, Wu independent and not at war with him\nAn AI emperor wages an annexation war (victory takes all of Wu); Du Yu and Wang Jun each bring 15,000 troops; announced\nA player emperor may wait a year; if Wu survives the war, retried a year later"
 hd_hev_263_10_name:0 "The Fall of Wu (Marquis Guiming)"
 hd_hev_263_10_tt:0 "#high The Fall of Wu (Marquis Guiming)#!\nThe war ends with the Wu ruler alive but landless\nAn AI Wu ruler surrenders, moves to Luoyang with his children and is made Marquis Guiming; announced\nA player Wu ruler may surrender or refuse"
 # 两晋十六国统一史实线（304–421）：F-1 手工维护（2026-10-27）；英文见 localization/english/zz_tr_hd_hev_l_english.yml，键一一对应
 # 西晋末·八王之乱与永嘉之乱（304–317；304 开局适用）
 hd_hev_j16_xiqian_name:0 "Zhang Fang Takes the Emperor West"
 hd_hev_j16_xiqian_tt:0 "#high Zhang Fang Takes the Emperor West#!\nWindow 304.11.25 – 305.3.1\nSima Yong is regent (or holds Jingzhao), Zhang Fang is at his court, the capital is still Luoyang\nAn AI Yong moves the court to Chang'an; a player Yong may keep it in Luoyang"
 hd_hev_j16_yingjia_name:0 "The Prince of Donghai Calls to Rescue the Emperor"
 hd_hev_j16_yingjia_tt:0 "#high The Prince of Donghai Calls to Rescue the Emperor#!\nWindow 305.7.1 – 306.6.1\nSima Yue is alive and independent (tributaries count) and not at war with the emperor; the capital is not Luoyang, or Yong is regent\nAn AI Yue raises troops (the emperor is the nominal defender; the winner only changes the regent, no land changes hands); a player Yue may wait\nLit when the war starts"
 hd_hev_j16_situ_name:0 "Wen Xian Becomes Minister of the Masses"
 hd_hev_j16_situ_tt:0 "#high Wen Xian Becomes Minister of the Masses#!\nWindow 305.7.1 – 306.12.31\nWang Rong is dead and the emperor lives; the Minister of the Masses is not Wen Xian (vacant, held by the emperor, or by another AI); Wen Xian lives, is landless and not imprisoned\nWen Xian joins the emperor's court as Minister of the Masses; skipped if the emperor or Wen Xian is a player"
 hd_hev_j16_gongshi_name:0 "Gongshi Fan and Ji Sang Rise"
 hd_hev_j16_gongshi_tt:0 "#high Gongshi Fan and Ji Sang Rise#!\nWindow 305.8.1 – 306.12.1\nSima Ying has lost Ye or is landless; Shi Le, Gongshi Fan and Ji Sang are alive\nAn AI Shi Le joins Gongshi Fan; a player Shi Le may go his own way"
 hd_hev_j16_zongshe_name:0 "Yilu Unites the Three Tuoba Divisions"
 hd_hev_j16_zongshe_tt:0 "#high Yilu Unites the Three Tuoba Divisions#!\nWindow 305.8.1 – 308.12.31\nYituo and Luguan are gone; Yilu is alive and free\nEach tick, at most one of the three Tuoba commanderies held by another AI Tuoba passes to Yilu"
 hd_hev_j16_xuchang_name:0 "The Battle of Xuchang"
 hd_hev_j16_xuchang_tt:0 "#high The Battle of Xuchang#!\nWindow 305.10.1 – 306.3.1\nLiu Qiao and Sima Xiao are alive, Xiao holds Yingchuan, the rescue war has begun\nAn AI Liu Qiao sides with Yong and attacks Xiao; a player Liu Qiao may stay neutral"
 hd_hev_j16_zhangfang_name:0 "Yong Sacrifices Zhang Fang"
 hd_hev_j16_zhangfang_tt:0 "#high Yong Sacrifices Zhang Fang#!\nWindow 306.1.1 – 306.6.1\nZhang Fang is at Yong's court and the rescue war has lasted 90 days\nAn AI Yong kills Zhang Fang to sue for peace; a player Yong may spare him and keep his 8,000 troops"
 hd_hev_j16_wangmi_name:0 "Wang Mi Rises and Joins Han"
 hd_hev_j16_wangmi_tt:0 "#high Wang Mi Rises and Joins Han#!\nWindow 306.3.1 – 308.6.1\nWang Mi is alive and landless; a Han ruler (independent Xiongnu Liu holding Bing) exists\nAn AI Wang Mi joins the Han court and Han gains 5,000 troops; a player Wang Mi may stay with Jin"
 hd_hev_j16_huanluo_name:0 "The Emperor Returns to Luoyang"
 hd_hev_j16_huanluo_tt:0 "#high The Emperor Returns to Luoyang#!\nWindow 306.4.1 – 307.6.1\nYue is not yet regent; Yue won the rescue war, or holds Chang'an, or Yong is dead or out of power\nYue becomes regent and the capital returns to Luoyang; a player Yue may keep the court at Chang'an"
 hd_hev_j16_lixiong_emperor_name:0 "Li Xiong Proclaims Himself Emperor"
 hd_hev_j16_lixiong_emperor_tt:0 "#high Li Xiong Proclaims Himself Emperor#!\nWindow 306.6.1 – 307.6.1\nLi Xiong is independent, free and holds Shu Commandery\nAn AI Li Xiong becomes emperor of Cheng and Fan Changsheng joins as chancellor; a player may remain king"
 hd_hev_j16_yingsi_name:0 "The Death of Sima Ying"
 hd_hev_j16_yingsi_tt:0 "#high The Death of Sima Ying#!\nWindow 306.9.1 – 306.12.31\nYing is landless or imprisoned; Liu Yu is alive\nAn AI Ying is forced to die by Liu Yu's forged edict; a player Ying may accept or flee to Shi Le"
 hd_hev_j16_huaidi_name:0 "Emperor Hui Dies, Emperor Huai Succeeds"
 hd_hev_j16_huaidi_tt:0 "#high Emperor Hui Dies, Emperor Huai Succeeds#!\nWindow 306.11.1 – 308.4.1\nAn AI Emperor Hui restores Sima Chi as heir; Chi succeeds when Hui dies\nLit when Chi holds the realm and the era becomes Yongjia (the deaths of Yong and Tan are handled by the same node)"
 hd_hev_j16_qinwang_name:0 "Zhang Gui Sends Beigong Chun to Aid the Throne"
 hd_hev_j16_qinwang_tt:0 "#high Zhang Gui Sends Beigong Chun to Aid the Throne#!\nWindows 307.1.1 – 309.12.31 and 311.1.1 – 311.6.1\nZhang Gui holds Liang and serves the emperor; the emperor is the main defender in a war\nAn AI Zhang Gui sends 100 gold, joins the defence and adds Beigong Chun's 3,000 men; a player may stay home"
 hd_hev_j16_poye_name:0 "Ji Sang Sacks Ye"
 hd_hev_j16_poye_tt:0 "#high Ji Sang Sacks Ye#!\nWindow 307.3.1 – 307.12.31\nSima Teng holds Wei Commandery or a county in Ji; Ji Sang's employer is landed\nThe employer attacks Ye with 8,000 troops; on victory Teng is killed and the palace of Ye burns\nLit when the war starts"
 hd_hev_j16_zhuisang_name:0 "Gou Xi Crushes Ji Sang"
 hd_hev_j16_zhuisang_tt:0 "#high Gou Xi Crushes Ji Sang#!\nWindow 307.7.1 – 308.3.1\nThe attackers took Ye; Gou Xi is at Yue's court or landed; Ji Sang lives\nAn AI Yue sends Gou Xi with 12,000 men; on victory Ji Sang dies and Dong Commandery goes to Gou Xi\nLit when the war starts"
 hd_hev_304_01_name:0 "Garrisoning Jianye"
 hd_hev_304_01_tt:0 "#high Garrisoning Jianye#!\nWindow 307.9.1 – 312.1.1\nThe emperor is a Henei Sima; Sima Rui is alive and a subject; Danyang lies within the emperor's realm\nThe emperor gets an event (AI follows history); on approval Sima Rui takes Danyang and moves to Jianye. Lit on the historical choice"
 hd_hev_304_02_name:0 "Shi Le Joins Liu Yuan"
 hd_hev_304_02_tt:0 "#high Shi Le Joins Liu Yuan#!\nWindow 307.10.1 – 309.1.1\nThe Battle of Daling has begun or ended; a Han ruler reigns; Shi Le is adult, free and outside Han\nShi Le gets an event; a player Han ruler decides whether to accept him. Lit on the historical choice"
 hd_hev_j16_zhangbin_name:0 "Zhang Bin Joins Shi Le"
 hd_hev_j16_zhangbin_tt:0 "#high Zhang Bin Joins Shi Le#!\nWindow 308.1.1 – 311.12.31\nShi Le is landed and Zhang Bin alive\nZhang Bin joins Shi Le as chancellor and Shi Le gains the Gentlemen's Camp for 30 years; no choices"
 hd_hev_304_03_name:0 "Liu Yuan Proclaims Himself Emperor"
 hd_hev_304_03_tt:0 "#high Liu Yuan Proclaims Himself Emperor#!\nWindow 308.11.1 – 310.8.1\nLiu Yuan is independent, free and has a primary title\nLiu Yuan gets an event: become emperor, change the era to Yongfeng and move to Pingyang; he may decline. Lit on the historical choice"
 hd_hev_j16_duanbu_name:0 "Strife in the Duan Tribe"
 hd_hev_j16_duanbu_tt:0 "#high Strife in the Duan Tribe#!\nWindow 309.1.1 – 325.12.31\nThe Duan chieftains pass Wuwuchen → Jiluojuan → Shefuchen → Mobo; deaths come from the death table\nThe node sets heirs step by step; lit when Mobo kills Shefuchen and seizes power"
 hd_hev_j16_qingjun_name:0 "Yue Purges the Court"
 hd_hev_j16_qingjun_tt:0 "#high Yue Purges the Court#!\nWindow 309.3.1 – 309.12.31\nYue is regent, Emperor Huai holds the realm, Miao Bo is alive\nAn AI Yue executes Miao Bo and Miao Yin and becomes Overbearing for 5 years; a player Yue may spare them"
 hd_hev_j16_daigong_name:0 "Yilu Becomes Duke of Dai"
 hd_hev_j16_daigong_tt:0 "#high Yilu Becomes Duke of Dai#!\nWindow 310.1.1 – 315.6.1\nYilu is independent, free and holds a Tuoba commandery\nHe founds Dai as a duke; an AI Liu Kun allies with him"
 hd_hev_j16_qu_hanzhong_name:0 "Luo Shang Dies, Cheng Eyes Hanzhong"
 hd_hev_j16_qu_hanzhong_tt:0 "#high Luo Shang Dies, Cheng Eyes Hanzhong#!\nWindow 310.7.20 – 315.12.31\nLuo Shang is dead; Li Xiong is landed\nAn AI Li Xiong gains claims on Ba and Hanzhong; a player may refuse"
 hd_hev_j16_chutun_name:0 "Yue Marches Out, a Secret Edict for Gou Xi"
 hd_hev_j16_chutun_tt:0 "#high Yue Marches Out, a Secret Edict for Gou Xi#!\nWindow 310.11.1 – 311.4.23\nYue is regent; Shi Le and Gou Xi are landed\nYue moves to Chen; an AI emperor sends Gou Xi a secret edict; no choices"
 hd_hev_j16_ningping_name:0 "The Battle of Ningping"
 hd_hev_j16_ningping_tt:0 "#high The Battle of Ningping#!\nWindow 311.4.23 – 311.7.1\nYue is dead, Shi Le is landed and free, Wang Yan alive\nAn AI Shi Le intercepts: +1,000 prestige and 5,000 troops, Wang Yan and Sima Pi are executed; a player may let them pass"
 hd_hev_304_04_name:0 "The Siege of Luoyang (Yongjia Disaster)"
 hd_hev_304_04_tt:0 "#high The Siege of Luoyang (Yongjia Disaster)#!\nWindow 311.5.1 – 313.1.1\nLiu Cong's succession is settled; the Han ruler is free and borders the emperor's realm (or holds Hedong, Pingyang, Henei, Hongnong, Xingyang or Ji); Luoyang still belongs to the emperor\nAn AI Han ruler attacks Henan and Songshan (a player may decline); if Han takes Luoyang and the emperor is AI, he is captured and the Southern Migration begins. Lit when the war starts\nAlso: from 311 to 322 a yearly check starts the Southern Migration if Luoyang falls to a Hu realm"
 hd_hev_j16_daiwang_name:0 "Yilu Becomes King of Dai"
 hd_hev_j16_daiwang_tt:0 "#high Yilu Becomes King of Dai#!\nFrom 315.3.1 until 315.6.1\nAlready Duke of Dai; Yilu is still independent and landed\nHis style becomes king"
 hd_hev_j16_gebei_name:0 "Retreat from Gepi to Xiangguo"
 hd_hev_j16_gebei_tt:0 "#high Retreat from Gepi to Xiangguo#!\nWindow 312.2.1 – 312.12.31\nShi Le is landed but holds no county in Ji\nAn AI goes north to Xiangguo (claim and 5,000 troops); a player may march on Jianye instead (troops only)"
 hd_hev_j16_mindi_name:0 "Emperor Min Enthroned at Chang'an"
 hd_hev_j16_mindi_tt:0 "#high Emperor Min Enthroned at Chang'an#!\nWindow 312.9.1 – 313.8.1\nEmperor Huai is dead or a Hu prisoner; Sima Ye lives; Chang'an is not held by Hu\nSima Ye joins the lord of Chang'an and is made heir; if Chang'an is lost he goes to Sima Rui and this row stays unlit"
 hd_hev_j16_zuti_name:0 "Zu Ti's Northern Expedition"
 hd_hev_j16_zuti_tt:0 "#high Zu Ti's Northern Expedition#!\nWindow 313.8.1 – 321.11.22\nZu Ti serves Jin and Hu hold a county in Yu\nOnce: 2,000 troops and a claim on a Hu-held county in Yu"
 hd_hev_j16_jicheng_name:0 "The Seizure of Ji and Wang Jun"
 hd_hev_j16_jicheng_tt:0 "#high The Seizure of Ji and Wang Jun#!\nWindow 314.1.1 – 314.6.1\nWang Jun holds a county in You and Shi Le one in Ji, and they border\nAn AI Shi Le feigns surrender and strikes Ji with 8,000 men while Wang Jun is Credulous; a player may refrain\nLit when the war starts"
 hd_hev_j16_liuyi_fei_name:0 "The Deposition of Liu Yi"
 hd_hev_j16_liuyi_fei_tt:0 "#high The Deposition of Liu Yi#!\nWindow 314.1.1 – 317.5.29\nLiu Cong rules Han; Liu Yi and Liu Can live\nAn AI Liu Cong makes Liu Can heir; Liu Yi dies in 317 via the death table"
 hd_hev_j16_zhangshi_heir_name:0 "Zhang Gui Dies, Zhang Shi Succeeds"
 hd_hev_j16_zhangshi_heir_tt:0 "#high Zhang Gui Dies, Zhang Shi Succeeds#!\nWindow 314.3.1 – 314.6.1\nZhang Gui and Zhang Shi live\nZhang Gui names Zhang Shi heir (Zhang Gui dies 314.6.1)"
 hd_hev_j16_liuxiu_name:0 "The Revolt of Liuxiu"
 hd_hev_j16_liuxiu_tt:0 "#high The Revolt of Liuxiu#!\nWindow 316.3.1 – 316.6.30\nYilu lives; deaths come from the death table\nYilu names Pugen heir, then Pugen names Yulü; lit when Yilu dies inside the window"
 hd_hev_j16_changan316_name:0 "Liu Yao Takes Chang'an, Western Jin Falls"
 hd_hev_j16_changan316_tt:0 "#high Liu Yao Takes Chang'an, Western Jin Falls#!\nWindow 316.6.1 – 317.3.1\nEmperor Min holds the realm and Chang'an; Liu Yao is landed under the Xiongnu Liu and Han holds Pingyang or Hedong\nLiu Yao attacks Jingzhao with 20,000 men; a player may decline\nLit when the war starts"
 hd_hev_j16_bingzhou316_name:0 "Bing Falls, Liu Kun Flees to the Duan"
 hd_hev_j16_bingzhou316_tt:0 "#high Bing Falls, Liu Kun Flees to the Duan#!\nWindow 316.10.1 – 317.6.1\nLiu Kun holds a county in Bing; Shi Le is landed and they border\nShi Le attacks Liu Kun's capital commandery with 8,000 men; on victory Liu Kun flees to Duan Pidi\nLit when the war starts"
 # 东晋初·二赵相争（317–346；304 开局适用）
 hd_hev_j16_tuyuhun3_name:0 "Three Generations of Tuyuhun"
 hd_hev_j16_tuyuhun3_tt:0 "#high Three Generations of Tuyuhun#!\nWindow 316.11.2 – 329.12.31\nTuyuhun → Tuyan → Yeyan; deaths come from the death table\nThe node sets each heir in turn; lit once Tuyan is dead and Yeyan holds land"
 hd_hev_j16_daitong_name:0 "The Succession of Dai to Shiyijian"
 hd_hev_j16_daitong_tt:0 "#high The Succession of Dai to Shiyijian#!\nWindow 317.1.1 – 338.12.31\nYulü → Henou → Hena → Yihuai → Shiyijian; deaths come from the death table\nThe node sets each heir; Shiyijian becomes King of Dai and starts the Jianguo era"
 hd_hev_j16_jinwang_name:0 "Sima Rui Becomes King of Jin"
 hd_hev_j16_jinwang_tt:0 "#high Sima Rui Becomes King of Jin#!\nWindow 317.3.1 – 317.12.31\nNo free Jin emperor sits on the throne (vacant, not a Sima, or a Hu prisoner); Sima Rui lives\nSima Rui takes the title King of Jin"
 hd_hev_j16_jinjian_name:0 "Eastern Jin Is Founded"
 hd_hev_j16_jinjian_tt:0 "#high Eastern Jin Is Founded#!\nWindow 318.2.7 – 318.12.31\nRui is King of Jin; the captive emperor is dead; Rui is alive and free\nIf Rui already holds the realm nothing moves; if it is vacant or in Hu hands it passes to him; no choices"
 hd_hev_j16_baowang_name:0 "Sima Bao Styles Himself King of Jin at Shanggui"
 hd_hev_j16_baowang_tt:0 "#high Sima Bao Styles Himself King of Jin at Shanggui#!\nWindow 318.3.1 – 320.6.1\nEmperor Min is dead; Sima Bao is independent and holds Tianshui or a county in it\nHis realm is renamed Jin with the style of king"
 hd_hev_j16_jinzhun_name:0 "The Coup of Jin Zhun"
 hd_hev_j16_jinzhun_tt:0 "#high The Coup of Jin Zhun#!\nWindow 318.8.31 – 318.11.1\nLiu Cong is dead; Jin Zhun is at the Han court or a vassal\nJin Zhun takes over the Han realm (titles and vassals only, no one is killed on the spot) as Heavenly King; Liu Can dies via the death table; no choices"
 hd_hev_j16_liuyao_ji_name:0 "Liu Yao Takes the Throne"
 hd_hev_j16_liuyao_ji_tt:0 "#high Liu Yao Takes the Throne#!\nWindow 318.10.1 – 319.3.1\nJin Zhun's coup has happened (or Han has left the Xiongnu Liu); Liu Yao holds a county in Sili\nLiu Yao becomes independent with 15,000 troops and a claim on Bing; Shi Le gains a claim on Pingyang"
 hd_hev_j16_murong_jicheng_name:0 "Jicheng Breaks the Three-Realm Coalition"
 hd_hev_j16_murong_jicheng_tt:0 "#high Jicheng Breaks the Three-Realm Coalition#!\nWindow 319.1.1 – 319.12.31\nAn AI Murong Hui holds Changli and is defending in a war\nHui gains 8,000 troops at his capital; skipped if Hui is a player"
 hd_hev_j16_qianzhao_name:0 "Zhao Replaces Han at Chang'an"
 hd_hev_j16_qianzhao_tt:0 "#high Zhao Replaces Han at Chang'an#!\nWindow 319.6.1 – 320.6.1\nLiu Yao is independent and holds Jingzhao or Chang'an\nThe realm becomes Zhao under an emperor, the capital moves to Chang'an and Liu Xi is made heir; a player may keep the name Han"
 hd_hev_j16_shile_wang_name:0 "Shi Le Becomes King of Zhao"
 hd_hev_j16_shile_wang_tt:0 "#high Shi Le Becomes King of Zhao#!\nWindow 319.11.1 – 320.12.31\nHan has changed hands; Shi Le holds Xiangguo or at least 12 counties in Ji\nShi Le becomes independent as King of Zhao; a player may stay loyal to Han"
 hd_hev_j16_xizheng_name:0 "Liu Yao Marches West"
 hd_hev_j16_xizheng_tt:0 "#high Liu Yao Marches West#!\nWindow 320.1.1 – 324.1.1\nLiu Yao and Zhang Mao are independent and landed; Zhang Mao pays him no tribute\nAn AI Zhang Mao becomes Liu Yao's tributary; a player may refuse"
 hd_hev_j16_duanpidi_name:0 "The End of Duan Pidi and Shao Xu"
 hd_hev_j16_duanpidi_tt:0 "#high The End of Duan Pidi and Shao Xu#!\nWindow 320.1.1 – 321.12.31\nDuan Pidi is landed and borders Shi Le\nShi Le attacks Pidi's capital commandery (Shi Hu brings 8,000); a player may decline\nLit when the war starts"
 hd_hev_j16_zhangmao_heir_name:0 "Zhang Shi Is Murdered, Zhang Mao Succeeds"
 hd_hev_j16_zhangmao_heir_tt:0 "#high Zhang Shi Is Murdered, Zhang Mao Succeeds#!\nWindow 320.4.1 – 320.7.1\nZhang Shi and Zhang Mao live\nZhang Shi names his brother Zhang Mao heir (Zhang Shi is murdered by Yan Sha on 320.7.15)"
 hd_hev_j16_wangdun1_name:0 "Wang Dun's First Rebellion"
 hd_hev_j16_wangdun1_tt:0 "#high Wang Dun's First Rebellion#!\nWindow 322.1.1 – 322.7.1\nWang Dun is Emperor Yuan's direct vassal holding a county in Jing or Yang; Liu Wei (or Diao Xie) lives\nAn AI Wang Dun rises to purge the court with 10,000 troops; a player may hold back\nLit when the war starts"
 hd_hev_j16_mingdi_name:0 "Emperor Yuan Dies, Emperor Ming Succeeds"
 hd_hev_j16_mingdi_tt:0 "#high Emperor Yuan Dies, Emperor Ming Succeeds#!\nWindow 322.11.1 – 323.1.3\nEmperor Yuan holds the realm; Sima Shao lives\nAn AI Emperor Yuan names Shao heir; Yuan dies on 323.1.3"
 hd_hev_j16_liangwang_name:0 "Zhang Jun Succeeds and Styles Himself King of Liang"
 hd_hev_j16_liangwang_tt:0 "#high Zhang Jun Succeeds and Styles Himself King of Liang#!\nWindow 324.3.1 – 346.6.1\nZhang Mao names Zhang Jun heir (324); from 345 Zhang Jun holds Liang\nLit when Zhang Jun takes the royal style"
 hd_hev_j16_wangdun2_name:0 "Wang Dun's Second Rebellion"
 hd_hev_j16_wangdun2_tt:0 "#high Wang Dun's Second Rebellion#!\nWindow 324.5.1 – 324.10.1\nEmperor Ming holds the realm; Wang Dun is landed in his realm\nAn AI Emperor Ming attacks with 10,000 men after Wang Dun loses the regency and breaks away; a player may endure\nLit when the war starts"
 hd_hev_j16_yuliang_name:0 "The Yu Family in Power"
 hd_hev_j16_yuliang_tt:0 "#high The Yu Family in Power#!\nWindow 325.8.18 – 326.6.1\nEmperor Ming names Sima Yan heir; Emperor Cheng succeeds while Yu Liang lives\nYu Liang becomes Director of the Secretariat; no choices"
 hd_hev_j16_sujun_name:0 "The Rebellion of Su Jun and Zu Yue"
 hd_hev_j16_sujun_tt:0 "#high The Rebellion of Su Jun and Zu Yue#!\nWindow 327.10.1 – 329.3.1\nSu Jun is landed within Jin; Yu Liang lives\nAn AI Su Jun marches on Jiankang with 8,000 men, Zu Yue joins him and Tao Kan leads the loyalists; a player may hold back\nLit when the war starts"
 hd_hev_j16_luoyang328_name:0 "The Battle of Luoyang (328)"
 hd_hev_j16_luoyang328_tt:0 "#high The Battle of Luoyang (328)#!\nWindow 328.7.1 – 329.2.1\nLiu Yao and Shi Le are independent, landed and neighbours\nShi Le relieves Luoyang (15,000 vs 10,000); on victory Liu Yao is captured; a player may decline\nLit when the war starts"
 hd_hev_j16_shanggui329_name:0 "The Fall of Former Zhao"
 hd_hev_j16_shanggui329_tt:0 "#high The Fall of Former Zhao#!\nWindow 329.1.1 – 329.10.1\nLiu Yao is dead or captive; Liu Xi or Liu Yin holds land; Shi Hu is landed\nShi Hu attacks Tianshui with 15,000 men and a claim\nLit when the war starts"
 hd_hev_j16_shile_emperor_name:0 "Shi Le Proclaims Himself Emperor"
 hd_hev_j16_shile_emperor_tt:0 "#high Shi Le Proclaims Himself Emperor#!\nWindow 330.2.1 – 330.12.31\nFormer Zhao is gone (or Shi Le holds two kingdoms) and Shi Le is independent\nHe becomes emperor (a player may choose Heavenly King; both count), the era becomes Jianping and Shi Hong is made heir"
 hd_hev_j16_murongren_name:0 "The Revolt of Murong Ren"
 hd_hev_j16_murongren_tt:0 "#high The Revolt of Murong Ren#!\nWindow 333.4.13 – 336.2.17\nMurong Hui names Huang heir; after Hui dies Murong Ren holds Liaodong but is not independent\nLit when Murong Ren rises; later Huang gains 8,000 troops while fighting him (crossing the ice)"
 hd_hev_j16_shihu_zhuan_name:0 "Shi Hu Takes Control"
 hd_hev_j16_shihu_zhuan_tt:0 "#high Shi Hu Takes Control#!\nWindow 333.8.17 – 334.3.1\nShi Le is dead; Shi Hong is independent; Shi Hu is landed in his realm\nShi Hu dominates the court for 5 years as chancellor; Shi Sheng gains 5,000 troops and a claim; no choices"
 hd_hev_j16_xidiqiang_name:0 "Shi Hu Resettles the Di and Qiang"
 hd_hev_j16_xidiqiang_tt:0 "#high Shi Hu Resettles the Di and Qiang#!\nWindow 333.10.1 – 335.12.31\nShi Hu rules independently; Fu Hong or Yao Yizhong lives\nThe AI chiefs become Shi Hu's vassals, or join his court if landless"
 hd_hev_j16_jingzhen_name:0 "The Command of Jing Changes Hands"
 hd_hev_j16_jingzhen_tt:0 "#high The Command of Jing Changes Hands#!\nStep one 334.6.1 – 340.2.1, step two 340.1.1 – 345.7.1\nThe previous commander is dead and the successor serves the Jin emperor\nThe commandery of Jiangling passes to the successor (an AI emperor grants it, a player may keep it); lit when step one resolves"
 hd_hev_j16_liqi_name:0 "Li Qi Seizes the Throne"
 hd_hev_j16_liqi_tt:0 "#high Li Qi Seizes the Throne#!\nWindow 334.6.1 – 335.3.1\nLi Xiong names Li Ban heir; after Li Ban is killed the ruler of Cheng is not Li Qi\nLi Qi takes the throne; Li Ban's death comes from the death table"
 hd_hev_j16_shihu_fei_name:0 "Shi Hu Deposes Shi Hong"
 hd_hev_j16_shihu_fei_tt:0 "#high Shi Hu Deposes Shi Hong#!\nWindow 334.11.1 – 335.6.1\nShi Hu already dominates (or has half the strength); Shi Hong is independent and landed\nShi Hu takes all of Hong's titles as Heavenly King, starts the Jianwu era and moves to Ye; no choices"
 hd_hev_j16_shisui_name:0 "Shi Sui Dies, Shi Xuan Becomes Heir"
 hd_hev_j16_shisui_tt:0 "#high Shi Sui Dies, Shi Xuan Becomes Heir#!\nWindow 337.8.1 – 337.10.1\nShi Hu is landed; Shi Sui and Shi Xuan live\nAn AI Shi Hu makes Shi Xuan heir; Shi Sui is executed in 337 via the death table"
 hd_hev_j16_yanwang_name:0 "Murong Huang Becomes King of Yan"
 hd_hev_j16_yanwang_tt:0 "#high Murong Huang Becomes King of Yan#!\nWindow 337.10.1 – 338.6.1\nMurong Huang is independent, free and holds Changli\nHe founds Yan as king; a player may decline"
 hd_hev_j16_duanliao_name:0 "The Fall of Duan Liao"
 hd_hev_j16_duanliao_tt:0 "#high The Fall of Duan Liao#!\nWindow 338.1.1 – 339.6.1\nDuan Liao is landed and borders Shi Hu or Murong Huang\nThe attacker strikes his capital commandery (Zhao 20,000, Yan 8,000); a player attacker may decline\nLit when the war starts"
 hd_hev_j16_lishou_name:0 "Li Shou Deposes Li Qi and Renames the State Han"
 hd_hev_j16_lishou_tt:0 "#high Li Shou Deposes Li Qi and Renames the State Han#!\nWindow 338.4.1 – 338.12.31\nLi Qi is an independent AI; Li Shou is adult and holds Hanzhong land or Fucheng\nAn AI Li Shou takes the throne and renames the realm Han under an emperor"
 hd_hev_j16_chengkang_name:0 "The Successions of Emperors Cheng and Kang"
 hd_hev_j16_chengkang_tt:0 "#high The Successions of Emperors Cheng and Kang#!\nWindow 342.5.1 – 345.3.1\nEmperor Cheng names Sima Yue heir, then Emperor Kang names Sima Dan\nLit once Emperor Mu succeeds; He Chong becomes Director of the Secretariat"
 hd_hev_j16_lishi_heir_name:0 "Li Shi Succeeds"
 hd_hev_j16_lishi_heir_tt:0 "#high Li Shi Succeeds#!\nWindow 343.6.1 – 343.8.30\nLi Shou and Li Shi live\nLi Shou names Li Shi heir (Li Shou dies 343.8.30)"
 hd_hev_j16_yuwen344_name:0 "The Destruction of the Yuwen"
 hd_hev_j16_yuwen344_tt:0 "#high The Destruction of the Yuwen#!\nWindow 344.1.1 – 345.6.1\nMurong Huang holds Changli and Yidougui holds Yuwen; they are not at war\nAn AI Huang attacks Yuwen with 15,000 men; a player may decline\nLit when the war starts"
 hd_hev_j16_huanwen_jing_name:0 "Huan Wen Takes Command of Jing"
 hd_hev_j16_huanwen_jing_tt:0 "#high Huan Wen Takes Command of Jing#!\nWindow 345.7.1 – 346.12.9\nYu Yi is dead; Huan Wen serves the Jin emperor\nThe commandery of Jiangling passes to Huan Wen (same rules as the Jing command row)"
 # 后赵崩解与秦燕并起（346–370；304、346 开局适用）
 hd_hev_j16_maqiu_name:0 "Ma Qiu at the Border"
 hd_hev_j16_maqiu_tt:0 "#high Ma Qiu at the Border#!\nWindow 346.5.1 – 347.12.31 (the 346 start fights on the first tick)\nLiang and Zhao rulers exist and Jincheng is held by an AI in Zhao's realm\nThe lord of Jincheng attacks Liang in a border war for Fuhan\nLit when the war starts"
 hd_hev_346_01_name:0 "Cheng Han Falls (Huan Wen Conquers Shu)"
 hd_hev_346_01_tt:0 "#high Cheng Han Falls (Huan Wen Conquers Shu)#!\nWindow 346.11.1 – 348.1.1\nHuan Wen is landed and serves the Jin emperor; an independent Li ruler of Yi exists\nHuan Wen invades Shu with Sima Xun, Zhou Fu and Yuan Qiao\nLit when the conquest succeeds: the Shu empire is abolished and Li Shi is sent to Jiankang"
 hd_hev_j16_yuesi_name:0 "Son of Liu Yueshi"
 hd_hev_j16_yuesi_tt:0 "#high Son of Liu Yueshi#!\nWindow 346.12.10 – 347.6.1\nLiu Qun lives\nLiu Qun gains the Son of Yueshi modifier and the Jin emperor's goodwill"
 hd_hev_j16_lxuan_qiuliu_name:0 "Stay or Go After Cheng Han"
 hd_hev_j16_lxuan_qiuliu_tt:0 "#high Stay or Go After Cheng Han#!\nFrom the end of the Shu war to 348.12.31\nCheng Han is no longer independent; Liu Xuan lives\nAn AI Liu Xuan stays in Shu; a player may follow Huan Wen to Jiankang or choose otherwise"
 hd_hev_j16_maqiu2_name:0 "The Second Battle of Fuhan"
 hd_hev_j16_maqiu2_tt:0 "#high The Second Battle of Fuhan#!\nWindow 347.3.1 – 347.12.31\nMa Qiu's war did not end in a Zhao victory; Ma Qiu lives and Shi Hu rules Zhao\nIf the war goes on the attacker gets 10,000 more; otherwise a new war starts with 20,000"
 hd_hev_j16_qiuchi_fanchen_name:0 "Yang Chu Chooses Jin"
 hd_hev_j16_qiuchi_fanchen_tt:0 "#high Yang Chu Chooses Jin#!\nWindow 347.3.1 – 352.12.31\nYang Chu is independent; Shu has fallen or Shi Hu is dead\nAn AI Yang Chu sides with Jin (modifier only, no change of liege); a player may side with Zhao or stand alone"
 hd_hev_j16_xieai_chan_name:0 "Xie Ai Is Slandered"
 hd_hev_j16_xieai_chan_tt:0 "#high Xie Ai Is Slandered#!\nWindow 347.6.1 – 352.12.31\nThe second Fuhan war is over; Xie Ai is at the Liang court and Zhang Zuo lives\nAn AI ruler sends Xie Ai to govern Jiuquan; a player may keep him at court (affecting Zhang Zuo's coup)"
 hd_hev_j16_donggong_name:0 "The Eastern Palace Affair"
 hd_hev_j16_donggong_tt:0 "#high The Eastern Palace Affair#!\nWindow 348.7.1 – 349.3.1\nShi Hu rules Zhao; Shi Xuan and Shi Tao live\nShi Xuan kills Shi Tao; Shi Hu executes Xuan and names Shi Shi heir (a player Shi Hu may choose otherwise)"
 hd_hev_j16_shihu_di_name:0 "Shi Hu Proclaims Himself Emperor"
 hd_hev_j16_shihu_di_tt:0 "#high Shi Hu Proclaims Himself Emperor#!\nWindow 349.1.1 – 349.4.30\nShi Hu rules Zhao and is not yet emperor\nHe becomes emperor and starts the Taining era; a player may remain Heavenly King"
 hd_hev_j16_licheng_name:0 "The Uprising at Licheng"
 hd_hev_j16_licheng_tt:0 "#high The Uprising at Licheng#!\nWindow 349.5.27 – 349.9.1\nShi Shi rules Zhao; Shi Zun is within the realm\nAn AI Shi Zun takes the throne with Ran Min commanding; Shi Shi, Zhang Chai and Empress Dowager Liu die via the death table"
 hd_hev_j16_shichong_name:0 "Shi Chong Rises at Ji"
 hd_hev_j16_shichong_tt:0 "#high Shi Chong Rises at Ji#!\nWindow 349.6.1 – 349.10.1\nThe Licheng uprising has happened; Shi Chong holds Guangyang\nAn AI Shi Chong breaks away and attacks Ye (10,000 vs 15,000); a player may submit\nLit when the war starts"
 hd_hev_j16_chupou_name:0 "Chu Pou's Northern Expedition"
 hd_hev_j16_chupou_tt:0 "#high Chu Pou's Northern Expedition#!\nWindow 349.6.1 – 349.12.1\nShi Hu is dead; Chu Pou is a landed Jin vassal bordering Zhao\nChu Pou attacks Pengcheng or Xiapi with 10,000 men; a player may decline\nLit when the war starts"
 hd_hev_j16_liuqun_zhandui_name:0 "Liu Qun Chooses a Side"
 hd_hev_j16_liuqun_zhandui_tt:0 "#high Liu Qun Chooses a Side#!\nWindow 349.6.1 – 350.12.31\nShi Hu is dead; Liu Qun is a landed vassal of the Shi\nAn AI Liu Qun joins Ran Wei once it exists; a player may join Wei or Jin, stand alone, or stay with Zhao"
 hd_hev_j16_liang_jiawang_name:0 "Zhang Chonghua Styles Himself King of Liang"
 hd_hev_j16_liang_jiawang_tt:0 "#high Zhang Chonghua Styles Himself King of Liang#!\nWindow 349.6.1 – 350.12.31\nZhang Chonghua rules Liang without a royal style; Shi Hu is dead\nHe takes the royal style and loses 10 opinion with the Jin emperor; a player may stay Duke of Xiping"
 hd_hev_j16_shijian_name:0 "Shi Jian Kills Shi Zun"
 hd_hev_j16_shijian_tt:0 "#high Shi Jian Kills Shi Zun#!\nWindow 349.11.1 – 350.1.31\nShi Zun rules Zhao; Shi Jian is within the realm\nAn AI Shi Jian takes the throne and Ran Min holds the ruler hostage; with a player Shi Zun a civil war may start"
 hd_hev_j16_shahu_name:0 "The Edict to Kill the Hu"
 hd_hev_j16_shahu_tt:0 "#high The Edict to Kill the Hu#!\nWindow 349.12.1 – 350.3.1\nShi Jian has killed Shi Zun and is an AI; Ran Min is within the realm\nRan Min issues the edict (15,000 troops) and Fu Hong and Yao Yizhong break away; a player Ran Min may only punish Sun Fudu"
 hd_hev_j16_sanqin_name:0 "Fu Hong Becomes King of the Three Qins"
 hd_hev_j16_sanqin_tt:0 "#high Fu Hong Becomes King of the Three Qins#!\nWindow 350.1.1 – 350.6.1\nFu Hong is independent and landed\nHe founds Qin as king; a player may submit to Jin"
 hd_hev_346_02_name:0 "Ran Min Kills Shi Jian and Becomes Emperor"
 hd_hev_346_02_tt:0 "#high Ran Min Kills Shi Jian and Becomes Emperor#!\nWindow 350.2.1 – 352.1.1\nShi Hu is dead and the edict has been settled; Ran Min is adult, free; Ye is still held by the Shi and Later Zhao exists\nRan Min gets an event: kill Shi Jian, take Wei and become emperor of Wei. Lit on the historical choice"
 hd_hev_j16_zhaobeng_name:0 "The Collapse of Later Zhao"
 hd_hev_j16_zhaobeng_tt:0 "#high The Collapse of Later Zhao#!\nChecked right after Ran Min kills Shi Jian\nIf the Zhao ruler is an AI, Shi Zhi succeeds him; Ji and Si stay with Zhao, while in each of the other seven provinces one commandery governor breaks away as provincial lord and the other governors there swear to him (Duan Kan excepted)\nA player Zhao ruler keeps his primary title; the rest still falls apart"
 hd_hev_j16_cangting350_name:0 "Ran Min Attacks Zhao (Battle of Cangting)"
 hd_hev_j16_cangting350_tt:0 "#high Ran Min Attacks Zhao (Battle of Cangting)#!\nWindow 350.4.1 – 350.12.31\nLater Zhao has collapsed; the Ran Wei ruler borders the Zhao ruler and they are at peace\nWei attacks one Zhao commandery on its border (not Xiangguo) with 10,000 extra troops; a player may decline\nLit when the war starts"
 hd_hev_346_04_name:0 "Yan Marches South"
 hd_hev_346_04_tt:0 "#high Yan Marches South#!\nWindow 350.2.1 – 356.1.1\nShi Hu is dead and Later Zhao is in chaos; the Murong ruler of Ping is independent and at peace; You is not his\nThe Yan ruler attacks the lord of You. Lit when the war starts"
 hd_hev_j16_shizhi_name:0 "Shi Zhi Proclaims Himself Emperor at Xiangguo"
 hd_hev_j16_shizhi_tt:0 "#high Shi Zhi Proclaims Himself Emperor at Xiangguo#!\nWindow 350.3.1 – 350.12.31\nRan Min is emperor; a Shi holds Xiangguo\nThe holder becomes independent emperor of Zhao and loose Shi lords join him"
 hd_hev_346_03_name:0 "Fu Jian Enters Guanzhong"
 hd_hev_346_03_tt:0 "#high Fu Jian Enters Guanzhong#!\nWindow 350.6.1 – 353.1.1\nFu Hong is dead and Fu Jian lives; Jingzhao is held by neither Jin nor Fu Jian; the full version needs a landed Fu clan and a masterless Guanzhong\nFu Jian gets an event: take five commanderies of Guanzhong as Heavenly King of Qin (reduced if conditions fall short). Lit on the historical choice"
 hd_hev_j16_duankan_name:0 "Duan Kan Holds Guanggu"
 hd_hev_j16_duankan_tt:0 "#high Duan Kan Holds Guanggu#!\nWindow 350.6.1 – 351.12.31\nDuan Kan is landed but not independent; Later Zhao is in chaos\nAn AI Duan Kan becomes independent King of Qi; a player may stay with Zhao"
 hd_hev_j16_liuqun_qin_name:0 "Liu Qun and the Coming of Qin"
 hd_hev_j16_liuqun_qin_tt:0 "#high Liu Qun and the Coming of Qin#!\nWindow 350.8.1 – 352.6.1\nFu Jian has entered Guanzhong; Liu Qun is landed, outside Qin and borders it\nAn AI Liu Qun waits for the Qin director; only a player Liu Qun choosing to submit or resist lights this row"
 hd_hev_j16_xiangguo351_name:0 "The Battle of Xiangguo"
 hd_hev_j16_xiangguo351_tt:0 "#high The Battle of Xiangguo#!\nWindow 351.1.1 – 351.10.1\nThe Ran Wei ruler borders Shi Zhi and they are at peace\nWei besieges Xiangguo; Yan and Yao Yizhong help Zhao (Shi Zhi gets 15,000); if Wei wins Shi Zhi dies; a player may decline\nLit when the war starts"
 hd_hev_j16_liuxian_coup_name:0 "Liu Xian Murders Shi Zhi"
 hd_hev_j16_liuxian_coup_tt:0 "#high Liu Xian Murders Shi Zhi#!\nWindow 351.3.1 – 351.12.31\nWei did not win at Xiangguo; Shi Zhi is an independent AI and Liu Xian is in his court or realm\nLiu Xian takes the throne and submits to Wei"
 hd_hev_j16_jiandi_name:0 "Fu Jian Proclaims Himself Emperor"
 hd_hev_j16_jiandi_tt:0 "#high Fu Jian Proclaims Himself Emperor#!\nWindow 352.1.1 – 352.12.31\nFu Jian rules Qin and is not yet emperor\nHe becomes emperor and starts the Huangshi era; a player may remain Heavenly King"
 hd_hev_j16_liuxian_name:0 "Ran Min Destroys Liu Xian"
 hd_hev_j16_liuxian_tt:0 "#high Ran Min Destroys Liu Xian#!\nWindow 352.1.1 – 352.6.1\nLiu Xian has killed Shi Zhi, is landed and borders Wei\nWei attacks him; on victory Liu Xian dies and Xiangguo goes to Wei; a player may decline\nLit when the war starts"
 hd_hev_j16_liantai_name:0 "The Battle of Liantai"
 hd_hev_j16_liantai_tt:0 "#high The Battle of Liantai#!\nWindow 352.2.1 – 352.12.31\nYan and Wei border each other with no truce and no war\nYan sends Murong Ke against Zhongshan or Changshan (15,000); on victory Ran Min dies; a player may decline\nLit when the war starts"
 hd_hev_j16_yaoxiang_fujin_name:0 "Yao Xiang Turns to Jin"
 hd_hev_j16_yaoxiang_fujin_tt:0 "#high Yao Xiang Turns to Jin#!\nWindow 352.3.1 – 352.12.31\nYao Yizhong is dead; Yao Xiang is independent and landed\nAn AI Yao Xiang acknowledges Jin and gains a claim on Qiao; a player may stand alone"
 hd_hev_j16_longli_name:0 "Liang Attacks Qin (Defeat at Longli)"
 hd_hev_j16_longli_tt:0 "#high Liang Attacks Qin (Defeat at Longli)#!\nWindow 352.3.1 – 352.12.31\nQin and Liang border in Tianshui\nAn AI Liang ruler attacks with a 50% chance (border war); a player may decline\nLit when the war starts"
 hd_hev_j16_xicheng_name:0 "Yang Chu Raids Xicheng"
 hd_hev_j16_xicheng_tt:0 "#high Yang Chu Raids Xicheng#!\nWindow 352.3.1 – 353.6.1\nYang Chu is landed and borders Qin\nAn AI attacks with a 50% chance (border war, 3,000 troops); a player may decline\nLit when the war starts"
 hd_hev_j16_yinhao_name:0 "Yin Hao's Northern Expedition"
 hd_hev_j16_yinhao_tt:0 "#high Yin Hao's Northern Expedition#!\nWindow 352.6.1 – 353.12.31\nYin Hao is a landed Jin vassal at peace\nYin Hao attacks Yingchuan or Henan with 10,000 men, joined by Xun Xian; a player may decline\nLit when the war starts"
 hd_hev_j16_yecheng352_name:0 "Yan Takes Ye, Ran Wei Falls"
 hd_hev_j16_yecheng352_tt:0 "#high Yan Takes Ye, Ran Wei Falls#!\nFrom 30 days after Liantai to 353.6.1\nThe Wei ruler still holds Wei Commandery and borders Yan\nYan besieges Ye (a player Wei ruler may surrender)\nLit when the war starts"
 hd_hev_j16_yandi_name:0 "Murong Jun Proclaims Himself Emperor"
 hd_hev_j16_yandi_tt:0 "#high Murong Jun Proclaims Himself Emperor#!\nWindow 352.11.1 – 353.12.31\nThe Yan ruler is independent with at least 12 counties in Ji and You and is not yet emperor\nHe becomes emperor and starts the Yuanxi era; a player may remain king"
 hd_hev_j16_shansang_name:0 "Yao Xiang Betrays Jin at Shansang"
 hd_hev_j16_shansang_tt:0 "#high Yao Xiang Betrays Jin at Shansang#!\nWindow 353.9.1 – 354.6.1\nYin Hao's expedition has begun; Yao Xiang is landed\nIf the war is on, an AI Yao Xiang turns on Yin Hao with 8,000 men; if it is over he only gains a claim on Henan"
 hd_hev_j16_zhangzuo_name:0 "Zhang Zuo Usurps Liang"
 hd_hev_j16_zhangzuo_tt:0 "#high Zhang Zuo Usurps Liang#!\nWindow 353.9.1 – 355.2.1\nZhang Chonghua is dead, Zhang Yaoling rules, Zhang Zuo is in the realm\nZhang Zuo seizes power (Yaoling and Xie Ai die via the death table); skipped if Xie Ai serves as regent"
 hd_hev_j16_yinhao_fei_name:0 "Yin Hao Is Dismissed"
 hd_hev_j16_yinhao_fei_tt:0 "#high Yin Hao Is Dismissed#!\nFrom Yin Hao's defeat to 354.6.1\nYin Hao lives and there is an emperor\nThe emperor takes back Yang and Huan Wen gains overall command; a player Yin Hao may refuse"
 hd_hev_j16_zhangzuo_wang_name:0 "Zhang Zuo Becomes King of Liang"
 hd_hev_j16_zhangzuo_wang_tt:0 "#high Zhang Zuo Becomes King of Liang#!\nWindow 354.1.1 – 354.12.31\nZhang Zuo rules Liang\nHe becomes king, gains Debauched Tyrant for 10 years and starts the Heping era; a player may decline"
 hd_hev_j16_huanqin354_name:0 "Huan Wen Attacks Qin"
 hd_hev_j16_huanqin354_tt:0 "#high Huan Wen Attacks Qin#!\nWindow 354.2.1 – 354.10.1\nHuan Wen is landed and at peace; Qin borders Jin\nHuan Wen attacks Jingzhao or Shangluo (15,000 vs 10,000); a player may decline\nLit when the war starts"
 hd_hev_j16_liangshiwang_name:0 "The Assassination of Yang Chu"
 hd_hev_j16_liangshiwang_tt:0 "#high The Assassination of Yang Chu#!\nWindow 355.1.1 – 355.12.31\nYang Chu lives and Yang Songnu is in Qiuchi\nBoth deaths go to the death table and Yang Guo becomes heir"
 hd_hev_j16_zhangguan_name:0 "Zhang Guan Overthrows Zhang Zuo"
 hd_hev_j16_zhangguan_tt:0 "#high Zhang Guan Overthrows Zhang Zuo#!\nWindow 355.6.1 – 356.6.1\nZhang Zuo rules; Zhang Guan is landed in Liang\nZhang Zuo dies, Zhang Xuanjing takes the throne and Zhang Guan dominates; a player Zhang Zuo faces a civil war"
 hd_hev_346_05_name:0 "Huan Wen's Northern Expedition"
 hd_hev_346_05_tt:0 "#high Huan Wen's Northern Expedition#!\nWindow 356.1.1 – 362.1.1\nHuan Wen's Qin campaign is over; the emperor is a Henei Sima; Huan Wen is a Jin vassal at peace; Luoyang is not Jin's\nHuan Wen gets an event and marches on Henan. Lit when the war starts"
 hd_hev_j16_guanggu_name:0 "The Siege of Guanggu"
 hd_hev_j16_guanggu_tt:0 "#high The Siege of Guanggu#!\nWindow 356.1.1 – 357.12.31\nDuan Kan is independent, landed and borders Yan\nYan sends Murong Ke to besiege Guanggu (15,000); a player may decline\nLit when the war starts"
 hd_hev_j16_yangjun_name:0 "Yang Jun Kills Yang Guo"
 hd_hev_j16_yangjun_tt:0 "#high Yang Jun Kills Yang Guo#!\nWindow 356.1.1 – 356.12.31\nYang Guo rules Qiuchi and Yang Jun is within\nYang Jun takes power and Yang An flees to Qin; a player Yang Guo may be on guard"
 hd_hev_j16_sanyuan_name:0 "The Battle of Sanyuan"
 hd_hev_j16_sanyuan_tt:0 "#high The Battle of Sanyuan#!\nWindow 357.2.1 – 357.12.31\nYao Xiang is independent, landed and borders Qin\nQin attacks with 12,000 men; on victory Yao Xiang dies and Yao Chang submits; a player may decline\nLit when the war starts"
 hd_hev_346_06_name:0 "The Yunlong Gate Coup"
 hd_hev_346_06_tt:0 "#high The Yunlong Gate Coup#!\nWindow 357.6.1 – 360.1.1\nFu Jian has entered Guanzhong; Fu Jian (the younger) is adult and free; Chang'an is held by an AI Fu ruler (Fu Sheng)\nFu Jian gets an event to overthrow him, announced to the world. Lit on the historical choice"
 hd_hev_j16_wangmeng_name:0 "Wang Meng Joins Qin"
 hd_hev_j16_wangmeng_tt:0 "#high Wang Meng Joins Qin#!\nWindow 357.6.1 – 358.12.31\nFu Jian rules Qin; Wang Meng is landless and not yet in service\nWang Meng becomes chancellor and Fu Jian gains a lasting modifier; a player may decline"
 hd_hev_j16_qianye_name:0 "Yan Moves Its Capital to Ye"
 hd_hev_j16_qianye_tt:0 "#high Yan Moves Its Capital to Ye#!\nWindow 357.11.1 – 358.12.31\nThe Yan ruler holds Ye directly\nThe capital moves to Ye; a player may stay at Ji"
 hd_hev_j16_zhangping_name:0 "Zhang Ping Submits to Qin"
 hd_hev_j16_zhangping_tt:0 "#high Zhang Ping Submits to Qin#!\nWindow 358.1.1 – 359.8.1\nFu Jian rules Qin; Zhang Ping lives\nIf Zhang Ping is an independent lord Qin attacks him; Zhang Hao joins Qin as a peerless warrior\nLit when the war starts or Zhang Hao joins"
 hd_hev_j16_songhun_name:0 "Song Hun Destroys Zhang Guan"
 hd_hev_j16_songhun_tt:0 "#high Song Hun Destroys Zhang Guan#!\nWindow 359.6.1 – 359.12.31\nZhang Xuanjing rules; Zhang Guan and Song Hun live\nZhang Guan dies by the death table and Song Hun becomes chancellor; a player Song Hun may hold back"
 hd_hev_j16_huanwen_regent_name:0 "Huan Wen Takes the Regency"
 hd_hev_j16_huanwen_regent_tt:0 "#high Huan Wen Takes the Regency#!\nWindow 363.3.1 – 364.12.31\nHuan Wen is a landed direct vassal of the emperor and there is no regent\nHuan Wen becomes regent and chancellor, the emperor stays at Jiankang"
 hd_hev_j16_tianxi_name:0 "Zhang Tianxi Seizes Liang"
 hd_hev_j16_tianxi_tt:0 "#high Zhang Tianxi Seizes Liang#!\nWindow 363.6.1 – 364.6.1\nAn AI Zhang Xuanjing rules; Zhang Tianxi is adult and in the realm\nZhang Tianxi takes power (Xuanjing dies via the death table); a player may hold back"
 hd_hev_j16_luoyang365_name:0 "Yan Takes Luoyang"
 hd_hev_j16_luoyang365_tt:0 "#high Yan Takes Luoyang#!\nWindow 364.6.1 – 365.12.31\nHuan Wen's expedition is over, Luoyang belongs to the Jin emperor and Yan borders Jin\nYan sends Murong Ke against Henan (15,000); a player may decline\nLit when the war starts"
 hd_hev_j16_pingzhuan_name:0 "Murong Ke Dies, Murong Ping Dominates"
 hd_hev_j16_pingzhuan_tt:0 "#high Murong Ke Dies, Murong Ping Dominates#!\nWindow 367.5.1 – 367.12.31\nMurong Ke is dead; Murong Ping is at the Yan court\nThe Yan ruler gains a modifier and Murong Ping becomes chancellor; stays unlit if a player ruler governs himself"
 hd_hev_j16_sigong_name:0 "The Revolt of the Four Dukes"
 hd_hev_j16_sigong_tt:0 "#high The Revolt of the Four Dukes#!\nWindow 367.10.1 – 368.12.31\nFu Jian rules Qin; at least two of Fu Liu, Fu Shuang, Fu Sou and Fu Wu are landed\nThe largest breaks away and Fu Jian attacks (15,000); a player Fu Jian may conciliate\nLit when the war starts"
 hd_hev_j16_fangtou_name:0 "The Battle of Fangtou"
 hd_hev_j16_fangtou_tt:0 "#high The Battle of Fangtou#!\nWindow 369.4.1 – 369.12.31\nHuan Wen is landed and at peace; Yan borders Jin and holds Ji Commandery\nHuan Wen attacks Ji (20,000 vs 15,000) while Qin sends Gou Chi and Deng Qiang to help Yan; a player may decline\nLit when the war starts"
 hd_hev_j16_chui_benqin_name:0 "Murong Chui Flees to Qin"
 hd_hev_j16_chui_benqin_tt:0 "#high Murong Chui Flees to Qin#!\nWindow 369.10.1 – 370.2.12\nMurong Chui serves Yan; Yan won at Fangtou or Chui earned credit there; Qin exists\nChui defects to Qin and receives Huayin; a player may stay and defend himself"
 hd_hev_j16_dir_qin_s1_name:0 "Qin Director: Securing Guanzhong"
 hd_hev_j16_dir_qin_s1_tt:0 "#high Qin Director: Securing Guanzhong#!\nFirst stage of the Former Qin director\nThe Qin ruler (independent Fu lord of Chang'an) opens wars month by month for the commanderies of Guanzhong\nLit when the stage is truly complete"
 hd_hev_j16_dir_qin_s2_name:0 "Qin Director: Longyou and Qin Province"
 hd_hev_j16_dir_qin_s2_tt:0 "#high Qin Director: Longyou and Qin Province#!\nSecond stage of the Former Qin director\nTargets the commanderies of Longyou and Qin\nLit when the stage is truly complete"
 # 王猛伐燕与前秦一统（370–383；304、346、370 开局适用）
 hd_hev_j16_dir_qin_start_name:0 "Qin Director Begins"
 hd_hev_j16_dir_qin_start_tt:0 "#high Qin Director Begins#!\nWindow 351.1.1 – 382.6.1 (the 370 start launches it on the first tick)\nFu Jian has entered Guanzhong, a Qin ruler can be found and Qin has not collapsed\nThe director starts and expands Qin stage by stage"
 hd_hev_370_01_name:0 "The Siege of Jinyong (Battle of Luoyang)"
 hd_hev_370_01_tt:0 "#high The Siege of Jinyong (Battle of Luoyang)#!\nWindow 369.12.1 – 370.7.9\nThe Fu ruler of Chang'an and the Murong ruler of Henan are both independent; Jinyong belongs to Yan\nQin and Yan go to war (15,000 vs 8,000). Lit when Murong Zhu surrenders or Jinyong falls to Qin at the end of the war"
 hd_hev_370_04_name:0 "Ye Falls, Yan Is Destroyed"
 hd_hev_370_04_tt:0 "#high Ye Falls, Yan Is Destroyed#!\nWindow 369.12.1 – 372.1.1\nQin won the eastern campaign, or held Ye before 371.6.1; both rulers are alive and landed\nAn AI Yan ruler surrenders and his titles pass to Qin; a player may flee north to Longcheng"
 hd_hev_370_02_name:0 "The Eastern Campaign Against Yan"
 hd_hev_370_02_tt:0 "#high The Eastern Campaign Against Yan#!\nWindow 370.7.21 – 371.6.1\nThe Luoyang war has begun or ended; both rulers are independent and Ye belongs to Yan\nAn AI Qin ruler attacks Wei, Shangdang and Yang'e (a player may decline); one more attempt is allowed after a defeat"
 hd_hev_370_03_name:0 "The Shouchun Campaign"
 hd_hev_370_03_tt:0 "#high The Shouchun Campaign#!\nWindow 370.9.6 – 371.6.1\nA Yuan of Chen holds Shouchun independently and the emperor is a Henei Sima; outside the 370 start Jin must have lost at Fangtou and blamed Yuan Zhen\nThe emperor gets an event and Huan Wen joins the war; a player Yuan may hold out or surrender"
 hd_hev_j16_dir_qin_s3_name:0 "Qin Director: The Last of Yan"
 hd_hev_j16_dir_qin_s3_tt:0 "#high Qin Director: The Last of Yan#!\nContinues after Former Yan falls\nMops up the remaining commanderies of Yan\nLit when the stage is truly complete"
 hd_hev_370_05_name:0 "Huan Wen Deposes the Emperor"
 hd_hev_370_05_tt:0 "#high Huan Wen Deposes the Emperor#!\nWindow 371.12.24 – 373.1.1\nHuan Wen is landed under Sima Yi, who is still emperor; Sima Yu lives; in earlier starts Huan Wen must still be regent\nHuan Wen, Sima Yi and Sima Yu respond in turn (AI follows history); Sima Yu takes the throne and starts the Xian'an era"
 hd_hev_j16_dir_qin_s4_name:0 "Qin Director: Pacifying Qiuchi"
 hd_hev_j16_dir_qin_s4_tt:0 "#high Qin Director: Pacifying Qiuchi#!\nAfter the Qiuchi gate opens\nTakes Qiuchi\nLit only when Wudu belongs to Qin"
 hd_hev_j16_huanwen_dead_name:0 "Huan Wen Dies"
 hd_hev_j16_huanwen_dead_tt:0 "#high Huan Wen Dies#!\nWindow 373.3.1 – 384.1.1\nHuan Wen is alive at the start of the window and dies inside it\nLit after his death (the regency hand-off is blocked)"
 hd_hev_j16_mieliang_name:0 "The Conquest of Former Liang"
 hd_hev_j16_mieliang_tt:0 "#high The Conquest of Former Liang#!\nGate opens from 376.3.1 until the director stops\nThe Former Liang ruler is independent and borders Qin; the gate opens when Zhang Tianxi refuses (a player may submit)\nLit when Guzang belongs to Qin"
 hd_hev_j16_miedai_name:0 "The Conquest of Dai"
 hd_hev_j16_miedai_tt:0 "#high The Conquest of Dai#!\nAfter the Dai gate opens\nLit as soon as Yunzhong belongs to Qin\nWithin 376.6.1 – 379.1.1 Dai is divided between Liu Kuren and Liu Weichen"
 hd_hev_j16_beifu_name:0 "The Beifu Army"
 hd_hev_j16_beifu_tt:0 "#high The Beifu Army#!\nWindow 377.6.1 – 380.1.1\nXie Xuan serves Jin without a commandery; Guangling is held by an AI in the same realm\nGuangling is granted to Xie Xuan and the Beifu army is formed"
 hd_hev_j16_xiangyang_name:0 "The Siege of Xiangyang"
 hd_hev_j16_xiangyang_tt:0 "#high The Siege of Xiangyang#!\nWindow 377.10.1 – 380.1.1\nThe Qin ruler is independent, Xiangyang belongs to the Jin emperor and borders Qin\nQin sends Fu Pi with 15,000; a player may decline\nLit on a Qin victory; Zhu Xu joins Qin"
 hd_hev_j16_dir_qin_done_name:0 "Qin Director Finished"
 hd_hev_j16_dir_qin_done_tt:0 "#high Qin Director Finished#!\nAfter every stage is complete or abandoned\n—\nLit when the director wraps up"
 hd_hev_346_07_name:0 "Casting Whips to Dam the River (Battle of Fei)"
 hd_hev_346_07_tt:0 "#high Casting Whips to Dam the River (Battle of Fei)#!\nWindow 383.6.1 – 386.1.1\nThere is an emperor; the Qin ruler is independent with at least 100 counties, is not the emperor and is not already fighting him\nThe Qin ruler gets an event and attacks Jin for Yang. Lit when the war starts; the outcome is announced worldwide"
 hd_hev_346_08_name:0 "After the Fei (Former Qin Collapses)"
 hd_hev_346_08_tt:0 "#high After the Fei (Former Qin Collapses)#!\nQin loses or draws at the Fei\nThe Qin ruler, if alive, gets an event\nAll non-Di vassals of duke rank and above break away; announced worldwide"
 # 东晋末·王恭、孙恩与桓玄（396–404；304、346、370 开局适用）
 hd_hev_j16_wanggong_name:0 "Wang Gong Rises (Twice)"
 hd_hev_j16_wanggong_tt:0 "#high Wang Gong Rises (Twice)#!\nFirst rising 397.3.1 – 397.12.1; second 398.6.1 – 399.3.1\nWang Gong is landed in Jin; Wang Guobao and Sima Daozi are at court\nFirst: Daozi executes Wang Guobao; second: Liu Laozhi changes sides\nLit when either happens"
 hd_hev_j16_sunen_name:0 "Sun En Rises"
 hd_hev_j16_sunen_tt:0 "#high Sun En Rises#!\nYears 399 – 402, historical invasion Sun En\nSun En lives; the invasion rolls yearly\nLit when he rises (can happen in any start; shown as not this game outside the Jin starts)"
 hd_hev_j16_huanxuan_name:0 "Huan Xuan Enters Jiankang"
 hd_hev_j16_huanxuan_tt:0 "#high Huan Xuan Enters Jiankang#!\nWindow 401.12.1 – 403.1.1\nHuan Xuan holds a commandery under Jin; the Sima emperor has no regent; Sima Yuanxian is at court\nHuan Xuan purges the court by war (or peacefully) and becomes regent"
 hd_hev_j16_cuanchu_name:0 "Huan Xuan Usurps the Throne as Chu"
 hd_hev_j16_cuanchu_tt:0 "#high Huan Xuan Usurps the Throne as Chu#!\nWindow 403.9.1 – 404.3.1\nHuan Xuan has been regent for a year and is not emperor\nAn AI Huan Xuan accepts the abdication; a player may decline"
 # 北方诸国（395–412；参合陂至柴壁四行早于 404，404 开局显示开局前）
 hd_hev_j16_canhe_name:0 "The Battle of Canhe Slope"
 hd_hev_j16_canhe_tt:0 "#high The Battle of Canhe Slope#!\nWindow 395.5.1 – 396.3.1\nYan and Wei border each other at peace; Western Yan is gone\nYan sends Murong Bao against Wei; a player may decline\nLit when the war starts"
 hd_hev_j16_zhongshan_name:0 "Wei Takes Zhongshan"
 hd_hev_j16_zhongshan_tt:0 "#high Wei Takes Zhongshan#!\nWindow 397.1.1 – 398.6.1\nZhongshan belongs to Wei (taken by the Tuoba Gui invasion)\nWei gains prestige and the Yan treasury; Cui Hong joins Wei"
 hd_hev_j16_nanyan_di_name:0 "Southern Yan Becomes an Empire"
 hd_hev_j16_nanyan_di_tt:0 "#high Southern Yan Becomes an Empire#!\nWindow 399.6.1 – 401.6.1\nMurong De is independent and Guanggu is his\nHe becomes emperor, starts the Jianping era and moves to Guanggu"
 hd_hev_j16_chaibi_name:0 "The Battle of Chaibi"
 hd_hev_j16_chaibi_tt:0 "#high The Battle of Chaibi#!\nWindow 402.3.1 – 403.6.1\nWei and Later Qin border in Pingyang or Hedong at peace\nWei attacks in a border war; a player may decline or seek peace\nLit when the war starts"
 hd_hev_j16_xia_open_name:0 "Helian Bobo Founds Xia"
 hd_hev_j16_xia_open_tt:0 "#high Helian Bobo Founds Xia#!\nWindow 407.4.1 – 409.1.1\nBobo is landed (a Later Qin vassal, Later Qin is gone, or already independent)\nOpens the Helian Bobo invasion; lit once he has actually risen"
 hd_hev_j16_guzang_juqu_name:0 "Northern Liang Takes Guzang"
 hd_hev_j16_guzang_juqu_tt:0 "#high Northern Liang Takes Guzang#!\nWindow 410.1.1 – 413.6.1\nNorthern and Southern Liang border; Guzang belongs to Southern Liang\nNorthern Liang attacks; lit when Guzang actually belongs to Northern Liang"
 # 刘裕北伐与晋宋禅代（404–421；四个两晋开局都适用）
 hd_hev_404_01_name:0 "Fuzhou Hill (Huan Xuan Flees West)"
 hd_hev_404_01_tt:0 "#high Fuzhou Hill (Huan Xuan Flees West)#!\nFive days after the Jingkou rising (404.2.1 – 405.1.1, all starts) Huan Xuan gets an event; fallback window 404.3.29 – 405.1.1\nLiu Yu is fighting Huan Xuan for independence and Huan Xuan holds the realm\nHuan Xuan abandons the capital. Lit on the historical choice"
 hd_hev_404_02_name:0 "Zhengrong Isle (Jin Restored)"
 hd_hev_404_02_tt:0 "#high Zhengrong Isle (Jin Restored)#!\nWindow 404.6.10 – 405.6.1\nHuan Xuan has fled west; Liu Yu is independent; Huan Xuan holds the realm; Emperor An or Sima Dewen lives\nLiu Yu gets an event: against an AI Huan Xuan the Jin emperor is restored at once, against a player there is war. Lit on restoration or war"
 hd_hev_j16_liuyu_regent_name:0 "Liu Yu Takes Charge"
 hd_hev_j16_liuyu_regent_tt:0 "#high Liu Yu Takes Charge#!\nFallback window 404.7.1 – 409.4.1, from 408.2.1\nLiu Yu serves Jin, is not emperor, and the emperor has no regent\nLiu Yu becomes regent; also lit when the Zhengrong restoration makes him regent (the normal path)"
 hd_hev_404_03_name:0 "Lu Xun Takes Panyu"
 hd_hev_404_03_tt:0 "#high Lu Xun Takes Panyu#!\nWindow 404.10.15 – 406.1.1\nLu Xun is alive, adult and landless; Panyu is not his\nLu Xun gets an event to seize Panyu and attack Nanhai. Lit on the historical choice"
 hd_hev_404_04_name:0 "The Wucheng Mutiny (Qiao Zong)"
 hd_hev_404_04_tt:0 "#high The Wucheng Mutiny (Qiao Zong)#!\nHistorical invasion Qiao Zong, rolled yearly 404 – 412\nQiao Zong lives\nLit when the invasion rises (can happen in any start)"
 hd_hev_404_05_name:0 "The Conquest of Southern Yan"
 hd_hev_404_05_tt:0 "#high The Conquest of Southern Yan#!\nWindow 409.4.1 – 413.1.1\nLiu Yu is regent (or an independent king or higher) and not leading another historical war; an independent Murong holds Guanggu or Qi\nLiu Yu marches on Qing. Lit when the war starts or is judged"
 hd_hev_j16_luxun_north_name:0 "Lu Xun and Xu Daofu March North"
 hd_hev_j16_luxun_north_tt:0 "#high Lu Xun and Xu Daofu March North#!\nWindow 410.2.1 – 411.3.1\nLu Xun is independent with land in Nanhai; the emperor is a Sima; Liu Yu is fighting Southern Yan or it is past 410.4.1\nAn AI Lu Xun marches north; a player may hold Lingnan\nLit when the war starts"
 hd_hev_j16_tao_liuyi_name:0 "Liu Yi Is Destroyed"
 hd_hev_j16_tao_liuyi_tt:0 "#high Liu Yi Is Destroyed#!\nWindow 412.9.1 – 413.3.1\nLiu Yu is regent; Liu Yi is a landed Jin vassal\nLiu Yi falls (death table) and Nan Commandery later goes to Sima Xiuzhi"
 hd_hev_j16_pingshu_name:0 "Zhu Lingshi Pacifies Shu"
 hd_hev_j16_pingshu_tt:0 "#high Zhu Lingshi Pacifies Shu#!\nWindow 412.12.1 – 414.6.1\nAn independent Qiao rules Chengdu; Liu Yu is regent\nLiu Yu sends Zhu Lingshi against Shu; skipped if the Qiao Zong invasion never happened\nLit when the war starts"
 hd_hev_j16_tao_xiuzhi_name:0 "The Campaign Against Sima Xiuzhi"
 hd_hev_j16_tao_xiuzhi_tt:0 "#high The Campaign Against Sima Xiuzhi#!\nWindow 415.1.1 – 416.3.1\nSima Xiuzhi is a landed Jin vassal; Liu Yu is regent; Lu Zongzhi lives\nOne of Xiuzhi's commanderies goes to Liu Daolian and Xiuzhi flees; a player may rebel or decline"
 hd_hev_404_06_name:0 "The Conquest of Later Qin"
 hd_hev_404_06_tt:0 "#high The Conquest of Later Qin#!\nWindow 416.9.1 – 419.1.1\nSouthern Yan and Xiuzhi are dealt with; Liu Yu qualifies as above; an independent Yao holds Chang'an\nLiu Yu marches on Sili. Lit when the war starts or is judged"
 hd_hev_j16_songgong_name:0 "The Nine Bestowments, Duke of Song"
 hd_hev_j16_songgong_tt:0 "#high The Nine Bestowments, Duke of Song#!\nWindow 418.6.1 – 419.12.1\nLiu Yu is a landed regent; Later Qin has fallen or it is past 418.12.1\nA new kingdom-tier Song is created for Liu Yu; a player may decline once"
 hd_hev_j16_changan_lost_name:0 "Chang'an Is Lost"
 hd_hev_j16_changan_lost_tt:0 "#high Chang'an Is Lost#!\nWindow 418.9.1 – 419.6.1\nThe governor of Guanzhong holds Jingzhao or Chang'an; Helian Bobo is independent and borders him\nBobo takes Chang'an (if already at war, Xia only gets 8,000 troops)"
 hd_hev_j16_gongdi_name:0 "Emperor An Is Murdered, Emperor Gong Succeeds"
 hd_hev_j16_gongdi_tt:0 "#high Emperor An Is Murdered, Emperor Gong Succeeds#!\nWindow 418.12.1 – 419.6.1\nLiu Yu is Duke of Song; an AI Emperor An reigns; Sima Dewen lives\nAn names Dewen heir (An is murdered on 419.1.28); lit when Dewen takes the throne and starts the Yuanxi era"
 hd_hev_j16_songwang_name:0 "Liu Yu Becomes King of Song"
 hd_hev_j16_songwang_tt:0 "#high Liu Yu Becomes King of Song#!\nWindow 419.7.1 – 420.6.1\nLiu Yu holds Song and is regent\nA new empire-tier Song is created above it; a player may decline once"
 hd_hev_404_07_name:0 "Abdication (Song Replaces Jin)"
 hd_hev_404_07_tt:0 "#high Abdication (Song Replaces Jin)#!\nWindow 419.12.1 – 421.1.1\nLiu Yu is regent; he is King of Song or it is past 420.6.1; the emperor is not An or it is past 420.6.1\nAn AI Liu Yu accepts the abdication (a player may delay a year); the realm becomes Song, announced worldwide"
 hd_hev_531_01_name:0 "An Emperor Raised at Xindu"
 hd_hev_531_01_tt:0 "#high An Emperor Raised at Xindu#!\nFrom 531.10.31\nGao Huan is independent and free; Yuan Lang lives and is not emperor\nGao Huan raises Yuan Lang, starting the Zhongxing era as Wei"
 hd_hev_531_02_name:0 "The Attack on Ye"
 hd_hev_531_02_tt:0 "#high The Attack on Ye#!\nFrom 531.12.1\nGao Huan is independent and Liu Dan still holds Wei\nGao Huan attacks Ye (10,000 from Xindu); Liu Dan dies on victory"
 hd_hev_531_03_name:0 "The Battle of Hanling"
 hd_hev_531_03_tt:0 "#high The Battle of Hanling#!\n532.4.20 – 533.1.1\nGao Huan holds Ye and Erzhu Zhao is independent\nErzhu Zhao attacks Ye; Gao Huan wins if he holds it and Erzhu Zhongyuan flees to Liang"
 hd_hev_531_04_name:0 "Gao Huan Enters Luoyang"
 hd_hev_531_04_tt:0 "#high Gao Huan Enters Luoyang#!\nFrom 532.5, after Gao Huan wins at Hanling\nGao Huan is independent, Yuan Gong still reigns and Yuan Xiu lives\nHusi Chun kills Erzhu Shilong and others, Yuan Gong abdicates to Yuan Xiu and Gao Huan becomes chancellor"
 hd_hev_531_05_name:0 "Heba Yue Is Killed, Yuwen Tai Takes Guanzhong"
 hd_hev_531_05_tt:0 "#high Heba Yue Is Killed, Yuwen Tai Takes Guanzhong#!\nFrom 534.2\nHeba Yue is an alive, landed AI\nYuwen Tai, under the same liege, first takes all of Heba Yue's land, then Houmochen Yue kills him; no pop-up"
 hd_hev_617_01_name:0 "The Battle of Xihe"
 hd_hev_617_01_tt:0 "#high The Battle of Xihe#!\nAt the start Li Yuan is at war with Gao Deru of Xihe\nLi Yuan wins if Zishi ends up on his side\nOn victory Xihe goes to Li Yuan and Gao Deru dies"
 hd_hev_617_02_name:0 "The Siege of the Eastern Capital"
 hd_hev_617_02_tt:0 "#high The Siege of the Eastern Capital#!\nAt the start Li Mi is at war with Yang Tong for Henan\nLi Mi wins if Luoyang ends up on his side\nOn victory Henan goes to Li Mi"
 hd_hev_617_03_name:0 "Relieving the Eastern Capital"
 hd_hev_617_03_tt:0 "#high Relieving the Eastern Capital#!\n617.8.7 – 618.4.1\nWang Shichong holds Jiangdu and Yang Tong holds Luoyang and Yanshi\nWang Shichong (AI goes north at once) becomes Yang Tong's vassal with Yanshi and 10,000 troops"
 hd_hev_617_04_name:0 "Xue Ju Proclaims Himself Emperor"
 hd_hev_617_04_tt:0 "#high Xue Ju Proclaims Himself Emperor#!\nFrom 617.8.7\nXue Ju is alive and independent\nHe becomes emperor directly; no pop-up"
 hd_hev_617_05_name:0 "Li Yuan Marches on Chang'an"
 hd_hev_617_05_tt:0 "#high Li Yuan Marches on Chang'an#!\n617.8.10 – 618.6.1\nLi Yuan is independent with Taiyuan; Yang You still holds Jingzhao\nLi Yuan attacks (AI at once); a player Yang You may open the gates; Li Yuan becomes King of Tang on taking Chang'an"
 hd_hev_617_06_name:0 "Li Gui Rises"
 hd_hev_617_06_tt:0 "#high Li Gui Rises#!\n617.8.14 – 618.3.1\nLi Gui is alive and not independent; Wuwei is not taken by another rebel\nHe takes Wuwei, becomes independent Great King of Liang and starts the Anle era; no pop-up"
 hd_hev_617_07_name:0 "Xiao Xian Rises at Baling"
 hd_hev_617_07_tt:0 "#high Xiao Xian Rises at Baling#!\n617.11.4 – 618.3.1\nXiao Xian holds Luo County and is not independent\nHe rises (AI at once), takes Changsha and becomes Duke of Liang"
 hd_hev_617_08_name:0 "The Hongmen Banquet (Death of Zhai Rang)"
 hd_hev_617_08_tt:0 "#high The Hongmen Banquet (Death of Zhai Rang)#!\n617.12.4 – 618.6.1\nZhai Rang is an alive AI vassal of Li Mi\nLi Mi (AI at once) takes back his counties and kills him at a banquet"
 hd_hev_617_09_name:0 "Dou Jiande Becomes King of Xia"
 hd_hev_617_09_tt:0 "#high Dou Jiande Becomes King of Xia#!\nFrom 618.2.1\nDou Jiande is alive and independent\nHe renames his realm Xia as king and starts the Wufeng era; no pop-up"
 hd_hev_617_10_name:0 "The Jiangdu Coup"
 hd_hev_617_10_tt:0 "#high The Jiangdu Coup#!\n618.4.11 – 619.1.1\nEmperor Yang lives and still holds the realm and Guangling; Yuwen Huaji lives\nAn AI Emperor Yang is strangled, Yang Tong succeeds with the Huangtai era and Wang Shichong as chancellor; a player Emperor Yang survives but Yuwen Huaji seizes Jiangdu and attacks"
 hd_hev_617_11_name:0 "Xiao Xian Proclaims Himself Emperor"
 hd_hev_617_11_tt:0 "#high Xiao Xian Proclaims Himself Emperor#!\nFrom 618.5.1\nXiao Xian is alive, independent and has risen\nHe becomes emperor and starts the Mingfeng era; no pop-up"
 hd_hev_617_12_name:0 "The Abdication (Tang Is Founded)"
 hd_hev_617_12_tt:0 "#high The Abdication (Tang Is Founded)#!\n618.6.18 – 619.6.1\nLi Yuan is independent with Chang'an and someone else holds the realm\nLi Yuan (AI at once) takes the realm as Tang and starts the Wude era"
 hd_hev_617_13_name:0 "The King of Zheng Forces an Abdication"
 hd_hev_617_13_tt:0 "#high The King of Zheng Forces an Abdication#!\n619.5.1 – 620.1.1\nWang Shichong is Yang Tong's vassal and Yang Tong holds Luoyang\nA player on either side is asked (AIs resolve at once); Wang Shichong usurps as Zheng with the Kaiming era"
 hd_hev_hi_kebineng_name:0 "Ke Bineng Raids the Frontier"
