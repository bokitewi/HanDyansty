 hd_hev_j16_luoyang328_tt:0 "#high The Battle of Luoyang (328)#!\nWindow 328.7.1 – 329.2.1\nLiu Yao and Shi Le are independent, landed and neighbours\nShi Le relieves Luoyang (15,000 vs 10,000); on victory Liu Yao is captured; a player may decline\nLit when the war starts"
 hd_hev_j16_shanggui329_name:0 "The Fall of Former Zhao"
 hd_hev_j16_shanggui329_tt:0 "#high The Fall of Former Zhao#!\nWindow 329.1.1 – 329.10.1\nLiu Yao is dead or captive; Liu Xi or Liu Yin holds land; Shi Hu is landed\nShi Hu attacks Tianshui with 15,000 men and a claim\nLit when the war starts"
