 hd_hev_fo_e26_tt:0 "#high Fu Jian Gains a Man and a Half#!\nChecked yearly from 379; void if still unmet in 385; in games running the Jin and Sixteen Kingdoms line it fires when Qin wins at Xiangyang\nDao'an is alive; Fu Jian is alive (else Chang'an's top liege)\nDao'an joins Fu Jian's court and Huiyuan moves to Chaisang; Fu Jian gains 100 piety and 75 prestige\nFu Jian receives A Man and a Half (notice only)"
 hd_hev_fo_e27_name:0 "Lü Guang Takes Kucha and Kumarajiva"
 hd_hev_fo_e27_tt:0 "#high Lü Guang Takes Kucha and Kumarajiva#!\nChecked yearly from 384; void if still unmet in 394; in games running the Jin and Sixteen Kingdoms line it fires when Lü Guang takes Kucha\nKumarajiva has appeared and is alive\nKumarajiva joins Lü Guang's court (to Guzang if Lü Guang is dead or landless)\nNo event window"
 hd_hev_fo_e28_name:0 "Huiyuan on Mount Lu: The Donglin Temple"
 hd_hev_fo_e28_tt:0 "#high Huiyuan on Mount Lu: The Donglin Temple#!\nChecked yearly from 386; void if still unmet in 396\nHuiyuan is alive (moved to Chaisang first) and Chaisang has a holder\nA level 1 Donglin Temple is built at Chaisang, which turns Mahayana once the ban is lifted; Chaisang's top liege gains 100 piety and 75 prestige\nThe ruler receives The Donglin Temple (notice only)"
 hd_hev_fo_e29_name:0 "Faxian's Journey West (Departure / Landing in Qingzhou / To Jiankang)"
 hd_hev_fo_e29_tt:0 "#high Faxian's Journey West (Departure / Landing in Qingzhou / To Jiankang)#!\nRuns once each in 399, 412 and 413; never void\nDeparture needs Faxian alive; in the 404 start he only appears in 412\n399: Faxian leaves the map (into the distant wanderer pool); 412: lands at Zhangguang in Qingzhou, gains the pilgrim trait and 350 prestige; 413: moves to Jiankang\nNo event window; lit when any step really happens"
 hd_hev_fo_e30_name:0 "Yao Xing Brings Kumarajiva to Chang'an"
 hd_hev_fo_e30_tt:0 "#high Yao Xing Brings Kumarajiva to Chang'an#!\nChecked yearly from 401; void if still unmet in 411\nKumarajiva is alive; Yao Xing is alive (else Chang'an's top liege)\nKumarajiva and Sengzhao join his court; a level 1 Xiaoyao Garden is built at Chang'an, which turns Mahayana once the ban is lifted; the ruler gains 100 piety and 75 prestige\nThe ruler receives The Translation Hall of Xiaoyao Garden (notice only)"
 hd_hev_fo_e31_name:0 "The White Lotus Society (Pure Land Opens)"
 hd_hev_fo_e31_tt:0 "#high The White Lotus Society (Pure Land Opens)#!\nChecked yearly from 402; void if still unmet in 412\nHuiyuan is alive\nPure Land opens for conversion; Huiyuan adopts it and gains 250 piety and 150 prestige; his top liege gains 100 piety\nThat ruler receives The White Lotus Society (notice only); on expiry the school still opens but the row stays unlit"
 hd_hev_fo_e32_name:0 "Huan Xuan: Should Monks Bow to Kings?"
 hd_hev_fo_e32_tt:0 "#high Huan Xuan: Should Monks Bow to Kings?#!\nChecked yearly from 402; void if still unmet in 405\nHuan Xuan is alive (else Jianye's top liege)\nChoice: purge the monks (monks in the realm -20 opinion, piety -50) or accept Huiyuan's argument (piety +50)\nAI accepts the argument; lit as soon as the event fires"
 hd_hev_fo_e51_name:0 "Yao Xing Opens Maiji Mountain"
 hd_hev_fo_e51_tt:0 "#high Yao Xing Opens Maiji Mountain#!\nChecked yearly from 405; void if still unmet in 415\nLong county has a holder whose top liege is not a persecutor\nA level 1 Maiji Mountain grotto is built free at Long; the ruler gains 100 piety and 75 prestige\nThe ruler receives Maiji Mountain (notice only)"
 hd_hev_fo_e33_name:0 "Dharmaksema Translates the Great Nirvana Sutra"
 hd_hev_fo_e33_tt:0 "#high Dharmaksema Translates the Great Nirvana Sutra#!\nChecked yearly from 421; void if still unmet in 431\nDharmaksema has appeared and is alive\nDharmaksema gains 150 prestige; his top liege gains 50 piety\nThat ruler receives The Great Nirvana Sutra (notice only)"
 hd_hev_fo_e34_name:0 "Daosheng and Buddhahood for All (Expelled / Vindicated)"
 hd_hev_fo_e34_tt:0 "#high Daosheng and Buddhahood for All (Expelled / Vindicated)#!\nExpulsion from 428, vindication from 430; both void in 434\nDaosheng has appeared and is alive\n428: Daosheng is expelled and moves to the court of Chaisang's holder; 430: the full Nirvana Sutra arrives and he gains 150 prestige\nNo event window; lit when either step happens"
 hd_hev_fo_e55_name:0 "The Murder of Dharmaksema"
 hd_hev_fo_e55_tt:0 "#high The Murder of Dharmaksema#!\nRuns once in 433, no retry\nDharmaksema has appeared and is alive\nDharmaksema is assassinated while seeking to go west, on Juqu Mengxun's orders (the killer if alive)\nNo event window; stays unlit if he is already dead"
 hd_hev_fo_e35_name:0 "Emperor Taiwu Persecutes the Buddhists"
 hd_hev_fo_e35_tt:0 "#high Emperor Taiwu Persecutes the Buddhists#!\nChecked yearly from 446; void if still unmet in 456\nThe top liege of Pingcheng's holder is alive, emperor tier and not Buddhist\nChoice: persecute (persecutor flag, temples razed for gold and caves reduced, monks flee, Buddhists -30 opinion) or refuse\nAI persecutes; lit as soon as the event fires"
 hd_hev_fo_e36_name:0 "Restoration and Yungang (Emperor Wencheng / Tanyao's Caves)"
 hd_hev_fo_e36_tt:0 "#high Restoration and Yungang (Emperor Wencheng / Tanyao's Caves)#!\nRestoration from 452 (void 466); Yungang from 460 (void 470)\nRestoration only after Taiwu really persecuted, with Pingcheng's top liege not a persecutor; Yungang needs Datong's top liege not a persecutor\nRestoration: piety +100 and the rebuild decisions open; Yungang: a level 1 Yungang Grottoes at Datong, which turns Mahayana, piety +100, prestige +75\nThe ruler receives The Dharma Restored and The Five Caves of Yungang (notices only); lit when either step happens"
 hd_hev_fo_e52_name:0 "Northern Wei Builds the Hanging Temple"
 hd_hev_fo_e52_tt:0 "#high Northern Wei Builds the Hanging Temple#!\nChecked yearly from 491; void if still unmet in 501\nYishi county has a holder whose top liege is not a persecutor\nA level 1 Hanging Temple is built free at Yishi; the ruler gains 100 piety and 75 prestige\nThe ruler receives The Hanging Temple (notice only)"
 hd_hev_fo_e37_name:0 "Batuo on Mount Song: The Shaolin Monastery"
 hd_hev_fo_e37_tt:0 "#high Batuo on Mount Song: The Shaolin Monastery#!\nChecked yearly from 495; void if still unmet in 505\nGong county has a holder whose top liege is not a persecutor\nBatuo moves to Gong; a level 1 Shaolin Monastery is built there and Gong turns Mahayana; the ruler gains 100 piety and 75 prestige\nThe ruler receives The Shaolin Monastery (notice only)"
 hd_hev_fo_e38_name:0 "Empress Dowager Hu Builds the Yongning Temple"
 hd_hev_fo_e38_tt:0 "#high Empress Dowager Hu Builds the Yongning Temple#!\nChecked yearly from 516; void if still unmet in 526\nEmpress Dowager Hu is alive (else Luoyang's top liege) and not a persecutor\nA level 1 Yongning Temple is built at Jinyong, which turns Mahayana; the ruler gains 100 piety and 75 prestige\nThe ruler receives The Yongning Temple (notice only)"
 hd_hev_fo_e39_name:0 "Bodhidharma and Huike (Chan Opens)"
 hd_hev_fo_e39_tt:0 "#high Bodhidharma and Huike (Chan Opens)#!\nChecked yearly from 527; void if still unmet in 537\nBodhidharma has appeared and is alive\nChan opens for conversion; Bodhidharma moves to Gong (Mount Song), adopts Chan and gains 250 piety and 150 prestige; Huike becomes maimed; his top liege gains 100 piety\nThat ruler receives Crossing on a Reed (notice only); on expiry the school still opens but the row stays unlit"
 hd_hev_fo_e40_name:0 "Emperor Wu of Liang Gives Himself to the Tongtai Temple (First / Again)"
 hd_hev_fo_e40_tt:0 "#high Emperor Wu of Liang Gives Himself to the Tongtai Temple (First / Again)#!\nFirst from 527 (void 537); again from 529, 546 and 547 (each void after 10 years)\nThe first needs Xiao Yan alive (else Jianye's top liege) and not a persecutor; later ones need Xiao Yan or the first donor alive\nFirst: a level 1 Tongtai Temple at Jianye, which turns Mahayana, piety +100, prestige +75; each giving: a medium sum of gold, piety +250, Jingxue-rite vassals -10 opinion\nThe ruler receives Giving Himself to the Tongtai Temple or Giving Himself Again (notices only); lit when any one happens"
 hd_hev_fo_e53_name:0 "Tuoba Yu Opens the Famen Pagoda"
 hd_hev_fo_e53_tt:0 "#high Tuoba Yu Opens the Famen Pagoda#!\nRuns once in 558, no retry\nThe Famen Temple at Meiyang still stands\nThe Famen Temple is upgraded one level; Meiyang's top liege gains 50 piety\nThe ruler receives Opening the Pagoda (notice only); if the temple is gone nothing happens and the row stays unlit"
 hd_hev_fo_e42_name:0 "Emperor Wu of Northern Zhou Bans Buddhism and Daoism (Ban / Extended to Qi)"
 hd_hev_fo_e42_tt:0 "#high Emperor Wu of Northern Zhou Bans Buddhism and Daoism (Ban / Extended to Qi)#!\nBan from 574 (void 584); extension from 577 (void 580)\nChang'an's top liege is alive and not Buddhist; the extension needs him to have persecuted, still live and hold Yecheng\nChoice: persecute (persecutor flag, temples razed for gold and caves reduced, monks flee, Buddhists -30 opinion) or refuse; in 577 the persecution reaches the former Qi lands\nAI persecutes; lit as soon as the event fires"
 hd_hev_fo_e43_name:0 "Zhiyi and Tiantai (Into the Mountains / The Guoqing Temple)"
 hd_hev_fo_e43_tt:0 "#high Zhiyi and Tiantai (Into the Mountains / The Guoqing Temple)#!\nSchool from 575 (void 585); Guoqing Temple from 598 (void 608)\nThe school needs Zhiyi alive; the temple needs Yang Guang alive (else Zhang'an's top liege) and not a persecutor\n575: Tiantai opens for conversion, Zhiyi moves to Zhang'an, adopts it and gains 250 piety and 150 prestige, his liege +100 piety; 598: a level 1 Guoqing Temple at Zhang'an, which turns Mahayana, piety +100, prestige +75\nThe ruler receives Into the Tiantai Mountains and The Guoqing Temple (notices only); the school still opens on expiry without lighting; lit when either step happens"
 hd_hev_fo_e48_name:0 "Emperor Wen of Sui Restores the Dharma"
 hd_hev_fo_e48_tt:0 "#high Emperor Wen of Sui Restores the Dharma#!\nChecked yearly from 581; void if still unmet in 591\nOnly if Northern Zhou really persecuted; Chang'an's top liege is not a persecutor\nRestoration: piety +100 and the rebuild decisions open\nThe ruler receives The Dharma Restored in Kaihuang (notice only)"
 hd_hev_fo_e44_name:0 "Yang Guang Names Zhiyi the Wise One"
 hd_hev_fo_e44_tt:0 "#high Yang Guang Names Zhiyi the Wise One#!\nChecked yearly from 591; void if still unmet in 597\nZhiyi has appeared and is alive\nZhiyi gains 150 prestige; Yang Guang, if alive, gains 100 piety (else Zhiyi's top liege)\nThe ruler receives The Wise One (notice only)"
 hd_hev_fo_e46_name:0 "The Three Stages Sect Banned"
 hd_hev_fo_e46_tt:0 "#high The Three Stages Sect Banned#!\nRuns once in 600, no retry\nNo precondition\nNarrative only, no effects\nChang'an's top liege receives The Three Stages Banned (notice only)"
 hd_hev_fo_e45_name:0 "Emperor Wen of Sui's Renshou Relic Pagodas"
 hd_hev_fo_e45_tt:0 "#high Emperor Wen of Sui's Renshou Relic Pagodas#!\nChecked yearly from 601; void if still unmet in 611\nChang'an has a holder whose top liege is not a persecutor\nThe ruler gains 250 piety and 150 prestige; no building\nThe ruler receives The Renshou Relics (notice only)"
 hd_hev_fo_e56_name:0 "Daoxuan's Vinaya Commentary (Vinaya Opens)"
 hd_hev_fo_e56_tt:0 "#high Daoxuan's Vinaya Commentary (Vinaya Opens)#!\nChecked yearly from 626; void if still unmet in 636\nDaoxuan has appeared and is alive\nVinaya opens for conversion; Daoxuan adopts it and gains 250 piety and 150 prestige; his top liege gains 100 piety\nThat ruler receives The Vinaya of the Southern Mountain (notice only); on expiry the school still opens but the row stays unlit"
 hd_hev_fo_e57_name:0 "Dushun Founds Huayan (Huayan Opens)"
 hd_hev_fo_e57_tt:0 "#high Dushun Founds Huayan (Huayan Opens)#!\nChecked yearly from 630; void if still unmet in 640\nDushun has appeared and is alive\nHuayan opens for conversion; Dushun adopts it and gains 250 piety and 150 prestige; his top liege gains 100 piety\nThat ruler receives Contemplating the Dharma Realm (notice only); on expiry the school still opens but the row stays unlit"
 hd_hev_fo_e58_name:0 "Xuanzang Returns (Yogacara Opens)"
 hd_hev_fo_e58_tt:0 "#high Xuanzang Returns (Yogacara Opens)#!\nChecked yearly from 645; void if still unmet in 655\nXuanzang is alive\nYogacara opens for conversion; Xuanzang adopts it (nothing else about him changes)\nThe top liege of his court receives Return from the West (notice only); on expiry the school still opens but the row stays unlit"
