 hd_hev_j16_sujun_tt:0 "#high The Rebellion of Su Jun and Zu Yue#!\nWindow 327.10.1 – 329.3.1\nSu Jun is landed within Jin; Yu Liang lives\nAn AI Su Jun marches on Jiankang with 8,000 men, Zu Yue joins him and Tao Kan leads the loyalists; a player may hold back\nLit when the war starts"
