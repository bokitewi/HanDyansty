 hd_hev_j16_xidiqiang_tt:0 "#high Shi Hu Resettles the Di and Qiang#!\nWindow 333.10.1 – 335.12.31\nShi Hu rules independently; Fu Hong or Yao Yizhong lives\nThe AI chiefs become Shi Hu's vassals, or join his court if landless"
