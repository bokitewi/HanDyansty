 hd_hev_j16_shile_emperor_tt:0 "#high Shi Le Proclaims Himself Emperor#!\nWindow 330.2.1 – 330.12.31\nFormer Zhao is gone (or Shi Le holds two kingdoms) and Shi Le is independent\nHe becomes emperor (a player may choose Heavenly King; both count), the era becomes Jianping and Shi Hong is made heir"
 hd_hev_j16_murongren_name:0 "The Revolt of Murong Ren"
 hd_hev_j16_murongren_tt:0 "#high The Revolt of Murong Ren#!\nWindow 333.4.13 – 336.2.17\nMurong Hui names Huang heir; after Hui dies Murong Ren holds Liaodong but is not independent\nLit when Murong Ren rises; later Huang gains 8,000 troops while fighting him (crossing the ice)"
