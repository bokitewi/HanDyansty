 hd_hev_j16_liangwang_name:0 "Zhang Jun Succeeds and Styles Himself King of Liang"
 hd_hev_j16_liangwang_tt:0 "#high Zhang Jun Succeeds and Styles Himself King of Liang#!\nWindow 324.3.1 – 346.6.1\nZhang Mao names Zhang Jun heir (324); from 345 Zhang Jun holds Liang\nLit when Zhang Jun takes the royal style"
 hd_hev_j16_wangdun2_name:0 "Wang Dun's Second Rebellion"
 hd_hev_j16_wangdun2_tt:0 "#high Wang Dun's Second Rebellion#!\nWindow 324.5.1 – 324.10.1\nEmperor Ming holds the realm; Wang Dun is landed in his realm\nAn AI Emperor Ming attacks with 10,000 men after Wang Dun loses the regency and breaks away; a player may endure\nLit when the war starts"
 hd_hev_j16_yuliang_name:0 "The Yu Family in Power"
