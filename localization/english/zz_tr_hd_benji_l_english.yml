 # Annal story subtitles and the Liu Xie / Ma / Liu Chong annals (2026-10-24)
 hd_story_cao_life_desc:0 "Courtesy name Mengde, of Qiao in Pei"
 hd_story_yuan_life_desc:0 "Courtesy name Benchu, of Ruyang in Runan"
 hd_story_dong_zhuo_life_desc:0 "Courtesy name Zhongying, of Lintao in Longxi"
 hd_story_liu_bei_life_desc:0 "Courtesy name Xuande, of Zhuo County in Zhuo Commandery"
 hd_story_gongsun_zan_life_desc:0 "Courtesy name Bogui, of Lingzhi in Liaoxi"
 hd_story_sun_jian_life_desc:0 "The Sun family of Fuchun in Wu Commandery"
 hd_story_liu_biao_life_desc:0 "Courtesy name Jingsheng, of Gaoping in Shanyang"
 hd_story_wang_yun_life_desc:0 "Courtesy name Zishi, of Qi in Taiyuan"
 hd_story_yuan_shu_life_desc:0 "Courtesy name Gonglu, of Ruyang in Runan"
 hd_story_liu_xie_life:0 "Annals of Liu Xie"
 hd_story_liu_xie_life_desc:0 "Courtesy name Bohe, a son of Emperor Ling of Han"
 HD_LIU_XIE_LIFE_STORY_STATUS:0 "Liu Bohe took the throne at the age of nine and has lived in the shadow of overbearing ministers ever since. Other men's soldiers guard the palace gates; whether the Son of Heaven can take back his court depends on whether he can wait for his moment."
 hd_story_ma_life:0 "The Ma Family's Foundation in Xiliang"
 hd_story_ma_life_desc:0 "The Ma family of Maoling in Fufeng"
 HD_MA_LIFE_STORY_STATUS:0 "The Ma family of Maoling in Fufeng descends from Ma Yuan, the Wave-Calming General. Ma Shoucheng has long lived in Liang Province among the Qiang and Hu, and his followers are bold horsemen. The foundation of Xiliang rests in the hands of this father and son."
 hd_story_liu_chong_life:0 "Annals of Liu Chong"
 hd_story_liu_chong_life_desc:0 "A descendant of Emperor Ming of Han, hereditary King of Chen"
 HD_LIU_CHONG_LIFE_STORY_STATUS:0 "Liu Chong, King of Chen, is a superb archer who hits the mark ten times in ten, and he keeps several thousand powerful crossbows. As the realm falls into chaos and many officials abandon their cities, Chen holds firm under his rule; its people stay, and many more come seeking refuge."
 # Chapter names and texts for annals created late for the five phase-one cards (2026-11-03, story has hd_benji_late)
 hd_benji_phase_liu_bei:0 "Restoring the Han"
 hd_benji_phase_cao:0 "Ordering the Central Plains"
 hd_benji_phase_sun:0 "Holding the Southeast"
 hd_benji_phase_yuan:0 "Master of Hebei"
 hd_benji_phase_yuan_shu:0 "Lord of Huainan"
 HD_LIU_BEI_BENJI_BODY_LATE:0 "Liu Xuande, a descendant of Prince Jing of Zhongshan, lost his father young and made a living with his mother weaving mats and selling sandals. Through half a life of hardship he has fallen and risen again and again, winning hearts with his generosity and good faith; there has never been a shortage of men willing to live and die beside him."
 HD_CAO_BENJI_BODY_LATE:0 "Cao Mengde was quick-witted and resourceful from youth, fond of bold exploits and careless of his proper occupation. When the realm fell into chaos, he proved a peerless commander who promoted men for talent alone, and the fate of the Central Plains now rests largely on his shoulders."
