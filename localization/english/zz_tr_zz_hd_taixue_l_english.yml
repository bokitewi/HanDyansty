l_english:
 building_type_TK_HD_TaiXue:0 "Imperial University"
 building_type_TK_HD_TaiXue_desc:0 "An academy founded by the Son of Heaven, where Erudites teach the classics to students; scholars across the realm deem it an honor to study at the Imperial Academy."
 TK_HD_TaiXue:0 "Imperial Academy"
 building_TK_HD_TaiXue_desc:0 "The academy established by the Son of Heaven in the capital. In the time of Emperor Xiaowu, Erudites of the Five Classics were first appointed to teach disciples, and those who mastered a classic could be appointed gentlemen-clerks. Its halls have since been expanded many times, and students carrying their book-boxes gather here from every quarter. The students of the Academy debate the meaning of the classics and judge the worth of men, and from here the tide of Pure Criticism has swelled."
 hd_taixue_student_modifier:0 "Imperial Academy Student"
 hd_taixue_student_modifier_desc:0 "This character's elder presides over the Imperial Academy, allowing them to study alongside the Erudites and students."
 hd_build_taixue_luoyang_decision:0 "Found the Imperial Academy (Luoyang)"
 hd_build_taixue_luoyang_decision_desc:0 "Good governance of the realm rests upon education. Luoyang is the seat of the Son of Heaven and the place scholars everywhere look to. I would choose ground east of the city to raise broad halls, invite masters of the classics and appoint Erudites' disciples, so that scholars who come bearing their books have a place to belong."
 hd_build_taixue_luoyang_decision_tooltip:0 "Build the Imperial Academy east of Luoyang, engage masters of the classics, and enroll students widely."
 hd_build_taixue_changan_decision:0 "Found the Imperial Academy (Chang'an)"
 hd_build_taixue_changan_decision_desc:0 "Chang'an is where the High Emperor founded the dynasty, and where Emperor Xiaowu first established the Imperial Academy, yet the sound of recitation and strings has long fallen silent. I would raise its halls again here and invite masters of the classics, so that the youth of Guanzhong may study close to home."
 hd_build_taixue_changan_decision_tooltip:0 "Rebuild the Imperial Academy at Chang'an, engage masters of the classics, and enroll students widely."
 hd_build_taixue_decision_confirm:0 "Promote learning, nurture talent!"
 building_TK_HD_TaiXue:0 "$TK_HD_TaiXue$"
