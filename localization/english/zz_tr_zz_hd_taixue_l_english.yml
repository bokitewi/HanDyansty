l_english:
 building_type_TK_HD_TaiXue:0 "Imperial Academy"
 building_type_TK_HD_TaiXue_desc:0 "An academy founded by the Son of Heaven, where erudites teach students the classics. Scholars throughout the realm regard study here as a great honor."
 TK_HD_TaiXue:0 "Imperial Academy"
 building_TK_HD_TaiXue_desc:0 "The Son of Heaven's academy in the imperial capital. Emperor Wu first appointed erudites of the Five Classics to teach students; those who mastered the texts could enter service as gentlemen or officials. Its halls have since been enlarged many times, drawing students with their book bundles from every corner of the realm. Here they debate the classics and judge the merits of public figures, giving rise to a vigorous tradition of moral criticism."
 hd_taixue_student_modifier:0 "Study at the Imperial Academy"
 hd_taixue_student_modifier_desc:0 "An elder of this character's family directs the Imperial Academy, allowing them to study alongside its erudites and students."
 hd_build_taixue_luoyang_decision:0 "Found the Imperial Academy (Luoyang)"
 hd_build_taixue_luoyang_decision_desc:0 "Good government rests on education. Luoyang is the Son of Heaven's seat and the place to which scholars across the realm look. I will choose land east of the city, build spacious halls, invite masters of the classics, and establish places for their students, so that those who come carrying their books will find a home."
 hd_build_taixue_luoyang_decision_tooltip:0 "Build the Imperial Academy east of Luoyang, invite masters of the classics, and admit students from afar."
 hd_build_taixue_changan_decision:0 "Found the Imperial Academy (Chang'an)"
 hd_build_taixue_changan_decision_desc:0 "Chang'an is where Emperor Gao established the dynasty and Emperor Wu first founded the Imperial Academy. Sadly, the old sound of recited classics is heard no more. I will rebuild its halls and invite masters of the classics, allowing the young people of Guanzhong to study nearer home."
 hd_build_taixue_changan_decision_tooltip:0 "Rebuild the Imperial Academy in Chang'an, invite masters of the classics, and admit students from afar."
 hd_build_taixue_decision_confirm:0 "Build schools and nurture talent!"
 building_TK_HD_TaiXue:0 "$TK_HD_TaiXue$"
