l_english:
 hd_dc_col_recruit_refugees_decision:0 "Recruit Refugees"
 hd_dc_col_recruit_refugees_decision_desc:0 "Starving refugees wander the land and turn to banditry wherever they go. Rather than wait for them to band together in revolt, let the government enlist the able-bodied as soldiers and settle the old and weak to reclaim wasteland, gaining recruits while pacifying the countryside."
 hd_dc_col_recruit_refugees_decision_tooltip:0 "Enlist refugees as soldiers and settle the old and weak on the land."
 hd_dc_col_recruit_refugees_decision_confirm:0 "Enlist the Refugees"
 hd_dc_col_recruit_refugees_county_tt:0 "Every [county|E] in the Son of Heaven's domain"
 hd_dc_col_refugee_army_name:0 "Refugee Army"
 hd_dc_col_refugees_county_modifier:0 "Refugees Recruited"
 hd_dc_col_refugees_county_modifier_desc:0 "The government has enlisted refugees as soldiers and settled the old and weak, bringing some calm to the region."
 hd_dc_col_qinwang_decision:0 "Edict to Rescue the Throne"
 hd_dc_col_qinwang_decision_desc:0 "Bandits and invaders press in from all sides, and the dynasty is in peril. The Son of Heaven issues an edict written in blood to all the lords of the realm: let every loyal and righteous man raise troops at once and come to the throne's aid against this national calamity."
 hd_dc_col_qinwang_decision_tooltip:0 "Summon the lords of the realm to raise troops and rescue the throne in this national calamity."
 hd_dc_col_qinwang_decision_confirm:0 "Summon the Realm to the Throne's Aid"
 hd_dc_col_qinwang_no_war_tt:0 "You are holding out in a war and have not yet issued an edict to rescue the throne for it"
 hd_dc_col_qinwang_legitimacy_tt:0 "Your [legitimacy|E] is at least #V [ROOT.Char.MakeScope.ScriptValue('hd_dc_col_qinwang_legitimacy_cost_value')|0]#!"
 hd_dc_col_qinwang_invite_tt:0 "The edict will reach the lords still loyal to you, and those who answer will raise troops and join this war. If the imperial army triumphs, the loyalist lords will be richly rewarded."
 hd_dc_col_qinwang_joined_msg:0 "[hd_dc_col_qinwang_joiner.GetShortUIName] Rallies to the Throne"
 hd_dc_col_qinwang_opinion:0 "Rescued the Throne"
 hd_dc_col.0001.t:0 "The Edict to Rescue the Throne Arrives"
 hd_dc_col.0001.desc:0 "The Son of Heaven's envoy gallops through the night and presents an edict with the ink still wet: bandits and invaders press in, the capital is in danger, and [hd_dc_col_qinwang_emperor.GetTitledFirstName] calls on all loyal and righteous men of the realm to come to the rescue.\n\nYour generals exchange glances — will this bring the glory of saving the throne, or merely toil for another's gain?"
 hd_dc_col.0001.a:0 "Our sovereign and father is in peril; how can we stand idle!"
 hd_dc_col.0001.a.tt:0 "You will lead your forces to join the Son of Heaven's side. If the imperial army triumphs, the Son of Heaven will not forget your service:"
 hd_dc_col.0001.b:0 "Hold back and watch"
 hd_dc_col_disaster_relief_decision:0 "Disaster Relief"
 hd_dc_col_disaster_relief_decision_desc:0 "Calamity spreads, and the starving lie dead along the roads. Open the grain of the Great Granary and send envoys to the stricken regions to feed the hungry and rebuild homes, so the people know the court has not abandoned them."
 hd_dc_col_disaster_relief_decision_tooltip:0 "Open the Great Granary to relieve the stricken counties in the Son of Heaven's domain."
 hd_dc_col_disaster_relief_decision_confirm:0 "Open the Granaries"
 hd_dc_col_relief_no_disaster_tt:0 "A county in the Son of Heaven's domain is affected by a natural disaster or famine"
 hd_dc_col_disaster_relief_county_tt:0 "Every stricken [county|E] in the Son of Heaven's domain fully recovers from its damage"
 hd_dc_col_relief_county_modifier:0 "Granary Relief"
 hd_dc_col_relief_county_modifier_desc:0 "The court opened its granaries for relief, and the stricken are grateful."
 hd_dc_col_local_selfstrengthen_decision:0 "Local Self-Strengthening"
 hd_dc_col_local_selfstrengthen_decision_desc:0 "The court cannot even help itself, and bandits rise everywhere. Rather than wait for rescue, raise local militia and repair the fortifications to defend the land and protect the people — though the Son of Heaven may not welcome local power growing strong."
 hd_dc_col_local_selfstrengthen_decision_tooltip:0 "Raise militia and repair fortifications to defend your lands, but the Son of Heaven will grow suspicious of you."
 hd_dc_col_local_selfstrengthen_decision_confirm:0 "Raise Troops for Defense"
 hd_dc_col_militia_active_tt:0 "Not already under #V Local Self-Strengthening#! or #V Authorized Recruitment#!"
 hd_dc_col_selfstrengthen_modifier:0 "Local Self-Strengthening"
 hd_dc_col_selfstrengthen_modifier_desc:0 "Raising local militia to defend the land and protect the people."
 hd_dc_col_selfstrengthen_opinion:0 "Raised Troops Without Leave"
 hd_dc_col_authorize_militia_interaction:0 "Authorize Recruitment"
 hd_dc_col_authorize_militia_interaction_desc:0 "Authorize this vassal to raise troops on their own, allowing them to retain part of their taxes to fund the army."
 hd_dc_col_authorize_militia_notification:0 "[actor.GetTitledFirstName] has authorized you to raise troops on your own, allowing you to retain part of your taxes to fund the army."
 hd_dc_col_authorize_militia_tax_tt:0 "From now on, the court must return half of this vassal's taxes each year to fund their army."
 hd_dc_col_authorized_militia_modifier:0 "Authorized Recruitment"
 hd_dc_col_authorized_militia_modifier_desc:0 "Raising troops by the Son of Heaven's command, retaining part of the taxes to fund the army."
 hd_dc_col_authorized_militia_opinion:0 "Authorized Recruitment"
 hd_dc_col_amnesty_rebels_interaction:0 "Offer Amnesty"
 hd_dc_col_amnesty_rebels_interaction_desc:0 "Send an envoy offering amnesty to this rebel leader, promising office, rank or land in exchange for laying down arms and submitting. If they accept, the rebellion ends in a [white_peace|E]."
 hd_dc_col_amnesty_rebels_notification:0 "[actor.GetTitledFirstName] has sent an envoy promising office, rank and land, urging you to lay down arms and submit."
 hd_dc_col_amnesty_option_office:0 "Grant Office"
 hd_dc_col_amnesty_option_office_desc:0 "Bestow generous gifts of gold and silk and an official post; if they are landless, summon them to court as a courtier."
 hd_dc_col_amnesty_option_fief:0 "Grant Land"
 hd_dc_col_amnesty_option_fief_desc:0 "Grant them the poorest county in your domain (excluding the capital), making them your vassal."
 hd_dc_col_amnesty_office_gold_tt:0 "Has enough gold to pay the rewards of office"
 hd_dc_col_amnesty_must_select_tt:0 "Must choose a form of amnesty: Grant Office or Grant Land"
 hd_dc_col_amnesty_no_fief_tt:0 "Holds at least one county directly besides the capital county"
 hd_dc_col_amnesty_declined_msg:0 "[recipient.GetShortUIName] Rejected the Amnesty"
 hd_dc_col_amnesty_ai_warscore_reason:0 "State of the War"
 hd_dc_col_amnesty_ai_fief_reason:0 "Granted Land"
 hd_dc_col_amnesty_ai_greedy_reason:0 "Greedy for Rewards"
 hd_dc_col_amnesty_ai_content_reason:0 "Content"
 hd_dc_col_amnesty_ai_craven_reason:0 "Fears War"
 hd_dc_col_amnesty_ai_ambitious_reason:0 "Ambitious"
 hd_dc_col_amnesty_ai_arrogant_reason:0 "Arrogant"
 hd_dc_col_amnesty_office_modifier:0 "Granted Office by Amnesty"
 hd_dc_col_amnesty_office_modifier_desc:0 "Accepted amnesty, laid down arms and submitted, and was granted an official post."
 hd_dc_col_amnesty_accepted_opinion:0 "Gratitude for Amnesty"
