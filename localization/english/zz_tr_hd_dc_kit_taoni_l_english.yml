l_english:
 hd_dc_taoni_cb:0 "Suppress Rebellion"
 hd_dc_taoni_cb_war_name:0 "[ATTACKER.GetShortUINamePossessive] War to Suppress Rebellion"
 hd_dc_taoni_cb_victory_desc:0 "[defender.GetShortUIName|U] submits to [attacker.GetShortUIName] again with all their lands and is imprisoned."
 hd_dc_taoni_cb_white_peace_desc:0 "Both sides lay down their arms. [defender.GetShortUIName|U] remains independent, and a five-year truce begins."
 hd_dc_taoni_cb_defeat_desc:0 "The attempt to suppress the rebellion fails. [defender.GetShortUIName|U] remains independent, and a five-year truce begins."
 hd_dc_tunbing_cb:0 "Annexation"
 hd_dc_tunbing_cb_war_name:0 "[ATTACKER.GetShortUINamePossessive] Annexation of [DEFENDER.GetShortUIName]"
 hd_dc_tunbing_cb_victory_desc:0 "[attacker.GetShortUIName|U] seizes all of [defender.GetShortUINamePossessive] personally held landed titles, and [defender.GetHerHis] direct vassals swear fealty to [attacker.GetHerHim]."
 hd_dc_tunbing_cb_white_peace_desc:0 "Both sides lay down their arms and make peace."
 hd_dc_tunbing_cb_defeat_desc:0 "[attacker.GetShortUIName|U] fails to annex the territory and must pay reparations to [defender.GetShortUIName]."
