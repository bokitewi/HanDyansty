l_english:
 # ============================================================
 # 特质：汉家冠带
 # ============================================================
 trait_zgrc_hanjia_guandai:0 "The crown and sash of the Han house"
 trait_zgrc_hanjia_guandai_desc:0 "This character belongs to the Han noble lineage, conducts himself with propriety, and wears attire befitting his station."
 trait_zgrc_hanjia_guandai_character_desc:0 "The people of the Han wear crowns and sashes; they are a civilized folk who observe rites and music, and possess dignity."

 # ============================================================
 # 游戏决议
 # ============================================================
 decision_group_type_zgrc:0 "Resolution on Customs in Han Regions"

 zgrc_debug_distribute_hanjia_guandai_decision:0 "Debug: Redistributing Han Dynasty titles and regalia"
 zgrc_debug_distribute_hanjia_guandai_decision_desc:0 "(Dev) Manually redistribute the \"Han Family Headdress\" trait to all families of Huaxia ritual and music culture."
 zgrc_debug_distribute_hanjia_guandai_decision_tooltip:0 "Redistribute the \"Han Family Headdress and Robes\" trait to all families of Huaxia's rites and music culture."
 zgrc_debug_distribute_hanjia_guandai_decision_confirm:0 "Redistribute the Han family's hats and sashes"

 zgrc_debug_distribute_regional_customs_decision:0 "Debug: Initialize local customs"
 zgrc_debug_distribute_regional_customs_decision_desc:0 "(Debug) Partition according to the Geography Treatise of the Book of Han, and rewrite the territories and title holders of each commandery into their corresponding Han cultural branches."
 zgrc_debug_distribute_regional_customs_decision_tooltip:0 "Convert the territories of each duchy and their titleholders (Chinese Heritage) as well as the court into corresponding Han cultural branches."
 zgrc_debug_distribute_regional_customs_decision_confirm:0 "Initialize local customs across the region"

 # ============================================================
 # 游戏规则
 # ============================================================
 # ============================================================
 # 入乡随俗 —— 久居时限
 # ============================================================
 rule_zgrc_ruxiang_time:0 "Adapt to Local Customs: Duration Limit"
 setting_zgrc_ruxiang_time_5:0 "5th Year"
 setting_zgrc_ruxiang_time_5_desc:0 "Those residing abroad must live continuously for #high 5#! years before they can adapt to local customs."
 setting_zgrc_ruxiang_time_10:0 "10 years"
 setting_zgrc_ruxiang_time_10_desc:0 "Those living as guests in a foreign land must reside continuously for #high 10#! years before they can adapt to local customs."
 setting_zgrc_ruxiang_time_30:0 "30 years"
 setting_zgrc_ruxiang_time_30_desc:0 "Those living as guests in a foreign land must reside continuously for #high 30#! years before they can adapt to local customs."

 # ============================================================
 # 开局初始化 —— 地域风俗/汉家冠带分发
 # ============================================================
 rule_zgrc_init_on_start:0 "Initialize the game"
 setting_zgrc_init_on_start_enabled:0 "Enable"
 setting_zgrc_init_on_start_enabled_desc:0 "At the start of the game, introduce innovations to cultures with the traditions of Huaxia rites and music, and distribute #EMP Han Family Robes and Sashes#! to the ruling families of these cultures. Regional customs and cultural distribution are determined by the initial setup."
 setting_zgrc_init_on_start_disabled:0 "Disabled"
 setting_zgrc_init_on_start_disabled_desc:0 "The opening reforms and distribution of Han family crowns and sashes provided by this module will not be executed. Regional customs, cultural distribution, and the original opening reforms from the main module remain unaffected."

 # ============================================================
 # 革新同步 —— 开关
 # ============================================================
 rule_zgrc_innovation_sync:0 "Reform Synchronization"
 setting_zgrc_innovation_sync_enabled:0 "Enable"
 setting_zgrc_innovation_sync_enabled_desc:0 "Regularly synchronize the #EMP Han Civilization Shared Innovations#! to all Han cultural regions."
 setting_zgrc_innovation_sync_disabled:0 "Disabled"
 setting_zgrc_innovation_sync_disabled_desc:0 "Disable innovation synchronization; each culture must independently research all innovations."

 # ============================================================
 # 革新同步 —— 阈值（每 N 年同步一次）
 # ============================================================
 rule_zgrc_innovation_sync_threshold:0 "Innovation Synchronization: Cycle"
 setting_zgrc_innovation_sync_threshold_1:0 "Every year"
 setting_zgrc_innovation_sync_threshold_1_desc:0 "Execute a synchronization of reforms every #high 1#! years."
 setting_zgrc_innovation_sync_threshold_3:0 "Every 3 years"
 setting_zgrc_innovation_sync_threshold_3_desc:0 "Execute a synchronization of reforms every #high 3#! years."
 setting_zgrc_innovation_sync_threshold_5:0 "Every 5 years"
 setting_zgrc_innovation_sync_threshold_5_desc:0 "Execute a synchronization of reforms every #high 5#! years."

 # ============================================================
 # 消息通知
 # ============================================================
 zgrc_innovation_sync_toast_title:0 "The Xuanhua Reforms have arrived."
 zgrc_innovation_sync_toast_desc:0 "The various states of Huaxia exchange goods with one another; a new system has now reached your realm."
 # ============================================================
 # 新增士兵
 # ============================================================
 zgrc_hanjia_yiyong:0 "Righteous Warriors of the Han"
 zgrc_hanjia_yiyong_flavor:0 "These local militia members are farmers by trade, but when the beacon fires rise, they take up spears and follow. Though their spear formations are simple, they are dense and hard to break; during sieges, they willingly fill moats and charge into enemy lines."

 zgrc_yuyang_tuqi:0 "He Shuo Flying Cavalry"
 zgrc_yuyang_tuqi_flavor:0 "The archery cavalry of the border commanderies north of the Yellow River excels in mounted archery, unleashing a swift and relentless rain of arrows while demonstrating exceptional prowess in pursuing retreating enemies, making it difficult for invading cavalry to escape."
 zgrc_liujun_liangjiazi:0 "Six Commanderies Iron Cavalry"
 zgrc_liujun_liangjiazi_flavor:0 "The sons of respectable families from the six commanderies of Tianshui, Longxi, and others possessed exceptional strength and skill. Having practiced archery since childhood, when they donned heavy armor, they became elite iron cavalry whose charge was unstoppable."
 zgrc_hexi_muqi:0 "Hebei Cavalry"
 zgrc_hexi_muqi_flavor:0 "The Hexi Liangzhou region boasts abundant grass and water, producing light cavalry that are lightly equipped and skilled in archery. They patrol the frontier year-round, moving swiftly like the wind, and excel at raiding and pursuit operations."
 zgrc_jingchu_weishi:0 "Jingchu Guardian"
 zgrc_jingchu_weishi_flavor:0 "The lands of Jing and Chu have long been renowned for their powerful crossbows, with many skilled archers among the people in the mountains and marshes. The guards formed an array along the water, unleashed volley fire from their repeating crossbows, and a rain of arrows blanketed the sky."
 zgrc_wuyue_jianshi:0 "Wuyue Swordsman"
 zgrc_wuyue_jianshi_flavor:0 "The lands of Wu and Yue have long revered the sword. These warriors strike with the speed of a gale in close combat, excel at charging through forests and marshes to engage in fierce battles, and are both brave and unafraid of death."
 zgrc_wuling_caiguan:0 "Five Tombs Material Officers"
 zgrc_wuling_caiguan_flavor:0 "Among the Five Mausoleums of Guanzhong, wealthy and powerful families hold vast lands; their sons are selected as material officers. These officers wield powerful crossbows, wear heavy armor, and carry shields like a wall, earning them the title of the elite forces of Guanzhong."
 zgrc_zhongyuan_jieshi:0 "Central Plains Scholar"
 zgrc_zhongyuan_jieshi_flavor:0 "The one in front is a Jia. The Zhongyuan Jia warriors wear light armor and move swiftly, coming and going like the wind; they excel at hand-to-hand combat in fields and alleys. When gathered, they form an array; when scattered, they are hard to find."

 zgrc_beiwei_zhongbu:0 "Beiwai Heavy Infantry"
 zgrc_beiwei_zhongbu_flavor:0 "The Beiwu soldiers wear heavy armor like a wall; people say it is easy to shake a mountain but hard to shake this army. Steady as a mountain when facing battle, they crush the enemy's vanguard upon advancing."
 zgrc_beiwei_zhongqi:0 "Beiwai Heavy Cavalry"
 zgrc_beiwei_zhongqi_flavor:0 "The Beiwu cavalry's iron armor stands like a forest; it is said that shaking the mountain is easy, but shaking this army is difficult. In battle, their presence is as thunderous; when they advance, they trample through enemy camps."

 # 华夏锐士 / 华夏突骑 —— 汉传兵法基础兵种（独立兵种）
 zgrc_han_ruishi:0 "Huaxia Sharp Swordsman"
 zgrc_han_ruishi_flavor:0 "The sharp warrior clad in heavy armor wields a double-edged blade, combining defense and offensive power; he excels at close-quarters combat, cleaving horses and breaking enemy formations to cause the vanguard of opposing forces to crumble."
 zgrc_han_tuqi:0 "Huaxia Heavy Cavalry"
 zgrc_han_tuqi_flavor:0 "Elite riders clad in heavy armor charge through enemy formations like thunder crashing down. They can crush enemy lines during charges on open plains and shield the flanks of friendly troops."

