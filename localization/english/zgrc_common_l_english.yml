 # ============================================================
 # 汉文明基础兵种革新
 # ============================================================
 innovation_zgrc_han_bingfa:0 "Huaxia Military Art"
 innovation_zgrc_han_bingfa_desc:0 "Following the teachings of Li Weigong's Qiongdui, military arts education is passed down without interruption; Tang dynasty martial preparations: Mo Dao cavalry sabers and Xuan Jia elite armor."
 innovation_zgrc_han_wubei:0 "Imperial Armaments"
 innovation_zgrc_han_wubei_desc:0 "The art of forging iron has greatly advanced, and heavy-armed infantry and cavalry now form regiments—the Beiwui Heavy Infantry and Beiwui Heavy Cavalry, the pinnacle of the Song dynasty's military equipment."

 # ============================================================
 # 领地 modifier
 # ============================================================
 zgrc_rende_modifier:0 "Benevolent and Virtuous Gentleman"
 zgrc_rende_modifier_desc:0 "The rebel forces came to surrender; unable to drive them into the fray, my reputation for benevolence and virtue was greatly enhanced."
 zgrc_gouquan_modifier:0 "preserve one's life"
 zgrc_gouquan_modifier_desc:0 "War is perilous, and battle brings danger; wisdom lies in preserving oneself. Though one may thus live out one's natural years in peace, to remain hidden when comrades rush into peril weighs heavily on the heart."
