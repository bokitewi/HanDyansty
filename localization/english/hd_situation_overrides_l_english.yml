l_english:
 # 原版丝路参与组说明中的旧六区引用必须覆盖
 silk_road_situation_participant_group_china_realm_desc:0 "This character is a non-[nomadic|E][independent_ruler|E] who holds territory in the eastern section of the Silk Road."
 silk_road_situation_participant_group_silk_road_domain_desc:0 "This character is non-[nomadic|E][ruler|E], with its [domain|E] directly located on [GetGeographicalRegion('dlc_tgp_silk_road_route_region').GetName]."
 silk_road_situation_participant_group_silk_road_realm_desc:0 "This character is non-[nomadic|E][ruler|E], and part of its [realm|E] is connected to [GetGeographicalRegion('dlc_tgp_silk_road_route_region').GetName]."
 silk_road_situation_participant_group_silk_road_periphery_desc:0 "This character is non-[nomadic|E][ruler|E], located within [GetGeographicalRegion('tgp_silk_road_region').GetName], but does not belong to the more direct Silk Road participation group."
 visit_silk_road_market_decision_changan:0 "$building_changan_market_01$ #weak （[GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_eastern_section').MakeScope.Var('innovation').CultureInnovationType.GetName]）#!"

 # 仍在使用的运河催化剂改用四区键
 catalyst_silk_road_china_grand_canal_expanded_desc:0 "$great_project_type_grand_canals$[great_project|E] completed ([GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_eastern_section').GetName]) #weak  #!"
 catalyst_silk_road_china_grand_canal_expanded_secondary_desc:0 "$great_project_type_grand_canals$[great_project|E] completed ([GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_middle_northern_route').GetName], [GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_middle_southern_route').GetName]) #weak  #!"
 catalyst_silk_road_china_grand_canal_expanded_tertiary_desc:0 "$great_project_type_grand_canals$[great_project|E] completed ([GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_western_section').GetName]) #weak  #!"

 # 保留原版大草原显示名，只覆盖三个项目地图说明
 the_great_steppe_sub_region_steppe_west_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak The western grasslands cover the commanderies of Liangzhou. The Hexi Corridor and its adjacent border regions connect the Central Plains with the Western Regions, where fluctuations in water and pasture, droughts, and severe cold continuously affect local herds and migrations. #!"
 the_great_steppe_sub_region_steppe_central_desc:0 "The central grasslands cover the various commanderies of Bingzhou. Located between the agricultural heartland and the northern steppes, mountains, river valleys, and frontier passes together shaped a nomadic lifestyle following water and pasture. $SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak  #!"
 the_great_steppe_sub_region_steppe_east_desc:0 "The eastern grasslands cover the commanderies of Youzhou. The northern and southern slopes of the Yanshan Mountains, along with the western frontier of Liaodong, form the gateway to the northeastern grasslands, where seasonal changes influence pasture fertility and the migration direction of nomadic forces. $SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak  #!"
