 HD_PARTY_DEMAND_LOYALTY_TT:0 "#T Demand Fealty#!\nUse [influence|E], [legitimacy|E], [prestige|E] or a [hook|E] as leverage to force this faction to adopt Revere the Sovereign. If it submits, it will not change course again until its leader or the ruler changes; if it refuses, it will turn against the ruler and will not relent for five years.\n#weak A demand can be made of the same faction only once every five years.#!"
