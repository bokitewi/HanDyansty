 hd_party_attitude_support_desc:0 "Leads the faction in backing the liege, placing it at their service."
 hd_party_attitude_neutral_desc:0 "The faction keeps the liege at arm's length, waiting to see how things unfold."
 hd_party_attitude_oppose_desc:0 "Leads the faction in defying the liege, obstructing them at every turn."
 HD_PARTY_FAVORED_TT:0 "#T Favored#!\nThe ruler relies on this faction: the ruler shares in whatever boons and burdens the faction currently bears; its members gain #P +10#! opinion of the ruler and #P +15%#! appointment score."
