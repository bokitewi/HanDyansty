 hd_party_policy_cost_huanguan_pre_high_modifier_desc:0 "Proscribing the Eunuch faction sends the imperial guards out in every direction, at no small cost."
 hd_party_attitude_waiqi_support_modifier:0 "Consort Kin Support"
 hd_party_attitude_waiqi_support_modifier_desc:0 "The empress's kin back this ruler, and imperial relatives and courtiers rally to their side."
 hd_party_attitude_waiqi_oppose_modifier:0 "Consort Kin Opposition"
 hd_party_attitude_waiqi_oppose_modifier_desc:0 "The empress's kin defy this ruler, and imperial relatives and courtiers grow restless."
