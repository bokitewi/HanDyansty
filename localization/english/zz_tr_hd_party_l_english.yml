 hd_party_policy_cost_waiqi_pre_high_modifier_desc:0 "Proscribing the Consort Kin faction sends the imperial guards out in every direction, at no small cost."
 hd_party_attitude_wuxun_support_modifier:0 "Military Merit Support"
 hd_party_attitude_wuxun_support_modifier_desc:0 "The officers and soldiers back this ruler, and the armies gladly serve them."
 hd_party_attitude_wuxun_oppose_modifier:0 "Military Merit Opposition"
 hd_party_attitude_wuxun_oppose_modifier_desc:0 "The officers and soldiers have turned from this ruler, and army morale is crumbling."
 hd_party_policy_cost_wuxun_inf_low_modifier:0 "Managing the Military Merit Faction"
 hd_party_policy_cost_wuxun_inf_low_modifier_desc:0 "To raise or curb the Military Merit faction, the whole court must constantly be greased."
 hd_party_policy_cost_wuxun_inf_high_modifier:0 "Managing the Military Merit Faction"
 hd_party_policy_cost_wuxun_inf_high_modifier_desc:0 "Proscribing the Military Merit faction sends the imperial guards out in every direction, at no small cost."
 hd_party_policy_cost_wuxun_pre_low_modifier:0 "Managing the Martial Merit Faction"
 hd_party_policy_cost_wuxun_pre_low_modifier_desc:0 "Propping up or curbing the Martial Merit faction requires constant bribes throughout the court."
 hd_party_policy_cost_wuxun_pre_high_modifier:0 "Managing the Martial Merit Faction"
 hd_party_policy_cost_wuxun_pre_high_modifier_desc:0 "Suppressing the Martial Merit faction sends imperial agents out in every direction, at no small cost."
 hd_party_attitude_shizu_support_modifier:0 "Gentry Support"
 hd_party_attitude_shizu_support_modifier_desc:0 "The great gentry houses champion this lord, lending both wealth and renown."
 hd_party_attitude_shizu_oppose_modifier:0 "Gentry Opposition"
 hd_party_attitude_shizu_oppose_modifier_desc:0 "The great gentry houses stand against this lord, and his decrees are often obstructed."
 hd_party_policy_cost_shizu_inf_low_modifier:0 "Managing the Gentry Faction"
 hd_party_policy_cost_shizu_inf_low_modifier_desc:0 "Propping up or curbing the Gentry faction requires constant bribes throughout the court."
