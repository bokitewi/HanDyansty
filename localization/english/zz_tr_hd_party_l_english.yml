l_english:
 HD_PARTY_GROUP_NAME_HUANGUAN:0 "Eunuchs"
 HD_PARTY_GROUP_NAME_WAIQI:0 "Consort Kin"
 HD_PARTY_GROUP_NAME_WUXUN:0 "Military Merit"
 HD_PARTY_GROUP_NAME_SHIZU:0 "Gentry Clans"
 HD_PARTY_GROUP_NAME_HANMEN:0 "Humble Origins"
 HD_PARTY_STANCE_ZUNWANG_TT:0 "#T Revere the Sovereign#!\nThis faction honors the ruler above all: its members form no factions, never rise against their liege, gain #P +15#! opinion of their liege, and rarely scheme against them; the liege meets little resistance when arresting its members; its military men gladly follow the ruler to war, and its civil officials serve as governors with #P +10%#! efficiency. Its members who are vassals mostly hold the 'Courtly' [vassal_stance|E]."
 hd_party_stance_zunwang:0 "Revere the Sovereign"
 HD_PARTY_STANCE_KAITUO_TT:0 "#T Expansion#!\nThis faction champions expanding the realm: when petitioning the ruler or debating state affairs, it mostly seeks larger armies, more military garrisons, and more protectorates; its members who are vassals mostly hold the 'Belligerent' [vassal_stance|E]."
 hd_party_stance_kaituo:0 "Expansion"
 HD_PARTY_STANCE_JINQU_TT:0 "#T Progress#!\nThis faction champions reform: its petitions and debates mostly seek more government offices, examinations to recruit scholars, and higher salaries; its members who are vassals mostly hold the 'Parochial' [vassal_stance|E]."
 hd_party_stance_jinqu:0 "Progress"
 HD_PARTY_STANCE_SHOUJIU_TT:0 "#T Tradition#!\nThis faction champions upholding ancestral institutions: its petitions and debates mostly concern the rules of retirement, the expenses of the bureaus, and the qualifications for office; its members who are vassals mostly hold the 'Glory Hound' [vassal_stance|E]."
 hd_party_stance_shoujiu:0 "Tradition"
 HD_PARTY_STANCE_ZHONGLI_TT:0 "#T Neutral#!\nThis faction stays out of disputes and holds no fixed position on state affairs."
 hd_party_stance_zhongli:0 "Neutral"
 HD_PARTY_RELATION_COOP_TT:0 "#T Cooperation#!\nThe two factions hold similar stances (Progress and Expansion, Neutral and Tradition, Revere the Sovereign and those supporting the ruler); their leaders and top three figures are on friendly terms, each gaining #P +10#! opinion of the other."
 HD_PARTY_RELATION_NONE_TT:0 "#T None#!\nThe two factions neither oppose nor cooperate with each other."
 HD_PARTY_RELATION_HOSTILE_TT:0 "#T Hostility#!\nThe two factions hold opposing stances (Progress and Tradition, Expansion and Tradition, Revere the Sovereign and those opposing the ruler); their leaders and top three figures detest one another, each suffering #N -15#! opinion of the other, and factional strife may arise from it."
 HD_PARTY_POLICY_BAN_TT:0 "#T Political Maneuver: Proscribe#!\nProscribe this faction and bar its members from office: its members suffer #N -50%#! influence, #N -30%#! prestige and legitimacy gain, #N -50#! appointment and succession score, and #N -30#! opinion of the ruler; the ruler may arrest its members at will, and its members and their courtiers are more likely to leave.\nMonthly cost: 3 influence (5 prestige for governments without influence).\n\n#weak Once decreed, a policy cannot be changed for five years (returning to Neutral is exempt).#!"
 HD_PARTY_POLICY_RESTRICT_TT:0 "#T Political Maneuver: Restrict#!\nSuppress this faction: its members suffer #N -20%#! influence, #N -10%#! prestige and legitimacy gain, #N -20#! appointment and succession score, and #N -10#! opinion of the ruler.\nMonthly cost: 1 influence (2 prestige for governments without influence).\n\n#weak Once decreed, a policy cannot be changed for five years (returning to Neutral is exempt).#!"
 HD_PARTY_POLICY_NEUTRAL_TT:0 "#T Political Maneuver: Neutral#!\nNeither favor nor curb it; let things take their course. No cost.\n\n#weak Once decreed, a policy cannot be changed for five years (returning to Neutral is exempt).#!"
 HD_PARTY_POLICY_PROMOTE_TT:0 "#T Political Maneuver: Promote#!\nSupport this faction: its members gain #P +20%#! influence, #P +10%#! prestige and legitimacy gain, #P +20#! appointment and succession score, and #P +10#! opinion of the ruler.\nMonthly cost: 1 influence (2 prestige for governments without influence).\n\n#weak Once decreed, a policy cannot be changed for five years (returning to Neutral is exempt).#!"
 HD_PARTY_ATTITUDE_HUANGUAN_TT:0 "#T Eunuchs' Attitude Toward the Ruler: [SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_huanguan_attitude').GetFlagName, 'support' ), 'hd_party_attitude_support_name', SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_huanguan_attitude').GetFlagName, 'oppose' ), 'hd_party_attitude_oppose_name', 'hd_party_attitude_neutral_name' ) )]#!\nSupport Score: [Character.MakeScope.Var('hd_party_huanguan_score').GetValue|0] (at ≥ 50 it turns to Support, at ≤ -50 to Opposition; a supporting faction below 20 or an opposing one above -20 returns to Neutral)\n\nWhile supporting, the ruler gains: influence gain #P +15%#!, dread baseline #P +10#!, hostile scheme success chance #P +10%#!\nWhile opposing, the ruler suffers: influence gain #N -22.5%#!, dread baseline #N -15#!, hostile scheme success chance #N -15%#!\n\n#weak A faction holding less than a tenth of the court's power matters little either way.#!"
 HD_PARTY_PANEL_POWER_HUANGUAN:0 "Power [Character.MakeScope.Var('hd_party_huanguan_power').GetValue|0] · Share [Character.MakeScope.Var('hd_party_huanguan_share').GetValue|0]%"
 HD_PARTY_PANEL_SATISFACTION_HUANGUAN:0 "Satisfaction: [Character.MakeScope.Var('hd_party_huanguan_satisfaction').GetValue|0]"
 HD_PARTY_OVERVIEW_NUMBERS_HUANGUAN:0 "Satisfaction [Character.MakeScope.Var('hd_party_huanguan_satisfaction').GetValue|0] · Share [Character.MakeScope.Var('hd_party_huanguan_share').GetValue|0]%"
 HD_PARTY_ATTITUDE_WAIQI_TT:0 "#T Consort Kin's Attitude Toward the Ruler: [SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_waiqi_attitude').GetFlagName, 'support' ), 'hd_party_attitude_support_name', SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_waiqi_attitude').GetFlagName, 'oppose' ), 'hd_party_attitude_oppose_name', 'hd_party_attitude_neutral_name' ) )]#!\nSupport Score: [Character.MakeScope.Var('hd_party_waiqi_score').GetValue|0] (at ≥ 50 it turns to Support, at ≤ -50 to Opposition; a supporting faction below 20 or an opposing one above -20 returns to Neutral)\n\nWhile supporting, the ruler gains: claimant faction discontent growth #P -30%#!, governor efficiency #P +5%#!, direct vassal and courtier opinion #P +5#!\nWhile opposing, the ruler suffers: claimant faction discontent growth #N +45%#!, governor efficiency #N -7.5%#!, direct vassal and courtier opinion #N -7.5#!\n\n#weak A faction holding less than a tenth of the court's power matters little either way.#!"
 HD_PARTY_PANEL_POWER_WAIQI:0 "Power [Character.MakeScope.Var('hd_party_waiqi_power').GetValue|0] · Share [Character.MakeScope.Var('hd_party_waiqi_share').GetValue|0]%"
 HD_PARTY_PANEL_SATISFACTION_WAIQI:0 "Satisfaction: [Character.MakeScope.Var('hd_party_waiqi_satisfaction').GetValue|0]"
