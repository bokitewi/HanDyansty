 hd_party_debate_disgrace_modifier_desc:0 "Once seconded a failed stance debate, and is now slighted by fellow partisans."
 hd_party_dominant_modifier:0 "Dominant Faction"
 hd_party_dominant_modifier_desc:0 "One faction's power scorches the heavens, and the ruler's authority is hamstrung."
 hd_party_chain_huanguan_power_modifier:0 "Eunuch Meddling"
 hd_party_chain_huanguan_power_modifier_desc:0 "The Palace Regular Attendants handle the memorials in the ruler's stead, and palace orders issue from eunuchs."
 hd_party_chain_shizu_land_member_modifier:0 "Annexing Estates"
 hd_party_chain_shizu_land_member_modifier_desc:0 "The tide of land annexation by the powerful is set, and their estates flourish by the day."
 hd_party_chain_shizu_land_ruler_modifier:0 "The People Lose Their Land"
 hd_party_chain_shizu_land_ruler_modifier_desc:0 "The Gentry Clans annex land, and the common folk are full of grievance."
 hd_party_chain_wuxun_border_member_modifier:0 "Frontier General Hoards Troops"
 hd_party_chain_wuxun_border_member_modifier_desc:0 "The frontier general hoards troops for their own ends, and their private retinue grows by the day."
 hd_party_chain_wuxun_border_ruler_modifier:0 "Unruly Frontier Garrisons"
 hd_party_chain_wuxun_border_ruler_modifier_desc:0 "Frontier generals hoard troops, and orders struggle to reach them."
 hd_party_chain_wuxun_arrogant_modifier:0 "Overbearing Soldiery"
 hd_party_chain_wuxun_arrogant_modifier_desc:0 "The military men grow overbearing on their merits, and the court's commands go unheeded."
 hd_party_attitude_huanguan_support_modifier:0 "Eunuch Support"
 hd_party_attitude_huanguan_support_modifier_desc:0 "The Eunuch faction backs this ruler; within and without the palace, every eye and ear serves them."
 hd_party_attitude_huanguan_oppose_modifier:0 "Eunuch Opposition"
 hd_party_attitude_huanguan_oppose_modifier_desc:0 "The Eunuch faction has turned from this ruler, obstructing them at every turn within the palace."
 hd_party_policy_cost_huanguan_inf_low_modifier:0 "Managing the Eunuch Faction"
 hd_party_policy_cost_huanguan_inf_low_modifier_desc:0 "To raise or curb the Eunuch faction, the whole court must constantly be greased."
 hd_party_policy_cost_huanguan_inf_high_modifier:0 "Managing the Eunuch Faction"
 hd_party_policy_cost_huanguan_inf_high_modifier_desc:0 "Proscribing the Eunuch faction sends the imperial guards out in every direction, at no small cost."
 hd_party_policy_cost_huanguan_pre_low_modifier:0 "Managing the Eunuch Faction"
