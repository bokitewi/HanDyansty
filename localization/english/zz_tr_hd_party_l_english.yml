 HD_PARTY_ATTITUDE_WUXUN_TT:0 "#T Military Merit's Attitude Toward the Ruler: [SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_wuxun_attitude').GetFlagName, 'support' ), 'hd_party_attitude_support_name', SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_wuxun_attitude').GetFlagName, 'oppose' ), 'hd_party_attitude_oppose_name', 'hd_party_attitude_neutral_name' ) )]#!\nSupport Score: [Character.MakeScope.Var('hd_party_wuxun_score').GetValue|0] (at ≥ 50 it turns to Support, at ≤ -50 to Opposition; a supporting faction below 20 or an opposing one above -20 returns to Neutral)\n\nWhile supporting, the ruler gains: levies #P +15%#!, levy reinforcement #P +20%#!, men-at-arms regiment limit #P +1#!, men-at-arms maintenance #P -10%#!\nWhile opposing, the ruler suffers: levies #N -22.5%#!, levy reinforcement #N -30%#!, men-at-arms regiment limit #N -2#!, men-at-arms maintenance #N +15%#!\n\n#weak A faction holding less than a tenth of the court's power matters little either way.#!"
 HD_PARTY_PANEL_POWER_WUXUN:0 "Power [Character.MakeScope.Var('hd_party_wuxun_power').GetValue|0] · Share [Character.MakeScope.Var('hd_party_wuxun_share').GetValue|0]%"
