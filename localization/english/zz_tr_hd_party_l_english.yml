 activity_hd_party_debate:0 "Debate of Positions"
 activity_hd_party_debate_plural:0 "Debates of Positions"
 activity_hd_party_debate_desc:0 "Summon your fellow partisans and the leaders of the factions to debate your faction's position before the court. Win, and the faction changes course; lose, and the instigator's reputation is ruined."
 activity_hd_party_debate_selection_tooltip:0 "Launch a Debate of Positions to try to change your faction's political stance"
 activity_hd_party_debate_destination_selection:0 "The debate can only be held in your capital or your liege's capital."
 activity_hd_party_debate_host_desc:0 "\n$BULLET_WITH_TAB$Victory: your faction adopts the new position, you gain [prestige|E], and you replace the current faction leader\n$BULLET_WITH_TAB$Defeat: you lose [prestige|E], may not lead the faction or call another court debate for years, and your faction's [movement_power|E] suffers"
 activity_hd_party_debate_guest_desc:0 "\n$BULLET_WITH_TAB$Supporters: if the debate is won, gain [prestige|E] and a bond with the instigator; if lost, lose standing within the faction\n$BULLET_WITH_TAB$Opponents: if the instigator loses, gain [prestige|E]"
 activity_hd_party_debate_predicted_cost:0 "Predicted Cost"
 activity_hd_party_debate_guest_help_text:0 "Invited guests may support the instigator, stand aside, or rise in opposition."
 hd_party_debate_province_desc:0 "#P +Capital#!"
 hd_party_debate_location_desc:0 "Can only be held in your capital or your liege's capital"
 hd_debate_target:0 "Target Position"
 hd_debate_target_desc:0 "The position you wish your faction to adopt"
 hd_target_zunwang:0 "Adopt Revere the Throne"
 hd_target_zunwang_desc:0 "Honor the sovereign: partisans form no cliques, never raise arms against their superiors, and serve their lords with respect; military men follow their lord to war, and civil officials devote themselves to governing the people."
 hd_target_kaituo:0 "Adopt Expansion"
 hd_target_kaituo_desc:0 "Champion expanding the realm: petitions and proposals that mostly seek larger armies, more garrisons, and more protectorates."
 hd_target_jinqu:0 "Adopt Progress"
 hd_target_jinqu_desc:0 "Champion reform: petitions and proposals that mostly seek more offices, examinations to select officials, and higher salaries."
 hd_target_shoujiu:0 "Adopt Tradition"
 hd_target_shoujiu_desc:0 "Champion ancestral institutions: petitions and proposals focused mostly on retirement rules, ministry expenditures, and qualifications for office."
 hd_target_zhongli:0 "Adopt Neutrality"
 hd_target_zhongli_desc:0 "Stay out of disputes and hold no fixed view on affairs of state."
 hd_debate_phase_prep:0 "Preparation"
 hd_debate_phase_prep_desc:0 "Each side rushes about forming alliances and courting the undecided."
 hd_debate_phase_early:0 "Early Debate"
 hd_debate_phase_early_desc:0 "Both sides cite the classics, trading attack and defense."
 hd_debate_phase_late:0 "Late Debate"
 hd_debate_phase_late_desc:0 "Victory is near to being decided, or the sovereign's judgment may be needed."
 hd_debate_support:0 "Support"
 hd_debate_neutral:0 "Neutral"
 hd_debate_oppose:0 "Oppose"
 hd_debate_host_intent:0 "Lead the Debate"
 hd_debate_host_intent_desc:0 "You argue that your faction should adopt a new position."
 hd_debate_support_intent:0 "Support"
 hd_debate_support_intent_desc:0 "You back the instigator's proposal."
 hd_debate_neutral_intent:0 "Neutral"
 hd_debate_neutral_intent_desc:0 "You merely stand aside and watch."
 hd_debate_oppose_intent:0 "Oppose"
 hd_debate_oppose_intent_desc:0 "You argue that your faction should keep its current position."
 hd_party_debate_conclusion_success:0 "The Debate of Positions ended in victory for the instigator's side, and the faction has adopted its new position."
 hd_party_debate_conclusion_fail:0 "The Debate of Positions ended in defeat for the instigator's side."
 hd_party_debate_conclusion_default:0 "The Debate of Positions has ended."
 HD_DEBATE_SUPPORT_LABEL:0 "Chief Supporters"
 HD_DEBATE_SUPPORT_LABEL_HOVER:0 "#T Supporters#!\nThose who favor changing the faction's position."
 HD_DEBATE_SUPPORT_OTHER_LABEL:0 "Other Supporters: [Subtract_int32( GetDataModelSize( ActivityWindow.GetCurrentPhaseGuestSubset( 'hd_debate_support' ) ), '(int32)3' )]"
 HD_DEBATE_SUPPORT_OTHER_NONE:0 "Other Supporters: 0"
 HD_DEBATE_SUPPORT_OTHER_HOVER:0 "#T Supporters#!\nThose who favor changing the faction's position."
 HD_DEBATE_OPPOSE_LABEL:0 "Chief Opponents"
 HD_DEBATE_OPPOSE_LABEL_HOVER:0 "#T Opponents#!\nThose who argue the faction should keep its current position."
 HD_DEBATE_OPPOSE_OTHER_LABEL:0 "Other Opponents: [Subtract_int32( GetDataModelSize( ActivityWindow.GetCurrentPhaseGuestSubset( 'hd_debate_oppose' ) ), '(int32)3' )]"
 HD_DEBATE_OPPOSE_OTHER_NONE:0 "Other Opponents: 0"
 HD_DEBATE_OPPOSE_OTHER_HOVER:0 "#T Opponents#!\nThose who argue the faction should keep its current position."
 hd_party_debate.0010.t:0 "The Debate Approaches"
 hd_party_debate.0010.desc:0 "The court debate is still a month away, yet undercurrents already churn through the court. Your fellow partisans await your rallying cry, the neutrals still watch and wait, and your rivals' retainers are rushing about in every direction."
 hd_party_debate.0010.a:0 "Invite all fellow partisans to plan together"
 hd_party_debate.0010.b:0 "Call on the neutrals in person"
 hd_party_debate.0010.c:0 "Spread rumors in secret"
 hd_party_debate.0020.t:0 "Citing the Classics"
 hd_party_debate.0020.desc:0 "[hd_party_debate_rival.GetShortUIName] challenges you, invoking the great principles of the Spring and Autumn Annals, and every eye in the hall turns to you."
 hd_party_debate.0020.a:0 "Answer back with the meaning of the classics"
 hd_party_debate.0021.t:0 "Pure Criticism Rallies"
 hd_party_debate.0021.desc:0 "Hearing the news, the students of the Imperial Academy rush to champion your cause, and the voice of Pure Criticism rings without pause."
 hd_party_debate.0021.a:0 "The people's hearts can be put to use"
 hd_party_debate.0022.t:0 "Winning Favor over Wine"
 hd_party_debate.0022.desc:0 "You plan to hold a banquet at your residence to entertain your colleagues. When the wine flows and spirits warm, you might win a little more support."
 hd_party_debate.0022.a:0 "Throw a lavish feast and invite all colleagues"
 hd_party_debate.0022.b:0 "That will not be necessary"
 hd_party_debate.0023.t:0 "Rebuttal Before the Court"
 hd_party_debate.0023.desc:0 "[hd_party_debate_rival.GetShortUIName] confronts you before the court, denouncing your words as contrary to ancestral institutions."
 hd_party_debate.0023.a:0 "Refute them with reason"
 hd_party_debate.0023.b:0 "Avoid their edge for now"
 hd_party_debate.0024.t:0 "Invoking Ancestral Law"
 hd_party_debate.0024.desc:0 "The opponents invoke the established laws of the ancestors one after another, and the conservative argument gains the upper hand for a time."
 hd_party_debate.0024.a:0 "Let them gloat for now"
 hd_party_debate.0025.t:0 "A Clamor in the Hall"
 hd_party_debate.0025.desc:0 "Murmurs fill the hall below, and someone, unable to restrain themselves, declares their position on the spot."
 hd_party_debate.0025.a:0 "Let us see which way the wind blows"
 hd_party_debate.0030.t:0 "The Decisive Debate"
 hd_party_debate.0030.desc:0 "The debate has reached its critical moment. You face [hd_party_debate_rival.GetShortUIName] head-on, and victory or defeat hangs on this exchange."
 hd_party_debate.0030.a:0 "Give it everything"
 hd_party_debate.0031.t:0 "Turncoat at the Crucial Moment"
 hd_party_debate.0031.desc:0 "As the court debate rages, someone suddenly rises from their seat and changes sides."
 hd_party_debate.0031.a:0 "Who could have foreseen it"
 hd_party_debate.0032.t:0 "Storming Out"
 hd_party_debate.0032.desc:0 "Bested in argument, [hd_party_debate_rival.GetShortUIName] shakes out their sleeves and storms off, and the opposition's spirit is badly broken."
 hd_party_debate.0032.a:0 "Splendid"
 hd_party_debate.0033.t:0 "Arguing with Conviction"
 hd_party_debate.0033.desc:0 "The audience is half convinced, half doubtful. If you are willing to stake your own renown on it, you might sway more of them."
 hd_party_debate.0033.a:0 "Stake my own renown on it"
 hd_party_debate.0033.b:0 "Not necessary for now"
 hd_party_debate.0040.t:0 "In the Midst of Debate"
 hd_party_debate.0040.desc:0 "The court debate rages, and your side needs help."
 hd_party_debate.0040.a:0 "Open your purse to help"
 hd_party_debate.0040.b:0 "Lend your renown to their cause"
 hd_party_debate.0040.c:0 "Wait and see"
 hd_party_debate.0050.t:0 "The Sovereign's Judgment"
 hd_party_debate.0050.desc:0 "The Debate of Positions launched by [host.GetShortUIName] is deadlocked, and both sides await your word. Should you speak, the outcome will be all but decided."
 hd_party_debate.0050.a:0 "The instigator speaks rightly"
 hd_party_debate.0050.b:0 "The opponents speak rightly"
 hd_party_debate.0050.c:0 "Express no opinion"
 hd_party_debate.0090.t:0 "Debate Won"
 hd_party_debate.0090.desc:0 "The court debate has ended in victory for your side. From this day forth, the faction adopts its new position."
 hd_party_debate.0090.a:0 "As all had hoped"
 hd_party_debate.0091.t:0 "Debate Lost"
 hd_party_debate.0091.desc:0 "The court debate has ended in defeat for your side. Your fellow partisans speak ill of you, and for years to come you will find it hard to lead your peers."
 hd_party_debate.0091.a:0 "Such is fate"
 hd_party_debate.0010.b.success:0 "Won over a neutral"
 hd_party_debate.0010.b.fail:0 "Returned empty-handed"
 hd_party_debate.0010.c.success:0 "An opponent wavers"
 hd_party_debate.0010.c.fail:0 "The rumors were exposed, bringing disgrace upon you"
 hd_party_debate.0020.success:0 "Answered fluently, to the admiration of all present"
 hd_party_debate.0020.fail:0 "Left momentarily speechless"
 hd_party_debate.0023.success:0 "Rebutted them into silence"
 hd_party_debate.0023.fail:0 "Your own flaw was seized upon instead"
 hd_party_debate.0030.success:0 "Your side wins a great victory"
 hd_party_debate.0030.fail:0 "Your side falls behind"
 hd_party_debate_gain_tt:0 "Your side gains some momentum."
 hd_party_debate_loss_tt:0 "Your side loses some momentum."
 hd_party_debate_help_tt:0 "The side you belong to gains some momentum."
 hd_party_debate.0010.a.tt:0 "Your fellow partisans act in concert, and some neutrals may come over on hearing of it."
 hd_party_debate.0025.support_tt:0 "A neutral sides with you."
 hd_party_debate.0025.oppose_tt:0 "A neutral sides with your opponents."
 hd_party_debate.0031.support_tt:0 "An opponent defects to your side at the crucial moment."
 hd_party_debate.0031.oppose_tt:0 "A supporter defects to the opposing side at the crucial moment."
 hd_party_debate.0032.a.tt:0 "The opponents have lost their mainstay, and their spirit is badly broken."
 hd_party_debate.0050.a.tt:0 "With your word, the instigator's side greatly improves its odds."
 hd_party_debate.0050.b.tt:0 "With your word, the opposing side greatly improves its odds."
 hd_party_debate_arb_support_cost_tt:0 "Factions opposed to the position they seek are bound to resent you."
 hd_party_debate_arb_oppose_cost_tt:0 "The faction that launched the court debate is bound to resent you."
