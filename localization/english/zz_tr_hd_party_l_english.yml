 hd_party_hostile_opinion:0 "Faction Rivalry"
 hd_party_coop_opinion:0 "Faction Cooperation"
 hd_party_policy_ban_opinion:0 "Banned Our Faction"
 hd_party_policy_restrict_opinion:0 "Restricted Our Faction"
 hd_party_policy_promote_opinion:0 "Promoted Our Faction"
 hd_party_favored_opinion:0 "Favored Our Faction"
 hd_party_disgraced_opinion:0 "Our Faction Disfavored"
 hd_party_debate_support_opinion:0 "Stood With Me in Debate"
 hd_party_debate_disgrace_opinion:0 "Failed Debate Support"
 hd_party_chain_refused_opinion:0 "Petition Denied"
 hd_party_favor_decision_desc:0 "Each faction at court has its strengths, and each harbors its own ambitions. Draw one close and make it your confidant, and it will serve you to the death; yet those who once enjoyed your favor will surely nurse resentment when they fall from grace."
 hd_party_favor_decision_tooltip:0 "Take one [movement|E] into your confidence, or withdraw your current favor"
 hd_party_favor_cd_tt:0 "Less than ten years have passed since you last changed your favor"
 hd_party_favor_huanguan_name:0 "Favor the Eunuchs"
 hd_party_favor_huanguan_desc:0 "Trust the palace attendants and make the eunuchs your confidants."
 hd_party_favor_waiqi_name:0 "Favor the Consort Kin"
 hd_party_favor_waiqi_desc:0 "Lean on the empress's kin and entrust the consort clans with great responsibilities."
 hd_party_favor_wuxun_name:0 "Favor the Martial Nobles"
 hd_party_favor_wuxun_desc:0 "Honor the generals and officers, and make the martial nobles your bulwark."
 hd_party_favor_shizu_name:0 "Favor the Gentry Clans"
 hd_party_favor_shizu_desc:0 "Revere the great houses and make the gentry clans your right hand."
 hd_party_favor_hanmen_name:0 "Favor the Humble-Born"
 hd_party_favor_hanmen_desc:0 "Raise up the humble and make lowly scholars your wings."
 hd_party_favor_none_name:0 "Favor No Faction"
 hd_party_favor_none_desc:0 "Remain impartial and withdraw your current favor."
 hd_party_favor_effect_tt:0 "The faction you favor will repay your grace and its influence will surge; you will also share in that faction's fortunes and misfortunes in this age."
 hd_party_favor_lost_tt:0 "The faction that once enjoyed your favor has lost its patron, and is bound to nurse resentment."
 hd_party_convert_identity_decision:0 "Change Allegiance"
 hd_party_convert_identity_decision_desc:0 "Your origins and record now suffice for you to join another faction. Yet one who changes allegiance will surely be seen by former peers as fickle, and your reputation is bound to suffer."
 hd_party_convert_identity_decision_tooltip:0 "Change your standing at court and join another faction"
 hd_party_convert_cd_tt:0 "Less than ten years have passed since you last changed allegiance"
 HD_PARTY_CONVERT_CONFIRM:0 "Change"
 hd_party_convert_huanguan_name:0 "Become a Eunuch"
 hd_party_convert_huanguan_desc:0 "Henceforth make your way at court as a eunuch."
 hd_party_convert_waiqi_name:0 "Become Consort Kin"
 hd_party_convert_waiqi_desc:0 "Henceforth make your way at court as consort kin."
 hd_party_convert_wuxun_name:0 "Become Martial Nobility"
 hd_party_convert_wuxun_desc:0 "Henceforth make your way at court as martial nobility."
 hd_party_convert_shizu_name:0 "Become Gentry"
 hd_party_convert_shizu_desc:0 "Henceforth make your way at court as gentry."
 hd_party_convert_hanmen_name:0 "Become Humble-Born"
 hd_party_convert_hanmen_desc:0 "Henceforth make your way at court as humble-born."
 hd_party_choose_attitude_decision:0 "Faction Stance"
 hd_party_choose_attitude_decision_desc:0 "You hold the reins of your faction, and its every advance and retreat hangs on your word. Will you support our liege, wait and see, or stand against him as an equal?"
 hd_party_choose_attitude_decision_tooltip:0 "Decide your faction's stance toward your liege"
 hd_party_attitude_cd_tt:0 "Less than three years have passed since you last changed your stance"
 HD_PARTY_ATTITUDE_CONFIRM:0 "Confirm"
 hd_party_join_chaos_decision:0 "Plunge into the Chaos"
 hd_party_join_chaos_decision_desc:0 "The realm has fallen into chaos, and now is the time for a true man to win glory! I shall gather my kin and disciples, spend my family fortune to raise loyal volunteers, and join the contest of warlords."
 hd_party_join_chaos_decision_tooltip:0 "Spend your family fortune, raise volunteers, and enter the chaos as an [adventurer|E]"
 hd_party_join_chaos_army:0 "Volunteers"
 hd_party_convert_identity_decision_confirm:0 "Change Allegiance"
 hd_party_choose_attitude_decision_confirm:0 "Confirm Stance"
 hd_party_join_chaos_decision_confirm:0 "Plunge into the Chaos"
 hd_party_policy_cd_tt:0 "Your policy toward this faction has stood for less than five years and cannot yet be changed (returning to neutral is exempt)"
 hd_party_loyalty_invalid_tt:0 "This faction is leaderless, already reveres the throne, or you have recently demanded its loyalty"
 hd_party_loyalty_success_tt:0 "#P This faction bows to your command and now adopts 'Revere the Throne'.#!"
 hd_party_loyalty_fail_tt:0 "#N This faction refuses your order and turns against you.#!"
 hd_party_policy_unpaid_toast:0 "The treasury is exhausted; the policies promoting and curbing the factions must be abandoned"
 hd_party.0020.t:0 "Force Their Submission"
 hd_party.0020.desc:0 "[hd_party_target_leader.GetShortUIName] and their followers form a bloc of their own at court. If you can force them to bow, the faction will adopt 'Revere the Throne' until its leader changes or you no longer reign.\n\nYet submission under duress does not always win true hearts."
 hd_party.0020.a:0 "Compel them with raw power"
 hd_party.0020.b:0 "Rebuke them with the duty of subject to sovereign"
 hd_party.0020.c:0 "Overawe them with prestige"
 hd_party.0020.d:0 "Stake all your renown to force their submission"
 hd_party.0020.e:0 "Threaten them with what you have on them"
 hd_party.0020.f:0 "Let this wait"
 hd_party.0101.t:0 "Lifting the Partisan Proscriptions"
 hd_party.0101.desc:0 "The Yellow Turban Rebellion has erupted, and the four quarters are shaken. Middle Attendant Lü Qiang counsels you: the grievances of the Partisan Proscriptions run deep, and unless the partisans are pardoned, they may conspire with Zhang Jue and bring even greater calamity."
 hd_party.0101.a:0 "Grant a general amnesty to the partisans"
 hd_party.0101.a.tt:0 "The proscribed scholars may return home, and the humble-born are somewhat reassured."
 hd_party_chain.11.t:0 "A Favored Middle Attendant"
 hd_party_chain.11.desc:0 "[hd_party_chain_leader.GetShortUIName] attends you day and night, careful and deferential, and has won your fondness. Within the palace, all whisper that the post of Middle Attendant can go to none other."
 hd_party_chain.11.a:0 "Appoint them Middle Attendant"
 hd_party_chain.11.b:0 "Reward them with coin and silk for their labors"
 hd_party_chain.11.c:0 "Palace affairs are best left undiscussed"
 hd_party_chain.12.t:0 "Command of the Western Garden"
 hd_party_chain.12.desc:0 "[hd_party_chain_leader.GetShortUIName] petitions that eight colonels be established in the Western Garden, with eunuchs commanding the palace troops to guard against the unexpected. When word gets out, many military men are indignant."
 hd_party_chain.12.a:0 "Grant the request"
 hd_party_chain.12.b:0 "Grant titles, but not command of troops"
 hd_party_chain.12.c:0 "War is a great affair of state, not to be lightly entrusted"
 hd_party_chain.13.t:0 "Eunuchs Meddle in Government"
 hd_party_chain.13.desc:0 "The Regular Attendants jointly petition to review memorials on your behalf, 'to spare our lord's labors.' If you allow it, decrees will issue from the inner palace; if you refuse, the eunuchs may grow resentful."
 hd_party_chain.13.a:0 "Entrust them with the memorials"
 hd_party_chain.13.c:0 "This must never be allowed"
 hd_party_chain.21.t:0 "Ennobling the Empress's Kin"
 hd_party_chain.21.desc:0 "[hd_party_chain_leader.GetShortUIName] of the empress's clan has rendered repeated service, and courtiers submit memorial after memorial asking you to reward them with a marquisate."
 hd_party_chain.21.a:0 "Grant them a fief"
 hd_party_chain.21.b:0 "Bestow generous gifts of gold and silk"
 hd_party_chain.21.c:0 "No marquisate without merit"
 hd_party_chain.22.t:0 "Consort Kin Command Troops"
 hd_party_chain.22.desc:0 "[hd_party_chain_leader.GetShortUIName] requests the title of General, to command the palace troops and guard the capital."
 hd_party_chain.22.a:0 "Appoint them General"
 hd_party_chain.22.b:0 "Grant an honorary title"
 hd_party_chain.22.c:0 "Military power must not be lent to others"
 hd_party_chain.23.t:0 "Consort Kin as Regents"
 hd_party_chain.23.desc:0 "The power of the consort kin grows ever greater. [hd_party_chain_leader.GetShortUIName] submits a memorial requesting to oversee the Imperial Secretariat and assist in governing the realm."
 hd_party_chain.23.a:0 "Entrust them with the regency"
 hd_party_chain.23.c:0 "I shall govern in person"
 hd_party_chain.51.t:0 "Recommendation and Promotion"
 hd_party_chain.51.desc:0 "The humble-born scholars jointly petition you to widen the recommendation system and promote men of lowly origin."
 hd_party_chain.51.a:0 "Widen recommendations, regardless of lineage"
 hd_party_chain.51.b:0 "Select a few"
 hd_party_chain.51.c:0 "Official careers have their established rules"
 hd_party_chain.52.t:0 "Pure Criticism in Vogue"
 hd_party_chain.52.desc:0 "The students of the Imperial Academy grade the high ministers and pass judgment on those in power. The voice of Pure Criticism fills court and countryside alike, and even your own governance is open to their comment."
 hd_party_chain.52.a:0 "Praise their candor"
 hd_party_chain.52.b:0 "Merely listen"
 hd_party_chain.52.c:0 "Those who rashly criticize the court must be banned"
 hd_party_chain.53.t:0 "The Humble-Born Enter the Secretariat"
 hd_party_chain.53.desc:0 "[hd_party_chain_leader.GetShortUIName], hope of the humble-born, grows more renowned by the day, and many urge you to bring them into the Secretariat to take part in affairs of state."
 hd_party_chain.53.a:0 "Bring them into the Secretariat"
 hd_party_chain.53.c:0 "Their standing is still too slight"
 hd_party_chain.41.t:0 "Recommendation by Lineage"
 hd_party_chain.41.desc:0 "The gentry lords recommend one another's sons, asking that scions of good families be appointed as Gentlemen of the court."
 hd_party_chain.41.a:0 "Accept their recommendations"
 hd_party_chain.41.b:0 "Choose only the best"
 hd_party_chain.41.c:0 "Officials should be chosen for talent and virtue"
 hd_party_chain.42.t:0 "Land Annexation"
 hd_party_chain.42.desc:0 "Powerful families seize vast tracts of land, their slaves and retainers numbering in the thousands. The officials ask for restrictions, but the gentry lords come to you one after another pleading for leniency."
 hd_party_chain.42.a:0 "Let them do as they will"
 hd_party_chain.42.b:0 "Impose some restraint"
 hd_party_chain.42.c:0 "Strictly forbid annexation"
 hd_party_chain.43.t:0 "The Gentry Monopolize Office"
 hd_party_chain.43.desc:0 "The gentry lords ask that a system of ranking be established, setting official rank by family pedigree. Henceforth the sons of humble families would have almost no path to advancement."
 hd_party_chain.43.a:0 "Make it established law"
 hd_party_chain.43.c:0 "This system must never be adopted"
 hd_party_chain.31.t:0 "Generalships and Fiefs"
 hd_party_chain.31.desc:0 "[hd_party_chain_leader.GetShortUIName] has repeatedly distinguished themselves in battle, and their soldiers urge you to make them a general and reward them richly, to inspire the whole army."
 hd_party_chain.31.a:0 "Appoint them General"
 hd_party_chain.31.b:0 "Reward them richly"
 hd_party_chain.31.c:0 "Their merit does not yet warrant it"
 hd_party_chain.32.t:0 "Frontier Generals Raise Troops"
 hd_party_chain.32.desc:0 "The frontier generals petition to lead their own retinues and recruit their own troops to repel foreign threats."
 hd_party_chain.32.a:0 "Permit them to recruit"
 hd_party_chain.32.b:0 "Grant them coin and grain"
 hd_party_chain.32.c:0 "Troops belong to the court"
 hd_party_chain.33.t:0 "Arrogant Warriors"
 hd_party_chain.33.desc:0 "The generals grow arrogant on their merits and repeatedly flout the law. Indulge them, and the warriors will grow ever more overbearing; curb them, and you risk provoking a mutiny."
 hd_party_chain.33.a:0 "Tolerate them for now"
 hd_party_chain.33.c:0 "Curb them sternly"
