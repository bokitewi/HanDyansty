 HD_PARTY_ATTITUDE_SHIZU_TT:0 "#T Gentry Clans' Attitude Toward the Ruler: [SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_shizu_attitude').GetFlagName, 'support' ), 'hd_party_attitude_support_name', SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_shizu_attitude').GetFlagName, 'oppose' ), 'hd_party_attitude_oppose_name', 'hd_party_attitude_neutral_name' ) )]#!\nSupport Score: [Character.MakeScope.Var('hd_party_shizu_score').GetValue|0] (at ≥ 50 it turns to Support, at ≤ -50 to Opposition; a supporting faction below 20 or an opposing one above -20 returns to Neutral)\n\nWhile supporting, the ruler gains: domain taxes, prestige and legitimacy gain #P +10%#!, capital development and control growth #P +0.1#!\nWhile opposing, the ruler suffers: domain taxes, prestige and legitimacy gain #N -15%#!, capital development and control growth #N -0.15#!\n\n#weak A faction holding less than a tenth of the court's power matters little either way.#!"
