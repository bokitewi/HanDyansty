 setting_scorched_earth_enabled_desc: "Both players and AI may massacre cities when the conditions are met. Each use immediately removes a random 30–90% of the county's current development and applies a negative modifier for five years."
 setting_scorched_earth_player_only_desc: "Only players may massacre cities; the AI will not do so automatically."
 setting_scorched_earth_independent_and_player_only_desc: "All players and independent AI rulers may massacre cities."
 setting_scorched_earth_independent_player_only_desc: "Only independent player rulers may massacre cities."
 setting_scorched_earth_independent_only_desc: "Only independent rulers may massacre cities, including both players and AI."
 setting_scorched_earth_disabled_desc: "Disable the city massacre button and automatic AI massacres."
