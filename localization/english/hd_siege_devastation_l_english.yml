 setting_scorched_earth_enabled_desc: "Both players and AI can sack cities based on conditions. Each instance causes the current county immediately to lose a random 30–90% of its current development degree and imposes a five-year negative modifier."
 setting_scorched_earth_player_only_desc: "Only players can sack cities; AI will not execute this action automatically."
 setting_scorched_earth_independent_and_player_only_desc: "All players and independent AI rulers can sack cities."
 setting_scorched_earth_independent_player_only_desc: "Only independent player rulers may sack cities."
 setting_scorched_earth_independent_only_desc: "Only independent rulers can sack cities, including both players and AI."
 setting_scorched_earth_disabled_desc: "Disable the button to sack cities and AI automatic sacking of cities."
