l_english:
 mcpe.13.t:0 "Vicious mockery"
 mcpe.13.d.no_bully_fallback:0 "Another child mocked me in public, while the onlookers remained silent, waiting to see how I would respond."
 mcpe.13.d.bully:0 "[bully.GetTitledFirstName|U] mocked me in public, while those around remained silent, waiting to see how I would respond."
 mcpe.13.a:0 "I'll punch that big-mouthed fellow in the face!"
 mcpe.13.b:0 "I will remember this. One day you will pay the price!"
 mcpe.13.c:0 "This is merely words. There is nothing to grieve over."
 mcpegr.13.d_bully:0 "Tell me, [child.GetTitledFirstName|U], that [bully.GetTitledFirstName] mocked [child.GetHerHim] in front of other children. \n\n"
 mcpegr.13.d_no_bully_fallback:0 "[child.GetTitledFirstName|U] tells me that another child publicly mocked [child.GetHerHim].\n\n"
 mcpegr.13.d_wrathful:0 "[child.GetSheHe|U] showed no tolerance and punched him on the spot."
 mcpegr.13.d_vengeful:0 "[child.GetSheHe|U] did not strike immediately but vowed to make the other party pay sooner or later."
 mcpegr.13.d_calm:0 "He dismissed [child.GetSheHe|U] as mere idle provocation and paid it no mind."
 mcpegr.13.confirm_wrathful:0 "An appropriate response to disrespect."
 mcpegr.13.confirm_vengeful:0 "Very good. Insults should not be forgotten or forgiven."
 mcpegr.13.confirm_calm:0 "A wise decision. Words cannot hurt [child.GetHerHim]."
 mcpegr.13.wrathful_change:0 "[child.GetFirstNameNoTooltip|U] should not hold back [child.GetHerHis]'s anger!"
 mcpegr.13.vengeful_change:0 "[child.GetFirstNameNoTooltip|U] should remember this and let them pay the price one day."
 mcpegr.13.calm_change:0 "You should not be so disheartened over words. [child.GetFirstNameNoTooltip|U]"
 mcpe.14.t:0 "Loveless Marriage"
 mcpe.14.d:0 "I stumbled upon a married couple of servants arguing. They had long forgotten the cause of their dispute, yet they continued to blame each other, even claiming that this marriage was the greatest mistake they had ever made."
 mcpe.14.a:0 "If love is like this, I don't want it."
 mcpe.14.b:0 "This can only show that people care only about themselves."
 mcpe.14.c:0 "They only need to spend some time listening to each other!"
 mcpegr.14.d:0 "I heard that [child.GetTitledFirstName] stumbled upon a pair of servants arguing. The two were blaming each other over trifles and even claimed that their marriage was a mistake. \n\n"
 mcpegr.14.d_chaste:0 "[child.GetFirstNameNoTooltip|U] believes that if so-called love ultimately leaves only arguments, it is better not to have it at all."
 mcpegr.14.d_cynical:0 "[child.GetFirstNameNoTooltip|U] believes that this clearly shows that everyone first considers only themselves."
 mcpegr.14.d_patient:0 "[child.GetFirstNameNoTooltip|U] believes that as long as both parties are willing to listen patiently to each other's words, the matter can always be resolved."
 mcpegr.14.confirm_chaste:0 "This is an understandable reaction."
 mcpegr.14.confirm_cynical:0 "A valuable lesson worth learning from."
 mcpegr.14.confirm_patient:0 "If only they were as smart..."
 mcpegr.14.chaste_change:0 "If this is love, do you truly desire it?"
 mcpegr.14.cynical_change:0 "This can only show that people care only about themselves."
 mcpegr.14.patient_change:0 "They only need to spend some time listening to each other!"
 mcpe.15.t:0 "Boring lecture"
 mcpe.15.d:0 "I had to sit down and listen to the instructor's lecture. His voice was slow and flat; by the time he finished a sentence, I had already forgotten what he said at the beginning. I could no longer hold back..."
 mcpe.15.a:0 "Let's get to the point; this is too boring!"
 mcpe.15.b:0 "I must try to concentrate my attention, even though it is difficult."
 mcpe.15.c:0 "Make up an excuse to leave, then make up another excuse not to return."
 mcpegr.15.d:0 "I arranged for [child.GetTitledFirstName] to attend a lecture by a notoriously dull instructor, and I also wanted to see how [child.GetSheHe] would handle it. \n\n"
 mcpegr.15.d_impatient:0 "[child.GetSheHe|U] quickly interrupted the mentor, bluntly stating that this lesson was utterly boring."
 mcpegr.15.d_diligent:0 "[child.GetSheHe|U] actually listened attentively from beginning to end."
 mcpegr.15.d_deceitful:0 "[child.GetSheHe|U] found an excuse to leave and made up another reason for never returning."
 mcpegr.15.confirm_impatient:0 "Yes, [child.GetSheHe] should not let anyone waste [child.GetHerHis]'s time!"
 mcpegr.15.confirm_diligent:0 "Extremely impressive, [child.GetFirstNameNoTooltip]."
 mcpegr.15.confirm_deceitful:0 "Ha! What a creative idea, [child.GetFirstNameNoTooltip]!"
 mcpegr.15.impatient_change:0 "[child.GetFirstNameNoTooltip|U] should not let anyone waste [child.GetHerHis] time!"
 mcpegr.15.diligent_change:0 "[child.GetFirstNameNoTooltip|U] should study harder!"
 mcpegr.15.deceitful_change:0 "[child.GetFirstNameNoTooltip|U] should just be finding an excuse to leave!"
 mcpe.16.t:0 "Obsessed with the city"
 mcpe.16.d.no_crush:0 "I have fallen for an ordinary [child.Custom('servant_for_romance')], but their family will soon be leaving. If I do not express my feelings now, perhaps I may never see them again."
 mcpe.16.d.crush:0 "I've fallen for [crush.GetTitledFirstName]. Now is the perfect time to confess my feelings, but every time I try to speak, fear grips my heart."
 mcpe.16.a:0 "Try to find an opportunity to express my feelings."
 mcpe.16.b:0 "It's time to engage in some espionage without showing your face..."
 mcpe.16.c:0 "Lock yourself in the room, hoping no one will notice you."
 mcpegr.16.d:0 "I found that [child.GetTitledFirstName] seems to have taken a liking to [crush.GetTitledFirstName]. \n\n"
 mcpegr.16.d.no_crush:0 "I discovered that [child.GetTitledFirstName] seems to have fallen for an ordinary [child.Custom('servant_for_romance')]. \n\n"
 mcpegr.16.d_brave:0 "[child.GetFirstNameNoTooltip|U] finally gathered the courage to speak his feelings directly to her face."
 mcpegr.16.d_lustful:0 "[child.GetFirstNameNoTooltip|U] did not express their feelings but instead kept observing the other party in secret."
 mcpegr.16.d_shy:0 "[child.GetFirstNameNoTooltip|U] locked himself in his room, hoping no one would discover these feelings."
 mcpegr.16.confirm_brave:0 "What exactly should be done?"
 mcpegr.16.confirm_lustful:0 "Ha! This is a coming-of-age ceremony."
 mcpegr.16.confirm_shy:0 "This is an understandable reaction."
 mcpegr.16.brave_change:0 "[child.GetFirstNameNoTooltip|U] should confess [child.GetHerHis]'s feelings!"
 mcpegr.16.lustful_change:0 "[child.GetFirstNameNoTooltip|U] has just presented an excellent espionage opportunity."
 mcpegr.16.shy_change:0 "[child.GetFirstNameNoTooltip|U] should live in room [child.GetHerHis]!"
 mcpe.17.t:0 "Robber's Awakening"
 mcpe.17.d:0 "I found a servant's child hiding in the corner and crying. It turns out that [child.GetSheHe] was robbed while buying food at the market, and now they are both frightened and at a loss for what to do."
 mcpe.17.a:0 "Didn't expect the outside to be so dangerous"
 mcpe.17.b:0 "Hmm, this doesn't sound like \"my\" problem."
 mcpe.17.c:0 "Keep going! I'll share some food I've made myself with you."
 mcpegr.17.d:0 "[child.GetTitledFirstName|U] discovered a servant's child crying because they were robbed in the market. I asked [child.GetFirstNameNoTooltip] how they planned to handle it, and [child.GetSheHe] replied: \n\n"
 mcpegr.17.d_craven:0 "I did not know it was so dangerous outside. We must be more cautious from now on."
 mcpegr.17.d_callous:0 "This has nothing to do with me. Why trouble me with such matters?"
 mcpegr.17.d_generous:0 "We can share some food with them; at least, let's not let them continue to starve."
 mcpegr.17.confirm_craven:0 "Yes, it is indeed very dangerous there."
 mcpegr.17.confirm_callous:0 "Absolutely. This is not our problem at all."
 mcpegr.17.confirm_generous:0 "Sharing with them is the right thing to do."
 mcpegr.17.craven_change:0 "Don't you know how dangerous it is outside?"
 mcpegr.17.callous_change:0 "But why is this our problem?"
 mcpegr.17.generous_change:0 "We should share our food with the servants."
 mcpe.18.t:0 "Foreign Cuisine"
 mcpe.18.d:0 "At the banquet, someone invited me to taste an expensive dish from a distant land. As soon as I took a bite, I found it difficult to swallow, yet my stomach was ravenous and my host awaited my verdict."
 mcpe.18.a:0 "I may eat better, but food is still food."
 mcpe.18.b:0 "This \"delicacy\" is absolutely trash!"
 mcpe.18.c:0 "I don't think I like this delicious food very much..."
 mcpegr.18.d:0 "I take [child.GetTitledFirstName] to the banquet. During the meal, someone invites [child.GetHerHim] to taste an expensive dish from a foreign land, but [child.GetHerHis]'s expression already says it all. \n\n"
 mcpegr.18.d_gluttonous:0 "Although he did not like it, [child.GetSheHe] still finished all the food on the plate."
 mcpegr.18.d_honest:0 "[child.GetSheHe|U] publicly admitted that this so-called delicacy was truly difficult to swallow."
 mcpegr.18.d_temperate:0 "[child.GetSheHe|U] Put down the utensils and decided that expensive food was not necessarily worth eating in large quantities."
 mcpegr.18.confirm_gluttonous:0 "Well, terrible food is still food."
 mcpegr.18.confirm_honest:0 "That's right! Tell them, [child.GetFirstNameNoTooltip]!"
 mcpegr.18.confirm_temperate:0 "A person should eat only what is necessary."
 mcpegr.18.gluttonous_change:0 "Terrible food is still food!"
 mcpegr.18.honest_change:0 "[child.GetFirstNameNoTooltip|U] should only say that the food is terrible!"
 mcpegr.18.temperate_change:0 "Perhaps refined food is not suitable for [child.GetFirstNameNoTooltip]."
 mcpe.19.t:0 "Judge"
 mcpe.19.d:0 "A thief broke into my chamber, causing significant damage while searching for valuables. The guards quickly apprehended him and left the decision on how to punish him to me."
 mcpe.19.a:0 "You must strive to repair the damage you have caused."
 mcpe.19.b:0 "I would be delighted to make you suffer!"
 mcpe.19.c:0 "You only need to ensure you do not do this again."
 mcpegr.19.d:0 "A thief broke into [child.GetTitledFirstNamePossessive]'s room and damaged a significant amount of property. After the guards apprehended him, I asked [child.GetFirstNameNoTooltip] how to handle the situation. \n\n"
 mcpegr.19.d_just:0 "[child.GetSheHe|U] believes that a thief should personally repair the damage they caused."
 mcpegr.19.d_sadistic:0 "[child.GetSheHe|U] only wants to make the thief suffer as much as possible."
 mcpegr.19.d_forgiving:0 "[child.GetSheHe|U] is willing to let the thief go, provided they promise not to commit the offense again."
 mcpegr.19.confirm_just:0 "Impose appropriate penalties for criminal acts."
 mcpegr.19.confirm_sadistic:0 "Yes. Make them truly regret it."
 mcpegr.19.confirm_forgiving:0 "How benevolent."
 mcpegr.19.just_change:0 "No, the punishment should fit the crime!"
 mcpegr.19.sadistic_change:0 "No! Let them suffer!"
 mcpegr.19.forgiving_change:0 "No, show mercy and forgiveness!"
 mcpe.20.t:0 "New Toy"
 mcpe.20.d:0 "Take me to the market to pick out new toys. The stalls are filled with dazzling items, but I can only choose one. [guardian.GetTitledFirstName|U]"
 mcpe.20.a:0 "None of these toys are good enough for me!"
 mcpe.20.b:0 "I am looking for the most expensive one!"
 mcpe.20.c:0 "I want that one! Wait, no, it's this one! Wait, I actually want this one!"
 mcpegr.20.d:0 "I took [child.GetTitledFirstName] to the market to pick out new toys and promised to let [child.GetHerHim] choose on their own. \n\n"
 mcpegr.20.d_arrogant:0 "[child.GetSheHe|U] Surveyed all the stalls, yet found nothing worthy of himself."
 mcpegr.20.d_greedy:0 "[child.GetSheHe|U] deliberately chose the most expensive toys; after all, I'm the one who pays in the end."
 mcpegr.20.d_fickle:0 "[child.GetSheHe|U] Hesitates to make a decision, changing his mind immediately upon seeing each new toy."
 mcpegr.20.confirm_arrogant:0 "Very well."
 mcpegr.20.confirm_greedy:0 "[child.GetFirstNameNoTooltip|U] Understands the value of wealth."
 mcpegr.20.confirm_fickle:0 "It is good to keep an open mind."
 mcpegr.20.arrogant_change:0 "[child.GetFirstNameNoTooltip|U] should have higher standards!"
 mcpegr.20.greedy_change:0 "[child.GetFirstNameNoTooltip|U] should learn to cherish wealth!"
 mcpegr.20.fickle_change:0 "[child.GetFirstNameNoTooltip|U] should learn to keep an open mind!"
 mcpe.21.t:0 "Journey of the Land"
 mcpe.21.d:0 "[guardian.GetTitledFirstName|U] took me on a tour of the family's territory, allowing me to become familiar with this land and its people. As our journey neared its end, [guardian.GetSheHe] asked if I wished to go anywhere else."
 mcpe.21.a:0 "I'd like to talk with some locals!"
 mcpe.21.b:0 "People are looking at us with strange eyes. Let's go home."
 mcpe.21.c:0 "Nothing much. I'm tired from today's events."
 mcpegr.21.d:0 "I lead [child.GetTitledFirstName] to inspect the family's territories, allowing [child.GetHerHim] to become familiar with the land and its people. As our journey nears its end, I ask [child.GetSheHe] if there are any other plans. \n\n"
 mcpegr.21.d_gregarious:0 "[child.GetFirstNameNoTooltip|U] wants to talk with the locals and hear about their lives firsthand."
 mcpegr.21.d_paranoid:0 "[child.GetFirstNameNoTooltip|U] worries that passersby have been secretly observing us and insists on returning immediately."
 mcpegr.21.d_lazy:0 "[child.GetFirstNameNoTooltip|U] is already tired from walking and just wants to end this inspection as soon as possible."
 mcpegr.21.confirm_gregarious:0 "Good idea!"
 mcpegr.21.confirm_paranoid:0 "You can never be too cautious."
 mcpegr.21.confirm_lazy:0 "Yes, let us rest."
 mcpegr.21.gregarious_change:0 "You should talk to some of the locals! [child.GetSheHe|U]"
 mcpegr.21.paranoid_change:0 "[child.GetSheHe|U] should be more concerned about the safety of [child.GetHerHis]!"
 mcpegr.21.lazy_change:0 "[child.GetSheHe|U] should enjoy their deserved rest."
 mcpe.22.t:0 "The wages of sin"
 mcpe.22.d:0 "Rumors have long circulated nearby that a recluse lives in private without reverence for the gods, yet there has never been conclusive evidence. Recently, his dwelling caught fire, and all say this is retribution."
 mcpe.22.a:0 "A solemn warning: Do not desecrate the sacred!"
 mcpe.22.b:0 "Rumors alone are not a reason to look down on others!"
 mcpe.22.c:0 "No matter what people say, we should help them rebuild!"
 mcpegr.22.d:0 "People nearby have long accused a recluse of disrespecting the gods, yet they cannot produce any evidence. Recently, that person's dwelling caught fire. Upon learning of this, [child.GetTitledFirstName] said to me: \"\n\n\""
 mcpegr.22.d_zealous:0 "This must be a warning from the gods! That sinner has finally received their retribution!"
 mcpegr.22.d_humble:0 "Rumors prove nothing; we should not pretend to know the true character of others."
 mcpegr.22.d_compassionate:0 "Whether the rumors are true or false, we should help this poor person rebuild his home."
 mcpegr.22.confirm_zealous:0 "Yes, the guilty shall receive their just deserts!"
 mcpegr.22.confirm_humble:0 "Yes, we should not look down on others."
 mcpegr.22.confirm_compassionate:0 "Yes, we should always help those in need."
 mcpegr.22.zealous_change:0 "[child.GetFirstNameNoTooltip|U] should not question the will of the gods!"
 mcpegr.22.humble_change:0 "[child.GetFirstNameNoTooltip|U] does not know their true personalities!"
 mcpegr.22.compassionate_change:0 "[child.GetFirstNameNoTooltip|U] should help the needy souls in need!"
 mcpe.23.t:0 "Short Lesson"
 mcpe.23.d:0 "I was listening to my instructor's lecture, but the sounds of other children playing outside distracted me. The instructor noticed my lack of focus and voluntarily proposed ending the session early, promising to take responsibility for me."
 mcpe.23.a:0 "Thank you!"
 mcpe.23.b:0 "No, I promised to finish the lessons, and I will definitely complete them."
 mcpe.23.c:0 "No matter what you say, I must go."
 mcpegr.23.d:0 "I saw several children playing outside, while [child.GetTitledFirstName] should have been following the tutor to study at this time. \n\n"
 mcpegr.23.d_trusting:0 "Soon after, [child.GetSheHe] also joined them. My mentor later told me that I had voluntarily ended the course early."
 mcpegr.23.d_stubborn:0 "[child.GetSheHe|U] never left. My mentor later told me that [child.GetFirstNameNoTooltip] insisted on completing the day's lesson, as it was an agreement made long ago."
 mcpegr.23.d_arbitrary:0 "Soon after, [child.GetSheHe] also joined them. My mentor later told me that [child.GetFirstNameNoTooltip] never received permission to leave."
 mcpegr.23.confirm_trusting:0 "Sometimes the lesson ends early."
 mcpegr.23.confirm_stubborn:0 "Yes. Stick to the plan, [child.GetFirstNameNoTooltip]!"
 mcpegr.23.confirm_arbitrary:0 "Why does [child.GetFirstNameNoTooltip] require permission?"
 mcpegr.23.trusting_change:0 "[child.GetFirstNameNoTooltip|U] should directly request to leave!"
 mcpegr.23.stubborn_change:0 "You should persist in attending class! [child.GetFirstNameNoTooltip|U]"
 mcpegr.23.arbitrary_change:0 "[child.GetFirstNameNoTooltip|U] should just walk away!"
 mcpe.24.t:0 "Dream"
 mcpe.24.d:0 "I have just awakened from a dream. In that dream, I was a mighty ruler governing vast territories, and what remains most vivid in my memory is..."
 mcpe.24.a:0 "...the power and respect I possess."
 mcpe.24.b:0 "...the boundless wealth I possess."
 mcpe.24.c:0 "...the smiles of my people, living happy and fulfilling lives."
 mcpegr.24.d:0 "Tell me, [child.GetTitledFirstName|U], you dreamed of becoming a ruler over vast territories. [child.GetSheHe] \n\n"
 mcpegr.24.d_ambitious:0 "[child.GetSheHe|U]Most reluctant to part with the power and awe of dreams, he still seeks to achieve the same status in reality."
 mcpegr.24.d_greedy:0 "[child.GetSheHe|U]Most reluctant to part with the boundless wealth in dreams, he still wishes to possess it all in reality."
 mcpegr.24.d_compassionate:0 "The most unforgettable sight is the peaceful and prosperous life of the people; I also hope that people in reality can enjoy such happiness. [child.GetSheHe|U]"
 mcpegr.24.confirm_ambitious:0 "Power is a worthwhile pursuit."
 mcpegr.24.confirm_greedy:0 "Wealth is a good thing worth striving for."
 mcpegr.24.confirm_compassionate:0 "Happiness is a good thing worth striving for."
 mcpegr.24.ambitious_change:0 "You should seek power!"
 mcpegr.24.greedy_change:0 "You should seek wealth!"
 mcpegr.24.compassionate_change:0 "You should seek happiness!"
 mcpe.25.t:0 "Tracker"
 mcpe.25.d:0 "Recently, an ordinary [child.Custom('servant_for_romance')] has been secretly watching me from afar. Every time I become aware of it, the person immediately hides away. Could someone be secretly admiring me?"
 mcpe.25.a:0 "I absolutely love this kind of attention!"
 mcpe.25.b:0 "This really makes me feel uncomfortable."
 mcpe.25.c:0 "...They may intend to murder me."
 mcpegr.25.d:0 "I discovered an ordinary [child.Custom('servant_for_romance')] secretly watching [child.GetTitledFirstName], who immediately hid upon being noticed. It seems [child.GetFirstNameNoTooltip] has a admirer. \n\n"
 mcpegr.25.d_lustful:0 "[child.GetSheHe|U] seems to enjoy this attention quite a bit."
 mcpegr.25.d_chaste:0 "This peeping makes [child.GetHerHim] very uncomfortable."
 mcpegr.25.d_paranoid:0 "[child.GetSheHe|U] instead believed this was not affection, but an attempt to harm him."
 mcpegr.25.confirm_lustful:0 "Why should [child.GetSheHe] not enjoy it?"
 mcpegr.25.confirm_chaste:0 "As it should be. This is inappropriate."
 mcpegr.25.confirm_paranoid:0 "Yes, appearances can be deceiving."
 mcpegr.25.lustful_change:0 "[child.GetFirstNameNoTooltip|U] deserves attention!"
 mcpegr.25.chaste_change:0 "[child.GetFirstNameNoTooltip|U] should reject these temptations!"
 mcpegr.25.paranoid_change:0 "[child.GetFirstNameNoTooltip|U] should pay more attention to the safety of [child.GetHerHis]!"
 mcpe.26.t:0 "Go for a walk outside"
 mcpe.26.d:0 "A few children invited me to sneak out of the castle and spend some time alone in the wild. They said this would prove that I could take care of myself without relying on guards—as long as I had the courage for it."
 mcpe.26.a:0 "Why not? I am not afraid of the reality outside!"
 mcpe.26.b:0 "Leave without a guard? Impossible! That's very \"dangerous\"!"
 mcpe.26.c:0 "Of course. But just in case, some cautious guards will follow us."
 mcpegr.26.d:0 "Yesterday, I could not find [child.GetTitledFirstName] anywhere. Someone last saw [child.GetHerHim] with a few children; they seemed to have slipped out of the castle together. \n\n"
 mcpegr.26.d_brave:0 "Today, [child.GetFirstNameNoTooltip] returned safely with the other children. Everyone praised [child.GetHerHis]'s courage and spread tales of this adventure everywhere."
 mcpegr.26.d_craven:0 "Today, I found [child.GetFirstNameNoTooltip] in the old wardrobe. It turns out [child.GetSheHe] was afraid of the dangers outside and never left with the other children."
 mcpegr.26.d_deceitful:0 "Today, [child.GetFirstNameNoTooltip] returned safely with the other children. The guards later informed me that [child.GetSheHe] had secretly requested them to follow along the entire journey."
 mcpegr.26.confirm_brave:0 "Hah! [child.GetFirstNameNoTooltip|U]Nothing to fear!"
 mcpegr.26.confirm_craven:0 "[child.GetFirstNameNoTooltip|U] knows how to avoid trouble."
 mcpegr.26.confirm_deceitful:0 "Show courage without unnecessary risk. Clever."
 mcpegr.26.brave_change:0 "[child.GetFirstNameNoTooltip|U] should prove [child.GetHerHis]'s bravery!"
 mcpegr.26.craven_change:0 "[child.GetFirstNameNoTooltip|U] should stay away from trouble!"
 mcpegr.26.deceitful_change:0 "[child.GetFirstNameNoTooltip|U] must have just been lying!"
 mcpe.27.t:0 "Funeral"
 mcpe.27.d:0 "A loyal servant of my household has passed away. At the funeral, watching this familiar face depart forever, I was struck for the first time with the sobering truth: regardless of one's status, all must eventually die."
 mcpe.27.a:0 "...Without divine guidance, we are nothing."
 mcpe.27.b:0 "...Power and glory ultimately mean nothing."
 mcpe.27.c:0 "...This funeral is both tedious and annoying."
 mcpegr.27.d:0 "A loyal servant of the household has passed away. At the funeral, [child.GetTitledFirstName] appeared contemplative, so I asked [child.GetHerHim] about their views on life and death. \n\n"
 mcpegr.27.d_zealous:0 "[child.GetSheHe|U] believes that a brief life without the guidance of deities is meaningless, and only faith can lead one to find their destination."
 mcpegr.27.d_content:0 "[child.GetSheHe|U] believes that since everyone must eventually die, power and honor are not worth pursuing for a lifetime."
 mcpegr.27.d_callous:0 "[child.GetSheHe|U] merely finds funerals tedious and troublesome; the deceased would not care whether anyone accompanies them."
 mcpegr.27.confirm_zealous:0 "Prudently speaking, [child.GetFirstNameNoTooltip|U]."
 mcpegr.27.confirm_content:0 "Yes, power and glory are always fleeting."
 mcpegr.27.confirm_callous:0 "I agree. Why must we be there?"
 mcpegr.27.zealous_change:0 "This is a significant religious ceremony!"
 mcpegr.27.content_change:0 "Power and glory are always fleeting!"
 mcpegr.27.callous_change:0 "Why still care about this funeral?"
 mcpe.28.t:0 "Traveling Merchant"
 mcpe.28.d:0 "A traveling merchant arrives at the castle, showing me exotic foods, toys, and amulets, while weaving a thrilling origin story for each item. [guardian.GetTitledFirstName] arrives just as the merchant asks what I have chosen."
 mcpe.28.a:0 "This food looks delicious! I want to try it!"
 mcpe.28.b:0 "I want this mysterious lucky charm!"
 mcpe.28.c:0 "I am not foolish. I will not believe these lies."
 mcpegr.28.d:0 "A traveling merchant arrives at the castle, presenting various exotic goods to [child.GetTitledFirstName] and recounting many wondrous tales. \n\n"
 mcpegr.28.d_gluttonous:0 "[child.GetSheHe|U] shows no interest in those mysterious talismans, his gaze fixed solely on the foreign food."
 mcpegr.28.d_trusting:0 "[child.GetSheHe|U]believed the merchant's story and asked me to buy a lucky charm from afar."
 mcpegr.28.d_cynical:0 "[child.GetSheHe|U]Saw through the merchant's boasting and concluded that all those so-called mysterious powers were mere lies."
 mcpegr.28.confirm_gluttonous:0 "Eating well is not a bad thing!"
 mcpegr.28.confirm_trusting:0 "Of course, do as you please."
 mcpegr.28.confirm_cynical:0 "[child.GetFirstNameNoTooltip|U] is not easily deceived."
 mcpegr.28.gluttonous_change:0 "You should try the food here, [child.GetFirstNameNoTooltip|U]!"
 mcpegr.28.trusting_change:0 "You should take the Good Fortune Talisman!"
 mcpegr.28.cynical_change:0 "How could you believe such lies?"
 mcpe.29.t:0 "Entertain"
 mcpe.29.d:0 "A traveler from afar has taken refuge in the castle. Their child found me and earnestly asked how they might repay the hospitality received over these past few days."
 mcpe.29.a:0 "No need to thank us."
 mcpe.29.b:0 "Can you help me with some household chores?"
 mcpe.29.c:0 "...Why are you speaking to me?"
 mcpegr.29.d:0 "A traveler from afar has taken shelter in the castle. Their child found [child.GetTitledFirstName] and asks how they might repay our hospitality. \n\n"
 mcpegr.29.d_just:0 "[child.GetFirstNameNoTooltip|U] indicates that hosting travelers is the host's duty and does not require additional recompense."
 mcpegr.29.d_lazy:0 "[child.GetFirstNameNoTooltip|U]Request the other party to complete several errands on your behalf."
 mcpegr.29.d_shy:0 "[child.GetFirstNameNoTooltip|U]Did not know how to respond and thereafter remained hiding in his own room."
 mcpegr.29.confirm_just:0 "Yes, that is how it should be."
 mcpegr.29.confirm_lazy:0 "Hmm, I think they can help..."
 mcpegr.29.confirm_shy:0 "Let's give [child.GetHerHim] some space."
 mcpegr.29.just_change:0 "It is our duty to be warm and hospitable!"
 mcpegr.29.lazy_change:0 "We can have them do some housework for us."
 mcpegr.29.shy_change:0 "We don't want to be disturbed!"
 mcpe.30.t:0 "Promise of Progress"
 mcpe.30.d:0 "My mentor reminds me that I had promised to devote more effort to my studies, yet recent progress remains unsatisfactory. Perhaps the instruction is lacking, but ultimately, it is I who made the promise."
 mcpe.30.a:0 "I no longer care about that promise."
 mcpe.30.b:0 "Alright, I'll study a bit more. A promise is a promise."
 mcpe.30.c:0 "How dare you blame me for your own incompetence?!"
 mcpegr.30.d:0 "[child.GetTitledFirstName|U] once promised the mentor to study even harder, but recent progress remains unsatisfactory. I wanted to know how [child.GetSheHe] would view this promise, so I asked personally. \n\n"
 mcpegr.30.d_arbitrary:0 "[child.GetSheHe|U] no longer holds the original promise in mind."
 mcpegr.30.d_diligent:0 "[child.GetSheHe|U] still values the original promise and decides to work harder in the future."
 mcpegr.30.d_wrathful:0 "[child.GetSheHe|U]blames all responsibility on the mentor, deeming them incompetent, and thus attributes their own lack of academic progress to this."
 mcpegr.30.confirm_arbitrary:0 "Sometimes, promises must be broken."
 mcpegr.30.confirm_diligent:0 "Impressive, [child.GetFirstNameNoTooltip|U]. Keep going."
 mcpegr.30.confirm_wrathful:0 "This is an understandable reaction."
 mcpegr.30.arbitrary_change:0 "Why do you still care about that promise?"
 mcpegr.30.diligent_change:0 "A promise is a promise. Continue to learn!"
 mcpegr.30.wrathful_change:0 "Aren't you angry at this incompetent mentor?"
 mcpe.31.t:0 "Bagua"
 mcpe.31.d.no_bully_fallback:0 "Another child has been spreading vicious rumors about me. Perhaps the other party merely seeks attention, or perhaps it stems from jealousy, but this cannot alter the facts themselves."
 mcpe.31.d.bully:0 "[bully.GetTitledFirstName|U] has been spreading vicious rumors about me. Perhaps [bully.GetSheHe] merely seeks attention, or perhaps it stems from jealousy, but this cannot change the facts themselves."
 mcpe.31.a:0 "... Under different circumstances, we could have become friends."
 mcpe.31.b:0 "...Anyone who disrespects me will pay the price, regardless of their reasons."
 mcpe.31.c:0 "...I do not care how my subordinates view me."
 mcpegr.31.d.no_bully_fallback:0 "Another child has been spreading vicious rumors about [child.GetTitledFirstName]. [child.GetFirstNameNoTooltip] believes that the other party might just be seeking attention or perhaps acting out of jealousy. \n\n"
 mcpegr.31.d.bully:0 "[bully.GetTitledFirstName|U] has been spreading vicious rumors about [child.GetTitledFirstName]. [child.GetFirstNameNoTooltip] believes that [bully.GetFirstNameNoTooltip] might just be seeking attention or is motivated by jealousy. \n\n"
 mcpegr.31.d_forgiving:0 "[child.GetSheHe|U] finds such behavior pitiful and is unwilling to hold a grudge against the other party for long."
 mcpegr.31.d_vengeful:0 "[child.GetSheHe|U] does not care why the other party acted this way; they only know that those who offend them must pay a price."
 mcpegr.31.d_arrogant:0 "[child.GetSheHe|U] simply did not take rumors to heart, as it was beneath him to concern himself with those far inferior to himself."
 mcpegr.31.confirm_forgiving:0 "Indeed. What a waste."
 mcpegr.31.confirm_vengeful:0 "That's right. Let them pay the price."
 mcpegr.31.confirm_arrogant:0 "Yes, why should we care about them?"
 mcpegr.31.forgiving_change:0 "You could have been friends!"
 mcpegr.31.vengeful_change:0 "Make everyone respect you!"
 mcpegr.31.arrogant_change:0 "Why bother caring about your subordinates?"
 mcpe.32.t:0 "Little thief"
 mcpe.32.d:0 "In the marketplace, I saw a ragged child hiding behind a crate and stealing some food when no one was looking. [guardian.GetTitledFirstName|U] also noticed this and is waiting for my decision."
 mcpe.32.a:0 "Tell the merchants who stole from them!"
 mcpe.32.b:0 "Find the children and make them work for us."
 mcpe.32.c:0 "Let's give this poor child some food!"
 mcpegr.32.d:0 "In the marketplace, I saw a ragged child steal food when no one was looking. [child.GetTitledFirstName|U] also noticed and said to me: \n\n"
 mcpegr.32.d_honest:0 "That merchant should know who stole the items."
 mcpegr.32.d_ambitious:0 "As long as we find that child, we can make the other party work for us in exchange for food."
 mcpegr.32.d_generous:0 "We should give that child some food so the other party will no longer need to steal."
 mcpegr.32.confirm_honest:0 "Yes, the thief must be caught."
 mcpegr.32.confirm_ambitious:0 "Good idea, [child.GetFirstNameNoTooltip|U]."
 mcpegr.32.confirm_generous:0 "Indeed, let us grant it."
 mcpegr.32.honest_change:0 "Merchants need to know who stole their goods!"
 mcpegr.32.ambitious_change:0 "Why don't we make this child work for us?"
 mcpegr.32.generous_change:0 "No, let's give this poor child some food!"
 mcpe.33.t:0 "Horticulture"
 mcpe.33.d:0 "I recently started learning gardening, but the plants I tend to personally never seem to grow. My mentor says that plants have their own seasons, but in my view, this is just a long and boring wait."
 mcpe.33.a:0 "That's too foolish. I don't have time to do this."
 mcpe.33.b:0 "There is no need to worry about this."
 mcpe.33.c:0 "In some respects, gardening is very much like ruling a country."
 mcpegr.33.d:0 "[child.GetTitledFirstName|U]I recently began learning gardening, but the plants I tend with my own hands never seem to grow. When I discussed this matter with [child.GetHerHim], [child.GetSheHe] said: \n\n"
 mcpegr.33.d_impatient:0 "This is far too boring! I have no time to wait around forever!"
 mcpegr.33.d_calm:0 "There's no need to rush. No one can learn everything at once."
 mcpegr.33.d_content:0 "Tending to flowers and plants is already enough to satisfy me; I do not understand why people still pursue power and glory."
 mcpegr.33.confirm_impatient:0 "Alright, let's do something else then."
 mcpegr.33.confirm_calm:0 "Yes, there is nothing shameful about this."
 mcpegr.33.confirm_content:0 "Yes, you are satisfied with what you possess."
 mcpegr.33.impatient_change:0 "You should not waste your time on this."
 mcpegr.33.calm_change:0 "There is no need to feel uneasy about this."
 mcpegr.33.content_change:0 "Do you now see how futile it is to strive for power?"
 mcpe.34.t:0 "Lunch break"
 mcpe.34.d:0 "I watched the soldiers train in the courtyard all morning. During the midday break, I decided to approach them and say a few words."
 mcpe.34.a:0 "...some wonderful stories!"
 mcpe.34.b:0 "...I admire them so much!"
 mcpe.34.c:0 "...Stop slacking off!"
 mcpegr.34.d:0 "[child.GetTitledFirstName|U] watched the soldiers train for the morning. During the lunch break, [child.GetSheHe] approached them to talk with them. \n\n"
 mcpegr.34.d_gregarious:0 "[child.GetSheHe|U] shared stories with the soldiers and quickly became one with everyone."
 mcpegr.34.d_humble:0 "[child.GetSheHe|U] Thank you to the soldiers for protecting everyone; this praise makes them feel greatly appreciated."
 mcpegr.34.d_sadistic:0 "[child.GetSheHe|U] ordered the soldiers to stop slacking off and resume training, which greatly angered everyone."
 mcpegr.34.confirm_gregarious:0 "Sharing stories is always fun."
 mcpegr.34.confirm_humble:0 "It is a good thing to respect soldiers."
 mcpegr.34.confirm_sadistic:0 "You heard [child.GetHerHim], go back and train!"
 mcpegr.34.gregarious_change:0 "[child.GetFirstNameNoTooltip|U]You really should learn how to socialize!"
 mcpegr.34.humble_change:0 "[child.GetFirstNameNoTooltip|U] should respect the troops!"
 mcpegr.34.sadistic_change:0 "[child.GetFirstNameNoTooltip|U] should stop them from slacking off!"
 mcpe.35.t:0 "Just a child"
 mcpe.35.d:0 "The elders always refuse to take my opinions seriously, citing my young age as the reason. I am tired of this condescension and must find a way to change their attitude."
 mcpe.35.a:0 "If I want to be treated like an adult, I must act like one."
 mcpe.35.b:0 "If I shout loud enough, they will *have to* listen to me!"
 mcpe.35.c:0 "I shouldn't even worry about this."
 mcpegr.35.d:0 "[child.GetTitledFirstName|U] is dissatisfied with adults always looking down on [child.GetHerHim] because of her young age. After much thought, [child.GetSheHe] told me: \n\n"
 mcpegr.35.d_temperate:0 "If I want them to treat me as a leader, I must first act like one."
 mcpegr.35.d_stubborn:0 "As long as my voice is loud enough, they will eventually have to listen to me!"
 mcpegr.35.d_patient:0 "I need not worry about this. When I grow up, the problem will naturally disappear."
 mcpegr.35.confirm_temperate:0 "Yes, start acting like a human being."
 mcpegr.35.confirm_stubborn:0 "Yes, that is indeed the case."
 mcpegr.35.confirm_patient:0 "Indeed. No need to worry."
 mcpegr.35.temperate_change:0 "You should start acting like an adult!"
 mcpegr.35.stubborn_change:0 "You just need to shout loudly!"
 mcpegr.35.patient_change:0 "You only need to wait a little longer!"
