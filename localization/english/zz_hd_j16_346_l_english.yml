 hd_j16.1006.t:0 "A Guardian for the Heir"
 hd_j16.1006.desc:0 "You are gravely ill, and your heir Shi Shi is only eleven. Zhang Chai, an old general tied to the boy's mother, tends you at your bedside and keeps pressing: a child ruler needs a seasoned hand to hold the court, and he will give his life for it.\n\nHe is your veteran and the heir's kin by marriage. With him the boy has a protector, but the princes at Ye may never accept him."
 hd_j16.1006.a:0 "Make Zhang Chai regent for the heir."
 hd_j16.1006.b:0 "The court needs no single guardian."
 hd_j16.1013.t:0 "Civil War at Ye"
 hd_j16.1013.desc:0 "[hd_news_b.GetName] has shut the gates and refuses to step down. [hd_news_a.GetName] marches from Licheng with his generals, Ran Min at the van, straight for Ye.\n\nShi Hu is not yet buried, and his sons already fight beneath the capital walls."
 hd_j16.1016.t:0 "Rising at Ji"
 hd_j16.1016.desc:0 "[hd_news_a.GetName], who holds You Province, refuses to accept the deposition at Ye. He sends out calls to arms and marches south against [hd_news_b.GetName]. Ye hurries Ran Min and Li Nong north to meet him.\n\nOnce again the Shi brothers turn their blades on their own house."
 hd_j16.1022.t:0 "Shi Jian Rises"
 hd_j16.1022.desc:0 "His palace plot exposed, [hd_news_a.GetName] raises troops openly and breaks with [hd_news_b.GetName]. Zhao falls back into civil war. The generals wait to see who wins, and Ran Min, who commands the palace guard, gives nothing away."
 hd_j16.1155.t:0 "Murong Ke, Prince of Taiyuan"
 hd_j16.1155.desc:0 "You know your days are few, and the crown prince Murong Wei is still a child. Every eye at court turns to your brother Murong Ke, Prince of Taiyuan: victorious, modest, and trusted by every soldier.\n\nYou can entrust your son and the realm to him, or make other arrangements."
 hd_j16.1155.a:0 "Entrust the realm to the Prince of Taiyuan."
 hd_j16.1155.b:0 "I have other plans."
 hd_j16.1156.t:0 "The Grand Tutor Murong Ping"
 hd_j16.1156.desc:0 "Murong Ke is dead, and the court has lost its anchor. Your great-uncle, the Grand Tutor Murong Ping, has the highest standing and the Empress Dowager's trust, and asks to take charge of the government. Everyone also knows he is greedy.\n\nHand him the court and you are spared the work, but the treasury will drain and hearts will drift. Take it yourself and you offend the eldest of your house."
 hd_j16.1156.a:0 "Leave the government to the Grand Tutor."
 hd_j16.1156.b:0 "I will rule in person."
 hd_j16_ping_slighted_opinion:0 "Kept at Arm's Length"
