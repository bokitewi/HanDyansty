l_english:
 hd_j16.1001.t:0 "The Eastern Palace Affair"
 hd_j16.1001.desc:0 "Terrible news comes out of Ye: Crown Prince Shi Xuan sent assassins into a Buddhist temple by night and killed his own brother Shi Tao, Duke of Qin. Grief-stricken and enraged, [hd_news_a.GetName] has had Shi Xuan torn apart by chariots, his household slaughtered, and the ten-year-old Shi Shi named heir.\n\nThe princes of Zhao each weigh their chances, and the frontier generals begin to wonder how long the old Heavenly King can hold the realm together."
 hd_j16.1002.t:0 "Blood in the Eastern Palace"
 hd_j16.1002.desc:0 "Shi Tao lies dead in the temple, the wounds still fresh. The interrogators report that the killers came from the Eastern Palace, sent by Crown Prince Shi Xuan himself. The court waits on your word: the heir you raised up has murdered your favorite son.\n\nYou may punish him by law, raise an elder son in his place, or pretend you never heard. Whatever you choose, Ye will remember it."
 hd_j16.1002.a:0 "Tear Shi Xuan apart; make young Shi Shi heir."
 hd_j16.1002.b:0 "Punish Shi Xuan; make the elder Shi Zun heir."
 hd_j16.1002.c:0 "Tao is gone; I will not lose Xuan too. Pardon him."
 hd_j16.1003.t:0 "A Plot in the Eastern Palace"
 hd_j16.1003.desc:0 "Father favors Shi Tao more each day: gifts, troops and mansions all flow his way, and people whisper that the succession will change. Yang Bei of your guard is ready to die for you. Tonight Shi Tao sleeps in the temple, and one word from you will end him.\n\nFather will be furious. You can gamble, or keep enduring and wait for your day to come."
 hd_j16.1003.a:0 "Send Yang Bei to the temple tonight."
 hd_j16.1003.b:0 "Endure, and wait."
 hd_j16.1004.t:0 "Taking the Imperial Throne"
 hd_j16.1004.desc:0 "For over ten years you have ruled Hebei and Guanzhong as Heavenly King. Your ministers now petition you to take the imperial title and proclaim the Taining era. The palaces of Ye were built to imperial scale long ago; only the edict is missing."
 hd_j16.1004.a:0 "Take the throne and proclaim Taining."
 hd_j16.1004.b:0 "Heavenly King is title enough."
 hd_j16.1005.t:0 "Shi Hu Proclaims Himself Emperor"
 hd_j16.1005.desc:0 "[hd_news_a.GetName] has taken the imperial throne at Ye and proclaimed the Taining era, openly rivaling the Jin court in Jiankang. Those present noticed that the new emperor already looked gravely ill."
 hd_j16.1010.t:0 "The Uprising at Licheng"
 hd_j16.1010.desc:0 "[hd_news_a.GetName] gathered the generals at Licheng and marched back on Ye to purge the sovereign's side, deposing the child ruler [hd_news_b.GetName] and seizing the throne. Empress Dowager Liu and the regent Zhang Chai were killed soon after.\n\nShi Hu has been dead barely a month, and his sons are already at each other's throats."
 hd_j16.1011.t:0 "Shi Zun at the Gates"
 hd_j16.1011.desc:0 "Your brother Shi Zun has camped outside the city with the army that crushed Liang Du, vowing to kill Zhang Chai and cleanse the court. The garrison wavers, and your regents are already arranging their escape.\n\nYou are too young to have many choices: open the gates and perhaps live, or bar them and start a war between brothers."
 hd_j16.1011.a:0 "Open the gates and abdicate to save my life."
 hd_j16.1011.b:0 "Bar the gates!"
 hd_j16.1012.t:0 "The Council at Licheng"
 hd_j16.1012.desc:0 "The generals at Licheng urge you to march on Ye. Zhang Chai rules in the boy's name, and the child cannot hold the realm; raise your banner and the gates of Ye will open by themselves. Ran Min and Li Nong offer to lead the vanguard."
 hd_j16.1012.a:0 "March on Ye, take the throne, and give Ran Min the army."
 hd_j16.1012.b:0 "No. I will serve the young ruler."
 hd_j16.1015.t:0 "The Council at Ji"
 hd_j16.1015.desc:0 "Shi Zun has deposed his brother at Ye. Your officers at Ji urge you to rise against him: you hold You Province with a strong army, and if you hesitate you will be the next one he deals with."
 hd_j16.1015.a:0 "Rise against Shi Zun!"
 hd_j16.1015.b:0 "Send congratulations and wait."
 hd_j16.1020.t:0 "Stirrings in the Palace"
 hd_j16.1020.desc:0 "A secret report says Shi Jian, Prince of Yiyang, has been meeting often with Ran Min, and the palace guard is full of Ran Min's old soldiers. You once promised Ran Min the crown prince's seat and never kept your word; his resentment is no secret.\n\nStrike Ran Min first and Shi Jian has no troops. But Ran Min commands the guard, and if you fail, there is no telling what follows."
 hd_j16.1020.a:0 "Kill Ran Min first!"
 hd_j16.1020.b:0 "Ran Min is just a soldier. No threat."
 hd_j16.1021.t:0 "The Plot at Kunhua Hall"
 hd_j16.1021.desc:0 "Shi Zun grows more suspicious by the day. Ran Min has quietly promised that, with one nod from you, the guard will enter the palace tonight. Take his place and Zhao is yours; wait, and sooner or later his blade will find you."
 hd_j16.1021.a:0 "Tonight, then."
 hd_j16.1021.b:0 "I cannot kill my own brother."
 hd_j16.1025.t:0 "Shi Jian Kills Shi Zun"
 hd_j16.1025.desc:0 "[hd_news_a.GetName] used Ran Min's guards to kill [hd_news_b.GetName] and took the throne at Ye. Zhao has changed rulers three times in half a year, and the man who truly holds the army is a general not named Shi."
 hd_j16.1030.t:0 "The Edict to Kill the Hu"
 hd_j16.1030.desc:0 "Sun Fudu led Jie warriors into the palace and was driven back. Suspicion between Hu and Han in the city has reached its peak. Your generals urge an edict: any Hu who bears arms is to be killed, and any who brings in a Hu head will be promoted three grades.\n\nOnce issued, there is no turning back for Ye."
 hd_j16.1030.a:0 "Issue it: any of the six tribes who bear arms will die!"
 hd_j16.1030.b:0 "Punish only Sun Fudu and his faction."
 hd_j16.1031.t:0 "Slaughter at Ye"
 hd_j16.1031.desc:0 "[hd_news_a.GetName] has ordered the Hu and Jie of Ye put to the sword; tens of thousands died in a single day. The Di and Qiang tribes who served Zhao are leading their people west or holding their own lands. The realm of the Shi has broken apart."
 hd_j16.1040.t:0 "Besieging Xiangguo"
 hd_j16.1040.desc:0 "Shi Zhi has proclaimed himself emperor at Xiangguo and sent envoys everywhere begging for help. Your generals urge you to besiege the city before his allies arrive and finish off the house of Shi."
 hd_j16.1040.a:0 "Besiege Xiangguo!"
 hd_j16.1040.b:0 "Hold for now."
 hd_j16.1041.t:0 "Xiangguo Begs for Aid"
 hd_j16.1041.desc:0 "Shi Zhi's envoy kneels before you: if Ran Min takes Xiangguo, Yan will be next. Shi Zhi offers to drop the imperial title and call himself King of Zhao in exchange for your help."
 hd_j16.1041.a:0 "Send Yue Wan to relieve Zhao."
 hd_j16.1041.b:0 "Let the two tigers fight."
 hd_j16.1045.t:0 "An Emperor at Xiangguo"
 hd_j16.1045.desc:0 "Ye has fallen to Ran Min, and the Shi clan and old ministers are fleeing to Xiangguo. They acclaim you as their lord and beg you to take the imperial throne and carry on the line of Great Zhao."
 hd_j16.1045.a:0 "Take the throne to carry on Zhao."
 hd_j16.1045.b:0 "I dare only call myself King of Zhao."
 hd_j16.1046.t:0 "Shi Zhi Proclaims Himself Emperor"
 hd_j16.1046.desc:0 "[hd_news_a.GetName] has taken the imperial throne at Xiangguo and stands against Ran Min at Ye. Hebei now has two masters, and between their cities there is nothing but war."
 hd_j16.1050.t:0 "Liu Xian Murders His Lord"
 hd_j16.1050.desc:0 "[hd_news_a.GetName], general of Xiangguo, turned his army back, killed [hd_news_b.GetName], and sent the head to Ye with an offer of surrender to Ran Min. The last of the Shi line in Hebei was ended by one of their own commanders."
 hd_j16.1051.t:0 "Liu Xian Rebels Again"
 hd_j16.1051.desc:0 "Liu Xian surrendered and then rebelled again, proclaiming himself ruler at Xiangguo. Your generals ask leave to march once more and end this faithless threat for good."
 hd_j16.1051.a:0 "Crush Liu Xian!"
 hd_j16.1051.b:0 "Leave him be for now."
 hd_j16.1110.t:0 "The Council Before Liantai"
 hd_j16.1110.desc:0 "Ran Min has fought on every front and his army is worn out; he is foraging around Zhongshan. Murong Ke asks to lead the elite horse south, chain his cavalry into a square, and meet him in battle."
 hd_j16.1110.a:0 "Send Murong Ke against Ran Min!"
 hd_j16.1110.b:0 "Ran Min is too fierce. Do not risk it."
 hd_j16.1111.t:0 "The Battle of Liantai"
 hd_j16.1111.desc:0 "The army of [hd_news_a.GetName] has defeated [hd_news_b.GetName] at Liantai. After ten victories in ten battles, Ran Min finally fell exhausted into enemy hands and was sent to Longcheng. Only his son and a lonely city remain at Ye."
 hd_j16.1112.t:0 "Yan at the Walls"
 hd_j16.1112.desc:0 "The Yan army is beneath the walls of Ye. The granaries are empty and people are eating one another. Jiang Gan urges you to hold out until help comes from Jin; others urge you to open the gates and save the clan."
 hd_j16.1112.a:0 "Open the gates and submit to Yan."
 hd_j16.1112.b:0 "Hold Ye to the last!"
 hd_j16.1113.t:0 "Besieging Ye"
 hd_j16.1113.desc:0 "Ran Min is a captive, and only his son Ran Zhi and Jiang Gan hold Ye. Your generals ask to press on and seize the heart of Hebei."
 hd_j16.1113.a:0 "Besiege Ye!"
 hd_j16.1113.b:0 "Rest the army for now."
 hd_j16.1114.t:0 "Yan Takes Ye"
 hd_j16.1114.desc:0 "The troops of [hd_news_a.GetName] have stormed Ye and the Wei of Ran is no more. The imperial seal has gone south to Jiankang with Jiang Gan, while the palaces of Hebei now fly the banners of the Murong."
 hd_j16.1120.t:0 "The Yuanxi Proposal"
 hd_j16.1120.desc:0 "Yan now holds You and Ji. Your ministers petition: the Shi and the Ran have both fallen, the Central Plain has no master, and you should take the imperial throne and proclaim the Yuanxi era rather than bow to the court beyond the river."
 hd_j16.1120.a:0 "Take the throne and proclaim Yuanxi."
 hd_j16.1120.b:0 "I remain King of Yan."
 hd_j16.1121.t:0 "Murong Jun Proclaims Himself Emperor"
 hd_j16.1121.desc:0 "[hd_news_a.GetName] has taken the imperial throne and proclaimed the Yuanxi era, telling the Jin envoy to inform his master that the Central Plain has chosen its own emperor. Yan no longer follows the Jin calendar."
 hd_j16.1125.t:0 "Seizing Qing Province"
 hd_j16.1125.desc:0 "Zhao is in chaos and Qing Province has no master. Your people urge you to hold Guanggu as King of Qi, and send word to Jiankang acknowledging Jin to win an ally."
 hd_j16.1125.a:0 "Hold Guanggu as King of Qi."
 hd_j16.1125.b:0 "Remain loyal to Zhao."
 hd_j16.1126.t:0 "Duan Kan Holds Qi"
 hd_j16.1126.desc:0 "[hd_news_a.GetName] of the Duan Xianbei has seized Guanggu, called himself King of Qi, and declared himself a vassal of Jin. Qing Province is now one more prize between Yan and Jin."
 hd_j16.1130.t:0 "The Siege of Guanggu"
 hd_j16.1130.desc:0 "Duan Kan holds Guanggu as King of Qi and keeps clashing with Yan. Murong Ke asks to march east and surround the city, starving it rather than storming it."
 hd_j16.1130.a:0 "Send Murong Ke to Guanggu!"
 hd_j16.1130.b:0 "Qing is too far. Leave it."
 hd_j16.1135.t:0 "Moving the Capital to Ye"
 hd_j16.1135.desc:0 "The palaces of Ye are grand and the city commands Hebei. Your ministers ask you to move the court from Ji to Ye, to show that Yan is now master of the Central Plain."
 hd_j16.1135.a:0 "Move the capital to Ye."
 hd_j16.1135.b:0 "Stay at Ji."
 hd_j16.1140.t:0 "Taking Luoyang"
 hd_j16.1140.desc:0 "The Jin garrison at Luoyang is thin. Murong Ke asks to march west and take the old capital; with Luoyang in hand, Yan's border will touch Qin in Guanzhong."
 hd_j16.1140.a:0 "Take Luoyang!"
 hd_j16.1140.b:0 "Luoyang is in ruins. It is not worth it."
 hd_j16.1150.t:0 "Suspicion"
 hd_j16.1150.desc:0 "After Fangtou your fame outshines everyone at court, and the Grand Tutor Murong Ping and the Empress Dowager Kezuhun are plotting to be rid of you. Your son Murong Ling urges you to flee: Fu Jian of Qin honors able men and will take you in.\n\nStay, and you may plead your case, though few will listen. Go, and you become a traitor to Yan."
 hd_j16.1150.a:0 "Take Ling and flee west to Qin."
 hd_j16.1150.b:0 "Stay and clear my name."
 hd_j16.1151.t:0 "The Prince of Wu's Merit"
 hd_j16.1151.desc:0 "Murong Chui crushed the Jin army at Fangtou and his prestige is at its height. The Grand Tutor Murong Ping and the Empress Dowager keep warning you that his merit is too great to control, and that you should deal with him early."
 hd_j16.1151.a:0 "A subject this great must be watched."
 hd_j16.1151.b:0 "He is the realm's shield. Give him the army."
 hd_j16.1152.t:0 "Murong Chui Flees to Qin"
 hd_j16.1152.desc:0 "[hd_news_a.GetName], the great general of Yan, has fled to Chang'an with his son. Fu Jian rode out of the city to greet him as an honored guest. Wang Meng stood by in silence."
 hd_j16.1205.t:0 "King of the Three Qin"
 hd_j16.1205.desc:0 "Zhao has collapsed and Guanzhong has no master. Your people urge you to call yourself Grand Chanyu and King of the Three Qin, and lead them home to Guanzhong. Others urge you to send envoys to Jiankang and accept a Jin title."
 hd_j16.1205.a:0 "Proclaim myself King of the Three Qin!"
 hd_j16.1205.b:0 "Submit to Jin and accept its title."
 hd_j16.1206.t:0 "Fu Hong, King of the Three Qin"
 hd_j16.1206.desc:0 "The Di chieftain [hd_news_a.GetName] has proclaimed himself Grand Chanyu and King of the Three Qin at Fangtou and prepares to lead his people west into Guanzhong."
 hd_j16.1210.t:0 "My Brother Fu Fa"
 hd_j16.1210.desc:0 "You have taken the throne, but your mother, Empress Dowager Gou, does not trust your elder half-brother Fu Fa: he is popular and his house is always full of guests. She has already ordered him to take his own life, and waits only for your nod."
 hd_j16.1210.a:0 "I cannot defy my mother."
 hd_j16.1210.b:0 "I will protect my brother's life."
 hd_j16.1215.t:0 "The Huangshi Proposal"
 hd_j16.1215.desc:0 "Guanzhong is secure. Your ministers ask you to drop the title of Heavenly King, take the imperial throne and proclaim the Huangshi era, standing as an equal to Eastern Jin and Yan."
 hd_j16.1215.a:0 "Take the throne and proclaim Huangshi."
 hd_j16.1215.b:0 "I remain Heavenly King."
 hd_j16.1216.t:0 "Fu Jian Proclaims Himself Emperor"
 hd_j16.1216.desc:0 "[hd_news_a.GetName] has taken the imperial throne at Chang'an under the name of Great Qin. Guanzhong has a new court."
 hd_j16.1220.t:0 "Wang Jinglüe of Beihai"
 hd_j16.1220.desc:0 "Lü Polou recommends a poor scholar living in seclusion at Huayin named Wang Meng, a man of great designs who once refused Huan Wen's invitation to come south. You summon him, and the conversation feels like Liu Bei meeting Zhuge Liang."
 hd_j16.1220.a:0 "Make him Palace Attendant and trust him with affairs."
 hd_j16.1220.b:0 "A man of humble birth should not rise so fast."
 hd_j16.1225.t:0 "Zhang Ping of Bing Province"
 hd_j16.1225.desc:0 "Zhang Ping holds Bing Province and keeps switching sides between Yan and Qin. Your generals ask leave to subdue him and take in his men, among them his adopted son Zhang Hao, said to be a match for ten thousand."
 hd_j16.1225.a:0 "March against Zhang Ping!"
 hd_j16.1225.b:0 "Keep him on a loose rein for now."
 hd_j16.1230.t:0 "The Revolt of the Four Dukes"
 hd_j16.1230.desc:0 "Fu Liu at Puban, Fu Shuang at Shanggui, Fu Sou at Shancheng and Fu Wu at Anding have all risen at once. Wang Meng urges you to march at once and defeat them one by one; others urge you to remember they are kin and offer them pardon."
 hd_j16.1230.a:0 "March against them!"
 hd_j16.1230.b:0 "Offer pardon and spare their lives."
 hd_j16.1250.t:0 "The Plot at Shansang"
 hd_j16.1250.desc:0 "Yin Hao distrusts you, has sent assassins more than once, and wants to take your people. Now he leads a great army north and must pass through Shansang. Your officers urge you to lay an ambush and repay him."
 hd_j16.1250.a:0 "Ambush Yin Hao at Shansang!"
 hd_j16.1250.b:0 "Keep the pact."
 hd_j16.1251.t:0 "My Father's Last Words"
 hd_j16.1251.desc:0 "On his deathbed your father Yao Yizhong told you: I served the Shi because Jin was in chaos and they treated me well; now that they are gone, you must return to Jin and do nothing dishonorable. Your people await your decision."
 hd_j16.1251.a:0 "Obey my father and send envoys to Jin."
 hd_j16.1251.b:0 "Hold my own ground."
 hd_j16.1255.t:0 "The Battle of Sanyuan"
 hd_j16.1255.desc:0 "Yao Xiang has led the Qiang west into Guanzhong and camped at Xingcheng, vowing to reclaim his ancestors' lands. Deng Qiang and Fu Huangmei ask leave to meet him at Sanyuan."
 hd_j16.1255.a:0 "Meet Yao Xiang in battle!"
 hd_j16.1255.b:0 "Hold the walls."
 hd_j16.1280.t:0 "A Northern Campaign"
 hd_j16.1280.desc:0 "Shi Hu is dead and Hebei is in chaos; refugees from the north stream south every day. The soldiers of Xu and Yan ask to march on Pengcheng, take in the refugees and win back the old lands."
 hd_j16.1280.a:0 "March north!"
 hd_j16.1280.b:0 "The time is not right."
 hd_j16.1282.t:0 "Recovering Xu and Luo"
 hd_j16.1282.desc:0 "The barbarians are killing each other, and Xuchang and Luoyang are poorly defended. The court favors sending the General of the Central Army north to recover the old capital and blunt Huan Wen's influence upriver."
 hd_j16.1282.a:0 "March on Xuchang and Luoyang!"
 hd_j16.1282.b:0 "War is a dangerous tool. Not now."
 hd_j16.1283.t:0 "Defeat in the North"
 hd_j16.1283.desc:0 "The northern campaign has ended in disaster and the baggage is lost. Huan Wen has submitted a memorial impeaching Yin Hao and asking that he be made a commoner. The court is waiting to see what you will do."
 hd_j16.1283.a:0 "Strip Yin Hao of rank."
 hd_j16.1283.b:0 "Victory and defeat are common in war. Pardon him."
 hd_j16.1284.t:0 "Strange, Strange Business"
 hd_j16.1284.desc:0 "The northern campaign has ended in disaster. Huan Wen has impeached you, and the court means to strip you of rank and banish you to Dongyang. You may bow your head and accept, or hold Yang Province and refuse the edict."
 hd_j16.1284.a:0 "Accept the blame and give up Yang Province."
 hd_j16.1284.b:0 "Refuse the edict."
 hd_j16.1285.t:0 "Yin Hao Dismissed"
 hd_j16.1285.desc:0 "[hd_news_a.GetName], defeated in the north, has been made a commoner and sent to Dongyang. They say he spends his days tracing characters in the air, and those who look closely read the words 'strange, strange business'. No one at court can stand against Huan Wen now."
 hd_j16.1286.t:0 "Marching on Guanzhong"
 hd_j16.1286.desc:0 "Fu Jian has only just taken Guanzhong and his hold is still weak. The generals of Jing Province ask to march out through the Wu Pass and strike straight at Chang'an."
 hd_j16.1286.a:0 "March against Qin!"
 hd_j16.1286.b:0 "Guanzhong is too far and too rugged."
 hd_j16.1287.t:0 "Talking While Picking Lice"
 hd_j16.1287.desc:0 "As the army reaches Bashang, a scholar in coarse clothes comes to the camp and talks freely of the state of the realm while picking lice from his robe, as if no one else were there. His name is Wang Meng, of Beihai. When you ask why the heroes of Guanzhong have not come to greet you, he answers: because you have not crossed the Ba River to take Chang'an, and the people do not know your heart."
 hd_j16.1287.a:0 "Invite him to come south with the army."
 hd_j16.1287.b:0 "Just an eccentric."
 hd_j16.1288.t:0 "Director of the Secretariat"
 hd_j16.1288.desc:0 "Huan Wen has asked to lead a northern campaign and hinted that the court should grant him the posts of Palace Attendant, Grand Marshal, Commander of All Forces and Director of the Secretariat. He commands the armies of Jing and Yang, and no minister dares say no."
 hd_j16.1288.a:0 "Grant them, to keep him content."
 hd_j16.1288.b:0 "Government belongs to the court, not to him."
 hd_j16.1289.t:0 "The Edict of Appointment"
 hd_j16.1289.desc:0 "The court's edict has arrived: you are made Palace Attendant, Grand Marshal, Commander of All Forces, and Director of the Secretariat. From now on all power inside and outside the court rests with you."
 hd_j16.1289.a:0 "Accept."
 hd_j16.1289.b:0 "Decline."
 hd_j16.1290.t:0 "The Fangtou Proposal"
 hd_j16.1290.desc:0 "Murong Ke is dead and the court of Yan has fallen to the greedy Murong Ping. Your soldiers ask to march north from Gushu through Jinxiang and Fangtou straight to Ye and win back Hebei in one stroke."
 hd_j16.1290.a:0 "Launch the great campaign!"
 hd_j16.1290.b:0 "The supply lines are too long. Wait."
 hd_j16.1291.t:0 "Huan Wen Takes the Reins"
 hd_j16.1291.desc:0 "[hd_news_a.GetName] has been made Palace Attendant, Grand Marshal, Commander of All Forces, and Director of the Secretariat. The Son of Heaven sits idle in the palace at Jiankang, and all orders come from the Grand Marshal's headquarters."
 hd_j16.1292.t:0 "Yan Begs for Aid"
 hd_j16.1292.desc:0 "Jin has launched a great campaign north, and Yan has sent envoys begging for help, offering the lands west of Hulao. Wang Meng says: if Jin destroys Yan, Jin will be unstoppable; better to save Yan now and see what comes once both are weakened."
 hd_j16.1292.a:0 "Send Gou Chi and Deng Qiang to save Yan."
 hd_j16.1292.b:0 "Watch and wait."
 hd_j16.1293.t:0 "The Defeat at Fangtou"
 hd_j16.1293.desc:0 "With supplies exhausted, the Jin army fell back from Fangtou, and [hd_news_a.GetName] pursued with cavalry to Xiangyi, crushing it and taking thirty thousand heads. Huan Wen's prestige has collapsed, and the victor's name now unsettles every noble at the court of Yan."
 hd_j16.1294.t:0 "The Question of the Heir"
 hd_j16.1294.desc:0 "Your health grows worse by the day. Your ministers petition you to name an heir early for the sake of the realm; by custom, the throne should pass to your brother or an elder of the clan."
 hd_j16.1294.a:0 "I have heard you."
 hd_j16_346_army_zhao_name:0 "Zhao Army"
 hd_j16_346_army_wei_name:0 "Wei Army"
 hd_j16_346_army_yan_name:0 "Yan Army"
 hd_j16_346_army_qin_name:0 "Qin Army"
 hd_j16_346_army_jin_name:0 "Jin Army"
 hd_j16_346_army_qiang_name:0 "Qiang Riders"
 hd_j16_beifen_modifier:0 "Grief and Rage"
 hd_j16_beifen_modifier_desc:0 "Lost two sons in a single day and is sick with grief."
 hd_j16_shahu_modifier:0 "The Edict to Kill the Hu"
 hd_j16_shahu_modifier_desc:0 "Hu and Han are now blood enemies; their own people rally to them, while all others hate them."
 hd_j16_xiezhu_modifier:0 "Master of Thrones"
 hd_j16_xiezhu_modifier_desc:0 "Decides who sits on the throne; feared by all and watched by many."
 hd_j16_b4_jin_fanchen_modifier:0 "Follows the Jin Calendar"
 hd_j16_b4_jin_fanchen_modifier_desc:0 "Acknowledges the Jin court at Jiankang as the rightful dynasty."
 hd_j16_qiangbu_modifier:0 "Qiang Warbands"
 hd_j16_qiangbu_modifier_desc:0 "Leads the warriors of the Shaodang Qiang, every one a fighter."
 hd_j16_shansang_modifier:0 "Defeat at Shansang"
 hd_j16_shansang_modifier_desc:0 "Ambushed at Shansang, the baggage lost and the army shaken."
 hd_j16_wangmeng_de_modifier:0 "Wang Jinglüe at His Side"
 hd_j16_wangmeng_de_modifier_desc:0 "Has Wang Meng's counsel, like a fish that has found water."
 hd_j16_wanrendi_modifier:0 "Match for Ten Thousand"
 hd_j16_wanrendi_modifier_desc:0 "The bravest in the army, said to be a match for ten thousand men."
 hd_j16_dudu_zhongwai_modifier:0 "Commander Inside and Out"
 hd_j16_dudu_zhongwai_modifier_desc:0 "No one at court checks him now; all military power is in his hands."
 hd_j16_murong_ping_zhuanquan_modifier:0 "Murong Ping's Grip"
 hd_j16_murong_ping_zhuanquan_modifier_desc:0 "The Grand Tutor Murong Ping runs the court for his own gain; the treasury empties and hearts turn away."
 hd_j16_fangtou_ru_modifier:0 "Shame of Fangtou"
 hd_j16_fangtou_ru_modifier_desc:0 "Crushed at Fangtou, his reputation badly damaged."
