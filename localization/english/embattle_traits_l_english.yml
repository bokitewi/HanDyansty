l_english:
# ACOTW Compatch
trait_acotw_obscured:0 "The Obscured"
trait_acotw_obscured_desc:0 "This character is located outside of [diplomatic_range|E], making it difficult to verify details of his life."
trait_acotw_obscured_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is located outside of [diplomatic_range|E], making it difficult to verify the details of [ROOT.GetCharacter.GetHerHis]'s deeds."

#Commander Traits
trait_embattle_logistician: "Logistics Expert"
trait_embattle_logistician_1: "Experienced Quartermaster"
trait_embattle_logistician_2: "Master of Military Supplies"
trait_embattle_logistician_3: "Master of Logistics"
trait_embattle_logistician_desc: "If there is one thing a logistics expert knows, it's how to make supplies last longer—the longer, the better."
trait_embattle_logistician_character_desc: "If there is one thing [ROOT.GetCharacter.GetFirstNameNoTooltip] knows, it must be how to make supplies last longer—the longer the better."
trait_track_embattle_logistician: "Logistics Officer"
trait_track_embattle_logistician_desc: "#help You can gain experience along the route by leading your army to move across the map. #!\n\nMastering supply lines means controlling the war; your army will never falter at critical moments."

trait_embattle_military_engineer: "Military Engineer"
trait_embattle_military_engineer_1: "Skilled Artificer"
trait_embattle_military_engineer_2: "Siege Master"
trait_embattle_military_engineer_3: "City-destroying like a forest"
trait_embattle_military_engineer_desc: "Possessing extensive knowledge of siege engines and defensive fortifications, military engineers are not hindered by city walls."
trait_embattle_military_engineer_character_desc: "Possessing extensive knowledge of siege engines and defensive fortifications, [ROOT.GetCharacter.GetFirstNameNoTooltip] cannot be blocked by city walls. \n\n#weak [embattle|E]: Vice Commander and [embattle_tactic|E]#!"
trait_track_embattle_military_engineer: "Siege Force"
trait_track_embattle_military_engineer_desc: "#help You can gain experience on this route by successfully completing a siege. #!\n\nIn war, ramparts are challenges that must be overcome before armies can advance."

trait_embattle_aggressive_attacker: "Radical Offenders"
trait_embattle_aggressive_attacker_1: "Bold Vanguard"
trait_embattle_aggressive_attacker_2: "Fearless Vanguard"
trait_embattle_aggressive_attacker_3: "Famous Assault Specialist"
trait_embattle_aggressive_attacker_desc: "Nothing but the blood of enemies can satisfy the aggressive attacker."
trait_embattle_aggressive_attacker_character_desc: "Nothing can satisfy [ROOT.GetCharacter.GetFirstNameNoTooltip] except the blood of [ROOT.GetCharacter.GetHerHis]'s enemies. \n\n#weak [embattle|E]: Vice Commander and [embattle_tactic|E]#!"
trait_track_embattle_aggressive_attacker: "Offensive Specialist"
trait_track_embattle_aggressive_attacker_desc: "#help You can gain experience on this route by actively attacking. #!\n\nA swift offense is the best defense."

trait_embattle_unyielding_defender: "Defender"
trait_embattle_unyielding_defender_1: "Firm Defender"
trait_embattle_unyielding_defender_2: "Unyielding Defender"
trait_embattle_unyielding_defender_3: "Indomitable Sentinel"
trait_embattle_unyielding_defender_desc: "The golden rule known to the defender: The enemy can only go so far."
trait_embattle_unyielding_defender_character_desc: "The golden rule known to [ROOT.GetCharacter.GetFirstNameNoTooltip]: Enemies can only go this far. \n\n#weak [embattle|E]: Vice Commander and [embattle_tactic|E]#!"
trait_track_embattle_unyielding_defender: "Defense Expert"
trait_track_embattle_unyielding_defender_desc: "#help You can gain experience on this route by defending in battle. #!\n\nThe strength of the fortress depends on the will of its defenders."

trait_embattle_forder: "Those Who Cross the Water"
trait_embattle_forder_1: "Pawn"
trait_embattle_forder_2: "Those who cross the ferry"
trait_embattle_forder_3: "Wave Breaker"
trait_embattle_forder_desc: "This character feels at home near water and will not suffer penalties for crossing rivers or straits during war."
trait_embattle_forder_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] feels at home near water and will not suffer disadvantage penalties for crossing rivers or straits during war. \n\n#weak [embattle|E]: Lieutenant General and [embattle_tactic|E]#!"
trait_track_embattle_forder: "River Expert"
trait_track_embattle_forder_desc: "#help You can gain experience on this route by fighting in provinces along the coasts or on both banks of rivers. #!\n\nWhat others see as rushing rivers and gorges is, in your eyes, a path to victory."

trait_embattle_flexible_leader: "Versatile General"
trait_embattle_flexible_leader_1: "Adaptable Strategist"
trait_embattle_flexible_leader_2: "Versatile Battlefield Commander"
trait_embattle_flexible_leader_3: "Master of Mobile Warfare"
trait_embattle_flexible_leader_desc: "This character knows how to reduce the defensive advantages gained by defenders from fortifications, terrain, rivers, and straits."
trait_embattle_flexible_leader_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] knows how to reduce the defensive advantages gained by defenders from fortifications, terrain, rivers, and straits. \n\n#weak [embattle|E]: Vice Commander and [embattle_tactic|E]#!"
trait_track_embattle_flexible_leader: "Adaptable Strategist"
trait_track_embattle_flexible_leader_desc: "#help You can gain experience on this route by fighting with armies. #!\n\nAdaptability is key to survival in any battlefield."

trait_embattle_desert_warrior: "Desert Warrior"
trait_embattle_desert_warrior_1: "Shaqu Warriors"
trait_embattle_desert_warrior_2: "Sandsea Wanderer"
trait_embattle_desert_warrior_3: "Disaster of the Flowing Sand"
trait_embattle_desert_warrior_desc: "The scorching sun and intense heat of the desert are not this character's enemies."
trait_embattle_desert_warrior_character_desc: "The scorching sun and intense heat of the desert are not enemies of [ROOT.GetCharacter.GetFirstNameNoTooltip]. \n\n#weak [embattle|E]: Vice Commander and [embattle_tactic|E]#!"
trait_track_embattle_desert_warrior: "Expert in Desert Warfare"
trait_track_embattle_desert_warrior_desc: "#help You can gain experience on this route by fighting in deserts, desert mountains, oases, or arid regions. #!\n\nIn the vast and harsh desert, perseverance triumphs over all."

trait_embattle_jungle_stalker: "Jungle Stalker"
trait_embattle_jungle_stalker_1: "Vine Blade"
trait_embattle_jungle_stalker_2: "Lin Guan Hunter"
trait_embattle_jungle_stalker_3: "Shadows of the Jungle"
trait_embattle_jungle_stalker_desc: "All dense forests in any jungle are allies of this character."
trait_embattle_jungle_stalker_character_desc: "Any dense forest in the jungle is an ally of [ROOT.GetCharacter.GetFirstNameNoTooltip]. \n\n#weak [embattle|E]: Vice Commander and [embattle_tactic|E]#!"
trait_track_embattle_jungle_stalker: "Expert in Jungle Warfare"
trait_track_embattle_jungle_stalker_desc: "#help You can gain experience on this route by fighting in jungle terrain. #!\n\nThe dense jungles conceal hidden masters, ready to launch attacks from the shadows at any moment."

trait_embattle_reaver: "Plunderer"
trait_embattle_reaver_1: "Plunderer"
trait_embattle_reaver_2: "Plunderer"
trait_embattle_reaver_3: "Embodiment of Fear"
trait_embattle_reaver_desc: "The looter's desire for plunder is almost as strong as their thirst for victory: if there is anything of value, the looters will find it."
trait_embattle_reaver_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip]'s desire for loot is almost as strong as their desire for victory; if anything of value exists, [ROOT.GetCharacter.GetSheHe] will find it.\n\n#weak [embattle|E]: Vice Commander and [embattle_tactic|E]#!"
trait_track_embattle_reaver: "Plunderer"
trait_track_embattle_reaver_desc: "#help You can gain experience on this route by successfully raiding settlements. #!\n\nWherever the Raiders go, everything is profoundly reshaped by war and conquest."

trait_embattle_reckless: "Reckless"
trait_embattle_reckless_1: "Adventurous General"
trait_embattle_reckless_2: "Battlefield Gambler"
trait_embattle_reckless_3: "Heart of the Wild"
trait_embattle_reckless_desc: "If a rash general discovers an advantage, he will certainly seize it firmly."
trait_embattle_reckless_character_desc: "If [ROOT.GetCharacter.GetFirstNameNoTooltip] discovers an advantage, they will certainly hold onto it firmly. \n\n#weak [embattle|E]: Vice Commander and [embattle_tactic|E]#!"
trait_track_embattle_reckless: "Bold Commander"
trait_track_embattle_reckless_desc: "#help You can gain experience on this route by engaging in battles with larger armies. #!\n\nFavor attends those who dare to risk everything for a great cause."

trait_embattle_holy_warrior: "Sword of Faith"
trait_embattle_holy_warrior_1: "Blade of the Divine"
trait_embattle_holy_warrior_2: "Holy Warrior"
trait_embattle_holy_warrior_3: "Faithful Warrior"
trait_embattle_holy_warrior_desc: "The fervor of righteousness burns fiercely; the sword of faith never ceases until all heretics are utterly destroyed."
trait_embattle_holy_warrior_character_desc: "The fervor of righteousness burns, [ROOT.GetCharacter.GetFirstNameNoTooltip] will not rest until all heretics are defeated. \n\n#weak [embattle|E]: Vice Commander and [embattle_tactic|E]#!"
trait_track_embattle_holy_warrior: "Fanatic"
trait_track_embattle_holy_warrior_desc: "#help You can gain experience on this path by fighting enemies of other faiths. #!\n\nRefine your heart through faith; there is no invincible enemy and no battle that should make you retreat."

trait_embattle_open_terrain_expert: "Open Terrain Expert"
trait_embattle_open_terrain_expert_1: "Field Watcher"
trait_embattle_open_terrain_expert_2: "Field Marshal"
trait_embattle_open_terrain_expert_3: "Lord of Pingyuan"
trait_embattle_open_terrain_expert_desc: "Upon reaching open terrain and expansive spaces, this character feels as though returning home and will swiftly capitalize on these advantages in battle."
trait_embattle_open_terrain_expert_character_desc: "Upon reaching open terrain and vast spaces, [ROOT.GetCharacter.GetFirstNameNoTooltip] feels like coming home and will quickly utilize this advantage in battle. \n\n#weak [embattle|E]: The Vice Commander and [embattle_tactic|E]#!"
trait_track_embattle_open_terrain_expert: "Open Terrain Expert"
trait_track_embattle_open_terrain_expert_desc: "#help You can gain experience on this route by fighting on plains, farmland, or grassland terrain. #!\n\nOpen ground provides us with unlimited opportunities for maneuver and victory."

trait_embattle_rough_terrain_expert: "Expert in Rough Terrain"
trait_embattle_rough_terrain_expert_1: "Pathfinder Pioneer"
trait_embattle_rough_terrain_expert_2: "Highland Tactician"
trait_embattle_rough_terrain_expert_3: "Lord of the Peaks"
trait_embattle_rough_terrain_expert_desc: "For those who can leverage difficult terrain to gain the upper hand in battle, such terrain becomes a powerful tool."
trait_embattle_rough_terrain_expert_character_desc: "For those who can leverage difficult terrain and gain the upper hand in battle, such terrain becomes a powerful tool. \n\n#weak [embattle|E]: Vice Commander and [embattle_tactic|E]#!"
trait_track_embattle_rough_terrain_expert: "Expert in Rough Terrain"
trait_track_embattle_rough_terrain_expert_desc: "#help You can gain experience on this route by fighting in hilly, mountainous, or wetland terrain. #!\n\nIn the most arduous environments, victory belongs to those who face challenges head-on."

trait_embattle_forest_fighter: "Forest Warrior"
trait_embattle_forest_fighter_1: "Huntsman in the Woods"
trait_embattle_forest_fighter_2: "Forest Watcher"
trait_embattle_forest_fighter_3: "Lord of the Forest"
trait_embattle_forest_fighter_desc: "Some see forests as obstacles; this character sees them as opportunities."
trait_embattle_forest_fighter_character_desc: "Some see the forest as an obstacle, [ROOT.GetCharacter.GetFirstNameNoTooltip] others see it as an opportunity. \n\n#weak [embattle|E]: Vice Commander and [embattle_tactic|E]#!"
trait_track_embattle_forest_fighter: "Forest Warfare Specialist"
trait_track_embattle_forest_fighter_desc: "#help You can gain experience on this route by fighting in forest or coniferous terrain. #!\n\nIn the woods, every shadow of a tree is a shield, and every branch is an ally."

trait_embattle_cautious_leader: "Cautious General"
trait_embattle_cautious_leader_1: "Patient Planner"
trait_embattle_cautious_leader_2: "Alert Commander"
trait_embattle_cautious_leader_3: "The Prudent Master"
trait_embattle_cautious_leader_desc: "Cautious generals will carefully avoid unnecessary risks in battle, but may thereby lose potential gains."
trait_embattle_cautious_leader_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] will carefully avoid unnecessary risks in battle, but may thereby lose potential gains. \n\n#weak [embattle|E]: Vice Commander and [embattle_tactic|E]#!"
trait_track_embattle_cautious_leader: "Cautious Commander"
trait_track_embattle_cautious_leader_desc: "#help You can gain experience on this route by engaging in battles with larger armies. #!\n\nPatience and rigor ensure that every step remains within the plan, minimizing losses to the lowest possible level."

trait_embattle_organizer: "Organizer"
trait_embattle_organizer_1: "Tactician"
trait_embattle_organizer_2: "Rapid March Planner"
trait_embattle_organizer_3: "Master of Mobile Warfare"
trait_embattle_organizer_desc: "In the hands of capable leaders, a well-organized army can swiftly defeat enemies under any circumstances."
trait_embattle_organizer_character_desc: "In capable hands, a well-organized army can swiftly defeat the enemy under any circumstances. \n\n#weak [embattle|E]: Vice Commander and [embattle_tactic|E]#!"
trait_track_embattle_organizer: "Marcher"
trait_track_embattle_organizer_desc: "#help You can gain experience along the route by leading your army to move across the map. #!\n\nA well-coordinated unit moves swiftly, allowing it to strike its enemies with precision."

trait_embattle_winter_soldier: "General Winter"
trait_embattle_winter_soldier_1: "Frost and Snow Watcher"
trait_embattle_winter_soldier_2: "Veteran of the Snowy Plains"
trait_embattle_winter_soldier_3: "Lord of the Frost"
trait_embattle_winter_soldier_desc: "This character has been tempered by the harsh winter and knows how to turn it to their advantage."
trait_embattle_winter_soldier_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] tempered by the harsh winter, knowing how to turn it into an advantage for [ROOT.GetCharacter.GetHerHis]. \n\n#weak [embattle|E]: Vice Commander and [embattle_tactic|E]#!"
trait_track_embattle_winter_soldier: "Winter Warfare Specialist"
trait_track_embattle_winter_soldier_desc: "#help You can gain experience on this route by fighting in provinces affected by winter. #!\n\nThe bitter cold is not an enemy—it is an ally for those who are resilient."

#Commander Traits (cultural traditions)
trait_embattle_sea_raider: "Sea Raider"
trait_embattle_sea_raider_desc: "Sea raiders fear not the treacherous waves of the ocean, employing bold and exceptional navigational skills to launch surprise attacks on unprotected coastlines without warning."
trait_embattle_sea_raider_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip]Fearless of the terrifying waves in the sea, employing bold and outstanding navigational skills to launch surprise attacks on unprotected coastlines without warning. \n\n#weak [embattle|E]: Vice Commander and [embattle_tactic|E]#!"

