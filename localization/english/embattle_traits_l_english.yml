# ACOTW Compatch
trait_acotw_obscured:0 "Obscured"
trait_acotw_obscured_desc:0 "This character lies beyond [diplomatic_range|E], making the details of their life difficult to verify."
trait_acotw_obscured_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] lies beyond [diplomatic_range|E], making the details of [ROOT.GetCharacter.GetHerHis] deeds difficult to verify."

#Commander Traits
trait_embattle_logistician: "Logistician"
trait_embattle_logistician_1: "Skilled Quartermaster"
trait_embattle_logistician_2: "Chief Quartermaster"
trait_embattle_logistician_3: "Master Logistician"
trait_embattle_logistician_desc: "If a logistician knows one thing, it is how to make supplies last — the longer, the better."
trait_embattle_logistician_character_desc: "If [ROOT.GetCharacter.GetFirstNameNoTooltip] knows one thing, it is how to make supplies last — the longer, the better."
trait_track_embattle_logistician: "Logistics"
trait_track_embattle_logistician_desc: "#help Gain experience on this track by leading an army across the map.#!\n\nControl the supplies and you control the war; your army will not falter when it matters most."

trait_embattle_military_engineer: "Military Engineer"
trait_embattle_military_engineer_1: "Skilled Siege Engineer"
trait_embattle_military_engineer_2: "Master of Sieges"
trait_embattle_military_engineer_3: "Breaker of Cities"
trait_embattle_military_engineer_desc: "With extensive knowledge of siege engines and fortifications, a military engineer will not be stopped by walls."
trait_embattle_military_engineer_character_desc: "With extensive knowledge of siege engines and fortifications, [ROOT.GetCharacter.GetFirstNameNoTooltip] will not be stopped by walls.\n\n#weak [embattle|E]: Granted by a deputy commander#!"
trait_track_embattle_military_engineer: "Siegecraft"
trait_track_embattle_military_engineer_desc: "#help Gain experience on this track by successfully completing sieges.#!\n\nIn war, every fortified barrier is a challenge an army must overcome."

trait_embattle_aggressive_attacker: "Aggressive Attacker"
trait_embattle_aggressive_attacker_1: "Bold Vanguard"
trait_embattle_aggressive_attacker_2: "Fearless Spearhead"
trait_embattle_aggressive_attacker_3: "Renowned Linebreaker"
trait_embattle_aggressive_attacker_desc: "Nothing satisfies an aggressive attacker but the blood of the enemy."
trait_embattle_aggressive_attacker_character_desc: "Nothing satisfies [ROOT.GetCharacter.GetFirstNameNoTooltip] but the blood of [ROOT.GetCharacter.GetHerHis] enemies.\n\n#weak [embattle|E]: Granted by a deputy commander#!"
trait_track_embattle_aggressive_attacker: "Offensive Warfare"
trait_track_embattle_aggressive_attacker_desc: "#help Gain experience on this track by attacking the enemy.#!\n\nA swift, forceful attack is the best defense."

trait_embattle_unyielding_defender: "Defender"
trait_embattle_unyielding_defender_1: "Resolute Guardian"
trait_embattle_unyielding_defender_2: "Unyielding Defender"
trait_embattle_unyielding_defender_3: "Undying Sentinel"
trait_embattle_unyielding_defender_desc: "A defender knows one golden rule: the enemy advances no farther."
trait_embattle_unyielding_defender_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] knows one golden rule: the enemy advances no farther.\n\n#weak [embattle|E]: Granted by a deputy commander#!"
trait_track_embattle_unyielding_defender: "Defensive Warfare"
trait_track_embattle_unyielding_defender_desc: "#help Gain experience on this track by defending in battle.#!\n\nA fortress is only as strong as the will of its defenders."

trait_embattle_forder: "Forder"
trait_embattle_forder_1: "River Crosser"
trait_embattle_forder_2: "Master of Fords"
trait_embattle_forder_3: "Wavebreaker"
trait_embattle_forder_desc: "This character is at home near water and suffers no Advantage penalty for crossing rivers or straits in war."
trait_embattle_forder_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] is at home near water and suffers no Advantage penalty for crossing rivers or straits in war.\n\n#weak [embattle|E]: Granted by a deputy commander#!"
trait_track_embattle_forder: "River Warfare"
trait_track_embattle_forder_desc: "#help Gain experience on this track by fighting in coastal provinces or on either bank of a river.#!\n\nWhere others see rushing rivers and ravines, these warriors see a clear road to victory."

trait_embattle_flexible_leader: "Flexible Leader"
trait_embattle_flexible_leader_1: "Quick-Witted Commander"
trait_embattle_flexible_leader_2: "Battlefield All-Rounder"
trait_embattle_flexible_leader_3: "Master of Maneuver"
trait_embattle_flexible_leader_desc: "This character knows how to reduce the Advantage defenders gain from fortifications, terrain, rivers, and straits."
trait_embattle_flexible_leader_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] knows how to reduce the Advantage defenders gain from fortifications, terrain, rivers, and straits.\n\n#weak [embattle|E]: Granted by a deputy commander#!"
trait_track_embattle_flexible_leader: "Adaptability"
trait_track_embattle_flexible_leader_desc: "#help Gain experience on this track by fighting enemy armies.#!\n\nOn any battlefield, adaptation is the key to survival."

trait_embattle_desert_warrior: "Desert Warrior"
trait_embattle_desert_warrior_1: "Dune Warrior"
trait_embattle_desert_warrior_2: "Walker of the Sands"
trait_embattle_desert_warrior_3: "Scourge of the Sands"
trait_embattle_desert_warrior_desc: "The desert's blazing sun and fierce heat are no enemies to this character."
trait_embattle_desert_warrior_character_desc: "The desert's blazing sun and fierce heat are no enemies to [ROOT.GetCharacter.GetFirstNameNoTooltip].\n\n#weak [embattle|E]: Granted by a deputy commander#!"
trait_track_embattle_desert_warrior: "Desert Warfare"
trait_track_embattle_desert_warrior_desc: "#help Gain experience on this track by fighting in desert, desert mountains, oases, or drylands.#!\n\nAcross the vast, harsh desert, perseverance triumphs over all."

trait_embattle_jungle_stalker: "Jungle Stalker"
trait_embattle_jungle_stalker_1: "Blade Among the Vines"
trait_embattle_jungle_stalker_2: "Canopy Hunter"
trait_embattle_jungle_stalker_3: "Jungle Shadow"
trait_embattle_jungle_stalker_desc: "The dense growth of any jungle is this character's ally."
trait_embattle_jungle_stalker_character_desc: "The dense growth of any jungle is [ROOT.GetCharacter.GetFirstNameNoTooltip]'s ally.\n\n#weak [embattle|E]: Granted by a deputy commander#!"
trait_track_embattle_jungle_stalker: "Jungle Warfare"
trait_track_embattle_jungle_stalker_desc: "#help Gain experience on this track by fighting in jungle terrain.#!\n\nBeneath the sunless canopy, masters of concealment lie ready to strike from the shadows."

trait_embattle_reaver: "Reaver"
trait_embattle_reaver_1: "Plunderer"
trait_embattle_reaver_2: "Pillager"
trait_embattle_reaver_3: "Terror Incarnate"
trait_embattle_reaver_desc: "A reaver craves plunder almost as much as victory. If anything of value remains, the reaver will find it."
trait_embattle_reaver_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] craves plunder almost as much as victory. If anything of value remains, [ROOT.GetCharacter.GetSheHe] will find it.\n\n#weak [embattle|E]: Granted by a deputy commander#!"
trait_track_embattle_reaver: "Reaving"
trait_track_embattle_reaver_desc: "#help Gain experience on this track by successfully raiding settlements.#!\n\nWhere reavers pass, war and conquest reshape everything."

trait_embattle_reckless: "Reckless"
trait_embattle_reckless_1: "Daring Commander"
trait_embattle_reckless_2: "Battlefield Gambler"
trait_embattle_reckless_3: "Wild Heart"
trait_embattle_reckless_desc: "When a reckless commander sees an advantage, they seize it without hesitation."
trait_embattle_reckless_character_desc: "When [ROOT.GetCharacter.GetFirstNameNoTooltip] sees an advantage, [ROOT.GetCharacter.GetSheHe] seizes it without hesitation.\n\n#weak [embattle|E]: Granted by a deputy commander#!"
trait_track_embattle_reckless: "Bold Command"
trait_track_embattle_reckless_desc: "#help Gain experience on this track by fighting larger armies.#!\n\nFortune favors those who risk everything for a great cause."

trait_embattle_holy_warrior: "Sword of Devotion"
trait_embattle_holy_warrior_1: "Blade of the Divine"
trait_embattle_holy_warrior_2: "Holy Warrior"
trait_embattle_holy_warrior_3: "Champion of the Faith"
trait_embattle_holy_warrior_desc: "Burning with righteous zeal, the sword of the faith will not rest until every infidel has fallen."
trait_embattle_holy_warrior_character_desc: "Burning with righteous zeal, [ROOT.GetCharacter.GetFirstNameNoTooltip] will not rest until the infidels are defeated.\n\n#weak [embattle|E]: Granted by a deputy commander#!"
trait_track_embattle_holy_warrior: "Zeal"
trait_track_embattle_holy_warrior_desc: "#help Gain experience on this track by fighting enemies of other faiths.#!\n\nA heart tempered by faith knows no unbeatable enemy and no battle from which to shrink."

trait_embattle_open_terrain_expert: "Open Terrain Expert"
trait_embattle_open_terrain_expert_1: "Watcher of the Fields"
trait_embattle_open_terrain_expert_2: "Strategist of the Open Lands"
trait_embattle_open_terrain_expert_3: "Master of the Plains"
trait_embattle_open_terrain_expert_desc: "This character feels at home in open fields and wide spaces, and quickly turns them to advantage in battle."
trait_embattle_open_terrain_expert_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] feels at home in open fields and wide spaces, and quickly turns them to advantage in battle.\n\n#weak [embattle|E]: Granted by a deputy commander#!"
trait_track_embattle_open_terrain_expert: "Open Terrain Warfare"
trait_track_embattle_open_terrain_expert_desc: "#help Gain experience on this track by fighting on plains, farmland, or steppe terrain.#!\n\nOpen ground offers endless opportunities for maneuver and victory."

trait_embattle_rough_terrain_expert: "Rough Terrain Expert"
trait_embattle_rough_terrain_expert_1: "Pathfinder"
trait_embattle_rough_terrain_expert_2: "Highland Tactician"
trait_embattle_rough_terrain_expert_3: "Master of the Peaks"
trait_embattle_rough_terrain_expert_desc: "Difficult terrain is a powerful tool for those who know how to turn it to their advantage in battle."
trait_embattle_rough_terrain_expert_character_desc: "Difficult terrain is a powerful tool for those who know how to turn it to their advantage in battle.\n\n#weak [embattle|E]: Granted by a deputy commander#!"
trait_track_embattle_rough_terrain_expert: "Rough Terrain Warfare"
trait_track_embattle_rough_terrain_expert_desc: "#help Gain experience on this track by fighting in hills, mountains, or wetlands.#!\n\nIn the harshest conditions, victory belongs to those who meet hardship head-on."

trait_embattle_forest_fighter: "Forest Fighter"
trait_embattle_forest_fighter_1: "Woodland Stalker"
trait_embattle_forest_fighter_2: "Forest Watcher"
trait_embattle_forest_fighter_3: "Master of the Forest"
trait_embattle_forest_fighter_desc: "Some see forests as obstacles. This character sees opportunities."
trait_embattle_forest_fighter_character_desc: "Some see forests as obstacles. [ROOT.GetCharacter.GetFirstNameNoTooltip] sees opportunities.\n\n#weak [embattle|E]: Granted by a deputy commander#!"
trait_track_embattle_forest_fighter: "Forest Warfare"
trait_track_embattle_forest_fighter_desc: "#help Gain experience on this track by fighting in forests or taiga.#!\n\nIn the woods, every shadow is a shield and every branch an ally."

trait_embattle_cautious_leader: "Cautious Leader"
trait_embattle_cautious_leader_1: "Patient Planner"
trait_embattle_cautious_leader_2: "Watchful Commander"
trait_embattle_cautious_leader_3: "Master of Prudence"
trait_embattle_cautious_leader_desc: "A cautious leader avoids needless risks in battle, even at the cost of possible gains."
trait_embattle_cautious_leader_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] avoids needless risks in battle, even at the cost of possible gains.\n\n#weak [embattle|E]: Granted by a deputy commander#!"
trait_track_embattle_cautious_leader: "Cautious Command"
trait_track_embattle_cautious_leader_desc: "#help Gain experience on this track by fighting larger armies.#!\n\nPatience and care keep every step within the plan and losses to a minimum."

trait_embattle_organizer: "Organizer"
trait_embattle_organizer_1: "Tactician"
trait_embattle_organizer_2: "Planner of Forced Marches"
trait_embattle_organizer_3: "Master of Mobile Warfare"
trait_embattle_organizer_desc: "In capable hands, a well-organized army can swiftly defeat its enemy in any circumstances."
trait_embattle_organizer_character_desc: "In capable hands, a well-organized army can swiftly defeat its enemy in any circumstances.\n\n#weak [embattle|E]: Granted by a deputy commander#!"
trait_track_embattle_organizer: "Marching"
trait_track_embattle_organizer_desc: "#help Gain experience on this track by leading an army across the map.#!\n\nA well-coordinated force moves swiftly and strikes its enemies precisely."

trait_embattle_winter_soldier: "Winter Commander"
trait_embattle_winter_soldier_1: "Watcher of Frost and Snow"
trait_embattle_winter_soldier_2: "Veteran of the Snowfields"
trait_embattle_winter_soldier_3: "Master of the Cold"
trait_embattle_winter_soldier_desc: "Forged by harsh winters, this character knows how to turn them to advantage."
trait_embattle_winter_soldier_character_desc: "Forged by harsh winters, [ROOT.GetCharacter.GetFirstNameNoTooltip] knows how to turn them to [ROOT.GetCharacter.GetHerHis] advantage.\n\n#weak [embattle|E]: Granted by a deputy commander#!"
trait_track_embattle_winter_soldier: "Winter Warfare"
trait_track_embattle_winter_soldier_desc: "#help Gain experience on this track by fighting in provinces affected by winter.#!\n\nBitter cold is an ally to those with the endurance to master it."

#Commander Traits (cultural traditions)
trait_embattle_sea_raider: "Sea Raider"
trait_embattle_sea_raider_desc: "Unfazed by towering waves, sea raiders use bold and outstanding seamanship to strike unguarded coasts without warning."
trait_embattle_sea_raider_character_desc: "Unfazed by towering waves, [ROOT.GetCharacter.GetFirstNameNoTooltip] uses bold and outstanding seamanship to strike unguarded coasts without warning.\n\n#weak [embattle|E]: Granted by a deputy commander#!"

