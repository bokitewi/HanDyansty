l_english:
 hd_dc_con_quandi_decision:0 "Land Enclosure"
 hd_dc_con_quandi_decision_desc:0 "Why should the southerners alone enjoy the fertile land of the Han? Choose a province and grant all the Han counties the Son of Heaven holds there to the meritorious men of our people, rewarding those who followed the dragon.\n\nOur vassals will rejoice, but the dispossessed Han will surely cry out in resentment."
 hd_dc_con_quandi_decision_tooltip:0 "Grant a province's Han counties to the meritorious men of our people"
 hd_dc_con_quandi_decision_confirm:0 "Enclose Land for the Meritorious"
 hd_dc_con_quandi_land_tt:0 "Directly holds at least one Han (Chinese heritage) county besides the capital"
 hd_dc_con_quandi_decision_effect_tt:0 "Choose a province and grant all the Han counties you hold directly there (excluding the capital) to one meritorious man of our people. Our warriors will rejoice, while the dispossessed Han will cry out in resentment."
 hd_dc_con_quandi_county_modifier:0 "Resentment of Enclosure"
 hd_dc_con_quandi_county_modifier_desc:0 "Ancestral lands were seized to reward Hu officers, and the Han here are bitterly resentful."
 hd_dc_con_quandi_native_opinion:0 "Rewarded with Enclosed Land"
 hd_dc_con_quandi_grantee_opinion:0 "Granted Enclosed Land"
 hd_dc_con_hybrid_culture_decision:0 "Hu and Han Merge"
 hd_dc_con_hybrid_culture_decision_desc:0 "Long have we ruled the Central Plains, and our old customs have long since blended with Han institutions. Merge our culture with the Han culture of the capital to found a new culture, heir to the Chinese tradition."
 hd_dc_con_hybrid_culture_decision_tooltip:0 "Create a hybrid Hu-Han culture"
 hd_dc_con_hybrid_culture_decision_confirm:0 "Hu and Han Are One"
 hd_dc_con_capital_han_tt:0 "The capital county is of Han (Chinese heritage) culture"
 hd_dc_con_can_hybridize_tt:0 "Can hybridize with the capital's culture (requires culture hybridization to be enabled and the matching game rule)"
 hd_dc_con_hybrid_heritage_tt:0 "The new culture inherits the Chinese tradition; your directly held counties of our people, along with your spouses and children at court, adopt the new customs"
 hd_dc_con_sinicization_decision:0 "Sinicization Reforms"
 hd_dc_con_sinicization_decision_desc:0 "Transform the barbarian by the ways of Huaxia: move the capital, change dress, change surnames, ban the Hu tongue, sweeping away old customs for Han institutions. Once promulgated, the reforms proceed step by step, and each step will stir the discontent of our nobles, even mutiny."
 hd_dc_con_sinicization_decision_tooltip:0 "Promulgate the sinicization reforms"
 hd_dc_con_sinicization_decision_confirm:0 "Decree Sinicization"
 hd_dc_con_sinicization_decision_effect_tt:0 "Moving the capital, changing dress, changing surnames, banning the Hu tongue: four edicts will be issued in turn every two or three years, and each step may be halted. The nobles of our people will grow ever more resentful, #EMP perhaps even rising in revolt#!, while Han vassals will steadily come to support you. Once all four are done, you will adopt the merged Hu-Han customs.\nFor each step taken:"
 hd_dc_con_native_vassals_tt:0 "Every [vassal|E] of our people"
 hd_dc_con_han_vassals_tt:0 "Every Han [vassal|E]"
 hd_dc_con_sinicization_active_tt:0 "The sinicization reforms are not yet underway"
 hd_dc_con_baosu_blocks_tt:0 "Has not decreed 'Preserve Customs'"
 hd_dc_con_sinicization_abandoned_tt:0 "Has not abandoned the sinicization reforms in the last ten years"
 hd_dc_con_native_revolt_risk_tt:0 "The most powerful resentful vassal of our people rises in revolt"
 hd_dc_con_capital_already_han_tt:0 "The capital is already in Han lands; there is no need to move it"
 hd_dc_con_sinicization_native_opinion:0 "Sinicization Reforms"
 hd_dc_con_sinicization_han_opinion:0 "Sinicization Reforms"
 hd_dc_con_yifu_modifier:0 "Change of Dress"
 hd_dc_con_yifu_modifier_desc:0 "The Son of Heaven now wears Han robes and caps, to show the orthodox legitimacy of Huaxia."
 hd_dc_con_baosu_decision:0 "Preserve Customs"
 hd_dc_con_baosu_decision_desc:0 "The foundation of our state is the bow and horse of our people. Hold fast to the ancestral customs and treat our warriors generously; the grumbling of the Han is no cause for concern."
 hd_dc_con_baosu_decision_tooltip:0 "Preserve the old customs of our people"
 hd_dc_con_baosu_decision_confirm:0 "Uphold Ancestral Ways"
 hd_dc_con_baosu_decision_effect_tt:0 "For twenty years, uphold the ancestral ways and set aside talk of sinicization:"
 hd_dc_con_sinicization_blocks_tt:0 "Has not enacted the sinicization reforms"
 hd_dc_con_baosu_active_tt:0 "'Preserve Customs' is not in effect"
 hd_dc_con_baosu_levy_modifier:0 "Preserve Customs"
 hd_dc_con_baosu_levy_modifier_desc:0 "The Son of Heaven upholds ancestral ways and favors our people, and the young men of the clans eagerly enlist."
 hd_dc_con_baosu_han_opinion:0 "Customs Preserved, Han Slighted"
 hd_dc_con_watched_tt:0 "This person will remain under your eyes and ears for years to come, and will find it hard to plot in secret."
 hd_dc_con_remnant_honored_opinion:0 "Honored the Former Dynasty's Kin"
 hd_dc_con_remnant_honored_han_opinion:0 "Honored the Former Dynasty's Loyalists"
 hd_dc_con_remnant_killed_han_opinion:0 "Executed the Former Dynasty's Kin"
 hd_dc_con.0100.t:0 "Land Enclosure"
 hd_dc_con.0100.desc:0 "The generals who followed the dragon press their case again and again: the rich lands of the Central Plains should be divided among the meritorious. As for the Han peasants on them, let the new masters drive them off or put them to work as they please.\n\nWhich province's land shall be enclosed?"
 hd_dc_con.0100.a:0 "Enclose the land of [hd_dc_con_slot_1.GetName]"
 hd_dc_con.0100.b:0 "Enclose the land of [hd_dc_con_slot_2.GetName]"
 hd_dc_con.0100.c:0 "Enclose the land of [hd_dc_con_slot_3.GetName]"
 hd_dc_con.0100.d:0 "Enclose the land of [hd_dc_con_slot_4.GetName]"
 hd_dc_con.0100.e:0 "Let it rest for now"
 hd_dc_con.0201.t:0 "Sinicization: Moving the Capital"
 hd_dc_con.0201.desc:0 "The old capital lies in a remote corner with rough customs, no place from which to rule All Under Heaven. The court proposes moving the capital to the Han heartland, closer to the people of the Central Plains. The nobles of our people cling to their homeland, and tempers run high."
 hd_dc_con.0201.a:0 "The move is unavoidable"
 hd_dc_con.0201.b:0 "The will of the many cannot be defied; abandon the reforms"
 hd_dc_con.0202.t:0 "Sinicization: Change of Dress"
 hd_dc_con.0202.desc:0 "With the new capital established, an edict orders court and country to adopt Han robes and caps and forbids Hu dress. The old ministers stroke their robes of former days in silence."
 hd_dc_con.0202.a:0 "With dress changed, hearts are renewed"
 hd_dc_con.0202.b:0 "Revoke the dress edict and abandon the reforms"
 hd_dc_con.0203.t:0 "Sinicization: Change of Surnames"
 hd_dc_con.0203.desc:0 "Many of the compound surnames of the imperial clan and nobility derive from old tribal names. An edict changes them to Han surnames and fixes their lineage ranks, placing them on a par with the gentry clans of the Central Plains."
 hd_dc_con.0203.a:0 "Grant Han surnames and fix their lineage ranks"
 hd_dc_con.0203.b:0 "Ancestral names cannot be changed; abandon the reforms"
 hd_dc_con.0204.t:0 "Sinicization: Banning the Hu Tongue"
 hd_dc_con.0204.desc:0 "The last edict: none at court may speak the tongue of our people any longer, on pain of demotion and dismissal. With this edict, the reforms will be complete."
 hd_dc_con.0204.a:0 "Cut off the northern tongue; follow the proper speech alone"
 hd_dc_con.0204.b:0 "This order goes too far; abandon the reforms"
 hd_dc_con.0300.t:0 "Loyalists of the Former Dynasty"
 hd_dc_con.0300.desc:0 "[hd_dc_con_remnant.GetShortUIName], of the former dynasty's imperial clan, still lives. The loyalists of the old state cannot forget them, and the court is abuzz: some urge generous treatment to win Han hearts, some urge close watch, and some murmur that weeds must be pulled up by the roots."
 hd_dc_con.0300.desc.landed:0 "\n\nThis person still holds lands, and must be guarded against."
 hd_dc_con.0300.desc.landless:0 "\n\nThis person now wanders without support, a fine chance to show magnanimity through generous treatment."
 hd_dc_con.0300.a:0 "Honor the former dynasty's kin"
 hd_dc_con.0300.b:0 "Keep them under close watch"
 hd_dc_con.0300.c:0 "Root, Stem, and Branch"
