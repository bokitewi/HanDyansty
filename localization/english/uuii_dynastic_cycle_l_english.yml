l_english:
 uuii_claim_mandate_blocked_by_legitimate_hegemon_tt: "As long as the legitimate Son of Heaven remains on the throne, one cannot proclaim or seize the Mandate of Heaven."
 uuii_dynastic_cycle.0001.t: "A new landscape of warlords carving up the realm"
 uuii_dynastic_cycle.0001.desc.high_authority_4: "The legitimacy of the Son of Heaven reaches its zenith, and hegemony is sustained. The fourth-tier imperial authority ensures that vassals within the capital's legal empire remain subordinate, while other direct vassals become independent; among them, former supporters of the Emperor who sought to uphold his authority transition into tributary states of the Celestial Court. No one can proclaim or seize the Mandate of Heaven at this time."
 uuii_dynastic_cycle.0001.desc.high_authority_3: "The legitimacy of the Son of Heaven reaches its zenith, and hegemony is sustained. The three-tiered hierarchy of sovereignty ensures that vassals within the capital's legal kingdom remain subordinate, while other direct vassals become independent; among them, former supporters of the Emperor who sought to uphold his authority transition into tributary states of the Celestial Court. No one can proclaim or seize the Mandate of Heaven at this time."
 uuii_dynastic_cycle.0001.desc.high_authority_2: "The legitimacy of the Son of Heaven reaches its zenith, and hegemony is sustained. The secondary sovereignty ensures that vassals within the capital's legal dominion remain subordinate, while other direct vassals become independent; among them, former supporters of the Emperor who sought to uphold his authority transition into tributary states of the Celestial Court. No one can proclaim or seize the Mandate of Heaven at this time."
 uuii_dynastic_cycle.0001.desc.high_authority_1: "The legitimate authority of the Son of Heaven reaches its zenith, and hegemony is sustained. However, a single level of imperial power cannot maintain the feudal lords; all direct vassals declare independence. Among them, those formerly aligned with the King of Kings become tributary states to the Celestial Court. No one can proclaim or seize the Mandate of Heaven at this time."
 uuii_dynastic_cycle.0001.desc.low_authority_4: "The legitimacy of the Son of Heaven is insufficient, and the title of hegemony follows the collapse of the dynasty; however, the Son of Heaven is not forced to abdicate and retains direct and ordinary titles. The fourth-tier sovereign power ensures that vassals within the capital's legal empire continue to submit, while other direct vassals become independent, reopening the realm to competition for the Mandate of Heaven."
 uuii_dynastic_cycle.0001.desc.low_authority_3: "The legitimacy of the Son of Heaven is insufficient, and the title of hegemony follows the collapse of the dynasty; however, the Son of Heaven is not forced to abdicate and retains direct and ordinary titles. The three-tiered sovereignty ensures that vassals within the capital's legal kingdom continue to submit, while other direct vassals become independent, reopening the realm to competition for the Mandate of Heaven."
 uuii_dynastic_cycle.0001.desc.low_authority_2: "The legitimacy of the Son of Heaven is insufficient, and the title of hegemony follows the collapse of the dynasty; however, the Son of Heaven is not forced to abdicate and retains both direct and ordinary titles. Secondary sovereign authority ensures that vassals within the capital's legal public domain continue to submit, while other direct vassals become independent, reopening the realm to competition for the Mandate of Heaven."
 uuii_dynastic_cycle.0001.desc.low_authority_1: "The legitimacy of the Son of Heaven is insufficient; the title of Hegemon follows the collapse of the dynasty, yet the Son of Heaven is not forced to abdicate and retains direct and ordinary titles. Under Level 1 Sovereign Power, all direct vassals declare independence, and the mandate of heaven once again opens for competition across the realm."
 uuii_dynastic_cycle.0001.a: "The grand trend of the world has thus changed."
