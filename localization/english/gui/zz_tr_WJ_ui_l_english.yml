 WJ_mt_zhongwai_help:0 "When the post of Commander of All Forces Inside and Outside is vacant, the Son of Heaven personally holds the power to move troops throughout the realm; regional Area Commanders may still direct their own areas, and all others may only view.\n\nTo command all forces inside and outside, you must be the Son of Heaven's regent, and at least three of the four seats of Palace Attendant, Grand General, Prefect of the Secretariat and Grand Marshal must be held by you, your protégés, your household officials or your kinsmen (one person holding several counts per seat). The dynasty has only one such commander.\n\nReceive the edict through the decision 'Request the Edict to Command All Forces', along with the Yellow Axe; the four seats are checked only at appointment, and once you lose the regency both are revoked together."
 WJ_zw_takeover_notice:0 "#warning Taken over by the Commander of All Forces Inside and Outside#!\nYou may view command areas; creation, dissolution, boundaries, tallies, renaming and dispatch are handled by the current Commander. Original permissions return once he loses the post."
