 WJ_mufu_history_detail:0 "#high Opening an Office and Appointing Staff#!\nOpening an office meant more than setting up another bureau; it concerned the standing of a patron to appoint his own staff and divide government business among sections. In the Han, the offices of the Three Excellencies had a Chief Clerk and various section clerks; generals' headquarters likewise had a Chief Clerk, a Major and other officers who divided the office's business and military affairs.\n\nEach section of an office had its own duties: some handled recommendations for office, others memorials, documents and registers. Their duties and numbers varied with the office and the era, and should not be taken as a single fixed system unchanged through the dynasties.\n\nFrom the late Han onward, summons to service also became an important way to recruit scholars. Staff took part in deliberation, planning and administration at the patron's side, and between patron and former subordinates there often endured a bond of recognition and repayment.\n\nSource: Book of the Later Han, Treatise on the Hundred Offices, part one."
 WJ_mufu_history_intro:0 "#high Open Offices and Military Headquarters#!\nIn the Han, the offices of the Excellencies and generals had staff who handled business by section. The Chief Clerk oversaw the office's affairs, the Major assisted with military matters, and clerks helped with documents, recommendations and the like. In the troubled late Han, patrons summoned scholars to service, and headquarters became places for deliberation, counsel and the recruitment of talent. Between patron and staff there thus formed ties of appointment and grateful repayment."
