l_english:
 hd_dc_rec_light_taxes_decision:0 "Light Taxes and Corvee"
 hd_dc_rec_light_taxes_decision_desc:0 "After the turmoil, households are depleted and fields lie barren. Follow the example of the reigns of Emperors Wen and Jing: lighten punishments, reduce taxes, and let the people rest, so the realm may recover its vitality."
 hd_dc_rec_light_taxes_decision_tooltip:0 "Decree a reduction of taxes throughout the realm and let the people rest."
 hd_dc_rec_light_taxes_decision_confirm:0 "Decree Lower Taxes"
 hd_dc_rec_light_taxes_active_tt:0 "The edict of light taxes and corvee is in effect"
 hd_dc_rec_light_taxes_county_tt:0 "Every [county|E] in the Son of Heaven's domain"
 hd_dc_rec_cancel_light_taxes_decision:0 "End Light Taxes and Corvee"
 hd_dc_rec_cancel_light_taxes_decision_desc:0 "State funds are short and the treasury is empty. Revoke the tax reduction edict early and restore the old rates — yet the people will surely see the court as faithless, and call it tyranny."
 hd_dc_rec_cancel_light_taxes_decision_tooltip:0 "Revoke the tax reduction edict early and restore the old rates."
 hd_dc_rec_cancel_light_taxes_decision_confirm:0 "Restore the Old Rates"
 hd_dc_rec_cancel_light_taxes_county_tt:0 "Every [county|E] still under reduced taxes"
 hd_dc_rec_light_taxes_modifier:0 "Light Taxes and Corvee"
 hd_dc_rec_light_taxes_modifier_desc:0 "The court has reduced taxes throughout the realm and lets the people rest."
 hd_dc_rec_light_taxes_county_modifier:0 "Light Taxes and Corvee"
 hd_dc_rec_light_taxes_county_modifier_desc:0 "The court has reduced taxes, and the people can rest and recover."
 hd_dc_rec_resettle_refugees_decision:0 "Resettle Refugees"
 hd_dc_rec_resettle_refugees_decision_desc:0 "After the ravages of war, refugees clog the roads. Choose a province where the government grants land and seed and lends oxen, drawing the displaced back home to their livelihoods and turning wasteland into fine farmland once more."
 hd_dc_rec_resettle_refugees_decision_tooltip:0 "Choose a province and draw the displaced back home to their livelihoods."
 hd_dc_rec_resettle_refugees_decision_confirm:0 "Draw Back the Displaced"
 hd_dc_rec_resettle_refugees_pick_tt:0 "Must choose a province with at least one county in the Son of Heaven's domain"
 hd_dc_rec_resettle_refugees_county_tt:0 "Every [county|E] of the Son of Heaven's domain in that province"
 hd_dc_rec_resettle_refugees_county_modifier:0 "Refugees Resettled"
 hd_dc_rec_resettle_refugees_county_modifier_desc:0 "Refugees return to their work, barren fields are reclaimed, and the population grows."
 hd_dc_rec_grand_amnesty_decision:0 "Grand Amnesty"
 hd_dc_rec_grand_amnesty_decision_desc:0 "In this time of restoration, let the realm make a fresh start. Issue an edict of grand amnesty pardoning the imprisoned, to display the Son of Heaven's benevolence and win back the people's hearts."
 hd_dc_rec_grand_amnesty_decision_tooltip:0 "Pardon prisoners and win hearts through clemency."
 hd_dc_rec_grand_amnesty_decision_confirm:0 "Issue the Amnesty Edict"
 hd_dc_rec_grand_amnesty_no_prisoner_tt:0 "The Son of Heaven or their vassals hold at least one prisoner"
 hd_dc_rec_grand_amnesty_decision_effect_tt:0 "The court debates the scope of the amnesty: pardon only the court's prisoners, or extend clemency to those held by the lords and kingdoms as well."
 hd_dc_rec.0001.t:0 "Grand Amnesty"
 hd_dc_rec.0001.desc:0 "The edict is drafted and awaits only the seal. The Director of the Secretariat memorializes: 'Shall the grace of amnesty reach only the court's prisoners, or extend to those held by the lords and kingdoms as well? A universal amnesty would spread grace more widely, but I fear the lords may think the court oversteps its bounds and grow resentful.'"
 hd_dc_rec.0001.a:0 "Pardon only the court's prisoners"
 hd_dc_rec.0001.b:0 "A universal amnesty; release the lords' prisoners too"
 hd_dc_rec.0001.c:0 "The prisons are already empty; withdraw the order"
 hd_dc_rec_amnesty_opinion:0 "Grand Amnesty"
 hd_dc_rec_prisoners_released_opinion:0 "Forcibly Released My Prisoners"
 hd_dc_rec_seek_talent_decision:0 "Edict Seeking Talent"
 hd_dc_rec_seek_talent_decision_desc:0 "A state's restoration begins with finding the right men. Order the provinces and commanderies to recommend the Worthy and Upright, those Versed in the Classics and the Flourishing Talents; anyone with a skill may come to the palace gate to recommend themselves."
 hd_dc_rec_seek_talent_decision_tooltip:0 "Issue an edict seeking talent, drawing gifted men from all quarters to court."
 hd_dc_rec_seek_talent_decision_confirm:0 "Decree the Recommendation of the Worthy"
 hd_dc_rec_seek_talent_decision_effect_tt:0 "Men from all quarters answer the edict; #EMP one to three#! may come to court, each with outstanding talents."
 hd_dc_rec.0002.t:0 "Worthies from All Quarters"
 hd_dc_rec.0002.desc_1:0 "Only a few months after the edict seeking talent reaches the provinces and commanderies, a gifted man answers the call, coming to the palace gate to submit a letter setting out his learning."
 hd_dc_rec.0002.desc_2:0 "Only a few months after the edict seeking talent reaches the provinces and commanderies, two gifted men travel to the capital together, coming to the palace gate to submit letters setting out their strengths."
 hd_dc_rec.0002.desc_3:0 "Only a few months after the edict seeking talent reaches the provinces and commanderies, men from all quarters hear of it and come; three arrive at the palace gate on the same day, a gathering of talent."
 hd_dc_rec.0002.a:0 "The state gains good men; fortune smiles on the dynasty"
 hd_dc_rec_talent_summoned_opinion:0 "Answered the Summons"
