l_english:
 HJ_BattlePoIHistoricalNameChangShao:0 "Battle of Changshao"
 HJ_BattlePoIHistoricalDescChangShao:0 "#emp Victor: Lu\nDefeated: Qi\nDate: 10th year of Duke Zhuang of Lu#!\n#weak The Lu army held its ground, avoiding the Qi army's initial fury. Only when the Qi drums had sounded three times and their spirit was spent did Lu beat its own drums and counterattack, the few defeating the many.\n\n#italic 'Battle is a matter of courage. At the first drum, courage rises; at the second, it wanes; at the third, it is exhausted.'#! - Zuo Commentary on the Spring and Autumn Annals#!"
 HJ_BattlePoIHistoricalNameChengPu:0 "Battle of Chengpu"
 HJ_BattlePoIHistoricalDescChengPu:0 "#emp Victor: Jin\nDefeated: Chu\nDate: 28th year of Duke Xi of Lu#!\n#weak Duke Wen of Jin, mindful of the promise he made the King of Chu during his exile, withdrew three days' march when the armies met, drawing the Chu army deep. Then Jin marshaled its forces and struck both Chu flanks, crushing the Chu army; from this, Jin became hegemon of the Central Plains.\n\n#italic 'Ten great war chariots lead the way forward.'#! - Classic of Poetry, Lesser Odes, Sixth Month#!"
 HJ_BattlePoIHistoricalNameYanLing:0 "Battle of Yanling"
 HJ_BattlePoIHistoricalDescYanLing:0 "#emp Victor: Jin\nDefeated: Chu\nDate: 16th year of Duke Cheng of Lu#!\n#weak Jin and Chu contended for hegemony once more. Seeing that the Chu center was weak, Jin concentrated its forces and struck; King Gong of Chu was shot in the eye by an arrow, and the Chu army fled in the night.\n\n#italic 'Valiant are the warriors, shield and wall of the lords.'#! - Classic of Poetry, Odes of Zhou and the South, Rabbit Nets#!"
 HJ_BattlePoIHistoricalNameGuiLing:0 "Battle of Guiling"
 HJ_BattlePoIHistoricalDescGuiLing:0 "#emp Victor: Qi\nDefeated: Wei\nDate: 17th-18th years of King Hui of Wei#!\n#weak Wei besieged Handan, the capital of Zhao. Rather than relieve Handan head-on, Sun Bin marched straight for the Wei capital of Daliang; when the Wei army turned back to save itself, Qi intercepted it at Guiling and crushed it. The world called it 'Besieging Wei to Save Zhao.'\n\n#italic 'They drive their four stallions, the four stallions strong. On them the lords rely; behind them the soldiers shelter.'#! - Classic of Poetry, Lesser Odes, Gathering Ferns#!"
 HJ_BattlePoIHistoricalNameYiQue:0 "Battle of Yique"
 HJ_BattlePoIHistoricalDescYiQue:0 "#emp Victor: Qin\nDefeated: The armies of Han and Wei\nDate: 14th year of King Zhao of Qin#!\n#weak Bai Qi avoided strength and struck at weakness, first smashing the weaker Han army, then wheeling to catch the Wei army in a pincer. The allied army of Han and Wei collapsed, and 240,000 were beheaded.\n\n#italic 'Grasping Wu halberds and clad in rhino hide, chariot hubs clash as short blades meet.'#! - Qu Yuan, Nine Songs, Hymn to the Fallen#!"
 HJ_BattlePoIHistoricalNameChangPing:0 "Battle of Changping"
 HJ_BattlePoIHistoricalDescChangPing:0 "#emp Victor: Qin\nDefeated: Zhao\nDate: 47th year of King Zhao of Qin#!\n#weak Qin and Zhao were locked in stalemate for three years. The Qin army feigned defeat to lure the enemy out, cut the Zhao supply lines, and encircled the Zhao army at Changping. After forty-six days without food, the Zhao soldiers surrendered to Qin, and more than 400,000 were buried alive.\n\n#italic 'We fought south of the walls and died north of the ramparts; dead in the wilds, unburied, food for crows.'#! - Han Yuefu, Fighting South of the Walls#!"
 HJ_BattlePoIHistoricalNameZui:0 "Battle of Zui"
 HJ_BattlePoIHistoricalDescZui:0 "#emp Victor: Qin\nDefeated: The armies of five states: Zhao, Chu, Wei, Yan, and Han\nDate: 6th year of King Zheng of Qin#!\n#weak The five states formed an alliance to attack Qin, and their great host pressed as deep as Zui. But the lords each harbored their own designs and could not advance or retreat as one, so they withdrew. Thereafter the lords east of the mountains never again had the strength to unite against Qin.\n\n#italic 'The drums boom and thunder; eagerly we take up arms.'#! - Classic of Poetry, Airs of Bei, Beating the Drum#!"
 HJ_BattlePoIHistoricalNameJuLu:0 "Battle of Julu"
 HJ_BattlePoIHistoricalDescJuLu:0 "#emp Victor: The Chu army and the armies of the lords\nDefeated: Qin\nDate: 3rd year of the Second Emperor of Qin#!\n#weak Xiang Yu led his troops across the river, sank the boats, smashed the cooking pots, burned the huts, and carried only three days' rations to show they would fight to the death. In nine battles against Qin he lifted the siege of Julu, and when the generals of the lords entered his camp gate to see him, every one advanced on his knees, none daring to look up.\n\n#italic 'Truly brave and martial, firm and strong to the end, they cannot be humbled.'#! - Qu Yuan, Nine Songs, Hymn to the Fallen#!"
 HJ_BattlePoIHistoricalNamePengCheng:0 "Battle of Pengcheng"
 HJ_BattlePoIHistoricalDescPengCheng:0 "#emp Victor: Western Chu\nDefeated: The King of Han and the armies of the lords\nDate: 2nd year of Han#!\n#weak While Xiang Yu was attacking Qi in the north, the King of Han led the lords' troops into Pengcheng and held lavish banquets day after day. Xiang Yu personally led 30,000 elite cavalry racing back, struck at dawn, and the Han army collapsed. More than a hundred thousand died, and the Sui River was choked and ceased to flow.\n\n#italic 'My strength could uproot mountains, my spirit overshadowed the world.'#! - Xiang Yu, Song of Gaixia#!"
 HJ_BattlePoIHistoricalNameJingXing:0 "Battle of Jingxing"
 HJ_BattlePoIHistoricalDescJingXing:0 "#emp Victor: Han\nDefeated: Zhao\nDate: 3rd year of Han#!\n#weak Han Xin drew up his army with its back to the river, leaving the soldiers no retreat so that every man fought to the death. He had also sent light cavalry ahead to slip into the Zhao camp, tear down the Zhao banners, and raise the red standards of Han. The Zhao army fell into chaos, and the Han army struck from front and rear, crushing the Zhao.\n\n#italic 'They went forth and did not return; the plains are vast, the road far and long.'#! - Qu Yuan, Nine Songs, Hymn to the Fallen#!"
 HJ_BattlePoIHistoricalNameGaiXia:0 "Battle of Gaixia"
 HJ_BattlePoIHistoricalDescGaiXia:0 "#emp Victor: The King of Han and the armies of the lords\nDefeated: Western Chu\nDate: 5th year of Han#!\n#weak The Han army surrounded the Chu army ring upon ring. At night, Chu songs rose on all four sides, and the Chu army lost heart. Xiang Yu broke out and fled south, cutting his own throat at the Wu River, and the contest between Chu and Han was over.\n\n#italic 'The times are against me, and my steed Zhui will not go on; if Zhui will not go on, what can I do!'#! - Xiang Yu, Song of Gaixia#!"
 HJ_BattlePoIHistoricalNameBaiDeng:0 "Siege of Baideng"
 HJ_BattlePoIHistoricalDescBaiDeng:0 "#emp Advantage: Xiongnu\nBesieged: Han\nDate: 7th year of Emperor Gao#!\n#weak Emperor Gao pursued the Xiongnu with a light force and was surrounded for seven days on Mount Baideng by the elite cavalry of Modu Chanyu. Only through Chen Ping's stratagem did he escape. Thereafter the Han made marriage alliances with the Xiongnu to secure the northern frontier.\n\n#italic 'Below Pingcheng it was bitter indeed: seven days without food, too weak to draw a crossbow.'#! - Folk song of the early Han#!"
 HJ_BattlePoIHistoricalNameHeXi:0 "Battle of Hexi"
 HJ_BattlePoIHistoricalDescHeXi:0 "#emp Victor: Han\nDefeated: The Xiongnu tribes of the Hunye and Xiutu Kings\nDate: 2nd year of Yuanshou, under Emperor Wu#!\n#weak General of Agile Cavalry Huo Qubing struck into Hexi twice in a single year, crossing Mount Yanzhi and driving deep into the Qilian Mountains to crush the Hunye and Xiutu tribes of the Xiongnu. The Hunye King led his people to surrender to Han, and the court established commanderies and counties in Hexi.\n\n#italic 'The Xiongnu are not yet destroyed; what use have I for a home?'#! - Words of Huo Qubing, General of Agile Cavalry#!"
 HJ_BattlePoIHistoricalNamePanYu:0 "Battle of Panyu"
 HJ_BattlePoIHistoricalDescPanYu:0 "#emp Victor: Han\nDefeated: Nanyue\nDate: 6th year of Yuanding, under Emperor Wu#!\n#weak Wave-Calming General Lu Bode and Tower Ship General Yang Pu marched south by separate routes and converged to besiege Panyu. The Nanyue capital fell, and from then on all of Lingnan became Han commanderies and counties.\n\n#italic 'In the south stand tall trees, yet none may rest beneath them; on the Han wander maidens, yet none may be won.'#! - Classic of Poetry, Odes of Zhou and the South, The Broad Han#!"
 HJ_BattlePoIHistoricalNameWangXian:0 "Battle of Wangxian"
 HJ_BattlePoIHistoricalDescWangXian:0 "#emp Victor: Han\nDefeated: Ugeo, King of Joseon\nDate: 3rd year of Yuanfeng, under Emperor Wu#!\n#weak The Han army advanced by land and sea and besieged Wangxian for a long time without taking it. Then the ministers within the city rose in revolt, killed King Ugeo of Joseon, and surrendered, and the Han established commanderies and counties in his former lands.\n\n#italic 'The Jiang and the Han flow mighty, the warriors are fierce and bold. They set the four quarters in order and report success to the king.'#! - Classic of Poetry, Greater Odes, Jiang and Han#!"
 HJ_BattlePoIHistoricalNameDaYuan:0 "War of Dayuan"
 HJ_BattlePoIHistoricalDescDaYuan:0 "#emp Victor: Han\nDefeated: Dayuan\nDate: 1st-3rd years of Taichu, under Emperor Wu#!\n#weak Li Guangli, the Ershi General, twice marched far to Dayuan. The second time, he led a great army to besiege its capital and cut off its water supply. The nobles of Dayuan killed their king and surrendered, offering their fine horses.\n\n#italic 'The heavenly horses come from the far west, crossing ten thousand li to the land of virtue.'#! - Emperor Wu, Song of the Heavenly Horses of the Far West#!"
 HJ_BattlePoIHistoricalNameLunTai:0 "Battle of Luntai"
 HJ_BattlePoIHistoricalDescLunTai:0 "#emp Victor: Han\nDefeated: Luntai\nDate: 3rd year of Taichu, under Emperor Wu#!\n#weak During the second campaign against Dayuan, Luntai shut its gates and refused to supply the Han army. The Ershi General attacked for several days and massacred the city; the states along the route were struck with terror, and every one opened its gates to provide supplies.\n\n#italic 'When I set out, the millet was in flower. Now I return, and snow and sleet cover the road.'#! - Classic of Poetry, Lesser Odes, Out With the Chariots#!"
 HJ_BattlePoIHistoricalNameJuShi:0 "Battle of Jushi"
 HJ_BattlePoIHistoricalDescJuShi:0 "#emp Victor: Han and the troops of the walled states\nDefeated: Jushi\nDate: Dijie era, under Emperor Xuan#!\n#weak Zheng Ji led the soldiers of the Quli military farms and levied the troops of the walled states of the Western Regions to attack Jushi. The King of Jushi surrendered, and the Han thus opened the roads north and south of the Tianshan.\n\n#italic 'Who says you have no clothes? I will share my robe with you. The king raises an army; let us ready our spears and lances.'#! - Classic of Poetry, Airs of Qin, No Clothes#!"
 HJ_BattlePoIHistoricalNameZhiZhi:0 "Battle of Zhizhi"
 HJ_BattlePoIHistoricalDescZhiZhi:0 "#emp Victor: Han and the troops of the Western Regions\nDefeated: Zhizhi Chanyu\nDate: 3rd year of Jianzhao, under Emperor Yuan#!\n#weak Chen Tang, Deputy Colonel of the Western Regions, and Protector General Gan Yanshou forged an imperial edict to raise troops and made a distant strike on the city of Zhizhi in Kangju. They took the city and beheaded Zhizhi Chanyu, sending his head to the capital, and Zhizhi's power in the Western Regions was destroyed.\n\n#italic 'Whoever offends the mighty Han shall be punished, however far away!'#! - Memorial of Chen Tang#!"
 HJ_BattlePoIHistoricalNameKunYang:0 "Battle of Kunyang"
 HJ_BattlePoIHistoricalDescKunYang:0 "#emp Victor: Han\nDefeated: Wang Mang's army\nDate: 1st year of Gengshi#!\n#weak Emperor Guangwu led three thousand men sworn to die in a charge against the core of Wang Mang's great army, while the Kunyang garrison sallied out to strike from the other side. Wang Mang's commander Wang Xun fell in battle, and his army, said to number a million, scattered at once.\n\n#italic 'The hosts of Yin-Shang were massed like a forest. They arrayed at Muye, but it is we who rise.'#! - Classic of Poetry, Greater Odes, Great Brightness#!"
 HJ_BattlePoIHistoricalNameLangBo:0 "Battle of Langbo"
 HJ_BattlePoIHistoricalDescLangBo:0 "#emp Victor: Han\nDefeated: Zheng Ce and Zheng Er\nDate: 18th year of Jianwu, under Emperor Guangwu#!\n#weak Wave-Calming General Ma Yuan led his army to Langbo, broke the main force of Zheng Ce and Zheng Er, then hunted down the remnants, and the rebellion in Jiaozhi was quelled.\n\n#italic 'A man should die on the frontier and be carried home wrapped in a horse's hide.'#! - Words of Ma Yuan, Wave-Calming General#!"
 HJ_BattlePoIHistoricalNameYiWuLu:0 "Battle of Yiwulu"
 HJ_BattlePoIHistoricalDescYiWuLu:0 "#emp Victor: Han\nDefeated: Northern Xiongnu\nDate: 16th year of Yongping, under Emperor Ming#!\n#weak Chariot Commandant Dou Gu and his lieutenant Geng Zhong marched out from the Jiuquan frontier, defeated the Huyan King of the Northern Xiongnu, and seized Yiwulu, where they appointed a Yihe Commandant to establish military farms. Thus the Han returned to the Western Regions.\n\n#italic 'A true man with no other ambition should still emulate Fu Jiezi and Zhang Qian and win merit in foreign lands.'#! - Words of Ban Chao#!"
 HJ_BattlePoIHistoricalNameTianShan:0 "Battle of the Tianshan"
 HJ_BattlePoIHistoricalDescTianShan:0 "#emp Victor: Han\nDefeated: The Huyan King's tribe of the Northern Xiongnu\nDate: 16th year of Yongping, under Emperor Ming#!\n#weak Dou Gu led his army out from Jiuquan and defeated the Huyan King's tribe of the Northern Xiongnu at the Tianshan, pursuing them all the way to Lake Pulei and opening the way for the Han's return to the Western Regions.\n\n#italic 'Illustrious is Fang Shu, who smote the Xianyun, and the Man of Jing came in awe.'#! - Classic of Poetry, Lesser Odes, Gathering Millet#!"
 HJ_BattlePoIHistoricalNameShuLe:0 "Defense of Shule"
 HJ_BattlePoIHistoricalDescShuLe:0 "#emp Defender: Geng Gong, Wuji Colonel\nAttacker: The Northern Xiongnu and the troops of Jushi\nDate: 18th year of Yongping, under Emperor Ming#!\n#weak Geng Gong held Shule with an isolated force. The Xiongnu cut off the stream, and the defenders dug a well fifteen zhang deep yet found no water. Geng Gong straightened his robes and bowed twice to the well, and water came gushing forth. Besieged for over a year, they were at last relieved, but only thirteen men followed him back east through the Jade Gate.\n\n#italic 'I have heard that the Ershi General once drew his sword and stabbed a mountain, and a spring gushed forth; now the virtue of Han is divine, how could it ever fail us!'#! - Words of Geng Gong#!"
