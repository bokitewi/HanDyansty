l_english:
 hd_hi.1001.where:0 "\n\n#weak Place of uprising: [hd_news_place.GetName]#!"
 hd_world_news.a:0 "The realm is about to change again."

 hd_world_news.0001.t:0 "The Yellow Heaven Shall Rise"
 hd_world_news.0001.desc:0 "Urgent reports arrive from Jizhou: Tang Zhou has exposed the plot of the Way of Great Peace, and Ma Yuanyi has been torn apart by chariots in Luoyang. [hd_news_a.GetName] waits no longer, proclaiming himself General of Heaven and rising in rebellion at [hd_news_place.GetName].\n\nAt the same time, [hd_news_c.GetName] takes up arms at [hd_news_place_c.GetName], followed by [hd_news_d.GetName] at [hd_news_place_d.GetName]. The thirty-six divisions don yellow headscarves, and appeals for aid arrive from the provinces and commanderies several times a day.\n\n'The Blue Heaven is dead; the Yellow Heaven shall rise.' These words have now spread throughout the realm."
 hd_world_news.0001.missing_details_desc:0 "Urgent reports arrive from Jizhou: Tang Zhou has exposed the plot of the Way of Great Peace, and Ma Yuanyi has been torn apart by chariots in Luoyang. [hd_news_a.GetName] waits no longer, proclaiming himself General of Heaven and rising in rebellion.\n\nThe thirty-six divisions don yellow headscarves, and appeals for aid arrive from the provinces and commanderies several times a day.\n\n'The Blue Heaven is dead; the Yellow Heaven shall rise.' These words have now spread throughout the realm."
 hd_world_news.0002.t:0 "The Death of Emperor Ling"
 hd_world_news.0002.desc:0 "Grim news comes from Luoyang: the emperor, [hd_news_a.GetName], has died in the Southern Palace.\n\nPrince [hd_news_b.GetName] succeeds to the throne with the support of He Jin and Empress He, but the palace eunuchs and the imperial in-laws have long been bitter enemies. The new ruler is young, and the General-in-Chief and the Regular Attendants each wait for the other side to strike first.\n\nAll eyes turn toward [hd_news_place.GetName]."
 hd_world_news.0003.t:0 "Liangzhou Troops Enter Luoyang"
 hd_world_news.0003.desc:0 "He Jin has died at the palace gates, the Yuan brothers have slaughtered the eunuchs, and Luoyang is in turmoil. Amid the chaos, [hd_news_a.GetName] leads the armored cavalry of Liangzhou into the city ahead of all others, recovering the fugitive emperor at Mount Beimang.\n\nTroops from Western Liang now fill [hd_news_place.GetName] and its surroundings, while the commanderies of Sili change their allegiance. The ministers at court regard this uninvited 'savior of the emperor,' uncertain how much authority the Son of Heaven can still exercise for himself."
 hd_world_news.0004.t:0 "Dong Zhuo Replaces the Emperor"
 hd_world_news.0004.desc:0 "[hd_news_a.GetName] summons the officials to [hd_news_place.GetName] and publicly announces the deposition of the young emperor, enthroning the Prince of Chenliu, [hd_news_b.GetName], in his place.\n\nNone of the assembled ministers dares speak. Only Yuan Shao holds his sword across his body, offers a deep bow, and flees to Jizhou. As news of the deposition spreads, unrest stirs in the eastern provinces and commanderies, where plans for a punitive expedition are already taking shape in secret."
 hd_world_news.0005.t:0 "The East Takes Up Arms"
 hd_world_news.0005.desc:0 "The eastern provinces and commanderies seal their alliance with blood, choosing [hd_news_a.GetName] as their leader and sending proclamations throughout the realm to rally against the traitor [hd_news_b.GetName].\n\nWith [hd_news_place.GetName] as its base, the coalition sends its armies toward Luoyang. The outcome of this war will decide whose hands hold the emperor."
 hd_world_news.0006.t:0 "The Coalition Victorious"
 hd_world_news.0006.desc:0 "The coalition against Dong Zhuo has defeated [hd_news_b.GetName]. Yet Henan passes to no single victor: under [hd_news_a.GetName]'s banner the armies reach [hd_news_place.GetName], and every county of Henan now stands on its own under local strongmen.\n\nYet scarcely has this great victory been won before suspicion surfaces among the regional lords. Dong Zhuo withdraws to Guanzhong, the coalition's members pursue their own designs, and peace still eludes the realm."
 hd_world_news.0007.t:0 "The Coalition Fails"
 hd_world_news.0007.desc:0 "The eastern coalition's prolonged offensive has achieved nothing. Its leader, [hd_news_a.GetName], and the regional lords hold lavish banquets day after day, until provisions run out and the troops disperse. [hd_news_b.GetName] still holds the emperor captive, remaining firmly established at [hd_news_place.GetName].\n\nThe lords withdraw their armies one after another, turning instead to war against each other. The alliance against Dong Zhuo now exists in name alone."
 hd_world_news.0007.no_place_desc:0 "The eastern coalition's prolonged offensive has achieved nothing. Its leader, [hd_news_a.GetName], and the regional lords hold lavish banquets day after day, until provisions run out and the troops disperse. [hd_news_b.GetName] is still alive, and the coalition has failed to free the emperor.\n\nThe lords withdraw their armies one after another, turning instead to war against each other. The alliance against Dong Zhuo now exists in name alone."
 hd_world_news.0008.t:0 "Luoyang Burns, the Court Moves West"
 hd_world_news.0008.desc:0 "To escape the eastern armies, [hd_news_a.GetName] takes the captive emperor [hd_news_b.GetName] westward, moving the capital to [hd_news_place.GetName]. Before leaving, the palaces of Luoyang are set ablaze and millions of commoners are driven west, their dead lying piled along the roads.\n\nAn imperial capital of two hundred years is reduced to ashes overnight. Henceforth, the emperor's decrees will come from Chang'an."
 hd_world_news.0009.t:0 "The Traitor Slain"
 hd_world_news.0009.desc:0 "Word comes from Chang'an: [hd_news_a.GetName] is dead.\n\nWith the fall of the man who held the emperor captive and burned Luoyang, his former troops from Western Liang are left leaderless. The situation in Guanzhong has suddenly become impossible to predict."
 hd_world_news.0009.wang_desc:0 "Word comes from Chang'an: Minister of the Masses [hd_news_b.GetName] has conspired with Lü Bu to kill [hd_news_a.GetName] before the palace gates.\n\nIt is said that the officials and commoners of Chang'an sang and danced in the streets at the news, selling their clothing to buy wine and meat for the celebrations. Yet Dong Zhuo's former troops from Western Liang remain under arms outside the city. No one dares say whether Wang Yun can bring the situation under control."
 hd_world_news.0009.killed_desc:0 "Word comes from Chang'an: [hd_news_a.GetName] has died at the hands of [hd_news_b.GetName].\n\nWith the fall of the man who held the emperor captive and burned Luoyang, his former troops from Western Liang are left leaderless. The situation in Guanzhong has suddenly become impossible to predict."
 hd_world_news.0010.t:0 "Western Liang Strikes Back at Chang'an"
 hd_world_news.0010.desc:0 "After Dong Zhuo's death, his former troops from Western Liang are gripped by fear. Following Jia Xu's counsel, [hd_news_a.GetName] gathers the scattered soldiers and fights back into Guanzhong, advancing directly against [hd_news_b.GetName] at [hd_news_place.GetName].\n\nChang'an has barely breathed a sigh of relief before another bloody battle looms."
 hd_world_news.0011.t:0 "Receiving the Emperor"
 hd_world_news.0011.desc:0 "In the name of receiving and serving the emperor, [hd_news_a.GetName] raises troops at [hd_news_place.GetName] and declares war on [hd_news_b.GetName].\n\nWhoever brings the emperor to their side can issue commands in his name against those who refuse obedience. The outcome of this war will reshape the realm."
 hd_world_news.0012.t:0 "The Emperor Returns East"
 hd_world_news.0012.desc:0 "[hd_news_a.GetName] has secured the emperor [hd_news_b.GetName], who moves with the court to [hd_news_place.GetName].\n\nHenceforth, imperial decrees will be issued by the hand of [hd_news_a.GetFirstNameNoTooltip]. Among the regional lords, some submit memorials of congratulation, some grind their teeth in secret, and others begin planning how to seize the emperor once more."
 hd_world_news.0013.t:0 "The Standoff at Guandu"
 hd_world_news.0013.desc:0 "Only two great rivals remain in the north. [hd_news_a.GetName] marches from [hd_news_place.GetName], while [hd_news_b.GetName] musters the forces of Hebei to meet the attack. The armies face each other at Guandu.\n\nThe victor of this battle will command the entire Central Plain."
 hd_world_news.0014.t:0 "Guandu: The Yuan Army Routed"
 hd_world_news.0014.desc:0 "At Guandu, [hd_news_a.GetName] overcomes a larger force, and the great army of [hd_news_b.GetName] collapses overnight.\n\nThe provinces of Hebei now lie open to invasion. The north has a new master."
 hd_world_news.0015.t:0 "Guandu: The Yuan Army Victorious"
 hd_world_news.0015.desc:0 "At Guandu, [hd_news_a.GetName] holds back the great army of [hd_news_b.GetName]. Cao's forces retreat in defeat, and confidence falters throughout Henan.\n\nIn a departure from recorded history, it is the Yuan clan of Hebei that gains the upper hand this time."
 hd_world_news.0016.t:0 "The Great Army Marches South"
 hd_world_news.0016.desc:0 "[hd_news_a.GetName] marches south by land and water, declaring war on [hd_news_b.GetName], with warships stretching for hundreds of li. The Sun and Liu clans ally against Cao. Holding [hd_news_place.GetName], [hd_news_b.GetFirstNameNoTooltip] has nowhere left to retreat; the fate of Jiangdong rests on this battle.\n\nVictory would unite the realm; defeat would set its division into three."
 hd_world_news.0017.t:0 "Red Cliffs: The Northern Army Retreats"
 hd_world_news.0017.desc:0 "A great fire at Red Cliffs has consumed the warships of [hd_news_b.GetName]. With most of the northern army killed or wounded and disease spreading through its ranks, it can only retreat northward.\n\n[hd_news_a.GetName] has held Jiangdong. The realm's division into three is now set."
 hd_world_news.0018.t:0 "Red Cliffs: The River Defenses Breached"
 hd_world_news.0018.desc:0 "In a departure from recorded history, the great army of [hd_news_a.GetName] has broken through the defenses along the Yangtze. The power of [hd_news_b.GetName] in Jiangdong hangs by a thread.\n\nThe Yangtze's natural barrier has been breached. Only a few final steps remain before the realm is united."
 hd_world_news.0019.t:0 "A Provincial Rebellion"
 hd_world_news.0019.desc:0 "[hd_news_a.GetName] has risen in rebellion at [hd_news_place.GetName], directing the attack against [hd_news_b.GetName].\n\nUrgent reports stream from the provinces and commanderies, one after another. Disorder has already gripped the region."
 hd_world_news.0020.t:0 "The Northern Riders March South"
 hd_world_news.0020.desc:0 "[hd_news_a.GetName] gathers followers and raises an army at [hd_news_place.GetName], seeking to seize [hd_news_title.GetName] and settle the contest with [hd_news_b.GetName].\n\nThe riders from beyond the frontier have crossed the old borders. The gates of the Central Plain have been forced open."

