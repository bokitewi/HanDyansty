 hjbz_guard.0001.t:0 "Reestablishing the Yulin Guards"
 hjbz_guard.0001.desc:0 "With the Yulin institution restored, men of exceptional strength and ability were selected from respectable families to fill its ranks. On this day, armored troops arrayed themselves outside the palace gates, banners stretching in an unbroken line to the sound of drums and bells.\n\nThe commander led his officers in two bows facing north. From the commandants downward, all unbuckled their swords and bowed their heads to the ground, swearing to defend the palace to the death. The officials read out the investiture and bestowed the corps' designation, their voices carrying to the palace towers. The emperor came to inspect them. Seeing their orderly ranks and gleaming arms and armor, he turned to his attendants and said, 'These are my wings.'"
 hjbz_guard.0001.a:0 "With such a force, I may sleep in peace."
 hjbz_guard.0002.t:0 "Reestablishing the Zhijinwu"
 hjbz_guard.0002.desc:0 "With the Zhijinwu restored, the neglected arrangements were swept away and renewed. Before this, the official quarters had fallen into ruin and the troops had scattered. Thieves walked the streets in broad daylight, and travelers warned one another against venturing out at night.\n\nNow the Red Riders patrol, halberdiers line the roads, and the palace perimeter is patrolled three times each month. When a fire alarm sounds at night, they arrive without delay. After several months, the inhabitants begin to venture out after dark. The officials report, 'Within the capital, the alarm drums are silent.'"
 hjbz_guard.0002.a:0 "So it should be in the imperial capital."
 hjbz_guard.0003.t:0 "The Yulin Guards Paralyzed"
 hjbz_guard.0003.desc:0 "The emperor has lost his authority; his decrees travel no farther than the palace. Some Yulin camps receive orders from others, while some shut their gates and guard themselves. None answers the imperial command.\n\nThe palace guards withdraw one after another, leaving their armor and weapons in the corridors. Those who once faced north and swore to die in service are now scattered in every direction. Outside the hall gates, only a few old soldiers remain, standing with halberds in hand. At the sight of the emperor, they weep."
 hjbz_guard.0003.a:0 "My wings are broken. On whom can I rely?"
 hjbz_guard.0004.t:0 "The Collapse of the Zhijinwu"
 hjbz_guard.0004.desc:0 "With the office of Zhijinwu abolished, the Red Riders and halberdiers are left without command. The cunning seek powerful patrons and become their enforcers, bullying their former comrades. The less resourceful drift through the streets, joining thieves and turning against the people they once protected.\n\nNo one oversees the watch outside the palace. Fires break out, but no rescuers come. The official quarters built in earlier days now shelter gatherings of gamblers and drunkards. Those who understand what has been lost cannot pass without a sigh."
 hjbz_guard.0004.a:0 "Have affairs beyond the palace fallen so low?"
