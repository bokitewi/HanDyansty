l_english:
 hd_dc_request_royal_support_interaction: "Request support for the throne"
 hd_dc_request_royal_support_interaction_desc: "Send a signed invitation requesting the recipient's support for your true claim to the Mandate of Heaven. The listed reward will be paid immediately from your personal assets only after the recipient personally agrees and actually joins the designated faction; no payment is made for sending the letter or receiving verbal acceptance."
 hd_dc_support_reward_g1: "Pay 30 gold upon joining."
 hd_dc_support_reward_g2: "Pay 100 gold after joining."
 hd_dc_support_reward_g3: "Pay 300 gold after joining"
 hd_dc_support.0008.t: "Please support the throne."
 hd_dc_support.0008.desc: "Xiao [hd_dc_support_claimant.GetTitledFirstName]'s letter left no room for ambiguity. After greeting my family, the paper listed [hd_dc_support_claimant.GetHerHis]'s claim to the throne and named the faction demanding my public support. The reward at the end of \n\n was clearly stated: [hd_dc_support.Var('hd_dc_support_reward_gold').GetValue|0] gold, to be paid immediately upon my actual joining. Receiving this letter did not mean agreement. I must decide personally whether to let my name appear under this claim."
 hd_dc_support.0008.a: "I agree. Add my name to the list of supporters."
 hd_dc_support.0008.a.tt: "After re-verifying qualifications, deterministically join the faction of the true claimant specified in the letter; payment of the agreed private funds occurs only upon success. Each individual may receive mobilization rewards at most once per crisis: +15 for first successful joining as a candidate, +25 to you from candidates, −20 to you from the incumbent, and −10 to you from other candidates, lasting 5 years. No additional rejection of lotteries; no ten-year ban on withdrawal."
 hd_dc_support.0008.c: "I still support the reigning monarch."
 hd_dc_support.0008.c.tt: "Explicitly reject this recruitment attempt: the candidate suffers a -5 mobilization penalty; the incumbent gains +100 reputation toward you, while the candidate loses -20 reputation toward you. This effect lasts for 5 years. The same pair of characters will not be invited again within 2 years, with no fines incurred and no faction affiliation added."
 hd_dc_support.0008.invalid: "The situation underlying this letter has changed."
 hd_dc_support.0108.t: "Once the name is settled"
 hd_dc_support.0108.paid: "The reply letter and roster have been verified as accurate. The invitee has indeed joined the faction specified in the original letter, and the agreed remuneration has been actually transferred from the inviter's private assets. \n\n This recruitment matter is now concluded. Subsequent wars must still unfold according to the actual situation; victory or defeat cannot be written down based solely on a reply letter."
 hd_dc_support.0108.unpaid: "The roster confirms actual enrollment, but the full payment has not yet been delivered. The handler left the original receipt on the desk and did not issue a second identical payment order for it. \n\n The remaining unpaid amount still stands in the original account; it cannot be treated as fulfilled, nor can a second deduction cover the first entry."
 hd_dc_support.0108.refused: "The reply was explicit: the invitee still supported the reigning monarch and declined to join this claim to the throne. \n\n This response yielded no new faction members and incurred no payment expenses. Both parties were now aware of each other's positions, so there was no need to send another letter for the time being."
 hd_dc_support.0108.failed: "The reply has been returned, but upon execution, it could not be confirmed that the invitee joined the faction specified in the original letter. \n\n The handler ceased subsequent payment of rewards, treating the verbal promise not as support already received, nor did they secretly switch allegiance to another faction."
 hd_dc_support.0108.a: "Record according to the actual results."
