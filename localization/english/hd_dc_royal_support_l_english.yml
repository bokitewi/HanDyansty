l_english:
 hd_dc_request_royal_support_interaction:0 "Request Support for the Throne"
 hd_dc_request_royal_support_interaction_desc:0 "Write a letter promising payment in return for public support of your claim."
 hd_dc_support_reward_g1:0 "Promise 30 Gold"
 hd_dc_support_reward_g2:0 "Promise 100 Gold"
 hd_dc_support_reward_g3:0 "Promise 300 Gold"
 hd_dc_support.0008.t:0 "A Request for Your Aid"
 hd_dc_support.0008.desc:0 "[hd_dc_support_claimant.GetTitledFirstName]’s letter wastes no time. After asking after your family, it sets out [hd_dc_support_claimant.GetHerHis] claim to the throne and names the faction you are asked to join publicly.\n\nThe promised payment is clearly written at the end: [hd_dc_support.Var('hd_dc_support_reward_gold').GetValue|0] gold, to be delivered as soon as your name is added to the supporters’ list.\n\nReceiving this letter is no acceptance. Whether your name should appear beneath this claim is yours to decide."
 hd_dc_support.0008.a:0 "Add my name. I shall lend you my support."
 hd_dc_support.0008.a.tt:0 "After eligibility is checked, you will join the faction of the specific claimant named in the letter. The promised personal gold is paid only if you successfully join. Each character can receive the mobilization reward once per crisis: the candidate gains +15 Mobilization on your first successful joining; the candidate’s opinion of you increases by 25, the incumbent’s decreases by 20, and other candidates’ decreases by 10 for 5 years. There is no additional refusal-roll restriction or ten-year ban on leaving."
 hd_dc_support.0008.c:0 "My loyalty remains with the reigning sovereign."
 hd_dc_support.0008.c.tt:0 "Refuse this invitation outright: the candidate loses 5 Mobilization; the incumbent’s opinion of you increases by 100 and the candidate’s decreases by 20 for 5 years. The same pair of characters cannot exchange another invitation for 2 years. No penalty is imposed and you join no faction."
 hd_dc_support.0008.invalid:0 "Circumstances have changed. This request no longer stands."
 hd_dc_support.0108.t:0 "A Name on the List"
 hd_dc_support.0108.paid:0 "The reply and the roster have arrived. [hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName]’s name has been added to [hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]’s faction, and the promised payment has been delivered in full from [hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]’s private treasury.\n\nThis attempt to win support has succeeded. The outcome of the fighting to come still depends on the fortunes of the realm; no reply can settle it in advance."
 hd_dc_support.0108.unpaid:0 "[hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName] has joined [hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]’s faction, but the promised payment has not arrived in full.\n\nThe clerk records the amount owed without issuing a second payment order. This account will have to be settled sooner or later."
 hd_dc_support.0108.refused:0 "The reply is plain: [hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName] remains loyal to the reigning sovereign and will not join [hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]’s faction.\n\nNo name has been added to the roster and not a coin has changed hands. Both sides now know where the other stands. There is no need to send this letter again for a while."
 hd_dc_support.0108.failed:0 "The reply has arrived, but [hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName] could not be added to [hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]’s faction roster after all.\n\nThe clerk stops the payment. A spoken promise has not been mistaken for support already secured."
 hd_dc_support.0108.a:0 "I shall remember this."
