 WJ_zw_event_only_tt:0 "The Delegated Yellow Axe is granted only with the edict appointing a Commander of All Military Affairs at Court and in the Provinces. It cannot be granted or withdrawn separately, and is withdrawn when the command ends."
 WJ_zw_grant_failed:0 "Appointment Not Yet Confirmed"
 WJ_zw_grant_failed_desc:0 "The Yellow Axe could not be granted, so the appointment to command all military affairs at court and in the provinces is canceled. Only the serving Regent of this dynasty may request another edict. This request has cost nothing."
 WJ_zw_regent_tt:0 "You must be Regent to the Son of Heaven"
