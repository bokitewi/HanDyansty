 WJ_dd_remove_disconnected_desc:0 "Removing this province would split the remaining district, so the change could not be made. Begin with the outer provinces, or dissolve the Military District entirely."
 WJ_dd_replace:0 "Appoint This Character as District Commander"
 WJ_dd_replace_failed:0 "Commander Could Not Be Replaced"
 WJ_dd_replace_failed_desc:0 "The new commander could not be granted a staff of authority. The replacement is canceled; the current commander and district remain unchanged."
 WJ_dd_action_execute:0 "Execute at Once Before the Battle Standard"
 WJ_dd_action_execute_tt:0 "Requires a wartime Area Commander with a Full Staff of Authority, targeting an official of the district guilty of a military offense. A holder of the Delegated Yellow Axe may act against all officials of the dynasty in peacetime, and all its vassals and courtiers in wartime. The Son of Heaven and the Regent are excluded."
 WJ_dd_action_force:0 "Declare a Military Offense"
 WJ_dd_action_force_tt:0 "Requires a wartime Area Commander with a Full Staff of Authority, targeting an official of the district. A holder of the Delegated Yellow Axe may act against all civil and military officials of the dynasty in peacetime, and all its vassals and courtiers in wartime. The Son of Heaven and the Regent are excluded. The target must be free and have no existing military offense."
 WJ_dd_action_justice:0 "Transfer to the Commandant of Justice"
 WJ_dd_action_justice_tt:0 "The target must be free, guilty of a military offense under this dynasty, and within the authority of your staff or yellow axe. The dynasty's Commandant of Justice must be able to serve. A holder of a Provisional Staff may act only in wartime."
 WJ_dd_action_self:0 "Detain at My Headquarters"
 WJ_dd_action_self_tt:0 "Requires a wartime Area Commander with a Full Staff of Authority, or a holder of the Yellow Axe. The target must be within your authority, guilty of a military offense under this dynasty, and not already imprisoned."
 WJ_dd_cancel:0 "Canceled / Military Order Invalid"
 WJ_dd_jie_acceptance_reason:0 "Authority of the Commander's Staff"
 WJ_dd_order_invalid_desc:0 "By the time the order was issued, offices, district boundaries, authority, or the course of the war had changed. It could not be carried out. While opposing the Son of Heaven, you also cannot act in the court's name against officials loyal to him."
 WJ_dd_order_invalid_title:0 "Military Order Not Carried Out"
 recipient_secondary_wj_dd_manage_interaction:0 "Kingdom Officials of the District"
 WJ_dd_adjacent_kingdom_tt:0 "This kingdom must border at least one kingdom already in the Military District"
 WJ_dd_civilian_contract_blocked_tt:0 "A serving Area Commander cannot be reassigned to commandery or county office; replace the commander or dissolve the district first. While a Commander of All Military Affairs at Court and in the Provinces serves, the three grades of staff and the establishment of headquarters fall under that commander's authority."
 WJ_dd_remove_connected_tt:0 "After removing this kingdom, the remaining district must still connect to the commander's seat"
 WJ_dd_ui_rules:0 "The commander's military jurisdiction covers only military officials of this district, whether directly subordinate or not. Civil officials may also seek its aid. While opposing the court, you cannot invoke its authority to command or punish officials loyal to the Son of Heaven."
