 WJ_zw_event_only_tt:0 "The Borrowed Yellow Axe is granted only together with the edict appointing the Commander of the Inner and Outer Armies, and cannot be granted or revoked separately; it is revoked along with that office"
 WJ_zw_grant_failed:0 "The Edict Is Not Yet Settled"
 WJ_zw_grant_failed_desc:0 "The Yellow Axe could not be granted, so the appointment as Commander of the Inner and Outer Armies has been dropped. Only a sitting regent of this court may request the edict again; this request cost nothing."
 WJ_zw_regent_tt:0 "You must be the Son of Heaven's regent"
 WJ_zw_three_seats_tt:0 "Of the four seats of Palace Attendant, Grand General, Director of the Secretariat, and Grand Marshal, at least three must be held by you, your disciples, your staff, or your kinsmen"
 WJ_zw_unique_tt:0 "This court has no Commander-in-Chief of the Inner and Outer Armies yet"
 WJ_mr_amend:0 "Approved, but choose another post."
 WJ_mr_approval_desc:0 "Respectfully submitted: I request that [WJ_mr_target.Custom('WJ_GetLinkedUIName')] be granted the title of [WJ_mr_target.Custom('WJMRChoice')].\n\nThe proposed title has been carefully weighed and suits his office and seat. If approved, the army and the offices will address him by it henceforth; if it seems unfit, please choose another post for him.\n\nI humbly await your decision."
