 WJ_mt_chance_base:0 "Base willingness: #P +50#!"
 WJ_mt_chance_factors:0 "Source's opinion of you: [GetPlayer.MakeScope.ScriptValue('WJ_mt_opinion_score')|+=0]\nKin, friends, disciples, and staff: [GetPlayer.MakeScope.ScriptValue('WJ_mt_trust_score')|+=0]\nHostility: [GetPlayer.MakeScope.ScriptValue('WJ_mt_hostility_score')|+=0]\nMilitary authority and consequences of refusal: [GetPlayer.MakeScope.ScriptValue('WJ_mt_authority_score')|+=0]\nSource's current wars: [GetPlayer.MakeScope.ScriptValue('WJ_mt_war_score')|+=0]\nRegiments to be transferred: [GetPlayer.MakeScope.ScriptValue('WJ_mt_count_score')|+=0]\nProportion of troops transferred: [GetPlayer.MakeScope.ScriptValue('WJ_mt_fraction_score')|+=0]\n\nThe source's willingness is limited to between 5% and 95%."
 WJ_mt_chance_header:0 "#T Acceptance Chance: [GetPlayer.MakeScope.Var('wj_mt_chance').GetValue|0]%#!"
 WJ_mt_chance_self:0 "Transferring your own regiments: #P Always Accepted#!\nRecruitment, titles, military authority, and treasury funds must still be sufficient."
 WJ_mt_confirm_requires:0 "Select source and recipient titles and at least one regiment. Military authority, manpower, and treasury funds must all be sufficient."
 WJ_mt_copy_failed:0 "The new military register could not be compiled, so the transfer is canceled. The troops remain in their original camps, the treasury spends nothing, and no one is charged with an offense."
 WJ_mt_declined_desc:0 "[wj_mt_source.Custom('WJ_GetLinkedUIName')] refused the transfer order. No troops moved. Unless the refuser is the Son of Heaven himself, this disobedience constitutes a military offense."
 WJ_mt_declined_title:0 "Troop Transfer Order Refused"
 WJ_mt_invalid_desc:0 "The selected characters, titles, manpower, or military authority have changed, or the treasury lacks funds. The transfer could not proceed, and no one is charged with an offense. The earlier selections have been cleared; choose again."
 WJ_mt_invalid_title:0 "Transfer Order Not Carried Out"
 WJ_mt_need_pair:0 "First select the source and recipient through character interactions. Both must fall within your military authority. Both ends of a transfer of commandery and kingdom troops must be duchy-tier or above; private troops may be sent by a county-tier holder."
 WJ_mt_order_menu:0 "Troop Transfers"
 WJ_mt_person_gate:0 "Select a character under this court whose troops you currently have authority to transfer."
 WJ_mt_hanjin_tt:0 "You must have a Commanderies and Principalities government."
 WJ_mt_authority_role_tt:0 "You must be this dynasty's Son of Heaven, Commander of All Military Affairs at Court and in the Provinces, or a serving Area Commander."
 WJ_mt_baton_tt:0 "An Area Commander must hold a Provisional Staff, a Staff of Authority, or a Full Staff of Authority."
 WJ_mt_settled_district_tt:0 "The Military District is still being established; wait until it is settled."
 WJ_mt_no_rebellion_tt:0 "An Area Commander cannot transfer troops while at war with the top liege."
 WJ_mt_has_command_tt:0 "The selected character must be landed, or hold a duchy-tier or higher substantive office title capable of supporting commandery and kingdom troops."
 WJ_mt_same_realm_tt:0 "The selected character must share your top liege."
 WJ_mt_central_target_tt:0 "Central transfers may select only yourself, the Emperor, or military officials of this dynasty."
 WJ_mt_local_military_tt:0 "An Area Commander may select only themself or military officials of their district."
 WJ_mt_local_district_tt:0 "The selected military official must belong to your Military District."
 WJ_mt_local_tier_tt:0 "A Full Staff allows transfers from military officials at province level or below; a Staff of Authority is limited to commandery level or below; a Provisional Staff additionally requires wartime."
 WJ_mt_title_tier_tt:0 "The source of commandery and kingdom troops, and recipients of either troop type, must hold duchy-tier or higher titles."
