 WJ_celestial_province_sili_benefits:0 "#emphasis #bold Official Bonuses:#!#!\n$EFFECT_LIST_BULLET$Domain tax #P +15%#!, development growth #P +15%#!\n$EFFECT_LIST_BULLET$Uses [GetLaw('celestial_military_appointment_succession_law').GetName], with title troops according to rank\n$EFFECT_LIST_BULLET$Gains Repute according to taxes paid and title troops\n\n#alert_trial @alert_icon!At most one per Celestial realm; must hold the kingdom containing the capital.#!"
 WJ_celestial_province_sili_desc:0 "#low The capital region thrives, where all the officials converge. The Colonel-Director of Retainers oversees both the administration and the military affairs of the capital region, charged with promoting prosperity, soothing the people, and guarding the court.#!"
