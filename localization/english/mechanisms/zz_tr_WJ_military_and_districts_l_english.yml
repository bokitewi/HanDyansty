 wj_district_management_filter_tag_desc:0 "Military affairs and troop register transfers for district military officials"
 wj_military_transfer_filter_tag_desc:0 "Choose the sending and receiving sides of a troop register transfer"
 WJ_mt_chance_base:0 "Base willingness: #P +50#!"
 WJ_mt_chance_factors:0 "Sender's opinion of you: [GetPlayer.MakeScope.ScriptValue('WJ_mt_opinion_score')|+=0]\nFriends, kin, disciples, and staff: [GetPlayer.MakeScope.ScriptValue('WJ_mt_trust_score')|+=0]\nGrudges: [GetPlayer.MakeScope.ScriptValue('WJ_mt_hostility_score')|+=0]\nMilitary authority and consequences of refusal: [GetPlayer.MakeScope.ScriptValue('WJ_mt_authority_score')|+=0]\nSender's current wars: [GetPlayer.MakeScope.ScriptValue('WJ_mt_war_score')|+=0]\nRegiments to transfer this time: [GetPlayer.MakeScope.ScriptValue('WJ_mt_count_score')|+=0]\nShare of forces transferred out: [GetPlayer.MakeScope.ScriptValue('WJ_mt_fraction_score')|+=0]\n\nThe sender's willingness is at least 5% and at most 95%."
 WJ_mt_chance_header:0 "#T Chance of accepting: [GetPlayer.MakeScope.Var('wj_mt_chance').GetValue|0]%#!"
 WJ_mt_chance_self:0 "Transferring your own regiments: #P always accepted#!\nManpower, titles, military authority, and treasury must still all suffice."
 WJ_mt_confirm_requires:0 "You must select the sending and receiving titles and at least one regiment to transfer, and have sufficient military authority, manpower, and treasury."
 WJ_mt_copy_failed:0 "The new muster roll could not be formed, and the transfer is abandoned: the troops return to their own camps, the treasury has spent nothing, and no one is blamed."
 WJ_mt_declined_desc:0 "[scope:wj_mt_source.Custom('WJ_GetLinkedUIName')] refused the order to transfer troops, and not a single soldier moved. Unless the defiant one is the Son of Heaven himself, he shall be judged for violating military law."
 WJ_mt_declined_title:0 "Transfer Order Defied"
 WJ_mt_invalid_desc:0 "The candidates, titles, manpower, or military authority have changed, or the treasury falls short, so the transfer order could not be carried out, and no one is blamed. The previously chosen candidates have been cleared and must be selected again."
 WJ_mt_invalid_title:0 "Transfer Order Not Carried Out"
 WJ_mt_need_pair:0 "First select the sender and receiver from the character interaction menu; both must be within reach of your military authority. Commandery troops require duke tier or above on both ends; retainers (buqu) may be sent from a count."
 WJ_mt_order_menu:0 "Troop Register Transfer"
 WJ_mt_person_gate:0 "Choose a character of this court whom you currently have the authority to command."
 WJ_mt_hanjin_tt:0 "Must use the Commandery-Kingdom System government."
 WJ_mt_authority_role_tt:0 "You must be this court's Son of Heaven, the Commander of the Inner and Outer Armies, or a sitting regional Area Commander."
 WJ_mt_baton_tt:0 "A regional Area Commander must hold the Jiajie, Chijie, or Shichijie tally."
 WJ_mt_settled_district_tt:0 "The military district is still being set up; wait until it is settled."
 WJ_mt_no_rebellion_tt:0 "A regional Area Commander cannot transfer troops while at war with his top liege."
 WJ_mt_has_command_tt:0 "The selected character must be landed, or hold a duke-tier or higher substantive title able to carry commandery troops."
 WJ_mt_same_realm_tt:0 "The selected character must belong to the same top liege's realm as you."
 WJ_mt_central_target_tt:0 "Central transfers may only select yourself, the Emperor, or a military official of this court."
 WJ_mt_local_military_tt:0 "A regional Area Commander may only select himself or a military official of his district."
 WJ_mt_local_district_tt:0 "The selected military official must belong to your military district."
 WJ_mt_local_tier_tt:0 "Shichijie can command military officials of provincial tier and below; Chijie is limited to commandery tier and below; Jiajie also requires being at war."
 WJ_mt_title_tier_tt:0 "The sender of commandery troops and both kinds of receivers must hold a duke-tier or higher title."
 WJ_mt_success_desc:0 "The troops sent by [scope:wj_mt_source.Custom('WJ_GetLinkedUIName')] have been placed under the command of [scope:wj_mt_receiver.Custom('WJ_GetLinkedUIName')] as ordered, and their old register has been struck off. If retainers were reorganized, the treasury has paid compensation to their former master."
 WJ_mt_success_title:0 "The Muster Roll Is Settled"
