 WJ_dd_create_failed:0 "Military District Not Established"
 WJ_dd_create_failed_desc:0 "The staff of authority could not be granted. The proposed command is abandoned, and the provincial boundaries remain unchanged."
 WJ_dd_lawful_detention_reason:0 "Lawful Transfer of a Military Offender"
 WJ_dd_remove:0 "Remove This Kingdom from the District"
