 WJ_dd_petition_acceptance_tt:0 "The Emperor's trust in you and your military achievements and standing must justify the authority requested. A Provisional Staff is easiest to obtain, a Staff of Authority harder, and a Full Staff hardest; requests to expand a district are judged like requests for a Staff of Authority. Loyal characters and members of the Emperor's dynasty are more likely to gain approval; disloyal characters are less likely."
 WJ_dd_petition_approve:0 "The edict reads: Approved. Let it be done as requested."
 WJ_dd_petition_approved_opinion:0 "Petition Approved"
 WJ_dd_petition_create_letter:0 "The military affairs entrusted to me often involve forces in neighboring territories. Though each contingent has its own commander, roads and defenses cannot be neatly divided. In times of urgency, sending messengers back and forth for instructions often delays assistance.\n\nI respectfully request that an area command be established around my military headquarters, with authority over the military affairs of the provinces and commanderies, and that I be granted a staff of authority to coordinate their forces.\n\nIf approved, I shall observe the limits of the authority granted and never regard this military charge as a family possession. I await your judgment on whether this may proceed."
 WJ_dd_petition_create_letter_1:0 "$WJ_dd_petition_create_letter$\n\nI venture to request a Provisional Staff of Authority."
 WJ_dd_petition_create_letter_2:0 "$WJ_dd_petition_create_letter$\n\nI venture to request a Staff of Authority."
 WJ_dd_petition_create_letter_3:0 "$WJ_dd_petition_create_letter$\n\nI venture to request a Full Staff of Authority."
 WJ_dd_petition_decline:0 "The proposal is denied. Maintain the existing arrangements."
 WJ_dd_petition_declined_opinion:0 "Petition Rejected"
 WJ_dd_petition_expand_letter:0 "My Military District borders the territory governed by [wj_dd_petitioner.MakeScope.Var('wj_dd_petition_target').Char.Custom('WJ_GetLinkedUIName')]. Recent discussions of defense and reinforcement have repeatedly required crossings between districts, making it difficult to coordinate orders and routes.\n\nI respectfully request command over the provinces and commanderies held by this official that adjoin my district and belong to no other, so their forces can be deployed together. This proposal concerns military authority alone; it does not transfer lands.\n\nThis is the full extent of my request. I await approval; should it be deemed unsuitable, I shall continue my duties within my present boundaries."
 WJ_dd_qinwang_gate:0 "The Son of Heaven must lead a war eligible for support and have sufficient Influence, Prestige, and Legitimacy. This character must be a serving Area Commander of the dynasty and able to join the war."
 WJ_dd_rename_desc:0 "You take up your brush to choose another name for this Military District. The new name changes only the district registers, leaving its boundaries and command intact. It will remain even when another commander takes office.\n\n#weak Right-click the rename icon beside the district name to restore its original name.#!"
 WJ_dd_rename_title:0 "Rename Military District"
