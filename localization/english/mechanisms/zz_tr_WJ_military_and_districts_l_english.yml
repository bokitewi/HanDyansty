l_english:
 WJ_conquest_accepted_desc:0 "I have obeyed the command to campaign: war has been declared on [target.GetName], under the rule of [secondary_recipient.Custom('WJ_GetLinkedUIName')]. I send this report without delay.\n\nWith the orders issued, provisions and the movements of our contingents must follow the enemy's actions. Military affairs occupy us as the messenger departs. This report of our departure cannot yet be a report of victory; gains and losses will be reported in due course.\n\nAny lands taken will belong to the court, in accordance with the rules of this campaign. Having accepted command, I can no longer plead a lack of clear orders."
 WJ_conquest_acknowledge:0 "Understood."
 WJ_conquest_commission_accept_tt:0 "If this war is won, [target.GetNameNoTier] will belong to the court."
 WJ_conquest_commission_decline_tt:0 "Refusing to march will invite criticism at court."
 WJ_conquest_commission_proposal:0 "You are commanded to lead your forces against [target.GetNameNoTier]. Any lands taken shall belong to the court."
 WJ_conquest_declined_desc:0 "I have received the order to campaign. After repeated consideration, I still cannot accept this charge, and write to make that clear.\n\nI know the army cannot wait long. I hoped to soften my refusal, but no matter how much I write, no troops will march with this letter. Better to state my inability to fight now than leave the court believing I am still making preparations.\n\nPlease make other arrangements for this campaign, and wait no longer for my compliance. May the messenger deliver this swiftly, so the planned deployment suffers no further delay on my account."
 WJ_conquest_invalid_desc:0 "The dispatch intended for the front has returned to your desk. An official points out several entries: while it was in transit, both the command structure and the target changed. The order to campaign can no longer be carried out.\n\nYou ask him to explain again, then lay down the document. Your intentions have already been proclaimed, yet no troops have marched. Pressing the old order would likely bring the same rejected dispatch back again.\n\nYou write \"Canceled\" beside the original proposal, your eyes lingering on the unfulfilled objective. The Prestige spent is gone, and the matter cannot readily be raised again. You must devise another course."
 WJ_conquest_invalid_title:0 "Campaign Canceled"
 WJ_conquest_no_target_tt:0 "The commissioned Area Commander's district must border a duchy outside the realm"
