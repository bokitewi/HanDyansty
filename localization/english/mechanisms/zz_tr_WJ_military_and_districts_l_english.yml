 WJ_mt_zhongwai_exclusive_tt:0 "While a Commander of the Inner and Outer Armies is in office, troop register transfers are his to command; neither the Son of Heaven nor regional Area Commanders may transfer troops on their own."
 WJ_zw_request_aid_desc:0 "$celestial_request_military_aid_interaction_desc$\n\nWhile a Commander-in-Chief of the Inner and Outer Armies is in office, such requests for aid are decided by him on the Son of Heaven's behalf."
 WJ_zw_send_aid_desc:0 "$celestial_send_military_aid_interaction_desc$\n\nWhile a Commander-in-Chief of the Inner and Outer Armies is in office, this order is issued by him on the Son of Heaven's behalf."
 WJ_zw_takeover_tt:0 "Military affairs now rest with the Commander-in-Chief of the Inner and Outer Armies; it is unseemly for the Son of Heaven to intervene in person"
