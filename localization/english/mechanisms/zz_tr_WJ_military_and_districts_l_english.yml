 WJ_dd_aid_available_tt:0 "You must lead the war, and the Area Commander must be able to join personally or have an available general in the district. In a civil war within the same dynasty, requests for aid cannot bypass your immediate commander."
 WJ_dd_central_route_tt:0 "Officials in a Military District must request aid from its Area Commander; only the commander may appeal directly to the court"
 WJ_dd_defence_notice_desc:0 "[attacker.Custom('WJ_GetLinkedUIName')] has declared war on [SCOPE.sC('wj_dd_beneficiary').Custom('WJ_GetLinkedUIName')]. You may dispatch district reinforcements from the Military District page."
