 WJ_dd_petition_acceptance_tt:0 "The Son of Heaven's trust in you and your martial renown must suffice for the tally requested: Granted the Tally is easiest, Bearing the Tally next, Envoy Bearing the Tally hardest; a request to expand a command counts as Bearing the Tally. The loyal and those of the Son of Heaven's own clan are more readily approved; the disloyal, less so"
 WJ_dd_petition_approve:0 "By imperial decree: Approved. Let it be as requested."
 WJ_dd_petition_approved_opinion:0 "Memorial Approved"
 WJ_dd_petition_create_letter:0 "The military affairs of the region your servant oversees are often entangled with the armies of neighboring borders. Though each body of troops has its own command, roads and defenses cannot be cleanly divided; whenever matters grow urgent, sending men back and forth for instructions often delays relief.\n\nYour servant humbly requests that, with the military office he holds as its core, an Area Command be established to oversee the military affairs of the provinces and commanderies, and that the Banner and Tally be granted, so that your servant may coordinate military affairs.\n\nShould this be approved, your servant will carefully keep to the powers granted, and dares not regard a military command as a family estate. Whether it may be carried out, your servant humbly awaits your decision."
 WJ_dd_petition_create_letter_1:0 "$WJ_dd_petition_create_letter$\n\nYour servant boldly requests to be Granted the Tally."
 WJ_dd_petition_create_letter_2:0 "$WJ_dd_petition_create_letter$\n\nYour servant boldly requests to Bear the Tally."
 WJ_dd_petition_create_letter_3:0 "$WJ_dd_petition_create_letter$\n\nYour servant boldly requests to be made Envoy Bearing the Tally."
 WJ_dd_petition_decline:0 "This proposal is not approved; the old arrangement stands."
 WJ_dd_petition_declined_opinion:0 "Memorial Rejected"
 WJ_dd_petition_expand_letter:0 "The Area Command your servant oversees borders the territory of [scope:wj_dd_petitioner.MakeScope.Var('wj_dd_petition_target').Char.Custom('WJ_GetLinkedUIName')]. Of late, matters of defense and mutual relief often require going back and forth across commands, and military orders and roads are hard to reconcile.\n\nYour servant humbly requests that the provinces and commanderies held by them, adjoining this command and not part of another, be placed under your servant's control, for unified direction. This concerns only military command, not fiefs.\n\nThis is all your servant asks, and he humbly awaits approval; if it is deemed unsuitable, your servant will continue to do his duty within his present territory."
 WJ_dd_qinwang_gate:0 "The Son of Heaven must be leading a war that can receive aid, with sufficient influence, prestige and legitimacy; this person must be a current Area Commander of this dynasty and able to join the war"
 WJ_dd_rename_desc:0 "You take up the brush to give this Area Command a new name. The new name is written only in the Area Command's register, changing neither its territory nor its chain of command; it remains even when Area Commanders change.\n\n#weak Right-click the rename icon beside the command's name to restore its original name.#!"
 WJ_dd_rename_title:0 "Rename Area Command"
 WJ_dd_reset_name:0 "Restore Name"
 WJ_dd_add:0 "Add Their Kingdom to the Command"
 WJ_dd_choose_chijie:0 "Grant Bearing the Tally"
 WJ_dd_choose_jiajie:0 "Grant the Tally"
 WJ_dd_choose_jie_tt:0 "Must choose one of: Granted the Tally, Bearing the Tally, or Envoy Bearing the Tally"
 WJ_dd_choose_shichijie:0 "Grant Envoy Bearing the Tally"
 WJ_dd_create_failed:0 "Area Command Not Established"
 WJ_dd_create_failed_desc:0 "The Banner and Tally could not be granted, so the proposal to establish a command is abandoned, and the provincial territories remain as before."
 WJ_dd_lawful_detention_reason:0 "Lawful transfer of a military offender"
 WJ_dd_remove:0 "Remove Their Kingdom from the Command"
 WJ_dd_remove_disconnected:0 "The Command Cannot Be Split"
 WJ_dd_remove_disconnected_desc:0 "Without this province, the remaining territory would be cut apart, so the adjustment could not be made. Begin with the outer provinces, or abolish the Area Command outright."
 WJ_dd_replace:0 "Order Them to Succeed as Area Commander"
 WJ_dd_replace_failed:0 "Change of Commander Failed"
 WJ_dd_replace_failed_desc:0 "The new Area Commander's Banner and Tally could not be granted, so the change of commander is abandoned; the former Area Commander and the command remain as before."
 WJ_dd_action_execute:0 "Behead at Once, as Sacrifice to the Banner"
 WJ_dd_action_execute_tt:0 "Must be an Area Commander who is Envoy Bearing the Tally in wartime, targeting an official of the command guilty of a military crime; one holding the Borrowed Yellow Axe may reach all court officials in peacetime, and all vassals and courtiers of the dynasty in wartime. The Son of Heaven and the Regent are excluded"
 WJ_dd_action_force:0 "Declare Violation of Military Law"
 WJ_dd_action_force_tt:0 "Must be an Area Commander who is Envoy Bearing the Tally in wartime, targeting an official of the command; one holding the Borrowed Yellow Axe may reach all civil and military officials in peacetime, and all vassals and courtiers of the dynasty in wartime. The Son of Heaven and the Regent are excluded; the target must not be imprisoned and must not already have a military crime"
 WJ_dd_action_justice:0 "Hand to Commandant of Justice for Detention"
 WJ_dd_action_justice_tt:0 "The target must be guilty of a military crime of this dynasty, be within reach of your tally or Yellow Axe, and not be imprisoned; the dynasty's Commandant of Justice must be able to act. One Granted the Tally may do so only in wartime"
 WJ_dd_action_self:0 "Detain in Own Headquarters"
 WJ_dd_action_self_tt:0 "You must be an Area Commander with the Shichijie tally in wartime, or hold the Yellow Axe; the target must be within your reach, guilty of a crime against this dynasty's military law, and not imprisoned"
 WJ_dd_cancel:0 "Cancel / The military order has lapsed"
 WJ_dd_jie_acceptance_reason:0 "Authority of the Area Commander's Tally"
 WJ_dd_order_invalid_desc:0 "By the time the order went out, the office, district, tally, or course of the war had changed, and it could not be carried out. While at war with the Son of Heaven, one may no longer use the court's name to punish officials loyal to him."
 WJ_dd_order_invalid_title:0 "Military Order Not Carried Out"
 recipient_secondary_wj_dd_manage_interaction:0 "District Kingdom Officials"
 WJ_dd_adjacent_kingdom_tt:0 "The kingdom must border at least one member kingdom of the current military district"
 WJ_dd_civilian_contract_blocked_tt:0 "A sitting Area Commander cannot be reassigned to a civil commandery or county post; replace the commander or dissolve the district first. While a Commander of the Inner and Outer Armies is in office, the three tallies and the opening of headquarters are under his control"
 WJ_dd_remove_connected_tt:0 "After this kingdom is removed, the rest of the district must still connect to the Area Commander's seat"
 WJ_dd_ui_rules:0 "The Area Commander's military law reaches only the military officials of his district, whether direct vassals or not; civil officials may also seek aid from the district. While at war with the court, he may not use the court's name to command or punish officials loyal to the Son of Heaven."
 interaction_category_wj_district:0 "Military District"
 recipient_secondary_wj_dd_deploy_aid_interaction:0 "District Military Officials"
 WJ_dd_aid_available_tt:0 "You must lead the war, and the Area Commander must be able to march in person or have a general in the district to spare; in a civil war within the same court, you may not bypass the chain of command"
 WJ_dd_central_route_tt:0 "Officials within a military district must seek aid from their own Area Commander; only the Area Commander himself may appeal directly to the court"
