l_english:
 WJ_conquest_accepted_desc:0 "The order to campaign has been carried out: I have declared war on [target.GetName] under [secondary_recipient.Custom('WJ_GetLinkedUIName')], and report this first.\n\nNow that orders are issued, provisions and the movements of each unit must be directed according to the enemy's situation. As the envoy departs, the army is busy with affairs, and this report of setting out cannot yet be a report of victory; gains and losses hereafter will be reported in due course.\n\nAll lands taken shall go to the court, as the commission requires. Having taken up the duty of command, I dare no longer plead the absence of a clear order."
 WJ_conquest_acknowledge:0 "Noted."
 WJ_conquest_commission_accept_tt:0 "If this war is won, [target.GetNameNoTier] will belong to the court."
 WJ_conquest_commission_decline_tt:0 "Refusing the order will surely be discussed at court."
 WJ_conquest_commission_proposal:0 "You are ordered to lead your troops against [target.GetNameNoTier]; all lands taken shall belong to the court."
 WJ_conquest_declined_desc:0 "The order to campaign has been received. After much deliberation, I still cannot accept it this time, and write first to say so plainly.\n\nI know an army cannot wait long, and meant to phrase my refusal gently; but however many words I write, no troops will set out with this letter. Rather than let the court think I am still making preparations, better to state up front that I cannot go to war.\n\nPlease make other arrangements for this campaign, and wait no more for me to answer the call. May the envoy deliver this swiftly, so that the planned dispositions suffer no further delay on my account."
 WJ_conquest_invalid_desc:0 "The document meant for the front has come back to your desk. An official points to several items in it and explains: in the time it went back and forth, both command and target have changed, and this order to campaign can no longer be carried out.\n\nYou have him say it again, and only after hearing it do you put the document down. The earlier show of strength has long been made public, yet no troops moved because of it; if you press on with the old order, those below will most likely just send the same returned document back up.\n\nYou write 'Abandoned' beside the original proposal, your gaze still resting on the target that could not be reached. The prestige spent on it cannot be recovered, and the matter cannot easily be raised again for some time; you can only make other plans."
 WJ_conquest_invalid_title:0 "Campaign Abandoned"
 WJ_conquest_no_target_tt:0 "The commissioned Area Commander's territory must border a duchy beyond our borders"
