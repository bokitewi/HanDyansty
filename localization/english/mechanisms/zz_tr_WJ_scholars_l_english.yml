l_english:
 activity_window_character_ming_shi:0 "Invited Renowned Scholar\n[Character.Custom('WJ_GetUIName')|U]"
 activity_wj_qingyi:0 "Pure Criticism"
 activity_wj_qingyi_conclusion_desc:0 "Host and guests gather their sleeves and rise. Today's words have become the monthly verdict, and the talk they began will go on circulating."
 activity_wj_qingyi_desc:0 "Invite kindred spirits and lay out mats and tables to discuss the mysteries of the Dao, dissect the teaching of names, appraise men, and debate statecraft. A few words spoken at the gathering may raise someone to fame, or sow the seeds of enmity."
 activity_wj_qingyi_destination_selection:0 "Choose a place with lodgings where host and guests may converse at leisure."
 activity_wj_qingyi_guest_desc:0 "\n$BULLET_WITH_TAB$Attendees may gain [prestige_i][prestige|E] and [merit_i][merit|E]\n$BULLET_WITH_TAB$Those already in office and of good repute may gain Pure Criticism [trait_level_track_xp|E]\n$BULLET_WITH_TAB$Attendees may find chances to seek instruction, make connections, or ease their worries according to their [intent|E]"
 activity_wj_qingyi_guest_help_text:0 "[activity_guests|E] may be challenged in debate, seek instruction from renowned scholars, appraise others and befriend kindred spirits, or be drawn into whispers after the gathering."
 activity_wj_qingyi_guest_rewards:0 "\n$BULLET_WITH_TAB$Guests may gain [prestige_i][prestige|E] and [merit_i][merit|E]\n$BULLET_WITH_TAB$Within a single year, Pure Criticism [trait_level_track_xp|E] only increases from the first Pure Criticism attended"
 activity_wj_qingyi_host_rewards:0 "\n$BULLET_WITH_TAB$The host may gain [prestige_i][prestige|E] and [merit_i][merit|E]\n$BULLET_WITH_TAB$Hosts already in office and of good repute may gain Pure Criticism [trait_level_track_xp|E]\n$BULLET_WITH_TAB$If a 'Monthly Commentary' is held, the host may gain a great deal of [prestige_i][prestige|E]; the one chosen wins great renown, along with [influence|E] and the honor of 'Renowned Scholar'"
 activity_wj_qingyi_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U] Pure Criticism"
 activity_wj_qingyi_owner:0 "Host of the Pure Criticism"
 activity_wj_qingyi_plural:0 "Pure Criticism Gatherings"
 activity_wj_qingyi_predicted_cost:0 "Predicted Cost"
 activity_wj_qingyi_province_desc:0 "You will hold the Pure Criticism in [ROOT.Province.GetName]. A quiet lodging, easy for guests to come and go, is best for long sessions of discourse."
 activity_wj_qingyi_selection_tooltip:0 "Hold a [GetActivityType('activity_wj_qingyi').GetName], inviting renowned scholars to discuss the mysteries and appraise men."
 ming_shi:0 "Invited Renowned Scholar"
 ming_shi_desc:0 "A renowned scholar of great repute. A single judgment from them can hold the whole gathering rapt, and there will be more requests for instruction and appraisal at the table on their account."
 ming_shi_for_host:0 "Invited Renowned Scholar"
 qingyi_guest_learning_intent:0 "Seek Learning"
 qingyi_guest_learning_intent_desc:0 "You hope to use this gathering to question renowned scholars and fellow seekers on the classics, and to leave having advanced in learning."
 qingyi_yuedan_intent:0 "Monthly Commentary"
 qingyi_yuedan_intent_desc:0 "You wish to follow the example of Xu Zijiang of Runan and appraise the figures of the age in a Monthly Commentary: first nominate eight, then let the assembled guests rank them twice, eight narrowed to four, and four to one. The one chosen wins great renown and the honor of 'Renowned Scholar'."
 qingyi_option_tea:0 "Refreshments"
 qingyi_option_tea_desc:0 "Fragrant tea steam soothes the spirit for long sitting. With fine refreshments, guests think a little better of the host as soon as they are seated, and renowned scholars and the studious are more willing to open their scrolls and talk at length."
 qingyi_option_topic_depth:0 "Depth of Topics"
 qingyi_option_topic_depth_desc:0 "Decide how deep the discussion of metaphysics, the classics, and governance will go. The deeper the topics, the more they invite requests for instruction and sharp exchanges, and the better one can sway opinion when championing someone in the Monthly Commentary."
 qingyi_option_wine:0 "Fine Wine"
 qingyi_option_wine_desc:0 "Decide whether wine will enliven the gathering. With wine, guests are more eager to attend and those seeking solace in conversation can better unburden their hearts, though once deep in their cups, someone may well grow unrestrained and forget propriety."
 qingyi_phase_conclusion:0 "Final Appraisal"
 qingyi_phase_conclusion_desc:0 "Draw together the many voices, settle the appraisals of the day, and leave a final mark on the gathering."
 qingyi_phase_lunshi:0 "Discussing Current Affairs"
 qingyi_phase_lunshi_desc:0 "Host and guests take their seats and first discuss the state of the realm and the classics. If a Monthly Commentary is held, the host nominates eight figures at this time."
 qingyi_phase_pinren:0 "Appraising Men"
 qingyi_phase_pinren_desc:0 "Appraise the figures of the age one by one. If a Monthly Commentary is held, only four of the eight remain after this round."
 qingyi_phase_dingping:0 "Final Verdict"
 qingyi_phase_dingping_desc:0 "The four receive their final appraisal, and one is named foremost."
 qingyi_relief_intent:0 "Converse to Ease Worries"
 qingyi_relief_intent_desc:0 "You hope to step away from paperwork and strife for a while, and through abstruse talk, tea and wine, and the company of kindred spirits, relieve the [stress|E] pent up in your heart."
 qingyi_tea_refined:0 "Fine Refreshments"
 qingyi_tea_refined_desc:0 "Choose good water to brew tea and prepare dainties with care, so renowned scholars and the studious will be more willing to open their scrolls and talk at length."
 qingyi_tea_simple:0 "Simple Refreshments"
 qingyi_tea_simple_desc:0 "A few plates of sweets and a cup of clear tea, so host and guests are not distracted by appetite."
 qingyi_topic_deep:0 "Profound Topics"
 qingyi_topic_deep_desc:0 "Go straight into the depths of metaphysics, such as being and nothingness, or the teaching of names and nature, inviting more requests for instruction and sharp exchanges."
 qingyi_topic_plain:0 "Plain Topics"
 qingyi_topic_plain_desc:0 "Begin from familiar people and everyday principles, better for making friends and with fewer bruising disputes."
 qingyi_wine_generous:0 "Wine Aplenty"
 qingyi_wine_generous_desc:0 "Lay in plenty of fine wine and let guests wave their whisks and speak freely; unrestrained and improper behavior becomes more likely."
 qingyi_wine_none:0 "Tea Instead of Wine"
 qingyi_wine_none_desc:0 "No wine cups are set out; tea clears the mind, and conversation is more restrained."
 WJ_qingyi_all_attending_guests:0 "All attending guests"
 WJ_qingyi_guest_reward_log:0 "The guests attended from beginning to end, and each gained something from the talk and company"
 WJ_qingyi_guest_reward_log_title:0 "Guests Return Well Rewarded"
 WJ_qingyi_host_reward_log:0 "[CHARACTER.Custom('WJ_GetUIName')] hosted the Pure Criticism to its close; the worthies praised it, and both fame and repute grew"
 WJ_qingyi_host_reward_log_title:0 "The Host Draws the Talk to a Close"
 WJ_qingyi_opening_log:0 "[CHARACTER.Custom('WJ_GetUIName')] straightened their robes, took their seat, and raised the whisk to speak; today's Pure Criticism begins"
 WJ_qingyi_opening_log_title:0 "The Gathering Opens"
 WJ_yinshi_friend_good_opinion:0 "Friends in Seclusion"
 WJ_yinshi_friend_bad_opinion:0 "Discord in Seclusion"
 WJ_yangwang.canglang:0 "Free Sojourner of Canglang"
 WJ_yangwang.custom:0 "Better to choose a name myself."
 WJ_yangwang.custom.desc:0 "You push aside the ready-made sets of names and resolve to write one yourself. This name will accompany you in solitude and in company from now on; there is no need to strive for novelty, only that when you sign it in years to come, it will not feel strange to you.\n\nIf nothing suitable comes to mind, there is no harm in setting down the brush."
 WJ_yangwang.dongshan:0 "Hermit of Dongshan"
 WJ_yangwang.keep:0 "Keep my old name."
 WJ_yangwang.naming.desc:0 "One who lives and reads in the mountains ought to have an elegant sobriquet. How others will judge you is hard to foresee, but at least this name should say how you wish to live now; if you have not yet withdrawn from the world, the day the name is settled will be the day you take leave of worldly affairs and close your gate to cultivate your repute.\n\nYou might draw on mountain dwellings, forests and springs, or the aspirations of water and moon, or devise something of your own; if you already have a name, signing with it is fine too. If nothing suitable comes to mind, you may set down the brush for now."
 WJ_yangwang.naming.title:0 "A Name in the Mountains"
