l_english:
 WJ_chijie:0 "Staff of Authority"
 WJ_chijie_desc:0 "#emphasis Privileges:#!\n$EFFECT_LIST_BULLET$In peace and war alike, may command officials of duke rank and below within the command\n$EFFECT_LIST_BULLET$May summon reinforcements within the command; those ordered must march on time\n$EFFECT_LIST_BULLET$May hand violators of military law to the Commandant of Justice for detention\n$EFFECT_LIST_BULLET$May transfer the command's title troops and reorganize private troops$WJ_mt_jie_transfer_rules$\n\n#flavor One Staff of Authority may command the generals in peace and war alike; his authority surpasses that of one Provisional Staff of Authority.#!"
 WJ_chijie_short:0 "Staff of Authority"
 WJ_huangyue_grant:0 "Grant the Delegated Yellow Axe"
 WJ_huangyue_grant_desc:0 "#emphasis Privileges:#!\n$EFFECT_LIST_BULLET$In peacetime, may enforce military law upon all civil and military officials of kingdom rank and below throughout the court\n$EFFECT_LIST_BULLET$In wartime, this extends to all vassals and courtiers of the dynasty, save only the Son of Heaven and the Regent themselves\n$EFFECT_LIST_BULLET$May convict and detain directly, or even behead without imprisonment as a sacrifice to the banner\n$EFFECT_LIST_BULLET$Granted and revoked together with the post of Area Commander of Inner and Outer Armies; withdrawn upon loss of the regency\n\n#flavor The Yellow Axe is the axe of the Son of Heaven. To lend it to a subject is to permit him to enforce military law and mete out executions in the Son of Heaven's stead.#!"
 WJ_huangyue_grant_short:0 "Delegated Yellow Axe"
 WJ_huangyue_none:0 "No Yellow Axe"
 WJ_huangyue_none_desc:0 "#flavor Not granted the Yellow Axe. This authority must be granted together with an edict to command all inner and outer armies, and cannot be enabled through a separate contract change.#!"
 WJ_huangyue_none_short:0 "Not Granted"
 WJ_jiajie:0 "Provisional Staff of Authority"
 WJ_jiajie_desc:0 "#emphasis Privileges:#!\n$EFFECT_LIST_BULLET$In wartime, may command officials of duke rank and below within the command\n$EFFECT_LIST_BULLET$May summon reinforcements within the command\n$EFFECT_LIST_BULLET$May hand violators of military law to the Commandant of Justice for detention\n$EFFECT_LIST_BULLET$May transfer the command's title troops and reorganize private troops$WJ_mt_jie_transfer_rules$\n\n#flavor One Provisional Staff of Authority may command the generals only within the army and only in time of war.#!"
 WJ_jiajie_short:0 "Provisional Staff of Authority"
 WJ_kaifu_grant:0 "Grant Right to Open Headquarters"
 WJ_kaifu_grant_desc:0 "#emphasis Privileges:#!\n$EFFECT_LIST_BULLET$May open a headquarters, appoint staff, and summon scholars to serve\n$EFFECT_LIST_BULLET$Even after leaving a ministerial office, this special grant remains as long as they are still eligible\n\n#flavor One who opens a headquarters may appoint his own chief clerks and staff, as if a little court within the court.#!"
 WJ_kaifu_grant_short:0 "Open Headquarters"
 WJ_kaifu_none:0 "No Special Headquarters Grant"
 WJ_kaifu_none_desc:0 "#flavor Not specially granted the right to open a headquarters. Holders of the six offices, such as the Three Excellencies and the General-in-Chief, may still do so by virtue of office.#!"
 WJ_kaifu_none_short:0 "Not Granted"
 WJ_kaifu_office:0 "Headquarters by Office"
 WJ_kaifu_office_grant:0 "Headquarters by the Six Offices"
 WJ_kaifu_office_grant_desc:0 "#flavor The General-in-Chief, Grand Tutor, Chancellor, Minister over the Masses, Minister of Works and Grand Commandant may open a headquarters while in office, and lose the right upon leaving it.#!"
 WJ_kaifu_office_grant_short:0 "Headquarters by Office"
 WJ_kaifu_office_none:0 "No Headquarters by Office"
 WJ_kaifu_office_none_desc:0 "#flavor Holding none of the six offices, they have no right to open a headquarters by virtue of office.#!"
 WJ_kaifu_office_none_short:0 "No Headquarters by Office"
 WJ_mt_jie_transfer_rules:0 "\n$EFFECT_LIST_BULLET$Troop transfers are limited to this command; those who refuse orders are judged under military law"
 WJ_privilege_kaifu_locked_tt:0 "Holders of the six offices open a headquarters by virtue of office, which cannot be changed; a separate special grant is retained"
 WJ_privilege_kaifu_rank_tt:0 "Must be a currently serving holder of one of this dynasty’s six great offices, or a general with a senior title entitled to establish a headquarters"
 WJ_privilege_sanjie_eligible_tt:0 "Must be a serving Area Commander. The Staff of Authority must first be granted when the Military District is established"
 WJ_privilege_six_offices_tt:0 "Only the General-in-Chief, Grand Tutor, Chancellor, Minister over the Masses, Minister of Works and Grand Commandant may be granted the Delegated Yellow Axe while in office"
 WJ_sanjie_none_desc:0 "#flavor Without appointment as Area Commander, there is no independent command authority. The Staff of Authority must first be granted when the Military District is established; its grade may be changed thereafter.#!"
 WJ_shichijie:0 "Full Staff of Authority"
 WJ_shichijie_desc:0 "#emphasis Privileges:#!\n$EFFECT_LIST_BULLET$In peace and war alike, may direct officials of kingdom rank and below within the command\n$EFFECT_LIST_BULLET$May transfer the command's title troops and reorganize private troops$WJ_mt_jie_transfer_rules$\n$EFFECT_LIST_BULLET$In wartime, may convict directly, but this incurs [tyranny|E] and [dread|E]\n$EFFECT_LIST_BULLET$The guilty may be handed to the Commandant of Justice, imprisoned personally, or beheaded on the spot as a sacrifice to the banner to rouse the army\n$EFFECT_LIST_BULLET$Military crimes so judged do not lapse after the war\n\n#flavor One who is Full Staff of Authority holds staff and axe in hand; any in the army who defy orders may be executed first and reported after.#!"
 WJ_shichijie_short:0 "Full Staff of Authority"
 WJ_province_type_closed_hanjin_tt:0 "The Han system has no directorates, metropolises or protectorates; only commanderies and counties, garrisons, and the Capital Region."
 WJ_zhoumu_none:0 "Remain Inspector"
 WJ_zhoumu_none_short:0 "Inspector"
 WJ_zhoumu_none_desc:0 "Following the old garrison appointment, they continue to govern the province as Inspector, without the Governor's increased stipend and troop quota."
 WJ_zhoumu_grant:0 "Promote to Governor"
 WJ_zhoumu_grant_short:0 "Governor"
 WJ_zhoumu_grant_desc:0 "#emphasis Privileges:#!\n$EFFECT_LIST_BULLET$Increases stipend and title troop quota\n$EFFECT_LIST_BULLET$The Son of Heaven is wary of their power\n$EFFECT_LIST_BULLET$Does not include the powers of an Area Commander, nor any staff, headquarters or military post\n$EFFECT_LIST_BULLET$If self-requested, requires using a [hook|E] on the Son of Heaven; not needed if granted by the Son of Heaven\n\n#flavor From Inspector to Governor: a richer stipend, more troops, and the Son of Heaven, seeing it all, can hardly help growing wary.#!"
 WJ_zhoumu_eligible_tt:0 "Must be a kingdom-level local garrison official of the Han-Jin Celestial Empire, not a court minister nor a Gentry Clan head, and not holding the de jure kingdom of the Emperor's capital"
 WJ_zhoumu_batch_tt:0 "Promotion must be handled by the Emperor of this dynasty, and the applicant must be eligible to be Governor; the same change cannot convert to a non-garrison contract"
 WJ_zhoumu_hook_tt:0 "Requesting to become Governor yourself requires using your [hook|E] on the Son of Heaven"
 WJ_zhoumu_imperial_distrust:0 "Governor's Excessive Power"
 WJ_zhoumu:0 "[wj_zhoumu|E]"
