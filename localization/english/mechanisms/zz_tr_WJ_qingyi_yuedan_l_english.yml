l_english:
 trait_hd_yuedan_mingshi:0 "Renowned Scholar"
 trait_hd_yuedan_mingshi_desc:0 "This character was once acclaimed first by the assembled worthies at the Monthly Commentary. Once so appraised, their worth rose tenfold, and scholars across the realm seek their acquaintance."
 WJ_qingyi_yd_class_1:0 "Heroic Lord"
 WJ_qingyi_yd_class_2:0 "Treacherous Hero"
 WJ_qingyi_yd_class_3:0 "Famed General"
 WJ_qingyi_yd_class_4:0 "Able Minister"
 WJ_qingyi_yd_class_5:0 "Strategist"
 WJ_qingyi_yd_class_6:0 "Eminent Confucian"
 WJ_qingyi_yd_comment_1_1:0 "Holds a region, yet ambitions reach beyond it. Magnanimous in bearing, able to embrace all beneath."
 WJ_qingyi_yd_comment_1_2:0 "Uses others' strengths and does not envy their abilities. If the realm is to find a master, it may be this one."
 WJ_qingyi_yd_comment_1_3:0 "Commands the four quarters; where orders issue, gentry and people follow. Alas, thinking on the great, the losses may lie in the small."
 WJ_qingyi_yd_comment_2_1:0 "An able minister in times of order, a treacherous hero in times of chaos."
 WJ_qingyi_yd_comment_2_2:0 "Endlessly resourceful, never showing joy or anger. Those who work alongside gain by it, but must beware the blade."
 WJ_qingyi_yd_comment_2_3:0 "Arms hidden in the breast, benevolence and righteousness on the lips. The heart is unfathomable, the talent impossible to hide."
 WJ_qingyi_yd_comment_3_1:0 "Decisive in battle; soldiers gladly die for this one. Among the Three Armies, wherever the banners point, there this one stands."
 WJ_qingyi_yd_comment_3_2:0 "Bravest of the age, a match for ten thousand. Guided by a wise master, the achievements would be beyond measure."
 WJ_qingyi_yd_comment_3_3:0 "Knows war yet is not warlike; skilled in battle yet keeps the army whole. The fine generals of old were no more than this."
 WJ_qingyi_yd_comment_4_1:0 "Upright and able in hard posts; wherever posted, granaries fill and lawsuits cease."
 WJ_qingyi_yd_comment_4_2:0 "Talent fit to aid a king. Given a commandery, it is well governed; given the Secretariat, it is made clean."
 WJ_qingyi_yd_comment_4_3:0 "Not known for fine prose, yet registers, coin, and grain are all in order. It is on such people that times of order depend."
 WJ_qingyi_yd_comment_5_1:0 "Deep in plans and far-sighted, with no stratagem overlooked. Speaks before events unfold, proven after they come to pass."
 WJ_qingyi_yd_comment_5_2:0 "Taciturn, but every word hits the mark. One to plan great affairs with, not to quarrel over trifles."
 WJ_qingyi_yd_comment_5_3:0 "Reads hearts well and excels at expedients. Used rightly, worth more than an army of a hundred thousand."
 WJ_qingyi_yd_comment_6_1:0 "Clear in the Classics and cultivated in conduct, revered throughout the land. Students come from a thousand li away to study at this door."
 WJ_qingyi_yd_comment_6_2:0 "Words of substance and conduct of constancy; this is just the person Pure Criticism esteems."
 WJ_qingyi_yd_comment_6_3:0 "Refined and correct in speech, measured in conduct. Fit to be a model for the scholars of the age."
 WJ_qingyi_yd_name_c1:0 "\n$BULLET_WITH_TAB$[wj_yd_c1.Custom('WJ_GetLinkedUIName')]（[wj_yd_c1.Custom('WJ_qingyi_yd_class')]）"
