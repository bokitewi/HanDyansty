 WJ_qingyi_yd_comment_c7:0 "\n$BULLET_WITH_TAB$[wj_yd_c7.Custom('WJ_GetLinkedUIName')]（[wj_yd_c7.Custom('WJ_qingyi_yd_class')]）：#italic [wj_yd_c7.Custom('WJ_qingyi_yd_comment')]#!"
 WJ_qingyi_yd_comment_c8:0 "\n$BULLET_WITH_TAB$[wj_yd_c8.Custom('WJ_GetLinkedUIName')]（[wj_yd_c8.Custom('WJ_qingyi_yd_class')]）：#italic [wj_yd_c8.Custom('WJ_qingyi_yd_comment')]#!"
 WJ_qingyi.3001.t:0 "Monthly Commentary: Current Affairs"
 WJ_qingyi.3001.desc.host:0 "The company discusses the state of the times, from bandits in the provinces to appointments at court, and the talk gradually turns to people. You set down your whisk and tell those present: today will be more than pure talk. Following the precedent of Runan, we will appraise the figures of the age and acclaim one as first.\n\nYou announce the list you have drawn up and ask everyone to weigh them carefully in the discussions to come:"
 WJ_qingyi.3001.desc.guest:0 "The company discusses the state of the times, when the host, [host.Custom('WJ_GetLinkedUIName')], suddenly sets down the whisk and announces that, following the precedent of Runan, today the figures of the age will be appraised and those present will acclaim one as first.\n\nA hush falls, then a buzz of talk. The host reads out the list:"
 WJ_qingyi.3001.desc.end:0 "\n\nWhen the list is read, some nod and some sneer. Over the next few days, the origins, deeds, and failings of those named will be discussed again and again."
 WJ_qingyi.3001.a:0 "Let us hear how you all appraise them."
 WJ_qingyi.3101.t:0 "Monthly Commentary: The Vote"
 WJ_qingyi.3101.desc:0 "There has been enough discussion; it is time to declare where one stands. Attendants set bamboo slips before each seat and ask every guest to write the name of the one they recommend.\n\nThis vote may not decide the matter, but the name written will be remembered."
 WJ_qingyi.3101.c1:0 "Recommend [wj_yd_c1.Custom('WJ_GetUIName')]"
 WJ_qingyi.3101.c2:0 "Recommend [wj_yd_c2.Custom('WJ_GetUIName')]"
 WJ_qingyi.3101.c3:0 "Recommend [wj_yd_c3.Custom('WJ_GetUIName')]"
 WJ_qingyi.3101.c4:0 "Recommend [wj_yd_c4.Custom('WJ_GetUIName')]"
 WJ_qingyi.3101.c5:0 "Recommend [wj_yd_c5.Custom('WJ_GetUIName')]"
 WJ_qingyi.3101.c6:0 "Recommend [wj_yd_c6.Custom('WJ_GetUIName')]"
 WJ_qingyi.3101.c7:0 "Recommend [wj_yd_c7.Custom('WJ_GetUIName')]"
 WJ_qingyi.3101.c8:0 "Recommend [wj_yd_c8.Custom('WJ_GetUIName')]"
 WJ_qingyi.3101.vote_tt:0 "You write this person's name on the slip, and may yet go about canvassing on their behalf."
 WJ_qingyi.3101.abstain:0 "Write by my usual likes and dislikes."
 WJ_qingyi.3101.abstain_tt:0 "You think no more of it, and when the time comes will write a name according to your usual likes, dislikes, and friendships."
 WJ_qingyi.3102.t:0 "Monthly Commentary: Canvassing"
 WJ_qingyi.3102.desc:0 "The slips have been handed in and will be counted when this round of discussion ends. Whether [wj_yd_target.Custom('WJ_GetLinkedUIName')], whom you recommended, prevails may depend on what you do next."
 WJ_qingyi.3102.a:0 "Vouch for them with my own good name."
 WJ_qingyi.3102.b:0 "Make the rounds of the powerful to lobby for them."
 WJ_qingyi.3102.c:0 "Debate on the spot to champion them."
 WJ_qingyi.3102.c.success:0 "Your eloquence moves the whole gathering"
 WJ_qingyi.3102.c.failure:0 "Too many words bring slips and rebuttals"
 WJ_qingyi.3102.d:0 "No need to say more."
 WJ_qingyi.3102.plus2_tt:0 "#P Many at the gathering switch to recommending [wj_yd_target.Custom('WJ_GetUIName')]#!"
 WJ_qingyi.3102.plus3_tt:0 "#P The whole gathering is moved, and many switch to recommending [wj_yd_target.Custom('WJ_GetUIName')]#!"
 WJ_qingyi.3102.minus1_tt:0 "#N Some are now unwilling to recommend [wj_yd_target.Custom('WJ_GetUIName')]#!"
 WJ_qingyi.3201.t:0 "Monthly Commentary: Appraising Figures"
 WJ_qingyi.3201.desc:0 "These past days the talk has centered on the names on the list. Some cite their past deeds, others their recent doings; amid praise and censure, each one's appraisal gradually takes shape:"
 WJ_qingyi.3201.desc.end:0 "\n\nAs agreed beforehand, when this round ends each will cast a vote, and the four with the most votes will advance to the final appraisal."
 WJ_qingyi.3201.a:0 "I already have someone in mind."
 WJ_qingyi.3301.t:0 "Monthly Commentary: Final Verdict"
 WJ_qingyi.3301.desc:0 "Only four names remain. The mood is tenser than in days past; all know that after the next count, the title of first will spread throughout the provinces. The final appraisals are as follows:"
 WJ_qingyi.3301.desc.end:0 "\n\nThis time only one may be recommended."
 WJ_qingyi.3301.a:0 "Set down the final verdict."
 WJ_qingyi.3401.t:0 "Monthly Commentary: The Verdict"
 WJ_qingyi.3401.desc:0 "The slips are counted, and the company acclaims [wj_yd_winner.Custom('WJ_GetLinkedUIName')] first of this Monthly Commentary. The appraisal is read aloud:\n\n'[wj_yd_winner.Custom('WJ_qingyi_yd_comment')]'\n\nThis verdict will soon be copied and spread. Henceforth, whenever the provinces discuss the figures of the age, this name will be the first mentioned."
 WJ_qingyi.3401.desc.self:0 "The slips are counted, and the one acclaimed first is, astonishingly, you. The appraisal is read aloud:\n\n'[wj_yd_winner.Custom('WJ_qingyi_yd_comment')]'\n\nEvery eye in the room turns to you. From now on, this verdict will follow your name across the realm."
 WJ_qingyi.3401.a:0 "How could I not strive to live up to it?"
 WJ_qingyi.3401.b:0 "No empty name, this."
 WJ_qingyi.3501.t:0 "News of the Monthly Commentary"
 WJ_qingyi.3501.desc.winner:0 "A visitor arrives from [host.Custom('WJ_GetLinkedUIName')]'s household with news of a recent Monthly Commentary there: the assembled worthies appraised the figures of the age and in the end acclaimed you as first.\n\n'[wj_yd_winner.Custom('WJ_qingyi_yd_comment')]'\n\nThe verdict is said to have spread already. You were not even present, yet your fame has arrived ahead of you."
 WJ_qingyi.3501.desc.finalist:0 "A visitor arrives from [host.Custom('WJ_GetLinkedUIName')]'s household with news of a recent Monthly Commentary there: you were among the four in the final appraisal, though first place went to [wj_yd_winner.Custom('WJ_GetLinkedUIName')].\n\nEven without first place, reaching the final round counts as a measure of renown in the eyes of the realm's scholars."
 WJ_qingyi.3501.a:0 "Write to the host with humble thanks."
 WJ_qingyi.3501.b:0 "Accept it calmly."
 WJ_qingyi_yd_log_nominate:0 "[CHARACTER.Custom('WJ_GetUIName')] followed the precedent of Runan, nominated eight figures of the age, and opened the Monthly Commentary"
 WJ_qingyi_yd_log_nominate_title:0 "The Commentary Opens"
 WJ_qingyi_yd_log_round_two:0 "The appraisals concluded; four of the eight advance to the final round"
 WJ_qingyi_yd_log_round_two_title:0 "Eight Become Four"
 WJ_qingyi_yd_log_winner:0 "The worthies acclaimed [CHARACTER.Custom('WJ_GetUIName')] first of the Monthly Commentary, with [TARGET_CHARACTER.Custom('WJ_GetUIName')] personally pronouncing the verdict"
 WJ_qingyi_yd_log_winner_title:0 "The Verdict"
 WJ_qingyi_yd_log_finalists:0 "Those passed over in the final round still gained renown for making it that far"
 WJ_qingyi_yd_log_finalists_title:0 "The Finalists"
 WJ_qingyi_yd_all_finalists:0 "All finalists not chosen"
 WJ_qingyi_yd_msg_title:0 "Monthly Commentary Concluded"
 WJ_qingyi_yd_msg_desc:0 "[host.Custom('WJ_GetUIName')] hosted a Monthly Commentary, and the worthies acclaimed [wj_yd_winner.Custom('WJ_GetUIName')] first of the age"
 WJ_qingyi_all_honest_attendees:0 "All honest guests in attendance"
 WJ_qingyi.1009.t:0 "The Partisan Prohibitions"
 WJ_qingyi.1009.desc:0 "In the heat of discussion, [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')] suddenly raises the Partisan Prohibitions: how Li Ying, Fan Pang, and others were condemned for their Pure Criticism, barred from office for life, and some even died in prison.\n\nThe room falls silent at once. The matter remains taboo to this day, and everyone waits for you to take a stance. Speak too bluntly and it may reach the wrong ears; speak too vaguely and you will be thought little of."
 WJ_qingyi.1009.a:0 "Openly declare their innocence, heedless of taboo."
 WJ_qingyi.1009.a.success:0 "Your impassioned words awe the room"
 WJ_qingyi.1009.a.failure:0 "Your fervor leaves you shaken"
 WJ_qingyi.1009.b:0 "Use the past to allude to the present, and stop there."
 WJ_qingyi.1009.b.success:0 "You turn the talk without a trace"
 WJ_qingyi.1009.b.failure:0 "Your evasion is seen through"
 WJ_qingyi.1009.c:0 "'This gathering does not discuss court affairs.'"
 WJ_qingyi_log_1009_a_success:0 "[CHARACTER.Custom('WJ_GetUIName')] spoke openly of the injustice of the Partisan Prohibitions, earning [TARGET_CHARACTER.Custom('WJ_GetUIName')]'s admiration"
 WJ_qingyi_log_1009_a_failure:0 "[CHARACTER.Custom('WJ_GetUIName')] spoke too fervently of the Partisan Prohibitions and was uneasy afterward"
 WJ_qingyi_log_1009_b_success:0 "[CHARACTER.Custom('WJ_GetUIName')] used the past to allude to the present, deftly passing over the Partisan Prohibitions"
 WJ_qingyi_log_1009_b_failure:0 "[CHARACTER.Custom('WJ_GetUIName')] dodged the question of the Partisan Prohibitions and was thought less of by [TARGET_CHARACTER.Custom('WJ_GetUIName')]"
 WJ_qingyi_log_1009_c:0 "[CHARACTER.Custom('WJ_GetUIName')] declared that this gathering would not discuss court affairs"
 WJ_qingyi.1010.t:0 "Questions on the Classics"
 WJ_qingyi.1010.desc:0 "The young [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')] approaches your seat holding a scroll of the Classics, bows respectfully, and asks you to explain a passage.\n\nThis passage has long been disputed, and others have already gathered to listen. Explain it well and this youth will remember it for life; explain it poorly and you will not be the only one to lose face."
 WJ_qingyi.1010.a:0 "Explain it word by word."
 WJ_qingyi.1010.a.success:0 "A thorough analysis; the youth is won over"
 WJ_qingyi.1010.a.failure:0 "A misquoted source is pointed out"
 WJ_qingyi.1010.b:0 "Answer with questions, letting them see it for themselves."
 WJ_qingyi.1010.c:0 "Ask a renowned scholar present to explain it."
 WJ_qingyi_log_1010_a_success:0 "[CHARACTER.Custom('WJ_GetUIName')] expounded the Classics for [TARGET_CHARACTER.Custom('WJ_GetUIName')], who was greatly enlightened"
 WJ_qingyi_log_1010_a_failure:0 "[CHARACTER.Custom('WJ_GetUIName')] misquoted a source while expounding the Classics and was corrected on the spot"
 WJ_qingyi_log_1010_b:0 "[CHARACTER.Custom('WJ_GetUIName')] used questions to lead [TARGET_CHARACTER.Custom('WJ_GetUIName')] to grasp the Classics themselves"
 WJ_qingyi_log_1010_c:0 "[CHARACTER.Custom('WJ_GetUIName')] asked [TARGET_CHARACTER.Custom('WJ_GetUIName')] to explain the Classics, adding to that scholar's renown"
 WJ_qingyi.1011.t:0 "The Pure and the Turbid"
 WJ_qingyi.1011.desc:0 "[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')] slams the table and rises: the court today is a mix of pure and turbid, the sons of eunuchs hold the provinces and commanderies while the Pure Stream are shut out, so how can those present still talk only of abstruse principles?\n\nSeveral guests chime in agreement; others frown. The distinction of pure and turbid is a great principle among scholars, yet sorting all the world into two kinds is not necessarily fair."
 WJ_qingyi.1011.a:0 "Now is the time to purge the turbid and raise the pure."
 WJ_qingyi.1011.b:0 "Both camps have their good and bad; one cannot judge by faction."
 WJ_qingyi.1011.b.success:0 "Your fair stance wins praise"
 WJ_qingyi.1011.b.failure:0 "Denounced as a fence-sitter"
 WJ_qingyi.1011.c:0 "Laugh it off."
 WJ_qingyi_log_1011_a:0 "[CHARACTER.Custom('WJ_GetUIName')] called for purging the turbid and raising the pure, and the Pure Stream present wholly agreed"
 WJ_qingyi_log_1011_b_success:0 "[CHARACTER.Custom('WJ_GetUIName')] spoke evenhandedly on the pure and turbid; even [TARGET_CHARACTER.Custom('WJ_GetUIName')] could not refute it"
 WJ_qingyi_log_1011_b_failure:0 "[CHARACTER.Custom('WJ_GetUIName')] was denounced as a fence-sitter by [TARGET_CHARACTER.Custom('WJ_GetUIName')]"
 WJ_qingyi_log_1011_c:0 "[CHARACTER.Custom('WJ_GetUIName')] laughed off the dispute over the pure and turbid"
 WJ_qingyi.1012.t:0 "Songs and Pitch-Pot"
 WJ_qingyi.1012.desc:0 "After days of debate, everyone is somewhat weary. [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')] proposes setting out pitch-pot, and someone else fetches a qin.\n\nPure Criticism need not always be at swords' points, and the guests are watching how you, the host, take part."
 WJ_qingyi.1012.a:0 "Take up the arrows and throw yourself."
 WJ_qingyi.1012.a.success:0 "Several hits in a row; the room cheers"
 WJ_qingyi.1012.a.failure:0 "Miss after miss; the room roars with laughter"
 WJ_qingyi.1012.b:0 "Keep time and sing, sharing in the fun."
 WJ_qingyi.1012.c:0 "Sit quietly and watch."
 WJ_qingyi_log_1012_a_success:0 "[CHARACTER.Custom('WJ_GetUIName')] hit the pot again and again, outdoing [TARGET_CHARACTER.Custom('WJ_GetUIName')]"
 WJ_qingyi_log_1012_a_failure:0 "[CHARACTER.Custom('WJ_GetUIName')] kept missing the pot and shared a hearty laugh with [TARGET_CHARACTER.Custom('WJ_GetUIName')]"
 WJ_qingyi_log_1012_b:0 "[CHARACTER.Custom('WJ_GetUIName')] kept time and sang; host and guests enjoyed themselves fully"
 WJ_qingyi_log_1012_c:0 "[CHARACTER.Custom('WJ_GetUIName')] sat and watched quietly, keeping a host's decorum"
 WJ_qingyi.2009.t:0 "Seeking a Renowned Scholar"
 WJ_qingyi.2009.desc:0 "The most learned at the gathering is [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]. After each session a ring of people surrounds them, some seeking instruction, others merely hoping to be noticed.\n\nYou want to approach as well, but have not yet decided what posture to take."
 WJ_qingyi.2009.a:0 "Seek instruction as a disciple."
 WJ_qingyi.2009.a.success:0 "Their guidance brings sudden clarity"
 WJ_qingyi.2009.a.failure:0 "A shallow question earns only pleasantries"
 WJ_qingyi.2009.b:0 "Challenge them with your own views."
 WJ_qingyi.2009.b.success:0 "After several exchanges, they regard you anew"
 WJ_qingyi.2009.b.failure:0 "Out-argued, you become a laughingstock"
 WJ_qingyi.2009.c:0 "Listening from afar is enough."
 WJ_qingyi_log_2009_a_success:0 "[CHARACTER.Custom('WJ_GetUIName')] sought instruction on the Classics from [TARGET_CHARACTER.Custom('WJ_GetUIName')] and gained much"
 WJ_qingyi_log_2009_a_failure:0 "[CHARACTER.Custom('WJ_GetUIName')] sought out a renowned scholar but gained little"
 WJ_qingyi_log_2009_b_success:0 "[CHARACTER.Custom('WJ_GetUIName')] debated back and forth with [TARGET_CHARACTER.Custom('WJ_GetUIName')] without giving ground"
 WJ_qingyi_log_2009_b_failure:0 "[CHARACTER.Custom('WJ_GetUIName')] lost a debate to [TARGET_CHARACTER.Custom('WJ_GetUIName')]"
 WJ_qingyi.2010.t:0 "Night Talk"
 WJ_qingyi.2010.desc:0 "The night is late; most guests have retired, and only you and [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')] remain beneath the eaves. The moonlight is lovely, and the day's arguments now seem far away.\n\nYour companion pours two cups of tea and asks how you have been of late."
 WJ_qingyi.2010.a:0 "Pour out your heart."
 WJ_qingyi.2010.b:0 "Talk only of abstruse principles, nothing personal."
 WJ_qingyi.2010.c:0 "Make an excuse and retire first."
 WJ_qingyi_log_2010_a:0 "[CHARACTER.Custom('WJ_GetUIName')] talked into the night under the moon with [TARGET_CHARACTER.Custom('WJ_GetUIName')], pouring out their heart"
 WJ_qingyi_log_2010_b:0 "[CHARACTER.Custom('WJ_GetUIName')] spoke of abstruse principles into the night and grew calmer"
 WJ_qingyi.2011.t:0 "Judging Contemporaries"
 WJ_qingyi.2011.desc:0 "The host, [host.Custom('WJ_GetLinkedUIName')], suddenly turns to you and asks your opinion of [wj_qingyi_subject.Custom('WJ_GetLinkedUIName')].\n\nThe room quiets. Appraising people is common fare for Pure Criticism, but this person is under the host's rule after all, and your words will sooner or later reach their ears."
 WJ_qingyi.2011.a:0 "State their faults plainly."
 WJ_qingyi.2011.b:0 "Praise their strengths."
 WJ_qingyi.2011.c:0 "Say nothing."
 WJ_qingyi.2011.c.success:0 "Your silence speaks; all understand"
 WJ_qingyi.2011.c.failure:0 "Silent too long, you seem timid"
