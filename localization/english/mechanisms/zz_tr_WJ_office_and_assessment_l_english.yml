l_english:
 WJ_ai_bizhao_letter:0 "I have long heard of your talent and insight, and a post on my staff now stands vacant; I would ask you to join my headquarters and serve alongside me. Of late the documents pile high, and my clerks each have their strengths, yet I lack someone with whom I can deliberate at ease; whenever a hard matter arises, I think of you.\n\nI dare not invite you with a few words of flattery alone; the proposed duties and recompense are attached at the end of this letter. If you would condescend to accept, please take up the post as agreed, and should you have objections, I hope you will tell me to my face.\n\nWhat this letter seeks is a colleague to share the burden of affairs, not a guest who nods approval at the table. Whether you come or not, I hope to hear your answer from you directly; the seat in my headquarters awaits you."
 WJ_ai_bizhao_role_1:0 "\nProposed staff post: [actor.Custom('WJ_mufu_role_1')]."
 WJ_ai_bizhao_role_2:0 "\nProposed staff post: [actor.Custom('WJ_mufu_role_2')]."
 WJ_ai_bizhao_role_3:0 "\nProposed staff post: [actor.Custom('WJ_mufu_role_3')]."
 WJ_ai_bizhao_role_4:0 "\nProposed staff post: [actor.Custom('WJ_mufu_role_4')]."
 WJ_ai_bizhao_role_5:0 "\nProposed staff post: [actor.Custom('WJ_mufu_role_5')]."
 WJ_ai_bizhao_strong_hook:0 "\nOnly, once you enter my headquarters, you are one of its own; I hope that henceforth you will keep its interests foremost in your conduct."
 WJ_ai_kaoke_accept:0 "Accept the gold and add to his marks."
 WJ_ai_kaoke_award:0 "Commend an Official"
 WJ_ai_kaoke_award_desc:0 "Commend a close official's achievements this term and record a merit in his evaluation."
 WJ_ai_kaoke_awarded:0 "[actor.Custom('WJ_GetLinkedUIName')] recorded a commendation for you in the evaluation register"
 WJ_ai_kaoke_desc:0 "[actor.Custom('WJ_GetLinkedUIName')] spoke at first only of the hardships of office, and only after a long detour pushed three hundred gold toward you. 'I hope you will look after my grade this term.'\n\nYou did not reach for it, but first glanced at the evaluation register. All that is asked is a few more marks, a few strokes of the brush, and others will hardly be able to tell which came from merit and which from this generous gift. Seeing you silent, the visitor lowered his voice further.\n\nFootsteps seemed to pass outside the door, and the hand offering the gift froze at once. You look at the gold, then at the register. To accept or refuse takes only a word; but if someone digs up the old accounts one day, it may not be so easy."
 WJ_ai_kaoke_just_tt:0 "A just official will not show favoritism by approving this request for marks."
 WJ_ai_kaoke_last_superior_summary:0 "\nSuperior's approval last term: [ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_last_superior_value')|=+0] points."
 WJ_ai_kaoke_personality:0 "Approver's personality: $VALUE|=+0$"
 WJ_ai_kaoke_superior_summary:0 "\nSuperior's approval: [ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_superior_value')|=+0] points."
 WJ_ai_kaoke_title:0 "A Private Petition"
 WJ_ai_maocai_letter:0 "I respectfully write to request recommendation as Flourishing Talent. In our usual discussions I have often regretted that my views remained at the table; now I wish to be counted among those eligible for office and try my learning in real affairs of state, so I dare not hide my purpose behind ordinary greetings.\n\nMy abilities must still be examined by you, sir, and I dare not claim there is nothing I cannot do. Yet if I am never given a chance to try, my successes and failures will never be known.\n\nThe proposed recompense is attached at the end of this letter for your consideration. If recommended, I shall do my utmost in office; if not, please tell me plainly. The road of the world is not easy, and in writing this request today, I am no longer willing to wait for others to remember me by chance."
 WJ_ai_offer_gold:0 "\nA list of gifts is also attached to this letter, as a small token of my sincerity."
 WJ_ai_offer_hook:0 "\nIf you grant this, I shall remember the kindness, and should you ever ask anything of me, I would not dare refuse."
 WJ_ai_xiaolian_letter:0 "I respectfully write to seek recommendation as Filial and Incorrupt. This could have been put forward tactfully through another, but after much thought I still wished to write it myself: I hope that what I have upheld and studied may open a road into office.\n\nI dare not say the judgments of my home district are all praise; if there are doubts, I am willing to be questioned. Only, I have waited long without a door, and though I have the will to serve, I cannot advance on my own; so I presume to write and ask for your consideration.\n\nThe proposed recompense is attached below for your judgment as well. If recommended, I shall remember your recognition; if not at this time, please send word, so that I need not wait day after day without knowing whether to advance or withdraw."
 WJ_appointment_timeout_desc_provisional:0 "Awaiting evaluation or serving on probation; not accepting other appointments for now"
 WJ_maocai_civic_appointment_score_bonus_desc:0 "Recommended as Flourishing Talent"
 WJ_no_entry_road_appointment_score_penalty_desc:0 "No formal path into office"
 WJ_bizhao_recruit_desc:0 "Invite [recipient.Custom('WJ_GetLinkedUIName')] to join your headquarters and fill the chosen vacant staff post."
 WJ_kaoke_active_disfavor_opinion:0 "Suppressed in Evaluation"
 WJ_kaoke_active_favor_opinion:0 "Favored in Evaluation"
 WJ_kaoke_trial_notice_maocai:0 "The result of your probation has come down: rated Excellent, recommended as Flourishing Talent. You read the document twice before it truly sank in that your untested standing has at last been resolved.\n\nFrom now on you must still answer for your own merits and faults in office, and cannot think yourself all-knowing on the strength of a single credential. But the work of these years was not in vain, and this recognition lets you face those who come asking about affairs of state with greater ease. You put the document away and return to your desk to handle what must be done."
 WJ_kaoke_trial_notice_title:0 "Probation Assessed"
 WJ_kaoke_trial_notice_xiaolian:0 "Your probation is rated Good, and you are recommended as Filial and Incorrupt. The messenger finishes reading and waits beside you for a reply, but you first read the listed assessment again from the beginning.\n\nIt holds both praise and criticism. Having come this far on probation, you need no longer await the next test in the same standing; yet between formally entering office and handling every future matter well, much work still lies. You put the document away and let the messenger continue reporting on the business at hand."
 WJ_kaoke_case_arrest:0 "Arrest him according to the law and imprison him for trial."
 WJ_kaoke_case_desc:0 "The case of [wj_kaoke_offender.Custom('WJ_GetLinkedUIName')] tampering with evaluation records for personal gain has finally landed on your desk. The clerk points to several altered passages and reads them out; halfway through, you have him lay the page flat and examine it again yourself.\n\nThe evidence is conclusive, but how to deal with it rests entirely on your word: show leniency, imprison him for trial, or shelve the case for another day. Yet the altered judgments in the register and the money long since changed hands will not be restored by any single ruling."
 WJ_kaoke_case_dismiss:0 "Shelve the case; it can be discussed later."
 WJ_kaoke_case_forgive:0 "Pardon him for now, in light of his past service."
 WJ_kaoke_case_title:0 "The Evaluation Fraud Case"
