 WJ_kaoke_current_summary:0 "[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_days_value')|0] days of this term have passed, [ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_remaining_value')|0] remain. Public affairs: [ROOT.Char.MakeScope.Var('wj_kaoke_civil_count').GetValue|0] / [ROOT.Char.MakeScope.Var('wj_kaoke_civil_points').GetValue|0] points; battles: [ROOT.Char.MakeScope.Var('wj_kaoke_battles').GetValue|0], won [ROOT.Char.MakeScope.Var('wj_kaoke_wins').GetValue|0], lost [ROOT.Char.MakeScope.Var('wj_kaoke_losses').GetValue|0], raw martial merit [ROOT.Char.MakeScope.Var('wj_kaoke_military_points').GetValue|0], counted as [ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_military_value')|0] points; governance: [ROOT.Char.MakeScope.Var('wj_kaoke_choice_count').GetValue|0] cases / [ROOT.Char.MakeScope.Var('wj_kaoke_choice_points').GetValue|0] points. [ROOT.Char.Custom('WJKaokeCentral')]$WJ_ai_kaoke_superior_summary$\nThis term: [ROOT.Char.Custom('WJKaokeCurrentGrade')], total [ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_score_value')|0] (including base 50).\n"
 WJ_kaoke_cycle_rules:0 "Evaluations cover only regional officials of this court of kingdom tier and below; empire-tier, independent, and unlanded characters are excluded. Evaluations come every five years, and transfers within the same court do not break the term; if one loses eligibility or the dynasty changes, the old term is voided with no reward, and a new five-year term begins once eligibility is regained."
 WJ_kaoke_grade_none:0 "Not Evaluated"
 WJ_kaoke_last_summary:0 "Last term: [ROOT.Char.Custom('WJKaokeGrade')], total [ROOT.Char.MakeScope.Var('wj_kaoke_last_score').GetValue|0]. Public affairs: [ROOT.Char.MakeScope.Var('wj_kaoke_last_civil_count').GetValue|0] / [ROOT.Char.MakeScope.Var('wj_kaoke_last_civil_points').GetValue|0] points; battles: [ROOT.Char.MakeScope.Var('wj_kaoke_last_battles').GetValue|0], won [ROOT.Char.MakeScope.Var('wj_kaoke_last_wins').GetValue|0], lost [ROOT.Char.MakeScope.Var('wj_kaoke_last_losses').GetValue|0]; governance: [ROOT.Char.MakeScope.Var('wj_kaoke_last_choice_points').GetValue|0] points. [ROOT.Char.Custom('WJKaokeLastCentral')]$WJ_ai_kaoke_last_superior_summary$\nEvaluation reward: [ROOT.Char.Custom('WJKaokeReward')].\n"
 WJ_kaoke_legacy_history:0 "\nPast grades have been converted under the new rules; earlier rewards and penalties will not be revised."
 WJ_kaoke_no_history:0 "No complete five-year evaluation yet.\n"
 WJ_kaoke_open_book_tt:0 "Open the evaluation register to view this term's merits and faults."
 WJ_kaoke_poor_opinion:0 "Poor Evaluation, Mishandled Affairs"
 WJ_kaoke_resume_reward:0 "Collect the Most Recent Evaluation Reward"
 WJ_kaoke_reward_candidate_choice:0 "Record this achievement for future promotion."
 WJ_kaoke_reward_cha:0 "Your evaluation is graded Poor. The authorities fault you for lax governance, and your superior has complaints about you as well; for some years to come, your salary and Repute will suffer.\n"
 WJ_kaoke_reward_liang:0 "Your evaluation is graded Good; by custom you may request one evaluation reward from the authorities.\n"
 WJ_kaoke_reward_lie:0 "Your evaluation is graded Inferior. The authorities cut your salary and order you to reform your administration, and your superior is deeply displeased; for some years to come, both salary and Repute will be suppressed, and your career will hardly prosper.\n"
 WJ_kaoke_reward_merit_choice:0 "Request a commendation for good governance."
 WJ_kaoke_reward_ping:0 "Your evaluation is graded Average: no merit, no fault, no reward, no penalty.\n"
 WJ_kaoke_reward_treasury_choice:0 "Request funds for my seat of office."
 WJ_kaoke_reward_xp_choice:0 "I wish to study the governing methods of past worthies."
 WJ_kaoke_reward_you:0 "Your evaluation is graded Excellent; by custom you may request one evaluation reward from the authorities.\n"
 WJ_kaoke_rules_page:0 "What Counts as Merit, and What as Fault?"
 WJ_kaoke_scoring_rules:0 "Each evaluation starts from a base of fifty points, adding points from public affairs, martial merit, governance, and court adjustments; martial merit gains and losses are each capped at sixty points. One hundred or more is Excellent, eighty or more Good, fifty or more Average, thirty or more Poor, and below thirty Inferior.\nThose graded Good or Excellent may request one evaluation reward: recommendation to the authorities for promotion, a treasury allocation, a commendation for good governance, or study of governing methods; Excellent grants more. Those graded Poor or Inferior suffer reduced salary and Repute for five years and incur their superior's displeasure, doubled for Inferior; existing Repute is not deducted, and grades from past terms do not accumulate.\n"
 WJ_kaoke_settlement_end:0 "\nThe old register is sealed here, and a new term begins its record afresh. If graded Good or Excellent, you may request one evaluation reward; if undecided for now, you can still claim it later by opening the evaluation register, until the next evaluation passes."
 WJ_kaoke_settlement_intro:0 "The register of five years in office has been gathered together. The clerk checks the merits and faults item by item and presents this term's grade to you.\n\n"
 WJ_kaoke_task_rules:0 "Public affairs are recorded only when a local governance task is completed, one record per task, with construction projects not counted separately; merit or fault depends on the resolution chosen. Martial merit requires leading troops in person as commander or fighting as a knight: a victory records ten points of merit, a defeat ten points of fault. Governance is one case per year: diligence earns merit, compromise neither adds nor subtracts, and self-interest deducts points; tests of ability may succeed or fail.\n"
 WJ_kaoke_trial_continue:0 "Your probation fell short of Good; you must continue on probation until the next evaluation.\n"
 WJ_kaoke_trial_maocai:0 "Your probation was graded Excellent; you have been recommended as Flourishing Talent and formally enter office.\n"
 WJ_kaoke_trial_rules:0 "You are still on probation: a Good grade earns recommendation as Filial and Incorrupt, an Excellent grade as Flourishing Talent; below Good, you continue on probation and are evaluated again.\n"
 WJ_kaoke_trial_xiaolian:0 "Your probation was graded Good; you have been recommended as Filial and Incorrupt and formally enter office.\n"
