 WJ_kaoke_result_desc:0 "The clerk hands over the last page of the evaluation register; every change you made has been copied into it. You look it over and signal for it to be filed, yet before sealing it he checks the names once more.\n\nThe brush's changes leave their traces after all, and each official's evaluation reward must still wait until his own term is complete. As for whether anyone will one day ask where these judgments came from, no one mentions it now. With the documents taken away, the desk suddenly seems much emptier. For some years to come, it will not be fitting for you to touch this register again."
 WJ_kaoke_result_emperor_desc:0 "The last evaluation register has been gathered in. The clerk reads out the changes person by person, and at one name he pauses to look at you, as if seeking one more firm word from your face.\n\nYou have him file it according to the settled record, with no further questions. Those far away in the provinces and counties have not yet heard, but their future grades now bear this stroke made before the throne today. Formal evaluation rewards still await the end of each official's term. For some years to come, it will not be fitting for you to oversee the register in person."
 WJ_kaoke_result_title:0 "The Register Is Filed"
 WJ_kaoke_result_ack:0 "Seal the register and file it."
 wj_kaoke_duties.invalid:0 "This document is no longer my charge; return it to the archives."
 wj_kaoke_duties.invalid.tt:0 "The document is no longer within your purview and can only be returned to the archives."
 WJ_kaoke_acknowledge:0 "Receive the grade and note the gains and losses."
