 WJ_luyi_plain_jiali:0 "Probationary"
 WJ_luyi_plain_kingdom:0 "Full 2,000 Shi"
 WJ_luyi_plain_shizu:0 "Gentry"
 WJ_LUZHI_DESC_CHU_NO_ROAD:0 "You hold no office, nor any credential from summons, Filial and Incorrupt, or Flourishing Talent, and so you are a [wj_chushi|E]. Repute can only raise the ceiling of offices you may later hold; you must first obtain a path into office and then be appointed before you have any [wj_luyi|E] to speak of."
 WJ_LUZHI_DESC_CHU_WITH_ROAD:0 "Though you already have a path into office, you currently hold no post, and so remain a [wj_chushi|E] in court and countryside. The Repute appointment ceiling listed below is only the highest range you may be appointed to; you must be appointed before your [wj_luyi|E] is set by your office."
 WJ_LUZHI_DESC_OFFICIAL:0 "You are currently [Character.Custom('WJ_BandWord')], the [wj_luyi|E] set by the highest office you hold. Your path into office decides whether you are among the candidates for appointment, and Repute decides the highest range you may be appointed to; neither can bypass your office to change your salary rank."
 WJ_LUZHI_DESC_SHI_NO_ROAD:0 "You currently hold no office, nor yet any credential from summons, Filial and Incorrupt, or Flourishing Talent; as unlanded gentry, you are shown as [wj_shizu|E], but the gentry name is neither an office nor a salary rank. You must first obtain a path into office and then be appointed before your [wj_luyi|E] is set by your office."
 WJ_LUZHI_DESC_SHI_WITH_ROAD:0 "Though you already have a path into office, you currently hold no post; as unlanded gentry, you are shown as [wj_shizu|E]. The Repute appointment ceiling listed below is only the highest range you may be appointed to; you must be appointed before your [wj_luyi|E] is set by your office."
 WJ_LUZHI_DESC_SHOU:0 "You hold an office but have no credential from summons, Filial and Incorrupt, or Flourishing Talent, so you can only serve provisionally as [wj_shishou|E], without the [wj_luyi|E] appropriate to the post. Your Repute appointment ceiling is not your current salary rank. For regional officials, probation is resolved through the five-year evaluation: Good earns a Filial and Incorrupt recommendation, Excellent earns a Flourishing Talent recommendation, Average extends probation, and Poor or Inferior removes them from office. Probationary officials outside the regional evaluation system instead sit three rounds of examinations over one year. A score of forty passes; failure extends probation. After gaining regular status, their salary rank is formally set by the office they hold."
 WJ_road_heading_hanjin:0 "Path into Office"
 WJ_tooltip_explain_hanjin:0 "[wj_luyi|E] is the rank of the office one holds, while [wj_mingwang|E] is one's reputation among the scholars; the two must not be confused."
