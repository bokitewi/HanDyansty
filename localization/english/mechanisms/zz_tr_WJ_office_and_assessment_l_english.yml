 activity_qingyi_conclusion_desc_lundao_loser:0 "The debate went poorly, but some grasp the Way sooner than others; we shall meet again."
 activity_qingyi_conclusion_desc_lundao_winner:0 "Debating the Way and governance, you won over every guest, and your virtue and renown rose higher still."
 activity_qingyi_conclusion_desc_tanxuan_loser:0 "The mysterious principles remained unclear and you conceded defeat; still, this Pure Criticism gathering taught you much."
 activity_qingyi_conclusion_desc_tanxuan_winner:0 "A discourse on the Mysteries revealed every subtle principle, outshone all the worthies, and spread your fame for Pure Conversation far and wide."
 activity_wj_langguan_xuncha:0 "Gentleman's Tour of Inspection"
 activity_wj_langguan_xuncha_desc:0 "As a Court Gentleman, tour your lord's domain: inspect its counties, judge cases and hear lawsuits, ask after the people's hardships, and build up achievements and Repute."
 activity_wj_langguan_xuncha_guest_desc:0 "Accompany the Court Gentleman on tour, observing governance and local customs."
 activity_wj_langguan_xuncha_host_desc:0 "Tour your lord's domain, gaining experience in affairs and earning a reputation for governance."
 activity_wj_langguan_xuncha_plural:0 "Gentleman's Tours of Inspection"
