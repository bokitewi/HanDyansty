 ZongWang_ShiHao.020.event_title:0 "Posthumous Name for the Crown Prince"
 ZongWang_ShiHao.020.event_desc:0 "The rites deliberation for the late Crown Prince is laid before you, and the officials ask that his posthumous name be fixed. Hearing the words 'Eastern Palace', you think first of the many things still left undone; only after a moment do you turn to the candidate names.\n\nHe is gone, yet the ritual officials must still proceed in order. All the plans once made for the future now come down to how they will be written into the record of his life; this page of his life has turned, and nothing new will be added after it.\n\nYou look over the candidates once more. The ritual official waits with brush in hand, not daring to press you, but that blank must in the end bear a name."
 ZongWang_ShiHao.020.a0:0 "$Color_ZanBai$Set aside the customary names and choose one personally"
