 ZongWang_ShiHao.021.event_title:0 "Posthumous Name for the Crown Prince"
 ZongWang_ShiHao.021.event_desc:0 "The crown prince died young, and much that had been arranged for the Eastern Palace became, before it could even begin, a matter of mourning. The officials present the candidate characters for his posthumous name in voices softer than usual, as if afraid that even these solemn words might weigh too heavily.\n\nYou look at the brief record of his life and refuse to fill it with things that never had the chance to happen. A child who did not live to grow up needs no accomplished deeds before he deserves to be truly mourned.\n\nYet the posthumous name must be settled. As you set brush to paper, what you wish to preserve is this short life that truly was, not the future others once imagined for him."
