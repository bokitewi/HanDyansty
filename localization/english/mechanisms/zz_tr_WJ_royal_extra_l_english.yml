 ZongWang_ShiHao.022_t:0 "Choose the Name Yourself"
 ZongWang_ShiHao.022_d:0 "The candidates have been put away; only brush, ink, and a blank space remain on the desk. The explanations of the succession and of funeral rites have at last fallen silent.\n\nYou rest your hand at the edge of the desk, slow to take up the brush. So many planned the future of the Eastern Palace while he lived; now they have all stepped aside, waiting for you to write this final name."
 ZongWang_ShiHao.022.a:0 "Let this be his posthumous name."
 SanGong_Zongzu.002.t:0 "Invest a Crown Grandson"
 SanGong_Zongzu.002.d:0 "[Taizi.GetName] has passed away, and while the funeral is still being arranged, the register of heirs is laid before you once more. Hearing that familiar title, your fingers pause on the edge of the desk before you let the official read on.\n\nAmong the descendants of this line, should another be chosen to inherit the place of heir? The names are read one by one, and you try to picture each face clearly. The dead have left an empty place, but whoever comes to stand in it should not be treated as a mere stroke to fill the gap.\n\nYou keep the register at hand and do not hurry anyone to draft eulogies. The hall below waits only for a name, but what you think of are the ordinary days that person can never return to."
 SanGong_Zongzu.002.a:0 "Invest him as Crown Grandson."
 SanGong_Zongzu.002.b:0 "Appoint no Crown Grandson. Choose another heir."
