 TaiZiDG:0 "Eastern Palace of the Crown Prince"
 mem_add_taizi:0 "Invested as Heir"
 mem_add_taizi_desc:0 "[owner.GetFirstName] was invested as heir and took up residence in the Eastern Palace. The investiture read: 'The great foundation of the state lies first in establishing an heir. You are by nature benevolent and filial, of steady judgment and bearing; strive to cultivate your virtue, keep carefully to a subject's propriety, and so bear the weight of the ancestral temple.'"
