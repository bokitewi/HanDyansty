l_english:
 CeLi_taizi_interaction:0 "Invest the Crown Prince"
 DM_appointment_female_preference_penalty:0 "A Hen Crowing at Dawn"
 DM_appointment_male_preference_penalty:0 "Men Above Women"
 FeiChu_taizi_interaction:0 "Depose the Crown Prince"
 SanGong_DianZhang.015.a:0 "Let those in charge carry it out"
 SanGong_DianZhang.015.b:0 "Your servants kowtow and receive the edict"
 SanGong_DianZhang.015.desc:0 "When the edict investing the heir reaches the name [taizi.GetName], several of those present look up as one. The long ceremonial phrases before it seem only now to have found their purpose.\n\nFrom this day on, the station of the Eastern Palace will be bound to this name. Those who hear it today will carry it far and wide tomorrow: some will think of the ancestral temple and the succession, others perhaps of something nearer at hand.\n\nThe reading voice stays steady, but the faces all around are no longer quite as they were. You understand that once a name is placed before the seat of heir, there are already those waiting for many things yet to happen."
 SanGong_DianZhang.015.t:0 "Edict Investing the Crown Prince"
 SanGong_DianZhang.018.a:0 "The edict is issued; the Eastern Palace stands empty."
 SanGong_DianZhang.018.desc:0 "The edict deposing the heir has been proclaimed, and [taizi.GetName] will no longer dwell in the Eastern Palace as crown prince. When the herald finishes reading, no one speaks for a moment, the words still seeming to hang in the air.\n\nYou glance around. Some lower their eyes, some seem about to speak, but in the end none says a word. The closeness and distance that once arose around the seat of heir will surely take on a different shape from now on.\n\nThe edict must still be sent onward, but the old title can no longer be used. How much talk the news will stir once it passes the palace gates is more than this brief silence can conceal."
 SanGong_DianZhang.018.t:0 "Edict Deposing the Crown Prince"
 SanGong_GongWei_1:0 "Empress"
 SanGong_GongWei_1_desc:0 "The principal consort of the Son of Heaven, who rightly occupies the central palace, serves as mother to all under Heaven, and shares with the Son of Heaven the rites of the ancestral temple."
