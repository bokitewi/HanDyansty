 HouGong_ShiHao.012_t:0 "Bestowing the Posthumous Name"
 HouGong_ShiHao.012_d:0 "The candidate characters are set aside for now; you will compose the posthumous character yourself. The ritual official lays down his brush and steps back half a pace, and the stream of explanations falls silent with him.\n\nGazing at the blank space before the desk, you suddenly recall the voice of someone calling her name in days past. A posthumous name takes but a single character; hereafter, whenever others speak of her, they will add the one character you write today. Yet however it is written, she will never answer again."
 HouGong_ShiHao.012.a:0 "The character is decided. Let it be carried out."
 WJ_harem_selection_origin_desc:0 "Before the register is sent out, the attendant first asks about origins: should women be taken from good commoner families, or chosen first from renowned clans? He has barely finished speaking when you glimpse a brush already prepared at his sleeve.\n\nOnce this order is given, some will rejoice and some will speculate. Looking at the still-empty register, you think how behind every surname in the palace there may soon be several more people coming to call and inquire. If daughters of renowned clans fall short, good families must still make up the number; as for who stays and what rank they hold, that comes later.\n\nThe attendant says no more, waiting only for you to speak."
 WJ_harem_selection_commoner:0 "Choose daughters of good families."
 WJ_harem_selection_noble:0 "Choose daughters of renowned clans."
 DongGongTaiHou_court_position:0 "Empress Dowager, Legal Mother"
 DongGongTaiHou_court_position_desc:0 "Honor the late Emperor's principal consort as Empress Dowager and legal mother, supported with reverence in the palace."
 XiGongTaiHou_court_position:0 "Empress Dowager, Birth Mother"
 XiGongTaiHou_court_position_desc:0 "Honor the Emperor's birth mother as Empress Dowager, supported with reverence in the palace."
 TaiHuangTaiHou_court_position:0 "Grand Empress Dowager"
 TaiHuangTaiHou_court_position_desc:0 "Honor the Empress Dowager of the Emperor's grandparents' generation as Grand Empress Dowager."
