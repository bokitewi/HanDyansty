l_english:
 WJ_harem_guiren:0 "Noble Lady"
 WJ_harem_guiren_desc:0 "This character ranks as a Noble Lady, with golden seal and purple ribbon, second only to the Empress in the inner palace."
 WJ_harem_meiren:0 "Beauty"
 WJ_harem_gongren:0 "Palace Lady"
 WJ_harem_cainv:0 "Selected Maiden"
 WJ_harem_unranked_desc:0 "This character is entered in the registers of the Lateral Courts, yet holds no rank or stipend, receiving only seasonal gifts."
 SanGong_CeliHuanghou_interaction:0 "Invest Empress"
 WJ_harem_crown_desc:0 "Invest this person as Empress, mistress of the Central Palace."
 SanGong_divorce_character_interaction:0 "Depose Empress"
 WJ_harem_depose_desc:0 "Depose the Empress and sever the marriage."
 WJ_harem_rank_interaction:0 "Decree Rank"
 WJ_harem_rank_title:0 "Decree Inner Palace Rank"
 WJ_harem_rank_desc:0 "[recipient.GetFirstNameNoTooltip]'s name is written in the registers of the Lateral Courts, and the space for rank beside it is still blank. The attendant reads off a few titles and then stops, as if one more word might be taken for your wish.\n\nYou glance at the name once more. Noble Lady, Beauty, Palace Lady, Selected Maiden: the words differ little in length, yet in the mouths of the palace in days to come they will carry very different weight. Once settled today, the news will likely travel faster than any formal document.\n\nThe brush is ready, and the one waiting outside to carry back your answer has waited a long while."
 WJ_harem.003.a:0 "Invest her as Noble Lady."
 WJ_harem.003.b:0 "Name her a Beauty."
 WJ_harem.003.c:0 "Enroll her as Palace Lady."
 WJ_harem.003.d:0 "List her as Selected Maiden."
 WJ_harem_rank_notice:0 "Inner Palace Rank Decided"
 WJ_harem_rank_notice_desc:0 "From now on, the palace shall call her [recipient.Custom('WJ_GetUIName')]."
 QianSan_chuGong_interaction:0 "Release from the Palace"
 WJ_harem_crown_title:0 "Edict of Investiture of the Empress"
 WJ_harem_crown_notice:0 "The investiture is proclaimed, and [huanghou.Custom('WJ_GetUIName')] takes her place in the Central Palace. The attendants speak the newly decreed title a little slower than usual, and even those nearby lean in to listen, lest they call her wrongly later.\n\nYou read the document through once and set it back beside the desk. With one rank settled, many small matters in the palace shift in weight: whom to report to first, where to wait for audience, whose word deserves turning over and over. All will be talked of from now on.\n\nThe rite is done, and the document may be filed away. As for the words not yet spoken within the palace gates, they have perhaps only begun today."
 WJ_harem_depose_title:0 "Edict of Deposition"
 WJ_harem_depose_notice:0 "The edict deposing [huanghou.GetFirstNameNoTooltip] has been issued. An attendant brings the newly amended register; reaching her former rank, he pauses a moment before reading out the revised title.\n\nLooking at the correction, you feel only now that the edict has truly entered the palace. Audiences, reports and courtesies must all change accordingly; some will quietly breathe a sigh of relief, and others may not keep their grievances buried forever.\n\nThe judgment is made, yet palace affairs must go on as usual. Those outside the door still wait for new instructions."
 WJ_harem_ack:0 "Let it be carried out."
 SanGong_ShiQin:0 "Summon a Consort"
 WJ_harem_intimacy_title:0 "Life in the Inner Palace"
 WJ_harem_intimacy_desc:0 "You sit down facing [ShiQie.Custom('WJ_GetUIName')], and the voices outside pressing for answers at last fade away. The lamp wick crackles softly, and only then do you notice that the words left unfinished during the day are still clenched in your heart.\n\nYou ease your shoulders and look at the one beside you. There has never been a shortage of eyes in the palace longing for an heir; whether tonight you let nature take its course or set such thoughts aside rests on a single thought of yours.\n\nThe lamplight sways by the curtain. You reach out to straighten the small cup on the table, and for a long while do not call anyone in."
 WJ_harem_allow_birth:0 "Let nature take its course, for the sake of the ancestral line."
 WJ_harem_prevent_birth:0 "Seek only companionship; no heir for now."
 SanGong_XuanXiu_decisions:0 "Select Women for the Palace"
 WJ_harem_selection_decision_desc:0 "The inner palace has long stood empty, and the hope of imperial heirs rests on the Lateral Courts. Following Han precedent, a Palace Grand Master should be sent with the Assistant of the Lateral Courts and physiognomists to view the women of the realm, choosing those graceful in appearance and of auspicious features to bring back to the palace."
 WJ_harem_selection_confirm:0 "Order the officials to select"
 WJ_harem_selection_title:0 "The Selection Register Arrives"
 WJ_harem_selection_desc:0 "The attendant calls out names until the very last, and finally stops. You had thought that hearing each one would be enough to remember them, but when he asks for your instructions, several names have already blurred together in your mind.\n\nThe newly selected maidens have all entered the palace, their native places and backgrounds each set down. You have him leave the register to review later; there is no need to decide at once who stays and what rank they hold. Word travels fastest in the palace, and even a passing word of praise will be pondered over and over.\n\nThe attendant withdraws, and you turn back to the first page. The brief pause each gave when her name was called now remains only as a few lines of text."
 SanGong_FaSongXiuNV_decisions:0 "Send Home Unchosen Palace Women"
 WJ_harem_release_desc:0 "The selected maidens of the Lateral Courts have long been in the palace; those never summoned grow old in vain behind its walls. Better to send them home to their families and let them marry as they will."
 WJ_harem_release_confirm:0 "Permit their return"
 HouGong_ShiHao.001_t:0 "The Late [HuangHou.Custom('WJ_HaremRank')] Has Passed Away"
 HouGong_ShiHao.001_d_start:0 "News of the passing of the [HuangHou.Custom('WJ_HaremRank')] reaches the palace, and the familiar comings and goings of former days suddenly fall silent.\n\n"
 HouGong_ShiHao.001_d1:0 "You hear the officials out on the funeral rites, then ask once more what remains to be done. The Empress's place bound together the order of rites in the palace, and much of the daily life long taken for granted; now that she is gone, small matters that never needed asking must all be answered anew.\n\nGrief cannot halt all affairs of state, yet neither should it be reduced to a ledger of routine expenses. You order the officials to manage everything according to rite, handling the funeral needs and the deliberation of a posthumous name together. Little can still be done for the departed, and you will not be careless with these last few things."
 HouGong_ShiHao.001_d2:0 "As the officials describe the funeral rites, you glance more than once toward where the voice comes from, as if the Empress Dowager might still, as ever, send someone with word of her wishes. After a moment you remember that none of these arrangements will receive her reply now.\n\nHer honored place must be entered in the records according to rite, and her posthumous name must be solemnly decided. But what must be handled first are the funeral matters that cannot be left untended merely because of grief.\n\nYou have the necessary expenses recorded and dealt with in order. The court has its own order of rites, yet the empty place left by an elder will not be filled so easily."
 HouGong_ShiHao.001_d3:0 "News of the Grand Empress Dowager's death reaches the palace, and many who had long served her do not know at first what to do first. She spent more years in this palace than you, and the origins of some old customs are remembered only by the elderly attendants at her side.\n\nYou order the officials to set out the arrangements according to rite, settling what must be done first, so that grief does not turn into everyone waiting on one another. Her posthumous name must still be discussed separately, but the funeral and its expenses cannot be delayed.\n\nWhen the document is read through, the hall falls quiet again. An honored place can be written into the records, but it will take a long time to grow used to the absence of one who was present for so long."
 HouGong_ShiHao.001.a:0 "Hold the funeral by rite, provide a hundred gold, and discuss the posthumous name later."
 HouGong_ShiHao.011_t:0 "Choosing a Posthumous Name"
 HouGong_ShiHao.011_d_start:0 "The funeral rites have been arranged, and the officials now present the deliberation on a posthumous name, waiting for you to choose how the departed shall be called hereafter.\n\n"
 HouGong_ShiHao.011_d1:0 "The Empress's title was once always in your ears; now the ritual officials ask which posthumous character should be added to it. You take the list of candidate characters and study it for a moment, then turn back to the page recording her life.\n\nSome characters are too heavy, while others seem not to say enough. Many reasons have already been given below the hall, yet you recall a few small things never written into the ritual texts, and for a while you do not answer.\n\nThe official's brush still waits. Hereafter others will call her by this character, though she herself will never hear it."
 HouGong_ShiHao.011_d2:0 "The Empress Dowager's honored place is already set down, and the ritual officials now ask about her posthumous name. You look over each candidate, and a few familiar characters reach your lips, yet you do not speak them at once.\n\nIn former days, when a matter was hard to decide, you could still hear her view; today every one of these characters concerns her, and no one in the hall can answer for her. Thinking you did not hear clearly, the official is about to read again, but you raise a hand to bid him wait.\n\nYou lay the document flat, wishing to think once more, carefully, about the name that will finally remain."
 HouGong_ShiHao.011_d3:0 "The deliberation on the Grand Empress Dowager's posthumous name reaches your desk. The officials no longer ask about the quantity of ritual goods, only how she shall be called hereafter. The honored title long familiar in daily speech suddenly has a part that you must decide.\n\nYou gaze at the candidate characters, recalling the expressions of the palace elders when they spoke of her. Some old events you never witnessed yourself, and could only hear them slowly told; having heard them, you dare even less to choose any of these characters lightly.\n\nThe ritual official waits, and the names are all listed. A name must be settled for these posthumous rites, one that can be passed down."
