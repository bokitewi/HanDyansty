l_english:
 WJ_peerage_trait:0 "Hereditary Peerage"
 WJ_peerage_trait_desc:0 "This character has been enfeoffed by the Son of Heaven, ranked among the peers, and lives on the revenue of a fief."
 WJ_peer_grant_interaction:0 "Confer Peerage"
 WJ_peer_open_tt:0 "List the available lands and settle this person’s peerage rank and stipend fief"
 WJ_peer_revoke_interaction:0 "Revoke Peerage"
 WJ_peer_designate_interaction:0 "Designate Heir to the Peerage"
 WJ_peer_pick_title:0 "Choose a Fief"
 WJ_peer_next:0 "Next"
 WJ_peer_back:0 "Back"
 WJ_peer_restart:0 "Choose Rank Again"
 WJ_peer_confirm_title:0 "Issue the Decree of Enfeoffment"
 WJ_peer_confirm:0 "Formally Confer"
 WJ_peer_awarded:0 "Decree of Enfeoffment"
 WJ_peer_inherited:0 "Peerage Inherited"
 WJ_peer_awarded_desc:0 "The patent arrives. You hear the reading through before you take it in hand. The words #high [ROOT.Char.Custom('WJ_PeerName')]#! lie before your eyes, and the annual stipend is drawn from [ROOT.Char.MakeScope.Var('wj_peer_food').Title.GetBaseNameNoTierNoTooltip]; your style of address and your household's means now rest on new grounds.\n\nA servant asks where the patent should be kept. You do not answer at once, but read the new title over once more. From now on, whoever presents a calling card or speaks of your house will likely have to add these words first.\n\nThe fief only supplies a stipend; it does not come under your rule, and your existing offices and lands remain as they were. Yet as you close the patent, you still feel it is somehow different from everything else on your desk."
 WJ_peer_removed:0 "Peerage Revoked"
 WJ_peer_removed_desc:0 "The order of punishment has been read out, yet the clerk still stands before your desk, waiting for you to confirm how you are to be addressed from now on. Only then do you see the register he has copied anew: where your old title once stood, there is now a blank.\n\nSome forms of address grow so familiar one forgets they can be taken back. The fief and the stipend are stripped away together, and neither the household's expenses nor plans for your heirs can be reckoned as before. Should others still use the old title, it would only make that blank more glaring.\n\nYou tell him to leave the document. Your offices and lands are unchanged, and tomorrow's official business will arrive just the same; only the opening lines of those documents can never again bear those words."
 WJ_peer_income:0 "Fief Stipend"
 WJ_peer_income_desc:0 "A clerk reports that this year's fief stipend, [ROOT.Char.MakeScope.Var('wj_peer_amount').GetValue|0] gold in all, has been delivered to the treasury. You were reading another document on expenditures; hearing this, you have him set the receipt closer.\n\nThe money comes from the fief's taxes, and even if the land changes lords, the stipend is still paid by the old statutes. You look over where it came from before handing the receipt back. Several long-delayed expenses now have some room to move.\n\nThe servant asks if there is anything else; you wave him away, but your eyes fall back on the expenditure document. The new income will likely not sit idle for long."
 WJ_peer_ack:0 "Noted"
 SanGong_SeparatedCloseKin_modifier:0 "Close Imperial Branch"
 WJ_peer_princess_name:0 "Princess"
 WJ_peer_country_suffix:0 "State"
 WJ_peer_county_princess:0 "County Princess"
 WJ_peer_duchy_princess:0 "Commandery Princess"
 WJ_peer_root_status:0 "\n\nFirst choose the province where the fief lies."
 WJ_peer_parent_status:0 "\n\nNow choosing a place within [ROOT.Char.MakeScope.Var('wj_peer_parent').Title.GetNameNoTooltip]."
 WJ_peer_cancel:0 "Cancel Enfeoffment"
 WJ_peer_previous_page:0 "Previous"
 WJ_peer_next_page:0 "Next"
 WJ_peer_grant_failed:0 "Enfeoffment Failed"
 WJ_peer_grant_failed_desc:0 "Just as the patent was about to be completed, the officials reported that the chosen land now belongs to another, or the circumstances of the recipient have changed, and the decree cannot be issued after all.\n\nNothing has been spent this time. You may choose another place, or let the matter rest."
 WJ_peer_inherited_desc:0 "Your forebear's patent and seal ribbons have now passed into your hands. The title #high [ROOT.Char.Custom('WJ_PeerName')]#!, together with the stipend of [ROOT.Char.MakeScope.Var('wj_peer_food').Title.GetBaseNameNoTierNoTooltip], is yours to inherit from this day.\n\nAn old family servant brings out the old register and points out the names written there, generation after generation. The names have changed several times, but the title has always been the same.\n\nHereafter, when people speak of your house, these are likely still the first words they will say."
 WJ_peer_grant_interaction_desc:0 "By the command of the Son of Heaven, settle a peerage rank and fief for this person."
 WJ_peer_revoke_interaction_desc:0 "Strip this person of their peerage and reclaim their fief stipend."
 SanGong_SeparatedCloseKin_modifier_desc:0 "This house descends from a close branch of the imperial clan; though it has set up its own household, it remains among the imperial kin."
