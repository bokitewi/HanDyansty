l_english:
 hd_dc_review_governance_decision: "Verify Crisis Aftermath"
 hd_dc_review_governance_decision_desc: "The war report no longer urges haste, yet the promises previously made must still be verified one by one. Which old case is sealed at this moment determines whether the court can usher in a more enduring peace."
 hd_dc_review_governance_decision_tooltip: "View a crisis that can be finally resolved; choose to close the case or continue monitoring."
 hd_dc_review_governance_decision_confirm: "Submit the verified case files"
 hd_dc_governance_review_ready_tt: "At least one political outcome has been determined, the core war has truly ended, there are no pending actions or obligations, and crises that have been verified exist; governance value reaches 20; or a major uncorrected breach of contract exists after verification."
 hd_dc_gov.0001.t: "When is this volume to be sealed?"
 hd_dc_gov.0001.desc: "The clerk points out each item that has already been verified, leaving aside those parts that still require time for confirmation. Victory or defeat is one matter; whether the people can live in peace and whether promises are kept is another. \n\n The case number for this crisis is [hd_dc_governance_instance.Var('hd_dc_instance_id').GetValue|0], with an actual governance value of [hd_dc_governance_instance.Var('hd_dc_q').GetValue|0]. Now, seal the file and record the final results based on current achievements; wait a bit longer, perhaps to prove that this stability can withstand the passage of time."
 hd_dc_gov.0001.a: "Close the case based on what has already been accomplished."
 hd_dc_gov.0001.a.tt: "Final settlement occurs only once: major uncorrected breach of contract takes priority, reducing Crisis by 10 and leaving Prosperity unchanged; otherwise, if Governance ≥60 with full compliance for 5 consecutive years, Crisis −35 and Prosperity +30; if Governance ≥40 with actual stability for 3 consecutive years, Crisis −20 and Prosperity +15; if Governance ≥20 and core war ends, Crisis −10 and Prosperity +5. If suppressing rebellions yields only suppression results, settlement is capped at the lowest tier; waiting alone cannot substitute for military authority and salary reform. After case closure, no higher-tier rewards can be claimed."
 hd_dc_gov.0001.b: "Continue to observe; do not rush to close the scroll."
 hd_dc_gov.0001.b.tt: "Retain this case for now without settlement. Automatic settlement will occur once the highest tier is genuinely met; new related wars or unfulfilled obligations will interrupt continuous stability timers. The quota of resolved acute crises will not be further occupied while awaiting follow-up actions."
 hd_dc_gov.0002.t: "After the scroll is sealed"
 hd_dc_gov.0002.high: "Over five years, the cessation of hostilities left a traceable record, and promises were fulfilled item by item. The case clerk wrote the concluding remarks on the final page, merging old and new documents together. \n\nThe highest reward for governing this case has been recorded: Crisis World -35, Prosperity +30. Political victory or defeat is recorded according to actual circumstances and will not be altered by this assessment."
 hd_dc_gov.0002.medium: "Three years of stability have finally yielded sufficient records. While there are still aspects that fall short of perfection, the cessation of hostilities and security arrangements already implemented should not be erased. \n\n The effective stabilization of this case has been duly rewarded: Perilous World -20, Prosperity +15. This case will no longer be eligible for repeated rewards."
 hd_dc_gov.0002.low: "The war has truly ended, and the follow-up measures have been verified. Closing this case now records a limited easing, but we cannot yet declare lasting peace. \n\n The limited easing from this case has already been credited: Crisis -10, Prosperity +5. This case will not be eligible for rewards again."
 hd_dc_gov.0002.breach: "There remains a significant unfulfilled agreement on the ledger, neither erased by subsequent deaths, successions, or victories nor actually rectified. The case file cannot merely retain its favorable aspects. \n\nThis case is ultimately recorded as a major unrectified breach of contract: Danger +10, Prosperity unchanged. No positive governance rewards will be issued simultaneously."
 hd_dc_gov.0002.a: "Save game as-is."
