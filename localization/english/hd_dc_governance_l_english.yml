l_english:
 hd_dc_review_governance_decision:0 "Review the Crisis Settlement"
 hd_dc_review_governance_decision_desc:0 "The war dispatches no longer demand haste, but every promise made must still be checked. Which old case you close now may determine whether the court enjoys a more lasting peace."
 hd_dc_review_governance_decision_tooltip:0 "Review crises ready for a final settlement, then close a case or continue to observe it."
 hd_dc_review_governance_decision_confirm:0 "Bring me the verified records"
 hd_dc_governance_review_ready_tt:0 "A political outcome has been established, the main war has ended, no actions or obligations remain outstanding, and a verified crisis exists. Governance must reach 20, or the review must reveal a major uncorrected breach of agreement."
 hd_dc_gov.0001.t:0 "When Shall This File Be Closed?"
 hd_dc_gov.0001.desc:0 "The clerk points out each verified matter, setting aside those that still need time to confirm. Victory and defeat are one thing; peaceful lives for the people and promises kept are another.\n\nThis crisis is case [hd_dc_governance_instance.Var('hd_dc_instance_id').GetValue|0], with a Governance score of [hd_dc_governance_instance.Var('hd_dc_q').GetValue|0]. You can close the file now and record the outcome achieved so far, or wait to see whether this peace can stand the test of time."
 hd_dc_gov.0001.a:0 "Close the case on what we have achieved."
 hd_dc_gov.0001.a.tt:0 "Final settlement occurs once. A major uncorrected breach of agreement takes priority: Crisis −10, Prosperity unchanged. Otherwise: Governance ≥60 and 5 consecutive years of full compliance grant Crisis −35 and Prosperity +30; Governance ≥40 and 3 consecutive years of verified stability grant Crisis −20 and Prosperity +15; Governance ≥20 and the main war ended grant Crisis −10 and Prosperity +5. If a rebellion ends only in suppression, rewards are capped at the lowest tier. Waiting alone cannot replace reforms to military authority and salaries. Once a case is closed, higher-tier rewards cannot be claimed."
 hd_dc_gov.0001.b:0 "Keep watching. There is no need to close it yet."
 hd_dc_gov.0001.b.tt:0 "Keep the case open without settling it. It will settle automatically once the highest tier is met. New related wars or unfulfilled obligations interrupt the continuous-stability timer. Waiting for subsequent action does not consume further acute-crisis capacity for a crisis already resolved."
 hd_dc_gov.0002.t:0 "After the File Is Closed"
 hd_dc_gov.0002.high:0 "Five years of peace have left records that can be checked, and the promises have been kept one by one. The clerk writes a final conclusion and binds the old and new documents together.\n\nThe highest Governance reward for this case has been recorded: Crisis −35, Prosperity +30. Its political outcome remains as it actually occurred and is not changed by this assessment."
 hd_dc_gov.0002.medium:0 "Three years of stability have finally provided enough evidence. Matters are still imperfect, but the peace and security arrangements already put in place deserve recognition.\n\nThe verified stability of this case has earned its reward: Crisis −20, Prosperity +15. No further reward can be claimed for this case."
 hd_dc_gov.0002.low:0 "The war has ended, and the settlement measures have been verified. Closing the case now records a limited improvement; it does not establish lasting peace.\n\nThis limited improvement has been recorded: Crisis −10, Prosperity +5. No further reward can be claimed for this case."
 hd_dc_gov.0002.breach:0 "A major unfulfilled agreement remains on the ledger. Later deaths, successions, and victories have neither erased it nor put it right. The file cannot preserve only the favorable evidence.\n\nThe final record is a major uncorrected breach of agreement: Crisis +10, Prosperity unchanged. No positive Governance reward is granted."
 hd_dc_gov.0002.a:0 "File it accordingly."
