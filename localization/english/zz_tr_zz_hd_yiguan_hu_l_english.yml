l_english:
 # Southern Migration of the Gentry, Hu side (Sinicization Reform / Hu-ization / Celestial Government)
 # Titles, descriptions and options of 3001-3004 reuse the Son of Heaven versions hd_dc_con.0201-0204 (hd_dc_kit_con_l_simp_chinese.yml)

 # ---------- Decision: Sinicization Reform ----------
 hd_yiguan_sinicization_decision:0 "Enact Sinicization Reform"
 hd_yiguan_sinicization_decision_desc:0 "We have long ruled the Central Plains. What was won on horseback cannot be governed from horseback. Follow the wise rulers of old: move the capital to Han lands, don the robes and caps of the Han, exchange Hu surnames for Han ones, and banish the Hu tongue from court, transforming the barbarian by the ways of Xia to win the hearts of the people of the Central Plains.\n\nOnce decreed, the reform proceeds step by step, and every step will stir resentment among the nobles of our own people, even mutiny."
 hd_yiguan_sinicization_decision_tooltip:0 "Decree the Sinicization Reform, carried out in four steps; it may pass to your heir"
 hd_yiguan_sinicization_decision_confirm:0 "Decree Sinicization"
 hd_yiguan_sinicization_decision_effect_tt:0 "Moving the capital, changing dress, changing surnames, banning the Hu tongue: four edicts issued in turn every two or three years, and each step may be halted. The nobles of your own people will grow ever more resentful, #EMP perhaps even rising in revolt#!, while Han vassals will steadily come to your side. Once all four are done, your dynasty becomes a #P Sinicized Dynasty#!, you adopt the customs of the Fusion of Hu and Han, and the counties of your realm no longer suffer the occupation penalty.\nThe reform passes with the realm: should you die midway, your primary heir carries it on; if you lose all your land, the reform ends. Hu-ization cannot be imposed while it is underway.\nFor each step taken:"
 hd_yiguan_sinicization_next_step_tt:0 "The next edict will be issued in two or three years"
 hd_yiguan_sinicization_done_tt:0 "The Sinicization Reform is complete: your dynasty becomes a #P Sinicized Dynasty#!, counts among the #V Sinicized Regimes#! in the Southern Migration of the Gentry, and the counties of your realm no longer suffer the occupation penalty"

 # ---------- Decision: Hu-ization ----------
 hd_yiguan_huhua_decision:0 "Impose Hu-ization"
 hd_yiguan_huhua_decision_desc:0 "The Han cling to their old ways and will never be of one heart with us. Rather than bend to them at every turn, let the Han lands within our borders take up the customs of our people: household registers, ancestral rites, weddings and funerals, caps and robes, all according to our ancestral ways. Given enough years, the Han lands too will become the lands of our people.\n\nThe Han are sure to resent this decree: the Han vassals under your rule will grow discontented, and the occupied lands will be more prone to unrest."
 hd_yiguan_huhua_decision_tooltip:0 "Order the Han lands of your realm to adopt the customs of your people"
 hd_yiguan_huhua_decision_confirm:0 "Hu Customs Above All"
 hd_yiguan_huhua_decision_effect_tt:0 "For the next twenty years, each year there is a #V 25%#! chance that #V 1~3#! occupied northern counties of Han culture in your realm (vassal lands included) convert to your culture (faith unchanged; counties bordering those of your own culture are preferred), after which they no longer suffer the occupation penalty. At most #V 30#! counties per ruler in total.\nHan vassals who submit or are enfeoffed while it is in force will be just as discontented; this resentment fades once the twenty years are over or 30 counties have been converted.\nSinicization cannot be enacted while it is in force."
 hd_yiguan_huhua_han_vassals_tt:0 "Each Han [vassal|E] (sub-vassals included)"
 hd_yiguan_huhua_uprising_tt:0 "While it is in force, the cost for the Han of the Occupied North under your rule to #N Raise Rebellion#! is halved"

 # ---------- Decision conditions ----------
 hd_yiguan_hu_reform_phase_tt:0 "The Southern Migration of the Gentry is in the #V Stalemate#! phase, and you belong to the #V Hu Regimes#!"
 hd_yiguan_huhua_blocks_reform_tt:0 "Is not imposing Hu-ization"
 hd_yiguan_huhua_active_tt:0 "Hu-ization is not already underway"
 hd_yiguan_reform_blocks_huhua_tt:0 "Is not enacting the Sinicization Reform"
 hd_yiguan_huhua_cap_tt:0 "Fewer than 30 counties converted by Hu-ization in total"
 hd_yiguan_huhua_target_tt:0 "Holds occupied northern counties of Han culture"

 # ---------- Decision: Celestial Government ----------
 hd_yiguan_celestial_decision:0 "Establish the Celestial Government"
 hd_yiguan_celestial_decision_desc:0 "My dynasty has changed its dress and surnames and fully adopted Han institutions. It is time to follow the statutes of the Central Plains and establish the institutions of a Celestial Court."
 hd_yiguan_celestial_decision_tooltip:0 "Adopt the [GetGovernment('celestial_government').GetName]"
 hd_yiguan_celestial_decision_confirm:0 "Establish the system, found the court!"
 hd_yiguan_celestial_decision_effect_tt:0 "You will adopt the [GetGovernment('celestial_government').GetName]."

 # ---------- Notifications ----------
 hd_yiguan_sinicization_lapsed_toast:0 "Reform Halted"
 hd_yiguan_sinicization_lapsed_toast_tt:0 "You have lost all your land; the Sinicization Reform can no longer be sustained and is hereby halted."
 hd_yiguan_sinicization_abandoned_toast:0 "Northern Court Abandons Reform"
 hd_yiguan_sinicization_abandoned_toast_tt:0 "[hd_yiguan_hu_actor.GetShortUIName] has abandoned the Sinicization Reform."
 hd_yiguan_huhua_county_toast:0 "Hu-ization Spreads"
 hd_yiguan_huhua_county_toast_tt:0 "[hd_yiguan_hh_county.GetName] has adopted [hd_yiguan_hh_ruler.GetCulture.GetName] customs and no longer counts as occupied land."
 hd_yiguan_huhua_county_holder_toast:0 "Customs Changed Under Your Rule"
 hd_yiguan_reform_decreed_toast:0 "Sinicization Decreed"
 hd_yiguan_reform_decreed_toast_tt:0 "[hd_yiguan_hu_actor.GetShortUIName] has decreed the Sinicization Reform: moving the capital, changing dress, changing surnames and banning the Hu tongue, to be issued in turn every two or three years."
 hd_yiguan_reform_done_toast:0 "Sinicization Complete"
 hd_yiguan_reform_done_toast_tt:0 "[hd_yiguan_hu_actor.GetShortUIName]'s Sinicization Reform is complete: their dynasty becomes a #P Sinicized Dynasty#!, counts among the #V Sinicized Regimes#! in the Southern Migration of the Gentry, and the counties of their realm no longer suffer the occupation penalty."
 hd_yiguan_huhua_decreed_toast:0 "Hu-ization Decreed"
 hd_yiguan_huhua_decreed_toast_tt:0 "[hd_yiguan_hu_actor.GetShortUIName] has ordered Hu-ization: over the next twenty years, the occupied northern counties of Han culture in their realm will one by one adopt [hd_yiguan_hu_actor.GetCulture.GetName] customs."
 hd_yiguan_huhua_county_holder_toast_tt:0 "By [hd_yiguan_hh_ruler.GetShortUIName]'s Hu-ization decree, [hd_yiguan_hh_county.GetName] has adopted [hd_yiguan_hh_ruler.GetCulture.GetName] customs."

 # ---------- Events: Sinicization notices ----------
 hd_yiguan.3010.t:0 "The Hu Ruler's Reforms"
 hd_yiguan.3010.desc:0 "Merchants from the north bring news: [hd_yiguan_hu_actor.GetShortUIName] has decreed that the old customs of their people are to be swept away entirely, the capital moved to Han lands and the robes and caps of the Han adopted, and even the compound surnames of the royal clan and nobles are to be changed. The messenger, warming to his tale, lowered his voice to add that many of the old ministers of their own people are aggrieved, and the court seethes with debate.\n\nThose around me are divided. Some sneer that the Hu are mere monkeys in caps, acting on a passing whim; others look grave, saying that if the Han people of the north truly accept this new master, the affairs between North and South will no longer be settled by soldiers and horses alone.\n\nI have the matter recorded. From now on, someone must keep watch on every edict that comes out of the north."
 hd_yiguan.3010.a:0 "Let us see how far this one gets."
 hd_yiguan.3011.t:0 "The North Changes Its Customs"
 hd_yiguan.3011.desc:0 "[hd_yiguan_hu_actor.GetShortUIName]'s final edict has been issued: the northern tongue is heard no more at court, the royal clan has taken Han surnames, and caps, robes and rites all follow the old ways of the Central Plains. The documents arriving from the north now read little differently from the dispatches of Jiangzuo.\n\nThe envoy says the Han gentry there are flocking to take office, and some even hold that the rightful succession now lies in the north. When these words were spoken, no one in the hall answered for a long while.\n\nThe divide between Hu and Han was once a line plain for all to see; now that line is fading in the north, and all that is left to contest is who shall inherit the legitimacy of the Central Plains."
 hd_yiguan.3011.a:0 "Robes may change; legitimacy does not."
 hd_yiguan.3012.t:0 "The Reform Is Complete"
 hd_yiguan.3012.desc:0 "After the edict banning the Hu tongue was issued, the court assembly was held wholly in proper speech for the first time. A few old ministers still spoke haltingly, and at the crucial points would pause unbidden to search for words; the young princes of the royal clan, though, answered with ease, as if born to such a court.\n\nMoving the capital, changing dress, changing surnames, banning the Hu tongue: the four edicts spanned many years, every step met opposition, and some hearts were lost along the way. Looking back now, the old felt tents and tribal banners lie far behind; what remains is a court willing to welcome the scholars of the Central Plains.\n\nThe court historian asks how this year should be recorded. After some thought, I have him write only this: from this day on, Hu and Han are subjects of one realm."
 hd_yiguan.3012.a:0 "All within the four seas are one family, from this day forth."
 hd_yiguan.3012.a.tt:0 "Your dynasty has become a #P Sinicized Dynasty#! and belongs to the #V Sinicized Regimes#! in the Southern Migration of the Gentry. If you are an independent ruler of kingdom tier or above, you may enact 'Establish the Celestial Government'."
 hd_yiguan.3014.t:0 "The Late Ruler's Testament"
 hd_yiguan.3014.desc:0 "The late ruler's coffin was not yet interred when courtiers came to ask about the Sinicization Reform. In life the late ruler championed the reform, yet only some of its edicts were issued; the remaining steps are now mine to decide.\n\nSeizing on a new ruler's accession, the nobles of our people urge me to abolish the new policies, saying that with the late ruler gone there is no need to force everyone further; the Han gentry instead beg me to carry on his will and not let past labours go to waste. Both sides invoke the late ruler, yet each remembers a different man."
 hd_yiguan.3014.desc.s0:0 "\n\nThe late ruler decreed the reform, but the move of the capital has not yet been carried out."
 hd_yiguan.3014.desc.s1:0 "\n\nThe capital has been moved to Han lands; changing dress, changing surnames and banning the Hu tongue have yet to be decreed."
 hd_yiguan.3014.desc.s2:0 "\n\nThe capital has been moved and dress changed; changing surnames and banning the Hu tongue have yet to be decreed."
 hd_yiguan.3014.desc.s3:0 "\n\nThe capital has been moved, and dress and surnames changed; only the edict banning the Hu tongue remains."
 hd_yiguan.3014.a:0 "The late ruler's will must not be abandoned halfway."
 hd_yiguan.3014.a.tt:0 "The Sinicization Reform proceeds as before; the next edict will be issued in a few months to a few years"
 hd_yiguan.3014.b:0 "A new ruler must calm the people. Abandon the reform."

 # ---------- Events: Hu-ization ----------
 hd_yiguan.3201.t:0 "The Hu-ization Decree"
 hd_yiguan.3201.desc:0 "Refugees from the north say that [hd_yiguan_hu_actor.GetShortUIName] has ordered their people's customs imposed in the commanderies and counties where the Han dwell: household registers now follow tribal rule, and rites, weddings, funerals and dress all follow Hu ways. Those who refuse have their fields and homes seized, or are deported elsewhere.\n\nThey speak of this flatly, as though long accustomed to it. Only when they come to their ancestors' graves back home do they stop, and gaze off without another word.\n\nThe Han of the north will find it harder still to live in peace, and more will surely come south; and the resentment building in the hearts of those who stay must one day find an outlet."
 hd_yiguan.3201.a:0 "That the robes and caps of the Central Plains should come to this!"
 hd_yiguan.3202.t:0 "The Hu-ization Decree"
 hd_yiguan.3202.desc:0 "When my liege's decree arrived, the clan elders were deliberating in the ancestral hall. The edict was plain: wherever the Han dwell within the realm, they shall henceforth follow the customs of the ruling people, and registers, rites, weddings, funerals, caps and robes must all be changed. The envoy who delivered it stood below the steps, waiting to see how I would receive it.\n\nFor a moment the hall was silent. I knew that if I accepted the decree, the villages under my rule would change their face one after another; if I refused, open defiance stood right before me. Yet the eyes of the clan's young men had already passed beyond the envoy, to the gate."
 hd_yiguan.3202.a:0 "Accept it. While I live, there is a tomorrow."
 hd_yiguan.3202.b:0 "Petition earnestly: Han customs cannot be wholly abolished."
 hd_yiguan.3202.c:0 "Secretly contact loyal men, ready for what may come."
 hd_yiguan.3202.desc.rule:0 "\n\nWhile your liege imposes Hu-ization, the cost for the Han of the Occupied North under their rule to raise rebellion is halved."
 hd_yiguan.3203.t:0 "Hu-ization Subsides"
 hd_yiguan.3203.desc:0 "The Hu-ization decree has been in force for twenty years. In the early years, Han households fled or defied orders time and again; now, in the counties that have changed their customs, the young have grown up speaking our people's tongue, and at the sacrifices no one speaks of the old ways anymore.\n\nThe officials in charge come to ask whether the matter should rest here. Many lands have changed over these twenty years, and pressing further would cost far more effort than before.\n\nI have them bring me the registers of these years. What comes next can be discussed later."
 hd_yiguan.3203.desc.cap:0 "Since Hu-ization began, thirty counties within the realm have taken up the customs of our people. The officials in charge present the registers, saying the hearts of the remaining Han provinces and counties are restless, and that forcing further change may provoke great upheaval.\n\nI leaf through the revised registers one volume after another: names, rites, marriage customs, all different from before. What could be done has been done; the rest must be left to time."
 hd_yiguan.3203.a:0 "The customs are set; there is no need to push further."
 hd_yiguan.3210.t:0 "Han Households Scatter"
 hd_yiguan.3210.desc:0 "After [hd_yiguan_hh_county.GetName] adopted the customs of our people, local officials report that many Han households have gathered their valuables by night and fled with their families into the mountains or to the south, while those who remain keep their doors shut, and no one tends the fields.\n\nOur generals urge me to post troops on the main roads and bring back every runaway; others advise exempting the area from taxes and corvée for a time, so that those who stay may settle their hearts. Still others say: let those who would leave go, and give the empty fields to our people's herdsmen."
 hd_yiguan.3210.a:0 "Forbid flight; bring back and punish all who flee."
 hd_yiguan.3210.b:0 "Remit taxes and corvée to ease their hearts."
 hd_yiguan.3210.c:0 "Let them come and go; resettle the vacant land."
