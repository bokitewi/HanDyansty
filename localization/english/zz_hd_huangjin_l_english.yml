l_english:
 hd_subdue_qingzhou_huangjin_decision:0 "Accept the Surrender of the Qingzhou Yellow Turbans"
 hd_subdue_qingzhou_huangjin_decision_desc:0 "A million Yellow Turbans from Qingzhou wander between Qing and Yan, starving between battles. Send envoys, accept their surrender, and their strongest can be forged into an army.\n\nThree trials decide the outcome: reviewing their host (Martial), settling them on the land (Stewardship), and binding their chieftains by oath (Diplomacy). Each trial passed yields 4,000 Qingzhou Army troops; pass all three for 10,000 more, and let your demesne reap what they till.\n\n#weak Only three attempts in all the world, and each ruler but one. A triumph in any trial, or a full success, closes this offer to everyone forever.#!"
 hd_subdue_qingzhou_huangjin_decision_tooltip:0 "Pass three trials of Martial, Stewardship and Diplomacy to absorb the strongest of the Qingzhou Yellow Turbans into your army."
 hd_subdue_qingzhou_huangjin_decision_confirm:0 "Accepting surrender is like waging war: review them, feed them, bind them."
 hd_hj_qingzhou_army:0 "Qingzhou Army"
 hd_hj_qingzhou_reclaim_county_modifier:0 "Qingzhou Military Colonies"
 hd_hj_qingzhou_reclaim_county_modifier_desc:0 "Surrendered Yellow Turbans till the fields as soldier-colonists, farming and fighting in turn. The countryside grows prosperous."
 hd_huangjin.1.t:0 "Surrender at the Gate"
 hd_huangjin.1.desc_fail:0 "Three rolls of the drum sound outside the camp gate. A white-haired veteran kneels in the muddy snow, offering half a jar of cloudy wine. Behind him stretch camps without end — a million souls of the Qingzhou Yellow Turbans, pitched along the riverbank to the horizon.\n\n“All we ask is a road to live on.” The old soldier's word rings true, yet as you ride down the rows your heart sinks: no order, no ranks, spears reforged from hoes, armor patched with rags. The chieftains watch your banner hungrily. Would this host add strength to your army — or weight to your baggage train?"
 hd_huangjin.1.desc_success:0 "Three rolls of the drum sound outside the camp gate. A white-haired veteran kneels in the snowy mud with wine, and behind him the camps stretch past sight.\n\nYou walk the rows with your captains, sword at hand. The lines are ragged, but there is a desperate, hard-bitten fire in them; most of the able men have both tilled a field and fought a war. The old soldier looks up: “The one who offers us a road — him we will follow.” Your marshal murmurs that with drilling, this host could yield tens of thousands of serviceable troops. To take them in, or turn them away — the choice falls today."
 hd_huangjin.1.desc_crit:0 "Three rolls of the drum sound outside the camp gate. A white-haired veteran kneels in the snowy mud with wine, and behind him the camps stretch past sight.\n\nThe muster begins, and you brace yourself for a mob's pantomime — but at the first drumbeat the camps move as one, advancing, wheeling, closing ranks with a semblance of discipline! Their chieftain is an old soldier; where his standard points, ten thousand men move like a single body. You rein in on the rise, thunder in your chest: this is no rabble. This is a sword half-forged, waiting only for the hand that will wield it.\n\nFrom this day forth, all under heaven will know whose hand that is."
 hd_huangjin.1.a:0 "Accept the surrender. See them fed."
 hd_huangjin.2.t:0 "Farm and Fight"
 hd_huangjin.2.desc_fail:0 "Grain carts queue outside the gate, pouring measure after measure into the camps like water into a cracked jar.\n\nYour steward spreads the ledgers before you: a million mouths eat a thousand stone a day at the least, and the granaries will not last a hundred. “My lord, an army marches on its grain. Without it, the best of troops turn to ruin by spring — and remember, these are men who have risen once before.” Outside, black masses queue at the gruel tents, down to the river flats."
 hd_huangjin.2.desc_success:0 "Grain carts queue outside the gate — but your steward brings more than carts.\n\nHe has spent the night registering the surrendered host. The old and weak become colony households, assigned the ownerless fields; the able are entered on separate military rolls, to farm in spring and summer, drill in autumn and winter. “Colonies to feed the army; farming and fighting as one.” He circles the river flats and waste fields in charcoal. “Within two years, these million mouths will raise my lord an army.” The register is placed before you, awaiting only your seal."
 hd_huangjin.2.desc_crit:0 "Grain carts queue outside the gate — but your steward brings more than carts and ledgers.\n\nHe drives the surrendered host to clear channels and lead water, dividing them into files of five and ten and assigning fields. Within a month, cooking smoke rises over the waste flats; ditches are mended in winter, the lands of Qing and Yan broken in spring, and the raiders of yesterday rise with the dawn for a season's harvest. At year's end the colony ledgers show a surplus for the army — a million mouths have become a million pairs of hands, opening channels and breaking soil.\n\nYour steward holds the ledger with trembling voice: “My lord, Heaven sends you provisions and clothing.”"
 hd_huangjin.2.a:0 "Seal it. Then summon the chieftains to the oath."
 hd_huangjin.3.t:0 "The Blood Oath"
 hd_huangjin.3.desc_fail:0 "In the chieftains' great tent the ox-ear knife lies on the table and the blood-wine is poured — but as you look around, you read nothing but suspicion and fear.\n\nOne man watches the sword at your waist; another leaves his seat on some pretext. The old soldier who knelt in the snow drains his wine, yet will not swear to heaven. That night, bands slip their camps and take to the wilds again — and your offer of surrender becomes a jest among the warlords."
 hd_huangjin.3.desc_success:0 "In the chieftains' great tent the ox-ear knife lies on the table and the blood-wine is poured.\n\nYou raise the bowl and speak of the world: whether the Yellow Heaven or the Blue, all the common folk ask is bread. The tent is silent for a long moment. Then the old soldier who knelt in the snow rises, cuts his finger, and lets his blood fall into the wine: “From this day, our lives are the general's.” One by one, the chieftains swear. Three trials thus answered, the hearts of the host are settled at last."
 hd_huangjin.3.desc_crit:0 "In the chieftains' great tent the ox-ear knife lies on the table and the blood-wine is poured.\n\nYou name no terms. Instead, before the whole tent you untie the bound old chieftain and seat him above; you speak of the empire's famine and a court that lost its way, and when you name the dead of these hills the tent weeps as one. Then you raise the bowl and swear: from this day the former Turbans are registered subjects, to be treated no differently from any other.\n\nEvery chieftain bows to the earth. The next morning's muster shows every banner changed. The name of the Qingzhou Army stands among the powers of the age."
 hd_huangjin.3.a:0 "Sound the order: choose the able and form the ranks!"
 hd_huangjin.3.reward_full:0 "All three trials passed! Gain 22,000 Qingzhou Army troops (4,000 per trial, +10,000 for a full success); demesne counties gain +30% Development Growth for 20 years."
 hd_huangjin.3.reward_8000:0 "Gain 8,000 Qingzhou Army troops."
 hd_huangjin.3.reward_4000:0 "Gain 4,000 Qingzhou Army troops."
 hd_huangjin.3.reward_none:0 "All three trials failed. The host scatters, and nothing is gained."
 hd_huangjin.3.closed_crit:0 "A triumph was achieved — the decision is now permanently closed to everyone."
 hd_huangjin.3.closed_full:0 "All trials passed — the decision is now permanently closed to everyone."
 hd_huangjin.3.closed_third:0 "This was the world's third attempt — the decision is now closed forever."
