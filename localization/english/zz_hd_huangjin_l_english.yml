l_english:
 hd_subdue_qingzhou_huangjin_decision:0 "Surrender the Yellow Turbans of Qingzhou"
 hd_subdue_qingzhou_huangjin_decision_desc:0 "The Yellow Turbans of Qingzhou, numbering in the millions, are currently wandering between Qingzhou and Yan Province, fighting while starving. Send envoys to persuade them; recruit their finest and strongest men to form a powerful force. \n\n However, whether you can accept their followers, secure their food, and win their loyalty depends entirely on three trials: inspecting their camps (Military), settling them for sustenance (Administration), and swearing oaths with their leaders (Diplomacy). Each successful trial yields 4,000 Qingzhou soldiers; if all three trials succeed, an additional 10,000 men are gained, and the directly governed counties also benefit from reclamation efforts. \n\n#weak  This proposal offers only three attempts in the entire world, and each person may try it only once in a lifetime. If any trial achieves great success, or if someone succeeds in all three trials, this proposal will be permanently closed to the world. #!"
 hd_subdue_qingzhou_huangjin_decision_tooltip:0 "Through military, administrative, and diplomatic assessments, recruit the robust members of the Yellow Turbans from Qingzhou to form the Qingzhou Army."
 hd_subdue_qingzhou_huangjin_decision_confirm:0 "Accepting surrender is like engaging in battle: inspect their troops, secure their provisions, and win their loyalty. These three tests determine success or failure."
 hd_hj_qingzhou_army:0 "Qingzhou Army"
 hd_hj_qingzhou_reclaim_county_modifier:0 "Qingzhou Garrison"
 hd_hj_qingzhou_reclaim_county_modifier_desc:0 "The Yellow Turban forces who surrendered were organized into military farming units, engaging in both cultivation and combat; consequently, the countryside gradually flourished."
 hd_huangjin.1.t:0 "Receive surrender at the yuán gate"
 hd_huangjin.1.desc_fail:0 "Before the Yuen gate, the drum beats three times. An old white-haired soldier kneels in the snow and mud, holding half a jar of cloudy wine. Behind him stretches an endless line of camps—the Qinzhou Yellow Turbans, over a million men, women, and children, pitched along the riverbank until they seem to reach the horizon.\n\n\"We beg for a way to survive,\" says the old soldier. His words are true, yet as you ride slowly past the encampment, your heart grows heavier: no ranks, no formations; their weapons are spears made from hoes, and their armor is patched together with scraps. The chieftains gaze longingly at your general's banner—will such troops add strength to your army, or merely become a burden?"
 hd_huangjin.1.desc_success:0 "Outside the YUAN gate, the drums beat three times. A white-haired veteran soldier kneels in the snow and mud, holding a cup of wine. Behind him stretches an encampment with over a million souls, endless as far as the eye can see. \n\n You walk through the camp with your subordinate generals, swords at their sides, inspecting the troops along the way: though the formation is not perfectly ordered, there is a fierce determination to survive among the ranks; most of the selected strong men are farmers who have also seen battle. The veteran soldier lifts his face: \"Those who offer us a chance to live, we will follow.\" The accompanying generals whisper—after some training, these people could become tens of thousands of usable soldiers. To accept them or not, the decision rests today."
 hd_huangjin.1.desc_crit:0 "Outside the Yuen Gate, the drums beat three times. A white-haired veteran soldier kneels in the snow and mud, holding a cup of wine; behind him stretches an encampment of over a million souls, endless to the eye. \n\n The martial exhibition begins. You had only expected to witness a chaotic farce of bandits—but as the drums sound, each camp moves in response, advancing and retreating with unity, combining and separating with hidden order! The commanders leading the troops are veterans; wherever the command flags go, ten thousand men move as one. You rein your horse on the high hill, and thunder seems to roll within your chest: These are not bandits; this is a sword forged halfway complete, waiting only for its wielder. \n\n From this day forward, the world will know who commands these million-strong forces."
 hd_huangjin.1.a:0 "Order the surrendering forces to be accepted first by securing their food supplies."
 hd_huangjin.2.t:0 "Farm while fighting"
 hd_huangjin.2.desc_fail:0 "Grain carts line up in a long queue outside the yuán gate, moving grain into the camp one dou at a time, like pouring water into an overturned jar. \n\n The Administrator spreads out the ledger before you: over a million mouths to feed, consuming more than a thousand shi daily; the granary's stores will not last beyond a hundred days. \"My Lord, raising soldiers begins with securing grain. Without it, even the finest troops will spark great unrest before spring arrives—do not forget, they have already rebelled once.\" Outside the camp, the soup kitchens are packed with people stretching all the way to the riverbank."
 hd_huangjin.2.desc_success:0 "Grain carts form a long queue outside the camp gate, but the steward brings more than grain registers.\n\nHe has spent the night counting the surrendered people and drawing up regulations: the old and infirm will be enrolled as farming households and allotted unclaimed wasteland; the able-bodied will enter separate military rolls, farming in spring and summer and training in autumn and winter. 'Let military colonies feed the soldiers: plow and fight together.' With a charcoal stick, he circles riverbanks and wasteland on the map. 'Within two years, these million mouths will sustain a great army for my lord.' He places the register before you. Only your seal is needed."
 hd_huangjin.2.desc_crit:0 "Grain carts lined up in a long queue outside the Yuen Gate, and the Administrator brought more than just grain registers. \n\n He supervised the surrendered masses in clearing canals to channel water, organizing them into units of five and ten for registration and land allocation. Within weeks, cooking smoke rose from the wasteland; winter irrigation works were repaired, and spring plowing began in Qingyan. The bandits who once plundered commanderies and counties now left early and returned late for a single harvest season. At year-end accounting, the military cultivation yielded a surplus to be sent before the army—millions of mouths thus became millions of hands digging canals and reclaiming wasteland. \n\n Holding the register, the Administrator's voice trembled: \"My Lord, Heaven has provided food and clothing for the General.\""
 hd_huangjin.2.a:0 "Seal the seal. Then summon the various tribal leaders to drink blood."
 hd_huangjin.3.t:0 "Swear an oath by spilling blood"
 hd_huangjin.3.desc_fail:0 "Inside the warlord's tent, ox-ear knives lay on the table and blood wine filled the bowls. Yet as you glanced around at those present, all you read was suspicion and fear. \n\n Some stared at the sword at your waist; others made excuses to change clothes and left their seats. The old soldier who once held a cup of wine and knelt in the snow drank it all down, yet ultimately refused to swear an oath to heaven. That night, several groups quietly struck camp and returned to banditry—between Qing and Yan there would be more marauding bands, while your efforts at pacification became a subject of mockery among the warlords."
 hd_huangjin.3.desc_success:0 "Inside the warlord's tent, ox-ear knives lay on the table and blood wine filled the bowls. \n\n You raised your bowl to discuss the fate of the world: whether it be the Yellow Heaven or the Blue Sky, all that the common people desire is a mouthful of rice. After a moment of silence in the tent, the old soldier who once presented the wine and knelt in the snow rose up, sliced open his fingertip with a knife, and let the blood drip into the wine: \"From now on, our lives belong to you, General.\" One by one, the warlords drank the blood. With these three tests completed, the hearts of the surrendered troops were finally settled."
 hd_huangjin.3.desc_crit:0 "Inside the warlord's great tent, ox-ear knives lay on the table and blood wine filled the bowls. \n\n You made no demands; instead, you publicly untied the bound old warlord, helped him take his seat, and declared that the land suffered from famine while the court had lost its way. Speaking of your fellow villagers who had fallen in battle, the tent erupted in mourning cries. Then you raised your bowl and swore an oath: all former Yellow Turban forces would henceforth be registered commoners, treated equally before the law. \n\n The warlords within the tent bowed their heads in submission. The next day, after a census, every faction had changed its banner—the name of the Qingzhou Army stood established throughout the realm from that day forward."
 hd_huangjin.3.a:0 "Order given: Select the strong to join the ranks!"
 hd_huangjin.3.reward_full:0 "All three inspections passed! Gained 22,000 troops from the Qingzhou Army (4,000 per inspection; an additional 10,000 granted if all are passed); development of directly administered counties increased by +30% for a period of 20 years."
 hd_huangjin.3.reward_8000:0 "Gained 8,000 troops from the Qingzhou Army."
 hd_huangjin.3.reward_4000:0 "Gained 4,000 troops from the Qingzhou army."
 hd_huangjin.3.reward_none:0 "All three inspections failed; the surrendered troops dispersed, yielding nothing."
 hd_huangjin.3.closed_crit:0 "A grand success was achieved in the appraisal—the resolution \"Surrender the Yellow Turbans of Qingzhou\" has been permanently closed to all under heaven."
 hd_huangjin.3.closed_full:0 "All three trials passed—the resolution to \"Surrender the Yellow Turbans of Qingzhou\" is now permanently closed for all under heaven."
 hd_huangjin.3.closed_third:0 "This marks the third attempt to conquer the world—the resolution to \"Surrender the Yellow Turbans of Qingzhou\" has been permanently closed."
