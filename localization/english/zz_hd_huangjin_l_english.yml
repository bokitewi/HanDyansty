l_english:
 hd_hj_qingzhou_army:0 "Qingzhou Army"
 hd_hj_qingzhou_reclaim_county_modifier:0 "Qingzhou Garrison"
 hd_hj_qingzhou_reclaim_county_modifier_desc:0 "The Yellow Turban forces who surrendered were organized into military farming units, engaging in both cultivation and combat; consequently, the countryside gradually flourished."
 hd_huangjin.1.t:0 "Surrender at the Camp Gate"
 hd_huangjin.1.desc_fail:0 "The drum has sounded, but the rear ranks are still shifting. Standing at the camp gate, you watch a single command flag fail to move so many men. Your hopes of gaining a strong army begin to cool.\n\nUp close, the truth is plain: broken weapons, no clear formations, and many men merely following the crowd in search of a meal. The chief hastens to explain. You raise a hand to silence him. If he cannot even count his own followers, who will obey him in battle?\n\nHe lowers his head, and no one else speaks. You end the inspection for now. An army needs soldiers it can use, but all these mouths outside the camp still need feeding. Tomorrow you will discuss the grain and see what can yet be salvaged from this surrender."
 hd_huangjin.1.desc_success:0 "After several drum signals, the surrendered men gradually form ranks. You walk along the lines. Some are still searching for their places; others halt the instant they hear an order.\n\n“Those men at the back can be used,” you point out to your officers. You will not dismiss everyone because the front ranks are confused. Weapons can be issued and companies organized. In troubled times, men willing to obey orders and able to wield a blade should not be turned away lightly.\n\nSeeing you begin to record names, the chief eagerly asks when they may enter camp. You promise no troop quota yet. Instead, you ask how many mouths must be fed. At once the crowd falls quieter than it did while forming ranks. This, it seems, is the question they have always feared would go unanswered."
 hd_huangjin.1.desc_crit:0 "The surrendered men stand in dense ranks outside the camp gate. You expect to shout several times, but as soon as the drum sounds, each company falls into place. Even the men at the ends of the standards remain still.\n\nYou walk down the ranks and stop before several broad-backed soldiers. Their weapons are a jumble, but their eyes follow the command flag without hesitation. “Is this how you formed ranks before?” you ask. The chief hurries to answer, his voice finally carrying some confidence.\n\nTo send these men away as mere scattered refugees would be to misjudge them. You turn and order the useful soldiers recorded, then ask how much grain remains in their camp. If they are to fight for you, they must first know there is a future after their surrender."
 hd_huangjin.1.a:0 "The inspection is done. Tomorrow, discuss the grain."
 hd_huangjin.2.t:0 "To Farm and to Fight"
 hd_huangjin.2.desc_fail:0 "Yesterday’s drums still ring in your ears, but today’s grain ledger has already dashed your hopes. Every mouth reported requires grain. Fields yet to be cleared cannot provide so much as one meal.\n\nThe clerk calculates a third time, his voice sinking lower. You point out an error. Once corrected, the shortfall is clearer still. Another request for food arrives from outside the camp. Your officers exchange glances, none eager to answer it first.\n\nYou press a hand to the ledger and order the difficulty recorded plainly. Tomorrow you must meet the chiefs, but today’s grain account cannot be evaded. A promise of shelter was easy when you were accepting men. Making it possible for them to stay is proving far harder."
 hd_huangjin.2.desc_success:0 "Today you test no bows or blades; you count meals first. The elderly, the weak, and the able-bodied each have their own totals. You question each entry. The last thing you want is someone reporting every mouth as a soldier.\n\nAfter repeated checks, a workable plan emerges. Those fit to fight will enter the ranks; the others will be settled separately. The grain on hand and the crops to come will just about suffice. You ask the clerk for a fresh copy. Better leave blanks than invent grain merely to earn a word of praise.\n\nThe plan returns to your desk, and you look it over once more. A balanced account does not guarantee smooth execution. Tomorrow you must explain it face to face with the chiefs: what you are willing to give, and the rules they must follow under your command."
 hd_huangjin.2.desc_crit:0 "After yesterday’s inspection, you ordered separate reports of mouths to feed and land to cultivate. Today, the ledgers lie open together, and the figures that once contradicted each other match item by item.\n\nThe fighting men will join the army; the rest will be settled to farm. A practicable way to provide immediate relief has been found as well. When the report ends, you take up the brush and check two entries yourself. Only then do you breathe easier. If men merely gather to eat, no treasury can sustain an endless surrender.\n\n“Proceed on these terms.” You hand the ledger back. There is no harvest yet, but at least you no longer need to answer hungry people with empty words. When you meet the chiefs tomorrow, you will finally have something solid to say."
 hd_huangjin.2.a:0 "The registers are settled. Tomorrow, make terms with the chiefs."
 hd_huangjin.3.t:0 "An Oath in Blood"
 hd_huangjin.3.desc_fail:0 "When the discussion turns to lasting obedience, the chiefs grow slow to answer. Some stare at the ground; others will only agree to stay for now. Even those who readily replied a moment ago press their lips shut.\n\nYou repeat the conditions with less patience than before. “Once in the army, you cannot each follow your own orders.” The tent falls quieter still. By the time they leave, not one has given you an answer you can rely upon.\n\nYou look at the empty seats and bring the military rolls and settlement registers from the past two days back to your desk. How many men can remain must be determined from what those days achieved. If neither useful soldiers nor their provisions can be secured, this surrender will indeed leave you empty-handed."
 hd_huangjin.3.desc_success:0 "When the chiefs enter the tent, you first explain the findings of the past two days, then set out the army’s rules one by one. At last one man cannot hold back his question: “If we suffer an injustice, will we still be allowed to bring it before you?”\n\nYou look at him and let him finish. Better that he asks than bows his head and agrees to everything. After several exchanges, the men finally consent to the terms, and their tense shoulders ease a little.\n\nYou lift the water beside you and realize how dry your throat has become. Their loyalty is steadier for now. Next, the useful soldiers must be matched against the grain and settlement arrangements to fix the final troop strength. Men are already waiting for orders outside. Today they need not leave with their doubts unanswered."
 hd_huangjin.3.desc_crit:0 "The chiefs enter the tent as agreed, stiff and cautious in their seats. You do not hurry them into an oath. First you explain the companies, the settlement arrangements, and the army’s rules, asking what remains unclear.\n\nOne finally raises his head to ask whether his family can be settled. Another asks whose orders he will follow in camp. As more questions come, their guardedness gradually fades. When the last man gives his word, the others bow with him, their voices far more united than when they arrived.\n\nYou tell them to rise, already weighing the rosters and grain totals from the past two days. Willing allegiance is welcome, but the number who can remain under arms still depends on how many fit soldiers can be selected and how many mouths can be supported. At least today’s words have not been wasted."
 hd_huangjin.3.a:0 "Set the troop strength and organize the surrendered men."
 hd_huangjin.3.reward_full:0 "All three inspections passed! Gained 22,000 troops from the Qingzhou Army (4,000 per inspection; an additional 10,000 granted if all are passed); development of directly administered counties increased by +30% for a period of 20 years."
 hd_huangjin.3.reward_8000:0 "Gained 8,000 troops from the Qingzhou Army."
 hd_huangjin.3.reward_4000:0 "Gained 4,000 troops from the Qingzhou army."
 hd_huangjin.3.reward_none:0 "The surrendered men disperse after all. You gain nothing."
 hd_huangjin.3.closed_crit:0 "Your skillful settlement has won the loyalty of the surrendered Qingzhou people. No one else can now intervene."
 hd_huangjin.3.closed_full:0 "The surrendered Qingzhou people have all joined you. No other ruler can accept their surrender again."
 hd_huangjin.3.closed_third:0 "After repeated attempts at settlement, the Qingzhou Yellow Turbans have scattered. No one can now gather them by offering amnesty."
 hd_huangjin.10.t:0 "Surrender at Jibei"
 hd_huangjin.10.desc:0 "The Yellow Turbans of Qingzhou have come from the east, said to number a million. Once across the Ji River they plundered everywhere, and every commandery in their path shut its gates. You marched out to meet them and never left your camp day or night, laying ambushes one day and dogging their heels the next, from spring until the onset of winter.\n\nThey were many, but they dragged their families and baggage behind them, and grew hungrier with every mile. You cut off their road and did not rush a decisive battle, only drew the net tighter little by little. At last their chiefs sent a man to your camp to say they would surrender, asking only that the old and weak be allowed to live.\n\nWhen the envoy has gone, you climb the ramparts and look out: the plains of Jibei are covered with the tents of the surrendered, stretching beyond sight. The strong can be picked out and formed into an army; the rest can be given land to farm and guard. If these men can be trained, you will have a foundation for contending for the realm."
 hd_huangjin.10.a:0 "Take the best of them and call them the Qingzhou Army."
