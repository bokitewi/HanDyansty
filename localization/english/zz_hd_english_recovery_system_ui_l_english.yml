 WJ_qingyi_mingli_capacity_modifier:0 "Clarifying Names and Principles"
 WJ_qingyi_mingli_capacity_modifier_desc:0 "Names and realities were clarified in a learned debate, bringing a deeper understanding of the underlying principles. The Merit cap increases by 1 level. This modifier does not directly increase current Merit or advance official rank."
 WJ_qingyi_huitong_capacity_modifier:0 "Reconciling Diverse Teachings"
 WJ_qingyi_huitong_capacity_modifier_desc:0 "Rather than remaining bound to a single school of thought, differing views have been brought together into a coherent understanding. The Merit cap increases by 1 level. This modifier does not directly increase current Merit or advance official rank."
 WJ_qingyi_jingyi_capacity_modifier:0 "Insight into the Classics"
 WJ_qingyi_jingyi_capacity_modifier_desc:0 "New insights into the classics are substantial enough to support an independent interpretation. The Merit cap increases by 1 level. This modifier does not directly increase current Merit or advance official rank."
 WJ_yinshi_zhushu_capacity_modifier:0 "Work Brought to Completion"
 WJ_yinshi_zhushu_capacity_modifier_desc:0 "Years of learning have finally been brought together in a finished work through dedicated writing. The Merit cap increases by 1 level. This modifier does not directly increase current Merit or advance official rank."
 WJ_yinshi_xiangwang_capacity_modifier:0 "Respected in the Community"
 WJ_yinshi_xiangwang_capacity_modifier_desc:0 "Character and insight have earned the trust of the local community, bringing an honorable reputation even without holding office. The Merit cap increases by 1 level. This modifier does not directly increase current Merit or advance official rank."
 WJ_yinshi_jiangxue_capacity_modifier:0 "Teaching and Passing on the Way"
 WJ_yinshi_jiangxue_capacity_modifier_desc:0 "Teaching pupils in the mountains has deepened the learning of both teacher and students. The Merit cap increases by 1 level. This modifier does not directly increase current Merit or advance official rank."
 WJ_yuedan_nominated_capacity_modifier:0 "Recognized by the Scholarly Community"
 WJ_yuedan_nominated_capacity_modifier_desc:0 "Inclusion in the Monthly Appraisal has brought talent and conduct to the attention of the scholarly community. The Merit cap increases by 1 level. Only the highest tier of this appraisal series applies; the tiers do not stack."
 WJ_yuedan_finalist_capacity_modifier:0 "Distinguished Reputation"
 WJ_yuedan_finalist_capacity_modifier_desc:0 "Reaching the final assessment in the Monthly Appraisal has brought a distinguished reputation. The Merit cap increases by 2 levels. Only the highest tier of this appraisal series applies; the tiers do not stack."
 WJ_yuedan_winner_capacity_modifier:0 "Foremost of the Age"
 WJ_yuedan_winner_capacity_modifier_desc:0 "Selection as this Monthly Appraisal's distinguished scholar has placed this figure foremost among their contemporaries. The Merit cap increases by 3 levels. Only the highest tier of this appraisal series applies; the tiers do not stack."
 WJ_kaoke_resource_multiplier_rules:0 "Treasury funding and Merit commendations also scale with the previous assessment's final score: Good uses 80 points as its threshold; Excellent uses 100. Each additional point increases the base assessment reward by 1%, up to twice the base reward. Appointment score bonuses and study experience do not scale this way. These rules apply to both the player and officials; only one reward is received.\n"
 WJ_puppet_council_appointment_interaction:0 "Arrange a Council Appointment"
 WJ_puppet_council_appointment_interaction_desc:0 "Appoint council members in the controlled ruler's name. Positions, candidate eligibility, and replacement restrictions still follow that ruler's appointment rules."
 WJ_puppet_council_appointment_notification:0 "You have received an invitation to take a council position."
 WJ_puppet_court_appointment_interaction:0 "Arrange a Court Appointment"
 WJ_puppet_court_appointment_interaction_desc:0 "Grant one of the controlled ruler's existing court positions in their name. Positions, available places, eligibility, and salaries still follow the original rules."
 puppet_action_description_WJ_puppet_action_council_appointment:0 "Arrange appointments to the controlled ruler's council in their name, leaving your own council unchanged"
 puppet_action_description_WJ_puppet_action_court_appointment:0 "Arrange appointments to the controlled ruler's court in their name, leaving your own court unchanged"
