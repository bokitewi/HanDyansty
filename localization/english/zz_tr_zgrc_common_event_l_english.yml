l_english:
 zgrc_common.0002.t:0 "When in Rome"
 zgrc_common.0002.desc:0 "You have lived here as a guest for many years, and without noticing, your food, your habits and your speech have all taken on the local ways. How much of your hometown accent and old customs remains?"
 zgrc_common.0002.a:0 "When in Rome, follow the local ways."
 zgrc_common.0002.b:0 "Rooted in my homeland, I keep the old ways."
 zgrc_common.1010.t:0 "The Realm Answers the Call"
 zgrc_common.1010.desc_foreign:0 "Foreign invaders have crossed the border with the full might of their nation; beacon fires blaze to the sky, and their blades point straight at the altars of [ROOT.Char.GetTopLiege.GetName].\n\nYour family has long enjoyed the realm's favor, and your fief lies here. When the call to arms arrives, the village elders are already gathered outside your door, waiting for you to decide."
 zgrc_common.1010.desc_civil:0 "We share the same Huaxia robes and caps, yet now brothers take up arms against one another. The attackers' blades point straight at the altars of [ROOT.Char.GetTopLiege.GetName], contesting who holds the Mandate of Heaven.\n\nYour family has long enjoyed the realm's favor, and your fief lies here. When the call to arms arrives, the village elders are already gathered outside your door, waiting for you to decide."
 zgrc_common.1010.a:0 "Spend the family fortune, raise local braves, and rally to the sovereign at once!"
 zgrc_common.1010.a_locked:0 "With no wealth to spare, there are no means to rally to the sovereign."
 zgrc_common.1010.b:0 "Are kings, nobles and generals born to their station?"
 zgrc_common.1010.b_locked:0 "Too weak and too remote to raise a righteous banner."
 zgrc_common.1010.c:0 "War is perilous; let us watch how things unfold."
 zgrc_common.2001.t:0 "Volunteers Arrive"
 zgrc_common.2001.desc:0 "This war is fought over old Han soil. As word spreads, the righteous folk of the land raise their banners and flock to join, eager to march at the front and help recover the old frontiers.\n\nThe volunteers' leader is already waiting outside your tent for your orders."
 zgrc_common.2001.a:0 "March with the army for now, and go home when it is done."
 zgrc_common.2001.b:0 "Give them generous pay and rations and enlist them in the ranks."
 zgrc_common.2001.c:0 "Comfort them with kind words and send them home."
 zgrc_yijun_army_name:0 "Local Volunteers"
 zgrc_common.3001.t:0 "Tales of Righteousness"
 zgrc_common.3001.desc:0 "Passing through [ROOT.Var('zgrc_wen_county').Title.GetName], you are stopped by village elders by the roadside who tell you an old story: when war suddenly broke out, [zgrc_wen_hero.GetName] spent their whole fortune raising local braves and hurried to the aid of the sovereign. The people of the town still sing of this righteous deed."
 zgrc_common.3001.desc_late:0 "Passing through [ROOT.Var('zgrc_wen_county').Title.GetName], you are stopped by village elders by the roadside who tell you an old story: when war suddenly broke out, [zgrc_wen_hero.GetName] spent their whole fortune raising local braves and hurried to the aid of the sovereign. The trees on that grave have long since grown thick, yet the locals still speak of the deed with solemn reverence."
 zgrc_common.3001.a:0 "Donate funds to build a shrine honoring their loyalty."
 zgrc_common.3001.a_renew:0 "Donate again for incense, to honor the worthy of old."
 zgrc_common.3001.b:0 "Pay respects to such virtue and admire it in your heart."
 zgrc_common.3001.c:0 "Hurrying on, pay it no mind."
 zgrc_common.3002.t:0 "Tales of Benevolence"
 zgrc_common.3002.desc:0 "Passing through [ROOT.Var('zgrc_wen_county').Title.GetName], locals by the roadside tell you an old story: when volunteers passed through, [zgrc_wen_hero.GetName] did not drive them to die at the front, but comforted them kindly and sent them home, sparing the people of the region. The locals are grateful for this kindness to this day."
 zgrc_common.3002.desc_late:0 "Passing through [ROOT.Var('zgrc_wen_county').Title.GetName], locals by the roadside tell you an old story: when volunteers passed through, [zgrc_wen_hero.GetName] did not drive them to die at the front, but comforted them kindly and sent them home, sparing the people of the region. That person is long gone now, yet the locals still weep when they speak of it."
 zgrc_common.3002.a:0 "Donate funds to build a shrine and honor this benevolence."
 zgrc_common.3002.a_renew:0 "Donate again for the incense, to glorify this worthy of old."
 zgrc_common.3002.b:0 "Pay respects to this worthy, and aspire to follow."
 zgrc_common.3002.c:0 "Hurry on your way, paying it no mind."
 zgrc_common.3003.t:0 "Unwelcome Words"
 zgrc_common.3003.desc:0 "Passing through [ROOT.Var('zgrc_wen_county').Title.GetName], you hear people in the lanes murmuring in lowered voices: back when the realm was in turmoil, [zgrc_wen_hero.GetName] gave no thought to serving the state, but instead betrayed his lord amid the chaos, raised his own banner, and joined forces with the invaders. The speaker glances about nervously, and every listener is shaken."
 zgrc_common.3003.desc_late:0 "Passing through [ROOT.Var('zgrc_wen_county').Title.GetName], you hear people in the lanes murmuring in lowered voices: back when the realm was in turmoil, [zgrc_wen_hero.GetName] gave no thought to serving the state, but instead betrayed his lord amid the chaos, raised his own banner, and joined forces with the invaders. Though the man has long since turned to dry bones, the locals still grind their teeth in hatred at the mention of him."
 zgrc_common.3003.a:0 "Donate funds to cast a statue of his crimes as a warning to posterity."
 zgrc_common.3003.a_renew:0 "Restore the statue of shame, a lasting warning to later generations."
 zgrc_common.3003.b:0 "Spread the word far and wide, and speak your mind."
 zgrc_common.3003.c:0 "It is none of my concern."
 zgrc_common.3004.t:0 "A Lingering Stench"
 zgrc_common.3004.desc:0 "Passing through [ROOT.Var('zgrc_wen_county').Title.GetName], the elders point to a field of ruins and tell you: when foreign raiders crossed the border, [zgrc_wen_hero.GetName] gladly served as their vanguard and led troops to ravage his own homeland. To this day the locals long to eat his flesh."
 zgrc_common.3004.desc_late:0 "Passing through [ROOT.Var('zgrc_wen_county').Title.GetName], the elders point to a field of ruins and tell you: when foreign raiders crossed the border, [zgrc_wen_hero.GetName] gladly served as their vanguard and led troops to ravage his own homeland. The trees on his grave have long grown thick enough to embrace, yet locals passing that mound still spit upon it."
 zgrc_common.3004.a:0 "Donate funds to cast a statue, that a thousand years may spit upon it."
 zgrc_common.3004.a_renew:0 "Restore the statue, that his infamy may last ten thousand years."
 zgrc_common.3004.b:0 "Spread the word far and wide, and vent the hatred in your heart."
 zgrc_common.3004.c:0 "Hurry on your way; let it go in one ear and out the other."
 zgrc_common.4001.t:0 "Grievous Tidings"
 zgrc_common.4001.desc:0 "Terrible news arrives — your [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('zgrc_victim'))] [zgrc_victim.GetName] has met a violent end, and the killer is none other than [zgrc_killer.GetName].\n\nEven a feud nine generations old must be avenged — how much more the death of one's own kin?"
 zgrc_common.4001.a:0 "If this wrong goes unavenged, I am no man!"
 zgrc_common.4001.b:0 "Swallow the shame and bury this hatred deep."

 # 2026-11-01 汉地风俗 1.5.3（创意工坊 3812432062）并入的新键
 zgrc_common.5040.title:0 "Council Debate"
 zgrc_common.5040.desc:0 "I gathered the ministers and declared my intent that our people enter the Chinese register.\nBefore the words left my mouth, the hall was in uproar — hisses, whispers, and a few stifled laughs. The news shook the whole court."
 zgrc_common.5040.a:0 "Silence"
 zgrc_common.5041.title:0 "Council Debate"
 zgrc_common.5041.intro:0 "The hall slowly fell quiet. I looked over the ministers:\n\"This concerns our people's future. What say you all? Speak freely.\"\n"
 zgrc_common.5041.desc.1:0 "Before the words faded, [zgrc_arguer.GetName] stepped forth and wept:\n\"Your Majesty! If we enter the Han register, our children will know only the Han, and never whence we came. Is that not a disgrace to our forefathers?\""
 zgrc_common.5041.desc.2:0 "[zgrc_arguer.GetName] stepped forth, face troubled:\n\"Your Majesty! Once we take Han surnames, our children will no longer know their ancestors' names. How shall we face them below?\""
 zgrc_common.5041.desc.3:0 "[zgrc_arguer.GetName] shook his head:\n\"Your Majesty! Once the tongue is changed, our children will call themselves Han; once the names are changed, they will not know who their ancestors were. Our people's name ends here.\""
 zgrc_common.5041.a:0 "Does anyone else speak?"
 zgrc_common.5042.title:0 "Council Debate"
 zgrc_common.5042.desc.han:0 "[zgrc_supporter.GetName] stepped forth and spoke clearly:\n\"Mencius said: 'I have heard of Xia transforming the Yi, never of the Yi transforming Xia.' This act of Your Majesty does not cast off the old — it climbs higher. I beg Your Majesty to decide swiftly, and not to doubt.\""
 zgrc_common.5042.desc.hu:0 "[zgrc_supporter.GetName] stepped forth and bowed:\n\"I say it may be done. Without Han learning, accounts cannot be kept; accounts unkept, taxes are unclear; taxes unclear, the realm cannot be governed. Your Majesty sees far beyond us.\""
 zgrc_common.5042.a:0 "The Son of Heaven decides"
 zgrc_common.5043.title:0 "The Son of Heaven Decides"
 zgrc_common.5043.desc:0 "I have heard all the ministers — some fear disgrace to our forefathers, some say only Han learning can govern, some kept silent.\nYet our people have long been dyed in Han ways; in market and field, none can tell us from the Han. A name unset cannot last.\nThis day, my mind is made up —"
 zgrc_common.5043.a:0 "Enter the Chinese register"
 zgrc_common.5043.b:0 "Do not enter the Han house"
 zgrc_common.5030.title:0 "Council Debate"
 zgrc_common.5030.desc:0 "We look upon the assimilated peoples under our rule, and would receive them into Huaxia.\nThe edict is issued — and at once the hall is in uproar: some say their customs are already one with ours and they should be received; some say a matter of name and rank must not be decided lightly."
 zgrc_common.5030.a:0 "Silence"
 zgrc_common.5031.title:0 "Council Debate"
 zgrc_common.5031.intro:0 "The hall slowly fell quiet. I looked over the ministers:\n\"This concerns the line between Hua and Yi. What say you all? Speak freely.\"\n"
 zgrc_common.5031.desc.ru:0 "[zgrc_arguer.GetName] stepped forth:\n\"By the Spring and Autumn, when the Yi enter the Middle Kingdom they are counted Chinese. Their people have long been dyed in Han ways; in market and field, none can tell them from the Han. To receive them is to make sage transformation seen.\""
 zgrc_common.5031.desc.dao:0 "[zgrc_arguer.GetName] strokes his beard:\n\"The Way follows nature. They have turned to us; receive them in accord — is that not fitting?\""
 zgrc_common.5031.desc.fo:0 "[zgrc_arguer.GetName] joins his palms:\n\"All things arise by cause; the Vinaya adapts to place. They have turned to us — to receive them is to make good karma.\""
 zgrc_common.5031.a:0 "Does anyone else speak?"
 zgrc_common.5032.title:0 "Council Debate"
 zgrc_common.5032.desc:0 "[zgrc_opposer.GetName] stepped forth, hands clasped:\n\"Your Majesty! Their people have long been dyed in Han ways, yet their tongue and names remain their own. To receive them now would mix Hua and Yi, and the rites would lose their purity; and once the name is set, it cannot be undone.\""
 zgrc_common.5032.a:0 "The Son of Heaven decides"
 zgrc_common.5033.title:0 "The Son of Heaven Decides"
 zgrc_common.5033.desc:0 "I have heard all the ministers — some say their customs are one with ours and they should be received; some say a matter of name and rank must not be decided lightly.\nYet in market and field these peoples can no longer be told from the Han, and a name left unset cannot long stand.\nMy mind is made up —"
 zgrc_common.5033.a:0 "Enter the Chinese register"
 zgrc_common.5033.b:0 "Do not enter the Han house"
 zgrc_common.5050.title:0 "A Petition to the Court"
 zgrc_common.5050.desc:0 "[ROOT.Var('zgrc_requestor').Char.GetName] petitions the court, declaring that his people have long been dyed in Han ways, all speak the Han tongue and know the rites; that folk have mingled so long none can tell them from the Han.\nHe asks that his people enter the Chinese register and be counted among the many Xia. I have read the memorial and summon the ministers."
 zgrc_common.5050.a:0 "Summon the ministers"
 zgrc_common.5060.title:0 "Han Wind Howls"
 zgrc_common.5060.intro:0 "[zgrc_han_leader.GetName] has resolved to turn the whole people to Han ways: speak the Han tongue, read the classics, and enter our children in the Han registers!"
 zgrc_common.5060.desc.north:0 "I look about; in the tent are the folk who have shared raw meat and blood with me. I cannot help but remember the oath our forefathers swore beneath the Grey Wolf and White Deer.\nThe children born from now on will go read the classics and become Han. That oath will be forgotten in the end."
 zgrc_common.5060.desc.east:0 "Sea wind passes the sacred tree before the altar; before me are the people who have kept the offerings for generations. I remember the legends our ancestors left in the waves.\nThe children born from now on will read Han scriptures. The tales of the sea god and our forefathers — no one will sing them again."
 zgrc_common.5060.desc.west:0 "Camel bells beyond the oasis; in the walled town, the clansmen who have traded for generations. I remember the glory our forefathers built in the sand.\nThe children born from now on will learn the elegant speech of the Central Plains. The old barbarian tones of this oasis will scatter with the wind."
 zgrc_common.5060.desc.south:0 "In the sweltering rainforest stand the people marked with totems. I remember the wildness our ancestors left in these waters.\nThe children born from now on will learn that awkward Han speech. The totems of the rainforest will fade, slowly."
 zgrc_common.5060.desc.other:0 "I look around the familiar court; before me are the people who have followed me for years. I remember the inheritance handed down from generation to generation.\nThe children born from now on will all enter the Han registers. The old customs of our forefathers will dissolve in time."
 zgrc_common.5060.outro:0 "Looking at the Han cap and girdle laid on my desk — where do I go from here?"
 zgrc_common.5060.a:0 "Steeped in Han Ways"
 zgrc_common.5060.a_tt:0 "Accept Hanization."
 zgrc_common.5060.b:0 "Keep the Old Customs"
 zgrc_common.5060.b_tt:0 "You, your close kin, and non-ruling consorts gain #high Traditionalist#!: children stay outside the Han registers, passed down the male line."
