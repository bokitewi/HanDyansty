l_english:
 hd_story_cao_expansion:0 "Cao Cao: Expansion"
 hd_story_cao_expansion_desc:0 "With the anti-Dong coalition over, Cao Cao concentrates his expansion on one region at a time."
 HD_CAO_EXPANSION_STORY_STATUS:0 "This regional campaign checks every 60 days. AI Cao Cao may start at most one legal war per check, provided he is in fewer than three wars and the target has at most twice his current military strength. Full regional control, or no remaining strategic target and no pending regional offensive war, leads to another Expansion event. A player controlling Cao Cao declares wars manually."
 hd_cao_expansion.0001.t:0 "Expansion"
 hd_cao_expansion.0001.desc:0 "The present campaign has reached a turning point. Either the commanderies have submitted, or the remaining powers cannot yet be challenged. It is time to reconsider our direction.\n\nI spread the map before me. Yuzhou, Qingzhou, Xuzhou: where should our banners advance next?"
 hd_cao_expansion.0001.a:0 "March into Yuzhou."
 hd_cao_expansion.0001.b:0 "March into Qingzhou."
 hd_cao_expansion.0001.c:0 "March into Xuzhou."
 hd_cao_expansion.0001.d:0 "The three regions are secure. Consolidate our rule."
 hd_cao_expansion.yuzhou_tt:0 "Gain a claim on Yuzhou unless you already hold the title or a claim. Begin a 60-day regional campaign. Expansion appears again when this campaign ends."
 hd_cao_expansion.qingzhou_tt:0 "Gain a claim on Qingzhou unless you already hold the title or a claim. Begin a 60-day regional campaign. Expansion appears again when this campaign ends."
 hd_cao_expansion.xuzhou_tt:0 "Gain a claim on Xuzhou unless you already hold the title or a claim. Begin a 60-day regional campaign. Expansion appears again when this campaign ends."
 hd_cao_expansion.finished_tt:0 "Every de jure county in Yuzhou, Qingzhou and Xuzhou belongs to your realm. No further regional campaign will start automatically."
 hd_cao_expansion_cb:0 "Regional Expansion"
 hd_cao_expansion_cb_name:0 "Regional Expansion"
 hd_cao_expansion_cb_war:0 "Cao Cao's Regional Expansion War"
 hd_cao_expansion_cb_war_name:0 "Cao Cao's Regional Expansion War"
 hd_cao_expansion_cb_victory_desc:0 "Cao Cao takes the defending realm's counties within the original target kingdom. Their baron-tier vassals follow. No out-of-region land or kingdom title is taken."
 hd_cao_expansion_cb_white_peace_desc:0 "The parties make a truce. No land changes hands."
 hd_cao_expansion_cb_defeat_desc:0 "Cao Cao loses this war. A truce is established and no land changes hands."
 hd_cao_expansion_cb_invalidated_desc:0 "The war ends because Cao Cao is no longer a valid attacker, hostility has ended, or the original territorial objective is no longer available. No land changes hands."
