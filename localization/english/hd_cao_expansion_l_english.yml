l_english:
 hd_story_cao_expansion:0 "Cao Cao: Expanding His Dominion"
 hd_story_cao_expansion_desc:0 "The coalition against Dong Zhuo has dissolved. Cao Cao campaigns in one province at a time, bringing its rival rulers to heel before moving on."
 HD_CAO_EXPANSION_STORY_STATUS:0 "Cao Cao is campaigning in one province. Once it is subdued, or no suitable enemy remains there, he will consider his next advance. Cao Cao must personally order each war in this campaign."
 hd_cao_expansion.0001.t:0 "Where the Army Will March"
 hd_cao_expansion.0001.desc:0 "The generals finish reporting on the last campaign, but you do not dismiss them. The map is still spread out and the troops and provisions have been counted. It is time to decide where your drums will next be heard.\n\nYuzhou, Qingzhou, Xuzhou: easy enough names to pronounce, but taking them means marching an army every mile of the way. You ask about garrisons and supply routes. When someone begins rehearsing an old argument, you raise a hand to stop him. You know how far the previous orders have been carried out; there is no need to fill today's council with yesterday's business.\n\nIf any of the three provinces remains unconquered, the most pressing must come first. If all are yours, it is time to make your gains serve you. You turn a command tally between your fingers and wait for the final report."
 hd_cao_expansion.0001.a:0 "March into Yuzhou."
 hd_cao_expansion.0001.b:0 "March into Qingzhou."
 hd_cao_expansion.0001.c:0 "March into Xuzhou."
 hd_cao_expansion.0001.d:0 "The three provinces are ours. Put them in order."
 hd_cao_expansion.yuzhou_tt:0 "Your army will advance into Yuzhou. Once this campaign is over, you will consider your next move."
 hd_cao_expansion.qingzhou_tt:0 "Your army will advance east into Qingzhou. Once this campaign is over, you will consider your next move."
 hd_cao_expansion.xuzhou_tt:0 "Your army will turn toward Xuzhou. Once this campaign is over, you will consider your next move."
 hd_cao_expansion.finished_tt:0 "Yuzhou, Qingzhou, and Xuzhou are all yours. You will end these campaigns and put your conquered lands in order."
 hd_cao_expansion_cb_victory_desc:0 "Cao Cao annexes the enemy's entire domain: all titles held by the opposing ruler pass to Cao Cao, and all their vassals become his."
 hd_cao_expansion_cb_white_peace_desc:0 "Both sides lay down their arms and retain their former borders."
 hd_cao_expansion_cb_defeat_desc:0 "Cao Cao's campaign ends without gain. Both sides retain their former borders."
 hd_cao_expansion_cb_invalidated_desc:0 "The grounds for this war no longer apply. The campaign ends, and both sides retain their former borders."
