l_english:
 hd_peach_garden.0001.t:0 "Brotherhood at the Peach Garden"
 hd_peach_garden.0001.desc:0 "Though I have known [guan_yu.GetName] and [zhang_fei.GetName] for but a short time, we share the same aspirations. Today, we prepare wine and offerings to swear before Heaven and Earth that from this day forth we shall become sworn brothers, working in unity to support the Han House. \n\n \"We do not seek to be born on the same day or month, only to die on the same day or month.\""
 hd_peach_garden.0001.a:0 "Not seeking to live together, but dying together!"
 hd_peach_garden.0002.t:0 "Merchants Aid the Righteous"
 hd_peach_garden.0002.desc:0 "The merchant of Zhongshan [zhang_shi_ping.GetName] and [su_shuang.GetName], upon hearing the oath sworn at Peach Garden, offered to fund the righteous army with their family's wealth. They presented three thousand gold pieces and recruited three thousand light infantrymen to aid you in rescuing those in peril and helping the needy."
 hd_peach_garden.0002.a:0 "The kindness of the two righteous merchants is something that De Xu dare not forget."
 hd_liu_bei_sponsored_army:0 "Zhongshan Righteous Merchant Righteous Army"
