l_english:
 hd_peach_garden.0001.t:0 "An Oath in the Peach Garden"
 hd_peach_garden.0001.desc:0 "Only yesterday, I stood before the recruitment notice and sighed. How was I to raise men without a coin to my name? Zhang Fei's booming challenge drew me into a tavern, where he offered his own wealth to recruit local volunteers. Guan Yu arrived soon afterward, looking to enlist. When he heard what I hoped to achieve, he pulled up a seat. Before long, Yide invited us to his estate and proposed that we swear brotherhood.\n\nNow the peach trees behind his house are in full bloom. A black ox and a white horse have been prepared for the sacrifice, and incense curls above the altar. Yide, so ready yesterday to stake his fortune on our cause, has fallen solemn. Yunchang straightens his robes and waits for me to step forward.\n\nI smooth the folds of my own robe. A kinsman of the imperial house, yet all I have managed is to support my old mother by weaving mats and selling sandals. These men offer me their wealth and their lives. How could I fail them?\n\nI kneel between them. Before this incense burns away, we will be more than strangers bound for the same war."
 hd_peach_garden.0001.a:0 "We ask not to be born on the same day, but to die on the same day."
 hd_peach_garden.0002.t:0 "Our Banner Is Raised"
 hd_peach_garden.0002.desc:0 "The cups from our oath-taking have scarcely been put away when visitors arrive, willing to support our volunteer army. Zhang Shiping and Su Shuang, wealthy horse merchants from Zhongshan, are passing through Zhuo Commandery. Impressed by our meeting, they offer generous gifts of gold and silk. Word has spread among the local men, too: three thousand have already come to join us.\n\nThe courtyard soon fills with voices. Some ask where to collect their weapons; others wait to be assigned to a unit. A few simply want to know when they will be fed. I have promised to take up arms for the people. I cannot disappoint those who have now placed their lives and livelihoods in my hands.\n\nI accept the merchants' aid and order the rolls put in order. It is time to make the men beneath our banner into an army that can march."
 hd_peach_garden.0002.a:0 "Accept their generous aid and muster the volunteers."
 hd_liu_bei_sponsored_army:0 "Zhongshan Righteous Merchant Righteous Army"
