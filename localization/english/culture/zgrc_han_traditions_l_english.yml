l_english:
 # ============================================================
 # 共有传统（2 个）
 # ============================================================
 tradition_zgrc_hua_xia_li_yue_name:0 "Huaxia Rituals and Music"
 tradition_zgrc_hua_xia_li_yue_desc:0 "The beauty of attire is called Hua, and the grandeur of rites and ceremonies is why it is named Xia. This culture traces its common ancestors to Yellow Emperor Xuan Yuan and the Emperors Yan and Huang, establishing order and distinguishing kinship through rites and music."
 zgrc_hua_xia_li_yue_heritage_discount_desc:0 "The attire of the Hua-Xia people is tied to rites and music; this lineage, inheriting the legacy of China, receives a 50% reduction in cost."
 zgrc_hua_xia_li_yue_alien_penalty_desc:0 "Foreign tribes covet the Mandate of Heaven; they must uphold the rites, music, laws, and institutions of Huaxia, resulting in a significant increase in expenses."

 culture_parameter_zgrc_huayi_zhibian_effect:0 "Unlock [GetTrait('zgrc_hanjia_guandai').GetName( GetNullCharacter )]; local aristocratic families are more inclined to intermarry with one another."
 culture_parameter_zgrc_ruxiang_suisu_effect:0 "A character's customs are determined by their birthplace; however, living in a foreign land for an extended period will also lead them to adopt local ways."

 tradition_zgrc_hou_sheng_shen_si_name:0 "Prioritize livelihood and avoid unnecessary death"
 tradition_zgrc_hou_sheng_shen_si_desc:0 "Righteousness in governance, utility in administration, and benevolence toward the people; reverence for ancestors and remembrance of distant forebears to guard against death. This culture embodies a spiritual ethos characterized by long-term restraint coexisting with extreme outbursts."

 culture_parameter_zgrc_linnan_xiangying_effect:0 "During times of crisis, the entire realm will respond."
 # ============================================================
 # 区域风俗传统（18 个）
 # ============================================================
 tradition_zgrc_yandan_legacy_name:0 "Yan Dan's Legacy"
 tradition_zgrc_yandan_legacy_desc:0 "Bold in rushing to aid others, a legacy of Yan Dan's spirit—sacrificing oneself to offer help in times of peril, their heroic righteousness surpasses all under the heavens."
 tradition_zgrc_kangkai_beige_name:0 "Generous and sorrowful song"
 tradition_zgrc_kangkai_beige_desc:0 "The lands of Zhao are known for their heroic spirit, high morale, and love of righteousness—when wine is flowing, they boldly sacrifice themselves for justice."
 tradition_zgrc_qidi_jinxiu_name:0 "Qingdi's Splendid Brocade"
 tradition_zgrc_qidi_jinxiu_desc:0 "The Qi region is renowned for its exquisite ice-silk gauze, brocades, and embroidered textiles, which adorn the attire of the entire world—its silk craftsmanship surpasses all under Heaven, with wealth and court culture flourishing in equal measure."
 tradition_zgrc_sage_education_name:0 "The Sage's Teaching"
 tradition_zgrc_sage_education_desc:0 "Lu inherited the teachings of the Sage, following the lineage of Confucius's disciples. Benevolence, righteousness, integrity, and shame serve as the law for all under heaven—eager to learn and uphold ritual, upholding the orthodox tradition of the Sage's learning."
 tradition_zgrc_han_legalist_governance_name:0 "Spell of Governing the People"
 tradition_zgrc_han_legalist_governance_desc:0 "In the land of Han, Shen and Han left behind their legacy; high scholars served in office, valuing literature and law—governing the people through legalistic methods, with precise statutes and clear judgments in lawsuits."
 tradition_zgrc_wenguan_tianxia_name:0 "Cultural Eminence Under Heaven"
 tradition_zgrc_wenguan_tianxia_desc:0 "Wen'ong initiated education in Shu, his literary works crowned the realm—his writings and scholarship spread instruction, and his reputation soared far and wide."
 tradition_zgrc_jizi_legacy_name:0 "Jizi's Legacy"
 tradition_zgrc_jizi_legacy_desc:0 "Jizi's legacy spreads eastward, while Han officials govern in harmony—ritual and righteousness flourish alongside frontier administration, ensuring peace between officials and the people."
 tradition_zgrc_luhai_haoyou_name:0 "Lu Hai Hao You"
 tradition_zgrc_luhai_haoyou_desc:0 "Known as the land and sea, a fertile region among the Nine Provinces—Guangzhong is prosperous, where wealthy families gather at the Five Mounds, dominating the area with their riches and chivalrous spirit."

 tradition_zgrc_hexi_pastoral_frontier_name:0 "Commandery of the Herdsmen in Hexi"
 tradition_zgrc_hexi_pastoral_frontier_desc:0 "The grasslands and waters of Hexi are suitable for livestock breeding; the herds of Liangzhou abound throughout the realm. Through the harmonious integration of pastoral administration and frontier governance, soldiers and civilians live in mutual affection."
 tradition_zgrc_frontier_chivalry_name:0 "Borderland Righteous Warriors"
 tradition_zgrc_frontier_chivalry_desc:0 "The people of Yan, Zhao, Jin, and Henan value honor and embrace chivalry—local warriors establish themselves in their hometowns through swords and righteousness, unafraid to seek revenge."
 tradition_zgrc_zheng_wei_music_name:0 "Music of Zheng and Wei"
 tradition_zgrc_zheng_wei_music_desc:0 "The music of Zheng and Wei, the songs between mulberry groves and by the P'u River—feasts with singing and dancing, men and women mingling in social gatherings; the popularity of such vulgar music surpassed that of all other states."
 tradition_zgrc_wu_gui_fangshu_name:0 "Wu Gui Fangshu"
 tradition_zgrc_wu_gui_fangshu_desc:0 "The customs of Chen, Chu, and Wu favored sacrifices and placed great emphasis on illicit worship—divination by history's shamans and arcane arts were prevalent, with mysterious rituals widely practiced."
 tradition_zgrc_merchant_hubs_name:0 "Merchants' Thoroughfare"
 tradition_zgrc_merchant_hubs_desc:0 "Zhou, Nanyang, and Yue are all bustling hubs of commerce—cities thriving with prosperity, wealth converging, and thoroughfares connecting to every direction."
 tradition_zgrc_classics_literature_name:0 "Classics and essays"
 tradition_zgrc_classics_literature_desc:0 "Scholarly arts and literary works, the lineage of cultural education—favoring scholarly studies and valuing literary composition, the reputation of culture and education spreads to all directions."
 tradition_zgrc_hunting_warfare_name:0 "Hunting and Military Preparation"
 tradition_zgrc_hunting_warfare_desc:0 "Train military preparedness in the northwest of Beidi, and strengthen your physical prowess—hunting and archery take precedence. Master the bow and arrow thoroughly, and the frontier can be defended."
 tradition_zgrc_wuyue_swordsmanship_name:0 "Wuyue Sword Wind"
 tradition_zgrc_wuyue_swordsmanship_desc:0 "The rulers of Wu and Yue prized martial prowess, their people were fond of wielding swords, disdainful of death and quick to anger—thus the spirit of the swordsmen prevailed, with duels being a common occurrence."
 tradition_zgrc_jingchu_watermanship_name:0 "Jingchu Water Town"
 tradition_zgrc_jingchu_watermanship_desc:0 "The richness of the Jingchu, Jianghan rivers and marshes; Wu benefits from its three rivers and five lakes—water towns with boats as homes."
 tradition_zgrc_zhongyuan_houtu_name:0 "The thick earth of the Central Plains"
 tradition_zgrc_zhongyuan_houtu_desc:0 "The people of the Central Plains are steadfast in character and steady in action, maintaining disciplined formations. Their heavy armor and large shields reflect this natural disposition of a robust populace amidst chaos—the soldiers of Heluo advance like a wall, complementing the swift cavalry from the frontier regions."

 tradition_zgrc_grain_storage_name:0 "Cultivating fields with diligence"
 tradition_zgrc_grain_storage_desc:0 "To favor agriculture while detesting mere sustenance, thereby accumulating stores—prioritizing farming and stockpiling reserves to withstand poor harvests and prepare for famine."
 tradition_zgrc_baoyuan_shouyi_name:0 "Hold the Essence and Guard the Unity"
 tradition_zgrc_baoyuan_shouyi_desc:0 "Embrace the primal essence and hold fast to unity; maintain purity and tranquility, curb desires—through ingestion of elixirs and guiding exercises, extend life and promote longevity, following the Way of Huang-Lao."
