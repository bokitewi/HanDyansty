l_english:
 tradition_zgrc_hua_xia_li_yue_name:0 "Rites and Music of Huaxia"
 tradition_zgrc_hua_xia_li_yue_desc:0 "The beauty of its dress is called Hua; the greatness of its rites is called Xia. This culture honors the Yellow Emperor as its first ancestor, and uses rites and music to fix rank and to distinguish kin from stranger."
 zgrc_hua_xia_li_yue_heritage_discount_desc:0 "This [culture|E] belongs to the Huaxia lineage"
 zgrc_hua_xia_li_yue_alien_penalty_desc:0 "This [culture|E] is not of the Huaxia lineage and must first learn its rites, music and laws"
 culture_parameter_zgrc_huayi_zhibian_effect:0 "Unlocks [GetTrait('zgrc_hanjia_guandai').GetName( GetNullCharacter )], and eminent local clans are more inclined to intermarry."
 culture_parameter_zgrc_ruxiang_suisu_effect:0 "A character's customs follow their birthplace; those who dwell long as guests will also adopt the ways of their new home."
 tradition_zgrc_hou_sheng_shen_si_name:0 "Cherish Life, Honor the Dead"
 tradition_zgrc_hou_sheng_shen_si_desc:0 "Rectify virtue and use resources well to enrich life; revere the ancestors and remember the distant past to honor the dead. In ordinary times this culture is patient and self-restrained, attached to its land and loath to move; but when family or state is in peril, whole villages rise together, heedless of their own lives."
 culture_parameter_zgrc_linnan_xiangying_effect:0 "When the realm is in peril or lost land is being reclaimed, villages gather to rise in righteousness and come to join as [GetMaA('zgrc_hanjia_yiyong').GetName] [men_at_arms|E]."
 tradition_zgrc_yandan_legacy_name:0 "Legacy of Prince Dan of Yan"
 tradition_zgrc_yandan_legacy_desc:0 "Daring to rush to the aid of others: the legacy of Prince Dan of Yan. The people of this culture are brave and righteous and hold their lives lightly; when neighbors are in trouble they spare nothing to help, and they never lag behind in defending their land."
 tradition_zgrc_kangkai_beige_name:0 "Ardent Laments"
 tradition_zgrc_kangkai_beige_desc:0 "When men gather in revelry, they sing laments with fervor. The people of this culture are spirited and martial, scorning death and prizing loyalty, yet careless of their own lives."
 tradition_zgrc_qidi_jinxiu_name:0 "Brocades of Qi"
 tradition_zgrc_qidi_jinxiu_desc:0 "They weave fine silks and embroidered brocades, and are said to cap, belt, clothe and shoe all under Heaven. This culture grows rich by weaving, and its dress is imitated across the realm; its failing lies in extravagance and factionalism."
 tradition_zgrc_sage_education_name:0 "Teachings of the Sage"
 tradition_zgrc_sage_education_desc:0 "With one change Qi could reach Lu; with one change Lu could reach the Way. This culture carries on the teaching lineage of Confucius, loving learning and valuing rites, yet its forms are ample while its substance is scant."
 tradition_zgrc_han_legalist_governance_name:0 "Rule by Law and Statecraft"
 tradition_zgrc_han_legalist_governance_desc:0 "The severity of Shen and Han, the lingering harshness of their ways. This culture favors legal codes and values clerical governance, rewarding surely and punishing without fail, yet the people grow estranged through litigation."
 tradition_zgrc_wenguan_tianxia_name:0 "Letters Foremost Under Heaven"
 tradition_zgrc_wenguan_tianxia_desc:0 "Wen Weng promoted its learning, and Sima Xiangru became its master. This culture is untroubled by hardship and wins fame through literary skill; its writing is foremost under Heaven."
 tradition_zgrc_jizi_legacy_name:0 "Teachings of Jizi"
 tradition_zgrc_jizi_legacy_desc:0 "Jizi departed for Chaoxian and taught the people rites and righteousness. In this culture the people do not steal from one another and wives keep faith and chastity; gentle and compliant, officials and people live in peace."
 tradition_zgrc_luhai_haoyou_name:0 "Magnates of the Land-Sea"
 tradition_zgrc_luhai_haoyou_desc:0 "Called a sea on land, the richest soil of the Nine Provinces. In this culture people from every quarter mingle; the great families love rites and letters while the bold play the knight-errant, so its customs are far from uniform."
 tradition_zgrc_hexi_pastoral_frontier_name:0 "Hexi Horse Administration"
 tradition_zgrc_hexi_pastoral_frontier_desc:0 "Its waters and grasses suit herding, and the livestock of Liang Province are the richest under Heaven. This culture guards the frontier through horse breeding; grain is cheap, bandits are few, and officials and people are close."
 tradition_zgrc_frontier_chivalry_name:0 "Frontier Chivalry"
 tradition_zgrc_frontier_chivalry_desc:0 "They prize spirit and chivalry, and take revenge beyond measure. The people of this culture stand by the sword and by righteousness and repay every slight, yet they are thin in kindness and courtesy and quick to fall out."
 tradition_zgrc_zheng_wei_music_name:0 "Music of Zheng and Wei"
 tradition_zgrc_zheng_wei_music_desc:0 "Among the mulberries and on the banks of the Pu, men and women often gather. This culture delights in feasts, music and social ties; its failing is excess in weddings and funerals."
 tradition_zgrc_wu_gui_fangshu_name:0 "Shamans and Occult Arts"
 tradition_zgrc_wu_gui_fangshu_desc:0 "They love sacrifices and employ diviners and shamans, so their customs are steeped in spirits. In this culture shrines are everywhere and shamans abound, and the arts of cursing move secretly among them."
 tradition_zgrc_merchant_hubs_name:0 "Merchant Crossroads"
 tradition_zgrc_merchant_hubs_desc:0 "Great cities where all roads meet and wealth gathers. The people of this culture love trade and chase profit in every direction, yet they value wealth above righteousness, exalting the rich and scorning the poor."
 tradition_zgrc_classics_literature_name:0 "Classics and Letters"
 tradition_zgrc_classics_literature_desc:0 "They love the Classics and prize achievement and fame, easygoing, broad-minded and wise. In this culture the sound of strings and recitation never ceases, scholars write books and found teachings, and learning flows to every quarter."
 tradition_zgrc_hunting_warfare_name:0 "Hunting and War-Readiness"
 tradition_zgrc_hunting_warfare_desc:0 "Living close to the Rong and Di, they keep ready for war and put archery and hunting first. This culture is skilled with bow and horse and produces famous generals in numbers, yet it is rustic and lacking in rites and letters."
 tradition_zgrc_wuyue_swordsmanship_name:0 "Sword Spirit of Wu and Yue"
 tradition_zgrc_wuyue_swordsmanship_desc:0 "Their lords love valor, and their people love the sword. This culture scorns death and is quick to strike; swordsmen abound, and its spirit of single combat is foremost in the southeast."
 tradition_zgrc_jingchu_watermanship_name:0 "Waterlands of Jing and Chu"
 tradition_zgrc_jingchu_watermanship_desc:0 "Rich in the rivers and marshes of the Jiang and Han, blessed with the bounty of the Three Rivers and Five Lakes. This culture uses boats as horses and lives on fish and rice, and in naval warfare it holds every advantage of terrain."
 tradition_zgrc_zhongyuan_houtu_name:0 "Deep Soil of the Central Plains"
 tradition_zgrc_zhongyuan_houtu_desc:0 "The land of the Yellow River and the Luo, whose people are steady and earnest. This culture keeps its ranks orderly and defends like a mountain, the counterpart to the swift light horse of the frontier."
 tradition_zgrc_grain_storage_name:0 "Diligent Husbandry"
 tradition_zgrc_grain_storage_desc:0 "They love farming and stint on food and clothing to build up their stores. This culture devotes itself to agriculture; its granaries are full, and in lean years there is no famine."
 tradition_zgrc_baoyuan_shouyi_name:0 "Embrace the Origin, Keep the One"
 tradition_zgrc_baoyuan_shouyi_desc:0 "Embrace the origin and keep the one, tranquil and of few desires. This culture reveres the Way of Huang-Lao, practicing dietetics, breathing exercises and herbal medicine to nurture life, keeping the heart clear and living long."
