l_english:
 hd_liu_bei_aftermath.0001.t:0 "Reward Based on Merit"
 hd_liu_bei_aftermath.0001.desc:0 "The Yellow Turban Rebellion has finally been quelled. An imperial edict arrives from the court, stating that you have rendered exceptional service in suppressing the Yellow Turbans and offering you a path forward: the post of magistrate at Anxi County awaits your assumption. However, if you choose to remain free from official constraints, you may depart with Guan Yu and Zhang Fei to establish your own encampment."
 hd_liu_bei_aftermath.0001.a:0 "I wish to serve as the magistrate of Anxi County, guarding the land and ensuring the people's safety."
 hd_liu_bei_aftermath.0001.b:0 "The officialdom is not my calling; I shall remain by the side of those who follow righteousness."
 hd_liu_bei_aftermath.0002.t:0 "Anxi County Supervisor of the Postal Service"
 hd_liu_bei_aftermath.0002.desc:0 "Not long after you took office, the district inspector arrived at the county yamen with an air of arrogance. Under the pretext of inspection, he demanded bribes and belittled your achievements in suppressing the Yellow Turbans to nothing. Zhang Fei's hand was already on his whip, while Guan Yu silently watched you."
 hd_liu_bei_aftermath.0002.a:0 "This official robe shall be returned to the court today."


