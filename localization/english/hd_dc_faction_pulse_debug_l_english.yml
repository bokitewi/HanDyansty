l_english:
 hd_dc_faction_pulse_debug.title: "Additional Faction Annual Inspection"
 hd_dc_faction_pulse_debug.desc: "Preserve native auto-creation. When W reaches 20, each regime gains an additional annual base chance of 10%, converted via P according to 1−(1−p₀)^P; upon success, a faction is selected from legally available types at that time, with a maximum of one created. The initiator must be AI; county uprisings use authentic county qualifications. Existing factions of the same type are excluded, preventing duplicate acceleration. \n\n for enthronement-type factions must have an authentic claimant and title. Current conditions disabling Japanese factions remain in effect; upgrading peasant factions retains their native existing uprising upgrade process. This opportunity does not replace the native final creation probability and does not directly initiate rebellion or declare war."
 hd_dc_faction_pulse_debug.outside: "\n cannot be executed: The current character is not in the dynasty cycle area."
 hd_dc_faction_pulse_debug.no_title: "\n cannot be executed: The current character has no primary title."
 hd_dc_faction_pulse_debug.low_w: "\nWhen current W is below 20, faction opportunities will not increase this year during inspections."
 hd_dc_faction_pulse_debug.no_record: "\nThere are currently no annual inspection records for the primary title."
 hd_dc_faction_pulse_debug.record: "\n Regime: [scope:hd_dc_debug_pulse_realm.GetName]\n Last Inspection Year: [scope:hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_year').GetValue|0]\n Actual Sampling Probability: [scope:hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_chance').GetValue|2]% \n Result: [SCOPE.GetFlagName('hd_dc_debug_pulse_result')]"
 hd_dc_faction_pulse_debug.actor: "\nActual Initiator: [scope:hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_actor').Char.GetShortUIName]"
 hd_dc_faction_pulse_debug.county: "\nActual Initiating Commandery:[scope:hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_county').Title.GetName]"
 hd_dc_faction_pulse_debug.type: "\nActual Faction Type Identifier:[scope:hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_type').GetFlagKey]"
 hd_dc_faction_pulse_debug.claimant: "\nTrue Claimant: [scope:hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_claimant').Char.GetShortUIName]\nContested Title: [scope:hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_claimed_title').Title.GetName]"
 hd_dc_faction_pulse_debug.used: "\n This year's inspection has been used. Changing the ruler, reopening this page, or adjusting W will not restore the annual opportunity for the same primary title."
 hd_dc_faction_pulse_debug.check: "Conduct this regime's official inspection for the current year."
 hd_dc_faction_pulse_debug.check.tt: "Consumes one annual inspection opportunity for this primary title; failure does not allow a reroll. Success creates a genuine and legitimate faction, which may later initiate hostilities according to the native process. Viewing this page itself does not create a faction."
 hd_dc_extra_faction_low_w: "W is less than 20; no opportunity increased."
 hd_dc_extra_faction_missed: "Probability failed to draw"
 hd_dc_extra_faction_no_type: "Chance to summon, but no valid type can be created."
 hd_dc_extra_faction_creation_failed: "Type selected, but qualification recheck failed before creation or creation result read failed; no redraw this year."
 hd_dc_extra_faction_created: "The actual created factions have been loaded."
