l_english:
 hd_dc_faction_pulse_debug.title:0 "Annual Check for Additional Factions"
 hd_dc_faction_pulse_debug.desc:0 "Standard automatic faction creation remains active. When W reaches 20, each realm gains an additional annual base chance of 10%, adjusted by P using 1−(1−p₀)^P. A successful roll creates at most one faction, chosen from the types currently eligible. Its founder must be an AI character; commandery uprisings use the precise county-level eligibility rules. Types with an existing faction are excluded to prevent repeated acceleration.\n\nClaimant factions require a specific claimant and title. The existing restrictions on Japanese factions still apply, and peasant factions retain the standard uprising escalation process. This chance does not replace the standard final faction creation probability, and it does not directly start a rebellion or declare war."
 hd_dc_faction_pulse_debug.outside:0 "\nUnavailable: this character is outside the dynastic cycle region."
 hd_dc_faction_pulse_debug.no_title:0 "\nUnavailable: this character has no primary title."
 hd_dc_faction_pulse_debug.low_w:0 "\nW is below 20, so this year’s check grants no additional faction chance."
 hd_dc_faction_pulse_debug.no_record:0 "\nThis primary title has no annual check on record."
 hd_dc_faction_pulse_debug.record: "\n Regime: [hd_dc_debug_pulse_realm.GetName]\n Last Inspection Year: [hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_year').GetValue|0]\n Actual Sampling Probability: [hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_chance').GetValue|2]% \n Result: [SCOPE.GetFlagName('hd_dc_debug_pulse_result')]"
 hd_dc_faction_pulse_debug.actor: "\nActual Initiator: [hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_actor').Char.GetShortUIName]"
 hd_dc_faction_pulse_debug.county: "\nActual Initiating Commandery:[hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_county').Title.GetName]"
 hd_dc_faction_pulse_debug.type: "\nActual Faction Type Identifier:[hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_type').GetFlagKey]"
 hd_dc_faction_pulse_debug.claimant: "\nTrue Claimant: [hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_claimant').Char.GetShortUIName]\nContested Title: [hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_claimed_title').Title.GetName]"
 hd_dc_faction_pulse_debug.used:0 "\nThis year’s check has already been used. Changing ruler, reopening this page, or adjusting W does not restore the annual chance for the same primary title."
 hd_dc_faction_pulse_debug.check:0 "Perform this realm’s annual check."
 hd_dc_faction_pulse_debug.check.tt:0 "Uses this primary title’s single check for the year. A failed roll cannot be repeated. Success creates a normal faction, which may later begin hostilities through the usual process. Viewing this page does not create a faction."
 hd_dc_extra_faction_low_w:0 "W is below 20; no additional chance granted."
 hd_dc_extra_faction_missed:0 "Roll failed"
 hd_dc_extra_faction_no_type:0 "Roll succeeded, but no faction type is eligible."
 hd_dc_extra_faction_creation_failed:0 "A type was selected, but its eligibility recheck failed or its creation result could not be read. No further roll is allowed this year."
 hd_dc_extra_faction_created:0 "New faction recorded."
