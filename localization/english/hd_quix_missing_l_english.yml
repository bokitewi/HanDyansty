l_english:
 quix_murder_outcome.4018.exposed_scheme:0 "Unfortunately, I ran into the guards of [target.GetTitledFirstName], and my identity was exposed."
 quix_seduce_outcome.2010.b:0 "I'm just here to seek pleasure!"
 quix_seduce_outcome.2301.a.tt:0 "Become lovers with [target.GetTitledFirstName]"
 quix_seduce_outcome.3301.a.tt:0 "Become lovers with [owner.GetTitledFirstName], and enjoy this secret rendezvous."
 quix_seduce_outcome.2030.a.desc:0 "We drew near to one another in a fervent atmosphere, and desire soon overcame all reservations."
 quix_seduce_outcome.2030.alcohol.desc:0 "The wine has dulled our judgment but emboldened us both."
 quix_seduce_outcome.2030.b.desc:0 "After a bout of indulgence, we straighten our clothes and pretend nothing has happened."
 quix_seduce_outcome.2302.desc_court_owner:0 "I quietly infiltrated the court of [target.GetTitledFirstNamePossessive], waiting for an unguarded moment."
 quix_seduce_outcome.2302.desc_end:0 "This clandestine meeting ultimately became a secret we both kept together."
 quix_seduce_outcome.2302.desc_not_court_owner:0 "I managed to find a temporary lodging for [target.GetTitledFirstName] and quietly approached in the darkness of night."
 quix_seduce_outcome.3023.b:0 "Let's leave this matter until tonight."
 quix_seduce_outcome.3030.a.desc:0 "We are immersed in our own desires, making everything around us seem distant and blurred."
 quix_seduce_outcome.3030.alcohol.desc:0 "The wine cups emptied round after round, and our cheeks grew warm in turn."
 quix_seduce_outcome.3030.b.desc:0 "Before dawn, we had already donned our attire again, leaving behind only the tacit memories between us."
 quix_seduce_outcome.3031.a.desc:0 "We all know we shouldn't be like this, yet we are still drawn together by that attraction."
 quix_seduce_outcome.3031.alcohol.desc:0 "A slight intoxication gradually dispels reservations, even breaking the most cautious distance."
 quix_seduce_outcome.3031.b.desc:0 "We have agreed to keep this secret meeting hidden in our hearts."
 quix_seduce_outcome.3302.desc_court_owner:0 "I pretended to be indifferent in the court of [target.GetTitledFirstNamePossessive], yet my heart still lingered on our recent meeting."
 quix_seduce_outcome.3302.desc_end:0 "We exchanged our final glances before returning to the crowd separately."
 quix_seduce_outcome.3302.desc_not_court_owner:0 "I quietly left [target.GetTitledFirstName]'s side, making sure my footsteps sounded as usual."
 quix_seduce_outcome.3302.desc_opening:0 "After the meeting concludes, we must all face the seemingly calm gaze of the outside world."
