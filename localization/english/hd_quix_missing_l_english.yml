l_english:
 quix_murder_outcome.4018.exposed_scheme:0 "\n\nAs you turn, you strike your head on a roof beam! Dazed and seeing stars, you sit stunned on the floor. [target.GetName] sits up on the couch and stares at you in disbelief. You remain locked in that gaze until hurried footsteps outside bring you to your senses, and you stumble out through the window. That one look was enough for [target.GetSheHe] to recognize your face. Hounds are sent after you, forcing you to spend the night hiding in a marsh!"
 quix_seduce_outcome.2010.b:0 "One night of passion is enough."
 quix_seduce_outcome.2301.a.tt:0 "From that night on, the house often receives visitors after dark."
 quix_seduce_outcome.3301.a.tt:0 "From that night on, the lights in the house often burn until dawn."
 quix_seduce_outcome.2030.a.desc:0 "You and [target.GetTitledFirstName] both know what you want. Further hints would be pointless. A trusted confidant finds you a place where no one will disturb you."
 quix_seduce_outcome.2030.alcohol.desc:0 "A few cups of wine make you both bolder."
 quix_seduce_outcome.2030.b.desc:0 "\n\nYou are about to confess your feelings when [target.GetFirstName] presses a finger to your lips. What follows is passionate and direct; neither of you speaks again of promises."
 quix_seduce_outcome.2302.desc_court_owner:0 "You and [target.GetTitledFirstName] live too far apart to find an opportunity. Claiming to be setting out to offer sacrifices at a sacred mountain, you change disguises along the road and slip into [target.GetTitledFirstNamePossessive] residence, hiding in the servants' quarters."
 quix_seduce_outcome.2302.desc_end:0 "\n\nYou talk for half the night, neither admitting why you have come. Yet after you part, [target.GetFirstName] quietly makes [target.GetHerHis] way to your bedside."
 quix_seduce_outcome.2302.desc_not_court_owner:0 "You and [target.GetTitledFirstName] live too far apart to find an opportunity. Claiming to be setting out to offer sacrifices at a sacred mountain, you learn which residence shelters [target.GetHerHim], slip inside disguised as a servant, and hide in a side chamber."
 quix_seduce_outcome.3023.b:0 "What happened tonight stays here."
 quix_seduce_outcome.3030.a.desc:0 "You and [owner.GetTitledFirstName] both know what you want. Further hints would be pointless. A trusted confidant finds you a place where no one will disturb you."
 quix_seduce_outcome.3030.alcohol.desc:0 "A few cups of wine bring color to both your faces."
 quix_seduce_outcome.3030.b.desc:0 "\n\n[owner.GetSheHe|U] is about to confess [owner.GetHerHis] feelings when you press a finger to [owner.GetHerHis] lips. What follows is passionate and direct; neither of you speaks again of promises."
 quix_seduce_outcome.3031.a.desc:0 "Guests come and go at the feast, leaving you and [owner.GetTitledFirstName] little chance for a private word. Suddenly, [owner.GetSheHe] leans toward your ear and softly suggests leaving together."
 quix_seduce_outcome.3031.alcohol.desc:0 "With a little wine in you, you nod without a second thought."
 quix_seduce_outcome.3031.b.desc:0 "\n\nYou slip away from the feast unnoticed. Once far from the guests, you admit that you have been seeking such a chance all evening. At last, you no longer need to hide your desire."
 quix_seduce_outcome.3302.desc_court_owner:0 "This time, [owner.GetSheHe] actually claims to be setting out to make offerings. Changing disguises along the road, [owner.GetSheHe] slips into your residence and hides in the servants' quarters."
 quix_seduce_outcome.3302.desc_end:0 "\n\nYou talk for half the night, neither admitting why you have met. Yet after you part, you change your mind and quietly make your way to [owner.GetFirstName]'s bedside."
 quix_seduce_outcome.3302.desc_not_court_owner:0 "This time, [owner.GetSheHe] actually claims to be setting out to make offerings. Learning which residence shelters you, [owner.GetSheHe] slips inside disguised as a servant."
 quix_seduce_outcome.3302.desc_opening:0 "[owner.GetTitledFirstName] has long been drawn to you, but you live too far apart."
