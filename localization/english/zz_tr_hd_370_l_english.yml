 SG_nianhao_jianguo_tt:0 "Meaning: 'Founding the state' #weak (era name of Tuoba Shiyijian, King of Dai)#!"
 SG_nianhao_xianan:0 "Xian'an"
 SG_nianhao_xianan_tt:0 "Meaning: 'All under Heaven at peace' #weak (era name of Emperor Jianwen of Jin)#!"
