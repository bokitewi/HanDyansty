l_english:
 # English for localization/simp_chinese/zz_hd_370_l_simp_chinese.yml (bookmark "Wang Meng Attacks Yan" and army names); its era-name keys (SG_nianhao_*) are on lines 40-47 of this file, matching the Chinese line numbers.
 bm_hd_370:0 "Wang Meng Attacks Yan"
 bm_hd_370_desc:0 "The first month of the fifth year of Taihe. Last autumn Huan Wen's northern expedition reached Fangtou, and Former Yan threw everything it had into driving him back. Yan begged Qin for aid, promising the lands west of Hulao in return, then went back on its word. Murong Chui, Prince of Wu, who had won the great victory, was instead distrusted by the Grand Tutor Murong Ping and the Empress Dowager, and fled by night to Chang'an with his sons.\n\nFu Jian rode out of the city in person to welcome the famous Yan general. In winter he sent Wang Meng, General Who Assists the State, east with thirty thousand foot and horse, and Wang Meng is now besieging the Jinyong fortress at Luoyang. Murong Zang, Yan's Prince of Le'an, has marched to its relief and camped around Shimen and Xingyang.\n\nSouth of the Yangtze, the Grand Marshal Huan Wen has come home in defeat and laid the blame on Yuan Zhen, Inspector of Yu Province. Yuan Zhen in turn has seized Shouchun, rebelled against Jin, and gone over to Yan. The Son of Heaven in Jiankang is Sima Yi, later the Duke of Haixi, and every great matter at court is decided by Huan Wen.\n\n#bold Yan, the richest state east of the passes, will fall to Qin of Guanzhong within this year.#!"

 bm_hd_370_fu_jian:0 "Fu Jian"
 bm_hd_370_fu_jian_subheading:0 "Heavenly King of Great Qin"
 bm_hd_370_fu_jian_desc:0 "A Di of Lüeyang and grandson of Fu Hong. Thirteen years ago he killed his tyrannical cousin Fu Sheng and proclaimed himself Heavenly King. He raised the humbly born Wang Meng to high office, cleaned up the administration and encouraged farming, and Guanzhong has slowly grown prosperous. Yan has several times Qin's population, but the Yan court is busy tearing itself apart."

 bm_hd_370_murong_chui:0 "Murong Chui"
 bm_hd_370_murong_chui_subheading:0 "Marquis of Bindu, Yan General Fled to Qin"
 bm_hd_370_murong_chui_desc:0 "A son of Murong Huang. His victory over Huan Wen at Fangtou made his name feared north and south. The greater his merit, the less Murong Ping and Empress Dowager Kezuhun could tolerate him, until he had no choice but to flee to Chang'an with his wife and sons. Fu Jian treats him with great favor, but Wang Meng urges Fu Jian to be rid of him, warning that this man will not stay a fish in a pond for long."

 bm_hd_370_murong_wei:0 "Murong Wei"
 bm_hd_370_murong_wei_subheading:0 "Emperor of Yan"
 bm_hd_370_murong_wei_desc:0 "A son of Murong Jun, he took the throne at eleven and held it only because his uncle Murong Ke served as regent. Since Murong Ke's death, power has fallen to his great-uncle Murong Ping. Now he is twenty; the treasury is empty, the veteran generals are estranged, and the Qin army has already reached Luoyang."

 bm_hd_370_huan_wen:0 "Huan Wen"
 bm_hd_370_huan_wen_subheading:0 "Grand Marshal, Master of the Jin Court"
 bm_hd_370_huan_wen_desc:0 "A man of Longkang in Qiao. He destroyed Cheng-Han in the west and led two northern expeditions, and no one can match his power. The defeat at Fangtou has cost him prestige, and he means to restore it through the great act of deposing and enthroning a Son of Heaven. Yuan Zhen at Shouchun is not yet dealt with, and Xie An and Wang Tanzhi at court may not do as they are told."

 bm_hd_370_sima_yi:0 "Sima Yi"
 bm_hd_370_sima_yi_subheading:0 "Emperor of Jin (Duke of Haixi)"
 bm_hd_370_sima_yi_desc:0 "A son of Emperor Cheng of Jin, he was made Son of Heaven after his elder brother Emperor Ai died. In five years on the throne he has been careful in everything and has never put a foot wrong. But what Huan Wen wants is not proof of a fault, only a pretext with which to show his power."

 bm_hd_370_xie_an:0 "Xie An"
 bm_hd_370_xie_an_subheading:0 "Palace Attendant, Head of the Xie of Chen Commandery"
 bm_hd_370_xie_an_desc:0 "Of the Xie clan of Chen Commandery. In his youth he lived at ease on Mount Dong in Kuaiji and refused summons after summons, entering office only at forty as Huan Wen's Marshal. Now a Palace Attendant in Jiankang, he treats Huan Wen with courtesy and respect while keeping his own counsel. The young men of the Xie are coming of age, and his nephew Xie Xuan will one day train the Beifu Army."

 bm_hd_370_tuoba_shiyijian:0 "Tuoba Shiyijian"
 bm_hd_370_tuoba_shiyijian_subheading:0 "King of Dai"
 bm_hd_370_tuoba_shiyijian_desc:0 "Chieftain of the Tuoba Xianbei. As a young man he spent ten years as a hostage at the Later Zhao court. After returning home he established a hundred offices and fixed the laws, building Dai into a strong state on the northern steppe. He is allied with Yan by marriage and contends with Qin for the Tiefu tribe of the Hetao, and he is now past fifty."

