l_english:
 # Buddhist transmission (hd_fo, 2026-10-25): events, opinions, death reasons.

 hd_fo.0001.t:0 "A Monk from Afar"
 hd_fo.0001.desc:0 "A monk has come from far away and asks to be received. He is [hd_fo_monk.GetName]: [hd_fo_monk.Custom('HdFoBio')]\n\nShall he be kept and supported at court?"
 hd_fo.0001.a:0 "Welcome him with honour"
 hd_fo.0001.b:0 "Decline politely and let him go on"
 hd_fo.0001.c:0 "Denounce his heresy and expel him"

 hd_fo.1001.t:0 "The Benevolent Shrine"
 hd_fo.1001.desc:0 "The King of Chu sent silks to atone for his faults. The Emperor replied that the king chanted the subtle words of Huang-Lao and honoured the benevolent shrine of the Buddha, fasting and making vows to the gods. What was there to atone for? He returned the gift, to feast the lay believers and the monks."
 hd_fo.1001.a:0 "Fast and honour the Buddha"

 hd_fo.1002.t:0 "Sutras on a White Horse"
 hd_fo.1002.desc:0 "Emperor Ming dreamed of a golden man shining like the sun. His ministers said a god of the west was called the Buddha. Envoys went to India and returned with the monks Kasyapa Matanga and Zhu Falan, their sutras on a white horse, and a temple was raised at Luoyang named for it."
 hd_fo.1002.a:0 "So the Buddha came to the Middle Kingdom"

 hd_fo.1004.t:0 "Shrine to Huang-Lao and the Buddha"
 hd_fo.1004.desc:0 "In the palace gardens, altars were raised to Huang-Lao and to the Buddha together. Xiang Kai protested that this way prizes purity and non-action, loves life and hates killing; how could a ruler of unchecked desires and harsh punishments win its blessing?"
 hd_fo.1004.a:0 "Hear him out"

 hd_fo.1005.t:0 "The Perfection of Wisdom"
 hd_fo.1005.desc:0 "Lokaksema of the Yuezhi and Zhu Foshuo of India have translated the Daoxing Perfection of Wisdom and the Pratyutpanna Samadhi sutras in Luoyang. The Mahayana teaching of emptiness has reached China."
 hd_fo.1005.a:0 "Good"

 hd_fo.1009.t:0 "The Shrine at Xiapi"
 hd_fo.1009.desc:0 "A great shrine has risen at Xiapi: a bronze Buddha gilded and robed in brocade, halls holding three thousand. Those who come to hear the sutras are freed from labour service, and five thousand households have gathered. At each bathing of the Buddha, mats are laid for miles and ten thousand come to watch and eat."
 hd_fo.1009.a:0 "The whole land comes to the bathing"

 hd_fo.1015.t:0 "The Chant of Mount Yu"
 hd_fo.1015.desc:0 "On Mount Yu at Dong'e, chanting was heard among the cliffs, clear and mournful. Its cadences were taken down as Buddhist hymns and handed on to later ages."
 hd_fo.1015.a:0 "Spread the Dharma in song"

 hd_fo.1016.t:0 "The Jianchu Temple"
 hd_fo.1016.desc:0 "Kang Senghui set up an image in Jianye, and the ruler of Wu, suspicious, summoned him. He set a bronze vase on the table and prayed; after three weeks the vase rang and relics appeared in a blaze of five colours. Awed, the ruler built a pagoda and the Jianchu Temple, and the Dharma flourished in the south."
 hd_fo.1016.a:0 "The Dharma rises in the south"

 hd_fo.1019.t:0 "Destroy the Temples?"
 hd_fo.1019.desc:0 "The officials propose to tear down the realm's unsanctioned shrines, Buddhist temples included. Some ministers warn that the Buddha's power is unlike other gods: Kang Senghui's relics appeared, and the Great Emperor himself founded the temple. Destroy it lightly, and there may be regret. Destroy or spare?"
 hd_fo.1019.a:0 "Destroy them, leave nothing"
 hd_fo.1019.b:0 "Heed Kang Senghui and drop the matter"

 hd_fo.1021.t:0 "The Wonder-Working Monk"
 hd_fo.1021.desc:0 "Seeing that the lord could not grasp deep doctrine, Fotudeng won him with wonders: he filled a bowl with water, burned incense and chanted, and a blue lotus bloomed in it, dazzling to see. From then on, every great matter was put to him first."
 hd_fo.1021.a:0 "Keep the great monk at my side"

 hd_fo.1022.t:0 "The Buddha Is a Barbarian God"
 hd_fo.1022.desc:0 "Wang Du memorialised that the Buddha is a foreign god whom Chinese should not worship; since Han times only men of the Western Regions could build temples, and no Han took the tonsure. The edict replied: 'We were born on the frontier and rule the Chinese; in worship we may follow our own customs. The Buddha is a barbarian god, the very one we should serve. Let any who wish to serve the Buddha become monks.'"
 hd_fo.1022.a:0 "Now Han too may become monks"

 hd_fo.1023.t:0 "The Great Monk Passes"
 hd_fo.1023.desc:0 "[hd_fo_monk.GetName] has entered nirvana. All his life he guided barbarian lords with wonders and urged them to kill less; his disciples fill the north and the temples he founded are beyond counting."
 hd_fo.1023.a:0 "Alas"

 hd_fo.1026.t:0 "A Man and a Half"
 hd_fo.1026.desc:0 "Xiangyang has fallen and Dao'an has been taken. 'With a hundred thousand men we took Xiangyang, and all we gained was a man and a half,' it was said. 'Master An is one man, and Xi Zuochi is half.'"
 hd_fo.1026.a:0 "Bring Master An to court"

 hd_fo.1028.t:0 "The Donglin Temple"
 hd_fo.1028.desc:0 "On his way south, Huiyuan found Mount Lu calm enough to still the mind and stayed. The Inspector of Jiangzhou built him halls on the east of the mountain, the Donglin Temple. From then on he never left the mountain or set foot among common folk."
 hd_fo.1028.a:0 "Good"

 hd_fo.1030.t:0 "The Translation Hall of Xiaoyao Garden"
 hd_fo.1030.desc:0 "Kumarajiva has entered Chang'an and been honoured as State Preceptor. In the Ximing Pavilion of Xiaoyao Garden, eight hundred learned monks gather to translate with him, and the errors of older versions are swept away."
 hd_fo.1030.a:0 "Open the translation hall"

 hd_fo.1031.t:0 "The White Lotus Society"
 hd_fo.1031.desc:0 "Huiyuan and a hundred and twenty-three companions vowed before the image of Amitabha on Mount Lu to be reborn together in the Pure Land of the West. People called them the White Lotus Society.\n\n#P The Pure Land school arises; it is now open for conversion.#!"
 hd_fo.1031.a:0 "Recite the Buddha's name"

 hd_fo.1032.t:0 "Should Monks Bow to Kings?"
 hd_fo.1032.desc:0 "The court proposes to purge the monasteries and to make monks bow before the ruler. Huiyuan replies earnestly that those who leave home seek their aim in seclusion and transcend custom to reach the Way, and so do not bow to kings. Hold to the proposal, or accept his argument?"
 hd_fo.1032.a:0 "Purge them and make them bow"
 hd_fo.1032.b:0 "Accept Huiyuan's argument"

 hd_fo.1033.t:0 "The Great Nirvana Sutra"
 hd_fo.1033.desc:0 "Dharmaksema has translated the Great Nirvana Sutra, which teaches that all beings have Buddha-nature. Buddhist learning in the north is stirred anew."
 hd_fo.1033.a:0 "Good"

 hd_fo.1035.t:0 "Abolish the Buddha?"
 hd_fo.1035.desc:0 "In a revolt in Guanzhong, troops found weapons in a temple, with brewing gear, rich men's hoards and hidden women in its cellars. The chief minister urges that Buddhism is a fraud and a drain on the realm and should be wiped out.\n\nIssue the edict?"
 hd_fo.1035.a:0 "Destroy every temple, return monks to lay life"
 hd_fo.1035.b:0 "Reject the proposal"

 hd_fo.1036.t:0 "The Dharma Restored"
 hd_fo.1036.desc:0 "The new ruler has decreed the revival of Buddhism: each commandery may build a temple, and any who wish may become monks.\n\n#P Temples ruined in the persecution may now be rebuilt (see Decisions).#!"
 hd_fo.1036.a:0 "The Dharma revives"

 hd_fo.1136.t:0 "The Five Caves of Yungang"
 hd_fo.1136.desc:0 "At the request of the Sangha Overseer Tanyao, five caves have been cut into the cliffs of Wuzhou west of the capital, each with a great Buddha seventy or sixty feet high, unmatched in their age."
 hd_fo.1136.a:0 "A thousand Buddhas shine together"

 hd_fo.1037.t:0 "The Shaolin Monastery"
 hd_fo.1037.desc:0 "Batuo of India loved secluded places and often went to Mount Song. A monastery has been built for him on the north slope of Shaoshi, named Shaolin."
 hd_fo.1037.a:0 "Good"

 hd_fo.1038.t:0 "The Yongning Temple"
 hd_fo.1038.desc:0 "South of the palace gate rises the Yongning Temple, its nine-storey wooden pagoda visible a hundred li away, with more than a thousand halls and cells, the greatest temple in the capital."
 hd_fo.1038.a:0 "Magnificent"

 hd_fo.1039.t:0 "Crossing on a Reed"
 hd_fo.1039.desc:0 "Asked what merit came of building temples and copying sutras, Bodhidharma told the southern emperor: 'No merit at all.' Unheeded, he crossed the river on a reed and sat facing a wall on Mount Song. A monk stood in the snow and cut off his arm to seek the teaching; Bodhidharma named him Huike.\n\n#P The Chan school arises; it is now open for conversion.#!"
 hd_fo.1039.a:0 "Point straight at the mind"

 hd_fo.1040.t:0 "Giving Himself to the Tongtai Temple"
 hd_fo.1040.desc:0 "The Tongtai Temple has been built north of the palace city, a new gate opened to face it. The Emperor came, took off his robes, put on a monk's habit and gave himself to the temple as a servant. His ministers paid a fortune to redeem him."
 hd_fo.1040.a:0 "Dedicate it to the Three Jewels"

 hd_fo.1140.t:0 "Giving Himself Again"
 hd_fo.1140.desc:0 "Once more the Emperor has given himself to the Tongtai Temple and lectured on the sutras. Once more the ministers must pay a vast sum to redeem him, and the Confucian scholars grumble."
 hd_fo.1140.a:0 "Dedicate it to the Three Jewels"

 hd_fo.1042.t:0 "Abolish Buddhism and Daoism?"
 hd_fo.1042.desc:0 "The court has argued endlessly over the ranking of the three teachings, Buddhists and Daoists attacking each other. Some urge that the clergy drain the realm and harm the people, and that both teachings be banned, their images destroyed and their clergy returned to lay life.\n\nIssue the edict?"
 hd_fo.1042.a:0 "Ban both teachings"
 hd_fo.1042.b:0 "Reject the proposal"

 hd_fo.1043.t:0 "Into the Tiantai Mountains"
 hd_fo.1043.desc:0 "Zhiyi has left Jinling for Mount Tiantai, practising austerities on Huading Peak and teaching calm and insight on the basis of the Lotus Sutra.\n\n#P The Tiantai school arises; it is now open for conversion.#!"
 hd_fo.1043.a:0 "Calm and insight together"

 hd_fo.1143.t:0 "The Guoqing Temple"
 hd_fo.1143.desc:0 "Before he died, Zhiyi left a plan for a temple at the foot of Mount Tiantai. It has been built to his drawing, later named Guoqing, and is the home of the Tiantai school."
 hd_fo.1143.a:0 "When the temple is built, the realm is at peace"

 hd_fo.1044.t:0 "The Wise One"
 hd_fo.1044.desc:0 "Zhiyi gave the bodhisattva precepts to the prince, who granted him the title 'Wise One'. Ever after he was called Master Zhizhe."
 hd_fo.1044.a:0 "Good"

 hd_fo.1045.t:0 "The Renshou Relics"
 hd_fo.1045.desc:0 "The Emperor has sent relics to thirty provinces and ordered pagodas raised for them on the same day. Bells and chanting fill the realm."
 hd_fo.1045.a:0 "The realm rejoices"

 hd_fo.1046.t:0 "The Three Stages Banned"
 hd_fo.1046.desc:0 "Xinxing's Three Stages sect taught that in the final age all beings must be revered alike. The officials declared it contrary to scripture and the court has banned its teaching."
 hd_fo.1046.a:0 "So be it"

 hd_fo.1047.t:0 "The White Horse Temple Rebuilt"
 hd_fo.1047.desc:0 "Luoyang was burned in Dong Zhuo's disorders and the White Horse Temple with it. Now the temple has been rebuilt and incense rises again at the old sutra terrace."
 hd_fo.1047.a:0 "Good"

 hd_fo.1048.t:0 "The Dharma Restored in Kaihuang"
 hd_fo.1048.desc:0 "The new dynasty allows all who wish to become monks and has the people contribute to sutras and images. Buddhism revives across the realm.\n\n#P Temples ruined in the persecution may now be rebuilt (see Decisions).#!"
 hd_fo.1048.a:0 "The Dharma revives"

 hd_fo.1049.t:0 "The Asoka Temple"
 hd_fo.1049.desc:0 "It is said that a finger-bone relic of the Buddha lies at Meiyang in Fufeng, where King Asoka of India sent relics and raised a stupa. Monks have built a hut to guard it; men call it the Asoka Temple, later the Famen Temple."
 hd_fo.1049.a:0 "Good"

 hd_fo.1050.t:0 "The Mogao Caves"
 hd_fo.1050.desc:0 "The monk Yuezun, near Dunhuang, saw a golden light like a thousand Buddhas over Mount Sanwei and cut a cave into the cliff of Mingsha. Others followed, and the caves multiplied."
 hd_fo.1050.a:0 "The light of a thousand Buddhas"

 hd_fo.1051.t:0 "Maiji Mountain"
 hd_fo.1051.desc:0 "Maiji Mountain in Qinzhou rises alone like a stack of wheat. Caves and images have been cut into its cliff, reached by plank roads hanging in the air."
 hd_fo.1051.a:0 "Good"

 hd_fo.1052.t:0 "The Hanging Temple"
 hd_fo.1052.desc:0 "On the sheer western cliff of Jinlong Gorge on Mount Heng, a temple has been built on wooden beams, rock above and abyss below, its halls hanging in mid-air."
 hd_fo.1052.a:0 "Good"

 hd_fo.1053.t:0 "Opening the Pagoda"
 hd_fo.1053.desc:0 "The pagoda of the Famen Temple has been opened and the Buddha's bone brought out for veneration. Pilgrims crowd to see it and the temple is enlarged."
 hd_fo.1053.a:0 "Good"

 hd_fo.1056.t:0 "The Vinaya of the Southern Mountain"
 hd_fo.1056.desc:0 "Daoxuan, living on Mount Zhongnan, has devoted himself to the Four-Part Vinaya and written a guide to monastic practice.\n\n#P The Vinaya school arises; it is now open for conversion.#!"
 hd_fo.1056.a:0 "Discipline is the root"

 hd_fo.1057.t:0 "Contemplating the Dharma Realm"
 hd_fo.1057.desc:0 "Dushun has set out the contemplation of the Dharma realm from the Avatamsaka Sutra, the first thread of the Huayan school.\n\n#P The Huayan school arises; it is now open for conversion.#!"
 hd_fo.1057.a:0 "One is all"

 hd_fo.1058.t:0 "Return from the West"
 hd_fo.1058.desc:0 "After seventeen years and more than a hundred lands, Xuanzang has returned with six hundred and fifty-seven Sanskrit texts. The Yogacara teaching shines forth.\n\n#P The Yogacara school arises; it is now open for conversion.#!"
 hd_fo.1058.a:0 "Good"

 hd_fo_expelled_monk_jingxue_opinion:0 "Expelled a Foreign Monk"
 hd_fo_expelled_monk_buddhist_opinion:0 "Expelled an Eminent Monk"
 hd_fo_persecutor_opinion:0 "Persecuted Buddhism"
 hd_fo_sheshen_jingxue_opinion:0 "Gave Himself to a Temple"
 hd_fo_shatai_opinion:0 "Purged the Monasteries"
 hd_fo_dharma_friend_opinion:0 "Friend Beyond the World"
 hd_fo_revered_monk_opinion:0 "Reveres the Wonder-Worker"

 death_hd_fo_bo_yuan:0 "Killed for refusing to leave the sangha"
 death_hd_fo_bo_yuan_killer:0 "Killed by [TARGET_CHARACTER.GetUIName] for refusing to leave the sangha"
 death_hd_fo_tan_wu_chen:0 "Assassinated while seeking to travel west"
 death_hd_fo_tan_wu_chen_killer:0 "Assassinated on the orders of [TARGET_CHARACTER.GetUIName] while seeking to travel west"
