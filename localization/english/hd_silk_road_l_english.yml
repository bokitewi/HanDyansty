 # 四个实际局势子区域
 silk_road_situation_sub_region_region_silk_road_eastern_section:0 "Eastern Section"
 silk_road_situation_sub_region_region_silk_road_eastern_section_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Merchants travel west from Chang’an through the four Hexi commanderies of Wuwei, Zhangye, Jiuquan, and Dunhuang, then enter Xiyu through Yumen Pass or Yangguan. Silk, fine horses, and new knowledge pass along this road year after year.#!"
 silk_road_situation_sub_region_region_silk_road_middle_northern_route:0 "Middle Northern Route"
 silk_road_situation_sub_region_region_silk_road_middle_northern_route_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak The northern route leaves Loulan and follows the southern foothills of the northern mountains westward through Yuli, Wulei, Luntai, Qiuci, and Gumo, finally reaching Shule.#!"
 silk_road_situation_sub_region_region_silk_road_middle_southern_route:0 "Middle Southern Route"
 silk_road_situation_sub_region_region_silk_road_middle_southern_route_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak The southern route leaves Loulan and follows the northern foothills of the southern mountains westward through Qiemo, Jingjue, Hanmi, Yutian, Pishan, and Shache, finally reaching Shule.#!"
 silk_road_situation_sub_region_region_silk_road_western_section:0 "Western Section"
 silk_road_situation_sub_region_region_silk_road_western_section_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak The northern and southern routes meet at Shule. Beyond the Congling Mountains to the west, caravans enter the cities and market towns of Dayuan.#!"

 # 四座可访问市场
 visit_silk_road_market_decision_loulan:0 "$building_uuii_loulan_market_01$ #weak ([GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_middle_northern_route').MakeScope.Var('innovation').CultureInnovationType.GetName])#!"
 visit_silk_road_market_decision_khotan:0 "$building_uuii_khotan_market_01$ #weak ([GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_middle_southern_route').MakeScope.Var('innovation').CultureInnovationType.GetName])#!"
 visit_silk_road_market_decision_dayuan:0 "$building_uuii_dayuan_market_01$ #weak ([GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_western_section').MakeScope.Var('innovation').CultureInnovationType.GetName])#!"

 building_type_uuii_loulan_market_01:0 "$building_uuii_loulan_market_01$"
 building_type_uuii_loulan_market_01_desc:0 "$building_uuii_loulan_market_01_desc$"
 building_uuii_loulan_market_01:0 "Loulan Market"
 building_uuii_loulan_market_01_desc:0 "Loulan stands northwest of Puchang Lake, where the northern and southern routes through Xiyu divide. Caravans arriving from Yumen stop here for water, rest, and supplies before taking their separate roads west."
 building_uuii_loulan_market_02:0 "Flourishing Loulan Market"
 building_uuii_loulan_market_02_desc:0 "Lodgings stand in close rows outside Loulan. Wells and posting houses surround the market, serving an unbroken flow of merchants traveling east and west throughout the year."
 building_uuii_loulan_market_01_destination_desc:0 "[GetBuilding('uuii_loulan_market_01').GetName] gathers merchant caravans preparing to take the northern or southern route, where camel bells, bargaining voices, and a multitude of languages never cease day and night."

 building_type_uuii_khotan_market_01:0 "$building_uuii_khotan_market_01$"
 building_type_uuii_khotan_market_01_desc:0 "$building_uuii_khotan_market_01_desc$"
 building_uuii_khotan_market_01:0 "Yutian Market"
 building_uuii_khotan_market_01_desc:0 "Yutian’s city walls stand at the foot of the Kunlun Mountains. Renowned for fine jade, silk, and trade on the southern route, it draws merchants from distant lands to exchange both goods and knowledge."
 building_uuii_khotan_market_02:0 "Flourishing Yutian Market"
 building_uuii_khotan_market_02_desc:0 "The expanded market of Yutian spans several streets and alleys, where jade workshops, warehouses, and inns welcome merchants crossing the desert day and night."
 building_uuii_khotan_market_01_destination_desc:0 "[GetBuilding('uuii_khotan_market_01').GetName] displays fine Kunlun jade, silk, and foreign spices, making it the most splendid trading center on the southern route."

 building_type_uuii_dayuan_market_01:0 "$building_uuii_dayuan_market_01$"
 building_type_uuii_dayuan_market_01_desc:0 "$building_uuii_dayuan_market_01_desc$"
 building_uuii_dayuan_market_01:0 "Dayuan Market"
 building_uuii_dayuan_market_01_desc:0 "Caravans regroup in Dayuan after crossing the Congling Mountains. Blood-sweating horses, ironware, wine, and silk from the east change hands among its cities."
 building_uuii_dayuan_market_02:0 "Flourishing Dayuan Market"
 building_uuii_dayuan_market_02_desc:0 "Dayuan’s market has grown into a great trading center on the roads west of Congling. Pack trains fill its broad yards while horse dealers and travelers plan the next stage of their journey."
 building_uuii_dayuan_market_01_destination_desc:0 "[GetBuilding('uuii_dayuan_market_01').GetName] is renowned for fine horses and distant trade across Congling. Goods from the Han lands, Kangju, and Anxi meet here."
