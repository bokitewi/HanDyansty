 # 四个实际局势子区域
 silk_road_situation_sub_region_region_silk_road_eastern_section:0 "Eastern Section"
 silk_road_situation_sub_region_region_silk_road_eastern_section_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Merchants departed from Chang'an, traversed the Hexi Corridor through Wudi, Zhangye, Jiushan, and Dunhuang, and finally entered the Western Regions via Yumen Pass or Yangguan. Silk, horses, and new knowledge flowed continuously along this corridor. #!"
 silk_road_situation_sub_region_region_silk_road_middle_northern_route:0 "Middle Northern Route"
 silk_road_situation_sub_region_region_silk_road_middle_northern_route_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak The northern route begins at Loulan, proceeds along the northern rim of the Tarim Basin through Weili, Wulei, Luntai, Guizi and Gumu, and converges at Shule. #!"
 silk_road_situation_sub_region_region_silk_road_middle_southern_route:0 "Middle Southern Route"
 silk_road_situation_sub_region_region_silk_road_middle_southern_route_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak The southern route extends southwest from Loulan, passing through Qiemo, Jingjue, Hanimi, Yutian, Pishan and Shache, finally reaching Shule. #!"
 silk_road_situation_sub_region_region_silk_road_western_section:0 "Western Section"
 silk_road_situation_sub_region_region_silk_road_western_section_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak The northern and southern routes merge at Shule, cross the Pamir Mountains, and allow caravans to enter the oases and towns of Dayuan. #!"

 # 四座可访问市场
 visit_silk_road_market_decision_loulan:0 "$building_uuii_loulan_market_01$ #weak （[GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_middle_northern_route').MakeScope.Var('innovation').CultureInnovationType.GetName]）#!"
 visit_silk_road_market_decision_khotan:0 "$building_uuii_khotan_market_01$ #weak （[GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_middle_southern_route').MakeScope.Var('innovation').CultureInnovationType.GetName]）#!"
 visit_silk_road_market_decision_dayuan:0 "$building_uuii_dayuan_market_01$ #weak （[GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_western_section').MakeScope.Var('innovation').CultureInnovationType.GetName]）#!"

 building_type_uuii_loulan_market_01:0 "$building_uuii_loulan_market_01$"
 building_type_uuii_loulan_market_01_desc:0 "$building_uuii_loulan_market_01_desc$"
 building_uuii_loulan_market_01:0 "Loulan Market"
 building_uuii_loulan_market_01_desc:0 "Loulan guards the vital transportation hub northwest of Lop Nur. Caravans from Hexi prepare here before diverging onto the Northern and Southern Routes across the Tarim Basin."
 building_uuii_loulan_market_02:0 "The bustling market of Loulan"
 building_uuii_loulan_market_02_desc:0 "Merchants from east and west travel in endless caravans outside the city of Loulan, with warehouses, post stations, and wells expanding around the market to form a bustling commercial district."
 building_uuii_loulan_market_01_destination_desc:0 "[GetBuilding('uuii_loulan_market_01').GetName] gathers merchant caravans preparing to take the northern or southern route, where camel bells, bargaining voices, and a multitude of languages never cease day and night."

 building_type_uuii_khotan_market_01:0 "$building_uuii_khotan_market_01$"
 building_type_uuii_khotan_market_01_desc:0 "$building_uuii_khotan_market_01_desc$"
 building_uuii_khotan_market_01:0 "Yutian Market"
 building_uuii_khotan_market_01_desc:0 "The oasis of Khotan is renowned for its jade, silk, and trade along the Southern Route. Merchants from the foothills of Kunlun and distant nations exchange goods and knowledge here."
 building_uuii_khotan_market_02:0 "The flourishing market of Khotan"
 building_uuii_khotan_market_02_desc:0 "The expanded market of Yutian spans several streets and alleys, where jade workshops, warehouses, and inns welcome merchants crossing the desert day and night."
 building_uuii_khotan_market_01_destination_desc:0 "[GetBuilding('uuii_khotan_market_01').GetName] Displays Kunlun jade, silk textiles, and exotic spices, serving as the most dazzling commercial hub along the southern section of the Middle Road."

 building_type_uuii_dayuan_market_01:0 "$building_uuii_dayuan_market_01$"
 building_type_uuii_dayuan_market_01_desc:0 "$building_uuii_dayuan_market_01_desc$"
 building_uuii_dayuan_market_01:0 "Dayuan Market"
 building_uuii_dayuan_market_01_desc:0 "Caravans crossing the Pamir Mountains regroup in Dayuan. Fine horses, metalware, wine, and silk from the East are exchanged in oasis towns."
 building_uuii_dayuan_market_02:0 "The flourishing market of Dayuan"
 building_uuii_dayuan_market_02_desc:0 "The market of Dayuan has become the bustling terminus of the western trade route. The spacious cargo yard is filled with camel caravans, while horse merchants and travelers negotiate their next journey here."
 building_uuii_dayuan_market_01_destination_desc:0 "[GetBuilding('uuii_dayuan_market_01').GetName] is renowned for its fine horses and long-distance trade across the Pamirs, where goods from the East and Central Asia converge."
