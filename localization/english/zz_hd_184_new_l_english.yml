 nick_hd_xiaobawang: "the Little Conqueror"
 nick_hd_xiaobawang_desc: "Fierce beyond his peers, he was likened to Xiang Yu, the Hegemon-King of Western Chu."
 hd_sc_bawang_army: "Sons of Jiangdong"
 hd_sc_bawang.0001.t: "The Little Conqueror of Jiangdong"
 hd_sc_bawang.0001.desc: "Since crossing the Yangtze, [ROOT.Char.GetFirstName] has fought across a thousand li and broken every foe, and the heroes of Jiangdong have flocked to his banner. Now that he rules a realm of his own, his name strikes fear south of the river, and the people liken him to Xiang Yu, calling him the Little Conqueror.\n\nHearing the news, old followers bring three thousand young men to serve under him to the death."
 hd_sc_bawang.0001.a: "I shall contend with all under Heaven!"
 nick_hd_da_qiao: "Da Qiao"
 nick_hd_da_qiao_desc: "Elder daughter of Lord Qiao. She and her sister were both renowned beauties; she married Sun Ce."
 nick_hd_xiao_qiao: "Xiao Qiao"
 nick_hd_xiao_qiao_desc: "Younger daughter of Lord Qiao. She and her sister were both renowned beauties; she married Zhou Yu."
