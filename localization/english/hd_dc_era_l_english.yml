l_english:
 hd_dc_era.0001.t: "Beyond the Reach of Imperial Edicts"
 hd_dc_era.0001.desc: "The map on your desk has not changed for some time, but the documents arriving from the provinces have gradually taken a different tone. Some still acknowledge the court's calendar; others discuss only their own troops and supplies. From a few places, no reply comes at all.\n\nThese divisions did not appear today. Years of estrangement have finally become a reality no one can ignore. New alliances, campaigns, and proposals to found new states will grow from these altered relationships. You too must find your place among them."
 hd_dc_era.0001.a: "Watch how the realm changes before choosing my course."
 hd_dc_era_no_sovereignty_change_tt: "The old titles endure, but the lords now choose their own allegiances. The emperor's direct [vassals|E] become independent with their lands, leaving him only his personal domain. During the age of turmoil, [vassals|E] may Demand Independence from their liege. If the liege agrees, they separate peacefully; if the liege refuses, they still become independent, but the liege may wage a Suppress Rebellion war."
 hd_dc_era_rules_tt: "The realm immediately enters the age of contending warlords under the following conditions. Lands held by [tributaries|E] and wartime occupations do not count as territory controlled by the [son_of_heaven|E]:\n$BULLET$During a tense phase, the [son_of_heaven|E] controls fewer than 20% of the realm's de jure [counties|E]\n$BULLET$During a collapsing phase, the Chinese [hegemony|E] has no holder, or the [son_of_heaven|E] controls fewer than 40% of the realm's de jure [counties|E]\nThe age of turmoil can only end through the End the Age of Turmoil [decision|E], which requires control of 80% of the realm's de jure [counties|E], including those held by [tributaries|E]."
 hd_dc_mandate_observation_tt: "The Mandate has returned to you, but you have already received its reward during this age of turmoil and will not receive it again."
 hd_dc_mandate_once_per_era_tt: "You have not yet received the Mandate's reward during this age of turmoil, or you do not hold the Chinese [hegemony|E]"
 hd_dc_era_control_status: "Court control: [Situation.MakeScope.Var('hd_dc_controlled_counties').GetValue|0]/[Situation.MakeScope.Var('hd_dc_total_counties').GetValue|0] commanderies ([Situation.MakeScope.Var('hd_dc_control_percent').GetValue|1]%)"
 hd_dc_era_no_holder_status: "The hegemony has no holder; the control percentage does not apply"
 hd_dc_era_invalid_status: "Political data has not been verified; era evaluation is paused."
