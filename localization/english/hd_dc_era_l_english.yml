l_english:
 hd_dc_era.0001.t: "Regions where imperial edicts have not yet arrived"
 hd_dc_era.0001.desc: "The map on the desk has not been updated for a long time, yet the documents sent from various regions gradually change their addressees. Some still acknowledge the court's reign title, others only discuss local military supplies, and several areas have yet to respond. \n\nThese boundaries were not created today. Years of separation have finally become an unavoidable situation. New alliances, campaigns, and discussions on establishing states will emerge from these already altered relationships."
 hd_dc_era.0001.a: "First survey the realm, then decide your path."
 hd_dc_era_no_sovereignty_change_tt: "The era of warlords dividing the realm has been confirmed, establishing the current political landscape and unlocking corresponding mechanics. This transition between eras will not transfer titles, alter direct vassals, or automatically establish tributary relationships."
 hd_dc_era_rules_tt: "If hegemony remains unclaimed for 12 months, or if actual territorial control falls below 50% of the fixed Han legal commanderies for a continuous period of 24 months, the era transitions to Warlords Contending for Supremacy. Tribute and military occupation do not count toward control rate. Control must be restored to at least 65%, and maintained for 60 months without hegemony succession wars, before exiting; restarting succession wars will reset the recovery period."
 hd_dc_mandate_observation_tt: "The transfer of power proceeds as scheduled. During this period of regional warlords, each individual may receive the reward for proclaiming the Mandate of Heaven only once; subsequent acquisition of hegemony is not subject to this restriction. Whether the era of regional warlordism has ended will be determined separately based on actual territorial control and sustained stability duration."
 hd_dc_mandate_once_per_era_tt: "You have not yet claimed this Heavenly Mandate reward, or you do not currently hold the Hegemony of China."
 hd_dc_era_control_status: "Court-controlled: [Situation.MakeScope.Var('hd_dc_controlled_counties').GetValue|0]/[Situation.MakeScope.Var('hd_dc_total_counties').GetValue|0] commanderies ([Situation.MakeScope.Var('hd_dc_control_percent').GetValue|1]%)"
 hd_dc_era_no_holder_status: "Hegemony currently unclaimed; control rate not applicable"
 hd_dc_era_invalid_status: "Political data has not yet been verified; era determination is suspended."
 situation_dynastic_cycle_phase_chaos_desc_short: "The authority of the court can no longer maintain order across the realm; factions advance or retreat based on their actual territories, alliances, and military strength."
 situation_dynastic_cycle_phase_chaos_desc: "The $situation_dynastic_cycle_phase_chaos_desc_short$\n\n$hd_dc_era_rules_tt$\n\n era confirms that it does not depose the Son of Heaven, does not destroy titles, nor alters vassal and tributary relationships. Independence, enthronement, and conquest must be achieved through corresponding political actions or actual warfare. The number of Crisis Points measures the pressure endured by order and does not independently determine whether the world is divided."
