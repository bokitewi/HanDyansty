embattle_volly_tactic_modifier:0 "Volley Fire Tactics"
embattle_volly_tactic_modifier_desc:0 "The legion unleashes a volley of arrows like a downpour, breaking the enemy's morale before the battle even begins."
embattle_charge_tactic_modifier:0 "Charge Tactics"
embattle_charge_tactic_modifier_desc:0 "The legion charges forward like a raging tide, heedless of life or death."
embattle_stand_fast_tactic_modifier:0 "Defensive Tactics"
embattle_stand_fast_tactic_modifier_desc:0 "The legion stands firm like a mountain, refusing to yield an inch."
embattle_advance_tactic_modifier:0 "Advance Tactics"
embattle_advance_tactic_modifier_desc:0 "The legion advances like an iron tide, pressing forward in successive waves."
embattle_harass_tactic_modifier:0 "Harassment Tactics"
embattle_harass_tactic_modifier_desc:0 "The army harasses the enemy like a darting snake, striking and vanishing without warning."

embattle_tactic_diversity_modifier:0 "Tactical Diversity"
embattle_tactic_diversity_modifier_desc:0 "This commander possesses a diverse array of tactics."
embattle_tactic_counter_modifier:0 "Tactics are countered"
embattle_tactic_counter_modifier_desc:0 "The commander's tactics are countered by the enemy."

embattle_potshots_tactic_modifier:0 "Wild Shooting"
embattle_potshots_tactic_modifier_desc:0 "The legion is like a blind archer firing arrows at random, with no discipline or order whatsoever."
embattle_reckless_charge_tactic_modifier:0 "Reckless Charge Tactics"
embattle_reckless_charge_tactic_modifier_desc:0 "This legion is like an out-of-control beast, inflicting damage on enemies while also harming itself."
embattle_confused_orders_tactic_modifier:0 "Confused Orders"
embattle_confused_orders_tactic_modifier_desc:0 "The legion is leaderless, with each unit fighting independently."
embattle_timid_advance_tactic_modifier:0 "Timid Advance"
embattle_timid_advance_tactic_modifier_desc:0 "The army moves as though treading on thin ice, unable to advance or retreat with confidence."
embattle_disorganised_harass_tactic_modifier:0 "Unorganized Harassment Tactics"
embattle_disorganised_harass_tactic_modifier_desc:0 "The legion swarms out like disordered ants from their nest, harassing without order."

