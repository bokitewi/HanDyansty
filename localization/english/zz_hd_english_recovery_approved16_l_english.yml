l_english:
 appoint_a_righteous_caliph_decision_mutazila_variant:0 "Choose a Righteous Caliph through Reason"
 appoint_a_righteous_caliph_decision_mutazila_variant_desc:0 "Our religious leader is distant from the people and understands little of our teachings, leaving him unfit to lead the ummah. Reason dictates that the caliphate should belong to the worthy. I must appoint a righteous caliph who can truly distinguish right from wrong."
 create_dar_al_islam_decision_tooltip:0 "Unite the sects, establish the House of Islam, and make it your [primary_title|E]"
 demand_faction_switch_bribe_large_desc:0 "Offer a lavish gift of gold to persuade them to join another faction."
 demand_faction_switch_bribe_medium_desc:0 "Offer a substantial payment to persuade them to join another faction."
 demand_faction_switch_bribe_small_desc:0 "Offer a small payment to persuade them to join another faction."
 demand_faction_switch_force_desc:0 "Intimidate them into joining another faction."
 demand_faction_switch_hook_desc:0 "Use your hold over them to compel them to join another faction."
 fp3_name_read_in_friday_prayer_decision:0 "Proclaim a Name at Friday Prayer"
 fp3_name_read_in_friday_prayer_decision_desc:0 "The name proclaimed at Friday prayer is the clearest statement of my allegiance. Before the assembled faithful, I must declare whom I recognize as the rightful caliph."
 fp3_promote_persian_scripture_decision:0 "Promote Persian Scripture"
 hd_debug_prepare_youzhou_tuqi_decision_confirm:0 "Organize them at once!"
 hd_debug_train_xianzhenying_decision_confirm:0 "Begin training at once!"
 hd_leave_defensive_league_decision_confirm:0 "We part ways here!"
 hd_unify_defensive_league_decision_confirm:0 "Unite as one!"
 liberty_war_victory_defender_desc_admin:0 "Your [defender.Custom('GetGovernmentAuthority')] is reduced by one level, and you owe every member of the [liberty_faction|E] a [favor|E]."
 liberty_war_victory_defender_desc_tribal:0 "Your [defender.Custom('GetGovernmentAuthority')] within the tribe is reduced by one level. Your tribespeople lose faith in you, and you owe every member of the [liberty_faction|E] a [favor|E]."
 liberty_war_victory_desc_admin:0 "The [defender.Custom('GetGovernmentAuthority')] of [defender.GetPrimaryTitle.GetName] is reduced by one level, and [defender.GetShortUIName] owes every member of the [liberty_faction|E] a [favor|E]."
 liberty_war_victory_desc_tribal:0 "The [defender.Custom('GetGovernmentAuthority')] within the tribes of [defender.GetPrimaryTitle.GetName] is reduced by one level, and [defender.GetShortUIName] owes every member of the [liberty_faction|E] a [favor|E]."
 petition_ceremonial_liege_decision_tooltip:0 "Present a petition to your [ceremonial_liege|E]"
 struggle_persia_ending_assertion_decision:0 "Restore the Caliphate"
 struggle_persia_ending_assertion_decision_tooltip:0 "Defend the rightful caliph and trample the enemies of the ummah into the dust."
 struggle_persia_ending_foundation_decision:0 "The Humiliation of the Abbasids"
 struggle_persia_ending_foundation_decision_tooltip:0 "The old caliphate has exhausted both its time and our patience. The ummah calls for stability and a new leader."
 struggle_persia_ending_rekindle_iran_decision:0 "Persian Revival"
 struggle_persia_ending_rekindle_iran_decision_tooltip:0 "The peoples of Persia have long suffered under foreign domination. They must be reminded of Persia's strength."
 submit_to_the_great_khan_decision_desc:0 "My lands will turn to ash, my people to dry bones, and my body will be hacked to pieces... There is no other way: I must beg the Great Khan, conqueror of the world, to spare my life."
 trait_SanGong_GongWei_1:0 "Empress"
 trait_SanGong_Sizi:0 "Heir"
 trait_SanGong_TaiHuangTaihou:0 "#bold Grand Empress Dowager#!"
 trait_SanGong_Taihou:0 "#bold Empress Dowager#!"
 trait_character_interloper_of_zhou_dynasty:0 "Interloper"
 trait_character_interloper_of_zhou_dynasty_desc:0 "You belong to no party of the Zhou royal house and refuse to take sides, preferring to stir up turmoil and profit from the confusion."
 trait_character_involve_neutral_of_zhou_dynasty:0 "Neutral"
 trait_character_involve_neutral_of_zhou_dynasty_desc:0 "You take no side in the struggle over the Zhou royal house, keeping yourself above the fray. Whoever wins or loses is of little concern to you."
 trait_character_involve_opponents_of_zhou_dynasty:0 "Rule by Might"
 trait_character_involve_opponents_of_zhou_dynasty_desc:0 "You have long resented the Zhou royal house, regard the Son of Heaven's title as an empty name, and are determined to resist him."
 trait_character_involve_supporters_of_zhou_dynasty:0 "Kingly Rule"
 trait_character_involve_supporters_of_zhou_dynasty_desc:0 "You uphold the legitimacy of the Zhou royal house and willingly support the Son of Heaven, honoring the king and repelling foreign peoples without wavering."
 trait_scholar:0 "Scholar"
 trait_scholar_desc:0 "You are well versed in the classics and histories, devote yourself diligently to learning, and keep books as your constant companions."
 trait_tk_fictional_character01:0 "Fictional Character (I)"
 trait_tk_fictional_character01_desc:0 "This character comes from a historical romance, with much of their life and deeds embellished by later writers."
 trait_tk_fictional_character02:0 "Fictional Character (II)"
 trait_tk_fictional_character02_desc:0 "This character comes from plays and storytellers' tales, their image shaped by storytellers and audiences alike."
 trait_tk_historical_character01:0 "Historical Character (I)"
 trait_tk_historical_character01_desc:0 "This character is based on a figure recorded in historical sources, whose life can be traced through surviving evidence."
 trait_tk_historical_character02:0 "Historical Character (II)"
 trait_tk_historical_character02_desc:0 "This character is based on a figure recorded in historical sources, whose deeds have been passed down to posterity."
 trait_tk_historical_character03:0 "Historical Character (III)"
 trait_tk_historical_character03_desc:0 "This character is based on a figure recorded in historical sources, whose reputation has endured through the ages."
 tribute_mission_decision_dar_al_islam_desc:0 "The [GetTitleByKey('h_dar_al_islam').GetHolder.GetTitleAsName] of [GetTitleByKey('h_dar_al_islam').GetDefinitiveName] casts a heavy shadow across our horizon, silently demanding the deference we owe. Paying tribute may strengthen our legitimacy and perhaps bring other benefits..."
