l_english:
 hd_fengying_cao_warfare_unlocked:0 "From now on, in the name of welcoming the Son of Heaven, you may raise troops to call to account whoever holds Chang'an."
 hd_cao_fengying_cb:0 "Hold the Emperor Hostage to Command the Lords"
 hd_cao_fengying_cb_name:0 "Hold the Emperor Hostage to Command the Lords"
 HD_CAO_FENGYING_WAR_NAME:0 "Cao Cao's War to Seize Chang'an"
 hd_cao_fengying_victory_desc:0 "Cao Cao seizes Jingzhao and its counties. If Xuchang is still in his hands, he welcomes the Son of Heaven to reside at Xu and directs the government as Regent; the Son of Heaven's directly held lands and the lords all come under his control, while the ministers and officials remain directly under the Son of Heaven. If Xuchang has been lost, he holds Chang'an for now and will welcome the imperial carriage once Xuchang is retaken."
 hd_cao_fengying_no_victory_desc:0 "Cao Cao fails to seize Chang'an. The claim on Sili remains, and once the [truce|E] expires, he may try again."
 hd_cao_fengying_start_war_decision:0 "Hold the Emperor Hostage to Command the Lords"
 hd_cao_fengying_start_war_decision_desc:0 "Jingzhao is still in another's hands. Unless Chang'an is taken first, 'welcoming the Emperor' is nothing but empty words."
 hd_cao_fengying_start_war_decision_tooltip:0 "Go to war against whoever holds Jingzhao in the name of 'Hold the Emperor Hostage to Command the Lords'."
 hd_cao_fengying_start_war_decision_confirm:0 "On to Chang'an!"
