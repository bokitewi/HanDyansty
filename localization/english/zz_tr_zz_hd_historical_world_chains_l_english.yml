l_english:
 hd_fengying_cao_warfare_unlocked:0 "You may now wage war in the name of welcoming the Son of Heaven against anyone who holds him captive. If no one holds him captive, you may request his presence directly."
 hd_cao_fengying_cb:0 "Control the Emperor to Command the Lords"
 hd_cao_fengying_cb_name:0 "Control the Emperor to Command the Lords"
 HD_CAO_FENGYING_WAR_NAME:0 "Cao Cao's War to Welcome the Son of Heaven"
 hd_cao_fengying_victory_desc:0 "If the opponent holds Henan, Cao Cao gains the Duchy of Henan and the counties they hold within it. Cao Cao then takes control of the Son of Heaven: his former captor loses office and becomes independent with their remaining lands. The Emperor's personal lands and the lords come under Cao Cao's authority, and the Emperor moves to Cao Cao's seat. The Han Empire title does not change hands."
 hd_cao_fengying_no_victory_desc:0 "Cao Cao fails to bring the Son of Heaven into his custody. He may try again once the [truce|E] expires."
 hd_cao_fengying_start_war_decision:0 "Control the Emperor to Command the Lords"
 hd_cao_fengying_start_war_decision_desc:0 "The Son of Heaven is still beyond your grasp. Until you bring the imperial carriage here, talk of welcoming him amounts to empty words."
 hd_cao_fengying_start_war_decision_tooltip:0 "Declare war on the Emperor's captor in the name of controlling the Emperor to command the lords. If no one holds him captive, declare war on the Emperor himself."
 hd_cao_fengying_start_war_decision_confirm:0 "Welcome the Son of Heaven!"
