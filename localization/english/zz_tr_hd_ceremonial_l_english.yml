l_english:
 # Ceremonial Son of Heaven (2026-10-24): Restore the Emperor / Install a New Emperor factions
 hd_cer_restore_faction_name:0 "Restore the Emperor"
 hd_cer_claimant_faction_name:0 "Install a New Emperor"
 hd_cer_restore_faction_desc:0 "Members of the $restore_ceremonial_liege_faction_name$ [faction|E] resent the regent's grip on the court and demand that the Mandate be returned to the [ceremonial_liege|E].\n\n#S Ultimatum#!\nThe [ceremonial_liege|E] takes back the Mandate of Heaven; the regent gives up the Hegemony and swears fealty with all their lands; the ceremonial title is abolished"
 hd_cer_claimant_faction_desc:0 "Members of the $ceremonial_claimant_faction_name$ [faction|E] want to seat someone else on the ceremonial throne.\n\n#S Ultimatum#!\nThe [claimant|E] replaces the current [ceremonial_liege|E]; the regent stays in power"
 hd_cer_restore_reward_tt:0 "The [ceremonial_liege|E] takes back the Mandate of Heaven; the regent gives up the Hegemony and swears fealty with all their lands; the ceremonial title is abolished"
 hd_cer_restore_war_name:0 "War to Restore [CLAIMANT.GetTitledFirstName]"
 hd_cer_restore_war_victory_desc:0 "[defender.GetShortUIName|U] gives up the Mandate, is [imprisoned|E], and swears fealty to the [ceremonial_liege|E] with all their lands."
 hd_cer_restore_demand_opening:0 "Restore the Emperor"
 hd_cer_restore_demand_desc:0 "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nThe Son of Heaven sits above us, yet you hold the regalia and every decree leaves your gate. We have raised our banners together to ask that you return the Mandate and let [ceremonial_liege.GetTitledFirstName] rule again.\n\nStep down to your fief and your house may yet be spared. Refuse, and we will meet on the battlefield."
 hd_cer_restore_demand.a:0 "The Mandate belongs to His Majesty. I will step down."
 hd_cer_restore_demand.b:0 "How dare you threaten me!"
 hd_cer_restore_accepted_opening:0 "Restore the Emperor: Demand Accepted"
 hd_cer_restore_accepted_desc:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nNot a day has passed since I took up the regency that I did not labor for the realm, and still you doubt my loyalty. So be it. The Mandate returns to [ceremonial_liege.GetTitledFirstName], and I return to my fief. I hope you know what you are doing."
 hd_cer_restore_accepted.a:0 "The emperor is restored. The realm is fortunate."
 hd_cer_restore_refused_opening:0 "Restore the Emperor: Demand Refused"
 hd_cer_restore_refused_desc:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nInsolence! I swept the court clean of traitors while you sat idle, and now you lecture me? Rebellion in the emperor's name is still rebellion. If it is war you want, you shall have it!"
 hd_cer_restore_refused.a:0 "Then it is war!"
 hd_cer_restore_refused.b:0 "There is nothing left but to fight."
 hd_cer_restore_notice_opening:0 "Restore the Emperor"
 hd_cer_restore_notice_desc:0 "[faction_leader.Custom2('AppropriateGreetingPositive', ROOT.Char)]\n\n[faction_target.GetTitledFirstName] has ruled the court as they please for too long, and the Son of Heaven is a figurehead. Our proclamation is ready and will reach their desk within days, asking them to return the Mandate. Should they refuse, I hope you will stand with me against this traitor."
 hd_cer_restore_notice.a:0 "I will follow your lead."
 hd_cer_restore_victory.t:0 "The Emperor Restored"
 hd_cer_restore_victory.desc:0 "[defender.GetTitledFirstName] has been defeated and taken. The one who ruled the court as they pleased now sits in a cell. The palace gates open again, [ceremonial_liege.GetTitledFirstName] takes the throne, and the ministers line up to pay homage once more.\n\nThe Son of Heaven holds my hand for a long while without a word. From now on the whole realm will know that it was I who won back the Mandate for the throne."
 hd_cer_restore_victory.a:0 "Long live His Majesty!"
 hd_cer_restored_msg:0 "The Son of Heaven Reclaims the Mandate"
 hd_cer_restored_msg_desc:0 "[hd_cer_restored_tianzi.GetTitledFirstName] takes back the Mandate of Heaven; [hd_cer_old_regent.GetTitledFirstName] gives up the Hegemony and becomes a vassal."
