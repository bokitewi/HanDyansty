l_english:
 WJ_rf_grant:0 "Enfeoff as Duke"
 WJ_rf_grant_desc:0 "Carve out three commanderies to establish a hereditary fief for this person."
 WJ_rf_request_decision:0 "Petition for a Dukedom"
 WJ_rf_request_decision_desc:0 "When the Son of Heaven is in my hands and the high posts of the Secretariat are filled with my protégés and former subordinates, ordinary ranks and stipends no longer suffice as reward. Then is the time to ask the Son of Heaven to carve out commanderies and found a state, so that my house may hold a domain for generations."
 WJ_rf_request_decision_tooltip:0 "Ask the Son of Heaven to carve out three commanderies and found a hereditary fief for you"
 WJ_rf_request_decision_confirm:0 "Petition for a fief!"
 WJ_rf_expand_decision:0 "Petition to Expand the Fief"
 WJ_rf_expand_decision_desc:0 "The fief is newly founded and its lands still narrow. Only if a neighboring commandery is also brought within it will this foundation stand secure."
 WJ_rf_expand_decision_tooltip:0 "Annex a commandery bordering the fief into it"
 WJ_rf_expand_decision_confirm:0 "Petition for more land!"
 WJ_rf_promote_decision:0 "Petition to Be Made King"
 WJ_rf_promote_decision_desc:0 "The fief grows ever larger, and no one at court can stand shoulder to shoulder with me. A mere dukedom no longer befits my present power; one step more, and I may be raised to king."
 WJ_rf_promote_decision_tooltip:0 "Be raised to king; your existing fief remains yours"
 WJ_rf_promote_decision_confirm:0 "Raise me to king!"
 WJ_rf_pick:0 "Drawing the Bounds of the Fief"
 WJ_rf_pick_desc:0 "The map is spread out on the table, and the borders of [ROOT.Char.MakeScope.Var('wj_rf_target').Char.GetUIName]'s fief are to be drawn among these commanderies.\n\n[ROOT.Char.Custom('WJ_rf_step_desc')]\n\nOnce the commanderies join the fief, most of the existing senior officials keep their posts, but henceforth answer to the fief."
 WJ_rf_success:0 "The Edict Is Issued"
 WJ_rf_success_desc:0 "The edict has been issued; the bounds and name of [wj_rf_beneficiary.GetUIName]'s fief are henceforth entered in the court registers."
 WJ_rf_failed:0 "The Enfeoffment Stalls"
 WJ_rf_failed_desc:0 "Though the edict was drafted, the handover of the commanderies could not be carried out as agreed. The matter of the fief must be set aside for now; the court has lost nothing by it, and it may be raised again another day."
 WJ_rf_duke_rank:0 "Duke"
 WJ_rf_real_duke_name:0 "Duke of [ROOT.Char.MakeScope.Var('wj_rf_owned_title').Title.GetNameNoTierNoTooltip]"
 WJ_rf_real_king_name:0 "King of [ROOT.Char.MakeScope.Var('wj_rf_owned_title').Title.GetNameNoTierNoTooltip]"
 WJ_rf_stage_0:0 "First, choose the province where the fief will lie."
 WJ_rf_stage_1:0 "Next, choose the commandery for the fief capital."
 WJ_rf_stage_2:0 "Next, choose another commandery, which must border the capital's commandery."
 WJ_rf_stage_3:0 "Finally, choose one more commandery, which must border those already chosen. Once chosen, the fief is established."
 WJ_rf_stage_expand:0 "Choose a commandery bordering the fief to annex into it."
 WJ_rf_name_sili:0 "Zhou"
 WJ_rf_name_yuzhou:0 "Han"
 WJ_rf_name_yanzhou:0 "Lu"
 WJ_rf_name_qingzhou:0 "Qi"
 WJ_rf_name_xuzhou:0 "Xu"
 WJ_rf_name_youzhou:0 "Yan"
 WJ_rf_name_jizhou:0 "Zhao"
 WJ_rf_name_liangzhou:0 "Qin"
 WJ_rf_name_yangzhou:0 "Wu"
 WJ_rf_name_jingzhou:0 "Chu"
 WJ_rf_name_yizhou:0 "Shu"
 WJ_rf_name_jiaozhou:0 "Yue"
 WJ_rf_name_bingzhou:0 "Jin"
 WJ_rf_request_valid_tt:0 "You must hold the post of Grand Tutor, Chancellor, Grand General or one of the Three Excellencies, already be a marquis, and have the Son of Heaven as your [puppet|E]; the Director of the Secretariat must be you or one of your protégés or retainers, and at least two of the three posts of Palace Attendant, Grand Marshal and Prefect of the Secretariat must be held by your protégés or retainers"
 WJ_rf_promote_valid_tt:0 "The Son of Heaven's title must be of [hegemony|E] tier and he must be your [puppet|E]; the Director of the Secretariat must be you or one of your protégés or retainers; your fief must contain at least one hundred counties"
 WJ_rf_no_pending_tt:0 "There is no enfeoffment matter currently awaiting decision"
 WJ_rf_expand_liege_tt:0 "You are still a subject of the Son of Heaven"
 WJ_rf_expand_cooldown_tt:0 "Three years have passed since your enfeoffment or last expansion"
