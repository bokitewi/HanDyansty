 HuangDi_miaoshi.081.a:0 "Upholding righteousness and promoting good, yet kind and cut off young, is called Huai; posthumous name #Y 'Huai'"
 HuangDi_miaoshi.081.b:0 "Dying young in mid-years, wilful in conduct and burdening the sacrifices, is called Dao; posthumous name #Y 'Dao'"
 HuangDi_miaoshi.081.c:0 "Meeting calamity in the state and bringing harm upon the people is called Min; posthumous name #Y 'Min'"
 HuangDi_miaoshi.081.d:0 "Meeting calamity in the state and bringing harm upon the people is called Min; posthumous name #Y 'Min'"
 HuangDi_miaoshi.081.e:0 "Orphaned early and cut off young, respectful and kind yet cut off young, is called Ai; posthumous name #Y 'Ai'"
 HuangDi_miaoshi.081.f:0 "Never openly ruling the state, his hidden efforts unfulfilled, is called Yin; posthumous name #Y 'Yin'"
 HuangDi_miaoshi.081.g:0 "Fond of altering the old and lightly changing established law is called Yi; posthumous name #Y 'Yi'"
 HuangDi_miaoshi.081.h:0 "Deeply mindful of his faults, cautious and anxious, is called Ju; posthumous name #Y 'Ju'"
 HuangDi_miaoshi.081.i:0 "Not born in the state, yet his fame spread far, is called Sheng; posthumous name #Y 'Sheng'"
 HuangDi_miaoshi.081.j:0 "His plans unfulfilled, stopping before he could act, is called Xi; posthumous name #Y 'Xi'"
 HuangDi_miaoshi.081.k:0 "Failing to carry out righteousness, lost and unbrotherly, is called Ding; posthumous name #Y 'Ding'"
 HuangDi_miaoshi.081.l:0 "Slow to act yet calm and at ease is called Shu; posthumous name #Y 'Shu'"
 HuangDi_miaoshi.081.m:0 "Cut off in youth, humble and keeping to stillness, is called Chong; posthumous name #Y 'Chong'"
 HuangDi_miaoshi.081.n:0 "Substance outweighing refinement, reverent but not in keeping with the rites, is called Ye; posthumous name #Y 'Ye'"
 HuangDi_miaoshi.081.o:0 "Meager and neglecting the rites, frugal beyond propriety, is called Jian; posthumous name #Y 'Jian'"
 HuangDi_miaoshi.081.p:0 "Name and reality in accord, balanced and without guile, is called Zhi; posthumous name #Y 'Zhi'"
 HuangDi_miaoshi.081_d:0 "When the reading reaches the late emperor's age, the ritual official pauses briefly. You look down at the record of his life and only then notice that the page on your desk is shorter even than the eulogy prepared in advance.\n\nMuch was left undone before there was no one left to ask. Someone tries to speak of the hopes once held for him, then breaks off midway and asks you instead to look at the candidate posthumous names.\n\nYou read each of the characters in turn. Even so short a span of years has come to the moment when it must be given a name to leave behind."
 HuangDi_miaoshi.081_t:0 "Posthumous Name of a Young Ruler"
 HuangDi_miaoshi.082.a:0 "Cruel and without kin is called Li; set the posthumous name as $Color_EHuang$ #bold Emperor Li"
 HuangDi_miaoshi.082.b:0 "Blocked off and closed to counsel is called You; set the posthumous name as $Color_EHuang$ #bold Emperor You"
 HuangDi_miaoshi.082.c:0 "Casting off the rites and estranging the people is called Yang; set the posthumous name as $Color_EHuang$ #bold Emperor Yang"
 HuangDi_miaoshi.082.d:0 "In disorder yet not destroyed is called Ling; set the posthumous name as $Color_EHuang$ #bold Emperor Ling"
 HuangDi_miaoshi.082.e:0 "Indulging in pleasure and neglecting government is called Huang; set the posthumous name as $Color_EHuang$ #bold Emperor Huang"
 HuangDi_miaoshi.082.f:0 "Relying on power and acting wantonly is called Li; set the posthumous name as $Color_EHuang$ #bold Emperor Li"
 HuangDi_miaoshi.082.g:0 "Name and reality at odds is called Miu; set the posthumous name as $Color_EHuang$ #bold Emperor Miu"
 HuangDi_miaoshi.082.h:0 "Frivolous in government and decree is called Zao; set the posthumous name as $Color_EHuang$ #bold Emperor Zao"
 HuangDi_miaoshi.082.i:0 "Indulging desire and abandoning the rites is called Dang; set the posthumous name as $Color_EHuang$ #bold Emperor Dang"
 HuangDi_miaoshi.082.j:0 "Cruel and wanton in killing is called Bao; set the posthumous name as $Color_EHuang$ #bold Emperor Bao"
 HuangDi_miaoshi.082_d:0 "The officials ask you to rule once more on the praise, blame, and sacrifices of a deposed emperor of the former dynasty. This is not merely choosing one character for a posthumous name; it also concerns whether to make an exception and grant him a temple name of his own, and to whom that status should belong.\n\nYou read the submitted proposals carefully. Even if his sacrifices are preserved, he will not be enshrined in this dynasty's Ancestral Temple, but worshipped only by the descendants of the former dynasty; leaving him a title and continuing this dynasty's ancestral line were never the same thing.\n\nOnce praise and blame are fixed, they cannot be lightly changed out of a moment's pity. You have the officials read each proposal in turn, intending to settle his posthumous standing beyond all doubt."
 HuangDi_miaoshi.082_t:0 "Deciding the Posthumous Name of the Former Dynasty's Deposed Emperor"
 HuangDi_miaoshi.092.a:0 "Let this be the posthumous name."
 HuangDi_miaoshi.shturl:0 "Governing by statute without killing is called Jian; set the posthumous name as $Color_EHuang$ #bold Jian"
 HuangDi_miaoshi_012_d:0 "The ritual official reads out the agreed posthumous honor once more. All the scattered praise, blame, and remembrance at last have one name on which every voice agrees.\n\n#high [XianDi.GetName]: Emperor [XianDi.GetNicknameNoTooltip]#!\n\nWhen he finishes, you check the fair copy yourself. The name is still the same name, but the characters added after it can only be spoken by others now. The officials await your sign, then file the document away and go to attend to the remaining rites."
 HuangDi_miaoshi_012_t:0 "Settling the Honorific Title"
 HuangDi_miaoshi_014_d:0 "The agreed posthumous title is presented, and the ritual official reads it aloud before you one last time. No one in the hall disputes it now; there is only the faint sound of brushes on the fair copy.\n\n#high [XianDi.GetName]: [XianDi.GetNicknameNoTooltip]#!\n\nYou read it from beginning to end and hand the document back. While the debate raged, it always seemed that a few more lines would say everything; now that the name is truly settled, there remains in the hall an empty place that no words can fill. The remaining rites will proceed accordingly."
 SanGong_HunJun_desc:0 "This character neglected the affairs of state and governed in folly, bringing ruin upon the ancestral altars."
 SanGong_KaiGuo_desc:0 "This character founded the dynasty, quelled disorder and secured the realm: the founding sovereign of an age."
 SanGong_ShouCheng_desc:0 "This character succeeded to the throne and kept the civil order, following established law and bringing peace and stability to the realm."
 SanGong_XiongZhu_desc:0 "This character strove for good governance and brought calm within the seas, and the age hailed a ruler of the Way."
 SanGong_YouZhu_desc:0 "This character ascended the throne in childhood and never governed in person; state affairs were largely left to regents."
 SanGong_ZhongXing_desc:0 "This character rescued the state from peril, restored the ancestral altars, and let the dynasty rise again."
 SanGong_miaohao_01_desc:0 "Founding the realm of Xia and first receiving the Mandate of Heaven; hence the temple name Taizu is conferred."
 SanGong_miaohao_02_desc:0 "Virtue covering all quarters and first laying the imperial foundation; hence the temple name Gaozu is conferred."
 SanGong_miaohao_05_desc:0 "Merit in giving peace to the people, upholding virtue and honoring the legacy; hence the temple name Liezu is conferred."
 SanGong_miaohao_09_desc:0 "Giving peace to the people and establishing governance, bringing the great enterprise to completion; hence the temple name Chengzu is conferred."
 SanGong_miaohao_21_desc:0 "Restoring the altars of state and settling the realm anew; hence the temple name Shizu is conferred."
 SanGong_miaohao_22_desc:0 "Upholding the altars of state and reviving the imperial cause; hence the temple name Zhongzu is conferred."
 SanGong_miaohao_23_desc:0 "Restoring the altars of state and settling the realm anew; hence the temple name Daizu is conferred."
 SanGong_miaohao_27_desc:0 "Merit and virtue unsurpassed, a work of shining glory; hence the temple name Taizong is conferred."
 SanGong_miaohao_28_desc:0 "Achievement in restoration, virtue lofty and worthy of reverence; hence the temple name Gaozong is conferred."
 SanGong_miaohao_29_desc:0 "Merit in restoration, never to be displaced for a hundred generations; hence the temple name Shizong is conferred."
 SanGong_miaohao_30_desc:0 "Merit in restoration, never to be displaced for a hundred generations; hence the temple name Daizong is conferred."
 SanGong_miaohao_31_desc:0 "Restoring the sacred vessels and reviving the ancestral line; hence the temple name Zhongzong is conferred."
 SanGong_miaohao_32_desc:0 "Abundant virtue, towering and profound, reverent without cease; hence the temple name Renzong is conferred."
 SanGong_miaohao_33_desc:0 "Merit shining over the Four Seas, benevolence enduring a thousand years; hence the temple name Xianzong is conferred."
 SanGong_miaohao_34_desc:0 "Sagely and divine, ever more likened to the virtue of Yao; hence the temple name Shenzong is conferred."
 SanGong_miaohao_35_desc:0 "Mastering all things, lofty virtue handed down to posterity; hence the temple name Shengzong is conferred."
 SanGong_miaohao_36_desc:0 "Firm virtue accomplished, brilliance renewed across the six directions; hence the temple name Suzong is conferred."
 SanGong_miaohao_37_desc:0 "Utmost benevolence and filial piety, a worthy successor and continuer; hence the temple name Xiaozong is conferred."
 SanGong_miaohao_38_desc:0 "Perceptive as Heaven, the sage setting the statutes of the age; hence the temple name Xianzong is conferred."
 SanGong_miaohao_39_desc:0 "Sagely goodness known far and wide, governance and teaching spread broadly; hence the temple name Xuanzong is conferred."
 SanGong_miaohao_40_desc:0 "Merit in giving peace to the people, receiving the Mandate in fullness; hence the temple name Liezong is conferred."
 SanGong_miaohao_41_desc:0 "Shining upon the four quarters, virtue in the image of the divine Yao; hence the temple name Mingzong is conferred."
 SanGong_miaohao_42_desc:0 "Establishing achievement and holding all four quarters; hence the temple name Chengzong is conferred."
 SanGong_miaohao_43_desc:0 "Comforting the people in peace and joy, near to the reigns of Cheng and Kang; hence the temple name Kangzong is conferred."
 SanGong_miaohao_44_desc:0 "The utmost Way and utmost truth, mysterious beyond mystery; hence the temple name Xuanzong is conferred."
 SanGong_miaohao_45_desc:0 "Governing close to the utmost Way, by virtue worthy of the ancestral hall; hence the temple name Zhenzong is conferred."
 SanGong_miaohao_46_desc:0 "Quelling calamity and disorder, subduing the lawless; hence the temple name Wuzong is conferred."
 SanGong_miaohao_47_desc:0 "Ordering heaven and earth, kind and loving to the people; hence the temple name Wenzong is conferred."
 SanGong_miaohao_48_desc:0 "A ruler of rare brilliance, outstanding above all; hence the temple name Yingzong is conferred."
 SanGong_miaohao_49_desc:0 "Wisdom making a sage, far-reaching in thought; hence the temple name Ruizong is conferred."
 SanGong_miaohao_50_desc:0 "As Yao said, to know men; a wise king of the age; hence the temple name Zhezong is conferred."
 SanGong_miaohao_51_desc:0 "The annals attest his virtue; he lived in peace and walked the right path; hence the temple name Dezong is conferred."
 SanGong_miaohao_52_desc:0 "Honoring virtue and repaying the origins, revering forebears and exalting the line; hence the temple name Chongzong is conferred."
 SanGong_miaohao_53_desc:0 "Spreading virtue and holding to righteousness, of bearing serene and deep; hence the temple name Muzong is conferred."
 SanGong_miaohao_54_desc:0 "Glorious and meritorious, able to carry on the work of his forebears; hence the temple name Guangzong is conferred."
 SanGong_miaohao_55_desc:0 "Prevailing through righteousness, glorious with an auspicious succession; hence the temple name Jingzong is conferred."
 SanGong_miaohao_56_desc:0 "Achieving without striving, swift without haste; hence the temple name Shunzong is conferred."
 SanGong_miaohao_57_desc:0 "Well in accord with law and canon, dignified, reverent and stern; hence the temple name Jingzong is conferred."
 SanGong_miaohao_58_desc:0 "Profound and single of heart, peaceful and long-lived; hence the temple name Ningzong is conferred."
 SanGong_miaohao_59_desc:0 "Raising a great enterprise, the sagely design mightily revived; hence the temple name Xingzong is conferred."
 SanGong_miaohao_60_desc:0 "Embodying the Way and attaining the One, natural as one endowed by Heaven; hence the temple name Daozong is conferred."
 SanGong_miaohao_61_desc:0 "Laws great and clear, words graced with eloquence; hence the temple name Zhangzong is conferred."
 SanGong_miaohao_62_desc:0 "Gentle, sagely and good, loving the people with sincere depth; hence the temple name Yizong is conferred."
 SanGong_miaohao_63_desc:0 "Laws great and clear, words graced with eloquence; hence the temple name Zhangzong is conferred."
 SanGong_miaohao_64_desc:0 "Bold and resolute, firm and decisive by nature; hence the temple name Yizong is conferred."
 SanGong_miaohao_65_desc:0 "Broad-minded and kind, winning the multitude and carrying on the line with great virtue; hence the temple name Yuzong is conferred."
 SanGong_miaohao_66_desc:0 "Fair governance and strict justice, promoting the arts of the Way; hence the temple name Lizong is conferred."
 SanGong_miaohao_67_desc:0 "Conquering foes with strong will, dignified and without fault; hence the temple name Zhuangzong is conferred."
 SanGong_miaohao_68_desc:0 "Flourishing, bright and harmonious, reverent virtue radiant; hence the temple name Xizong is conferred."
 SanGong_miaohao_69_desc:0 "Harmony spread far and wide, merit in giving peace to the people; hence the temple name Xizong is conferred."
 SanGong_miaohao_70_desc:0 "Sincere and open to remonstrance, kind and loving to his kin; hence the temple name Xizong is conferred."
 SanGong_miaohao_71_desc:0 "Widely learned and capable, generous with inner virtue; hence the temple name Xianzong is conferred."
 SanGong_miaohao_72_desc:0 "Pure and undivided in virtue, embodying benevolence to nurture the people; hence the temple name Yuanzong is conferred."
 SanGong_miaohao_73_desc:0 "Blessings and joy without end, a worthy heir to the line; hence the temple name Qingzong is conferred."
 SanGong_miaohao_74_desc:0 "Upholding righteousness and following the norms, respectful, frugal and reverent; hence the temple name Lizong is conferred."
 SanGong_miaohao_75_desc:0 "Primal virtue full and fair, refined grace shining clear; hence the temple name Huizong is conferred."
 SanGong_miaohao_76_desc:0 "Of respectful and fine bearing, illustrious in virtue and diligent in service; hence the temple name Zhaozong is conferred."
 SanGong_miaohao_77_desc:0 "Loving the people and generous in giving, gentle and open to remonstrance; hence the temple name Huizong is conferred."
 SanGong_miaohao_78_desc:0 "Governing with strength and resolve, stern in presiding over his subjects; hence the temple name Weizong is conferred."
 SanGong_miaohao_79_desc:0 "Honoring the worthy and prizing righteousness, upright in virtue and fine in bearing; hence the temple name Gongzong is conferred."
 SanGong_miaohao_80_desc:0 "Loving harmony and shunning strife, the myriad people relied on him for peace; hence the temple name Anzong is conferred."
 SanGong_miaohao_81_desc:0 "Succeeding from a distant branch, carrying on the work of his forebears; hence the temple name Shaozong is conferred."
 SanGong_miaohao_82_desc:0 "Dignity complete, reverent in affairs and frugal in spending; hence the temple name Qinzong is conferred."
 SanGong_miaohao_83_desc:0 "Deep in thought and keen of mind, repenting past errors; hence the temple name Sizong is conferred."
 SanGong_miaohao_84_desc:0 "Measured in advance and retreat, composed and constant; hence the temple name Duzong is conferred."
 SanGong_miaohao_85_desc:0 "Keeping propriety and holding to righteousness, the sage cultivating and transforming; hence the temple name Duanzong is conferred."
 SanGong_miaohao_86_desc:0 "Reverent and diligent for the people, able to fulfill martial ambitions; hence the temple name Huanzong is conferred."
 SanGong_miaohao_87_desc:0 "Toiling in armor, helping bring the cause to success; hence the temple name Xiangzong is conferred."
 SanGong_miaohao_88_desc:0 "Inheriting the great succession, governing all quarters; hence the temple name Tongzong is conferred."
 SanGong_miaohao_89_desc:0 "Great care for the peace of the people, pure in conduct and undivided; hence the temple name Dingzong is conferred."
 SanGong_miaohao_zdy_desc:0 "The heir personally chose the temple name, taking the character '[ROOT.Char.GetLocalizedText( 'SanGong_miaohao_zdy_text' )]'."
