 HuangDi_miaoshi.011.zdy:0 "We shall choose the posthumous name Ourself."
 HuangDi_miaoshi.011_d:0 "The ritual officials present another document; this time the matter is the posthumous name. The candidate characters are listed side by side with their meanings, and as you read down them you suddenly feel that behind each short character stands a different argument.\n\nSome value achievement, others care more for grief and reverence; much has already been said. You do not let them start the dispute anew, but keep the late emperor's record at hand and look again at the names before you.\n\nThe hall awaits your decision. Whichever you choose, all future rites will use it; for now, it falls to you to speak it first."
 HuangDi_miaoshi.011_t:0 "Choosing the Posthumous Name of the Departed Emperor"
 HuangDi_miaoshi.012.a:0 "Judgment Rendered at the Coffin"
