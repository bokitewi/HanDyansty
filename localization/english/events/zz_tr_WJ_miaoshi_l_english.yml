 HuangDi_miaoshi.015.e:0 "Shining upon the four quarters is Ming, laws clear and great is Zhang; the honored posthumous name is #Y 'Mingzhang'"
 HuangDi_miaoshi.015.f:0 "Shining upon the four quarters is Ming, correcting oneself to guide those below is Su; the honored posthumous name is #Y 'Mingsu'"
 HuangDi_miaoshi.015.g:0 "Shining upon the four quarters is Ming, bringing merit and peace to the people is Lie; the honored posthumous name is #Y 'Minglie'"
 HuangDi_miaoshi.015.h:0 "Sagacity heard far and wide is Zhao, rewarding good and punishing evil is Xian; the honored posthumous name is #Y 'Zhaoxian'"
 HuangDi_miaoshi.015.i:0 "Achieving through righteousness is Jing, upholding righteousness and practicing virtue is Yuan; the honored posthumous name is #Y 'Jingyuan'"
 HuangDi_miaoshi.015.j:0 "Sagely goodness known everywhere is Xuan, conduct seen within and without is Xian; the honored posthumous name is #Y 'Xuanxian'"
 HuangDi_miaoshi.015.k:0 "Treading the right path with a harmonious will is Zhuang, strong in righteousness and holding to the upright is Wei; the honored posthumous name is #Y 'Zhuangwei'"
 HuangDi_miaoshi.015.l:0 "Giving peace to the people and establishing government is Cheng, laws clear and great is Zhang; the honored posthumous name is #Y 'Chengzhang'"
 HuangDi_miaoshi.015.m:0 "Bringing the people peace and joy is Kang, generous, joyful and a good end is Jing; the honored posthumous name is #Y 'Kangjing'"
 HuangDi_miaoshi.015.n:0 "Intelligent, wise and discerning is Xian, spreading virtue and upholding righteousness is Mu; the honored posthumous name is #Y 'Xianmu'"
 HuangDi_miaoshi.015.o:0 "Upholding righteousness and practicing virtue is Yuan, commands that please the people are He; the honored posthumous name is #Y 'Yuanhe'"
 HuangDi_miaoshi.015.p:0 "Laws clear and great is Zhang, wise, sagacious and enlightened is Rui; the honored posthumous name is #Y 'Zhangrui'"
 HuangDi_miaoshi.015.q:0 "Bringing merit and peace to the people is Lie, strong and decisive is Yi; the honored posthumous name is #Y 'Lieyi'"
 HuangDi_miaoshi.015.r:0 "Opening lands and subduing the distant is Huan, strong in righteousness and holding to the upright is Wei; the honored posthumous name is #Y 'Huanwei'"
 HuangDi_miaoshi.015.s:0 "Kind to the people and loving all things is Ren, righteous conduct in accord with the Way is Xian; the honored posthumous name is #Y 'Renxian'"
 HuangDi_miaoshi.015.t:0 "Practicing the Way to transform the people is Sheng, shining upon the four quarters is Ming; the honored posthumous name is #Y 'Shengming'"
 HuangDi_miaoshi.015.u:0 "Virtue covering all things is Gao, conduct seen within and without is Xian; the honored posthumous name is #Y 'Gaoxian'"
 HuangDi_miaoshi.015.v:0 "Humble and self-disciplined is Gong, giving peace to the people with great forethought is Ding; the honored posthumous name is #Y 'Gongding'"
 HuangDi_miaoshi.015.w:0 "Watchful morning and night is Jing, pure and keeping integrity is Zhen; the honored posthumous name is #Y 'Jingzhen'"
