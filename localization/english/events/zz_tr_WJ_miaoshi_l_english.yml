 HuangDi_miaoshi.011.r:0 "Bringing the people peace and joy is called Kang; set the posthumous name as $Color_EHuang$ #bold Kang"
 HuangDi_miaoshi.011.s:0 "Intelligent, wise and discerning is called Xian; set the posthumous name as $Color_EHuang$ #bold Xian"
