 HuangDi_miaoshi.011.cu:0 "Keeping righteousness and holding firm is called Gang; set the posthumous name as $Color_EHuang$ #bold Gang"
 HuangDi_miaoshi.011.cv:0 "Upholding righteousness with firm conduct is called Ke; set the posthumous name as $Color_EHuang$ #bold Ke"
 HuangDi_miaoshi.011.cw:0 "Defeating foes and quelling disorder is called Zhuang; set the posthumous name as $Color_EHuang$ #bold Zhuang"
 HuangDi_miaoshi.011.cx:0 "Acting without hesitation is called Guo; set the posthumous name as $Color_EHuang$ #bold Guo"
 HuangDi_miaoshi.011.cy:0 "Resisting disorder and warding off calamity is called Yu; set the posthumous name as $Color_EHuang$ #bold Yu"
 HuangDi_miaoshi.011.cz:0 "Great policies well carried out is called Wei; set the posthumous name as $Color_EHuang$ #bold Wei"
 HuangDi_miaoshi.011.d:0 "Following Heaven and emulating Yao is called Tai; set the posthumous name as $Color_EHuang$ #bold Tai"
 HuangDi_miaoshi.011.da:0 "Careful conduct within due measure is called Jie; set the posthumous name as $Color_EHuang$ #bold Jie"
 HuangDi_miaoshi.011.db:0 "Dyed black yet not darkened is called Bai; set the posthumous name as $Color_EHuang$ #bold Bai"
 HuangDi_miaoshi.011.dc:0 "Setting the state right by law is called Kuang; set the posthumous name as $Color_EHuang$ #bold Kuang"
 HuangDi_miaoshi.011.dd:0 "Harmonious and in accord with reason is called Shun; set the posthumous name as $Color_EHuang$ #bold Shun"
 HuangDi_miaoshi.011.de:0 "Clear achievements that soothe the multitude is called Shang; set the posthumous name as $Color_EHuang$ #bold Shang"
 HuangDi_miaoshi.011.df:0 "Seeking the root and knowing the source is called Yuan; set the posthumous name as $Color_EHuang$ #bold Yuan"
 HuangDi_miaoshi.011.dg:0 "Slaying to hold power is called Yi; set the posthumous name as $Color_EHuang$ #bold Yi"
 HuangDi_miaoshi.011.dh:0 "Repenting past faults is called Si; set the posthumous name as $Color_EHuang$ #bold Si"
 HuangDi_miaoshi.011.di:0 "Holding to conduct with measure is called Kao; set the posthumous name as $Color_EHuang$ #bold Kao"
 HuangDi_miaoshi.011.dj:0 "Living to a great age is called Hu; set the posthumous name as $Color_EHuang$ #bold Hu"
 HuangDi_miaoshi.011.dk:0 "Abundant virtue, brightly shining, is called Hao; set the posthumous name as $Color_EHuang$ #bold Hao"
 HuangDi_miaoshi.011.dl:0 "Able to use the people's strength to the full is called Shi; set the posthumous name as $Color_EHuang$ #bold Shi"
 HuangDi_miaoshi.011.e:0 "Beyond the people's power to name is called Shen; set the posthumous name as $Color_EHuang$ #bold Shen"
 HuangDi_miaoshi.011.f:0 "Promoting good and levying lightly is called Sheng; set the posthumous name as $Color_EHuang$ #bold Sheng"
