l_english:
 HouGong_ShiHao.021_desc:0 "You have the ritual officials take away the candidate characters for the posthumous name. All that remains on the desk is a blank page, and it is harder to set brush to than any of the candidates had been.\n\nThere is much still to be said of the late emperor's life, yet only one or two characters can go into his posthumous name. Brush in hand, you silently repeat the character you have settled on in your heart and wait for that last flicker of doubt to settle.\n\n#weak Write the chosen posthumous name below.#!"
 HouGong_ShiHao.021_title:0 "Choosing the Posthumous Name Yourself"
 HuangDi_miaoshi.001.a:0 "The late emperor founded the great enterprise; he should receive a founder's title."
 HuangDi_miaoshi.001.b:0 "The late emperor restored the ancestral altars; he should receive a restorer's title."
 HuangDi_miaoshi.001.c:0 "The late emperor brought order to the realm; he should receive a wise ruler's title."
 HuangDi_miaoshi.001.d:0 "The late emperor upheld the inherited order; he should receive a preserver's title."
 HuangDi_miaoshi.001.e:0 "Though the late emperor lacked virtue, his temple sacrifices should still be kept."
 HuangDi_miaoshi.001.e1:0 "Still confer a temple name posthumously, so his sacrifices endure."
 HuangDi_miaoshi.001.event_title:0 "Deciding the Temple Name"
 HuangDi_miaoshi.001.j:0 "We shall choose the temple name Ourself."
 HuangDi_miaoshi.001_tt:0 "The late emperor had [GetTrait('SanGong_HunJun').GetName( GetNullCharacter )][trait|E]"
 HuangDi_miaoshi.003.a:0 "Founded the realm and first received the Mandate: this is called Tai. Set the late emperor's temple name as $Color_EHuang$ #bold Taizu"
 HuangDi_miaoshi.003.b:0 "His virtue covered all lands and he first raised the imperial foundation: this is called Gao. Set the late emperor's temple name as $Color_EHuang$ #bold Gaozu"
 HuangDi_miaoshi.003_d:0 "The deliberation on the founding is done, and the ritual officials bring forward the candidate temple names. The old deeds just read aloud still ring in your ears, yet before you now lie only a few solemn characters.\n\nLater generations may not remember every order the late emperor gave or every hardship he endured, but they will speak the name fixed today again and again in sacrifices and documents. Someone beside the desk quietly asks whether to read it all once more; you shake your head and look over each name yourself.\n\nFirst the temple name, then the posthumous name. The officials have the brush ready and wait only for you to choose one."
 HuangDi_miaoshi.003_t:0 "Conferring the Late Emperor's Temple Name"
 HuangDi_miaoshi.004.a:0 "Restored the state and remade it, setting the altars at peace once more: this is called Shi. Set the late emperor's temple name as $Color_EHuang$ #bold Shizu"
 HuangDi_miaoshi.004.b:0 "Rescued the realm from peril and opened a restoration: this is called Zhong. Set the late emperor's temple name as $Color_EHuang$ #bold Zhongzu"
 HuangDi_miaoshi.004.c:0 "Recovered the land and revived a broken line: this is called Dai. Set the late emperor's temple name as $Color_EHuang$ #bold Daizu"
 HuangDi_miaoshi.004.d:0 "Continued the succession, laid new foundations, and restored the ancestral line: this is called Gao. Set the late emperor's temple name as $Color_EHuang$ #bold Gaozu"
 HuangDi_miaoshi.004.e:0 "Quelled chaos and at last achieved restoration: this is called Cheng. Set the late emperor's temple name as $Color_EHuang$ #bold Chengzu"
 HuangDi_miaoshi.004.f:0 "Put down disorder, brought peace to the age, and preserved the clan: this is called Lie. Set the late emperor's temple name as $Color_EHuang$ #bold Liezu"
 HuangDi_miaoshi.004_d:0 "The merit of the restoration has been settled, and the ritual officials bring the candidate temple names before you. A new document has replaced the last, yet the old tale of a dynastic line nearly severed still keeps the hall unusually hushed.\n\nYou read the candidates one by one. Some characters are stern, some mild; set after the late emperor's name, none of them is an ordinary word anymore. Someone wishes to argue his case once more, and you raise a hand to bid him wait. You have heard enough already; this last decision must be your own."
 HuangDi_miaoshi.004_t:0 "Deciding the Late Emperor's Temple Name"
 HuangDi_miaoshi.005.a:0 "Unsurpassed in merit and virtue, his achievements resplendent: this is called Tai. Set the late emperor's temple name as $Color_EHuang$ #bold Taizong"
 HuangDi_miaoshi.005.e:0 "Accomplished in restoration, lofty in virtue and worthy of reverence: this is called Gao. Set the late emperor's temple name as $Color_EHuang$ #bold Gaozong"
 HuangDi_miaoshi.005.f:0 "Merit in restoration, never to be removed for a hundred generations: this is called Shi. Set the late emperor's temple name as $Color_EHuang$ #bold Shizong"
 HuangDi_miaoshi.005.g:0 "Merit in restoration, never to be removed for a hundred generations: this is called Dai. Set the late emperor's temple name as $Color_EHuang$ #bold Daizong"
 HuangDi_miaoshi.005.h:0 "Revived the sacred vessel and renewed the ancestral fortune: this is called Zhong. Set the late emperor's temple name as $Color_EHuang$ #bold Zhongzong"
 HuangDi_miaoshi.005.i:0 "His great virtue towering and unceasing: this is called Ren. Set the late emperor's temple name as $Color_EHuang$ #bold Renzong"
 HuangDi_miaoshi.005.k:0 "His merit shone across the four seas and his benevolence for a thousand years: this is called Xian. Set the late emperor's temple name as $Color_EHuang$ #bold Xianzong"
 HuangDi_miaoshi.005.l:0 "Sage and divine, adding to the virtue of Yao: this is called Shen. Set the late emperor's temple name as $Color_EHuang$ #bold Shenzong"
 HuangDi_miaoshi.005.m:0 "Versed in all things, his lofty virtue handed down the line: this is called Sheng. Set the late emperor's temple name as $Color_EHuang$ #bold Shengzong"
 HuangDi_miaoshi.005.o:0 "Firm in virtue and accomplished, his brilliance renewed across the realm: this is called Su. Set the late emperor's temple name as $Color_EHuang$ #bold Suzong"
 HuangDi_miaoshi.005.p:0 "Supremely benevolent and filial, he carried on and recounted well: this is called Xiao. Set the late emperor's temple name as $Color_EHuang$ #bold Xiaozong"
 HuangDi_miaoshi.005.q:0 "Heaven alone is all-seeing, and the sage takes it as his model: this is called Xian. Set the late emperor's temple name as $Color_EHuang$ #bold Xianzong"
 HuangDi_miaoshi.005.r:0 "His sage goodness known everywhere, his governance and teaching spread wide: this is called Xuan. Set the late emperor's temple name as $Color_EHuang$ #bold Xuanzong"
 HuangDi_miaoshi.005.s:0 "Brought merit and peace to the people, receiving the Mandate in full: this is called Lie. Set the late emperor's temple name as $Color_EHuang$ #bold Liezong"
 HuangDi_miaoshi.005.t:0 "Shone upon the four quarters, his virtue like that of divine Yao: this is called Ming. Set the late emperor's temple name as $Color_EHuang$ #bold Mingzong"
 HuangDi_miaoshi.005.u:0 "Established his work and possessed the four quarters: this is called Cheng. Set the late emperor's temple name as $Color_EHuang$ #bold Chengzong"
 HuangDi_miaoshi.005.v:0 "Gave the people peace and comfort, nearly rivaling the reigns of Cheng and Kang: this is called Kang. Set the late emperor's temple name as $Color_EHuang$ #bold Kangzong"
 HuangDi_miaoshi.005.w:0 "Of the highest Way and truth, mysterious beyond mystery: this is called Xuan. Set the late emperor's temple name as $Color_EHuang$ #bold Xuanzong"
 HuangDi_miaoshi.005.x:0 "His rule approached the highest Way, his virtue fit for an ancestral title: this is called Zhen. Set the late emperor's temple name as $Color_EHuang$ #bold Zhenzong"
 HuangDi_miaoshi.005.y:0 "Quelled disorder and subdued the lawless: this is called Wu. Set the late emperor's temple name as $Color_EHuang$ #bold Wuzong"
 HuangDi_miaoshi.005_d:0 "Guided by the late emperor's achievements in governing the realm, the ritual officials present the candidate temple names. When the reading ends, the only sound in the hall is the soft rustle of sleeves. You draw the document closer and recall the affairs of state that stirred debate at court while the late emperor lived.\n\nThe man who did those things is gone, but those who debated them still stand here, waiting to choose an enduring name for him. You look over the names and do not decide at once; change a single character and the emphasis shifts with it.\n\nThe officials dare not hurry you and only set the brush steady. Someone must be the first to put this last hesitation to rest."
 HuangDi_miaoshi.005_t:0 "Deciding the Late Emperor's Temple Name"
 HuangDi_miaoshi.006.a:0 "Ordered heaven and earth, kind and loving to the people: this is called Wen. Set the late emperor's temple name as $Color_EHuang$ #bold Wenzong"
 HuangDi_miaoshi.006.b:0 "An extraordinary ruler who stood above all others: this is called Ying. Set the late emperor's temple name as $Color_EHuang$ #bold Yingzong"
 HuangDi_miaoshi.006.c:0 "Wisdom makes the sage, and his counsel ran deep: this is called Rui. Set the late emperor's temple name as $Color_EHuang$ #bold Ruizong"
 HuangDi_miaoshi.006.d:0 "As Yao said, to know men is wisdom, and the age had a philosopher-king: this is called Zhe. Set the late emperor's temple name as $Color_EHuang$ #bold Zhezong"
 HuangDi_miaoshi.006.e:0 "The ancient records attest his virtue, and he lived in peace and true conduct: this is called De. Set the late emperor's temple name as $Color_EHuang$ #bold Dezong"
 HuangDi_miaoshi.006.f:0 "Exalted virtue and repaid his origins, honoring his forebears and his line: this is called Chong. Set the late emperor's temple name as $Color_EHuang$ #bold Chongzong"
 HuangDi_miaoshi.006.g:0 "Spread virtue and upheld righteousness, his bearing calm and profound: this is called Mu. Set the late emperor's temple name as $Color_EHuang$ #bold Muzong"
 HuangDi_miaoshi.006.h:0 "Gloriously meritorious, able to carry on the work of his forebears: this is called Guang. Set the late emperor's temple name as $Color_EHuang$ #bold Guangzong"
 HuangDi_miaoshi.006.i:0 "Achieved through righteousness, leaving a bright legacy: this is called Jing. Set the late emperor's temple name as $Color_EHuang$ #bold Jingzong"
 HuangDi_miaoshi.006.j:0 "Achieved without striving, swift without haste: this is called Shun. Set the late emperor's temple name as $Color_EHuang$ #bold Shunzong"
 HuangDi_miaoshi.006.k:0 "Kept well to the laws, grave, reverent, and stern: this is called Jing. Set the late emperor's temple name as $Color_EHuang$ #bold Jingzong"
 HuangDi_miaoshi.006.l:0 "Profound and single-minded, he lived long in peace and health: this is called Ning. Set the late emperor's temple name as $Color_EHuang$ #bold Ningzong"
 HuangDi_miaoshi.006.m:0 "Raised a great enterprise and greatly advanced the sage design: this is called Xing. Set the late emperor's temple name as $Color_EHuang$ #bold Xingzong"
 HuangDi_miaoshi.006.n:0 "Embodied the Way and attained the One, naturally gifted by Heaven: this is called Dao. Set the late emperor's temple name as $Color_EHuang$ #bold Daozong"
 HuangDi_miaoshi.006.o:0 "His laws clear and great, his words refined: this is called Zhang. Set the late emperor's temple name as $Color_EHuang$ #bold Zhangzong"
 HuangDi_miaoshi.006.p:0 "Gentle, sagely and good, loving the people with a deep nature: this is called Yi. Set the late emperor's temple name as $Color_EHuang$ #bold Yizong"
 HuangDi_miaoshi.006.q:0 "His laws clear and great, his words refined: this is called Zhang. Set the late emperor's temple name as $Color_EHuang$ #bold Zhangzong"
 HuangDi_miaoshi.006.r:0 "Bold and resolute, firm and decisive by nature: this is called Yi. Set the late emperor's temple name as $Color_EHuang$ #bold Yizong"
 HuangDi_miaoshi.006.s:0 "Generous and kind, winning the multitude, carrying on the line with deep virtue: this is called Yu. Set the late emperor's temple name as $Color_EHuang$ #bold Yuzong"
 HuangDi_miaoshi.006.t:0 "Fair in governance and strict in punishment, he exalted the arts of the Way: this is called Li. Set the late emperor's temple name as $Color_EHuang$ #bold Lizong"
 HuangDi_miaoshi.006.u:0 "Overcame his foes with a strong will, his dignity without fault: this is called Zhuang. Set the late emperor's temple name as $Color_EHuang$ #bold Zhuangzong"
 HuangDi_miaoshi.006.v:0 "Flourishing, bright, and harmonious, his reverent virtue radiant: this is called Xi. Set the late emperor's temple name as $Color_EHuang$ #bold Xizong"
 HuangDi_miaoshi.006_d:0 "The record of the late emperor's reign of preservation has been read, and the ritual officials present the candidate temple names for you to choose. With the document in hand, the dense years recorded before have shrunk to a few characters awaiting choice.\n\nThere are no clear-cut wars to speak of as at the founding, yet the daily work of government carried on, one matter after another, down to this day. Someone in the hall wishes to add a few more words of praise; you stop him and run your eye down the candidates yourself. Enough has been said.\n\nOnly once the temple name is fixed will his title in the ancestral temple no longer hang unresolved."
 HuangDi_miaoshi.006_t:0 "Deciding the Late Emperor's Temple Name"
 HuangDi_miaoshi.007.a:0 "Spread harmony widely and brought merit and peace to the people: this is called Xi. Set the late emperor's temple name as $Color_EHuang$ #bold Xizong"
 HuangDi_miaoshi.007.b:0 "Of deep nature and open to remonstrance, kind and loving to his kin: this is called Xi. Set the late emperor's temple name as $Color_EHuang$ #bold Xizong"
 HuangDi_miaoshi.007.c:0 "Widely learned and of many talents, kind and virtuous within: this is called Xian. Set the late emperor's temple name as $Color_EHuang$ #bold Xianzong"
 HuangDi_miaoshi.007.d:0 "Of pure and single virtue, embodying benevolence to lead the people: this is called Yuan. Set the late emperor's temple name as $Color_EHuang$ #bold Yuanzong"
 HuangDi_miaoshi.007.e:0 "Blessings extended long, and he carried on the line well: this is called Qing. Set the late emperor's temple name as $Color_EHuang$ #bold Qingzong"
 HuangDi_miaoshi.007.f:0 "Upheld righteousness and followed the rules, respectful, frugal, grave, and reverent: this is called Li. Set the late emperor's temple name as $Color_EHuang$ #bold Lizong"
 HuangDi_miaoshi.007.g:0 "His primal virtue full and fair, his refined grace shining: this is called Hui. Set the late emperor's temple name as $Color_EHuang$ #bold Huizong"
 HuangDi_miaoshi.007.h:0 "Respectful and handsome in bearing, of bright virtue and diligent: this is called Zhao. Set the late emperor's temple name as $Color_EHuang$ #bold Zhaozong"
 HuangDi_miaoshi.007.i:0 "Loved the people and was generous, gentle and open to remonstrance: this is called Hui. Set the late emperor's temple name as $Color_EHuang$ #bold Huizong"
 HuangDi_miaoshi.007.j:0 "Governed with strength and resolve, stern toward those below: this is called Wei. Set the late emperor's temple name as $Color_EHuang$ #bold Weizong"
 HuangDi_miaoshi.007.k:0 "Honored the worthy and prized righteousness, upright in virtue and fair of bearing: this is called Gong. Set the late emperor's temple name as $Color_EHuang$ #bold Gongzong"
 HuangDi_miaoshi.007.l:0 "Loved harmony and did not contend, a refuge for the multitudes: this is called An. Set the late emperor's temple name as $Color_EHuang$ #bold Anzong"
 HuangDi_miaoshi.007.m:0 "Succeeded from a distant branch and carried on the former work: this is called Shao. Set the late emperor's temple name as $Color_EHuang$ #bold Shaozong"
 HuangDi_miaoshi.007.n:0 "Complete in dignity, diligent in affairs and sparing in use: this is called Qin. Set the late emperor's temple name as $Color_EHuang$ #bold Qinzong"
 HuangDi_miaoshi.007.o:0 "Deep in thought and keen of mind, he regretted past errors: this is called Si. Set the late emperor's temple name as $Color_EHuang$ #bold Sizong"
 HuangDi_miaoshi.007.p:0 "His conduct a model in advance and retreat, composed and constant: this is called Du. Set the late emperor's temple name as $Color_EHuang$ #bold Duzong"
 HuangDi_miaoshi.007.q:0 "Kept the rites and upheld righteousness, sagely cultivated and a model to all: this is called Duan. Set the late emperor's temple name as $Color_EHuang$ #bold Duanzong"
 HuangDi_miaoshi.007.r:0 "Reverent and diligent for the people, able to fulfill martial ambitions: this is called Huan. Set the late emperor's temple name as $Color_EHuang$ #bold Huanzong"
 HuangDi_miaoshi.007.s:0 "Toiled in armor and helped bring success: this is called Xiang. Set the late emperor's temple name as $Color_EHuang$ #bold Xiangzong"
 HuangDi_miaoshi.007.t:0 "Inherited the great line and ruled over all lands: this is called Tong. Set the late emperor's temple name as $Color_EHuang$ #bold Tongzong"
 HuangDi_miaoshi.007.u:0 "Gave peace to the people with great forethought, pure and undivided in conduct: this is called Ding. Set the late emperor's temple name as $Color_EHuang$ #bold Dingzong"
 HuangDi_miaoshi.007_d:0 "When talk turns to the late emperor's failings, the hall grows even quieter than before. The ritual officials present candidate temple names meant to preserve his sacrifices, choosing their words with particular care, as if stressing any one character might suggest a hidden meaning.\n\nYou look at the names, then glance at the record of his government. The man is gone, but many of his difficulties remain for the living; and whatever name is fixed today, not everyone below the dais will think the same of it.\n\nThe officials are still waiting. In the end this character is yours to point to; the silence of others cannot answer for you."
 HuangDi_miaoshi.007_t:0 "Conferring the Late Emperor's Temple Name"
 HuangDi_miaoshi.008.a:0 "Honor him as a Progenitor (Zu)."
 HuangDi_miaoshi.008.b:0 "Honor him as an Ancestor (Zong)."
 HuangDi_miaoshi.008.c:0 "Return to the previous page"
 HuangDi_miaoshi.008_d:0 "You have seen all the candidates, yet you are still resolved to devise the temple name yourself. The officials clear away the drafts, leaving only a brush and a blank page, and the desk suddenly looks very bare.\n\nWhen you were dissatisfied a moment ago, you could name your reasons one by one; now that the writing falls to you, those reasons cannot produce a name for you. You set the brush upright and think again on the one title that should most of all remain for the late emperor in the ancestral temple.\n\n#weak Write the chosen temple name below, then choose whether to style him Zu or Zong.#!"
 HuangDi_miaoshi.008_t:0 "Choosing the Temple Name Yourself"
 HuangDi_miaoshi.009.a:0 "Follow the rites with care and decide the temple and posthumous names."
 HuangDi_miaoshi.009.b:0 "The young ruler died early; confer no temple name, only decide a posthumous one."
 HuangDi_miaoshi.009.desc.1:0 "The late emperor has passed away, and the documents for deciding his temple and posthumous names have been brought before you. Many of his deeds have not yet been weighed, yet the ritual officials must already prepare how to address the departed sovereign.\n\nYou have them set forth separately the late emperor's achievements and the rites due after his death. Whether near or distant to him, the names fixed today will be spoken by later generations; they cannot be hastily settled on the strength of this moment's grief alone.\n\n"
 HuangDi_miaoshi.009.desc.2:0 "The late emperor had the merit of founding the dynasty. In deciding the temple name today, this foundation must come first: the enterprise was his creation, but how to name it is for you, his successor, to decide with all solemnity."
 HuangDi_miaoshi.009.desc.3:0 "When the ritual officials speak of the late emperor's merit in restoring the dynasty, even those who had kept their heads bowed look up. The line that once seemed unable to continue still endures, and how to name the man who sustained it in the ancestral temple awaits your judgment."
 HuangDi_miaoshi.009.desc.4:0 "The account of the late emperor's governance of the realm has been read in full. Matters that once could be argued over for ages in his lifetime must now be gathered into a mere handful of characters."
 HuangDi_miaoshi.009.desc.5:0 "The late emperor's work of preserving the realm has been reviewed. You leaf through the record of his reign, crowded with daily affairs of state; today you need only choose for him a name fit for a hundred generations."
 HuangDi_miaoshi.009.desc.6:0 "Reading out the late emperor's age, the ritual official pauses before going on to the funeral rites. Many plans never carried out will no longer need an answer."
 HuangDi_miaoshi.009.desc.7:0 "The late emperor's governance was often misguided, and today's grief cannot make that record vanish. How to weigh preserving his sacrifices against praise and blame is exactly where this deliberation is hardest to write."
 HuangDi_miaoshi.009.event_title:0 "Deliberating the Posthumous Honors"
 HuangDi_miaoshi.011.a:0 "Ordering heaven and earth is called Wen; set the posthumous name as $Color_EHuang$ #bold Wen"
 HuangDi_miaoshi.011.aa:0 "Commands that please the people are called He; set the posthumous name as $Color_EHuang$ #bold He"
 HuangDi_miaoshi.011.ab:0 "Storing righteousness and abundant merit is called Ren; set the posthumous name as $Color_EHuang$ #bold Ren"
 HuangDi_miaoshi.011.ac:0 "Rewarding good and punishing evil is called Xian; set the posthumous name as $Color_EHuang$ #bold Xian"
 HuangDi_miaoshi.011.ad:0 "Quick in beginning and accomplished in deed is called Zhen; set the posthumous name as $Color_EHuang$ #bold Zhen"
 HuangDi_miaoshi.011.ae:0 "Conduct seen within and without is called Xian; set the posthumous name as $Color_EHuang$ #bold Xian"
 HuangDi_miaoshi.011.af:0 "Honoring wisdom and overcoming calamity is called Zhi; set the posthumous name as $Color_EHuang$ #bold Zhi"
 HuangDi_miaoshi.011.ag:0 "Standing above all others is called Ying; set the posthumous name as $Color_EHuang$ #bold Ying"
 HuangDi_miaoshi.011.ah:0 "Wise, sagacious and enlightened is called Rui; set the posthumous name as $Color_EHuang$ #bold Rui"
 HuangDi_miaoshi.011.ai:0 "Gentle in nature and kind to the people is called Hui; set the posthumous name as $Color_EHuang$ #bold Hui"
 HuangDi_miaoshi.011.aj:0 "Able in reason and careful in judgment is called Li; set the posthumous name as $Color_EHuang$ #bold Li"
 HuangDi_miaoshi.011.ak:0 "Balanced, upright and pure is called Chun; set the posthumous name as $Color_EHuang$ #bold Chun"
 HuangDi_miaoshi.011.al:0 "Gentle, worthy and good is called Yi; set the posthumous name as $Color_EHuang$ #bold Yi"
 HuangDi_miaoshi.011.an:0 "Governing without fault is called Ping; set the posthumous name as $Color_EHuang$ #bold Ping"
 HuangDi_miaoshi.011.ao:0 "Firm in integrity and capable in affairs is called Zhen; set the posthumous name as $Color_EHuang$ #bold Zhen"
 HuangDi_miaoshi.011.ap:0 "Revering Heaven and loving the people is called Jing; set the posthumous name as $Color_EHuang$ #bold Jing"
 HuangDi_miaoshi.011.aq:0 "Fine influence reaching afar is called Guang; set the posthumous name as $Color_EHuang$ #bold Guang"
 HuangDi_miaoshi.011.ar:0 "Meeting affairs with success is called Min; set the posthumous name as $Color_EHuang$ #bold Min"
 HuangDi_miaoshi.011.as:0 "Loving harmony and not contending is called An; set the posthumous name as $Color_EHuang$ #bold An"
 HuangDi_miaoshi.011.at:0 "Giving peace to the people with great forethought is called Ding; set the posthumous name as $Color_EHuang$ #bold Ding"
 HuangDi_miaoshi.011.au:0 "Generous, joyful and a good end is called Jing; set the posthumous name as $Color_EHuang$ #bold Jing"
 HuangDi_miaoshi.011.av:0 "Deep and far-reaching thought is called Yi; set the posthumous name as $Color_EHuang$ #bold Yi"
 HuangDi_miaoshi.011.aw:0 "Righteous conduct in accord with the Way is called Xian; set the posthumous name as $Color_EHuang$ #bold Xian"
 HuangDi_miaoshi.011.ax:0 "Honoring the worthy and prizing righteousness is called Gong; set the posthumous name as $Color_EHuang$ #bold Gong"
 HuangDi_miaoshi.011.ay:0 "Honoring the worthy and prizing righteousness is called Gong; set the posthumous name as $Color_EHuang$ #bold Gong"
 HuangDi_miaoshi.011.az:0 "Loving the people and governing well is called Dai; set the posthumous name as $Color_EHuang$ #bold Dai"
 HuangDi_miaoshi.011.b:0 "Quelling disorder is called Wu; set the posthumous name as $Color_EHuang$ #bold Wu"
 HuangDi_miaoshi.011.ba:0 "Wide learning and strong memory is called Bo; set the posthumous name as $Color_EHuang$ #bold Bo"
 HuangDi_miaoshi.011.bb:0 "Of deep nature and open to remonstrance is called Li; set the posthumous name as $Color_EHuang$ #bold Li"
 HuangDi_miaoshi.011.bc:0 "Training troops and rallying the army is called Jun; set the posthumous name as $Color_EHuang$ #bold Jun"
 HuangDi_miaoshi.011.bd:0 "Upholding righteousness and holding firm is called Jian; set the posthumous name as $Color_EHuang$ #bold Jian"
 HuangDi_miaoshi.011.be:0 "Deep intent and far-reaching thought is called Fang; set the posthumous name as $Color_EHuang$ #bold Fang"
 HuangDi_miaoshi.011.bf:0 "Quick yet reverent is called Shen; set the posthumous name as $Color_EHuang$ #bold Shen"
 HuangDi_miaoshi.011.bg:0 "Respectful, frugal, grave and reverent is called Li; set the posthumous name as $Color_EHuang$ #bold Li"
 HuangDi_miaoshi.011.bh:0 "Handling affairs as is fitting is called Yi; set the posthumous name as $Color_EHuang$ #bold Yi"
 HuangDi_miaoshi.011.bi:0 "Words that can be kept is called Xin; set the posthumous name as $Color_EHuang$ #bold Xin"
 HuangDi_miaoshi.011.bj:0 "Clear-minded and in accord with reason is called Da; set the posthumous name as $Color_EHuang$ #bold Da"
 HuangDi_miaoshi.011.bk:0 "Benevolent, generous and measured is called Kuan; set the posthumous name as $Color_EHuang$ #bold Kuan"
 HuangDi_miaoshi.011.bl:0 "Soothing and pleasing the multitude is called Kai; set the posthumous name as $Color_EHuang$ #bold Kai"
 HuangDi_miaoshi.011.bm:0 "A clear heart and few desires is called Qing; set the posthumous name as $Color_EHuang$ #bold Qing"
 HuangDi_miaoshi.011.bn:0 "Not shielding one's own kin is called Zhi; set the posthumous name as $Color_EHuang$ #bold Zhi"
 HuangDi_miaoshi.011.bo:0 "Diligent in affairs and sparing in use is called Qin; set the posthumous name as $Color_EHuang$ #bold Qin"
 HuangDi_miaoshi.011.bp:0 "Turning to good and correcting faults is called Yi; set the posthumous name as $Color_EHuang$ #bold Yi"
 HuangDi_miaoshi.011.bq:0 "Mild, good and fond of music is called Liang; set the posthumous name as $Color_EHuang$ #bold Liang"
 HuangDi_miaoshi.011.br:0 "Judging the times and keeping to the rule is called Du; set the posthumous name as $Color_EHuang$ #bold Du"
 HuangDi_miaoshi.011.bs:0 "Able in goodness and raising his kind is called Lei; set the posthumous name as $Color_EHuang$ #bold Lei"
 HuangDi_miaoshi.011.bt:0 "Mild and respectful in virtue is called Ji; set the posthumous name as $Color_EHuang$ #bold Ji"
 HuangDi_miaoshi.011.bu:0 "Caring for orphans and pitying the weak is called Ci; set the posthumous name as $Color_EHuang$ #bold Ci"
