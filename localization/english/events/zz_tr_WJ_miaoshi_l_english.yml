 HuangDi_miaoshi.011.cn:0 "Unswerving in word and deed is called Shu; set the posthumous name as $Color_EHuang$ #bold Shu"
 HuangDi_miaoshi.011.co:0 "Promoting benefit and abolishing abuses is called Ge; set the posthumous name as $Color_EHuang$ #bold Ge"
 HuangDi_miaoshi.011.cp:0 "Succeeding from a distant branch is called Shao; set the posthumous name as $Color_EHuang$ #bold Shao"
 HuangDi_miaoshi.011.cq:0 "Upright and without crookedness is called Zheng; set the posthumous name as $Color_EHuang$ #bold Zheng"
 HuangDi_miaoshi.011.cr:0 "Bold in the face of events is called Yong; set the posthumous name as $Color_EHuang$ #bold Yong"
