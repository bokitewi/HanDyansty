 HuangDi_miaoshi.015.ab:0 "Upright and without guile is Jian, setting out the laws and order is Ping; the honored posthumous name is #Y 'Jianping'"
 HuangDi_miaoshi.015.ac:0 "Generous and mild in virtue is Wen, mild, good and fond of music is Liang; the honored posthumous name is #Y 'Wenliang'"
 HuangDi_miaoshi.015.ad:0 "True of heart and magnanimous is Kuang, careful conduct within due measure is Jie; the honored posthumous name is #Y 'Kuangjie'"
 HuangDi_miaoshi.015.b:0 "Ordering heaven and earth is Wen, sagacity heard far and wide is Zhao; the honored posthumous name is #Y 'Wenzhao'"
