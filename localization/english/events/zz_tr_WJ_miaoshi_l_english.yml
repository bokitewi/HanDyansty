 HuangDi_miaoshi.012.b:0 "One character cannot capture his virtue; add another."
 HuangDi_miaoshi.014.a_tt:0 "#color_dark_gray ([XianDi.GetName])#! Honorific Title: $Color_EHuang$ #BOLD [XianDi.GetNicknameNoTooltip]"
 HuangDi_miaoshi.015.a:0 "Merit reaching above and below is Guang, quelling disorder is Wu; the honored posthumous name is #Y 'Guangwu'"
