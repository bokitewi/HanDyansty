 HuangDi_miaoshi.011.cd:0 "Holding to virtue, pure and fine, is called Hou; set the posthumous name as $Color_EHuang$ #bold Hou"
 HuangDi_miaoshi.011.ce:0 "The same within and without is called Di; set the posthumous name as $Color_EHuang$ #bold Di"
 HuangDi_miaoshi.011.cf:0 "Untouched by pleasures is called Su; set the posthumous name as $Color_EHuang$ #bold Su"
