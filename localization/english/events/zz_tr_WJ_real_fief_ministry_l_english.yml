l_english:
 WJ_rf_ministry_grant:0 "Inheriting Rank and Office"
 WJ_rf_ministry_grant_desc:0 "An envoy of the court arrives bearing an edict, holding the seal and ribbon that were the credentials of the late lord's office.\n\nYou have inherited the rank of the fief, and now the court commands you to take up the post of [wj_rf_inherited_office.GetNameNoTierNoTooltip] as well. The old officials of the household exchange glad looks: if you can continue to hold the reins of government, the legacy of the late lord will reach beyond the borders of a single state.\n\nWith the edict issued, the current holder must surrender the seal and ribbon, and you will take up the post."
 WJ_rf_ministry_accept:0 "I respectfully accept the edict and take up the post."
 WJ_rf_ministry_refused:0 "The Court Declines the Appointment"
 WJ_rf_ministry_refused_desc:0 "The court's reply has come: the post of [wj_rf_inherited_office.GetNameNoTierNoTooltip] will not be granted to you.\n\nA noble rank may be inherited, but court office is no appendage of rank. The power the late lord held at court did not pass into your hands along with the seal. The post will be disposed of by the court as it sees fit; you must find another footing."
 WJ_rf_ministry_refused_accept:0 "Let this be noted for now."
