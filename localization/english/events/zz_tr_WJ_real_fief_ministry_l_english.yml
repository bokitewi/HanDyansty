l_english:
 WJ_rf_ministry_grant:0 "Inheritance and Reappointment"
 WJ_rf_ministry_grant_desc:0 "A court envoy arrives bearing an imperial edict. The seal and ribbon in the envoy's hands are the credentials of the office my late predecessor once held.\n\nI have already inherited the rank of the fief. Now the court also commands me to take up the office of [wj_rf_inherited_office.GetNameNoTierNoTooltip]. The old officials of the household exchange delighted looks: if I can continue to play a part in government, my predecessor's legacy will extend beyond a single domain.\n\nThe edict has been issued. The current holder must return the seal and ribbon, and I am to take office."
 WJ_rf_ministry_accept:0 "I respectfully obey the edict and accept the office."
 WJ_rf_ministry_refused:0 "Appointment Withheld"
 WJ_rf_ministry_refused_desc:0 "The court's reply has arrived: I will not be appointed to the office of [wj_rf_inherited_office.GetNameNoTierNoTooltip].\n\nA noble rank can be inherited, but a court office does not come with it. My late predecessor's influence at court did not pass into my hands with the seal and ribbon. The court has reserved this post for its own disposal. I must find another way to establish myself."
 WJ_rf_ministry_refused_accept:0 "I shall remember this."
