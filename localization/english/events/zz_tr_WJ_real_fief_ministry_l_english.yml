l_english:
 WJ_rf_ministry_grant:0 "Inheritance and Appointment"
 WJ_rf_ministry_grant_desc:0 "A court envoy arrives with an imperial edict. In his hands are the seal and ribbon that once attested to your late predecessor's office.\n\nYou have inherited the rank of his principality. Now the court commands you to take up the office of [wj_rf_inherited_office.GetNameNoTierNoTooltip] as well. The household's old officials exchange delighted looks: if you retain a place in government, the foundations he laid will reach beyond a single state.\n\nThe edict has been issued. The current holder must return the seal and ribbon, and you are to take office."
 WJ_rf_ministry_accept:0 "I respectfully obey the edict and accept the office."
 WJ_rf_ministry_refused:0 "Appointment Withheld"
 WJ_rf_ministry_refused_desc:0 "The court's reply has arrived: you will not be appointed to the office of [wj_rf_inherited_office.GetNameNoTierNoTooltip].\n\nA noble rank can be inherited, but court office does not belong to it. Your late predecessor's influence at court did not pass to you with his seal and ribbon. The court will dispose of this post as it sees fit; you must find another way to establish yourself."
 WJ_rf_ministry_refused_accept:0 "I shall remember this."
