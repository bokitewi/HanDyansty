l_english:
 WJ_rf_shihao.title:0 "Choosing the Late Lord's Posthumous Name"
 WJ_rf_shihao.desc:0 "[XianDi.GetUIName] has passed away. The keeper of records lays before you the account of the late lord's governance and deeds, asking you to settle a posthumous name.\n\nA posthumous name honors conduct; it does not rewrite the merits and faults of the dead according to the heir's affection, so you must choose the characters by his life. The ruler of a fief, by rite, is not called emperor and receives no temple name; all you can settle for the late lord are one or two posthumous characters."
 WJ_rf_shihao.finish:0 "Let this be the posthumous name, and complete the rite."
 WJ_rf_shihao.double:0 "One character is not enough; choose another."
 WJ_rf_shihao.custom:0 "Devise a different posthumous name."
 WJ_rf_shihao.granted_tt:0 "The late lord's posthumous name is henceforth entered in the genealogy."
