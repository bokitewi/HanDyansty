l_english:
 WJ_rf_shihao.title:0 "Choosing the Late Lord's Posthumous Name"
 WJ_rf_shihao.desc:0 "[XianDi.GetUIName] has passed away. The keeper of records lays the account of the late lord’s rule and deeds before you and asks you to settle a posthumous name.\n\nA posthumous name records a life’s conduct. An heir’s affection or resentment must not rewrite the merits and faults of the dead: you must choose its characters according to the life he led. The ruler of a fief is not styled emperor and receives no temple name. Only these one or two posthumous characters may be granted to the late lord."
 WJ_rf_shihao.finish:0 "Let this name stand. Complete the rites."
 WJ_rf_shihao.double:0 "One character is not enough. Choose another."
 WJ_rf_shihao.custom:0 "Devise a different posthumous name."
 WJ_rf_shihao.granted_tt:0 "The late lord's posthumous name is henceforth entered in the genealogy."
