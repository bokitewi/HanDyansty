l_english:
 hds_nr.1.t:0 "The Nanyang Yellow Turbans Surrender"
 hds_nr.1.desc:0 "The scattered Yellow Turban bands of Nanyang have sent men to ask for surrender. By the time the roster is read toward its end, the messenger's mouth is parched; you tell him to stop for a drink of water and leaf through the remaining names yourself.\n\nThe numbers are reported to the last man, but who knows how much effort it will take to actually organize them into ranks. Old followers such as Liu Pi, Huang Shao, He Yi and He Man are listed among them; the commanders willing to follow you will report in due course, and need not all be crammed into today's promise.\n\nYou keep the roster on your desk. The camp gate cannot simply let men in; who leads which company and who obeys which order must be made clear in turn. Still, since they are willing to come over, it is better than leaving them scattered in the countryside, facing your soldiers across the field ridges."
 hds_nr.1.a:0 "Take in their followers and organize them into ranks."
 hds_nr_nanyang_yellow_turbans:0 "Surrendered Nanyang Yellow Turbans"
 hds_nr_sun_jian_mortal_risk:0 "The Perilous Path of the Tiger of Jiangdong"
 hds_nr_sun_jian_mortal_risk_desc:0 "Even after the coalition against Dong Zhuo dispersed, this character still braves blades and arrows time and again, venturing into danger, leaving those around him constantly anxious for his safety."
