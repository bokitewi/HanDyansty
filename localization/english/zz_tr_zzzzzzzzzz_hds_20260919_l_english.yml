l_english:
 hds_nr.1.t:0 "The Nanyang Yellow Turbans Surrender"
 hds_nr.1.desc:0 "The scattered Yellow Turban bands of Nanyang send a messenger to seek surrender. As he reads through the roster, his voice grows dry. You tell him to pause for water and leaf through the remaining names yourself.\n\nEvery man is counted, but organizing them into companies will take more work. The old followers of Liu Pi, Huang Shao, He Yi, and He Man are listed among them. Commanders willing to serve will report in time; there is no need to crowd them all into today’s promises.\n\nYou keep the roster on your desk. Opening the camp gates is not enough. Who leads each company, and whose orders each man follows, must be settled next. Still, their willingness to submit is better than leaving them scattered through the countryside, facing your soldiers across the field banks."
 hds_nr.1.a:0 "Take in their followers and organize them into ranks."
 hds_nr_nanyang_yellow_turbans:0 "Surrendered Nanyang Yellow Turbans"
 hds_nr_sun_jian_mortal_risk:0 "The Perilous Path of the Tiger of Jiangdong"
 hds_nr_sun_jian_mortal_risk_desc:0 "Even after the coalition against Dong Zhuo disbands, this character repeatedly braves blades and arrows and ventures into danger, keeping those around him anxious for his safety."
