l_english:
 hd_dc_roy_end.0001.t: "The people in the hall, the accounts on the desk"
 hd_dc_enthronement_support_opinion: "Once installed a new monarch"
 hd_dc_faithful_royal_opinion: "Shouyue has been recognized."
 hd_dc_roy_end.0001.enthroned: "When I ascended the dais, I saw familiar members of the imperial clan standing on either side of the throne. Some had campaigned for me; others would not acknowledge the outcome until the war ended. \n\n This time, Your Majesty has tangible results to back your claim, and the struggle for succession has concluded. Yet those who entrusted the realm to my hands still remember their prior words. Today I may record my accession, but I cannot yet write that old promises have been fulfilled."
 hd_dc_roy_end.0001.defended: "The final dispatch is placed before me. The war for succession instigated by the imperial clan has been lost, yet I remain seated in my original position. \n\n Though the throne is preserved, the divisions within the ancestral temple will not vanish automatically. Matters left behind in the army, at home, and in imperial edicts must still be addressed one by one. Imperial clan members who did not participate in the conflict should not have their fiefdoms stripped merely because they share the same surname."
 hd_dc_roy_end.0001.a: "Battle results will be recorded truthfully, with a separate verification promised."
 hd_dc_roy_end.governance_pending_tt: "Record only the political outcomes that have occurred and resolve the acute crisis for this instance. Titles will not be transferred again, vassals will not be released, nor will peace rewards be granted; end-game rewards are determined by consulting records of real war, treaty fulfillment, stability periods, and treaty breaches."
 hd_dc_roy_end.0002.t: "Closing remarks from the Imperial Palace"
 hd_dc_roy_end.0002.enthroned: "News of the new sovereign ascending the throne has reached the palace city. The war previously linked to this struggle for the throne has ended, and the master of the imperial seat has changed due to the outcome of battle. \n\n For me, this is not a flimsy conclusion. Words spoken before, positions held, and promises yet to be fulfilled have not vanished with the new edict."
 hd_dc_roy_end.0002.defended: "The court has secured the throne, and the war for succession has ended. Yet the order of precedence and closeness within the ancestral temple cannot be settled by a single dispatch. \n\n I must still bear the consequences for my own actions; sharing the same surname does not mean everyone made the same choice."
 hd_dc_roy_end.0002.a: "From now on, it will depend on how they act."
