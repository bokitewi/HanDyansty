l_english:
 hd_dc_roy_end.0001.t:0 "The Succession War Ends"
 hd_dc_enthronement_support_opinion:0 "Supported the New Sovereign"
 hd_dc_faithful_royal_opinion:0 "Kept Their Word"
 hd_dc_roy_end.0001.enthroned:0 "On the day of your accession, familiar members of the imperial clan stand on either side of the throne. Some worked tirelessly on your behalf; others accepted the outcome only when the fighting ceased.\n\nThe Mandate changed hands through victory on the battlefield, and the succession war has ended. But those who entrusted the realm to you remember what was promised. You may ascend the throne today; that does not mean your old promises have been kept."
 hd_dc_roy_end.0001.defended:0 "The final dispatch arrives at your desk: the imperial clan’s war for the throne has ended in defeat, and you remain in your seat.\n\nThe throne is secure, but the rifts within the imperial house will not heal themselves. Matters left unresolved in the army, the family, and the edicts must be settled one by one. Clansmen who never joined the rebels should not lose their fiefs merely for sharing your surname."
 hd_dc_roy_end.0001.a:0 "Victory is settled. The old promises can wait."
 hd_dc_roy_end.governance_pending_tt:0 "Records the political outcome and resolves this crisis’s acute stage. It does not transfer titles again, release vassals, or grant peace rewards. Final rewards depend on the recorded wars, treaty compliance, years of stability, and breaches of agreement."
 hd_dc_roy_end.0002.t:0 "News from the Palace"
 hd_dc_roy_end.0002.enthroned:0 "Word arrives from the palace: a new sovereign has ascended the throne. The wars bound up with the succession struggle have ended, and the throne has changed hands.\n\nFor you, this is no simple conclusion. Your earlier words, the side you chose, and the promises still unfulfilled cannot be erased by a new edict."
 hd_dc_roy_end.0002.defended:0 "The court has held the throne, and the succession war has ended. Yet a single dispatch cannot settle every question of rank and kinship within the imperial house.\n\nYou must answer for your own deeds. Those who share a surname did not all make the same choice."
 hd_dc_roy_end.0002.a:0 "Let us see what they do next."
