l_english:

game_concept_embattle:0 "Battle Formation"
game_concept_embattle_desc:0 "Each army may have two deputy commanders, one for each flank, chosen from its own knights. Vacancies are filled automatically for armies on every side. If no suitable candidate is available, the vacancy remains open. You may use the Check Deputy Commander Vacancies Again decision to review it."
game_concept_embattle_side_advantage_modifier:0 "Deputy Commanders' Martial Adjustment"
game_concept_embattle_side_advantage_modifier_desc:0 "The Martial skills of deputy commanders affect your armies' battle advantage. With two deputies, the additional advantage equals the average Martial skill of the commander and both deputies, minus the commander's Martial skill. With one deputy, it equals the average of the commander and deputy, minus 2 and then minus the commander's Martial skill. With no deputies, the usual penalty is -5; rebel leaders and rulers with no knight slots are exempt. Only deputies still serving in the army count. Deputies less skilled than the commander may produce a negative adjustment."
game_concept_embattle_tactic:0 "Tactics (Removed)"
game_concept_embattle_tactic_desc:0 "The additional formation tactics have been removed. Unit counters and the outcome of battle follow the usual rules."

game_concept_embattle_tactic_counter:0 "Legacy Tactic Counters"
game_concept_embattle_tactic_counter_desc:0 "Counters between additional tactics have been removed and no longer affect battle advantage."

game_concept_embattle_general_tactic_group:0 "Legacy Standard Tactics"
game_concept_embattle_general_tactic_group_desc:0 "This group of tactics has been removed."

game_concept_embattle_clumsy_tactic_group:0 "Legacy Inept Tactics"
game_concept_embattle_clumsy_tactic_group_desc:0 "This group of tactics has been removed."

