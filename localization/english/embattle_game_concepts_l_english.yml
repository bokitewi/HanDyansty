l_english:

game_concept_embattle:0 "Form Formation"
game_concept_embattle_desc:0 "Refers to the deputy commander (flanks [commander|E]) system and the [embattle_tactic|E] system."
game_concept_embattle_side_advantage_modifier:0 "Correction of the advantage on the flank path"
game_concept_embattle_side_advantage_modifier_desc:0 "The base [commander|E] of the Center Army is adjusted to the average [advantage|E] of all [commanders] (Center Army and both Flanks [commanders]). If a flank commander is missing, a [martial|E][skills|E] advantage penalty of \n\n#X 5#! points will be applied."
game_concept_embattle_tactic:0 "Tactics"
game_concept_embattle_tactic_desc:0 "During combat, both sides' [commanders|E] choose a tactic from [embattle_general_tactic_group|E] every #V 20#! days. These include [embattle_tactic_counter|E]. Tactics grant corresponding bonuses to well-trained [stationed_regiment|E].\n\nIf an [army|E] has #X fewer than 3#! tactics available in a [battle|E], tactics from [embattle_clumsy_tactic_group|E] are added to bring the total to #V 3#!. Conversely, having #P more than 5#! available tactics grants [GetModifier('embattle_tactic_diversity_modifier').GetNameWithTooltip|L]."

game_concept_embattle_tactic_counter:0 "Tactical Counter Relationships"
game_concept_embattle_tactic_counter_desc:0 "Different tactics have counter relationships that affect the Central Army's [commander|E] [advantage|E]. The countered side will gain [GetModifier('embattle_tactic_counter_modifier').GetNameWithTooltip|L]."

game_concept_embattle_general_tactic_group:0 "Standard Tactical Group"
game_concept_embattle_general_tactic_group_desc:0 "Standard tactics available to a character include: \n$BULLET_WITH_TAB$[embattle_volly_tactic|E]\n$BULLET_WITH_TAB$[embattle_charge_tactic|E]\n$BULLET_WITH_TAB$[embattle_stand_fast_tactic|E]\n$BULLET_WITH_TAB$[embattle_advance_tactic|E]\n$BULLET_WITH_TAB$[embattle_harass_tactic|E]\n\n If a character has fewer than #X  #! tactics, they will be filled from the [embattle_clumsy_tactic_group|E] group up to #V  #! types."

game_concept_embattle_clumsy_tactic_group:0 "Inept Tactics Group"
game_concept_embattle_clumsy_tactic_group_desc:0 "The poor tactics that a character can employ include: \n$BULLET_WITH_TAB$[embattle_potshots_tactic|E]\n$BULLET_WITH_TAB$[embattle_reckless_charge_tactic|E]\n$BULLET_WITH_TAB$[embattle_confused_orders_tactic|E]\n$BULLET_WITH_TAB$[embattle_timid_advance_tactic|E]\n$BULLET_WITH_TAB$[embattle_disorganised_harass_tactic|E]"

# 战术
game_concept_embattle_volly_tactic:0 "Volley Fire Tactics"
game_concept_embattle_volly_tactic_desc:0 "Belongs to [embattle_general_tactic_group|E], unlocked by 1 unit of [archers|E], and upon activation in [combat_phase|E], grants [GetModifier('embattle_volly_tactic_modifier').GetNameWithTooltip|L] corresponding to [stationed_regiment|E]."
game_concept_embattle_potshots_tactic:0 "Rash Shooting Tactics"
game_concept_embattle_potshots_tactic_desc:0 "Belongs to [embattle_clumsy_tactic_group|E], after taking effect in [combat_phase|E], the central army [commander|E] gains [GetModifier('embattle_potshots_tactic_modifier').GetNameWithTooltip|L]."

game_concept_embattle_charge_tactic:0 "Charge Tactics"
game_concept_embattle_charge_tactic_desc:0 "Belongs to [embattle_general_tactic_group|E], unlocked by 1 unit of [heavy_cavalry|E], and upon activation in [combat_phase|E], grants [GetModifier('embattle_charge_tactic_modifier').GetNameWithTooltip|L] corresponding to [stationed_regiment|E]."
game_concept_embattle_reckless_charge_tactic:0 "Reckless Charge Tactics"
game_concept_embattle_reckless_charge_tactic_desc:0 "Belongs to [embattle_clumsy_tactic_group|E], after taking effect in [combat_phase|E], the central army [commander|E] gains [GetModifier('embattle_reckless_charge_tactic_modifier').GetNameWithTooltip|L]."

game_concept_embattle_stand_fast_tactic:0 "Defensive Tactics"
game_concept_embattle_stand_fast_tactic_desc:0 "Belongs to [embattle_general_tactic_group|E], unlocked by 1 unit of [spearmen|E], and upon activation in [combat_phase|E], grants [GetModifier('embattle_stand_fast_tactic_modifier').GetNameWithTooltip|L] corresponding to [stationed_regiment|E]."
game_concept_embattle_confused_orders_tactic:0 "Military Orders Enigma Tactics"
game_concept_embattle_confused_orders_tactic_desc:0 "Belongs to [embattle_clumsy_tactic_group|E], after taking effect in [combat_phase|E], the central army [commander|E] gains [GetModifier('embattle_confused_orders_tactic_modifier').GetNameWithTooltip|L]."

game_concept_embattle_advance_tactic:0 "Advance Tactics"
game_concept_embattle_advance_tactic_desc:0 "Belongs to [embattle_general_tactic_group|E], unlocked by 1 unit of [skirmisher|E] or [heavy_infantry|E], and upon activation in [combat_phase|E], grants [GetModifier('embattle_advance_tactic_modifier').GetNameWithTooltip|L] corresponding to [stationed_regiment|E]."
game_concept_embattle_timid_advance_tactic:0 "Tactical Advance with Cowardice"
game_concept_embattle_timid_advance_tactic_desc:0 "Belongs to [embattle_clumsy_tactic_group|E], after taking effect in [combat_phase|E], the central army [commander|E] gains [GetModifier('embattle_timid_advance_tactic_modifier').GetNameWithTooltip|L]."

game_concept_embattle_harass_tactic:0 "Harassment Tactics"
game_concept_embattle_harass_tactic_desc:0 "Belongs to [embattle_general_tactic_group|E], unlocked by 1 unit of [light_cavalry|E] or [archer_cavalry|E], and upon activation in [combat_phase|E], grants [GetModifier('embattle_harass_tactic_modifier').GetNameWithTooltip|L] corresponding to [stationed_regiment|E]."
game_concept_embattle_disorganised_harass_tactic:0 "Unorganized Harassment Tactics"
game_concept_embattle_disorganised_harass_tactic_desc:0 "Belongs to [embattle_clumsy_tactic_group|E], after taking effect in [combat_phase|E], the central army [commander|E] gains [GetModifier('embattle_disorganised_harass_tactic_modifier').GetNameWithTooltip|L]."

game_concept_a_culling_of_the_weak:0 "Survival of the fittest"
game_concept_a_culling_of_the_weak_desc:0 "A Culling of the Weak (ACOTW) is a performance optimization mod that defines computer characters beyond the player's [character|E] diplomatic distance as [GetTrait('acotw_obscured').GetName( GetNullCharacter )], restricting their activities."
