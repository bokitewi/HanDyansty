l_english:
 hd_yuan_jizhou.0001.t:0 "Borrowing Troops to Seize Ji"
 hd_yuan_jizhou.0001.desc:0 "The armies of the coalition against Dong Zhuo have dispersed, yet Bohai's grain supply still depends on Han Fu's goodwill. After hearing the report urging grain deliveries, you turn instead to ask about the situation north of Ji Province.\n\nHan Fu sits upon a rich province; without an outside threat, he may never seriously heed your offer of 'assistance'. Gongsun Zan's troops happen to be in the north. Inviting him south would force Han Fu to reconsider his position, and spare you from forever guarding Bohai waiting for others' charity.\n\nThe letter to the north has already been sent. On paper it speaks of advancing together, but once the pieces are truly in play, all depends on how Han Fu seeks help and how Gongsun Zan wields his troops. You leave a space on your desk for the replies, waiting for word from both quarters."
 hd_yuan_jizhou.0001.a:0 "Watch Bogui's strength, and await word from Ji Province."
 hd_yuan_jizhou.0002.t:0 "Ji Province Changes Hands"
 hd_yuan_jizhou.0002.desc:0 "Han Fu's provincial seal at last lies before you. When you take it, it feels lighter in your hand than you imagined, while the registers handed over with it come scroll after scroll until they cover the table.\n\nHis commanderies and followers are now under your command, and he himself has been lodged in your residence. The old war in the north has come to a halt with this, but the rewards Gongsun Zan hoped for have not fallen into his hands as promised. When your attendants raise the matter, you simply tell them to complete the handover of Ji Province first.\n\nNo longer must you depend on others' whims for grain; the Yuan at last hold the foundation of an entire province. As for Bogui, let him think what he will; his letters will come in due course. For today, this provincial seal is yours to keep."
 hd_yuan_jizhou.0002.a:0 "Pocket the seal and set Ji Province in order."
 hd_yuan_jizhou_victory_desc:0 "Gongsun Zan seizes the lands held by Han Fu within Ji Province, and the local vassals switch their allegiance."
 hd_yuan_jizhou_no_conquest_desc:0 "Both sides lay down their arms, and the struggle for Ji Province comes to an end."
 hd_yuan_jizhou_handover_peace_desc:0 "The situation in Ji Province has changed; this war has lost its pretext and comes to an end."
 hd_yuan_life_jizhou:0 "Master of Ji Province"
