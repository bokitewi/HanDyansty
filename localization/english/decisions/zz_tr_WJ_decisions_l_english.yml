l_english:
 wj_kaoke_table_decision:0 "Review the Realm's Official Evaluations"
 wj_kaoke_table_decision_confirm:0 "Present the Evaluations"
 wj_kaoke_table_decision_desc:0 "The Secretariat has compiled the performance records of the realm's local officials into a single table and laid it on my desk. At a glance, I can see who has served diligently and who has neglected their duties."
 wj_kaoke_table_decision_tooltip:0 "Review the performance evaluations of the realm's local officials"
 wj_kaoke_ledger_decision:0 "Review My Service Record"
 wj_kaoke_ledger_decision_confirm:0 "Present the Ledger"
 wj_kaoke_ledger_decision_desc:0 "A clerk brings me my service ledger. The official duties I have carried out this term, the battles I have fought in, and the cases I have judged are all recorded under my name. Even if I am transferred elsewhere, this ledger will follow me."
 wj_kaoke_ledger_decision_tooltip:0 "Review the merits and faults of this term, your last grade, and the rules of evaluation"
 WJ_zw_acquire_decision:0 "Petition for Supreme Military Command"
 WJ_zw_acquire_decision_confirm:0 "Submit the Petition"
 WJ_zw_acquire_decision_desc:0 "I control the memorials passing through the Secretariat and enjoy the confidence of generals and ministers. Entrusted with supervising Secretariat affairs, and with allies in many of the court's key offices, I can now petition for an imperial edict granting me command of all armies at court and in the provinces, with the authority symbolized by the Yellow Battle-Axe to unite them under a single command."
 WJ_zw_acquire_decision_tooltip:0 "Petition for an imperial edict granting command of all armies at court and in the provinces, with the authority symbolized by the Yellow Battle-Axe"
 wj_create_cheng_xiang_decision:0 "Become Chancellor and Take the Reins"
 wj_create_cheng_xiang_decision_confirm:0 "Become Chancellor and Take the Reins"
 wj_create_cheng_xiang_decision_desc:0 "The office of Chancellor has long stood vacant. These extraordinary times call for an extraordinary person to take charge of the court. With my present standing, I can petition the Son of Heaven to appoint me Chancellor, join his cabinet, and conduct the affairs of state in his stead."
 wj_create_cheng_xiang_decision_tooltip:0 "Be appointed Chancellor, enter the cabinet to govern, and become Regent to the Son of Heaven"
 wj_langguan_kaoxiao_decision:0 "Gentleman-Cadet Examination"
 wj_langguan_kaoxiao_decision_confirm:0 "Enter the Office for Examination"
 wj_langguan_kaoxiao_decision_desc:0 "The examination of the Gentlemen-Cadets' Office is about to begin again. Classical exegesis, statutes, and court disputation: only after all three sessions will it be known whether these years of study have been solid. Pass, and you will leave the office and enter service as a Filial and Incorrupt nominee; fail, and you must stay in the office another year and try again."
 wj_langguan_kaoxiao_decision_tooltip:0 "Sit the Gentleman-Cadet examination"
 wj_temp_official_kaoke_decision:0 "Request a Performance Evaluation"
 wj_temp_official_kaoke_decision_confirm:0 "Submit My Records for Assessment"
 wj_temp_official_kaoke_decision_desc:0 "A full year has passed since I began serving on probation as an acting official. Now I can submit the records and achievements of my tenure to the authorities for assessment. Above all, they will judge my ability to govern. If I pass, the rank of my current office will determine whether I am nominated as Filial and Incorrupt or Flourishing Talent."
 wj_temp_official_kaoke_decision_tooltip:0 "Submit your record of governance for assessment and seek formal entry into official service"
 WJ_yangwang_rename_decision:0 "Change My Literary Name"
 WJ_yangwang_rename_decision_confirm:0 "Choose Another Literary Name"
 WJ_yangwang_rename_decision_desc:0 "The name I have used for years may no longer suit my present state of mind. I can choose a new literary name to express what lies in my heart."
 WJ_yangwang_rename_decision_tooltip:0 "Change the literary name displayed by the Recluse trait"
