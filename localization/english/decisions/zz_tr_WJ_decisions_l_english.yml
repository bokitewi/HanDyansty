l_english:
 wj_kaoke_table_decision:0 "Review the Court-wide Merit Evaluations"
 wj_kaoke_table_decision_confirm:0 "Present the Evaluations"
 wj_kaoke_table_decision_desc:0 "The Imperial Secretariat has compiled the evaluation records of every local official in the realm into a single table and laid it upon your desk. Who is diligent and who is idle can be seen at a glance."
 wj_kaoke_table_decision_tooltip:0 "Review the merit evaluations of the realm's local officials"
 wj_kaoke_ledger_decision:0 "Review Your Merit Ledger"
 wj_kaoke_ledger_decision_confirm:0 "Present the Ledger"
 wj_kaoke_ledger_decision_desc:0 "A clerk brings you your merit ledger: the official duties handled this term, the battles you fought in person, the cases you judged, all recorded one by one under your name. Even if you are transferred elsewhere, this ledger follows you."
 wj_kaoke_ledger_decision_tooltip:0 "Review the merits and faults of this term, your last grade, and the rules of evaluation"
 WJ_zw_acquire_decision:0 "Petition for Command of All Forces Within and Without"
 WJ_zw_acquire_decision_confirm:0 "Submit the Petition"
 WJ_zw_acquire_decision_desc:0 "Within, you control the memorials of the Secretariat; without, you hold the hopes of generals and ministers. Having taken on the weighty charge of Overseeing the Affairs of the Secretariat, and with many key posts at court held by your allies, you may now request an edict granting you supreme command over all military affairs within and without the capital, and the Yellow Axe, so that the armies answer to a single command."
 WJ_zw_acquire_decision_tooltip:0 "Request an edict granting supreme command over all military affairs within and without, and the Yellow Axe"
 wj_create_cheng_xiang_decision:0 "Become Chancellor and Take the Reins"
 wj_create_cheng_xiang_decision_confirm:0 "Become Chancellor and Take the Reins"
 wj_create_cheng_xiang_decision_desc:0 "The post of Chancellor has long stood vacant. Extraordinary times demand an extraordinary man to take charge of the court. With the standing I now enjoy, I may well ask the Son of Heaven to name me Chancellor, enter the cabinet, and govern the myriad affairs in his stead."
 wj_create_cheng_xiang_decision_tooltip:0 "Be appointed Chancellor, enter the cabinet to govern, and become Regent to the Son of Heaven"
 wj_langguan_kaoxiao_decision:0 "Gentleman-Cadet Examination"
 wj_langguan_kaoxiao_decision_confirm:0 "Enter the Office for Examination"
 wj_langguan_kaoxiao_decision_desc:0 "The examination of the Gentlemen-Cadets' Office is about to begin again. Classical exegesis, statutes, and court disputation: only after all three sessions will it be known whether these years of study have been solid. Pass, and you will leave the office and enter service as a Filial and Incorrupt nominee; fail, and you must stay in the office another year and try again."
 wj_langguan_kaoxiao_decision_tooltip:0 "Sit the Gentleman-Cadet examination"
 wj_temp_official_kaoke_decision:0 "Request a Merit Evaluation"
 wj_temp_official_kaoke_decision_confirm:0 "Submit Records for Evaluation"
 wj_temp_official_kaoke_decision_desc:0 "A full year has passed in the blink of an eye since you began serving on probation as an acting clerk. Now is the time to submit the records and achievements of your tenure to the authorities and await evaluation. The evaluation weighs above all your ability to govern; if you pass, you will be nominated as Filial and Incorrupt or Flourishing Talent according to the rank of your current post."
 wj_temp_official_kaoke_decision_tooltip:0 "Submit your record of governance for evaluation and seek formal entry into officialdom"
 WJ_yangwang_rename_decision:0 "Change Literary Name"
 WJ_yangwang_rename_decision_confirm:0 "Choose Another Literary Name"
 WJ_yangwang_rename_decision_desc:0 "An old name used for long may no longer suit one's present state of mind. Take up another literary name to give voice to what lies in your heart."
 WJ_yangwang_rename_decision_tooltip:0 "Change the literary name displayed by the Recluse trait"
