 hd_peace_counter_treaty:0 "Counter-Proposal"
 hd_peace_counter_treaty_tt:0 "Withdraw the current draft. New terms can be proposed from the Treaty tab of the war overview."
 hd_peace_all_clauses_valid_tt:0 "Clause targets, gold, herds, hostages, claims, government and war leaders must all still be valid at signing; whole titles must remain within your rank and contain the other side's counties; war goals must not overlap with other ceded land, whole titles or vassal release clauses."
 hd_peace_entry_explanation:0 "The 'Treaty' tab is available in all ordinary wars without needing 100 war score; the actual result depends on the clauses signed. Historical / quest story wars, faction wars and political-system wars use special rules."
 hd_peace_open_no_pending_tt:0 "No sent treaty is awaiting a reply."
 hd_peace_open_leader_tt:0 "You are the attacker or defender leader of this war."
 hd_peace_open_ordinary_tt:0 "This war permits treaty negotiation. Only historical / quest story wars, faction wars and political-system wars use special settlement; opening the Treaty tab in other wars does not require 100 war score."
 hd_peace_scripted_settle:0 "Settle by Special Rules"
 hd_peace_scripted_settle_tt:0 "Once either side reaches 100 war score, the special victory or defeat result for this story war is applied. Story events may also end the war early under set conditions."
 hd_peace_objective_toggle:0 "Add / Remove: Fulfill Attacker's War Goal"
 hd_peace_objective_tt:0 "Available to the attacker only. Fulfills the full goal of this casus belli: independence, formal submission, enforcing a claim, transfer of the target territory, or, as listed below, handing over artifacts, destroying a special building or relocation and resettlement.\nCannot be combined with other cession, whole-title, vassal release or tribute clauses. Price: [GetPlayer.MakeScope.ScriptValue('hd_peace_objective_price_value')|0] points, one fifth of the full clause price; for territory goals only counties still held by the other side count, and counties already occupied by our side cost half again. A total price above 100 cannot be forced. If the goal becomes invalid, the treaty must be redrafted."
 hd_peace_objective_selected:0 "Full war goal added, price [GetPlayer.MakeScope.ScriptValue('hd_peace_objective_price_value')|0] points. Beneficiary: [GetPlayer.MakeScope.Var('hd_peace_objective_claimant').Char.GetTitledFirstName]. The target titles of this war are listed below (may be empty for non-territorial wars):"
 hd_peace_event_objective:0 "\n• Recognize the attacker's full war goal in [hd_peace_event_war.GetName]. Beneficiary: [hd_peace_event_proposer.MakeScope.Var('hd_peace_objective_claimant').Char.GetShortUIName]. Price: [hd_peace_event_proposer.MakeScope.ScriptValue('hd_peace_objective_price_value')|0] points.\nIndependence, submission and claims are handled according to the relationship or beneficiary concerned; ordinary territory goals transfer the target counties still held by the enemy; special content for artifacts, razing and relocation is listed below."
 hd_peace_artifact_objective_details:0 "War goal: hand the following [GetPlayer.MakeScope.Var('hd_peace_objective_artifact_count').GetValue|0] artifact(s) over to the attacker, for a total of [GetPlayer.MakeScope.ScriptValue('hd_peace_objective_price_value')|0] points (one fifth of the full clause price of 100). An ordinary artifact war lists only artifacts that meet the personal or family claim conditions; a relic war lists only relics that the original war declaration allows to be reclaimed. The list is fixed when the treaty is drafted, and other artifacts that appear later are not seized."
 hd_peace_raze_objective_details:0 "War goal: raze the special mandala capital building in [GetPlayer.MakeScope.Var('hd_peace_objective_raze_province').GetProvince.GetName], for a total of [GetPlayer.MakeScope.ScriptValue('hd_peace_objective_price_value')|0] points (one fifth of the full clause price of 100). This also removes the defender's god-king status and phoenix-rebirth modifier tied to that building. No other buildings are destroyed, and the original war's prestige or piety rewards and penalties are not included."
 hd_peace_migration_objective_details:0 "War goal: complete the migration chosen at the declaration of war, for a total of [GetPlayer.MakeScope.ScriptValue('hd_peace_objective_price_value')|0] points (one fifth of the full clause price of 100). The destination titles and demesne are received under the original migration rules, the old lands and migrating vassals are handled, and the capital and camp are moved to the new homeland. Post-migration control changes, cooldowns and resettlement are retained; the original victory prestige is not included."
 hd_peace_event_artifact_objective:0 "\nArtifact clause: hand over the [hd_peace_event_proposer.MakeScope.Var('hd_peace_objective_artifact_count').GetValue|0] artifact(s) listed when the treaty was drafted. Hover over the accept option for the item-by-item list; losing the claim, an artifact changing hands to a third party or an artifact vanishing will void the original proposal."
 hd_peace_event_raze_objective:0 "\nRazing clause: destroy the special mandala capital building in [hd_peace_event_proposer.MakeScope.Var('hd_peace_objective_raze_province').GetProvince.GetName], and remove the god-king status and phoenix-rebirth modifier tied to it. Other buildings remain."
 hd_peace_event_migration_objective:0 "\nMigration clause: complete the migration to the destination and demesne chosen at the declaration of war, receiving the relevant titles, handling the old lands and migrating vassals, moving the capital and camp, and applying the original post-migration control changes, cooldowns and resettlement."
 hd_peace_relocation_objective_details:0 "War goal: complete the adventure conquest and relocate the capital, for a total of [GetPlayer.MakeScope.ScriptValue('hd_peace_objective_price_value')|0] points (one fifth of the full clause price of 100). The target titles are received, the new lands entered, and government and vassalage handled under the corresponding war rules. Varangian adventures and legendary expeditions also give up or transfer the old lands and resettle the accompanying family under the original rules; landless adventurer invasions become landed rulers under the original rules and, where applicable, honor their vassalage agreement with their sponsor. The original victory bounty, prestige, traits and house creation rewards are not included."
 hd_peace_event_relocation_objective:0 "\nAdventure relocation clause: receive the target lands of this war, move the capital, and handle government and vassalage under the original rules. Varangian adventures and legendary expeditions include giving up or transferring the old lands and resettling the accompanying family; landless adventurer invasions include becoming a landed ruler and, where applicable, submitting to the sponsor. The original victory bounty, prestige, traits and house creation rewards are not included in the treaty."
 hd_peace_cb_result_desc:0 "Ordinary wars apply only the clauses listed in the treaty; story wars are settled under special rules."
 hd_peace_cb_invalidated_desc:0 "The war ended because its casus belli became invalid. No treaty is signed, and no ordinary war rewards or penalties are given."
 hd_peace_select_demand_titles:0 "Demand Titles"
 hd_peace_cat_title_cost:0 "Per County"
 hd_peace_demand_titles_tt:0 "Demand a whole de jure title: take all counties the other side holds within that duchy, kingdom or empire; if the title itself is held by the other side's faction, it is transferred too.\nSelectable titles are at most the same tier as your highest title; titles below your rank cost 10% less. Any number may be selected. For a forced treaty, all counties taken must belong to the war goal."
 hd_peace_map_demand_titles_title:0 "Their Ceded Whole Titles"
 hd_peace_title_picker_subtitle:0 "Duchy-level or higher titles, at most the same tier as yours, in any number."
 hd_peace_title_picker_empty:0 "No whole titles can be demanded. You must hold a duchy-level or higher title, and the other side must hold counties within that de jure title."
 hd_peace_title_picker_desc:0 "When a larger title is selected, any selected counties and smaller titles within it are merged in automatically."
 hd_peace_demand_title_row_tt:0 "Demand #high [Title.GetName]#!: take all counties the other side holds within this de jure territory; if the title is held by the other side's faction, it is transferred too."
 hd_peace_title_row_detail:0 "They hold [GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('county', Title.MakeScope).ScriptValue('hd_peace_demand_title_row_county_count_value')|0] counties here"
 hd_peace_title_row_covered:0 "Already included in a larger selected title"
 hd_peace_title_row_discount:0 "#P Below your rank · 10% off#!"
 hd_peace_demand_title_price_tt:0 "#T [Title.GetNameNoTier]#!\nClause price: #high [GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('county', Title.MakeScope).ScriptValue('hd_peace_demand_title_row_price_value')|0]#! points.\nPriced county by county for the [GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('county', Title.MakeScope).ScriptValue('hd_peace_demand_title_row_county_count_value')|0] counties they hold here: higher development costs more, and the holder's capital costs extra; counties occupied by our side cost half; the defender's counties in an ordinary annexation war cost half again; counties within your de jure territory that are occupied by our side are free. If the title's tier is below your highest title, the total is reduced by a further 10%."
