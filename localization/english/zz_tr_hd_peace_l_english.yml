 hd_peace_acceptance_balance_tt:0 "#T Treaty Assessment#!\nWhen willingness to accept reaches 0, the AI may agree to the treaty. War duration and the military strength of both sides affect the will to keep fighting.\n\nAt 100 war score, you can force a treaty that fits the war type, whose total demands cost no more than 100 points and which contains no concessions from us. Forced cession is limited to the war goal (the defender's entire realm in an ordinary annexation); if you demand only counties within your de jure territory that are occupied by our side, a treaty can be forced even below 100 war score, as long as your war score is not negative. Releasing third-party vassals and new alliances require both sides' consent.\n\nAn ordinary war enforces only the listed clauses, with no additional land, reparations or imprisonment rewards from the original casus belli."
 hd_peace_at_least_one_clause_tt:0 "Select at least one clause."
 hd_peace_gold_caps_valid_tt:0 "Gold cannot exceed the payer's current wealth plus one year of positive income."
 hd_peace_ai_will_accept_tt:0 "Peace can be made below 100 war score: the AI's willingness to accept must reach 0, or the other side must be a player with no treaty awaiting a reply. Only a forced treaty requires 100 war score and conformity with the clause types and the 100-point budget; the exception is demanding only counties within your de jure territory that are occupied by our side, while your war score is not negative."
