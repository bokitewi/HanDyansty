 hd_peace_county_holder_occupied:0 "Holder: [Title.GetHolder.GetUIName] · #P Occupied by us, half price (free within your de jure territory)#!"
 hd_peace_demand_county_price_tt:0 "#T [Title.GetNameNoTier]#!\nClause price: #high [GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('county', Title.MakeScope).ScriptValue('hd_peace_demand_county_row_price_value')|0]#! points (base [GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('county', Title.MakeScope).ScriptValue('hd_peace_demand_county_row_base_price_value')|0] points).\nHigher development means a higher price, and the holder's capital costs extra. Counties occupied by our side cost half; the defender's counties in an ordinary annexation war cost half again; counties within your de jure territory that are occupied by our side need no war score. If you hold a duchy-level or higher title, a further 10% off."
 hd_peace_treaty_offer_event_demand_titles:0 "\n• Cede whole titles: [hd_peace_event_proposer.MakeScope.ScriptValue('hd_peace_demand_title_count_value')|0] in total, handing over all counties you hold within their de jure territory; if the title is held by your faction, it is transferred too"
