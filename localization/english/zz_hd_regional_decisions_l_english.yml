l_english:
 hd_repair_shu_roads_decision: "Repair the Shu Road"
 hd_repair_shu_roads_decision_desc: "The mountainous regions of Shu are crisscrossed by steep ranges, and the suspension bridges along the passways are frequently damaged by rain, snow, or warfare. Allocate funds and conscript craftsmen to repair a key route of your choosing."
 hd_repair_shu_roads_decision_tooltip: "Select a Shu Road located within your territory, spend #V 1000#! gold coins to grant the local area a road bonus lasting thirty years."
 hd_tuntian_tazhong_decision: "Cultivate fields at Tazhong"
 hd_tuntian_tazhong_decision_desc: "The Tapizhong Valley is suitable for both cultivation and defense. If we construct irrigation canals and build granaries, allowing soldiers and civilians to live intermingled there, it will not only supply the border troops but also gradually transform into fertile land."
 hd_tuntian_tazhong_decision_tooltip: "Spend #V 1200#! gold to grant a continuous 30-year benefit of military farming in Ta; executing it again will refresh the duration without stacking the values."
 hd_consume_wushisan_decision: "Take the Five-Stone Powder"
 hd_consume_wushisan_decision_desc: "The powdered medicine swirls with a fine white glow in the cup. The physician says it can bring clarity to the mind and spirit—until least, until the medicine's power fades."
 hd_consume_wushisan_decision_tooltip: "Ingested the Five-Stone Powder to alleviate stress, then fell into a drug-induced stupor within two years."

 hd_repaired_shu_road_modifier: "Repair the Shu Road"
 hd_repaired_shu_road_modifier_desc: "The plank roads, bridges, and relay stations along the route have been repaired, ensuring safe passage for military forces and travelers."
 hd_tazhong_tuntian_modifier: "Tazhong Military Farming"
 hd_tazhong_tuntian_modifier_desc: "Military households repair irrigation canals and cultivate land, with grain stored in nearby granaries, enabling this border region to simultaneously serve agricultural production and military supply needs."
 hd_satisfied_nanman_modifier: "Satisfied Barbarians"
 hd_satisfied_nanman_modifier_desc: "The local chieftain has been recognized, and his followers are temporarily willing to pay tribute and provide troops under the new order."
 hd_inward_migration_modifier: "Foreign tribes relocated inward"
 hd_inward_migration_modifier_desc: "The newly relocated tribal groups brought livestock, laborers, and skilled warriors, while also reclaiming abandoned lands."

 hd_regional_decisions.10.t: "Disseminate"
 hd_regional_decisions.10.desc: "After warming the wine and administering the medicine, a burning heat surged through my abdomen, followed by a lightness in my limbs. The wind outside seemed to fade away, and the anxieties that had weighed upon me for days dissolved in a daze. Yet the sweat beading on my forehead and the trembling of my fingertips reminded me: this clarity came at a price."
 hd_regional_decisions.10.a: "And put on my clothes, walking slowly while allowing the medicine's effects to fade away."

 hd_regional_decisions.100.t: "Six Paths Enter Shu"
 hd_regional_decisions.100.desc: "Six routes to Shu are listed side by side on the wooden slips. Artisans and laborers await orders, yet the treasury can only fund the construction of one path for now. My fingertips hover over the mountain ranges; I must decide where to dispatch funds, grain, timber, and stone."
 hd_regional_decisions.100.a: "Repair the Miciang Dao"
 hd_regional_decisions.100.b: "Repair the pass road"
 hd_regional_decisions.100.c: "Repair the Baoxia Road"
 hd_regional_decisions.100.d: "Repair the Liangdang and Chencang roads."
 hd_regional_decisions.100.e: "Repair the Ziwu Road"
 hd_regional_decisions.100.f: "Repair the Tangluo Pass"
 hd_regional_decisions.100.cancel: "Let this matter be deferred for the time being."

 hd_pacify_nanman_decision: "Soothe the Southern Barbarians"
 hd_pacify_nanman_decision_desc: "The Nanzhou region is separated by mountains and rivers; the names of its former commanderies and counties may not command universal respect. If we acknowledge a local chieftain and allow him to govern his homeland according to tribal customs, it might secure decades of stability."
 hd_pacify_nanman_decision_tooltip: "From the Ningzhou Legal Duchy personally held by you, select one to establish a direct vassal duke. Each duchy can only be pacified once; upon success, a five-year cooldown is applied."
 hd_nanman_acceptance_gain: "Soothe the Southern Barbarians"
 hd_regional_decisions.200.t: "Govern According to Local Customs"
 hd_regional_decisions.200.desc: "Messengers from the various mountains of Ningzhou presented wooden staffs, feather ornaments, and registers of each tribe at the foot of the steps. They expressed their willingness to elect individuals familiar with local languages and ancient treaties to bear the seal and ribbon, but requested that the new lord continue to handle affairs within the mountains according to tribal customs. Where should this policy be implemented first?"
 hd_regional_decisions.200.yunnan: "Establish the local leader of Yunnan"
 hd_regional_decisions.200.jianning: "Establish the local leader of Jianning"
 hd_regional_decisions.200.zangke: "Establish the local chief of Zangke"
 hd_regional_decisions.200.wuling: "Establish the local leader of Wuling as a chieftain"
 hd_regional_decisions.200.fuling: "Establish the local leader of Fuling"
 hd_regional_decisions.200.yuexi: "Establish the local chieftain of Yexi"
 hd_regional_decisions.200.bajun: "Establish the local leader of Ba Commandery"
 hd_regional_decisions.200.yongchang: "Establish the local leader of Yongchang as a chieftain"
 hd_regional_decisions.200.cancel: "This matter is of great significance; it shall be decided later."

 hd_move_foreign_peoples_inward_decision: "Foreign tribes relocated inward"
 hd_move_foreign_peoples_inward_decision_desc: "Northern tribes request to bring livestock and families into the realm. Grant them a county, making their leader a direct vassal; this will both reclaim wasteland and allow recruitment of skilled warriors from among them."
 hd_move_foreign_peoples_inward_decision_tooltip: "Select a faction, then choose a fief from the eight direct non-capital counties with the lowest development level. Upon success, a ten-year cooldown is applied."
 hd_regional_decisions.300.t: "Foreign Guests from the Frontier"
 hd_regional_decisions.300.desc: "Horses neighed outside the tent one after another. Several northern tribes were willing to migrate into the territory, but each had its own language, customs, and chieftain. The envoy waited for me to name those who would be accepted."
 hd_regional_decisions.300.xiongnu: "Permit the Xiongnu tribes to migrate inward"
 hd_regional_decisions.300.xianbei: "Permit the Xiongnu tribes to migrate inward"
 hd_regional_decisions.300.qiang: "Permit the Qiang tribes to migrate inland."
 hd_regional_decisions.300.wuhuan: "Permit the Wuhuan tribes to migrate inward."
 hd_regional_decisions.300.cancel: "The border regions are not yet prepared."
 hd_regional_decisions.310.t: "Select Location to Settle"
 hd_regional_decisions.310.desc: "The map marks several directly-administered commanderies and counties with sparse populations. Migrants require pastureland, arable fields, and a city suitable for the leader's residence; once granted land, they will also assume responsibilities for border defense and tax collection."
 hd_regional_decisions.310.a: "Grant [scope:hd_migration_county_1.GetNameNoTier] to them"
 hd_regional_decisions.310.b: "Grant [scope:hd_migration_county_2.GetNameNoTier] to them"
 hd_regional_decisions.310.c: "Grant [scope:hd_migration_county_3.GetNameNoTier] to them"
 hd_regional_decisions.310.d: "Grant [scope:hd_migration_county_4.GetNameNoTier] to them"
 hd_regional_decisions.310.e: "Grant [scope:hd_migration_county_5.GetNameNoTier] to them"
 hd_regional_decisions.310.f: "Grant [scope:hd_migration_county_6.GetNameNoTier] to them"
 hd_regional_decisions.310.g: "Grant [scope:hd_migration_county_7.GetNameNoTier] to them"
 hd_regional_decisions.310.h: "Grant [scope:hd_migration_county_8.GetNameNoTier] to them"
 hd_regional_decisions.310.cancel: "Hold off on granting the land for now."

 hd_explore_far_west_decision: "Explore the Far West"
 hd_explore_far_west_decision_desc: "News has reached Liangzhou through layers of relay: beyond the Kongling Mountains and countless city-states, there lies a realm known as Daqin in the setting sun. Organize an embassy to bring back its people and accounts from the East."
 hd_explore_far_west_decision_tooltip: "Spend #V 1500#! gold to dispatch an expeditionary mission to the far west lasting approximately five years. It can be retried before success; however, it can only succeed once worldwide."
 hd_regional_decisions.400.t: "Toward the Setting Sun"
 hd_regional_decisions.400.desc: "The camel bells form an unbroken line beyond the walls of Liangzhou. The translator stuffs the final bundle of bamboo slips into a leather bag, and the envoy bows to bid me farewell; from now on, as I journey westward, with each pass crossed, familiar words and rites will grow ever fewer."
 hd_regional_decisions.400.a: "Carry the imperial mandate westward and bring back what you have seen and heard."
 hd_regional_decisions.401.t: "Desert Sands Cut Off Supplies"
 hd_regional_decisions.401.desc: "Urgent dispatch arrives from the western relay stations: sandstorms have buried the planned water sources, and the camel caravan's provisions suffice for only one route. The envoy requests additional grain and water be procured locally; otherwise, they must risk crossing based solely on pre-departure planning."
 hd_regional_decisions.401.safe: "Allocate an additional 200 taels of gold to procure grain and water locally."
 hd_regional_decisions.401.risk: "Cross the formation in accordance with the established grain registers."
 hd_regional_decisions.402.t: "All Commanders at the Passes"
 hd_regional_decisions.402.desc: "The embassy has arrived at a city-state controlling the trade routes. The gatekeepers demand gifts far exceeding the norm, while the merchant caravan warns that forcing an alternate route may lead to being mistaken for bandits. How to respond must be decided from ten thousand li away."
 hd_regional_decisions.402.safe: "Allocate 200 taels of gold to bestow upon the local chieftain in accordance with proper rites."
 hd_regional_decisions.402.risk: "Order Chen Ming to issue a decree exempting the people from nameless taxes."
 hd_regional_decisions.403.t: "Unfamiliar Script"
 hd_regional_decisions.403.desc: "The final batch of returns brings lead tablets inscribed with unfamiliar characters. Several guides offer conflicting accounts regarding the route and the name of the state; if scholars are hired to decipher them, the mission may proceed safely, otherwise the embassy must rely on its existing knowledge to judge the way forward."
 hd_regional_decisions.403.safe: "Allocate two hundred taels of gold to invite local scholars."
 hd_regional_decisions.403.risk: "Compare the old map with oral accounts, then continue westward."
 hd_regional_decisions.404.t: "Guest from the Great Qin"
 hd_regional_decisions.404.desc: "Years later, the sound of camel bells echoed once more beneath the pass. A scholar clad in strange attire accompanied an embassy into the hall. He could discourse on trade tariffs, celestial bodies, and distant shores, and was willing to remain within my court to translate the writings of Great Qin one by one."
 hd_regional_decisions.404.a: "Prepare a banquet for this distant guest."
 hd_regional_decisions.409.t: "Western Envoy Has Not Returned"
 hd_regional_decisions.409.desc: "The broken staff of office was brought back to Liangzhou by merchants. Exhausted supplies, disputes, or wrong paths ultimately broke the mission; the survivors could no longer continue and had to return with the eastward-bound merchant caravans. The road to the far west still exists, but this expedition has ended."
 hd_regional_decisions.409.a: "Organize the records; envoys may be dispatched in the future."

 hd_explore_yizhou_decision: "Explore Yizhou"
 hd_explore_yizhou_decision_desc: "The people of Hai in Kuaiji claim that beyond the southeastern seas lie vast islands. By constructing sea vessels and recruiting those familiar with the tides, the court may finally secure a reliable maritime route to Yizhou for the first time."
 hd_explore_yizhou_decision_tooltip: "Spend #V 800#! gold to dispatch a fleet for approximately two years. Retries are allowed before success; this can only succeed once worldwide."
 hd_regional_decisions.500.t: "Fan departs from Kuaiji"
 hd_regional_decisions.500.desc: "The new vessel departs with the tide, its sails filled by the damp sea breeze. The navigator marks the mountain ranges of Kuaiji as the final coordinates of their return journey, then the fleet passes beyond the nearshore fishing boats and steers toward a direction that only the songs of sailors can identify."
 hd_regional_decisions.500.a: "Follow the tide and be sure to leave a record of your voyage."
 hd_regional_decisions.501.t: "Freshwater is nearly depleted."
 hd_regional_decisions.501.desc: "The bamboo slips returned by the fleet are coated in salt crust. Continuous headwinds have prolonged the voyage, and the fresh water has begun to sour; you may pay for supplies from coastal islands or proceed strictly according to the rations planned before departure."
 hd_regional_decisions.501.safe: "Allocate one hundred taels of gold to purchase supplies along the way."
 hd_regional_decisions.501.risk: "Reduce daily rations and maintain the scheduled voyage."
 hd_regional_decisions.502.t: "Lost Lu Ying"
 hd_regional_decisions.502.desc: "For several days, no land was visible on the horizon, and familiar constellations were obscured by clouds. The local boatmen offered to guide the fleet in exchange for generous gifts; without hiring them, the fleet would have to rely solely on currents, wind direction, and incomplete sea charts to navigate."
 hd_regional_decisions.502.safe: "Allocate 100 gold to hire a local navigator."
 hd_regional_decisions.502.risk: "Correct the tides and star positions to navigate autonomously."
 hd_regional_decisions.503.t: "Black Tide Storm"
 hd_regional_decisions.503.desc: "Dark clouds press down as towering walls of waves approach from the southeast. The fleet may spend gold to reinforce hulls at the nearest island cove and wait for the winds to shift, or rely on the sailors' training to race through the black tide before the storm closes in."
 hd_regional_decisions.503.safe: "Allocate one hundred taels of gold to repair ships in Wan Harbor and seek shelter from the wind."
 hd_regional_decisions.503.risk: "Discipline the naval forces and ride the waves through the black tide."
 hd_regional_decisions.504.t: "Yizhou Returns the Sail"
 hd_regional_decisions.504.desc: "The returning ship's sails carry the scent of unfamiliar resins and sea salt. A guide from Yizhou steps onto the dock, unfurling a coastline map he drew by hand; he is willing to remain in the palace, continuing to recount the harbors, tribes, and monsoons of the island."
 hd_regional_decisions.504.a: "Store the sea chart and invite him to court."
 hd_regional_decisions.509.t: "Lower the sails and return"
 hd_regional_decisions.509.desc: "Several battered ships drifted back to Kuaiji one after another. Deprived of water, lost in navigation, and battered by storms, the fleet had no further strength to continue southward. Existing records are insufficient to confirm that Yizhou had been reached. The sea route could still be retraced, but this voyage must end here."
 hd_regional_decisions.509.a: "Repair the shipyard; we can try again another day."

 hd_partition_han_decision: "The Two Han Dynasties Ruled Separately"
 hd_partition_han_decision_desc: "The realm is too vast; imperial edicts take months to travel from Luoyang to Liangzhou. Since one emperor cannot oversee both east and west, why not follow the ancients' example by dividing the world into Eastern Han and Western Han, with two emperors of the same lineage each governing their respective regions?"
 hd_partition_han_decision_tooltip: "Divide the fully controlled Han Empire into Eastern Han with Luoyang as its capital and Western Han with Chang'an as its capital. This resolution can be executed only once worldwide."
 hd_regional_decisions.600.t: "The Eastern and Western Capitals"
 hd_regional_decisions.600.desc: "The two maps of the Luoyang palace and the Chang'an city walls are laid out side by side. Once the imperial edict is issued, Guanzhong, Liangzhou, and Yizhou will belong to the Western Han, while the rest of the realm will belong to the Eastern Han. Another emperor may be chosen from among the royal clan, but I must first decide which palace I shall occupy."
 hd_regional_decisions.600.east: "I remain in Luoyang to rule the Eastern Han."
 hd_regional_decisions.600.west: "I have moved to Chang'an to rule the Western Han Dynasty."
 hd_regional_decisions.600.cancel: "Put away the two maps."
 hd_regional_decisions.610.t: "Choose to establish another Han emperor"
 hd_regional_decisions.610.desc: "The edict of division has been drafted; only the name of the other emperor remains unwritten. The chosen member of the imperial clan shall receive another capital, half of the realm's territory, and an imperial title sufficient to stand alongside mine."
 hd_regional_decisions.610.a: "Order [scope:hd_partition_child_1.GetShortUINameNoTooltip] to inherit another Han"
 hd_regional_decisions.610.b: "Order [scope:hd_partition_child_2.GetShortUINameNoTooltip] to inherit another Han"
 hd_regional_decisions.610.c: "Order [scope:hd_partition_child_3.GetShortUINameNoTooltip] to inherit another Han"
 hd_regional_decisions.610.d: "Order [scope:hd_partition_child_4.GetShortUINameNoTooltip] to inherit another Han"
 hd_regional_decisions.610.e: "Order [scope:hd_partition_child_5.GetShortUINameNoTooltip] to inherit another Han"
 hd_regional_decisions.610.f: "Order [scope:hd_partition_child_6.GetShortUINameNoTooltip] to inherit another Han"
 hd_regional_decisions.610.g: "Order [scope:hd_partition_child_7.GetShortUINameNoTooltip] to inherit another Han"
 hd_regional_decisions.610.h: "Order [scope:hd_partition_child_8.GetShortUINameNoTooltip] to inherit another Han"
 hd_regional_decisions.610.fallback: "With no eligible members of the imperial clan available, one must instead select an adult from a collateral branch of the same lineage."
