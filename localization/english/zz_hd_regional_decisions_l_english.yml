l_english:
 hd_repair_shu_roads_decision: "Repair the Roads of Shu"
 hd_repair_shu_roads_decision_desc: "Shu's towering mountains bar the way, and its cliffside plank roads are often damaged by rain, snow, and warfare. I can allocate money and silk, call up craftsmen, and choose a vital route to repair."
 hd_repair_shu_roads_decision_tooltip: "Choose a road in Shu within your realm, call up craftsmen, and rebuild its cliffside plankways"
 hd_tuntian_tazhong_decision: "Establish Military Farms in Tazhong"
 hd_tuntian_tazhong_decision_desc: "The valley of Tazhong offers land to farm and ground to defend. If I build canals and granaries and settle soldiers alongside civilians, it could supply the border armies and gradually become fertile farmland."
 hd_tuntian_tazhong_decision_tooltip: "Dig canals and reclaim fields in Tazhong so that soldiers and civilians can farm the land together"
 hd_consume_wushisan_decision: "Take the Five-Stone Powder"
 hd_consume_wushisan_decision_desc: "The powder gleams faintly white in the cup. The physician says it will lift my spirits and loosen the bonds of body and mind—at least until its effects wear off."
 hd_consume_wushisan_decision_tooltip: "Take Five-Stone Powder and forget your troubles for a while"

 hd_repaired_shu_road_modifier: "Restored Roads of Shu"
 hd_repaired_shu_road_modifier_desc: "The plank roads, bridges, and relay stations along the route have been repaired, ensuring safe passage for military forces and travelers."
 hd_tazhong_tuntian_modifier: "Tazhong Military Farming"
 hd_tazhong_tuntian_modifier_desc: "Military households repair irrigation canals and cultivate land, with grain stored in nearby granaries, enabling this border region to simultaneously serve agricultural production and military supply needs."
 hd_satisfied_nanman_modifier: "Satisfied Barbarians"
 hd_satisfied_nanman_modifier_desc: "The court has recognized the local chiefs. For now, their followers are willing to pay tribute and taxes and answer the call to arms."
 hd_inward_migration_modifier: "Tribes Settled in the Interior"
 hd_inward_migration_modifier_desc: "The newly relocated tribal groups brought livestock, laborers, and skilled warriors, while also reclaiming abandoned lands."

 hd_regional_decisions.10.t: "Hair Unbound"
 hd_regional_decisions.10.desc: "After I take the powder, the unease in my chest begins to recede. The voices of my attendants sound as though a curtain hangs between us. The troubles I was turning over in my mind a moment ago can no longer hold my attention.\n\nI brace myself against the edge of the desk and rise. Only then do I notice the faint trembling in my fingertips and how unsteady I am on my feet. This sudden lightness has settled none of my official business. The papers on my desk have not vanished on their own.\n\nSeeing my expression ease, my attendants stop pressing me for answers. I dismiss them, drape a robe over my shoulders, and walk slowly. My worries can rest for now, but the feverish heat and discomfort that follow the powder are mine to endure."
 hd_regional_decisions.10.a: "I will put on a robe and walk slowly until the powder wears off."

 hd_regional_decisions.100.t: "Six Roads into Shu"
 hd_regional_decisions.100.desc: "Maps of the roads into Shu cover my desk, their damaged stretches circled in red. I trace one route to its end, but before I can speak, a clerk hands me the estimates for timber, stone, laborers, and provisions.\n\nA stretch of plank road takes up barely an inch on the map. Rebuilding it will mean sending who knows how many people into the mountains with heavy loads. Reports have come from all six roads, each insisting its repairs are the most urgent. The treasury will not grow with every cry of \"urgent.\"\n\nI hold down a corner of the map and tell everyone to pause. Which road to repair this time—or whether to put the work off for now—is mine to decide."
 hd_regional_decisions.100.a: "Repair the Micang Road"
 hd_regional_decisions.100.b: "Repair the Guancheng Road"
 hd_regional_decisions.100.c: "Repair the Baoxie Road"
 hd_regional_decisions.100.d: "Repair the Liangdang and Chencang Roads"
 hd_regional_decisions.100.e: "Repair the Ziwu Road"
 hd_regional_decisions.100.f: "Repair the Tangluo Road"
 hd_regional_decisions.100.cancel: "Let this matter be deferred for the time being."

 hd_pacify_nanman_decision: "Soothe the Southern Barbarians"
 hd_pacify_nanman_decision_desc: "Mountains and rivers divide Ningzhou. The old names of its commanderies and counties may no longer command obedience. If I recognize a local chief and let them govern their homeland according to tribal custom, I may secure decades of peace."
 hd_pacify_nanman_decision_tooltip: "Choose a commandery in Ningzhou and invest a local chief as your tribal vassal, allowing them to govern according to their own customs"
 hd_nanman_acceptance_gain: "Pacification of the Southern Barbarians"
 hd_regional_decisions.200.t: "Govern According to Local Customs"
 hd_regional_decisions.200.desc: "Delegates from the commanderies of Nanzhong wait below the dais. With every sentence the interpreter speaks, they exchange glances. When the discussion turns to governing, several chiefs suddenly fall silent, as though we have finally reached what they came to hear.\n\nIf I grant them land and let them govern their people by their own customs, many matters the commanderies and counties struggle to manage will be settled elsewhere. Yet I must still choose which commandery to begin with, and whose hands will receive its seal.\n\nRather than urge the interpreter to continue, I look at the list on my desk. A nod beside one name will bring a very different response from a nod beside another."
 hd_regional_decisions.200.yunnan: "Invest a Local Chief in Yunnan"
 hd_regional_decisions.200.jianning: "Invest a Local Chief in Jianning"
 hd_regional_decisions.200.zangke: "Invest a Local Chief in Zangke"
 hd_regional_decisions.200.wuling: "Invest a Local Chief in Wuling"
 hd_regional_decisions.200.fuling: "Invest a Local Chief in Fuling"
 hd_regional_decisions.200.yuexi: "Establish the local chieftain of Yexi"
 hd_regional_decisions.200.bajun: "Invest a Local Chief in Ba Commandery"
 hd_regional_decisions.200.yongchang: "Invest a Local Chief in Yongchang"
 hd_regional_decisions.200.cancel: "This is too important to rush. We will decide later."

 hd_move_foreign_peoples_inward_decision: "Settle Foreign Tribes in the Interior"
 hd_move_foreign_peoples_inward_decision_desc: "Tribes beyond the frontier ask to enter with their livestock and families. Granting them a county in their settlement region and making their chief my direct vassal could bring abandoned land back into use and give me a source of seasoned warriors. Yet concentrating these newcomers in one place may bring unrest later."
 hd_move_foreign_peoples_inward_decision_tooltip: "Admit a tribe from beyond the frontier, grant them a county to settle in, and make their chief your direct vassal"
 hd_regional_decisions.300.t: "Visitors from Beyond the Frontier"
 hd_regional_decisions.300.desc: "Envoys from the northern tribes seek audiences one after another. Barely have they announced their chiefs' names before they ask where their migrating people may settle. I tell the interpreter to take his time and explain each delegation's request separately.\n\nThe Xiongnu, Xianbei, Jie, Di, Qiang, and Wuhuan differ in their numbers, our past dealings, and the languages they speak. Yet someone at the gathering always calls them all \"Hu,\" as though a single word could spare us every arrangement that follows.\n\nI have a clerk lay out their letters in turn. First I must decide whom to admit, then which county to grant. The hopeful faces below the dais cannot make that decision for me."
 hd_regional_decisions.300.xiongnu: "Permit the Xiongnu tribes to migrate inward"
 hd_regional_decisions.300.xianbei: "Allow the Xianbei to Settle Within the Realm"
 hd_regional_decisions.300.qiang: "Permit the Qiang tribes to migrate inland."
 hd_regional_decisions.300.wuhuan: "Permit the Wuhuan tribes to migrate inward."
 hd_regional_decisions.300.cancel: "The border regions are not yet prepared."
 hd_regional_decisions.310.t: "A Place to Settle"
 hd_regional_decisions.310.desc: "The map marks several directly-administered commanderies and counties with sparse populations. Migrants require pastureland, arable fields, and a city suitable for the leader's residence; once granted land, they will also assume responsibilities for border defense and tax collection."
 hd_regional_decisions.310.a: "Grant [hd_migration_county_1.GetNameNoTier] to them"
 hd_regional_decisions.310.b: "Grant [hd_migration_county_2.GetNameNoTier] to them"
 hd_regional_decisions.310.c: "Grant [hd_migration_county_3.GetNameNoTier] to them"
 hd_regional_decisions.310.d: "Grant [hd_migration_county_4.GetNameNoTier] to them"
 hd_regional_decisions.310.e: "Grant [hd_migration_county_5.GetNameNoTier] to them"
 hd_regional_decisions.310.f: "Grant [hd_migration_county_6.GetNameNoTier] to them"
 hd_regional_decisions.310.g: "Grant [hd_migration_county_7.GetNameNoTier] to them"
 hd_regional_decisions.310.h: "Grant [hd_migration_county_8.GetNameNoTier] to them"
 hd_regional_decisions.310.cancel: "Hold off on granting the land for now."

 hd_explore_far_west_decision: "Explore the Far West"
 hd_explore_far_west_decision_desc: "Travelers in Liangzhou bring reports passed from one person to another. Beyond the Congling Mountains and countless city-states, they say, lies a realm at the setting sun said to call itself Daqin. If I organize an embassy, it might bring its people and knowledge back to the East."
 hd_explore_far_west_decision_tooltip: "Send envoys west beyond the Congling Mountains to seek Daqin in the land of the setting sun"
 hd_regional_decisions.400.t: "Toward the Setting Sun"
 hd_regional_decisions.400.desc: "The embassy is ready for its journey west. Before departing, the interpreter checks the documents once more. Those who come to take their leave point out the roads they will follow, but beyond a certain distance, they have only old travelers' accounts to guide them.\n\nI ask about provisions and arrangements for assistance, and tell them to record what they see separately from what they hear. With every pass and crossing to the west, writing, customs, and roads will change. A distant realm's name may travel far, but the knowledge they bring home must be gathered one stage at a time.\n\nOnce the embassy departs, its letters will not reach my desk for some time. I put away my copy of the route map and await news from the West."
 hd_regional_decisions.400.a: "Carry my credentials west, and record all you see."
 hd_regional_decisions.401.t: "Short of Food in the Sands"
 hd_regional_decisions.401.desc: "A report from the western embassy arrives with the edges of its wrapping worn and frayed. Windblown sand has disrupted their plans, and the old rations of food and water will no longer suffice. As I reach their plea for help, I draw the document closer.\n\nI unfold the route map, but my finger can only rest on the place marked in the report. I cannot endure the thirst and exhaustion in their place, so far away. Still, it is for me to write the reply."
 hd_regional_decisions.401.safe: "Send another 200 gold to buy food and water locally."
 hd_regional_decisions.401.risk: "Divide the party by the existing roster and press on through the sands."
 hd_regional_decisions.402.t: "Gates of the Trading Cities"
 hd_regional_decisions.402.desc: "No sooner has the embassy overcome its shortage of food and water than a city on the trade route bars its way. Their letter says the local authorities demand lavish gifts. The interpreter has negotiated at length, only to hear the same answer repeated.\n\nWhen I read the price, I turn back through the document to see whether they truly must pass this way. At their departure we spoke of knowledge from distant lands. Now the question is always how much the next gate will cost to open.\n\nI lay the letter flat. The people waiting outside that city need an answer from me."
 hd_regional_decisions.402.safe: "Send 200 gold for customary gifts to the local chief."
 hd_regional_decisions.402.risk: "Present our credentials. We will pay no unauthorized tax."
 hd_regional_decisions.403.t: "Unfamiliar Script"
 hd_regional_decisions.403.desc: "The guides have given two different routes for the same place. The embassy's report sets both accounts side by side. By the time I finish reading, all I can do is frown at the old map. Neither route looks like a slip of the brush I can simply strike out.\n\nI lay the two accounts together and find myself wishing I could question whoever first drew the map. Yet no one at my desk knows those distant roads. I must still choose a course and send my reply."
 hd_regional_decisions.403.safe: "Send 200 gold to hire a local scholar."
 hd_regional_decisions.403.risk: "Compare the old maps and follow the route west."
 hd_regional_decisions.404.t: "A Visitor from Daqin"
 hd_regional_decisions.404.desc: "After years away, the embassy finally returns with new knowledge. A scholar from the distant land is brought before me, his belongings still dusty from the road. When he speaks of trade routes and coastlines, his account is clearer than many of our old maps.\n\nI ask the interpreter to slow down and record, one by one, the things the scholar can attest to himself. At last, someone can explain how to travel between places whose names we knew only from repeated hearsay, and how their people live.\n\nThe scholar is willing to stay and work with us, and we can examine the books he has brought in time. I order quarters prepared for our distant guest. This journey west should yield more than a foreign realm's name for us to boast about."
 hd_regional_decisions.404.a: "Prepare a banquet for this distant guest."
 hd_regional_decisions.409.t: "Western Envoy Has Not Returned"
 hd_regional_decisions.409.desc: "The returning envoy brings no glad tidings. He merely places the surviving records on my desk. I wait a moment before he tells me the journey west can go no further.\n\nThe pages still name places they never reached, but no new entries follow. The setbacks along the road have exhausted their last chances. Only these people and these few rolls of writing could be brought home. When I ask about parts of their journey, he answers slowly. Each pause is harder to make sense of than the place names themselves.\n\nI put the records aside. The money and provisions have been spent, and they have indeed traveled far. The mission they set out to accomplish remains unfulfilled."
 hd_regional_decisions.409.a: "Preserve the surviving records for another day."

 hd_explore_yizhou_decision: "Explore Yizhou"
 hd_explore_yizhou_decision_desc: "The coastal people of Kuaiji speak of a vast island beyond the southeastern sea. If I build seagoing ships and recruit people who know the tides, the court may at last gain a reliable route to Yizhou."
 hd_explore_yizhou_decision_tooltip: "Send a fleet from Kuaiji to seek Yizhou across the sea"
 hd_regional_decisions.500.t: "Sails Depart Kuaiji"
 hd_regional_decisions.500.desc: "The fleet is ready to sail. Its navigator makes a final check of the coastal landmarks, waters, and arrangements for the return. The departure report lists every ship, its provisions, and the people aboard.\n\nI ask them about every sea route they know. Farther out, the map is still largely blank. We have long heard of Yizhou, but a few tales gathered on shore cannot tell us how to reach it or where to anchor.\n\nAs the voyage begins, I tell them to keep records along the way and never set down a guess as something they have seen. Messages will take time to pass between us. The difficulties they meet at sea must be answered by their earlier preparations and the instructions that reach them in turn."
 hd_regional_decisions.500.a: "Follow the tide and be sure to leave a record of your voyage."
 hd_regional_decisions.501.t: "Fresh Water Runs Low"
 hd_regional_decisions.501.desc: "At last, a report arrives from the fleet. It opens with supplies, not discoveries. Headwinds have lengthened the voyage, and though the leader has recalculated the rations, he still asks me for more funds.\n\nI turn back to the first page and realize that twice in succession, my eyes have gone straight to the word \"water.\" The ships are far away. Here at my desk, only a few lines of dry ink remain. My reply will be short, but those aboard must depend on it for the next stretch of sea."
 hd_regional_decisions.501.safe: "Send 100 gold to buy supplies along the way."
 hd_regional_decisions.501.risk: "Reduce daily rations and maintain the scheduled voyage."
 hd_regional_decisions.502.t: "Land Fades from View"
 hd_regional_decisions.502.desc: "No sooner has the fleet overcome its shortage of supplies than its members disagree over unfamiliar waters. The route described by coastal boatmen differs from the old records. The navigator sends both accounts and asks me to decide.\n\nI look at the chart. Lines that seemed so clear on shore are suddenly unreliable at sea. A messenger asks when the reply can leave, and I smooth a corner of the chart. \"Proceed with care\" will not do as an answer. What they truly need is to know which route to trust."
 hd_regional_decisions.502.safe: "Allocate 100 gold to hire a local navigator."
 hd_regional_decisions.502.risk: "Tell them to read the tides and stars and find their own way."
 hd_regional_decisions.503.t: "Storms Ahead"
 hd_regional_decisions.503.desc: "The navigator's report includes a list of repairs needed to hulls and rigging. At the end, he writes that the seas ahead are growing rougher, and a nearby bay offers shelter. After reading the damage, the words urging them onward die on my lips.\n\nFirst supplies, then directions, and now even the ships seem to be asking for money. I take out the earlier reports and consider this fleet, ever farther from home. What I have already spent cannot shield them from the wind. The next payment is still mine to decide."
 hd_regional_decisions.503.safe: "Send 100 gold. Shelter in the bay and repair the ships."
 hd_regional_decisions.503.risk: "Put the crews in order and press on through the waves."
 hd_regional_decisions.504.t: "Sails Return from Yizhou"
 hd_regional_decisions.504.desc: "The fleet has finally returned. The shortages, lost bearings, and storms that I knew only from reports are now visible in the wear on the ships. Those who sailed present their records, then bring forward a guide from Yizhou.\n\nI ask him to explain the coasts and anchorages on the chart while the interpreter records each answer. The island's bays, peoples, and ways of navigating are no longer the vague rumors we heard before departure.\n\nThe guide is willing to stay. I have quarters prepared for him and order the records stored safely. Only now is the voyage truly complete. What it has brought us should serve those who come after, not merely furnish wondrous tales at dinner."
 hd_regional_decisions.504.a: "Store the sea chart and invite him to court."
 hd_regional_decisions.509.t: "A Voyage Cut Short"
 hd_regional_decisions.509.desc: "The report from the returning ships is far more subdued than the one sent at departure. The leader presents the surviving records. When he reaches the point where they could go no farther, his voice drops, and for a while he cannot continue.\n\nI turn through the pages. Supplies, navigation, storms: each earlier letter had offered another course to try. Now they all lead to the same conclusion. This voyage can no longer fulfill its purpose.\n\nThe messenger seems about to offer words of comfort. I ask him first to explain what happened. The ships can still be repaired and the records preserved. The places they never reached remain unreached."
 hd_regional_decisions.509.a: "Repair the shipyard; we can try again another day."

 hd_partition_han_decision: "Divide Han into East and West"
 hd_partition_han_decision_desc: "The realm is so vast that an edict takes months to travel from Luoyang to Liangzhou. One Son of Heaven can scarcely attend to both East and West. Why should I not follow the ancients and divide the realm into Eastern and Western Han, with two emperors of my dynasty each governing one side?"
 hd_partition_han_decision_tooltip: "Divide the realm into Eastern and Western Han, with capitals at Luoyang and Chang'an"
 hd_regional_decisions.600.t: "The Eastern and Western Capitals"
 hd_regional_decisions.600.desc: "Maps of Luoyang and Chang'an lie open side by side. The proposal to divide the realm now demands my answer. If it goes ahead, Guanzhong, Liangzhou, and Yizhou will belong to Western Han, and the rest of the realm to Eastern Han. Each will have its own Son of Heaven and capital.\n\nI look first at Luoyang, then move my hand to Chang'an. Choosing where to remain means more than choosing where I will hold court. It determines which lands and subjects I keep, and which I entrust to another member of my dynasty.\n\nThe edict has not yet been issued. I can still put an end to this proposal."
 hd_regional_decisions.600.east: "I remain in Luoyang to rule the Eastern Han."
 hd_regional_decisions.600.west: "I will move to Chang'an and reign over Western Han."
 hd_regional_decisions.600.cancel: "Put the maps away. This proposal is abandoned."
 hd_regional_decisions.610.t: "Choose the Other Han Emperor"
 hd_regional_decisions.610.desc: "The division of East and West is agreed, and I have chosen which side to keep. Yet one of the most important names on the edict remains blank.\n\nOne member of the imperial family on this list will receive the other capital and its territories, standing beside me as an emperor. This is no honorary title bestowed on a whim. Authority that once issued from a single court will truly be divided between two.\n\nI read the list from the beginning. The clerk waits with his brush, but I do not tell him to start writing words of praise. What matters now is the person whose name will fill that space."
 hd_regional_decisions.610.a: "Appoint [hd_partition_child_1.GetShortUINameNoTooltip] to rule the other Han realm"
 hd_regional_decisions.610.b: "Appoint [hd_partition_child_2.GetShortUINameNoTooltip] to rule the other Han realm"
 hd_regional_decisions.610.c: "Appoint [hd_partition_child_3.GetShortUINameNoTooltip] to rule the other Han realm"
 hd_regional_decisions.610.d: "Appoint [hd_partition_child_4.GetShortUINameNoTooltip] to rule the other Han realm"
 hd_regional_decisions.610.e: "Appoint [hd_partition_child_5.GetShortUINameNoTooltip] to rule the other Han realm"
 hd_regional_decisions.610.f: "Appoint [hd_partition_child_6.GetShortUINameNoTooltip] to rule the other Han realm"
 hd_regional_decisions.610.g: "Appoint [hd_partition_child_7.GetShortUINameNoTooltip] to rule the other Han realm"
 hd_regional_decisions.610.h: "Appoint [hd_partition_child_8.GetShortUINameNoTooltip] to rule the other Han realm"
 hd_regional_decisions.610.fallback: "None of these imperial relatives will do. Choose another of my dynasty."
