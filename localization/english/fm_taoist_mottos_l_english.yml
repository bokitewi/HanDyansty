 motto_fm_taoist_697:0 "An army may lose its leader, a man not his will"
 motto_fm_taoist_698:0 "Learn broadly, will firmly, ask earnestly, think closely"
 motto_fm_taoist_699:0 "The noble seek within"
 motto_fm_taoist_700:0 "The petty seek without"
 motto_fm_taoist_701:0 "The Way births one, one births two, two births three, three births all things"
 motto_fm_taoist_702:0 "In life man is soft and supple, in death hard and stiff"
 motto_fm_taoist_703:0 "The hard and strong are death's fellows, the soft are life's"
 motto_fm_taoist_704:0 "The mighty sink low, the gentle rise above"
 motto_fm_taoist_705:0 "All the world knows it, yet none can practice it"
 motto_fm_taoist_706:0 "The sage wears coarse cloth yet holds jade within"
 motto_fm_taoist_707:0 "Without leaving home, one knows the world"
 motto_fm_taoist_708:0 "Without a glance outside, one sees the Way of heaven"
 motto_fm_taoist_709:0 "The farther one goes, the less one knows"
 motto_fm_taoist_710:0 "The sage knows without going, names without seeing"
 motto_fm_taoist_711:0 "Accomplish all through non-action"
 motto_fm_taoist_712:0 "The Way is ever nameless and unworked"
 motto_fm_taoist_713:0 "Heaven and earth unite and send down sweet dew"
 motto_fm_taoist_714:0 "Knowing when to stop keeps one from danger"
 motto_fm_taoist_715:0 "The great Way flows, reaching left and right"
 motto_fm_taoist_716:0 "All things rely on it, and it never refuses"
 motto_fm_taoist_717:0 "It clothes and feeds all things yet claims no mastery"
 motto_fm_taoist_718:0 "Ever desireless, it may be called small"
 motto_fm_taoist_719:0 "All things return to it, yet it claims no rule"
 motto_fm_taoist_720:0 "Hold fast the great image and the world comes"
 motto_fm_taoist_721:0 "Music and good food make the traveler pause"
 motto_fm_taoist_722:0 "Spoken, the Way is bland and without flavor"
 motto_fm_taoist_723:0 "Too faint to see, too faint to hear"
 motto_fm_taoist_724:0 "Use it and it is never used up"
 motto_fm_taoist_725:0 "To shrink a thing, first stretch it out"
 motto_fm_taoist_726:0 "To weaken a thing, first make it strong"
 motto_fm_taoist_727:0 "To cast a thing down, first raise it up"
 motto_fm_taoist_728:0 "To take from a thing, first give to it"
 motto_fm_taoist_729:0 "A fish must not leave the deep pool"
 motto_fm_taoist_730:0 "A state's sharp tools must not be shown to men"
 motto_fm_taoist_731:0 "When desire stirs, I quiet it with nameless simplicity"
 motto_fm_taoist_732:0 "Nameless simplicity brings freedom from desire"
 motto_fm_taoist_733:0 "Desireless and still, the world settles itself"
 motto_fm_taoist_734:0 "High virtue acts not and has no motive"
 motto_fm_taoist_735:0 "Low virtue acts and always has a motive"
 motto_fm_taoist_736:0 "High benevolence acts without a motive"
 motto_fm_taoist_737:0 "High righteousness acts with a motive"
 motto_fm_taoist_738:0 "High ritual acts and no one responds"
 motto_fm_taoist_739:0 "Lose the Way, then comes virtue"
 motto_fm_taoist_740:0 "Lose virtue, then comes benevolence"
 motto_fm_taoist_741:0 "Lose benevolence, then comes righteousness"
 motto_fm_taoist_742:0 "Lose righteousness, then comes ritual"
 motto_fm_taoist_743:0 "Ritual is but the thin edge of loyalty and trust"
 motto_fm_taoist_744:0 "Foreknowledge is the flower of the Way"
 motto_fm_taoist_745:0 "Dwell in the fruit, not in the flower"
 motto_fm_taoist_746:0 "Of old the One: heaven gained it and grew clear"
 motto_fm_taoist_747:0 "Earth gained it and was calm, spirit gained it and was quick"
 motto_fm_taoist_748:0 "Valleys gained it and filled, all things gained it and lived"
 motto_fm_taoist_749:0 "Heaven without its clarity would surely crack"
 motto_fm_taoist_750:0 "Earth without its calm would surely waste away"
 motto_fm_taoist_751:0 "The noble rests on the humble, the high on the low"
 motto_fm_taoist_752:0 "The highest praise is to be without praise"
 motto_fm_taoist_753:0 "Returning is the movement of the Way"
 motto_fm_taoist_754:0 "Yielding is the working of the Way"
 motto_fm_taoist_755:0 "All things under heaven are born of being"
 motto_fm_taoist_756:0 "And being is born of non-being"
 motto_fm_taoist_757:0 "The best hear the Way and practice it with care"
 motto_fm_taoist_758:0 "The middling hear it, half keep and half lose it"
 motto_fm_taoist_759:0 "The lowest hear it and break into loud laughter"
 motto_fm_taoist_760:0 "Were it not laughed at, it would not be the Way"
 motto_fm_taoist_761:0 "The bright Way seems dim, the advancing Way seems to retreat"
 motto_fm_taoist_762:0 "High virtue seems a valley, great whiteness seems stained"
 motto_fm_taoist_763:0 "Broad virtue seems lacking, firm virtue seems idle"
 motto_fm_taoist_764:0 "The Way gives life, and virtue rears it"
 motto_fm_taoist_765:0 "Things give it form, and circumstances complete it"
 motto_fm_taoist_766:0 "The Way is honored, virtue prized, none commands yet ever so of itself"
 motto_fm_taoist_767:0 "To rear without ruling is the mystic virtue"
 motto_fm_taoist_768:0 "The world has a beginning, which is its mother"
 motto_fm_taoist_769:0 "Knowing the mother, one knows the children"
 motto_fm_taoist_770:0 "Knowing the children, keep to the mother"
 motto_fm_taoist_771:0 "To the end of life one meets no danger"
 motto_fm_taoist_772:0 "Stop the openings, shut the gates, and never toil through life"
 motto_fm_taoist_773:0 "Open the openings, pile up affairs, and none can save you"
 motto_fm_taoist_774:0 "To see the small is clear sight, to keep the soft is strength"
 motto_fm_taoist_775:0 "Use the light and return again to clarity"
 motto_fm_taoist_776:0 "Leaving no harm to the self, this is following the constant"
 motto_fm_taoist_777:0 "Were I truly wise, I would walk the great Way"
 motto_fm_taoist_778:0 "Only beware of the tempting byways"
 motto_fm_taoist_779:0 "The great Way is smooth, yet men love the side paths"
 motto_fm_taoist_780:0 "Courts too clean, fields too wild, granaries too empty"
 motto_fm_taoist_781:0 "In bright robes, with sharp swords, sated with food"
 motto_fm_taoist_782:0 "Wealth to spare is the boasting of robbers"
 motto_fm_taoist_783:0 "What is well planted is not uprooted, what is well held is not dropped"
 motto_fm_taoist_784:0 "The offerings of descendants will never cease"
 motto_fm_taoist_785:0 "Cultivate it in the self and its virtue is true"
 motto_fm_taoist_786:0 "Cultivate it in the house and its virtue is ample"
 motto_fm_taoist_787:0 "Cultivate it in the village and its virtue is lasting"
 motto_fm_taoist_788:0 "Cultivate it in the state and its virtue is abundant"
 motto_fm_taoist_789:0 "Cultivate it in the world and its virtue is everywhere"
 motto_fm_taoist_790:0 "See the self through the self, the house through the house"
 motto_fm_taoist_791:0 "See the world through the world"
 motto_fm_taoist_792:0 "One rich in virtue is like a newborn child"
 motto_fm_taoist_793:0 "No stinging insect harms him, no wild beast seizes him"
 motto_fm_taoist_794:0 "Soft of bone and sinew, yet his grip is firm"
 motto_fm_taoist_795:0 "He cries all day without hoarseness, so perfect is his harmony"
 motto_fm_taoist_796:0 "To know harmony is the constant, to know the constant is clear sight"
 motto_fm_taoist_797:0 "To nurse life is good fortune, to drive the breath by will is force"
 motto_fm_taoist_798:0 "What grows strong then ages is not of the Way"
 motto_fm_taoist_799:0 "What is not of the Way comes to an early end"
 motto_fm_taoist_800:0 "Blunt the sharp edges, untie the tangles"
 motto_fm_taoist_801:0 "Soften the glare, join with the dust"
 motto_fm_taoist_802:0 "This is called the mystic union"
 motto_fm_taoist_803:0 "Not to be courted, not to be kept at distance"
 motto_fm_taoist_804:0 "Not to be profited, not to be harmed"
 motto_fm_taoist_805:0 "Not to be honored, not to be debased"
 motto_fm_taoist_806:0 "Thus it is prized by all the world"
 motto_fm_taoist_807:0 "Rule the state with uprightness, wage war with surprise"
 motto_fm_taoist_808:0 "Win the world through non-interference"
 motto_fm_taoist_809:0 "The more taboos there are, the poorer the people"
 motto_fm_taoist_810:0 "The more sharp tools men have, the darker the state"
 motto_fm_taoist_811:0 "The more cunning arts, the more strange things arise"
 motto_fm_taoist_812:0 "The more laws are proclaimed, the more thieves appear"
 motto_fm_taoist_813:0 "I do nothing and the people transform themselves"
 motto_fm_taoist_814:0 "I love stillness and the people right themselves"
 motto_fm_taoist_815:0 "I meddle not and the people grow rich"
 motto_fm_taoist_816:0 "I desire not and the people turn simple"
 motto_fm_taoist_817:0 "Government dull, the people are honest"
 motto_fm_taoist_818:0 "Government sharp, the people are crafty"
 motto_fm_taoist_819:0 "Who can know the limit, for there is no fixed rule"
 motto_fm_taoist_820:0 "The upright turns strange, the good turns sinister"
 motto_fm_taoist_821:0 "Square without cutting, sharp without wounding"
 motto_fm_taoist_822:0 "Straight without recklessness, bright without glare"
 motto_fm_taoist_823:0 "To rule men and serve heaven, nothing beats thrift"
 motto_fm_taoist_824:0 "Thrift means submitting early to the Way"
 motto_fm_taoist_825:0 "Early submission means deep-piled virtue"
 motto_fm_taoist_826:0 "With deep-piled virtue, nothing is unconquered"
 motto_fm_taoist_827:0 "Nothing unconquered, none can know his limit"
 motto_fm_taoist_828:0 "Not knowing his limit, he can hold the state"
 motto_fm_taoist_829:0 "Holding the state's mother, he can long endure"
 motto_fm_taoist_830:0 "Deep roots, firm stem, the Way of long life and lasting sight"
 motto_fm_taoist_831:0 "Rule a great state as one cooks a small fish"
 motto_fm_taoist_832:0 "With the Way presiding, ghosts lose their power"
 motto_fm_taoist_833:0 "Not that ghosts lack power, but they harm no one"
 motto_fm_taoist_834:0 "Neither harming the other, virtue flows back to both"
 motto_fm_taoist_835:0 "A great state is the low stream where the world meets"
 motto_fm_taoist_836:0 "The female conquers the male by stillness, staying low"
 motto_fm_taoist_837:0 "The great state that lowers itself wins the small state"
 motto_fm_taoist_838:0 "The small state that lowers itself wins the great state"
 motto_fm_taoist_839:0 "Rivers and seas can be kings of all the valleys"
 motto_fm_taoist_840:0 "Because they stay low, they can rule the valleys"
 motto_fm_taoist_841:0 "To be above the people, the sage speaks humbly"
 motto_fm_taoist_842:0 "To go before the people, he stays behind them"
 motto_fm_taoist_843:0 "Above them, the people feel no burden"
 motto_fm_taoist_844:0 "Before them, the people take no harm"
 motto_fm_taoist_845:0 "The world gladly advances him and never tires"
 motto_fm_taoist_846:0 "Because he does not contend, none can contend with him"
 motto_fm_taoist_847:0 "The world says my Way is great yet seems like nothing"
 motto_fm_taoist_848:0 "Because it is great, it seems like nothing"
 motto_fm_taoist_849:0 "I have three treasures which I hold and keep"
 motto_fm_taoist_850:0 "The first is compassion, the second is thrift"
 motto_fm_taoist_851:0 "The third is not daring to lead the world"
 motto_fm_taoist_852:0 "Compassion brings courage, thrift brings breadth"
 motto_fm_taoist_853:0 "Not leading the world, one becomes its vessel's head"
 motto_fm_taoist_854:0 "Cast compassion for courage, cast thrift for breadth"
 motto_fm_taoist_855:0 "With compassion, one conquers in war"
 motto_fm_taoist_856:0 "With compassion, defense stands firm"
 motto_fm_taoist_857:0 "Heaven will save him whom compassion guards"
 motto_fm_taoist_858:0 "A good warrior is never warlike"
 motto_fm_taoist_859:0 "A good fighter is never wrathful"
 motto_fm_taoist_860:0 "A good conqueror does not engage the foe"
 motto_fm_taoist_861:0 "A good leader places himself below others"
 motto_fm_taoist_862:0 "This is the virtue of not contending"
 motto_fm_taoist_863:0 "This is the strength of using others"
 motto_fm_taoist_864:0 "This matches heaven, the ancient summit"
 motto_fm_taoist_865:0 "My words are easy to know and easy to practice"
 motto_fm_taoist_866:0 "Yet the world cannot know them or practice them"
 motto_fm_taoist_867:0 "Words have a source, deeds have a master"
 motto_fm_taoist_868:0 "Because men are ignorant, they do not know me"
 motto_fm_taoist_869:0 "Few know me, and therefore I am precious"
 motto_fm_taoist_870:0 "The wren nests in the deep woods, yet needs but one branch"
 motto_fm_taoist_871:0 "To know you do not know is best, to think you know when you do not is sick"
 motto_fm_taoist_872:0 "Sick of being sick, therefore not sick"
 motto_fm_taoist_873:0 "The sage is not sick because he is sick of sickness"
 motto_fm_taoist_874:0 "When people fear no power, great power arrives"
 motto_fm_taoist_875:0 "Cramp not their dwelling, weary not their livelihood"
 motto_fm_taoist_876:0 "Not wearying them, they will not weary of you"
 motto_fm_taoist_877:0 "The sage knows himself but shows himself not"
 motto_fm_taoist_878:0 "He loves himself but prizes himself not"
 motto_fm_taoist_879:0 "Bold daring leads to death, bold restraint to life"
 motto_fm_taoist_880:0 "Of these two, one profits and one harms"
 motto_fm_taoist_881:0 "What heaven detests, who can know the reason"
 motto_fm_taoist_882:0 "Heaven's Way does not contend yet conquers well"
 motto_fm_taoist_883:0 "It answers without speaking, comes without being called"
 motto_fm_taoist_884:0 "Serene, yet it plans all things well"
 motto_fm_taoist_885:0 "When people fear not death, why threaten them with death"
 motto_fm_taoist_886:0 "If people always feared death, and one played the villain"
 motto_fm_taoist_887:0 "I would seize and slay him, and who would dare"
 motto_fm_taoist_888:0 "There is ever a great executioner who kills"
 motto_fm_taoist_889:0 "He who hews in the master's place rarely keeps his hands"
 motto_fm_taoist_890:0 "The people hunger because their rulers tax too much"
 motto_fm_taoist_891:0 "The people are hard to rule because their rulers meddle"
 motto_fm_taoist_892:0 "The people scorn death because their rulers live too richly"
 motto_fm_taoist_893:0 "One who makes little of life is wiser than one who prizes it"
 motto_fm_taoist_894:0 "In life grass and trees are soft, in death withered and dry"
 motto_fm_taoist_895:0 "An army grown rigid is destroyed, a tree grown rigid breaks"
 motto_fm_taoist_896:0 "Is not the Way of heaven like the bending of a bow"
 motto_fm_taoist_897:0 "The high it presses down, the low it raises up"
 motto_fm_taoist_898:0 "What has surplus it takes from, what lacks it fills"
 motto_fm_taoist_899:0 "Heaven's Way takes from the surplus to fill the lacking"
 motto_fm_taoist_900:0 "Man's way takes from the lacking to serve the surplus"
 motto_fm_taoist_901:0 "The cook carves the ox with effortless skill"
 motto_fm_taoist_902:0 "Follow the natural line as your guiding rule"
 motto_fm_taoist_903:0 "The senses halt while the spirit moves on"
 motto_fm_taoist_904:0 "Following heaven's grain, strike the great seams"
 motto_fm_taoist_905:0 "Standing at ease, brimming with satisfaction"
 motto_fm_taoist_906:0 "Rest in the time, dwell in the flow"
 motto_fm_taoist_907:0 "Neither grief nor joy can enter in"
 motto_fm_taoist_908:0 "The fuel burns out, yet the fire passes on"
 motto_fm_taoist_909:0 "Know what cannot be helped, accept it as fate"
 motto_fm_taoist_910:0 "Virtue is the cultivation of perfect harmony"
 motto_fm_taoist_911:0 "Men see not in flowing water but in still water"
 motto_fm_taoist_912:0 "Only stillness can still all that moves"
 motto_fm_taoist_913:0 "A mirror bright gathers no dust"
 motto_fm_taoist_914:0 "In form comply, in heart stay gentle"
 motto_fm_taoist_915:0 "A mantis raising its arms to stop a cart"
 motto_fm_taoist_916:0 "The use of the useless"
 motto_fm_taoist_917:0 "You are not a fish, how do you know a fish's joy"
 motto_fm_taoist_918:0 "The shrine oak, useless, lives out its years"
 motto_fm_taoist_919:0 "The clever toil, the wise worry"
 motto_fm_taoist_920:0 "The incapable ask for nothing"
 motto_fm_taoist_921:0 "Eat your fill and roam at ease"
 motto_fm_taoist_922:0 "Drifting like an untied boat"
 motto_fm_taoist_923:0 "Empty yourself to wander the world"
 motto_fm_taoist_924:0 "Empty yourself in the world and none can harm you"
 motto_fm_taoist_925:0 "The straight tree is felled first, the sweet well drained first"
 motto_fm_taoist_926:0 "All men know the use of the useful"
 motto_fm_taoist_927:0 "But none know the use of the useless"
 motto_fm_taoist_928:0 "Heaven and earth have great beauty yet do not speak"
 motto_fm_taoist_929:0 "The seasons follow clear laws yet do not discuss"
 motto_fm_taoist_930:0 "All things have their pattern yet do not explain"
 motto_fm_taoist_931:0 "The sage seeks the source of heaven and earth's beauty"
 motto_fm_taoist_932:0 "The perfect man acts not, the great sage does nothing"
 motto_fm_taoist_933:0 "The Way cannot be heard, what is heard is not it"
 motto_fm_taoist_934:0 "The Way cannot be seen, what is seen is not it"
 motto_fm_taoist_935:0 "The Way cannot be spoken, what is spoken is not it"
 motto_fm_taoist_936:0 "Know the formless that forms all forms"
 motto_fm_taoist_937:0 "Without thought or care, one begins to know the Way"
 motto_fm_taoist_938:0 "Without clinging or serving, one rests in the Way"
 motto_fm_taoist_939:0 "Without path or pursuit, one attains the Way"
 motto_fm_taoist_940:0 "The true men of old felt no joy in living"
 motto_fm_taoist_941:0 "And felt no dread of dying"
 motto_fm_taoist_942:0 "They slept without dreams, woke without care"
 motto_fm_taoist_943:0 "They ate without relish, breathed from their depths"
 motto_fm_taoist_944:0 "The true man breathes from his very heels"
 motto_fm_taoist_945:0 "The common man breathes from his throat"
 motto_fm_taoist_946:0 "What divides is what completes, what completes is what destroys"
 motto_fm_taoist_947:0 "Gain comes in its season, loss in due course"
 motto_fm_taoist_948:0 "Free of past and present, one enters deathlessness"
 motto_fm_taoist_949:0 "Fish forget one another in the rivers and lakes"
 motto_fm_taoist_950:0 "Men forget one another in the arts of the Way"
 motto_fm_taoist_951:0 "The great clod burdens me with a body"
 motto_fm_taoist_952:0 "It wearies me with life, rests me with age"
 motto_fm_taoist_953:0 "And gives me rest in death"
 motto_fm_taoist_954:0 "What makes my life good also makes my death good"
 motto_fm_taoist_955:0 "They smiled at one another, of one mind and no words"
 motto_fm_taoist_956:0 "Forgetting each other in life, without end"
 motto_fm_taoist_957:0 "He who has the Way seeks nothing"
 motto_fm_taoist_958:0 "Know man's doings by what his knowing knows"
 motto_fm_taoist_959:0 "Nourish the unknown with the known"
 motto_fm_taoist_960:0 "Without beginning and without end"
 motto_fm_taoist_961:0 "The gate of heaven is the realm of nothing"
 motto_fm_taoist_962:0 "All things come forth from nothing"
 motto_fm_taoist_963:0 "Being cannot make itself from being"
 motto_fm_taoist_964:0 "It must come forth from nothing"
 motto_fm_taoist_965:0 "Body like dry wood, heart like dead ashes"
 motto_fm_taoist_966:0 "I have lost myself"
 motto_fm_taoist_967:0 "You have heard the pipes of men, not of the earth"
 motto_fm_taoist_968:0 "You have heard earth's pipes, but not heaven's"
 motto_fm_taoist_969:0 "Heaven's music makes myriad sounds, each its own"
 motto_fm_taoist_970:0 "Each takes its own, and who is the blower"
 motto_fm_taoist_971:0 "The Way is hidden by petty achievement"
 motto_fm_taoist_972:0 "Words are hidden by flowery speech"
 motto_fm_taoist_973:0 "That is one right-and-wrong, this is another"
 motto_fm_taoist_974:0 "Is there really that and this"
 motto_fm_taoist_975:0 "Or really no that and this at all"
 motto_fm_taoist_976:0 "Just born, just dying, just dying, just born"
 motto_fm_taoist_977:0 "Just acceptable, just not; just not, just acceptable"
 motto_fm_taoist_978:0 "Right follows right, wrong follows wrong"
 motto_fm_taoist_979:0 "Thus the sage does not follow, but lights all by heaven"
 motto_fm_taoist_980:0 "When that and this lose their pair, this is the hinge of the Way"
 motto_fm_taoist_981:0 "The hinge in the circle's center answers the endless"
 motto_fm_taoist_982:0 "Heaven and earth are one finger, all things one horse"
 motto_fm_taoist_983:0 "Nothing is larger than the tip of an autumn hair"
 motto_fm_taoist_984:0 "And Mount Tai is small"
 motto_fm_taoist_985:0 "None lives longer than a dead child, and Peng Zu died young"
 motto_fm_taoist_986:0 "The Way was never fenced with boundaries"
 motto_fm_taoist_987:0 "Words were never fixed with a constant"
 motto_fm_taoist_988:0 "Beyond the six directions, the sage keeps but does not debate"
 motto_fm_taoist_989:0 "Within the six directions, he debates but does not judge"
 motto_fm_taoist_990:0 "The Annals order the age, the records of past kings"
 motto_fm_taoist_991:0 "The sage judges but does not dispute"
 motto_fm_taoist_992:0 "Great knowledge is broad, small knowledge is fussy"
 motto_fm_taoist_993:0 "Great words blaze, small words chatter"
 motto_fm_taoist_994:0 "In sleep their souls tangle, awake their bodies stir"
 motto_fm_taoist_995:0 "Entangled with the world, daily their hearts contend"
 motto_fm_taoist_996:0 "A heart near death cannot be made to live again"
 motto_fm_taoist_997:0 "Joy, anger, grief, delight, care, sighs, change and heat"
 motto_fm_taoist_998:0 "Day and night alternate before us, none knows their source"
 motto_fm_taoist_999:0 "Without the other there is no self, without self nothing to grasp"
 motto_fm_taoist_1000:0 "The hundred bones, nine orifices, six organs all dwell in me"
 motto_fm_taoist_1001:0 "The well frog cannot speak of the sea, confined by its space"
 motto_fm_taoist_1002:0 "The summer insect cannot speak of ice, bound by its season"
 motto_fm_taoist_1003:0 "The narrow scholar cannot speak of the Way, fettered by his learning"
 motto_fm_taoist_1004:0 "Of things, their measure is endless, their time unceasing"
 motto_fm_taoist_1005:0 "Gain brings no joy, loss brings no sorrow"
 motto_fm_taoist_1006:0 "Knowing that one's lot is ever changing"
 motto_fm_taoist_1007:0 "Seeing the level road, one lives without delight"
 motto_fm_taoist_1008:0 "Dies without dread, knowing end and start cannot be fixed"
 motto_fm_taoist_1009:0 "What men know is less than what they do not know"
 motto_fm_taoist_1010:0 "The highest joy is no joy"
 motto_fm_taoist_1011:0 "I take non-action to be true joy"
 motto_fm_taoist_1012:0 "The highest joy keeps the body alive, only non-action can"
 motto_fm_taoist_1013:0 "Heaven and earth do nothing, yet nothing is left undone"
 motto_fm_taoist_1014:0 "Who among men can attain non-action"
 motto_fm_taoist_1015:0 "Keep the body whole and spirit restored, be one with heaven"
 motto_fm_taoist_1016:0 "Body and spirit unwasted, this is the power of change"
 motto_fm_taoist_1017:0 "Essence refined again and again returns to serve heaven"
 motto_fm_taoist_1018:0 "Forget the foot and the shoe fits"
 motto_fm_taoist_1019:0 "Forget the waist and the belt fits"
 motto_fm_taoist_1020:0 "Forget right and wrong and the heart is at ease"
 motto_fm_taoist_1021:0 "Never change within, never follow without"
 motto_fm_taoist_1022:0 "Perfect ease is the ease that forgets all ease"
 motto_fm_taoist_1023:0 "Pure without mixture, still and unchanging"
 motto_fm_taoist_1024:0 "Bland and non-acting, moved only by heaven's course"
 motto_fm_taoist_1025:0 "This is the Way of nourishing the spirit"
 motto_fm_taoist_1026:0 "Purity means being mixed with nothing"
 motto_fm_taoist_1027:0 "Wholeness means the spirit is not impaired"
 motto_fm_taoist_1028:0 "The nature of water, unmixed, is clear"
 motto_fm_taoist_1029:0 "Left unmoved, it becomes level"
 motto_fm_taoist_1030:0 "Blocked and still, it also cannot stay clear"
 motto_fm_taoist_1031:0 "This is the image of heaven's virtue"
 motto_fm_taoist_1032:0 "Not the first to seek fortune, not the source of disaster"
 motto_fm_taoist_1033:0 "Respond only when stirred, move only when pressed"
 motto_fm_taoist_1034:0 "Rise only when there is no choice"
 motto_fm_taoist_1035:0 "Cast off cunning and habit, follow heaven's principle"
 motto_fm_taoist_1036:0 "Then no disaster from heaven, no burden from things"
 motto_fm_taoist_1037:0 "No blame from men, no reproach from ghosts"
 motto_fm_taoist_1038:0 "No brooding thought, no scheming in advance"
 motto_fm_taoist_1039:0 "Bright without glare, faithful without promise"
 motto_fm_taoist_1040:0 "His life floats by, his death is rest"
 motto_fm_taoist_1041:0 "His spirit is pure, his soul never wearies"
 motto_fm_taoist_1042:0 "Emptiness and calm accord with heaven's virtue"
 motto_fm_taoist_1043:0 "Grief and joy are the diseases of virtue"
 motto_fm_taoist_1044:0 "Delight and anger are the excesses of the Way"
 motto_fm_taoist_1045:0 "Love and hate are the losses of virtue"
 motto_fm_taoist_1046:0 "A heart free of grief and joy is virtue's height"
 motto_fm_taoist_1047:0 "Constant and unchanging, this is stillness at its height"
 motto_fm_taoist_1048:0 "Meeting no opposition, this is emptiness at its height"
 motto_fm_taoist_1049:0 "Mingling not with things, this is blandness at its height"
 motto_fm_taoist_1050:0 "Encountering no resistance, this is purity at its height"
 motto_fm_taoist_1051:0 "Keep your nature and spirit, wander among the world"
 motto_fm_taoist_1052:0 "Befriend the One without end or beginning"
 motto_fm_taoist_1053:0 "His heaven kept whole, his spirit without gap"
 motto_fm_taoist_1054:0 "Do not hide among men, do not flaunt before them"
 motto_fm_taoist_1055:0 "Stand like dry wood at the center"
 motto_fm_taoist_1056:0 "The sage hides in heaven, so none can harm him"
 motto_fm_taoist_1057:0 "The avenger does not break the sword that wounded him"
 motto_fm_taoist_1058:0 "Even the resentful do not blame the falling tile"
 motto_fm_taoist_1059:0 "Thus the world is made level and even"
 motto_fm_taoist_1060:0 "No chaos of war, no punishment of slaughter"
 motto_fm_taoist_1061:0 "Opening to heaven births virtue, to man births harm"
 motto_fm_taoist_1062:0 "Never weary of heaven, never neglect men"
 motto_fm_taoist_1063:0 "Walk above all things and never tremble"
 motto_fm_taoist_1064:0 "This is the keeping of pure breath"
 motto_fm_taoist_1065:0 "Fix the will undivided and it condenses into spirit"
 motto_fm_taoist_1066:0 "Though heaven and earth fall, he is not lost with them"
 motto_fm_taoist_1067:0 "Know the change of things from end to start"
 motto_fm_taoist_1068:0 "Fate cannot be foreseen before it comes"
 motto_fm_taoist_1069:0 "One who changes with things is the unchanging one"
 motto_fm_taoist_1070:0 "The finger changes with things, the mind does not check"
 motto_fm_taoist_1071:0 "The spirit tower is held, yet none knows what holds it"
 motto_fm_taoist_1072:0 "The Way will not be mixed, mixed it becomes many"
 motto_fm_taoist_1073:0 "Many brings confusion, confusion brings care"
 motto_fm_taoist_1074:0 "And care brings no rescue"
 motto_fm_taoist_1075:0 "The sages of old first established themselves"
 motto_fm_taoist_1076:0 "And only then established others"
 motto_fm_taoist_1077:0 "If your own house is unsettled, how blame the violent"
 motto_fm_taoist_1078:0 "Virtue is wrecked by fame, knowledge springs from strife"
 motto_fm_taoist_1079:0 "Fame is men jostling one another"
 motto_fm_taoist_1080:0 "Knowledge is the tool of contention"
 motto_fm_taoist_1081:0 "Both are evil tools, not to be used to the end"
 motto_fm_taoist_1082:0 "Empty and awaiting, only in emptiness does the Way gather"
 motto_fm_taoist_1083:0 "Emptiness is the fasting of the heart"
 motto_fm_taoist_1084:0 "Hear not with the ear but with the heart"
 motto_fm_taoist_1085:0 "Hear not with the heart but with the breath"
 motto_fm_taoist_1086:0 "Breath is emptiness awaiting all things"
 motto_fm_taoist_1087:0 "It is easy to leave no tracks, hard to walk no ground"
 motto_fm_taoist_1088:0 "Serving men is easy to fake, serving heaven is hard to fake"
 motto_fm_taoist_1089:0 "I have heard of flying with wings, not of flying without"
 motto_fm_taoist_1090:0 "Heard of knowing by knowledge, not of knowing by not-knowing"
 motto_fm_taoist_1091:0 "Look at that emptiness, in the empty room light is born"
 motto_fm_taoist_1092:0 "Good fortune rests where it rests"
 motto_fm_taoist_1093:0 "Not resting, this is sitting yet galloping away"
 motto_fm_taoist_1094:0 "Let ears and eyes look inward, keep the mind outside"
 motto_fm_taoist_1095:0 "Spirits will come to dwell there, how much more men"
 motto_fm_taoist_1096:0 "This is the transformation of all things"
 motto_fm_taoist_1097:0 "The hinge on which Yu and Shun turned"
 motto_fm_taoist_1098:0 "What Fuxi and Jiqu practiced to the end"
 motto_fm_taoist_1099:0 "How much more the scattered common folk"
 motto_fm_taoist_1100:0 "Be the follower of heaven"
 motto_fm_taoist_1101:0 "The great Way is formless, it gives birth to heaven and earth"
 motto_fm_taoist_1102:0 "The great Way is emotionless, it drives the sun and moon"
 motto_fm_taoist_1103:0 "The great Way is nameless, it nurtures all things"
 motto_fm_taoist_1104:0 "I know not its name, I call it the Way"
 motto_fm_taoist_1105:0 "The clear is the source of the turbid"
 motto_fm_taoist_1106:0 "Motion is the foundation of stillness"
 motto_fm_taoist_1107:0 "The spirit loves clarity, but the heart disturbs it"
 motto_fm_taoist_1108:0 "The heart loves stillness, but desire drags it"
 motto_fm_taoist_1109:0 "If you can banish desire, the heart grows still"
 motto_fm_taoist_1110:0 "Settle the heart and the spirit clears itself"
 motto_fm_taoist_1111:0 "Then the six desires fade and the three poisons die"
 motto_fm_taoist_1112:0 "If you cannot, the heart is unsettled, desire unbanished"
 motto_fm_taoist_1113:0 "Who can banish it, look inward at the heart"
 motto_fm_taoist_1114:0 "The heart has no heart, look outward at the form"
 motto_fm_taoist_1115:0 "The form has no form, look far at all things"
 motto_fm_taoist_1116:0 "Things have no thing, when these three are realized"
 motto_fm_taoist_1117:0 "One sees only emptiness"
 motto_fm_taoist_1118:0 "Viewing emptiness as empty, emptiness empties too"
 motto_fm_taoist_1119:0 "What is emptied is nothing, nothing is nothing too"
 motto_fm_taoist_1120:0 "Serene and ever still, stillness without stillness"
 motto_fm_taoist_1121:0 "Desire cannot arise, and without it there is true calm"
 motto_fm_taoist_1122:0 "True constancy responds to things, true constancy keeps nature"
 motto_fm_taoist_1123:0 "Ever responding, ever still, this is constant clarity"
 motto_fm_taoist_1124:0 "Such clarity and calm step by step enter the true Way"
 motto_fm_taoist_1125:0 "Having entered the true Way, this is called attaining it"
 motto_fm_taoist_1126:0 "Though called attainment, truly nothing is gained"
 motto_fm_taoist_1127:0 "For teaching beings it is called attainment"
 motto_fm_taoist_1128:0 "Who realizes this may transmit the sacred Way"
 motto_fm_taoist_1129:0 "The best do not contend, the lowly love to contend"
 motto_fm_taoist_1130:0 "High virtue claims no virtue, low virtue clings to it"
 motto_fm_taoist_1131:0 "Who clings does not understand the Way and its virtue"
 motto_fm_taoist_1132:0 "Beings fail to gain the Way because of deluded hearts"
 motto_fm_taoist_1133:0 "With deluded hearts, they startle their spirits"
 motto_fm_taoist_1134:0 "Startled spirits cling to all things"
 motto_fm_taoist_1135:0 "Clinging to things, they breed greed and craving"
 motto_fm_taoist_1136:0 "Greed and craving are just vexation"
 motto_fm_taoist_1137:0 "Vexation and delusion weary body and mind"
 motto_fm_taoist_1138:0 "Then they meet disgrace, adrift in life and death"
 motto_fm_taoist_1139:0 "Ever sunk in the sea of sorrow, losing the true Way"
 motto_fm_taoist_1140:0 "The Way of true constancy, the awakened gain it themselves"
 motto_fm_taoist_1141:0 "Who awakens to the Way is ever clear and still"
 motto_fm_taoist_1142:0 "Heaven's killing urge moves the stars and mansions"
 motto_fm_taoist_1143:0 "Earth's killing urge rouses dragons and serpents"
 motto_fm_taoist_1144:0 "Man's killing urge turns heaven and earth over"
 motto_fm_taoist_1145:0 "Nature has skill and clumsiness, both can be hidden"
 motto_fm_taoist_1146:0 "The nine orifices' evils lie in three essentials"
 motto_fm_taoist_1147:0 "Through them one may be still or move"
 motto_fm_taoist_1148:0 "Fire is born of wood, its disaster burns the wood"
 motto_fm_taoist_1149:0 "Treason born of state, when it stirs the state falls"
 motto_fm_taoist_1150:0 "Who knows and cultivates this is called a sage"
 motto_fm_taoist_1151:0 "Heaven gives life, heaven takes it, this is the Way's rule"
 motto_fm_taoist_1152:0 "Heaven and earth rob all things"
 motto_fm_taoist_1153:0 "All things rob man"
 motto_fm_taoist_1154:0 "And man robs all things"
 motto_fm_taoist_1155:0 "When the three robberies are fit, the three powers rest"
 motto_fm_taoist_1156:0 "Eat in season and the hundred bones are ordered"
 motto_fm_taoist_1157:0 "Move with the moment and all changes settle"
 motto_fm_taoist_1158:0 "Sun and moon have their numbers, great and small their measure"
 motto_fm_taoist_1159:0 "Sacred merit is born, spirit-brightness appears"
 motto_fm_taoist_1160:0 "The robber's moment, the world cannot see it"
 motto_fm_taoist_1161:0 "The noble who gains it strengthens his body"
 motto_fm_taoist_1162:0 "The petty who gain it throw life away"
 motto_fm_taoist_1163:0 "The blind hear well, the deaf see well"
 motto_fm_taoist_1164:0 "Cut off profit at one source, gain tenfold strength"
 motto_fm_taoist_1165:0 "Return it thrice by day and night, gain ten-thousandfold"
 motto_fm_taoist_1166:0 "The heart is born of things and dies of things"
 motto_fm_taoist_1167:0 "The pivot lies in the eyes"
 motto_fm_taoist_1168:0 "Heaven shows no favor, yet great favor is born"
 motto_fm_taoist_1169:0 "Swift thunder and fierce wind, all things stir at them"
 motto_fm_taoist_1170:0 "Highest joy leaves nature to spare, highest calm makes nature honest"
 motto_fm_taoist_1171:0 "Heaven is most private, yet its working is most just"
 motto_fm_taoist_1172:0 "The mastering of creatures lies in the breath"
 motto_fm_taoist_1173:0 "Life is the root of death, death is the root of life"
 motto_fm_taoist_1174:0 "Favor is born of harm, harm is born of favor"
 motto_fm_taoist_1175:0 "Fools take heaven and earth's patterns for sacred"
 motto_fm_taoist_1176:0 "I take the season's things and patterns for wisdom"
 motto_fm_taoist_1177:0 "Men think folly sacred, I think not-folly sacred"
 motto_fm_taoist_1178:0 "Men expect wonder of the sage, I expect no wonder"
 motto_fm_taoist_1179:0 "Sinking into water, into fire, one courts destruction"
 motto_fm_taoist_1180:0 "The Way of nature is still, so heaven, earth and things live"
 motto_fm_taoist_1181:0 "Heaven and earth's Way is gradual, so yin and yang prevail"
 motto_fm_taoist_1182:0 "Yin and yang push each other, and change flows smooth"
 motto_fm_taoist_1183:0 "Thus the sage knows nature's Way cannot be defied"
 motto_fm_taoist_1184:0 "So he governs by it, the Way of utmost stillness"
 motto_fm_taoist_1185:0 "What calendars and pitch-pipes cannot grasp"
 motto_fm_taoist_1186:0 "There is a wondrous vessel that births the myriad forms"
 motto_fm_taoist_1187:0 "The eight trigrams and the sexagenary hide spirit and ghost"
 motto_fm_taoist_1188:0 "The art of yin and yang prevails, shining beyond images"
 motto_fm_taoist_1189:0 "Advance what is of the Way, retreat from what is not"
 motto_fm_taoist_1190:0 "Walk no crooked path, deceive none in the dark"
 motto_fm_taoist_1191:0 "Pile up virtue and merit, keep a kindly heart to things"
 motto_fm_taoist_1192:0 "Loyal, filial, fraternal, set yourself right to teach men"
 motto_fm_taoist_1193:0 "Pity the orphan, care for the widow, honor age, cherish youth"
 motto_fm_taoist_1194:0 "Not even insect or plant should be harmed"
 motto_fm_taoist_1195:0 "Grieve at others' misfortune, rejoice in their good"
 motto_fm_taoist_1196:0 "Aid men in their need, rescue men in their peril"
 motto_fm_taoist_1197:0 "Another's gain as if it were your own"
 motto_fm_taoist_1198:0 "Another's loss as if it were your own"
 motto_fm_taoist_1199:0 "Publish not others' faults, flaunt not your own gifts"
 motto_fm_taoist_1200:0 "Check evil, spread good, give much and take little"
 motto_fm_taoist_1201:0 "Blessings without measure, Celestial Venerable"
 motto_fm_taoist_1202:0 "May the breath of the Way endure forever"
 motto_fm_taoist_1203:0 "Deliver beings without number"
 motto_fm_taoist_1204:0 "Cultivate truth and awaken to the Way"
 motto_fm_taoist_1205:0 "Attain the Way and become an immortal"
 motto_fm_taoist_1206:0 "Shed the body and ascend as an immortal"
 motto_fm_taoist_1207:0 "Rise to heaven in broad daylight"
 motto_fm_taoist_1208:0 "Long life and ageless youth"
 motto_fm_taoist_1209:0 "Longevity equal to heaven"
 motto_fm_taoist_1210:0 "Pine and crane bring lengthened years"
 motto_fm_taoist_1211:0 "White-haired yet with a child's face"
 motto_fm_taoist_1212:0 "Turn age back to youth"
 motto_fm_taoist_1213:0 "Cast off the old body and renew the bones"
 motto_fm_taoist_1214:0 "Cleanse the marrow and renew the hair"
 motto_fm_taoist_1215:0 "Renew the sinews and change the bones"
 motto_fm_taoist_1216:0 "Renew the bones and wash the marrow"
 motto_fm_taoist_1217:0 "The ninefold refining is complete"
 motto_fm_taoist_1218:0 "Dragon and tiger meet in union"
 motto_fm_taoist_1219:0 "Lead and mercury mingle as one"
 motto_fm_taoist_1220:0 "Water and fire intermingle"
 motto_fm_taoist_1221:0 "Water and fire complete each other"
 motto_fm_taoist_1222:0 "Take the water to fill the fire"
 motto_fm_taoist_1223:0 "Draw out the lead and add the mercury"
 motto_fm_taoist_1224:0 "Advance the fire, withdraw the sign"
 motto_fm_taoist_1225:0 "Gather the herb and return it to the furnace"
 motto_fm_taoist_1226:0 "Warm and nurture the sacred embryo"
 motto_fm_taoist_1227:0 "In ten months the embryo comes to term"
 motto_fm_taoist_1228:0 "The spirit emerges, transforming all"
 motto_fm_taoist_1229:0 "The spirit roams the great void"
 motto_fm_taoist_1230:0 "Roam the northern sea at dawn, Cangwu by dusk"
 motto_fm_taoist_1231:0 "Ride the wind and travel"
 motto_fm_taoist_1232:0 "Ride the clouds, drive the flying dragons"
 motto_fm_taoist_1233:0 "Ride the whale and tread the sea"
 motto_fm_taoist_1234:0 "Bestride a crane and fly on high"
 motto_fm_taoist_1235:0 "Mount a crane and journey west"
 motto_fm_taoist_1236:0 "The green ox departs to the west"
 motto_fm_taoist_1237:0 "Purple vapor comes from the east"
 motto_fm_taoist_1238:0 "One breath becomes the Three Pure Ones"
 motto_fm_taoist_1239:0 "The Three Pure Ones above"
 motto_fm_taoist_1240:0 "Ranked among the host of immortals"
 motto_fm_taoist_1241:0 "Entered in the rolls of the immortals"
 motto_fm_taoist_1242:0 "Grotto-heavens and blessed lands"
 motto_fm_taoist_1243:0 "The ten continents and three isles"
 motto_fm_taoist_1244:0 "The immortal isle of Penglai"
 motto_fm_taoist_1245:0 "The immortal mountain of Fangzhang"
 motto_fm_taoist_1246:0 "The immortal realm of Yingzhou"
 motto_fm_taoist_1247:0 "Kunlun's jade pool"
 motto_fm_taoist_1248:0 "The Golden Mother of the jade pool"
 motto_fm_taoist_1249:0 "The flat peach offered for longevity"
 motto_fm_taoist_1250:0 "Magu offers long life"
 motto_fm_taoist_1251:0 "The Queen Mother bestows the peach"
 motto_fm_taoist_1252:0 "Immortal mountains and jeweled towers"
 motto_fm_taoist_1253:0 "Jade halls and jeweled towers"
 motto_fm_taoist_1254:0 "Jeweled towers and jade halls"
 motto_fm_taoist_1255:0 "Mirages over the sea"
 motto_fm_taoist_1256:0 "The air of an immortal, the bones of the Way"
 motto_fm_taoist_1257:0 "Bones of the Way, air of an immortal"
 motto_fm_taoist_1258:0 "The immortal's air floats lightly"
 motto_fm_taoist_1259:0 "Floating as if to become an immortal"
 motto_fm_taoist_1260:0 "The divine being of Guye"
 motto_fm_taoist_1261:0 "Skin like ice and snow"
 motto_fm_taoist_1262:0 "Graceful as a maiden"
 motto_fm_taoist_1263:0 "She eats no grain"
 motto_fm_taoist_1264:0 "She drinks the wind and sips the dew"
 motto_fm_taoist_1265:0 "Riding clouds and dragons, she roams beyond the four seas"
 motto_fm_taoist_1266:0 "The perfect man has no dreams"
 motto_fm_taoist_1267:0 "The true man has no delusion"
 motto_fm_taoist_1268:0 "The immortal never ages"
 motto_fm_taoist_1269:0 "The spirit tower is clear and bright"
 motto_fm_taoist_1270:0 "A heart as clear as ice"
 motto_fm_taoist_1271:0 "Spirit at ease, breath settled"
 motto_fm_taoist_1272:0 "Breath settled, spirit at ease"
 motto_fm_taoist_1273:0 "Empty, still, calm and bland"
 motto_fm_taoist_1274:0 "Quiet and solitary, acting not"
 motto_fm_taoist_1275:0 "Embrace the spirit in stillness"
 motto_fm_taoist_1276:0 "The body will right itself"
 motto_fm_taoist_1277:0 "Be ever still, be ever clear"
 motto_fm_taoist_1278:0 "Do not tax your form, do not shake your essence"
 motto_fm_taoist_1279:0 "Only then can you long endure"
 motto_fm_taoist_1280:0 "See nothing, hear nothing, the heart knows nothing"
 motto_fm_taoist_1281:0 "Your spirit will guard your form and your form long endure"
 motto_fm_taoist_1282:0 "Guard what is within, close what is without"
 motto_fm_taoist_1283:0 "Too much knowing brings ruin"
 motto_fm_taoist_1284:0 "The great Way is utterly simple"
 motto_fm_taoist_1285:0 "The highest Way holds no difficulty"
 motto_fm_taoist_1286:0 "The Way is never far from man"
 motto_fm_taoist_1287:0 "It is man who enlarges the Way"
 motto_fm_taoist_1288:0 "The Way is even in dung and urine"
 motto_fm_taoist_1289:0 "Carrying water and chopping wood are the wondrous Way"
 motto_fm_taoist_1290:0 "Walking, standing, sitting, lying are all the Way"
 motto_fm_taoist_1291:0 "Every grass and tree is the Way"
 motto_fm_taoist_1292:0 "The Way makes all things one"
 motto_fm_taoist_1293:0 "All under heaven is but one breath"
 motto_fm_taoist_1294:0 "Things and self both forgotten"
 motto_fm_taoist_1295:0 "Heart and things made one"
 motto_fm_taoist_1296:0 "Within and without as one"
 motto_fm_taoist_1297:0 "Motion and stillness as one"
 motto_fm_taoist_1298:0 "Heaven and man share one frame"
 motto_fm_taoist_1299:0 "Man patterns himself on earth"
 motto_fm_taoist_1300:0 "Earth patterns itself on heaven"
 motto_fm_taoist_1301:0 "Heaven patterns itself on the Way"
 motto_fm_taoist_1302:0 "It stands alone and never changes"
 motto_fm_taoist_1303:0 "It cycles forever and never fails"
 motto_fm_taoist_1304:0 "It can be the mother of the world"
 motto_fm_taoist_1305:0 "Great means departing, departing means far"
 motto_fm_taoist_1306:0 "Far means returning"
 motto_fm_taoist_1307:0 "Within the realm there are four great ones"
 motto_fm_taoist_1308:0 "And the king holds one of them"
 motto_fm_taoist_1309:0 "The mountains are high, the rivers long"
 motto_fm_taoist_1310:0 "The source is far, the stream runs long"
 motto_fm_taoist_1311:0 "Know the male, keep to the female"
 motto_fm_taoist_1312:0 "Be the ravine of the world"
 motto_fm_taoist_1313:0 "The ravine of the world, constant virtue never leaves"
 motto_fm_taoist_1314:0 "Return again to the newborn child"
 motto_fm_taoist_1315:0 "Know the white, keep to the black"
 motto_fm_taoist_1316:0 "Be the model of the world"
 motto_fm_taoist_1317:0 "The model of the world, constant virtue never errs"
 motto_fm_taoist_1318:0 "Return again to the boundless"
 motto_fm_taoist_1319:0 "Know honor, keep to disgrace"
 motto_fm_taoist_1320:0 "Be the valley of the world"
 motto_fm_taoist_1321:0 "The valley of the world, constant virtue is complete"
 motto_fm_taoist_1322:0 "Return again to the unworked block"
 motto_fm_taoist_1323:0 "The block carved becomes vessels"
 motto_fm_taoist_1324:0 "The sage uses it to become chief of officials"
 motto_fm_taoist_1325:0 "Thus the great cutting does not cut"
 motto_fm_taoist_1326:0 "To take the world and act upon it"
 motto_fm_taoist_1327:0 "I see that it cannot be done"
 motto_fm_taoist_1328:0 "The world is a sacred vessel, not to be acted on"
 motto_fm_taoist_1329:0 "Who acts on it spoils it, who grasps it loses it"
 motto_fm_taoist_1330:0 "Some lead, some follow, some breathe warm, some cold"
 motto_fm_taoist_1331:0 "Some are strong, some weak, some rise, some fall"
 motto_fm_taoist_1332:0 "Thus the sage puts away excess, extravagance and pride"
 motto_fm_taoist_1333:0 "A counselor of the Way does not force the world by arms"
 motto_fm_taoist_1334:0 "Such deeds have a way of returning"
 motto_fm_taoist_1335:0 "Where armies camp, thorns and brambles grow"
 motto_fm_taoist_1336:0 "After a great war there follows a year of famine"
 motto_fm_taoist_1337:0 "The good achieve their end and stop"
 motto_fm_taoist_1338:0 "They do not presume to seize by force"
 motto_fm_taoist_1339:0 "Achieve, but boast not; achieve, but flaunt not"
 motto_fm_taoist_1340:0 "Achieve, but be not proud; achieve, but only when forced"
 motto_fm_taoist_1341:0 "Achieve, but do not use force"
 motto_fm_taoist_1342:0 "What is over-strong soon grows old"
 motto_fm_taoist_1343:0 "The violent and headstrong do not die a natural death"
 motto_fm_taoist_1344:0 "This I take as the father of my teaching"
 motto_fm_taoist_1345:0 "When the world has the Way, war-horses dung the fields"
 motto_fm_taoist_1346:0 "Without the Way, war-horses are bred on the borders"
 motto_fm_taoist_1347:0 "No guilt is greater than yielding to desire"
 motto_fm_taoist_1348:0 "No disaster is greater than not knowing enough"
 motto_fm_taoist_1349:0 "No fault is greater than craving to possess"
 motto_fm_taoist_1350:0 "So the sufficiency of knowing enough is always enough"
 motto_fm_taoist_1351:0 "The sage knows without traveling"
 motto_fm_taoist_1352:0 "He sees clearly without looking"
 motto_fm_taoist_1353:0 "He achieves without acting"
 motto_fm_taoist_1354:0 "Act but do not contend"
 motto_fm_taoist_1355:0 "Winning the world is ever done through non-interference"
 motto_fm_taoist_1356:0 "Once one interferes, one cannot win the world"
 motto_fm_taoist_1357:0 "The sage has no fixed heart, the people's heart is his"
 motto_fm_taoist_1358:0 "The good I treat well, the not-good I also treat well"
 motto_fm_taoist_1359:0 "The faithful I trust, the unfaithful I also trust"
 motto_fm_taoist_1360:0 "The sage in the world draws all together"
 motto_fm_taoist_1361:0 "For the world he makes his heart muddled"
 motto_fm_taoist_1362:0 "The people all fix their eyes and ears on him"
 motto_fm_taoist_1363:0 "And the sage treats them all as children"
 motto_fm_taoist_1364:0 "Come forth to life, enter into death"
 motto_fm_taoist_1365:0 "The companions of life are three in ten"
 motto_fm_taoist_1366:0 "The companions of death are three in ten"
 motto_fm_taoist_1367:0 "Those who hasten to death by living are three in ten"
 motto_fm_taoist_1368:0 "Why, because they live life too richly"
 motto_fm_taoist_1369:0 "I have heard that one who is good at guarding life"
 motto_fm_taoist_1370:0 "Travels the land and meets no rhino or tiger"
 motto_fm_taoist_1371:0 "Enters battle and is not touched by blade"
 motto_fm_taoist_1372:0 "The rhino finds no place to thrust its horn"
 motto_fm_taoist_1373:0 "The tiger finds no place to set its claws"
 motto_fm_taoist_1374:0 "The soldier finds no place for his blade"
 motto_fm_taoist_1375:0 "Why, because he has no place of death"
 motto_fm_taoist_1376:0 "It grows them, rears them, settles them, ripens them"
 motto_fm_taoist_1377:0 "It feeds them and shelters them"
 motto_fm_taoist_1378:0 "Honor the Way and value virtue"
 motto_fm_taoist_1379:0 "Ever desireless, behold its mystery"
 motto_fm_taoist_1380:0 "The mystic virtue is deep and far"
 motto_fm_taoist_1381:0 "It returns with things to the great accord"
 motto_fm_taoist_1382:0 "Empty to the utmost, still to the depth"
 motto_fm_taoist_1383:0 "Returning to the root is stillness"
 motto_fm_taoist_1384:0 "Deep stillness nourishes the spirit"
 motto_fm_taoist_1385:0 "This is called practicing the constant"
 motto_fm_taoist_1386:0 "Follow only the Way"
 motto_fm_taoist_1387:0 "Robbers' boasting is not the Way"
 motto_fm_taoist_1388:0 "Embrace the One and be the world's model"
 motto_fm_taoist_1389:0 "Not showing oneself, one is bright"
 motto_fm_taoist_1390:0 "A winding path leads to the secluded"
 motto_fm_taoist_1391:0 "Empty mountains after fresh rain"
 motto_fm_taoist_1392:0 "Pine wind loosens the belt"
 motto_fm_taoist_1393:0 "Mountain moon lights the zither"
 motto_fm_taoist_1394:0 "How do I know the world is so"
 motto_fm_taoist_1395:0 "Hold fast the Way of old"
 motto_fm_taoist_1396:0 "This is the height of vital essence"
 motto_fm_taoist_1397:0 "Stillness means returning to one's destiny"
 motto_fm_taoist_1398:0 "Follow things as they naturally are"
 motto_fm_taoist_1399:0 "Benefit but do not harm"
 motto_fm_taoist_1400:0 "Wash away the mysterious mirror"
 motto_fm_taoist_1401:0 "High mountains and flowing water"
 motto_fm_taoist_1402:0 "Bright mountains and clear waters"
 motto_fm_taoist_1403:0 "Birdsong and flower fragrance"
 motto_fm_taoist_1404:0 "Lake light and mountain hues"
 motto_fm_taoist_1405:0 "Vast and misty waters"
 motto_fm_taoist_1406:0 "Range upon range of peaks"
 motto_fm_taoist_1407:0 "Wine cups afloat on a winding stream"
 motto_fm_taoist_1408:0 "Dense groves and tall bamboos"
 motto_fm_taoist_1409:0 "The sough of pines, the rhythm of bamboos"
 motto_fm_taoist_1410:0 "Plum as wife, crane as child"
 motto_fm_taoist_1411:0 "Boundless seas of cloud"
 motto_fm_taoist_1412:0 "The stream gurgles softly"
 motto_fm_taoist_1413:0 "The spring water tinkles"
 motto_fm_taoist_1414:0 "Peaks gather like mountains"
 motto_fm_taoist_1415:0 "Azure waves ripple and sway"
 motto_fm_taoist_1416:0 "Green hills dark as painted brows"
 motto_fm_taoist_1417:0 "Green waters flow on forever"
 motto_fm_taoist_1418:0 "Flowers bloom and flowers fall"
 motto_fm_taoist_1419:0 "Clouds roll out and clouds unfurl"
 motto_fm_taoist_1420:0 "The tide rises and the tide falls"
 motto_fm_taoist_1421:0 "Stars shift and the Dipper turns"
 motto_fm_taoist_1422:0 "The sun rises, the moon sets"
 motto_fm_taoist_1423:0 "Spring flowers, autumn fruit"
 motto_fm_taoist_1424:0 "Summer rain and winter snow"
 motto_fm_taoist_1425:0 "Wind, frost, rain and snow"
 motto_fm_taoist_1426:0 "Return to field and garden"
 motto_fm_taoist_1427:0 "Toil with one's own hands in the fields"
 motto_fm_taoist_1428:0 "Shouldering the hoe, wearing the moonlight"
 motto_fm_taoist_1429:0 "Fisher, woodcutter, farmer, scholar"
 motto_fm_taoist_1430:0 "Dwell at ease and nourish the will"
 motto_fm_taoist_1431:0 "Dwell in seclusion among the hills"
 motto_fm_taoist_1432:0 "Deep mountains and hidden valleys"
 motto_fm_taoist_1433:0 "Drift a boat on the five lakes"
 motto_fm_taoist_1434:0 "Let the body wander free"
 motto_fm_taoist_1435:0 "The great hermit hides in the market"
 motto_fm_taoist_1436:0 "The lesser hermit hides in the wild"
 motto_fm_taoist_1437:0 "Nourish life in step with the seasons"
 motto_fm_taoist_1438:0 "Nourish body and spirit together"
 motto_fm_taoist_1439:0 "Blend movement and stillness"
 motto_fm_taoist_1440:0 "A broad heart makes the body ease"
 motto_fm_taoist_1441:0 "Keep a smile ever on your lips"
 motto_fm_taoist_1442:0 "Free of illness and disaster"
 motto_fm_taoist_1443:0 "Peace is the greatest blessing"
 motto_fm_taoist_1444:0 "Keep to quiet contentment"
 motto_fm_taoist_1445:0 "A calm heart stays cool of itself"
 motto_fm_taoist_1446:0 "Contentment makes heaven and earth wide"
 motto_fm_taoist_1447:0 "A broad heart makes the world broad"
 motto_fm_taoist_1448:0 "Detachment makes the will clear"
 motto_fm_taoist_1449:0 "In quiet contemplation one gains all"
 motto_fm_taoist_1450:0 "Follow heaven and answer the season"
 motto_fm_taoist_1451:0 "Meet fate as it comes, be at ease"
 motto_fm_taoist_1452:0 "Rejoice and follow the flow"
 motto_fm_taoist_1453:0 "Keep to clarity and stillness"
 motto_fm_taoist_1454:0 "Hold to the simple and return to the true"
 motto_fm_taoist_1455:0 "Return to the root and the source"
 motto_fm_taoist_1456:0 "Return to the root and one's destiny"
 motto_fm_taoist_1457:0 "Utmost stillness brings forth clarity"
 motto_fm_taoist_1458:0 "Stillness gives birth to insight"
 motto_fm_taoist_1459:0 "A clear heart reflects the moon"
 motto_fm_taoist_1460:0 "A settled mind clears the sky of clouds"
 motto_fm_taoist_1461:0 "Clarify the heart and see the nature"
 motto_fm_taoist_1462:0 "Look inward and reflect within"
 motto_fm_taoist_1463:0 "Turn the light back inward"
 motto_fm_taoist_1464:0 "Withdraw sight and hearing inward"
 motto_fm_taoist_1465:0 "Settle the spirit and fix the thoughts"
 motto_fm_taoist_1466:0 "Calm the spirit and steady the will"
 motto_fm_taoist_1467:0 "Concentrate the spirit, quiet the breath"
 motto_fm_taoist_1468:0 "Level the heart, calm the breath"
 motto_fm_taoist_1469:0 "Spirit focused, breath gathered"
 motto_fm_taoist_1470:0 "Sink the breath to the cinnabar field"
 motto_fm_taoist_1471:0 "Fix the mind on the cinnabar field"
 motto_fm_taoist_1472:0 "The microcosmic orbit turns"
 motto_fm_taoist_1473:0 "The governing and conception vessels connect"
 motto_fm_taoist_1474:0 "Open the channels and quicken the collaterals"
 motto_fm_taoist_1475:0 "Blood and breath in harmony"
 motto_fm_taoist_1476:0 "Yin at peace, yang well sealed"
 motto_fm_taoist_1477:0 "The five phases in harmony"
 motto_fm_taoist_1478:0 "Essence, breath and spirit in full"
 motto_fm_taoist_1479:0 "Spirit whole, breath abundant"
 motto_fm_taoist_1480:0 "Vigorous in spirit"
 motto_fm_taoist_1481:0 "Youthful face, white crane hair"
 motto_fm_taoist_1482:0 "A healthy rosy glow on the face"
 motto_fm_taoist_1483:0 "Light and nimble of step"
 motto_fm_taoist_1484:0 "Sharp of ear and clear of eye"
 motto_fm_taoist_1485:0 "Strong teeth and dark hair"
 motto_fm_taoist_1486:0 "A hundred ills cannot invade"
 motto_fm_taoist_1487:0 "Evil cannot touch him"
 motto_fm_taoist_1488:0 "Righteous breath stored within"
 motto_fm_taoist_1489:0 "Wickedness cannot intrude"
 motto_fm_taoist_1490:0 "Primal energy abounding"
 motto_fm_taoist_1491:0 "The cinnabar field full of breath"
 motto_fm_taoist_1492:0 "The channels flow unobstructed"
 motto_fm_taoist_1493:0 "Blood and vessels flow smooth"
 motto_fm_taoist_1494:0 "The organs in gentle accord"
 motto_fm_taoist_1495:0 "Stomach and spleen strong and active"
 motto_fm_taoist_1496:0 "Heart and kidneys in communion"
 motto_fm_taoist_1497:0 "Fire and water aid each other"
 motto_fm_taoist_1498:0 "The dragon hums, the tiger roars"
 motto_fm_taoist_1499:0 "The phoenix dances, the luan soars"
 motto_fm_taoist_1500:0 "Immortal cranes rise in dance"
 motto_fm_taoist_1501:0 "Lost deep among the clouds"
 motto_fm_taoist_1502:0 "He is only within these mountains"
 motto_fm_taoist_1503:0 "Under the pine I ask the young lad"
 motto_fm_taoist_1504:0 "He says the master left to gather herbs"
 motto_fm_taoist_1505:0 "After fresh rain in the empty hills"
 motto_fm_taoist_1506:0 "The evening air turns toward autumn"
 motto_fm_taoist_1507:0 "Bamboos stir as the washerwomen return"
 motto_fm_taoist_1508:0 "Lotus stirs as the fishing boat glides down"
 motto_fm_taoist_1509:0 "Let the spring's fragrance fade as it will"
 motto_fm_taoist_1510:0 "The noble may well linger here"
 motto_fm_taoist_1511:0 "An old wood with no path of men"
 motto_fm_taoist_1512:0 "The sunlight is cold on the green pines"
 motto_fm_taoist_1513:0 "From the deep hills, somewhere a bell"
 motto_fm_taoist_1514:0 "Calm meditation tames the poison dragon"
 motto_fm_taoist_1515:0 "At dusk I come down from the blue-green mountain"
 motto_fm_taoist_1516:0 "Looking back, white clouds close in"
 motto_fm_taoist_1517:0 "Blue haze seen up close is nothing"
 motto_fm_taoist_1518:0 "The regions shift around the central peak"
 motto_fm_taoist_1519:0 "Shade and sun differ in every valley"
 motto_fm_taoist_1520:0 "I would seek lodging among men"
 motto_fm_taoist_1521:0 "Across the stream I ask the woodcutter"
 motto_fm_taoist_1522:0 "Its sound clamors among the rocks"
 motto_fm_taoist_1523:0 "Its color is still amid the deep pines"
 motto_fm_taoist_1524:0 "Rippling, it drifts the water chestnuts"
 motto_fm_taoist_1525:0 "Clear, it mirrors the reeds"
 motto_fm_taoist_1526:0 "My heart has long been at ease"
 motto_fm_taoist_1527:0 "The clear stream is calm as this"
 motto_fm_taoist_1528:0 "Please rest upon this flat rock"
 motto_fm_taoist_1529:0 "The fishing will never be done"
 motto_fm_taoist_1530:0 "The rising moon startles the mountain birds"
 motto_fm_taoist_1531:0 "They sing now and then in the spring ravine"
 motto_fm_taoist_1532:0 "The Jing stream shows its white stones"
 motto_fm_taoist_1533:0 "Cold weather thins the red leaves"
 motto_fm_taoist_1534:0 "The mountain path had no rain at all"
 motto_fm_taoist_1535:0 "The green air soaks my clothes"
 motto_fm_taoist_1536:0 "The lotus flower at the branch's tip"
 motto_fm_taoist_1537:0 "The stream's door is silent, no one there"
 motto_fm_taoist_1538:0 "They bloom in profusion and fall"
 motto_fm_taoist_1539:0 "The wilds are wide, the sky bends to the trees"
 motto_fm_taoist_1540:0 "The river is clear, the moon comes near"
 motto_fm_taoist_1541:0 "Move the boat to moor by the misty islet"
 motto_fm_taoist_1542:0 "At dusk the traveler's sorrow is fresh"
 motto_fm_taoist_1543:0 "Green trees ring the village"
 motto_fm_taoist_1544:0 "Green hills slant beyond the walls"
 motto_fm_taoist_1545:0 "Open the window to the threshing ground"
 motto_fm_taoist_1546:0 "Over wine we talk of mulberry and hemp"
 motto_fm_taoist_1547:0 "Wait until the double-ninth day"
 motto_fm_taoist_1548:0 "Then come back for the chrysanthemums"
 motto_fm_taoist_1549:0 "In spring one sleeps past the dawn"
 motto_fm_taoist_1550:0 "Everywhere the birds sing"
 motto_fm_taoist_1551:0 "Last night came the sound of wind and rain"
 motto_fm_taoist_1552:0 "Who knows how many blossoms fell"
 motto_fm_taoist_1553:0 "The lotus wind wafts its fragrance"
 motto_fm_taoist_1554:0 "Dew on the bamboo drips with a clear sound"
 motto_fm_taoist_1555:0 "I would take the lute and play"
 motto_fm_taoist_1556:0 "But regret no friend who knows the tune"
 motto_fm_taoist_1557:0 "Moved by this, I think of my old friend"
 motto_fm_taoist_1558:0 "At midnight my dreams are troubled"
 motto_fm_taoist_1559:0 "The mountain temple bell tolls as dusk falls"
 motto_fm_taoist_1560:0 "At the Yuliang ferry all rush to cross noisily"
 motto_fm_taoist_1561:0 "Men follow the sandbank toward the river village"
 motto_fm_taoist_1562:0 "I too take a boat back to Lumen"
 motto_fm_taoist_1563:0 "At Lumen the moon lights the misty trees"
 motto_fm_taoist_1564:0 "Suddenly I reach Pang's old hermitage"
 motto_fm_taoist_1565:0 "Stone door and pine path, long and lonely"
 motto_fm_taoist_1566:0 "Only the recluse comes and goes alone"
 motto_fm_taoist_1567:0 "Spring waters fill the four marshes"
 motto_fm_taoist_1568:0 "Summer clouds pile into strange peaks"
 motto_fm_taoist_1569:0 "The autumn moon pours its bright glow"
 motto_fm_taoist_1570:0 "The winter ridge shows its hardy pines"
 motto_fm_taoist_1571:0 "At sunset all things come to rest"
 motto_fm_taoist_1572:0 "Returning birds fly chirping to the woods"
 motto_fm_taoist_1573:0 "I whistle proudly beneath the east window"
 motto_fm_taoist_1574:0 "And once more live this life of mine"
 motto_fm_taoist_1575:0 "You ask how I can be so"
 motto_fm_taoist_1576:0 "Planting beans beneath the southern hill"
 motto_fm_taoist_1577:0 "Grass grows thick, the bean sprouts thin"
 motto_fm_taoist_1578:0 "I rise at dawn to clear the weeds"
 motto_fm_taoist_1579:0 "And shoulder the hoe home in moonlight"
 motto_fm_taoist_1580:0 "The path is narrow, the grass grows tall"
 motto_fm_taoist_1581:0 "Evening dew soaks my clothes"
 motto_fm_taoist_1582:0 "Soaked clothes are nothing to regret"
 motto_fm_taoist_1583:0 "So long as my wish is not betrayed"
 motto_fm_taoist_1584:0 "I fell by mistake into the dusty net"
 motto_fm_taoist_1585:0 "And was gone from home for thirty years"
 motto_fm_taoist_1586:0 "I cleared the wilds at the southern edge"
 motto_fm_taoist_1587:0 "Holding to my clumsiness, I returned to the fields"
 motto_fm_taoist_1588:0 "A homestead of a dozen acres or so"
 motto_fm_taoist_1589:0 "A thatched cottage of eight or nine rooms"
 motto_fm_taoist_1590:0 "Elms and willows shade the back eaves"
 motto_fm_taoist_1591:0 "Peach and plum line the hall's front"
 motto_fm_taoist_1592:0 "Dimly, dimly, the distant village"
 motto_fm_taoist_1593:0 "Softly, softly, the hamlet's smoke"
 motto_fm_taoist_1594:0 "A dog barks deep in the lane"
 motto_fm_taoist_1595:0 "A cock crows atop the mulberry"
 motto_fm_taoist_1596:0 "My courtyard is free of worldly dust"
 motto_fm_taoist_1597:0 "The empty room has leisure to spare"
 motto_fm_taoist_1598:0 "Clouds drift out of the peaks with no intent"
 motto_fm_taoist_1599:0 "Birds weary of flight and know to return"
 motto_fm_taoist_1600:0 "Trees grow gladly toward their bloom"
 motto_fm_taoist_1601:0 "The spring begins to trickle forth"
 motto_fm_taoist_1602:0 "Rejoicing that all things meet their season"
 motto_fm_taoist_1603:0 "Feeling that my own life nears its rest"
 motto_fm_taoist_1604:0 "Enough, how long can I dwell in this frame"
 motto_fm_taoist_1605:0 "Why not set the heart free and let come and go"
 motto_fm_taoist_1606:0 "Why this restless haste, and where to go"
 motto_fm_taoist_1607:0 "Wealth and rank are not my wish"
 motto_fm_taoist_1608:0 "The immortal's realm cannot be counted on"
 motto_fm_taoist_1609:0 "Cherish the fair morning and go alone"
 motto_fm_taoist_1610:0 "Or set my staff aside and weed and sow"
 motto_fm_taoist_1611:0 "Climb the eastern ridge and whistle free"
 motto_fm_taoist_1612:0 "By the clear stream compose my verse"
 motto_fm_taoist_1613:0 "So ride the change and return to the end"
 motto_fm_taoist_1614:0 "Glad in heaven's decree, what doubt remains"
 motto_fm_taoist_1615:0 "Spring is mild and the scene is bright"
 motto_fm_taoist_1616:0 "Autumn is high, the air is crisp"
 motto_fm_taoist_1617:0 "Clouds are pale, the breeze is light"
 motto_fm_taoist_1618:0 "The wind is clear, the moon is bright"
 motto_fm_taoist_1619:0 "Water and sky are one color"
 motto_fm_taoist_1620:0 "Fallen petals drift in profusion"
 motto_fm_taoist_1621:0 "Willows darken, flowers brighten"
 motto_fm_taoist_1622:0 "Hills upon hills, streams upon streams"
 motto_fm_taoist_1623:0 "Suddenly all is bright and open"
 motto_fm_taoist_1624:0 "A peach-blossom spring beyond the world"
 motto_fm_taoist_1625:0 "Content and happy with oneself"
 motto_fm_taoist_1626:0 "The paths and field-ways cross and join"
 motto_fm_taoist_1627:0 "Cocks and dogs are heard from house to house"
 motto_fm_taoist_1628:0 "The old with white hair, the young with tufts"
 motto_fm_taoist_1629:0 "All content and taking their ease"
 motto_fm_taoist_1630:0 "Not worth telling to those outside"
 motto_fm_taoist_1631:0 "Fond of reading, not seeking deep gloss"
 motto_fm_taoist_1632:0 "At each insight I gladly forget my meals"
 motto_fm_taoist_1633:0 "Bare walls, unsheltered from wind and sun"
 motto_fm_taoist_1634:0 "Coarse clothes patched, bowl and gourd often empty"
 motto_fm_taoist_1635:0 "Yet at peace with it all"
 motto_fm_taoist_1636:0 "Not grieving over poverty and lowliness"
 motto_fm_taoist_1637:0 "Not striving after wealth and rank"
 motto_fm_taoist_1638:0 "Raise the cup, write verse, and gladden the will"
 motto_fm_taoist_1639:0 "Was he a subject of the age of Wu Huai"
 motto_fm_taoist_1640:0 "Or a subject of the age of Ge Tian"
 motto_fm_taoist_1641:0 "Truly my straying has not gone far"
 motto_fm_taoist_1642:0 "I see today is right and yesterday was wrong"
 motto_fm_taoist_1643:0 "The boat drifts lightly on its way"
 motto_fm_taoist_1644:0 "The wind blows my robes aflutter"
 motto_fm_taoist_1645:0 "I ask a traveler of the road ahead"
 motto_fm_taoist_1646:0 "Regretting the faintness of the dawn"
 motto_fm_taoist_1647:0 "I glimpse my home and run with joy"
 motto_fm_taoist_1648:0 "Servants greet me, children wait at the gate"
 motto_fm_taoist_1649:0 "The three paths are overgrown, pines and mums remain"
 motto_fm_taoist_1650:0 "Leading the children in, the wine cups are full"
 motto_fm_taoist_1651:0 "I raise the gourd and pour for myself"
 motto_fm_taoist_1652:0 "I gaze at the courtyard trees and brighten"
 motto_fm_taoist_1653:0 "I lean on the south window and nurse my pride"
 motto_fm_taoist_1654:0 "Content that a knee's room brings ease"
 motto_fm_taoist_1655:0 "Each day I wander the garden and find delight"
 motto_fm_taoist_1656:0 "The gate is there but ever closed"
 motto_fm_taoist_1657:0 "Staff in hand, I rest and roam at will"
 motto_fm_taoist_1658:0 "Now and then I raise my head to gaze afar"
 motto_fm_taoist_1659:0 "The light dims as the sun sinks down"
 motto_fm_taoist_1660:0 "I linger, stroking the lonely pine"
 motto_fm_taoist_1661:0 "Come back, the fields and garden are growing wild"
 motto_fm_taoist_1662:0 "Why not return"
 motto_fm_taoist_1663:0 "Since I have made my heart a slave to the body"
 motto_fm_taoist_1664:0 "Why grieve in loneliness and sorrow"
 motto_fm_taoist_1665:0 "Know the past cannot be changed"
 motto_fm_taoist_1666:0 "And the future may yet be pursued"
 motto_fm_taoist_1667:0 "Clouds leave the peak and forget to return"
 motto_fm_taoist_1668:0 "A gentle breeze comes, the water is unstirred"
 motto_fm_taoist_1669:0 "Raising wine to the guests, I chant the moon poem"
 motto_fm_taoist_1670:0 "The moon rises over the eastern hills"
 motto_fm_taoist_1671:0 "Lingering between the Dipper and the Ox"
 motto_fm_taoist_1672:0 "White dew spans the river, water light meets the sky"
 motto_fm_taoist_1673:0 "Let the reed-like boat drift where it will"
 motto_fm_taoist_1674:0 "Over the vast, boundless expanse"
 motto_fm_taoist_1675:0 "Boundless, as if riding the wind through the void"
 motto_fm_taoist_1676:0 "Floating, as if forsaking the world and standing alone"
 motto_fm_taoist_1677:0 "Growing wings and ascending to be an immortal"
 motto_fm_taoist_1678:0 "Like a mayfly lodged between heaven and earth"
