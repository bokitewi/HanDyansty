 motto_fm_taoist_561:0 "Far up the cold mountain, the stone path slopes; where white clouds rise, there are homes."
 motto_fm_taoist_562:0 "Silver candles cast a cold glow on the painted screen; with a light gauze fan, one chases the fireflies in flight."
 motto_fm_taoist_563:0 "The sky's steps are cool as water; I sit and watch the stars of Altair and Vega."
 motto_fm_taoist_564:0 "Smoke shrouds the cold water; moonlight veils the sand—moored near a tavern by Qinhuai River at night."
 motto_fm_taoist_565:0 "The merchant women of the south are unaware of the sorrow of a fallen nation; across the river they still sing the Songs of the Court of the Later Palace."
 motto_fm_taoist_566:0 "Thousand miles of oriole songs echo where green reflects red; in the waterside village and mountain town, the wind blows through the fluttering banners of wine shops."
 motto_fm_taoist_567:0 "How many towers and terraces stand amidst the misty rain in the four hundred eighty temples of the Southern Dynasties?"
 motto_fm_taoist_568:0 "On this clear spring day, rain falls in scattered showers; travelers on the road feel their spirits nearly broken."
 motto_fm_taoist_569:0 "I ask where the wine shop is; a herd boy points to Apricot Blossom Village."
 motto_fm_taoist_570:0 "On a bright day, seeking fragrance by the banks of the Si River, boundless scenery is all newly refreshed at once."
 motto_fm_taoist_571:0 "In ordinary times one recognizes the face of the east wind; myriad purples and reds are always spring."
 motto_fm_taoist_572:0 "A half-mu square pond opens like a mirror, where the light of heaven and shadows of clouds wander together."
 motto_fm_taoist_573:0 "Ask the channel how it can be so clear; it is because there is fresh water from its source."
 motto_fm_taoist_574:0 "Last night the spring waters rose by the riverbank; even a massive warship seemed as light as a feather."
 motto_fm_taoist_575:0 "For long in vain had I pushed against the current; today, midstream, I sail freely."
 motto_fm_taoist_576:0 "Youth fades quickly; learning is hard to master—do not treat a single moment of time lightly."
 motto_fm_taoist_577:0 "Unaware of the dream of spring grass in the pond, before I realize it, the sound of autumn leaves has fallen at my steps."
 motto_fm_taoist_578:0 "Observing the Book with Feeling: A Square Pond as a Mirror"
 motto_fm_taoist_579:0 "What joy does the pleasure of reading bring?"
 motto_fm_taoist_580:0 "Green grass before the window is not removed."
 motto_fm_taoist_581:0 "The joy of reading is endless."
 motto_fm_taoist_582:0 "A song of Yaoqin brings the warm summer breeze"
 motto_fm_taoist_583:0 "Where can one find the joy of reading?"
 motto_fm_taoist_584:0 "A few plum blossoms reveal the heart of heaven and earth."
 motto_fm_taoist_585:0 "The book is affectionate like an old friend."
 motto_fm_taoist_586:0 "Morning and evening worries and joys are always shared together."
 motto_fm_taoist_587:0 "Directly before my eyes lie three thousand words."
 motto_fm_taoist_588:0 "His heart is utterly free of a single speck of dust."
 motto_fm_taoist_589:0 "Living water flows to fill everywhere."
 motto_fm_taoist_590:0 "The east wind brings flowers and willows fresh with each passing season."
 motto_fm_taoist_591:0 "Golden saddle, jade bit—seeking fragrance with a guest"
 motto_fm_taoist_592:0 "Yet I believe there is another spring in my hut."
 motto_fm_taoist_593:0 "Establish the heart of heaven and earth"
 motto_fm_taoist_594:0 "Establish the destiny of the people"
 motto_fm_taoist_595:0 "Carry on the learning of past sages"
 motto_fm_taoist_596:0 "Open up a peaceful world for future generations"
 motto_fm_taoist_597:0 "The people are most important; the state comes next; the ruler is least of all."
 motto_fm_taoist_598:0 "He who follows the Way receives many helpers; he who does not finds few."
 motto_fm_taoist_599:0 "Heavenly timing is not as important as advantageous terrain, and advantageous terrain is not as important as the harmony of people."
 motto_fm_taoist_600:0 "Born in adversity, perished in ease."
 motto_fm_taoist_601:0 "When in poverty, perfect oneself; when successful, help the world."
 motto_fm_taoist_602:0 "Respect the elderly among us, and extend that respect to the elderly of others."
 motto_fm_taoist_603:0 "Care for my own young, and extend that care to the young of others."
 motto_fm_taoist_604:0 "Those who delight in the joys of their people will also find joy in the people's happiness."
 motto_fm_taoist_605:0 "Those who worry about the people's troubles will also be worried by the people."
 motto_fm_taoist_606:0 "No shame before heaven above or man below."
 motto_fm_taoist_607:0 "Wealth cannot corrupt us; poverty cannot change us; force cannot break us."
 motto_fm_taoist_608:0 "Sacrifice life to uphold righteousness; give up one's body to achieve benevolence."
 motto_fm_taoist_609:0 "Though there be a thousand men, I shall go forth alone."
 motto_fm_taoist_610:0 "The noble-minded and benevolent have no desire to seek life at the expense of righteousness."
 motto_fm_taoist_611:0 "There is sacrifice of life to achieve righteousness."
 motto_fm_taoist_612:0 "The commander of the three armies can be taken away, but the will of a commoner cannot be forced to change."
 motto_fm_taoist_613:0 "Only in the severest cold do we know that pines and cypresses are the last to shed their leaves."
 motto_fm_taoist_614:0 "A man without trustworthiness is not to be known."
 motto_fm_taoist_615:0 "Words must be trusted; actions must yield results."
 motto_fm_taoist_616:0 "A gentleman promotes the good deeds of others but does not foster their evil ones."
 motto_fm_taoist_617:0 "Hold oneself to strict standards while being lenient in judging others."
 motto_fm_taoist_618:0 "Blame neither heaven nor man."
 motto_fm_taoist_619:0 "Do not do to others what you do not wish for yourself."
 motto_fm_taoist_620:0 "The gentleman seeks within himself; the petty man seeks in others."
 motto_fm_taoist_621:0 "When you see someone virtuous, think of how to emulate them; when you see someone lacking virtue, reflect inwardly on your own conduct."
 motto_fm_taoist_622:0 "Among the three of us, there must be someone I can learn from."
 motto_fm_taoist_623:0 "Learn without weariness; teach without fatigue."
 motto_fm_taoist_624:0 "The wise find joy in water; the benevolent find joy in mountains."
 motto_fm_taoist_625:0 "The wise are active; the benevolent are still. The wise find joy; the benevolent attain longevity."
 motto_fm_taoist_626:0 "Time flows on like a river, day and night without ceasing."
 motto_fm_taoist_627:0 "The younger generation is to be feared; who knows that those to come will not surpass us?"
 motto_fm_taoist_628:0 "Virtue is never lonely; it always has neighbors."
 motto_fm_taoist_629:0 "The gentleman understands righteousness; the petty person understands profit."
 motto_fm_taoist_630:0 "Unjust wealth and honor are like floating clouds to me."
 motto_fm_taoist_631:0 "Eating coarse food and drinking water, yet finding joy in it."
 motto_fm_taoist_632:0 "Driven by ambition, one forgets to eat; filled with joy, one forgets worries; unaware that old age is approaching."
 motto_fm_taoist_633:0 "Is it not joyous to learn and then practice what one has learned at proper times?"
 motto_fm_taoist_634:0 "Is it not joyful to have friends come from afar?"
 motto_fm_taoist_635:0 "Is it not the mark of a gentleman to be free from resentment when others are unaware of one's virtues?"
 motto_fm_taoist_636:0 "I examine myself three times a day."
 motto_fm_taoist_637:0 "Serve others with loyalty; befriend with trust."
 motto_fm_taoist_638:0 "The gentleman focuses on the foundation; once the foundation is established, the Way arises."
 motto_fm_taoist_639:0 "Flattery is rarely a sign of true benevolence."
 motto_fm_taoist_640:0 "Carefully conclude the final rites and honor the distant ancestors; then the people's virtue will return to its proper depth."
 motto_fm_taoist_641:0 "The value of ritual lies in harmony."
 motto_fm_taoist_642:0 "Knowing harmony but not regulating it with propriety is also unfeasible."
 motto_fm_taoist_643:0 "The gentleman does not seek satiety in his food nor comfort in his dwelling."
 motto_fm_taoist_644:0 "Quick in action but cautious in speech."
 motto_fm_taoist_645:0 "There is the Way to follow and to correct oneself accordingly."
 motto_fm_taoist_646:0 "Learning from the past enables one to become a teacher."
 motto_fm_taoist_647:0 "To know what you know is to know; to admit what you do not know is also knowledge."
 motto_fm_taoist_648:0 "He who has no long-term plan will have immediate worries."
 motto_fm_taoist_649:0 "A craftsman must first sharpen his tools before he can do his work well."
 motto_fm_taoist_650:0 "Haste makes waste; pursuit of small gains leads to the failure of great undertakings."
 motto_fm_taoist_651:0 "A small lack of patience can disrupt a grand plan."
 motto_fm_taoist_652:0 "Those who follow different paths cannot plot together."
 motto_fm_taoist_653:0 "The gentleman is open and unburdened; the petty person is anxious and fretful."
 motto_fm_taoist_654:0 "The gentleman harmonizes without being uniform; the petty man seeks uniformity but fails to achieve harmony."
 motto_fm_taoist_655:0 "The gentleman is serene without being arrogant; the petty person is arrogant without being serene."
 motto_fm_taoist_656:0 "Steadfastness, simplicity, and reticence are close to benevolence."
 motto_fm_taoist_657:0 "When faced with righteousness, one should not hesitate to take the lead even before a teacher."
 motto_fm_taoist_658:0 "Education without distinction"
 motto_fm_taoist_659:0 "Teach according to aptitude"
 motto_fm_taoist_660:0 "Draw inferences from one instance."
 motto_fm_taoist_661:0 "Know one and infer ten"
 motto_fm_taoist_662:0 "Do not startle the student until he is frustrated; do not inspire him until he is eager to speak."
 motto_fm_taoist_663:0 "Learning without thinking leads to confusion."
 motto_fm_taoist_664:0 "Those who know are not as good as those who enjoy it."
 motto_fm_taoist_665:0 "Learn silently without growing weary of study."
 motto_fm_taoist_666:0 "He was so dedicated to his pursuits that he forgot to eat."
 motto_fm_taoist_667:0 "Music to forget one's worries"
 motto_fm_taoist_668:0 "Eat coarse food, drink water, and rest your head on a bent arm."
 motto_fm_taoist_669:0 "Unjust wealth and honor are like floating clouds."
 motto_fm_taoist_670:0 "The gentleman understands righteousness."
 motto_fm_taoist_671:0 "The petty-minded are motivated by profit."
 motto_fm_taoist_672:0 "To see righteousness and fail to act is to lack courage."
 motto_fm_taoist_673:0 "The wise are not perplexed; the benevolent are not anxious; the courageous are not afraid."
 motto_fm_taoist_674:0 "A gentleman helps others achieve their aspirations."
 motto_fm_taoist_675:0 "Do not do to others what you do not wish for yourself."
 motto_fm_taoist_676:0 "Hold oneself to high standards but treat others with leniency."
 motto_fm_taoist_677:0 "Do not worry that others do not know you; worry that you do not know others."
 motto_fm_taoist_678:0 "Respond to resentment with justice, repay kindness with virtue."
 motto_fm_taoist_679:0 "The gentleman associates without forming factions; the petty man forms factions without associating."
 motto_fm_taoist_680:0 "Learning without weariness, teaching without fatigue."
 motto_fm_taoist_681:0 "Forget eating in one's zeal to work"
 motto_fm_taoist_682:0 "If one corner is not understood, the other three will not be inferred; thus, no further instruction will be given."
 motto_fm_taoist_683:0 "Among three people walking together, there must be someone I can learn from; choose their good qualities and follow them."
 motto_fm_taoist_684:0 "Imitate the good in others and correct their faults."
 motto_fm_taoist_685:0 "He who aspires to the Way does not disdain coarse clothing or meager food."
 motto_fm_taoist_686:0 "Unjustly rich and noble"
 motto_fm_taoist_687:0 "To me like floating clouds"
 motto_fm_taoist_688:0 "Not obtained or retained through the proper way"
 motto_fm_taoist_689:0 "He who obtains it not by the right way shall not lose it."
 motto_fm_taoist_690:0 "How can a gentleman achieve renown without benevolence?"
 motto_fm_taoist_691:0 "A gentleman never departs from benevolence even for the time it takes to eat a meal."
 motto_fm_taoist_692:0 "In every hurried moment, I must adhere to this; in every time of adversity, I must adhere to this."
 motto_fm_taoist_693:0 "Hear the Way and rejoice; if heard in the morning, it can be acted upon by evening."
 motto_fm_taoist_694:0 "The resolute and persevering bear a heavy burden and have a long road ahead."
 motto_fm_taoist_695:0 "Serve benevolence as your duty until death comes to an end."
 motto_fm_taoist_696:0 "Only in the severest cold do we know that pines and cypresses are the last to wither."
 motto_fm_taoist_697:0 "The commander of the three armies can be taken away, but the will of an ordinary man cannot be forced to change."
 motto_fm_taoist_698:0 "To be learned and steadfast in one's aspirations, to ask earnestly and think practically—benevolence is found within these qualities."
 motto_fm_taoist_699:0 "The gentleman seeks within himself."
 motto_fm_taoist_700:0 "The humble one seeks help from others."
 motto_fm_taoist_701:0 "The Dao gives birth to One; One gives birth to Two; Two give birth to Three; Three give birth to the myriad things."
 motto_fm_taoist_702:0 "While people are alive they are soft and pliable; when they die they become hard and rigid."
 motto_fm_taoist_703:0 "The strong belong to the dead; the weak belong to the living."
 motto_fm_taoist_704:0 "The strong is placed below; the weak is placed above."
 motto_fm_taoist_705:0 "No one in the world does not know it, yet no one can carry it out."
 motto_fm_taoist_706:0 "The sage wears rough cloth but holds a gem within."
 motto_fm_taoist_707:0 "Know the world without leaving one's door"
 motto_fm_taoist_708:0 "Without peering through the window, one can perceive the Way of Heaven."
 motto_fm_taoist_709:0 "The farther one goes, the less one knows."
 motto_fm_taoist_710:0 "The Sage knows without seeing and names without hearing."
 motto_fm_taoist_711:0 "Achieve through non-action"
 motto_fm_taoist_712:0 "The Dao is always nameless and uncarved simplicity."
 motto_fm_taoist_713:0 "Heaven and earth unite to bestow sweet dew."
 motto_fm_taoist_714:0 "Knowing when to stop is the way to avoid peril."
 motto_fm_taoist_715:0 "The Great Dao is vast and can be followed or turned aside."
 motto_fm_taoist_716:0 "All things rely on it to grow without complaint."
 motto_fm_taoist_717:0 "Nourish all things without claiming dominion over them."
 motto_fm_taoist_718:0 "Constantly without desire can be named as small."
 motto_fm_taoist_719:0 "All things return to it without becoming its master."
 motto_fm_taoist_720:0 "Holding the Great Image, the world follows."
 motto_fm_taoist_721:0 "Music and delicacies stop the passerby."
 motto_fm_taoist_722:0 "The way emerges as bland and tasteless."
 motto_fm_taoist_723:0 "Seen but not visible, heard but not audible."
 motto_fm_taoist_724:0 "Insufficient to utilize it already"
 motto_fm_taoist_725:0 "If you wish to contract it, first let it expand."
 motto_fm_taoist_726:0 "If one intends to weaken it, one must first strengthen it."
 motto_fm_taoist_727:0 "To abolish it, one must first establish it."
 motto_fm_taoist_728:0 "If you wish to take it from them, you must first give it to them."
 motto_fm_taoist_729:0 "A fish cannot escape the depths of its pond."
 motto_fm_taoist_730:0 "The sharp weapons of the state should not be shown to others."
 motto_fm_taoist_731:0 "Transforming yet desiring to act, I will stabilize it with the nameless simplicity."
 motto_fm_taoist_732:0 "Nameless simplicity will also not desire."
 motto_fm_taoist_733:0 "I do not wish to disturb the world; it will settle itself through stillness."
 motto_fm_taoist_734:0 "The highest virtue is to act without action and without ulterior motives."
 motto_fm_taoist_735:0 "Virtue is practiced with intention."
 motto_fm_taoist_736:0 "The superior man does it without ulterior motives."
 motto_fm_taoist_737:0 "The superior man acts with purpose; the inferior man acts for gain."
 motto_fm_taoist_738:0 "The rites are offered but receive no response."
 motto_fm_taoist_739:0 "Lose the Way and then gain virtue"
 motto_fm_taoist_740:0 "Lose virtue before benevolence"
 motto_fm_taoist_741:0 "Lose benevolence, then righteousness"
 motto_fm_taoist_742:0 "Lose righteousness before losing propriety"
 motto_fm_taoist_743:0 "Rites are the thinness of loyalty and trust."
 motto_fm_taoist_744:0 "The former sage knew the essence of the Dao."
 motto_fm_taoist_745:0 "Embrace the substance but not the splendor."
 motto_fm_taoist_746:0 "In the past, when Heaven attained unity, it became clear."
 motto_fm_taoist_747:0 "The earth is settled by the One to achieve tranquility; the spirit is enlivened by the One to attain vitality."
 motto_fm_taoist_748:0 "When the valley is filled with one thing, all things are nourished; when the myriad creatures are united in one principle, they come into being."
 motto_fm_taoist_749:0 "If Heaven remains too clear, it may fear splitting apart."
 motto_fm_taoist_750:0 "The land cannot remain peaceful; otherwise, it will be abandoned."
 motto_fm_taoist_751:0 "The noble takes the base as its foundation; the high relies on the low as its basis."
 motto_fm_taoist_752:0 "Highest praise is no praise."
 motto_fm_taoist_753:0 "Reversal is the movement of the Dao."
 motto_fm_taoist_754:0 "The Way of the Weak"
 motto_fm_taoist_755:0 "All things in the universe are born from existence."
 motto_fm_taoist_756:0 "Being arises from non-being."
 motto_fm_taoist_757:0 "The superior scholar, upon hearing the Way, diligently practices it."
 motto_fm_taoist_758:0 "The middle-grade scholar hears the Dao as if it exists or does not exist."
 motto_fm_taoist_759:0 "The lower scholars laugh when they hear the Way."
 motto_fm_taoist_760:0 "Without laughter, the Dao cannot be fully realized."
 motto_fm_taoist_761:0 "The Way of lightness appears as obscurity; the Way of advancement appears as retreat."
 motto_fm_taoist_762:0 "The highest virtue is like a valley; the most brilliant white appears as if stained."
 motto_fm_taoist_763:0 "Great virtue appears as if insufficient; building virtue seems like theft."
 motto_fm_taoist_764:0 "The Dao gives birth to it; the De nurtures it."
 motto_fm_taoist_765:0 "The form of the object is shaped by its momentum."
 motto_fm_taoist_766:0 "The Way is honored, virtue is esteemed; none commands it, yet it remains naturally so."
 motto_fm_taoist_767:0 "Long in influence but not in control is called the profound virtue."
 motto_fm_taoist_768:0 "The world has a beginning, which is considered the mother of the world."
 motto_fm_taoist_769:0 "Once you know the mother, you can know the son."
 motto_fm_taoist_770:0 "Having known his son, he also guarded his mother."
 motto_fm_taoist_771:0 "No harm shall befall you."
 motto_fm_taoist_772:0 "Block the openings, seal the gates; thus, one shall never be troubled throughout life."
 motto_fm_taoist_773:0 "Open their channels to aid the cause; never save them throughout their lives."
 motto_fm_taoist_774:0 "Seeing smallness is wisdom; guarding softness is strength."
 motto_fm_taoist_775:0 "Use its light to restore its clarity."
 motto_fm_taoist_776:0 "To avoid bringing calamity upon oneself is to follow the established custom."
 motto_fm_taoist_777:0 "Let me be resolute in knowing the Great Way."
 motto_fm_taoist_778:0 "Only fear the execution of orders."
 motto_fm_taoist_779:0 "The great road is very level, yet people prefer to take shortcuts."
 motto_fm_taoist_780:0 "The court is corrupt, the fields are overgrown, and the granaries are empty."
 motto_fm_taoist_781:0 "Clothed in fine brocade and armed with sharp swords, I am weary of feasting."
 motto_fm_taoist_782:0 "Wealth in excess is the mark of a thief's arrogance."
 motto_fm_taoist_783:0 "Those who build well cannot be uprooted; those who hold fast cannot be severed."
 motto_fm_taoist_784:0 "Descendants continue to perform sacrifices without interruption."
 motto_fm_taoist_785:0 "Cultivate it within oneself, and its virtue becomes genuine."
 motto_fm_taoist_786:0 "Cultivate virtue within the family, and its moral influence will extend outward."
 motto_fm_taoist_787:0 "Cultivate it at the village level, and its virtue will grow."
 motto_fm_taoist_788:0 "Cultivate it within the state, and its virtue will flourish."
 motto_fm_taoist_789:0 "When it is cultivated throughout the realm, its virtue becomes universal."
 motto_fm_taoist_790:0 "Observe the self through the self; observe the family through the family."
 motto_fm_taoist_791:0 "View the world from the perspective of the entire realm"
 motto_fm_taoist_792:0 "The thickness of virtue is comparable to that of an infant."
 motto_fm_taoist_793:0 "Poisonous insects do not sting; ferocious beasts do not attack."
 motto_fm_taoist_794:0 "Weak bones and sinews yet a firm grip"
 motto_fm_taoist_795:0 "Crying all day without losing one's voice is the ultimate sign of harmony."
 motto_fm_taoist_796:0 "Zhihe said: To know the constant is to be wise; to know the way of the constant is to be enlightened."
 motto_fm_taoist_797:0 "Life-giving is considered auspicious; stirring up one's spirit is called strength."
 motto_fm_taoist_798:0 "When a thing reaches its peak strength, it begins to age; this is called not following the Dao."
 motto_fm_taoist_799:0 "What is contrary to the Dao soon comes to an end"
 motto_fm_taoist_800:0 "Blunt their sharpness, resolve their entanglements."
 motto_fm_taoist_801:0 "Blend with the light and mix with the dust."
 motto_fm_taoist_802:0 "This is called the profound unity."
 motto_fm_taoist_803:0 "Cannot be approached nor can they be distanced."
 motto_fm_taoist_804:0 "Cannot be gained, thus no benefit; cannot be avoided, thus harm."
 motto_fm_taoist_805:0 "Cannot be made valuable, nor can it be made cheap."
 motto_fm_taoist_806:0 "Thus becoming the most esteemed in the world"
 motto_fm_taoist_807:0 "Govern the state with rectitude; employ warfare with ingenuity."
 motto_fm_taoist_808:0 "To seize the empire through inaction"
 motto_fm_taoist_809:0 "The world is filled with prohibitions, yet the people grow poorer by the day."
 motto_fm_taoist_810:0 "When the populace is numerous and weapons are sharp, the state becomes corrupt."
 motto_fm_taoist_811:0 "With many people skilled in arts and crafts, strange and wondrous things begin to emerge."
 motto_fm_taoist_812:0 "When laws are overly detailed, thieves and bandits abound."
 motto_fm_taoist_813:0 "I act with non-action, and the people transform themselves naturally."
 motto_fm_taoist_814:0 "I am serene, and the people will naturally be upright."
 motto_fm_taoist_815:0 "I do nothing, yet the people become wealthy on their own."
 motto_fm_taoist_816:0 "I have no desires, and the people naturally become simple and unadorned."
 motto_fm_taoist_817:0 "Its governance is dull; its people are simple."
 motto_fm_taoist_818:0 "Its governance is strict; its people are deficient."
 motto_fm_taoist_819:0 "Who knows that he is utterly unjust?"
 motto_fm_taoist_820:0 "Right becomes strange; good turns into evil."
 motto_fm_taoist_821:0 "Square but not cutting; sharp-edged yet not piercing."
 motto_fm_taoist_822:0 "Straight but not arrogant; bright but not dazzling."
 motto_fm_taoist_823:0 "In governing people and serving Heaven, there is nothing better than frugality."
 motto_fm_taoist_824:0 "Only through frugality can one achieve early mastery."
 motto_fm_taoist_825:0 "Early service is called accumulating virtue."
 motto_fm_taoist_826:0 "Accumulate virtue, and there is nothing that cannot be overcome."
 motto_fm_taoist_827:0 "None cannot be overcome; thus their limits are unknown."
 motto_fm_taoist_828:0 "One whose limits are unknown can rule a state."
 motto_fm_taoist_829:0 "With the mother of a nation, one can endure long."
 motto_fm_taoist_830:0 "The Way of Deepening Roots and Strengthening the Foundation to Ensure Longevity and Enduring Vision"
 motto_fm_taoist_831:0 "Governing a great state is like cooking small fish."
 motto_fm_taoist_832:0 "When the Way governs the world, ghosts lose their power."
 motto_fm_taoist_833:0 "Not that the ghosts are not divine; it is that their divinity does not harm people."
 motto_fm_taoist_834:0 "For neither side to harm the other, thus virtue is mutually returned."
 motto_fm_taoist_835:0 "The great states are at the lower reaches where the world's paths converge."
 motto_fm_taoist_836:0 "The female always overcomes the male through stillness; by being still, she remains below."
 motto_fm_taoist_837:0 "A great state that subjugates a small state will take the small state."
 motto_fm_taoist_838:0 "For states smaller than the Great State, take the Great State."
 motto_fm_taoist_839:0 "The rivers and seas are thus able to be the kings of all valleys."
 motto_fm_taoist_840:0 "Because of his ability to remain humble, he became the king of a hundred grains."
 motto_fm_taoist_841:0 "The Sage who wishes to be above the people must first humble himself in speech toward them."
 motto_fm_taoist_842:0 "To lead the people, one must place oneself behind them."
 motto_fm_taoist_843:0 "Hold a high position while the people do not feel burdened."
 motto_fm_taoist_844:0 "Before the time comes, yet the people are not harmed."
 motto_fm_taoist_845:0 "The whole world joyfully recommends him without weariness."
 motto_fm_taoist_846:0 "Only by not competing can one avoid being competed against by the world."
 motto_fm_taoist_847:0 "All under heaven say that my Dao is great yet unlike the ordinary."
 motto_fm_taoist_848:0 "Only the great appears unlike."
 motto_fm_taoist_849:0 "I hold fast to my three treasures and preserve them."
 motto_fm_taoist_850:0 "First is benevolence; second is frugality."
 motto_fm_taoist_851:0 "Thirdly, dare not to be first in the world."
 motto_fm_taoist_852:0 "Compassion enables courage; frugality allows expansion."
 motto_fm_taoist_853:0 "Dare not to be first in the world, thus able to become a leader of things."
 motto_fm_taoist_854:0 "Abandoning compassion for courage, abandoning frugality for expansiveness."
 motto_fm_taoist_855:0 "For those who fight with compassion, victory will be achieved."
 motto_fm_taoist_856:0 "Fortify the strong to hold fast"
 motto_fm_taoist_857:0 "Heaven will save him with compassion and protect him."
 motto_fm_taoist_858:0 "A good soldier does not display martial prowess."
 motto_fm_taoist_859:0 "A skilled warrior does not lose his temper."
 motto_fm_taoist_860:0 "A superior victor over the enemy does not engage in direct confrontation."
 motto_fm_taoist_861:0 "Those who excel in employing others place themselves below them."
 motto_fm_taoist_862:0 "This is the virtue of non-contention."
 motto_fm_taoist_863:0 "This is to say, it is the power of using people."
 motto_fm_taoist_864:0 "This is said to be the ancient extreme of aligning with Heaven."
 motto_fm_taoist_865:0 "My words are very easy to understand and very easy to put into practice."
 motto_fm_taoist_866:0 "No one in the world understands it, no one can carry it out."
 motto_fm_taoist_867:0 "Words have a source; affairs have a ruler."
 motto_fm_taoist_868:0 "For it is because you are ignorant that you do not know me."
 motto_fm_taoist_869:0 "Those who understand me are rare; those who value me are precious."
 motto_fm_taoist_870:0 "The warbler builds its nest in a deep forest yet occupies but a single twig."
 motto_fm_taoist_871:0 "Know or not know is the highest; knowing that one does not know reveals illness."
 motto_fm_taoist_872:0 "Only by treating illness as a disease can one avoid falling ill."
 motto_fm_taoist_873:0 "The sage does not suffer from illness because he treats illness as an illness."
 motto_fm_taoist_874:0 "When the people fear no authority, great power will arrive."
 motto_fm_taoist_875:0 "No narrowness in their dwelling, no weariness in their living."
 motto_fm_taoist_876:0 "Only by not being weary can one avoid weariness."
 motto_fm_taoist_877:0 "The sage knows himself but does not seek to be seen."
 motto_fm_taoist_878:0 "Love oneself but do not consider oneself noble."
 motto_fm_taoist_879:0 "Boldness leads to death; timidity leads to life."
 motto_fm_taoist_880:0 "One of these two is beneficial, the other harmful."
 motto_fm_taoist_881:0 "Who can know the reason why Heaven detests it?"
 motto_fm_taoist_882:0 "The way of heaven does not contend yet excels in victory."
 motto_fm_taoist_883:0 "Respond without being spoken to, and come without being summoned."
 motto_fm_taoist_884:0 "Calm yet skilled in strategy"
 motto_fm_taoist_885:0 "When the people fear not death, how can they be frightened by it?"
 motto_fm_taoist_886:0 "If the people are made to fear death constantly yet still engage in extraordinary acts,"
 motto_fm_taoist_887:0 "Who dares oppose me if I seize and kill him?"
 motto_fm_taoist_888:0 "There is always an official tasked with executing punishments who carries out the executions."
 motto_fm_taoist_889:0 "He who attempts to wield the axe of a master carpenter rarely fails to injure his own hand."
 motto_fm_taoist_890:0 "The people suffer from hunger because the rulers take too much in taxes."
 motto_fm_taoist_891:0 "The people are difficult to govern because their rulers are overly active."
 motto_fm_taoist_892:0 "The people are so eager to live that they fear death lightly because their desire for survival is so strong."
 motto_fm_taoist_893:0 "For those who do not prioritize life above all else are superior to those who value life above all."
 motto_fm_taoist_894:0 "Plants are tender and brittle when alive, but wither and dry up when they die."
 motto_fm_taoist_895:0 "A strong army leads to destruction; a strong tree breaks."
 motto_fm_taoist_896:0 "The Way of Heaven is like drawing a bow, isn't it?"
 motto_fm_taoist_897:0 "Suppress the high and elevate the low."
 motto_fm_taoist_898:0 "Reduce the surplus and supplement the deficit."
 motto_fm_taoist_899:0 "The way of heaven diminishes the surplus to make up for the deficiency."
 motto_fm_taoist_900:0 "The way of the people is to take from those who have enough to give to those who have more."
 motto_fm_taoist_901:0 "The butcher dissects the ox with ease, moving freely within the joints."
 motto_fm_taoist_902:0 "Follow the midline as your guiding principle."
 motto_fm_taoist_903:0 "The official's knowledge ceases, yet the spirit's desire moves forward."
 motto_fm_taoist_904:0 "Follow the natural grain to split along the major seams."
 motto_fm_taoist_905:0 "Full of ambition and confidence"
 motto_fm_taoist_906:0 "Accept time as it is and remain in harmony with nature."
 motto_fm_taoist_907:0 "Grief and joy cannot enter."
 motto_fm_taoist_908:0 "The finger is exhausted by the fuel; the fire is passed on."
 motto_fm_taoist_909:0 "Know that it cannot be otherwise, yet accept it as fate."
 motto_fm_taoist_910:0 "Virtue is the cultivation of harmony."
 motto_fm_taoist_911:0 "No one can see their reflection in flowing water, but only in still water."
 motto_fm_taoist_912:0 "Only by stopping can one stop the multitude from stopping."
 motto_fm_taoist_913:0 "When the mirror is clear, dust and grime cease to accumulate."
 motto_fm_taoist_914:0 "Form is best achieved by yielding; the heart is best guided by harmony."
 motto_fm_taoist_915:0 "Ant's arms blocking a cart"
 motto_fm_taoist_916:0 "The usefulness of the useless"
 motto_fm_taoist_917:0 "You are not a fish; how can you know the joy of a fish?"
 motto_fm_taoist_918:0 "The locust tree at the shrine of She ends its natural life because it is deemed useless."
 motto_fm_taoist_919:0 "The clever are burdened with toil, while the wise are weighed down by worry."
 motto_fm_taoist_920:0 "The incompetent have nothing to seek."
 motto_fm_taoist_921:0 "Well-fed and wandering at leisure"
 motto_fm_taoist_922:0 "Like a boat untethered by any mooring"
 motto_fm_taoist_923:0 "Empty oneself to navigate the world"
 motto_fm_taoist_924:0 "One who can humble oneself to navigate the world—how could anyone harm them?"
 motto_fm_taoist_925:0 "Straight timber is felled first; sweet wells run dry first."
 motto_fm_taoist_926:0 "All people know the utility of what is useful."
 motto_fm_taoist_927:0 "None know the utility of the seemingly useless."
 motto_fm_taoist_928:0 "The heavens and earth possess great beauty yet remain silent."
 motto_fm_taoist_929:0 "The four seasons have clear laws without debate."
 motto_fm_taoist_930:0 "All things have an inherent order that remains unsaid."
 motto_fm_taoist_931:0 "The Sage observes the beauty of heaven and earth."
 motto_fm_taoist_932:0 "The sage of the highest order is great; the supreme one does not act."
 motto_fm_taoist_933:0 "The Dao cannot be heard; to hear it is not the Dao."
 motto_fm_taoist_934:0 "The Dao cannot be seen; what is seen is not the Dao."
 motto_fm_taoist_935:0 "The Dao cannot be spoken of without being mistaken."
 motto_fm_taoist_936:0 "Know the form of the formless?"
 motto_fm_taoist_937:0 "Thoughtless and carefree, one begins to understand the Dao."
 motto_fm_taoist_938:0 "No robes, no attendants, the road to peace begins."
 motto_fm_taoist_939:0 "Without the Way, there is no beginning to attain the Way."
 motto_fm_taoist_940:0 "The ancient true person does not know the joy of life."
 motto_fm_taoist_941:0 "Unknown to die a bad death"
 motto_fm_taoist_942:0 "In his sleep he dreams not; when awake, he knows no worry."
 motto_fm_taoist_943:0 "Their food is not satisfying; their breath is deep."
 motto_fm_taoist_944:0 "The breath of the true person originates from the heel."
 motto_fm_taoist_945:0 "The breath of the multitude passes through the throat."
 motto_fm_taoist_946:0 "Its division is also its completion; its completion is also its destruction."
 motto_fm_taoist_947:0 "Gaining is timing; losing is following the way."
 motto_fm_taoist_948:0 "Without past or present, one can enter the state of neither life nor death."
 motto_fm_taoist_949:0 "Fish forget each other in the vast river and lake."
 motto_fm_taoist_950:0 "People have forgotten the Way in their pursuit of arts and techniques."
 motto_fm_taoist_951:0 "The great earth bears me in form."
 motto_fm_taoist_952:0 "I toil in life and rest in old age."
 motto_fm_taoist_953:0 "Let me die in peace."
 motto_fm_taoist_954:0 "Therefore, those who have treated me well in life are the ones who will treat me well in death."
 motto_fm_taoist_955:0 "Smiling at each other with a shared understanding in their hearts."
 motto_fm_taoist_956:0 "Forget each other to survive, with no end or limit."
 motto_fm_taoist_957:0 "Those who have attained the Dao do not seek with joy."
 motto_fm_taoist_958:0 "To know what others do is to know it through what one knows."
 motto_fm_taoist_959:0 "Nourish what the mind does not know with what it already knows."
 motto_fm_taoist_960:0 "There is no beginning without an end."
 motto_fm_taoist_961:0 "The Heavenly Gate is non-existent."
 motto_fm_taoist_962:0 "All things emerge from non-existence."
 motto_fm_taoist_963:0 "There are things that cannot be considered as existing."
 motto_fm_taoist_964:0 "It must arise from nothingness."
 motto_fm_taoist_965:0 "His form resembles a withered corpse, his heart like dead ash."
 motto_fm_taoist_966:0 "I have lost myself."
 motto_fm_taoist_967:0 "She has heard the sounds of men but not the sounds of the earth."
 motto_fm_taoist_968:0 "The female heard the sounds of the earth but not the sounds of heaven."
 motto_fm_taoist_969:0 "The music of nature is the sound of ten thousand different winds."
 motto_fm_taoist_970:0 "It was indeed their own doing; who else could it be?"
 motto_fm_taoist_971:0 "The Way is obscured by small achievements."
 motto_fm_taoist_972:0 "Words hidden in glory and wealth"
 motto_fm_taoist_973:0 "That is right and wrong; this is also right and wrong."
 motto_fm_taoist_974:0 "But is there indeed that distinction?"
 motto_fm_taoist_975:0 "Is there truly no such thing as right or wrong?"
 motto_fm_taoist_976:0 "Born in the moment of death, dying in the moment of birth."
 motto_fm_taoist_977:0 "Possible yet not possible; not possible yet possible."
 motto_fm_taoist_978:0 "This is because it is not; it is not because it is."
 motto_fm_taoist_979:0 "Thus the sage does not follow such distinctions, but views them in the light of Heaven"
 motto_fm_taoist_980:0 "They are without a counterpart; this is called the pivot of the Way."
 motto_fm_taoist_981:0 "Shu initially grasps the center of the ring to respond to the infinite."
 motto_fm_taoist_982:0 "Heaven and earth are but one finger; all things are but one horse."
 motto_fm_taoist_983:0 "Nothing in the world is greater than the tip of an autumn hair."
 motto_fm_taoist_984:0 "And Mount Tai is small."
 motto_fm_taoist_985:0 "No one lives longer than the child who dies young, while Pengzu is considered to have died prematurely."
 motto_fm_taoist_986:0 "The Way has never had boundaries."
 motto_fm_taoist_987:0 "Speech has no fixed beginning."
 motto_fm_taoist_988:0 "Sages do not discuss matters beyond the six directions."
 motto_fm_taoist_989:0 "Within the Six Directions, sages discuss but do not debate."
 motto_fm_taoist_990:0 "The Annals of Spring and Autumn: The Aspiration of the First Kings"
 motto_fm_taoist_991:0 "The Sage debates but does not argue."
 motto_fm_taoist_992:0 "Great knowledge is leisurely; small knowledge is meddlesome."
 motto_fm_taoist_993:0 "Grand words are loud; petty words are chattering."
 motto_fm_taoist_994:0 "In sleep, their souls intertwine; in wakefulness, their forms unfold."
 motto_fm_taoist_995:0 "Engage in schemes and vie with each other through cunning."
 motto_fm_taoist_996:0 "Do not allow the heart of one near death to regain warmth."
 motto_fm_taoist_997:0 "Joy, anger, sorrow, fear, anxiety, sighing, surprise, and heat."
 motto_fm_taoist_998:0 "Day and night they alternate before one's eyes, yet no one knows where they originate."
 motto_fm_taoist_999:0 "Without them there is no me; without me there is nothing to take."
 motto_fm_taoist_1000:0 "The hundred bones, nine orifices, and six viscera are all preserved within."
 motto_fm_taoist_1001:0 "A well-dwelling frog cannot be spoken to about the sea because it is confined by its limited space."
 motto_fm_taoist_1002:0 "To the summer insect, one cannot speak of ice, for it is bound by its season."
 motto_fm_taoist_1003:0 "A man of narrow learning cannot be spoken to about the Way because he is bound by his education."
 motto_fm_taoist_1004:0 "For things, quantity is boundless; time has no end."
 motto_fm_taoist_1005:0 "Gain without joy, lose without sorrow."
 motto_fm_taoist_1006:0 "Know that the division is impermanent."
 motto_fm_taoist_1007:0 "Understand the smooth path, yet born without joy."
 motto_fm_taoist_1008:0 "To die without disaster shows that one truly understands the beginning and end of affairs."
 motto_fm_taoist_1009:0 "What others know is not as much as what they do not know."
 motto_fm_taoist_1010:0 "The greatest joy is no joy at all."
 motto_fm_taoist_1011:0 "I find true joy in doing nothing."
 motto_fm_taoist_1012:0 "The greatest joy lies in living freely through non-action; only then can one truly exist."
 motto_fm_taoist_1013:0 "Heaven and Earth do nothing yet accomplish everything."
 motto_fm_taoist_1014:0 "Who among people can attain the state of wuwei?"
 motto_fm_taoist_1015:0 "Form complete and spirit restored, united with Heaven."
 motto_fm_taoist_1016:0 "Form and essence unimpaired is the ability to transform."
 motto_fm_taoist_1017:0 "Refined to the utmost, it responds to Heaven."
 motto_fm_taoist_1018:0 "Forgetting the comfort of one's footwear."
 motto_fm_taoist_1019:0 "To forget to bring it is inappropriate."
 motto_fm_taoist_1020:0 "To forget right and wrong is the mind's contentment."
 motto_fm_taoist_1021:0 "Do not change internally, do not submit externally."
 motto_fm_taoist_1022:0 "It begins with comfort, yet one who has never experienced discomfort forgets the very nature of comfort itself."
 motto_fm_taoist_1023:0 "Pure without mixture; still and unified, unchanging."
 motto_fm_taoist_1024:0 "Indifferent yet inactive, moving in accordance with the way of heaven."
 motto_fm_taoist_1025:0 "This is the way to nourish the spirit."
 motto_fm_taoist_1026:0 "Su means that it is pure without any mixture."
 motto_fm_taoist_1027:0 "Purity refers to the fact that it does not diminish one's spirit."
 motto_fm_taoist_1028:0 "The nature of water is pure when it is not mixed."
 motto_fm_taoist_1029:0 "Stillness brings peace."
 motto_fm_taoist_1030:0 "Stagnant without flow cannot be purified."
 motto_fm_taoist_1031:0 "This is the sign of Heaven's virtue."
 motto_fm_taoist_1032:0 "Neither the harbinger of fortune nor the origin of disaster."
 motto_fm_taoist_1033:0 "Respond only after feeling; move only after being compelled."
 motto_fm_taoist_1034:0 "Rise only when there is no other choice"
 motto_fm_taoist_1035:0 "Abandon knowledge and follow the natural order of heaven."
 motto_fm_taoist_1036:0 "Thus, there are no calamities from heaven nor burdens from things."
 motto_fm_taoist_1037:0 "No one is without the responsibility of ghosts."
 motto_fm_taoist_1038:0 "Without thought or planning"
 motto_fm_taoist_1039:0 "Bright yet not ostentatious; trustworthy yet without expectation."
 motto_fm_taoist_1040:0 "His life is like floating; his death is like resting."
 motto_fm_taoist_1041:0 "His spirit is pure; his soul never rests."
 motto_fm_taoist_1042:0 "Emptiness and tranquility are in harmony with the Heavenly Virtue."
 motto_fm_taoist_1043:0 "Grief and joy are the corruptions of virtue."
 motto_fm_taoist_1044:0 "Joy and anger are faults of the Dao."
 motto_fm_taoist_1045:0 "Goodness and aversion are the loss of virtue."
 motto_fm_taoist_1046:0 "The heart free from worry or joy is the utmost of virtue."
 motto_fm_taoist_1047:0 "Stillness in unchanging constancy is the ultimate state."
 motto_fm_taoist_1048:0 "There is no offense against the ultimate truth."
 motto_fm_taoist_1049:0 "Not engaging with things; this is the utmost of detachment."
 motto_fm_taoist_1050:0 "There is no flaw in the purity of this state."
 motto_fm_taoist_1051:0 "Embracing the spirit within his nature to wander among the mundane world"
 motto_fm_taoist_1052:0 "Form alliances with those who have no beginning or end."
 motto_fm_taoist_1053:0 "Its heavenly fortress remains intact, its spirit unbroken."
 motto_fm_taoist_1054:0 "No one to hide; no one to emerge and show."
 motto_fm_taoist_1055:0 "Chai stands at its center."
 motto_fm_taoist_1056:0 "The Sage hides within the heavens, so no one can harm him."
 motto_fm_taoist_1057:0 "The avenger does not bend the Mo Gan sword."
 motto_fm_taoist_1058:0 "Even those with a malicious heart do not resent the tiles blown by the wind."
 motto_fm_taoist_1059:0 "Thus, the world is balanced and equitable."
 motto_fm_taoist_1060:0 "No punishment for war without attack; no penalty for killing in battle."
 motto_fm_taoist_1061:0 "The one who opens the sky is virtuous; the one who opens people is a thief."
 motto_fm_taoist_1062:0 "Not weary of heaven, not neglecting humanity."
 motto_fm_taoist_1063:0 "Walk above all things without fear."
 motto_fm_taoist_1064:0 "A defense of pure qi."
 motto_fm_taoist_1065:0 "When one's will is undivided, it coalesces into spirit."
 motto_fm_taoist_1066:0 "Even if heaven and earth were to collapse, they would not abandon him."
 motto_fm_taoist_1067:0 "Understand the beginning and end of material transformation."
 motto_fm_taoist_1068:0 "Knowing fate cannot alter what lies ahead."
 motto_fm_taoist_1069:0 "Those who change with things are the one who does not change."
 motto_fm_taoist_1070:0 "Refers to the transformation of things without mental scrutiny."
 motto_fm_taoist_1071:0 "The Spirit Terrace holds something, yet one does not know what it is that it holds."
 motto_fm_taoist_1072:0 "The Way should not be mixed; if it is mixed, there will be many complications."
 motto_fm_taoist_1073:0 "Too many lead to chaos and worry."
 motto_fm_taoist_1074:0 "Worried but not rescued"
 motto_fm_taoist_1075:0 "The ancient sage first preserves himself."
 motto_fm_taoist_1076:0 "And then preserve the others"
 motto_fm_taoist_1077:0 "Those who remain are yet undecided; how could we have time to deal with the violent?"
 motto_fm_taoist_1078:0 "Virtue is corrupted by fame; wisdom arises from contention."
 motto_fm_taoist_1079:0 "Names are also means of mutual suppression."
 motto_fm_taoist_1080:0 "Knowledge is also an instrument of contention."
 motto_fm_taoist_1081:0 "Neither of these is a suitable weapon for complete execution."
 motto_fm_taoist_1082:0 "Appear empty to meet things; only the Dao gathers in emptiness."
 motto_fm_taoist_1083:0 "The void is the heart-mind's zhai."
 motto_fm_taoist_1084:0 "Do not listen with the ears but with the heart."
 motto_fm_taoist_1085:0 "Do not listen with the mind, but listen with the breath."
 motto_fm_taoist_1086:0 "Qi is that which is empty and awaits things."
 motto_fm_taoist_1087:0 "Extinction is easy; maintaining a presence on the ground is difficult."
 motto_fm_taoist_1088:0 "It is easy to deceive when serving humans, but difficult to deceive when serving Heaven."
 motto_fm_taoist_1089:0 "I have heard of those who fly with wings, but never of those who fly without them."
 motto_fm_taoist_1090:0 "I have heard of those who gain knowledge through knowing, but never of those who gain knowledge through ignorance."
 motto_fm_taoist_1091:0 "Behold that empty chamber where white light is born."
 motto_fm_taoist_1092:0 "Good fortune comes to those who remain steadfast."
 motto_fm_taoist_1093:0 "For this is indeed what is meant by sitting still while one's mind races."
 motto_fm_taoist_1094:0 "To allow the senses to communicate internally while remaining detached from conscious thought."
 motto_fm_taoist_1095:0 "How much more so will the ghosts and spirits come to dwell here?"
 motto_fm_taoist_1096:0 "It is the transformation of all things."
 motto_fm_taoist_1097:0 "The bond of Yu and Shun."
 motto_fm_taoist_1098:0 "The deeds of Fuxi have reached their conclusion."
 motto_fm_taoist_1099:0 "And let alone those who are scattered?"
 motto_fm_taoist_1100:0 "Allied with Heaven"
 motto_fm_taoist_1101:0 "The Great Dao is formless yet gives birth to heaven and earth."
 motto_fm_taoist_1102:0 "The Great Dao is emotionless, governing the sun and moon."
 motto_fm_taoist_1103:0 "The Great Way has no name and nurtures all things."
 motto_fm_taoist_1104:0 "I do not know its name; I have arbitrarily called it Dao."
 motto_fm_taoist_1105:0 "The clear is the source of the turbid."
 motto_fm_taoist_1106:0 "Motion is the foundation of stillness."
 motto_fm_taoist_1107:0 "Her spirit is naturally clear, yet her mind is disturbed by it."
 motto_fm_taoist_1108:0 "The human heart naturally seeks tranquility, yet desire pulls it away."
 motto_fm_taoist_1109:0 "Often able to send away one's desires, the mind becomes naturally calm."
 motto_fm_taoist_1110:0 "Clarify your heart, and your spirit will naturally become clear."
 motto_fm_taoist_1111:0 "Naturally, the six desires cease to arise, and the three poisons are eradicated."
 motto_fm_taoist_1112:0 "Thus, those who cannot achieve it are because their hearts have not yet been clarified and their desires have not yet been dispelled."
 motto_fm_taoist_1113:0 "Those who can send them away should first observe their hearts."
 motto_fm_taoist_1114:0 "The heart has no mind; the appearance mimics the form."
 motto_fm_taoist_1115:0 "Formless in shape, yet when viewed from afar, it reveals its true form."
 motto_fm_taoist_1116:0 "When the three things are not as they should be, both sides realize this."
 motto_fm_taoist_1117:0 "Only see in the void"
 motto_fm_taoist_1118:0 "Gazing at the void, even the void itself is empty; there is nothing truly empty."
 motto_fm_taoist_1119:0 "The void is empty; there is nothing, nor is there anything."
 motto_fm_taoist_1120:0 "Tranquility abides in eternal stillness; there is nothing to be still."
 motto_fm_taoist_1121:0 "How can desire be born when desire does not arise? This is true stillness."
 motto_fm_taoist_1122:0 "True constancy in responding to affairs brings true constancy in attaining one's nature."
 motto_fm_taoist_1123:0 "Always respond with constancy; always remain calm; always maintain tranquility."
 motto_fm_taoist_1124:0 "Thus, in tranquility, one gradually enters the True Dao."
 motto_fm_taoist_1125:0 "Once one enters the True Dao, they are said to have attained the Dao."
 motto_fm_taoist_1126:0 "Though named as having attained the Way, in truth nothing has been gained."
 motto_fm_taoist_1127:0 "To transform all beings is to attain the Way."
 motto_fm_taoist_1128:0 "Those who can comprehend this may inherit the sacred Dao."
 motto_fm_taoist_1129:0 "The superior scholar knows no strife; the inferior one loves to quarrel."
 motto_fm_taoist_1130:0 "The highest virtue does not claim virtue; the lower virtue clings to virtue."
 motto_fm_taoist_1131:0 "Those who are obsessed do not understand morality."
 motto_fm_taoist_1132:0 "The reason sentient beings cannot attain the true Way is due to their deluded minds."
 motto_fm_taoist_1133:0 "As long as there is a deluded mind, the spirit will be startled."
 motto_fm_taoist_1134:0 "Already startled by its spirit, it is now manifesting in all things."
 motto_fm_taoist_1135:0 "Once one attaches to all things, greed inevitably arises."
 motto_fm_taoist_1136:0 "Once greed arises, it is indeed a source of affliction."
 motto_fm_taoist_1137:0 "Anxiety, delusion, sorrow, and suffering that afflict the body and mind."
 motto_fm_taoist_1138:0 "Thus did I suffer the indignity of a sordid existence, wandering between life and death."
 motto_fm_taoist_1139:0 "Constantly sinking in the sea of suffering, forever losing the true Dao."
 motto_fm_taoist_1140:0 "The Way of True Constancy is realized by those who attain it themselves."
 motto_fm_taoist_1141:0 "Those who attain the Dao remain ever pure and tranquil."
 motto_fm_taoist_1142:0 "Heaven unleashes its killing intent, shifting stars and changing constellations."
