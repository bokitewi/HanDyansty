l_english:
 hd_dc_kit_ten_restoration_decision:0 "Restoration Reforms"
 hd_dc_kit_ten_restoration_decision_desc:0 "The state is in decline, and the people long for change. Stake everything: rectify the court, curb the magnates, refill the treasury, and a restoration may yet be achieved; if it fails, it may only hasten the collapse."
 hd_dc_kit_ten_restoration_decision_tooltip:0 "Rectify the court and strive for a restoration"
 hd_dc_kit_ten_restoration_decision_confirm:0 "Strive for Restoration"
 hd_dc_kit_ten_restoration_decision_effect_tt:0 "Over the next ten years, matters of administration, magnates and finance will come one after another. Success depends on your abilities, the talents of your ministers and the strength of the loyalist factions; the current odds are about #high [ROOT.Char.MakeScope.ScriptValue('hd_dc_kit_ten_restoration_chance_value')|0]%#!. If the restoration succeeds, the realm will return to good order; if it fails, collapse is imminent."
 hd_dc_kit_ten_if_success_tt:0 "If the restoration succeeds:"
 hd_dc_kit_ten_if_failure_tt:0 "If it fails on the verge of success:"
 hd_dc_kit_ten_restoration_once_tt:0 "You have not yet attempted the restoration reforms"
 hd_dc_kit_ten_restoration_legitimacy_tt:0 "Your [legitimacy|E] has not yet fallen to the lowest level"
 hd_dc_kit_ten_prohibition_decision:0 "Proscription of Factions"
 hd_dc_kit_ten_prohibition_decision_desc:0 "Partisans band together and slander the court. Choose one faction, and either bar its members from office or wipe them out in one sweep."
 hd_dc_kit_ten_prohibition_decision_tooltip:0 "Choose a faction to proscribe"
 hd_dc_kit_ten_prohibition_decision_confirm:0 "Launch the Proscription"
 hd_dc_kit_ten_prohibition_decision_effect_tt:0 "Choose a faction at court, then decide on leniency or severity: dismiss them all and confine them to their homes, or imprison their leader and sweep them away in one net. Either way, the court will be gravely damaged."
 hd_dc_kit_ten_prohibition_party_tt:0 "A faction at court has a leader"
 hd_dc_kit_ten_chaos_consort_modifier:0 "Disorder: Consort Kin Dominate"
 hd_dc_kit_ten_chaos_consort_modifier_desc:0 "The Consort Kin occupy key posts and government flows from private houses, eroding the Son of Heaven's prestige. The Consort Kin faction grows mighty, and its leader finds glory within easy reach."
 hd_dc_kit_ten_chaos_eunuch_modifier:0 "Disorder: Eunuchs Meddle in Government"
 hd_dc_kit_ten_chaos_eunuch_modifier_desc:0 "The Eunuchs come and go in the forbidden palace, speaking with the voice of Heaven and cutting off inner court from outer. The Eunuch faction grows mighty, often embezzling the privy treasury, and the ministers grow ever more estranged."
 hd_dc_kit_ten_chaos_warlord_modifier:0 "Disorder: Overmighty Ministers and Warlords"
 hd_dc_kit_ten_chaos_warlord_modifier_desc:0 "Powerful ministers command armies and the regional warlords grow arrogant; the court's orders reach no farther than the capital region. The Military Merit faction swells in strength, and the lords vie to enlarge their private retinues."
 hd_dc_kit_ten_chaos_partisan_modifier:0 "Disorder: Factional Strife"
 hd_dc_kit_ten_chaos_partisan_modifier_desc:0 "The factions assail one another and quarrels spring up like swarming bees. Their mutual hatred deepens by the day; the councillors exhaust themselves in denunciations and have no mind for governance."
 hd_dc_kit_ten_warlord_vassal_modifier:0 "Self-Reliant Warlord"
 hd_dc_kit_ten_warlord_vassal_modifier_desc:0 "The court leans on regional forces, letting the lords enlarge their private retinues."
 hd_dc_kit_ten_partisan_official_modifier:0 "Distracted by Factional Strife"
 hd_dc_kit_ten_partisan_official_modifier_desc:0 "Factional strife is at its height; this person is worn out fending off denunciations and has no mind for their duties."
 hd_dc_kit_ten_consort_leader_modifier:0 "Exalted Consort Kin"
 hd_dc_kit_ten_consort_leader_modifier_desc:0 "The Consort Kin's power scorches the heavens; hangers-on throng their gates, and honors fall easily into their hands."
 hd_dc_kit_ten_restoration_success_modifier:0 "Rule of Restoration"
 hd_dc_kit_ten_restoration_success_modifier_desc:0 "The reforms have borne great fruit; law and order are restored, and all under Heaven hail a restoration."
 hd_dc_kit_ten_restoration_failed_modifier:0 "Restoration Shattered"
 hd_dc_kit_ten_restoration_failed_modifier_desc:0 "The reforms failed on the verge of success, and hearts drift further away."
 hd_dc_kit_ten_forged_evidence_modifier:0 "Forged Evidence"
 hd_dc_kit_ten_forged_evidence_modifier_desc:0 "A batch of incriminating evidence has been fabricated; the impeachment carries more weight, but is also easier to expose."
 hd_dc_kit_ten_forged_evidence_2_modifier:0 "More Forged Evidence"
 hd_dc_kit_ten_impeached_me_opinion:0 "Impeached Me"
 hd_dc_kit_ten_forged_against_me_opinion:0 "Framed Me with Trumped-Up Charges"
 hd_dc_kit_ten_forgery_disgrace_opinion:0 "Forged Evidence"
 hd_dc_kit_ten_prohibition_opinion:0 "Proscribed from Office"
 hd_dc_kit_ten_purge_opinion:0 "Purged Our Faction"
 hd_dc_kit_ten_qjc_rebel_opinion:0 "Marched on the Palace"
 hd_dc_kit_ten_qjc_removed_opinion:0 "Ousted Me to 'Purge the Emperor's Side'"
 hd_dc_kit_ten_eunuch_meddling_opinion:0 "Eunuch Meddling"
 hd_dc_kit_ten_favor_opinion:0 "Received Favor"
 hd_dc_kit_ten_slight_opinion:0 "Snubbed"
 hd_dc_kit_ten_reprimand_opinion:0 "Reprimanded"
 hd_dc_ten_impeach:0 "Impeachment"
 hd_dc_ten_impeach_action:0 "Impeach"
 hd_dc_ten_impeach_desc:0 "I am gathering evidence of [SCHEME.GetTargetCharacter.GetShortUINamePossessive] crimes to submit a memorial of impeachment"
 hd_dc_ten_impeach_desc_general:0 "The $hd_dc_ten_impeach$ [scheme|E] seeks to gather proof of a powerful minister's crimes and submit a memorial of impeachment, having them dismissed and imprisoned.\n\nThe more evidence you gather, the weightier the memorial. You may also pay to forge evidence, but if the forgery is exposed, the impeachment will surely fail and your reputation will be ruined."
 HD_DC_TEN_IMPEACH_SUCCESS_DESC:0 "The memorial reaches the throne; the minister is dismissed and imprisoned"
 HD_DC_TEN_IMPEACH_DISCOVERY_DESC:0 "The impeachment plot has been detected"
 HD_DC_TEN_IMPEACH_VS_STRONG:0 "Powerful Minister"
 HD_DC_TEN_IMPEACH_EMPEROR_DISLIKES:0 "The Son of Heaven already dislikes this person"
 hd_dc_ten_impeach_invalidated_title:0 "@scheme_icon!Impeachment Abandoned"
 hd_dc_ten_impeach_invalidated_tt:0 "The target has lost power, or you are no longer at the Son of Heaven's court; there is no longer any basis for impeachment."
 hd_dc_ten_start_impeach_interaction:0 "Impeach#weak  (Scheme)#!"
 hd_dc_ten_start_impeach_interaction_desc:0 "Gather evidence of [recipient.GetShortUINamePossessive] crimes and submit a memorial of impeachment. If it is approved, [recipient.GetSheHe] will be dismissed and imprisoned."
 start_hd_dc_ten_impeach_notification:0 "Impeachment"
 hd_dc_ten_impeach_vip_tt:0 "Only important figures (princes and marquises, faction leaders, chief ministers, etc.) may submit an impeachment"
 hd_dc_ten_qingjunce_interaction:0 "Lead Troops to Court: Purge the Emperor's Side"
 hd_dc_ten_qingjunce_interaction_desc:0 "In the name of 'purging the Emperor's side', denounce [recipient.GetShortUIName] as a treacherous minister and raise troops to demand them from the Son of Heaven."
 hd_dc_ten_qingjunce_interaction_tt:0 "You will raise troops against the Son of Heaven in the name of 'purging the Emperor's side': if you win, the treacherous minister is dismissed and imprisoned and you become the Son of Heaven's [regent|E] for life; if you lose, you will be thrown in prison. This war seeks only to remove the traitor, not to seize cities."
 hd_dc_ten_qjc_peace_tt:0 "You are not currently at war with the Son of Heaven"
 hd_dc_ten_qingjunce_cb:0 "Purge the Emperor's Side"
 hd_dc_ten_qingjunce_cb_desc:0 "Raise troops against the Son of Heaven, demanding the removal of a treacherous minister."
 HD_DC_TEN_QJC_CB_NAME:0 "Purge the Emperor's Side"
 HD_DC_TEN_QJC_WAR_NAME:0 "[ATTACKER.GetShortUIName]'s War to Purge the Emperor's Side"
 HD_DC_TEN_QJC_WAR_NAME_BASE:0 "War to Purge the Emperor's Side"
 hd_dc_ten_qingjunce_cb_victory_desc:0 "The powerful minister is dismissed and imprisoned, and [attacker.GetShortUIName] becomes the Son of Heaven's [regent|E] for life."
 hd_dc_ten_qingjunce_cb_white_peace_desc:0 "Both sides lay down arms; the powerful minister remains in office."
 hd_dc_ten_qingjunce_cb_defeat_desc:0 "[attacker.GetShortUIName] is defeated and imprisoned by the Son of Heaven."
 hd_dc_ten_embezzle_toast:0 "Eunuchs Embezzle the Privy Purse"
 hd_dc_ten_embezzle_toast_tt:0 "Using their control of receipts and disbursements, the eunuchs have embezzled a sum from the privy purse."
 hd_dc_ten_restoration_chance_up_tt:0 "The restoration is now somewhat more likely to succeed"
 hd_dc_ten_restoration_chance_up_small_tt:0 "The restoration is now slightly more likely to succeed"
 hd_dc_ten_restoration_chance_down_tt:0 "The restoration has grown somewhat harder"
 hd_dc_ten_remove_minister_tt:0 "Strip them of office and imprison them for trial."
 hd_dc_ten.0001.t:0 "Striving for Restoration"
 hd_dc_ten.0001.desc:0 "The edict goes out: reform the officialdom, curb the magnates, replenish the treasury. The court officials exchange glances — all understand this is the court's last chance to save itself."
 hd_dc_ten.0001.a:0 "Success or failure rests on this."
 hd_dc_ten.0001.a.tt:0 "In ten years the outcome will be clear. For now there is about a #high [ROOT.Char.MakeScope.ScriptValue('hd_dc_kit_ten_restoration_chance_value')|0]%#! chance of success."
 hd_dc_ten.0002.t:0 "Rectifying the Officialdom"
 hd_dc_ten.0002.desc:0 "Reform begins with the officials. The censors report that graft is rampant everywhere; without a strict purge, the new policies cannot be carried out. Yet a purge will surely offend a great many people."
 hd_dc_ten.0002.a:0 "Cleanse the officialdom, sparing no one of rank."
 hd_dc_ten.0002.b:0 "Follow precedent and proceed slowly."
 hd_dc_ten.0003.t:0 "Magnates Obstruct"
 hd_dc_ten.0003.desc:0 "The reforms have touched the interests of the local magnates. [hd_dc_ten_magnate.GetShortUIName] openly resists the new policies, and powerful families everywhere wait to see what happens."
 hd_dc_ten.0003.a:0 "Strike the magnates as a warning to others."
 hd_dc_ten.0003.b:0 "Compromise for now to put them at ease."
 hd_dc_ten.0004.t:0 "Insufficient Funds"
 hd_dc_ten.0004.desc:0 "The reforms are nearly complete, but the treasury is stretched thin. The Grand Minister of Agriculture memorializes, asking that money and grain be raised to finish the work."
 hd_dc_ten.0004.a:0 "Open the privy purse for the state's needs."
 hd_dc_ten.0004.b:0 "Levy additional taxes to meet the emergency."
 hd_dc_ten.0004.c:0 "Cut expenses and struggle on."
 hd_dc_ten.0005.t:0 "The Restoration Decided"
 hd_dc_ten.0005.desc_success:0 "Ten years of building, ten years of instruction. Law and order are restored, the treasury overflows, the magnates keep their heads down, and all quarters hail a sovereign of restoration."
 hd_dc_ten.0005.desc_failure:0 "Ten years of toil, all washed away in the end. Old abuses could not be undone, hearts scatter further, and the court no longer has the strength to turn back fate."
 hd_dc_ten.0005.a:0 "Such is the will of Heaven."
 hd_dc_ten.0005.a_success:0 "The ancestors' spirits bless the altars of the state."
 hd_dc_ten.0011.t:0 "Partisan Proscription"
 hd_dc_ten.0011.desc:0 "The factions band together and slander the court; matters have reached a point where they must be dealt with. Which faction shall feel the knife?"
 hd_dc_ten.0011.huanguan:0 "Prosecute the Eunuch faction."
 hd_dc_ten.0011.waiqi:0 "Prosecute the Consort Kin faction."
 hd_dc_ten.0011.wuxun:0 "Prosecute the Military Merit faction."
 hd_dc_ten.0011.shizu:0 "Prosecute the Gentry Clans faction."
 hd_dc_ten.0011.hanmen:0 "Prosecute the Humble Origins faction."
 hd_dc_ten.0011.cancel:0 "We will discuss this later."
 hd_dc_ten.0012.t:0 "The Partisan Prohibition Trials"
 hd_dc_ten.0012.desc:0 "The list of [hd_dc_ten_party_leader.GetShortUIName] and their followers has been submitted. Leniency or severity — it all rests on a single thought."
 hd_dc_ten.0012.a:0 "Proscribe the faction, barring them from office."
 hd_dc_ten.0012.a.tt:0 "[hd_dc_ten_party_leader.GetShortUIName]'s entire faction is dismissed and confined to their homes for ten years, barred from office; every partisan gnashes their teeth at you."
 hd_dc_ten.0012.b:0 "Round them all up!"
 hd_dc_ten.0012.b.tt:0 "Faction leader [hd_dc_ten_party_leader.GetShortUIName] and the faction's key figures are all imprisoned; the faction vanishes like smoke and cannot re-form for ten years; the survivors hate you to the bone.\n#EMP Partisans who command troops may rise in the name of 'purging the Emperor's side'.#!"
 hd_dc_ten.0013.t:0 "The Partisans' Plea"
 hd_dc_ten.0013.desc:0 "News arrives that the partisans have been rounded up. The survivors flock to you, acclaim you as their leader, and beg you to remove [hd_dc_ten_pm_pick.GetShortUIName] in the name of 'purging the Emperor's side'."
 hd_dc_ten.0013.a:0 "Raise troops to purge the Emperor's side!"
 hd_dc_ten.0013.b:0 "Bide my time in silence."
 hd_dc_ten.0021.t:0 "Evidence Mounts"
 hd_dc_ten.0021.desc:0 "Another piece of evidence for impeaching [hd_dc_ten_impeach_target_preview.GetShortUIName] has been added to the files on your desk. Submit the memorial at once, or wait a while longer? If the proof seems thin, there are those willing to 'fill in the gaps' for you — at the right price."
 hd_dc_ten.0021.a:0 "Submit the impeachment!"
 hd_dc_ten.0021.a.tt:0 "Once submitted, the memorial rests with the Son of Heaven; the stronger the evidence, the likelier its approval. If approved, [hd_dc_ten_impeach_target_preview.GetShortUIName] will be dismissed and imprisoned, and your fame will soar:"
 hd_dc_ten.0021.b:0 "Pay handsomely for forged evidence."
 hd_dc_ten.0021.b.tt:0 "#EMP If the forgery is exposed, the impeachment will surely fail and your reputation will be ruined.#!"
 hd_dc_ten.0021.c:0 "Gather more for a while."
 hd_dc_ten.0022.t:0 "After the Impeachment"
 hd_dc_ten.0022.desc_success:0 "The memorial reaches the throne and the dragon countenance flares in fury. [hd_dc_ten_impeach_target.GetShortUIName] is stripped of office and imprisoned for trial."
 hd_dc_ten.0022.desc_forged:0 "When the authorities re-examined the evidence in the memorial, they found numerous flaws. The forgery is exposed, the impeachment comes to nothing, and you instead become the target of every arrow."
 hd_dc_ten.0022.desc_failure:0 "The memorial sinks like a stone into the sea. [hd_dc_ten_impeach_target.GetShortUIName] still sits securely in office — and already knows who moved against them."
 hd_dc_ten.0022.a:0 "Let us see what follows."
 hd_dc_ten.0023.t:0 "Impeached"
 hd_dc_ten.0023.desc_success:0 "[hd_dc_ten_impeach_owner.GetShortUIName] submitted an impeachment, and the Son of Heaven approved it. You have been stripped of office and cast into prison."
 hd_dc_ten.0023.desc_forged:0 "[hd_dc_ten_impeach_owner.GetShortUIName] submitted an impeachment against you, but the evidence was forged and has been exposed by the authorities."
 hd_dc_ten.0023.desc_failure:0 "[hd_dc_ten_impeach_owner.GetShortUIName] submitted an impeachment against you; fortunately, the Son of Heaven did not approve it."
 hd_dc_ten.0023.a:0 "This will be avenged."
 hd_dc_ten.0041.t:0 "Disorder"
 hd_dc_ten.0041.desc_consort:0 "The Consort Kin now overpower every faction at court, and government issues from private households. The tide of #high Consort Kin Domination#! is set."
 hd_dc_ten.0041.desc_eunuch:0 "Eunuchs come and go within the palace, cutting it off from the outer court; ministers can scarcely glimpse the imperial face. The tide of #high Eunuch Meddling#! is set."
 hd_dc_ten.0041.desc_warlord:0 "Military officials hold great armies and the lords each keep private retinues; the court's orders carry less weight by the day. The tide of #high Overmighty Ministers and Warlords#! is set."
 hd_dc_ten.0041.desc_partisan:0 "The court factions are evenly matched and assail one another, and the affairs of state lie neglected. The tide of #high Factional Strife#! is set."
 hd_dc_ten.0041.a:0 "Such are the times; what can be done?"
 hd_dc_ten.0051.t:0 "Deposition"
 hd_dc_ten.0051.desc:0 "After long scheming, it is done at last. [target.GetShortUIName] has been deposed and imprisoned, and the throne has a new master."
 hd_dc_ten.0051.desc_huangdi:0 "The palace gates are shut, ringed by armored soldiers. The officials stand silent as cicadas in winter, watching [target.GetShortUIName] be deposed and imprisoned. That a Son of Heaven can be set up and cast down by a subject — this world is no longer the world it was."
 hd_dc_ten.0051.a:0 "The Mandate of Heaven is mine."
 hd_dc_ten.0101.t:0 "Enfeoffing the Consort Kin"
 hd_dc_ten.0101.desc:0 "[hd_dc_ten_waiqi_leader.GetShortUIName] submits a memorial asking that their brothers, sons, and nephews be made marquises. The whole court looks askance, yet none dare speak."
 hd_dc_ten.0101.a:0 "Grant the request."
 hd_dc_ten.0101.b:0 "The Founder's covenant: no marquisate without merit."
 hd_dc_ten.0102.t:0 "The Empress Dowager Holds Court"
 hd_dc_ten.0102.desc:0 "Once again [hd_dc_ten_dowager.GetShortUIName] has bypassed you, summoning ministers and answering memorials on her own. The courtiers have grown used to consulting the inner palace first and reporting to the Son of Heaven afterward."
 hd_dc_ten.0102.a:0 "Comply with her decree."
 hd_dc_ten.0102.b:0 "We shall take the reins of government in person."
 hd_dc_ten.0103.t:0 "The Consort Kin Plot a Deposition"
 hd_dc_ten.0103.desc:0 "A secret report: [hd_dc_ten_waiqi_leader.GetShortUIName] has gathered confidants in their mansion to discuss enthroning a new sovereign. If this is true, disaster is at hand."
 hd_dc_ten.0103.a:0 "Strike first!"
 hd_dc_ten.0103.b:0 "Shower them with rewards to put them at ease."
 hd_dc_ten.0103.c:0 "Bide my time in silence."
 hd_dc_ten.0111.t:0 "The Ten Regular Attendants"
 hd_dc_ten.0111.desc:0 "[hd_dc_ten_eunuch_leader.GetShortUIName] and the other eunuchs control the palace; memorials reach the throne only through their hands, and edicts mostly issue from their mouths. The ministers of the outer court seethe with resentment."
 hd_dc_ten.0111.a:0 "They are loyal; keep them in favor as before."
 hd_dc_ten.0111.b:0 "Order the outer court to deliberate state affairs jointly."
 hd_dc_ten.0112.t:0 "Eunuch Army Supervisors"
 hd_dc_ten.0112.desc:0 "[hd_dc_ten_eunuch_leader.GetShortUIName] requests that palace attendants be sent to supervise the armies, claiming they will keep watch on the generals with great forces on the Son of Heaven's behalf. Hearing this, the generals are deeply displeased."
 hd_dc_ten.0112.a:0 "Approved."
 hd_dc_ten.0112.b:0 "The army must not be shackled."
 hd_dc_ten.0113.t:0 "Eunuchs Forge Edicts"
 hd_dc_ten.0113.desc:0 "A minister reports in secret: several recent edicts did not come from the imperial will, but were issued by [hd_dc_ten_eunuch_leader.GetShortUIName] and their clique in the sovereign's name."
 hd_dc_ten.0113.a:0 "Punish them without mercy!"
 hd_dc_ten.0113.b:0 "Let the matter drop."
 hd_dc_ten.0121.t:0 "Frontier Garrison Hoards Troops"
 hd_dc_ten.0121.desc:0 "[hd_dc_ten_strong_vassal.GetShortUIName] sits on a great army and has lately been recruiting private retainers on a large scale; within their domain, the court's edicts are now dead letters."
 hd_dc_ten.0121.a:0 "Reward them lavishly to win them over."
 hd_dc_ten.0121.b:0 "Issue an edict of stern rebuke."
 hd_dc_ten.0122.t:0 "Request for Hereditary Office"
 hd_dc_ten.0122.desc:0 "[hd_dc_ten_strong_vassal.GetShortUIName] submits a memorial asking that their sons and brothers inherit their post, and that they may appoint and dismiss the officials under them as they please."
 hd_dc_ten.0122.a:0 "Appeasement is best."
 hd_dc_ten.0122.b:0 "Refuse outright."
 hd_dc_ten.0123.t:0 "An Overbearing Minister"
 hd_dc_ten.0123.desc:0 "[hd_dc_ten_wuxun_leader.GetShortUIName], arrogant in their merits, does not hasten when entering court nor give their name when presenting affairs, carrying themselves as though they were the Son of Heaven."
 hd_dc_ten.0123.a:0 "Strip their command and remove them from office!"
 hd_dc_ten.0123.b:0 "Endure it."
 hd_dc_ten.0131.t:0 "Factions Trade Accusations"
 hd_dc_ten.0131.desc:0 "[hd_dc_ten_la.GetShortUIName] and [hd_dc_ten_lb.GetShortUIName] denounce each other in court, and memorials from their followers fly in like snowflakes, each demanding that the Son of Heaven deliver justice."
 hd_dc_ten.0131.a:0 "Side with [hd_dc_ten_la.GetShortUIName]."
 hd_dc_ten.0131.b:0 "Side with [hd_dc_ten_lb.GetShortUIName]."
 hd_dc_ten.0131.c:0 "Rebuke both for their faults, favoring neither."
 hd_dc_ten.0132.t:0 "Corrupt Recommendations"
 hd_dc_ten.0132.desc:0 "In this year's recommendations, most of those named Filial and Incorrupt or Flourishing Talent are sons of powerful houses, and scholars of humble birth are full of grievance. The students of the Imperial Academy have gathered to petition, accusing the Administrators of taking favors from great families. The scandal has set the whole city abuzz."
 hd_dc_ten.0132.a:0 "Investigate it to the end."
 hd_dc_ten.0132.b:0 "Suppress the case."
 hd_dc_ten.0133.t:0 "The Partisans' Judgments"
 hd_dc_ten.0133.desc:0 "The scholars of the Pure Stream privately appraise the ministers; once their monthly verdict is out, anyone labeled 'Turbid Stream' sees their career darken. The courtiers both respect and fear it."
 hd_dc_ten.0133.a:0 "Pure Criticism has its own public verdict; adopt their judgments."
 hd_dc_ten.0133.b:0 "Forbid private appraisals."
 hd_dc_kit_ten_forged_evidence_2_modifier_desc:0 "$hd_dc_kit_ten_forged_evidence_modifier_desc$"
