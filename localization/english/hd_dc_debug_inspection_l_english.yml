 hd_dc_debug.epidemic.menu: "Select Real Epidemic Disaster Type"
 hd_dc_debug.epidemic.menu.desc: "After selecting the disaster type, you must also choose its intensity, which will be confirmed on the named commandery execution page. The first two steps only select parameters and do not trigger an epidemic outbreak. Each of the seven native plagues has three intensity entry points; DLCs, rules, Black Death, and similar diseases still prevent activation based on actual conditions."
 hd_dc_debug.epidemic.smallpox: "Smallpox"
 hd_dc_debug.epidemic.bubonic_plague: "Bubonic plague"
 hd_dc_debug.epidemic.typhus: "Typhus"
 hd_dc_debug.epidemic.consumption: "Pulmonary Tuberculosis"
 hd_dc_debug.epidemic.measles: "Measles"
 hd_dc_debug.epidemic.dysentery: "Dysentery"
 hd_dc_debug.epidemic.ergotism: "Holy Fire Disease"
 hd_dc_debug.epidemic.minor: "Slight"
 hd_dc_debug.epidemic.major: "Severe"
 hd_dc_debug.epidemic.apocalyptic: "Devastating"
 hd_dc_debug.epidemic.intensity: "Select Real Epidemic Intensity"
 hd_dc_debug.epidemic.intensity.desc: "Selected disaster: [SCOPE.GetFlagName('hd_dc_debug_epidemic_name')]. The three options for \n\n correspond to native minor, major, and apocalyptic. The devastating plague of the glanders belongs to the Black Death; retain its independent rules, actual occurrence status, and geographical restrictions of the current map; not all rule combinations can find a legally occurring commandery."
 hd_dc_debug.epidemic.confirm: "Confirm the actual outbreak of the epidemic."
 hd_dc_debug.epidemic.confirm.desc: "Disaster Type: [SCOPE.GetFlagName('hd_dc_debug_epidemic_name')]\n Intensity: [SCOPE.GetFlagName('hd_dc_debug_epidemic_intensity')]\n\n This page has checked the real region commanderies according to the selected combination. Only by clicking Confirm below will the epidemic actually be created, which may spread, cause characters to fall ill or die. Manual scenarios do not draw natural D probability and will not modify existing epidemics, DLCs, rules, passed dates, or political obligations."
 hd_dc_debug.epidemic.create: "Confirm: Create the selected epidemic in the named commandery."
 hd_dc_debug.epidemic.historical_block: "\n#N  This combination is blocked by the actual map contract: the branch for the historical Black Death outbreak location is unavailable in the currently loaded custom map. Therefore, under historical event rules, a devastating plague of glanders cannot be prepared; temporary rule changes or bypassing the 1346/ geographical restrictions will not occur. #!"
 hd_dc_debug.epidemic.dlc_block: "\n#N This disaster type requires the native Legends of the Dead feature license, which is currently not met. The button will not bypass the DLC lock.#!"
 hd_dc_debug.epidemic.active_block: "\n#N Native Black Death is occurring; the creation of Plague of Destruction is no longer possible. #!"
 hd_dc_debug.epidemic.never_block: "\n#N Current rules prohibit the Black Death; you cannot create a devastating plague of bubonic origin. #!"
 hd_dc_debug.epidemic.once_block: "\n#N The current rules allow the Black Death to occur only once, and since the occurrence marker already exists, this record will not be cleared and recreated. #!"
 hd_dc_debug.faction_scene.populist_county: "\nQualified populist establishes commandery: [scope:hd_dc_debug_populist_county.GetName]. Actually targeting you."
 hd_dc_debug.faction_scene.peasant_county: "\nQualified farmers establish a commandery: [scope:hd_dc_debug_peasant_county.GetName]. Actually targeting you."
 hd_dc_debug.faction_scene.no_populist: "No populist commanderies in the \n region have passed the native can_title_create_faction check: they require real commanderies and targets to satisfy native government, faith/culture, membership, and existing organization constraints; conversion of religion or culture or removal of existing uprisals will not be done to qualify."
 hd_dc_debug.faction_scene.no_peasant: "No peasant commanderies in the \n region have passed the native can_title_create_faction check: real commandery, target, and existing organization constraints are not met. Please check the native faction interface; direct war declaration will not replace faction creation."
 hd_dc_debug.faction_scene.populist: "Create a populist faction from the named qualified commandery that has actually been established."
 hd_dc_debug.faction_scene.peasant: "Create a peasant faction from the named eligible commandery in actuality."
 hd_dc_debug.fields.disaster: "\nReal Disaster Association ID: [scope:hd_dc_debug_record.Var('hd_dc_disaster_identity').GetValue|0]\nDisaster Type: [scope:hd_dc_debug_record.Var('hd_dc_disaster_type').GetFlagKey]\nActual Stage of This Entry: [scope:hd_dc_debug_record.Var('hd_dc_disaster_stage').GetFlagKey]\nOccurrence and recovery represent different real serial numbers for the same disaster; recovery records do not indicate that you have completed any political trials."
 hd_dc_debug.fields.disaster_county: "\nActual Disaster Center:[scope:hd_dc_debug_record.Var('hd_dc_disaster_epicenter').Title.GetName]"
 hd_dc_debug.relation_scene: "Enter the real family disputes or enemy events"
 hd_dc_debug.relation_scene.desc: "Only entering through the complete native entry point allows the original event to select actual objects and subsequent responses. No random pool is constructed here, nor are illicit affairs, old grudges, kidnapping success, or relationship outcomes forcibly set. Once prerequisites are fulfilled, named characters within events and each choice genuinely alter the world."
 hd_dc_debug.relation_scene.family: "Initiate a qualified native partner suspicion chain."
 hd_dc_debug.relation_scene.family.tt: "Invoke event adultery.0001; the original event option selects a genuine partner and imposes the existing five-year restriction on the suspected individual, then prompts you to decide whether to confront them directly. The actual suspicion branch is only entered if the other party denies the accusation; you cannot choose denial for them. If the secret is false, it will be handled by the original storyline without fabricating infidelity."
 hd_dc_debug.relation_scene.no_family: "\n Family Dispute Prerequisites Insufficient: You must be within the region, qualify as a native annual character, and not be gullible; at least one physically active adult real spouse must not have been recently suspected, and you must be suspicious, or your native partner must possess promiscuous/seducer traits or show signs of genuine infidelity; faith cannot accept adultery without punishment. The original 5-year target cooldown is not cleared."
 hd_dc_debug.relation_scene.rival: "Initiate a qualified native enemy to kidnap the family chain."
 hd_dc_debug.relation_scene.rival.tt: "Invoke yearly.1010 to select the actual enemy, your court's friends and relatives, and pursuers from the original event. This chain may result in genuine imprisonment, injury, death, payment, or relationship changes; it is not a kidnapping conspiracy initiation rate test. Preserve the original 10-year occurrence restriction; do not substitute whether friends and relatives voluntarily leave or the outcome of rescue efforts."
 hd_dc_debug.relation_scene.no_rival: "\n Insufficient prerequisites for the Enemy Event: The original 10-year mark must not exist; an adult, actionable AI enemy must have a territory or be the heir of its lord, and that lord must exist and not be you; your court must have an adult, actionable AI spouse/relative/mistress who is not your enemy; additionally, there must be an actionable AI military commander who is not severely wounded, or the actual Hunter Camp official position."
 hd_dc_debug.faction_scene: "Authentic Faction Creation and Ultimatum"
 hd_dc_debug.faction_scene.desc: "The Create button reuses the native can_create_faction function, and a faction is only truly established when all conditions for characters, lords, governments, and faction eligibility are met. NEG-05 to 07 retain the native creation method, and when W ≥ 20, an additional chance of 10% per year per regime (converted via P) is added, with a maximum of one extra faction created; actual sampling records can be viewed on the annual inspection page. The final ultimatum still requires meeting the native requirements for power, dissatisfaction, and date."
 hd_dc_debug.faction_scene.liege: "\nThe actual target of faction creation is: [ROOT.Char.GetLiege.GetShortUIName]."
 hd_dc_debug.faction_scene.demand_target: "\n, the actual leader who intends to send you an ultimatum: [scope:hd_dc_debug_demand_leader.GetShortUIName]."
 hd_dc_debug.faction_scene.no_demand: "\n has no preparable claimant factions: must be genuinely directed at you, leader/candidate/target titles still exist, no ongoing wars, and no ROY-08 pause. First establish legally via ROY-01; this menu does not create leaders, claims, or titles."
 hd_dc_debug.faction_scene.ready: "\n Native current rebellion check: Passed. Switch to the named leader above, use the formal ultimatum button in the faction interface, or wait for the native AI to choose. Debugging does not directly issue ultimatum events to preserve the engine's initial rebellion state."
 hd_dc_debug.faction_scene.not_ready: "\n Native current rebellion check failed. Actual dissatisfaction can be explicitly increased, but power, date, and other qualifications must still be met in reality; increased dissatisfaction alone does not constitute a successful rebellion."
 hd_dc_debug.faction_scene.independence: "Actually create an independent faction targeting the current lord."
 hd_dc_debug.faction_scene.liberty: "Actually create a liberal faction targeting the current lord."
 hd_dc_debug.faction_scene.demand: "Prepare to launch an uprising: Actual faction dissatisfaction +25"
 hd_dc_debug.faction_scene.demand.tt: "Truly increase the faction's dissatisfaction by 25 and read both the previous and current values; do not increase military strength or forge dates. Do not directly invoke the ultimatum callback, nor add a self-created sent flag. After completing preparations, review eligibility on this page again, then switch to the leader from the native faction interface to formally launch an attack."
 hd_dc_debug.region.not_emperor: "\nROY-01/PAR-01 Entry Unqualified: You are not the current Emperor. Switch to the actual Emperor before initiating; holder will not be replaced."
 hd_dc_debug.region.no_royals: "\nROY-01 lacks candidates: fewer than two authentic figures have passed the formal clan candidate inspection. They must remain alive, adult, free, of the same lineage with a fief, and permitted by their native faction; the preparation menu only intensifies existing qualified clan members, without creating new fiefs or clans."
 hd_dc_debug.region.no_parties: "\n PAR-01 lacks two sets of authentic qualified factions: each group must have at least 3 active members, a valid adult free faction leader, members still matching this year with an actual power snapshot, and each faction's power must account for at least 20%. Two individuals being enemies cannot substitute for an organization."
 hd_dc_debug.region.no_affected_county: "\nPAR-01 Missing a real, governable disaster-stricken commandery: Must be listed in the regional registry, have a genuine epidemic or disaster situation, be a commandery under the Son of Heaven's vassalage with the lord alive and free, and not currently occupied by existing trial measures or tax reductions. You may first prepare epidemics or disasters via the Realistic Scenario page, then recheck."
 hd_dc_debug.region.no_roy_instance: "\nROY-08 lacks a formal royal instance. The ROY-01 must first be legally established to form a real candidate faction, before switching to the recipient character capable of joining that faction."
 hd_dc_debug.region.outside: "\nYou are not among the participants in the dynasty cycle; character increments and ordinary nodes cannot treat characters outside the region as eligible characters."
 hd_dc_debug.scheme_scene: "Prepare a real murder or kidnapping plot"
 hd_dc_debug.scheme_scene.desc: "Select a named AI target that natively has can_start_scheme from the actual participants of the dynastic cycle. Clicking it will initiate the scheme; success rate, stage, accomplices, and outcome are still determined by the native scheme system. It does not directly kill or imprison anyone and is not considered an AI-initiated danger rate sampling. Please view the real scheme on the scheme panel."
 hd_dc_debug.scheme_scene.murder_target: "\nPlanned assassination target: [scope:hd_dc_debug_murder_target.GetShortUIName]."
 hd_dc_debug.scheme_scene.abduct_target: "\nKidnapping target proposed: [scope:hd_dc_debug_abduct_target.GetShortUIName]."
 hd_dc_debug.scheme_scene.no_murder: "\n has no native legal murder targets: verify character eligibility, conspiracy slots, existing schemes targeting the same individual, cooldown periods, diplomatic range, and kinship restrictions. Only select AI characters currently alive within the region; the target must not possess strong leverage against you; existing conspiracies will not be cleared."
 hd_dc_debug.scheme_scene.no_abduct: "\n has no native legal kidnapping targets: the actor must possess the Kidnapper skill, have their camp unlocked, or hold the relevant struggle permission; the target must be an adult, free playable ruler. Targets cannot be imprisoned or held as hostages; actual location and diplomatic range are required. Child restrictions, incapacity, and native cooldowns/quotas are still checked. Skills will not be added to forge eligibility."
 hd_dc_debug.scheme_scene.murder: "Initiate an actual murder conspiracy against the named target"
 hd_dc_debug.scheme_scene.abduct: "Launch an actual kidnapping plot against the named target"
 hd_dc_debug.disaster_scene: "Prepare for real earthquake or flood disaster scenarios"
 hd_dc_debug.disaster_scene.desc: "The affected commandery is explicitly displayed below. Upon selection, it invokes the official native disaster occurrence entry to establish a realistic disaster scenario and subsequent response measures. The disaster occurs explicitly in the scene without waiting for natural maintenance draws; this operation does not modify the elapsed date, existing political entities, decrees, response outcomes, or trial periods. This action is not a natural D-rate sampling."
 hd_dc_debug.disaster_scene.earthquake_target: "\nEarthquake Target:[scope:hd_dc_debug_earthquake_county.GetName]."
 hd_dc_debug.disaster_scene.flood_target: "\nFlood Disaster Target:[scope:hd_dc_debug_flood_county.GetName]."
 hd_dc_debug.disaster_scene.no_earthquake: "\n Earthquake lacks qualified commanderies: must be within the dynasty cycle commandery roster, have actually developed at least 2, be located within the native Chinese geographical scope, and have no ongoing earthquake situation."
 hd_dc_debug.disaster_scene.no_flood: "\nFlood disaster lacks qualified commanderies: Must be within the dynasty cycle commandery roster, have developed at least 2 in reality, located in the global flood area, and be an initialized real Yellow River or Yangtze River river district with no existing flood disaster. Will not replace rivers with commandery corrections."
 hd_dc_debug.disaster_scene.earthquake: "Trigger an earthquake in the named commandery"
 hd_dc_debug.disaster_scene.flood: "Cause a real flood in the actual river basin where the named commandery is located."
 hd_dc_debug.disaster_scene.created: "The formal entry has returned to the actual disaster situation and read back via disaster type. Please check the map and disaster interface, select the actual response; PAR preparation still requires real affected vassal commanderies where governance can be exercised and real two-party factions—disasters do not substitute these conditions."
 hd_dc_debug.disaster_scene.unconfirmed: "The formal entry point does not allow verification of the actual disaster situation, so reporting a successful occurrence is not possible. Please check the target geography, development status, existing disasters, initialization, and logs. This menu does not write in damage correction or fake response failures."
