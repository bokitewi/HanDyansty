 hd_dc_debug.neg01.desc: "The base probability for initiating assassination has been converted using the danger rate, retaining dynamic base probabilities and native target eligibility. F is 1/1.15/1.40/1.80/2.30; the fixed multiplier from \"Warlords Dividing the Realm\" is separately merged, with a maximum of 3. \n\n Please use real target assassination interaction checks to verify actual schemes; manual player clicks do not represent AI automatic occurrence rate samples. The menu does not replace native sampling with another random pool."
 hd_dc_debug.neg02.desc: "Kidnap native initiator entry retention capability, legal targets, and stratagem conditions; F is 1/1.15/1.40/1.80/2.30. Those without the kidnap capability still cannot execute. \n\n The real stratagem scene page will search for and display named legal targets; verify native qualifications again before initiating, then create a real kidnap stratagem. Subsequent actions and results are handled by the stratagem process; manually initiating once does not represent an AI natural occurrence rate sample."
 hd_dc_debug.neg03.desc: "The extortion entry preserves real secrets, informed parties, and native dynamic base values, with F being 1/1.15/1.40/1.80/2.30. After officially issuing the extortion request, it remains subject to the actual response from the opposing party. \n\n The real-scenario page allows adding a new native secret for named qualified court officials and informing you of it; then right-click on this person to formally issue an extortion request. Preparation operations clearly occur in the present, without fabricating past crimes; no direct evidence is issued, nor are manual proposals treated as AI probability samples."
 hd_dc_debug.neg04.desc: "Temporarily Unavailable: As confirmed in this update, the four native entry points of the compromised treasury remain closed. Annual AI detection and dynamic probability, five-year cooldown, five native agent slots, and withdrawal accounting are retained; detection will report native entry point closure without forcibly creating schemes. \n\n Withdrawals at each stage and endgame, actual deductions, received amounts, and pending settlement differences continue to be processed according to real ledger entries, allowing native fixed withdrawals to cause overdrafts. Existing crash data cannot prove the root cause of old access conflicts; it remains unverified whether the compromised treasury is playable."
 hd_dc_debug.neg05.desc: "The legitimacy of populist factions is read from P, with five tiers set at 1/1.10/1.25/1.50/1.80. Upon creation, adopt the newly approved rules: retain native auto-creation; when W≥20, each regime draws an additional chance per year based on a base 10%, converted via P, selecting equally among actual legal types, with a maximum of one created. \n\n Populist types use the native creation qualification of real commanderies; do not replace the native final creation probability. The annual check page displays actual records, while the scenario page allows preparation of real factions without directly starting or winning uprisings."
 hd_dc_debug.neg06.desc: "The legal uprising of the Peasant faction reads P, with five tiers set at 1/1.10/1.25/1.50/1.80. Ordinary peasant types now have access to additional annual creation opportunities: W≥20, base 10% converted via P, sharing the limit of one per regime per year with other legal types; native creation remains preserved. \n\n Upgrading the Peasant faction still follows the original uprising upgrade process for creation, retaining authentic leaders and commandery transfers. Additional opportunities do not fabricate prerequisite uprisings, armies, or victories."
 hd_dc_debug.neg07.desc: "Create an approved additional annual opportunity using the modified settings: retain native auto-creation, with a base 10% per regime annually when W≥20, converted via P; upon success, select one of equal power among actual legal types, create at most one, and do not redraw on failure. The number of candidates does not increase type weight. \n\n Verify native creation eligibility separately for ordinary characters, commandery uprisings, and authentic claimants; exclude existing factions of the same type; Japanese mechanisms that are disabled continue to be excluded under current conditions, while upgraded peasants retain their native upgrade process. This does not assert reading or replacing the engine's final creation probability. The annual inspection page can be accessed to view actual sampling and creation results."
 hd_dc_debug.neg08.desc: "The native faction's rebellion entry point has been dynamically linked to the base value per type in P; the five tiers are 1/1.10/1.25/1.50/1.80. Existing factions must still meet their power, dissatisfaction, and other prerequisites; the 0 and 100 endpoints retain their original meanings. \n\n The Real Faction page can add actual dissatisfaction to named non-paused claimant factions and replay net changes, displaying whether the native faction is currently capable of rebellion; it must be sent from the native faction interface, and debugging does not skip the internal state of the first rebellion. ROY-08D paused guards remain valid."
 hd_dc_debug.neg09.desc: "Native correction integrated: character stress increase levels are set to 0 / +10% / +20% / +35% / +50%. Applies to characters participating in events within the system area; levels are initialized and refreshed upon monthly observation, removed upon leaving the area; stacking with other stress corrections and actual changes are handled by native rules. \n\n First record the character's current stress, then use the operation below to submit a base +10 stress increase, comparing the real stress readings before and after the operation with the current correction."
 hd_dc_debug.neg10.desc: "Native correction applied: Character legitimacy increases by five tiers to 0 / -10% / -20% / -35% / -50%. This applies to characters participating in situations within the system area; stacking with other legitimacy corrections and actual growth are handled by native rules. \n\n Switch to W tier and refresh to view character corrections; record the current legitimacy value, then complete actions that genuinely increase legitimacy, and compare the before-and-after readings."
 hd_dc_debug.neg11.desc: "Native correction integrated: Character legitimacy loss tiers are 0 / +10% / +25% / +50% / +80%. Applies to characters participating within the system area; stacking with other legitimacy corrections and actual losses are handled by native rules. \n\n Records the character's current legitimacy; completing actions that reduce legitimacy will compare pre- and post-action readings; switching tiers replaces this system correction, and removal occurs upon leaving the area."
 hd_dc_debug.neg12.desc: "The seven native epidemic types now have valid entry points for each intensity level, with five tiers: 1/1.05/1.10/1.15/1.20. \n\n The real-scenario page allows sequential selection of the seven disaster types, three intensity levels, and confirmation of a named commandery; it reuses native occurrence effects and rereads infection data. DLCs, cooldowns for identical diseases, native base rules, and Black Death regulations remain in effect; if historical Black Death cannot meet its occurrence location on the current map, it is explicitly blocked. The 21 menu combinations do not represent 21 scenarios that are valid under any rule set, nor does manual creation prove natural D probability or engine propagation."
 hd_dc_debug.neg13.desc: "Restored the real earthquake and flood disaster entry points, along with existing geographical mappings for China, the Yellow River, and the Yangtze River. The debug page reuses the formal commandery qualification and event generation interfaces; development is retained at a minimum of 2, excluding earthquakes within the same commandery and floods within the same river basin, without fabricating disaster conditions. \n\n In manual scenarios, real disasters are explicitly established, while subsequent responses continue to run under native conditions; natural D multipliers, seasons, and runtime callbacks must be checked separately—manual triggering once cannot validate natural probabilities."
 hd_dc_debug.neg14.desc: "This fixed inspection covers 14 categories: drunkards, marijuana users, debauched individuals, hermits, irritable people, spendthrifts, philanthropists, penitents, comfort eaters, loss of appetite, self-flagellators, as well as non-hereditary depression, insanity, and possession. It includes verified character attributes, natural random acquisition opportunities to access F, retention of authentic qualifications, mutual exclusivity, dynamic denominators, and single sampling; generation of new characters, deterministic selection, and conditions with 100% results preserved as original. \n\n Entries such as drinking, education, banquets, inspiration, duels, and guest traits are handled by actual event context. The real-scenario page allows inspection of qualified drinking sampling and probability records; when pressure and cooldown are qualified, a complete pressure event can be initiated. Failure to draw a trait from qualified opportunities is a normal result."
 hd_dc_debug.neg15.desc: "Control power is benchmarked against its actual value when first entering the crisis in this cycle, with cumulative deductions of 0/5/10/15/20%. Only the difference above the highest processed tier is replenished; repeated refreshing, changing lords, lowering and then raising back to a previous tier does not incur duplicate deductions. The loss period ends only after low-tier stability persists for 60 months. \n\n records the control power of the capital commandery, adjusting W in a pattern of 20→80→40→80 with repeated refreshing, verifying the total amount already processed and deducted. Losses are not refunded upon tier reduction."
 hd_dc_debug.neg16.desc: "Development progress is deducted by 0/2/4/6/8% cumulatively based on the actual baseline for this cycle; after rounding, only the new difference is compensated. Normal development continues to be retained; no settlement occurs when a lord changes, and repeated monthly refreshes do not compound deductions. \n\n is checked alongside control level; when the development baseline is low, rounding may result in no new losses."
 hd_dc_debug.neg17.desc: "Already integrated into the current reconciliation pool are marriage disputes, existing hostile branches, banquets, children's gatherings, jousting sabotage, witchcraft gatherings, and a mixed pool of lord relationships. Read actual kinship or spousal relationships; F values are 1/1.15/1.40/1.80/2.30. If a pair qualifies for both kinship and old grudge, the qualification is applied only once. Preserve character traits, compatibility, child eligibility, and real consequences. \n\n The mixed pool retains native death and injury branching, adjusting only condition relationship probabilities where ordinary outcomes can be assigned; endpoint probabilities remain unchanged at 0% or 100%. Family dispute scenes may initiate a complete adultery.0001 suspicion chain, preserving the actual target and a five-year cooldown."
 hd_dc_debug.neg18.desc: "The relationship probability sources for this reconciliation have been integrated into 16 locations, including existing enemies, banquets, and children's disputes, as well as newly added martial arts testing, witchcraft gatherings, and the yearly.4001 non-death condition pool. After verifying actual old grudges and negative affinity, use F without repeating amplification within the same sampling instance. Only diversion paths involving death, injury, or inevitable enmity retain their native casualty probabilities and 100% endpoint conditions for \n\n. In true enemy scenarios, events such as kidnapping relatives and friends can be initiated via the complete entry point yearly.1010, preserving qualifications for all parties and decade markers; consequences may include death. ORD-19 also features separate cooperation procedures with responses from youths and guarantors respectively."
 hd_dc_debug.neg19.desc: "Already integrated: In the currently loaded script, family unity negative or variable positive-negative write uses 1/1.10/1.25/1.50/1.80; fixed positive incremental increase is not amplified. Original character affiliation, native descriptions, and range processing are retained. Governments without a real unity mechanism do not apply to \n\n. Qualified families may submit a base -10 unity below, with separate checks for the five tiers and family change records; this test does not alter the government to fake a unity mechanism."
 hd_dc_debug.test_unity: "Actual submission base -10 Family Unity"
 hd_dc_debug.test_unity.tt: "Within the Dynasty Cycle area, where a real family exists and the current government possesses an innate Unity mechanism. The actual reduction of family Unity is applied once per current P; no automatic refund will occur."
 hd_dc_debug.unity_change: "Dynasty Cycle Debugging: Actual Unity Loss"
 hd_dc_debug.neg20.desc: "The current region's county and populace opinion uses a single source with five tiers: 0/−5/−10/−15/−20. Tier switching first removes the old tier before adding the new one; leave the applicable region to clear this source. \n\n can be refreshed repeatedly to verify the same tier without stacking; character affinity does not belong to this county-level opinion."
 hd_dc_debug.refresh_stocks: "Execute formal commandery-level influence refresh"
 hd_dc_debug.refresh_stocks.tt: "Actually refreshes the area's control power, development level, and public opinion sources. The first upgrade will incur a deduction of existing stock losses; repeated calls must maintain the same highest processed tier."
 hd_dc_debug.test_stress: "Actually submitted base +10 pressure"
 hd_dc_debug.test_stress.tt: "This will increase real pressure and may reach the threshold of native pressure events. Other native modifiers still participate in calculations."
 hd_dc_debug.test_native_breakdown: "Initiate a qualified native pressure event"
