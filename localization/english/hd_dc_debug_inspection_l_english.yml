 hd_dc_debug.fields.exchange: "The exchange of prisoners has also been verified and released through formal procedures. \n"
 hd_dc_debug.fields.petitioner: "\nPetitioner:[scope:hd_dc_debug_record.Var('hd_dc_petitioner').Char.GetShortUIName]"
