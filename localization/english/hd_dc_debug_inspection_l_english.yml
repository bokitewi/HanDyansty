 hd_dc_debug.fields.pay_parties: "\n Actual Payer: [scope:hd_dc_debug_record.Var('hd_dc_payer').Char.GetShortUIName]\n Actual Payee: [scope:hd_dc_debug_record.Var('hd_dc_payee').Char.GetShortUIName]"
 hd_dc_debug.fields.proposal: "\n Proposal Current Status: [scope:hd_dc_debug_record.Var('hd_dc_proposal_state').GetFlagKey]"
 hd_dc_debug.fields.from_signature: "Initiator's Authentic Signature: \n [scope:hd_dc_debug_record.Var('hd_dc_from_signature').Char.GetShortUIName]"
 hd_dc_debug.fields.to_signature: "\n Recipient's Actual Signature: [scope:hd_dc_debug_record.Var('hd_dc_to_signature').Char.GetShortUIName]"
 hd_dc_debug.fields.trait: "\nTrait sampling source: [scope:hd_dc_debug_record.Var('hd_dc_trait_source').GetFlagKey]\nBase chance: [scope:hd_dc_debug_record.Var('hd_dc_trait_base_chance').GetValue|2]%\nMultiplier: [scope:hd_dc_debug_record.Var('hd_dc_trait_multiplier').GetValue|2]\nActual chance: [scope:hd_dc_debug_record.Var('hd_dc_trait_actual_chance').GetValue|2]%\nActual result: [scope:hd_dc_debug_record.Var('hd_dc_trait_result').GetFlagKey]"
 hd_dc_debug.native_scene.desc: "This page displays specific objects. Clicking will actually change the new world; returning to the menu does not undo this action. Native increments and trait sampling can check the current tier; manually preparing secrets or plagues does not represent natural occurrence sampling, nor does it mean all twenty interface types have been completed."
 hd_dc_debug.native_scene.secret_target: "\nProposed characters to add as real secrets: [scope:hd_dc_debug_secret_target.GetShortUIName]. The secret type is selected by the original game based on this person's faith, existing traits, and secret eligibility."
 hd_dc_debug.native_scene.no_secret_target: "\n Secret Scene Missing Objects: There are no surviving, adult, free characters in your court who can be added via the original game's extortion secret inspection feature. You must first recruit qualified courtiers; this page will not impersonate existing leverage as a secret."
 hd_dc_debug.native_scene.no_legitimacy: "\nLegitimacy increase cannot be executed: the current character lacks an innate legitimacy mechanism. The government will not be modified to fabricate qualifications."
 hd_dc_debug.native_scene.no_drunkard: "\n Alcohol sampling cannot be executed: failed native can_be_drunkard check. Adult status, existing drunkard trait, mutually exclusive conditions, and faith requirements are still checked by the original system; duplicate grants are not allowed."
 hd_dc_debug.native_scene.secret: "Prepare a real blackmailable secret for a named court official."
 hd_dc_debug.native_scene.secret.tt: "Generate authentic secrets for the character above based on their original qualifications and inform you of them. No evidence will be issued, money deducted, or demands accepted on behalf of the character. Then right-click the character to issue a proposal through the formal extortion interaction."
 hd_dc_debug.native_scene.secret_created: "Secret generation executed and native secret object obtained; you are the only one aware of it, targeting [scope:hd_dc_debug_secret_target.GetShortUIName].\nSecret content:[scope:new_secret.Custom('SecretDescriptionThirdPerson')]\n\nPlease check the Secret panel, then right-click this person to issue an extortion demand. Interactions still verify whether the secret is exposed, whether extortion is possible, existing leverage, and pending response status; only the party's formal reply determines the outcome."
 hd_dc_debug.native_scene.secret_failed: "No native secret object obtained; generation success cannot be reported. Please check the target's current qualifications and logs. This page does not support reissuing handles or substituting results."
 hd_dc_debug.native_scene.legitimacy_gain: "Actually submit +10 Legitimacy and read the before-and-after values"
 hd_dc_debug.native_scene.legitimacy_loss: "Actually submit -10 Legitimacy and read the before-and-after values"
 hd_dc_debug.native_scene.drunkard: "Conduct a legal drinking trait draw (base 10%)"
 hd_dc_debug.native_scene.drunkard.tt: "Invoke the formal alcohol sampling interface, convert once based on the current F; failing to draw is also a valid result. Once granted to an alcoholic, it cannot be obtained again; retain the base probability, multiplier, actual probability, and grant result in the ledger. Not all negative trait entry points are covered by proof."
 hd_dc_debug.native_delta: "The actual reading of this native increment"
 hd_dc_debug.native_delta.desc: "Before execution: [SCOPE.GetValue('hd_dc_debug_before_amount')|2]\n After execution: [SCOPE.GetValue('hd_dc_debug_after_amount')|2]\n Net change this time: [SCOPE.GetValue('hd_dc_debug_actual_delta')|2]\n\n Read from the same effect chain, including native modifications and range clamping. This page represents the observed value of the previous operation; it is not recorded as a natural source, nor does it prove that all sources' final incremental interception has been closed."
 hd_dc_debug.native_scene.outbreak_county: "\nProposed real prefecture for the selected epidemic outbreak: [scope:hd_dc_debug_outbreak_county.GetName], located in the province of that prefecture's capital."
 hd_dc_debug.native_scene.no_outbreak_county: "\n has no region/commandery available to prepare this combination: requires vassal holding a commandery, lord alive and free, no existing plague or system trial/tax reduction in use; native base, multiplier, and recent plague factors at the selected intensity must allow occurrence. Additionally retains measles/dysentery/Holy Fire DLC locks, Holy Fire same-disease cooldown, Black Death disabled/single occurrence already happened/currently occurring/historical geography restrictions. When teaching or initial grace period causes base to be zero, date is not changed; tuberculosis/measles endemic bonuses still read in native order."
 hd_dc_debug.native_scene.outbreak: "Select seven plagues and three intensities"
 hd_dc_debug.native_scene.outbreak.tt: "Reuses the native province create_epidemic_outbreak to actually create the disaster type and intensity above. Upon clicking, it checks the same-named commandery again. It does not modify the natural incidence rate or additional sampling, nor does it add fake epidemic corrections to the commandery. After occurrence, it reads the real epidemic; spread, infection, and death are handled by the native system."
 hd_dc_debug.native_scene.outbreak_created: "The real epidemic has already been read in [scope:hd_dc_debug_outbreak_county.GetName]. The request just made was for [SCOPE.GetFlagName('hd_dc_debug_epidemic_name')]/[SCOPE.GetFlagName('hd_dc_debug_epidemic_intensity')]; please verify the actual type, intensity, and spread on the epidemic map. Natural merging of other epidemics is still handled by the engine; reading back infections in a commandery does not prove they will not merge. \n\n If PAR dual-commandery comparison is needed, prepare another qualified commandery without an epidemic, then enter the scenario preparation menu. It will not automatically fill out responses, pay relief funds, or skip the 12-month trial period."
 hd_dc_debug.native_scene.outbreak_unconfirmed: "The native epidemic effect has already been submitted to the [scope:hd_dc_debug_outbreak_county.GetName] capital, but the current effect chain has not yet detected the infected province. The epidemic cannot be reported as confirmed, and no county correction for impersonation will be added. Please check the map and actual disaster-affected qualifications after the native epidemic updates, then prepare for the PAR scenario."
 hd_dc_debug.history_unavailable: "\n#N History Record Warning: No surviving ledger keeper was present during at least one W/H write operation; only the last written details for that area are retained. This notice does not indicate successful supplementary recording. #!"
 hd_dc_debug.roy01: "ROY-01: Initiate a dispute over ritual order"
 hd_dc_debug.roy01.tt: "You must be the reigning Son of Heaven, have a valid regional snapshot, at least two eligible native royal clan candidates, the royal house type not on cooldown, and no current or pending instances occupying the region. Formal establishment will create actual claims and factions, and initiate a 50-year type cooldown."
 hd_dc_debug.roy08: "ROY-08: Please invite me with a qualified invitation from my kinsmen."
 hd_dc_debug.roy08.tt: "Requires an existing recent dynasty instance and a currently valid faction with active claims. You must be a qualified recipient eligible to join the faction; you cannot be the Emperor, the candidate themselves, someone already joined, or a party engaged in conflict with either side. No pair of characters may have pending invitations, existing join records, or retry cooldowns. Factions on pause cannot recruit members."
 hd_dc_debug.par01: "PAR-01: Initiate a policy inquiry between the two parties"
 hd_dc_debug.par01.tt: "You must be the reigning Emperor, the region must be unoccupied, and faction strife must not be on cooldown; both real factions must have at least 3 active members each, with a power share of at least 20%, and their leaders must be hostile to one another; additionally, there must be a vassal commandery affected by real plague or disaster where governance can be enacted. First, inquire with the two faction leaders; only if their actual responses are opposite will the main instance be established, without filling in policies for anyone on behalf of others."
 hd_dc_debug.prepare_roy: "Prepare ROY-01: Exacerbate the dissatisfaction of two existing clan members."
 hd_dc_debug.prepare_roy.tt: "Only two adult free clan members who already possess territories, belong to the Emperor's lineage, and meet native faction permissions can be selected. Each receives a five-year -200 affinity toward the Emperor and 300 gold; you receive 300 gold. No characters will be created, no clans altered, no territories redistributed, and no past crimes fabricated. If fewer than two candidates are available, preparation cannot proceed. Subsequently, formal registration occurs from the Legitimate Events menu."
 hd_dc_debug.prepare_support: "Prepare ROY-08: Funds and Genuine Human Leverage"
 hd_dc_debug.prepare_support.tt: "From the latest roster of royal candidates, select a genuine candidate who can legally extend an invitation to you. Both you and the selected candidate will each receive 300 gold; if you permit the establishment of leverage, you will gain personal leverage against that candidate. The leverage must be utilized in the actual D option; do not pause prematurely, nor automatically sign protection pledges."
 hd_dc_debug.prepare_ord09: "Prepare ORD-09: True Kinship and Prisoner Exchange"
 hd_dc_debug.prepare_ord09.tt: "Select another eligible reigning ruler within the region to act as the captor, generating one of your 18-year-old children and one of that person's 18-year-old children; the former will be detained by the other party, while the latter will be detained by you. You gain 300 gold. The detention, familial relationships, and characters are all real; closing the menu does not undo this action. Subsequently, you must still issue a proposal and receive a genuine response from the captor."
 hd_dc_debug.prepare_ord13: "Prepare ORD-13: Low-Control Commandery, Pressure, and Relatives"
 hd_dc_debug.prepare_par: "Prepare PAR-01: Comparison of the Two Genuine Parties and Affected Commanderies"
 hd_dc_debug.prepare_par.tt: "There must already be two native factions with qualified numbers of members, official ranks, and actual influence, as well as two vassal commanderies that have genuinely suffered disasters and are eligible for governance. The leaders of the two factions will receive a mutual -200 favorability for five years; the current development and control level of the second commandery will be adjusted to match that of the first commandery, granting you 300 gold and +16 management for five years. No plague outbreaks, fabrication of faction member counts, or substitution of policy responses will occur. Subsequently, actual policy divergence will arise through formal inquiries."
 hd_dc_debug_party_grievance_opinion: "Debug Scene: The Growing Rift Between the Two Parties"
 hd_dc_debug_policy_training: "Debug Scene: Policy Management Preparation"
 hd_dc_debug.prepare_ord13.tt: "Select an existing adult free direct vassal and set their control over a commandery to 40; generate a 35-year-old relative or friend to join your court and establish a friendship, gaining 300 gold and increasing pressure by at least 200, potentially triggering a native pressure event. The current Keeper of the Seal gains +100 favor toward you over five years; if no minister has been appointed yet, you must appoint one yourself."
 hd_dc_debug_friend_reason: "[CHARACTER.GetShortUIName] and [TARGET_CHARACTER.GetShortUIName] become friends while debugging a scene."
 hd_dc_debug_roy_grievance_opinion: "Debug Scene: Dissatisfaction Among Newly Born Clan Members"
 hd_dc_debug.impacts: "Twenty Categories of Dangerous World Effects and Inspection Entrances"
 hd_dc_debug.results: "Verify the current instance against the actual receipt"
 hd_dc_debug.region: "Regions, Eras, and Entry Restrictions"
 hd_dc_debug.region.desc: "Core Commanderies Count: [scope:hd_dc_debug_region.Var('hd_dc_total_counties').GetValue|0]\n Actually Controlled Commanderies Count: [scope:hd_dc_debug_region.Var('hd_dc_controlled_counties').GetValue|0]\n Actual Control Rate: [scope:hd_dc_debug_region.Var('hd_dc_control_percent').GetValue|1]%\n\n Hegemony ends only after 12 months without hegemony or 24 months with an actual control rate below 50%, then the official adjudicator enters the Era of Warlords; exits after restoring to 65% and stabilizing for 60 months. Tribute does not count as actual control. W/H adjustments do not directly switch eras. \n The following lists only currently active restrictions:"
 hd_dc_debug.region.chaos: "\nThe current era is one of warlords dividing and controlling territories."
 hd_dc_debug.region.locked: "The primary crisis slot for region \n is occupied by an actual instance and cannot be overwritten."
 hd_dc_debug.region.prepared: "The political entity at \n has not yet been established and cannot be created again."
 hd_dc_debug.region.party_wait: "The two-party policy inquiry is still ongoing and awaiting a formal response. \n"
 hd_dc_debug.region.roy_cooldown: "\nThe 50-year cooldown for Imperial House type has not yet ended."
 hd_dc_debug.region.par_cooldown: "\nThe faction strife cooldown of 50 years has not yet ended."
 hd_dc_debug.region.ordinary_wait: "\nYou have a pending ordinary event and cannot open another ordinary node."
 hd_dc_debug.region.invalid: "The snapshot for region \n is invalid; please perform a formal observation first and verify the actual territories in the world."
 hd_dc_debug.details: "View the result of this receipt"
 hd_dc_debug.older: "View the previous receipt"
 hd_dc_debug.latest: "Return to the latest receipt"
 hd_dc_debug.receipt.desc: "Area Receipt Number: [scope:hd_dc_debug_record.Var('hd_dc_record_id').GetValue|0]\n Record Version: [scope:hd_dc_debug_record.Var('hd_dc_record_version').GetValue|0]\n Record Type Identifier: [scope:hd_dc_debug_record.Var('hd_dc_record_kind').GetFlagKey]\n\n This page reads and preserves the authentic record. Flipping pages will not deduct fees, require supplementary signatures, advance dates, or settle accounts. Items that do not appear indicate that this record lacks the corresponding field; it does not signify fulfillment."
 hd_dc_debug.receipt.empty: "No records match the current pagination range. You may return to the latest receipt; records established through natural or manual formal procedures will be retained in the regional register."
 hd_dc_debug.receipt.instance: "\nMain Instance: Governing Q [scope:hd_dc_debug_record.Var('hd_dc_q').GetValue|0], Intensity X [scope:hd_dc_debug_record.Var('hd_dc_x').GetValue|0], Unresolved Obligations [scope:hd_dc_debug_record.Var('hd_dc_open_obligations').GetValue|0]."
 hd_dc_debug.receipt.payment: "\n Payment Due: [scope:hd_dc_debug_record.Var('hd_dc_amount_due').GetValue|2]\n Actual Deduction: [scope:hd_dc_debug_record.Var('hd_dc_actual_debit').GetValue|2]\n Actual Receipt: [scope:hd_dc_debug_record.Var('hd_dc_actual_credit').GetValue|2]\n Payments and political responses are recorded separately; full receipt does not signify that all non-monetary obligations have been fulfilled."
 hd_dc_debug.receipt.refund: "\n outstanding deductions not yet returned: [scope:hd_dc_debug_record.Var('hd_dc_unreturned_debit').GetValue|2]. Closing the event does not clear this balance."
 hd_dc_debug.receipt.protection: "The named protection was established on \n at [scope:hd_dc_debug_record.Var('hd_dc_protection_date_year').GetValue|0]:[scope:hd_dc_debug_record.Var('hd_dc_protection_date_month').GetValue|0]:[scope:hd_dc_debug_record.Var('hd_dc_protection_date_day').GetValue|0], with a duration of five years. The protected individuals include the recipient at the time of signing and their close relatives who were still alive at that moment; titles are frozen as of the signing date, and characters born afterward or those who acquire titles subsequently will not be automatically included."
 hd_dc_debug.receipt.protection_wait: "The previous five-year protection period is still in effect. The date advances with the game, and the menu does not shorten the duration. \n"
 hd_dc_debug.receipt.audit_pending: "Records of actual penalties for \n exist but cannot yet be verified against prior legal basis; they are pending verification and must not be recorded as completed in accordance with the agreement. You may flip to the corresponding named protected object record to view the actual executor and operation."
 hd_dc_debug.protection.actor: "\nActual executor recorded:[scope:hd_dc_debug_record.Var('hd_dc_protection_harm_actor').Char.GetShortUIName]"
 hd_dc_debug.protection.title: "\nActual Frozen Titles Transferred Out: [scope:hd_dc_debug_record.Var('hd_dc_protection_harm_title').Title.GetName]"
 hd_dc_debug.protection.imprison: "\n Operation performed: Detention."
 hd_dc_debug.protection.execute: "\n records death callbacks; whether it belongs to an actual execution must be determined by formal observation after death."
 hd_dc_debug.protection.revoke: "\n Operation performed: Transfer of titles is frozen."
 hd_dc_debug.protection.legal: "\n Prior Justification: Captured legal basis; this action does not constitute a breach of contract."
 hd_dc_debug.protection.illegal: "\n Prior basis: Verified as having no legal basis; breach of contract will only be processed after actual operation occurs."
 hd_dc_debug.protection.unknown: "\n Prior basis: Unknown. Legality or illegality cannot be presumed, and completion rewards for fulfilling obligations shall not be issued accordingly."
 hd_dc_debug.protection.unknown_actor: "\nNative callbacks do not provide a verifiable actual executor and do not guess the title recipient or other figures as the commander."
 hd_dc_debug.receipt.pause: "\n has actually consumed the leverage; mobilization suspension begins on [scope:hd_dc_debug_record.Var('hd_dc_pause_date_year').GetValue|0]/[scope:hd_dc_debug_record.Var('hd_dc_pause_date_month').GetValue|0]/[scope:hd_dc_debug_record.Var('hd_dc_pause_date_day').GetValue|0]. Re-verify the original faction and character upon expiration; do not cancel wars that have already occurred."
 hd_dc_debug.receipt.trial: "\nThe first local authority actually collected funds on [scope:hd_dc_debug_record.Var('hd_dc_audit_first_date_year').GetValue|0] year [scope:hd_dc_debug_record.Var('hd_dc_audit_first_date_month').GetValue|0] month [scope:hd_dc_debug_record.Var('hd_dc_audit_first_date_day').GetValue|0] day. Cross-referencing the trial, each commandery is tracked separately for 12 months; the invalidation of one party does not mean the other has fulfilled its obligations, and after expiration, waiting for both party leaders to reconcile accounts is still required."
 hd_dc_debug.receipt.letters: "\n This record belongs to ORD-19. Both parties first undergo separate acceptance within three months, followed by actual payment of 30 gold pieces before entering another three-month period of named communication; settlement of W−2 occurs only when both actual responses are complete."
 hd_dc_debug.receipt.closed: "\nThis ordinary node has been closed; payments and unpaid records remain in the register."
 hd_dc_debug.receipt.subject: "Protected targets frozen upon signing: \n. Protected receipt belonging to: [scope:hd_dc_debug_record.Var('hd_dc_protected_person').Char.GetShortUIName]. Receipt ID: \n. Owner: [scope:hd_dc_debug_record.Var('hd_dc_protection_contract').Var('hd_dc_record_id').GetValue|0]."
 hd_dc_debug.receipt.points: "\nPoint Serial Number: [scope:hd_dc_debug_record.Var('hd_dc_point_sequence').GetValue|0]\nSource Identifier: [scope:hd_dc_debug_record.Var('hd_dc_point_source').GetFlagKey]\nDate: [scope:hd_dc_debug_record.Var('hd_dc_point_date_year').GetValue|0] Year [scope:hd_dc_debug_record.Var('hd_dc_point_date_month').GetValue|0] Month [scope:hd_dc_debug_record.Var('hd_dc_point_date_day').GetValue|0] Day \nW Request/Actual: [scope:hd_dc_debug_record.Var('hd_dc_w_requested').GetValue|0]/[scope:hd_dc_debug_record.Var('hd_dc_w_committed').GetValue|0]\nH Request/Actual: [scope:hd_dc_debug_record.Var('hd_dc_h_requested').GetValue|0]/[scope:hd_dc_debug_record.Var('hd_dc_h_committed').GetValue|0]\nWritten W/H After: [scope:hd_dc_debug_record.Var('hd_dc_w_after').GetValue|0]/[scope:hd_dc_debug_record.Var('hd_dc_h_after').GetValue|0]\n. The above are internal points, where every 20 points correspond to 1 point on the interface. This serial number does not participate in monthly obligation processing."
 hd_dc_debug.result.roy_code: "\nRoyal Court Etiquette Order Actual Case Closure Indicator: [scope:hd_dc_debug_record.Var('hd_dc_roy01_result').GetFlagKey]"
 hd_dc_debug.result.par_code: "\n Policy Node Actual Case Closure Flag: [scope:hd_dc_debug_record.Var('hd_dc_par01_result').GetFlagKey]"
 hd_dc_debug.result.ordinary_code: "\nOrdinary Node Actual Case Closure Flag: [scope:hd_dc_debug_record.Var('hd_dc_ordinary_result').GetFlagKey]"
 hd_dc_debug.result.protection_code: "\nNamed protection actual case closed flag: [scope:hd_dc_debug_record.Var('hd_dc_protection_result').GetFlagKey]"
 hd_dc_debug.result.pause_code: "\nMobilization Suspended Actual Case Closure Indicator:[scope:hd_dc_debug_record.Var('hd_dc_pause_result').GetFlagKey]"
 hd_dc_debug.details.desc: "The following list only includes results that have already occurred or been recorded in this log. Blank entries do not indicate success; items without corresponding results may still be pending or do not belong to this record."
 hd_dc_debug.result.fulfilled: "\n Five-year protection period has concluded in accordance with the agreement."
 hd_dc_debug.result.breached: "\n has recorded actual infringements without legal basis and protects breach of contract."
 hd_dc_debug.result.invalidated: "The party, authority, location, or other actual prerequisites have become invalid; completion rewards were not issued. \n"
 hd_dc_debug.result.expired: "The response deadline for \n has expired."
 hd_dc_debug.result.partial: "\n has partial fulfillment or unrecovered accounts; continue to review payments and local records."
 hd_dc_debug.result.verified: "\n Both named faction leaders have completed their actual accounting; the current policy node has been settled according to agreement."
 hd_dc_debug.result.rejected: "The local area or party leader has refused; it is not counted as fulfilled by all. \n"
 hd_dc_debug.result.released: "\n has been verified to actually release the relatives."
 hd_dc_debug.result.writing: "\nBoth parties have accepted and paid, now awaiting a named communication."
 hd_dc_debug.result.youth_letter: "\n has received a signed reply from the youth."
 hd_dc_debug.result.guarantor_letter: "\n has received a signed response from the guarantor."
