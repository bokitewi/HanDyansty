l_english:
 hd_embattle_retry_deputies_decision:0 "Review Deputy Vacancies"
 hd_embattle_retry_deputies_decision_desc:0 "After long campaigns, some deputies on your armies’ wings have been wounded or departed, leaving posts vacant for months. You order every army to muster its officers again: deputies still serving will remain, and new candidates will be chosen from your followers for the empty posts."
 hd_embattle_retry_deputies_decision_tooltip:0 "Review the wings of your armies and fill vacant deputy posts"
 hd_embattle_retry_deputies_decision_confirm:0 "Review the armies!"
 hd_embattle_retry_deputies_decision_effect:0 "Serving deputies will remain at their posts. New candidates will be chosen from your followers to fill vacancies, including posts you previously left empty deliberately. Where no suitable candidate is available, the post will remain vacant for now."
