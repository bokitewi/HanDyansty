l_english:
 hd_embattle_retry_deputies_decision:0 "Review Deputy Vacancies"
 hd_embattle_retry_deputies_decision_desc:0 "Review each of your existing armies once. Valid appointments are preserved. Paused automatic searches and deliberately empty slots are reopened. Armies that cannot fill their vacancies pause again instead of searching repeatedly while marching or entering combat. The first use also performs legacy Embattle data cleanup when required."
 hd_embattle_retry_deputies_decision_tooltip:0 "Allow one new automatic appointment attempt for each of your armies."
 hd_embattle_retry_deputies_decision_confirm:0 "Review My Armies"
 hd_embattle_retry_deputies_decision_effect:0 "Preserve valid deputies and try to fill vacancies once. Insufficient candidates pause further automatic attempts. No resource cost."
