 hd_dc_pressure_status: "Crisis: [Situation.MakeScope.Var('hd_dc_pressure_percent').GetValue|1]/100 · Tier [Situation.MakeScope.Var('hd_dc_pressure_band').GetValue|0]"
 hd_dc_pressure_status_tt: "During an age of peril, this measures the court's accumulated problems, retaining factors inherited from previous eras and adjusting them during ages of good government. Catalyst costs use the current era's conversion rate; separatist regions continue to use the values of the age of peril. This reading determines the five crisis tiers and the rewards and penalties for governance. Catalyst progress on the phase diagram is tracked separately.\n\nControl and Development losses accumulate for each commandery against the current cycle's baseline. A later deduction only applies the difference for a higher tier that has not yet been processed. Falling below a tier and returning to it does not repeat the deduction. After 60 months at Tier 1, a new baseline is calculated for the next cycle."
 hd_dc_prosperity_status: "Prosperity: [Situation.MakeScope.Var('hd_dc_prosperity_percent').GetValue|1]/100"
 hd_dc_prosperity_status_tt: "Prosperity records the achievements of restored government. Each era has its own lower and upper bounds, ranging from 0 to 100; both may rise or fall together. Catalysts advance prosperity along the court's preferred path of development or expansion, considering one path at a time. If the court temporarily lacks a ruler, its previous preference remains in use. Changing eras does not reset these values.\n\nThe phase diagram continues to show progress for the original era. The prosperity reading here does not directly change the era; ending separatism still requires the actual territory and duration of stability specified by the conditions."
