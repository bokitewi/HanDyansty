 hd_dc_pressure_status: "Perilous Times: [Situation.MakeScope.Var('hd_dc_pressure_percent').GetValue|1]/100 · Tier [Situation.MakeScope.Var('hd_dc_pressure_band').GetValue|0]"
 hd_dc_pressure_status_tt: "In times of crisis, evaluate the accumulated flaws of the court, retain elements from previous eras, and adjust accordingly for prosperous periods. When catalytic events occur, their costs are calculated based on the current era's conversion rates; separatist regions continue to use values from the crisis era. The five tiers of crisis, along with rewards and penalties for governance, are determined by readings at this location, while catalytic progress in phase diagrams is retained separately. \n\n Control and Development are deducted cumulatively per commandery based on this round's baseline: only if a higher tier remains unaddressed will the difference be deducted subsequently. Once decreased and returning to the same tier, no double deduction occurs; after Tier 1 persists for 60 months, the baseline is recalculated in the next round."
 hd_dc_prosperity_status: "Prosperity: [Situation.MakeScope.Var('hd_dc_prosperity_percent').GetValue|1]/100"
 hd_dc_prosperity_status_tt: "The Prosperity Record reflects the achievements of restoring governance, with separate minimum and maximum values ranging from 0 to 100 for each era; both can rise or fall simultaneously. Catalysts are calculated based on the court's preferred development or expansion path toward prosperity, considering only one direction at a time; when the court is temporarily leaderless, the previous direction continues to apply. Changing eras does not reset values. The \n\n stage map continues to display progress from the original era; the prosperity reading here does not directly switch eras, and separatist withdrawal still requires meeting the conditions of actual territory and stability duration."
