l_english:
 hd_petition_vassalage_interaction:0 "Petition for Vassalage"
 hd_petition_vassalage_interaction_desc:0 "Too weak to stand alone, ask a powerful neighbor to become your liege while keeping your titles and vassals"
 hd_petition_request_notification:0 "My lands are small, my soldiers few, and my generals fewer. In these troubled times, I cannot preserve them alone. Long have I admired your power and virtue. I wish to bring all my followers beneath your banner and serve your house as a loyal vassal for generations. I humbly ask you to receive us."
 hd_petition_accept_summary_tt:0 "They become your vassal, keeping their titles and vassals."
 hd_petition_decline_summary_tt:0 "Refused, they will not petition you again for two years."
 hd_petition_reason_faith:0 "Different faith: $VALUE|=+0$"
 hd_petition_reason_rival:0 "Rivals: $VALUE|=+0$"
 hd_petition_success_title:0 "A Ruler Submits"
 hd_petition_cancelled_title:0 "Petition Withdrawn"
 hd_petition_cancelled_desc:0 "Circumstances changed and the petition came to nothing."
