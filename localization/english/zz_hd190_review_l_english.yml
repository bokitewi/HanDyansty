 hd190.0001.t:0 "Zhang Lu Seizes Hanzhong"
 hd190.0001.desc:0 "In the spring of the second year of Chuping, Zhang Lu, Master of the Five Pecks of Rice, fell upon Nanzheng with Zhang Xiu and killed Su Gu, Administrator of Hanzhong. Zhang Lu then cut the plank roads through the Xie Valley, held Hanzhong for himself, seized Wudu to the west as well, and no longer answered to Liu Yan, Governor of Yizhou.\n\nFrom now on the land between Ba and Han is a realm apart. Zhang Lu teaches the people the Way of spirits and rules through libationers instead of officials."
 hd190.0001.a:0 "Hanzhong goes its own way."
