 game_concept_merit:0 "Merit"
 game_concept_meritorious:0 "Of Eminent Merit"
 game_concept_merit_level:0 "Merit Level"
 game_concept_merit_levels:0 "Merit Levels"
 game_concept_merit_level_desc:0 "[merit_level|E] measures a character's reputation and the ceiling of the offices they may hold, not their current post. It is shown in five grades: County, Commandery, Province, Minister, and Excellency:\n\n$EFFECT_LIST_BULLET$[wj_xianwang_level_xian|E] — County grade\n$EFFECT_LIST_BULLET$[wj_xianwang_level_jun|E] — Commandery grade\n$EFFECT_LIST_BULLET$[wj_xianwang_level_zhou|E] — Province grade\n$EFFECT_LIST_BULLET$[wj_xianwang_level_chao|E] — Minister grade\n$EFFECT_LIST_BULLET$[wj_xianwang_level_gong|E] — Excellency grade\n\nMerit only sets the ceiling for office; qualification for office and the posts themselves must still be obtained separately."
 game_concept_merit_level_impact:0 "Merit Level Impact"
 game_concept_merit_level_impact_desc:0 "Merit Level Impact raises or lowers the [modifiers|E] granted by the current [merit_level|E]."
