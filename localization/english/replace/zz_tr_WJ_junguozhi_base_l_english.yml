 ra_merit_candidacy_merit_desc:0 "[merit|E] is a key measure by which the court weighs candidates for office. Those praised in their home villages may manage a county, those known across commanderies and provinces may bear heavy local responsibilities, and only those famed throughout the realm are fit to be ministers and excellencies.\n\nWhether one is appointed still depends on qualifications, achievements, and the court's decision."
