l_english:
 game_concept_wj_junguozhi_desc:0 "[GetGovernment('celestial_government').GetRuleInfo][GetGovernment('celestial_government').GetFlagInfo]\nThe [wj_junguozhi|E] is the [government_bureaucratic_type|E] [government_form|E] of the Han and Jin. The Son of Heaven presides over the court, and the [liege|E] appoints [wj_guanyuan|E] to govern the localities, divided by granted contract into provinces and commanderies, garrisons, and the Capital Region.\n\nCharacters use [influence|E], [noble_families|E], [family_estates|E] and the [treasury|E]. Independent [rulers|E] have [legitimacy|E], while vassals advance their careers through [merit|E].\n\nScholars enter office through summons, nomination as Filial and Incorrupt, nomination as Flourishing Talent, pure conversation and evaluation; there is no imperial examination. Local [title_men_at_arms|E] are granted by rank, and county-level titles receive none.\n\n#F Commanderies and kingdoms stand side by side, yet power returns to the Son of Heaven. At the center the high ministers assist the government; in the localities provinces and commanderies govern the people by imperial decree.#!"
 game_concept_wj_mingwang_desc:0 "Virtuous Repute springs from a scholar's virtue, reputation and achievements. Pure conversation makes one's learning known, recommendation spreads one's name through court and country, and office and evaluation test one's ability to govern.\n\nThe higher one's [merit|E], the more readily one is esteemed by the court and the literati, and the weightier the offices one may bear; yet however great one's renown, a formal appointment is still required to hold office."
 WJ_XIANWANG_PROGRESS_HEADING:0 "Progress to the Next Esteem Level"
 WJ_failure_7:0 "Must have the Commandery-Kingdom System government"
 celestial_government:0 "Commandery-Kingdom System"
 celestial_vassal:0 "Commandery-Kingdom System"
