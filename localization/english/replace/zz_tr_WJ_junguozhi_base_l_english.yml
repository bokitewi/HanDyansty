 celestial_government_merit_level_0_description:0 "\n\nPure conversation displays one's talent, recommendation spreads one's name, and administration and evaluation reveal one's merit. As reputation grows, the path to office gradually opens."
 set_favored_minister_interaction:0 "Grant Palace Attendant Title"
 set_favored_minister_interaction_desc:0 "Grant [recipient.GetCouncilTitle] [recipient.GetFirstName] the title of Palace Attendant, increasing the share of the [treasury|E] allotted to [recipient.GetHerHis] department and giving [recipient.GetHerHim] the existing benefits."
 favored_minister_court_position:0 "Palace Attendant"
 favored_minister_court_position_desc:0 "The Palace Attendant is a close confidant of the Son of Heaven, coming and going within the forbidden palace to serve as an advisor; the department under their charge accordingly receives a generous allotment of the [treasury|E]."
