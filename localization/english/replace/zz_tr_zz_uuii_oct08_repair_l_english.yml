l_english:
 game_concept_wj_xianwang_level_chao_desc:0 "Famed throughout the realm and esteemed by court and country. Their virtue and record of governance are proven; they may be counted among candidates for the Excellencies and Ministers and entrusted with the court's weighty affairs."
 game_concept_wj_xianwang_level_gong_desc:0 "Revered by all under Heaven and held in high regard by the literati. Outstanding in virtue, achievement and repute, they are fit candidates for chief minister; only once appointed may they take charge of the corresponding duties."
 game_concept_wj_xianwang_level_jun_desc:0 "Their name is heard throughout the commandery and their administration is praised. The worthies and officials of the commandery come to know their talent, and they may be recommended for a commandery post."
 game_concept_wj_xianwang_level_xian_desc:0 "Their talent and conduct are first becoming known, praised by their village. The scholar has won the trust of a locality and may be considered for county affairs; whether they are appointed still rests on the court's command."
 game_concept_wj_xianwang_level_zhou_desc:0 "Esteemed by the literati, their fame fills the province. Their learning and achievements are known throughout the province, enough to place them among candidates for weighty local posts."
 WJ_peer_choose_rank_tt:0 "Settle the rank, then choose the title and fief."
 WJ_peer_choose_place_tt:0 "If it is a province or commandery, look further within; if it is an enfeoffable place, issue the decree of enfeoffment for it."
 WJ_peer_navigation_tt:0 "Leaf through the registers and choose another place."
 WJ_peer_cancel_tt:0 "Set this enfeoffment aside for now; nothing is granted and nothing is spent."
 WJ_peer_rank_desc:0 "You are to settle a peerage for [ROOT.Char.MakeScope.Var('wj_peer_target').Char.GetFirstNameNoTooltip]. Meritorious ministers are ennobled for their deeds; women of the imperial clan are made princesses by kinship. A peerage carries a title and a fief's revenue, but the holder does not govern the land, nor is their existing office changed."
 WJ_peer_pick_desc:0 "The officials spread out maps and registers, listing one by one the provinces, commanderies, and counties still available for enfeoffment. Once the title and fief are chosen, the decree of enfeoffment may be issued."
 WJ_dd_ui_dispatch_own:0 "Dispatch by Name"
 WJ_independent_county_title:0 "County"
 WJ_independent_commandery_title:0 "Commandery"
 WJ_independent_province_title:0 "Province"
 WJ_mt_already_picked_tt:0 "This person has already been chosen for this side; to change, pick someone else or assign them to the other side."
 WJ_mt_different_pair_tt:0 "The transferring party and the receiving party cannot be the same person."
 WJ_miaoshi_text_prompt:0 "Enter the proposed title"
 WJ_miaoshi_text_required_tt:0 "You must first write the proposed title before it can be decreed; if you do not wish to compose one yourself, go back and choose another."
 WJ_miaoshi_back:0 "Back"
 WJ_peer_choose_ting_tt:0 "Choose a township as the fief title, its taxes becoming the fief's revenue."
 WJ_peer_choose_hou_tt:0 "Choose a county as the fief title, its taxes becoming the fief's revenue."
 WJ_peer_choose_county_princess_tt:0 "Choose a county as the princess's title; she draws its taxes but neither holds the land nor takes part in its governance."
 WJ_peer_choose_duchy_princess_tt:0 "Choose a commandery as the princess's title; she draws the revenue of its seat county but neither holds the land nor takes part in its governance."
 WJ_peer_back_tt:0 "Go back a step. No rank has yet been granted, and nothing has been spent."
 game_concept_governor:0 "Official"
 game_concept_governor_possessive:0 "Official's"
 game_concept_governors:0 "Officials"
 game_concept_governors_possessive:0 "Officials'"
 game_concept_governorship:0 "Office"
 game_concept_governorships:0 "Offices"
 game_concept_governor_desc:0 "Officials of a [government_bureaucratic_gov|E] are appointed to govern lands within the [realm|E], handling taxes, the people's welfare and military affairs through their [governor_efficiency|E].\n\nThe [title|E] an official administers, together with its subordinate [counties|E], is called a [province|E]. When [governance_issues|E] arise in the jurisdiction, the official must deal with them.\n\nOfficials can accumulate [influence|E] and take part in the appointment and [succession|E] of other offices."
 game_concept_province:0 "Jurisdiction"
 game_concept_provinces:0 "Jurisdictions"
 game_concept_provincial:0 "Jurisdictional"
 game_concept_province_desc:0 "A [province|E] is a jurisdiction under a [government_bureaucratic_type|E] governed by a [governor|E], comprising its [title|E] and the counties beneath it.\n\nThe jurisdiction's [province_administration|E] determines the focus of governance and affects the efficiency of taxes, military affairs and more."
 game_concept_province_administration:0 "Jurisdiction Administration"
 game_concept_province_administrations:0 "Jurisdiction Administrations"
 game_concept_province_administration_desc:0 "Each [province|E] of a [government_bureaucratic_type|E] [realm|E] sets an administration type according to its duties, agreed between the [liege|E] and the [governor|E].\n\nEach jurisdiction may only use one administration type at a time."
