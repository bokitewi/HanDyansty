l_english:
 # The former kuzhu_admin_recruit_* laws were merged into vanilla celestial army laws on 2026-10-31; names and flavour kept, effect text is vanilla
 celestial_army_liege_law_0: "Local Military Recruitment"
 celestial_army_liege_law_0_subname: "Military and administrative officials across the provinces independently recruit and maintain their own armies, while the central authority retains only nominal command."
 celestial_army_liege_law_1: "Shared Military Administration"
 celestial_army_liege_law_1_subname: "The central authority and local governments share the responsibilities of recruiting troops, funding military operations, and coordinating logistics."
 celestial_army_liege_law_2: "Farmer-Soldier System"
 celestial_army_liege_law_2_subname: "Land supports registered soldiers, who farm and train in peacetime and march to war upon imperial command."
 celestial_army_liege_law_3: "Imperial Guard System"
 celestial_army_liege_law_3_subname: "The elite standing army is directly funded, officered, and commanded by the central authority, making it inaccessible to local forces."
 celestial_army_vassal_law_0_subname: "The monarch delegates the authority to recruit and maintain armies to local officials."
 celestial_army_vassal_law_1_subname: "The monarch and local authorities share responsibility for recruiting troops, funding military operations, and coordinating logistics."
 celestial_army_vassal_law_2_subname: "Land supports registered soldiers, who march to war upon the ruler’s command."
 celestial_army_vassal_law_3_subname: "Military command, funding, and the authority to select generals are all centralized in the capital; local officials are prohibited from intervening independently."
