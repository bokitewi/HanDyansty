 game_concept_obedience_threshold_desc: "The $game_concept_obedience_threshold$ is the score [characters|E] must reach to be considered [obedient|E].\n\nIt depends on several factors: whether they are [close_family|E] of their [overlord|E], a [primary_heir|E], in a [friendship|E] or [rivalry|E], their [traits|E], and whether they belong to your [kurultai|E] or [court|E]. [children|E] become obedient more readily than adults.\n\n[GetGovernment( 'nomad_government' ).GetName] [rulers|E] can still use the #EMP $mpo_desperate_stance_decision$#! [decision|E] to make everyone obedient, or use the #EMP $impose_obedience_intent$#! [intent|E] on a character during [GetActivityType( 'activity_hunt').GetName]. All lieges with access to the obedience system may use the #EMP $mpo_demand_obedience_interaction$#! or #EMP $mpo_negotiate_obedience_interaction$#! [character_interaction|E]."
