 DM_OBEDIENCE_INFLUENCE_OPTION: "Exert Influence"
 DM_OBEDIENCE_INFLUENCE_OPTION_DESC: "Consumes [influence_i|E]60[influence|E], increasing the target's willingness to accept by #P 100#!. Only usable for characters within the same highest territory."
