 game_concept_obedience_threshold_desc: "$game_concept_obedience_threshold$ is the score required for [characters|E] to be regarded as [obedient|E]. \n\n This threshold is influenced by a series of factors: whether it is [overlord|E]'s [close_family|E], whether it is [primary_heir|E], [friendship|E], or [rivalry|E] relationship, [traits|E], and whether it is in your [kurultai|E] or [court|E]. Compared to adults, [children|E] are more likely to be loyal. \n\n[GetGovernment( 'nomad_government' ).GetName][rulers|E] can still make everyone loyal through #EMP $mpo_desperate_stance_decision$#![decision|E], or use #EMP $impose_obedience_intent$#![intent|E] on a character in [GetActivityType( 'activity_hunt').GetName]. All lords with the loyalty mechanism enabled can use #EMP $mpo_demand_obedience_interaction$#! or #EMP $mpo_negotiate_obedience_interaction$#![character_interaction|E]."
