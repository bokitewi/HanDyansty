 WJ_grand_taiwei_law:0 "Grand Commandant"
 WJ_grand_taiwei_law_effects:0 "$EFFECT_LIST_BULLET$The Grand Commandant serves as [grand_secretariat_director|E]. If the office is vacant or its holder cannot serve as regent, another character will temporarily take their place."
