 WJ_grand_chengxiang_law:0 "Chancellor"
 WJ_grand_chengxiang_law_effects:0 "$EFFECT_LIST_BULLET$The Chancellor serves as [grand_secretariat_director|E]. If the Chancellorship has no holder, the quarterly check automatically changes to regency by the General-in-Chief. If there is a holder who cannot serve as regent, another character will temporarily take their place."
