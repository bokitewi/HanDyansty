l_english:
 hd_j16.0200.t:0 "Pleas from Jiangdong"
 hd_j16.0200.desc:0 "Luoyang and Chang'an have fallen one after the other, and the Son of Heaven is a captive of the barbarians, alive or dead no one can say. Again and again the gentry of Jiangdong petition you to take the throne. Wang Dao stands at your side, Wang Dun holds the armies upriver, and all of them await your word. If your standing is not settled soon, the hearts of those who fled south will scatter."
 hd_j16.0200.a:0 "I will take the royal title for now, to hold the realm together."
 hd_j16.0200.b:0 "The Son of Heaven is in exile; I dare not presume."
 hd_j16.0300.t:0 "The Battle of Daling"
 hd_j16.0300.desc:0 "Sima Teng, Duke of Dongying, has sent his general Nie Xuan against you, and the enemy vanguard has reached Daling. In Zuoguo the chieftains of the Five Divisions crowd into your tent, awaiting your command. The princes of Jin are slaughtering one another; the hour for the Xiongnu to rise has come."
 hd_j16.0300.a:0 "Rouse the Five Divisions and meet them at Daling."
 hd_j16.0300.b:0 "Hold the army back and watch."
 hd_j16.0101.t:0 "West with the Emperor"
 hd_j16.0101.desc:0 "Zhang Fang's soldiers are quartered in Luoyang, plundering without restraint, and the city lives in terror. He urges you to carry the Son of Heaven off to Chang'an. Guanzhong is your base, and with the emperor in hand the other princes will not dare to move. Yet once the emperor leaves Luoyang, the whole realm will say you have taken the throne hostage."
 hd_j16.0101.a:0 "Escort the imperial carriage west to Chang'an."
 hd_j16.0101.b:0 "The emperor must not be moved. He stays in Luoyang."
 hd_j16.0102.t:0 "The Carriage Goes West"
 hd_j16.0102.desc:0 "Zhang Fang's men broke into the palace and forced you into a carriage bound for the west. Palace women followed, weeping, while the treasuries were stripped bare. Now that you are in Chang'an, every edict comes from the Prince of Hejian's residence. Only a rump court under Xun Fan and Zhou Fu remains in Luoyang, a government in name alone."
 hd_j16.0102.a:0 "When shall I ever return?"
 hd_j16.0103.t:0 "A Call to Rescue the Emperor"
 hd_j16.0103.desc:0 "The Prince of Hejian holds the Son of Heaven in Guanzhong, and the court's orders now come from his private household. You are a close kinsman of the imperial house and guard the east, and every lord east of the mountains is watching what you do. Wang Jun has offered to send Qi Hong with Xianbei horsemen, and the Prince of Fanyang has already sided with you."
 hd_j16.0103.a:0 "Send out the call to arms and march to rescue the emperor."
 hd_j16.0103.b:0 "Wait and watch for now."
 hd_j16.0104.t:0 "Remnants of Ye"
 hd_j16.0104.desc:0 "The Prince of Chengdu has lost Ye, and his old followers have scattered. Gongshi Fan has gathered tens of thousands in Zhao and Wei, rising in the prince's name to avenge him. The herdsman-captain Ji Sang has also come to you with his men, asking you to rise with them."
 hd_j16.0104.a:0 "Join Gongshi Fan together with Ji Sang."
 hd_j16.0104.b:0 "Answer to no one and go your own way."
 hd_j16.0105.t:0 "The Struggle for Xuchang"
 hd_j16.0105.desc:0 "Sima Xiao, Prince of Fanyang, holds Xuchang and has gone over to the Prince of Donghai. A letter has come from the Prince of Hejian: take Yingchuan, and he will memorialize the throne to give you Yuzhou. But the Liu Kun brothers are in Xuchang, and their cavalry from You Province will be hard to beat."
 hd_j16.0105.a:0 "Side with the Prince of Hejian and attack Xuchang."
 hd_j16.0105.b:0 "Back neither side and hold your ground."
 hd_j16.0106.t:0 "The Head of Zhang Fang"
 hd_j16.0106.desc:0 "The eastern armies draw closer by the day. One adviser has a plan: the whole realm lays the blame on Zhang Fang, so behead him, send his head to the Prince of Donghai, and peace can be made. But Zhang Fang has served you for years, and most of the troops in Guanzhong answer to him."
 hd_j16.0106.a:0 "Behead Zhang Fang and send his head with an offer of peace."
 hd_j16.0106.b:0 "Spare him and fight on with his army."
 hd_j16.0107.t:0 "Return to Luoyang"
 hd_j16.0107.desc:0 "Guanzhong is pacified and the Son of Heaven is in your camp. Your generals say he should be escorted back to Luoyang to reassure the realm. Others advise you to keep him in Chang'an for now, so you can hold Guanzhong close."
 hd_j16.0107.a:0 "Escort him back to Luoyang and take charge of the court."
 hd_j16.0107.b:0 "Keep the emperor in Chang'an for now."
 hd_j16.0108.t:0 "Prisoner at Dunqiu"
 hd_j16.0108.desc:0 "You were taken in flight by Feng Song, Grand Administrator of Dunqiu, and sent under guard to Ye. The Prince of Fanyang is dead, and his chief clerk Liu Yu fears your old followers in Ye will rally to you. He is preparing a forged edict that orders you to die. One of your guards is willing to let you slip away tonight."
 hd_j16.0108.a:0 "It has come to this. I will bare my neck."
 hd_j16.0108.b:0 "Escape in the night and go to Shi Le."
 hd_j16.0110.t:0 "Before the Walls of Ye"
 hd_j16.0110.desc:0 "Sima Teng, Prince of Dongyan, has moved to Ye. His storehouses are full, but he is stingy with rewards and his soldiers resent him. Ji Sang asks to march straight on Ye, claiming to avenge the Prince of Chengdu."
 hd_j16.0110.a:0 "Attack Ye."
 hd_j16.0110.b:0 "The time is not yet right. Hold back."
 hd_j16.0111.t:0 "Sending a General in Pursuit"
 hd_j16.0111.desc:0 "Ji Sang has stormed Ye, burned its palaces and killed the Prince of Dongyan, and all of Hebei is shaken. Gou Xi, a gifted commander in your service known as the Butcher, asks to lead his own troops after him."
 hd_j16.0111.a:0 "Send Gou Xi after Ji Sang."
 hd_j16.0111.b:0 "Hold off for now."
 hd_j16.0112.t:0 "A Commandery for Merit"
 hd_j16.0112.desc:0 "Gou Xi has chased Ji Sang from victory to victory, and Hebei is largely pacified. The Prince of Donghai memorializes the throne, asking that Dong Commandery be given to Gou Xi so that he can hold Yan Province."
 hd_j16.0112.a:0 "Granted. Dong Commandery goes to Gou Xi."
 hd_j16.0112.b:0 "His merit does not reach so far. No commandery."
 hd_j16.0113.t:0 "Purging the Emperor's Side"
 hd_j16.0113.desc:0 "Miu Bo, Miu Yin and others close to the Son of Heaven enjoy his full trust, and you suspect them of plotting against you. You have already brought troops into the capital. A single order would see them seized and beheaded before the emperor's eyes."
 hd_j16.0113.a:0 "Seize Miu Bo and the others and behead them on the spot."
 hd_j16.0113.b:0 "Let it pass for now."
 hd_j16.0114.t:0 "Arrests Before the Throne"
 hd_j16.0114.desc:0 "The Prince of Donghai marched troops into the palace and, before your very eyes, seized Miu Bo, Miu Yin and a dozen others and put them to death. All you could do was watch, unable to say a word."
 hd_j16.0114.a:0 "What kind of sovereign am I?"
 hd_j16.0116.t:0 "Ningping"
 hd_j16.0116.desc:0 "The Prince of Donghai has died at Xiang. Wang Yan and the others are escorting his coffin east, more than a hundred thousand soldiers, officials and members of the imperial clan with them, and none of them on guard. Your horsemen have caught up with them at Ningping."
 hd_j16.0116.a:0 "Surround them and shoot them down to the last man."
 hd_j16.0116.b:0 "Let them pass."
 hd_j16.0117.t:0 "The Rising in Donglai"
 hd_j16.0117.desc:0 "You rose with Liu Bogen in Donglai and raided across Qing and Xu, leaving the Jin armies struggling to keep up. Since Liu Bogen fell in battle, most of his followers have melted away. Now Liu Yuan, King of Han, has sent envoys inviting you to submit, with promises of office and rank."
 hd_j16.0117.a:0 "Go west and join the King of Han."
 hd_j16.0117.b:0 "Stay in the lands of Jin."
 hd_j16.0118.t:0 "Liang Province Answers the Call"
 hd_j16.0118.desc:0 "The capital is under siege. The Son of Heaven has called again and again for troops, yet few have answered from anywhere in the realm. Beigong Chun asks to lead the soldiers of Liang Province east to the emperor's aid."
 hd_j16.0118.a:0 "Send Beigong Chun east, with gold and silk besides."
 hd_j16.0118.b:0 "Liang Province is too far. We can only defend ourselves."
 hd_j16.0700.t:0 "The Contest for Imperial Heir"
 hd_j16.0700.desc:0 "The Son of Heaven has no grown son, and the succession is still unsettled. The Princes of Chengdu, Yuzhang and Qinghe each have their backers, and one of them must be chosen soon."
 hd_j16.0700.a:0 "Name Ying, Prince of Chengdu, Imperial Heir."
 hd_j16.0700.b:0 "Name Chi, Prince of Yuzhang, Imperial Heir."
 hd_j16.0700.c:0 "Restore Tan, Prince of Qinghe."
 hd_j16.0701.t:0 "A Petition for the Succession"
 hd_j16.0701.desc:0 "A prince of the imperial clan has petitioned to be named heir himself, arguing that in times of great disorder the realm needs a ruler of mature years. Whether you accept or refuse, someone will be offended."
 hd_j16.0701.a:0 "Grant his request."
 hd_j16.0701.b:0 "The succession is already decided."
 hd_j16.0702.t:0 "A Request to Hold Ye"
 hd_j16.0702.desc:0 "Year after year of famine have left Bing Province overrun with bandits. Its lord asks to lead his Qihuo host east to Ye in search of food, and asks the court to give him Wei Commandery to hold."
 hd_j16.0702.a:0 "Allow him to move to Ye."
 hd_j16.0702.b:0 "Ye is not to be handed out lightly."
 hd_j16_ruchao_decision:0 "Enter the Court as Regent"
 hd_j16_ruchao_decision_desc:0 "The Son of Heaven lives deep within the palace, and every prince wants to be the one who runs his court. Whoever has the strength and holds the capital can enter the court as regent and command the realm in the emperor's name."
 hd_j16_ruchao_decision_tooltip:0 "You become a vassal of the Son of Heaven and run the court as his regent. The current regent loses his offices, and if he was once a tributary prince he returns to his fief and resumes tribute. The other princes will resent you."
 hd_j16_ruchao_decision_confirm:0 "To the court!"
 hd_j16_ruchao_reach_tt:0 "The capital, or the county where the emperor stays, is within your realm; or there is no regent and your realm holds a county in the capital's commandery"
 hd_j16_ruchao_army_tt:0 "Your military strength is at least that of the current regent"
 hd_j16_ruchao_cd_tt:0 "You have only recently returned to your fief"
 hd_j16_chuzhen_decision:0 "Return to the Fief"
 hd_j16_chuzhen_decision_desc:0 "Resentment at court runs deep, and a prince's real strength lies in his fief. Step down from the court, go home, and serve the Son of Heaven as a tributary prince once more."
 hd_j16_chuzhen_decision_tooltip:0 "You give up the regency and your court offices, return to your fief with your vassals, and become a tributary of the Son of Heaven again. You cannot enter the court again for three years."
 hd_j16_chuzhen_decision_confirm:0 "Return home."
 hd_j16_chuzhen_defending_tt:0 "You are not fighting a defensive war"
 hd_j16_xiqian_decision:0 "Move the Emperor West"
 hd_j16_xiqian_decision_desc:0 "While the capital lies outside your own base, you will always be at others' mercy. Move the Son of Heaven to your seat, and the other princes will find it much harder to interfere."
 hd_j16_xiqian_decision_tooltip:0 "The capital moves to your capital county and the emperor goes with it, suffering the effects of Imperial Exile. The other princes will be displeased with you."
 hd_j16_xiqian_decision_confirm:0 "Move the capital!"
 hd_j16_xiqian_same_tt:0 "The capital is not yet in your capital county"
 hd_j16_chuanxi_decision:0 "Call to Rescue the Emperor"
 hd_j16_chuanxi_decision_desc:0 "The regent holds the Son of Heaven captive and rules the court as he pleases. Send out the call to arms and summon the princes to rescue the emperor together."
 hd_j16_chuanxi_decision_tooltip:0 "You end your tribute to the Son of Heaven, declare war on the emperor and his regent, and raise eight thousand event troops. Princes on bad terms with the regent may rise to join you. The war targets the commandery of the capital; if that commandery also holds land of the emperor's own domain or of other princes, it targets the commandery of the regent's seat instead. This war is fought to take charge of the court, so victory seizes no land. If there is nowhere to fight, no war begins and your prestige is refunded."
 hd_j16_chuanxi_decision_confirm:0 "Send out the call!"
 hd_j16_chuanxi_cd_tt:0 "You have sent out a call to arms recently"
 hd_j16_huanluo_decision:0 "Return the Emperor to Luoyang"
 hd_j16_huanluo_decision_desc:0 "Luoyang is the old capital and home of the ancestral temples. Only when the Son of Heaven is back there will the realm be at ease."
 hd_j16_huanluo_decision_tooltip:0 "The capital moves back to Luoyang and the emperor with it. If you are not yet regent, you also enter the court to take charge."
 hd_j16_huanluo_decision_confirm:0 "Back to Luoyang!"
 hd_j16_huanluo_luoyang_tt:0 "Luoyang is held by you or by the emperor's side"
 hd_j16_taidi_decision:0 "The Contest for Imperial Heir"
 hd_j16_taidi_decision_desc:0 "The Son of Heaven has no grown son and the succession hangs unresolved. The emperor or his regent may name the heir outright, and the candidates may petition to be chosen."
 hd_j16_taidi_decision_tooltip:0 "Emperor or regent: choose the heir from the Princes of Chengdu, Yuzhang and Qinghe. Candidate: petition the emperor, or the regent answering for him, to name you. Those passed over will resent whoever decides."
 hd_j16_taidi_decision_confirm:0 "Settle the succession!"
 hd_j16_taidi_noson_tt:0 "The Son of Heaven has no grown son"
 hd_j16_taidi_two_tt:0 "At least two of the Princes of Chengdu, Yuzhang and Qinghe are alive"
 hd_j16_qihuo_decision:0 "Take In the Qihuo"
 hd_j16_qihuo_decision_desc:0 "Famine has driven the people of Bing Province onto the roads in great bands that call themselves Qihuo, those who beg to live. Turn them into an army, and you will both settle the refugees and strengthen your forces."
 hd_j16_qihuo_decision_tooltip:0 "Raise five thousand Qihuo troops at your capital (not inheritable). If you hold a commandery of Bing Province while Ye is without a lord or belongs to the emperor, the emperor may grant you Wei Commandery."
 hd_j16_qihuo_decision_confirm:0 "Enlist them!"
 hd_j16_mengchen_modifier:0 "Imperial Exile"
 hd_j16_mengchen_modifier_desc:0 "The Son of Heaven has been forced out of his capital and wanders abroad, his authority badly damaged."
 hd_j16_yegong_burned_modifier:0 "Palaces of Ye Burned"
 hd_j16_yegong_burned_modifier_desc:0 "Rampaging troops have burned the palaces of Ye, and the city is badly weakened."
 hd_j16_zhuanheng_modifier:0 "Overbearing"
 hd_j16_zhuanheng_modifier_desc:0 "Killing the emperor's confidants in front of him has left court and country looking on in fear."
 hd_j16_zhuanshan_opinion:0 "Seized Control of the Court"
 hd_j16_chuzhen_opinion:0 "Stepped Down and Returned Home"
 hd_j16_xiqian_opinion:0 "Moved the Emperor West"
 hd_j16_taidi_opinion:0 "Passed Over for the Succession"
 hd_j16_qingjun_opinion:0 "Killings Before the Throne"
 hd_j16_zhangfang_spared_opinion:0 "Shielded Zhang Fang"
 hd_j16_yingjia_army_name:0 "Army of Donghai"
 hd_j16_xianbei_army_name:0 "Xianbei Horsemen"
 hd_j16_shile_army_name:0 "Shi Le's Riders"
 hd_j16_ying_army_name:0 "Chengdu Loyalists"
 hd_j16_xuchang_army_name:0 "Liu Qiao's Army"
 hd_j16_youzhou_army_name:0 "You Province Cavalry"
 hd_j16_zhangfang_army_name:0 "Zhang Fang's Troops"
 hd_j16_poye_army_name:0 "Ji Sang's Army"
 hd_j16_gouxi_army_name:0 "Gou Xi's Army"
 hd_j16_qihuo_army_name:0 "Qihuo"
 hd_j16_wangmi_army_name:0 "Wang Mi's Army"
 hd_j16_liangzhou_army_name:0 "Troops of Liang"
 hd_j16.0201.t:0 "The Lonely City of Chang'an"
 hd_j16.0201.desc:0 "Years of famine have emptied Guanzhong. In Chang'an a measure of grain costs its weight in gold, Emperor Min's guard numbers fewer than a thousand, and Qu Yun and Suo Lin are pulling down houses for firewood. An edict from Pingyang says that if you march west, the lonely city will not last the winter."
 hd_j16.0201.a:0 "Raise every soldier east of the passes and take Chang'an."
 hd_j16.0201.b:0 "Chang'an is not worth the trouble yet. Wait for next year."
 hd_j16.0202.t:0 "Clearing the Sovereign's Side"
 hd_j16.0202.desc:0 "Liu Wei and Diao Xie whisper day and night in the emperor's ear, urging him to strip the Wang clan of its armies. You hold Wuchang and command the upper Yangtze, and Qian Feng urges you to sail east: march on Shitou in the name of killing Liu Wei, and who under heaven would dare refuse you?"
 hd_j16.0202.a:0 "Send word to Jiankang and sail east to punish Liu Wei."
 hd_j16.0202.b:0 "A subject must not cross his lord. Bear it for now."
 hd_j16.0203.t:0 "Punishing Wang Dun"
 hd_j16.0203.desc:0 "Wang Dun has camped at Gushu and made himself Governor of Yang, and every matter at court must first be reported to his headquarters. He is ill, yet Qian Feng and Shen Chong are moving troops in his name. Xi Jian and Wen Qiao both urge you to strike while he lies sick, for one battle could settle it."
 hd_j16.0203.a:0 "Issue the edict against the rebel and lead the army yourself."
 hd_j16.0203.b:0 "The court has too few troops. Endure a while longer."
 hd_j16.0204.t:0 "The Mutiny at Liyang"
 hd_j16.0204.desc:0 "Yu Liang insists on summoning you to court as Minister of Agriculture. It is called a promotion, but it would take away your troops. The refugees under you have followed you for over ten years and would have nowhere to go without you. Zu Yue in Shouchun is just as angry and waits only for you to move first."
 hd_j16.0204.a:0 "Rise in the name of killing Yu Liang and cross the river."
 hd_j16.0204.b:0 "Obey the summons and accept whatever comes."
 hd_j16.0205.t:0 "The Command of Jing"
 hd_j16.0205.desc:0 "The minister who held Jing Province has died. Jing sits on the upper Yangtze, rich in soldiers and grain, and the court has always worried about it most. The court has put forward a successor and asks for your decision."
 hd_j16.0205.a:0 "Approve the proposal and send him to take command."
 hd_j16.0205.b:0 "I will keep Jing in my own hands."
 hd_j16.0301.t:0 "Palace Coup"
 hd_j16.0301.desc:0 "The late emperor's coffin has not yet been buried when Jin Zhun storms into the Hall of Radiant Light with his soldiers. In the days you spent among the palace women, he had already put his own men at every gate and over the guard.\n\nHe stands below the steps with his hand on his sword and asks you to yield the throne. Hand over the seals and you may keep your life; refuse, and it will come to war between you."
 hd_j16.0301.a:0 "All is lost. Hand over the seals and keep my life."
 hd_j16.0301.b:0 "How dare this traitor! Rally the princes and destroy the Jin clan!"
 hd_j16.0302.t:0 "A New Name: Zhao"
 hd_j16.0302.desc:0 "Pingyang lies in ruins and the Jin rebels have only just been put to death. Your ministers ask you to make Chang'an the capital and to change the dynasty's name, since the heirs of the Xiongnu chanyus no longer need to borrow the name of the Liu Han. You were once enfeoffed as Prince of Zhongshan, and Zhongshan lies in the old lands of Zhao, so let it be called Zhao."
 hd_j16.0302.a:0 "Make Chang'an the capital and name the state Zhao."
 hd_j16.0302.b:0 "The name of Han must not be thrown away lightly."
 hd_j16.0303.t:0 "Liu Yao Comes West"
 hd_j16.0303.desc:0 "Liu Yao claims an army of two hundred and eighty thousand, and his camps stretch a hundred li along the Yellow River. All of Hexi is shaken. Adjutant Ma Ji urges you to march out against him, while others say that Liang is far away and a pledge of tribute would keep the province safe."
 hd_j16.0303.a:0 "Send envoys to submit as a tributary and keep the land at peace."
 hd_j16.0303.b:0 "Hold the river line and never kneel to him."
 hd_j16.0304.t:0 "The Siege of Jinyong"
 hd_j16.0304.desc:0 "Liu Yao has surrounded Jinyong with his main army, Shi Sheng is trapped inside awaiting relief, and all of Hebei is shaken. Cheng Xia and others urge you not to move rashly, but you see Liu Yao sitting before strong walls and drinking every day, and you judge this the moment to take him."
 hd_j16.0304.a:0 "Lead the army yourself straight to Luoyang."
 hd_j16.0304.b:0 "Stay behind the walls and wait for him to wear himself out."
 hd_j16.0305.t:0 "The Embers of Shanggui"
 hd_j16.0305.desc:0 "Liu Yao has been defeated and captured. The Zhao crown prince Liu Xi and the Prince of Nanyang Liu Yin have abandoned Chang'an and fled to Shanggui. Guanlong is restless, and now is the time to sweep it clean."
 hd_j16.0305.a:0 "Send the army west and take Shanggui."
 hd_j16.0305.b:0 "Do not chase a cornered enemy."
 hd_j16.0351.t:0 "Rains at Gepi"
 hd_j16.0351.desc:0 "Your army camped at Gepi meaning to march south on Jianye, but three months of heavy rain have brought hunger and plague, and more than half your men have died. Zhang Bin advises that Ye has the strength of its three terraces and Xiangguo is guarded by mountains, so it would be better to turn north and build your power in Hebei."
 hd_j16.0351.a:0 "Follow Zhang Bin's plan and hold Xiangguo in the north."
 hd_j16.0351.b:0 "A true man settles the south in one battle!"
 hd_j16.0352.t:0 "A False Surrender at Ji"
 hd_j16.0352.desc:0 "Wang Jun believes the Mandate of Heaven is his and is thinking of declaring himself emperor. Zhang Bin proposes a plan: send humble words and rich gifts, submit a memorial calling yourself his subject, and Wang Jun is sure to believe it. When he opens his gates to welcome you, you can seize him at a stroke."
 hd_j16.0352.a:0 "Carry out the plan and strike Ji with light cavalry."
 hd_j16.0352.b:0 "The plan is too dangerous. Drop it."
 hd_j16.0353.t:0 "Taking Bing Province"
 hd_j16.0353.desc:0 "Liu Kun has been trapped in Jinyang for years. His followers have scattered, and the Tuoba reinforcements have gone home because of their own civil strife. Ji Dan urges him to dig deep and wait, but Liu Kun is determined to give battle. Bing Province is there for the taking."
 hd_j16.0353.a:0 "March north and take Jinyang."
 hd_j16.0353.b:0 "Leave the north alone for now."
 hd_j16.0354.t:0 "King of Zhao"
 hd_j16.0354.desc:0 "Liu Yao has set up his own court and moved it to Chang'an. Zhang Bin and Cheng Xia lead the officials in petitioning you to claim the twenty-four commanderies of Hebei, take the title King of Zhao, and answer to no one."
 hd_j16.0354.a:0 "Take the throne as King of Zhao."
 hd_j16.0354.b:0 "Keep serving the Han calendar."
 hd_j16.0355.t:0 "The Siege of Yanci"
 hd_j16.0355.desc:0 "Duan Pidi has killed Liu Kun and lost everyone's trust, and has fled to Yanci to shelter with Shao Xu. Shi Hu asks to lead the campaign: once Yanci falls, no one between You and Ji will be able to stand against you."
 hd_j16.0355.a:0 "Send Shi Hu to war."
 hd_j16.0355.b:0 "The Duan are no longer a threat."
 hd_j16.0356.t:0 "Ascending the Throne"
 hd_j16.0356.desc:0 "The Former Zhao is destroyed, and Guanlong and Hebei are all in your hands. Your ministers have urged you again and again to take the imperial throne and change the era name to Jianping. Others say it would show more humility to call yourself Heavenly King first while exercising an emperor's powers."
 hd_j16.0356.a:0 "Take the imperial throne and change the era to Jianping."
 hd_j16.0356.b:0 "Take the title Heavenly King and rule as an emperor."
 hd_j16.0357.t:0 "The Regency"
 hd_j16.0357.desc:0 "Shi Hu enters the palace with his soldiers, lays the seals before you, and asks you to yield the throne. Every official at court stares at the floor, and not one of them speaks.\n\nIf you abdicate, you may live on as a commoner. If you refuse, Shi Hu will return to his garrison and raise his army, and kinsmen will meet on the battlefield."
 hd_j16.0357.a:0 "There is no other way. I abdicate to save my life."
 hd_j16.0357.b:0 "I will not hand my father's realm to another!"
 hd_j16.0358.t:0 "The Campaign of Lingzhi"
 hd_j16.0358.desc:0 "Duan Liao has raided the border again and again and has also made enemies of the Murong. Now both sides want the Duan destroyed, and an agreement to attack together could take Lingzhi in a single campaign."
 hd_j16.0358.a:0 "Send the army against the Duan."
 hd_j16.0358.b:0 "There is no need for a distant campaign."
 hd_j16_junziying_modifier:0 "Camp of Gentlemen"
 hd_j16_junziying_modifier_desc:0 "Scattered scholars and officials have been gathered into a camp of their own and treated with courtesy, with Zhang Bin as chief adviser."
