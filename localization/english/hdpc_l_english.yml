l_english:
 hdpc_soft_pressure_modifier:0 "Temporarily reside among the common people"
 hdpc_soft_pressure_modifier_desc:0 "Temporarily placed in the character pool during population regulation. This fertility adjustment lasts for a maximum of ten years; it is lifted upon returning to the court, assuming office, or entering a protected area at the next annual maintenance. This adjustment does not deduct health and does not directly cause death."
 hdpc_high_pressure_modifier:0 "Postpone family expansion"
 hdpc_high_pressure_modifier_desc:0 "Temporary fertility adjustment applied when a character's population exceeds the regulatory target. This effect can last up to ten years and may be lifted early due to reassignment or similar circumstances. This adjustment does not cause permanent infertility, alter traits, or directly kill characters."
 hdpc.9000.t:0 "Character Count Adjustment: Statistical Report"
 hdpc.9000.desc:0 "#bold  Current census #!\n total living characters: [GetGlobalVariable('hdpc_living').GetValue|0]\n number of characters in the character pool: [GetGlobalVariable('hdpc_pooled').GetValue|0]\n number of rulers: [GetGlobalVariable('hdpc_rulers').GetValue|0]\n\n#bold  most recent regulation round #!\n completed rounds: [GetGlobalVariable('hdpc_cycles').GetValue|0]\n court departure budget: [GetGlobalVariable('hdpc_move_budget').GetValue|0]\n actual court departures: [GetGlobalVariable('hdpc_moved_last').GetValue|0]\n unused budget: [GetGlobalVariable('hdpc_unfilled_last').GetValue|0]\n failed movements: [GetGlobalVariable('hdpc_failed_last').GetValue|0]\n inspect the palace: [GetGlobalVariable('hdpc_courts_last').GetValue|0]\n selected candidates: [GetGlobalVariable('hdpc_candidates_last').GetValue|0]\n still affected by temporary fixes from last maintenance: [GetGlobalVariable('hdpc_managed_count').GetValue|0]\n\n years passed since the previous round's annual pulse: [GetGlobalVariable('hdpc_years_elapsed').GetValue|0] / 10\n pause flag: [GetGlobalVariable('hdpc_disabled').GetValue|0] (0 running, 1 paused) \n\n target is 8,000–11,000; only processed when the census in a ten-year round exceeds 10,000. Characters moved into the character pool do not immediately reduce the total living count. This report refreshes the census only and does not execute cleanup."
 hdpc.9000.a:0 "Close"
