l_english:
 hdpc_soft_pressure_modifier:0 "Temporarily Outside Court"
 hdpc_soft_pressure_modifier_desc:0 "This character has temporarily entered the character pool during population management. The fertility adjustment lasts no more than ten years. If the character returns to court, takes office, or enters a protected area, it is removed at the next annual maintenance. It does not reduce Health or directly cause death."
 hdpc_high_pressure_modifier:0 "Delayed Family Expansion"
 hdpc_high_pressure_modifier_desc:0 "A temporary fertility adjustment applied when the local character population exceeds its management target. It lasts no more than ten years and may end earlier after a transfer or similar change. It does not cause permanent infertility, change traits, or directly cause death."
 hdpc.9000.t:0 "Character Population: Statistical Report"
 hdpc.9000.desc:0 "#bold Current Census#!\nLiving characters: [GetGlobalVariable('hdpc_living').GetValue|0]\nCharacters in the pool: [GetGlobalVariable('hdpc_pooled').GetValue|0]\nRulers: [GetGlobalVariable('hdpc_rulers').GetValue|0]\n\n#bold Latest Annual Cleanup#!\nCompleted cycles: [GetGlobalVariable('hdpc_cycles').GetValue|0]\nAnnual death limit: [GetGlobalVariable('hdpc_death_budget').GetValue|0]\nCharacters removed: [GetGlobalVariable('hdpc_killed_last').GetValue|0]\nUnattached characters removed: [GetGlobalVariable('hdpc_pool_killed_last').GetValue|0]\nIdle nomadic and tribal courtiers removed: [GetGlobalVariable('hdpc_court_killed_last').GetValue|0]\nFailed death processing: [GetGlobalVariable('hdpc_failed_last').GetValue|0]\nCourts checked: [GetGlobalVariable('hdpc_courts_last').GetValue|0]\nCandidates selected: [GetGlobalVariable('hdpc_candidates_last').GetValue|0]\n\nCleanup status: [GetGlobalVariable('hdpc_active').GetValue|0] (0: stopped, 1: enabled)\nPause flag: [GetGlobalVariable('hdpc_disabled').GetValue|0] (0: running, 1: paused)\n\nAnnual cleanup begins above 10,000 living characters and stops at 8,000. Above 11,000, the annual limit rises from 300 to 600. Idle lowborn characters in the pool are processed first, followed by idle lowborn courtiers in nomadic and tribal courts. Unattached characters aged 30–49 have an additional annual death chance of 10%; those aged 50 or above have a 25% chance. The corresponding chances in the two types of court are 15% and 30%. These chances are constrained by the annual limit, the population cutoff, and the minimum number of courtiers to retain. Historical characters, players and their close kin, rulers, heirs, officeholders, and other protected characters are exempt. This report refreshes the census only; it does not carry out cleanup."
 hdpc.9000.a:0 "Close"
