l_english:
 hd_peasant_army.0001.t: "The Villagers Come"
 hd_peasant_army.0001.desc: "For days now, families have been gathering outside the camp gates, carrying hoes and sharpened bamboo. They say the great houses took their fields and the county taxes left them nothing. They have heard that [ROOT.Char.GetFirstName] was born poor and does not prey on the villages, and they want to follow. Counted up, they make a whole new company."
 hd_peasant_army.0001.a: "Enlist them all. We eat from one pot."
 hd_peasant_army.0001.a.tt: "#P Villagers gather into a new army#! (levies = Diplomacy × Stewardship × 5, plus 1 regiment of militia pikemen)"
 hd_peasant_army_troops_name: "Righteous Villagers"
 hd_peasant_army_siege_toast: "The Villagers Join Us"
