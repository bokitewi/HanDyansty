l_english:
 hd_peasant_army.0001.t: "Villagers Join Your Cause"
 hd_peasant_army.0001.desc: "For days, people have been arriving outside the camp gates with their children and elderly kin. Some carry hoes; others have only sharpened bamboo poles. At the sight of your banner they kneel, saying that local magnates took their fields long ago and the county's taxes have made life unbearable.\n\nThey say they have heard that [ROOT.Char.GetFirstName] also came from poverty and does not mistreat the common people. They wish to follow you in search of a way to survive. When the count is finished, there are enough to form another unit."
 hd_peasant_army.0001.a: "Enlist them all. We will share the same pot of rice."
 hd_peasant_army.0001.a.tt: "#P The villagers form an army and join your cause#! (troops = Diplomacy × Stewardship × 5, plus 1 regiment of militia spearmen)"
 hd_peasant_army_troops_name: "Volunteer Village Militia"
 hd_peasant_army_siege_toast: "Villagers Join Your Cause"
