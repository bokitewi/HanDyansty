 building_type_jiaodong_golden_mines_01: "Jiaodong Gold Mine"
 building_type_jiaodong_golden_mines_01_desc: "The rolling hills around Donglai and Jiaodong yield flecks of gold in the sand of their streams. Local people venture into the mountains together, cutting rock and washing sand. Each find may be tiny, but over time the gold adds up to a considerable amount."
 building_type_Xinglong_golden_mines_01: "Jin Mine in Xinglong, Hebei"
 building_type_Xinglong_golden_mines_01_desc: "Deep in the Yan Mountains north of Yuyang, veins of gold lie hidden in the valleys. Miners cut rock to gather sand and wash it repeatedly beside the streams, occasionally finding solid pieces of gold."
 building_type_lishui_golden_mines_01: "Lishui Gold Mine"
 building_type_lishui_golden_mines_01_desc: "Gold is found in the waters of Lishui in southern Jing Province, its grains revealed by washing the sand. Han Feizi wrote that many people here mined gold-bearing sand privately. Although the authorities strictly forbade it, offenders continued to come in an unbroken stream."
 building_type_yaan_golden_mines_01: "Yaan Rongjing Gold Mine"
 building_type_yaan_golden_mines_01_desc: "Among the mountains of Yandao County in Shu Commandery, swift streams carry sand containing flecks of gold. Emperor Xiaowen once granted Yandao's copper mountain to Deng Tong for minting coins, a sign of the rich mineral resources long prized by the people of Shu."

 building_type_jiaodong_crystal_mines_01: "Crystal Agate Jade Mine"
 building_type_jiaodong_crystal_mines_01_desc: "These mountains yield crystal, agate, and fine jade, all clear and lustrous. Craftsmen carve them into cups, belt hooks, and ornaments, which nobles eagerly compete to buy."
