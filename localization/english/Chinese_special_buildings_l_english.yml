 building_type_xibeiyanchi_salt_mines_01: "Salt Pool"
 building_type_xibeiyanchi_salt_mines_01_desc: "Salt pools are widely distributed in the northwest of Zongzhou and are known as Rong salt."
 building_type_bashu_salt_mines_01: "Ba-Shu Salt Wells"
 building_type_bashu_salt_mines_01_desc: "The salt wells in the Bashu region have been developed and utilized by locals since the Xia and Shang dynasties, with brine salt being the primary form of salt."
 building_type_liaodong_salt_mines_01: "Liaodong Salt Farm"
 building_type_liaodong_salt_mines_01_desc: "The Liaodong salt fields, due to their rugged coastal terrain, feature only small-scale operations; while sea salt production is limited, the quality is superior."
 building_type_jiaodong_salt_mines_01: "Jiaodong Salt Field"
 building_type_jiaodong_salt_mines_01_desc: "The Jiaodong salt fields are mainly distributed in rocky bays, with small areas and low yields, but it is better than having none."
 building_type_lubei_salt_mines_01: "Lubei Salt Region"
 building_type_lubei_salt_mines_01_desc: "The area around Laizhou Bay is rich in extensive brine layers, with salt content four to five times higher than seawater. Salt production in this region began developing as early as the Shang Dynasty."
 building_type_wuyue_salt_mines_01: "Wu-Yue Haiyan District"
 building_type_wuyue_salt_mines_01_desc: "The Wu-Yue Haiyan District produces vast quantities of sea salt, as it has long been said that \"the east is rich in sea salt.\""

 building_type_Jixiaxuegong_01: "Jixia Academy"
 building_type_Jixiaxuegong_01_desc: "The Jixia Academy integrates academia, politics, and education, widely recruiting scholars from all regions with the aim of \"elevating the virtuous and honoring merit.\" Here gather numerous schools of thought, and academic assemblies are held regularly; the academic ideas embodied therein will greatly promote universal intellectual progress."
 building_type_zhanghuagong_01: "Zhanghua Terrace"
 building_type_zhanghuagong_01_desc: "Fish-scale roofs and dragon halls, purple abalone gates and vermilion palaces."
 building_type_zhugong_01: "Zhugong"
 building_type_zhugong_01_desc: "Zhugong is situated southeast of the capital Ying, serving both to monitor shipping on the Han and Yangtze Rivers and as a residence for imperial inspections in the south, while also fulfilling political and military functions."
 building_type_gusugong_01: "Gusu Terrace"
 building_type_gusugong_01_desc: "The Gusu Terrace stands three hundred zhang high and eighty-four zhang wide, with a winding nine-bend path leading up its steps. From atop this towering platform, one can enjoy the breathtaking scenery of lakes and mountains and pastoral landscapes within a radius of two hundred li, unmatched in southern Jiangnan and renowned throughout the world. Surrounding the terrace are planted flowers that bloom in all four seasons and fruits harvested at each of the eight solar terms, spanning five li in length. Additionally, spirit halls were constructed, a celestial pool excavated, rivers dredged, dragon boats built, and hunting grounds enclosed, all to provide the monarch with endless leisure and pleasure."
 building_type_zhouwanggong_01: "King Zhou's Palace"
 building_type_zhouwanggong_01_desc: "The majestic halls stand tall in grandeur, complemented by winding corridors that reflect the imperial majesty of the Son of Heaven."

 building_type_hulaoguan_01: "Hulao Pass"
 building_type_hulaoguan_01_desc: "Also known as Fan Water Pass, located in Fanshui Town, Xingyang City, Henan Province, first constructed during the Qin Dynasty. It was named Hulao due to legends that King Mu of Zhou raised a fierce tiger brought as tribute here; during the Tang Dynasty, it was also called Wulao Pass to avoid taboo associated with Li Hu, the grandfather of Emperor Gaozu. Situated south of Mount Song and north of the Yellow River, this strategic pass lies at the vital junction between east and west, flanked by ridges, serving as the eastern gateway to Luoyang and a contested stronghold throughout history."
############关中四关
 building_type_xiaoguan_01: "Xiaoguan Pass"
 building_type_xiaoguan_01_desc: "Xiaoguan has historically not only been a strategic military stronghold but also an essential passage along the Silk Road. To its south, three routes lead directly to Ningxia, Inner Mongolia, and Gansu; via Huangjiang River, Malian River, and Jing River, they reach Guanzhong. Gu Zuyu described Xiaoguan as \"occupying the shoulder and back of eight commanderies, controlling the vital artery of three towns,\" making it a place that military strategists have always contested since ancient times."
 building_type_dasanguan_01: "Dashan Pass"
 building_type_dasanguan_01_desc: "Dashan Pass, also known as San Pass, is one of the four passes in Guanzhong. It was originally a border pass of the Zhou Dynasty's state of San, hence its name. The terrain here is rugged and steep, with layered mountain ridges forming a formidable barrier that embodies the saying \"one man guards the pass, ten thousand cannot open it.\" As it controls the vital artery between north and south, it has long been known as the \"chokehold of Sichuan and Shaanxi\" and a strategic location fiercely contested by military forces."
 building_type_wuguan_01: "Little familiar with the pass"
 building_type_wuguan_01_desc: "Wuguan Pass has a long history, established as early as the Spring and Autumn period under the name \"Shaoxi Pass,\" later renamed \"Wuguan\" during the Warring States period. Situated on the north bank of the East Wuguan River in Danfeng County, it forms one of the \"Four Passes of Qin\" alongside Hexi Pass, Xiaoguan, and Dasan Pass. Located approximately 80 li east of the modern town of Danfeng, within a valley ravine, the Dan River—a tributary of the Han River—flows from northwest to southeast through the eastern mountainous region of the Qinling, carving out a narrow lowland corridor that serves as a vital passage for north-south travel in eastern Qinling."
 building_type_tongguan_01: "Tongguan Pass"
 building_type_tongguan_01_desc: "Tongguan is situated at a ferry crossing on the Yellow River, commanding the strategic junction of Shanxi, Shaanxi, and Henan provinces. It controls the vital route between Chang'an and Luoyang, serving as the key to entering and exiting the Three Qin region. Since the late Han Dynasty, it has been an essential passage for moving east into the Central Plains or west out into Guanzhong and the Western Regions, and is recognized as an official strategic pass. It has long been renowned as \"the foremost defense within the capital region,\" \"the throat of the four strongholds,\" and \"the hundred-and-two-layered pass.\" Historically known as Taolin Sai, it was established at the end of the Eastern Han Dynasty. Its jurisdiction originally extended from east of Tongguan to west of Lingbao County in Henan Province. Located in eastern Guanzhong within present-day Tongguan County, Shaanxi Province, it is protected by the Qinling Mountains to the south and blocked by the Yellow River to the north; connected to the Hangu Pass to the east and flanked by Mount Hua to the west, its strategic position is formidable, making it the eastern gateway to Chang'an. According to the Shanhaiguan Zhi: \"Among the defenses within the capital region, only Tongguan and Shanhai are paramount.\" After the construction of the pass, it was initially named \"Chongguan\" due to the Yellow River surging southward against the Guan Mountains; later, it was renamed \"Tongguan\" because of the Tong River located west of the pass."
##################太行八径
 building_type_jingjinguan_01: "Jingjing Pass"
 building_type_jingjinguan_01_desc: "Jingxing Pass, also known as Tumen Pass, is located at the Jingxing Mouth of the Taihang Mountains in Jingxing County, Hebei Province. It derives its name from its terrain, which features high and flat surroundings on all four sides with a depression in the center resembling a well. As the fifth of the Eight Passes of the Taihang Mountains, it has long served as the vital corridor between Jin and Ji provinces and is listed among the Nine Fortresses of the World in Lüshi Chunqiu. The main structure of the pass was formed by the Mian River crossing a fractured valley, with steep rock walls controlling the strategic junction between the North China Plain and the Shanxi Plateau."
 building_type_fengyue_01: "Fengyue Pass"
 building_type_fengyue_01_desc: "Fengyue Pass is located at the source of the Fuyang River in Fengfeng Mining District, Handan City, Hebei Province. Situated at \"Fukou Xing,\" a strategic mountain pass between Shenmi Mountain and Nangu Mountain, it ranks as the fourth of the Eight Passes of Taihang Mountains and has long served as a vital military stronghold."
 building_type_baijing_01: "White Xing Ancient Road"
 building_type_baijing_01_desc: "The ancient White Xing Road was first constructed during the Shang and Zhou dynasties, becoming a vital transportation route between northern Henan and southern Shanxi during the Warring States period. The most intact section today stretches from Shuangdi Village to the Baobi area in Huixian County. The road surface is paved with limestone cobblestones, with clearly visible horse-and-cart ruts. It comprises two segments: the Seventy-Two Turns and the Hanging Sky Ancient Road. The latter was built along the cliffs of Baoquan Canyon, less than two meters wide, with sheer abysses above and below. During wartime, this pass served as a military stronghold; in peacetime, it functioned as a trade route between Shanxi and Henan."
 building_type_tianjing_01: "Tianjing Pass"
 building_type_tianjing_01_desc: "Tianjing Pass, also known as Xiongdin Pass, is a formidable fortress guarding the border between Jin and Yu provinces. It stands majestically in Jincheng City, Shanxi Province, at the southernmost tip of the Taihang Mountains, serving as a strategic gateway to Jiaozuo, Henan Province. Historically recognized as one of the Eight Passes of the Taihang, it derives its name from the three deep, unfathomable Tianjing Springs located before the pass."
#################洛阳八关
 building_type_hanguguan_01: "Hangu Pass"
 building_type_hanguguan_01_desc: "Hangu Pass, situated west of the Guanzhong Plateau and eastward facing a precipitous ravine, with Qinling Mountain to the south and the Yellow River blocking its north, stands as one of China's earliest-established formidable fortress. Originally constructed during the Western Zhou Dynasty, it serves as the vital chokepoint between Luoyang to the east and Chang'an to the west. It is renowned for the sayings: \"Heaven opens Hangu Pass, making Guanzhong mighty; ten thousand valleys startle dust into the northern void,\" and \"Two peaks tower beside the great river; since ancient times, Hangu has been a battlefield.\" Since antiquity, it has been a strategic location fiercely contested by military forces."
 building_type_yijue_01: "Yique Pass"
 building_type_yijue_01_desc: "Yique Pass, located at the gateway between Longmen Mountain and Xiangshan south of Luoyang, is flanked by two mountains with the Yi River flowing through them. During the Eastern Zhou Dynasty, it served as a crucial pass on the southern face of the capital, serving as the only route for travel from Luoyang southward or from Jingxiang northward. Today, at the site of the former Yique Pass, stands a magnificent and ancient arch bridge connecting the two mountains into one."
 building_type_guancheng_01: "Guangcheng Pass"
 building_type_guangcheng_01_desc: "Guangcheng Pass is located south of Guangcheng Garden, established by Emperor Guangwu of Han, hence its name. The ruins are situated in the area around Linru Town, Pingdingshan City, Henan Province today. This region is traditionally known as \"Two Mountains Flanking a River,\" with Changchong Mountain, Niangniang Mountain, Monk Mountain, Baiyun Mountain, and Panlong Mountain to the northeast, and Damashan and Dahuling to the southwest. Since ancient times, it has served as a strategic fortress leading to Ru and Ying. During the Eastern Han Dynasty, there was Guangcheng Marsh near Guangcheng Pass, spanning four hundred li in circumference, with waters originating from Langgao Mountain and flowing southeast into the Ru River. In the early years of the Sui Dynasty's Great Enterprise era, a horse pasture was established here. Traveling north from the Ru and Ying region to reach Jingluo, this location is an essential passage."
 building_type_dagu_01: "Dayuguan Pass"
 building_type_dagu_01_desc: "The ruins of Dagu Pass are located in Shuiquan Village, Koudian Township, Yan Shi County today. It is a valley between Songshan and Longmen Mountains. The \"Luoyang Ji\" records: \"Dagu lies fifty li south of Luoyang City; its former name was Tonggu.\" During wartime, this location could be used to ambush heavy forces and sever north-south transportation routes, making it an ancient battlefield contested by armies throughout history."
 building_type_xuanyuan_01: "Huan Yuan Pass"
 building_type_xuanyuan_01_desc: "The ruins are located at the border between Yan Shi and Dengfeng today, serving as a shortcut on the route from Luoyang to Xu and Chen. The Guan is situated at Eling Pass, between Taishi Mountain and Shaoshi Mountain; the road here is treacherous and narrow, featuring twelve bends that wind and loop back upon themselves, hence the name Huanyuan Pass. To its south lies Elingkou, where another pass was carved out by Ma Zhongfu, the magistrate of Yan Shi County during the Song Dynasty. This road is spacious and convenient for travelers; locals refer to it as Elingkou, also known as New Huanyuan Pass."
 building_type_xuanmen_01: "Xuanmen Pass"
 building_type_xuanmen_01_desc: "The site of the Xuanmen Pass is located in the area southwest of Sishui, Xingyang, Zhengzhou, Henan. During the Eastern Han Dynasty, the Chenggao Xuanmen Pass served as the first pass east of Luoyang, the imperial capital. In Ban Zhao's \"Eastern Expedition Ode,\" it states: \"Gazing upon the confluence of the Yellow and Luo rivers, I behold the revolving gate at Chenggao,\" referring to this very pass. Once one crosses this pass heading east from Luoyang, there is no strategic choke point left to hold."
 building_type_mengjin_01: "Mengjin Pass"
 building_type_mengjin_01_desc: "Mengjin Pass, also known as Heyang Pass, is a vital gateway north of Luoyang, situated at Mengjin Ferry along the Yellow River's Mengjin section. The earliest location of Mengjin Pass should be Kouma Village in Huimeng Town, present-day Mengjin County. This was the site where King Wu of Zhou allied with feudal lords and crossed the river during his campaign against King Zhou of Shang; it is also called Mengjin or Fuping Ferry. In the Western Jin Dynasty, Du Yu, Marquis Fengle of Fengle, constructed the first floating bridge across the Yellow River here, known as \"Heqiao.\" Later, the Northern Wei established Heyang's Three Cities on both banks and a sandbar in the river. Throughout history, this pass has been a crucial crossing north of Luoyang and a strategically contested location for military forces."
 building_type_xiaopingjin_01: "Xiao Pingjin Pass"
 building_type_xiaopingjin_01_desc: "Xiao Pingjin Pass is located in the area of Huayuan Village, Hui Meng Town, Mengjin County, today, situated on a sandbar in the middle of the Yellow River and serving as one of its river crossings. Its status ranks second only to Fuping Jin (Mengjin Pass), hence the name Xiao Pingjin. Additionally, west of Luoyang lies Tongguan Pass, east is Hulao Pass, north are Tianjing Pass (on the southern Taihang Mountain top in Jincheng County, Shanxi Province today) and Zhi Pass (west of Jiuyuansuo County, Henan Province), among others. These passes collectively serve as the gateway to Luoyang; with garrisons stationed for defense, they make Luoyang a strategically vital military position from which one can advance to attack or retreat to defend."
####################蜀地与汉中
 building_type_jianmenguan_01: "Jian Gate Pass"
 building_type_jianmenguan_01_desc: "Located in Jianmen Town, Jiange County, Guangyuan City, Sichuan Province, formerly known as Liangshan Mountain or the Great Jian Mountain. It is called Jianmen because the two mountains stand opposite each other like a gate, earning it the reputation of \"Jianmen: The Most Dangerous Pass Under Heaven.\" Construction began during the Three Kingdoms period and is associated with Zhuge Liang's role as Chancellor of Shu Han, who used this location to pile stones for defense. It is also known as Jiange or Jiange Pass."
 building_type_yangping_01: "Yangping Pass"
 building_type_yangping_01_desc: "Yangping Pass was established in 221. According to page 957 of the \"Comprehensive Dictionary of Ancient and Modern Place Names in China,\" published by Commercial Press in 1931: \"Yangping Pass is located thirty li northwest of Zhongjiang, Sichuan; it served as a key stronghold during the Shu Han period and was later destroyed in warfare at the end of the Ming Dynasty.\" The Song Dynasty's \"Yuanfeng Jiuyue Zhi\" records: \"Yangping Town belonged to one of the Six Fortresses of Xuanwu.\" The Qing Dynasty's \"Zhongjiang County Gazetteer\" states: \"Yangping Town was founded in the Han Dynasty. It served as the gateway to the ancient Five Cities and the northern frontier of Xuanwu, a necessary route between Mianzhou and Luojiang.\" Historically, Yangping Pass functioned both as a military fortress and a customs checkpoint."
 building_type_xiameng_01: "Jiameng Pass"
 building_type_xiameng_01_desc: "The area around Jiameng Pass has witnessed numerous major battles throughout history. The earliest was the Qin-Shu War in the fifth year of King Shenling of Zhou (316 BC). During the Wei and Shu period, the battle where Zhang Fei fought Ma Chao under the lamp at night made Jiameng Pass famous far and wide."
#########################################山西三关
 building_type_yanmenguan_01: "Yanmen Pass"
 building_type_yanmenguan_01_desc: "Among the nine passes of the realm, Yanmen stands first."
 building_type_loufan_01: "Loufan Pass"
 building_type_loufan_01_desc: "During the Warring States period, King Wu of Zhao once established the Loufan Pass here to guard against the Xiongnu."
 building_type_piantou_01: "Piantou Pass"
 building_type_piantou_01_desc: "Originally constructed during the Ming Dynasty, located in the western sector of the Three Passes, it connects to Yajiao Mountain to the east and borders the Tianqian Yellow River to the west. Named Piantou Pass due to its eastern elevation and western depression."
####################河北三关
 building_type_juyongguan_01: "Juyongguan"
 building_type_juyongguan_01_desc: "Geographically, Juyongguan is situated in the upper reaches of the Wenyu River valley—specifically in the middle section of the Guan Gou pass. It lies eastward against the Jundu Mountain range of the Yanshan Mountains and westward connects to the Taihang Mountains. With high mountains facing each other on both sides, the terrain is formidable, easy to defend but difficult to attack, making it a strategically vital location contested by military forces throughout history."
 building_type_zijin_01: "Zijing Pass"
 building_type_zijin_01_desc: "Located in Yixian County, Hebei Province, originally constructed during the Warring States period and named for its abundance of wisteria trees on the slopes. Situated between two mountains with water flowing nearby, it serves as one of the key passes along the Inner Great Wall. Positioned between Jiuyongguan and Daoma Pass, these three fortifications were collectively known as the \"Inner Three Passes\" during the Ming Dynasty, acting as a vital gateway from the Hebei Plain into the Taihang Mountain region."
 building_type_hongzhisai_01: "Hong's Barrier"
 building_type_hongzhisai_01_desc: "Hongzhai Pass was first established during the Warring States period. In the Han dynasty it was called Changshan Pass; in Northern Wei it was known as Tieguan Pass and also Hongshan Pass. After the Ming dynasty, it became commonly referred to as Daoma Pass, named for the treacherous mountain roads where warhorses frequently fell."
#########################义阳三关
 building_type_wushengguan_01: "Straight Axle"
 building_type_wushengguan_01_desc: "During the Spring and Autumn period, Wusheng Pass was known as Zhixuan and Lishan. After Qin unified China, it was renamed Wuyang Pass. During the Southern Song Dynasty, it was changed to its current name, Wusheng Pass. Located at the foot of Jigong Mountain, Wusheng Pass has been a strategically vital location throughout history. Situated among the Three Passes, it holds the prestigious title of \"The Pass of Guanzhong.\" Ancient poets left behind verses such as: \"A majestic pass embraces the dense peaks of Chu; trees and springs in the gorge exude an air of seclusion. The land unfolds flatly, dividing two realms; heaven leaves iron chains to strengthen the central state.\" Among the Three Passes, Wusheng Pass occupies the central position, making its status particularly significant, hence its alternative name, \"The Pass of Guanzhong.\" Also known as Wuyang Pass, it is flanked by two mountains, with a grand and imposing pass."
 building_type_mineguan_01: "Ming'e Pass"
 building_type_mineguan_01_desc: "Pingjing Pass, located west of the Three Passes. During the Spring and Autumn period it was known as Ming'e Pass; in the Song Dynasty it was called Xingzhe Slope or Xingzhe Pass. Legend has it that during the Three Kingdoms period, Guan Yu led his troops to defeat Cao's forces but encountered resistance here, resenting this narrow pass, hence its later name \"Henzhe Pass.\" Pingjing Pass is listed among the \"Nine Fortresses under Heaven\" in both *Lüshi Chunqiu: Youshi Luan* and *Huainanzi: Zuixing Xun*, with Ming'e being one of them. It overlooks all of Chu to the south and screens the Central Plains to the north, holding a strategically vital position that ancient people referred to as \"the key point contested by armies between Huai and Han.\""
 building_type_dasuisai_01: "Great Tunnel Blocked"
 building_type_dasuisai_01_desc: "Jiuli Pass, located to the east of the Three Passes, is also known as Huangxian Pass, Baiyan Guan, and Guanxian Pass. During the Spring and Autumn Period, it was called Daxui Sai; the name Jiuli Pass first appeared after the Song Dynasty. Situated in the southwest of Luoshan County, Xinyang City, it derives its name from the deep and extensive nature of the pass. Together with Wusheng Pass and Pingjing Pass, it forms a pincer formation and has historically been a site of frequent military conflicts."
##############玉门关与阳关
 building_type_yumen_01: "Yumen Pass"
 building_type_yumen_01_desc: "Located in Dunhuang City, Gansu Province, also known as \"Xiao Fangpancheng,\" the original site is situated at Xiao Fangpancheng northwest of Dunhuang, Gansu, approximately 80 kilometers southeast of Dunhuang. First constructed during the reign of Emperor Wu of Han, it was named for its role as a transit route for jade imported from the Western Regions. It served as a critical chokepoint connecting the Central Plains with the Western Regions."
 building_type_yangguan_01: "Yangguan Pass"
 building_type_yangguan_01_desc: "Located 70 kilometers southwest of Dunhuang City in Gansu Province, near Gaogut Beach, this pass was first established during the reign of Emperor Wu of Han. Named Yangguan because it lies south of Yumen Pass (in ancient times, the southern side of a mountain or northern side of a river was considered \"yang\"), it serves as a critical chokepoint connecting the Central Plains with the Western Regions and stands as a sister pass to Yumen Pass. As an essential gateway along the southern route of the Silk Road, it has long been a strategically contested stronghold in ancient warfare."
#################南方
 building_type_zhennan_01: "Zhennan Pass"
 building_type_zhennan_01_desc: "Located 18 kilometers southwest of Pingxiang City, Guangxi Province, originally established during the Han Dynasty and formerly known as Zhennan Pass. Surrounded by towering mountains nearby, the pass lies deep within a valley and serves as a critical stronghold on the southwestern frontier. It controls the passes at Daqing Mountain and Jinji Mountain, with overlapping peaks, deep valleys, and dense forests, holding significant strategic importance. This pass was a vital transportation route connecting China and Vietnam, earning it the title of \"Fortress of the Southern Border.\""



 building_type_yaoguan_01: "Yaoguan Pass"
 building_type_yaoguan_01_desc: "Yaoguan, located at its original site south of the city of Lantian in Xi'an, Shaanxi Province, derives its name from its proximity to Yaoshan Mountain. The city of Lantian is abundant with willows, hence also known as Yaoliuguan Pass. Situated before Yaoling Ridge and backed by Kuishan Mountain, the terrain here is strategically critical. Since ancient times, it has served as a vital transportation chokepoint connecting the Guanzhong Plain to Jingzhou and the Nanyang Basin. As the last pass west of Wuguan, near Xianyang and Chang'an, its strategic importance is paramount. The fate of Yaoguan directly impacts the security of the imperial capital, Chang'an; consequently, it has always been a fiercely contested stronghold among military strategists."


 building_type_dujiangyan_01: "Dujiangyan"
 building_type_dujiangyan_01_desc: "The Dujiangyan irrigation project fully utilizes the local geographical conditions of high northwest and low southeast, leveraging the unique terrain, water flow patterns, and hydraulic momentum at river outlets to guide water naturally without dams. This system integrates flood control, diversion, discharge, sediment removal, and flow regulation into an interdependent framework, ensuring comprehensive benefits in flood prevention, irrigation, water transport, and social water supply."

 building_type_lingqu_01: "Lingqu Canal"
 building_type_lingqu_01_desc: "The Lingqu Canal connected the Xiang River and the Li River, opening up a north-south waterway and facilitating communication between Central Plains and Lingnan."

 building_type_huangjintai_01: "Golden Terrace"
 building_type_huangjintai_01_desc: "\"Strategies of the Warring States, Yan Strategy I\": 'Thus King Zhao built a palace for (Guo) Wei and treated him as a teacher; Le Yi came from Wei, Zou Yan from Qi, Ju Xin from Zhao, and scholars flocked to Yan.' See also the section on Utensils and Treasures under 'Dead Bones Worth a Thousand Gold'. The original text in \"Strategies of the Warring States\" reads 'built a palace'; the phrase 'built a platform' first appears in Kong Rong's \"Letter on Sheng Xiaozhang\". This refers to a place for recruiting talents. Tang Dynasty Li Bai, \"Recalling My Flight South\": 'Serving at the Golden Platform with my brush, passing cups on the Jade Banquet Stand.' Also see Utensils and Treasures under 'Golden Platform Built', Characters under Sages and Virtuous Men under 'Guests of the Golden Platform', and Political Affairs under Deliberations on Governance under 'Honoring Wei'."

