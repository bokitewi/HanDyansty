 building_type_dapusi_tin_mines_01: "Xilingol Banner of the Great Hutukhoo Tin Mine"
 building_type_dapusi_tin_mines_01_desc: "Tin must be mixed with copper to cast bells, bronze vessels, and weapons. The tin produced here is highly valued by craftsmen."
 building_type_habuqila_tin_mines_01: "Xilin Gol Habuqila Tin Mine"
 building_type_habuqila_tin_mines_01_desc: "Tin must be mixed with copper to cast bells, bronze vessels, and weapons. The tin produced here is highly valued by craftsmen."
 building_type_yihewomente_tin_mines_01: "Ihe Womentsi Mine"
 building_type_yihewomente_tin_mines_01_desc: "Tin must be mixed with copper to cast bells, bronze vessels, and weapons. The tin produced here is highly valued by craftsmen."

 building_type_xibeiyanchi_salt_mines_01: "Salt Pool"
 building_type_xibeiyanchi_salt_mines_01_desc: "Salt pools are common along the northwestern frontier. Where their water dries up, salt crystallizes; known as Rong salt, it can be used both in food and in medicine."
 building_type_bashu_salt_mines_01: "Ba-Shu Salt Wells"
 building_type_bashu_salt_mines_01_desc: "Saline springs are common in the mountains of Ba and Shu. Local people dig wells to draw brine and boil it into salt. It is said that Li Bing, governor of Shu under the Qin, dug salt wells at Guangdu; the profits from well salt later spread throughout Shu."
 building_type_liaodong_salt_mines_01: "Liaodong Salt Farm"
 building_type_liaodong_salt_mines_01_desc: "The coast of Liaodong is rugged and rocky, leaving little shore suitable for boiling salt. Its sea salt is produced in small quantities, but is known for its whiteness and fine texture."
 building_type_jiaodong_salt_mines_01: "Jiaodong Salt Field"
 building_type_jiaodong_salt_mines_01_desc: "The bays of Jiaodong are mostly rocky, and their salt works are small. Production is modest, but still sufficient to supply nearby coastal communities."
 building_type_lubei_salt_mines_01: "Lubei Salt Region"
 building_type_lubei_salt_mines_01_desc: "Along the coast north of Qi, underground brine is saltier than seawater and can be boiled into salt. Since Guan Zhong developed the profits of fish and salt, these resources have made Qi the richest land under Heaven."
 building_type_wuyue_salt_mines_01: "Wu-Yue Haiyan District"
 building_type_wuyue_salt_mines_01_desc: "Along the coasts of Wu and Yue, seawater is boiled into salt in great quantities. In the time of Emperor Gaozu, Liu Bi, King of Wu, grew wealthy by boiling seawater for salt and minting coins from mountain copper. The Grand Historian wrote that Wu was rich in sea salt to the east."

