 building_type_linzi_iron_mines_01: "Small Iron Mine"
 building_type_linzi_iron_mines_01_desc: "Since the time of Guan Zhong, Qi has grown richer than other states through salt and iron. Near Linzi lies a small iron mine. Its veins are shallow and its output modest, but it provides enough iron for the local farming tools."
 building_type_xuzhou_iron_mines_01: "Large Iron Ore Mine"
 building_type_xuzhou_iron_mines_01_desc: "The mountains around Pengcheng contain abundant iron ore. The court has established an iron office here, putting laborers to work mining and smelting. Over the years, pits and furnaces have spread across the area, attracting many families who make their living by smelting and casting."
