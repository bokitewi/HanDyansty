l_english:
 hd_dc_ritual_register_title:0 "Rites of the Royal House"
 hd_dc_roy.0001.t: "Beneath the ancestral temple, seating arrangements differ according to rank."
 hd_dc_roy.0001.desc: "As the official in charge of ceremonies just spread out the seating chart, [hd_dc_favored.GetTitledFirstName] pressed down on the seat closest to the imperial throne. \n\n \"I have been traveling abroad; how could I not even secure a place to sit?\" [hd_dc_favored.GetSheHe] He did not release his grip. [hd_dc_displaced.GetTitledFirstName] He pushed the register toward me and pointed to the originally arranged order: \"If we can shift one seat today, what cannot we shift tomorrow?\" \n\n Both were waiting for my words. The remaining royal relatives listed on the silk register would also discern their own standing from these words."
 hd_dc_roy.0001.a: "Relatives of the imperial clan shall each hold their respective positions, rearranged according to the old precedents."
 hd_dc_roy.0001.a.tt: "Restore the old order confirmed during this crisis and temporarily suspend preferential treatment for those seated nearby. Contradiction -5, Governance +10; the faction supporting the traditional order gains +10 toward you, while those requesting proximity to your seat lose -10 toward you. This effect lasts for 5 years."
 hd_dc_roy.0001.b: "The seat may be granted to you; your support is required during council deliberations."
 hd_dc_roy.0001.b.tt: "Propose a protocol of close attendance and deliberative support to a named clan member, awaiting their genuine response. Acceptance will update the registry; other competitors gain +10 influence toward you, while favored individuals gain +20 influence toward you, lasting for 5 years. The signing itself is separately recorded according to the relationship effects jointly signed. Refusal, expiration, or invalidation does not grant close attendance."
 hd_dc_roy.0001.c: "My seat is not to be debated by my kinsmen."
 hd_dc_roy.0001.d: "Please have the most respected elder preside over the ritual order."
 hd_dc_roy.0001.d.tt: "Invite an elder of the imperial clan who is trusted by both parties and has not participated in the struggle for succession. If the elder genuinely accepts, pay 30 gold to request them to adjudicate according to the previously frozen order. Upon actual hosting, governance +15; witnessing the elder's approval grants you +15 favor. If diplomacy succeeds, conflict −10 and mutual affinity between both parties +10; if it fails, request those present to refuse adjudication, increasing conflict by 5. If the elder does not accept or there are insufficient funds, it will not be recorded as successful."
 hd_dc_roy01_mediation_terms: "Act as a joint witness, preside over the ruling based on the frozen old order of the current imperial family register, and persuade the party requesting to take their seat. After both parties sign, the Emperor will pay you 30 gold from his private assets for hosting fees. If persuasion fails, settlement shall be made according to actual hosting; invitations themselves incur no deduction and do not alter seating arrangements."
 hd_dc_roy01_mediation_written_terms: "The hosting fee remains at 30 gold, in accordance with the current ruling on freezing prior procedures. Please record the named witnesses, actual rulings, and whether anyone refused into the register, and submit the result document to the court. The Emperor will confirm this written record before proceeding further."
 hd_dc_roy.0101.mediation_success: "The elder unfolded the old register, pointing out the originally confirmed order section by section. Those seated nearby who were relatives of the clan still wished to argue, but upon hearing the end, they finally loosened their grip on the mat markers. \n\n The official in charge of ceremonies had already re-ranked the register according to the ruling and recorded the names of the joint witnesses. The hosting fee of thirty gold coins was paid in full; both parties also exchanged formal greetings with each other, and this time there was no further dispute."
 hd_dc_roy.0101.mediation_failure: "The elders made rulings according to the old register, seat by seat. As soon as the official of rites had collected the register, a member of the royal clan seated nearby stood up and said, \"The rankings may be recorded as they are, but I cannot accept this ruling.\" \n\n The hosting fee of thirty gold pieces has already been paid; the witnesses and rulings have also been entered into the register. The matter has indeed been handled, yet the dispute remains unresolved; the names of those who refuse to accept the ruling are separately recorded at the end of the register."
 hd_dc_roy.0101.mediation_unpaid: "The official of ritual returned with the signed document, but the expenses were not settled as agreed. Without complete payment vouchers, this mediation could not be recorded as a completed transaction. The \n\n register retained its original seating arrangement, while the documents were attached to actual payment records for verification by the court."
 hd_dc_roy.0101.mediation_cancelled: "The mediation document failed to reach a resolution. The ritual officials sealed the reply and processing records together: no response, an explicit refusal, or conditions no longer suitable for hosting mediation could not be recorded as a reconciliation between both parties. \n\n No unfinished mediation was added to the register."
 hd_dc_roy.0001.c.tt: "Verify the current roster and reject both parties' disputes. Contradiction +10, gain a small amount of prestige; both disputing parties lose -15 favor toward you, strong non-royal vassals gain +10 favor toward you, and royal collaboration favor decreases by -5, lasting for 5 years."
 hd_dc_roy.window_closed: "The situation has changed; this document must be reprocessed."
 hd_dc_roy01_precedence_terms: "The Emperor grants the petitioner the first seat in this round of imperial clan deliberations, while other royal relatives maintain their relative order. The recipient pledges to provide a written response within 90 days after receipt of the proposal document, agreeing to participate in imperial clan deliberations and supporting the inclusion of requests from various branches into the joint agenda. This agreement confers no military authority, does not increase stipends, and requires no relocation to the palace."
 hd_dc_roy01_precedence_guarantee: "The Emperor grants the petitioner the first seat in this ceremonial order and guarantees that it shall not be revoked or reallocated within one year. The recipient must submit written opinions within 90 days after the receipt of the deliberation document, supporting the inclusion of various branch requests into a joint agenda. During the protection period, the roster is frozen; no military authority shall be conferred, no stipends increased, and no relocation to the court demanded until both parties reconfirm the arrangement."
 hd_dc_roy.0101.t: "Bookmarks and Returned Books"
 hd_dc_roy.0101.accepted: "The envoy returned the sealed document to the desk. The ritual officer rearranged the seating signs according to the terms confirmed by both parties, and the names near the front were entered into the register. \n\n Accompanying the register was also an invitation to a council. With all seals in place, what remained to be seen was whether the recipients would submit their promised responses."
 hd_dc_roy.0101.rejected: "The document was returned, with the seal area still blank. The envoy brought back a message: \"Seats and service should not be written on the same paper.\" \n\n The official of ritual rites collected the prepared seat signs intended for replacement and continued to issue invitations to deliberation according to the current roster. No one took the place near the seat, and this proposal failed to gain support."
 hd_dc_roy.0101.expired: "The response deadline has passed, and the box for replies on the desk remains empty. The official in charge of ceremonies asked whether we should continue to wait. I glanced at the document that had not yet been sealed. \n\n This proposal is hereby dropped. The seating cards remain arranged according to the current roster; agreements that were not finalized cannot be counted as support."
 hd_dc_roy.0101.invalidated: "The official of ritual returned the documents from the banquet but made no changes to the register. Some individuals could no longer attend the deliberation, or the authority at the time of affixing seals had already changed hands; this agreement could no longer be executed as originally planned. \n\n Records of unprocessed matters remained on the table. The current court still had to address the demands of the royal clan, yet could not treat old documents as rewards already delivered."
 hd_dc_roy.0101.a: "Record the actual results of handling matters in the register."
 hd_dc_roy.0102.t: "Successive proposals delivered in sequence"
 hd_dc_roy.0102.desc: "The envoy delivers the proposal document, sealed with my prescribed rank: Seat [SCOPE.GetValue('hd_dc_invitation_rank')|0]. The register of royal kin has been verified; the court requests that I submit a signed response regarding petitions for honors and appointments across various branches. \n\n Space remains on the paper for affixing my seal. This time, no need to bring attendants into the palace; simply write down your opinion, and the court will place my response on the agenda."
 hd_dc_roy.0102.a: "Fetch the paper. I will write down what needs to be said clearly."
 hd_dc_roy.0102.a.tt: "Submit a signed opinion within 90 days after the actual delivery of the proposal. If you previously exchanged participation in this deliberation for a seat near the throne, this written obligation is considered fulfilled. Opinions may support or oppose the court's stance; submitting a response does not imply endorsement of succession or war, nor will it automatically join a faction or relocate to the palace."
 hd_dc_roy.0102.b: "Return the proposal; I will not affix my seal to this arrangement."
 hd_dc_roy.0102.b.tt: "Explicitly refuse to participate. If a prior agreement supporting this council session has been signed, a record of the named individual's breach will be left; for those who have not signed, only the refusal will be recorded."
 hd_dc_ritual_fairness_opinion: "Restore the ancestral order of the imperial clan"
 hd_dc_ritual_disappointment_opinion: "Request to sit nearby has been rejected."
 hd_dc_ritual_command_opinion: "The Emperor adjudicates the order of rites."
 hd_dc_ritual_precedence_opinion: "The recent seat has been given undue emphasis."
 hd_dc_royal_cooperation_opinion: "The deliberations of the royal clan are suppressed."
 hd_dc_royal_support_opinion: "Openly support the claim to the throne"
 hd_dc_ritual_register_tt:0 "This is the register of ritual precedence for the dispute among imperial clan members. Upon initial confirmation, they are arranged by highest title rank and age; those of equal rank and age are listed together. Subsequently, the original order is retained, while a separate record notes the actual seats granted by the Son of Heaven. Future deliberations involving the imperial clan shall invite eligible relatives according to the current order of precedence."
 hd_dc_ritual_register_row:0 "Rank [Scope.Var('hd_dc_ritual_rank').GetValue|0], [Scope.Var('hd_dc_actor').Char.GetName] · Old Order [Scope.Var('hd_dc_ritual_old_rank').GetValue|0]"
