l_english:
 wj_request_xiaolian_interaction_desc:0 "Ask them to recommend you, or a man of your household, as Filial and Incorrupt, so that he may enter office."
 wj_xiaolian_interaction_desc:0 "Use this year's recommendation quota to name this person Filial and Incorrupt, so that they may enter office. Ask too much of them, and they may decline."
 WJ_conquest_commission_interaction:0 "Commission a Campaign"
 WJ_conquest_commission_interaction_desc:0 "Order Area Commander [recipient.Custom('WJ_GetLinkedUIName')] to lead his troops against a neighboring [duchy|E] beyond our borders; all lands taken shall belong to the court."
 wj_dd_petition_create_ai:0 "Petition for an Area Command"
 wj_dd_petition_create_ai_desc:0 "Memorialize the Son of Heaven to establish an Area Command centered on the kingdom you hold."
 wj_dd_petition_create_player:0 "Petition for an Area Command"
 wj_dd_petition_create_player_desc:0 "Memorialize the Son of Heaven to establish an Area Command centered on the kingdom you hold, and request the Staff of Authority you wish to be granted."
 wj_dd_petition_expand_ai:0 "Petition to Expand Command"
 wj_dd_petition_expand_ai_desc:0 "Memorialize to annex a neighboring kingdom, not yet part of another command, into your Area Command."
 wj_dd_petition_expand_player:0 "Petition to Expand Command"
 wj_dd_petition_expand_player_desc:0 "Memorialize to annex a neighboring kingdom, not yet part of another command, into your Area Command."
 wj_dd_qinwang_interaction:0 "Summon to the Emperor's Defense"
 wj_dd_qinwang_interaction_desc:0 "Command this Area Commander to lead his own troops to the throne's defense, joining the [wars|E] led by the Son of Heaven."
 wj_dd_create_interaction:0 "Establish Area Command"
 wj_dd_create_interaction_desc:0 "Establish an Area Command centered on the kingdom this person holds, and grant them a Staff of Authority."
 wj_dd_dissolve_interaction:0 "Abolish Area Command"
 wj_dd_dissolve_interaction_desc:0 "Abolish this Area Command and recall the Area Commander's Staff of Authority; their substantive office and fiefs remain unchanged."
 wj_dd_manage_interaction:0 "Adjust Area Command"
 wj_dd_manage_interaction_desc:0 "Bring a kingdom-level official bordering this command, and not yet in another, into the Area Command."
 wj_dd_command_interaction:0 "Issue Area Command Orders"
 wj_dd_command_interaction_desc:0 "With the Staff of Authority, issue military orders to the officials of this command."
 wj_dd_justice_detain_interaction:0 "Detain under Military Law"
 wj_dd_justice_detain_interaction_desc:0 "As Commandant of Justice, take into custody this person guilty of a military crime."
 wj_dd_pardon_interaction:0 "Pardon Military Crime"
 wj_dd_pardon_interaction_desc:0 "Pardon this person's military crime."
 wj_dd_request_aid_interaction:0 "Request Area Commander's Aid"
 wj_dd_request_aid_interaction_desc:0 "Ask the Area Commander of this command to send troops to your aid, joining the [war|E] you lead."
 wj_dd_request_pardon_interaction:0 "Request Pardon under Military Law"
 wj_dd_request_pardon_interaction_desc:0 "Submit a petition asking pardon for your military crime. Petitions to the Son of Heaven are usually passed on to the Commandant of Justice."
 wj_dd_adjust_jie_interaction:0 "Regrant the Staff of Authority"
 wj_dd_adjust_jie_interaction_desc:0 "By your authority over all military and civil affairs, change the level of the Staff of Authority granted to this Area Commander."
 wj_dd_promote_interaction:0 "Promote to Area Commander"
 wj_dd_promote_interaction_desc:0 "Order this military officer to take over the Area Command and grant them a Staff of Authority; the former Area Commander loses that authority but remains in office within the command."
 wj_dd_withdraw_interaction:0 "Leave Area Command"
 wj_dd_withdraw_interaction_desc:0 "Remove this kingdom from the Area Command."
 wj_dd_deploy_aid_interaction:0 "Deploy Command Reinforcements"
 wj_dd_deploy_aid_interaction_desc:0 "Send a duchy- or kingdom-level military officer of this command to join the [war|E] led by this person."
 wj_dd_join_wars_01:0 "Area Commander Joins in Person"
 wj_dd_join_wars_01_desc:0 "The Area Commander personally leads his troops to join the [war|E] led by this person."
 wj_kaoke_request_interaction:0 "Request a Favorable Evaluation"
 wj_kaoke_request_interaction_desc:0 "Ask your superior to speak well of you in this term's evaluation."
 wj_kaoke_request_interaction_send:0 "Request Approval"
 WJ_mr_submit_desc:0 "Request [secondary_recipient.Custom('WJMRChoice')] for [secondary_recipient.Custom('WJ_GetLinkedUIName')]. Approve the proposal or grant a different military rank."
 WJ_mt_pick_private_receiver:0 "Retainers: Choose Receiving Party"
 WJ_mt_pick_private_source:0 "Retainers: Choose Releasing Party"
 WJ_mt_pick_title_receiver:0 "Commandery and Kingdom Troops: Choose Receiving Party"
 WJ_mt_pick_title_source:0 "Commandery and Kingdom Troops: Choose Sending Party"
 wj_bizhao_interaction:0 "Summon to Headquarters"
 wj_bizhao_interaction_desc:0 "Summon this person to your headquarters and take them on as a protégé."
 wj_huangdi_zhaoshu_interaction:0 "Issue Edict"
 wj_huangdi_zhaoshu_interaction_desc:0 "With the dignity of the Son of Heaven, issue an edict concerning this person: summon them to the palace, promote or demote, reward or punish."
 wj_maocai_interaction:0 "Recommend as Flourishing Talent"
 wj_maocai_interaction_desc:0 "Use this year's recommendation quota to name this person Flourishing Talent, so that they may enter office. The honor is rare, and most gladly accept; ask too much of them, however, and they may decline."
 wj_maocai_interaction_reply_item_key:0 "[CHARACTER.Custom('WJ_GetLinkedUIName')] has recommended you as Flourishing Talent and awaits your reply"
 wj_maocai_interaction_send_name:0 "Recommend as Flourishing Talent"
 wj_request_bizhao_interaction:0 "Summon to Headquarters"
 wj_request_bizhao_interaction_desc:0 "In the name of your Headquarters, seek out talent and invite them to serve on your staff."
 wj_request_maocai_interaction:0 "Request Flourishing Talent Recommendation"
 wj_request_maocai_interaction_desc:0 "Ask them to recommend you, or a man of your household, as Flourishing Talent, so that he may enter office."
 wj_request_maocai_interaction_reply_item_key:0 "[CHARACTER.Custom('WJ_GetLinkedUIName')] asks you to recommend someone as Flourishing Talent"
 wj_request_maocai_interaction_send_name:0 "Petition for Recommendation"
 wj_request_xiaolian_interaction:0 "Request Filial and Incorrupt Recommendation"
 wj_request_xiaolian_interaction_reply_item_key:0 "[CHARACTER.Custom('WJ_GetLinkedUIName')] asks you to recommend someone as Filial and Incorrupt"
 wj_request_xiaolian_interaction_send_name:0 "Petition for Recommendation"
 wj_xiaolian_interaction:0 "Recommend as Filial and Incorrupt"
 wj_xiaolian_interaction_reply_item_key:0 "[CHARACTER.Custom('WJ_GetLinkedUIName')] has recommended you as Filial and Incorrupt and awaits your reply"
 wj_xiaolian_interaction_send_name:0 "Recommend as Filial and Incorrupt"
 WJ_sili_arrest_capital_official_interaction:0 "Arrest Capital Official"
 WJ_sili_arrest_capital_official_interaction_desc:0 "The Colonel-Director of Retainers oversees the officials of the capital. The power of arrest has not yet been granted by the court."
