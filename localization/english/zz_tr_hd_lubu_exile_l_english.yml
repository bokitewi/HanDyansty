l_english:
 hd_story_lubu_exile:0 "Lu Bu: Flight from Chang'an"
 hd_story_lubu_exile_desc:0 "Defeated at Chang'an, Lu Bu has lost his former offices and lands; gathering his old troops, he sets out on a wandering road across the realm."
 HD_LUBU_EXILE_STORY_STATUS:0 "With Chang'an lost, Lu Bu has gathered his old Bing Province troops and wanders in every direction, seeking his next foothold."
 hd_lbx_event_troops:0 "Lu Bu's Bing Province Veterans"
 hd_lubu_exile.0001.t:0 "Flight from Chang'an"
 hd_lubu_exile.0001.desc:0 "Chang'an cannot be held. As you rode out of the city, someone still asked what to do with the belongings in the residence; you shot him a glare over your shoulder and spurred your horse on. Li Jue may have taken the city — does he think he can keep your hands and feet as well?\n\nYour armored veterans regather beneath the banner, yet at roll call several familiar voices fail to answer. You grip the reins as you listen, the fury in your chest finding no outlet; if only you could turn back and fight now, these men would not be following you to seek lodgings outside the walls!\n\nBut your soldiers are waiting for you to speak. You lift your weapon upright and order each company to fall in. Not everywhere under Heaven will take you in, but neither is the world so small that you will find nowhere to wield your arms. First get out of here — then see who still dares look down on you, Lu Fengxian."
 hd_lubu_exile.0001.a:0 "Gather the old troops and seek another refuge."
 hd_lubu_exile.0003.t:0 "Flight East of the Pass"
 hd_lubu_exile.0003.desc:0 "Guanzhong has no place for you, but the world holds more than one Guanzhong.\n\nChen Gong spreads a map beneath the lamp, his finger tracing eastward until it stops at Yan Province. There, he says, Cao Cao is far away, the commandery officials each nurse their own designs, and around Jiyang no one can truly hold the ground; titles can be fought for, so long as one has troops in hand.\n\nThe veterans have assembled and the grain carts are ready. You plant your halberd in the ground and tell them all: we go east — first Jiyang, then Yan Province!"
 hd_lubu_exile.0003.a:0 "Break camp and head east; take Jiyang first."
 hd_lubu_exile.0003.a.tt:0 "Before long, you will raise troops to seize Jiyang."
