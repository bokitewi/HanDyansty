l_english:
 hd_story_lubu_exile:0 "Lü Bu: Flight from Chang'an"
 hd_story_lubu_exile_desc:0 "Defeated at Chang'an, Lü Bu loses his offices, noble titles, and lands. He gathers his old followers and begins wandering the realm."
 HD_LUBU_EXILE_STORY_STATUS:0 "With Chang'an lost, Lü Bu gathers his old Bingzhou troops and travels from place to place in search of a new foothold."
 hd_lbx_event_troops:0 "Lü Bu's Bingzhou Veterans"
 hd_lubu_exile.0001.t:0 "Flight from Chang'an"
 hd_lubu_exile.0001.desc:0 "Chang'an cannot be held. As you leave the city, someone still asks what should be done with the belongings in your residence. You glare back at him and spur your horse onward. Li Jue may have taken the city, but does he think he can keep you trapped there too?\n\nYour armored veterans gather beneath the banner once more, though several familiar voices are missing from the roll call. You grip the reins as you listen, anger building with nowhere to go. If only you could turn back and fight now, instead of leaving these men to find shelter outside the city!\n\nBut the soldiers are waiting for your orders. You straighten your weapon and tell the companies to close ranks. The realm may not welcome you everywhere, but it is hardly so vast that your prowess will never find a use. First get out of here; then see who still dares look down on Lü Fengxian."
 hd_lubu_exile.0001.a:0 "Gather the old troops and find another refuge."
 hd_lubu_exile.0003.t:0 "Flight to Guandong"
 hd_lubu_exile.0003.desc:0 "Guanzhong has no place for you, but Guanzhong is not the whole realm.\n\nChen Gong spreads a map beneath the lamplight. His finger traces a route east and stops at Yanzhou. Cao Cao, he says, is far away; the commandery administrators have ambitions of their own, and no one can truly keep order around Jiyang. A claim to authority can be fought for, so long as you have troops.\n\nYour veterans are assembled and the grain wagons are ready. You plant the butt of your halberd on the ground and tell them: eastward! First Jiyang, then Yanzhou!"
 hd_lubu_exile.0003.a:0 "Break camp and march east. Take Jiyang first."
 hd_lubu_exile.0003.a.tt:0 "You will soon go to war to capture Jiyang."
