 WJ_court_taiyiling:0 "Prefect of Imperial Physicians"
 WJ_court_taiyiling_desc:0 "The $WJ_court_taiyiling$ is responsible for the health and well-being of the [court|E] they serve. They do their utmost to cure illness and stitch wounds."
 WJ_court_yishi:0 "Physician"
 WJ_court_yishi_desc:0 "The $WJ_court_yishi$ is responsible for the health and well-being of the [court|E] they serve. They do their utmost to cure illness and stitch wounds."
 WJ_court_jiayi:0 "Household Physician"
 WJ_court_jiayi_desc:0 "The $WJ_court_jiayi$ is responsible for the health and well-being of the [court|E] they serve. They do their utmost to cure illness and stitch wounds."
 WJ_court_shaofucheng:0 "Deputy Minister of the Privy Treasury"
 WJ_court_shaofucheng_desc:0 "The $WJ_court_shaofucheng$ plays an important part in the daily life of the ruling house, managing the servants and ensuring that everything runs smoothly."
 WJ_court_taizhongdafu:0 "Grand Palace Counselor"
 WJ_court_taizhongdafu_desc:0 "The $WJ_court_taizhongdafu$ is responsible for the [education|E] of all children at court, and their ability influences their pupils. Children may still have their own [guardians|E]."
 WJ_court_jingshi:0 "Master of the Classics"
 WJ_court_jingshi_desc:0 "The $WJ_court_jingshi$ is responsible for the [education|E] of all children at court, and their ability influences their pupils. Children may still have their own [guardians|E]."
 WJ_court_jiashushi:0 "Family Tutor"
 WJ_court_jiashushi_desc:0 "The $WJ_court_jiashushi$ is responsible for the [education|E] of all children at court, and their ability influences their pupils. Children may still have their own [guardians|E]."
 WJ_court_zhongchangshi:0 "Central Attendant-in-Ordinary"
 WJ_court_zhongchangshi_desc:0 "$WJ_court_zhongchangshi$ is a trusted servant who oversees the court's eunuchs. Little that happens among the servants and imperial kin escapes their attention."
 WJ_court_muli:0 "Stable Official"
 WJ_court_muli_desc:0 "$WJ_court_muli$ tends the lord's horses and stables. The work is demanding, but well-cared-for horses are an asset both on the road and in battle."
 WJ_court_yuzhe:0 "Imperial Charioteer"
 WJ_court_yuzhe_desc:0 "$WJ_court_yuzhe$ tends the emperor's horses and stables. The work is demanding, but well-cared-for horses are an asset both on the road and in battle."
 WJ_court_sanqishilang:0 "Cavalier Attendant Gentleman"
 WJ_court_sanqishilang_desc:0 "$WJ_court_sanqishilang$ is a master of words and verse, bringing pleasure, intellectual stimulation, and a range of emotions to the lord and the court."
 WJ_court_wenxue:0 "Literary Scholar"
 WJ_court_wenxue_desc:0 "$WJ_court_wenxue$ is a master of words and verse, bringing pleasure, intellectual stimulation, and a range of emotions to the lord and the court."
 WJ_court_yuegong:0 "Musician"
 WJ_court_yuegong_desc:0 "The $WJ_court_yuegong$ is an artist who entertains the lord and court with song and music."
 WJ_court_yueshi:0 "Music Master"
 WJ_court_yueshi_desc:0 "The $WJ_court_yueshi$ is an artist who entertains the lord and court with song and music."
 WJ_court_hubenlang:0 "Tiger Guard"
 WJ_court_hubenlang_desc:0 "$WJ_court_hubenlang$ is the last line of defense against an attacker. They go wherever their charge goes and place themselves in the path of danger without hesitation."
 WJ_court_suwei:0 "Palace Guard"
 WJ_court_suwei_desc:0 "$WJ_court_suwei$ is the last line of defense against an attacker. They go wherever their charge goes and place themselves in the path of danger without hesitation."
 WJ_court_qinwei:0 "Personal Guard"
 WJ_court_qinwei_desc:0 "$WJ_court_qinwei$ is the last line of defense against an attacker. They go wherever their charge goes and place themselves in the path of danger without hesitation."
 WJ_court_huyuan:0 "Household Guard"
 WJ_court_huyuan_desc:0 "$WJ_court_huyuan$ is the last line of defense against an attacker. They go wherever their charge goes and place themselves in the path of danger without hesitation."
 WJ_court_guangludafu:0 "Counselor of the Palace"
 WJ_court_guangludafu_desc:0 "$WJ_court_guangludafu$ serves as the court's moral exemplar, practicing benevolence and righteousness as a model for all officials."
 WJ_court_sanqichangshi:0 "Cavalier Regular Attendant"
 WJ_court_sanqichangshi_desc:0 "$WJ_court_sanqichangshi$ educates and guides the young members of the imperial clan, keeping the next generation true to the example of its ancestors."
 WJ_court_zhonghujun:0 "Central Protector of the Army"
 WJ_court_zhonghujun_desc:0 "$WJ_court_zhonghujun$ is a pillar of the empire, respected for distinguished military service and strategic skill."
 WJ_court_shizhong:0 "Palace Attendant"
 WJ_court_shizhong_desc:0 "The $WJ_court_shizhong$ is the sovereign's close attendant, at hand for counsel and taking part in government. Their functions and benefits are determined by the court position and the chosen task."
 WJ_desc_councillor_chancellor:0 "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_chancellor', SCOPE.sC('councillor_liege'))] is the highest-ranking [minister|E] and is responsible for foreign affairs, usually also serving as [grand_secretariat_director|E].\n\n[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_chancellor', SCOPE.sC('councillor_liege'))] may be designated [grand_secretariat_director|E], depending on the #V [GetLawGroup('grand_secretariat_laws').GetName]#! [law|E].\n\n$WJ_desc_councillor_chancellor_actions$"
 WJ_desc_councillor_chancellor_actions:0 "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_chancellor', SCOPE.sC('councillor_liege'))] can:\n$BULLET$Use the [GetDecision('favored_movement_consults_heaven_decision').GetName|V] [decision|E]\n$BULLET$Summon a [courtier|E] of any type through the [GetDecision('tgp_minister_recruit_courtiers_decision').GetName|V] [decision|E]\n$BULLET$Launch the [GetGreatProjectType('minister_compel_religious_uniformity').GetName|V] [great_project|E]\n$BULLET$Use the special #V $influence_meritorious_career_interaction$#! [interaction|E] option at a lower cost#!#!"
 WJ_desc_councillor_chancellor_local:0 "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_chancellor', SCOPE.sC('councillor_liege'))] is the [councillor|E] responsible for relations within and beyond the [realm|E]."
 WJ_desc_councillor_steward:0 "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_steward', SCOPE.sC('councillor_liege'))] is the [minister|E] responsible for [taxation|E], assisting the [son_of_heaven|E] in matters of the [treasury|E].\n\n$WJ_desc_councillor_steward_actions$"
 WJ_desc_councillor_steward_actions:0 "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_steward', SCOPE.sC('councillor_liege'))] can:\n$BULLET$Help [vassals|E] who #V $celestial_request_treasury_interaction$#!\n$BULLET$Use the [GetDecision('tgp_suggest_budget_change_decision').GetName|V] [decision|E]\n$BULLET$Launch the [GetGreatProjectType('minister_project_conduct_census').GetName|V] [great_project|E]\n$BULLET$Use the #V $pay_treasury_debt_interaction$#! [interaction|E] to clear the [treasury_debt|E] of [civilian_governors|E], which triggers the #V '$catalyst_cleared_treasury_debt$'#! [dynastic_cycle_catalyst|E]\n$BULLET$Use the special #V $influence_meritorious_career_interaction$#! [interaction|E] option#!#!"
 WJ_desc_councillor_steward_local:0 "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_steward', SCOPE.sC('councillor_liege'))] is the [councillor|E] responsible for managing the [domain|E], including matters of [taxation|E], [culture|E] and [development|E]."
 WJ_desc_councillor_marshal:0 "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_marshal', SCOPE.sC('councillor_liege'))] is the [minister|E] responsible for the military administration of the troops. When subordinate [governors|E] need military aid, [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_marshal', SCOPE.sC('councillor_liege'))] can dispatch military officials to assist them.\n\nThis councillor is not a [commander|E] and does not lead troops; that is the work of the [minister_grand_marshal|E].\n\n#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_marshal', SCOPE.sC('councillor_liege'))] can:\n$BULLET$Send aid to [vassals|E] at [war|E] who can #V $celestial_request_military_aid_interaction$#!\n$BULLET$Order [military_governors|E] to join the [wars|E] of other [governors|E]#!#!\n\n$WJ_desc_councillor_marshal_actions$"
 WJ_desc_councillor_marshal_actions:0 "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_marshal', SCOPE.sC('councillor_liege'))] can:\n$BULLET$Send reinforcements to [vassals|E] at [war|E] who #V $celestial_request_military_aid_interaction$#!\n$BULLET$Order [military_governors|E] to join the [wars|E] of other [governors|E]\n$BULLET$Launch the [GetGreatProjectType('minister_project_train_troops').GetName|V] [great_project|E]\n$BULLET$Use the #V $pay_treasury_debt_interaction$#! [interaction|E] to clear the [treasury_debt|E] of [military_governors|E], triggering the #V '$catalyst_cleared_treasury_debt$'#! [dynastic_cycle_catalyst|E]\n$BULLET$Use the special #V $influence_meritorious_career_interaction$#! [interaction|E] options#!#!"
 WJ_desc_councillor_marshal_local:0 "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_marshal', SCOPE.sC('councillor_liege'))] is your supreme [commander|E] and the [councillor|E] in charge of all military affairs."
 WJ_desc_councillor_spymaster:0 "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_spymaster', SCOPE.sC('councillor_liege'))] is the [minister|E] responsible for intrigue and intelligence.\n\nBeware a disloyal [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_spymaster', SCOPE.sC('councillor_liege'))], for they can easily conceal, or even take part in, [schemes|E] against you and your [close_family|E]!\n\nThe [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_spymaster', SCOPE.sC('councillor_liege'))] may be appointed [grand_secretariat_director|E], depending on the [GetLawGroup('grand_secretariat_laws').GetName|V] [law|E].\n\n$WJ_desc_councillor_spymaster_actions$"
 WJ_desc_councillor_spymaster_actions:0 "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_spymaster', SCOPE.sC('councillor_liege'))] can:\n$BULLET$Use the #V $censor_find_secrets_interaction$#! [interaction|E] to uncover [secrets|E] in the [courts|E] of a [vassal|E], earning a [gold_i][gold|E] reward from the [liege|E] or gaining [hooks|E]\n$BULLET$[blackmail|E] triggers the #V '$catalyst_minister_blackmailed$'#! [dynastic_cycle_catalyst|E]\n$BULLET$Use the special #V $influence_meritorious_career_interaction$#! [interaction|E] options#!#!"
 WJ_desc_councillor_spymaster_local:0 "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_spymaster', SCOPE.sC('councillor_liege'))] is the [councillor|E] responsible for plots and espionage. Beware a disloyal [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_spymaster', SCOPE.sC('councillor_liege'))], for they can easily conceal, or even take part in, a [GetScheme('murder').GetTypeName] against you and your closest kin!"
 WJ_desc_councillor_court_chaplain:0 "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_court_chaplain', SCOPE.sC('councillor_liege'))] is the [minister|E] responsible for religious and spiritual matters, and may help [governors|E] hold [examinations|E].\n\n$WJ_desc_councillor_court_chaplain_actions$"
 WJ_desc_councillor_court_chaplain_actions:0 "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_court_chaplain', SCOPE.sC('councillor_liege'))] can:\n$BULLET$Launch the [GetGreatProjectType('minister_project_culture').GetName|V] [great_project|E]\n$BULLET$Launch the [GetGreatProjectType('minister_compel_religious_uniformity').GetName|V] [great_project|E]\n$BULLET$Assist [vassals|E] in holding [examinations|E]\n$BULLET$#V $demand_conversion_minister_rites_interaction$#! on [characters|E] of [faith_hostile|E] or [faith_evil|E] [faiths|E]\n$BULLET$Use the special #V $influence_meritorious_career_interaction$#! [interaction|E] options#!#!"
 WJ_desc_minister_personnel:0 "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_personnel', SCOPE.sC('councillor_liege'))] is the [minister|E] with full charge of [appointments|E], and can greatly influence the [candidate_score|E] of other [characters|E].\n\n$WJ_desc_minister_personnel_actions$"
 WJ_desc_minister_personnel_actions:0 "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_personnel', SCOPE.sC('councillor_liege'))] can:\n$BULLET$Dismiss [governors|E] with the #V $force_governor_removal_interaction$#! [interaction|E], ignoring the [GetLawGroup('celestial_retirement_law').GetName] [law|E]\n$BULLET$Invite any type of [courtier|E] with the [GetDecision('tgp_minister_recruit_courtiers_decision').GetName|V] [decision|E]\n$BULLET$Force acceptance of the #V $offer_courtier_interaction$#! and #V $demand_courtier_interaction$#! [interactions|E]\n$BULLET$Use the special #V $influence_meritorious_career_interaction$#! [interaction|E] options at a lower cost#!#!"
 WJ_desc_minister_justice:0 "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_justice', SCOPE.sC('councillor_liege'))] is the [minister|E] responsible for legal affairs, assisting the [son_of_heaven|E] in upholding justice.\n\n$WJ_desc_minister_justice_actions$"
 WJ_desc_minister_justice_actions:0 "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_justice', SCOPE.sC('councillor_liege'))] can:\n$BULLET$Launch the [GetGreatProjectType('minister_project_establish_control').GetName|V] [great_project|E]\n$BULLET$Use the #V $imprison_interaction$#! [interaction|E] on [vassals|E] and [courtiers|E], which they cannot refuse\n$BULLET$Use the #V $pardon_interaction$#! [interaction|E] on [characters|E] who have committed [crimes|E]\n$BULLET$Use the $censor_find_secrets_interaction$ [interaction|E] to uncover [secrets|E] in [vassal|E] [courts|E], and [imprison|E] or pardon known [criminals|E]\n$BULLET$Exposing [secrets|E] triggers the '$catalyst_minister_exposed_secret$' [dynastic_cycle_catalyst|E]\n$BULLET$Use the special #V $influence_meritorious_career_interaction$#! [interaction|E] options#!#!"
 WJ_desc_minister_works:0 "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_works', SCOPE.sC('councillor_liege'))] is the [minister|E] responsible for the construction and development of the [realm|E], and may launch [great_projects|E].\n\n$WJ_desc_minister_works_actions$"
 WJ_desc_minister_works_actions:0 "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_works', SCOPE.sC('councillor_liege'))] can:\n$BULLET$Launch the [GetGreatProjectType('minister_project_development').GetName|V] [great_project|E]\n$BULLET$Launch the [GetGreatProjectType('grand_canals').GetName|V] [great_project|E]\n$BULLET$Launch the [GetGreatProjectType('great_wall').GetName|V] [great_project|E]\n$BULLET$Construct [buildings|E] and [holdings|E] within the [realm|E]\n$BULLET$During the [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName] [dynastic_cycle_era_short|E], construct [buildings|E] and [holdings|E] in the lands of the [son_of_heaven|E]'s [tributaries|E]\n$BULLET$Use the special #V $influence_meritorious_career_interaction$#! [interaction|E] options#!#!"
 WJ_desc_minister_grand_marshal:0 "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_grand_marshal', SCOPE.sC('councillor_liege'))] is the highest military official of the [realm|E], commanding a [title_men_at_arms|E] [army|E].\n\nThe [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_grand_marshal', SCOPE.sC('councillor_liege'))] may be appointed [grand_secretariat_director|E], depending on the #V [GetLawGroup('grand_secretariat_laws').GetName]#! [law|E].\n\n$WJ_desc_minister_grand_marshal_actions$"
 WJ_desc_minister_grand_marshal_actions:0 "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_grand_marshal', SCOPE.sC('councillor_liege'))] can:\n$BULLET$Launch the #V Frontier Expansion#! [great_project|E]\n$BULLET$Launch the [GetGreatProjectType('construct_great_barracks').GetName|V] [great_project|E]\n$BULLET$Use the #V $CHINA_SEIZE_COUNTY_CB_NAME$#! and #V $CHINA_SEIZE_DUCHY_CB_NAME$#! [casus_bellis|E] during the [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName] and [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability_conquest').GetName] [dynastic_cycle_eras_short|E]\n$BULLET$Use the special #V $influence_meritorious_career_interaction$#! [interaction|E] options#!#!"
 WJ_desc_court_poet_court_position_task_create_poetry:0 "Your [CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)] will compose and recite splendid verses extolling you, your realm, and your achievements."
 WJ_desc_grand_guardian_court_position_task_guard_the_capital:0 "The [CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)] will be responsible for the security of the imperial capital."
 WJ_desc_grand_guardian_court_position_task_shield_the_realm:0 "The [CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)] will bring their martial prowess and strategic skill to bear in defense of the entire empire."
 WJ_desc_grand_guardian_court_position_task_instill_martial_discipline:0 "The [CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)] will strive to pass on the experience gained in the ranks to those who have yet to see battle."
 WJ_desc_grand_mentor_court_position_task_teach_liege:0 "The [CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)] will devote themselves to educating their liege."
 WJ_desc_grand_mentor_court_position_task_edify_heirs:0 "The [CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)] will devote themselves to nurturing the empire's next generation."
 WJ_desc_grand_mentor_court_position_task_train_officials:0 "The [CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)] will ensure that officials throughout the realm share their own wisdom, virtue, and skill."
 WJ_desc_grand_preceptor_court_position_task_instill_righteousness:0 "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)] will guide these vassals toward upright conduct on their liege's behalf."
 WJ_desc_grand_preceptor_court_position_task_propagate_civic_virtue:0 "The [CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)] will be responsible for spreading the teachings of ritual and music among the common people."
 WJ_desc_grand_preceptor_court_position_task_exalt_imperial_deeds:0 "As [CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)], this character's words carry profound moral weight, and many are inclined to take them as truth."
