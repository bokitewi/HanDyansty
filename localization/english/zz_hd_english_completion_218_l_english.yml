 e_hd218_wei_adj: "Wei"
 hd218_han_name: "Han"
 hd218_han_name_adj: "Han"
 hd218_hanzhong_mobilized_army: "Hanzhong Reinforcements"
 hd218_hanzhong_name: "Hanzhong"
 hd218_hanzhong_name_adj: "Hanzhong"
 hd218_wu_name: "Wu"
 hd218_wu_name_adj: "Wu"
 hd_sg218.0020.a: "Execute every conspirator as a warning to others."
 hd_sg218.0020.b: "Imprison them for now, and consider their fate."
 hd_sg218.0020.desc: "In the first month of the twenty-third year of Jian'an, Geng Ji, Minister of the Privy Treasury, Wei Huang, Judicial Supervisor, Ji Ben, Prefect of Imperial Physicians, and Jin Yi plotted to seize the Son of Heaven and attack the King of Wei. At night, they led more than a thousand household retainers to set fire to the gates of Chief Clerk Wang Bi's camp. Struck by an arrow, Wang Bi fled to Yan Kuang, Agricultural General of the Household. Together they crushed the rebels, but Wang Bi's wound was severe, and he died a few days later.\n\nAll the conspirators have been captured and await judgment."
 hd_sg218.0020.t: "Geng Ji's Conspiracy"
 hd_sg218.0030.a: "Order Cao Zhang to march north."
 hd_sg218.0030.b: "Send envoys to offer terms."
 hd_sg218.0030.desc: "Nengchendi and other Wuhuan leaders in Dai Commandery have risen in revolt, shaking the northern frontier. Cao Zhang, Marquis of Yanling, requests command of an expedition beyond the border as Northern General of the Household and Acting General of Valiant Cavalry.\n\nBefore he leaves, I must remind him: at home we are father and son; in the service of the state, ruler and subject. In all things, he must act according to the king's law."
 hd_sg218.0030.t: "Cao Zhang's Northern Expedition"
 hd_sg218.0040.a: "Order Cao Ren to return and crush the revolt."
 hd_sg218.0040.b: "Offer terms for now."
 hd_sg218.0040.desc: "The officials and people of Nanyang suffer under the burden of corvee labor. Hou Yin, commander of Wan, has joined Wei Kai and others to rally the populace, seize the city, and rebel. They have taken the commandery's governor captive and coordinated their actions with Guan Yu from afar. Wan controls the heart of Nanyang. Unless this revolt is swiftly suppressed, northern Jingzhou may face a much greater upheaval."
 hd_sg218.0040.t: "Hou Yin Seizes Wan"
 hd_sg218.0050.a: "Veteran Huang Zhong's deed surpasses all others in the army!"
 hd_sg218.0050.desc: "The struggle for Hanzhong has dragged on for years. Huang Zhong attacked from the heights, his men shouting as gongs and drums shook the heavens and cheers echoed through the valleys. In a single battle at Mount Dingjun, he slew Xiahou Yuan.\n\nCao's army has lost its commander. The gates of Hanzhong stand open."
 hd_sg218.0050.t: "Mount Dingjun"
 hd_sg218.0060.a: "Hanzhong is secure. Choose a capable general to guard it."
 hd_sg218.0060.desc: "Cao's army has withdrawn from Hanzhong, leaving it entirely in the hands of [ROOT.Char.GetShortUIName].\n\nTo the east, the commanderies of Shangyong, Fangling, and Weixing have lost their protection. Their commanders surrender or flee, and the three eastern commanderies have submitted as well."
 hd_sg218.0060.t: "Who Holds Hanzhong"
 hd_sg218.0070.a: "March north against Xiangyang and Fancheng."
 hd_sg218.0070.b: "Hold Jiangling and await an opportunity."
 hd_sg218.0070.desc: "Hanzhong is secured, yet Jingzhou's troops have long remained idle. Cao Ren is stationed at Fancheng. Across the Han River stands Xiangyang; together, the two cities guard the way north into the Central Plains.\n\nThe time has come to leave troops guarding Gong'an and Nan Commandery, and personally lead the main army north against Xiangyang and Fancheng."
 hd_sg218.0070.t: "The Battle of Xiangyang and Fancheng"
 hd_sg218.0080.a: "Execute Pang De."
 hd_sg218.0080.b: "Keep him captive until he submits."
 hd_sg218.0080.desc: "Heavy autumn rains have sent the Han River surging over its banks, flooding the plains to a depth of several zhang. All seven armies under Yu Jin have been submerged. From high ground, Yu Jin gazed across the waters and saw no escape; he begged to surrender. Pang De, General Who Establishes Righteousness, has been captured, but remains standing and refuses to kneel.\n\nMy name now strikes awe throughout Huaxia. Bandit leaders south of Xudu have accepted seals and titles from afar, and the King of Wei has even discussed moving the capital away from Xudu to escape the force of my advance."
 hd_sg218.0080.t: "Seven Armies Beneath the Flood"
 hd_sg218.0090.a: "Seize Jingzhou by surprise."
 hd_sg218.0090.b: "Watch and wait."
 hd_sg218.0090.desc: "Guan Yu has committed Jingzhou's troops to the northern attack on Xiangyang and Fancheng, leaving his rear exposed. Lu Meng proposes concealing picked soldiers aboard boats and dressing the oarsmen in plain white clothes, disguised as merchants. Traveling day and night, they can capture every watch post along the river.\n\nMi Fang in Nan Commandery and Shi Ren in Gong'an have long been at odds with Guan Yu. They may surrender without a fight."
 hd_sg218.0090.t: "Crossing the River in White"
 hd_sg218.0100.a: "Execute him and end the threat."
 hd_sg218.0100.b: "Imprison him, but spare his life."
 hd_sg218.0100.desc: "With Jingzhou lost, Guan Yu retreated to Maicheng, but his soldiers deserted him. Fleeing west to Linju, he was captured by Ma Zhong, an officer serving under Pan Zhang.\n\nGuan Yu is one of the greatest generals of this age. His fate is a matter of grave consequence."
 hd_sg218.0100.t: "Retreat to Maicheng"
 hd_sg218.0110.a: "Carry on the late king's ambition."
 hd_sg218.0110.desc: "Cao Cao, King of Wei, has died in Luoyang. His final command declared that the realm remained unsettled and ancient mourning customs could not be observed: all were to lay aside mourning dress once the burial was complete. Crown Prince [ROOT.Char.GetName] succeeds him as King of Wei and Chancellor, and assumes the governorship of Jizhou."
 hd_sg218.0110.t: "Succession to the Throne of Wei"
 hd_sg218.0130.a: "Ascend the imperial throne in Chengdu."
 hd_sg218.0130.b: "Decline for now."
 hd_sg218.0130.desc: "Rumor holds that the Han Emperor has been forced to abdicate in favor of Wei. My officials petition me: Cao Pi has usurped the throne and murdered its rightful ruler, extinguishing the House of Han and stealing the imperial regalia. Your Majesty must ascend the imperial throne, continue the legacy of the two founding emperors, and preserve the ancestral succession.\n\nIf I ascend the throne, my kingdom will be renamed 'Han'."
 hd_sg218.0130.t: "Liu Bei Proclaims Himself Emperor"
 hd_sg218.0150.a: "Alas! Fei is dead."
 hd_sg218.0150.desc: "Zhang Fei, General of Chariots and Cavalry, respected gentlemen but showed little care for lesser men. He often flogged his soldiers, yet kept them close at hand. His officers Zhang Da and Fan Qiang waited until he lay asleep in a drunken stupor, murdered him, and carried his head downstream to seek refuge with Sun Quan."
 hd_sg218.0150.t: "Zhang Fei Murdered"
 hd_sg218.0160.a: "March east against Sun Quan."
 hd_sg218.0160.b: "Heed my officials' counsel."
 hd_sg218.0160.desc: "Guan Yu has died at Sun Quan's hands, and all of Jingzhou is lost. Many of my officials urge restraint: the Cao family are the enemies of the state, they say, not Sun Quan. We should not leave Wei untouched to fight Wu first.\n\nYet Yunchang's death demands vengeance."
 hd_sg218.0160.t: "The Battle of Yiling"
 hd_sg218.0170.a: "To be humiliated by Lu Xun! Is this Heaven's will?"
 hd_sg218.0170.desc: "From Jianping in the Wu Gorge to the borders of Yiling, the Shu army established dozens of positions, its linked camps stretching over seven hundred li. Lu Xun ordered each soldier to carry a bundle of dry grass and set the camps alight. The attacks succeeded together: Zhang Nan and Feng Xi were slain, and more than forty camps were overrun.\n\nThe army has scattered. Ships, equipment, and the supplies of both land and river forces have been all but lost."
 hd_sg218.0170.t: "The Linked Camps Ablaze"
 hd_sg218.0180.a: "Let the Chancellor decide every affair of state, great or small."
 hd_sg218.0180.desc: "As his illness grew grave, the late emperor summoned Chancellor Zhuge Liang to Yong'an and entrusted him with the future: 'Your talent is ten times that of Cao Pi. You will surely secure the state and complete our great undertaking. If my heir can be supported, support him. If he proves unworthy, you may take the throne yourself.'\n\nZhuge Liang wept: 'I will devote all my strength, serve with steadfast loyalty, and continue until death!'"
 hd_sg218.0180.t: "Entrusting the Heir at Baidi"
 hd_sg218.0190.a: "The state mourns its emperor; first seek to pacify them."
 hd_sg218.0190.desc: "The late emperor has barely been laid to rest. Yong Kai, a powerful magnate of Yizhou Commandery, has killed the governor and joined Sun Quan. Gao Ding, king of the native peoples of Yuexi, and Zhu Bao, Governor of Zangke, have risen in support, while Meng Huo has also joined Yong Kai. The commanderies of Nanzhong have all been lost in a single stroke."
 hd_sg218.0190.t: "Rebellion in Nanzhong"
 hd_sg218.0200.a: "Authorize the Chancellor's southern expedition."
 hd_sg218.0200.b: "Close the passes and let the people rest. Reconsider next year."
 hd_sg218.0200.desc: "The rebellion in Nanzhong has endured for some time, but the realm is gradually settling. The Chancellor requests permission to lead an expedition south: 'In warfare, winning hearts is better than taking cities; overcoming the mind is better than overcoming soldiers.'"
 hd_sg218.0200.t: "The Chancellor Marches South"
 hd_sg218.0205.a: "Nanzhong is pacified."
 hd_sg218.0205.desc: "Meng Huo commands the respect of both the native peoples and the Han. The Chancellor captured him alive, showed him the army's formations, and released him to fight again. Seven times he was released, and seven times captured. When Liang offered to release him once more, Meng Huo refused to leave: 'My lord, your might is Heaven's own. The people of the south will never rebel again.'"
 hd_sg218.0205.t: "Seven Captures of Meng Huo"
 hd_sg218.0210.a: "Approve the memorial and send forth the army."
 hd_sg218.0210.b: "The realm has yet to recover. Reconsider next year."
 hd_sg218.0210.desc: "The south is settled, and our soldiers and arms are ready. The Chancellor submits a memorial: 'We must inspire and lead the armies north to secure the Central Plains. I shall exhaust my humble abilities, drive out the treacherous and wicked, restore the House of Han, and return to the old capital.'\n\nThe army will advance through Qishan and take the three commanderies of Tianshui, Nan'an, and Anding."
 hd_sg218.0210.t: "Memorial on the Expedition"
 hd_sg218.0211.a: "A worthy talent joins us."
 hd_sg218.0211.desc: "Jiang Wei, General of the Household in Tianshui, fell under his governor's suspicion. With neither retreat nor advance open to him, he sought out the Chancellor and surrendered. The Chancellor praises his loyal attention to affairs and meticulous judgment, calling him one of Liangzhou's finest men."
 hd_sg218.0211.t: "Jiang Wei Surrenders"
 hd_sg218.0212.a: "Execute Ma Su, though it brings me to tears."
 hd_sg218.0212.b: "Spare his life, but strip him of office."
 hd_sg218.0212.desc: "Ma Su disobeyed Liang's orders, abandoning the water sources to camp on the heights and throwing his command into confusion. Zhang He cut off his access to water and routed him, scattering his soldiers. With Jieting lost, the main army has no foothold from which to advance."
 hd_sg218.0212.t: "The Loss of Jieting"
 hd_sg218.0510.desc: "In the twenty-third year of Jian'an, [hd_news_a.GetName] has advanced into Hanzhong to contest Yizhou's northern gateway with [hd_news_b.GetName].\n\nIf Hanzhong falls, the armies of Ba and Shu can march north into the Qin plains. If it holds, the southwest will remain locked among the mountains."
 hd_sg218.0510.t: "The War for Hanzhong"
 hd_sg218.0520.desc: "In Xudu, [hd_news_b.GetName] and fellow conspirators set fires and rose in revolt, seeking to seize the Son of Heaven and attack [hd_news_a.GetName]. They were swiftly crushed.\n\nThe House of Han's last attempt to draw its sword in Xudu has been extinguished."
 hd_sg218.0520.t: "Revolt in Xudu"
 hd_sg218.0530.desc: "The Wuhuan leader [hd_news_b.GetName] of Dai Commandery has risen against Wei. [hd_news_a.GetName] has ordered his son Cao Zhang to march north."
 hd_sg218.0530.t: "The Wuhuan Rebel Again"
 hd_sg218.0535.desc: "[hd_news_a.GetName] has crushed the Wuhuan and pursued their fleeing forces. The Xianbei leader [hd_news_b.GetName], who had been watching from the sidelines, saw the Wuhuan defeated and sent envoys offering submission."
 hd_sg218.0535.t: "The North Secured"
 hd_sg218.0540.desc: "With Nanyang's officials and people suffering under corvee labor, [hd_news_a.GetName] has seized Wan and risen in revolt, shaking northern Jingzhou."
 hd_sg218.0540.t: "Rebellion in Wan"
 hd_sg218.0550.desc: "Huang Zhong has slain Xiahou Yuan at Mount Dingjun. The garrison forces of [hd_news_b.GetName] in Hanzhong have lost their commander."
 hd_sg218.0550.t: "Mount Dingjun"
 hd_sg218.0560.desc: "The war for Hanzhong has ended. [hd_news_a.GetName] has taken the whole region, opening the gateway to the southwest."
 hd_sg218.0560.t: "Hanzhong Changes Hands"
 hd_sg218.0570.desc: "[hd_news_a.GetName] has left troops to guard Nan Commandery and personally led Jingzhou's army north against Xiangyang and Fancheng, confronting the garrisons of [hd_news_b.GetName] across the Han River."
 hd_sg218.0570.t: "Guan Yu's Northern Expedition"
 hd_sg218.0580.desc: "The Han River has burst its banks, submerging all seven of Yu Jin's armies and leaving Pang De a captive. The might of [hd_news_a.GetName] strikes awe throughout Huaxia. [hd_news_b.GetName] even considered moving the capital away from Xudu to escape the force of this advance."
 hd_sg218.0580.t: "Awe Throughout Huaxia"
 hd_sg218.0590.desc: "Taking advantage of the northern expedition of [hd_news_b.GetName], [hd_news_a.GetName] has ordered Lu Meng to cross the river in plain white clothes and seize Jingzhou by surprise."
 hd_sg218.0590.t: "Crossing the River in White"
 hd_sg218.0600.desc: "[hd_news_b.GetName] retreated to Maicheng, was captured by [hd_news_a.GetName], and died without yielding.\n\nJingzhou's loss and Yunchang's death will have to be avenged, sooner or later."
 hd_sg218.0600.t: "The Death of Guan Yu"
 hd_sg218.0610.desc: "Cao Cao, King of Wei, has died. [hd_news_a.GetName] has succeeded him as King of Wei and Chancellor."
 hd_sg218.0610.t: "The King of Wei Dies"
 hd_sg218.0620.desc: "[hd_news_a.GetName] has built an altar and accepted the imperial throne, while [hd_news_b.GetName] has abdicated. After four hundred years of Han rule, the dynasty has changed."
 hd_sg218.0620.t: "Wei Succeeds Han"
 hd_sg218.0630.desc: "South of Wudan in Chengdu, [hd_news_a.GetName] has ascended the imperial throne to continue the Han dynasty, refusing to recognize the transfer of power to [hd_news_b.GetName]."
 hd_sg218.0630.t: "The Han Emperor Ascends the Throne"
 hd_sg218.0650.desc: "[hd_news_b.GetName] has been murdered by Zhang Da, an officer under his command. Zhang Da carried his head away to seek refuge with Sun Quan."
 hd_sg218.0650.t: "Zhang Fei Murdered"
 hd_sg218.0660.desc: "[hd_news_a.GetName] has personally led a great army east against [hd_news_b.GetName], vowing to avenge Guan Yu."
 hd_sg218.0660.t: "The Battle of Yiling"
 hd_sg218.0670.desc: "[hd_news_b.GetName] has set ablaze seven hundred li of linked camps. [hd_news_a.GetName] has suffered a crushing defeat and fled."
 hd_sg218.0670.t: "The Linked Camps Ablaze"
 hd_sg218.0680.desc: "[hd_news_a.GetName] has succeeded to the throne. [hd_news_b.GetName] has been entrusted by the late emperor's final decree to assist in governing. Every affair of state, great or small, is now decided by the Chancellor."
 hd_sg218.0680.t: "Entrusting the Heir at Baidi"
 hd_sg218.0690.desc: "As the realm of [hd_news_a.GetName] mourns its emperor, powerful families and native chieftains across Nanzhong have seized the opportunity to rebel."
 hd_sg218.0690.t: "Rebellion in Nanzhong"
 hd_sg218.0700.desc: "[hd_news_b.GetName] has led an expedition south and suppressed the rebellion in Nanzhong."
 hd_sg218.0700.t: "The Chancellor Marches South"
 hd_sg218.0705.desc: "Captured and released seven times, [hd_news_b.GetName] has finally submitted wholeheartedly: 'My lord, your might is Heaven's own. The people of the south will never rebel again.'"
 hd_sg218.0705.t: "Seven Captures of Meng Huo"
 hd_sg218.0710.desc: "[hd_news_a.GetName] has launched a northern expedition. The army has advanced through Qishan to contest Longyou with [hd_news_b.GetName]."
 hd_sg218.0710.t: "The Northern Expedition"
 hd_sg218.0712.desc: "[hd_news_b.GetName] disobeyed orders and abandoned the water sources to camp on the heights. Jieting has fallen, leaving the northern expedition without a foothold from which to advance."
 hd_sg218.0712.t: "The Loss of Jieting"
