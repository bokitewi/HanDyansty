 #xiali
 xiali:0 "Xia Rituals"
 xiali_adj:0 "Xia Rituals"
 xiali_adherent:0 "The Six States"
 xiali_adherent_plural:0 "The Six States"
 xiali_desc:0 "The Xia rites refer to the ritual system of the Xia Dynasty, the earliest such system. The Xia rites not only laid the foundation for the ritual and music culture of the Shang and Zhou dynasties but also actually established the basis for the entire ritual culture of the Huaxia nation."
 
 xiali_religious_head_title:0 "Later"
 xiali_religious_head_title_name:0 "Xia"

 #yinli
 yinli:0 "Yin Ritual"
 yinli_adj:0 "Yin Ritual"
 yinli_adherent:0 "The Six States"
 yinli_adherent_plural:0 "The Six States"
 yinli_desc:0 "Yin rites, referring to the ritual system of the Shang Dynasty, were a product created by the Yin people drawing inspiration from and adapting the ritual systems of the Xia Dynasty."
 
 yinli_religious_head_title:0 "Emperor"
 yinli_religious_head_title_name:0 "Shang"

 #xizhouli
 xizhouli:0 "Western Zhou Rites"
 xizhouli_adj:0 "Western Zhou Rites"
 xizhouli_adherent:0 "The Six States"
 xizhouli_adherent_plural:0 "The Six States"
 xizhouli_desc:0 "At the dawn of the Zhou Dynasty, to support the feudal system that politically upheld the rule of the Western Zhou, Duke of Zhou Dan comprehensively reformed the ideological sphere. He extensively organized and transformed the rituals and music from antiquity through the Shang Dynasty, establishing a complete set of concrete and operational ritual and musical systems. This encompassed all aspects of social life, including diet, daily living, sacrifices, funerals, and more, bringing them all under the scope of \"Li\" (ritual)."

 xizhouli_religious_head_title:0 "The Son of Heaven"
 xizhouli_religious_head_title_name:0 "Zhou"
 
 #dongzhouli
 dongzhouli:0 "Eastern Zhou Rites"
 dongzhouli_adj:0 "Eastern Zhou Rites"
 dongzhouli_adherent:0 "The Six States"
 dongzhouli_adherent_plural:0 "The Six States"
 dongzhouli_desc:0 "After the disaster at Mount Li, the feudal lords led by Lord Shen and Lord Zeng installed the deposed crown prince Ji Yijiu as the Zhou Tianzi. From then on, the land of Huaxia entered an era of collapsed rituals and fierce competition among warlords. A large number of ambitious feudal lords were no longer content with the constraints of the old rites and systems; instead, they pursued schemes and warfare to fulfill their ambitions."

 dongzhouli_religious_head_title:0 "The Son of Heaven"
 dongzhouli_religious_head_title_name:0 "Zhou"
