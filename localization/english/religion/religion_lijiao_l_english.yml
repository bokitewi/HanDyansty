 lijiao_religion_desc:0 "In ancient China, Li (Rites) served as the foundational social institutions and moral norms. As a system of state institutions, it reflected the socio-political order, upholding the superstructure and the etiquette governing interpersonal interactions within that framework. As a set of moral standards, it established the criteria and requirements for conduct by state leaders, nobles, and all other members of society."

