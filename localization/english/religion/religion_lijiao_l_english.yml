 #xiali
 xiali:0 "Xia Rites"
 xiali_adj:0 "Xia Ritualist"
 xiali_adherent:0 "Six States"
 xiali_adherent_plural:0 "Six States"
 xiali_desc:0 "The rites of the Xia dynasty are the earliest system of ritual and music. They provided the foundation for Shang and Zhou ritual culture and, through them, for the wider ritual civilization of Huaxia."
 
 xiali_religious_head_title:0 "Sovereign"
 xiali_religious_head_title_name:0 "Xia"

 #yinli
 yinli:0 "Yin Rites"
 yinli_adj:0 "Yin Ritualist"
 yinli_adherent:0 "Six States"
 yinli_adherent_plural:0 "Six States"
 yinli_desc:0 "The rites of Yin are the ritual institutions of the Shang dynasty, developed by the Yin people through adapting and revising the earlier rites of Xia."
 
 yinli_religious_head_title:0 "Emperor"
 yinli_religious_head_title_name:0 "Shang"

 #xizhouli
 xizhouli:0 "Western Zhou Rites"
 xizhouli_adj:0 "Western Zhou Ritualist"
 xizhouli_adherent:0 "Six States"
 xizhouli_adherent_plural:0 "Six States"
 xizhouli_desc:0 "In the early Zhou dynasty, Dan, Duke of Zhou, comprehensively reformed the realm's ideas to support the system of enfeoffment that upheld Western Zhou rule. He collected and revised the rites and music inherited from antiquity through the Shang, establishing a complete, practical ritual system. From meals and daily life to sacrifice and burial, every aspect of society was brought within the bounds of ritual."

 xizhouli_religious_head_title:0 "Son of Heaven"
 xizhouli_religious_head_title_name:0 "Zhou"
 
 #dongzhouli
 dongzhouli:0 "Eastern Zhou Rites"
 dongzhouli_adj:0 "Eastern Zhou Ritualist"
 dongzhouli_adherent:0 "Six States"
 dongzhouli_adherent_plural:0 "Six States"
 dongzhouli_desc:0 "After the disaster at Lishan, the marquises of Shen and Zeng and other lords enthroned the deposed crown prince Ji Yijiu as the Son of Heaven of Zhou. Huaxia entered an age in which ritual and music lost their authority and rival lords contended for supremacy. Many ambitious rulers no longer accepted the restraints of the old ritual order, pursuing their aims through intrigue and war instead."

 dongzhouli_religious_head_title:0 "Son of Heaven"
 dongzhouli_religious_head_title_name:0 "Zhou"
