 chuwu:1 "Chu Wu"
 chuwu_adj:0 "Chu Wu"
 chuwu_adherent:1 "Believers"
 chuwu_adherent_plural:1 "Believers"
 chuwu_desc:0 "The beliefs of the Chu people were diverse, encompassing celestial deities, terrestrial spirits, and ancestral ghosts. The Chu veneration of Heaven was not merely an abstract concept but directed toward specific entities such as Taiyi, Dongjun, and Yunzhongjun. Reverence for Heaven and faith in ghosts and spirits necessitated the worship of shamans. Shamans possessed vast spiritual powers, able to bridge heaven and earth, commune with ghosts and spirits, and mediate between life and death. As Chu transitioned from clan-based systems into civilized society, both political activities and scientific knowledge were shrouded in superstition and dominated by divine affairs. Regarding the origin of the name \"Chu,\" opinions varied widely before the publication of the Tsinghua Bamboo Slips. After their release, the chapter \"Chu Ju\" within these slips records that during the birth of Xiong Li, wife Bi Li suffered a difficult labor; she underwent a cesarean section and died, while Xiong Li survived. Following Bi Li's death, a shaman wrapped her abdomen in \"Chu\" (a type of thorny branch) for burial. In her memory, later generations named their state \"Chu.\""

