 chuwu:1 "Chu Shamanism"
 chuwu_adj:0 "Chu Shamanism"
 chuwu_adherent:1 "Adherent"
 chuwu_adherent_plural:1 "Adherents"
 chuwu_desc:0 "Chu custom places great trust in shamans and spirits and embraces many forms of sacrifice. Donghuang Taiyi, Dongjun, and Yunzhongjun receive offerings, as do the spirits of mountains and rivers and the ghosts of the dead. Shamans dress in splendid robes, singing and dancing to delight the gods. They claim to bridge Heaven and Earth, converse with spirits, and mediate between life and death."

