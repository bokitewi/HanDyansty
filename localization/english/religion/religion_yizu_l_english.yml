 baiyuefanlin_desc:0 "The Yue Shaman represents the shamanistic traditions passed down through generations among the various Yue tribes. Followers hold reverence for mountains, rivers, forests, and the myriad spirits of seas and rivers, maintaining clan bonds and ties to their homeland through sacrificial songs, divination, and ancestor rituals, while believing that brave and resolute ancestors will continue to protect the living."

