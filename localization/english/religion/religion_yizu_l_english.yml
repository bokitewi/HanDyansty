 baiyuefanlin_adherent_plural:1 "Yue Shamanists"
 baiyuefanlin_desc:0 "The Yue trust in spirits and delight in worship, revering the myriad powers of mountains, rivers, trees, and seas. Shamans commune with them through ritual songs and divination with chickens, seeking knowledge of good and ill fortune. The clans believe their brave ancestors endure after death, protecting their descendants and their homeland."

