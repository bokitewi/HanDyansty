 nanfangzongjiao_religion_desc:0 "The southern peoples of the pre-Qin period had their own religious beliefs very early on. Through long-term historical development, religious beliefs varied across different regions, encompassing pantheism among the Baiyue tribes, Chu shamanism, Miao shamanism, nature worship, totem worship, spirit worship, and ancestor worship."

