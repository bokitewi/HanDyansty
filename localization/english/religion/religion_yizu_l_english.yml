 guiwu:1 "Ba People's Witchcraft"
 guiwu_adj:0 "Ba People's Witchcraft"
 guiwu_adherent:1 "Followers of the Ba people's witchcraft religion"
 guiwu_adherent_plural:1 "Followers of the Ba people's witchcraft religion"
 guiwu_desc:0 "The religious beliefs of the Ba-Shu region in Sichuan during the pre-Qin era. Tu Bo, a Houbo under Hou Tu in Han mythology, is the guardian of the netherworld's Youdu. He possesses a tiger's head, an ox's body, three eyes, and wields a pair of sharp horns; his blood-stained hands are outstretched as he drives away pitiful spirits. This tradition originated in the pre-Qin period and persisted until modern times. Tu Bo was the first Ghost Emperor of the Di-Qiang tribes of ancient Ba-Shu. His appearance is terrifying: he holds nine ropes in his hands, bears sharp horns on his head, has a humped back and bloody hands, chases people swiftly, features three eyes, a tiger's head, and an ox-like body, treating humans as delicacies. The ancient Di-Qiang tribes of Ba-Shu were also known as the Ghost Tribes; through prolonged interaction, due to their shared belief in ghosts and shamans, they developed a common faith centered on the primordial religious deity Tu Bo, hailed as the first Ghost Emperor of both Ba and Shu peoples. This Ghost Emperor resides in Youdu."

