 nanfangzongjiao_religion_desc:0 "The southern tribes and the Baiyue have long revered spirits and deities and placed great trust in shamans and ritual specialists. Mountains, rivers, plants, and trees each have their own spirits, while the souls of ancestors protect their descendants. The Yue, Chu, and Ba peoples worship them according to their own customs."

