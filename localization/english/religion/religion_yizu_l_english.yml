 chuwu_old_adj:1 "Old Chu Shamanic"
 chuwu_old_adherent:1 "Old Believer"
 chuwu_old_adherent_plural:1 "Old Believers"
 
 guiwu:1 "Ba Shamanism"
 guiwu_adj:0 "Ba Shamanic"
 guiwu_adherent:1 "Ba Shamanist"
 guiwu_adherent_plural:1 "Ba Shamanists"
 guiwu_desc:0 "The Ba fear ghosts and honor shamans. Legend says Tubo guards the gates of Youdu, bearing a tiger's head, an ox's body, three eyes, and sharp horns. With Jiuyue in his hands, he pursues the souls of the dead; the tribes of Ba and Shu worship him as the Ghost Emperor. On days of sacrifice, shamans beat drums and sing as they dance, welcoming the sun and warding off calamity."

