 chuwu:1 "Chu Shamanism"
 chuwu_adj:0 "Chu Shamanic"
 chuwu_adherent:1 "Believer"
 chuwu_adherent_plural:1 "Believers"
 chuwu_desc:0 "Chu custom places great trust in shamans and spirits and gives great weight to sacrifices outside the established rites. Donghuang Taiyi, Dongjun, and Yunzhongjun receive offerings, as do the spirits of mountains and rivers and the ghosts of the dead. Shamans dress in splendid robes, singing and dancing to delight the gods. They claim to bridge heaven and earth, converse with spirits, and mediate between life and death."

