 taipingdao:0 "Taiping Dao"
 taipingdao_adj:0 "Taiping Dao"
 taipingdao_adherent:0 "Followers of the Taiping Dao"
 taipingdao_adherent_plural:0 "Followers of the Taiping Dao"
 taipingdao_desc:0 "The Taiping Dao took the Taiping Jing as its guiding principle, rallying followers with promises of renewal under the Yellow Heaven, healing through talismanic water, and shared rituals. Its traveling missionaries believed that as long as people held unyielding resolve and eradicated injustice in a chaotic age, the world would eventually return to peace."
