l_english:
 taipingdao:0 "Way of Great Peace"
 taipingdao_adj:0 "Great Peace"
 taipingdao_adherent:0 "Follower of the Way of Great Peace"
 taipingdao_adherent_plural:0 "Followers of the Way of Great Peace"
 taipingdao_desc:0 "The Way of Great Peace follows the Scripture of Great Peace. Its teachers treat illness with nine-jointed staffs, talismanic water, and incantations, requiring the sick to bow and reflect on their wrongdoings. Disciples spread the faith far and wide, convinced that the Blue Heaven is dead, the Yellow Heaven must rise, and an age of Great Peace will come."
