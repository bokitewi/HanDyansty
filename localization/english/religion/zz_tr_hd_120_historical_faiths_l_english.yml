l_english:
 hd_beifang_faith:0 "Northern Animism"
 hd_beifang_faith_adj:0 "Northern Animist"
 hd_beifang_faith_adherent:0 "Animist"
 hd_beifang_faith_adherent_plural:0 "Animists"
 hd_beifang_faith_desc:0 "The northern peoples honor Heaven and Earth, ancestral spirits, mountains, and rivers, each tribe making offerings according to its inherited customs. The Dongyi observe their own rites, the Di and Rong worship their own gods, and the fishing and hunting peoples beyond the frontier follow shamans who call down the spirits."
 hd_nanfang_faith:0 "Southern Animism"
 hd_nanfang_faith_adj:0 "Southern Animist"
 hd_nanfang_faith_adherent:0 "Animist"
 hd_nanfang_faith_adherent_plural:0 "Animists"
 hd_nanfang_faith_desc:0 "The southern peoples offer sacrifices to ancestors, mountains, rivers, the sun, and the moon. They worship spirits and place great trust in shamans and ritual specialists. The Yue, Chu, Ba, and the peoples of Nanzhong each preserve their own rites, with shamanic customs reaching from Jianghan to the lands beyond the southern ranges."
 hd_han_taoism_faith:0 "Han Daoism"
 hd_han_taoism_faith_adj:0 "Han Daoist"
 hd_han_taoism_faith_adherent:0 "Daoist"
 hd_han_taoism_faith_adherent_plural:0 "Daoists"
 hd_han_taoism_faith_desc:0 "Followers of the Dao honor Huangdi and Laozi, cultivating their bodies and minds. They use consecrated water, fasting, and offering rituals to heal illness and avert calamity. Both the Way of the Five Pecks of Rice in Shu and Hanzhong and the Way of Great Peace east of the passes arise from this tradition, with followers throughout the provinces and commanderies."
 ashari:0 "Ash'arism"
 ashari_adj:0 "Ash'ari"
 ashari_adherent:0 "Ash'ari"
 ashari_adherent_plural:0 "Ash'aris"
 ashari_desc:0 "This school adheres to Sunni orthodoxy, grounding its teachings in scripture and prophetic tradition. It respects the judgments of legal scholars and calls on its followers to live devoutly within the law."
 muwalladi:0 "Muwalladism"
 muwalladi_adj:0 "Muwalladi"
 muwalladi_adherent:0 "Muwalladi"
 muwalladi_adherent_plural:0 "Muwalladis"
 muwalladi_desc:0 "Most followers of this school are local people who have recently converted. They follow Sunni teachings while preserving the customs of their homeland, drawing their community together through local bonds."
 maturidi:0 "Maturidism"
 maturidi_adj:0 "Maturidi"
 maturidi_adherent:0 "Maturidi"
 maturidi_adherent_plural:0 "Maturidis"
 maturidi_desc:0 "This school adheres to Sunni orthodoxy and takes religious law as its foundation, while allowing followers to adapt their practice to local customs."
 mutazila:0 "Mu'tazilism"
 mutazila_adj:0 "Mu'tazili"
 mutazila_adherent:0 "Mu'tazili"
 mutazila_adherent_plural:0 "Mu'tazilis"
 mutazila_desc:0 "This school follows Sunni teachings and favors rational argument in interpreting scripture. It places great value on scholarly debate and the study of religious law."
