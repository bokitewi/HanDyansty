l_english:
 hd_beifang_faith:0 "Northern Animism"
 hd_beifang_faith_adj:0 "Northern Animist"
 hd_beifang_faith_adherent:0 "Animist"
 hd_beifang_faith_adherent_plural:0 "Animists"
 hd_beifang_faith_desc:0 "The northern peoples revere heaven and earth, ancestral spirits, and mountains and rivers, each tribe sacrificing to the spirits by its own tradition. The Eastern Yi keep the Yi rites, the Di and Rong each worship their own gods, and the fishing and hunting peoples beyond the frontier heed shamans who call down the spirits."
 hd_nanfang_faith:0 "Southern Animism"
 hd_nanfang_faith_adj:0 "Southern Animist"
 hd_nanfang_faith_adherent:0 "Animist"
 hd_nanfang_faith_adherent_plural:0 "Animists"
 hd_nanfang_faith_desc:0 "The southern peoples worship ancestral spirits, mountains and rivers, and the sun and moon, serving ghosts and gods and honoring shamans and invokers. The Yue, the Chu, the Ba, and the many Yi of Nanzhong each keep their own rites, and the shamanic custom reaches from the Jiang and Han all the way beyond the Southern Ridges."
 hd_han_taoism_faith:0 "Han Daoism"
 hd_han_taoism_faith_adj:0 "Han Daoist"
 hd_han_taoism_faith_adherent:0 "Daoist"
 hd_han_taoism_faith_adherent_plural:0 "Daoists"
 hd_han_taoism_faith_desc:0 "Followers of the Dao revere Huang-Lao and cultivate body and spirit, using talismanic water and fasting rites to cure illness and ward off calamity for others. The Five Pecks of Rice Dao of Shu and Hanzhong and the Taiping Dao east of the passes both sprang from it, and its faithful fill the provinces and commanderies."
 ashari:0 "Ash'ari"
 ashari_adj:0 "Ash'ari"
 ashari_adherent:0 "Ash'ari"
 ashari_adherent_plural:0 "Ash'aris"
 ashari_desc:0 "This school holds strictly to Sunni orthodoxy, takes scripture and tradition as the foundation of its teaching, honors the rulings of jurists, and requires believers to be devout and law-abiding."
 muwalladi:0 "Muwalladi"
 muwalladi_adj:0 "Muwalladi"
 muwalladi_adherent:0 "Muwalladi"
 muwalladi_adherent_plural:0 "Muwalladis"
 muwalladi_desc:0 "Its adherents are mostly locals recently converted; they follow the Sunni faith while keeping the customs of their homeland, binding the faithful together through ties of native soil."
 maturidi:0 "Maturidi"
 maturidi_adj:0 "Maturidi"
 maturidi_adherent:0 "Maturidi"
 maturidi_adherent_plural:0 "Maturidis"
 maturidi_desc:0 "This school holds strictly to Sunni orthodoxy with religious law as its root, while allowing believers to adapt their practice to local custom."
 mutazila:0 "Mu'tazila"
 mutazila_adj:0 "Mu'tazili"
 mutazila_adherent:0 "Mu'tazili"
 mutazila_adherent_plural:0 "Mu'tazilis"
 mutazila_desc:0 "This school follows the Sunni faith, champions reasoned argument in expounding scripture, and values scholarly debate and the study of law."
