 beifangzongjiao_religion_desc:0 "The northern peoples have long worshipped their own gods. The peoples of the east revere Xuanniao and preserve the rites of the Yi; the Rong and Di honor heaven, earth, mountains, rivers, and ancestral spirits; beyond the frontier, shamans beat drums to summon the gods. Their rites differ, but all revere heaven and their ancestors."

