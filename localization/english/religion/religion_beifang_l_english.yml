 beidifangling:0 "Beidi Animism"
 beidifangling_adj:0 "Beidi Animism"
 beidifangling_adherent:0 "Worshipper"
 beidifangling_adherent_plural:0 "Worshipper"
 beidifangling_desc:0 "The Di have lived among the Taihang and Heng mountains for generations. Since the Zhou they have dwelt alongside the peoples of the Central Plains, sometimes at war, sometimes joined by marriage. They honor heaven, earth, mountains, rivers, and ancestral spirits. Shamans invite spirits to possess them, and both women and men may preside over sacrifices."

