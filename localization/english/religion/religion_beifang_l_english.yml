 yili:0 "Yi Rites"
 yili_adj:0 "Yi Ritualist"
 yili_adherent:0 "Believer"
 yili_adherent_plural:0 "Believers"
 yili_desc:0 "The Dongyi honor Shaohao as their ancestor. It is said that he named his officials after birds, assigning Fengniao, Xuanniao, Bozhao, Qingniao, and Danniao to oversee the seasons and calendar. The Yi observe the stars, reckon the seasons, worship sacred birds, and sacrifice to their ancestors. Some say that their rites involving jade and rows of bronze vessels laid the foundations of the ritual traditions of the Three Dynasties."

