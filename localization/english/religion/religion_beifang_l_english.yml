 saman:1 "Saman"
 saman_adj:0 "Saman"
 saman_adherent:1 "Believers"
 saman_adherent_plural:1 "Believers"
 saman_desc:0 "Shamanism is a shamanic religion originating in the primitive hunting and fishing era, distributed across North Asia. It has been practiced among many ethnic groups in China's northeastern to northwestern frontier regions who speak languages of the Altaian family, including the Manchu-Tungusic, Mongolic, and Turkic branches."

