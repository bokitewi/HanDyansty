 beidifangling:0 "Northern Di Animism"
 beidifangling_adj:0 "Northern Di Animist"
 beidifangling_adherent:0 "Believer"
 beidifangling_adherent_plural:0 "Believers"
 beidifangling_desc:0 "The Di have lived among the Taihang and Heng mountains for generations. Since the Zhou they have dwelt alongside the peoples of the Central Plains, sometimes at war, sometimes joined by marriage. They honor heaven, earth, mountains, rivers, and ancestral spirits. Shamans invite spirits to possess them, and both women and men may preside over sacrifices."

 beidifangling_old:0 "Northern Di Animism"
 beidifangling_old_adj:0 "Northern Di Animist"
 beidifangling_old_adherent:0 "Old Believer"
 beidifangling_old_adherent_plural:0 "Old Believers"
 
 xirongfangling:0 "Western Rong Animism"
 xirongfangling_adj:0 "Western Rong Animist"
 xirongfangling_adherent:0 "Believer"
 xirongfangling_adherent_plural:0 "Believers"
 xirongfangling_desc:0 "The Rong live on both sides of the Long Mountains. Since the Zhou they have dwelt alongside the Qin and other peoples of the Central Plains amid ceaseless warfare. They prize martial courage and hold life lightly, offering human victims to heaven. Some leave their dead in the wilderness for birds and beasts to consume, believing that this releases their souls to ascend to heaven."

 xirongfangling_old:0 "Old Western Rong Animism"
 xirongfangling_old_adj:0 "Old Western Rong Animist"
 xirongfangling_old_adherent:0 "Old Believer"
 xirongfangling_old_adherent_plural:0 "Old Believers"
 
 saman:0 "Shamanism"
 saman_adj:0 "Shamanic"
 saman_adherent:0 "Believer"
 saman_adherent_plural:0 "Believers"
 saman_desc:0 "Among the Sushen and Yilou tribes of the northeast and the hunting and fishing peoples beyond the frontier, shamans are believed to commune with spirits. Dancing to the beat of drums, they become possessed, driving away evil, healing the sick, and divining fortune for their people. At great ceremonies, animals are sacrificed and drink flows freely in thanks to the spirits of forests, birds, and beasts."

 saman_old:0 "Old Shamanism"
