 yili:1 "Barbarian Rites"
 yili_adj:0 "Barbarian Rites"
 yili_adherent:1 "Believers"
 yili_adherent_plural:1 "Believers"
 yili_desc:0 "The Eastern Barbarian regions were the earliest places where China's traditional system of ritual and music took shape. The jade usage system and ding vessel usage system of the Xia, Shang, and Zhou dynasties all originated from the Eastern Barbarians. As the saying goes, \"The great affairs of a state lie in sacrifice and warfare,\" it is evident that both major ceremonial systems in Chinese history basically stem from the East, thereby laying the foundation for thousands of years of Chinese thought."

