 beidifangling:1 "Northern Di Totem"
 beidifangling_adj:0 "Northern Di Totem"
 beidifangling_adherent:1 "Believers"
 beidifangling_adherent_plural:1 "Believers"
 beidifangling_desc:0 "The term \"Northern Di\" first originated in the Zhou Dynasty, referring to non-Hua-Xia tribes residing in present-day Shanxi and Hebei. They engaged in frequent interactions with the Zhuxia (the various states of the Central Plains), involving both warfare and marital alliances, and were deeply influenced by the cultures of the Shang and Zhou Dynasties as well as the Spring and Autumn Period."

 beidifangling_old:1 "Northern Di Totem"
 beidifangling_old_adj:1 "Northern Di Totem"
 beidifangling_old_adherent:1 "Old Believers"
