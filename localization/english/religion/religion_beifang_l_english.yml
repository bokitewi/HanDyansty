 saman_adherent:0 "Worshipper"
 saman_adherent_plural:0 "Worshipper"
 saman_desc:0 "Among the Sushen and Yilou tribes of the northeast and the hunting and fishing peoples beyond the frontier, shamans are believed to commune with spirits. Dancing to the beat of drums, they become possessed, driving away evil, healing the sick, and divining fortune for their people. At great ceremonies, animals are sacrificed and drink flows freely in thanks to the spirits of forests, birds, and beasts."

