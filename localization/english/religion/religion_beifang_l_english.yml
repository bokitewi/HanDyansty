 beifangzongjiao_religion_desc:0 "The northern peoples have long worshipped their own gods. The peoples of the east revere the Dark Bird and keep the rites of the Yi. The Rong and Di honor heaven and earth, mountains and rivers, and ancestral spirits. Beyond the frontier, shamans beat drums to call down the gods. Their rites differ, yet all honor heaven and their ancestors."

