 xirongfangling:0 "Xirong Animism"
 xirongfangling_adj:0 "Xirong Animism"
 xirongfangling_adherent:0 "Worshipper"
 xirongfangling_adherent_plural:0 "Worshipper"
 xirongfangling_desc:0 "The Rong live on both sides of the Long Mountains. Since the Zhou they have dwelt alongside the Qin and other peoples of the Central Plains amid ceaseless warfare. They prize martial courage and hold life lightly, offering human victims to heaven. Some leave their dead in the wilderness for birds and beasts to consume, believing that this releases their souls to ascend to heaven."

