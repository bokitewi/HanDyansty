 xirongfangling:1 "Western Rong Animism"
 xirongfangling_adj:0 "Western Rong Animism"
 xirongfangling_adherent:1 "Believers"
 xirongfangling_adherent_plural:1 "Believers"
 xirongfangling_desc:0 "The term \"Rong\" was a general designation used by people in the Central Plains during the Zhou period for various western tribes. Since the Western Zhou, numerous states with the Ji surname and those with different surnaises coexisted alongside many Rong and Di tribes. Despite the disparity in civilization between the Rong and Huaxia, they maintained frequent interactions with the Zhuxia (the collective term for the various states of the Central Plains) and were profoundly influenced by the culture of the Zhuxia during the Shang, Zhou, and Spring and Autumn periods."

 xirongfangling_old:1 "Old Xirong Animism"
 xirongfangling_old_adj:1 "Old Xirong Animism"
