l_english:
 wudoumidao:0 "Way of the Five Pecks of Rice"
 wudoumidao_adj:0 "Five Pecks of Rice"
 wudoumidao_adherent:0 "Five Pecks of Rice Follower"
 wudoumidao_adherent_plural:0 "Five Pecks of Rice Followers"
 wudoumidao_desc:0 "The Way of the Five Pecks of Rice venerates Laozi. Its followers use talismanic water to heal illness, requiring the sick to reflect on their faults in a quiet room and submit written confessions to the Three Officials of Heaven, Earth, and Water. Initiates contribute five pecks of rice. Libationers lead the followers in each religious district, while roadside charity lodges offer rice and meat to travelers."
 wudoumidao_religious_head_title:0 "Celestial Master"
 wudoumidao_religious_head_title_name:0 "Court of the Five Pecks of Rice"

 fusang_pagan:0 "Fusang Spirit Worship"
 fusang_pagan_adj:0 "Fusang Spirit-Worshipping"
 fusang_pagan_adherent:0 "Fusang Spirit Worshipper"
 fusang_pagan_adherent_plural:0 "Fusang Spirit Worshippers"
 fusang_pagan_desc:0 "The Wa follow the way of spirits, believing that divine beings inhabit mountains, seas, forests, and stones, while ancestral spirits protect their descendants. Ritual purity is prized. Before undertakings and journeys, bones are heated for divination; at festivals, offerings are made, people drink together, and song and dance delight the spirits."
 fusang_pagan_old:0 "Old Fusang Spirit Worship"
 fusang_pagan_old_adj:0 "Old Fusang Spirit-Worshipping"
 fusang_pagan_old_adherent:0 "Old Fusang Spirit Worshipper"
 fusang_pagan_old_adherent_plural:0 "Old Fusang Spirit Worshippers"

 yemaek_shamanism:0 "Yemaek Shamanism"
 yemaek_shamanism_adj:0 "Yemaek Shamanic"
 yemaek_shamanism_adherent:0 "Yemaek Shamanist"
 yemaek_shamanism_adherent_plural:0 "Yemaek Shamanists"
 yemaek_shamanism_desc:0 "The Yemaek, Buyeo, and Goguryeo peoples honor Heaven, sacrifice to mountains, and revere their ancestors. Each year they gather to offer sacrifices to Heaven: Buyeo calls this Yeonggo, Goguryeo Dongmaeng, and the Ye Mucheon. For days the whole country drinks, sings, and dances. Shamans invite spirits to possess them, warding off harmful forces and healing their people."
 yemaek_shamanism_old:0 "Old Yemaek Shamanism"
 yemaek_shamanism_old_adj:0 "Old Yemaek Shamanic"
 yemaek_shamanism_old_adherent:0 "Old Yemaek Shamanist"
 yemaek_shamanism_old_adherent_plural:0 "Old Yemaek Shamanists"

 samhan_shamanism:0 "Samhan Shamanism"
 samhan_shamanism_adj:0 "Samhan Shamanic"
 samhan_shamanism_adherent:0 "Samhan Shamanist"
 samhan_shamanism_adherent_plural:0 "Samhan Shamanists"
 samhan_shamanism_desc:0 "The peoples of Samhan believe in spirits and deities. Each chief settlement appoints a priest called the Lord of Heaven to oversee sacrifices to the heavenly deity. Separate sacred settlements called sodo are also established, where bells and drums hang from great wooden poles for worship. After sowing in the fifth month and completing the harvest in the tenth, people gather to sing, dance, and drink, honoring the spirits of mountains and rivers."
 samhan_shamanism_old:0 "Old Samhan Shamanism"
 samhan_shamanism_old_adj:0 "Old Samhan Shamanic"
 samhan_shamanism_old_adherent:0 "Old Samhan Shamanist"
 samhan_shamanism_old_adherent_plural:0 "Old Samhan Shamanists"

 xianbei_polytheism:0 "Xianbei Polytheism"
 xianbei_polytheism_adj:0 "Xianbei Polytheistic"
 xianbei_polytheism_adherent:0 "Xianbei Polytheist"
 xianbei_polytheism_adherent_plural:0 "Xianbei Polytheists"
 xianbei_polytheism_desc:0 "The Xianbei tribes revere spirits and deities, offering sacrifices to Heaven and Earth, the sun and moon, stars, mountains, and rivers, as well as to ancestral leaders famed for strength and valor. Their customs prize vigor over old age and honor death in battle. They believe the souls of the dead return to Chishan, their heroic names preserved in the tribes' ritual songs."
 xianbei_polytheism_old:0 "Old Xianbei Polytheism"
 xianbei_polytheism_old_adj:0 "Old Xianbei Polytheistic"
 xianbei_polytheism_old_adherent:0 "Old Xianbei Polytheist"
 xianbei_polytheism_old_adherent_plural:0 "Old Xianbei Polytheists"

 wugui:0 "Shamanic Spirit Worship"
 wugui_adj:0 "Shamanic"
 wugui_adherent:0 "Spirit Worshipper"
 wugui_adherent_plural:0 "Spirit Worshippers"
 wugui_desc:0 "The peoples of Nanzhong believe in shamans and spirits. They bind oaths with curses, casting stones and knotting grass as tokens of their pledges. Shamans receive spirits, banish harmful influences, divine fortune and misfortune, and soothe the restless souls of the valleys. At great ceremonies, animals are sacrificed, people drink together, and worshippers greet the spirits while bowing to the sun."
 wugui_old:0 "Old Shamanic Spirit Worship"
 wugui_old_adj:0 "Old Shamanic"
 wugui_old_adherent:0 "Old Spirit Worshipper"
 wugui_old_adherent_plural:0 "Old Spirit Worshippers"

