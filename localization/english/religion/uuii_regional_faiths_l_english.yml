l_english:
 wudoumidao:0 "Five Pecks of Rice Dao"
 wudoumidao_adj:0 "Five Pecks of Rice Dao"
 wudoumidao_adherent:0 "Believers of the Five Grains Dao"
 wudoumidao_adherent_plural:0 "Believers of the Five Grains Dao"
 wudoumidao_desc:0 "The Five Grains Dao takes Laozi as its founder, using the Tao Te Ching, talismans, rituals, and healing to educate and benefit the people. Those who join the Dao contribute five sheng of rice to support the sect. Each commandery is presided over by a Jizhu (Wine Master), while the Celestial Master oversees the teachings, enforces discipline, and guides followers in self-cultivation and repentance."
 wudoumidao_religious_head_title:0 "Celestial Master"
 wudoumidao_religious_head_title_name:0 "Five Grains Dao Court"

 fusang_pagan:0 "Fusang Primitive Beliefs"
 fusang_pagan_adj:0 "Fusang Primitive Beliefs"
 fusang_pagan_adherent:0 "Followers of the original faith of Fusang"
 fusang_pagan_adherent_plural:0 "Followers of the original faith of Fusang"
 fusang_pagan_desc:0 "The ancient sacrificial traditions of the islands of Fusang venerate deities dwelling within mountains, seas, forests, rocks, and ancestral spirits of clans. The chief priest maintains order between humans and gods, villages and ancestors through purification, offerings, and communal celebrations."
 fusang_pagan_old:0 "Ancient Fusang Primitive Beliefs"
 fusang_pagan_old_adj:0 "Ancient Fusang Primitive Beliefs"
 fusang_pagan_old_adherent:0 "Adherents of the ancient Shinto faith in old Fusang"
 fusang_pagan_old_adherent_plural:0 "Adherents of the ancient Shinto faith in old Fusang"

 yemaek_shamanism:0 "Hui-Mo primitive shamanism"
 yemaek_shamanism_adj:0 "Hui-Mo primitive shamanism"
 yemaek_shamanism_adherent:0 "Hui Mo shaman followers"
 yemaek_shamanism_adherent_plural:0 "Hui Mo shaman followers"
 yemaek_shamanism_desc:0 "The Hui, Mo, Buyeo, and Goguryeo tribes believe that mountains, the sky, and ancestral spirits jointly protect their clans. Shamans communicate between the living and the dead through song, dance, drumming, offerings, and spirit summoning, driving away evil spirits and healing illnesses for their people, while also praying to ancestors for harvest and victory."
 yemaek_shamanism_old:0 "Ancient Hui Mo primitive shamanism"
 yemaek_shamanism_old_adj:0 "Ancient Hui Mo primitive shamanism"
 yemaek_shamanism_old_adherent:0 "Old Impure Mo Shamans' Followers"
 yemaek_shamanism_old_adherent_plural:0 "Old Impure Mo Shamans' Followers"

 samhan_shamanism:0 "Three Kingdoms Shamanism"
 samhan_shamanism_adj:0 "Three Kingdoms Shamanism"
 samhan_shamanism_adherent:0 "Three Kingdoms Shaman Followers"
 samhan_shamanism_adherent_plural:0 "Three Kingdoms Shaman Followers"
 samhan_shamanism_desc:0 "The shamanistic customs of Mahan, Chinhan, and Byeonhan revolve around village community sacrifices to heaven, worship of mountain and river deities, and seasonal festivals. Shamans invoke the spirits through song, dance, and offerings, thereby securing blessings for the community during sowing, harvest, illness, and war."
 samhan_shamanism_old:0 "Old Three Han Shamanism"
 samhan_shamanism_old_adj:0 "Old Three Han Shamanism"
 samhan_shamanism_old_adherent:0 "Old Three Han Shaman Followers"
 samhan_shamanism_old_adherent_plural:0 "Old Three Han Shaman Followers"

 xianbei_polytheism:0 "Xianbei Polytheism"
 xianbei_polytheism_adj:0 "Xianbei Polytheism"
 xianbei_polytheism_adherent:0 "Believers in Xianbei polytheism"
 xianbei_polytheism_adherent_plural:0 "Believers in Xianbei polytheism"
 xianbei_polytheism_desc:0 "The Xianbei tribes revere the Blue Sky, mountains and rivers, fire, and ancestral spirits. Tribal shamans preside over sky-worship, divination, and ancestor rites; while knights safeguard their community with endurance and loyalty, believing that deeds will ensure their names endure in future sacrificial songs."
 xianbei_polytheism_old:0 "Ancient Xianbei Polytheism"
 xianbei_polytheism_old_adj:0 "Ancient Xianbei Polytheism"
 xianbei_polytheism_old_adherent:0 "Followers of the Old Xianbei Polytheism"
 xianbei_polytheism_old_adherent_plural:0 "Followers of the Old Xianbei Polytheism"

 wugui:0 "Wu-Gui Belief"
 wugui_adj:0 "Wu-Gui Belief"
 wugui_adherent:0 "Wu Ghost Followers"
 wugui_adherent_plural:0 "Wu Ghost Followers"
 wugui_desc:0 "The shamanistic traditions of the various tribes in Ningzhou believe that ghosts, spirits, and ancestral souls intervene in human affairs. Shamans pacify restless spirits, cure illnesses, and maintain covenants between people and their ancestors through spirit possession, exorcism, divination, and grand sacrificial rites across valleys and village settlements."
 wugui_old:0 "Ancient Witchcraft and Ghost Worship"
 wugui_old_adj:0 "Ancient Witchcraft and Ghost Worship"
 wugui_old_adherent:0 "Old Witchcraft Believers"
 wugui_old_adherent_plural:0 "Old Witchcraft Believers"

