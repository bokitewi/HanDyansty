l_english:
 zgrc_gongyang:0 "Gongyang School"
 zgrc_gongyang_adj:0 "Gongyang"
 zgrc_gongyang_adherent:0 "Gongyang Confucian"
 zgrc_gongyang_adherent_plural:0 "Gongyang Confucians"
 zgrc_gongyang_desc:0 "Gongyang Confucians seek heavenly principle in the praise and blame carried by a single word of the Spring and Autumn Annals, and hold firmly to Grand Unification, the distinction between Hua and Yi, and great vengeance."
 tenet_zgrc_zunwangrangyi_name:0 "Revere the King, Expel the Barbarians"
 tenet_zgrc_zunwangrangyi_desc:0 "There are not two suns in the sky, nor two kings upon the earth. To treat the Xia states as within and the Yi and Di as without is the order of the Age of Rising Peace; when far and near, great and small are as one, that is the sign of the Age of Great Peace. To revere the king and expel the barbarians is the way to bring about Great Peace."
 doctrine_parameter_zgrc_jiaohua_cb_enabled:0 "[rulers|E] can use the Expel the Barbarians [casus_belli|E] against neighboring barbarian rulers"
 doctrine_parameter_zgrc_dafuchou_enabled:0 "When a close relative is murdered, Great Vengeance may be pursued"
