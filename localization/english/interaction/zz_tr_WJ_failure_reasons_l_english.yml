l_english:
 WJ_failure_0:0 "The one opening a headquarters must be a minister of the court, or a sitting local official of provincial rank or higher"
 WJ_failure_1:0 "Must have the privilege of an independent headquarters, or the privilege of headquarters for a sitting Six Excellencies member"
 WJ_failure_2:0 "The headquarters lord must be a minister of the court, a garrison provincial official, or the Colonel-Director of Retainers"
 WJ_failure_3:0 "The Military Headquarters must have at least one vacant subordinate post"
 WJ_failure_4:0 "The candidate must serve the same court as the headquarters lord; guests count as part of the court where they reside"
 WJ_failure_5:0 "The candidate must be a sitting official, a courtier, a guest, or an unemployed member of the gentry"
 WJ_failure_6:0 "A vacant Military Headquarters post must be selected"
 WJ_failure_8:0 "The issuer must be the Son of Heaven, the Area Commander of Inner and Outer Forces, or the Grand General"
 WJ_failure_9:0 "Must hold an Administrator, garrison, or capital-region local official contract"
 WJ_failure_10:0 "Must be a garrison or capital-region official; Administrators may not exercise the authority of the imperial standard"
 WJ_failure_11:0 "The target must belong to the selected Area Command, or to the commanderies and counties under it"
 WJ_failure_12:0 "The Area Commander or someone under his command must be able to march to the rescue"
 WJ_failure_13:0 "Pardons must be handled by the Emperor, the Regent, or a Commandant of Justice directly under the Emperor"
 WJ_failure_14:0 "The target must be within reach of the Yellow Axe of the Area Commander of Inner and Outer Armies, or within the jurisdiction of the issuing Area Commander's Banner and Tally"
 WJ_failure_15:0 "You must choose a military order you are entitled to issue"
 WJ_failure_16:0 "Must be handled personally by the Son of Heaven or the Area Commander of Inner and Outer Armies"
 WJ_failure_17:0 "The reinforcement cannot already be a participant on the same side, an enemy of the one being aided, or in conflict with the enemy side"
 WJ_failure_18:0 "Must be an official of the Area Command, or an official of a commandery or county under it"
 WJ_failure_19:0 "The target must be a local official or a court minister of this dynasty"
 WJ_failure_20:0 "The one being invested must be the Emperor's principal wife or a Noble Lady"
 WJ_failure_21:0 "The one summoned cannot be pregnant, and must not have attended the Emperor recently"
 WJ_failure_22:0 "Must currently hold a provincial office, or a civil or military post"
 WJ_failure_23:0 "Local evaluations must be requested from the overseeing provincial official; those not under one must request from the Director of the Secretariat"
 WJ_failure_24:0 "You, the host, or the baron's liege must be able to use Administrative Influence"
 WJ_failure_25:0 "The court may nominate any eligible person of this dynasty; provincial officials may only nominate officials below provincial rank under their rule"
 WJ_failure_27:0 "Those directly under the Emperor apply to the Emperor, the Area Commander of Inner and Outer Armies, or the Grand General; other officials apply to their eligible provincial official"
 WJ_failure_28:0 "The original nominator must still be yourself, or an Emperor, Area Commander of Inner and Outer Armies, Grand General or provincial official with jurisdiction"
 WJ_failure_29:0 "The reviewer must still be an Emperor, Area Commander of Inner and Outer Armies, or overseeing provincial official with authority"
 WJ_failure_31:0 "This year's Filial and Incorrupt quota must still be unused, with no recommendation awaiting reply"
 WJ_failure_32:0 "The candidate cannot already have entered office through summons, Filial and Incorrupt, or Flourishing Talent"
 WJ_failure_33:0 "The one petitioned must still have this year's Filial and Incorrupt quota unused, with no recommendation awaiting reply"
 WJ_failure_34:0 "This year's Flourishing Talent quota must still be unused, with no recommendation awaiting reply"
 WJ_failure_35:0 "The one petitioned must still have this year's Flourishing Talent quota unused, with no recommendation awaiting reply"
 WJ_failure_36:0 "The target cannot already hold a noble rank, nor be an invested Crown Prince"
 WJ_failure_37:0 "Non-imperial recipients must already have, or be able to create, a Gentry Clan title to inherit the rank"
 WJ_failure_38:0 "Women must be imperial kin of the same dynasty; male imperial kin must be close relatives; men of other surnames need at least 25 military merit or administrative merit"
 WJ_failure_39:0 "Must currently be a court minister, or hold land outside the family"
