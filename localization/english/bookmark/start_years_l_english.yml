 uuii_bm_group_184: "Twilight of the Han"
 bm_uuii_184: "Warlords of the Late Han"
 bm_uuii_184_desc: "The seventh year of Guanghe, the year of Jiazi. The Han has ruled for nearly four hundred years. In the palace at Luoyang, eunuchs and imperial in-laws struggle openly and in secret, while offices and noble titles are sold throughout the court. Across the provinces and commanderies, powerful families swallow up farmland. Years of disaster, epidemic, and forced labor have driven the common people to desperation.\n\nThe talismanic water and scriptures of the Way of Great Peace spread quietly through Qingzhou, Xuzhou, Youzhou, Jizhou, Jingzhou, Yangzhou, Yanzhou, and Yuzhou. Its thirty-six divisions of believers await a single command. On temple gates in the capital and the walls of provincial offices, someone has written the characters for Jiazi in white clay.\n\n#bold A storm is coming. Will you uphold the tottering Han, or rise with the tide and establish a new order?#!"
 bm_hd_190: "The Coalition Against Dong Zhuo"
 bm_hd_190_desc: "The first year of Chuping, the year of Gengwu. Dong Zhuo has deposed the young emperor, enthroned Emperor Xian, named himself Chancellor of State, and let his soldiers plunder Luoyang. Governors and prefects across the east have taken up arms and chosen Yuan Shao, Grand Administrator of Bohai, as leader of a sworn alliance of more than a dozen lords.\n\nDong Zhuo holds the emperor and the Sili region, and his Liangzhou cavalry range freely across Guanzhong. Behind him, the Liang commanders act on their own and Bingzhou has no master, its counties scattered. With spring, the coalition will march north toward Henei and east toward Chenggao, and Luoyang and Hulao Pass will bear the first blow.\n\n#bold The Han is on the brink. Will you lead the righteous host against the tyrant, carve out a domain amid the chaos, or pursue some other ambition in this age of contention?#!"
uuii_book_cao_cao_name_subheading: "A capable minister in peace, a ruthless hero in turmoil"
uuii_book_liu_bei_name_subheading: "His virtue shines; his resolve burns"
uuii_book_yuan_shao_name_subheading: "Noble in spirit and conduct, foremost in the realm"
uuii_book_sun_jian_name_subheading: "General Who Defeats the Enemy"
uuii_book_zhang_jiao_name_subheading: "Great and Worthy Teacher"
 uuii_book_cao_cao_name_desc: "At Jiwu in Chenliu, Cao Cao spent his family fortune raising five thousand volunteers to march against Dong Zhuo. He is in step with Zhang Miao and Wei Zi, but his troops are few and his land small; for now he can only shelter in one corner of Chenliu.\n\nThe coalition is an alliance in name only. Yuan Shao is bent on seizing power, and the lords hold their armies back to watch, none willing to move first. Cao Cao burns with impatience, yet all he can do is drill his men in this little base and wait for his chance.\n\n#bold Can you find a footing among the warlords, and one day command them all in the emperor's name?#!"

 uuii_book_yuan_shao_name_desc: "Four generations of the Yuan clan of Runan have served among the Three Excellencies, and their disciples and former subordinates fill the realm. After He Jin's death and Dong Zhuo's entry into Luoyang, Yuan Shao abandoned his post and went east, where the lords of Guandong chose him as alliance leader. From Bohai he commands more than a dozen armies.\n\nThe coalition looks mighty, but supplies, legitimacy, and the mutual suspicion of the lords constantly hold their leader back. Han Fu, Governor of Jizhou, is close at hand, both a help and a danger.\n\n#bold Can you hold the coalition together, defeat Dong Zhuo, and raise the Yuan clan of Runan to the summit of power?#!"

 uuii_book_liu_bei_name_desc: "Liu Bei claims descent from Prince Jing of Zhongshan. In his youth he wove mats and sold sandals, and later studied under Lu Zhi. When the Yellow Turbans rose, he swore the Peach Garden oath with Guan Yu and Zhang Fei and raised volunteers, wandering between Zhuo Commandery and Youzhou.\n\nNow the realm is in chaos and warlords rise on every side. He is still landless, with only a few hundred loyal men, though he has dealings with Gongsun Zan, Tao Qian, and others. In this age, his imperial lineage and old friendships are his greatest assets.\n\n#bold Can you start from nothing, gather men of principle, win a place of your own, and in time restore the Han?#!"

 uuii_book_sun_jian_name_desc: "Sun Jian comes from Fuchun in Wu Commandery. At seventeen he scattered a band of sea pirates and won a name for courage. He earned merit under Zhu Jun against the Yellow Turbans, then served as Administrator of Changsha and put down the rebellion of Ou Xing.\n\nWhen the lords of Guandong rose, Sun Jian marched north, drove the Inspector of Jingzhou Wang Rui to his death, beheaded the Administrator of Nanyang Zhang Zi, and brought his Jiangdong followers to Yuan Shu at Luyang. He holds not a single county of his own. He is the sharpest blade in the coalition, but he serves another man and is hemmed in at every turn.\n\n#bold Can you rise from a battlefield general to the founder of the House of Sun in Jiangdong?#!"

 uuii_book_zhang_jiao_name_desc: "Witnessing the suffering of the people, Zhang Jiao proclaimed himself the Great and Worthy Teacher. Following the Way of Huang-Lao, he treats illness with talismanic water and incantations. Over more than a decade, followers of the Way of Great Peace have spread through eight provinces, organized into thirty-six divisions. The largest number over ten thousand people; the smaller, six or seven thousand. All look to the Great and Worthy Teacher as their savior.\n\nThe date of the uprising is set. Allies inside the capital and the leaders of each division prepare in secret. Yet the more people involved, the harder the plan is to conceal. If the court discovers it, every preparation may come to nothing.\n\n#bold The Blue Heaven is dead; the Yellow Heaven must rise. Can you rewrite Heaven's Mandate in the Yellow Heaven's name?#!"

