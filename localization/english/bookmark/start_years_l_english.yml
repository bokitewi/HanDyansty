l_english:

 uuii_bm_group_184: "Twilight of the Han"
 bm_uuii_184: "AD 184"
 bm_uuii_184_desc: "The seventh year of Guanghe, the year of Jiazi. The Han has ruled for nearly four hundred years. In the palace at Luoyang, eunuchs and imperial in-laws struggle openly and in secret, while offices and noble titles are sold throughout the court. Across the provinces and commanderies, powerful families swallow up farmland. Years of disaster, epidemic, and forced labor have driven the common people to desperation.\n\nThe talismanic water and scriptures of the Way of Great Peace spread quietly through Qingzhou, Xuzhou, Youzhou, Jizhou, Jingzhou, Yangzhou, Yanzhou, and Yuzhou. Its thirty-six divisions of believers await a single command. On temple gates in the capital and the walls of provincial offices, someone has written the characters for Jiazi in white clay.\n\n#bold A storm is coming. Will you uphold the tottering Han, or rise with the tide and establish a new order?#!"
uuii_book_cao_cao_name_subheading: "A capable minister in peace, a ruthless hero in turmoil"
uuii_book_liu_bei_name_subheading: "His virtue shines; his resolve burns"
uuii_book_yuan_shao_name_subheading: "Noble in spirit and conduct, foremost in the realm"
uuii_book_sun_jian_name_subheading: "General Who Defeats the Enemy"
uuii_book_zhang_jiao_name_subheading: "Great and Worthy Teacher"
 uuii_book_cao_cao_name_desc: "Cao Cao belongs to the Cao clan of Pei. Gifted in both talent and strategy, he nevertheless faces repeated criticism from the upright scholars because his grandfather Cao Teng was a eunuch. His eminent family opened the path to office, yet its origins are a burden he can never fully cast aside.\n\nAs Commandant of Northern Luoyang, he had a powerful eunuch's relative beaten to death for breaking the law, and his reputation spread. Later, he repeatedly submitted memorials condemning the abuses of the age, but the court failed to heed him. As the Han grows weaker, Cao Cao still burns with the wish to serve his country.\n\n#bold Will you become a capable minister in peace, or a ruthless hero in turmoil?#!"

 uuii_book_yuan_shao_name_desc: "Four generations of the Yuan clan of Runan have served among the Three Excellencies. Their former students and officials are found throughout the realm. Drawing on his family's prestige and his reputation for treating men of talent with humility, Yuan Shao has already become a figure to whom scholars look, thriving at the center of power in Luoyang.\n\nThe struggle between the palace eunuchs and imperial in-laws grows fiercer. Court and country wait for someone to act first. Yuan Shao has the standing to rally the scholars, but he must decide what purpose that standing will serve.\n\n#bold Can you gather the realm's finest talents and bring the Yuan clan of Runan to the height of power in this troubled age?#!"

 uuii_book_liu_bei_name_desc: "Liu Bei claims descent from Prince Jing of Zhongshan, but this branch of the imperial house has long since fallen into poverty. His father died when he was young, and he made his living weaving mats and selling shoes with his mother. Help from his kinsmen allowed him to study under Lu Zhi alongside Gongsun Zan.\n\nUnease spreads through the frontier province of Youzhou. Liu Bei has long wished to uphold the Han and enjoys the company of bold men, attracting eager young followers from his hometown. Yet beyond his claim to imperial ancestry and his reputation from his youthful wanderings, he has little power with which to shape the realm.\n\n#bold Can you begin in Zhuo Commandery, gather those willing to stand beside you, win a foothold, and restore the Han?#!"

 uuii_book_sun_jian_name_desc: "Sun Jian comes from Fuchun in Wu Commandery. At seventeen, he single-handedly scattered pirates who were plundering merchants, winning a reputation for courage and decisiveness. He later joined the commandery troops in suppressing Xu Chang's revolt in Kuaiji and served as Assistant Magistrate of Yandu and Xuyi. He has now been transferred to Xiapi.\n\nThe unrest in the north will soon spread across the provinces. Sun Jian must choose his position with care. Will he campaign throughout the realm at the Han court's command, or seize the chance to win renown and secure a greater future for the Sun clan?\n\n#bold Can you advance step by step and lay the foundations of the Sun clan's power in Jiangdong?#!"

 uuii_book_zhang_jiao_name_desc: "Witnessing the suffering of the people, Zhang Jiao proclaimed himself the Great and Worthy Teacher. Following the Way of Huang-Lao, he treats illness with talismanic water and incantations. Over more than a decade, followers of the Way of Great Peace have spread through eight provinces, organized into thirty-six divisions. The largest number over ten thousand people; the smaller, six or seven thousand. All look to the Great and Worthy Teacher as their savior.\n\nThe date of the uprising is set. Allies inside the capital and the leaders of each division prepare in secret. Yet the more people involved, the harder the plan is to conceal. If the court discovers it, every preparation may come to nothing.\n\n#bold The Blue Heaven is dead; the Yellow Heaven must rise. Can you rewrite Heaven's Mandate in the Yellow Heaven's name?#!"

