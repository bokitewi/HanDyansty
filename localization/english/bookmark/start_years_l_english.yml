 uuii_bm_group_184: "AD 184"
 bm_uuii_184: "AD 184"
 bm_uuii_184_desc: "In the first year of Zhongping, the authority of the Han court still shrouded the realm, yet beneath the shadow where power could not extend, the majesty of the Han gradually loosened. Eunuchs within the palace clashed with imperial relatives outside, while local magnates ascended to the stage of power. Continuous disasters and epidemics, coupled with conscription labor, caused the people to lose patience with the court. \n\n The people's wrath was organized into thirty-six regions under Zhang Jiao's Taiping Dao, awaiting but a single command to reshape heaven and earth. The corrupt House of Han struggled with every step; at the turning point of its own fate, various factions stirred beneath the surface, eyeing power with predatory intent."
uuii_book_cao_cao_name_subheading: "A capable minister in times of peace, a treacherous hero in times of chaos."
uuii_book_liu_bei_name_subheading: "His virtue is manifest, his ambition resolute."
uuii_book_yuan_shao_name_subheading: "High moral character and righteous conduct, renowned throughout the realm."
uuii_book_sun_jian_name_subheading: "General of Breaking the Enemy"
uuii_book_zhang_jiao_name_subheading: "Great Sage of the Righteous"
 uuii_book_cao_cao_name_desc: "Cao Cao hailed from the Cao clan of Pei Commandery. His talents and strategies were exceptional, yet he faced repeated criticism due to his grandfather Cao Teng's status. For him, his family background could open doors to a political career, but it was also an obstacle that had to be overcome. \n\n As the Han court teetered on the brink of collapse, Cao Cao burned with patriotic fervor, vowing to serve the nation. \n\n#bold  Will you choose to become a capable minister in times of peace or a treacherous hero in chaotic times? #!"

 uuii_book_yuan_shao_name_desc: "The Yuan family of Runan has held the position of Grand Commandant for four generations, with their former students and subordinates spread across the realm. Relying on his prestigious lineage and reputation as a master of social connections, Yuan Shao has become a figure of prominence among the scholar-officials, thriving at the heart of power. \n\n The struggle between eunuchs in the palace and imperial relatives outside is intensifying, with all eyes watching for someone to make the first move. Yuan Shao possesses the prestige to rally scholars, yet he must decide where to direct this influence. \n\n#bold  Can you gather heroes from across the land and elevate the Yuan family of Runan to the pinnacle of power in the coming chaos? #!"

 uuii_book_liu_bei_name_desc: "Liu Bei claimed descent from the Marquis of Zhongshan Jing, but this branch of the imperial family had long since declined. Fortunately, with support from his kinsmen, Liu Bei was able to travel to Luoyang to pursue studies and luckily became a disciple of Lu Zhi.\n\nThe turmoil in the Han Dynasty rippled through the frontier region of Youzhou, spreading unrest. Driven by patriotic fervor, Liu Bei intended to gather kindred spirits to quell the chaos and restore the Han house. However, aside from his status as a member of the imperial family and the reputation he had accumulated as a wandering swordsman in his youth, Liu Bei possessed no power capable of influencing the fate of the world.\n\n#bold Can you begin your journey from Zhuo Commandery, gather those willing to stand beside you, secure a foothold for yourself, and lead the Han house toward its resurgence?#!"

 uuii_book_sun_jian_name_desc: "Sun Jian hailed from Wu Commandery; his early experiences already revealed his decisiveness and courage. Now promoted to Magistrate of Xiapei, he has gained a broader perspective but must also confront the entrenched powerful clans and bandits in the south. \n\n The turmoil in the north will soon spread across all provinces. Sun Jian must carefully choose his stance amidst chaos: shall he fight under orders from the Han court, or seize the opportunity to make his name and secure a grander future for the Sun family? \n\n#bold  Can you advance step by step and establish a foundation for the Sun clan of Jiangdong in these turbulent times? #!"

 uuii_book_zhang_jiao_name_desc: "Having witnessed the suffering of the common people, Zhang Jiao took it upon himself to save the world and established the Taiping Dao to spread its teachings among the populace. After years of preparation, more than 360,000 followers spanned across prefectures and commanderies, regarding the Great Sage as their savior. The date for \n\n has been set, and within the capital, internal allies and various chieftains are secretly preparing. However, the more participants there are, the harder it becomes to keep the news secret; once the court detects any movement, all preparations may be in vain. \n\n#bold  Heaven is dying. Can you fulfill your own wish and rewrite the mandate of heaven in the name of the Yellow Sky? #!"

