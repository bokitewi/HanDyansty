l_english:

rule_embattle_side_advantage_multiplier:0 "Battle Formation: Legacy Advantage Multiplier (Disabled)"
setting_embattle_side_advantage_1x:0 "Legacy Option"
setting_embattle_side_advantage_1x_desc:0 "This label is retained from an earlier version. The current deputy commander adjustment uses the average Martial skill formula."
setting_embattle_side_advantage_0.5x:0 "Legacy Option"
setting_embattle_side_advantage_0.5x_desc:0 "This label is retained from an earlier version. The current deputy commander adjustment uses the average Martial skill formula."

rule_embattle_side_commander_traits_sharing:0 "Battle Formation: Share Deputy Commanders' Battle Traits"
setting_embattle_side_commander_traits_sharing_enable:0 "Enabled"
setting_embattle_side_commander_traits_sharing_enable_desc:0 "Your army commanders may use the specified battle traits of their deputies during combat. For each trait, only the version with the most experience applies; identical traits do not stack."
setting_embattle_side_commander_traits_sharing_disable:0 "Disabled"
setting_embattle_side_commander_traits_sharing_disable_desc:0 "Commanders do not use their deputies' battle traits. Deputy appointments and the average Martial adjustment remain in effect. Any borrowed traits are removed the next time the army is reorganized."

rule_embattle_side_commander_appointor:0 "Battle Formation: Manual Deputy Commander Appointments"
setting_embattle_side_commander_appointor_ai_only_except_own_troop:0 "Only Armies You Personally Lead"
setting_embattle_side_commander_appointor_ai_only_except_own_troop_desc:0 "You may appoint or dismiss deputies only in armies you personally command. Vacancies in other armies are filled automatically."
setting_embattle_side_commander_appointor_player_exempt:0 "Any of Your Armies"
setting_embattle_side_commander_appointor_player_exempt_desc:0 "You may appoint or dismiss deputies in any of your armies, even when you are not personally commanding them."

rule_embattle_tactic:0 "Battle Formation: Legacy Tactics (Removed)"
setting_embattle_tactic_enabled:0 "Disabled (Legacy Compatibility)"
setting_embattle_tactic_enabled_desc:0 "The additional tactics have been removed. Selecting this option will not restore them."
setting_embattle_tactic_disabled:0 "Disabled"
setting_embattle_tactic_disabled_desc:0 "The additional tactics have been removed."

rule_embattle_side_commanders_trait_xp:0 "Battle Formation: Additional Deputy Commander Trait Experience"
setting_embattle_side_commanders_trait_xp_enabled:0 "Enabled"
setting_embattle_side_commanders_trait_xp_enabled_desc:0 "Deputies may earn additional experience in the relevant traits while marching, besieging, and raiding. Marching experience is granted only to deputies in your armies; siege and raid experience applies to armies on every side. Deputies must still belong to their army and already possess the relevant trait."
setting_embattle_side_commanders_trait_xp_disabled:0 "Disabled"
setting_embattle_side_commanders_trait_xp_disabled_desc:0 "Deputies no longer gain additional marching, siege, or raid experience. Commanders earn experience as usual."

rule_embattle_acotw_compatch:0 "Battle Formation: Legacy Compatibility Option (Disabled)"
setting_embattle_acotw_compatch_enabled:0 "Disabled (Legacy Compatibility)"
setting_embattle_acotw_compatch_enabled_desc:0 "This option has been disabled. Deputies are selected only from within their own army. If a vacancy cannot be filled, it remains open."
setting_embattle_acotw_compatch_disabled:0 "Disabled"
setting_embattle_acotw_compatch_disabled_desc:0 "This option has been disabled and does not affect automatic deputy appointments."
