l_english:
 rule_hd_asp_rule:0 "Historical Aspirations"
 setting_hd_asp_rule_all:0 "#high All#!"
 setting_hd_asp_rule_all_desc:0 "Cao Cao, Liu Bei, the Sun clan and other historical figures each receive an aspiration card at the start. Players choose one of three; the AI follows history. Anyone who fulfills theirs is rewarded."
 setting_hd_asp_rule_player:0 "Players Only"
 setting_hd_asp_rule_player_desc:0 "Only players playing these figures receive aspiration cards; the AI does not."
 setting_hd_asp_rule_off:0 "Off"
 setting_hd_asp_rule_off_desc:0 "No aspiration cards are given."
 game_concept_hd_asp_aspiration:0 "Aspiration"
 game_concept_hd_asp_aspiration_desc:0 "In an age of chaos, every hero has an aim. Cao Cao, Liu Bei, the Sun clan and other historical figures may set one aspiration at the start: the path recorded in history, or another of their own. An aspiration cannot be changed once set. Fulfilling the main goal completes it; bonus goals add further rewards.\n\nA province, commandery, or county \"in your realm\" means within your realm, held by you or any of your vassals. The aspirations of the Sun and Ma clans can pass to later members of the family. Progress is reviewed at the start of each year.\n\nYour side's realm means the realm of the top liege you serve, or your own realm if you are independent."
 action_hd_asp_aspiration:0 "[GetPlayer.Custom('hd_asp_action_title')]"
 action_hd_asp_aspiration_desc:0 "[GetPlayer.Custom('hd_asp_action_desc')]\n\n#weak Progress is reviewed at the start of each year.#!"
 action_hd_asp_aspiration_click:0 "#I Click to view your character#!"
 hd_asp_action_title_fallback:0 "[hd_asp_aspiration|E]"
 hd_asp_action_desc_fallback:0 "You have an aspiration of your own."
 hd_asp_fulfilled_name_fallback:0 "a long-held aspiration"
 hd_asp_reward_small:0 "[EmptyScope.ScriptValue('hd_asp_prestige_small')|0] prestige, [EmptyScope.ScriptValue('hd_asp_gold_small')|0] gold, [EmptyScope.ScriptValue('hd_asp_dynasty_prestige_small')|0] dynasty prestige; celestial rulers also gain [EmptyScope.ScriptValue('hd_asp_influence_small')|0] influence"
 hd_asp_reward_medium:0 "[EmptyScope.ScriptValue('hd_asp_prestige_medium')|0] prestige, [EmptyScope.ScriptValue('hd_asp_gold_medium')|0] gold, [EmptyScope.ScriptValue('hd_asp_dynasty_prestige_medium')|0] dynasty prestige; celestial rulers also gain [EmptyScope.ScriptValue('hd_asp_influence_medium')|0] influence"
 hd_asp_reward_large:0 "[EmptyScope.ScriptValue('hd_asp_prestige_large')|0] prestige, [EmptyScope.ScriptValue('hd_asp_gold_large')|0] gold, [EmptyScope.ScriptValue('hd_asp_dynasty_prestige_large')|0] dynasty prestige; celestial rulers also gain [EmptyScope.ScriptValue('hd_asp_influence_large')|0] influence"
 hd_asp_lb_empire_name:0 "Han"
 hd_asp_name_sun_changjiang:0 "To the End of the Great River"
 hd_asp_card_sun_changjiang:0 "Aspiration: $hd_asp_name_sun_changjiang$"
 hd_asp_card_sun_changjiang_desc:0 "#high Main Goal#!\n· Be independent and an emperor, with both Yang and Jing provinces in your realm\n#high Bonus Goals#!\n· Yang Province is in your realm\n· Jiangxia Commandery is in your realm\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_jiangdong$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_sun_changjiang:0 "From the Records of the Three Kingdoms, Biography of Lu Su: \"Hold everything to the end of the Great River, then proclaim yourself emperor and contend for the realm.\""
 hd_asp.0100.desc.sun_changjiang:0 "From Baqiu to Wu, every banner along the Great River is yours. What was once whispered beside a couch has come true: you sit facing south as an emperor, the equal of any power in the Central Plain."
 hd_asp_name_sun_qinwang:0 "Champion of the Han"
 hd_asp_card_sun_qinwang:0 "Aspiration: $hd_asp_name_sun_qinwang$"
 hd_asp_card_sun_qinwang_desc:0 "#high Main Goal#!\n· Dong Zhuo is dead, Luoyang is in your realm, and a Han emperor still reigns\n#high Bonus Goals#!\n· Hold one of the Three Excellencies or a general's rank at the Han court\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_zhonglie$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.sun_qinwang:0 "The traitor is dead and the old capital shines again. You cleared the rubble from the ancestral temples with your own hands, and the Han emperor still sits his throne. The realm remembers who cleared his path."
 hd_asp_name_sun_zhongyuan:0 "March on the Central Plain"
 hd_asp_card_sun_zhongyuan:0 "Aspiration: $hd_asp_name_sun_zhongyuan$"
 hd_asp_card_sun_zhongyuan_desc:0 "#high Main Goal#!\n· Both Yu and Xu provinces are in your realm\n#high Bonus Goals#!\n· Yuan Shu is dead or has become your vassal\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_zhongyuan$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.sun_zhongyuan:0 "The lands between the Huai and the Si, between the Ru and the Ying, are all under your command. Men of the southeast now water their horses in the Central Plain."
 hd_asp_name_lx_baituo:0 "Free of the Overbearing Minister"
 hd_asp_card_lx_baituo:0 "Aspiration: $hd_asp_name_lx_baituo$"
 hd_asp_card_lx_baituo_desc:0 "#high Main Goal#!\n· You are still the Son of Heaven, and no overbearing minister holds you\n#high Bonus Goals#!\n· A minister who once held the emperor has died a violent death\n· Your capital is Luoyang\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_qinzheng$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_lx_baituo:0 "From the Book of the Later Han, Annals of Emperor Xian: the emperor smuggled out a secret edict sewn into a sash, and fled east from Chang'an back to Luoyang."
 hd_asp.0100.desc.lx_baituo:0 "At last the palace gates open at your own command. Edicts issue from your own hand, and officials no longer send their petitions to a minister's mansion first. For the first time the throne feels like yours."
 hd_asp_name_lx_zhongxing:0 "Restore the Han"
 hd_asp_card_lx_zhongxing:0 "Aspiration: $hd_asp_name_lx_zhongxing$"
 hd_asp_card_lx_zhongxing_desc:0 "#high Main Goal#!\n· You are still the Son of Heaven, and at least six provinces of the Han are in your realm\n#high Bonus Goals#!\n· No one else in the realm claims the title of emperor\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_zhongxing$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.lx_zhongxing:0 "The lords of the four quarters once again follow the Han calendar, and provincial clerks travel the dusty roads to submit their accounts. People call it the second restoration since Emperor Guangwu."
 hd_asp_name_lx_zongmiao:0 "Preserve the Ancestral Temple"
 hd_asp_card_lx_zongmiao:0 "Aspiration: $hd_asp_name_lx_zongmiao$"
 hd_asp_card_lx_zongmiao_desc:0 "#high Main Goal#!\n· Reach the age of fifty while the Liu clan still holds land\n#high Bonus Goals#!\n· Reach a Learning of 15\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_anming$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.lx_zongmiao:0 "After half a lifetime of storms, you have survived, and the incense of the Liu clan still burns. Some call you timid, but you know how hard it is to keep the ancestral temple standing in such an age."
 hd_asp_name_lb_xingfu:0 "Revive the House of Han"
 hd_asp_card_lb_xingfu:0 "Aspiration: $hd_asp_name_lb_xingfu$"
 hd_asp_card_lb_xingfu_desc:0 "#high Main Goal#!\n· Be independent and hold both capitals, Luoyang and Chang'an\n#high Bonus Goals#!\n· Both Jing and Yi provinces are in your realm\n· Be an emperor\n· Hanzhong Commandery is in your realm\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_rende$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_lb_xingfu:0 "From the Records of the Three Kingdoms, Biography of Zhuge Liang, the Longzhong Plan: \"Hold both Jing and Yi... then hegemony can be achieved and the House of Han revived.\""
 hd_asp_name_lb_xuzhou:0 "Hegemony from Xu Province"
 hd_asp_card_lb_xuzhou:0 "Aspiration: $hd_asp_name_lb_xuzhou$"
 hd_asp_card_lb_xuzhou_desc:0 "#high Main Goal#!\n· Be independent with Xu Province in your realm\n#high Bonus Goals#!\n· Yuan Shu is dead or has lost all his land\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_xuzhoumu$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.lb_xuzhou:0 "You did not fail the trust Tao Qian once placed in you. Between the Huai and the Si your soldiers are strong and your granaries full, and heroes everywhere say that Xu Province has found its master."
 hd_asp_name_lb_zhongchen:0 "Loyal Servant of the Han"
 hd_asp_card_lb_zhongchen:0 "Aspiration: $hd_asp_name_lb_zhongchen$"
 hd_asp_card_lb_zhongchen_desc:0 "#high Main Goal#!\n· Hold one of the Three Excellencies (including Grand General) while no minister holds the emperor\n#high Bonus Goals#!\n· A minister who once held the emperor is dead\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_hanshi_zhushi$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.lb_zhongchen:0 "You stand at the head of the court, and the emperor takes your hand and calls you a pillar of the Han. Of all the names once written on the secret edict, only yours still stands here."
 hd_asp_name_cc_tongyi:0 "Unify All Under Heaven"
 hd_asp_card_cc_tongyi:0 "Aspiration: $hd_asp_name_cc_tongyi$"
 hd_asp_card_cc_tongyi_desc:0 "#high Main Goal#!\n· At least eleven of the thirteen Han provinces are in your realm\n#high Bonus Goals#!\n· You are the minister who holds the emperor\n· At least five of the eight northern provinces (Ji, Qing, You, Bing, Yan, Yu, Xu, Sili) are in your realm\n· Receive the Nine Bestowments, or be enfeoffed as a duke or king\n· Liaoxi Commandery is in your realm (the northern campaign against the Wuhuan)\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_tianxia_guixin$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_cc_tongyi:0 "Cao Cao, Short Song Style: \"The Duke of Zhou spat out his food to receive guests, and all under heaven turned to him.\" In 208 he marched south on Jing Province."
 hd_asp.0100.desc.cc_tongyi:0 "Within the four seas, wherever your banners point, all submit. Looking out from the heights, you remember how as a youth you only hoped to become a marquis and General Who Conquers the West, and you laugh."
 hd_asp_name_cc_zhengxi:0 "Han General Who Conquers the West"
 hd_asp_card_cc_zhengxi:0 "Aspiration: $hd_asp_name_cc_zhengxi$"
 hd_asp_card_cc_zhengxi_desc:0 "#high Main Goal#!\n· Be a general under the Son of Heaven, with Liang Province in your realm, while a Han emperor reigns\n#high Bonus Goals#!\n· When the goal is reached, you have neither proclaimed yourself emperor nor received the Nine Bestowments or a ducal or royal fief\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_han_zhongchen$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.cc_zhengxi:0 "The Qiang uprisings are quelled and Liang Province is at peace. You have already chosen the words for your tomb. A short line will do: Tomb of Marquis Cao, late General Who Conquers the West of the Han."
 hd_asp_name_cc_daihan:0 "Supplant the Han"
 hd_asp_card_cc_daihan:0 "Aspiration: $hd_asp_name_cc_daihan$"
 hd_asp_card_cc_daihan_desc:0 "#high Main Goal#!\n· Be an emperor\n#high Bonus Goals#!\n· Luoyang or Chang'an is in your realm\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_weiwu$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.cc_daihan:0 "Four hundred years of Han end in your hands. Your ministers cry out ten thousand years, but you think of the old friends who died along the way, and say nothing."
 hd_asp_name_yshao_zhengtianxia:0 "Face South and Contend for the Realm"
 hd_asp_card_yshao_zhengtianxia:0 "Aspiration: $hd_asp_name_yshao_zhengtianxia$"
 hd_asp_card_yshao_zhengtianxia_desc:0 "#high Main Goal#!\n· Be independent with Ji, Qing, You, and Bing provinces in your realm\n#high Bonus Goals#!\n· Cao Cao is dead or has become your vassal\n· You are the minister who holds the emperor\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_hebei$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_yshao_zhengtianxia:0 "From the Records of the Three Kingdoms, Annals of Emperor Wu: Yuan Shao told Cao Cao, \"I will hold the River to the south and Yan and Dai to the north, gather the steppe peoples, and face south to contend for the realm.\""
 hd_asp.0100.desc.yshao_zhengtianxia:0 "You hold the Yellow River to the south and Yan and Dai to the north, with the peoples of the steppe at your side. Everything you once told Cao Cao at Suanzao has come true."
 hd_asp_name_yshao_yongli:0 "Kingmaker"
 hd_asp_card_yshao_yongli:0 "Aspiration: $hd_asp_name_yshao_yongli$"
 hd_asp_card_yshao_yongli_desc:0 "#high Main Goal#!\n· A member of the Liu clan is emperor, and you are his vassal or the minister who holds him\n#high Bonus Goals#!\n· That emperor's opinion of you is at least 50\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_dingce$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.yshao_yongli:0 "On the day of his enthronement the new emperor would not let go of your hand. Every official at court knows who put him on the throne."
 hd_asp_name_yshao_chengdi:0 "Proclaim a New Dynasty"
 hd_asp_card_yshao_chengdi:0 "Aspiration: $hd_asp_name_yshao_chengdi$"
 hd_asp_card_yshao_chengdi_desc:0 "#high Main Goal#!\n· Be an emperor\n#high Bonus Goals#!\n· Luoyang or Chang'an is in your realm\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_sishi_sangong$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.yshao_chengdi:0 "Four generations of the Three Excellencies have led at last to the throne itself. The Yuan clan's former students and officials across the realm now bow as your subjects."
 hd_asp_name_yshu_zhongjia:0 "Heir of the Prophecy"
 hd_asp_card_yshu_zhongjia:0 "Aspiration: $hd_asp_name_yshu_zhongjia$"
 hd_asp_card_yshu_zhongjia_desc:0 "#high Main Goal#!\n· Be an emperor with Yang or Yu Province in your realm\n#high Bonus Goals#!\n· You hold the Imperial Seal\n· Xu Province is in your realm\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_zhongjia$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_yshu_zhongjia:0 "From the Records of the Three Kingdoms, Biography of Yuan Shu: in 197 Yuan Shu proclaimed himself emperor at Shouchun, naming his dynasty Zhong."
 hd_asp.0100.desc.yshu_zhongjia:0 "The prophecy is fulfilled. You ascend the altar, report to Heaven, and name your dynasty Zhong. Yet in the cheers of the officials below, something sincere seems to be missing."
 hd_asp_name_yshu_huainan:0 "Master of Huainan"
 hd_asp_card_yshu_huainan:0 "Aspiration: $hd_asp_name_yshu_huainan$"
 hd_asp_card_yshu_huainan_desc:0 "#high Main Goal#!\n· Without proclaiming yourself emperor, hold both Yang and Yu provinces\n#high Bonus Goals#!\n· Lü Bu or Liu Bei has lost all his land\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_huainan$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.yshu_huainan:0 "All the rich land of Huainan is in your grasp, and your treasuries overflow. You finally understand that solid territory matters more than any crown."
 hd_asp_name_yshu_yuanmen:0 "Head of the Yuan Clan"
 hd_asp_card_yshu_yuanmen:0 "Aspiration: $hd_asp_name_yshu_yuanmen$"
 hd_asp_card_yshu_yuanmen_desc:0 "#high Main Goal#!\n· Yuan Shao is dead or has become your vassal\n#high Bonus Goals#!\n· Any commandery of Ji Province is in your realm\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_sishi_sangong$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.yshu_yuanmen:0 "Your elder half-brother, born of a maidservant, could not outshine you in the end. From now on, when people speak of the Yuan of Runan, your name comes first."
 hd_asp_name_ma_guanxi:0 "Lord of the West of the Passes"
 hd_asp_card_ma_guanxi:0 "Aspiration: $hd_asp_name_ma_guanxi$"
 hd_asp_card_ma_guanxi_desc:0 "#high Main Goal#!\n· Be independent with Liang Province in your realm\n#high Bonus Goals#!\n· Chang'an is in your realm\n· Han Sui is dead or has become your vassal\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_xiliang$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_ma_guanxi:0 "From the Records of the Three Kingdoms, Biography of Ma Chao: Ma Teng held Liang Province, and Ma Chao raised troops in Guanzhong and fought at Tong Pass."
 hd_asp.0100.desc.ma_guanxi:0 "Every beacon tower in Liang Province flies the banner of the Ma clan, and the chieftains of the Qiang and Di lead their horses to greet you. West of the passes, there is now only one voice."
 hd_asp_name_ma_fubo:0 "Legacy of the Wave-Calming General"
 hd_asp_card_ma_fubo:0 "Aspiration: $hd_asp_name_ma_fubo$"
 hd_asp_card_ma_fubo_desc:0 "#high Main Goal#!\n· Be a general under the Son of Heaven, with Liang Province in your realm and no independent Qiang or Di chieftain left there\n#high Bonus Goals#!\n· No minister holds the emperor\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_fubo$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.ma_fubo:0 "The western frontier is pacified; the Qiang and Di have surrendered or scattered. Burning incense before the shrine of your ancestor Ma Yuan, you feel you have not disgraced the Wave-Calming General."
 hd_asp_name_ma_bashu:0 "Take Ba and Shu"
 hd_asp_card_ma_bashu:0 "Aspiration: $hd_asp_name_ma_bashu$"
 hd_asp_card_ma_bashu_desc:0 "#high Main Goal#!\n· Be independent with Hanzhong Commandery and Yi Province in your realm\n#high Bonus Goals#!\n· Zhang Lu, Liu Yan, or Liu Zhang has lost all his land\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_rushu$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.ma_bashu:0 "The iron cavalry of Xiliang has crossed the Qinling and entered the Land of Abundance. The roads to Shu are hard, but not hard enough to stop the Ma clan."
 hd_asp_name_lc_baojing:0 "Guardian of Chen"
 hd_asp_card_lc_baojing:0 "Aspiration: $hd_asp_name_lc_baojing$"
 hd_asp_card_lc_baojing_desc:0 "#high Main Goal#!\n· Dong Zhuo is dead, Chen is still in your hands, and you have never become Yuan Shu's vassal\n#high Bonus Goals#!\n· The counties of Chen reach an average development of 20\n· Live past the year 197\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_chenwang_qiangnu$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_lc_baojing:0 "From the Book of the Later Han, Biographies of the Eight Princes of Emperor Ming: Liu Chong, Prince of Chen, was skilled with the crossbow. When the Yellow Turbans rose and other commanderies were abandoned, Chen alone held, and over a hundred thousand people took refuge there."
 hd_asp.0100.desc.lc_baojing:0 "The world outside has changed hands several times, yet the gates of Chen have never fallen. The people say that as long as the Prince of Chen is here, they can eat in peace."
 hd_asp_name_lc_jitong:0 "Heir from the Imperial Clan"
 hd_asp_card_lc_jitong:0 "Aspiration: $hd_asp_name_lc_jitong$"
 hd_asp_card_lc_jitong_desc:0 "#high Main Goal#!\n· Be an emperor as a member of the Liu clan\n#high Bonus Goals#!\n· Luoyang or Chang'an is in your realm\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_guangwu$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.lc_jitong:0 "Of all the imperial clan, it is you who has taken up the succession. You recall that Emperor Guangwu also rose from a minor branch of the family, and you sit a little straighter."
 hd_asp_name_lc_yuzhou:0 "Master of Yu Province"
 hd_asp_card_lc_yuzhou:0 "Aspiration: $hd_asp_name_lc_yuzhou$"
 hd_asp_card_lc_yuzhou_desc:0 "#high Main Goal#!\n· Be independent with Yu Province in your realm\n#high Bonus Goals#!\n· Yuan Shu has lost all his land\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_chenwang_qiangnu$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.lc_yuzhou:0 "The crossbowmen of Chen followed you beyond the walls, and the commanderies of Ru and Ying submitted one by one. All of Yu Province now knows the name of the Prince of Chen."
 hd_asp_name_zgl_beiding:0 "Pacify the Central Plain"
 hd_asp_card_zgl_beiding:0 "Aspiration: $hd_asp_name_zgl_beiding$"
 hd_asp_card_zgl_beiding_desc:0 "#high Main Goal#!\n· Chang'an and Luoyang are both in your side's realm\n#high Bonus Goals#!\n· Serve as Chancellor\n· The southern commanderies (Yuexi, Jianning, Yongchang, Zangke) are all in your side's realm\n· Tianshui Commandery is in your side's realm\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_wolong$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_zgl_beiding:0 "From Zhuge Liang's Memorial on Dispatching the Troops: lead the three armies north and pacify the Central Plain, revive the House of Han and return to the old capitals."
 hd_asp.0100.desc.zgl_beiding:0 "Han banners fly again over the old palaces. Standing on the walls of Chang'an, you recall the words spoken in a thatched hut at Longzhong twenty years ago; every one of them has come true."
 hd_asp_name_zgl_longzhong:0 "The Longzhong Plan"
 hd_asp_card_zgl_longzhong:0 "Aspiration: $hd_asp_name_zgl_longzhong$"
 hd_asp_card_zgl_longzhong_desc:0 "#high Main Goal#!\n· Both Jing and Yi provinces are in your side's realm\n#high Bonus Goals#!\n· Your lord is allied with Sun Quan or his heirs\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_sanfen$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.zgl_longzhong:0 "Holding both Jing and Yi, guarding their passes, allied with Sun Quan abroad and well governed at home: the map of the realm you drew in a thatched hut now lies on your lord's desk."
 hd_asp_name_zgl_jugong:0 "Devoted unto Death"
 hd_asp_card_zgl_jugong:0 "Aspiration: $hd_asp_name_zgl_jugong$"
 hd_asp_card_zgl_jugong_desc:0 "#high Main Goal#!\n· Serve as Chancellor at age 54 or older while your side still holds Yi Province\n#high Bonus Goals#!\n· Reach 20 Learning\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_jugong$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.zgl_jugong:0 "The papers on your desk are still piled high, and your hair has turned grey. The realm the late emperor entrusted to you still stands, and so do you. That is enough."
 hd_asp_name_gy_weizhen:0 "Awe over All China"
 hd_asp_card_gy_weizhen:0 "Aspiration: $hd_asp_name_gy_weizhen$"
 hd_asp_card_gy_weizhen_desc:0 "#high Main Goal#!\n· Xiangyang and Nanyang commanderies are both in your side's realm, and you still serve the Liu\n#high Bonus Goals#!\n· Yu Jin or Pang De is dead or held prisoner by your side\n· Yingchuan Commandery (Xu) is in your side's realm\n· Nan Commandery (Jiangling) is in your side's realm\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_wusheng$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_gy_weizhen:0 "From the Records of the Three Kingdoms, Biography of Guan Yu: his might shook all of China, and Lord Cao considered moving the capital away from Xu to avoid him."
 hd_asp.0100.desc.gy_weizhen:0 "The Han River rose and seven armies drowned. Fan and Wan surrendered at the sight of your banners, and in Xu people speak your name at night."
 hd_asp_name_gy_yibo:0 "Righteousness to the Clouds"
 hd_asp_card_gy_yibo:0 "Aspiration: $hd_asp_name_gy_yibo$"
 hd_asp_card_gy_yibo_desc:0 "#high Main Goal#!\n· At age 60 or older, still serve the Liu (Liu Bei or his heirs)\n#high Bonus Goals#!\n· Zhang Fei is still alive\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_yijue$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.gy_yibo:0 "The oath of the peach garden has held for half a lifetime. Your hair is white as frost, and beside you are the same familiar faces as long ago."
 hd_asp_name_gy_jingzhou:0 "Master of Jing"
 hd_asp_card_gy_jingzhou:0 "Aspiration: $hd_asp_name_gy_jingzhou$"
 hd_asp_card_gy_jingzhou_desc:0 "#high Main Goal#!\n· Hold the title of Jing Province, with all of Jing Province in your side's realm\n#high Bonus Goals#!\n· Jiangxia and Changsha commanderies are both in your side's realm\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_zhenjing$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.gy_jingzhou:0 "Jiangling, Xiangyang, Changsha, Wuling: all the lands of Jing are in your grip. The north dares not look south, and Wu can only sigh across the river."
 hd_asp_name_jw_jiufa:0 "Nine Campaigns North"
 hd_asp_card_jw_jiufa:0 "Aspiration: $hd_asp_name_jw_jiufa$"
 hd_asp_card_jw_jiufa_desc:0 "#high Main Goal#!\n· Liang Province and Chang'an are both in your side's realm, and you still serve the Liu\n#high Bonus Goals#!\n· Tianshui Commandery (your homeland) is in your side's realm\n· Serve as Grand General\n· Sima Shi or Sima Zhao is dead\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_liangzhou_shangshi$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_jw_jiufa:0 "From the Records of the Three Kingdoms, Biography of Jiang Wei: he hoped to win over the Qiang and Hu, believing everything west of Long could be cut off and held."
 hd_asp.0100.desc.jw_jiufa:0 "All the commanderies of Longyou are retaken, and Han banners fly again over Chang'an. Had the Chancellor lived to see it, he would have smiled."
 hd_asp_name_jw_baoshu:0 "Hold Ba and Shu"
 hd_asp_card_jw_baoshu:0 "Aspiration: $hd_asp_name_jw_baoshu$"
 hd_asp_card_jw_baoshu_desc:0 "#high Main Goal#!\n· In the year 270 a Liu ruler still holds Chengdu and Hanzhong Commandery, and you still serve them\n#high Bonus Goals#!\n· Wudu and Yinping commanderies are both in your side's realm\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_jiange$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.jw_baoshu:0 "Jiange still stands, and so does Chengdu. You guarded them all your life, and the ancestral temples of Shu-Han still burn their incense."
 hd_asp_name_jw_fuhan:0 "The Plot to Restore Han"
 hd_asp_card_jw_fuhan:0 "Aspiration: $hd_asp_name_jw_fuhan$"
 hd_asp_card_jw_fuhan_desc:0 "#high Main Goal#!\n· Zhong Hui is dead or has submitted, and an independent Liu ruler holds Chengdu\n#high Bonus Goals#!\n· Deng Ai is dead\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_guzhong$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.jw_fuhan:0 "The state was in peril and is safe again; sun and moon were darkened and shine once more. The words of your secret letter have come true."
 hd_asp_name_sm_jinji:0 "Foundation of Jin"
 hd_asp_card_sm_jinji:0 "Aspiration: $hd_asp_name_sm_jinji$"
 hd_asp_card_sm_jinji_desc:0 "#high Main Goal#!\n· A Cao emperor is held in your grip, and you have received the Nine Bestowments or a ducal or royal fief\n#high Bonus Goals#!\n· Cao Shuang is dead\n· Wang Ling, Guanqiu Jian and Zhuge Dan are all dead\n· The Liu no longer hold Chengdu\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_yingshi_langgu$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_sm_jinji:0 "From Xi Zuochi's Spring and Autumn of Han and Jin: the Wei emperor Cao Mao cried out that the heart of Sima Zhao was known to every passerby."
 hd_asp.0100.desc.sm_jinji:0 "The Nine Bestowments are yours, and a royal title in your hand. Everyone in Luoyang knows the realm of Wei has a new master; only the edict of abdication is missing."
 hd_asp_name_sm_zhushi:0 "Pillar of Wei"
 hd_asp_card_sm_zhushi:0 "Aspiration: $hd_asp_name_sm_zhushi$"
 hd_asp_card_sm_zhushi_desc:0 "#high Main Goal#!\n· Hold one of the Three Excellencies (including Grand General), while a Cao emperor reigns over at least nine provinces\n#high Bonus Goals#!\n· Zhuge Liang or Jiang Wei is dead\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_sheji$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.sm_zhushi:0 "You have served several reigns and always stood with the house of Wei. The court says Wei owes half its fortune to the late emperors and half to you."
 hd_asp_name_sm_hunyi:0 "Unite the Realm"
 hd_asp_card_sm_hunyi:0 "Aspiration: $hd_asp_name_sm_hunyi$"
 hd_asp_card_sm_hunyi_desc:0 "#high Main Goal#!\n· Yi and Yang provinces are both in your side's realm\n#high Bonus Goals#!\n· Chengdu is in your side's realm\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_hunyi_gong$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.sm_hunyi:0 "The roads to Shu are open and the Great River crossed; the realm divided in three is whole again. A century of chaos ends in your generation."
 hd_asp_name_zh_jushu:0 "Ambition in Shu"
 hd_asp_card_zh_jushu:0 "Aspiration: $hd_asp_name_zh_jushu$"
 hd_asp_card_zh_jushu_desc:0 "#high Main Goal#!\n· Personally hold Shu Commandery, where Chengdu lies\n#high Bonus Goals#!\n· Deng Ai is dead or your prisoner\n· Jiang Wei is your subject\n· Hanzhong Commandery is in your realm\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_zifang$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_zh_jushu:0 "From the Records of the Three Kingdoms, Biography of Zhong Hui: he believed his achievements surpassed all others and that he could no longer serve beneath anyone."
 hd_asp.0100.desc.zh_jushu:0 "Chengdu lies at your feet, and the soldiers and grain of Shu answer to you. Suddenly you feel you were never meant to serve beneath another."
 hd_asp_name_zh_mieshu:0 "First Merit in Conquering Shu"
 hd_asp_card_zh_mieshu:0 "Aspiration: $hd_asp_name_zh_mieshu$"
 hd_asp_card_zh_mieshu_desc:0 "#high Main Goal#!\n· Chengdu is in your side's realm, and you have received the Nine Bestowments or a ducal or royal fief\n#high Bonus Goals#!\n· Liu Shan has submitted to Wei or is dead\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_mieshu$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.zh_mieshu:0 "The surrender of Shu-Han has reached Luoyang, and your name heads the list of those who conquered it."
 hd_asp_name_zh_wangzuo:0 "Talent of a Royal Advisor"
 hd_asp_card_zh_wangzuo:0 "Aspiration: $hd_asp_name_zh_wangzuo$"
 hd_asp_card_zh_wangzuo_desc:0 "#high Main Goal#!\n· Hold one of the Three Excellencies or the office of Director of the Secretariat, with at least 18 Learning\n#high Bonus Goals#!\n· Reach 22 Learning\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_wangzuo$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.zh_wangzuo:0 "Most great affairs at court come from your plans. People say Grand Tutor Zhong has a worthy heir, but your thoughts are already further away."
 hd_asp_name_xiu_zhongxing:0 "Restoration of Guangwu"
 hd_asp_card_xiu_zhongxing:0 "Aspiration: $hd_asp_name_xiu_zhongxing$"
 hd_asp_card_xiu_zhongxing_desc:0 "#high Main Goal#!\n· Be an emperor and hold Luoyang\n#high Bonus Goals#!\n· Both Ji and You provinces are in your realm\n· Wang Mang is dead\n· Wei Xiao and Gongsun Shu are both dead or have submitted\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_guangwu_di$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_xiu_zhongxing:0 "From the Book of the Later Han, Annals of Emperor Guangwu: the Red Hidden Talisman foretold that Liu Xiu would raise troops to seize the lawless."
 hd_asp.0100.desc.xiu_zhongxing:0 "Han banners fly over Luoyang once more. The Nanyang scholar who once rode to war on an ox now receives the homage of the court."
 hd_asp_name_xiu_gengshi:0 "Minister of the Gengshi Emperor"
 hd_asp_card_xiu_gengshi:0 "Aspiration: $hd_asp_name_xiu_gengshi$"
 hd_asp_card_xiu_gengshi_desc:0 "#high Main Goal#!\n· Serve the Gengshi Emperor Liu Xuan as one of the Three Excellencies (including Grand Marshal), with Nanyang Commandery in your side's realm\n#high Bonus Goals#!\n· Your elder brother Liu Yan is still alive\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_gengshi$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.xiu_gengshi:0 "The Gengshi Emperor reads out your merits in the hall, with your elder brother Bosheng beside you. The Liu brothers of Chongling have found their footing in the new court."
 hd_asp_name_xiu_lihua:0 "A Wife Like Yin Lihua"
 hd_asp_card_xiu_lihua:0 "Aspiration: $hd_asp_name_xiu_lihua$"
 hd_asp_card_xiu_lihua_desc:0 "#high Main Goal#!\n· Marry Yin Lihua, and hold a court office or a general's rank\n#high Bonus Goals#!\n· Have a child with Yin Lihua\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_kangli$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_xiu_lihua:0 "From the Book of the Later Han, Annals of the Empresses: hearing of Yin Lihua's beauty, the young Liu Xiu sighed that a career should make one Bearer of the Golden Mace, and a wife should be Yin Lihua."
 hd_asp.0100.desc.xiu_lihua:0 "A wish you spoke carelessly as a youth has come true. You have the office, and you have the bride; you want for nothing more."
 hd_asp_name_lyuan_shaohan:0 "Successor to Han"
 hd_asp_card_lyuan_shaohan:0 "Aspiration: $hd_asp_name_lyuan_shaohan$"
 hd_asp_card_lyuan_shaohan_desc:0 "#high Main Goal#!\n· Be an emperor and hold both Pingyang Commandery and Luoyang\n#high Bonus Goals#!\n· All of Bing Province is in your realm\n· The Sima no longer hold the Hegemony\n· Chang'an is in your realm\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_shaohan$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_lyuan_shaohan:0 "From the Book of Jin, Record of Liu Yuanhai: Liu Yuan said that as a nephew of the Han, sworn as brothers, it was only right that the younger continue when the elder fell."
 hd_asp.0100.desc.lyuan_shaohan:0 "At Pingyang you ascend the altar, honor Liu Shan as an emperor of your line, and sacrifice to the founders of Han. The name of Han continues, now in Xiongnu hands."
 hd_asp_name_lyuan_huhanye:0 "The Legacy of Huhanye"
 hd_asp_card_lyuan_huhanye:0 "Aspiration: $hd_asp_name_lyuan_huhanye$"
 hd_asp_card_lyuan_huhanye_desc:0 "#high Main Goal#!\n· Be independent with all of Bing Province in your realm\n#high Bonus Goals#!\n· No Tuoba ruler remains independent\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_chanyu$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.lyuan_huhanye:0 "All five Xiongnu divisions answer to you, and the pastures and cities of Bing are yours. The heirs of Chanyu Huhanye are masters of the north once more."
 hd_asp_name_lyuan_fanping:0 "Bulwark of Jin"
 hd_asp_card_lyuan_fanping:0 "Aspiration: $hd_asp_name_lyuan_fanping$"
 hd_asp_card_lyuan_fanping_desc:0 "#high Main Goal#!\n· Still serve the Jin as one of the Three Excellencies or with a general's rank, with at least three commanderies of Bing Province in your realm\n#high Bonus Goals#!\n· Reach 15 Learning\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_jin_fanping$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.lyuan_fanping:0 "The princes of Jin fight endlessly, while you hold Bing Province steady. The court relies on you and the five divisions obey you; this path may be no worse than kingship."
 hd_asp_name_zt_jiji:0 "Striking the Oar Midstream"
 hd_asp_card_zt_jiji:0 "Aspiration: $hd_asp_name_zt_jiji$"
 hd_asp_card_zt_jiji_desc:0 "#high Main Goal#!\n· All of Yu Province is in your side's realm, and you still serve the Jin\n#high Bonus Goals#!\n· Qiao County is in your side's realm\n· Shi Le no longer holds any county in Yu Province\n· Liu Kun is still alive\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_jiji$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_zt_jiji:0 "From the Book of Jin, Biography of Zu Ti: crossing the Yangzi, he struck his oar midstream and swore by the river that he would not return until the Central Plain was cleansed."
 hd_asp.0100.desc.zt_jiji:0 "Everything south of the Yellow River is Jin land again, and Shi Le's horsemen dare not graze their horses to the south. The oath you swore striking your oar midstream has been kept."
 hd_asp_name_zt_fuluo:0 "Retake Luoyang"
 hd_asp_card_zt_fuluo:0 "Aspiration: $hd_asp_name_zt_fuluo$"
 hd_asp_card_zt_fuluo_desc:0 "#high Main Goal#!\n· Luoyang is in your side's realm, and your side is ruled by the Jin\n#high Bonus Goals#!\n· Hold the title of Yu Province\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_fuluo$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.zt_fuluo:0 "The palaces of Luoyang lie in ruins, but the banners of Jin have returned to the old capital. The people left behind in the north come out with their old and young to greet the imperial army."
 hd_asp_name_zt_fanyang:0 "Pride of Fanyang"
 hd_asp_card_zt_fanyang:0 "Aspiration: $hd_asp_name_zt_fanyang$"
 hd_asp_card_zt_fanyang_desc:0 "#high Main Goal#!\n· Hold at least three commanderies, with Zhuo Commandery (Fanyang of the Jin) in your side's realm\n#high Bonus Goals#!\n· Liu Kun is still alive\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_fanyang_zu$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.zt_fanyang:0 "The name of the Zu of Fanyang shines brighter in your hands. The elders of your homeland say the Zu family has produced a hero."
 hd_asp_name_lk_gushou:0 "Holding Bing Alone"
 hd_asp_card_lk_gushou:0 "Aspiration: $hd_asp_name_lk_gushou$"
 hd_asp_card_lk_gushou_desc:0 "#high Main Goal#!\n· Hold Taiyuan Commandery and the title of Bing Province, still serve the Jin, and never bend the knee to Liu Yuan or Shi Le\n#high Bonus Goals#!\n· Liu Yuan is dead\n· The Tuoba are allied with you\n· Zu Ti is still alive\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_zhenge$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_lk_gushou:0 "From the Book of Jin, Biography of Liu Kun: he wrote that he slept on his spear waiting for dawn, resolved to destroy the rebels, always afraid Zu Ti would crack the whip before him."
 hd_asp.0100.desc.lk_gushou:0 "Hu horsemen ring the walls of Jinyang, yet the Jin banner on the walls never falls. You play the reed pipe under the moon, and the besiegers, weeping, abandon the siege."
 hd_asp_name_lk_liangjing:0 "Retake Both Capitals"
 hd_asp_card_lk_liangjing:0 "Aspiration: $hd_asp_name_lk_liangjing$"
 hd_asp_card_lk_liangjing_desc:0 "#high Main Goal#!\n· Luoyang and Chang'an are both in your side's realm, and your side is ruled by the Jin\n#high Bonus Goals#!\n· Liu Cong is dead\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_liangjing$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.lk_liangjing:0 "Both capitals are Jin land again. Standing on the ruined gate towers of Luoyang, you think of the old friends who drank and wrote poetry in the Golden Valley; few of them remain."
 hd_asp_name_lk_fufeng:0 "The Song of Fufeng"
 hd_asp_card_lk_fufeng:0 "Aspiration: $hd_asp_name_lk_fufeng$"
 hd_asp_card_lk_fufeng_desc:0 "#high Main Goal#!\n· Reach 15 Diplomacy and 15 Learning, with at least two commanderies of Bing Province in your realm\n#high Bonus Goals#!\n· Duan Pidi or the Tuoba are allied with you\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_fufeng$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.lk_fufeng:0 "Your poetry is famed across the land, and your good faith has won over Hu and Han alike. Even in an age of chaos, you have kept one corner at peace."
 hd_asp_name_hw_sanfa:0 "Three Northern Campaigns"
 hd_asp_card_hw_sanfa:0 "Aspiration: $hd_asp_name_hw_sanfa$"
 hd_asp_card_hw_sanfa_desc:0 "#high Main Goal#!\n· Hold both Chengdu and Luoyang\n#high Bonus Goals#!\n· All of Yi Province is in your realm (Cheng-Han destroyed)\n· Chang'an is in your realm\n· Receive the Nine Bestowments or a ducal or royal fief\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_xuanwu$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_hw_sanfa:0 "From the Book of Jin, Biography of Huan Wen: rising from his pillow, he said that if he could not leave a fragrant name for later ages, he might as well leave a stink for ten thousand years."
 hd_asp.0100.desc.hw_sanfa:0 "You have taken Ba and Shu in the west and Luoyang in the north. Passing Jincheng, you see the willows you planted long ago grown ten spans around, and weep with a branch in your hand: if even trees change so, how can a man endure?"
 hd_asp_name_hw_jingchu:0 "Master of Jing and Chu"
 hd_asp_card_hw_jingchu:0 "Aspiration: $hd_asp_name_hw_jingchu$"
 hd_asp_card_hw_jingchu_desc:0 "#high Main Goal#!\n· Jing and Yi provinces are both in your realm, and you hold the title of Jing Province\n#high Bonus Goals#!\n· Xiangyang Commandery is in your realm\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_jingchu$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.hw_jingchu:0 "All the upriver lands are yours. Whenever the court at Jiankang faces a great matter, it first asks what Jing Province thinks."
 hd_asp_name_hw_tongyi:0 "Unite the Realm"
 hd_asp_card_hw_tongyi:0 "Aspiration: $hd_asp_name_hw_tongyi$"
 hd_asp_card_hw_tongyi_desc:0 "#high Main Goal#!\n· At least eleven of the thirteen Han provinces are in your side's realm, and your side is ruled by the Jin\n#high Bonus Goals#!\n· Luoyang and Chang'an are both in your side's realm\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_hunyi_yunei$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.hw_tongyi:0 "For the first time since the flight south, the Jin hold the realm again. When people speak of this deed, your name comes first."
 hd_asp_name_yh_beizheng:0 "March on Xu and Luo"
 hd_asp_card_yh_beizheng:0 "Aspiration: $hd_asp_name_yh_beizheng$"
 hd_asp_card_yh_beizheng_desc:0 "#high Main Goal#!\n· Yingchuan Commandery (Xuchang) and Luoyang are both in your side's realm, and your side is ruled by the Jin\n#high Bonus Goals#!\n· Shouchun Commandery is in your side's realm\n· Yao Xiang is dead or has become your vassal\n· Huan Wen is not your liege and does not hold the title of Yang Province\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_fengliu$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_yh_beizheng:0 "From the Book of Jin, Biography of Yin Hao: in the Yonghe years he commanded the armies of five provinces and petitioned to march north on Xu and Luo."
 hd_asp.0100.desc.yh_beizheng:0 "Xu and Luo are retaken one after the other, and court and country say Yin Shenyuan has lived up to his name. Those who mocked you as a mere talker have fallen silent."
 hd_asp_name_yh_qingyan:0 "Master of Pure Conversation"
 hd_asp_card_yh_qingyan:0 "Aspiration: $hd_asp_name_yh_qingyan$"
 hd_asp_card_yh_qingyan_desc:0 "#high Main Goal#!\n· Reach 18 Learning and prestige level 3\n#high Bonus Goals#!\n· Hold one of the Three Excellencies or the office of Director of the Secretariat\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_qingtan$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.yh_qingyan:0 "When you speak at a gathering for pure conversation, the room falls silent. The gentlemen south of the Yangzi count it an honor to debate with you."
 hd_asp_name_yh_yangzhou:0 "Weight of Yang Province"
 hd_asp_card_yh_yangzhou:0 "Aspiration: $hd_asp_name_yh_yangzhou$"
 hd_asp_card_yh_yangzhou_desc:0 "#high Main Goal#!\n· Hold the title of Yang Province, and Huan Wen is not your liege\n#high Bonus Goals#!\n· Danyang Commandery (Jiankang) is in your side's realm\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_yangzhou_zhong$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.yh_yangzhou:0 "Yang Province is the root of the court, and it is firmly in your hands. However strong Huan Wen of Jing grows, he dare not lightly come down the river."
 hd_asp_name_fj_hunyi:0 "Unite the Six Directions"
 hd_asp_card_fj_hunyi:0 "Aspiration: $hd_asp_name_fj_hunyi$"
 hd_asp_card_fj_hunyi_desc:0 "#high Main Goal#!\n· Assume a supreme title (Heavenly King or Emperor: hold the hegemony, or hold an empire as primary title and complete the coronation), with at least eleven of the thirteen Han provinces in your realm\n#high Bonus Goals#!\n· Former Yan has fallen (Murong Wei has lost all his land or submitted)\n· Former Liang and Dai have fallen (Zhang Tianxi and Tuoba Shiyijian have lost all their land or submitted)\n· Wang Meng is alive and serves as your Chancellor\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_qin_tianwang$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_fj_hunyi:0 "From the Book of Jin, Record of Fu Jian: he said that after nearly twenty years on the throne the four quarters were largely settled, and only the southeast corner had yet to accept his rule."
 hd_asp.0100.desc.fj_hunyi:0 "Within the four seas, carts run on one gauge and writing follows one script. From the walls of Chang'an you watch envoys of every nation arrive, and feel you have finally earned the title of Heavenly King."
 hd_asp_name_fj_guanzhong:0 "Good Rule in Guanzhong"
 hd_asp_card_fj_guanzhong:0 "Aspiration: $hd_asp_name_fj_guanzhong$"
 hd_asp_card_fj_guanzhong_desc:0 "#high Main Goal#!\n· All of Yong Province and Chang'an are in your realm, with at least 15 Stewardship\n#high Bonus Goals#!\n· Wang Meng is alive and serves as your Chancellor\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_guanzhong_zhi$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.fj_guanzhong:0 "In Guanzhong no one bars their door at night, and locust trees and willows line the roads from Chang'an to every province. The people sing of the great streets of Chang'an shaded by trees."
 hd_asp_name_fj_beifang:0 "Unite the North"
 hd_asp_card_fj_beifang:0 "Aspiration: $hd_asp_name_fj_beifang$"
 hd_asp_card_fj_beifang_desc:0 "#high Main Goal#!\n· Ji, You, Bing, Yong, Liang and Si provinces are all in your realm\n#high Bonus Goals#!\n· Former Yan has fallen\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_beitu$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.fj_beifang:0 "North and south of the Yellow River, inside and beyond the Great Wall, all is the land of Great Qin. For the first time since the Yongjia disaster, the north is united."
 hd_asp_name_lyu_qitun:0 "Swallowing Ten Thousand Li"
 hd_asp_card_lyu_qitun:0 "Aspiration: $hd_asp_name_lyu_qitun$"
 hd_asp_card_lyu_qitun_desc:0 "#high Main Goal#!\n· Hold both Luoyang and Chang'an\n#high Bonus Goals#!\n· Huan Xuan is dead\n· Southern Yan has fallen (Murong Chao has lost all his land or is dead)\n· Later Qin has fallen (Yao Hong has lost all his land or is dead)\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_qitun$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_lyu_qitun:0 "Xin Qiji, Recalling the Past at Beigu Pavilion in Jingkou: in those years, with golden spears and iron horses, he swallowed ten thousand li like a tiger."
 hd_asp.0100.desc.lyu_qitun:0 "Both capitals are retaken, and the elders of Guanzhong come out with food and drink to welcome the army. A sandal-seller from Jingkou has come this far."
 hd_asp_name_lyu_kuangfu:0 "Restore the Jin"
 hd_asp_card_lyu_kuangfu:0 "Aspiration: $hd_asp_name_lyu_kuangfu$"
 hd_asp_card_lyu_kuangfu_desc:0 "#high Main Goal#!\n· Huan Xuan is dead, the Sima hold the Hegemony again, and you are one of the Three Excellencies (including Grand General)\n#high Bonus Goals#!\n· Lu Xun is dead\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_zaizao$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.lyu_kuangfu:0 "The usurper Huan Xuan is dead and the Jin emperor has returned to Jiankang. The whole court knows whose doing it was."
 hd_asp_name_lyu_beifu:0 "Master of the Northern Garrison"
 hd_asp_card_lyu_beifu:0 "Aspiration: $hd_asp_name_lyu_beifu$"
 hd_asp_card_lyu_beifu_desc:0 "#high Main Goal#!\n· Hold the title of Yang Province, with Piling Commandery (Jingkou) in your realm\n#high Bonus Goals#!\n· All of Xu Province is in your realm\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_beifu$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.lyu_beifu:0 "The Beifu army at Jingkou answers to you alone. With the finest troops in the realm in your hands, even the court at Jiankang must watch your mood."
 hd_asp_name_hj_dajiangjun:0 "Grand General of the Universe"
 hd_asp_card_hj_dajiangjun:0 "Aspiration: $hd_asp_name_hj_dajiangjun$"
 hd_asp_card_hj_dajiangjun_desc:0 "#high Main Goal#!\n· Hold Jiankang, with the Liang emperor in your grip (as your subject or your prisoner)\n#high Bonus Goals#!\n· Xiao Yan is dead\n· Hold the title of Yu Province (King of Henan)\n· Shouchun Commandery is in your realm\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_yuzhou_dajiangjun$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_hj_dajiangjun:0 "From the Book of Liang, Biography of Hou Jing: he styled himself Grand General of the Universe and Commander of All Armies of the Six Directions."
 hd_asp.0100.desc.hj_dajiangjun:0 "The palace city has fallen and the Liang emperor is in your grip. You name yourself Grand General of the Universe, commanding all armies of the six directions; heaven, earth and the four quarters answer to you alone."
 hd_asp_name_hj_henan:0 "Master of Henan"
 hd_asp_card_hj_henan:0 "Aspiration: $hd_asp_name_hj_henan$"
 hd_asp_card_hj_henan_desc:0 "#high Main Goal#!\n· Yu, Yan and Luo provinces are all in your realm\n#high Bonus Goals#!\n· Gao Huan is dead\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_henan_wang$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.hj_henan:0 "The provinces of Henan are all under your command; the powers to the north and west and the Liang to the south must all weigh your strength."
 hd_asp_name_hj_handi:0 "Emperor of Han"
 hd_asp_card_hj_handi:0 "Aspiration: $hd_asp_name_hj_handi$"
 hd_asp_card_hj_handi_desc:0 "#high Main Goal#!\n· Be an emperor and hold Jiankang\n#high Bonus Goals#!\n· Xiao Yan is dead or your prisoner\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_houhan$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.hj_handi:0 "You take the throne in Jiankang and name your dynasty Han. Yet among those kneeling in the hall, few do so sincerely."
 hd_asp_name_xy_pusa:0 "The Bodhisattva Emperor"
 hd_asp_card_xy_pusa:0 "Aspiration: $hd_asp_name_xy_pusa$"
 hd_asp_card_xy_pusa_desc:0 "#high Main Goal#!\n· Reach piety level 4, and still be an independent ruler at age 80\n#high Bonus Goals#!\n· Reach 18 Learning\n· Luoyang is in your realm\n· Reach piety level 5\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_pusa$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_xy_pusa:0 "From the Book of Liang, Annals of Emperor Wu: the emperor repeatedly gave himself to the Tongtai Temple, and his ministers paid a hundred million cash to redeem him."
 hd_asp.0100.desc.xy_pusa:0 "You eat one meal a day and recite the sutras, and the bells of Tongtai Temple have rung through half your life. All four hundred and eighty temples of Jiangnan pray for you."
 hd_asp_name_xy_beifa:0 "Northern Expedition"
 hd_asp_card_xy_beifa:0 "Aspiration: $hd_asp_name_xy_beifa$"
 hd_asp_card_xy_beifa_desc:0 "#high Main Goal#!\n· Luoyang and Shouchun Commandery are both in your realm\n#high Bonus Goals#!\n· Pengcheng Commandery is in your realm\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_beifa_gong$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.xy_beifa:0 "The imperial army crosses the Huai, and the banners of the south fly over Luoyang. Hearing the news in Jiankang, you cannot be calm for a long time."
 hd_asp_name_xy_wenzhi:0 "Cultured Rule of Jiangnan"
 hd_asp_card_xy_wenzhi:0 "Aspiration: $hd_asp_name_xy_wenzhi$"
 hd_asp_card_xy_wenzhi_desc:0 "#high Main Goal#!\n· Reach 20 Learning with Yang and Jing provinces in your realm\n#high Bonus Goals#!\n· Reach age 80\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_tianjian$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.xy_wenzhi:0 "In the Tianjian years the culture of Jiangnan surpassed all before it. When later ages speak of the elegance of the Southern Dynasties, they think of you first."
 hd_asp_name_cqz_baipao:0 "The White Robes"
 hd_asp_card_cqz_baipao:0 "Aspiration: $hd_asp_name_cqz_baipao$"
 hd_asp_card_cqz_baipao_desc:0 "#high Main Goal#!\n· Luoyang is in your side's realm, and you still serve the Liang\n#high Bonus Goals#!\n· Hold a general's rank\n· Shouchun Commandery is in your side's realm\n· Erzhu Zhao is dead\n#high Rewards#!\nMain goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_baipao$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_src_cqz_baipao:0 "From the Book of Liang, Biography of Chen Qingzhi: a children's song in Luoyang warned that famous generals should not boast, for thousands of troops and horses fled the white robes."
 hd_asp.0100.desc.cqz_baipao:0 "Seven thousand men in white robes fought across a thousand li and swept all before them. Even the children of Luoyang sing that great generals should not boast, for ten thousand troops flee the white robes."
 hd_asp_name_cqz_gancheng:0 "Shield of Liang"
 hd_asp_card_cqz_gancheng:0 "Aspiration: $hd_asp_name_cqz_gancheng$"
 hd_asp_card_cqz_gancheng_desc:0 "#high Main Goal#!\n· Hold at least two commanderies and a general's rank, still serving the Liang at age 55\n#high Bonus Goals#!\n· Yiyang County is in your realm\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_gancheng$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.cqz_gancheng:0 "For many years you have guarded the border provinces, and the northerners dare not cross. Half of the Liang realm owes its safety to you."
 hd_asp_name_cqz_rujiang:0 "Scholar General"
 hd_asp_card_cqz_rujiang:0 "Aspiration: $hd_asp_name_cqz_rujiang$"
 hd_asp_card_cqz_rujiang_desc:0 "#high Main Goal#!\n· Reach 15 Martial and 15 Learning\n#high Bonus Goals#!\n· Hold a general's rank\n#high Rewards#!\nMain goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_rujiang$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp.0100.desc.cqz_rujiang:0 "You cannot ride well and your arrows cannot pierce armor, yet you win by strategy. People say a great general's strength lies not in bow and horse but in the landscape of the mind."
 hd_asp_empty:0 ""
 hd_asp_pst_yes:0 "#P currently met#!"
 hd_asp_pst_no:0 "#N not yet met#!"
 hd_asp_ps_sun_changjiang:0 "\n#weak From the Records of the Three Kingdoms, Biography of Lu Su: \"Hold everything to the end of the Great River, then proclaim yourself emperor and contend for the realm.\"#!"
 hd_asp_pm_sun_changjiang:0 "Be independent and an emperor, with both Yang and Jing provinces in your realm"
 hd_asp_pr_sun_changjiang:0 "Main goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_jiangdong$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_pd_sun_changjiang:0 "From Baqiu to Wu, every banner along the Great River is yours. What was once whispered beside a couch has come true: you sit facing south as an emperor, the equal of any power in the Central Plain."
 hd_asp_pmod_sun_changjiang:0 "$hd_asp_mod_jiangdong$"
 hd_asp_pb_sun_changjiang_1_pre:0 "\n#weak (Already true at start) Yang Province is in your realm (no reward)#!"
 hd_asp_pb_sun_changjiang_1_done:0 "\n#P (Done)#! Yang Province is in your realm"
 hd_asp_pb_sun_changjiang_1_todo:0 "\n· Yang Province is in your realm"
 hd_asp_pb_sun_changjiang_2_pre:0 "\n#weak (Already true at start) Jiangxia Commandery is in your realm (no reward)#!"
 hd_asp_pb_sun_changjiang_2_done:0 "\n#P (Done)#! Jiangxia Commandery is in your realm"
 hd_asp_pb_sun_changjiang_2_todo:0 "\n· Jiangxia Commandery is in your realm"
 hd_asp_ps_sun_qinwang:0 ""
 hd_asp_pm_sun_qinwang:0 "Dong Zhuo is dead, Luoyang is in your realm, and a Han emperor still reigns"
 hd_asp_pr_sun_qinwang:0 "Main goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_zhonglie$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_pd_sun_qinwang:0 "The traitor is dead and the old capital shines again. You cleared the rubble from the ancestral temples with your own hands, and the Han emperor still sits his throne. The realm remembers who cleared his path."
 hd_asp_pmod_sun_qinwang:0 "$hd_asp_mod_zhonglie$"
 hd_asp_pb_sun_qinwang_1_pre:0 "\n#weak (Already true at start) Hold one of the Three Excellencies or a general's rank at the Han court (no reward)#!"
 hd_asp_pb_sun_qinwang_1_done:0 "\n#P (Done)#! Hold one of the Three Excellencies or a general's rank at the Han court"
 hd_asp_pb_sun_qinwang_1_todo:0 "\n· Hold one of the Three Excellencies or a general's rank at the Han court"
 hd_asp_ps_sun_zhongyuan:0 ""
 hd_asp_pm_sun_zhongyuan:0 "Both Yu and Xu provinces are in your realm"
 hd_asp_pr_sun_zhongyuan:0 "Main goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_zhongyuan$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_pd_sun_zhongyuan:0 "The lands between the Huai and the Si, between the Ru and the Ying, are all under your command. Men of the southeast now water their horses in the Central Plain."
 hd_asp_pmod_sun_zhongyuan:0 "$hd_asp_mod_zhongyuan$"
 hd_asp_pb_sun_zhongyuan_1_pre:0 "\n#weak (Already true at start) Yuan Shu is dead or has become your vassal (no reward)#!"
 hd_asp_pb_sun_zhongyuan_1_done:0 "\n#P (Done)#! Yuan Shu is dead or has become your vassal"
 hd_asp_pb_sun_zhongyuan_1_todo:0 "\n· Yuan Shu is dead or has become your vassal"
 hd_asp_ps_lx_baituo:0 "\n#weak From the Book of the Later Han, Annals of Emperor Xian: the emperor smuggled out a secret edict sewn into a sash, and fled east from Chang'an back to Luoyang.#!"
 hd_asp_pm_lx_baituo:0 "You are still the Son of Heaven, and no overbearing minister holds you"
 hd_asp_pr_lx_baituo:0 "Main goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_qinzheng$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_pd_lx_baituo:0 "At last the palace gates open at your own command. Edicts issue from your own hand, and officials no longer send their petitions to a minister's mansion first. For the first time the throne feels like yours."
 hd_asp_pmod_lx_baituo:0 "$hd_asp_mod_qinzheng$"
 hd_asp_pb_lx_baituo_1_pre:0 "\n#weak (Already true at start) A minister who once held the emperor has died a violent death (no reward)#!"
 hd_asp_pb_lx_baituo_1_done:0 "\n#P (Done)#! A minister who once held the emperor has died a violent death"
 hd_asp_pb_lx_baituo_1_todo:0 "\n· A minister who once held the emperor has died a violent death"
 hd_asp_pb_lx_baituo_2_pre:0 "\n#weak (Already true at start) Your capital is Luoyang (no reward)#!"
 hd_asp_pb_lx_baituo_2_done:0 "\n#P (Done)#! Your capital is Luoyang"
 hd_asp_pb_lx_baituo_2_todo:0 "\n· Your capital is Luoyang"
 hd_asp_ps_lx_zhongxing:0 ""
 hd_asp_pm_lx_zhongxing:0 "You are still the Son of Heaven, and at least six provinces of the Han are in your realm"
 hd_asp_pr_lx_zhongxing:0 "Main goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_zhongxing$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_pd_lx_zhongxing:0 "The lords of the four quarters once again follow the Han calendar, and provincial clerks travel the dusty roads to submit their accounts. People call it the second restoration since Emperor Guangwu."
 hd_asp_pmod_lx_zhongxing:0 "$hd_asp_mod_zhongxing$"
 hd_asp_pb_lx_zhongxing_1_pre:0 "\n#weak (Already true at start) No one else in the realm claims the title of emperor (no reward)#!"
 hd_asp_pb_lx_zhongxing_1_done:0 "\n#P (Done)#! No one else in the realm claims the title of emperor"
 hd_asp_pb_lx_zhongxing_1_todo:0 "\n· No one else in the realm claims the title of emperor"
 hd_asp_ps_lx_zongmiao:0 ""
 hd_asp_pm_lx_zongmiao:0 "Reach the age of fifty while the Liu clan still holds land"
 hd_asp_pr_lx_zongmiao:0 "Main goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_anming$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_pd_lx_zongmiao:0 "After half a lifetime of storms, you have survived, and the incense of the Liu clan still burns. Some call you timid, but you know how hard it is to keep the ancestral temple standing in such an age."
 hd_asp_pmod_lx_zongmiao:0 "$hd_asp_mod_anming$"
 hd_asp_pb_lx_zongmiao_1_pre:0 "\n#weak (Already true at start) Reach a Learning of 15 (no reward)#!"
 hd_asp_pb_lx_zongmiao_1_done:0 "\n#P (Done)#! Reach a Learning of 15"
 hd_asp_pb_lx_zongmiao_1_todo:0 "\n· Reach a Learning of 15"
 hd_asp_ps_lb_xingfu:0 "\n#weak From the Records of the Three Kingdoms, Biography of Zhuge Liang, the Longzhong Plan: \"Hold both Jing and Yi... then hegemony can be achieved and the House of Han revived.\"#!"
 hd_asp_pm_lb_xingfu:0 "Be independent and hold both capitals, Luoyang and Chang'an"
 hd_asp_pr_lb_xingfu:0 "Main goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_rende$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_pd_lb_xingfu:0 "Both capitals are restored, and the Han banners fly over the old palaces once more. Who will rule the realm from here, you have decided with your own hands."
 hd_asp_pmod_lb_xingfu:0 "$hd_asp_mod_rende$"
 hd_asp_pb_lb_xingfu_1_pre:0 "\n#weak (Already true at start) Both Jing and Yi provinces are in your realm (no reward)#!"
 hd_asp_pb_lb_xingfu_1_done:0 "\n#P (Done)#! Both Jing and Yi provinces are in your realm"
 hd_asp_pb_lb_xingfu_1_todo:0 "\n· Both Jing and Yi provinces are in your realm"
 hd_asp_pb_lb_xingfu_2_pre:0 "\n#weak (Already true at start) Be an emperor (no reward)#!"
 hd_asp_pb_lb_xingfu_2_done:0 "\n#P (Done)#! Be an emperor"
 hd_asp_pb_lb_xingfu_2_todo:0 "\n· Be an emperor"
 hd_asp_pb_lb_xingfu_3_pre:0 "\n#weak (Already true at start) Hanzhong Commandery is in your realm (no reward)#!"
 hd_asp_pb_lb_xingfu_3_done:0 "\n#P (Done)#! Hanzhong Commandery is in your realm"
 hd_asp_pb_lb_xingfu_3_todo:0 "\n· Hanzhong Commandery is in your realm"
 hd_asp_ps_lb_xuzhou:0 ""
 hd_asp_pm_lb_xuzhou:0 "Be independent with Xu Province in your realm"
 hd_asp_pr_lb_xuzhou:0 "Main goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_xuzhoumu$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_pd_lb_xuzhou:0 "You did not fail the trust Tao Qian once placed in you. Between the Huai and the Si your soldiers are strong and your granaries full, and heroes everywhere say that Xu Province has found its master."
 hd_asp_pmod_lb_xuzhou:0 "$hd_asp_mod_xuzhoumu$"
 hd_asp_pb_lb_xuzhou_1_pre:0 "\n#weak (Already true at start) Yuan Shu is dead or has lost all his land (no reward)#!"
 hd_asp_pb_lb_xuzhou_1_done:0 "\n#P (Done)#! Yuan Shu is dead or has lost all his land"
 hd_asp_pb_lb_xuzhou_1_todo:0 "\n· Yuan Shu is dead or has lost all his land"
 hd_asp_ps_lb_zhongchen:0 ""
 hd_asp_pm_lb_zhongchen:0 "Hold one of the Three Excellencies (including Grand General) while no minister holds the emperor"
 hd_asp_pr_lb_zhongchen:0 "Main goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_hanshi_zhushi$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_pd_lb_zhongchen:0 "You stand at the head of the court, and the emperor takes your hand and calls you a pillar of the Han. Of all the names once written on the secret edict, only yours still stands here."
 hd_asp_pmod_lb_zhongchen:0 "$hd_asp_mod_hanshi_zhushi$"
 hd_asp_pb_lb_zhongchen_1_pre:0 "\n#weak (Already true at start) A minister who once held the emperor is dead (no reward)#!"
 hd_asp_pb_lb_zhongchen_1_done:0 "\n#P (Done)#! A minister who once held the emperor is dead"
 hd_asp_pb_lb_zhongchen_1_todo:0 "\n· A minister who once held the emperor is dead"
 hd_asp_ps_cc_tongyi:0 "\n#weak Cao Cao, Short Song Style: \"The Duke of Zhou spat out his food to receive guests, and all under heaven turned to him.\" In 208 he marched south on Jing Province.#!"
 hd_asp_pm_cc_tongyi:0 "At least eleven of the thirteen Han provinces are in your realm"
 hd_asp_pr_cc_tongyi:0 "Main goal: $hd_asp_reward_large$, and the modifier $hd_asp_mod_tianxia_guixin$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_pd_cc_tongyi:0 "Within the four seas, wherever your banners point, all submit. Looking out from the heights, you remember how as a youth you only hoped to become a marquis and General Who Conquers the West, and you laugh."
 hd_asp_pmod_cc_tongyi:0 "$hd_asp_mod_tianxia_guixin$"
 hd_asp_pb_cc_tongyi_1_pre:0 "\n#weak (Already true at start) You are the minister who holds the emperor (no reward)#!"
 hd_asp_pb_cc_tongyi_1_done:0 "\n#P (Done)#! You are the minister who holds the emperor"
 hd_asp_pb_cc_tongyi_1_todo:0 "\n· You are the minister who holds the emperor"
 hd_asp_pb_cc_tongyi_2_pre:0 "\n#weak (Already true at start) At least five of the eight northern provinces (Ji, Qing, You, Bing, Yan, Yu, Xu, Sili) are in your realm (no reward)#!"
 hd_asp_pb_cc_tongyi_2_done:0 "\n#P (Done)#! At least five of the eight northern provinces (Ji, Qing, You, Bing, Yan, Yu, Xu, Sili) are in your realm"
 hd_asp_pb_cc_tongyi_2_todo:0 "\n· At least five of the eight northern provinces (Ji, Qing, You, Bing, Yan, Yu, Xu, Sili) are in your realm"
 hd_asp_pb_cc_tongyi_3_pre:0 "\n#weak (Already true at start) Receive the Nine Bestowments, or be enfeoffed as a duke or king (no reward)#!"
 hd_asp_pb_cc_tongyi_3_done:0 "\n#P (Done)#! Receive the Nine Bestowments, or be enfeoffed as a duke or king"
 hd_asp_pb_cc_tongyi_3_todo:0 "\n· Receive the Nine Bestowments, or be enfeoffed as a duke or king"
