 hd_asp_mod_jiangdong:0 "Lord of Jiangdong"
 hd_asp_mod_jiangdong_desc:0 "This character holds the southeast, and their fleets range freely along the river."
 hd_asp_mod_zhonglie:0 "Loyal and Valiant"
 hd_asp_mod_zhonglie_desc:0 "This character fought for the throne against traitors, and the Liu clan honors their name."
 hd_asp_mod_zhongyuan:0 "Deer of the Central Plain"
 hd_asp_mod_zhongyuan_desc:0 "This character chases the deer of the Central Plain, and strong men everywhere rush to join them."
 hd_asp_mod_qinzheng:0 "Personal Rule"
 hd_asp_mod_qinzheng_desc:0 "The emperor has thrown off the overbearing minister and governs in person; the officials once again have someone to rely on."
 hd_asp_mod_zhongxing:0 "Restorer of the Han"
 hd_asp_mod_zhongxing_desc:0 "The Han has been restored, and the lords again follow the imperial calendar."
 hd_asp_mod_anming:0 "At Peace with Fate"
 hd_asp_mod_anming_desc:0 "This character has weathered many storms and accepts their fate, living out their years in peace."
 hd_asp_mod_rende:0 "Benevolent Lord"
 hd_asp_mod_rende_desc:0 "This character is generous and kind, and men of talent flock to them from every direction."
 hd_asp_mod_xuzhoumu:0 "Governor of Xu"
 hd_asp_mod_xuzhoumu_desc:0 "This character governs Xu Province, rich with the wealth of the Huai and Si, with strong soldiers and full granaries."
 hd_asp_mod_hanshi_zhushi:0 "Pillar of the Han"
 hd_asp_mod_hanshi_zhushi_desc:0 "This character is a pillar of the Han, and the Liu clan relies on them."
 hd_asp_mod_tianxia_guixin:0 "All Hearts Turn to Them"
 hd_asp_mod_tianxia_guixin_desc:0 "This character has united the realm, and all within the four seas submit."
 hd_asp_mod_han_zhongchen:0 "Loyal Minister of the Han"
 hd_asp_mod_han_zhongchen_desc:0 "This character served the Han all their life, asking only that their tomb read: late General Who Conquers the West of the Han."
 hd_asp_mod_weiwu:0 "Martial Founder"
 hd_asp_mod_weiwu_desc:0 "This character supplanted the Han and commands armies like a god."
 hd_asp_mod_hebei:0 "Hero of Hebei"
 hd_asp_mod_hebei_desc:0 "This character holds the lands north of the Yellow River, with armored soldiers counted by the hundred thousand."
 hd_asp_mod_dingce:0 "Kingmaker"
 hd_asp_mod_dingce_desc:0 "This character placed a new emperor on the throne and holds the merit of deciding the succession."
 hd_asp_mod_sishi_sangong:0 "Four Generations of Excellencies"
 hd_asp_mod_sishi_sangong_desc:0 "The Yuan clan has produced Excellencies for four generations, and their former students and officials are everywhere."
 hd_asp_mod_zhongjia:0 "Mandate of Zhong"
 hd_asp_mod_zhongjia_desc:0 "This character claims the prophecy of the one who replaces the Han, and has named a dynasty Zhong; many hearts do not follow."
 hd_asp_mod_huainan:0 "Hero of Huainan"
 hd_asp_mod_huainan_desc:0 "This character holds the rich land of Huainan, and their treasuries are full."
 hd_asp_mod_xiliang:0 "Iron Cavalry of Xiliang"
 hd_asp_mod_xiliang_desc:0 "This character commands the iron cavalry of Xiliang, feared and respected by the Qiang and Di."
 hd_asp_mod_fubo:0 "Heir of the Wave-Calmer"
 hd_asp_mod_fubo_desc:0 "This character upholds the name of the Wave-Calming General, and the western frontier trembles before them."
 hd_asp_mod_rushu:0 "Conqueror of Shu"
 hd_asp_mod_rushu_desc:0 "This character has marched into Ba and Shu and holds the wealth of the Land of Abundance."
 hd_asp_mod_chenwang_qiangnu:0 "Crossbows of Chen"
 hd_asp_mod_chenwang_qiangnu_desc:0 "The crossbowmen of Chen make any wall they defend unbreakable."
 hd_asp_mod_guangwu:0 "Spirit of Guangwu"
 hd_asp_mod_guangwu_desc:0 "This character rose from the imperial clan to take up the succession, in the spirit of Emperor Guangwu's restoration."
 hd_asp_mod_wolong:0 "Sleeping Dragon"
 hd_asp_mod_wolong_desc:0 "This character has the talent to order heaven and earth, and governs with perfect order."
 hd_asp_mod_sanfen:0 "Plan of Three Kingdoms"
 hd_asp_mod_sanfen_desc:0 "This character long ago laid the plan for a realm divided in three, and moves among the powers with ease."
 hd_asp_mod_jugong:0 "Devoted unto Death"
 hd_asp_mod_jugong_desc:0 "This character sees to everything in person, rising early and retiring late, and the treasury is full for it."
 hd_asp_mod_wusheng:0 "Martial Saint"
 hd_asp_mod_wusheng_desc:0 "This character is the bravest in all the armies, and their might shakes all China."
 hd_asp_mod_yijue:0 "Peerless in Righteousness"
 hd_asp_mod_yijue_desc:0 "This character's loyalty reaches the clouds, and the realm honors them for it."
 hd_asp_mod_zhenjing:0 "Guardian of Jing"
 hd_asp_mod_zhenjing_desc:0 "This character holds Jing Province with strong soldiers and stout walls."
 hd_asp_mod_liangzhou_shangshi:0 "Finest Man of Liang"
 hd_asp_mod_liangzhou_shangshi_desc:0 "This character is gifted in both letters and arms; Chancellor Zhuge called them the finest man of Liang Province."
 hd_asp_mod_jiange:0 "Guardian of Jiange"
 hd_asp_mod_jiange_desc:0 "At the pass of Jiange, one man can hold off ten thousand."
 hd_asp_mod_guzhong:0 "Lonely Loyalty"
 hd_asp_mod_guzhong_desc:0 "Even in the darkest hour this character has not forgotten their old state, and plots in secret to restore it."
 hd_asp_mod_yingshi_langgu:0 "Hawk's Gaze, Wolf's Glance"
 hd_asp_mod_yingshi_langgu_desc:0 "This character is deep and full of schemes, with a gaze no one dares meet."
 hd_asp_mod_sheji:0 "Minister of the State"
 hd_asp_mod_sheji_desc:0 "This character has served several reigns and is a pillar of the state."
 hd_asp_mod_hunyi_gong:0 "Merit of Unification"
 hd_asp_mod_hunyi_gong_desc:0 "This character has pacified the four quarters, and their name is known throughout the realm."
 hd_asp_mod_zifang:0 "Talent of Zifang"
 hd_asp_mod_zifang_desc:0 "People compare this character to Zhang Liang, planning in the tent and never missing a move."
 hd_asp_mod_mieshu:0 "Conqueror of Shu"
 hd_asp_mod_mieshu_desc:0 "This character won first merit in the conquest of Shu, and their fame spreads far."
 hd_asp_mod_wangzuo:0 "Royal Advisor"
 hd_asp_mod_wangzuo_desc:0 "This character has the talent to advise kings and excels at government."
 hd_asp_mod_guangwu_di:0 "Guangwu"
 hd_asp_mod_guangwu_di_desc:0 "This character rose from Nanyang and restored the Han, and the realm's hearts turned to them."
 hd_asp_mod_gengshi:0 "Hero of Gengshi"
 hd_asp_mod_gengshi_desc:0 "This character is a founding hero of the Gengshi court, respected by all."
 hd_asp_mod_kangli:0 "Devoted Spouses"
 hd_asp_mod_kangli_desc:0 "This character and their spouse are devoted to each other, and their home is happy."
 hd_asp_mod_shaohan:0 "Successor to Han"
 hd_asp_mod_shaohan_desc:0 "This character claims kinship with the Han and carries its name, and the tribes rally to them."
 hd_asp_mod_chanyu:0 "Legacy of the Chanyu"
 hd_asp_mod_chanyu_desc:0 "This character has revived the old glory of the Xiongnu, and the horsemen of the five divisions roam Bing Province."
 hd_asp_mod_jin_fanping:0 "Bulwark of Jin"
 hd_asp_mod_jin_fanping_desc:0 "This character shields the Jin, and the court relies on them."
 hd_asp_mod_jiji:0 "Striking the Oar"
 hd_asp_mod_jiji_desc:0 "This character swore midstream to cleanse the Central Plain, and their soldiers are stirred."
 hd_asp_mod_fuluo:0 "Retaker of Luoyang"
 hd_asp_mod_fuluo_desc:0 "This character retook the old capital of Luoyang, a service to the state."
 hd_asp_mod_fanyang_zu:0 "The Zu of Fanyang"
 hd_asp_mod_fanyang_zu_desc:0 "The Zu family of Fanyang shines brighter because of this character."
 hd_asp_mod_zhenge:0 "Spear for a Pillow"
 hd_asp_mod_zhenge_desc:0 "This character sleeps on their spear awaiting dawn, and their lonely city never falls."
 hd_asp_mod_liangjing:0 "Restorer of the Capitals"
 hd_asp_mod_liangjing_desc:0 "This character retook both capitals, and the realm knows their name."
 hd_asp_mod_fufeng:0 "Song of Fufeng"
 hd_asp_mod_fufeng_desc:0 "This character's poetry endures, and their good faith is known to Hu and Han alike."
 hd_asp_mod_xuanwu:0 "Xuanwu"
 hd_asp_mod_xuanwu_desc:0 "This character took Ba and Shu and marched north, and their name is feared."
 hd_asp_mod_jingchu:0 "Hero of Jing and Chu"
 hd_asp_mod_jingchu_desc:0 "This character holds the upriver lands, rich in soldiers and grain."
 hd_asp_mod_hunyi_yunei:0 "Unifier of the Realm"
 hd_asp_mod_hunyi_yunei_desc:0 "This character helped the Jin unite the realm, and all within the four seas submit."
 hd_asp_mod_fengliu:0 "Leader of the Elegant"
 hd_asp_mod_fengliu_desc:0 "This character leads the elegant conversationalists, and famous men compete for their friendship."
 hd_asp_mod_qingtan:0 "Master of Pure Talk"
 hd_asp_mod_qingtan_desc:0 "This character excels at the mysterious learning; when they speak, all present are convinced."
 hd_asp_mod_yangzhou_zhong:0 "Weight of Yang"
 hd_asp_mod_yangzhou_zhong_desc:0 "This character holds Yang Province, and its taxes flow in abundance."
 hd_asp_mod_qin_tianwang:0 "Heavenly King of Qin"
 hd_asp_mod_qin_tianwang_desc:0 "This character rules the four quarters as Heavenly King, and Hu and Han are of one heart."
 hd_asp_mod_guanzhong_zhi:0 "Good Rule in Guanzhong"
 hd_asp_mod_guanzhong_zhi_desc:0 "Guanzhong is well ruled; doors stay open at night and no one picks up what is dropped on the road."
 hd_asp_mod_beitu:0 "Master of the North"
 hd_asp_mod_beitu_desc:0 "This character has united the north, with a million armored men."
 hd_asp_mod_qitun:0 "Swallowing Ten Thousand Li"
 hd_asp_mod_qitun_desc:0 "With golden spears and iron horses, this character swallows ten thousand li like a tiger."
 hd_asp_mod_zaizao:0 "Restorer of Jin"
 hd_asp_mod_zaizao_desc:0 "This character destroyed the usurper and remade the Jin."
 hd_asp_mod_beifu:0 "Elite of the Beifu"
 hd_asp_mod_beifu_desc:0 "The fierce Beifu soldiers answer to this character alone."
 hd_asp_mod_yuzhou_dajiangjun:0 "Grand General of the Universe"
 hd_asp_mod_yuzhou_dajiangjun_desc:0 "This character styles themself Grand General of the Universe, commanding the armies of the six directions; the realm trembles."
 hd_asp_mod_henan_wang:0 "King of Henan"
 hd_asp_mod_henan_wang_desc:0 "This character holds the provinces of Henan with a mighty army."
 hd_asp_mod_houhan:0 "Mandate of Hou's Han"
 hd_asp_mod_houhan_desc:0 "This character has made themself emperor of Han; the realm looks askance, and hearts do not follow."
 hd_asp_mod_pusa:0 "Bodhisattva Emperor"
 hd_asp_mod_pusa_desc:0 "This character is devoted to the Buddha's teaching and revered as the Bodhisattva Emperor."
 hd_asp_mod_beifa_gong:0 "Northern Expedition"
 hd_asp_mod_beifa_gong_desc:0 "This character's armies crossed north and retook the old capital."
 hd_asp_mod_tianjian:0 "Rule of Tianjian"
 hd_asp_mod_tianjian_desc:0 "In the Tianjian years the culture of Jiangnan flourished."
 hd_asp_mod_baipao:0 "White Robes"
 hd_asp_mod_baipao_desc:0 "Ten thousand troops flee the white robes; this character's army moves swiftly."
 hd_asp_mod_gancheng:0 "Shield of Liang"
 hd_asp_mod_gancheng_desc:0 "This character guards the border provinces as a shield for the Liang."
 hd_asp_mod_rujiang:0 "Scholar General"
 hd_asp_mod_rujiang_desc:0 "This character wins not by bow and horse but by strategy."
 hd_asp_mod_guiwei:0 "Merit of Submission"
 hd_asp_mod_guiwei_desc:0 "This character handed Shu back to the court and was rewarded for it."
 hd_asp_mod_shuhan_chengxiang:0 "Chancellor of Shu-Han"
 hd_asp_mod_shuhan_chengxiang_desc:0 "This character serves the Liu as chancellor of the restored Han."
 hd_asp_mod_zuozhen_guanzhong:0 "Holding Guanzhong"
 hd_asp_mod_zuozhen_guanzhong_desc:0 "This character holds Chang'an and governs Guanzhong, set on marching further north."
 hd_asp_opinion_zhonglie:0 "Loyal and Valiant"
 hd_asp_opinion_han_zhongchen:0 "Loyal Minister of the Han"
 hd_asp_opinion_hanshi_zhushi:0 "Pillar of the Han"
 hd_asp_opinion_xiliang:0 "Iron Cavalry of Xiliang"
 hd_asp.0001.t:0 "Ambitions of Jiangdong"
 hd_asp.0001.desc:0 "Late at night, with the lamp burning low, you sit alone in your tent. Where should your soldiers, the sons of Jiangdong, this army of a hundred battles, go next? Some urge you downriver to hold Wu and Kuaiji; some urge you north to rescue the throne; others say the Central Plain is where heroes prove themselves. Slowly, you find your answer."
 hd_asp.0001.a:0 "Hold everything to the end of the Great River."
 hd_asp.0001.b:0 "Fight the traitors and save the Han."
 hd_asp.0001.c:0 "March north and contend with the warlords."
 hd_asp.0002.t:0 "The Emperor's Resolve"
 hd_asp.0002.desc:0 "The palace gates are locked and your attendants hold their breath. You are called the Son of Heaven, yet your edicts may not even pass beyond these walls. Reading at night of Emperor Gaozu and Emperor Guangwu, you cannot help asking what kind of emperor you mean to be."
 hd_asp.0002.a:0 "Hide the edict in a sash. The traitor must go."
 hd_asp.0002.b:0 "Remake the Han and restore its order."
 hd_asp.0002.c:0 "Let the ancestral temple endure, and I will be content."
 hd_asp.0003.t:0 "To Uphold the Han"
 hd_asp.0003.desc:0 "You often slap your thigh and sigh. A scion of the Han, you grow older with nothing achieved. The realm is in turmoil, the very time for a man to set his course. Will you revive the Han and return to the old capitals, carve out a domain and become a hegemon, or serve at court as the emperor's loyal minister?"
 hd_asp.0003.a:0 "Revive the Han and return to the old capitals."
 hd_asp.0003.b:0 "Take a province and build a hegemony."
 hd_asp.0003.c:0 "Serve at court as a loyal minister."
 hd_asp.0004.t:0 "Original Intent"
 hd_asp.0004.desc:0 "As a youth you only wanted to fight the empire's enemies, become a marquis and General Who Conquers the West, and have your tomb read: Tomb of Marquis Cao, late General Who Conquers the West of the Han. Now the realm is in chaos, and the road ahead is far wider, and far more dangerous, than you ever imagined."
 hd_asp.0004.a:0 "Serve the emperor, command the disloyal, unite the realm."
 hd_asp.0004.b:0 "Keep my original intent and serve as the Han's general."
 hd_asp.0004.c:0 "The Han is spent. Why not replace it?"
 hd_asp.0005.t:0 "Ambitions of Hebei"
 hd_asp.0005.desc:0 "For four generations the Yuan clan has produced the Three Excellencies, and their former students and officials are everywhere. The lords have chosen you as their leader. But once Dong Zhuo is dealt with, how is the realm to be set in order? You must plan ahead."
 hd_asp.0005.a:0 "Hold the River and face south to contend for the realm."
 hd_asp.0005.b:0 "Raise a worthy prince of the clan to steady the state."
 hd_asp.0005.c:0 "The Han is ending. The Yuan shall rise."
 hd_asp.0006.t:0 "The Prophecy of Dangtu"
 hd_asp.0006.desc:0 "A prophecy says: \"The one who replaces the Han is tall on the road.\" Your name means road and your courtesy name means public road, a perfect match, and the Yuan have been Excellencies for four generations. Whenever you think of it, you cannot sleep."
 hd_asp.0006.a:0 "Answer Heaven and take the throne."
 hd_asp.0006.b:0 "Hold Huainan first, then see."
 hd_asp.0006.c:0 "First humble Benchu, then speak of the realm."
 hd_asp.0007.t:0 "Ambitions West of the Passes"
 hd_asp.0007.desc:0 "The sands of Liang Province have hardened the sons of the Ma clan, and the Qiang and Di respect the Ma name. What legacy should the descendants of Ma Yuan, the Wave-Calming General, leave in this age of chaos?"
 hd_asp.0007.a:0 "Rule the west of the passes as an equal of the Central Plain."
 hd_asp.0007.b:0 "Follow our ancestor and guard the western frontier for the Han."
 hd_asp.0007.c:0 "March south to Hanzhong and take Ba and Shu."
 hd_asp.0008.t:0 "The Prince of Chen's Resolve"
 hd_asp.0008.desc:0 "You have governed Chen for many years, and its crossbowmen can hold off any enemy. Now the realm is in chaos and many commanderies have been abandoned, yet the people of Chen have entrusted their lives to you."
 hd_asp.0008.a:0 "Guard the land and keep the people safe."
 hd_asp.0008.b:0 "The imperial clan has heirs; the succession can pass to me."
 hd_asp.0008.c:0 "The commanderies of Yu Province belong to the Prince of Chen."
 hd_asp.0301.t:0 "The Sleeping Dragon's Resolve"
 hd_asp.0301.desc:0 "When the First Lord visited your hut three times, you laid out the shape of the realm for him. Now Jing and Yi are within reach, yet the Cao in the north remain strong. Every step from here decides whether the Han lives or dies."
 hd_asp.0301.a:0 "Pacify the Central Plain and return to the old capitals."
 hd_asp.0301.b:0 "Hold Jing and Yi and divide the realm in three."
 hd_asp.0301.c:0 "Serve with all my strength until death."
 hd_asp.0302.t:0 "The Saint of War's Resolve"
 hd_asp.0302.desc:0 "You have held Jing Province for years. The Cao armies at Xiangyang and Fan are close to the north, and Sun Quan in the east cannot be trusted. Your elder brother is far away in Hanzhong; the safety of Jing rests on you alone."
 hd_asp.0302.a:0 "Strike north at Xiangyang and Fan and shake all China."
 hd_asp.0302.b:0 "Serve my brother all my life and never betray him."
 hd_asp.0302.c:0 "Hold Jing Province and yield not an inch."
 hd_asp.0303.t:0 "Boyue's Resolve"
 hd_asp.0303.desc:0 "Years have passed since the Chancellor's star fell at Wuzhang Plains, and the northern campaigns now rest on your shoulders. Some at court want peace and rest for the people; others secretly hope you fail. How will you go on?"
 hd_asp.0303.a:0 "Campaign north again and again to retake Longyou."
 hd_asp.0303.b:0 "Hold Ba and Shu and keep the Han line alive."
 hd_asp.0303.c:0 "Even if all seems lost, plot to restore the Han."
 hd_asp.0304.t:0 "The Sima Resolve"
 hd_asp.0304.desc:0 "For generations the Cao have relied on the Sima, and you are already a weighty figure at court. But should the power of Wei remain with the Cao, or rest in your own hands?"
 hd_asp.0304.a:0 "The foundation of Jin shall be laid by me."
 hd_asp.0304.b:0 "Be a pillar of Wei and support the Cao."
 hd_asp.0304.c:0 "Conquer Wu and Shu and unite the realm."
 hd_asp.0305.t:0 "Shiji's Resolve"
 hd_asp.0305.desc:0 "The great army has entered Hanzhong, and the gates of Shu-Han lie ahead. You believe your talent has no equal. When the deed is done, will you be a loyal servant of Wei, or make other plans?"
 hd_asp.0305.a:0 "Take Shu for myself and serve no one."
 hd_asp.0305.b:0 "Conquer Shu and win a dukedom."
 hd_asp.0305.c:0 "Rise to the Three Excellencies on my talent."
 hd_asp.0306.t:0 "Wenshu's Resolve"
 hd_asp.0306.desc:0 "Wang Mang's dynasty has gone mad, and heroes rise everywhere. Your elder brother Bosheng has raised troops at Chongling, and you have followed him to war on an ox. What, you wonder, will you make of this life?"
 hd_asp.0306.a:0 "Restore the Han and take the throne."
 hd_asp.0306.b:0 "Serve the Gengshi Emperor as a great minister."
 hd_asp.0306.c:0 "A career like the Bearer of the Golden Mace, a wife like Yin Lihua."
 hd_asp.0307.t:0 "Yuanhai's Resolve"
 hd_asp.0307.desc:0 "You have proclaimed yourself King of Han at Zuoguo, and the five Xiongnu divisions have come to pay homage. The princes of Jin are killing each other and the Central Plain lies empty. This is a chance that comes once in a thousand years. How will you use it?"
 hd_asp.0307.a:0 "Continue the Han and take the Central Plain."
 hd_asp.0307.b:0 "Revive the old glory of Chanyu Huhanye."
 hd_asp.0307.c:0 "Remain a bulwark of the Jin."
 hd_asp.0308.t:0 "Shizhi's Resolve"
 hd_asp.0308.desc:0 "Hu horsemen pour south, the Central Plain has fallen, and half the Jin realm is in peril. The night you and Liu Kun rose to dance with swords at the cock's crow feels like yesterday. How will you serve your country?"
 hd_asp.0308.a:0 "Strike the oar midstream and retake Yu Province."
 hd_asp.0308.b:0 "March north to the end and retake Luoyang."
 hd_asp.0308.c:0 "First strengthen the Zu of Fanyang, then strike."
 hd_asp.0309.t:0 "Yueshi's Resolve"
 hd_asp.0309.desc:0 "The realm is in chaos and the Hu rise on every side. Your heart is full of the wish to save the Jin, and you only fear Zu Ti will crack the whip before you. The road ahead is perilous. How will you walk it?"
 hd_asp.0309.a:0 "Hold Bing Province alone, spear for a pillow."
 hd_asp.0309.b:0 "Retake both capitals and remake the Jin."
 hd_asp.0309.c:0 "Win over Hu and Han with poetry and good faith, and keep one corner safe."
 hd_asp.0310.t:0 "Yuanzi's Resolve"
 hd_asp.0310.desc:0 "You hold Jing Province with a great army, and the court both relies on you and fears you. Ba and Shu in the west and the old capitals in the north wait for someone to retake them. And deep in your heart is a thought you dare not speak."
 hd_asp.0310.a:0 "Campaign north and win unrivaled glory."
 hd_asp.0310.b:0 "Hold Jing and Chu and dominate the upriver lands."
 hd_asp.0310.c:0 "Help the Jin unite the realm."
 hd_asp.0311.t:0 "Shenyuan's Resolve"
 hd_asp.0311.desc:0 "The court has entrusted you with Yang Province to hold Huan Wen of Jing in check. You are famed for pure conversation, yet now you must lead armies north. Half the court waits for you to fail; the other half truly hopes in you."
 hd_asp.0311.a:0 "March on Xu and Luo and prove my learning."
 hd_asp.0311.b:0 "Lead the pure conversation of the south."
 hd_asp.0311.c:0 "Hold Yang Province and stand against Huan Wen."
 hd_asp.0312.t:0 "The Heavenly King's Resolve"
 hd_asp.0312.desc:0 "Wang Meng has set the government in order and Guanzhong is well ruled; the armies of Great Qin now point east at Yan. You often tell your ministers that the realm is one family and Hu and Han should not be divided. How far will you carry this ambition?"
 hd_asp.0312.a:0 "Unite the six directions and the four seas."
 hd_asp.0312.b:0 "Govern Guanzhong first and let the people rest."
 hd_asp.0312.c:0 "Unite the north, then turn to Jiangnan."
 hd_asp.0313.t:0 "Jinu's Resolve"
 hd_asp.0313.desc:0 "You rose at Jingkou, Huan Xuan has fled west, and Jiankang is in your hands. The soldiers of the Beifu are watching you, and so is the realm. Can the Jin be remade, or is it time for a new mandate?"
 hd_asp.0313.a:0 "March north and swallow ten thousand li."
 hd_asp.0313.b:0 "Restore the Jin and bring the emperor home."
 hd_asp.0313.c:0 "Hold the Beifu army and dominate Jingkou."
 hd_asp.0314.t:0 "Wanjing's Resolve"
 hd_asp.0314.desc:0 "Your right leg is short and you cannot ride or shoot well, yet by cunning alone you have come this far through the chaos. Gao Huan in the north, Heba Yue in Guanzhong, the Liang in Jiangnan: none of them is a place to stay long. What you want is a realm that dares not look down on you."
 hd_asp.0314.a:0 "Become Grand General of the Universe and command heaven and earth."
 hd_asp.0314.b:0 "Seize Henan and make it my own."
 hd_asp.0314.c:0 "Make myself emperor and name my dynasty Han."
 hd_asp.0315.t:0 "Shuda's Resolve"
 hd_asp.0315.desc:0 "You have ruled the Liang for nearly thirty years since replacing the Qi, and Jiangnan has long enjoyed peace and flourishing culture. As you age you lose yourself more and more in the Buddha's teaching, yet the old capital in the north is still not yours."
 hd_asp.0315.a:0 "Take refuge in the Buddha and be the Bodhisattva Emperor."
 hd_asp.0315.b:0 "March north and retake the old capital."
 hd_asp.0315.c:0 "Rule Jiangnan by culture and be remembered forever."
 hd_asp.0316.t:0 "Ziyun's Resolve"
 hd_asp.0316.desc:0 "You have served Xiao Yan for many years and were never known for bow or horse, yet in the northern expedition seven thousand white-robed men swept across a thousand li under you. Now you are back in the Liang, and the whole court talks of what you will do next."
 hd_asp.0316.a:0 "Lead the white robes again and take Luoyang."
 hd_asp.0316.b:0 "Guard the border provinces as the shield of Liang."
 hd_asp.0316.c:0 "Be a general of strategy, a scholar general."
 hd_asp.0061.t:0 "A Legacy Inherited"
 hd_asp.0061.desc:0 "The unfinished ambition of those who came before now rests on your shoulders. The old retainers watch you, waiting for your word."
 hd_asp.0061.a:0 "How could I not carry it on?"
 hd_asp.0062.t:0 "A Legacy Lost"
 hd_asp.0062.desc:0 "The ambition of those who came before did not pass to you. Times have changed, and you must find your own road."
 hd_asp.0062.a:0 "Such is fate."
 hd_asp.0100.t:0 "Ambition Fulfilled"
 hd_asp.0100.desc.fallback:0 "A long-held aspiration is fulfilled at last."
 hd_asp.0100.a:0 "This is done; the road goes on."
 hd_asp.0101.t:0 "The Realm Takes Notice"
 hd_asp.0101.desc:0 "Word arrives: [hd_asp_achiever.GetTitledFirstName] has fulfilled their aspiration, \"[hd_asp_achiever.Custom('hd_asp_fulfilled_name')]\". Every lord in the realm takes notice."
 hd_asp.0101.a:0 "We shall see what follows."
 hd_asp.0200.t:0 "Return to the Old Capitals"
 hd_asp.0200.desc:0 "Both capitals are recovered, and the old palaces fly Han banners once more. Elders line the roads leaning on their staffs and officials kneel by the wayside, all waiting for your word: who will rule the realm from now on?"
 hd_asp.0200.a:0 "Heaven's mandate is mine. Let His Majesty abdicate."
 hd_asp.0200.e:0 "A traitor holds the throne. I will take my rightful place and punish him."
 hd_asp.0200.f:0 "The throne stands empty. I will take up the succession."
 hd_asp.0200.d:0 "The capitals are restored; the mandate is already mine."
 hd_asp.0200.b:0 "Return power to the emperor; I will be his chief minister."
 hd_asp.0200.c:0 "Govern in my own name while the emperor reigns in ceremony."
 hd_asp.0201.t:0 "The Question of Abdication"
 hd_asp.0201.desc:0 "You have received the Nine Bestowments and a royal title. In Luoyang, memorials urging you to take the throne pile up on your desk. The emperor on his throne looks at you with nothing but fear. It is time to decide."
 hd_asp.0201.a:0 "Accept the abdication and found the Jin."
 hd_asp.0201.b:0 "The realm is already mine. Let my sons claim the name."
 hd_asp.0202.t:0 "Upheaval in Shu"
 hd_asp.0202.desc:0 "Chengdu is in your hands, and the soldiers and grain of Shu answer to you. Jiang Wei comes to you in secret and urges you to rule Shu yourself; an edict from Luoyang is on its way demanding you return command of the army. What will you choose?"
 hd_asp.0202.a:0 "Proclaim myself emperor in Shu."
 hd_asp.0202.b:0 "Plot with Jiang Wei to restore the Han."
 hd_asp.0202.c:0 "Return Chengdu and claim my reward from Wei."
 hd_asp.0203.t:0 "Huan Wen's Decision"
 hd_asp.0203.desc:0 "Chengdu and Luoyang have both fallen to you, and your prestige is beyond compare. Some at court urge you to accept the Nine Bestowments and take the throne; others urge you to depose the emperor and show your power. You ask yourself: a fragrant name for later ages, or a stink for ten thousand years?"
 hd_asp.0203.a:0 "Accept the Nine Bestowments and take the throne."
 hd_asp.0203.b:0 "Depose the emperor and raise another of his clan."
 hd_asp.0203.c:0 "Step back and remain a loyal minister of Jin."
 hd_asp.0204.t:0 "Both Capitals Restored"
 hd_asp.0204.desc:0 "Luoyang and Chang'an have both been retaken, and the elders of Guanzhong line the roads to greet you. But word comes from Jiankang that the trusted man you left behind has died, and the court is restless. Will you return south to accept the abdication, or stay in Chang'an and march further north?"
 hd_asp.0204.a:0 "Return south and accept the mandate."
 hd_asp.0204.b:0 "Hold Chang'an and march further north."
 hd_asp_title_chenliu:0 "Chenliu"
 hd_asp_title_haixi:0 "Haixi"
 hd_asp_title_lingling:0 "Lingling"
 hd_asp_zh_shu_empire_name:0 "Shu"
 hd_asp_sm_keep_tt:0 "The mandate stays as it is for now; your dynasty gains renown"
 hd_asp_zh_fuhan_tt:0 "Hand Shu Commandery to a member of the Liu clan and make him emperor of Han; you swear fealty to him and run his government"
 hd_asp_zh_guiwei_tt:0 "Return Shu Commandery to the Wei emperor; you gain prestige and Merit of Submission"
 hd_asp_hw_feili_tt:0 "Depose the current emperor and raise another member of the Sima clan; you then govern as his regent, and the realm fears you"
 hd_asp_hw_zhongchen_tt:0 "You gain prestige and dynasty renown, and the Jin emperor's opinion of you rises greatly"
 hd_asp_ly_zuozhen_tt:0 "If you personally hold Chang'an, move your capital there; gain Holding Guanzhong for ten years"
 hd_story_zhuge_liang_life:0 "Annals of Zhuge Liang"
 hd_story_zhuge_liang_life_desc:0 "Courtesy name Kongming, of Yangdu in Langya"
 HD_STORY_ZHUGE_LIANG_LIFE_STATUS:0 "Zhuge Kongming once farmed the fields, fond of chanting the Liangfu Song, and compared himself to Guan Zhong and Yue Yi. After three visits he pledged himself to the First Lord, and since then has taken the realm as his own charge."
 hd_story_guan_yu_life:0 "Annals of Guan Yu"
 hd_story_guan_yu_life_desc:0 "Courtesy name Yunchang, of Xie in Hedong"
 HD_STORY_GUAN_YU_LIFE_STATUS:0 "Guan Yunchang fled to Zhuo Commandery as a fugitive and followed the First Lord from his humble days, close as a brother. At Baima he cut down Yan Liang amid ten thousand men; now he holds Jing Province and looks north toward Xiangyang and Fan."
 hd_story_jiang_wei_life:0 "Annals of Jiang Wei"
 hd_story_jiang_wei_life_desc:0 "Courtesy name Boyue, of Ji in Tianshui"
 HD_STORY_JIANG_WEI_LIFE_STATUS:0 "Jiang Boyue was once an officer of Wei and came over to Han in the sixth year of Jianxing; Zhuge Liang called him the finest man of Liang Province. With the Chancellor gone, he carries on his unfinished work and marches out of Longxi again and again."
 hd_story_sima_life:0 "The Sima Family's Foundation of Jin"
 hd_story_sima_life_desc:0 "The Sima family of Wen County in Henei"
 HD_STORY_SIMA_LIFE_STATUS:0 "The Sima have long been a great family of Henei. Sima Zhongda has served four generations of the Cao, deep and full of stratagems; as father and sons hold power one after another, the authority of Wei passes slowly into their house."
 hd_story_zhong_hui_life:0 "Annals of Zhong Hui"
 hd_story_zhong_hui_life_desc:0 "Courtesy name Shiji, of Changshe in Yingchuan"
 HD_STORY_ZHONG_HUI_LIFE_STATUS:0 "Zhong Shiji is the youngest son of the Grand Tutor Zhong Yao, quick and precocious from childhood and versed in the study of names and principles. In the fourth year of Jingyuan he leads the great army against Shu as General Who Guards the West."
 hd_story_liu_xiu_life:0 "Annals of Liu Xiu"
 hd_story_liu_xiu_life_desc:0 "Courtesy name Wenshu, of Caiyang in Nanyang"
 HD_STORY_LIU_XIU_LIFE_STATUS:0 "Liu Wenshu, a ninth-generation descendant of the Founder, is diligent at farming, and his elder brother Bosheng often laughs that he takes after the Founder's farmer brother. As Wang Mang's dynasty collapses into chaos, the Liu brothers of Chongling rise in arms, and Liu Xiu at first follows the army riding an ox."
 hd_story_liu_yuan_life:0 "The Xiongnu Liu Family's Foundation"
 hd_story_liu_yuan_life_desc:0 "The Xiongnu Liu family of Xinxing"
 HD_STORY_LIU_YUAN_LIFE_STATUS:0 "Liu Yuanhai descends from the Southern Xiongnu chanyu and bears the surname Liu as a nephew of the Han house. He studied the Classic of Poetry, the Zuo Commentary and the arts of war from youth; in the first year of Yongxing he proclaimed himself King of Han at Zuoguo, and all five Xiongnu divisions came under his banner."
 hd_story_zu_ti_life:0 "Annals of Zu Ti"
 hd_story_zu_ti_life_desc:0 "Courtesy name Shizhi, of Qiu in Fanyang"
 HD_STORY_ZU_TI_LIFE_STATUS:0 "Zu Shizhi is open-hearted, careless of wealth and fond of chivalry. Serving as a registrar of Si Province with Liu Kun, he shared a blanket with him; hearing a cock crow at midnight he kicked Liu Kun awake, saying it was no ill omen, and the two rose to practice the sword."
 hd_story_liu_kun_life:0 "Annals of Liu Kun"
 hd_story_liu_kun_life_desc:0 "Courtesy name Yueshi, of Weichang in Zhongshan"
 HD_STORY_LIU_KUN_LIFE_STATUS:0 "Liu Yueshi descends from King Jing of Zhongshan and was known for his boldness from youth, one of the Twenty-Four Friends of the Golden Valley. Now that the realm is in chaos, he shares Zu Ti's resolve to set it right, fearing only that Zu will crack the whip before him."
 hd_story_huan_wen_life:0 "Annals of Huan Wen"
 hd_story_huan_wen_life_desc:0 "Courtesy name Yuanzi, of Longkang in Qiao"
 HD_STORY_HUAN_WEN_LIFE_STATUS:0 "Huan Yuanzi was bold from youth. When his father Huan Yi died in Su Jun's rebellion, he slept on his spear and wept blood, and at eighteen killed his enemy's son with his own hands. He holds Jing Province with a great army, and the court both relies on him and fears him."
 hd_story_yin_hao_life:0 "Annals of Yin Hao"
 hd_story_yin_hao_life_desc:0 "Courtesy name Shenyuan, of Changping in Chen"
 HD_STORY_YIN_HAO_LIFE_STATUS:0 "Yin Shenyuan is clear and far-sighted, a master of the mysterious learning. He lived in retirement by his family tombs for nearly ten years, and men compared him to Guan Zhong and Zhuge Liang; now the court entrusts him with Yang Province, hoping he will hold Huan Wen of Jing Province in check."
 hd_story_fu_jian_life:0 "Annals of Fu Jian"
 hd_story_fu_jian_life_desc:0 "Courtesy name Yonggu, of Linwei in Lueyang"
 HD_STORY_FU_JIAN_LIFE_STATUS:0 "Fu Yonggu is a man of the Di; his grandfather Fu Hong rose in Lueyang. He deposed and killed the cruel Fu Sheng, took the title Heavenly King of Great Qin, and with the Han official Wang Meng set the government in order, so that Guanzhong is well ruled."
 hd_story_liu_yu_life:0 "Annals of Liu Yu"
 hd_story_liu_yu_life_desc:0 "Courtesy name Deyu, of Suiyu Village in Pengcheng"
 HD_STORY_LIU_YU_LIFE_STATUS:0 "Liu Deyu, called Jinu as a child, grew up poor and once sold sandals for a living. He joined the Beifu army and won many honors against Sun En; when Huan Xuan usurped the Jin throne, he rose at Jingkou and has already fought his way into Jiankang."
 hd_story_hou_jing_life:0 "Annals of Hou Jing"
 hd_story_hou_jing_life_desc:0 "Courtesy name Wanjing, of Shuofang"
 HD_STORY_HOU_JING_LIFE_STATUS:0 "Hou Wanjing's right leg is short and he is no horseman or archer, but he excels at stratagems. He rose from the garrison soldiers of Huaishuo and won honors under Erzhu Rong; now, as the realm churns, he watches coldly for a place to make his own."
 hd_story_xiao_yan_life:0 "Annals of Xiao Yan"
 hd_story_xiao_yan_life_desc:0 "Courtesy name Shuda, of Zhongdu Village in Southern Lanling"
 HD_STORY_XIAO_YAN_LIFE_STATUS:0 "Xiao Shuda is learned and gifted, one of the Eight Friends of Jingling with Shen Yue and Xie Tiao. He rose at Xiangyang, replaced the Qi with the Liang, and has reigned for nearly thirty years; in old age he holds devoutly to the Buddha's teaching, eats one meal a day, and has more than once given himself to the Tongtai Temple."
 hd_story_chen_qingzhi_life:0 "Annals of Chen Qingzhi"
 hd_story_chen_qingzhi_life_desc:0 "Courtesy name Ziyun, of Guoshan in Yixing"
 HD_STORY_CHEN_QINGZHI_LIFE_STATUS:0 "Chen Ziyun has served Xiao Yan since boyhood. He is no horseman and his arrows cannot pierce armor, but he is rich in stratagems. In the Datong years he led seven thousand men in white robes north, fighting across a thousand li, and for a time held Luoyang."
