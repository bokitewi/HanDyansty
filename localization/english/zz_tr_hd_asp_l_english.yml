 hd_asp_pr_cqz_rujiang:0 "Main goal: $hd_asp_reward_medium$, and the modifier $hd_asp_mod_rujiang$\nEach bonus goal: $hd_asp_reward_small$"
 hd_asp_pd_cqz_rujiang:0 "You cannot ride well and your arrows cannot pierce armor, yet you win by strategy. People say a great general's strength lies not in bow and horse but in the landscape of the mind."
 hd_asp_pmod_cqz_rujiang:0 "$hd_asp_mod_rujiang$"
