l_english:
 hd_j16.1300.t:0 "Ma Qiu at the Border"
 hd_j16.1300.desc:0 "Your father is barely in his grave and you have only just taken his seat when the Zhao general Ma Qiu marches out of Jincheng against Fuhan. Most of your officers urge you to hold fast. The veteran Zhang Guan asks for the command, while your recorder Xie Ai writes that a few thousand foot and horse would be enough to break the enemy. Others counsel sending envoys and buying peace with silk and coin."
 hd_j16.1300.a:0 "Raise Xie Ai to General of the Firm Center and send him out."
 hd_j16.1300.b:0 "Entrust the veteran Zhang Guan; experience is safer."
 hd_j16.1300.c:0 "Send envoys and pay for peace."
 hd_j16.1301.t:0 "Fuhan Again"
 hd_j16.1301.desc:0 "Zhao will not let it rest. Shi Hu has sent Shi Ning to join Ma Qiu, twenty thousand strong by their own count, and Fuhan is under attack once more. Hexi is restless, and your officers come again for orders."
 hd_j16.1301.a:0 "Send Xie Ai against them again."
 hd_j16.1301.b:0 "Give the command to Zhang Guan."
 hd_j16.1301.c:0 "Sue for peace once more."
 hd_j16.1302.t:0 "Slander against Xie Ai"
 hd_j16.1302.desc:0 "Xie Ai has beaten Ma Qiu twice and his name grows every day. Your elder half-brother Zhang Zuo and others close to you keep whispering that his merit has made him too great to control and that he will turn on you in time. Some advise sending him away as Grand Administrator of Jiuquan; others say the slander is worthless and a good general should be kept close."
 hd_j16.1302.a:0 "Send Xie Ai out to govern Jiuquan."
 hd_j16.1302.b:0 "Ignore the slander and keep Xie Ai at court."
 hd_j16.1303.t:0 "Acting King of Liang"
 hd_j16.1303.desc:0 "Shi Hu is dead and everything east of the passes is in chaos, yet edicts from Jiangdong still arrive late or not at all. Your officials petition you to style yourself King of Liang and set up a full court to steady the people. Doing so would dent the Zhang family's long record of loyalty to Jin, and Jiankang will not be pleased."
 hd_j16.1303.a:0 "Take the title of Acting King of Liang."
 hd_j16.1303.b:0 "Remain Duke of Xiping and keep faith with Jin."
 hd_j16.1304.t:0 "Campaign against Qin"
 hd_j16.1304.desc:0 "The Fu clan has only just seized Guanzhong, and the commanderies west of the Long hills have not yet accepted them. Your generals ask to send Song Xiu and Zhang Hong east to take Tianshui while Qin is still unsteady. Others think Qin's troops are at their sharpest and that you would do better to guard your borders and let the people rest."
 hd_j16.1304.a:0 "Send Song Xiu and Zhang Hong east."
 hd_j16.1304.b:0 "Guard the border and keep the peace."
 hd_j16.1305.t:0 "Orders to March West"
 hd_j16.1305.desc:0 "The ruler of Zhao has given his orders. The Zhang clan of Hexi has a new and untried lord, and this is the time to push west and take Fuhan. The troops of Jincheng are yours to command, and the move is yours to make."
 hd_j16.1305.a:0 "March west as ordered."
 hd_j16.1305.b:0 "Hold the troops back and wait."
 hd_j16.1310.t:0 "Zhang Zuo at the Palace Gate"
 hd_j16.1310.desc:0 "Your father is scarcely buried, and your uncle Zhang Zuo has already plotted with the palace and the great ministers to depose you. You are young and there are few you can rely on. If you call Xie Ai back to strike at the traitor, you may yet have a chance."
 hd_j16.1310.a:0 "Yield Liang and ask only for your life."
 hd_j16.1310.b:0 "Recall Xie Ai to strike at the traitor."
 hd_j16.1311.t:0 "A Child on the Throne"
 hd_j16.1311.desc:0 "The late king is gone and his heir is a child. There are people in the palace ready to open the doors for you and ministers at court who take their cue from you. Say the word and Liang is yours."
 hd_j16.1311.a:0 "Depose the boy and take the seat."
 hd_j16.1311.b:0 "Serve the young lord faithfully."
 hd_j16.1312.t:0 "The Title of King of Liang"
 hd_j16.1312.desc:0 "You hold Liang firmly now. Your intimates urge you to proclaim yourself King of Liang, change the era name, and stop pretending to be a servant of Jin."
 hd_j16.1312.a:0 "Proclaim yourself King of Liang."
 hd_j16.1312.b:0 "Not yet."
 hd_j16.1313.t:0 "Zhang Guan Rises"
 hd_j16.1313.desc:0 "Zhang Guan, Inspector of Hezhou, has sent out a declaration denouncing you as a debauched tyrant and calling for the late king's son to be set on the throne. His army is already on the march."
 hd_j16.1313.a:0 "Then let it come to war."
 hd_j16.1314.t:0 "Coup at Guzang"
 hd_j16.1314.desc:0 "The lord of Liang is young and power lies with his ministers. As a member of the ruling house, your people urge you to strike first, remove your nephew, and rule Hexi yourself."
 hd_j16.1314.a:0 "Depose the boy and take power."
 hd_j16.1314.b:0 "No."
 hd_j16.1315.t:0 "Moving against Zhang Guan"
 hd_j16.1315.desc:0 "Zhang Guan has held power too long. He distrusts the great ministers, and word is that he is thinking of seizing the throne. You do not have many troops, but there are people in the palace and in the city ready to rise with you."
 hd_j16.1315.a:0 "Rise and destroy Zhang Guan."
 hd_j16.1315.b:0 "Stay your hand."
 hd_j16.1316.t:0 "Against Zhang Zuo"
 hd_j16.1316.desc:0 "Zhang Zuo murdered his lord to take the throne and rules with cruelty and excess; the hearts of Hexi have long since turned from him. From Hezhou you command strong forces and could march east and raise the late king's son in his place."
 hd_j16.1316.a:0 "Raise troops against the usurper."
 hd_j16.1316.b:0 "Wait and see."
 hd_j16.1350.t:0 "Titles from Both Sides"
 hd_j16.1350.desc:0 "Chouchi lies between Jin and Zhao. Jiankang has sent envoys offering you the titles of General Who Conquers the South and Duke of Chouchi, and Ye has sent you Zhao titles as well. Both sides want you, and you must decide where you stand."
 hd_j16.1350.a:0 "Side with Jin and accept its titles."
 hd_j16.1350.b:0 "Stay with Zhao."
 hd_j16.1350.c:0 "Answer neither and keep to your own passes."
 hd_j16.1352.t:0 "Raid on Xicheng"
 hd_j16.1352.desc:0 "The Fu clan has only just entered Guanzhong and its western defenses are thin. Your officers ask you to strike at a border town and widen your lands while you can."
 hd_j16.1352.a:0 "Attack."
 hd_j16.1352.b:0 "Stay put."
 hd_j16.1354.t:0 "Your Uncle Stirs"
 hd_j16.1354.desc:0 "Word has come in secret that your uncle Yang Songnu and his cousin Liang Shiwang have been meeting often and seem to be plotting something. Songnu is your elder and well regarded in the clan; moving against him lightly could turn the family against you."
 hd_j16.1354.a:0 "Strike first and seize Yang Songnu."
 hd_j16.1354.b:0 "He is family. There is no need for suspicion."
 hd_j16.1354.c:0 "Shower him with gifts and keep him quiet for now."
 hd_j16.1354.a.success:0 "Yang Songnu is in prison"
 hd_j16.1354.a.fail:0 "The plan leaked and the assassin struck first"
 hd_j16.1356.t:0 "Yang Jun Stirs"
 hd_j16.1356.desc:0 "Your uncle Yang Jun has gathered a growing following in the clan and has been meeting secretly with the generals. Some advise you to take precautions at once; others say it is only troublemakers stirring things up."
 hd_j16.1356.a:0 "Take precautions."
 hd_j16.1356.b:0 "It is only gossip. Ignore it."
 hd_j16.1356.a.success:0 "Yang Jun's plot came to nothing"
 hd_j16.1356.a.fail:0 "Too late: Yang Jun has risen"
 hd_j16.1357.t:0 "Master of Chouchi"
 hd_j16.1357.desc:0 "Your nephew Yang Guo has only just taken power and commands little respect; many in the clan would rather follow you. If you make up your mind, Chouchi is yours."
 hd_j16.1357.a:0 "Take his place."
 hd_j16.1357.b:0 "Keep serving Yang Guo."
 hd_j16.1380.t:0 "Whither Qinzhou"
 hd_j16.1380.desc:0 "Since Shi Hu's death his sons have been killing each other in Ye, and Zhao looks ready to fall apart. You hold Qinzhou with troops and land of your own. Ran Min is gathering talent in Ye, and Jin in Jiangdong still remembers the loyalty of your father Liu Yueshi. Or you could simply hold the Long hills for yourself."
 hd_j16.1380.a:0 "Bring Qinzhou over to Ran Min."
 hd_j16.1380.b:0 "Turn south to Jin, as your father would have wished."
 hd_j16.1380.c:0 "Hold the Long hills on your own."
 hd_j16.1380.d:0 "Stay loyal to the ruler of Zhao."
 hd_j16.1382.t:0 "Fu Jian Comes West"
 hd_j16.1382.desc:0 "Fu Jian has entered the passes and taken Chang'an, and his armies are pressing toward Longyou. Qinzhou stands alone on the western frontier, and you must decide soon whether to submit or fight."
 hd_j16.1382.a:0 "Submit to the Fu clan's Qin."
 hd_j16.1382.b:0 "Hold the passes against Qin."
 hd_j16.1400.t:0 "Sun Sheng Calls on the Duke of Anle"
 hd_j16.1400.desc:0 "Cheng-Han has fallen, and Sun Sheng of Huan Wen's staff has come to call on you. He says that the blood of the Zhaolie Emperor still lives in Shu, and that Lord Huan would gladly have you come east with his army to Jiankang, where the court will treat you with every courtesy. Old friends in Chengdu urge you to stay, saying the people of Shu have not forgotten the house of Han."
 hd_j16.1400.desc_card:0 "\n\nYou carry one more thing in your heart: to restore the Han of the Liu. In Jiankang you would be just another idle noble at the Son of Heaven's feet. In Shu, there might yet be a chance."
 hd_j16.1400.desc_nocard:0 ""
 hd_j16.1400.a:0 "Go east to Jiankang with Huan Wen."
 hd_j16.1400.b:0 "Stay in Chengdu."
 hd_j16.1400.c:0 "Close your gates and live as a recluse."
 hd_j16.1401.t:0 "Rising in Shu"
 hd_j16.1401.desc:0 "You have raised the banner of the Liu in Shu. Old retainers have flocked to you on hearing the news, and a county town is already in your hands. Next comes the whole commandery."
 hd_j16.1401.a:0 "The Han shall go on."
 hd_j16_xieai_modifier:0 "Xie Ai's Generalship"
 hd_j16_xieai_modifier_desc:0 "Xie Ai broke Ma Qiu twice with only a few thousand men, and all Hexi knows him for a master of war."
 hd_j16_jin_fanchen_modifier:0 "Vassal Lord of Jin"
 hd_j16_jin_fanchen_modifier_desc:0 "This lord follows the Jin calendar and holds Jin titles. Though far out on the frontier, they still count themselves a servant of Jin."
 hd_j16_zhao_fenghao_modifier:0 "Titled by Zhao"
 hd_j16_zhao_fenghao_modifier_desc:0 "This lord has accepted titles from Zhao and looks to Ye as overlord."
 hd_j16_yuesi_modifier:0 "Son of Liu Yueshi"
 hd_j16_yuesi_modifier_desc:0 "This is the son of Liu Kun, Minister of Works of Jin. Liu Kun held Bingzhou alone and died true to his cause in Youzhou, and his loyalty is known throughout the realm, so men of letters look kindly on his son."
 hd_j16_hanshi_yuyin_modifier:0 "Last Scion of Han"
 hd_j16_hanshi_yuyin_modifier_desc:0 "This is a descendant of the Zhaolie Emperor. The people of Shu still remember the First Lord and feel a particular closeness to him."
 hd_j16_anle_gong_modifier:0 "Duke of Anle"
 hd_j16_anle_gong_modifier_desc:0 "As a descendant of the Zhaolie Emperor this lord lives as an honored guest in Jiankang, bearing the old title of Duke of Anle and treated with full courtesy by the court."
 hd_j16_yinju_modifier:0 "Living as a Recluse"
 hd_j16_yinju_modifier_desc:0 "This person has shut the gates to read and has no interest in the affairs of the world."
 hd_j16_yinnue_modifier:0 "Debauched Tyrant"
 hd_j16_yinnue_modifier_desc:0 "This ruler is debauched and cruel, and their subjects are drifting away."
 hd_j16_bayu_opinion:0 "Raised Me Up"
 hd_j16_weiren_opinion:0 "Trusted Me with Command"
 hd_j16_chanxing_opinion:0 "Heeded My Counsel"
 hd_j16_chanfei_opinion:0 "Ignored My Warnings"
 hd_j16_jiawang_opinion:0 "Usurped a Royal Title"
 hd_j16_fanchen_opinion:0 "Loyal Vassal of Jin"
 hd_j16_fengzhao_opinion:0 "Loyal to Zhao"
 hd_j16_yuesi_opinion:0 "Son of Liu Yueshi"
 hd_j16_anle_opinion:0 "The Duke of Anle Came to Us"
 hd_j16_laifu_opinion:0 "Brought Qinzhou Over"
 hd_j16_lxuan_juhanzhi_decision:0 "Raise the Banner of Han"
 hd_j16_lxuan_juhanzhi_decision_desc:0 "A descendant of the Zhaolie Emperor who has found footing in Shu should raise the banner of the Liu Han. If you still serve another, first break free of your overlord. If you already stand on your own, proclaim the name of your realm."
 hd_j16_lxuan_juhanzhi_decision_tooltip:0 "Restore the Han of the Liu"
 hd_j16_lxuan_juhanzhi_decision_confirm:0 "Raise the banner!"
 hd_j16_lxuan_holds_yizhou_tt:0 "Hold at least one county in Yizhou"
 hd_j16_lxuan_indep_war_tt:0 "Have not used this decision to start a war of independence in the last five years"
 hd_j16_lxuan_juhanzhi_indep_effect_tt:0 "Start a war of independence against your overlord. Once independent, you can use this decision again to proclaim your realm."
 hd_j16_lxuan_juhanzhi_name_effect_tt:0 "Your primary title is renamed Han and you take the style of king"
 hd_j16_lxuan_qibing_decision:0 "Rise in Shu"
 hd_j16_lxuan_qibing_decision_desc:0 "You hold not an inch of land, but you still have the Liu name and the loyalty of old retainers. Spend some gold, take a risk, seize a county town in Shu, and you will have a place to stand."
 hd_j16_lxuan_qibing_decision_tooltip:0 "Seize a county in Shu and rise"
 hd_j16_lxuan_qibing_decision_confirm:0 "To arms!"
 hd_j16_lxuan_in_yizhou_tt:0 "Be in Yizhou"
 hd_j16_lxuan_qibing_county_tt:0 "There is a county in Yizhou you can take: held by a non-independent AI lord and not their capital"
 hd_j16_lxuan_qibing_effect_tt:0 "Take a county in Yizhou (your current location first, then Shu commandery) and declare independence. Gain a claim on its commandery and raise 3,000 troops there."
 hd_j16_346c_army_maqiu:0 "Ma Qiu's Army"
 hd_j16_346c_army_xieai:0 "Xie Ai's Army"
 hd_j16_346c_army_shining:0 "Shi Ning's Reinforcements"
 hd_j16_346c_army_songxiu:0 "Song Xiu's Army"
 hd_j16_346c_army_fuxiong:0 "Fu Xiong's Army"
 hd_j16_346c_army_qiuchi:0 "Chouchi Troops"
 hd_j16_346c_army_yangjun:0 "Yang Jun's Troops"
 hd_j16_346c_army_lxuan:0 "Volunteers of the Han Banner"
