l_english:
 hd_j16.5600.t:0 "Heavenly King"
 hd_j16.5600.desc:0 "The gold of Kucha and the horses of the Western Regions have come home with the army to Guzang. With the Hexi corridor secured, your generals urge you to go further: take the title of Heavenly King once borne by the Fu, change the era, and let the world know that Hexi has its own master."
 hd_j16.5600.a:0 "Take the throne as Heavenly King of Great Liang."
 hd_j16.5600.b:0 "Keep the title of King of the Three Rivers for now."
 hd_j16.5610.t:0 "King of Xiping"
 hd_j16.5610.desc:0 "The Xianbei of Hexi have gathered under your banner while the envoys of the Lü still demand tribute. It is time to give this new state a name: proclaim yourself Grand Commander and King of Xiping, with Baitu as your seat."
 hd_j16.5610.a:0 "Proclaim the Kingdom of Xiping and settle at Baitu."
 hd_j16.5610.b:0 "There is no hurry for titles."
 hd_j16.5620.t:0 "Raise Duan Ye"
 hd_j16.5620.desc:0 "Duan Ye, the Grand Administrator of Jiankang, is a gentle scholar with no head for war. Your warriors are strong, but a Juqu rising lacks legitimacy. Make Duan Ye Governor of Liang, use his name to win over the Han gentry, and keep the army in your own hands."
 hd_j16.5620.a:0 "Raise Duan Ye as nominal lord and keep the troops."
 hd_j16.5620.b:0 "The Juqu will lead their own people."
 hd_j16.5630.t:0 "Administrator of Dunhuang"
 hd_j16.5630.desc:0 "The post of Administrator of Dunhuang lies vacant, and the local magnates led by Song Yao have jointly recommended you. The court is willing to go along and appoint you to guard the western frontier."
 hd_j16.5630.a:0 "Accept the post at Dunhuang."
 hd_j16.5630.b:0 "Decline the appointment."
 hd_j16.5640.t:0 "Command at Shuofang"
 hd_j16.5640.desc:0 "Impressed by your bearing and eloquence, the Qin sovereign means to make you General Who Pacifies the North, give you tens of thousands of Xianbei and mixed tribal households, and post you to Shuofang. Some at court warn against trusting you, but he does not listen."
 hd_j16.5640.a:0 "Accept the command at Shuofang."
 hd_j16.5640.b:0 "Decline the command."
 hd_j16.5650.t:0 "Brother Succeeds Brother"
 hd_j16.5650.desc:0 "Wugu said on his deathbed that a troubled state needs a grown ruler. The elders of the tribe look to Lilugu and remind you that among the Tufa the throne passes from brother to brother. They ask you to step aside."
 hd_j16.5650.a:0 "Honor the late king's wish and yield to Lilugu."
 hd_j16.5650.b:0 "The throne is settled. Refuse."
 hd_j16.5651.t:0 "Brother Succeeds Brother"
 hd_j16.5651.desc:0 "Before he died, Lilugu entrusted the state to his brother Rutan, saying his talent could preserve the Tufa inheritance. The elders ask you to yield according to his wish."
 hd_j16.5651.a:0 "Yield to Rutan as the late king wished."
 hd_j16.5651.b:0 "The throne is settled. Refuse."
 hd_j16.5660.t:0 "Lü Zuan Enters the Palace"
 hd_j16.5660.desc:0 "The Heavenly King is barely cold and the Duke of Taiyuan, Lü Zuan, has already marched his men into the palace. His soldiers hold every gate. He says that in such dangerous times Guzang cannot be left to a bookish youth."
 hd_j16.5660.a:0 "Hand over the seals and yield to Lü Zuan."
 hd_j16.5660.b:0 "Hold the palace gates and refuse to yield."
 hd_j16.5670.t:0 "Independence at Dunhuang"
 hd_j16.5670.desc:0 "To the north, Duan Ye and the Juqu distrust each other, and no one in Liang can command the commanderies any longer. Tang Yao, Administrator of Jinchang, has sent a call to six commanderies proclaiming you Grand Commander and Duke of Liang, and Song Yao urges you to decide."
 hd_j16.5670.a:0 "Proclaim yourself Duke of Liang and begin a new era."
 hd_j16.5670.b:0 "Remain a loyal administrator."
 hd_j16.5680.t:0 "Lü Chao Demands Lü Long"
 hd_j16.5680.desc:0 "Lü Zuan was murdered in his cups and the palace is in turmoil. Lü Chao holds the guards and says his elder brother Lü Long has the people's trust. He asks you to hand the throne to Lü Long to calm the realm."
 hd_j16.5680.a:0 "Yield to Lü Long."
 hd_j16.5680.b:0 "Refuse and hold the palace."
 hd_j16.5681.t:0 "The Plot of Fanhe"
 hd_j16.5681.desc:0 "Lü Chao, Administrator of Fanhe, marched without orders; summoned to answer for it, he keeps close company with his brother Lü Long. Some at court warn you that his men have slipped into the guards, and that it would be safer to hand the throne to Lü Long now."
 hd_j16.5681.a:0 "Abdicate in favor of Lü Long."
 hd_j16.5681.b:0 "I am the Heavenly King. Who would dare?"
 hd_j16.5690.t:0 "Remove Duan Ye"
 hd_j16.5690.desc:0 "Duan Ye grows ever more suspicious of the Juqu and is said to be looking for a pretext to remove Nancheng. Rather than wait, turn the tables: let Duan Ye kill Nancheng, then rise to avenge him and take Liang for the Juqu in earnest."
 hd_j16.5690.a:0 "Carry out the plan and remove Duan Ye."
 hd_j16.5690.b:0 "His name is still useful. Leave him be."
 hd_j16.5700.t:0 "Qiudoufa Khagan"
 hd_j16.5700.desc:0 "All the tribes of the northern steppe have submitted, and the Gaoche clans have been driven far away. Your people ask you to take the title of khagan, Qiudoufa, the one who drives and expands. From now on the Rouran will have a sovereign of their own."
 hd_j16.5700.a:0 "Take the title Qiudoufa Khagan."
 hd_j16.5700.b:0 "Not yet."
 hd_j16.5710.t:0 "Move to Jiuquan"
 hd_j16.5710.desc:0 "Dunhuang lies at the far western edge while the armies of Northern Liang draw closer each year. Your ministers propose moving the capital east to Jiuquan, nearer the front and better placed to manage the east, and to seek a few years of peace with the Juqu."
 hd_j16.5710.a:0 "Move to Jiuquan and make peace with Northern Liang."
 hd_j16.5710.b:0 "Dunhuang remains our root."
 hd_j16.5720.t:0 "King of Liang Again"
 hd_j16.5720.desc:0 "Yao Bi marched west with the Qin army and you threw him back beneath the walls of Guzang. The envoys from Chang'an now speak far more softly. Yao Xing has troubles enough at home, and for four years you have used Qin's calendar and set aside your royal title. Your generals urge you to call yourself King of Liang again and answer to Qin no more."
 hd_j16.5720.a:0 "Take back the title of King of Liang and break with Qin."
 hd_j16.5720.b:0 "Remain a vassal of Qin."
 hd_j16.5730.t:0 "Restoration"
 hd_j16.5730.desc:0 "You have lived on Qin's sufferance for years. The Qin sovereign is aging and Guanzhong is restless, and your old followers still wait at Yuanchuan. Now is the time to go back and reclaim your old lands."
 hd_j16.5730.a:0 "Lead your people west and reclaim the title of King of Qin."
 hd_j16.5730.b:0 "Remain a vassal of Qin."
 hd_j16.5740.t:0 "Designs on Guzang"
 hd_j16.5740.desc:0 "Guzang is the heart of Liang, yet it is in Tufa hands. Rutan has been at war year after year and his realm is exhausted. This is the moment to take Guzang."
 hd_j16.5740.a:0 "March east and take Guzang."
 hd_j16.5740.b:0 "Wait a little longer."
 hd_j16.5741.t:0 "The Juqu Are Coming"
 hd_j16.5741.desc:0 "Mengxun of Northern Liang is marching east in force and his vanguard is nearing Guzang. Supplies in the city are low and the people are frightened."
 hd_j16.5741.a:0 "Muster the troops."
 hd_j16.5742.t:0 "Entering Guzang"
 hd_j16.5742.desc:0 "Guzang is yours. Your ministers ask you to move the capital here and take the title of King of Hexi, so that all of Hexi answers to you."
 hd_j16.5742.a:0 "Move to Guzang and become King of Hexi."
 hd_j16.5742.b:0 "No need to move."
 hd_j16.5750.t:0 "Hulü Succeeds"
 hd_j16.5750.desc:0 "Qiudoufa Khagan is dead and his sons are young. The tribes have chosen his brother Hulü to succeed and ask you to give up the khaganate."
 hd_j16.5750.a:0 "Yield to Hulü."
 hd_j16.5750.b:0 "Refuse."
 hd_j16.5751.t:0 "Datan Succeeds"
 hd_j16.5751.desc:0 "After Hulü's death Bulüzhen seized power in the confusion and was himself killed by Datan. Datan has long had the tribes' loyalty, and they all want him as khagan. They ask you to step aside."
 hd_j16.5751.a:0 "Yield to Datan."
 hd_j16.5751.b:0 "Refuse."
 hd_j16.5760.t:0 "Chipan Succeeds"
 hd_j16.5760.desc:0 "Qiangui has been murdered by his nephew Gongfu. Crown Prince Chipan is hurrying back from Fuhan, and the generals want to follow him and punish Gongfu."
 hd_j16.5760.a:0 "Accept Chipan as sovereign."
 hd_j16.5760.b:0 "Refuse."
 hd_j16.5770.t:0 "Tongwan"
 hd_j16.5770.desc:0 "The new capital built under Chigan Ali's supervision is finished, its walls of steamed earth so hard that an awl cannot pierce them. You name it Tongwan, to unite all under heaven and rule ten thousand states."
 hd_j16.5770.a:0 "Move the capital to Tongwan."
 hd_j16.5770.b:0 "Not yet."
 hd_j16.5780.t:0 "Strike at Ledu"
 hd_j16.5780.desc:0 "Rutan has taken his main army west against the Yifu, leaving only Crown Prince Hutai to hold Ledu. This is the chance to swallow Southern Liang in one stroke."
 hd_j16.5780.a:0 "Send the army to take Ledu."
 hd_j16.5780.b:0 "Wait a little longer."
 hd_j16.5781.t:0 "Western Qin Attacks"
 hd_j16.5781.desc:0 "A great Western Qin army is at the border and Ledu is in danger."
 hd_j16.5781.a:0 "Muster the troops."
 hd_j16.5790.t:0 "Emperor at Bashang"
 hd_j16.5790.desc:0 "Chang'an is in your hands. Your ministers have raised an altar at Bashang and ask you to take the imperial title, with Tongwan as the northern capital and Chang'an as the southern seat of government."
 hd_j16.5790.a:0 "Take the imperial throne."
 hd_j16.5790.b:0 "Not yet."
 hd_j16.5795.t:0 "Luring Li Xin"
 hd_j16.5795.desc:0 "You feign a southern campaign against Western Qin while hiding your army at Chuanyan. Li Xin of Western Liang is young and rash; if he hears Northern Liang is undefended he will surely attack, and you can ambush him."
 hd_j16.5795.a:0 "Carry out the plan and attack Western Liang."
 hd_j16.5795.b:0 "Wait a little longer."
 hd_j16.5796.t:0 "Northern Liang Strikes"
 hd_j16.5796.desc:0 "A Northern Liang army has suddenly appeared within your borders. Mengxun's southern campaign was a ruse."
 hd_j16.5796.a:0 "Muster the troops."
 hd_j16_duanye_mingyi_modifier:0 "Nominal Lord of Northern Liang"
 hd_j16_duanye_mingyi_modifier_desc:0 "Raised as Governor of Liang by the Juqu: lord in name, while others hold the army."
 hd_j16_xia_duoma_modifier:0 "Seized Horses"
 hd_j16_xia_duoma_modifier_desc:0 "Intercepted the eight thousand horses the Rouran sent to the Qin sovereign; the cavalry is greatly strengthened."
 hd_j16_rouran_khagan_modifier:0 "Qiudoufa Khagan"
 hd_j16_rouran_khagan_modifier_desc:0 "Has taken the title of khagan; all the tribes of the northern steppe have submitted."
 hd_j16_duanye_nominal_opinion:0 "Nominal Lord"
 hd_j16_xiliang_tonghao_opinion:0 "Peace Between the Two Liangs"
 hd_j16_n2_army_guzang_name:0 "Mengxun's Army"
 hd_j16_n2_army_ledu_name:0 "Chipan's Army"
 hd_j16_n2_army_xiliang_name:0 "Northern Liang Ambush"
