l_english:
 HD_DEFENSIVE_LEAGUE_NAME:0 "Defensive Alliance"
 HD_ANTI_REGENT_LEAGUE_NAME:0 "Alliance Against Dong"
 hd_offer_defensive_league_interaction:0 "Propose to form a defensive alliance"
 hd_offer_defensive_league_interaction_desc:0 "Invite a neighboring independent ruler to join forces in defending against external enemies."
 hd_offer_defensive_league_interaction_notification:0 "[actor.GetTitledFirstName] proposes to form a defensive alliance."
 hd_join_defensive_league_interaction:0 "Join the Defensive Alliance"
 hd_join_defensive_league_interaction_desc:0 "Join the defensive alliance led by [recipient.GetTitledFirstName]."
 hd_demand_defensive_league_vote_interaction:0 "Requesting alliance votes in support"
 hd_demand_defensive_league_vote_interaction_desc:0 "Use deterrence or alliances to force members to vote for you in the next election for Alliance Leader."
 hd_call_defensive_league_to_war_interaction:0 "Convene the alliance to join the battle"
 hd_call_defensive_league_to_war_interaction_desc:0 "Spend prestige to summon members of this alliance to join all offensive wars currently led by you."
 hd_leave_defensive_league_decision:0 "Exit Defensive Alliance"
 hd_leave_defensive_league_decision_desc:0 "The alliance no longer serves my interests."
 hd_leave_defensive_league_decision_tooltip:0 "Exit the current defensive alliance at the cost of prestige."
 hd_unify_defensive_league_decision:0 "United Alliance"
 hd_unify_defensive_league_decision_desc:0 "Integrate the long-term cooperative defensive alliance into a true kingdom."
 hd_unify_defensive_league_decision_tooltip:0 "Create or seize the legitimate kingdom where the capital is located after meeting the conditions."
 hd_confederation.0500.t:0 "Alliance Unification"
 hd_confederation.0500.desc:0 "Years of joint defense have accustomed the alliance members to obeying your commands. Now that the de jure kingdom, where the capital resides, is almost entirely under your control, it is time to transform this loose oath into a true kingdom."
 hd_confederation.0500.a:0 "Let the feudal lords witness the unification together."
 hd_confederation_subjugation_victory_desc:0 "Alliance conquest war victory; the target ruler will join the alliance."
 hd_confederation_subjugation_white_peace_desc:0 "The Alliance Conquest War ends in a white peace."
 hd_confederation_subjugation_defeat_desc:0 "Alliance conquest war failed."
 hd_anti_regent.0001.t:0 "Call for Alliance"
 hd_anti_regent.0001.desc:0 "Dong Zhuo controls the Son of Heaven and coerces the court. You have gathered the feudal lords to serve as the leader of the coalition against Dong Zhuo, first assembling forces under the banner of alliance, then clearing away those who threaten the monarch with arms."
 hd_anti_regent.0001.a:0 "Heroes of the world should unite to punish him."
 hd_anti_regent.0002.t:0 "Alliance Letters Issued in Four Directions"
 hd_anti_regent.0002.desc:0 "The alliance letter has been dispatched to all regions, inviting the Han lords to jointly launch a campaign against Dong Zhuo. Regardless of how the lords respond, the armies will still raise their banners within the originally scheduled three-month period; even if the leader of the alliance passes away, the living lords will assume control of the alliance affairs and continue the expedition."
 hd_anti_regent.0002.a:0 "Spread the alliance charter throughout the world."
 hd_anti_regent.0003.t:0 "Alliance Letter Against Dong"
 hd_anti_regent.0003.desc:0 "[scope:hd_anti_regent_inviter_scope.GetTitledFirstName] sends a league letter, calling upon the Han lords to jointly punish Dong Zhuo who controls the court. Those who accept the alliance will leave their original lord and join the coalition to expel Dong Zhuo, marching with the army; those who oppose or remain neutral for the time being will retain their current positions without changing their allegiance."
 hd_anti_regent.0003.a:0 "Join the allied forces to jointly punish Dong Zhuo."
 hd_anti_regent.0003.b:0 "Oppose this alliance and continue to serve the Han court."
 hd_anti_regent.0003.c:0 "Remain neutral for now and observe the situation."
 hd_anti_regent.0009.t:0 "Reorganize Bohai Commandery"
 hd_anti_regent.0009.desc:0 "The storehouses of Bohai Commandery and the military registers have been fully audited. Shen Pei, Tian Feng, Ju Shou, and Xu You each lead their respective forces to join your command; Peng Ji, Yan Liang, Wen Chou, and Zhang He enter the commandery to await orders. Local warlords have also presented three thousand gold pieces, and five thousand heavy infantry are now arrayed outside the city walls."
 hd_anti_regent.0009.a:0 "Using this as a foundation, rally the world."
 hd_anti_regent.0012.t:0 "All armies convene in alliance"
 hd_anti_regent.0012.desc:0 "The three-month mobilization period has ended, and the banners of all armies have gathered like a forest. You have assumed command of the allied forces and issued orders to launch an expedition against Dong Zhuo."
 hd_anti_regent.0012.a:0 "Rally the troops and form battle lines; raise the army to march against Dong Zhuo."
 hd_anti_regent.0004.t:0 "Raise troops to punish Dong Zhuo"
 hd_anti_regent.0004.desc:0 "You have issued an order in the name of the Alliance to launch a military campaign, and the War Against Dong Zhuo has officially begun. Dong Zhuo still controls the imperial court; this is the time to purge the royal side and punish the powerful minister."
 hd_anti_regent.0004.a:0 "With this military strength, we shall purge the treacherous elements within the court."
 hd_yuan_bohai_armored_army:0 "Bohai Heavy Infantry"
 hd_anti_regent.0100.t:0 "Pursue?"
 hd_anti_regent.0100.desc:0 "The first campaign has proven that the allied forces can compel the Regent to yield. The warlords argue heatedly within the camp: should we withdraw our troops now, or press on toward the mountain passes while Guanzhong remains unstable?"
 hd_anti_regent.0100.a:0 "Continue the advance."
 hd_anti_regent.0100.b:0 "Disband the allied forces and withdraw your troops respectively."
 hd_anti_regent.0200.t:0 "The World After Crossing the Passes"
 hd_anti_regent.0200.desc:0 "The gates are finally opened, and the regent's direct territories fall into the hands of the allied forces. Various warlords present their ledgers of military achievements before the tent, awaiting the distribution of spoils. Now, as the leader of the alliance, I must preside over the enfeoffment to end the regent's control over the court."
 hd_anti_regent.0200.a:0 "Enfeoffment based on merit."
 hd_anti_regent_punitive_victory_desc:0 "The punitive campaign has been victorious; the warlords may decide whether to continue their advance."
 hd_anti_regent_punitive_white_peace_desc:0 "The punitive war ended in a white peace, causing the allied forces to disband."
 hd_anti_regent_punitive_defeat_desc:0 "The punitive expedition failed, and the regent repelled the allied forces."
 hd_enter_the_passes_victory_desc:0 "The allied forces breached Guanzhong and seized the territories directly under the Regent's control."
 hd_enter_the_passes_white_peace_desc:0 "The invasion war ended in a white peace, causing the alliance to disintegrate."
 hd_enter_the_passes_defeat_desc:0 "The invasion was repelled, and the regent preserved the court."
 HD_CONFEDERATION_SUBJUGATION_WAR_NAME:0 "Alliance Conquest War"
 HD_ANTI_REGENT_PUNITIVE_WAR_NAME:0 "Punitive Expedition"
 HD_ENTER_THE_PASSES_WAR_NAME:0 "Enter the Pass"
