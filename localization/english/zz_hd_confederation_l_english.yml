l_english:
 HD_DEFENSIVE_LEAGUE_NAME:0 "Defensive Alliance"
 HD_ANTI_REGENT_LEAGUE_NAME:0 "Alliance Against Dong Zhuo"
 hd_offer_defensive_league_interaction:0 "Propose a Defensive Alliance"
 hd_offer_defensive_league_interaction_desc:0 "Make a pact with this ruler to defend one another against outside threats."
 hd_offer_defensive_league_interaction_notification:0 "[actor.GetTitledFirstName] sends an envoy to propose an alliance for mutual defense."
 hd_join_defensive_league_interaction:0 "Join the Defensive Alliance"
 hd_join_defensive_league_interaction_desc:0 "Join the defensive alliance led by [recipient.GetTitledFirstName]."
 hd_demand_defensive_league_vote_interaction:0 "Demand Support in the Alliance Vote"
 hd_demand_defensive_league_vote_interaction_desc:0 "Call on your leverage or ties of alliance to secure this ruler’s vote for you as alliance leader."
 hd_call_defensive_league_to_war_interaction:0 "Call the Alliance to War"
 hd_call_defensive_league_to_war_interaction_desc:0 "As alliance leader, summon the member lords to march with you."
 hd_leave_defensive_league_decision:0 "Leave the Defensive Alliance"
 hd_leave_defensive_league_decision_desc:0 "The pact that once bound you now only holds you back. Better to part ways here than continue together unwillingly."
 hd_leave_defensive_league_decision_tooltip:0 "Leave your defensive alliance"
 hd_unify_defensive_league_decision:0 "Unite the Alliance"
 hd_unify_defensive_league_decision_desc:0 "After years under the pact, the houses already advance and retreat together. Rather than renewing their oaths each year, they could become one realm under one command."
 hd_unify_defensive_league_decision_tooltip:0 "Unite the alliance under you, take the province containing your capital, and receive the allegiance of its member lords."
 hd_confederation.0500.t:0 "An Alliance Becomes a Realm"
 hd_confederation.0500.desc:0 "The old alliance documents remain, but today’s papers set out new arrangements for uniting the lands. The territories around your capital are joining together, and the allied houses have moved from mutual aid to obedience under one command.\n\nYou study the new titles and allegiances. No longer can every matter be referred back to each house’s separate oath. Land, soldiers, and livelihoods have come together, and responsibility for them now rests upon your shoulders. A title can be won today; lasting obedience must be sustained through the government of the years ahead.\n\nThose waiting for the proclamation have assembled. You set the old covenant beside the new documents and order the union read aloud. From this day, the once loose pact has become a real allegiance."
 hd_confederation.0500.a:0 "One alliance, one realm, one command."
 hd_confederation_subjugation_victory_desc:0 "The defeated ruler must join the alliance."
 hd_confederation_subjugation_white_peace_desc:0 "Both sides lay down arms. The other ruler remains outside the alliance."
 hd_confederation_subjugation_defeat_desc:0 "The campaign fails. The other ruler need not join the alliance."
 hd_anti_regent.0001.t:0 "Chosen as Alliance Leader"
 hd_anti_regent.0001.desc:0 "The assembled lords choose you as their leader. Courteous refusals pass back and forth, and you answer each in turn. But when talk finally turns to sending troops, the voices around the table are less united.\n\nOne house lacks grain; another must leave soldiers to defend its borders. Men who moments ago could scarcely wait to cut off Dong Zhuo’s head suddenly have difficulties of their own. You listen with a wine cup in hand and a smile still on your face. Righteous anger has brought the lords together. Getting them to follow one command from here will fall to you.\n\nYou set down the cup, and the table gradually quiets. Now that leadership is settled, each man cannot insist on having the last word. Let the lords hear the leader’s arrangements first."
 hd_anti_regent.0001.a:0 "Seal the pact in blood. Together, strike down Dong Zhuo."
 hd_anti_regent.0002.t:0 "Covenants Sent Far and Wide"
 hd_anti_regent.0002.desc:0 "The covenants are sealed, and mounted couriers depart by separate roads. Each letter sent leaves a copy before you. Its empty space for a reply resembles a banner yet to arrive.\n\nThe lords have different doubts. Some watch their neighbors first; some remember their former allegiances; others fear that after Dong Zhuo falls, another man will seize his power. You cannot expect every reply to agree, nor can the muster be delayed by every hesitation.\n\nThe date is set. You must wait for those willing to come, prepare the troops able to march, and turn the covenant’s stirring words into a real campaign."
 hd_anti_regent.0002.a:0 "Muster on time. We need not wait for every lord."
 hd_anti_regent.0003.t:0 "The Covenant Against Dong Zhuo"
 hd_anti_regent.0003.desc:0 "The covenant from [hd_anti_regent_inviter_scope.GetTitledFirstName] arrives, calling for a joint campaign against Dong Zhuo and the restoration of the Han house. The envoy reports the armies’ strength, then falls silent to await your answer.\n\nYou do not take up your brush at once. Joining means more than saying that Dong Zhuo deserves death. Once you sign, you must leave your old allegiance and march west with the armies. An outright refusal will anger the alliance leader, though Dong Zhuo will remember the favor. An evasive answer will only keep you outside the struggle for now.\n\nEveryone below the dais knows this reply will circulate throughout Guandong. Who takes troops to bear its consequences must ultimately be your own decision."
 hd_anti_regent.0003.a:0 "Leave my old allegiance. Join the campaign against Dong Zhuo."
 hd_anti_regent.0003.b:0 "This alliance has no imperial decree. I cannot obey."
 hd_anti_regent.0003.c:0 "Guard my borders and await developments."
 hd_anti_regent.0009.t:0 "Organizing Bohai"
 hd_anti_regent.0009.desc:0 "Men from Bohai crowd outside your doors. Those reporting their retainers want their service recognized; those bringing money and grain want their names remembered. All are willing to wait for your final word on how the Yuan house will raise its army.\n\nYou order the clerk to record each contribution: how much money and silk, how many armored soldiers, and which renowned scholars will follow you. When you left Luoyang, Dong Zhuo likely thought that losing one man willing to grip a sword in court would let him sleep soundly. These men gathering around you are the best answer.\n\nAnother guest is announced. You hand the military rolls to your officers, straighten your robes, and go out to greet him. The Yuan house’s four generations among the Three Excellencies should serve their purpose now. First receive those willing to follow; then let Dong Zhuo hear their approaching footsteps."
 hd_anti_regent.0009.a:0 "Gather troops and grain. Make Bohai our base."
 hd_anti_regent.0012.t:0 "The Armies Assemble"
 hd_anti_regent.0012.desc:0 "The muster date has arrived, and the houses’ banners unfurl before the camp. As you assume command of the allied armies, the messenger reports troop numbers, then provisions, and only last the contingents yet to arrive.\n\nWaiting cannot continue forever. Dong Zhuo still controls the court. If the covenant’s promise to punish him is never acted upon, it will lose its weight even in your own camp. You order the armies to march. Outside, shouts immediately rise as ranks form and baggage is hurried forward.\n\nLooking again at the different banners, you know you cannot rid every man of private ambitions. But you must put them on the same road first. From today, the alliance becomes a war."
 hd_anti_regent.0012.a:0 "The orders are given. Let the armies advance."
 hd_anti_regent.0004.t:0 "March Against Dong Zhuo"
 hd_anti_regent.0004.desc:0 "The order to march has gone out. Baggage carts roll slowly through the camp gate, and armored soldiers line the road. The campaign against Dong Zhuo, discussed in the tent a moment ago, has become the sound of footsteps before you.\n\nYou hear the units’ reports, ask after the supply routes, and determine where the vanguard is to assemble. Men who all speak of cleansing the sovereign’s court may not accept equal risks. But now the army moves, stirring words over wine can no longer hold it together.\n\nDong Zhuo’s troops guard the court, while allied banners turn toward the capital. You close the final dispatch and send a messenger after the advance party. The coming battles will show what the oath is worth."
 hd_anti_regent.0004.a:0 "Set the armies in order. Advance together against Dong Zhuo."
 hd_yuan_bohai_armored_army:0 "Bohai Heavy Infantry"
 hd_anti_regent.0100.t:0 "The Allies Withdraw"
 hd_anti_regent.0100.desc:0 "The campaign against Dong Zhuo has ended in victory. The counties of Henan have each fallen to local strongmen who answer to no one, and talk of advancing into Guanzhong grows less frequent. Men in camp discuss different matters: how many days of grain they have, whether their home territories are safe, and when they may withdraw.\n\nYou watch the banners come down one by one. Dong Zhuo remains in Guanzhong, but the covenant that brought the lords together cannot keep them a few more days. Some hurry to say farewell; others send their baggage onto the road without waiting.\n\nThis victory has left Henan in no one's hands, and left the lords with armies of their own. You put away the old covenant, knowing that the next time you meet these men, you may not stand on the same side."
 hd_anti_regent.0100.a:0 "Continue the advance."
 hd_anti_regent.0100.b:0 "Withdraw to our own lands. The alliance ends here."
 hd_anti_regent.0200.t:0 "The World After Crossing the Passes"
 hd_anti_regent.0200.desc:0 "The gates are finally opened, and the regent's direct territories fall into the hands of the allied forces. Various warlords present their ledgers of military achievements before the tent, awaiting the distribution of spoils. Now, as the leader of the alliance, I must preside over the enfeoffment to end the regent's control over the court."
 hd_anti_regent.0200.a:0 "Enfeoffment based on merit."
 hd_anti_regent_punitive_victory_desc:0 "The alliance leader gains Henan, and the participating lords’ renown rises. The allied armies then disperse, and each lord withdraws."
 hd_anti_regent_punitive_white_peace_desc:0 "The punitive war ended in a white peace, causing the allied forces to disband."
 hd_anti_regent_punitive_defeat_desc:0 "The powerful minister repels the allies, raising the renown of his defending commanders. The alliance collapses."
 hd_enter_the_passes_victory_desc:0 "The allied forces breached Guanzhong and seized the territories directly under the Regent's control."
 hd_enter_the_passes_white_peace_desc:0 "The invasion war ended in a white peace, causing the alliance to disintegrate."
 hd_enter_the_passes_defeat_desc:0 "The invasion was repelled, and the regent preserved the court."
 HD_CONFEDERATION_SUBJUGATION_WAR_NAME:0 "Alliance Conquest War"
 HD_ANTI_REGENT_PUNITIVE_WAR_NAME:0 "Punitive Expedition"
 HD_ENTER_THE_PASSES_WAR_NAME:0 "War for the Passes"
