l_english:
 hd_anti_regent.0001.t:0 "Call the League"
 hd_anti_regent.0001.desc:0 "Dong Zhuo—or whoever now holds the regency—has turned the Son of Heaven into a shield for personal power. Yuan Shao will summon the realm's heroes under one banner, then march against the usurper."
 hd_anti_regent.0001.a:0 "The realm must answer together."
 hd_anti_regent.0003.t:0 "A League?"
 hd_anti_regent.0003.desc:0 "Yuan Shao sends a covenant accusing the regent of crossing every boundary of lawful service. You may answer the call, or watch the gamble from the sidelines."
 hd_anti_regent.0003.a:0 "I will join the league."
 hd_anti_regent.0003.b:0 "I will wait and see."
 hd_anti_regent.0100.t:0 "Pursue Them?"
 hd_anti_regent.0100.desc:0 "The first punitive expedition has forced the regent to yield ground. The lords now argue in camp: should the army return home, or press on while the passes are still open?"
 hd_anti_regent.0100.a:0 "Press through the passes."
 hd_anti_regent.0100.b:0 "End the advance."
 hd_anti_regent.0200.t:0 "The Realm Beyond the Passes"
 hd_anti_regent.0200.desc:0 "The gates have opened and the regent's directly held lands lie before the league. The spoils must now be assigned according to each lord's contribution, while Yuan Shao prepares to restore the court."
 hd_anti_regent.0200.a:0 "Distribute the spoils by merit."
 hd_anti_regent_punitive_victory_desc:0 "The punitive expedition is victorious; the league may decide whether to advance again."
 hd_anti_regent_punitive_white_peace_desc:0 "The punitive expedition ends in white peace; the league may still decide whether to advance."
 hd_anti_regent_punitive_defeat_desc:0 "The punitive expedition fails and the regent turns the league back."
 hd_enter_the_passes_victory_desc:0 "The league enters the passes and seizes the regent's directly held lands."
 hd_enter_the_passes_white_peace_desc:0 "The advance ends in white peace and the league dissolves."
 hd_enter_the_passes_defeat_desc:0 "The second expedition fails and the regent holds the court."
 HD_CONFEDERATION_SUBJUGATION_WAR_NAME:0 "League Subjugation War"
 HD_ANTI_REGENT_PUNITIVE_WAR_NAME:0 "Punitive Expedition"
 HD_ENTER_THE_PASSES_WAR_NAME:0 "March Through the Passes"
