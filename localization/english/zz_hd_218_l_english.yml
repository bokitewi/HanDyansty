l_english:
 hd_sg218.0010.t: "Men to Fight, Women to Carry Supplies"
 hd_sg218.0010.desc: "A military clerk spreads the new muster rolls across my desk. Outside the tent, the hammering of the armorers has yet to cease. The mountain roads to Hanzhong are long and treacherous, and the front needs both reinforcements and provisions. The rolls sent in by the counties list the men called to fight and the women assigned to carry grain in separate columns.\n\nI run my hand over the rolls, thinking of the soldiers still fighting hard to the north. Men to fight, women to carry supplies: all of Yizhou must sustain this campaign. The newly mustered foot soldiers, pikemen, and siege crossbows stand ready. They need only my order to set out."
 hd_sg218.0010.a: "Commit all Yizhou's strength to Hanzhong!"
 hd_sg218.0010.troops_tt: "Gain an army of #V 6000#! light infantry, #V 300#! siege crossbows, #V 2000#! pikemen, and #V 1500#! Banshun Cong warriors. These troops consume supplies, cannot be inherited, and disband when the war for Hanzhong ends."
 hd_sg218_levy_modifier: "Men to Fight, Women to Carry"
 hd_sg218_levy_modifier_desc: "All of Yizhou has turned out for the struggle over Hanzhong: the able-bodied men march with the army while the women haul its grain."
 hd_sg218.0065.t: "Holding Hanzhong"
 hd_sg218.0065.desc: "Everyone at court assumed I would give Hanzhong to Zhang Fei, and Zhang Fei assumed so himself. Instead I raised Wei Yan, a general of the camp guard, to command Hanzhong as its Grand Administrator, and the whole army was astonished.\n\nBefore the assembled officials I asked Wei Yan how he meant to fulfil so heavy a charge. He replied: 'If Cao Cao comes with all the strength of the realm, I will hold him off for you. If he sends a lieutenant with a hundred thousand men, I will swallow them whole.'"
 hd_sg218.0065.a: "Then Hanzhong is in your hands."
 hd_sg218_hanzhong_truce: "Hanzhong Border Clash"
