 building_hd_fo_futuci_lv1:0 "Futu Shrine"
 building_hd_fo_futuci_lv1_desc:0 "Ze Rong built this great shrine at Xiapi in the last years of Han: a bronze Buddha gilded with gold, halls holding three thousand. At each bathing of the Buddha, mats were laid for miles and ten thousand came to watch and eat."
