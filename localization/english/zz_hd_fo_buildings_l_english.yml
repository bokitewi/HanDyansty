 building_hd_fo_jianchusi_lv1:0 "Jianchu Temple"
 building_hd_fo_jianchusi_lv1_desc:0 "Kang Senghui reached Jianye in the tenth year of Chiwu. When Sun Quan doubted him, he prayed for relics and after three weeks they appeared in a blaze of light. Sun Quan built this temple for him, the first in the south."
