 building_hd_fo_tongtaisi_lv1:0 "Tongtai Temple"
 building_hd_fo_tongtaisi_lv1_desc:0 "Emperor Wu of Liang built this temple north of the palace city and opened a gate facing it. Again and again he gave himself to the temple as a servant, and his ministers paid a fortune to redeem him."
