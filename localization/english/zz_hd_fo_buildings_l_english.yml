 building_hd_fo_donglinsi_lv1:0 "Donglin Temple"
 building_hd_fo_donglinsi_lv1_desc:0 "Huan Yi, Inspector of Jiangzhou, raised this temple on the east of Mount Lu for Huiyuan, who stayed thirty years without leaving the mountain and here founded the White Lotus Society."
