 hd_fo_rebuild_baimasi_decision:0 "Rebuild the White Horse Temple"
 hd_fo_rebuild_baimasi_decision_desc:0 "The White Horse Temple was ruined in the persecution. Now that the Dharma is restored, it can be raised again as it once stood."
 hd_fo_rebuild_baimasi_decision_tooltip:0 "Rebuild the White Horse Temple to its former size. It will be finished in 6 years."
