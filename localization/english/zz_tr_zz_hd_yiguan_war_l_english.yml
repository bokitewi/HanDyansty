l_english:
 # Southern Migration of the Gentry, war side localization (casus belli, Han-side decisions, events hd_yiguan.4101-4149, war-side toasts and tooltips)
 # Army names hd_yiguan_uprising_army and hd_yiguan_liumin_army live in zz_hd_yiguan_l_*.yml (legacy event adaptation module) and are not repeated here

 ############################
 # Casus belli: Righteous Uprising
 ############################
 hd_yiguan_uprising_cb:0 "Righteous Uprising"
 hd_yiguan_uprising_cb_desc:0 "The Han righteous armies of the occupied north seize their cities and rise up, taking the contested commanderies and counties and ruling them as their own."
 HD_YIGUAN_UPRISING_WAR_NAME:0 "[ATTACKER.GetShortUIName]'s Righteous Uprising"
 hd_yiguan_uprising_victory_desc:0 "[attacker.GetShortUIName|U] takes the contested commanderies and counties, rules them independently, and adopts the [GetGovernment('celestial_government').GetName]."
 hd_yiguan_uprising_white_peace_desc:0 "The righteous army lays down its arms and disperses."
 hd_yiguan_uprising_defeat_desc:0 "The righteous army is scattered, and the contested commanderies and counties remain with [defender.GetShortUIName]."
 hd_yiguan_uprising_invalidated_desc:0 "[war.GetName] has ended: the contested commanderies and counties are no longer under [defender.GetShortUIName]'s rule."

 ############################
 # Casus belli: Northern Expedition
 ############################
 hd_yiguan_beifa_cb:0 "$HD_YIGUAN_BEIFA_CB_NAME$"
 hd_yiguan_beifa_cb_desc:0 "The royal army marches north to recover a northern province. If victorious, take all of the defender's commanderies and counties in that province, and its Huaxia counties gain 'Royal Army Pacifies the North'. Can only be declared by Southern Regimes during the Conflict phase of the Southern Migration of the Gentry."
 HD_YIGUAN_BEIFA_CB_NAME:0 "Northern Expedition"
 HD_YIGUAN_BEIFA_WAR_NAME:0 "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')][ATTACKER.GetPrimaryTitle.GetAdjective] Northern Expedition to [TITLE.GetBaseName]"
 HD_YIGUAN_BEIFA_WAR_NAME_BASE:0 "[ATTACKER.GetPrimaryTitle.GetAdjective] Northern Expedition"
 hd_yiguan_beifa_cb_victory_desc_attacker:0 "The royal army pacifies the north: you take all of [defender.GetShortUIName]'s commanderies and counties in the contested province, and its Huaxia counties gain 'Royal Army Pacifies the North'."
 hd_yiguan_beifa_cb_victory_desc:0 "[attacker.GetShortUIName|U] triumphs on the Northern Expedition and takes all of [defender.GetShortUIName]'s commanderies and counties in the contested province."
 hd_yiguan_beifa_cb_white_peace_desc:0 "Both armies stand down, and the Northern Expedition returns with nothing to show for it."
 hd_yiguan_beifa_cb_defeat_desc_defender:0 "You have repulsed the Northern Expedition, and [attacker.GetShortUIName] must pay you reparations."
 hd_yiguan_beifa_cb_defeat_desc:0 "The Northern Expedition fails, and [attacker.GetShortUIName] must pay reparations to [defender.GetShortUIName]."

 ############################
 # Casus belli: Campaign to Recover the North
 ############################
 hd_yiguan_taohu_cb:0 "$HD_YIGUAN_TAOHU_CB_NAME$"
 hd_yiguan_taohu_cb_desc:0 "The Northern Han take up arms against the Hu to recover a bordering commandery. If victorious, take all of the defender's counties in that commandery and gain prestige and dynasty prestige; its Huaxia counties gain 'Royal Army Pacifies the North', and you may Gather Refugees once for free. Can only be declared during the Conflict phase of the Southern Migration of the Gentry."
 HD_YIGUAN_TAOHU_CB_NAME:0 "Campaign to Recover the North"
 HD_YIGUAN_TAOHU_WAR_NAME:0 "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')][ATTACKER.GetPrimaryTitle.GetAdjective] Recovery of [TITLE.GetBaseName]"
 HD_YIGUAN_TAOHU_WAR_NAME_BASE:0 "[ATTACKER.GetPrimaryTitle.GetAdjective] Campaign against the Hu"
 hd_yiguan_taohu_cb_victory_desc_attacker:0 "You have recovered the contested commandery. All of [defender.GetShortUIName]'s counties within it are now yours, and refugees flock to you at the news."
 hd_yiguan_taohu_cb_victory_desc:0 "[attacker.GetShortUIName|U] recovers the contested commandery."
 hd_yiguan_taohu_cb_white_peace_desc:0 "Both armies stand down, and the contested commandery remains with [defender.GetShortUIName]."
 hd_yiguan_taohu_cb_defeat_desc_defender:0 "You have driven off [attacker.GetShortUIName] and held the contested commandery."
 hd_yiguan_taohu_cb_defeat_desc:0 "[attacker.GetShortUIName|U] fails in the campaign against the Hu and must pay reparations to [defender.GetShortUIName]."

 ############################
 # Casus belli: Return North in Arms
 ############################
 hd_yiguan_beihuan_cb:0 "$HD_YIGUAN_BEIHUAN_CB_NAME$"
 hd_yiguan_beihuan_cb_desc:0 "The Émigré Clans who crossed south lead their private retainers back to their homeland, seizing the defender's commanderies and counties in the chosen province and ruling them as their own."
 HD_YIGUAN_BEIHUAN_CB_NAME:0 "Return North in Arms"
 HD_YIGUAN_BEIHUAN_WAR_NAME:0 "[ATTACKER.GetShortUIName]'s Return North to [TITLE.GetBaseName]"
 HD_YIGUAN_BEIHUAN_WAR_NAME_BASE:0 "[ATTACKER.GetShortUIName]'s Return North"
 hd_yiguan_beihuan_cb_victory_desc_attacker:0 "You have fought your way back to your homeland and now hold [defender.GetShortUIName]'s commanderies and counties in the contested province. From now on you rule independently and adopt the [GetGovernment('celestial_government').GetName]."
 hd_yiguan_beihuan_cb_victory_desc:0 "[attacker.GetShortUIName|U] fights back to the homeland, holds the commanderies and counties of the contested province, and rules independently."
 hd_yiguan_beihuan_cb_white_peace_desc:0 "The army of the return stands down, never to set foot on its homeland."
 hd_yiguan_beihuan_cb_defeat_desc_defender:0 "You have crushed [attacker.GetShortUIName]'s army of the return."
 hd_yiguan_beihuan_cb_defeat_desc:0 "The army of the return is routed, and [attacker.GetShortUIName] must pay reparations to [defender.GetShortUIName]."

 ############################
 # Casus belli: Raise Rebellion
 ############################
 hd_yiguan_qiyi_cb:0 "Raise Rebellion"
 hd_yiguan_qiyi_cb_desc:0 "Han vassals in the occupied north, unable to bear the yoke of their Hu lords any longer, take up arms and declare independence."
 HD_YIGUAN_QIYI_WAR_NAME:0 "Uprising at [ATTACKER.GetPrimaryTitle.GetBaseName]"
 hd_yiguan_qiyi_cb_victory_desc_attacker:0 "You have broken free of [defender.GetShortUIName] and now rule independently."
 hd_yiguan_qiyi_cb_victory_desc:0 "[attacker.GetShortUIName|U] breaks free of [defender.GetShortUIName] and rules independently."
 hd_yiguan_qiyi_cb_white_peace_desc:0 "Both sides lay down their arms, and [attacker.GetShortUIName] still acknowledges [defender.GetShortUIName] as lord."
 hd_yiguan_qiyi_cb_defeat_desc_defender:0 "You have put down [attacker.GetShortUIName]'s rebellion and thrown the rebel into prison."
 hd_yiguan_qiyi_cb_defeat_desc:0 "The rebellion fails, and [attacker.GetShortUIName] is imprisoned by [defender.GetShortUIName]."
 hd_yiguan_qiyi_army:0 "Rebel Army"

 ############################
 # Restored commandery title: dynamic commandery name (taken from the capital county's name at creation; precedent: vanilla NEW_CREATED_TITLE_NAME)
 ############################
 hd_yiguan_war_dyn_duchy_name:0 "[hd_yiguan_duchy_county.GetBaseNameNoTierNoTooltip]"

 ############################
 # War-side toasts and tooltips
 ############################
 hd_yiguan_beifa_won_toast:0 "Victory in the North"
 hd_yiguan_beifa_won_toast_desc:0 "[hd_yiguan_toast_attacker.GetShortUIName|U] triumphs on the Northern Expedition and recovers [hd_yiguan_toast_title.GetBaseName]."
 hd_yiguan_taohu_liumin_tt:0 "Refugees flock in at the news: Gather Refugees once for free (ignores cooldown)"
 hd_yiguan_qiyi_helper_joined_toast:0 "Reinforcements Are Coming"
 hd_yiguan_qiyi_helper_joined_toast_desc:0 "[hd_yiguan_qy_helper.GetShortUIName|U] has answered your plea and sends troops to your aid."
 hd_yiguan_qiyi_helper_declined_toast:0 "No Help Comes"
 hd_yiguan_qiyi_helper_declined_toast_desc:0 "[hd_yiguan_qy_helper.GetShortUIName|U] keeps their troops at home; you must stand alone."

 ############################
 # Decision: Raise Rebellion
 ############################
 hd_yiguan_jubing_qiyi_decision:0 "Raise Rebellion"
 hd_yiguan_jubing_qiyi_decision_desc:0 "Hu horsemen squat upon our homeland, taxes and corvée are crushing, and the gentry are trampled in the dust. Better to raise the banner of revolt than bow our heads until we die: hold the city, send proclamations in every direction, and await the royal army.\n\n#weak Costs 100 prestige during the Conflict phase; 200 prestige and 100 gold in other phases; halved while your liege or top liege is imposing Hu-ization. 10-year cooldown.#!"
 hd_yiguan_jubing_qiyi_decision_tooltip:0 "Wage a war of independence against your Hu liege, and invite a neighboring Han realm to send troops to your aid"
 hd_yiguan_jubing_qiyi_decision_confirm:0 "Raise the banner of righteousness!"
 hd_yiguan_qiyi_liege_hu_tt:0 "Your top liege is Hu (Sinicized dynasties do not count)"
 hd_yiguan_qiyi_direct_vassal_tt:0 "You will first leave your direct liege and become a direct vassal of your Hu top liege, then immediately break with them"
 hd_yiguan_qiyi_not_at_war_tt:0 "You are not at war with your liege"
 hd_yiguan_qiyi_one_war_tt:0 "Neither your liege nor your top liege is currently fighting another Righteous Uprising, Raise Rebellion or Return North in Arms war"
 hd_yiguan_jubing_qiyi_decision_effect_tt:0 "Wage a #V Raise Rebellion#! war against [hd_yiguan_qy_def.GetShortUIName]; if victorious, gain full independence"
 hd_yiguan_jubing_qiyi_decision_army_tt:0 "Gain a rebel army of #V [GetPlayer.MakeScope.ScriptValue('hd_yiguan_qiyi_army_value')|0]#! men (500 + 100 per directly held county, up to 3,000; not inheritable)"
 hd_yiguan_jubing_qiyi_decision_help_tt:0 "Invite the strongest Han realm bordering you to send troops to your aid"

 ############################
 # Decision: Gather Refugees
 ############################
 hd_yiguan_zhaoji_liumin_decision:0 "Gather Refugees"
 hd_yiguan_zhaoji_liumin_decision_desc:0 "The northern lands lie in ruin, and refugees wander the roads with their old and young in tow. If we open the granaries, grant them fields and invite them to settle, we can fill our household registers and enroll them as troops besides.\n\n#weak 5-year cooldown. A victorious Campaign to Recover the North grants one additional free use.#!"
 hd_yiguan_zhaoji_liumin_decision_tooltip:0 "Take in refugees: directly held counties gain 'Refugees Flock In', and you gain an inheritable refugee army"
 hd_yiguan_zhaoji_liumin_decision_confirm:0 "Open the granaries and welcome them"
 hd_yiguan_zhaoji_liumin_decision_effect_tt:0 "#V [GetPlayer.MakeScope.ScriptValue('hd_yiguan_liumin_level_value')|0]#! directly held counties (lowest development first) gain 'Refugees Flock In' for 10 years (+20% development growth, +10% levies)"
 hd_yiguan_zhaoji_liumin_decision_army_tt:0 "Gain a refugee army of #V [GetPlayer.MakeScope.ScriptValue('hd_yiguan_liumin_army_value')|0]#! men (600 per prestige level; inheritable)"

 ############################
 # Decision: Submit to the Southern Court
 ############################
 hd_yiguan_guifu_nanchao_decision:0 "Submit to the Southern Court"
 hd_yiguan_guifu_nanchao_decision_desc:0 "Our lone city hangs amid the dust of Hu horsemen and cannot hold out alone for long. The Southern Court still upholds the rightful succession; if we send a memorial and declare ourselves its vassal, we gain both support and an unblemished name."
 hd_yiguan_guifu_nanchao_decision_tooltip:0 "Swear fealty to a bordering Southern Regime of higher rank"
 hd_yiguan_guifu_nanchao_decision_confirm:0 "Send the memorial and become a vassal"
 hd_yiguan_guifu_not_at_war_tt:0 "You are not currently at war"
 hd_yiguan_guifu_no_lord_tt:0 "There is a Southern Regime that borders you, holds a higher actual rank than you, and is not at war with you"
 hd_yiguan_guifu_nanchao_decision_effect_tt:0 "Swear fealty to [hd_yiguan_gf_lord.GetShortUIName] and become their vassal; they need not consent and will only be notified"

 ############################
 # Decision: Return to the Old Capital (keys moved over from the old localization)
 ############################
 hd_yiguan_return_capital_decision:0 "Return to the Old Capital"
 hd_yiguan_return_capital_decision_desc:0 "The old capital has been recovered, and the ancestral temples and tombs all lie in the north. Only by returning to the old capital can we console our ancestors and show the realm where legitimacy rests."
 hd_yiguan_return_capital_decision_tooltip:0 "Move the capital to Luoyang or Chang'an"
 hd_yiguan_return_capital_decision_confirm:0 "Return to the old capital!"
 hd_yiguan_return_capital_hold_tt:0 "You must directly hold Luoyang or Chang'an"
 hd_yiguan_return_capital_already_tt:0 "Your capital is not yet in Luoyang or Chang'an"

 ############################
 # Event 4101: Plea for Aid from the Rebels
 ############################
 hd_yiguan.4101.t:0 "Banners Raised in the North"
 hd_yiguan.4101.desc:0 "The envoy of [hd_yiguan_qy_rebel.GetTitledFirstName] arrived in the night, the dust of the north still on his clothes. He reports that his lord has raised troops at [hd_yiguan_qy_rebel.GetPrimaryTitle.GetBaseName] and no longer obeys the commands of [hd_yiguan_qy_def.GetShortUIName]. Hu horsemen are now massing beneath the walls and the rebels cannot hold alone; he begs you to send troops, so that you and the righteous army may strike together from front and rear.\n\nYour generals are divided. Some say that when the lips are gone the teeth grow cold: should the rebels fall, the Hu will come for you next. Others say that arms are instruments of ill omen, and pulling another's chestnuts from the fire may not be worth the cost. The envoy stays prostrate on the ground, waiting only for your word."
 hd_yiguan.4101.a:0 "Duty allows no refusal. Send troops to their aid!"
 hd_yiguan.4101.a.tt:0 "You join the rebellion of [hd_yiguan_qy_rebel.GetShortUIName] on the attacking side"
 hd_yiguan.4101.b:0 "The time is not yet right. Hold the troops back."

 ############################
 # Event 4110: Submit to the Southern Court, receiving the submission
 ############################
 hd_yiguan.4110.t:0 "Northerners Come Over"
 hd_yiguan.4110.desc:0 "The memorial of [hd_yiguan_gf_vassal.GetTitledFirstName] has arrived. Having held out alone in the north for years, with Hu horsemen on every side, the sender now presents the registers of land and people and offers to serve as a bulwark under your command.\n\nSome at court say the northerners are fickle and not to be trusted lightly; others say these are the old lands of the north, and through this they may return to the realm. At the end of the memorial is written: 'May the royal army soon march north; your servant will take up the whip and ride in the vanguard.'"
 hd_yiguan.4110.a:0 "Reply with a gracious edict, to show our care for those afar."
 hd_yiguan.4110.a.tt:0 "[hd_yiguan_gf_vassal.GetShortUIName] has become your vassal"
