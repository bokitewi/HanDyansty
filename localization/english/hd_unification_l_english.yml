l_english:
 HD_UNIFICATION_REGIONAL_CB_NAME:0 "Unify the Realm"
 HD_UNIFICATION_REGIONAL_WAR_NAME:0 "War to Unify the Realm"
 HD_UNIFICATION_REGIONAL_WAR_NAME_BASE:0 "Unification of the Realm"
 HD_UNIFICATION_FULL_CB_NAME:0 "Unification"
 HD_UNIFICATION_FULL_WAR_NAME:0 "War of Unification"
 HD_UNIFICATION_FULL_WAR_NAME_BASE:0 "Unification"
 HD_UNIFICATION_FULL_VICTORY:0 "The attacker takes every political title personally held by the defending ruler and incorporates the entire vassal hierarchy. This includes any actually held hegemony and personally held titles outside de jure China. Noble-family titles, allies, tributaries and uninvolved third parties are not annexed."
 HD_UNIFICATION_WHITE_PEACE:0 "Both sides lay down their arms and retain their lands; the attacker loses a small amount of Prestige."
 HD_UNIFICATION_DEFEAT:0 "The attacker returns in defeat, pays reparations to the defender, and loses both Prestige and Legitimacy. The defender's renown rises greatly."
 HD_UNIFICATION_REGIONAL_INVALIDATED:0 "The attacker is no longer an independent Celestial ruler holding land in China, or none of the defender's lands within the target area can be taken."
 HD_UNIFICATION_FULL_INVALIDATED:0 "The attacker no longer qualifies as an independent empire-tier or higher ruler, either side no longer holds de jure Chinese land, or the defender is no longer independent."
