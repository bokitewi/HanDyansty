l_english:
 HD_UNIFICATION_REGIONAL_CB_NAME:0 "Reunify All Under Heaven"
 HD_UNIFICATION_REGIONAL_WAR_NAME:0 "War to Reunify All Under Heaven"
 HD_UNIFICATION_REGIONAL_WAR_NAME_BASE:0 "Reunification"
 HD_UNIFICATION_FULL_CB_NAME:0 "Unification"
 HD_UNIFICATION_FULL_WAR_NAME:0 "War of Unification"
 HD_UNIFICATION_FULL_WAR_NAME_BASE:0 "Unification"
 HD_UNIFICATION_FULL_VICTORY:0 "The attacker takes every political title personally held by the defending ruler and incorporates the entire vassal hierarchy. This includes any actually held hegemony and personally held titles outside de jure China. Noble-family titles, allies, tributaries and uninvolved third parties are not annexed."
 HD_UNIFICATION_WHITE_PEACE:0 "Both sides retain their titles and vassals. The attacker loses a small amount of prestige and the usual truce applies."
 HD_UNIFICATION_DEFEAT:0 "Both sides retain their titles and vassals. The attacker loses prestige and legitimacy and pays reparations; the defender gains prestige. The usual truce applies."
 HD_UNIFICATION_REGIONAL_INVALIDATED:0 "The attacker is no longer an independent celestial ruler with de jure Chinese land, or the war targets contain no valid de jure Chinese land held by the defender."
 HD_UNIFICATION_FULL_INVALIDATED:0 "The attacker no longer qualifies as an independent empire-tier or higher ruler, either side no longer holds de jure Chinese land, or the defender is no longer independent."
