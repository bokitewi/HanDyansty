 TK_20_88_HeXianXiKuang1Ji: "Hexian Tin Mine Level I"
 building_TK_20_88_HeXianXiKuang1Ji: "$TK_20_88_HeXianXiKuang1Ji$"
 building_TK_20_88_HeXianXiKuang1Ji_desc: "Mountains surround Linhe County in Cangwu Commandery, concealing tin deposits. The He River flows below the city, leading south downstream to the commandery seat at Guangxin. At present, only a few shallow pits have been opened, with scarcely any furnaces."
