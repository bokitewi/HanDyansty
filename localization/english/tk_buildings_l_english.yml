 building_type_TK_20_85_HeTianYuShiKuang1Ji: "Jade Mine"
 building_type_TK_20_85_HeTianYuShiKuang1Ji_desc: "Fine jade is mined from the mountains and carved into ritual tablets, discs, and ornaments. Gentlemen compare its qualities to moral virtue, and it has been treasured since antiquity."
 TK_20_85_HeTianYuShiKuang1Ji: "Hetian Jade Mine Level 1"
 building_TK_20_85_HeTianYuShiKuang1Ji: "$TK_20_85_HeTianYuShiKuang1Ji$"
 building_TK_20_85_HeTianYuShiKuang1Ji_desc: "Beneath the great mountains south of Khotan, rivers yield abundant fine jade. Under Emperor Xiaowu, Han envoys explored the river's sources and brought jade back from this region. After consulting ancient maps and books, the Son of Heaven named the mountains that yielded it Kunlun. At present, only a few jade gatherers visit the area."
