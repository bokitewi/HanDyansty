 building_TK_20_85_HeTianYuShiKuang1Ji_desc: "Hetian Jade Mine: One of the four famous jades in China, traditionally referring specifically to jade produced in the Hetian region of Xinjiang, renowned for its \"Zi\" material; broadly speaking, Hetian jade refers to nephrite. Although named after Hetian, Xinjiang, it is not a geographical concept but rather a product category name. Primary-scale jade mine."
