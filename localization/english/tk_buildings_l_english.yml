 building_type_TK_20_87_WanShanZhuShaKuang1Ji: "Cinnabar Mine"
 building_type_TK_20_87_WanShanZhuShaKuang1Ji_desc: "Cinnabar Mine"
 TK_20_87_WanShanZhuShaKuang1Ji: "Wanshan Cinnabar Mine Level 1"
 building_TK_20_87_WanShanZhuShaKuang1Ji: "$TK_20_87_WanShanZhuShaKuang1Ji$"
 building_TK_20_87_WanShanZhuShaKuang1Ji_desc: "Wanshan Cinnabar Mine: Mining began during the Qin and Han dynasties, with over two thousand years of history in the extraction and smelting of mercury. The Wanshan mercury mine was once China's largest industrial production base for mercury; its reserves and output ranked first nationwide, second in Asia, and third globally, earning it the prestigious title \"Capital of Mercury in China.\" The cinnabar tribute presented by Ba Gu Funiang to Qin Shi Huang during the Qin dynasty most likely originated from this location. Primary-scale cinnabar mine."
