 building_TK_20_87_YuanLingZhuShaKuang1Ji_desc: "Yuanling Cinnabar Mine: Also known as Chenzhou Sand, abbreviated as Chen Sand. The name \"Chen Sand\" originates from its ancient primary production area, Chenzhou (now including Yuanling in Hunan Province), due to the superior quality of cinnabar found there; it gradually became a universally recognized mineral name across the nation. Primary-scale cinnabar mine."
