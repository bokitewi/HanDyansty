 building_TK_20_81_LinQiongTieKuang3Ji_desc: "When Qin defeated Zhao, the Zhuo clan of Zhao was relocated to Linqiong in Shu Commandery. Finding an iron-bearing mountain there, they set up smelting and casting works, employed as many as a thousand servants, and became the richest family in the area. The court later established an iron office at Linqiong. The story of Wenjun, daughter of Zhuo Wangsun, serving wine at a tavern is still told locally. Pits and smelting works stand within sight of one another. Workers gather in great numbers, and the furnaces burn day and night."
