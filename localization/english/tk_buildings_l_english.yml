 building_type_TK_20_81_WanChengTieKuang1Ji: "Iron Mine"
 building_type_TK_20_81_WanChengTieKuang1Ji_desc: "Rock is cut from the mountains and smelted in furnaces. The iron is cast into plows, hoes, knives, and halberds, under the supervision of an iron office established by the authorities."
 TK_20_81_WanChengTieKuang1Ji: "Wancheng Iron Mine Level 1"
 building_TK_20_81_WanChengTieKuang1Ji: "$TK_20_81_WanChengTieKuang1Ji$"
 building_TK_20_81_WanChengTieKuang1Ji_desc: "Wancheng, the seat of Nanyang Commandery, has long been famed for ironworking. The people of Chu cast spears from its steel, as sharp as the stings of bees and scorpions. Under the Qin, the Kong clan from Liang settled here and grew enormously wealthy through smelting and casting. The court now also maintains an iron office in Wancheng. At present, only a few shallow pits have been opened, with scarcely any furnaces."
