 building_TK_20_81_DaYeTieKuang1Ji: "$TK_20_81_DaYeTieKuang1Ji$"
 building_TK_20_81_DaYeTieKuang1Ji_desc: "Daye Iron Mine: Extraction began in the fifth year of Huangwu during the Three Kingdoms period under Wu (AD 226), spanning over 1,700 years. Here, Sun Quan, the Great Emperor of Wu, forged swords and knives; Yang Guang, the tyrant emperor of Sui, cast coins; Yue Fei of the Song Dynasty also cast swords here. Modern extraction at Daye Iron Mine has ultimately created the magnificent sight known as \"Asia's Largest Mining Pit.\" Primary iron ore deposit scale."
