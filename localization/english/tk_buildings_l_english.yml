 building_TK_20_86_MoGuBaoShiKuang1Ji: "$TK_20_86_MoGuBaoShiKuang1Ji$"
 building_TK_20_86_MoGuBaoShiKuang1Ji_desc: "Mogok Gem Mine: Located northeast of Mandalay, composed of multiple valley towns with a gem mining history spanning centuries. The \"King of Mogok\" ruby refers to raw rubies from the Mogok region in Myanmar. Mogok is renowned for its marble-type deposits; the host rock containing rubies consists of the contact zone between marble and granitic syenite. The \"Pigeon's Blood\" rubies produced here belong to the Vivid Red grade, displaying hues ranging from rose-red to red, and featuring a flowing, vortex-like \"honeycomb\" structure. Primary jade mine scale."
