 building_TK_20_83_ZuoDuJinKuang1Ji_desc: "Satsuma Gold Mine: Satsuma Province was one of the ancient provinces in Japan, covering the entire area of Sado Island in present-day Niigata Prefecture. First recorded in the fourth year of Emperor Monmu (700 AD), it originally belonged to Echigo Province and was transferred to the jurisdiction of Echigo-no-Kuni in 743 AD, officially established as a separate province in 752 AD. The province was divided into three districts: Hamo, Zatai, and Kamoko, and is renowned for its gold and silver mines such as Sado Gold Mine, Otsu Silver Mine, and Tsuruko Silver Mine. Its main products include gold, silver, copper, and agate. This is a primary-scale gold mine."
