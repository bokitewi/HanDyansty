 building_TK_20_85_LanTianYuShiKuang4Ji_desc: "Lantian Jade Mine: One of China's Four Famous Jades, renowned for the epithet \"Jade of Lantian.\" Among the earliest jades developed and utilized in China, the name \"Lantian Jade\" derives from its origin at Lantian Mountain near Xi'an, Shaanxi Province. The famous Qin Shi Huang's Imperial Seal was crafted from Lantian Water Azure Jade. A top-tier jade mine of significant scale."
