 building_type_TK_20_81_WuAnTieKuang1Ji: "Iron Mine"
 building_type_TK_20_81_WuAnTieKuang1Ji_desc: "Rock is cut from the mountains and smelted in furnaces. The iron is cast into plows, hoes, knives, and halberds, under the supervision of an iron office established by the authorities."
 TK_20_81_WuAnTieKuang1Ji: "Wu'an Iron Mine Level 1"
 building_TK_20_81_WuAnTieKuang1Ji: "$TK_20_81_WuAnTieKuang1Ji$"
 building_TK_20_81_WuAnTieKuang1Ji_desc: "Wu'an County in Wei Commandery lies against the Taihang Mountains to the west, where iron ore is abundant. Zhao was already smelting iron here during the Warring States period, and Emperor Xiaowu established an iron office here. At present, only a few shallow pits have been opened, with scarcely any furnaces."
