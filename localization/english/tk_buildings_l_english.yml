 TK_20_82_ShaoGuanYinKuang1Ji: "Shaoguan Silver Mine Level 1"
 building_TK_20_82_ShaoGuanYinKuang1Ji: "$TK_20_82_ShaoGuanYinKuang1Ji$"
 building_TK_20_82_ShaoGuanYinKuang1Ji_desc: "Shaoguan Silver Mine: In the early years of Emperor Wen of Liu Song, the Shixing Commandery administered over more than 300 households of silver miners, exclusively engaged in mining operations. According to \"Shixing Ji\": \"To the northwest of Lingjun lies a small mountain called Shoushan. In the summer of the first year of Yuanjia under Emperor Yuan of Song, heavy rains caused a landslide from peak to foot; where it collapsed, there shone a brilliance resembling stars and constellations. When residents went to observe, they found molten silver—thus casting silver was achieved.\" This represents a primary-scale silver mine."
