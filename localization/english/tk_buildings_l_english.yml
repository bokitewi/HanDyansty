 building_type_TK_20_88_HeXianXiKuang1Ji_desc: "Tin Ore"
 TK_20_88_HeXianXiKuang1Ji: "Hexian Tin Mine Level I"
 building_TK_20_88_HeXianXiKuang1Ji: "$TK_20_88_HeXianXiKuang1Ji$"
 building_TK_20_88_HeXianXiKuang1Ji_desc: "He County Tin Mine: Refers to the tin mine located in Hezhou. During the Western Han Dynasty, large-scale mining of tin in Hezhou had already begun. By the Tang Dynasty, \"He\" in Hezhou had become synonymous with tin. In the Song Dynasty, the average annual amount of tin transported from Hezhou for coin casting accounted for 62% of the national total. It can be said that at that time, without the supply of tin from Hezhou, the entire country would have no money to use. Primary-scale tin mine."
