 TK_20_83_ZuoDuJinKuang1Ji: "Zado Gold Mine Level 1"
 building_TK_20_83_ZuoDuJinKuang1Ji: "$TK_20_83_ZuoDuJinKuang1Ji$"
 building_TK_20_83_ZuoDuJinKuang1Ji_desc: "A large island lies in the sea north of the Wa lands, separated from the mainland by a strait of strong winds and high waves. Rolling mountains cover the island, with gold and silver hidden among their rocks. At present, only a few scattered mining households wash for gold here, finding little."
