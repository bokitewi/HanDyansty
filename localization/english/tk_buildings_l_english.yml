 building_TK_20_83_BoNanJinKuang1Ji_desc: "Bonan County in Yongchang Commandery was established under Emperor Xiaoming. Gold lies in the sands of the Lancang River to its south. Travelers face a dangerous journey over Mount Bonan and across the river, remembered in a local song: Cross Bonan, pass Lanjin, cross Lancang, all for another's sake. At present, only a few scattered mining households wash for gold here, finding little."
