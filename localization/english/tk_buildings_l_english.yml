 building_TK_20_81_GongXianTieKuang1Ji_desc: "The iron mine in Gong County corresponds to the ancient iron smelting site at Tieshenggou, Jiajin Kou Town, Gongyi City, Zhengzhou. This iron smelting facility can be traced back to the Han Dynasty. Excavated iron artifacts bear the inscription \"He San,\" where \"He\" refers to Henan, indicating that there were at least three large-scale iron smelting sites in the Henan region during the Han Dynasty, with Tieshenggou being the iron ore source corresponding to the third site, He San. The scale of the primary iron mine is as follows."
