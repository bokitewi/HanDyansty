 building_type_TK_20_84_ZiGongJingYan1Ji: "Salt Mine"
 building_type_TK_20_84_ZiGongJingYan1Ji_desc: "Salt is indispensable in everyday life. Brine is drawn from wells, seawater is boiled, and salt pools are dried in the sun. The authorities have long prized the rich profits of salt production."
 TK_20_84_ZiGongJingYan1Ji: "Zigong Well Salt Level I"
 building_TK_20_84_ZiGongJingYan1Ji: "$TK_20_84_ZiGongJingYan1Ji$"
 building_TK_20_84_ZiGongJingYan1Ji_desc: "Saline springs are common in the mountains of Jiangyang County in Qianwei Commandery. Local people dig wells to draw brine and boil it over stoves into salt. The practice of obtaining salt from wells in Shu is traditionally traced to Li Bing, governor of Shu under the Qin. At present, only a few salt-producing households work here, yielding just enough for the nearby settlements."
