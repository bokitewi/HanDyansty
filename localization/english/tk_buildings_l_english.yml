 building_TK_20_86_KeShiMiErBaoShiKuang1Ji_desc: "Kashmir Gem Mine: Also known as \"Cornflower\" Sapphires, this rare gemstone variety originates from the Zaskar Mountains in Kashmir, India. Due to depleted veins, it is now primarily found in museums and private collections. Its color displays a rich, velvety blue with a slight purple hue, featuring snowflake-like inclusions and milky white bands that create a unique velvet texture. With a Mohs hardness of 9, it is paired with rubies as the \"Sister Gemstones.\" Primary jade mine scale."
