 building_type_TK_20_87_WanShanZhuShaKuang1Ji: "Cinnabar Mine"
 building_type_TK_20_87_WanShanZhuShaKuang1Ji_desc: "Cinnabar is as red as blood and can be used in medicine and as a pigment. Alchemists prize it above all for preparing their elixirs."
 TK_20_87_WanShanZhuShaKuang1Ji: "Wanshan Cinnabar Mine Level 1"
 building_TK_20_87_WanShanZhuShaKuang1Ji: "$TK_20_87_WanShanZhuShaKuang1Ji$"
 building_TK_20_87_WanShanZhuShaKuang1Ji_desc: "Deep in the mountains southwest of Wuling Commandery lie rich cinnabar veins, which local people mine through excavated pits. The Grand Historian records that the ancestors of Qing, a widow of Ba and Shu, acquired cinnabar mines whose profits remained in their hands for generations. Some say those mines lay among these mountains. At present, only a few cinnabar pits have been opened, yielding little."
