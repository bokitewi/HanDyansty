 building_TK_20_87_WanShanZhuShaKuang3Ji_desc: "Wanshan Cinnabar Mine: Mining began during the Qin and Han dynasties, with a history of cinnabar ore extraction and smelting spanning over two millennia. The Wanshan mercury mine was once China's largest industrial production base for mercury; its reserves and output ranked first nationwide, second in Asia, and third globally, earning it the prestigious title \"Capital of Mercury in China.\" The cinnabar tribute presented by Ba Gu Funiang Qing to Qin Shi Huang during the Qin dynasty most likely originated from this location. Advanced-scale cinnabar mine facility."
