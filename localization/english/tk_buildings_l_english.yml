 building_TK_20_84_YanChengHaiYan3Ji_desc: "Yancheng Haiyan: Yancheng was formerly known as \"Yandu.\" In the sixth year of Emperor Gao of the Western Han Dynasty (201 BC), Yandu County was established. In the ninth year of Yixi during the reign of Emperor An of the Eastern Jin Dynasty (413 AD), it was renamed Yancheng County. The city derives its name from salt production, with fortifications built around salt boiling operations and development driven by the Salt Transport River. Salt produced in the two Huai regions became known as Huaiyan. In the grand millennium-long history of salt industry, Huaiyan earned the reputation of \"the profits from boiling the sea outweigh those of Southeast China, with the two Huai being preeminent.\" People further described its status in ancient salt history with the saying, \"When Huaiyan emerges, all under heaven turns salty.\" Advanced scale of salt mines."
