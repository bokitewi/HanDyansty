 TK_20_83_JinShanJinKuang1Ji: "Jinshan Gold Mine Level 1"
 building_TK_20_83_JinShanJinKuang1Ji: "$TK_20_83_JinShanJinKuang1Ji$"
 building_TK_20_83_JinShanJinKuang1Ji_desc: "On the northern edge of Guanghan Commandery, Mount Jin stretches for seven or eight li. After long summer rains, its slopes often collapse, scattering gold grains like millet among the fallen earth. Local people compete to gather them. At present, only a few scattered mining households wash for gold here, finding little."
