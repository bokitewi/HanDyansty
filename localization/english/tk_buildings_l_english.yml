 building_TK_20_88_YunXiXiKuang1Ji_desc: "Xi County in Hanzhong Commandery takes its name from its mountain tin deposits; under Wang Mang it was renamed Xizhi. Tin pits follow the mountain gullies, and tradition says that mining here began in the Yin and Shang period. At present, only a few shallow pits have been opened, with scarcely any furnaces."
