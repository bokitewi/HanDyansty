 building_TK_20_80_TongLvShanKuang1Ji: "$TK_20_80_TongLvShanKuang1Ji$"
 building_TK_20_80_TongLvShanKuang1Ji_desc: "In E County of Jiangxia Commandery stands a small hill whose slopes show flecks of copper-green after heavy rain, giving Tonglushan its name. Ancient mining shafts and smelting slag abound, and local elders say that copper was already mined here in the Yin and Zhou periods. At present, only a few shallow pits have been opened, with scarcely any furnaces."
