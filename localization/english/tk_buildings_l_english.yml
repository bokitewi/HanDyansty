 building_TK_20_84_WuXiBaYan4Ji_desc: "Wuxi Ba Salt: Baoyuan Mountain is China's earliest known salt spring, with a history spanning 5,000 years. In ancient times, natural salt springs in the Yudu and Exi regions included Baoyuan Mountain in Wuxi, Chongqing; Yunshan and Funiu Mountains in Pengshui; and Qingjiang in Changyang, Hubei—three major natural salt springs whose output was known as Ba Salt or Yanba. Prior to Li Bing, Administrator of the Shu Commandery under the Qin State, who oversaw the invention of deep-well brine extraction technology, table salt across the entire Hanzhong Basin, Two-Lakes Basin, Sichuan Basin, Wuling Mountain Range, Wumeng Mountain Range, and Yunnan-Guizhou Plateau was primarily supplied by Ba Salt. A top-tier salt mine of grand scale."
