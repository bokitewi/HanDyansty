 building_TK_20_83_JiaoDongJinKuang1Ji_desc: "Jiaodong Gold Mine: Records of smelting and refining existed during the Tang Dynasty, with significant development in the Song Dynasty. The \"Song Shi · Shi Huo Zhi\" states: \"During the Tian Sheng era, gold was mined in Deng and Lai provinces, yielding several thousand taels annually.\" By the Yuan Feng period of the Song Dynasty, the combined gold output of only Deng and Lai provinces accounted for 89.4% of the nation's total gold production. Primary-scale gold mine."
