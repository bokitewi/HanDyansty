 building_TK_20_83_JinShanJinKuang1Ji_desc: "Jinshan Gold Mine: A placer gold deposit (alluvial gold-bearing sand). According to the \"Yizhou Ji\" by Li Ying of the Southern Dynasties: \"Jinshan spans seven or eight li; during summer floods, sections collapse, releasing scattered grains of gold.\" Jinshan is believed to be located three li north of Guangyuan City, Sichuan Province. This is a primary-scale gold mine."
