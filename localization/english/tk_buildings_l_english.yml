 TK_20_84_HeDongChiYan1Ji: "He Dong Salt Pond Level 1"
 building_TK_20_84_HeDongChiYan1Ji: "$TK_20_84_HeDongChiYan1Ji$"
 building_TK_20_84_HeDongChiYan1Ji_desc: "Southwest of Anyi in Hedong Commandery lies a great salt pool stretching for dozens of li, its water bitter and saline. When southern winds blow in summer, salt crystallizes on its surface without boiling. The court maintains a salt office at Anyi to oversee it. At present, only a few salt-producing households work here, yielding just enough for the nearby settlements."
