 building_TK_20_81_LiaoDongTieKuang1Ji_desc: "Iron Mine of Liaodong: Emperor Wu of Han established 48 Iron Offices across the empire in commanderies and counties where iron ore was produced, each overseeing smelting workshops to organize mining, smelting, and casting of ironware. Among these 48 smelting workshops, one was located in Liaodong Commandery at Pingguo County, situated in today's Xiongyue Town, Bayuquan District, Yingkou City. This represents a primary-scale iron mine."
