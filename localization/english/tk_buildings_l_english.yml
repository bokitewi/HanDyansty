 TK_20_83_BoNanJinKuang1Ji: "Bongnan Gold Mine Level 1"
 building_TK_20_83_BoNanJinKuang1Ji: "$TK_20_83_BoNanJinKuang1Ji$"
 building_TK_20_83_BoNanJinKuang1Ji_desc: "Bongnan Gold Mine: Alluvial gold (gold-bearing sand from river currents). According to the \"Book of Later Han · Treatise on Commanderies and Kingdoms,\" Yongchang Commandery: Bongnan, \"Established during Emperor Ming's Yungping reign; gold is produced in its southern border.\" The administrative seat of Bongs County was located southwest of present-day Yongping County, Yunnan. The gold found along the riverbanks in the sand refers to alluvial gold in the Lancang River today. This is a primary-scale gold mine."
