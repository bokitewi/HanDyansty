 building_TK_20_87_YuanLingZhuShaKuang1Ji_desc: "Yuanling County in Wuling Commandery lies beside the Yuan River. Its mountain cinnabar is bright red and gleams like a mirror, long counted among the finest. Alchemists seek it for their elixirs, while painters use it for color. At present, only a few cinnabar pits have been opened, yielding little."
