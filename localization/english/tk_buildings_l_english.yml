 building_TK_20_85_XiuYanYuShiKuang4Ji_desc: "Xiuyan Jade Mine: Also known as serpentine jade, one of China's four famous jades. Named after its origin in Xiuyan, Liaoning Province, the earliest recorded name for this jade appears in the Western Han Dynasty text \"Erya\": \"Among the beauties of the east, there is the Xunxu Qi of Yiwulu.\" The recognition and development of Xiuyan jade in China span over 8,000 years. Its products have been produced continuously from the Neolithic period through the Ming and Qing dynasties, consistently making it the leading producer and most widely used medium-to-low grade jade in China. Top-tier jade mine scale."
 building_type_TK_20_85_DuShanYuShiKuang1Ji: "Jade Mine"
 building_type_TK_20_85_DuShanYuShiKuang1Ji_desc: "Jade Mine"
 TK_20_85_DuShanYuShiKuang1Ji: "Dushan Jade Mine Level 1"
 building_TK_20_85_DuShanYuShiKuang1Ji: "$TK_20_85_DuShanYuShiKuang1Ji$"
 building_TK_20_85_DuShanYuShiKuang1Ji_desc: "Dushan Jade Mine: Also known as \"Nanyang Jade,\" \"Henan Jade,\" or \"Duyu,\" it is one of China's Four Famous Jades and is referred to as Nanyang Jadeite. In Zhang Heng's *Nandu Fu* from the Eastern Han Dynasty: \"Among its treasures and rare wonders are golden lustered jade raw stones, pearls glowing in the night, precious delicacies and jade pendants filling the round earth; carved and polished with brilliance, gold and jade shine like a forest of bells.\" The *Book of Han* records that Shagangdian at the foot of Dushan was then known nationwide as \"Jade Street Temple,\" serving as a hub for the production, sales, and trade of Nanyang jade carvings; these ancient texts all record that from the pre-Qin period to the Han Dynasty, it was a prized gem among jades. Primary-scale jade mine."
 building_type_TK_20_85_DuShanYuShiKuang2Ji: "Jade Mine"
