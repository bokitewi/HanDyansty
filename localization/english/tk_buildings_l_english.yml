 TK_20_84_WuXiBaYan1Ji: "Wuxi Ba Salt Level I"
 building_TK_20_84_WuXiBaYan1Ji: "$TK_20_84_WuXiBaYan1Ji$"
 building_TK_20_84_WuXiBaYan1Ji_desc: "Wuxi Ba Salt: Baoyuan Mountain is the earliest known salt spring in China, with a history spanning 5,000 years. In ancient times, natural salt springs in the Yudu and Exi regions included Baoyuan Mountain in Wuxi, Chongqing; Yunshan and Funiu Mountains in Pengshui; and Qingjiang's three major natural salt springs in Changyang, Hubei. The salt produced was known as Ba Salt or Yanba. Before Li Bing, Administrator of the Shu Commandery of the Qin State, oversaw the invention of deep-well brine extraction technology, table salt across the entire Hanzhong Basin, Two-Lakes Basin, Sichuan Basin, Wuling Mountain Range, Wumeng Mountain Range, and the Guizhou-Yunnan Plateau was primarily supplied by Ba Salt. Primary-scale salt mining operations."
