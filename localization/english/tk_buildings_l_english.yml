 building_type_TK_20_83_HanZhongShaJinKuang1Ji_desc: "Gold Mine"
 TK_20_83_HanZhongShaJinKuang1Ji: "Sand Gold Mine in Hanzhong Level I"
 building_TK_20_83_HanZhongShaJinKuang1Ji: "$TK_20_83_HanZhongShaJinKuang1Ji$"
 building_TK_20_83_HanZhongShaJinKuang1Ji_desc: "Hanzhong Alluvial Gold Mine: Classified as alluvial gold (gold extracted from riverbed sand). According to the \"Wei Shu · Shi Huo Zhi\": \"In Hanzhong, there were formerly over a thousand households dedicated to mining; they regularly panned for gold in the sands of the Han River and submitted their output at year's end. Later, Prince Linhuai, serving as Inspector of Liangzhou, petitioned to discontinue this practice.\" This indicates that by the late Eastern Han and Three Kingdoms period, Hanzhong already possessed specialized organizations for gold panning. Primary-scale gold mine."
