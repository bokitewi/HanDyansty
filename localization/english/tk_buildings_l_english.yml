 TK_20_81_TangXiTieKuang1Ji: "Tangxi Iron Mine Level 1"
 building_TK_20_81_TangXiTieKuang1Ji: "$TK_20_81_TangXiTieKuang1Ji$"
 building_TK_20_81_TangXiTieKuang1Ji_desc: "Tangxi in Xiping County of Runan Commandery was a swordmaking center of the state of Han during the Warring States period. Persuading the king of Han, Su Qin boasted that the soldiers' swords and halberds from Mingshan, Tangxi, and Moyang could cut through cattle and horses on land and strike swans and geese in water. The present court maintains an iron office at Xiping. At present, only a few shallow pits have been opened, with scarcely any furnaces."
