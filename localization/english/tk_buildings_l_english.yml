 building_TK_20_81_LinQiongTieKuang1Ji: "$TK_20_81_LinQiongTieKuang1Ji$"
 building_TK_20_81_LinQiongTieKuang1Ji_desc: "The iron ore deposits at Linqiong were smelted as early as the Spring and Autumn Period. According to \"Records of the Grand Historian: Treatise on Merchants,\" the family of Zhuo Wenjun originally engaged in iron smelting in the State of Zhao before Qin conquered Zhao. The Zhuo clan voluntarily petitioned to relocate to the fertile lands below Mount Wenshan, arriving at Linqiong where they \"beat and cast iron from the Iron Mountain,\" employing strategic planning to mobilize the people of Dian and Shu. During the Qin Dynasty, an Iron Official was established in the Shu Commandery; the Iron Mountain mentioned here refers to mining sites including those at Linqiong. Scale of primary iron ore deposits."
