 TK_20_83_HanZhongShaJinKuang4Ji: "Sand Gold Mine in Hanzhong Level IV"
 building_TK_20_83_HanZhongShaJinKuang4Ji: "$TK_20_83_HanZhongShaJinKuang4Ji$"
 building_TK_20_83_HanZhongShaJinKuang4Ji_desc: "The Han River flows through Hanzhong Commandery. Tiny gold grains lie among the sand on its bed and can be recovered by washing. Gold-mining households gather in great numbers, producing a steady flow of gold that brings great wealth to the region."
