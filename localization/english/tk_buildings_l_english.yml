 building_TK_20_84_HeDongChiYan1Ji: "$TK_20_84_HeDongChiYan1Ji$"
 building_TK_20_84_HeDongChiYan1Ji_desc: "Hebei Pool Salt: The history of Hebei Pool Salt dates back to ancient times, specifically to the era of the Yellow Emperor and Yan Di. As early as more than 5,000 years ago, our ancestors discovered and consumed salt at the Yuncheng Salt Lake. The ancient name for the Hebei Salt Pools was \"Bo Xie,\" so the salt from these pools was known as \"Jie Salt,\" earning it the prestigious title of \"Salt of Jie Liang\" throughout history. The production method of Hebei Pool Salt is unique, primarily relying on solar evaporation and wind action, making it the most labor-saving technique. Scale of primary salt mines."
