 building_type_TK_20_86_MoGuBaoShiKuang1Ji_desc: "Radiant stones are occasionally found among the mountain rocks. Cut and polished into objects, they are worth as much as gold and eagerly sought by nobles for their collections."
 TK_20_86_MoGuBaoShiKuang1Ji: "Mogok Gem Mine Level I"
 building_TK_20_86_MoGuBaoShiKuang1Ji: "$TK_20_86_MoGuBaoShiKuang1Ji$"
 building_TK_20_86_MoGuBaoShiKuang1Ji_desc: "Mountains crowd the kingdom of Shan, where gems as red as blood lie in the soil and rock of the valleys. Local people wash the sand and gravel of streams; whenever they find a stone, they cherish it as dearly as their lives. At present, only a few local people search here."
