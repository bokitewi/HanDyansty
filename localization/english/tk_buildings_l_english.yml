 building_type_TK_20_88_YunXiXiKuang1Ji: "Tin Ore"
 building_type_TK_20_88_YunXiXiKuang1Ji_desc: "Tin Ore"
 TK_20_88_YunXiXiKuang1Ji: "Yunxi Tin Ore Level I"
 building_TK_20_88_YunXiXiKuang1Ji: "$TK_20_88_YunXiXiKuang1Ji$"
 building_TK_20_88_YunXiXiKuang1Ji_desc: "Yunxi Tin Ore: According to the \"Book of Han · Treatise on Geography\" and expert research, prior to the Han Dynasty, tin ore deposits existed only in Shishi Mountain in present-day Yunnan, Bengu, and Yunxi in Hubei. Yunnan is too distant from Chaoge; thus, the Yunxi tin ore became a national resource. \"Mang called it Yin Zhi\" precisely because of the abundance of tin ore in Yunxi. The \"Yun County Gazetteer\" records Ma An's Tin Cave Gully, where mining began in the mid-Shang Dynasty and continued until 2010. Primary-scale tin ore deposits."
