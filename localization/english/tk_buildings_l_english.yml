 building_TK_20_84_ZiGongJingYan1Ji: "$TK_20_84_ZiGongJingYan1Ji$"
 building_TK_20_84_ZiGongJingYan1Ji_desc: "Zigong Well Salt: The history of well salt production in Zigong dates back to the Zhou and Qin dynasties, spanning over 2000 years. It was first excavated under the supervision of Li Bing, Administrator of Shu Commandery of the Qin Dynasty (in the area of present-day Shuangliu County), earning him the title \"Father of Well Salt.\" During the Eastern Han Dynasty, the landmark well salt mine \"Fushi Well\" emerged in Fushun County and continued production for over 1400 years. After the brine was exhausted during the Ming Dynasty, the Zigong and Gongjing regions rose to prominence, ultimately leading to the establishment of Zigong as a city in 1939. Scale of primary salt mines."
