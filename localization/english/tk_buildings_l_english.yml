 building_TK_20_86_KeShiMiErBaoShiKuang1Ji_desc: "Deep in the snowy mountains of northern Jibin, gems as blue as the sky lie among the cliffs, their rich color resembling velvet. Jibin is known for pearls, coral, and amber, but these blue stones are exceptionally rare. At present, only a few local people search here."
