 building_TK_20_84_YanChengHaiYan1Ji_desc: "Yandu County in Guangling Commandery borders the sea. Its tidal flats contain salt, which can be recovered by scraping the soil and washing it for brine or by boiling seawater. Canals dug to transport salt give the county its name. At present, only a few salt-producing households work here, yielding just enough for the nearby settlements."
