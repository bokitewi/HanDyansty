 building_type_TK_20_85_PaGanYuShiKuang1Ji: "Jade Mine"
 building_type_TK_20_85_PaGanYuShiKuang1Ji_desc: "Jade Mine"
 TK_20_85_PaGanYuShiKuang1Ji: "Bagan Jade Mine Level 1"
 building_TK_20_85_PaGanYuShiKuang1Ji: "$TK_20_85_PaGanYuShiKuang1Ji$"
 building_TK_20_85_PaGanYuShiKuang1Ji_desc: "Bagan Jade Mine: Located in the middle reaches of the Ulu River in Kachin State, northern Myanmar, this is an alluvial or residual-hill deposit and one of Myanmar's oldest jadeite-producing regions, with mining activities dating back to the first century AD. The mine is renowned for producing jadeite with strong grain texture and fine structure, particularly known for blue water jadeite and old oil-green varieties. The ore layer extends across five strata at a depth of approximately 30 meters; mountain stone roughs exhibit the highest quality in forms such as black sand and yellow salt sand, while water stones are predominantly found within sandy soil in gravel-like formations. A primary-scale jade mine."
