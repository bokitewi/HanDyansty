 TK_20_81_LinQiongTieKuang1Ji: "Linqing Iron Mine Level I"
 building_TK_20_81_LinQiongTieKuang1Ji: "$TK_20_81_LinQiongTieKuang1Ji$"
 building_TK_20_81_LinQiongTieKuang1Ji_desc: "When Qin defeated Zhao, the Zhuo clan of Zhao was relocated to Linqiong in Shu Commandery. Finding an iron-bearing mountain there, they set up smelting and casting works, employed as many as a thousand servants, and became the richest family in the area. The court later established an iron office at Linqiong. The story of Wenjun, daughter of Zhuo Wangsun, serving wine at a tavern is still told locally. At present, only a few shallow pits have been opened, with scarcely any furnaces."
