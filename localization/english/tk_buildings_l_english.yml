 building_TK_20_85_LanTianYuShiKuang1Ji_desc: "The mountains of Lantian County in Jingzhao yield fine jade with a warm luster, prized at court since the Qin. Celebrating Chang'an's rich resources in his Rhapsody on the Western Capital, Ban Gu singled out the fine jade of Lantian. At present, only a few jade gatherers visit the area."
