 building_TK_20_84_ShuoFangQingYan1Ji_desc: "Shuofang Green Salt: According to the \"Book of Han · Geography Treatise,\" Shuofang Commandery, Shuofang County: \"The Golden-Linked Salt Lake and the Green Salt Lake are both located to the south.\" The \"Water Classic · Notes on the Yellow River\" states: \"The 'Wei Land Record' says: (Shuofang) County has a large salt pond; its salt is large, greenish-white, named Green Salt, also known as Rong Salt, used in medicine. During the Han Dynasty, an official for managing salt was established here.\" This represents a primary-scale salt mine."
