 building_TK_20_81_JinChengTieKuang1Ji_desc: "The southern part of Shangdang Commandery is mountainous, with iron deposits hidden among the Taihang peaks. Smelting and casting around Yang'a have a long history. Local tradition tells of a famous ancient sword made here, renowned alongside Ganjiang and Moye. At present, only a few shallow pits have been opened, with scarcely any furnaces."
