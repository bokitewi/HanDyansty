 building_TK_20_83_LingYangJinKuang1Ji_desc: "The mountains of Lingyang County in Danyang Commandery yield gold long famed throughout Jiangdong. Tradition says the immortal Lingyang Ziming consumed medicinal clay before a white dragon came for him, and that he lived upon this mountain for more than a hundred years. At present, only a few scattered mining households wash for gold here, finding little."
