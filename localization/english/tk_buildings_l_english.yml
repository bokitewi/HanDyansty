l_english:

 #####三国新增建筑
 building_type_TK_20_10_WaHuangGong: "Tomb Ancestral Land"
 building_type_TK_20_10_WaHuangGong_desc: "Tomb Ancestral Land"
 TK_20_10_WaHuangGong: "Palace of the Mother Goddess"
 building_TK_20_10_WaHuangGong: "$TK_20_10_WaHuangGong$"
 building_TK_20_10_WaHuangGong_desc: "The Palace of the Goddess Nüwa is said to be the place where Nüwa molded clay to create humanity and forged stones to mend the sky. According to legend, the 18th day of the third lunar month marks Nüwa's birthday; in observance, the Palace of the Goddess Nüwa holds a temple fair from the first to the eighteenth day of the third lunar month."
 building_type_TK_20_10_FuXiMiao: "Tomb Ancestral Land"
 building_type_TK_20_10_FuXiMiao_desc: "Tomb Ancestral Land"
 TK_20_10_FuXiMiao: "Fuxi Temple"
 building_TK_20_10_FuXiMiao: "$TK_20_10_FuXiMiao$"
 building_TK_20_10_FuXiMiao_desc: "Originally named Taihao Palace, commonly known as the Temple of Renzong. It is said that the sixteenth day of the first lunar month marks the birthday of Fuxi; following tradition, people would visit the Fuxi Temple to \"pay homage to Renzong,\" which constitutes the temple fair at the Fuxi Temple."
 building_type_TK_20_10_HuangDiLing: "Tomb Ancestral Land"
 building_type_TK_20_10_HuangDiLing_desc: "Tomb Ancestral Land"
 TK_20_10_HuangDiLing: "Emperor Huangdi's Mausoleum"
 building_TK_20_10_HuangDiLing: "$TK_20_10_HuangDiLing$"
 building_TK_20_10_HuangDiLing_desc: "Anciently known as \"Qiaoling,\" it is the mausoleum of Huangdi, the Yellow Emperor, and serves as a place for emperors and famous figures throughout history to pay homage to him."
 building_type_TK_20_10_YanDiLing: "Tomb Ancestral Land"
 building_type_TK_20_10_YanDiLing_desc: "Tomb Ancestral Land"
 TK_20_10_YanDiLing: "Emperor Yan's Mausoleum"
 building_TK_20_10_YanDiLing: "$TK_20_10_YanDiLing$"
 building_TK_20_10_YanDiLing_desc: "The Yan Emperor's Mausoleum is the resting place of Yan Di, Shennong, the ancestor of the Chinese nation, and enjoys the reputation of being \"the First Mausoleum in Divine Land.\""
 building_type_TK_20_10_DaYuLing: "Tomb Ancestral Land"
 building_type_TK_20_10_DaYuLing_desc: "Tomb Ancestral Land"
 TK_20_10_DaYuLing: "Great Yu's Mausoleum"
 building_TK_20_10_DaYuLing: "$TK_20_10_DaYuLing$"
 building_TK_20_10_DaYuLing_desc: "Da Yu was a hero who tamed the waters in ancient times, the founder of China's first dynasty, the Xia Dynasty, and revered by posterity as \"the Ancestor Who Established the State.\" The Da Yu Mausoleum, formerly known as Yu Xue, is the burial site of Da Yu. The Da Yu Mausoleum consists of three parts: the mausoleum itself (Yu Ling), the ancestral hall (Yu Ci), and the temple (Yu Miao)."
 building_type_TK_20_10_MaZuMiao: "Tomb Ancestral Land"
 building_type_TK_20_10_MaZuMiao_desc: "Tomb Ancestral Land"
 TK_20_10_MaZuMiao: "Mazu Temple"
 building_TK_20_10_MaZuMiao: "$TK_20_10_MaZuMiao$"
 building_TK_20_10_MaZuMiao_desc: "The Mazu Temple, also known as the \"Meizhou Mazu Ancestral Temple,\" is located on Meizhou Island in Putian City, Fujian Province. It was first constructed in the fourth year of Yongxi during the Northern Song Dynasty (987 AD) and serves as the birthplace of Mazu culture."
 building_type_TK_20_10_DaHuaiShu: "Tomb Ancestral Land"
 building_type_TK_20_10_DaHuaiShu_desc: "Tomb Ancestral Land"
 TK_20_10_DaHuaiShu: "Great Locust Tree"
 building_TK_20_10_DaHuaiShu: "$TK_20_10_DaHuaiShu$"
 building_TK_20_10_DaHuaiShu_desc: "The regions of Jing-Jin-Yi, Lu-Yu, and Jiang-Huai have a folk song that has been sung for hundreds of years: \"Ask where my ancestors came from; it is the Great Locust Tree in Hongdong, Shanxi.\" The Great Locust Tree in Hongdong generally refers to the ancestral worship site sought by descendants of early Ming dynasty immigrants tracing their lineage. It was earlier recorded as Guangji Temple in Tang Dynasty Hongdong, and there were already numerous records of immigration at that time."
 building_type_TK_20_10_QianLing: "Tomb Ancestral Land"
 building_type_TK_20_10_QianLing_desc: "Tomb Ancestral Land"
 TK_20_10_QianLing: "Qianling Mausoleum"
 building_TK_20_10_QianLing: "$TK_20_10_QianLing$"
 building_TK_20_10_QianLing_desc: "Qianling is one of the eighteen Tang tombs in the Guanzhong region of Shaanxi. It serves as the joint burial site of Emperor Gaozong Li Zhi and Empress Wu Zetian, located on Liang Mountain in northern Qian County, Xianyang City, Shaanxi Province, 6 kilometers from the county seat and 76 kilometers from the ancient capital Xi'an. Construction of Qianling began in the first year of Guangzhi (684 AD) during the Tang Dynasty, with additional structures added in the second year of Shenzong (706 AD). The tomb was built using the \"mountain-as-tomb\" method, and the imperial burial area was modeled after the capital city of Chang'an. In addition to the main tomb, Qianling contains seventeen smaller accompanying tombs housing other royal family members and meritorious officials."
 building_type_TK_20_20_TianZhaoShenGong: "Temples and Shrines"
 building_type_TK_20_20_TianZhaoShenGong_desc: "Temples and Shrines"
 TK_20_20_TianZhaoShenGong: "Amaterasu Shrine"
 building_TK_20_20_TianZhaoShenGong: "$TK_20_20_TianZhaoShenGong$"
 building_TK_20_20_TianZhaoShenGong_desc: "The Amaterasu Shrine was established by the ruler of Yamatai to serve the Great Kami Amaterasu. The shrine's priests are called Miko, and the ruler, Himiko, is renowned for being both a princess and a Miko."
 building_type_TK_20_20_BaiMaSi: "Temples and Shrines"
 building_type_TK_20_20_BaiMaSi_desc: "Temples and Shrines"
 TK_20_20_BaiMaSi: "White Horse Temple"
 building_TK_20_20_BaiMaSi: "$TK_20_20_BaiMaSi$"
 building_TK_20_20_BaiMaSi_desc: "Baima Temple was first constructed in the 11th year of Yongping during the Eastern Han Dynasty (AD 68). It is the first official Buddhist temple built after Buddhism was introduced to China, and serves as the \"source of Dharma\" and \"ancestral temple\" for China, Vietnam, Korea, Japan, and Western European countries."
 building_type_TK_20_20_FaMenSi: "Temples and Shrines"
 building_type_TK_20_20_FaMenSi_desc: "Temples and Shrines"
 TK_20_20_FaMenSi: "Famen Temple"
 building_TK_20_20_FaMenSi: "$TK_20_20_FaMenSi$"
 building_TK_20_20_FaMenSi_desc: "Famen Temple was first established during the reign of Emperors Huan and Ling at the end of the Eastern Han Dynasty, boasting a history of over 1700 years. It is known as the \"Ancestor of Pagoda Temples in Guanzhong.\" Before the Zhou and Wei dynasties, it was called \"Aśoka's Temple\"; during the reign of Emperor Wen of Sui, it was renamed \"Chengshi Douchang,\" and later changed to its current name, \"Famen Temple,\" under Gaozu of Tang. Revered as an imperial temple, Famen Temple became a Buddhist holy site revered by the entire nation due to housing the relic of Śākyamuni Buddha's finger bone. The pagoda at Famen Temple is hailed as the \"Pagoda of True Body Protecting the Nation.\""
 building_type_TK_20_20_ChuYunDaShe: "Temples and Shrines"
 building_type_TK_20_20_ChuYunDaShe_desc: "Temples and Shrines"
 TK_20_20_ChuYunDaShe: "Izumo Taisha"
 building_TK_20_20_ChuYunDaShe: "$TK_20_20_ChuYunDaShe$"
 building_TK_20_20_ChuYunDaShe_desc: "Izumo Taisha is located in Izumo City, Shimane Prefecture, and is one of Japan's oldest shrines, as well as one of the shrines designated with the title \"Taisha.\" The deity enshrined there is Oguni-no-Kami, the Great Lord of the Land, revered as the \"First Spirit Deity in the Realm.\" It is said that every year during \"Kannazuki\" (the 10th month), the eight million spirits across the nation gather here for a divine council. For Izumo Taisha, this period is known as \"Kami-no-Ki,\" prompting the grand Kami-no-Ki Festival held from the 11th to the 17th day of the 10th lunar month."
 building_type_TK_20_20_HaiYinSi: "Temples and Shrines"
 building_type_TK_20_20_HaiYinSi_desc: "Temples and Shrines"
 TK_20_20_HaiYinSi: "Haiyin Temple"
 building_TK_20_20_HaiYinSi: "$TK_20_20_HaiYinSi$"
 building_TK_20_20_HaiYinSi_desc: "Haedin Temple is a temple located on Gaya Mountain in South Korea. During the Silla period, it was one of the Ten Great Zen Monasteries of the Huayan Sect. Today, it is one of the Five Major Forest Monasteries, Three Great Temples, and Thirty-One Principal Mountains for Zen and Teaching within the Jogye Order."
 building_type_TK_20_20_WuDangShanDaoGuan: "Temples and Shrines"
 building_type_TK_20_20_WuDangShanDaoGuan_desc: "Temples and Shrines"
 TK_20_20_WuDangShanDaoGuan: "Wudang Mountain Daoist Temple"
 building_TK_20_20_WuDangShanDaoGuan: "$TK_20_20_WuDangShanDaoGuan$"
 building_TK_20_20_WuDangShanDaoGuan_desc: "The Taoist temples and observatories of Mount Wudang are centered on Tianzhu Peak, arranged according to the \"Pilgrimage of Heaven\" planning model, and divided into a Taoist spatial system of \"Heaven, Earth, and Humanity.\" The temple buildings are linearly distributed along the sacred path between Jian River and Shuimo River. Courtyard spaces are categorized into living areas, cultivation zones, and sacrificial zones; among these, the sacrificial zone comprises transitional, core, and subsequent spaces. Nan Yan Palace serves as a typical example, employing construction techniques such as adapting to and borrowing from the terrain and organizing space logically. Elements like Heavenly Gates, archways, and bridges form a \"Heavenly Gate + Sacred Path\" guiding spatial pattern. In the Ming Dynasty, Mount Wudang was imperialistically enfeoffed as \"Great Yue\" and \"Xuan Yue.\""
 building_type_TK_20_20_ShaoLinSi: "Temples and Shrines"
 building_type_TK_20_20_ShaoLinSi_desc: "Temples and Shrines"
 TK_20_20_ShaoLinSi: "Shaolin Temple"
 building_TK_20_20_ShaoLinSi: "$TK_20_20_ShaoLinSi$"
 building_TK_20_20_ShaoLinSi_desc: "Shaolin Temple is not only the birthplace of Chan Buddhism but also the origin of Chinese martial arts, earning the titles \"Ancestral Court of Chan School\" and \"Holy Land of Martial Arts,\" and hailed as \"The First Temple Under Heaven.\" It has become renowned worldwide due to the Shaolin martial arts diligently cultivated and continuously developed by generations of Shaolin monks. There is a saying: \"All martial arts come from Shaolin; Shaolin's legacy endures in Yonghuatang.\" Founded in the 19th year of Taihe during the Northern Wei Dynasty (495 AD), it was established by Emperor Xiaowen to accommodate Indian monk Baduo for his residence and propagation of teachings. Named \"Shaolin Temple\" because it is situated within the dense forests of Shaoshi Mountain, located at the heart of Songshan."
 building_type_TK_20_20_LingYinSi: "Temples and Shrines"
 building_type_TK_20_20_LingYinSi_desc: "Temples and Shrines"
 TK_20_20_LingYinSi: "Lingyin Temple"
 building_TK_20_20_LingYinSi: "$TK_20_20_LingYinSi$"
 building_TK_20_20_LingYinSi_desc: "Lingyin Temple, also known as Yunlin Temple, is located west of West Lake in Hangzhou, Zhejiang Province. It faces Feilai Peak and has Beigao Peak as its backdrop. As the earliest renowned temple in Hangzhou, it was first established in the first year of Xianhe during the Eastern Jin Dynasty (AD 326). The founding patriarch of Lingyin Temple was Monk Hui Li from Western India. During the reign of Emperor Wu of the Southern Dynasties Liang, he granted land and expanded the temple. In the Five Dynasties period, King Qian Liu of Wuyue ordered Master Yongming Yanshou to revive and expand the temple, bestowing upon it the name Lingyin New Temple. During the Jiajing era of Emperor Ningzong of the Song Dynasty, Lingyin Temple was hailed as one of the \"Five Mountains\" of Chan Buddhism in Jiangnan. In the Shunzhi era of the Qing Dynasty, Monk Jude served as abbot, raised funds for reconstruction, and elevated its scale to become the foremost temple in Southeast China."
 building_type_TK_20_20_DaYanTa: "Temples and Shrines"
 building_type_TK_20_20_DaYanTa_desc: "Temples and Shrines"
 TK_20_20_DaYanTa: "Great Wild Goose Pagoda"
 building_TK_20_20_DaYanTa: "$TK_20_20_DaYanTa$"
 building_TK_20_20_DaYanTa_desc: "The Great Wild Goose Pagoda is located within the Daci'en Temple in Jinchang Fang, Chang'an City of the Tang Dynasty (present-day Xi'an, Shaanxi Province). Also known as the \"Ci'en Temple Pagoda,\" it was constructed under the supervision of Xuanzang in the third year of Yonghui of the Tang Dynasty (652 AD) to preserve sutras and Buddha images brought back from India via the Silk Road. Originally five stories tall, the pagoda was expanded to seven stories during the reign of Wu Zetian in the Chang'an era, and has maintained its seven-story appearance ever since."
 building_type_TK_20_20_XuanKongSi: "Temples and Shrines"
 building_type_TK_20_20_XuanKongSi_desc: "Temples and Shrines"
 TK_20_20_XuanKongSi: "Xuanhanging Temple"
 building_TK_20_20_XuanKongSi: "$TK_20_20_XuanKongSi$"
 building_TK_20_20_XuanKongSi_desc: "Xuankong Temple, originally named \"Xuankong Pavilion,\" is located on the west side of Cuiping Peak in the Ciyao Gorge (also known as Jinlong Gorge) of Hengshan Mountain, 4 kilometers southeast of Hunyuan County Town, Datong City, Shanxi Province. It is a temple complex where Confucianism, Buddhism, and Taoism are integrated. Construction began during the 15th year of Taihe in the Northern Wei Dynasty (491 AD), with repairs carried out throughout subsequent dynasties. By the Jin and Yuan periods, the South Tower, North Tower, and suspended walkway had largely formed the spatial layout seen today. The temple as it appears now is essentially consistent with its state during the Republic of China era, with the existing structures primarily built in the Ming and Qing dynasties."
 building_type_TK_20_20_YanDaoShenShe_01: "Temples and Shrines"
 building_type_TK_20_20_YanDaoShenShe_01_desc: "Temples and Shrines"
 TK_20_20_YanDaoShenShe_01: "Yashima Shrine"
 building_TK_20_20_YanDaoShenShe_01: "$TK_20_20_YanDaoShenShe_01$"
 building_TK_20_20_YanDaoShenShe_01_desc: "Yashima Shrine is a Shinto shrine located in Yonago, Hiroshima Prefecture, Japan. Founded in 593, it enshrines the three goddesses of Munakata as its main deities. The shrine complex is built on the tidal flat of the Seto Inland Sea and is renowned for its vermilion-colored giant torii gate standing in the sea, which forms a core scenic view among \"Japan's Three Views.\" The existing hall buildings are centered around the Byōdō-in style structure constructed by Taira no Kiyomori in 1168. Twenty-one buildings are connected via a 300-meter corridor to form a layout resembling a flying crane. Many of the shrine's structures and collections have been designated as National Treasures."
 building_type_TK_20_20_YanDaoShenShe_02: "Temples and Shrines"
 building_type_TK_20_20_YanDaoShenShe_02_desc: "Temples and Shrines"
 TK_20_20_YanDaoShenShe_02: "Shinshu Shrine Advanced"
 building_TK_20_20_YanDaoShenShe_02: "$TK_20_20_YanDaoShenShe_02$"
 building_TK_20_20_YanDaoShenShe_02_desc: "Yashima Shrine is a Shinto shrine located in Yonago, Hiroshima Prefecture, Japan. Founded in 593, it enshrines the three goddesses of Munakata as its main deities. The shrine complex is built on the tidal flat of the Seto Inland Sea and is renowned for its vermilion-colored giant torii gate standing in the sea, which forms a core scenic view among \"Japan's Three Views.\" The existing hall buildings are centered around the Byōdō-in style structure constructed by Taira no Kiyomori in 1168. Twenty-one buildings are connected via a 300-meter corridor to form a layout resembling a flying crane. Many of the shrine's structures and collections have been designated as National Treasures."
 building_type_TK_20_20_YiShiShenGong: "Temples and Shrines"
 building_type_TK_20_20_YiShiShenGong_desc: "Temples and Shrines"
 TK_20_20_YiShiShenGong: "Ise Grand Shrine"
 building_TK_20_20_YiShiShenGong: "$TK_20_20_YiShiShenGong$"
 building_TK_20_20_YiShiShenGong_desc: "Ise Grand Shrine is a Shinto shrine located in Ise City, Mie Prefecture, Japan, primarily composed of the Inner Palace (Naiku, Imperial Grand Shrine) and the Outer Palace (Geku, Taishaku Grand Shrine). The establishment date of Ise Grand Shrine does not later than the fourth year of Emperor Jito (690 AD); it is generally believed by Japanese historical scholars to have been founded during the reign of Emperor Tenmu. The architectural style of Ise Grand Shrine originates from the rice granaries of the Yayoi period in Japan."
 building_type_TK_20_20_HuangLongSi: "Temples and Shrines"
 building_type_TK_20_20_HuangLongSi_desc: "Temples and Shrines"
 TK_20_20_HuangLongSi: "Imperial Dragon Temple"
 building_TK_20_20_HuangLongSi: "$TK_20_20_HuangLongSi$"
 building_TK_20_20_HuangLongSi_desc: "Hwangryong Temple is an ancient monastery originally constructed in the 14th year of King Seonheung of Silla (553 AD) on a plain near Byeolmyeong Fortress in Gyeongju. It took 17 years to complete, finishing in 569 AD, and was once the largest Buddhist temple in Korean history. During the Mongol invasion of Goryeo in 1238, the temple was burned down."
 building_type_TK_20_20_TianTaiZongSiYuan: "Temples and Shrines"
 building_type_TK_20_20_TianTaiZongSiYuan_desc: "Temples and Shrines"
 TK_20_20_TianTaiZongSiYuan: "Tiantai Temple"
 building_TK_20_20_TianTaiZongSiYuan: "$TK_20_20_TianTaiZongSiYuan$"
 building_TK_20_20_TianTaiZongSiYuan_desc: "The Jingju Temple of the Tiantai Sect is located in the heart of Jingshi Rock, Xianju County, Taizhou City, Zhejiang Province. It was originally constructed during the Tang Dynasty. In the Song Dynasty, the high monk Xingji built a hermitage here to reside. During the Ming Dynasty, Shi Qi expanded the temple, followed by Zhan'an in the Qing Dynasty. The temple was destroyed by mountain bandits in 1658 (the 15th year of Shunzhi). As of 2024, the current abbot, Miaode, has spent decades restoring the halls and pavilions to their original scale. Existing architectural relics include a Ming Dynasty dragon pillar. To the west are the Zhaixing Terrace and the Dushu Hall ruins; to the northwest lies Xiangling Rock; and to the east stands Yuzhu Peak. The Jingshi Rock where the temple is situated is one of the Eight Scenic Views of Xianju, known as \"Jingshi Night Moon,\" and features dedicated facilities for moon gazing."
 building_type_TK_20_20_NanHuaSi: "Temples and Shrines"
 building_type_TK_20_20_NanHuaSi_desc: "Temples and Shrines"
 TK_20_20_NanHuaSi: "Nanhua Temple"
 building_TK_20_20_NanHuaSi: "$TK_20_20_NanHuaSi$"
 building_TK_20_20_NanHuaSi_desc: "Nanhua Temple, located in the southeastern suburbs of Ma'an Town, Qujiang District, Shaoguan City, Guangdong Province. Nanhua Temple was originally founded in the first year of Tianjian during the Liang Dynasty of the Northern and Southern Dynasties (502 AD), and later successively renamed \"Zhongxing Temple\" and \"Faqun Temple\". In the first year of Kaibao of the Song Dynasty (968 AD), Emperor Taizu of Song bestowed the name \"Nanhua Chan Temple\" upon it. Nanhua Temple is one of China's important ancient Buddhist temples and also the birthplace where the Sixth Patriarch Huineng of Chan Buddhism propagated Chan teachings."
 building_type_TK_20_20_DaZhaoSi: "Temples and Shrines"
 building_type_TK_20_20_DaZhaoSi_desc: "Temples and Shrines"
 TK_20_20_DaZhaoSi: "Great Temple of Enlightenment"
 building_TK_20_20_DaZhaoSi: "$TK_20_20_DaZhaoSi$"
 building_TK_20_20_DaZhaoSi_desc: "Zhao Temple is a sacred site of Tibetan Buddhism and the core of Lhasa's old town. Let me introduce its basic information: it is located at No. 2, Bakuo West Street, Chengguan District, Lhasa City; it was first built in AD 647 by King Songtsen Gampo to commemorate Princess Wencheng's entry into Tibet, and has a history of over 1,300 years. Inside the temple is enshrined the life-size statue of the Buddha Shakyamuni at the age of 12 brought by Princess Wencheng, which serves as the pilgrimage destination for countless believers."
 building_type_TK_20_21_ChangAnCheng: "Cultural Ancient City"
 building_type_TK_20_21_ChangAnCheng_desc: "Cultural Ancient City"
 TK_20_21_ChangAnCheng: "Chang'an City"
 building_TK_20_21_ChangAnCheng: "$TK_20_21_ChangAnCheng$"
 building_TK_20_21_ChangAnCheng_desc: "Chang'an City: The ancient name of Xi'an, it was the capital city for the most dynasties and for the longest duration in Chinese history. As an important birthplace of Chinese civilization, sites such as Lantian Peking Man, Banpo Site, and Yangguanzhai Site attest to early human activity. Thirteen dynasties, including Zhou, Qin, Han, Sui, and Tang, successively established their capitals here; its planning concepts such as \"government in front, market behind\" and \"separation of wards and markets\" profoundly influenced the layout of capital cities across East Asia. Chang'an served as the eastern starting point of the Silk Road and became the world's largest international metropolis during the Tang Dynasty, engaging with over 300 countries and regions."
 building_type_TK_20_21_LuoYangCheng: "Cultural Ancient City"
 building_type_TK_20_21_LuoYangCheng_desc: "Cultural Ancient City"
 TK_20_21_LuoYangCheng: "Luoyang City"
 building_TK_20_21_LuoYangCheng: "$TK_20_21_LuoYangCheng$"
 building_TK_20_21_LuoYangCheng_desc: "Luoyang City: Situated at the center of the realm, named for its location on the northern bank of the Luo River. With over 5,000 years of civilization history, more than 4,000 years of city-building history, and over 1,500 years as a capital, it is an important birthplace of Chinese civilization, the legendary homeland of Yan and Huang, the origin of Han characters, the eastern starting point of the Silk Road, the central hub of the Sui-Tang Grand Canal, and the ancestral temple of Confucianism, Buddhism, and Taoism. Thirteen dynasties—including Xia, Shang, Western Zhou, Eastern Zhou, Eastern Han, Cao Wei, Western Jin, Northern Wei, Sui, Tang (including Wu Zhou), Later Liang, Later Tang, and Later Jin—successively established their capitals here. It is China's earliest-founded capital city, the one with the most dynasties ruling from it, and the longest-serving capital in history, hailed as \"China's First Ancient Capital\" and one of the \"Four Holy Cities of the World.\" It is also the only Chinese city honored by the United Nations as a \"World Cultural City,\" and serves as the permanent headquarters for the World Forum on Ancient Capitals."
 building_type_TK_20_21_ZiJinCheng: "Cultural Ancient City"
 building_type_TK_20_21_ZiJinCheng_desc: "Cultural Ancient City"
 TK_20_21_ZiJinCheng: "Forbidden City"
 building_TK_20_21_ZiJinCheng: "$TK_20_21_ZiJinCheng$"
 building_TK_20_21_ZiJinCheng_desc: "The Forbidden City, located in Beijing, China, served as the imperial palace during the Ming and Qing dynasties. Formerly known as the Purple Forbidden City, it is situated at the center of Beijing's north-south central axis. Construction began in the fourth year of Yongle of the Ming Dynasty (1406), modeled after the Nanjing Palace, and was completed in the eighteenth year of Yongle (1420), becoming the imperial residence for twenty-four emperors across the Ming and Qing dynasties. On October 10, 1925, the 14th year of the Republic of China, the Palace Museum was officially established and opened. The Forbidden City measures 961 meters in length from north to south and 753 meters in width from east to west, surrounded by city walls standing 10 meters high on all four sides, with a moat 52 meters wide encircling the exterior. It features four gate towers: Wumen (Meridian Gate) to the south, Shenwumen (Spirit Martial Gate) to the north, Donghuamen (Eastern Hua Gate) to the east, and Xihua Gate to the west. At each of the four corners of the city walls stands an elegant corner tower; folklore describes it as having nine beams, eighteen pillars, and seventy-two ridges, highlighting its intricate structure."
 building_type_TK_20_21_JinGuanCheng: "Cultural Ancient City"
 building_type_TK_20_21_JinGuanCheng_desc: "Cultural Ancient City"
 TK_20_21_JinGuanCheng: "Jin Guan City"
 building_TK_20_21_JinGuanCheng: "$TK_20_21_JinGuanCheng$"
 building_TK_20_21_JinGuanCheng_desc: "Jin Guan City, also known as Chengdu, is a significant birthplace of the ancient Shu civilization. It boasts a rare historical feature in the world: over 3,500 years of city construction and 2,500 years without changing its name. As early as approximately 4,500 to 3,700 years ago, settlement centers of the ancient Shu people later referred to as \"Baodun Culture\" had already emerged on the Chengdu Plain. In 316 BC, Qin conquered Shu and established Shu Commandery with Chengdu County as its seat; it served as the administrative center of Shu Commandery. In 311 BC, the construction of the Great City and the Small City was completed, widely recognized by later generations as the documented mark of Chengdu's founding. Subsequently, Li Bing, the Governor of Shu Commandery, oversaw the construction of the Dujiangyan water conservancy project, transforming the Chengdu Plain into the \"Land of Abundance,\" while Chengdu became the economic, political, and cultural center of the southwestern region."
 building_type_TK_20_21_GuSuCheng: "Cultural Ancient City"
 building_type_TK_20_21_GuSuCheng_desc: "Cultural Ancient City"
 TK_20_21_GuSuCheng: "Gusu City"
 building_TK_20_21_GuSuCheng: "$TK_20_21_GuSuCheng$"
 building_TK_20_21_GuSuCheng_desc: "Gusu City, now known as Suzhou in Jiangsu Province, was historically called Wu and abbreviated as Su. Also known by names such as Gusu and Pingjiang, it is a major historical and cultural city in China. Located in the central part of the Yangtze River Delta on the eastern shore of Lake Taihu, it belongs to the Jiangnan water town region with an extensive network of waterways and has long been hailed as \"the paradise on earth.\" Its founding history dates back to the Spring and Autumn Period (514 BC), spanning over 2,500 years, making it the birthplace of Wu culture. Classical gardens within the city walls, such as the Humble Administrator's Garden and the Lingering Garden, are inscribed on the World Heritage List, while intangible cultural heritage items like Kunqu Opera and Pingtan are renowned worldwide."
 building_type_TK_20_21_YangZhouCheng: "Cultural Ancient City"
 building_type_TK_20_21_YangZhouCheng_desc: "Cultural Ancient City"
 TK_20_21_YangZhouCheng: "Yangzhou City"
 building_TK_20_21_YangZhouCheng: "$TK_20_21_YangZhouCheng$"
 building_TK_20_21_YangZhouCheng_desc: "Yangzhou City, located in the main urban area of Yangzhou City, Jiangsu Province, sits on the north bank of the Yangtze River at its confluence with the Grand Canal. With a total area of 6,591 square kilometers, the city was first established as Hancheng during the State of Wu in the Spring and Autumn period, followed by the construction of Guangling City by the Chu state in 319 BC. It was officially named Yangzhou in the ninth year of Kaihuang of the Sui Dynasty (589 AD). During the Tang Dynasty, it developed into a dual-city structure comprising the Zicheng and Luocheng, becoming a crucial hub for grain transportation. In the Northern Song Dynasty, its annual commercial tax revenue reached 80,000 guan, ranking among the highest nationwide. Under the Ming and Qing dynasties, the old and new cities coexisted; in 1916, the wall separating the two cities was demolished. The Small Qinhuai River serves as the boundary between the old and new cities of the Ming and Qing eras, and among the eleven ancient bridges that remain today, half are relics from the Ming and Qing periods."
 building_type_TK_20_21_JingZhouCheng: "Cultural Ancient City"
 building_type_TK_20_21_JingZhouCheng_desc: "Cultural Ancient City"
 TK_20_21_JingZhouCheng: "Jingzhou City"
 building_TK_20_21_JingZhouCheng: "$TK_20_21_JingZhouCheng$"
 building_TK_20_21_JingZhouCheng_desc: "Jingzhou City, anciently known as Jiangling, is situated in the heart of the Jianghan Plain along the middle reaches of the Yangtze River in central and southern Hubei Province. It connects eastward to Wu and Yue, westward to Ba and Shu, borders the Yangtze River to the south, and adjoins the Han River to the north, serving as a vital transportation hub linking east with west and north with south. Today, it constitutes the main urban district of Jingzhou City. Jingzhou boasts a long history; since King Wen of Chu relocated the capital to Ying (present-day Jicheng South City, approximately 5 kilometers north of present-day Jingzhou) in 689 BC, this place has served as an official boat dock for the State of Chu. From the time King Wen established his capital at Ying, six successive dynasties and thirty-four emperors built their capitals here, making it the birthplace of Chu-Chu culture and a renowned ancient battlefield of the Three Kingdoms period."
 building_type_TK_20_21_ShiTouCheng: "Cultural Ancient City"
 building_type_TK_20_21_ShiTouCheng_desc: "Cultural Ancient City"
 TK_20_21_ShiTouCheng: "Stone City"
 building_TK_20_21_ShiTouCheng: "$TK_20_21_ShiTouCheng$"
 building_TK_20_21_ShiTouCheng_desc: "Stone City, also known as Shicheng, is the broader alias for present-day Nanjing. In a narrower sense, it refers to Stone Mountain or Shicheng Mountain west of the old city of Nanjing, located in Gulou District, Nanjing—a famous relic from the Six Dynasties period. The site lies in the area of present-day Qingliang Mountain and is renowned as \"the First Military Fortress of Eastern Wu,\" constructed in the seventh year of King Wei of Chu (333 BC). In the sixteenth year of Jian'an during the Eastern Han Dynasty (211 AD), Sun Quan of Eastern Wu relocated to Moling (now Nanjing) and built a city on the original site of Jinling Yi at Stone Mountain, naming it Stone City. It commands the confluence of the Qinhuai River and the Yangtze River; \"using the mountain as its wall and the river as its moat, the terrain is perilously secure and possesses extraordinary strategic advantage.\" As a key military stronghold ensuring the western security of the capital Jiankang, it was a fiercely contested battleground, famously known as \"Stone City: The Tiger Crouches.\""
 building_type_TK_20_21_KaiFengHuangCheng: "Cultural Ancient City"
 building_type_TK_20_21_KaiFengHuangCheng_desc: "Cultural Ancient City"
 TK_20_21_KaiFengHuangCheng: "Kaifeng Imperial Palace"
 building_TK_20_21_KaiFengHuangCheng: "$TK_20_21_KaiFengHuangCheng$"
 building_TK_20_21_KaiFengHuangCheng_desc: "Kaifeng Imperial City: In the first year of Jianlong (960 AD), the Song Dynasty established its capital at Kaifeng, historically known as Dongjing. Over nine dynastic generations spanning 168 years, it developed into a grand city complex consisting of three concentric walls—the Outer City, Inner City, and Imperial City. According to historical records: In the late Northern Song period, the perimeter of Dongjing's Outer City measured 50 li and 165 bu, with a height of 4 zhang and a width of 5 zhang 9 chi, housing a population exceeding 1.5 million."
 building_type_TK_20_21_LinAnHuangCheng: "Cultural Ancient City"
 building_type_TK_20_21_LinAnHuangCheng_desc: "Cultural Ancient City"
 TK_20_21_LinAnHuangCheng: "Linchuan Imperial Palace"
 building_TK_20_21_LinAnHuangCheng: "$TK_20_21_LinAnHuangCheng$"
 building_TK_20_21_LinAnHuangCheng_desc: "The Imperial Palace of Lin'an refers to the Southern Song Dynasty's Lin'an Palace, also known as the Southern Song Imperial Palace or the Former Palace of the Southern Song, commonly called \"Nan Nei\" (Southern Inner Court) or \"Da Nei\" (Great Inner Court). Located at the foot of Phoenix Mountain in Hangzhou, Zhejiang Province, it covers an area of approximately 500,000 to 600,000 square meters and served as the imperial palace of the Southern Song capital. Built upon the foundations of the Sui-Tang prefectural administration and the Wuyue Kingdom's subsidiary city, Emperor Gaozong Zhao Gong established the palace precinct at the foot of Phoenix Mountain after making Hangzhou his capital. Three gates were constructed: Lizheng Gate, Hening Gate, and Donghua Gate. The interior was divided into six functional zones, including the court assembly area, rear quarters, and rear garden. The main hall, Daqing Hall, served multiple functions such as grand ceremonies and imperial examinations; Chigong Hall was used for daily administrative affairs; Jijing Hall hosted imperial examination deliberations; certain halls changed their functions through replacement of their plaques."
 building_type_TK_20_21_PingYaoGuCheng: "Cultural Ancient City"
 building_type_TK_20_21_PingYaoGuCheng_desc: "Cultural Ancient City"
 TK_20_21_PingYaoGuCheng: "Pingyao Ancient City"
 building_TK_20_21_PingYaoGuCheng: "$TK_20_21_PingYaoGuCheng$"
 building_TK_20_21_PingYaoGuCheng_desc: "Pingyao Ancient City was first established during the reign of King Xuan of the Western Zhou Dynasty (827–782 BC), and rebuilt and expanded in the third year of Hongwu of the Ming Dynasty (1370). It is currently the most intact ancient county-level city within China. The entire walled city resembles a turtle crawling southward, hence its nickname \"Turtle City.\""
 building_type_TK_20_21_FengDuGuiCheng: "Cultural Ancient City"
 building_type_TK_20_21_FengDuGuiCheng_desc: "Cultural Ancient City"
 TK_20_21_FengDuGuiCheng: "Fengdu Ghost City"
 building_TK_20_21_FengDuGuiCheng: "$TK_20_21_FengDuGuiCheng$"
 building_TK_20_21_FengDuGuiCheng_desc: "Fengdu Ghost City, formerly known as Fengdu Ghost City, was historically the \"Alternative Capital of the Ba State.\" A county was established here in the second year of Emperor Hedi's Yongyuan era during the Eastern Han Dynasty, giving it a history of nearly 2000 years. Located on the north bank of the Yangtze River downstream from Chongqing Prefecture, it faces across the river from the new county seat of Fengdu."
 building_type_TK_20_21_LouLanGuGuo: "Cultural Ancient City"
 building_type_TK_20_21_LouLanGuGuo_desc: "Cultural Ancient City"
 TK_20_21_LouLanGuGuo: "Ancient State of Loulan"
 building_TK_20_21_LouLanGuGuo: "$TK_20_21_LouLanGuGuo$"
 building_TK_20_21_LouLanGuGuo_desc: "The ancient kingdom of Loulan was a small state on the ancient Silk Road, located west of Lop Nur and serving as a hub in the Western Regions. It held an extremely important position on the ancient Silk Road. Founded before 176 BC, it mysteriously disappeared in AD 630 after over 800 years of history; today, only ruins remain."
 building_type_TK_20_21_JingJueGuCheng: "Cultural Ancient City"
 building_type_TK_20_21_JingJueGuCheng_desc: "Cultural Ancient City"
 TK_20_21_JingJueGuCheng: "Jingjue Ancient City"
 building_TK_20_21_JingJueGuCheng: "$TK_20_21_JingJueGuCheng$"
 building_TK_20_21_JingJueGuCheng_desc: "Jingjue Ancient City was the capital of a small city-state in the Western Regions during the Western Han Dynasty. The Kingdom of Jingjue was situated on an oasis along the Niya River and was one of the 36 states of the Western Regions. Its economy was primarily based on agriculture, making it a crucial stop along the Silk Road where merchants gathered and prosperity flourished. In the late Eastern Han Dynasty, it was annexed by the Kingdom of Shanshan and later came under the control of the Wei-Jin dynasties. By the Tang Dynasty, its capital still existed and was known as Ni Rang City; during the Qing Dynasty, it was called Niya City."
 building_type_TK_20_21_GaoChangGuCheng: "Cultural Ancient City"
 building_type_TK_20_21_GaoChangGuCheng_desc: "Cultural Ancient City"
 TK_20_21_GaoChangGuCheng: "Gaolang Ancient City"
 building_TK_20_21_GaoChangGuCheng: "$TK_20_21_GaoChangGuCheng$"
 building_TK_20_21_GaoChangGuCheng_desc: "Gaotang Ancient City was a central town in the Turpan Basin from the Western Han Dynasty to the Yuan and Ming periods (1st century BC to 14th century AD). It passed through successive eras including Gaotang Wall of the Western Han, Gaotang Commandery, Kingdom of Gaotang, Western Zhou of the Tang Dynasty, and the Uyghur Kingdom of Qocho. Spanning approximately 1,400 years, the city was abandoned during the turmoil at the end of the 13th century, with most of its structures lost to history."
 building_type_TK_20_21_GeShengGuCheng: "Cultural Ancient City"
 building_type_TK_20_21_GeShengGuCheng_desc: "Cultural Ancient City"
 TK_20_21_GeShengGuCheng: "Heshenggu City"
 building_TK_20_21_GeShengGuCheng: "$TK_20_21_GeShengGuCheng$"
 building_TK_20_21_GeShengGuCheng_desc: "Heshenggu City: Gao Jumong, the founding monarch of Goguryeo, fled south from Fuyu to escape disaster and established a kingdom in Suben River Valley at the beginning of the Western Han Dynasty, styling himself as king. He built Heshenggu City as his capital. Scholars generally believe that Goguryeo ruled its capital here for 40 years."
 building_type_TK_20_21_MingTiePeiGuCheng: "Cultural Ancient City"
 building_type_TK_20_21_MingTiePeiGuCheng_desc: "Cultural Ancient City"
 TK_20_21_MingTiePeiGuCheng: "Mingtepei Ancient City"
 building_TK_20_21_MingTiePeiGuCheng: "$TK_20_21_MingTiePeiGuCheng$"
 building_TK_20_21_MingTiePeiGuCheng_desc: "Mingtepe Ancient City, as the largest ancient city within the Fergana Basin around AD 1 and 2, features not only well-developed defensive facilities such as city walls, gates, and horse-faced towers, but also grand architectural structures and road systems both inside and outside the city. Additionally, it boasts clearly laid-out and fully functional handicraft workshops, while the burial areas discovered beyond the city walls further expand the cultural connotations of this ancient settlement."
 building_type_TK_20_21_AiLaoGuGuo: "Cultural Ancient City"
 building_type_TK_20_21_AiLaoGuGuo_desc: "Cultural Ancient City"
 TK_20_21_AiLaoGuGuo: "Kingdom of Ailao"
 building_TK_20_21_AiLaoGuGuo: "$TK_20_21_AiLaoGuGuo$"
 building_TK_20_21_AiLaoGuGuo_desc: "Kingdom of Ailao: An ancient kingdom existing over 3,000 years ago, born from the Goddess of Cangnu, Shayi, at the end of the Neolithic Age more than 3,000 years ago. After the \"creation\" of King Jiulong, the people of Jiulong in the basins of the Lancang River and Nujiang in western Dian rapidly multiplied and flourished through the practice of \"ten men marrying ten women.\" From the establishment of Buwei County by the Western Han Dynasty in 109 BC to the return of Liubao to the Han in 69 AD, there was a historical period lasting 178 years during which Buwei County of the Han and the ancient Kingdom of Ailao coexisted in western Dian."
 building_type_TK_20_21_WuGeKu: "Cultural Ancient City"
 building_type_TK_20_21_WuGeKu_desc: "Cultural Ancient City"
 TK_20_21_WuGeKu: "Angkor Wat"
 building_TK_20_21_WuGeKu: "$TK_20_21_WuGeKu$"
 building_TK_20_21_WuGeKu_desc: "The name Angkor Wat means \"Temple of Vishnu,\" and ancient Chinese Buddhist texts refer to it as \"Sangxiang Buddha's Abode.\" From the 9th to the 15th century, the Khmer Kingdom made Angkor Thom its capital, where it flourished for a time. The Angkor Wat temple, originally constructed between 1113 and 1150, served as the burial site of Suryavarman II and later evolved into the state temple of the Khmer Dynasty. In the 15th century, after the decline of the Khmer Kingdom, these ancient ruins were submerged in dense jungles until they were rediscovered by the French in 1861, bringing them back to public view and earning recognition as one of the Four Great Wonders of the East."
 building_type_TK_20_21_GongShanCheng: "Cultural Ancient City"
 building_type_TK_20_21_GongShanCheng_desc: "Cultural Ancient City"
 TK_20_21_GongShanCheng: "Gongshan Mountain City"
 building_TK_20_21_GongShanCheng: "$TK_20_21_GongShanCheng$"
 building_TK_20_21_GongShanCheng_desc: "Gongsan Mountain Fortress is located in Gongju City, South Chungcheong Province, South Korea. It is a mountain fortress site constructed during the Baekje period (234–678 AD). The original city walls were made of earth and later expanded into stone fortifications. Gongsan Mountain Fortress once served as the capital of the Baekje Dynasty (475–538 AD). Within the fortress, scenic spots such as Zhennan Tower and Linliu Pavilion are preserved. The existing city walls wind along the Geum River, with scattered relics including lotus ponds and Yunu Peak along the route."
 building_type_TK_20_21_PingAnJing: "Cultural Ancient City"
 building_type_TK_20_21_PingAnJing_desc: "Cultural Ancient City"
 TK_20_21_PingAnJing: "Heian-kyo"
 building_TK_20_21_PingAnJing: "$TK_20_21_PingAnJing$"
 building_TK_20_21_PingAnJing_desc: "Heian-kyo, also known as Luoyang or Jingluo, is the ancient name of Kyoto, Japan, located in the northern part of the Kyoto Basin in the central-western region of Honshu Island. In 794, Emperor Kanmu moved the capital here, where it served as Japan's capital until 1868. The city layout was modeled after Chang'an and Luoyang of the Sui and Tang dynasties, with the Suzaku Avenue as its central axis, dividing the city into two capitals: Left Capital (Luoyang) and Right Capital (Chang'an), with streets arranged in a grid pattern. As a political, economic, and cultural center for approximately 1200 years, Heian-kyo left behind numerous temples and shrines, including Kiyomizu-dera and Nijo Castle, which are UNESCO World Heritage Sites."
 building_type_TK_20_21_ShengLongHuangCheng01: "Cultural Ancient City"
 building_type_TK_20_21_ShengLongHuangCheng01_desc: "Cultural Ancient City"
 TK_20_21_ShengLongHuangCheng01: "Shenglong City"
 building_TK_20_21_ShengLongHuangCheng01: "$TK_20_21_ShengLongHuangCheng01$"
 building_TK_20_21_ShengLongHuangCheng01_desc: "Shenglong City: Originally constructed in 621 AD, initially named Zicheng, later renamed Songping during the Tang Dynasty, and expanded into Daluo City in 886 AD. Located in Hanoi, the capital of Vietnam, the imperial palace ruins showcase layered historical and cultural strata from the 7th to the 19th centuries, including architectural traces and artifacts from the early Shenglong period through the Hanoi era. These remains collectively embody the unique value of sculptural art, urban planning techniques, and landscape design. Archaeological discoveries include foundations, brick walls, drainage systems, the \"Imperial River,\" as well as artifacts such as plain bricks, floral-patterned tiles, ceramics, and copper coins, encompassing items from Vietnam itself, China, Japan, the Middle East, and other regions."
 building_type_TK_20_21_ShengLongHuangCheng02: "Cultural Ancient City"
 building_type_TK_20_21_ShengLongHuangCheng02_desc: "Cultural Ancient City"
 TK_20_21_ShengLongHuangCheng02: "Ascending Dragon Imperial City"
 building_TK_20_21_ShengLongHuangCheng02: "$TK_20_21_ShengLongHuangCheng02$"
 building_TK_20_21_ShengLongHuangCheng02_desc: "Shenglong Imperial City: Originally constructed in 621 AD, initially named Zicheng, later renamed Songping during the Tang Dynasty, and expanded into Daluo City in 886 AD. Located in Hanoi, the capital of Vietnam, the ruins of the imperial city showcase layered historical and cultural strata from the 7th to the 19th centuries, including architectural remains and artifacts from the early Shenglong period through the Hanoi era. These features collectively embody the unique value of sculptural art, urban planning techniques, and landscape design. Archaeological discoveries include foundations, brick walls, drainage systems, the \"Imperial River,\" as well as artifacts such as plain bricks, floral-patterned bricks, ceramics, and copper coins, encompassing items from Vietnam itself, China, Japan, the Middle East, and other regions."
 building_type_TK_20_22_DaWenKouYiZhi: "Village Ruins"
 building_type_TK_20_22_DaWenKouYiZhi_desc: "Village Ruins"
 TK_20_22_DaWenKouYiZhi: "Dayenkou Site"
 building_TK_20_22_DaWenKouYiZhi: "$TK_20_22_DaWenKouYiZhi$"
 building_TK_20_22_DaWenKouYiZhi_desc: "The Dawenkou site is a Neolithic late-period patriarchal clan site dating back approximately 6,100 to 4,600 years ago. It served as the communal burial ground for Neolithic clans and was first discovered and excavated in 1959."
 building_type_TK_20_22_BanPoYiZhi: "Village Ruins"
 building_type_TK_20_22_BanPoYiZhi_desc: "Village Ruins"
 TK_20_22_BanPoYiZhi: "Banpo Site"
 building_TK_20_22_BanPoYiZhi: "$TK_20_22_BanPoYiZhi$"
 building_TK_20_22_BanPoYiZhi_desc: "Banpo Site is a typical village site of a matriarchal clan community in the Yellow River Basin, belonging to an early type of Yangshao culture, dating back approximately 6,000 years."
 building_type_TK_20_22_HeMuDuYiZhi: "Village Ruins"
 building_type_TK_20_22_HeMuDuYiZhi_desc: "Village Ruins"
 TK_20_22_HeMuDuYiZhi: "Hemudu Site"
 building_TK_20_22_HeMuDuYiZhi: "$TK_20_22_HeMuDuYiZhi$"
 building_TK_20_22_HeMuDuYiZhi_desc: "The Hemudu Site is located in the northeast of Hemudu Village, Hemudu Town, Yuyao City, Ningbo City, Zhejiang Province. It is an early Neolithic site in southern China (approximately 7000–5000 years ago)."
 building_type_TK_20_22_ShiGangPingYuan: "Village Ruins"
 building_type_TK_20_22_ShiGangPingYuan_desc: "Village Ruins"
 TK_20_22_ShiGangPingYuan: "Stone Vat Plains"
 building_TK_20_22_ShiGangPingYuan: "$TK_20_22_ShiGangPingYuan$"
 building_TK_20_22_ShiGangPingYuan_desc: "The Plain of Jars, also known as the Chal Plain or Stone Jar Formation, officially designated as the Kuang-Chal Giant Stone Jar Site—Plain of Jars, is located in the Champasak Province of Laos. The term \"Chal\" in Lao means \"stone jar,\" derived from the numerous stone jars scattered across the plain. The site comprises 15 distinct sections and features multiple colossal stone jars carved from single blocks of stone, varying in weight."
 building_type_TK_20_23_BaiLuDongShuYuan: "Academy University"
 building_type_TK_20_23_BaiLuDongShuYuan_desc: "Academy University"
 TK_20_23_BaiLuDongShuYuan: "Bailudong Academy"
 building_TK_20_23_BaiLuDongShuYuan: "$TK_20_23_BaiLuDongShuYuan$"
 building_TK_20_23_BaiLuDongShuYuan_desc: "Bailudong Academy, located at the southern foot of Wulaofeng in Lushan City, Jiujiang, Jiangxi Province, was first established during the Baoli reign of the Tang Dynasty. It is named after the white deer that Li Bo and his brother raised while they lived in seclusion to study there. In the sixth year of Chunxi of the Southern Song Dynasty (1179), Zhu Xi oversaw its restoration, added new structures, and formulated the \"Bailudong Academy Proclamation,\" establishing regulations for teaching and learning."
 building_type_TK_20_23_ShiGuShuYuan: "Academy University"
 building_type_TK_20_23_ShiGuShuYuan_desc: "Academy University"
 TK_20_23_ShiGuShuYuan: "Stone Drum Academy"
 building_TK_20_23_ShiGuShuYuan: "$TK_20_23_ShiGuShuYuan$"
 building_TK_20_23_ShiGuShuYuan_desc: "Shigu Academy, located at No. 69 Xiangjiang North Road, Xiaoxiao Street, Shigu District, Hengyang City, Hunan Province, stands atop Shigu Mountain where the Zheng, Xiang, and Lei rivers converge north of Hengyang City. Established in the fifth year of Yuanhe (810 AD) during the Tang Dynasty, it is one of the important birthplaces of Huxiang culture. Xu Xiake of the Ming Dynasty praised it as \"Shigu Academy possesses the superior merits of both Tengwang Pavilion and Yellow Crane Tower.\" Shigu Academy is one of the Four Great Academies of the Song Dynasty; scholars have compared it with Yuelu Academy in Changsha, Bailudong Academy in Jiangxi, Yingtian Academy in Henan, and Songyang Academy. It has long been honored as \"Hengxiang Zhusi\" and \"the True Lineage South of the Dao.\""
 building_type_TK_20_23_CuLaiShuYuan: "Academy University"
 building_type_TK_20_23_CuLaiShuYuan_desc: "Academy University"
 TK_20_23_CuLaiShuYuan: "Culai Academy"
 building_TK_20_23_CuLaiShuYuan: "$TK_20_23_CuLaiShuYuan$"
 building_TK_20_23_CuLaiShuYuan_desc: "Culai Academy was one of the Four Great Academies of the Northern Song Dynasty, a private institution founded during that period and located in Culaishan, Shandong Province, China. It was in the *Canluan Lu* by Fan Chengda, Chancellor of the Southern Song Dynasty, that the concept of the Four Ancient Academies was first proposed. The academy was established by Sun Fu and Shi Jie; Shi Jie constructed the Culai Academy on Changchun Ridge between the first year of Baoyuan (1038) and the first year of Kangding (1040). It is the earliest and most renowned academy within Shandong Province, ushered in the prelude to the Ancient Prose Movement of the Song Dynasty, and gave rise to the Taishan School."
 building_type_TK_20_23_LiZeShuYuan: "Academy University"
 building_type_TK_20_23_LiZeShuYuan_desc: "Academy University"
 TK_20_23_LiZeShuYuan: "Lize Academy"
 building_TK_20_23_LiZeShuYuan: "$TK_20_23_LiZeShuYuan$"
 building_TK_20_23_LiZeShuYuan_desc: "Lize Academy served as a gathering place for scholars and friends of Lü Zuxian (1137–1181), a renowned thinker, historian, literary figure, and educator from Jinhua during the Southern Song Dynasty. Established in the early Qianbao era of the Song Dynasty (approximately 1165–1166), it was located beside Guangxiao Guan (later behind the Qing-era Jinhua County Academy; today northeast of Yilan Pavilion within the city). As recorded by Lou Yue in his \"Memorial to the Ancestral Hall of Lü Taishi Donglai\": \"Scholars from all directions received instruction here.\" Named \"Lize\" because the hall faced two lakes, it was commonly referred to as \"Lize Shutang.\""
 building_type_TK_20_23_MaoShanShuYuan: "Academy University"
 building_type_TK_20_23_MaoShanShuYuan_desc: "Academy University"
 TK_20_23_MaoShanShuYuan: "Maoshan Academy"
 building_TK_20_23_MaoShanShuYuan: "$TK_20_23_MaoShanShuYuan$"
 building_TK_20_23_MaoShanShuYuan_desc: "Maoshan Academy, also known as Jinshan Academy, was founded in the second year of Tianding (1024) during the Northern Song Dynasty by Hou Yi, a hermit from Jurong. Located on Maoshan in Jintan, Jiangsu, it was one of the six major academies of the Northern Song Dynasty. The academy established by hermit Hou Yi during the reign of Emperor Renzong no longer exists; its site is situated behind Sanmao Mountain in Jianing Prefecture, hence the name Maoshan Academy. Hou taught students here for over ten years. In the second year of Tianding (1024) under Emperor Renzong, upon petition by Wang Sui, the prefect of Jianing, the court granted fields to serve as funding for the academy. In the seventh year of Xianchun (1271) during the Southern Song Dynasty, it was relocated to the foot of Gulong Mountain in Jintan County."
 building_type_TK_20_23_JiXiaXueGong: "Academy University"
 building_type_TK_20_23_JiXiaXueGong_desc: "Academy University"
 TK_20_23_JiXiaXueGong: "Jixia Academy"
 building_TK_20_23_JiXiaXueGong: "$TK_20_23_JiXiaXueGong$"
 building_TK_20_23_JiXiaXueGong_desc: "The Jixia Academy was a prestigious institution of higher learning in the State of Qi during the Warring States period, named for its location near the Ji Gate in Linzi (now part of Zibo City, Shandong Province). The academy gathered scholars from various schools of thought, including Daoism, Confucianism, and Legalism, and held regular academic gatherings where debates were conducted on topics such as \"the White Horse is not a Horse.\" It also attracted numerous wandering scholars collectively known as Xueshi; those with more seniority were addressed as Mr., while those who received special reverence were honored as Teachers. The scholars were generously treated by the King of Qi, with renowned figures like Chunyu Kun ennobled as Shang Dafu and granted high-status residences. Although they did not hold specific official positions, they could discuss state affairs and offer counsel to the monarch; furthermore, they authored works on governance, many of which were compiled into the book \"Guanzi.\""
 building_type_TK_20_23_JiXianShuYuan: "Academy University"
 building_type_TK_20_23_JiXianShuYuan_desc: "Academy University"
 TK_20_23_JiXianShuYuan: "Ji Xian Academy"
 building_TK_20_23_JiXianShuYuan: "$TK_20_23_JiXianShuYuan$"
 building_TK_20_23_JiXianShuYuan_desc: "The Jixian Academy, also known as the Lizheng Academy, is located in the Zhaowei City of Luoyang, the Eastern Capital of Tang. It is China's earliest government-run academy, established by Emperor Xuanzong of Tang in the fifth year of Kaiyuan (717 AD). As an official institution for compiling books, its primary mission was to collect, collate, and store manuscripts, making it China's first academy. In the thirteenth year of Kaiyuan (725 AD), it was renamed the Jixian Hall Academy, commonly abbreviated as \"Jixian Academy.\""
 building_type_TK_20_23_NiShanShuYuan: "Academy University"
 building_type_TK_20_23_NiShanShuYuan_desc: "Academy University"
 TK_20_23_NiShanShuYuan: "Nishan Academy"
 building_TK_20_23_NiShanShuYuan: "$TK_20_23_NiShanShuYuan$"
 building_TK_20_23_NiShanShuYuan_desc: "Nishan Confucius Temple and Academy, located at the foot of Nishan Mountain approximately 28 kilometers southeast of Qufu City, Jining City, Shandong Province, are architectural remains from the Ming to Qing dynasties. In the third year of Qingli (1043) of the Song Dynasty, the Nishan Confucius Temple developed into a place for teaching and learning; in the second year of Zhongzhi (1336) of the Yuan Dynasty, Wang Maode, Left Vice-Chancellor of the Secretariat, proposed establishing an academy at Nishan and recommended Peng Fan as its head to found the Nishan Academy. At this time, the Nishan Confucius Temple was publicly referred to as the Nishan Academy, fully possessing both sacrificial and educational functions, becoming a true integration of temple and school."
 building_type_TK_20_23_SongYangShuYuan: "Academy University"
 building_type_TK_20_23_SongYangShuYuan_desc: "Academy University"
 TK_20_23_SongYangShuYuan: "Songyang Academy"
 building_TK_20_23_SongYangShuYuan: "$TK_20_23_SongYangShuYuan$"
 building_TK_20_23_SongYangShuYuan_desc: "Songyang Academy, an ancient Chinese higher learning institution, is located 3 kilometers north of Dengfeng District in Zhengzhou City, Henan Province, at the foot of Junji Peak. Originally established in the eighth year of Taihe during the Northern Wei Dynasty (484 AD) and initially named Songyang Temple as a Buddhist monastery, it was renamed Songyang Academy during its reconstruction in the second year of Jingyou of the Song Dynasty (1035 AD), when a director was appointed to oversee its affairs. Songyang Academy is one of the birthplaces of Cheng-Zhu Neo-Confucianism in the Song Dynasty. Its architectural style serves as a model for studying ancient Chinese academy architecture, educational systems, and Confucian culture."
 building_type_TK_20_23_YuLuShuYuan: "Academy University"
 building_type_TK_20_23_YuLuShuYuan_desc: "Academy University"
 TK_20_23_YuLuShuYuan: "Yuelu Academy"
 building_TK_20_23_YuLuShuYuan: "$TK_20_23_YuLuShuYuan$"
 building_TK_20_23_YuLuShuYuan_desc: "Yuelu Academy is one of the four most renowned academies in Chinese history. Situated at the foot of Yuelu Mountain on the west bank of the Xiang River in Changsha, Hunan—a historic and cultural city of China—it ranks among the world's oldest institutions of higher learning. In the ninth year of Kaibao during the Northern Song Dynasty (976 AD), Zhu Dong, the Administrator of Tanzhou, officially established Yuelu Academy with government funding, building upon a foundation laid by monks who had previously operated a school."
 building_type_TK_20_23_YingTianShuYuan: "Academy University"
 building_type_TK_20_23_YingTianShuYuan_desc: "Academy University"
 TK_20_23_YingTianShuYuan: "Yingtian Academy"
 building_TK_20_23_YingTianShuYuan: "$TK_20_23_YingTianShuYuan$"
 building_TK_20_23_YingTianShuYuan_desc: "Yingtian Prefecture Academy, also known as Yingtian Academy, Suiyang Academy, Nanjing Academy, Nandu Academy, and Nanjing Imperial Academy of Learning, is located on the southern shore of Shiqiang Ancient City in Suiyang District, Shangqiu City, Henan Province. It is one of the Four Great Academies of ancient China. The private Suiyang School was founded by Yang Que during the Tianfu era of Later Jin (936–947 AD). In the second year of Dazhong Xingfu (1009 AD), after expansion, it was granted the title \"Yingtian Prefecture Academy.\" Historical records state: \"The establishment of schools in prefectures and commanderies began here.\""
 building_type_TK_20_23_AnDingShuYuan: "Academy University"
 building_type_TK_20_23_AnDingShuYuan_desc: "Academy University"
 TK_20_23_AnDingShuYuan: "Anding Academy"
 building_TK_20_23_AnDingShuYuan: "$TK_20_23_AnDingShuYuan$"
 building_TK_20_23_AnDingShuYuan_desc: "Anding Academy is located within the campus of Taizhou Middle School, at 2 Yingchun West Road, Taizhou City, Jiangsu Province. Established in the second year of Baoqing during the Southern Song Dynasty (1226), it was founded by Chen Gai, the Administrator of Taizhou, on the site where Hu Yuan, an educator from the Northern Song Dynasty, previously taught. It is one of the oldest academies in Jiangsu Province. Hu Yuan was a pioneer of Neo-Confucianism in the Northern Song Dynasty; he established the educational philosophy of \"clarifying the essence and applying its utility\" here and pioneered subject-based teaching methods. A thousand-year-old ginkgo tree still stands on the original site where he taught."
 building_type_TK_20_23_WanSongShuYuan: "Academy University"
 building_type_TK_20_23_WanSongShuYuan_desc: "Academy University"
 TK_20_23_WanSongShuYuan: "Wansong Academy"
 building_TK_20_23_WanSongShuYuan: "$TK_20_23_WanSongShuYuan$"
 building_TK_20_23_WanSongShuYuan_desc: "Wansong Academy is located on Wansong Ridge north of Phoenix Mountain in Hangzhou, surrounded by mountains on three sides and water on one. Its predecessor was Bao'en Temple, constructed during the Zhengyuan reign of the Tang Dynasty (785–804 AD). In the 11th year of Hongzhi of the Ming Dynasty (1498), Zhou Mu, Right Vice Governor of Zhejiang, rebuilt Wansong Academy on the site of Bao'en Temple. He appointed Kong Qu and Kong Ji, descendants of the Southern branch of the Confucian family, to oversee academy affairs. The institution was formerly known as Taihe Academy and Fushu Academy, and it stands as the largest and longest-lasting academy in Hangzhou during the Ming and Qing dynasties."
 building_type_TK_20_23_EHuShuYuan: "Academy University"
 building_type_TK_20_23_EHuShuYuan_desc: "Academy University"
 TK_20_23_EHuShuYuan: "Ehu Academy"
 building_TK_20_23_EHuShuYuan: "$TK_20_23_EHuShuYuan$"
 building_TK_20_23_EHuShuYuan_desc: "Ehu Academy is located at the foot of Ehu Mountain in Ehu Town, Qianshan County, Shangrao. It was one of the four major academies in ancient Jiangxi. In the second year of Chunxi (1175), Zhu Xi, Lu Zuqian, Lu Jiuling, Lu Jiu Yuan and others held a joint lecture at Ehu Temple, each holding their own views, \"discussing together what they had learned,\" which became the famous \"Ehu Meeting\" in the history of philosophy. In the tenth year of Chunyou (1250), it was renamed \"Wenzong Academy.\""
 building_type_TK_20_23_LiZhengShuYuan: "Academy University"
 building_type_TK_20_23_LiZhengShuYuan_desc: "Academy University"
 TK_20_23_LiZhengShuYuan: "Lizheng Academy"
 building_TK_20_23_LiZhengShuYuan: "$TK_20_23_LiZhengShuYuan$"
 building_TK_20_23_LiZhengShuYuan_desc: "Lizheng Academy: Established in the fifth year of Kaiyuan (AD 717) by Emperor Xuanzong of Tang as the first official academy in the Eastern Capital Luoyang, followed by the creation of a similarly named Lizheng Academy in Chang'an."
 building_type_TK_20_24_YangGuangDaJinTa: "Biaojian Ruins Site"
 building_type_TK_20_24_YangGuangDaJinTa_desc: "Biaojian Ruins Site"
 TK_20_24_YangGuangDaJinTa: "Shwedagon Pagoda"
 building_TK_20_24_YangGuangDaJinTa: "$TK_20_24_YangGuangDaJinTa$"
 building_TK_20_24_YangGuangDaJinTa_desc: "The Great Golden Pagoda of Ruide Palace, also known as the Shwedagon Pagoda in Yangon, Myanmar, is a landmark Buddhist stupa situated on a sacred hill by Inya Lake. Renowned for its towering 98-meter golden appearance and magnificent scale, it stands as one of Myanmar's most sacred stupas."
 building_type_TK_20_24_WuHouCi: "Biaojian Ruins Site"
 building_type_TK_20_24_WuHouCi_desc: "Biaojian Ruins Site"
 TK_20_24_WuHouCi: "Wuhou Shrine"
 building_TK_20_24_WuHouCi: "$TK_20_24_WuHouCi$"
 building_TK_20_24_WuHouCi_desc: "The Wuhou Shrine Museum of Chengdu is located at No. 231, Wuhouci Street, Wuhou District, Chengdu City, Sichuan Province, covering an area of 150,000 square meters. The Chengdu Wuhou Shrine was first established in the third year of Huangchu (AD 222) of Emperor Wen of Wei. It is the only temple in China that enshrines together both rulers and ministers to commemorate heroes of the Shu Han regime such as Liu Bei, Zhuge Liang, Guan Yu, and Zhang Fei, and it is also the most influential museum of Three Kingdoms relics in the world."
 building_type_TK_20_24_YingXianMuTa: "Biaojian Ruins Site"
 building_type_TK_20_24_YingXianMuTa_desc: "Biaojian Ruins Site"
 TK_20_24_YingXianMuTa: "Yingxian Wooden Pagoda"
 building_TK_20_24_YingXianMuTa: "$TK_20_24_YingXianMuTa$"
 building_TK_20_24_YingXianMuTa_desc: "Buddha Palace Temple's Shakyamuni Pagoda, also known as Yingxian Wooden Pagoda, is located within the Buddha Palace Temple in Ying County, Shuozhou City, Shanxi Province. Originally constructed in the second year of Qingning during the Liao Dynasty (1056 AD), it stands as the tallest and oldest pure wooden pagoda-style structure in existence worldwide, alongside Italy's Leaning Tower of Pisa and Paris' Eiffel Tower, collectively recognized as the \"Three Wonders of the World.\""
 building_type_TK_20_24_ZhaoZhouQiao: "Biaojian Ruins Site"
 building_type_TK_20_24_ZhaoZhouQiao_desc: "Biaojian Ruins Site"
 TK_20_24_ZhaoZhouQiao: "Zhaozhou Bridge"
 building_TK_20_24_ZhaoZhouQiao: "$TK_20_24_ZhaoZhouQiao$"
 building_TK_20_24_ZhaoZhouQiao_desc: "Anji Bridge is a stone arch bridge located on the Xiao River south of Zhao County, Shijiazhuang City, Hebei Province. As Zhao County was formerly known as Zhaozhou, it is also called Zhaozhou Bridge. Locals refer to it as Dashiqiao (Great Stone Bridge) to distinguish it from Yongtong Bridge (Small Stone Bridge) outside the west gate of the city. Construction of Anji Bridge began in the Sui Dynasty, designed and built by master craftsman Li Chun. Later, Emperor Zhezong Zhao Xu of the Song Dynasty bestowed upon it the name Anji Bridge, which became its official designation."
 building_type_TK_20_24_FaShiLvGuan: "Biaojian Ruins Site"
 building_type_TK_20_24_FaShiLvGuan_desc: "Biaojian Ruins Site"
 TK_20_24_FaShiLvGuan: "Mage's Inn"
 building_TK_20_24_FaShiLvGuan: "$TK_20_24_FaShiLvGuan$"
 building_TK_20_24_FaShiLvGuan_desc: "The Hozan Ryokan is located in Katsunuma Onsen, Ishikawa Prefecture, Japan. Founded in 718, it is certified by Guinness World Records as the oldest existing inn in the world. The ownership of the inn has been passed down through generations via hereditary succession, with the eldest son inheriting the family business; today, Hozan Zen'gorō represents the 46th generation. The staff also follow a hereditary system, with young girls succeeding to manage the household operations. The architecture retains the traditional characteristics of an onsen ryokan, featuring both male and female open-air hot springs and 74 Japanese-style guest rooms. Traditional cuisine prepared using seasonal ingredients from Kaga is also offered."
 building_type_TK_20_24_GuangZhouFanFang: "Biaojian Ruins Site"
 building_type_TK_20_24_GuangZhouFanFang_desc: "Biaojian Ruins Site"
 TK_20_24_GuangZhouFanFang: "Guangzhou Fanfang"
 building_TK_20_24_GuangZhouFanFang: "$TK_20_24_GuangZhouFanFang$"
 building_TK_20_24_GuangZhouFanFang_desc: "The Fanfang was located in the area around Guangta Road, Yuexiu District, Guangzhou, covering approximately the region south of Zhongshan Road, east of Renmin Road, north of Dade Road, and west of Jiefang Road. It is said to be named so because during the Tang and Song dynasties it served as a residence for foreign merchants (in Cantonese, foreigners were referred to as \"Fanren\"). Arab and Persian merchants from the Tang Dynasty settled here, constructing the Huaisheng Mosque and Guangta Pagoda; the Guangta Pagoda was originally built in the first year of Emperor Taizong's reign (627 AD) and served both as a navigational lighthouse and a religious site. The Fanfang was administered by a Fanzhang, an official appointed by the government to oversee foreign residents, responsible for religious affairs and mediation of civil disputes. Place names such as Guangta Road and Maogang Lane retain traces of the Fanfang; Puxing Lane was originally named Buyiren Lane, indicating it was a settlement area for Arab people with the surname Bu."
 building_type_TK_20_24_DaLiShiKu: "Biaojian Ruins Site"
 building_type_TK_20_24_DaLiShiKu_desc: "Biaojian Ruins Site"
 TK_20_24_DaLiShiKu: "Three Pagodas of Dali"
 building_TK_20_24_DaLiShiKu: "$TK_20_24_DaLiShiKu$"
 building_TK_20_24_DaLiShiKu_desc: "The Three Pagodas of Dali, also known as the Chongsheng Temple Three Pagodas, are located 1.5 kilometers northwest of the ancient city of Dali, facing Mount Cangshan's Yingle Peak to the west and Erhai Lake to the east, with a distance of approximately 1,500 meters from the mountain foot. The Taoxi River flows eastward 336 meters to the south, while the Meixi is situated 76 meters to the north, and the road connecting Yunnan and Tibet lies to the east. The three pagodas consist of one large and two small structures. The main tower, named Qianxun Pagoda, was originally constructed during the reign of Queen Nanzhao Quan Fengyou (823–859 AD). It is a 16-story square blind-eave hollow brick tower, representing typical Tang Dynasty architectural style, standing 69.13 meters tall. The two smaller pagodas to the north and south feature conical outlines, embodying characteristic Song Dynasty architecture, built during the reigns of Duan Zhengyan and Duan Zhengxing of the Dali Kingdom (1108–1172 AD). The two small pagodas are spaced 97 meters apart and each stands 42.19 meters high; they are 10-story octagonal blind-eave brick towers. The three pagodas stand in a tripod formation, with Qianxun Pagoda at the center and the two smaller ones guarding to the north and south. During repairs in 1977, over 600 artifacts from the Nanzhao and Dali periods were cleared from within Qianxun Pagoda, including Buddha statues, handwritten Buddhist scriptures, and inscribed copper plates."
 building_type_TK_20_24_CangZhouTieShiZi: "Biaojian Ruins Site"
 building_type_TK_20_24_CangZhouTieShiZi_desc: "Biaojian Ruins Site"
 TK_20_24_CangZhouTieShiZi: "Cangzhou Iron Lion"
 building_TK_20_24_CangZhouTieShiZi: "$TK_20_24_CangZhouTieShiZi$"
 building_TK_20_24_CangZhouTieShiZi_desc: "The Iron Lion of Cangzhou, also known as the \"Roar that Subdues the Sea,\" is located at No. 23, Dongguan Village, Jiuzhou Town, Cangxian County, Cangzhou City, Hebei Province. It was originally constructed in the third year of Guangshun of the Later Zhou Dynasty (953 AD). The Iron Lion stands 5.78 meters tall, measures 5.34 meters in length, and has a width of 3.17 meters, with an estimated weight of approximately 40 tons. Inscriptions reading \"Lion King\" are cast on its head and beneath its neck; the interior of its belly is filled with the text of the Diamond Sutra, though much of the script has faded over time due to age. On its right flank and side, the characters \"Great Zhou Guangshun Year Three, Carefully Cast\" are inscribed, while five characters on its right rib read \"Created by Li Yun of Shandong.\" The lion carries a large basin upon its back, faces south with its tail pointing north, stands upright with head raised and chest outstretched, mouth wide open, and limbs in a walking posture. As the oldest extant cast-iron lion in China and the largest in physical dimensions, it fully demonstrates the wisdom of ancient craftsmen and their immense creativity. Cast using the mud-mold open-pouring method, it holds significant importance in the history of metallurgy worldwide and represents a milestone achievement, showcasing the high level of ancient Chinese casting technology. It serves as crucial material for studying ancient Chinese casting techniques, as well as important physical evidence for examining the development level of social productive forces and Buddhism during that period."
 building_type_TK_20_24_YueYangLou: "Biaojian Ruins Site"
 building_type_TK_20_24_YueYangLou_desc: "Biaojian Ruins Site"
 TK_20_24_YueYangLou: "Yueyang Tower"
 building_TK_20_24_YueYangLou: "$TK_20_24_YueYangLou$"
 building_TK_20_24_YueYangLou_desc: "Yueyang Tower, located on the west gate of Yueyang City in Hunan Province and adjacent to Dongting Lake, stands at a total height of 19.42 meters, with a depth of 14.54 meters and a width of 17.42 meters. It was originally constructed during the Three Kingdoms period under Eastern Wu (229–280 AD). The tower has gained worldwide fame due to verses by Tang Dynasty poets Du Fu and Meng Haoran, earning it the title \"Dongting's waters are unrivaled, Yueyang's towers unmatched.\" The existing structure was rebuilt on May 1, 1984."
 building_type_TK_20_24_HuangHeLou: "Biaojian Ruins Site"
 building_type_TK_20_24_HuangHeLou_desc: "Biaojian Ruins Site"
 TK_20_24_HuangHeLou: "Yellow Crane Tower"
 building_TK_20_24_HuangHeLou: "$TK_20_24_HuangHeLou$"
 building_TK_20_24_HuangHeLou_desc: "Yellow Crane Tower, located atop She Mountain in Wuchang District, Wuhan City, Hubei Province, stands 51.4 meters tall, with a base width of 30 meters and a top floor width of 18 meters. It was originally constructed during the second year of Huangwu in the Three Kingdoms period (223 AD). The tower gained worldwide fame due to the immortal verses by Tang Dynasty poets Li Bai and Cui Hao, earning it the titles \"The First Tower Under Heaven\" and \"The Scenery Beyond Compare.\" The existing Yellow Crane Tower was rebuilt in June 1985."
 building_type_TK_20_24_TengWangGe: "Biaojian Ruins Site"
 building_type_TK_20_24_TengWangGe_desc: "Biaojian Ruins Site"
 TK_20_24_TengWangGe: "Tengwang Pavilion"
 building_TK_20_24_TengWangGe: "$TK_20_24_TengWangGe$"
 building_TK_20_24_TengWangGe_desc: "Tengwang Pavilion, located on the east bank of the Gan River along Jiangyuan Road in the northwest of Donghu District, Nanchang City, Jiangxi Province, features a main structure with a net height of 57.5 meters and a floor area of 13,000 square meters. It was originally constructed in the fourth year of Yonghui during the Tang Dynasty (653 AD). Named Tengwang Pavilion because it was built when Teng Wang Li Yuanying served as the Governor of Hongzhou, it belongs to the category of ancient Chinese imperial pavilions for music and dance. The pavilion gained worldwide fame due to the classic lines from \"Preface to the Prince Teng\" by Wang Bo, the foremost talent among the Four Great Masters of the Early Tang Dynasty, and is hailed as the \"First Pavilion of the West River.\" The existing Tengwang Pavilion was rebuilt on October 8, 1989."
 building_type_TK_20_24_PengLaiGe: "Biaojian Ruins Site"
 building_type_TK_20_24_PengLaiGe_desc: "Biaojian Ruins Site"
 TK_20_24_PengLaiGe: "Penglai Pavilion"
 building_TK_20_24_PengLaiGe: "$TK_20_24_PengLaiGe$"
 building_TK_20_24_PengLaiGe_desc: "Penglai Pavilion, located at No. 7 Yingbin Road, Penglai District, Yantai City, Shandong Province within the Penglai Water City scenic area, stands atop Danxia Mountain. Originally constructed in the sixth year of Jiayou during the Northern Song Dynasty (1061), it has undergone repeated repairs throughout history without reconstruction and still retains its original appearance from the Northern Song era. Renowned worldwide for the legend of \"The Eight Immortals Crossing the Sea\" and the spectacle of \"Mirage,\" eight of the \"Ten Scenic Views of Penglai\" are situated at Penglai Pavilion. Since ancient times, it has been hailed as a \"Fairyland on Earth.\" Together with Yueyang Tower in Yueyang, Hunan; Tengwang Pavilion in Nanchang, Jiangxi; and Yellow Crane Tower in Wuhan, Hubei, it is known as one of the \"Four Famous Towers of China\" and ranks among the \"Ten Most Historically and Culturally Significant Towers of China.\" It is also famously called the \"First Pavilion North of the Yangtze River.\""
 building_type_TK_20_24_GuanQueLou: "Biaojian Ruins Site"
 building_type_TK_20_24_GuanQueLou_desc: "Biaojian Ruins Site"
 TK_20_24_GuanQueLou: "Suanque Tower"
 building_TK_20_24_GuanQueLou: "$TK_20_24_GuanQueLou$"
 building_TK_20_24_GuanQueLou_desc: "The Swan Goose Tower, also known as the Swan Sparrow Tower, derives its name from swans and sparrows that occasionally perch upon it. Situated on the banks of the Yellow River west of the ancient city of Puzhou in Yongji, Shanxi, at the junction of Shanxi, Shaanxi, and Henan provinces, this structure became renowned throughout the world after Tang Dynasty poet Wang Zhihuan's poem \"Climbing the Swan Goose Tower\": \"The white sun sets behind the mountains; the Yellow River flows into the sea. To see a thousand miles further, climb one more storey.\" It stands as an iconic landmark of the Yellow River basin. Originally constructed during the Northern Zhou period, approximately between 557 and 581 AD, by Northern Zhou Grand General Yuwen Hu, it served as a military watchtower. The tower survived through the Tang and Song dynasties for roughly seven hundred years before being destroyed in war at the beginning of the Yuan Dynasty. It was first restored in 1997 and officially opened to visitors in September 2002."
 building_type_TK_20_30_MingTiaoZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_MingTiaoZhiZhan_desc: "Ancient Battlefield"
 TK_20_30_MingTiaoZhiZhan: "Battle of Mingtiao"
 building_TK_20_30_MingTiaoZhiZhan: "$TK_20_30_MingTiaoZhiZhan$"
 building_TK_20_30_MingTiaoZhiZhan_desc: "The Battle of Mingtiao was a decisive engagement fought between the Shang tribal forces led by Tang and the Xia army at Mingtiao during the war that resulted in the fall of the Xia dynasty (circa 1600 BC) at the end of the Xia period. The outcome of the war led to the collapse of the Xia dynasty, with Tang establishing China's second dynasty—the Shang dynasty."
 building_type_TK_20_30_MuYeZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_MuYeZhiZhan_desc: "Ancient Battlefield"
 TK_20_30_MuYeZhiZhan: "Battle of Muye"
 building_TK_20_30_MuYeZhiZhan: "$TK_20_30_MuYeZhiZhan$"
 building_TK_20_30_MuYeZhiZhan_desc: "The Battle of Muye was the decisive engagement in King Wu's campaign against King Zhou, where the Zhou and Shang armies clashed at Muye (south of Qixian County, north of the Wei River, near Xinxiang City). The battle ended with victory for King Wu of Zhou, bringing an end to the Shang dynasty and establishing the Zhou realm, which would last for eight hundred years."
 building_type_TK_20_30_ChangShaoZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_ChangShaoZhiZhan_desc: "Ancient Battlefield"
 TK_20_30_ChangShaoZhiZhan: "Battle of Changshao"
 building_TK_20_30_ChangShaoZhiZhan: "$TK_20_30_ChangShaoZhiZhan$"
 building_TK_20_30_ChangShaoZhiZhan_desc: "The Battle of Changshao, a campaign fought between the states of Qi and Lu during the Spring and Autumn period in China, took place at Changshao (present-day Laixi, Shandong Province) in 684 BC. The battle ended with a victory for the state of Lu, and indirectly led to peace talks between Qi and Lu several years later."
 building_type_TK_20_30_ChangPingZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_ChangPingZhiZhan_desc: "Ancient Battlefield"
 TK_20_30_ChangPingZhiZhan: "Battle of Changping"
 building_TK_20_30_ChangPingZhiZhan: "$TK_20_30_ChangPingZhiZhan$"
 building_TK_20_30_ChangPingZhiZhan_desc: "The Battle of Changping, fought between May and October of the 47th year of King Zhaoxiang of Qin (260 BC), was a conflict between the states of Qin and Zhao over control of Shangdang region, occurring in the area around Changping (northwest of Gaoping City, Jincheng, Shanxi Province). The campaign concluded with Qin forces occupying Changping and executing approximately 450,000 soldiers from the Zhao army by beheading and mass burial. Following the battle, Zhao's elite troops were nearly annihilated, leaving it unable to contend with Qin again."
 building_type_TK_20_30_GaiXiaZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_GaiXiaZhiZhan_desc: "Ancient Battlefield"
 TK_20_30_GaiXiaZhiZhan: "Battle of Gaixia"
 building_TK_20_30_GaiXiaZhiZhan: "$TK_20_30_GaiXiaZhiZhan$"
 building_TK_20_30_GaiXiaZhiZhan_desc: "The Battle of Gaixia was a decisive strategic engagement between the forces of Chu and Han at Gaixia during the twelfth month of the fifth year of Emperor Gaozu of Han (December 203 BC – January 202 BC). It marked both the conclusion of the Chu-Han Contention and the beginning of the prosperity and strength of the Han Dynasty. Furthermore, it represented a milestone turning point in Chinese history, bringing an end to the chaos following the fall of Qin, unifying China, and laying the foundation for four centuries of Han rule."
 building_type_TK_20_30_KunYangZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_KunYangZhiZhan_desc: "Ancient Battlefield"
 TK_20_30_KunYangZhiZhan: "Battle of Kunyang"
 building_TK_20_30_KunYangZhiZhan: "$TK_20_30_KunYangZhiZhan$"
 building_TK_20_30_KunYangZhiZhan_desc: "The Battle of Kunyang was a decisive engagement between the Xin and Han armies in the Central Plains region along the Kunyang line (present-day Yexian, Henan Province) during the final years of the Xin Dynasty. The battle concluded with victory for the Xuan Han, while Liu Xiu, the founding emperor of the Eastern Han, gained immense fame through this victory. It created favorable conditions for the rebel forces to advance on Luoyang and Chang'an, ultimately overthrowing the rule of Wang Mang."
 building_type_TK_20_30_ChiBiZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_ChiBiZhiZhan_desc: "Ancient Battlefield"
 TK_20_30_ChiBiZhiZhan: "Battle of Red Cliffs"
 building_TK_20_30_ChiBiZhiZhan: "$TK_20_30_ChiBiZhiZhan$"
 building_TK_20_30_ChiBiZhiZhan_desc: "The Battle of Red Cliffs refers to the campaign in which the allied forces of Sun Quan and Liu Bei, at the end of the Eastern Han Dynasty, decisively defeated Cao Cao's army along the Yangtze River near Red Cliffs (in present-day Chibi City, Hubei Province) in the 13th year of Jian'an (208 AD). This is one of the famous battles in Chinese history where a small force achieved victory over a large one and the weak over the strong. It is the most renowned of the \"Three Great Battles\" of the Three Kingdoms period, and marks another major riverine operation conducted in the Yangtze River basin following He Lu's defeat of Chu."
 building_type_TK_20_30_YiLingZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_YiLingZhiZhan_desc: "Ancient Battlefield"
 TK_20_30_YiLingZhiZhan: "Battle of Yiling"
 building_TK_20_30_YiLingZhiZhan: "$TK_20_30_YiLingZhiZhan$"
 building_TK_20_30_YiLingZhiZhan_desc: "The Battle of Yiling, also known as the Battle of Yiling or the Battle of Xiaoting, is an ancient place name located north of Yidu in Hubei Province today. It was a large-scale campaign launched by Liu Bei, the Shao Lie Emperor of Shu Han during the Three Kingdoms period, against Eastern Wu. This battle stands as a famous example of successful active defense in Chinese military history and marks the final engagement among the \"Three Great Battles\" of the Three Kingdoms era."
 building_type_TK_20_30_FeiShuiZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_FeiShuiZhiZhan_desc: "Ancient Battlefield"
 TK_20_30_FeiShuiZhiZhan: "Battle of Feishui"
 building_TK_20_30_FeiShuiZhiZhan: "$TK_20_30_FeiShuiZhiZhan$"
 building_TK_20_30_FeiShuiZhiZhan_desc: "The Battle of Feishui, fought in 383 AD between the Eastern Jin and Former Qin along the Fei River (located southeast of Shouxian, Anhui Province), was a war in which the Eastern Jin achieved a decisive victory over the Former Qin forces with only 80,000 troops against 870,000. The Battle of Feishui is a famous example of a small force defeating a large one in Chinese history. The Former Qin, possessing overwhelming superiority, was defeated by the Eastern Jin; consequently, the state declined, and various northern ethnic groups broke away from Former Qin's rule, fragmenting into several regimes led by Later Qin and Later Yan. Meanwhile, the Eastern Jin took this opportunity to launch a northern expedition, advancing its border line to the southern bank of the Yellow River."
 building_type_TK_20_30_CanHePoZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_CanHePoZhiZhan_desc: "Ancient Battlefield"
 TK_20_30_CanHePoZhiZhan: "Battle of Chanchepi"
 building_TK_20_30_CanHePoZhiZhan: "$TK_20_30_CanHePoZhiZhan$"
 building_TK_20_30_CanHePoZhiZhan_desc: "The Battle of Canhebi was a major engagement in the late period of the Sixteen Kingdoms, where Northern Wei inflicted a crushing defeat on Later Yan at Canhebi (located northeast of Liangcheng, Inner Mongolia; alternatively, in Yanggao, Shanxi). From May to November of the tenth year of Dengguo (395 AD), Crown Prince Murong Bao led an army of 80,000 Later Yan troops to attack Northern Wei. Emperor Taizu Tuoba Gui of Northern Wei adopted a strategy of \"retreating when the enemy advances, luring them deep, and delaying engagement,\" crossed the Yellow River southward, and faced the Later Yan forces across the river. The Later Yan army, exhausted by its long march and unable to achieve a quick victory, further hampered by the cooling weather and misled by rumors of Murong Chui's death, decided to withdraw. However, they were decisively defeated by Tuoba Gui's 20,000 Northern Wei troops at Canhebi. This battle accelerated the fall of Later Yan and laid the foundation for Northern Wei's unification of northern China."
 building_type_TK_20_30_BaiJiangKouZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_BaiJiangKouZhiZhan_desc: "Ancient Battlefield"
 TK_20_30_BaiJiangKouZhiZhan: "Battle of Baekgang"
 building_TK_20_30_BaiJiangKouZhiZhan: "$TK_20_30_BaiJiangKouZhiZhan$"
 building_TK_20_30_BaiJiangKouZhiZhan_desc: "The Battle of Baekgang, also known as the Battle of Hakusukinoe, refers to a naval engagement fought between Tang China and Japan from August 27 to August 28, 663, at Baekgang (the mouth of the Geum River in present-day South Korea). In 663, Japanese forces (over 40,000 troops with more than 1,000 warships) clashed with Tang forces (13,000 troops and over 170 warships) at Baekgang in the territory of Paekche. The Tang navy fully leveraged its advantages, decisively defeating the Japanese fleet, which outnumbered them in both manpower and vessels by several times. This battle stands as a classic example of a victory achieved with fewer forces against a numerically superior enemy."
 building_type_TK_20_30_XiangJiSiZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_XiangJiSiZhiZhan_desc: "Ancient Battlefield"
 TK_20_30_XiangJiSiZhiZhan: "Battle of Xiangji Temple"
 building_TK_20_30_XiangJiSiZhiZhan: "$TK_20_30_XiangJiSiZhiZhan$"
 building_TK_20_30_XiangJiSiZhiZhan_desc: "The Battle of Xiangji Temple, also known as the Battle of Feng River, took place in the winter of the 14th year of Tianbao (755 AD). The Jiedushi An Lushan rebelled against the Tang Dynasty, an event historically termed \"the An-Shi Rebellion.\" An Lushan's rebel forces won consecutive battles, captured the Eastern Capital, and breached Tongguan. Emperor Xuanzong fled Chang'an in panic, leaving Crown Prince Li Heng to manage the aftermath. The rebels seized Chang'an and proclaimed themselves emperor. In the ninth month of the second year of Zhide (757 AD), Tang forces gathered 150,000 troops and borrowed 4,000 soldiers from the Uyghur Khaganate. Upon reaching near Xiangji Temple south of Chang'an, they encountered 100,000 rebel troops led by An Shouzong and Li Guiren, generals under the An-Shi faction. After two hours of fierce combat, Tang forces captured Chang'an; the rebels were routed and fled eastward toward Tongguan. The main force of the An-Shi rebellion in the Guanzhong region was annihilated in a single day. Chang'an was swiftly recovered, enabling Emperor Suzong's plan to \"rebuild the Tang house\" to be initially realized."
 building_type_TK_20_30_GaoLiangHeZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_GaoLiangHeZhiZhan_desc: "Ancient Battlefield"
 TK_20_30_GaoLiangHeZhiZhan: "Battle of Gaoliang River"
 building_TK_20_30_GaoLiangHeZhiZhan: "$TK_20_30_GaoLiangHeZhiZhan$"
 building_TK_20_30_GaoLiangHeZhiZhan_desc: "The Battle of Gaoliang River refers to the engagement in 979 during the Taiping era of the Song dynasty, when the Song army was defeated by the Liao forces while attempting to seize Youzhou at Gaoliang River (outside Xizhimen, present-day Beijing). Emperor Song Taizong, aiming to reclaim the Sixteen Prefectures of Yan and Yun ceded by Shi Jingtang of Later Jin to the Khitan in the Five Dynasties period, launched an unprepared attack on Liao immediately after suppressing Northern Han in May of the fourth year of Taiping. Seeking to catch the enemy off guard and swiftly capture Youzhou, he moved his troops without rest or preparation. Upon learning that Youzhou was under siege, Emperor Liao Jingzong Yelu Xian urgently ordered elite cavalry reinforcements. The Liao forces counterattacked; the Song army faced enemies on three sides, fell into chaos, and retreated in full disarray, with over ten thousand killed. Emperor Song Taizong fled in a donkey-drawn carriage. This war halted the Song dynasty's unification efforts and marked the beginning of overall military disadvantage, adversely affecting future conflicts with Liao."
 building_type_TK_20_31_DuJiangYan: "Water Conservancy Project"
 building_type_TK_20_31_DuJiangYan_desc: "Water Conservancy Project"
 TK_20_31_DuJiangYan: "Dujiangyan"
 building_TK_20_31_DuJiangYan: "$TK_20_31_DuJiangYan$"
 building_TK_20_31_DuJiangYan_desc: "The Dujiangyan water conservancy project, constructed in 256 BC during the Warring States period under the command of Li Bing, Administrator of Shu Commandery in Qin. It was known as \"Jianpeng\" during the Qin dynasty; referred to as \"Duan'an Yan\" or alternatively \"Jin Di\" during the Shu Han period of the Three Kingdoms; called \"Jianwei Yan\" in the Tang dynasty. Starting from the Song dynasty, the entire Dujiangyan water conservancy system was collectively named Dujiangyan, a designation that more accurately represents the whole engineering system and has been used continuously to this day."
 building_type_TK_20_31_LingQu: "Water Conservancy Project"
 building_type_TK_20_31_LingQu_desc: "Water Conservancy Project"
 TK_20_31_LingQu: "Lingqu Canal"
 building_TK_20_31_LingQu: "$TK_20_31_LingQu$"
 building_TK_20_31_LingQu_desc: "Lingqu, formerly known as Qin Zao Qu, Ling Qu, Dou River, Xingan Canal, and Xiang-Gui Canal, is a magnificent engineering feat created by the ancient Chinese laboring people. Completed and made navigable in 214 BC, it flows from east to west, connecting the Xiang River and the Li River. It is one of the world's oldest canals and is renowned as \"the pearl of ancient hydraulic architecture.\""
 building_type_TK_20_31_KanErJing: "Water Conservancy Project"
 building_type_TK_20_31_KanErJing_desc: "Water Conservancy Project"
 TK_20_31_KanErJing: "Karez Well"
 building_TK_20_31_KanErJing: "$TK_20_31_KanErJing$"
 building_TK_20_31_KanErJing_desc: "The Kang'er Well is an underground water conservancy project created by the working people in arid regions over a long historical development. By drawing out groundwater, it transforms deserts into oases; it was known as \"Jingqu\" in ancient times. Its main working principle involves utilizing the natural slope of mountains to channel large amounts of rainwater, glacial meltwater, and snowmelt that seep underground during spring and summer to the surface for irrigation, thereby meeting the water needs for production and living in desert areas."
 building_type_TK_20_32_MoGaoKu: "Ancient Cave Inscriptions"
 building_type_TK_20_32_MoGaoKu_desc: "Ancient Cave Inscriptions"
 TK_20_32_MoGaoKu: "Mogao Caves"
 building_TK_20_32_MoGaoKu: "$TK_20_32_MoGaoKu$"
 building_TK_20_32_MoGaoKu_desc: "Mogao Grottoes, commonly known as the Thousand-Buddha Caves, were first constructed in the second year of Jianyuan of the Former Qin Dynasty (the first year of Taihe of the Eastern Jin Dynasty, i.e., 366 AD). Over ten dynasties—the Sixteen Kingdoms, Northern Wei, Western Wei, Northern Zhou, Sui, and Tang—the site continued to be developed until it was essentially completed in the Yuan Dynasty, spanning a continuous construction period of over a millennium. It stands as the world's largest and most complete repository of Buddhist art still in existence. According to legend, in 336 AD, a monk named Le Zun arrived at Mingsha Mountain. By evening, he suddenly saw the mountain shimmering with golden light, as if countless Buddha images were leaping among the peaks. The heavens and earth were silent; only the flow of light and the veil of color remained. Overwhelmed by the solemnity of this scene, Monk Le Zun experienced a sudden enlightenment. He knelt reverently and vowed aloud: from now on, he would seek alms widely and build caves here to create Buddha images, transforming this place into a sacred site for Buddhism."
 building_type_TK_20_32_YunGangShiKu: "Ancient Cave Inscriptions"
 building_type_TK_20_32_YunGangShiKu_desc: "Ancient Cave Inscriptions"
 TK_20_32_YunGangShiKu: "Yungang Grottoes"
 building_TK_20_32_YunGangShiKu: "$TK_20_32_YunGangShiKu$"
 building_TK_20_32_YunGangShiKu_desc: "Yungang Grottoes were originally known as Wuzhou (Zhou) Mountain Grotto Temple, and the name was changed to Yungang Grottoes starting in the Ming Dynasty. In the first year of the Heping era of Northern Wei (460 AD), Emperor Wen of Northern Wei revived Buddhism and commissioned the high monk Tan Yao to oversee the excavation of the grand-scale Yungang Grottoes. The grottoes were carved into the mountain, featuring a magnificent scale and imposing presence, stretching approximately 1 kilometer from east to west. The grotto area is divided into three zones—east, central, and west—following the natural contours of the mountain. There are currently 45 main caves and 209 subsidiary caves, with a total carved surface area exceeding 18,000 square meters. The tallest statues measure 17 meters, while the smallest are only 2 centimeters; there are approximately 1,100 Buddha niches and over 59,000 statues of varying sizes. According to the time of excavation, the Yungang Grottoes can be divided into three periods: early, middle, and late, each with distinct stylistic characteristics in their sculptural works. The statues within the Yungang Grottoes are grand in scale and rich in content, representing the pinnacle of Chinese stone carving art in the 5th century and hailed as a treasure trove of ancient Chinese sculptural art."
 building_type_TK_20_32_LongMenShiKu: "Ancient Cave Inscriptions"
 building_type_TK_20_32_LongMenShiKu_desc: "Ancient Cave Inscriptions"
 TK_20_32_LongMenShiKu: "Longmen Grottoes"
 building_TK_20_32_LongMenShiKu: "$TK_20_32_LongMenShiKu$"
 building_TK_20_32_LongMenShiKu_desc: "Longmen Grottoes were excavated before Emperor Xiaowen of Northern Wei moved the capital to Luoyang (493 AD). The grottoes currently house 2,345 Buddha niches, over 100,000 statues, and more than 2,800 steles with inscriptions. It is the largest repository of stone-carved art in the world with the most statues, rated by UNESCO as \"the pinnacle of Chinese stone-carved art,\" and ranks first among China's major grottoes."
 building_type_TK_20_32_DaZuShiKe: "Ancient Cave Inscriptions"
 building_type_TK_20_32_DaZuShiKe_desc: "Ancient Cave Inscriptions"
 TK_20_32_DaZuShiKe: "Dazu Rock Carvings"
 building_TK_20_32_DaZuShiKe: "$TK_20_32_DaZuShiKe$"
 building_TK_20_32_DaZuShiKe_desc: "The Dazu Rock Carvings refer to the collective term for grotto temples and statues within Dazu District. They represent a large-scale group of grotto statues integrating images from Confucianism, Buddhism, and Taoism. Initially carved in the first year of Yonghui during the early Tang Dynasty, they continued through the late Tang and Five Dynasties periods, flourished during the Song and Yuan dynasties, and saw additional carvings in the Ming and Qing eras. Ultimately, this formed a massive collection embodying the essence of Chinese rock carving art, with content reflecting the unity of Buddhism, Confucianism, and Taoism, serving as a representative example of late-period grotto art in China."
 building_type_TK_20_32_LeShanDaFu: "Ancient Cave Inscriptions"
 building_type_TK_20_32_LeShanDaFu_desc: "Ancient Cave Inscriptions"
 TK_20_32_LeShanDaFu: "Le Shan Giant Buddha"
 building_TK_20_32_LeShanDaFu: "$TK_20_32_LeShanDaFu$"
 building_TK_20_32_LeShanDaFu_desc: "The Giant Buddha of Leshan was formerly known as \"Maitreya Great Statue\" and \"Jiading Great Buddha,\" also called Lingyun Great Buddha, with the full name \"Great Maitreya Stone Statue of Jiayou Temple on Lingyun Mountain.\" Construction began in the early Kaiyuan era of the Tang Dynasty (713 AD) and continued until the nineteenth year of Zhenyuan (803 AD), spanning three generations of builders, four emperors, and ninety years before completion. The Buddha's head is level with the mountain; it stands 14.7 meters tall and 10 meters wide, features 1,051 hair buns, and has ears measuring 7 meters in length. Carved into the cliffside facing the river, the statue sits in a perilous posture with solemn divine presence and majestic grandeur. The Giant Buddha of Leshan is the largest existing cliff-carved stone statue in the world, earning the reputation: \"The mountain is one great Buddha; the Buddha is one mountain.\""
 building_type_TK_20_32_MaiJiShanShiKu: "Ancient Cave Inscriptions"
 building_type_TK_20_32_MaiJiShanShiKu_desc: "Ancient Cave Inscriptions"
 TK_20_32_MaiJiShanShiKu: "Maiji Mountain Grottoes"
 building_TK_20_32_MaiJiShanShiKu: "$TK_20_32_MaiJiShanShiKu$"
 building_TK_20_32_MaiJiShanShiKu_desc: "Maiji Mountain Grottoes are located in Maiji District, Tianshui City, Gansu Province, and serve as the core attraction of the Maiji Mountain Scenic Area. Situated at the northern end of the western section of the Qinling Mountains, Maiji Mountain is an isolated peak within the Xiaolongshan range, standing 142 meters tall. It derives its name from its resemblance to a farmer's stack of wheat. Along with Mogao Grottoes, Longmen Grottoes, and Yungang Grottoes, Maiji Mountain Grottoes are collectively known as China's Four Great Grottoes. Construction began during the Later Qin period of the Sixteen Kingdoms (384–417 AD) and continued through more than ten dynasties—including Northern Wei, Western Wei, Northern Zhou, Sui, Tang, Five Dynasties, Song, Yuan, Ming, and Qing—spanning over 1,600 years of excavation and restoration. Today, there remain 221 grottoes and niches, housing 3,938 statues comprising 10,632 figures, with murals covering an area of 979.54 square meters. The preserved sculptures at Maiji Mountain Grottoes are predominantly earthen figurines, retaining abundant physical materials related to religion, art, and architecture. These works reflect the characteristics of sculptural styles across various eras over more than a millennium, illustrating the development and evolution of Chinese earthen sculpture art. They enrich China's ancient cultural history and provide rich data and historical facts for later research into Chinese Buddhist culture, earning Maiji Mountain Grottoes the esteemed title of \"Museum of Eastern Sculpture.\""
 building_type_TK_20_36_YanMenGuan: "Dangerous Passes"
 building_type_TK_20_36_YanMenGuan_desc: "Dangerous Passes"
 TK_20_36_YanMenGuan: "Yanmen Pass"
 building_TK_20_36_YanMenGuan: "$TK_20_36_YanMenGuan$"
 building_TK_20_36_YanMenGuan_desc: "Yanmen Pass is a crucial fortress on the Great Wall, renowned for its \"dangerous\" terrain and hailed as the \"First Pass of China.\" It is said to be the foremost among the \"Nine Fortresses Under Heaven,\" with the phrase \"Among the Nine Fortresses, Yanmen Ranks First.\" Together with Ningwu Pass and Piantou Pass, it forms the \"Outer Three Passes.\""
 building_type_TK_20_36_YuMenGuan: "Dangerous Passes"
 building_type_TK_20_36_YuMenGuan_desc: "Dangerous Passes"
 TK_20_36_YuMenGuan: "Yumen Pass"
 building_TK_20_36_YuMenGuan: "$TK_20_36_YuMenGuan$"
 building_TK_20_36_YuMenGuan_desc: "The ruins of Yumen Pass are located at Xiaofangpan City northwest of Dunhuang City, Gansu Province. Established during the reign of Emperor Wu of Han, it served as the gateway to various regions in the Western Regions during the Han Dynasty. The Great Wall between Jiuquan and Yumen was constructed during the Yuan Ding or Yuan Feng eras (116–105 BC), and Yumen Pass was presumably established at that time."
 building_type_TK_20_36_YangGuan: "Dangerous Passes"
 building_type_TK_20_36_YangGuan_desc: "Dangerous Passes"
 TK_20_36_YangGuan: "Yangguan Pass"
 building_TK_20_36_YangGuan: "$TK_20_36_YangGuan$"
 building_TK_20_36_YangGuan_desc: "Yangguan is located 70 kilometers southwest of Dunhuang City, Gansu Province. Established during the reign of Emperor Wu of the Western Han Dynasty in the first century BC, it served as one of the two gateways to the Western Regions alongside Yumen Pass and was a mandatory checkpoint on the southern route of the Silk Road. It is named so because it lies south of Yumen Pass."
 building_type_TK_20_36_JianMenGuan: "Dangerous Passes"
 building_type_TK_20_36_JianMenGuan_desc: "Dangerous Passes"
 TK_20_36_JianMenGuan: "Jianmen Pass"
 building_TK_20_36_JianMenGuan: "$TK_20_36_JianMenGuan$"
 building_TK_20_36_JianMenGuan_desc: "Jianmen Pass is a critical chokepoint on the ancient Shu Road, known as the Golden Ox Road (Stone Ox Road). Due to the opposing cliffs and peaks resembling swords while the terrain forms a gate-like appearance, it is named \"Jianmen.\""
 building_type_TK_20_36_WuGuan: "Dangerous Passes"
 building_type_TK_20_36_WuGuan_desc: "Dangerous Passes"
 TK_20_36_WuGuan: "Wuguan Pass"
 building_TK_20_36_WuGuan: "$TK_20_36_WuGuan$"
 building_TK_20_36_WuGuan_desc: "Wuguan, known as \"Shaoxi Pass\" during the Spring and Autumn Period, served as one of the \"Three Qin Fortresses\" and the \"Throat between Qin and Chu.\" Since the Spring and Autumn Period, Wuguan has always been garrisoned and remains a strategically vital location. Together with Hexi Pass, Xiaoguan, and Dasan Pass, it forms the \"Four Fortresses of Qin.\""
 building_type_TK_20_36_HuLaoGuan: "Dangerous Passes"
 building_type_TK_20_36_HuLaoGuan_desc: "Dangerous Passes"
 TK_20_36_HuLaoGuan: "Hulao Pass"
 building_TK_20_36_HuLaoGuan: "$TK_20_36_HuLaoGuan$"
 building_TK_20_36_HuLaoGuan_desc: "Hulao Pass, also known as Sishui Pass, Chenggao Pass, and the Ancient Xiaoguan, is one of the Eight Gates of Luoyang. It serves as the eastern gateway to Luoyang and a strategically vital fortress. Legend has it that Hulao Pass was named so because tigers were rarely found in Henan Province; King Mu of Zhou once imprisoned tigers there. The pass connects south with Song Mountain and borders north on the Yellow River, with crisscrossing ridges forming a natural defensive barrier. It embodies the saying \"one man can guard the pass, ten thousand cannot open it,\" making it a fiercely contested stronghold throughout history."
 building_type_TK_20_36_DaSanGuan: "Dangerous Passes"
 building_type_TK_20_36_DaSanGuan_desc: "Dangerous Passes"
 TK_20_36_DaSanGuan: "Dashan Pass"
 building_TK_20_36_DaSanGuan: "$TK_20_36_DaSanGuan$"
 building_TK_20_36_DaSanGuan_desc: "Dasan Pass, named after the Zhou Dynasty's state of San, is one of the Four Passes of Guanzhong. During the Qin and Han periods (206 BC), Liu Bang passed through here while \"openly repairing the plank roads and secretly crossing Chencang.\" In the Three Kingdoms era, Cao Cao also traversed this location during his western campaign against Zhang Lu. According to Chen Shou's *Records of the Three Kingdoms*: \"(In the sixth year of Jianxing), in spring, Liang again emerged from Dasan Pass, besieged Chengcang, and Cao Zhen resisted him.\" Dasan Pass serves as a transportation hub and holds significant strategic importance. The renowned Southern Song poet Lu You composed \"Book of Indignation,\" Part One: \"At night under snow at Guazhou Crossing, the river fleet sails; in autumn wind at Dasan Pass, iron-hoarded horses charge.\" Controlling the vital artery between north and south, it has long been known as the \"Throat of Sichuan and Shaanxi\" and a place fiercely contested by military strategists."
 building_type_TK_20_36_TongGuan: "Dangerous Passes"
 building_type_TK_20_36_TongGuan_desc: "Dangerous Passes"
 TK_20_36_TongGuan: "Tongguan Pass"
 building_TK_20_36_TongGuan: "$TK_20_36_TongGuan$"
 building_TK_20_36_TongGuan_desc: "Tongguan faces the Yellow River to the north and overlooks the mountain ridge to the south. The Shuijing Zhu records: \"The river flows south within the pass, surging against Tongguan Mountain; hence it is called Tongguan.\" In the past, people often likened its strategic importance with phrases such as \"a narrow path contending with monkeys\" and \"the perilous road of the human world ends at Tongguan.\" Situated at a crossing on the Yellow River, Tongguan occupies a critical junction connecting Shanxi, Shaanxi, and Henan provinces, controlling the vital post-road between Chang'an and Luoyang. As the key to entering and exiting the Three Qin region, it has long served as an indispensable passage for moving east into the Central Plains or west toward Guanzhong and the Western Regions, making it a strategically contested stronghold since the late Han dynasty. It is renowned as \"the foremost defense within the capital region,\" \"the throat of the four strongholds,\" and \"the hundred-and-two-layered pass.\""
 building_type_TK_20_36_ShanHaiGuan: "Dangerous Passes"
 building_type_TK_20_36_ShanHaiGuan_desc: "Dangerous Passes"
 TK_20_36_ShanHaiGuan: "Shanhaiguan"
 building_TK_20_36_ShanHaiGuan: "$TK_20_36_ShanHaiGuan$"
 building_TK_20_36_ShanHaiGuan_desc: "Shanhaiguan, also known as Yuguan, Yuguan, and Linlvguan, is one of the northeastern passes of the Ming Great Wall and is regarded as its eastern starting point. It is famously called one of the \"Three Marvels of China's Great Wall\" (Shanhaiguan in the east, Zhenbeitai in the center, and Jiayuguan in the west), the \"First Pass Under Heaven,\" and the \"Throat of the Border Commandery and the Bulwark of the Capital.\" Echoing across ten thousand li with Jiayuguan, it has become renowned throughout the world."
 building_type_TK_20_36_XiaoGuan: "Dangerous Passes"
 building_type_TK_20_36_XiaoGuan_desc: "Dangerous Passes"
 TK_20_36_XiaoGuan: "Xiaoguan Pass"
 building_TK_20_36_XiaoGuan: "$TK_20_36_XiaoGuan$"
 building_TK_20_36_XiaoGuan_desc: "Xiaoguan: One of the four major passes guarding Guanzhong, located southeast of Guyuan in Ningxia Hui Autonomous Region today. The Liupan Mountain range stretches across the northwest of Guanzhong, serving as its northwestern barrier. The main routes from Longshang into Guanzhong are river valleys carved by rivers such as the Wei River and Jing River."
 building_type_TK_20_37_QuanZhouGang: "Harbor Crossing"
 building_type_TK_20_37_QuanZhouGang_desc: "Harbor Crossing"
 TK_20_37_QuanZhouGang: "Quanzhou Port"
 building_TK_20_37_QuanZhouGang: "$TK_20_37_QuanZhouGang$"
 building_TK_20_37_QuanZhouGang_desc: "Quanzhou Port, originally known as Zaiton Port, is a harbor located within Quanzhou City in Fujian Province, China. Situated on the coastal bay at the lower reaches of the Jinjiang River southeast of Quanzhou, its northern boundary extends to Neizao Bay in Meizhou Bay, Quanzhou, while its southern limit reaches Tong'an County's Lianhe Bay in Weitou Bay, Quanzhou. During the Southern and Northern Dynasties period, Indian monk Gunarattha visited Quanzhou twice: first in the second year of Yongding under Emperor Wu of Chen (558 AD), and again in the sixth year of Tianjia under Emperor Wen of Chen (565 AD). He translated the Diamond Sutra on Jiuri Mountain in the western suburbs of Quanzhou, then departed from Quanzhou by ship to reach Lankapuri Kingdom (present-day Malay Peninsula) and Ujjaini Kingdom (present-day India), marking the beginning of Quanzhou Port's name. The port developed further during the Tang Dynasty, expanded in the Five Dynasties period, and reached its peak prosperity during the Song Dynasty."
 building_type_TK_20_37_BoDuoGang: "Harbor Crossing"
 building_type_TK_20_37_BoDuoGang_desc: "Harbor Crossing"
 TK_20_37_BoDuoGang: "Bodao Port"
 building_TK_20_37_BoDuoGang: "$TK_20_37_BoDuoGang$"
 building_TK_20_37_BoDuoGang_desc: "Bosdo Port is located within Bosdo Bay in the northwest of Kyushu, Japan, adjacent to Fukuoka City. It lies 126 nautical miles west of Sasebo, approximately 500 nautical miles from Shanghai, about 120 nautical miles northwest of Busan, and roughly 60 nautical miles from Northern Kyushu, bordering the Korea Strait international shipping lane. Following the Taika Reform in Japan in 642, the Dazaifu was established, and Bosdo Port subsequently developed accordingly."
 building_type_TK_20_37_BiLanDu: "Harbor Crossing"
 building_type_TK_20_37_BiLanDu_desc: "Harbor Crossing"
 TK_20_37_BiLanDu: "Bilan Ferry"
 building_TK_20_37_BiLanDu: "$TK_20_37_BiLanDu$"
 building_TK_20_37_BiLanDu_desc: "Byeongnando is a ferry port on the Ryesong River in the western outskirts of Kaesong on the Korean Peninsula. As the principal port for foreign trade during the unified Goryeo period under the Wang dynasty, it contributed greatly to Goryeo's economic prosperity."
 building_type_TK_20_40_DongYueTaiShan: "Five Great Mountains"
 building_type_TK_20_40_DongYueTaiShan_desc: "Five Great Mountains"
 TK_20_40_DongYueTaiShan: "Mount Tai in the East"
 building_TK_20_40_DongYueTaiShan: "$TK_20_40_DongYueTaiShan$"
 building_TK_20_40_DongYueTaiShan_desc: "Mount Tai, also known as Daisan, Daizong, Daiyue, Dongyue, and Taiyue, is one of the Five Great Mountains. It is hailed as the \"Head of the Five Great Mountains,\" \"The Sole Sovereign of the Five Great Mountains,\" and \"The First Mountain Under Heaven.\" Scholars both within China and abroad have referred to it as \"China's Olympus.\" Accompanying Chinese civilization for five millennia, Mount Tai embodies the symbols of national prosperity and the survival of the nation. It serves as the spiritual homeland of the Chinese people and has been the primary site for imperial sacrifices to heaven, ancestral worship, and Fengshan ceremonies throughout history."
 building_type_TK_20_40_NanYueHengShan: "Five Great Mountains"
 building_type_TK_20_40_NanYueHengShan_desc: "Five Great Mountains"
 TK_20_40_NanYueHengShan: "Nanyue Hengshan"
 building_TK_20_40_NanYueHengShan: "$TK_20_40_NanYueHengShan$"
 building_TK_20_40_NanYueHengShan_desc: "Nanyue Hengshan, also known as Nanyue, Shouyue, and Nanshan, is primarily located in the Nanyue District of Hengyang City, Hengshan County, and eastern Hengyang County in Hunan Province. According to the \"Gan Shi Xing Jing\" from the Warring States period, it is named Hengshan because it lies under the Zhen star of the Twenty-Eight Mansions; as it \"responds to the balance of heaven and earth\" and \"weighs virtue and regulates things,\" it resembles a weighing instrument capable of measuring the heavens and earth."
 building_type_TK_20_40_XiYueHuaShan: "Five Great Mountains"
 building_type_TK_20_40_XiYueHuaShan_desc: "Five Great Mountains"
 TK_20_40_XiYueHuaShan: "West Peak Mount Hua"
 building_TK_20_40_XiYueHuaShan: "$TK_20_40_XiYueHuaShan$"
 building_TK_20_40_XiYueHuaShan_desc: "Mount Hua, the Western Peak, was anciently known as \"Western Peak\" and elegantly referred to as \"Taihua Mountain.\" It is one of China's five famous peaks. Mount Hua is the cradle of Chinese civilization; the character \"Hua\" in terms like \"Zhonghua\" (China) and \"Huaxia\" originates from this mountain, hence its title as the \"Root of Huaxia.\" Additionally, Mount Hua is a sacred mountain for worship, where emperors such as Qin Shi Huang, Emperor Wu of Han, Wu Zetian, and Emperor Xuanzong of Tang conducted large-scale sacrificial ceremonies. Furthermore, Mount Hua is one of the birthplaces of the Quanzhen school of Taoism."
 building_type_TK_20_40_BeiYueHengShan: "Five Great Mountains"
 building_type_TK_20_40_BeiYueHengShan_desc: "Five Great Mountains"
 TK_20_40_BeiYueHengShan: "North Peak Heng Mountain"
 building_TK_20_40_BeiYueHengShan: "$TK_20_40_BeiYueHengShan$"
 building_TK_20_40_BeiYueHengShan_desc: "Mount Heng of the North, also known as \"Taiheng Mountain,\" was historically called Xuanwu Mountain, Guo Mountain, Gaoshan Mountain, Xuan Yue, and others. It was officially designated as one of the Five Great Mountains in the late Ming to early Qing dynasties. In the early Qing dynasty, state sacrifices to Mount Heng gradually shifted from Quyang, Hebei Province, to Hunyuan Heng Mountain, integrating the culture of the Five Great Mountains into that of Heng Mountain. Anciently, this region served as a vital passage connecting the Datong Basin through Daoma Pass and Zijin Pass to the Hebei Plain. Its main peak, Tianfengling, is hailed as \"the Northern Pillar Supporting Heaven and Man\" and \"a majestic mountain beyond the frontier.\" With its towering ridges rising majestically, it is revered as the supreme lord of all mountains in the northern realm."
 building_type_TK_20_40_ZhongYueSongShan: "Five Great Mountains"
 building_type_TK_20_40_ZhongYueSongShan_desc: "Five Great Mountains"
 TK_20_40_ZhongYueSongShan: "Zhongyue Songshan"
 building_TK_20_40_ZhongYueSongShan: "$TK_20_40_ZhongYueSongShan$"
 building_TK_20_40_ZhongYueSongShan_desc: "Zhongyue Songshan, one of the Five Great Mountains, is a subsidiary range extending eastward from the Qinling Mountain system. It comprises 72 peaks, with Taishi Mountain and Shaoshi Mountain each accounting for thirty-six. As early as the time of Xia Yu, it was known as Songgao or Chongshan; during the reign of Shang Tang, it was called Songgao; in the Western Zhou dynasty, it was referred to as Tianshi Mountain. After King Ping relocated the capital to Luoyang in 770 BCE, he designated Songshan as \"the center between Zhong, with Daito on the left and Hua on the right,\" making it the \"Center of Heaven and Earth,\" thus naming it Zhongyue Songshan. Revered as the \"Central Mountain of Huaxia,\" it stands as one of China's significant geographical symbols; furthermore, it has long been the preferred site for imperial sacrifices and fengshan tours across successive dynasties."
 building_type_TK_20_41_HuangShan: "Famous Mountains"
 building_type_TK_20_41_HuangShan_desc: "Famous Mountains"
 TK_20_41_HuangShan: "Huangshan"
 building_TK_20_41_HuangShan: "$TK_20_41_HuangShan$"
 building_TK_20_41_HuangShan_desc: "Originally named Xishan, Huangshan derives its name from the dark green-black hue of its peaks and cliffs, which appear deep blue when viewed from afar. Along with the Yangtze River, the Great Wall, and the Yellow River, it stands as an outstanding symbol of China's majestic landscape and brilliant culture, hailed as \"the Fairyland on Earth\" and \"the world's most extraordinary mountain.\" Beyond its famous Four Wonders, Huangshan also boasts the legendary \"Thirty-Six Major Peaks and Thirty-Six Minor Peaks.\""
 building_type_TK_20_41_LuShan: "Famous Mountains"
 building_type_TK_20_41_LuShan_desc: "Famous Mountains"
 TK_20_41_LuShan: "Lushan"
 building_TK_20_41_LuShan: "$TK_20_41_LuShan$"
 building_TK_20_41_LuShan_desc: "Lushan is also known as Kuang Mountain and Kuanglu; it has other aliases such as South Zhang Mountain and Emperor's Zhang. According to the \"Records of the Grand Historian\" by Sima Qian of the Han Dynasty: \"I ascended Lushan to the south and observed Yu dredging the nine rivers.\" From then on, it acquired its name. Lushan is renowned worldwide for its majesty, uniqueness, perilousness, and beauty, hailed as the \"Holy Mountain of Human Culture,\" and has long been praised with the reputation that \"Kuanglu's unique beauty ranks first under heaven.\""
 building_type_TK_20_41_ShenNongShan: "Famous Mountains"
 building_type_TK_20_41_ShenNongShan_desc: "Famous Mountains"
 TK_20_41_ShenNongShan: "Shennong Mountain"
 building_TK_20_41_ShenNongShan: "$TK_20_41_ShenNongShan$"
 building_TK_20_41_ShenNongShan_desc: "Shennong Mountain is a mountainous area that embodies grandeur, peril, uniqueness, beauty, seclusion, and divinity. It derives its name from the fact that Yan Di Shennong distinguished five grains and tasted hundreds of herbs here, as well as established an altar to sacrifice to heaven. Notable attractions in the Shennong Mountain Scenic Area include Longji Great Wall, Zijinding Peak, and Jingying Lake."
 building_type_TK_20_41_LaoJunShan: "Famous Mountains"
 building_type_TK_20_41_LaoJunShan_desc: "Famous Mountains"
 TK_20_41_LaoJunShan: "Laoshan Mountain"
 building_TK_20_41_LaoJunShan: "$TK_20_41_LaoJunShan$"
 building_TK_20_41_LaoJunShan_desc: "Laoshan Mountain, originally known as Jingshi Mountain, is the main peak of the 800-li Funiu Mountains, a continuation of the Qinling range. It is hailed as \"the unparalleled sacred realm under heaven and the world's foremost immortal mountain.\" During the Spring and Autumn Period, Laozi Li Er, universally recognized as the founder of Taoism, retired here to cultivate, transforming it into the \"source of the Way\" and the \"ancestral temple.\" With over two millennia of cultural history, it stands as the oldest mountain range in Taoism."
 building_type_TK_20_41_WuDangShan: "Famous Mountains"
 building_type_TK_20_41_WuDangShan_desc: "Famous Mountains"
 TK_20_41_WuDangShan: "Wudang Mountain"
 building_TK_20_41_WuDangShan: "$TK_20_41_WuDangShan$"
 building_TK_20_41_WuDangShan_desc: "Mount Wudang, also known as Taihe Mountain, Xieluo Mountain, Canshangshan, and Xianshishan, was historically referred to as \"Taiyue,\" \"Xuan Yue,\" and \"Dayue.\" It is one of the Five Immortal Mountains of Taoism. During the Ming Dynasty, Mount Wudang was bestowed by the emperor with the titles \"Dayue\" and \"Zhishi Xuan Yue,\" and revered as the \"Imperial Family Temple.\" Renowned worldwide for its status as the \"Crown of the Five Great Mountains,\" symbolized by the phrase \"The Four Great Mountains all bow in reverence, while the Five Immortal Peaks of the five directions all pay homage,\" it is a sacred mountain of Taoism and the birthplace of Wudang martial arts. It is hailed as an unparalleled realm since ancient times and the number one immortal mountain under heaven."
 building_type_TK_20_41_LongHuShan: "Famous Mountains"
 building_type_TK_20_41_LongHuShan_desc: "Famous Mountains"
 TK_20_41_LongHuShan: "Longhu Mountain"
 building_TK_20_41_LongHuShan: "$TK_20_41_LongHuShan$"
 building_TK_20_41_LongHuShan_desc: "Longhu Mountain is the birthplace of Taoism in China, one of the Four Great Sacred Mountains and Five Immortal Mountains of Taoism. Along with its status as a Taoist holy site, its emerald waters and vermilion mountains, and its ancient cliff tomb clusters, it is hailed as the \"Three Marvels.\" During the Song, Yuan, and Ming dynasties, successive Celestial Masters were bestowed the rank of \"First Grade,\" under whose leadership Longhu Mountain governed Taoism in southern Jiangnan, becoming the dissemination center of Chinese Taoism and the place where hundreds of deities received their official appointments."
 building_type_TK_20_41_QingChengShan: "Famous Mountains"
 building_type_TK_20_41_QingChengShan_desc: "Famous Mountains"
 TK_20_41_QingChengShan: "Qingcheng Mountain"
 building_TK_20_41_QingChengShan: "$TK_20_41_QingChengShan$"
 building_TK_20_41_QingChengShan_desc: "Mount Qingcheng, also known as Mount Zhangren, is said to have been the place where Ningfengzi resided and practiced Taoism during the time of Emperor Huangdi (the Yellow Emperor). He taught Emperor Huangdi the \"Dragon Ji Technique\" for controlling wind and clouds. Emperor Huangdi built an altar and honored him as the \"Zhangren of the Five Great Mountains,\" after which he became famous. It is one of the five great Taoist sacred mountains in China. In the second year of Han'an of the Eastern Han Dynasty (143 AD), Zhang Daoling arrived at Mount Qingcheng two years after completing the Twenty-Four Books of Tao, established a thatched dwelling to spread his teachings here, and founded Taoism, China's indigenous religion, making Mount Qingcheng the foremost among China's four great Taoist sacred mountains."
 building_type_TK_20_41_QiYunShan: "Famous Mountains"
 building_type_TK_20_41_QiYunShan_desc: "Famous Mountains"
 TK_20_41_QiYunShan: "Qiyun Mountain"
 building_TK_20_41_QiYunShan: "$TK_20_41_QiYunShan$"
 building_TK_20_41_QiYunShan_desc: "Qiyun Mountain, formerly known as Baiyue, derives its name from the view that its summit appears level with the clouds; it is one of the Five Immortal Mountains of Chinese Taoism. In the 15th year of Hongwu (1382), the imperial court established the Dao Hui Si in Chongshou Guan within the county seat to oversee Taoist affairs throughout the entire county; some Taoist priests on the mountain were appointed to serve in the Dao Hui Si. In the 11th year of Jiajing (1532), Zhang Tian Shi, the True Man of Zhengyi who succeeded the lineage at Longhu Mountain, resided on the mountain. Due to the miraculous response to Emperor Shizong's prayer for an heir, he was granted imperial edicts to construct the Xuantian Taisu Palace and establish the True Man Fu, with Taoist officials of various ranks assigned: the Taisu Palace was headed by a Ti Dian, the True Man Fu was staffed by a Zan Jiao and a Zhi Shi, while temples and shrines had Zhu Chi (abbot), the county established the Dao Hui Si, the prefecture set up the Dao Zheng Si, the commandery established the Dao Ji Si, and at the central hub, the highest authority was the Dao Lu Si, along with other institutions."
 building_type_TK_20_41_JingFuShan: "Famous Mountains"
 building_type_TK_20_41_JingFuShan_desc: "Famous Mountains"
 TK_20_41_JingFuShan: "Jingfushan"
 building_TK_20_41_JingFuShan: "$TK_20_41_JingFuShan$"
 building_TK_20_41_JingFuShan_desc: "Jingfushan was formerly known as Lingshan Rock, also called Xuanlong, Lingshan Rock, and Longmen; it is the mountain that assists the North Peak. It is one of the Five Immortal Mountains of Chinese Taoism. In the Yuan Dynasty, Emperor Kublai Khan issued an edict ordering Zhang Zhikuan, who served as the Director of Taoist Affairs in the Longxi Circuit, along with Deputy Director He Zhi zhen and twelve Taoist followers including Zhao Daquan, to come to Longmen Mountain. Their mission was to inherit the spiritual legacy of Qiu Chuji and pray for the prosperity of the nation, after which the mountain was named Jingfushan. The name \"Jingfu\" signifies great fortune, and it is revered as the supreme \"Hermit's Immortal Mountain\" and \"Lingshan Blessed Rock.\" Jingfushan has gained worldwide fame for its prestigious status as a magnificent landscape that stabilizes the world under the North Peak, with peaks connecting to the heavens."
 building_type_TK_20_41_MaoShan: "Famous Mountains"
 building_type_TK_20_41_MaoShan_desc: "Famous Mountains"
 TK_20_41_MaoShan: "Maoshan"
 building_TK_20_41_MaoShan: "$TK_20_41_MaoShan$"
 building_TK_20_41_MaoShan_desc: "Mao Shan, formerly known as Juqu Mountain, derives its name from the mountain's winding shape resembling the character 'Ji'; it is also called Jinling Difei Mountain. Daoists refer to it as 'the Jinling of Juqu, a blessed realm for cultivating truth and a spiritual sanctuary for achieving divinity'—one of China's Four Great Daoist Mountains. During the Western Han Dynasty, the three brothers from Mao in Xianyang, Shaanxi—Mao Ying, Mao Gu, and Mao Zhong—came to Juqu Mountain to practice cultivation and do good deeds, benefiting the people. To commemorate their merits, later generations renamed Juqu Mountain Sanmao Mountain, commonly known as Mao Shan."
 building_type_TK_20_41_WuTaiShan: "Famous Mountains"
 building_type_TK_20_41_WuTaiShan_desc: "Famous Mountains"
 TK_20_41_WuTaiShan: "Mount Wutai"
 building_TK_20_41_WuTaiShan: "$TK_20_41_WuTaiShan$"
 building_TK_20_41_WuTaiShan_desc: "Mount Wutai was formerly known as Zifu Mountain, named so because it was the residence of immortals and alchemists called Zifu; it is also referred to as the Daoist assembly place of Five Peaks Mountain. A temple named Zifu Temple was once built here, serving as a place for Taoist practitioners to cultivate. After Buddhism was introduced, it was renamed Qingliang Mountain. It is one of China's four major Buddhist sacred mountains. According to the \"Chronicles of Qingliang Mountain,\" when the Bodhisattva Manjushri of Buddhism first arrived in China, he resided in a stone basin cave, while the stone basin was located within the Xuanzhen Guan of Taoism. This indicates that at that time, Mount Wutai was inhabited by Taoists."
 building_type_TK_20_41_EMeiShan: "Famous Mountains"
 building_type_TK_20_41_EMeiShan_desc: "Famous Mountains"
 TK_20_41_EMeiShan: "Mount Emei"
 building_TK_20_41_EMeiShan: "$TK_20_41_EMeiShan$"
 building_TK_20_41_EMeiShan_desc: "Mount Emei, also known as \"Emei Mountain,\" is traditionally believed to be the spiritual ground of Bodhisattva Samantabhadra and one of China's four major Buddhist sacred mountains. Rising prominently from the plains, it stands majestic, picturesque, ancient, and mysterious. Renowned worldwide for its exquisite natural scenery, profound Buddhist culture, rich biodiversity, and unique geological formations, it is often called the \"Mountain of Immortals,\" \"Buddhist Kingdom,\" \"Kingdom of Plants,\" and \"Animal Paradise.\" It has long been celebrated with the epithet \"The Most Beautiful Mountain Under Heaven.\""
 building_type_TK_20_41_PuTuoShan: "Famous Mountains"
 building_type_TK_20_41_PuTuoShan_desc: "Famous Mountains"
 TK_20_41_PuTuoShan: "Putuo Mountain"
 building_TK_20_41_PuTuoShan: "$TK_20_41_PuTuoShan$"
 building_TK_20_41_PuTuoShan_desc: "Putuo Mountain, fully named Putuo Luojiashan, is traditionally regarded as the spiritual abode of Guanyin Bodhisattva and one of China's Four Sacred Buddhist Mountains. The name \"Putuo\" originates from Buddhist scriptures such as the Avatamsaka Sutra among sixty-eight volumes, with full names including \"Buntanluojiā\" and \"Putuoluojiā,\" which are transliterations of Sanskrit meaning \"beautiful little white flower.\" Since successive Chinese emperors predominantly established their capitals in the north, since the Yuan Dynasty this mountain has been commonly referred to as \"Nanhai Putuo.\" Putuo Mountain also enjoys the prestigious title: \"A land unmatched by imperial grace across five dynasties, and the foremost mountain revered throughout the four seas.\""
 building_type_TK_20_41_JiuHuaShan: "Famous Mountains"
 building_type_TK_20_41_JiuHuaShan_desc: "Famous Mountains"
 TK_20_41_JiuHuaShan: "Jiuhua Mountain"
 building_TK_20_41_JiuHuaShan: "$TK_20_41_JiuHuaShan$"
 building_TK_20_41_JiuHuaShan_desc: "The name Jiuhua Mountain originates from Li Bai's poem, \"Wonderful existence divides the two qi; the sacred mountain opens Jiuhua.\" It belongs to a subsidiary range of the Huangshan Mountain system. Legend has it that this is the spiritual ground of Bodhisattva Dizang, one of China's four major Buddhist mountains. Jiuhua Mountain comprises 99 peaks and over 80 temples, with more than 300 monks and nuns. Among China's four major Buddhist mountains, Jiuhua Mountain stands out uniquely, renowned both domestically and internationally for its dual titles: \"The foremost in incense offerings under heaven\" and \"The first mountain of the southeast.\""
 building_type_TK_20_41_FanJingShan: "Famous Mountains"
 building_type_TK_20_41_FanJingShan_desc: "Famous Mountains"
 TK_20_41_FanJingShan: "Fanjingshan"
 building_TK_20_41_FanJingShan: "$TK_20_41_FanJingShan$"
 building_TK_20_41_FanJingShan_desc: "Fanjingshan is recorded in the Han Dynasty as the Three Valleys, revered as a sacred mountain by the \"Wuling Man\" people. During the Tang Dynasty, it was renamed Chenshan; in the Song Dynasty, it was called Siqiong Mountain and later Fanjingshan after Buddhism spread to the region. In the early Ming Dynasty, Fanjingshan had already become a famous Buddhist mountain, known by several names including \"Jiulong Mountain,\" \"Fenzheng Mountain,\" \"Fanjingshan,\" and \"Dafoshan.\" In the Qing Dynasty, it was referred to as \"Yuejing Mountain\" or \"Zhuo Mountain.\""
 building_type_TK_20_41_KongDongShan: "Famous Mountains"
 building_type_TK_20_41_KongDongShan_desc: "Famous Mountains"
 TK_20_41_KongDongShan: "Kongtong Mountain"
 building_TK_20_41_KongDongShan: "$TK_20_41_KongDongShan$"
 building_TK_20_41_KongDongShan_desc: "Kongtong Mountain is first recorded in the Spring and Autumn period text \"Erya\": \"Northward facing the Dipper pole is Kongtong,\" generally annotated as a mountain name. In the Western Jin Dynasty, Confucian scholar Kong Huang's \"Zhou Shu\" explains that Kongtong should be the name of a powerful tribal clan during the Zhou dynasty; descendants of Qi, the ancestor of the Shang dynasty, were enfeoffed in Kung Tong, and the local mountain was thus named Kongtong Mountain. The \"Zhuangzi\" records that the Yellow Emperor asked questions from the immortal Guangchengzi on Kongtong Mountain, so early on Kongtong Mountain became one of the famous Daoist mountains, earning the reputation of \"China's First Daoist Mountain.\" Later, Kongtong Mountain's \"Three Teachings Cave\" enshrines Confucius, Laozi, and Sakyamuni; the three teachings—Confucianism, Buddhism, and Daoism—merged and coexisted on Kongtong Mountain, subsequently earning the title of one of China's most beautiful religious mountains."
 building_type_TK_20_41_XuanWuShan: "Famous Mountains"
 building_type_TK_20_41_XuanWuShan_desc: "Famous Mountains"
 TK_20_41_XuanWuShan: "Xuanwu Mountain"
 building_TK_20_41_XuanWuShan: "$TK_20_41_XuanWuShan$"
 building_TK_20_41_XuanWuShan_desc: "In the early period, Xuanwu Mountain was a hill in the northern suburbs of Jieshi Town, where a small temple was built to enshrine the deity \"Pole Star Black Tortoise, Supreme Heavenly Emperor.\" In the 27th year of Hongwu (1394), when the General of Jieshi Garrison constructed the Jieshi Garrison City, the small temple was rebuilt into the \"Xuanwu Temple.\" Later, the General of Jieshi Garrison further expanded the Xuanwu Temple, which then came to be known as \"Xuanshan Temple,\" where monks resided to practice Buddhism and worship, with incense offerings growing increasingly popular. With the expansion and prosperity of the temple, the names \"Xuanshan Temple\" and \"Xuanwu\" (an alternative title for Supreme Heavenly Emperor) began to spread, while among the common people, both the mountain and the temple were collectively referred to as \"Xuanwu Mountain,\" with additional designations such as \"Xuanshan Temple\" and \"Xuanwu Mountain Temple.\""
 building_type_TK_20_41_YanDangShan: "Famous Mountains"
 building_type_TK_20_41_YanDangShan_desc: "Famous Mountains"
 TK_20_41_YanDangShan: "Yandang Mountain"
 building_TK_20_41_YanDangShan: "$TK_20_41_YanDangShan$"
 building_TK_20_41_YanDangShan_desc: "Yandang Mountain, also known as Yanshan or Yanyan; it is divided into South Yandang Mountain and North Yandang Mountain. The area north of the Ou River fault is called North Yandang, while the area south is called South Yandang. This refers to North Yandang Mountain, which has long been renowned as \"the supreme wonder in the world\" and ranks among China's ten most famous mountains. The name \"Yandang\" originally referred to a marsh where wild geese (hongyan) nested, describing a lake atop the western peak of the original Yandang Mountain—Yanhu Lake. Due to siltation and overgrowth of grass, the lake was renamed Yanfang, and eventually the mountain itself came to be known as Yandang Mountain."
 building_type_TK_20_41_SanQingShan: "Famous Mountains"
 building_type_TK_20_41_SanQingShan_desc: "Famous Mountains"
 TK_20_41_SanQingShan: "Three Cliffs Mountain"
 building_TK_20_41_SanQingShan: "$TK_20_41_SanQingShan$"
 building_TK_20_41_SanQingShan_desc: "Qingting Mountain, also known as Shaohua Mountain and Ya Mountain, derives its name from the three peaks—Yujing, Yuxu, and Yu Hua—which resemble the seated forms of the Three Venerable Deities of Taoism: Yuqing, Shangqing, and Taiping. Taoism on Qingting Mountain originated in the Jin Dynasty when Ge Hong established a hermitage and refined elixirs on the mountain, earning him the title of \"founder\" of Qingting Mountain's Taoist tradition. During the Tang and Song dynasties, when Taoism flourished, major expansions were carried out to temples such as Laomu Palace and Gexian Temple, transforming them into one of the \"Three Pure Landscapes.\" Successive dynasties continued these expansions, and due to its proximity to Longhu Mountain, frequent exchanges occurred between immortals and alchemists. Consequently, the affairs of Qingting Mountain came under the control of the Celestial Master's Office, leading to a surge in Taoist activities. Numerous Taoist structures emerged on the mountain like bamboo shoots after rain, gradually establishing Qingting Mountain as a renowned sacred site for Taoism."
 building_type_TK_20_41_LaoShan: "Famous Mountains"
 building_type_TK_20_41_LaoShan_desc: "Famous Mountains"
 TK_20_41_LaoShan: "Laoshan"
 building_TK_20_41_LaoShan: "$TK_20_41_LaoShan$"
 building_TK_20_41_LaoShan_desc: "Laoshan was formerly known by various names such as Laoshan, Laosan, and Aoshan in ancient times. It is a renowned tourist destination in China, the highest peak along China's coastline, and holds the title of \"the First Mountain at Sea.\" Laoshan is one of the important birthplaces of Taoism in China and enjoys the reputation of being the \"Second Great Forest of True Taoism under Heaven.\" In its heyday, it was said to have nine palaces, eight observatories, and seventy-two hermitages. Since the Spring and Autumn Period, Laoshan has gathered a group of alchemists who long engaged in health cultivation and self-improvement. A Ming Dynasty record once stated that \"King Fuchai of Wu ascended Laoshan and obtained the Sacred Scripture for Delivering Humans.\" By the late Warring States Period, Laoshan had become the \"Immortal Mountain of the Eastern Sea,\" renowned throughout the realm."
 building_type_TK_20_41_ZhongNanShan: "Famous Mountains"
 building_type_TK_20_41_ZhongNanShan_desc: "Famous Mountains"
 TK_20_41_ZhongNanShan: "Zhongnan Mountain"
 building_TK_20_41_ZhongNanShan: "$TK_20_41_ZhongNanShan$"
 building_TK_20_41_ZhongNanShan_desc: "Zhongnan Mountain, also known as Taiyi Mountain, Dilung Mountain, Zhongnanshan, and Zhou Nanshan, abbreviated as Nanshan, lies south of the ancient capital Chang'an (Xi'an). It is the birthplace of allusions such as \"Longevity Comparable to Nanshan\" and \"The Shortcut via Zhongnan,\" serving as a significant geographical landmark in China. Revered as the \"Immortal Capital,\" the \"Crown of Heavenly Caves,\" and the \"World's First Blessed Land,\" Zhongnan Mountain has long been renowned for its abundance of high-ranking Daoist masters who practiced seclusion and cultivation there. Their growing mastery of Daoist methods contributed to the differentiation and evolution of Daoist schools, giving rise to the Louguan Sect, the Zhonglu Golden Elixir Sect, the Quanzhen Sect, and others. Due to the gathering of eminent Daoists and the frequent appearance of immortals, Zhongnan Mountain naturally became the origin of numerous Daoist deities and beliefs."
 building_type_TK_20_41_MangDangShan: "Famous Mountains"
 building_type_TK_20_41_MangDangShan_desc: "Famous Mountains"
 TK_20_41_MangDangShan: "Mangdang Mountain"
 building_TK_20_41_MangDangShan: "$TK_20_41_MangDangShan$"
 building_TK_20_41_MangDangShan_desc: "Mangdang Mountain was a famous quarry in ancient times. The Yellow Emperor once inspected Mangdang Mountain, and Chiyou once carried out activities there. During the Han Dynasty, many emperors established the State of Liang as fiefs; the feudal lords of Liang regarded Mangdang Mountain as their final resting place and built numerous tombs here. Consequently, tomb raiding culture flourished in later generations at this location. For example, at the end of the Han Dynasty, Cao Cao established the Golden-Digging Inspectors (Mojin Xiaowei) and the Excavation Generals (Faqiu Jiangjun) to plunder treasures from the tombs of the Han kings of Liang."
 building_type_TK_20_41_KunLunShan: "Famous Mountains"
 building_type_TK_20_41_KunLunShan_desc: "Famous Mountains"
 TK_20_41_KunLunShan: "Kunlun Mountain"
 building_TK_20_41_KunLunShan: "$TK_20_41_KunLunShan$"
 building_TK_20_41_KunLunShan_desc: "Kunlun Mountain, also known as Kunlun Xu, Kunlun Qiu, or Yushan. In Chinese Taoist culture, Kunlun Mountain is revered as the \"Ancestor of All Mountains,\" a sacred mountain in ancient Chinese mythology, and considered by Taoism to be the celestial abode of immortals. Ancient Chinese geographical works such as Shan Hai Jing, Yu Gong, and Shui Jing Zhu mention Kunlun Mountain repeatedly, with most accounts imbued with an aura of wonder."
 building_type_TK_20_41_QiLianDaXueShan: "Famous Mountains"
 building_type_TK_20_41_QiLianDaXueShan_desc: "Famous Mountains"
 TK_20_41_QiLianDaXueShan: "Qilian Great Snow Mountain"
 building_TK_20_41_QiLianDaXueShan: "$TK_20_41_QiLianDaXueShan$"
 building_TK_20_41_QiLianDaXueShan_desc: "Qilian Dashuexue Mountain is a complete small mountain range formed by an interrupted block of the Qilian Mountains, with its highest peak reaching 5,483 meters, making it the tallest landform at the northern end of the Qilian Mountains. The eastern boundary of Dashuexue Mountain faces the Shule River Gorge, the south borders the Yema River Valley, and the west extends to Gongcha Daban Pass. Due to its location in a critical passage where northwestern air currents descend directly, the area receives abundant high-altitude precipitation, rich pastures, and lush vegetation, creating a beautiful alpine pasture in the northern Changma Basin. This region also serves as the original setting for the Snow Mountain Sect in Jin Yong's novels."
 building_type_TK_20_41_ZhuMuLangMaFeng: "Famous Mountains"
 building_type_TK_20_41_ZhuMuLangMaFeng_desc: "Famous Mountains"
 TK_20_41_ZhuMuLangMaFeng: "Mount Everest"
 building_TK_20_41_ZhuMuLangMaFeng: "$TK_20_41_ZhuMuLangMaFeng$"
 building_TK_20_41_ZhuMuLangMaFeng_desc: "Mount Everest, commonly abbreviated as Zhufeng. \"Zhumulangma\" is a transliteration from Tibetan, while \"Alin\" is Manchu, meaning \"mountain peak.\" In Tibetan Buddhist scriptures, \"Zhumu\" refers to a goddess, and \"Langma\" carries multiple meanings such as \"high mountain willow,\" \"mother elephant,\" or \"third.\" Since there are four peaks near Mount Everest, with this one ranked third, it is called \"Goddess Third\" or \"Third Goddess.\" The term \"Zhumulangma\" also holds various cultural connotations: \"Mother of Heaven and Earth,\" \"Land of the Holy Mother,\" \"Palace inhabited by the five long-lived female deities,\" among others. If \"Zhumulangma Alin\" is translated literally, it means \"Goddess Peak.\""
 building_type_TK_20_41_BaiTouShan: "Famous Mountains"
 building_type_TK_20_41_BaiTouShan_desc: "Famous Mountains"
 TK_20_41_BaiTouShan: "Baishan Mountain"
 building_TK_20_41_BaiTouShan: "$TK_20_41_BaiTouShan$"
 building_TK_20_41_BaiTouShan_desc: "Changbai Mountain, one of China's Ten Famous Mountains and renowned alongside the Five Great Mountains, stands as the premier mountain in Guandong with its resplendent beauty and captivating scenery. Represented by Changbai Tianchi (Heavenly Lake), it integrates a myriad of tourist attractions including waterfalls, hot springs, canyons, underground forests, volcanic lava forests, alpine gardens, subterranean rivers, primeval forests, mist, and snow and ice, forming a dazzling and enchanting scenic landscape."
 building_type_TK_20_41_WuLiangShan: "Famous Mountains"
 building_type_TK_20_41_WuLiangShan_desc: "Famous Mountains"
 TK_20_41_WuLiangShan: "Wuliang Mountain"
 building_TK_20_41_WuLiangShan: "$TK_20_41_WuLiangShan$"
 building_TK_20_41_WuLiangShan_desc: "Wuliang Mountain was formerly known as Mengle Mountain. The climate of Wuliang Mountain is predominantly subtropical monsoon, and its high elevation has led to the development of vertical zonation, resulting in abundant flora and fauna resources. This location serves as the prototype for the Wuliang Sword Sect featured in Jin Yong's wuxia novels."
 building_type_TK_20_41_DianCangShan: "Famous Mountains"
 building_type_TK_20_41_DianCangShan_desc: "Famous Mountains"
 TK_20_41_DianCangShan: "Diancang Mountain"
 building_TK_20_41_DianCangShan: "$TK_20_41_DianCangShan$"
 building_TK_20_41_DianCangShan_desc: "Diancang Mountain, abbreviated as Cang Mountain, is named for its verdant and dark green hues. In ancient texts, it was also known as Diantang Mountain, Xiong Cang Mountain, or Dali Mountain. Diancang Mountain is the place where the terms \"Dali Limestone\" and \"Dalian Glacial Period\" originated; it is also one of the regions in northwestern Yunnan Province with the richest biodiversity. Additionally, it serves as the headquarters of the Diancang Sect featured in wuxia novels."
 building_type_TK_20_41_YaoShan: "Famous Mountains"
 building_type_TK_20_41_YaoShan_desc: "Famous Mountains"
 TK_20_41_YaoShan: "Yao Mountain"
 building_TK_20_41_YaoShan: "$TK_20_41_YaoShan$"
 building_TK_20_41_YaoShan_desc: "Yaoshan has been known by this name for a long time. The Classic of Mountains and Seas refers to it as \"Mount Dayao.\" Regarding the reason for its name, Li Daoyuan, a renowned geographer from the Northern Wei Dynasty who once served as Administrator of Luyang Commandery, stated: \"A temple dedicated to Yao was established on the Western Mountain in Luyang County; hence it is called Yaoshan.\" This means Yaoshan derives its name from the fact that Liu Lei, a descendant of Emperor Yao, erected a temple to worship his ancestors there. Yaoshan is the origin of the Yulong Hall of the Liu surname and also the hometown of Mozi, the thinker of the Warring States period."
 building_type_TK_20_41_LangJiXuShan: "Famous Mountains"
 building_type_TK_20_41_LangJiXuShan_desc: "Famous Mountains"
 TK_20_41_LangJiXuShan: "Mount Langjuxu"
 building_TK_20_41_LangJiXuShan: "$TK_20_41_LangJiXuShan$"
 building_TK_20_41_LangJiXuShan_desc: "Mount Langjuxu, an ancient mountain name. In the fourth year of Emperor Yuan's reign (119 BC), General Huo Qubing of the Western Han launched a campaign against the Xiongnu in the northern desert and achieved a decisive victory, subsequently dedicating his triumph at Mount Langjuxu. The act of dedicating one's victory at Mount Langjuxu became one of the lofty ideals for later generals to defend the realm and achieve glory against foreign tribes."
 building_type_TK_20_41_ZiJinShan: "Famous Mountains"
 building_type_TK_20_41_ZiJinShan_desc: "Famous Mountains"
 TK_20_41_ZiJinShan: "Purple Gold Mountain"
 building_TK_20_41_ZiJinShan: "$TK_20_41_ZiJinShan$"
 building_TK_20_41_ZiJinShan_desc: "Purple Mountain, formerly known as Jinling Mountain and called Zhongshan during the Han dynasty, was renamed Jiangshan by Sun Quan of the Three Kingdoms period to avoid his ancestor's taboo name. It is said that after Emperor Yuan of Jin, Sima Rui, crossed south, he frequently observed purple mist swirling around the summit, from which point it began to be called Purple Mountain. During the Southern Dynasties, it was also referred to as Beishan and Shengyou Mountain; in the Ming dynasty, Emperor Jiajing renamed it Shenlieshan in commemoration of Taizu Zhu Yuanzhang. It is the highest peak of the Ningzhen mountain range. Purple Mountain is the Mother Mountain of Nanjing and one of the Four Great Mountains of Jiangnan, renowned for its title \"Jinling Yuxiu.\""
 building_type_TK_20_41_JinGangShan: "Famous Mountains"
 building_type_TK_20_41_JinGangShan_desc: "Famous Mountains"
 TK_20_41_JinGangShan: "Jingang Mountain"
 building_TK_20_41_JinGangShan: "$TK_20_41_JinGangShan$"
 building_TK_20_41_JinGangShan_desc: "Mount Kumgang is a mountain range located at the border between North and South Korea, with most of its peaks situated within North Korea. It is known as the First Mountain of Korea. Composed of granite, its main peak reaches an elevation of 1,638 meters, making it the highest point of Taebaek Mountain. Additionally, Mount Kumgang enjoys various seasonal titles: in spring, its unique scenery resembles pure and transparent diamond, earning it the name Diamond Mountain; in summer, it is compared to Penglai and called Penglai Mountain; in autumn, the mountain is covered with red maple leaves like cinnabar, known as Maple Peak Mountain; and in winter, its strange rocks and bones appear emaciated, named Jeogok Mountain."
 building_type_TK_20_41_FuShiShan: "Famous Mountains"
 building_type_TK_20_41_FuShiShan_desc: "Famous Mountains"
 TK_20_41_FuShiShan: "Mount Fuji"
 building_TK_20_41_FuShiShan: "$TK_20_41_FuShiShan$"
 building_TK_20_41_FuShiShan_desc: "Mount Fuji was originally a volcano and one of the sacred mountains worshipped by ancient Japanese people, with over 150 recorded names for it. The combination of characters \"Fuji-san\" first appeared in the *Continued Chronicles of Japan* from the Heian period: \"On the sixth day of the seventh month of the first year of Ten-ō, Suruga Province reported: 'Ash fell on Mount Fuji.'\" However, the current meaning of \"Fuji-san\" refers to \"a mountain rich for warriors,\" a concept that emerged during the Kamakura period, the early stage of Bushido."
 building_type_TK_20_50_ChangBaiShanTianChi: "Lakes and marshes"
 building_type_TK_20_50_ChangBaiShanTianChi_desc: "Lakes and marshes"
 TK_20_50_ChangBaiShanTianChi: "Changbai Mountain Tianchi"
 building_TK_20_50_ChangBaiShanTianChi: "$TK_20_50_ChangBaiShanTianChi$"
 building_TK_20_50_ChangBaiShanTianChi_desc: "Changbai Mountain's Tianchi Lake, also known as Baodushan Tianchi Lake, is the most intact Neogene multi-causal composite volcanic lake within China and holds the title of \"the highest volcanic lake in the world.\" According to the \"Chronicles of Changbai Mountain,\" Tianchi Lake lies at the center peak of Changbai Mountain, embraced by surrounding peaks, standing approximately 20 li above ground level, hence its name. The crater walls around Tianchi Lake are steep, forming over a dozen ring-shaped mountain peaks, all exceeding an elevation of 2500 meters. Tianchi Lake serves as the source of the Songhua River, Yalu River, and Tumen River, earning it the honorary title \"Source of the Three Rivers.\""
 building_type_TK_20_50_XiHu: "Lakes and marshes"
 building_type_TK_20_50_XiHu_desc: "Lakes and marshes"
 TK_20_50_XiHu: "West Lake"
 building_TK_20_50_XiHu: "$TK_20_50_XiHu$"
 building_TK_20_50_XiHu_desc: "West Lake, also known as Qiantang Lake, is located in Xihu District, Hangzhou City, Zhejiang Province, China, and ranks among the three famous lakes of Jiangnan. Surrounded by mountains on its south, west, and north sides, it borders the urban area to the east and adjoins the Qiantang River to the south across a mountain range. The lake surface is divided into several sections by the Bai Di (White Causeway), Su Di (Su Causeway), Yang Gong Di (Yang Public Causeway), and Zhao Gong Di (Zhao Public Causeway). There are three islands within the lake. The West Lake Mountain Range, centered on West Lake, can be classified into four layers from near to far. Since ancient times, folk legends and mythological stories such as \"The Legend of the White Snake,\" \"Liang Shanbo and Zhu Yingtai,\" and \"Su Xiaoxiao\" have been passed down about West Lake. Scenes in The Legend of the White Snake, including \"Meeting at Broken Bridge\" and \"Bai Niangzi Pressed by Leifeng Pagoda,\" are connected to the Ten Scenic Views of West Lake."
 building_type_TK_20_50_QingHaiHu: "Lakes and marshes"
 building_type_TK_20_50_QingHaiHu_desc: "Lakes and marshes"
 TK_20_50_QingHaiHu: "Qinghai Lake"
 building_TK_20_50_QingHaiHu: "$TK_20_50_QingHaiHu$"
 building_TK_20_50_QingHaiHu_desc: "Qinghai Lake was formerly known as \"West Sea,\" also called \"Immortal Sea,\" \"Xian Shui Hai,\" and \"Bei He Qiang Hai.\" After the Northern Wei Dynasty, it began to be referred to as Qinghai. In Mongolian, it is called \"Kuku Nor,\" all meaning a blue or green lake. The name Qinghai Lake originated in modern times and became widely used after 1949. Qinghai Lake is China's largest plateau inland saline lake and one of the highest-altitude lakes in the world."
 building_type_TK_20_50_YunMengZe: "Lakes and marshes"
 building_type_TK_20_50_YunMengZe_desc: "Lakes and marshes"
 TK_20_50_YunMengZe: "Yunmeng Marsh"
 building_TK_20_50_YunMengZe: "$TK_20_50_YunMengZe$"
 building_TK_20_50_YunMengZe_desc: "Yunmeng Lake, also known as Yunmeng Great Marsh, is the collective name for a group of ancient lakes located on the Jianghan Plain in Hubei Province, China. During the pre-Qin period, the perimeter of this lake system was approximately 450 kilometers. Over time, due to continuous sediment deposition brought by the Yangtze River and the Han River, along with the expanding delta of the Han River, the extent of Yunmeng Lake gradually diminished. By the Wei, Jin, Northern and Southern Dynasties period, its area had already shrunk by half; during the Tang and Song dynasties, it disintegrated into a scattered network of small lakes. Subsequently, some of these small lakes gradually silted up and flattened, while others expanded. Honghu Lake is one such lake that rapidly expanded into a large lake after the mid-Qing Dynasty. Today, the ancient lake system of Yunmeng has faded into a series of separated lakes."
 building_type_TK_20_50_DongTingHu: "Lakes and marshes"
 building_type_TK_20_50_DongTingHu_desc: "Lakes and marshes"
 TK_20_50_DongTingHu: "Dongting Lake"
 building_TK_20_50_DongTingHu: "$TK_20_50_DongTingHu$"
 building_TK_20_50_DongTingHu_desc: "Historically, Dongting Lake has been known by names such as Yunmeng, Yunmeng Ze, Jiujiang, Wuzhu, Wu Hu, San Hu, Chonghu, and Taihu. It represents the southern portion of the ancient Yunmeng Ze. The \"Biography of Lady Xiang's Temple\" states: \"Dongting is one of the immortal realms; because it serves as the courtyard of Dongting, it was named Dongting. Later generations, seeing its vast expanse and the floods that overwhelmed the heavens, found no suitable name for it, so they referred to the mountain of Dongting to name the lake Dongting Lake.\" This is the origin of the name Dongting Lake."
 building_type_TK_20_50_TaiHu: "Lakes and marshes"
 building_type_TK_20_50_TaiHu_desc: "Lakes and marshes"
 TK_20_50_TaiHu: "Taihu Lake"
 building_TK_20_50_TaiHu: "$TK_20_50_TaiHu$"
 building_TK_20_50_TaiHu_desc: "Taihu Lake is located on the southern edge of the Yangtze River Delta. Anciently known as Zhenze and Juqu, it is also called Wuhu and Lizhe, and ranks among China's five major freshwater lakes. Before the Spring and Autumn and Warring States periods, the Taihu region was originally an alluvial plain of land; during the Tang Dynasty, lake waters reached the riverbank at Wujiang Tang'an. According to its classification as a coastal lagoon—geographically termed a \"lagoon\"—the continuous siltation and closure of the river mouth delta formed an enclosed lake. Combined with the gradual freshening caused by annual inflow of river water and rainfall, it ultimately became a freshwater lake; thus, Taihu is also referred to as \"the son of the sea.\""
 building_type_TK_20_50_ChaoHu: "Lakes and marshes"
 building_type_TK_20_50_ChaoHu_desc: "Lakes and marshes"
 TK_20_50_ChaoHu: "Chaohu Lake"
 building_TK_20_50_ChaoHu: "$TK_20_50_ChaoHu$"
 building_TK_20_50_ChaoHu_desc: "Chaohu Lake, also known as Jiaohu Lake, is said to have been named \"Jiaohu\" by later generations in reverence for Jiao Lao's noble character of self-sacrifice and saving others. The mountain within the lake was consequently named \"Laoshan.\" Chaohu Lake is one of China's five major freshwater lakes, resembling a precious mirror embedded in the land between the Huai and Yangtze rivers, earning it the title of \"Eight Hundred Li of Lake Sky.\""
 building_type_TK_20_50_PoYangHu: "Lakes and marshes"
 building_type_TK_20_50_PoYangHu_desc: "Lakes and marshes"
 TK_20_50_PoYangHu: "Poyang Lake"
 building_TK_20_50_PoYangHu: "$TK_20_50_PoYangHu$"
 building_TK_20_50_PoYangHu_desc: "Poyang Lake, formerly known as Pengli Ze, Pengze, Guanting Lake, Yanglan, and Danshi Lake, is China's largest freshwater lake and its second-largest lake overall, surpassed only by Qinghai Lake. According to Volume 23 of Yudi Jingsheng on Raoshu, \"There is a Poyang Mountain within the lake, hence the name Poyang Lake. The lake stretches for hundreds of li and is also called Pengli Lake.\" The Dushifangyu Jiya also states that Poyang Lake was named so during the reign of Emperor Yangdi because it was connected to Poyang Mountain, thus acquiring the designation \"Poyang.\" Whether named after the land or the mountain, both are associated with Poyang Mountain; therefore, the name Poyang Lake should have originated from ancient times."
 building_type_TK_20_50_RiYueTan: "Lakes and marshes"
 building_type_TK_20_50_RiYueTan_desc: "Lakes and marshes"
 TK_20_50_RiYueTan: "Sun Moon Lake"
 building_TK_20_50_RiYueTan: "$TK_20_50_RiYueTan$"
 building_TK_20_50_RiYueTan_desc: "Sun Moon Lake was formerly known as Shuishalian, Longhu, Shuizheda Hu, Zhutan, and Shuangtan; it is also called Shuilishzhe. Because there is a small island in the lake that appears like a pearl floating on the water when viewed from afar—named Laru Island—the northern half of the lake resembles a round sun while the southern half resembles a crescent moon, thus giving rise to the name Sun Moon Lake."
 building_type_TK_20_50_YueYaQuan: "Lakes and marshes"
 building_type_TK_20_50_YueYaQuan_desc: "Lakes and marshes"
 TK_20_50_YueYaQuan: "Moon Crescent Spring"
 building_TK_20_50_YueYaQuan: "$TK_20_50_YueYaQuan$"
 building_TK_20_50_YueYaQuan_desc: "In the Han Dynasty, this spring was known as Sha Jing (Sand Well); during the Tang Dynasty, it was called Yao Quan (Medicine Spring), and only in the Qing Dynasty did it acquire its present name, Yue Ya Quan (Crescent Moon Spring), derived from its shape resembling a crescent new moon. Historically, over one hundred rooms on the southern bank of the spring, including the Nian Niang Hall, Dragon King Palace, Bodhisattva Tower, Medicine King Cave, Jade Spring Pavilion, Thunder God Platform, and Scripture Hall, once stood from east to west before being destroyed. Among the common people, since the Han and Tang Dynasties, locals have maintained the custom of holding a \"dragon boat race\" at the spring; after the Qing Dynasty, additional folk activities emerged, including the Medicine King Temple Fair on the 28th day of the fourth lunar month, gathering mugwort by the spring on the sixth day of the sixth lunar month to boil it for bathing, and the Yue Ya Yaochi Peach Banquet."
 building_type_TK_20_50_LuGuHu: "Lakes and marshes"
 building_type_TK_20_50_LuGuHu_desc: "Lakes and marshes"
 TK_20_50_LuGuHu: "Lugu Lake"
 building_TK_20_50_LuGuHu: "$TK_20_50_LuGuHu$"
 building_TK_20_50_LuGuHu_desc: "Lugu Lake was formerly known as Ledhai and Lukuhu. In the Mosuo language of the Naxi people, \"Lu\" means mountain valley and \"Gu\" means village, so it literally translates to \"the lake in the mountain valley.\" Additionally, because a Left Post Tu Si thousand-household commandery was established on the west bank in Yuan, Ming, and Qing dynasties, and later became the Left Post Autonomous Region after liberation, it is also called Left Post Sea, commonly known as Lianghai, Lugu Lake."
 building_type_TK_20_50_SaiLiMuHu: "Lakes and marshes"
 building_type_TK_20_50_SaiLiMuHu_desc: "Lakes and marshes"
 TK_20_50_SaiLiMuHu: "Saylimu Lake"
 building_TK_20_50_SaiLiMuHu: "$TK_20_50_SaiLiMuHu$"
 building_TK_20_50_SaiLiMuHu_desc: "Saylim Lake was formerly known as \"Jinghai\" (Pure Sea) due to its crystal-clear waters. Because of its isolated terrain and cold, clear lake water, the lake lacked conditions for fish migration and survival until 1998, when cold-water species such as Coregonus nasus and Coregonus clupeaformis were introduced from Russia for aquaculture. After more than a decade of development, Saylim Lake has become an important cold-water fish production base in Xinjiang."
 building_type_TK_20_51_HuangGuoShuPuBu: "Waterfall Torrent"
 building_type_TK_20_51_HuangGuoShuPuBu_desc: "Waterfall Torrent"
 TK_20_51_HuangGuoShuPuBu: "Huangguoshu Waterfall"
 building_TK_20_51_HuangGuoShuPuBu: "$TK_20_51_HuangGuoShuPuBu$"
 building_TK_20_51_HuangGuoShuPuBu_desc: "Huangguoshu Waterfall, also known as the Great Huangguoshu Waterfall; formerly called Baishui River Waterfall, it is also named \"Huanggeshu\" Waterfall or \"Yellow Poplar Tree\" Waterfall. Myths and legends about Huangguoshu Waterfall have been passed down among the people of Guizhou since ancient times, and the name of the waterfall originates from a tree bearing \"yellow fruits\" in this mythological story. The fame of Huangguoshu Waterfall began with the Ming Dynasty traveler Xu Xiake, and through the travels and dissemination by famous figures throughout history, it has become a renowned scenic spot."
 building_type_TK_20_51_HuKouPuBu: "Waterfall Torrent"
 building_type_TK_20_51_HuKouPuBu_desc: "Waterfall Torrent"
 TK_20_51_HuKouPuBu: "Hukou Waterfall"
 building_TK_20_51_HuKouPuBu: "$TK_20_51_HuKouPuBu$"
 building_TK_20_51_HuKouPuBu_desc: "Hukou Waterfall is China's second-largest waterfall and the world's largest yellow waterfall. As the Yellow River rushes to this point, steep rock walls rise on both banks, narrowing the river mouth like a pot's mouth, hence the name Hukou Waterfall. The waterfall compresses the 300-meter-wide expanse upstream into a width of 20–30 meters within 500 meters and cascades down from a cliff more than 20 meters high, creating the spectacular scene known as \"The Thousand-Li Yellow River Gathered in One Pot.\""
 building_type_TK_20_52_QinHuaiHe: "Scenic Views on the Water"
 building_type_TK_20_52_QinHuaiHe_desc: "Scenic Views on the Water"
 TK_20_52_QinHuaiHe: "Qinhuai River"
 building_TK_20_52_QinHuaiHe: "$TK_20_52_QinHuaiHe$"
 building_TK_20_52_QinHuaiHe_desc: "The Qinhuai River, formerly known as Longzangpu and called Huishui since the Han Dynasty, was renamed Qinhuai after the Tang Dynasty. Its name became widely popular across the realm only after Du Mu's poem \"Mo Qinhuai\" from the Tang era gained fame. The Qinhuai River is also an integral part of the city's landscape; its inner stretch, known as the \"Ten Miles of Qinhuai,\" features numerous cultural and tourism attractions along its banks, including Fuzimiao Zhan Garden, Yu Garden, and Zhonghua Gate."
 building_type_TK_20_52_MiLuoJiang: "Scenic Views on the Water"
 building_type_TK_20_52_MiLuoJiang_desc: "Scenic Views on the Water"
 TK_20_52_MiLuoJiang: "Miluo River"
 building_TK_20_52_MiLuoJiang: "$TK_20_52_MiLuoJiang$"
 building_TK_20_52_MiLuoJiang_desc: "The Miluo River derives its name from the confluence of its main channel, the Mi Water, and its tributary, the Luo Water. The Shui Jing Zhu refers to it as the Ku Water. The Miluo River's fame is primarily due to Qu Yuan. At the end of the Warring States period, when Qu Yuan, a renowned statesman and poet of the State of Chu, was exiled, he once resided on Yusi Mountain by the banks of the Miluo River. In 278 BC, Qin forces breached Ying, the capital of Chu (present-day Jingzhou, Hubei Province). Feeling that saving his country was hopeless, Qu Yuan threw himself into the Miluo River and died."
 building_type_TK_20_52_LiJiang: "Scenic Views on the Water"
 building_type_TK_20_52_LiJiang_desc: "Scenic Views on the Water"
 TK_20_52_LiJiang: "Li River"
 building_TK_20_52_LiJiang: "$TK_20_52_LiJiang$"
 building_TK_20_52_LiJiang_desc: "The Li River, also known as the Liudong River, Daron River, Guijiang, Lishui, Lishui, and Lishui, traditionally originates from Ma'er Mountain on Yuechengling at the source of the Gui River. Modern hydrological definitions place its starting point at the entrance of the Lingqu Canal in Ling Town, Xing'an County, with its mouth at the Sanjiangkou in Pingle. The Li River is rich in cultural and tourism resources; the upstream Lingqu Canal, as well as the karst landscapes of Guilin along the middle and lower reaches, have brought significant economic benefits to the region."
 building_type_TK_20_60_JiuZhaiGou: "Comprehensive Scenic Area"
 building_type_TK_20_60_JiuZhaiGou_desc: "Comprehensive Scenic Area"
 TK_20_60_JiuZhaiGou: "Jiuzhaigou"
 building_TK_20_60_JiuZhaiGou: "$TK_20_60_JiuZhaiGou$"
 building_TK_20_60_JiuZhaiGou_desc: "Jiuzhaigou, officially the Jiuzhaigou Scenic Area of Aba Tibetan and Qiang Autonomous Prefecture, derives its name from the nine Tibetan villages within the scenic area (Shu Zheng, Ze Cha Wa, Hei Jiao, He Ye, Pan Ya, Ya La, Jian Pan, Re Xi, and Guo Du), also known as \"Medicine-Healing Nine Villages.\" As these nine villages have been inhabited by Tibetan residents for generations, the place is named \"Jiuzhaigou.\""
 building_type_TK_20_60_HuangLongJingQu: "Comprehensive Scenic Area"
 building_type_TK_20_60_HuangLongJingQu_desc: "Comprehensive Scenic Area"
 TK_20_60_HuangLongJingQu: "Huanglong Scenic Area"
 building_TK_20_60_HuangLongJingQu: "$TK_20_60_HuangLongJingQu$"
 building_TK_20_60_HuangLongJingQu_desc: "Huanglong Scenic Area is China's only intact plateau wetland, situated along a ridge that gradually rises from south to north. The name Huanglong originates from the legend where Fuyuan Bridge represents the dragon's tail and the Five-Colored Pools represent the dragon's head; the colorful pools shimmer like golden dragon scales, while the cascades and waterfalls resemble dancing dragon claws—thus earning its name. Its core area features over 3,000 colorful pools, with striking surface travertine landscapes characterized by intricate structures and vivid hues as the main attraction. The scenic zone comprises Huanglong Gully, Danyun Gorge, Munigou, Xuebaoding, and the Monument Garden of the Red Army's Long March."
 building_type_TK_20_61_CangShanErHai: "Scenic waters and mountains"
 building_type_TK_20_61_CangShanErHai_desc: "Scenic waters and mountains"
 TK_20_61_CangShanErHai: "Cangshan Erhai"
 building_TK_20_61_CangShanErHai: "$TK_20_61_CangShanErHai$"
 building_TK_20_61_CangShanErHai_desc: "Cangshan Erhai consists of two parts: Cangshan and Erhai. Cangshan is also known as Diancang Mountain; in ancient texts, it was referred to by other names such as Diancang Mountain, Xiong Cang Mountain, and Dali Mountain. In ancient literature, Erhai was called Yeyu Lake, Kunmi River, Xi'er River, and Xi'er River II. The old town of Dali is backed by Cangshan Mountain on the west and faces Erhai Lake on the east, forming a rare natural landscape in Dali."
 building_type_TK_20_61_TianYaHaiJiao: "Scenic waters and mountains"
 building_type_TK_20_61_TianYaHaiJiao_desc: "Scenic waters and mountains"
 TK_20_61_TianYaHaiJiao: "End of the Earth"
 building_TK_20_61_TianYaHaiJiao: "$TK_20_61_TianYaHaiJiao$"
 building_TK_20_61_TianYaHaiJiao_desc: "The scenic area is named \"Tianya Haijiao\" due to two massive rocks inscribed with the characters \"Tianya\" and \"Haijiao,\" along with the inscription \"Tianya Haijiao Scenic Area\" written by Mr. Guo Moruo. The natural landscape of the area consists of large beach cliffs, Xiamaling, Tianya Bay, as well as sandy beaches and seawater. The main attractions in the scenic area include the \"Tianya\" Rock, the \"Haijiao\" Rock, and the \"Southern Pillar of Heaven.\""
 building_type_TK_20_61_CaiShiJi: "Scenic waters and mountains"
 building_type_TK_20_61_CaiShiJi_desc: "Scenic waters and mountains"
 TK_20_61_CaiShiJi: "Caishi Jiji"
 building_TK_20_61_CaiShiJi: "$TK_20_61_CaiShiJi$"
 building_TK_20_61_CaiShiJi_desc: "Caishi Ji, officially known as the Caishi Ji Cultural and Ecological Tourism Zone in Ma'anshan City along the Yangtze River, is commonly referred to as the Caishi Ji Scenic Area. Anciently called Niuzhu Ji, it features sheer cliffs facing the river, turbulent waters, and unique rocks, ranking alongside Yueyang Chenglingji and Nanjing Yanzi Ji as one of the \"Three Jis of the Yangtze River.\" Renowned for embodying magnificence, uniqueness, elegance, and peril, it is hailed as the foremost among the three jisi and has long been celebrated as an eternal masterpiece."
 building_type_TK_20_61_GuLangYu: "Scenic waters and mountains"
 building_type_TK_20_61_GuLangYu_desc: "Scenic waters and mountains"
 TK_20_61_GuLangYu: "Gulangyu"
 building_TK_20_61_GuLangYu: "$TK_20_61_GuLangYu$"
 building_TK_20_61_GuLangYu_desc: "Gulangyu was originally named \"Yuanshazhou\" and also known as \"Yuanzhouzai\". During the Southern Song Dynasty, its name was \"Wulongyu\". In the Ming Dynasty, it was renamed \"Gulangyu\". This is because there is a reef to the southwest of the island; whenever the tide rises and water surges, waves strike the reef, producing a sound resembling a drum being beaten. People called this spot \"Gulangshi,\" and Gulangyu derived its name from it."
 building_type_TK_20_61_KeKeXiLi: "Scenic waters and mountains"
 building_type_TK_20_61_KeKeXiLi_desc: "Scenic waters and mountains"
 TK_20_61_KeKeXiLi: "Kekexili"
 building_TK_20_61_KeKeXiLi: "$TK_20_61_KeKeXiLi$"
 building_TK_20_61_KeKeXiLi_desc: "Except for the mountain ranges along the northern and southern edges, which feature high and extremely high mountains with large to medium relief, the vast majority of the area consists of mountains with small to medium relief, as well as high-altitude hills, plateaus, and plains. The reserve primarily protects rare wildlife such as Tibetan antelopes, wild yaks, Tibetan wild asses, and Tibetan gazelles. It currently hosts approximately 202 species of higher plants, distributed across 30 families and 102 genera. Rich in flora and fauna resources, it serves as a natural nature reserve."
 building_type_TK_20_61_LanYanJing: "Scenic waters and mountains"
 building_type_TK_20_61_LanYanJing_desc: "Scenic waters and mountains"
 TK_20_61_LanYanJing: "Blue eyes"
 building_TK_20_61_LanYanJing: "$TK_20_61_LanYanJing$"
 building_TK_20_61_LanYanJing_desc: "Lake Baikal, historically known in ancient China as the Northern Sea, is hailed as the \"Blue Eye of Siberia\" and also referred to as the \"Pearl of Siberia.\" In winter, the ice surface of Lake Baikal resembles a vast mirror, displaying various wondrous cracks and blue ice formations. Under the sunlight, these blue ice patches exhibit dreamlike hues, appearing like a colossal sapphire that draws numerous photography enthusiasts to capture this beautiful moment."
 building_type_TK_20_62_XuanLanJiGuang: "Natural landscapes"
 building_type_TK_20_62_XuanLanJiGuang_desc: "Natural landscapes"
 TK_20_62_XuanLanJiGuang: "Vivid Aurora"
 building_TK_20_62_XuanLanJiGuang: "$TK_20_62_XuanLanJiGuang$"
 building_TK_20_62_XuanLanJiGuang_desc: "The aurora originates from the Latin word \"Eos,\" a legend stating that Eos is the personification of dawn in Greek mythology; in Finnish, the Arctic Aurora translates directly as \"Fox Fire.\" Some Sámi and Siberian people believe the aurora comes from the wounds of the departed, yet this colorful sky is not an omen of suffering. On the contrary, it represents the bloodstains left by ghosts playing ball games or galloping on horses in the afterlife."
 building_type_TK_20_62_ChiLeChuan: "Natural landscapes"
 building_type_TK_20_62_ChiLeChuan_desc: "Natural landscapes"
 TK_20_62_ChiLeChuan: "Chile Chuan"
 building_TK_20_62_ChiLeChuan: "$TK_20_62_ChiLeChuan$"
 building_TK_20_62_ChiLeChuan_desc: "Chilechuan originally referred to the dwelling place of the Rouran people, but it is generally believed to describe the beautiful grassland scenery of \"the sky is blue, the fields are vast, and the wind blows down the grass to reveal cattle and sheep,\" as depicted in the Northern Dynasties Yuefu folk song \"Chilege\" translated from Xianbei into Chinese."
 building_type_TK_20_62_DaoChengYaDingJingQu: "Natural landscapes"
 building_type_TK_20_62_DaoChengYaDingJingQu_desc: "Natural landscapes"
 TK_20_62_DaoChengYaDingJingQu: "Daocheng Yading Scenic Area"
 building_TK_20_62_DaoChengYaDingJingQu: "$TK_20_62_DaoChengYaDingJingQu$"
 building_TK_20_62_DaoChengYaDingJingQu_desc: "The Daocheng Yading Scenic Area is known in Tibetan as \"Nianqing Gongga Rison Gongbu,\" meaning \"the holy land of the three guardian great snow mountains.\" Within the Yading scenic area, the northern peak \"Xian Nai Ri\" signifies Avalokiteshvara Bodhisattva, the southern peak \"Yang Mai Yong\" signifies Manjushri Bodhisattva, and the eastern peak \"Xuanuo Duoji\" signifies Vajrapani Bodhisattva. Daocheng Yading Scenic Area is renowned as the \"Soul of Shangri-La in China\" due to its unique landforms and pristine natural scenery, and has been hailed by international friends as \"the last pure land on the water-blue planet,\" making it a paradise for photography enthusiasts."
 building_type_TK_20_62_ShuNanZhuHai: "Natural landscapes"
 building_type_TK_20_62_ShuNanZhuHai_desc: "Natural landscapes"
 TK_20_62_ShuNanZhuHai: "Southern Sichuan Bamboo Sea"
 building_TK_20_62_ShuNanZhuHai: "$TK_20_62_ShuNanZhuHai$"
 building_TK_20_62_ShuNanZhuHai_desc: "Shunan Bamboo Sea, formerly known as Wanling Qing, features natural landscapes such as the Bamboo Sea Museum, Huaxi Thirteen Bridges, and Haizhonghai, along with cultural sites like ancient temples. It boasts the world's largest concentrated area of natural bamboo forests, earning it the nickname \"Shunan Bamboo Sea.\""
 building_type_TK_20_62_LinZhiTaoHuaYuan: "Natural landscapes"
 building_type_TK_20_62_LinZhiTaoHuaYuan_desc: "Natural landscapes"
 TK_20_62_LinZhiTaoHuaYuan: "Linzi Peach Blossom Spring"
 building_TK_20_62_LinZhiTaoHuaYuan: "$TK_20_62_LinZhiTaoHuaYuan$"
 building_TK_20_62_LinZhiTaoHuaYuan_desc: "Linzhi's Peach Blossom Spring is located in Linzhi, Tibet. Here, peach blossoms bloom in profusion like brocade, the river water shines emerald green as jade, and snow-capped peaks rise majestic and upright, breaking free from the shroud of clouds and mist. It is hailed as the \"Little Jiangnan\" of the snowy plateau."
 building_type_TK_20_62_LinHaiXueYuan: "Natural landscapes"
 building_type_TK_20_62_LinHaiXueYuan_desc: "Natural landscapes"
 TK_20_62_LinHaiXueYuan: "Forest of Snowy Plains"
 building_TK_20_62_LinHaiXueYuan: "$TK_20_62_LinHaiXueYuan$"
 building_TK_20_62_LinHaiXueYuan_desc: "The Forest of Sea and Snowy Plains lets us witness the tranquility of mountains and the purity of snow. Step into the silent forest, tread on knee-deep snowy paths, race down snow-covered slopes descending from above, and play in fairy-tale-like snow fortresses. This is a world of snow, a silver paradise. The term \"Forest of Sea and Snowy Plains\" refers to the Zhangguantai Ridge, a branch of Changbai Mountain in southeastern Heilongjiang Province, and its surrounding areas. The terrain is predominantly mountainous, with shallow hills and rolling hills, earning it the nickname \"nine-tenths mountains, half water, and half fields.\""
 building_type_TK_20_63_WuXia: "Valley Scenery"
 building_type_TK_20_63_WuXia_desc: "Valley Scenery"
 TK_20_63_WuXia: "Wu Xia Gorge"
 building_TK_20_63_WuXia: "$TK_20_63_WuXia$"
 building_TK_20_63_WuXia_desc: "The Wuxia Gorge extends from the confluence of the Danning River east of Wushan County to Guandu Kou in Badong County, spanning a total length of 46 kilometers and earning the title of \"Great Gorge.\" Renowned for its exquisite beauty and profound depth, it is celebrated worldwide for its elegance. The cliffs on both banks are lined with peaks, each possessing unique characteristics. As the poem goes: \"Among the Three Gorges of Badong, Wuxia is the longest; three cries of the monkey bring tears to one's garments.\""
 building_type_TK_20_63_YiLiHeGu: "Valley Scenery"
 building_type_TK_20_63_YiLiHeGu_desc: "Valley Scenery"
 TK_20_63_YiLiHeGu: "Yili River Valley"
 building_TK_20_63_YiLiHeGu: "$TK_20_63_YiLiHeGu$"
 building_TK_20_63_YiLiHeGu_desc: "The Ili River Valley is located in the western part of the Tianshan Mountains in China, surrounded by mountains on three sides, forming a topographical profile known as \"three mountains enclosing two valleys.\" The valley enjoys a mild and humid climate with abundant vegetation resources. Majestic snow-capped peaks, magnificent glaciers, boundless grasslands, and vast forests create stunning natural scenery. The Ili River Valley is famously known as the \"Western Region's Wet Island\" and the \"Jiangnan beyond the Great Wall.\""
 building_type_TK_20_63_YaLuCangBuDaXiaGu: "Valley Scenery"
 building_type_TK_20_63_YaLuCangBuDaXiaGu_desc: "Valley Scenery"
 TK_20_63_YaLuCangBuDaXiaGu: "Yarlung Zangbo Grand Canyon"
 building_TK_20_63_YaLuCangBuDaXiaGu: "$TK_20_63_YaLuCangBuDaXiaGu$"
 building_TK_20_63_YaLuCangBuDaXiaGu_desc: "The Yarlung Zangbo Grand Canyon is the world's largest and deepest canyon. The entire region features a complex interweaving of glaciers, sheer cliffs, steep slopes, mudslides, and rivers with towering waves, creating extremely harsh environmental conditions. Many areas remain unexplored to this day, earning it the title of \"the last secret realm on Earth,\" and it stands as one of the few blank zones in geological research."
 building_type_TK_20_64_ZhangYeDanXiaDiMao: "Terrain Landscape"
 building_type_TK_20_64_ZhangYeDanXiaDiMao_desc: "Terrain Landscape"
 TK_20_64_ZhangYeDanXiaDiMao: "Zhangye Danxia Landform"
 building_TK_20_64_ZhangYeDanXiaDiMao: "$TK_20_64_ZhangYeDanXiaDiMao$"
 building_TK_20_64_ZhangYeDanXiaDiMao_desc: "The Danxia landform of Zhangye is located in Nijiaying South Tai Village, Linze County, 40 kilometers from Zhangye City. Within a mountainous and hilly area spanning one hundred square kilometers, there are Danxia landforms with unique shapes, vibrant colors, and majestic grandeur. Danxia refers to isolated peaks and steep odd rocks formed by long-term weathering, stripping, and water erosion of red sandstone and conglomerate. The Danxia landform here represents the most typical and largest Danxia landscape in arid regions of China."
 building_type_TK_20_64_BaDanJiLinShaMo: "Terrain Landscape"
 building_type_TK_20_64_BaDanJiLinShaMo_desc: "Terrain Landscape"
 TK_20_64_BaDanJiLinShaMo: "Badain Jaran Desert"
 building_TK_20_64_BaDanJiLinShaMo: "$TK_20_64_BaDanJiLinShaMo$"
 building_TK_20_64_BaDanJiLinShaMo_desc: "Badain Jaran Desert is China's third-largest desert and second-largest mobile sand desert. Major attractions include Badain Lake, Badain Jaran Temple, and Bilu Tu Sand Mountain, making it an excellent destination for sightseeing in the Gobi and desert regions."
 building_type_TK_20_64_GuiLinQiXingYan: "Terrain Landscape"
 building_type_TK_20_64_GuiLinQiXingYan_desc: "Terrain Landscape"
 TK_20_64_GuiLinQiXingYan: "Guilin Qixing Rock Cave"
 building_TK_20_64_GuiLinQiXingYan: "$TK_20_64_GuiLinQiXingYan$"
 building_TK_20_64_GuiLinQiXingYan_desc: "Guilin Qixingyan Cave is named after Qixing Mountain and is also known as Qixia Cave and Bixu Yan. Located on the mountainside west of Putuo Mountain, it is one of the most famous cave attractions in Guilin. Situated within Guilin's Qixing Park, this cave was originally an underground river with a history spanning over a million years. Over countless ages, rainwater continuously seeped through the cave ceiling, dissolving limestone and crystallizing inside the cave, thereby forming stalactites, stalagmites, stone pillars, and drapery in myriad shapes, all gleaming like jade and snow. Qixingyan is divided into three levels: upper, middle, and lower. The upper level retains only remnants such as Laojun Terrace; the lower level houses the still-developing underground river beneath one's feet; currently open to visitors is the middle level."
 building_type_TK_20_64_WuLingYuan: "Terrain Landscape"
 building_type_TK_20_64_WuLingYuan_desc: "Terrain Landscape"
 TK_20_64_WuLingYuan: "Wulingyuan"
 building_TK_20_64_WuLingYuan: "$TK_20_64_WuLingYuan$"
 building_TK_20_64_WuLingYuan_desc: "Wulingyuan is a typical limestone karst landscape, shaped over hundreds of millions of years by river migration and erosion-dissolution processes, forming countless caves, sinkholes, skylights, and springs. Situated at the junction between quartz sandstone and limestone, the scenic area has developed an extensive network of caverns, waterfalls, natural windows, and spring clusters through eons of fluvial transformation and weathering. With a high forest coverage rate, Wulingyuan is renowned for its unique peaks and rocks, rare fauna and flora, and has also become a famous location for film production."
 building_type_TK_20_64_YunNanShiLin: "Terrain Landscape"
 building_type_TK_20_64_YunNanShiLin_desc: "Terrain Landscape"
 TK_20_64_YunNanShiLin: "Yunnan Shilin"
 building_TK_20_64_YunNanShiLin: "$TK_20_64_YunNanShiLin$"
 building_TK_20_64_YunNanShiLin_desc: "The karst landform landscapes of the Shilin Geological Park can be classified into features such as sinkholes, solution depressions, solution gullies, stone pillars, stalagmites, stone buds, isolated peaks, peak forests, and peak clusters, based on their degree of development and combination forms. The study of these karst landforms holds significant scientific value. The park is extensively covered with karst peak forest groups, where strange rocks rise from the ground in countless shapes and postures, ingeniously crafted by nature, earning it the title of \"the world's first wonder.\""
 building_type_TK_20_64_HaiShangShiLin: "Terrain Landscape"
 building_type_TK_20_64_HaiShangShiLin_desc: "Terrain Landscape"
 TK_20_64_HaiShangShiLin: "Maritime Stone Forest"
 building_TK_20_64_HaiShangShiLin: "$TK_20_64_HaiShangShiLin$"
 building_TK_20_64_HaiShangShiLin_desc: "Jibo Island is covered with karst landforms such as sinkholes, solution depressions, solution gullies, stone pillars, stalagmites, stone sprouts, isolated peaks, peak forests, and peak clusters. Unlike the Guilin Stone Forest, these landscapes appear as if they are at sea."
 building_type_TK_20_80_ShouShanTongKuang1Ji: "Copper Ore"
 building_type_TK_20_80_ShouShanTongKuang1Ji_desc: "Copper Ore"
 TK_20_80_ShouShanTongKuang1Ji: "Shoushan Copper Mine Level 1"
 building_TK_20_80_ShouShanTongKuang1Ji: "$TK_20_80_ShouShanTongKuang1Ji$"
 building_TK_20_80_ShouShanTongKuang1Ji_desc: "The primary source of copper from Shoushan Mountain is as described in \"Lunheng · Daoxu Pian\": \"Huangdi collected copper from Shoushan Mountain and cast a cauldron at the foot of Jing Mountain. Once the cauldron was completed, a dragon with whiskers descended to welcome Huangdi.\" This refers to the origin of the copper from Shoushan Mountain mentioned above. The scale of primary copper mines."
 building_type_TK_20_80_ShouShanTongKuang2Ji: "Copper Ore"
 building_type_TK_20_80_ShouShanTongKuang2Ji_desc: "Copper Ore"
 TK_20_80_ShouShanTongKuang2Ji: "Shoushan Copper Mine Level II"
 building_TK_20_80_ShouShanTongKuang2Ji: "$TK_20_80_ShouShanTongKuang2Ji$"
 building_TK_20_80_ShouShanTongKuang2Ji_desc: "The Shoushan Copper Mine is the source of copper mentioned in \"Shoushan\" in the chapter \"Dao Xu\" of Lunheng: \"Huangdi collected copper from Shoushan and cast a cauldron at the foot of Jing Mountain. Once the cauldron was completed, a dragon with whiskers lowered itself to welcome Huangdi.\" This mine is of intermediate scale."
 building_type_TK_20_80_ShouShanTongKuang3Ji: "Copper Ore"
 building_type_TK_20_80_ShouShanTongKuang3Ji_desc: "Copper Ore"
 TK_20_80_ShouShanTongKuang3Ji: "Shoushan Copper Mine Level III"
 building_TK_20_80_ShouShanTongKuang3Ji: "$TK_20_80_ShouShanTongKuang3Ji$"
 building_TK_20_80_ShouShanTongKuang3Ji_desc: "The Shoushan Copper Mine is the source of copper mentioned in \"Shoushan\" in the chapter \"Dao Xu\" of Lunheng: \"Huangdi collected copper from Shoushan and cast a cauldron at the foot of Jing Mountain. Once the cauldron was completed, a dragon with whiskers lowered itself to welcome Huangdi.\" This mine represents a high-level copper deposit on a large scale."
 building_type_TK_20_80_ShouShanTongKuang4Ji: "Copper Ore"
 building_type_TK_20_80_ShouShanTongKuang4Ji_desc: "Copper Ore"
 TK_20_80_ShouShanTongKuang4Ji: "Shoushan Copper Mine Level IV"
 building_TK_20_80_ShouShanTongKuang4Ji: "$TK_20_80_ShouShanTongKuang4Ji$"
 building_TK_20_80_ShouShanTongKuang4Ji_desc: "The Shoushan Copper Mine is the source of copper mentioned in \"Shoushan\" from the chapter \"Dao Xu\" of Lunheng: \"Huangdi collected copper from Shoushan and cast a cauldron at the foot of Jing Mountain. Once the cauldron was completed, a dragon with whiskers lowered itself to welcome Huangdi.\" This mine is of top-tier scale."
 building_type_TK_20_80_DanYangTongKuang1Ji: "Copper Ore"
 building_type_TK_20_80_DanYangTongKuang1Ji_desc: "Copper Ore"
 TK_20_80_DanYangTongKuang1Ji: "Dayang Copper Mine Level I"
 building_TK_20_80_DanYangTongKuang1Ji: "$TK_20_80_DanYangTongKuang1Ji$"
 building_TK_20_80_DanYangTongKuang1Ji_desc: "Danyang Copper Mine: During the Han Dynasty, a copper official was established in Danyang Commandery; Tongling served as one of the corresponding administrative points. The city of Tongling is named after and thrived on copper, earning it the title \"Ancient Copper Capital of China\" and \"Contemporary Copper Base.\" Copper mining and smelting history dates back to the Shang and Zhou dynasties, peaked during the Han and Tang, and has continued for over 3,500 years. Primary copper mine scale."
 building_type_TK_20_80_DanYangTongKuang2Ji: "Copper Ore"
 building_type_TK_20_80_DanYangTongKuang2Ji_desc: "Copper Ore"
 TK_20_80_DanYangTongKuang2Ji: "Dayang Copper Mine Level II"
 building_TK_20_80_DanYangTongKuang2Ji: "$TK_20_80_DanYangTongKuang2Ji$"
 building_TK_20_80_DanYangTongKuang2Ji_desc: "Danyang Copper Mine: During the Han Dynasty, a copper official was established in Danyang Commandery; Tongling served as one of the corresponding administrative points. The city of Tongling is named after and thrived on copper, earning the reputation of \"Ancient Copper Capital of China\" and \"Contemporary Copper Base.\" Its history of copper mining and smelting dates back to the Shang and Zhou dynasties, flourished during the Han and Tang periods, and has continued for over 3,500 years. This is a medium-sized copper mine."
 building_type_TK_20_80_DanYangTongKuang3Ji: "Copper Ore"
 building_type_TK_20_80_DanYangTongKuang3Ji_desc: "Copper Ore"
 TK_20_80_DanYangTongKuang3Ji: "Dayang Copper Mine Level III"
 building_TK_20_80_DanYangTongKuang3Ji: "$TK_20_80_DanYangTongKuang3Ji$"
 building_TK_20_80_DanYangTongKuang3Ji_desc: "Danyang Copper Mine: During the Han Dynasty, a copper official was established in Danyang Commandery; Tongling served as one of the corresponding administrative points. The city of Tongling is named after and thrived on copper, earning the title \"Ancient Copper Capital of China\" and \"Contemporary Copper Base.\" Its history of copper mining and smelting dates back to the Shang and Zhou dynasties, flourished during the Han and Tang periods, and has continued for over 3,500 years. Large-scale high-grade copper mine."
 building_type_TK_20_80_DanYangTongKuang4Ji: "Copper Ore"
 building_type_TK_20_80_DanYangTongKuang4Ji_desc: "Copper Ore"
 TK_20_80_DanYangTongKuang4Ji: "Dayang Copper Mine Level IV"
 building_TK_20_80_DanYangTongKuang4Ji: "$TK_20_80_DanYangTongKuang4Ji$"
 building_TK_20_80_DanYangTongKuang4Ji_desc: "Danyang Copper Mine: During the Han Dynasty, a copper official was established in Danyang Commandery; Tongling served as one of the corresponding administrative points. The city of Tongling is named after and thrived on copper, earning the reputation of \"Ancient Copper Capital of China\" and \"Contemporary Copper Base.\" Its history of copper mining and smelting dates back to the Shang and Zhou dynasties, flourished during the Han and Tang periods, and has continued for over 3,500 years. Top-tier copper mine scale."
 building_type_TK_20_80_TongLvShanKuang1Ji: "Copper Ore"
 building_type_TK_20_80_TongLvShanKuang1Ji_desc: "Copper Ore"
 TK_20_80_TongLvShanKuang1Ji: "Copper Green Mountain Mine Level I"
 building_TK_20_80_TongLvShanKuang1Ji: "$TK_20_80_TongLvShanKuang1Ji$"
 building_TK_20_80_TongLvShanKuang1Ji_desc: "Tonglushan Mine: Tonglushan is the mine with the longest span of mining activity in the world. According to archaeological excavations, ancient mining and smelting activities at Tonglushan began during the reign of King Xia Yi of the Yin Dynasty more than 3,000 years ago. By the end of the Southern Song Dynasty, copper production exceeded 100,000 tons. Primary copper ore scale."
 building_type_TK_20_80_TongLvShanKuang2Ji: "Copper Ore"
 building_type_TK_20_80_TongLvShanKuang2Ji_desc: "Copper Ore"
 TK_20_80_TongLvShanKuang2Ji: "Copper Green Mountain Mine Level II"
 building_TK_20_80_TongLvShanKuang2Ji: "$TK_20_80_TongLvShanKuang2Ji$"
 building_TK_20_80_TongLvShanKuang2Ji_desc: "Tonglushan Mine: Tonglushan is the mine with the longest span of mining activity in the world. According to archaeological excavations, ancient mining and smelting activities at Tonglushan began during the reign of King Xia Yi of the Yin Dynasty more than 3,000 years ago. By the end of the Southern Song Dynasty, copper production exceeded 100,000 tons. Medium-scale copper mine."
 building_type_TK_20_80_TongLvShanKuang3Ji: "Copper Ore"
 building_type_TK_20_80_TongLvShanKuang3Ji_desc: "Copper Ore"
 TK_20_80_TongLvShanKuang3Ji: "Copper Green Mountain Mine Level III"
 building_TK_20_80_TongLvShanKuang3Ji: "$TK_20_80_TongLvShanKuang3Ji$"
 building_TK_20_80_TongLvShanKuang3Ji_desc: "Tonglushan Mine: Tonglushan is the mine with the longest span of mining activity in the world. According to archaeological excavations, ancient mining and smelting activities at Tonglushan began during the reign of King Xia Yi of the Yin Dynasty more than 3,000 years ago. By the end of the Southern Song Dynasty, copper production exceeded 100,000 tons. This is a large-scale high-grade copper mine."
