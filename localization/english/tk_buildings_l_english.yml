 building_TK_20_81_TangXiTieKuang1Ji_desc: "Tangxi Iron Mine: The swords of the world, Han stands supreme (Warring States period, Xiping County belonged to the State of Han). First is Tangxi, second is Mo Yao (Mo Yang), third is He Bo, fourth is Deng Shi, fifth is Wan Feng, sixth is Longquan, seventh is Tai'e, eighth is Moye, ninth is Ganjiang. During the Spring and Autumn period, Tangxi had already begun specializing in sword casting; by the Warring States period, its swords were renowned throughout China as the foremost among the nine famous blades. One reason for the fame of Tangxi County lies in its high-quality iron ore deposits. Primary-scale iron mine."
