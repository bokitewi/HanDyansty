 building_TK_20_83_JiaoDongJinKuang1Ji_desc: "Donglai Commandery borders the sea to the north. Among its rolling hills, flecks of gold sometimes glitter in the sand and stones of streams, where local people occasionally wash for gold. At present, only a few scattered mining households wash for gold here, finding little."
