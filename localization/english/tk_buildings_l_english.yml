 building_TK_20_81_JinChengTieKuang1Ji: "$TK_20_81_JinChengTieKuang1Ji$"
 building_TK_20_81_JinChengTieKuang1Ji_desc: "Jincheng Iron Mine: The ancient town of Dayang in Jincheng was once a major source of pig iron for weapon production in the north. During the Spring and Autumn and Warring States periods, the famous sword Yang'egu Jian from this region was renowned alongside Ganjiang and Moye. In the Northern Song Dynasty, the \"Daguanye\" ironworks in Zhezhou served as an official furnace, casting the \"Da Guan Tong Bao,\" hailed as the most beautiful iron mother coin in history. During the Ming and Qing dynasties, the coal mining, iron smelting, and casting industries in Zhezhou Prefecture flourished to their peak; Dayang Town within Zhezhou was known as the \"Capital of Needles for the Nine Provinces,\" with its \"Dade\" brand steel needles selling worldwide. Primary Iron Ore Scale."
