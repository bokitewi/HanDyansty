 building_TK_20_83_HanJiaJinKuang1Ji_desc: "Hanjia Gold Mine: The name \"Hanjia\" originates from the ancient place name \"Hanjia,\" located north of Mingshan County in present-day Sichuan. This region is rich in gold resources and was one of the gold mines mentioned by Zhuge Liang during the Three Kingdoms period. Primary-scale gold mine."
