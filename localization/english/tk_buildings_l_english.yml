 building_TK_20_81_BianDanShanTieKuang1Ji: "$TK_20_81_BianDanShanTieKuang1Ji$"
 building_TK_20_81_BianDanShanTieKuang1Ji_desc: "Bianshangshan Iron Mine: The Bianshangshan Mountain Range serves as the natural border between Cambodia and Thailand. Composed of sandstone, its northern slope is covered in tropical rainforest while the southern slope features deciduous forests; iron ore resources are abundant. Iron smelting was introduced to Southeast Asia in the 3rd century BCE, marking the beginning of iron metallurgy. The \"Records of the Three Kingdoms: Wu\" notes that Funan produced iron-armored wooden ships capable of carrying hundreds of people, indicating that iron ore smelting in this region had long been mature. Primary-scale iron mine operations."
