 building_TK_20_80_DeXingTongKuang1Ji_desc: "Mountains surround the eastern part of Poyang County in Yuzhang Commandery. Several springs run bitter and blue-green, staining the rocks they pass over with a copper hue. Local people recognize this as a sign of copper beneath the mountains. At present, only a few shallow pits have been opened, with scarcely any furnaces."
