l_english:

 #####三国新增建筑
 building_type_TK_20_10_WaHuangGong: "Tombs and Ancestral Sites"
 building_type_TK_20_10_WaHuangGong_desc: "Former kings and sages rest here or receive worship. Later generations come at the appointed seasons to offer sacrifices and remember their ancestors' virtues and achievements."
 TK_20_10_WaHuangGong: "Palace of the Mother Goddess"
 building_TK_20_10_WaHuangGong: "$TK_20_10_WaHuangGong$"
 building_TK_20_10_WaHuangGong_desc: "Tradition says that Nüwa shaped people from clay and smelted stones to mend the sky here, leaving traces of her work among the cliffs. In late spring, local people come from near and far carrying incense up the mountain to pray to the goddess for children and a plentiful harvest."
 building_type_TK_20_10_FuXiMiao: "Tombs and Ancestral Sites"
 building_type_TK_20_10_FuXiMiao_desc: "Former kings and sages rest here or receive worship. Later generations come at the appointed seasons to offer sacrifices and remember their ancestors' virtues and achievements."
 TK_20_10_FuXiMiao: "Fuxi Temple"
 building_TK_20_10_FuXiMiao: "$TK_20_10_FuXiMiao$"
 building_TK_20_10_FuXiMiao_desc: "Chen is traditionally said to have been the former capital of Taihao Fuxi. He drew the Eight Trigrams, made fishing nets, and established marriage customs, earning reverence as humanity's ancestor. Every first month, people from the surrounding villages gather to honor him, and incense smoke hangs in the air all day."
 building_type_TK_20_10_HuangDiLing: "Tombs and Ancestral Sites"
 building_type_TK_20_10_HuangDiLing_desc: "Former kings and sages rest here or receive worship. Later generations come at the appointed seasons to offer sacrifices and remember their ancestors' virtues and achievements."
 TK_20_10_HuangDiLing: "Emperor Huangdi's Mausoleum"
 building_TK_20_10_HuangDiLing: "$TK_20_10_HuangDiLing$"
 building_TK_20_10_HuangDiLing_desc: "Huangdi's tomb stands on Mount Qiao. Tradition says he rode a dragon up to Heaven, leaving his ministers only his robes and headgear to bury here. Returning from a northern tour of Shuofang, Emperor Xiaowu also came to offer sacrifices at the foot of the mountain."
 building_type_TK_20_10_YanDiLing: "Tombs and Ancestral Sites"
 building_type_TK_20_10_YanDiLing_desc: "Former kings and sages rest here or receive worship. Later generations come at the appointed seasons to offer sacrifices and remember their ancestors' virtues and achievements."
 TK_20_10_YanDiLing: "Emperor Yan's Mausoleum"
 building_TK_20_10_YanDiLing: "$TK_20_10_YanDiLing$"
 building_TK_20_10_YanDiLing_desc: "Tradition says that Yandi Shennong tasted the many herbs and taught people farming. Late in life, he traveled south, died, and was buried here. Local people honor him as the ancestor of agriculture and always offer sacrifices before the spring planting."
 building_type_TK_20_10_DaYuLing: "Tombs and Ancestral Sites"
 building_type_TK_20_10_DaYuLing_desc: "Former kings and sages rest here or receive worship. Later generations come at the appointed seasons to offer sacrifices and remember their ancestors' virtues and achievements."
 TK_20_10_DaYuLing: "Great Yu's Mausoleum"
 building_TK_20_10_DaYuLing: "$TK_20_10_DaYuLing$"
 building_TK_20_10_DaYuLing_desc: "After bringing the floods under control, Yu gathered the lords in Jiangnan to reckon their achievements. He died there and was buried beneath Mount Kuaiji, where Yu's Cave stands. As a young man, the Grand Historian climbed Kuaiji and explored the cave; the Yue have guarded and worshipped at the site for generations."
 building_type_TK_20_10_MaZuMiao: "Tombs and Ancestral Sites"
 building_type_TK_20_10_MaZuMiao_desc: "Former kings and sages rest here or receive worship. Later generations come at the appointed seasons to offer sacrifices and remember their ancestors' virtues and achievements."
 TK_20_10_MaZuMiao: "Mazu Temple"
 building_TK_20_10_MaZuMiao: "$TK_20_10_MaZuMiao$"
 building_TK_20_10_MaZuMiao_desc: "Meizhou Island lies off the coast of Minzhong, alone amid winds and waves. Fishermen passing by steer by its outline, and whenever storms arise they bow in prayer to the sea god for a safe voyage home."
 building_type_TK_20_10_DaHuaiShu: "Tombs and Ancestral Sites"
 building_type_TK_20_10_DaHuaiShu_desc: "Former kings and sages rest here or receive worship. Later generations come at the appointed seasons to offer sacrifices and remember their ancestors' virtues and achievements."
 TK_20_10_DaHuaiShu: "Great Locust Tree"
 building_TK_20_10_DaHuaiShu: "$TK_20_10_DaHuaiShu$"
 building_TK_20_10_DaHuaiShu_desc: "The land beside the Fen River in Hedong, near Yao's former capital at Pingyang, has been densely settled since antiquity. An ancient locust tree towers at the village entrance, spreading its branches like a canopy. Travelers often rest beneath it, and those departing on long journeys always turn for a final look."
 building_type_TK_20_10_QianLing: "Tombs and Ancestral Sites"
 building_type_TK_20_10_QianLing_desc: "Former kings and sages rest here or receive worship. Later generations come at the appointed seasons to offer sacrifices and remember their ancestors' virtues and achievements."
 TK_20_10_QianLing: "Qianling Mausoleum"
 building_TK_20_10_QianLing: "$TK_20_10_QianLing$"
 building_TK_20_10_QianLing_desc: "Mount Liang stands north of Haozhi in Fufeng, with three peaks side by side. The northern peak is highest, while the two southern peaks face each other like gate towers. The First Emperor once built Liangshan Palace here and climbed it to gaze into the distance."
 building_type_TK_20_20_TianZhaoShenGong: "Temples and Shrines"
 building_type_TK_20_20_TianZhaoShenGong_desc: "A place of worship for the gods, where incense burns throughout the year. The faithful travel from every direction, even from a thousand li away, to pay homage."
 TK_20_20_TianZhaoShenGong: "Amaterasu Shrine"
 building_TK_20_20_TianZhaoShenGong: "$TK_20_20_TianZhaoShenGong$"
 building_TK_20_20_TianZhaoShenGong_desc: "Himiko, queen of the Wa across the eastern sea, follows the way of spirits and commands her people's belief. Though advanced in years, she has never married and lives secluded in her palace, seen by very few. The Wa worship the sun god here, believing the fate of their country depends upon it."
 building_type_TK_20_20_BaiMaSi: "Temples and Shrines"
 building_type_TK_20_20_BaiMaSi_desc: "A place of worship for the gods, where incense burns throughout the year. The faithful travel from every direction, even from a thousand li away, to pay homage."
 TK_20_20_BaiMaSi: "White Horse Temple"
 building_TK_20_20_BaiMaSi: "$TK_20_20_BaiMaSi$"
 building_TK_20_20_BaiMaSi_desc: "Emperor Xiaoming dreamed of a golden man one night and sent envoys west to seek the Buddhist teachings. They welcomed the monks She Moteng and Zhu Falan, who brought scriptures to Luoyang on a white horse. And so this temple was founded. The scriptures translated here were the earliest Buddhist texts in China."
 building_type_TK_20_20_FaMenSi: "Temples and Shrines"
 building_type_TK_20_20_FaMenSi_desc: "A place of worship for the gods, where incense burns throughout the year. The faithful travel from every direction, even from a thousand li away, to pay homage."
 TK_20_20_FaMenSi: "Famen Temple"
 building_TK_20_20_FaMenSi: "$TK_20_20_FaMenSi$"
 building_TK_20_20_FaMenSi_desc: "Tradition holds that a relic of the Buddha's finger bone lies at Meiyang in Fufeng, one of the places reached when King Ashoka of India distributed relics and built pagodas. During the reigns of Emperors Huan and Ling, Buddhist followers built huts here to guard it, and people called the site Ashoka's Temple."
 building_type_TK_20_20_ChuYunDaShe: "Temples and Shrines"
 building_type_TK_20_20_ChuYunDaShe_desc: "A place of worship for the gods, where incense burns throughout the year. The faithful travel from every direction, even from a thousand li away, to pay homage."
 TK_20_20_ChuYunDaShe: "Izumo Taisha"
 building_TK_20_20_ChuYunDaShe: "$TK_20_20_ChuYunDaShe$"
 building_TK_20_20_ChuYunDaShe_desc: "In Izumo in the Wa lands, the Great Lord of the Land is worshipped as the god who opened up the land and rules the underworld. Legend says that every tenth month, the gods gather here to discuss the affairs of humanity."
 building_type_TK_20_20_HaiYinSi: "Temples and Shrines"
 building_type_TK_20_20_HaiYinSi_desc: "A place of worship for the gods, where incense burns throughout the year. The faithful travel from every direction, even from a thousand li away, to pay homage."
 TK_20_20_HaiYinSi: "Haiyin Temple"
 building_TK_20_20_HaiYinSi: "$TK_20_20_HaiYinSi$"
 building_TK_20_20_HaiYinSi_desc: "Mount Gaya rises in the lands of Byeonhan, its many peaks thick with deep forests. The peoples of Samhan honor spirits and gods. After sowing each year, local people gather in the mountains to offer sacrifices, singing, dancing, and drinking day and night."
 building_type_TK_20_20_WuDangShanDaoGuan: "Temples and Shrines"
 building_type_TK_20_20_WuDangShanDaoGuan_desc: "A place of worship for the gods, where incense burns throughout the year. The faithful travel from every direction, even from a thousand li away, to pay homage."
 TK_20_20_WuDangShanDaoGuan: "Wudang Mountain Daoist Temple"
 building_TK_20_20_WuDangShanDaoGuan: "$TK_20_20_WuDangShanDaoGuan$"
 building_TK_20_20_WuDangShanDaoGuan_desc: "The peaks of Mount Wudang face Tianzhu amid deep ravines, where practitioners and hermits have long built huts to cultivate themselves. Halls and temples follow the peaks and cliffs, their bells and chimes echoing through the woods all day."
 building_type_TK_20_20_ShaoLinSi: "Temples and Shrines"
 building_type_TK_20_20_ShaoLinSi_desc: "A place of worship for the gods, where incense burns throughout the year. The faithful travel from every direction, even from a thousand li away, to pay homage."
 TK_20_20_ShaoLinSi: "Shaolin Temple"
 building_TK_20_20_ShaoLinSi: "$TK_20_20_ShaoLinSi$"
 building_TK_20_20_ShaoLinSi_desc: "Mount Shaoshi stands west of Songgao opposite Mount Taishi. Tradition traces its name to a younger sister of Yu's wife who once lived here. Its peaks rise like cut rock beneath dense forests, where hermits often enter to practice the Dao."
 building_type_TK_20_20_LingYinSi: "Temples and Shrines"
 building_type_TK_20_20_LingYinSi_desc: "A place of worship for the gods, where incense burns throughout the year. The faithful travel from every direction, even from a thousand li away, to pay homage."
 TK_20_20_LingYinSi: "Lingyin Temple"
 building_TK_20_20_LingYinSi: "$TK_20_20_LingYinSi$"
 building_TK_20_20_LingYinSi_desc: "West of Qiantang County lies Mount Wulin, the source of the Wulin River. Rugged peaks, deep caves and ravines, and secluded woods and springs make it a favored retreat for hermits between Wu and Yue."
 building_type_TK_20_20_DaYanTa: "Temples and Shrines"
 building_type_TK_20_20_DaYanTa_desc: "A place of worship for the gods, where incense burns throughout the year. The faithful travel from every direction, even from a thousand li away, to pay homage."
 TK_20_20_DaYanTa: "Great Wild Goose Pagoda"
 building_TK_20_20_DaYanTa: "$TK_20_20_DaYanTa$"
 building_TK_20_20_DaYanTa_desc: "Southeast of Chang'an, rising and falling ground lies near Qujiang Pool. Emperor Xiaowu established Yichun Park here, hunting and feasting beside the water."
 building_type_TK_20_20_XuanKongSi: "Temples and Shrines"
 building_type_TK_20_20_XuanKongSi_desc: "A place of worship for the gods, where incense burns throughout the year. The faithful travel from every direction, even from a thousand li away, to pay homage."
 TK_20_20_XuanKongSi: "Xuanhanging Temple"
 building_TK_20_20_XuanKongSi: "$TK_20_20_XuanKongSi$"
 building_TK_20_20_XuanKongSi_desc: "At the foot of Mount Heng, a deep, dangerous gorge runs between sheer cliffs. Only a narrow mountain path passes through it, which northern merchants and frontier soldiers must follow on their journeys."
 building_type_TK_20_20_YanDaoShenShe_01: "Temples and Shrines"
 building_type_TK_20_20_YanDaoShenShe_01_desc: "A place of worship for the gods, where incense burns throughout the year. The faithful travel from every direction, even from a thousand li away, to pay homage."
 TK_20_20_YanDaoShenShe_01: "Yashima Shrine"
 building_TK_20_20_YanDaoShenShe_01: "$TK_20_20_YanDaoShenShe_01$"
 building_TK_20_20_YanDaoShenShe_01_desc: "A small, densely wooded island lies in the inland sea of the Wa lands. At high tide, seawater spreads over its sandbars. The Wa regard the entire island as a dwelling of the gods and dare neither farm nor cut trees upon it."
 building_type_TK_20_20_YanDaoShenShe_02: "Temples and Shrines"
 building_type_TK_20_20_YanDaoShenShe_02_desc: "A place of worship for the gods, where incense burns throughout the year. The faithful travel from every direction, even from a thousand li away, to pay homage."
 TK_20_20_YanDaoShenShe_02: "Shinshu Shrine Advanced"
 building_TK_20_20_YanDaoShenShe_02: "$TK_20_20_YanDaoShenShe_02$"
 building_TK_20_20_YanDaoShenShe_02_desc: "A small, densely wooded island lies in the inland sea of the Wa lands. At high tide, seawater spreads over its sandbars. The Wa regard the entire island as a dwelling of the gods and dare neither farm nor cut trees upon it."
 building_type_TK_20_20_YiShiShenGong: "Temples and Shrines"
 building_type_TK_20_20_YiShiShenGong_desc: "A place of worship for the gods, where incense burns throughout the year. The faithful travel from every direction, even from a thousand li away, to pay homage."
 TK_20_20_YiShiShenGong: "Ise Grand Shrine"
 building_TK_20_20_YiShiShenGong: "$TK_20_20_YiShiShenGong$"
 building_TK_20_20_YiShiShenGong_desc: "A clear river flows through eastern Wa, between banks of thick woodland. Legend says that the sun god chose this pure place as a home. The Wa worship beside the river and dare show no disrespect."
 building_type_TK_20_20_HuangLongSi: "Temples and Shrines"
 building_type_TK_20_20_HuangLongSi_desc: "A place of worship for the gods, where incense burns throughout the year. The faithful travel from every direction, even from a thousand li away, to pay homage."
 TK_20_20_HuangLongSi: "Imperial Dragon Temple"
 building_TK_20_20_HuangLongSi: "$TK_20_20_HuangLongSi$"
 building_TK_20_20_HuangLongSi_desc: "The plains near the capital of Saro in Jinhan are fertile and encircled by rivers. The people grow the staple grains, rear silkworms, and weave silk and cloth, gathering in many settlements here."
 building_type_TK_20_20_TianTaiZongSiYuan: "Temples and Shrines"
 building_type_TK_20_20_TianTaiZongSiYuan_desc: "A place of worship for the gods, where incense burns throughout the year. The faithful travel from every direction, even from a thousand li away, to pay homage."
 TK_20_20_TianTaiZongSiYuan: "Tiantai Temple"
 building_TK_20_20_TianTaiZongSiYuan: "$TK_20_20_TianTaiZongSiYuan$"
 building_TK_20_20_TianTaiZongSiYuan_desc: "Deep in the mountains southeast of Kuaiji, a great rock rises with sheer cliffs on every side, yet its summit is broad and flat like a terrace. From the top at night, the stars and moon seem close enough to touch."
 building_type_TK_20_20_NanHuaSi: "Temples and Shrines"
 building_type_TK_20_20_NanHuaSi_desc: "A place of worship for the gods, where incense burns throughout the year. The faithful travel from every direction, even from a thousand li away, to pay homage."
 TK_20_20_NanHuaSi: "Nanhua Temple"
 building_TK_20_20_NanHuaSi: "$TK_20_20_NanHuaSi$"
 building_TK_20_20_NanHuaSi_desc: "South of Qujiang County runs Caoxi, a clear, shallow stream between quiet wooded hills. Even Lingnan's heat eases here, and travelers often rest beside the water."
 building_type_TK_20_20_DaZhaoSi: "Temples and Shrines"
 building_type_TK_20_20_DaZhaoSi_desc: "A place of worship for the gods, where incense burns throughout the year. The faithful travel from every direction, even from a thousand li away, to pay homage."
 TK_20_20_DaZhaoSi: "Great Temple of Enlightenment"
 building_TK_20_20_DaZhaoSi: "$TK_20_20_DaZhaoSi$"
 building_TK_20_20_DaZhaoSi_desc: "Far to the southwest, snowy mountains encircle a highland river valley. Local people live by herding cattle and sheep and honor the gods of mountains, rivers, and lakes. Few people from the Central Plains ever reach it, knowing only that it is bitterly cold and full of wonders."
 building_type_TK_20_21_ChangAnCheng: "Cultural Ancient City"
 building_type_TK_20_21_ChangAnCheng_desc: "These walls have stood for generations. Kings and lords of earlier ages established their capitals and states here, and traces of those times remain among the streets and markets."
 TK_20_21_ChangAnCheng: "Chang'an City"
 building_TK_20_21_ChangAnCheng: "$TK_20_21_ChangAnCheng$"
 building_TK_20_21_ChangAnCheng_desc: "The Han's western capital was established here by Emperor Gaozu. The Weiyang and Changle palaces stand grandly amid eight surrounding rivers, while the fertile plains of Guanzhong stretch for a thousand li, earning the name Heaven's Storehouse. After Emperor Guangwu restored the Han and moved the capital to Luoyang, the western capital ceased to house the emperor, but its ancestral temples and imperial tombs remain, and the Three Metropolitan Districts still prosper."
 building_type_TK_20_21_LuoYangCheng: "Cultural Ancient City"
 building_type_TK_20_21_LuoYangCheng_desc: "These walls have stood for generations. Kings and lords of earlier ages established their capitals and states here, and traces of those times remain among the streets and markets."
 TK_20_21_LuoYangCheng: "Luoyang City"
 building_TK_20_21_LuoYangCheng: "$TK_20_21_LuoYangCheng$"
 building_TK_20_21_LuoYangCheng_desc: "Luoyang lies at the center of the realm, backed by Mount Mang to the north and the Luo River to the south. It has been a royal capital since the Duke of Zhou built Luoyi. Emperor Guangwu established his restored Han capital here, with the northern and southern palaces facing one another and tribute and traveling scholars gathering from every direction."
 building_type_TK_20_21_ZiJinCheng: "Cultural Ancient City"
 building_type_TK_20_21_ZiJinCheng_desc: "These walls have stood for generations. Kings and lords of earlier ages established their capitals and states here, and traces of those times remain among the streets and markets."
 TK_20_21_ZiJinCheng: "Forbidden City"
 building_TK_20_21_ZiJinCheng: "$TK_20_21_ZiJinCheng$"
 building_TK_20_21_ZiJinCheng_desc: "Ji is the former capital of Yan and the seat of You Province. Backed by the Yan Mountains to the north, it guards the gateway from beyond the frontier into the Central Plains, drawing Hu and Han merchants and frontier troops alike."
 building_type_TK_20_21_JinGuanCheng: "Cultural Ancient City"
 building_type_TK_20_21_JinGuanCheng_desc: "These walls have stood for generations. Kings and lords of earlier ages established their capitals and states here, and traces of those times remain among the streets and markets."
 TK_20_21_JinGuanCheng: "Jin Guan City"
 building_TK_20_21_JinGuanCheng: "$TK_20_21_JinGuanCheng$"
 building_TK_20_21_JinGuanCheng_desc: "Chengdu is the seat of Shu Commandery, traditionally said to have been built by Zhang Yi on the model of Xianyang. Its brocade industry flourishes under a dedicated brocade official, and Shu brocade is sold throughout the realm. Outside the city, canals and weirs cross a thousand li of fertile land, letting people control drought and flooding."
 building_type_TK_20_21_GuSuCheng: "Cultural Ancient City"
 building_type_TK_20_21_GuSuCheng_desc: "These walls have stood for generations. Kings and lords of earlier ages established their capitals and states here, and traces of those times remain among the streets and markets."
 TK_20_21_GuSuCheng: "Gusu City"
 building_TK_20_21_GuSuCheng: "$TK_20_21_GuSuCheng$"
 building_TK_20_21_GuSuCheng_desc: "Wu County is the seat of Wu Commandery. Tradition says Wu Zixu surveyed the land and water and built this great city at King Helü's command. Gusu Terrace stands to the west, with the misty waters of Lake Tai nearby, and boats weave through its many waterways."
 building_type_TK_20_21_YangZhouCheng: "Cultural Ancient City"
 building_type_TK_20_21_YangZhouCheng_desc: "These walls have stood for generations. Kings and lords of earlier ages established their capitals and states here, and traces of those times remain among the streets and markets."
 TK_20_21_YangZhouCheng: "Yangzhou City"
 building_TK_20_21_YangZhouCheng: "$TK_20_21_YangZhouCheng$"
 building_TK_20_21_YangZhouCheng_desc: "Guangling began as Hancheng, built by King Fuchai of Wu, who also dug the Han Canal to link the Jiang and Huai rivers. In Emperor Gaozu's time, Liu Bi, King of Wu, made it his capital and became the richest ruler of the southeast by boiling seawater for salt and minting coins from mountain copper."
 building_type_TK_20_21_JingZhouCheng: "Cultural Ancient City"
 building_type_TK_20_21_JingZhouCheng_desc: "These walls have stood for generations. Kings and lords of earlier ages established their capitals and states here, and traces of those times remain among the streets and markets."
 TK_20_21_JingZhouCheng: "Jingzhou City"
 building_TK_20_21_JingZhouCheng: "$TK_20_21_JingZhouCheng$"
 building_TK_20_21_JingZhouCheng_desc: "Jiangling is the seat of Nan Commandery, near Chu's former capital at Ying. It controls the Han River approaches to the north, faces the great river to the south, opens west toward Ba and Shu, and connects east with Wu and Kuaiji: a gateway of Jing and Chu, and a place of strategic importance."
 building_type_TK_20_21_ShiTouCheng: "Cultural Ancient City"
 building_type_TK_20_21_ShiTouCheng_desc: "These walls have stood for generations. Kings and lords of earlier ages established their capitals and states here, and traces of those times remain among the streets and markets."
 TK_20_21_ShiTouCheng: "Stone City"
 building_TK_20_21_ShiTouCheng: "$TK_20_21_ShiTouCheng$"
 building_TK_20_21_ShiTouCheng_desc: "West of Moling, Mount Shitou rises sheer beside the great river. Tradition says King Wei of Chu established Jinling here. Its rugged heights command the river below and the traffic upstream and downstream, making it a place every commander seeks to hold."
 building_type_TK_20_21_KaiFengHuangCheng: "Cultural Ancient City"
 building_type_TK_20_21_KaiFengHuangCheng_desc: "These walls have stood for generations. Kings and lords of earlier ages established their capitals and states here, and traces of those times remain among the streets and markets."
 TK_20_21_KaiFengHuangCheng: "Kaifeng Imperial Palace"
 building_TK_20_21_KaiFengHuangCheng: "$TK_20_21_KaiFengHuangCheng$"
 building_TK_20_21_KaiFengHuangCheng_desc: "Junyi in Chenliu occupies the old site of Daliang, capital of Wei during the Warring States period. King Hui moved his capital here from Anyi and opened the Honggou Canal to draw in river water. Its mighty walls later fell when the Qin general Wang Ben diverted the river to flood the city."
 building_type_TK_20_21_LinAnHuangCheng: "Cultural Ancient City"
 building_type_TK_20_21_LinAnHuangCheng_desc: "These walls have stood for generations. Kings and lords of earlier ages established their capitals and states here, and traces of those times remain among the streets and markets."
 TK_20_21_LinAnHuangCheng: "Linchuan Imperial Palace"
 building_TK_20_21_LinAnHuangCheng: "$TK_20_21_LinAnHuangCheng$"
 building_TK_20_21_LinAnHuangCheng_desc: "A mountain beside the Qiantang River resembles a phoenix spreading its wings. It faces the great river to the east and overlooks the lake to the north. Each tidal surge roars like thunder, which local tradition attributes to Wu Zixu's angry spirit driving the waters."
 building_type_TK_20_21_PingYaoGuCheng: "Cultural Ancient City"
 building_type_TK_20_21_PingYaoGuCheng_desc: "These walls have stood for generations. Kings and lords of earlier ages established their capitals and states here, and traces of those times remain among the streets and markets."
 TK_20_21_PingYaoGuCheng: "Pingyao Ancient City"
 building_TK_20_21_PingYaoGuCheng: "$TK_20_21_PingYaoGuCheng$"
 building_TK_20_21_PingYaoGuCheng_desc: "Tradition says Yin Jifu, a great general under King Xuan of Zhou, stationed troops and built Pingtao while campaigning north against the Xianyun. Its square walls stand amid fertile fields, making it an important town on the eastern bank of the Fen River."
 building_type_TK_20_21_FengDuGuiCheng: "Cultural Ancient City"
 building_type_TK_20_21_FengDuGuiCheng_desc: "These walls have stood for generations. Kings and lords of earlier ages established their capitals and states here, and traces of those times remain among the streets and markets."
 TK_20_21_FengDuGuiCheng: "Fengdu Ghost City"
 building_TK_20_21_FengDuGuiCheng: "$TK_20_21_FengDuGuiCheng$"
 building_TK_20_21_FengDuGuiCheng_desc: "Mount Pingdu in Ba Commandery rises beside the river beneath deep forests. Tradition says Wang Fangping and Yin Changsheng practiced the Dao here and finally ascended to Heaven. At night, cold winds whisper through the mountains, and many local people dare not walk alone."
 building_type_TK_20_21_LouLanGuGuo: "Cultural Ancient City"
 building_type_TK_20_21_LouLanGuGuo_desc: "These walls have stood for generations. Kings and lords of earlier ages established their capitals and states here, and traces of those times remain among the streets and markets."
 TK_20_21_LouLanGuGuo: "Ancient State of Loulan"
 building_TK_20_21_LouLanGuGuo: "$TK_20_21_LouLanGuGuo$"
 building_TK_20_21_LouLanGuGuo_desc: "Loulan lies west of the Salt Lake at the junction of the northern and southern roads of the Western Regions, where foreign camel caravans must pass. Under Emperor Xiaozhao, Fu Jiezi killed its king, and the court renamed the kingdom Shanshan, bringing it under Han allegiance."
 building_type_TK_20_21_JingJueGuCheng: "Cultural Ancient City"
 building_type_TK_20_21_JingJueGuCheng_desc: "These walls have stood for generations. Kings and lords of earlier ages established their capitals and states here, and traces of those times remain among the streets and markets."
 TK_20_21_JingJueGuCheng: "Jingjue Ancient City"
 building_TK_20_21_JingJueGuCheng: "$TK_20_21_JingJueGuCheng$"
 building_TK_20_21_JingJueGuCheng_desc: "Jingjue is a small kingdom on the southern road through the Western Regions. Its royal city stands beside a small river, surrounded by shifting sands. Though its population is modest, passing merchants have brought considerable wealth. It has now been annexed by Shanshan."
 building_type_TK_20_21_GaoChangGuCheng: "Cultural Ancient City"
 building_type_TK_20_21_GaoChangGuCheng_desc: "These walls have stood for generations. Kings and lords of earlier ages established their capitals and states here, and traces of those times remain among the streets and markets."
 TK_20_21_GaoChangGuCheng: "Gaolang Ancient City"
 building_TK_20_21_GaoChangGuCheng: "$TK_20_21_GaoChangGuCheng$"
 building_TK_20_21_GaoChangGuCheng_desc: "The fortified settlement of Gaochang stands within the territory of Former Jushi. Its high, open ground and thriving population give it its name. The court has sent a Wuji Colonel to farm and garrison the land, guarding a vital point on the northern road through the Western Regions."
 building_type_TK_20_21_GeShengGuCheng: "Cultural Ancient City"
 building_type_TK_20_21_GeShengGuCheng_desc: "These walls have stood for generations. Kings and lords of earlier ages established their capitals and states here, and traces of those times remain among the streets and markets."
 TK_20_21_GeShengGuCheng: "Heshenggu City"
 building_TK_20_21_GeShengGuCheng: "$TK_20_21_GeShengGuCheng$"
 building_TK_20_21_GeShengGuCheng_desc: "Jumong, founding ancestor of Goguryeo, fled south from Buyeo and established his kingdom beside the Jolbon River. He built his city on this mountain, following its rugged slopes, with steep ground on every side that makes it easy to defend and difficult to attack."
 building_type_TK_20_21_MingTiePeiGuCheng: "Cultural Ancient City"
 building_type_TK_20_21_MingTiePeiGuCheng_desc: "These walls have stood for generations. Kings and lords of earlier ages established their capitals and states here, and traces of those times remain among the streets and markets."
 TK_20_21_MingTiePeiGuCheng: "Mingtepei Ancient City"
 building_TK_20_21_MingTiePeiGuCheng: "$TK_20_21_MingTiePeiGuCheng$"
 building_TK_20_21_MingTiePeiGuCheng_desc: "The largest city in Dayuan has strong walls and orderly streets and workshops. Dayuan breeds fine horses, including the famed blood-sweating heavenly steeds. Emperor Xiaowu once sent the General of Ershi on a distant campaign to seize these horses and bring them back."
 building_type_TK_20_21_AiLaoGuGuo: "Cultural Ancient City"
 building_type_TK_20_21_AiLaoGuGuo_desc: "These walls have stood for generations. Kings and lords of earlier ages established their capitals and states here, and traces of those times remain among the streets and markets."
 TK_20_21_AiLaoGuGuo: "Kingdom of Ailao"
 building_TK_20_21_AiLaoGuGuo: "$TK_20_21_AiLaoGuGuo$"
 building_TK_20_21_AiLaoGuGuo_desc: "Tradition says Shayi, ancestral mother of the Ailao people, became pregnant after touching a sunken log in the water and bore ten sons. The youngest, Jiulong, was chosen as king. Under Emperor Xiaoming, King Liu Mao submitted with his people, and the court established Yongchang Commandery in their lands."
 building_type_TK_20_21_WuGeKu: "Cultural Ancient City"
 building_type_TK_20_21_WuGeKu_desc: "These walls have stood for generations. Kings and lords of earlier ages established their capitals and states here, and traces of those times remain among the streets and markets."
 TK_20_21_WuGeKu: "Angkor Wat"
 building_TK_20_21_WuGeKu: "$TK_20_21_WuGeKu$"
 building_TK_20_21_WuGeKu_desc: "Beyond the South Sea lies the kingdom of Funan, home to a vast lake. During the rainy summer and autumn months, its waters rise as the flow reverses, and fish and shrimp abound. Legend holds that its founder, Huntian, sailed across the sea and married Queen Liuye, thus establishing the kingdom."
 building_type_TK_20_21_GongShanCheng: "Cultural Ancient City"
 building_type_TK_20_21_GongShanCheng_desc: "These walls have stood for generations. Kings and lords of earlier ages established their capitals and states here, and traces of those times remain among the streets and markets."
 TK_20_21_GongShanCheng: "Gongshan Mountain City"
 building_TK_20_21_GongShanCheng: "$TK_20_21_GongShanCheng$"
 building_TK_20_21_GongShanCheng_desc: "A steep hill stands beside a great river in Mahan, with water flowing around it. Mahan's many states lie scattered among mountains and seas, each with its own leader. This high ground beside the river offers a natural defensive position."
 building_type_TK_20_21_PingAnJing: "Cultural Ancient City"
 building_type_TK_20_21_PingAnJing_desc: "These walls have stood for generations. Kings and lords of earlier ages established their capitals and states here, and traces of those times remain among the streets and markets."
 TK_20_21_PingAnJing: "Heian-kyo"
 building_TK_20_21_PingAnJing: "$TK_20_21_PingAnJing$"
 building_TK_20_21_PingAnJing_desc: "A broad plain in the Wa lands lies surrounded by mountains on all four sides. Several rivers flow out from the hills, and the level ground is well suited to farming. Wa settlements are scattered across it."
 building_type_TK_20_21_ShengLongHuangCheng01: "Cultural Ancient City"
 building_type_TK_20_21_ShengLongHuangCheng01_desc: "These walls have stood for generations. Kings and lords of earlier ages established their capitals and states here, and traces of those times remain among the streets and markets."
 TK_20_21_ShengLongHuangCheng01: "Shenglong City"
 building_TK_20_21_ShengLongHuangCheng01: "$TK_20_21_ShengLongHuangCheng01$"
 building_TK_20_21_ShengLongHuangCheng01_desc: "The seat of Jiaozhi Commandery stands beside a great river on flat land that yields two rice harvests each year. Scholars fleeing unrest in the Central Plains often settle here, giving the city a strong tradition of learning and culture."
 building_type_TK_20_21_ShengLongHuangCheng02: "Cultural Ancient City"
 building_type_TK_20_21_ShengLongHuangCheng02_desc: "These walls have stood for generations. Kings and lords of earlier ages established their capitals and states here, and traces of those times remain among the streets and markets."
 TK_20_21_ShengLongHuangCheng02: "Ascending Dragon Imperial City"
 building_TK_20_21_ShengLongHuangCheng02: "$TK_20_21_ShengLongHuangCheng02$"
 building_TK_20_21_ShengLongHuangCheng02_desc: "The seat of Jiaozhi Commandery stands beside a great river on flat land that yields two rice harvests each year. Scholars fleeing unrest in the Central Plains often settle here, giving the city a strong tradition of learning and culture."
 building_type_TK_20_22_DaWenKouYiZhi: "Village Ruins"
 building_type_TK_20_22_DaWenKouYiZhi_desc: "The remains of a settlement of the earliest people lie here. Pottery and stone tools are often dug from among the weeds, which local elders say were left by the people of remote antiquity."
 TK_20_22_DaWenKouYiZhi: "Dayenkou Site"
 building_TK_20_22_DaWenKouYiZhi: "$TK_20_22_DaWenKouYiZhi$"
 building_TK_20_22_DaWenKouYiZhi_desc: "On high ground beside the Wen River, farmers often dig up ancient pottery and stone axes unlike the tools used today. Local elders say this was a settlement and burial place of the earliest people."
 building_type_TK_20_22_BanPoYiZhi: "Village Ruins"
 building_type_TK_20_22_BanPoYiZhi_desc: "The remains of a settlement of the earliest people lie here. Pottery and stone tools are often dug from among the weeds, which local elders say were left by the people of remote antiquity."
 TK_20_22_BanPoYiZhi: "Banpo Site"
 building_TK_20_22_BanPoYiZhi: "$TK_20_22_BanPoYiZhi$"
 building_TK_20_22_BanPoYiZhi_desc: "On the plateau east of the Chan River, round house foundations and painted pottery are sometimes unearthed. The elders of Chang'an say these are the remains of a village from long before the Three Dynasties."
 building_type_TK_20_22_HeMuDuYiZhi: "Village Ruins"
 building_type_TK_20_22_HeMuDuYiZhi_desc: "The remains of a settlement of the earliest people lie here. Pottery and stone tools are often dug from among the weeds, which local elders say were left by the people of remote antiquity."
 TK_20_22_HeMuDuYiZhi: "Hemudu Site"
 building_TK_20_22_HeMuDuYiZhi: "$TK_20_22_HeMuDuYiZhi$"
 building_TK_20_22_HeMuDuYiZhi_desc: "In the lowlands beside the Yuyao River in Kuaiji, people digging the soil often find layers of rotten wooden posts, blackened rice grains, and bone tools, seemingly the remains of houses built by the ancient Yue."
 building_type_TK_20_22_ShiGangPingYuan: "Village Ruins"
 building_type_TK_20_22_ShiGangPingYuan_desc: "The remains of a settlement of the earliest people lie here. Pottery and stone tools are often dug from among the weeds, which local elders say were left by the people of remote antiquity."
 TK_20_22_ShiGangPingYuan: "Stone Vat Plains"
 building_TK_20_22_ShiGangPingYuan: "$TK_20_22_ShiGangPingYuan$"
 building_TK_20_22_ShiGangPingYuan_desc: "Deep in the mountains beyond the southwestern peoples lies a plateau scattered with enormous stone jars, some large enough to hold several people. Local tradition says ancient giants used them to brew wine, but no one remembers who carved them."
 building_type_TK_20_23_BaiLuDongShuYuan: "Academies and Colleges"
 building_type_TK_20_23_BaiLuDongShuYuan_desc: "Scholars gather pupils to teach here, amid shelves filled with classical texts. Students arrive from every direction carrying their books."
 TK_20_23_BaiLuDongShuYuan: "Bailudong Academy"
 building_TK_20_23_BaiLuDongShuYuan: "$TK_20_23_BaiLuDongShuYuan$"
 building_TK_20_23_BaiLuDongShuYuan_desc: "At the southern foot of Wulao Peak on Mount Lu, four surrounding mountains enclose quiet streams, far from the noise of the world: an ideal place for hermits to read and teach."
 building_type_TK_20_23_ShiGuShuYuan: "Academies and Colleges"
 building_type_TK_20_23_ShiGuShuYuan_desc: "Scholars gather pupils to teach here, amid shelves filled with classical texts. Students arrive from every direction carrying their books."
 TK_20_23_ShiGuShuYuan: "Stone Drum Academy"
 building_TK_20_23_ShiGuShuYuan: "$TK_20_23_ShiGuShuYuan$"
 building_TK_20_23_ShiGuShuYuan_desc: "The Zheng and Xiang rivers meet here beside a hill shaped like a stone drum, surrounded by water on three sides. Local tradition says the stone drum on the hill sounds of its own accord whenever war is about to break out."
 building_type_TK_20_23_CuLaiShuYuan: "Academies and Colleges"
 building_type_TK_20_23_CuLaiShuYuan_desc: "Scholars gather pupils to teach here, amid shelves filled with classical texts. Students arrive from every direction carrying their books."
 TK_20_23_CuLaiShuYuan: "Culai Academy"
 building_TK_20_23_CuLaiShuYuan: "$TK_20_23_CuLaiShuYuan$"
 building_TK_20_23_CuLaiShuYuan_desc: "Mount Culai and Mount Tai face one another from south and north. Its green pines and cypresses include the pines of Culai celebrated by the people of Lu in the Book of Songs. The quiet mountains offer seclusion for study."
 building_type_TK_20_23_LiZeShuYuan: "Academies and Colleges"
 building_type_TK_20_23_LiZeShuYuan_desc: "Scholars gather pupils to teach here, amid shelves filled with classical texts. Students arrive from every direction carrying their books."
 TK_20_23_LiZeShuYuan: "Lize Academy"
 building_TK_20_23_LiZeShuYuan: "$TK_20_23_LiZeShuYuan$"
 building_TK_20_23_LiZeShuYuan_desc: "Among the hills and waters of western Kuaiji, two lakes lie joined together, reflecting one another's light. The Book of Changes speaks of adjoining lakes and friends gathering to study. The two waters nourishing each other fittingly express the exchange of learning among companions."
 building_type_TK_20_23_MaoShanShuYuan: "Academies and Colleges"
 building_type_TK_20_23_MaoShanShuYuan_desc: "Scholars gather pupils to teach here, amid shelves filled with classical texts. Students arrive from every direction carrying their books."
 TK_20_23_MaoShanShuYuan: "Maoshan Academy"
 building_TK_20_23_MaoShanShuYuan: "$TK_20_23_MaoShanShuYuan$"
 building_TK_20_23_MaoShanShuYuan_desc: "Tradition says the brothers Mao Ying, Mao Gu, and Mao Zhong cultivated the Dao and became immortals on Mount Juqu, giving it the alternate name of Sanmao. Its quiet valleys draw both Daoist practitioners and scholars to build huts here."
 building_type_TK_20_23_JiXiaXueGong: "Academies and Colleges"
 building_type_TK_20_23_JiXiaXueGong_desc: "Scholars gather pupils to teach here, amid shelves filled with classical texts. Students arrive from every direction carrying their books."
 TK_20_23_JiXiaXueGong: "Jixia Academy"
 building_TK_20_23_JiXiaXueGong: "$TK_20_23_JiXiaXueGong$"
 building_TK_20_23_JiXiaXueGong_desc: "Below the Ji Gate in Linzi, Qi's capital, King Xuan gathered scholars and persuaders from throughout the realm. Zou Yan, Chunyu Kun, Tian Pian, Xun Qing, and others debated and taught here, discussing affairs of state without holding administrative duties. They were known as the Masters of Jixia."
 building_type_TK_20_23_JiXianShuYuan: "Academies and Colleges"
 building_type_TK_20_23_JiXianShuYuan_desc: "Scholars gather pupils to teach here, amid shelves filled with classical texts. Students arrive from every direction carrying their books."
 TK_20_23_JiXianShuYuan: "Ji Xian Academy"
 building_TK_20_23_JiXianShuYuan: "$TK_20_23_JiXianShuYuan$"
 building_TK_20_23_JiXianShuYuan_desc: "The palace's collection of books and documents gathers rare writings from throughout the realm. Learned men collate the classics and their commentaries and compose histories here, often working by candlelight through the night."
 building_type_TK_20_23_NiShanShuYuan: "Academies and Colleges"
 building_type_TK_20_23_NiShanShuYuan_desc: "Scholars gather pupils to teach here, amid shelves filled with classical texts. Students arrive from every direction carrying their books."
 TK_20_23_NiShanShuYuan: "Nishan Academy"
 building_TK_20_23_NiShanShuYuan: "$TK_20_23_NiShanShuYuan$"
 building_TK_20_23_NiShanShuYuan_desc: "Tradition says Confucius's parents prayed on Mount Niqiu in Changping district of Lu before his birth, giving him the personal name Qiu and courtesy name Zhongni. Confucian scholars of Lu often come here to pay their respects."
 building_type_TK_20_23_SongYangShuYuan: "Academies and Colleges"
 building_type_TK_20_23_SongYangShuYuan_desc: "Scholars gather pupils to teach here, amid shelves filled with classical texts. Students arrive from every direction carrying their books."
 TK_20_23_SongYangShuYuan: "Songyang Academy"
 building_TK_20_23_SongYangShuYuan: "$TK_20_23_SongYangShuYuan$"
 building_TK_20_23_SongYangShuYuan_desc: "Ancient cypresses tower at the southern foot of Mount Taishi. Tradition says Emperor Xiaowu saw their great height while visiting Songgao and granted them the rank of general. Local people still call them the General Cypresses."
 building_type_TK_20_23_YuLuShuYuan: "Academies and Colleges"
 building_type_TK_20_23_YuLuShuYuan_desc: "Scholars gather pupils to teach here, amid shelves filled with classical texts. Students arrive from every direction carrying their books."
 TK_20_23_YuLuShuYuan: "Yuelu Academy"
 building_TK_20_23_YuLuShuYuan: "$TK_20_23_YuLuShuYuan$"
 building_TK_20_23_YuLuShuYuan_desc: "Looking west across the Xiang River from Linxiang, wooded hills form the foothills of the Southern Great Mountain, Mount Heng, giving Yuelu its name. Before them the Xiang flows north, with Orange Island stretching across its waters."
 building_type_TK_20_23_YingTianShuYuan: "Academies and Colleges"
 building_type_TK_20_23_YingTianShuYuan_desc: "Scholars gather pupils to teach here, amid shelves filled with classical texts. Students arrive from every direction carrying their books."
 TK_20_23_YingTianShuYuan: "Yingtian Academy"
 building_TK_20_23_YingTianShuYuan: "$TK_20_23_YingTianShuYuan$"
 building_TK_20_23_YingTianShuYuan_desc: "At Suiyang in the kingdom of Liang, King Xiao built grand palaces and parks, including the Rabbit Garden, and welcomed talented men from every direction. Mei Cheng, Sima Xiangru, Zou Yang, and other renowned writers composed rhapsodies and enjoyed feasts and excursions here."
 building_type_TK_20_23_AnDingShuYuan: "Academies and Colleges"
 building_type_TK_20_23_AnDingShuYuan_desc: "Scholars gather pupils to teach here, amid shelves filled with classical texts. Students arrive from every direction carrying their books."
 TK_20_23_AnDingShuYuan: "Anding Academy"
 building_TK_20_23_AnDingShuYuan: "$TK_20_23_AnDingShuYuan$"
 building_TK_20_23_AnDingShuYuan_desc: "Hailing, in eastern Guangling near the coast, has long profited from salt production. Its granaries are well stocked, and already in the time of Liu Bi, King of Wu, the Granaries of Hailing were famous."
 building_type_TK_20_23_WanSongShuYuan: "Academies and Colleges"
 building_type_TK_20_23_WanSongShuYuan_desc: "Scholars gather pupils to teach here, amid shelves filled with classical texts. Students arrive from every direction carrying their books."
 TK_20_23_WanSongShuYuan: "Wansong Academy"
 building_TK_20_23_WanSongShuYuan: "$TK_20_23_WanSongShuYuan$"
 building_TK_20_23_WanSongShuYuan_desc: "Pine woods cover the hills south of Qiantang. In the wind their rustling sounds like the sea. Below, lake and river face one another across the landscape, making the quiet hills well suited to reading."
 building_type_TK_20_23_EHuShuYuan: "Academies and Colleges"
 building_type_TK_20_23_EHuShuYuan_desc: "Scholars gather pupils to teach here, amid shelves filled with classical texts. Students arrive from every direction carrying their books."
 TK_20_23_EHuShuYuan: "Ehu Academy"
 building_TK_20_23_EHuShuYuan: "$TK_20_23_EHuShuYuan$"
 building_TK_20_23_EHuShuYuan_desc: "Among the mountains southeast of Poyang lies a peak with a lake on its summit, surrounded by lush woods and curling clouds. Few people reach this quiet place, ideal for living in seclusion and teaching."
 building_type_TK_20_23_LiZhengShuYuan: "Academies and Colleges"
 building_type_TK_20_23_LiZhengShuYuan_desc: "Scholars gather pupils to teach here, amid shelves filled with classical texts. Students arrive from every direction carrying their books."
 TK_20_23_LiZhengShuYuan: "Lizheng Academy"
 building_TK_20_23_LiZhengShuYuan: "$TK_20_23_LiZhengShuYuan$"
 building_TK_20_23_LiZhengShuYuan_desc: "The palace's place for compiling books takes its name from the Book of Changes and its phrase about doubled brightness adhering to what is right. Scholars search for lost writings and revise the classics here to prepare answers to the Son of Heaven's inquiries."
 building_type_TK_20_24_YangGuangDaJinTa: "Historic Landmarks"
 building_type_TK_20_24_YangGuangDaJinTa_desc: "A historic tower or pavilion famed far and wide, where passing travelers always stop to look."
 TK_20_24_YangGuangDaJinTa: "Shwedagon Pagoda"
 building_TK_20_24_YangGuangDaJinTa: "$TK_20_24_YangGuangDaJinTa$"
 building_TK_20_24_YangGuangDaJinTa_desc: "On a small hill beside the southern sea, tradition says two merchant brothers brought back hairs of the Buddha from India while he was still alive and enshrined them here. Local people revere it as a sacred site, and worshippers arrive in an unbroken stream from near and far."
 building_type_TK_20_24_WuHouCi: "Historic Landmarks"
 building_type_TK_20_24_WuHouCi_desc: "A historic tower or pavilion famed far and wide, where passing travelers always stop to look."
 TK_20_24_WuHouCi: "Wuhou Shrine"
 building_TK_20_24_WuHouCi: "$TK_20_24_WuHouCi$"
 building_TK_20_24_WuHouCi_desc: "South of Jinguancheng, ancient cypresses grow thickly. The people of Shu have built a shrine to honor a worthy chancellor who devoted himself tirelessly to his duties. Incense burns in every season, and scholars and commoners approach with reverence."
 building_type_TK_20_24_YingXianMuTa: "Historic Landmarks"
 building_type_TK_20_24_YingXianMuTa_desc: "A historic tower or pavilion famed far and wide, where passing travelers always stop to look."
 TK_20_24_YingXianMuTa: "Yingxian Wooden Pagoda"
 building_TK_20_24_YingXianMuTa: "$TK_20_24_YingXianMuTa$"
 building_TK_20_24_YingXianMuTa_desc: "The broad river plains in southern Yanmen Commandery overlook the Great Wall to the north and Mount Heng to the south. Northern horsemen advancing south and frontier troops heading north must both pass through them."
 building_type_TK_20_24_ZhaoZhouQiao: "Historic Landmarks"
 building_type_TK_20_24_ZhaoZhouQiao_desc: "A historic tower or pavilion famed far and wide, where passing travelers always stop to look."
 TK_20_24_ZhaoZhouQiao: "Zhaozhou Bridge"
 building_TK_20_24_ZhaoZhouQiao: "$TK_20_24_ZhaoZhouQiao$"
 building_TK_20_24_ZhaoZhouQiao_desc: "The Xiao River passes south of Pingji in Changshan. Though normally modest, its summer and autumn floods often sweep away the crossing bridges, leaving travelers no choice but to wade through the water."
 building_type_TK_20_24_FaShiLvGuan: "Historic Landmarks"
 building_type_TK_20_24_FaShiLvGuan_desc: "A historic tower or pavilion famed far and wide, where passing travelers always stop to look."
 TK_20_24_FaShiLvGuan: "Mage's Inn"
 building_TK_20_24_FaShiLvGuan: "$TK_20_24_FaShiLvGuan$"
 building_TK_20_24_FaShiLvGuan_desc: "Hot springs rise among the northern mountains of the Wa lands. Local people believe their warm waters can relieve illness, and travelers come from afar to rest, lodge, and bathe beside them."
 building_type_TK_20_24_GuangZhouFanFang: "Historic Landmarks"
 building_type_TK_20_24_GuangZhouFanFang_desc: "A historic tower or pavilion famed far and wide, where passing travelers always stop to look."
 TK_20_24_GuangZhouFanFang: "Guangzhou Fanfang"
 building_TK_20_24_GuangZhouFanFang: "$TK_20_24_GuangZhouFanFang$"
 building_TK_20_24_GuangZhouFanFang_desc: "Panyu, seat of Nanhai Commandery, faces the sea and serves as Lingnan's great city. Overseas treasures such as rhinoceros horn, ivory, tortoiseshell, and pearls are gathered and traded here, with foreign merchants and visitors continually passing through."
 building_type_TK_20_24_DaLiShiKu: "Historic Landmarks"
 building_type_TK_20_24_DaLiShiKu_desc: "A historic tower or pavilion famed far and wide, where passing travelers always stop to look."
 TK_20_24_DaLiShiKu: "Three Pagodas of Dali"
 building_TK_20_24_DaLiShiKu: "$TK_20_24_DaLiShiKu$"
 building_TK_20_24_DaLiShiKu_desc: "Between the eastern foot of Mount Diancang and the western shore of Yeyu Lake lies a long, narrow plain crossed by streams and adjoining fields. Yeyu County's town stands here."
 building_type_TK_20_24_CangZhouTieShiZi: "Historic Landmarks"
 building_type_TK_20_24_CangZhouTieShiZi_desc: "A historic tower or pavilion famed far and wide, where passing travelers always stop to look."
 TK_20_24_CangZhouTieShiZi: "Cangzhou Iron Lion"
 building_TK_20_24_CangZhouTieShiZi: "$TK_20_24_CangZhouTieShiZi$"
 building_TK_20_24_CangZhouTieShiZi_desc: "The shores of Bohai lie low and damp, often flooded by the tides. Salt production brings rich profits, but flooding is frequent, and coastal communities struggle against the waters every year."
 building_type_TK_20_24_YueYangLou: "Historic Landmarks"
 building_type_TK_20_24_YueYangLou_desc: "A historic tower or pavilion famed far and wide, where passing travelers always stop to look."
 TK_20_24_YueYangLou: "Yueyang Tower"
 building_TK_20_24_YueYangLou: "$TK_20_24_YueYangLou$"
 building_TK_20_24_YueYangLou_desc: "Baqiu stands at the mouth of Lake Dongting. Looking west from its walls, one sees vast waters with Mount Jun appearing to float among them. It controls the outlet of the Xiang River into the great river; a fleet stationed here can command southern Jing Province."
 building_type_TK_20_24_HuangHeLou: "Historic Landmarks"
 building_type_TK_20_24_HuangHeLou_desc: "A historic tower or pavilion famed far and wide, where passing travelers always stop to look."
 TK_20_24_HuangHeLou: "Yellow Crane Tower"
 building_TK_20_24_HuangHeLou: "$TK_20_24_HuangHeLou$"
 building_TK_20_24_HuangHeLou_desc: "Mount Huanghu in Jiangxia stands beside the great river, where the Han joins it from the northern bank. Its heights overlook their confluence. Tradition says an immortal once flew past on a yellow swan, giving the mountain its name."
 building_type_TK_20_24_TengWangGe: "Historic Landmarks"
 building_type_TK_20_24_TengWangGe_desc: "A historic tower or pavilion famed far and wide, where passing travelers always stop to look."
 TK_20_24_TengWangGe: "Tengwang Pavilion"
 building_TK_20_24_TengWangGe: "$TK_20_24_TengWangGe$"
 building_TK_20_24_TengWangGe_desc: "Nanchang, seat of Yuzhang Commandery, faces the broad Gan River to the west, beyond which stretch mountains. Camphor trees are plentiful throughout the commandery, traditionally said to be the source of the name Yuzhang."
 building_type_TK_20_24_PengLaiGe: "Historic Landmarks"
 building_type_TK_20_24_PengLaiGe_desc: "A historic tower or pavilion famed far and wide, where passing travelers always stop to look."
 TK_20_24_PengLaiGe: "Penglai Pavilion"
 building_TK_20_24_PengLaiGe: "$TK_20_24_PengLaiGe$"
 building_TK_20_24_PengLaiGe_desc: "Red cliffs on Donglai's coast overlook the sea. Around the turn of spring and summer, mirages often show towers and walls among the waves. Tradition says Emperor Xiaowu gazed from here toward the immortal island of Penglai on an eastern tour and lingered, reluctant to leave."
 building_type_TK_20_24_GuanQueLou: "Historic Landmarks"
 building_type_TK_20_24_GuanQueLou_desc: "A historic tower or pavilion famed far and wide, where passing travelers always stop to look."
 TK_20_24_GuanQueLou: "Suanque Tower"
 building_TK_20_24_GuanQueLou: "$TK_20_24_GuanQueLou$"
 building_TK_20_24_GuanQueLou_desc: "West of Puban in Hedong flows the great river. Tradition says Shun once established his capital here. Storks often gather on the high riverbanks, from which one can look west and see the waters rushing down from the north."
 building_type_TK_20_30_MingTiaoZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_MingTiaoZhiZhan_desc: "Two armies once fought fiercely here. Broken halberds and arrowheads can still be found in the wilderness, and travelers pause to reflect and sigh over the past."
 TK_20_30_MingTiaoZhiZhan: "Battle of Mingtiao"
 building_TK_20_30_MingTiaoZhiZhan: "$TK_20_30_MingTiaoZhiZhan$"
 building_TK_20_30_MingTiaoZhiZhan_desc: "Tang of Shang attacked Jie of Xia, and their armies fought a decisive battle on the plain of Mingtiao. The Xia army was routed, and Jie fled to Nanchao. Shang then succeeded Xia as ruler of the realm."
 building_type_TK_20_30_MuYeZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_MuYeZhiZhan_desc: "Two armies once fought fiercely here. Broken halberds and arrowheads can still be found in the wilderness, and travelers pause to reflect and sigh over the past."
 TK_20_30_MuYeZhiZhan: "Battle of Muye"
 building_TK_20_30_MuYeZhiZhan: "$TK_20_30_MuYeZhiZhan$"
 building_TK_20_30_MuYeZhiZhan_desc: "King Wu of Zhou gathered the lords to campaign against King Zhou of Shang and swore an oath before his army at Muye. The Shang soldiers turned against their own side, and King Zhou climbed the Deer Terrace and burned himself to death. The foundations of Zhou's eight hundred years of rule were laid here."
 building_type_TK_20_30_ChangShaoZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_ChangShaoZhiZhan_desc: "Two armies once fought fiercely here. Broken halberds and arrowheads can still be found in the wilderness, and travelers pause to reflect and sigh over the past."
 TK_20_30_ChangShaoZhiZhan: "Battle of Changshao"
 building_TK_20_30_ChangShaoZhiZhan: "$TK_20_30_ChangShaoZhiZhan$"
 building_TK_20_30_ChangShaoZhiZhan_desc: "Qi invaded Lu, and Duke Zhuang met its army at Changshao. Cao Gui waited until the Qi had sounded their drums three times before attacking: the first beat rouses courage, the second weakens it, and the third exhausts it. Lu then decisively defeated Qi."
 building_type_TK_20_30_ChangPingZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_ChangPingZhiZhan_desc: "Two armies once fought fiercely here. Broken halberds and arrowheads can still be found in the wilderness, and travelers pause to reflect and sigh over the past."
 TK_20_30_ChangPingZhiZhan: "Battle of Changping"
 building_TK_20_30_ChangPingZhiZhan: "$TK_20_30_ChangPingZhiZhan$"
 building_TK_20_30_ChangPingZhiZhan_desc: "Qin and Zhao fought over Shangdang and faced one another at Changping. Deceived by a plot to sow discord, the king of Zhao replaced Lian Po with Zhao Kuo. Zhao Kuo was defeated and killed, and Bai Qi buried more than four hundred thousand surrendered soldiers alive. Dry bones are still often unearthed among the hills."
 building_type_TK_20_30_GaiXiaZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_GaiXiaZhiZhan_desc: "Two armies once fought fiercely here. Broken halberds and arrowheads can still be found in the wilderness, and travelers pause to reflect and sigh over the past."
 TK_20_30_GaiXiaZhiZhan: "Battle of Gaixia"
 building_TK_20_30_GaiXiaZhiZhan: "$TK_20_30_GaiXiaZhiZhan$"
 building_TK_20_30_GaiXiaZhiZhan_desc: "Emperor Gaozu gathered the lords' armies and surrounded Xiang Yu at Gaixia. Hearing songs of Chu on every side at night, Xiang Yu drank and sang in sorrow in his tent, bidding farewell to Lady Yu. He broke out and fled south, finally taking his own life at Wujiang. Han rule over the realm was secured."
 building_type_TK_20_30_KunYangZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_KunYangZhiZhan_desc: "Two armies once fought fiercely here. Broken halberds and arrowheads can still be found in the wilderness, and travelers pause to reflect and sigh over the past."
 TK_20_30_KunYangZhiZhan: "Battle of Kunyang"
 building_TK_20_30_KunYangZhiZhan: "$TK_20_30_KunYangZhiZhan$"
 building_TK_20_30_KunYangZhiZhan_desc: "Wang Mang sent a great army to besiege Kunyang, its banners and baggage stretching for a thousand li. Emperor Guangwu led men willing to risk their lives into its ranks just as a violent thunderstorm broke. Wang Mang's forces scattered and trampled one another, setting the restoration of the Han in motion."
 building_type_TK_20_30_ChiBiZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_ChiBiZhiZhan_desc: "Two armies once fought fiercely here. Broken halberds and arrowheads can still be found in the wilderness, and travelers pause to reflect and sigh over the past."
 TK_20_30_ChiBiZhiZhan: "Battle of Red Cliffs"
 building_TK_20_30_ChiBiZhiZhan: "$TK_20_30_ChiBiZhiZhan$"
 building_TK_20_30_ChiBiZhiZhan_desc: "The great river passes between sheer red cliffs on its southern bank and Wulin to the north. The water is broad and the winds uncertain. If fleets face one another here, victory may depend upon a single gust from the east."
 building_type_TK_20_30_YiLingZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_YiLingZhiZhan_desc: "Two armies once fought fiercely here. Broken halberds and arrowheads can still be found in the wilderness, and travelers pause to reflect and sigh over the past."
 TK_20_30_YiLingZhiZhan: "Battle of Yiling"
 building_TK_20_30_YiLingZhiZhan: "$TK_20_30_YiLingZhiZhan$"
 building_TK_20_30_YiLingZhiZhan_desc: "Beyond the gorges, the mountains around Yiling and Xiaoting remain rugged and densely wooded. The route east from Shu into Jing and Chu passes here. If camps stretch among these hills, a fire can leave their front and rear unable to support one another."
 building_type_TK_20_30_FeiShuiZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_FeiShuiZhiZhan_desc: "Two armies once fought fiercely here. Broken halberds and arrowheads can still be found in the wilderness, and travelers pause to reflect and sigh over the past."
 TK_20_30_FeiShuiZhiZhan: "Battle of Feishui"
 building_TK_20_30_FeiShuiZhiZhan: "$TK_20_30_FeiShuiZhiZhan$"
 building_TK_20_30_FeiShuiZhiZhan_desc: "The Fei River flows beneath Shouchun and north into the Huai, along a vital route for armies moving between north and south. Mount Bagong north of the city is traditionally said to be where Liu An, King of Huainan, and his eight guests prepared elixirs and ascended as immortals."
 building_type_TK_20_30_CanHePoZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_CanHePoZhiZhan_desc: "Two armies once fought fiercely here. Broken halberds and arrowheads can still be found in the wilderness, and travelers pause to reflect and sigh over the past."
 TK_20_30_CanHePoZhiZhan: "Battle of Chanchepi"
 building_TK_20_30_CanHePoZhiZhan: "$TK_20_30_CanHePoZhiZhan$"
 building_TK_20_30_CanHePoZhiZhan_desc: "Lakes and pools stretch through Canhe County in Dai Commandery, with abundant water and pasture along a major route for northern horsemen heading south. In Emperor Gaozu's time, Xin, King of Han, allied with the Xiongnu in rebellion. The Han general Chai Wu routed his army here and killed him at Canhe."
 building_type_TK_20_30_BaiJiangKouZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_BaiJiangKouZhiZhan_desc: "Two armies once fought fiercely here. Broken halberds and arrowheads can still be found in the wilderness, and travelers pause to reflect and sigh over the past."
 TK_20_30_BaiJiangKouZhiZhan: "Battle of Baekgang"
 building_TK_20_30_BaiJiangKouZhiZhan: "$TK_20_30_BaiJiangKouZhiZhan$"
 building_TK_20_30_BaiJiangKouZhiZhan_desc: "A great river reaches the sea here in Mahan through a broad estuary with a large tidal range. Mudflats stretch along it, and ships must wait for the tide to enter or leave; the slightest mistake can leave them stranded."
 building_type_TK_20_30_XiangJiSiZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_XiangJiSiZhiZhan_desc: "Two armies once fought fiercely here. Broken halberds and arrowheads can still be found in the wilderness, and travelers pause to reflect and sigh over the past."
 TK_20_30_XiangJiSiZhiZhan: "Battle of Xiangji Temple"
 building_TK_20_30_XiangJiSiZhiZhan: "$TK_20_30_XiangJiSiZhiZhan$"
 building_TK_20_30_XiangJiSiZhiZhan_desc: "Between the Feng and Jue rivers south of Chang'an lies a broad, flat plain. Backed by the Zhongnan Mountains to the south and facing Chang'an's towers to the north, it forms the southern gateway to the capital region."
 building_type_TK_20_30_GaoLiangHeZhiZhan: "Ancient Battlefield"
 building_type_TK_20_30_GaoLiangHeZhiZhan_desc: "Two armies once fought fiercely here. Broken halberds and arrowheads can still be found in the wilderness, and travelers pause to reflect and sigh over the past."
 TK_20_30_GaoLiangHeZhiZhan: "Battle of Gaoliang River"
 building_TK_20_30_GaoLiangHeZhiZhan: "$TK_20_30_GaoLiangHeZhiZhan$"
 building_TK_20_30_GaoLiangHeZhiZhan_desc: "A small river runs through plains and marshes west of Ji. Reeds crowd its banks, and the low, muddy ground gives large armies little room to maneuver."
 building_type_TK_20_31_DuJiangYan: "Water Conservancy Project"
 building_type_TK_20_31_DuJiangYan_desc: "Earlier generations dug canals, built weirs, and diverted water to irrigate the fields. The farmland along their banks is protected from drought and flooding, and the people remember their work with gratitude across generations."
 TK_20_31_DuJiangYan: "Dujiangyan"
 building_TK_20_31_DuJiangYan: "$TK_20_31_DuJiangYan$"
 building_TK_20_31_DuJiangYan_desc: "Li Bing, Administrator of Shu Commandery, cut through Lidui, divided the Min River, and built weirs to direct its waters across a thousand li of fertile fields. The people of Shu could then control drought and flooding and knew no famine, earning their land the name Heaven's Storehouse."
 building_type_TK_20_31_LingQu: "Water Conservancy Project"
 building_type_TK_20_31_LingQu_desc: "Earlier generations dug canals, built weirs, and diverted water to irrigate the fields. The farmland along their banks is protected from drought and flooding, and the people remember their work with gratitude across generations."
 TK_20_31_LingQu: "Lingqu Canal"
 building_TK_20_31_LingQu: "$TK_20_31_LingQu$"
 building_TK_20_31_LingQu_desc: "When the First Emperor campaigned south against the Baiyue, he ordered the overseer Lu to dig a canal linking the Xiang and Li rivers. Warships and provisions could then pass from the great river directly into Lingnan. Though narrow, the canal joined the waterways of north and south."
 building_type_TK_20_31_KanErJing: "Water Conservancy Project"
 building_type_TK_20_31_KanErJing_desc: "Earlier generations dug canals, built weirs, and diverted water to irrigate the fields. The farmland along their banks is protected from drought and flooding, and the people remember their work with gratitude across generations."
 TK_20_31_KanErJing: "Karez Well"
 building_TK_20_31_KanErJing: "$TK_20_31_KanErJing$"
 building_TK_20_31_KanErJing_desc: "The Western Regions are dry and receive little rain. Local people and Han soldiers farming garrison lands dig underground channels, connecting them with vertical shafts at intervals. These well-channels bring water from snowy mountains underground to irrigate the fields."
 building_type_TK_20_32_MoGaoKu: "Caves, Stelae, and Ancient Carvings"
 building_type_TK_20_32_MoGaoKu_desc: "Stone has been carved into the mountainside here. The marks of chisels reveal the devotion and skill of earlier generations."
 TK_20_32_MoGaoKu: "Mogao Caves"
 building_TK_20_32_MoGaoKu: "$TK_20_32_MoGaoKu$"
 building_TK_20_32_MoGaoKu_desc: "Southeast of Dunhuang, the rolling dunes of Mingsha roar when people and horses pass over them. A small river runs beside the cliffs below. Opposite stands Mount Sanwei, traditionally said to be where Shun exiled the Sanmiao."
 building_type_TK_20_32_YunGangShiKu: "Caves, Stelae, and Ancient Carvings"
 building_type_TK_20_32_YunGangShiKu_desc: "Stone has been carved into the mountainside here. The marks of chisels reveal the devotion and skill of earlier generations."
 TK_20_32_YunGangShiKu: "Yungang Grottoes"
 building_TK_20_32_YunGangShiKu: "$TK_20_32_YunGangShiKu$"
 building_TK_20_32_YunGangShiKu_desc: "West of Pingcheng in Yanmen Commandery rises Mount Wuzhou, with the Wuzhou Barrier below, a vital Han defense at the frontier. When Emperor Xiaowu planned the Mayi ambush, the Xiongnu chanyu entered through this pass with a hundred thousand horsemen."
 building_type_TK_20_32_LongMenShiKu: "Caves, Stelae, and Ancient Carvings"
 building_type_TK_20_32_LongMenShiKu_desc: "Stone has been carved into the mountainside here. The marks of chisels reveal the devotion and skill of earlier generations."
 TK_20_32_LongMenShiKu: "Longmen Grottoes"
 building_TK_20_32_LongMenShiKu: "$TK_20_32_LongMenShiKu$"
 building_TK_20_32_LongMenShiKu_desc: "South of Luoyang, the Yi River flows between two opposing mountains resembling palace gate towers, giving Yique its name. Tradition says Yu cut through the mountain while taming the floods to lead the Yi northward."
 building_type_TK_20_32_DaZuShiKe: "Caves, Stelae, and Ancient Carvings"
 building_type_TK_20_32_DaZuShiKe_desc: "Stone has been carved into the mountainside here. The marks of chisels reveal the devotion and skill of earlier generations."
 TK_20_32_DaZuShiKe: "Dazu Rock Carvings"
 building_TK_20_32_DaZuShiKe: "$TK_20_32_DaZuShiKe$"
 building_TK_20_32_DaZuShiKe_desc: "Among the western hills of Ba Commandery, low mountains expose bare rock between many streams. Local people farm the slopes and live in simple ways."
 building_type_TK_20_32_LeShanDaFu: "Caves, Stelae, and Ancient Carvings"
 building_type_TK_20_32_LeShanDaFu_desc: "Stone has been carved into the mountainside here. The marks of chisels reveal the devotion and skill of earlier generations."
 TK_20_32_LeShanDaFu: "Le Shan Giant Buddha"
 building_TK_20_32_LeShanDaFu: "$TK_20_32_LeShanDaFu$"
 building_TK_20_32_LeShanDaFu_desc: "Outside Nan'an in Qianwei, the Mo, Qingyi, and Min rivers meet in turbulent waters where boats often capsize. Sheer cliffs rise beside the river, and every boatman passing them holds his breath."
 building_type_TK_20_32_MaiJiShanShiKu: "Caves, Stelae, and Ancient Carvings"
 building_type_TK_20_32_MaiJiShanShiKu_desc: "Stone has been carved into the mountainside here. The marks of chisels reveal the devotion and skill of earlier generations."
 TK_20_32_MaiJiShanShiKu: "Maiji Mountain Grottoes"
 building_TK_20_32_MaiJiShanShiKu: "$TK_20_32_MaiJiShanShiKu$"
 building_TK_20_32_MaiJiShanShiKu_desc: "Among the mountains south of Hanyang Commandery, a solitary peak rises like a farmer's pile of wheat, giving Maiji its name. Pines and cypresses cover its slopes as clouds and mist gather and disperse."
 building_type_TK_20_36_YanMenGuan: "Dangerous Passes"
 building_type_TK_20_36_YanMenGuan_desc: "Fortified passes take advantage of mountains and rivers, where one defender can hold off thousands. Travelers must have their passage documents checked before they may proceed."
 TK_20_36_YanMenGuan: "Yanmen Pass"
 building_TK_20_36_YanMenGuan: "$TK_20_36_YanMenGuan$"
 building_TK_20_36_YanMenGuan_desc: "South of Yanmen Commandery, the opposing heights of Mount Gouzhu form a gateway through which migrating geese are traditionally said to pass. The Gouzhu Barrier guards the main route for northern horsemen advancing toward Taiyuan and is counted among the realm's Nine Barriers."
 building_type_TK_20_36_YuMenGuan: "Dangerous Passes"
 building_type_TK_20_36_YuMenGuan_desc: "Fortified passes take advantage of mountains and rivers, where one defender can hold off thousands. Travelers must have their passage documents checked before they may proceed."
 TK_20_36_YuMenGuan: "Yumen Pass"
 building_TK_20_36_YuMenGuan: "$TK_20_36_YuMenGuan$"
 building_TK_20_36_YuMenGuan_desc: "Established under Emperor Xiaowu, this pass northwest of Dunhuang carries envoys and merchants from the Western Regions into the frontier. Tradition says the fine jade of Khotan also entered through it, giving Yumen its name. Beyond the pass stretch a thousand li of shifting sands."
 building_type_TK_20_36_YangGuan: "Dangerous Passes"
 building_type_TK_20_36_YangGuan_desc: "Fortified passes take advantage of mountains and rivers, where one defender can hold off thousands. Travelers must have their passage documents checked before they may proceed."
 TK_20_36_YangGuan: "Yangguan Pass"
 building_TK_20_36_YangGuan: "$TK_20_36_YangGuan$"
 building_TK_20_36_YangGuan_desc: "Yangguan takes its name from its position south of Yumen Pass. It opens onto the southern road through the Western Regions, beyond which lie vast sands with little water or pasture. Those seeing travelers off often go no farther than this point."
 building_type_TK_20_36_JianMenGuan: "Dangerous Passes"
 building_type_TK_20_36_JianMenGuan_desc: "Fortified passes take advantage of mountains and rivers, where one defender can hold off thousands. Travelers must have their passage documents checked before they may proceed."
 TK_20_36_JianMenGuan: "Jianmen Pass"
 building_TK_20_36_JianMenGuan: "$TK_20_36_JianMenGuan$"
 building_TK_20_36_JianMenGuan_desc: "Between the Dajian and Xiaojian mountains, opposing cliffs resemble swords and leave only a narrow passage like a stone gate. The Qin opened the Stone Ox Road into Shu through here, where one defender can hold off ten thousand."
 building_type_TK_20_36_WuGuan: "Dangerous Passes"
 building_type_TK_20_36_WuGuan_desc: "Fortified passes take advantage of mountains and rivers, where one defender can hold off thousands. Travelers must have their passage documents checked before they may proceed."
 TK_20_36_WuGuan: "Wuguan Pass"
 building_TK_20_36_WuGuan: "$TK_20_36_WuGuan$"
 building_TK_20_36_WuGuan_desc: "Wuguan lies among valleys southeast of the Qinling Mountains. Called Shaoxi during the Spring and Autumn period, it controls the route from Guanzhong toward Nanyang, Jing, and Chu. King Zhao of Qin lured King Huai of Chu here and captured him; Emperor Gaozu also broke through it on his way into Guanzhong."
 building_type_TK_20_36_HuLaoGuan: "Dangerous Passes"
 building_type_TK_20_36_HuLaoGuan_desc: "Fortified passes take advantage of mountains and rivers, where one defender can hold off thousands. Travelers must have their passage documents checked before they may proceed."
 TK_20_36_HuLaoGuan: "Hulao Pass"
 building_TK_20_36_HuLaoGuan: "$TK_20_36_HuLaoGuan$"
 building_TK_20_36_HuLaoGuan_desc: "The rugged ground at Chenggao connects south with Songgao and faces the great river to the north, guarding Luoyang's eastern gateway. Tradition says King Mu of Zhou kept captured tigers here, giving Hulao its name. During the Chu-Han struggle, Emperor Gaozu and Xiang Yu fought over it for years."
 building_type_TK_20_36_DaSanGuan: "Dangerous Passes"
 building_type_TK_20_36_DaSanGuan_desc: "Fortified passes take advantage of mountains and rivers, where one defender can hold off thousands. Travelers must have their passage documents checked before they may proceed."
 TK_20_36_DaSanGuan: "Dashan Pass"
 building_TK_20_36_DaSanGuan: "$TK_20_36_DaSanGuan$"
 building_TK_20_36_DaSanGuan_desc: "Sanguan stands on the Dasan Ridge south of Chencang, controlling the roads from Guanzhong into Hanzhong, Ba, and Shu. Emperor Gaozu took this route north from Hanzhong when he campaigned to bring the Three Qin under his rule."
 building_type_TK_20_36_TongGuan: "Dangerous Passes"
 building_type_TK_20_36_TongGuan_desc: "Fortified passes take advantage of mountains and rivers, where one defender can hold off thousands. Travelers must have their passage documents checked before they may proceed."
 TK_20_36_TongGuan: "Tongguan Pass"
 building_TK_20_36_TongGuan: "$TK_20_36_TongGuan$"
 building_TK_20_36_TongGuan_desc: "The great river flows south to this point before turning east, surging against the mountain pass and giving Tongguan its name. Between the river to the north and the Qinling Mountains to the south, it guards the dangerous route between Chang'an and Luoyang."
 building_type_TK_20_36_ShanHaiGuan: "Dangerous Passes"
 building_type_TK_20_36_ShanHaiGuan_desc: "Fortified passes take advantage of mountains and rivers, where one defender can hold off thousands. Travelers must have their passage documents checked before they may proceed."
 TK_20_36_ShanHaiGuan: "Shanhaiguan"
 building_TK_20_36_ShanHaiGuan: "$TK_20_36_ShanHaiGuan$"
 building_TK_20_36_ShanHaiGuan_desc: "At Linyu in Liaoxi Commandery, the outer ridges of the Yan Mountains reach the coast, leaving only a narrow route between mountain and sea. It is the necessary road from You Province to Liaodong. Tradition says the First Emperor and Emperor Xiaowu both climbed coastal Jieshi to view the sea on their eastern tours."
 building_type_TK_20_36_XiaoGuan: "Dangerous Passes"
 building_type_TK_20_36_XiaoGuan_desc: "Fortified passes take advantage of mountains and rivers, where one defender can hold off thousands. Travelers must have their passage documents checked before they may proceed."
 TK_20_36_XiaoGuan: "Xiaoguan Pass"
 building_TK_20_36_XiaoGuan: "$TK_20_36_XiaoGuan$"
 building_TK_20_36_XiaoGuan_desc: "In Anding Commandery, Xiaoguan lies against the Long Mountains and guards the Jing River valley, opening the route from Longxi and Beidi into Guanzhong. Under Emperor Xiaowen, a hundred and forty thousand Xiongnu horsemen broke through the pass, with raiding parties reaching Ganquan."
 building_type_TK_20_37_QuanZhouGang: "Harbor Crossing"
 building_type_TK_20_37_QuanZhouGang_desc: "Boats crowd this crossing or harbor. Merchants and travelers pass through, and goods of every kind are gathered and distributed here."
 TK_20_37_QuanZhouGang: "Quanzhou Port"
 building_TK_20_37_QuanZhouGang: "$TK_20_37_QuanZhouGang$"
 building_TK_20_37_QuanZhouGang_desc: "A great river in Minzhong reaches the sea through a winding harbor sheltered from winds and waves. The descendants of the Minyue are skilled boatmen, and fishing vessels travel among the coastal bays."
 building_type_TK_20_37_BoDuoGang: "Harbor Crossing"
 building_type_TK_20_37_BoDuoGang_desc: "Boats crowd this crossing or harbor. Merchants and travelers pass through, and goods of every kind are gathered and distributed here."
 TK_20_37_BoDuoGang: "Bodao Port"
 building_TK_20_37_BoDuoGang: "$TK_20_37_BoDuoGang$"
 building_TK_20_37_BoDuoGang_desc: "The bay of Na in the Wa lands lies between mountains and calm seas. The Wa sail from here toward Samhan and Lelang. Under Emperor Guangwu, Na sent envoys with tribute and received a gold seal."
 building_type_TK_20_37_BiLanDu: "Harbor Crossing"
 building_type_TK_20_37_BiLanDu_desc: "Boats crowd this crossing or harbor. Merchants and travelers pass through, and goods of every kind are gathered and distributed here."
 TK_20_37_BiLanDu: "Bilan Ferry"
 building_TK_20_37_BiLanDu: "$TK_20_37_BiLanDu$"
 building_TK_20_37_BiLanDu_desc: "A great river empties into the western sea in southern Lelang Commandery through a broad estuary, where the tides allow large ships to enter and leave. Merchant ships traveling between Lelang and Samhan often anchor here."
 building_type_TK_20_40_DongYueTaiShan: "Five Great Mountains"
 building_type_TK_20_40_DongYueTaiShan_desc: "The Five Great Mountains guard the four directions and the center of the realm. The Son of Heaven must offer sacrifices here on his tours, and no other mountains can match their standing."
 TK_20_40_DongYueTaiShan: "Mount Tai in the East"
 building_TK_20_40_DongYueTaiShan: "$TK_20_40_DongYueTaiShan$"
 building_TK_20_40_DongYueTaiShan_desc: "Mount Tai stands foremost among the Five Great Mountains. Since antiquity, emperors receiving Heaven's mandate have climbed it to perform the Feng and Shan sacrifices and announce their achievements to Heaven. The First Emperor, Emperor Xiaowu, and Emperor Guangwu all performed these rites here. Tradition also holds that the souls of the dead return to Mount Tai."
 building_type_TK_20_40_NanYueHengShan: "Five Great Mountains"
 building_type_TK_20_40_NanYueHengShan_desc: "The Five Great Mountains guard the four directions and the center of the realm. The Son of Heaven must offer sacrifices here on his tours, and no other mountains can match their standing."
 TK_20_40_NanYueHengShan: "Nanyue Hengshan"
 building_TK_20_40_NanYueHengShan: "$TK_20_40_NanYueHengShan$"
 building_TK_20_40_NanYueHengShan_desc: "Mount Heng's seventy-two peaks rise and fall in a continuous range. Tradition says its position corresponds to the stars, like the beam of a balance weighing Heaven and Earth, giving Heng its name. Emperor Shun came to offer sacrifices at the Southern Great Mountain on his southern tour."
 building_type_TK_20_40_XiYueHuaShan: "Five Great Mountains"
 building_type_TK_20_40_XiYueHuaShan_desc: "The Five Great Mountains guard the four directions and the center of the realm. The Son of Heaven must offer sacrifices here on his tours, and no other mountains can match their standing."
 TK_20_40_XiYueHuaShan: "West Peak Mount Hua"
 building_TK_20_40_XiYueHuaShan: "$TK_20_40_XiYueHuaShan$"
 building_TK_20_40_XiYueHuaShan_desc: "South of Huayin County in Hongnong, Mount Hua's five peaks rise with sheer faces on every side, more rugged than any other mountain. Below stands the Temple of the Western Great Mountain, where the court sends envoys for seasonal sacrifices among many inscribed stelae."
 building_type_TK_20_40_BeiYueHengShan: "Five Great Mountains"
 building_type_TK_20_40_BeiYueHengShan_desc: "The Five Great Mountains guard the four directions and the center of the realm. The Son of Heaven must offer sacrifices here on his tours, and no other mountains can match their standing."
 TK_20_40_BeiYueHengShan: "North Peak Heng Mountain"
 building_TK_20_40_BeiYueHengShan: "$TK_20_40_BeiYueHengShan$"
 building_TK_20_40_BeiYueHengShan_desc: "The Northern Great Mountain was originally called Hengshan, renamed Changshan to avoid Emperor Xiaowen's personal name. Its many peaks stretch between Dai and Ji Province, standing foremost among the northern mountains. The Son of Heaven sends envoys to offer seasonal sacrifices here."
 building_type_TK_20_40_ZhongYueSongShan: "Five Great Mountains"
 building_type_TK_20_40_ZhongYueSongShan_desc: "The Five Great Mountains guard the four directions and the center of the realm. The Son of Heaven must offer sacrifices here on his tours, and no other mountains can match their standing."
 TK_20_40_ZhongYueSongShan: "Zhongyue Songshan"
 building_TK_20_40_ZhongYueSongShan: "$TK_20_40_ZhongYueSongShan$"
 building_TK_20_40_ZhongYueSongShan_desc: "Songgao stands at the center of the realm, with Taishi and Shaoshi facing one another from east and west. Tradition says that when Emperor Xiaowu climbed Taishi, his attendants heard three cries of Long Live the Emperor from below. He assigned three hundred households to maintain its worship, naming the settlement Chonggao."
 building_type_TK_20_41_HuangShan: "Famous Mountains"
 building_type_TK_20_41_HuangShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_HuangShan: "Huangshan"
 building_TK_20_41_HuangShan: "$TK_20_41_HuangShan$"
 building_TK_20_41_HuangShan_desc: "Mount Yi in Yi County of Danyang Commandery takes its name from its blue-black peaks and cliffs, dark in the distance. Strange pines and rocks stand above a rolling sea of clouds. Tradition says Huangdi once prepared elixirs here."
 building_type_TK_20_41_LuShan: "Famous Mountains"
 building_type_TK_20_41_LuShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_LuShan: "Lushan"
 building_TK_20_41_LuShan: "$TK_20_41_LuShan$"
 building_TK_20_41_LuShan_desc: "Mount Lu stands west of Pengli Lake. Tradition says Kuang Su and his brothers built huts here to practice the Dao in Zhou times, giving it the alternate name Kuanglu. The Grand Historian climbed it on his southern travels to view the Nine Rivers that Yu had dredged."
 building_type_TK_20_41_ShenNongShan: "Famous Mountains"
 building_type_TK_20_41_ShenNongShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_ShenNongShan: "Shennong Mountain"
 building_TK_20_41_ShenNongShan: "$TK_20_41_ShenNongShan$"
 building_TK_20_41_ShenNongShan_desc: "Among the Taihang Mountains north of Henei, tradition says Yandi Shennong identified the five grains, tasted the many herbs, and built an altar to Heaven. Its rugged peaks wind like a dragon's spine among clouds and mist."
 building_type_TK_20_41_LaoJunShan: "Famous Mountains"
 building_type_TK_20_41_LaoJunShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_LaoJunShan: "Laoshan Mountain"
 building_TK_20_41_LaoJunShan: "$TK_20_41_LaoJunShan$"
 building_TK_20_41_LaoJunShan_desc: "Mount Jingshi is the main peak of the Funiu range. Tradition says Laozi lived here in seclusion before traveling west through Hangu Pass. Clouds and mist surround the summit, drawing many practitioners of the Dao."
 building_type_TK_20_41_WuDangShan: "Famous Mountains"
 building_type_TK_20_41_WuDangShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_WuDangShan: "Wudang Mountain"
 building_TK_20_41_WuDangShan: "$TK_20_41_WuDangShan$"
 building_TK_20_41_WuDangShan_desc: "Mount Wudang stands in Wudang County of Nanyang Commandery, its peaks surrounding a central summit above deep ravines. Anciently called Taihe, it is traditionally said to have sheltered Yin Xi in Zhou times, and practitioners often build huts here to cultivate themselves."
 building_type_TK_20_41_LongHuShan: "Famous Mountains"
 building_type_TK_20_41_LongHuShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_LongHuShan: "Longhu Mountain"
 building_TK_20_41_LongHuShan: "$TK_20_41_LongHuShan$"
 building_TK_20_41_LongHuShan_desc: "Among the mountains of eastern Yuzhang, red cliffs face blue-green waters. Two peaks resemble a coiled dragon and a crouching tiger, giving Longhu its name. Tradition says Zhang Daoling prepared elixirs here, and a dragon and tiger appeared when they were completed."
 building_type_TK_20_41_QingChengShan: "Famous Mountains"
 building_type_TK_20_41_QingChengShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_QingChengShan: "Qingcheng Mountain"
 building_TK_20_41_QingChengShan: "$TK_20_41_QingChengShan$"
 building_TK_20_41_QingChengShan_desc: "Mount Qingcheng's peaks encircle one another like city walls, and its woods remain green throughout the year. Tradition says Huangdi honored Ningfengzi here as Elder of the Five Great Mountains. Under Emperor Shun, Zhang Daoling entered Shu and taught around Heming and Qingcheng, gaining followers across Ba, Shu, and Hanzhong."
 building_type_TK_20_41_QiYunShan: "Famous Mountains"
 building_type_TK_20_41_QiYunShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_QiYunShan: "Qiyun Mountain"
 building_TK_20_41_QiYunShan: "$TK_20_41_QiYunShan$"
 building_TK_20_41_QiYunShan_desc: "On the southern edge of Danyang Commandery rises Mount Baiyue, its summit level with the clouds and its cliffs as red as cinnabar. Clear springs and waterfalls fill the mountains, where few people venture."
 building_type_TK_20_41_JingFuShan: "Famous Mountains"
 building_type_TK_20_41_JingFuShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_JingFuShan: "Jingfushan"
 building_TK_20_41_JingFuShan: "$TK_20_41_JingFuShan$"
 building_TK_20_41_JingFuShan_desc: "Mount Longmen in western Qian County of Fufeng has layers of green peaks and deep caves. Tradition says an immortal once lived among its rocks, giving it the alternate name Lingxian Rock."
 building_type_TK_20_41_MaoShan: "Famous Mountains"
 building_type_TK_20_41_MaoShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_MaoShan: "Maoshan"
 building_TK_20_41_MaoShan: "$TK_20_41_MaoShan$"
 building_TK_20_41_MaoShan_desc: "Mount Juqu winds in the shape of the character ji, giving it its name. Tradition says the brothers Mao Ying, Mao Gu, and Mao Zhong practiced the Dao and performed good works here under Emperor Xiaojing. Grateful local people renamed it Sanmao."
 building_type_TK_20_41_WuTaiShan: "Famous Mountains"
 building_type_TK_20_41_WuTaiShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_WuTaiShan: "Mount Wutai"
 building_TK_20_41_WuTaiShan: "$TK_20_41_WuTaiShan$"
 building_TK_20_41_WuTaiShan_desc: "Five peaks stand in a ring, their summits flat like terraces and still holding snow in high summer. Ancient practitioners called it Mount Zifu and cultivated themselves here. Tradition says Buddhist monks from the west also built a temple and taught scriptures here under Emperor Xiaoming."
 building_type_TK_20_41_EMeiShan: "Famous Mountains"
 building_type_TK_20_41_EMeiShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_EMeiShan: "Mount Emei"
 building_TK_20_41_EMeiShan: "$TK_20_41_EMeiShan$"
 building_TK_20_41_EMeiShan_desc: "Mount Emei in Nan'an County of Qianwei Commandery takes its name from two facing peaks resembling slender eyebrows. It rises into the clouds above deep woods. Tradition says the immortal Ge You rode a wooden sheep into Shu during the Zhou, and those who followed him attained immortality around these mountains."
 building_type_TK_20_41_PuTuoShan: "Famous Mountains"
 building_type_TK_20_41_PuTuoShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_PuTuoShan: "Putuo Mountain"
 building_TK_20_41_PuTuoShan: "$TK_20_41_PuTuoShan$"
 building_TK_20_41_PuTuoShan_desc: "A small island in the eastern sea off Kuaiji is covered with rugged rocks and lush woods. Tradition says Mei Fu, Commandant of Nanchang, abandoned his household when Wang Mang seized power and lived here in seclusion preparing elixirs. Its mountain came to be called Meicen."
 building_type_TK_20_41_JiuHuaShan: "Famous Mountains"
 building_type_TK_20_41_JiuHuaShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_JiuHuaShan: "Jiuhua Mountain"
 building_TK_20_41_JiuHuaShan: "$TK_20_41_JiuHuaShan$"
 building_TK_20_41_JiuHuaShan_desc: "Nine peaks stand side by side among the mountains of Jiangnan, their summits appearing and vanishing in the clouds. Deep forests and secluded springs see few visitors."
 building_type_TK_20_41_FanJingShan: "Famous Mountains"
 building_type_TK_20_41_FanJingShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_FanJingShan: "Fanjingshan"
 building_TK_20_41_FanJingShan: "$TK_20_41_FanJingShan$"
 building_TK_20_41_FanJingShan_desc: "Deep in western Wuling Commandery, peaks rise abruptly beneath clouds and mist throughout the year. The Man peoples of Wuling revere them as sacred mountains and gather below for their sacrifices."
 building_type_TK_20_41_KongDongShan: "Famous Mountains"
 building_type_TK_20_41_KongDongShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_KongDongShan: "Kongtong Mountain"
 building_TK_20_41_KongDongShan: "$TK_20_41_KongDongShan$"
 building_TK_20_41_KongDongShan_desc: "Mount Kongtong stands in Anding Commandery. Tradition says Huangdi came here to ask the immortal Guangchengzi how to cultivate his body. Emperor Xiaowu also crossed the Long Mountains and climbed Kongtong on a western tour."
 building_type_TK_20_41_XuanWuShan: "Famous Mountains"
 building_type_TK_20_41_XuanWuShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_XuanWuShan: "Xuanwu Mountain"
 building_TK_20_41_XuanWuShan: "$TK_20_41_XuanWuShan$"
 building_TK_20_41_XuanWuShan_desc: "A small, thickly wooded hill rises on the eastern coast of Nanhai Commandery, facing the open sea to the south. Fishermen returning from their voyages know they are home when they see it from afar."
 building_type_TK_20_41_YanDangShan: "Famous Mountains"
 building_type_TK_20_41_YanDangShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_YanDangShan: "Yandang Mountain"
 building_TK_20_41_YanDangShan: "$TK_20_41_YanDangShan$"
 building_TK_20_41_YanDangShan_desc: "The coastal mountains of southern Kuaiji are filled with strange peaks and rocks. Tradition says a lake on the summit is thick with reeds, where migrating geese gather in autumn, giving Yandang its name."
 building_type_TK_20_41_SanQingShan: "Famous Mountains"
 building_type_TK_20_41_SanQingShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_SanQingShan: "Three Cliffs Mountain"
 building_TK_20_41_SanQingShan: "$TK_20_41_SanQingShan$"
 building_TK_20_41_SanQingShan_desc: "A mountain on the eastern edge of Poyang has three peaks side by side, like three venerable gods seated upon the summit. Strange rocks and peaks fill the mountains, shrouded in mist throughout the year."
 building_type_TK_20_41_LaoShan: "Famous Mountains"
 building_type_TK_20_41_LaoShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_LaoShan: "Laoshan"
 building_TK_20_41_LaoShan: "$TK_20_41_LaoShan$"
 building_TK_20_41_LaoShan_desc: "Southeast of Buji County in Donglai Commandery, Mount Lao rises beside the sea, celebrated as a great coastal mountain. Practitioners of the occult arts have practiced self-cultivation here since the Warring States period. On his eastern tour, Emperor Xiaowu established a shrine to worship the gods in Buji County at the foot of the mountain."
 building_type_TK_20_41_ZhongNanShan: "Famous Mountains"
 building_type_TK_20_41_ZhongNanShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_ZhongNanShan: "Zhongnan Mountain"
 building_TK_20_41_ZhongNanShan: "$TK_20_41_ZhongNanShan$"
 building_TK_20_41_ZhongNanShan_desc: "The Zhongnan Mountains, also called Nanshan, stretch for hundreds of li south of Chang'an in many overlapping ridges. Hermits and practitioners abound. Tradition says Laozi taught Yin Xi the five thousand words of the Dao and its virtue at Louguan on their northern slopes."
 building_type_TK_20_41_MangDangShan: "Famous Mountains"
 building_type_TK_20_41_MangDangShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_MangDangShan: "Mangdang Mountain"
 building_TK_20_41_MangDangShan: "$TK_20_41_MangDangShan$"
 building_TK_20_41_MangDangShan_desc: "Mount Mangdang lies amid deep, rugged hills and marshes in Liang. Before his uprising, Emperor Gaozu hid here, with clouds often surrounding his dwelling. Beginning with King Xiao, successive kings of Liang carved tombs into the mountain and rest here."
 building_type_TK_20_41_KunLunShan: "Famous Mountains"
 building_type_TK_20_41_KunLunShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_KunLunShan: "Kunlun Mountain"
 building_TK_20_41_KunLunShan: "$TK_20_41_KunLunShan$"
 building_TK_20_41_KunLunShan_desc: "Far to the west, Kunlun is traditionally said to be the Heavenly Emperor's earthly capital and the home of the Queen Mother of the West, where the great river begins. Consulting ancient maps and writings, Emperor Xiaowu gave the name Kunlun to the river-source mountains south of Khotan."
 building_type_TK_20_41_QiLianDaXueShan: "Famous Mountains"
 building_type_TK_20_41_QiLianDaXueShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_QiLianDaXueShan: "Qilian Great Snow Mountain"
 building_TK_20_41_QiLianDaXueShan: "$TK_20_41_QiLianDaXueShan$"
 building_TK_20_41_QiLianDaXueShan_desc: "The Qilian Mountains stretch south of the Hexi commanderies, their summits covered in snow throughout the year. Meltwater nourishes the pastures below. After losing them, the Xiongnu sang in sorrow that the loss of Qilian had left their six kinds of livestock unable to prosper."
 building_type_TK_20_41_ZhuMuLangMaFeng: "Famous Mountains"
 building_type_TK_20_41_ZhuMuLangMaFeng_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_ZhuMuLangMaFeng: "Mount Everest"
 building_TK_20_41_ZhuMuLangMaFeng: "$TK_20_41_ZhuMuLangMaFeng$"
 building_TK_20_41_ZhuMuLangMaFeng_desc: "Far to the southwest, one peak rises highest among countless snowy mountains, covered in ice and snow throughout the year and reaching into the clouds. Local people revere it as the dwelling of a goddess and dare not approach lightly."
 building_type_TK_20_41_BaiTouShan: "Famous Mountains"
 building_type_TK_20_41_BaiTouShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_BaiTouShan: "Baishan Mountain"
 building_TK_20_41_BaiTouShan: "$TK_20_41_BaiTouShan$"
 building_TK_20_41_BaiTouShan_desc: "Far in the northeast stands Mount Buxian, its summit white with snow throughout the year. The Classic of Mountains and Seas places Sushen nearby, and local people revere it as a sacred mountain."
 building_type_TK_20_41_WuLiangShan: "Famous Mountains"
 building_type_TK_20_41_WuLiangShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_WuLiangShan: "Wuliang Mountain"
 building_TK_20_41_WuLiangShan: "$TK_20_41_WuLiangShan$"
 building_TK_20_41_WuLiangShan_desc: "Among the mountains southwest of Yizhou, Mengle's countless peaks give it the name Wuliang. Towering forests are shrouded in unhealthy mists, sheltering rare birds and beasts."
 building_type_TK_20_41_DianCangShan: "Famous Mountains"
 building_type_TK_20_41_DianCangShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_DianCangShan: "Diancang Mountain"
 building_TK_20_41_DianCangShan: "$TK_20_41_DianCangShan$"
 building_TK_20_41_DianCangShan_desc: "The peaks of Diancang run north and south, holding snow that never melts through the year. Their deep green color gives the range its name. Streams flow east from the mountains, all entering Yeyu Lake."
 building_type_TK_20_41_YaoShan: "Famous Mountains"
 building_type_TK_20_41_YaoShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_YaoShan: "Yao Mountain"
 building_TK_20_41_YaoShan: "$TK_20_41_YaoShan$"
 building_TK_20_41_YaoShan_desc: "Tradition says Liu Lei, a descendant of Emperor Yao, built a shrine to his ancestor on the mountain west of Luyang, giving it the name Yaoshan. The Liu clan regards it as an ancestral site, with remarkable peaks and rocks amid quiet woods and springs."
 building_type_TK_20_41_LangJiXuShan: "Famous Mountains"
 building_type_TK_20_41_LangJiXuShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_LangJiXuShan: "Mount Langjuxu"
 building_TK_20_41_LangJiXuShan: "$TK_20_41_LangJiXuShan$"
 building_TK_20_41_LangJiXuShan_desc: "Mount Langjuxu stands north of the desert. Under Emperor Xiaowu, Huo Qubing, General of Swift Cavalry, campaigned far against the Xiongnu and decisively defeated the Worthy King of the Left. He offered the Feng sacrifice on Langjuxu and the Shan sacrifice at Guyan, reached the Hanhai, and returned. This achievement became the highest aspiration of soldiers and commanders throughout the realm."
 building_type_TK_20_41_ZiJinShan: "Famous Mountains"
 building_type_TK_20_41_ZiJinShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_ZiJinShan: "Purple Gold Mountain"
 building_TK_20_41_ZiJinShan: "$TK_20_41_ZiJinShan$"
 building_TK_20_41_ZiJinShan_desc: "Mount Zhong east of Moling winds like a dragon. Its rocks show a faint purple hue in sunlight, making it one of Jiangdong's famed mountains."
 building_type_TK_20_41_JinGangShan: "Famous Mountains"
 building_type_TK_20_41_JinGangShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_JinGangShan: "Jingang Mountain"
 building_TK_20_41_JinGangShan: "$TK_20_41_JinGangShan$"
 building_TK_20_41_JinGangShan_desc: "Countless peaks rise among the coastal mountains of the Ye people, their rocks standing like cut stone. Each season brings different scenery; in autumn, red leaves set the mountains ablaze."
 building_type_TK_20_41_FuShiShan: "Famous Mountains"
 building_type_TK_20_41_FuShiShan_desc: "These famed mountains rise into the clouds. Since antiquity they have sheltered practitioners and hermits, and many tales of immortals are told among their peaks."
 TK_20_41_FuShiShan: "Mount Fuji"
 building_TK_20_41_FuShiShan: "$TK_20_41_FuShiShan$"
 building_TK_20_41_FuShiShan_desc: "A high mountain in eastern Wa resembles an upturned woven hat. Its summit holds snow throughout the year and sometimes sends forth smoke and fire. The Wa regard it as sacred and worship whenever they see it from afar."
 building_type_TK_20_50_ChangBaiShanTianChi: "Lakes and marshes"
 building_type_TK_20_50_ChangBaiShanTianChi_desc: "The vast waters yield an inexhaustible supply of fish, shrimp, water chestnuts, and lotus roots. People along the shore live by fishing, hunting, and boating."
 TK_20_50_ChangBaiShanTianChi: "Changbai Mountain Tianchi"
 building_TK_20_50_ChangBaiShanTianChi: "$TK_20_50_ChangBaiShanTianChi$"
 building_TK_20_50_ChangBaiShanTianChi_desc: "A deep pool lies atop Mount Buxian, surrounded by peaks on every side. Its dark green waters are bitterly cold, and several great rivers flow from the mountain. Local people regard it as a sacred pool and dare not approach lightly."
 building_type_TK_20_50_XiHu: "Lakes and marshes"
 building_type_TK_20_50_XiHu_desc: "The vast waters yield an inexhaustible supply of fish, shrimp, water chestnuts, and lotus roots. People along the shore live by fishing, hunting, and boating."
 TK_20_50_XiHu: "West Lake"
 building_TK_20_50_XiHu: "$TK_20_50_XiHu$"
 building_TK_20_50_XiHu_desc: "West of Qiantang County lies a lake bordered by mountains on three sides and the city to the east. Tradition says a golden ox once appeared in its waters, giving it the alternate name Mingsheng Lake. Its reflected mountains and waters are beautiful in every season."
 building_type_TK_20_50_QingHaiHu: "Lakes and marshes"
 building_type_TK_20_50_QingHaiHu_desc: "The vast waters yield an inexhaustible supply of fish, shrimp, water chestnuts, and lotus roots. People along the shore live by fishing, hunting, and boating."
 TK_20_50_QingHaiHu: "Qinghai Lake"
 building_TK_20_50_QingHaiHu: "$TK_20_50_QingHaiHu$"
 building_TK_20_50_QingHaiHu_desc: "West of Huangzhong lies a vast lake with bitter, salty waters, called the Beihe Qiang Sea by the Qiang. Wang Mang persuaded the Qiang to surrender land and established Xihai Commandery beside it, but it was soon abandoned."
 building_type_TK_20_50_YunMengZe: "Lakes and marshes"
 building_type_TK_20_50_YunMengZe_desc: "The vast waters yield an inexhaustible supply of fish, shrimp, water chestnuts, and lotus roots. People along the shore live by fishing, hunting, and boating."
 TK_20_50_YunMengZe: "Yunmeng Marsh"
 building_TK_20_50_YunMengZe: "$TK_20_50_YunMengZe$"
 building_TK_20_50_YunMengZe_desc: "Chu's ancient great marsh joins many lakes and swamps filled with reeds. In his Rhapsody on Master Zixu, Sima Xiangru described Yunmeng as nine hundred li across. The kings of Chu often hunted among its waters."
 building_type_TK_20_50_DongTingHu: "Lakes and marshes"
 building_type_TK_20_50_DongTingHu_desc: "The vast waters yield an inexhaustible supply of fish, shrimp, water chestnuts, and lotus roots. People along the shore live by fishing, hunting, and boating."
 TK_20_50_DongTingHu: "Dongting Lake"
 building_TK_20_50_DongTingHu: "$TK_20_50_DongTingHu$"
 building_TK_20_50_DongTingHu_desc: "Lake Dongting lies north of Changsha Commandery, receiving the Xiang, Zi, Yuan, and Li rivers across its misty expanse. Mount Jun in the lake is traditionally the dwelling of the Lord of the Xiang. After Emperor Shun died at Cangwu on his southern tour, his two consorts searched for him here, their tears staining bamboo to create its mottled stems."
 building_type_TK_20_50_TaiHu: "Lakes and marshes"
 building_type_TK_20_50_TaiHu_desc: "The vast waters yield an inexhaustible supply of fish, shrimp, water chestnuts, and lotus roots. People along the shore live by fishing, hunting, and boating."
 TK_20_50_TaiHu: "Taihu Lake"
 building_TK_20_50_TaiHu: "$TK_20_50_TaiHu$"
 building_TK_20_50_TaiHu_desc: "Lake Tai, anciently called Zhenze and Juqu, stretches between Wu and Danyang, scattered with islands like stars. King Fuchai of Wu defeated Yue at Fujiao in the lake. After King Goujian destroyed Wu, Fan Li sailed away across the Five Lakes."
 building_type_TK_20_50_ChaoHu: "Lakes and marshes"
 building_type_TK_20_50_ChaoHu_desc: "The vast waters yield an inexhaustible supply of fish, shrimp, water chestnuts, and lotus roots. People along the shore live by fishing, hunting, and boating."
 TK_20_50_ChaoHu: "Chaohu Lake"
 building_TK_20_50_ChaoHu: "$TK_20_50_ChaoHu$"
 building_TK_20_50_ChaoHu_desc: "Lake Chao south of Juchao is renowned for eight hundred li of lake and sky. Tradition says the ancient city sank into a lake in a single night, and Jiao Lao sacrificed herself to warn its people. In gratitude they called it Lake Jiao, and the small hill within it Mount Lao."
 building_type_TK_20_50_PoYangHu: "Lakes and marshes"
 building_type_TK_20_50_PoYangHu_desc: "The vast waters yield an inexhaustible supply of fish, shrimp, water chestnuts, and lotus roots. People along the shore live by fishing, hunting, and boating."
 TK_20_50_PoYangHu: "Poyang Lake"
 building_TK_20_50_PoYangHu: "$TK_20_50_PoYangHu$"
 building_TK_20_50_PoYangHu_desc: "Pengli Lake lies north of Yuzhang Commandery and south of the great river. The Tribute of Yu tells how the waters gathered here after Yu tamed the floods. Mount Poyang rises alone from the lake, serving as a landmark for passing boatmen."
 building_type_TK_20_50_RiYueTan: "Lakes and marshes"
 building_type_TK_20_50_RiYueTan_desc: "The vast waters yield an inexhaustible supply of fish, shrimp, water chestnuts, and lotus roots. People along the shore live by fishing, hunting, and boating."
 TK_20_50_RiYueTan: "Sun Moon Lake"
 building_TK_20_50_RiYueTan: "$TK_20_50_RiYueTan$"
 building_TK_20_50_RiYueTan_desc: "On Yizhou Island beyond the eastern sea, mountains surround a deep lake with a small island at its center. Its northern half resembles a round sun and its southern half a curved moon. The islanders live by fishing and hunting, traveling across the waters in dugout canoes."
 building_type_TK_20_50_YueYaQuan: "Lakes and marshes"
 building_type_TK_20_50_YueYaQuan_desc: "The vast waters yield an inexhaustible supply of fish, shrimp, water chestnuts, and lotus roots. People along the shore live by fishing, hunting, and boating."
 TK_20_50_YueYaQuan: "Moon Crescent Spring"
 building_TK_20_50_YueYaQuan: "$TK_20_50_YueYaQuan$"
 building_TK_20_50_YueYaQuan_desc: "Below Mount Mingsha south of Dunhuang lies a crescent-shaped spring, surrounded by shifting sands that never bury its waters. Known as Shajing, it has rich water and pasture nearby, where traveling merchants often water their horses."
 building_type_TK_20_50_LuGuHu: "Lakes and marshes"
 building_type_TK_20_50_LuGuHu_desc: "The vast waters yield an inexhaustible supply of fish, shrimp, water chestnuts, and lotus roots. People along the shore live by fishing, hunting, and boating."
 TK_20_50_LuGuHu: "Lugu Lake"
 building_TK_20_50_LuGuHu: "$TK_20_50_LuGuHu$"
 building_TK_20_50_LuGuHu_desc: "Deep in the mountains southwest of Yuexi Commandery lies a highland lake with clear waters reflecting green hills on every side. The local peoples travel by boat, and their marriage customs differ greatly from those of the Central Plains."
 building_type_TK_20_50_SaiLiMuHu: "Lakes and marshes"
 building_type_TK_20_50_SaiLiMuHu_desc: "The vast waters yield an inexhaustible supply of fish, shrimp, water chestnuts, and lotus roots. People along the shore live by fishing, hunting, and boating."
 TK_20_50_SaiLiMuHu: "Saylimu Lake"
 building_TK_20_50_SaiLiMuHu: "$TK_20_50_SaiLiMuHu$"
 building_TK_20_50_SaiLiMuHu_desc: "High on the northern slopes of the Tianshan Mountains in Wusun lies a great lake. Its cold, clear waters reveal the bottom but contain no fish or shrimp. Wusun herders graze their horses on the meadows beside it."
 building_type_TK_20_51_HuangGuoShuPuBu: "Waterfall Torrent"
 building_type_TK_20_51_HuangGuoShuPuBu_desc: "Water pours from a high cliff with a thunderous roar, filling the air with spray. Its sound can still be heard several li away."
 TK_20_51_HuangGuoShuPuBu: "Huangguoshu Waterfall"
 building_TK_20_51_HuangGuoShuPuBu: "$TK_20_51_HuangGuoShuPuBu$"
 building_TK_20_51_HuangGuoShuPuBu_desc: "Deep in Zangke Commandery's mountains, the Baishui River suddenly falls into a pool with a thunderous roar, spreading spray several li away. Local tradition says a sacred tree bearing yellow fruit once grew beside the waterfall."
 building_type_TK_20_51_HuKouPuBu: "Waterfall Torrent"
 building_type_TK_20_51_HuKouPuBu_desc: "Water pours from a high cliff with a thunderous roar, filling the air with spray. Its sound can still be heard several li away."
 TK_20_51_HuKouPuBu: "Hukou Waterfall"
 building_TK_20_51_HuKouPuBu: "$TK_20_51_HuKouPuBu$"
 building_TK_20_51_HuKouPuBu_desc: "The great river rushes between narrowing rock walls, its mouth shaped like a pot's opening. Muddy waves pour down a high cliff with a roar heard for several li, raising clouds of mist. This is the Hukou recorded in the Tribute of Yu."
 building_type_TK_20_52_QinHuaiHe: "Scenic Views on the Water"
 building_type_TK_20_52_QinHuaiHe_desc: "A river flows between inhabited banks. Seen from a boat upon its waters, the scenery is like a painting."
 TK_20_52_QinHuaiHe: "Qinhuai River"
 building_TK_20_52_QinHuaiHe: "$TK_20_52_QinHuaiHe$"
 building_TK_20_52_QinHuaiHe_desc: "The Huai River flows from the southeastern mountains, winding through Moling into the great river. Tradition says the First Emperor saw signs of an imperial destiny at Jinling on his eastern tour and ordered Mount Fang cut open, directing the Huai through it to disperse that force."
 building_type_TK_20_52_MiLuoJiang: "Scenic Views on the Water"
 building_type_TK_20_52_MiLuoJiang_desc: "A river flows between inhabited banks. Seen from a boat upon its waters, the scenery is like a painting."
 TK_20_52_MiLuoJiang: "Miluo River"
 building_TK_20_52_MiLuoJiang: "$TK_20_52_MiLuoJiang$"
 building_TK_20_52_MiLuoJiang_desc: "The Mi and Luo rivers meet in Luo County of Changsha Commandery, giving Miluo its name. Qu Yuan, Chu's Minister of the Three Clans, was exiled to Jiangnan and drowned himself here holding a stone after Qin captured Ying. On the fifth day of the fifth month, the people of Chu race boats on the river, traditionally in remembrance of searching for him."
 building_type_TK_20_52_LiJiang: "Scenic Views on the Water"
 building_type_TK_20_52_LiJiang_desc: "A river flows between inhabited banks. Seen from a boat upon its waters, the scenery is like a painting."
 TK_20_52_LiJiang: "Li River"
 building_TK_20_52_LiJiang: "$TK_20_52_LiJiang$"
 building_TK_20_52_LiJiang_desc: "The Li River rises in the Yuecheng Mountains and connects with the Xiang through the canal opened by the First Emperor, then flows south into Cangwu. Strange peaks stand along its banks like shoots and hairpins above clear blue-green waters."
 building_type_TK_20_60_JiuZhaiGou: "Comprehensive Scenic Area"
 building_type_TK_20_60_JiuZhaiGou_desc: "Deep in the mountains, lakes, pools, woods, and springs unfold one beyond another. The scenery is extraordinary, but few people ever reach it."
 TK_20_60_JiuZhaiGou: "Jiuzhaigou"
 building_TK_20_60_JiuZhaiGou: "$TK_20_60_JiuZhaiGou$"
 building_TK_20_60_JiuZhaiGou_desc: "Deep in the mountains north of the Min range, lakes unfold along the valleys like strings of pearls, their waters bright in many shades of blue. Di and Qiang tribes live scattered among them, farming and herding across generations."
 building_type_TK_20_60_HuangLongJingQu: "Comprehensive Scenic Area"
 building_type_TK_20_60_HuangLongJingQu_desc: "Deep in the mountains, lakes, pools, woods, and springs unfold one beyond another. The scenery is extraordinary, but few people ever reach it."
 TK_20_60_HuangLongJingQu: "Huanglong Scenic Area"
 building_TK_20_60_HuangLongJingQu: "$TK_20_60_HuangLongJingQu$"
 building_TK_20_60_HuangLongJingQu_desc: "Deep in the Min Mountains, layers of golden-yellow stone pools cover a ridge. Water flows between them, resembling a yellow dragon winding down from the snowy peaks. The Qiang regard it as a sacred wonder and offer seasonal sacrifices."
 building_type_TK_20_61_CangShanErHai: "Scenic waters and mountains"
 building_type_TK_20_61_CangShanErHai_desc: "Mountains and waters reflect one another in a tranquil landscape. Scholars, cultivated guests, and passing travelers often linger here, reluctant to leave."
 TK_20_61_CangShanErHai: "Cangshan Erhai"
 building_TK_20_61_CangShanErHai: "$TK_20_61_CangShanErHai$"
 building_TK_20_61_CangShanErHai_desc: "Yeyu Lake's vast blue-green waters reflect Mount Diancang on its western shore in a landscape of exceptional beauty. The Kunming tribes beside the lake live by fishing, hunting, farming, and herding."
 building_type_TK_20_61_TianYaHaiJiao: "Scenic waters and mountains"
 building_type_TK_20_61_TianYaHaiJiao_desc: "Mountains and waters reflect one another in a tranquil landscape. Scholars, cultivated guests, and passing travelers often linger here, reluctant to leave."
 TK_20_61_TianYaHaiJiao: "End of the Earth"
 building_TK_20_61_TianYaHaiJiao: "$TK_20_61_TianYaHaiJiao$"
 building_TK_20_61_TianYaHaiJiao_desc: "On a large island in the southern sea, Emperor Xiaowu established the commanderies of Zhuya and Dan'er after conquering Nanyue. Repeated rebellions later led to their abandonment. Rugged boulders line the island's southern beaches, facing the open sea as though they stood at the end of Heaven."
 building_type_TK_20_61_CaiShiJi: "Scenic waters and mountains"
 building_type_TK_20_61_CaiShiJi_desc: "Mountains and waters reflect one another in a tranquil landscape. Scholars, cultivated guests, and passing travelers often linger here, reluctant to leave."
 TK_20_61_CaiShiJi: "Caishi Jiji"
 building_TK_20_61_CaiShiJi: "$TK_20_61_CaiShiJi$"
 building_TK_20_61_CaiShiJi_desc: "Mount Niuzhu projects into the great river with sheer cliffs above swift waters. It is a vital crossing between Jiangdong and the northern bank, often chosen by armies crossing the river."
 building_type_TK_20_61_GuLangYu: "Scenic waters and mountains"
 building_type_TK_20_61_GuLangYu_desc: "Mountains and waters reflect one another in a tranquil landscape. Scholars, cultivated guests, and passing travelers often linger here, reluctant to leave."
 TK_20_61_GuLangYu: "Gulangyu"
 building_TK_20_61_GuLangYu: "$TK_20_61_GuLangYu$"
 building_TK_20_61_GuLangYu_desc: "A small island lies in a bay of Min. Reefs stand to its southwest, where the waves at high tide strike with the sound of beating drums."
 building_type_TK_20_61_KeKeXiLi: "Scenic waters and mountains"
 building_type_TK_20_61_KeKeXiLi_desc: "Mountains and waters reflect one another in a tranquil landscape. Scholars, cultivated guests, and passing travelers often linger here, reluctant to leave."
 TK_20_61_KeKeXiLi: "Kekexili"
 building_TK_20_61_KeKeXiLi: "$TK_20_61_KeKeXiLi$"
 building_TK_20_61_KeKeXiLi_desc: "West of the lands of the Western Qiang lies a cold, desolate plateau, high and rarely visited. Herds of wild yaks and antelopes roam across it. Hunters occasionally follow them here, but many turn back before the bitter winds."
 building_type_TK_20_61_LanYanJing: "Scenic waters and mountains"
 building_type_TK_20_61_LanYanJing_desc: "Mountains and waters reflect one another in a tranquil landscape. Scholars, cultivated guests, and passing travelers often linger here, reluctant to leave."
 TK_20_61_LanYanJing: "Blue eyes"
 building_TK_20_61_LanYanJing: "$TK_20_61_LanYanJing$"
 building_TK_20_61_LanYanJing_desc: "The Northern Sea on the Xiongnu's northern frontier is deep and broad, freezing like a mirror in winter. Under Emperor Xiaowu, the envoy Su Wu refused to submit to the Xiongnu and was exiled here to herd sheep, keeping his staff of authority for nineteen years."
 building_type_TK_20_62_XuanLanJiGuang: "Natural landscapes"
 building_type_TK_20_62_XuanLanJiGuang_desc: "A wonder shaped by Heaven and Earth, beyond the reach of human craft, astonishing all who see it."
 TK_20_62_XuanLanJiGuang: "Vivid Aurora"
 building_TK_20_62_XuanLanJiGuang: "$TK_20_62_XuanLanJiGuang$"
 building_TK_20_62_XuanLanJiGuang_desc: "Far to the north, winter nights often show colored lights across the sky, like curtains brightening and fading or banners dancing in the wind. Some say this is the Torch Dragon of the Classic of Mountains and Seas, holding a light to illuminate the northern darkness."
 building_type_TK_20_62_ChiLeChuan: "Natural landscapes"
 building_type_TK_20_62_ChiLeChuan_desc: "A wonder shaped by Heaven and Earth, beyond the reach of human craft, astonishing all who see it."
 TK_20_62_ChiLeChuan: "Chile Chuan"
 building_TK_20_62_ChiLeChuan: "$TK_20_62_ChiLeChuan$"
 building_TK_20_62_ChiLeChuan_desc: "The great plain below the Yin Mountains stretches beyond sight, rich in water and pasture. Wind sends waves through the grasses, revealing and hiding cattle and sheep. Modu, chanyu of the Xiongnu, once relied upon these mountains and used the plain as his park."
 building_type_TK_20_62_DaoChengYaDingJingQu: "Natural landscapes"
 building_type_TK_20_62_DaoChengYaDingJingQu_desc: "A wonder shaped by Heaven and Earth, beyond the reach of human craft, astonishing all who see it."
 TK_20_62_DaoChengYaDingJingQu: "Daocheng Yading Scenic Area"
 building_TK_20_62_DaoChengYaDingJingQu: "$TK_20_62_DaoChengYaDingJingQu$"
 building_TK_20_62_DaoChengYaDingJingQu_desc: "Deep in the snowy lands beyond the southwestern frontier, three mountains stand like the legs of a tripod, their summits snow-covered throughout the year. Below lie clear green lakes and soft grass. Local people regard the three peaks as gods."
 building_type_TK_20_62_ShuNanZhuHai: "Natural landscapes"
 building_type_TK_20_62_ShuNanZhuHai_desc: "A wonder shaped by Heaven and Earth, beyond the reach of human craft, astonishing all who see it."
 TK_20_62_ShuNanZhuHai: "Southern Sichuan Bamboo Sea"
 building_TK_20_62_ShuNanZhuHai: "$TK_20_62_ShuNanZhuHai$"
 building_TK_20_62_ShuNanZhuHai_desc: "South of Bodao County in Qianwei Commandery, bamboo woods stretch for hundreds of li among the hills, rustling like the sea in the wind. The Bo people cut bamboo to build houses and weave it into utensils."
 building_type_TK_20_62_LinZhiTaoHuaYuan: "Natural landscapes"
 building_type_TK_20_62_LinZhiTaoHuaYuan_desc: "A wonder shaped by Heaven and Earth, beyond the reach of human craft, astonishing all who see it."
 TK_20_62_LinZhiTaoHuaYuan: "Linzi Peach Blossom Spring"
 building_TK_20_62_LinZhiTaoHuaYuan: "$TK_20_62_LinZhiTaoHuaYuan$"
 building_TK_20_62_LinZhiTaoHuaYuan_desc: "Deep in the snowy mountains of the southwest lies a river valley, its waters as green as jade. Peach blossoms cover the valley in spring, while snow-capped peaks appear through the clouds and mist, like a realm apart."
 building_type_TK_20_62_LinHaiXueYuan: "Natural landscapes"
 building_type_TK_20_62_LinHaiXueYuan_desc: "A wonder shaped by Heaven and Earth, beyond the reach of human craft, astonishing all who see it."
 TK_20_62_LinHaiXueYuan: "Forest of Snowy Plains"
 building_TK_20_62_LinHaiXueYuan: "$TK_20_62_LinHaiXueYuan$"
 building_TK_20_62_LinHaiXueYuan_desc: "North of Buyeo, the Yilou live among deep mountains beneath forests that block out the sun. Winter snow rises past the knees. They dwell in pits among the woods, are skilled archers, and rub pig fat on their bodies to withstand the cold."
 building_type_TK_20_63_WuXia: "Valley Scenery"
 building_type_TK_20_63_WuXia_desc: "A great river passes through the mountains, with peaks rising on both banks. The sound of its waters fills the valley throughout the day."
 TK_20_63_WuXia: "Wu Xia Gorge"
 building_TK_20_63_WuXia: "$TK_20_63_WuXia$"
 building_TK_20_63_WuXia_desc: "The great river passes through Mount Wu between continuous ridges and overlapping cliffs that hide the sky and sun. The calls of apes echo all day. Tradition says the goddess of Mount Wu becomes clouds in the morning and rain in the evening, and that a king of Chu once met her in a dream."
 building_type_TK_20_63_YiLiHeGu: "Valley Scenery"
 building_type_TK_20_63_YiLiHeGu_desc: "A great river passes through the mountains, with peaks rising on both banks. The sound of its waters fills the valley throughout the day."
 TK_20_63_YiLiHeGu: "Yili River Valley"
 building_TK_20_63_YiLiHeGu: "$TK_20_63_YiLiHeGu$"
 building_TK_20_63_YiLiHeGu_desc: "The Wusun river valley is surrounded by mountains on three sides, with waters flowing west, rich pastures, and many horses. Under Emperor Xiaowu, Princess Xijun and Princess Jieyou were successively married into Wusun, joining the Han and Wusun through marriage alliances."
 building_type_TK_20_63_YaLuCangBuDaXiaGu: "Valley Scenery"
 building_type_TK_20_63_YaLuCangBuDaXiaGu_desc: "A great river passes through the mountains, with peaks rising on both banks. The sound of its waters fills the valley throughout the day."
 TK_20_63_YaLuCangBuDaXiaGu: "Yarlung Zangbo Grand Canyon"
 building_TK_20_63_YaLuCangBuDaXiaGu: "$TK_20_63_YaLuCangBuDaXiaGu$"
 building_TK_20_63_YaLuCangBuDaXiaGu_desc: "Among the southwestern snowy mountains, a great river has cut a deep gorge. Vast sheer cliffs rise on both banks beneath hanging ice, while the river roars below. Forests block the sunlight in the gorge, beasts roam through them, and few people venture here."
 building_type_TK_20_64_ZhangYeDanXiaDiMao: "Terrain Landscape"
 building_type_TK_20_64_ZhangYeDanXiaDiMao_desc: "The rocks take strange shapes beyond any human craft. Local people often explain their origins through tales of gods and spirits."
 TK_20_64_ZhangYeDanXiaDiMao: "Zhangye Danxia Landform"
 building_TK_20_64_ZhangYeDanXiaDiMao: "$TK_20_64_ZhangYeDanXiaDiMao$"
 building_TK_20_64_ZhangYeDanXiaDiMao_desc: "Among the hills beneath the Qilian Mountains south of Zhangye Commandery, layered rocks alternate in red, yellow, blue-green, and white like a spread of brocade. At sunrise and sunset the mountains seem aflame, astonishing passing soldiers and merchants who see them from afar."
 building_type_TK_20_64_BaDanJiLinShaMo: "Terrain Landscape"
 building_type_TK_20_64_BaDanJiLinShaMo_desc: "The rocks take strange shapes beyond any human craft. Local people often explain their origins through tales of gods and spirits."
 TK_20_64_BaDanJiLinShaMo: "Badain Jaran Desert"
 building_TK_20_64_BaDanJiLinShaMo: "$TK_20_64_BaDanJiLinShaMo$"
 building_TK_20_64_BaDanJiLinShaMo_desc: "South of Juyan Lake and east of the Ruo River, yellow sands stretch for countless thousands of li. Dunes rise like mountains, their sands roaring like thunder in the wind. Yet many small green lakes lie hidden among them, with rich water and pasture where herders of the Hu peoples sometimes bring their horses to drink."
 building_type_TK_20_64_GuiLinQiXingYan: "Terrain Landscape"
 building_type_TK_20_64_GuiLinQiXingYan_desc: "The rocks take strange shapes beyond any human craft. Local people often explain their origins through tales of gods and spirits."
 TK_20_64_GuiLinQiXingYan: "Guilin Qixing Rock Cave"
 building_TK_20_64_GuiLinQiXingYan: "$TK_20_64_GuiLinQiXingYan$"
 building_TK_20_64_GuiLinQiXingYan_desc: "East of Shi'an County in Lingling Commandery stand seven stone peaks arranged like the stars of the Northern Dipper. Deep caverns lie within them, filled with hanging stalactites and rising stalagmites gleaming like jade and snow. An underground river murmurs beneath one's feet."
 building_type_TK_20_64_WuLingYuan: "Terrain Landscape"
 building_type_TK_20_64_WuLingYuan_desc: "The rocks take strange shapes beyond any human craft. Local people often explain their origins through tales of gods and spirits."
 TK_20_64_WuLingYuan: "Wulingyuan"
 building_TK_20_64_WuLingYuan: "$TK_20_64_WuLingYuan$"
 building_TK_20_64_WuLingYuan_desc: "Deep in the mountains of Chong County in Wuling Commandery, countless stone peaks rise like shoots and pillars. Ancient pines grow on their summits, shrouded in cloud and mist throughout the year. Streams cross the valleys and deep caves shelter monkeys and deer; only the local peoples of Wuling know the paths in and out."
 building_type_TK_20_64_YunNanShiLin: "Terrain Landscape"
 building_type_TK_20_64_YunNanShiLin_desc: "The rocks take strange shapes beyond any human craft. Local people often explain their origins through tales of gods and spirits."
 TK_20_64_YunNanShiLin: "Yunnan Shilin"
 building_TK_20_64_YunNanShiLin: "$TK_20_64_YunNanShiLin$"
 building_TK_20_64_YunNanShiLin_desc: "Southeast of Lake Dian in Yizhou Commandery, gray-white stone peaks rise in dense clusters like a forest, some more than ten zhang high. Walking among them feels like entering a maze; travelers may wander for half a day without finding the way out."
 building_type_TK_20_64_HaiShangShiLin: "Terrain Landscape"
 building_type_TK_20_64_HaiShangShiLin_desc: "The rocks take strange shapes beyond any human craft. Local people often explain their origins through tales of gods and spirits."
 TK_20_64_HaiShangShiLin: "Maritime Stone Forest"
 building_TK_20_64_HaiShangShiLin: "$TK_20_64_HaiShangShiLin$"
 building_TK_20_64_HaiShangShiLin_desc: "In the bays east of Jiaozhi Commandery, countless stone islands rise abruptly from blue-green waters, some like pillars and others like screens, resembling a stone forest growing from the sea. Deep caves with hanging stalactites lie within them, where fishermen often shelter their small boats from the wind."
 building_type_TK_20_80_ShouShanTongKuang1Ji: "Copper Mine"
 building_type_TK_20_80_ShouShanTongKuang1Ji_desc: "Copper is essential for minting coins and making utensils. The rich veins here keep the fires of mining and smelting glowing red across the valley throughout the year."
 TK_20_80_ShouShanTongKuang1Ji: "Shoushan Copper Mine Level 1"
 building_TK_20_80_ShouShanTongKuang1Ji: "$TK_20_80_ShouShanTongKuang1Ji$"
 building_TK_20_80_ShouShanTongKuang1Ji_desc: "The Grand Historian records that Huangdi gathered copper from Shoushan and cast a precious cauldron beneath Mount Jing. When it was completed, a dragon lowered its whiskers to carry Huangdi up to Heaven. Shoushan's copper became famous throughout the realm. At present, only a few shallow pits have been opened, with scarcely any furnaces."
 building_type_TK_20_80_ShouShanTongKuang2Ji: "Copper Mine"
 building_type_TK_20_80_ShouShanTongKuang2Ji_desc: "Copper is essential for minting coins and making utensils. The rich veins here keep the fires of mining and smelting glowing red across the valley throughout the year."
 TK_20_80_ShouShanTongKuang2Ji: "Shoushan Copper Mine Level II"
 building_TK_20_80_ShouShanTongKuang2Ji: "$TK_20_80_ShouShanTongKuang2Ji$"
 building_TK_20_80_ShouShanTongKuang2Ji_desc: "The Grand Historian records that Huangdi gathered copper from Shoushan and cast a precious cauldron beneath Mount Jing. When it was completed, a dragon lowered its whiskers to carry Huangdi up to Heaven. Shoushan's copper became famous throughout the realm. The tunnels grow deeper and the furnaces more numerous, while craftsmen's families gather into settlements."
 building_type_TK_20_80_ShouShanTongKuang3Ji: "Copper Mine"
 building_type_TK_20_80_ShouShanTongKuang3Ji_desc: "Copper is essential for minting coins and making utensils. The rich veins here keep the fires of mining and smelting glowing red across the valley throughout the year."
 TK_20_80_ShouShanTongKuang3Ji: "Shoushan Copper Mine Level III"
