 building_TK_20_81_DaYeTieKuang2Ji_desc: "Daye Iron Mine: Mining here has been ongoing since the fifth year of Huangwu in the Three Kingdoms period, Wu (AD 226), spanning over 1,700 years. Sun Quan, the Great Emperor of Wu, forged swords and knives here; Yang Guang, the Emperor of Sui, cast coins here; Yue Fei of the Song Dynasty forged swords here. By modern times, mining at Daye Iron Mine culminated in the magnificent sight of \"Asia's Largest Open-Pit Mine.\" Intermediate-scale iron ore deposit."
