 building_TK_20_84_YanChengHaiYan1Ji: "$TK_20_84_YanChengHaiYan1Ji$"
 building_TK_20_84_YanChengHaiYan1Ji_desc: "Yancheng Haiyan: Yancheng was formerly known as \"Yandu.\" In the sixth year of Emperor Gao of the Western Han Dynasty (201 BC), Yandu County was established. In the ninth year of Yixi during the reign of Emperor An of the Eastern Jin Dynasty (413 AD), it was renamed Yancheng County. The city derives its name from salt production, was built for boiling salt, and developed along the salt transport river. Salt produced in the two Huai regions became known as Huaiyan. In the grand millennium-long history of salt industry, Huaiyan earned the reputation of \"boiling the sea's profit, surpassing the southeast, with the two Huai being the finest.\" People even used the phrase \"Huaiyan out, all under heaven is salty\" to describe its status in ancient salt history. Scale of primary salt mines."
