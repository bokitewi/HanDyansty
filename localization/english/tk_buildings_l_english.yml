 building_type_TK_20_83_HanJiaJinKuang1Ji: "Gold Mine"
 building_type_TK_20_83_HanJiaJinKuang1Ji_desc: "Only by washing sand and cutting rock can tiny amounts of gold be obtained. Among the most precious substances in the realm, it has long been sought by officials and powerful families alike."
 TK_20_83_HanJiaJinKuang1Ji: "Hanjia Gold Mine Level 1"
 building_TK_20_83_HanJiaJinKuang1Ji: "$TK_20_83_HanJiaJinKuang1Ji$"
 building_TK_20_83_HanJiaJinKuang1Ji_desc: "Hanjia County in the dependent territory of Shu Commandery was formerly called Qingyi, receiving its present name during the Yangjia era of Emperor Xiaoshun. Mountains on both banks of the Qingyi River yield gold, and gold washers live scattered along the water. At present, only a few scattered mining households wash for gold here, finding little."
 building_type_TK_20_83_HanJiaJinKuang2Ji: "Gold Mine"
 building_type_TK_20_83_HanJiaJinKuang2Ji_desc: "Only by washing sand and cutting rock can tiny amounts of gold be obtained. Among the most precious substances in the realm, it has long been sought by officials and powerful families alike."
