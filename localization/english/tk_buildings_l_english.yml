 building_TK_20_85_DuShanYuShiKuang2Ji_desc: "Dushan Jade Mine: Also known as \"Nanyang Jade,\" \"Henan Jade,\" or \"Duyu,\" it is one of China's Four Famous Jades and bears the title of Nanyang Emerald. In Zhang Heng's *Nandu Fu* from the Eastern Han Dynasty: \"Its treasures and rare wonders include golden luster and uncut jade, pearls that shine at night, precious delicacies and jade pendants, filling the round earth; carved and inlaid with gold and pearls, a dazzling array.\" The *Book of Han* records that Shagangdian at the foot of Dushan was then known nationwide as \"Jade Street Temple,\" serving as a hub for the production, sales, and trade of Nanyang jade carvings; these ancient texts all record that from the pre-Qin period to the Han Dynasty, this was a prized gemstone among jades. Medium-scale jade mine."
