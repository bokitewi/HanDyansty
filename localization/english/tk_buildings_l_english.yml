 building_TK_20_84_ShuoFangQingYan1Ji_desc: "South of Shuofang County lie the Jinlian and Qingyan salt lakes. They produce large, pale greenish-white salt grains known as Qing salt or Rong salt, used by physicians in medicine. The court has appointed officials to oversee salt production here. At present, only a few salt-producing households work here, yielding just enough for the nearby settlements."
