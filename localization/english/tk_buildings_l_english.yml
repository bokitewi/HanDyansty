 building_TK_20_87_WanShanZhuShaKuang4Ji_desc: "Wanshan Cinnabar Mine: Mining began during the Qin and Han dynasties, with over two millennia of history in the extraction and smelting of mercury. The Wanshan mercury mine was once China's largest industrial production base for mercury; its reserves and output ranked first nationwide, second in Asia, and third globally, earning it the prestigious title \"Capital of Mercury in China.\" It is highly probable that the cinnabar tribute presented by Ba Gu Funiang Qing to Emperor Qin Shi Huang during the Qin dynasty originated from this location. This mine represents a top-tier cinnabar deposit."
