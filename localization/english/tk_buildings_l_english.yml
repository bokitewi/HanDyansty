 building_TK_20_82_ShiJianYinKuang1Ji_desc: "Ishizaki Silver Mine: The earliest written records of the Ishizaki Silver Mountain date back to 1309, but it truly flourished in the latter half of the 16th century. From 1526 onward, mining operations continued for over 400 years; from the late Sengoku period through the early Edo period, it was Japan's largest silver mine. Primary silver ore scale."
