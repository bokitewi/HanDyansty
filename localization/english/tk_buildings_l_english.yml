 TK_20_85_XiuYanYuShiKuang1Ji: "Xiuyan Jade Mine Level 1"
 building_TK_20_85_XiuYanYuShiKuang1Ji: "$TK_20_85_XiuYanYuShiKuang1Ji$"
 building_TK_20_85_XiuYanYuShiKuang1Ji_desc: "Xiuyan Jade Mine: Also known as serpentine jade, one of China's four famous jades. Named after its origin in Xiuyan, Liaoning Province, the earliest recorded name for this jade appears in the Western Han Dynasty text \"Erya\": \"Among the beauties of the east, there is the Xunxu Qi of Yiwulu.\" The recognition and development of Xiuyan jade in China span over 8,000 years, with its products continuing from the Neolithic period through the Ming and Qing dynasties. It has consistently been a mid-to-low grade jade with leading production volume and the most widespread application in China. Primary-scale jade mine."
