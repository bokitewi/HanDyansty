 building_TK_20_81_BianDanShanTieKuang4Ji_desc: "Far to the south, a long mountain range lies north of Funan, thick with forest and shrouded in unhealthy mists. Iron-bearing rock is plentiful, and local people mine and smelt it to make knives and axes. Pits and smelting works cover the valleys, employing countless craftsmen and laborers and producing enough to supply the surrounding region."
