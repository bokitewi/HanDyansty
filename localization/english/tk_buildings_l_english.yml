 building_TK_20_85_LanTianYuShiKuang1Ji_desc: "Lantian Jade Mine: One of China's Four Famous Jades, renowned for the title \"Jade of Lantian.\" It is among the earliest jades developed and utilized in China. The name \"Lantian Jade\" originates from its production on Lantian Mountain in Xi'an, Shaanxi Province. The famous Qin Shi Huang's Imperial Seal was crafted from Lantian Water Azure Jade. This is a primary-scale jade mine."
