l_english:
 hd_j16.4000.t:0 "The Golden Knife Ruse"
 hd_j16.4000.desc:0 "Murong Chui and his son fled to Qin, and the Heavenly King treats them as honored guests while the court looks on askance. You see it plainly: the man is a dragon among men and will never be anyone's tool. Murong Ling is serving with the army on this eastern campaign against Luoyang, which gives you your chance. Bribe Jin Xi, an old retainer of his father, and send him to Ling carrying the golden knife Chui once gave you, with word that his father can no longer stay in Chang'an and wants him to go back to Yan first."
 hd_j16.4000.a:0 "Send Jin Xi with the golden knife."
 hd_j16.4000.b:0 "Deal honestly. No such ruse."
 hd_j16.4001.t:0 "The Word of the Golden Knife"
 hd_j16.4001.desc:0 "Jin Xi, one of your father's old retainers, came to the camp by night carrying the golden knife, saying it was your father's will: Qin is no place to stay, go ahead and he will follow. The knife is your father's own, yet Wang Meng asked him for it only lately. True or false, there is no telling."
 hd_j16.4001.a:0 "A father's command cannot be refused. Ride east at once."
 hd_j16.4001.b:0 "There is a trick here. Stay put."
 hd_j16.4002.t:0 "Ling Has Fled"
 hd_j16.4002.desc:0 "Word has reached Chang'an: Ling has fled the army for Yan. The whole court says father and son were two-faced from the start. Nothing you say will clear you; to stay is to await death, and to flee confirms the charge."
 hd_j16.4002.a:0 "Flee east in terror and trust to fate."
 hd_j16.4002.b:0 "Bind yourself and await the Heavenly King's judgment."
 hd_j16.4010.t:0 "After the Golden Knife"
 hd_j16.4010.desc:0 "The golden knife affair has set the whole city talking, and Ling bears the name of a traitor son. The Heavenly King summons you and speaks kindly: father and son each had their own will, and one shall not answer for the other. You know full well Wang Meng laid this trap, yet no one at court will say a word for you."
 hd_j16.4010.a:0 "Swallow the insult. There is time yet."
 hd_j16.4010.b:0 "Apologize in person and ask for a provincial post."
 hd_j16.4010.c:0 "Such a wrong can never be forgotten."
 hd_j16.4020.t:0 "Wang Meng Asks for Murong Chui's Death"
 hd_j16.4020.desc:0 "Wang Meng has sent another secret memorial: Murong Chui and his son are princes of the Yan house now lodging at the Qin court, like dragons or wild beasts that can never be tamed, and should be removed while there is time. Since the golden knife affair, more and more at court agree."
 hd_j16.4020.a:0 "I am winning over the heroes of the realm with righteousness. How could I kill him?"
 hd_j16.4020.b:0 "Jinglue is right. Put him to death."
 hd_j16.4020.c:0 "Post him to a frontier commandery, away from the troops."
 hd_j16.4030.t:0 "Qin Envoys at Chouchi"
 hd_j16.4030.desc:0 "Envoys from Qin have come to the foot of Mount Chouchi, demanding a son as hostage and yearly submission. Fu Ya and Yang An are massing troops west of the Long hills. Chouchi stands on sheer cliffs, and your forefathers have held it for seven generations. Why bow to the Di house of Fu?"
 hd_j16.4030.a:0 "Kill the envoys and hold the heights."
 hd_j16.4030.b:0 "Submit a memorial as a vassal and preserve the clan."
 hd_j16.4040.t:0 "Designs on Liang and Yi"
 hd_j16.4040.desc:0 "With Chouchi pacified, the gate of Hanzhong lies open. The Jin armies of Liang and Yi are cut off, the Inspector of Yi has just died, and the people are unsettled. Yang An knows the mountain paths of the Di and Qiang, and Zhu Rong asks to lead the vanguard."
 hd_j16.4040.a:0 "Send Yang An and Zhu Rong against Shu."
 hd_j16.4040.b:0 "Hold off for now and watch."
 hd_j16.4041.t:0 "Qin Troops Enter Hanzhong"
 hd_j16.4041.desc:0 "An urgent report from Liang: the Qin generals Yang An and Zhu Rong have marched out of Hanzhong straight for Chengdu. Liang and Yi have few troops and fewer commanders, and may not hold."
 hd_j16.4041.a:0 "Send relief at once."
 hd_j16.4050.t:0 "Wang Meng's Last Words"
 hd_j16.4050.desc:0 "When Wang Meng lay dying, you went to his bedside yourself to ask his last counsel. He said: Jin may be tucked away south of the Yangtze, but it holds the true succession, and high and low live in harmony; after my death, may Your Majesty not make designs on Jin. The Xianbei and Western Qiang are our enemies and will bring disaster in the end; remove them gradually, for the good of the state. Then he breathed his last."
 hd_j16.4050.a:0 "I will keep Jinglue's words in my heart."
 hd_j16.4050.b:0 "The realm is not yet one. I cannot stop now."
 hd_j16.4060.t:0 "Asking Qin for Troops"
 hd_j16.4060.desc:0 "Shiyijian has attacked you year after year, and your people are dead or scattered; you cannot hold out much longer. The Heavenly King in Chang'an is looking north, and a word from you would bring Qin troops beyond the passes. But once the wolf is let into the house, will Dai still be yours?"
 hd_j16.4060.a:0 "Send envoys to Chang'an and ask for troops."
 hd_j16.4060.b:0 "Endure a while longer. Do not call on Qin yet."
 hd_j16.4061.t:0 "Qin Troops Approach"
 hd_j16.4061.desc:0 "Liu Weichen has gone over to Qin and is leading the Qin armies here. Fu Luo has crossed the frontier in great strength. You are old, your sons quarrel, and the tribes are restless. Fight or make terms, you must decide soon."
 hd_j16.4061.a:0 "Muster the tribes and meet Qin at Yunzhong."
 hd_j16.4061.b:0 "Send envoys and submit as a vassal, to keep the ancestral shrines."
 hd_j16.4061.c:0 "Send Yan Feng to Qin to talk them into delay."
 hd_j16.4080.t:0 "Summoned to Court"
 hd_j16.4080.desc:0 "The Qin envoys Liang Shu and Yan Fu have reached Guzang bearing the Heavenly King's edict summoning you to court. Some of your men say Qin is too strong and you should submit; others say the Zhang have held Hexi for generations and would rather die than kneel."
 hd_j16.4080.a:0 "Behead the envoys and fight Qin."
 hd_j16.4080.b:0 "Obey the summons and keep the region whole."
 hd_j16.4100.t:0 "The Siege of Xiangyang"
 hd_j16.4100.desc:0 "With Liang and Yi taken, Xiangyang is now the northern gate of Jin. Zhu Xu holds the city with fewer than ten thousand men. Fu Pi asks to lead the armies south, with Gou Chang, Murong Chui and Yao Chang each commanding a column as the vanguard."
 hd_j16.4100.a:0 "Send Fu Pi to besiege Xiangyang."
 hd_j16.4100.b:0 "Hold off the southern campaign and rest the troops."
 hd_j16.4110.t:0 "Victory at Junchuan"
 hd_j16.4110.desc:0 "The Qin generals Peng Chao and Ju Nan invaded Huainan, besieged San'e and pushed their vanguard toward Guangling. [hd_news_a.GetName] led the Beifu Army out of Guangling and routed the Qin forces at Junchuan; Peng Chao and Ju Nan barely escaped with their lives. From that day the name of the Beifu Army was feared."
 hd_j16.4130.t:0 "The Western Regions Campaign"
 hd_j16.4130.desc:0 "The kings of Jushi and Shanshan have come to court, saying the states of the Western Regions have long been cut off from China and offering to guide an army to bring them to order. In Kucha lives the famous monk Kumarajiva. Lü Guang asks to lead seventy thousand men out through the Jade Gate."
 hd_j16.4130.a:0 "Send Lü Guang west."
 hd_j16.4130.b:0 "The Western Regions are too far. It is a waste of men."
 hd_j16.4131.t:0 "Lü Guang Takes Kucha"
 hd_j16.4131.desc:0 "[hd_news_a.GetName] led his army west across the shifting sands, and more than thirty states submitted at the sight of his banners. The king of Kucha shut his gates, and the tribes who came to his aid were crushed west of the city. Kucha fell, and the eminent monk Kumarajiva came into the hands of the Qin army."
 hd_j16.4132.t:0 "The Return East"
 hd_j16.4132.desc:0 "Kucha is pacified and the states of the Western Regions send envoys one after another. Some urge you to stay and rule the west as your own; others say there has been no news from the Central Plains and no one knows if the Heavenly King lives, so better to return east soon."
 hd_j16.4132.a:0 "Load twenty thousand camels with treasure and return east."
 hd_j16.4132.b:0 "Stay to govern the Western Regions."
 hd_j16.4140.t:0 "The Youngsters Have Beaten the Enemy"
 hd_j16.4140.desc:0 "When the dispatch from the Fei River reached Jiankang, [hd_news_a.GetName] was playing weiqi with a guest. Having read it, he laid it aside on the couch without a trace of joy and went on with the game. When the guest could not help asking, he said only: the youngsters have beaten the enemy. The Qin host of a million men has fallen apart."
 hd_j16.4140.b:0 "Go on with the game."
 hd_j16.4150.t:0 "After the Fei River"
 hd_j16.4150.desc:0 "One defeat at the Fei River and the Qin host of a million melted away overnight; only your army remains intact. The Heavenly King has fled to your camp with barely a thousand horsemen. Murong De and Murong Bao both urge you: Heaven has handed you the moment, kill him now and Yan can rise again."
 hd_j16.4150.a:0 "Return the troops and escort the Heavenly King north."
 hd_j16.4150.b:0 "Seize the camp and restore Yan."
 hd_j16.4150.c:0 "Ask to go to Hebei and pacify the old following."
 hd_j16.4160.t:0 "Murong Chui Asks to Go to Hebei"
 hd_j16.4160.desc:0 "Murong Chui memorializes: when the people of the north hear the royal army has failed, some may act rashly; he asks leave to go and pacify Hebei, and to pay respects at his ancestors' tombs on the way. Quan Yi remonstrates bitterly that Murong Chui is an old hawk that clings to men only when hungry and flies off at the first wind; once let go, he will never come back."
 hd_j16.4160.a:0 "I have already given my word. I cannot break faith."
 hd_j16.4160.b:0 "You will stay in Chang'an. Say no more."
 hd_j16.4170.t:0 "Fu Pi Takes the Throne at Jinyang"
 hd_j16.4170.desc:0 "When news of the Heavenly King's murder reached Jinyang, [hd_news_a.GetName] proclaimed mourning, took the imperial throne, changed the era name to Da'an, and called on the generals east of the passes to avenge the late emperor."
 hd_j16.4180.t:0 "Fu Deng Carries On the Line"
 hd_j16.4180.desc:0 "In Longdong the generals raised [hd_news_a.GetName] as their leader and he took the imperial throne. He set up Fu Jian's spirit tablet in the army and prayed before it before every battle; his soldiers carved the words 'death or rest' on their spears and swore to fight Yao Chang to the end."
 hd_j16_n370_army_qiuchi_name:0 "Chouchi Expedition"
 hd_j16_n370_army_yangan_name:0 "Yang An's Army"
 hd_j16_n370_army_fuluo_name:0 "Fu Luo's Army"
 hd_j16_n370_army_liangxi_name:0 "Liang Xi's Army"
 hd_j16_n370_army_fupi_name:0 "Fu Pi's Army"
 hd_j16_n370_army_lvguang_name:0 "Western Expedition"
 hd_j16_n370_army_murongchui_name:0 "Murong Chui's Army"
 hd_j16_jindao_yipan_modifier:0 "Suspected Turncoat"
 hd_j16_jindao_yipan_modifier_desc:0 "Having fled back from Qin, this character is suspected by the Yan court of being a spy and is not trusted."
 hd_j16_chui_waifang_modifier:0 "Posted to the Frontier"
 hd_j16_chui_waifang_modifier_desc:0 "Sent out to govern a frontier commandery and kept away from the guard armies."
 hd_j16_qiuchi_jiang_modifier:0 "Commissioned Against Chouchi"
 hd_j16_qiuchi_jiang_modifier_desc:0 "Leading troops by imperial edict against the Yang of Chouchi."
 hd_j16_dai_beizhan_modifier:0 "Preparing for War"
 hd_j16_dai_beizhan_modifier_desc:0 "Qin troops approach, and every tribe has turned out."
 hd_j16_tianxi_guiyi_modifier:0 "Marquis Who Returned to Righteousness"
 hd_j16_tianxi_guiyi_modifier_desc:0 "Surrendered Hexi to Qin and was enfeoffed as Marquis Who Returned to Righteousness, living at ease in Chang'an."
 hd_j16_feishui_zhenhou_modifier:0 "A Cry Behind the Lines"
 hd_j16_feishui_zhenhou_modifier_desc:0 "Zhu Xu shouted behind the Qin lines that Qin was beaten, and the Qin host broke in panic."
 hd_j16_fudeng_zhupai_modifier:0 "Bearing Fu Jian's Tablet"
 hd_j16_fudeng_zhupai_modifier_desc:0 "Fu Jian's spirit tablet rides with the army, and the soldiers have carved 'death or rest' on their spears, sworn to avenge the state."
 hd_j16_jindao_pardon_opinion:0 "Golden Knife Affair Forgiven"
 hd_j16_jindao_grudge_opinion:0 "Grudge over the Golden Knife"
 hd_j16_chui_xiezui_opinion:0 "Apologized in Person"
 hd_j16_qingzhu_xianbei_opinion:0 "Executed Murong Chui"
 hd_j16_yiyan_hu_opinion:0 "Distrusts the Hu, per Wang Meng"
 hd_j16_hujia_opinion:0 "Escorted Me After the Fei River"
 hd_j16_chui_betray_opinion:0 "Seized the Camp and Rebelled"
 hd_j16_xiyu_qiuci_opinion:0 "Conquered Kucha"
