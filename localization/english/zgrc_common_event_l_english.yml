 # ============================================================
 # 事件：入乡随俗
 # ============================================================
 zgrc_common.0002.t:0 "Follow local customs when entering a new place."
 zgrc_common.0002.desc:0 "Having resided here for so long, my very self has gradually been stained by the local customs and ways. How much of my native accent and old traditions remain?"
 zgrc_common.0002.a:0 "Follow local customs when entering a new region; adopt the practices of the area."
 zgrc_common.0002.b:0 "Contented with their native land and reluctant to move, they preserve their ancestral customs."
 # ============================================================
 # 事件：厚生慎死·极端爆发（非常时期人物响应）
 # ============================================================
 zgrc_common.1001.t:0 "Rebellions in the Four Directions"
 zgrc_common.1001.desc:0 "Under [Root.Liege.GetName], civil unrest erupts and spreads across the land. Chaos is imminent, [Root.GetName]. How will you respond?"
 zgrc_common.1001.a:0 "Eat the salary of your lord, serve his cause with loyalty—act immediately to defend the king!"
 zgrc_common.1001.b:0 "Are kings, lords, generals, and ministers born of a different lineage?"
 zgrc_common.1001.c:0 "It's not my business; I'll just watch the situation unfold."

 zgrc_common.1002.t:0 "Miao Yue's Rebellion"
 zgrc_common.1002.desc:0 "The Miao and Yue chieftains rose in rebellion, shaking the territory of [Root.Liege.GetName]. What will you do, [Root.GetName]?"
 zgrc_common.1002.a:0 "Protect the realm and secure the people; immediately serve the king!"
 zgrc_common.1002.b:0 "Are kings, lords, generals, and ministers born of a different lineage?"
 zgrc_common.1002.c:0 "It's not my business; I'll just watch the situation unfold."

 zgrc_common.1003.t:0 "Barbarians invade the borders"
 zgrc_common.1003.desc:0 "The territories of [Root.Liege.GetName] are being invaded by barbarians, who demand the title of King. In times of national crisis, [Root.GetName], how will you respond?"
 zgrc_common.1003.a:0 "My family has served the Han Dynasty for generations; I dare not betray righteousness!"
 zgrc_common.1003.b:0 "Are kings, lords, generals, and ministers born of a different lineage?"
 zgrc_common.1003.c:0 "It's not my business; I'll just watch the situation unfold."

 zgrc_common.1004.t:0 "Rebellion of the Royal Family"
 zgrc_common.1004.desc:0 "A fellow imperial clan prince raises an army to rebel and march directly toward [Root.Liege.GetName]. With the ancestral temple before us, [Root.GetName], how will you conduct yourself?"
 zgrc_common.1004.a:0 "Guard the imperial ancestral temple, and immediately come to the aid of the king!"
 zgrc_common.1004.b:0 "Are kings, lords, generals, and ministers born of a different lineage?"
 zgrc_common.1004.c:0 "It's not my business; I'll just watch the situation unfold."

 zgrc_common.1005.t:0 "Vassals Rebel Against the Emperor"
 zgrc_common.1005.desc:0 "Feudal lords raise armies to rebel against the ruler, shaking the entire world and pointing directly at [Root.Liege.GetName]. A contest of heaven's mandate, [Root.GetName], how will you position yourself?"
 zgrc_common.1005.a:0 "Respect the King and repel the barbarians; act immediately to aid the king!"
 zgrc_common.1005.b:0 "Are kings, lords, generals, and ministers born of a different lineage?"
 zgrc_common.1005.c:0 "It's not my business; I'll just watch the situation unfold."

 zgrc_common.1006.t:0 "Righteous banners everywhere"
 zgrc_common.1006.desc:0 "Heroes of the Han rise in rebellion, red banners spread across the land, pointing directly at [Root.Liege.GetName]. Great chaos is imminent, [Root.GetName], where will you turn?"
 zgrc_common.1006.a:0 "To eat the salary of a ruler is to be loyal to his affairs."
 zgrc_common.1006.b:0 "Drive out the Tartars, restore China!"
 zgrc_common.1006.c:0 "Wait and see what happens."

 zgrc_common.2001.t:0 "Rebels have come to surrender."
 zgrc_common.2001.desc:0 "The lands we seek in this battle are all ancestral territories of the Han. The righteous people, hearing of our cause, have come to join us, willing to lead the vanguard and restore the mountains and rivers of the Han. How shall you deal with this army of righteousness?"
 zgrc_common.2001.a:0 "Come to my aid!"
 zgrc_common.2001.b:0 "Accept those who come to join the righteous army and enroll them under your command!"
 zgrc_common.2001.c:0 "Speak gently to soothe them, allowing them to settle peacefully in their hometowns."
 # 民粹/农民战争直接来投的事件兵军队名
 zgrc_yijun_army_name:0 "Local Militia Volunteer Army"
