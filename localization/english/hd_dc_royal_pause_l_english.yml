l_english:
 hd_dc_support.0008.d: "You owe me a promise. Repay it by holding your troops for a year."
 hd_dc_support.0008.d.tt: "[hd_dc_support_claimant.GetTitledFirstName]'s faction must stand down for a year. It will neither issue an ultimatum nor go to war."
 hd_dc_support.0308.t: "An Armed Remonstrance Deferred"
 hd_dc_support.0308.desc: "A deadline of one year has been added to the exchanged letters. [hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName] has called in a favor owed by [hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName], securing a year without hostilities. The papers calling for war have been set aside for now.\n\nThe faction has not dispersed, and its grievances remain. In a year, the matter will be raised again. For now, at least, this faction will not take up arms over it."
 hd_dc_support.0308.a: "One year. Remember the agreement."
 hd_dc_support.paused_demand: "We have agreed to stand down. Keep this letter unsent."
