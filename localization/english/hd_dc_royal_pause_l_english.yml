l_english:
 hd_dc_support.0008.d: "First, repay me this favor by halting the mobilization for one year."
 hd_dc_support.0008.d.tt: "Deplete your available favor with the candidate; Crisis Conflict Value −15. The claimant's faction suspends new recruitment, ultimatums, and declarations of war for one year under this system. Members and discontent are retained, and ongoing wars remain unaffected. The candidate's opinion of you decreases by 10, while the protected monarch's opinion of you increases by 10. Upon expiration, delayed commands will be re-evaluated; there is no guarantee that war will be declared."
 hd_dc_support.0308.t: "For now, put away the memorial urging military intervention."
 hd_dc_support.0308.desc: "A new deadline has been added to the correspondence: one year. The favors previously owed have now been expended on this request, and mobilization orders are temporarily suppressed. \n\n Despite this, factions remain intact, and their dissatisfaction persists. Once the deadline expires, commands with standing authority will be re-verified; for now, no war that has already erupted is altered by this letter."
 hd_dc_support.0308.a: "Keep the deadline in mind."
 hd_dc_support.paused_demand: "The mobilization has already been temporarily suspended; seal this request for now."
