l_english:
 hd_dc_com.0004.t: "Before the Seal Falls"
 hd_dc_com.0004.desc: "The document has passed between [hd_dc_proposer.GetTitledFirstName] and [hd_dc_recipient.GetTitledFirstName], and now lies on your desk. The envoy offers no urging. He merely turns the place awaiting your seal toward you.\n\n[SCOPE.GetFlagName('hd_dc_proposal_terms')]\n\nWords can be carefully chosen. Once the seals are set, everyone will be watching to see who first makes good on them."
 hd_dc_com.0004.a: "Set my seal to these terms."
 hd_dc_com.0004.a.tt: "Once the agreement is sealed, both parties must abide by it:"
 hd_dc_com.0004.b: "I need a further guarantee before I can agree."
 hd_dc_com.0004.b.tt: "Send back these revised terms for the other party to reconsider:\n[SCOPE.GetFlagName('hd_dc_counter_terms')]"
 hd_dc_com.0004.c: "I cannot accept this agreement."
 hd_dc_signed_terms_opinion: "Signed the Same Agreement"
 hd_dc_counter_terms_opinion: "Requested Further Guarantees"
 hd_dc_rejected_terms_opinion: "Rejected the Proposed Terms"
 hd_dc_theft_pending_credit_tt: "Not all funds deducted from the treasury have arrived. The outstanding amount remains recorded against this withdrawal; processing the same record again will not trigger another deduction."
