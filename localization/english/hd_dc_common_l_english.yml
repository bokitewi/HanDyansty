l_english:
 hd_dc_com.0004.t: "Before the seal is affixed"
 hd_dc_com.0004.desc: "Two documents lie side by side on the desk; one is left for [hd_dc_proposer.GetTitledFirstName], while the other is sent to [hd_dc_recipient.GetTitledFirstName]. The envoy does not urge me, merely turning the unsigned portion toward me. \n\n[SCOPE.GetFlagName('hd_dc_proposal_terms')]\n\nThe words on the paper can be written with care. Once sealed, who will first turn their promise into reality—that is what everyone truly waits to see."
 hd_dc_com.0004.a: "Sign according to these explicit terms."
 hd_dc_com.0004.a.tt: "Sign this agreement. Funds, authority, and military arrangements must be implemented in accordance with the terms before performance results can be assessed."
 hd_dc_com.0004.b: "This reciprocal guarantee is required before acceptance can be granted."
 hd_dc_com.0004.b.tt: "Propose revised terms and wait for a response from the other party: \n[SCOPE.GetFlagName('hd_dc_counter_terms')]"
 hd_dc_com.0004.c: "These conditions are unacceptable."
 hd_dc_signed_terms_opinion: "Jointly sign the agreement"
 hd_dc_counter_terms_opinion: "Request to add guarantees"
 hd_dc_rejected_terms_opinion: "Reject the proposed terms"
 hd_dc_theft_pending_credit_tt: "The funds already deducted from the treasury have not yet been fully received. The unreceived portion remains recorded in this withdrawal entry; processing the same record again will not trigger a new deduction."
