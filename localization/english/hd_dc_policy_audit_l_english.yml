l_english:
 hd_dc_par.0001.t: "A relief effort, two memorial reports"
 hd_dc_par.0001.desc: "Two memorials address the same disaster, yet their proposals diverge. One requests a reduction in taxes to allow the people to survive the present crisis; the other lists expenditures from the imperial treasury and military funds, arguing that maintaining the current tax system is more urgent at this time. \n\n Both leaders have already recorded their opinions. The forthcoming edict will be delivered to the official truly responsible for the region, rather than being debated merely for prestige in the court."
 hd_dc_par.0001.a: "Submit verifiable lists of expenditures and beneficiaries separately."
 hd_dc_par.0001.a.tt: "The official in charge will receive 30 gold within three months, with records kept for the corresponding commandery, the named recipient, and the actual payment received and disbursed; then both faction leaders will reconcile accounts within three months. Only when both signed confirmations are complete does governance +10 and dispute -5 apply. Refusal, loss of authority, timeout, or incomplete payment yields no completion points."
 hd_dc_par.0001.b: "First approve the reduction of taxes, with the party advocating this policy taking the lead in implementation."
 hd_dc_par.0001.b.tt: "First, the leader of the tax reduction faction accepts the original terms, followed by the actual local officials. Each level has three months to respond; upon payment of 100 gold, a twelve-month tax reduction is implemented. The original terms can only be accepted or rejected; governance +5 is granted only after the actual period is completed."
 hd_dc_par.0001.c: "First maintain the current tax system; both of you should exercise some restraint."
 hd_dc_par.0001.c.tt: "Record the current strategy's true command; Dispute +10. Both faction leaders suffer a -10 penalty for rebuking you. Those who have signed their support for the policy to preserve the treasury additionally gain +10 toward you for retaining their policy. This node concludes without increasing tax rates or governance points."
 hd_dc_par.0001.d: "Conduct trial runs in two nearby locations, then jointly inspect the results together."
 hd_dc_par.0001.d.tt: "Two genuinely affected commanderies are required, with development difference not exceeding 3 and control difference not exceeding 10; you must manage at least 16, or have trusted officials satisfy this ability. After both actual local officials accept the proposal separately, each pays 50 gold: the original case commandery reduces taxes for twelve months, while the other commandery maintains current policies for twelve months. Tax revenue −10%, development growth +25%, public opinion +20. Both commanderies must be implemented and accepted by both party leaders respectively to gain governance +20; victory is not predetermined and development levels are not artificially increased."
 hd_dc_par.invalid: "The situation has changed; the old documents can no longer be followed as before."
 hd_dc_par.1301.t: "Imperial edicts delivered to the localities"
 hd_dc_par.1301.audit: "The court requires verification of the policy expenditures and beneficiaries for [hd_dc_audit_county.GetName], with me responsible for handling the ledgers. Upon acceptance, thirty taels of gold were allocated; the records of receipts and payments, along with the actual situation in this commandery, are to be submitted jointly to the two faction leaders for review. \n\n I must provide a clear response within three months and cannot merely accept the documents and allow the court to believe the matter has been concluded."
 hd_dc_par.1301.relief: "[hd_dc_audit_county.GetName] is selected as the region for a trial reduction of taxes. The court intends to allocate fifty taels of gold, which I will execute over twelve months, comparing this measure with the current policy in another nearby prefecture affected by disaster. Funds will be disbursed only after both regions have agreed. My name will be recorded on the report of execution; any loss of jurisdiction or premature termination of the tax reduction during the trial period cannot be counted as full fulfillment. \n\n"
 hd_dc_par.1301.reserve: "[hd_dc_audit_county.GetName] has been selected to maintain the current policy. The court intends to allocate fifty taels of gold, allowing me to retain the existing tax system for twelve months, with oversight and development under record control, jointly inspected alongside another prefecture that reduces taxes due to disaster. \n\n I do not need to prove that my faction is always right, but I must be accountable for what I actually execute."
 hd_dc_par.1301.a: "I accept this explicit commission."
 hd_dc_par.1301.b: "I cannot accept this assignment."
 hd_dc_par.1302.t: "Sign your name on the audit report."
 hd_dc_par.1302.first: "The first entry listed in the ledger is [scope:hd_dc_instance.Var('hd_dc_audit_first_county').Title.GetName], handled by [scope:hd_dc_instance.Var('hd_dc_audit_first_executor').Char.GetTitledFirstName]. The actual amount disbursed was [scope:hd_dc_instance.Var('hd_dc_audit_first_payment').Var('hd_dc_actual_debit').GetValue|0] taels, and the actual amount received was [scope:hd_dc_instance.Var('hd_dc_audit_first_payment').Var('hd_dc_actual_credit').GetValue|0] taels. \n\n These accounts require my personal verification. Another leader will also submit a separate response; it cannot be substituted with my signature."
 hd_dc_par.1302.second: "\n\nThe other location is [scope:hd_dc_instance.Var('hd_dc_audit_second_county').Title.GetName], administered by [scope:hd_dc_instance.Var('hd_dc_audit_second_executor').Char.GetTitledFirstName]. [scope:hd_dc_instance.Var('hd_dc_audit_second_payment').Var('hd_dc_actual_debit').GetValue|0] gold was actually disbursed, and [scope:hd_dc_instance.Var('hd_dc_audit_second_payment').Var('hd_dc_actual_credit').GetValue|0] gold actually arrived.\n\nTwelve months of actual implementation have been verified in both locations. In the first, control changed from [scope:hd_dc_instance.Var('hd_dc_audit_first_start_control').GetValue|0] to [scope:hd_dc_instance.Var('hd_dc_audit_first_end_control').GetValue|0], and development from [scope:hd_dc_instance.Var('hd_dc_audit_first_start_development').GetValue|0] to [scope:hd_dc_instance.Var('hd_dc_audit_first_end_development').GetValue|0]; in the second, control changed from [scope:hd_dc_instance.Var('hd_dc_audit_second_start_control').GetValue|0] to [scope:hd_dc_instance.Var('hd_dc_audit_second_end_control').GetValue|0], and development from [scope:hd_dc_instance.Var('hd_dc_audit_second_start_development').GetValue|0] to [scope:hd_dc_instance.Var('hd_dc_audit_second_end_development').GetValue|0]. These changes were not all caused by the trial, so they cannot justify proclaiming victory for either school of thought."
 hd_dc_par.1302.a: "I have reviewed each item individually and agree to be credited."
 hd_dc_par.1302.b: "I will not sign this acceptance document."
 hd_dc_par.1303.t: "How should this case be recorded?"
 hd_dc_par.1303.verified: "Receipts and signatures from both leaders are now complete. The handler has settled this case according to actual performance, and the agreed-upon governance share is recorded only once for this instance. \n\n The case file does not claim that the world has been pacified as a result, nor does it write an ending for unresolved wars or promises."
 hd_dc_par.1303.partial: "The two pilot implementations could not be completed simultaneously. Payments made, policies executed, and reasons for interruption are recorded separately in the case files; outstanding balances that have not yet been received remain on account. \n\n The completion of one location cannot be counted as the completion of both locations; therefore, no full governance points will be awarded this time."
 hd_dc_par.1303.failed: "This dispatch failed to gather the required acceptance, execution, and reconciliation. The handling personnel have recorded the reason for termination; payments already made remain retained as actual, and missing vouchers cannot be compensated by a single document. \n\n This node does not yield completed governance points."
 hd_dc_par.1303.a: "Save the scroll according to reality."
