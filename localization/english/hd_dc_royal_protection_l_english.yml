l_english:
 hd_dc_support.0008.b: "Without a guarantee to protect my family and fiefdom, I cannot pledge allegiance."
 hd_dc_support.0008.b.tt: "Do not immediately join the faction or claim remuneration; require the candidate to respond within three months regarding the five-year protection clause. The candidate first imposes a -15 penalty on you; upon actual acceptance, grants +15 to you and +10 mobilization bonus. At signing, freeze your relationship with all surviving close relatives present at that time, as well as each person's current titles: bind the candidate personally from detaining or executing named protected individuals without legal basis, or revoking corresponding titles; this does not bind third parties and does not pardon subsequent genuine crimes. A commitment to establish protection does not equate to fulfillment of the five-year obligation."
 hd_dc_support.0208.t: "Named protection in the return book"
 hd_dc_support.0208.desc: "The reply did not promise troops or horses, but first listed the matters of concern to [scope:hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName]: oneself, living close relatives still in this world, and their current fiefs. \n\n \"If I cannot even speak plainly about these, how dare I entrust my family to a future reward?\" \n\n The other party demands that I personally accept five years of restraint. Newly born descendants and titles acquired in the future will not automatically be added to the roster; genuine crimes can still be dealt with according to law. I may sign or refuse; I cannot treat the other party's request as already joining the faction."
 hd_dc_support.0208.a: "Signed according to today's roster; I personally guarantee the contract for five years."
 hd_dc_support.0208.b: "I do not accept this constraint."
 hd_dc_support.0408.t: "Echoes of the Alliance Charter"
 hd_dc_support.0408.accepted: "The candidate has personally accepted the terms; the register and list of titles are sealed according to the actual circumstances on the day of signing. The five-year term begins from now. \n\n This alliance document does not substitute for my joining any faction, nor is there an advance payment of imagined rewards. Whether the signatories uphold their obligations in the future depends on what they truly do."
 hd_dc_support.0408.rejected: "The candidate withdrew the protective clause and did not assume this five-year constraint. \n\n I also did not join a faction or receive an unpaid sum of money as a result. This exchange is recorded as an agreement that failed to be reached."
 hd_dc_support.0408.a: "Keep this reply letter safe."
