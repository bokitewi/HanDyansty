l_english:
 hd_dc_support.0008.b: "I cannot answer the call without a pledge to protect my family and lands."
 hd_dc_support.0008.b.tt: "If [hd_dc_support_claimant.GetTitledFirstName] agrees to sign a pledge protecting your family and lands:"
 hd_dc_support.0208.t: "A Written Pledge of Protection"
 hd_dc_support.0208.desc: "The reply promises no troops. Instead, it begins with the matters that trouble [hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName] most: personal safety, living close relatives, and the lands they currently hold.\n\n\"If you will not even give your word on these, how can I entrust my family to a promise of future rewards?\"\n\nThe other party wants your personal guarantee for five years. Later descendants and newly acquired lands are excluded, and anyone who truly commits a crime may still be dealt with according to law."
 hd_dc_support.0208.a: "Draw up the pledge from today's register, for a term of five years."
 hd_dc_support.0208.b: "These terms bind me too tightly. I cannot accept."
 hd_dc_support.0408.t: "The Pledge's Reply"
 hd_dc_support.0408.accepted: "[hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName] has signed the pledge personally. Your name, those of your close relatives, and everyone's lands are recorded as they stand on this day. The five-year term begins now.\n\nThis pledge does not mean you have joined any faction, nor has any reward been paid in advance. Whether it is honored will depend on the signatory's actions."
 hd_dc_support.0408.rejected: "[hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName] has returned the pledge, unwilling to undertake this five-year obligation.\n\nYou have joined no faction and gained no benefit. This exchange ends here."
 hd_dc_support.0408.a: "Keep the reply safe."
