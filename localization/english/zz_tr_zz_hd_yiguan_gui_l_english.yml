l_english:
 # Southern Migration of the Gentry - situation window (docs/衣冠南渡_重做设计.md §1 round 10, §5.12 module F; gui/window_hd_yiguan.gui)

 # ---------- Title bar and phase illustration ----------
 hd_yiguan_gui_participants_tt:0 "View the roster of the five parties"
 hd_yiguan_gui_map_situation_tt:0 "Switch to the situation map: coloured by participating party"
 hd_yiguan_gui_map_realms_tt:0 "Return to the realms map"
 hd_yiguan_gui_current_phase:0 "Current Phase"
 hd_yiguan_gui_years:0 "Years since the Southern Migration of the Gentry began: [Situation.MakeScope.Var('hd_yiguan_years').GetValue|0] · This phase began on [SituationPhase.GetStartDate.GetStringShort]"
 hd_yiguan_gui_years_new:0 "The Southern Migration of the Gentry has only just begun · This phase began on [SituationPhase.GetStartDate.GetStringShort]"
 hd_yiguan_gui_fallback_note:0 "If still unresolved after two hundred years, the outcome will be settled automatically by who holds the Eight Northern Provinces"
 hd_yiguan_gui_phase_unlocks:0 "Unlocked in this phase:"

 # ---------- Your group ----------
 hd_yiguan_gui_my_group_header:0 "Your Position"
 hd_yiguan_gui_my_group_sub:0 "The group you belong to"
 hd_yiguan_gui_no_group:0 "You stand apart from this southern migration. Only independent rulers (duke tier or above) whose capital lies in the Eight Northern Provinces or in Jing and Yang are drawn into it, together with the Han vassals (count tier or above) of not-yet-Sinicized Hu rulers whose capital lies in the Eight Northern Provinces, and landless Han Gentry whose estate lies in the Eight Northern Provinces."
 hd_yiguan_gui_view_participants:0 "View the Parties"

 # ---------- Courses and catalysts ----------
 hd_yiguan_gui_future_header:0 "Course of the Realm"
 hd_yiguan_gui_future_hint:0 "Once any course gathers one thousand points, the realm passes into that phase and every course begins counting anew. Click a card to see the catalysts driving it; hover to see how each party fares in that phase."
 hd_yiguan_gui_leading_tt:0 "The course currently in the lead"
 hd_yiguan_gui_phase_points:0 "[FutureSituationPhase.GetProgress]/[FutureSituationPhase.GetTakeoverPoints]"
 hd_yiguan_gui_catalyst_header:0 "Catalysts Driving [SituationPhaseType.GetNameNoTooltip]"
 hd_yiguan_gui_catalyst_hint:0 "Each catalyst counts at most three times per year (the passage of time excepted). The figure on the right shows how many times it has fired during this phase."
 hd_yiguan_gui_catalyst_none:0 "For now, no catalyst can drive this course."
 hd_yiguan_gui_catalyst_count:0 "[Select_CString( GreaterThan_int32( SituationPhase.GetNumCompletionsOfCatalystForPhase( SituationPhaseType.Self, SituationCatalystEntry.GetCatalyst ), '(int32)0' ), '#COLOR_GREEN ', '#COLOR_GRAY ' )]×[SituationPhase.GetNumCompletionsOfCatalystForPhase( SituationPhaseType.Self, SituationCatalystEntry.GetCatalyst )]#!"
 hd_yiguan_gui_catalyst_back:0 "Back"
 hd_yiguan_gui_catalyst_back_tt:0 "Clear the selection and view the course currently in the lead"

 # ---------- Effects on each group this phase ----------
 hd_yiguan_gui_effects_header:0 "How Each Party Fares During [SituationPhaseType.GetNameNoTooltip]"
 hd_yiguan_gui_effects_yours:0 "(Your group)"
 hd_yiguan_gui_effects_none:0 "This phase has no particular effect on this party."
 hd_yiguan_gui_effects_pick:0 "Click a tab above to see how each party fares in this phase."

 # ---------- Decisions available to this group ----------
 hd_yiguan_gui_decisions_header:0 "Decisions Open to Your Group"
 hd_yiguan_gui_decisions_hint:0 "Greyed-out entries do not yet meet their requirements; hover for a description, click to see all requirements."
 hd_yiguan_gui_decisions_none:0 "Your party has no Southern Migration of the Gentry decisions available at present."

 # ---------- Endings ----------
 hd_yiguan_gui_endings_header:0 "Endings"
 hd_yiguan_gui_endings_hint:0 "Whoever meets the requirements may proclaim an ending, bringing the Southern Migration of the Gentry to a close. Click a card to see all requirements."
 hd_yiguan_gui_endings_ready:0 "The hour has come: an ending can be proclaimed!"
 hd_yiguan_gui_end_possible:0 "Can Be Proclaimed"
 hd_yiguan_gui_end_blocked:0 "Requirements Not Met"
 hd_yiguan_gui_end_not_eligible:0 "You Cannot Proclaim This"
 hd_yiguan_gui_end_phase_taowang_ok:0 "The Flight phase is now under way"
 hd_yiguan_gui_end_phase_taowang_bad:0 "Requires the Flight phase"
 hd_yiguan_gui_end_phase_chongtu_ok:0 "The Conflict phase is now under way"
 hd_yiguan_gui_end_phase_chongtu_bad:0 "Requires the Conflict phase"
 hd_yiguan_gui_end_phase_tingzhi_ok:0 "The Stalemate phase is now under way"
 hd_yiguan_gui_end_phase_tingzhi_bad:0 "Requires the Stalemate phase"
 hd_yiguan_gui_end_cond_guangfu:0 "An independent ruler (kingdom tier or above) of the Southern Regimes or the Northern Han whose own realm holds more than 60% of the counties in the Eight Northern Provinces, and who holds Luoyang or Chang'an."
 hd_yiguan_gui_end_cond_heliu:0 "The Sinicized Regimes together hold more than 60% of the counties in the Eight Northern Provinces; the most powerful among them makes the proclamation."
 hd_yiguan_gui_end_cond_lunsang:0 "An independent ruler (kingdom tier or above) of the Hu Regimes whose own realm holds more than 70% of the counties in the north, and who holds both Luoyang and Chang'an; Han Regimes hold less than 10% of the north's counties."
 # Live progress (shown only when eligible and during the matching phase; shares and thresholds read the A2 script values; the two-capitals check matches the ending decisions: holder.top_liege = self)
 hd_yiguan_gui_end_prog_guangfu:0 "Your realm's share of the north: #high [GetPlayer.MakeScope.ScriptValue('hd_yiguan_realm_north_pct_value')|1]%#! (requires [GetPlayer.MakeScope.ScriptValue('hd_yiguan_end_guangfu_pct_value')|0]%)\nLuoyang: [Select_CString( ObjectsEqual( GetTitleByKey('c_luoyang').GetHolder.GetTopLiege, GetPlayer ), '#P held#!', '#N not held#!' )]  Chang'an: [Select_CString( ObjectsEqual( GetTitleByKey('c_uuii_p_867').GetHolder.GetTopLiege, GetPlayer ), '#P held#!', '#N not held#!' )] (holding either one suffices)"
 hd_yiguan_gui_end_prog_heliu:0 "Sinicized Regimes' combined share of the north: #high [GetPlayer.MakeScope.ScriptValue('hd_yiguan_north_sin_pct_value')|1]%#! (requires [GetPlayer.MakeScope.ScriptValue('hd_yiguan_end_heliu_pct_value')|0]%)"
 hd_yiguan_gui_end_prog_lunsang:0 "Your realm's share of the north: #high [GetPlayer.MakeScope.ScriptValue('hd_yiguan_realm_north_pct_value')|1]%#! (requires [GetPlayer.MakeScope.ScriptValue('hd_yiguan_end_lunsang_pct_value')|0]%)\nHan Regimes' share of the north: #high [GetPlayer.MakeScope.ScriptValue('hd_yiguan_north_han_pct_value')|1]%#! (must be below [GetPlayer.MakeScope.ScriptValue('hd_yiguan_end_lunsang_han_max_pct_value')|0]%)\nLuoyang: [Select_CString( ObjectsEqual( GetTitleByKey('c_luoyang').GetHolder.GetTopLiege, GetPlayer ), '#P held#!', '#N not held#!' )]  Chang'an: [Select_CString( ObjectsEqual( GetTitleByKey('c_uuii_p_867').GetHolder.GetTopLiege, GetPlayer ), '#P held#!', '#N not held#!' )] (both must be held)"
