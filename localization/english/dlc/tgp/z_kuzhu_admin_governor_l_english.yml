l_english:
 #行政制法律契约
 kuzhu_government_size_laws:0 "Size of the Civil Administration"
 kuzhu_small_government_size:0 "Small Civil Administration"
 kuzhu_small_government_size_subname:0 "Too few civil officials can barely control the heartland, leaving openings for local powers."  
 kuzhu_small_government_size_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 Increases Diplomacy, Stewardship, and Intrigue; reduces soldier damage and toughness.#!"
 kuzhu_medium_government_size:0 "Moderate Civil Administration"
 kuzhu_medium_government_size_subname:0 "The civil administration is large enough to handle the affairs of the realm without becoming bloated." 
 kuzhu_medium_government_size_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 Increases Diplomacy, Stewardship, and Intrigue; reduces soldier damage and toughness, and army movement speed.#!"
 kuzhu_large_government_size:0 "Large Civil Administration"
 kuzhu_large_government_size_subname: "The vast bureaucracy oversees all matters throughout the empire, leaving local officials with little escape from central control."  
 kuzhu_large_government_size_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 Increases Diplomacy, Stewardship, and Intrigue; reduces soldier damage and toughness, and army movement speed.#!"
 kuzhu_government_size_vassal_laws:0 "Liege’s $kuzhu_government_size_laws$"
 kuzhu_small_government_size_vassal:0 "Small Civil Administration"
 kuzhu_small_government_size_vassal_subname:0 "The ruler has too few civil officials to control more than the heartland, leaving openings for local powers."  
 kuzhu_small_government_size_vassal_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 Increases Diplomacy, Stewardship, and Intrigue; reduces soldier damage and toughness.#!"
 kuzhu_medium_government_size_vassal:0 "Moderate Civil Administration"
 kuzhu_medium_government_size_vassal_subname:0 "The ruler’s civil administration is neither too large nor too small: enough to manage the realm without becoming bloated." 
 kuzhu_medium_government_size_vassal_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 Increases Diplomacy, Stewardship, and Intrigue; reduces soldier damage and toughness, and army movement speed.#!"
 kuzhu_large_government_size_vassal:0 "Large Civil Administration"
 kuzhu_large_government_size_vassal_subname: "The monarch's bureaucracy is extremely vast, overseeing all matters of the empire, with everything under its control."   
 kuzhu_large_government_size_vassal_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 Increases Diplomacy, Stewardship, and Intrigue; reduces soldier damage and toughness, and army movement speed.#!"
 kuzhu_need_enough_authority: "Requires a higher [crown_authority|E] level"
 kuzhu_need_china_hegemon: "Requires possession of [GetTitleByKey('h_china').GetName]." 
 kuzhu_realm_disorder_modifier:0 "Disruption from Reform" 
 #行政兵制法律
 kuzhu_admin_recruit_military_noble:0 "Local Military Recruitment"
 kuzhu_admin_recruit_military_noble_subname: "Military and administrative officials across the provinces independently recruit and maintain their own armies, while the central authority retains only nominal command."
 kuzhu_admin_recruit_military_noble_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 Reduces the number and size of [title_men_at_arms|E] of [administrative|E] [vassal|E] by 3.#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Increases the number and size of [men_at_arms|E] of [administrative|E] [vassal|E] by 2.#!"
 kuzhu_admin_recruit_balanced:0 "Shared Military Administration"
 kuzhu_admin_recruit_balanced_subname: "The central authority and local governments share the responsibilities of recruiting troops, funding military operations, and coordinating logistics."
 kuzhu_admin_recruit_balanced_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 Reduces the number and size of [title_men_at_arms|E] of [administrative|E] [vassal|E] by 2.#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Increases the number and size of [men_at_arms|E] of [administrative|E] [vassal|E] by 1.#!"
 kuzhu_admin_recruit_theme:0 "Farmer-Soldier System"
 kuzhu_admin_recruit_theme_subname:0 "Land supports registered soldiers, who farm and train in peacetime and march to war upon imperial command." 
 kuzhu_admin_recruit_theme_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 Increases the number and size of [title_men_at_arms|E] of [administrative|E] [vassal|E] by 1.#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Reduces the number and size of [men_at_arms|E] of [administrative|E] [vassal|E] by 2.#!"
 kuzhu_admin_recruit_legion:0 "Imperial Guard System"
 kuzhu_admin_recruit_legion_subname: "The elite standing army is directly funded, officered, and commanded by the central authority, making it inaccessible to local forces."  
 kuzhu_admin_recruit_legion_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 Increases the number and size of [title_men_at_arms|E] of [administrative|E] [vassal|E] by 2.#!"
 kuzhu_admin_recruit_vassal_military_noble:0 "Local Military Recruitment"  
 kuzhu_admin_recruit_vassal_military_noble_subname: "The monarch delegates the authority to recruit and maintain armies to local officials."
 kuzhu_admin_recruit_vassal_military_noble_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 Reduces the number and size of [title_men_at_arms|E] by 3, and increases the number and size of [men_at_arms|E] by 2.#!"
 kuzhu_admin_recruit_vassal_balanced:0 "Shared Military Administration"
 kuzhu_admin_recruit_vassal_balanced_subname: "The monarch and local authorities share responsibility for recruiting troops, funding military operations, and coordinating logistics."
 kuzhu_admin_recruit_vassal_balanced_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 Reduces the number and size of [title_men_at_arms|E] by 2, and increases the number and size of [men_at_arms|E] by 1.#!"
 kuzhu_admin_recruit_vassal_theme:0 "Farmer-Soldier System" 
 kuzhu_admin_recruit_vassal_theme_subname:0 "Land supports registered soldiers, who march to war upon the ruler’s command." 
 kuzhu_admin_recruit_vassal_theme_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 Increases the number and size of [title_men_at_arms|E] by 1, and reduces the number and size of [men_at_arms|E] by 2.#!"
 kuzhu_admin_recruit_vassal_legion:0 "Imperial Guard System"  
 kuzhu_admin_recruit_vassal_legion_subname: "Military command, funding, and the authority to select generals are all centralized in the capital; local officials are prohibited from intervening independently." 
 kuzhu_admin_recruit_vassal_legion_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 Increases the number and size of [title_men_at_arms|E] by 2, and reduces the number and size of [men_at_arms|E] by 2.#!"
