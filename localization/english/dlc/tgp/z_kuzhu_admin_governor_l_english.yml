 game_concept_kuzhu_admin_series_desc: "Administrative categories include [government|E], [administrative|E], [meritocratic|E], [celestial|E], and [japan_administrative|E]."
 game_concept_kuzhu_government_size_law: "Vassal Management Law" 
 game_concept_kuzhu_government_size_law_i: "@liege_icon!"
 game_concept_kuzhu_government_size_law_desc: "Two types of bills managed by the administrative monarch over local vassals: \n\n#high  Civil Servant Scale #!\n$kuzhu_small_government_size$\n$kuzhu_medium_government_size$\n$kuzhu_large_government_size$\n\n#high  Military Administration #!\n$kuzhu_admin_recruit_vassal_military_noble$\n$kuzhu_admin_recruit_vassal_balanced$\n$kuzhu_admin_recruit_vassal_theme$\n$kuzhu_admin_recruit_vassal_legion$"
 kuzhu_demand_follow_vassal_admin_interaction: "Convert to Administrative Governor" 
 kuzhu_demand_follow_vassal_admin_interaction_extra_icon: "Use harassment"
 kuzhu_admin_law_allows_conversion_demand: "The current vassal management law must allow the central authority to implement administrative reforms."
