l_english:
 #行政制法律契约
 kuzhu_government_size_laws: "Scale of Civil Officials"
 kuzhu_small_government_size: "Minor Civil Official"
 kuzhu_small_government_size_subname: "The number of civil officials is insufficient, barely able to control the core regions, providing an opportunity for local warlords."  
 kuzhu_small_government_size_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Increases diplomacy, administration, and strategy; reduces soldier damage and resilience. #!"
 kuzhu_medium_government_size: "Medium-Scale Civil Official"
 kuzhu_medium_government_size_subname: "The civilian official corps is of moderate size, sufficient to handle national affairs without becoming overly bloated." 
 kuzhu_medium_government_size_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Increases diplomacy, administration, and strategy; reduces soldier damage, resilience, and army march speed. #!"
 kuzhu_large_government_size: "Massive Civilian Officials"
 kuzhu_large_government_size_subname: "The vast bureaucracy oversees all matters throughout the empire, leaving local officials with little escape from central control."  
 kuzhu_large_government_size_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Increases diplomacy, administration, and strategy; reduces soldier damage, resilience, and army march speed. #!"
 kuzhu_government_size_vassal_laws: "The monarch's $kuzhu_government_size_laws$"
 kuzhu_small_government_size_vassal: "Minor Civil Official"
 kuzhu_small_government_size_vassal_subname: "The number of civil officials under the ruler is insufficient, barely able to control the core regions, leaving opportunities for various localities."  
 kuzhu_small_government_size_vassal_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Increases diplomacy, administration, and strategy; reduces soldier damage and resilience. #!"
 kuzhu_medium_government_size_vassal: "Medium-Scale Civil Official"
 kuzhu_medium_government_size_vassal_subname: "The monarch's bureaucracy is neither too large nor too small, just right to handle affairs across the entire realm without becoming overly bloated." 
 kuzhu_medium_government_size_vassal_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Increases diplomacy, administration, and strategy; reduces soldier damage, resilience, and army march speed. #!"
 kuzhu_large_government_size_vassal: "Massive Civilian Officials"
 kuzhu_large_government_size_vassal_subname: "The monarch's bureaucracy is extremely vast, overseeing all matters of the empire, with everything under its control."   
 kuzhu_large_government_size_vassal_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Increases diplomacy, administration, and strategy; reduces soldier damage, resilience, and army march speed. #!"
 kuzhu_need_enough_authority: "Requires a higher [crown_authority|E] level"
 kuzhu_need_china_hegemon: "Requires possession of [GetTitleByKey('h_china').GetName]." 
 kuzhu_realm_disorder_modifier: "Chaos caused by the reforms" 
 #行政兵制法律
 kuzhu_admin_recruit_military_noble: "Military Command Recruitment System"
 kuzhu_admin_recruit_military_noble_subname: "Military and administrative officials across the provinces independently recruit and maintain their own armies, while the central authority retains only nominal command."
 kuzhu_admin_recruit_military_noble_effects: "The number and scale of $EFFECT_LIST_BULLET$#indent_newline:3 [administrative|E][vassal|E]'s [title_men_at_arms|E] are reduced by 3; the number and scale of #!\n$EFFECT_LIST_BULLET$#indent_newline:3 [administrative|E][vassal|E]'s [men_at_arms|E] are increased by 2. #!"
 kuzhu_admin_recruit_balanced: "Dual Administration System"
 kuzhu_admin_recruit_balanced_subname: "The central authority and local governments share the responsibilities of recruiting troops, funding military operations, and coordinating logistics."
 kuzhu_admin_recruit_balanced_effects: "The number and scale of $EFFECT_LIST_BULLET$#indent_newline:3 [administrative|E][vassal|E]'s [title_men_at_arms|E] are reduced by 2; the number and scale of #!\n$EFFECT_LIST_BULLET$#indent_newline:3 [administrative|E][vassal|E]'s [men_at_arms|E] are increased by 1. #!"
 kuzhu_admin_recruit_theme: "Fubing System"
 kuzhu_admin_recruit_theme_subname: "Farming the land to support registered soldiers; during peacetime, they engage in agriculture and training, while in wartime, they depart on campaign upon imperial decree." 
 kuzhu_admin_recruit_theme_effects: "Increase the quantity and scale of $EFFECT_LIST_BULLET$#indent_newline:3 [administrative|E][vassal|E]'s [title_men_at_arms|E] by 1; decrease the quantity and scale of #!\n$EFFECT_LIST_BULLET$#indent_newline:3 [administrative|E][vassal|E]'s [men_at_arms|E] by 2. #!"
 kuzhu_admin_recruit_legion: "Imperial Guard System"
 kuzhu_admin_recruit_legion_subname: "The elite standing army is directly funded, officered, and commanded by the central authority, making it inaccessible to local forces."  
 kuzhu_admin_recruit_legion_effects: "Increase the quantity and scale of $EFFECT_LIST_BULLET$#indent_newline:3 [administrative|E][vassal|E]'s [title_men_at_arms|E] by 2#!"
 kuzhu_admin_recruit_vassal_military_noble: "Military Command Recruitment System"  
 kuzhu_admin_recruit_vassal_military_noble_subname: "The monarch delegates the authority to recruit and maintain armies to local officials."
 kuzhu_admin_recruit_vassal_military_noble_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 [title_men_at_arms|E] quantity and scale reduced by 3, [men_at_arms|E] quantity and scale increased by 2. #!"
 kuzhu_admin_recruit_vassal_balanced: "Dual Administration System"
 kuzhu_admin_recruit_vassal_balanced_subname: "The monarch and local authorities share responsibility for recruiting troops, funding military operations, and coordinating logistics."
 kuzhu_admin_recruit_vassal_balanced_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 [title_men_at_arms|E] quantity and scale reduced by 2, [men_at_arms|E] quantity and scale increased by 1. #!"
 kuzhu_admin_recruit_vassal_theme: "Fubing System" 
 kuzhu_admin_recruit_vassal_theme_subname: "Provide grain and land to support registered soldiers, ordering them to march out on the monarch's edicts." 
 kuzhu_admin_recruit_vassal_theme_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 [title_men_at_arms|E] quantity and scale increased by 1, [men_at_arms|E] quantity and scale decreased by 2. #!"
 kuzhu_admin_recruit_vassal_legion: "Imperial Guard System"  
 kuzhu_admin_recruit_vassal_legion_subname: "Military command, funding, and the authority to select generals are all centralized in the capital; local officials are prohibited from intervening independently." 
 kuzhu_admin_recruit_vassal_legion_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 [title_men_at_arms|E] quantity and scale increased by 2, [men_at_arms|E] quantity and scale decreased by 2. #!"
