 trait_kuzhu_puppet_ruler_desc: "The current monarch is under the control of a regent, unable to make independent decisions or command the army."  
 kuzhu_install_puppet_faction: "Support Puppet Factions" 
 kuzhu_install_puppet_faction_desc: "Support puppet [faction|E] members hope to limit [liege|E]'s power, strengthen [regent|E]'s power \n\n#S Ultimatum #!\nFaction leader obtains [GetTrait('kuzhu_empire_overseer').GetName( GetNullCharacter )]\n[top_liege|E]obtains [GetTrait('kuzhu_puppet_ruler').GetName( GetNullCharacter )]"
 kuzhu_install_puppet_faction_short_effect_desc: "Hope to limit the power of [liege|E] and strengthen the power of [regent|E]"  
 kuzhu_install_puppet_faction_war: "$KUZHU_INSTALL_PUPPET_FACTION_WAR_NAME$"
 KUZHU_INSTALL_PUPPET_FACTION_WAR_NAME: "Support Puppet War"
 kuzhu_install_puppet_war_victory_desc_local_player_attacker: "[defender.GetShortUINamePossessive|U] admits defeat and transfers most of his power to you."
 kuzhu_install_puppet_war_victory_desc_local_player_defender: "You admit defeat and transfer most of your power to [attacker.GetShortUINamePossessive|U]."
 kuzhu_install_puppet_war_victory_desc: "[defender.GetShortUINamePossessive|U] admits defeat and transfers most of its power to [attacker.GetShortUINamePossessive|U]."
 kuzhu_install_puppet_faction_war_white_peace_defender_desc: "[attacker.GetShortUIName|U]temporarily acknowledges your authority."
 kuzhu_install_puppet_faction_war_white_peace_attacker_desc: "You temporarily acknowledge the authority of [defender.GetShortUIName]."
 kuzhu_install_puppet_faction_war_white_peace_desc: "[attacker.GetShortUIName|U] temporarily acknowledges the authority of [defender.GetShortUIName]."
 kuzhu_install_puppet_faction_war_white_peace_end_desc: "Supporting a puppet [faction|E] causes dissolution; its members cannot join [SCOPE.ScriptValue('faction_war_white_peace_cooldown')|0] within [factions|E] years."
 kuzhu_install_puppet_war_defeat_defender_desc: "You imprison all rebellious [vassals|E], and gain a [revoke_title_reason|E] for each rebel."
 kuzhu_install_puppet_war_defeat_attacker_desc: "[defender.GetShortUIName|U]Imprison you and all rebellious [vassals|E], and gain a [revoke_title_reason|E] for each rebel."
 kuzhu_install_puppet_war_defeat_desc: "[defender.GetShortUIName|U]imprisons all rebellious [vassals|E], and gains a [revoke_title_reason|E] for each rebel."
 kuzhu_install_puppet_war_defeat_end_desc: "Supporting a puppet [faction|E] causes dissolution; its members cannot join [SCOPE.ScriptValue('faction_war_defeat_cooldown')|0] within [factions|E] years."
 KUZHU_FACTION_INSTALL_PUPPET: "Demand to hand over power"
 KUZHU_FACTION_INSTALL_PUPPET_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n It is time for you to agree to hand over power to [faction_leader.GetPrimaryTitle.GetNameNoTier]. Accept our demands, or face our sharp swords on the battlefield!"
 KUZHU_FACTION_INSTALL_PUPPET_ACCEPTED: "The request to surrender power has been accepted."
 KUZHU_FACTION_INSTALL_PUPPET_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nYour misguided plea will only expose the weakness of us all. Nevertheless, to avoid needless bloodshed in our territories, I can only accept your demand for the surrender of power."
 KUZHU_FACTION_INSTALL_PUPPET_REFUSED: "Request to surrender power has been denied"
 KUZHU_FACTION_INSTALL_PUPPET_REFUSED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n Your shameful extortion attempt will never succeed. No matter how many corrupt and despicable minions you bribe to support your schemes, I will never surrender without a fight. I would rather die than defend the power that belongs to me!"
 KUZHU_FACTION_INSTALL_PUPPET_SEND_DEMAND_NOTIFICATION: "Surrender power!"
 KUZHU_FACTION_INSTALL_PUPPET_SEND_DEMAND_NOTIFICATION_DESC: "The time has come! [faction.GetName] unanimously agrees that [faction_target.GetName] can no longer continue his tyranny as before. Either accept our control over you, or we will take matters into our own hands!"
 kuzhu_admin_faction_demand.1002.tt: "The faction leader will become the de facto regent wielding real power, while the monarch will be reduced to a puppet unable to govern independently or command troops."
