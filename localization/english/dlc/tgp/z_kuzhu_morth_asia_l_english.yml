l_english:
 #苦竹新增特殊文化
 culture_parameter_kuzhu_stewardship_logistics_bonus: "Managing educational traits will also enhance military capabilities based on rank levels."
 kuzhu_tradition_mengan_mouke_name: "Mengan Mukden"
 kuzhu_tradition_mengan_mouke_desc: "The army and people are united; capable of both farming and fighting, dedicated solely to state affairs without personal ulterior motives."
 tradition_kuzhu_proved_by_sword_name: "Prove legitimacy through martial prowess"
 tradition_kuzhu_proved_by_sword_desc: "Who says that kings and lords are born of a certain lineage? It is merely the tide of fortune. There is no permanent ruler of a state; only those with strong armies and mighty horses shall claim it!" 
 tradition_kuzhu_minor_china_name: "Little China"
 tradition_kuzhu_minor_china_desc: "This culture is highly similar to Han culture in all aspects, and its people also regard themselves as descendants of the Chinese civilization."
 tradition_kuzhu_praise_literature_name: "Selecting Officials Based on Merit"
 tradition_kuzhu_praise_literature_desc: "To govern a great state, rely on culture rather than martial prowess. As a ruler, one should assess the realm's renowned scholars through their literary talents and employ those who excel."
 culture_parameter_kuzhu_confucian_education_add_merit_level: "The [GetTrait('confucian_education').GetName( GetNullCharacter )] trait increases the cap for [merit_level|E]."
 cannot_have_tradition_loyal_soldiers: "Cannot possess both [GetCultureTradition('tradition_loyal_soldiers').GetName] traditions at the same time"
 cannot_have_tradition_scholar_officials: "Cannot possess both [GetCultureTradition('tradition_scholar_officials').GetName] traditions at the same time"
