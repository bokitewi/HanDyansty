l_english:
 #苦竹新增特殊文化
 culture_parameter_kuzhu_stewardship_logistics_bonus:0 "Stewardship education traits also improve military ability according to their level"
 kuzhu_tradition_mengan_mouke_name:0 "Mengan Mouke"
 kuzhu_tradition_mengan_mouke_desc:0 "Soldiers and civilians are one people, ready both to farm and to fight. They devote themselves to the affairs of the state, setting private interests aside."
 tradition_kuzhu_proved_by_sword_name:0 "Legitimacy by the Sword"
 tradition_kuzhu_proved_by_sword_desc:0 "Who says kings and lords are born to rule? Their station is only a turn of fortune. No house owns the throne forever: whoever commands strong soldiers and stout horses may take it!" 
 tradition_kuzhu_minor_china_name: "Little China"
 tradition_kuzhu_minor_china_desc:0 "This culture follows the dress, rites, and music of China. Its people read the works of the sages, follow the teachings of Zhou and Confucius, and regard themselves as descendants of Huaxia."
 tradition_kuzhu_praise_literature_name:0 "Recruitment by Literary Talent"
 tradition_kuzhu_praise_literature_desc:0 "A great state is governed through letters, rather than arms. A ruler should judge the realm’s renowned scholars by their literary talent and appoint the best of them."
 culture_parameter_kuzhu_confucian_education_add_merit_level: "The [GetTrait('confucian_education').GetName( GetNullCharacter )] trait increases the cap for [merit_level|E]."
 cannot_have_tradition_loyal_soldiers:0 "Cannot coexist with the [GetCultureTradition('tradition_loyal_soldiers').GetName] tradition"
 cannot_have_tradition_scholar_officials:0 "Cannot coexist with the [GetCultureTradition('tradition_scholar_officials').GetName] tradition"
