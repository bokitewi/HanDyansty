l_english:
 hd_cixiong_shuanggujian_name:0 "Paired Male and Female Swords"
 hd_cixiong_shuanggujian_description:0 "Two long swords of different designs, perfectly matched in spirit: the male sword is weighty, the female light and nimble. They can be wielded together or separately. Liu Bei is said to favor them, often holding both in one hand as he rallies volunteers to aid the weak and those in peril."
 hd_zhangba_shemao_name:0 "Eighteen-Foot Serpent Spear"
 hd_zhangba_shemao_description:0 "Eighteen feet long, with a blade that curves like a gliding snake, this spear has a steady shaft and an unpredictable reach. It suits a fearless warrior such as Zhang Fei, who can use it to break formations and seize banners amid a vast army."
 hd_liangyin_qiang_name:0 "Bright Silver Spear"
 hd_liangyin_qiang_description:0 "The shaft gleams silver and the blade shines cold. Its plain fittings do nothing to diminish its menace. In Zhao Yun's hands, it flashes back and forth like a streak of light, as swift in attack as it is sure in defense."
 hd_shenwei_longdan_qiang_name:0 "Divine Might Dragon's Valor Spear"
 hd_shenwei_longdan_qiang_description:0 "A skilled smith fashioned this long spear with layers of fine iron and silver inlay. Where the blade meets its socket, a silver dragon seems to raise its head. Held aloft in battle, its presence shakes the enemy's courage; kept in the armory, it is a treasure worthy of passing down through the family."
 hd_hao_longdan_name:0 "Mighty Dragon's Valor"
 hd_hao_longdan_description:0 "The broad, upright blade is traced with gold along its ridge, lending splendor to its powerful form. Made to shatter an enemy with a single blow, this spear proclaims the courage and martial renown of its wielder."
 hd_wushuang_fangtian_huaji_name:0 "Peerless Square-Heaven Halberd"
 hd_wushuang_fangtian_huaji_description:0 "Its tall central blade rises between two crescent blades that spread like wings. The whole weapon exudes a deadly menace. Legend holds that only a man of Lü Bu's extraordinary strength could whirl it as though it weighed nothing."
