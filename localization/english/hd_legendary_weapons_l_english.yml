l_english:
 hd_cixiong_shuanggujian_name:0 "The Twin Swords of Male and Female"
 hd_cixiong_shuanggujian_description:0 "A pair of long swords with distinct forms yet harmonious spirit: the male sword is heavy and imposing, while the female sword is agile and nimble. Liu Bei often holds both swords in one hand to command his righteous followers and aid those in peril and distress."
 hd_zhangba_shemao_name:0 "Eight-foot-long snake-tipped spear"
 hd_zhangba_shemao_description:0 "The spearhead coils like a serpent, its long shaft steady and unyielding; its movements are unpredictable in advance or retreat. This spear is best suited for warriors as fierce and unstoppable as Zhang Fei, capable of breaking formations and seizing the initiative before tens of thousands of enemy troops."
 hd_liangyin_qiang_name:0 "Bright Silver Spear"
 hd_liangyin_qiang_description:0 "The shaft gleams silver, the blade cold and sharp; its decoration is simple yet retains a keen edge. When Zhao Yun wields it in battle, the spear's shadow moves back and forth like flowing light, defending thoroughly while launching swift attacks."
 hd_shenwei_longdan_qiang_name:0 "Divine Might Dragon-Soul Spear"
 hd_shenwei_longdan_qiang_description:0 "A resplendent spear meticulously assembled from multiple metal components, with its blade and mouth guard interlocking in layered fashion like a silver dragon raising its head. Its imposing presence is sufficient to intimidate enemy formations, making it a treasured artifact worthy of storage within the imperial armory."
 hd_hao_longdan_name:0 "Heroic Dragon's Gall"
 hd_hao_longdan_description:0 "The spear blade is broad and upright, with golden patterns spiraling up along the ridge of the edge. It exudes an air of nobility within its strength and vigor. This spear seeks to break through formations with a single strike, best showcasing the wielder's courage and martial reputation."
 hd_wushuang_fangtian_huaji_name:0 "Twin-Blade Heaven-Splitting Spear"
 hd_wushuang_fangtian_huaji_description:0 "The halberd's blade stands tall, with crescent-shaped side blades extending outward on both sides, radiating a fierce and exaggerated aura of battlefield dominance. It is said that only one with the extraordinary strength of Lu Bu could wield it with such effortless speed."
