l_english:
 bm_uuii_218:0 "A Three-Way Standoff"
 bm_uuii_218_desc:0 "It is the twenty-third year of Jian'an, the year of Wuxu. Cao Cao has risen to the rank of King of Wei and holds the Son of Heaven at Xudu. The nine provinces of Ji, Yan, Qing, Xu, Yu, Sili, Bing, Liang and You are all in his grasp. Liu Bei holds Yi Province and faces Xiahou Yuan across Hanzhong, while Guan Yu guards Jing Province, with his sights set on Xiangyang and Fancheng. Sun Quan commands Jiangdong. Though outwardly allied with Liu Bei, he has never forgotten his designs on Jing Province.\n\nThe realm has already taken the shape of three rival powers, yet none will accept that division. Great battles at Hanzhong, Xiangyang and Fancheng, and Yiling lie just ahead, one after another.\n\n#bold The Han dynasty nears its end. Will you hold the Son of Heaven and bring matters to their conclusion, restore the Han in the southwest, or rule Jiangdong and watch the others rise and fall?#!"
