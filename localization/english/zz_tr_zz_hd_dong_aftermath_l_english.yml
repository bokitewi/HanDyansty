 hd_dong_aftermath.0010.t:0 "Changing of the Palace Guard"
 hd_dong_aftermath.0010.desc:0 "The clatter of armored men outside the palace gates subsides a little. Wang Yun enters the hall to report that Dong Zhuo is dead; Lu Bu stands below the steps, and the soldiers behind him answer to new orders. For a moment, you almost believe the weight that has pressed upon the hall for so many days has lifted.\n\nBut what is presented next are new arrangements for court and garrisons: Wang Yun will direct the government, and Lu Bu will command the troops around Chang'an. Yet the provinces and commanderies have not returned their seals and military authority to the throne merely because Dong Zhuo has been executed.\n\nYou hear them out item by item, then gaze beyond the hall. Killing the man who held the Son of Heaven hostage, it turns out, is not the same as letting the Son of Heaven issue commands. For now, all you can hold are these few layers of palace gates, and the people still willing to obey."
 hd_dong_aftermath.0010.a:0 "Secure the palace first, then see to the court."
 hd_li_jue_changan_cb:0 "Seize Chang'an"
 hd_li_jue_changan_cb_name:0 "Seize Chang'an"
 HD_LI_JUE_CHANGAN_WAR_NAME:0 "Li Jue's Assault on Chang'an"
 hd_li_jue_event_troops:0 "Liang Province Veterans"
 hd_li_jue_changan_victory_desc:0 "Li Jue takes Jingzhao and makes Chang'an his capital; Wang Yun and his kin and wives within the Son of Heaven's domain, along with his adopted daughter Diaochan, are all put to death."
 hd_li_jue_changan_no_victory_desc:0 "Li Jue fails to take Chang'an."
