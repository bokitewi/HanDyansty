l_english:
 hd_dong_aftermath.0010.t:0 "New Guards at the Palace Gates"
 hd_dong_aftermath.0010.desc:0 "The clatter of armored men outside the palace gates begins to subside. Wang Yun enters the hall to report that Dong Zhuo is dead. Lü Bu stands below the steps, and the soldiers behind him now answer to new commands. For a moment, you almost believe that the weight pressing on the hall these past days has lifted.\n\nThen come the new arrangements for court and army. Wang Yun will direct government affairs, and Lü Bu will command the troops around Chang'an. Yet the governors and administrators across the realm have not returned their seals or military authority to you merely because Dong Zhuo has been executed.\n\nYou listen to each item, then look beyond the hall. Killing the man who held the emperor captive, it seems, is a different thing from giving the emperor the power to command. For now, what you can secure is still only these few palace gates and the people who remain willing to obey."
 hd_dong_aftermath.0010.a:0 "Secure the palace first. Restore the court afterward."
 hd_li_jue_changan_cb:0 "Seize Chang'an"
 hd_li_jue_changan_cb_name:0 "Seize Chang'an"
 HD_LI_JUE_CHANGAN_WAR_NAME:0 "Li Jue's Attack on Chang'an"
 hd_li_jue_event_troops:0 "Liangzhou Veterans"
 hd_li_jue_changan_victory_desc:0 "Li Jue takes Jingzhao and makes Chang'an his capital. Wang Yun, his kin and wives within the emperor's realm, and his adopted daughter Diaochan are all executed."
 hd_li_jue_changan_no_victory_desc:0 "Li Jue fails to capture Chang'an."
