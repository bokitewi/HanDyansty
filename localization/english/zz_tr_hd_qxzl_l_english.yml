l_english:
 hd_qxzl.0001.t:0 "Warlords Contend"
 hd_qxzl.0001.desc:0 "Since the coalition against Dong Zhuo dissolved, orders arriving from different regions have grown increasingly inconsistent. Those who once raised their armies together have returned to their own garrisons. Court dispatches still come and go, but what truly sets troops in motion is usually the money and grain each household commands.\n\nYou have officials and people of your own. Continuing to serve your former lord preserves the established bonds between superior and subordinate. Break from his authority now, and the safety of your lands rests entirely on you; you can no longer wait for an answer from above on every matter.\n\nSomeone at your desk asks where the next dispatch should go. You look at the unsealed letter and understand that today's choice is measured less by a bold declaration than by whose seal will authorize every order that follows."
 hd_qxzl.0001.a:0 "Establish my own domain, beholden to no one."
 hd_qxzl.0001.b:0 "The bond between lord and servant must not be lightly abandoned."
 hd_qxzl_independence_tt:0 "You leave your former lord's authority and become independent."
 hd_qxzl_ineligible_tt:0 "Circumstances have changed; independence is no longer possible."
