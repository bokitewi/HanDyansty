l_english:
 hd_qxzl.0001.t:0 "Warlords Contend"
 hd_qxzl.0001.desc:0 "Since the coalition against Dong Zhuo dissolved, the orders arriving from every quarter have grown ever less consistent. Those who once rose in arms together have returned to their own garrisons. Court documents still come and go, but what truly sets troops in motion is, more often than not, the coin and grain in each house's hands.\n\nYou too have your own officials and people under your rule. Continue to serve your old lord, and your established rank will still hold superiors and subordinates together; break free of his control here and now, and the safety of your lands will rest on you alone, no longer able to await answers from above on every matter.\n\nSomeone at your desk asks where the next dispatch should be sent. Looking at the letter not yet sealed, you understand that today's choice lies not in a single bold declaration, but in whose seal will be pressed on every order to come."
 hd_qxzl.0001.a:0 "Strike out on my own, and be ruled by no one."
 hd_qxzl.0001.b:0 "The bond of lord and vassal must not be lightly cast aside."
 hd_qxzl_independence_tt:0 "From now on, you break free of your former lord's control and stand on your own."
 hd_qxzl_ineligible_tt:0 "Times and circumstances have changed; independence is no longer possible."
