l_english:
 # 184 flow overhaul (2026-10-21)
 hd184r_freeze_minister_tt:0 "A provincial governor does not join the court as a minister at this time"
 hd184r_freeze_appointment_desc:0 "Sitting provincial governor, not transferred to another province"
 hd184r_meiguo_name:0 "Mei"
 hd184r_meiguo_name_adj:0 "Mei"
 hd184r_xiliang_army:0 "Xiliang Army"
 hd184r_zhongjia_name:0 "Zhong"
 hd184r_zhongjia_name_adj:0 "Zhong"
 hd184r.0201.t:0 "On the Xu Road"
 hd184r.0201.desc:0 "Grim news comes from the Langya road: [hd_news_a.GetName]'s father, fleeing the chaos with a long train of baggage, was murdered with his family inside Xu Province by the very soldiers sent to escort him. [hd_news_b.GetName] of Xuzhou hastily sends envoys to protest his innocence, but [hd_news_a.GetName] has already put on mourning white and sworn revenge."
 hd184r.0201.a:0 "A father's death must be avenged."
 hd184r.0207.t:0 "On the Xu Road"
 hd184r.0207.desc:0 "The messenger from Langya kneels before you and cannot speak for a long while. Your father, fleeing the chaos with a long train of baggage, was murdered with his family inside Xu Province by the very soldiers sent to escort him, and everything was plundered.\n\n[hd_news_b.GetName] of Xuzhou sends envoys to protest that the killers acted on their own. You hear none of it. Your generals wait for you to speak."
 hd184r.0207.a:0 "A father's death must be avenged. March east at once!"
 hd184r.0207.a.tt:0 "Declare war on [hd_news_b.GetName] over a Xuzhou commandery bordering your realm"
 hd184r.0207.b:0 "Yanzhou is not yet secure. This debt will be remembered."
 hd184r.0202.t:0 "Tu Gao Shall Replace Han"
 hd184r.0202.desc:0 "The diviners return with the prophecy: 'He who replaces Han is Tu Gao.' Tu means road, and your courtesy name is Gonglu. The emperor is a wanderer, and your cities stretch across Jiujiang and Huainan. Yet once you claim the throne, every lord in the realm will have reason to march against you."
 hd184r.0202.a:0 "Heaven's mandate is mine. I claim the throne today."
 hd184r.0202.b:0 "The time is not yet ripe."
 hd184r.0203.t:0 "An Emperor at Shouchun"
 hd184r.0203.desc:0 "[hd_news_a.GetName] has proclaimed himself Son of Heaven at Shouchun, naming his dynasty Zhong and appointing a full court. The lords of the realm are aghast: the Han emperor still lives, and yet a usurper dares to take his title."
 hd184r.0203.a:0 "A usurper is the enemy of all."
 hd184r.0204.t:0 "Strife in Chang'an"
 hd184r.0204.desc:0 "[hd_news_a.GetName] and [hd_news_b.GetName], once comrades, have turned on each other. Their armies fought through the streets of Chang'an for months. In the chaos the emperor slipped away east and at last returned to the half-burned ruins of Luoyang."
 hd184r.0204.a:0 "The dignity of Han lies in the dust."
 hd184r.0205.t:0 "Trouble in the South Seas"
 hd184r.0205.desc:0 "[hd_news_b.GetName], the harsh inspector of Jiaozhou, has been killed by the local people. [hd_news_a.GetName], the well-loved administrator of Jiaozhi, has taken charge of the province and placed his brothers over Hepu, Jiuzhen and Nanhai."
 hd184r.0205.a:0 "Beyond the passes lies another world."
 hd184r.0206.t:0 "A Scholar Arrives"
 hd184r.0206.desc:0 "A guest is at the gate: [hd184r_advisor.GetName], dusty from the road but calm. Having seen many heroes of the age, he has chosen to serve you. You talk late into the night and find him extraordinary."
 hd184r.0206.a:0 "With such a man, great things are possible."
 hd184r_faction_freeze_tt:0 "While the Son of Heaven still reigns, no lord dares openly band together against him"
