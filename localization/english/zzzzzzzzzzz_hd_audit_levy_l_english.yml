 hd_audit_levy_standard:0 "Scattered Able-Bodied Men"
 hd_audit_levy_standard_desc:0 "In these troubled times, households are scattered and recruits are scarce. Far fewer able-bodied men answer the call than in times of peace."
 hd_audit_levy_reduced_government:0 "Registered Household Levies"
 hd_audit_levy_reduced_government_desc:0 "The court conscripts men from its household registers. The pool of recruits is limited, and the law places further limits on how many may be called up."
