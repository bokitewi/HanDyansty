l_english:
 saas_recruit_talent_edict_modifier: "Edict to Recruit Talents"
 saas_recruit_talent_edict_modifier_desc: "This court is actively recruiting scholars from across the realm and will compete with other warlords issuing edicts to attract talent for acquiring personnel."
 saas_retainer_defense_reform_modifier: "Well-garrisoned and disciplined"
 saas_retainer_defense_reform_modifier_desc: "The retainer reorganizes the garrison roster, rectifies the armory, and trains conscripted soldiers."

 saas_retainer_patronage_opinion: "Appointed to a position"
 saas_retainer_rejected_opinion: "Proposal Rejected"
 saas_retainer_project_success_opinion: "can only gain recognition"
 saas_retainer_project_failure_opinion: "Failed in the mission"
 saas_retainer_diplomatic_success_opinion: "Mediator's Intercession"

 saas_recruit_talent_decision: "Issue an Edict to Attract Talents"
 saas_recruit_talent_decision_confirm: "Issue an Edict to Recruit Talents"
 saas_recruit_talent_decision_desc: "Rites have collapsed, music has decayed, and scholars lack a fixed master. As long as one promises courtesy and generous stipends, talented individuals across the realm may be drawn to come forth upon hearing of it."
 saas_recruit_talent_decision_tooltip: "Compete with other feudal lords for talentless individuals based on national strength, military power, prestige, and court prominence."
 saas_recruit_talent_decision_effect: "Gain a continuous #V  5-year #! of [GetModifier('saas_recruit_talent_edict_modifier').GetNameWithTooltip]; this resolution has a #V  10-year #! cooldown."

 saas_elite_guest_arrived_title: "Famous Scholar Visits"
 saas_elite_guest_arrived_desc: "Elite talents [saas_elite_guest.GetShortUIName] have joined your court as guests."
 saas_elite_adventurer_spawned_title: "Famous Scholar Sets Out on Journey"
 saas_elite_adventurer_spawned_desc: "Elite talent [saas_elite_guest.GetShortUIName] has appeared in your territory and established a camp, becoming an adventurer."

 saas_retainer.1100.t: "Retainer Self-Recommendation: Investment and Wealth Management"
 saas_retainer.1100.desc: "[retainer.GetShortUIName] presents a proposal on managing trade, claiming that profits will double within just a few months. His words are full of confidence, but if the capital is lost entirely, I shall bear the loss myself."
 saas_retainer.1100.a: "First give [retainer.GetHerHim] 10 [gold_i] to try."
 saas_retainer.1100.b: "Allocate to [retainer.GetHerHim] 25 [gold_i]."
 saas_retainer.1100.c: "If you're going to do it, do it big—invest 50[gold_i]!"
 saas_retainer.1100.d: "My funds are needed elsewhere."
 saas_retainer.1101.t: "Retainer Management: Financial Outcome"
 saas_retainer.1101.desc.success: "[retainer.GetShortUIName] returns with clear ledgers and substantial profits. This management indeed doubled the investment."
 saas_retainer.1101.desc.failure: "[retainer.GetShortUIName]Return empty-handed. The market and public sentiment did not behave as anticipated, and the invested funds can no longer be recovered."
 saas_retainer.1101.desc.invalid: "The vicissitudes of the world have rendered this enterprise unsustainable, causing its accounts and investments to be lost."
 saas_retainer.1101.a: "This is precisely the talent I require."
 saas_retainer.1101.b: "It can only be regarded as a lesson."
 saas_retainer.1101.c: "This matter can no longer be pursued."

 saas_retainer.1200.t: "Retainer's Self-Recommendation: Mission to a Neighboring State"
 saas_retainer.1200.desc: "The court of [retainer.GetShortUIName], requesting to be sent as an envoy to [neighboring_ruler.GetShortUIName], believed that diplomatic words and gifts were sufficient to ease relations between the two states."
 saas_retainer.1200.a: "Give [retainer.GetHerHim] 15[gold_i] as tribute."
 saas_retainer.1200.b: "This is not an appropriate time to send envoys."
 saas_retainer.1201.t: "Guest Undertaker: Mission Result"
 saas_retainer.1201.desc.success: "[retainer.GetShortUIName]Successfully completed the mission. [neighboring_ruler.GetShortUIName]Not only accepted the gifts but also highly appreciated my sincerity."
 saas_retainer.1201.desc.failure: "[retainer.GetShortUIName]'s diplomatic words failed to move [neighboring_ruler.GetShortUIName], and this mission yielded no results."
 saas_retainer.1201.desc.invalid: "The embassy had not yet fulfilled its mission when the situation changed, rendering this diplomatic mission in vain."
 saas_retainer.1201.a: "Good. The two states thus restored peace."
 saas_retainer.1201.b: "At least no disaster was caused."
 saas_retainer.1201.c: "The times have come to this; it is beyond human power to change."

 saas_retainer.1300.t: "Retainer's Self-Recommendation: Rectify Fortifications"
 saas_retainer.1300.desc: "After inspecting the capital, he pointed out that the armory, city gates, and recruitment registers were largely neglected, and requested to lead a comprehensive overhaul. [retainer.GetShortUIName]"
 saas_retainer.1300.a: "Allocate [retainer.GetHerHim] 15 [gold_i] to reinforce defenses."
 saas_retainer.1300.b: "The old system may still be followed."
 saas_retainer.1301.t: "Retainer Undertaking: Garrisoning Result"
 saas_retainer.1301.desc.success: "[retainer.GetShortUIName] has completed its reorganization. The city gates are heavily guarded, the armory is in perfect order, and the conscription registers for the local villages have been reverified."
 saas_retainer.1301.desc.failure: "Reorganization efforts were hindered everywhere. [retainer.GetShortUIName], despite expending much energy, failed to bring about a genuine improvement in the defenses."
 saas_retainer.1301.desc.invalid: "The situation has changed abruptly; the originally planned reinforcement of defenses can no longer continue."
 saas_retainer.1301.a: "The capital is secure; my heart is greatly relieved."
 saas_retainer.1301.b: "It seems that long-standing abuses cannot be eradicated overnight."
 saas_retainer.1301.c: "Attend to the matter at hand first."

 saas_retainer.1400.t: "Retainer Self-Recommendation: Investigate Embezzlement"
 saas_retainer.1400.desc: "[retainer.GetShortUIName] notices suspicious gaps in the accounts, suspects embezzlement of public funds, and is willing to investigate the matter secretly."
 saas_retainer.1400.a: "Provide [retainer.GetHerHim] 15[gold_i] as investigation funds."
 saas_retainer.1400.b: "Do not stir fear among everyone in the palace."
 saas_retainer.1401.t: "Guest Undertaker: Audit Results"
 saas_retainer.1401.desc.success: "[retainer.GetShortUIName]Tracing the accounts and testimonies, I located the hidden funds. The culprits have confessed their crimes, and thus everyone now fears my watchfulness even more."
 saas_retainer.1401.desc.failure: "The trail eventually went cold. [retainer.GetShortUIName] failed to recover the funds and instead aroused dissatisfaction among many court officials regarding this investigation."
 saas_retainer.1401.desc.invalid: "The officials in charge of the investigation have changed, and the situation has shifted; therefore, this case must be temporarily set aside."
 saas_retainer.1401.a: "The funds must be recovered, and regulations must also be established."
 saas_retainer.1401.b: "That's enough."
 saas_retainer.1401.c: "Seal up the old case files."

 saas_retainer.1500.t: "Guest Recommends Himself: Organizing Rituals and Agricultural Administration"
 saas_retainer.1500.desc: "[retainer.GetShortUIName] believed that the old classics, agricultural manuals, and local registers were in disarray, and requested the assembly of clerks to collate them, ensuring that both ritual systems and agricultural administration would have clear guidelines to follow."
 saas_retainer.1500.a: "Allocate [retainer.GetHerHim] 15 [gold_i] to organize and compile classics."
 saas_retainer.1500.b: "There is no such luxury at present."
 saas_retainer.1501.t: "Guest Undertaking: Compilation of Classics"
 saas_retainer.1501.desc.success: "[retainer.GetShortUIName] compiled the scattered documents into a new volume with clear organization. Officials administered affairs based on this, and scholars and commoners better understood rites, laws, and agricultural seasons."
 saas_retainer.1501.desc.failure: "The documents are voluminous and contradictory. [retainer.GetShortUIName] failed to compile usable results within the deadline."
 saas_retainer.1501.desc.invalid: "The project was suspended when the host changed or the situation shifted."
 saas_retainer.1501.a: "This book is sufficient to benefit future generations."
 saas_retainer.1501.b: "First, gather up the remaining drafts."
 saas_retainer.1501.c: "Let's put it aside for now."
