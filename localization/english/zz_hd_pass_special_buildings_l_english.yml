 # New major pass chains
 building_hd_pass_p_2203_01:0 "Muling Pass"
 building_hd_pass_p_2203_01_desc:0 "Muling Pass on Mount Daxian is the southern gateway of Qi, the place Guan Zhong meant when he told the Chu envoy that Qi's lands reached south to Muling. Its narrow road scarcely allows carts and horses side by side. Beyond it to the north stretches Qi's open heartland."
 building_hd_pass_p_2203_02:0 "Muling Pass"
 building_hd_pass_p_2203_02_desc:0 "$building_hd_pass_p_2203_01_desc$"
 building_hd_pass_p_2203_03:0 "Muling Pass"
 building_hd_pass_p_2203_03_desc:0 "$building_hd_pass_p_2203_01_desc$"
 building_hd_pass_p_2203_04:0 "Muling Pass"
 building_hd_pass_p_2203_04_desc:0 "$building_hd_pass_p_2203_01_desc$"
 building_hd_pass_p_4403_01:0 "Jiangyou Pass"
 building_hd_pass_p_4403_01_desc:0 "At the end of the Yinping mountain road, a small garrison town stands beside the Fu River amid surrounding mountains. The dangerous path from the north finally emerges from the hills here, leading south directly to Fu County and the Chengdu Plain."
 building_hd_pass_p_4403_02:0 "Jiangyou Pass"
 building_hd_pass_p_4403_02_desc:0 "$building_hd_pass_p_4403_01_desc$"
 building_hd_pass_p_4403_03:0 "Jiangyou Pass"
 building_hd_pass_p_4403_03_desc:0 "$building_hd_pass_p_4403_01_desc$"
 building_hd_pass_p_4403_04:0 "Jiangyou Pass"
 building_hd_pass_p_4403_04_desc:0 "$building_hd_pass_p_4403_01_desc$"
 building_hd_pass_p_1135_01:0 "Huguan"
 building_hd_pass_p_1135_01_desc:0 "At Huguan County in Shangdang, mountains shaped like a pot have a narrow opening and broad interior, giving Hukou its name. The fortified pass commands the Taihang heights and opens east toward the Hebei plain, forming Shangdang's eastern gateway. Under Emperor Xiaowu, Huguan's Elder once petitioned to defend Crown Prince Li against injustice."
 building_hd_pass_p_1135_02:0 "Huguan"
 building_hd_pass_p_1135_02_desc:0 "$building_hd_pass_p_1135_01_desc$"
 building_hd_pass_p_1135_03:0 "Huguan"
 building_hd_pass_p_1135_03_desc:0 "$building_hd_pass_p_1135_01_desc$"
 building_hd_pass_p_1135_04:0 "Huguan"
 building_hd_pass_p_1135_04_desc:0 "$building_hd_pass_p_1135_01_desc$"
 building_hd_pass_p_3121_01:0 "Baishui Pass"
 building_hd_pass_p_3121_01_desc:0 "In Baishui County of Guanghan Commandery, the Baishui River arrives from the northwest and joins the Western Han River. The fortified pass guards the northern route south from Wudu and Hanzhong into Shu, one of Yizhou's important northern defenses."
 building_hd_pass_p_3121_02:0 "Baishui Pass"
 building_hd_pass_p_3121_02_desc:0 "$building_hd_pass_p_3121_01_desc$"
 building_hd_pass_p_3121_03:0 "Baishui Pass"
 building_hd_pass_p_3121_03_desc:0 "$building_hd_pass_p_3121_01_desc$"
 building_hd_pass_p_3121_04:0 "Baishui Pass"
 building_hd_pass_p_3121_04_desc:0 "$building_hd_pass_p_3121_01_desc$"
 building_hd_pass_p_3634_01:0 "Ziwu Pass"
 building_hd_pass_p_3634_01_desc:0 "A valley road through the Qinling Mountains south of Chang'an connects north and south. Opened under Wang Mang and called Ziwu, it leads directly to Hanzhong. A fortified pass stands at its northern entrance, with a long succession of narrow, dangerous plank roads through the valley."
 building_hd_pass_p_3634_02:0 "Ziwu Pass"
 building_hd_pass_p_3634_02_desc:0 "$building_hd_pass_p_3634_01_desc$"
 building_hd_pass_p_3634_03:0 "Ziwu Pass"
 building_hd_pass_p_3634_03_desc:0 "$building_hd_pass_p_3634_01_desc$"
 building_hd_pass_p_3634_04:0 "Ziwu Pass"
 building_hd_pass_p_3634_04_desc:0 "$building_hd_pass_p_3634_01_desc$"
 building_hd_pass_p_5969_01:0 "Jiayuguan Pass"
 building_hd_pass_p_5969_01_desc:0 "West of Jiuquan Commandery, only a narrow plain remains between the southern and northern mountains, the tightest point among the Hexi commanderies. Garrison troops watch the signal beacons here. Farther west lie Dunhuang and the Western Regions."
 building_hd_pass_p_5969_02:0 "Jiayuguan Pass"
 building_hd_pass_p_5969_02_desc:0 "$building_hd_pass_p_5969_01_desc$"
