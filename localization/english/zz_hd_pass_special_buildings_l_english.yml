 # Shared descriptions for strategic and ordinary new chains
 building_hd_pass_p_4628_01_desc:0 "Changshan was originally called Hengshan, but was renamed to avoid using Emperor Wen's personal name. The fortified pass stands among the valleys south of Hengshan, with a route north to Dai Commandery and a descent east to the plains of Jizhou."
 building_hd_pass_p_4628_02_desc:0 "$building_hd_pass_p_4628_01_desc$"
 building_hd_pass_p_4628_03_desc:0 "$building_hd_pass_p_4628_01_desc$"
 building_hd_pass_p_4628_04_desc:0 "$building_hd_pass_p_4628_01_desc$"
 building_hd_pass_p_638_01_desc:0 "Around Zhongmou in Chenliu Commandery, a place was once known as Yuguan, said to have been a frontier pass of Wei during the Warring States period. The fortifications are now abandoned, leaving only earthen ramparts beside the road, but carts and horses travelling between Luoyang and Chenliu still pass this way."
 building_hd_pass_p_638_02_desc:0 "$building_hd_pass_p_638_01_desc$"
 building_hd_pass_p_638_03_desc:0 "$building_hd_pass_p_638_01_desc$"
 building_hd_pass_p_638_04_desc:0 "$building_hd_pass_p_638_01_desc$"
 building_hd_pass_p_3734_01_desc:0 "The Lingguan road runs through the mountains west of Yandao in Shu Commandery. During Emperor Wu's reign, Sima Xiangru was sent as an envoy to the southwestern peoples. He opened the Lingguan road and built a bridge over the Sun River, providing a direct route to Qiongdu. Beyond the pass lie the settlements of the Qiong and Zuo peoples."
 building_hd_pass_p_3734_02_desc:0 "$building_hd_pass_p_3734_01_desc$"
 building_hd_pass_p_3734_03_desc:0 "$building_hd_pass_p_3734_01_desc$"
 building_hd_pass_p_3734_04_desc:0 "$building_hd_pass_p_3734_01_desc$"
 building_hd_pass_p_3636_01_desc:0 "Among the mountains of eastern Hanzhong Commandery, a flat-topped peak rises beside the road. The fortified pass is built against the mountain, guarding the routes east from Hanzhong to Shangyong and west to Nanzheng."
 building_hd_pass_p_3636_02_desc:0 "$building_hd_pass_p_3636_01_desc$"
 building_hd_pass_p_3636_03_desc:0 "$building_hd_pass_p_3636_01_desc$"
 building_hd_pass_p_3636_04_desc:0 "$building_hd_pass_p_3636_01_desc$"
 building_hd_pass_p_3116_01_desc:0 "In the mountains along the upper Han River, a ridge winds like a horse's back. The road follows its crest, with deep valleys on either side, and the fortified pass guards a crucial narrow point along the ridge."
 building_hd_pass_p_3116_02_desc:0 "$building_hd_pass_p_3116_01_desc$"
 building_hd_pass_p_3116_03_desc:0 "$building_hd_pass_p_3116_01_desc$"
 building_hd_pass_p_3116_04_desc:0 "$building_hd_pass_p_3116_01_desc$"
 building_hd_pass_p_833_01_desc:0 "Around Lushi County in Hongnong Commandery, two rock faces rise like a gateway among the Xiong'er Mountains. Travellers pass between them on the mountain road from the upper Luo River to Shangluo."
 building_hd_pass_p_833_02_desc:0 "$building_hd_pass_p_833_01_desc$"
 building_hd_pass_p_833_03_desc:0 "$building_hd_pass_p_833_01_desc$"
 building_hd_pass_p_833_04_desc:0 "$building_hd_pass_p_833_01_desc$"
 building_hd_pass_p_1064_01_desc:0 "In the Wangwu Mountains of Yuan County in Hedong Commandery, the terrain resembles a winnowing basket, and the fortified pass occupies a commanding position. Crossing the river to the south brings travellers to Luoyang. Early in Emperor Guangwu's campaign to reunify the realm, Deng Yu advanced through Jiguan to attack Hedong."
 building_hd_pass_p_1064_02_desc:0 "$building_hd_pass_p_1064_01_desc$"
 building_hd_pass_p_1064_03_desc:0 "$building_hd_pass_p_1064_01_desc$"
 building_hd_pass_p_1064_04_desc:0 "$building_hd_pass_p_1064_01_desc$"
 building_hd_pass_p_1509_01_desc:0 "The lofty Long Mountains stand between Guanzhong and Longxi, with Longguan established at their summit. Travellers heading west across the mountains often feel sorrow as they look back from the heights towards Qinchuan. During the Jianwu era, Wei Xiao also held the Long heights against the Han army."
 building_hd_pass_p_1509_02_desc:0 "$building_hd_pass_p_1509_01_desc$"
 building_hd_pass_p_1509_03_desc:0 "$building_hd_pass_p_1509_01_desc$"
 building_hd_pass_p_1509_04_desc:0 "$building_hd_pass_p_1509_01_desc$"
 building_hd_pass_p_1942_01_desc:0 "Among the Dabie Mountains on the northern frontier of Jiangxia Commandery, a deep, winding valley lies on the shaded side of the mountains. Its woods see no sunlight throughout the day, and the fortified pass guards the route through them."
 building_hd_pass_p_1942_02_desc:0 "$building_hd_pass_p_1942_01_desc$"
 building_hd_pass_p_1942_03_desc:0 "$building_hd_pass_p_1942_01_desc$"
 building_hd_pass_p_1942_04_desc:0 "$building_hd_pass_p_1942_01_desc$"
 building_hd_pass_p_3642_01_desc:0 "Shangyong lies among the mountains of the upper Han River, linking Hanzhong to the west and Xiangyang to the east. It was once the land of the state of Yong. During the Spring and Autumn period, the people of Yong led the neighbouring Man peoples in rebellion against Chu, but were ultimately defeated by Chu, Qin, and Ba. The city stands beside the Du River, surrounded by mountains, and guards both the mountain roads and waterways of the upper Han River."
 building_hd_pass_p_3642_02_desc:0 "$building_hd_pass_p_3642_01_desc$"
 building_hd_pass_p_3642_03_desc:0 "$building_hd_pass_p_3642_01_desc$"
 building_hd_pass_p_3642_04_desc:0 "$building_hd_pass_p_3642_01_desc$"
 building_hd_pass_p_3449_01_desc:0 "Ridge upon ridge rises through the mountains of Liaodong. A fortified pass at the mouth of a valley east of Anshi guards the road from the plains along the Liao River into the eastern mountains. The armies of Goguryeo and Han frequently move through this area."
 building_hd_pass_p_3449_02_desc:0 "$building_hd_pass_p_3449_01_desc$"
 building_hd_pass_p_3449_03_desc:0 "$building_hd_pass_p_3449_01_desc$"
 building_hd_pass_p_3449_04_desc:0 "$building_hd_pass_p_3449_01_desc$"
 building_hd_pass_p_568_01_desc:0 "Southeast of Guangchang County in Dai Commandery, Wuruan Pass guards the mountain road south from Dai towards Zhongshan and Zhuo Commandery. The mountains curve around a narrow, difficult road. When the Xianbei or Wuhuan raid, this pass forms a barrier protecting the heartlands of Yan and Zhao."
 building_hd_pass_p_568_02_desc:0 "$building_hd_pass_p_568_01_desc$"
 building_hd_pass_p_568_03_desc:0 "$building_hd_pass_p_568_01_desc$"
 building_hd_pass_p_568_04_desc:0 "$building_hd_pass_p_568_01_desc$"
 building_hd_pass_p_1447_01_desc:0 "In northern Shang Commandery, gullies cut through the loess hills, and the Yan River winds through a deep valley. The fortified pass stands at the valley mouth to defend against cavalry of the Hu peoples approaching from the north."
 building_hd_pass_p_1447_02_desc:0 "$building_hd_pass_p_1447_01_desc$"
 building_hd_pass_p_1447_03_desc:0 "$building_hd_pass_p_1447_01_desc$"
 building_hd_pass_p_1447_04_desc:0 "$building_hd_pass_p_1447_01_desc$"
 building_hd_pass_p_1452_01_desc:0 "High earthen plateaus rise along the southern frontier of Shang Commandery, with roads winding through the gullies below. The fortified pass guards a key route through the valley, forming one of the barriers along the road north from Guanzhong into Shang Commandery."
 building_hd_pass_p_1452_02_desc:0 "$building_hd_pass_p_1452_01_desc$"
 building_hd_pass_p_1452_03_desc:0 "$building_hd_pass_p_1452_01_desc$"
 building_hd_pass_p_1452_04_desc:0 "$building_hd_pass_p_1452_01_desc$"
 building_hd_pass_p_811_01_desc:0 "Dense pine forests cover the mountains of Shangluo, where the mountain road follows a stream. The fortified pass stands among the trees, guarding a minor route east from Shangluo to Nanyang."
 building_hd_pass_p_811_02_desc:0 "$building_hd_pass_p_811_01_desc$"
 building_hd_pass_p_811_03_desc:0 "$building_hd_pass_p_811_01_desc$"
 building_hd_pass_p_811_04_desc:0 "$building_hd_pass_p_811_01_desc$"
 building_hd_pass_p_3757_01_desc:0 "Deep in the mountains of Lushi County, the rocks are as dark as iron. The fortified pass guards a valley route along the upper Luo River. The narrow, difficult terrain allows even a small force to hold it."
 building_hd_pass_p_3757_02_desc:0 "$building_hd_pass_p_3757_01_desc$"
 building_hd_pass_p_3757_03_desc:0 "$building_hd_pass_p_3757_01_desc$"
 building_hd_pass_p_3757_04_desc:0 "$building_hd_pass_p_3757_01_desc$"
 building_hd_pass_p_832_01_desc:0 "Among the mountains of eastern Shangluo, deep stream valleys surround a fortified pass guarding the mountain road from the upper Dan River to Hongnong. Flocks of waterbirds can often be seen gathering over pools in the forest streams."
 building_hd_pass_p_832_02_desc:0 "$building_hd_pass_p_832_01_desc$"
 building_hd_pass_p_832_03_desc:0 "$building_hd_pass_p_832_01_desc$"
 building_hd_pass_p_832_04_desc:0 "$building_hd_pass_p_832_01_desc$"
 building_hd_pass_p_3059_01_desc:0 "Three mountain roads meet beside the Tao River: one leads to Longxi, one into the lands of the Qiang, and one down to Heguan. The fortified pass guards this junction, serving as an outpost against the Qiang peoples on Liangzhou's southwestern frontier."
 building_hd_pass_p_3059_02_desc:0 "$building_hd_pass_p_3059_01_desc$"
 building_hd_pass_p_3059_03_desc:0 "$building_hd_pass_p_3059_01_desc$"
 building_hd_pass_p_3059_04_desc:0 "$building_hd_pass_p_3059_01_desc$"
 building_hd_pass_p_5540_01_desc:0 "In Xiemu County of Cangwu Commandery, a pass through the Five Ridges lies on one of the roads south from Lingling across the mountains into Lingnan. After Emperor Wu conquered Nanyue, the passes in this area all came under Han control."
 building_hd_pass_p_5540_02_desc:0 "$building_hd_pass_p_5540_01_desc$"
 building_hd_pass_p_5540_03_desc:0 "$building_hd_pass_p_5540_01_desc$"
 building_hd_pass_p_5540_04_desc:0 "$building_hd_pass_p_5540_01_desc$"
 building_hd_pass_p_6399_01_desc:0 "The Kuang River flows south from the north through the mountains, joining the Zhen River here. The kingdom of Nanyue established a pass at this site, which formed a barrier on Lingnan's northern frontier together with Hengpu and Yangshan. During Emperor Wu's campaign against Nanyue, one Han army advanced downstream along the Kuang River."
 building_hd_pass_p_6399_02_desc:0 "$building_hd_pass_p_6399_01_desc$"
 building_hd_pass_p_6399_03_desc:0 "$building_hd_pass_p_6399_01_desc$"
 building_hd_pass_p_6399_04_desc:0 "$building_hd_pass_p_6399_01_desc$"
 building_hd_pass_p_1924_01_desc:0 "At a pass through the southern foothills of the Dabie Mountains, white sand covers the streambed beneath murmuring clear water. The fortified pass guards the mountain road north from Jiangxia across the Dabie Mountains."
 building_hd_pass_p_1924_02_desc:0 "$building_hd_pass_p_1924_01_desc$"
 building_hd_pass_p_1924_03_desc:0 "$building_hd_pass_p_1924_01_desc$"
 building_hd_pass_p_1924_04_desc:0 "$building_hd_pass_p_1924_01_desc$"
 building_hd_pass_p_3744_01_desc:0 "The great river passes through the Wu Mountains, with high peaks and deep valleys on both banks and woods that hide the sun. The fortified pass guards the mountain road along the river, occupying a strategic position between Ba and Chu."
 building_hd_pass_p_3744_02_desc:0 "$building_hd_pass_p_3744_01_desc$"
 building_hd_pass_p_3744_03_desc:0 "$building_hd_pass_p_3744_01_desc$"
 building_hd_pass_p_3744_04_desc:0 "$building_hd_pass_p_3744_01_desc$"
 building_hd_pass_p_1929_01_desc:0 "Among the Dabie Mountains, a loess slope connects the routes north and south. Rain leaves the road muddy and difficult to travel. The fortified pass guards the top of the slope, forming one of the key gateways from the Jianghan region north towards the Huai River."
 building_hd_pass_p_1929_02_desc:0 "$building_hd_pass_p_1929_01_desc$"
