l_english:
 hd_j16.0001.t:0 "The Appointed Hour"
 hd_j16.0001.desc:0 "The blades are close now. The feuds of a lifetime have come to their reckoning: your enemies are at the gate, most of those around you have already slipped away, and there is nowhere left to retreat."
 hd_j16.0001.desc_again:0 "Once before you clenched your teeth and lived through it. This time, the men at the gate will give you no room to breathe."
 hd_j16.0001.a:0 "Life and death are as Heaven decrees."
 hd_j16.0001.b:0 "I will not sit and wait for the end!"
 hd_j16_core_sick_again_desc:0 "The old illness has returned, fiercer than before. The physicians kneel by your bed and dare not raise their eyes. You know you will not survive it this time; it is time to set your affairs in order."
 liaodongxianggong_desc:0 "Murong Hui died as Jin's Duke of Liaodong; the Jin court gave him the posthumous name Xiang, and he is remembered as Duke Xiang of Liaodong."
