 building_type_hd_shouchun_city_01:0 "Shouchun City"
 building_type_hd_shouchun_city_01_desc:0 "Shouchun commands the vital crossing of the Huai River, with its city walls, government offices, and gardens together forming a key military and administrative stronghold in Huainan. Its robust defensive installations protect both the garrison troops and the civilians within the city, making this place an essential hub for operations across the Jianghuai region."
 building_hd_shouchun_city_01:0 "$building_type_hd_shouchun_city_01$"
 building_hd_shouchun_city_01_desc:0 "$building_type_hd_shouchun_city_01_desc$"
 building_type_hd_yecheng_city_01:0 "Ye City"
 building_type_hd_yecheng_city_01_desc:0 "Ye City is situated at a strategic pass in Hebei, with well-ordered city walls and bustling markets. Government offices, granaries, and transportation networks converge here, making it a metropolis capable of supporting military and political operations as well as commercial activities in the north."
 building_hd_yecheng_city_01:0 "$building_type_hd_yecheng_city_01$"
 building_hd_yecheng_city_01_desc:0 "$building_type_hd_yecheng_city_01_desc$"
 building_type_hd_yecheng_three_platforms_01:0 "Yecheng's Three Terraces"
 building_type_hd_yecheng_three_platforms_01_desc:0 "The Three Terraces of Ye City, comprising the Copper Crow Terrace, Golden Tiger Terrace, and Ice Well Terrace, symbolize the imperial gardens and ritual architecture of Cao Wei's Ye City. These high terraces overlook the Zhang River, embodying the memories of northern politics, banquets, and scholarly gatherings."
 building_hd_yecheng_three_platforms_01:0 "$building_type_hd_yecheng_three_platforms_01$"
 building_hd_yecheng_three_platforms_01_desc:0 "$building_type_hd_yecheng_three_platforms_01_desc$"
