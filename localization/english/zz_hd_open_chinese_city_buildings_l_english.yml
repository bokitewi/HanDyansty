l_english:
 building_type_hd_shouchun_city_01:0 "Shouchun City"
 building_type_hd_shouchun_city_01_desc:0 "Shouchun stands on the south bank of the Huai River, backed by Bagong Mountain. The Fei River curves around the city before flowing north into the Huai. King Kaolie of Chu moved his capital here and retained the name Ying. Under the Han, Liu An, King of Huainan, also made it his seat, gathering guests and masters of esoteric arts to write books and debate the Way. The city became the foremost metropolis of Huainan."
 building_hd_shouchun_city_01:0 "$building_type_hd_shouchun_city_01$"
 building_hd_shouchun_city_01_desc:0 "$building_type_hd_shouchun_city_01_desc$"
 building_type_hd_yecheng_city_01:0 "Yecheng"
 building_type_hd_yecheng_city_01_desc:0 "Ye is an ancient city built by Duke Huan of Qi. As its magistrate during the Warring States period, Ximen Bao abolished the custom of offering brides to the river god and dug channels to irrigate the fields with water from the Zhang River. The land prospered. Today the seat of Wei Commandery, with strong walls and busy markets, it ranks among the greatest cities of Hebei."
 building_hd_yecheng_city_01:0 "$building_type_hd_yecheng_city_01$"
 building_hd_yecheng_city_01_desc:0 "$building_type_hd_yecheng_city_01_desc$"
 building_type_hd_yecheng_three_platforms_01:0 "Three Terraces of Yecheng"
 building_type_hd_yecheng_three_platforms_01_desc:0 "At the northwest corner of Yecheng, the walls are high and thick and the ground rises above the surrounding land. From the battlements, one can see the Zhang River flowing east and the Taihang Mountains stretching across the west. It is an ideal site for viewing terraces. A mighty ruler who raised great platforms here and entertained his guests upon them would surely become renowned throughout the realm."
 building_hd_yecheng_three_platforms_01:0 "$building_type_hd_yecheng_three_platforms_01$"
 building_hd_yecheng_three_platforms_01_desc:0 "$building_type_hd_yecheng_three_platforms_01_desc$"
 building_type_hd_xiangyang_city_01:0 "Xiangyang City"
 building_type_hd_xiangyang_city_01_desc:0 "Xiangyang stands on the south bank of the Han River, facing Fancheng across the water. Xian Mountain shields it to the south, and its walls are high and moat deep. The main road from Nanyang to Jiangling passes through the city, making it a vital link between north and south in the Jianghan region."
 building_hd_xiangyang_city_01:0 "$building_type_hd_xiangyang_city_01$"
 building_hd_xiangyang_city_01_desc:0 "$building_type_hd_xiangyang_city_01_desc$"
 building_type_hd_hefei_city_01:0 "Hefei City"
 building_type_hd_hefei_city_01_desc:0 "Hefei lies between the Yangtze and Huai rivers. When the waters rise in summer, the Shi and Fei rivers meet here, giving the city its name. Leather, dried fish, and timber from the south are gathered and traded here, making it a commercial center of the Jianghuai region."
 building_hd_hefei_city_01:0 "$building_type_hd_hefei_city_01$"
 building_hd_hefei_city_01_desc:0 "$building_type_hd_hefei_city_01_desc$"
