l_english:
 situation_dynastic_cycle_phase_hd_recovery:0 "Rebuilding from Ruin"
 situation_dynastic_cycle_phase_hd_recovery_desc_short:0 "The age of chaos has just ended and everything awaits rebuilding. Warfare subsides, fields are reclaimed, and the people long for stability."
 situation_dynastic_cycle_phase_hd_recovery_desc:0 "$situation_dynastic_cycle_phase_hd_recovery_desc_short$\n\nIn this [dynastic_cycle_era_short|E], warfare gradually subsides, refugees return to their fields, and the commanderies and counties grow more prosperous by the day. If governance is upright, the realm may enter an age of Advancement or Expansion; if mishandled, undercurrents will rise again and the realm will fall back into Instability.\n\nWithin All Under Heaven, only the [son_of_heaven|E] may create a [kingdom|E], and no new [empire|E] may be established."
 situation_dynastic_cycle_phase_hd_collapse:0 "Collapse of the Realm"
 situation_dynastic_cycle_phase_hd_collapse_desc_short:0 "The dynasty is in its final days and order has decayed. Disasters and omens abound, bandits rise everywhere, and the provinces and commanderies harbor their own ambitions."
 situation_dynastic_cycle_phase_hd_collapse_desc:0 "$situation_dynastic_cycle_phase_hd_collapse_desc_short$\n\nIn this [dynastic_cycle_era_short|E], the court faces a crisis every two years: powerful vassals plot to usurp the throne and proclaim themselves emperor, commoners rise in revolt, or the court's authority collapses. Natural disasters and roving bandits also appear from time to time.\n\nIf the Chinese [hegemony|E] has no holder, or the [son_of_heaven|E] controls less than 40% of the realm's de jure [counties|E], the realm immediately falls into the Struggle of the Warlords. When crown authority is below its highest level, the realm is pushed toward the Struggle of the Warlords each year. If the [son_of_heaven|E] resolves the crises and restores order, the realm may yet return to Instability."
 situation_dynastic_cycle_phase_hd_standoff:0 "Tripod Standoff"
 situation_dynastic_cycle_phase_hd_standoff_desc_short:0 "The warlords have settled into place; the great powers each hold a region and check one another, and the realm sinks into a long standoff."
 situation_dynastic_cycle_phase_hd_standoff_desc:0 "$situation_dynastic_cycle_phase_hd_standoff_desc_short$\n\nIn this [dynastic_cycle_era_short|E], the treasuries of every power slowly fill and their legitimacy grows firmer, yet not a day passes without each eyeing its neighbors. If someone breaks a treaty, subverts enemy ministers, raises troops in civil strife, or wins a sweeping victory in a single war, or if a child ruler succeeds, foreign invaders triumph, or mighty vassals multiply, the realm will return to the Struggle of the Warlords; sending sons as hostages or paying for peace can delay the fighting for a time.\n\nOnly a ruler who controls 80% of the de jure [counties|E] of All Under Heaven, has been crowned, and has sufficient [legitimacy|E] or prestige can bring the age of chaos to an end."
 catalyst_hd_hegemon_peace_yearly:0 "Peace Under Heaven[dynastic_cycle_catalyst|E]"
 catalyst_hd_hegemon_peace_yearly_desc:0 "Yearly change: the [son_of_heaven|E] fought no defensive [war|E] this year"
 catalyst_hd_treasury_solvent_yearly:0 "Full Treasury[dynastic_cycle_catalyst|E]"
 catalyst_hd_treasury_solvent_yearly_desc:0 "Yearly change: the [son_of_heaven|E]'s [treasury|E] is not in debt"
 catalyst_hd_popular_content_yearly:0 "Contented People[dynastic_cycle_catalyst|E]"
 catalyst_hd_popular_content_yearly_desc:0 "Yearly change: the average [county_opinion|E] of [counties|E] in the [son_of_heaven|E]'s [domain|E] is not below zero"
 catalyst_hd_hegemon_won_defensive_war:0 "Enemies Repelled[dynastic_cycle_catalyst|E]"
 catalyst_hd_hegemon_won_defensive_war_desc:0 "The [son_of_heaven|E] won a defensive [war|E]"
 catalyst_hd_collapse_drift_yearly:0 "Steady Decline[dynastic_cycle_catalyst|E]"
 catalyst_hd_collapse_drift_yearly_desc:0 "Yearly change: order decays by the day, and the collapse of the realm deepens"
 catalyst_hd_collapse_crisis_succeeded:0 "Crisis Prevails[dynastic_cycle_catalyst|E]"
 catalyst_hd_collapse_crisis_succeeded_desc:0 "The rebels won a [faction|E] revolt or a mighty vassal's war for the throne, or the [son_of_heaven|E] yielded to a crisis"
 catalyst_hd_collapse_crisis_suppressed:0 "Rebellion Quelled[dynastic_cycle_catalyst|E]"
 catalyst_hd_collapse_crisis_suppressed_desc:0 "The [son_of_heaven|E] quelled a [faction|E] revolt or a mighty vassal's war for the throne"
 catalyst_hd_hegemon_control_70_yearly:0 "Command of the Realm[dynastic_cycle_catalyst|E]"
 catalyst_hd_hegemon_control_70_yearly_desc:0 "Yearly change: the [son_of_heaven|E] controls over 70% of the de jure [counties|E] of All Under Heaven"
 catalyst_hd_few_major_powers_yearly:0 "Warlords Settling[dynastic_cycle_catalyst|E]"
 catalyst_hd_few_major_powers_yearly_desc:0 "Yearly change: there are three to six kingdom-tier or higher [independent_rulers|E] within All Under Heaven"
 catalyst_hd_consolidation_lost_to_peer:0 "Deadlock[dynastic_cycle_catalyst|E]"
 catalyst_hd_consolidation_lost_to_peer_desc:0 "A kingdom-tier ruler attacked a rival of equal rank in a Chinese Consolidation War and failed to win"
 catalyst_hd_multiple_empires_yearly:0 "Rival Emperors[dynastic_cycle_catalyst|E]"
 catalyst_hd_multiple_empires_yearly_desc:0 "Yearly change: there is more than one empire-tier [independent_ruler|E] within All Under Heaven"
 catalyst_hd_many_major_powers_yearly:0 "Warlords Rising[dynastic_cycle_catalyst|E]"
 catalyst_hd_many_major_powers_yearly_desc:0 "Yearly change: there are at least six kingdom-tier or higher [independent_rulers|E] within All Under Heaven"
 catalyst_hd_major_ruler_child_heir:0 "Child Ruler, Uneasy Realm[dynastic_cycle_catalyst|E]"
 catalyst_hd_major_ruler_child_heir_desc:0 "A kingdom-tier or higher [independent_ruler|E] within All Under Heaven died, leaving an heir under sixteen"
 catalyst_hd_big_conquest:0 "Expanding the Frontiers[dynastic_cycle_catalyst|E]"
 catalyst_hd_big_conquest_desc:0 "Five or more [counties|E] were taken in a single [war|E]"
 catalyst_hd_siyi_raid_won:0 "Barbarian Incursion[dynastic_cycle_catalyst|E]"
 catalyst_hd_siyi_raid_won_desc:0 "Barbarians won a battle within All Under Heaven, or a [raid|E] succeeded"
 catalyst_hd_faction_war_started:0 "Rising Unrest[dynastic_cycle_catalyst|E]"
 catalyst_hd_faction_war_started_desc:0 "A [faction|E] revolt or popular uprising broke out within All Under Heaven"
 hd_end_luanshi_hegemon_tt:0 "The Chinese [hegemony|E] has no holder, or is held by you"
 hd_end_luanshi_crowned_tt:0 "Already Crowned"
 hd_end_luanshi_authority_tt:0 "[legitimacy|E] meets expectations, or [prestige_level|E] is at least 3"
 hd_cycle_title_creation_locked_tt:0 "Within All Under Heaven, an [empire|E] may only be created by an [independent_ruler|E] during the Struggle of the Warlords or the Tripod Standoff, and not even by the [son_of_heaven|E]; in other eras, only the [son_of_heaven|E] may create a [kingdom|E] within All Under Heaven"
 hd_hegemon_empire_no_grant_tt:0 "The [son_of_heaven|E] may not grant [empire|E] titles that hold actual territory"
 hd_emperor_ai_no_kingdom_grant_tt:0 "Central Plains [empire|E] rulers do not grant away [kingdom|E] titles"
 HD_FACTION_POWER_COLLAPSE:0 "Collapse of the Realm"
 hd_strat_hold_accept_reason:0 "Ruler Maintaining the Legacy: $VALUE|=+0$"
 hd_siyi_recovery_modifier:0 "Barbarians Submit"
 hd_siyi_recovery_modifier_desc:0 "The Central Plains have recovered their strength, and the barbarians have laid down their arms for now."
 hd_siyi_collapse_modifier:0 "Coveting the Central Plains"
 hd_siyi_collapse_modifier_desc:0 "The Central Plains are in decline, and the barbarians are stirring."
 hd_siyi_struggle_modifier:0 "Raiding Amid Chaos"
 hd_siyi_struggle_modifier_desc:0 "The warlords of the Central Plains fight among themselves; now is the moment for the barbarians to strike south."
 hd_strat_expander_modifier:0 "Warmongering"
 hd_strat_expander_modifier_desc:0 "Emptying the treasury to expand the army, with ambitions of dominating a region."
 hd_authority_crisis_major_modifier:0 "Power Ceded to the Provinces"
 hd_authority_crisis_major_modifier_desc:0 "The court can no longer restrain the provinces and commanderies."
 hd_authority_crisis_minor_modifier:0 "Edict of Self-Reproach"
 hd_authority_crisis_minor_modifier_desc:0 "The Son of Heaven has issued an edict of self-reproach to calm the people."
 hd_authority_crisis_opinion_modifier:0 "Ministers Cowed"
 hd_authority_crisis_opinion_modifier_desc:0 "The Son of Heaven cowed his ministers by force, and resentment rises on all sides."
 hd_famine_county_modifier:0 "Famine"
 hd_famine_county_modifier_desc:0 "Not a grain harvested; the starving dead fill the fields."
 hd_famine_relieved_county_modifier:0 "Aftermath of Relief"
 hd_famine_relieved_county_modifier_desc:0 "The authorities opened the granaries to distribute grain, and the people can breathe again."
 hd_famine_requisition_county_modifier:0 "Requisition Resentment"
 hd_famine_requisition_county_modifier_desc:0 "Forced levies even in a year of disaster; the people's complaints fill the roads."
 hd_collapse_warlord_faction:0 "Enthronement Faction"
 hd_collapse_warlord_faction_desc:0 "Enthrone a mighty vassal in place of the Son of Heaven"
 hd_collapse_warlord_war:0 "Warlord Claims the Throne"
 hd_collapse_warlord_war_name:0 "[ATTACKER.GetShortUINamePossessive] War for the Throne"
 hd_strategic_annex_cb:0 "Annexation"
 hd_strategic_annex_cb_name:0 "Annexation"
 hd_strategic_annex_cb_war_name:0 "[ATTACKER.GetShortUINamePossessive] War of Annexation"
 hd_strategic_annex_cb_victory_desc:0 "[attacker.GetShortUIName|U] seizes the directly held counties of [defender.GetShortUINamePossessive] realm within this strategic region."
 hd_strategic_annex_cb_white_peace_desc:0 "Both sides lay down their arms and make peace."
 hd_strategic_annex_cb_defeat_desc:0 "[attacker.GetShortUIName|U] pays reparations to [defender.GetShortUIName]."
 hd_siyi_raid_cb:0 "Incursion"
 hd_siyi_raid_cb_name:0 "Incursion"
 hd_siyi_raid_cb_war_name:0 "[ATTACKER.GetShortUINamePossessive] Incursion"
 hd_siyi_raid_cb_victory_desc:0 "[attacker.GetShortUIName|U] seizes all counties of the target duchy along with any land occupied during the war, and gains [prestige|E] and herd based on development."
 hd_siyi_raid_cb_white_peace_desc:0 "The invaders return empty-handed."
 hd_siyi_raid_cb_defeat_desc:0 "The invaders are sent back in defeat."
 hd_collapse_adventurer_army:0 "Roving Bandits"
 hd_collapse.1001.t:0 "The Lords Petition"
 hd_collapse.1001.desc:0 "The court's authority is failing and the provinces drift away. Several vassals have jointly submitted a memorial asking to leave the court and rule on their own. The wording is respectful, yet between the lines lurks the scent of steel: should you refuse, they will meet you on the battlefield."
 hd_collapse.1001.a:0 "Enough. Let them go."
 hd_collapse.1001.b:0 "Rebels and traitors, how dare they threaten the court!"
 hd_collapse.1001.b.tt:0 "The petitioning lords will secretly conspire, and once they have gathered their strength, they will march against you."
 hd_collapse.1002.t:0 "A Secret Pact of Independence"
 hd_collapse.1002.desc:0 "Several vassals as discontented as you have secretly sent envoys, inviting you to rise with them and break free of [liege.GetShortUIName]'s rule."
 hd_collapse.1002.a:0 "I will join this great undertaking."
 hd_collapse.1002.b:0 "I want no part in this."
 hd_collapse.2002.t:0 "Enthroning a New Master"
 hd_collapse.2002.desc:0 "Someone is quietly forging alliances to enthrone a mighty vassal in place of the Son of Heaven. A secret envoy has arrived at your residence, asking you to join the cause."
 hd_collapse.2002.a:0 "I will gladly follow."
 hd_collapse.2002.b:0 "I remain loyal to the court."
 hd_collapse.4001.t:0 "The Court's Authority in Ruins"
 hd_collapse.4001.desc:0 "The provinces and commanderies each govern as they please, edicts go no further than the capital region, and the replies at court grow ever more perfunctory. You know in your heart that unless you make a choice, the court will not even keep what little dignity it has left."
 hd_collapse.4001.a:0 "Cede power to the provinces for a fragile peace."
 hd_collapse.4001.b:0 "Issue an edict of self-reproach to win back hearts."
 hd_collapse.4001.c:0 "Cow the ministers and keep a firm grip on power."
 situation_natural_disaster_hd_famine_desc:0 "Famine is a [natural_disaster|E] that leaves vast swathes of [counties|E] without harvest, causing [county_opinion|E] and taxes to plummet."
 natural_disaster_hd_famine_situation:0 "Great Famine of [Situation.MakeScope.Var('hd_famine_kingdom').Title.GetBaseNameNoTier]"
 natural_disaster_hd_famine_warning_situation_phase:0 "Poor Harvest"
 natural_disaster_hd_famine_warning_situation_phase_desc:0 "A long drought without rain, locusts swarming everywhere; the autumn harvest is already lost."
 natural_disaster_hd_famine_impact_situation_phase:0 "Famine"
 natural_disaster_hd_famine_impact_situation_phase_desc:0 "Grain prices soar, the starving dead fill the fields, and refugees scatter in all directions."
 natural_disaster_hd_famine_recovery_situation_phase:0 "Recovery"
 natural_disaster_hd_famine_affected_ruler:0 "Disaster: #weak Famine#!"
 hd_famine.0001.t:0 "A Year of Great Famine"
 hd_famine.0001.desc:0 "Many parts of your domain have yielded no harvest at all. Grain prices rise three times in a day, and outside the walls the starving lead their elders and children along the roads, begging for food. Your officials wait below the hall with reports of the disaster, awaiting your command."
 hd_famine.0001.a:0 "Open the granaries to save the starving."
 hd_famine.0001.b:0 "Taxes must be collected even in a disaster year, to fill the treasury."
 hd_famine.0001.c:0 "Heaven's calamities are beyond human power to undo."
