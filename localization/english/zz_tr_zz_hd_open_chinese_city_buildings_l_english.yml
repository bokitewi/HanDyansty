l_english:
 building_type_hd_jinyang_city_01:0 "Jinyang City"
 building_type_hd_jinyang_city_01_desc:0 "Jinyang is an ancient city built by Dong Anyu, retainer of Zhao Jianzi. Zhi Bo once flooded it, so that the people hung their pots to cook, yet Zhao Xiangzi held firm and would not yield, and at last destroyed the Zhi clan. Standing on the banks of the Fen River, it is now the seat of Taiyuan Commandery and the stronghold of Bing Province."
 building_type_hd_yubi_city_01:0 "Yubi City"
 building_type_hd_yubi_city_01_desc:0 "On the south bank of the Fen River in Hedong Commandery rises a high mound, flat on top and ringed by deep ravines like a natural city wall. From its summit one overlooks the Fen valley, and every traveler passing between Taiyuan and Pingyang lies in plain view."
 building_type_hd_baidi_city_01:0 "Baidi City"
 building_type_hd_baidi_city_01_desc:0 "At Yufu County in Ba Commandery, the Great River bursts through a gorge between sheer cliffs. Legend says that when Gongsun Shu held Shu, he saw a white vapor like a dragon rise from a well, styled himself the White Emperor, and built a city on the mountain. High above the gorge mouth, the city commands the river route from Ba-Shu east to Jing and Chu."
 building_type_hd_pengcheng_city_01:0 "Pengcheng"
 building_type_hd_pengcheng_city_01_desc:0 "Pengcheng is said to have been the fief of Pengzu, and Xiang Yu, Hegemon-King of Western Chu, once made it his capital. Set where the Si and Huo rivers meet, it commands Qi and Lu to the north and reaches the Jiang and Huai to the south. Its walls are high and its markets and wards ring the city; today it is the capital of the Kingdom of Pengcheng."
 building_type_hd_linzi_city_01:0 "Linzi City"
 building_type_hd_linzi_city_01_desc:0 "Linzi was the old capital of Qi, its Great City joined to its Small City, with palaces, ancestral temples and market wards each in their place. Su Qin once said that in its streets the hubs of carts struck one another and passersby rubbed shoulders; raised sleeves formed a curtain and wiped sweat fell like rain. To this day it remains the foremost metropolis of the East."
 building_type_hd_tongwan_city_01:0 "Tongwan City"
 building_type_hd_tongwan_city_01_desc:0 "North of Shang Commandery, beside the Shiyan River, lies a stretch of white-earth highland, where sand and gravel mingle with grass and water on every side; the Xiongnu and Qiang tribes often graze their herds here. The soil is white and firm, and when rammed it becomes as hard as whetstone."
 building_type_hd_zuoguo_city_01:0 "Zuoguo City"
 building_type_hd_zuoguo_city_01_desc:0 "Zuoguo City, north of Lishi in Xihe Commandery, is where the Southern Xiongnu tribes dwell. Its walls encircle sparse houses, while felt tents and herds scatter across the open land, a scene of frontier desolation."
