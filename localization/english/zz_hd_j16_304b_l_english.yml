l_english:
 hd_j16.0450.t:0 "An Emperor in Chengdu"
 hd_j16.0450.desc:0 "You have ruled as king in Chengdu for nearly two years. The Jin armies have fallen back to Ba Commandery, and no rival is left in Shu. Fan Changsheng of Mount Qingcheng, revered by the people of Shu almost as a god, urges you to settle your title at last. Your ministers have jointly petitioned you to take the imperial throne, keeping Cheng as the name of the realm."
 hd_j16.0450.a:0 "Take the imperial throne and invite Fan Changsheng to serve as chancellor."
 hd_j16.0450.b:0 "Our foundations are not yet firm. I remain King of Chengdu."
 hd_j16.0451.t:0 "The Death of Luo Shang"
 hd_j16.0451.desc:0 "Luo Shang, the Jin Inspector of Yi Province, has died in Ba Commandery, and the Jin forces in Shu are leaderless. Even the commanders in Hanzhong are uneasy, and some have already sent men to Chengdu to sound out your intentions. Your generals say Ba and Hanzhong are ripe for the taking."
 hd_j16.0451.a:0 "Send proclamations to Ba and Hanzhong and prepare to advance."
 hd_j16.0451.b:0 "Guard our borders and give the people rest."
 hd_j16.0452.t:0 "Coup at the Funeral Hall"
 hd_j16.0452.desc:0 "The late emperor is dead, and the crown prince Li Ban spends his days weeping in the funeral hall, paying no heed to the court. Li Yue comes to you: Li Ban is not even the late emperor's own son, so what right has he to the throne? Half the palace guard already answers to you brothers. Strike tonight, and the throne is yours."
 hd_j16.0452.a:0 "Rise with Li Yue and seize the throne."
 hd_j16.0452.b:0 "The late emperor left his command. I will not betray it."
 hd_j16.0453.t:0 "Rising at Fucheng"
 hd_j16.0453.desc:0 "Li Qi suspects every member of the royal clan and has put minister after minister to death. You, who guard Hanzhong and Fucheng, will surely be next. Your officers urge you to strike first: march straight into Chengdu, depose Li Qi, give the realm a new name, and save Ba and Shu from this tyrant."
 hd_j16.0453.a:0 "March on Chengdu, depose Li Qi, take the throne, and rename the realm Han."
 hd_j16.0453.b:0 "The bond of lord and subject is fixed. I will not move."
 hd_j16.0500.t:0 "Acting King of Liang"
 hd_j16.0500.desc:0 "The Central Plains have long been lost, and edicts from Jiangdong reach Guzang scarcely once a year. The people of Hexi look only to the Zhang family, and your officers ask you to style yourself King of Liang and appoint a full court to steady men's hearts. Yet doing so would cheapen the loyalty to Jin that your family has kept for generations."
 hd_j16.0500.a:0 "Take the title of Acting King of Liang and establish a court."
 hd_j16.0500.b:0 "Remain a loyal subject of Jin."
 hd_j16.0550.t:0 "Uniting the Three Tribes"
 hd_j16.0550.desc:0 "Yituo and Luguan have died one after the other, and the three Tuoba divisions now go their own ways while unrest spreads. The tribal elders have put you forward to lead all three. But the lands held by the various chieftains will have to be brought under you one commandery at a time."
 hd_j16.0550.a:0 "Take command of all three divisions."
 hd_j16.0550.b:0 "Let each division govern itself."
 hd_j16.0551.t:0 "Duke of Dai"
 hd_j16.0551.desc:0 "Liu Kun, the Jin Inspector of Bing Province, hard pressed by the Xiongnu, has sent envoys begging for your help, and offers to petition the court to make you Duke of Dai with Dai Commandery as your fief. Your horsemen could use a Jin title, and Liu Kun badly needs your horsemen."
 hd_j16.0551.a:0 "Accept the title of Duke of Dai and ally with Liu Kun."
 hd_j16.0551.b:0 "The Xianbei have their own masters. I refuse the Jin title."
 hd_j16.0552.t:0 "King of Dai"
 hd_j16.0552.desc:0 "Envoys from the court in Chang'an have come again, raising you to King of Dai and permitting you to appoint officials. From now on the Tuoba bear a royal title, equal in rank to the princes of Jin."
 hd_j16.0552.a:0 "Accept the title of King of Dai."
 hd_j16.0552.b:0 "Remain Duke of Dai."
 hd_j16.0553.t:0 "The Helan Warriors"
 hd_j16.0553.desc:0 "Since Hena took power, complaints have spread among the tribes. Your mother's kin, the Helan, are willing to send warriors, and the tribal elders have quietly written to you. They are only waiting for your return to drive Hena from power."
 hd_j16.0553.a:0 "With the Helan behind me, drive out Hena and take power."
 hd_j16.0553.b:0 "I will not turn on my own kin."
 hd_j16.0554.t:0 "Jianguo"
 hd_j16.0554.desc:0 "On his deathbed Yihuai charged the tribal elders to raise you up. You have returned from Xiangguo to the land of Dai, and the tribes have gathered north of Fanshi to acclaim you. Your followers ask you to take the title King of Dai, proclaim a new era named Jianguo, establish a court, and set the Tuoba in order once more."
 hd_j16.0554.a:0 "Become King of Dai and proclaim the Jianguo era."
 hd_j16.0554.b:0 "Do not proclaim a new era yet."
 hd_j16.0600.t:0 "Strife among the Duan"
 hd_j16.0600.desc:0 "Jiluojuan is dead, and leadership of the Duan has passed to his uncle Shefuchen. In ability and in strength, how does he compare to you? Your followers all say that if you strike down Shefuchen and his sons in a single night, the Duan will be yours."
 hd_j16.0600.a:0 "Kill Shefuchen and make myself chief."
 hd_j16.0600.b:0 "Serve Shefuchen as my lord."
 hd_j16.0601.t:0 "Revolt in Liaodong"
 hd_j16.0601.desc:0 "Since your father died, your elder brother Murong Huang has eyed every one of his brothers with suspicion. Murong Zhao has already been forced to take his own life. Who will be next? You have held Liaodong for years, and the soldiers of Pingguo answer to you. Better to hold Liaodong as your own and stand as your brother's equal."
 hd_j16.0601.a:0 "Hold Liaodong in my own name."
 hd_j16.0601.b:0 "Remain loyal to my brother."
 hd_j16.0602.t:0 "King of Yan"
 hd_j16.0602.desc:0 "For generations the Murong have guarded Liaodong and kept the calendar of Jin, but the Jin court sits far away in Jiangdong and cannot reach this far. Feng Yi and others urge you to proclaim yourself King of Yan and establish a court to command the tribes."
 hd_j16.0602.a:0 "Take the throne as King of Yan."
 hd_j16.0602.b:0 "Continue to keep the calendar of Jin."
 hd_j16.0603.t:0 "Campaign against the Yuwen"
 hd_j16.0603.desc:0 "Yuwen Yidougui has raided our borders time and again and conspires with Later Zhao. Murong Han, who once lived in exile among the Yuwen, knows their strengths and weaknesses well. Your generals say that if we march now, we can destroy the Yuwen at a single stroke."
 hd_j16.0603.a:0 "Lead the army against the Yuwen in person."
 hd_j16.0603.b:0 "Rest the troops. There is no need for a distant campaign."
 hd_j16.0604.t:0 "The Name of Tuyuhun"
 hd_j16.0604.desc:0 "Your grandfather Tuyuhun led his people west and built a home on these grasslands. You tell the tribal elders that an ancestor's name should pass to his descendants. From this day on, his descendants will take Tuyuhun as their clan name, and our people will be known by it too."
 hd_j16.0604.a:0 "Take Tuyuhun as our name."
