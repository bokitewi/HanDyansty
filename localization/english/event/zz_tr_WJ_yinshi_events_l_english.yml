l_english:
 story_WJ_yinshi:0 "Reclusion"
 WJ_YINSHI_STORY_INFORMATION_STRING:0 "You live in reclusion among the mountains and forests, reading, visiting friends, and declining summons to office. Life in the hills may seem quiet, but difficult passages in the classics, disputes in the villages, and letters from old friends keep finding their way to your door. Now and then, a carriage stops outside your rustic gate."
 WJ_yinshi_enter_decision:0 "Withdraw to Cultivate Renown"
 WJ_yinshi_enter_decision_desc:0 "The turmoil of official life is no lasting path. Better to resign my offices, close my door to study, and keep company with old friends from home. Through learning and integrity, I can earn a reputation untainted by court affairs. When the realm is well governed again, it will not be too late to return."
 WJ_yinshi_enter_decision_tooltip:0 "Resign your offices and retire to the mountains to cultivate your renown"
 WJ_yinshi_enter_decision_confirm:0 "Let me go home!"
 WJ_yinshi_enter_decision_effect_tt:0 "You will choose a literary sobriquet, retire to your studies, and decline all summons and appointments to office. You will also cease to command troops."
 WJ_yinshi_enter_decision_resign_tt:0 "All the offices and fiefs you hold, together with their subordinates, will be returned to your liege."
 WJ_yinshi_cooldown_tt:0 "Fewer than fifteen years have passed since you left reclusion. You cannot withdraw again until the year [GetPlayer.MakeScope.Var('wj_yinshi_cooldown_end').GetValue|0]"
 WJ_yinshi_blocked_tt:0 "This person is living in reclusion and will not accept appointment"
 WJ_yinshi_exit_decision:0 "Leave Reclusion"
 WJ_yinshi_exit_decision_desc:0 "I have spent many years in the mountains, but the affairs of the realm have never ceased. It is time to straighten my robes, leave the hills, and answer the summons of the court and local authorities once more."
 WJ_yinshi_exit_decision_tooltip:0 "End your reclusion and accept summons to office again"
 WJ_yinshi_exit_decision_confirm:0 "Straighten my robes and leave the hills."
 WJ_yinshi_exit_decision_effect_tt:0 "You will bid farewell to your mountain home and return to public life. After leaving, you should not withdraw again for many years."
 WJ_yinshi_risk_success:0 "The effort bears fruit"
 WJ_yinshi_risk_fail:0 "Things go awry"
 WJ_yinshi_friend_reason:0 "Grew close during reclusion"
 WJ_yinshi.1001.t:0 "Old Commentaries by Lamplight"
 WJ_yinshi.1001.desc:0 "The borrowed manuscript has finally arrived, but several passages differ from the old scroll at home. In the same passage, one school emphasizes ritual institutions while another examines names and the realities they describe. My younger students each defend a different reading, arguing even over the midday meal.\n\nLate into the night, I am still poring over the two copies. Rashly proposing a new interpretation might win me a little passing fame. Yet knowing the old explanation is unsound and saying nothing would hardly be honest scholarship. The lamp wick has burned shorter, and enough blank paper remains on my desk to set down a new reading."
 WJ_yinshi.1001.a:0 "Check the text first. Leave doubtful passages unresolved."
 WJ_yinshi.1001.b:0 "Examine each point. Finish the argument tonight."
 WJ_yinshi.1001.c:0 "Compare the texts until dawn. Overlook not a single character."
 WJ_yinshi.1002.t:0 "An Old Commentary Reopened"
 WJ_yinshi.1002.desc:0 "Searching an old chest, I find a scroll of commentary on the classics handed down in my family. Its edges are worm-eaten, but several notes remain legible. Some were set down with great care by my predecessors; others are questions scribbled in the excitement of reading. Now, explanations once treated as settled doctrine seem at odds with what I have seen and heard in recent years. Wind rustles the bamboo outside, but those old words keep me from turning the page.\n\nA new interpretation might spare later readers some wrong turns. Yet they might remember only my objections and forget the merits of the old scholarship. If I merely restore what is missing, our family's learning can pass down intact, but my doubts will remain unanswered. Two blank sheets lie under the lamp: one for examining those doubts, one for copying the old commentary. Tonight, I must set my brush to one of them first."
 WJ_yinshi.1002.a:0 "Complete the old commentary. Preserve our family's learning as it was."
 WJ_yinshi.1002.b:0 "Write a separate critique to pass down beside the old interpretation."
 WJ_yinshi.1003.t:0 "Two Copies, Two Readings"
 WJ_yinshi.1003.desc:0 "The manuscript I have borrowed differs here and there from the old copy beside me. In one sentence, a single changed character turns a call for restraint into an urging to act. A small note in the margin looks as though a later copyist mistakenly brought it into the main text. I read the passage several times, and both readings make sense. Neither the wear of the pages nor the depth of the ink readily tells me which came first.\n\nIf I choose one reading for the main text, readers will have fewer distractions, but they will take my choice for the ancient book's original wording. If I set the variants side by side and leave the choice to later readers, the text will be cluttered, but its uncertainties will remain visible. With both scrolls spread across my desk, I find myself unwilling to hide the tangled history of their copying behind a single decisive change."
 WJ_yinshi.1003.a:0 "Keep both readings. Leave the question open."
 WJ_yinshi.1003.b:0 "Choose one for the main text and note the reasons separately."
 WJ_yinshi.1003.c:0 "Withhold judgment for now and borrow more copies."
 WJ_yinshi.1004.t:0 "Night Recitation"
 WJ_yinshi.1004.desc:0 "After nightfall the mountains are especially quiet; only water dripping from the eaves can be heard. You know every line of the chapter of the classics you read today, yet once the book is closed you cannot say how it hangs together from start to finish. In your youth your teacher demanded recitation by heart, and you thought it clumsy; only now do you see that many truths must pass over the tongue again and again before they settle in the heart.\n\nThere is still enough lamp oil to last past midnight. This chapter is not yet familiar, and a long text still awaits after it, while weariness has quietly crept onto your brow."
 WJ_yinshi.1004.a:0 "Master this chapter and go on tomorrow."
 WJ_yinshi.1004.b:0 "Recite through the night until it all connects."
 WJ_yinshi.1005.t:0 "Copying a Stele Inscription"
 WJ_yinshi.1005.desc:0 "A friend has sent you, by way of a woodcutter, a rubbing of an old stele. The ink is uneven, and in places the characters have worn away. Yet there is a breadth of spirit in the strokes, quite unlike the calligraphic styles now in fashion. You spread paper and try a few lines, but your wrist will not obey, and the characters capture only the outward form.\n\nThe elders say that one learning calligraphy must first faithfully copy models for some years; others say that beyond a certain point one should cast the model aside and write in one's own manner. The rubbing lies open on the desk, and the ink is already ground."
 WJ_yinshi.1005.a:0 "Copy one sheet a day, first seeking resemblance of form."
 WJ_yinshi.1005.b:0 "Set the model aside and try to express your own intent."
 WJ_yinshi.1006.t:0 "Studying the Statutes"
 WJ_yinshi.1006.desc:0 "Someone from the village came to ask about the statutes over a lawsuit concerning farmland, and only then did you realize that, for all the classics you have read, you are unfamiliar with the laws now in force. The borrowed code is dense with articles, and for the same matter several provisions prescribe different severities. Scholars often call the law the learning of petty clerks, yet when villagers suffer a loss, it is very often for want of understanding the statutes.\n\nThe code is a thick stack; copying and reading it article by article will already take much effort. To make clear the reasoning that links the articles and write it in words even villagers can understand would cost who knows how many sleepless nights."
 WJ_yinshi.1006.a:0 "First copy and read it through to learn its articles."
 WJ_yinshi.1006.b:0 "Clarify the intent of the law and explain it for the villagers."
 WJ_yinshi.1006.c:0 "Compare each article for the villagers, striving for fairness."
 WJ_yinshi.1007.t:0 "The Nine Chapters on the Mathematical Art"
 WJ_yinshi.1007.desc:0 "Going through your books, you turn up a copy of the Nine Chapters on the Mathematical Art, bought long ago to get through your studies; its pages have hardly been turned. Glancing at a few problems, you find that fair distribution and field measurement bear directly on village affairs: apportioning labor service and surveying farmland both depend on these methods. Disputes over the village accounts arise often, mostly because no one can reckon them clearly.\n\nWorking through the problems one by one would surely make you proficient; yet you have a faint sense that if these rules were applied to the matters before you, a simpler method of calculation might be found."
 WJ_yinshi.1007.a:0 "Work through it from the start, mastering the basic methods."
 WJ_yinshi.1007.b:0 "Apply it to real matters and seek a new method."
 WJ_yinshi.1008.t:0 "Watching the Stars, Recording the Calendar"
 WJ_yinshi.1008.desc:0 "Night after clear night the stars have been especially distinct. Comparing them with the almanac at hand, you notice that the solar terms it records differ from what you see by a day or two. The calendar governs the farming seasons and the sacrifices and has always been the charge of the Grand Astrologer; a recluse in the mountains need not concern himself with it. But if the discrepancy is real, the villagers' sowing could be off by several days.\n\nThe night wind has already turned cool. To find where the error lies, you would have to keep watch beneath the stars for several nights running and do the calculations yourself."
 WJ_yinshi.1008.a:0 "First copy out the almanac and keep it for later verification."
 WJ_yinshi.1008.b:0 "Observe night after night and calculate to find the truth."
 WJ_yinshi.2001.t:0 "Learning at the Field Ridge"
 WJ_yinshi.2001.desc:0 "Walking to the edge of the fields early in the morning, you see that the seedlings on the same slope grow tall in some places and short in others. When the villagers speak of the color of the soil, the sunlight and where the rainwater runs, the words they use appear in none of the texts you know so well, yet their judgments often hit the mark. Only by asking carefully do you learn that your old vague phrase about following the seasons must, among the furrows, be broken down into many different labors.\n\nIf you record what you heard today in order, and come back to look again in different weather, you might leave behind a trustworthy set of farming notes. If you borrow a small poor plot and plant it yourself, you might tell which received wisdom applies only elsewhere, though a whole season's harvest would ride on it. With mud clinging to your shoes, you are unwilling to go home and forget these words as idle chatter."
 WJ_yinshi.2001.a:0 "Stay in the fields and first record what the villagers say."
 WJ_yinshi.2001.b:0 "Borrow a plot to plant and test new methods yourself."
 WJ_yinshi.2002.t:0 "Gathering Herbs, Learning Plants"
 WJ_yinshi.2002.desc:0 "An old herb gatherer from behind the mountain often passes your house with a bamboo basket on his back. Today he stops to ask for water, and you cannot name most of the leaves in his basket. The old man explains which one brings down fever, which can only be used as medicine once dried, and which looks similar but does harm; he speaks with assurance, yet cannot say in which book any of it is written.\n\nOnce he has finished his water he will head back up the mountain. The few plants in his basket still carry the dew, and whether the properties recorded in the ancient books agree with the old man's words can only be known by tasting them yourself."
 WJ_yinshi.2002.a:0 "Follow the old man up the mountain, observing and taking notes."
 WJ_yinshi.2002.b:0 "Bring the herbs home and taste them yourself according to the books."
 WJ_yinshi.2003.t:0 "Another History on the Back of the Page"
 WJ_yinshi.2003.desc:0 "While trimming old paper, you find a few lines of daily records on the back of a page of the classics: on such a day grain was borrowed, on such a day returned, and a complaint that long rains made the roads impassable. The handwriting is hasty, plainly not written to leave a name. If you trimmed the torn edges as usual, these scattered little characters would be the first to vanish; yet they let you glimpse a stretch of days beyond the neat text on the front.\n\nIf you preserve the whole page and merely note in the catalog that it bears miscellaneous notes, later readers can still judge the hand and the order for themselves. To trace when and by whom these notes were written, you would have to go through every old chest and compare handwriting, while guarding against inventing a whole life story from a few lines. You stop your trimming hand, unwilling any longer to treat the nameless as worthless."
 WJ_yinshi.2003.a:0 "Preserve it as it is, recording front and back alike."
 WJ_yinshi.2003.b:0 "Trace its origins and determine its date."
 WJ_yinshi.2004.t:0 "Gazetteers of Mountains and Rivers"
 WJ_yinshi.2004.desc:0 "Reading a gazetteer, you notice that its account of the waterways does not match what the villagers say: the book says a certain river flows east into the Yellow River, while the villagers say it changed course long ago and now runs south into another stream. Gazetteers are mostly copied from earlier works, and few of their authors walked the ground themselves.\n\nCopy the accounts of several gazetteers side by side, and their differences will show; but which is right can only be known if someone walks along the waterway for several days. The mountain paths are rugged, and the stream banks have many treacherous spots."
 WJ_yinshi.2004.a:0 "Compile the gazetteers and note their differences."
 WJ_yinshi.2004.b:0 "Follow the river on foot and verify its course yourself."
 WJ_yinshi.2005.t:0 "Asking After an Illness"
 WJ_yinshi.2005.desc:0 "The neighbor's child has had a fever for several days that will not break. The family cannot afford a physician and come to ask whether your books contain a remedy. You have read a few medical classics but have never diagnosed anyone. What the medical texts say of yin and yang, exterior and interior, offers no clear place to begin when faced with a burning child.\n\nThe child's mother stands at the door, her eyes full of hope. You know the words in books may not be reliable, yet the distant physician cannot be fetched in time."
 WJ_yinshi.2005.a:0 "Look up the medical classics and urge them to send for a physician."
 WJ_yinshi.2005.b:0 "Go and examine the child yourself and try a prescription."
 WJ_yinshi.2006.t:0 "The Woodcutters' Path Rerouted"
 WJ_yinshi.2006.desc:0 "A stretch of the familiar mountain path has been washed out by the rain, tree roots showing beneath the loosened earth. Those who know the way can still get around it, but porters with loads must spend much more effort. Some propose cutting a new shortcut; others say the new route would cross low ground prone to flooding. Walking along the slope yourself, you find that a route that looks shorter on paper does not necessarily save effort underfoot.\n\nInspecting the drainage and footholds along the old path and first marking the dangerous stretches would preserve the way everyone knows, though it would still need checking after each rain. Walking both new routes and recording how they differ in fair weather and foul might reveal a better road, though rushing about the mountains will mean some hardship. Returning with your shoes soaked through, you understand more than when you set out."
 WJ_yinshi.2006.a:0 "Inspect the old path closely and mark the dangerous spots."
 WJ_yinshi.2006.b:0 "Walk every new route and settle on one way."
 WJ_yinshi.2007.t:0 "Discussing the Mysteries"
 WJ_yinshi.2007.desc:0 "A wandering Daoist asks to lodge for the night and sits with you after dark. He says nothing of talismans or elixirs, only asks how far you have read in the Laozi and the Zhuangzi. You share a few of your everyday insights, and he laughs that those are only words from the books.\n\nThe lamp wick sputters. The Daoist strokes his beard in silence, as though waiting for you to say something more."
 WJ_yinshi.2007.a:0 "Hear him out for what it is worth; each reads his own books."
 WJ_yinshi.2007.b:0 "Set aside your preconceptions and debate the Way with him all night."
 WJ_yinshi.2007.c:0 "Gain or loss is up to him; listen with calm."
 WJ_yinshi.2008.t:0 "Self-Reflection"
 WJ_yinshi.2008.desc:0 "Kept indoors by the rain, you leaf through a few pages of the journal you wrote last year. Some of it reads as childish now; some matters you thought you had worked out then still trouble you today. You withdrew to read, yet the more you read, the more you feel your own temperament is harder to unravel than any problem in the books.\n\nThe rain does not let up. The book still lies open on the desk, but the ink in the inkstone has already dried."
 WJ_yinshi.2008.a:0 "Keep reading as usual; no need to dig deeper."
 WJ_yinshi.2008.b:0 "Shut the door for several days and write down everything on your mind."
 WJ_yinshi.2008.c:0 "Calm and composed, see your true self."
 WJ_yinshi.3001.t:0 "A Village Dispute Before the Humble Gate"
 WJ_yinshi.3001.desc:0 "Two village households come to your gate with the elders of each family, unable to settle which should draw first from a shared watercourse. One side holds to an old agreement; the other says the crops in their fields can wait no longer. Unwilling to go to the authorities first, they say that you are a man of learning with no grudge against either family, and hope you will judge fairly.\n\nYou hold no official seal and cannot decide cases for the county. But if you turn them away with the words 'a recluse does not meddle in worldly affairs,' where then does your so-called local renown truly rest?"
 WJ_yinshi.3001.a:0 "Invite the village elders to deliberate together, without overstepping."
 WJ_yinshi.3001.b:0 "Examine the old agreement and judge right and wrong yourself."
 WJ_yinshi.3001.c:0 "Abide by the agreement with fairness, favoring neither side."
 WJ_yinshi.3002.t:0 "Young Pupils at the Door"
 WJ_yinshi.3002.desc:0 "Several village youths come to your gate together, bringing not tuition gifts of dried meat but a stack of spoiled writing practice. They know some common characters, yet when reading short passages they often break the sentences in the wrong places. Their leader asks whether, if they must still help with the family's work by day, they can never learn the classics. Looking at the ink stains on their fingers, you recall how long passages once daunted you when you first began to study.\n\nFollowing the old teaching methods, explaining one classic character by character, would give a solid foundation, but few may persevere through such long lessons. If you first teach them phrases useful in letters and contracts, their reading would soon help at home, but it might also stop at handling the matters before them. The footsteps outside the gate have not yet dispersed; what beginning will you give them?"
 WJ_yinshi.3002.a:0 "First teach everyday writing, applying learning to practice."
 WJ_yinshi.3002.b:0 "Teach the classics, starting from sentence punctuation."
 WJ_yinshi.3003.t:0 "Giving Way at the Ferry"
 WJ_yinshi.3003.desc:0 "As you pass the ferry crossing, several travelers are quarreling over who should go first. Those laden with goods say they cannot wait long; those with far to go say they cannot travel after dusk; and someone who has long been waiting on the bank never manages to get a word in. No one is willing to admit first to taking advantage, and the more they argue, the more a small matter turns into a question of character. Standing to one side, you suddenly feel that the word 'courtesy' from the books must find a footing here too.\n\nOrdering them by when they reached the bank is the clearest method, and gives those who are not good with words something to rely on; first attending to those truly in urgent need may be closer to compassion, but the reasons must be made clear, lest everyone claim to be in a hurry. Homing birds are already skimming the water; any further delay and no one will get across."
 WJ_yinshi.3003.a:0 "By order of arrival, each keeps their place."
 WJ_yinshi.3003.b:0 "Ask first about urgent need, and speak for those who do not speak."
 WJ_yinshi.3004.t:0 "A Debate on Funerals"
 WJ_yinshi.3004.desc:0 "People in the village are discussing funerals: of late several families have vied to provide lavish coffins, and even the poor fear being called unfilial. Others cite the ancients' words on frugal burial and urge simplicity in every case. The debate has not arisen from any mourning in your house, yet someone still asks you to write a few words for guidance. Leafing through the ritual texts, you find they detail every ceremony, yet never weigh the livelihood of each household.\n\nIf you speak plainly of the evils of lavish burial, you might lift a burden from struggling families, but it could easily be called making light of family affection. If you distinguish between grief and reverence on the one hand and the funerary goods on the other, letting each family perform the rites as its means allow, your words would be more balanced, but those fond of extravagance might borrow them to excuse old habits. Unwilling to build your arguments on other people's grief, you can only weigh every word more carefully."
 WJ_yinshi.3004.a:0 "Distinguish the spirit of the rites from the goods, suiting each family."
 WJ_yinshi.3004.b:0 "Speak plainly of the harms of lavish burial and urge simplicity."
 WJ_yinshi.3005.t:0 "Orderly Relief in Need"
 WJ_yinshi.3005.desc:0 "With the roads muddy for days on end, several households have run short of firewood and grain. It is not that no one in the village is willing to help; rather, each has heard a different account, so some are looked after again and again, while others are too ashamed to speak up and are remembered only when a neighbor happens to mention them. Listening to those who sit under your eaves asking for advice, you realize that what is lacking here is not simply generosity.\n\nAsking household by household who most urgently needs help, and then agreeing on visits in turn, would leave fewer gaps, but it would require great care so that hardship does not become village gossip. Asking only the close neighbors who know each family to keep in touch privately would better spare people's dignity, though what each knows may be incomplete. An order can be drawn up on paper, but people's hearts cannot be tallied as easily as numbers."
 WJ_yinshi.3005.a:0 "Have close neighbors call privately, so none need ask in public."
 WJ_yinshi.3005.b:0 "Gather the villagers to agree on an order for giving relief."
 WJ_yinshi.3005.c:0 "First open your own granary to relieve their need."
 WJ_yinshi.3006.t:0 "A Foot by the Fence"
 WJ_yinshi.3006.desc:0 "While clearing weeds along the fence, you find a clump of new bamboo growing between two old boundary markers. The neighbors disagree: some take the tree roots as the boundary, others remember only where a path ran many years ago. The bamboo shoots are worth little now, but what is at stake is what should serve as the standard from here on. You could shut your gate and ignore it, but if you merely urge everyone to be generous, today's vagueness will grow back again next year.\n\nExamining the old markers and the lay of the land together, first recording the boundaries that can be confirmed and leaving the uncertain parts for joint discussion, would reduce future disputes, though some gaps would remain for now. If you first agree on how the strip by the fence may be walked and used in common, without yet arguing over whose foot of land it is, neighborly feeling might be easier to preserve, but such a convenient arrangement would need to be remembered by everyone for a long time."
 WJ_yinshi.3006.a:0 "First agree on shared use by the fence; let no petty quarrel harm neighbors."
 WJ_yinshi.3006.b:0 "Examine the old markers and terrain together to settle the boundary."
 WJ_yinshi.3007.t:0 "A Village School"
 WJ_yinshi.3007.desc:0 "The village has begun to discuss borrowing an empty house where the youths can study together, but the difficulty is not whether there are books. Each family wants different texts taught: some value literacy and letter writing, some insist on the classics first, and others worry that lessons interrupted in the busy farming season will only earn the children a name for idleness. Having heard everyone out, you realize that even a small schoolroom carries many different hopes.\n\nChoosing short passages everyone can use, and agreeing to read together in slack times and review separately in busy ones, would make it easier to begin, though it may not let those with time to spare read deeply. Dividing them into several seats by level, with the more advanced leading beginners in recitation, would serve both fast and slow learners, so long as one guards against rank in class turning into contempt among the children. Books may be divided into volumes, but people should not be ranked high and low by how early they started."
 WJ_yinshi.3007.a:0 "First set short lessons that every family can follow."
 WJ_yinshi.3007.b:0 "Run the village school yourself and teach by level."
 WJ_yinshi.3008.t:0 "At the Village Feast"
 WJ_yinshi.3008.desc:0 "At a gathering of the village altar society, someone presses drinks on the guests according to old custom, saying that not to drain one's cup is to slight village fellowship. It is not that you dislike sitting with others, but you see several poor drinkers forcing themselves to keep up, their smiles growing strained. If you rise and leave now, others might take a man cultivating renown for an aloof guest unwilling to be close to his village; yet to go along and press drinks with the crowd would go against what you see.\n\nStaying at the table to talk of the farming seasons and old tales, using the conversation to ease the urging, might let everyone find another way of being together without giving offense. Saying openly that capacities differ and closeness should not be measured in cups would make the point clearer, but it would also embarrass those who hold to the old custom for a moment. The wine in the cup has not yet cooled; you wish to be close to people, but you will not call coercion courtesy."
 WJ_yinshi.3008.a:0 "Stay and chat about village affairs, gently easing the urging."
 WJ_yinshi.3008.b:0 "Say plainly that closeness is not measured in cups; let each drink as they can."
 WJ_yinshi.3008.c:0 "Raise a cup and share the joy; let the whole table be merry."
 WJ_yinshi.4001.t:0 "A Letter in the Evening Rain"
 WJ_yinshi.4001.desc:0 "In the evening rain, a traveler brings a letter from [wj_yinshi_friend.GetName]. The first half tells of life since you parted; the second speaks of the difficulty of advancing or withdrawing: following the crowd may not bring peace of mind, yet standing alone risks losing those who understand you. At the end, it only asks what you have been reading in the mountains of late.\n\nYou read the letter twice. Your old friend does not lack grand principles; they only want to know whether one who once sat beside them debating learning will still listen seriously. Should your reply discuss the affairs of the world, or first urge them to take care of themselves?"
 WJ_yinshi.4001.a:0 "First recall old friendship and urge them to take care."
 WJ_yinshi.4001.b:0 "Answer the questions in full; between true friends nothing is withheld."
 WJ_yinshi.4002.t:0 "A Note Left at the Wicker Gate"
 WJ_yinshi.4002.desc:0 "Following a path you remember from the old days to visit [wj_yinshi_friend.GetName], you arrive to find the wicker gate ajar, freshly washed cloth hanging in the courtyard, and the ashes in the stove long cold. Asking over the fence, you learn only that they are out and not yet back. All the things you meant to say on the way, from a point of the classics to what you saw on the road, now hang suspended in your mind. As the mountains darken, waiting seems to become part of the journey.\n\nLeaving a short note by the gate setting out your most pressing questions, then finding lodging nearby to await their return, might let you talk it all through; or you could leave only a word of greeting and go, saving the long conversation for the next meeting. Paper can hold long arguments, but not necessarily the hesitations, pauses and knowing smiles of conversation."
 WJ_yinshi.4002.a:0 "Leave a word of greeting; the long talk can wait for another day."
 WJ_yinshi.4002.b:0 "Leave a note with your questions and wait for [wj_yinshi_friend.GetFirstName] to return."
 WJ_yinshi.4003.t:0 "A Request from an Old Friend"
 WJ_yinshi.4003.desc:0 "A letter that has passed through many hands asks you to write a preface for an essay. Its writer, [wj_yinshi_friend.GetName], is an old acquaintance, and the essay praises your pure reputation at length, so it is hard to read without being moved. Yet looking closely at the enclosed work, several of its judgments are one-sided, and it presents rumors as established fact. You know that once your name stands at the head of the scroll, others may not be able to tell whether you are praising the friendship or the views.\n\nPolitely declining the preface and writing out your reservations in detail would uphold your own judgment, but might make your friend feel you are flaunting your learning. Writing the preface anyway, speaking only of the essay's merits while making your reservations clear, might preserve the old friendship, but readers may skip over those reservations. Being free to write at leisure in the mountains does not mean every stroke can satisfy both sides."
 WJ_yinshi.4003.a:0 "Write the preface, stating plainly what is open to question."
 WJ_yinshi.4003.b:0 "Decline the preface and reply with a detailed discussion."
 WJ_yinshi.4003.c:0 "Point out its faults frankly; say nothing you do not mean."
 WJ_yinshi.4004.t:0 "The Book Loan Deadline"
 WJ_yinshi.4004.desc:0 "The book you lent to [wj_yinshi_friend.GetName] has not been returned past the agreed date, leaving two citations missing from the notes you are writing. Remembering how earnestly they asked to borrow it, you are unwilling to suspect them lightly; but the mountain roads are winding, and with the slightest slip in a verbal message, a scroll can easily be forgotten somewhere. If everyone borrowed on mere goodwill of the moment, even the richest library could not sustain lending for long.\n\nWriting to ask for its return and explaining your urgent need would keep to the agreement and let them know the delay truly inconveniences you, but a tone even slightly too stern might harm the goodwill of lending. Borrowing another copy for now to continue your collation, and setting a new return date with them, would ease matters for the moment, yet deadlines must not thereby become empty words. You take out the old loan note and rewrite the reproachful sentences again and again."
 WJ_yinshi.4004.a:0 "Borrow another copy to continue, and set a new return date."
 WJ_yinshi.4004.b:0 "Explain your urgent need and ask [wj_yinshi_friend.GetFirstName] to return it as agreed."
 WJ_yinshi.4005.t:0 "Pure Repute and an Old Acquaintance"
 WJ_yinshi.4005.desc:0 "Someone advises you to have less to do with [wj_yinshi_friend.GetName], saying this person has lately attached themselves to the powerful and their reputation is not what it was. What you know, however, are only a few small things from your early years together; you can neither vouch for their present conduct nor take village talk as something seen with your own eyes. Since you shut your gate, the world's affairs always reach you through layers of hearsay, and judgments on integrity are precisely those that most press one to take a stand.\n\nWriting first to ask, frankly stating what you have heard and what you doubt, would at least give your old friend a chance to explain, though outsiders might see it as covering for them. Holding off contact for now without joining the crowd's judgment would keep your own sense of measure, but might mean failing a friend's duty just when they most need frank words. You leave the unfinished salutation at the top of the page, feeling that what is truly hard to keep is not being rash."
 WJ_yinshi.4005.a:0 "Let the letters rest for now; send no words not yet made clear."
 WJ_yinshi.4005.b:0 "Write and ask plainly, and have it made clear."
 WJ_yinshi.4006.t:0 "A Broken String Among Friends"
 WJ_yinshi.4006.desc:0 "When [wj_yinshi_friend.GetName] came to call, you had just taken your long-neglected qin from its cloth bag. You had played only a few notes when an old string slackened and snapped. [wj_yinshi_friend.GetFirstName] laughed that the visit was ill-timed, then admitted to not having touched a qin in a long while either. A wind blew outside the window and the broken note scattered quickly, yet beneath your fingers lingered the mood of the unfinished tune.\n\nThere are spare strings on the desk, and the old scores lie pressed beneath your books; but the faint echo left by that broken string circles in both your hearts and will not fade."
 WJ_yinshi.4006.a:0 "Restring the qin together and recover the old tune."
 WJ_yinshi.4006.b:0 "Follow the lingering note and play a new piece together on the spot."
 WJ_yinshi.4007.t:0 "Pure Conversation in the Bamboo Grove"
 WJ_yinshi.4007.desc:0 "Several friends have agreed to sit awhile at the edge of the bamboo grove, and [wj_yinshi_friend.GetName] is among them. The talk runs from a line of the Classics to the state of the times, then from the times back to whether human nature is good or evil, drifting ever further afield. Some speak with sharp wit; others only smile and say nothing. When your turn comes, everyone falls quiet.\n\nYou have indeed reached some insights of late and kept them to yourself for a long time; but once you open your mouth, the course of this gathering may no longer be anyone else's to steer."
 WJ_yinshi.4007.a:0 "Listen to the others and add a word now and then."
 WJ_yinshi.4007.b:0 "Take up the thread and lead the gathering."
 WJ_yinshi.4008.t:0 "Visiting a Friend on a Snowy Night"
 WJ_yinshi.4008.desc:0 "A heavy snow fell in the night, and when you push open the window the whole countryside lies white. You are suddenly seized by the wish to see [wj_yinshi_friend.GetName] and talk together by the brazier. But the snow is deep and the road long; set out now and it will likely be dawn before you arrive, and your friend may not be at home, nor glad of company.\n\nThe brazier is dying, yet the glow of the snow outside is too bright for sleep."
 WJ_yinshi.4008.a:0 "Write a letter and arrange to meet when the snow clears."
 WJ_yinshi.4008.b:0 "Go on a whim and decide at the gate."
 WJ_yinshi.5001.t:0 "A Summons at the Humble Gate"
 WJ_yinshi.5001.desc:0 "The courtyard is still damp from last night's rain when a carriage halts outside the gate. The envoy brushes the dust from his robes and presents a letter of summons from [actor.GetName]: a post awaits you in the household, and you are invited to leave the hills and help deliberate its affairs. The letter makes no display of rank or salary; it says only that the realm is not yet at peace, and that men of learning ought to bear their share.\n\nYou set the letter on your desk and give no answer for a long while. A closed door can preserve your own aims, but it cannot keep the affairs of the world outside it. Answering the summons may let you put your learning to some use, but from then on you must also bear the patronage and trust of the one who called you. The envoy still waits below the steps for you to write your reply."
 WJ_yinshi.5001.a:0 "Pack up your books and follow the envoy to the household."
 WJ_yinshi.5001.b:0 "Respectfully decline the favor; you cannot leave the hills."
 WJ_yinshi.5002.t:0 "Local Opinion Reaches the Commandery"
 WJ_yinshi.5002.desc:0 "The village elder who came to call says that, though you seldom attend banquets, your name has already spread through local talk. Some praise your integrity; others say that a son of a great family, raised up by his neighbors, must in the end do something for them. Now [actor.GetName] wishes on this basis to nominate you as Filial and Incorrupt and recommend you to [actor.GetTopLiege.GetPrimaryTitle.GetNameNoTier].\n\nThe nomination lies before you, its last line awaiting your answer. Accepting it does not mean donning your sash and taking office at once; but once this local judgment is set beneath your name, your words and deeds will no longer be your family's business alone."
 WJ_yinshi.5002.a:0 "Accept the local nomination and leave the hills."
 WJ_yinshi.5002.b:0 "My virtue is still wanting; please nominate another worthy."
 WJ_yinshi.5003.t:0 "Statecraft Is Studied in the Hills Too"
 WJ_yinshi.5003.desc:0 "The letter from [actor.GetName] lies atop an old volume of commentary. It mentions your recent opinions, saying that the hills and forests do not lack men who understand the times, and offers to recommend you as Flourishing Talent. Its few words of praise happen to touch on precisely the views you thought no one had noticed.\n\nYou never wished to seek advancement through your writings, yet neither did you believe your learning must stay in the study. To accept the recommendation is to admit that such learning may still serve the world; as for when to take office and whom to serve, you must still choose with care."
 WJ_yinshi.5003.a:0 "Accept the recommendation and leave the hills."
 WJ_yinshi.5003.b:0 "My name outruns my merit; I dare not step ahead of others."
 WJ_yinshi_invite_lapsed_tt:0 "The letter's promise has come to nothing, but you leave the hills all the same."
 WJ_yinshi.5101.t:0 "A Patent of Office Arrives"
 WJ_yinshi.5101.desc:0 "The document the envoy brings is plain enough: an office has been added to your name, and you are urged to take up the post at once. Hearing the news, the villagers come to offer congratulations, saying a recluse must come out to serve in the end. You look at the unfinished book on your desk and for a moment do not know which to set down first.\n\nAccept this office and you leave the hills; your days will no longer be yours alone. Decline it, and the seal and ribbon go back sealed and untouched, and you go on living your life in the hills."
 WJ_yinshi.5101.a:0 "Accept the charge, leave the hills, and prove worthy of the trust."
 WJ_yinshi.5101.b:0 "Decline the office and return the seal and ribbon."
