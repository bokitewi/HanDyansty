 WJ_langguan_xuncha.0001.a:0 "Put the ceremonial escort in order and inspect the whole region."
 WJ_langguan_xuncha.0001.desc:0 "I lead my subordinate officials out of the city on an inspection tour. Officials and commoners line the road to greet me."
 WJ_langguan_xuncha.0001.t:0 "Langguan Tour: Inspection"
 WJ_langguan_xuncha.0002.a:0 "Take the bench, hear the cases, and judge right from wrong."
 WJ_langguan_xuncha.0002.desc:0 "Unresolved cases fill the county office, while officials and commoners argue endlessly over their disputes."
 WJ_langguan_xuncha.0002.t:0 "Langguan Tour: Hearing Cases"
 WJ_langguan_xuncha.0003.a:0 "Visit the poor, hear their hardships, and learn how the people live."
 WJ_langguan_xuncha.0003.desc:0 "The old farmers in the fields and the peddlers in the markets each have their joys and sorrows."
 WJ_langguan_xuncha.0003.t:0 "Langguan Tour: Hearing the People"
 WJ_langguan_xuncha.0100.a:0 "This tour has taught me much."
 WJ_langguan_xuncha.0100.desc:0 "After months on the road, I am growing more familiar with administration, and my reputation for worth continues to rise."
 WJ_langguan_xuncha.0100.t:0 "Langguan Tour: Return to the Bureau"
 WJ_recommendation_reply.0001.a:0 "Good; the court shall gain a worthy man."
 WJ_recommendation_reply.0001.t:0 "Reply on the Filial and Incorrupt Nomination"
 WJ_recommendation_reply.0002.a:0 "Everyone has their own ambitions. I shall choose another worthy candidate."
 WJ_recommendation_reply.0002.desc:0 "I have read your letter nominating me as Filial and Incorrupt, my lord, and I am deeply grateful. Yet I cannot accept this time, and write formally so that you may know without delay.\n\nIt was not easy to put my refusal into words. I know how hard such a nomination is to obtain. But if gratitude led me to accept now, only for hesitation to cause my sponsor further trouble later, I would betray your trust all the more. Please leave my name off the nomination and choose another worthy candidate.\n\nThough I cannot accept, I shall always remember your recognition. I send this reply with respect and hope you will not take my refusal to heart."
 WJ_recommendation_reply.0002.t:0 "Reply on the Filial and Incorrupt Nomination"
 WJ_recommendation_reply.0101.a:0 "I humbly thank you for your regard."
 WJ_recommendation_reply.0101.t:0 "Reply to a Request for Filial and Incorrupt Nomination"
 WJ_recommendation_reply.0102.a:0 "I must wait for another opportunity."
 WJ_recommendation_reply.0102.desc:0 "I have read your request carefully. I cannot nominate [secondary_actor.Custom('WJ_GetLinkedUIName')] as Filial and Incorrupt this year. I write plainly and hope you will not take this as a slight.\n\nWhen asked a favor, it is easy to offer a few words that leave room for hope. But the candidate has placed his hopes of entering office in this nomination. If I delayed giving a clear answer, I would only keep him waiting in vain. I cannot endorse him at present, and would rather say so before the nomination is settled.\n\nPlease let the matter rest here. If another opportunity arises, we may discuss it again."
 WJ_recommendation_reply.0102.t:0 "Reply to a Request for Filial and Incorrupt Nomination"
 WJ_recommendation_reply.0201.a:0 "This nomination should justify the public's confidence."
 WJ_recommendation_reply.0201.desc:0 "You have honored me with a nomination as Flourishing Talent, my lord, and I accept. After reading your letter, the matters I once only pondered at my desk suddenly seem ready to be put to the test.\n\nIt is easy to discuss government at leisure. Only when entrusted with affairs can one discover what one's learning is worth. I cannot boast that a single letter of recommendation equips me to handle everything, but endless refusals would also betray the confidence you have shown in me.\n\nI understand everything we discussed and shall keep my promises. I send this letter to confirm my acceptance. In the years ahead, I shall repay your recognition with achievements in office, so that your nominee offers more than a fine reputation."
 WJ_recommendation_reply.0201.t:0 "Reply on the Flourishing Talent Nomination"
 WJ_recommendation_reply.0202.a:0 "Then I shall seek another worthy candidate."
 WJ_recommendation_reply.0202.desc:0 "I have received your letter offering to nominate me as Flourishing Talent, my lord, and I shall not forget your kindness. Yet I cannot accept this time. I write to decline now, so that no place on the nomination is held open for me.\n\nIt is a joy to be recommended, and I hesitated many times before putting my refusal to paper. But I cannot yet commit myself to the duty. I should not accept the distinction first and look for excuses to withdraw later. I have no wish to disappoint you.\n\nPlease choose someone else for the nomination. Though I cannot accept, I remain grateful for the confidence you have placed in me."
 WJ_recommendation_reply.0202.t:0 "Reply on the Flourishing Talent Nomination"
 WJ_recommendation_reply.0301.a:0 "I humbly thank my sponsor."
 WJ_recommendation_reply.0301.desc:0 "I have read your request. I shall nominate [secondary_actor.Custom('WJ_GetLinkedUIName')] as Flourishing Talent this year. My decision is made; there is no need to wait.\n\nRecommending someone to the court also puts my own judgment on trial. I offer this endorsement in the hope that he will have room to use his talents. When I next hear his name, I hope to hear of real achievements in office, as well as his reputation for ability.\n\nEverything we discussed will proceed as agreed. Please convey my consent, and this hope as well: today I have opened a door for him. How far he goes beyond it must depend on his own steps."
 WJ_recommendation_reply.0301.t:0 "Reply to a Request for Flourishing Talent Nomination"
 WJ_recommendation_reply.0302.a:0 "I must seek another sponsor."
 WJ_recommendation_reply.0302.desc:0 "I have considered your request for a Flourishing Talent nomination. I cannot nominate [secondary_actor.Custom('WJ_GetLinkedUIName')] this year, and write to make that clear.\n\nI heard your messenger's earnest arguments, but they have not persuaded me to sign a recommendation. If I promised to discuss the matter again and let you all keep pursuing it, only to disappoint you later, it would do more harm to our friendship. Since I cannot agree, I should not delay my answer to avoid refusing.\n\nLet the matter end here. Please wait no longer for this year's recommendation. I appreciate your kindness."
 WJ_recommendation_reply.0302.t:0 "Reply to a Request for Flourishing Talent Nomination"
 wj_temp_official.1000.a:0 "Cross-check every entry and point out the contradictions."
 wj_temp_official.1000.b:0 "Follow the standard checks and report only confirmed errors."
 wj_temp_official.1000.desc:0 "[wj_assessment_examiner.Custom('WJ_GetLinkedUIName')] pushes an account register toward me. There is no question about the art of governing: I am simply asked to examine the figures for households, land rent, and stored grain.\n\nAfter a few pages, I notice several discrepancies. Cross-checking every entry might uncover errors someone has deliberately concealed, but a mistaken judgment could expose lapses in my own work. Following the usual checks would leave less room for error, but would hardly earn an outstanding assessment.\n\nThe examiner does not hurry me, but a brush lies ready beside the desk. I must submit findings I truly understand. A few empty words about good government will not suffice."
 wj_temp_official.1000.t:0 "Probationary Evaluation: Auditing the Registers"
 wj_temp_official.1001.a:0 "Weigh the priorities and draw up new procedures."
 wj_temp_official.1001.b:0 "Follow established practice: provide relief first, collect taxes afterward."
 wj_temp_official.1001.desc:0 "The account register has barely been taken away when the examiner poses another question. After floods and drought, the granary has little grain left. Many people seek relief loans, and local magnates demand their share first. How would I handle it?\n\nA moment ago, I faced only figures on a page. Now every decision about priority affects different people. New procedures would have to account for the links between relief, tax collection, and public order. Following established practice would be safer, but would earn little more than credit for avoiding mistakes.\n\nI swallow the words \"benevolent government\" before they leave my lips. The examiner does not want a promise to treat the people kindly. When there truly is not enough grain, what would I do first?"
 wj_temp_official.1001.t:0 "Probationary Evaluation: Judgment in Practice"
 wj_temp_official.1002.a:0 "Speak frankly about successes and failures, and set out a plan for reform."
 wj_temp_official.1002.b:0 "Present only established precedent, with no empty words."
 wj_temp_official.1002.desc:0 "The questions on accounts and administration are over, yet [wj_assessment_examiner.Custom('WJ_GetLinkedUIName')] has not put down the brush. \"Tell me about yourself. Since taking up your provisional post, what have you done best, and what most needs to change?\"\n\nThe prepared phrases suddenly stick in my throat. The first two questions allowed me to discuss other counties and imagined disasters. This one can be checked against names and events. A thorough answer might show my ability; a poor one would put the lapses I usually conceal directly into the examiner's hands.\n\nI sit up straight and pause for a breath. Should I follow the usual form and mention only safe matters, or lay out the reforms I have been considering? The examiner's brush hangs in the air, waiting for me to speak."
 wj_temp_official.1002.t:0 "Probationary Evaluation: Reply to the Ministry of Personnel"
 wj_temp_official.1005.a:0 "Respectfully accept the grade and formally enter office."
 wj_temp_official.1005.b:0 "Remember my failings and sit again next year."
 wj_temp_official.1005.desc:0 "The questions on accounts and administration, and my final statement, are all over. The examiner gathers the records of each round, considers my established reputation for worth, and only then hands me my grade.\n\nAnything I might have rescued with words a moment ago is now committed to paper. I look at the assessment and wait for the final word on the future of my provisional appointment.\n\n"
 wj_temp_official.1005.desc_fail:0 "\"Not yet qualified.\" I see those words first, then read the rest: I keep my office for now, continue to serve provisionally, and must be assessed again next year. Every uncertain answer returns to mind, but no one will record a revised answer in my grade now."
 wj_temp_official.1005.desc_good:0 "My grade is Good. My provisional appointment is now confirmed. As I read those words, the anxiety I have carried so long finally eases. The assessment still notes room for improvement, but I can put the result away with satisfaction."
 wj_temp_official.1005.desc_high:0 "My grade is Excellent. My provisional appointment is now confirmed. I read \"Excellent\" twice before noticing that the messenger is still waiting to collect the register. All the words I weighed so carefully before the assessment have finally paid off."
 wj_temp_official.1005.desc_pass:0 "My grade is Pass. My provisional appointment is now confirmed. As I read on, several mistakes still stand out in the assessment, but none has kept me from qualifying. This time, at last, I have passed."
 wj_temp_official.1005.t:0 "Probationary Evaluation: The Final Grade"
