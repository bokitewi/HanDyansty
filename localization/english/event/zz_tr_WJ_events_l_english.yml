l_english:
 WJ_recommendation_reply.0001.desc:0 "You have honored me with a nomination as Filial and Incorrupt, my lord. I write to accept.\n\nWhen your letter arrived, I read it several times before I could believe my name really appeared on the nomination. Until now, I had heard only fragments of what people in the village said of me. Your endorsement brings me great joy, but I know that from now on my words and actions will draw closer attention.\n\nI shall keep every promise we made in our earlier discussions. One letter cannot express my gratitude for your recognition; for now, let me assure you that I gladly accept the nomination."
 WJ_recommendation_reply.0101.desc:0 "I have agreed to your request: this year, I shall nominate [secondary_actor.Custom('WJ_GetLinkedUIName')] as Filial and Incorrupt.\n\nA nomination reflects on the judgment of its sponsor as well as the worth of the candidate. I would not put my name to it lightly. What he makes of this chance, and how he carries out his duties, must ultimately be his own responsibility.\n\nThe other matters we discussed will proceed as agreed. Please tell him that this nomination opens a door for him, and no more."
 WJ_bizhao_reply.0001.a:0 "Good. I welcome your help."
 WJ_bizhao_reply.0001.desc:0 "Your invitation has arrived, and I was delighted to read it. I am grateful for your confidence in me, my lord, and gladly accept a place on your staff. I shall honor all that we have agreed.\n\nUntil now, I have known the work of your office only through other people's accounts. The chance to take part myself brings both apprehension and anticipation. When I arrive, please entrust me with the existing records and unfinished business, so that I can learn my duties quickly and earn my place.\n\nI shall remember your kindness, and spare you further pleasantries. Once we have worked together for a time, you can judge for yourself what use I am."
 WJ_bizhao_reply.0002.a:0 "Then I shall not press you."
 WJ_bizhao_reply.0002.desc:0 "I have received your invitation and read it several times. Your generous offer has moved me deeply. Yet I cannot accept on this occasion. I have been slow to reply because I feared a letter of refusal might seem dismissive.\n\nAfter much thought, I cannot promise to take on duties I am not yet able to fulfill. Your office urgently needs help. If I accepted merely out of courtesy, only to make excuses later, I would let you all down. Please find someone else worthy of the place on your staff; do not leave it vacant for me.\n\nMy inability to serve with you does not lessen my gratitude for the invitation. I hope you will understand, my lord."
 WJ_district.200.desc:0 "The fighting continues, and I write to request your aid, Commander.\n\nOur troops are holding their ground, but I fear that the forces at my disposal cannot cover every front for much longer. I have sent an envoy to explain our needs before we are reduced to a desperate plea for help.\n\nNothing would hearten the men more than your arrival at the head of an army. If other duties keep you away, please send a capable commander from this district. Together, we can exchange intelligence and coordinate our forces. I await your reply."
 WJ_district.200.dispatch:0 "Send another officer to their aid."
 WJ_district.200.personal:0 "I shall lead my own troops to their aid."
 WJ_district.201.desc:0 "Your request for aid has been answered: [SCOPE.sC('wj_dd_target').Custom('WJ_GetLinkedUIName')] has joined your war with their troops.\n\nWaiting without news is hard on an army, so I am sending word now, before there is any result to report. From now on, both forces must share intelligence and coordinate their orders. Each unit should know where the others are, rather than hold its own corner and search for its allies only when the enemy arrives.\n\nWhen to advance or withdraw will depend on the strength of the armies and the routes available. Once you receive this letter, let the reinforcements know what you need as soon as you can."
 WJ_district.202.desc:0 "[SCOPE.sC('wj_dd_beneficiary').Custom('WJ_GetLinkedUIName')] has urgently requested aid. I order you to join their war with your troops.\n\nThey have waited a long time for an answer. Let them know at once that reinforcements are on the way. Keep one another informed about the fighting, the roads, and where your forces will meet. Your armies must do more than share a place in the records; they must know one another when they face the enemy.\n\nAdvance or withdraw as the situation demands. This letter gives you the duty of providing aid; victory or defeat will be decided in the field."
 wj_kaoke_duties.1001.a:0 "Buy grain from my own purse and reassess the stricken households."
 wj_kaoke_duties.1001.a.tt:0 "The commandery should record this as good governance in this year's performance review."
 wj_kaoke_duties.1001.b:0 "Report the disaster in full and request payment in installments."
 wj_kaoke_duties.1001.b.tt:0 "This will be entered in the evaluation register as usual, neither merit nor fault."
 wj_kaoke_duties.1001.c:0 "Enforce the old quota and charge an extra collection fee."
 wj_kaoke_duties.1001.c.tt:0 "A reputation for harsh taxation may count against you at your performance review."
 wj_kaoke_duties.1001.d:0 "Audit the granary records myself and recover the arrears."
 wj_kaoke_duties.1001.d.failure:0 "The arrears proved unrecoverable, and collection fell into disorder"
 wj_kaoke_duties.1001.d.failure.tt:0 "Disorderly collection will be recorded as a fault in your performance review."
 wj_kaoke_duties.1001.d.success:0 "The granary records corroborated one another, and the concealed tax grain was recovered"
 wj_kaoke_duties.1001.d.success.tt:0 "Recovering the arrears can earn you credit at your performance review."
 wj_kaoke_duties.1001.desc:0 "The accounts clerk writes the grain tax due on a wooden tablet. The granary clerk pushes an empty grain measure onto my desk. Spring floods drowned the low fields, and the autumn harvest fell by another tenth. The demands from the higher office insist on the old quota, with no regard for what remains in the fields.\n\nAn assistant proposes dividing the shortfall among the households that have not yet fled. A village elder falls to the ground and tells me that those who covered their neighbors' share last year have already sold their plow oxen this year. The arrears in the granary records go back so far that no one knows how much can still be recovered.\n\nThe space for my signature at the end of the tablet is blank. I can balance the accounts, but there may be no one left to work the fields next year."
 wj_kaoke_duties.1001.t:0 "Full Ledger, Empty Granary"
 wj_kaoke_duties.1002.a:0 "Fund a survey of the fields and reject the guarantee."
 wj_kaoke_duties.1002.a.tt:0 "A clear settlement of the boundaries should earn you credit at your performance review."
 wj_kaoke_duties.1002.b:0 "Seal the boundaries and let the original households farm first."
 wj_kaoke_duties.1002.b.tt:0 "The case is entered in the evaluation register, with neither merit nor fault."
 wj_kaoke_duties.1002.c:0 "Accept their gift and close the case using the new register."
 wj_kaoke_duties.1002.c.tt:0 "Accepting a gift in return for an unjust ruling may be hard to conceal at your performance review."
 wj_kaoke_duties.1002.d:0 "Summon the village head and neighboring farmers to examine their testimony in court."
 wj_kaoke_duties.1002.d.failure:0 "The witnesses recanted, and the village mocked your ruling"
 wj_kaoke_duties.1002.d.failure.tt:0 "Your ruling has become a village joke; a fault will be recorded in your performance review."
 wj_kaoke_duties.1002.d.success:0 "The testimony matched the old deeds, and the powerful family returned the seized fields"
 wj_kaoke_duties.1002.d.success.tt:0 "A clear ruling in court can earn you credit at your performance review."
 wj_kaoke_duties.1002.desc:0 "Several humble households arrive with old deeds to lodge a complaint. A powerful local family has moved the boundary stones and absorbed their fields into its estate. The new register submitted by the family bears all the proper seals, but the clerk who wrote it is related to them by marriage. There are no swords or soldiers in the case files, yet no one dares sow the disputed fields.\n\nMy registrar quietly points out that the family's written guarantee carries the signatures of several local notables. None can be turned away lightly. The old deeds survive, but without the village head and neighboring farmers testifying in court, the boundaries will be hard to establish.\n\nThe family offers to stop work while the boundary is discussed, and has prepared a gift as well. The households ask just one question: will they be able to return to their own fields next year?"
 wj_kaoke_duties.1002.t:0 "Between the Field Boundaries"
 wj_kaoke_duties.1003.a:0 "Advance the money for transport and set the schedule myself."
 wj_kaoke_duties.1003.a.tt:0 "Keeping the relay roads running smoothly should earn you credit at your performance review."
 wj_kaoke_duties.1003.b:0 "Handle the urgent duties first and request a delay for the rest."
 wj_kaoke_duties.1003.b.tt:0 "This will be entered in the evaluation register as usual, neither merit nor fault."
 wj_kaoke_duties.1003.c:0 "Call up the full labor quota and charge fees for exemptions."
 wj_kaoke_duties.1003.c.tt:0 "Extra labor demands and fees may count against you at your performance review."
 wj_kaoke_duties.1003.d:0 "Go to the relay stations myself and organize crew rotations at each stage."
 wj_kaoke_duties.1003.d.failure:0 "The handovers ran late, men and horses were exhausted, and order along the route broke down"
 wj_kaoke_duties.1003.d.failure.tt:0 "Missing the deadline will be recorded as a fault in your performance review."
 wj_kaoke_duties.1003.d.success:0 "Men and horses changed over smoothly, and the urgent assignments were completed on time"
 wj_kaoke_duties.1003.d.success.tt:0 "Sound coordination can earn you credit at your performance review."
 wj_kaoke_duties.1003.desc:0 "The relay clerk brings me three urgent dispatches: one demanding the shipment of grain and goods held in the official storehouses, another calling for a carriage relay, and a third demanding laborers along the route. The deadlines crowd together, and the relay horses are thin enough for their bones to show. The farmers are busy in the fields. Take another group of able-bodied men away, and this season's harvest will suffer.\n\nThe senior clerk counts the choices on his fingers. Hiring carts and laborers costs money. Combining assignments and handing loads on from station to station means someone must answer for any delay. Asking which demands can wait means yet more correspondence with the higher office.\n\nOutside the station gate, the men waiting to be sent out have leaned their farm tools against the wall. My signature will decide how many days they spend on the road—and how many days their fields lie untended."
 wj_kaoke_duties.1003.t:0 "No Rest at the Relay Station"
 wj_kaoke.1000.t:0 "The Performance Review: Final Grade"
 wj_kaoke.2000.t:0 "Performance Register: Merits and Faults"
 wj_kaoke.2001.t:0 "Performance Register: Standards of Duty"
 wj_langguan.1000.a:0 "State my view plainly and reason it through the Classics."
 wj_langguan.1000.b:0 "Stick to the established commentaries and avoid risky interpretations."
 wj_langguan.1000.desc:0 "[wj_assessment_examiner.Custom('WJ_GetLinkedUIName')] asks me to explain the Classics and their commentaries, compare differing readings, and use their teachings to judge a difficult case of moral duty. It sounds like a question about the meanings of words, but the real test is whether I can draw on the Classics without being bound by the past."
 wj_langguan.1000.t:0 "Langguan Assessment: Understanding the Classics"
 wj_langguan.1001.a:0 "Weigh the Classics and the law, then explain how I would judge the case."
 wj_langguan.1001.b:0 "Follow precedent and take care to avoid mistakes."
 wj_langguan.1001.desc:0 "The second question turns to the law. Several people are involved in one case, but their culpability differs, and the statutes set out clear rules. The examiner asks me to propose a verdict here and now. I must neither let sympathy override the law nor apply the law at the expense of justice."
 wj_langguan.1001.t:0 "Langguan Assessment: Judgment and the Law"
 wj_langguan.1002.a:0 "Draw on the past and propose a plan to address the crisis."
 wj_langguan.1002.b:0 "Offer only the safest, established measures for relief."
 wj_langguan.1002.desc:0 "The final question calls for a reply to the throne. The examiner sets out a crisis: failed harvests across the commanderies and kingdoms, bandits rising everywhere, and too little money at court. I have only moments to explain what must be done first and what can wait. The hall falls silent. All I hear is the soft clatter of bamboo slips."
 wj_langguan.1002.t:0 "Langguan Assessment: Reply Before the Throne"
 wj_langguan.1005.a:0 "Respectfully accept my grade and leave the bureau."
 wj_langguan.1005.b:0 "Stay in the office to study and try again next year."
 wj_langguan.1005.desc:0 "The three questions are over. The examiner closes the documents and gives me an assessment of my knowledge of the Classics, my understanding of the law, and my reply to the throne."
 wj_langguan.1005.desc_fail:0 "My answers were too rigid in places and failed to grasp the intent of the law in others. I am not yet ready to leave the bureau. The examiner orders me to study for another year and return for assessment next year."
 wj_langguan.1005.desc_good:0 "My answers were clear and orderly, with a few worthwhile new ideas. My assessment is Good: I qualify for formal recognition as Filial and Incorrupt."
 wj_langguan.1005.desc_high:0 "My answers brought together the Classics and the law and addressed the needs of the times. My assessment is Excellent. I can now leave the bureau with my qualifications recognized, and the court has taken note of my name."
 wj_langguan.1005.desc_pass:0 "My answers lacked brilliance, but contained no serious mistakes. My assessment is Pass: I am granted formal recognition as Filial and Incorrupt."
 wj_langguan.1005.t:0 "Langguan Assessment: The Final Grade"
 WJ_zhongwai.0001.a:0 "Receive the insignia, accept the edict, and take command of the armies within and beyond the capital."
 WJ_zhongwai.0001.desc:0 "The edict granting me command of all military affairs within and beyond the capital has been read, yet I am still staring at the insignia before me. Whenever the armies dispute command or fail to support one another, their reports will now land on my desk. I can no longer dismiss them as another office's business.\n\nThe herald pauses, waiting for me to accept the edict. Several people in the hall turn their eyes toward me. Some study my face, others the insignia; I cannot tell what they are weighing. I straighten my robes, already thinking of the military reports that will soon be sent to me.\n\nThis authority comes with the duty of assisting the ruler. It is no private possession for a family to pass on. But for now, I am responsible for coordinating the armies within and beyond the capital. Everyone in the hall must hear my final words clearly: \"Your servant accepts the edict.\""
 WJ_zhongwai.0001.t:0 "An Edict of Supreme Command"
 WJ_zhongwai.0002.a:0 "I respectfully obey the edict."
 WJ_zhongwai.0002.desc:0 "The edict is proclaimed: [wj_zw_holder.Custom('WJ_GetLinkedUIName')] is granted command of all military affairs within and beyond the capital, and the yellow ceremonial axe. Those who were murmuring fall silent. These words draw more attention than the formal courtesies that came before.\n\nAs I listen to the new chain of command, I recall the military reports that used to pass back and forth between offices. From now on, we must learn anew who may give orders and who must seek approval. Documents sent through the old channels may simply be returned.\n\nThe herald reads on, and the faces around me show different reactions. I do not hurry to join the discussion; I commit the name to memory. The next time military business arises, where I must submit my petition will have changed."
