 WJ_langguan_xuncha.0001.a:0 "Set the honor guard in order and tour the four borders."
 WJ_langguan_xuncha.0001.desc:0 "You lead your subordinates out of the city on an inspection tour, and officials and commoners line the road to greet you."
 WJ_langguan_xuncha.0001.t:0 "Gentleman's Tour: Inspection"
 WJ_langguan_xuncha.0002.a:0 "Take the bench, hear the cases, and judge right from wrong."
 WJ_langguan_xuncha.0002.desc:0 "Cases are piled mountain-high in the county office, and the officials and commoners quarrel without end."
 WJ_langguan_xuncha.0002.t:0 "Gentleman's Tour: Judging Cases"
 WJ_langguan_xuncha.0003.a:0 "Visit the poor, ask after their hardships, and learn the people's condition."
 WJ_langguan_xuncha.0003.desc:0 "The old farmers in the fields and the peddlers in the markets each have their joys and sorrows."
 WJ_langguan_xuncha.0003.t:0 "Gentleman's Tour: Asking After the People"
 WJ_langguan_xuncha.0100.a:0 "This tour has taught me much."
 WJ_langguan_xuncha.0100.desc:0 "After months on the road, you have grown familiar with government affairs, and your reputation for worth grows steadily."
 WJ_langguan_xuncha.0100.t:0 "Gentleman's Tour: Return to the Office"
 WJ_recommendation_reply.0001.a:0 "Good; the court shall gain a worthy man."
 WJ_recommendation_reply.0001.t:0 "Reply on the Filial and Incorrupt Nomination"
 WJ_recommendation_reply.0002.a:0 "Each has his own aspirations; another worthy must be chosen."
 WJ_recommendation_reply.0002.desc:0 "I have read your letter nominating me as Filial and Incorrupt, my lord, and your kindness is great indeed. Yet this time I truly dare not accept, and so I reply solemnly, that you may know it early.\n\nWriting the words 'I decline' was not easy, and I know how hard such a place is to come by. But if I accepted on a moment's gratitude, and later my hesitation forced my sponsor into further trouble, I would betray today's trust all the more. Please do not list my name on the nomination; seek another worthy instead.\n\nThough I cannot accept the nomination, I shall always remember your regard. I respectfully inform you of this, and hope you will not trouble yourself over it."
 WJ_recommendation_reply.0002.t:0 "Reply on the Filial and Incorrupt Nomination"
 WJ_recommendation_reply.0101.a:0 "I humbly thank you for your regard."
 WJ_recommendation_reply.0101.t:0 "Reply to a Request for Filial and Incorrupt Nomination"
 WJ_recommendation_reply.0102.a:0 "We can only await another opportunity."
 WJ_recommendation_reply.0102.desc:0 "I have read your request carefully. In this year's selection of the Filial and Incorrupt, I cannot nominate [secondary_actor.Custom('WJ_GetLinkedUIName')]; I reply plainly, and hope you will not take it as a slight.\n\nWhen asked a favor, it is easiest to leave a word of room for maneuver; but since the candidate has pinned his hopes of office on this, if I were slow to speak plainly, I would only keep him waiting in vain. For now I cannot give him this endorsement, and would rather make it clear before the nomination is settled.\n\nPlease let the matter rest here. Should another opportunity arise in future, it may be discussed again."
 WJ_recommendation_reply.0102.t:0 "Reply to a Request for Filial and Incorrupt Nomination"
 WJ_recommendation_reply.0201.a:0 "This nomination shall not betray public opinion."
 WJ_recommendation_reply.0201.desc:0 "Honored by your nomination as Flourishing Talent, my lord, I am willing to accept. Having read your letter, all the matters I once only pondered at my desk suddenly seem to have their chance to be put to the test.\n\nIn ordinary talk of government, one may speak at ease; only when taking up office does one see how much use one's learning truly has. I dare not boast, on the strength of a single letter of recommendation, that I can handle every affair; yet if I only kept declining, I would betray the esteem you have shown me today.\n\nI understand all the matters discussed, and shall keep my word. I respectfully send this letter first, to make clear my acceptance. Your regard I shall repay with achievements in office, so that the man you recommended will not be left with nothing but a fine-sounding name."
 WJ_recommendation_reply.0201.t:0 "Reply on the Flourishing Talent Nomination"
 WJ_recommendation_reply.0202.a:0 "In that case, seek another talent."
 WJ_recommendation_reply.0202.desc:0 "I have received your letter, my lord, offering to nominate me as Flourishing Talent, and I dare not lightly forget such kindness. Yet this time I truly cannot accept, so I write first to decline, lest a place be left empty for me on the nomination.\n\nTo be recommended is a happy thing, and before taking up my brush to refuse, I hesitated again and again. But since I cannot now set my heart on bearing the duty, I should not first take the name and later seek excuses to withdraw. If this disappoints you, my lord, that too is not what I wish.\n\nFor the nomination, please choose another. Though I cannot comply, I shall always be grateful for the generous esteem you offered."
 WJ_recommendation_reply.0202.t:0 "Reply on the Flourishing Talent Nomination"
 WJ_recommendation_reply.0301.a:0 "I humbly thank my sponsor."
 WJ_recommendation_reply.0301.desc:0 "I have read the request. For this year's Flourishing Talent, I am willing to nominate [secondary_actor.Custom('WJ_GetLinkedUIName')]; my mind is made up, and there is no need to wait further.\n\nTo recommend a man to the court is, in the end, to stake one's own judgment along with him. I make this endorsement precisely in the hope that he will have room to show his talents; and when I hear his name in future, I wish to hear not only of his old reputation for talent, but of achievements worth beholding.\n\nAll the matters discussed shall be carried out together. Please convey my consent, and convey too this hope of mine: today I have opened a door for him; how far he goes from here must depend on his own steps."
 WJ_recommendation_reply.0301.t:0 "Reply to a Request for Flourishing Talent Nomination"
 WJ_recommendation_reply.0302.a:0 "We can only seek another sponsor."
 WJ_recommendation_reply.0302.desc:0 "I have considered the request for a Flourishing Talent nomination: this year I cannot nominate [secondary_actor.Custom('WJ_GetLinkedUIName')], and I write to say so plainly.\n\nI heard everything your messenger earnestly set forth, but it is not yet enough for me to put my brush to a letter of recommendation. If I first promised to 'discuss it again', leaving you all to keep running about on this, and later could not make good on it, it would only hurt our friendship more. Since I cannot consent, I should not hide behind a late reply to avoid declining.\n\nLet the matter end here; please do not wait any longer on this year's recommendation. I gratefully accept your kind intentions."
 WJ_recommendation_reply.0302.t:0 "Reply to a Request for Flourishing Talent Nomination"
 wj_temp_official.1000.a:0 "Audit item by item and point straight to the contradictions."
 wj_temp_official.1000.b:0 "Review by the old forms, presenting only certain errors."
 wj_temp_official.1000.desc:0 "[scope:wj_assessment_examiner.Custom('WJ_GetLinkedUIName')] pushes an account register before you. He asks nothing of the art of governing, only that you examine the figures for households, land rent, and granary grain within.\n\nTurning a few pages, you find several places where the figures do not tally. If you audit item by item, you may root out errors someone deliberately concealed, but a misjudgment could instead expose the carelessness of your own daily work; if you merely review by the old forms, you risk fewer mistakes, but will hardly earn a brilliant assessment by it.\n\nThe examiner does not hurry you, but the brush beside the desk is ready. What you submit this round must be something you truly understand; an empty passage on good governance will not get you through."
 wj_temp_official.1000.t:0 "Probationary Evaluation: Auditing the Registers"
 wj_temp_official.1001.a:0 "Weigh what is urgent and draft new regulations."
 wj_temp_official.1001.b:0 "Follow precedent: relief first, levies after."
 wj_temp_official.1001.desc:0 "No sooner is the register taken away than the examiner poses another question: after flood and drought, the granary holds limited grain, many come seeking relief loans, and the local magnates want their share first. How would you handle it?\n\nA moment ago you faced only figures in a register; now every choice of who comes first touches different people. If you draft new regulations, you must weigh the ties between relief, tax collection, and public order; if you hold to precedent, it is safer, but earns you no more than an answer free of error.\n\nYou swallow the words 'benevolent governance' that were on the tip of your tongue. The examiner does not want to hear how kindly you would treat the people, but which thing you would do first when there truly is not enough grain."
 wj_temp_official.1001.t:0 "Probationary Evaluation: Handling Affairs"
 wj_temp_official.1002.a:0 "Speak plainly of gains and losses, and list measures for reform."
 wj_temp_official.1002.b:0 "Present only established precedent, with no empty words."
 wj_temp_official.1002.desc:0 "The questions on registers and on handling affairs are past, yet [scope:wj_assessment_examiner.Custom('WJ_GetLinkedUIName')] does not lay down the brush: 'Tell me about yourself. Since your probation began, what have you done best, and what most needs changing?'\n\nThe stock phrases you prepared suddenly will not come out. The first two questions let you talk of other counties and imagined famines, but this one can be checked down to names and events. Speak deeply and you may show your ability; speak poorly and you hand over with your own hands the oversights you usually keep hidden.\n\nYou sit up straight and pause for a breath. Will you follow the old form and speak only of safe matters, or lay bare the reforms you have pondered? The examiner's brush still hangs in the air, waiting for you to speak."
 wj_temp_official.1002.t:0 "Probationary Evaluation: Reply to the Ministry of Personnel"
 wj_temp_official.1005.a:0 "Respectfully accept the grade and formally enter office."
 wj_temp_official.1005.b:0 "Remember my failings and sit again next year."
 wj_temp_official.1005.desc:0 "The registers, the handling of affairs, and the final statement are all done. The examiner gathers the records of each round together, consults your everyday reputation for worth, and only then hands you your grade.\n\nWhat could still be mended with words a moment ago is now set down on paper. You gaze at the assessment, awaiting the last word on whether your probation will stand.\n\n"
 wj_temp_official.1005.desc_fail:0 "'Not yet passing.' You see these words first, and only then read the rest: your post is kept for now, still on probation, to be examined again next year. Every shaky answer you gave comes flooding back, but to say them again now, there is no one left to record them in your grade."
 wj_temp_official.1005.desc_good:0 "Graded Good, your probationary post is hereby made substantive. Reading this far, the heart that hung so long finally settles. The assessment still notes things to improve, but that does not stop you from tucking this result safely away."
 wj_temp_official.1005.desc_high:0 "Graded Excellent, your probationary post is hereby made substantive. You read the word 'Excellent' twice before noticing the messenger is still waiting to take back the register. All those words you weighed over and over before the examination were not wasted after all."
 wj_temp_official.1005.desc_pass:0 "Graded Passing, your probationary post is hereby made substantive. Reading on through the assessment, several missteps still stand out plainly, but in the end they did not keep you outside the door. This time, at least, you have passed."
 wj_temp_official.1005.t:0 "Probationary Evaluation: The Final Grade"
