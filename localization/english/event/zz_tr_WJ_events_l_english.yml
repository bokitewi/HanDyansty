l_english:
 WJ_recommendation_reply.0001.desc:0 "Honored by your nomination of me as Filial and Incorrupt, I respectfully write to accept.\n\nWhen your letter first arrived, I read it over several times before I dared believe my name truly stood upon the roll of nominees. Until now I had heard only scattered talk of my reputation in the village; today, having won a word of praise from you, my lord, I am not only overjoyed but also aware that every word and deed of mine will be watched more closely than before.\n\nThe matters we discussed the other day I shall honor one by one. Gratitude for such recognition cannot be told in a single letter, so let me first say this much, my lord: I accept the nomination."
 WJ_recommendation_reply.0101.desc:0 "I have granted what your letter asked: this year's Filial and Incorrupt nomination shall go to [secondary_actor.Custom('WJ_GetLinkedUIName')].\n\nOn a nomination roll, people judge not only the nominee but also the discernment of the one who nominates. Since I am willing to sign my name to it, I dare not treat it lightly; yet how he conducts himself and bears his duties in the days to come must in the end be his own charge.\n\nThe other matters discussed shall all be carried out as agreed. Please pass on a word from me: today's nomination merely opens a door for him."
 WJ_bizhao_reply.0001.a:0 "With your help, all is well."
 WJ_bizhao_reply.0001.desc:0 "Your summons has arrived, and I rejoiced to read it. Since you, my lord, do not disdain me, I am willing to answer the call and join your staff, and shall abide by all that was discussed.\n\nIn the past I heard of the affairs of your office only through hearsay; now that I may take part in them myself, I feel some trepidation, but also anticipation. Once I take up my post, I hope the old records and unfinished business may be handed to me together, so that I may grow familiar with them soon and not merely occupy a seat in vain.\n\nI hold the kindness of your recognition close to my heart and dare not waste words on pleasantries. When we have served together for some time, I ask you, my lord, to judge for yourself how useful I truly am."
 WJ_bizhao_reply.0002.a:0 "So be it. There is no need to force the matter."
 WJ_bizhao_reply.0002.desc:0 "Your summons has reached me, and I have read its earnest goodwill over and over, not without being moved. Yet this time I truly cannot answer the call; my slowness in replying came from fear that a letter of refusal might seem disrespectful.\n\nAfter much reflection, I dare not accept a post I am not yet fit to bear. Your office urgently needs men; were I to nod only out of courtesy and later shirk my duties, I would only fail you all. Please choose another worthy for the seat on your staff, and do not keep it empty for me.\n\nThat we cannot serve together this time is not because I am ungrateful for the invitation. I respectfully reply in writing and hope you will forgive me, my lord."
 WJ_district.200.desc:0 "The fighting at the front has not abated, and I respectfully request aid from the Area Commander.\n\nOur units can still hold their ground, but contending for long with only the troops at hand, I fear we cannot cover every front. I therefore send an envoy to set out what we need, rather than waiting until we are at the end of our rope to cry out in haste.\n\nIf the Area Commander could lead the main army here in person, that is what everyone in the camp hopes for; if other military affairs detain you, then please send a capable general from this district to our aid, so that we may share intelligence on the enemy and plan our coordination together. I await your reply eagerly."
 WJ_district.200.dispatch:0 "Send another general to their aid."
 WJ_district.200.personal:0 "I shall lead my own troops to their aid in person."
 WJ_district.201.desc:0 "Your earlier plea for aid has been answered: [SCOPE.sC('wj_dd_target').Custom('WJ_GetLinkedUIName')] has led their troops to join your war.\n\nNothing wears on an army like waiting without word, so this news is sent ahead, before any outcome is known. From now on the two forces should share intelligence on the enemy and relay orders to one another, so that each unit knows where the others stand, rather than each holding its own corner and only searching for one another once the enemy is upon them.\n\nWhen to advance and when to withdraw must still be judged by the strength of the armies and the lie of the roads. Once this letter reaches you, let the relief force know what you need without delay."
 WJ_district.202.desc:0 "[SCOPE.sC('wj_dd_beneficiary').Custom('WJ_GetLinkedUIName')] has sent an urgent plea for help, and you are now ordered to lead your troops into their war.\n\nThose awaiting relief have waited long for an answer; you must let them know as soon as possible that help is on the way. From here on, the state of the war, the roads, and the matter of joining forces must all be made plain between you. Do not stand together in one army only on paper, while neither knows the other when the enemy comes.\n\nAdvance and retreat as the situation demands. This letter charges you only with the duty of aid; victory or defeat will be decided on the field."
 wj_kaoke_duties.1001.a:0 "Make up the grain from my own purse and re-examine the stricken households."
 wj_kaoke_duties.1001.a.tt:0 "The commandery will count this as good governance and enter it in this year's evaluation."
 wj_kaoke_duties.1001.b:0 "Report the disaster in full and request payment in installments."
 wj_kaoke_duties.1001.b.tt:0 "This will be entered in the evaluation register as usual, neither merit nor fault."
 wj_kaoke_duties.1001.c:0 "Press for the old quota and levy a collection fee besides."
 wj_kaoke_duties.1001.c.tt:0 "Word of harsh exactions will spread, and may become a stain at evaluation time."
 wj_kaoke_duties.1001.d:0 "Inspect the granary ledgers in person and pursue the arrears."
 wj_kaoke_duties.1001.d.failure:0 "The arrears could no longer be traced, and the collection fell into disorder instead"
 wj_kaoke_duties.1001.d.failure.tt:0 "The collection fell into disorder; a fault will surely be recorded at evaluation."
 wj_kaoke_duties.1001.d.success:0 "The granary ledgers were checked against one another, and the concealed tax grain was recovered"
 wj_kaoke_duties.1001.d.success.tt:0 "Recovering the arrears earns a mark of merit at evaluation."
 wj_kaoke_duties.1001.desc:0 "The accounts clerk has written the tax grain due to be forwarded on a wooden tablet, yet the granary officer has pushed an empty measure across your desk. Spring floods drowned the low fields, and the autumn harvest fell short by another tenth; the dispatches from the prefecture above recognize only the old quota, and never ask how much is left in the fields.\n\nYour chief aide suggests spreading the shortfall over the households that have not yet fled. Hearing this, the village elders prostrate themselves, saying that those who advanced grain for their neighbors last year have already sold their plough oxen this year. The arrears in the granary ledgers have piled up for years, and no one can say how much of them could still be recovered.\n\nThe space for a signature at the foot of the tablet lies empty. The accounts can be balanced, but next year there may be no one left to till the fields."
 wj_kaoke_duties.1001.t:0 "Full on Paper, Empty in the Granary"
 wj_kaoke_duties.1002.a:0 "Pay to survey the fields and reject the guarantee."
 wj_kaoke_duties.1002.a.tt:0 "The boundaries are clearly settled; a merit should be recorded at evaluation."
 wj_kaoke_duties.1002.b:0 "Seal the boundaries and let the original households farm first."
 wj_kaoke_duties.1002.b.tt:0 "The case is entered in the evaluation register, with neither merit nor fault."
 wj_kaoke_duties.1002.c:0 "Accept their gift of thanks and close the case by the new register."
 wj_kaoke_duties.1002.c.tt:0 "Taking gifts and judging crookedly will be hard to hide at evaluation."
 wj_kaoke_duties.1002.d:0 "Summon the village head and neighbors to testify in open court."
 wj_kaoke_duties.1002.d.failure:0 "The witnesses recanted, and the county's ruling became a laughingstock in the village"
 wj_kaoke_duties.1002.d.failure.tt:0 "The ruling is mocked throughout the countryside; a fault will surely be recorded at evaluation."
 wj_kaoke_duties.1002.d.success:0 "The testimony matched the old deeds, and the powerful family returned the seized fields"
 wj_kaoke_duties.1002.d.success.tt:0 "A clear judgment in open court earns a mark of merit at evaluation."
 wj_kaoke_duties.1002.desc:0 "Several poor households have come with old deeds to lodge a complaint: a great local family has reset the boundary stones and swallowed their fields into its own estate. The new register the family has sent is fully sealed, yet the clerk who wrote it is a relative of theirs by marriage. No blades appear in the case files, but at the far end of the field ridges no one dares to sow anymore.\n\nThe registrar quietly reminds you that the guarantee submitted by the family bears the names of several local notables, none of whom can be lightly rebuffed. The old deeds survive, but without the village head and the neighboring farmers testifying in court, the boundaries will be hard to settle.\n\nThe family offers to halt work and negotiate the boundary first, and has prepared a gift of thanks besides. The poor ask only one thing: next year, can they go back to their own fields?"
 wj_kaoke_duties.1002.t:0 "Between the Field Paths"
 wj_kaoke_duties.1003.a:0 "Advance funds to hire transport and set the schedule myself."
 wj_kaoke_duties.1003.a.tt:0 "The post roads run smoothly; a merit should be recorded at evaluation."
 wj_kaoke_duties.1003.b:0 "Handle the urgent duties first and request a delay for the rest."
 wj_kaoke_duties.1003.b.tt:0 "This will be entered in the evaluation register as usual, neither merit nor fault."
 wj_kaoke_duties.1003.c:0 "Conscript laborers by quota and collect exemption fees besides."
 wj_kaoke_duties.1003.c.tt:0 "Adding corvee to extract coin may become a stain at evaluation time."
 wj_kaoke_duties.1003.d:0 "Go to the relay stations in person and organize rotating stages."
 wj_kaoke_duties.1003.d.failure:0 "The handovers missed their deadlines, men and horses were exhausted, and order along the route suffered"
 wj_kaoke_duties.1003.d.failure.tt:0 "The deadline was missed; a fault will surely be recorded at evaluation."
 wj_kaoke_duties.1003.d.success:0 "Men and horses rotated in good order, and the urgent duties were delivered on time"
 wj_kaoke_duties.1003.d.success.tt:0 "Sound management earns a mark of merit at evaluation."
 wj_kaoke_duties.1003.desc:0 "The post clerk presents three urgent dispatches: one demanding the delivery of grain and goods to the prefectural treasury, one requiring relay carriages, and one pressing for laborers along the road. The deadlines are crowded together, and the post horses have grown so thin their bones show. The countryside is busy with farm work; take away another batch of able-bodied men, and this season's harvest will suffer.\n\nThe district clerk counts it out on his fingers for you: hiring carts and laborers costs money; merging the duties and relaying in stages needs someone to bear the blame for delays; and reporting the urgency of each item means endless correspondence with the prefecture above.\n\nOutside the station gate, the men waiting for duty have leaned their farm tools against the wall. What they wait for you to sign is not only the road of the coming days, but also the days their fields at home will lie empty."
 wj_kaoke_duties.1003.t:0 "No Idle Hands at the Relay Station"
 wj_kaoke.1000.t:0 "Ranking the Evaluation"
 wj_kaoke.2000.t:0 "Evaluation Register: Record of Merits and Faults"
 wj_kaoke.2001.t:0 "Evaluation Register: Standards of Official Duty"
 wj_langguan.1000.a:0 "State my own view, reconciling the principle through the Classics"
 wj_langguan.1000.b:0 "Hold strictly to the old commentaries and venture no risky readings"
 wj_langguan.1000.desc:0 "[scope:wj_assessment_examiner.Custom('WJ_GetLinkedUIName')] has ordered you to explicate the Classics and their commentaries, distinguish the variant readings, and then decide a doubtful case of ethics by the meaning of the Classics. The question seems to concern only philology, but in truth it tests whether you can cite the Classics without being shackled by antiquity."
 wj_langguan.1000.t:0 "Gentleman Examination: Mastery of the Classics"
 wj_langguan.1001.a:0 "Weigh the Classics against the statutes and set out a method of judgment"
 wj_langguan.1001.b:0 "Judge by precedent, seeking above all to make no error"
 wj_langguan.1001.desc:0 "The second question turns to law: several people share one case, their circumstances differ in gravity, and the law has its proper statutes. The examiner orders you to draft a verdict on the spot, neither indulging sentiment at the expense of law nor enforcing law at the expense of righteousness."
 wj_langguan.1001.t:0 "Gentleman Examination: Judging by Statute"
 wj_langguan.1002.a:0 "Draw on the past to illuminate the present and propose a plan to remedy the ills"
 wj_langguan.1002.b:0 "Present only the safest, customary methods of relief"
 wj_langguan.1002.desc:0 "The final question is an audience reply. The examiner posits that the commanderies and kingdoms suffer famine, bandits rise on every side, and the court's coffers are short, and orders you to lay out in a moment what comes first and what can wait. The hall falls silent; only the faint rustle of bamboo slips can be heard."
 wj_langguan.1002.t:0 "Gentleman Examination: Reply Before the Throne"
 wj_langguan.1005.a:0 "Respectfully accept the grade and leave the office"
 wj_langguan.1005.b:0 "Stay in the office to study, and try again next year"
 wj_langguan.1005.desc:0 "The three questions done, the examiner closes the scrolls and assesses, before your face, your learning in the Classics, your grasp of the law, and your reply to the throne."
 wj_langguan.1005.desc_fail:0 "Your answers were either too rigid or too careless of the law's intent, and are not yet enough to leave the office. The examiner orders you to study another year and sit again next year."
 wj_langguan.1005.desc_good:0 "Your answers were clear and orderly, with the occasional worthy new idea. Rated Good, you are qualified to formally receive your standing as a Filial and Incorrupt."
 wj_langguan.1005.desc_high:0 "Your answers united the Classics and the law, and struck at the affairs of the day. Rated Excellent, you leave the office with your standing secured, and the court too has remembered your name."
 wj_langguan.1005.desc_pass:0 "Your answers lacked edge but held no great fault. Rated Passing, you are permitted to formally receive your standing as a Filial and Incorrupt."
 wj_langguan.1005.t:0 "Gentleman Examination: The Grading"
 WJ_zhongwai.0001.a:0 "Receive the tally and obey the edict, commanding all forces within and without."
 WJ_zhongwai.0001.desc:0 "The edict appointing you Commander of All Forces Within and Without the Capital has been read, yet you are still gazing at the tally before you. From now on, whenever the armies quarrel over command or fail to support one another front and rear, someone will bring the documents to your desk, and you can no longer say it is another office's business.\n\nThe herald pauses a moment, waiting for you to accept. Several gazes in the hall drift your way; some watch you, some watch the tally, and it is hard to say what exactly they are weighing. You straighten your robes, already thinking of the military reports that will soon be rerouted to your desk.\n\nThis authority comes with the regency, and is not something a family may hand down privately. But for now, you are the one who coordinates the forces within and without. That final 'Your servant obeys the edict' should be heard clearly by everyone in the hall."
 WJ_zhongwai.0001.t:0 "Edict of Supreme Command"
 WJ_zhongwai.0002.a:0 "Respectfully obey the edict."
 WJ_zhongwai.0002.desc:0 "The edict is proclaimed: [scope:wj_zw_holder.Custom('WJ_GetLinkedUIName')] is made Commander of All Forces Within and Without the Capital, granted the yellow axe. Those who were murmuring a moment ago fall silent one by one; these few words make heads lift more than all the ceremonial phrases before them.\n\nListening to the new chain of command, you recall the military reports that the various offices used to push back and forth between them. From now on, who may issue orders and who must ask leave will all have to be learned anew; documents still sent by the old routes will likely be returned unopened.\n\nThe herald reads on, and every face around you wears its own expression. You do not rush to discuss it with others, but simply fix that name in your mind. The next time there is military business, where to submit your petitions has changed as of today."
