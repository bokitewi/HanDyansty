 SG_Nianhao_event.002.m:0 "Back"
 SG_Nianhao_event.003_t:0 "Choosing the Era Name — Auspicious Omens"
 SG_Nianhao_event.003_d:0 "The era names drawn from auspicious omens are laid before you, and with each one the ritual officer reads, he explains its meaning. Sweet dew descending, the yellow dragon appearing, phoenixes gathering: the portents that historians of former dynasties solemnly recorded are now set out one by one upon the desk.\n\nWhen he has finished, you tell him to leave the document closer to hand; there is no need to read it all again."
