 SG_Nianhao_event.013_t:0 "Proclaiming the Era Name"
 SG_Nianhao_event.013_d:0 "The candidates are put away for now, leaving only a blank space before you. Brush in hand, you hold back the stroke and first recite the chosen characters silently to yourself.\n\nFrom now on, whether in reports of victory or urgent memorials, the years will be recorded by this name."
 SG_Nianhao_event.013.a:0 "Let it be proclaimed and obeyed."
