l_english:
 SG_Nianhao_event.001_t:0 "Edict on Changing the Era Name to $Color_ZanBai$'[SCOPE.sC('wj_era_author').Custom('SanGong_NianHao')]'"
 SG_Nianhao_event.001_d:0 "The edict changing the era has been proclaimed: from this day the years shall be reckoned as #high [SCOPE.sC('wj_era_author').Custom('SanGong_NianHao')]#!.\n\nYou read over the name that will be written into every decree and register to come. The many troubles of the old years will not dissolve simply because the era name has changed; the hopes entrusted to the new era must still be borne out, one affair of state at a time.\n\n[SCOPE.sC('wj_era_author').Custom('SanGong_NianHao_tt')]"
 SG_Nianhao_event.001.a:0 "A new era begins; the cycle of years starts afresh."
 SG_Nianhao_event.002_t:0 "Choosing the Era Name"
 SG_Nianhao_event.002_d:0 "The officials present their proposed era names, first asking what meaning this change of era should carry. Auspicious omens, cultivated virtue, renewal, martial glory: each Confucian scholar holds to his own view, and soon the hall is arguing again.\n\nYou raise a hand to silence them. Not a character has been settled, yet so much has already been said on behalf of the edicts to come. Once the meaning is fixed, the name will follow; and if none of the proposals please you, you will have to take up the brush yourself."
 SG_Nianhao_event.002.a:0 "Auspicious Omens"
 SG_Nianhao_event.002.b:0 "Heavenly Signs and Calendar"
 SG_Nianhao_event.002.c:0 "Virtuous Rule and Moral Instruction"
