 SG_Nianhao_event.010_t:0 "Choosing an Era Name — Commemorating Great Rites"
 SG_Nianhao_event.010_d:0 "The officials wish to give the new era a commemorative name: some would record the Feng and Shan rites or the suburban sacrifices, others the completion of a palace, each candidate pointing to its own occasion. After several rounds of explanation you bid them stop, leaving only the proposed names upon the desk.\n\nWhich event deserves to be written into the reckoning of the years to come is for you alone to decide."
