 SG_Nianhao_event.005_t:0 "Choosing the Era Name — Virtuous Rule and Moral Instruction"
 SG_Nianhao_event.005_d:0 "The ritual officer reads through the names of cultivated virtue and good governance, and some in the hall nod faintly. Looking at the document on your desk, you reflect that if affairs of state do not go as hoped, these very words will likely be raised against you again and again.\n\nEven so, a name must be chosen."
