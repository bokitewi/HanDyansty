l_english:
 WJ_qingyi_yd_nudge_plus1_tt:0 "#P Someone at the gathering is now more willing to nominate [wj_qingyi_subject.Custom('WJ_GetUIName')]#!"
 WJ_qingyi_yd_nudge_plus2_tt:0 "#P Many at the gathering now turn to nominating [wj_qingyi_subject.Custom('WJ_GetUIName')]#!"
 WJ_qingyi_yd_nudge_minus1_tt:0 "#N Someone at the gathering no longer thinks well of this person#!"
 WJ_qingyi.0001.t:0 "Pure Criticism: Seats Awaiting Guests"
 WJ_qingyi.0001.desc.host:0 "The lodge has been swept clean, seats are laid out along both galleries, several scrolls of the Classics rest on the tables, and the tea things are ready. You walk from the gate to the inner hall and back again, afraid something has been overlooked.\n\nThe first guests to arrive are catching up beneath the gallery. When you sent the invitations, you thought only of whom to invite; now that people are actually arriving, you realize they may not all get along with one another.\n\nThe trials of being host begin from this moment."
 WJ_qingyi.0001.desc.host_yuedan:0 "The lodge has been swept clean, and seats are laid out along both galleries. This time the invitations stated plainly: besides pure conversation, the figures of the age will be appraised.\n\nMany guests have come for precisely this. Some ask quietly beneath the gallery whose names you will put forward; others merely bow and exchange pleasantries, while their eyes keep straying to the gate to see who else will come.\n\nYou already have a rough list in mind. Once everyone has arrived, the gathering can begin."
 WJ_qingyi.0001.desc.guest:0 "You give your name at the gate, and an attendant shows you in. Several guests are already seated beneath the gallery, some familiar, some known to you only by name.\n\nThe host [host.Custom('WJ_GetLinkedUIName')] is still attending to things in the inner hall, the scrolls on the tables have not yet been unrolled, and the talk is mostly of what people saw on the road and news from various places.\n\nThe serious discussion has not yet begun. You find a seat and listen first to what concerns the people here."
 WJ_qingyi.0001.a:0 "Let us wait until all the worthies have arrived."
 WJ_qingyi.0002.t:0 "Pure Criticism: Host and Guests Assembled"
 WJ_qingyi.0002.desc:0 "The guests have at last all arrived, and the announcements at the gate have ceased. You invite everyone to be seated, and once the last pleasantries die away, you begin:\n\n'Today, gentlemen, we do not rank one another by office or title. If you have doubts, ask; if you have views, speak.'\n\nThese words are said at every Pure Criticism, yet few truly live up to them. Who raises the first topic often sets the tone for the days to come."
 WJ_qingyi.0002.desc.yuedan:0 "The guests have at last all arrived. You invite everyone to be seated, but rather than hurry to pose a topic, you first make something clear:\n\n'Today we shall first discuss current affairs, then appraise men. All that you say these few days must in the end come down to a few names. Once the Monthly Commentary is given, it is public judgment. I hope you will speak with care, and I hope you will speak frankly.'\n\nThe room is silent for a moment, then a low murmur rises."
 WJ_qingyi.0002.desc.learning:0 "The guests have at last all arrived. You invite everyone to be seated and say straight out that you have invited them today to borrow their strengths to make up for your own shortcomings.\n\n'Where the meaning of the Classics is unclear to me, where current affairs elude me, gentlemen, speak freely, and I shall listen with respect.'\n\nSeeing their host style himself a junior student, the guests grow a little reserved for a moment. Fortunately, before long someone takes up the thread."
 WJ_qingyi.0002.a:0 "I shall pose the first topic."
 WJ_qingyi.0002.b:0 "Invite [wj_qingyi_opening_guest.Custom('WJ_GetUIName')] to open the discussion."
 WJ_qingyi.0003.t:0 "Pure Criticism: Taking Seats to Discuss the Way"
 WJ_qingyi.0003.desc:0 "The host [host.Custom('WJ_GetLinkedUIName')] invites everyone to be seated and declares the Pure Criticism begun: at this gathering office and title count for nothing; doubts may be raised, views may be offered.\n\nYou settle into your seat. Of those sharing the gathering, some you have long known by reputation, others you are meeting for the first time today. What these days of discussion will be like is hard to say just yet.\n\nBefore coming, you had already decided what you came here for. Now it is time to set about it."
 WJ_qingyi.0003.a:0 "Take my seat with proper courtesy and listen quietly for the topic."
 WJ_qingyi.0003.b:0 "First pay my respects and seek the host's instruction."
 WJ_qingyi.0003.c:0 "Choose a quiet spot to sit."
 WJ_qingyi.1001.t:0 "Opening on Emptiness"
 WJ_qingyi.1001.desc:0 "You have scarcely raised today's topic when [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')] cuts in: 'All things show their use through what they have. Then does the emptiness inside a vessel count as use?'\n\nSeveral guests glance as one at the empty cup on the table. The question seems a jest, but it is really the old debate over being and non-being. Answer well, and today's discussion has its foundation; answer poorly, and your weight as host is diminished."
 WJ_qingyi.1001.a:0 "Answer with the Profound Learning: being gives benefit, non-being gives use."
 WJ_qingyi.1001.a.success:0 "The reasoning is seamless, and the whole gathering nods in agreement"
 WJ_qingyi.1001.a.failure:0 "The words waver, and draw pointed follow-up questions"
 WJ_qingyi.1001.b:0 "Test it with real things: an empty cup can hold water, an empty granary can store grain."
 WJ_qingyi.1001.b.success:0 "The small reveals the great, and all praise its subtlety"
 WJ_qingyi.1001.b.failure:0 "The analogy is ill-chosen and fails to convince"
 WJ_qingyi.1001.c:0 "Invite the gentlemen present each to give their view."
 WJ_qingyi.1002.t:0 "A Sharp Question"
 WJ_qingyi.1002.desc:0 "Having heard your opening topic, [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')] does not follow on but picks out one sentence and counters right there: by the host's own words, is that not a contradiction?\n\nThe question comes fast and precise, and everyone present sets down their cup. Your opponent has clearly come prepared, and may not mean to embarrass you, but whatever the case, this question must be answered."
 WJ_qingyi.1002.a:0 "Refute it in earnest."
 WJ_qingyi.1002.a.success:0 "Dissected layer by layer, the opponent concedes"
 WJ_qingyi.1002.a.failure:0 "The opponent seizes on a flaw"
 WJ_qingyi.1002.b:0 "Laugh and turn the point aside."
 WJ_qingyi.1002.b.success:0 "Handled with ease, the gathering shares a laugh"
 WJ_qingyi.1002.b.failure:0 "It seems somewhat forced"
 WJ_qingyi.1002.c:0 "'Our guest is being rather discourteous.'"
 WJ_qingyi.1003.t:0 "Classics and Current Affairs"
 WJ_qingyi.1003.desc:0 "[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')], the most learned at the gathering, moves from the Spring and Autumn Annals to the taxes and corvee of the provinces and commanderies in recent years, saying that if the meaning of the Classics cannot be applied to the present age, then no matter how thoroughly read, it is empty text.\n\nThe point is well made, yet several of the citations strike you as not quite right. Will you take issue with them on the spot, or use the moment to seek instruction?"
 WJ_qingyi.1003.a:0 "Cite the Classics to judge affairs, and take issue with him."
 WJ_qingyi.1003.a.success:0 "The citations are apt, and the opponent is won over"
 WJ_qingyi.1003.a.failure:0 "Corrected by the opponent instead"
 WJ_qingyi.1003.b:0 "Humbly seek instruction."
 WJ_qingyi.1003.c:0 "The Classics and current affairs each have their strengths; why compare which is higher?"
 WJ_qingyi.1004.t:0 "A Single Word of Judgment"
 WJ_qingyi.1004.desc:0 "The specially invited Renowned Scholar [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')] has rarely spoken, but now sets down the teacup and offers you a single remark of appraisal. It is not long, yet it hits exactly upon what you are usually unwilling to admit.\n\nThe whole gathering watches to see how you will respond."
 WJ_qingyi.1004.desc.yuedan:0 "The specially invited Renowned Scholar [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')] has rarely spoken. When the discussion reaches [wj_qingyi_subject.Custom('WJ_GetLinkedUIName')] on the list, the scholar sets down the teacup and offers only a single word of praise, and the whole gathering falls silent.\n\nA Renowned Scholar's words carry great weight. As the presiding judge, whether you echo or refute them will sway everyone's view of this person."
 WJ_qingyi.1004.a:0 "Accept the words with a bow."
 WJ_qingyi.1004.b:0 "Debate the point back and forth."
 WJ_qingyi.1004.b.success:0 "After several exchanges, honors are even"
 WJ_qingyi.1004.b.failure:0 "The debate is lost, revealing only shallowness"
 WJ_qingyi.1004.c:0 "Second the Renowned Scholar's appraisal."
 WJ_qingyi.1004.d:0 "Refute it then and there."
 WJ_qingyi.1004.d.success:0 "The refutation is reasoned and well-grounded"
 WJ_qingyi.1004.d.failure:0 "Stumped by the Renowned Scholar instead"
 WJ_qingyi.1004.e:0 "Laugh it off."
 WJ_qingyi.1005.t:0 "Appraisal at the Gathering"
 WJ_qingyi.1005.desc:0 "The discussion turns to people. Someone brings up the recent conduct of [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]; some agree at once, others shake their heads.\n\nGradually everyone turns to you, waiting for the host to say a word. To appraise someone to their face, praise and blame alike must be carefully measured."
 WJ_qingyi.1005.desc.yuedan:0 "The discussion turns to [wj_qingyi_subject.Custom('WJ_GetLinkedUIName')] on the list. Some praise them by citing past deeds; others say their recent conduct may not be as good as rumor has it.\n\n[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')] asks you, as presiding judge, to give the first verdict. When the votes are cast, people will carry your words in mind to some degree."
 WJ_qingyi.1005.a:0 "Praise their strengths."
 WJ_qingyi.1005.b:0 "Point out their failings directly."
 WJ_qingyi.1005.b.success:0 "The words are fair, and no one can refute them"
 WJ_qingyi.1005.b.failure:0 "The words wound, and a grudge is born"
 WJ_qingyi.1005.c:0 "Commend the person."
 WJ_qingyi.1005.d:0 "Disparage the person."
 WJ_qingyi.1005.d.success:0 "The arguments are ample, and all are convinced"
 WJ_qingyi.1005.d.failure:0 "Disparagement without grounds forfeits fairness instead"
 WJ_qingyi.1005.e:0 "Leave it undiscussed."
 WJ_qingyi.1006.t:0 "At the Height of Merriment"
 WJ_qingyi.1006.desc.wine:0 "After several rounds of wine, the voices at the gathering grow louder. [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')] raises a cup in toast, saying that with the Pure Criticism come this far, it is time to set aside some restraint.\n\nWine can make men speak the truth, and it can make them misspeak. How deep the host drinks, the guests all see."
 WJ_qingyi.1006.desc.tea:0 "The tea has been changed several times, and the discussion has slowed. [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')] comes over with a teacup, saying that after days of debate, such leisure is rare.\n\nThe mood at the gathering has eased; it is just the time to say things that are not usually convenient to say."
 WJ_qingyi.1006.a:0 "Raise a cup and make merry together."
 WJ_qingyi.1006.b:0 "Keep to propriety and self-restraint."
 WJ_qingyi.1006.c:0 "Take the mood to judge the figures of the day."
 WJ_qingyi.1006.c.success:0 "A string of witticisms delights the whole gathering"
 WJ_qingyi.1006.c.failure:0 "A slip of the tongue before everyone"
 WJ_qingyi.1007.t:0 "Friends Beneath the Bamboo, Age Forgotten"
 WJ_qingyi.1007.desc:0 "After the gathering breaks up, [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')] does not leave, but sits with you beneath the bamboo in the courtyard. With no one else about, the talk turns easy: from old days of study in youth to the fortunes each has met over the years.\n\nBefore you know it, it is deep in the night. The distinction between host and guest seems no longer to matter."
 WJ_qingyi.1007.a:0 "Count them a close friend."
 WJ_qingyi.1007.b:0 "Present them with books from my family's collection."
 WJ_qingyi.1007.c:0 "One night's conversation is enough."
 WJ_qingyi.1008.t:0 "Beyond Pure Criticism"
 WJ_qingyi.1008.desc:0 "[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')] waits until the others have dispersed before seeking you out. After a few polite words, the talk shifts: you are asked to bend the rules in a certain matter, and a modest gift has been prepared.\n\nThe name of Pure Criticism is prized by the upright, yet requests for favors after the gathering have never been lacking."
 WJ_qingyi.1008.desc.yuedan:0 "[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')] waits until the others have dispersed before seeking you out. After some pleasantries, they lower their voice and say that [wj_qingyi_subject.Custom('WJ_GetLinkedUIName')] on the list is a rare talent, hoping that you, as presiding judge, will put in a few good words before the others; a modest gift has also been prepared.\n\nOnce private favor creeps into the Monthly Commentary, it is no longer public judgment."
 WJ_qingyi.1008.a:0 "Accept the gift."
 WJ_qingyi.1008.b:0 "Refuse publicly."
 WJ_qingyi.1008.c:0 "Feign compliance and keep this favor in reserve."
 WJ_qingyi.2001.t:0 "Moral Teaching and Nature"
 WJ_qingyi.2001.desc:0 "The host [host.Custom('WJ_GetLinkedUIName')] suddenly singles you out and asks: do rites and moral teaching spring from human nature, or did the sages establish them to govern the world?\n\nThis is one of the most debated questions among scholars of late, and many present already hold firm views. That the host asks you in particular likely means he wishes to hear something different."
 WJ_qingyi.2001.a:0 "Moral teaching springs from nature."
 WJ_qingyi.2001.a.success:0 "The reasoning is well-rounded, and the host nods"
 WJ_qingyi.2001.a.failure:0 "The words miss the point"
 WJ_qingyi.2001.b:0 "Moral teaching exists to govern the world."
 WJ_qingyi.2001.b.success:0 "It strikes at the ills of the times"
 WJ_qingyi.2001.b.failure:0 "The examples are ill-chosen"
 WJ_qingyi.2001.c:0 "Ask the host to speak first."
 WJ_qingyi.2002.t:0 "Pressed by Every Eye"
 WJ_qingyi.2002.desc:0 "You have only just finished stating your view when [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')] stands up and refutes it point by point, the tone growing ever harsher, until finally asking outright whether you have even read the original text.\n\nEvery eye in the room turns to you. Give ground now, and you will find it hard ever to speak before these people again."
 WJ_qingyi.2002.a:0 "Answer with learning."
 WJ_qingyi.2002.a.success:0 "The citations are thorough and clear, and the opponent is left speechless"
 WJ_qingyi.2002.a.failure:0 "Questioned into speechlessness"
 WJ_qingyi.2002.b:0 "Defuse it with eloquence."
 WJ_qingyi.2002.b.success:0 "A single jest breaks the deadlock"
 WJ_qingyi.2002.b.failure:0 "It fails to calm things"
 WJ_qingyi.2002.c:0 "Counter by asking about their weaknesses."
 WJ_qingyi.2002.c.success:0 "The tables are turned"
 WJ_qingyi.2002.c.failure:0 "Too clever by half, it backfires"
 WJ_qingyi.2003.t:0 "Seeking Instruction on the Classics"
 WJ_qingyi.2003.desc:0 "In the scroll you brought, there are several passages you have never understood. Today [wj_qingyi_luminary.Custom('WJ_GetLinkedUIName')] is also present, a person of deep learning rarely to be met, and this is the chance to resolve your doubts.\n\nYet to ask before everyone will inevitably reveal your own shortcomings."
 WJ_qingyi.2003.a:0 "Ask for instruction face to face."
 WJ_qingyi.2003.a.success:0 "The doubts are suddenly resolved"
 WJ_qingyi.2003.a.failure:0 "The question misses the essentials"
 WJ_qingyi.2003.b:0 "Record what is said and study it closely at home."
 WJ_qingyi.2003.c:0 "Leave it for another day."
 WJ_qingyi.2004.t:0 "A Glance from a Renowned Scholar"
 WJ_qingyi.2004.desc:0 "Having heard you out, the specially invited Renowned Scholar [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')] turns to give you a second look and says: 'Here is one worth talking with.'\n\nThe remark is short, but everyone present heard it. A single glance from a Renowned Scholar often does more than ten essays to make a name remembered."
 WJ_qingyi.2004.a:0 "Accept it with pleasure."
 WJ_qingyi.2004.b:0 "Humbly protest that it is undeserved."
 WJ_qingyi.2004.c:0 "Seize the moment to display my learning."
 WJ_qingyi.2004.c.success:0 "The Renowned Scholar beats time in admiration"
 WJ_qingyi.2004.c.failure:0 "Gilding the lily"
 WJ_qingyi.2005.t:0 "Who Ranks Highest"
 WJ_qingyi.2005.desc:0 "No one knows who started it, but the gathering has begun debating the relative merits of those present. [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')] half-jokingly suggests that, by today's showing, everyone might judge which of you two is the better.\n\nJest or not, the others really are waiting to see."
 WJ_qingyi.2005.desc.yuedan:0 "The gathering is arguing over [wj_qingyi_subject.Custom('WJ_GetLinkedUIName')] on the list. [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')], speaking most eagerly of all, turns to ask what you think.\n\nYour word alone cannot settle the outcome, but if it is forceful, it can always change a few minds."
 WJ_qingyi.2005.a:0 "Rank them the higher."
 WJ_qingyi.2005.b:0 "Set forth my own strengths."
 WJ_qingyi.2005.b.success:0 "The words are well reasoned"
 WJ_qingyi.2005.b.failure:0 "Too much self-praise"
 WJ_qingyi.2005.c:0 "Champion the person vigorously."
 WJ_qingyi.2005.c.success:0 "Several guests are won over"
 WJ_qingyi.2005.c.failure:0 "No one echoes it"
 WJ_qingyi.2005.d:0 "Vigorously lay out the person's failings."
 WJ_qingyi.2005.d.success:0 "The words strike at the heart of the matter"
 WJ_qingyi.2005.d.failure:0 "Denounced as acting from private grudge"
 WJ_qingyi.2005.e:0 "Do not contend with others."
 WJ_qingyi.2006.t:0 "Unrestrained Over Wine"
 WJ_qingyi.2006.desc.wine:0 "The wine flows ever more freely; some loosen their sashes, others strike the table and sing. [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')] pushes a large cup of wine before you, saying that a man of pure conversation need not be bound by vulgar etiquette.\n\nFree abandon is the bearing of a Renowned Scholar; so is losing one's composure. Where the line lies is up to you alone."
 WJ_qingyi.2006.desc.tea:0 "There is only tea at the gathering, yet the talk grows spirited all the same. [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')] moves their seat closer, saying it is rare to meet someone so congenial, and there is no need to part early tonight.\n\nAt such a moment, whether to open your heart or keep to the rules is entirely up to you."
 WJ_qingyi.2006.a:0 "Give free rein to my spirit."
 WJ_qingyi.2006.b:0 "Hold my cup and keep my composure."
 WJ_qingyi.2006.c:0 "Drink with my neighbor."
 WJ_qingyi.2007.t:0 "Clapping Hands in Conversation"
 WJ_qingyi.2007.desc:0 "After the gathering breaks up, [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')] holds you back to keep talking. At the most congenial point, they clap their hands and laugh, saying that of all the people met these few days, rarely has anyone thought so much alike.\n\nStrangers who have met by chance: whether this becomes a lasting friendship depends on tonight."
 WJ_qingyi.2007.a:0 "Count them a kindred spirit."
 WJ_qingyi.2007.b:0 "Present them with money and silk."
 WJ_qingyi.2007.c:0 "Leave it at that."
 WJ_qingyi.2008.t:0 "Words Behind the Curtain"
 WJ_qingyi.2008.desc:0 "While talking apart from the others, [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')] lets slip an unguarded remark that hints at an old affair. Realizing you caught it, they immediately lower their voice, and their face changes.\n\nThe host likely does not yet know of this. Will you pretend not to have heard, or make other plans?"
 WJ_qingyi.2008.a:0 "I should tell the host about this."
 WJ_qingyi.2008.b:0 "Keep it silently in mind without alarming others."
 WJ_qingyi.2008.c:0 "I will keep silent, but it must be repaid."
 WJ_qingyi.2011.desc.yuedan:0 "The host [host.Custom('WJ_GetLinkedUIName')] suddenly turns to you and asks your view of [wj_qingyi_subject.Custom('WJ_GetLinkedUIName')] on the list.\n\nThe gathering falls quiet. The Monthly Commentary is under way, and this one remark of yours may change the votes in several hands."
 WJ_qingyi.9001.t:0 "The Appraisal Disperses"
 WJ_qingyi.9001.desc:0 "The guests rise one by one, straightening their robes; the discussions of these days have finally come to a close. The attendants begin clearing the seats, and you, as host, still have a few final words to say.\n\nWhat this Pure Criticism leaves behind, and which words of it spread abroad, depends in part on how you close it now."
 WJ_qingyi.9001.desc.yuedan:0 "The guests rise one by one, straightening their robes. What people will remember most clearly of this Pure Criticism is probably the reaction of the whole gathering when [wj_qingyi_yd_winner.Custom('WJ_GetLinkedUIName')] was named first.\n\nThe result of the Monthly Commentary will soon spread everywhere, and your name as presiding judge will be mentioned along with it. You must still consider how to say your final words."
 WJ_qingyi.9001.a:0 "Record the words of the worthies and spread them among the scholars"
 WJ_qingyi.9001.b:0 "See the guests out in person."
 WJ_qingyi.9001.c:0 "Select the useful talents and recommend them to the court"
 WJ_qingyi.9002.t:0 "Echoes Still in the Ear"
 WJ_qingyi.9002.desc:0 "As the Pure Criticism breaks up, you rise with the others, only now noticing that you have sat so long your legs have stiffened. The wind from outside the gallery blows in your face, and the most heated words of these days still ring in your ears.\n\nWhat you have gained from this visit, you will only come to understand slowly after you return."
 WJ_qingyi.9002.desc.yuedan:0 "As the Pure Criticism breaks up, people are still talking about the selection of [wj_qingyi_yd_winner.Custom('WJ_GetLinkedUIName')]; some are convinced, others disapprove.\n\nYou cast your vote in this Monthly Commentary too. Whatever the result, when people speak of this appraisal in days to come, you will count among those who were there."
 WJ_qingyi.9002.a:0 "Record what I learned and return home."
 WJ_qingyi.9002.b:0 "Bow in thanks to the host."
 WJ_qingyi.9002.c:0 "Drift away lightly."
 WJ_qingyi_log_0001_host:0 "[CHARACTER.Custom('WJ_GetUIName')] readied the lodge and kept seats waiting for guests"
 WJ_qingyi_log_0001_host_title:0 "Seats Awaiting the Worthy"
 WJ_qingyi_log_0001_arrival:0 "[CHARACTER.Custom('WJ_GetUIName')] arrived at the lodge at the invitation of [TARGET_CHARACTER.Custom('WJ_GetUIName')]"
 WJ_qingyi_log_0001_arrival_title:0 "Guests Arrive"
 WJ_qingyi_log_0002:0 "Host and guests assembled; [CHARACTER.Custom('WJ_GetUIName')] posed the topic personally, and the Pure Criticism began"
 WJ_qingyi_log_0002_title:0 "Raising the Whisk to Begin"
 WJ_qingyi_log_0002_b:0 "[CHARACTER.Custom('WJ_GetUIName')] invited [TARGET_CHARACTER.Custom('WJ_GetUIName')] to open the discussion"
 WJ_qingyi_log_0002_b_title:0 "Yielding the Opening"
 WJ_qingyi_log_0003:0 "[CHARACTER.Custom('WJ_GetUIName')] took a seat at the Pure Criticism hosted by [TARGET_CHARACTER.Custom('WJ_GetUIName')]"
 WJ_qingyi_log_0003_title:0 "Guests Take Their Seats"
 WJ_qingyi_log_0003_b:0 "[CHARACTER.Custom('WJ_GetUIName')] paid respects and sought instruction from [TARGET_CHARACTER.Custom('WJ_GetUIName')] before taking a seat"
 WJ_qingyi_log_0003_b_title:0 "Seeking Instruction with Courtesy"
 WJ_qingyi_log_0003_c:0 "[CHARACTER.Custom('WJ_GetUIName')] chose a quiet spot to sit"
 WJ_qingyi_log_0003_c_title:0 "Choosing a Seat"
 WJ_qingyi_log_1001_a_success:0 "[CHARACTER.Custom('WJ_GetUIName')] expounded on being and non-being, and [TARGET_CHARACTER.Custom('WJ_GetUIName')] was won over in admiration"
 WJ_qingyi_log_1001_a_failure:0 "[CHARACTER.Custom('WJ_GetUIName')] answered the question of being and non-being without grounds, and was pressed by [TARGET_CHARACTER.Custom('WJ_GetUIName')]"
 WJ_qingyi_log_1001_b_success:0 "[CHARACTER.Custom('WJ_GetUIName')] tested abstruse words against real things, and all praised its subtlety"
 WJ_qingyi_log_1001_b_failure:0 "[CHARACTER.Custom('WJ_GetUIName')] chose an ill-fitting analogy and failed to convince"
 WJ_qingyi_log_1001_c:0 "[CHARACTER.Custom('WJ_GetUIName')] invited everyone to give their views"
 WJ_qingyi_log_1002_a_success:0 "[CHARACTER.Custom('WJ_GetUIName')] refuted the sharp question of [TARGET_CHARACTER.Custom('WJ_GetUIName')]"
