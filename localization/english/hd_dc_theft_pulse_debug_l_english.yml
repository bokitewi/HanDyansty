l_english:
 hd_dc_theft_pulse_debug.title: "Annual Banditry Review"
 hd_dc_theft_pulse_debug.gates: "#warning Dakuo remains blocked by four vanilla conditions: the scheme's allowed and valid checks, and the interaction's is_shown and can_send checks.#!\nThis page does not remove these restrictions or establish that the earlier slot-related crash has been fixed. Opening it for inspection does not run an annual review."
 hd_dc_theft_pulse_debug.actor: "\n\nCharacter under review: [hd_dc_theft_debug_actor.GetName]."
 hd_dc_theft_pulse_debug.no_actor: "No AI character in this region\n\nqualifies for an official banditry record this year."
 hd_dc_theft_pulse_debug.year: "\nLast review year: [hd_dc_theft_debug_actor.MakeScope.Var('hd_dc_theft_pulse_year').GetValue|0]."
 hd_dc_theft_pulse_debug.no_record: "\nNo annual review record is available yet."
 hd_dc_theft_pulse_debug.probability: "\nSelected target: [hd_dc_theft_debug_actor.MakeScope.Var('hd_dc_theft_pulse_target').Char.GetName].\nBase chance: [hd_dc_theft_debug_actor.MakeScope.Var('hd_dc_theft_pulse_p0').GetValue|3]%; adjusted sampling chance: [hd_dc_theft_debug_actor.MakeScope.Var('hd_dc_theft_pulse_probability').GetValue|3]%."
 hd_dc_theft_pulse_debug.no_business_candidate: "\nReview result: No eligible candidate for this occupation. No probability calculation or random selection was performed."
 hd_dc_theft_pulse_debug.native_gate_failed: "\nReview result: An occupation candidate exists, but the vanilla scheme-start check failed. Existing restrictions remain in effect; cooldown and scheme-limit checks were also skipped."
 hd_dc_theft_pulse_debug.probability_failed: "\nReview result: A valid target exists, but the random selection did not succeed."
 hd_dc_theft_pulse_debug.started: "\nLatest review result: The vanilla start procedure successfully created a scheme. See below to check whether it still exists."
 hd_dc_theft_pulse_debug.native_start_failed: "\nReview result: After random selection, the vanilla call did not return a new scheme."
 hd_dc_theft_pulse_debug.scheme_exists: "\nScheme record: The recorded scheme currently exists."
 hd_dc_theft_pulse_debug.no_scheme: "\nScheme record: No existing scheme is currently referenced. This does not establish whether an earlier attempt succeeded."
 hd_dc_theft_pulse_debug.check: "Run This Character's Official Review for This Year"
 hd_dc_theft_pulse_debug.check_tt: "Run the official annual review while retaining this character's lock for the year, the actual eligibility conditions, the vanilla five-year cooldown, and the scheme limit. A character already reviewed this year cannot be rerolled. Existing restrictions remain in effect."
 hd_dc_theft_pulse_debug.refresh: "Refresh the Current Character Only"
 hd_dc_theft_pulse_debug.other: "Inspect Another Eligible Character Without Running a Review"
