l_english:
 # Celestial government: Warlord contract (2026-10-24)
 hd_warlord:0 "@celestial_military_administration!Warlord"
 hd_warlord_short:0 "Warlord"
 hd_warlord_text_icon:0 "@celestial_military_administration!"
 hd_warlord_desc:0 "#low An imperial official in name, a regional strongman in fact: taxes no longer reach the court, troops no longer answer its summons, and sons inherit what their fathers held.#!"
 hd_warlord_benefits:0 "#emphasis #bold Benefits for the Official:#!#!\n$EFFECT_LIST_BULLET$Pays no taxes and sends no levies to the liege; each season the taxes that would have gone to the liege move from their gold into their own treasury, and the court stops paying their salary\n$EFFECT_LIST_BULLET$Uses [GetLaw('hd_warlord_succession_law').GetName] and may designate their own heir\n$EFFECT_LIST_BULLET$Fort Level #P +2#!, Defender Advantage #P +4#!, County Control growth #P +10%#!; Development growth #N -20%#!\n$EFFECT_LIST_BULLET$[levy|E] size #P +30%#!, [men_at_arms|E] maintenance #P -15%#!, [men_at_arms|E] recruitment cost #P -30%#!, [men_at_arms|E] [regiments|E] #P +3#!\n$EFFECT_LIST_BULLET$May refuse troop summons from the liege or the district commander; the court must pay triple [influence|E] to call them to war\n\n#alert_trial @alert_icon!Only a vassal can claim this through the Hold Troops for Oneself decision; the liege can only reverse it with the Reclaim Authority interaction.#!"
 hd_warlord_contract_locked_tt:0 "Is not a warlord (a warlord's administration type can only be changed through Reclaim Authority)"
 hd_warlord_level_locked_tt:0 "Is not a warlord"
 hd_warlord_level_decision_only_tt:0 "Has become a warlord through the Hold Troops for Oneself decision"

 hd_warlord_succession_law:0 "Acclamation"
 hd_warlord_succession_law_subname:0 "Highest candidate score inherits; the warlord's designated heir gets a bonus"
 hd_warlord_succession_law_effects:0 "\nA type of [appointment_succession_law|E]. When the warlord dies, their [title|E] and associated [holdings|E] pass to the candidate with the highest [candidate_score|E], scored as in vanilla Acclamation; a [designated_heir|E] chosen by the warlord gains an extra #P +100#!.\n\nCandidates include the warlord's close family, the warlord's own landed [vassals|E], and other landed vassals of the same [liege|E] together with their family members (they must be of lower tier than the title)."
 hd_warlord_law_blocked_tt:0 "Is not a warlord"
 hd_warlord_law_requires_warlord_tt:0 "Is a warlord"
 hd_warlord_designated_heir_desc:0 "Designated by the warlord"

 hd_warlord_declare_decision:0 "Hold Troops for Oneself"
 hd_warlord_declare_decision_desc:0 "The court is far away, and the troops and grain are in my hands. Why keep sending taxes to the capital and waiting on imperial orders? Better to hold my troops, keep my taxes, and let my descendants guard this land after me."
 hd_warlord_declare_decision_tooltip:0 "Become a warlord: pay no taxes, send no levies, and switch to Acclamation succession"
 hd_warlord_declare_decision_confirm:0 "Hold my troops"
 hd_warlord_declare_military_tt:0 "Is a military official (Military Administration or Sili)"
 hd_warlord_declare_cooldown_tt:0 "Has not had authority reclaimed by the liege in the last five years"
 hd_warlord_establish_effect_tt:0 "Administration type becomes #high Warlord#!: no more taxes or levies to the liege, each season the taxes that would have been paid move from your gold into your own treasury, and the court stops paying your salary. Succession changes to [GetLaw('hd_warlord_succession_law').GetName], and you may designate your own heir."
 hd_warlord_declared_msg:0 "A Vassal Holds Troops for Themselves"
 hd_warlord_declared_opinion:0 "Holds troops for themselves"

 hd_warlord_revoke_interaction:0 "Reclaim Authority"
 hd_warlord_revoke_interaction_desc:0 "Demand that [recipient.GetShortUIName] give up command and return to being an ordinary military official appointed by the court. If they refuse, you gain the Punish the Disloyal [casus_belli|E] against them."
 hd_warlord_revoke_interaction_notification:0 "The court's laws cannot stay suspended forever. It is time to hand back your command."
 hd_warlord_revoke_to_military_tt:0 "Administration type returns to #high Military Administration#!, and succession returns to [GetLaw('celestial_military_appointment_succession_law').GetName]; cannot become a warlord again for five years"
 hd_warlord_revoke_to_civil_tt:0 "Cannot return to Military Administration (no free slot, or the liege cannot hold military officials; district heads are the exception and always return to Military Administration), so becomes an ordinary civil official under #high Standard Administration#!, with succession returning to [GetLaw('celestial_appointment_succession_law').GetName]; cannot become a warlord again for five years"
 hd_warlord_defy_effect_tt:0 "The liege gains the Punish the Disloyal [casus_belli|E] against them for five years"
 hd_warlord_revoke_ai_strength_strong:0 "Troops at least as strong as the liege's"
 hd_warlord_revoke_ai_strength_half:0 "Troops at least half as strong as the liege's"
 hd_warlord_revoke_ai_strength_weak:0 "Troops less than a quarter as strong as the liege's"

 hd_warlord_revoke_cb:0 "Punish the Disloyal"
 hd_warlord_revoke_cb_war_name:0 "[ATTACKER.GetShortUINamePossessive] War to Punish the Disloyal"
 hd_warlord_revoke_cb_victory_desc:0 "[defender.GetShortUIName|U] loses their command, their primary title goes to [attacker.GetShortUIName], and they are imprisoned."
 hd_warlord_revoke_cb_white_peace_desc:0 "Both sides lay down their arms. [defender.GetShortUIName|U] remains a warlord, and a five-year truce begins."
 hd_warlord_revoke_cb_defeat_desc:0 "The campaign fails. [defender.GetShortUIName|U] remains a warlord, and a five-year truce begins."

 hd_warlord_summon_cost_desc:0 "Summoning a warlord"
 hd_warlord.0001.t:0 "A Summons to Arms"
 hd_warlord.0001.desc:0 "[hd_wl_summoner.GetTitledFirstName] has sent orders for me to march to the aid of [hd_wl_beneficiary.GetTitledFirstName].\n\nThe envoy waits below for my answer. I trained these troops myself and fed them from my own stores, so why should they die for someone else? Yet the orders bear the official seal, and a refusal will not be forgotten."
 hd_warlord.0001.a:0 "March as ordered"
 hd_warlord.0001.b:0 "Stay put"
 hd_warlord_summon_accepted_msg:0 "A Warlord Answers the Summons"
 hd_warlord_summon_refused_msg:0 "A Warlord Refuses the Summons"
 hd_warlord_refused_summon_opinion:0 "Refused my summons"
 FACTION_REASON_HD_WARLORD:0 "Warlord holding troops for themselves"
