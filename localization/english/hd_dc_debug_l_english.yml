l_english:
 hd_dc_debug_decision: "Dynasty Cycle Debugging"
 hd_dc_debug_decision_desc: "View the current state of the dynastic cycle, adjust the perilous and prosperous eras, and check the actual event flow. This entry only appears in debug mode."
 hd_dc_debug_decision_tooltip: "Open the Dynasty Cycle Debug Menu"
 hd_dc_debug_decision_confirm: "Open the debug menu"
 hd_dc_debug.0001.t: "Dynasty Cycle Debugging"
 hd_dc_debug.0001.desc: "Select the items to check. Viewing status does not advance events; adjusting points immediately refreshes affected regions connected to them. \n\n Actual payments, character responses, and waiting periods are still processed according to normal procedures."
 hd_dc_debug.status: "Check current status"
 hd_dc_debug.w: "Adjust the Perilous World W"
 hd_dc_debug.h: "Adjust the Prosperous Era H"
 hd_dc_debug.events: "A valid event has been discovered."
 hd_dc_debug.prepare: "Prepare test scenario"
 hd_dc_debug.0030.desc: "The following actions will actually modify the current world. They are only executed when clicking on the corresponding scene; new characters, relationships, and funds will not be automatically reverted after closing the menu. Once the scene is prepared, the formal process must still be initiated from the event menu."
 hd_dc_debug.prepare_ord19: "Prepare the three-person scenario for ORD-19"
 hd_dc_debug.prepare_ord19.tt: "Generate a 45-year-old father, a 20-year-old youth, and a 40-year-old guarantor to join your court; establish an enemy relationship with the father at this moment, while the youth retains independent personal relationships and culpability. Add five years plus +100 affinity in all four required directions between you, the youth, and the guarantor, and grant you 300 gold. Each player character is prepared only once and will not automatically accept proposals on behalf of anyone."
 hd_dc_debug_trust_opinion: "Debug Scene: Mutual Trust"
 hd_dc_debug_rival_reason: "[TARGET_CHARACTER.GetShortUIName] and [CHARACTER.GetShortUIName] become enemies due to scene debugging preparation"
 hd_dc_debug.close: "Close"
 hd_dc_debug.back: "Return to Debug Menu"
 hd_dc_debug.refresh: "Conduct a formal observation and refresh."
 hd_dc_debug.refresh.tt: "Update the regional snapshot, Crisis Impact, Event Pool, and pending matters according to the formal observation procedure; this operation will alter the game state but will not fabricate elapsed years and months."
 hd_dc_debug.0002.t: "Current Dynasty Cycle Status"
 hd_dc_debug.0002.ready: "Chaotic Era W: [scope:hd_dc_debug_region.Var('hd_dc_pressure_percent').GetValue|1] / 100\nProsperous Era H: [scope:hd_dc_debug_region.Var('hd_dc_prosperity_percent').GetValue|1] / 100\nChaotic Era Tier: [scope:hd_dc_debug_region.Var('hd_dc_pressure_band').GetValue|0]\nThe currently applicable event for you F: [SCOPE.GetValue('hd_dc_debug_f')|2]; Faction P: [SCOPE.GetValue('hd_dc_debug_p')|2]; Strategy Merge Multiplier: [SCOPE.GetValue('hd_dc_debug_scheme_f')|2]. It is 1 when not in the applicable region. Epidemic D is determined by commandery, with five tiers of 1/1.05/1.10/1.15/1.20. \n\nLast W request/actual increment: [scope:hd_dc_debug_region.Var('hd_dc_last_w_requested').GetValue|0] / [scope:hd_dc_debug_region.Var('hd_dc_last_w_actual').GetValue|0]\nLast H request/actual increment: [scope:hd_dc_debug_region.Var('hd_dc_last_h_requested').GetValue|0] / [scope:hd_dc_debug_region.Var('hd_dc_last_h_actual').GetValue|0]\n. The above increments are internal points, where every 20 points equals 1 point on the interface."
 hd_dc_debug.0002.waiting: "The cycle of dynasties has already begun, but W/H has not yet been initialized. Wait for the official monthly observation, or choose to perform an official observation and refresh."
 hd_dc_debug.points.desc: "The adjustment value is measured in interface points, ranging from 0 to 100. The perilous era advances to a higher tier at values of 20, 40, 60, and 80. \n\n Point changes are uniformly written and affect refreshes; reducing the perilous era does not return lost control power or development degree, nor does it directly alter the era."
 hd_dc_debug.minus_10: "Reduce by 10 points"
 hd_dc_debug.minus_1: "Reduce by 1 point"
 hd_dc_debug.plus_1: "Increase by 1 point"
 hd_dc_debug.plus_10: "Increase by 10 points"
 hd_dc_debug.set_0: "Set to 0"
 hd_dc_debug.set_20: "Set to 20"
 hd_dc_debug.set_40: "Set to 40"
 hd_dc_debug.set_60: "Set to 60"
 hd_dc_debug.set_80: "Set to 80"
 hd_dc_debug.set_100: "Set to 100"
 hd_dc_debug.0020.desc: "Manually initiate a formal event to skip the annual lottery wait. Character qualifications, pending responses, and actual fulfillment conditions remain valid. Unselectable items are retained in the menu; missing conditions can be viewed."
 hd_dc_debug.ord09: "ORD-09: Redeem Relatives"
 hd_dc_debug.ord09.tt: "Requires eligible relatives actually imprisoned, legally imprisoned individuals, and current action permissions; cannot initiate another one when there are pending ordinary events awaiting response."
 hd_dc_debug.ord13: "ORD-13: Official Documents and Bad News"
 hd_dc_debug.ord13.tt: "Requires an adult ruler present in the region, at least Level 2 pressure, and a qualified direct vassal holding a commandery with less than 50 control. Cannot be opened if there is already a pending ordinary event awaiting response."
 hd_dc_debug.ord19: "ORD-19: Child of the Enemy"
 hd_dc_debug.ord19.tt: "Requires an adult child of a former enemy who is actually present in court, with no personal crimes available for you to imprison them for, and who is not your private enemy. Limited cooperation additionally requires a guarantor with mutual trust from both parties. Cannot be initiated when there are pending ordinary events awaiting response."
