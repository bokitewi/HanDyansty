l_english:
 hd_dc_debug_decision: "Dynastic Cycle Debugging"
 hd_dc_debug_decision_desc: "Inspect the current dynastic cycle, adjust turmoil and prosperity, and review event progress. This decision appears only in debug mode."
 hd_dc_debug_decision_tooltip: "Open the dynastic cycle debug menu"
 hd_dc_debug_decision_confirm: "Open the debug menu"
 hd_dc_debug.0001.t: "Dynastic Cycle Debugging"
 hd_dc_debug.0001.desc: "Choose what to inspect. Viewing the current state does not advance events. Adjusting points immediately refreshes the affected regions.\n\nPayments, responses, and waiting periods still follow the normal procedures."
 hd_dc_debug.status: "View Current State"
 hd_dc_debug.w: "Adjust Turmoil W"
 hd_dc_debug.h: "Adjust Prosperity H"
 hd_dc_debug.events: "A valid event has been found."
 hd_dc_debug.prepare: "Set Up a Test Scenario"
 hd_dc_debug.0030.desc: "These actions change the current world when you select a scenario. Closing the menu does not undo newly created characters, relationships, or money. After setting up a scenario, you must still begin the actual sequence from the event menu."
 hd_dc_debug.prepare_ord19: "Set Up the Three-Character ORD-19 Scenario"
 hd_dc_debug.prepare_ord19.tt: "Create a 45-year-old father, a 20-year-old youth, and a 40-year-old guarantor in your court. You become the father's rival, while the youth retains their own relationships and responsibility for any crimes. The four required relationships among you, the youth, and the guarantor each receive five additional years and +100 Opinion. You also receive 300 Gold. Each player character may set up this scenario once. It does not automatically accept a proposal for any participant."
 hd_dc_debug_trust_opinion: "Debug Scenario: Mutual Trust"
 hd_dc_debug_rival_reason: "[TARGET_CHARACTER.GetShortUIName] and [CHARACTER.GetShortUIName] became rivals as part of a debug scenario"
 hd_dc_debug.close: "Close"
 hd_dc_debug.back: "Return to the Debug Menu"
 hd_dc_debug.refresh: "Run an Official Review and Refresh"
 hd_dc_debug.refresh.tt: "Run the official review to update the regional state, crisis effects, event pool, and pending matters. This changes the situation but does not add time that has not actually elapsed."
 hd_dc_debug.0002.t: "Current Dynastic Cycle State"
 hd_dc_debug.0002.ready: "Turmoil W: [hd_dc_debug_region.Var('hd_dc_pressure_percent').GetValue|1] / 100\nProsperity H: [hd_dc_debug_region.Var('hd_dc_prosperity_percent').GetValue|1] / 100\nTurmoil tier: [hd_dc_debug_region.Var('hd_dc_pressure_band').GetValue|0]\nCurrent event multiplier F: [SCOPE.GetValue('hd_dc_debug_f')|2]; faction multiplier P: [SCOPE.GetValue('hd_dc_debug_p')|2]; combined scheme multiplier: [SCOPE.GetValue('hd_dc_debug_scheme_f')|2]. Outside an applicable region, these are 1. Epidemic multiplier D varies by commandery, with five tiers of 1/1.05/1.10/1.15/1.20.\n\nLast requested/actual W increase: [hd_dc_debug_region.Var('hd_dc_last_w_requested').GetValue|0] / [hd_dc_debug_region.Var('hd_dc_last_w_actual').GetValue|0]\nLast requested/actual H increase: [hd_dc_debug_region.Var('hd_dc_last_h_requested').GetValue|0] / [hd_dc_debug_region.Var('hd_dc_last_h_actual').GetValue|0]\nThese increases use internal points. Every 20 internal points equal 1 point displayed in the interface."
 hd_dc_debug.0002.waiting: "The dynastic cycle has begun, but W/H have not yet been initialized. Wait for the regular monthly review, or run an official review and refresh now."
 hd_dc_debug.points.desc: "Adjustments use the displayed scale from 0 to 100. Turmoil moves to the next tier at 20, 40, 60, and 80.\n\nPoint changes are recorded consistently and affect the refresh. Reducing turmoil does not restore lost Control or Development and does not directly change the era."
 hd_dc_debug.minus_10: "Decrease by 10"
 hd_dc_debug.minus_1: "Decrease by 1"
 hd_dc_debug.plus_1: "Increase by 1"
 hd_dc_debug.plus_10: "Increase by 10"
 hd_dc_debug.set_0: "Set to 0"
 hd_dc_debug.set_20: "Set to 20"
 hd_dc_debug.set_40: "Set to 40"
 hd_dc_debug.set_60: "Set to 60"
 hd_dc_debug.set_80: "Set to 80"
 hd_dc_debug.set_100: "Set to 100"
 hd_dc_debug.0020.desc: "Start an actual event manually, skipping the wait for annual selection. Character eligibility, pending responses, and fulfillment conditions still apply. Unavailable options remain in the menu so you can inspect their missing requirements."
 hd_dc_debug.ord09: "ORD-09: Ransom a Relative"
 hd_dc_debug.ord09.tt: "Requires an eligible relative who is actually imprisoned, a lawful jailer, and the authority to act. You cannot begin while an ordinary event is awaiting a response."
 hd_dc_debug.ord13: "ORD-13: Dispatches and Grim News"
 hd_dc_debug.ord13.tt: "Requires an adult ruler in the region, turmoil pressure of at least Tier 2, and an eligible commandery held by a direct vassal with Control below 50. You cannot begin while an ordinary event is awaiting a response."
 hd_dc_debug.ord19: "ORD-19: A Rival's Child"
 hd_dc_debug.ord19.tt: "Requires an adult child of a former rival who is actually at court, has no personal crime that permits imprisonment, and is not your own rival. Limited cooperation also requires a guarantor trusted by both sides. You cannot begin while an ordinary event is awaiting a response."
