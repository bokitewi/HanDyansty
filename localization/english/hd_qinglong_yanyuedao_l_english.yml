 hd_qinglong_yanyuedao_name:0 "Green Dragon Crescent Blade"
 hd_qinglong_yanyuedao_description:0 "The blade curves like a crescent moon, its surface entwined with a green dragon. Its heavy shaft demands exceptional strength. People say that such a weapon belongs in the hands of a general whose loyalty and righteousness have no equal."
