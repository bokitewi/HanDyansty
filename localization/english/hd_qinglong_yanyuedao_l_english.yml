 hd_qinglong_yanyuedao_name:0 "Green Dragon Crescent Blade"
 hd_qinglong_yanyuedao_description:0 "This blade's body resembles a crescent moon, with the pattern of the Azure Dragon coiled around it. Its long hilt is heavy; only one of exceptional strength can wield it. It is said to have accompanied Guan Yu in campaigns across the four directions, witnessing his loyalty and righteousness as well as his formidable reputation."
