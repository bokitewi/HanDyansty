l_english:
 hd_dc_demand_independence_interaction:0 "Demand Independence"
 hd_dc_demand_independence_interaction_desc:0 "The realm is in chaos. Demand release from [recipient.GetShortUIName] so you can establish an independent domain. Even if refused, you will still break away, but they may wage war to suppress your rebellion."
 hd_dc_demand_independence_interaction_notification:0 "In these troubled times, I wish to establish an independent domain. My lord, I ask you to grant this."
 hd_dc_demand_independence_decline_tt:0 "[actor.GetShortUIName|U] will still become independent. For the next ten years, whoever holds [recipient.GetShortUINamePossessive] domain may wage a #V War to Suppress Rebellion#!. Victory restores the rebel and their lands to vassalage and imprisons the rebel."
 hd_dc_demand_indep_ai_strength_1:0 "Their forces are at least as strong as mine"
 hd_dc_demand_indep_ai_strength_05:0 "Their forces exceed half of mine"
 hd_dc_demand_indep_ai_strength_weak:0 "Their forces are less than a quarter of mine"
 HD_DC_TRUCE_DEMAND_INDEPENDENCE:0 "Independence Granted"
 hd_dc_demand_independence_interaction_desc_sub:0 "The realm is in chaos. Ask [recipient.GetShortUIName] to release you from their command so you can serve their superior directly. You will transfer to that superior whether they agree or not, but will not become independent."
 hd_dc_demand_indep_recently_submitted_tt:0 "You submitted recently and cannot seek to leave within five years"
 hd_dc_demand_indep_min_size_tt:0 "Must hold at least two counties"
 hd_dc_left_for_overlord_opinion:0 "Abandoned Me for My Superior"
 hd_dc_demand_independence_interaction_notification_sub:0 "In these troubled times, I wish to serve your superior directly. My lord, I ask you to grant this."
