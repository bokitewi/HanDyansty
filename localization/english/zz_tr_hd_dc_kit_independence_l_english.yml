l_english:
 hd_dc_demand_independence_interaction:0 "Demand Independence"
 hd_dc_demand_independence_interaction_desc:0 "The realm is in chaos. Demand that [recipient.GetShortUIName] release you from vassalage so you may stand on your own. If refused, you will still break away, but they may raise troops to punish the rebel."
 hd_dc_demand_independence_interaction_notification:0 "In these chaotic times, I wish to stand on my own. I hope my lord will grant it."
 hd_dc_demand_independence_decline_tt:0 "[actor.GetShortUIName|U] will still break away; for the next ten years, the master of [recipient.GetShortUINamePossessive] domain may raise troops in the name of #V Punishing the Rebel#!, and if victorious, force them to submit again along with their lands and throw them in prison."
 hd_dc_demand_indep_ai_strength_1:0 "Their forces are no weaker than mine"
 hd_dc_demand_indep_ai_strength_05:0 "Their forces are more than half of mine"
 hd_dc_demand_indep_ai_strength_weak:0 "Their forces are less than a quarter of mine"
 HD_DC_TRUCE_DEMAND_INDEPENDENCE:0 "Independence Granted"
 hd_dc_demand_independence_interaction_desc_sub:0 "The realm is in chaos. Ask [recipient.GetShortUIName] to release you from their service so you may serve their overlord directly. Whether they agree or not, you will transfer to their overlord, but you will not become independent."
 hd_dc_demand_indep_recently_submitted_tt:0 "Recently submitted; cannot seek to leave within five years"
 hd_dc_demand_indep_min_size_tt:0 "Must hold at least two counties"
 hd_dc_left_for_overlord_opinion:0 "Left Me for My Overlord"
 hd_dc_demand_independence_interaction_notification_sub:0 "In these chaotic times, I wish to serve your overlord directly. I hope my lord will grant it."
