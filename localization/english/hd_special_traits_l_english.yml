 trait_hd_wangzuo_zhicai:0 "Born to Counsel Kings"
 trait_hd_wangzuo_zhicai_desc:0 "This character has the ability to sustain a ruler's great enterprise and oversee the affairs of government: skilled in administration and finance at home, accomplished in diplomacy abroad, and adept at political strategy. Entrusted with a region, they ensure its government runs smoothly."
 hd_wangzuo_governor_efficiency_desc:0 "Born to Counsel Kings"
 trait_hd_laodang_yizhuang:0 "Vigorous in Old Age"
 trait_hd_laodang_yizhuang_desc:0 "Though advanced in years, this character has lost none of their strength. In armor and on horseback, they are as hale and formidable as ever."
