l_english:
 # Southern Migration of the Gentry - core framework (docs/衣冠南渡_重做设计.md §5.12: situation/groups/phases/parameters/modifier sets/catalysts/modifiers/opinions/game rule/hegemony title)

 # ---------- Game rule ----------
 rule_hd_yiguan_rule:0 "Southern Migration of the Gentry"
 setting_hd_yiguan_rule_on:0 "#high On#!"
 setting_hd_yiguan_rule_on_desc:0 "Once a northern Hu power has taken Luoyang and Chang'an, the realm enters the Southern Migration of the Gentry: the Gentry flee south, Northern Expeditions, campaigns against the Hu and uprisings follow one upon another, and the situation swings between Flight, Conflict and Stalemate until the Central Plains are restored, Hu and Han are fused, or the Gentry fall."
 setting_hd_yiguan_rule_off:0 "#high Off#!"
 setting_hd_yiguan_rule_off_desc:0 "The Southern Migration of the Gentry will not occur."

 # ---------- Situation ----------
 situation_type_hd_yiguan_nandu:0 "Southern Migration of the Gentry"
 situation_type_hd_yiguan_nandu_desc:0 "Hu horsemen sweep south and both capitals fall. The Gentry of the north, leading old and young, cross the Huai and the Yangtze and flee to Jiangzuo; the Han who remain in their homeland endure humiliation under Hu rule to survive, hold out in fortified wubao, or gather the people and rise in revolt.\n\nSouthern rulers take in refugees, establish émigré provinces and commanderies, and march north; northern Hu rulers waver between repression and conciliation, some adopting Han institutions, others forcing Hu-ization upon their subjects. The realm swings between flight, war and standoff, and all will end in the #V Restoration of the Central Plains#!, the #V Fusion of Hu and Han#! or the #V Fall of the Gentry#!."
 situation_hd_yiguan_nandu:0 "$situation_type_hd_yiguan_nandu$"
 situation_hd_yiguan_nandu_desc:0 "[SITUATION.GetType.GetDesc]"

 hd_yiguan_nandu_sub_region_hd_yiguan_core:0 "Central Plains and Jiangzuo"
 hd_yiguan_nandu_sub_region_hd_yiguan_core_desc:0 "The eight northern provinces (Si, Ji, You, Bing, Qing, Yan, Xu and Yu), together with Jing and Yang Provinces"

 # ---------- Participant groups ----------
 hd_yiguan_nandu_participant_group_hd_yiguan_grp_sinicized:0 "Sinicized Regimes"
 hd_yiguan_nandu_participant_group_hd_yiguan_grp_sinicized_desc:0 "Independent [rulers|E] whose dynasty has completed Sinicization Reform, whose capital lies in the eight northern provinces or in Jing or Yang, and whose primary title is duke tier or higher. Sinicized Regimes count as Huaxia, and the Han under their rule are not counted as occupied"
 hd_yiguan_nandu_participant_group_hd_yiguan_grp_hu:0 "Hu Regimes"
 hd_yiguan_nandu_participant_group_hd_yiguan_grp_hu_desc:0 "Independent [rulers|E] not of Huaxia heritage and not yet sinicized, whose capital lies in the eight northern provinces or in Jing or Yang, and whose primary title is duke tier or higher"
 hd_yiguan_nandu_participant_group_hd_yiguan_grp_south:0 "Southern Regimes"
 hd_yiguan_nandu_participant_group_hd_yiguan_grp_south_desc:0 "Independent [rulers|E] of Huaxia heritage whose capital lies in Jing or Yang Province and whose primary title is duke tier or higher"
 hd_yiguan_nandu_participant_group_hd_yiguan_grp_north_han:0 "Northern Han"
 hd_yiguan_nandu_participant_group_hd_yiguan_grp_north_han_desc:0 "Independent [rulers|E] of Huaxia heritage whose capital still lies in the eight northern provinces and whose primary title is duke tier or higher"
 hd_yiguan_nandu_participant_group_hd_yiguan_grp_occupied:0 "Han of the Occupied North"
 hd_yiguan_nandu_participant_group_hd_yiguan_grp_occupied_desc:0 "Huaxia [vassals|E] of count tier or higher under a Hu liege whose capital lies in the eight northern provinces, as well as landless Gentry whose liege is Hu and whose estate lies in the north"
 hd_yiguan_nandu_hd_yiguan_grp_sinicized:0 "Southern Migration: #weak Sinicized Regime#!"
 hd_yiguan_nandu_hd_yiguan_grp_hu:0 "Southern Migration: #weak Hu Regime#!"
 hd_yiguan_nandu_hd_yiguan_grp_south:0 "Southern Migration: #weak Southern Regime#!"
 hd_yiguan_nandu_hd_yiguan_grp_north_han:0 "Southern Migration: #weak Northern Han#!"
 hd_yiguan_nandu_hd_yiguan_grp_occupied:0 "Southern Migration: #weak Han of the Occupied North#!"

 # ---------- Phases ----------
 hd_yiguan_phase_taowang:0 "Flight"
 hd_yiguan_phase_taowang_desc_short:0 "Wherever the Hu horsemen ride, cities are left in ruins, and the people of the north flee south in droves."
 hd_yiguan_phase_taowang_desc:0 "$hd_yiguan_phase_taowang_desc_short$\n\nThe Hu are at the height of their strength, the Han regimes fall back defeat after defeat, and the great clans move south one after another. When flight has gone on long enough, men's hearts turn to war, and #V the passage of time#! alone will push the realm toward Conflict.\n\nAs uprisings in the occupied north, Hu wars on the Han and the Hu-ization of counties multiply, the situation will shift to #V Conflict#!; as peace between Hu and Han, Sinicization Reform and the settlement of émigrés take hold, it will shift to #V Stalemate#!.\n\nDuring this phase, a Hu Regime that already holds the Central Plains may proclaim the #V Fall of the Gentry#!."
 hd_yiguan_nandu_hd_yiguan_phase_taowang_situation_phase:0 "[SITUATION_PHASE_TYPE.GetName]"
 hd_yiguan_nandu_hd_yiguan_phase_taowang_situation_phase_desc:0 "$hd_yiguan_phase_taowang_desc$"
 hd_yiguan_phase_chongtu:0 "Conflict"
 hd_yiguan_phase_chongtu_desc_short:0 "North and South are at war; Northern Expeditions, campaigns against the Hu and uprisings follow one upon another."
 hd_yiguan_phase_chongtu_desc:0 "$hd_yiguan_phase_chongtu_desc_short$\n\nSouthern Regimes may launch a Northern Expedition, the Northern Han may campaign to recover the north, and émigré clans in Jiangzuo may return north in arms. When war drags on, the armies grow weary, and #V the passage of time#! will push the realm toward Stalemate.\n\nIf the two capitals fall again or the Han regimes suffer defeat after defeat, the situation will fall back to #V Flight#!; as peace and resettlement spread, it will shift to #V Stalemate#!.\n\nDuring this phase, a Southern Regime or the Northern Han, once they have recovered the Central Plains, may proclaim the #V Restoration of the Central Plains#!."
 hd_yiguan_nandu_hd_yiguan_phase_chongtu_situation_phase:0 "[SITUATION_PHASE_TYPE.GetName]"
 hd_yiguan_nandu_hd_yiguan_phase_chongtu_situation_phase_desc:0 "$hd_yiguan_phase_chongtu_desc$"
 hd_yiguan_phase_tingzhi:0 "Stalemate"
 hd_yiguan_phase_tingzhi_desc_short:0 "North and South hold each other at bay across the Yangtze; Hu and Han live intermingled, each tending to their own affairs."
 hd_yiguan_phase_tingzhi_desc:0 "$hd_yiguan_phase_tingzhi_desc_short$\n\nThe fighting subsides. The south settles its refugees and puts its household registers in order, while the Hu rulers of the north may seize the moment to push Sinicization or Hu-ization. Stalemate #V does not change with the passage of time#!; only war and upheaval can break the deadlock.\n\nIf the Hu storm Han cities once more, the situation will fall back to #V Flight#!; if the Hu make war on the Han, the occupied north rises, or Hu-ization is enforced, it will shift to #V Conflict#!.\n\nDuring this phase, if Sinicized Regimes together hold the Central Plains, they may proclaim the #V Fusion of Hu and Han#!."
 hd_yiguan_nandu_hd_yiguan_phase_tingzhi_situation_phase:0 "[SITUATION_PHASE_TYPE.GetName]"
 hd_yiguan_nandu_hd_yiguan_phase_tingzhi_situation_phase_desc:0 "$hd_yiguan_phase_tingzhi_desc$"

 # ---------- Phase effects (modifier sets) ----------
 hd_yiguan_war_effects:0 "Military"
 hd_yiguan_war_effects_concept:0 "[war|E]"
 hd_yiguan_realm_effects:0 "Civil Administration"
 hd_yiguan_realm_effects_concept:0 "[realm|E]"

 # ---------- Parameters ----------
 situation_parameter_hd_yiguan_can_beifa:0 "Can use the #V Northern Expedition#! [casus_belli|E] to recover a northern province from a Hu Regime or Sinicized Regime"
 situation_parameter_hd_yiguan_can_taohu:0 "Can use the #V Campaign to Recover the North#! [casus_belli|E] to recover a commandery from a bordering Hu Regime"
 situation_parameter_hd_yiguan_can_reform:0 "Independent rulers of kingdom tier or higher may take the #V Enact Sinicization Reform#! or #V Impose Hu-ization#! [decision|E]"
 situation_parameter_hd_yiguan_beihuan_open:0 "Émigré Gentry who moved south may #V Return North in Arms#!"

 # ---------- Catalysts ----------
 catalyst_hd_yiguan_beifa_declared:0 "Royal Army Marches North"
 catalyst_hd_yiguan_beifa_declared_desc:0 "A Southern Regime marches north under the Northern Expedition [casus_belli|E]"
 catalyst_hd_yiguan_beifa_won:0 "Northern Expedition Triumphs"
 catalyst_hd_yiguan_beifa_won_desc:0 "A Southern Regime wins its Northern Expedition and recovers northern provinces and commanderies"
 catalyst_hd_yiguan_taohu_declared:0 "Campaign to Recover the North"
 catalyst_hd_yiguan_taohu_declared_desc:0 "The Northern Han go to war against a Hu Regime under the Campaign to Recover the North [casus_belli|E]"
 catalyst_hd_yiguan_taohu_won:0 "Campaign Against the Hu Triumphs"
 catalyst_hd_yiguan_taohu_won_desc:0 "The Northern Han win their Campaign to Recover the North and retake lost lands"
 catalyst_hd_yiguan_beihuan:0 "Return North in Arms"
 catalyst_hd_yiguan_beihuan_desc:0 "Émigré Gentry who moved south raise troops and fight their way back to their homeland"
 catalyst_hd_yiguan_uprising:0 "Uprising in the Occupied North"
 catalyst_hd_yiguan_uprising_desc:0 "The Han of the Occupied North take up arms against their Hu liege"
 catalyst_hd_yiguan_huhua_decreed:0 "Hu-ization Decreed"
 catalyst_hd_yiguan_huhua_decreed_desc:0 "A Hu Regime decrees Hu-ization"
 catalyst_hd_yiguan_huhua_county:0 "Hu Customs Adopted"
 catalyst_hd_yiguan_huhua_county_desc:0 "Under Hu-ization, yet another county takes up Hu customs"
 catalyst_hd_yiguan_hu_attacks_han:0 "Hu Horsemen Strike South"
 catalyst_hd_yiguan_hu_attacks_han_desc:0 "A Hu Regime declares war on a Southern Regime or the Northern Han"
 catalyst_hd_yiguan_time_to_conflict:0 "Endless Strife"
 catalyst_hd_yiguan_time_to_conflict_desc:0 "Yearly change: flight has gone on long, and men's hearts turn to war"
 catalyst_hd_yiguan_peace:0 "Hu-Han Peace"
 catalyst_hd_yiguan_peace_desc:0 "A war between a Hu Regime or Sinicized Regime and a Han regime ends in a white peace or with one side suing for peace"
 catalyst_hd_yiguan_reform_step:0 "Sinicization Reform"
 catalyst_hd_yiguan_reform_step_desc:0 "A Hu ruler's Sinicization Reform advances a step"
 catalyst_hd_yiguan_reform_done:0 "Sinicization Complete"
 catalyst_hd_yiguan_reform_done_desc:0 "A Hu ruler completes Sinicization Reform"
 catalyst_hd_yiguan_qiaozhi:0 "Émigré Land Grant"
 catalyst_hd_yiguan_qiaozhi_desc:0 "Émigré Clans who moved south are granted land and build new lives in new lands"
 catalyst_hd_yiguan_tuduan:0 "Tuduan Registration Reform"
 catalyst_hd_yiguan_tuduan_desc:0 "A ruler carries out the Tuduan Registration Reform, entering émigrés into the registers of the places where they live"
 catalyst_hd_yiguan_intermarriage:0 "Hu-Han Intermarriage"
 catalyst_hd_yiguan_intermarriage_desc:0 "A Hu ruler and a Han ruler are joined by marriage"
 catalyst_hd_yiguan_beifa_failed:0 "Northern Expedition Falters"
 catalyst_hd_yiguan_beifa_failed_desc:0 "A Southern Regime's Northern Expedition ends in a white peace or defeat"
 catalyst_hd_yiguan_rising_failed:0 "Righteous Cause Fails"
 catalyst_hd_yiguan_rising_failed_desc:0 "An uprising in the occupied north or a return north in arms ends in failure"
 catalyst_hd_yiguan_time_to_stagnation:0 "War-Weary Armies"
 catalyst_hd_yiguan_time_to_stagnation_desc:0 "Yearly change: the fighting has dragged on, and men are sick of war"
 catalyst_hd_yiguan_capital_lost:0 "Old Capital Falls"
 catalyst_hd_yiguan_capital_lost_desc:0 "Luoyang or Chang'an falls into Hu hands"
 catalyst_hd_yiguan_han_capital_taken:0 "Capital Lost"
 catalyst_hd_yiguan_han_capital_taken_desc:0 "The Hu capture the capital of a Han regime"
 catalyst_hd_yiguan_han_defeated:0 "Royal Army Routed"
 catalyst_hd_yiguan_han_defeated_desc:0 "The Hu defeat a Han regime in war"
 catalyst_hd_yiguan_han_ruler_slain:0 "Sovereign Befallen"
 catalyst_hd_yiguan_han_ruler_slain_desc:0 "An independent Han ruler is killed or captured by the Hu"
 catalyst_hd_yiguan_gentry_flee:0 "Gentry Flee South"
 catalyst_hd_yiguan_gentry_flee_desc:0 "Northern Gentry abandon their lands and move south with their whole clan"
 catalyst_hd_yiguan_beifa_declared_delay:0 "Northern Expedition Sets Out"
 catalyst_hd_yiguan_beifa_declared_delay_desc:0 "During Conflict a Southern Regime launches another Northern Expedition; with war still raging, the situation can hardly settle into Stalemate"
 catalyst_hd_yiguan_beifa_won_delay:0 "Northern Expedition Triumphs"
 catalyst_hd_yiguan_beifa_won_delay_desc:0 "During Conflict a Northern Expedition succeeds and men's hearts turn to war; the situation can hardly settle into Stalemate"
 catalyst_hd_yiguan_taohu_declared_delay:0 "Campaign Against the Hu Sets Out"
 catalyst_hd_yiguan_taohu_declared_delay_desc:0 "During Conflict the Northern Han raise another campaign against the Hu; the situation can hardly settle into Stalemate"
 catalyst_hd_yiguan_taohu_won_delay:0 "Campaign Against the Hu Triumphs"
 catalyst_hd_yiguan_taohu_won_delay_desc:0 "During Conflict a Campaign to Recover the North succeeds; the situation can hardly settle into Stalemate"
 catalyst_hd_yiguan_beihuan_delay:0 "Return North in Arms"
 catalyst_hd_yiguan_beihuan_delay_desc:0 "During Conflict Émigré Gentry return north in arms; the situation can hardly settle into Stalemate"
 catalyst_hd_yiguan_reform_step_delay_c:0 "Sinicization Advances"
 catalyst_hd_yiguan_reform_step_delay_c_desc:0 "During Stalemate a Hu ruler advances Sinicization Reform; with Hu and Han at peace, Conflict can hardly flare up again"
 catalyst_hd_yiguan_reform_done_delay_c:0 "Sinicization Complete"
 catalyst_hd_yiguan_reform_done_delay_c_desc:0 "During Stalemate a Hu ruler completes Sinicization Reform; with Hu and Han at peace, Conflict can hardly flare up again"
 catalyst_hd_yiguan_reform_step_delay_t:0 "Sinicization Advances"
 catalyst_hd_yiguan_reform_step_delay_t_desc:0 "During Stalemate a Hu ruler advances Sinicization Reform; the situation can hardly fall back into Flight"
 catalyst_hd_yiguan_reform_done_delay_t:0 "Sinicization Complete"
 catalyst_hd_yiguan_reform_done_delay_t_desc:0 "During Stalemate a Hu ruler completes Sinicization Reform; the situation can hardly fall back into Flight"

 # ---------- Modifiers ----------
 hd_yiguan_nanlai_county_modifier:0 "Southbound Households"
 hd_yiguan_nanlai_county_modifier_desc:0 "Northern refugees have come leading old and young; wasteland is gradually opened and households grow by the day."
 hd_yiguan_nanlai_big_county_modifier:0 "Southbound Households"
 hd_yiguan_nanlai_big_county_modifier_desc:0 "Every official boat ferried the northerners across; for a time the riverbank teemed with people and every barren field was tilled."
 hd_yiguan_qiaojun_county_modifier:0 "Émigré Commandery"
 hd_yiguan_qiaojun_county_modifier_desc:0 "Émigré northern commanderies and counties have been established here to settle refugees, with separate household registers and lighter taxes and corvée."
 hd_yiguan_liusan_county_modifier:0 "Scattered Households"
 hd_yiguan_liusan_county_modifier_desc:0 "The people have fled south together; nine homes in ten stand empty and the fields lie waste."
 hd_yiguan_wubao_county_modifier:0 "Wubao Fortresses"
 hd_yiguan_wubao_county_modifier_desc:0 "Local magnates have built fortified wubao for self-defense, where whole clans dwell together beyond the reach of Hu horsemen."
 hd_yiguan_buqu_modifier:0 "Refugee Retainers"
 hd_yiguan_buqu_modifier_desc:0 "This character has enrolled northern refugees as private retainers, providing ample manpower."
 hd_yiguan_fenzhi_modifier:0 "Separate Rule of Hu and Han"
 hd_yiguan_fenzhi_modifier_desc:0 "Hu and Han each have their own officials and follow their own customs."
 hd_yiguan_zhuoyong_modifier:0 "Promoting Han Scholars"
 hd_yiguan_zhuoyong_modifier_desc:0 "This character has brought Han Gentry into their administration, relying on their mastery of statutes and rites."
 hd_yiguan_qiangya_modifier:0 "Suppressing the Han"
 hd_yiguan_qiangya_modifier_desc:0 "This character crushes the Han with harsh laws and cruel punishments, and all look upon them askance."
 hd_yiguan_beifu_commander_modifier:0 "Beifu Commander"
 hd_yiguan_beifu_commander_modifier_desc:0 "The Beifu generals have been ordered to reorganize the army, and its elite troops grow by the day."
 hd_yiguan_beifu_yongbing_modifier:0 "Beifu Ascendancy"
 hd_yiguan_beifu_yongbing_modifier_desc:0 "The Beifu generals command powerful armies, and the court's orders scarcely reach Jingkou."
 hd_yiguan_pianan_modifier:0 "Content in Jiangzuo"
 hd_yiguan_pianan_modifier_desc:0 "With the Central Plains beyond recovery, ruler and ministers seek only to guard their borders and give the people rest in Jiangnan."
 hd_yiguan_ruzhu_modifier:0 "Master of the Central Plains"
 hd_yiguan_ruzhu_modifier_desc:0 "This character holds the old lands of the Central Plains, and their renown spreads far."
 hd_yiguan_ruzhu_half_modifier:0 "Master of the Central Plains"
 hd_yiguan_ruzhu_half_modifier_desc:0 "Now that the Hu hold the Central Plains, their fellow Hu tribes share in that renown."
 hd_yiguan_heliu_modifier:0 "Fusion of Hu and Han"
 hd_yiguan_heliu_modifier_desc:0 "The barriers between Hu and Han gradually fade, and both are registered subjects alike."
 hd_yiguan_zhongxing_modifier:0 "Restoration"
 hd_yiguan_zhongxing_modifier_desc:0 "The royal army has recovered the old capital, and the realm looks up to the Restorer."
 hd_yiguan_beiding_modifier:0 "Royal Army Pacifies the North"
 hd_yiguan_beiding_modifier_desc:0 "This character took part in the campaign to recover the Central Plains, and their fame spreads far."
 hd_yiguan_occupied_county_modifier:0 "Occupied"
 hd_yiguan_occupied_county_modifier_desc:0 "This land has fallen into Hu hands. The Han people cling to life under foreign rule, the fields lie waste, and every heart yearns for the Han."
 hd_yiguan_occupied_fading_county_modifier:0 "Lingering Scars of Occupation"
 hd_yiguan_occupied_fading_county_modifier_desc:0 "Though the Central Plains now belong wholly to the Hu, the ravages of war and upheaval have yet to heal, and they will fade only after a generation has passed."
 hd_yiguan_wangshi_county_modifier:0 "Royal Army Pacifies the North"
 hd_yiguan_wangshi_county_modifier_desc:0 "The royal army has recovered this land; the remaining people welcomed it with baskets of food and jugs of drink, and scattered households return one after another."
 hd_yiguan_liumin_county_modifier:0 "Refugees Flock In"
 hd_yiguan_liumin_county_modifier_desc:0 "Hearing the news, refugees from every quarter come to settle, clearing wasteland and founding villages, and manpower grows plentiful in turn."

