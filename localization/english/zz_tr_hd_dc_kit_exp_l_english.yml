l_english:
 hd_dc_exp_frontier_cb:0 "Frontier Expansion"
 hd_dc_exp_frontier_cb_name:0 "Frontier Expansion"
 hd_dc_exp_frontier_cb_war_name:0 "[ATTACKER.GetShortUINamePossessive] Frontier War"
 hd_dc_exp_frontier_cb_victory_desc_attacker:0 "You will seize every county belonging to [defender.GetHerHim] in all of [defender.GetShortUINamePossessive] commanderies bordering your realm, and a ten-year truce with [defender.GetHerHim] will follow."
 hd_dc_exp_frontier_cb_victory_desc:0 "[attacker.GetShortUIName|U] seizes every county belonging to [defender.GetHerHim] in all of [defender.GetShortUINamePossessive] commanderies bordering the Celestial realm, and both sides observe a ten-year truce."
 hd_dc_exp_frontier_cb_white_peace_desc:0 "The two states lay down arms, each keeping to its borders."
 hd_dc_exp_frontier_cb_defeat_desc:0 "The imperial army is defeated, and [attacker.GetShortUIName|U] must pay reparations to [defender.GetShortUIName]."
 hd_dc_exp_investiture_interaction:0 "Investiture of a Tributary"
 hd_dc_exp_investiture_interaction_desc:0 "Send an envoy bearing rich gifts to invest [recipient.GetShortUINameNoTooltip], bidding them adopt the Celestial calendar and become your [tributary|E]."
 hd_dc_exp_investiture_interaction_notification:0 "Celestial envoys arrive bearing an edict and gifts, seeking to invest [recipient.GetShortUIName] as a vassal state."
 hd_dc_exp_investiture_cooldown_tt:0 "[recipient.GetShortUINameNoTooltip|U] recently refused Celestial investiture and will not accept it again for several years"
 hd_dc_exp_investiture_reason_gift:0 "Celestial gifts: $VALUE|=+0$"
 hd_dc_exp_investiture_reason_weak:0 "Less than half the Son of Heaven's strength: $VALUE|=+0$"
 hd_dc_exp_investiture_reason_strong:0 "Stronger than the Son of Heaven: $VALUE|=+0$"
 hd_dc_exp_investiture_reason_king:0 "Is a king: $VALUE|=+0$"
 hd_dc_exp_investiture_reason_emperor:0 "Is an emperor: $VALUE|=+0$"
 hd_dc_exp_investiture_reason_rival:0 "Rival of the Son of Heaven: $VALUE|=+0$"
 hd_dc_exp_investiture_reason_nemesis:0 "Nemesis of the Son of Heaven: $VALUE|=+0$"
 hd_dc_exp_investiture_reason_proud:0 "Arrogant or ambitious: $VALUE|=+0$"
 hd_dc_exp_investiture_accepted_opinion:0 "Accepted Celestial Investiture"
 hd_dc_exp_investiture_declined_opinion:0 "Refused Celestial Investiture"
 hd_dc_exp_tuntian_decision:0 "Military Farming"
 hd_dc_exp_tuntian_decision_desc:0 "The frontier lies in vast stretches of wasteland, and shipping supplies back and forth for the garrisons costs beyond counting. Recruit soldiers and civilians to farm the land where they stand, tilling and guarding at once, and grain will suffice without transport."
 hd_dc_exp_tuntian_decision_tooltip:0 "Establish military farms in a frontier province"
 hd_dc_exp_tuntian_decision_confirm:0 "Establish Military Farms"
 hd_dc_exp_tuntian_border_tt:0 "Your realm has at least one frontier county bordering the outside"
 hd_dc_exp_tuntian_decision_effect_tt:0 "Choose a frontier province to establish military farms, where soldiers and civilians in the counties of your realm will till and guard at once."
 hd_dc_exp_tuntian_apply_tt:0 "Every [county|E] of your realm in that province"
 hd_dc_exp_tuntian_modifier:0 "Military Farms"
 hd_dc_exp_tuntian_modifier_desc:0 "Frontier soldiers and civilians till and guard at once; provisions are ample and recruits plentiful."
 hd_dc_exp_military_merit_decision:0 "Ennoble for Military Merit"
 hd_dc_exp_military_merit_decision_desc:0 "The imperial army has just crushed a foreign foe, and merit must be rewarded. Choose one of the commanders who led troops in this war for promotion and ennoblement."
 hd_dc_exp_military_merit_decision_tooltip:0 "Ennoble a meritorious commander"
 hd_dc_exp_military_merit_decision_confirm:0 "Reward Merit"
 hd_dc_exp_merit_window_tt:0 "Has defeated a power outside All Under Heaven within the last year"
 hd_dc_exp_merit_candidate_tt:0 "At least one commander from that war is still in your realm"
 hd_dc_exp_merit_decision_effect_tt:0 "Choose one of the commanders of this war for promotion and ennoblement, deepening the bond between sovereign and subject."
 hd_dc_exp_merit_open_peerage_tt:0 "This person holds no rank yet but is worthy of enfeoffment; you may personally choose their fief."
 hd_dc_exp_merit_window_toast:0 "Triumphant Return"
 hd_dc_exp_merit_window_toast_desc:0 "Take the occasion of the triumph to reward the meritorious commanders; delay, and the rewards will lose their moment."
 hd_dc_exp_military_merit_modifier:0 "Military Merit"
 hd_dc_exp_military_merit_modifier_desc:0 "Rewarded by the Son of Heaven for feats in battle, this person is famed throughout the age."
 hd_dc_exp_military_merit_opinion:0 "Ennobled for Military Merit"
 hd_dc_exp.0100.t:0 "Establish Military Farms"
 hd_dc_exp.0100.desc:0 "Memorials from the Grand Minister of Agriculture and the Court Architect pile high on the desk: the frontier lies in vast stretches of wasteland, and shipping supplies back and forth for the garrisons costs beyond counting. If soldiers and civilians are recruited to farm where they stand, tilling and guarding at once, grain will suffice without transport.\n\nAmong the frontier provinces, where should military farms be established first?"
 hd_dc_exp.0100.a:0 "Establish military farms in [hd_dc_exp_slot_1.GetName]"
 hd_dc_exp.0100.b:0 "Establish military farms in [hd_dc_exp_slot_2.GetName]"
 hd_dc_exp.0100.c:0 "Establish military farms in [hd_dc_exp_slot_3.GetName]"
 hd_dc_exp.0100.d:0 "Establish military farms in [hd_dc_exp_slot_4.GetName]"
 hd_dc_exp.0100.e:0 "No frontier land remains to farm; return the funds to the treasury"
 hd_dc_exp.0200.t:0 "Rewarding Merit"
 hd_dc_exp.0200.desc:0 "The imperial army returns in triumph, and the generals line up below the steps. Many in this campaign slew enemy commanders and seized their banners, yet honors are precious only when given to the right man — the Son of Heaven should personally choose the most distinguished among them for special favor."
 hd_dc_exp.0200.a:0 "Reward [hd_dc_exp_merit_1.GetShortUIName]"
 hd_dc_exp.0200.b:0 "Reward [hd_dc_exp_merit_2.GetShortUIName]"
 hd_dc_exp.0200.c:0 "Reward [hd_dc_exp_merit_3.GetShortUIName]"
 hd_dc_exp.0200.d:0 "Reward [hd_dc_exp_merit_4.GetShortUIName]"
 hd_dc_exp.0200.e:0 "The generals have died or departed; there is no one to reward"
