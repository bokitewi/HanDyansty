l_english:
 hd_court_puppet:0 "Captive Son of Heaven"
 hd_court_puppet_desc:0 "The Son of Heaven still sits upon the throne, but his edicts now come from your headquarters. In his name you may make war, grant titles, imprison and pardon."
 puppet_action_description_hd_court_puppet_action_grant_titles:0 "Use the #V [GetPlayer.GetPlayerInteractionName('grant_titles_interaction')]#! [interaction|E] in the name of the Son of Heaven to grant [titles|E] held by the Son of Heaven to others"
 puppet_action_description_hd_court_puppet_action_revoke_title:0 "Use #V [GetPlayer.GetPlayerInteractionName('revoke_title_interaction')]#! [interaction|E] in the name of the Son of Heaven to reclaim [titles|E] from the Son of Heaven's [vassals|E]"
 hd_court_puppet_placeholder_interaction:0 "Hold the Son of Heaven Hostage"
 hd_court.0001.t:0 "The Son of Heaven in the Dust"
 hd_court.0001.desc:0 "By the time word arrived from the capital, the gates were already manned by a new garrison. [hd_court_new_regent.GetTitledFirstName]'s troops had marched into the palace city, and [hd_court_emperor.GetTitledFirstName]'s carriage had been escorted to a new temporary residence.\n\nThe edicts are still written in the voice of the Son of Heaven, and still bear his seal. Yet everyone understands that from now on, another hand holds the brush."
 hd_court.0001.a:0 "Whoever holds the Son of Heaven, the realm looks to."
 hd_court_abandon_emperor_decision:0 "Abandon the Son of Heaven and Rule Independently"
 hd_court_abandon_emperor_decision_desc:0 "While I keep the Son of Heaven, the lords dare not openly oppose me, yet this banner also binds my hands and feet. The rites of the court, the glances of the ministers, the silent face of the Son of Heaven... perhaps it is time to hand it all back to him."
 hd_court_abandon_emperor_decision_tooltip:0 "Resign the regency and leave the Son of Heaven with your lands, ruling on your own"
 hd_court_abandon_emperor_decision_confirm:0 "Henceforth, each goes his own way!"
 hd_court_abandon_emperor_decision_effect_tt:0 "You resign as Chancellor and regent and leave the Son of Heaven with your own lands; the Son of Heaven will no longer be under your control"
 hd_court_abandoned_emperor_opinion:0 "Betrayed the Son of Heaven"
 hd_court_stance_zunhan_modifier:0 "Loyal to Han"
 hd_court_stance_zunhan_modifier_desc:0 "This person still honors the Han calendar and takes it as their duty to punish rebels and secure the Han."
 hd_court_stance_moni_modifier:0 "Treasonous"
 hd_court_stance_moni_modifier_desc:0 "In this person's eyes there is no longer a Han Son of Heaven, only the blades in their own hands."
 hd_court_declare_zunhan_decision:0 "Uphold the Han Calendar"
 hd_court_declare_zunhan_decision_desc:0 "Though the Han fortunes wane, the Son of Heaven still lives. I will honor his calendar, punish the disloyal, and secure the altars of state. At least, that is how the realm will see me."
 hd_court_declare_zunhan_decision_tooltip:0 "Proclaim loyalty to the House of Han and take up the duty of punishing rebels and securing the Han"
 hd_court_declare_zunhan_decision_confirm:0 "The House of Han must be upheld!"
 hd_court_declare_moni_decision:0 "Obey Edicts No More"
 hd_court_declare_moni_decision_desc:0 "These so-called edicts are merely a borrowed name for whoever holds the Son of Heaven hostage. Heaven's Mandate is not constant; it belongs to the virtuous, and virtue must be won with blade and spear."
 hd_court_declare_moni_decision_tooltip:0 "Proclaim that you will no longer heed the court's commands"
 hd_court_declare_moni_decision_confirm:0 "The realm belongs to the capable!"
 hd_court_stance_cooldown_tt:0 "You have declared your stance recently; it would be unwise to change it so soon"
 hd_court_grant_rank_interaction:0 "Grant a General's Title"
 hd_court_grant_rank_interaction_desc:0 "In the name of the court, grant [recipient.GetShortUIName] a general's title"
 hd_court_grant_rank_interaction_notification:0 "The court grants [recipient.GetShortUIName] a general's title"
 hd_court_already_has_rank_tt:0 "[recipient.GetShortUIName] already holds a general's title"
 hd_court_yaoling_interaction:0 "Nominal Governorship"
 hd_court_yaoling_interaction_desc:0 "In the name of the court, appoint [recipient.GetShortUIName] nominal governor of the province held by [secondary_recipient.GetShortUIName], giving them [claims|E] on its commanderies"
 hd_court_yaoling_interaction_notification:0 "The court appoints [recipient.GetShortUIName] nominal governor of a province"
 hd_court_order_campaign_interaction:0 "Decree a Campaign"
 hd_court_order_campaign_interaction_desc:0 "In the name of the court, order [recipient.GetShortUIName] to campaign against [secondary_recipient.GetShortUIName]"
 hd_court_order_campaign_interaction_notification:0 "The court orders [recipient.GetShortUIName] to campaign against [secondary_recipient.GetShortUIName]"
 hd_court_order_campaign_decline_tt:0 "Defying the edict will give the lords of the realm a pretext"
 hd_court_demand_tribute_interaction:0 "Demand Tribute"
 hd_court_demand_tribute_interaction_desc:0 "In the name of the court, order [recipient.GetShortUIName] to send coin and grain to the court"
 hd_court_demand_tribute_interaction_notification:0 "The court orders [recipient.GetShortUIName] to pay tribute"
 hd_court_emperor_prestige_tt:0 "The Son of Heaven needs enough [prestige|E] for the lords to take his edicts seriously"
 hd_court_request_campaign_interaction:0 "Request an Edict of Campaign"
 hd_court_request_campaign_interaction_desc:0 "Ask the court to issue an edict permitting you to campaign against [secondary_recipient.GetShortUIName]"
 hd_court_request_campaign_interaction_notification:0 "[actor.GetShortUIName] requests an edict to campaign against [secondary_recipient.GetShortUIName]"
 hd_court_return_land_interaction:0 "Present Land to the Court"
 hd_court_return_land_interaction_desc:0 "Return [target.GetName] to the Son of Heaven, for the court to enfeoff anew"
 hd_court_return_land_interaction_notification:0 "[actor.GetShortUIName] presents lands to the court"
 hd_court_reason_zunhan:0 "Loyal to the House of Han"
 hd_court_reason_moni:0 "Defies Han Edicts"
 hd_court_reason_friend_of_target:0 "On good terms with the target"
 hd_court_reason_rival_of_target:0 "At odds with the target"
 hd_court_reason_target_moni:0 "Target is a traitor"
 hd_court_reason_weaker_than_target:0 "Weaker than the target"
 hd_court_reason_at_war:0 "Currently at war"
 hd_court_reason_asker_zunhan:0 "Petitioner is loyal to the House of Han"
 hd_court_reason_target_friend_of_court:0 "Target is on good terms with the court"
 hd_court_reason_zunhan_to_emperor:0 "Willing to submit to the Son of Heaven"
 hd_court_reason_same_zunhan:0 "Both loyal to the House of Han"
 hd_court_reason_zunhan_vs_moni:0 "Ashamed to side with traitors"
 hd_court_reason_moni_vs_emperor:0 "Disdains submitting to the Son of Heaven"
 hd_court_defied_edict_modifier:0 "Defied an Edict"
 hd_court_defied_edict_modifier_desc:0 "This person refused to obey an edict, and the whole realm is watching how the court and the lords will treat them."
 hd_court_defied_edict_opinion:0 "Defied an Edict"
 hd_court_honored_by_court_opinion:0 "Favored by the Court"
 hd_court_returned_land_opinion:0 "Presented Land"
 hd_court_fengzhao_cb_victory_desc:0 "[attacker.GetShortUIName|U] seizes [defender.GetShortUINamePossessive] counties in the target commandery."
 hd_court_fengzhao_cb_white_peace_desc:0 "Both sides lay down their arms and make peace."
 hd_court_fengzhao_cb_defeat_desc:0 "[attacker.GetShortUIName|U] fails in the campaign and must pay reparations to [defender.GetShortUIName]."
 hd_court_suborn_interaction:0 "Secretly Win Over"
 hd_court_suborn_interaction_desc:0 "Secretly win over [recipient.GetShortUIName] with gold and silk, recruiting them as an accomplice for the day the powerful minister is struck down"
 hd_court_suborn_interaction_notification:0 "The Son of Heaven secretly wins over [recipient.GetShortUIName]"
 hd_court_suborn_exposed_tt:0 "#EMP If the powerful minister discovers this, he will only grow more wary of you.#!"
 hd_court_secret_edict_interaction:0 "Girdle Edict"
 hd_court_secret_edict_interaction_desc:0 "Sew a secret edict written in blood into a girdle and have it smuggled to [recipient.GetShortUIName], commanding them to raise troops against the traitor"
 hd_court_secret_edict_interaction_notification:0 "[recipient.GetShortUIName] has received the Son of Heaven's girdle edict"
 hd_court_secret_edict_exposed_tt:0 "#EMP Should the secret edict leak, someone in the palace will surely die for it.#!"
 hd_court_flee_interaction:0 "Flee"
 hd_court_flee_interaction_desc:0 "Slip out of the palace city by night and seek refuge with [recipient.GetShortUIName]"
 hd_court_flee_interaction_notification:0 "The Son of Heaven seeks to flee to [recipient.GetShortUIName]"
 hd_court_flee_success_tt:0 "If you escape, [recipient.GetShortUIName] will receive you in their lands and serve as your regent"
 hd_court_flee_failure_tt:0 "If intercepted, you will be watched even more closely"
 hd_court_closely_watched_tt:0 "You are being closely watched by the powerful minister"
 hd_court_reason_loyal:0 "Loyal to their liege"
 hd_court_reason_greedy:0 "Covets gold and silk"
 hd_court_reason_ambitious:0 "Harbors great ambition"
 hd_court_reason_rival_of_regent:0 "At odds with the powerful minister"
 hd_court_reason_weaker_than_regent:0 "Weaker than the powerful minister"
 hd_court_palace_coup_decision:0 "Purge the Powerful Minister"
 hd_court_palace_coup_decision_desc:0 "I have men among the palace gate guards, and men within the powerful minister's household as well. All that remains is the right moment: the day he enters the palace to present his memorials."
 hd_court_palace_coup_decision_tooltip:0 "Strike together with your secret accomplices and kill the powerful minister"
 hd_court_palace_coup_decision_confirm:0 "Today this traitor dies!"
 hd_court_palace_coup_decision_effect_tt:0 "#EMP Success means personal rule; failure means death for all your accomplices. The more accomplices you have and the more your [intrigue|E] exceeds the minister's, the better your odds.#!"
 hd_court_coup_supporters_tt:0 "Requires at least three living accomplices"
 hd_court_raise_guards_decision:0 "Recruit Personal Guards"
 hd_court_raise_guards_decision_desc:0 "The palace guards have been replaced time and again, and not one of them is mine. If I could pick a few brave men myself to stand watch at my side, at least I could sleep more soundly at night."
 hd_court_raise_guards_decision_tooltip:0 "Recruit two valiant warriors into the palace guard, who may later become accomplices in purging the powerful minister"
 hd_court_raise_guards_decision_confirm:0 "Choose the bravest to guard the palace!"
 hd_court_guards_cooldown_tt:0 "You have recruited guards recently"
 hd_court_closely_watched_modifier:0 "Closely Watched"
 hd_court_closely_watched_modifier_desc:0 "Everyone around this person may be the eyes and ears of the powerful minister."
 hd_court_restored_emperor_opinion:0 "Restored Rule to Me"
 hd_court_plotted_against_opinion:0 "Plotted Against Me"
 hd_court_suspicious_opinion:0 "Suspicious"
 hd_court.0010.t:0 "Welcoming Back the Son of Heaven"
 hd_court.0010.desc:0 "The traitors are broken and the palace gates stand open. [hd_court_restore_emperor.GetTitledFirstName] stands before the hall, still clutching that girdle. He looks at you and says nothing.\n\nYou came at the command of his edict. Now the task the edict set is done, and what comes next, the edict does not say."
 hd_court.0010.a:0 "I came by your edict to punish the traitors; now I return rule to Your Majesty."
 hd_court.0010.b:0 "The realm is not yet settled; Your Majesty still needs someone at your side."
 hd_court.0011.t:0 "Ambush in the Hall"
 hd_court.0011.desc:0 "The powerful minister entered the palace to present his memorials as always, unbuckling his sword and removing his shoes as he climbed the steps of the hall. The armored men hidden behind the curtains rushed upon him.\n\nBefore the blood was even wiped away, you were back on the throne. This time, no one stands behind you speaking in your stead."
 hd_court.0011.a:0 "From this day, We rule in person."
 hd_court.0012.t:0 "The Plot Revealed"
 hd_court.0012.desc:0 "The appointed hour came, yet all was silent outside the hall. What arrived instead were the powerful minister's soldiers, marching your accomplices one by one past the hall.\n\nNo one came to seize you. The minister merely sent word: Your Majesty has been weary of late and should rest quietly in the palace."
 hd_court.0014.t:0 "Through the Gates by Night"
 hd_court.0014.desc:0 "The carriage left the city under cover of night, changing horses three times along the way. By daybreak, the escorting troops stood in ranks beside the road.\n\nAt last you have left that palace city. Whether the one who welcomes you ahead will become the next powerful minister is something you cannot afford to worry about now."
 hd_court.0014.a:0 "First, escape this cage."
 hd_court.0015.t:0 "Brought Back"
 hd_court.0015.desc:0 "The carriage had barely left the city gates when the pursuers caught up. Your attendants were taken away one by one, and you were 'invited' back to the palace.\n\nFrom that day on, the guards outside your chambers doubled."
 hd_court.0015.a:0 "Heaven does not aid me."
 hd_court_welcome_army_toast:0 "Welcoming the Royal Army"
 hd_court_welcome_army_toast_desc:0 "The city's elders bring baskets of food and jugs of drink to welcome the loyalist army."
 hd_court_depose_ceremonial_decision:0 "Reduce to a Figurehead"
 hd_court_depose_ceremonial_decision_desc:0 "Why bother building an altar for an abdication? The Son of Heaven can still live in the palace and receive the homage of the ministers as before; he simply need no longer concern himself with the affairs of the realm."
 hd_court_depose_ceremonial_decision_tooltip:0 "Take the Mandate yourself, leaving the former Son of Heaven an empty throne"
 hd_court_depose_ceremonial_decision_confirm:0 "Your Majesty should take good care of yourself."
 hd_court_depose_ceremonial_decision_effect_tt:0 "You take the Mandate of Heaven. The former Son of Heaven retires to a ceremonial throne, still styled Emperor but now your vassal, while every decree comes from you. This is even harder for the realm to accept than an abdication: those loyal to the Han will never accept you, and the lords will raise troops in the name of punishing a usurper"
 hd_court_regent_tenure_tt:0 "You have not been regent long, and hearts have not yet turned to you"
 hd_court_abdicated_title_name:0 "Shanyang"
 hd_court_ceremonial_title_name:0 "Emperor"
 hd_court_usurper_opinion:0 "Usurper of the Han"
 hd_court_proclaim_emperor_decision:0 "Usurp the Imperial Title"
 hd_court_proclaim_emperor_decision_desc:0 "The House of Han has long been in decline; the Son of Heaven is no more than a seal in another man's hand. I hold a region of my own, my troops are elite, my granaries full, and the people's hearts are with me. Why should I not proclaim a title of my own?"
 hd_court_proclaim_emperor_decision_tooltip:0 "Proclaim yourself Emperor and stand as an equal rival to the Han Son of Heaven"
 hd_court_proclaim_emperor_decision_confirm:0 "He who replaces the Han shall be Dangtu Gao!"
 hd_court_proclaim_emperor_decision_effect_tt:0 "You proclaim yourself Emperor, claiming half of the Han Son of Heaven's legitimacy; from now on you are a traitor, and neighbors loyal to the Han will campaign against you by edict"
 hd_court_proclaim_size_tt:0 "Must hold at least thirty counties"
 hd_court_proclaim_army_tt:0 "Your army must be no weaker than the Son of Heaven's (or that of whoever holds him)"
 hd_court_proclaim_popular_tt:0 "Most counties in your domain must support you"
 hd_court_pseudo_emperor_modifier:0 "Usurping Emperor"
 hd_court_pseudo_emperor_modifier_desc:0 "This person has proclaimed himself Emperor and stands as an equal rival to the Han Son of Heaven."
 hd_court_pseudo_emperor_opinion:0 "Usurping Pretender"
 hd_court.0020.t:0 "The Han Mandate Passes"
 hd_court.0020.desc:0 "The news spreads across the realm: [hd_court_usurper.GetTitledFirstName] has ascended the imperial throne, and [hd_court_deposed_emperor.GetTitledFirstName] has surrendered the Jade Seal.\n\nSome say it is the will of Heaven; others call it usurpation. The provinces and commanderies watch and wait, and many have already begun seeking a pretext for war."
 hd_court.0020.a:0 "The Mandate of Heaven has always been written by the victors."
 hd_court.0021.t:0 "A Usurped Title"
 hd_court.0021.desc:0 "[hd_court_pseudo_founder.GetTitledFirstName] has built an altar and sacrificed to Heaven, proclaiming himself Emperor, declaring a new era name, appointing officials, and founding an ancestral temple.\n\nWith the Han Son of Heaven still living, the realm now has two Sons of Heaven. Those loyal to the House of Han are submitting petitions one after another, demanding a campaign against this usurper."
 hd_court.0021.a:0 "Two suns in the sky, two masters for the people."
 hd_court_taocuan_cb_victory_desc:0 "[attacker.GetShortUIName|U] crushes the usurper and takes the Mandate in his place."
 hd_court_taocuan_cb_white_peace_desc:0 "Both sides lay down their arms and make peace."
 hd_court_taocuan_cb_defeat_desc:0 "[attacker.GetShortUIName|U] fails to punish the usurper and must pay reparations to [defender.GetShortUIName]."
 hd_court_dudu_grant_claim_interaction:0 "Grant Remote Claim"
 hd_court_dudu_grant_claim_interaction_desc:0 "In the name of the court, grant [recipient.GetShortUIName] [claims|E] on a neighboring commandery, to be conquered at their own discretion"
 hd_court_dudu_grant_claim_interaction_notification:0 "The court permits [recipient.GetShortUIName] to conquer a neighboring commandery"
 hd_court_emperor_held_blocked_tt:0 "You are under the powerful minister's control and cannot move against him"
 hd_court.0012.a:0 "……"
 hd_court_pseudo_empire_name:0 "[hd_court_pseudo_founder.GetPrimaryTitle.GetBaseName]"
