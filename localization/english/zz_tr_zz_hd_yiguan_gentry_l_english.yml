l_english:
 # Southern Migration of the Gentry - gentry side (decisions, interactions, events 4001-4023, modifiers, opinions, tooltips)

 # ---------- Decisions ----------
 hd_yiguan_qizu_nanqian_decision:0 "Clan Migration South"
 hd_yiguan_qizu_nanqian_decision_desc:0 "Hu horsemen have trampled the Central Plains, and the great houses have either perished or fled. Rather than live at the whim of a Hu master, better to abandon fields and halls, gather the clan, and seek refuge with a southern dynasty or a Han regime still standing in the north, so that the ancestral name may endure."
 hd_yiguan_qizu_nanqian_decision_tooltip:0 "Abandon your lands and migrate south to serve a Han ruler"
 hd_yiguan_qizu_nanqian_decision_confirm:0 "Lead the Clan South"
 hd_yiguan_qizu_nanqian_decision_effect_tt:0 "Ask the chosen ruler to take you in. If they accept:\n- All your holdings revert to your Hu liege (your direct liege if they are Hu, otherwise your top liege), together with your vassals;\n- Your spouses, children and unmarried siblings go with you;\n- If your destination has a Celestial government, you keep your Gentry title as a landless Gentry vassal (a player without one gains a new one); otherwise your Gentry title is destroyed and you become their courtier;\n- Your house is recorded as an Émigré Clan and your homeland as its ancestral seat; the Hu liege who takes your lands and your top liege gain -30 opinion of you.\nIf they refuse, your prestige is refunded and you cannot migrate south again for two years."

 hd_yiguan_qibing_beihuan_decision:0 "Return North in Arms"
 hd_yiguan_qibing_beihuan_decision_desc:0 "Many years have passed since the crossing south, yet word from the old homeland has never ceased. Now Hu and Han are at war across the Central Plains, and the hour to strike has come. Summon the young men of the clan and the retainers at your gate, cross the river northward, and fight your way home!"
 hd_yiguan_qibing_beihuan_decision_tooltip:0 "Become an adventurer and lead the Beifu Army back to your homeland"
 hd_yiguan_qibing_beihuan_decision_confirm:0 "Strike the Oars Midstream"
 hd_yiguan_qibing_beihuan_decision_effect_tt:0 "After choosing a northern province as your target:\n- You become a landless adventurer (holders of a Gentry title first have it destroyed and their estate buildings refunded) and gain a weak claim on that province;\n- Beifu Army = 1 + your house's estate buildings ÷ 3 regiments (max 4), plus 1 for each 'Troops' sponsor;\n- Event levies = 500 + prestige level × 300 + influence ÷ 2 (gold ÷ 2 if you have no influence; max 3000), plus 500 for each 'Troops' sponsor;\n- 1 + prestige level ÷ 2 companions (max 3), chosen first from your own house and retainers, each leading 300–800 troops into the war;\n- War is declared on the Hu realm holding the most counties in that province.\nEach character may rise only once in a lifetime; once the claimed lands are retaken you become independent, and if you had sponsors you must decide whether to submit to your largest sponsor."

 # ---------- Condition tooltips ----------
 hd_yiguan_gt_nanqian_dest_celestial_tt:0 "Players may only seek refuge with rulers who have a Celestial government (continuing play as landless Gentry)"
 hd_yiguan_gt_nanqian_dest_tier_tt:0 "Your Gentry title is duchy tier, so you may only seek refuge with rulers holding a kingdom-tier title or higher"
 hd_yiguan_gt_no_office_tt:0 "Must not hold office (first resign office titles such as Shangshu or the Nine Ministers)"
 hd_yiguan_gt_nanqian_tier_tt:0 "Holders of a landed title of kingdom tier or higher cannot undertake a Clan Migration South"
 hd_yiguan_gt_nanqian_pending_tt:0 "You have already asked another ruler to take you in and are awaiting a reply"
 hd_yiguan_gt_nanqian_refused_tt:0 "A request to migrate south was refused within the last two years"
 hd_yiguan_gt_nanqian_no_dest_tt:0 "There is currently no Southern Regime or Northern Han regime to seek refuge with"
 hd_yiguan_gt_nanqian_player_nf_tt:0 "The current rules do not allow new Gentry titles to be created; players without a Gentry title cannot migrate south"
 hd_yiguan_gt_beihuan_phase_tt:0 "Must be in the Conflict phase of the Southern Migration of the Gentry"
 hd_yiguan_gt_beihuan_target_tt:0 "A Hu regime must hold counties in one of the eight northern provinces, and must not currently be facing a righteous army, a revolt or another return north"
 hd_yiguan_gt_beihuan_cap_tt:0 "Three returns north have already been launched this year; wait until next year"
 hd_yiguan_gt_beihuan_pending_tt:0 "The prestige for the return north has been paid; awaiting your choice of province"
 hd_yiguan_gt_already_funded_tt:0 "Already sponsored this character"
 hd_yiguan_gt_qiaozhi_nothing_tt:0 "The ruler has neither a non-capital domain county to grant nor an Émigré Province to establish"
 hd_yiguan_gt_qiaowu_no_pair_tt:0 "Each house must have an unmarried adult member able to marry, one man and one woman"
 hd_yiguan_gt_qiaowu_fail_toast:0 "Émigré–Wu Marriage Failed"
 hd_yiguan_gt_qiaowu_fail_toast_tt:0 "Though both houses have unmarried members, no match could be made: they are too closely related, or bound by faith or existing betrothals."

 # ---------- Interactions ----------
 hd_yiguan_request_funding_interaction:0 "Request Funding for the Return North"
 hd_yiguan_request_funding_interaction_desc:0 "Ask them to fund your return north in arms: you may seek money, troops, or both."
 hd_yiguan_offer_funding_interaction:0 "Fund the Return North"
 hd_yiguan_offer_funding_interaction_desc:0 "Fund this exiled member of the Gentry in returning north: money is paid at once, and troops are delivered when they rise."
 hd_yiguan_request_qiaozhi_interaction:0 "Request an Émigré Land Grant"
 hd_yiguan_request_qiaozhi_interaction_desc:0 "Ask your liege to grant you a county or establish an Émigré Province for you, so that your displaced kinsmen have somewhere to belong."
 hd_yiguan_grant_qiaozhi_interaction:0 "Grant Émigré Lands"
 hd_yiguan_grant_qiaozhi_interaction_desc:0 "Grant this member of an Émigré Clan a county, or establish an Émigré Province for them."
 hd_yiguan_qiaowu_marriage_interaction:0 "Marry into Wu Clans"
 hd_yiguan_qiaowu_marriage_interaction_desc:0 "Each house offers one unmarried member to wed, sealing a bond between Émigré and Wu."
 hd_yiguan_request_office_interaction:0 "Seek Office"
 hd_yiguan_request_office_interaction_desc:0 "Ask them to grant you a council position; if none is vacant, you will join their court to await appointment."

 hd_yiguan_gt_tier_gold:0 "Money (medium sum, from treasury or purse)"
 hd_yiguan_gt_tier_troops:0 "Troops (1 Beifu regiment + 500 levies)"
 hd_yiguan_gt_tier_both:0 "Money and Troops"
 hd_yiguan_gt_qz_county:0 "Grant a County"
 hd_yiguan_gt_qz_qiao:0 "Establish an Émigré Province"

 hd_yiguan_gt_fund_accept_tt:0 "The sponsor (paying from the treasury if they have one, otherwise in gold):\n- Money: pays the exile a medium sum, +50 prestige;\n- Troops: pays a medium sum for recruitment, +100 prestige; when the exile rises, they also receive 1 Beifu regiment and 500 levies;\n- Money and Troops: pays both, +150 prestige.\nThe exile gains +30 opinion of the sponsor."
 hd_yiguan_gt_qiaozhi_accept_tt:0 "Grants a non-capital domain county (preferring low development and outside the capital's Commandery), or establishes an Émigré Province (granting a county with it if the recipient is landless); the recipient becomes a vassal and gains +20 opinion of the ruler."
 hd_yiguan_gt_qiaowu_accept_tt:0 "Each house offers one unmarried adult member to wed; the two house heads gain +20 opinion of each other; for twenty years neither house will be drawn into the Émigré–Wu feud."
 hd_yiguan_gt_office_accept_tt:0 "Fills a council vacancy according to their strengths; if there is no vacancy or the appointment fails, they join the court and gain 'Northern Repute' for ten years. The office-seeker gains +15 opinion of the ruler; local Native Wu Clan vassals gain -5 opinion of the ruler."

 hd_yiguan_gt_ai_reason_conflict:0 "Hu and Han are at war"
 hd_yiguan_gt_ai_reason_own_court:0 "Already one of my retainers"
 hd_yiguan_gt_ai_reason_martial:0 "Versed in warfare"
 hd_yiguan_gt_ai_reason_generous:0 "Generous"
 hd_yiguan_gt_ai_reason_greedy:0 "Greedy"
 hd_yiguan_gt_ai_reason_big_ask:0 "Asks too much"
 hd_yiguan_gt_ai_reason_rival:0 "Old grudge"
 hd_yiguan_gt_ai_reason_talent:0 "Outstanding talent"
 hd_yiguan_gt_ai_reason_over_domain:0 "Domain limit already exceeded"
 hd_yiguan_gt_ai_reason_qiao_cheap:0 "An Émigré Province is but a name"
 hd_yiguan_gt_ai_reason_arrogant:0 "Proud of their pedigree"
 hd_yiguan_gt_ai_reason_prestige:0 "Illustrious renown"
 hd_yiguan_gt_ai_reason_vacancy:0 "A council seat is vacant"
 hd_yiguan_gt_ai_reason_stranger:0 "Not one of my retainers"

 # ---------- Modifiers, opinions, armies ----------
 hd_yiguan_gt_qingwang_modifier:0 "Northern Repute"
 hd_yiguan_gt_qingwang_modifier_desc:0 "This character crossed the river from the north; though still without office, their good name has already spread among the literati."
 hd_yiguan_gt_spurned_opinion:0 "Funds Taken, Fealty Refused"
 hd_yiguan_gt_shelter_refused_opinion:0 "Refused Shelter"
 hd_yiguan_gt_comrade_opinion:0 "Comrades of the Northern Return"
 hd_yiguan_gt_beihuan_army:0 "Army of the Northern Return"
 hd_yiguan_gt_beihuan_companion_army:0 "Volunteers of the Northern Return"

 # ---------- Events ----------
 hd_yiguan.4001.t:0 "A Northern Scholar Seeks Refuge"
 hd_yiguan.4001.desc:0 "A gatekeeper ushers in a travel-worn scholar. He gives his name as [hd_yiguan_gt_migrant.GetName], then solemnly adds the ancestral commandery of his old northern clan. Hu horsemen run rampant, he says, and his homeland is Han soil no more; his clan of several dozen will abandon fields and halls to come to me, asking only for a place of refuge within my realm.\n\nMy advisors are divided. Some say the northern gentry have long been held in high esteem, and taking him in will win hearts; others warn that accepting him means making an enemy of his former lord, and when the Hu horsemen come south, this may well serve as their pretext.\n\nHe presents his genealogy along with his old letters of appointment, and remains prostrate on the ground, waiting for me to speak."
 hd_yiguan.4001.a:0 "Open the gates and take them in"
 hd_yiguan.4001.a.tt:0 "[hd_yiguan_gt_migrant.GetName]'s clan will give up their northern holdings and come to me as courtiers; if I have a Celestial government, he remains instead as a Gentry vassal."
 hd_yiguan.4001.b:0 "Politely decline"
 hd_yiguan.4001.b.tt:0 "[hd_yiguan_gt_migrant.GetName]'s prestige is refunded; he cannot migrate south again for two years, and will bear a grudge against me."

 hd_yiguan.4002.t:0 "Southern Migration of the Gentry"
 hd_yiguan.4002.desc:0 "There are two fewer boats at the ferry than agreed. The old and young of the clan board first, while the able-bodied men guard the carts at the rear. The land deeds and ancestral halls have been surrendered to the authorities; only the graves cannot be taken along. Before setting out, I look back once toward my homeland, and in the end say nothing.\n\nThe escort sent by [hd_yiguan_gt_dest.GetName] already waits on the far bank. From now on, in our new home we will still name our northern commandery as our clan seat, but that homeland must live, for now, only in the genealogy."
 hd_yiguan.4002.desc_north:0 "On the mountain road, the clan's carts stretch out in a long line. The land deeds and ancestral halls have been surrendered to the authorities; only the graves cannot be taken along. Past the last checkpoint, I look back once toward my homeland, and in the end say nothing.\n\nThe escort sent by [hd_yiguan_gt_dest.GetName] already waits below the pass. There they still keep the Han calendar; though it too lies in the north, it is another world. From now on, our homeland must live, for now, only in the genealogy."
 hd_yiguan.4002.a:0 "The clan sets out"
 hd_yiguan.4002.a.tt:0 "Surrender all holdings and go to [hd_yiguan_gt_dest.GetName] with your spouses, children and unmarried siblings; your house is recorded as an Émigré Clan and your homeland as its ancestral seat."

 hd_yiguan.4003.t:0 "Migration Refused"
 hd_yiguan.4003.desc:0 "The reply is courteous, but its meaning is plain: [hd_yiguan_gt_dest.GetName] will not offend the Hu for the sake of a northern gentry clan. Some travel money is enclosed with the letter, by way of thanks for my trouble.\n\nMy kinsmen crowd outside the door, waiting for me to speak. The homeland is still here, and the fields and halls too; but all this commotion can hardly have escaped the eyes and ears of my liege."
 hd_yiguan.4003.a:0 "We must think again"
 hd_yiguan.4003.a.tt:0 "The prestige paid has been refunded; you cannot migrate south again for two years."

 hd_yiguan.4004.t:0 "Migration Abandoned"
 hd_yiguan.4004.desc:0 "On the eve of departure, news arrives: the situation has changed, and the road south is closed. Either our destination can no longer take us in, or we ourselves cannot get away. The carts are unloaded, the chests carried back to the storehouse, and my kinsmen exchange uneasy glances.\n\nThe fees paid to smooth the way have been returned, but everyone has seen all this fuss."
 hd_yiguan.4004.a:0 "Let it rest for now"

 hd_yiguan.4005.t:0 "Gentry Flee South"
 hd_yiguan.4005.desc:0 "[hd_yiguan_gt_migrant.GetName] is gone. Abandoning his fields and estates in the north, he has taken his family to [hd_yiguan_gt_dest.GetName], without leaving so much as a letter of resignation.\n\nThe Han officials at court each keep their own counsel; some curse him as an ingrate, others lower their heads in silence. I know it is not one family alone that has gone; there are many more eyes watching from the shadows."
 hd_yiguan.4005.a:0 "This will be remembered"

 hd_yiguan.4011.t:0 "The Oath at the Oars"
 hd_yiguan.4011.desc:0 "The day of the oath has been set. The young men of the clan and the retainers at my gate gather before the hall, and several company captains of the old Beifu have come too, asking where we are bound.\n\nThe map lies open on the table. Of the eight northern provinces, some have fallen wholly to the Hu horsemen, while in others righteous armies still hold out. Returning home is just and right, of course, but where the Hu garrisons are thin and where the people still remember the Han must also be weighed.\n\nI take up my brush and mark a spot on the map."
 hd_yiguan.4011.sili:0 "Return North to Sili (Defender: [hd_yiguan_gt_bh_def_sili.GetName])"
 hd_yiguan.4011.jizhou:0 "Return North to Jizhou (Defender: [hd_yiguan_gt_bh_def_jizhou.GetName])"
 hd_yiguan.4011.youzhou:0 "Return North to Youzhou (Defender: [hd_yiguan_gt_bh_def_youzhou.GetName])"
 hd_yiguan.4011.bingzhou:0 "Return North to Bingzhou (Defender: [hd_yiguan_gt_bh_def_bingzhou.GetName])"
 hd_yiguan.4011.qingzhou:0 "Return North to Qingzhou (Defender: [hd_yiguan_gt_bh_def_qingzhou.GetName])"
 hd_yiguan.4011.yanzhou:0 "Return North to Yanzhou (Defender: [hd_yiguan_gt_bh_def_yanzhou.GetName])"
 hd_yiguan.4011.xuzhou:0 "Return North to Xuzhou (Defender: [hd_yiguan_gt_bh_def_xuzhou.GetName])"
 hd_yiguan.4011.yuzhou:0 "Return North to Yuzhou (Defender: [hd_yiguan_gt_bh_def_yuzhou.GetName])"
 hd_yiguan.4011.go.tt:0 "Become a landless adventurer and rise with the Beifu Army, event levies and companions, gaining a weak claim on the province and declaring war on the Hu realm holding the most counties there; each companion becomes an adventurer of their own and joins the attackers."
 hd_yiguan.4011.z:0 "The time is not yet ripe"
 hd_yiguan.4011.z.tt:0 "Rescind the order; the prestige paid is refunded."

 hd_yiguan.4012.t:0 "Oath of the Northern Return"
 hd_yiguan.4012.desc:0 "Word comes from the front: [hd_yiguan_gt_bh_exile.GetName], whom I sponsored, has sworn the oath and marched north with old Beifu soldiers and the young men of his home district, driving straight for [hd_yiguan_gt_bh_kingdom.GetName].\n\nThe money, grain and troops I set aside now all march beneath that banner. Should he win back his homeland, he will not forget who loaded his first boat of grain."
 hd_yiguan.4012.a:0 "Await good news"

 hd_yiguan.4013.t:0 "The Return North Falters"
 hd_yiguan.4013.desc:0 "The men had gathered and the proclamation was written, but at the moment of rising it became clear that things were no longer as before: the defending commander had changed, or the enemy was tied down by another war, and the original plan came to nothing.\n\nBefore the band disperses, someone asks whether we should keep waiting. The prestige paid has been recovered; the ambition to return north must await another chance."
 hd_yiguan.4013.a:0 "Bide our time"

 hd_yiguan.4021.t:0 "The Homeland Restored"
 hd_yiguan.4021.desc:0 "My banner now flies over the city walls. The elders of my homeland come out to greet me, and one of them, recognizing my clan's ancestral name, weeps openly before the crowd.\n\nNo sooner has the fighting eased than an envoy from [hd_yiguan_gt_patron.GetName] arrives. He brings gifts of congratulation, and a message: the return north was funded at no small cost; now that the homeland is restored, will I submit a memorial as a vassal and stand with them against the Hu?\n\nMy commanders are divided. Some say a lone city is hard to hold, and only with strong support from the south can this ravaged land be kept; others ask why cities won with blood should be handed to another."
 hd_yiguan.4021.a:0 "Submit a memorial and pledge fealty"
 hd_yiguan.4021.b:0 "Hold the land and stand alone"

 hd_yiguan.4022.t:0 "The Returned Exile Submits"
 hd_yiguan.4022.desc:0 "A memorial from [hd_yiguan_gt_bh_exile.GetName] has arrived. He declares himself my vassal, offering the lands he has recovered to my realm, to stand with me against the Hu.\n\nWhen I funded his return north, many said I was throwing money and grain into the river. Now it seems that one boat of grain has bought back a piece of the homeland."
 hd_yiguan.4022.a:0 "Excellent"

 hd_yiguan.4023.t:0 "Funds Taken, Fealty Refused"
 hd_yiguan.4023.desc:0 "[hd_yiguan_gt_bh_exile.GetName] has turned my envoy away. He says the homeland was won back with his soldiers' blood and cannot lightly be given to another; he wishes only to remain my ally forever.\n\nMy advisors seethe, saying all that money, grain and troops were fed to an ingrate. I say nothing, and simply have the reply put away."
 hd_yiguan.4023.a:0 "Remember this"
