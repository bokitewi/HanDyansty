l_english:
 hd_cao_chain.0001.t:0 "Wu Fu's Death"
 hd_cao_chain.0001.desc:0 "Wu Fu draws his blade against Dong Zhuo in public, but the guards seize him at once. After a brief uproar, only the executed man's body remains before the palace gate. Cao Cao sees the regent's blade clearly for the first time."
 hd_cao_chain.0001.a:0 "This is no ordinary quarrel."
 hd_cao_chain.0002.t:0 "Wang Yun's Feast"
 hd_cao_chain.0002.desc:0 "Wang Yun hosts a feast, yet every minister does little but hide his face and weep. Some cry until dawn, others until midnight, as though tears could cut down Dong Zhuo's power."
 hd_cao_chain.0002.a:0 "Let us see how long they can weep."
 hd_cao_chain.0003.t:0 "The Seven-Star Sword"
 hd_cao_chain.0003.desc:0 "Wang Yun asks why you laugh. You answer: if we weep from night to dawn and dawn to night, will Dong Zhuo die? If not, someone must act. Wang Yun falls silent and places the Seven-Star Sword in your hand."
 hd_cao_chain.0003.a:0 "I have a plan."
 hd_cao_chain.0004.t:0 "The Assassination Attempt"
 hd_cao_chain.0004.desc:0 "You enter Dong Zhuo's quarters with the sword hidden at your side. As the blade clears its sheath, Dong Zhuo sees the flash in a bronze mirror and turns. You claim that you came to present the sword, then seize a horse and flee Luoyang."
 hd_cao_chain.0004.a:0 "Ride away at once!"
 hd_cao_chain.0005.t:0 "The Magistrate of Zhongmou"
 hd_cao_chain.0005.desc:0 "When Cao Cao is brought before the county office, Chen Gong recognizes the fugitive. One is the magistrate ordered to arrest an assassin; the other has seen the regent's true face. Chen Gong finally chooses to abandon office and follow him."
 hd_cao_chain.0005.a:0 "I will follow you."
 hd_cao_chain.0006.t:0 "The Lü Boshe Household"
 hd_cao_chain.0006.desc:0 "Chen Gong and Cao Cao seek shelter with Lü Boshe. Hearing knives being sharpened in the night, Cao Cao believes their host intends to betray them and strikes first. Only afterward does he learn that the knives were for slaughtering a pig. Chen Gong looks upon the blood and understands what kind of man he has followed."
 hd_cao_chain.0006.a:0 "I would rather betray the world."
 hd_cao_chain.0094.t:0 "Mustering at Chenliu"
 hd_cao_chain.0094.desc:0 "With Chenliu secured, Xiahou Dun brings his clan retainers into your service. Xiahou Yuan, Cao Ren, Cao Hong, and Cao Chun arrive with their households. The Cao and Xiahou lineages remain distinct, but stand behind one lord. Old associates also provide six thousand gold and four thousand veteran Danyang troops."
 hd_cao_chain.0094.a:0 "Together, our clans will hold Chenliu."
 hd_cao_chenliu_danyang_army:0 "Chenliu Danyang Veterans"
