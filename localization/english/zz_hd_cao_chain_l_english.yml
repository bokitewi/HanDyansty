l_english:
 hd_cao_chain.0001.t:0 "The Death of Wu Fu"
 hd_cao_chain.0001.desc:0 "Wu Fu drew his sword and stabbed at Dong Zhuo before the eyes of all, but was immediately subdued by Dong's personal guards. After a brief commotion, only the corpse of an executed man remained before the palace gate. Cao Cao saw for the first time the blade of a powerful minister in its true light."
 hd_cao_chain.0001.a:0 "This is not an ordinary struggle."
 hd_cao_chain.0002.t:0 "Wang Yun's Banquet"
 hd_cao_chain.0002.desc:0 "Wang Yun hosted a banquet, yet all the ministers present were merely covering their faces and weeping. Some cried until dawn, others until midnight, as if their tears alone could sever Dong Zhuo's power."
 hd_cao_chain.0002.a:0 "See how long they can keep crying."
 hd_cao_chain.0003.t:0 "Seven-Star Blade"
 hd_cao_chain.0003.desc:0 "Wang Yun asks why you are laughing. You reply: \"Crying from night until dawn, and from dawn until night—can this crying kill Dong Zhuo? If not, then someone must act.\" After a moment of silence, Wang Yun hands the Seven-Star Blade to you."
 hd_cao_chain.0003.a:0 "I have a strategy."
 hd_cao_chain.0004.t:0 "Assassinate Dong Zhuo"
 hd_cao_chain.0004.desc:0 "You enter Dong Zhuo's residence with a blade in hand. The moment the edge of your sword is drawn, he sees the glint of steel reflected in his bronze mirror; he turns abruptly and demands to know your purpose. You feign offering the blade as a gift, then seize a horse and flee Luoyang."
 hd_cao_chain.0004.a:0 "Ride fast away from here!"
 hd_cao_chain.0006.t:0 "Old Tales of Chenliu"
 hd_cao_chain.0006.desc:0 "The gates of Chenliu closed behind me, finally giving me a moment to reflect on the bloodstains along my flight. Chen Gong, the magistrate of Zhongmou County, had abandoned his post to follow me, yet he severed ties with me over the deaths of Lü Boshè's family. That night has passed, but our enmity remains."
 hd_cao_chain.0006.a:0 "Past events need not be mentioned again."
 hd_cao_chain.0094.t:0 "Chenliu gathers the troops"
 hd_cao_chain.0094.desc:0 "Once Chenliu was secured, Xiahou Dun led his clan and retainers to submit. Xiahou Yuan, Cao Ren, Cao Hong, and Cao Chun also brought their families to join them. The Cao and Xiahou clans each guarded their own branches but pledged loyalty to a single lord. Former allies additionally delivered six thousand gold pieces and gathered four thousand elite soldiers from Dan Yang to await orders."
 hd_cao_chain.0094.a:0 "Relatives unite their strength; Chenliu can be held."
 hd_cao_chenliu_danyang_army:0 "Chenliu Danyang Elite Soldiers"
