 hd_historical_actor_protection:0 "Historical Figure Protection"
 hd_historical_actor_protection_desc:0 "This character receives additional health and protection against conspiracies in the early stages of the historical timeline."
 hd_dong_zhuo_timeline_protection:0 "Historical Protection of Dong Zhuo"
 hd_dong_zhuo_timeline_protection_desc:0 "Dong Zhuo receives extremely high health and powerful anti-conspiracy protection in the first ten years of the historical timeline."

 hd_fengying.0001.t:0 "Escort the Son of Heaven"
 hd_fengying.0001.desc:0 "The Son of Heaven has fled from Guanzhong, the court is shattered, and imperial edicts no longer reach beyond the immediate capital. If I were to welcome the Son of Heaven into my domain, I could restore order under the banner of the Han House, yet I must also bear the weight of official duties, the cost of maintaining his household, and the suspicions of the realm."
 hd_fengying.0001.alt_desc:0 "The Son of Heaven has been forced to flee from Guanzhong. However, I am not yet a ruler with an independent territory and cannot welcome the court into my own seat of governance. I may still dispatch troops to escort him and observe the situation, or explicitly refuse to become involved."
 hd_fengying_cao_receive:0 "Welcome the Son of Heaven, uphold the Han house to command the feudal lords."
 hd_fengying_cao_escort:0 "Dispatch only troops to escort them; do not leave the imperial court under your jurisdiction."
 hd_fengying_cao_refuse:0 "The situation remains unsettled; it is not appropriate to accept the imperial court's authority."
 hd_fengying_cao_control:0 "Keep a firm grip on the imperial court."
 hd_fengying.0011.t:0 "The Son of Heaven may be welcomed back."
 hd_fengying.0011.desc:0 "The Son of Heaven has lost his strong allies, while the armies in Hebei are powerful and well-supplied with grain. Welcoming and supporting the imperial court will allow us to overwhelm the warlords, but it will also make the officials and the royal family the most difficult group to accommodate within our military administration. Cao Cao is also waiting for this opportunity."
 hd_fengying.0011.alt_desc:0 "The opportunity to welcome the Son of Heaven has arisen, but I am not yet a ruler with an independent territory and cannot relocate the court to my own seat. Aiding, watching from afar, or blocking others remain my realistic options."
 hd_fengying_yuan_receive:0 "Escort the Son of Heaven to Hebei."
 hd_fengying_yuan_hesitate:0 "This matter involves too many complications; let us wait and see for now."
 hd_fengying_yuan_aid:0 "Supply carriages and horses, providing only limited assistance."
 hd_fengying_yuan_obstruct:0 "Block the roads to prevent Cao Cao from succeeding."

 hd_historical_world.0100.t:0 "Before Guandu"
 hd_historical_world.0100.desc:0 "Yuan Shao has already consolidated control over Hebei, and his armies now point toward the Central Plains. The Yellow River can serve as a barrier or become the battlefield that decides the fate of the realm. Whether Xu You will defect or Wuchao's supply line is exposed can only alter the odds of victory; neither side can have its outcome prewritten by such events."
 hd_historical_world.0100.alt_desc:0 "The conflict between Cao Cao and Yuan Shao can no longer be avoided, but the current vassal relationships, land holdings, or alliances are insufficient to justify a legitimate war at Guandu. You may still hold fast along the Yellow River, seek compromise, or first deal with other enemies."
 hd_historical_world.0100.small_realm_desc:0 "Cao Cao and Yuan Shao have moved toward confrontation, but the territories currently controlled by either side are insufficient to support a massive battle in Hebei and Central Plains as recorded in historical texts. If war is still chosen, the scale and weight of the battlefield will be determined by the actual forces involved."
 hd_guandu_decide_battle:0 "Defend against Yuan Shao at Guandu."
 hd_guandu_defend_yellow_river:0 "Hold fast to the Yellow River; do not make a desperate gamble."
 hd_guandu_compromise:0 "Exchange concessions for a ceasefire."
 hd_guandu_clear_other_enemies:0 "First clear the enemies on the flanks and rear."
 hd_historical_world.0190.t:0 "Guandu: Northern Army Retreats"
 hd_historical_world.0190.desc:0 "The actual battlefield situation has already forced Yuan's army to retreat. Although Hebei remains under control, it is no longer possible to conceal the fractures between morale and among subordinates."
 hd_historical_world.0191.t:0 "Guandu: Yuan Army Victorious"
 hd_historical_world.0191.desc:0 "The Yuan army has achieved victory in the actual battlefield. Whether this success can be transformed into authority over the realm still depends on who controls the core of Central Plains and to whom the Son of Heaven belongs."

 hd_historical_world.0200.t:0 "Before Red Cliffs"
 hd_historical_world.0200.desc:0 "Jiangdong has already formed a united front with Liu Bei to resist, while the southern expeditionary force is hampered by epidemics, lack of experience in naval warfare, newly annexed troops from Jingzhou, and an extended supply line. Continuing the advance is not certain to lead to defeat, but every unresolved risk may exact a toll on the rivers."
 hd_historical_world.0200.alt_desc:0 "The standoff between north and south has taken shape, but the current vassal relationships, land holdings, or alliances are insufficient to launch a legitimate Battle of Red Cliffs. The Cao forces may still reorganize their navy, withdraw troops, or halt at Jingzhou to complete this phase."
 hd_chibi_continue_southeast:0 "Continue advancing southeast."
 hd_chibi_prepare_fleet:0 "Reorganize the naval forces and supply lines before engaging in battle again."
 hd_chibi_withdraw:0 "Retreat promptly to preserve the Northern Army."
 hd_chibi_hold_jingzhou:0 "Halt at Jingzhou; do not cross the river to fight a decisive battle."
 hd_historical_world.0210.t:0 "Jingzhou's approach or departure"
 hd_historical_world.0210.desc:0 "The Cao forces have pressed toward Jingzhou. This region is now effectively controlled by [ROOT.Char.GetShortUIName]; whether the entire province should submit to preserve the military and civilians, or rely on the Yangtze and Han rivers to continue resisting, must be decided by the current ruler. If Liu Cong still effectively holds Jingzhou, he too can only make a decision under the same realistic conditions."
 hd_chibi_jingzhou_surrender:0 "Submit Jingzhou to submit to Cao Cao."
 hd_chibi_jingzhou_resist:0 "Defending from the Yangtze and Han rivers, never surrendering."
 hd_historical_world.0290.t:0 "Red Cliffs: Northern Army Retreats"
 hd_historical_world.0290.desc:0 "Illness, fire attacks, and the naval campaign on the Yangtze forced the Northern Army to end its expedition. Though losses and exhaustion were real, the northern regime did not collapse out of thin air."
 hd_historical_world.0291.t:0 "Red Cliffs: The River Defense Has Been Lost"
 hd_historical_world.0291.desc:0 "The Cao forces breached the river defenses in actual combat. The Sun-Liu alliance still had to face the real consequences of this defeat."

 hd_liu_bei_late.2200.t:0 "Stationed to garrison Jingzhou"
 hd_liu_bei_late.2200.desc:0 "The situation in Yizhou is now settled; Jingzhou must be entrusted to a supreme ruler capable of standing alone. Guan Yu possesses the prestige, seniority, and loyalty required for such a role, yet appointing him will alter the power structure between Jing and Yi provinces."
 hd_lb22_appoint_guan_yu_jingzhou:0 "Appoint Guan Yu as the highest ruler of Jingzhou."
 hd_lb22_keep_jingzhou_arrangement:0 "Maintain the current arrangements."
 hd_liu_bei_late.2400.t:0 "Northern Expedition of Jingzhou"
 hd_liu_bei_late.2400.desc:0 "Guan Yu has already advanced north from Jingzhou. The Jiangdong region, the Cao family, and the generals left behind are all assessing how much pressure this defensive line can still withstand."
 hd_lb24_await_sun_decision:0 "The choice of the Jiangdong will determine our retreat route."
 hd_liu_bei_late.2410.t:0 "The Rift of Jingzhou"
 hd_liu_bei_late.2410.desc:0 "With Guan Yu's main force advancing north, a gap appears in Jingzhou's rear. Seizing Jingzhou would eliminate the threat from upstream to Jiangdong, but it would completely destroy the alliance between Sun and Liu."
 hd_liu_bei_late.2410.alt_desc:0 "The causal chain of Guan Yu's northern expedition has advanced to the decision at Jiangdong, but direct conquest is currently prohibited due to existing lord relationships, alliances, or ownership of Jingzhou. Waiting, maintaining an alliance, or contacting the Cao family can still conclude this phase."
 hd_lb24_attack_jingzhou:0 "Seize Jingzhou while it is vulnerable."
 hd_lb24_wait:0 "Continue to observe the situation on the northern front."
 hd_lb24_keep_alliance:0 "Do not break the alliance treaty; maintain the alliance."
 hd_lb24_align_cao:0 "Contact the Cao family to seek limited benefits."
 hd_liu_bei_late.2491.t:0 "Jingzhou Changes Hands"
 hd_liu_bei_late.2491.desc:0 "Actual warfare caused Jingzhou to change hands. Guan Yu's fate remained determined by the battlefield, captives, and the reality of life and death among individuals."
 hd_liu_bei_late.2492.t:0 "Jingzhou Successfully Defended"
 hd_liu_bei_late.2492.desc:0 "Cao Cao's forces successfully defended Jingzhou in actual warfare, altering the course of history."

 hd_liu_bei_late.2500.t:0 "Debate on the Expedition Against Wu"
 hd_liu_bei_late.2500.desc:0 "Guan Yu is dead, and Jingzhou has fallen to the Sun family. Revenge, alliance, and the survival of factions are in conflict; if troops are deployed, supply lines, mountainous terrain, linked camps, summer heat, and the commander of Wu's forces will all genuinely influence the battle."
 hd_liu_bei_late.2500.alt_desc:0 "Guan Yu has fallen, yet the debate over vengeance persists. However, current lordly relations, territorial holdings, alliances, or the status of Jingzhou are insufficient to launch a legitimate war of Yiling. Options remain available: reconciliation, demanding the return of Jingzhou, or postponing revenge."
 hd_yiling_attack_wu:0 "Raise troops to attack Wu and avenge Guan Yu."
 hd_yiling_keep_alliance:0 "Accept the strategy from afar and renew the alliance."
 hd_yiling_demand_jingzhou:0 "The advance envoy demands the return of Jingzhou."
 hd_yiling_delay_revenge:0 "Postpone revenge for now, gather your forces and wait for the right moment."
 hd_liu_bei_late.2510.t:0 "Demand the return of Jingzhou"
 hd_liu_bei_late.2510.desc:0 "Liu Bei sent envoys to demand the return of Jingzhou. Conceding could avoid a major war, but it would weaken Jiangdong's barrier in the upper reaches."
 hd_yiling_return_part_jingzhou:0 "Return some of the disputed territories."
 hd_yiling_reject_demand:0 "Refuse request."
 hd_liu_bei_late.2590.t:0 "Defeat at Yiling"
 hd_liu_bei_late.2590.desc:0 "The army of Liu Bei suffered defeat in the actual battlefield. The long supply lines, mountainous terrain, and risks of encamped camps finally converged into a disastrous outcome."
 hd_liu_bei_late.2591.t:0 "Victory in the campaign against Wu"
 hd_liu_bei_late.2591.desc:0 "The Liu Bei army achieved victory in the actual battle; the claims on Jingzhou will be settled according to formal war objectives."
