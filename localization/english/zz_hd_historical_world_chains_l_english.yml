 HD_LIU_BEI_LIFE_STORY_STATUS:0 "Current Chapter: #V [Story.MakeScope.Var('hd_liu_bei_life_phase').GetFlagName]#!\n From raising the righteous banner in Zhuo Commandery to establishing a base in Western Shu, Liu Bei's choices, oaths, and battles will converge into a single personal history line."
 HD_CAO_LIFE_STORY_STATUS:0 "Current Chapter: #V [Story.MakeScope.Var('hd_cao_life_phase').GetFlagName]#!\n From serving in Luoyang to establishing a foothold in Chenliu, leading the campaign against Dong Zhuo, welcoming the Emperor, and fighting the decisive battle at Guandu, Cao Cao's experiences converge into a single lifelong story."
 HD_YUAN_LIFE_STORY_STATUS:0 "Current Chapter: #V [Story.MakeScope.Var('hd_yuan_life_phase').GetFlagName]#!\n From political struggles in Luoyang to establishing a foothold in Bohai, rallying warlords, and the decisive battle at Guandu, Shao Xiong's experiences converge into a single lifelong narrative."
 HD_DONG_ZHUO_LIFE_STORY_STATUS:0 "Current Chapter: #V [Story.MakeScope.Var('hd_dong_zhuo_life_phase').GetFlagName]#!\n From rising in Liangzhou to entering the capital and governing, moving the capital to Chang'an and confronting the allied forces, Dong Zhuo's experiences merge into a single lifelong story."
 HD_GONGSUN_ZAN_LIFE_STORY_STATUS:0 "Current Chapter: #V [Story.MakeScope.Var('hd_gongsun_zan_life_phase').GetFlagName]#!\n After defeating Dong Zhuo, Gongsun Zan will turn his gaze to Youzhou and the entire northern region."
 HD_SUN_JIAN_LIFE_STORY_STATUS:0 "Current Chapter: #V [Story.MakeScope.Var('hd_sun_life_phase').GetFlagName]#!\nThe foundation laid by Sun Jian in the Jiangdong region can be passed to Sun Ce, guiding the Sun family to seize Yangzhou and develop the southern territories."
 HD_LIU_BIAO_LIFE_STORY_STATUS:0 "Current Chapter: #V [Story.MakeScope.Var('hd_liu_biao_life_phase').GetFlagName]#!\n Liu Biao prioritizes the defense of Jingzhou and the maintenance of peace and order within his territory."
 HD_WANG_YUN_LIFE_STORY_STATUS:0 "Current Chapter: #V [Story.MakeScope.Var('hd_wang_yun_life_phase').GetFlagName]#!\n After the momentum to overthrow Dong Zhuo is established, Wang Yun will attempt to win over Lu Bu and secretly plot to eliminate Dong Zhuo."
 HD_YUAN_SHU_LIFE_STORY_STATUS:0 "Current Chapter: #V [Story.MakeScope.Var('hd_yuan_shu_life_phase').GetFlagName]#!\n Once Runan is incorporated into your domain, Yuan Shu will use his schemes to subdue both internal and external forces, expanding into Yuzhou and Yangzhou."
