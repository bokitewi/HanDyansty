 hd_yuan_shu_assertive_ai_desc:0 "This character is passionate about political maneuvering and suppressing vassals, preferring to expand his influence through surrender and subjugation."
 hd_wang_yun_historical_murder_scheme:0 "Historical Aid: Eliminate Dong Zhuo"
 hd_wang_yun_historical_murder_scheme_desc:0 "Wang Yun's long-term planning made this scheme almost foolproof."
 hd_wang_yun_historical_sway_scheme:0 "Historical Aid: Win over Lü Bu"
 hd_wang_yun_historical_sway_scheme_desc:0 "Wang Yun's grasp of the situation and public sentiment made this scheme almost certain to succeed."
