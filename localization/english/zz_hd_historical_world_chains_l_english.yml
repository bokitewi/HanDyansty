l_english:
 HD_HISTORICAL_WAR_NAME:0 "The Battle Between [ATTACKER.GetPrimaryTitle.GetNameNoTierNoTooltip] and [DEFENDER.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 hd_historical_war_victory_desc:0 "The attacking side captures the formal war objective."
 hd_historical_war_white_peace_desc:0 "Both sides cease hostilities, with no transfer of territory."
 hd_historical_war_defeat_desc:0 "The attack failed; no land transfer occurs."
 hd_chain_acknowledge:0 "The grand trend of the realm has thus changed."
 hd_historical_world.0188.t:0 "Govern and pacify Jingzhou"
 hd_historical_world.0188.desc:0 "The Imperial Court has ordered me to take command of Jingzhou and bring stability to the Jianghan region. All officials, commanderies, counties, and military garrisons under the jurisdiction of the former Inspector must be handed over; from this day forth, all affairs in Jingzhou shall be decided by my authority."
 hd_historical_world.0188.a:0 "Take command of Jingzhou and reorganize the prefectures and commanderies."

 hd_guandu_xu_you_wuchao_modifier:0 "The supply route at Wuchao has been compromised."
 hd_guandu_xu_you_wuchao_modifier_desc:0 "The intelligence brought by Xu You severely threatened the supply lines of Yuan's army."
 hd_guandu_scout_wuchao_modifier:0 "Grain supply route disrupted"
 hd_guandu_scout_wuchao_modifier_desc:0 "Enemy scouts have detected portions of the supply lines, but their intelligence is far less accurate than that provided by our inside agents."
 hd_chibi_risk_disease_modifier:0 "Plague in the Army"
 hd_chibi_risk_disease_modifier_desc:0 "Prolonged expeditions have allowed diseases to spread within the army, undermining combat superiority."
 hd_chibi_risk_expedition_modifier:0 "Expedition Fatigue"
 hd_chibi_risk_expedition_modifier_desc:0 "The Northern Army has marched south over a long distance; both men and horses are now exhausted."
 hd_chibi_risk_naval_modifier:0 "Unaccustomed to naval warfare"
 hd_chibi_risk_naval_modifier_desc:0 "The army lacks experience in naval warfare."
 hd_chibi_risk_jingzhou_loyalty_modifier:0 "Jingzhou newly annexed"
 hd_chibi_risk_jingzhou_loyalty_modifier_desc:0 "The newly surrendered Jingzhou troops have not yet stabilized their morale."
 hd_chibi_risk_tied_ships_modifier:0 "Ships connected"
 hd_chibi_risk_tied_ships_modifier_desc:0 "Although connecting the ships reduces rolling, it limits maneuverability."
 hd_chibi_risk_logistics_modifier:0 "The supply route is long and arduous."
 hd_chibi_risk_logistics_modifier_desc:0 "The protracted supply line cannot sustain continuous river warfare."
 hd_chibi_risk_huang_gai_modifier:0 "Fire Attack Hazard"
 hd_chibi_risk_huang_gai_modifier_desc:0 "Huang Gai remains in the Jiangdong army, and the threat of fire attack has not yet been eliminated."
 hd_yiling_risk_supply_modifier:0 "Yiling Grain Route"
 hd_yiling_risk_supply_modifier_desc:0 "The supply line of the army attacking Wu is narrow and fragile."
 hd_yiling_risk_mountain_modifier:0 "Mountain barriers block the way."
 hd_yiling_risk_mountain_modifier_desc:0 "Mountainous terrain restricts the deployment of large armies."
 hd_yiling_risk_camps_modifier:0 "Connected camps spanning a hundred li"
 hd_yiling_risk_camps_modifier_desc:0 "The continuous fortifications make it difficult for the army to provide rapid mutual support."
 hd_yiling_risk_lu_xun_modifier:0 "Lu Xun commands the army"
 hd_yiling_risk_lu_xun_modifier_desc:0 "Lu Xun is seeking the right moment to launch a counterattack."
 hd_yiling_risk_heat_modifier:0 "Midsummer heatwave"
 hd_yiling_risk_heat_modifier_desc:0 "The scorching heat is eroding the combat effectiveness of the expeditionary force."

