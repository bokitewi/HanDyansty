l_english:
 # Interaction & Basic Strings #
 sworn_brotherhood_interaction:0 "Form a sworn brotherhood"
 sworn_brotherhood_interaction_desc:0 "Propose to forge a sacred bond of sworn brotherhood, creating an unbreakable tie akin to the legendary oath sworn at Peach Garden."
 SWORN_BROTHERHOOD_NORMAL:0 "Propose to form sworn brotherhood"
 opinion_sworn_brotherhood:0 "Bond of Gold and Orchid"
 sworn_brotherhood_modifier:0 "Holy Covenant Restricts"
 broke_sworn_brotherhood_oath:0 "Traitor to Oath"
 friend_relation_effect_actor:0 "Become sworn brothers with [recipient.GetTitledFirstName]"
 friend_relation_effect_recipient:0 "Become your sworn brother"
 
 # AI Traits
 AI_TRAIT_LOYAL:0 "Loyalty"
 AI_TRAIT_JUST:0 "Upright"
 AI_TRAIT_HONEST:0 "Honesty"
 AI_TRAIT_BRAVE:0 "Brave"
 AI_TRAIT_DECEITFUL:0 "Cunning"
 AI_TRAIT_ARBITRARY:0 "Fickle"
 AI_TRAIT_AMBITIOUS:0 "Ambitious"
 AI_TRAIT_PARANOID:0 "Suspicious"
 AI_STRATEGIC_NEED:0 "The current situation requires a reliable ally."
 
 # Peach Garden Oath Ceremony
 sworn_brotherhood_events.0001.t:0 "Brotherhood at the Peach Garden"
 
 # Dynamic Event Descriptions
 sworn_brotherhood_events.0001.desc.intro:0 "I and [blood_bro.GetTitledFirstName] have already prepared wine and gifts."
 sworn_brotherhood_events.0001.desc.outro:0 "\n\n Today, we swear an oath before heaven and earth to become sworn brothers of different surnames. From now on, we shall share both fortune and misfortune, and support each other through all hardships."
 sworn_brotherhood_events.0001.desc.just:0 "We both value trust and righteousness, and are willing to support one another."
 sworn_brotherhood_events.0001.desc.brave:0 "None of us fear hardship or danger, and we are willing to advance and retreat side by side."
 sworn_brotherhood_events.0001.desc.loyal:0 "We trust each other and are willing to entrust our lives and fortunes to one another."
 sworn_brotherhood_events.0001.desc.ambitious:0 "We share the same aspirations and are willing to jointly plot a great cause."
 sworn_brotherhood_events.0001.desc.generic:0 "We share the same aspirations and are willing to support one another."
 
 # Oath Options
 sworn_brotherhood_events.0001.a:0 "Swear brotherhood in the name of righteousness" # 对应刘备之仁德
 sworn_brotherhood_events.0001.b:0 "Swear brotherhood in the name of loyalty" # 对应关羽之忠义
 sworn_brotherhood_events.0001.c:0 "Swear brotherhood based on bravery" # 对应张飞之勇猛
 sworn_brotherhood_events.0001.d:0 "Simple Oath of Brotherhood"
 
 # Oath Tooltips
 sworn_brotherhood_righteous_path_tt:0 "By forming a sworn brotherhood based on righteousness, we will gain additional honor and have a chance to become more upright. This path follows the legacy of Liu Bei."
 sworn_brotherhood_loyalty_path_tt:0 "By swearing brotherhood in loyalty, we will gain military prowess and strengthen our oaths. This path follows the loyalty and righteousness of Guan Yu."
 sworn_brotherhood_ferocity_path_tt:0 "By forming a sworn brotherhood based on valor, we will gain combat power and unwavering determination. This path follows the martial prowess of Zhang Fei."
 sworn_brotherhood_simple_path_tt:0 "Establish a simple yet sincere brotherhood pact to earn moderate ceremonial honor."
 
 # Follow-up Event
 sworn_brotherhood_events.0002.t:0 "Test of Friendship"
 sworn_brotherhood_events.0002.desc:0 "Since I formed a brotherhood with [blood_bro.GetTitledFirstName], several months have passed. Through various trials and tribulations, I am even more convinced that I did not make a mistake in choosing him."

 sworn_brotherhood_events.0002.a:0 "Our bond has grown even stronger"
 sworn_brotherhood_events.0002.b:0 "We remain steadfast in our resolve."
 sworn_brotherhood_events.0002.c:0 "Our friendship has been tested"   
 sworn_brotherhood_events.0002.d:0 "Modestly decline additional ceremonies"   

 sworn_brotherhood_strengthened_tt:0 "The bond of our sworn brotherhood has grown even stronger through shared hardships."
 
 # Modifier Names & Descriptions
 brotherhood_loyalty_modifier:0 "Loyalty and righteousness intertwined"
 brotherhood_loyalty_modifier_desc:0 "The sacred oath forged among sworn brothers creates an unbreakable bond of loyalty."
 
 brotherhood_ferocity_modifier:0 "Brave Brothers"  
 brotherhood_ferocity_modifier_desc:0 "The oath of sworn brotherhood ignited the burning rage to protect their blood-bonded brothers."
 
 tested_brotherhood_modifier:0 "Enduring Bonds Through Tribulations"
 tested_brotherhood_modifier_desc:0 "Time and trials have proven the authenticity and endurance of this sworn brotherhood."
 
 brotherhood_ambition_modifier:0 "Alliance of Ambition"
 brotherhood_ambition_modifier_desc:0 "Already sworn a vow of ambition with my blood-brothers, united to achieve great deeds."
 
 # Oath Breaking Penalties
 oath_breaker_modifier:0 "Traitor to Oath"
 oath_breaker_modifier_desc:0 "This character betrayed the sacred bond of sworn brotherhood, thus earning contempt and distrust."
 
 dishonorable_modifier:0 "Traitorous Factions"
 dishonorable_modifier_desc:0 "This character's act of betraying his sworn brothers marks his inherent lack of trustworthiness and righteousness."
 
 # Oath-Breaking Events
 sworn_brotherhood_events.0003.t:0 "Brother Betrayal"
 sworn_brotherhood_events.0003.desc.intro:0 "[actor.GetName]betrayed the brotherhood oath I made with him."
 sworn_brotherhood_events.0003.desc.just_betrayed:0 "I have always valued integrity and righteousness; therefore, the betrayal by [actor.GetSheHe] is all the more intolerable."
 sworn_brotherhood_events.0003.desc.wrathful_betrayed:0 "I will never tolerate such betrayal. [actor.GetName] must pay the price for it!"
 sworn_brotherhood_events.0003.desc.cynical_betrayed:0 "I knew all along that oaths are not always reliable. [actor.GetName] merely confirmed my judgment."
 sworn_brotherhood_events.0003.desc.generic_betrayed:0 "The vows of old still ring in my ears, yet [actor.GetName] has already betrayed me."
 sworn_brotherhood_events.0003.desc.outro:0 "\n\n Now, it is up to me to decide how to respond."
 sworn_brotherhood_events.0003.a:0 "Righteous indignation fills the heart" 
 sworn_brotherhood_events.0003.b:0 "Wrath of Vengeance"
 sworn_brotherhood_events.0003.c:0 "Cynically accept"
 
 # Betrayer Event
 sworn_brotherhood_events.0004.t:0 "Oaths Shattered"
 sworn_brotherhood_events.0004.desc:0 "I have betrayed the brotherhood oath I made with [actor.GetName]. Regardless of whatever reasons existed at the time, the stain of breaking one's word shall be borne by me."
 sworn_brotherhood_events.0004.a:0 "Regret over the act of betrayal"
 sworn_brotherhood_events.0004.b:0 "Embrace Ambition"
 
# Opinion Modifiers & Tooltips
 hd_sworn_brotherhood_declined:0 "Sworn brothers betray"
 opinion_betrayed_me:0 "Betrayed me"
 opinion_broken_oath_justice:0 "Betray the Holy Alliance"
 opinion_expected_betrayal:0 "Saw through his treachery early on."
 stress_broken_oath_tt:0 "The betrayal of your sworn brothers has shaken your resolve."
 stress_vengeful_rage_tt:0 "Righteous fury consumes you, yet brings no peace."
 
 # Enhanced Follow-up Event Options
 sworn_brotherhood_loyalty_strengthened_tt:0 "Our bond of loyalty has been tested and is stronger than ever before."
 sworn_brotherhood_ferocity_strengthened_tt:0 "Our fervent brotherhood has proven its worth in the crucible of time."
 sworn_brotherhood_tested_tt:0 "Our sworn brotherhood has withstood the test of time and thus grown even stronger."
 sworn_brotherhood_humble_refusal_tt:0 "We humbly acknowledge that our bond requires no further rituals or rewards."
