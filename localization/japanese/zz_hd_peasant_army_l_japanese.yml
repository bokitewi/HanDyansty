l_japanese:
 # 农民义军
 hd_peasant_army.0001.t: "郷民の来投"
 hd_peasant_army.0001.desc: "ここ数日、陣営の門の外には老人や子供を連れてやって来る者が絶えない。鍬を担いだ者もいれば、先を尖らせた竹竿を一本持っただけの者もおり、旗印を見るやひざまずいて、家の田はとうに豪強に奪われ、県の租税に追い立てられて生きてゆけないと訴える。\n\n彼らは言う。[ROOT.Char.GetFirstName]もまた貧しい生まれで、郷里の者を虐げないと聞いた、共に生きる道を歩みたいと。点検してみると、なんとまた一隊の軍勢になっていた。"
 hd_peasant_army.0001.a: "皆編入しろ。同じ釜の飯を食うのだ。"
 hd_peasant_army.0001.a.tt: "#P 郷民が一軍となって身を寄せてきた#!（兵力 = 外交×管理×5、さらに民兵槍兵 1 隊）"
 hd_peasant_army_troops_name: "義軍郷勇"
 hd_peasant_army_siege_toast: "郷民の来投"
