 xiali_adherent:0 "六国"
 xiali_adherent_plural:0 "六国"
 xiali_desc:0 "夏礼とは夏王朝の礼制であり、最古の礼楽制度である。夏礼は商・周の礼楽文化の基礎を築いたのみならず、事実上、華夏の礼楽文明全体の根幹を確立した。"
 xiali_religious_head_title:0 "后"
 xiali_religious_head_title_name:0 "夏"
 yinli:0 "殷礼"
 yinli_adj:0 "殷礼"
 yinli_adherent:0 "六国"
 yinli_adherent_plural:0 "六国"
 yinli_desc:0 "殷礼とは商王朝の礼制であり、殷人が夏礼を参照しつつ損益を加えて創り上げたものである。"
 yinli_religious_head_title:0 "帝"
 yinli_religious_head_title_name:0 "商"
 xizhouli:0 "西周礼"
 xizhouli_adj:0 "西周礼"
 xizhouli_adherent:0 "六国"
 xizhouli_adherent_plural:0 "六国"
 xizhouli_desc:0 "周朝の初め、政治的に西周の統治を支える封建制度を支えるため、周公旦は思想の領域に全面的な改革を施した。彼は上古から商代に至る礼楽を広く整理・改造し、飲食・起居・祭祀・喪葬など社会生活のあらゆる面にわたる、具体的で実行可能な一連の礼楽制度を確立し、それらをことごとく「礼」の範囲に収めた。"
 xizhouli_religious_head_title:0 "天子"
 xizhouli_religious_head_title_name:0 "周"
 dongzhouli:0 "東周礼"
 dongzhouli_adj:0 "東周礼"
 dongzhouli_adherent:0 "六国"
 dongzhouli_adherent_plural:0 "六国"
 dongzhouli_desc:0 "驪山の禍の後、申侯・曾侯らの諸侯は廃された太子姫宜臼を周の天子に擁立した。これより華夏の地は礼が崩れ楽が壊れ、諸侯が覇を争う時代に入った。野心に満ちた多くの諸侯はもはや旧来の礼制の束縛に甘んじず、権謀と戦争によって志を遂げようとした。"
 dongzhouli_religious_head_title:0 "天子"
 dongzhouli_religious_head_title_name:0 "周"

