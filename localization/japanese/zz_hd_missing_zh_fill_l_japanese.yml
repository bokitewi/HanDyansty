 # ===== 朝代循环 =====
 hd_dc_theft_pending_credit_tt:0 "国庫から差し引かれた金額がまだすべて入金されていない。未入金分は今回の引き出し記録に引き続き記録される。同じ記録を再度処理しても新たな差し引きは発生しない。"
 hd_dc_era_control_status:0 "朝廷の支配：[Situation.MakeScope.Var('hd_dc_controlled_counties').GetValue|0]/[Situation.MakeScope.Var('hd_dc_total_counties').GetValue|0] 郡（[Situation.MakeScope.Var('hd_dc_control_percent').GetValue|1]%）"
 hd_dc_era_no_holder_status:0 "覇権は現在誰も握っていない。支配率は適用されない"
 hd_dc_era_invalid_status:0 "政治データが未検証のため、時代判定を一時停止している。"
 hd_dc_par.1201.q.tt:0 "この任務の実際の履行は、対応する危機に +5 統治点（Q）として記録済みであり、精算は一度きりである。この受領書を再度読んでも点数は加算されない。"
 hd_dc_par.1201.no_q.tt:0 "今回は新たな統治点は記録されなかった。実際の支払い記録は保持される。この受領書は追加支払いや返金を承認するものではない。"

 hd_dc_review_governance_decision:0 "危機の事後処理を検証する"
 hd_dc_review_governance_decision_desc:0 "戦報はもはや急を告げないが、先に交わした約束はなお一つずつ検証せねばならない。今どの旧案を封ずるかが、朝廷がより長い太平を迎えられるかどうかを決める。"
 hd_dc_review_governance_decision_tooltip:0 "最終的に決着できる危機を確認する。結案するか、観察を続けるかを選ぶ。"
 hd_dc_review_governance_decision_confirm:0 "検証済みの案巻を提出する"
 hd_dc_governance_review_ready_tt:0 "少なくとも一つの政治的結果が確定し、中核の戦争が真に終結し、未処理の行動や義務がなく、かつ検証済みの危機が存在する。統治値が 20 に達している。または検証後に重大な未是正の違約が存在する。"
 hd_dc_gov.0001.t:0 "この案巻はいつ封ずるか？"
 hd_dc_gov.0001.desc:0 "書吏は検証済みの事項を一条ずつ指し示し、なお確認に時間を要する部分は脇へ置いた。勝敗は一つのこと、民が安らかに暮らせるか、約束が果たされるかはまた別のことである。\n\n今回の危機の案件番号は [hd_dc_governance_instance.Var('hd_dc_instance_id').GetValue|0]、実際の統治値は [hd_dc_governance_instance.Var('hd_dc_q').GetValue|0] である。今、案巻を封じて現時点の成果で最終結果を記録することもできるし、もう少し待って、この安定が時の試練に耐えうることを証明することもできる。"
 hd_dc_gov.0001.a:0 "現有の成果で結案する。"
 hd_dc_gov.0001.a.tt:0 "最終精算は一度だけ行われる：重大な未是正の違約が最優先で、危機 −10、繁栄は変化なし。そうでなければ、統治 ≥60 かつ連続 5 年の完全履約で危機 −35、繁栄 +30。統治 ≥40 かつ連続 3 年の実質的安定で危機 −20、繁栄 +15。統治 ≥20 かつ中核の戦争終結で危機 −10、繁栄 +5。反乱平定が鎮圧の結果のみの場合、精算の上限は最低段階となる。待つだけでは軍権と俸禄の改革の代わりにはならない。結案後は、より上の段階の報酬を受け取ることはできない。"
 hd_dc_gov.0001.b:0 "観察を続け、急いで巻を閉じない。"
 hd_dc_gov.0001.b.tt:0 "ひとまずこの案件を保留し、精算しない。真に最高段階に達すれば自動的に精算される。新たな関連戦争や未履行の義務があれば、連続安定の計時は中断される。後続の行動を待つ間、すでに解消された急性危機の枠がさらに占有されることはない。"
 hd_dc_gov.0002.t:0 "案巻封印の後"
 hd_dc_gov.0002.high:0 "五年の間、休戦は検証可能な記録を残し、約束も一つずつ果たされた。案吏は最終頁に結語を記し、新旧の文書を一つに綴じ合わせた。\n\nこの案件の統治に対する最高の報酬が記録された：危機 −35、繁栄 +30。政治上の勝敗は引き続き実情に従って記録され、今回の評定によって変更されることはない。"
 hd_dc_gov.0002.medium:0 "三年の安定によって、ついに十分な記録が積み上がった。なお完全でない点はあるものの、実行された休戦と安全保障の取り決めが消し去られるべきではない。\n\nこの案件の有効な安定に相応の報酬が与えられた：危機 −20、繁栄 +15。この案件は今後、重ねて報酬を受け取る資格を持たない。"
 hd_dc_gov.0002.low:0 "戦争は確かに終わり、事後処理の措置も検証された。今ここで結案すれば、記録されるのは限定的な緩和であり、長き太平をうたうことはまだできない。\n\nこの案件の限定的な緩和が記録された：危機 −10、繁栄 +5。この案件は今後、報酬を受け取る資格を持たない。"
 hd_dc_gov.0002.breach:0 "帳簿にはなお一件の重大な未履行の協定が残っており、その後の死亡・継承・勝利によって消されることもなく、真に是正されてもいない。案巻はその有利な面だけを残すわけにはいかない。\n\nこの案件は最終的に重大な未是正の違約として記録される：危機 +10、繁栄は変化なし。いかなる正の統治報酬も同時には付与されない。"
 hd_dc_gov.0002.a:0 "このとおり保存する。"

 hd_dc_pressure_character_2:0 "積弊次第に顕る"
 hd_dc_pressure_character_3:0 "疑忌相連なる"
 hd_dc_pressure_character_4:0 "公然たる失序"
 hd_dc_pressure_character_5:0 "危機の臨界"
 hd_dc_pressure_county_2:0 "積弊次第に顕る"
 hd_dc_pressure_county_3:0 "疑忌相連なる"
 hd_dc_pressure_county_4:0 "公然たる失序"
 hd_dc_pressure_county_5:0 "危機の臨界"
 hd_dc_pressure_status:0 "危世：[Situation.MakeScope.Var('hd_dc_pressure_percent').GetValue|1]/100 · 第 [Situation.MakeScope.Var('hd_dc_pressure_band').GetValue|0] 段階"
 hd_dc_pressure_status_tt:0 "危世の時期には、朝廷に累積した弊害を評価し、前代から引き継いだ要素を保持し、治世においてはそれに応じて調整する。触媒事件が発生した際、その代償は現在の時代の換算率で計算される。割拠地域は引き続き危世の時代の数値を用いる。危機の五段階と統治の賞罰はいずれもここの数値によって決まり、段階図における触媒の進捗は別に保持される。\n\n支配と発展は今回の基準値に従って郡ごとに累積して差し引かれる。より上の段階がなお未処理である場合にのみ、後にその差分が差し引かれる。数値が下がった後に同じ段階へ戻っても、重ねて差し引かれることはない。第 1 段階が 60 か月続いた後、次の周期で基準値が再計算される。"
 hd_dc_prosperity_status:0 "繁栄：[Situation.MakeScope.Var('hd_dc_prosperity_percent').GetValue|1]/100"
 hd_dc_prosperity_status_tt:0 "繁栄の記録は統治回復の成果を反映し、時代ごとにそれぞれ独立した下限と上限を持ち、範囲は 0 から 100 である。両者は同時に上下しうる。触媒は朝廷が好む発展あるいは拡張の方向に従って繁栄へ向かって進み、一度に一つの方向のみを考慮する。朝廷が一時的に主不在のときは、それまでの方向を踏襲する。時代が替わっても数値はリセットされない。\n\n段階図は引き続き元の時代の進捗を表示する。ここの繁栄の数値が直接時代を切り替えることはなく、割拠からの脱却にはなお実際の領土と安定期間の条件を満たす必要がある。"
 hd_dc_ritual_register_title:0 "王室の礼序"
 hd_dc_ritual_register_tt:0 "これは宗室の成員が争う際に依拠する礼序の名簿である。初回の確認時には、最高の称号の位階と年齢によって並べる。位階と年齢が同じ者は同列とする。以後は元の順序を保持し、天子が実際に賜った席次を別に記録する。今後宗室に関わる議事はすべて、現在の礼序に従って条件を満たす親族を招く。"
 hd_dc_ritual_register_row:0 "第 [Scope.Var('hd_dc_ritual_rank').GetValue|0] 位、[Scope.Var('hd_dc_actor').Char.GetName] · 旧序第 [Scope.Var('hd_dc_ritual_old_rank').GetValue|0] 位"
 hd_dc_roy_end.governance_pending_tt:0 "すでに生じた政治的結果のみを記録し、今回の急性危機を解消する。称号を再び移転することも、臣従者を解放することも、和平の報酬を与えることもない。終局の報酬は、実際の戦争・条約の履行・安定期間・違約の記録を参照して決定される。"
 hdpc_soft_pressure_modifier:0 "しばし民間に身を置く"
 hdpc_soft_pressure_modifier_desc:0 "人口調整の期間中、一時的に人物プールに置かれている。この出生率調整は最長で十年続く。朝廷に戻る、官職に就く、あるいは保護区域に入った場合、次回の年次メンテナンス時に解除される。この調整は健康を減らさず、直接死をもたらすこともない。"
 hdpc_high_pressure_modifier:0 "家の拡大を先送り"
 hdpc_high_pressure_modifier_desc:0 "キャラクターの属する人口が調整目標を超えた際に付与される一時的な出生率調整。この効果は最長で十年続き、転任などにより早期に解除される場合がある。この調整は永久的な不妊をもたらしたり、特性を変えたりせず、直接死をもたらすこともない。"

 # ===== 入关 / 反摄政 / 奉迎 =====
 hd_anti_regent.0100.a:0 "進軍を続ける。"
 hd_anti_regent.0200.t:0 "入関の後の天下"
 hd_anti_regent.0200.desc:0 "関門はついに開け放たれ、摂政の直轄領は連合軍の手に落ちた。諸将は帳前にそれぞれの軍功簿を差し出し、戦利品の分配を待っている。今や連盟の盟主として、私は封賞を主宰し、摂政による朝廷の専断に終止符を打たねばならない。"
 hd_anti_regent.0200.a:0 "功を論じて封ずる。"
 hd_enter_the_passes_victory_desc:0 "連合軍は関中を攻め破り、摂政の直轄領を奪取した。"
 hd_enter_the_passes_white_peace_desc:0 "侵攻戦争は白紙和平に終わり、連盟はそれとともに瓦解した。"
 hd_enter_the_passes_defeat_desc:0 "侵攻は撃退され、摂政は朝廷を守り抜いた。"
 HD_ENTER_THE_PASSES_WAR_NAME:0 "入関の戦い"
 hd_fengying.0001.alt_desc:0 "天子は関中から逃れることを余儀なくされた。しかし私にはまだ独立した領地がなく、朝廷を自らの治所に迎え入れることができない。それでも兵を送って護衛し、情勢を見守ることはできるし、介入をはっきり拒むこともできる。"
 hd_fengying_cao_control:0 "朝廷をしっかりと掌握する。"

 # ===== 地名形容词（取自对应中文地名） =====
