 lijiao_religion_desc:0 "古代中国において、「礼」は社会の根本制度であると同時に道徳規範でもあった。国家制度としては社会の政治秩序を反映し、上部構造と、その枠組みにおける人と人との交わりの礼儀を維持する。道徳準則としては、国家の統治者、貴族、そして社会のあらゆる成員の行動の基準と要求を定めた。"
