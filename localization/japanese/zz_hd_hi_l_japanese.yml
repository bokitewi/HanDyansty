 hd_hi.kebineng.t: "軻比能の辺境侵攻"
 hd_hi.kebineng.ctx: "檀石槐の死後、鮮卑の諸部はそれぞれ勝手に治めるようになった。小種の出身である軻比能は賞罰を明らかにし、次第に漠南の諸部をまとめ上げ、弓を引く騎兵十余万を擁するに至った。"
 hd_hi.kebineng.rise: "\n\n軻比能は諸部の騎兵を集めて長城を越え、代郡と上谷へ一直線に襲いかかった。辺塞の烽火は一夜のうちにことごとく燃え上がった。"
 hd_hi.kebineng.wait: "\n\n漢の辺郡の守りはなお固く、軻比能は軽々しく動こうとせず、塞外で離散した部衆を集め、弓馬を磨きながら、南下の時機を待っている。"
 hd_hi.shujineng.t: "樹機能の乱"
 hd_hi.shujineng.ctx: "秦涼一帯は連年の大旱魃に見舞われ、官府は賦役を厳しく取り立て、河西鮮卑と諸羌の恨みは深く積もっていた。禿髪部の樹機能は勇猛で知略に富み、諸胡の多くが彼の号令に従おうとしている。"
 hd_hi.shujineng.rise: "\n\n樹機能は鎮圧に来た刺史を斬り殺し、河西の諸胡は一斉に呼応して、涼州の道路は断たれた。"
 hd_hi.shujineng.wait: "\n\n朝廷は秦涼に重兵を駐屯させており、樹機能は耐え忍んで動かず、ひそかに諸羌と連絡を取り、恨みを刃に刻みつけている。"
 hd_hi.muronghui.t: "慕容廆の台頭"
 hd_hi.muronghui.ctx: "慕容部は代々遼西に住み、段部・宇文部と覇を争ってきた。若き慕容廆は部族を継ぐと、民に農桑を教え、流亡してきた中原の士人を招き入れ、部衆は日に日に盛んになった。"
 hd_hi.muronghui.rise: "\n\n慕容廆は部衆を整え、東は扶余を討ち、西は段部・宇文部に抗い、遼西と遼東をことごとく慕容氏の帳下に収めようとしている。"
 hd_hi.muronghui.wait: "\n\n遼東の諸部は勢力が拮抗しており、慕容廆はひとまず鋭鋒を収め、流民を落ち着かせながら、敵が隙を見せるのを待っている。"
 hd_hi.murongjun.t: "前燕の中原入主"
 hd_hi.murongjun.ctx: "中原は大いに乱れ、冉閔は胡人を虐殺し、諸胡と漢人が互いに攻め殺し合い、河北は一面の焦土となった。遼西の慕容氏は兵強く馬は壮んで、長城の北で形勢をうかがっている。"
 hd_hi.murongjun.rise: "\n\n慕容儁は兵を三路に分けて南下し、盧龍塞を越えて薊城を直接奪いにかかった。燕軍の鉄騎は河北全土を手中に収めようとしている。"
 hd_hi.murongjun.wait: "\n\n関内はまだ安定しており、慕容儁は兵を動かさず、遼西でひたすら兵器を磨き馬を養い、中原に変事が起こるのを静かに待っている。"
 hd_hi.tuobagui.t: "拓跋珪の代復興と魏建国"
 hd_hi.tuobagui.ctx: "代国が滅んだ後、拓跋氏の子孫は諸部に流浪した。少年拓跋珪は他人の庇護に身を寄せていたが、旧部はなお拓跋氏の恩義を忘れずにいる。"
 hd_hi.tuobagui.rise: "\n\n拓跋珪は牛川で諸部を大いに会して代王の位に即き、ほどなく国号を魏と改めた。拓跋氏の騎兵は再び陰山の麓を駆け巡る。"
 hd_hi.tuobagui.wait: "\n\n諸部の豪帥はそれぞれ思惑を抱き、拓跋珪はまだ羽翼が整わず、親族の間に身を隠すほかない。旧部と誼を結びつつ、天の時を待っている。"
 hd_hi.murongchui.t: "慕容垂の復国"
 hd_hi.murongchui.ctx: "慕容垂はかつて禍を避けて他国に身を投じ、その才を振るう場がなかった。今や天下は揺れ動き、旧燕の遺民は河北で慕容氏の帰還を待ちわびている。"
 hd_hi.murongchui.rise: "\n\n慕容垂は滎陽で燕王を自称し、旧部は噂を聞いて馳せ参じ、大軍は北へ黄河を渡って鄴城を目指した。"
 hd_hi.murongchui.wait: "\n\n今はまだ時局が乱れておらず、慕容垂は耐え忍ぶほかない。慕容氏の子弟を集めながら、一声で百人が応じる時機を待っている。"
 hd_hi.yaochang.t: "姚萇の秦建国"
 hd_hi.yaochang.ctx: "姚氏の羌人は代々関中に住み、部衆は数万を数える。姚萇は父や兄に従って半生を戦い抜いたが、今や兄たちは皆亡く、羌人の命運は彼一人の肩にかかっている。"
 hd_hi.yaochang.rise: "\n\n姚萇は渭北へ逃れ、諸羌は彼を盟主に推した。彼は大単于・万年秦王を自称し、関中に再び戦火が上がった。"
 hd_hi.yaochang.wait: "\n\n関中にはなお強大な主が鎮座しており、姚萇はひとまず頭を垂れ、羌人の豪帥を一人また一人と自分のもとへ引き寄せている。"
 hd_hi.qifuguoren.t: "乞伏国仁の西秦建国"
 hd_hi.qifuguoren.ctx: "乞伏部は代々隴西に住み、幾度も強大な隣国に従属してきた。乞伏国仁は勇略に優れ、部衆は皆、彼が乞伏氏を率いて自立することを望んでいる。"
 hd_hi.qifuguoren.rise: "\n\n乞伏国仁は隴西の諸部を召集し、大都督・大単于を自称して、勇士川に城を築き国を建てた。"
 hd_hi.qifuguoren.wait: "\n\n隴右の強大な隣国はなお健在で、乞伏国仁は表面上取り繕うほかなく、ひそかに隴西鮮卑を集めている。"
 hd_hi.lvguang.t: "呂光の河西帰還"
 hd_hi.lvguang.ctx: "呂光は命を受けて西征し、西域三十余国を平定すると、二万の騎兵と無数の駱駝や馬、亀茲の財宝を携えて東へ帰った。その途上、中原がすでに大乱に陥ったとの知らせが届いた。"
 hd_hi.lvguang.rise: "\n\n呂光の大軍が玉門関に入ると、河西の諸郡は風になびくように降伏した。彼は姑臧で涼州牧を自称し、河西はこれより呂の姓に変わった。"
 hd_hi.lvguang.wait: "\n\n河西の守将はなお自らを守ることができ、呂光の大軍はひとまず敦煌に駐屯するほかない。人も馬も疲れ果てたまま、情勢の変化を待っている。"
 hd_hi.tufawugu.t: "禿髪烏孤の南涼建国"
 hd_hi.tufawugu.ctx: "樹機能が敗れ滅んでから百年が過ぎたが、禿髪部は祖先の栄光を一度も忘れたことがない。烏孤は農に務め武を講じ、賢才を招き入れ、部衆は日増しに強盛となった。"
 hd_hi.tufawugu.rise: "\n\n禿髪烏孤は西平王を自称し、その兵鋒は湟水と金城に向けられた。河西鮮卑は再び刀槍を掲げた。"
 hd_hi.tufawugu.wait: "\n\n涼州にはなお強大な主がおり、烏孤は臣と称して貢物を納めるほかなく、野心を恭順な言葉の中に隠している。"
 hd_hi.juqumengxun.t: "沮渠蒙遜の涼占拠"
 hd_hi.juqumengxun.ctx: "盧水胡の沮渠氏は代々部族の首領である。蒙遜は諸史に広く通じ、天文にも明るく、部衆は皆、彼には雄傑の才があると言う。"
 hd_hi.juqumengxun.rise: "\n\n沮渠蒙遜は一万人を集めて金山に拠り、張掖の豪族と謀って事を起こし、河西の諸郡は震撼した。"
 hd_hi.juqumengxun.wait: "\n\n河西の主はなお強く、蒙遜は臣従を装うほかなく、陰で盧水胡の部族を一つまた一つとまとめ上げている。"
 hd_hi.helianbobo.t: "赫連勃勃の夏建国"
 hd_hi.helianbobo.ctx: "鉄弗部が北魏に撃破されたとき、少年勃勃は辛くも生き延び、転々として他者に身を寄せた。身の丈八尺五寸、気性は凶悍で、一族を滅ぼされた仇を一度も忘れたことがない。"
 hd_hi.helianbobo.rise: "\n\n勃勃は岳父を襲って殺し、その部衆を奪って大夏天王を自称した。夏軍は風のように去来し、嶺北の諸城は明日をも知れぬ身となった。"
 hd_hi.helianbobo.wait: "\n\n塞外の諸強国が周囲を窺っており、勃勃は他人の庇護に身を寄せるほかなく、仇恨と野心をともに胸の奥に押し込めている。"
 hd_hi.shelun.t: "社崙の可汗即位"
 hd_hi.shelun.ctx: "柔然部はたびたび北魏に敗れ、社崙は残部を率いて遠く漠北へ逃れた。そこは水草が豊かで、高車の諸部があちこちに散らばって住み、まさに部族を立て直すのにふさわしい地であった。"
 hd_hi.shelun.rise: "\n\n社崙は高車の諸部を併呑して丘豆伐可汗と号し、軍法を定めて千人を軍、百人を幢とした。柔然の騎兵は南下して辺境を侵し始めた。"
 hd_hi.shelun.wait: "\n\n南方の強敵の兵鋒はまさに盛んで、社崙は漠北で遊牧し、散らばった部族を服属させながら、南に隙が生じるのを待つほかない。"
 hd_hi.tande.t: "広開土王の版図拡大"
 hd_hi.tande.ctx: "高句麗は遼東と百済の狭間で生き残りを図り、幾代もの君主が戦場で無念をのんできた。若き談徳は即位すると、先王の恥を雪ぐことを誓った。"
 hd_hi.tande.rise: "\n\n談徳は自ら歩騎を率いて西へ遼水を渡り、さらに軍を南へ向けて、百済の諸城を次々と陥落させた。高句麗の人々は彼を広開土境平安好太王と称えた。"
 hd_hi.tande.wait: "\n\n遼東の強大な隣国はいまだ衰えず、談徳は軍を整え武を磨きながら、領土を切り開く好機を待つほかない。"
 hd_hi.balin.t: "六鎮の乱"
 hd_hi.balin.ctx: "北辺六鎮の将兵はもともと国家の爪牙であったが、今では鎮戸に落とされ、飢えと寒さに苦しみ、虐げられている。沃野鎮の破六韓抜陵は軍中で日頃から威望がある。"
 hd_hi.balin.rise: "\n\n抜陵は衆を集めて鎮将を殺し、元号を真王と改めた。六鎮の飢民は次々と呼応し、北辺に燎原の火が燃え広がった。"
 hd_hi.balin.wait: "\n\n鎮将はなお抑え込むことができ、抜陵は怒りを胸の奥に押し込め、ひそかに各鎮の豪傑と連絡を取っている。"
 hd_hi.tumen.t: "突厥の台頭"
 hd_hi.tumen.ctx: "突厥の人々は代々柔然のために鉄を鍛え、鍛奴と呼ばれていた。土門の部衆が次第に盛んになると、柔然の可汗に求婚したが、返ってきたのは罵倒であった。"
 hd_hi.tumen.rise: "\n\n土門は高車の諸部と連合して柔然を大いに破り、伊利可汗と号した。草原の主はこれより突厥に代わった。"
 hd_hi.tumen.wait: "\n\n柔然可汗の兵勢はなお盛んで、土門は屈辱に耐えて重荷を背負い、柔然のために鉄を打ち続けながら、ひそかに部衆をまとめるほかない。"
 hd_hi.muhan.t: "木杆可汗の南侵"
 hd_hi.muhan.ctx: "木杆可汗は容貌が奇異で、剛勇にして謀略に富み、西は嚈噠を破り、東は契丹を走らせ、北は契骨を併せて、塞外の諸国を威服させた。南方の二つの国はこぞって彼の機嫌を取ろうと争っている。"
 hd_hi.muhan.rise: "\n\n木杆可汗は十万騎を率いて南下し、中原の兵馬と共に晋陽を攻めた。突厥の鉄騎が初めて并州の地を踏んだ。"
 hd_hi.muhan.wait: "\n\n南方の兵力はなお強く、木杆可汗はただ両国からの歳幣を受け取りながら、彼らが互いに殺し合うのを静かに眺めている。"
 hd_hi.shabolue.t: "沙鉢略の辺境侵攻"
 hd_hi.shabolue.ctx: "沙鉢略可汗の可賀敦は中原の旧王朝の出であった。旧王朝が滅ぶと、彼女は昼夜を問わず、祖国のために仇を討つよう可汗に求めた。"
 hd_hi.shabolue.rise: "\n\n沙鉢略可汗は諸可汗と兵を合わせて四十万となり、木峡・石門の二道から塞内に入った。河西・隴右・代北が同時に急を告げた。"
 hd_hi.shabolue.wait: "\n\n中原の新たな主は基盤がまだ固まらぬものの兵勢はまさに盛んで、沙鉢略は兵を動かさず、可賀敦が昼夜泣き訴えるに任せるほかない。"
 hd_hi.liuyu.t: "劉裕の京口挙兵"
 hd_hi.liuyu.ctx: "劉裕は寒微の出で、若い頃は草鞋を売って暮らし、戦功によって北府軍の中で頭角を現した。今や朝廷の権臣が簒逆し、天下の人々は誰が最初に立ち上がるかを見守っている。"
 hd_hi.liuyu.rise: "\n\n劉裕は京口で義士を集めて守将を斬り、四方に檄を飛ばした。北府の健児は彼に従って江を渡り西へ進み、破竹の勢いで進撃した。"
 hd_hi.liuyu.wait: "\n\n朝廷の権臣の基盤はまさに固く、劉裕は耐え忍ぶほかなく、北府軍の中で志を同じくする兄弟と誼を結んでいる。"
 hd_hi.erzhurong.t: "爾朱栄の洛陽入城"
 hd_hi.erzhurong.ctx: "爾朱氏は代々秀容川に住み、牛・羊・駱駝・馬が山野を埋め尽くしていた。六鎮の乱が起こると、爾朱栄は家財を散じ尽くして義勇を募り、その麾下はすでに北地で最も精鋭の騎兵となっていた。"
 hd_hi.erzhurong.rise: "\n\n爾朱栄は先帝の仇を討つことを口実に軍を南へ向け、黄河を渡って洛陽に直接入った。朝堂の公卿は誰もが身の危険を感じた。"
 hd_hi.erzhurong.wait: "\n\n洛陽の朝廷はなお四方に号令でき、爾朱栄は秀容にとどまるほかない。流民を編入しながら、朝廷の動向を窺っている。"
 hd_hi.gaohuan.t: "高歓の信都挙兵"
 hd_hi.gaohuan.ctx: "高歓は懐朔鎮で育ち、六鎮の将兵の苦しみを深く知っている。かつて爾朱氏の帳下で働いたことがあり、今は二十万の六鎮の降戸を手中にしている。"
 hd_hi.gaohuan.rise: "\n\n高歓は信都で兵を挙げ、河北の豪族と同盟を結び、爾朱氏を一掃して天下に号令することを誓った。"
 hd_hi.gaohuan.wait: "\n\n爾朱氏は兵強く馬壮んで、高歓は表面上恭順を装うほかなく、六鎮の降戸をしっかりと手中に握っている。"
 hd_hi.yuwentai.t: "宇文泰の関中占拠"
 hd_hi.yuwentai.ctx: "宇文泰は武川鎮の出身で、軍に従って関中に入って以来、たびたび戦功を立てた。関隴の将兵は皆、彼には見識と度量があると言い、彼に従うことを願っている。"
 hd_hi.yuwentai.rise: "\n\n宇文泰は諸将に推されて統帥となり、軍を東へ進めて長安を手に入れた。関中はこれより一国を成した。"
 hd_hi.yuwentai.wait: "\n\n関中の主帥はなお健在で、宇文泰は耐え忍んで動かず、武川の旧友を一人また一人と身辺に引き入れるほかない。"
 hd_hi.houjing.t: "侯景の乱"
 hd_hi.houjing.ctx: "侯景は右足が短く、弓馬の腕は目立たないが、謀略に長けている。転々として南朝に身を寄せ、今は寿陽に兵を駐屯させているが、自分が捕虜交換の材料にされるかもしれないと知った。"
 hd_hi.houjing.rise: "\n\n侯景は君側の奸を除くことを名目に、八千人を率いて長江を渡り、台城を包囲した。江南百年の繁栄は、ここに灰燼に帰した。"
 hd_hi.houjing.wait: "\n\n江南の朝廷の兵力はなお厚く、侯景は寿陽で命知らずの者たちを集めながら、静かに時機を待つほかない。"
 hd_hi.yangjian.t: "楊堅の周簒奪"
 hd_hi.yangjian.ctx: "楊堅は関隴の武将の名門の出で、容貌は奇偉であり、帝王の相があると言われている。幼主が即位すると、朝廷の大権は次第に彼の手に落ちていった。"
 hd_hi.yangjian.rise: "\n\n楊堅は朝政を総攬し、三方の反乱を平定すると、ほどなく禅譲を受けて帝を称し、国号を隋とした。その目はすでに長江の南へと向けられている。"
 hd_hi.yangjian.wait: "\n\n朝廷の宗室はなお強く、楊堅は慎重に振る舞いながら、関隴の将領を一人また一人と抱き込むほかない。"
 hd_hi.qiaozong.t: "譙縦の蜀占拠"
 hd_hi.qiaozong.ctx: "譙縦は巴西譙氏の出で、謹厚な人柄から蜀中で人望がある。州は蜀兵を次々と東へ徴発し、長く従軍した兵は故郷を思い、陣中の不満は日ごとに増している。"
 hd_hi.qiaozong.rise: "\n\n軍が五城水口に至ると、蜀兵は反乱を起こし、譙縦を無理やり主に担いで成都を襲い取った。巴蜀の地は再び一国となった。"
 hd_hi.qiaozong.wait: "\n\n益州の兵勢はなお盛んで、譙縦は軽々しく動けず、郷里で帰郷を望む蜀兵とひそかに往来している。"
 hd_hi.luxun.t: "盧循の北上"
 hd_hi.luxun.ctx: "盧循は孫恩の妹婿で、孫恩の残党をまとめて海路南下し、番禺を占拠した。風采清秀で才芸に富み、嶺南で何年もひそかに楼船を造らせてきた。"
 hd_hi.luxun.rise: "\n\n北府の主力が遠方にある隙に、盧循は徐道覆とともに五嶺を越え、贛水を下った。楼船と旌旗が江面を覆い、その矛先は建康に向かう。"
 hd_hi.luxun.wait: "\n\n江左の兵はなお強く、盧循は嶺南で船を造り兵を鍛えながら、北府の主力が遠く離れる日を待つほかない。"

 hd_hi.0200.ok: "\n\nあなたは長年待ち続けた。今や四方の守りは次第に緩み、旧部や豪傑が次々と門を叩き、皆同じことを尋ねる。いつ動くのか、と。"
 hd_hi.0200.bad: "\n\nあなたは長年待ち続けたが、今なお敵は強大で、正面からぶつかれば部衆をむざむざ失うだけだ。今ある全てを捨て、腹心を連れて故地へ遠く去り、往時の名分を掲げて機をうかがうよう勧める者もいる。"
 hd_hi.0200.vassal: "\n\nひとたび事を起こせば、あなたと主君との君臣の名分はここで終わる。"
 hd_hi.0200.a: "時は我を待たず、兵を挙げて事を起こす"
 hd_hi.0200.b: "地を捨てて遠く去り、機をうかがう"
 hd_hi.0200.c: "しばし鋭鋒を避け、天の時を待つ"
 hd_hi.0200.d: "本分を守り、兵を動かさない"

 hd_hi.0300.desc: "\n\n[hd_hi_leader.GetFirstNameNoTooltip]は近頃しばしば旧部と行き来している。昨夜彼はあなたの前に来て、ずっと望んでいたことをするために、自分を去らせてほしいと願い出た。"
 hd_hi.0300.a: "人にはそれぞれ志がある。去るに任せよう"
 hd_hi.0300.b: "この者は放してはならぬ。強いて引き留める"

 hd_hi.1001.a: "成り行きを静観する"
 hd_hi.1001.b: "身を投じる"

 hd_hi.1002.desc: "\n\nあなたが治める土地は、すでに彼の心に刻まれている。"
 hd_hi.1002.a: "厳重に警戒せよ"

