 building_TK_20_84_ShuoFangQingYan1Ji_desc: "朔方県の南には金連塩沢と青塩沢があり、沢で産する塩は粒が大きく青白い色をしている。人々はこれを青塩、あるいは戎塩と呼び、医家は薬として用いる。朝廷はここに官を置いて塩を管理させている。今はまだ少数の塩戸がここで塩を採るのみで、産出は近隣の邑を賄う程度にすぎない。"
