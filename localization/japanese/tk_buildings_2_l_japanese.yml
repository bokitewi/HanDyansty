 building_TK_20_81_GongXianTieKuang1Ji_desc: "鞏県は洛陽の東にあり、南は嵩山の支脈に寄りかかり、山中では鉄鉱を採ることができる。河南郡の鉄官はここに冶場を置き、鋳造した鉄器にはみな「河三」の二字が印として鋳込まれている。今はまだ浅い坑がいくつか開かれただけで、炉もまばらである。"
