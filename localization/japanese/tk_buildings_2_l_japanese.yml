l_japanese:

 building_type_TK_20_64_ZhangYeDanXiaDiMao: "地形の景観"
 building_type_TK_20_64_ZhangYeDanXiaDiMao_desc: "山や岩は奇妙な形をしており、人の力で作れるものではない。土地の者は多く神怪の説をもってその由来をこじつけている。"
 TK_20_64_ZhangYeDanXiaDiMao: "張掖の丹霞地形"
 building_TK_20_64_ZhangYeDanXiaDiMao: "$TK_20_64_ZhangYeDanXiaDiMao$"
 building_TK_20_64_ZhangYeDanXiaDiMao_desc: "張掖郡の南、祁連山麓の丘陵の間では、岩が幾重にも重なり、赤・黄・青・白の色が入り交じって、まるで錦を広げたかのようである。日の出と日の入りのたびに山一面が炎のように燃え、行き交う戍卒や商旅は遠くからこれを望んで、誰もが驚嘆する。"
 building_type_TK_20_64_BaDanJiLinShaMo: "地形の景観"
 building_type_TK_20_64_BaDanJiLinShaMo_desc: "山や岩は奇妙な形をしており、人の力で作れるものではない。土地の者は多く神怪の説をもってその由来をこじつけている。"
 TK_20_64_BaDanJiLinShaMo: "バダインジャラン砂漠"
 building_TK_20_64_BaDanJiLinShaMo: "$TK_20_64_BaDanJiLinShaMo$"
 building_TK_20_64_BaDanJiLinShaMo_desc: "居延沢の南、弱水の東には、黄砂が幾千里とも知れず連なり、砂丘は山のようにそびえ、風が吹けば砂が雷のように鳴る。それでいて砂山の間には緑の小さな湖が数多く隠れており、水草が豊かで、胡人の牧人がときおり馬を追って水を飲ませに来る。"
 building_type_TK_20_64_GuiLinQiXingYan: "地形の景観"
 building_type_TK_20_64_GuiLinQiXingYan_desc: "山や岩は奇妙な形をしており、人の力で作れるものではない。土地の者は多く神怪の説をもってその由来をこじつけている。"
 TK_20_64_GuiLinQiXingYan: "桂林の七星岩"
 building_TK_20_64_GuiLinQiXingYan: "$TK_20_64_GuiLinQiXingYan$"
 building_TK_20_64_GuiLinQiXingYan_desc: "零陵郡始安県の東には七つの石の峰があり、北斗七星のように並んでいる。峰の腹の中には奥深い岩洞が隠れ、洞内には鍾乳石が垂れ下がり、石筍が林立し、玉や雪のように輝いている。足元には暗い地下の川がさらさらと流れている。"
 building_type_TK_20_64_WuLingYuan: "地形の景観"
 building_type_TK_20_64_WuLingYuan_desc: "山や岩は奇妙な形をしており、人の力で作れるものではない。土地の者は多く神怪の説をもってその由来をこじつけている。"
 TK_20_64_WuLingYuan: "武陵源"
 building_TK_20_64_WuLingYuan: "$TK_20_64_WuLingYuan$"
 building_TK_20_64_WuLingYuan_desc: "武陵郡充県の深山の中には、幾百幾千もの石峰が地から突き立ち、筍のよう、柱のようで、峰の頂には青々とした松が生え、一年じゅう雲霧が立ちこめている。山の下には谷川が縦横に流れ、洞穴は奥深く、猿や鹿が出没する。出入りの道を知るのは武陵蛮の人々だけである。"
 building_type_TK_20_64_YunNanShiLin: "地形の景観"
 building_type_TK_20_64_YunNanShiLin_desc: "山や岩は奇妙な形をしており、人の力で作れるものではない。土地の者は多く神怪の説をもってその由来をこじつけている。"
 TK_20_64_YunNanShiLin: "雲南の石林"
 building_TK_20_64_YunNanShiLin: "$TK_20_64_YunNanShiLin$"
 building_TK_20_64_YunNanShiLin_desc: "益州郡滇池の南東の山野には、灰白色の石の峰が一面に地から突き立ち、高いものは十余丈に及び、林のようにびっしりと並んでいる。その間を行く者は迷路に入ったかのようで、半日歩き回っても出口が見つからないことも多い。"
 building_type_TK_20_64_HaiShangShiLin: "地形の景観"
 building_type_TK_20_64_HaiShangShiLin_desc: "山や岩は奇妙な形をしており、人の力で作れるものではない。土地の者は多く神怪の説をもってその由来をこじつけている。"
 TK_20_64_HaiShangShiLin: "海上の石林"
 building_TK_20_64_HaiShangShiLin: "$TK_20_64_HaiShangShiLin$"
 building_TK_20_64_HaiShangShiLin_desc: "交趾郡の東の湾には、幾百幾千もの石の島が碧い波の中から突兀とそびえ立ち、柱のようなもの、屏風のようなものがあって、遠くから望めばまるで海上に石の林が生えたかのようである。島の岩洞は奥深く、鍾乳石が垂れ下がり、漁師はよく小舟を操って洞に入り風を避ける。"
 building_type_TK_20_80_ShouShanTongKuang1Ji: "銅鉱"
 building_type_TK_20_80_ShouShanTongKuang1Ji_desc: "銅は銭を鋳て器を造る根本である。この地の鉱脈は豊かで、採掘と製錬の炉火は一年中谷を赤く染めている。"
 TK_20_80_ShouShanTongKuang1Ji: "首山銅鉱Ⅰ級"
 building_TK_20_80_ShouShanTongKuang1Ji: "$TK_20_80_ShouShanTongKuang1Ji$"
 building_TK_20_80_ShouShanTongKuang1Ji_desc: "太史公の記すところによれば、黄帝は首山の銅を採り、荊山の麓で宝鼎を鋳た。鼎が成った日、龍が髯を垂らして黄帝を迎え、天へ昇らせたという。首山の銅はこれによって天下に名高くなった。今はまだ浅い坑がいくつか開かれただけで、炉もまばらである。"
 building_type_TK_20_80_ShouShanTongKuang2Ji: "銅鉱"
 building_type_TK_20_80_ShouShanTongKuang2Ji_desc: "銅は銭を鋳て器を造る根本である。この地の鉱脈は豊かで、採掘と製錬の炉火は一年中谷を赤く染めている。"
 TK_20_80_ShouShanTongKuang2Ji: "首山銅鉱Ⅱ級"
 building_TK_20_80_ShouShanTongKuang2Ji: "$TK_20_80_ShouShanTongKuang2Ji$"
