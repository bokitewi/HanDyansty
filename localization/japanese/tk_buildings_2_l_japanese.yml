 building_type_TK_20_85_HeTianYuShiKuang1Ji: "玉石鉱"
 building_type_TK_20_85_HeTianYuShiKuang1Ji_desc: "山中で美玉を採り、圭璧や佩飾に磨き上げる。君子は徳を玉になぞらえ、古来これを珍重してきた。"
 TK_20_85_HeTianYuShiKuang1Ji: "和田玉石鉱Ⅰ級"
 building_TK_20_85_HeTianYuShiKuang1Ji: "$TK_20_85_HeTianYuShiKuang1Ji$"
 building_TK_20_85_HeTianYuShiKuang1Ji_desc: "于闐国の南の大山の麓では、川の中に美玉が多く産する。孝武皇帝の時、漢の使者が河の源を窮め、この地の玉石を持ち帰った。天子は古い図書を調べ、玉石の出る山を崑崙と名づけた。今はまだ少数の採玉人が行き来するのみである。"
