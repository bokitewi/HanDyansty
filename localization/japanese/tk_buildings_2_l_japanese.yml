 TK_20_80_TongLvShanKuang1Ji: "銅緑山鉱Ⅰ級"
 building_TK_20_80_TongLvShanKuang1Ji: "$TK_20_80_TongLvShanKuang1Ji$"
 building_TK_20_80_TongLvShanKuang1Ji_desc: "江夏郡鄂県の境内に小さな山があり、大雨のあとには山の斜面に点々と緑青が浮かび出るため、土地の者はこれを銅緑山と呼んでいる。山中には極めて古い坑道や鉱滓が数多く残り、古老の言い伝えでは、殷周の頃からここで銅が採られていたという。今はまだ浅い坑がいくつか開かれただけで、炉もまばらである。"
