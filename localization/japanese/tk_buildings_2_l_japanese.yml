 TK_20_84_HeDongChiYan1Ji: "河東池塩Ⅰ級"
 building_TK_20_84_HeDongChiYan1Ji: "$TK_20_84_HeDongChiYan1Ji$"
 building_TK_20_84_HeDongChiYan1Ji_desc: "河東郡安邑城の南西には大きな塩池があり、数十里にわたって広がり、池の水は塩辛く苦い。夏に南風が吹きはじめると、池の面に自然と塩が結晶し、煮詰める必要もない。朝廷はそのため安邑に塩官を置いている。今はまだ少数の塩戸がここで塩を採るのみで、産出は近隣の邑を賄う程度にすぎない。"
