 building_type_TK_20_80_DeXingTongKuang4Ji_desc: "銅は銭を鋳て器を造る根本である。この地の鉱脈は豊かで、採掘と製錬の炉火は一年中谷を赤く染めている。"
 TK_20_80_DeXingTongKuang4Ji: "徳興銅鉱Ⅳ級"
