 TK_20_81_LinQiongTieKuang1Ji: "臨邛鉄鉱Ⅰ級"
 building_TK_20_81_LinQiongTieKuang1Ji: "$TK_20_81_LinQiongTieKuang1Ji$"
 building_TK_20_81_LinQiongTieKuang1Ji_desc: "秦が趙を破った時、趙の人・卓氏は蜀郡臨邛へ移された。県内に鉄山があるのを見るや、山に就いて鋳造を始め、千人にも及ぶ僮僕を使役して一地方随一の富を築いた。朝廷はのちに臨邛に鉄官を設けた。卓王孫の娘・文君が炉端で酒を売った昔話は、今も郷里に語り継がれている。今はまだ浅い坑がいくつか開かれただけで、炉もまばらである。"
