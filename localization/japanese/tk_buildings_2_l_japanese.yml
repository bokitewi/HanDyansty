 building_TK_20_85_PaGanYuShiKuang1Ji: "$TK_20_85_PaGanYuShiKuang1Ji$"
 building_TK_20_85_PaGanYuShiKuang1Ji_desc: "永昌の徼外南西の深山には大河が奔流しており、川辺の乱石の間ではしばしば翠色の美しい石が拾える。土地の者はこれを磨いて飾りとし、宝として珍重している。今はまだ少数の採玉人が行き来するのみである。"
