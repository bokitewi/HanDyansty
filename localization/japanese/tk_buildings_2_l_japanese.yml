 building_TK_20_84_HeDongChiYan3Ji_desc: "河東郡安邑城の南西には大きな塩池があり、数十里にわたって広がり、池の水は塩辛く苦い。夏に南風が吹きはじめると、池の面に自然と塩が結晶し、煮詰める必要もない。朝廷はそのため安邑に塩官を置いている。塩戸が集まり住んで里をなし、塩を運ぶ車や船が道に連なっている。"
 building_type_TK_20_84_HeDongChiYan4Ji: "塩鉱"
 building_type_TK_20_84_HeDongChiYan4Ji_desc: "塩は民の日用に欠かせぬものである。井戸を穿って鹹水を汲み、海水を煮、塩池で天日に干す。その利は厚く、古来官府が重んじてきた。"
