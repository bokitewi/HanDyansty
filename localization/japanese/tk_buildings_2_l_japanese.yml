 TK_20_81_TangXiTieKuang1Ji: "棠渓鉄鉱Ⅰ級"
 building_TK_20_81_TangXiTieKuang1Ji: "$TK_20_81_TangXiTieKuang1Ji$"
 building_TK_20_81_TangXiTieKuang1Ji_desc: "汝南郡西平県の棠渓は、戦国時代の韓の刀剣鋳造の地である。蘇秦が韓王に説いたとき、韓の兵の剣戟は冥山・棠渓・墨陽などの地に産し、陸では牛馬を断ち、水では鵠や雁を撃つと誇った。本朝は西平県に鉄官を置いている。今はまだ浅い坑がいくつか開かれただけで、炉もまばらである。"
