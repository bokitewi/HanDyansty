 building_TK_20_83_LingYangJinKuang1Ji_desc: "丹陽郡陵陽県の山中からは金が出て、陵陽の金は古くから江東に名高い。言い伝えによれば、仙人陵陽子明は石脂を服し、のちに白龍が迎えに来て、この山に百余年住んだという。今はまだ金戸がまばらにここで砂金を洗っているだけで、得られる量はわずかである。"
