 building_TK_20_81_GongXianTieKuang2Ji_desc: "鞏県は洛陽の東にあり、南は嵩山の支脈に寄りかかり、山中では鉄鉱を採ることができる。河南郡の鉄官はここに冶場を置き、鋳造した鉄器にはみな「河三」の二字が印として鋳込まれている。坑道は次第に深まり、炉も次第に増え、匠戸が集まり住んで里をなしている。"
 building_type_TK_20_81_GongXianTieKuang3Ji: "鉄鉱"
 building_type_TK_20_81_GongXianTieKuang3Ji_desc: "山を穿って石を採り、炉を集めて鉄を鋳る。産する鉄は犂や鋤、刀や戟に鋳られ、古来、官府が鉄官を置いて専らこれを掌ってきた。"
