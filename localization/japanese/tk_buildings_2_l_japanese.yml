 building_TK_20_87_WanShanZhuShaKuang4Ji_desc: "武陵郡南西の深山には丹砂の鉱脈が豊かで、土地の者は穴を穿って砂を採る。太史公は、巴蜀の寡婦清の先祖が丹穴を得て、その利を数代にわたり独占したと記しており、その丹穴はこのあたりの山中にあったとも言われる。丹砂の利は一地方随一であり、遠近の方士や商人で、その名を慕って来ない者はない。"
