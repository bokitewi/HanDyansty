 building_TK_20_83_HanJiaJinKuang1Ji_desc: "蜀郡属国の漢嘉県は旧名を青衣といい、孝順皇帝の陽嘉年間に今の名に改められた。青衣水両岸の山中からは金が出て、砂金を採る人々が水辺に散らばって住んでいる。今はまだ金戸がまばらにここで砂金を洗っているだけで、得られる量はわずかである。"
