 TK_20_85_LanTianYuShiKuang4Ji: "藍田玉石鉱Ⅳ級"
 building_TK_20_85_LanTianYuShiKuang4Ji: "$TK_20_85_LanTianYuShiKuang4Ji$"
 building_TK_20_85_LanTianYuShiKuang4Ji_desc: "京兆藍田県の山中からは美玉が産し、その色つやは温潤で、秦の時代から宮廷に重んじられてきた。班固は『西都賦』を作って長安の物産の盛んなことを誇り、わざわざ「藍田の美玉」の句を書き記した。美玉が次々と産出され、遠近の貴人が競って買い求めている。"
 building_type_TK_20_85_XiuYanYuShiKuang1Ji: "玉石鉱"
 building_type_TK_20_85_XiuYanYuShiKuang1Ji_desc: "山中で美玉を採り、圭璧や佩飾に磨き上げる。君子は徳を玉になぞらえ、古来これを珍重してきた。"
 TK_20_85_XiuYanYuShiKuang1Ji: "岫岩玉石鉱Ⅰ級"
 building_TK_20_85_XiuYanYuShiKuang1Ji: "$TK_20_85_XiuYanYuShiKuang1Ji$"
 building_TK_20_85_XiuYanYuShiKuang1Ji_desc: "遼東郡南東の山中からは青緑色の美玉が産し、その質は温潤である。『爾雅』は医無閭に産する美玉を東方の美とし、遼東の玉は古くから称えられてきた。今はまだ少数の採玉人が行き来するのみである。"
