 building_TK_20_85_HeTianYuShiKuang4Ji: "$TK_20_85_HeTianYuShiKuang4Ji$"
 building_TK_20_85_HeTianYuShiKuang4Ji_desc: "于闐国の南の大山の麓では、川の中に美玉が多く産する。孝武皇帝の時、漢の使者が河の源を窮め、この地の玉石を持ち帰った。天子は古い図書を調べ、玉石の出る山を崑崙と名づけた。美玉が次々と産出され、遠近の貴人が競って買い求めている。"
