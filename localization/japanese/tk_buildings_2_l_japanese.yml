 building_type_TK_20_86_MoGuBaoShiKuang1Ji: "宝石鉱"
 building_type_TK_20_86_MoGuBaoShiKuang1Ji_desc: "山の石の間にまれに光り輝く美しい石が見つかる。磨いて器とすれば値は黄金に匹敵し、貴人が争って秘蔵する。"
 TK_20_86_MoGuBaoShiKuang1Ji: "モゴック宝石鉱Ⅰ級"
 building_TK_20_86_MoGuBaoShiKuang1Ji: "$TK_20_86_MoGuBaoShiKuang1Ji$"
 building_TK_20_86_MoGuBaoShiKuang1Ji_desc: "撣国の境内には群山が重なり合い、谷間の土石の中に血のように深紅の宝石が眠っている。土地の者は谷川の砂礫の中でこれを洗い求め、一粒でも得れば命のように大切にする。今はまだ少数の土地の者がここで探し求めているのみである。"
 building_type_TK_20_86_MoGuBaoShiKuang2Ji: "宝石鉱"
 building_type_TK_20_86_MoGuBaoShiKuang2Ji_desc: "山の石の間にまれに光り輝く美しい石が見つかる。磨いて器とすれば値は黄金に匹敵し、貴人が争って秘蔵する。"
 TK_20_86_MoGuBaoShiKuang2Ji: "モゴック宝石鉱Ⅱ級"
 building_TK_20_86_MoGuBaoShiKuang2Ji: "$TK_20_86_MoGuBaoShiKuang2Ji$"
 building_TK_20_86_MoGuBaoShiKuang2Ji_desc: "撣国の境内には群山が重なり合い、谷間の土石の中に血のように深紅の宝石が眠っている。土地の者は谷川の砂礫の中でこれを洗い求め、一粒でも得れば命のように大切にする。宝を探す者は次第に増え、谷間に小屋が建てられるようになった。"
 building_type_TK_20_86_MoGuBaoShiKuang3Ji: "宝石鉱"
 building_type_TK_20_86_MoGuBaoShiKuang3Ji_desc: "山の石の間にまれに光り輝く美しい石が見つかる。磨いて器とすれば値は黄金に匹敵し、貴人が争って秘蔵する。"
 TK_20_86_MoGuBaoShiKuang3Ji: "モゴック宝石鉱Ⅲ級"
 building_TK_20_86_MoGuBaoShiKuang3Ji: "$TK_20_86_MoGuBaoShiKuang3Ji$"
 building_TK_20_86_MoGuBaoShiKuang3Ji_desc: "撣国の境内には群山が重なり合い、谷間の土石の中に血のように深紅の宝石が眠っている。土地の者は谷川の砂礫の中でこれを洗い求め、一粒でも得れば命のように大切にする。石を採る者が集まり住んで邑をなし、商旅が噂を聞きつけてやって来る。"
 building_type_TK_20_86_MoGuBaoShiKuang4Ji: "宝石鉱"
 building_type_TK_20_86_MoGuBaoShiKuang4Ji_desc: "山の石の間にまれに光り輝く美しい石が見つかる。磨いて器とすれば値は黄金に匹敵し、貴人が争って秘蔵する。"
 TK_20_86_MoGuBaoShiKuang4Ji: "モゴック宝石鉱Ⅳ級"
 building_TK_20_86_MoGuBaoShiKuang4Ji: "$TK_20_86_MoGuBaoShiKuang4Ji$"
