 building_type_TK_20_87_WanShanZhuShaKuang1Ji_desc: "丹砂は血のように赤く、薬にもなり顔料にもなる。方士はさらにこれを錬丹の至宝とみなしている。"
 TK_20_87_WanShanZhuShaKuang1Ji: "万山朱砂鉱Ⅰ級"
 building_TK_20_87_WanShanZhuShaKuang1Ji: "$TK_20_87_WanShanZhuShaKuang1Ji$"
 building_TK_20_87_WanShanZhuShaKuang1Ji_desc: "武陵郡南西の深山には丹砂の鉱脈が豊かで、土地の者は穴を穿って砂を採る。太史公は、巴蜀の寡婦清の先祖が丹穴を得て、その利を数代にわたり独占したと記しており、その丹穴はこのあたりの山中にあったとも言われる。今はまだ砂穴がいくつか開かれただけで、得られる量はわずかである。"
 building_type_TK_20_87_WanShanZhuShaKuang2Ji: "朱砂鉱"
 building_type_TK_20_87_WanShanZhuShaKuang2Ji_desc: "丹砂は血のように赤く、薬にもなり顔料にもなる。方士はさらにこれを錬丹の至宝とみなしている。"
 TK_20_87_WanShanZhuShaKuang2Ji: "万山朱砂鉱Ⅱ級"
 building_TK_20_87_WanShanZhuShaKuang2Ji: "$TK_20_87_WanShanZhuShaKuang2Ji$"
 building_TK_20_87_WanShanZhuShaKuang2Ji_desc: "武陵郡南西の深山には丹砂の鉱脈が豊かで、土地の者は穴を穿って砂を採る。太史公は、巴蜀の寡婦清の先祖が丹穴を得て、その利を数代にわたり独占したと記しており、その丹穴はこのあたりの山中にあったとも言われる。砂穴は次第に深まり、丹砂を採る戸が集まり住んで里をなしている。"
 building_type_TK_20_87_WanShanZhuShaKuang3Ji: "朱砂鉱"
 building_type_TK_20_87_WanShanZhuShaKuang3Ji_desc: "丹砂は血のように赤く、薬にもなり顔料にもなる。方士はさらにこれを錬丹の至宝とみなしている。"
 TK_20_87_WanShanZhuShaKuang3Ji: "万山朱砂鉱Ⅲ級"
 building_TK_20_87_WanShanZhuShaKuang3Ji: "$TK_20_87_WanShanZhuShaKuang3Ji$"
 building_TK_20_87_WanShanZhuShaKuang3Ji_desc: "武陵郡南西の深山には丹砂の鉱脈が豊かで、土地の者は穴を穿って砂を採る。太史公は、巴蜀の寡婦清の先祖が丹穴を得て、その利を数代にわたり独占したと記しており、その丹穴はこのあたりの山中にあったとも言われる。砂穴が互いに望めるほど立ち並び、人夫が雲のごとく集まり、丹砂は車に満載されて山の外へ運び出されている。"
