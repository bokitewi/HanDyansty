 building_TK_20_87_YuanLingZhuShaKuang1Ji_desc: "武陵郡沅陵県は沅水のほとりにあり、山中から出る丹砂は色鮮やかに赤く、鏡のように透き通って、古くから丹砂の上品とされてきた。方士はこれを求めて丹を錬り、画工はこれを用いて彩色する。今はまだ砂穴がいくつか開かれただけで、得られる量はわずかである。"
