 building_TK_20_88_YunXiXiKuang1Ji_desc: "漢中郡錫県は山中に錫を産することからその名がつき、王莽の時代には錫治と改称されたこともある。錫の坑は山あいの沢沿いに掘られ、殷商の頃にはすでにここで錫を採る者がいたと伝わる。今はまだ浅い坑がいくつか開かれたばかりで、冶炉もまばらである。"
