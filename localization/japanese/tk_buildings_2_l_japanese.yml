 building_TK_20_85_LanTianYuShiKuang1Ji_desc: "京兆藍田県の山中からは美玉が産し、その色つやは温潤で、秦の時代から宮廷に重んじられてきた。班固は『西都賦』を作って長安の物産の盛んなことを誇り、わざわざ「藍田の美玉」の句を書き記した。今はまだ少数の採玉人が行き来するのみである。"
