 building_type_TK_20_86_KeShiMiErBaoShiKuang1Ji: "宝石鉱"
 building_type_TK_20_86_KeShiMiErBaoShiKuang1Ji_desc: "山の石の間にまれに光り輝く美しい石が見つかる。磨いて器とすれば値は黄金に匹敵し、貴人が争って秘蔵する。"
 TK_20_86_KeShiMiErBaoShiKuang1Ji: "カシミール宝石鉱Ⅰ級"
 building_TK_20_86_KeShiMiErBaoShiKuang1Ji: "$TK_20_86_KeShiMiErBaoShiKuang1Ji$"
 building_TK_20_86_KeShiMiErBaoShiKuang1Ji_desc: "罽賓国北境の雪山の奥深く、崖の間には空のように深く青い宝石が眠っている。その色は濃く艶やかで、まるでビロードのようだ。罽賓はもともと珠璣・珊瑚・虎魄の産地として知られるが、この青い石は極めて稀である。今はまだ少数の土地の者がここで探し求めているのみである。"
