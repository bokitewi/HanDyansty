 building_TK_20_84_YanChengHaiYan1Ji_desc: "広陵郡塩瀆県は大海に臨み、潮に浸された浜の土は塩を含んでいるため、土を掻き集めて鹹水を漉し取り、海水を煮て塩を作ることができる。県内の水路は塩を運ぶために開かれたもので、県はそれにちなんで塩瀆と名づけられた。今はまだ少数の塩戸がここで塩を採るのみで、産出は近隣の邑を賄う程度にすぎない。"
