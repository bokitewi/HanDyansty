 building_type_TK_20_84_ZiGongJingYan1Ji_desc: "塩は民の日用に欠かせぬものである。井戸を穿って鹹水を汲み、海水を煮、塩池で天日に干す。その利は厚く、古来官府が重んじてきた。"
 TK_20_84_ZiGongJingYan1Ji: "自貢井塩Ⅰ級"
 building_TK_20_84_ZiGongJingYan1Ji: "$TK_20_84_ZiGongJingYan1Ji$"
 building_TK_20_84_ZiGongJingYan1Ji_desc: "犍為郡江陽県の山間には塩泉が多く、村人は井戸を穿って鹹水を汲み、竈を築いて煮詰め塩を作る。蜀で井戸を穿って塩を採る法は、秦の蜀守李冰に始まると伝えられる。今はまだ少数の塩戸がここで塩を採るのみで、産出は近隣の邑を賄う程度にすぎない。"
