 building_TK_20_81_WanChengTieKuang1Ji_desc: "南陽郡の治所である宛城は古くから製鉄で名高く、楚人は宛の鋼鉄で矛を鋳たが、その鋭さは蜂や蠍の針のようであったという。秦の時代に梁の人・孔氏がここへ移り住み、盛んに鋳造を興して巨富を築いた。今では朝廷も宛城に鉄官を置いている。今はまだ浅い坑がいくつか開かれただけで、炉もまばらである。"
