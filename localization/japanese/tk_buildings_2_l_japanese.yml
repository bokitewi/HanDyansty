 building_type_TK_20_81_WuAnTieKuang1Ji: "鉄鉱"
 building_type_TK_20_81_WuAnTieKuang1Ji_desc: "山を穿って石を採り、炉を集めて鉄を鋳る。産する鉄は犂や鋤、刀や戟に鋳られ、古来、官府が鉄官を置いて専らこれを掌ってきた。"
 TK_20_81_WuAnTieKuang1Ji: "武安鉄鉱Ⅰ級"
 building_TK_20_81_WuAnTieKuang1Ji: "$TK_20_81_WuAnTieKuang1Ji$"
