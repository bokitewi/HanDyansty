 building_yaan_golden_mines_04_desc:0 "$building_jiaodong_golden_mines_04_desc$"
 building_jiaodong_crystal_mines_01:0 "膠東水晶鉱"
 building_jiaodong_crystal_mines_01_desc:0 "$building_type_jiaodong_crystal_mines_01_desc$"
 building_jiaodong_crystal_mines_02:0 "拡張された膠東水晶鉱"
 building_jiaodong_crystal_mines_02_desc:0 "坑道は山腹へと延び、採掘される美しい石は日ごとに増え、城中には研磨を専門とする玉工もしだいに集まってきた。"
 building_linzi_iron_mines_01:0 "臨淄鉄鉱"
 building_linzi_iron_mines_01_desc:0 "$building_type_linzi_iron_mines_01_desc$"
 building_xuzhou_iron_mines_01:0 "徐州鉄鉱"
 building_xuzhou_iron_mines_01_desc:0 "$building_type_xuzhou_iron_mines_01_desc$"
 building_xuzhou_iron_mines_02:0 "拡張された徐州鉄鉱"
 building_xuzhou_iron_mines_02_desc:0 "坑道は年々広がり、鉄官はより多くの工徒と冶炉を加え、産出される鉄材は日増しに増えている。"
 building_xuzhou_iron_mines_03:0 "大規模な徐州鉄鉱"
 building_xuzhou_iron_mines_03_desc:0 "製鉄の工房が山沿いに広がり、送風の革袋は昼夜止まることなく、鋳造された犂・鋤・刀・戟が四方へ運ばれていく。"
 building_xuzhou_iron_mines_04:0 "徐州鉄鉱群"
 building_xuzhou_iron_mines_04_desc:0 "坑と冶炉が連なり、炉火が山嶺の半ばを赤く照らす。この地の鉄は一州の農具と兵甲を賄うに足る。"
