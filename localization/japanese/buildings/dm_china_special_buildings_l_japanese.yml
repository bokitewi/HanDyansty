l_japanese:
 building_baijing_01:0 "白陘"
 building_baijing_01_desc:0 "河内共県の北、太行山中に岩を穿って開かれた山道があり、絶壁の間を曲がりくねって、東は河内へ出て、西は上党に入る。道の石面は車輪や馬蹄に磨かれて滑らかになっている。太平の世には商旅の往来する近道となり、兵乱の世には守りを固める要害となる。"
 building_dagu_01:0 "大谷関"
 building_dagu_01_desc:0 "洛陽の東南、山々の間に深い谷が挟まれている。旧名を通谷といい、京師から南へ潁川・汝南へ下る近道である。谷道は狭く長く、ここに伏兵を置けば南北の往来を断つことができる。朝廷は京師の四方に関を設けており、ここはその一つである。"
 building_dasanguan_01:0 "大散関"
 building_dasanguan_01_desc:0 "散関は陳倉の南、大散嶺の上にあり、周代の散国の関所であったと伝えられる。北へ下れば関中の沃野、南へ出れば故道を経て漢中に直行できる。かつて高祖が故道から北へ出て雍王章邯を襲い破ったのも、まさにこの道であった。"
 building_dasuisai_01:0 "大隧塞"
 building_dasuisai_01_desc:0 "淮水の南、大別の山々の間にある隘路で、古人はしばしばこれを直轅・冥阨と並べて称した。春秋時代、呉王闔閭が楚を討った際、楚臣沈尹戌は、呉人の舟を焼き払い、さらに大隧・直轅・冥阨を塞いで退路を断つという策を献じた。"
 building_dujiangyan_01:0 "都江堰"
 building_dujiangyan_01_desc:0 "秦代、蜀守李冰は江をせき止めて堤を築き、岷江を二つに分け、水を引いて成都平野に通した。舟を通すこともでき、田を潤すこともできた。これより蜀中では水害も旱魃も人の意のままとなり、飢饉を知らず、時の人はここを天府と称した。"
 building_fengyue_01:0 "封岳関"
 building_fengyue_01_desc:0 "魏郡武安の西、滏水が山の下から湧き出し、二つの山が向かい合って、その間に狭い口が開けている。名を滏口という。鄴城から西へ太行を越えて上党へ向かうには、多くこの道を取る。"
 building_guancheng_01:0 "関城"
 building_guancheng_01_desc:0 "汝水の北に天子の広成苑があり、苑の南では二つの山が一筋の川を挟んでいる。朝廷はここに関を置き、京師から南の汝・潁へ出る道を押さえた。馬融はかつて『広成頌』を作り、この地の苑囿と狩猟の盛んなさまを書き連ねた。"
 building_type_guancheng_01_desc:0 "$building_guancheng_01_desc$"
 building_hanguguan_01:0 "函谷関"
 building_hanguguan_01_desc:0 "崤山の間の谷は函のように深く、車は並んで進めず、馬は轡を並べられない。関中から東へ出る門戸である。秦人はここに拠って東に向かい、六国合従の兵は関を叩けども入ることができなかった。孝武皇帝の時、楼船将軍楊僕は関外の民であることを恥じ、関城を東の新安へ移すよう上奏した。"
 building_hongzhisai_01:0 "鴻池塞"
 building_hongzhisai_01_desc:0 "常山郡西北の太行山中、峰々が向かい合い、山道は険しく切り立っている。戦国時代にはすでに趙人がここに塞を設けていた。この塞は北は代郡に通じ、南は常山を守り、燕趙の地から西へ出る険要である。"
 building_huangjintai_01:0 "黄金台"
 building_huangjintai_01_desc:0 "燕の昭王は斉への仇を報いんとして、郭隗のために宮を築き、師の礼をもって遇した。すると楽毅は魏から、鄒衍は斉から、劇辛は趙から赴き、天下の賢士が争って燕へ集まった。後の人は、昭王が高台を築いてその上に黄金を置き、賢才を招いたと伝え、この高台の名はそこから来ている。"
 building_hulaoguan_01:0 "虎牢関"
 building_hulaoguan_01_desc:0 "成皋は旧称を虎牢といい、周の穆王がここで狩りで得た猛虎を飼ったと伝えられる。城は山嶺に拠り、北は大河に臨み、洛陽の東で最も重要な門戸である。楚漢の争いの際には、高祖と項羽がここで幾度も奪い合い、年を越えて対峙した。"
 building_jianmenguan_01:0 "剣閣"
 building_jianmenguan_01_desc:0 "大剣山と小剣山の間で絶壁が途切れ、両側の崖が門のように向かい合っている。石牛道がその中を通り、山道は絶壁に沿って曲がりくねりながら登っていく。旅人はよじ登って越えていくが、一人がここを守れば万の軍勢も越えがたい。"
 building_jingjinguan_01:0 "井陘関"
 building_jingjinguan_01_desc:0 "常山郡井陘県、太行山中で四方が高く中央が低く、井戸の底のような形をしていることから井陘と名づけられ、天下九塞の一つに数えられる。かつて韓信は軍を率いてこの陘を抜け、背水の陣を敷いて、一戦で趙を破った。"
 building_Jixiaxuegong_01:0 "稷下学宮"
 building_Jixiaxuegong_01_desc:0 "斉の都臨淄の稷門のもとで、斉の宣王は天下の文学遊説の士を広く招き、邸宅を与え、政務に携わらせずに国政を論議させた。百家の説がここで競い合った。荀卿は最も年長で、三度祭酒を務めた。"
 building_juyongguan_01:0 "居庸関"
 building_juyongguan_01_desc:0 "上谷郡居庸県の南、軍都山中に長い谷が数十里にわたって曲がりくねり、両側には高山が壁のようにそびえ立つ。関城はその谷の中に設けられ、天下九塞の一つに数えられる。ここは薊城から北の塞外へ出る要路であり、胡騎が南下する際にも、しばしばここで関を叩いた。"
 building_lingqu_01:0 "霊渠"
 building_lingqu_01_desc:0 "始皇帝は兵を発して南の百越を征し、監禄に命じて渠を開削させ、湘水と漓水を通じさせた。これにより楼船や糧秣は江漢から嶺南へ直行できるようになった。水路は狭いながらも南北の水運を結びつけ、嶺南はもはや遠く隔絶した地ではなくなった。"
 building_loufan_01:0 "楼煩関"
 building_loufan_01_desc:0 "楼煩はもとは北方の胡人の部族名で、騎射に長けていた。趙の武霊王は北の楼煩を破り、汾水上流の山谷に関を設けて胡人に備えた。関城は北は雁門を制し、南は太原を守る。"
 building_mengjin_01:0 "孟津"
 building_mengjin_01_desc:0 "洛陽の北にある大河の渡し場で、盟津ともいう。武王が紂を討った際、諸侯が期せずしてここに会し、その後河を渡って北上したと伝えられる。ここは河面が穏やかで、京師の北で最も重要な渡し場であり、朝廷が京師の四方に設けた関の中にも、孟津は含まれている。"
 building_mineguan_01:0 "黽阨関"
 building_mineguan_01_desc:0 "冥阨は黽塞とも書き、淮水と漢水の間、大別の山々の中にある険要で、『呂氏春秋』は天下九塞の一つに挙げている。南は江漢を守り、北は中原を望む。春秋時代に呉と楚が干戈を交えた際、楚人はこの関を塞ぐことを謀った。"
 building_piantou_01:0 "偏頭関"
 building_piantou_01_desc:0 "大河は塞外から東へ流れ来て、ここで折れて南へ流れる。東岸の山嶺は東が高く西が低く、地勢が偏って傾いている。この地は雁門と西河の間にあり、匈奴の騎兵はしばしば冬に河の氷を渡って南下した。并州西北の辺防の要である。"
 building_tianjing_01:0 "天井関"
 building_tianjing_01_desc:0 "上党郡高都県の南、太行山の頂に関城が設けられ、関の前には底知れぬ深さの泉井が三つあることから天井と名づけられた。ここから南へ下れば河内、北へ上れば上党に入る。太行南端の鍵である。"
 building_tongguan_01:0 "潼関"
 building_tongguan_01_desc:0 "華山の東北、大河の南岸の高台が深い溝で切り裂かれ、道は溝の底と河岸に沿って曲がりくねるしかなく、地勢は険しく狭い。ここは古く桃林の塞と呼ばれ、武王が殷に勝った後、ここ桃林の野に牛を放ち、天下に再び兵を用いないことを示したと伝えられる。"
 building_wuguan_01:0 "武関"
 building_wuguan_01_desc:0 "武関は商県の東、丹水の河谷にあり、春秋時代には少習と呼ばれた。関中の東南から南陽・荊楚へ通じる咽喉である。秦の昭王はここで楚の懐王を誘い出して捕らえた。高祖が西の咸陽に入った時も、まずこの関を破ってから進んだ。"
 building_wushengguan_01:0 "武勝関"
 building_wushengguan_01_desc:0 "直轅は大別の山々の中にある隘路で、二つの山が向かい合い、その間に一筋の道が通じている。古来、淮水以南の南北往来の大道である。春秋時代には大隧・冥阨とともに楚国北面の障壁であり、楚人はこれを頼みに北方を防いだ。"
 building_xiameng_01:0 "夏門関"
 building_xiameng_01_desc:0 "広漢郡葭萌県、西漢水と白水がここで合流し、群山に囲まれている。この地は古くは苴侯の国であり、秦の恵王が蜀を討った際、蜀王が敗れたのも葭萌であった。城は北は漢中に通じ、南は成都へ下る、蜀へ入る要衝である。"
 building_xiaoguan_01:0 "蕭関"
 building_xiaoguan_01_desc:0 "蕭関は安定郡朝那県の境内にあり、隴山を背にして涇水上流の河谷を押さえる、関中西北の鍵である。孝文皇帝の時、匈奴がこの関を攻め破り、烽火は甘泉宮にまで伝わって、朝野を震撼させた。"
 building_xiaopingjin_01:0 "小平津"
 building_xiaopingjin_01_desc:0 "洛陽の北にあるもう一つの大河の渡し場で、地位は孟津に次ぐことから小平津と呼ばれる。河中には中州が点在し、流れは穏やかである。朝廷は京師の四方に関を設けており、この津にも都尉が駐屯して守っている。"
 building_xuanmen_01:0 "旋門関"
 building_xuanmen_01_desc:0 "成皋の西、山坂が曲がりくねって旋回し、まるで門のようであることから旋門と呼ばれる。班昭は子に従って東へ赴いた際にこの地を通り、河洛の交わりと成皋旋門の景色を『東征賦』に書き込んだ。洛陽から東へ出ると、ここを過ぎれば守るべき険阻はもうない。"
 building_xuanyuan_01:0 "軒轅関"
 building_xuanyuan_01_desc:0 "太室山と少室山の間、山道は曲がりくねって行きつ戻りつすることから轘轅と呼ばれる。この道は洛陽の東南から潁川へ通じる近道であり、朝廷が京師の四方に設けた関の中にも、轘轅は含まれている。"
 building_yangguan_01:0 "陽関"
 building_yangguan_01_desc:0 "敦煌郡竜勒県の境内にあり、玉門関の南にあることから陽関と呼ばれ、塞を出て西へ向かう南道の門戸である。関外には砂礫が果てしなく広がり、水草は乏しい。使節や商旅はここまで来ると、中原に別れを告げることになる。"
 building_yangping_01:0 "陽平関"
 building_yangping_01_desc:0 "漢中郡西境の山谷の中、漢水北岸で二つの山が向かい合い、関城は漢中から西の武都へ、北の陳倉へ出る道を押さえている。ここは漢中の西門であり、ここを守ってこそ南鄭は安らかに眠れる。"
 building_yanmenguan_01:0 "雁門関"
 building_yanmenguan_01_desc:0 "句注山は雁門郡の南に横たわり、山勢は険しく切り立ち、中に隘路がある。雁が南北へ往来する際はみなここを飛び越えると伝えられる。山上には句注塞が設けられ、天下九塞の一つに数えられる。并州北辺で胡騎を防ぐ最も重要な障壁である。"
 building_yaoguan_01:0 "嶢関"
 building_yaoguan_01_desc:0 "藍田県の南、嶢山と蕢山の間の険しい関で、武関道から関中へ入る最後の門戸である。高祖が西の咸陽に入った時は、まず財宝で秦将を誘い、さらに嶢関を迂回して蕢山を越え、秦軍を撃破して、そのまま覇上に至った。"
 building_yijue_01:0 "伊闕関"
 building_yijue_01_desc:0 "洛陽の南、二つの山が東西に向かい合い、伊水がその間を貫いて流れる。望めば宮闕のようであることから伊闕と呼ばれる。戦国時代、秦将白起はここで韓魏の軍を大破した。朝廷が京師の四方に設けた関の中にも、伊闕は含まれている。"
 building_yumen_01:0 "玉門関"
 building_yumen_01_desc:0 "孝武皇帝は河西の諸郡を開設し、塞を築いて敦煌にまで至らせ、玉門関を設けて西域と通じた。諸国の使節や胡商はみなここから塞内に入った。関外には流砂が千里にわたる。班超は長く西域に駐留し、晩年に上書して、ただ生きて玉門関に入ることだけを願った。"
 building_zhanghuagong_01:0 "章華宮"
 building_zhanghuagong_01_desc:0 "楚の霊王が築いた離宮の高台で、台は高く広く、宮室は壮麗であった。落成の日には諸侯を招いて共に祝った。霊王は細い腰を好み、宮中の人々は痩せようとして多くが飢え死にした。後の人はたびたびこれを戒めとした。"
 building_zhugong_01:0 "渚宮"
 building_zhugong_01_desc:0 "楚国の別宮で、郢都の東南、江の中州の上にある。楚王はここで江に臨んで政務を聴き、大江と漢水を往来する舟を見張ることも、南巡の際の駐蹕の所とすることもできた。"
 building_gusugong_01:0 "姑蘇台"
 building_gusugong_01_desc:0 "呉王闔閭が築き始め、夫差が増築した高台で、呉県の西南、姑蘇山の上にある。台上には宮館が連なり、登れば太湖の煙波と田野の村落を見下ろせる。呉が滅んだ後、台榭はしだいに廃墟となり、ただ跡地が残って人々が往時を偲ぶばかりである。"
 building_zhennan_01:0 "鎮南関"
 building_zhennan_01_desc:0 "鬱林と交趾の間には山々が重なり、森は深く谷は暗い。山間に一筋の隘路があり、嶺南の陸路から交趾へ通じる要衝である。光武皇帝の時、伏波将軍馬援が南征し、山に沿って道を開いたことで、大軍はようやく南下できた。"
 building_zhouwanggong_01:0 "周王宮"
 building_zhouwanggong_01_desc:0 "周の平王が東遷した後、天子は洛邑の王城に住んだ。殿宇は高くそびえ、長い回廊が巡り、天子はここで諸侯を朝会させ、天地を祀った。王城の旧址は河南県にあり、土地の古老は今でも往時の宮闕のあった場所を指し示すことができる。"
 building_zijin_01:0 "紫荊関"
 building_zijin_01_desc:0 "易水上流の山谷の中、二つの山が挟み合い、斜面には紫荊が多く生え、関城は坂に依り水に沿って築かれている。この関は涿郡から西の太行へ入り、代の地へ通じる隘路であり、北辺に急があれば、しばしば大軍がここに駐屯して守った。"

 building_jiaodong_golden_mines_01:0 "膠東金鉱"
 building_jiaodong_golden_mines_01_desc:0 "$building_type_jiaodong_golden_mines_01_desc$"
 building_jiaodong_golden_mines_02:0 "拡張された膠東金鉱"
 building_jiaodong_golden_mines_02_desc:0 "坑道はますます深く掘り進められ、工匠は木を組んで坑壁を支え、金脈を追って地中のさらに深くへと探っていく。"
 building_jiaodong_golden_mines_03:0 "大規模な膠東金鉱"
 building_jiaodong_golden_mines_03_desc:0 "金を採る家は日ごとに増え、山の麓には淘汰場や冶炉が立ち並び、溶かして作られた金餅が次々と郡府へ運ばれていく。"
 building_jiaodong_golden_mines_04:0 "膠東金鉱群"
 building_jiaodong_golden_mines_04_desc:0 "坑道は山野一面に広がり、採掘・淘汰・溶鋳にはそれぞれ専門の者がいる。この地で産する黄金は絶え間なく府庫へと送り込まれる。"
