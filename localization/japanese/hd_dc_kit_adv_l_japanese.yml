l_japanese:
 # 天朝循环·时代特色：进取期套件（docs/天朝循环_时代特色重制计划.md §3.2）

 # ---------- 决议 ----------
 hd_dc_kit_adv_compile_canon_decision: "大典を編纂する"
 hd_dc_kit_adv_compile_canon_decision_desc: "盛世に典籍を修めるのは、後世の規範とするためである。館を開いて天下の宿儒を招き、群書を集めて一代の大典を編む。"
 hd_dc_kit_adv_compile_canon_decision_tooltip: "館を開いて書を修め、一代の大典を編纂する"
 hd_dc_kit_adv_compile_canon_decision_confirm: "館を開いて書を修める"
 hd_dc_kit_adv_compile_canon_decision_effect_tt: "詔して史館を開き、朝廷で最も学識の深い廷臣と封臣数名を招いて編纂に参加させる。5年後に大典が完成すると、編纂に携わった諸儒の学問はいっそう進み、大典はあなたの秘閣に収められ、本族の文風も大いに振るう："
 hd_dc_kit_adv_compile_code_decision: "律令を刪定する"
 hd_dc_kit_adv_compile_code_decision_desc: "刑律が煩雑かつ苛酷であれば、官吏が悪事を働く余地となる。有司に命じて煩を削り簡に就かせ、一代の律令を刪定して天下に頒布する。"
 hd_dc_kit_adv_compile_code_decision_tooltip: "煩を削り簡に就き、一代の律令を刪定する"
 hd_dc_kit_adv_compile_code_decision_confirm: "律令を刪定する"
 hd_dc_kit_adv_compile_code_decision_effect_tt: "有司が新律を刪定し、1年後に天下に頒布する。また一部の典籍として刊行し、あなたの秘閣に収める："
 hd_dc_kit_adv_reform_decision: "変法図強"
 hd_dc_kit_adv_reform_decision_desc: "積弊は日に日に深まり、改革なくしては奮い立たせることはできない。能臣を選んで新法を主宰させ、田畝を測量し、賦役を均しくする――ただし世家大族は決して黙ってはいないだろう。"
 hd_dc_kit_adv_reform_decision_tooltip: "田畝を測量し、賦役を均しくする"
 hd_dc_kit_adv_reform_decision_confirm: "詔して新法を施行する"
 hd_dc_kit_adv_reform_decision_effect_tt: "天朝の大臣のうち最も財務に長けた者が新法を主宰する。以後5年間、寒門と世族の綱引きは絶えず、あなたの対応が成否を左右する。寒門の勢いが世族に勝り、主宰する大臣が財務に精通しているほど、新法は推進しやすくなる。現時点での見込みはおよそ #high [ROOT.Char.MakeScope.ScriptValue('hd_dc_kit_adv_reform_chance_value')|0]%#! である。"
 hd_dc_kit_adv_if_success_tt: "新法が施行されれば："
 hd_dc_kit_adv_if_failure_tt: "新法が挫折すれば："
 hd_dc_kit_adv_reform_county_tt: "あなたの直轄の各[county|E]"
 hd_dc_kit_adv_compile_cd_tt: "20年以内に大典や律令を編纂していない"
 hd_dc_kit_adv_compiling_tt: "史館に未完成の書がない"
 hd_dc_kit_adv_reform_once_tt: "あなたはまだ変法を行ったことがない"

 # ---------- 修正 ----------
 hd_dc_kit_adv_code_modifier: "律令の頒布"
 hd_dc_kit_adv_code_modifier_desc: "新律は簡潔で、吏治は清明、政令は滞りなく行き渡る。"
 hd_dc_kit_adv_reform_modifier: "新法の成果"
 hd_dc_kit_adv_reform_modifier_desc: "新法の施行は成果を上げ、賦役は均しくなり、府庫は満ちている。"
 hd_dc_kit_adv_reform_failed_modifier: "新法の挫折"
 hd_dc_kit_adv_reform_failed_modifier_desc: "変法はあと一歩で失敗に終わり、朝野は失望している。"
 hd_dc_kit_adv_canon_culture_modifier: "大典の流布"
 hd_dc_kit_adv_canon_culture_modifier_desc: "欽定の大典が天下に頒布され、士林は争ってこれを書き写している。"
 hd_dc_kit_adv_taixue_student_modifier: "太学の盛況"
 hd_dc_kit_adv_taixue_student_modifier_desc: "文治の盛世、太学には弦歌の音が絶えず、学生たちは日々進歩している。"

 # ---------- 好感 ----------
 hd_dc_kit_adv_gathering_opinion: "文会での唱和"
 hd_dc_kit_adv_compile_opinion: "大典の編纂に参加"
 hd_dc_kit_adv_reform_angered_opinion: "新法を強引に推し進めた"
 hd_dc_kit_adv_reform_promoted_opinion: "新法を推進した"
 hd_dc_kit_adv_poem_praised_opinion: "詩賦で意気投合"
 hd_dc_kit_adv_poem_mocked_opinion: "公衆の面前で嘲った"
 hd_dc_kit_adv_qingyi_heeded_opinion: "諫言を容れること流るるがごとし"
 hd_dc_kit_adv_qingyi_suppressed_opinion: "清議を封じた"
 hd_dc_kit_adv_recommend_opinion: "賢人推挙の功"
 hd_party_hostile_half_opinion: "朋党の対立（盛世による緩和）"
 hd_party_hostile_double_opinion: "朋党の対立（党争による消耗）"
 hd_party_coop_double_opinion: "朋党の協力（盛世の和衷）"

 # ---------- 典籍宝物 ----------
 hd_dc_adv_canon_book_name: "欽定大典"
 hd_dc_adv_canon_book_desc: "盛世に編纂された一代の大典。経史子集を網羅し、巻帙は浩瀚で、後世の学者の宗とするところとなる。"
 hd_dc_adv_code_book_name: "欽定律令"
 hd_dc_adv_code_book_desc: "刪定・頒布された一代の律令。条目は簡潔、刑名には基準があり、天下が法を守る根本となる。"

 # ---------- 修典事件 ----------
 hd_dc_adv.0001.t: "館を開いて書を修める"
 hd_dc_adv.0001.desc: "詔書が下され、史館が大きく開かれた。天下の蔵書が絶え間なく都へ運び込まれ、宿儒・学士たちが部門ごとに分けて編次し、誤りを校勘している。\n\nこれは数年にわたる大事業となるだろう。"
 hd_dc_adv.0001.a: "精審を期し、後世に伝えよ。"
 hd_dc_adv.0001.a.tt: "大典の完成にはおよそ5年を要する。"
 hd_dc_adv.0002.t: "今古文の争い"
 hd_dc_adv.0002.desc: "大典の編纂が経部に至ると、館中の諸儒は古文と今文のいずれを採るかで争い、決着がつかない。古文を宗とする者は多くが世家の旧族出身、今文を主とする者は多くが寒素の新進であり、互いに譲らず、書稿はそのために棚上げとなっている。"
 hd_dc_adv.0002.a: "古文を宗とし、先王の旧を存する。"
 hd_dc_adv.0002.b: "今文を立て、当世の用に通じる。"
 hd_dc_adv.0002.c: "諸説を兼ね採り、一家に偏らない。"
 hd_dc_adv.0003.t: "大典完成"
 hd_dc_adv.0003.desc: "5年の歳月を経て、大典はついに完成した。総纂官が諸儒を率いて書を捧げて殿に上り、巻帙は丹墀を埋め尽くした。\n\nこれより後、天下の学者は皆この書を宗とするであろう。"
 hd_dc_adv.0003.a: "秘閣に収め、副本を天下に頒布せよ。"
 hd_dc_adv.0011.t: "律令の頒布"
 hd_dc_adv.0011.desc: "新律の刪定は終わった。条目は簡潔で、刑名には基準がある。有司は新律を刊行して書とし、郡県に頒布した。"
 hd_dc_adv.0011.a: "今より後は、すべて新律に従え。"

 # ---------- 变法事件 ----------
 hd_dc_adv.0021.t: "詔して新法を施行する"
 hd_dc_adv.0021.desc: "変法の詔書が下されると、朝野は震撼した。[hd_dc_adv_reform_minister_scope.GetShortUIName]が命を奉じて新法を主宰し、田畝の測量と賦役の均等化の条令が次々と施行されていく。\n\n寒門の士子は手を打って喜んだが、世家大族は陰で結託している。5年のうちに成否がどうなるかは、まだ分からない。"
 hd_dc_adv.0021.desc_nominister: "変法の詔書が下されると、朝野は震撼した。しかし朝廷には新法を主宰できる天朝の大臣がおらず、天子自らが監督するほかない。田畝の測量と賦役の均等化の条令が次々と施行される一方、世家大族は陰で結託している。5年のうちに成否がどうなるかは、まだ分からない。"
 hd_dc_adv.0021.a: "朕の意はすでに決した。"
 hd_dc_adv.0021.a.tt: "5年後、新法の成否は自ずと明らかになる。現時点での見込みはおよそ #high [ROOT.Char.MakeScope.ScriptValue('hd_dc_kit_adv_reform_chance_value')|0]%#! である。"
 hd_dc_adv.0022.t: "世族の抵抗"
 hd_dc_adv.0022.desc: "田畝の測量は世家大族の根本を揺るがすものだった。各地の豪族は田産を隠し、測量を妨害し、世族党の者たちは朝廷で次々と上疏し、新法は民を乱すものだと非難している。"
 hd_dc_adv.0022.a: "断固として推し進め、新法を阻む者は厳罰に処す。"
 hd_dc_adv.0022.b: "少し寛容さを示し、徐々に効果を図る。"
 hd_dc_adv.0023.t: "寒門の新進"
 hd_dc_adv.0023.desc: "新法の施行から数年、各地で新法に精通した寒門出身の有能な官吏が数多く現れた。主宰する大臣は上奏し、新法を推進する人手を充実させるため、彼らを破格に抜擢するよう願い出た。"
 hd_dc_adv.0023.a: "破格に抜擢する。"
 hd_dc_adv.0023.b: "やはり資格と序列に従うべきだ。"
 hd_dc_adv.0023.c: "主宰の大臣を郡県に巡行させ、新法を督察させる。"
 hd_dc_adv.0024.t: "新法の成否"
 hd_dc_adv.0024.desc_success: "5年が過ぎ、新法はついに根を下ろした。田畝の測量は完了し、隠戸は次々と戸籍に登録され、府庫は日に日に満ちていく。世家大族は不満を漏らしているが、もはや形勢を覆す力はない。"
 hd_dc_adv.0024.desc_failure: "5年が過ぎたが、新法は結局施行しきれなかった。豪族は面従腹背し、地方の官吏は責任逃れに終始し、新法は名ばかりのものとなって、朝野には失望の声が満ちている。"
 hd_dc_adv.0024.a: "事ここに至っては是非もない。"
 hd_dc_adv.0024.a_success: "新法が成ったからには、よくこれを守れ。"
 hd_dc_adv_reform_chance_up_tt: "新法の見込みがいくらか高まった"
 hd_dc_adv_reform_chance_down_tt: "新法がまたいくらか難しくなった"

 # ---------- 文会雅集 ----------
 hd_dc_adv.0101.t: "曲水流觴"
 hd_dc_adv.0101.desc: "弁論の合間に、一同は後園へと移った。水を引いて渠とし、羽觴を流れに浮かべる。觴が誰かの前で止まれば、その者は即座に詩を賦さねばならない。\n\n杯はゆらゆらと巡り、ちょうどあなたの前で止まった。"
 hd_dc_adv.0101.a: "杯を挙げて飲み干し、筆を執ってたちまち詩を成す。"
 hd_dc_adv.0101.b: "佳句を[hd_dc_adv_guest.GetShortUIName]に譲る。"
 hd_dc_adv.0102.t: "玄理の清談"
 hd_dc_adv.0102.desc: "[hd_dc_adv_guest.GetShortUIName]は麈尾を手に語り、有無の弁から言意の分にまで説き及び、満座が耳を傾けている。話の矛先が転じると、一同の視線があなたに注がれた。"
 hd_dc_adv.0102.a: "儒を玄に引き入れ、名教をもって論破する。"
 hd_dc_adv.0102.b: "その説くところに従い、ともに有無を論じる。"
 hd_dc_adv.0103.t: "詩比べ"
 hd_dc_adv.0103.desc: "あなたが一首を吟じ終えるや、[hd_dc_adv_guest.GetShortUIName]は手を打って冷笑し、この詩は格調が卑弱で、他人の受け売りにすぎないと言い放った。席は一瞬にして静まり返った。"
 hd_dc_adv.0103.a: "言い返して嘲る。"
 hd_dc_adv.0103.b: "一笑に付す。"
 hd_dc_adv.0104.t: "壁に詩を題す"
 hd_dc_adv.0104.desc: "会館の白壁には先人の詩句がびっしりと題され、墨跡は新旧さまざまである。主人が筆と墨を捧げ持ち、諸氏に一筆残すよう請うた。"
 hd_dc_adv.0104.a: "筆を揮って壁に題す。"
 hd_dc_adv.0104.b: "先人の題詠をじっくり読む。"

 # ---------- 太学 ----------
 hd_dc_adv.0201.t: "太学生の仕官"
 hd_dc_adv.0201.desc: "太学の課試で[hd_dc_adv_student.GetShortUIName]は上位の成績を収め、その文名は都に広まった。博士たちは口々に推挙し、この者は大いに用いるに足ると言う。"
 hd_dc_adv.0201.a: "掾属として辟召する。"
 hd_dc_adv.0201.b: "天子に推挙する。"
 hd_dc_adv.0202.t: "太学の清議"
 hd_dc_adv.0202.desc: "太学の諸生が講堂に集まり、公卿を品評し、朝政を論じている。その言辞は激烈である。ある者が諸生の議論を書き写して帖とし、すでに城中に広まっている。"
 hd_dc_adv.0202.a: "清議は公論の在る所。その直言を容れよう。"
 hd_dc_adv.0202.b: "学生がみだりに朝政を論じるなど、禁絶すべきだ。"
