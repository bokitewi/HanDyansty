l_japanese:
 building_type_TK_HD_TaiXue: "国立大学"
 building_type_TK_HD_TaiXue_desc: "天子が建てた学宮。博士が経術をもって諸生を教授し、天下の士人は皆太学に入って学ぶことを誉れとする。"
 TK_HD_TaiXue: "太学"
 building_TK_HD_TaiXue: "$TK_HD_TaiXue$"
 building_TK_HD_TaiXue_desc: "天子が京師に建てた学宮。孝武皇帝の時に初めて五経博士を置いて弟子を教授させ、経に通じた者は郎吏に補された。以後、学舎はたびたび増築され、四方から書を背負って来る諸生がここに雲集した。太学生は経義を講論し、人物を品評し、清議の風はここから盛んになった。"
 hd_taixue_student_modifier: "太学受業"
 hd_taixue_student_modifier_desc: "このキャラクターの目上の者が太学を主宰しているため、博士や諸生とともに学ぶことができる。"
 hd_build_taixue_luoyang_decision: "太学を興す（洛陽）"
 hd_build_taixue_luoyang_decision_desc: "天下の治は教化に基づく。洛陽は天子の居所にして、四方の士子が仰ぎ見る地である。私は城東に地を選んで広く学舎を建て、経師を招き、博士弟子を置いて、書を背負って来る士子に身を寄せる所を与えたい。"
 hd_build_taixue_luoyang_decision_tooltip: "洛陽の東に太学を建て、経師を招聘し、広く諸生を受け入れる。"
 hd_build_taixue_changan_decision: "太学を興す（長安）"
 hd_build_taixue_changan_decision_desc: "長安は高帝が鼎を定めた地であり、孝武皇帝もここで初めて太学を立てたが、惜しいことにかつての弦誦の声はとうに聞かれなくなった。私はここに学舎を再び起こし、経師を招いて、関中の子弟も近くで学べるようにしたい。"
 hd_build_taixue_changan_decision_tooltip: "長安に太学を再建し、経師を招聘し、広く諸生を受け入れる。"
 hd_build_taixue_decision_confirm: "学を興し才を育てよ！"
