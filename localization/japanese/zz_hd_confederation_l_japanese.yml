l_japanese:
 HD_DEFENSIVE_LEAGUE_NAME:0 "防衛同盟"
 HD_ANTI_REGENT_LEAGUE_NAME:0 "反董卓連合"
 hd_league_member_modifier:0 "同盟諸侯"
 hd_league_member_modifier_desc:0 "このキャラクターは盟約に加わっており、諸侯と進退を共にする。"
 hd_league_leader_modifier:0 "牛耳を執る"
 hd_league_leader_modifier_desc:0 "このキャラクターは諸侯に推され、盟主の座に就いている。"
 hd_league_disorganized_modifier:0 "盟心離散"
 hd_league_disorganized_modifier_desc:0 "同盟の諸侯はそれぞれ異心を抱き、号令が行き届かない。"
 hd_offer_defensive_league_interaction:0 "防衛同盟の結成を提案"
 hd_offer_defensive_league_interaction_desc:0 "相手と盟好を結び、共に外敵を防ぐ。"
 hd_offer_defensive_league_interaction_notification:0 "[actor.GetTitledFirstName]が使者を遣わし、同盟を結んで共に外敵を防ごうと申し入れてきた。"
 hd_join_defensive_league_interaction:0 "防衛同盟に加入"
 hd_join_defensive_league_interaction_desc:0 "[recipient.GetTitledFirstName]が盟主を務める防衛同盟に身を投じる。"
 hd_demand_defensive_league_vote_interaction:0 "同盟投票での支持を要求"
 hd_demand_defensive_league_vote_interaction_desc:0 "弱みや盟好のよしみを頼りに、盟主選出の際にあなたを支持するよう相手に求める。"
 hd_call_defensive_league_to_war_interaction:0 "同盟を戦争に召集"
 hd_call_defensive_league_to_war_interaction_desc:0 "盟主の名において、同盟の諸侯にあなたに従って出征するよう命じる。"
 hd_leave_defensive_league_decision:0 "防衛同盟から脱退"
 hd_leave_defensive_league_decision_desc:0 "かつての盟約も、今や足かせでしかない。無理に同行するより、ここで別れてそれぞれ達者でいるほうがよい。"
 hd_leave_defensive_league_decision_tooltip:0 "所属している防衛同盟から脱退する"
 hd_unify_defensive_league_decision:0 "同盟を統一"
 hd_unify_defensive_league_decision_desc:0 "盟約を保って長年、諸家はとうに進退を共にしてきた。毎年会盟を重ねるより、一つの国に合わさり、号令を一つの門から出すほうがよい。"
 hd_unify_defensive_league_decision_tooltip:0 "同盟を一つに合わせ、あなたの首都がある州を取り、同盟の諸侯は皆あなたを主として奉じる"
 hd_confederation.0500.t:0 "合盟して国と為す"
 hd_confederation.0500.desc:0 "かつての会盟の文書はまだ残っているが、今日届けられたのは諸地を統合する新たな章程である。あなたの首都のある領域は次第に一つにつながり、同盟の諸家も互いに助け合う間柄から、一人の号令に共に従うところまで来た。\n\n新たに定められた名位と隷属を見ながら、あなたは悟る。これからはもう、何事も各家の盟誓に押し戻すことはできない。土地も兵も民の暮らしも一つに合わさった以上、負うべき責任もまたすべてあなたの肩にかかる。名号は今日にも得られるが、長く続く服従は、これからの統治によって保っていかねばならない。\n\n堂の下では、宣告を待つ人々がすでに揃っている。あなたは古い盟書を新たな文書の隣に置き、統合の件を読み上げるよう命じた。これより、もとの緩やかな約定は、確かな帰属を得たのである。"
 hd_confederation.0500.a:0 "合盟して国と為し、号令を一つに帰す。"
 hd_confederation_subjugation_victory_desc:0 "敗者は同盟に加わらなければならない。"
 hd_confederation_subjugation_white_peace_desc:0 "双方が兵を収め、相手は依然として同盟に加わらない。"
 hd_confederation_subjugation_defeat_desc:0 "討伐は失敗し、相手は同盟に加わる必要がない。"
 hd_anti_regent.0001.t:0 "盟主に推挙さる"
 hd_anti_regent.0001.desc:0 "皆があなたを盟主に推した。辞退の言葉は幾度となく繰り返され、あなたも一つひとつに応じた。だがようやく出兵の議になると、席上の声は先ほどほど揃わなくなった。\n\nこの家は糧が足りぬ、あの家は兵を残して国境を守らねばならぬ――先ほどまで自らの手で董卓の首を斬りたいとまで言っていた者たちが、急に皆、事情を抱え始めた。あなたは酒杯を手にしたまま彼らの話を聞き、顔には笑みを浮かべていた。諸侯を一つの席に着かせたのは賊を討つ義憤だが、これから彼らに一つの号令のもとで動いてもらえるかは、あなた次第なのだ。\n\nあなたが酒杯を置くと、席上はようやく次第に静まった。名分がすでに定まった以上、各人が自分の言葉を最後の一言と思い込むのを許してはならない。諸君、まずは盟主の手配を聞いてもらいたい。"
 hd_anti_regent.0001.a:0 "血を啜って盟を結び、共に董賊を討たん。"
 hd_anti_regent.0002.t:0 "盟書四方へ"
 hd_anti_regent.0002.desc:0 "盟書は封をされ、駅騎はそれぞれ別の道へと出発した。一通を送り出すたびに、あなたの前には写しが一部ずつ残り、空欄のままの返答欄は、まだ揃わぬ一列の旗印のようだった。\n\n諸侯にはそれぞれのためらいがある。まず隣国の動きを見たい者もいれば、旧来の隷属を気にかける者もいる。董卓が倒れた後に大権を握るのが別の誰かになるのを恐れる者もいる。すべての返書に同じ一字が書かれていると期待することはできないし、ましてや一つひとつのためらいのたびに挙兵の期日を先延ばしにするわけにはいかない。\n\n集結の期日はすでに定めた。今なすべきは、来る意志のある者を待ち、出発できる兵馬を整え、盟書に書かれた慷慨の言葉を、確かな行軍へと変えることだ。"
 hd_anti_regent.0002.a:0 "期日どおりに兵を会す。皆の応盟を待たず。"
 hd_anti_regent.0003.t:0 "討董の盟書"
 hd_anti_regent.0003.desc:0 "[scope:hd_anti_regent_inviter_scope.GetTitledFirstName]からの盟書が届いた。封には「共に董卓を討ち、漢室を匡扶せん」と書かれている。使者は各路の兵勢を述べ終えると口をつぐみ、あなたの答えを待った。\n\nあなたはすぐには筆を下ろさなかった。盟に応じるとは、ただ「董卓は誅すべし」と言うことではない。盟書に名を記せば、あなたはかつての統属から離れ、諸軍に従って西へ向かわねばならない。返書できっぱり断れば盟主は必ず恨みを抱き、董卓の側はかえってその情に恩を感じるだろう。曖昧に言い逃れるだけなら、しばらく局外に身を置くにすぎない。\n\n堂の下の者たちは皆、この返書が関東中に知れ渡ることを知っている。結局のところ、誰が兵馬を率いてその結果を引き受けるのか、決めるのはあなた自身だ。"
 hd_anti_regent.0003.a:0 "旧属を離れ、盟に入って董卓を討つ。"
 hd_anti_regent.0003.a.tt:0 "あなたはかつての統属から離れて一方に自立し、諸侯と共に董卓討伐の兵を挙げる。"
 hd_anti_regent.0003.b:0 "この盟は詔命を奉じておらぬ。従いかねる。"
 hd_anti_regent.0003.c:0 "境を閉ざして自ら守り、静かに成り行きを見る。"
 hd_anti_regent.0009.t:0 "渤海を整える"
 hd_anti_regent.0009.desc:0 "渤海であなたに会いに来た人々が門の外にひしめいている。先に部曲の数を報じる者は功績の話をしたがり、先に銭糧を送った者は名を残したがる。袁氏がどう兵を挙げるかについては、皆あなたが最後に口を開くのを待つつもりのようだ。\n\nあなたは書吏に一つひとつ記録させた。銭帛はいかほど、甲士はいかほど、さらにどの名士が従いたいと願っているか。雒陽を去るとき、董卓はおそらく、殿上で剣に手をかけるほどの者が一人減れば枕を高くして眠れると思っていただろう。今これらの人々があなたのもとに集まろうとしていることこそ、何よりの答えである。\n\n門の外からまた客の到来が告げられた。あなたは軍籍を左右に押しやり、衣を正して出迎えた。袁氏四世三公の声望は、今日まさにここで用いるべきだ――まず従おうとする者たちを受け止め、それから董卓に彼らの足音を聞かせてやるのだ。"
 hd_anti_regent.0009.a:0 "兵を収め糧を集め、渤海を基とする。"
 hd_anti_regent.0012.t:0 "諸軍会盟"
 hd_anti_regent.0012.desc:0 "集結の期日が来て、陣前には各家の旗が風にはためいた。あなたが盟軍の号令を引き継ぐと、報告に来る者はまず兵の数を、次に糧の数を告げ、最後にようやくまだ到着していない部隊のことを口にした。\n\n待つことにも限りがなければならない。董卓はなお朝廷を牛耳っており、盟書の討賊の言葉がいつまでも実行に移されなければ、まず自陣の中でその重みを失うことになる。あなたはすでに諸軍に出発を命じ、帳の外では隊列を整え輜重を急かす掛け声が響き始めた。\n\nそれぞれ異なる旗印を改めて眺め、あなたは悟る。皆の私心を代わりに消してやることはできないが、まずは同じ道のりを歩ませなければならない。今日より、会盟は戦争となった。"
 hd_anti_regent.0012.a:0 "号令は下った。諸軍、前へ。"
 hd_anti_regent.0004.t:0 "挙兵して董卓を討つ"
 hd_anti_regent.0004.desc:0 "出兵の号令はすでに伝えられた。輜重の車がゆっくりと陣門を通り過ぎ、甲冑をまとった兵士が道沿いに隊列を組む。先ほどまで帳中で議論されていた討董の戦いは、たちまち目の前の足音となった。\n\nあなたは各部の報告を聞き、糧道を問い、さらに前軍がどこで合流するかを尋ねた。口を揃えて君側の奸を除くと唱える者たちが、皆同じ危険を負う気でいるとは限らない。だが大軍がひとたび動き出した以上、もはや席上の慷慨だけで保つことはできない。\n\n董卓の兵馬は朝廷を守り、連合軍の旗は京師へ向けて展開していく。あなたは最後の軍報を閉じ、先行する部隊を追うよう命じた。盟誓が本物かどうかは、これからの交戦で明らかになるだろう。"
 hd_anti_regent.0004.a:0 "諸軍を整え、共に董卓へ向かう。"
 hd_yuan_bohai_armored_army:0 "渤海重歩兵"
 hd_anti_regent.0100.t:0 "連合軍、兵を収む"
 hd_anti_regent.0100.desc:0 "討董の戦いはすでに勝利を収め、河南の諸県はあなたの治下に入った。しかし関中へさらに兵を進めようという議論は次第に少なくなった。陣中を行き交う人々の話題は変わった。自家の糧はあと何日もつか、故地は安泰か、いつ兵を収められるか。\n\nあなたは次々と降ろされていく旗を見つめた。董卓はなお関中にいる。だが皆を一つに集めた盟誓は、もはや各家をあと数日引き留めることすらできない。別れの挨拶に忙しい者もいれば、挨拶も待たずに先に輜重を発たせる者もいる。\n\nこの勝利は土地を残し、またそれぞれ兵を擁する諸侯をも残した。あなたは古い盟書をしまいながら悟る。これからこの者たちと再び相見えるとき、同じ側に立っているとは限らないのだと。"
 hd_anti_regent.0100.b:0 "兵を収めて各々帰る。盟の事はここまで。"
 hd_anti_regent_punitive_victory_desc:0 "盟主は河南を獲得し、参戦した諸侯の声威は大いに高まる。連合軍はその後解散し、諸侯はそれぞれ兵を収める。"
 hd_anti_regent_punitive_white_peace_desc:0 "双方が兵を収め、連合軍は功なくして散る。"
 hd_anti_regent_punitive_defeat_desc:0 "権臣が連合軍を撃退し、守る側の諸将の声威は大いに高まる。連合軍はこれにより瓦解する。"
 HD_CONFEDERATION_SUBJUGATION_WAR_NAME:0 "同盟征服戦争"
 HD_ANTI_REGENT_PUNITIVE_WAR_NAME:0 "討伐"
