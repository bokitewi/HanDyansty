l_japanese:
 # ══════════════════════════════════════════════════════════════════
 # 汉晋春秋 · 兵制决议文本
 #
 # 范围：17 个「建立军制」决议 × 5 键 + 8 个「操练勋号兵」决议 × 4 键，另有共用提示 1 键
 #
 # 体例（2026-10-09 沉浸化重写）：
 #   · desc     —— 白话带古意，写此地何以出此兵、立制之意
 #   · tooltip  —— 一句概括所为之事；花费、条件、冷却由引擎显示，不在文案中复述
 #   · confirm  —— 短促决心语
 #   · effect   —— 立制后的非数值说明（兵源所出、随主头衔传承）
 # ══════════════════════════════════════════════════════════════════

 # ─────────────── 一、建立军制决议（17） ───────────────

 # 1. 幽州突骑
 hd_establish_youzhou_tuqi_decision:0 "幽州突騎の制を立てる"
 hd_establish_youzhou_tuqi_decision_desc:0 "幽州は北で烏桓・鮮卑と接し、涿郡・漁陽・上谷一帯の民は幼い頃から馬上で育ち、辺境の道を知り、突撃と馳駆に慣れている。かつて耿弇が光武帝に漁陽・上谷の突騎を発するよう勧めたことで河北は平定され、天下の精騎を論じれば、今なお幽州が筆頭に推される。\n\nただ辺郡の兵は昔から集散が定まらず、敵に臨んで慌ただしく徴発すれば、人も馬も揃わないことが多い。現地で軍籍を編成し、まぐさと穀物を蓄え、さらにあなたの名望によって辺地の豪傑を招けば、幽州突騎を常に備えておくことができる。"
 hd_establish_youzhou_tuqi_decision_tooltip:0 "幽州で突騎の軍籍を編成し、徴募に備える"
 hd_establish_youzhou_tuqi_decision_confirm:0 "突騎の籍を編め！"
 hd_establish_youzhou_tuqi_decision_effect:0 "これより幽州突騎をあなたの[men_at_arms|E]として募集できる。その兵は幽州から出るため、現地にあなたが自ら治める県がなお存在し、かつ民心が安定していなければ、募集・増強はできない。この制度はあなたの[primary_title|E]に付属し、それとともに継承される。"

 # 2. 白马义从
 hd_establish_baima_yicong_decision:0 "白馬義従の制を立てる"
 hd_establish_baima_yicong_decision_desc:0 "右北平は塞下にあり、山を隔てて烏桓・鮮卑と向かい合っている。郡の子弟は幼い頃から馬上で射猟し、連れ立って行動することを好み、白馬を目印として互いを義従と呼び合う。\n\n彼らが敬うのは自分たちを率いて功を立てさせてくれる豪傑であって、一枚の徴発の文書ではない。あなたが自ら出向き、己の名望をもってその頭領たちと誼を結び、さらに彼らのために軍籍を編成し、馬の飼料を十分に備えてこそ、白馬義従は召しに応じて直ちに駆けつけるようになる。"
 hd_establish_baima_yicong_decision_tooltip:0 "右北平の白馬義従のために軍籍を編成し、徴募に備える"
 hd_establish_baima_yicong_decision_confirm:0 "義従の籍を定めよ！"
 hd_establish_baima_yicong_decision_effect:0 "これより白馬義従をあなたの[men_at_arms|E]として募集できる。その兵は右北平から出るため、現地にあなたが自ら治める県がなお存在し、かつ民心が安定していなければ、募集・増強はできない。この制度はあなたの[primary_title|E]に付属し、それとともに継承される。"

 # 3. 乌桓骑从
 hd_establish_wuhuan_qicong_decision:0 "烏桓騎従の制を立てる"
 hd_establish_wuhuan_qicong_decision_desc:0 "烏桓はもとは東胡の末裔で、孝武皇帝の時から上谷・漁陽から遼東にかけての塞外に移り住み、水と草を追って暮らし、男子は幼い頃から馬を乗りこなし弓を射ることに長けている。漢が北方に兵を用いる際には、しばしばその部衆を騎従として募り、偵察・攪乱・追撃のいずれにおいても力を発揮した。\n\n烏桓の諸部にはそれぞれ大人がおり、昔から自分たちが信服する者にしか従わない。あなたが使者を遣わして諸部の大人と厚く誼を結び、徴発の約を定め、さらに軍中で彼らのために糧秣を備えておけば、烏桓騎従はいつでも塞を出て従うようになる。"
 hd_establish_wuhuan_qicong_decision_tooltip:0 "烏桓の諸部と徴発の約を定め、騎従の徴募に備える"
 hd_establish_wuhuan_qicong_decision_confirm:0 "烏桓と約を定めよ！"
 hd_establish_wuhuan_qicong_decision_effect:0 "これより烏桓騎従をあなたの[men_at_arms|E]として募集できる。その兵は上谷から遼東にかけての烏桓の故地から出るため、現地にあなたが自ら治める県がなお存在し、かつ民心が安定していなければ、募集・増強はできない。この制度はあなたの[primary_title|E]に付属し、それとともに継承される。"

 # 4. 冀州强弩
 hd_establish_jizhou_qiangnu_decision:0 "冀州強弩の制を立てる"
 hd_establish_jizhou_qiangnu_decision_desc:0 "冀州は土地が広く民が豊かで、郡国には材官が多く、大黄や蹶張といった強弩の扱いに長けている。こうした弩は、膂力が人並み外れ、長年修練を積んだ者でなければ引くことができない。一列の弩手が交互に一斉射撃すれば、突撃してくる甲騎を食い止めるに十分である。かつて虞詡が武都を守った際、まず小弩で弱みを見せて羌人を近くまで誘い寄せ、それから強弩で一斉に射ると、当たった者はみな倒れた――弩の長所は、ひとえに号令にある。\n\n冀州で弩手の軍籍を編成し、弩機と矢じりを揃え、さらにあなたの名望によって現地の射に長けた古参兵を招いて後進を教えさせれば、冀州強弩は代々受け継がれていく。"
 hd_establish_jizhou_qiangnu_decision_tooltip:0 "冀州の弩手のために軍籍を編成し、徴募に備える"
 hd_establish_jizhou_qiangnu_decision_confirm:0 "強弩の籍を定めよ！"
 hd_establish_jizhou_qiangnu_decision_effect:0 "これより冀州強弩をあなたの[men_at_arms|E]として募集できる。その兵は冀州から出るため、現地にあなたが自ら治める県がなお存在し、かつ民心が安定していなければ、募集・増強はできない。この制度はあなたの[primary_title|E]に付属し、それとともに継承される。"

 # 5. 先登锐士
 hd_establish_xiandeng_ruishi_decision:0 "先登鋭士の制を立てる"
 hd_establish_xiandeng_ruishi_decision_desc:0 "城攻めのたびに、腕を振り上げて先登を願い出る者は必ずいる。だが矢石が降り注ぐとき、本当に彼に続いて城壁をよじ登れる者は、たいていごくわずかである。冀州は民風が勇猛で、郷里の任侠は昔から死を恐れぬことを尊ぶ。まさに先登を選び募るべき地である。\n\nその中から戦いを恐れぬ士を選び出し、籍に従って伍に編み、同じ伍の者が互いに顔を知り、生死を託し合うようにすれば、進退にも頼るところができる。あなたが己の名望をもってこの制度を保証すれば、以後懸賞を掲げて募集するとき、冀州の鋭士は噂を聞いて自ずと集まってくるだろう。"
 hd_establish_xiandeng_ruishi_decision_tooltip:0 "冀州に先登鋭士の制を立て、徴募に備える"
 hd_establish_xiandeng_ruishi_decision_confirm:0 "先登の制を立てよ！"
 hd_establish_xiandeng_ruishi_decision_effect:0 "これより先登鋭士をあなたの[men_at_arms|E]として募集できる。その兵は冀州から出るため、現地にあなたが自ら治める県がなお存在し、かつ民心が安定していなければ、募集・増強はできない。この制度はあなたの[primary_title|E]に付属し、それとともに継承される。"

 # 6. 青州兵
 hd_establish_qingzhou_bing_decision:0 "青州兵の制を立てる"
 hd_establish_qingzhou_bing_decision_desc:0 "青州は海を背負う斉国の故地で、田は狭く人は多く、凶作の年に遭うたびに流民が多く出る。郷里の若者は勇を好み争いを好んで、世が乱れれば砦を結んで互いに守り合い、号令はまちまちながら、闘志は他州に引けを取らない。\n\nこうした者たちは、散れば盗賊となり、集まれば兵となる。その壮丁を収めて隊伍を編成し、誰の号令に従い、どこから糧を受け取るのかを彼らにわからせることができれば、青州の衆は使える歩兵となる。ただし彼らを喜んで応募させるには、衆を服させるに足る威望をあなたが示さねばならない。"
 hd_establish_qingzhou_bing_decision_tooltip:0 "青州の壮丁を軍籍に編入し、徴募に備える"
 hd_establish_qingzhou_bing_decision_confirm:0 "青州兵の籍を定めよ！"
 hd_establish_qingzhou_bing_decision_effect:0 "以後、青州兵をあなたの[men_at_arms|E]として募集できる。その兵は青州の出身であり、当地にあなたが直接治める県が残り、かつ民心が安定している場合にのみ募集・増強できる。この制度はあなたの[primary_title|E]に付随し、それとともに継承される。"

 # 7. 六郡良家子
 hd_establish_liujun_liangjiazi_decision:0 "六郡良家子の制を立てる"
 hd_establish_liujun_liangjiazi_decision_desc:0 "六郡は羌胡に近く、どの家も戦に慣れ、子弟は幼い頃から騎射を生業とする。朝廷が羽林・期門の宿衛を選ぶ際には、多く六郡の良家子を取った。趙充国もかつてこの身分で羽林に補され、のちに西羌を震え上がらせたのである。\n\n良家の子弟は出自が清らかで、市井の無頼と同列に並ぶことを潔しとせず、召すには相応の体面が要る。あなた自ら出向いて招き、彼らを軍籍に編入し、鞍馬弓矢を揃えてやれば、六郡の子弟は勇んで従軍するであろう。"
 hd_establish_liujun_liangjiazi_decision_tooltip:0 "六郡の良家子を軍籍に編入し、徴募に備える"
 hd_establish_liujun_liangjiazi_decision_confirm:0 "良家の籍を定めよ！"
 hd_establish_liujun_liangjiazi_decision_effect:0 "以後、六郡良家子をあなたの[men_at_arms|E]として募集できる。その兵は六郡の出身であり、当地にあなたが直接治める県が残り、かつ民心が安定している場合にのみ募集・増強できる。この制度はあなたの[primary_title|E]に付随し、それとともに継承される。"

 # 8. 湟中义从
 hd_establish_huangzhong_yicong_decision:0 "湟中義従の制を立てる"
 hd_establish_huangzhong_yicong_decision_desc:0 "湟中は河湟の間にあり、月氏の遺種と諸羌が雑居している。そのうち漢に帰順し、代々軍に従って戦ってきた胡騎は義従と呼ばれる。彼らは河湟の水草をことごとく知り尽くし、どこで馬に水を飲ませられるか、どこなら一隊の人馬が旋回できるかを、地図よりも詳しく心得ている。\n\n義従の胡人は約束を重んじ、面目も重んじる。あなたが使者を遣わして諸部の渠帥と約を結び、恩賞を約束し、さらに自らの名望をもって保証すれば、湟中義従はあなたの旗の下で出征するであろう。"
 hd_establish_huangzhong_yicong_decision_tooltip:0 "湟中の義従胡と従軍の約を結び、徴募に備える"
 hd_establish_huangzhong_yicong_decision_confirm:0 "義従と約を結べ！"
 hd_establish_huangzhong_yicong_decision_effect:0 "以後、湟中義従をあなたの[men_at_arms|E]として募集できる。その兵は湟中の出身であり、当地にあなたが直接治める県が残り、かつ民心が安定している場合にのみ募集・増強できる。この制度はあなたの[primary_title|E]に付随し、それとともに継承される。"

 # 9. 板楯賨兵
 hd_establish_bandun_congbing_decision:0 "板楯賨兵の制を立てる"
 hd_establish_bandun_congbing_decision_desc:0 "巴郡の山中に住む板楯蛮は、木の板を楯とし、代々勇健をもって知られる。彼らは漢に賨銭を納めて賦役に代えるため、賨人とも呼ばれる。朝廷は羌の乱が起こるたびに多くその兵を徴発し、彼らは険阻の地を平地のごとく出入りした。\n\n板楯蛮は旧恩を忘れぬが、旧怨も忘れない。朝廷の待遇が薄ければ、彼らは立ち上がって乱を起こす。あなたが手厚く慰撫し、さらに名望をもってその渠帥と誼を結べば、その子弟を賨兵に編成し、いつでも徴発できるであろう。"
 hd_establish_bandun_congbing_decision_tooltip:0 "巴の地の板楯蛮を軍籍に編入し、徴募に備える"
 hd_establish_bandun_congbing_decision_confirm:0 "賨兵の籍を定めよ！"
 hd_establish_bandun_congbing_decision_effect:0 "以後、板楯賨兵をあなたの[men_at_arms|E]として募集できる。その兵は巴の地の出身であり、当地にあなたが直接治める県が残り、かつ民心が安定している場合にのみ募集・増強できる。この制度はあなたの[primary_title|E]に付随し、それとともに継承される。"

 # 10. 无当飞军
 hd_establish_wudang_feijun_decision:0 "無当飛軍の制を立てる"
 hd_establish_wudang_feijun_decision_desc:0 "南中は益州のはるか南にあり、山は高く谷は深く、瘴気の霧が年中晴れない。中原の大軍がここへ来ても、陣を布くことすらままならぬことが多い。しかし土地の夷人は羊腸の小道に慣れ、弩を背負って崖をよじ登り、飛ぶように往来する。\n\n南中でその中の精兵を選んで募り、部伍を編成し、糧食と武具を与えれば、あなたは山間を縦横に駆け回る兵を手にし、険阻に出会うたびに山を仰いで嘆く必要はなくなる。ただし南中の諸部は昔から強者にしか従わず、彼らを心服させるにはあなたに十分な威名がなければならない。"
 hd_establish_wudang_feijun_decision_tooltip:0 "南中に無当飛軍の制を立て、徴募に備える"
 hd_establish_wudang_feijun_decision_confirm:0 "飛軍の制を立てよ！"
 hd_establish_wudang_feijun_decision_effect:0 "以後、無当飛軍をあなたの[men_at_arms|E]として募集できる。その兵は南中の出身であり、当地にあなたが直接治める県が残り、かつ民心が安定している場合にのみ募集・増強できる。この制度はあなたの[primary_title|E]に付随し、それとともに継承される。"

 # 11. 五溪蛮兵
 hd_establish_wuxi_manbing_decision:0 "五渓蛮兵の制を立てる"
 hd_establish_wuxi_manbing_decision_desc:0 "武陵郡では、五筋の渓流が群山の間を縫って流れ、山道は渓流に沿って曲がりくねり、山一つ隔てれば向こうの太鼓の音も聞こえない。かつて伏波将軍馬援が五渓に南征した際、大軍は渓谷に閉じ込められ、彼自身も陣中で病没した。\n\n渓谷の間で諸蛮と敵対するよりも、その部衆を収めて己の用に供する方がよい。あなたが使者を遣わして諸部と約を結び、威名をもって鎮め、恩賞をもって慰撫し、その子弟を軍籍に編入すれば、五渓蛮兵はあなたのために道を拓き先導するであろう。"
 hd_establish_wuxi_manbing_decision_tooltip:0 "五渓の諸部と徴発の約を結び、蛮兵の徴募に備える"
 hd_establish_wuxi_manbing_decision_confirm:0 "五渓と約を結べ！"
 hd_establish_wuxi_manbing_decision_effect:0 "以後、五渓蛮兵をあなたの[men_at_arms|E]として募集できる。その兵は武陵五渓の出身であり、当地にあなたが直接治める県が残り、かつ民心が安定している場合にのみ募集・増強できる。この制度はあなたの[primary_title|E]に付随し、それとともに継承される。"

 # 12. 山越甲士
 hd_establish_shanyue_jiashi_decision:0 "山越甲士の制を立てる"
 hd_establish_shanyue_jiashi_decision_desc:0 "江東の丹陽・会稽・豫章の諸郡には、山嶺が数百里にわたって連なり、山中の宗部は一族で集住して、徭役に服さず租賦も納めない。官軍が討伐に来れば深山に退いて険に拠って守り、官軍が去ればまた山から出てくる。\n\n山越の中には、強壮で戦いを恐れぬ者が多い。その衆を招降して軍籍に編入し、甲を着せ兵器を執らせれば、林嶺での格闘に慣れた精鋭となる。ただし降った者たちの心は一朝一夕には収まらず、あなたが恩威を併せ用い、名望をもってその宗帥を威服させねばならない。"
 hd_establish_shanyue_jiashi_decision_tooltip:0 "山越の降衆を軍籍に編入し、徴募に備える"
 hd_establish_shanyue_jiashi_decision_confirm:0 "山越の籍を定めよ！"
 hd_establish_shanyue_jiashi_decision_effect:0 "以後、山越甲士をあなたの[men_at_arms|E]として募集できる。その兵は江東の山越諸郡の出身であり、当地にあなたが直接治める県が残り、かつ民心が安定している場合にのみ募集・増強できる。この制度はあなたの[primary_title|E]に付随し、それとともに継承される。"

 # 13. 丹阳精兵
 hd_establish_danyang_jingbing_decision:0 "丹陽精兵の制を立てる"
 hd_establish_danyang_jingbing_decision_desc:0 "丹陽郡は呉越の間にあり、山が多く田は少ない。民は山に登って銅を採り、林に入って狩りをするため、誰もが筋骨たくましい。郷里の若者は命を軽んじ義を重んじ、平時は一言気に入らなければすぐ刀を抜くが、戦場では誰よりも命を懸けて戦う。\n\nただ、丹陽兵の名がいかに高くとも、名声そのものが一つの営塁を守ってくれるわけではない。当地に募兵の制を立てて軍籍を定め、常の給与を支給し、さらにあなたの名望で郷里の豪傑を招いて統率させれば、今後歩兵が必要になったとき、その場しのぎに方々へ頼み回る必要はなくなる。"
 hd_establish_danyang_jingbing_decision_tooltip:0 "丹陽に募兵の制を立て、徴発に備える"
 hd_establish_danyang_jingbing_decision_confirm:0 "丹陽の募兵制を立てよ！"
 hd_establish_danyang_jingbing_decision_effect:0 "以後、丹陽精兵をあなたの[men_at_arms|E]として募集できる。その兵は丹陽の出身であり、当地にあなたが直接治める県が残り、かつ民心が安定している場合にのみ募集・増強できる。この制度はあなたの[primary_title|E]に付随し、それとともに継承される。"

 # 14. 涪陵连弩士
 hd_establish_fuling_liannushi_decision:0 "涪陵連弩士の制を立てる"
 hd_establish_fuling_liannushi_decision_desc:0 "涪陵は巴郡の東南にあり、江水が群山の間を流れ、両岸の多くは断崖の小道である。山の民は代々林間で弩を張って狩りをしており、弩機は彼らの手の中で、農夫の手の鍬のように馴染んでいる。\n\nただし弩機は精巧で熟練者の手入れが要り、矢じりの消耗は激しく、職人が絶えず作り続けねばならない。あなたの名望で涪陵の弓弩に長けた山の民を集めて軍籍に編入し、さらに弩機と矢じりの供給元を整えてこそ、この連弩士はいつでも用いることができる。"
 hd_establish_fuling_liannushi_decision_tooltip:0 "涪陵に連弩士の制を立て、徴募に備える"
 hd_establish_fuling_liannushi_decision_confirm:0 "連弩の制を立てよ！"
 hd_establish_fuling_liannushi_decision_effect:0 "以後、涪陵連弩士をあなたの[men_at_arms|E]として募集できる。その兵は涪陵の出身であり、当地にあなたが直接治める県が残り、かつ民心が安定している場合にのみ募集・増強できる。この制度はあなたの[primary_title|E]に付随し、それとともに継承される。"

 # 15. 羌骑
 hd_establish_qiang_qi_decision:0 "羌騎の制を立てる"
 hd_establish_qiang_qi_decision_desc:0 "金城・隴西の山谷の間では、諸羌の種落がそれぞれ一方に拠り、水草を追って遊牧し、男子は皆騎乗に長けている。彼らが来るときは土煙が舞い上がり、退くときは遠くの山谷へ散ってゆく。後ろから追う歩兵は、彼らがどこへ去ったかさえ分からないことが多い。\n\n諸羌の種落と従軍の約を結び、恩賞を約束して、その騎士を籍に編入すれば、あなたは敵と速さを競える騎兵を手にする。羌人は武勇を敬い、信義も重んじる。この件はあなたの名望を保証としなければならない。"
 hd_establish_qiang_qi_decision_tooltip:0 "隴右の諸羌と従軍の約を結び、羌騎の徴募に備える"
 hd_establish_qiang_qi_decision_confirm:0 "諸羌と約を結べ！"
 hd_establish_qiang_qi_decision_effect:0 "以後、羌騎をあなたの[men_at_arms|E]として募集できる。その兵は金城・隴西の羌中の出身であり、当地にあなたが直接治める県が残り、かつ民心が安定している場合にのみ募集・増強できる。この制度はあなたの[primary_title|E]に付随し、それとともに継承される。"

 # 16. 并州边骑
 hd_establish_bingzhou_bianqi_decision:0 "并州辺騎の制を立てる"
 hd_establish_bingzhou_bianqi_decision_desc:0 "雁門・雲中・朔方の諸郡はいずれも并州の最北にあり、烽燧が互いに望み合い、胡騎がしばしば塞を侵す。辺郡の子弟は幼い頃から烽火の警報を聞き慣れ、馬に乗るのは歩くのと同じで、いつ馬を急かして疾駆し、いつ手綱を抑えて力を蓄えるべきかを心得ている。\n\n辺騎を常設の制度に組み込めば、大軍の行軍の際、何事も歩兵隊の到着を待たねば情報が入らない、ということはなくなる。徴募・糧秣・軍籍はいずれも誰かが長く管理せねばならず、一時の重賞で兵を集めるだけでは足りない。あなたの名望で辺郡の豪傑を招き、さらに銭糧を割いて規制を立ててこそ、并州辺騎は常にあなたの用に供されるであろう。"
 hd_establish_bingzhou_bianqi_decision_tooltip:0 "并州辺郡の騎士を軍籍に編入し、徴募に備える"
 hd_establish_bingzhou_bianqi_decision_confirm:0 "辺騎の籍を編め！"
 hd_establish_bingzhou_bianqi_decision_effect:0 "以後、并州辺騎をあなたの[men_at_arms|E]として募集できる。その兵は并州辺郡の出身であり、当地にあなたが直接治める県が残り、かつ民心が安定している場合にのみ募集・増強できる。この制度はあなたの[primary_title|E]に付随し、それとともに継承される。"

 # 17. 藤甲兵
 hd_establish_tengjia_decision:0 "藤甲兵の制を立てる"
 hd_establish_tengjia_decision_desc:0 "永昌は南中の西のはずれ、もとは哀牢夷の故地である。山中には古い藤が多く、夷人はそれを取って甲冑に編む。それを着て密林の中を進退すれば、鉄甲を纏った中原の兵卒よりはるかに身軽である。\n\nただし一領の奇抜な甲が刀槍を通さぬわけではない。肝要なのは、甲を着た後も部伍が号令に従って進退できることである。永昌で土地の夷人を選んで募り、軍籍に編入し、藤甲を揃え、さらにあなたの名望で諸部の首領と誼を結んでこそ、藤甲兵はあなたの用に供されるであろう。"
 hd_establish_tengjia_decision_tooltip:0 "永昌に藤甲兵の制を立て、徴募に備える"
 hd_establish_tengjia_decision_confirm:0 "藤甲の制を立てよ！"
 hd_establish_tengjia_decision_effect:0 "以後、藤甲兵をあなたの[men_at_arms|E]として募集できる。その兵は永昌の出身であり、当地にあなたが直接治める県が残り、かつ民心が安定している場合にのみ募集・増強できる。この制度はあなたの[primary_title|E]に付随し、それとともに継承される。"

 # 操练勋号兵决议共用：决议效果提示（投入与花费在随后的选练事件中择定）
 hd_train_elite_decision_effect:0 "あなたは選練を担う将を呼び寄せ、どれほど投じるかを相談する。必要な銭糧と威信は、その時に支払う。"

 # ─────────────── 二、操练勋号兵决议（8） ───────────────

 # 1. 陷阵营
 hd_train_xianzhenying_decision:0 "陥陣営を練る"
 hd_train_xianzhenying_decision_desc:0 "軍中に腕を振り上げて出陣を請う者に事欠くことはない。欠けているのは、敵陣に突入した後もなお背後の号令を聞き分けられる者である。重甲・堅盾・利刃は金で揃えられるが、一営の衆を刃の前で一糸乱れず進退させるには、治軍に精通した将が日夜鍛え上げるほかない。\n\nこのような精兵は一人ずつ選び、手ずから鍛え上げるほかなく、高札を立てて募集すれば揃うものではない。ひとたび解散すれば、一から鍛え直すしかない。陣を破る鋭鋒を組織するつもりなら、まずそのための銭糧を用意すべきである。"
 hd_train_xianzhenying_decision_tooltip:0 "麾下の有能な将を選び、陥陣営を選練する"
 hd_train_xianzhenying_decision_confirm:0 "陥陣の士を選練せよ！"

 # 2. 虎豹骑
 hd_train_hubaoqi_decision:0 "虎豹騎を練る"
 hd_train_hubaoqi_decision_desc:0 "敗兵を追撃するのと、敵陣に向かって馬を駆り突入するのとは別のことである。あなたは騎兵の中から最も勇猛な者を抜擢して別に一軍を編み、人馬ともに重甲を纏わせ、決戦の時に一気に陣を破らせたいと考えている。\n\n人馬と甲冑武具は数だけを求めてはならず、それを率いるのは勇敢で兵法を知り、陣に臨んで決して怯まぬ驍将でなければならない。このような精騎は人を選んで鍛えるほかなく、高札を立てて増やすことはできない。ひとたび散じれば、鍛え直さねばならない。"
 hd_train_hubaoqi_decision_tooltip:0 "麾下の驍将を選び、虎豹騎を選練する"
 hd_train_hubaoqi_decision_confirm:0 "虎豹の騎を選練せよ！"

 # 3. 白毦
 hd_train_baier_decision:0 "白毦を練る"
 hd_train_baier_decision_desc:0 "誰もが旗の下に立って褒賞を受けたがるが、敵が迫ってもなおその場を退かぬ者こそ、真に役に立つ者である。あなたには甲を纏った親衛が必要だ。陣脚を固めることができ、険しい道でも仲間を守れる者たちが。\n\nこの件は勇敢かつ堅忍で守りに長けた将に任せ、軍中から人を選んで鍛えさせねばならない。親兵は精鋭であることを貴び数を貴ばず、一人ずつ選ぶほかなく、高札を立てて募集することはできない。ひとたび解散すれば、一から鍛え直さねばならない。"
 hd_train_baier_decision_tooltip:0 "麾下の忠勇の将を選び、白毦の親兵を選練する"
 hd_train_baier_decision_confirm:0 "白毦の親兵を選練せよ！"

 # 4. 解烦兵
 hd_train_jiefanbing_decision:0 "解煩兵を練る"
 hd_train_jiefanbing_decision_desc:0 "急報が届いてから兵を集めていては、隊伍が揃わぬうちに前線の情勢はとうに変わっているものだ。あなたは危急の際に四方へ駆けつけることを専らとし、林や沼沢の間でも自在に転戦できる解煩兵を鍛えたいと考えている。\n\nこの軍を率いるのは臨機応変で采配に長けた将でなければならず、銭糧も別に用意せねばならない。このような兵は専門に鍛えるほかなく、通常の募兵で増やすことはできない。散じた後も、また日を改めて鍛え直さねばならない。"
 hd_train_jiefanbing_decision_tooltip:0 "麾下の有能な将を選び、解煩兵を選練する"
 hd_train_jiefanbing_decision_confirm:0 "解煩の兵を選練せよ！"

 # 5. 麴义先登
 hd_train_quyi_xiandeng_decision:0 "麴義の先登を練る"
 hd_train_quyi_xiandeng_decision_desc:0 "敵の騎兵が来るや弩手がまず乱れれば、どれほど強い弩も泥に矢を射込むだけである。あなたは麴義の先登の法に倣い、騎兵を迎えて陣を布き、号令を待って初めて矢を放つ部隊を選練したいと考えている。前列は盾の下に伏し、後列は強弩で続くのだ。\n\nこの件は戦を恐れず、平原の陣戦にも通じた将に主宰させねばならず、選募と軍械の費用も別に用意せねばならない。このような部隊は軍号を一つ掲げれば常に募れるものではない。ひとたび解散すれば、一から鍛え直すしかない。"
 hd_train_quyi_xiandeng_decision_tooltip:0 "麾下の有能な将を選び、麴義の法に依って先登を選練する"
 hd_train_quyi_xiandeng_decision_confirm:0 "先登の士を選練せよ！"

 # 6. 宿卫虎士
 hd_train_suwei_hushi_decision:0 "宿衛虎士を練る"
 hd_train_suwei_hushi_decision_desc:0 "門前の衛士は挙措が整っているが、本当に刺客が押し入ってきてから、彼らがどれほど持ちこたえられるかを知るのでは遅い。宿衛の士は並外れて勇健でなければならず、さらに忠誠心において信頼できねばならない。見た目の魁偉さだけで人を選ぶわけにはいかない。\n\nこの件は勇力人に過ぎ、あなたに忠誠を尽くす猛士にのみ任せることができ、彼自ら選び、鍛えさせる。このような衛士は高札を立てて募集することはできない。ひとたび解散すれば、改めて選び、一から鍛え直さねばならない。"
 hd_train_suwei_hushi_decision_tooltip:0 "麾下の忠勇の士を選び、宿衛虎士を選練する"
 hd_train_suwei_hushi_decision_confirm:0 "宿衛虎士を選練せよ！"

 # 7. 南蛮象兵
 hd_train_nanman_xiangbing_decision:0 "南蛮象兵を練る"
 hd_train_nanman_xiangbing_decision_desc:0 "戦象の姿は敵陣を騒然とさせるに足る。だが本当に案ずべきは、驚いた象がどちらへ突進するかである。熟練した象使いと事情に通じた将がいなければ、巨象がいかに雄壮でも、敵に向かって突進するとは限らない。\n\n南中の徼外の諸部は象を馴らして兵とする。あなたの版図が南中に及んでいれば、そこから象の群れと象使いを求めることができる。この軍を率いるのは山地に通じ、采配に長けた将でなければならない。このような奇兵は通常の例に従って募集・増強することができず、ひとたび解散すれば、一から鍛え直すしかない。"
 hd_train_nanman_xiangbing_decision_tooltip:0 "麾下の有能な将を選び、象を馴らし兵を選んで南蛮象兵を練り上げる"
 hd_train_nanman_xiangbing_decision_confirm:0 "象を馴らし兵を練れ！"

 # 8. 白衣兵
 hd_train_baiyibing_decision:0 "白衣兵を練る"
 hd_train_baiyibing_decision_desc:0 "敵が旗印を望み見て初めて大軍の到来を知る――そうなる前に、誰かが先んじて近くまで忍び寄り、道筋と退路を探っておけば、両軍が交戦する際にいちいち後手に回ることはない。あなたは林や嶺の間で追跡・截撃・掩護を専らとする白衣兵を鍛えたいと考えている。\n\nこの軍を率いるのは機略に富み、奇襲に慣れた将でなければならない。求めるのは威勢の大きな軍勢ではなく、間に合うように来て、きれいに退ける一隊である。このような兵は専門に選んで鍛えるほかなく、通常の募兵で増やすことはできない。ひとたび散じれば、一から鍛え直さねばならない。"
 hd_train_baiyibing_decision_tooltip:0 "麾下の有能な将を選び、白衣兵を選練する"
 hd_train_baiyibing_decision_confirm:0 "白衣の兵を選練せよ！"
