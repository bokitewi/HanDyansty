 # ══════════════════════════════════════════════════════════════════
 # 汉晋春秋 · 兵戈志 —— 禁军事件与修正 本地化（hjbz_）
 #
 # 内容：事件 4×3（题/述/选项）＋ 修正 4×2（名/述）＋ 旅行选项 1×2
 # 文风：参《后汉书》
 # ══════════════════════════════════════════════════════════════════

 # ────────────────── 事件一 · 重建羽林军 ──────────────────

 hjbz_guard.0001.t:0 "羽林軍の再建"
 hjbz_guard.0001.desc:0 "羽林の制すでに復し、すなわち良家の子のうち材力人に過ぐる者を選びてこれに充つ。この日、甲を宮門の外に陳ね、旌旗は相連なり、鼓鐸は鳴り響いた。\n\n主将は諸校を率いて北面して再拝し、校尉以下みな剣を解いて頓首し、死をもって宮禁を衛ることを誓った。有司が冊を読み上げて軍号を賜うと、その声は闕にまで達した。帝は臨んでこれを観、その行列の整い、甲仗の鮮やかなるを見て、左右を顧みて言った。「これぞ朕の羽翼である」"
 hjbz_guard.0001.a:0 "この一軍あらば、朕は安んじて眠れよう。"

 # ────────────────── 事件二 · 重建执金吾 ──────────────────

 hjbz_guard.0002.t:0 "執金吾の再建"
 hjbz_guard.0002.desc:0 "執金吾すでに復し、旧を廃して新に易う。初め、官舎は傾き崩れ、卒徒は散り失せ、街路では盗賊が白昼に横行し、道行く者は互いに戒め合って夜は出歩こうとしなかった。\n\nここに至り、緹騎が巡行し、戟を持つ者が道に列なり、月に三たび宮城を巡る。夜に火の急報あれば時を移さず駆けつけ、滞ることがない。住民は数か月にしてようやく夜道を歩けるようになった。有司は上奏した。「都城の内、桴鼓鳴らず」"
 hjbz_guard.0002.a:0 "輦轂の下は、かくあるべし。"

 # ────────────────── 事件三 · 瘫痪的羽林军 ──────────────────

 hjbz_guard.0003.t:0 "麻痺した羽林軍"
 hjbz_guard.0003.desc:0 "帝はその権柄を失い、詔令は宮中から出ない。羽林の諸営は、あるいは他者の檄を受け、あるいは塁を閉ざして自守し、もはや命に応じない。\n\n宿衛の臣は次々と去り、甲仗は廊下に打ち捨てられた。かつて北面して死を誓った者たちは、今やみな四方に散った。殿門の外には老兵が数人残るのみで、戟を執って立ち、帝を見ては涙を流す。"
 hjbz_guard.0003.a:0 "羽翼すでに折れたり。朕は何を恃めばよいのか？"

 # ────────────────── 事件四 · 崩溃的执金吾 ──────────────────

 hjbz_guard.0004.t:0 "崩壊した執金吾"
 hjbz_guard.0004.desc:0 "執金吾の職がすでに廃され、緹騎や戟を持つ者たちは統べる者を失った。狡猾な者は権門に身を投じ、爪牙となって同輩を凌ぎ、愚直な者は街路に流れ落ちて盗賊と結び、かえって民の害となった。\n\n宮外の警備はもはや誰も司らず、火が起きても救いに来る者はいない。かつて建てられた官舎は、今や博徒や酒飲みの溜まり場となっている。心ある者はそこを通るたびに、嘆息せずにはいられない。"
 hjbz_guard.0004.a:0 "宮外のこと、ついにここまで至ったか。"

 # ────────────────── 角色修正 ──────────────────

 hjbz_yulin_rebuilder_modifier:0 "羽林軍の再建者"
 hjbz_yulin_rebuilder_modifier_desc:0 "この人物は羽林の旧制を復し、良家の子を選んで宿衛に充てたため、宮禁の守りはこれによって厳重になった。軍中でその名を聞く者の多くは、その下で働くことを望む。一方、謀を遂げんとする奸人も、まず自らの力を量らねばならない。"

 hjbz_yulin_guard_modifier:0 "羽林軍"
 hjbz_yulin_guard_modifier_desc:0 "羽林の軍が常にこの人物の左右にある。甲仗はすでに備わり、宿衛には人がいるため、その行動の間にも、敵はつけ入る隙をうかがうことができない。"

 # ────────────────── 伯爵领修正 ──────────────────

 hjbz_zhijinwu_renewed_modifier:0 "面目を一新した執金吾"
 hjbz_zhijinwu_renewed_modifier_desc:0 "執金吾すでに復し、緹騎は巡行し、戟を持つ者が道に列なり、月に三たび宮城を巡る。桴鼓は鳴らず、道行く者は夜に出ても憂いなく、市井は次第に往時の姿を取り戻しつつある。"

 hjbz_zhijinwu_collapsed_modifier:0 "崩壊した執金吾"
 hjbz_zhijinwu_collapsed_modifier_desc:0 "執金吾は廃され、その職を司る者がいない。緹騎や戟を持つ者たちは四方に散り、狡猾な者は権門の爪牙となり、愚直な者は盗賊と結び、里巷では白昼であっても掠奪を免れない。"

 # ────────────────── 旅行选项 ──────────────────

 hjbz_yulin_escort_travel_option:0 "羽林軍の護衛"
 hjbz_yulin_escort_travel_option_desc:0 "羽林の士を選んで随行させる。彼らはみな宿衛の古参で、警戒に慣れており、通る先々でまず虚実をうかがう。道中に奸人がいても、その技を施す術がない。"
