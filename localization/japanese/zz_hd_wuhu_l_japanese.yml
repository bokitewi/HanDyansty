l_japanese:
 # 五胡乱华（见 docs/五胡乱华_僚人入蜀_设计草案.md 第 4 节）

 rule_hd_wuhu_rule: "五胡乱華"
 setting_hd_wuhu_rule_historical: "#high 史実#!"
 setting_hd_wuhu_rule_historical_desc: "南匈奴・武都氐・烏桓は史実の年に土地を求めてやって来る。280 年以降の乱世では、内附した胡族が挙兵して自立し、劉淵・石勒らが史実の年の前後に挙兵する。439 年以降は、辺境での受け入れ、一般的な土地要求、異民族内遷の決断、および漸進的な胡化は発生しなくなる。"
 setting_hd_wuhu_rule_random: "#high ランダム#!"
 setting_hd_wuhu_rule_random_desc: "年の範囲を考慮せず、条件さえ満たせば発生しうる。439 年の打ち切りは引き続き有効。"
 setting_hd_wuhu_rule_player_only: "#high プレイヤーのみ#!"
 setting_hd_wuhu_rule_player_only_desc: "AI は自ら土地を求めたり、挙兵したり、独立を推し進めたりしない。辺境での受け入れと漸進的な胡化は通常どおり発生し、プレイヤーは引き続き関連する決断を使用できる。"
 setting_hd_wuhu_rule_off: "#high 無効#!"
 setting_hd_wuhu_rule_off_desc: "五胡乱華を無効にする。"

 hd_wuhu_land_seized_opinion: "封地を強引に割いて胡人を安置した"

 ### 第二层：边疆收留链
 hd_wuhu.2000.t: "辺境の胡部が帰附を求める"
 hd_wuhu.2000.desc: "[hd_wuhu_nomads_county.GetNameNoTier]一帯の胡人の部衆が境界を越えて放牧し、草場や水源をめぐって地元の民と激しく揉めている。\n\n今日、この胡人たちの首領[turkic_leader.GetName]が自らあなたに会いに来た。[turkic_leader.GetSheHe|U]は、部衆はもはや塞外にいられなくなったので、ただあなたの領内に身を落ち着ける場所を一つ求めたいと言う。その見返りに、[turkic_leader.GetHerHis]の騎手たちはあなたのために戦うつもりだという。"
 hd_wuhu.2000.a: "受け入れて、我が用に供させよ。"
 hd_wuhu.2000.b: "胡人は寝返りやすい。塞外へ追い返せ。"

 hd_wuhu.2001_opening: "主上へ謹んで申し上げます"
 hd_wuhu.2001_letter: "ここに孤児を二人お送りいたします。彼らの父母はすでに餓死しました。それというのも、[turkic_leader.GetCulture.GetName]の者どもの馬群が彼らの家の田畑と果樹園を踏み荒らしたからにほかなりません。主上がかくも胡人を厚遇されるからには、胡人に害された者たちのためにもその責めを負ってくださることでしょう。"
 hd_wuhu.2001.a: "この者、何と無礼な……"
 hd_wuhu.2002_opening: "主上へ謹んで申し上げます"
 hd_wuhu.2002_letter: "先の胡人の件では、私が分をわきまえず、今なお悔いております。聞けば彼らはすでに[nomads_county.GetNameNoTier]を去り、民との争いも次第に収まったとのこと。私はなお主上が胡人に用心なさるべきと考えておりますが、西域の胡商がもたらした金餅を数枚献上し、いささか敬意を表したく存じます。"
 hd_wuhu.2002.a: "礼が届いた以上、前のことは水に流そう。"
 hd_wuhu.2002.b: "品は返す。身の程をわきまえよ。"
 hd_wuhu.2003.t: "胡部の賦税"
 hd_wuhu.2003_beginning: "どうやら、あなたの[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('greedy_chaplain'))][greedy_chaplain.GetFirstName]は、しばらく前から[turkic_leader.GetName]と[turkic_leader.GetHerHis]の部衆に目をつけていたらしい。\n\n「[ROOT.Char.Custom('FormOfAddressForLiege')]」と[greedy_chaplain.GetFirstNameNoTooltip]は言った。「あの胡人どもは我らの土地に住み、我らの草を食みながら、編戸として賦税を納めておりません。"
 hd_wuhu.2003_jizya: "私が思いますに、頭数に応じて別に税銭を納めさせるべきです」\n\n"
 hd_wuhu.2003_not_jizya: "私が思いますに、天幕ごとに別に賦税を納めさせるべきです。殿は彼らに対してもう十分寛大でいらっしゃいました」\n\n"
 hd_wuhu.2003_ending: "「それは不公平です！」と[turkic_leader.GetFirstNameNoTooltip]は抗弁した。「私は部下の騎射手を率いて自ら殿に仕えております。このように我らに課税なさらぬのであれば、そのご恩は必ず覚えておきます」"
 hd_wuhu.2003.a: "貴様らの部が隠した銭一枚とて、探し出してくれる！"
 hd_wuhu.2003.b: "[greedy_chaplain.GetFirstNameNoTooltip]の言うことはもっともだ。お前たちは賦税を納めよ。"
 hd_wuhu.2003.c: "まあよい、[turkic_leader.GetFirstNameNoTooltip]の言うことにも一理ある。"
 hd_wuhu.2004.t: "胡騎の残した孤児"
 hd_wuhu.2004.desc: "[orphan_girl.GetName]はあなたの前に立ち、その姿はまことに哀れであった。弟の[orphan_boy.GetName]も同じく、全身傷だらけである。\n\n「お願いです、[ROOT.Char.GetTitleTierName]」と彼女は声を震わせた。「私たち、もう何日も何も食べていないんです。少しでいいから、ご飯をいただけませんか？　腐っていてもかまいません……」\n\nさらに尋ねてみると、実のところ彼女にも誰を責めればよいのかはっきりとは分からなかった。「馬に乗った人たちが私たちの作物を踏み荒らして、羊を奪っていって……それからいなくなってしまったんです。これからどうすればいいのか分かりません。それに、[upset_vassal.GetTitledFirstName]がこんな小さなことでお煩わせして申し訳ありません」"
 hd_wuhu.2004.a: "怖がらずともよい。わたしのそばにいなさい。"
 hd_wuhu.2004.b: "[turkic_leader.GetFirstNamePossessiveNoTooltip]部族がお前たちを引き取るのが筋というものだ。"
 hd_wuhu.2004.c: "寺観に送り、方外の庇護に委ねる。"
 hd_wuhu.2004.d: "[upset_vassal.GetFirstNameNoTooltip]は何のつもりだ？　お前たちは他の行き先を探せ。"
 hd_wuhu.2005.t: "胡騎の助戦"
 hd_wuhu.2005.desc: "あなたが戦のことで頭を悩ませていると、[turkic_leader.GetName]が一隊の騎手を連れてやって来た。\n\n「[ROOT.Char.GetTitleTierName]」と[turkic_leader.GetSheHe]は礼をして言った。「私はあなた様をお支えすると約束しましたし、我が部族もそう約束いたしました。今あなた様が戦をなさっているからには、熟練の騎射手を一隊お貸ししたく存じます。この一戦に限ってのことです。戦が収まれば、彼らは自分の天幕と家族のもとへ戻らねばなりません。ただこの恩義をお忘れにならないでいただきたいのです」"
 hd_wuhu.2005.a: "よかろう。この恩は覚えておく。"
 hd_wuhu.2005.b: "恩義などという話は二度とするな！"
 hd_wuhu.2005.c: "心遣いは受け取った。この戦は私だけで何とかなる。"
 hd_wuhu.2006.t: "流れ矢"
 hd_wuhu.2006_beginning: "[one_eyed_child.GetName]はいつものように[ROOT.Char.Custom('ResidenceBuilding')]の中を駆け回っていたが、思いがけず事が起きた。[turkic_leader.GetName]が[turkic_leader.GetHerHis]の戦士たちを率いて弓の稽古をしており、一本の流れ矢があなたのやんちゃな[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('one_eyed_child'))]の目に当たったのである。"
 hd_wuhu.2006_has_court_physician: "「[one_eyed_child.GetSheHe|U]の命に別状はありません」と医者の[scoped_physician.GetFirstName]は言った。「ですが残念ながら、この目は助かりません。率直に申し上げますが、今後は庭で矢を射るのを控えた方がよろしいでしょう」\n\n"
 hd_wuhu.2006_no_court_physician: "急いで呼ばれた土地の医者は、[one_eyed_child.GetSheHe]は回復するが、その目は二度と見えないだろうと言った。\n\n"
 hd_wuhu.2006_ending: "「事故だったのです」と[turkic_leader.GetFirstName]は弁明した。「どうか罰を急がないでください、[ROOT.Char.Custom('FormOfAddressForLiege')]。我らが鍛錬しなければ、どうしてこの土地をあなた様のために守れましょう？」"
 hd_wuhu.2006.a: "投獄し、獄中で弓術を反省させよ。"
 hd_wuhu.2006.b: "今後、[ROOT.Char.Custom('ResidenceBuilding')]の近くでの弓射を禁ずる。"
 hd_wuhu.2006.c: "これは天意であり、人の過ちではない。"
 hd_wuhu.2007.t: "交易路の略奪"
 hd_wuhu.2007.desc: "「[ROOT.Char.GetTitleTierName]」と、あなたの[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('warmonger_councillor'))][warmonger_councillor.GetFirstName]が言った。「[bandits_county.GetName]の商人が馬賊に略奪されたと申しております。今では隊商はみなあの一帯を迂回し、商売がすっかり滞っております。この件の取り調べを私にお任せください」\n\n「その必要はない」と[turkic_leader.GetName]が割って入った。「私が戦士を遣わして交易路を常に護衛させよう。その代わり、今後[bandits_county.GetNameNoTierNoTooltip]での放牧を許してもらえればよい。この方がよい手ではないか？」\n\nだが[warmonger_councillor.GetFirstNameNoTooltip]は反対した。「お気をつけください、[ROOT.Char.Custom('FormOfAddressForLiege')]。民は、あなた様が胡人を好き勝手に遊牧させることを何より憎んでおります」"
 hd_wuhu.2007.a: "[turkic_leader.GetFirstNamePossessiveNoTooltip]手立ての方が妥当だ。"
 hd_wuhu.2007.b: "この件はお前に取り調べを任せる。"
 hd_wuhu.2007.c: "しばし待てば、商旅は自ずと戻ってこよう。"

 hd_wuhu.2099.t: "[turkic_leader.GetFirstNamePossessiveNoTooltip]封土の願い"
 hd_wuhu.2099.desc: "[turkic_leader.GetName]と[turkic_leader.GetHerHis]の部衆は、すでに長年あなたに仕えてきた。今日、[turkic_leader.GetSheHe]は改まった様子であなたに会いに来た。\n\n「[ROOT.Char.Custom('FormOfAddressForLiege')]、我らの民はあなた様の領内で子を産み、老人を葬り、とうにここを故郷と思っております。それでも我らは今なお居候の身です。どうか土地を一つお与えください。部衆を本当に落ち着かせたいのです」\n\n今回ばかりは、[turkic_leader.GetSheHe]は明らかに手ぶらで帰るつもりはない。"
 hd_wuhu.2099.a: "では[hd_wuhu_grant_county_1.GetNameNoTier]をお前に与えよう。"
 hd_wuhu.2099.b: "[hd_wuhu_grant_county_2.GetNameNoTier]ではどうだ？"
 hd_wuhu.2099.c: "[hd_wuhu_grant_county_3.GetNameNoTier]しか与えられぬ。"
 hd_wuhu.2099.d: "この件は断じてならぬ。"
 hd_wuhu.2099.d.tt: "#EMP [turkic_leader.GetFirstNameNoTooltip]は憤然と去るか、衆を集めて乱を起こすかもしれない。#!"

 ### 第三层：胡帅带兵求地
 hd_wuhu.3001.t: "胡部が帰附を求める"
 hd_wuhu.3001.desc: "塞外の[hd_wuhu_chief.GetCulture.GetNameNoTooltip]の部衆が辺境にやって来て、首領の[hd_wuhu_chief.GetName]が人を遣わしてあなたに謁見を求めてきた。彼らは[hd_wuhu_petition_target.GetNameNoTier]に住みたいと望んでおり、"
 hd_wuhu.3001.desc_vassal: "あなたの臣下となり、戦時にはあなたのために力を尽くす代わりに、あなたの治下で身を落ち着けたいという。\n\n彼らがもはや行き場を失っているのは明らかだ。だが行き場がないからこそ、ひとたび拒めば衝突は避けられない。"
 hd_wuhu.3001.desc_independent: "あなたを主と仰ぎ、あなたのために力を尽くす代わりに、あなたの治下の土地を一つ得たいという。\n\n彼らはもはや行き場を失っているのかもしれない。だがあの剽悍な騎兵を見れば、これは願い出というより最後通牒と言うべきだろう。"
 hd_wuhu.3001.a: "我が号令に従え。そうすれば[hd_wuhu_petition_target.GetNameNoTierNoTooltip]はお前たちのものだ。"
 hd_wuhu.3001.b: "ふざけるな！　胡虜にはわずかな土地も譲らぬ！"

 HD_WUHU_PETITION_CB_NAME: "胡部の土地要求"
 HD_WUHU_PETITION_WAR_NAME: "[ATTACKER.GetCulture.GetNameNoTooltip]部の[TITLE.GetNameNoTier]要求"
 hd_wuhu_petition_cb: "$HD_WUHU_PETITION_CB_NAME$"
 hd_wuhu_petition_cb_victory_desc: "胡部は係争中の[titles|E]を武力で奪取した。"
 hd_wuhu_petition_cb_victory_desc_attacker: "あなたは係争中の[titles|E]を武力で奪取した。"
 hd_wuhu_petition_cb_defeat_desc: "胡部は撃破され、あなたの土地からの退去を余儀なくされた。"
 hd_wuhu_petition_cb_defeat_desc_attacker: "あなたは他の場所を探すことを余儀なくされた。"
 hd_wuhu_petition_cb_white_peace_desc: "胡部はその武勇により土地を授けられ、あなたの封臣となった。"
 hd_wuhu_petition_cb_white_peace_desc_attacker: "あなたは定住できる土地を得て、防衛側の封臣となった。"

 hd_wuhu_frontier_army_name: "帰附胡騎"
 hd_wuhu_frontier_revolt_army_name: "叛胡"
 hd_wuhu_petition_army_name: "内附胡部"

 ### 史实大单于
 hd_wuhu_chanyu_decision: "挙兵して自立する"
 hd_wuhu_chanyu_decision_desc: "天下は大いに乱れ、晋室の諸王は互いに攻め合い、朝廷はもはや辺地を顧みる余裕がない。我が一族は塞内に散らばって住むこと幾世代、使役と虐げを受け尽くしてきた。今こそ部衆に号令し、自ら一家を立てる時である。"
 hd_wuhu_chanyu_decision_tooltip: "部衆に号令して兵を挙げ、自らの国を建てる"
 hd_wuhu_chanyu_decision_confirm: "兵を挙げよ！"
 hd_wuhu_chanyu_decision_year_ok: "挙兵の年が到来した"
 hd_wuhu_chanyu_decision_phase_ok: "王朝サイクルが動揺・新王朝の征服・闘争・対峙・崩壊のいずれかの段階にある"
 hd_wuhu_chanyu_decision_effect_tt: "あなたは部衆に号令し、この州の城邑を最も多く保有する諸侯に対して兵を興す。四方の胡騎が噂を聞いて馳せ参じる。勝利すれば、その州に拠って国号を建てる。"

 HD_WUHU_CHANYU_CB_NAME: "挙兵して自立する"
 HD_WUHU_CHANYU_WAR_NAME: "[ATTACKER.GetFirstNameNoTooltip]の挙兵、[TITLE.GetBaseName]に拠る"
 HD_WUHU_CHANYU_WAR_NAME_BASE: ""
 hd_wuhu_chanyu_cb: "$HD_WUHU_CHANYU_CB_NAME$"
 hd_wuhu_chanyu_war_victory_desc_attacker: "あなたは目標の王国の法定領内にある[defender.GetShortUINamePossessive]すべての称号を奪取し、その王国を手に入れる。"
 hd_wuhu_chanyu_war_victory_desc: "目標の王国の法定領内にある[defender.GetShortUINamePossessive]すべての称号を奪取し、その王国を手に入れる。"
 hd_wuhu_chanyu_war_victory_crown_tt: "攻撃側が目標の王国を獲得または創設し、国号を定める"
 hd_wuhu_chanyu_conquer_army_name: "挙兵胡騎"
 hd_wuhu_chanyu_hold_army_name: "部衆の親兵"
