l_japanese:
 hd_story_lubu_exile:0 "呂布：長安敗走"
 hd_story_lubu_exile_desc:0 "長安で敗れた呂布は、かつての官爵と領地を失い、旧部を呼び集めて天下を流転する旅路についた。"
 HD_LUBU_EXILE_STORY_STATUS:0 "長安を失った呂布は、并州の旧部をまとめて四方を転々とし、次なる足場を探している。"
 hd_lbx_event_troops:0 "呂布の并州旧部"
 hd_lubu_exile.0001.t:0 "長安敗走"
 hd_lubu_exile.0001.desc:0 "長安はもはや守れなかった。城を出る際、屋敷の品々をどうするかと尋ねる者がいたが、あなたは振り返ってひと睨みし、馬を急がせた。李傕が城を手に入れたとて、あなたの手足まで留め置けるものか。\n\n甲冑をまとった旧部が再び旗の下に集まったが、点呼の声の中には聞き慣れた返事がいくつか欠けていた。手綱を握りしめて聞き終えると、胸の怒りはいよいよ行き場を失った。今すぐ取って返して戦えるのなら、この者たちを連れて城外で宿を探すような羽目にはならなかったものを！\n\nだが将兵たちはあなたが口を開くのを待っている。あなたは得物を握り直し、各隊に兵をまとめるよう命じた。天下のどこもがあなたを受け入れるとは限らぬが、武を振るう場がどこにもないほど広くもない。まずはここを抜け出し、それからこの呂奉先を侮る者がまだいるか見てやろう。"
 hd_lubu_exile.0001.a:0 "旧部をまとめ、別の身の置き所を探す。"
 hd_lubu_exile.0003.t:0 "関東へ逃れる"
 hd_lubu_exile.0003.desc:0 "関中にあなたの居場所はない。だが天下は関中だけではない。\n\n陳宮が灯の下で地図を広げ、指を東へとたどらせて兗州で止めた。彼が言うには、曹操は遠く別の地にあり、諸郡の守臣はそれぞれ思惑を抱き、済陽のあたりには真に押さえの利く者もいない。名分は争えばよい、手に兵さえあれば、と。\n\n旧部はすでに集結し、糧車も用意が整っている。あなたは戟を地に突き立て、皆に告げた。東へ行くぞ、まず済陽を取り、次いで兗州を取る！"
 hd_lubu_exile.0003.a:0 "陣を払って東へ向かい、まず済陽を取る。"
 hd_lubu_exile.0003.a.tt:0 "ほどなくして、あなたは兵を挙げて済陽を攻め取ることになる。"
