 hd190_ze_rong_army:0 "笮融の部衆"
 hd190.0001.t:0 "張魯、漢中に拠る"
 hd190.0001.desc:0 "初平二年の春、五斗米道の師君張魯は張修とともに南鄭を襲い、漢中太守蘇固を殺した。張魯はすぐさま斜谷の閣道を断ち、漢中に拠って自立し、西の武都も併せ、もはや州牧劉焉の命に従わない。\n\n巴と漢のあいだはこれより別の天地となった。張魯は鬼道をもって民を教え、長吏を置かず、祭酒によって治めている。"
 hd190.0001.a:0 "漢中はこれより独り立ちする。"
