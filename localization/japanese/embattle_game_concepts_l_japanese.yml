l_japanese:
 game_concept_embattle:0 "布陣"
 game_concept_embattle_desc:0 "各軍は左右2名の副将を置くことができ、自軍の騎士の中から選任する。副将が欠けた場合、どの陣営の軍も自動で補充する。すぐに補充できる者がいなければ一旦保留となり、「副将の欠員を再点検」決断で改めて点検できる。"
 game_concept_embattle_side_advantage_modifier:0 "副将の軍事修正"
 game_concept_embattle_side_advantage_modifier_desc:0 "副将の軍事の才は、あなたの麾下の軍の戦闘優位に影響する。副将が2名いる場合、追加優位は主将と副将2名の軍事の平均値から主将の軍事を引いた値となる。副将が1名のみの場合は、主将と副将の軍事の平均値から2を引き、さらに主将の軍事を引いた値となる。副将がいない場合は通常-5となるが、反乱軍の首領と騎士枠を持たない統治者はこのペナルティを受けない。まだ自軍に属している副将のみが計算に含まれる。副将の軍事が主将に劣る場合、追加優位はマイナスになることもある。"
 game_concept_embattle_tactic:0 "戦術（削除済み）"
 game_concept_embattle_tactic_desc:0 "布陣に付随する戦術は廃止された。戦闘における兵種の相性と勝敗の理は通常通りである。"
 game_concept_embattle_tactic_counter:0 "旧版の戦術相性"
 game_concept_embattle_tactic_counter_desc:0 "付随戦術同士の相性は廃止され、戦闘優位には影響しなくなった。"
 game_concept_embattle_general_tactic_group:0 "旧版の通常戦術グループ"
 game_concept_embattle_general_tactic_group_desc:0 "この戦術グループは廃止された。"
 game_concept_embattle_clumsy_tactic_group:0 "旧版の拙劣戦術グループ"
 game_concept_embattle_clumsy_tactic_group_desc:0 "この戦術グループは廃止された。"
 game_concept_a_culling_of_the_weak:0 "「弱者淘汰」互換性についての説明"
 game_concept_a_culling_of_the_weak_desc:0 "副将の選任と維持は自軍の中でのみ行われる。補充できない場合は、再び点検するまで保留となる。"
 game_concept_embattle_volly_tactic:0 "斉射（削除済み）"
 game_concept_embattle_volly_tactic_desc:0 "この戦術は廃止されており、戦闘に現れることはない。"
