l_japanese:
 # 天朝循环·时代特色：恢复期（中兴再造）套件

 # ---------- 轻徭薄赋 ----------
 hd_dc_rec_light_taxes_decision: "軽徭薄賦"
 hd_dc_rec_light_taxes_decision_desc: "戦乱の後、戸口は減り、田野は荒れ果てた。文景の治に倣い、刑罰を省き、税の取り立てを軽くし、民と共に休息して、天下の元気を回復させる。"
 hd_dc_rec_light_taxes_decision_tooltip: "天下の租賦を減ずるよう詔し、民と共に休息する。"
 hd_dc_rec_light_taxes_decision_confirm: "天下の租賦を減ずるよう詔する"
 hd_dc_rec_light_taxes_active_tt: "軽徭薄賦の詔が施行中である"
 hd_dc_rec_light_taxes_county_tt: "天子の国の各[county|E]"

 hd_dc_rec_cancel_light_taxes_decision: "軽徭薄賦を中止する"
 hd_dc_rec_cancel_light_taxes_decision_desc: "国の用度は足りず、府庫は空虚である。租賦減免の詔を前倒しで廃止し、かつての税額を回復する――ただし百姓は必ずや朝廷が信を失ったと考え、これを苛政とみなすだろう。"
 hd_dc_rec_cancel_light_taxes_decision_tooltip: "減税の詔を前倒しで廃止し、旧来の税額を再び徴収する。"
 hd_dc_rec_cancel_light_taxes_decision_confirm: "旧来の税額を再び徴収する"
 hd_dc_rec_cancel_light_taxes_county_tt: "まだ減税中の各[county|E]"

 hd_dc_rec_light_taxes_modifier: "軽徭薄賦"
 hd_dc_rec_light_taxes_modifier_desc: "朝廷が天下の租賦を減免し、民と共に休息している。"
 hd_dc_rec_light_taxes_county_modifier: "軽徭薄賦"
 hd_dc_rec_light_taxes_county_modifier_desc: "朝廷が租賦を減免し、百姓は休養して生気を取り戻している。"

 # ---------- 招抚流民 ----------
 hd_dc_rec_resettle_refugees_decision: "流民を招撫する"
 hd_dc_rec_resettle_refugees_decision_desc: "兵火の後、流民が道を塞いでいる。一州の地を選び、官府が田を与え種を授け、耕牛を貸し与えて、流亡した者を郷里に呼び戻して生業に復させ、荒地を再び良田とする。"
 hd_dc_rec_resettle_refugees_decision_tooltip: "一州を選び、流亡した者を郷里に呼び戻して生業に復させる。"
 hd_dc_rec_resettle_refugees_decision_confirm: "流亡者を呼び戻す"
 hd_dc_rec_resettle_refugees_pick_tt: "少なくとも1県が天子の国に属する州を選ばねばならない"
 hd_dc_rec_resettle_refugees_county_tt: "その州内の天子の国に属する各[county|E]"
 hd_dc_rec_resettle_refugees_county_modifier: "流民を招撫する"
 hd_dc_rec_resettle_refugees_county_modifier_desc: "流民が生業に戻り、荒田は再び開墾され、戸口は次第に増えている。"

 # ---------- 大赦天下 ----------
 hd_dc_rec_grand_amnesty_decision: "天下大赦"
 hd_dc_rec_grand_amnesty_decision_desc: "中興の際に、天下と共に新たに始める。大赦の詔を頒布して囚人を寛大に赦し、天子の仁徳を示して人心をまとめる。"
 hd_dc_rec_grand_amnesty_decision_tooltip: "囚人を大赦し、寛仁によって人心をまとめる。"
 hd_dc_rec_grand_amnesty_decision_confirm: "大赦の詔を頒布する"
 hd_dc_rec_grand_amnesty_no_prisoner_tt: "天子またはその封臣が少なくとも1人の囚人を拘禁している"
 hd_dc_rec_grand_amnesty_decision_effect_tt: "大赦の範囲を朝議する：朝廷が拘禁する囚人のみを赦すか、諸侯や郡国の獄囚まであわせて寛大に赦すか。"

 hd_dc_rec.0001.t: "天下大赦"
 hd_dc_rec.0001.desc: "詔書はすでに起草され、あとは玉璽を押すのみである。尚書令が奏上した。「大赦の恩は、朝廷が拘禁する囚人のみに及ぼしますか、それとも諸侯や郡国の獄囚までもあわせて寛大に赦しますか？　天下あまねく赦せば、もとより恩沢は広く行き渡りましょう。ただ、諸侯が朝廷の越権と受け取り、怨みを抱くのではないかと恐れます。」"
 hd_dc_rec.0001.a: "朝廷の囚人のみを赦す"
 hd_dc_rec.0001.b: "天下あまねく赦し、諸侯の囚人もあわせて釈放する"
 hd_dc_rec.0001.c: "獄中はすでに空である。命を撤回する"

 hd_dc_rec_amnesty_opinion: "天下大赦"
 hd_dc_rec_prisoners_released_opinion: "我が囚人を強制的に釈放した"

 # ---------- 求贤诏 ----------
 hd_dc_rec_seek_talent_decision: "求賢の詔"
 hd_dc_rec_seek_talent_decision_desc: "国家の中興は、まず人を得ることにある。州郡に詔して賢良方正・明経茂才を推挙させ、一芸に秀でた者は誰でも宮闕に参じて自薦できるようにする。"
 hd_dc_rec_seek_talent_decision_tooltip: "詔を下して賢人を求め、四方の俊才を朝廷に招く。"
 hd_dc_rec_seek_talent_decision_confirm: "詔して賢良を挙げさせる"
 hd_dc_rec_seek_talent_decision_effect_tt: "四方の士が詔を聞いてやって来る。#EMP 1～3人ほど#!が召しに応じて朝廷に入り、それぞれ人に勝る長所を持つ。"

 hd_dc_rec.0002.t: "四方の賢士"
 hd_dc_rec.0002.desc_1: "求賢の詔が州郡に下されてわずか数か月、一人の俊才が詔に応じてやって来て、宮闕に参じて上書し、自らの学ぶところを述べた。"
 hd_dc_rec.0002.desc_2: "求賢の詔が州郡に下されてわずか数か月、二人の俊才が連れ立って上京し、宮闕に参じて上書し、それぞれの長所を述べた。"
 hd_dc_rec.0002.desc_3: "求賢の詔が州郡に下されてわずか数か月、四方の士が噂を聞いて集まり、なんと三人が同じ日に宮闕に参じ、一堂に会した。"
 hd_dc_rec.0002.a: "国家が人を得たのは、社稷の幸いである"
 hd_dc_rec_talent_summoned_opinion: "詔に応じて入朝した"
