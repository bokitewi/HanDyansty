l_japanese:
 quix_murder_outcome.4018.exposed_scheme:0 "\n\nところが運悪く、振り返った拍子に梁に頭をぶつけてしまった！目から火花が散り、あなたは床に座り込んで呆然とした。[target.GetName]が寝台の上で身を起こし、信じられないという顔であなたを睨みつけた。二人はしばらく見つめ合ったまま動けず、外から慌ただしい足音が聞こえてきて、ようやくあなたは我に返り、よろめきながら窓から転がり出て逃げた。あの一瞥で、[target.GetSheHe]はあなたの顔をしっかりと見て取った。相手が猟犬を放って追ってきたので、あなたは泥沼の中で一晩身を潜めるほかなかった！"
 quix_seduce_outcome.2010.b:0 "心ゆくまで楽しんだ。一夜で十分だ。"
 quix_seduce_outcome.2301.a.tt:0 "それからというもの、あの屋敷にはしばしば夜の訪問者があった。"
 quix_seduce_outcome.3301.a.tt:0 "それからというもの、あの屋敷の灯火はしばしば夜明けまで灯っていた。"
 quix_seduce_outcome.2030.a.desc:0 "あなたも[target.GetTitledFirstName]も互いが何を望んでいるかよくわかっており、これ以上探り合っても意味はない。腹心があなたたちのために、誰にも邪魔されない場所を探してくれた。"
 quix_seduce_outcome.2030.alcohol.desc:0 "数杯の酒が腹に収まると、あなたたちはますます遠慮がなくなった。"
 quix_seduce_outcome.2030.b.desc:0 "\n\nあなたが胸の内を打ち明けようとしたとたん、[target.GetFirstName]は指を一本伸ばしてあなたの唇を押さえた。その後の逢瀬は熱く率直なもので、どちらも約束めいたことは口にしなかった。"
 quix_seduce_outcome.2302.desc_court_owner:0 "あなたと[target.GetTitledFirstName]は遠く離れており、なかなか機会が得られない。そこであなたは名山に祭祀に出かけると口実を設け、道中で身なりを変え、[target.GetTitledFirstNamePossessive]の屋敷に紛れ込み、使用人の住む離れに身を潜めた。"
 quix_seduce_outcome.2302.desc_end:0 "\n\nあなたたちは夜陰に乗じて夜半まで語り合ったが、どちらも来意には触れなかった。ところがそれぞれ引き上げた後、[target.GetFirstName]がこっそりとあなたの寝床のそばに忍び寄ってきた。"
 quix_seduce_outcome.2302.desc_not_court_owner:0 "あなたと[target.GetTitledFirstName]は遠く離れており、なかなか機会が得られない。そこであなたは名山に祭祀に出かけると口実を設け、道々尋ね歩いて[target.GetSheHe]が身を寄せている屋敷を突き止め、使用人に扮して紛れ込み、離れに身を潜めた。"
 quix_seduce_outcome.3023.b:0 "今夜のことは、ここだけに留めておこう。"
 quix_seduce_outcome.3030.a.desc:0 "あなたも[owner.GetTitledFirstName]も互いが何を望んでいるかよくわかっており、これ以上探り合っても意味はない。腹心があなたたちのために、誰にも邪魔されない場所を探してくれた。"
 quix_seduce_outcome.3030.alcohol.desc:0 "数杯の酒が腹に収まると、あなたたちの顔はどちらも赤らんできた。"
 quix_seduce_outcome.3030.b.desc:0 "\n\n[owner.GetSheHe|U]が胸の内を打ち明けようとしたとたん、あなたは指を一本伸ばして[owner.GetHerHis]唇を押さえた。その後の逢瀬は熱く率直なもので、どちらも約束めいたことは口にしなかった。"
 quix_seduce_outcome.3031.a.desc:0 "宴席は人の出入りが多く、あなたと[owner.GetTitledFirstName]はなかなか打ち解けた話ができない。すると[owner.GetSheHe|U]が不意にあなたの耳元に顔を寄せ、一緒に抜け出そうと低い声で持ちかけた。"
 quix_seduce_outcome.3031.alcohol.desc:0 "あなたはいくらか酔いに任せて、考えもせずにうなずいた。"
 quix_seduce_outcome.3031.b.desc:0 "\n\nあなたたちは人目を盗んで宴席を抜け出した。皆から遠く離れてから、あなたはようやく、一晩中こんな機会を探していたことを認めた。あなたたちはもう、隠し立てする必要はなかった。"
 quix_seduce_outcome.3302.desc_court_owner:0 "今度は、なんと[owner.GetSheHe]のほうが祭祀に出かけると口実を設け、道中で身なりを変え、あなたの屋敷に紛れ込み、使用人の住む離れに身を潜めた。"
 quix_seduce_outcome.3302.desc_end:0 "\n\nあなたたちは夜陰に乗じて夜半まで語り合ったが、どちらも来意には触れなかった。ところがそれぞれ引き上げた後、あなたは気が変わり、こっそりと[owner.GetFirstName]の寝床のそばに忍び寄った。"
 quix_seduce_outcome.3302.desc_not_court_owner:0 "今度は、なんと[owner.GetSheHe]のほうが祭祀に出かけると口実を設け、道々尋ね歩いてあなたが身を寄せている屋敷を突き止め、使用人に扮して紛れ込んできた。"
 quix_seduce_outcome.3302.desc_opening:0 "[owner.GetTitledFirstName]は以前からあなたに気があったが、二人はあまりに遠く離れていた。"
