 building_hd_pass_p_5969_01:0 "嘉峪関"
 building_hd_pass_p_5969_01_desc:0 "酒泉郡の西、南山と北山の間にはただ細長い平野が残るのみで、河西諸郡のうち最も狭い所である。戍卒はここで烽燧を見張り、さらに西へ行けば、敦煌と西域である。"
