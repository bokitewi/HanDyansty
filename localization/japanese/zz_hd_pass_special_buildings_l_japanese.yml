 # Shared descriptions for strategic and ordinary new chains
 building_hd_pass_p_4628_01_desc:0 "常山はもとの名を恒山といい、孝文皇帝の諱を避けて改称された。関城は恒山の南の山谷の間に置かれ、北は代郡に通じ、東へ下れば冀州平原である。"
 building_hd_pass_p_4628_02_desc:0 "$building_hd_pass_p_4628_01_desc$"
 building_hd_pass_p_4628_03_desc:0 "$building_hd_pass_p_4628_01_desc$"
 building_hd_pass_p_4628_04_desc:0 "$building_hd_pass_p_4628_01_desc$"
 building_hd_pass_p_638_01_desc:0 "陳留郡中牟のあたりには、古くから楡関の名があり、戦国時代の魏国の辺関と伝えられる。今や関塞は廃れ、道端に土塁が残るのみだが、洛陽と陳留の間を行き来する車馬はなおここを通る。"
 building_hd_pass_p_638_02_desc:0 "$building_hd_pass_p_638_01_desc$"
 building_hd_pass_p_638_03_desc:0 "$building_hd_pass_p_638_01_desc$"
 building_hd_pass_p_638_04_desc:0 "$building_hd_pass_p_638_01_desc$"
 building_hd_pass_p_3734_01_desc:0 "蜀郡厳道の西の山中に霊関道がある。孝武皇帝の時、司馬相如が西南夷に使いし、零関道を開通させ、孫水に橋を架けて邛都へ直に通じさせた。関の外は邛・笮の諸部が集住する地である。"
 building_hd_pass_p_3734_02_desc:0 "$building_hd_pass_p_3734_01_desc$"
 building_hd_pass_p_3734_03_desc:0 "$building_hd_pass_p_3734_01_desc$"
 building_hd_pass_p_3734_04_desc:0 "$building_hd_pass_p_3734_01_desc$"
 building_hd_pass_p_3636_01_desc:0 "漢中郡東部の群山の間、頂の平らな山峰が一つ道端にそびえ立ち、関城は山に依って築かれ、漢中から東の上庸へ、西の南鄭へ入る山道を扼している。"
 building_hd_pass_p_3636_02_desc:0 "$building_hd_pass_p_3636_01_desc$"
 building_hd_pass_p_3636_03_desc:0 "$building_hd_pass_p_3636_01_desc$"
 building_hd_pass_p_3636_04_desc:0 "$building_hd_pass_p_3636_01_desc$"
 building_hd_pass_p_3116_01_desc:0 "漢水の上流には群山が連なり、馬の背のように曲がりくねる一筋の尾根がある。道は尾根の背に沿って続き、両側はいずれも深い谷で、関城はその尾根上の要隘を扼している。"
 building_hd_pass_p_3116_02_desc:0 "$building_hd_pass_p_3116_01_desc$"
 building_hd_pass_p_3116_03_desc:0 "$building_hd_pass_p_3116_01_desc$"
 building_hd_pass_p_3116_04_desc:0 "$building_hd_pass_p_3116_01_desc$"
 building_hd_pass_p_833_01_desc:0 "弘農郡盧氏県のあたり、熊耳の諸山の間に両側の崖が門のように高くそびえ、旅人はその間を通り抜ける。これは洛水の上流から上洛へ通じる山道の関隘である。"
 building_hd_pass_p_833_02_desc:0 "$building_hd_pass_p_833_01_desc$"
 building_hd_pass_p_833_03_desc:0 "$building_hd_pass_p_833_01_desc$"
 building_hd_pass_p_833_04_desc:0 "$building_hd_pass_p_833_01_desc$"
 building_hd_pass_p_1064_01_desc:0 "河東郡垣県の王屋山中、山の形は箕のようで、関城は険に拠って立ち、南へ下って河を渡れば洛陽に至る。光武皇帝が天下を平定し始めた頃、鄧禹はこの箕関から兵を進め、河東に攻め入った。"
 building_hd_pass_p_1064_02_desc:0 "$building_hd_pass_p_1064_01_desc$"
 building_hd_pass_p_1064_03_desc:0 "$building_hd_pass_p_1064_01_desc$"
 building_hd_pass_p_1064_04_desc:0 "$building_hd_pass_p_1064_01_desc$"
 building_hd_pass_p_1509_01_desc:0 "隴山は高く険しく、関中と隴西の間に横たわり、山頂に関が置かれて隴関と呼ばれる。旅人は隴を越えて西へ行き、高みに登って秦川を振り返れば、往々にして悲しみが込み上げる。建武年間には、隗囂もまた隴坻に拠って漢軍を拒んだ。"
 building_hd_pass_p_1509_02_desc:0 "$building_hd_pass_p_1509_01_desc$"
 building_hd_pass_p_1509_03_desc:0 "$building_hd_pass_p_1509_01_desc$"
 building_hd_pass_p_1509_04_desc:0 "$building_hd_pass_p_1509_01_desc$"
 building_hd_pass_p_1942_01_desc:0 "江夏郡北境の大別の諸山の間、山の北側の谷道は深く曲がりくねり、木々は終日日の光を通さない。関城はその中を扼している。"
 building_hd_pass_p_1942_02_desc:0 "$building_hd_pass_p_1942_01_desc$"
