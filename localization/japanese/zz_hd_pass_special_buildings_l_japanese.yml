 # New major pass chains
 building_hd_pass_p_2203_01:0 "穆陵関"
 building_hd_pass_p_2203_01_desc:0 "大峴山上の穆陵関は斉の地の南の門戸であり、管仲が楚の使者に答えた際に言った「南は穆陵に至る」とは、まさにこの地のことである。山道は狭く、車馬が並んで通るのは難しい。この関を越えれば、北は一面の平野が広がる斉国の腹地である。"
 building_hd_pass_p_2203_02:0 "穆陵関"
 building_hd_pass_p_2203_02_desc:0 "$building_hd_pass_p_2203_01_desc$"
