 building_hd_pass_p_3121_01:0 "白水関"
 building_hd_pass_p_3121_01_desc:0 "広漢郡白水県では、白水が北西から流れ来て、ここで西漢水に注ぐ。関城は武都・漢中から南下して蜀に入る北の道を扼し、益州北方の重要な関隘である。"
 building_hd_pass_p_3121_02:0 "白水関"
 building_hd_pass_p_3121_02_desc:0 "$building_hd_pass_p_3121_01_desc$"
