 building_hd_pass_p_1135_01:0 "壺関"
 building_hd_pass_p_1135_01_desc:0 "上党郡壺関県は、山の形が壺のように口が狭く胴が広いため、壺口と名づけられた。関城は太行の険に拠り、東へ下れば河北平原であり、上党から東へ出る門戸である。孝武皇帝の時、壺関の三老が上書して戻太子の冤罪を訴えたことがある。"
 building_hd_pass_p_1135_02:0 "壺関"
 building_hd_pass_p_1135_02_desc:0 "$building_hd_pass_p_1135_01_desc$"
