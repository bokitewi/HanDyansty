 building_hd_pass_p_3634_01:0 "子午関"
 building_hd_pass_p_3634_01_desc:0 "長安の南、秦嶺の中に南北を貫く谷道があり、王莽の時に開かれて子午道と名づけられ、漢中へ直に下ることができる。関城は北の入口に置かれ、谷中には桟道が延々と続き、険しく通行は困難である。"
 building_hd_pass_p_3634_02:0 "子午関"
