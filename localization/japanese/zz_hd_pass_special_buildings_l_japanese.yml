 building_hd_pass_p_4403_01:0 "江油関"
 building_hd_pass_p_4403_01_desc:0 "陰平の山道の果て、涪水のほとりに小さな戍城があり、四方を群山に囲まれている。北から来る険しく人里離れた小道はここでようやく深山を抜け、南へ下れば涪県と成都の平野に直に至る。"
 building_hd_pass_p_4403_02:0 "江油関"
 building_hd_pass_p_4403_02_desc:0 "$building_hd_pass_p_4403_01_desc$"
