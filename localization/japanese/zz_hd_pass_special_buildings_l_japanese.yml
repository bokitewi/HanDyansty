 building_hd_pass_p_3642_01_desc:0 "上庸は古の庸国の地であり、春秋の時に庸人が群蛮を率いて楚に背き、ついに楚・秦・巴の三国に滅ぼされた。城は堵水のほとりに拠り、群山に囲まれ、西は漢中に通じ、東は襄陽へ下り、漢水上流の山道と水路を扼している。"
