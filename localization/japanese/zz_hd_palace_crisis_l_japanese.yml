l_japanese:
 hd_palace_crisis.0001.t:0 "都の噂"
 hd_palace_crisis.0001.desc:0 "雒陽から届く知らせは、軍報よりもなお乱雑であった。何進と宦官が争い、今日はすでに決着したと言い、明日は太后が許さぬと言う。言伝を運ぶ者は誰もが、まずあなたがどちらの話を信じたいのかを探ろうとする。\n\nあなたは書状を左右に渡して改めて読ませ、自らは帳の入口へ歩み出た。涼州の兵卒は相変わらず馬具を点検しており、都の宮門の内での争いなど、彼らにとってははるか遠いことである。だが朝廷に外の兵を借りて勝負をつけようとする者が本当にいるなら、この者たちはにわかに最も重要な手駒となる。\n\n書状にはまだ正式な召令はない。急いでどちらかに肩入れを表明する必要はない。ただ気をつけていればよい。争う者たちがいつ口先に頼るのをやめ、あなたの兵馬を自らの算段に書き込むのかを。"
 hd_palace_crisis.0001.a:0 "しばし都の変を静観しよう。"
 hd_palace_crisis.0002.t:0 "外兵の議"
 hd_palace_crisis.0002.desc:0 "都の争いにようやく新たな道筋が見えた。届いた知らせによれば、袁紹が何進に外兵を都に呼び入れ、兵威をもって太后に迫り宦官を誅させるよう勧めたという。名の挙がった兵を率いる者の中に、まさしくあなたがいた。\n\nあなたはその数行を二度読み返した。何進はただ一時甲兵の音を借りて、議して決まらぬことを落着させたいだけかもしれぬ。だが兵馬がひとたび城下に至れば、もはや取り下げられる上奏文ではなくなることまでは考えていないであろう。\n\n左右が直ちに動くかと問うたが、あなたは手を振って制した。知らせはしょせん詔命ではない。糧秣は先に調べておけるし、道筋も先に尋ねておける。だが何の名目で都に入るかは、本当に軍前に届く文書を待たねばならない。"
 hd_palace_crisis.0002.a:0 "まず糧道を調べ、召書を静かに待つ。"
 hd_palace_crisis.0003.t:0 "召しに応じて入京"
 hd_palace_crisis.0003.desc:0 "召令がついに届いた。文書を広げ、軍を率いて都に入れという一句に至ると、あなたは指でその箇所を押さえ、左右にもう一度読み聞かせた。帳の外で一頭の馬がいななき、まるで彼らより先にこれが好機だと悟ったかのようであった。\n\n朝廷の連中はあれこれ争った挙げ句、結局はあなたの兵を借りねばならぬのだ。雒陽に着いたら誰の節制に従うべきかと尋ねる者がいた。あなたが目を上げて見やると、彼は慌てて言い直し、糧秣のことを尋ね始めた。兵もまだ率いて来ぬうちに、早くも他人のためにあなたをどう縛るかを考える者がいるとは。\n\nあなたは召令を巻き、机の縁でとんとんと叩いた。都の宮門がいかに奥深くとも、人を招き入れねばならぬ時は必ずある。今や文書は手にあり、甲兵は傍らにある。何をためらうことがあろうか。"
 hd_palace_crisis.0003.a:0 "詔を奉じて兵を進め、即日出立する。"
 hd_palace_crisis.0004.t:0 "宮門閉ざされる"
 hd_palace_crisis.0004.desc:0 "宮門が背後で閉じた時、あなたはいつもどおりの道払いにすぎないと思っていた。前方にも行く手を阻む者が現れて初めて、先ほどまで随行していた者たちの声がもう聞こえないことに気づいた。\n\n宦官たちはもはや以前のように婉曲ではなかった。彼らは迫りつつある外兵のことを持ち出し、あなたと袁紹の密議のことを持ち出し、その口ぶりにはもはや弁明の余地を与える気配はない。大将軍を阻む者は誰かとあなたは一喝したが、答えたのは迫り来る足音と鞘を払う刀の音であった。\n\nあなたは帯に手をやり、ふと宮門の外でまだ待っている者たちのことを思い出した。彼らにはあなたの車馬は見えても、今まさに取り囲む刃は見えない。外兵を召すあの文書は、ついにこの一枚の扉を開けてはくれなかった。"
 hd_palace_crisis.0004.a:0 "門外の兵馬は……なぜまだ来ぬのだ？"
 hd_palace_crisis.0005.t:0 "血に染まる宮門"
 hd_palace_crisis.0005.desc:0 "何進遇害の報が宮門の外に伝わると、先ほどまで待っていた兵士たちはたちまち乱れた。あなたは衆を率いて押し入った。禁門の奥では怒号と逃げ惑う音が入り混じり、もはや誰一人として一つの号令を最後まで聞こうとはしない。\n\n宦官とその党羽はすでに掃討されたが、軒下や甬道にはなお血の跡が残っている。先ほどまで人が守っていた門を通り過ぎて、あなたはようやく悟った。刀を抜いて一群の人間を除いたところで、朝廷の号令を直ちに引き継げる者がいるわけではないのだと。\n\n城外からは、董卓の兵馬が迫っているとの報がまた届いた。そもそも外兵を呼んだのは宮中を退かせるためであった。いま何進は死に、宮門は破れた。次は誰があの軍勢に、もう城に入る必要はないと告げに行くのか。"
 hd_palace_crisis.0005.cao_desc:0 "袁紹はすでに死に、何進もまた宮中で殺された。知らせが届いた以上、これ以上待つことこそ最も危険である。あなたは兵を率いて禁門に突入し、先ほどまで互いに探り合っていたささやきは、たちまち追跡と号令の声に変わった。\n\n宦官とその党羽はすでに掃討された。だがあなたは荒れ果てた宮道に立ちながら、この残局を説明できる者を一人も見つけられない。さらに捕縛を続けよと求める者もいれば、天子の居場所だけを知りたがる者もおり、自分は決してこの件に関わっていないと弁明に忙しい者もいる。\n\n董卓の兵馬はなおも雒陽に迫っている。宮中の仇敵は倒れたものの、城外へ向けて何進の手で発せられたあの召令は、彼の死とともに無効になるわけではない。"
 hd_palace_crisis.0005.dong_desc:0 "袁紹も曹操もすでに死に、何進もまた宦官に殺された。都から届いた急報は初めは救援を求めるものであったが、やがて各所の兵士が勝手に捕縛を行っているという知らせに変わり、書いた者自身でさえ、誰がまだ朝政を取り仕切っているのか分からないという。\n\nあなたは宦官とその党羽の追及を命じ、掃討の結果はすぐに報告されてきた。だがそれらの名が名簿から消された後も、空いた宮門と統制を失った兵衆が、それによって昔の秩序を取り戻すことはなかった。\n\nあなたは軍報をしまい込み、都へ向かう道筋について尋ね始めた。あなたを呼んだ者はすでに死に、宮中には残局を収める者もいない。ならばこの軍が城に入った後、誰の号令に従うかは、もはや元の思惑どおりにする必要はない。"
 hd_palace_crisis.0005.a:0 "掃討は終われど、残局は収まらず。"
 hd_palace_crisis.0007.t:0 "涼州兵、雒陽に入る"
 hd_palace_crisis.0007.desc:0 "雒陽の城門はすぐ目の前にある。守卒は旗印を見るや、まず慌てて取り次ごうとしたが、誰に報告すべきかしばらく言えずにいた。あなたは苛立ち、馬を一歩前へ進めた。\n\n何進は死に、宦官も誅に伏した。城中の者は皆、他人が先に口を開くのを待っているかのようである。朝廷があなたの兵を必要とした時には、召令をあれほど急いで発したというのに、今や兵が到着しても、出てきて事を取り仕切ろうとする者すら一人も見当たらない。\n\nあなたは背後の隊列を振り返り、前軍に順に入城するよう命じた。宮門には守る者が要り、司隷の軍政には掌る者が要る。他の者が互いに顔を見合わせるばかりならば、今後誰に報告すべきか、はっきりと見せてやればよい。"
 hd_palace_crisis.0007.a:0 "兵は雒陽に入り、司隷を総領する。"
 hd_palace_crisis.0015.t:0 "廃立"
 hd_palace_crisis.0015.desc:0 "入京して以来、宮門の守衛も司隷の軍政も次第にあなたの意のままに動くようになったが、殿上の名位はなおあらゆる命令の前に立ちはだかっている。群臣が祖制を論じる時、その視線はいつも意識してかせずしてか玉座へと向かう。\n\nあなたは廃立の議を彼らの前に突きつけた。劉弁を廃し、劉協を立てる。詔書に書けばわずか数行にすぎない。だがその数行がひとたび定まれば、朝中に残るためらいや僥倖を頼む心は、すべて別の言い方に改めねばならなくなる。笏を握りしめる者もいれば、うつむいて黙り込み、あなたがこの言葉を引っ込めるのを待つ者もいる。\n\nあなたは引っ込めなかった。兵権はすでに手中にある。誰をあの玉座に座らせるかすら決められぬようでは、どうして朝政を総攬すると言えようか。"
 hd_palace_crisis.0015.a:0 "劉弁を廃し、劉協を立てる。"
 hd_palace_crisis.0016.t:0 "刀を横たえ長揖す"
 hd_palace_crisis.0016.desc:0 "董卓が廃立の議を口にすると、殿前にはしばし誰も応じる者がいなかった。視線をそらす同僚たちを見て、あなたはついに剣に手をかけて進み出て、何の権限があって勝手に天子を廃立するのかと詰問した。\n\n言葉が口から出た以上、もはや尋常の論争とみなすことはできない。董卓の兵は城中にあり、あなたの怒りは彼と対峙するに足る甲士には変わらない。周りには取りなそうとする者もいたが、それ以上に多くの者はただ、二人がその場で刀を抜かぬことだけを願っていた。\n\nあなたは刀を横たえて長揖し、殿外へ退いてから、ようやく張り詰めた手を緩めた。ここに留まるのは、命を彼の一時のためらいに預けるにすぎない。渤海ならまだ経営できる。今後の大事を、この援けなき争いにすべて賭ける必要がどこにあろうか。"
 hd_palace_crisis.0016.a:0 "節を上東門に懸け、渤海へ奔る。"
 hd_palace_crisis.0021.t:0 "并州の旧部"
 hd_palace_crisis.0021.desc:0 "董卓の兵が数歩迫ると、あなたの傍らの呂布がそれを迎え撃った。急にためらいを見せた向こうの陣形を眺め、あなたは冷笑した。涼州兵が都で横暴を働こうとも、恐れる相手がいないわけではないのだ。\n\n奉先が戻ってくると、あなたは陣中に気を配り、并州の旧部をしっかりとまとめておくよう命じた。城中では近ごろ、董卓がどれほど恩賞を与えているか、夜中に誰が出入りしているかという話ばかりで、聞くだにうんざりする。朝廷のことがまだ片付かぬうちに、早くも自分の身の振り方を探す者が出てきているのだ。\n\n呂布は一声応じたが、多くは語らなかった。あなたは彼をひと目見て、なおも次の軍令を彼の手に渡した。彼が傍らにいる限り、この争いはまだ董卓の思いどおりにはならない。"
 hd_palace_crisis.0021.a:0 "奉先、陣中のことはなお頼むぞ。"
 hd_palace_crisis.0022.t:0 "身辺の刃"
 hd_palace_crisis.0022.desc:0 "呂布が帳に入ってきた時、あなたは新たな軍報かと思い、奉先と一声呼んで近くへ招いた。だが彼は礼をせず、手は終始武器にかけたままであった。\n\n「これは何のつもりだ？」その言葉を発してから、あなたはようやく立ち上がった。彼は董卓のことを口にし、新たな身の置き所のことを口にした。その口ぶりは、まるですでに片付いた軍務を報告しているかのようであった。あなたははっと帳の入口を見やった。聞き慣れた陣中の物音はなおしているが、入ってくる者は一人もいない。\n\n昨日は彼があなたのために董卓を防いだというのに、今日はこの武器があなたに向けられている。あなたは佩剣に手を伸ばしたが、怒りが残りの言葉をすべて喉に詰まらせた。奉先――陣中に気を配れと命じたことは、己の命までも彼の手に委ねることであったのか！"
 hd_palace_crisis.0022.a:0 "奉先、貴様、わしに手をかけるつもりか？"
 hd_palace_crisis.0023.t:0 "雒陽を焼き西へ遷る"
 hd_palace_crisis.0023.desc:0 "関東の諸軍はすでに挙兵し、董卓討伐の檄文も雒陽に届いた。それまで各々州郡を守っていた者たちが、今やあなたの名を同じ一枚の罪状に書き連ねており、朝中の群臣よりもかえって足並みが揃っている。\n\n左右は長安へ西遷し、関中の険固に拠って再起を図るよう勧めた。あなたが軍報を机に叩きつけると、殿下はたちまち静まり返った。雒陽を捨てるのは無論口惜しいが、ここに留まって諸軍が迫るのを待つのは、なおのこと意に沿わない。\n\n宮室・府庫・軍民の移徙は、すべてこの命令とともに動き出さねばならない。城中で随行を拒む富戸や豪族も、後から来る者のために残しておく必要はない。関中へ通じる道を地図で眺め、あなたはついに人を近くへ呼んだ。去るとなれば、追ってくる者に悠々と引き継げる都を残してやるわけにはいかない。"
 hd_palace_crisis.0023.a:0 "雒陽をことごとく焼き、長安へ西遷する。"


