l_japanese:
 hds_nr.1.t:0 "南陽の黄巾、降る"
 hds_nr.1.desc:0 "南陽に散らばっていた黄巾の部衆が、人を遣わして降伏を願い出てきた。名簿を読み上げるうちに使者の口はすっかり乾いてしまい、あなたは彼にまず水を飲むよう言って、自ら残りの名を目で追った。\n\n人数は寸分違わず報告されているが、実際に隊伍を編成するとなれば、どれほど手間がかかるか分からない。劉辟、黄邵、何儀、何曼らの旧部もその中に名を連ねている。従う気のある将は追って順次到着するだろうから、すべてを今日の約束に詰め込む必要はない。\n\nあなたは名簿を机の上に置いた。陣門はただ人を通すだけでは済まない。誰がどの隊を率い、誰がどの命令に従うのか、引き続きはっきりさせねばならない。それでも人が帰順してくるのなら、田舎に散らばったまま、畦を隔ててあなたの兵と睨み合わせておくよりはましである。"
 hds_nr.1.a:0 "その衆を収め、隊伍に編入する。"
 hds_nr_nanyang_yellow_turbans:0 "南陽黄巾降兵"
 hds_nr_sun_jian_mortal_risk:0 "江東の虎の危うき道"
 hds_nr_sun_jian_mortal_risk_desc:0 "董卓討伐の諸軍が散った後も、この人物はなおしばしば矢面に立ち、危地に出入りしており、左右の者は常にはらはらしている。"
