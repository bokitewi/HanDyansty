 dynasty_celestial_favor_interaction_modifier:0 "天子の恩沢"
 WJ_bizhao_modifier:0 "辟召"
 WJ_bizhao_modifier_desc:0 "この人物は府主に辟召されて幕府に入り、これにより仕官した。推挙した主を恩師として仰いでいる。"
 WJ_maocai_modifier:0 "茂才を挙げる"
 WJ_maocai_modifier_desc:0 "この人物はかつて茂才に推挙され、その才名は州郡に重んじられ、仕途は常人より順調である。"
 WJ_refused_bizhao_modifier:0 "辟召を拒否"
 WJ_refused_bizhao_modifier_desc:0 "この人物はかつて辟召を辞退した。一時の栄寵を慕わぬその姿勢により、かえって名声が高まった。"
 WJ_temp_official_modifier:0 "仮吏試守"
 WJ_temp_official_modifier_desc:0 "この人物は辟召・孝廉・茂才のいずれの出身もないまま実職に就いたため、仮吏として試みに職を守るほかない。俸入はわずかで、同僚からもかなり軽んじられている。"
