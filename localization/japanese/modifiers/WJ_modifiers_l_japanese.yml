 WJ_xiaolian_modifier_desc:0 "この人物はかつて孝廉に推挙され、正式な仕官の出身を有している。"

 # 来源：localization/simp_chinese/WJ_district_orders_l_simp_chinese.yml
 WJ_dd_execution_modifier:0 "将を斬って旗を祭る"
 WJ_dd_execution_modifier_desc:0 "軍法によって部隊を引き締め、威令が軍中に行き渡っている。"
 WJ_dd_public_crime_modifier:0 "軍法違反"
 WJ_dd_public_crime_modifier_desc:0 "この人物はかつて軍法を犯し、罪名が記録されており、まだ赦免されていない。"

 # 来源：localization/simp_chinese/WJ_kaoke_duties_l_simp_chinese.yml
 wj_kaoke_duties_boundaries_modifier:0 "田界清明"
 wj_kaoke_duties_boundaries_modifier_desc:0 "古い証文と田界が公正に査定され、郷民は官府が公道を守れると再び信じるようになった。"
 wj_kaoke_duties_exactions_modifier:0 "苛斂が民を傷つける"
 wj_kaoke_duties_exactions_modifier_desc:0 "官府が税糧・田訴・差役にかこつけて私利を貪り、郷民は官府に恨みを抱いている。"
 wj_kaoke_duties_post_roads_modifier:0 "駅役秩序あり"
 wj_kaoke_duties_post_roads_modifier_desc:0 "輸送と差役の割り当てが適切で、伝舎は円滑に回り、農家も耕作の時を守ることができた。"
 wj_kaoke_duties_relief_modifier:0 "災害を査定し戸を救済"
 wj_kaoke_duties_relief_modifier_desc:0 "地方官が被災状況を確かめ、被災戸を余計な割り当てから免れさせたため、郷里は安心して耕作できる。"

 # 来源：localization/simp_chinese/WJ_kaoke_l_simp_chinese.yml
 WJ_kaoke_bad_modifier:0 "考課劣等"
 WJ_kaoke_bad_modifier_desc:0 "考課簿の記載では、失点が得点を上回っている。有司はその俸給を削り、吏治を正すよう命じた。"
 WJ_kaoke_poor_modifier:0 "考課下等"
 WJ_kaoke_poor_modifier_desc:0 "有司は政務の処理が行き届いていないと責め、しばらく賢望と俸給を抑えて今後の働きを見守ることにした。"

