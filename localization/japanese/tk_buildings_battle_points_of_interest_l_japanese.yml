 #####三国新增建筑战场本地化

 BattlePoIHistoricalNameZhuoLu: "涿鹿の戦い"
 BattlePoIHistoricalDescZhuoLu: "#emp 勝者：黄帝\n敗者：蚩尤\n日付：黄帝の時代#!\n#weak 蚩尤が乱を起こして帝命に従わなかったため、黄帝は諸侯の軍を徴発し、涿鹿の野で蚩尤と戦い、ついにこれを捕らえて殺した。\n\n諸侯はこれにより黄帝を天子として共に尊び、神農氏に代わって天下を治めさせた。#!"
 BattlePoIHistoricalNameMingTiao: "鳴条の戦い"
 BattlePoIHistoricalDescMingTiao: "#emp 勝者：商の湯王\n敗者：夏の桀王\n日付：夏桀の末年#!\n#weak 夏の桀王は荒淫無道で、民は怨んで背いた。商の湯王は伊尹の補佐を得て徳を修め仁を行い、諸侯は次々と帰服した。湯王は兵を挙げて桀を討ち、両軍は鳴条の野で戦い、夏の軍は大敗した。\n\n桀は南巣へ逃れ、湯王はついに夏に代わって天下を治めた。#!"
 BattlePoIHistoricalNameChangShao: "長勺の戦い"
 BattlePoIHistoricalDescChangShao: "#emp 勝者：魯の荘公\n敗者：斉の桓公\n日付：魯の荘公十年#!\n#weak 斉の桓公は即位して間もなく、魯がかつて公子糾の位争いを助けたことから、翌年兵を起こして魯を討った。魯の曹劌が荘公に謁見を願い、軍に随って長勺に至ると、斉軍が三度太鼓を打ち終えるのを待ってから進撃し、斉軍は敗れた。\n\n曹劌は言った。「それ戦いは勇気なり。一鼓して気を作し、再びして衰え、三たびして竭く」。この戦いは弱をもって強に勝ったものとして、兵家に長く称えられてきた。#!"
 BattlePoIHistoricalNameChangPing: "長平の戦い"
 BattlePoIHistoricalDescChangPing: "#emp 勝者：秦の昭王\n敗者：趙の孝成王\n日付：秦の昭王四十七年#!\n#weak 秦が韓の上党を攻めると、上党の守である馮亭は郡を挙げて趙に降り、これにより秦趙両軍は長平で対峙した。趙将廉頗は塁を固めて出なかったが、趙王は秦の反間の計にかかり、趙括をこれに代えた。趙括は軽々しく出撃して戦いを求め、白起に糧道を断たれて幾重にも包囲された。\n\n趙兵は糧が尽きること四十六日、ついに秦に降ったが、四十余万人がことごとく生き埋めにされ、趙はこれより二度と立ち直れなかった。#!"
 BattlePoIHistoricalNameGaiXia: "垓下の戦い"
 BattlePoIHistoricalDescGaiXia: "#emp 勝者：漢王\n敗者：項羽\n日付：漢五年#!\n#weak 楚漢は鴻溝を境とすることを約し、項羽は兵を率いて東へ帰った。張良と陳平は楚軍の疲弊に乗じて追撃するよう漢王に説き、漢王は韓信・彭越らの軍と合流して、項羽を垓下に幾重にも包囲した。\n\n項羽は敗れて烏江で自刎し、天下はこれにより漢に帰した。#!"
 BattlePoIHistoricalNameKunYang: "昆陽の戦い"
 BattlePoIHistoricalDescKunYang: "#emp 勝者：漢軍\n敗者：王莽軍\n日付：更始元年#!\n#weak 王莽は大司空王邑と司徒王尋に大軍を率いさせて昆陽を包囲させ、城中の諸将は恐れおののいて四散しようとした。光武皇帝は当時偏将軍であったが、諸将に固守を強く説き、自らは包囲を突破して城を出て援軍を集めた。\n\n援軍が至ると、光武は自ら決死の士を率いて敵陣に突撃し、城中の守備兵も鬨の声を上げて打って出た。内外から挟撃されて王尋は戦死し、莽軍は大いに潰えた。天下はこれにより次々と呼応し、王莽はほどなく滅んだ。#!"


