###战术###

embattle_volly_tactic_modifier:0 "斉射戦術"
embattle_volly_tactic_modifier_desc:0 "この軍団は雨のごとく斉射し、戦う前から敵の鋭気を挫く。"
embattle_charge_tactic_modifier:0 "突撃戦術"
embattle_charge_tactic_modifier_desc:0 "この軍団は怒涛のごとく突撃し、生死を顧みない。"
embattle_stand_fast_tactic_modifier:0 "固守戦術"
embattle_stand_fast_tactic_modifier_desc:0 "この軍団は山のごとくそびえて固守し、一歩も譲らない。"
embattle_advance_tactic_modifier:0 "前進戦術"
embattle_advance_tactic_modifier_desc:0 "この軍団は鉄の奔流のごとく前進し、幾重にも敵を圧迫する。"
embattle_harass_tactic_modifier:0 "撹乱戦術"
embattle_harass_tactic_modifier_desc:0 "この軍団は這う蛇のごとく撹乱し、神出鬼没である。"

embattle_tactic_diversity_modifier:0 "戦術の多様性"
embattle_tactic_diversity_modifier_desc:0 "この指揮官の戦術は多彩である。"
embattle_tactic_counter_modifier:0 "戦術を封じられた"
embattle_tactic_counter_modifier_desc:0 "この指揮官の戦術は敵に封じられている。"

embattle_potshots_tactic_modifier:0 "乱射戦術"
embattle_potshots_tactic_modifier_desc:0 "この軍団は盲いた射手のごとく矢を乱れ撃ち、まるで統制がない。"
embattle_reckless_charge_tactic_modifier:0 "無謀な突撃戦術"
embattle_reckless_charge_tactic_modifier_desc:0 "この軍団は制御を失った猛獣のごとく、敵を傷つけると同時に自らも傷つく。"
embattle_confused_orders_tactic_modifier:0 "不可解な軍令戦術"
embattle_confused_orders_tactic_modifier_desc:0 "この軍団は頭を失った龍の群れのごとく、各々ばらばらに戦う。"
embattle_timid_advance_tactic_modifier:0 "臆病な前進戦術"
embattle_timid_advance_tactic_modifier_desc:0 "この軍団は薄氷を踏むがごとく、進退の拠り所を失っている。"
embattle_disorganised_harass_tactic_modifier:0 "無秩序な撹乱戦術"
embattle_disorganised_harass_tactic_modifier_desc:0 "この軍団は巣を出た蟻の群れのごとく、無秩序に撹乱する。"

