 # ══════════════════════════════════════════════════════════════════
 # 汉晋春秋 · 兵戈志 —— 禁军兵士与重建决议 本地化（hjbz_）
 #
 # 计 18 条：兵士 4×2（名 + 描述）＋ 决议 2×5（名/述/提示/确认/效果）
 # 文风：参《后汉书》—— 用典取自《百官志》《光武帝纪》《皇后纪》
 # ══════════════════════════════════════════════════════════════════

 # ────────────────────── 兵士 · 羽林 ──────────────────────

 hjbz_yulin_wei:0 "羽林衛"
 hjbz_yulin_wei_flavor:0 "#F 羽林とは「国の羽翼となり、林のごとく盛んなり」の義を取ったものである。漢の武帝は初め建章営騎を置き、のちに羽林と改名した。また従軍して戦死した者の子孫を羽林で養い、五兵を教えて羽林孤児と号した。彼らは重甲を身にまとい、盾を持って前進し、方陣を組む。駆け回ることを能とせず、動かぬことを功とする。#!"

 hjbz_yulin_qi:0 "羽林騎"
 hjbz_yulin_qi_flavor:0 "#F 羽林にはもとより騎兵があり、郎官と宿衛を分担した。その兵はみな良家の子から選ばれ、材力は人に過ぎ、鞍馬に習熟しつつも宮禁を離れない。平時は輿輦に侍従し、事あれば中軍の翼となる。馬に重甲は必要としないが、進退には節度があり、ただ迅速さだけで勢いを取るものではない。#!"

 # ──────────────────── 兵士 · 执金吾 ────────────────────

 hjbz_zhijinwu_jishi:0 "執金吾の持戟士"
 hjbz_zhijinwu_jishi_flavor:0 "#F 執金吾は宮外の警備を掌り、非常の水火の事を司り、月に三たび宮外を巡行し、兼ねて兵器を主る。その属官には持戟の士があり、道の脇に列なって非常に備え、都邑を粛然とさせる。この者たちは野戦の兵ではないが、京師に事あるときは、戟を持って街に立ちはだかり、往来の者に横暴を許さない。#!"

 hjbz_zhijinwu_tiqi:0 "執金吾の緹騎"
 hjbz_zhijinwu_tiqi_flavor:0 "#F 緹とは丹黄色のことである。執金吾の属には緹騎二百人があり、その服色は特異で他の軍と区別された。光武帝は無名の頃、「仕官するならば執金吾」と嘆じたという。思うに、その輿服や先導・随従は道を光り輝かせ、群僚の中で最も壮麗であった。しかしその職務は巡察して暴を禁ずることにあり、鋒を挫き陣を陥れることにはない。#!"

 # ────────────── 决议一 · 重建羽林军 ──────────────

 hjbz_rebuild_yulin_decision:0 "羽林軍の再建"
 hjbz_rebuild_yulin_decision_desc:0 "羽林の設置は、本来宮禁を宿衛し、非常に備えるためのものである。武帝は従軍して戦死した者の子孫を取り立てて養い、五兵を教え、その家業を失わせぬようにした。宣帝・元帝以降、ついに禁中の精鋭となった。今その名はなお残るが、その制は久しく廃れ、宿衛の職は他の軍に委ねられることもある。これは根本を重んずる道ではない。\n\n臣は聞く、国を治める者には必ず羽翼があり、それはあたかも林に木があって、互いに支え合ってこそ盛んになるがごとし、と。もしその旧制を復し、良家の子のうち材力人に過ぐる者を選び、二軍に分けるならば――一は重甲をまとい盾を持ち、方陣を組んで宮闕を守り、一は鞍馬に習い騎射に長じ、輿輦に侍従して馳逐に備える。両者が並び立てば、中軍には恃むところができ、京師の衆も軽々しく動こうとはしないでしょう。\n\nしかしこれは一枚の命令で成し遂げられるものではありません。軍籍・甲械・給養はみな常法を備えねばならず、これを主る者にも人を得なければなりません。願わくは陛下、まずその制を立て、しかる後にゆっくりとその人員を議されますよう。"

 hjbz_rebuild_yulin_decision_tooltip:0 "羽林軍の制度を再建する。制度を立てた後、#Y 羽林衛#!と#Y 羽林騎#!を募集できる。\n\n#EMP まずその権柄を備えねばならない：#!中華覇権の主であるうえに、権力を自らに集める必要がある――天朝官僚制は「限定的行政」以上、軍制は「中外分掌制」以上でなければならず、威信3段階、影響力3段階、正統性7段階のいずれも欠かせない。\n\nさらに内外に隙があってはならない：有力な封臣はみな誠意を示し（好感度がいずれも50超）、司隷の権柄が自らの手にあるか、その心を得ていなければならない。共同統治者と権柄を分かち合っている場合は、その者が忠誠を違えないか、権力の天秤が偏っていないことが必要である。"

 hjbz_rebuild_yulin_decision_confirm:0 "国庫500と威信1000を納めて制度を立てる。この決断では直ちに軍団は得られない。"
 hjbz_rebuild_yulin_decision_effect:0 "羽林軍の制度が立てられた。今後、羽林衛と羽林騎を募集できる。"

 # ────────────── 决议二 · 重建执金吾 ──────────────

 hjbz_rebuild_zhijinwu_decision:0 "執金吾の再建"
 hjbz_rebuild_zhijinwu_decision_desc:0 "執金吾一人、中二千石。宮外の警備を掌り、非常の水火の事を司る。月に三たび宮外を巡行し、また兵器を主る。その属には緹騎二百人、持戟五百二十人があり、輿服や先導・随従は道を光り輝かせた。光武帝が無名の頃、「仕官するならば執金吾」と嘆じたことからも、その盛んなさまが知れよう。\n\n京師がたびたび移り変わってより、この官は空名を残すのみとなり、宮外の警備は統べる所を失った。そもそも宮闕の威厳は、垣の高さにあるのではなく、巡行する者がおり、非常に備えがあることにある。もしその職を再び置き、材力ある士を選んで戟を持たせ道に列なせ、別に緹騎をもって街路を巡察させるならば、火の警報も里巷の奸悪も、みな帰する所を得るであろう。\n\nしかしこの制度は、遠方の者が遥かに兼領できるものではない。必ず都城の内、輦轂の下にあってこそ施行できる。洛陽・長安はいずれもかつての帝都であり、その居所を見てこれを建てるべきである。"

 hjbz_rebuild_zhijinwu_decision_tooltip:0 "執金吾の制度を再建する。制度を立てた後、#Y 執金吾の持戟士#!と#Y 執金吾の緹騎#!を募集できる。\n\n#EMP まずその根本を固めねばならない：#!中華覇権の主であるうえに、#Y 洛陽#!または#Y 長安#!を都とし、かつ都城の統制度が80を超えていなければならない。威信2段階、影響力2段階のいずれも欠かせない。\n\nさらに権柄が自らの手になければならない：共同統治者と権柄を分かち合っている場合は、その者が忠誠を違えないか、権力の天秤が偏っていないことが必要である。"
 hjbz_rebuild_zhijinwu_decision_confirm:0 "金200と威信300を納めて制度を立てる。この決断では直ちに軍団は得られない。"
 hjbz_rebuild_zhijinwu_decision_effect:0 "執金吾の制度が立てられた。今後、執金吾の持戟士と執金吾の緹騎を募集できる。"
