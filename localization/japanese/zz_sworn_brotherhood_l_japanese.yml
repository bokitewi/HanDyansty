 # Interaction & Basic Strings #
 sworn_brotherhood_interaction:0 "金蘭の契りを結ぶ"
 sworn_brotherhood_interaction_desc:0 "香を焚いて天に告げ、相手と義兄弟の契りを結ぶ。以後、喜びも憂いも共にし、苦難にあっては互いに助け合う。"
 SWORN_BROTHERHOOD_NORMAL:0 "義兄弟の契りを提案する"
 opinion_sworn_brotherhood:0 "金蘭の誼"
 sworn_brotherhood_modifier:0 "神聖な盟約の拘束"
 broke_sworn_brotherhood_oath:0 "誓いを破りし者"
 friend_relation_effect_actor:0 "[recipient.GetTitledFirstName]の義兄弟になる"
 friend_relation_effect_recipient:0 "あなたの義兄弟になる"
 
 # AI Traits
 AI_TRAIT_LOYAL:0 "忠実"
 AI_TRAIT_JUST:0 "公正"
 AI_TRAIT_HONEST:0 "正直"
 AI_TRAIT_BRAVE:0 "勇敢"
 AI_TRAIT_DECEITFUL:0 "狡猾"
 AI_TRAIT_ARBITRARY:0 "気まぐれ"
 AI_TRAIT_AMBITIOUS:0 "野心家"
 AI_TRAIT_PARANOID:0 "猜疑心が強い"
 AI_STRATEGIC_NEED:0 "現在の状況では信頼できる同盟者が必要"
 
 # Peach Garden Oath Ceremony
 sworn_brotherhood_events.0001.t:0 "金蘭の契り"
 
 # Dynamic Event Descriptions
 sworn_brotherhood_events.0001.desc.intro:0 "香案はすでに整えられ、酒も満たされた。あなたは[blood_bro.GetTitledFirstName]と向かい合って立ち、周りの者たちの談笑も次第に止んでいった。普段呼び慣れた呼び名が、今日に限って急に重々しさを帯びている。\n\n"
 sworn_brotherhood_events.0001.desc.outro:0 "\n\n誰かがあなたの手に酒杯を渡した。誓いの言葉に天下の美辞麗句を尽くす必要はない。最も守りたい一句を選び、これからはそれに従って行えばよいのだ。"
 sworn_brotherhood_events.0001.desc.just:0 "今後いかに互いに接するかを語り合ううち、話はついに「信義」の二字に落ち着いた。得意な時だけ兄弟と呼び合い、利害の瀬戸際で手のひらを返すならば、今日の礼がいかに整っていても、ただ物笑いの種を増やすだけである。"
 sworn_brotherhood_events.0001.desc.brave:0 "これからの危険について、あなたたちは誰も目をそらさなかった。武勇は人を前へ進ませるが、傍らの者が災難に遭った時になお前へ進めるかどうかは、また別の話である。今日のこの一杯は、後者のために飲むべきだ。"
 sworn_brotherhood_events.0001.desc.loyal:0 "これまでの付き合いで、あなたたちにはすでに託し合える信頼がある。あなたはこの信頼を幾言かの社交辞令の中だけに留めたくはない――いつか知らせが乱れ、利害が争われる時にも、今日面と向かって約したことを覚えていなければならない。"
 sworn_brotherhood_events.0001.desc.ambitious:0 "あなたたちはどちらも目の前の日々を守るだけでは満足せず、将来を語れば、それぞれに成し遂げたい大事がある。志が近いことは人を引き寄せるが、求めるものが近いゆえに反目しないためにはどうすべきかこそ、今日厳かに誓う価値がある。"
 sworn_brotherhood_events.0001.desc.generic:0 "あなたたちは何事も心を同じくするわけではなく、どこもかしこも似ているわけでもない。それでも付き合ってきた中で、互いに軽々しく捨てたくない情がある。今日兄弟と呼び合おうとするのは、この情を普通の付き合いより重んじるためである。"
 
 # Oath Options
 sworn_brotherhood_events.0001.a:0 "信義を第一とし、皇天后土の照覧を仰ぐ。"
 sworn_brotherhood_events.0001.b:0 "忠をもって託し合い、生死を共にして背かぬ。"
 sworn_brotherhood_events.0001.c:0 "共に危難に赴き、勇をもって誓う。"
 sworn_brotherhood_events.0001.d:0 "一杯の薄酒で、この心を明かすに足る。"
 
 # Oath Tooltips
 
 # Follow-up Event
 sworn_brotherhood_events.0002.t:0 "金蘭の契りの後"
 sworn_brotherhood_events.0002.desc:0 "あなたが[blood_bro.GetTitledFirstName]と兄弟の契りを結んでから、早くも数か月が過ぎた。あの日の酒礼の細かなことは次第にぼやけてきたが、真剣に交わしたいくつかの言葉は、今後の付き合いを思うたびに再び胸に浮かんでくる。\n\n誓いを立てたからといって、以後は心を砕いて保たなくてよいわけではない。近頃あなたたちは再び顔を合わせた。席上、あの日の誓詞を持ち出す者もいれば、苦難を共にしてこそ真心が分かると言う者もおり、情があるのだから今さら仰々しくする必要もないと笑う者もいた。\n\nあなたは向かいの見慣れた顔を見つめた。これからいかに接し合うかは、結局あなたたち自身が決めることである。"

 sworn_brotherhood_events.0002.a:0 "先の誓いを改めて立て、互いに忠を尽くす。"
 sworn_brotherhood_events.0002.b:0 "再び生死を約し、共に危難に赴く。"
 sworn_brotherhood_events.0002.c:0 "旧誼を心に刻み、金蘭の契りを厚くする。"
 sworn_brotherhood_events.0002.d:0 "情はすでに明らか、虚礼は無用。"

 sworn_brotherhood_strengthened_tt:0 "我らの義兄弟の情誼は、苦難を共にしてさらに堅固となった。"
 
 # Modifier Names & Descriptions
 brotherhood_loyalty_modifier:0 "忠義の絆"
 brotherhood_loyalty_modifier_desc:0 "この人物は義兄弟と忠をもって託し合い、その誓いは金石のごとく揺るがない。"
 
 brotherhood_ferocity_modifier:0 "勇烈なる兄弟"  
 brotherhood_ferocity_modifier_desc:0 "この人物は義兄弟と勇をもって誓い合っており、その兄弟を害する者があれば、必ずや身を顧みず立ち向かう。"
 
 tested_brotherhood_modifier:0 "試練を経た情誼"
 tested_brotherhood_modifier_desc:0 "歳月を経て、この金蘭の誼はいっそう深まった。"
 
 brotherhood_ambition_modifier:0 "雄心の盟"
 brotherhood_ambition_modifier_desc:0 "血盟の兄弟と雄心の誓いを立て、大業を成すために手を結んだ。"
 
 # Oath Breaking Penalties
 oath_breaker_modifier:0 "誓いを破りし者"
 oath_breaker_modifier_desc:0 "この人物は金蘭の誓いに背き、世の人々に軽蔑され、もはや人の信を得がたい。"
 
 dishonorable_modifier:0 "信なき輩"
 dishonorable_modifier_desc:0 "この人物は義に背き盟を裏切り、その不信の名は四方に広まっている。"
 
 # Oath-Breaking Events
 sworn_brotherhood_events.0003.t:0 "兄弟の背誓"
 sworn_brotherhood_events.0003.desc.intro:0 "[betrayer.GetName]が兄弟の誓いに背いたという知らせが届いた。あなたは使者の話を聞き終えると、もう一度言わせた。それが伝え間違いだと思い込む言い訳すら見つからなくなるまで。\n\n"
 sworn_brotherhood_events.0003.desc.just_betrayed:0 "あなたが最も許せないのは、まさにあの日信義をもって誓い合いながら、今日それを反故にしたことである。今後、他人が厳かに誓うのを聞いても、以前のように何の疑いも抱かずにいることは難しいだろう。"
 sworn_brotherhood_events.0003.desc.wrathful_betrayed:0 "怒りが一気にこみ上げ、あなたは思わずその場で立ち上がりかけた。あなたを最もよく知る者こそ、刃をどこに振り下ろすべきかを最もよく知っている――それゆえこの裏切りは、普通の敵意よりも飲み込みがたい。"
 sworn_brotherhood_events.0003.desc.cynical_betrayed:0 "あなたは誓いの重みを疑ったことがないわけではない。ただ、目の前のこの誓いだけは例外だと思っていた。今やそのささやかな望みさえ、[betrayer.GetSheHe]自身の手で打ち砕かれた。"
 sworn_brotherhood_events.0003.desc.generic_betrayed:0 "あなたはかつて向かい合って杯を挙げた時のことを思い出し、その瞬間と目の前の知らせを並べてみようとしたが、どうしても元の姿には戻らなかった。"
 sworn_brotherhood_events.0003.desc.outro:0 "\n\n使者はまだあなたが口を開くのを待っている。古い誓いはもはや[betrayer.GetSheHe]を縛れないが、あなたがどう応じるかは、なお他人があなたをどう見るか、そしてあなたが今後どう人を信じるかを決めるだろう。"
 sworn_brotherhood_events.0003.a:0 "誓いに背いた輩のことは、天下に知らしめねばならぬ。"
 sworn_brotherhood_events.0003.b:0 "我に背いた以上、仇敵である。"
 sworn_brotherhood_events.0003.c:0 "その人となりを見極めたまで。我が名は損なわれぬ。"
 sworn_brotherhood_events.0003.d:0 "恩も義も断ち切り、以後は赤の他人だ。"
 
 # Betrayer Event
 sworn_brotherhood_events.0004.t:0 "破れた誓い"
 sworn_brotherhood_events.0004.desc:0 "あなたは[actor.GetName]と立てた兄弟の誓いに背いた。当時どんな理由があったにせよ、信を失った汚名は、あなた一人が背負うことになる。"
 sworn_brotherhood_events.0004.a:0 "裏切りを悔やむ"
 sworn_brotherhood_events.0004.b:0 "野心を抱く"
 
# Opinion Modifiers & Tooltips
 hd_sworn_brotherhood_declined:0 "我が義兄弟の申し出を拒んだ"
 opinion_betrayed_me:0 "私を裏切った"
 opinion_broken_oath_justice:0 "神聖な盟約を裏切った"
 opinion_expected_betrayal:0 "その奸計を予期していた"
 stress_broken_oath_tt:0 "義兄弟の裏切りが、あなたの心を揺るがした。"
 stress_vengeful_rage_tt:0 "正義の怒りがあなたを呑み込むが、平穏はもたらさない。"
 
 # Enhanced Follow-up Event Options
