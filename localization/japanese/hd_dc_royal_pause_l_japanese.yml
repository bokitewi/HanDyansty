l_japanese:
 hd_dc_support.0008.d: "君はかつて我に一つの約束を負うた。一年の罷兵をもって償われよ。"
 hd_dc_support.0008.d.tt: "[hd_dc_support_claimant.GetTitledFirstName]の派閥は一年間兵を動かさねばならない。最後通牒を突きつけることも、兵を挙げることもできない。"
 hd_dc_support.0308.t: "兵諫をしばし収める"
 hd_dc_support.0308.desc: "往来の書簡の傍らに、一年の期限が書き添えられた。[hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName]は[hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]がかつて負った借りを持ち出し、この一年の按兵不動を引き換えに得た。挙兵の文書はひとまず差し止められた。\n\n派閥の者たちは散ってはおらず、胸中の不満も消えてはいない。一年後、この件は再び持ち出されるだろう。ただ当面、この派閥がこれを理由に刀兵を動かすことはない。"
 hd_dc_support.0308.a: "一年を期限とする。しかと心得た。"
 hd_dc_support.paused_demand: "緩兵の約がある以上、この書はひとまず留め置き、発しはせぬ。"
