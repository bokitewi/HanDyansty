l_japanese:
 # 天朝循环·时代特色：新朝征服期套件（圈地 / 天子改文化 / 汉化改制 / 保俗 / 前朝遗民 / 前朝复辟 / 本族叛乱）

 # ---------- 圈地（打压汉人） ----------
 hd_dc_con_quandi_decision: "圏地"
 hd_dc_con_quandi_decision_desc: "漢の地の沃土を、南人だけに独占させておけようか？　一州を選び、そこにある天子直轄の漢人の県をすべて本族の功臣に賜り、従龍の労に報いる。\n\n本族の封臣はこれを喜ぶだろうが、土地を失った漢人は必ずや怨嗟の声を上げるだろう。"
 hd_dc_con_quandi_decision_tooltip: "一州の漢人の県を本族の功臣に賞として与える"
 hd_dc_con_quandi_decision_confirm: "土地を囲い込んで功臣に賜る"
 hd_dc_con_quandi_land_tt: "都城以外に少なくとも1つの漢人（中華伝統文化）の県を直轄している"
 hd_dc_con_quandi_decision_effect_tt: "一州の地を選び、そこにあるあなた直轄の漢人の県（都城を除く）をすべて本族の功臣一人に賜る。本族の将兵は歓喜し、土地を失った漢民は怨嗟の声を上げる。"
 hd_dc_con_quandi_county_modifier: "圏地の怨み"
 hd_dc_con_quandi_county_modifier_desc: "祖先伝来の財産を奪われて胡人の功臣への褒賞とされ、この地の漢民は恨みを募らせている。"
 hd_dc_con_quandi_native_opinion: "圏地で功に報いた"
 hd_dc_con_quandi_grantee_opinion: "圏地を賜った"

 # ---------- 天子改文化 ----------
 hd_dc_con_hybrid_culture_decision: "胡漢合流"
 hd_dc_con_hybrid_culture_decision_desc: "中原に入って久しく、旧俗と漢制はとうに融け合っている。本族の文化と都城の漢文化を合わせて新たな文化を立て、中華の統を継ぐ。"
 hd_dc_con_hybrid_culture_decision_tooltip: "胡漢混合文化を創設する"
 hd_dc_con_hybrid_culture_decision_confirm: "胡漢一家"
 hd_dc_con_capital_han_tt: "都城のある県が漢人（中華伝統）文化である"
 hd_dc_con_can_hybridize_tt: "都城の文化と混合できる（文化混合機能と対応するゲームルールを有効にする必要がある）"
 hd_dc_con_hybrid_heritage_tt: "新たな文化は中華の統を継ぐ。あなた直轄の本族の県、および同じく宮廷にいる配偶者と子女は、あわせて新たな風俗に改める"

 # ---------- 汉化改制 ----------
 hd_dc_con_sinicization_decision: "漢化改制"
 hd_dc_con_sinicization_decision_desc: "夏をもって夷を変ず：遷都・易服・改姓・胡語禁止によって旧俗をことごとく改め、漢制を行う。改制はひとたび頒布されれば段階的に推し進められ、一歩ごとに本族の貴族の不満、さらには兵変さえも引き起こす。"
 hd_dc_con_sinicization_decision_tooltip: "漢化改制を頒布する"
 hd_dc_con_sinicization_decision_confirm: "詔して漢化を行う"
 hd_dc_con_sinicization_decision_effect_tt: "遷都・易服・改姓・胡語禁止の四つの詔令が2～3年おきに順次頒布され、各段階で中止できる。本族の勲貴は一歩ごとに怨みを募らせ、#EMP 兵を挙げて乱を起こすことさえある#!。一方で漢人の封臣は日に日に心を寄せる。四つがすべて成れば、あなたは胡漢合流の風俗に改める。\n一歩推し進めるごとに："
 hd_dc_con_native_vassals_tt: "本族の各[vassal|E]"
 hd_dc_con_han_vassals_tt: "漢人の各[vassal|E]"
 hd_dc_con_sinicization_active_tt: "漢化改制がまだ施行されていない"
 hd_dc_con_baosu_blocks_tt: "「保俗」を頒布したことがない"
 hd_dc_con_sinicization_abandoned_tt: "10年以内に漢化改制を廃止したことがない"
 hd_dc_con_native_revolt_risk_tt: "本族のうち怨みを抱く最強の封臣が兵を挙げて乱を起こす"
 hd_dc_con_capital_already_han_tt: "都城はすでに漢の地にあり、遷都の必要はない"
 hd_dc_con_sinicization_native_opinion: "漢化改制"
 hd_dc_con_sinicization_han_opinion: "漢化改制"
 hd_dc_con_yifu_modifier: "易服"
 hd_dc_con_yifu_modifier_desc: "天子は漢の衣冠に改め、華夏の正統を示している。"

 # ---------- 保俗 ----------
 hd_dc_con_baosu_decision: "保俗"
 hd_dc_con_baosu_decision_desc: "国の根本は本族の弓馬にある。祖宗の旧俗を固く守り、本族の将兵を厚遇すれば、漢人の不満など顧慮するに足らぬ。"
 hd_dc_con_baosu_decision_tooltip: "本族の旧俗を保つ"
 hd_dc_con_baosu_decision_confirm: "祖制を謹んで守る"
 hd_dc_con_baosu_decision_effect_tt: "20年間祖制を謹守し、漢化を議さない："
 hd_dc_con_sinicization_blocks_tt: "漢化改制を施行したことがない"
 hd_dc_con_baosu_active_tt: "「保俗」が施行中でない"
 hd_dc_con_baosu_levy_modifier: "保俗"
 hd_dc_con_baosu_levy_modifier_desc: "天子が祖制を謹守し本族を厚遇しているため、一族の子弟は勇んで従軍している。"
 hd_dc_con_baosu_han_opinion: "保俗して漢を軽んじた"

 # ---------- 前朝遗民 ----------
 hd_dc_con_watched_tt: "この人物は今後長年にわたりあなたの耳目の下に置かれ、密かに事を起こすことは難しくなる。"
 hd_dc_con_remnant_honored_opinion: "前王朝の宗室を優遇した"
 hd_dc_con_remnant_honored_han_opinion: "前王朝の遺民を優遇した"
 hd_dc_con_remnant_killed_han_opinion: "前王朝の宗室を誅殺した"

 # ---------- 事件：圈地 ----------
 hd_dc_con.0100.t: "圏地"
 hd_dc_con.0100.desc: "従龍の諸将はしきりに進言する。中原の膏腴の地こそ功臣に分け与えるべきだ。田畑の漢民については、追い出すも使役するも、すべて新たな主の思うがままである、と。\n\nどの州の地を囲い込むべきか？"
 hd_dc_con.0100.a: "[hd_dc_con_slot_1.GetName]の地を囲い込む"
 hd_dc_con.0100.b: "[hd_dc_con_slot_2.GetName]の地を囲い込む"
 hd_dc_con.0100.c: "[hd_dc_con_slot_3.GetName]の地を囲い込む"
 hd_dc_con.0100.d: "[hd_dc_con_slot_4.GetName]の地を囲い込む"
 hd_dc_con.0100.e: "ひとまず取りやめる"

 # ---------- 事件：汉化改制 ----------
 hd_dc_con.0201.t: "漢化改制：遷都"
 hd_dc_con.0201.desc: "旧都は片隅に偏り、風俗は粗野で、天下を経営する場所ではない。朝議は漢の地の中心へ遷都し、中原の士民に親しもうと決した。本族の勲貴は故地を離れがたく、人々の心は騒然としている。"
 hd_dc_con.0201.a: "遷都は必ず行わねばならない"
 hd_dc_con.0201.b: "衆意には逆らいがたい。議を取りやめ改制を止める"
 hd_dc_con.0202.t: "漢化改制：易服"
 hd_dc_con.0202.desc: "新都が定まると、朝野に漢の衣冠に改めるよう詔し、胡服の着用を禁じた。老臣たちはかつての袍服を撫でながら、黙して語らない。"
 hd_dc_con.0202.a: "衣冠が改まれば、人心も新たになる"
 hd_dc_con.0202.b: "易服の令を取りやめ、改制を止める"
 hd_dc_con.0203.t: "漢化改制：改姓"
 hd_dc_con.0203.desc: "宗室と勲貴の複姓の多くは部族の旧称に由来する。漢姓に改めるよう詔し、その門第を定めて、中原の士族と肩を並べさせる。"
 hd_dc_con.0203.a: "漢姓を頒布し、門第を定める"
 hd_dc_con.0203.b: "祖先の姓は改めがたい。改制を止める"
 hd_dc_con.0204.t: "漢化改制：胡語禁止"
 hd_dc_con.0204.desc: "最後の詔書：朝廷に仕える者は、もはや本族の言葉を用いてはならない。違反者は爵位を降し官を罷免する。この詔が下れば、改制は大功を成し遂げる。"
 hd_dc_con.0204.a: "北語を断ち、正音に一本化する"
 hd_dc_con.0204.b: "この令は行き過ぎだ。改制を止める"

 # ---------- 事件：前朝遗民 ----------
 hd_dc_con.0300.t: "前王朝の遺民"
 hd_dc_con.0300.desc: "前王朝の宗室である[hd_dc_con_remnant.GetShortUIName]はなお存命である。故国の遺民はその人を忘れられず、朝廷では議論が紛糾している。厚く優遇して漢人の心を収めるべきだと主張する者もいれば、厳しく監視すべきだと主張する者もいる。また、草を刈るなら根まで絶たねばならぬと低い声で言う者もいる。"
 hd_dc_con.0300.desc.landed: "\n\nこの人物は今なお封地を有しており、警戒しないわけにはいかない。"
 hd_dc_con.0300.desc.landless: "\n\nこの人物は今や流浪して寄る辺がない。厚遇して寛仁を示すにはちょうどよい。"
 hd_dc_con.0300.a: "前王朝の宗室を優遇した"
 hd_dc_con.0300.b: "厳しく監視する"
 hd_dc_con.0300.c: "根まで断ち切る"
