l_japanese:
 hd_dc_roy.0001.t: "宗廟の下、席次に差あり"
 hd_dc_roy.0001.desc: "礼官が席札を並べ終えたところで、[hd_dc_favored.GetTitledFirstName]が御座に最も近い一枚を押さえた。\n\n「臣は長年外地で奔走してまいりました。一席すら求められぬということはありますまい」[hd_dc_favored.GetSheHe]は押さえた手を放そうとしない。[hd_dc_displaced.GetTitledFirstName]は名簿をあなたの前に押しやり、もとの席次を指さした。「今日一席を動かせるなら、明日動かせぬものがありましょうか」\n\n二人ともあなたが口を開くのを待っている。帛の名簿に名を連ねる他の宗親たちも、その一言から自らの重みを推し量るであろう。"
 hd_dc_roy.0001.a: "宗親にはそれぞれの位がある。すべて旧例に従え。"
 hd_dc_roy.0001.b: "近き席は卿に与えよう。議事の折には朕の助けとなれ。"
 hd_dc_roy.0001.b.tt: "[hd_dc_favored.GetTitledFirstName]がこの約定を受け入れれば、他の宗親は恨みを抱かずにはいられないだろう："
 hd_dc_roy.0001.c: "朕の席次に、宗親が口を挟むことは許さぬ。"
 hd_dc_roy.0001.d: "宗中の長老に礼序を取り仕切ってもらう。"
 hd_dc_roy.0001.d.tt: "宗中の長老が出てくることを承諾すれば、あなたは謝礼を贈らねばならない。#EMP 長老が双方を心服させられるかどうかは、予測しがたい。#!"
 hd_dc_roy01_mediation_terms: "[hd_dc_proposer.GetTitledFirstName]は謹んで[hd_dc_recipient.GetTitledFirstName]に、宗中の長老としての尊位をもって旧名簿に従い礼序を取り仕切り、近き席を求める側に譲るよう説得することを請う。説得が成ろうと成るまいと、謝礼の三十金は必ず贈る。三か月以内に返答がなければ、この請いは取りやめとなる。"
 hd_dc_roy01_mediation_written_terms: "[hd_dc_recipient.GetTitledFirstName]より[hd_dc_proposer.GetTitledFirstName]への返書：喜んで取り仕切ろう。謝礼は約定どおりでよい。ただ、立会人、下した裁定、そして不服の者があればその名を、すべて宗族の名簿に記し、後世に明らかにしていただきたい。"
 hd_dc_roy.0101.mediation_success: "長老は古い名簿を広げ、当初定められた席次を一席ずつ指し示した。近き席を求めた宗親はなお言い争おうとしたが、最後まで聞くと、ついに手の中の席札を放した。\n\n礼官は裁定に従って名簿を並べ直し、立会人の名を書き留めた。謝礼の三十金は満額贈られ、争っていた二人もそれぞれ相手に礼をした。今回は、もう誰も争わなかった。"
 hd_dc_roy.0101.mediation_failure: "長老は古い名簿に従い一席ずつ裁定を下した。礼官が名簿をしまったとたん、近き席を求めた宗親が立ち上がった。「席次はそのとおり書けばよい。だが臣は承服いたしかねる」\n\n謝礼はすでに贈られ、裁定も名簿に書き込まれた。事は済んだが、争いはこれで収まりはしなかった。その不服の宗親の名は、名簿の末尾に別記された。"
 hd_dc_roy.0101.mediation_unpaid: "長老はすでに承諾していたが、謝礼は満額届けられなかった。礼官は文書を手に戻ってきて、それ以上進めようとはしなかった。\n\n名簿はもとのまま並んでおり、この調停はそのまま棚上げとなった。"
 hd_dc_roy.0101.mediation_cancelled: "調停は結局、裁定の段にまで至らなかった――長老からの返事がなかったのか、婉曲に辞退されたのか、あるいは今や表に出るのが憚られるのか。\n\n礼官は往来の書簡を封じてしまい込んだ。名簿には、ありもしなかった和解が書き加えられることはなかった。"
 hd_dc_roy.window_closed: "情勢が変わった。この件は改めて計らねばならない。"
 hd_dc_roy01_precedence_terms: "[hd_dc_proposer.GetTitledFirstName]は宗廟の首席を[hd_dc_recipient.GetTitledFirstName]に授け、他の宗親の席次は旧来のままとする。宗室の議事の書が届いた日から、[hd_dc_recipient.GetTitledFirstName]は三か月以内に名を記して回奏し、各支の請願をともに議すること。この席は兵権や俸禄には及ばず、京師へ移り住む必要もない。三か月以内に返答がなければ、この議は取りやめとなる。"
 hd_dc_roy01_precedence_guarantee: "[hd_dc_recipient.GetTitledFirstName]より[hd_dc_proposer.GetTitledFirstName]への返書：首席の賜り、謹んで拝受いたす。ただ、一年のうちはこの席を改めず、名簿も並べ直さぬよう願いたい。議事の書が届いた日には、三か月以内に名を記して回奏いたそう。兵権や俸禄は一切求めぬ。"
 hd_dc_roy.0101.t: "席札と返書"
 hd_dc_roy.0101.accepted: "使者が印の押された文書を机上に持ち帰った。礼官は約定どおりに席札を並べ直し、近き席のあの名は、すでに名簿に書き込まれた。\n\n名簿とともに送り出されたのは、各支の宗親への議事の招請状である。印はすべて揃った。この先注目すべきは、首席を得た者が約束どおり回奏するかどうかだ。"
 hd_dc_roy.0101.rejected: "文書が突き返されてきた。押印欄は依然として空白のままだ。使者はこう言伝を持ち帰った。「席と忠勤は、同じ紙に書くべきものではありませぬ」\n\n礼官は用意していた席札をしまい、旧名簿のとおりに議事の招請状を送り出した。近き席の主は変わらず、この約束も一分の支持すらもたらさなかった。"
 hd_dc_roy.0101.expired: "期限は過ぎ、返書の箱は空のままだ。礼官がまだ待つべきかと尋ねに来た。あなたは、ついに押印されることのなかったその文書をちらりと見やった。\n\nこの議はここで取りやめとなり、席札は旧名簿のとおりに並べられた。"
 hd_dc_roy.0101.invalidated: "礼官は近き席に関するあの文書を持ち帰ったが、名簿には手を付けなかった――当初議定した者たちのうち、ある者はもう議に赴けず、ある者はすでに失脚しており、この約定をもとのとおりに進めることはもはやできない。\n\n宗親たちの訴えはなおそこにあるが、古い文書はもう用をなさない。"
 hd_dc_roy.0101.a: "名簿に記しておけ。"
 hd_dc_roy.0102.t: "宗室議書"
 hd_dc_roy.0102.desc: "使者が一通の議書を届けてきた。表書きにはあなたの礼序が記されている。第[SCOPE.GetValue('hd_dc_invitation_rank')|0]席。宗室の名簿はすでに定まり、朝廷は各支の封賞と職任について、名を記した回奏を書くようあなたに求めている。\n\n今回は従者を連れて参内する必要はない。意見を紙に書きさえすれば、議題に加えられる。押印欄は、まだ空いている。"
 hd_dc_roy.0102.a: "紙と筆を持て。言うべきことは明白に書かねばならぬ。"
 hd_dc_roy.0102.a.tt: "近き席を求めた折に交わした約束は、これをもって果たされる。"
 hd_dc_roy.0102.b: "議書を封じて返す。これに印は押さぬ。"
 hd_dc_roy.0102.b.tt: "あなたはかつてこれを約して近き席を得たが、今やその言を違えようとしている。"
 hd_dc_ritual_fairness_opinion: "宗室の旧序の回復"
 hd_dc_ritual_disappointment_opinion: "近き席の請いが退けられた"
 hd_dc_ritual_command_opinion: "皇帝が礼序を裁定した"
 hd_dc_ritual_precedence_opinion: "近き席での偏重"
 hd_dc_royal_cooperation_opinion: "宗室の議論が抑え込まれた"
 hd_dc_royal_support_opinion: "帝位争いにおける立場"
