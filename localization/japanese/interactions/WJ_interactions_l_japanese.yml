 # 来源：localization/replace/simp_chinese/WJ_xiaolian_direct_qualification_l_simp_chinese.yml
 wj_request_xiaolian_interaction_desc:0 "相手に、あなた自身またはあなたの門下の男子一人を孝廉に推挙してもらい、仕官の道を開くよう求める。"
 wj_xiaolian_interaction_desc:0 "今年の察挙の枠を用いてこの人物を孝廉に推挙し、仕官の道を開く。要求が過大であれば、相手は辞退するかもしれない。"

 # 来源：localization/simp_chinese/WJ_conquest_l_simp_chinese.yml
 WJ_conquest_commission_interaction:0 "征討を指定"
 WJ_conquest_commission_interaction_desc:0 "都督[recipient.Custom('WJ_GetLinkedUIName')]に麾下を率いて隣接する境外の[duchy|E]を征討させ、得た地は朝廷に帰属させる。"

 # 来源：localization/simp_chinese/WJ_district_expansion_l_simp_chinese.yml
 wj_dd_petition_create_ai:0 "都督設置を上表"
 wj_dd_petition_create_ai_desc:0 "天子に上表し、あなたの領する王国を中核として都督区を設置するよう請う。"
 wj_dd_petition_create_player:0 "都督設置を上表"
 wj_dd_petition_create_player_desc:0 "天子に上表し、あなたの領する王国を中核として都督区を設置するよう請い、あわせて授けられる節を自ら願い出る。"
 wj_dd_petition_expand_ai:0 "管区拡張を上奏"
 wj_dd_petition_expand_ai_desc:0 "隣接し、まだ他の管区に属していない王国をあなたの都督区に編入するよう上表する。"
 wj_dd_petition_expand_player:0 "管区拡張を上奏"
 wj_dd_petition_expand_player_desc:0 "隣接し、まだ他の管区に属していない王国をあなたの都督区に編入するよう上表する。"
 wj_dd_qinwang_interaction:0 "都督に勤王を詔す"
 wj_dd_qinwang_interaction_desc:0 "この都督に詔して自ら麾下を率いて勤王させ、天子が主導する[wars|E]に参加させる。"

 # 来源：localization/simp_chinese/WJ_district_l_simp_chinese.yml
 wj_dd_create_interaction:0 "都督区を設置"
 wj_dd_create_interaction_desc:0 "この人物の領する王国を中核として都督区を設置し、旄節を授ける。"
 wj_dd_dissolve_interaction:0 "都督区を撤廃"
 wj_dd_dissolve_interaction_desc:0 "この都督区を廃止し、都督の旄節を回収する。本職と封土は変わらない。"
 wj_dd_manage_interaction:0 "都督区を調整"
 wj_dd_manage_interaction_desc:0 "本管区と境を接し、まだ他の管区に属していない王国の官員一人を都督区に編入する。"

 # 来源：localization/simp_chinese/WJ_district_orders_l_simp_chinese.yml
 wj_dd_command_interaction:0 "都督軍令を発布"
 wj_dd_command_interaction_desc:0 "旄節の権限により、本管区の官員に軍令を下す。"
 wj_dd_justice_detain_interaction:0 "軍法により拘禁"
 wj_dd_justice_detain_interaction_desc:0 "廷尉の職権により、軍法の罪を犯したこの人物を収監する。"
 wj_dd_pardon_interaction:0 "軍法の罪を特赦"
 wj_dd_pardon_interaction_desc:0 "この人物が犯した軍法の罪を赦免する。"
 wj_dd_request_aid_interaction:0 "都督に支援を要請"
 wj_dd_request_aid_interaction_desc:0 "本管区の都督に出兵を請い、あなたが主導する[war|E]に参加してもらう。"
 wj_dd_request_pardon_interaction:0 "軍法の特赦を請願"
 wj_dd_request_pardon_interaction_desc:0 "上書して、あなたが犯した軍法の罪の赦免を請う。天子に宛てた請願は、多くの場合廷尉に回されて処置される。"

 # 来源：localization/simp_chinese/WJ_district_ui_l_simp_chinese.yml
 wj_dd_adjust_jie_interaction:0 "旄節を改授"
 wj_dd_adjust_jie_interaction_desc:0 "軍政を総攬する権限により、この都督の持つ節を改めて定める。"
 wj_dd_promote_interaction:0 "都督に昇格"
 wj_dd_promote_interaction_desc:0 "この武官に本都督区を引き継がせ、新たに旄節を授ける。元の都督は旄節を失うが、引き続き管区内で職に留まる。"
 wj_dd_withdraw_interaction:0 "都督区から離脱"
 wj_dd_withdraw_interaction_desc:0 "この王国を都督区から外す。"

 # 来源：localization/simp_chinese/WJ_district_war_l_simp_chinese.yml
 wj_dd_deploy_aid_interaction:0 "管区の援軍を配置"
 wj_dd_deploy_aid_interaction_desc:0 "本管区の公爵級または王国級の武官一人を派遣し、この人物が主導する[war|E]に参加させる。"
 wj_dd_join_wars_01:0 "都督親征"
 wj_dd_join_wars_01_desc:0 "都督が自ら麾下を率い、この人物が主導する[war|E]に参加する。"

 # 来源：localization/simp_chinese/WJ_kaoke_central_l_simp_chinese.yml
 wj_kaoke_request_interaction:0 "考課の加点を請う"
 wj_kaoke_request_interaction_desc:0 "主管の長官に、今期の考課であなたのために口添えしてもらうよう頼む。"
 wj_kaoke_request_interaction_send:0 "承認を求める"

 # 来源：localization/simp_chinese/WJ_military_rank_l_simp_chinese.yml
 WJ_mr_propose:0 "授与する軍職を立案する"
 WJ_mr_propose_desc:0 "この武官のために軍職を立案する。天子、都督中外、王国の重将は直接授与できる。大将軍が立案したものは、上表して裁可を仰がねばならない。以前に提出していない草案も、引き続き立案できる。"
 WJ_mr_request:0 "軍職を奏請する"
 WJ_mr_request_desc:0 "望む軍職を選び、上表して上官の裁定を請う。以前に提出していない草案も、引き続き立案できる。"
 WJ_mr_submit:0 "軍職の奏請を提出する"
 WJ_mr_submit_desc:0 "[secondary_recipient.Custom('WJ_GetLinkedUIName')]のために[secondary_recipient.Custom('WJMRChoice')]を奏請する。原案どおりか改授かを裁定されたい。"

