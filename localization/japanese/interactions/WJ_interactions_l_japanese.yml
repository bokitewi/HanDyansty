 WJ_sili_arrest_capital_official_interaction:0 "在京官員を逮捕"
 WJ_sili_arrest_capital_official_interaction_desc:0 "司隷校尉は京師の百官を糾察する。逮捕の権限は、朝廷がまだ許していない。"
