l_japanese:
 hd_dc_support.0008.b: "家族と封地を保全する盟約なくして、命には応じられぬ。"
 hd_dc_support.0008.b.tt: "[hd_dc_support_claimant.GetTitledFirstName]があなたの家族と封地を保全する盟書に署名するならば："
 hd_dc_support.0208.t: "一枚の保全の約"
 hd_dc_support.0208.desc: "返書には兵馬の約束はなく、まず列挙されていたのは[hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName]が最も気がかりな事柄だった。自身、現在存命の近親、そしてその者たちが今持つ封地である。\n\n「これすら明言できぬというなら、どうして一家眷属を来たるべき封賞の一言に託せましょうか」\n\n相手はあなた自身に五年間の保証を求めている。後に生まれる子孫や新たに得る封地はこれに含まれない。もし本当に罪を犯した者がいれば、それは法に従って処置して構わない。"
 hd_dc_support.0208.a: "今日の名簿に基づき約を結ぶ。期限は五年。"
 hd_dc_support.0208.a.tt: "あなたは自らの名にかけて誓う。五年のうち、盟書に記された者とその封地を保全する、と。"
 hd_dc_support.0208.b: "この約は縛りがきつすぎる。お受けいたしかねる。"
 hd_dc_support.0408.t: "盟書の返答"
 hd_dc_support.0408.accepted: "[hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]は自ら盟書に署名した。あなたと近親の名、各人の名義の封地は、すべて署名の日の状況のままに一つ一つ記録され、五年の期限がここに始まった。\n\nこの盟書は、あなたがいずれかの派閥に加わったことを意味するものではなく、何らかの封賞が先払いされたわけでもない。今後約が守られるかどうかは、署名した者が実際にどう振る舞うか次第である。"
 hd_dc_support.0408.rejected: "[hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]は盟書を突き返し、この五年の責任を負うことを拒んだ。\n\nあなたはこれによっていずれかの派閥に加わったわけでもなく、何の利も得てはいない。このやり取りは、これで終わりである。"
 hd_dc_support.0408.a: "返書を謹んで収めておく。"
