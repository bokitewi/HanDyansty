l_japanese:
 hd_dc_request_royal_support_interaction: "帝位への支持を求める"
 hd_dc_request_royal_support_interaction_desc: "書状をしたため、謝礼を約束して、相手にあなたの請求権を公然と支持するよう求める。"
 hd_dc_support_reward_g1: "三十金を約束する"
 hd_dc_support_reward_g2: "百金を約束する"
 hd_dc_support_reward_g3: "三百金を約束する"
 hd_dc_support.0008.t: "君の助力を請う"
 hd_dc_support.0008.desc: "[hd_dc_support_claimant.GetTitledFirstName]の書状は単刀直入だった。家族の安否を問うた後、紙面には[hd_dc_support_claimant.GetHerHis]の大位に対する主張と、あなたに公然と加わってほしいという派閥が書き連ねられていた。\n\n書状の末尾には謝礼がはっきりと記されている。[hd_dc_support.Var('hd_dc_support_reward_gold').GetValue|0]金、あなたの名が支持者に加わりさえすれば、すぐに贈るという。\n\nこの書状を受け取っても、まだ承諾したことにはならない。この主張の下に自らの名を連ねるかどうかは、あなた自身が決めねばならない。"
 hd_dc_support.0008.a: "名を連ね、驥尾に付すとしよう。"
 hd_dc_support.0008.c: "我が心はなお今上にある。"
 hd_dc_support.0008.invalid: "時勢は移り、この書状はもはや話にならない。"
 hd_dc_support.0108.t: "名が定まった後"
 hd_dc_support.0108.paid: "返書と名簿がともに届いた。[hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName]の名は[hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]の派閥に加えられ、約束された謝礼も[hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]の私庫から満額送り出された。\n\nこの勧誘はひとまず成った。だが今後の戦の勝敗は天下の大勢次第であり、一通の返書で書き定められるものではない。"
 hd_dc_support.0108.unpaid: "[hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName]はすでに[hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]の派閥に名を連ねたが、約束された謝礼は満額届かなかった。\n\n担当者は未払いの額を帳簿に記し、二枚目の支払い伝票は切らなかった。この勘定は、遅かれ早かれ決着をつけねばならない。"
 hd_dc_support.0108.refused: "返書ははっきりと記していた。[hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName]はなお今上を奉じ、[hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]の派閥に加わるつもりはない、と。\n\n名簿に加わった者はなく、謝礼も一文たりとも動いていない。互いの心はもう分かった。この書状は、しばらく再び送るには及ばない。"
 hd_dc_support.0108.failed: "返書は届いたが、[hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName]は結局[hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]の派閥の名簿に加わることはできなかった。\n\n担当者は謝礼の支払いを止め、口先だけの承諾を、手に入れた支持とみなすことはしなかった。"
 hd_dc_support.0108.a: "しばし心に留めておく。"
