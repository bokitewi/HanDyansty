l_japanese:
 # 乱世霸权·天子与权臣（2026-10-10）


 # 傀儡
 hd_court_puppet: "挟まれた天子"
 hd_court_puppet_desc: "天子はなお御座に坐しているが、詔書はあなたの幕府から出されている。彼の名を借りて、あなたは征伐し、封拝し、投獄し、赦免することができる。"
 puppet_action_description_hd_court_puppet_action_grant_titles: "天子の名において #V [GetPlayer.GetPlayerInteractionName('grant_titles_interaction')]#! [interaction|E]を用い、天子名義の[titles|E]を他者に分封する"
 puppet_action_description_hd_court_puppet_action_revoke_title: "天子の名において #V [GetPlayer.GetPlayerInteractionName('revoke_title_interaction')]#! [interaction|E]を用い、天子の[vassals|E]の[titles|E]を剥奪する"
 hd_court_puppet_placeholder_interaction: "天子を挟む"

 # 挟天子成立
 hd_court.0001.t: "天子蒙塵"
 hd_court.0001.desc: "都からの知らせが届いた時、城門の守備兵はすでに入れ替わっていた。[hd_court_new_regent.GetTitledFirstName]の兵馬が宮城に進駐し、[hd_court_emperor.GetTitledFirstName]の車駕は新たな行在所へと迎え入れられた。\n\n詔書は今なお天子の口調で書かれ、押されるのも今なお天子の玉璽である。だが誰もが分かっている。これから先、筆を執るのは別の手なのだと。"
 hd_court.0001.a: "天子を手中にする者に、天下は目を向ける。"

 # 弃天子自立
 hd_court_abandon_emperor_decision: "天子を捨てて自立する"
 hd_court_abandon_emperor_decision_desc: "天子を奉じていれば、諸侯は公然と我に敵対しようとはしない。だがこの旗印は我が手足をも縛っている。朝堂の礼儀、群臣の目配せ、天子の沈黙した顔……そろそろ、これらすべてを彼に返す時かもしれぬ。"
 hd_court_abandon_emperor_decision_tooltip: "輔政を辞し、領国を率いて天子のもとを離れ、一方に自立する"
 hd_court_abandon_emperor_decision_confirm: "これより各々の道を行く！"
 hd_court_abandon_emperor_decision_effect_tt: "あなたは丞相と輔政の職を辞し、自らの領国を率いて天子のもとを離れる。天子は以後あなたの統制を受けない"
 hd_court_abandoned_emperor_opinion: "天子を見捨てた"

 # 第 3 期：立场
 hd_court_stance_zunhan_modifier: "尊漢"
 hd_court_stance_zunhan_modifier_desc: "この人物はなお漢の正朔を奉じ、逆賊を討ち漢を安んじることを己の任としている。"
 hd_court_stance_moni_modifier: "謀逆"
 hd_court_stance_moni_modifier_desc: "この人物の目にはもはや漢の天子はなく、ただ手中の刀兵のみを信じている。"
 hd_court_declare_zunhan_decision: "漢の正朔を奉ずる"
 hd_court_declare_zunhan_decision_desc: "漢の国運は衰えたとはいえ、天子はなおおわす。我はその正朔を奉じ、不臣を討ち、社稷を安んじたい――少なくとも、天下の人々はそう見てくれよう。"
 hd_court_declare_zunhan_decision_tooltip: "漢室を尊奉し、逆賊を討ち漢を安んじることを己の任とすると宣言する"
 hd_court_declare_zunhan_decision_confirm: "漢室を扶けずにはおれぬ！"
 hd_court_declare_moni_decision: "もはや詔を奉じない"
 hd_court_declare_moni_decision_desc: "いわゆる詔書など、天子を挟む者が借りた名目にすぎぬ。天命は常ならず、ただ徳ある者がこれに居る。そして徳とは、刀槍によって争い取るものなのだ。"
 hd_court_declare_moni_decision_tooltip: "もはや朝廷の号令に従わないと宣言する"
 hd_court_declare_moni_decision_confirm: "天下は、能ある者がこれに居る！"
 hd_court_stance_cooldown_tt: "あなたは最近すでに立場を表明している。朝令暮改は避けるべきだ"

 # 第 3 期：朝廷特权
 hd_court_grant_rank_interaction: "将軍号を授ける"
 hd_court_grant_rank_interaction_desc: "朝廷の名において、[recipient.GetShortUIName]に将軍の名号を授ける"
 hd_court_grant_rank_interaction_notification: "朝廷が[recipient.GetShortUIName]に将軍号を授けた"
 hd_court_already_has_rank_tt: "[recipient.GetShortUIName]はすでに将軍の名号を持っている"
 hd_court_yaoling_interaction: "その州を遥領させる"
 hd_court_yaoling_interaction_desc: "朝廷の名において、[secondary_recipient.GetShortUIName]が拠る州を[recipient.GetShortUIName]に遥領させ、そこの各郡に対する[claims|E]を与える"
 hd_court_yaoling_interaction_notification: "朝廷が[recipient.GetShortUIName]に一州を遥領させた"
 hd_court_order_campaign_interaction: "詔して征伐を命ずる"
 hd_court_order_campaign_interaction_desc: "朝廷の名において、[recipient.GetShortUIName]に[secondary_recipient.GetShortUIName]の討伐を命じる"
 hd_court_order_campaign_interaction_notification: "朝廷が[recipient.GetShortUIName]に[secondary_recipient.GetShortUIName]の討伐を詔した"
 hd_court_order_campaign_decline_tt: "詔に逆らえば、天下の諸侯はこれを口実とするだろう"
 hd_court_demand_tribute_interaction: "進貢を命ずる"
 hd_court_demand_tribute_interaction_desc: "朝廷の名において、[recipient.GetShortUIName]に銭糧を朝廷へ送るよう命じる"
 hd_court_demand_tribute_interaction_notification: "朝廷が[recipient.GetShortUIName]に進貢を命じた"
 hd_court_emperor_prestige_tt: "天子に十分な[prestige|E]がなければ、諸侯は詔令を真剣に受け止めない"
 hd_court_request_campaign_interaction: "討伐の詔を請う"
 hd_court_request_campaign_interaction_desc: "朝廷に詔を下すよう請い、[secondary_recipient.GetShortUIName]の討伐を許してもらう"
 hd_court_request_campaign_interaction_notification: "[actor.GetShortUIName]が[secondary_recipient.GetShortUIName]討伐の詔を請うた"
 hd_court_return_land_interaction: "朝廷に領地を献上する"
 hd_court_return_land_interaction_desc: "[target.GetName]を天子に返還し、朝廷が改めて分封する"
 hd_court_return_land_interaction_notification: "[actor.GetShortUIName]が領地を朝廷に献上した"

 hd_court_reason_zunhan: "漢室を尊奉している"
 hd_court_reason_moni: "漢の詔を奉じない"
 hd_court_reason_friend_of_target: "相手と親しい"
 hd_court_reason_rival_of_target: "相手と確執がある"
 hd_court_reason_target_moni: "相手は謀逆の徒である"
 hd_court_reason_weaker_than_target: "兵力が相手に及ばない"
 hd_court_reason_at_war: "戦争中である"
 hd_court_reason_asker_zunhan: "詔を請う者が漢室を尊奉している"
 hd_court_reason_target_friend_of_court: "相手が朝廷と親しい"
 hd_court_reason_zunhan_to_emperor: "天子に帰順したい"
 hd_court_reason_same_zunhan: "ともに漢室を奉じている"
 hd_court_reason_zunhan_vs_moni: "謀逆の徒と同列にされるのを恥じる"
 hd_court_reason_moni_vs_emperor: "天子に帰順するのを潔しとしない"

 hd_court_defied_edict_modifier: "抗詔"
 hd_court_defied_edict_modifier_desc: "この人物は詔を奉ずることを拒んだ。朝廷と諸侯が彼をどう扱うか、天下の人々が注視している。"
 hd_court_defied_edict_opinion: "詔に逆らった"
 hd_court_honored_by_court_opinion: "朝廷の恩遇"
 hd_court_returned_land_opinion: "献地の功"

 # 奉诏讨伐 CB
 hd_court_fengzhao_cb: "奉詔討伐"
 hd_court_fengzhao_cb_war_name: "[ATTACKER.GetShortUINamePossessive]の奉詔の戦い"
 hd_court_fengzhao_cb_victory_desc: "[attacker.GetShortUIName|U]は目標の郡のうち[defender.GetShortUINamePossessive]の拠る各県を奪取する。"
 hd_court_fengzhao_cb_white_peace_desc: "両者は兵を引いて和睦する。"
 hd_court_fengzhao_cb_defeat_desc: "[attacker.GetShortUIName|U]は討伐に失敗し、[defender.GetShortUIName]に賠償金を支払わねばならない。"

 # 第 4 期：天子反击
 hd_court_suborn_interaction: "密かに結納する"
 hd_court_suborn_interaction_desc: "金帛をもって密かに[recipient.GetShortUIName]と結び、後日権臣を誅除するための同志とする"
 hd_court_suborn_interaction_notification: "天子が密かに[recipient.GetShortUIName]と結んだ"
 hd_court_suborn_exposed_tt: "#EMP この事が権臣に察知されれば、彼はいっそうあなたを警戒するだけだろう。#!"
 hd_court_secret_edict_interaction: "衣帯の詔"
 hd_court_secret_edict_interaction_desc: "血書の密詔を衣帯に縫い込み、人に託して[recipient.GetShortUIName]に届け、兵を起こして賊を討つよう命じる"
 hd_court_secret_edict_interaction_notification: "[recipient.GetShortUIName]が天子の衣帯の詔を受け取った"
 hd_court_secret_edict_exposed_tt: "#EMP 密詔がひとたび漏れれば、宮中で必ずや誰かが命を落とすことになる。#!"
 hd_court_flee_interaction: "出奔"
 hd_court_flee_interaction_desc: "夜陰に乗じて宮城を抜け出し、[recipient.GetShortUIName]のもとへ身を寄せる"
 hd_court_flee_interaction_notification: "天子が[recipient.GetShortUIName]のもとへ出奔しようとしている"
 hd_court_flee_success_tt: "脱出できれば、[recipient.GetShortUIName]はあなたを自らの領内に迎え入れ、あなたに代わって輔政する"
 hd_court_flee_failure_tt: "阻まれれば、あなたはより厳しく監視される"
 hd_court_closely_watched_tt: "あなたは権臣に厳しく監視されている"
 hd_court_reason_loyal: "主君に忠実"
 hd_court_reason_greedy: "金帛を貪る"
 hd_court_reason_ambitious: "大志を抱く"
 hd_court_reason_rival_of_regent: "権臣と確執がある"
 hd_court_reason_weaker_than_regent: "兵力が権臣に及ばない"

 hd_court_palace_coup_decision: "権臣を誅除する"
 hd_court_palace_coup_decision_desc: "宮門の衛兵の中には我が手の者がおり、権臣の門下にも我が手の者がいる。あとは機を待つのみ――彼が参内して上奏するその日を。"
 hd_court_palace_coup_decision_tooltip: "密かに結んだ同志とともに事を起こし、権臣を誅殺する"
 hd_court_palace_coup_decision_confirm: "今日こそこの賊を誅す！"
 hd_court_palace_coup_decision_effect_tt: "#EMP 成功すれば親政となり、失敗すれば同志はことごとく死ぬ。同志が多く、あなたの[intrigue|E]が権臣に勝るほど、勝算は高まる。#!"
 hd_court_coup_supporters_tt: "存命の同志が少なくとも3名必要"
 hd_court_raise_guards_decision: "近衛の親兵を募る"
 hd_court_raise_guards_decision_desc: "宮中の衛士は幾度も入れ替わったが、一人として我が手の者はいない。自ら勇士を数名選んで身辺を守らせることができれば、少なくとも夜は安らかに眠れるだろう。"
 hd_court_raise_guards_decision_tooltip: "武勇の士を2名召募して宮中を宿衛させる。彼らは後日権臣を誅除するための同志となりうる"
 hd_court_raise_guards_decision_confirm: "勇者を選び、宮禁を宿衛せよ！"
 hd_court_guards_cooldown_tt: "あなたは最近すでに近衛を召募している"

 hd_court_closely_watched_modifier: "厳重な監視"
 hd_court_closely_watched_modifier_desc: "この人物の身辺にいる者は誰であれ、権臣の耳目である可能性がある。"
 hd_court_restored_emperor_opinion: "政権返還の恩"
 hd_court_plotted_against_opinion: "我を陥れようとした"
 hd_court_suspicious_opinion: "猜疑心を抱いた"

 hd_court.0010.t: "天子を迎え還す"
 hd_court.0010.desc: "賊党は破れ、宮門は大きく開かれた。[hd_court_restore_emperor.GetTitledFirstName]は殿前に立ち、手にはまだあの衣帯を握りしめている。彼はあなたを見つめ、何も言わない。\n\nあなたはかつて詔を奉じてやって来た。今、詔書に記された事はすでに成し遂げた。この先の事は、詔書には書かれていない。"
 hd_court.0010.a: "臣は詔を奉じて賊を討ちました。今こそ政を陛下にお返しいたします。"
 hd_court.0010.b: "天下はいまだ定まりません。陛下にはなお補佐する者が必要です。"
 hd_court.0011.t: "殿上の伏兵"
 hd_court.0011.desc: "権臣はいつものように参内して上奏し、剣を解き履を脱いで殿の階を上った。帷の後ろに伏せていた甲士たちが一斉に躍りかかる。\n\n血の跡もまだ拭い去られぬうちに、あなたは再び御座に戻った。今度は、あなたの背後に立って代わりに語る者は誰もいない。"
 hd_court.0011.a: "朕は、今日より親政する。"
 hd_court.0012.t: "事露見す"
 hd_court.0012.desc: "約束の刻限が来たが、殿外にはいつまでも動きがない。やって来たのは権臣の甲士であり、彼らはあなたの同志を一人また一人と縛り上げて殿前を引き立てていった。\n\nあなたを捕らえに来る者はいなかった。権臣はただ人を遣わして伝えただけだった――陛下は近頃お疲れのご様子、宮中にて静養なさるがよろしかろう、と。"
 hd_court.0012.a: "……"
 hd_court.0014.t: "夜に宮門を出る"
 hd_court.0014.desc: "車駕は夜陰に紛れて城を出て、道中三度馬を替えた。夜明けには、出迎えの兵馬がすでに道端に列をなしていた。\n\nあなたはついにあの宮城を離れた。前方で迎える者が次の権臣となるかどうか、今は構っていられない。"
 hd_court.0014.a: "まずはこの檻から抜け出すのだ。"
 hd_court.0015.t: "連れ戻し"
 hd_court.0015.desc: "車駕が城門を出て間もなく、追っ手が到着した。随行の者たちは一人ずつ連れ去られ、あなたは宮中に「お戻りいただいた」。\n\nその日から、あなたの寝殿の外の衛兵は倍に増えた。"
 hd_court.0015.a: "天は我を助けず。"

 hd_court_welcome_army_toast: "王師を喜び迎える"
 hd_court_welcome_army_toast_desc: "城中の父老は箪食壺漿して、勤王の軍を出迎えた。"

 # 第 5 期：篡位与僭号
 hd_court_depose_ceremonial_decision: "廃して虚位とする"
 hd_court_depose_ceremonial_decision_desc: "わざわざ壇を築いて禅譲を受ける必要があろうか？　天子はこれまで通り宮殿に住み、百官の朝拝を受ければよい。ただ、これからは天下の事に口を出さずともよいというだけだ。"
 hd_court_depose_ceremonial_decision_tooltip: "自ら天命を取り、旧天子には虚位を残す"
 hd_court_depose_ceremonial_decision_confirm: "陛下には御身を大切になさいますよう。"
 hd_court_depose_ceremonial_decision_effect_tt: "あなたは天命を得て、旧天子は虚位を保ちつつあなたの統制下に置かれる。この挙は禅譲以上に衆心を得がたい。天下の尊漢の者たちは必ずあなたに服さず、諸侯もまた簒奪者討伐を名目に兵を起こすだろう"
 hd_court_regent_tenure_tt: "あなたが輔政してまだ日が浅く、人心はまだ帰していない"
 hd_court_abdicated_title_name: "山陽"
 hd_court_ceremonial_title_name: "漢室"
 hd_court_ceremonial_monarch_modifier: "虚位の天子"
 hd_court_ceremonial_monarch_modifier_desc: "この人物はなお百官の朝拝を受けているが、もはや天下の事に口を出すことはできない。"
 hd_court_usurper_opinion: "漢を簒奪した賊"

 hd_court_proclaim_emperor_decision: "僭号して帝を称する"
 hd_court_proclaim_emperor_decision_desc: "漢室が衰えて久しく、天子は他人の手中にある印信にすぎぬ。我は一方を領し、兵は精強、糧は十分、民の心も帰している。なぜ自ら名号を立ててはならぬのか？"
 hd_court_proclaim_emperor_decision_tooltip: "自ら帝号を立て、漢の天子と対等に張り合う"
 hd_court_proclaim_emperor_decision_confirm: "漢に代わる者は、当塗高なり！"
 hd_court_proclaim_emperor_decision_effect_tt: "あなたは自ら帝となり、漢の天子の正統の半分を奪う。以後あなたは謀逆の徒となり、尊漢の隣国は詔を奉じてあなたを討伐するだろう"
 hd_court_proclaim_size_tt: "少なくとも30県の地を領有していなければならない"
 hd_court_proclaim_army_tt: "兵力が天子（または天子を挟む者）に劣っていてはならない"
 hd_court_proclaim_popular_tt: "統治下の県の大半で民心が帰していなければならない"
 hd_court_pseudo_empire_name: "[hd_court_pseudo_founder.GetPrimaryTitle.GetBaseName]"
 hd_court_pseudo_emperor_modifier: "僭号して帝を称する"
 hd_court_pseudo_emperor_modifier_desc: "この人物は自ら帝号を立て、漢の天子と対等に張り合っている。"
 hd_court_pseudo_emperor_opinion: "僭号の賊"

 hd_court.0020.t: "漢の国運移る"
 hd_court.0020.desc: "知らせは天下を駆け巡った。[hd_court_usurper.GetTitledFirstName]が帝位に登り、[hd_court_deposed_emperor.GetTitledFirstName]は玉璽を差し出したのだ。\n\nこれぞ天命の帰する所と言う者もあれば、これは簒逆だと言う者もいる。各地の州郡は形勢をうかがい、少なからぬ者がすでに討伐の名目を探し始めている。"
 hd_court.0020.a: "天命の説とは、いつの世も勝者が書くものだ。"
 hd_court.0021.t: "僭号"
 hd_court.0021.desc: "[hd_court_pseudo_founder.GetTitledFirstName]は壇を築いて天を祀り、自ら帝を称し、改元して国号を建て、百官を置き、宗廟を立てた。\n\n漢の天子はなおおわす。かくして天下には二人の天子が並び立つこととなった。漢室を尊奉する者たちは次々と上書し、この僭越の徒の討伐を願い出ている。"
 hd_court.0021.a: "天に二日あり、民に二主あり。"

 hd_court_taocuan_cb: "簒奪者討伐"
 hd_court_taocuan_cb_war_name: "[ATTACKER.GetShortUINamePossessive]の簒奪者討伐の戦い"
 hd_court_taocuan_cb_victory_desc: "[attacker.GetShortUIName|U]は簒逆を討ち平らげ、天命を取ってこれに代わる。"
 hd_court_taocuan_cb_white_peace_desc: "両者は兵を引いて和睦する。"
 hd_court_taocuan_cb_defeat_desc: "[attacker.GetShortUIName|U]は簒奪者討伐に失敗し、[defender.GetShortUIName]に賠償金を支払わねばならない。"

 # 第 6 期：都督区
 hd_court_dudu_grant_claim_interaction: "請求権を遥授する"
 hd_court_dudu_grant_claim_interaction_desc: "朝廷の名において、[recipient.GetShortUIName]に隣接する一郡への[claims|E]を許し、自ら機を見て征討させる"
 hd_court_dudu_grant_claim_interaction_notification: "朝廷が[recipient.GetShortUIName]に隣郡の征討を許した"

 # 复核补充：被挟持的天子锁权
 hd_court_emperor_held_blocked_tt: "あなたは権臣に制せられており、彼に手を下すことはできない"
