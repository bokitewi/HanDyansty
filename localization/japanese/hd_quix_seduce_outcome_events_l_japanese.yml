l_japanese:
 quix_seduce_outcome.2000.t:0 "龍に攀じ鳳に附す"
 quix_seduce_outcome.2000.desc:0 "あなたは[target.GetTitledFirstNamePossessive]の奥の間で待っていた。傍らには酒の載った机と、果物を盛った皿がいくつかあるだけだ。\n\n部屋に入ってきた[target.GetSheHe|U]はあなたを見ても驚かず、むしろ微笑みながら近づいてきた。何度か探り合う言葉を交わしたのち、二人はもう互いの想いを隠そうとはしなかった。"
 quix_seduce_outcome.2000.a:0 "富貴と温もり、いつまでもおそばに。"
 quix_seduce_outcome.2000.b:0 "一夜の歓び、気にかけるには及ばぬ。"
 hd_quix_seduce_outcome.2010.t:0 "苦痛を悦びとして"
 quix_seduce_outcome.2010.desc:0 "[target.GetTitledFirstName]はあなたを囚室での密会に誘った。あなたが着くと、中にはすでに燭火が灯され、責め具のそばには花びらまで撒かれていた――[target.GetSheHe]が前もって用意していたのは明らかだ。\n\n「今夜は私の言うとおりにして」と[target.GetSheHe]は言った。その後の出来事が示したとおり、[target.GetHerHis]好みは尋常な快楽にとどまるものではなかった。"
 quix_seduce_outcome.2010.a:0 "次は、わたしが鞭を執る番だ。"
 quix_seduce_outcome.2020.t:0 "干し草部屋にて"
 quix_seduce_outcome.2020.desc:0 "あなたと[target.GetName]はなかなか二人きりになる機会がなく、人に短い書付を託して、厩の上の干し草部屋で会おうと[target.GetHerHim]を誘った。\n\n家畜の物音が二人の囁きをかき消した。[target.GetSheHe|U]が身を寄せてきたとき、あなたはこの密会がどう終わるのかをすでに悟っていた。"
 quix_seduce_outcome.2020.a:0 "次はもっとまともな場所を探さねば。"
 quix_seduce_outcome.2020.b:0 "まずは湯浴みだ。ここで別れよう。"
 quix_seduce_outcome.2021.t:0 "祠の中の囁き"
 quix_seduce_outcome.2021.desc:0 "[target.GetName]は斎戒祈福を名目に、あなたを祠廟へ誘った。あなたが夕刻に駆けつけると、殿内には素服をまとった[target.GetHerHim]のほかに誰もいなかった。\n\n[target.GetSheHe|U]は愛と敬虔の道理について語り合うつもりだったが、いくらも話さぬうちに、二人とも用意していた口上を忘れてしまった。この祈福は、結局まったく別のものになった。"
 quix_seduce_outcome.2021.a:0 "神明も照覧あれ、この心は変わらぬ。"
 quix_seduce_outcome.2021.b:0 "神々が一度だけ見逃してくれたと思おう。"
 quix_seduce_outcome.2022.t:0 "別業の昼下がり"
 quix_seduce_outcome.2022.desc:0 "ある旧知が、城外の別業にしばらく滞在しないかとあなたを招いた。着いてみて初めてわかったのだが、そこで本当にあなたを待っていたのは[target.GetTitledFirstName]であった。\n\n二人は庭を散策し、食事を共にするうち、話も次第に打ち解けたものになっていった。昼下がり、[target.GetSheHe]はあなたを階上に誘い、さらに語り合おうと言った。名目上の主人は、それから何日も姿を見せなかった。"
 quix_seduce_outcome.2022.a:0 "心通い合う仲、末永くあるべし。"
 quix_seduce_outcome.2022.b:0 "今日の歓びは、思い出として胸にしまおう。"
 quix_seduce_outcome.2023.t:0 "古塚の秘め事"
 quix_seduce_outcome.2023.desc:0 "召使いや廷臣の目を避けるため、あなたは[target.GetTitledFirstName]を荒れ果てた古塚の墓道に呼び出した。ここは冷え冷えとしているが、邪魔の入る心配は決してない。\n\nあなたが想いを打ち明けようとしたその時、[target.GetSheHe]のほうが先に同じ言葉を口にした。その後の長い沈黙は、もはや何の説明も要しなかった。"
 quix_seduce_outcome.2023.a:0 "次は、さすがに場所を変えねば。"
 quix_seduce_outcome.2023.b:0 "古人の眠りを、これ以上妨げはすまい。"
 quix_seduce_outcome.2024.t:0 "山中の茅屋"
 quix_seduce_outcome.2024.desc:0 "[target.GetTitledFirstName]は、山野の茅屋であなたと密会することを承知した。ここには召使いもおらず、覗き見る目もない。二人はようやく腹を割って話せるのだ。\n\n夜が更けると、[target.GetSheHe]はあなたの気持ちを率直に尋ねた。あなたは逃げずに答え、[target.GetSheHe]もその答えを受け入れた。"
 quix_seduce_outcome.2024.b:0 "山中の一夜、生涯忘れまい。"
 quix_seduce_outcome.2025.t:0 "田舎の閑日"
 quix_seduce_outcome.2025.desc:0 "あなたは[target.GetTitledFirstName]を田舎の荘園に招き、静かな日々が二人の距離を縮めてくれることを願った。\n\n一日じゅうのそぞろ歩きと長話のあと、二人は回廊で空が暗くなっていくのを眺めていた。[target.GetSheHe|U]はついに想いを隠すのをやめ、自らあなたに口づけをした。"
 quix_seduce_outcome.2025.a:0 "そなたがいてくれるなら、毎年こうありたい。"
 quix_seduce_outcome.2025.b:0 "束の間の清らかな歓び、心を慰めるに足る。"
 quix_seduce_outcome.2026.t:0 "夜の小舟遊び"
 quix_seduce_outcome.2026.desc:0 "あなたは遊覧船を一艘借り、[target.GetTitledFirstName]を二人きりの舟遊びに誘った。夕食のあと、二人は提灯をいっぱいに吊るした舳先で語り合った。\n\n[target.GetSheHe|U]はこの逢瀬を設けてくれた礼を述べると、言い終えるやいなやあなたに口づけをした。最初の驚きはすぐに消え、二人とも岸に戻るのを急がなかった。"
 quix_seduce_outcome.2026.a:0 "またいつか、そなたと舟を浮かべよう。"
 quix_seduce_outcome.2026.b:0 "波に揺られるのはもう御免だ。この舟には乗らずともよい。"
 quix_seduce_outcome.2027.t:0 "地下蔵の密会"
 quix_seduce_outcome.2027.desc:0 "何か月にもわたる探り合いはもう十分だ。あなたは[target.GetTitledFirstName]を酒蔵の地下に呼び出した。そこは人目につかず、誰も探しに来はしない。\n\n梯子を降りてきたばかりの[target.GetSheHe|U]は、すぐにあなたに想いを打ち明けた。あなたも包み隠さず応え、この逢瀬はたちまち言葉の域を越えていった。"
 quix_seduce_outcome.2027.a:0 "この蔵は今後、我ら二人の場所としよう。"
 quix_seduce_outcome.2027.b:0 "酒を一甕持って、ここで別れよう。"
 quix_seduce_outcome.2028.t:0 "胸襟を開いて"
 quix_seduce_outcome.2028.desc:0 "あなたは長く思い悩んだ末、[target.GetTitledFirstName]に自分の気持ちを率直に打ち明けることにした。内々に会うと、[target.GetSheHe]は初め戸惑った顔をしたが、立ち去りはしなかった。\n\nあなたの言葉を聞き終えると、[target.GetSheHe]は口づけで答えた。実は[target.GetSheHe]もずっと同じ思いを抱いていたが、あなたが本気かどうかわからずにいたのだ。"
 quix_seduce_outcome.2028.a:0 "胸襟を開いた今、これより心はひとつ。"
 quix_seduce_outcome.2028.b:0 "考え直した。ここまでにしよう。"
 quix_seduce_outcome.2029.t:0 "面と向かって"
 quix_seduce_outcome.2029.desc:0 "あなたは[target.GetTitledFirstName]のつかず離れずの態度にとうに嫌気がさしており、密会の場を設けて[target.GetHerHim]にはっきりした答えを求めた。\n\n[target.GetSheHe|U]はあなたを弄んでいたのではないとしきりに否定し、ずっと前から気があったのだと認めた。誤解が解けると、二人は顔を見合わせて笑い、そのまま抱き合った。"
 quix_seduce_outcome.2029.a:0 "もっと早く打ち明けるべきだった。これからは共に。"
 quix_seduce_outcome.2029.b:0 "話はついた。互いに達者でな。"
 quix_seduce_outcome.2030.t:0 "抑えきれぬ情欲"
 quix_seduce_outcome.2030.a:0 "そなたとの睦み合い、飽きることなどない！"
 quix_seduce_outcome.2030.b:0 "一夜の歓び、それで十分だ。"
 quix_seduce_outcome.2031.t:0 "人目のない所で"
 quix_seduce_outcome.2031.desc:0 "[target.GetTitledFirstName]があなたに気があるのは見て取れたが、宴席は始終人の出入りが絶えなかった。あなたが[target.GetHerHis]耳元で一緒に抜け出そうと囁くと、二人は人の隙を見て、こっそり宴席を抜け出した。\n\n人々から離れたところで、[target.GetSheHe]はようやく、一晩じゅうこんな機会を探していたのだと打ち明けた。二人はもう隠し立てする必要はなかった。"
 quix_seduce_outcome.2031.a:0 "次に席を外すときは、何か口実をこしらえねば！"
 quix_seduce_outcome.2031.b:0 "ここで別れよう。もう会いに来るな。"
 quix_seduce_outcome.2301.t:0 "密室の逢瀬"
 quix_seduce_outcome.2301.desc:0 "あなたの耳目は、[target.GetTitledFirstName]と人目を避けて会えるよう、人目につかぬ屋敷を用意してくれた。\n\n誰にもつけられていないのを確かめてから扉を押し開けると、[target.GetSheHe]はとうに火鉢のそばに座って待っていた。「上着をお脱ぎなさいな」どうやらあなたの心のうちは、[target.GetHerHim]には初めから筒抜けだったようだ。"
 quix_seduce_outcome.2301.b:0 "壁に耳あり、二度とはせぬ。"
 quix_seduce_outcome.2302.t:0 "使用人の離れに潜んで"
 quix_seduce_outcome.2302.a:0 "もう幾日か、ここに留まらせてくれ。"
 quix_seduce_outcome.2302.b:0 "夜が明ける前に、それぞれ帰ろう。"
 quix_seduce_outcome.2303.t:0 "巫山の雲雨"
 quix_seduce_outcome.2303.desc:0 "あなたは森の夜祀を口実に、[target.GetTitledFirstName]を夜半に人知れぬ林へ誘った。この集まりに別の目的があることは、二人とも心得ていた。\n\n巫覡たちが太鼓を打って舞い、祝歌が響きわたる。[target.GetSheHe]はあなたの目配せに応じ、二人は歌声の中で、それぞれのやり方でこの秘めやかな祭礼を成し遂げた。"
 quix_seduce_outcome.2303.a:0 "この呪いが成ったからには、そなたはわたしのものだ！"
 quix_seduce_outcome.2303.b:0 "歌がうるさすぎる。次は御免だ。"
 quix_seduce_outcome.2304.t:0 "社日の祭り"
 quix_seduce_outcome.2304.desc:0 "社日になるたびに、[target.GetName]はいつも一人で村の祭りに出かける。今年はあなたもその人混みに紛れ込んだ。二人は一緒に酒を飲み、神を祀る太鼓の舞を眺めるうち、日頃の身分などすっかり忘れてしまった。\n\n城外で休むための帷幕に戻ると、あなたはついに想いを口にした。[target.GetSheHe|U]はただ笑ってこう答えた。「とっくに気づいていましたよ」"
 quix_seduce_outcome.2304.a:0 "毎年の社日には、そなたと共に来よう！"
 quix_seduce_outcome.2304.b:0 "田舎の楽しみ、存分に味わって帰るとしよう。"
 quix_seduce_outcome.2305.t:0 "異郷の宴のあとで"
 quix_seduce_outcome.2305.desc:0 "あなたと[target.GetName]は、ともに遠方の宴に招かれた。見知った廷臣や人目を離れ、二人は一晩じゅう同じ席で酒を酌み交わし語り合った。\n\n宴が果てると、[target.GetSheHe]はそっとあなたの手に触れた。二人は相前後して席を立ち、やがてあなたの宿所で再び落ち合った。今度こそ、[target.GetSheHe]は自らの渇望を隠そうとはしなかった。"
 quix_seduce_outcome.2305.a:0 "もう幾日か留まってはどうだ？"
 quix_seduce_outcome.2305.b:0 "ここでのことは、ここで終わりにしよう。"
 quix_seduce_outcome.3000.desc:0 "あなたが奥の間に戻ると、[owner.GetTitledFirstName]がすでにそこで待っており、机の上には酒と果物が並べられていた。\n\nあなたは微笑みながら近づき、果物をつまんで手ずから[owner.GetHerHim]の口元へ運んだ。[owner.GetSheHe|U]は拒まず、二人はほどなく互いの想いを隠さなくなった。"
 quix_seduce_outcome.3000.a:0 "この者、なかなか気に入った。そばに置こう。"
 quix_seduce_outcome.3010.desc:0 "[owner.GetTitledFirstName]は何か月もあなたに言い寄ってきた。あなたは囚室で[owner.GetHerHim]に最後の試練を与えることにした。燭火、花びら、責め具――すべてを整えて。\n\n「今夜は私の言うとおりにして」とあなたは[owner.GetHerHim]に告げた。[owner.GetSheHe|U]は誘いに応じ、あなたが用意したすべてを受け入れた。"
 quix_seduce_outcome.3010.a:0 "この者はよく耐えた。そばに置いてよかろう。"
 quix_seduce_outcome.3020.desc:0 "[owner.GetTitledFirstNamePossessive]の熱心な求愛には、あなたもとうに気づいていた。今回[owner.GetSheHe]は人に短い書付を託し、厩の上の干し草部屋で会おうと誘ってきた。あなたはついに出かけていった。\n\n家畜の物音が二人の囁きをかき消した。[owner.GetSheHe|U]が身を寄せてきたとき、あなたももう取り澄ますのはやめた。"
 quix_seduce_outcome.3020.a:0 "次は、わたしのほうからそなたの部屋に忍んで行こう。"
 quix_seduce_outcome.3021.desc:0 "あなたは斎戒祈福を名目に、[owner.GetTitledFirstName]を人里離れた祠廟へ誘った。夕刻、殿内にはあなたたち二人のほかに誰もいなかった。\n\nあなたはまず愛と敬虔の道理について語るつもりだったが、[owner.GetSheHe]はすぐにあなたの本当の目的を察した。用意していた口上は、結局一言も使わずじまいだった。"
 quix_seduce_outcome.3021.a:0 "今後の祈福にも、どうか共に来てほしい。"
 quix_seduce_outcome.3022.desc:0 "[owner.GetName]はしばらく前からあなたに言い寄っていた。そこであなたは旧知の城外の別業を借りて、この密会を設けた――持ち主はもちろん姿を見せない。\n\n二人は庭を散策し、食事を共にするうち、話も次第に打ち解けたものになっていった。昼下がり、あなたが[owner.GetHerHim]を階上に誘うと、[owner.GetSheHe]は喜んで応じた。"
 quix_seduce_outcome.3022.a:0 "この庭はよい。たびたび来るとしよう。"
 quix_seduce_outcome.3023.desc:0 "[owner.GetTitledFirstName]は荒れ果てた古塚の墓道であなたと会う約束をした。ここは冷え冷えとしているが、邪魔の入る心配は決してない。\n\n[owner.GetSheHe|U]が用向きを切り出そうとしたその時、あなたのほうが先に胸のうちを打ち明けた。実はそれこそが、[owner.GetHerHis]あなたを呼び出した理由だったのだ。"
 quix_seduce_outcome.3023.a:0 "地下の古人に、仲人役を務めてもらおう。"
 quix_seduce_outcome.3024.desc:0 "あなたは[owner.GetTitledFirstName]と山野の茅屋で密会することを承知した。ここには召使いもおらず、覗き見る目もない。二人はようやく腹を割って話せるのだ。\n\n夜が更けると、あなたは[owner.GetHerHis]用向きを率直に尋ねた。[owner.GetSheHe|U]は包み隠さず自らの想いを認め、あなたもそれを受け入れた。"
 quix_seduce_outcome.2024.a:0 "この生涯でそなたを得た。これ以上何を望もうか！"
 quix_seduce_outcome.3025.desc:0 "[owner.GetTitledFirstName]はあなたを田舎の荘園に招いた。[owner.GetSheHe]があなたに気があるのは知っていたが、あなたは[owner.GetHerHim]自身の口から聞きたかった。\n\n一日じゅうのそぞろ歩きと長話のあとも、[owner.GetSheHe]はなかなか切り出そうとしない。あなたはもう待ちきれず、回廊で自ら[owner.GetHerHim]に口づけをした。"
 quix_seduce_outcome.3025.a:0 "このような良き時が、いつまでもあればよい。"
 quix_seduce_outcome.3026.desc:0 "[owner.GetTitledFirstName]があなたを舟遊びに誘った。[owner.GetSheHe]がこれを機にあなたと二人きりになりたいのだとわかっていた。夕食のあと、二人は提灯をいっぱいに吊るした舳先で語り合った。\n\nあなたはこの逢瀬を設けてくれた[owner.GetHerHim]に礼を述べ、言い終えるやいなや[owner.GetHerHim]に口づけをした。[owner.GetSheHe|U]は身をかわさず、二人とも岸に戻るのを急がなかった。"
 quix_seduce_outcome.3026.a:0 "この舟はよい。たびたび浮かべるとしよう。"
 quix_seduce_outcome.3027.desc:0 "[owner.GetTitledFirstName]は酒蔵の地下であなたと会う約束をした。あなたはもともと想いを打ち明ける機会を探していたので、一人で時間どおりに出向いた。\n\n梯子を降りるやいなや、あなたは[owner.GetHerHim]に想いを打ち明けた。[owner.GetSheHe|U]は黙ってうなずき、二人の間に残っていた最後のためらいも消え去った。"
 quix_seduce_outcome.3027.a:0 "この歓び、極まりなし。末永く続かんことを！"
 quix_seduce_outcome.3028.desc:0 "[owner.GetTitledFirstName]は内々にあなたを呼び出し、単刀直入にあなたへの想いを打ち明けた。\n\nあなたは口づけで答えた。実はあなたもずっと同じ思いを抱いていたが、[owner.GetSheHe]が本気かどうかわからずにいたのだ。今やもう疑う必要はない。"
 quix_seduce_outcome.3028.a:0 "想いが通じた今、末永く共にあらんことを。"
 quix_seduce_outcome.3029.desc:0 "[owner.GetTitledFirstName]はあなたを密会に誘い、会うなり、[owner.GetHerHis]気持ちを知りながらわざと返事を引き延ばしているとあなたを責めた。\n\nあなたは慌てて否定した――あなたもずっとひそかに[owner.GetHerHim]を慕っていたのだ。誤解が解けると、二人は顔を見合わせて笑い、そのまま抱き合った。"
 quix_seduce_outcome.3029.a:0 "これからはもう隠し事はなしだ。"
 quix_seduce_outcome.3030.a:0 "この身もこの夜も、すべてそなたに捧げよう。"
 quix_seduce_outcome.3301.desc:0 "[owner.GetTitledFirstName]は人目につかぬ屋敷を用意し、人目を避けて会いに来るようあなたを誘った。[owner.GetHerHis]意図は察しがついたし、それはまさにあなたの望むところでもあった。\n\n誰にもつけられていないのを確かめてから、あなたは先に部屋に入って待った。[owner.GetSheHe|U]が入ってくると、あなたはただ一言こう言った。「上着をお脱ぎなさいな」"
 quix_seduce_outcome.2301.a:0 "この部屋の灯火は、いつもそなたのために灯しておこう。"
 quix_seduce_outcome.3302.a:0 "もう幾日か留まってから行くがよい。"
 quix_seduce_outcome.3303.desc:0 "[owner.GetTitledFirstName]はあなたを夜半の森での夜祀に誘った。この林の中の集まりに別の目的があることは、二人とも心得ていた。\n\n巫覡たちが太鼓を打って舞い、祝歌が響きわたる。あなたは[owner.GetHerHis]目配せに応じ、二人は歌声の中で、それぞれのやり方でこの秘めやかな祭礼を成し遂げた。"
 quix_seduce_outcome.3303.a:0 "この曲は実に妙なる調べ。たびたび聴きたいものだ。"
 quix_seduce_outcome.3304.desc:0 "社日になるたびに、あなたはいつも一人で村の祭りに出かけ、しばし屋敷の煩わしさを忘れることにしている。今年は[owner.GetTitledFirstName]もその人混みの中に姿を見せた。\n\n二人は一緒に酒を飲み、神を祀る太鼓の舞を眺め、やがて城外で休むための帷幕に共に戻った。[owner.GetSheHe|U]がついに想いを口にすると、あなたはただ笑ってこう答えた。「とっくに気づいていましたよ」"
 quix_seduce_outcome.3304.a:0 "来年の社日にも、またそなたと会おう。"
 quix_seduce_outcome.3305.desc:0 "あなたと[owner.GetName]は、ともに遠方の宴に招かれた。[owner.GetSheHe]がずっとあなたに気があるのは知っていたし、見知った人目を離れたことは、二人にとってまたとない好機であった。\n\n二人は一晩じゅう同じ席で酒を酌み交わし語り合った。宴が果てると、あなたはそっと[owner.GetHerHis]手に触れた。二人は相前後して席を立ち、やがて[owner.GetHerHis]宿所で再び落ち合った。"
 quix_seduce_outcome.3305.a:0 "良き夜は短い。もうしばらく留まろう。"
