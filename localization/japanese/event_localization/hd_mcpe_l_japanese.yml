l_japanese:
 mcpe.13.t:0 "衆人の前での辱め"
 mcpe.13.d.no_bully_fallback:0 "中庭で、一人の子供が皆の前であなたを嘲笑った。その言葉は辛辣で、一言一言が胸に刺さる。周りの者は皆口をつぐみ、あなたがどう応じるかを見守っている。"
 mcpe.13.d.bully:0 "中庭で、[bully.GetTitledFirstName|U]が皆の前であなたを嘲笑った。その言葉は辛辣で、一言一言が胸に刺さる。周りの者は皆口をつぐみ、あなたがどう応じるかを見守っている。"
 mcpe.13.a:0 "我を辱める者には、拳で返す！"
 mcpe.13.b:0 "この屈辱は覚えておく。いつか必ず報いる。"
 mcpe.13.c:0 "口先だけの言葉など、気に留めるまでもない。"
 mcpegr.13.d_bully:0 "[child.GetTitledFirstName|U]があなたのもとへ来て、[bully.GetTitledFirstName]が大勢の子供の前で[child.GetHerHim]を嘲笑ったと話した。\n\n"
 mcpegr.13.d_no_bully_fallback:0 "[child.GetTitledFirstName|U]があなたのもとへ来て、ある子供に皆の前で[child.GetHerHim]が嘲笑われたと話した。\n\n"
 mcpegr.13.d_wrathful:0 "[child.GetSheHe|U]は堪えることなく、その場で拳を振るって殴りかかった。"
 mcpegr.13.d_vengeful:0 "[child.GetSheHe|U]はその時は堪えて何もしなかったが、いずれ相手に必ず代償を払わせると密かに誓った。"
 mcpegr.13.d_calm:0 "[child.GetSheHe|U]はそれをくだらない挑発とみなし、一笑に付して気にも留めなかった。"
 mcpegr.13.confirm_wrathful:0 "辱められたら反撃する。当然のことだ。"
 mcpegr.13.confirm_vengeful:0 "よろしい。この屈辱は忘れるべきでなく、許すべきでもない。"
 mcpegr.13.confirm_calm:0 "賢明だ。たかが悪口に、[child.GetHerHim]を傷つけられるものか。"
 mcpegr.13.wrathful_change:0 "[child.GetFirstNameNoTooltip|U]、これほどの辱めを受けて、なぜ堪える必要がある！"
 mcpegr.13.vengeful_change:0 "この恨みは胸に刻み、いつか晴らすのだ。"
 mcpegr.13.calm_change:0 "ちょっとした悪口に、腹を立てるまでもない。"
 mcpe.14.t:0 "不仲な夫婦の諍い"
 mcpe.14.d:0 "あなたは、屋敷に仕える長年連れ添った召使いの夫婦が口論しているところに出くわした。二人とももう発端など忘れているのに、互いを責め立てるのをやめず、あの時一緒になったのが人生最大の過ちだったとまで言い合っている。"
 mcpe.14.a:0 "愛情が結局こうなるのなら、いらない。"
 mcpe.14.b:0 "結局、人は皆自分のことしか考えないのだ。"
 mcpe.14.c:0 "お互い相手の話を最後まで聞けばいいのに。"
 mcpegr.14.d:0 "[child.GetTitledFirstName]が召使いの夫婦の口論に出くわしたと聞いた。二人は些細なことで互いを責め合い、そもそも夫婦になるべきではなかったとまで言っていたという。\n\n"
 mcpegr.14.d_chaste:0 "[child.GetFirstNameNoTooltip|U]は、愛情とやらが最後には口論しか残らないのなら、いっそない方がいいと言った。"
 mcpegr.14.d_cynical:0 "[child.GetFirstNameNoTooltip|U]は、これこそ人は誰しもまず自分のことを考えるという証だと言った。"
 mcpegr.14.d_patient:0 "[child.GetFirstNameNoTooltip|U]は、二人が辛抱強く相手の言葉を最後まで聞きさえすれば、いずれ解決できると言った。"
 mcpegr.14.confirm_chaste:0 "その考えにも一理ある。"
 mcpegr.14.confirm_cynical:0 "世の中とはそういうものだ。この教訓を覚えておけ。"
 mcpegr.14.confirm_patient:0 "世の人々が皆これほど聡明であればよいのだが……"
 mcpegr.14.chaste_change:0 "愛情がそんなものなら、何の役に立つ？"
 mcpegr.14.cynical_change:0 "結局のところ、人は皆自分のことしか考えない。"
 mcpegr.14.patient_change:0 "二人が互いに耳を傾けさえすればよかったのだ。"
 mcpe.15.t:0 "退屈な講義"
 mcpe.15.d:0 "あなたは経師の講義をきちんと座って聞かねばならなかった。その声はのろく平板で、一文を言い終わる前に、あなたはもう最初に何と言っていたかを忘れてしまう。もうじっとしていられない……"
 mcpe.15.a:0 "先生、要点を言ってください！"
 mcpe.15.b:0 "どんなにつらくても、最後まで集中して聞かなければ。"
 mcpe.15.c:0 "口実を作って席を外し、また口実を作って戻らない。"
 mcpegr.15.d:0 "あなたは[child.GetTitledFirstName]に、退屈で有名な経師の講義を聞きに行かせ、[child.GetSheHe]がどう対処するかも見てみることにした。\n\n"
 mcpegr.15.d_impatient:0 "[child.GetSheHe|U]はほどなく経師の話を遮り、この授業はまったくつまらないとはっきり言った。"
 mcpegr.15.d_diligent:0 "[child.GetSheHe|U]はなんと初めから終わりまで熱心に講義を聞いていた。"
 mcpegr.15.d_deceitful:0 "[child.GetSheHe|U]は口実を作って席を外し、さらに理由をこしらえて、二度と戻らなかった。"
 mcpegr.15.confirm_impatient:0 "その通り。他人に時間を無駄にされてなるものか！"
 mcpegr.15.confirm_diligent:0 "よくやった、[child.GetFirstNameNoTooltip]。見上げたものだ。"
 mcpegr.15.confirm_deceitful:0 "はは！[child.GetFirstNameNoTooltip]、なかなか機転が利くな。"
 mcpegr.15.impatient_change:0 "他人にあなたの時間を浪費させる必要などない！"
 mcpegr.15.diligent_change:0 "[child.GetFirstNameNoTooltip|U]、もっと勉学に励むべきだ！"
 mcpegr.15.deceitful_change:0 "口実を作って席を外せばいいのだ。"
 mcpe.16.t:0 "初恋"
 mcpe.16.d.no_crush:0 "あなたはある身分の低い[child.Custom('servant_for_romance')]を好きになった。だが相手の一家は近いうちに遠くへ旅立ってしまう。今気持ちを打ち明けなければ、もう二度と会えないかもしれない。"
 mcpe.16.d.crush:0 "あなたは[crush.GetTitledFirstName]に思いを寄せている。今こそ気持ちを打ち明ける好機なのに、言葉が喉まで出かかるたびに、気後れしてしまう。"
 mcpe.16.a:0 "機会を見つけて、面と向かって気持ちを伝える。"
 mcpe.16.b:0 "まずはこっそり様子をうかがってみよう……"
 mcpe.16.c:0 "部屋に閉じこもって、誰にも気づかれないことを願う。"
 mcpegr.16.d:0 "[child.GetTitledFirstName]が[crush.GetTitledFirstName]に心を動かされているらしいことに、あなたは気づいた。\n\n"
 mcpegr.16.d.no_crush:0 "[child.GetTitledFirstName]がある身分の低い[child.Custom('servant_for_romance')]に心を動かされているらしいことに、あなたは気づいた。\n\n"
 mcpegr.16.d_brave:0 "[child.GetFirstNameNoTooltip|U]はついに勇気を奮い起こし、面と向かって気持ちを打ち明けた。"
 mcpegr.16.d_lustful:0 "[child.GetFirstNameNoTooltip|U]は告白はせず、むしろ物陰からこっそり相手を眺めてばかりいた。"
 mcpegr.16.d_shy:0 "[child.GetFirstNameNoTooltip|U]は部屋に閉じこもり、この思いを誰にも見抜かれないことだけを願っていた。"
 mcpegr.16.confirm_brave:0 "そうあるべきだ。堂々としていればよい。"
 mcpegr.16.confirm_lustful:0 "はは！若者の心とは、誰しもそういうものだ。"
 mcpegr.16.confirm_shy:0 "それは人の常というものだ。"
 mcpegr.16.brave_change:0 "[child.GetFirstNameNoTooltip|U]、気持ちは堂々と伝えるべきだ！"
 mcpegr.16.lustful_change:0 "まずはこっそりよく見ておけばいいではないか？"
 mcpegr.16.shy_change:0 "そういう胸の内は、部屋にしまっておけばよい。"
 mcpe.17.t:0 "市場での強奪"
 mcpe.17.d:0 "召使いの家の子が塀の隅にうずくまって泣いているのを、あなたは見つけた。訊いてみると、その子は市場へ食べ物を買いに行ったところで奪われてしまい、怖くて慌てて、どうしてよいか分からないのだという。"
 mcpe.17.a:0 "外の世界はこんなに危ないのか……"
 mcpe.17.b:0 "それが私に何の関係がある？"
 mcpe.17.c:0 "泣かないで。食べ物を分けてあげる。"
 mcpegr.17.d:0 "[child.GetTitledFirstName|U]は、召使いの家の子が市場で物を奪われ、泣きやまずにいるところに出くわした。あなたが[child.GetFirstNameNoTooltip]にどうするつもりか尋ねると、[child.GetSheHe]は答えた。\n\n"
 mcpegr.17.d_craven:0 "「外がこんなに危ないなんて知らなかった。これからはもっと気をつけなきゃ」"
 mcpegr.17.d_callous:0 "「それが僕と何の関係があるの？なんでそんなことで煩わせるの？」"
 mcpegr.17.d_generous:0 "「食べ物を少し分けてあげようよ。お腹を空かせたままにはしておけないもの」"
 mcpegr.17.confirm_craven:0 "その通り。外は確かに危ない。"
 mcpegr.17.confirm_callous:0 "まさしく。我らには関係のないことだ。"
 mcpegr.17.confirm_generous:0 "人に食べ物を分けるのは、善い行いだ。"
 mcpegr.17.craven_change:0 "外がどれほど危ないか、知らないのか？"
 mcpegr.17.callous_change:0 "その件が我らに何の関わりがある？"
 mcpegr.17.generous_change:0 "食べ物を少し分けてやるべきだ。"
 mcpe.18.t:0 "異国の珍味"
 mcpe.18.d:0 "宴席で、ある人があなたに高価な異国の珍味を勧めた。一口食べただけで飲み込むのもつらいと感じたが、腹は空いているし、主人も傍らで感想を待っている。"
 mcpe.18.a:0 "味は悪くても、腹を満たすのが大事。"
 mcpe.18.b:0 "これが珍味？ひどくまずい！"
 mcpe.18.c:0 "いくら高価でも、食べなくて結構……"
 mcpegr.18.d:0 "あなたは[child.GetTitledFirstName]を連れて宴に出た。席上、ある人が[child.GetHerHim]に高価な異国の珍味を勧めたが、[child.GetHerHis]顔色がすでにすべてを物語っていた。\n\n"
 mcpegr.18.d_gluttonous:0 "口に合わなかったにもかかわらず、[child.GetSheHe]は皿の上のものをきれいに平らげた。"
 mcpegr.18.d_honest:0 "[child.GetSheHe|U]は皆の前で、このいわゆる珍味はとても食べられたものではないとはっきり言った。"
 mcpegr.18.d_temperate:0 "[child.GetSheHe|U]は箸を置き、高価な食べ物だからといって多く食べる価値があるとは限らないと考えた。"
 mcpegr.18.confirm_gluttonous:0 "まずいにせよ、腹は満たせる。"
 mcpegr.18.confirm_honest:0 "よく言った！遠慮なく言えばよい、[child.GetFirstNameNoTooltip]！"
 mcpegr.18.confirm_temperate:0 "飲食に節度があれば、それで十分だ。"
 mcpegr.18.gluttonous_change:0 "どんなにまずくても食べ物は食べ物だ！"
 mcpegr.18.honest_change:0 "まずいならまずいと言えばいい！"
 mcpegr.18.temperate_change:0 "もしかすると珍味はもともと[child.GetFirstNameNoTooltip]の好みではないのかもしれない。"
 mcpe.19.t:0 "こそ泥の侵入"
 mcpe.19.d:0 "こそ泥があなたの居室に忍び込んで金目の物を物色し、多くの物を壊していった。衛兵はすぐにその者を捕らえ、あなたの前に引き立てて、処置を委ねた。"
 mcpe.19.a:0 "汝が壊した物は、自らの手で直せ。"
 mcpe.19.b:0 "必ずや散々な目に遭わせてやる！"
 mcpe.19.c:0 "二度とせぬと誓うなら、去るがよい。"
 mcpegr.19.d:0 "こそ泥が[child.GetTitledFirstNamePossessive]の居室に押し入り、多くの物を壊した。衛兵が捕らえた後、あなたは[child.GetFirstNameNoTooltip]にどう処置すべきか尋ねた。\n\n"
 mcpegr.19.d_just:0 "[child.GetSheHe|U]は、こそ泥に自分の壊した物を自らの手で修理させるべきだと考えた。"
 mcpegr.19.d_sadistic:0 "[child.GetSheHe|U]は、ただそのこそ泥を散々な目に遭わせたいとだけ思った。"
 mcpegr.19.d_forgiving:0 "[child.GetSheHe|U]は、相手が二度としないと約束しさえすれば、こそ泥を逃がしてやってもよいと考えた。"
 mcpegr.19.confirm_just:0 "罪に見合った罰。実に公平だ。"
 mcpegr.19.confirm_sadistic:0 "その通り。後悔させてやらねばならん。"
 mcpegr.19.confirm_forgiving:0 "これほど寛大とは、得難いことだ。"
 mcpegr.19.just_change:0 "いや、刑罰は罪に見合うものでなければならない！"
 mcpegr.19.sadistic_change:0 "いや、散々な目に遭わせるべきだ！"
 mcpegr.19.forgiving_change:0 "いや、寛恕の心を持つべきだ！"
 mcpe.20.t:0 "玩具選び"
 mcpe.20.d:0 "[guardian.GetTitledFirstName|U]があなたを市場へ連れて行き、新しい玩具を一つ選ばせてくれることになった。露店には品々がずらりと並び、目移りしてしまうが、選べるのは一つだけだ。"
 mcpe.20.a:0 "こんな安物、私にふさわしくない！"
 mcpe.20.b:0 "一番高いのがほしい！"
 mcpe.20.c:0 "あれがいい！いや、これ！いやいや、やっぱりあれ！"
 mcpegr.20.d:0 "あなたは[child.GetTitledFirstName]を市場へ連れて行き、新しい玩具を一つ、[child.GetHerHim]自身に選ばせると約束した。\n\n"
 mcpegr.20.d_arrogant:0 "[child.GetSheHe|U]は露店をくまなく見て回ったが、自分にふさわしいものは一つもないと言った。"
 mcpegr.20.d_greedy:0 "[child.GetSheHe|U]は迷わず一番高価なものを選んだ。"
 mcpegr.20.d_fickle:0 "[child.GetSheHe|U]はなかなか決められず、新しい玩具を見るたびに気が変わった。"
 mcpegr.20.confirm_arrogant:0 "まあよい。目が高いのも悪くない。"
 mcpegr.20.confirm_greedy:0 "[child.GetFirstNameNoTooltip|U]は物の値打ちが分かっているな。"
 mcpegr.20.confirm_fickle:0 "いろいろ見て回るのは、悪いことではない。"
 mcpegr.20.arrogant_change:0 "[child.GetFirstNameNoTooltip|U]はもっと目を高く持つべきだ！"
 mcpegr.20.greedy_change:0 "[child.GetFirstNameNoTooltip|U]は財貨の値打ちを知るべきだ！"
 mcpegr.20.fickle_change:0 "いろいろ見てから決めればよい。"
 mcpe.21.t:0 "郷里の巡視"
 mcpe.21.d:0 "[guardian.GetTitledFirstName|U]はあなたを連れて家の封地を巡り、この地の田畑と民を知るよう促した。行程が終わりに近づいた頃、[guardian.GetSheHe]はあなたにまだどこか見たい所はあるかと尋ねた。"
 mcpe.21.a:0 "村の人たちと話してみたい！"
 mcpe.21.b:0 "道行く人の目つきが怪しい。早く屋敷に戻ろう。"
 mcpe.21.c:0 "もう行かない。今日はもう疲れた。"
 mcpegr.21.d:0 "あなたは[child.GetTitledFirstName]を連れて家の封地を巡り、この地の田畑と民を[child.GetHerHim]に知ってもらおうとした。行程が終わりに近づいた頃、あなたは[child.GetSheHe]に何かしたいことはあるかと尋ねた。\n\n"
 mcpegr.21.d_gregarious:0 "[child.GetFirstNameNoTooltip|U]は土地の人々と話をして、彼らの暮らしぶりを自分の耳で聞きたいと言った。"
 mcpegr.21.d_paranoid:0 "[child.GetFirstNameNoTooltip|U]は道行く人々が密かにあなたたちを見張っているのではと疑い、すぐに屋敷へ戻ると言い張った。"
 mcpegr.21.d_lazy:0 "[child.GetFirstNameNoTooltip|U]はすっかり歩き疲れており、この巡視が早く終わることばかり願っていた。"
 mcpegr.21.confirm_gregarious:0 "よろしい。郷里の人々とは親しくすべきだ。"
 mcpegr.21.confirm_paranoid:0 "用心するに越したことはない。"
 mcpegr.21.confirm_lazy:0 "それもよかろう。戻って休むとしよう。"
 mcpegr.21.gregarious_change:0 "郷里の人々と話してみてはどうか？"
 mcpegr.21.paranoid_change:0 "外出の際は、もっと用心すべきだ！"
 mcpegr.21.lazy_change:0 "これだけ歩いたのだ、休むべきだろう。"
 mcpe.22.t:0 "天罰の噂"
 mcpe.22.d:0 "近隣ではずっと、人付き合いを避けて独り暮らしをしているある者が、陰で鬼神を敬っていないという噂が流れていたが、証拠は一向に出てこなかった。先日、その者の家が火事になり、皆はこれこそ報いだと言い合った。"
 mcpe.22.a:0 "これは天の戒めだ。神を侮る者は心せよ！"
 mcpe.22.b:0 "噂だけで、人を軽んじてよいものか？"
 mcpe.22.c:0 "人が何と言おうと、再建を手伝うべきだ。"
 mcpegr.22.d:0 "近隣ではずっと、ある独り暮らしの者が鬼神を敬っていないと非難されていたが、証拠はなかった。先日その者の家が火事になり、それを聞いた[child.GetTitledFirstName]はあなたにこう言った。\n\n"
 mcpegr.22.d_zealous:0 "「これはきっと天の戒めだよ。あの神を侮った人は、とうとう報いを受けたんだ！」"
 mcpegr.22.d_humble:0 "「噂じゃ何の証明にもならない。他人の人となりを見抜いたつもりになるべきじゃないよ」"
 mcpegr.22.d_compassionate:0 "「噂が本当でも嘘でも、あの気の毒な人が家を建て直すのを手伝うべきだよ」"
 mcpegr.22.confirm_zealous:0 "然り。罪人にはおのずと報いがある！"
 mcpegr.22.confirm_humble:0 "然り。人を軽んじてはならない。"
 mcpegr.22.confirm_compassionate:0 "然り。危うきを扶け困窮を救うのは当然のことだ。"
 mcpegr.22.zealous_change:0 "[child.GetFirstNameNoTooltip|U]、天意を疑うなどあってはならない！"
 mcpegr.22.humble_change:0 "その者の品行がどうか、誰に断言できよう？"
 mcpegr.22.compassionate_change:0 "この気の毒な者を助けるべきだ！"
 mcpe.23.t:0 "早めの放課"
 mcpe.23.d:0 "あなたが師について書を読んでいると、窓の外から他の子供たちが遊び騒ぐ声が聞こえてきた。師はあなたが上の空なのを見て取り、今日は早めに切り上げてよい、誰かに訊かれたら自分が責任を持つと言った。"
 mcpe.23.a:0 "ありがとうございます、先生！"
 mcpe.23.b:0 "最後まで学ぶと約束したのだから、最後まで学ぶ。"
 mcpe.23.c:0 "先生が許そうが許すまいが、私は勝手に行く。"
 mcpegr.23.d:0 "外で何人かの子供が遊んでいるのが見えた。[child.GetTitledFirstName]は本来なら今、師について書を読んでいるはずだ。\n\n"
 mcpegr.23.d_trusting:0 "ほどなく、[child.GetSheHe]も駆け出して彼らと一緒に遊び始めた。後で師はあなたに、自分が早めに授業を切り上げたのだと打ち明けた。"
 mcpegr.23.d_stubborn:0 "[child.GetSheHe|U]は最後まで席を離れなかった。後で師が言うには、[child.GetFirstNameNoTooltip]は前もって約束していたからと、その日の授業を最後まで受けると言い張ったのだという。"
 mcpegr.23.d_arbitrary:0 "ほどなく、[child.GetSheHe]も駆け出して彼らと一緒に遊び始めた。後で師が言うには、[child.GetFirstNameNoTooltip]はまったく許可を得ていなかったという。"
 mcpegr.23.confirm_trusting:0 "たまに早く切り上げるくらい、構わない。"
 mcpegr.23.confirm_stubborn:0 "よろしい！言ったことは必ず守るのだ、[child.GetFirstNameNoTooltip]！"
 mcpegr.23.confirm_arbitrary:0 "[child.GetFirstNameNoTooltip|U]が行くも留まるも、他人の許しなど要るものか。"
 mcpegr.23.trusting_change:0 "[child.GetFirstNameNoTooltip|U]は先生に断ってから行くべきだ！"
 mcpegr.23.stubborn_change:0 "[child.GetFirstNameNoTooltip|U]は授業を最後まで受けるべきだ！"
 mcpegr.23.arbitrary_change:0 "[child.GetFirstNameNoTooltip|U]は行きたければ行けばいい！"
 mcpe.24.t:0 "君主となる夢"
 mcpe.24.d:0 "あなたはある夢から覚めたところだ。夢の中であなたは広大な土地を擁する一方の雄主であり、何よりも忘れがたいのは……"
 mcpe.24.a:0 "……あの至上の権柄と畏敬。"
 mcpe.24.b:0 "……あの数え切れぬ金帛財貨。"
 mcpe.24.c:0 "……民が安らかに暮らし楽しく働く笑顔。"
 mcpegr.24.d:0 "[child.GetTitledFirstName|U]はあなたに、[child.GetSheHe]が広大な土地を擁する一方の雄主となった夢を見たと話した。\n\n"
 mcpegr.24.d_ambitious:0 "[child.GetSheHe|U]が何より忘れられないのは夢の中の権柄と畏敬で、いつの日かそれが現実になることを願っている。"
 mcpegr.24.d_greedy:0 "[child.GetSheHe|U]が何より忘れられないのは夢の中の数え切れぬ財貨で、いつの日かそれをすべて我が物にすることを願っている。"
 mcpegr.24.d_compassionate:0 "[child.GetSheHe|U]が最も忘れがたいのは民が安らかに暮らし楽しく働く光景で、世の中が本当にそうなることを願っている。"
 mcpegr.24.confirm_ambitious:0 "権柄こそ、争うに値する。"
 mcpegr.24.confirm_greedy:0 "財貨こそ、求めるに値する。"
 mcpegr.24.confirm_compassionate:0 "民の安楽こそ、最も求めるに値する。"
 mcpegr.24.ambitious_change:0 "求めるべきは、権柄である！"
 mcpegr.24.greedy_change:0 "求めるべきは、財貨である！"
 mcpegr.24.compassionate_change:0 "求めるべきは、民の安楽である！"
 mcpe.25.t:0 "物陰からの視線"
 mcpe.25.d:0 "近頃、ある身分の低い[child.Custom('servant_for_romance')]が、いつも遠くからあなたを盗み見ており、気づかれると慌てて身を隠す。もしや誰かがひそかにあなたを慕っているのだろうか？"
 mcpe.25.a:0 "こんなに気にかけてもらえるなんて、嬉しい！"
 mcpe.25.b:0 "こんなふうに覗き見られるのは不愉快だ。"
 mcpe.25.c:0 "……もしかして私を害しに来たのでは。"
 mcpegr.25.d:0 "ある身分の低い[child.Custom('servant_for_romance')]が、いつもひそかに[child.GetTitledFirstName]を見つめており、気づかれると身を隠すことにあなたは気づいた。どうやら[child.GetFirstNameNoTooltip]には慕ってくれる者がいるようだ。\n\n"
 mcpegr.25.d_lustful:0 "[child.GetSheHe|U]はその好意をかなり楽しんでいるようだ。"
 mcpegr.25.d_chaste:0 "こうして覗き見られることに、[child.GetHerHim]は落ち着かない思いをしている。"
 mcpegr.25.d_paranoid:0 "[child.GetSheHe|U]はそれが好意ではなく、誰かが自分を害そうと企んでいるのだと思い込んでいる。"
 mcpegr.25.confirm_lustful:0 "いいではないか。素直に喜べばよい。"
 mcpegr.25.confirm_chaste:0 "当然だ。あれは無礼な振る舞いだ。"
 mcpegr.25.confirm_paranoid:0 "然り。人は見かけによらぬものだ。"
 mcpegr.25.lustful_change:0 "素直に喜べばよい。何を堅苦しくすることがある！"
 mcpegr.25.chaste_change:0 "そのような誘惑は、きっぱりと拒むべきだ！"
 mcpegr.25.paranoid_change:0 "もっと自分の身の安全を考えるべきだ！"
 mcpe.26.t:0 "屋敷からの抜け出し"
 mcpe.26.d:0 "何人かの子供が、こっそり屋敷を抜け出して野外でしばらく一人で過ごしてみろとあなたをけしかけた。そうしてこそ、護衛に頼らなくても自分の身を守れると証明できるのだという――あとはあなたにその度胸があるかどうかだ。"
 mcpe.26.a:0 "怖いものか。外なんて何ともない！"
 mcpe.26.b:0 "護衛なしで出かける？危なすぎる、行かない！"
 mcpe.26.c:0 "行くには行く。でもこっそり護衛についてこさせる。"
 mcpegr.26.d:0 "昨日、あなたはどこを探しても[child.GetTitledFirstName]を見つけられなかった。最後にある者が、[child.GetHerHim]が何人かの子供と連れ立って、一緒に屋敷を抜け出したらしいのを見たと言った。\n\n"
 mcpegr.26.d_brave:0 "今日、[child.GetFirstNameNoTooltip]はその子供たちと無事に戻ってきた。皆が[child.GetHerHis]度胸を褒め、この冒険の話をあちこちで語っている。"
 mcpegr.26.d_craven:0 "今日、あなたは古い衣装箱の中で[child.GetFirstNameNoTooltip]を見つけた。[child.GetSheHe]は外が危ないのを恐れて、そもそもついて行かなかったのだ。"
 mcpegr.26.d_deceitful:0 "今日、[child.GetFirstNameNoTooltip]はその子供たちと無事に戻ってきた。後で護衛が言うには、[child.GetSheHe]はあらかじめ密かに彼らに後をつけてくるよう言いつけていたのだという。"
 mcpegr.26.confirm_brave:0 "はは！[child.GetFirstNameNoTooltip|U]はやはり怖いもの知らずだな！"
 mcpegr.26.confirm_craven:0 "[child.GetFirstNameNoTooltip|U]は災いを避けることを心得ている。よろしい。"
 mcpegr.26.confirm_deceitful:0 "度胸を示しつつ、危険は冒さない。賢いな。"
 mcpegr.26.brave_change:0 "[child.GetFirstNameNoTooltip|U]は度胸を見せるべきだ！"
 mcpegr.26.craven_change:0 "[child.GetFirstNameNoTooltip|U]は災いから遠ざかるべきだ！"
 mcpegr.26.deceitful_change:0 "[child.GetFirstNameNoTooltip|U]、適当に嘘をつけばいいのだ！"
 mcpe.27.t:0 "召使いの死"
 mcpe.27.d:0 "屋敷に仕えていた忠実な老僕が亡くなった。葬儀の場で、見慣れたその人がこうして去っていくのを見て、あなたは初めて真剣に考えた。貴賤を問わず、人はいずれ死ぬのだと。"
 mcpe.27.a:0 "……神霊のご加護がなければ、人は塵にすぎない。"
 mcpe.27.b:0 "……権勢も栄華も、結局はすべて空しい。"
 mcpe.27.c:0 "……この葬儀は退屈でうんざりする。"
 mcpegr.27.d:0 "屋敷に仕えていた忠実な老僕が亡くなった。葬儀の場で[child.GetTitledFirstName]が何か考え込んでいる様子だったので、あなたは[child.GetHerHim]に生と死をどう思うか尋ねた。\n\n"
 mcpegr.27.d_zealous:0 "[child.GetSheHe|U]は、人生は短く、神霊の導きがなければ何の意味もない、敬虔な信仰によってのみ拠り所を見いだせるのだと言った。"
 mcpegr.27.d_content:0 "[child.GetSheHe|U]は、人はいずれ死ぬのだから、権勢や栄華は一生をかけて追い求めるに値しないと言った。"
 mcpegr.27.d_callous:0 "[child.GetSheHe|U]はただ葬儀が退屈でうんざりだと感じていた。どうせ死者は誰がそばにいようと気にしないのだから。"
 mcpegr.27.confirm_zealous:0 "まったくその通りだ、[child.GetFirstNameNoTooltip|U]。"
 mcpegr.27.confirm_content:0 "然り。権勢も栄華もすべて過ぎゆく雲煙にすぎない。"
 mcpegr.27.confirm_callous:0 "同感だ。あんな所でただ立ち尽くして何になる？"
 mcpegr.27.zealous_change:0 "葬送は大いなる礼だ。おろそかにしてはならない！"
 mcpegr.27.content_change:0 "権勢も栄華も、結局は過ぎゆく雲煙だ！"
 mcpegr.27.callous_change:0 "たかが葬儀、気にすることがあるか？"
 mcpe.28.t:0 "行商人の来訪"
 mcpe.28.d:0 "各地を渡り歩く行商人が屋敷にやって来て、異国の食べ物や玩具、護符をあなたに売り込んだ。どの品にも危険に満ちた来歴が添えられている。[guardian.GetTitledFirstName]が駆けつけた時、行商人はちょうどあなたにどれが気に入ったかと尋ねていた。"
 mcpe.28.a:0 "この食べ物、すごくいい匂い。食べてみたい！"
 mcpe.28.b:0 "あの不思議なお守りがほしい！"
 mcpe.28.c:0 "私は馬鹿じゃない。そんな出まかせには騙されない。"
 mcpegr.28.d:0 "行商人が屋敷にやって来て、[child.GetTitledFirstName]に様々な異国の品を売り込み、奇妙な話もたくさん語った。\n\n"
 mcpegr.28.d_gluttonous:0 "[child.GetSheHe|U]は神秘的な護符にはまったく興味を示さず、ずっと異国の食べ物ばかり見つめていた。"
 mcpegr.28.d_trusting:0 "[child.GetSheHe|U]は行商人の話を信じ込み、遠い地から来たというお守りを買ってほしいとあなたにせがんだ。"
 mcpegr.28.d_cynical:0 "[child.GetSheHe|U]は行商人のほら話を見抜き、いわゆる霊験なるものはすべて嘘だと断じた。"
 mcpegr.28.confirm_gluttonous:0 "少しいい物を食べるくらい、構わないだろう！"
 mcpegr.28.confirm_trusting:0 "よし、好きにするがいい。"
 mcpegr.28.confirm_cynical:0 "[child.GetFirstNameNoTooltip|U]は簡単には騙されないな。"
 mcpegr.28.gluttonous_change:0 "[child.GetFirstNameNoTooltip|U]、その食べ物を味わってみるといい！"
 mcpegr.28.trusting_change:0 "そのお守りをもらっておけばいいではないか？"
 mcpegr.28.cynical_change:0 "そんな出まかせを信じるのか？"
 mcpe.29.t:0 "客人の礼"
 mcpe.29.d:0 "遠方から来た旅人の一家が屋敷に逗留している。その家の子供があなたのところへ来て、ここ数日のもてなしにどう報いればよいかと真面目な顔で尋ねた。"
 mcpe.29.a:0 "客をもてなすのは主人の務め。礼には及ばない。"
 mcpe.29.b:0 "じゃあ、雑用を少し手伝ってくれる？"
 mcpe.29.c:0 "……な、なんで私に話しかけるの？"
 mcpegr.29.d:0 "遠方から来た旅人の一家が屋敷に逗留している。その家の子供が[child.GetTitledFirstName]のところへ来て、屋敷のもてなしにどう報いればよいかと尋ねた。\n\n"
 mcpegr.29.d_just:0 "[child.GetFirstNameNoTooltip|U]は、旅人をもてなすのは主人の本分であり、別に報いる必要はないと言った。"
 mcpegr.29.d_lazy:0 "[child.GetFirstNameNoTooltip|U]は相手に雑用をいくつか代わりにやってもらった。"
 mcpegr.29.d_shy:0 "[child.GetFirstNameNoTooltip|U]はどう答えてよいか分からず、それからはずっと自分の部屋に隠れていた。"
 mcpegr.29.confirm_just:0 "然り。そうあるべきだ。"
 mcpegr.29.confirm_lazy:0 "うむ、少し手伝ってもらうくらい構わないだろう……"
 mcpegr.29.confirm_shy:0 "[child.GetHerHim]を一人で静かにさせておこう。"
 mcpegr.29.just_change:0 "客をもてなすのは、もとより我らの務めだ！"
 mcpegr.29.lazy_change:0 "雑用を少し手伝ってもらうのもいいだろう。"
 mcpegr.29.shy_change:0 "我らは人に煩わされたくないのだ！"
 mcpe.30.t:0 "学業の約束"
 mcpe.30.d:0 "師があなたに念を押した。あなたは学業にもっと励むと約束したのに、近頃も一向に進歩が見られないと。もしかすると師の教え方が悪いのかもしれないが、約束したのはやはりあなたなのだ。"
 mcpe.30.a:0 "あの約束なんて、もうどうでもいい。"
 mcpe.30.b:0 "まあいい、もっと学ぼう。言ったことは守らないと。"
 mcpe.30.c:0 "己の無能を棚に上げて、よくも私のせいにできるな？！"
 mcpegr.30.d:0 "[child.GetTitledFirstName|U]は師にもっと勉学に励むと約束したのに、近頃も一向に進歩が見られない。[child.GetSheHe]がその約束をどう考えているのか知りたくて、あなたは自ら尋ねに行った。\n\n"
 mcpegr.30.d_arbitrary:0 "[child.GetSheHe|U]はとうにかつての約束など気にも留めていなかった。"
 mcpegr.30.d_diligent:0 "[child.GetSheHe|U]はなおかつての約束を重んじており、これからはもっと勤勉になると決意した。"
 mcpegr.30.d_wrathful:0 "[child.GetSheHe|U]は過ちをすべて師に押しつけ、相手が無能だからこそ自分の学業が少しも進まないのだと思い込んでいた。"
 mcpegr.30.confirm_arbitrary:0 "破られるべき約束というものもある。"
 mcpegr.30.confirm_diligent:0 "よろしい、[child.GetFirstNameNoTooltip|U]、続けるのだ。"
 mcpegr.30.confirm_wrathful:0 "その怒りももっともだ。"
 mcpegr.30.arbitrary_change:0 "あんな約束、気にする必要があるか？"
 mcpegr.30.diligent_change:0 "言ったことは必ず守れ。引き続き励むのだ！"
 mcpegr.30.wrathful_change:0 "あの凡庸な師にしくじらされて、腹が立たないのか？"
 mcpe.31.t:0 "流言蜚語"
 mcpe.31.d.no_bully_fallback:0 "ある子供が陰でずっとあなたについての悪意ある噂を広めている。人目を引きたいのか、それとも妬みからか。だが理由が何であれ、事はすでに起きてしまった。"
 mcpe.31.d.bully:0 "[bully.GetTitledFirstName|U]が陰でずっとあなたについての悪意ある噂を広めている。[bully.GetSheHe]は人目を引きたいのか、それとも妬みからか。だが理由が何であれ、事はすでに起きてしまった。"
 mcpe.31.a:0 "……境遇が違えば、私たちは友になれたかもしれない。"
 mcpe.31.b:0 "……私を辱める者は、理由が何であれ必ず報いを受ける。"
 mcpe.31.c:0 "……下々の者が私をどう見ようと、知ったことではない。"
 mcpegr.31.d.no_bully_fallback:0 "ある子供がずっと[child.GetTitledFirstName]についての悪意ある噂を広めている。[child.GetFirstNameNoTooltip]は、相手は人目を引きたいのか、あるいは妬んでいるのだろうと考えた。\n\n"
 mcpegr.31.d.bully:0 "[bully.GetTitledFirstName|U]がずっと[child.GetTitledFirstName]についての悪意ある噂を広めている。[child.GetFirstNameNoTooltip]は、[bully.GetFirstNameNoTooltip]は人目を引きたいのか、あるいは妬んでいるのだろうと考えた。\n\n"
 mcpegr.31.d_forgiving:0 "[child.GetSheHe|U]はそんな振る舞いをむしろ哀れに思い、そのことで相手をいつまでも恨む気にはなれなかった。"
 mcpegr.31.d_vengeful:0 "[child.GetSheHe|U]は相手の事情など構わず、自分を侮辱した者は必ず代償を払わねばならないとだけ考えた。"
 mcpegr.31.d_arrogant:0 "[child.GetSheHe|U]は噂などまるで気にしていなかった。[child.GetSheHe]から見れば、自分にはるかに及ばない者など相手にする価値もないのだ。"
 mcpegr.31.confirm_forgiving:0 "その通り。一つの友情が惜しまれる。"
 mcpegr.31.confirm_vengeful:0 "よろしい。奴らに代償を払わせねばならん。"
 mcpegr.31.confirm_arrogant:0 "然り。相手にするまでもない。"
 mcpegr.31.forgiving_change:0 "お前たちは良い友になれたかもしれないのに！"
 mcpegr.31.vengeful_change:0 "誰であろうと、お前を軽んじることは決して許すな！"
 mcpegr.31.arrogant_change:0 "下々の者の言葉など、気に掛けることがあるか？"
 mcpe.32.t:0 "飢えた子の盗み"
 mcpe.32.d:0 "市場で、ぼろをまとった子供が品物の山の陰に隠れ、人の隙を見て食べ物を盗むのをあなたは目にした。[guardian.GetTitledFirstName|U]もそれを見ており、あなたが何と言うかを待っている。"
 mcpe.32.a:0 "商人に知らせるべきだ。あの子が盗んだと！"
 mcpe.32.b:0 "あの子を見つけて、手下にしよう。"
 mcpe.32.c:0 "このかわいそうな子に食べ物をあげよう！"
 mcpegr.32.d:0 "市場で、ぼろをまとった子供が人の隙を見て食べ物を盗むのをあなたは目にした。[child.GetTitledFirstName|U]もそれを見ており、あなたにこう言った。\n\n"
 mcpegr.32.d_honest:0 "「誰が盗んだのか、あの商人に知らせるべきだよ」"
 mcpegr.32.d_ambitious:0 "「あの子を見つけさえすれば、食べ物を少しあげるだけで僕たちのために働かせられるよ」"
 mcpegr.32.d_generous:0 "「あの子に食べ物をあげようよ。そうすればもう盗まなくて済むでしょ」"
 mcpegr.32.confirm_honest:0 "然り。盗人は捕らえねばならない。"
 mcpegr.32.confirm_ambitious:0 "良い考えだ、[child.GetFirstNameNoTooltip|U]。"
 mcpegr.32.confirm_generous:0 "よろしい。では少し施してやろう。"
 mcpegr.32.honest_change:0 "誰が盗んだのか、商人に知らせるべきだ！"
 mcpegr.32.ambitious_change:0 "あの子を我らのために働かせればよいではないか？"
 mcpegr.32.generous_change:0 "いや、あのかわいそうな子に食べ物をやろう！"
 mcpe.33.t:0 "草木を育てる"
 mcpe.33.d:0 "あなたは近頃、草花や木の育て方を習っているが、自分で世話をしている苗はなかなか伸びない。師は草木にはそれぞれ時節があると言うが、あなたにはそれがただ長くて退屈な待ち時間にしか思えない。"
 mcpe.33.a:0 "退屈きわまりない。こんなことに費やす暇はない。"
 mcpe.33.b:0 "気に病む必要はない。"
 mcpe.33.c:0 "草花の世話をするだけで、もう満足だ。"
 mcpegr.33.d:0 "[child.GetTitledFirstName|U]は近頃、草花や木の育て方を習っているが、自分で世話をしている苗はなかなか伸びない。あなたがそのことを[child.GetHerHim]と話すと、[child.GetSheHe]は言った。\n\n"
 mcpegr.33.d_impatient:0 "「つまらなすぎる。ずっと待っている暇なんてないよ！」"
 mcpegr.33.d_calm:0 "「焦らなくていいよ。誰だって一度に何もかも覚えられるわけじゃないもの」"
 mcpegr.33.d_content:0 "「草花の世話をするだけで、もう十分満たされるんだ。どうして人は権勢や栄華を追い求めたりするのか、本当に分からないよ」"
 mcpegr.33.confirm_impatient:0 "それもいい。では何か別のことをしよう。"
 mcpegr.33.confirm_calm:0 "然り。それは何も恥ずべきことではない。"
 mcpegr.33.confirm_content:0 "然り。足るを知る者は常に楽しむ。"
 mcpegr.33.impatient_change:0 "こんなことで時間を無駄にする必要はない。"
 mcpegr.33.calm_change:0 "気に病む必要はない。"
 mcpegr.33.content_change:0 "権力や利益を争うことの空しさが、今なら分かるだろう？"
 mcpe.34.t:0 "練兵場での休憩"
 mcpe.34.d:0 "あなたは兵士たちが練兵場で午前中ずっと訓練しているのを見ていた。昼の休憩になったので、近寄って彼らと少し話をしてみることにした。"
 mcpe.34.a:0 "珍しくて面白い話をしよう！"
 mcpe.34.b:0 "皆さんお疲れさま。本当に尊敬します！"
 mcpe.34.c:0 "怠けるな、訓練を続けよ！"
 mcpegr.34.d:0 "[child.GetTitledFirstName|U]は兵士たちが午前中ずっと訓練しているのを見ていた。昼の休憩になると、[child.GetSheHe]は自ら近寄って彼らに話しかけた。\n\n"
 mcpegr.34.d_gregarious:0 "[child.GetSheHe|U]は兵士たちと代わる代わる話を語り合い、すぐに皆と打ち解けた。"
 mcpegr.34.d_humble:0 "[child.GetSheHe|U]は皆を守ってくれる兵士たちに感謝し、その賛辞に彼らはずいぶん気を良くした。"
 mcpegr.34.d_sadistic:0 "[child.GetSheHe|U]は兵士たちに怠けるな、訓練を続けよと怒鳴りつけ、皆の不満を買った。"
 mcpegr.34.confirm_gregarious:0 "話を語り合うのは、もちろん楽しいことだ。"
 mcpegr.34.confirm_humble:0 "兵士を敬うとは、実によい。"
 mcpegr.34.confirm_sadistic:0 "[child.GetHerHim]の言葉を聞いたな。皆、訓練に戻れ！"
 mcpegr.34.gregarious_change:0 "[child.GetFirstNameNoTooltip|U]は人付き合いを学ぶべきだ！"
 mcpegr.34.humble_change:0 "[child.GetFirstNameNoTooltip|U]は兵士を敬うべきだ！"
 mcpegr.34.sadistic_change:0 "[child.GetFirstNameNoTooltip|U]は彼らの怠けを叱りつけるべきだ！"
 mcpe.35.t:0 "子供の言うこと"
 mcpe.35.d:0 "大人たちはいつもあなたが幼いことを口実に、あなたの話をまともに聞こうとしない。こんな軽視にはもううんざりだ。何か手を打って、彼らの見方を改めさせなければ。"
 mcpe.35.a:0 "大人として扱われたいなら、まず大人らしく振る舞うべきだ。"
 mcpe.35.b:0 "大声で叫べば、聞かざるを得なくなる！"
 mcpe.35.c:0 "焦ることはない。私が大きくなれば、自然に解決する。"
 mcpegr.35.d:0 "[child.GetTitledFirstName|U]は、大人たちがいつも幼いことを口実に[child.GetHerHim]を軽んじることに不満を抱いていた。長いこと考えた末、[child.GetSheHe]はあなたにこう言った。\n\n"
 mcpegr.35.d_temperate:0 "「大人として扱ってほしいなら、まず僕が大人らしくしなきゃ」"
 mcpegr.35.d_stubborn:0 "「声さえ大きければ、みんないずれ僕の言うことを聞くはずだ！」"
 mcpegr.35.d_patient:0 "「これは急いでも仕方ないよ。大きくなれば、自然と問題じゃなくなるから」"
 mcpegr.35.confirm_temperate:0 "然り。大人らしい振る舞いをすべきだ。"
 mcpegr.35.confirm_stubborn:0 "然り。まさにその通りだ。"
 mcpegr.35.confirm_patient:0 "然り。心配することはない。"
 mcpegr.35.temperate_change:0 "お前も大人らしくすべきだ！"
 mcpegr.35.stubborn_change:0 "遠慮なく大声で言えばいい！"
 mcpegr.35.patient_change:0 "もうしばらく待てばいいのだ！"
