l_japanese:
# ACOTW Compatch
trait_acotw_obscured:0 "隠れた者"
trait_acotw_obscured_desc:0 "このキャラクターは[diplomatic_range|E]の外にいるため、その生涯の詳細は確かめがたい。"
trait_acotw_obscured_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]は[diplomatic_range|E]の外にいるため、[ROOT.GetCharacter.GetHerHis]の事績の詳細は確かめがたい。"

#Commander Traits
trait_embattle_logistician: "兵站の専門家"
trait_embattle_logistician_1: "熟練の兵站官"
trait_embattle_logistician_2: "軍需総監"
trait_embattle_logistician_3: "兵站の大家"
trait_embattle_logistician_desc: "兵站の専門家が知っていることがひとつあるとすれば、それは補給をより長く持たせる方法だ――長ければ長いほど良い。"
trait_embattle_logistician_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip]が知っていることがひとつあるとすれば、それは補給をより長く持たせる方法だ――長ければ長いほど良い。"
trait_track_embattle_logistician: "兵站家"
trait_track_embattle_logistician_desc: "#help 軍を率いてマップ上を移動することで、この系統の経験を獲得できる。#!\n\n補給を制する者は戦争を制する。その軍は最も肝心な時に決して揺らがない。"

trait_embattle_military_engineer: "軍事技術者"
trait_embattle_military_engineer_1: "熟練の器械師"
trait_embattle_military_engineer_2: "破城の大家"
trait_embattle_military_engineer_3: "城を林のごとく砕く者"
trait_embattle_military_engineer_desc: "攻城兵器と防御施設について幅広い知識を持つ軍事技術者は、城壁に阻まれることがない。"
trait_embattle_military_engineer_character_desc: "攻城兵器と防御施設について幅広い知識を持つ[ROOT.GetCharacter.GetFirstNameNoTooltip]は、城壁に阻まれることがない。\n\n#weak [embattle|E]：副将から得た#!"
trait_track_embattle_military_engineer: "攻囲者"
trait_track_embattle_military_engineer_desc: "#help 攻囲を成功させることで、この系統の経験を獲得できる。#!\n\n戦争において、幾重もの防壁は軍の前に立ちはだかる乗り越えるべき試練である。"

trait_embattle_aggressive_attacker: "攻撃的な攻め手"
trait_embattle_aggressive_attacker_1: "大胆な前衛"
trait_embattle_aggressive_attacker_2: "恐れ知らずの先鋒"
trait_embattle_aggressive_attacker_3: "名高き陥陣の士"
trait_embattle_aggressive_attacker_desc: "敵の血以外に、攻撃的な攻め手を満たすものはない。"
trait_embattle_aggressive_attacker_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip]を満たすものは何もない。[ROOT.GetCharacter.GetHerHis]敵の血を除いては。\n\n#weak [embattle|E]：副将から得た#!"
trait_track_embattle_aggressive_attacker: "攻撃の専門家"
trait_track_embattle_aggressive_attacker_desc: "#help 自ら攻撃を仕掛けることで、この系統の経験を獲得できる。#!\n\n迅速な攻撃こそ最良の防御である。"

trait_embattle_unyielding_defender: "防御者"
trait_embattle_unyielding_defender_1: "揺るがぬ守り手"
trait_embattle_unyielding_defender_2: "不屈の防御者"
trait_embattle_unyielding_defender_3: "不滅の哨兵"
trait_embattle_unyielding_defender_desc: "防御者が知る金科玉律：敵はここで止まるのみ。"
trait_embattle_unyielding_defender_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip]が知る金科玉律：敵はここで止まるのみ。\n\n#weak [embattle|E]：副将から得た#!"
trait_track_embattle_unyielding_defender: "防御の専門家"
trait_track_embattle_unyielding_defender_desc: "#help 戦闘で防御することで、この系統の経験を獲得できる。#!\n\n砦が堅固かどうかは守り手の意志にかかっている。"

trait_embattle_forder: "渡渉者"
trait_embattle_forder_1: "河を渡る兵"
trait_embattle_forder_2: "渡し場を越える者"
trait_embattle_forder_3: "波を砕く者"
trait_embattle_forder_desc: "このキャラクターは水辺にいるとまるで我が家のようにくつろぎ、戦争において河川や海峡の渡河による優位ペナルティを受けない。"
trait_embattle_forder_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip]は水辺にいるとまるで我が家のようにくつろぎ、戦争において河川や海峡の渡河による優位ペナルティを受けない。\n\n#weak [embattle|E]：副将から得た#!"
trait_track_embattle_forder: "河川の専門家"
trait_track_embattle_forder_desc: "#help 海岸または河川沿いの州で戦うことで、この系統の経験を獲得できる。#!\n\n他の者が急流や渓谷を見る所に、彼らは勝利への道を見出す。"

trait_embattle_flexible_leader: "柔軟な指揮官"
trait_embattle_flexible_leader_1: "臨機応変の士"
trait_embattle_flexible_leader_2: "戦場の万能家"
trait_embattle_flexible_leader_3: "機動戦の大家"
trait_embattle_flexible_leader_desc: "このキャラクターは、防御側の軍が防御施設・地形・河川・海峡から得る優位を減らす術を知っている。"
trait_embattle_flexible_leader_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip]は、防御側の軍が防御施設・地形・河川・海峡から得る優位を減らす術を知っている。\n\n#weak [embattle|E]：副将から得た#!"
trait_track_embattle_flexible_leader: "機略の士"
trait_track_embattle_flexible_leader_desc: "#help 軍と戦うことで、この系統の経験を獲得できる。#!\n\nいかなる戦場においても、適応こそが生存の鍵である。"

trait_embattle_desert_warrior: "砂漠の戦士"
trait_embattle_desert_warrior_1: "砂丘の戦士"
trait_embattle_desert_warrior_2: "砂海を行く者"
trait_embattle_desert_warrior_3: "流砂の災い"
trait_embattle_desert_warrior_desc: "砂漠の烈日と酷暑は、このキャラクターの敵ではない。"
trait_embattle_desert_warrior_character_desc: "砂漠の烈日と酷暑は、[ROOT.GetCharacter.GetFirstNameNoTooltip]の敵ではない。\n\n#weak [embattle|E]：副将から得た#!"
trait_track_embattle_desert_warrior: "砂漠戦の専門家"
trait_track_embattle_desert_warrior_desc: "#help 砂漠・砂漠山地・オアシス・乾燥地帯で戦うことで、この系統の経験を獲得できる。#!\n\n広大で過酷な砂漠では、忍耐強き者が何者にも勝る。"

trait_embattle_jungle_stalker: "密林の追跡者"
trait_embattle_jungle_stalker_1: "蔓の刃"
trait_embattle_jungle_stalker_2: "樹冠の狩人"
trait_embattle_jungle_stalker_3: "密林の影"
trait_embattle_jungle_stalker_desc: "密林の生い茂る木々はすべて、このキャラクターの味方である。"
trait_embattle_jungle_stalker_character_desc: "密林の生い茂る木々はすべて、[ROOT.GetCharacter.GetFirstNameNoTooltip]の味方である。\n\n#weak [embattle|E]：副将から得た#!"
trait_track_embattle_jungle_stalker: "密林戦の専門家"
trait_track_embattle_jungle_stalker_desc: "#help 密林地形で戦うことで、この系統の経験を獲得できる。#!\n\n天日を遮る密林には潜伏の達人が身を潜め、いつでも暗がりから襲いかかる構えでいる。"

trait_embattle_reaver: "略奪者"
trait_embattle_reaver_1: "奪掠者"
trait_embattle_reaver_2: "掠奪者"
trait_embattle_reaver_3: "恐怖の化身"
trait_embattle_reaver_desc: "略奪者は勝利と同じほど戦利品を渇望する。価値あるものが存在するなら、略奪者は必ずそれを見つけ出す。"
trait_embattle_reaver_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip]は勝利と同じほど戦利品を渇望する。価値あるものが存在するなら、[ROOT.GetCharacter.GetSheHe]は必ずそれを見つけ出す。\n\n#weak [embattle|E]：副将から得た#!"
trait_track_embattle_reaver: "略奪者"
trait_track_embattle_reaver_desc: "#help 居住地の略奪を成功させることで、この系統の経験を獲得できる。#!\n\n略奪者の行く所、すべては戦火と征服によって深く作り変えられる。"

trait_embattle_reckless: "無謀"
trait_embattle_reckless_1: "向こう見ずな指揮官"
trait_embattle_reckless_2: "戦場の賭博師"
trait_embattle_reckless_3: "荒ぶる心"
trait_embattle_reckless_desc: "無謀な指揮官は、ひとたび優位を見出せば必ずそれを固く掴んで離さない。"
trait_embattle_reckless_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip]は、ひとたび優位を見出せば必ずそれを固く掴んで離さない。\n\n#weak [embattle|E]：副将から得た#!"
trait_track_embattle_reckless: "大胆な指揮官"
trait_track_embattle_reckless_desc: "#help より大規模な軍と戦うことで、この系統の経験を獲得できる。#!\n\n運命は、偉大な事業のためにすべてを賭す者に微笑む。"

trait_embattle_holy_warrior: "信心の剣"
trait_embattle_holy_warrior_1: "神々の刃"
trait_embattle_holy_warrior_2: "聖戦士"
trait_embattle_holy_warrior_3: "信仰の勇士"
trait_embattle_holy_warrior_desc: "正義の熱情が燃え盛り、信仰の剣は異教徒がことごとく滅びるまで決して止まらない。"
trait_embattle_holy_warrior_character_desc: "正義の狂熱が燃え、[ROOT.GetCharacter.GetFirstNameNoTooltip]は異教徒がすべて打ち倒されるまで休むことはない。\n\n#weak [embattle|E]：副将から得た#!"
trait_track_embattle_holy_warrior: "狂信者"
trait_track_embattle_holy_warrior_desc: "#help 他の宗派の敵と戦うことで、この系統の経験を獲得できる。#!\n\n信仰によって心を鍛えれば、打ち勝てぬ敵も、怯むべき戦いもない。"

trait_embattle_open_terrain_expert: "開けた地形の専門家"
trait_embattle_open_terrain_expert_1: "野の見張り"
trait_embattle_open_terrain_expert_2: "曠野の戦略家"
trait_embattle_open_terrain_expert_3: "平原の主"
trait_embattle_open_terrain_expert_desc: "開けた場所や広い空間に出ると、このキャラクターはまるで我が家のようにくつろぎ、すぐさま戦闘にそれを活かす。"
trait_embattle_open_terrain_expert_character_desc: "開けた場所や広い空間に出ると、[ROOT.GetCharacter.GetFirstNameNoTooltip]はまるで我が家のようにくつろぎ、すぐさま戦闘にそれを活かす。\n\n#weak [embattle|E]：副将から得た#!"
trait_track_embattle_open_terrain_expert: "開けた地形の専門家"
trait_track_embattle_open_terrain_expert_desc: "#help 平原・農地・草原地形で戦うことで、この系統の経験を獲得できる。#!\n\n開けた場所は、無限の機動と勝利の機会を我らに与えてくれる。"

trait_embattle_rough_terrain_expert: "険しい地形の専門家"
trait_embattle_rough_terrain_expert_1: "道を拓く先駆者"
trait_embattle_rough_terrain_expert_2: "高地の戦術家"
trait_embattle_rough_terrain_expert_3: "群峰の主"
trait_embattle_rough_terrain_expert_desc: "険しい地形は、それを利用して戦闘で優位に立てる者にとっては強力な武器となりうる。"
trait_embattle_rough_terrain_expert_character_desc: "険しい地形は、それを利用して戦闘で優位に立てる者にとっては強力な武器となりうる。\n\n#weak [embattle|E]：副将から得た#!"
trait_track_embattle_rough_terrain_expert: "険しい地形の専門家"
trait_track_embattle_rough_terrain_expert_desc: "#help 丘陵・山岳・湿地地形で戦うことで、この系統の経験を獲得できる。#!\n\n最も過酷な環境において、勝利は困難に立ち向かう者のものとなる。"

trait_embattle_forest_fighter: "森の闘士"
trait_embattle_forest_fighter_1: "林間の追跡者"
trait_embattle_forest_fighter_2: "森の見張り"
trait_embattle_forest_fighter_3: "森の主"
trait_embattle_forest_fighter_desc: "森を障害と見る者もいるが、このキャラクターは森を好機と見る。"
trait_embattle_forest_fighter_character_desc: "森を障害と見る者もいるが、[ROOT.GetCharacter.GetFirstNameNoTooltip]は森を好機と見る。\n\n#weak [embattle|E]：副将から得た#!"
trait_track_embattle_forest_fighter: "森林戦の専門家"
trait_track_embattle_forest_fighter_desc: "#help 森林または針葉樹林地形で戦うことで、この系統の経験を獲得できる。#!\n\n林の中では、あらゆる木陰が盾となり、あらゆる枝が味方となる。"

trait_embattle_cautious_leader: "慎重な指揮官"
trait_embattle_cautious_leader_1: "忍耐強き策士"
trait_embattle_cautious_leader_2: "用心深い指揮官"
trait_embattle_cautious_leader_3: "慎重さの大家"
trait_embattle_cautious_leader_desc: "慎重な指揮官は戦闘で不要な危険を注意深く避けるが、そのために得られたはずの利益も失う。"
trait_embattle_cautious_leader_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip]は戦闘で不要な危険を注意深く避けるが、そのために得られたはずの利益も失う。\n\n#weak [embattle|E]：副将から得た#!"
trait_track_embattle_cautious_leader: "慎重な指揮官"
trait_track_embattle_cautious_leader_desc: "#help より大規模な軍と戦うことで、この系統の経験を獲得できる。#!\n\n忍耐と緻密さこそが一歩一歩を計画通りに進め、損失を最小に抑える。"

trait_embattle_organizer: "組織者"
trait_embattle_organizer_1: "戦術家"
trait_embattle_organizer_2: "急行軍の立案者"
trait_embattle_organizer_3: "運動戦の大家"
trait_embattle_organizer_desc: "有能な者の手にかかれば、よく組織された軍はいかなる状況でも速やかに敵を打ち破る。"
trait_embattle_organizer_character_desc: "有能な者の手にかかれば、よく組織された軍はいかなる状況でも速やかに敵を打ち破る。\n\n#weak [embattle|E]：副将から得た#!"
trait_track_embattle_organizer: "行軍者"
trait_track_embattle_organizer_desc: "#help 軍を率いてマップ上を移動することで、この系統の経験を獲得できる。#!\n\nよく連携した部隊は迅速に動き、敵を正確に攻撃する。"

trait_embattle_winter_soldier: "冬将軍"
trait_embattle_winter_soldier_1: "霜雪の見張り"
trait_embattle_winter_soldier_2: "雪原の古強者"
trait_embattle_winter_soldier_3: "厳寒の主"
trait_embattle_winter_soldier_desc: "このキャラクターは厳冬に鍛えられ、それを自らの優位に変える術を知っている。"
trait_embattle_winter_soldier_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip]は厳冬に鍛えられ、それを[ROOT.GetCharacter.GetHerHis]優位に変える術を知っている。\n\n#weak [embattle|E]：副将から得た#!"
trait_track_embattle_winter_soldier: "冬季戦の専門家"
trait_track_embattle_winter_soldier_desc: "#help 冬の影響を受けている州で戦うことで、この系統の経験を獲得できる。#!\n\n厳寒は敵ではない――忍耐強き者にとって、厳寒は味方なのだ。"

#Commander Traits (cultural traditions)
trait_embattle_sea_raider: "海の襲撃者"
trait_embattle_sea_raider_desc: "海の襲撃者は荒れ狂う大波を恐れず、大胆かつ卓越した航海術を駆使して、守りのない海岸を何の前触れもなく襲う。"
trait_embattle_sea_raider_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip]は荒れ狂う大波を恐れず、大胆かつ卓越した航海術を駆使して、守りのない海岸を何の前触れもなく襲う。\n\n#weak [embattle|E]：副将から得た#!"

