l_japanese:
 hd_peach_garden.0001.t:0 "桃園の誓い"
 hd_peach_garden.0001.desc:0 "昨日、あなたはまだ募兵の高札の下に立ち、兵を募る金がないことを嘆いていた。張飛の一喝に問いただされ、あなたは酒肆に引き込まれた。彼は家財を出して郷勇を募ると申し出た。続いて店に入ってきた関羽は、もともと義軍に加わろうと駆けつけた者であったが、あなたの志を聞くと、席を移して共に座った。話が盛り上がると、翼徳はあなたたちを自分の荘園に招き、義兄弟の契りを結ぼうと持ちかけた。\n\n今、荘園の裏の桃の花は満開である。黒牛白馬の祭礼はすでに整い、香煙が供物台の前からゆらゆらと立ち昇っている。昨日、家財を傾けて事を挙げると言った翼徳は笑みを収め、雲長は衣を正して傍らに立ち、あなたが進み出るのを待っている。\n\nあなたはうつむいて襟を整えた。漢室の宗親の身でありながら、今に至るまで筵を織り草鞋を売って老母を養うほかなかった。今、家財を出そうという者がおり、命を託そうという者がいる。どうしてそれに背くことができようか。\n\nあなたは二人の間にひざまずいた。この香が燃え尽きれば、あなたたちはもはや、たまたま同じ道で義軍に加わろうとした見知らぬ者同士ではなくなる。"
 hd_peach_garden.0001.a:0 "同年同日に生まれることを求めず、ただ同年同日に死なんことを願う"
 hd_peach_garden.0002.t:0 "義旗初めて立つ"
 hd_peach_garden.0002.desc:0 "結義の酒器を片付けて間もなく、門の外に義軍を援助したいという客がやって来た。中山の大商人張世平と蘇双が馬を商って涿郡を通りかかり、あなたを見て非凡な人物と思い、金帛を手厚く贈ったのである。郷里の子弟で噂を聞いて加わりに来た者も、すでに三千人に達していた。\n\n庭は一気に混み合った。どこで武器を受け取るのかと尋ねる者もいれば、部隊の割り振りを待つ者もおり、いつ飯にありつけるのかだけを知りたがる者もいる。兵を起こして民を救うという言葉を、あなたはすでに口にした。身家性命をあなたの手に預けてくれたこの者たちを、なおさら失望させるわけにはいかない。\n\nあなたは援助を受け取り、まず名簿を整理するよう命じた。義旗の下に、真に行軍できる隊伍があるべき時が来たのだ。"
 hd_peach_garden.0002.a:0 "この厚い援助を受け、義軍を整える。"
 hd_liu_bei_sponsored_army:0 "中山義商の義兵"
