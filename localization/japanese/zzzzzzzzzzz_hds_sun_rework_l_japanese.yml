l_japanese:
 hds_sq_base_army:0 "孫氏討逆の旧部"
 hds.5100.t:0 "峴山に殞命す"
 hds.5100.desc:0 "袁術の一通の軍令により、あなたは南下して劉表を討つことになった。道中連戦連勝し、漢水を渡り、襄陽を水も漏らさぬほどに包囲した。\n\nこの夜、あなたはわずか数騎を連れて陣を出て、月明かりに乗じて峴山に登り、城中の様子をうかがおうとした。山道は狭く、竹林は鬱蒼として、あたりは異様なほど静まり返っていた。\n\n弓弦の音が林の中から一斉に響いた。荊州の伏兵はとうにここで待ち構えていたのだ。馬首を返すにはもう遅かった。乱れ飛ぶ矢の中、あなたが最後に目にしたのは、襄陽の城壁の上で揺らめく火の光であった。"
 hds.5100.a:0 "伯符……江東は、お前に任せたぞ……"
 hds.4100.t:0 "江東を継ぐ"
 hds.4100.desc:0 "兄上はあまりにも突然逝ってしまった。前日にはまだ練兵場で弓を引いていたのに、今日には陣門に白い幡がびっしりと掛けられている。\n\n帳下の諸将は皆あなたを見つめている。兄上は臨終の際に印綬をあなたの手に渡し、ただ一言こう言った。「江東の衆を挙げ、両陣の間で機を決し、天下と覇を争うことにかけては、お前は私に及ばない。賢者を挙げ能ある者を任じ、各々に心を尽くさせて江東を保つことにかけては、私はお前に及ばない」と。\n\nあなたはその印綬を固く握りしめた。父と兄が歩み終えられなかった道を、今度はあなたが歩むのだ。"
 hds.4100.a:0 "父兄の業を継ぎ、江東を定める。"
