 uuii_bm_group_184: "漢末風雲"
 bm_uuii_184: "184年"
 bm_uuii_184_desc: "光和七年、歳は甲子にあり。漢室が国を享けてすでに四百年近く、洛陽の宮中では宦官と外戚が陰に陽に争い、売官鬻爵の風が朝野に蔓延している。州郡では豪強が田土を兼併し、連年の災疫と徭役が、とうに民を絶境へと追い詰めていた。\n\n太平道の符水と経文は、青・徐・幽・冀・荊・揚・兗・豫の八州にひそかに広まり、三十六方の信徒はただ一声の号令を待つばかりである。都の寺門や州郡の官府の壁には、いつの間にか白土で「甲子」の二字が書き連ねられていた。\n\n#bold 嵐が迫っている。あなたは傾きかけた漢室を支えるのか、それとも時勢に乗じて立ち上がり、新たな天地を開くのか？#!"
 bm_hd_190: "董卓討伐連合"
 bm_hd_190_desc: "初平元年、歳は庚午にあり。董卓は少帝を廃して献帝を立て、自ら相国を称し、兵を放って洛陽を略奪させた。関東の州牧・太守たちは相次いで挙兵し、渤海太守の袁紹を盟主に推して、十余路の諸侯が会盟し、逆賊討伐を誓った。\n\n董卓は天子を擁して司隷に拠り、西涼の鉄騎は関中を縦横に駆ける。涼州の諸将はそれぞれ勝手に振る舞い、并州は主を失って郡県は散り散りである。春になれば、連合軍は北に河内へ、東に成皋へと進み、洛陽と虎牢関がまず矢面に立つ。\n\n#bold 漢の命運は風前の灯である。あなたは義兵を率いて逆賊を討つのか、乱に乗じて割拠するのか、それともこの争乱の世で別の志を抱くのか？#!"
uuii_book_cao_cao_name_subheading: "治世の能臣、乱世の奸雄"
uuii_book_liu_bei_name_subheading: "その徳は昭昭、その志は烈烈"
uuii_book_yuan_shao_name_subheading: "高風義軌、海内に冠たり"
uuii_book_sun_jian_name_subheading: "破虜将軍"
uuii_book_zhang_jiao_name_subheading: "大賢良師"
 uuii_book_cao_cao_name_desc: "曹操は陳留の己吾で家財を尽くして郷勇五千を募り、董卓討伐の兵を挙げた。張邈・衛茲らと呼応するが、兵は少なく地は狭く、陳留の一隅に身を寄せるしかない。\n\n関東連合は名ばかりの同盟で、盟主の袁紹は権勢を握ることに執心し、諸侯は兵を留めて様子見をし、誰も先に動こうとしない。曹操は気が気でないが、この小さな根拠地で兵を鍛え、時を待つほかない。\n\n#bold あなたは群雄の中に足場を築き、いつの日か天子を奉じて諸侯に号令できるだろうか？#!"

 uuii_book_yuan_shao_name_desc: "汝南袁氏は四世三公、門生故吏は天下に満ちている。何進が殺され董卓が洛陽に入ると、袁紹は官を捨てて東へ出、関東の諸侯に盟主に推された。渤海一郡に拠り、十余路の兵馬を号令する。\n\n連合の声勢は大きいが、兵糧・名分、そして諸侯同士の猜疑が、常に盟主を縛る。冀州牧の韓馥はすぐ近くにおり、助けにもなれば火種にもなる。\n\n#bold あなたは連合をまとめて董卓を破り、汝南袁氏を権力の頂に押し上げられるだろうか？#!"

 uuii_book_liu_bei_name_desc: "劉備は中山靖王の後裔を自称し、若いころは筵を織り履を売って暮らし、のち盧植のもとで学んだ。黄巾が蜂起すると、関羽・張飛と桃園で義を結び、郷勇を募って涿郡と幽州の間を駆け回った。\n\n天下は大いに乱れ、諸侯が並び立つ今も、彼は領地を持たず、手勢は数百の義勇にすぎない。それでも公孫瓚や陶謙らとは交わりがある。乱世において、宗室の名分と旧友の情義こそが最大の元手である。\n\n#bold あなたは無一物から義士を集め、自らの足場を得て、ひいては漢室を中興できるだろうか？#!"

 uuii_book_sun_jian_name_desc: "孫堅は呉郡富春の出で、十七歳で海賊を追い払って勇名を馳せた。黄巾の乱では朱儁に従って戦功を立て、のち長沙太守となって区星の乱を平定した。\n\n関東で挙兵すると、孫堅は北上して荊州刺史王叡を死に追い込み、南陽太守張咨を斬り、江東の子弟を率いて魯陽の袁術のもとに身を寄せた。自分の領地は一寸もない。連合軍で最も鋭い刃だが、他人に従う身で、何かと制約を受ける。\n\n#bold あなたは乱世で一介の武将から、江東孫氏の開祖となれるだろうか？#!"

 uuii_book_zhang_jiao_name_desc: "張角は民の苦しみを目の当たりにし、自ら大賢良師と号して黄老の道を奉じ、符水と呪説で人々の病を癒した。十余年の間に太平道の信徒は八州に広がり、三十六方に分かれ、大方は一万余人、小方は六、七千人を数え、みな大賢良師を救世の人と仰いでいる。\n\n蜂起の日はすでに定まり、京師の内応と各方の渠帥がひそかに準備を進めている。しかし加わる者が増えるほど秘密は守りにくくなり、朝廷に察知されれば、すべての布石が水泡に帰しかねない。\n\n#bold 蒼天已に死す、黄天当に立つべし。黄天の名のもとに、天命を書き換えることができるか？#!"

