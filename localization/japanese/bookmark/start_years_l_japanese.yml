 bm_hd_190_yuan_shu: "袁術"
 bm_hd_190_yuan_shu_subheading: "後将軍"
 bm_hd_190_yuan_shu_desc: "袁術、字は公路。汝南袁氏の出で、司空袁逢の子。若くして侠気で知られ、河南尹・虎賁中郎将を歴任した。董卓が廃立を行い、彼を後将軍に任じようとすると、袁術は禍を恐れて南陽へ出奔した。折しも北上した孫堅が南陽太守張咨を斬ったため、袁術は南陽を手に入れ、孫堅も江東の子弟を率いて彼に帰属した。\n\n南陽の戸口は数百万、銭糧は豊かで、関東諸侯の中で最も富裕な地盤である。だが袁術は盟主袁紹と以前から不仲であり、嫡庶の争いと家門の驕りは、いずれ同族の兄弟を不倶戴天の敵に変えるだろう。\n\n#bold 袁紹を圧倒し、「漢に代わる者は当塗高」の讖を自らの身に応じさせることができるか？#!"
 bm_hd_190_liu_chong: "劉寵"
 bm_hd_190_liu_chong_subheading: "陳王"
 bm_hd_190_liu_chong_desc: "劉寵は漢の明帝の玄孫で、陳王の位を継いだ。弩の名手で、十発十中、矢はすべて同じ一点に当たったという。黄巾が蜂起し、郡県の長吏が次々と城を捨てて逃げる中、陳王だけは数千張の強弩を持ち出して都亭に兵を屯させた。国人は王の弓の腕を知っていたので背こうとせず、陳国は無事に保たれ、身を寄せた民は十万余りに上った。\n\n関東の諸侯が董卓討伐に立つと、劉寵も兵を率いて陽夏に駐屯し、輔漢大将軍を自称した。国相の駱俊は恩威を併せ用いて陳国の倉を満たしたが、その豊かさは糧に乏しい近隣の諸侯の目を引いている。\n\n#bold 数千の強弩で陳国を守り抜き、群雄のひしめく中で宗藩を保ち、ひいては漢室を扶けることができるか？#!"
