l_japanese:

 uuii_bm_group_184: "漢末風雲"
 bm_uuii_184: "184年"
 bm_uuii_184_desc: "光和七年、歳は甲子にあり。漢室が国を享けてすでに四百年近く、洛陽の宮中では宦官と外戚が陰に陽に争い、売官鬻爵の風が朝野に蔓延している。州郡では豪強が田土を兼併し、連年の災疫と徭役が、とうに民を絶境へと追い詰めていた。\n\n太平道の符水と経文は、青・徐・幽・冀・荊・揚・兗・豫の八州にひそかに広まり、三十六方の信徒はただ一声の号令を待つばかりである。都の寺門や州郡の官府の壁には、いつの間にか白土で「甲子」の二字が書き連ねられていた。\n\n#bold 嵐が迫っている。あなたは傾きかけた漢室を支えるのか、それとも時勢に乗じて立ち上がり、新たな天地を開くのか？#!"
uuii_book_cao_cao_name_subheading: "治世の能臣、乱世の奸雄"
uuii_book_liu_bei_name_subheading: "その徳は昭昭、その志は烈烈"
uuii_book_yuan_shao_name_subheading: "高風義軌、海内に冠たり"
uuii_book_sun_jian_name_subheading: "破虜将軍"
uuii_book_zhang_jiao_name_subheading: "大賢良師"
 uuii_book_cao_cao_name_desc: "曹操は沛国曹氏の出で、才略は人に優れていたが、祖父の曹騰が宦官であったため、たびたび清流の非難を浴びた。顕赫たる家柄は彼に仕途を開いたが、同時に生涯拭い去れぬ出自ともなった。\n\n若くして洛陽北部尉となると、禁を犯した権勢ある宦官の親族を棒で打ち殺し、これにより名声が高まった。その後も幾度も上書して時弊を直言したが、朝廷はこれを用いることができなかった。漢室が日ごとに衰えていくのを目にしながらも、曹操の胸には今なお報国の志が燃えている。\n\n#bold あなたは治世の能臣となるのか、それとも乱世の奸雄となるのか？#!"

 uuii_book_yuan_shao_name_desc: "汝南袁氏は四世三公、門生故吏は天下に満ちている。袁紹は家の名声と、身を低くして士に下る評判によって、早くから士人の注目を集める人物となり、洛陽の権力の中枢で水を得た魚のように振る舞っている。\n\n宮中の宦官と外戚の争いは日増しに激しくなり、朝野は誰かが先に動くのを待っている。袁紹には群士を糾合する声望があるが、その声望をどこに用いるかを決めねばならない。\n\n#bold 天下の英傑を集め、この風雨に揺れる世で汝南袁氏を権力の頂点に押し上げることができるか？#!"

 uuii_book_liu_bei_name_desc: "劉備は中山靖王の後裔を自称するが、この宗室の一支はとうに没落していた。幼くして父を亡くし、母とともに筵を織り履を売って生計を立てたが、同族の援助を得て、公孫瓚とともに盧植の門下で学ぶことができた。\n\n辺境の幽州では人心が揺らぎ、不穏な空気が四方に広がっている。劉備は以前から漢室を扶ける志を抱き、また豪侠と交わるのを好んだため、郷里の若者たちは争って彼に付き従った。だが宗室の後裔という名分と、若き日の遊侠で積んだ声望のほかには、天下を左右するに足る力を持ってはいない。\n\n#bold 涿郡から歩み出し、ともに肩を並べる者たちを集め、自らの立つ地を勝ち取り、ひいては漢室を中興できるか？#!"

 uuii_book_sun_jian_name_desc: "孫堅は呉郡富春の出で、十七歳のとき単身で商旅を襲う海賊を追い散らし、以来果敢さで名を知られた。その後、郡兵に従って会稽の許昌の乱を平定し、塩涜・盱眙の県丞を歴任して、今は下邳に転任している。\n\n北方の動乱はまもなく各州に波及するだろう。孫堅は乱局における自らの立場を慎重に定めねばならない。漢廷の命を奉じて四方に転戦するのか、それとも時勢に乗じて名を揚げ、孫氏のためにより遠大な前途を切り開くのか？\n\n#bold 一歩一歩足場を固め、乱世に江東孫氏の基業を築くことができるか？#!"

 uuii_book_zhang_jiao_name_desc: "張角は民の苦しみを目の当たりにし、自ら大賢良師と号して黄老の道を奉じ、符水と呪説で人々の病を癒した。十余年の間に太平道の信徒は八州に広がり、三十六方に分かれ、大方は一万余人、小方は六、七千人を数え、みな大賢良師を救世の人と仰いでいる。\n\n蜂起の日はすでに定まり、京師の内応と各方の渠帥がひそかに準備を進めている。しかし加わる者が増えるほど秘密は守りにくくなり、朝廷に察知されれば、すべての布石が水泡に帰しかねない。\n\n#bold 蒼天已に死す、黄天当に立つべし。黄天の名のもとに、天命を書き換えることができるか？#!"

