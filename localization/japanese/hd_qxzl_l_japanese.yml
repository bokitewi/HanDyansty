l_japanese:
 hd_qxzl.0001.t:0 "群雄割拠"
 hd_qxzl.0001.desc:0 "董卓討伐の盟約が解散してから、各地から届く号令はますます食い違うようになった。かつて共に兵を挙げた者たちはそれぞれ本拠へ帰り、朝廷の文書は今も行き交っているが、実際に兵馬を動かせるのは、たいてい各家が握る銭と兵糧であった。\n\nあなたにも自らの属吏と治下の民がいる。旧主に仕え続ければ、従来の名分によって上下の秩序を保てる。だがここで節制を離れれば、治める地の安危はすべて自らが負うことになり、何事も上からの返答を待つわけにはいかなくなる。\n\n机の前で、ある者が尋ねた。次の文書はやはりどこへ送るべきか、と。あなたはまだ封をしていない書状を見つめ、悟った。今日の決断は一言の大言壮語にあるのではない。これから先の一つ一つの命令に、いったい誰が印を押すのか――そこにあるのだと。"
 hd_qxzl.0001.a:0 "自立して一家を構え、もはや人の制約は受けぬ。"
 hd_qxzl.0001.b:0 "君臣の分は、軽々しく捨てられぬ。"
 hd_qxzl_independence_tt:0 "あなたはこれより旧主の節制を離れ、一方に自立する。"
 hd_qxzl_ineligible_tt:0 "時勢は移り変わり、自立の件はもはや論ずるに及ばない。"
