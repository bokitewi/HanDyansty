 HD_UNIFICATION_FULL_VICTORY:0 "攻撃側は防衛側本人が保持する称号をすべて奪い、その配下の封臣はことごとく攻撃側に帰順する。"
 HD_UNIFICATION_WHITE_PEACE:0 "双方とも兵を収め、それぞれの領土を守る。攻撃側の威信がやや損なわれる。"
 HD_UNIFICATION_DEFEAT:0 "攻撃側は敗れて引き下がり、防衛側に賠償金を支払わねばならない。威信と正統性がともに損なわれ、防衛側の声威は大いに高まる。"
 HD_UNIFICATION_REGIONAL_INVALIDATED:0 "攻撃側がもはや中国の地を領有する独立した天朝の主ではないか、目標の中に防衛側から奪える土地がもはやない。"
 HD_UNIFICATION_FULL_INVALIDATED:0 "攻撃側がもはや天下に号令するに足りないか、一方が中国の地をすべて失ったか、防衛側がもはや独立していない。"
