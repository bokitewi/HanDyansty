 HD_PARTY_ATTITUDE_SHIZU_TT: "#T 世族の君主に対する態度：[SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_shizu_attitude').GetFlagName, 'support' ), 'hd_party_attitude_support_name', SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_shizu_attitude').GetFlagName, 'oppose' ), 'hd_party_attitude_oppose_name', 'hd_party_attitude_neutral_name' ) )]#!\n擁護スコア：[Character.MakeScope.Var('hd_party_shizu_score').GetValue|0]（≥ 50 で擁護に、≤ −50 で対抗に転じる。擁護中は 20 未満、対抗中は −20 超で中立に戻る）\n\n擁護時に君主が得るもの：直轄領の税収、威信と正統性の獲得 #P +10%#!、首都の開発度と統制度の増加 #P +0.1#!\n対抗時に君主が被るもの：直轄領の税収、威信と正統性の獲得 #N −15%#!、首都の開発度と統制度の増加 #N −0.15#!\n\n#weak 一党の勢力が朝廷の一割に満たなければ、その向背は大局に関わらない。#!"
