l_japanese:
 HD_PARTY_GROUP_NAME_HUANGUAN: "宦官"
 HD_PARTY_GROUP_NAME_WAIQI: "外戚"
 HD_PARTY_GROUP_NAME_WUXUN: "武勲"
 HD_PARTY_GROUP_NAME_SHIZU: "世族"
 HD_PARTY_GROUP_NAME_HANMEN: "寒門"
 HD_PARTY_STANCE_ZUNWANG_TT: "#T 尊王#!\nこの党は君主を尊ぶ。党員は派閥を結ばず、兵を挙げて上に逆らうこともなく、主君への好感度 #P +15#!、主君に対して陰で工作を仕掛けることもまずない。主君がその党員を捕縛する際も抵抗に遭うことは少ない。党内の武臣は君主に従って出征することを厭わず、文臣が総督に就けば効率 #P +10%#!。その党員が封臣である場合、多くは「宮廷礼制」の[vassal_stance|E]を取る。"
 hd_party_stance_zunwang: "尊王"
 HD_PARTY_STANCE_KAITUO_TT: "#T 開拓#!\nこの党は領土の拡張を強く主張する。主君への請願や国政の議論では、軍の拡充、軍鎮の増設、保護国の拡大を求めることが多い。その党員が封臣である場合、多くは「尚武好戦」の[vassal_stance|E]を取る。"
 hd_party_stance_kaituo: "開拓"
 HD_PARTY_STANCE_JINQU_TT: "#T 進取#!\nこの党は利を興し弊を除くことを強く主張する。請願や政議では官署の拡充、科挙による登用、俸禄の増額を求めることが多い。その党員が封臣である場合、多くは「郷土本位」の[vassal_stance|E]を取る。"
 hd_party_stance_jinqu: "進取"
 HD_PARTY_STANCE_SHOUJIU_TT: "#T 守旧#!\nこの党は祖法の厳守を強く主張する。請願や政議では致仕の法、諸曹の用度、任官資格に着目することが多い。その党員が封臣である場合、多くは「名利追求」の[vassal_stance|E]を取る。"
 hd_party_stance_shoujiu: "守旧"
 HD_PARTY_STANCE_ZHONGLI_TT: "#T 中立#!\nこの党は争いに関わらず、朝政に対して偏った主張を持たない。"
 hd_party_stance_zhongli: "中立"
 HD_PARTY_RELATION_COOP_TT: "#T 協力#!\n両党の立場が近い（進取と開拓、中立と守旧、尊王と君主擁護派）。両党の党魁とそれぞれの上位三名の要人は互いに親しく、相互に好感度 #P +10#!。"
 HD_PARTY_RELATION_NONE_TT: "#T なし#!\n両党は対立もせず、協力もしない。"
 HD_PARTY_RELATION_HOSTILE_TT: "#T 対立#!\n両党の立場が相反する（進取と守旧、開拓と守旧、尊王と君主対抗派）。両党の党魁とそれぞれの上位三名の要人は互いに嫌悪し、相互に好感度 #N −15#!。党争がこれによって起こることもある。"
 HD_PARTY_POLICY_BAN_TT: "#T 政治工作：禁圧#!\nこの党を禁錮し、党員の仕官を許さない。その成員の影響力 #N −50%#!、威信と正統性の獲得 #N −30%#!、任命と継承のスコア #N −50#!、君主への好感度 #N −30#!。君主はその党員を自由に捕縛でき、党員とその門下の廷臣もより出奔しやすくなる。\n毎月の費用：影響力 3（影響力のない統治形態では威信 5）。\n\n#weak 政令を下した後、五年間は変更できない（中立に戻す場合を除く）。#!"
 HD_PARTY_POLICY_RESTRICT_TT: "#T 政治工作：制限#!\nこの党を抑圧する。その成員の影響力 #N −20%#!、威信と正統性の獲得 #N −10%#!、任命と継承のスコア #N −20#!、君主への好感度 #N −10#!。\n毎月の費用：影響力 1（影響力のない統治形態では威信 2）。\n\n#weak 政令を下した後、五年間は変更できない（中立に戻す場合を除く）。#!"
 HD_PARTY_POLICY_NEUTRAL_TT: "#T 政治工作：中立#!\n扶助も抑圧もせず、自然に任せる。費用はかからない。\n\n#weak 政令を下した後、五年間は変更できない（中立に戻す場合を除く）。#!"
 HD_PARTY_POLICY_PROMOTE_TT: "#T 政治工作：促進#!\nこの党を支援する。その成員の影響力 #P +20%#!、威信と正統性の獲得 #P +10%#!、任命と継承のスコア #P +20#!、君主への好感度 #P +10#!。\n毎月の費用：影響力 1（影響力のない統治形態では威信 2）。\n\n#weak 政令を下した後、五年間は変更できない（中立に戻す場合を除く）。#!"
 HD_PARTY_ATTITUDE_HUANGUAN_TT: "#T 宦官の君主に対する態度：[SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_huanguan_attitude').GetFlagName, 'support' ), 'hd_party_attitude_support_name', SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_huanguan_attitude').GetFlagName, 'oppose' ), 'hd_party_attitude_oppose_name', 'hd_party_attitude_neutral_name' ) )]#!\n擁護スコア：[Character.MakeScope.Var('hd_party_huanguan_score').GetValue|0]（≥ 50 で擁護に、≤ −50 で対抗に転じる。擁護中は 20 未満、対抗中は −20 超で中立に戻る）\n\n擁護時に君主が得るもの：影響力獲得 #P +15%#!、恐怖の基準値 #P +10#!、敵対工作の成功率 #P +10%#!\n対抗時に君主が被るもの：影響力獲得 #N −22.5%#!、恐怖の基準値 #N −15#!、敵対工作の成功率 #N −15%#!\n\n#weak 一党の勢力が朝廷の一割に満たなければ、その向背は大局に関わらない。#!"
 HD_PARTY_PANEL_POWER_HUANGUAN: "勢力 [Character.MakeScope.Var('hd_party_huanguan_power').GetValue|0] · 占有率 [Character.MakeScope.Var('hd_party_huanguan_share').GetValue|0]%"
 HD_PARTY_PANEL_SATISFACTION_HUANGUAN: "満足度：[Character.MakeScope.Var('hd_party_huanguan_satisfaction').GetValue|0]"
 HD_PARTY_OVERVIEW_NUMBERS_HUANGUAN: "満足 [Character.MakeScope.Var('hd_party_huanguan_satisfaction').GetValue|0] · 占有率 [Character.MakeScope.Var('hd_party_huanguan_share').GetValue|0]%"
 HD_PARTY_ATTITUDE_WAIQI_TT: "#T 外戚の君主に対する態度：[SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_waiqi_attitude').GetFlagName, 'support' ), 'hd_party_attitude_support_name', SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_waiqi_attitude').GetFlagName, 'oppose' ), 'hd_party_attitude_oppose_name', 'hd_party_attitude_neutral_name' ) )]#!\n擁護スコア：[Character.MakeScope.Var('hd_party_waiqi_score').GetValue|0]（≥ 50 で擁護に、≤ −50 で対抗に転じる。擁護中は 20 未満、対抗中は −20 超で中立に戻る）\n\n擁護時に君主が得るもの：請求権者派閥の不満増加 #P −30%#!、総督の効率 #P +5%#!、直属の封臣と廷臣からの好感度 #P +5#!\n対抗時に君主が被るもの：請求権者派閥の不満増加 #N +45%#!、総督の効率 #N −7.5%#!、直属の封臣と廷臣からの好感度 #N −7.5#!\n\n#weak 一党の勢力が朝廷の一割に満たなければ、その向背は大局に関わらない。#!"
 HD_PARTY_PANEL_POWER_WAIQI: "勢力 [Character.MakeScope.Var('hd_party_waiqi_power').GetValue|0] · 占有率 [Character.MakeScope.Var('hd_party_waiqi_share').GetValue|0]%"
