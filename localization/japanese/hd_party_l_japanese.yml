 hd_party_convert_shizu_desc: "世族の身分として朝廷に身を立てる。"
 hd_party_convert_hanmen_name: "寒門に転じる"
 hd_party_convert_hanmen_desc: "寒門の身分として朝廷に身を立てる。"
 hd_party_choose_attitude_decision: "朋党の態度"
 hd_party_choose_attitude_decision_desc: "あなたは本党の牛耳を執っており、党の進退向背はすべてあなたの一言にかかっている。主君を推戴するか、成り行きを静観するか、それとも対等に張り合うか？"
 hd_party_choose_attitude_decision_tooltip: "主君に対する本党の態度を決める"
 hd_party_attitude_cd_tt: "前回の態度の変更から、まだ三年が経っていない"
 HD_PARTY_ATTITUDE_CONFIRM: "決定"
 hd_party_join_chaos_decision: "乱世に身を投じる"
 hd_party_join_chaos_decision_desc: "天下は大いに乱れた。今こそ丈夫が功を立て業を成す時だ！我は親族と門生を率い、家財を散じて義従を募り、群雄逐鹿の渦中に身を投じよう。"
 hd_party_join_chaos_decision_tooltip: "家財を散じ、義従を募り、[adventurer|E]の身として乱世に身を投じる"
 hd_party_join_chaos_army: "義従"
 hd_party_convert_identity_decision_confirm: "身分の転換"
 hd_party_choose_attitude_decision_confirm: "態度を決定する"
 hd_party_join_chaos_decision_confirm: "乱世に身を投じる"
 hd_party_policy_cd_tt: "この党への施政から五年が経っておらず、まだ変更できない（中立に戻す場合を除く）"
 hd_party_loyalty_invalid_tt: "この党は首領を欠いているか、すでに尊王を奉じているか、あるいは最近あなたが忠誠を要求したばかりである"
 hd_party_loyalty_success_tt: "#P この党は屈服して命に従い、「尊王」に改めた。#!"
 hd_party_loyalty_fail_tt: "#N この党は命を拒み、転じてあなたに対抗する。#!"
 hd_party_policy_unpaid_toast: "府庫が持ちこたえられず、諸党を支援・抑制する政策は取りやめるほかなかった"
 hd_party.0020.t: "心服を迫る"
 hd_party.0020.desc: "[hd_party_target_leader.GetShortUIName]とその党羽は朝廷で一派をなしている。屈服させることができれば、この党は「尊王」に改め、その党魁が替わるか、あなたが位を去るまでそれを守るだろう。\n\nただ、力ずくで押さえつけても、誰もが心服するとは限らない。"
 hd_party.0020.a: "権勢をもって迫る"
 hd_party.0020.b: "名分と大義をもって責める"
 hd_party.0020.c: "威信をもって押さえつける"
 hd_party.0020.d: "声望を傾け尽くし、屈服を強いる"
 hd_party.0020.e: "弱みを握って脅す"
 hd_party.0020.f: "この件はしばし保留する"
 hd_party.0101.t: "党錮の解除"
 hd_party.0101.desc: "黄巾の乱が突如として起こり、四方が震撼した。中常侍呂強があなたに進言した。党錮による怨みは久しく積もっており、もし赦さなければ、党人が張角と結託し、禍はさらに甚だしくなりかねない、と。"
 hd_party.0101.a: "党人を大赦する"
 hd_party.0101.a.tt: "禁錮されていた士人は故郷に帰ることを許され、寒門の人心はいくらか落ち着いた。"
 hd_party_chain.11.t: "中常侍の寵遇"
 hd_party_chain.11.desc: "[hd_party_chain_leader.GetShortUIName]は日夜あなたの左右に仕え、慎み深く恭しい態度で、あなたの大いなる歓心を得ている。宮中の者たちは陰でこう噂している。中常侍の位は、この者をおいて他にない、と。"
 hd_party_chain.11.a: "中常侍に任じる"
 hd_party_chain.11.b: "銭帛を賜り、その労に報いる"
 hd_party_chain.11.c: "宮闈のことは、多く議すべきではない"
 hd_party_chain.12.t: "西園の兵権"
 hd_party_chain.12.desc: "[hd_party_chain_leader.GetShortUIName]は上言し、西園に八校尉を置き、宦官に禁兵を統率させて非常に備えるよう請うた。この知らせが伝わると、武人の多くは不満を抱いた。"
 hd_party_chain.12.a: "その請いを許す"
 hd_party_chain.12.b: "名号を賜るが、兵権は授けない"
 hd_party_chain.12.c: "兵は国の大事、軽々しく授けてはならぬ"
 hd_party_chain.13.t: "宦官の政治介入"
 hd_party_chain.13.desc: "諸常侍が連名で上奏し、「主上の労を省くため」に、あなたに代わって上奏文を決裁したいと請うてきた。許せば号令は宮中から発せられることになり、許さなければ宦官たちは恨みを抱くだろう。"
 hd_party_chain.13.a: "上奏文を委ねる"
 hd_party_chain.13.c: "このことは断じて行えぬ"
 hd_party_chain.21.t: "皇后の一族の封侯"
 hd_party_chain.21.desc: "皇后の一族である[hd_party_chain_leader.GetShortUIName]はたびたび功を立てており、朝臣たちは次々と上書して、侯爵をもって報いるようあなたに請うた。"
 hd_party_chain.21.a: "土地を分けて封じる"
 hd_party_chain.21.b: "金帛を厚く賜る"
 hd_party_chain.21.c: "功なき者を侯に封じることはできぬ"
 hd_party_chain.22.t: "外戚の兵権掌握"
 hd_party_chain.22.desc: "[hd_party_chain_leader.GetShortUIName]は将軍の号を受け、禁兵を統べて京師を宿衛したいと請うた。"
 hd_party_chain.22.a: "将軍に任じる"
 hd_party_chain.22.b: "栄誉ある名を賜る"
 hd_party_chain.22.c: "兵権を人に貸すことはできぬ"
 hd_party_chain.23.t: "外戚の輔政"
 hd_party_chain.23.desc: "外戚の勢いは日ごとに盛んになっている。[hd_party_chain_leader.GetShortUIName]は上表し、録尚書事となって朝政を補佐したいと請うた。"
 hd_party_chain.23.a: "輔政を委ねる"
 hd_party_chain.23.c: "朝政は我自ら執る"
 hd_party_chain.51.t: "察挙による抜擢"
 hd_party_chain.51.desc: "寒門の士人たちが連名で上書し、察挙を広く開いて孤寒の士を抜擢するよう、あなたに請うた。"
 hd_party_chain.51.a: "察挙を広く開き、門第にこだわらない"
 hd_party_chain.51.b: "一人二人を取り立てる"
 hd_party_chain.51.c: "仕官の道には定まった規則がある"
 hd_party_chain.52.t: "清議の風潮"
 hd_party_chain.52.desc: "太学の諸生が公卿を品評し、執政を論じ、清議の声は朝野に満ちている。あなたの施政さえも、その論評の対象となっている。"
 hd_party_chain.52.a: "その直言を嘉する"
 hd_party_chain.52.b: "聞き流すのみ"
 hd_party_chain.52.c: "みだりに朝政を議する者は、禁ずべし"
 hd_party_chain.53.t: "寒門の台閣入り"
 hd_party_chain.53.desc: "寒門の望みである[hd_party_chain_leader.GetShortUIName]は日ごとに名声を高めており、人々はこぞって、彼を台閣に引き入れ機務に参与させるようあなたに請うている。"
 hd_party_chain.53.a: "台閣に引き入れる"
 hd_party_chain.53.c: "資望がまだ浅い"
 hd_party_chain.41.t: "門第による推挙"
 hd_party_chain.41.desc: "世族の諸公は互いに推薦し合い、門第の子弟を郎官に充てるよう請うてきた。"
 hd_party_chain.41.a: "その推薦を許す"
 hd_party_chain.41.b: "優れた者を選んで用いる"
 hd_party_chain.41.c: "官を選ぶには才徳を論ずべし"
 hd_party_chain.42.t: "田産の兼併"
 hd_party_chain.42.desc: "豪族の家は広く田土を占め、奴客は千を数えることも珍しくない。有司は禁令を設けるよう請うたが、世族の諸公は次々とあなたに情けを求めてきた。"
 hd_party_chain.42.a: "なすがままにさせる"
 hd_party_chain.42.b: "いくらか制限を加える"
 hd_party_chain.42.c: "兼併を厳禁する"
 hd_party_chain.43.t: "門閥による仕途の独占"
 hd_party_chain.43.desc: "世族の諸公は品第の法を定め、門第の高下によって官品を決めるよう請うてきた。これにより寒門の子弟は、ほとんど出世の道を断たれることになる。"
 hd_party_chain.43.a: "定法とする"
 hd_party_chain.43.c: "この法は断じて行えぬ"
 hd_party_chain.31.t: "将に任じ侯に封じる"
 hd_party_chain.31.desc: "[hd_party_chain_leader.GetShortUIName]はたびたび戦功を立てており、麾下の将兵は次々と、彼を将に任じて手厚く封賞し、三軍を励ますようあなたに請うている。"
 hd_party_chain.31.a: "将軍に任じる"
 hd_party_chain.31.b: "手厚く賞賜する"
 hd_party_chain.31.c: "功はまだそこまでには及ばぬ"
 hd_party_chain.32.t: "辺将の擁兵"
 hd_party_chain.32.desc: "辺将たちが上書し、それぞれ部曲を率い、自ら兵馬を募って外敵を防ぎたいと請うてきた。"
 hd_party_chain.32.a: "自ら募ることを許す"
 hd_party_chain.32.b: "銭穀を賜る"
 hd_party_chain.32.c: "兵は朝廷に帰すべし"
 hd_party_chain.33.t: "武人の跋扈"
 hd_party_chain.33.desc: "諸将は功を恃んで驕り、たびたび不法な振る舞いに及んでいる。放任すれば武人はますます跋扈し、抑えつければ兵変を招きかねない。"
 hd_party_chain.33.a: "ひとまず大目に見る"
 hd_party_chain.33.c: "厳しく抑えつける"
