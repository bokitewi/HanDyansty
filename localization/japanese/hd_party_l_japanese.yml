 HD_PARTY_DEMAND_LOYALTY_TT: "#T 忠誠を要求#!\n[influence|E]、[legitimacy|E]、[prestige|E]、または[hook|E]をもって脅し、この党に尊王へ改めるよう強いる。屈服すれば、以後その党魁か君主が代わるまで方針を変えない。従わなければ、この党は君主に対抗する側に転じ、五年間は心を改めない。\n#weak 同じ党に対しては、五年に一度しか要求できない。#!"
