 hd_party_chain_refused_opinion: "請願が却下された"
 hd_party_favor_decision_desc: "朝廷の諸党にはそれぞれ長所があり、またそれぞれ私心を抱いている。そのうち一つを選んで親しみ腹心とすれば、おのずと死力を尽くさせることができる。ただ、かつて寵遇されていた者たちが一朝にして失勢すれば、恨みを抱かずにはいられないだろう。"
 hd_party_favor_decision_tooltip: "[movement|E]を一つ選んで腹心とするか、現在の寵遇を取り下げる"
 hd_party_favor_cd_tt: "前回の寵遇の変更から、まだ十年が経っていない"
 hd_party_favor_huanguan_name: "宦官を寵遇"
 hd_party_favor_huanguan_desc: "中官を信任し、宦官を腹心とする。"
 hd_party_favor_waiqi_name: "外戚を寵遇"
 hd_party_favor_waiqi_desc: "皇后の一族を重んじ、外戚に重任を委ねる。"
 hd_party_favor_wuxun_name: "武勲を寵遇"
 hd_party_favor_wuxun_desc: "将校を推し重んじ、武勲を干城とする。"
 hd_party_favor_shizu_name: "世族を寵遇"
 hd_party_favor_shizu_desc: "世家を礼遇し、門閥を股肱とする。"
 hd_party_favor_hanmen_name: "寒門を寵遇"
 hd_party_favor_hanmen_desc: "寒素の者を抜擢し、孤寒の士を羽翼とする。"
 hd_party_favor_none_name: "いずれの朋党も寵遇しない"
 hd_party_favor_none_desc: "偏らず、現在の寵遇を取り下げる。"
 hd_party_favor_effect_tt: "あなたに寵遇された党は恩に感じて報いようとし、その勢いは大いに振るう。この党が当世で得る利害得失は、あなたもともに引き受けることになる。"
 hd_party_favor_lost_tt: "かつて寵遇されていた党は後ろ盾を失い、恨みを抱かずにはいられない。"
 hd_party_convert_identity_decision: "身分の転換"
 hd_party_convert_identity_decision_desc: "あなたの出自と経歴は、すでに別の党の門下に身を投じるに足る。ただ、門庭を替えた者はかつての同輩から節操のない輩と見なされるのを免れず、名声は必ず損なわれるだろう。"
 hd_party_convert_identity_decision_tooltip: "朝廷で所属する身分を改め、別の党の門下に身を投じる"
 hd_party_convert_cd_tt: "前回の身分の変更から、まだ十年が経っていない"
 HD_PARTY_CONVERT_CONFIRM: "転換"
 hd_party_convert_huanguan_name: "宦官に転じる"
 hd_party_convert_huanguan_desc: "宦官の身分として朝廷に身を立てる。"
 hd_party_convert_waiqi_name: "外戚に転じる"
 hd_party_convert_waiqi_desc: "外戚の身分として朝廷に身を立てる。"
