 HD_PARTY_ATTITUDE_WUXUN_TT: "#T 武勲の君主に対する態度：[SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_wuxun_attitude').GetFlagName, 'support' ), 'hd_party_attitude_support_name', SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_wuxun_attitude').GetFlagName, 'oppose' ), 'hd_party_attitude_oppose_name', 'hd_party_attitude_neutral_name' ) )]#!\n擁護スコア：[Character.MakeScope.Var('hd_party_wuxun_score').GetValue|0]（≥ 50 で擁護に、≤ −50 で対抗に転じる。擁護中は 20 未満、対抗中は −20 超で中立に戻る）\n\n擁護時に君主が得るもの：徴募兵 #P +15%#!、徴募兵の回復 #P +20%#!、常備軍の連隊数上限 #P +1#!、常備軍の維持費 #P −10%#!\n対抗時に君主が被るもの：徴募兵 #N −22.5%#!、徴募兵の回復 #N −30%#!、常備軍の連隊数上限 #N −2#!、常備軍の維持費 #N +15%#!\n\n#weak 一党の勢力が朝廷の一割に満たなければ、その向背は大局に関わらない。#!"
