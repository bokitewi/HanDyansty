 HD_PARTY_FAVORED_TT: "#T 寵遇#!\nこの党は今まさに君主に重用されている。この党が当世で得る利害得失は、君主もともに引き受ける。その党員の君主への好感度 #P +10#!、任命スコア #P +15%#!。"
