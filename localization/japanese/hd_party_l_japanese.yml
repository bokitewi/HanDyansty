 hd_party_debate.0010.t: "迫る朝廷での論争"
 hd_party_debate.0010.desc: "朝廷での論争まではまだひと月余りあるが、朝廷ではすでに暗流が渦巻いている。同じ党の者はあなたが高みから一声上げるのを待ち、中立の士はなお様子見を決め込み、相手方の門客もまた四方を奔走している。"
 hd_party_debate.0010.a: "同じ党の者を広く招き、ともに対策を練る"
 hd_party_debate.0010.b: "中立の士の屋敷を訪ねる"
 hd_party_debate.0010.c: "ひそかに流言を広める"
 hd_party_debate.0020.t: "経典を引く"
 hd_party_debate.0020.desc: "[hd_party_debate_rival.GetShortUIName]が『春秋』の大義を引いてあなたを詰問し、満座の視線があなたに注がれた。"
 hd_party_debate.0020.a: "経義をもって問い返す"
 hd_party_debate.0021.t: "清議の声援"
 hd_party_debate.0021.desc: "太学の諸生がこれを聞きつけ、次々とあなたの肩を持ち、清議の声が絶え間なく耳に届く。"
 hd_party_debate.0021.a: "人心は用いるべし"
 hd_party_debate.0022.t: "酒宴での懐柔"
 hd_party_debate.0022.desc: "あなたは屋敷で宴を設け、同僚たちをもてなすつもりだ。酒が回り耳が熱くなった頃合いには、いくらか多くの支持が得られるかもしれない。"
 hd_party_debate.0022.a: "盛大な宴を開き、同僚を広く招く"
 hd_party_debate.0022.b: "そこまでする必要はない"
 hd_party_debate.0023.t: "朝廷での反駁"
 hd_party_debate.0023.desc: "[hd_party_debate_rival.GetShortUIName]が朝廷で詰問し、あなたの言は祖法に背いていると非難した。"
 hd_party_debate.0023.a: "理をもって強く反駁する"
 hd_party_debate.0023.b: "ひとまず鋭鋒を避ける"
 hd_party_debate.0024.t: "祖法を引く"
 hd_party_debate.0024.desc: "反対者たちは次々と祖宗の成法を引き合いに出し、守旧の論が一時優勢となった。"
 hd_party_debate.0024.a: "しばし得意にさせておこう"
 hd_party_debate.0025.t: "騒然たる衆議"
 hd_party_debate.0025.desc: "堂下では議論が沸き立ち、こらえきれずにその場で態度を表明する者も出てきた。"
 hd_party_debate.0025.a: "まずは風向きを見る"
 hd_party_debate.0030.t: "決着の論争"
 hd_party_debate.0030.desc: "論争はいよいよ正念場を迎えた。あなたと[hd_party_debate_rival.GetShortUIName]が正面から渡り合い、勝敗はこの一挙にかかっている。"
 hd_party_debate.0030.a: "全力を尽くす"
 hd_party_debate.0031.t: "土壇場の寝返り"
 hd_party_debate.0031.desc: "朝廷での論争が佳境に入ったところで、席の中から突然一人が立ち上がり、陣営を替えた。"
 hd_party_debate.0031.a: "世の中はわからぬものだ"
 hd_party_debate.0032.t: "席を蹴って去る"
 hd_party_debate.0032.desc: "[hd_party_debate_rival.GetShortUIName]は論争に勝てず、席を蹴って去った。反対者の気勢は大いにくじかれた。"
 hd_party_debate.0032.a: "見事なり"
 hd_party_debate.0033.t: "理をもって争う"
 hd_party_debate.0033.desc: "人々は半信半疑だ。あなたが自らの声望をもって保証するなら、より多くの者を動かせるかもしれない。"
 hd_party_debate.0033.a: "我が身の声望をもって保証する"
 hd_party_debate.0033.b: "ひとまずその必要はない"
 hd_party_debate.0040.t: "朝廷での論争の最中"
 hd_party_debate.0040.desc: "朝廷での論争が佳境に入り、あなたのいる側は助力を必要としている。"
 hd_party_debate.0040.a: "財布の紐を解いて助ける"
 hd_party_debate.0040.b: "声望をもって肩を持つ"
 hd_party_debate.0040.c: "成り行きを静観する"
 hd_party_debate.0050.t: "君主の裁断を請う"
 hd_party_debate.0050.desc: "[host.GetShortUIName]が起こした立場の論争は膠着し、双方ともあなたの意思表示を待っている。あなたが口を開けば、勝敗はほぼ決するだろう。"
 hd_party_debate.0050.a: "発起人の言に理がある"
 hd_party_debate.0050.b: "反対者の言に理がある"
 hd_party_debate.0050.c: "可否を言わない"
 hd_party_debate.0090.t: "論争の勝利"
 hd_party_debate.0090.desc: "朝廷での論争はあなたの側の勝利に終わった。今日より、本党は新たな立場を奉じる。"
 hd_party_debate.0090.a: "衆望の帰するところ"
 hd_party_debate.0091.t: "論争の敗北"
 hd_party_debate.0091.desc: "朝廷での論争はあなたの側の敗北に終わった。同じ党の者はあなたにかなりの不満を抱いており、この先何年も、あなたが皆を率いることは難しいだろう。"
 hd_party_debate.0091.a: "時なり命なり"
 hd_party_debate.0010.b.success: "中立の士を一人説き伏せた"
