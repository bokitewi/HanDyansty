 hd_party_tt_others_resent: "その他の諸党は白い目で見ており、恨み言が多い。"
 activity_hd_party_debate: "立場の論争"
 activity_hd_party_debate_plural: "立場の論争"
 activity_hd_party_debate_desc: "同じ党の者と諸党の首領を召集し、本党の持する立場について朝廷で論争する。論争に勝てば本党は方針を改め、敗れれば発起人の名声は地に落ちる。"
 activity_hd_party_debate_selection_tooltip: "立場の論争を起こし、本党の政治的立場を変えようと試みる"
 activity_hd_party_debate_destination_selection: "論争はあなたまたは君主の首都でのみ開催できる。"
 activity_hd_party_debate_host_desc: "\n$BULLET_WITH_TAB$論争に勝利：本党は新たな立場を奉じ、あなたは[prestige|E]を得て、もとの党魁に取って代わる\n$BULLET_WITH_TAB$論争に敗北：あなたは[prestige|E]を失い、長年にわたり党の実権を握ることも再び朝廷での論争を起こすこともできず、本党の[movement_power|E]も損なわれる"
 activity_hd_party_debate_guest_desc: "\n$BULLET_WITH_TAB$擁護者：論争に勝てば[prestige|E]を得て、発起人と誼を結ぶ。敗れれば党内で失勢する\n$BULLET_WITH_TAB$反対者：発起人が敗れれば、[prestige|E]を得る"
 activity_hd_party_debate_predicted_cost: "予想費用"
 activity_hd_party_debate_host_an_a: "$articleblank_article$"
 activity_hd_party_debate_guest_help_text: "招かれた者は、発起人を擁護することも、傍観することも、立ち上がって反対することもできる。"
 hd_party_debate_province_desc: "#P +首都#!"
 hd_party_debate_location_desc: "あなたまたは君主の首都でのみ開催できる"
 hd_debate_target: "目標の立場"
 hd_debate_target_desc: "本党に奉じさせたい立場"
 hd_target_zunwang: "尊王に改める"
 hd_target_zunwang_desc: "君主を尊ぶ。党員は派閥を結ばず、兵を挙げて上に逆らわず、主君を敬って仕える。武臣は君主に従って出征し、文臣は誠心誠意民を治める。"
 hd_target_kaituo: "開拓に改める"
 hd_target_kaituo_desc: "領土の拡張を強く主張する。請願や政議では、軍の拡充、軍鎮の増設、保護国の拡大を求めることが多い。"
 hd_target_jinqu: "進取に改める"
 hd_target_jinqu_desc: "利を興し弊を除くことを強く主張する。請願や政議では、官署の拡充、科挙による登用、俸禄の増額を求めることが多い。"
 hd_target_shoujiu: "守旧に改める"
 hd_target_shoujiu_desc: "祖法の厳守を強く主張する。請願や政議では、致仕の法、諸曹の用度、任官資格に着目することが多い。"
 hd_target_zhongli: "中立に改める"
 hd_target_zhongli_desc: "争いに関わらず、朝政に対して偏った主張を持たない。"
 hd_debate_phase_prep: "準備"
 hd_debate_phase_prep_desc: "各方面が奔走して結託し、中立の者を抱き込む。"
