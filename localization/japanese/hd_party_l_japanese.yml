 hd_party_debate_help_tt: "あなたのいる側の勢いがやや振るった。"
 hd_party_debate.0010.a.tt: "同じ党の者は声気相通じ、中立の士の中にも噂を聞いて加わる者がいるかもしれない。"
 hd_party_debate.0025.support_tt: "中立の士の一人があなたの側に付いた。"
 hd_party_debate.0025.oppose_tt: "中立の士の一人が相手側に付いた。"
