l_japanese:
 # 天朝循环·时代特色：崩溃期（天下大乱 + 大厦将倾）套件

 # ---------- 招募流民 ----------
 hd_dc_col_recruit_refugees_decision: "流民を募る"
 hd_dc_col_recruit_refugees_decision_desc: "飢民は流浪し、行く先々で盗賊となる。彼らが徒党を組んで乱を起こすのを座視するより、官府が壮丁を募って兵とし、老弱を落ち着かせて荒地を開墾させれば、兵源を得られるうえ地方も安定する。"
 hd_dc_col_recruit_refugees_decision_tooltip: "流民を募って兵とし、老弱を田畑に落ち着かせる。"
 hd_dc_col_recruit_refugees_decision_confirm: "流民を募って兵とする"
 hd_dc_col_recruit_refugees_county_tt: "天子の国の各[county|E]"
 hd_dc_col_refugee_army_name: "流民軍"
 hd_dc_col_refugees_county_modifier: "流民を募る"
 hd_dc_col_refugees_county_modifier_desc: "官府が流民を募って兵とし、老弱を落ち着かせたことで、地方はいくらか安定した。"

 # ---------- 勤王诏 ----------
 hd_dc_col_qinwang_decision: "勤王の詔"
 hd_dc_col_qinwang_decision_desc: "寇賊が相次いで侵し、社稷は危うい。天子は血書の詔をもって天下の諸侯に告げる。およそ忠義の士は、速やかに兵を起こして救援に駆けつけ、ともに国難に赴け、と。"
 hd_dc_col_qinwang_decision_tooltip: "天下の諸侯に兵を起こして勤王し、ともに国難に赴くよう詔告する。"
 hd_dc_col_qinwang_decision_confirm: "天下に勤王を詔する"
 hd_dc_col_qinwang_no_war_tt: "あなたは戦争で守勢に立っており、かつこの戦争のためにまだ勤王の詔を発していない"
 hd_dc_col_qinwang_legitimacy_tt: "あなたの[legitimacy|E]が少なくとも #V [ROOT.Char.MakeScope.ScriptValue('hd_dc_col_qinwang_legitimacy_cost_value')|0]#! 必要"
 hd_dc_col_qinwang_invite_tt: "詔書はなおあなたに忠誠を抱く諸侯に伝えられ、詔に応じた者は兵を起こしてこの戦争に加わる。王師が勝利すれば、勤王の諸侯は必ず厚く報われる。"
 hd_dc_col_qinwang_joined_msg: "[hd_dc_col_qinwang_joiner.GetShortUIName]が兵を起こして勤王した"
 hd_dc_col_qinwang_opinion: "勤王の功"

 hd_dc_col.0001.t: "勤王の詔至る"
 hd_dc_col.0001.desc: "天子の詔使が夜を日に継いで駆けつけ、墨の跡もまだ乾かぬ詔書を差し出した。寇賊が相次いで侵し、都は危急にある。[hd_dc_col_qinwang_emperor.GetTitledFirstName]は天下の忠義の士に兵を起こして救援に来るよう呼びかけている。\n\n麾下の諸将は顔を見合わせた――これは勤王の功を立てる好機か、それともただ他人のために骨を折るだけか？"
 hd_dc_col.0001.a: "君父の危難を、どうして座視できようか！"
 hd_dc_col.0001.a.tt: "あなたは部隊を率いて天子の側に加わる。王師が勝利すれば、天子はあなたの勤王の功を忘れないだろう："
 hd_dc_col.0001.b: "兵を留めて形勢を見守る"

 # ---------- 赈灾 ----------
 hd_dc_col_disaster_relief_decision: "災害救済"
 hd_dc_col_disaster_relief_decision_desc: "天災が広がり、餓死者が道に満ちている。太倉の粟を開き、使者を被災地に分遣し、飢民を救い家屋を修復して、朝廷が民を見捨てていないことを百姓に知らしめる。"
 hd_dc_col_disaster_relief_decision_tooltip: "太倉の粟を開き、天子の国の被災した諸県を救済する。"
 hd_dc_col_disaster_relief_decision_confirm: "倉を開いて食糧を放出する"
 hd_dc_col_relief_no_disaster_tt: "天子の国内に自然災害または飢饉の影響を受けている県がある"
 hd_dc_col_disaster_relief_county_tt: "天子の国内の被災した各[county|E]で、災害の被害がすべて回復する"
 hd_dc_col_relief_county_modifier: "倉を開いての救済"
 hd_dc_col_relief_county_modifier_desc: "朝廷が倉を開いて救済し、被災民は恩に感じている。"

 # ---------- 地方自强 ----------
 hd_dc_col_local_selfstrengthen_decision: "地方の自強"
 hd_dc_col_local_selfstrengthen_decision_desc: "朝廷は自らのことで手一杯で、盗賊が四方に起こっている。朝廷の救援を座して待つより、自ら郷勇を募り、城砦を修繕して、境を保ち民を安んじるほうがよい――ただし天子は地方が強大になるのを快く思わないかもしれない。"
 hd_dc_col_local_selfstrengthen_decision_tooltip: "自ら郷勇を募り、城砦を修繕して境を保ち民を安んじる。ただし天子はこのためにあなたを猜疑する。"
 hd_dc_col_local_selfstrengthen_decision_confirm: "兵を募って自衛する"
 hd_dc_col_militia_active_tt: "まだ #V 地方の自強#! または #V 募兵の許可#! の状態にない"
 hd_dc_col_selfstrengthen_modifier: "地方の自強"
 hd_dc_col_selfstrengthen_modifier_desc: "自ら郷勇を募り、境を保ち民を安んじている。"
 hd_dc_col_selfstrengthen_opinion: "勝手に兵を募った"

 # ---------- 授权募兵 ----------
 hd_dc_col_authorize_militia_interaction: "募兵を許可する"
 hd_dc_col_authorize_militia_interaction_desc: "この封臣に独自の募兵を許可し、軍資に充てるため税の一部を手元に留めることを認める。"
 hd_dc_col_authorize_militia_notification: "[actor.GetTitledFirstName]はあなたに独自の募兵を許可し、軍資に充てるため税の一部を手元に留めることを認めた。"
 hd_dc_col_authorize_militia_tax_tt: "以後、朝廷は毎年この封臣が納めた税の半分を軍資として返還せねばならない。"
 hd_dc_col_authorized_militia_modifier: "募兵を許可する"
 hd_dc_col_authorized_militia_modifier_desc: "天子の命を奉じて兵を募り、税の一部を手元に留めて軍資に充てている。"
 hd_dc_col_authorized_militia_opinion: "募兵を許可する"

 # ---------- 招安 ----------
 hd_dc_col_amnesty_rebels_interaction: "招安"
 hd_dc_col_amnesty_rebels_interaction_desc: "使者を遣わしてこの反乱軍の首領を招安し、官爵または土地を約束する代わりに兵を引いて帰順させる。相手が招安を受け入れれば、この反乱は[white_peace|E]で終結する。"
 hd_dc_col_amnesty_rebels_notification: "[actor.GetTitledFirstName]が使者を遣わし、官爵と土地を約束して、兵を引いて帰順するよう勧めてきた。"
 hd_dc_col_amnesty_option_office: "官職を与える"
 hd_dc_col_amnesty_option_office_desc: "金帛を厚く賜り、官職を授ける。相手が領地を持たない場合は、朝廷に召して臣とする。"
 hd_dc_col_amnesty_option_fief: "封地を与える"
 hd_dc_col_amnesty_option_fief_desc: "あなたの直轄地のうち最も貧しい県を一つ（都城を除く）割いて相手に与え、あなたの封臣とする。"
 hd_dc_col_amnesty_office_gold_tt: "官職授与の褒賞を支払えるだけの金を持っている"
 hd_dc_col_amnesty_must_select_tt: "招安の方法を選ばねばならない：官職か封地か"
 hd_dc_col_amnesty_no_fief_tt: "都城のある県のほかに、少なくとも1つの県を直轄している"
 hd_dc_col_amnesty_declined_msg: "[recipient.GetShortUIName]は招安を拒否した"
 hd_dc_col_amnesty_ai_warscore_reason: "戦況"
 hd_dc_col_amnesty_ai_fief_reason: "土地を授かる"
 hd_dc_col_amnesty_ai_greedy_reason: "褒賞を貪る"
 hd_dc_col_amnesty_ai_content_reason: "現状に満足"
 hd_dc_col_amnesty_ai_craven_reason: "戦いを恐れる"
 hd_dc_col_amnesty_ai_ambitious_reason: "野心家"
 hd_dc_col_amnesty_ai_arrogant_reason: "傲慢"
 hd_dc_col_amnesty_office_modifier: "招安を受けて官職を得た"
 hd_dc_col_amnesty_office_modifier_desc: "招安を受け入れ、兵を引いて帰順し、官職を授かった。"
 hd_dc_col_amnesty_accepted_opinion: "招安の恩"
