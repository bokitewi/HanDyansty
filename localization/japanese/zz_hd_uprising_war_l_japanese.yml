l_japanese:
 HD_UPRISING_WAR_NAME:0 "蜂起戦争"
 hd_peasant_populist_uprising_war_victory_desc:0 "蜂起軍が勝利し、占領した郡県はそれぞれの占領者に帰し、蜂起の首領は元の主君から離れて自立する。"
 hd_peasant_populist_uprising_war_white_peace_desc:0 "双方が兵を収め、郡県の帰属は元のままとなる。"
 hd_peasant_populist_uprising_war_defeat_desc:0 "蜂起は潰え、起事者は何も得られず、首領は囚われの身となる。"
 hd_uprising_war_victory_desc:0 "蜂起軍が勝利し、首領は元の主君から離れて自立する。"
 hd_yellow_turban_war_victory_desc:0 "この方面の黄巾が勝利し、戦中に奪った郡県は引き続きそれぞれの占領者に帰する。"
 hd_uprising_war_white_peace_desc:0 "双方が兵を収め、戦中に手を変えた郡県はそれぞれ現状を維持する。"
 hd_uprising_war_defeat_desc:0 "蜂起は失敗し、起事者が戦中に奪った郡県はすべて元の主に返還される。"
 hd_yellow_turban.0001.t:0 "蒼天已に死す"
 hd_yellow_turban.0001.desc:0 "雒陽からの急使の書状が届き、広げるや否や、[tang_zhou.GetName]が密告したという知らせが目に入った。三十六方の手配はすでに露見し、[ma_yuan_yi.GetName]も捕らえられて処刑された。もともと決めていた挙兵の日はまだ来ていないが、官府の捜索は待ってはくれない。\n\n知らせを伝えに来た者はあなたの前にひれ伏し、袖口は道中で浴びた泥だらけである。あとどれだけの者がこのことを知っているのかと問うても、彼はただ首を振るばかりであった。今一日ためらえば、黄旗を掲げようとする信徒の一隊をまた失うかもしれない。\n\n南陽には張曼成、潁川には波才がいる。各方はそれぞれ部衆を率いているが、まだ同時に兵を挙げることはできる。あなたは急使の書状を机に押さえつけ、改めて号令を伝えるよう命じた。もはや元に戻る道がない以上、三月五日まで待つ必要はない。"
 hd_yellow_turban.0001.a:0 "蒼天已に死す、黄天当に立つべし！"
 hd_yellow_turban.0002.t:0 "黄巾勢いを得る"
 hd_yellow_turban.0002.desc:0 "黄巾勝利の知らせが四方に広まった。報告に来た者はまずどこを攻め落としたかを語り、次に漢朝がある戦場で敗北を認めたと語り、最後に一言付け加えた。残る数方面の戦いは、まだすべては止んでいないと。\n\n三方の黄旗がそれぞれ掲げられ、今やその一方が足場を固めた。自らの手で攻め落とした県邑も、なお攻め取った者の手にある。この勝利は漢朝の威信を揺るがすには十分だが、各方面の兵馬や各地の郷里の難題をそれとともに消し去ってくれるわけではない。\n\n門の外ではすでに天命の交代を論じる者がいる。この知らせが喜ぶべきものであれ恐れるべきものであれ、今後の計画は練り直さねばならない。"
 hd_yellow_turban.0002.a:0 "天下はこれより多事となろう。"
 hd_yellow_turban.0003.t:0 "黄巾滅ぶ"
 hd_yellow_turban.0003.desc:0 "黄巾に関する最後の戦報が届いた。三方の大軍はいずれも敗れ去ったという。かつて相次いで急を告げていた所から、今は奪還した県邑と潰散した人衆の報告が届き始め、言伝を運ぶ者もようやく声を大きくする気になった。\n\nだが戦いは一枚の捷報で幕を閉じられても、荒れた田畑や空になった里の家々は、封泥が固まると同時に元に戻るわけではない。漢朝は名位を保ったが、地方で兵権を握ったことのある者たちは皆、自分がかつてどのように号令を発したかを覚えている。\n\n黄巾のこの挙兵はすでに失敗に終わった。次に向き合わねばならないのは、それが州郡と人心に残した空白である。"
 hd_yellow_turban.0003.a:0 "乱は平らいだが、傷はなお癒えず。"
 hd_zhuojun_rangers:0 "涿郡義従"
 hd_zhuojun_rangers_adj:0 "涿郡義従"
