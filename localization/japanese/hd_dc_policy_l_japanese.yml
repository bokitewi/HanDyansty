l_japanese:
 hd_dc_par_tax_relief_modifier: "救済減税の試行"
 hd_dc_policy_silenced_opinion: "政見の挫折"
 hd_dc_policy_retained_opinion: "上奏が採用された"
 hd_dc_policy_trial_selected_opinion: "新政の試行を任された"
 hd_dc_policy_trial_passed_over_opinion: "朝廷が他の議を優先した"
 hd_dc_par.1101.t: "減税令が郡に下る"
 hd_dc_par.1101.desc: "[hd_dc_policy_county.GetName]の受領書が机上に届いた。百金はすでに引き渡され、現地では減税が始まっている。\n\n帳簿には別に一欄が設けられ、一年後のその時の統治と民生を書き込むのを待っている。今日確かに言えるのは、この政令が施行されたということだけだ。それがどれほどの成果を上げるかは、地方の今後の様子次第である。"
 hd_dc_par.1101.a: "証憑をしまい、一年後に改めて検めよう。"
 hd_dc_par.1201.t: "試行の満期"
 hd_dc_par.1201.fulfilled: "[hd_dc_policy_county.GetName]の試行簿に、ついに最後の一頁が書き加えられた。一年の期限が満ち、担当者は終始その任にあり、減税も途切れることはなかった。\n\n開始時と満期時の地方の様子は、それぞれ記録されている。帳簿は現地の変化をありのままに記している――それはこの事業が完了したことを示すものであって、どちらかの派に代わって「どこでも通用する」との断を下すものではない。"
 hd_dc_par.1201.authority_lost: "[hd_dc_policy_county.GetName]の試行簿が戻ってきたが、最後の頁は予想していた検収ではなかった。担当者はすでにその職になく、この約定をもとのとおりに進めることはもはやできない。\n\n減税はここで打ち切られた。先に引き渡した金銭はなお証憑で確かめられるが、今回は結局、有終の美を飾ったとは言えない。"
 hd_dc_par.1201.interrupted: "[hd_dc_policy_county.GetName]の試行は、途中で途絶えた。減税は満期まで持ちこたえられず、今回は未完のまま終わるほかない。\n\n先の金銭はなお証憑で確かめられ、帳場もこれを理由に一文たりとも追加で出してはいない。"
 hd_dc_par.1201.a: "その顛末を記し、約定に添えておけ。"
 hd_dc_par.1001.t: "まず一郡に問う"
 hd_dc_par.1001.desc: "机上に一通の諮問書が届けられた。封泥にはまだ使者の指の跡が残っている。[hd_dc_case_county.GetName]は確かに災害に見舞われており、朝廷はこれについてあなたに上奏を求めている。\n\n[hd_dc_case_ruler.GetTitledFirstName]の問いは明快だ。まず一年税を緩めて地方に息をつかせるか、それとも従来どおり徴収して官府の用度を守るか。今回は、勧善懲悪の空言を並べるだけでは済まされない――上奏文には、あなたの名が記されるのだ。"
 hd_dc_par.1001.a: "まず減税すべし。名を記して上奏する。"
 hd_dc_par.1001.a.tt: "あなたの上奏文は、もう一人の領袖の意見とともに御前に奉呈される。"
 hd_dc_par.1001.b: "従来どおり徴収し、まず銭穀の出入を明らかにすべし。"
 hd_dc_par.1001.b.tt: "あなたの上奏文は、もう一人の領袖の意見とともに御前に奉呈される。"
 hd_dc_par.1001.c: "この案件、議を主導するつもりはない。"
 hd_dc_par.window_closed: "この案件はすでに別途処置された。"
 hd_dc_par01_local_relief_terms: "[hd_dc_proposer.GetTitledFirstName]は百金を拠出し、[hd_dc_recipient.GetTitledFirstName]に被災した郡で一年間減税させ、民の困窮を和らげる。金が届き次第事業を開始し、満期の日には現地の統治と民生を報告する。この約定は新たな官職を授けるものではなく、地方の好転を保証するものでもない。三か月以内に返答がなければ、この議は取りやめとなる。"
 hd_dc_par_tax_relief_modifier_desc: "朝廷はこの郡の賦税を一時的に減じ、民力がやや回復するのを待っている。"
 hd_dc_par01_relief_leadership_terms: "[hd_dc_proposer.GetTitledFirstName]は[hd_dc_recipient.GetTitledFirstName]に減税の議を主導するよう請い、一年間試行して満期にともに検分する。朝廷は別に百金を下し、被災した郡の守令に事業を委ねるが、守令が承諾してはじめて支給される。この約定は官爵を授けるものではなく、朝廷が今後一党に肩入れすることを意味するものでもない。三か月以内に返答がなければ、この議は取りやめとなる。"
 hd_dc_par.1202.t: "開始されなかった試行"
 hd_dc_par.1202.rejected: "[hd_dc_policy_county.GetName]へ送った文書が突き返されてきた。返書にははっきりと、この件は引き受けないと書かれており、約定にも印は押されていない。\n\n減税の主張はなお上奏文の中にある。だが、主張することと、その任を引き受けることは別物だ。この議はここまでである。"
 hd_dc_par.1202.expired: "書吏が[hd_dc_policy_county.GetName]のその文書を未決の箱から取り出した。返答の期限はとうに過ぎ、署名欄は依然として空白のままだ。\n\n朝廷は金を下さず、現地もこれに基づく減税を行わなかった。後日再び議に上ることがあっても、今日の沈黙は当初の承諾とはみなされない。"
 hd_dc_par.1202.funding_failed: "[hd_dc_policy_county.GetName]の署名は届いたが、帳場は金を満額送ることができなかった。減税はまだ始まっておらず、一年の試行も数え始めようがない。\n\n担当者はすでに出入りした金額だけをそのまま記録した。支出されていない金を、支払済みとは書かない。"
 hd_dc_par.1202.invalidated: "[hd_dc_policy_county.GetName]の案件の文書が再び届いたとき、状況はすでに変わっていた――担当者も、施政の権柄も、あるいはこの案件そのものも、当初とは異なっている。\n\nこの約定はこれ以上進められない。書吏は変事の理由を古い文書の後ろに添え、後世の者が一枚の無効な約定を成し遂げた政績と取り違えぬようにした。"
 hd_dc_par.1202.a: "原書と返書、ともに保管しておけ。"
