l_japanese:
 hd_world_news.a:0 "天下がまた変わろうとしている"
 hd_world_news.0001.t:0 "黄天まさに立つべし"
 hd_world_news.0007.t:0 "連合軍、功なく散る"
 hd_world_news.0001.desc:0 "冀州から急報が届いた。唐周が太平道の計画を密告し、馬元義は洛陽で車裂きに処された。[hd_news_a.GetName]はもはや待たず、天公将軍を名乗って[hd_news_place.GetName]で挙兵した。\n\n同じ頃、[hd_news_c.GetName]は[hd_news_place_c.GetName]で、[hd_news_d.GetName]は[hd_news_place_d.GetName]で兵を挙げた。三十六方の信徒は黄色い頭巾を巻き、州郡からは日に幾度も救援を求める知らせが届く。\n\n「蒼天すでに死す、黄天まさに立つべし」。この言葉は、いまや天下に広まっている。"
 hd_world_news.0001.missing_details_desc:0 "冀州から急報が届いた。唐周が太平道の計画を密告し、馬元義は洛陽で車裂きに処された。[hd_news_a.GetName]はもはや待たず、天公将軍を名乗って挙兵した。\n\n三十六方の信徒は黄色い頭巾を巻き、州郡からは日に幾度も救援を求める知らせが届く。\n\n「蒼天すでに死す、黄天まさに立つべし」。この言葉は、いまや天下に広まっている。"
 hd_world_news.0007.desc:0 "討董の盟書が再び取り出された。しまい込まれたときについた折り目が、まだはっきりと残っている。だが、[hd_news_a.GetName]はついに諸軍を勝利へ導けず、兵は次々と散っていった。[hd_news_b.GetName]はなお[hd_news_place.GetName]に居座り、天子の境遇も、あの盟誓によって救われることはなかった。\n\n私は紙にびっしりと並んだ名を指でなぞった。挙兵の折には、朝廷を救う者たちとして読み上げられた名だ。今ではその名が出ると、誰が先に退いたのか、誰が軍糧を惜しんだのか、誰が味方の敗北を自分の利に変えたのかと問われる。一人に向けられていた罵声は、たちまちかつての同盟者たちへと広がった。\n\n誰かが盟書を片づけようとしたが、私はまだ紙の端を押さえていた。もはや誰も従おうとしなくとも、あの誓いが口にされた事実は消えない。散っていった者たちが再び顔を合わせ、以前のように杯を上げようとするときにも、今日の恨み言を思い出さずにはいられないだろう。"
 hd_world_news.0007.no_place_desc:0 "討董の盟書が再び取り出された。しまい込まれたときについた折り目が、まだはっきりと残っている。だが、[hd_news_a.GetName]はついに諸軍を勝利へ導けず、兵は次々と散っていった。[hd_news_b.GetName]はまだ生きており、天子の境遇も、あの盟誓によって救われることはなかった。\n\n私は紙にびっしりと並んだ名を指でなぞった。挙兵の折には、朝廷を救う者たちとして読み上げられた名だ。今ではその名が出ると、誰が先に退いたのか、誰が軍糧を惜しんだのか、誰が味方の敗北を自分の利に変えたのかと問われる。一人に向けられていた罵声は、たちまちかつての同盟者たちへと広がった。\n\n誰かが盟書を片づけようとしたが、私はまだ紙の端を押さえていた。もはや誰も従おうとしなくとも、あの誓いが口にされた事実は消えない。散っていった者たちが再び顔を合わせ、以前のように杯を上げようとするときにも、今日の恨み言を思い出さずにはいられないだろう。"
