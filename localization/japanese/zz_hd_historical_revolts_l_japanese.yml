 hd_revolt_war_name_heishan:0 "黒山賊の反乱"
 hd_revolt_war_name_jiangxia:0 "江夏蛮の反乱"
 hd_revolt_war_name_wangguo:0 "西北の羌乱"
 hd_revolt_war_name_zhangchun:0 "張純・張挙の反乱"
 hd_revolt_war_name_bingzhou_hu:0 "休屠胡の乱"
 hd_revolt_war_name_maxiang:0 "益州黄巾の蜂起"
 hd_revolt_war_name_yanbaihu:0 "割拠"

 # 事件军名称
 hd_revolt_army_jiaozhi:0 "交趾屯軍"
 hd_revolt_army_beigong:0 "湟中義従の叛軍"
 hd_revolt_army_heishan:0 "黒山軍"
 hd_revolt_army_jiangxia:0 "江夏蛮の衆"
 hd_revolt_army_wangguo:0 "涼州王国軍"
 hd_revolt_army_zhangchun:0 "漁陽の叛軍"
 hd_revolt_army_bingzhou_hu:0 "休屠各胡の衆"
 hd_revolt_army_maxiang:0 "益州黄巾"
 hd_revolt_army_yanbaihu:0 "厳白虎の部衆"

 # 生成首领称号名
 hd_jiaozhi_garrison_leader:0 "交趾屯帥"
 nick_hd_zhutian_general:0 "柱天将軍"
 hd_jiangxia_manshuai:0 "蛮"

 # REV-01 184.6 交趾柱天将军
 hd_historical_revolts.0001.t:0 "柱天将軍"
 hd_historical_revolts.0001.desc:0 "交趾からの急報が届いた。龍編の屯兵がすでに事を起こし、[hd_revolt_leader.GetName]が渠帥に推されて柱天将軍を自称したという。使者はまず道中で通行できる道筋を一通り説明したが、それは叛軍の兵数よりもなお説明しがたいものだった。\n\nあなたは地図上の遠く離れた郡県を見つめた。嶺外は山川に隔てられ、一つの屯営で乱が起こっても、近隣の県邑がすぐに知るとは限らない。知らせがあなたのもとに届くまでに、どれほどの者がすでに叛旗に従って向きを変えたことだろう。\n\n堂の下で、この急報をどこへ回すべきかと尋ねる者がいた。あなたはそれを机の前に留め置いた。戦火がすでにあなたの治下に及んだ以上、「柱天将軍」をただの荒唐無稽な名号として笑って済ませるわけにはいかない。"
 # REV-02 184.10 北宫伯玉
 hd_historical_revolts.0002.t:0 "湟中の羌胡反す"
 hd_historical_revolts.0002.desc:0 "金城方面からの軍報が、湟中と河関で兵が起こったことを伝えた。[hd_revolt_leader.GetName]が諸部を糾合し、涼州の道路と関隘は、もはや古い地図にあるように安泰ではない。\n\n使者は騎兵の足跡について語りながら、地図の上に手を伸ばして何か所も線を引いた。あなたは地図の端を押さえ、どれが自分の目で見たもので、どれが道中の噂なのかを区別させた。辺地で騎兵一隊を誇張するたびに、後方では守備隊一つがむざむざ撤収されかねない。だが知らせが入り乱れているからとためらっていれば、本当に攻め寄せてくる敵兵はあなたを待ってはくれない。\n\n涼州から三輔へ通じる道は、今この時、急にどれも狭くなったように思えた。あなたは偵察すべき場所を改めて指示した。この戦いは、もはや避けようがない。"
 # REV-03 185.2 黑山军
 hd_historical_revolts.0003.t:0 "黒山軍起つ"
 hd_historical_revolts.0003.desc:0 "太行山中の部衆は、もはやばらばらに追い剥ぎを働くだけではなく、共通の旗印を掲げるに至った。[hd_revolt_leader.GetName]が衆を集めて兵を起こし、黒山軍についての報せが各地の県署から次々と送られてくる。\n\nあなたは書吏に山口と被害を受けた地を一か所にまとめて記させ、ようやく気づいた。ばらばらに見えた知らせは、実は谷筋に沿って一つまた一つとつながり、一帯をなしていたのだ。平地の軍隊なら探りやすいが、ひとたび山に入れば、いくつかの分かれ道だけで足跡は再び散ってしまう。\n\nなおも彼らを小さな群盗と呼び慣わしている者がいた。あなたは机の上にますます厚く積まれていく急報を指さした。名前は相変わらず軽んじて書いてもよい。だが備えまで相変わらずというわけにはいかない。今あなたと兵を交えているのは、すでに兵勢を一つにまとめられる者たちなのだ。"
 # REV-04 185.4 江夏蛮（设计性日期后移：史载主要叛乱约180年）
 hd_historical_revolts.0004.t:0 "江夏蛮叛す"
 hd_historical_revolts.0004.desc:0 "江夏からの報せによれば、竟陵付近の諸部がすでに衆を集めて山を出て、[hd_revolt_leader.GetName]が率いる人々が県邑を荒らし始めたという。急報のほかに、商人からも道筋を変えたとの知らせが届き、水路も陸路も普段より遅れている。\n\nあなたは軍吏に、どこなら追撃でき、どこは守りを固めるべきかを尋ねた。彼は密林や沼沢のことを語ったが、どれも地図の上に一本の境界線を引くだけで守れるような場所ではなかった。相手は道を知り尽くして進退自在であり、こちらがいちいち後を追えば、かえって軍勢を分散させてしまうかもしれない。\n\n机の上の二通の報せは同じ一帯を指しているが、その文面にはそれぞれ軽重の違いがある。あなたは二つを並べて置き、まずはすでにあなたに兵を挙げたこの敵を見定めることにした。"
 # REV-05 187.4 王国
 hd_historical_revolts.0005.t:0 "王国挙兵す"
 hd_historical_revolts.0005.desc:0 "漢陽方面からの知らせによれば、[hd_revolt_leader.GetName]がすでに兵を挙げ、その兵鋒は陳倉に向けられているという。帳中で別の軍務を議論していた者たちも、その地名を聞くと、皆一瞬口をつぐんだ。\n\nあなたは関中以西の図籍を取り寄せ、道筋に沿って涼州まで目で追った。以前のあの戦場が本当に平定されたかどうかは、目の前のこの兵馬に対する備えにはならない。陳倉が脅かされるなら、糧の輸送も関隘も、すべて改めて調べ報告させねばならない。\n\n使者は、これまでの配置どおりに命令を伝えるべきかと尋ねた。あなたは過去の捷報をもって答えるのではなく、まず今回の敵軍の動きをはっきり説明させた。関門を守り抜けるかどうかは、今日そこを守る兵にかかっている。昨日の文書に残る名声に頼ることはできない。"
 # REV-06 187.6 张纯、张举
 hd_historical_revolts.0006.t:0 "張挙、天子を称す"
 hd_historical_revolts.0006.desc:0 "肥如方面からの急報が届いた。張挙と張純がすでに烏桓と結託し、兵を挙げて乱を起こしたという。報せには一方で彼らが新たに立てた天子や将軍の名号が並べられ、もう一方では辺郡がいかに敵に当たるべきかを催促していた。\n\nあなたはそれらの大仰な称号に目を通し、その後ろに記された道路と城邑に視線を止めた。帝を称する言葉など一日のうちに知れ渡る。だが州郡を本当に不安にさせているのは、旗に従ってやって来る騎兵と、それまで様子見をしていた者たちがこれを機に呼応するかどうかである。\n\n門の外にまた面会を求める者がおり、もたらしたのもやはり北方の知らせだった。あなたは書吏に、檄文を写すことばかりに気を取られず、各地の軍情を必ず分けてきちんと記すよう命じた。相手がすでに干戈を向けてきた以上、こちらも名号のことばかりで争っているわけにはいかない。"
 # REV-07 188.3 休屠各胡
 hd_historical_revolts.0007.t:0 "休屠各胡反す"
 hd_historical_revolts.0007.desc:0 "美稷一帯の動乱は、ついに戦争へと発展した。休屠各の諸部が[hd_revolt_leader.GetName]に従って兵を挙げ、并州からの急報が一度に届いた。かつての返書にあった「道路平穏」の言葉は、もはや信じられない。\n\nあなたは諸部の行方を一項ずつ報告させて聞くうちに、かつての帰属だけで誰がまだ命に従うかを判断してはならないと悟った。もとの場所を守っている部衆もあれば、すでに新たな号令に従って動いた者もおり、県署と軍中から報告される名前も一致するとは限らない。\n\nあなたはいくつかの曖昧な箇所に丸をつけ、改めて調べさせた。今最も肝心なのは、どの道がまだ通れるか、どこに確かに守備兵がいるかを明らかにすることであって、何年も前の安置の帳簿を今日の辺境の保証とすることではない。"
 # REV-08 188.6 马相
 hd_historical_revolts.0008.t:0 "益州黄巾"
 hd_historical_revolts.0008.desc:0 "綿竹方面からの急報は、はじめは黄巾が衆を集めたと伝えていたが、後から来た文書はすでに帝を称したことに触れていた。[hd_revolt_leader.GetName]の旗印が蜀中に掲げられ、県邑と道路からの知らせは一通ごとに切迫していく。\n\nあなたは前後二通の急報を見比べた。その間の日数はさほど長くないのに、情勢はすでに大きく変わっている。山川は外敵を阻むが、州内からの急報を遅らせもする。一か所が本当に陥落した時には、近隣にはもはや悠々と備える余裕はないかもしれない。\n\nこれは昔の黄巾の残党が名目を変えただけではないのか、まずそれを見極めるべきだと勧める者がいた。あなたは彼に、まず兵の行方を調べに行かせた。どの旗を借りて事を起こそうと、今やすでにあなたに兵を挙げた敵であることに変わりはない。"
 # REV-09 196.1 严白虎
 hd_historical_revolts.0009.t:0 "厳白虎の屯聚"
 hd_historical_revolts.0009.desc:0 "呉郡各地からの報せは、どれも[hd_revolt_leader.GetName]に触れていた。もともと塢壁にそれぞれ拠っていた人々が集結しつつあり、水陸の要衝には新たな旗が立ち、行き交う商人たちも誰と交渉すべきかを探り始めている。\n\nあなたは各県の返書に目を通し、最も曖昧に書かれているのが、まさに城から遠く離れた地であることに気づいた。県城の門を守ることと、山水の間の道々をなお一つの号令に従わせることとは、別の話である。\n\n堂の下では、なおこれを田舎の屯聚と呼ぶ者がいた。あなたはすでに届いている戦報を見せた。江東の帰属は、県署の扁額に書くだけで決まるものではない。往来を扼し、兵を集められるあの者は、すでにあなたとこの地を争っているのだ。"

 hd_historical_revolts.0010.t:0 "兵威に迫られて"
 hd_historical_revolts.0010.desc:0 "[hd_beigong_victor.GetName]の使者が帳に入ってきて、まず軍中の号令を読み上げ、それからようやくあなたの身の振り方に話を移した。彼はあなたに帰順し、以後彼を主として奉じることを求めており、長々とした辞退の言葉をもう一度聞く気はなさそうだった。\n\nあなたは手元の印綬に目を落とした。名位はまだある。だがそれで動かせる者は、もはやこの命令を境の外に退けるには足りない。帳の下では誰も口を開かず、文書を行き来させる足音さえずっと静かになった。\n\nこれは厚い礼をもって招かれる盟約ではない。気が進まなくとも、その気の進まなさで目の前に迫った兵勢を変えることはできない。今できるのは、帰順の話をまとめ、まだ経営を続けられる地を守ることだ。"
 hd_historical_revolts.0010.a:0 "号令を受け、その節制に帰す。"

 hd_historical_revolts.a:0 "諸郡に檄を飛ばし、厳重に警戒させよ。"
