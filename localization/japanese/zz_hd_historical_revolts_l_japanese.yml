 ###############################################################

 # 共用CB
 hd_historical_revolt_cb:0 "割拠の反乱"
 HD_HISTORICAL_REVOLT_WAR_NAME:0 "[ATTACKER.Custom('HD_HISTORICAL_REVOLT_NAME_BY_ATTACKER')]"
 hd_historical_revolt_war_victory_desc:0 "[attacker.GetShortUIName|U]は争われた諸郡を手に入れて一方に自立し、[GetGovernment('celestial_government').GetName]に改める。"
 hd_historical_revolt_white_peace_desc:0 "双方が兵を収め、境界はもとのまま、反乱の衆はそれぞれ散っていく。"
 hd_historical_revolt_defeat_desc:0 "反乱は平定され、反乱の衆は潰走し、領土は損なわれない。"

 # 战争名称（custom loc按起义领袖旗标分流）
