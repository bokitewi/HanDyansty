 building_type_hd_shouchun_city_01:0 "寿春城"
 building_type_hd_shouchun_city_01_desc:0 "寿春は淮水の南岸にあり、八公山を背にし、肥水が城の北を巡って淮水に注ぐ。楚の考烈王は東遷してここに都し、なお郢と号した。漢が興った後、淮南王劉安もここに都し、賓客や方士を招いて書を著し道を論じた。この城はこうして淮南随一の都会となった。"
 building_hd_shouchun_city_01:0 "$building_type_hd_shouchun_city_01$"
 building_hd_shouchun_city_01_desc:0 "$building_type_hd_shouchun_city_01_desc$"
 building_type_hd_jinyang_city_01:0 "晋陽城"
 building_type_hd_jinyang_city_01_desc:0 "晋陽は趙簡子の家臣董安于が築いた古城である。智伯はかつて水を引いて城を水攻めにし、城中では釜を吊るして炊事するほどであったが、趙襄子はなお固守して降らず、ついに智氏を滅ぼした。城は汾水のほとりにあり、今は太原郡の治所にして并州の重鎮である。"
 building_hd_jinyang_city_01:0 "$building_type_hd_jinyang_city_01$"
 building_hd_jinyang_city_01_desc:0 "$building_type_hd_jinyang_city_01_desc$"
 building_type_hd_yubi_city_01:0 "玉璧城"
 building_type_hd_yubi_city_01_desc:0 "河東郡の汾水南岸に一つの高台地があり、その上は平坦で、四方は谷が深く切れ込み、さながら天然の城壁のようである。台地の上に立てば汾水の河谷を見下ろすことができ、太原と平陽の間を行き来する旅人はすべて眼下に収まる。"
 building_hd_yubi_city_01:0 "$building_type_hd_yubi_city_01$"
 building_hd_yubi_city_01_desc:0 "$building_type_hd_yubi_city_01_desc$"
 building_type_hd_baidi_city_01:0 "白帝城"
 building_type_hd_baidi_city_01_desc:0 "巴郡魚復県では、大江がここで峡口を切り開き、山崖が壁のようにそそり立つ。伝えによれば、公孫述が蜀に拠った時、井戸の中に竜のような白い気を見て自ら白帝と号し、山上に城を築いたという。城は峡口の高みに拠り、巴蜀から東へ荊楚に出る水路を扼している。"
 building_hd_baidi_city_01:0 "$building_type_hd_baidi_city_01$"
 building_hd_baidi_city_01_desc:0 "$building_type_hd_baidi_city_01_desc$"
 building_type_hd_yecheng_city_01:0 "鄴城"
 building_type_hd_yecheng_city_01_desc:0 "鄴は斉の桓公が築いた古城である。戦国時代、西門豹が鄴令となり、河伯に妻を娶らせる陋習を打ち破り、さらに渠を開いて漳水を引いて田を潤し、鄴の地はこれにより豊かになった。今は魏郡の治所であり、城郭は整然とし、市里は繁盛し、河北で一、二を争う大城である。"
 building_hd_yecheng_city_01:0 "$building_type_hd_yecheng_city_01$"
 building_hd_yecheng_city_01_desc:0 "$building_type_hd_yecheng_city_01_desc$"
 building_type_hd_yecheng_three_platforms_01:0 "鄴城三台"
 building_type_hd_yecheng_three_platforms_01_desc:0 "鄴城の西北隅は城壁が高く厚く、地勢も高く爽やかである。城に登って北を望めば漳水が東へ流れるのが見え、西を眺めれば太行山が横たわる。ここはまさに台を築いて眺望するにふさわしく、もし雄主がここに高台を起こし賓客を会すれば、必ずや天下に名を轟かせるであろう。"
 building_hd_yecheng_three_platforms_01:0 "$building_type_hd_yecheng_three_platforms_01$"
 building_hd_yecheng_three_platforms_01_desc:0 "$building_type_hd_yecheng_three_platforms_01_desc$"
 building_type_hd_pengcheng_city_01:0 "彭城"
 building_type_hd_pengcheng_city_01_desc:0 "彭城は彭祖の封国と伝えられ、西楚の覇王項羽もかつてここに都した。城は泗水と獲水の合流点に拠り、北は斉魯を押さえ、南は江淮に通じ、城壁は高大で、市坊が周りを取り巻いている。今は彭城国の都である。"
 building_hd_pengcheng_city_01:0 "$building_type_hd_pengcheng_city_01$"
 building_hd_pengcheng_city_01_desc:0 "$building_type_hd_pengcheng_city_01_desc$"
 building_type_hd_linzi_city_01:0 "臨淄城"
 building_type_hd_linzi_city_01_desc:0 "臨淄は斉の故都であり、大城と小城が連なり、宮殿・宗廟・市里がそれぞれあるべき位置に収まっている。蘇秦はかつて、この城の街路では車の轂がぶつかり合い、行き交う人は肩を擦り合わせ、袖を挙げれば幕となり、汗を払えば雨となると言った。今なお東方随一の大都会である。"
 building_hd_linzi_city_01:0 "$building_type_hd_linzi_city_01$"
 building_hd_linzi_city_01_desc:0 "$building_type_hd_linzi_city_01_desc$"
 building_type_hd_tongwan_city_01:0 "統万城"
 building_type_hd_tongwan_city_01_desc:0 "上郡の北、奢延水のほとりに白い土の高地があり、四方は砂礫と水草が入り混じり、匈奴や羌胡の部衆がしばしばここで遊牧する。この地の土は白く堅く、突き固めれば砥石のように堅牢になる。"
 building_hd_tongwan_city_01:0 "$building_type_hd_tongwan_city_01$"
 building_hd_tongwan_city_01_desc:0 "$building_type_hd_tongwan_city_01_desc$"
 building_type_hd_zuoguo_city_01:0 "左国城"
 building_type_hd_zuoguo_city_01_desc:0 "西河郡離石の北にある左国城は、南匈奴の部衆が集住する地である。城壁が巡らされているものの、城中の民家はまばらで、毛氈の天幕と家畜の群れが四方の野に散らばり、いかにも塞上の荒涼とした趣である。"
 building_hd_zuoguo_city_01:0 "$building_type_hd_zuoguo_city_01$"
 building_hd_zuoguo_city_01_desc:0 "$building_type_hd_zuoguo_city_01_desc$"
 building_type_hd_xiangyang_city_01:0 "襄陽城"
 building_type_hd_xiangyang_city_01_desc:0 "襄陽城は北に漢水を臨み、江を隔てて樊城と相対し、城の南には峴山が屏風のように控え、城は高く堀は深い。南陽から江陵へ通じる大道がここを通り、江漢の間で南北を扼する要衝である。"
 building_hd_xiangyang_city_01:0 "$building_type_hd_xiangyang_city_01$"
 building_hd_xiangyang_city_01_desc:0 "$building_type_hd_xiangyang_city_01_desc$"
 building_type_hd_hefei_city_01:0 "合肥城"
 building_type_hd_hefei_city_01_desc:0 "合肥は江淮の間にあり、夏に水かさが増すと施水と肥水がここで合流するため、合肥と名づけられた。南方の皮革・鮑魚・木材はみなここに集まって散じ、江淮の間の商業都市となっている。"
 building_hd_hefei_city_01:0 "$building_type_hd_hefei_city_01$"
 building_hd_hefei_city_01_desc:0 "$building_type_hd_hefei_city_01_desc$"
