l_japanese:
 saas_recruit_talent_edict_modifier: "招賢令"
 saas_recruit_talent_edict_modifier_desc: "この君主は天下の賢士を広く求めており、同じく令を掲げて賢者を求める諸侯と競って人材を招き寄せている。"
 saas_retainer_defense_reform_modifier: "守備の整頓"
 saas_retainer_defense_reform_modifier_desc: "門客が守備の名簿を改め、武庫を整え、郷兵を訓練したため、城の守りは面目を一新した。"

 saas_retainer_patronage_opinion: "任用された"
 saas_retainer_rejected_opinion: "提言を拒まれた"
 saas_retainer_project_success_opinion: "才能を認められた"
 saas_retainer_project_failure_opinion: "務めをしくじった"
 saas_retainer_diplomatic_success_opinion: "使者の斡旋"

 saas_recruit_talent_decision: "招賢令を発布する"
 saas_recruit_talent_decision_confirm: "令を掲げて賢者を求めよ！"
 saas_recruit_talent_decision_desc: "礼は崩れ楽は壊れ、士に定まった主はない。もし四方に令を掲げ、礼遇と厚禄を約束すれば、才を抱きながら世に容れられぬ天下の士が、噂を聞きつけて身を寄せてくるかもしれない。"
 saas_recruit_talent_decision_tooltip: "広く招賢の令を発し、天下の諸侯と四方の英才を争う"
 saas_recruit_talent_decision_effect: "招賢の令は檄となって四方に伝わり、才ある士が主を選んで身を寄せてくるかもしれない。"
 saas_retainer_project_pending_tt: "#EMP この件の成否は、数か月後にようやく明らかになる。#!"

 saas_elite_guest_arrived_title: "名士の来訪"
 saas_elite_guest_arrived_desc: "[saas_elite_guest.GetShortUIName]が名声を慕ってやって来て、すでにあなたの宮廷に客として滞在している。"
 saas_elite_adventurer_spawned_title: "豪傑の自立"
 saas_elite_adventurer_spawned_desc: "[saas_elite_guest.GetShortUIName]はあなたの領地に姿を現したが、人の下に甘んじることを望まず、すでに自ら手勢を集めて四方へ旅立っていった。"

 saas_retainer.1100.t: "貨殖の策"
 saas_retainer.1100.desc: "[retainer.GetShortUIName]は貨殖を営む策書を差し出し、わずか数か月で元手を倍にできると言う。この者は確信に満ちた口ぶりで、かなりの自信があるようだ。だが元手をすべて失えば、その穴はあなたが埋めるほかない。"
 saas_retainer.1100.a: "その才を少し試そう。わずかに出してやる。"
 saas_retainer.1100.b: "力に見合うだけ出して、成果を見よう。"
 saas_retainer.1100.c: "有り金すべてを預ける。成功すれば大儲けだ。"
 saas_retainer.1100.d: "わしの金には、ほかに使い道がある。"
 saas_retainer.1101.t: "貨殖の結果"
 saas_retainer.1101.desc.success: "[retainer.GetShortUIName]は明瞭な帳簿を携えて戻ってきた。収益はなかなかのものだ――この商いは確かに元手を倍にしたのである。"
 saas_retainer.1101.desc.failure: "[retainer.GetShortUIName]は手ぶらで戻ってきた。相場も人心も見込みどおりには動かず、投じた金はもう取り戻せない。"
 saas_retainer.1101.desc.invalid: "情勢が移り変わり、この商いはもはや続けられなくなった。帳簿も元手もそれとともに散逸してしまった。"
 saas_retainer.1101.a: "まさにわしが求めていた人材だ。"
 saas_retainer.1101.b: "前車の轍としておこう。"
 saas_retainer.1101.c: "この件はもはや追及しようがない。"

 saas_retainer.1200.t: "隣国への使者を請う"
 saas_retainer.1200.desc: "[retainer.GetShortUIName]は[neighboring_ruler.GetShortUIName]の宮廷への使者となることを願い出た。三寸の舌といくらかの手土産があれば、両家の隔たりを解消するに足ると自負している。"
 saas_retainer.1200.a: "使節の費用を揃え、送り出せ。"
 saas_retainer.1200.b: "今は使者を送るべき時ではない。"
 saas_retainer.1201.t: "使者の帰還"
 saas_retainer.1201.desc.success: "[retainer.GetShortUIName]は使命を果たした。[neighboring_ruler.GetShortUIName]は贈り物を受け取ったばかりか、あなたの誠意を大いに称賛した。"
 saas_retainer.1201.desc.failure: "[retainer.GetShortUIName]の弁舌は[neighboring_ruler.GetShortUIName]の心を動かせず、この使節は手ぶらで戻ってきた。"
 saas_retainer.1201.desc.invalid: "使節団が使命を果たす前に情勢が大きく変わり、この使節は成果なく引き返すほかなかった。"
 saas_retainer.1201.a: "よし！両家はこれで修好した。"
 saas_retainer.1201.b: "災いを招かなかっただけでも幸いだ。"
 saas_retainer.1201.c: "時勢がかくのごとくでは、人の力ではどうにもならぬ。"

 saas_retainer.1300.t: "城の守りを整える"
 saas_retainer.1300.desc: "[retainer.GetShortUIName]は都城を巡視し、武庫・城門・徴発名簿の多くが緩みきっていると指摘して、[retainer.GetHerHim]の手でひとつ立て直しを取り仕切らせてほしいと願い出た。"
 saas_retainer.1300.a: "銭と兵糧を出す。直ちに立て直せ。"
 saas_retainer.1300.b: "旧制でもまだ守りには足りる。改める必要はない。"
 saas_retainer.1301.t: "城の守りの新たな姿"
 saas_retainer.1301.desc.success: "[retainer.GetShortUIName]は立て直しを終えた。城門の警備は厳重になり、武庫は整然とし、郷里の徴発名簿も改めて編成された。"
 saas_retainer.1301.desc.failure: "立て直しはことごとく阻まれた。[retainer.GetShortUIName]は心力を使い果たしたが、守備は一向に改善しなかった。"
 saas_retainer.1301.desc.invalid: "情勢が急変し、予定していた守備の立て直しはもはや続けられない。"
 saas_retainer.1301.a: "都城は安泰だ。わしも大いに安堵した。"
 saas_retainer.1301.b: "積年の弊は除き難い。一朝一夕にはいかぬ。"
 saas_retainer.1301.c: "ひとまず目の前のことに目を向けよう。"

 saas_retainer.1400.t: "横領の調査"
 saas_retainer.1400.desc: "[retainer.GetShortUIName]は帳簿の間に怪しい欠損があることに気づき、何者かが公金を横領しているのではないかと疑って、ひそかにこの件を追及したいと申し出た。"
 saas_retainer.1400.a: "費用を与える。必ず突き止めよ。"
 saas_retainer.1400.b: "宮中の者を皆疑心暗鬼にさせてはならぬ。"
 saas_retainer.1401.t: "横領金追及の結果"
 saas_retainer.1401.desc.success: "[retainer.GetShortUIName]は帳簿と供述を手繰り、隠された不正の金を見つけ出した。関わった者はすでに罪に服し、宮中の上下もこれによってあなたの耳目をいっそう恐れるようになった。"
 saas_retainer.1401.desc.failure: "手がかりは結局途絶えた。[retainer.GetShortUIName]は金を取り戻せず、この調査はかえって宮中の一部に恨みを抱かせる結果となった。"
 saas_retainer.1401.desc.invalid: "調査を主導する人員も情勢もすでに変わり、この件はひとまず棚上げするほかない。"
 saas_retainer.1401.a: "不正の金は取り戻し、法度もまた立った。"
 saas_retainer.1401.b: "ここで打ち切りとする。"
 saas_retainer.1401.c: "古い記録は封印し、二度と口にするまい。"

 saas_retainer.1500.t: "典籍の校訂"
 saas_retainer.1500.desc: "[retainer.GetShortUIName]は、古い典籍・農書・地方の帳簿が散乱していると述べ、書吏を召集して一つずつ校訂し、礼制と農政のいずれにも拠るべき規範を備えさせたいと願い出た。"
 saas_retainer.1500.a: "費用を出す。速やかに校訂せよ。"
 saas_retainer.1500.b: "今はそのような余裕はない。"
 saas_retainer.1501.t: "新たな書冊の完成"
 saas_retainer.1501.desc.success: "[retainer.GetShortUIName]は散逸した文書を条理整然とした新たな書冊にまとめ上げた。官吏はこれに拠って政を行い、士民も礼法と農時をよりよく理解するようになった。"
 saas_retainer.1501.desc.failure: "文書は膨大で、しかも互いに食い違うものが多かった。[retainer.GetShortUIName]は結局、期限内に使える書冊を編み上げることができなかった。"
 saas_retainer.1501.desc.invalid: "担当者か情勢が変わり、典籍の校訂はここで中断した。"
 saas_retainer.1501.a: "この書は後世を潤すに足る。"
 saas_retainer.1501.b: "残った草稿はしまっておこう。"
 saas_retainer.1501.c: "ひとまず置いておこう。"
