l_japanese:
 hd_dc_era.0001.t: "詔令の届かぬ地"
 hd_dc_era.0001.desc: "机の上の地図はもう長いこと替えられていないが、各地から届く文書は次第に呼び名を改めつつある。なお朝廷の正朔を奉じる所もあれば、自らの境内の軍糧のことしか語らぬ所もあり、いつまでも返答のない所もいくつかある。\n\nこうした境界は今日になって現れたものではない。長年にわたる離散が、ついに誰も避けて通れぬ局面となったのだ。新たな盟約、征伐、建国の議は、こうしてすでに変わった関係の中から芽生えてくる。あなたもその中に自らの行き場を見出さねばならない。"
 hd_dc_era.0001.a: "まずは天下の変転を見極め、それから進退を定めよう。"
 hd_dc_era_rules_tt: "以下の場合、天下はただちに群雄割拠に陥る（[tributaries|E]の領地と戦時中の占領地は、[son_of_heaven|E]の掌握下とはみなされない）：\n$BULLET$情勢緊迫の時代に、[son_of_heaven|E]が掌握する天下の法定[counties|E]が2割に満たない\n$BULLET$天下崩壊の時代に、中華の[hegemony|E]に主がいない、または[son_of_heaven|E]が掌握する天下の法定[counties|E]が4割に満たない\n乱世は「乱世を終わらせる」[decision|E]によってのみ収束する：天下の法定[counties|E]の8割を掌握する必要があり、[tributaries|E]の統治下の地も含めて数える。"
 hd_dc_era_no_sovereignty_change_tt: "旧来の名分は残っているが、諸侯はすでにそれぞれ去就を胸に秘めている。天子直属の[vassals|E]はそれぞれ土地を擁して自立し、天子には直轄地だけが残る。乱世においては、[vassals|E]は主君に「独立を要求」でき、主君が認めれば平和裏に分立する。認めなければ彼らはやはり自立し、主君は兵を起こして「逆賊討伐」を行うことができる。"
 hd_dc_mandate_observation_tt: "天命は再びあなたのもとに帰したが、この乱世での封賞はすでに受け取っているため、再び授けられることはない。"
 hd_dc_mandate_once_per_era_tt: "あなたはこの乱世でまだ天命の賞を受け取っていない、またはあなたは中華の[hegemony|E]を保有していない"
