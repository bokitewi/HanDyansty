l_japanese:
 # 天朝循环·时代特色：乱世「要求独立」（2026-10-08）
 hd_dc_demand_independence_interaction: "独立を要求する"
 hd_dc_demand_independence_interaction_desc: "天下は大いに乱れている。[recipient.GetShortUIName]に臣従からの離脱を要求し、一方に自立する。拒否されてもあなたは自立するが、相手は兵を起こして逆賊を討つことができる。"
 hd_dc_demand_independence_interaction_notification: "乱世の中、我は一方に自立したい。主公にはどうかお許しいただきたい。"
 hd_dc_demand_independence_decline_tt: "[actor.GetShortUIName|U]はそれでも自立する。以後10年間、[recipient.GetShortUINamePossessive]の基業の主は#V 逆賊討伐#!の名目で兵を起こすことができ、勝利すれば相手を領地ごと再び臣従させ、本人を投獄する。"
 hd_dc_demand_indep_ai_strength_1: "その兵力は我に劣らない"
 hd_dc_demand_indep_ai_strength_05: "その兵力は我の半分以上に達する"
 hd_dc_demand_indep_ai_strength_weak: "その兵力は我の4分の1に満たない"
 HD_DC_TRUCE_DEMAND_INDEPENDENCE: "自立を許された"
 # 2026-10-11 独立/招降过频修复
 hd_dc_demand_independence_interaction_desc_sub: "天下は大いに乱れている。[recipient.GetShortUIName]に麾下からの離脱を願い出て、その上位の主君に鞍替えする。認められるか否かにかかわらずあなたは上位の主君に鞍替えするが、それによって一方に自立するわけではない。"
 hd_dc_demand_indep_recently_submitted_tt: "新たに帰順したばかりで、5年間は離脱を求められない"
 hd_dc_demand_indep_min_size_tt: "2県以上を領有していなければならない"
 hd_dc_left_for_overlord_opinion: "我を見捨てて上位の主君に身を投じた"
 hd_dc_demand_independence_interaction_notification_sub: "乱世の中、我は直接上位の主君の麾下に身を投じたい。主公にはどうかお許しいただきたい。"
