 beifangzongjiao_religion_desc:0 "北方の諸族は古来それぞれの神を祀ってきた。東方の民は玄鳥を尊び夷礼を守り、戎狄は天地山川と祖霊を敬い、塞外の諸部には太鼓を打って神を降ろす巫者がいる。祭祀はそれぞれ異なるが、天を敬い祖を尊ぶことは一つである。"

