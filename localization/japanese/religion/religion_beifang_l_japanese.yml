 xirongfangling:1 "西戎汎霊"
 xirongfangling_adj:0 "西戎汎霊"
 xirongfangling_adherent:1 "信徒"
 xirongfangling_adherent_plural:1 "信徒"
 xirongfangling_desc:0 "戎人は隴山の内外に散居し、周以来秦人や諸夏と雑居して、絶えず攻伐を繰り返してきた。その風俗は武を尚び生を軽んじ、人牲をもって天を祭る。死者は野に捨てて鳥獣に啄ませることもあり、それによって魂魄が天に昇ると考えている。"

 xirongfangling_old:1 "旧西戎汎霊"
