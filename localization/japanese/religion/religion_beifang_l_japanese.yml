 saman:1 "サマン"
 saman_adj:0 "サマン"
 saman_adherent:1 "信徒"
 saman_adherent_plural:1 "信徒"
 saman_desc:0 "東北の粛慎・挹婁の諸部と塞外の漁猟の民は、みな巫者が神霊に通じると信じている。巫者は太鼓を打って舞い、神がその身に宿ると、一族のために祟りを祓い病を癒し、吉凶を占う。大祭のたびに牲を殺して痛飲し、山林と鳥獣の霊に感謝を捧げる。"

