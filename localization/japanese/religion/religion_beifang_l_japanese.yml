 beidifangling:1 "北狄汎霊"
 beidifangling_adj:0 "北狄汎霊"
 beidifangling_adherent:1 "信徒"
 beidifangling_adherent_plural:1 "信徒"
 beidifangling_desc:0 "狄人は代々太行山と恒山の間に住み、周の時代から諸夏と雑居し、あるいは戦い、あるいは婚姻を結んできた。その風俗は天地山川を敬い、祖霊を尊び、巫者は神を降ろして憑依させることができ、男女ともに祭祀を主宰できる。"

 beidifangling_old:1 "北狄汎霊"
 beidifangling_old_adj:1 "北狄汎霊"
 beidifangling_old_adherent:1 "旧信徒"
