 yili:1 "夷礼"
 yili_adj:0 "夷礼"
 yili_adherent:1 "信徒"
 yili_adherent_plural:1 "信徒"
 yili_desc:0 "東夷の人々は少昊を祖先と仰ぐ。伝えによれば少昊は鳥をもって官を名づけ、鳳鳥・玄鳥・伯趙・青鳥・丹鳥がそれぞれ暦時を司ったという。夷人は星を観て時を授け、鳥を祀り祖を祭る。その玉を用い鼎を列ねる礼は、三代の礼楽の源であるとも言われる。"

