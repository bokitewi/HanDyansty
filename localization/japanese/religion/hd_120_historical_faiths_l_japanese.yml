l_japanese:
 hd_beifang_faith:0 "北方汎霊信仰"
 hd_beifang_faith_adj:0 "北方汎霊"
 hd_beifang_faith_adherent:0 "汎霊信徒"
 hd_beifang_faith_adherent_plural:0 "汎霊信徒"
 hd_beifang_faith_desc:0 "北方の諸族は天地・祖霊・山川を敬い、各部族はその伝承に従って神霊を祀る。東夷は夷礼を守り、狄と戎はそれぞれの神を祀り、塞外の漁猟の民は巫者の降神に従う。"
 hd_nanfang_faith:0 "南方汎霊信仰"
 hd_nanfang_faith_adj:0 "南方汎霊"
 hd_nanfang_faith_adherent:0 "汎霊信徒"
 hd_nanfang_faith_adherent_plural:0 "汎霊信徒"
 hd_nanfang_faith_desc:0 "南方の諸族は祖霊・山川・日月を祀り、鬼神に仕えて巫祝を重んじる。越人・楚人・巴人と南中の諸夷はそれぞれの祭祀を守り、巫の風は江漢から嶺外にまで及んでいる。"
 hd_han_taoism_faith:0 "漢代道教"
 hd_han_taoism_faith_adj:0 "漢代道教"
 hd_han_taoism_faith_adherent:0 "道衆"
 hd_han_taoism_faith_adherent_plural:0 "道衆"
 hd_han_taoism_faith_desc:0 "道を奉じる者は黄老を尊び、身を修め性を養い、符水や斎醮によって人々の病を祓い災いを除く。蜀中・漢中の五斗米道と関東の太平道はいずれもこの流れを汲み、信徒は州郡に満ちている。"
 ashari:0 "アシュアリー派"
 ashari_adj:0 "アシュアリー派"
 ashari_adherent:0 "アシュアリー派信徒"
 ashari_adherent_plural:0 "アシュアリー派信徒"
 ashari_desc:0 "この派はスンナ派の正統を厳守し、経典の教えを立教の根本とし、法学者の裁定を尊び、信徒に敬虔に法を守るよう求める。"
 muwalladi:0 "ムワッラド派"
 muwalladi_adj:0 "ムワッラド派"
 muwalladi_adherent:0 "ムワッラド派信徒"
 muwalladi_adherent_plural:0 "ムワッラド派信徒"
 muwalladi_desc:0 "この派の信徒の多くは新たに改宗した土地の民であり、スンナ派の教えを奉じつつも故郷の風俗を保ち、郷土の絆によって信徒を結束させている。"
 maturidi:0 "マートゥリーディー派"
 maturidi_adj:0 "マートゥリーディー派"
 maturidi_adherent:0 "マートゥリーディー派信徒"
 maturidi_adherent_plural:0 "マートゥリーディー派信徒"
 maturidi_desc:0 "この派はスンナ派の正統を厳守し、教法を根本としつつ、信徒が各地の風俗に応じて柔軟に振る舞うことを認めている。"
 mutazila:0 "ムウタズィラ派"
 mutazila_adj:0 "ムウタズィラ派"
 mutazila_adherent:0 "ムウタズィラ派信徒"
 mutazila_adherent_plural:0 "ムウタズィラ派信徒"
 mutazila_desc:0 "この派はスンナ派の教えを奉じ、理による弁証で経義を明らかにすることを尊び、学理の論争と教法の研究を重んじる。"
