 guiwu:1 "巴人巫教"
 guiwu_adj:0 "巴人巫教"
 guiwu_adherent:1 "巴人巫教信徒"
 guiwu_adherent_plural:1 "巴人巫教信徒"
 guiwu_desc:0 "巴人は鬼を畏れて巫を尚ぶ。伝えによれば、幽都には土伯が門を守っており、虎の首に牛の体、三つの目と鋭い角を持ち、手に九約を執って亡魂を追うという。巴・蜀の諸部はこれを鬼帝として共に奉じている。祭日ごとに巫者は太鼓を打ち足を踏み鳴らして歌い、日を迎え災いを祓う。"

