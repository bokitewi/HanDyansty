 nanfangzongjiao_religion_desc:0 "南方の諸蛮と百越は、古来鬼神を敬い巫祝を重んじてきた。山川草木にはそれぞれ霊が宿り、祖先の亡魂は子孫を守護する。越人・楚人・巴人はそれぞれの風俗に従ってこれを祀る。"

