 chuwu:1 "楚巫"
 chuwu_adj:0 "楚巫"
 chuwu_adherent:1 "信徒"
 chuwu_adherent_plural:1 "信徒"
 chuwu_desc:0 "楚の風俗は巫鬼を信じ、淫祀を重んじる。上は東皇太一・東君・雲中君から、下は山川や人鬼に至るまで、すべてに祭祀がある。巫覡は盛装して歌舞し神を楽しませ、天地に通じ、鬼神と交わり、死生を託すことができると称する。"

