 baiyuefanlin_adherent:1 "越巫信徒"
 baiyuefanlin_adherent_plural:1 "越巫信徒"
 baiyuefanlin_desc:0 "越人は鬼を信じて祠を好み、山川草木と江海の万霊を畏敬する。巫者は祭歌や鶏卜によって神に通じて吉凶を問い、一族は勇毅な祖先が死後もなお存在し、子孫と郷土を守護していると信じている。"

