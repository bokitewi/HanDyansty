l_japanese:
 wudoumidao:0 "五斗米道"
 wudoumidao_adj:0 "五斗米道"
 wudoumidao_adherent:0 "五斗米道信徒"
 wudoumidao_adherent_plural:0 "五斗米道信徒"
 wudoumidao_desc:0 "五斗米道は老子を宗とし、符水で病を治し、病者を静室に籠らせて過ちを省みさせ、その罪状を天・地・水の三官に書き記す。入信者は米五斗を納め、各治では祭酒が道衆を統率する。また道端に義舎を設けて米や肉を掛け、旅人を救済する。"
 wudoumidao_religious_head_title:0 "天師"
 wudoumidao_religious_head_title_name:0 "五斗米道廷"

 fusang_pagan:0 "扶桑原始信仰"
 fusang_pagan_adj:0 "扶桑原始信仰"
 fusang_pagan_adherent:0 "扶桑原始信仰信徒"
 fusang_pagan_adherent_plural:0 "扶桑原始信仰信徒"
 fusang_pagan_desc:0 "倭人は鬼道に仕え、山海や林石の間にはすべて神霊が宿り、氏族の祖霊もまた子孫を守護すると考えている。その風俗は清浄を重んじ、事を起こし出行する際には骨を灼いて占う。祭りには供物を捧げて集い飲み、歌舞して神を楽しませる。"
 fusang_pagan_old:0 "旧扶桑原始信仰"
 fusang_pagan_old_adj:0 "旧扶桑原始信仰"
 fusang_pagan_old_adherent:0 "旧扶桑原始信仰信徒"
 fusang_pagan_old_adherent_plural:0 "旧扶桑原始信仰信徒"

 yemaek_shamanism:0 "穢貊系原始シャーマニズム"
 yemaek_shamanism_adj:0 "穢貊系原始シャーマニズム"
 yemaek_shamanism_adherent:0 "穢貊シャーマニズム信徒"
 yemaek_shamanism_adherent_plural:0 "穢貊シャーマニズム信徒"
 yemaek_shamanism_desc:0 "穢貊・扶余・高句麗の諸部は天を敬い、山を祀り、祖霊を尊ぶ。毎年大会を開いて天を祭り、扶余ではこれを迎鼓、高句麗では東盟、濊人では舞天と呼び、国を挙げて連日酒を飲み歌舞する。巫者は神を降ろして憑依させ、一族のために祟りを祓い病を癒す。"
 yemaek_shamanism_old:0 "旧穢貊系原始シャーマニズム"
 yemaek_shamanism_old_adj:0 "旧穢貊系原始シャーマニズム"
 yemaek_shamanism_old_adherent:0 "旧穢貊シャーマニズム信徒"
 yemaek_shamanism_old_adherent_plural:0 "旧穢貊シャーマニズム信徒"

 samhan_shamanism:0 "三韓シャーマニズム"
 samhan_shamanism_adj:0 "三韓シャーマニズム"
 samhan_shamanism_adherent:0 "三韓シャーマニズム信徒"
 samhan_shamanism_adherent_plural:0 "三韓シャーマニズム信徒"
 samhan_shamanism_desc:0 "三韓の風俗は鬼神を信じ、国邑ごとに一人を立てて天神の祭祀を主らせ、これを天君と号する。また別邑を設けて蘇塗と名づけ、大木を立てて鈴と太鼓を懸け、鬼神に仕える。毎年五月の種まきと十月の農事の終わりには、人々が群れ集って歌舞し酒を飲み、山川の鬼神を祭る。"
 samhan_shamanism_old:0 "旧三韓シャーマニズム"
 samhan_shamanism_old_adj:0 "旧三韓シャーマニズム"
 samhan_shamanism_old_adherent:0 "旧三韓シャーマニズム信徒"
 samhan_shamanism_old_adherent_plural:0 "旧三韓シャーマニズム信徒"

 xianbei_polytheism:0 "鮮卑多神教"
 xianbei_polytheism_adj:0 "鮮卑多神教"
 xianbei_polytheism_adherent:0 "鮮卑多神教信徒"
 xianbei_polytheism_adherent_plural:0 "鮮卑多神教信徒"
 xianbei_polytheism_desc:0 "鮮卑の諸部は鬼神を敬い、天地日月・星辰山川を祠り、あわせて勇健で名を知られた先代の大人を祀る。その風俗は壮者を貴び老人を賤しみ、戦死を栄誉とし、死者の魂魄は赤山に帰り、その英名は部衆の祭歌の中に長く残ると信じている。"
 xianbei_polytheism_old:0 "旧鮮卑多神教"
 xianbei_polytheism_old_adj:0 "旧鮮卑多神教"
 xianbei_polytheism_old_adherent:0 "旧鮮卑多神教信徒"
 xianbei_polytheism_old_adherent_plural:0 "旧鮮卑多神教信徒"

 wugui:0 "巫鬼信仰"
 wugui_adj:0 "巫鬼信仰"
 wugui_adherent:0 "巫鬼信徒"
 wugui_adherent_plural:0 "巫鬼信徒"
 wugui_desc:0 "南中の諸夷は風俗として巫鬼を信じ、詛盟を好み、石を投げ草を結んで約束の証とする。巫者は霊を憑依させて祟りを祓い、吉凶を占い、山谷の幽魂を鎮める。大祭のたびに牲を殺して集い飲み、日を拝して神を迎える。"
 wugui_old:0 "旧巫鬼信仰"
 wugui_old_adj:0 "旧巫鬼信仰"
 wugui_old_adherent:0 "旧巫鬼信徒"
 wugui_old_adherent_plural:0 "旧巫鬼信徒"

