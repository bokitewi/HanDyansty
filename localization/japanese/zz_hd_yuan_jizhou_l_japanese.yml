l_japanese:
 hd_yuan_jizhou.0001.t:0 "兵を借りて冀州を図る"
 hd_yuan_jizhou.0001.desc:0 "董卓討伐の諸軍は散じたが、渤海の糧道はなお韓馥の顔色をうかがわねばならない。糧食の催促の報告を聞き終えると、あなたは話を変えて冀州北方の動静を尋ねた。\n\n韓馥は豊かな州郡を擁しており、外患がなければ、あなたの「助力」の言葉を真剣に聞こうとはしないだろう。公孫瓚の兵馬はちょうど北方にいる。彼を南下に誘えば、韓馥に自らの立場を改めて量らせることもでき、あなたもいつまでも渤海に籠もって他人の施しを待つ必要がなくなる。\n\n北への書状はすでに送った。紙の上に書いたのはともに進取を図ることだが、実際に石を打った後は、韓馥がどう援けを求め、公孫瓚がどう兵を用いるかにかかっている。あなたは返書の場所を机の上に空けておき、両方からの知らせが相次いで届くのを待つ。"
 hd_yuan_jizhou.0001.a:0 "ひとまず伯珪の兵勢を見て、冀州の返事を静かに待つ。"
 hd_yuan_jizhou.0002.t:0 "冀州の主替わる"
 hd_yuan_jizhou.0002.desc:0 "韓馥の州印がついにあなたの前に置かれた。受け取ってみると、手には思ったほどの重みはなく、かえって一緒に引き渡された帳簿が次から次へと机の上を埋め尽くした。\n\n彼の州郡と部衆は今やあなたの節制下にあり、本人もすでに府に入って身を置いている。北方の旧来の戦いもそれとともに止んだが、公孫瓚が待ち望んでいた利益は、先の思惑どおりに彼の手に落ちることはなかった。左右がこのことに触れても、あなたはまず冀州の引き継ぎをきちんと済ませるよう命じるだけであった。\n\n糧道はもはや他人の顔色をうかがう必要がなく、袁氏はついに一州の根本を握った。伯珪がどう思おうと、それは後日の書状が教えてくれるだろう。今日のこの州印は、まずあなたが収めておく。"
 hd_yuan_jizhou.0002.a:0 "州印を懐に収め、冀州を取り仕切る。"
 hd_yuan_jizhou_cb:0 "冀州を争う"
 HD_YUAN_JIZHOU_WAR_NAME:0 "[ATTACKER.GetShortUIName]の冀州争奪戦"
 hd_yuan_jizhou_victory_desc:0 "公孫瓚は冀州域内で韓馥が拠る地を奪取し、当地の封臣はそれに従って鞍替えする。"
 hd_yuan_jizhou_no_conquest_desc:0 "両家は兵を収め、冀州の争いはここに取りやめとなる。"
 hd_yuan_jizhou_handover_peace_desc:0 "冀州の形勢が変わり、この戦いは名目を失ったため、ここに取りやめとなる。"
 hd_yuan_life_jizhou:0 "冀州に入主す"
