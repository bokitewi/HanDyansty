l_japanese:
 hd_dc_par.0001.t: "一つの救済、二通の上奏文"
 hd_dc_par.0001.desc: "二通の上奏文は同じ被災地のことを述べているが、主張はまるで正反対だ。一方は減税を求め、まずは民に目下の苦境を乗り切らせようとする。もう一方は国庫と軍費の支出を列挙し、今こそ現行の税制を守るべきだと考えている。\n\n二人の領袖はそれぞれ自説を譲らず、あなたの裁断を待っている。詔令は結局のところ地方の守令の手に委ねられるのであって、朝堂で名声を争うだけではすまない。"
 hd_dc_par.0001.a: "双方にそれぞれ収支の数字を出させ、帳簿を調べさせる。"
 hd_dc_par.0001.a.tt: "現地の守令が帳簿の作成を引き受けてくれれば、それを二人の領袖にそれぞれ検査させる："
 hd_dc_par.0001.b: "まず減税を認め、それを主張した者に陣頭指揮を執らせる。"
 hd_dc_par.0001.b.tt: "減税を主張する領袖が命を受け、現地の守令も実施を引き受ければ、減税を1年間試行できる："
 hd_dc_par.0001.c: "旧制を守る。二卿はそれぞれ控えるべし。"
 hd_dc_par.0001.d: "近隣の二郡を選び、並行して試して検証する。"
 hd_dc_par.0001.d.tt: "二郡の守令がともに引き受けてくれれば――一郡は減税し、一郡は従来通りとする――1年後に二人の領袖がともに検分する："
 hd_dc_par.invalid: "時勢は移り、古い文書はもはや通用しない。"
 hd_dc_par.1301.t: "地方に下った詔令"
 hd_dc_par.1301.audit: "朝廷は[hd_dc_audit_county.GetName]の銭穀の出入とその受益者を調べ上げるべく、あなたに帳簿の取りまとめを命じてきた。引き受ければ朝廷から三十金が下され、帳簿は現地の実情とともに両派の領袖へ回され、検分を受けることになる。\n\n三か月以内に明確な返答をせねばならない。文書だけ受け取っておいて、事が済んだと朝廷に思わせるわけにはいかないのだ。"
 hd_dc_par.1301.relief: "[hd_dc_audit_county.GetName]が減税試行の側に選ばれた。朝廷は五十金を下し、ここで一年間減税を行い、被災の程度が近い別の郡と比較させるつもりである。\n\n両地がともに承諾して、はじめて金が下される。報告書にはあなたの名が記されることになる――試行の途中で統治権を失ったり、減税を取りやめたりすれば、有終の美を飾ったとは言えない。"
 hd_dc_par.1301.reserve: "[hd_dc_audit_county.GetName]が従来どおり徴税する側に選ばれた。朝廷は五十金を下し、一年間現行の税制を維持して現地の統治と民生を記録し、減税を行う別の郡とあわせて検分させるつもりである。\n\nあなたの属する派が常に正しいと証明する必要はない。だが、自ら手がけた事には責任を負わねばならない。"
 hd_dc_par.1301.a: "この任、謹んでお引き受けいたそう。"
 hd_dc_par.1301.a.tt: "各方面の承諾が揃えば、朝廷の交付金が届けられる："
 hd_dc_par.1301.b: "この任、お引き受けいたしかねる。"
 hd_dc_par.1302.t: "検算と署名"
 hd_dc_par.1302.first: "案件記録の一つ目は[hd_dc_instance.Var('hd_dc_audit_first_county').Title.GetName]で、[hd_dc_instance.Var('hd_dc_audit_first_executor').Char.GetTitledFirstName]が担当した。帳簿によれば、支出は[hd_dc_instance.Var('hd_dc_audit_first_payment').Var('hd_dc_actual_debit').GetValue|0]金、着金は[hd_dc_instance.Var('hd_dc_audit_first_payment').Var('hd_dc_actual_credit').GetValue|0]金とある。\n\nこれらの帳目はあなた自身が検算せねばならない。もう一人の領袖も別個に回答し、誰も他人に代わって署名することはできない。"
 hd_dc_par.1302.second: "\n\nもう一つは[hd_dc_instance.Var('hd_dc_audit_second_county').Title.GetName]で、[hd_dc_instance.Var('hd_dc_audit_second_executor').Char.GetTitledFirstName]が担当した。帳簿によれば、支出は[hd_dc_instance.Var('hd_dc_audit_second_payment').Var('hd_dc_actual_debit').GetValue|0]金、着金は[hd_dc_instance.Var('hd_dc_audit_second_payment').Var('hd_dc_actual_credit').GetValue|0]金とある。\n\n両地とも一年の試行期間を満了した。一つ目の地は、統制度が[hd_dc_instance.Var('hd_dc_audit_first_start_control').GetValue|0]から[hd_dc_instance.Var('hd_dc_audit_first_end_control').GetValue|0]へ、開発度が[hd_dc_instance.Var('hd_dc_audit_first_start_development').GetValue|0]から[hd_dc_instance.Var('hd_dc_audit_first_end_development').GetValue|0]へ。二つ目の地は、統制度が[hd_dc_instance.Var('hd_dc_audit_second_start_control').GetValue|0]から[hd_dc_instance.Var('hd_dc_audit_second_end_control').GetValue|0]へ、開発度が[hd_dc_instance.Var('hd_dc_audit_second_start_development').GetValue|0]から[hd_dc_instance.Var('hd_dc_audit_second_end_development').GetValue|0]へと変わった。これらの変化がすべて試行の成果とは限らず、これをもってどちらかの派の勝利を誇るのは妥当ではない。"
 hd_dc_par.1302.a: "一つ一つ検め終えた。署名いたそう。"
 hd_dc_par.1302.b: "この検収には、署名いたさぬ。"
 hd_dc_par.1303.t: "案件を閉じるとき"
 hd_dc_par.1303.verified: "金銭の証憑と、両領袖それぞれの署名が揃った。担当者はこの案件を一巻にまとめ、追加の交付も試行の継続も行わない。\n\n案件記録はこれをもって天下が定まったと宣言するものではなく、まして未決の戦や約束の結末を書き記すものでもない。"
 hd_dc_par.1303.partial: "二か所の試行は、ともに満期まで漕ぎつけることができなかった。下された金、施行された政令、途中で途絶えた理由は、それぞれ案件記録に記されている。まだ届いていない金も、帳簿に残されたままだ。\n\n一か所が成ったからといって、二か所とも成ったことにはならない。"
 hd_dc_par.1303.failed: "この任は、必要な承諾・執行・検分を揃えることができなかった。担当者は中止の理由を書き留め、すでに出入りした金銭はそのまま帳簿に残した。欠けた証憑は、一枚の結語で補えるものではない。"
 hd_dc_par.1303.a: "記録として保管する。"
