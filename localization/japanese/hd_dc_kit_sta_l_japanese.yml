 # 策反：阴谋
 hd_dc_sta_incite_independence: "独立を唆す"
 hd_dc_sta_incite_independence_action: "独立を唆す："
 hd_dc_sta_incite_independence_desc: "私は[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip]を説き伏せ、兵を起こして独立させるつもりだ。"
 hd_dc_sta_incite_independence_desc_general: "$hd_dc_sta_incite_independence$は秘密裏の敵対的[scheme|E]である。敵国の[vassal|E]を説き伏せ、その主君に対して独立戦争を起こさせる。\nこの工作は主にあなたの[diplomacy|E]に依存する。\n\n[success_chance|E]は主にあなたの[diplomacy|E]と、相手のその主君に対する[opinion|E]によって決まる。相手の[spymaster|E]に察知されれば、あなたはその主君と険悪な仲になり、背盟毀約の汚名を着ることになる。"
 HD_DC_STA_INCITE_INDEPENDENCE_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U]がその主君に対して独立戦争を起こす"
 hd_dc_sta_incite_defection: "寝返りを唆す"
 hd_dc_sta_incite_defection_action: "寝返りを唆す："
 hd_dc_sta_incite_defection_desc: "私は[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip]を説き伏せ、領地ごと身を寄せさせるつもりだ。"
 hd_dc_sta_incite_defection_desc_general: "$hd_dc_sta_incite_defection$は秘密裏の敵対的[scheme|E]である。敵国の[vassal|E]を説き伏せ、領地ごと鞍替えしてあなたのもとに身を寄せさせる。\nこの工作は主にあなたの[diplomacy|E]に依存する。\n\n[success_chance|E]は主にあなたの[diplomacy|E]、相手のその主君に対する[opinion|E]、そしてあなたとその主君の力関係によって決まる。相手の[spymaster|E]に察知されれば、あなたはその主君と険悪な仲になり、背盟毀約の汚名を着ることになる。"
 HD_DC_STA_INCITE_DEFECTION_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U]が領地ごとあなたの[vassal|E]となる"
 hd_dc_sta_incite_faction: "謀反を煽る"
 hd_dc_sta_incite_faction_action: "謀反を煽る："
 hd_dc_sta_incite_faction_desc: "私は[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip]を煽り、その主君と敵対させるつもりだ。"
 hd_dc_sta_incite_faction_desc_general: "$hd_dc_sta_incite_faction$は秘密裏の敵対的[scheme|E]である。敵国の[vassal|E]を煽ってその主君に反対する[faction|E]に加入または結成させ、派閥の不満をさらに募らせ、兵馬をさらに増やさせる。\nこの工作は主にあなたの[diplomacy|E]に依存する。\n\n相手の[spymaster|E]に察知されれば、あなたはその主君と険悪な仲になり、背盟毀約の汚名を着ることになる。"
 HD_DC_STA_INCITE_FACTION_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U]がその主君に反対する[faction|E]に加入または結成する"
 HD_DC_STA_SUBVERSION_DISCOVERY_DESC: "あなたは敵国の主と険悪な仲になり、背盟毀約の汚名を着る"
