 # 策反：事件
 hd_dc_sta.0101.t: "反旗翻る"
 hd_dc_sta.0101.desc: "使者の報告によれば、[target.GetShortUIName]はついに決心を固め、兵を挙げて[target.GetHerHis]主君に反旗を翻し、自立したという。敵国はこれより心腹の患いを一つ抱えることになる。"
 hd_dc_sta.0101.a: "しばし彼らが互いに争うのを座して見ていよう。"
 hd_dc_sta.0102.t: "領地を携えての帰順"
 hd_dc_sta.0102.desc: "[target.GetShortUIName]は約束どおりにやって来て、その封土を携えて鞍替えし、あなたを主と仰いだ。敵国は片腕を失い、あなたは片腕を得た。"
 hd_dc_sta.0102.a: "良禽は木を択んで棲む。"
 hd_dc_sta.0103.t: "禍は蕭牆に起こる"
 hd_dc_sta.0103.desc: "[target.GetShortUIName]はすでに説き伏せられ、[target.GetHerHis]主君との溝は日に日に深まっている。今は同志と連絡を取り合い、武器を磨き馬を養っている。"
 hd_dc_sta.0103.a: "火はすでに点いた。静かに変事を待とう。"
 hd_dc_sta.subversion_target_gone.desc: "使者の報告によれば、時は移り事情は変わり、[target.GetShortUIName]の境遇はもはや当初とは異なるため、このたびの寝返り工作は話にならないという。"
 hd_dc_sta.0109.t: "説得失敗"
 hd_dc_sta.0109.desc: "[target.GetShortUIName]はあなたの使者に表向き調子を合わせたが、結局[target.GetHerHis]主君を裏切ろうとはしなかった。幸い、この件はまだ表沙汰になっていない。"
 hd_dc_sta.0109.desc_reported: "[target.GetShortUIName]はあなたの使者を拒んだばかりか、事の次第を一部始終[target.GetHerHis]主君に告げた。今や両国の間には、もはや信義など望むべくもないだろう。"
 hd_dc_sta.0109.a: "惜しいことだ。"
