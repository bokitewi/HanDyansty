l_japanese:
 hd_popclean_decision:0 "余剰人口を整理する"
 hd_popclean_decision_desc:0 "天下の宮廷と道々には名もなき者たちがあふれている。王朝も封地も持たない廷臣や放浪者を一括で整理し、ゲームの負荷を軽減する。"
 hd_popclean_decision_tooltip:0 "王朝も封地も持たない廷臣と放浪者 7000 名を整理する。"
 hd_popclean_decision_confirm:0 "整理"
 hd_popclean_decision_effect_tt:0 "今後三か月のうちに、王朝も封地も持たない廷臣と放浪者 7000 名を静かに消去する。覇権外の伯爵・男爵の宮廷、ならびに部族・封建・遊牧・牧畜民の宮廷を優先して整理する。覇権内の公爵以上の宮廷は影響を受けない。統治者の配偶者・側室・子女、現職の評議員・官員・騎士・軍官、歴史上の人物、および才能に優れる者や優れた先天的特性を持つ者は、すべて保持される。"
 hd_popclean_message_title:0 "余剰人口の整理を予定した"
 hd_popclean_message_desc:0 "今後三か月のうちに [GetGlobalVariable('hd_popclean_scheduled').GetValue|0] 人が静かに消去される。"
