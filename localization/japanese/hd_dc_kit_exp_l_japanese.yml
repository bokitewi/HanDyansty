l_japanese:
 # 天朝循环·时代特色：扩张期套件（开边 CB / 册封朝贡 / 屯田 / 军功）

 # ---------- 开边 CB ----------
 hd_dc_exp_frontier_cb: "開辺"
 hd_dc_exp_frontier_cb_name: "開辺"
 hd_dc_exp_frontier_cb_war_name: "[ATTACKER.GetShortUINamePossessive]の開辺の戦い"
 hd_dc_exp_frontier_cb_victory_desc_attacker: "あなたは[defender.GetShortUINamePossessive]の郡のうちあなたの領域と接するすべての郡で、[defender.GetHerHim]に属するすべての県を奪取し、[defender.GetHerHim]と10年間停戦する。"
 hd_dc_exp_frontier_cb_victory_desc: "[attacker.GetShortUIName|U]は[defender.GetShortUINamePossessive]の郡のうち天朝の領域と接するすべての郡で、[defender.GetHerHim]に属するすべての県を奪取し、双方は10年間停戦する。"
 hd_dc_exp_frontier_cb_white_peace_desc: "両国は兵を引き、それぞれの国境を守る。"
 hd_dc_exp_frontier_cb_defeat_desc: "王師は敗れ、[attacker.GetShortUIName|U]は[defender.GetShortUIName]に賠償金を支払わねばならない。"

 # ---------- 册封朝贡 ----------
 hd_dc_exp_investiture_interaction: "冊封と朝貢"
 hd_dc_exp_investiture_interaction_desc: "使者に厚い礼物を持たせて[recipient.GetShortUINameNoTooltip]を冊封し、天朝の正朔を奉じさせて、あなたの[tributary|E]とする。"
 hd_dc_exp_investiture_interaction_notification: "天朝の使節が詔書と下賜品を携えて訪れ、[recipient.GetShortUIName]を藩属として冊封しようとしている。"
 hd_dc_exp_investiture_cooldown_tt: "[recipient.GetShortUINameNoTooltip|U]は近年天朝の冊封を拒んだため、数年間は再び受け入れない"
 hd_dc_exp_investiture_reason_gift: "天朝の下賜品：$VALUE|=+0$"
 hd_dc_exp_investiture_reason_weak: "実力が天子の半分に満たない：$VALUE|=+0$"
 hd_dc_exp_investiture_reason_strong: "実力が天子より強い：$VALUE|=+0$"
 hd_dc_exp_investiture_reason_king: "君王である：$VALUE|=+0$"
 hd_dc_exp_investiture_reason_emperor: "皇帝である：$VALUE|=+0$"
 hd_dc_exp_investiture_reason_rival: "天子と宿敵である：$VALUE|=+0$"
 hd_dc_exp_investiture_reason_nemesis: "天子と不倶戴天の敵である：$VALUE|=+0$"
 hd_dc_exp_investiture_reason_proud: "傲慢または野心家：$VALUE|=+0$"
 hd_dc_exp_investiture_accepted_opinion: "天朝の冊封を受けた"
 hd_dc_exp_investiture_declined_opinion: "天朝の冊封を拒んだ"

 # ---------- 屯田 ----------
 hd_dc_exp_tuntian_decision: "屯田"
 hd_dc_exp_tuntian_decision_desc: "辺地には荒田が連なり、戍卒が往復して物資を輸送するため、費用は計り知れない。兵や民を募ってその場で開墾させ屯田とし、耕しつつ守らせれば、糧食は輸送を待たずとも足りる。"
 hd_dc_exp_tuntian_decision_tooltip: "辺境の州で屯田を興す"
 hd_dc_exp_tuntian_decision_confirm: "屯田を興す"
 hd_dc_exp_tuntian_border_tt: "領域内に外部と接する辺境の県が少なくとも1つある"
 hd_dc_exp_tuntian_decision_effect_tt: "辺境の州を一つ選んで屯田を興し、州内のあなたの領域に属する諸県で兵と民が耕しつつ守る。"
 hd_dc_exp_tuntian_apply_tt: "その州内のあなたの領域に属する各[county|E]"
 hd_dc_exp_tuntian_modifier: "屯田"
 hd_dc_exp_tuntian_modifier_desc: "辺地の兵と民は耕しつつ守り、糧秣は十分で、兵源も豊富である。"

 # ---------- 军功 ----------
 hd_dc_exp_military_merit_decision: "軍功授爵"
 hd_dc_exp_military_merit_decision_desc: "王師は新たに外寇を破った。功を論じて賞を行うべきである。この戦いで兵を率いた将の中から一人を選び、官を加え爵を進める。"
 hd_dc_exp_military_merit_decision_tooltip: "功を立てた将一人に爵位を授ける"
 hd_dc_exp_military_merit_decision_confirm: "功を論じて賞を行う"
 hd_dc_exp_merit_window_tt: "1年以内に天下の外の勢力に勝利している"
 hd_dc_exp_merit_candidate_tt: "その戦いで兵を率いた将のうち、なおあなたの領域内にいる者が少なくとも1人いる"
 hd_dc_exp_merit_decision_effect_tt: "この戦いで兵を率いた諸将の中から一人を選んで官を加え爵を進める。君臣の恩義はこれよりいっそう深まる。"
 hd_dc_exp_merit_open_peerage_tt: "この人物はまだ爵位を持たないが封授に値する。あなた自らその封邑を選ぶことができる。"
 hd_dc_exp_merit_window_toast: "王師の凱旋"
 hd_dc_exp_merit_window_toast_desc: "凱旋の機に乗じて、功ある諸将に論功行賞を行える。遅れれば恩賞は時機を逸する。"
 hd_dc_exp_military_merit_modifier: "軍功"
 hd_dc_exp_military_merit_modifier_desc: "この人物は戦功により天子の封賞を受け、その名は一時に轟いた。"
 hd_dc_exp_military_merit_opinion: "軍功授爵"

 # ---------- 事件 ----------
 hd_dc_exp.0100.t: "屯田を興す"
 hd_dc_exp.0100.desc: "大司農と将作大匠の上奏文が机に山と積まれている。辺地には荒田が連なり、戍卒が往復して物資を輸送するため、費用は計り知れない。兵や民を募ってその場で開墾させ、耕しつつ守らせれば、糧食は輸送を待たずとも足りる、と。\n\n辺境の諸州のうち、まずどこに屯田を興すべきか？"
 hd_dc_exp.0100.a: "[hd_dc_exp_slot_1.GetName]に屯田する"
 hd_dc_exp.0100.b: "[hd_dc_exp_slot_2.GetName]に屯田する"
 hd_dc_exp.0100.c: "[hd_dc_exp_slot_3.GetName]に屯田する"
 hd_dc_exp.0100.d: "[hd_dc_exp_slot_4.GetName]に屯田する"
 hd_dc_exp.0100.e: "辺地にはもはや屯田できる所がない。銭糧を国庫に戻す"
 hd_dc_exp.0200.t: "功を論じて賞を行う"
 hd_dc_exp.0200.desc: "王師は凱旋し、諸将が階下に並んでいる。この戦役で将を斬り旗を奪った者は数多いが、爵賞は人を得ることが肝要である――天子は自らその中で最も功の著しい者を選び、殊栄を加えるべきである。"
 hd_dc_exp.0200.a: "[hd_dc_exp_merit_1.GetShortUIName]を封賞する"
 hd_dc_exp.0200.b: "[hd_dc_exp_merit_2.GetShortUIName]を封賞する"
 hd_dc_exp.0200.c: "[hd_dc_exp_merit_3.GetShortUIName]を封賞する"
 hd_dc_exp.0200.d: "[hd_dc_exp_merit_4.GetShortUIName]を封賞する"
 hd_dc_exp.0200.e: "諸将は没したか去ったかで、賞すべき者がいない"
