l_japanese:
 # 衣冠南渡·士族侧（决议、互动、事件 4001–4023、修正、好感、提示）

 # ---------- 决议 ----------
 hd_yiguan_qizu_nanqian_decision:0 "举族南迁"
 hd_yiguan_qizu_nanqian_decision_desc:0 "胡骑踏破中原，衣冠之家或死或徙。与其在胡主治下仰人鼻息，不如弃田宅、携宗族，投奔南方王朝或北方尚存的汉家政权，保全祖宗的郡望。"
 hd_yiguan_qizu_nanqian_decision_tooltip:0 "弃地南迁，投奔一位汉人君主"
 hd_yiguan_qizu_nanqian_decision_confirm:0 "举族南迁"
 hd_yiguan_qizu_nanqian_decision_effect_tt:0 "向所选的君主请求收纳。对方接纳后：\n- 全部封地交还胡人宗主（直属主君是胡人即交给他，否则交给最高宗主），封臣也一并归他；\n- 配偶、子女与未婚兄弟姐妹随你同行；\n- 去处行天朝制时，你以无地世族封臣身份保留世族头衔（玩家没有世族头衔时新建一个）；否则销毁世族头衔，成为其廷臣；\n- 本家记为侨姓，故土记为籍贯；收地的胡人宗主与最高宗主对你好感 −30。\n对方拒绝则退还威望，两年内不能再举族南迁。"

 hd_yiguan_qibing_beihuan_decision:0 "起兵北还"
 hd_yiguan_qibing_beihuan_decision_desc:0 "南渡多年，故土的消息却从未断过。中原胡汉相攻，正是用兵之时。召集族中子弟与门下宾客，渡江北上，打回故里去！"
 hd_yiguan_qibing_beihuan_decision_tooltip:0 "变为冒险者，率北府兵打回故土"
 hd_yiguan_qibing_beihuan_decision_confirm:0 "击楫中流"
 hd_yiguan_qibing_beihuan_decision_effect_tt:0 "选定北方一州为目标后：\n- 你变为无地冒险者（持世族头衔者先销毁世族头衔、退还庄园建筑），获得该州的弱宣称；\n- 北府兵 = 1 + 本家庄园建筑数 ÷ 3 队（上限 4），每位“兵马”资助者另加 1 队；\n- 事件征召兵 = 500 + 威望等级 × 300 + 影响力 ÷ 2（无影响力改用金币 ÷ 2；上限 3000），每位“兵马”资助者另加 500；\n- 同伴 1 + 威望等级 ÷ 2 名（上限 3），优先本家族人与门下，各领 300–800 兵一同参战；\n- 对该州持县最多的胡人政权宣战。\n每人一生只能起兵一次；打回宣称地后独立，若有资助者，还须决定是否归附资助最多者。"

 # ---------- 条件提示 ----------
 hd_yiguan_gt_nanqian_dest_celestial_tt:0 "玩家只能投奔行天朝制的君主（以无地世族身份继续游戏）"
 hd_yiguan_gt_nanqian_dest_tier_tt:0 "你的世族为公国级，只能投奔持有王国级以上头衔的君主"
 hd_yiguan_gt_no_office_tt:0 "不能身居官职（须先辞去尚书、九卿等官职头衔）"
 hd_yiguan_gt_nanqian_tier_tt:0 "持有王国级以上实地头衔者不能举族南迁"
 hd_yiguan_gt_nanqian_pending_tt:0 "已向他人请求收纳，正在等候答复"
 hd_yiguan_gt_nanqian_refused_tt:0 "近两年内南迁请求曾遭拒绝"
 hd_yiguan_gt_nanqian_no_dest_tt:0 "眼下没有可投奔的南方政权或北方汉人政权"
 hd_yiguan_gt_nanqian_player_nf_tt:0 "当前规则不允许新建世族，没有世族头衔的玩家无法南迁"
 hd_yiguan_gt_beihuan_phase_tt:0 "须在衣冠南渡的冲突期"
 hd_yiguan_gt_beihuan_target_tt:0 "北方八州中须有胡人政权持县，且该政权眼下没有在应付义军、起义或北还"
 hd_yiguan_gt_beihuan_cap_tt:0 "今年天下已有三起北还，须待来年"
 hd_yiguan_gt_beihuan_pending_tt:0 "北还的威望已付，正等你择定州郡"
 hd_yiguan_gt_already_funded_tt:0 "已资助过此人"
 hd_yiguan_gt_qiaozhi_nothing_tt:0 "君主既没有可授的非都城直辖县，也没有可立的侨州"
 hd_yiguan_gt_qiaowu_no_pair_tt:0 "两家须各有一名未婚、成年、可以成婚的族人，且一男一女"
 hd_yiguan_gt_qiaowu_fail_toast:0 "侨吴联姻未成"
 hd_yiguan_gt_qiaowu_fail_toast_tt:0 "两家虽各有未婚族人，但或是血亲相近，或是信仰、婚约所限，配不成一对。"

 # ---------- 互动 ----------
 hd_yiguan_request_funding_interaction:0 "请资北还"
 hd_yiguan_request_funding_interaction_desc:0 "请对方资助你起兵北还：可求钱财、兵马，或两者兼有。"
 hd_yiguan_offer_funding_interaction:0 "资助北还"
 hd_yiguan_offer_funding_interaction_desc:0 "资助这位流亡士族北还：钱财当即交付，兵马在其起兵时兑现。"
 hd_yiguan_request_qiaozhi_interaction:0 "请求侨置授地"
 hd_yiguan_request_qiaozhi_interaction_desc:0 "请主君授你一县，或为你侨立一州，让流寓的乡党有所归属。"
 hd_yiguan_grant_qiaozhi_interaction:0 "授以侨置"
 hd_yiguan_grant_qiaozhi_interaction_desc:0 "授这位侨姓士人一县，或为其侨立一州。"
 hd_yiguan_qiaowu_marriage_interaction:0 "联姻吴姓"
 hd_yiguan_qiaowu_marriage_interaction_desc:0 "两家各出一名未婚族人成婚，结侨吴之好。"
 hd_yiguan_request_office_interaction:0 "求取官职"
 hd_yiguan_request_office_interaction_desc:0 "请对方授你议会中的职位；若无空缺，则入其宫廷待用。"

 hd_yiguan_gt_tier_gold:0 "钱财（中额，国库或私囊）"
 hd_yiguan_gt_tier_troops:0 "兵马（北府兵 1 队 + 征召兵 500）"
 hd_yiguan_gt_tier_both:0 "兵钱兼有"
 hd_yiguan_gt_qz_county:0 "授一县"
 hd_yiguan_gt_qz_qiao:0 "侨立一州"

 hd_yiguan_gt_fund_accept_tt:0 "资助者（有国库者从国库支付，否则付金币）：\n- 钱财：付给流亡者中额钱财，威望 +50；\n- 兵马：付出中额钱财作募兵之费，威望 +100，流亡者起兵时另得北府兵 1 队与征召兵 500；\n- 兵钱兼有：两项都付，威望 +150。\n流亡者对资助者好感 +30。"
 hd_yiguan_gt_qiaozhi_accept_tt:0 "授出一处非都城直辖县（发展度低、不在都城所在郡者优先），或立一个侨州（受者无地时连县一并授出）；受者成为封臣，对君主好感 +20。"
 hd_yiguan_gt_qiaowu_accept_tt:0 "两家各出一名未婚成年族人成婚；两家家主互加好感 +20；二十年内两家不卷入侨吴之争。"
 hd_yiguan_gt_office_accept_tt:0 "按其所长补议会空缺；无空缺或任命不成，则入宫廷并得“北人清望”十年。求官者对君主好感 +15，本地吴姓封臣对君主好感 −5。"

 hd_yiguan_gt_ai_reason_conflict:0 "胡汉正相攻"
 hd_yiguan_gt_ai_reason_own_court:0 "本是我门下之人"
 hd_yiguan_gt_ai_reason_martial:0 "通晓兵事"
 hd_yiguan_gt_ai_reason_generous:0 "慷慨"
 hd_yiguan_gt_ai_reason_greedy:0 "贪婪"
 hd_yiguan_gt_ai_reason_big_ask:0 "所求太多"
 hd_yiguan_gt_ai_reason_rival:0 "宿怨"
 hd_yiguan_gt_ai_reason_talent:0 "才具出众"
 hd_yiguan_gt_ai_reason_over_domain:0 "直辖领地已超出上限"
 hd_yiguan_gt_ai_reason_qiao_cheap:0 "侨州不过虚名"
 hd_yiguan_gt_ai_reason_arrogant:0 "自矜门第"
 hd_yiguan_gt_ai_reason_prestige:0 "名望显赫"
 hd_yiguan_gt_ai_reason_vacancy:0 "议会正有空缺"
 hd_yiguan_gt_ai_reason_stranger:0 "并非我门下之人"

 # ---------- 修正、好感、军队 ----------
 hd_yiguan_gt_qingwang_modifier:0 "北人清望"
 hd_yiguan_gt_qingwang_modifier_desc:0 "此人渡江而来，虽未得一官半职，清望却已传遍士林。"
 hd_yiguan_gt_spurned_opinion:0 "负资不归"
 hd_yiguan_gt_shelter_refused_opinion:0 "拒纳南来"
 hd_yiguan_gt_comrade_opinion:0 "同举北还"
 hd_yiguan_gt_beihuan_army:0 "北还之师"
 hd_yiguan_gt_beihuan_companion_army:0 "北还义从"

 # ---------- 事件 ----------
 hd_yiguan.4001.t:0 "北士来投"
 hd_yiguan.4001.desc:0 "门吏引进一位风尘仆仆的士人。他报上姓名[hd_yiguan_gt_migrant.GetName]，又郑重添上北方旧族的郡望，说胡骑横行，故里已非汉家之地，宗族数十口愿弃田宅来投，只求在我境内有一处容身之所。\n\n左右各有说辞。有人说北来士族素有清望，收之可以招徕人心；也有人提醒，接纳此人便是与其旧主结怨，日后胡骑南下，未必不拿这件事作口实。\n\n他把族谱与旧日的告身一并呈上，伏地不起，等我开口。"
 hd_yiguan.4001.a:0 "开门纳之"
 hd_yiguan.4001.a.tt:0 "[hd_yiguan_gt_migrant.GetName]一族将交出北方封地前来投奔，成为我的廷臣；我行天朝制时，此人以世族封臣身份留下。"
 hd_yiguan.4001.b:0 "婉言谢绝"
 hd_yiguan.4001.b.tt:0 "[hd_yiguan_gt_migrant.GetName]所付威望退还，两年内不能再举族南迁，并对我心生怨望。"

 hd_yiguan.4002.t:0 "衣冠南渡"
 hd_yiguan.4002.desc:0 "渡口的船只比约定的少了两条。族中老幼先上船，壮丁押着车辆殿后；田契与祖宅都已交还官府，带不走的只有坟茔。临行前，我回望了一眼故里的方向，终究没有说什么。\n\n[hd_yiguan_gt_dest.GetName]遣来接应的人已在对岸等候。从今往后，我们在新地方仍会报出北方的郡望，可那片故土，暂时只能活在族谱里了。"
 hd_yiguan.4002.desc_north:0 "山道上，族人的车辆排成长长一列。田契与祖宅都已交还官府，带不走的只有坟茔。过了最后一道关口，我回望了一眼故里的方向，终究没有说什么。\n\n[hd_yiguan_gt_dest.GetName]遣来接应的人已在关下等候。那里仍奉汉家正朔，虽同在北方，却已是另一片天地。从今往后，故土暂时只能活在族谱里了。"
 hd_yiguan.4002.a:0 "举族启程"
 hd_yiguan.4002.a.tt:0 "交出全部封地，携配偶、子女与未婚兄弟姐妹投奔[hd_yiguan_gt_dest.GetName]；本家记为侨姓，故土记为籍贯。"

 hd_yiguan.4003.t:0 "南迁见拒"
 hd_yiguan.4003.desc:0 "回信写得客气，意思却很明白：[hd_yiguan_gt_dest.GetName]不愿为一个北方士族去得罪胡人。信末附了些路费，算是对我一路奔走的交代。\n\n族人围在门外，等我说话。故里还在，田宅也还在，只是这一番动静，怕已瞒不过主上的耳目。"
 hd_yiguan.4003.a:0 "只好再作打算"
 hd_yiguan.4003.a.tt:0 "所付威望已退还；两年内不能再举族南迁。"

 hd_yiguan.4004.t:0 "南迁中止"
 hd_yiguan.4004.desc:0 "临行前夕，消息传来：情势已变，南去之路走不通了。或是去处已不能收留我们，或是我们自己脱不开身。车辆卸下，箱笼重新搬回库房，族人面面相觑。\n\n所付的打点之费退了回来，可这一番折腾，旁人都看在眼里。"
 hd_yiguan.4004.a:0 "暂且作罢"

 hd_yiguan.4005.t:0 "士族南奔"
 hd_yiguan.4005.desc:0 "[hd_yiguan_gt_migrant.GetName]走了。舍下北方的田宅家业，带着家眷投奔[hd_yiguan_gt_dest.GetName]，临走连一封辞表都没有留下。\n\n朝中的汉人官吏各怀心思，有人骂他忘恩负义，有人低头不语。我知道，走掉的不止一家人，还有那些在暗中观望的眼睛。"
 hd_yiguan.4005.a:0 "此事记下了"

 hd_yiguan.4011.t:0 "击楫誓师"
 hd_yiguan.4011.desc:0 "誓师之日已定。族中子弟与门下宾客聚在堂前，几位北府旧部的队主也来了，问我要往哪里去。\n\n舆图摊在案上。北方八州，有的已被胡骑占尽，有的尚有义兵坚守。打回故里自然名正言顺，可哪一处胡人兵力空虚、哪一处百姓尚念汉家，也不能不计较。\n\n我提起笔，在图上点了一处。"
 hd_yiguan.4011.sili:0 "北还司隶（守方：[hd_yiguan_gt_bh_def_sili.GetName]）"
 hd_yiguan.4011.jizhou:0 "北还冀州（守方：[hd_yiguan_gt_bh_def_jizhou.GetName]）"
 hd_yiguan.4011.youzhou:0 "北还幽州（守方：[hd_yiguan_gt_bh_def_youzhou.GetName]）"
 hd_yiguan.4011.bingzhou:0 "北还并州（守方：[hd_yiguan_gt_bh_def_bingzhou.GetName]）"
 hd_yiguan.4011.qingzhou:0 "北还青州（守方：[hd_yiguan_gt_bh_def_qingzhou.GetName]）"
 hd_yiguan.4011.yanzhou:0 "北还兖州（守方：[hd_yiguan_gt_bh_def_yanzhou.GetName]）"
 hd_yiguan.4011.xuzhou:0 "北还徐州（守方：[hd_yiguan_gt_bh_def_xuzhou.GetName]）"
 hd_yiguan.4011.yuzhou:0 "北还豫州（守方：[hd_yiguan_gt_bh_def_yuzhou.GetName]）"
 hd_yiguan.4011.go.tt:0 "变为无地冒险者，带北府兵、事件征召兵与同伴起兵，获得该州弱宣称，并对该州持县最多的胡人政权宣战；同伴各成一支冒险者，加入攻方。"
 hd_yiguan.4011.z:0 "时机未至"
 hd_yiguan.4011.z.tt:0 "收回成命，退还所付威望。"

 hd_yiguan.4012.t:0 "北还誓师"
 hd_yiguan.4012.desc:0 "前线来报：受我资助的[hd_yiguan_gt_bh_exile.GetName]已经誓师北上，带着北府旧部与乡党子弟，直取[hd_yiguan_gt_bh_kingdom.GetName]。\n\n当初拨出的钱粮兵马，如今都在那面旗下。他若能打回故土，不会忘记是谁替他备下了第一船粮。"
 hd_yiguan.4012.a:0 "静候佳音"

 hd_yiguan.4013.t:0 "北还未成"
 hd_yiguan.4013.desc:0 "人马已经聚起，檄文也写好了，可临到举事，才发现形势已非昨日：守将易主，或敌军另有战事牵制，原先的谋划落了空。\n\n部众散去之前，有人问我还要不要再等。所付的威望收了回来，北还之志，只能另觅时机。"
 hd_yiguan.4013.a:0 "徐图后举"

 hd_yiguan.4021.t:0 "故土重光"
 hd_yiguan.4021.desc:0 "城头换上了我的旗号。故土的父老出城相迎，有人认出了我家的郡望，当众哭了出来。\n\n战事稍歇，[hd_yiguan_gt_patron.GetName]的使者便到了。他带来贺礼，也带来一句话：当初资助北还，所费不赀，如今故土已复，是否愿奉表称臣，共御胡虏？\n\n诸将意见不一。有人说孤城难守，有南方强援，才保得住这片残破的土地；也有人说，血战得来的城池，何必拱手让人。"
 hd_yiguan.4021.a:0 "奉表来归"
 hd_yiguan.4021.b:0 "据地自立"

 hd_yiguan.4022.t:0 "北还来归"
 hd_yiguan.4022.desc:0 "[hd_yiguan_gt_bh_exile.GetName]的表文送到了。他自称臣属，愿以所复之地归附于我，与我共御胡虏。\n\n当初资助他北还时，许多人说这是把钱粮扔进了江里。如今看来，那一船粮食换回了一片故土。"
 hd_yiguan.4022.a:0 "善"

 hd_yiguan.4023.t:0 "负资不归"
 hd_yiguan.4023.desc:0 "[hd_yiguan_gt_bh_exile.GetName]回绝了我的使者。他说故土是将士血战夺回的，不敢轻易许人，只愿与我永为盟好。\n\n左右愤愤不平，说当初的钱粮兵马全都喂了白眼狼。我没有说话，只让人把那份回书收了起来。"
 hd_yiguan.4023.a:0 "记下此事"
