l_japanese:
 hd_dong_aftermath.0010.t:0 "宮門の守備交代"
 hd_dong_aftermath.0010.desc:0 "宮門の外の甲冑の音がやや静まると、王允が殿に入って董卓の死を奏上した。呂布は階の下に立ち、その背後の兵士たちは号令を改めた。その瞬間、あなたは連日殿中に重くのしかかっていた空気までもが緩んだように思った。\n\nだが続いて差し出されたのは、朝政と軍鎮の新たな手配だった。王允が政務を取り仕切り、呂布が長安一帯の兵を掌握する。四方の州郡は、董卓が誅されたからといって、印綬と兵権を御前に返上したわけではなかった。\n\nあなたは彼らが一項ずつ述べ終えるのを聞き、殿の外を見やった。天子を挟む者を一人殺すことと、天子が号令を発せられるようにすることとは、まるで別の事だったのだ。今まず守れるのは、なおこの幾重かの宮門と、まだ命に従う者たちだけである。"
 hd_dong_aftermath.0010.a:0 "まず宮城を安んじ、それから朝政を図る。"
 hd_li_jue_changan_cb:0 "長安奪取"
 hd_li_jue_changan_cb_name:0 "長安奪取"
 HD_LI_JUE_CHANGAN_WAR_NAME:0 "李傕の長安攻撃戦"
 hd_li_jue_event_troops:0 "涼州の旧部"
 hd_li_jue_changan_victory_desc:0 "李傕は京兆を獲得して長安を都とする。王允および天子の領内にいるその親族・妻妾は、養女貂蝉も含めてことごとく誅殺される。"
 hd_li_jue_changan_no_victory_desc:0 "李傕は長安を攻め取れなかった。"
