l_japanese:
 # 天朝循环·时代特色：紧张期套件（docs/天朝循环_时代特色重制计划.md §3.3）

 # ---------- 决议 ----------
 hd_dc_kit_ten_restoration_decision: "中興改革"
 hd_dc_kit_ten_restoration_decision_desc: "国勢は衰え、人心は変化を求めている。乾坤一擲、朝綱を正し、豪強を抑え、府庫を満たせば、再び中興を成し遂げられるかもしれない。だが成らなければ、かえって転覆を早めることになろう。"
 hd_dc_kit_ten_restoration_decision_tooltip: "朝綱を正し、再び中興を成し遂げようと努める"
 hd_dc_kit_ten_restoration_decision_confirm: "中興を図る"
 hd_dc_kit_ten_restoration_decision_effect_tt: "以後10年間、吏治・豪強・財用の諸問題が次々と押し寄せる。成否はあなたの才覚、公卿の才幹、尊王の諸党の勢いにかかっており、現時点での見込みはおよそ #high [ROOT.Char.MakeScope.ScriptValue('hd_dc_kit_ten_restoration_chance_value')|0]%#! である。中興が成れば天下は再び治世に戻る。敗れれば、転覆は旦夕に迫る。"
 hd_dc_kit_ten_if_success_tt: "中興が成れば："
 hd_dc_kit_ten_if_failure_tt: "あと一歩で失敗すれば："
 hd_dc_kit_ten_restoration_once_tt: "あなたはまだ中興改革を試みたことがない"
 hd_dc_kit_ten_restoration_legitimacy_tt: "あなたの[legitimacy|E]がまだ最低段階まで落ちていない"
 hd_dc_kit_ten_prohibition_decision: "党錮"
 hd_dc_kit_ten_prohibition_decision_desc: "党人は互いに結託し、朝廷を誹謗している。その一党を選び、禁錮して仕官できなくするか、一網打尽にする。"
 hd_dc_kit_ten_prohibition_decision_tooltip: "朋党を一つ選んで党錮を施す"
 hd_dc_kit_ten_prohibition_decision_confirm: "党錮の獄を起こす"
 hd_dc_kit_ten_prohibition_decision_effect_tt: "朝廷の一党を選び、処分の寛厳を定める。官をことごとく罷免して家に禁錮するか、党魁を捕らえて投獄し一網打尽にするか。寛厳いずれであっても、朝廷の情勢はこれによって大きく損なわれる。"
 hd_dc_kit_ten_prohibition_party_tt: "朝廷にすでに党魁を立てた朋党がある"

 # ---------- 修正 ----------
 hd_dc_kit_ten_chaos_consort_modifier: "乱象：外戚の専権"
 hd_dc_kit_ten_chaos_consort_modifier_desc: "外戚が要職に居座り、政治は私門から出て、天子の威望は日に日に損なわれている。外戚の一党は勢いを大いに伸ばし、その党魁にとって功名は手を伸ばせば届くものとなっている。"
 hd_dc_kit_ten_chaos_eunuch_modifier: "乱象：宦官の政治介入"
 hd_dc_kit_ten_chaos_eunuch_modifier_desc: "宦官が禁中に出入りし、口から天子の言葉を発し、内外は隔絶されている。宦官の一党は勢いを大いに伸ばし、時に内帑を横領することもあり、大臣たちの心は日に日に離れていく。"
 hd_dc_kit_ten_chaos_warlord_modifier: "乱象：権臣と藩鎮"
 hd_dc_kit_ten_chaos_warlord_modifier_desc: "権臣は兵を擁し、藩鎮は跋扈し、朝廷の号令は畿内の外に届かない。武勲の一党は勢いを大いに伸ばし、諸侯は競って部曲を拡充している。"
 hd_dc_kit_ten_chaos_partisan_modifier: "乱象：党争による消耗"
 hd_dc_kit_ten_chaos_partisan_modifier_desc: "朋党が互いに攻撃し合い、是非をめぐる争いが蜂起している。諸党の憎しみは日に日に深まり、議事に携わる諸臣は攻撃の応酬に疲れ果て、政務に心が向かない。"
 hd_dc_kit_ten_warlord_vassal_modifier: "藩鎮の自重"
 hd_dc_kit_ten_warlord_vassal_modifier_desc: "朝廷が地方の兵力に頼っているため、諸侯は部曲を拡充できる。"
 hd_dc_kit_ten_partisan_official_modifier: "党争に気を取られる"
 hd_dc_kit_ten_partisan_official_modifier_desc: "党争が激化しており、この人物は攻撃への対応に疲れ果て、本職に心が向かない。"
 hd_dc_kit_ten_consort_leader_modifier: "外戚の隆盛"
 hd_dc_kit_ten_consort_leader_modifier_desc: "外戚の権勢は天をも焦がすほどで、門下に群がる者は多く、功名は手を伸ばせば届く。"
 hd_dc_kit_ten_restoration_success_modifier: "中興の治"
 hd_dc_kit_ten_restoration_success_modifier_desc: "改革は大きな成果を上げ、綱紀は再び振るい、天下は口を揃えて中興を称えている。"
 hd_dc_kit_ten_restoration_failed_modifier: "中興の夢破れる"
 hd_dc_kit_ten_restoration_failed_modifier_desc: "改革はあと一歩で失敗に終わり、人心はいっそう離散した。"
 hd_dc_kit_ten_forged_evidence_modifier: "罪証の偽造"
 hd_dc_kit_ten_forged_evidence_modifier_desc: "一連の罪証をでっち上げたことで、弾劾文はより重みを増したが、見破られやすくもなった。"
 hd_dc_kit_ten_forged_evidence_2_modifier: "さらなる偽証"
 hd_dc_kit_ten_forged_evidence_2_modifier_desc: "$hd_dc_kit_ten_forged_evidence_modifier_desc$"

 # ---------- 好感 ----------
 hd_dc_kit_ten_impeached_me_opinion: "我を弾劾した"
 hd_dc_kit_ten_forged_against_me_opinion: "罪をでっち上げて我を陥れた"
 hd_dc_kit_ten_forgery_disgrace_opinion: "罪証の偽造"
 hd_dc_kit_ten_prohibition_opinion: "党錮による禁錮"
 hd_dc_kit_ten_purge_opinion: "党人を一網打尽にした"
 hd_dc_kit_ten_qjc_rebel_opinion: "兵を挙げて宮闕を犯した"
 hd_dc_kit_ten_qjc_removed_opinion: "君側の奸を除くと称して我を追放した"
 hd_dc_kit_ten_eunuch_meddling_opinion: "宦官の政治介入"
 hd_dc_kit_ten_favor_opinion: "恩遇を受けた"
 hd_dc_kit_ten_slight_opinion: "冷遇された"
 hd_dc_kit_ten_reprimand_opinion: "叱責された"

 # ---------- 弹劾（阴谋） ----------
 hd_dc_ten_impeach: "弾劾"
 hd_dc_ten_impeach_action: "弾劾"
 hd_dc_ten_impeach_desc: "私は[SCHEME.GetTargetCharacter.GetShortUINamePossessive]の罪証を集め、上書して弾劾する準備をしている"
 hd_dc_ten_impeach_desc_general: "$hd_dc_ten_impeach$[scheme|E]は、権臣の罪状を集めて上書弾劾し、罷免・投獄させることを目的とする。\n\n集めた罪証が多いほど、弾劾文は重みを増す。金を出して罪証を偽造することもできるが、偽証がひとたび見破られれば弾劾は必ず失敗し、あなたも身を滅ぼし名声を失う。"
 HD_DC_TEN_IMPEACH_SUCCESS_DESC: "弾劾文が上達され、権臣は罷免・投獄された"
 HD_DC_TEN_IMPEACH_DISCOVERY_DESC: "弾劾の企てが察知された"
 HD_DC_TEN_IMPEACH_VS_STRONG: "権臣の勢力が大きい"
 HD_DC_TEN_IMPEACH_EMPEROR_DISLIKES: "天子はもともとこの人物を好んでいない"
 hd_dc_ten_impeach_invalidated_title: "@scheme_icon!弾劾の中止"
 hd_dc_ten_impeach_invalidated_tt: "相手はすでに権力を失ったか、あなたがもはや天子の朝廷にいないため、弾劾は成り立たない。"
 hd_dc_ten_start_impeach_interaction: "弾劾#weak （工作）#!"
 hd_dc_ten_start_impeach_interaction_desc: "[recipient.GetShortUINamePossessive]の罪証を集めて上書弾劾する。弾劾文が認められれば、[recipient.GetSheHe]は罷免され投獄される。"
 start_hd_dc_ten_impeach_notification: "弾劾"
 hd_dc_ten_impeach_vip_tt: "重要人物（王侯、党魁、宰輔など）のみが上書弾劾できる"

 # ---------- 清君侧 ----------
 hd_dc_ten_qingjunce_interaction: "兵を率いて入朝・君側の奸を除く"
 hd_dc_ten_qingjunce_interaction_desc: "「君側の奸を除く」を名目に[recipient.GetShortUIName]を奸臣と指弾し、兵を挙げて天子にその身柄を要求する。"
 hd_dc_ten_qingjunce_interaction_tt: "あなたは「君側の奸を除く」を名目に天子に対して兵を起こす。勝てば奸臣は罷免・投獄され、あなたは以後天子の終身[regent|E]となる。負ければ牢に繋がれる。この戦いは奸臣を除くためだけのもので、城を争うものではない。"
 hd_dc_ten_qjc_peace_tt: "あなたは天子と交戦中ではない"
 hd_dc_ten_qingjunce_cb: "君側の奸を除く"
 hd_dc_ten_qingjunce_cb_desc: "奸臣誅除を名目に、兵を挙げて天子にその身柄を要求する。"
 HD_DC_TEN_QJC_CB_NAME: "君側の奸を除く"
 HD_DC_TEN_QJC_WAR_NAME: "[ATTACKER.GetShortUIName]による君側の奸を除く戦い"
 HD_DC_TEN_QJC_WAR_NAME_BASE: "君側の奸を除く戦い"
 hd_dc_ten_qingjunce_cb_victory_desc: "権臣は罷免・投獄され、[attacker.GetShortUIName]は天子の終身[regent|E]となる。"
 hd_dc_ten_qingjunce_cb_white_peace_desc: "両者は兵を引き、権臣はなおその地位にとどまる。"
 hd_dc_ten_qingjunce_cb_defeat_desc: "[attacker.GetShortUIName]は敗れ、天子に囚われる。"

 # ---------- 宦官贪墨 ----------
 hd_dc_ten_embezzle_toast: "宦官が内帑を横領"
 hd_dc_ten_embezzle_toast_tt: "宦官が出納の便を利用して、内帑の一部を横領した。"

 # ---------- 通用提示 ----------
 hd_dc_ten_restoration_chance_up_tt: "中興の見込みがいくらか高まった"
 hd_dc_ten_restoration_chance_up_small_tt: "中興の見込みがわずかに高まった"
 hd_dc_ten_restoration_chance_down_tt: "中興がまたいくらか難しくなった"
 hd_dc_ten_remove_minister_tt: "官職を罷免し、投獄して罪を問う。"

 # ---------- 中兴改革事件 ----------
 hd_dc_ten.0001.t: "中興を図る"
 hd_dc_ten.0001.desc: "詔書が頒布された：吏治を正し、豪強を抑え、府庫を満たせ。満朝の文武は顔を見合わせた――これが朝廷が自らを救う最後の機会であることを、誰もが分かっていた。"
 hd_dc_ten.0001.a: "成否はこの一挙にあり。"
 hd_dc_ten.0001.a.tt: "10年後、成否は自ずと明らかになる。現時点での見込みはおよそ #high [ROOT.Char.MakeScope.ScriptValue('hd_dc_kit_ten_restoration_chance_value')|0]%#! である。"
 hd_dc_ten.0002.t: "吏治の粛正"
 hd_dc_ten.0002.desc: "改革の初めは、まず吏治である。御史の報告によれば、各地の官吏に汚職がはびこっており、厳しく粛正しなければ新政は推し進められないという。ただし、粛正すれば必ず多くの者の恨みを買う。"
 hd_dc_ten.0002.a: "吏治を澄ませ、権貴をも避けない。"
 hd_dc_ten.0002.b: "旧例に従い、徐々に図る。"
 hd_dc_ten.0003.t: "豪強の妨害"
 hd_dc_ten.0003.desc: "改革は地方の豪強の利益を揺るがした。[hd_dc_ten_magnate.GetShortUIName]は公然と新政に抵抗し、各地の豪族は次々と様子見をしている。"
 hd_dc_ten.0003.a: "豪強を打ちのめし、見せしめとする。"
 hd_dc_ten.0003.b: "ひとまず妥協し、彼らを安心させる。"
 hd_dc_ten.0004.t: "財用の不足"
 hd_dc_ten.0004.desc: "改革は終盤に差しかかったが、府庫はすでに窮乏している。大司農が上奏し、銭糧を工面して大業を全うするよう願い出た。"
 hd_dc_ten.0004.a: "内帑を出して国用を賄う。"
 hd_dc_ten.0004.b: "税を増徴して急場をしのぐ。"
 hd_dc_ten.0004.c: "用度を節約し、なんとか持ちこたえる。"
 hd_dc_ten.0005.t: "中興の成否"
 hd_dc_ten.0005.desc_success: "十年生聚し、十年教訓す。綱紀は再び振るい、府庫は満ち、豪強は鳴りを潜め、四方は口を揃えて中興の主と称えた。"
 hd_dc_ten.0005.desc_failure: "10年の苦心も、結局は水泡に帰した。積弊は改めがたく、人心はいっそう離散し、朝廷にはもはや形勢を挽回する力がない。"
 hd_dc_ten.0005.a: "天意とあらば是非もない。"
 hd_dc_ten.0005.a_success: "祖宗の霊あり、社稷の福なり。"

 # ---------- 党锢事件 ----------
 hd_dc_ten.0011.t: "党錮"
 hd_dc_ten.0011.desc: "党人は互いに結託して朝廷を誹謗し、もはや処置せざるを得ない段階に至った。どの党に刃を向けるべきか？"
 hd_dc_ten.0011.huanguan: "宦官の党を処断する。"
 hd_dc_ten.0011.waiqi: "外戚の党を処断する。"
 hd_dc_ten.0011.wuxun: "武勲の党を処断する。"
 hd_dc_ten.0011.shizu: "世族の党を処断する。"
 hd_dc_ten.0011.hanmen: "寒門の党を処断する。"
 hd_dc_ten.0011.cancel: "この件は後日改めて議する。"
 hd_dc_ten.0012.t: "党錮の獄"
 hd_dc_ten.0012.desc: "[hd_dc_ten_party_leader.GetShortUIName]とその党羽の名簿がすでに差し出された。処分の寛厳は、すべてあなたの一存にかかっている。"
 hd_dc_ten.0012.a: "その党を禁錮し、仕官させない。"
 hd_dc_ten.0012.a.tt: "[hd_dc_ten_party_leader.GetShortUIName]の一党はことごとく罷免され、10年間は家に禁錮されて再び仕官できない。党人は皆あなたに歯ぎしりして恨む。"
 hd_dc_ten.0012.b: "一網打尽にせよ！"
 hd_dc_ten.0012.b.tt: "党魁[hd_dc_ten_party_leader.GetShortUIName]と党の要人はことごとく投獄され、一党の勢力は雲散霧消し、10年間は再び党を成すことはない。残党はあなたを骨の髄まで恨む。\n#EMP 党中で兵馬を握る者が「君側の奸を除く」を名目に兵を挙げるかもしれない。#!"
 hd_dc_ten.0013.t: "党人の託し"
 hd_dc_ten.0013.desc: "党人が一網打尽にされたとの知らせが届き、難を逃れた者たちが次々と身を寄せてきた。彼らはあなたを首領に推し、「君側の奸を除く」を名目に[hd_dc_ten_pm_pick.GetShortUIName]を誅除するよう願い出ている。"
 hd_dc_ten.0013.a: "兵を挙げて君側の奸を除く！"
 hd_dc_ten.0013.b: "じっと耐えて動かない。"

 # ---------- 弹劾事件 ----------
 hd_dc_ten.0021.t: "罪証は次第に揃う"
 hd_dc_ten.0021.desc: "あなたの机の上には、[hd_dc_ten_impeach_target_preview.GetShortUIName]を弾劾する罪証がまた一つ加わった。すぐに上書するか、それとももう少し待つか？　証拠が薄いと思うなら、代わりに「補ってくれる」者もいる――値段さえ折り合えばの話だが。"
 hd_dc_ten.0021.a: "上書して弾劾する！"
 hd_dc_ten.0021.a.tt: "弾劾文を上げれば、天子の裁定に委ねられる。罪証が揃っているほど認められやすい。認められれば、[hd_dc_ten_impeach_target_preview.GetShortUIName]は罷免・投獄され、あなたの名声も大いに高まる："
 hd_dc_ten.0021.b: "大金で偽証を買い求める。"
 hd_dc_ten.0021.b.tt: "#EMP 偽証がひとたび見破られれば、弾劾は必ず失敗し、あなたも身を滅ぼし名声を失う。#!"
 hd_dc_ten.0021.c: "もうしばらく集める。"
 hd_dc_ten.0022.t: "弾劾文の後"
 hd_dc_ten.0022.desc_success: "弾劾文が上達され、天子は激怒した。[hd_dc_ten_impeach_target.GetShortUIName]は官職を罷免され、投獄されて罪を問われた。"
 hd_dc_ten.0022.desc_forged: "弾劾文に列挙された罪証は有司の再調査を受け、なんと多くの綻びが見つかった。偽造が露見して弾劾はうやむやに終わり、かえってあなたが非難の的となった。"
 hd_dc_ten.0022.desc_failure: "弾劾文を差し出したものの、何の音沙汰もなかった。[hd_dc_ten_impeach_target.GetShortUIName]は依然として安泰にその地位にあり、しかも背後で事を起こしたのが誰かをすでに知っている。"
 hd_dc_ten.0022.a: "ひとまず成り行きを見よう。"
 hd_dc_ten.0023.t: "弾劾される"
 hd_dc_ten.0023.desc_success: "[hd_dc_ten_impeach_owner.GetShortUIName]が上書して弾劾し、天子はこれを認めた。あなたは官職を罷免され、獄に投じられた。"
 hd_dc_ten.0023.desc_forged: "[hd_dc_ten_impeach_owner.GetShortUIName]があなたを弾劾する上書をしたが、列挙された罪証は偽造であり、すでに有司に見破られた。"
 hd_dc_ten.0023.desc_failure: "[hd_dc_ten_impeach_owner.GetShortUIName]があなたを弾劾する上書をしたが、幸いにも天子はこれを認めなかった。"
 hd_dc_ten.0023.a: "この恨み、必ず晴らす。"

 # ---------- 乱象更替 ----------
 hd_dc_ten.0041.t: "乱象"
 hd_dc_ten.0041.desc_consort: "外戚の勢力は朝廷の諸党を圧倒し、政治は私門から出ている。#high 外戚の専権#!の情勢がすでに出来上がった。"
 hd_dc_ten.0041.desc_eunuch: "宦官が禁中に出入りして内外は隔絶され、朝臣は天子の顔を拝することもままならない。#high 宦官の政治介入#!の情勢がすでに出来上がった。"
 hd_dc_ten.0041.desc_warlord: "武臣は大軍を握り、諸侯はそれぞれ部曲を擁し、朝廷の号令は日に日に行われなくなっている。#high 権臣と藩鎮#!の情勢がすでに出来上がった。"
 hd_dc_ten.0041.desc_partisan: "朝廷の諸党は勢力が拮抗して互いに攻撃し合い、政務はそのために荒廃している。#high 党争による消耗#!の情勢がすでに出来上がった。"
 hd_dc_ten.0041.a: "時勢がかくなる上は、いかんともしがたい。"

 # ---------- 废立 ----------
 hd_dc_ten.0051.t: "廃立"
 hd_dc_ten.0051.desc: "長らく計画してきたことが、ついに成功した。[target.GetShortUIName]は廃されて幽閉され、大位は主を替えた。"
 hd_dc_ten.0051.desc_huangdi: "宮門は固く閉ざされ、甲士が周囲を取り囲む。百官は恐れて口をつぐみ、[target.GetShortUIName]が廃されて幽閉されるのをただ見ていた。天子が臣下によって廃立されうる――この天下は、もはやかつての天下ではない。"
 hd_dc_ten.0051.a: "天命は我にあり。"

 # ---------- 外戚专权 ----------
 hd_dc_ten.0101.t: "外戚の封侯"
 hd_dc_ten.0101.desc: "[hd_dc_ten_waiqi_leader.GetShortUIName]が上表し、弟や甥たちを侯に封じるよう願い出た。満朝は白い目で見ているが、あえて口に出す者はいない。"
 hd_dc_ten.0101.a: "その願いを認める。"
 hd_dc_ten.0101.b: "高祖の約：功なき者は侯たるを得ず。"
 hd_dc_ten.0102.t: "太后の臨朝"
 hd_dc_ten.0102.desc: "[hd_dc_ten_dowager.GetShortUIName]はまたもあなたを飛び越えて、自ら大臣を召見し、上奏文に裁可を下した。朝臣たちはすでに、まず後宮に伺いを立ててから天子に報告することに慣れきっている。"
 hd_dc_ten.0102.a: "懿旨に従う。"
 hd_dc_ten.0102.b: "朕自ら朝政を執るべきである。"
 hd_dc_ten.0103.t: "外戚による廃立"
 hd_dc_ten.0103.desc: "密報：[hd_dc_ten_waiqi_leader.GetShortUIName]が屋敷に腹心を集め、新たな君主を立てることを議しているという。これが本当なら、大禍は目前に迫っている。"
 hd_dc_ten.0103.a: "先手を打つ！"
 hd_dc_ten.0103.b: "厚く賞賜を与え、彼らを安心させる。"
 hd_dc_ten.0103.c: "じっと耐えて動かない。"

 # ---------- 宦官干政 ----------
 hd_dc_ten.0111.t: "十常侍"
 hd_dc_ten.0111.desc: "[hd_dc_ten_eunuch_leader.GetShortUIName]ら宦官が禁中を牛耳り、上奏文は彼らの手を経なければ上達されず、詔令も多くは彼らの口から出ている。外朝の大臣たちは怨嗟の声を上げている。"
 hd_dc_ten.0111.a: "この者たちは忠実だ。これまで通り寵愛し信任する。"
 hd_dc_ten.0111.b: "外朝に詔してともに政事を議させる。"
 hd_dc_ten.0112.t: "宦官の監軍"
 hd_dc_ten.0112.desc: "[hd_dc_ten_eunuch_leader.GetShortUIName]は内臣を監軍として派遣するよう上奏した。天子に代わって大軍を握る将帥を見張るためだという。将帥たちはこれを聞き、大いに不満を抱いている。"
 hd_dc_ten.0112.a: "上奏を認める。"
 hd_dc_ten.0112.b: "軍中で掣肘してはならない。"
 hd_dc_ten.0113.t: "宦官の詔書偽造"
 hd_dc_ten.0113.desc: "ある大臣が密かに上奏した。近頃頒布された詔書のいくつかは天子の御意から出たものではなく、[hd_dc_ten_eunuch_leader.GetShortUIName]の一味が君命を偽ったものだという。"
 hd_dc_ten.0113.a: "厳罰に処して容赦しない！"
 hd_dc_ten.0113.b: "うやむやにする。"

 # ---------- 权臣藩镇 ----------
 hd_dc_ten.0121.t: "辺鎮の擁兵"
 hd_dc_ten.0121.desc: "[hd_dc_ten_strong_vassal.GetShortUIName]は大軍を擁し、近頃はさらに盛んに部曲を募っている。朝廷の詔令はその管轄内ではすでに空文同然となっている。"
 hd_dc_ten.0121.a: "厚く恩賞を与え、手なずける。"
 hd_dc_ten.0121.b: "詔を下して厳しく責める。"
 hd_dc_ten.0122.t: "官職の世襲を請う"
 hd_dc_ten.0122.desc: "[hd_dc_ten_strong_vassal.GetShortUIName]が上表し、子弟にその職を世襲させること、および管轄下の官吏を自ら任免することの許可を求めた。"
 hd_dc_ten.0122.a: "大目に見るのが上策だ。"
 hd_dc_ten.0122.b: "断固として拒否する。"
 hd_dc_ten.0123.t: "権臣の専横"
 hd_dc_ten.0123.desc: "[hd_dc_ten_wuxun_leader.GetShortUIName]は功を恃んで驕り高ぶり、入朝しても小走りにならず、奏事の際にも名を称さず、あたかも天子のように振る舞っている。"
 hd_dc_ten.0123.a: "兵権を削り、官職を罷免せよ！"
 hd_dc_ten.0123.b: "耐え忍ぶ。"

 # ---------- 党争内耗 ----------
 hd_dc_ten.0131.t: "朋党の相互攻撃"
 hd_dc_ten.0131.desc: "[hd_dc_ten_la.GetShortUIName]と[hd_dc_ten_lb.GetShortUIName]が朝堂で互いに攻撃し合い、それぞれの門下からの上奏文が雪のように舞い込み、いずれも天子に公正な裁きを求めている。"
 hd_dc_ten.0131.a: "[hd_dc_ten_la.GetShortUIName]をかばう。"
 hd_dc_ten.0131.b: "[hd_dc_ten_lb.GetShortUIName]をかばう。"
 hd_dc_ten.0131.c: "双方の過ちを責め、どちらにも肩入れしない。"
 hd_dc_ten.0132.t: "選挙の不正"
 hd_dc_ten.0132.desc: "今年の察挙で推挙された孝廉・茂才の多くは権門の子弟であり、寒素の士は怨嗟の声を上げている。太学の諸生が集まって上書し、郡守が世家の請託を受けたと指弾した。この件はすでに町中の噂となっている。"
 hd_dc_ten.0132.a: "徹底的に調査する。"
 hd_dc_ten.0132.b: "この件をもみ消す。"
 hd_dc_ten.0133.t: "党人の評定"
 hd_dc_ten.0133.desc: "清流の士人たちが密かに公卿を品評しており、月旦評が出るや、「濁流」と評された者は仕途が暗くなる。朝臣たちはこれを敬いつつも恐れている。"
 hd_dc_ten.0133.a: "清議には自ずと公論がある。その評定を採用する。"
 hd_dc_ten.0133.b: "私議を禁じる。"
