l_japanese:
 hd_repair_shu_roads_decision: "蜀道を修繕する"
 hd_repair_shu_roads_decision_desc: "蜀の地は群山が険しく行く手を阻み、桟道は雨雪や兵火によってしばしば損壊する。銭帛を支出し、職人を徴発すれば、要路を一つ選んで改めて修築できる。"
 hd_repair_shu_roads_decision_tooltip: "領内の蜀道を一つ選び、職人を徴発して桟閣を修築し直す"
 hd_repair_shu_roads_decision_confirm:0 "即日工事を始めよ！"
 hd_tuntian_tazhong_decision: "沓中に屯田する"
 hd_tuntian_tazhong_decision_desc: "沓中の谷地は耕すにも守るにも適している。渠を修め倉を築き、軍民を交えて住まわせれば、辺境の軍を養えるうえ、次第に沃野にもなりうる。"
 hd_tuntian_tazhong_decision_tooltip: "沓中で渠を開いて田を墾き、軍民をその地で屯田させる"
 hd_tuntian_tazhong_decision_confirm:0 "渠を開き屯田せよ！"
 hd_consume_wushisan_decision: "五石散を服用する"
 hd_consume_wushisan_decision_desc: "杯の中で薬の粉が細かな白い光を放っている。医者によれば、これは精神を晴れやかにし、形と神をともに解き放つという――少なくとも薬効が切れるまでは。"
 hd_consume_wushisan_decision_tooltip: "五石散を服し、胸中の憂いをしばし忘れる"
 hd_consume_wushisan_decision_confirm:0 "散を服す"

 hd_repaired_shu_road_modifier: "蜀道修繕"
 hd_repaired_shu_road_modifier_desc: "桟道・橋梁および沿道の駅舎が修繕され、軍旅も旅人も安全に通行できるようになった。"
 hd_tazhong_tuntian_modifier: "沓中屯田"
 hd_tazhong_tuntian_modifier_desc: "軍戸が渠を修めて開墾し、穀物はその場で倉に納められ、この辺地は耕作と軍需を同時に担っている。"
 hd_satisfied_nanman_modifier: "満足した蛮族"
 hd_satisfied_nanman_modifier_desc: "土地の首領が朝廷の承認を得て、部衆はしばらくの間、貢賦を納め徴兵に応じる気でいる。"
 hd_inward_migration_modifier: "異民族の内遷"
 hd_inward_migration_modifier_desc: "新たに移り住んだ部衆は家畜・労働力・戦に長けた者をもたらし、荒れた土地を再び開墾した。"

 hd_regional_decisions.10.t: "散発"
 hd_regional_decisions.10.desc:0 "散を服した後、胸に積もっていた鬱屈は次第に遠のき、左右の話し声も一枚の帳を隔てたように聞こえる。先ほどまで繰り返し思い悩んでいた難題も、今はあなたの心を捉えられずにいる。\n\nあなたは机の縁に手をついて立ち上がり、初めて指先がかすかに震え、足元も普段ほど確かでないことに気づいた。その軽やかさは突然やって来たが、公務を一つとして片付けてはくれず、机上の文書もひとりでに消えはしない。\n\n左右はあなたの表情がやや和らいだのを見て、それ以上は問いただそうとしなかった。あなたは皆を下がらせ、衣を羽織ってゆっくりと歩いた。目の前の憂いはしばし休められても、薬の後の火照りと不快は、結局この身体が自ら受け止めるほかない。"
 hd_regional_decisions.10.a: "衣を羽織ってゆるりと歩き、薬効が散じるに任せる。"

 hd_regional_decisions.100.t: "蜀へ入る六つの道"
 hd_regional_decisions.100.desc:0 "蜀道の図籍が机の前一面に広げられ、損壊した箇所はすべて朱筆で丸く囲まれている。あなたが一本の道を果てまで目でたどると、口を開く前に、書吏が木石・役夫・銭糧の所要を差し出した。\n\n一区間の桟道は図の上ではわずか一寸ほどにすぎないが、本当に修繕するとなれば、どれほどの人に重荷を負わせて山に入らせねばならないか知れない。六つの道からそれぞれ報告が来ており、誰もが自分の所が最も急を要すると言うが、府庫の金はその「急」の字とともに増えてはくれない。\n\nあなたは図の角を押さえ、皆にいったん手を止めさせた。今回どの道を修繕するのか、あるいはひとまず見送るのかは、あなたが決めねばならない。"
 hd_regional_decisions.100.a: "米倉道を修繕する"
 hd_regional_decisions.100.b: "関城道を修繕する"
 hd_regional_decisions.100.c: "褒斜道を修繕する"
 hd_regional_decisions.100.d: "両当・陳倉道を修繕する"
 hd_regional_decisions.100.e: "子午道を修繕する"
 hd_regional_decisions.100.f: "儻駱道を修繕する"
 hd_regional_decisions.100.cancel: "この件はしばし審議を先送りする。"

 hd_pacify_nanman_decision: "南蛮を慰撫する"
 hd_pacify_nanman_decision_desc: "寧州は山川に隔てられ、かつての郡県の名だけでは必ずしも衆を服させられない。土地の首領を一人認め、部族の旧俗によってその郷土を治めさせれば、数十年の安定を得られるかもしれない。"
 hd_pacify_nanman_decision_tooltip: "寧州の一郡を選び、土地の首領をあなたの部族封臣に冊立し、その旧俗に従って治めさせる"
 hd_pacify_nanman_decision_confirm:0 "俗に因って治める"
 hd_nanman_acceptance_gain: "南蛮を慰撫する"
 hd_regional_decisions.200.t: "俗に因って治める"
 hd_regional_decisions.200.desc:0 "南中諸郡から来た者たちが堂下で待っている。通訳が一言話すたびに、彼らは互いに目配せを交わす。統治のことに話が及ぶと、首領たちは急に皆静まり返った。まるでついに本当に聞きたかった言葉を待ちわびていたかのように。\n\n一地を授けて旧俗による統治を許せば、今後多くの郡県で手に余る事柄にも別の落ち着き先ができる。だがどの郡を先に行い、印綬を誰の手に渡すかは、列挙された土地の中からあなたが一つを定めねばならない。\n\nあなたは通訳に先を急がせず、まず机上の名簿に目をやった。同じ一度うなずくのでも、どの名の後に下すかによって、堂下の顔色はおそらくまるで違ったものになるだろう。"
 hd_regional_decisions.200.yunnan: "雲南の土地の首領を冊立する"
 hd_regional_decisions.200.jianning: "建寧の土地の首領を冊立する"
 hd_regional_decisions.200.zangke: "牂柯の土地の首領を冊立する"
 hd_regional_decisions.200.wuling: "武陵の土地の首領を冊立する"
 hd_regional_decisions.200.fuling: "涪陵の土地の首領を冊立する"
 hd_regional_decisions.200.yuexi: "越巂の土地の首領を冊立する"
 hd_regional_decisions.200.bajun: "巴郡の土地の首領を冊立する"
 hd_regional_decisions.200.yongchang: "永昌の土地の首領を冊立する"
 hd_regional_decisions.200.cancel: "この議は重大ゆえ、後日改めて定める。"

 hd_move_foreign_peoples_inward_decision: "異民族の内遷"
 hd_move_foreign_peoples_inward_decision_desc:0 "塞外の諸部が家畜と家族を連れて入境することを願い出ている。彼らの安置地に一県を授け、その首領を直属の封臣とすれば、荒れ地を満たせるうえ、そこから戦に長けた者を徴募することもできる。ただし胡人が集住すれば、後々おとなしくしているとは限らない。"
 hd_move_foreign_peoples_inward_decision_tooltip:0 "塞外の一族の内遷を受け入れ、一県を授けて安置し、その首領をあなたの直属の封臣とする"
 hd_move_foreign_peoples_inward_decision_confirm:0 "塞外の使者を引見する"
 hd_regional_decisions.300.t: "塞外の客"
 hd_regional_decisions.300.desc:0 "北方諸部の使者が相次いで謁見を求め、首領の名を名乗り終えるや否や、内遷する部衆をどこに落ち着かせられるのかと尋ねてくる。あなたは通訳に急がぬよう言い、各家の来意を分けてはっきりと説明させた。\n\n匈奴・鮮卑・羯・氐・羌・烏桓は、部衆の多寡も、昔からの往来も、話す言葉もそれぞれ異なる。だが席上には決まって「胡」の一字で済ませる者がおり、そうすれば後のあらゆる手配を省けるかのようである。\n\nあなたは書吏に数通の来書を順に広げさせた。まずどの方を受け入れるかを定め、それからどの県を授けるかを議する。堂下の期待に満ちた眼差しが、あなたに代わってこの決断を下してくれるわけではない。"
 hd_regional_decisions.300.xiongnu: "匈奴の部衆の内遷を許可する"
 hd_regional_decisions.300.xianbei: "鮮卑の部衆の内遷を許可する"
 hd_regional_decisions.300.qiang: "羌人の部衆の内遷を許可する"
 hd_regional_decisions.300.jieren:0 "羯人の部衆の内遷を許可する"
 hd_regional_decisions.300.diren:0 "氐人の部衆の内遷を許可する"
 hd_move_foreign_peoples_inward_decision_effect_tt:0 "あなたは塞外諸部の使者を引見し、内遷する一族と安置する地を選ぶ。授ける県がもとは封臣のものであれば、その者が不満を抱くのは避けられない。"
 hd_regional_decisions.300.wuhuan: "烏桓の部衆の内遷を許可する"
 hd_regional_decisions.300.cancel: "辺地の準備はまだ整っていない。"
 hd_regional_decisions.310.t: "安置の地を選ぶ"
 hd_regional_decisions.310.desc:0 "どの方を受け入れるかが定まると、書吏はすぐさま尋ねた。「どの県を授けますか？」彼はその一族がかつて集住していた土地のうち、あなたまたは直属の封臣が治め、かつ首府でない県を一つずつ列挙した。先ほどのゆったりとした承諾は、たちまちずっしりとした行き先を得た。\n\nあなたは名簿に沿って目を落としていく。どの県名にも、もとからの住民と官吏が結びついている。封臣の手から割き取るとなれば、その封臣も心穏やかではいられまい。移ってくる者は落ち着かせねばならず、近隣の者も今後誰の号令に従うべきかを知らねばならない。\n\n筆は机の端で止まり、使者はなお返答を待っている。"
 hd_regional_decisions.310.a: "[scope:hd_migration_county_1.GetNameNoTier]を授ける"
 hd_regional_decisions.310.b: "[scope:hd_migration_county_2.GetNameNoTier]を授ける"
 hd_regional_decisions.310.c: "[scope:hd_migration_county_3.GetNameNoTier]を授ける"
 hd_regional_decisions.310.d: "[scope:hd_migration_county_4.GetNameNoTier]を授ける"
 hd_regional_decisions.310.e: "[scope:hd_migration_county_5.GetNameNoTier]を授ける"
 hd_regional_decisions.310.f: "[scope:hd_migration_county_6.GetNameNoTier]を授ける"
 hd_regional_decisions.310.g: "[scope:hd_migration_county_7.GetNameNoTier]を授ける"
 hd_regional_decisions.310.h: "[scope:hd_migration_county_8.GetNameNoTier]を授ける"
 hd_regional_decisions.310.cancel: "今は土地を授けない。"

 hd_explore_far_west_decision: "極西を探索する"
 hd_explore_far_west_decision_desc: "涼州の商旅から幾重にも伝え聞いた知らせによれば、葱嶺と無数の城邦を越えた日の沈む所に、なお大秦と自称する国があるという。使節団を組織すれば、そこの人々と見聞を東方へ持ち帰れるかもしれない。"
 hd_explore_far_west_decision_tooltip: "使者を西へ葱嶺の彼方へ遣わし、日の沈む所の大秦を訪ねさせる"
 hd_explore_far_west_decision_confirm:0 "使者を西へ遣わす"
 hd_regional_decisions.400.t: "日の沈む地へ"
 hd_regional_decisions.400.desc:0 "西へ向かう使節団の旅装はすでに整い、通訳は出発前に携える文書をもう一度点検した。暇乞いに来た者は道中の道筋をあなたに指し示したが、さらに遠い所の話になると、昔の商旅の又聞きに頼るほかなかった。\n\nあなたは糧資と出迎えの手配をはっきりと確かめ、自ら見たことと伝え聞いたことを分けて記すよう言い含めた。西へ一つ関津を過ぎるごとに、文字も礼俗も道も変わってゆく。遠方の国名は大きく響き渡りうるが、本当に持ち帰れる見聞は、一歩一歩歩いて得るほかない。\n\n使節団が出発した後、彼らからの返書がすぐに机の前に届くことはない。あなたは手元に残した路線図をしまい、西方からの知らせを静かに待つ。"
 hd_regional_decisions.400.a: "節を持して西へ赴き、見たものを必ず記録せよ。"
 hd_regional_decisions.401.t: "流沙に糧尽く"
 hd_regional_decisions.401.desc:0 "西へ向かった使節団からの報告が届いた。封の縁はすっかり擦り切れている。風砂が予定の行程を狂わせ、糧食と水ももはや元の割り当てでは支えきれないという。援助を求める箇所まで読み進めると、あなたは思わず文書を顔に近づけた。\n\nあなたは路線図を広げたが、指は知らせに記された場所で止まるほかない。人はあれほど遠くにおり、渇きも疲れもあなたが代わりに引き受けることはできない。それでも返書は、あなたが書かねばならない。"
 hd_regional_decisions.401.safe: "さらに二百金を支給し、現地で糧食と水を買い付けさせる。"
 hd_regional_decisions.401.risk: "元の名簿どおりに隊を分け、砂を冒して進む。"
 hd_regional_decisions.risk.tt:0 "#EMP この行いの成否は予測しがたい。再三挫折すれば、この旅は続けられなくなるおそれがある。#!"
 hd_regional_decisions.402.t: "諸城の関津"
 hd_regional_decisions.402.desc:0 "使節団は糧食と水の難をようやく越えたところで、今度は交易路上の城邑に足止めされた。来信によれば、当地は厚い礼物を求めており、通訳が長いこと交渉しても、相手は同じ言葉を繰り返すばかりだという。\n\n要求額を読んで、あなたは思わず文書を前へめくり直し、本当にここを通らねばならないのかを改めて確かめた。出発の時に議したのは遠方の見聞であったのに、今はいつも次の門を押し開けるのにいくら要るのかを問うてばかりいる。\n\nあなたは書状を平らに置いた。城外で待つあの一行は、あなたの一言の返答を待たねばならない。"
 hd_regional_decisions.402.safe: "二百金を支給し、礼に従って当地の首領に贈る。"
 hd_regional_decisions.402.risk: "国書を示し、名目なき税は納めない。"
 hd_regional_decisions.403.t: "見知らぬ文字"
 hd_regional_decisions.403.desc:0 "同じ一つの地名を、案内人がなんと二つの道に当てて指し示した。使節団の報告は二つの説を並べて記しており、読み進めるうちに、あなたも古い地図を前に眉をひそめるほかなかった――どちらも、たやすく消してよい書き損じとは思えない。\n\nあなたは二つの記述を並べて置き、ふと、最初にこの地図を描いた者を呼んで問いただしたくなった。だが机の前に遠方の道を知る者はおらず、できることはやはり一つの方針を定め、返書を送り出すことだけである。"
 hd_regional_decisions.403.safe: "二百金を支給し、当地の学者を招聘する。"
 hd_regional_decisions.403.risk: "古い地図と照らし合わせ、道に沿って西へ進む。"
 hd_regional_decisions.404.t: "大秦からの客"
 hd_regional_decisions.404.desc:0 "長い年月の後、使節団はついに新たな見聞を携えて帰ってきた。同行した遠方の学者があなたの前に案内されてきた。旅装にはまだ旅の塵が残っていたが、交易路や海岸について語る様は、多くの古地図よりも筋道立っていた。\n\nあなたは通訳に少しゆっくり話すよう頼み、自ら確かめられることを一つずつはっきりと記録させた。かつては又聞きの中にしか現れなかった名について、それらの間をどう行き来するのか、現地の人々がどう暮らしているのかを、今ようやく説明できる者が現れたのである。\n\n学者は留まって共に働くことを望み、携えてきた典籍もゆっくり校読できる。あなたはまず遠来の客のために住まいを整えるよう命じた。この西行で得たものが、誇示するための遠国の名だけであってはならない。"
 hd_regional_decisions.404.a: "遠来の客のために宴席を設ける。"
 hd_regional_decisions.409.t: "西への使者帰らず"
 hd_regional_decisions.409.desc:0 "帰ってきた使者はまず吉報を告げることはなく、ただ残った記録を机の上に置いた。あなたがしばし待つと、彼はようやく、西への旅程はもはや続けられないと言った。\n\n紙にはまだ到達していない場所が書かれているが、その後には新たな記述がもうない。道中の挫折がついに余地を使い果たし、帰ってこられたのは目の前のこの者たちと、この数巻の文書だけであった。いくつかの経由地について尋ねると、彼の答えは非常に遅く、言葉が途切れるたびに、その地名よりもなお聞き取りにくかった。\n\nあなたは記録を傍らにしまった。銭糧はすでに費やされ、遠い道も確かに歩まれた。だが当初の使命は、ついに果たされなかった。"
 hd_regional_decisions.409.a: "残巻を収め置き、来たる日を待つ。"

 hd_explore_yizhou_decision: "夷州を探索する"
 hd_explore_yizhou_decision_desc: "会稽の海民の言い伝えによれば、東南の大海の彼方には広大な島があるという。海船を建造し、潮の満ち引きに通じた者を募れば、朝廷は初めて信頼できる夷州への航路を得られるかもしれない。"
 hd_explore_yizhou_decision_tooltip: "船団を会稽から出し、海外の夷州を訪ねさせる"
 hd_explore_yizhou_decision_confirm:0 "帆を揚げて海に出る"
 hd_regional_decisions.500.t: "帆は会稽を出づ"
 hd_regional_decisions.500.desc:0 "海へ出る船団はすでに装備を整え、水先案内人は沿岸の山の形と水の様子、そして帰りの約束を最後にもう一度確かめた。届いた出航の報告には、船・糧水・随行者の名と数がびっしりと書かれている。\n\nあなたは彼らの知る海路を一つずつはっきりと尋ねたが、さらに遠い方角はなお一面の空白である。夷州の名は昔から噂にのぼっていたが、どうやって辿り着き、どこに停泊できるのかは、陸で聞いた数言だけに頼るわけにはいかない。\n\n遠洋航海はすでに始まった。あなたは道中で記録を残すよう、推測を見聞として書かぬよう言い含めた。今後の知らせの往復は速くはなく、船上で遭う困難も、先の準備と順次届く手配によって乗り切るほかない。"
 hd_regional_decisions.500.a: "潮に従って進み、必ず航海記録を残せ。"
 hd_regional_decisions.501.t: "真水尽きんとす"
 hd_regional_decisions.501.desc:0 "海に出た船団からの報告がようやく届いたが、冒頭に書かれていたのは見たものではなく、水と糧食のことであった。逆風で行程が長引き、隊長は配給を計算したうえで、なお資財の追加支給を願い出ている。\n\nあなたは知らせを頭へめくり返し、二度続けてまず「水」の字に目が行っていたことに気づいた。船はすでに遠く、机の前には乾いた墨の数行が残るのみである。返書は長くはないが、船上の者はそれを頼りに、この先の一続きの海路を乗り切らねばならない。"
 hd_regional_decisions.501.safe: "百金を支給し、道中で補給を買い付けさせる。"
 hd_regional_decisions.501.risk: "日々の配給を減らし、航路は変えない。"
 hd_regional_decisions.502.t: "陸影を見失う"
 hd_regional_decisions.502.desc:0 "糧水の難をようやく越えたばかりの船団は、新たな海域でまた意見が分かれた。沿岸の舟人の言う進路は古い記録と異なり、水先案内人は二つの説をまとめて送り返し、あなたの裁断を仰いでいる。\n\nあなたはその航海図を見て、ふと、陸の上ではっきりと引かれた線が、海に出るとこれほど頼りにならないものかと思った。使いの者が返書はいつ出せるかと尋ねる。あなたは図の角を平らに押さえた。「慎重に進め」と一言書くだけでは答えにならない。前方に本当に欠けているのは、どの道を信じるべきかなのだ。"
 hd_regional_decisions.502.safe: "百金を支給し、当地の水先案内人を雇う。"
 hd_regional_decisions.502.risk: "潮を測り星を観て、自ら道を探す。"
 hd_regional_decisions.503.t:0 "風浪迫る"
 hd_regional_decisions.503.desc:0 "水先案内人の報告には船体と索具の修理を要する箇所の明細が添えられ、末尾にはさらに、前途の風浪が次第に強まっており、ちょうど近くに一時停泊できる湾口があると書かれていた。それらの損傷を読み終えると、先ほどまで彼らに前進を促そうとしていた言葉は口元で止まった。\n\nはじめは糧水、次は方角、今度は船までもが金を求めてくる。あなたは以前の報告をまとめて取り出し、ますます遠ざかってゆくこの一行を見つめた。すでに費やした金が彼らを風から守ってくれるわけではない。次のこの一件も、やはりあなたが決めねばならない。"
 hd_regional_decisions.503.safe: "百金を支給し、湾に入って船を修理し風を避ける。"
 hd_regional_decisions.503.risk:0 "舟師を引き締め、波を冒して進む。"
 hd_regional_decisions.504.t: "夷州よりの帰帆"
 hd_regional_decisions.504.desc:0 "船団はついに帰ってきた。これまで報告の中でしか見なかった水と糧食、航路の迷い、風浪が、今や船体に刻まれた確かな傷となっている。随行者は記録を差し出し、さらに夷州出身の案内人を一人連れてきた。\n\nあなたは彼に図上の海岸と停泊地を説明させ、通訳が傍らで一言ずつ書き留めた。島の港湾、部衆、そして船を操る心得は、ついにもはや出発前のおぼろげな噂ではなくなった。\n\n案内人は留まることを望んだので、あなたは住まいを整えるよう命じ、持ち帰った記録を大切に保管させた。この遠洋航海はここにようやく落着した。得たものも後の者に残すべきであり、宴席で珍しい話の種にするだけのものであってはならない。"
 hd_regional_decisions.504.a: "海図を収め、彼を朝廷に招く。"
 hd_regional_decisions.509.t: "帆を畳んで引き返す"
 hd_regional_decisions.509.desc:0 "帰ってきた船の報告は、出航時よりずっと寂しいものであった。隊長は残った記録を差し出し、これ以上進めなくなったくだりに至ると、声が低くなり、しばらく言葉が続かなかった。\n\nあなたはそれらの記述を一頁ずつめくった。水と糧食、道の見極め、風浪――これまでの書状には毎回まだ試せる手立てがあったが、今やすべてが同じ一つの結果に行き着いた。今回の遠洋航海は、もはや成し遂げられない。\n\n使いの者はまだ何か慰めの言葉を言いたそうであったが、あなたはまず経過をはっきり話させた。船はまだ直せる、文書はまだ残せる。だが辿り着けなかった場所には、ついに辿り着けなかったのだ。"
 hd_regional_decisions.509.a: "造船所を整え、来たる日を待つ。"

 hd_partition_han_decision: "両漢分治"
 hd_partition_han_decision_desc: "版図はあまりに広大で、詔書が洛陽から涼州に届くのにすでに数か月を要する。一人の天子が東西を兼ね治めるのが難しいならば、古人に倣って天下を東・西の両漢に分け、同宗の二帝にそれぞれ一方を治めさせてはどうか。"
 hd_partition_han_decision_tooltip: "天下を東・西の両漢に分け、洛陽・長安を二京とする"
 hd_partition_han_decision_confirm:0 "東西分治を議す"
 hd_regional_decisions.600.t: "東西の二京"
 hd_regional_decisions.600.desc:0 "雒陽と長安の二枚の地図が並べて広げられ、分治の議もあなたが態度を表明すべき時に至った。この策を行えば、関中・涼州・益州は西漢に属し、残る天下は東漢に属し、双方がそれぞれ天子と都を持つことになる。\n\nあなたはまず雒陽を見やり、それから手を長安へと移した。どちらに留まるかによって決まるのは、今後どこで朝に臨むかだけではない。どの土地と臣下がなおあなたの掌中に残り、どれをもう一人の同宗の者に委ねるかも決まるのだ。\n\n詔書はまだ発せられていない。この議論は、今ならまだ引っ込めることができる。"
 hd_regional_decisions.600.east: "朕は洛陽に留まり、東漢に君臨する。"
 hd_regional_decisions.600.west: "朕は長安に遷り、西漢に君臨する。"
 hd_regional_decisions.600.cancel: "地図をしまい、この議は取りやめる。"
 hd_regional_decisions.610.t: "もう一人の漢帝を擁立する"
 hd_regional_decisions.610.desc:0 "東西分治の意はすでに定まり、あなたが留まる側も選ばれたが、詔書にはまだ最も重要なもう一つの名が空いたままである。\n\n名簿の宗室のうち一人が、もう一方の都と領土を得て、帝号をもってあなたと並び立つことになる。これは気軽に加封する一つの尊号ではなく、もとは一つの所から出ていた号令を、真に二つに分けることなのだ。\n\nあなたは名簿を初めから見直した。書吏は筆を持って控えているが、あなたは先に頌辞を書かせはしなかった。今最もよく考えねばならないのは、やはりその空欄に書き込まれる人物のことである。"
 hd_regional_decisions.610.a: "[scope:hd_partition_child_1.GetShortUINameNoTooltip]にもう一つの漢の統を継がせる"
 hd_regional_decisions.610.b: "[scope:hd_partition_child_2.GetShortUINameNoTooltip]にもう一つの漢の統を継がせる"
