 # 四个实际局势子区域
 silk_road_situation_sub_region_region_silk_road_eastern_section:0 "東段"
 silk_road_situation_sub_region_region_silk_road_eastern_section_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak 商旅は長安から西へ向かい、河西の武威・張掖・酒泉・敦煌の四郡を経て、玉門関または陽関を出て西域に入る。絹帛・良馬・新たな知識が、年々この道を行き交っている。#!"
 silk_road_situation_sub_region_region_silk_road_middle_northern_route:0 "中段北道"
 silk_road_situation_sub_region_region_silk_road_middle_northern_route_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak 北道は楼蘭から出発し、北山の南麓に沿って西へ進み、尉犁・烏塁・輪台・亀茲・姑墨を経て、ついに疏勒に至る。#!"
 silk_road_situation_sub_region_region_silk_road_middle_southern_route:0 "中段南道"
 silk_road_situation_sub_region_region_silk_road_middle_southern_route_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak 南道は楼蘭から南山の北麓に沿って西へ進み、且末・精絶・扞弥・于闐・皮山・莎車を経て、ついに疏勒に至る。#!"
 silk_road_situation_sub_region_region_silk_road_western_section:0 "西段"
 silk_road_situation_sub_region_region_silk_road_western_section_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak 南北二道は疏勒で合流し、西へ葱嶺を越える。隊商はここから大宛の城郭と市邑へと入っていく。#!"

 # 四座可访问市场
 visit_silk_road_market_decision_loulan:0 "$building_uuii_loulan_market_01$ #weak （[GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_middle_northern_route').MakeScope.Var('innovation').CultureInnovationType.GetName]）#!"
 visit_silk_road_market_decision_khotan:0 "$building_uuii_khotan_market_01$ #weak （[GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_middle_southern_route').MakeScope.Var('innovation').CultureInnovationType.GetName]）#!"
 visit_silk_road_market_decision_dayuan:0 "$building_uuii_dayuan_market_01$ #weak （[GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_western_section').MakeScope.Var('innovation').CultureInnovationType.GetName]）#!"

 building_type_uuii_loulan_market_01:0 "$building_uuii_loulan_market_01$"
 building_type_uuii_loulan_market_01_desc:0 "$building_uuii_loulan_market_01_desc$"
 building_uuii_loulan_market_01:0 "楼蘭の市場"
 building_uuii_loulan_market_01_desc:0 "楼蘭城は蒲昌海の北西に臨み、西域の南北二道が分かれる地にある。玉門を出てきた駱駝の隊商はここで水を飲んで休み、旅装を整えてから、それぞれの道を選んで西へ向かう。"
 building_uuii_loulan_market_02:0 "繁栄する楼蘭の市場"
 building_uuii_loulan_market_02_desc:0 "楼蘭城外には邸舎が軒を連ね、井戸や泉、駅舎が市を囲んで立ち並び、東から来て西へ去る商旅が一年じゅう絶えることがない。"
 building_uuii_loulan_market_01_destination_desc:0 "[GetBuilding('uuii_loulan_market_01').GetName]には北道あるいは南道へ向かう隊商が集まり、駱駝の鈴の音、値切りの声、胡漢入り混じった言葉が昼夜絶えない。"

 building_type_uuii_khotan_market_01:0 "$building_uuii_khotan_market_01$"
 building_type_uuii_khotan_market_01_desc:0 "$building_uuii_khotan_market_01_desc$"
 building_uuii_khotan_market_01:0 "于闐の市場"
 building_uuii_khotan_market_01_desc:0 "于闐の城郭は崑崙の麓に寄り添い、美玉・絹帛と南道の交易で名高い。遠方諸国の商人たちはここで品物を交換し、見聞をも交換する。"
 building_uuii_khotan_market_02:0 "繁栄する于闐の市場"
 building_uuii_khotan_market_02_desc:0 "于闐の市場は幾筋もの街路にまで広がり、玉を磨く工房、倉庫、宿屋が、流沙を越えてきた商旅を昼夜迎え送っている。"
 building_uuii_khotan_market_01_destination_desc:0 "[GetBuilding('uuii_khotan_market_01').GetName]には崑崙の美玉、絹帛、異国の香料が並び、南道で最もまばゆい商業の地となっている。"

 building_type_uuii_dayuan_market_01:0 "$building_uuii_dayuan_market_01$"
 building_type_uuii_dayuan_market_01_desc:0 "$building_uuii_dayuan_market_01_desc$"
 building_uuii_dayuan_market_01:0 "大宛の市場"
 building_uuii_dayuan_market_01_desc:0 "葱嶺を越えてきた隊商は大宛で再び集結する。汗血の名馬、鉄器、葡萄酒、そして東から来た絹帛が、ここの城邑の間で次々と持ち主を変える。"
 building_uuii_dayuan_market_02:0 "繁栄する大宛の市場"
 building_uuii_dayuan_market_02_desc:0 "大宛の市場はすでに葱嶺以西の交易路における一大都会となり、広い荷置き場には駄獣の隊列がひしめき、馬商人と遠来の客がここで次の行程を取り決める。"
 building_uuii_dayuan_market_01_destination_desc:0 "[GetBuilding('uuii_dayuan_market_01').GetName]は良馬と葱嶺を越える遠距離交易で知られ、漢の地と康居・安息の品々がここで交わる。"
