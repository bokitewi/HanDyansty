l_japanese:
 hd_miasma_county_modifier:0 "瘴気"
 hd_miasma_county_modifier_desc:0 "林莽は深く、湿熱が立ちこめ、瘴癘が横行する。兵がその境に入れば疫病がつきまとい、民がその地に住めば開墾は困難を極める。\n\n#X @warning_icon!この[county|E]の[development|E]が#V 30#!以上に達すれば、その直轄の主君は[GetDecisionWithKey('hd_clear_miasma_decision').GetName][decision|E]によってこの患いを根絶できる！#!\n\n"
 hd_clear_miasma_decision:0 "瘴気を払う"
 hd_clear_miasma_decision_desc:0 "江嶺以南は低湿で暑熱が厳しく、瘴気の雲が晴れない。住む者は病に冒され、旅する者は道を戒める。\n\n今や境内の人口は日に日に増え、田畑も次第に拓かれた。今こそ医工を遣わし、水沢を浚い、腐草を焼き、病民を移して、この地の風土に清明を取り戻すべき時である。"
 hd_clear_miasma_decision_tooltip:0 "統治下で相当の[development|E]を持つ直轄[counties|E]から[GetModifier('hd_miasma_county_modifier').GetNameWithTooltip]を駆除する"
 hd_clear_miasma_decision_confirm:0 "草を焼き沢を浚え！"
 hd_miasma_county_eligible_removal_tt:0 "[GetModifier('hd_miasma_county_modifier').GetName][county_modifier|E]を持ち、かつ[development|E]が#V 30#!以上の直轄[county|E]が少なくとも1つある"
 hd_miasma_removal_tt:0 "[development|E]が#V 30#!以上のすべての直轄[counties|E]は、[GetModifier('hd_miasma_county_modifier').GetNameWithTooltip]に悩まされなくなる"
 hd_miasma_no_counties_meet_criteria_tt:0 "@alert_icon!#alert_trial 現在、この基準を満たす直轄伯領は一つもない！#!"
 hd_miasma_cleared.t:0 "瘴癘次第に消ゆ"
 hd_miasma_cleared.desc:0 "[ROOT.Char.GetFullName]は水沢を浚い、広く医工を遣わし、統治下の瘴癘の地は再び清明を取り戻した。"
