l_japanese:
 hd_cixiong_shuanggujian_name:0 "雌雄双股剣"
 hd_cixiong_shuanggujian_description:0 "形は異なりながら気韻の相和する一対の長剣。雄剣は重厚、雌剣は軽やかで、分けても合わせても用いられる。劉備はこの剣を好み、常に二振りを一手に併せ持って義勇の衆に号令し、危うきを扶け困窮を救ったと伝えられる。"
 hd_zhangba_shemao_name:0 "丈八蛇矛"
 hd_zhangba_shemao_description:0 "長さ一丈八尺の矛。刃は蛇が泳ぐように曲がりくねり、長柄は安定して、進退の間に変化は計り知れない。張飛のような剛猛無双の勇士にこそふさわしく、万軍の中で陣を破り旗を奪うことができる。"
 hd_liangyin_qiang_name:0 "亮銀槍"
 hd_liangyin_qiang_description:0 "槍身は銀に輝き、刃は清冽に冷たく、飾りは簡素ながら鋭気を失わない。趙雲がこれを手に陣に臨めば、槍影は流光のごとく往き来し、守りは隙なく攻めは迅速である。"
 hd_shenwei_longdan_qiang_name:0 "神威竜胆槍"
 hd_shenwei_longdan_qiang_description:0 "名工が精鉄と白銀を幾重にも象嵌して作り上げた長槍。穂先と呑口の接するところは、銀の竜が首をもたげるかのようである。陣にて掲げれば、その威容は敵の胆を震え上がらせるに足り、武庫に収めれば家伝の重宝ともなる。"
 hd_hao_longdan_name:0 "豪竜胆"
 hd_hao_longdan_description:0 "穂先は幅広く堂々とし、金の紋様が刃の稜線に沿って巻き上がり、剛健の中にもおのずから華やかな気品がある。この槍は一撃で敵を破ることを本領とし、持ち手の胆略と武名を何よりよく示す。"
 hd_wushuang_fangtian_huaji_name:0 "無双方天画戟"
 hd_wushuang_fangtian_huaji_description:0 "戟の穂先は高くそびえ、両側の月牙の脇刃は翼のように広がり、全身から鋭い殺気がにじみ出ている。呂布のような比類なき膂力の持ち主でなければ、これを飛ぶように振るうことはできないと伝えられる。"
