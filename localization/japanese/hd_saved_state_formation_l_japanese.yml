l_japanese:
 hd_form_saved_k_yongzhou_decision:0 "雍州の設立"
 hd_form_saved_k_yongzhou_decision_desc:0 "安定から馮翊にかけて、郡県はそれぞれの所属を持つが、往来する文書は結局一か所に集まらねばならない。今や諸郡は次第に我が手中に入りつつあり、雍州の名にも、四境に真に号令する州府があってしかるべきである。"
 hd_form_saved_k_yongzhou_decision_tooltip:0 "旧管轄の諸郡を統合し、雍州を設立する"
 hd_form_saved_k_yongzhou_decision_confirm:0 "州を立て、制度を定める。"
 hd_form_saved_k_yongzhou_decision_requirement:0 "雍州を治める者がまだおらず、かつその旧管轄七郡のうち少なくとも六郡の全域があなたの支配下にある"
 hd_form_saved_k_yongzhou_decision_effect:0 "あなたは雍州を領有し、その旧管轄七郡は再び雍州の[de_jure|E]統属に復する"
 hd_form_saved_k_qinzhou_decision:0 "秦州の設立"
 hd_form_saved_k_qinzhou_decision_desc:0 "隴山以西、天水・武都の諸郡は山河と道路を扼している。ここの軍糧と政令をもはやばらばらにさせぬためには、机上の境界を一州の制度へと変えねばならない。"
 hd_form_saved_k_qinzhou_decision_tooltip:0 "旧管轄の諸郡を統合し、秦州を設立する"
 hd_form_saved_k_qinzhou_decision_confirm:0 "州を立て、制度を定める。"
 hd_form_saved_k_qinzhou_decision_requirement:0 "秦州を治める者がまだおらず、かつその旧管轄七郡のうち少なくとも六郡の全域があなたの支配下にある"
 hd_form_saved_k_qinzhou_decision_effect:0 "あなたは秦州を領有し、その旧管轄七郡は再び秦州の[de_jure|E]統属に復する"
 hd_form_saved_k_hezhou_decision:0 "河州の設立"
 hd_form_saved_k_hezhou_decision_desc:0 "金城・隴西の使者が相次いで庭前に至るが、携えてくるのは相変わらず各郡の帳簿である。河州の諸郡が一つの役所に帰すれば、河沿いの関津・倉廩・兵役にも共通の主管者ができるのだ。"
 hd_form_saved_k_hezhou_decision_tooltip:0 "旧管轄の諸郡を統合し、河州を設立する"
 hd_form_saved_k_hezhou_decision_confirm:0 "州を立て、制度を定める。"
 hd_form_saved_k_hezhou_decision_requirement:0 "河州を治める者がまだおらず、かつその旧管轄五郡のうち少なくとも四郡の全域があなたの支配下にある"
 hd_form_saved_k_hezhou_decision_effect:0 "あなたは河州を領有し、その旧管轄五郡は再び河州の[de_jure|E]統属に復する"
 hd_form_saved_k_luozhou_decision:0 "洛州の設立"
 hd_form_saved_k_luozhou_decision_desc:0 "洛陽のかつての声望はなお残っているが、京畿の諸郡を古い名だけで繋ぎとめることはできない。私は属吏を召集し、州府の統属を定め直して、四方からの文書には投ずる先を、政令には行き渡る道を与えよう。"
 hd_form_saved_k_luozhou_decision_tooltip:0 "旧管轄の諸郡を統合し、洛州を設立する"
 hd_form_saved_k_luozhou_decision_confirm:0 "州を立て、制度を定める。"
 hd_form_saved_k_luozhou_decision_requirement:0 "洛州を治める者がまだおらず、かつその旧管轄六郡のうち少なくとも五郡の全域があなたの支配下にある"
 hd_form_saved_k_luozhou_decision_effect:0 "あなたは洛州を領有し、その旧管轄六郡は再び洛州の[de_jure|E]統属に復する"
 hd_form_saved_k_sizhou_decision:0 "司州の設立"
 hd_form_saved_k_sizhou_decision_desc:0 "魏郡と河内の間の道はすでに我が手にあるが、行き交う郡吏はなおそれぞれ古い慣例を守っている。これらの郡県の賦役と号令を改めて結びつけるには、共通の州名が必要だ。"
 hd_form_saved_k_sizhou_decision_tooltip:0 "旧管轄の諸郡を統合し、司州を設立する"
 hd_form_saved_k_sizhou_decision_confirm:0 "州を立て、制度を定める。"
 hd_form_saved_k_sizhou_decision_requirement:0 "司州を治める者がまだおらず、かつその旧管轄五郡のうち少なくとも四郡の全域があなたの支配下にある"
 hd_form_saved_k_sizhou_decision_effect:0 "あなたは司州を領有し、その旧管轄五郡は再び司州の[de_jure|E]統属に復する"
 hd_form_saved_k_uuii_bingzhou_decision:0 "并州の設立"
 hd_form_saved_k_uuii_bingzhou_decision_desc:0 "辺郡からの急報と太原の帳簿が机上に並び、私に思い起こさせる。一地を領有することは、諸郡の心を一つにすることと同じではない、と。并州の州府を私が定めるならば、これらの軍政の事務にも帰属すべき先ができよう。"
 hd_form_saved_k_uuii_bingzhou_decision_tooltip:0 "旧管轄の諸郡を統合し、并州を設立する"
 hd_form_saved_k_uuii_bingzhou_decision_confirm:0 "州を立て、制度を定める。"
 hd_form_saved_k_uuii_bingzhou_decision_requirement:0 "并州を治める者がまだおらず、かつその旧管轄十二郡のうち少なくとも十郡の全域があなたの支配下にある"
 hd_form_saved_k_uuii_bingzhou_decision_effect:0 "あなたは并州を領有し、その旧管轄十二郡は再び并州の[de_jure|E]統属に復する"
 hd_form_saved_k_jiangzhou_decision:0 "江州の設立"
 hd_form_saved_k_jiangzhou_decision_desc:0 "長江沿いの郡県は舟で通じ合っているが、政令が流れとともに届くとは限らない。今や私はその大部分を統合できる。江州の名のもとに、諸郡を総べる州府を設けるべき時だ。"
 hd_form_saved_k_jiangzhou_decision_tooltip:0 "旧管轄の諸郡を統合し、江州を設立する"
 hd_form_saved_k_jiangzhou_decision_confirm:0 "州を立て、制度を定める。"
 hd_form_saved_k_jiangzhou_decision_requirement:0 "江州を治める者がまだおらず、かつその旧管轄十三郡のうち少なくとも十一郡の全域があなたの支配下にある"
 hd_form_saved_k_jiangzhou_decision_effect:0 "あなたは江州を領有し、その旧管轄十三郡は再び江州の[de_jure|E]統属に復する"
 hd_form_saved_k_xiangzhou_decision:0 "湘州の設立"
 hd_form_saved_k_xiangzhou_decision_desc:0 "湘水両岸の使者が廊下で待ち、それぞれ自郡の文書を握っている。私は地図を見て、これらの地がいつまでも各自ばらばらに治められてはならぬと知った。湘州の名号こそ、それらを統合する端緒となろう。"
 hd_form_saved_k_xiangzhou_decision_tooltip:0 "旧管轄の諸郡を統合し、湘州を設立する"
 hd_form_saved_k_xiangzhou_decision_confirm:0 "州を立て、制度を定める。"
 hd_form_saved_k_xiangzhou_decision_requirement:0 "湘州を治める者がまだおらず、かつその旧管轄九郡のうち少なくとも八郡の全域があなたの支配下にある"
 hd_form_saved_k_xiangzhou_decision_effect:0 "あなたは湘州を領有し、その旧管轄九郡は再び湘州の[de_jure|E]統属に復する"
 hd_form_saved_k_suozhou_decision:0 "朔州の設立"
 hd_form_saved_k_suozhou_decision_desc:0 "北地と朔方の関塞は長い辺境を結んでいる。諸郡がそれぞれ門戸を守るだけでは、四方から起こる事態に対処しきれない。私は朔州の名のもとに、軍報・糧運・号令のすべてに帰する所を与えよう。"
 hd_form_saved_k_suozhou_decision_tooltip:0 "旧管轄の諸郡を統合し、朔州を設立する"
 hd_form_saved_k_suozhou_decision_confirm:0 "州を立て、制度を定める。"
 hd_form_saved_k_suozhou_decision_requirement:0 "朔州を治める者がまだおらず、かつその旧管轄十二郡のうち少なくとも十郡の全域があなたの支配下にある"
 hd_form_saved_k_suozhou_decision_effect:0 "あなたは朔州を領有し、その旧管轄十二郡は再び朔州の[de_jure|E]統属に復する"
 hd_form_saved_k_uuii_jiaozhou_decision:0 "交州の設立"
 hd_form_saved_k_uuii_jiaozhou_decision_desc:0 "南方への道は遠く、各郡の使者が到着する頃には、机上にはしばしば数か月分の古い報告が積み上がっている。この地を長く経営するならば、交州の統属を定め、遠近の郡県に同じ印信を認めさせねばならない。"
 hd_form_saved_k_uuii_jiaozhou_decision_tooltip:0 "旧管轄の諸郡を統合し、交州を設立する"
 hd_form_saved_k_uuii_jiaozhou_decision_confirm:0 "州を立て、制度を定める。"
 hd_form_saved_k_uuii_jiaozhou_decision_requirement:0 "交州を治める者がまだおらず、かつその旧管轄六郡のうち少なくとも五郡の全域があなたの支配下にある"
 hd_form_saved_k_uuii_jiaozhou_decision_effect:0 "あなたは交州を領有し、その旧管轄六郡は再び交州の[de_jure|E]統属に復する"
 hd_form_saved_k_yingzhou_decision:0 "郢州の設立"
 hd_form_saved_k_yingzhou_decision_desc:0 "南陽・南郡と江漢の諸地の文書が机上を埋め尽くしている。境界が次第に一つながりになった以上、政令が古い区分の前で立ち止まるのを放っておくわけにはいかない。郢州が、これらの郡県に共通の州府を与えることになろう。"
 hd_form_saved_k_yingzhou_decision_tooltip:0 "旧管轄の諸郡を統合し、郢州を設立する"
 hd_form_saved_k_yingzhou_decision_confirm:0 "州を立て、制度を定める。"
 hd_form_saved_k_yingzhou_decision_requirement:0 "郢州を治める者がまだおらず、かつその旧管轄八郡のうち少なくとも七郡の全域があなたの支配下にある"
 hd_form_saved_k_yingzhou_decision_effect:0 "あなたは郢州を領有し、その旧管轄八郡は再び郢州の[de_jure|E]統属に復する"
 hd_form_saved_k_pingzhou_decision:0 "平州の設立"
 hd_form_saved_k_pingzhou_decision_desc:0 "遼東の諸郡は関所と山々に隔てられ、命令の往復はきわめて難しい。今やこれらの地は次第に我が統轄に帰しつつある。平州の州府を立て、辺地の諸郡がもはや各自で四方の事態に応じずに済むようにしよう。"
 hd_form_saved_k_pingzhou_decision_tooltip:0 "旧管轄の諸郡を統合し、平州を設立する"
 hd_form_saved_k_pingzhou_decision_confirm:0 "州を立て、制度を定める。"
 hd_form_saved_k_pingzhou_decision_requirement:0 "平州を治める者がまだおらず、かつその旧管轄八郡のうち少なくとも七郡の全域があなたの支配下にある"
 hd_form_saved_k_pingzhou_decision_effect:0 "あなたは平州を領有し、その旧管轄八郡は再び平州の[de_jure|E]統属に復する"
