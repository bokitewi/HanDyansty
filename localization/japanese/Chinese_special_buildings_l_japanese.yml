 building_type_xibeiyanchi_salt_mines_01: "塩池"
 building_type_xibeiyanchi_salt_mines_01_desc: "西北の辺地には塩池が多く、池の水が干上がった所に塩が凝結する。これを戎塩と呼び、食用にも薬用にもなる。"
 building_type_bashu_salt_mines_01: "巴蜀塩井"
 building_type_bashu_salt_mines_01_desc: "巴蜀の山中には塩水の泉が多く、郷人は井戸を掘って鹹水を汲み、煮詰めて塩とする。伝えによれば秦の蜀守李冰が広都に塩井を開いたといい、以来井塩の利は蜀中に広まった。"
 building_type_liaodong_salt_mines_01: "遼東塩場"
 building_type_liaodong_salt_mines_01_desc: "遼東の海岸は岩礁が険しく、塩を煮るための浜は狭い。産する海塩は多くないが、白く細やかなことで知られる。"
 building_type_jiaodong_salt_mines_01: "膠東塩場"
 building_type_jiaodong_salt_mines_01_desc: "膠東の湾は岩の海岸が多く、塩場は狭く産出も少ないが、近海の郷里をまかなうには足りる。"
 building_type_lubei_salt_mines_01: "魯北塩区"
 building_type_lubei_salt_mines_01_desc: "斉国北方の海浜では地下の鹹水が海水よりも塩辛く、これを煮て塩とする。管仲が魚塩の利を興して以来、斉の地はこれによって天下一の富を誇った。"
 building_type_wuyue_salt_mines_01: "呉越海塩区"
 building_type_wuyue_salt_mines_01_desc: "呉越の海浜の地では海水を煮て塩を作り、その産出は極めて多い。高祖の時代、呉王劉濞は海を煮て塩を作り、山に拠って銭を鋳たので国の財は豊かであった。太史公は呉の地を「東に海塩の饒あり」と評している。"

