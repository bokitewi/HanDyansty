 building_type_linzi_iron_mines_01: "小型鉄鉱"
 building_type_linzi_iron_mines_01_desc: "斉の地は管仲以来、塩と鉄の利によって諸侯の中で最も富んだ。臨淄の近郊には小さな鉄鉱があり、鉱脈は浅く産出も多くないが、郷里の農具をまかなうには十分である。"
 building_type_xuzhou_iron_mines_01: "大型鉄鉱区"
 building_type_xuzhou_iron_mines_01_desc: "彭城一帯の山中には鉄鉱が豊富で、朝廷はここに鉄官を置き、工徒を使役して石を採り鉄を製錬させている。年月を経て坑道と炉が一面に連なり、周囲には冶鋳を生業とする多くの家々が集まった。"
