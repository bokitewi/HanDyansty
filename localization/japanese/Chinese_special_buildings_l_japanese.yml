l_japanese:
 building_type_jiaodong_golden_mines_01: "膠東金鉱"
 building_type_jiaodong_golden_mines_01_desc: "東萊・膠東一帯は丘陵が起伏し、渓流の砂からはしばしば金屑が採れる。郷人は連れ立って山に入り、石を穿ち砂をさらう。得られるのはわずかばかりだが、積もり積もればなかなかの量となる。"
 building_type_Xinglong_golden_mines_01: "河北興隆金鉱"
 building_type_Xinglong_golden_mines_01_desc: "漁陽以北の燕山の奥深く、谷間に金脈が眠っている。鉱夫たちは石を穿って砂を取り、渓流のほとりで幾度も洗い流す。ときには塊の金を得ることもある。"
 building_type_lishui_golden_mines_01: "麗水金鉱"
 building_type_lishui_golden_mines_01_desc: "荊南の麗水からは金が産し、砂を洗えば金粒が見える。韓非子によれば、この地の民は多くが密かに金砂を採り、官府が厳しく禁じても禁を犯す者は道に絶えなかったという。"
 building_type_yaan_golden_mines_01: "雅安栄経金鉱"
 building_type_yaan_golden_mines_01_desc: "蜀郡厳道県の山々では渓流が激しく流れ、砂の中に金屑が潜む。孝文皇帝はかつて厳道の銅山を鄧通に賜って銭を鋳させた。この地の鉱物資源の豊かさが知れ、古くから蜀の人々に重んじられてきた。"

 building_type_jiaodong_crystal_mines_01: "水晶瑪瑙玉鉱"
 building_type_jiaodong_crystal_mines_01_desc: "この地の山中からは水精・瑪瑙・美玉が産する。色つやは透き通るように美しく、職人はこれを杯や帯鉤、佩飾に磨き上げ、貴人たちは争って買い求める。"
