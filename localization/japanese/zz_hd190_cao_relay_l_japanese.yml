l_japanese:
 # 2026-10-26：190 曹操陈留—兖州接力（hd190.0102~0103）
 hd190.0102.t:0 "陳留の謀"
 hd190.0102.desc:0 "董卓はすでに死に、連合軍もとうに散った。諸侯はみな自分の郡県へ戻って守りを固めている。あなたが持つのは陳留西境の己吾・襄邑・雍丘といった小城ばかりで、そこに屯する兵の糧秣はすべて[hd190_relay_def.GetName]の援助に頼っている。

配下の一人が進言した。「陳留は四方に通じる要地です。[hd190_relay_def.GetName]は明公の旧友とはいえ、寛大ではあっても決断に欠け、土地を守る器ではありません。いま諸侯はそれぞれ異心を抱いております。明公が取らねば、必ず他の者が取りましょう。陳留に拠れば、兗州を図ることができます。」"
 hd190.0102.a:0 "陳留は取らねばならぬ。即日兵を進めよ。"
 hd190.0102.a.tt:0 "[hd190_relay_def.GetName]に併呑で宣戦し、その全領地を目標とする。勝利後は続けて兗州の諸郡へ兵を向ける"
 hd190.0102.b:0 "孟卓は旧友だ。この件は急がぬ。"
 hd190.0103.t:0 "兗州東略"
 hd190.0103.desc:0 "新たに得た城邑もまだ落ち着かぬうちに、斥候が報せてきた。兗州の諸郡はそれぞれ自守して互いに統属せず、[hd190_relay_def.GetName]の兵馬がすぐ境外にいるという。

謀士たちは言う。兗州は天下の中央、四方から攻められる地であり、まずここを押さえねば立つ足場がない。諸侯がまだ力を合わせぬうちに、一つずつ取るべきだ、と。"
 hd190.0103.a:0 "勝ちに乗じて東進し、[hd190_relay_def.GetName]を討つ。"
 hd190.0103.a.tt:0 "[hd190_relay_def.GetName]に併呑で宣戦し、その兗州内の領地を目標とする。勝利後も東進を続け、兗州の県の七割を実効支配するまで止まらない"
 hd190.0103.b:0 "兵は疲れている。しばし休ませよう。"
