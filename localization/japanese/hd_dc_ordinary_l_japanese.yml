l_japanese:
 hd_dc_ord.0009.t: "囹圄の中の身内"
 hd_dc_ord.0009.desc: "届いた文書には[hd_dc_prisoner.GetTitledFirstName]の名が記されていた。その人はまだ[hd_dc_captor.GetTitledFirstName]の牢に囚われている。家の親族が人に頼んで何度か探りを入れたが、持ち帰られる話はいつも「値」という一字から離れなかった。\n\n親族たちは皆あなたを見つめ、決断を待っている。身代金は少額ではないが、牢獄での日々はさらに耐えがたい。まして、あなた自身の牢にも、相手が気にかけている者が囚われているかもしれない。"
 hd_dc_ord.0009.a: "百金で身請けせよ。これ以上言うことはない。"
 hd_dc_ord.0009.a.tt: "[hd_dc_captor.GetTitledFirstName]が身代金を受け取り、人を釈放して帰せば："
 hd_dc_ord.0009.b: "この値は呑めない。別の手を考えよう。"
 hd_dc_ord.0009.c: "捕虜を捕虜と交換し、それぞれの主のもとに帰す。"
 hd_dc_ord.0009.c.tt: "[hd_dc_captor.GetTitledFirstName]が交換に応じれば、あなたも牢にいる[hd_dc_captor.GetHerHis]身内の一人を釈放して返さねばならない："
 hd_dc_ord09_a_terms: "[hd_dc_proposer.GetTitledFirstName]より[hd_dc_recipient.GetTitledFirstName]へ書を致す：百金を出して[hd_dc_prisoner.GetTitledFirstName]を身請けしたい。金が届いた日には、どうか釈放して家に帰されたい。書中では身代金と釈放のことのみを論じ、忠誠を求めず、人質を要求せず、後日の助力も約さない。三か月返答なければ、この議は取りやめとする。"
 hd_dc_ord09_c_terms: "[hd_dc_proposer.GetTitledFirstName]より[hd_dc_recipient.GetTitledFirstName]へ書を致す：両家がそれぞれ一人ずつ釈放する――[hd_dc_recipient.GetTitledFirstName]は[hd_dc_prisoner.GetTitledFirstName]を、[hd_dc_proposer.GetTitledFirstName]は[hd_dc_exchange_prisoner.GetTitledFirstName]を釈放して返す。人と人とを交換し、金帛を求めず、忠誠も求めない。両人がともに牢を出てはじめて、この約定は成立とする。三か月返答なければ、この議は取りやめとする。"
 hd_dc_ord.0209.t: "身請けの書状への返答"
 hd_dc_ord.0209.ransomed: "身代金はすでに[scope:hd_dc_ordinary.Var('hd_dc_captor').Char.GetTitledFirstName]の手に届き、牢の扉もそれに続いて開かれた。[scope:hd_dc_ordinary.Var('hd_dc_prisoner').Char.GetTitledFirstName]は髪は乱れ顔は垢にまみれた姿で出てきて、家族に支えられて車に乗った。\n\n親族たちはすでに出迎えの宴の酒食を手配している。この心配事も、ようやく片がついた。"
 hd_dc_ord.0209.exchanged: "二か所の牢の扉が同じ日に開かれた。[scope:hd_dc_ordinary.Var('hd_dc_prisoner').Char.GetTitledFirstName]は家に帰り、あなたの牢にいた[scope:hd_dc_ordinary.Var('hd_dc_exchange_prisoner').Char.GetTitledFirstName]も[scope:hd_dc_ordinary.Var('hd_dc_captor').Char.GetTitledFirstName]のもとへ送り返された。\n\n両家はそれぞれ身内を取り戻したが、旧怨がこれで片づくとは限らない。"
 hd_dc_ord.0209.rejected: "使者は手つかずのままの文書を持って帰ってきた。[scope:hd_dc_ordinary.Var('hd_dc_captor').Char.GetTitledFirstName]は承知しなかったのだ。\n\n身代金はまだあなたの蔵にあり、人もまだ相手の牢の中だ。この件は別の手立てを考えるしかない。"
 hd_dc_ord.0209.partial: "約定では双方が同時に釈放することになっていた。[scope:hd_dc_ordinary.Var('hd_dc_prisoner').Char.GetTitledFirstName]はすでに家に帰ったが、あなたの側で釈放すべき者は牢の扉を出られなかった。\n\nこれでは成立した交換とは言えない。仲介者は前後の経緯を一つ一つ書き留めた。今後、両家がこの件で争うことは避けられないだろう。"
 hd_dc_ord.0209.unpaid: "[scope:hd_dc_ordinary.Var('hd_dc_captor').Char.GetTitledFirstName]は承諾したものの、身代金は全額届かなかった。仲介者は釈放の手配を止め、送った金は取り戻せる分はすべて取り戻した。\n\n身請けは叶わず、この件は取りやめとなった。"
 hd_dc_ord.0209.failed: "約定は成ったものの、[scope:hd_dc_ordinary.Var('hd_dc_prisoner').Char.GetTitledFirstName]は結局牢の扉を出られなかった。すでに金品が送られていれば、仲介者も取り戻す手を尽くし、取り戻せる分はすべて取り戻した。\n\nその人はまだ相手の牢の中にいる。この件は別の手立てを考えるしかない。"
 hd_dc_ord.0209.cancelled: "文書がまだ道中にあるうちに、情勢は変わってしまった――その人がもはや元の場所にいないか、期限が過ぎたのだ。以前の約定は、もはや効力を持たない。\n\n今回の身請けの件は、これで取りやめとなった。"
 hd_dc_ord.0209.a: "この件はひとまず記録しておこう。"
 hd_dc_ord.0019.t: "仇の子"
 hd_dc_ord.0019.desc: "[hd_dc_visitor.GetTitledFirstName]は階の前に立ち止まり、自らの名を名乗った。実のところ名乗るまでもない。[hd_dc_visitor.GetSheHe]が誰の子か、あなたはとうに知っている――[hd_dc_enemy_parent.GetTitledFirstName]という名は、あなたの心の中で常に別の古い出来事と結びついているのだ。\n\nだが目の前のこの者自身は、何の過ちも犯していない。父祖の代の古い貸し借りを誰の頭に帰すべきか、そして今日[hd_dc_visitor.GetHerHim]をどう遇すべきか、堂上の者たちは皆あなたが口を開くのを待っている。"
 hd_dc_ord.0019.a: "人を論ずるにはその行いを論ずべきで、その父を論ずべきではない。"
 hd_dc_ord.0019.b: "汝の家がしたこと、我は決して忘れておらぬ。"
 hd_dc_ord.0013.t: "山積みの書類"
 hd_dc_ord.0013.desc: "[hd_dc_petitioner.GetTitledFirstName]からの文書がまた机に加わった。その統治下の土地はすでに手に負えなくなっているのに、事の大小を問わず、いまだに一件ずつあなたのもとへ上げて裁可を仰いでくる。\n\nあなたは一番上の一巻を開き、二行ほど読んで、また閉じた。連日の疲れは公務が急を要するからといって自然に引いてくれるものではない。門の外にはまだ人が控えており、机の上の事も誰かが片付けねばならない。"
 hd_dc_ord.0013.a: "政務は煩雑だ。重臣に分担を頼もう。"
 hd_dc_ord.0013.b: "知らせを持ってきた者に八つ当たりする。"
 hd_dc_ord.0013.b.tt: "#EMP 一時の怒りを吐き出しても、胸のつかえがそれで晴れるとは限らない。#!"
 hd_dc_ord.0013.c: "親友に心中を打ち明け、大事はなお自ら決する。"
 hd_dc_ord.0013.c.tt: "親友が返書で助言してくれれば："
 hd_dc_ord.invalidated: "時は移り事情は変わり、この件は取りやめとなった。"
 hd_dc_ord.0113.t: "上奏文の外の言葉"
 hd_dc_ord.0113.desc: "[hd_dc_ordinary_ruler.GetTitledFirstName]から届いたのは私信であり、全編にわたって公文書の決まり文句は見当たらない。\n\n「あなたに私の代わりに決めてほしいのではない。ただ、信頼できる人に話を聞いてもらいたいことがあるのだ。」その後の数頁は、書類のこと、伺いのこと、そして夜になってもなかなか寝つけない理由で埋め尽くされていた。\n\n手紙を読み終える頃には、紙面から疲れがあふれ出しそうだった。この手紙にどう返事をするかは、あなた自身が考えねばならない。"
 hd_dc_ord.0113.a: "一つ一つ返事を書き、憂いを分かち合う。"
 hd_dc_ord.0113.b: "私も自分のことで手一杯で、力になれず申し訳ない。"
 hd_dc_ord.0213.t: "机の上の小さな余白"
 hd_dc_ord.0213.helped: "返書を読み終えても、机の上の上奏文は一巻も減っていない。だが少なくとも、どれが今日決裁せねばならず、どれが明日に回せるかは見分けがつくようになった。\n\n誰かがあなたの悩みを真剣に読み、一つ一つ助言を書いてくれた。それだけで心はずいぶん軽くなった。決めるのはやはりあなた自身だが、次の詔令をどう書くべきかも、以前よりはっきりした。"
 hd_dc_ord.0213.declined: "返書が届いたが、相手も今は分担する余裕がないとのことだった。あなたはそれ以上催促しなかった。\n\n机の上の巻物は元の場所にあり、心の重荷もまだのしかかっている。今回は、自分ひとりで背負っていくしかない。"
 hd_dc_ord.0213.a: "今日の事は、今日のうちに終わらせる。"
 hd_dc_ordinary_response_opinion: "最近の交流"
