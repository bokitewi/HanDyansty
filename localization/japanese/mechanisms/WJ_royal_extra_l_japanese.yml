 ZongWang_ShiHao.022_t: "自ら諡号を定める"
 ZongWang_ShiHao.022_d:0 "候補はすでに下げられ、案上には筆墨と一つの余白だけが残った。儲位や死後の礼制をめぐる説明も、ようやくひとまず止んだ。\n\nあなたは手を案の端に置いたまま、なかなか筆を執らなかった。生前は多くの者が東宮の行く末を思い描いていたが、今は皆が脇へ退き、あなたがこの最後の呼び名を書き記すのを待っている。"
 ZongWang_ShiHao.022.a: "これを諡とする。"
 SanGong_Zongzu.002.t: "太孫を冊立する"
 SanGong_Zongzu.002.d:0 "[Taizi.GetName]が世を去り、喪事もまだ片付かぬうちに、儲嗣の名簿が再びあなたの前に届けられた。聞き慣れたその呼び名を耳にして、あなたの指は案の端でしばし止まり、それから使いの者に続きを読ませた。\n\nこの系統の後嗣の中から、別の一人を選んで儲位を継がせるべきか。名が一つずつ読み上げられるたびに、あなたはその顔をひとつひとつ思い浮かべようとした。亡き者が残したのは一つの空席だが、そこに立つ者を、ただ空席を埋める一画として扱うべきではない。\n\nあなたは名簿を手元に留め、頌辞の起草を急がせはしなかった。堂下で待たれているのはただ一つの名にすぎないが、あなたの胸に浮かぶのは、その者がこれより二度と戻れぬ平穏な日々であった。"
 SanGong_Zongzu.002.a: "太孫に立てる"
 SanGong_Zongzu.002.b: "太孫は立てず、別に儲君を選ぶ"
