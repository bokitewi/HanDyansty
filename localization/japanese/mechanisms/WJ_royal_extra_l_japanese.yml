 ZongWang_ShiHao.021.event_title: "太子の追諡"
 ZongWang_ShiHao.021.event_desc:0 "太子は幼くして世を去り、東宮の多くの備えは手を付けられぬうちに、すでに死後の事へと変わってしまった。有司は諡字の候補を差し出したが、その声は常よりも低く、まるでこれらの厳かな文字すら重すぎるのを恐れるかのようであった。\n\nあなたはその短い生涯の記録を見つめ、まだ起こりえなかった事柄をそこに書き加えたくはなかった。成長を遂げられなかった子は、円満な功業がなくとも、心から悼まれるに値する。\n\nそれでも諡号は定めねばならない。筆を下ろすとき、あなたが残したいのは、人々が彼のために思い描いた将来ではなく、短くとも確かにあったこの命そのものであった。"
