 ZongWang_ShiHao.020.event_title: "太子の追諡"
 ZongWang_ShiHao.020.event_desc:0 "太子の死後の礼議が机の前に届けられ、有司はその諡を定めるよう請うた。「東宮」の二字を聞いて、あなたがまず思い浮かべたのは、なおやり残していた事々であった。しばらくして、ようやく視線を候補の諡字に移した。\n\n人はもういないのに、礼官は順を追って尋ね続けねばならない。かつて将来のために立てたさまざまな計画も、今はただ死後の記録にどう書き込むかが残るのみである。生涯のこの頁がめくられれば、その後に新たに書き加えることはもう何もない。\n\nあなたは候補をもう一度見た。礼官は筆を持って控え、催促はしないが、その空白にはいずれ一つの呼び名を残さねばならない。"
