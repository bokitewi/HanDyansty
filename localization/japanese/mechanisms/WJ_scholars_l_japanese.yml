 WJ_yangwang.custom:0 "いっそ自ら号を題そう。"
 WJ_yangwang.custom.desc:0 "あなたは出来合いの名号をいくつか脇へ押しやり、自ら題することに決めた。この名号はこれから先、あなたの身の処し方や交遊に付き従うものだ。ことさら奇を求める必要はないが、後日筆を執って署名するとき、自分でよそよそしく感じないものでありたい。\n\nすぐに良い案が浮かばなければ、筆を置いても構わない。"
 WJ_yangwang.dongshan:0 "東山隠士"
 WJ_yangwang.keep:0 "旧号をそのまま用いる。"
 WJ_yangwang.naming.desc:0 "山に住み書を読むからには、雅号の一つもあるべきだろう。他人がどう品評するかはまだ分からないが、少なくともこの名号は、あなたが今どのように生きたいのかを語るものであるべきだ。もしまだ隠棲していないならば、名号を定めた日こそ、俗務に別れを告げ、門を閉ざして名望を養う時となる。\n\n山居林泉の意を取るもよし、水月の志趣に思いを託すもよし、自ら工夫を凝らすもよい。旧号があるならば、旧号のまま署しても差し支えない。すぐに良い案が浮かばなければ、ひとまず筆を置くのもよかろう。"
 WJ_yangwang.naming.title:0 "山中に何と名乗るか"
