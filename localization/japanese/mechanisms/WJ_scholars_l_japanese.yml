# 汉晋风华：按类型整合；键名与现行文本保留。来源逐键见本批manifest。

 # 来源：localization/simp_chinese/WJ_qingyi_loc_l_simp_chinese.yml
 activity_window_character_ming_shi:0 "特別招待の名士\n[Character.Custom('WJ_GetUIName')|U]"
 activity_wj_qingyi:0 "清議"
 activity_wj_qingyi_conclusion_desc:0 "賓主は袖を収めて立ち上がる。今日の言葉はすでに月旦となり、その余論はなお語り継がれるであろう。"
 activity_wj_qingyi_desc:0 "同好の士を招き、席を設け、玄理を談じ、名教を分かち、人物を品評し、経世を論ずる。席上の片言隻語が人の名声を一躍高めることもあれば、確執の種を蒔くこともある。"
 activity_wj_qingyi_destination_selection:0 "賓主が清談できる館舎のある場所を選ぶ。"
 activity_wj_qingyi_guest_desc:0 "\n$BULLET_WITH_TAB$参加者は[prestige_i][prestige|E]と[merit_i][merit|E]を得ることがある\n$BULLET_WITH_TAB$すでに仕官し清望のある者は、清議の[trait_level_track_xp|E]を伸ばすことがある\n$BULLET_WITH_TAB$参加者はその[intent|E]に応じて、教えを請う、交遊する、憂いを晴らす機会を得ることがある"
 activity_wj_qingyi_guest_help_text:0 "[activity_guests|E]は席上で詰問を受けたり、名士に教えを請うたり、人物を品評して同好の士と交わったりし、席後の内緒話に巻き込まれることもある。"
 activity_wj_qingyi_guest_rewards:0 "\n$BULLET_WITH_TAB$賓客は[prestige_i][prestige|E]と[merit_i][merit|E]を得られる\n$BULLET_WITH_TAB$清議の[trait_level_track_xp|E]は、1年のうち最初の清議でのみ伸びる"
 activity_wj_qingyi_host_an_a:0 "$articleblank_article$"
 activity_wj_qingyi_host_desc:0 "$activity_wj_qingyi_host_rewards$$activity_wj_qingyi_guest_rewards$"
 activity_wj_qingyi_host_rewards:0 "\n$BULLET_WITH_TAB$主人は[prestige_i][prestige|E]と[merit_i][merit|E]を得られる\n$BULLET_WITH_TAB$すでに仕官し清望のある者は、清議の[trait_level_track_xp|E]を伸ばせる\n$BULLET_WITH_TAB$「月旦評」を開けば、主人は多大な[prestige_i][prestige|E]を得る。選ばれた者は名声大いに振るい、さらに[influence|E]と「名士」の誉れを得る"
 activity_wj_qingyi_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]の清議"
 activity_wj_qingyi_owner:0 "清議の主人"
 activity_wj_qingyi_plural:0 "清議"
 activity_wj_qingyi_predicted_cost:0 "予想費用"
 activity_wj_qingyi_province_desc:0 "あなたは[ROOT.Province.GetName]で清議を催す。館舎が静かで賓客の往来に便利な地こそ、腰を据えて道を論ずるに最もふさわしい。"
 activity_wj_qingyi_selection_tooltip:0 "[GetActivityType('activity_wj_qingyi').GetName]を催し、名士を招いて玄を談じ人を品評する。"
 ming_shi:0 "特別招待の名士"
 ming_shi_desc:0 "声望の高い名士。その一言の鑑識は満座を傾聴させ、席上で教えを請うことや品題の機会もそれだけ増える。"
 ming_shi_desc_for_host:0 "$ming_shi_desc$"
 ming_shi_for_host:0 "特別招待の名士"
 qingyi_guest_learning_intent:0 "求学"
 qingyi_guest_learning_intent_desc:0 "この清議を通じて名士や同好の士に経書を携えて疑問を問い、散会の折には学問に進境を得たいと望んでいる。"
 qingyi_yuedan_intent:0 "月旦評"
 qingyi_yuedan_intent_desc:0 "汝南の許子将の故事に倣い、月旦に当世の人物を品評しようとしている。まず8人を挙げ、続いて会に集った賓客が二度にわたり品第して、8人から4人、4人から1人を定める。選ばれた者は名声大いに振るい、「名士」の誉れを享ける。"
 qingyi_option_tea:0 "茶菓の用意"
 qingyi_option_tea_desc:0 "茶の湯気は清らかで、心を養い長く座していられる。茶菓が精緻であれば、賓客は席に着くなり主人への好感度が一段増し、名士や好学の者もより進んで書を広げ深く語り合う。"
 qingyi_option_topic_depth:0 "論題の深さ"
 qingyi_option_topic_depth_desc:0 "今回語る玄理・経義・政論の深浅を定める。論題が深いほど教えを請う者や機鋒の応酬を招きやすく、月旦評で人を推す際にも衆議を服させやすい。"
 qingyi_option_wine:0 "美酒のもてなし"
 qingyi_option_wine_desc:0 "席上で酒を供して興を添えるかどうかを定める。酒があれば賓客はより喜んで集い、清談で憂いを晴らしたい者も胸中のわだかまりを晴らしやすい。ただし酒が回れば、放埒に振る舞い礼を失する者が出ないとも限らない。"
 qingyi_phase_conclusion:0 "品題の散会"
 qingyi_phase_conclusion_desc:0 "諸論をまとめ、今日の人物の品評を定め、この会に最後の一筆を残す。"
 qingyi_phase_lunshi:0 "時事を論ず"
 qingyi_phase_lunshi_desc:0 "賓主が席に着き、まず時局と経義を論ずる。月旦評を開くならば、主人はこの時に8人の人物を挙げる。"
 qingyi_phase_pinren:0 "人物を品す"
 qingyi_phase_pinren_desc:0 "当世の人物を一人ずつ品題する。月旦評を開くならば、この議論が終わると8人のうち4人だけが残る。"
 qingyi_phase_dingping:0 "評を定む"
 qingyi_phase_dingping_desc:0 "4人を最終評価し、1人を第一に推す。"
 qingyi_relief_intent:0 "清談で憂いを晴らす"
 qingyi_relief_intent_desc:0 "案牘と紛争からしばし離れ、玄言や茶酒、同好の士との交わりによって、胸中に積もった[stress|E]を和らげたいと望んでいる。"
 qingyi_tea_refined:0 "念入りな茶菓"
 qingyi_tea_refined_desc:0 "水を選んで茶を煮出し、果物と菓子を細やかに整え、名士や好学の者がより進んで書を広げ深く語り合えるようにする。"
 qingyi_tea_simple:0 "簡素な茶菓"
 qingyi_tea_simple_desc:0 "数皿の菓子と一杯の清茶。賓主とも口腹に気を散らされない。"
 qingyi_topic_deep:0 "高遠な論題"
 qingyi_topic_deep_desc:0 "有無、名教と自然といった玄理の深奥に直接踏み込み、教えを請う者や機鋒の応酬を招きやすい。"
 qingyi_topic_plain:0 "平易な論題"
 qingyi_topic_plain_desc:0 "身近に感じられる人物や日用の理から語り起こし、交遊に有利で、角を突き合わせる争いも少ない。"
 qingyi_wine_generous:0 "酒を備えて興を添える"
 qingyi_wine_generous_desc:0 "美酒を多く用意し、賓客が麈尾を振るって存分に語るに任せる。放埒や失礼な振る舞いが生じやすい。"
 qingyi_wine_none:0 "茶をもって酒に代える"
 qingyi_wine_none_desc:0 "酒杯は置かず、茶で心を清め、言談はやや控えめになる。"
 WJ_qingyi_all_attending_guests:0 "席にいるすべての賓客"
 WJ_qingyi_guest_reward_log:0 "席にいた賓客は始めから終わりまで会に加わり、諸論と交遊の中でそれぞれ得るところがあった"
 WJ_qingyi_guest_reward_log_title:0 "賓客は満ち足りて帰る"
 WJ_qingyi_host_reward_log:0 "[CHARACTER.Custom('WJ_GetUIName')]は清議を首尾よく主催し、群賢がこれを称え、声名と清望がともに高まった"
 WJ_qingyi_host_reward_log_title:0 "主人が諸論をまとめる"
 WJ_qingyi_opening_log:0 "[CHARACTER.Custom('WJ_GetUIName')]は衣を正して席に着き、麈尾を掲げて口を開いた。今日の清議はここに始まる"
 WJ_qingyi_opening_log_title:0 "清議の開席"

