 WJ_kaoke_acknowledge:0 "考第を受け取り、得失を心に刻む。"
 WJ_kaoke_award_candidate:0 "推薦を選択済み"
 WJ_kaoke_award_legacy:0 "旧制の考賞は支給済み"
