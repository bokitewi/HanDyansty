 WJ_kaoke_award_xp:0 "宦海の研鑽を受領済み"
 WJ_kaoke_bad_opinion:0 "考課劣等、託されたことに背いた"
 WJ_kaoke_candidate_desc:0 "最近五年の考課"
 WJ_kaoke_candidate_summary:0 "\n地方の官選での加点：[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_candidate_value')|0]（本朝の直近の考第に基づく）。"
 WJ_kaoke_chosen_candidate_tt:0 "あなたの考績は有司に報告される。次の考課までの間、地方の官選であなたはより重視される。"
 WJ_kaoke_civil_gain_tt:0 "この件はあなたの考課に一つの功として記録される。"
 WJ_kaoke_civil_loss_tt:0 "この件はあなたの考課に一つの過として記録される。"
 WJ_kaoke_civil_unscored_tt:0 "この件はあなたの考課に記録されるが、功過には数えられない。"
 WJ_kaoke_close_book:0 "考課簿を閉じる"
 WJ_kaoke_current_page:0 "功過の実録に戻る"
 WJ_kaoke_current_summary:0 "今期は[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_days_value')|0]日経過、残り[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_remaining_value')|0]日。公務[ROOT.Char.MakeScope.Var('wj_kaoke_civil_count').GetValue|0]件／[ROOT.Char.MakeScope.Var('wj_kaoke_civil_points').GetValue|0]点。戦闘[ROOT.Char.MakeScope.Var('wj_kaoke_battles').GetValue|0]回、勝[ROOT.Char.MakeScope.Var('wj_kaoke_wins').GetValue|0]敗[ROOT.Char.MakeScope.Var('wj_kaoke_losses').GetValue|0]、軍功の原値[ROOT.Char.MakeScope.Var('wj_kaoke_military_points').GetValue|0]、算入[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_military_value')|0]点。吏治[ROOT.Char.MakeScope.Var('wj_kaoke_choice_count').GetValue|0]回／[ROOT.Char.MakeScope.Var('wj_kaoke_choice_points').GetValue|0]点。[ROOT.Char.Custom('WJKaokeCentral')]$WJ_ai_kaoke_superior_summary$\n今期[ROOT.Char.Custom('WJKaokeCurrentGrade')]、総点[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_score_value')|0]（基礎50を含む）。\n"
 WJ_kaoke_cycle_rules:0 "考課を受けるのは本朝の王国級以下の地方官に限る。帝国級、自立した者、封地のない者は対象外。五年に一度考課し、同じ朝廷内での転任では期間は途切れない。資格を失うか王朝が交代した場合、旧い期間は無効となって考賞は得られず、資格を回復した後に改めて五年を数える。"
 WJ_kaoke_grade_none:0 "未考課"
 WJ_kaoke_last_summary:0 "前期：[ROOT.Char.Custom('WJKaokeGrade')]、総点[ROOT.Char.MakeScope.Var('wj_kaoke_last_score').GetValue|0]。公務[ROOT.Char.MakeScope.Var('wj_kaoke_last_civil_count').GetValue|0]件／[ROOT.Char.MakeScope.Var('wj_kaoke_last_civil_points').GetValue|0]点。戦闘[ROOT.Char.MakeScope.Var('wj_kaoke_last_battles').GetValue|0]回、勝[ROOT.Char.MakeScope.Var('wj_kaoke_last_wins').GetValue|0]敗[ROOT.Char.MakeScope.Var('wj_kaoke_last_losses').GetValue|0]。吏治[ROOT.Char.MakeScope.Var('wj_kaoke_last_choice_points').GetValue|0]点。[ROOT.Char.Custom('WJKaokeLastCentral')]$WJ_ai_kaoke_last_superior_summary$\n考賞：[ROOT.Char.Custom('WJKaokeReward')]。\n"
 WJ_kaoke_legacy_history:0 "\n過去の考第は新法に従って換算済みで、これまでの賞罰は遡って改めない。"
 WJ_kaoke_no_history:0 "まだ完全な五年分の考第がない。\n"
 WJ_kaoke_open_book_tt:0 "考課簿を開き、今期の功過を確認する。"
 WJ_kaoke_poor_opinion:0 "考課差等、治事が不適切"
 WJ_kaoke_resume_reward:0 "直近の考賞を受け取る"
 WJ_kaoke_reward_candidate_choice:0 "この実績を記録し、抜擢に備えていただきたい。"
 WJ_kaoke_reward_cha:0 "あなたの考第は差等とされた。有司はあなたの治事が行き届いていないと責め、上官もあなたにかなり不満を抱いている。今後数年、あなたの俸給と賢望はいくらか足を引っ張られることになる。\n"
 WJ_kaoke_reward_liang:0 "あなたの考第は良等とされ、慣例により有司に考賞を一つ選んで請求できる。\n"
 WJ_kaoke_reward_lie:0 "あなたの考第は劣等とされた。有司はあなたの俸給を削り、吏治を正すよう命じ、上官も深く不満を抱いている。今後数年、俸給も賢望も抑えられ、仕途はおそらく好転しがたいだろう。\n"
 WJ_kaoke_reward_merit_choice:0 "善政の旌表を賜りたい。"
 WJ_kaoke_reward_ping:0 "あなたの考第は平等とされた。功もなく過もなく、賞も罰もない。\n"
 WJ_kaoke_reward_treasury_choice:0 "治所の経費を支給していただきたい。"
 WJ_kaoke_reward_xp_choice:0 "前賢の治政の法を学びたい。"
 WJ_kaoke_reward_you:0 "あなたの考第は優等とされ、慣例により有司に考賞を一つ選んで請求できる。\n"
 WJ_kaoke_rules_page:0 "どのような事が功となり、どのような事が過となるのか？"
 WJ_kaoke_scoring_rules:0 "考課は五十点を基礎とし、公務・軍功・吏治と朝廷による調整の点数を加える。軍功の増減はそれぞれ六十点を上限とする。百点以上は優、八十以上は良、五十以上は平、三十以上は差、三十未満は劣とする。\n良・優の者は考賞を一つ選んで請求できる。有司に推薦されて抜擢に備えるか、国庫の経費支給を請うか、善政の旌表を請うか、治政の法を学ぶかであり、優等はより手厚い。差・劣の者は五年の間、俸給と賢望がいずれも抑えられ、上官も不満を抱き、劣等ではそれが倍になる。既存の賢望は差し引かれず、歴代の考第も累積しない。\n"
 WJ_kaoke_settlement_end:0 "\n旧い簿はここで封印され、新たな期がまた最初から記録される。良・優を得た場合は考賞を一つ選んで請求できる。すぐに決めかねても、後日考課簿を開けば受け取れるが、次の考課を過ぎると無効になる。"
 WJ_kaoke_settlement_intro:0 "五年の任務の簿冊が一つにまとめられた。書吏が功過を項目ごとに確認し、今期の課第をあなたの前に差し出す。\n\n"
 WJ_kaoke_task_rules:0 "公務は、地方統治の任務を完了してはじめて記録され、一件につき一記録、建造工事は別に数えない。功過は選んだ処置によって決まる。軍功は、自ら統兵の指揮官または騎士として戦場に臨まねばならない。勝てば功十点、敗れれば過十点を記す。吏治は、毎年一件。職責を尽くせば功、折衷すれば増減なし、私利を図れば減点。才具が試され、成功もあれば失敗もある。\n"
 WJ_kaoke_trial_continue:0 "試守は良等に及ばず、引き続き試守を続けて次の考課を待つほかない。\n"
 WJ_kaoke_trial_maocai:0 "あなたの試守の考課は優等であり、すでに茂才に挙げられ、これより正式に仕官する。\n"
 WJ_kaoke_trial_rules:0 "あなたはまだ試守中である。良等なら孝廉に、優等なら茂才に挙げられる。良等に及ばなければ、引き続き試守して再び考課を受ける。\n"
 WJ_kaoke_trial_xiaolian:0 "あなたの試守の考課は良等であり、すでに孝廉に挙げられ、これより正式に仕官する。\n"

