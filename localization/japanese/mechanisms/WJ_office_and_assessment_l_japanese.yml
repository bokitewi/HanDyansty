 WJ_kaoke_confirm_next_date:0 "確認後、次回使用可能\n[GetCurrentDateWithDiff(GetPlayer.MakeScope.ScriptValue('WJ_kaoke_central_cooldown_days_value'))]"
 WJ_kaoke_cooldown_active:0 "次に点数を調整できる日：[GetCurrentDateWithDiff(GetVarTimeRemaining(GetPlayer.MakeScope, 'wj_kaoke_central_cooldown'))]。この制限は人物ごとに定まり、職や期が変わってもリセットされない。"
