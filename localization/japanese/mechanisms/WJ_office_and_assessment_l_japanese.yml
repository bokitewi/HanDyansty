# 汉晋风华：按类型整合；键名与现行文本保留。来源逐键见本批manifest。

 # 来源：localization/simp_chinese/WJ_ai_routes_l_simp_chinese.yml
 WJ_ai_bizhao_letter:0 "かねてより貴殿の才識は聞き及んでおります。府中にちょうど幕職の空席があり、ぜひ幕に入って共に事に当たっていただきたい。近頃は文書が机に積み上がり、属吏にはそれぞれ長所があるものの、落ち着いて相談できる人が一人欠けております。決めかねることに出会うたびに、貴殿のことを思い出すのです。\n\n数句の過褒の辞だけでお招きするつもりはありません。考えている職任と報酬は、すべて書の後に添えてあります。もし枉げてお受けくださるなら、約束どおり任に就いていただき、異議があれば面と向かってお伝えいただきたい。\n\nこの書で求めているのは、私と共に事務を担える同僚であって、席上でうなずいて褒めるだけの客ではありません。去就いかんにかかわらず、直接のご返事をいただきたく、府中は席を空けてお待ちしております。"
 WJ_ai_bizhao_role_1:0 "\n予定の幕職：[scope:actor.Custom('WJ_mufu_role_1')]。"
 WJ_ai_bizhao_role_2:0 "\n予定の幕職：[scope:actor.Custom('WJ_mufu_role_2')]。"
 WJ_ai_bizhao_role_3:0 "\n予定の幕職：[scope:actor.Custom('WJ_mufu_role_3')]。"
 WJ_ai_bizhao_role_4:0 "\n予定の幕職：[scope:actor.Custom('WJ_mufu_role_4')]。"
 WJ_ai_bizhao_role_5:0 "\n予定の幕職：[scope:actor.Custom('WJ_mufu_role_5')]。"
 WJ_ai_bizhao_strong_hook:0 "\nただし、我が幕に入れば府中の人です。今後の行いは、どうか府中のことを第一に考えていただきたい。"
 WJ_ai_kaoke_accept:0 "この金を笑納し、点数を加えてやる。"
 WJ_ai_kaoke_award:0 "官員を褒賞する"
 WJ_ai_kaoke_award_desc:0 "親しい官員の今期の政績を称え、その考課に功を一つ記す。"
 WJ_ai_kaoke_awarded:0 "[scope:actor.Custom('WJ_GetLinkedUIName')]が考課簿にあなたへの称賛を一筆記した"
 WJ_ai_kaoke_desc:0 "[scope:actor.Custom('WJ_GetLinkedUIName')]は初め職務の苦労ばかりを語り、長々と遠回りした末に、ようやく三百金をあなたの前に押し出した。「今期の課第、どうかよしなに」\n\nあなたは手を伸ばさず、まず考課簿に目をやった。求められているのは数点を加えることにすぎない。筆を数画走らせれば、どこまでが政績によるもので、どこからが目の前の厚い礼物によるものか、他人には見分けがつかなくなる。相手はあなたが答えないのを見て、さらに声を潜めた。\n\n門の外を足音が通り過ぎたようで、礼物を差し出していた手がぴたりと止まった。あなたは金を見、また課簿を見た。受け取るにせよ断るにせよ、一言で済む。ただ、いずれ誰かが古い帳簿を掘り返した時に、こうも気楽に済むとは限らない。"
 WJ_ai_kaoke_just_tt:0 "公正な官員は私情によってこの加点の願いを認めない。"
 WJ_ai_kaoke_last_superior_summary:0 "\n前期の上官の評価：[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_last_superior_value')|=+0]点。"
 WJ_ai_kaoke_personality:0 "審査者の性格：$VALUE|=+0$"
 WJ_ai_kaoke_superior_summary:0 "\n上官の評価：[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_superior_value')|=+0]点。"
 WJ_ai_kaoke_title:0 "私門への請託"
 WJ_ai_maocai_letter:0 "謹んで書を奉り、茂才に挙げていただきたくお願い申し上げます。平素事を論じても、見解が席上に留まるばかりなのを常に残念に思っておりました。今は任用の選に列し、学んだことを実際の政務に試してみたく、ゆえにありきたりの挨拶でこの来意を覆い隠すことはいたしません。\n\n才具のほどは明公のご審察を待たねばならず、私も何でもこなせるなどと予言するつもりはありません。ただ、一度も試す機会を得られなければ、今後たとえ得失があっても、人に知らせる術がないのです。\n\n議すべき報酬は書の後に添えておりますので、ご裁量を賜りたく存じます。推挙をいただければ力を尽くして任に当たります。お許しいただけなければ、それもはっきりお告げください。世の道は容易ではありません。今日この願いを書き出したのは、もはや他人がたまたま思い出してくれるのを待つだけではいたくないからです。"
 WJ_ai_offer_gold:0 "\n書の後には別に一枚の礼物目録が添えられ、ささやかな気持ちを表している。"
 WJ_ai_offer_hook:0 "\nもしお許しを賜れば、このご恩は必ず胸に刻み、後日何かお頼みがあれば、決してお断りいたしません。"
 WJ_ai_xiaolian_letter:0 "謹んで書を奉り、孝廉に挙げていただきたくお願い申し上げます。この件は人に頼んで婉曲に申し述べることもできましたが、再三考えた末、やはり自ら明らかに書くことにいたしました。平素守り学んできたもので、仕官への道が一筋得られればと願っております。\n\n郷里の評判がすべて良いものだとは申しません。疑わしい点があれば、喜んでお尋ねを受けます。ただ、長く待てども門は開かず、任に当たる心があっても自ら達することは難しく、ゆえに失礼を顧みず書を奉り、お目に留めていただきたく存じます。\n\n議すべき報酬は後に添えておりますので、明公にあわせてご裁量いただきたく存じます。推挙を賜れば知遇の恩を忘れません。今はお許しいただけないのであれば、それもご返事を賜り、日々待ち続けて進退も分からぬということのないようお願いいたします。"

