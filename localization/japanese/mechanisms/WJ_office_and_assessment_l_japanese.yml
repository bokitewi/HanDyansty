 WJ_bizhao_recruit_desc:0 "[recipient.Custom('WJ_GetLinkedUIName')]を自らの幕府に招き、選んだ空席の幕職に就かせる。"

 # 来源：localization/simp_chinese/WJ_kaoke_assessment_additions_l_simp_chinese.yml
 WJ_kaoke_active_disfavor_opinion:0 "考課での抑圧"
 WJ_kaoke_active_favor_opinion:0 "考課での引き立て"
 WJ_kaoke_trial_notice_maocai:0 "試守の評定が下った。優等に列せられ、茂才に挙げられたのだ。あなたは文書を二度読み、ようやく本当に理解した。これまでの、なお試されるべき身分に、今日ついに決着がついたのだと。\n\n今後任に当たるにも、なお自ら功過を負わねばならず、一枚の出身証書を頼みに何にでも通じていると思い込むわけにはいかない。だがこの数年行ってきたことは無駄ではなく、この承認があれば、政務を尋ねに来る人々にもより堂々と向き合える。あなたは文書をしまい、再び机に向かって、為すべき事を処理し始めた。"
 WJ_kaoke_trial_notice_title:0 "試守の考成"
 WJ_kaoke_trial_notice_xiaolian:0 "試守は良等と評され、孝廉に挙げられた。文書を届けた者は読み終えても、なお傍らであなたの返事を待っていたが、あなたはまず記された評語を初めからもう一度読み返した。\n\nそこには褒める言葉もあれば貶す言葉もある。試守もここに至り、ようやく同じ身分のまま次の試練を待たずに済むようになった。だが正式に仕官できることと、今後一つ一つの事をうまく処理することの間には、まだ多くの手間が隔たっている。あなたは文書をしまい、来た者に手元の事務の報告を続けさせた。"

 # 来源：localization/simp_chinese/WJ_kaoke_central_l_simp_chinese.yml
 WJ_kaoke_case_arrest:0 "律に従って収捕し、獄に下して罪を問う。"
 WJ_kaoke_case_desc:0 "[wj_kaoke_offender.Custom('WJ_GetLinkedUIName')]が私情で考課の案巻を改ざんした件が、ついにあなたの机に上がった。書吏がいくつかの塗り直された箇所を指して読み上げるのを半ばまで聞いたところで、あなたはその頁を平らに広げさせ、自ら改めて目を通した。\n\n証拠は確かであり、どう処置するかはすべてあなたの一言にかかっている。網の一面を開いて寛大に扱うもよし、獄に下して罪を問うもよし、あるいはひとまず案件を預かり、後日に回すもよい。ただ、課簿の書き換えられた評語も、とうに人手に渡った金も、この一言の処分で元に戻るわけではない。"
 WJ_kaoke_case_dismiss:0 "案巻はひとまず保管し、後で改めて議する。"
 WJ_kaoke_case_forgive:0 "これまでの労を思い、ひとまず赦す。"
 WJ_kaoke_case_title:0 "考課不正事件"
 WJ_kaoke_central_negative:0 "\n中央朝廷からの不満 −[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_central_abs_value')|0]点。"
