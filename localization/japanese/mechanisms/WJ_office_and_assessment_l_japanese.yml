 WJ_LUZHI_DESC_CHU_NO_ROAD:0 "あなたは官職に就いておらず、辟召・孝廉・茂才の出身もないため、[wj_chushi|E]である。賢望は将来就ける官の上限を引き上げるにすぎない。まず仕官の出身を得て、さらに任命を受けてはじめて[wj_luyi|E]が生じる。"
 WJ_LUZHI_DESC_CHU_WITH_ROAD:0 "あなたはすでに仕官の出身を持っているが、現在は官職に就いていないため、なお[wj_chushi|E]の身分で朝野に身を置いている。下に示す賢望による任官上限は、あなたが任じられうる最高の範囲にすぎない。任命を受けてはじめて、官職に応じて[wj_luyi|E]が定まる。"
 WJ_LUZHI_DESC_OFFICIAL:0 "あなたは現在[Character.Custom('WJ_BandWord')]であり、これはあなたが就いている最高の官職に応じて定まる[wj_luyi|E]である。仕官の出身は官選の対象に入れるかどうかを決め、賢望は任じられうる最高の範囲を決める。どちらも官職を越えて、あなたの禄秩を直接変えることはできない。"
 WJ_LUZHI_DESC_SHI_NO_ROAD:0 "あなたは現在官職に就いておらず、辟召・孝廉・茂才の出身もまだない。土地なし士族であるため[wj_shizu|E]と表示されるが、士族という名は官職でも禄秩でもない。まず仕官の出身を得て、さらに任命を受けてはじめて、官職に応じて[wj_luyi|E]が定まる。"
 WJ_LUZHI_DESC_SHI_WITH_ROAD:0 "あなたはすでに仕官の出身を持っているが、現在は官職に就いていない。土地なし士族であるため[wj_shizu|E]と表示される。下に示す賢望による任官上限は、あなたが任じられうる最高の範囲にすぎない。任命を受けてはじめて、官職に応じて[wj_luyi|E]が定まる。"
 WJ_LUZHI_DESC_SHOU:0 "あなたはすでに官職に就いているが、辟召・孝廉・茂才の出身がまだないため、暫定的に[wj_shishou|E]として職務に当たるほかなく、この職に本来伴う[wj_luyi|E]は得られない。下に示す賢望による任官上限は、声望が許す最高の範囲にすぎず、現在の禄秩ではない。試守を一年満了して考課に合格すれば仕官の出身を得て、その時に就いている官職に応じて正式に秩が定まる。"
 WJ_road_heading_hanjin:0 "仕官の途"
 WJ_tooltip_explain_hanjin:0 "[wj_luyi|E]は就いている官職の品秩であり、[wj_mingwang|E]は士林における声望である。両者を混同してはならない。"
