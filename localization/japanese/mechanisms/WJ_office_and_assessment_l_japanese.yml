 WJ_kaoke_last_central_negative:0 "\n前期の中央朝廷からの不満 −[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_last_central_abs_value')|0]点。"
 WJ_kaoke_last_central_positive:0 "\n前期の中央朝廷からの評価 +[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_last_central_abs_value')|0]点。"
 WJ_kaoke_malpractice_opinion:0 "考課での私情による不正"
 WJ_kaoke_malpractice_secret:0 "考課での私情による不正"
 WJ_kaoke_malpractice_secret_desc:0 "[TARGET_CHARACTER.Custom('WJ_GetLinkedUIName')]の配下の官員の考課を私情で改ざんしたことがある。"
 WJ_kaoke_malpractice_secret_tooltip_desc:0 "[CHARACTER.Custom('WJ_GetLinkedUIName')|U]は中央の考課を私情で改ざんしたことがある。"
 WJ_kaoke_malpractice_secret_type_desc:0 "このキャラクターは中央の職権を利用し、私情で官員の考課を改ざんした。"
 WJ_kaoke_request_20:0 "今期の考課 +20点"
 WJ_kaoke_request_30:0 "今期の考課 +30点"
 WJ_kaoke_request_50:0 "今期の考課 +50点"
 WJ_kaoke_request_burden_reason:0 "要求された考課の加点"
 WJ_kaoke_request_gain_20_tt:0 "今期の考課に#P 20#!点を加える"
 WJ_kaoke_request_gain_30_tt:0 "今期の考課に#P 30#!点を加える"
 WJ_kaoke_request_gain_50_tt:0 "今期の考課に#P 50#!点を加える"
 WJ_kaoke_request_one_score_tt:0 "加点の段階を一つだけ選ばなければならない"
 WJ_kaoke_request_options:0 "加点の段階を一つ選び、さらに見返りを添えることもできる"
 WJ_kaoke_request_period_tt:0 "あなたは今期の考課の対象であり、かつ今期まだ請託に成功していないこと"
 WJ_kaoke_request_secret_known_tt:0 "あなたは相手の私情による不正の弱みを握ることになり、今期はもう請託できない"
 WJ_kaoke_request_secret_owner_tt:0 "考課不正の秘密を一つ背負い、それを請託者に知られる"
 WJ_kaoke_request_willingness_tt:0 "相手がこの件を引き受ける意思を持っていなければならない"
 WJ_kaoke_result_desc:0 "書吏が最後の一頁の考課簿を差し出した。あなたが改めた箇所はすべて簿に書き写されている。あなたは目を通して巻を収めるよう合図したが、彼は封印する前にもう一度名前を照合した。\n\n筆による改変は結局痕跡を残す。各官の考賞は、それぞれが任期満了を迎えるのを待たねばならない。後日誰かがこれらの評語の由来を問いに来るかどうか、今は誰も口にしない。文書が持ち去られると、机の上は急にがらんとした。これから数年、この課簿にあなたが手を加えるのは差し控えるべきだろう。"
 WJ_kaoke_result_emperor_desc:0 "最後の一冊の考課簿も揃った。書吏は改められた箇所を一人ずつ読み上げ、ある名前のところで手を止めてあなたを見た。まるであなたの顔からもう一言確かな言葉を引き出そうとするかのように。\n\nあなたは定まった記録どおりに簿に収めさせ、それ以上問う必要はないと告げた。遠く州県にいる者たちはまだ知らないが、後日の課第には今日の御前でのこの一筆がすでに加えられている。正式な考賞は、なお各官の任期満了を待つ。これから数年、あなたが自ら課簿に関与するのは差し控えるべきだろう。"
 WJ_kaoke_result_title:0 "課簿の保管"
 WJ_kaoke_result_ack:0 "簿を封じて保管する。"

