 # 来源：localization/simp_chinese/WJ_conquest_l_simp_chinese.yml
 WJ_conquest_accepted_desc:0 "征討の命はすでに奉行した。我はすでに[secondary_recipient.Custom('WJ_GetLinkedUIName')]治下の[target.GetName]に宣戦した。謹んでまずお知らせ申し上げる。\n\n軍令がすでに出た以上、糧秣と諸部の進退はすべて敵情に応じて采配せねばならない。使者が出立する時、軍中の事務はまさに繁忙であり、この出師の報せを、まだ捷報として書くことはできない。この後の得失は、順次奏聞いたす所存である。\n\n得た地は、征討の制度に従って朝廷に帰する。兵を率いる責をすでに担った以上、もはや明確な命を奉じていないことを言い訳にはせぬ。"
 WJ_conquest_acknowledge:0 "承知した。"
 WJ_conquest_commission_accept_tt:0 "この戦に勝てば、[target.GetNameNoTier]は朝廷に帰属する。"
 WJ_conquest_commission_decline_tt:0 "命に背いて出陣しなければ、朝廷で取り沙汰されるのは避けられない。"
 WJ_conquest_commission_proposal:0 "部隊を率いて[target.GetNameNoTier]を征討せよ。得た地は朝廷に帰属する。"
 WJ_conquest_declined_desc:0 "征討の命は受け取った。再三考えたが、今回はやはりお受けすることはできず、謹んでまず書をもって明らかにお伝えする。\n\n軍の前で長く待たせるべきでないことは承知しており、辞退の言葉もいくらか婉曲に書こうと思った。だがいかに言葉を重ねても、結局この書簡とともに兵馬が出発することはない。朝廷にまだ準備中だと誤解させるよりは、出陣できぬことを先に申し上げるほうがよい。\n\nこたびの征討は、どうか別に手配され、我が命に応じるのを待たれぬよう。使者が速やかに届け、本来の配置が我のせいでさらに遅れることのないよう願う。"
 WJ_conquest_invalid_desc:0 "本来なら軍の前へ送るはずだった文書が、またあなたの机に戻ってきた。属官がいくつかの名目を指して説明する。往復する間に、節制の関係も目標もすでに変わってしまい、この征討の命は今となっては実行できないのだという。\n\nあなたはもう一度説明させ、聞き終えてようやく文書を置いた。先の勢いはとうに広く知れ渡っているが、兵はそのために動いてはいない。なおも旧令どおりに催促すれば、下からはおそらく同じ差し戻しの文書がまた上がってくるだけだろう。\n\nあなたは元の議案の横に「取りやめ」の二字を書き込んだが、視線はなおも果たせなかった目標に留まっていた。そのために費やした威信はもう取り戻せず、この件はしばらく蒸し返すのも難しい。別の手を考えるほかない。"
 WJ_conquest_invalid_title:0 "征討の取りやめ"
 WJ_conquest_no_target_tt:0 "都督に任じられた者の管轄は、境外のいずれかの公国と接していなければならない"
 WJ_conquest_reply_opening:0 "[recipient.Custom2('AppropriateGreetingPositive', ROOT.Char)]"

