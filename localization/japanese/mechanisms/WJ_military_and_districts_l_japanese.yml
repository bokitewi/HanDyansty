 # 来源：localization/simp_chinese/WJ_district_expansion_l_simp_chinese.yml
 WJ_dd_custom_name_1:0 "[ROOT.Title.GetHolder.GetLocalizedText('wj_dd_custom_name_1')]"
 WJ_dd_custom_name_2:0 "[ROOT.Title.GetHolder.GetLocalizedText('wj_dd_custom_name_2')]"
 WJ_dd_petition_acceptance_tt:0 "天子のあなたへの信任と、あなたの武勲・資望が、願い出た節に見合うものでなければならない。仮節が最も容易で、持節がこれに次ぎ、使持節が最も難しい。区の拡大の願いは持節と同等である。忠誠な者や天子と同宗の者はより認められやすく、不忠な者は認められにくい"
 WJ_dd_petition_approve:0 "制して曰く、可なり。請うところに依れ。"
 WJ_dd_petition_approved_opinion:0 "上奏が許可された"
 WJ_dd_petition_create_letter:0 "臣の率いる一方の軍務は、しばしば隣境の諸軍と関わり合います。将士はそれぞれ統属を異にしておりますが、道路と守備は截然と分けがたく、急事に遭うたびに改めて人を遣わして往復して指示を仰いでは、援応がしばしば遅れます。\n\n謹んで、臣の率いる軍府を中核として都督を置き、州郡の諸軍事を督させ、併せて旄節を授け、臣が軍務を統括できるようにしていただきたく存じます。\n\nもしお許しを賜れば、臣は授けられた権を謹んで守り、軍に臨む任を家業と見なすことは決していたしません。施行の可否、伏して御裁定をお待ち申し上げます。"
 WJ_dd_petition_create_letter_1:0 "$WJ_dd_petition_create_letter$\n\n臣、畏れながら仮節の授与を願い奉ります。"
 WJ_dd_petition_create_letter_2:0 "$WJ_dd_petition_create_letter$\n\n臣、畏れながら持節の授与を願い奉ります。"
 WJ_dd_petition_create_letter_3:0 "$WJ_dd_petition_create_letter$\n\n臣、畏れながら使持節の授与を願い奉ります。"
 WJ_dd_petition_decline:0 "この議は許さず、旧制を守る。"
 WJ_dd_petition_declined_opinion:0 "上奏が却下された"
 WJ_dd_petition_expand_letter:0 "臣の率いる都督区は[scope:wj_dd_petitioner.MakeScope.Var('wj_dd_petition_target').Char.Custom('WJ_GetLinkedUIName')]の管轄と境を接しております。近頃、防守と援応を議するたびに区をまたいで往復せねばならず、軍令と道路の両立が困難です。\n\n謹んで、その者が率いる州郡のうち、本区と連なり、かつ他の区に入っていないものを併せて臣の節制に帰し、統一して采配できるようにしていただきたく存じます。この議は軍務の統属に関わるのみで、封土には関わりません。\n\n願い出るところはこれに尽きます。伏して御許可をお待ち申し上げます。もし不適当とお考えなら、臣は引き続き現在の管轄を守って職を尽くします。"
 WJ_dd_qinwang_gate:0 "天子が支援を受けられる戦争の主導者であり、十分な影響力・威信・正統性を有していなければならない。この人物は本朝の現任都督で、かつ参戦可能でなければならない"
 WJ_dd_rename_desc:0 "あなたは筆を執り、この都督区に別の名号を考える。新しい名は都督区の簿冊に記されるのみで、管轄と統属は変わらない。後日都督が交代しても、この名はそのまま残る。\n\n#weak 区名の横の改名アイコンを右クリックすると、元の呼び名に戻せる。#!"
 WJ_dd_rename_title:0 "都督区名の改定"
 WJ_dd_reset_name:0 "名を戻す"

