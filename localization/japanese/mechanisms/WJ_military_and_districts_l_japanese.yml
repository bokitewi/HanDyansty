 # 来源：localization/simp_chinese/WJ_sili_l_simp_chinese.yml
 WJ_celestial_province_sili:0 "@WJ_sili_administration!司隷"
 WJ_celestial_province_sili_benefits:0 "#emphasis #bold 官員へのボーナス：#!#!\n$EFFECT_LIST_BULLET$直轄地の税収#P +15%#!、開発度の成長#P +15%#!\n$EFFECT_LIST_BULLET$[GetLaw('celestial_military_appointment_succession_law').GetName]を用い、爵級に応じて称号兵を保有する\n$EFFECT_LIST_BULLET$納めた税と称号兵に応じて賢望を得る\n\n#alert_trial @alert_icon!同じ天朝に最大一人まで。京師のある王国を保有していなければならない。#!"
 WJ_celestial_province_sili_desc:0 "#low 京畿は繁栄し、百官が集う。司隷は京畿の統治と軍事を兼ね掌り、利を興し民を安んじ、朝廷を護衛することを任とする。#!"
 WJ_celestial_province_sili_short:0 "司隷"
 WJ_celestial_province_sili_text_icon:0 "@WJ_sili_administration!"
 WJ_sili_arrest_reserved_tt:0 "朝廷はまだ司隷に収捕の権を許していない"
 WJ_sili_capital_kingdom_required_tt:0 "天朝の成人した地方官であり、かつ京師のある王国を保有していなければならない（主称号である必要はない）"
 WJ_sili_office_husband:0 "司隷校尉の夫"
 WJ_sili_office_title:0 "司隷校尉"
 WJ_sili_office_wife:0 "司隷校尉夫人"
 WJ_sili_realm_suffix:0 "司隷"
 WJ_sili_unique_tt:0 "本朝に他の司隷がいないか、この人物がすでに本朝の司隷である。"

 WJ_mr_grant_opening:0 "軍職の授命"
 WJ_mr_grant_letter_desc:0 "[ROOT.Char.Custom('WJ_GetLinkedUIName')]：\n\n今、汝に[ROOT.Char.Custom('WJMRName')]の号を授ける。職任を恪守し、軍旅を整え、託されたことに背くなかれ。"
 WJ_mr_grant_acknowledge:0 "謹んで命を奉じます。"
