 WJ_dd_remove_connected_tt:0 "この王国を外した後も、残りの管轄区が都督の治所と連なっていなければならない"
 WJ_dd_ui_rules:0 "都督の軍法は直属か否かを問わず本区の武官にのみ及ぶ。文官も区に入って援助を求められる。朝廷と敵対している間は、朝廷の名を借りて天子に忠実な官員を動員・処置できない。"

