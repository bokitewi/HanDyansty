 # 来源：localization/simp_chinese/WJ_military_transfer_l_simp_chinese.yml
 wj_district_management_filter_tag_desc:0 "管轄区の武官の軍務と兵籍の調度"
 wj_military_transfer_filter_tag_desc:0 "兵籍調度の転出側と受入側を選定する"
 WJ_mt_chance_base:0 "基本意欲：#P +50#!"
 WJ_mt_chance_factors:0 "転出側のあなたへの好感度：[GetPlayer.MakeScope.ScriptValue('WJ_mt_opinion_score')|+=0]\n親族・友人・門生・僚属：[GetPlayer.MakeScope.ScriptValue('WJ_mt_trust_score')|+=0]\n怨恨：[GetPlayer.MakeScope.ScriptValue('WJ_mt_hostility_score')|+=0]\n軍権と命令拒否の結果：[GetPlayer.MakeScope.ScriptValue('WJ_mt_authority_score')|+=0]\n転出側の現在の戦争：[GetPlayer.MakeScope.ScriptValue('WJ_mt_war_score')|+=0]\n今回の転属待ち連隊数：[GetPlayer.MakeScope.ScriptValue('WJ_mt_count_score')|+=0]\n転出兵力の割合：[GetPlayer.MakeScope.ScriptValue('WJ_mt_fraction_score')|+=0]\n\n転出側の意欲は最低5%、最高95%。"
 WJ_mt_chance_header:0 "#T 受諾確率：[GetPlayer.MakeScope.Var('wj_mt_chance').GetValue|0]%#!"
 WJ_mt_chance_self:0 "自分の連隊を転出する：#P 必ず受諾#!\nただし兵源・称号・軍権・国庫がすべて足りていなければならない。"
 WJ_mt_confirm_requires:0 "転出・受入の称号と、少なくとも一つの転属待ち連隊を選び、かつ軍権・兵源・国庫がすべて足りていなければならない。"
 WJ_mt_copy_failed:0 "新たな軍籍を編成できず、兵の調発は取りやめとなった。元の兵はそれぞれ本営に戻り、国庫は一銭も支出せず、これによって罪に問われる者もいない。"
 WJ_mt_declined_desc:0 "[scope:wj_mt_source.Custom('WJ_GetLinkedUIName')]は兵の調発の命に従わず、一兵一卒も動かなかった。命に背いた者が天子本人でない限り、軍法違反として処断されるべきである。"
 WJ_mt_declined_title:0 "移軍の令は奉じられなかった"
 WJ_mt_invalid_desc:0 "人選・称号・兵源・軍権が変化したか、国庫が不足しているため、調令は実行できず、これによって罪に問われる者もいない。先に考えた人選は併せて取り消されたので、改めて選定しなければならない。"
 WJ_mt_invalid_title:0 "調令は実行できなかった"
 WJ_mt_need_pair:0 "まずキャラクターのインタラクションメニューで転出側と受入側を選定しなければならない。二人ともあなたの軍権の及ぶ範囲内にいなければならない。郡国兵は両端とも公爵以上でなければならない。部曲は伯爵から転出できる。"
 WJ_mt_order_menu:0 "兵籍調度"
 WJ_mt_person_gate:0 "あなたが現在調度する権限を持つ本朝の人物を選ぶ。"
 WJ_mt_hanjin_tt:0 "郡国制の統治形態を採用していなければならない。"
 WJ_mt_authority_role_tt:0 "あなたは本朝の天子、都督中外、または在任中の地方都督でなければならない。"
 WJ_mt_baton_tt:0 "地方都督は仮節・持節・使持節のいずれかを持っていなければならない。"
 WJ_mt_settled_district_tt:0 "都督区はまだ設置中であり、確定を待たねばならない。"
 WJ_mt_no_rebellion_tt:0 "地方都督は最高主君と交戦中に兵を調発できない。"
 WJ_mt_has_command_tt:0 "選んだ人物は領地を持つか、郡国兵を保持できる公爵以上の実職称号を持っていなければならない。"
 WJ_mt_same_realm_tt:0 "選んだ人物はあなたと同じ最高主君の管轄に属していなければならない。"
 WJ_mt_central_target_tt:0 "中央の調度では、本人・皇帝・本朝の武官のみ選択できる。"
 WJ_mt_local_military_tt:0 "地方都督は本人または本区の武官のみ選択できる。"
 WJ_mt_local_district_tt:0 "選んだ武官はあなたの都督区に属していなければならない。"
 WJ_mt_local_tier_tt:0 "使持節は州級以下の武官を、持節は郡級以下を調度できる。仮節はさらに戦争中であることが必要。"
 WJ_mt_title_tier_tt:0 "郡国兵の転出側および二種の受入側は、公爵以上の称号を持っていなければならない。"
 WJ_mt_success_desc:0 "[scope:wj_mt_source.Custom('WJ_GetLinkedUIName')]が出した軍は命に従って[scope:wj_mt_receiver.Custom('WJ_GetLinkedUIName')]の麾下に編入され、旧い兵籍はそれに伴い抹消された。部曲の改編であった場合、国庫はすでに元の主に補償を支払っている。"
 WJ_mt_success_title:0 "軍籍は定まった"
