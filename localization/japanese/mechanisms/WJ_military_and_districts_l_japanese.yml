 # 来源：localization/simp_chinese/WJ_district_orders_l_simp_chinese.yml
 WJ_dd_action_execute:0 "即刻斬首し、旗に血を祭る"
 WJ_dd_action_execute_tt:0 "戦時の使持節都督であり、対象が本区で軍法の罪を犯した官員でなければならない。仮黄鉞の者は平時には全朝の官員に、戦時にはさらに本朝の諸封臣と朝臣に及ぶ。天子と摂政は対象外"
 WJ_dd_action_force:0 "軍法違反を宣告する"
 WJ_dd_action_force_tt:0 "戦時の使持節都督であり、対象が本区の官員でなければならない。仮黄鉞の者は平時には全朝の文武官に、戦時にはさらに本朝の諸封臣と朝臣に及ぶ。天子と摂政は対象外。対象は投獄されておらず、まだ軍法の罪名がないこと"
 WJ_dd_action_justice:0 "廷尉に引き渡して拘留する"
 WJ_dd_action_justice_tt:0 "対象は本朝の軍法の罪を犯し、あなたの旄節または黄鉞の及ぶ範囲内にあり、かつ投獄されていないこと。本朝の廷尉が職務を執れること。仮節の者は戦時のみ実行可能"
 WJ_dd_action_self:0 "本府で拘留する"
 WJ_dd_action_self_tt:0 "戦時の使持節都督であるか、黄鉞を持っていなければならない。対象は範囲内にあり、本朝の軍法の罪を犯し、かつ投獄されていないこと"
 WJ_dd_cancel:0 "取消／軍令は失効した"
 WJ_dd_jie_acceptance_reason:0 "都督の旄節の威"
 WJ_dd_order_invalid_desc:0 "軍令が発せられた時点で、官職・管轄区・旄節または戦局がすでに変化しており、この命令は実行できなかった。天子と敵対している間は、朝廷の名を借りて天子に忠実な官員を処置することもできない。"
 WJ_dd_order_invalid_title:0 "軍令は執行できなかった"

