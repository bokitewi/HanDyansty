# 汉晋风华：按类型整合；键名与现行文本保留。来源逐键见本批manifest。

 # 来源：localization/simp_chinese/WJ_contract_privileges_l_simp_chinese.yml
 WJ_chijie:0 "持節"
 WJ_chijie_desc:0 "#emphasis 特権：#!\n$EFFECT_LIST_BULLET$平時・戦時を問わず、本区の公爵級以下の官員を節制できる\n$EFFECT_LIST_BULLET$区内の援軍を徴召でき、命を受けた者は期日どおりに出兵しなければならない\n$EFFECT_LIST_BULLET$軍法を犯した者を廷尉に引き渡して拘留できる\n$EFFECT_LIST_BULLET$本区の称号兵を配置転換し、私兵を改編できる$WJ_mt_jie_transfer_rules$\n\n#flavor 持節の者は、平時・戦時ともに諸将を節制でき、その権は仮節に勝る。#!"
 WJ_chijie_short:0 "持節"
 WJ_huangyue_grant:0 "仮黄鉞を授ける"
 WJ_huangyue_grant_desc:0 "#emphasis 特権：#!\n$EFFECT_LIST_BULLET$平時は全朝の王国級以下の文武官員に軍法を行える\n$EFFECT_LIST_BULLET$戦時は本朝のすべての封臣と朝臣に及ぶ。ただし天子と摂政本人は除く\n$EFFECT_LIST_BULLET$直ちに罪を定め、拘留し、さらには投獄を経ずに斬って旗に血を祭ることもできる\n$EFFECT_LIST_BULLET$都督中外諸軍事と同時に授けられ、同時に罷免される。摂政の位を失えば、直ちに回収される\n\n#flavor 黄鉞はもとは天子の鉞である。これを臣に仮すのは、天子に代わって軍法を行い、誅罰を専らにすることを許すということである。#!"
 WJ_huangyue_grant_short:0 "仮黄鉞"
 WJ_huangyue_none:0 "仮黄鉞なし"
 WJ_huangyue_none_desc:0 "#flavor 仮黄鉞はない。この権は詔を奉じて中外諸軍事を総督する時に併せて授けられるもので、別に契約を改めて開くことはできない。#!"
 WJ_huangyue_none_short:0 "未授与"
 WJ_jiajie:0 "仮節"
 WJ_jiajie_desc:0 "#emphasis 特権：#!\n$EFFECT_LIST_BULLET$戦時に本区の公爵級以下の官員を節制できる\n$EFFECT_LIST_BULLET$区内の援軍を徴召できる\n$EFFECT_LIST_BULLET$軍法を犯した者を廷尉に引き渡して拘留できる\n$EFFECT_LIST_BULLET$本区の称号兵を配置転換し、私兵を改編できる$WJ_mt_jie_transfer_rules$\n\n#flavor 仮節の者は、軍中にあり、かつ戦時に限って、諸将を節制できる。#!"
 WJ_jiajie_short:0 "仮節"
 WJ_kaifu_grant:0 "開府を授ける"
 WJ_kaifu_grant_desc:0 "#emphasis 特権：#!\n$EFFECT_LIST_BULLET$府を開いて僚属を置き、士人を辟召して幕に入れることができる\n$EFFECT_LIST_BULLET$後日たとえ公府の職を退いても、資格がある限り、この特授は引き続き保持される\n\n#flavor 開府の者は、自ら長史・掾属を置くことができ、さながら朝中のもう一つの小さな朝廷である。#!"
 WJ_kaifu_grant_short:0 "開府"
 WJ_kaifu_none:0 "開府の特授なし"
 WJ_kaifu_none_desc:0 "#flavor 開府の特授を受けていない。三公・大将軍などの六職にある場合は、なお職に依って開府できる。#!"
 WJ_kaifu_none_short:0 "特授なし"
 WJ_kaifu_office:0 "在任開府"
 WJ_kaifu_office_grant:0 "六職在任による開府"
 WJ_kaifu_office_grant_desc:0 "#flavor 大将軍・太傅・丞相・司徒・司空・太尉は、在任中は開府を得られ、職を去れば罷められる。#!"
 WJ_kaifu_office_grant_short:0 "在任開府"
 WJ_kaifu_office_none:0 "在任開府なし"
 WJ_kaifu_office_none_desc:0 "#flavor 六職に就いておらず、職に依って開府する権はない。#!"
 WJ_kaifu_office_none_short:0 "在任開府なし"
 WJ_mt_jie_transfer_rules:0 "\n$EFFECT_LIST_BULLET$兵の調発は本区内に限る。調発を受けた者が命に背いて従わなければ、軍法によって罪を論じる"
 WJ_privilege_kaifu_locked_tt:0 "六職にある者は職に依って開府し、変更できない。別途特授された開府は引き続き保持される"
 WJ_privilege_kaifu_rank_tt:0 "本朝の現任朝臣であるか、王国級以上の地方長官でなければならない"
 WJ_privilege_sanjie_eligible_tt:0 "現任の都督でなければならない。旄節は都督区設立時に初めて授けられなければならない"
 WJ_privilege_six_offices_tt:0 "大将軍・太傅・丞相・司徒・司空・太尉の在任者にのみ仮黄鉞を授けられる"
 WJ_sanjie_none_desc:0 "#flavor 都督に任じられておらず、節制の権を専らにすることはできない。旄節は都督区設立時に初めて授けられ、その後に限り授け直すことができる。#!"
 WJ_shichijie:0 "使持節"
 WJ_shichijie_desc:0 "#emphasis 特権：#!\n$EFFECT_LIST_BULLET$平時・戦時を問わず、本区の王国級以下の官員を指揮できる\n$EFFECT_LIST_BULLET$本区の称号兵を配置転換し、私兵を改編できる$WJ_mt_jie_transfer_rules$\n$EFFECT_LIST_BULLET$戦時は直ちに罪を定めることができるが、[tyranny|E]と[dread|E]を招く\n$EFFECT_LIST_BULLET$罪ある者は廷尉に引き渡すことも、自ら投獄することも、即座に斬って旗に血を祭り軍威を振るうこともできる\n$EFFECT_LIST_BULLET$定めた軍法の罪は、戦後も自然には消えない\n\n#flavor 使持節の者は、節鉞を手にし、軍中に命令を犯す者があれば、先に斬って後に奏することができる。#!"
 WJ_shichijie_short:0 "使持節"

 # 来源：localization/simp_chinese/WJ_province_boundary_l_simp_chinese.yml
 WJ_province_type_closed_hanjin_tt:0 "漢制には監・都会・都護の設置はなく、郡県・軍戍・司隷のみがある。"

 # 来源：localization/simp_chinese/WJ1_laws_l_simp_chinese.yml

 WJ_zhoumu:0 "[wj_zhoumu|E]"
 WJ_zhoumu_none:0 "刺史のまま"
 WJ_zhoumu_none_short:0 "刺史"
 WJ_zhoumu_none_desc:0 "軍戍の旧任に従い、引き続き刺史として州を治める。州牧の増俸と兵額は享受しない。"
 WJ_zhoumu_grant:0 "州牧への抜擢"
 WJ_zhoumu_grant_short:0 "州牧"
 WJ_zhoumu_grant_desc:0 "#emphasis 特権：#!\n$EFFECT_LIST_BULLET$俸給と称号兵の兵額が増える\n$EFFECT_LIST_BULLET$天子はその権勢を警戒する\n$EFFECT_LIST_BULLET$都督の権は兼ねず、節鉞・開府・軍職も付随しない\n$EFFECT_LIST_BULLET$本人が自ら願い出る場合は、天子に対する[hook|E]を用いねばならない。天子が自ら授ける場合は不要\n\n#flavor 刺史から州牧となれば、俸禄はより厚く、兵額はより多くなる。天子はそれを見て、どうしても忌み憚る心を抱く。#!"
 WJ_zhoumu_eligible_tt:0 "漢晋天朝の王国級の地方軍戍官員であり、朝臣でも士族の家長でもなく、かつ皇帝の首都が属する法理上の王国を保有していないこと"
 WJ_zhoumu_batch_tt:0 "抜擢は本朝の皇帝が処理しなければならず、申請者は州牧の資格を満たしていなければならない。同時の修正で非軍戍の契約に変えることはできない"
 WJ_zhoumu_hook_tt:0 "自ら州牧を願い出るには、あなたが持つ天子への[hook|E]を用いねばならない"
 WJ_zhoumu_imperial_distrust:0 "州牧の権重し"
