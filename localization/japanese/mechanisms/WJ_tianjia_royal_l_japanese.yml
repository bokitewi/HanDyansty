 SanGong_DianZhang.015.a:0 "主者施行せよ"
 SanGong_DianZhang.015.b:0 "臣ら頓首して詔を奉ず"
 SanGong_DianZhang.015.desc:0 "儲嗣冊立の詔文が[taizi.GetName]の名に差しかかったとき、その場の幾人かが申し合わせたように顔を上げた。それまでの長々しい礼辞は、ここに至ってようやく落ち着き所を得たかのようであった。\n\nこれより東宮の名分はこの名に結びつけられる。今日それを聞いた者は、明日にはそれをさらに多くの場所へ運んでいくだろう。宗廟の継承を思う者もあれば、もっと身近なことを考える者もいるかもしれない。\n\n読み上げる声は変わらず平静であったが、周囲の顔つきはもはや先ほどと同じではなかった。あなたには分かっていた。一つの名が儲位の前に置かれたとき、まだ起きてもいない多くの事を、すでに待ち始める者がいるのだと。"
 SanGong_DianZhang.015.t:0 "太子冊立の詔"
 SanGong_DianZhang.018.a:0 "詔書が下り、東宮はついに空いた。"
 SanGong_DianZhang.018.desc:0 "儲嗣廃黜の詔命はすでに頒布され、[taizi.GetName]はもはや太子として東宮に住まうことはない。詔を伝える者が読み終えると、あたりはしばし誰も声を発さず、その数文字はなお宙に浮いているかのようであった。\n\nあなたは周囲を一瞥した。目を伏せる者もいれば、口を開きかける者もいたが、結局誰も何も言わなかった。これまで儲位をめぐって生じた親疎も、これからは様変わりするだろう。\n\n詔書はなお伝えられていかねばならず、かつての呼び名はもう使えない。この知らせが宮門を出ればどれほどの議論を呼ぶか、それは目の前のこの束の間の静寂で覆い隠せるものではなかった。"
 SanGong_DianZhang.018.t:0 "廃太子の詔"
