 mem_add_taizi:0 "儲君に冊立される"
 mem_add_taizi_desc:0 "[owner.GetFirstName]は冊立されて儲君となり、東宮に入った。冊文に曰く「国の大本は、首として儲を建つるに在り。爾、秉性仁孝にして、器識端凝なり。それ勉めて徳行を修め、謹んで臣儀を守り、以て宗廟の重きを承けよ。」"
