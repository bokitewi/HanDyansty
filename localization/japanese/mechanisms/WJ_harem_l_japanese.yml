l_japanese:
 WJ_harem_guiren:0 "貴人"
 WJ_harem_guiren_desc:0 "このキャラクターは貴人の位にあり、金印紫綬を帯び、後宮において皇后に次ぐ。"
 WJ_harem_meiren:0 "美人"
 WJ_harem_gongren:0 "宮人"
 WJ_harem_cainv:0 "采女"
 WJ_harem_unranked_desc:0 "このキャラクターは掖庭の宮籍に名を連ねているが、まだ爵秩はなく、季節ごとに賞賜を受けるのみである。"
 SanGong_CeliHuanghou_interaction:0 "皇后を冊立する"
 WJ_harem_crown_desc:0 "この人物を皇后に冊立し、中宮に正位させる。"
 SanGong_divorce_character_interaction:0 "皇后を廃する"
 WJ_harem_depose_desc:0 "皇后を廃し、離縁する。"
 WJ_harem_rank_interaction:0 "位を欽定する"
 WJ_harem_rank_title:0 "内宮の位号を欽定する"
 WJ_harem_rank_desc:0 "[recipient.GetFirstNameNoTooltip]の名は掖庭の名簿に記されているが、その傍らの位号はまだ空欄のままである。侍者はいくつかの称号を読み上げたところで口をつぐんだ。一字でも多く言えば、それもあなたの意向と受け取られかねないとでもいうように。\n\nあなたはもう一度その名に目をやった。貴人、美人、宮人、采女——字数はさほど変わらないが、今後宮中の者がそれを口にする時、その重みはそれぞれ異なる。今日定めれば、その知らせは正式な文書よりも早く伝わるだろう。\n\n筆はすでに用意され、門の外では返事を待つ者が、もう長いこと控えている。"
 WJ_harem.003.a:0 "貴人に冊立する。"
 WJ_harem.003.b:0 "美人に封じる。"
 WJ_harem.003.c:0 "宮人として登録する。"
 WJ_harem.003.d:0 "采女に列する。"
 WJ_harem_rank_notice:0 "内宮の位号が定まった"
 WJ_harem_rank_notice_desc:0 "宮中ではこれより[recipient.Custom('WJ_GetUIName')]と改めて呼ばれる。"
 QianSan_chuGong_interaction:0 "宮から出して帰らせる"
 WJ_harem_crown_title:0 "皇后冊立の詔"
 WJ_harem_crown_notice:0 "冊文の宣読が終わり、[huanghou.Custom('WJ_GetUIName')]が中宮に正位した。侍者は新たに定まった称号を読み上げる際、いつもよりいくらか口調を緩め、傍らの者までが耳を傾けた。今後呼び間違えぬようにするためである。\n\nあなたは冊文を一通り読み、机の端に戻した。一つの位号が定まれば、宮中の多くの細事もそれに伴って軽重が変わる。誰に先に報告するか、どこで謁見を待つか、誰の一言を幾度も推し量るべきか——今後はそれらが噂の種になるだろう。\n\n礼は滞りなく終わり、冊文は収蔵してよい。だが宮門の内でまだ口にされていない言葉は、おそらく今日始まったばかりである。"
 WJ_harem_depose_title:0 "皇后廃位の詔"
 WJ_harem_depose_notice:0 "[huanghou.GetFirstNameNoTooltip]を廃する詔書はすでに下された。侍者が改めた名簿を届けに来て、元の位号を読み上げるところで一瞬言葉を詰まらせ、それから改定後の呼び名に言い換えた。\n\nその書き直された箇所を見て、あなたはようやくこの詔書が宮中に伝わったのだと実感した。今後の謁見の願い、報告、礼儀作法はすべてそれに合わせて改めねばならない。ひそかに胸をなでおろす者もいれば、恨み言をいつまでも胸の奥にしまっておくとは限らない者もいるだろう。\n\n処分は定まったが、宮中の務めは平常どおり続けねばならない。門の外の者は、なお新たな指示を待っている。"
 WJ_harem_ack:0 "主者施行せよ"
 SanGong_ShiQin:0 "後宮を召す"
 WJ_harem_intimacy_title:0 "内宮の起居"
 WJ_harem_intimacy_desc:0 "あなたは[ShiQie.Custom('WJ_GetUIName')]と向かい合って腰を下ろし、門の外で返事を急かす声もようやく遠のいた。灯芯がかすかに鳴り、昼間に言いかけたままの一言が、まだ胸の内に握りしめられていたことにあなたは気づいた。\n\nあなたは肩の力を抜き、傍らの人を見やった。宮中には皇嗣を待ち望む目がもとより少なくない。今夜は自然に任せるか、それともしばらくそのことは考えずにおくか、それはあなたの一念次第である。\n\n灯影が帳の端で揺れている。あなたは手を伸ばして机上の小さな盞を直し、なかなか人を呼び入れようとはしなかった。"
 WJ_harem_allow_birth:0 "自然に任せ、宗祧を継ぐ。"
 WJ_harem_prevent_birth:0 "ただ寄り添うことを望み、しばし嗣子は求めない。"
 SanGong_XuanXiu_decisions:0 "宮中へ采選する"
 WJ_harem_selection_decision_desc:0 "後宮は久しく空しく、皇嗣の望みは掖庭にかかっている。漢家の故事に従い、中大夫と掖庭丞および相工を遣わし、民間の女子を見て、容姿端麗で法相にかなう者を選び、後宮へ連れ帰るべきである。"
 WJ_harem_selection_confirm:0 "有司に采選を命じる"
 WJ_harem_selection_title:0 "采選の名簿が届いた"
 WJ_harem_selection_desc:0 "侍者は最後の一人の名を呼び終えて、ようやく口を閉じた。一人ずつ聞けば覚えられるとあなたは思っていたが、何か指示はあるかと問われた時には、頭の中ですでにいくつもの名前が混ざり合っていた。\n\n新たに選ばれた采女たちはみな入宮し、それぞれの本籍や来歴も記されている。あなたは名簿を置いていくよう命じ、後日改めて見ることにした。その場で去就や位号を急いで決める必要はない——宮中の噂は何より速く、何気ない一言の褒め言葉でさえ、幾度も推し量られることになるのだから。\n\n侍者が下がると、あなたはまた最初の頁に戻った。先ほど名を呼ばれた時の一人一人の一瞬のためらいも、今はわずか数行の文字になってしまっていた。"
 SanGong_FaSongXiuNV_decisions:0 "選ばれなかった宮人を帰す"
 WJ_harem_release_desc:0 "掖庭の采女は入宮して久しく、召されることのなかった者は、深宮で空しく年を重ねている。いっそ家に帰し、婚姻を許してやるのがよい。"
 WJ_harem_release_confirm:0 "帰還を許可する"

 HouGong_ShiHao.001_t: "大行[HuangHou.Custom('WJ_HaremRank')]崩御"
 HouGong_ShiHao.001_d_start:0 "[HuangHou.Custom('WJ_HaremRank')]崩御の訃報が宮中に届き、日頃聞き慣れた往来の音が、にわかに静まり返った。\n\n"
 HouGong_ShiHao.001_d1:0 "有司が喪儀について述べるのを聞き終えると、あなたはまだ処理すべきことをもう一度尋ねた。皇后の位は宮中の礼の秩序と結びつき、また多くのとうに当たり前になっていた日常とも結びついている。その人がいなくなった今、以前なら問う必要もなかった細事にも、すべて改めて誰かが答えねばならない。\n\n哀しみゆえに政務をすべて止めることはできないが、ただ慣例どおりに出費を記す帳簿だけで済ませるべきでもない。あなたは有司に礼に従って取り計らうよう命じ、葬儀に要するものと、死後の諡の議定を併せて進めさせた。逝者のためにできることはもう多くはない。あなたはこの最後のいくつかを、おろそかに済ませたくはなかった。"
 HouGong_ShiHao.001_d2:0 "有司が喪儀について述べる間、あなたは幾度も声のする方を見やった。まるで太后がいつものように人を遣わし、自分の意向を一言伝えてくるかのように。しばらく待って、あなたはようやく思い出した。今やすべての取り決めに、もう彼女の答えが返ってくることはないのだと。\n\n宮中の尊位は礼に従って典籍に記さねばならず、死後の諡も厳粛に議定せねばならない。だが今まず行うべきは、悲しみのゆえに誰も手をつけないままにはしておけない葬儀のことである。\n\nあなたは必要な費用を記させ、順に処理させた。朝廷には朝廷の礼の秩序がある。だが一人の長者が残した空白は、それで埋まるわけではない。"
 HouGong_ShiHao.001_d3:0 "太皇太后の訃報が宮中に届き、長く仕えてきた多くの者は、しばし何から手をつけるべきか分からなかった。彼女がこの宮で過ごした歳月はあなたよりも長く、いくつかの旧例の由来は、彼女の側近の古老だけが覚えている。\n\nあなたは有司に礼に従って段取りを明らかにさせ、まず為すべきことを定めて、哀しみが各所の様子見に変わらぬようにした。死後の諡はなお別に議せねばならないが、目前の喪儀と費用はもはや遅らせることはできない。\n\n文書が読み終えられると、殿中は再び静まり返った。尊位は典籍に記すことができる。だが長く傍らにいた人がもう戻らないことには、慣れるまで長い時がかかるだろう。"
 HouGong_ShiHao.001.a:0 "礼に従って喪を治め、百金を備え、改めて尊諡を議する。"
 HouGong_ShiHao.011_t: "諡号を擬する"
 HouGong_ShiHao.011_d_start:0 "喪儀の段取りがつくと、有司は続いて諡議を奉り、あなたが逝者の死後の呼び名を選ぶのを待っている。\n\n"
 HouGong_ShiHao.011_d1:0 "皇后という呼び名は日頃からよく耳にしていたが、今礼官が尋ねているのは、死後にどの一字を添えるかである。あなたは候補の諡字を受け取ってしばらく眺め、また前の生涯を記した頁に戻った。\n\nある字は重すぎ、ある字は意を尽くせないように思える。堂下ではすでに多くの理由が述べられたが、あなたは礼文に書かれなかったいくつかの小さな出来事を思い出し、しばし答えなかった。\n\n礼官の筆はなお待っている。今後、人はこの字で彼女を呼ぶことになるが、彼女自身はもう聞くことができない。"
 HouGong_ShiHao.011_d2:0 "太后の尊位はすでに記され、礼官は続いて死後の諡を尋ねた。あなたは候補を一つずつ見ていき、いくつかの見慣れた字が口元まで出かかったが、すぐには言わなかった。\n\nかつては決めかねることがあれば彼女の意見を聞くことができた。今日これらの字はみな彼女に関わるものなのに、殿中にはもう彼女に代わって答えられる者はいない。礼官はあなたが聞き取れなかったと思い、読み直そうとしたが、あなたは手を上げて少し待つよう制した。\n\nあなたは文書を平らに置き、いずれ残ることになるその呼び名を、もう一度真剣に考えてみたかった。"
 HouGong_ShiHao.011_d3:0 "太皇太后の諡議が机の前に届けられた。有司はもはや儀物の多寡を問わず、ただ今後どう彼女を呼ぶかだけを尋ねる。日頃呼び慣れていた尊号にも、にわかにあなたが定めねばならぬ部分ができた。\n\nあなたは候補の字を見つめ、宮中の古老が彼女について語る時の表情を思い出した。あなた自身も経験していない昔の出来事があり、彼らがゆっくり語るのを聞くしかない。聞き終えると、目の前のこれらの字は、かえって軽々しく選べなくなった。\n\n礼官は控え、名目もすでに揃っている。この死後の礼議のために、後世へ伝えられる一つの呼び名を定めねばならない。"
 HouGong_ShiHao.011.az: "$Color_ZanBai$『自ら諡字を定める』"
