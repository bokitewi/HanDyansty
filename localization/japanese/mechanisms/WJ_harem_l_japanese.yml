 HouGong_ShiHao.012_t: "諡を冊す"
 HouGong_ShiHao.012_d:0 "候補の字はひとまず脇に置かれ、諡字はあなた自ら定めることになった。礼官は筆を置いて半歩退き、先ほどまで途切れなかった説明の声もそれとともに止んだ。\n\n机の前の空白を見つめていると、ふと昔、誰かが彼女を呼んだ時の声を思い出した。死後の諡はただ一字を取る。今後、人が彼女のことを口にする時には、あなたが今日書くこの一字が添えられる。だがどう書こうとも、彼女がもう一声応えることはない。"
 HouGong_ShiHao.012.a: "諡字は定まった。主者施行せよ。"
 WJ_harem_selection_origin_desc:0 "名簿がまだ発せられぬうちに、侍者がまず出自について伺いに来た。良家の女子を取るか、それとも名門の中から先に選ぶか。彼の言葉が終わるや、その袖の端にとうに筆が用意されているのがあなたの目に入った。\n\nこの命が下れば、喜ぶ者もいれば、推し量る者もいるだろう。まだ空白の名簿を見つめながら、あなたは、いずれ宮中の一つ一つの姓の背後に、門を叩いて様子を尋ねる者が何人も増えるかもしれないと思った。名門の娘が足りなければ、なお良家から補わねばならない。去就や位号のことは、さらに先の話である。\n\n侍者はそれ以上何も言わず、ただあなたが口を開くのを待っている。"
 WJ_harem_selection_commoner: "良家の娘を選ぶ。"
 WJ_harem_selection_noble: "名門の娘を選ぶ。"
