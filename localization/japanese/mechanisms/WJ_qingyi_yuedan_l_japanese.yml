# 清议重制·月旦评（2026-10-08）。意图、阶段与筹备选项的键仍在 WJ_scholars_l_simp_chinese.yml。

 # 特质
 trait_hd_yuedan_mingshi:0 "名士"
 trait_hd_yuedan_mingshi_desc:0 "このキャラクターはかつて月旦評で諸賢から第一に推された。ひとたび品題を受けるや身価は十倍となり、天下の士人はみな交わりを結びたいと願う。"

 # 品评类别
 WJ_qingyi_yd_class_1:0 "雄主"
 WJ_qingyi_yd_class_2:0 "奸雄"
 WJ_qingyi_yd_class_3:0 "名将"
 WJ_qingyi_yd_class_4:0 "能臣"
 WJ_qingyi_yd_class_5:0 "謀士"
 WJ_qingyi_yd_class_6:0 "名儒"

 # 品评评语（6 类 × 3 句）
 WJ_qingyi_yd_comment_1_1:0 "一方に拠りながら、志は一方に止まらず。気度は恢弘にして、群下を包容しうる。"
 WJ_qingyi_yd_comment_1_2:0 "よく人の長所を用い、人の能を忌まず。天下に帰するところあらば、あるいはこの人にあらん。"
 WJ_qingyi_yd_comment_1_3:0 "四方に鎮座し、号令の出づるところ、士民影のごとく従う。惜しむらくは慮るところ大にして、失うところもあるいは細部にあらん。"
 WJ_qingyi_yd_comment_2_1:0 "治世の能臣、乱世の奸雄。"
 WJ_qingyi_yd_comment_2_2:0 "機変百出し、喜怒を色に表さず。これと事を共にする者は、その利を得るも、またその鋒を防ぐべし。"
 WJ_qingyi_yd_comment_2_3:0 "胸に甲兵を蔵し、口に仁義を称す。その心は測りがたく、その才は掩いがたし。"
 WJ_qingyi_yd_comment_3_1:0 "陣に臨んで果断、士卒は喜んでそのために死す。三軍の中、旌旗の向かうところこそこの人なり。"
 WJ_qingyi_yd_comment_3_2:0 "勇は一時に冠たり、万人に当たるべし。もし明主の御するを得ば、功業いまだ量るべからず。"
 WJ_qingyi_yd_comment_3_3:0 "兵を知りて武を黷さず、善く戦いて軍を全うす。古の良将も、これに過ぎず。"
 WJ_qingyi_yd_comment_4_1:0 "清廉にして繁劇を治め、至るところ倉廩実ちて訟獄息む。"
 WJ_qingyi_yd_comment_4_2:0 "王佐の才。州郡を任ずれば郡治まり、台閣を任ずれば台閣清し。"
 WJ_qingyi_yd_comment_4_3:0 "文辞をもって自らを顕さずして、簿書銭穀みな条理あり。治世の頼むところ、まさにこの類の人にあり。"
 WJ_qingyi_yd_comment_5_1:0 "深謀遠慮、算に遺策なし。言は未然の前に出で、事は既然の後に験さる。"
 WJ_qingyi_yd_comment_5_2:0 "沈黙寡言、一語にして的に中る。ともに大事を図るべく、ともに小節を争うべからず。"
 WJ_qingyi_yd_comment_5_3:0 "よく人心を察し、権変に長ず。これを用いて宜しきを得ば、十万の師に勝る。"
 WJ_qingyi_yd_comment_6_1:0 "経明らかにして行い修まり、海内宗仰す。門下に業を受くる者、千里を遠しとせずして至る。"
 WJ_qingyi_yd_comment_6_2:0 "言に物あり行いに恒あり。清議の重んずるところ、まさにその人にあり。"
 WJ_qingyi_yd_comment_6_3:0 "辞令は雅正、進退に度あり。一時の士林の表率たるべし。"

