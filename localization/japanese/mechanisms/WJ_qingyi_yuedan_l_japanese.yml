 WJ_qingyi.2010.t:0 "清談の夜話"
 WJ_qingyi.2010.desc:0 "夜も更け、賓客の多くはすでに部屋に戻り、廊下にはあなたと[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]だけが残っていた。月の光は美しく、昼間の論争は今やずいぶん遠くに感じられる。\n\n相手は二杯の茶を注ぎ、近頃はどう過ごしているかとあなたに尋ねた。"
 WJ_qingyi.2010.a:0 "心中の思いを打ち明ける。"
 WJ_qingyi.2010.b:0 "玄理のみを談じ、私事には触れない。"
 WJ_qingyi.2010.c:0 "口実を設けて先に休む。"
 WJ_qingyi_log_2010_a:0 "[CHARACTER.Custom('WJ_GetUIName')]は[TARGET_CHARACTER.Custom('WJ_GetUIName')]と月下で夜話し、心中の思いを打ち明けた"
 WJ_qingyi_log_2010_a_title:0 "$WJ_qingyi.2010.t$"
 WJ_qingyi_log_2010_b:0 "[CHARACTER.Custom('WJ_GetUIName')]は夜に玄理を談じ、心がしだいに安らいだ"
 WJ_qingyi_log_2010_b_title:0 "$WJ_qingyi.2010.t$"

 WJ_qingyi.2011.t:0 "時の人を論評する"
 WJ_qingyi.2011.desc:0 "主人の[host.Custom('WJ_GetLinkedUIName')]がふいにあなたの方を向き、[wj_qingyi_subject.Custom('WJ_GetLinkedUIName')]についてどう思うかと尋ねた。\n\n席は静まり返った。人物の品評は清議では常のことだが、この人物はなんといっても主人の治下の者であり、あなたの言葉はいずれ本人の耳に届くだろう。"
 WJ_qingyi.2011.a:0 "その短所を率直に述べる。"
 WJ_qingyi.2011.b:0 "その長所を称揚する。"
 WJ_qingyi.2011.c:0 "一言も述べない。"
 WJ_qingyi.2011.c.success:0 "沈黙をもって評とし、皆はその意を悟った"
 WJ_qingyi.2011.c.failure:0 "沈黙が長すぎ、臆病に見えた"
 WJ_qingyi_log_2011_a:0 "[CHARACTER.Custom('WJ_GetUIName')]は公然と[TARGET_CHARACTER.Custom('WJ_GetUIName')]の短所を率直に述べた"
