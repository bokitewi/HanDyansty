 WJ_qingyi.1011.t:0 "清濁の弁"
 WJ_qingyi.1011.desc:0 "[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]が机を叩いて立ち上がり、今の朝中は清濁入り混じり、宦官の子弟が州郡を占め、清流はかえって排斥されているのに、座の諸君はどうしてまだ玄理ばかり談じていられるのかと言った。\n\n何人かの賓客がそれに同調したが、眉をひそめる者もいる。清濁の別は士林の大義であるが、天下の人を一概に二種類に分けるのが公平とは限らない。"
 WJ_qingyi.1011.a:0 "濁を撃ち清を揚げるは、まさに今である。"
 WJ_qingyi.1011.b:0 "清も濁もそれぞれに人あり、門戸をもって人を定めてはならない。"
 WJ_qingyi.1011.b.success:0 "論は公平で、皆が称賛した"
 WJ_qingyi.1011.b.failure:0 "郷愿と罵られた"
 WJ_qingyi.1011.c:0 "一笑に付す。"
 WJ_qingyi_log_1011_a:0 "[CHARACTER.Custom('WJ_GetUIName')]は濁を撃ち清を揚げることを唱え、座の清流は深く同意した"
 WJ_qingyi_log_1011_a_title:0 "$WJ_qingyi.1011.t$"
 WJ_qingyi_log_1011_b_success:0 "[CHARACTER.Custom('WJ_GetUIName')]は清濁を公平に論じ、[TARGET_CHARACTER.Custom('WJ_GetUIName')]でさえ反駁できなかった"
 WJ_qingyi_log_1011_b_success_title:0 "$WJ_qingyi.1011.t$"
 WJ_qingyi_log_1011_b_failure:0 "[CHARACTER.Custom('WJ_GetUIName')]は[TARGET_CHARACTER.Custom('WJ_GetUIName')]に郷愿と罵られた"
 WJ_qingyi_log_1011_b_failure_title:0 "$WJ_qingyi.1011.t$"
 WJ_qingyi_log_1011_c:0 "[CHARACTER.Custom('WJ_GetUIName')]は清濁の争いを一笑に付した"
 WJ_qingyi_log_1011_c_title:0 "$WJ_qingyi.1011.t$"

 WJ_qingyi.1012.t:0 "雅歌と投壺"
 WJ_qingyi.1012.desc:0 "連日の議論の後、皆いささか疲れていた。[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]が投壺を並べようと提案し、さらに琴を持ってくる者もいた。\n\n清議は常に剣を抜き弓を張るようなものである必要はない。主人たるあなたがどう加わるか、賓客たちはみな見ている。"
 WJ_qingyi.1012.a:0 "自ら矢を執って投壺する。"
 WJ_qingyi.1012.a.success:0 "続けて数本命中し、満座が喝采した"
 WJ_qingyi.1012.a.failure:0 "何度投げても入らず、皆の大笑いを誘った"
 WJ_qingyi.1012.b:0 "拍子を取って歌い、皆と共に楽しむ。"
 WJ_qingyi.1012.c:0 "静かに座って眺める。"
 WJ_qingyi_log_1012_a_success:0 "[CHARACTER.Custom('WJ_GetUIName')]は投壺で続けて命中し、[TARGET_CHARACTER.Custom('WJ_GetUIName')]を圧倒した"
 WJ_qingyi_log_1012_a_success_title:0 "$WJ_qingyi.1012.t$"
 WJ_qingyi_log_1012_a_failure:0 "[CHARACTER.Custom('WJ_GetUIName')]は投壺で何度も外し、[TARGET_CHARACTER.Custom('WJ_GetUIName')]と顔を見合わせて大笑いした"
 WJ_qingyi_log_1012_a_failure_title:0 "$WJ_qingyi.1012.t$"
 WJ_qingyi_log_1012_b:0 "[CHARACTER.Custom('WJ_GetUIName')]は拍子を取って歌い、主客ともに歓を尽くした"
 WJ_qingyi_log_1012_b_title:0 "$WJ_qingyi.1012.t$"
 WJ_qingyi_log_1012_c:0 "[CHARACTER.Custom('WJ_GetUIName')]は静かに座して傍観し、主人としての分を失わなかった"
 WJ_qingyi_log_1012_c_title:0 "$WJ_qingyi.1012.t$"

 # 新增通用事件 2009–2012（宾客）
 WJ_qingyi.2009.t:0 "名士に面会を求める"
 WJ_qingyi.2009.desc:0 "席上で最も学問の深いのは[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]である。散会の後、この人の周りにはいつも人の輪ができる。教えを請う者もいれば、ただ印象を残したいだけの者もいる。\n\nあなたも進み出たいが、どのような姿勢で臨むかまだ決めかねている。"
 WJ_qingyi.2009.a:0 "弟子の礼を執って教えを請う。"
 WJ_qingyi.2009.a.success:0 "その指導を得て、からりと視界が開けた"
 WJ_qingyi.2009.a.failure:0 "問うたことが浅薄で、社交辞令をいくつか得ただけだった"
 WJ_qingyi.2009.b:0 "己の見解をもって問いただす。"
 WJ_qingyi.2009.b.success:0 "何度かやり取りを重ね、相手に一目置かれた"
 WJ_qingyi.2009.b.failure:0 "論で人に敵わず、笑い種を残しただけだった"
 WJ_qingyi.2009.c:0 "遠くから聞けば十分。"
 WJ_qingyi_log_2009_a_success:0 "[CHARACTER.Custom('WJ_GetUIName')]は[TARGET_CHARACTER.Custom('WJ_GetUIName')]に経を執って教えを請い、得るところが多かった"
