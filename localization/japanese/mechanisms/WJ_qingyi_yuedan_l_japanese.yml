 WJ_qingyi.2012.t:0 "席次争い"
 WJ_qingyi.2012.desc:0 "席に着く時、[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]はまっすぐあなたより上の席に座り、門第と官秩から言えば当然そうあるべきだと言った。\n\n周りの者は皆あなたたち二人を見ている。席次は些事とはいえ、士人の目には体面に関わることである。"
 WJ_qingyi.2012.a:0 "理をもって強く争う。"
 WJ_qingyi.2012.a.success:0 "相手は言葉に詰まり、不満げに席を譲った"
 WJ_qingyi.2012.a.failure:0 "争っても得られず、かえって体面を失った"
 WJ_qingyi.2012.b:0 "席を避けて譲る。"
 WJ_qingyi.2012.c:0 "主人に裁定を請う。"
 WJ_qingyi_log_2012_a_success:0 "[CHARACTER.Custom('WJ_GetUIName')]は席次争いで[TARGET_CHARACTER.Custom('WJ_GetUIName')]に勝った"
