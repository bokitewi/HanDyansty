 # 3001 论时事·提名
 WJ_qingyi.3001.t:0 "月旦評：時事を論ず"
 WJ_qingyi.3001.desc.host:0 "一同はひとしきり時局を論じ、州郡の盗賊から朝中の人事へと話が移り、話題はしだいに人物へと落ち着いていった。あなたは麈尾を置き、座の諸君に告げた。今日は清談だけでなく、汝南の故事に倣って当世の人物を品評し、一人を第一に推挙しようと。\n\nあなたは用意した名簿を読み上げ、これからの議論で詳しく品評してほしいと諸君に請うた："
 WJ_qingyi.3001.desc.guest:0 "一同がひとしきり時局を論じたところで、主人の[host.Custom('WJ_GetLinkedUIName')]がふいに麈尾を置き、今日は汝南の故事に倣って当世の人物を品評し、座の諸君に一人を第一に推挙してもらおうと言った。\n\n席は一瞬静まり、すぐに議論が沸き起こった。主人は用意した名簿を読み上げた："
 WJ_qingyi.3001.desc.end:0 "\n\n名簿が発表されると、うなずく者もいれば、冷笑する者もいた。これから数日、名簿に載った人々の出自・行い・得失は、繰り返し議論の俎上に載せられることになる。"
 WJ_qingyi.3001.a:0 "まずは諸君の品題を聞こう。"

 # 3101 投票
 WJ_qingyi.3101.t:0 "月旦評：投票"
 WJ_qingyi.3101.desc:0 "議論は十分に尽くされ、自らの態度を明らかにする時が来た。侍者が各席の前に竹簡を置き、賓客一人一人に推挙する者の名を書くよう請う。\n\nこの一票で大勢が決まるとは限らないが、書いた名は結局人々に記憶される。"
 WJ_qingyi.3101.c1:0 "[wj_yd_c1.Custom('WJ_GetUIName')]を推挙する"
 WJ_qingyi.3101.c2:0 "[wj_yd_c2.Custom('WJ_GetUIName')]を推挙する"
 WJ_qingyi.3101.c3:0 "[wj_yd_c3.Custom('WJ_GetUIName')]を推挙する"
 WJ_qingyi.3101.c4:0 "[wj_yd_c4.Custom('WJ_GetUIName')]を推挙する"
 WJ_qingyi.3101.c5:0 "[wj_yd_c5.Custom('WJ_GetUIName')]を推挙する"
 WJ_qingyi.3101.c6:0 "[wj_yd_c6.Custom('WJ_GetUIName')]を推挙する"
 WJ_qingyi.3101.c7:0 "[wj_yd_c7.Custom('WJ_GetUIName')]を推挙する"
 WJ_qingyi.3101.c8:0 "[wj_yd_c8.Custom('WJ_GetUIName')]を推挙する"
 WJ_qingyi.3101.vote_tt:0 "あなたはこの者の名を竹簡に書く。この後、その者のためにさらに奔走することもできるかもしれない。"
 WJ_qingyi.3101.abstain:0 "日頃の好悪に任せて書く。"
 WJ_qingyi.3101.abstain_tt:0 "あなたはそれ以上考えず、その時になって日頃の好悪と交情に任せて一人の名を書く。"

 # 3102 拉票
 WJ_qingyi.3102.t:0 "月旦評：票集め"
 WJ_qingyi.3102.desc:0 "竹簡はすでに提出され、この一巡の議論が終わってから集計される。あなたが推挙した[wj_yd_target.Custom('WJ_GetLinkedUIName')]が勝ち抜けるかどうかは、あなたのこれからの行動次第かもしれない。"
 WJ_qingyi.3102.a:0 "我が名声をもってその者を保証する。"
 WJ_qingyi.3102.b:0 "権門を奔走し、その者のために遊説する。"
 WJ_qingyi.3102.c:0 "席上で論難し、その者を盛り立てる。"
 WJ_qingyi.3102.c.success:0 "舌鋒の向かうところ、満座が心を動かされた"
 WJ_qingyi.3102.c.failure:0 "言葉が過ぎて失言し、かえって詰問された"
 WJ_qingyi.3102.d:0 "多言は無用。"
 WJ_qingyi.3102.plus2_tt:0 "#P 席上の少なからぬ者が、これにより[wj_yd_target.Custom('WJ_GetUIName')]の推挙に転じた#!"
 WJ_qingyi.3102.plus3_tt:0 "#P 満座が心を動かされ、多くの者が[wj_yd_target.Custom('WJ_GetUIName')]の推挙に転じた#!"
 WJ_qingyi.3102.minus1_tt:0 "#N かえってこれにより[wj_yd_target.Custom('WJ_GetUIName')]を推挙したくなくなった者もいる#!"

 # 3201 品人物
 WJ_qingyi.3201.t:0 "月旦評：人物を品す"
 WJ_qingyi.3201.desc:0 "この数日の議論は、名簿に載ったあの名前をめぐって続いた。ある者は昔の事績を引き、ある者は近況を述べ、褒貶のうちに各家の品題がしだいに形を成していった："
 WJ_qingyi.3201.desc.end:0 "\n\n事前の取り決めにより、この一巡の議論が終われば各自一票を投じ、得票の最も多い四人が最終評に進む。"
 WJ_qingyi.3201.a:0 "我が心にはすでに人選がある。"

 # 3301 定评
 WJ_qingyi.3301.t:0 "月旦評：評を定む"
 WJ_qingyi.3301.desc:0 "名簿に残るのはわずか四人。席の空気は前の数日よりも張りつめている。次の集計の後、第一の名が各州郡に知れ渡ることを、誰もが分かっているのだ。最後の品題は以下のとおり："
 WJ_qingyi.3301.desc.end:0 "\n\n今回推挙できるのは一人だけである。"
 WJ_qingyi.3301.a:0 "筆を下ろして評を定める。"

 # 3401 揭晓
 WJ_qingyi.3401.t:0 "月旦評：一言にて品を定む"
 WJ_qingyi.3401.desc:0 "竹簡の集計が終わり、一同は[wj_yd_winner.Custom('WJ_GetLinkedUIName')]を今回の月旦第一に推した。評語が皆の前で読み上げられた：\n\n「[wj_yd_winner.Custom('WJ_qingyi_yd_comment')]」\n\nこの評語はすぐに書き写されて広まるだろう。これより各州郡で当世の人物が語られる時、まずこの名が挙がるのは避けられない。"
 WJ_qingyi.3401.desc.self:0 "竹簡の集計が終わり、一同が推した第一は、なんとあなたであった。評語が皆の前で読み上げられた：\n\n「[wj_yd_winner.Custom('WJ_qingyi_yd_comment')]」\n\n満座の視線があなたに注がれる。今後、この評語はあなたの名とともに天下に広まっていくだろう。"
 WJ_qingyi.3401.a:0 "努めずにいられようか。"
 WJ_qingyi.3401.b:0 "名の下に虚士なし。"

 # 3501 闻月旦（缺席）
 WJ_qingyi.3501.t:0 "月旦を聞く"
 WJ_qingyi.3501.desc.winner:0 "[host.Custom('WJ_GetLinkedUIName')]のもとから来た客が言うには、そこで最近月旦評が催され、座の諸賢が当世の人物を品評し、最後になんとあなたを第一に推したという。\n\n「[wj_yd_winner.Custom('WJ_qingyi_yd_comment')]」\n\nこの評語はすでに広まっているらしい。あなたはその場にいなかったが、名声が先に届いていた。"
 WJ_qingyi.3501.desc.finalist:0 "[host.Custom('WJ_GetLinkedUIName')]のもとから来た客が言うには、そこで最近月旦評が催され、あなたも最終評の四人の中に入っていたが、最後に第一は[wj_yd_winner.Custom('WJ_GetLinkedUIName')]に帰したという。\n\n第一は得られなくとも、最終評に入ったことは、天下の士人の目には一つの名声である。"
 WJ_qingyi.3501.a:0 "評主に書を送り、謙遜して謝意を述べる。"
 WJ_qingyi.3501.b:0 "堂々と受ける。"

 # 活动记录
 WJ_qingyi_yd_log_nominate:0 "[CHARACTER.Custom('WJ_GetUIName')]は汝南の故事に倣い、当世の人物八人を指名して月旦の評を開いた"
 WJ_qingyi_yd_log_nominate_title:0 "月旦評の開始"
 WJ_qingyi_yd_log_round_two:0 "人物の品評が終わり、八人のうち四人が最終評に進んだ"
 WJ_qingyi_yd_log_round_two_title:0 "八人から四人へ"
 WJ_qingyi_yd_log_winner:0 "諸賢は[CHARACTER.Custom('WJ_GetUIName')]を月旦第一に推し、[TARGET_CHARACTER.Custom('WJ_GetUIName')]が自ら品題した"
 WJ_qingyi_yd_log_winner_title:0 "一言にて品を定む"
 WJ_qingyi_yd_log_finalists:0 "最終評で選に漏れた者も、選に入ったことで名声がしだいに高まった"
 WJ_qingyi_yd_log_finalists_title:0 "最終評の諸賢"
 WJ_qingyi_yd_all_finalists:0 "選に漏れたすべての最終評候補者"

 # 消息
 WJ_qingyi_yd_msg_title:0 "月旦評の決定"
 WJ_qingyi_yd_msg_desc:0 "[host.Custom('WJ_GetUIName')]が月旦評を主催し、諸賢は[wj_yd_winner.Custom('WJ_GetUIName')]を当世第一に推した"

 # 新增通用事件 1009–1012（主人）
 WJ_qingyi_all_honest_attendees:0 "誠実なすべての列席者"

 WJ_qingyi.1009.t:0 "党錮の旧事"
 WJ_qingyi.1009.desc:0 "議論がまさに白熱したところで、[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]がふいに党錮の旧事を持ち出した。かつて李膺・范滂らが清議のために罪を得て終身禁錮となり、獄中で死ぬにまで至ったことである。\n\n席は一気に静まり返った。この件は今なお禁忌であり、座の者はみなあなたが態度を示すのを待っている。あまりに率直に言えば、聞くべきでない者の耳に入るのは避けられない。あまりに曖昧に言えば、人に軽んじられるのも避けられない。"
 WJ_qingyi.1009.a:0 "その冤罪を率直に述べ、禁忌を避けない。"
 WJ_qingyi.1009.a.success:0 "慷慨して陳述し、満座は粛然とした"
 WJ_qingyi.1009.a.failure:0 "言葉が激しすぎ、自分のほうが肝を冷やした"
 WJ_qingyi.1009.b:0 "古を借りて今を喩え、ほどほどに留める。"
 WJ_qingyi.1009.b.success:0 "話の矛先を転じ、跡を残さなかった"
 WJ_qingyi.1009.b.failure:0 "左右を顧みて他を言い、見抜かれた"
 WJ_qingyi.1009.c:0 "「この席では朝政を論じない」"
 WJ_qingyi_log_1009_a_success:0 "[CHARACTER.Custom('WJ_GetUIName')]は党錮の冤罪を率直に論じ、[TARGET_CHARACTER.Custom('WJ_GetUIName')]はそれに敬服した"
 WJ_qingyi_log_1009_a_success_title:0 "$WJ_qingyi.1009.t$"
 WJ_qingyi_log_1009_a_failure:0 "[CHARACTER.Custom('WJ_GetUIName')]は党錮を論じて激しすぎ、後でひどく不安になった"
 WJ_qingyi_log_1009_a_failure_title:0 "$WJ_qingyi.1009.t$"
 WJ_qingyi_log_1009_b_success:0 "[CHARACTER.Custom('WJ_GetUIName')]は古を借りて今を喩え、党錮の論を軽く流した"
 WJ_qingyi_log_1009_b_success_title:0 "$WJ_qingyi.1009.t$"
 WJ_qingyi_log_1009_b_failure:0 "[CHARACTER.Custom('WJ_GetUIName')]は党錮の問いを避け、[TARGET_CHARACTER.Custom('WJ_GetUIName')]に軽んじられた"
 WJ_qingyi_log_1009_b_failure_title:0 "$WJ_qingyi.1009.t$"
 WJ_qingyi_log_1009_c:0 "[CHARACTER.Custom('WJ_GetUIName')]はこの席では朝政を論じないと明言した"
 WJ_qingyi_log_1009_c_title:0 "$WJ_qingyi.1009.t$"

 WJ_qingyi.1010.t:0 "経を執りて難を問う"
 WJ_qingyi.1010.desc:0 "若い[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]が一巻の経書を捧げ持ってあなたの席の前に来て、恭しく礼をし、その中の一節を解説してほしいと請うた。\n\nこの一節は昔から諸説紛々で、傍らにはすでに聞こうと寄ってくる者もいる。うまく講じればこの後生は一生忘れないだろう。うまく講じられなければ、恥をかくのはあなた一人ではない。"
 WJ_qingyi.1010.a:0 "一字ずつ講疏する。"
 WJ_qingyi.1010.a.success:0 "条理を分けて細かく分析し、後生は敬服した"
 WJ_qingyi.1010.a.failure:0 "引証に誤りがあり、人に指摘された"
 WJ_qingyi.1010.b:0 "問い返して啓発し、自ら悟らせる。"
 WJ_qingyi.1010.c:0 "座の名士に代わって解いてもらう。"
 WJ_qingyi_log_1010_a_success:0 "[CHARACTER.Custom('WJ_GetUIName')]は[TARGET_CHARACTER.Custom('WJ_GetUIName')]のために経義を講疏し、後者は大いに啓発された"
