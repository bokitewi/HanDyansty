 WJ_peer_root_status:0 "\n\nまず封地のある州を選ぶ。"
 WJ_peer_parent_status:0 "\n\n今、[ROOT.Char.MakeScope.Var('wj_peer_parent').Title.GetNameNoTooltip]の境内で地を選ぶ。"
 WJ_peer_cancel:0 "冊封を取り消す"
