 WJ_peer_grant_failed:0 "冊封は成らず"
 WJ_peer_grant_failed_desc:0 "冊書が出来上がろうとした時、有司が報告してきた。選んだ地はすでに別の者に属しているか、封を受ける者の状況が変わったため、この冊命はついに下すことができないという。\n\n今回は何も費やしていない。別の地を選ぶこともできるし、ここで取りやめることもできる。"
 WJ_peer_inherited_desc:0 "先人の冊書と印綬が、今あなたの手に渡された。#high [ROOT.Char.Custom('WJ_PeerName')]#!という爵号は、[ROOT.Char.MakeScope.Var('wj_peer_food').Title.GetBaseNameNoTierNoTooltip]の歳禄とともに、これよりあなたが承襲する。\n\n家の老僕が古い冊を捧げ持ってきて、そこに記された代々の名を指し示した。名は幾度も替わったが、爵号は終始この一つであった。\n\n今後、誰かがあなたの家門について語る時、最初に口にするのは、おそらくやはりこの数文字であろう。"
 WJ_peer_grant_interaction_desc:0 "天子の命により、この者の爵等と食邑を議定する。"
 WJ_peer_revoke_interaction_desc:0 "この者の爵号を削り、その食邑の歳禄を回収する。"
 SanGong_SeparatedCloseKin_modifier_desc:0 "この家は皇室の近い支流から出ており、すでに別に一家を立てたとはいえ、なお宗親の列にある。"
