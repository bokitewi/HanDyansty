l_japanese:
 WJ_peerage_trait:0 "世襲爵位"
 WJ_peerage_trait_desc:0 "このキャラクターは天子の策命を受けて爵位に列し、封邑の禄を食んでいる。"
 WJ_peer_grant_interaction:0 "策命して爵を封ずる"
 WJ_peer_open_tt:0 "封地を列挙し、この者の爵等と食邑を議定する"
 WJ_peer_choose_rank_tt:0 "爵等を議定し、それから封号と食邑を選ぶ。"
 WJ_peer_choose_place_tt:0 "州郡であればその中に入って細かく選ぶ。封じうる地であれば、ここで詔を下して冊封する。"
 WJ_peer_navigation_tt:0 "輿籍を調べ、別の地を選ぶ。"
 WJ_peer_cancel_tt:0 "こたびの冊封はひとまず取りやめ、何も授けず、何も費やさない。"
 WJ_peer_revoke_interaction:0 "爵位を剥奪する"
 WJ_peer_designate_interaction:0 "襲爵人を指定する"
 WJ_peer_rank_desc:0 "あなたは[ROOT.Char.MakeScope.Var('wj_peer_target').Char.GetFirstNameNoTooltip]のために爵号を議定しようとしている。功臣は勲業によって爵を受け、宗室の娘は親族の誼によって公主に封じられる。爵にはその号があり、食にはその邑があるが、封を受けた者がその地を治めるわけではなく、元の官職もこれによって変わることはない。"
 WJ_peer_pick_title:0 "地を選んで冊封する"
 WJ_peer_pick_desc:0 "有司が輿図と簿籍を広げ、まだ分封できる州・郡・県・邑を一つ一つ挙げていく。封号と食邑が選ばれれば、冊封の詔書を下すことができる。"
 WJ_peer_next:0 "次のページ"
 WJ_peer_back:0 "一つ上の階層に戻る"
 WJ_peer_restart:0 "爵等を選び直す"
 WJ_peer_confirm_title:0 "封爵の詔命を下す"
 WJ_peer_confirm:0 "正式に授与する"
 WJ_peer_awarded:0 "封爵の詔命"
 WJ_peer_inherited:0 "爵位の承襲"
 WJ_peer_awarded_desc:0 "冊書が届き、あなたはまず宣読を聞き終えてから、それを受け取った。#high [ROOT.Char.Custom('WJ_PeerName')]#!の数文字が目の前にあり、歳禄は[ROOT.Char.MakeScope.Var('wj_peer_food').Title.GetBaseNameNoTierNoTooltip]にかかる。今後の呼び名にも家計にも、新たな拠り所ができたのだ。\n\n侍者が冊書をどこに収めるべきか尋ねたが、あなたはしばし答えず、新しい称号をもう一度眺めた。今後、名刺を差し出し家門を語る者は、おそらくまずこの数文字を添えることになるだろう。\n\n食邑は歳禄を供するのみで、その地があなたの統治に帰するわけではなく、あなたが元から持つ官職と封地もすべて従来どおりである。それでも冊書を閉じた時、あなたはそれが机上の他の物とはどこか違うように感じた。"
 WJ_peer_removed:0 "爵位は除かれた"
 WJ_peer_removed_desc:0 "処分の文書は読み終えられたが、書吏はなお机の前に立ち、今後の呼び名についてあなたの確認を待っていた。あなたはそこでようやく、彼が書き直した名簿を目にした。かつての爵号があった所は、すでに空白になっている。\n\n聞き慣れた呼び名ほど、それが取り上げられうるものだと忘れてしまうものだ。食邑も爵禄も併せて剥奪され、家の費用も子孫の算段も、もはや以前どおりには立てられない。人がなおも旧い呼び名で呼べば、その空白がいっそう目に痛むだけだろう。\n\nあなたは文書を置いていくよう命じた。官職と封地はこれによって変わらず、届くべき公務は明日も同じように届くだろう。ただ、それらの文書の書き出しに、もはやあの数文字を書くことはできない。"
 WJ_peer_income:0 "食邑の歳禄"
 WJ_peer_income_desc:0 "書吏の報告によれば、今年の食邑の歳禄は合わせて[ROOT.Char.MakeScope.Var('wj_peer_amount').GetValue|0]金で、すでに府庫に納められたという。あなたは別の支出の文書を読んでいたが、聞き終えると証書を近くに寄せさせた。\n\nこの金は食邑の賦入から出るもので、たとえその地の領主が替わっても、爵禄は旧制どおりに支給される。あなたは出所を一通り確かめてから、証書を返した。ずっと決めかねていたいくつかの費用にも、ようやく融通の余地ができた。\n\n侍者がほかに用はないかと尋ねると、あなたは手を振って下がらせたが、視線はまたあの支出の文書に戻った。新たに得た収入も、おそらく長くは遊んでいられないだろう。"
 WJ_peer_ack:0 "承知した"
 SanGong_SeparatedCloseKin_modifier:0 "近い宗支"
