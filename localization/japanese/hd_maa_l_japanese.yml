l_japanese:
 hd_youzhou_tuqi:0 "幽州突騎"
 hd_youzhou_tuqi_flavor:0 "#F 幽州は塞に近く、民は鞍馬の間に生まれ育ち、勇猛にして突撃に長ける。光武帝がかつて漁陽・上谷の突騎を発して河北を平定して以来、天下で精騎を論ずれば、まず幽州が挙げられる。#!"
 hd_maa_source.0001.t:0 "幽州での騎兵募集の中断"
 hd_maa_source.0001.desc:0 "幽州からの知らせに、あなたは長く沈黙した。かの地の郡県は、今やあなたの手を離れたか、乱の後で人心が定まらないかのいずれかで、騎兵募集に遣わした使者が村々を巡っても、応じる者はわずかだった。\n\nすでに軍に編入された突騎はなおあなたの旗の下で命を待っているが、今後さらに募ろうにも、当面は徴発する当てがない。塞上の良馬と騎手はなおそこにいるが、もはやあなたのために用いられることはない。"
 hd_maa_source.0001.a:0 "ひとまず今いる騎兵を頼みとしよう。"
 hd_maa_source.0002.t:0 "幽州で再び騎兵を募れる"
 hd_maa_source.0002.desc:0 "幽州の諸県は再び安定を取り戻し、郡中の豪傑もあなたの徴召に応じるようになった。知らせが届くと、幕下の老騎兵たちは顔を見合わせて笑い、故郷の若者がまた軍に加われると言った。\n\n新たな騎兵がひとりでに陣営の前に現れるわけではなく、募集と拡充には別に銭穀を割かねばならない。だが、あなたがその金を惜しまぬ限り、幽州の突騎は再び続々とやってくるだろう。"
 hd_maa_source.0002.a:0 "幽燕の突騎、再び我が用となる。"
 hd_baima_yicong:0 "白馬義従"
 hd_baima_yicong_flavor:0 "#F 右北平は塞の下に位置し、郡中の弓の名手たちが義従として結集した。皆が白馬に乗り、弓を携えて駆ける。白馬の群れが突進するとき、塞外の諸胡は遠くから見ただけで、軽々しく侵すべからずと悟るのである。#!"
 hd_gongsun_baima_event_army:0 "公孫瓚の白馬義従"
 hd_maa_source.0003.t:0 "白馬はもう北から来ない"
 hd_maa_source.0003.desc:0 "右北平の使者が階下に跪き、郡中にはもう応募する者がいないと告げた。かの辺郡は今やあなたの治下にないか、兵乱の後で人心が離散したかのいずれかで、弓に長けた若者たちは乱を避けて遠くへ去ったり、他の主に身を投じたりしている。\n\n陣中の白馬義従はなおあなたの号令に従い、旗の白馬もなお鮮やかだ。ただ、新たな騎兵を加えるには、右北平が再びあなたの手に戻るのを待たねばならない。"
 hd_maa_source.0003.a:0 "白馬の名は、ひとまず旧部に守らせよう。"
 hd_maa_source.0004.t:0 "白馬再び集う"
 hd_maa_source.0004.desc:0 "右北平は再び安定し、郡中の弓の名手たちがまた次々と投じてきた。自家の白馬を引いて、陣営の門外で丸一日待っていた者もいるという。\n\n彼らを義従に編成するには、なお鞍馬・甲械・糧餉を別に用意せねばならない。だがこの白馬の騎兵隊は、ようやく古参兵だけで名を支えずに済むようになった。"
 hd_maa_source.0004.a:0 "再び義従を募ることができる。"
 hd_wuhuan_qicong:0 "烏桓騎従"
 hd_wuhuan_qicong_flavor:0 "#F 烏桓の人々は水と草を追って暮らし、男子は幼い頃から騎射に長ける。漢はしばしばその部衆を騎従として募り、軍に従えて四方を征伐させた。行動は迅速で、襲撃と敗走する敵の追撃を最も得意とする。#!"
 hd_maa_source.0005.t:0 "烏桓諸部の離散"
 hd_maa_source.0005.desc:0 "北辺の烏桓の部族は、もはやあなたの徴発に応じなくなった。上谷・漁陽から遼東にかけての一帯は、あなたの手を離れたか、諸部が離反したかのいずれかで、遣わした使者が持ち帰ったのは言い逃ればかりだった。\n\nすでにあなたに従って戦っている烏桓騎従はなお軍中にあり、騎射の腕も変わらない。だがこうした騎手は幼い頃から馬の背で育った者たちであり、歩兵営の旗を一枚替えたところで、一人として揃いはしない。"
 hd_maa_source.0005.a:0 "増募はしばし控え、その帰順を待つ。"
 hd_maa_source.0006.t:0 "烏桓再び帰順す"
 hd_maa_source.0006.desc:0 "烏桓諸部の大人が使者を遣わし、再びあなたのために騎従を出したいと申し出た。使者の言葉は率直だった。糧餉さえ十分に与えられれば、部中の若者はいつでも馬に乗れる、と。\n\n騎従はまだ陣営に着いておらず、募集と拡充にはなお別に銭穀を割かねばならない。だが北辺からの騎兵の供給路は、再び通じたのである。"
 hd_maa_source.0006.a:0 "烏桓の騎兵、再び徴発できる。"
 hd_jizhou_qiangnu:0 "冀州強弩"
 hd_jizhou_qiangnu_flavor:0 "#F 冀州の材官は蹶張に習熟し、用いるのはいずれも足で踏んで引く強弩である。弩手は列を分けて交互に射放ち、矢はイナゴの群れのように飛ぶ。たとえ甲冑をまとって陣に突入する兵でも、近づくのは難しい。#!"
 hd_maa_source.0007.t:0 "冀州の弩手が募りがたい"
 hd_maa_source.0007.desc:0 "冀州諸郡に送った募兵の文書が、そっくりそのまま突き返されてきた。かの一帯はあなたの治下を離れたか、兵乱の後で戸口が流散したかのいずれかで、蹶張で弩を引ける壮丁は、当面ほとんど見つからない。\n\n弩機は職人に作らせればよいが、弩を射る人間は無から増やせはしない。すでに軍となった冀州の弩手はなお動かせるが、今後の布陣は、手元のこの者たちで算段するほかない。"
 hd_maa_source.0007.a:0 "今いる弩手で陣を布く。"
 hd_maa_source.0008.t:0 "冀州の弩手再び集う"
 hd_maa_source.0008.desc:0 "冀州諸郡は次第に旧観を取り戻し、郡吏の報告によれば、村々で弩を習う材官がまた募兵に応じるようになったという。あなたは、以前人手不足のために棚上げにしたいくつかの陣図を思い出した。\n\n弩機・矢筒・糧餉はいずれも別に費用をかけて調えねばならず、新たな弩手がひとりでに陣前に並ぶわけではない。だが今度こそ、少なくとも「器械あって人なし」と言われることはもうないだろう。"
 hd_maa_source.0008.a:0 "再び弩手の募集を計ることができる。"
 hd_xiandeng_ruishi:0 "先登鋭士"
 hd_xiandeng_ruishi_flavor:0 "#F 城を攻め陣を陥れるには、必ず先登の者がいる。冀州の鋭士は堅甲をまとい盾を執って、矢石を冒して城壁に一番乗りを争い、敵陣に斬り込み、一番乗りの功によって恩賞を得る。#!"
 hd_maa_source.0009.t:0 "先登の者なし"
 hd_maa_source.0009.desc:0 "冀州からの知らせによれば、先登鋭士はもはや選び募ることができなくなった。清河・鉅鹿の一帯は人手に渡ったか、人心が定まらないかのいずれかで、矢石を冒して城壁への一番乗りを争う決死の士は、もう募れない。\n\n陣中の現有の鋭士はなおあなたの命に従う。ただ今後、城を攻め陣を陥れる際、先陣を切る者は既存の数営から選ぶしかない。"
 hd_maa_source.0009.a:0 "先登の士は、しばし増募せぬ。"
 hd_maa_source.0010.t:0 "先登の募集再開"
 hd_maa_source.0010.desc:0 "冀州諸郡は再び安定し、貧賤に甘んじず戦功で身を立てようとする村々の若者たちが、またあなたの募兵の告示を探り始めた。\n\n甲械と賞銭はなお別に用意せねばならず、新たな営も一日で成るものではない。だが次に誰が先登するかと問われたとき、既存の数営だけを眺めて頭を抱えずに済むだろう。"
 hd_maa_source.0010.a:0 "再び敢戦の士を選ぶ。"
 hd_qingzhou_bing:0 "青州兵"
 hd_qingzhou_bing_flavor:0 "#F 青州は海に臨み、民の気風は剽悍で、乱世になるたびに人を集めて自衛してきた。その衆は格闘に勇敢だが統制しにくく、ひとたび号令が厳正で編成が適切となれば、侮れない歩兵となる。#!"
 hd_maa_source.0011.t:0 "青州の兵源の枯渇"
 hd_maa_source.0011.desc:0 "青州の募兵使者が手ぶらで戻ってきた。斉国・北海の一帯はあなたの手を離れたか、兵乱の後で流民が四散したかのいずれかで、営に編入しようと考えていたあの壮丁たちは、もはや探しようもない。\n\nすでに軍となった青州兵はなおあなたの号令に従う。だが軍籍に数を一つ多く書いたところで、陣営に一人多く立つわけではない。今後の用兵は、現有の人馬で計画するしかない。"
 hd_maa_source.0011.a:0 "兵数は実数に従い、水増しはせぬ。"
 hd_maa_source.0012.t:0 "青州で再び徴兵できる"
 hd_maa_source.0012.desc:0 "青州諸郡は再び安定し、流散した民も次々と故郷へ戻り、郡吏からはまた徴発できる壮丁がいるとの報告が届いた。かの地の人々は剽悍で戦いを好み、号令さえ厳正であれば良い兵になる。\n\n新兵は銭穀で招き、甲械を与えねばならず、ひとりでに陣営に入ってくるわけではない。だが青州という兵源は、ようやく再び通じたのである。"
 hd_maa_source.0012.a:0 "青州の衆、再び徴発できる。"
 hd_liujun_liangjiazi:0 "六郡良家子"
 hd_liujun_liangjiazi_flavor:0 "#F 隴西・天水・安定・北地・上郡・西河の六郡は戎狄に迫り、民俗として戦備を修め、気力を尊び、騎射を第一とする。漢の羽林・期門の多くはここから選ばれ、名将もまた多くこの地から出た。#!"
 hd_maa_source.0013.t:0 "六郡の子弟来たらず"
 hd_maa_source.0013.desc:0 "隴西・北地諸郡からの知らせによれば、良家の子弟はもはやあなたの徴召に応じない。かの一帯は人手に渡ったか、羌の乱がやまず村々が荒廃したかのいずれかで、騎射に秀でた若者の多くは別の行き先を見つけてしまった。\n\n陣中の現有の六郡騎士はなお命に従うが、さらに拡充しようにも、当面は手の付けようがない。騎射の士は声をかければすぐ集まるものではない――この古い言葉が、今日あなた自身に降りかかってきた。"
 hd_maa_source.0013.a:0 "騎兵の陣容は、ひとまず旧来の定数に従う。"
 hd_maa_source.0014.t:0 "六郡の子弟再び来たる"
 hd_maa_source.0014.desc:0 "六郡は再び安定し、村々の良家子がまた次々と弓を負い馬を引いて、陣営の前に応募しに来た。祖先がかつて羽林に入っていたと称し、ずいぶん自負に満ちた口ぶりの者もいる。\n\n彼らを騎兵の陣に編成するには、なお馬匹と糧餉を別に工面せねばならない。だが今後軍の拡充を議するとき、六郡は再び頼りになる供給源となる。"
 hd_maa_source.0014.a:0 "六郡の弓馬、再び我が籍に入る。"
 hd_huangzhong_yicong:0 "湟中義従"
 hd_huangzhong_yicong_flavor:0 "#F 湟中の月氏胡は漢に帰属し、義従と号した。彼らは河湟の山川に通じ、弓馬に習熟し、常に漢軍に従って諸羌を討った。散開すれば敵を偵察し、集まれば陣を陥れることができる。#!"
 hd_maa_source.0015.t:0 "湟中義従の離散"
 hd_maa_source.0015.desc:0 "金城・湟中一帯の義従胡は、もはやあなたの徴召に応じなくなった。かの地はあなたの手を離れたか、諸部が離反したかのいずれかで、遣わした使者は部族の大人に会うことすらできなかった。\n\nすでに軍に従っている義従はなおあなたの麾下にあり、辺境の道に通じ、騎射の腕も変わらない。ただ、地図の上で偵察を待っている道は、当初の見込みより何本も多くなってしまった。"
 hd_maa_source.0015.a:0 "ひとまず今いる義従を用いる。"
 hd_maa_source.0016.t:0 "湟中再び義従を遣わす"
 hd_maa_source.0016.desc:0 "湟中諸部が再び帰順し、部族の大人が子弟を遣わして、あなたのために騎従を出したいと申し出た。この者たちは河湟のあらゆる谷を知り尽くしており、羌人の動向について語らせれば、斥候よりも詳しい。\n\n彼らを呼び集めるにはなお銭穀がかかり、新たな騎兵も訓練を経ねば軍とはならない。だが辺境の道で人手が足りない日々は、ようやく終わらせることができる。"
 hd_maa_source.0016.a:0 "湟中義従、再び招集できる。"
 hd_bandun_congbing:0 "板楯賨兵"
 hd_bandun_congbing_flavor:0 "#F 巴郡の板楯蛮は木の板を楯とし、生まれつき剛勇で、陣前で歌い舞うことを好む。高祖はかつて彼らを用いて三秦を平定した。漢代に羌人がたびたび漢川を侵した際も、多くは彼らの兵によって撃退され、神兵と称された。#!"
 hd_maa_source.0017.t:0 "巴郡の賨人応ぜず"
 hd_maa_source.0017.desc:0 "巴郡の募兵使者が戻ってきたが、後ろには一人の賨人も連れていなかった。かの一帯は人手に渡ったか、諸部が離反したかのいずれかで、板楯諸姓の首領たちは皆、部中に出せる者はいないと言い逃れた。\n\n陣中の現有の板楯賨兵はなおあなたの命に従う。ただ今後、山道や険路での任務は、手元のこの数営に任せるほかない。"
 hd_maa_source.0017.a:0 "ひとまず今いる板楯の兵を用いる。"
 hd_maa_source.0018.t:0 "賨人再び出づ"
 hd_maa_source.0018.desc:0 "巴郡は再び安定し、板楯諸姓の首領が一族の子弟を連れてやってきて、陣営の前で太鼓を打って歌い、再びあなたのために兵を出したいと申し出た。\n\n盾・武器・糧餉はなお別に調達せねばならない。だがあの狭い道や険しい隘路を、再びあなたに代わって守る者ができた。"
 hd_maa_source.0018.a:0 "巴の賨人は剛勇なり、さらに人を加えられる。"
 hd_wudang_feijun:0 "無当飛軍"
 hd_wudang_feijun_flavor:0 "#F 南中は山深く林は密で、諸部の精兵は山を越え嶺を越えること平地を行くがごとく、弓弩と短兵をともに習い、向かうところ敵なし。ゆえに飛軍と称される。大軍が展開しにくい険しい地こそ、彼らが戦う場所である。#!"
 hd_maa_source.0019.t:0 "南中の精兵が徴しがたい"
 hd_maa_source.0019.desc:0 "南中からの知らせが届いた。建寧・牂牁の一帯はあなたの手を離れたか、諸部が背いたり従ったりと定まらないかのいずれかで、山の険しい道に慣れたあの精兵たちは、もはや徴発できない。\n\n現有の無当飛軍はなおあなたの号令に従う。だが山道は待ってはくれず、軍中に欠けた人手を、飛軍の名声で補うこともできない。"
 hd_maa_source.0019.a:0 "山地の用兵は、まず現有の兵を量れ。"
 hd_maa_source.0020.t:0 "南中の精兵再び至る"
 hd_maa_source.0020.desc:0 "南中諸郡は再び安定し、各部はまた精兵を出してあなたの徴召に応じるようになった。使者によれば、この者たちは山を越え嶺を越えること平地を行くがごとく、弓弩も短兵も使いこなすという。\n\n彼らを募るにはなお銭穀がかかり、訓練して軍とするにも時日を要する。だが次に険地で兵を用いるとき、既存の諸営から人を割くだけで済ませずともよい。"
 hd_maa_source.0020.a:0 "飛軍を再び徴集できる。"
 hd_wuxi_manbing:0 "五渓蛮兵"
 hd_wuxi_manbing_flavor:0 "#F 武陵の五渓の間では、蛮人が山に依り水に沿って暮らし、林の中を潜行し渓流のほとりで伏兵を設けることに慣れている。伏波将軍馬援は南征してこの地に至り、瘴癘に苦しめられて、ついに帰らなかった。#!"
 hd_maa_source.0021.t:0 "五渓の諸蛮従わず"
 hd_maa_source.0021.desc:0 "武陵五渓の蛮人は、もはやあなたの徴発に応じなくなった。かの一帯は人手に渡ったか、諸蛮が離反したかのいずれかで、遣わした使者は渓流のほとりで半月待ったが、得られたのはいくつかの言い逃ればかりだった。\n\n陣中の現有の五渓の兵士はなお命に従う。だが地図の上のあの曲がりくねった数本の水路は、もともと同じ一群の新兵を当てにしていた。今は別の手配をするほかない。"
 hd_maa_source.0021.a_keep:0 "五渓の兵の増募はしばし控える。"
 hd_maa_source.0022.t:0 "五渓の諸蛮再び帰順す"
 hd_maa_source.0022.desc:0 "五渓の諸蛮が再び帰順し、各地の首領が人を遣わして陣営の前で応募させた。彼らは林の中の小道や渓流のほとりの伏せ場所について、手に取るように語ってみせる。\n\n新兵はなお銭穀で募らねばならず、訓練を経ねば軍とはならない。だが林沢の間での用兵の難所に、ようやく再び頼れる者ができた。"
 hd_maa_source.0022.a:0 "山と渓の間に、再び募れる者がいる。"
 hd_shanyue_jiashi:0 "山越甲士"
 hd_shanyue_jiashi_flavor:0 "#F 山越は山の険に拠って王の租税を納めず、山中に銅鉄を産するので、自ら甲兵を鋳造する。降伏した後は、その屈強な者が軍伍に編入され、甲をまとい兵を執って、林や嶺の間での格闘に慣れている。#!"
 hd_maa_source.0023.t:0 "山越もはや山を出ず"
 hd_maa_source.0023.desc:0 "丹陽・会稽・豫章一帯の山越は、もはや山を下りて応募しなくなった。それらの山地はあなたの手を離れたか、諸宗部が再び険に拠って自衛しているかのいずれかで、遣わした者は山の入り口にすら入れなかった。\n\nすでに軍伍に編入された山越甲士はなおあなたの号令に従う。ただ、さらに兵を増やそうにも、当面は選べる者がいない。"
 hd_maa_source.0023.a:0 "現有の甲士は、従来どおり命に従う。"
 hd_maa_source.0024.t:0 "山越再び山を出づ"
 hd_maa_source.0024.desc:0 "山中の諸宗部が再び帰順し、屈強な若者たちがまた山から送り出されて、陣営の前で選抜を待っている。皆、自家で鋳た刀を背負い、強情な顔つきをしている。\n\n彼らに甲を着せ伍に編むには、なお別に銭穀がかかる。だが募れるのと募りようがないのとでは、やはり別のことである。"
 hd_maa_source.0024.a:0 "再び屈強な者を選んで甲を着せる。"
 hd_danyang_jingbing:0 "丹陽精兵"
 hd_danyang_jingbing_flavor:0 "#F 丹陽は山険の地で、民は果断で剛健な者が多く、武を好み戦に習い、気力を尊ぶ。天下で精兵といえば、しばしば丹陽が挙げられる。州郡に急があれば、往々にして使者をここへ遣わして兵を募る。#!"
 hd_maa_source.0025.t:0 "丹陽で募兵の手立てなし"
 hd_maa_source.0025.desc:0 "丹陽からの知らせに、あなたは眉をひそめた。郡は人手に渡ったか、兵乱の後で人心が定まらないかのいずれかで、例年は争って軍に身を投じていた山の民の若者が、今では一人も募れない。\n\n陣中の現有の丹陽精兵はなおあなたの指揮下にある。だが以前に新兵を当てにして組んだいくつかの配置は、計画し直すほかない。"
 hd_maa_source.0025.a:0 "用兵はまず実数を計れ。"
 hd_maa_source.0026.t:0 "丹陽で再び兵を募れる"
 hd_maa_source.0026.desc:0 "丹陽は再び安定し、郡吏の報告によれば、山中の若者がまた出てきて軍に身を投じるようになったという。丹陽兵の名は天下に知れ渡っており、知らせが広まるや、幕下の諸将は皆、今回は何人回してもらえるのかと探りに来た。\n\n一営を増やすにはやはり金がかかり、すぐに増募するかどうかはあなたが決めることだ。だがこの兵源は、ようやく再びあなたの手に戻った。"
 hd_maa_source.0026.a:0 "丹陽精兵、再び募れる。"
 hd_fuling_liannushi:0 "涪陵連弩士"
 hd_fuling_liannushi_flavor:0 "#F 涪陵の山の民は愚直で勇敢な者が多く、狩猟に慣れている。彼らは連弩で交互に矢を放ち、矢が途切れることなく続くので、山口や狭路を扼して守るとき、敵は隙に乗じて近づくことが難しい。#!"
 hd_maa_source.0027.t:0 "涪陵の弩士が募りがたい"
 hd_maa_source.0027.desc:0 "涪陵からの知らせが届いた。かの一帯はあなたの手を離れたか、山の民が離反したかのいずれかで、狩猟に慣れた壮丁たちは皆、深山に隠れてしまった。連弩は職人に同じように作らせることができるが、それを使える者は徴発できなくなった。\n\n陣中の現有の連弩士はなお号令に従う。今後、山口を扼して守るには、手元のこの弩陣に頼るほかない。"
 hd_maa_source.0027.a:0 "ひとまず今いる弩士で守備する。"
 hd_maa_source.0028.t:0 "涪陵の弩士再び集う"
 hd_maa_source.0028.desc:0 "涪陵は再び安定し、山中の猟師たちがまた山を下りて応募するようになった。彼らが連弩を手に試し撃ちすると、矢が一本また一本と的に突き立ち、幕下の職人たちもしきりにうなずいた。\n\n募集と訓練にはなお別に銭穀を払わねばならず、新たな軍がひとりでにやってくるわけでもない。だが人手がなくて棚上げにしていたあの守備の議の束を、ようやく再び取り出すことができる。"
 hd_maa_source.0028.a:0 "弩士を募れる。旧議を再開しよう。"
 hd_qiang_qi:0 "羌騎"
 hd_qiang_qi_flavor:0 "#F 西羌の諸種は隴右・河湟に散らばって住み、牧畜と狩猟を生業とする。羌騎は風のように去来し、集まれば陣となり、散れば追いがたい。涼州の豪傑が事を起こすときは、多くこれを爪牙として頼みとした。#!"
 hd_maa_source.0029.t:0 "羌騎来たらず"
 hd_maa_source.0029.desc:0 "隴右の諸羌は、もはやあなたの徴発に応じなくなった。金城・隴西の一帯は人手に渡ったか、諸種が背いたり従ったりと定まらないかのいずれかで、遣わした使者が持ち帰ったのは、数枚の羊の皮と一通りの言い逃ればかりだった。\n\n陣中の現有の羌騎はなおあなたの命に従う。ただ今後、快速の騎兵が必要な場所には、この数営を何度も往復させるほかない。"
 hd_maa_source.0029.a:0 "ひとまず今いる羌騎で計画する。"
 hd_maa_source.0030.t:0 "諸羌再び帰順す"
 hd_maa_source.0030.desc:0 "隴右の諸羌が再び帰順し、各部の豪帥が子弟を遣わして、あなたのために騎兵を出したいと申し出た。彼らが陣営の前で馬を走らせ騎射を披露すると、風のように去来するその姿に、漢の騎兵たちもひそかに喝采した。\n\n彼らを呼び集めるにはなお銭穀がかかり、編成にも時日を要する。だが再び快速の騎兵が必要になったとき、現有の部隊だけを往復させずともよい。"
 hd_maa_source.0030.a:0 "西羌の騎手、再び徴集できる。"
 hd_bingzhou_bianqi:0 "并州辺騎"
 hd_bingzhou_bianqi_flavor:0 "#F 并州は北に匈奴・鮮卑と接し、辺境の民は鞍馬の間に生まれ育ち、塞の道を知り、馳せ追うことに慣れている。天下に事あるとき、并州の騎兵は常に諸侯が争って招き寄せる精鋭であった。#!"
 hd_maa_source.0031.t:0 "并州の辺騎が募りがたい"
 hd_maa_source.0031.desc:0 "并州からの知らせによれば、辺騎はもはや募れなくなった。雁門・雲中の一帯はあなたの手を離れたか、胡騎が出没して辺境の民が流散したかのいずれかで、鞍馬の間に生まれたあの辺地の若者たちは、もう行方が知れない。\n\n陣中の現有の并州辺騎はなお命に従う。ただ、次の軍令の先後は、改めて考え直さねばならない。"
 hd_maa_source.0031.a:0 "騎兵を量ってから命を発する。"
 hd_maa_source.0032.t:0 "并州で再び騎兵を募れる"
 hd_maa_source.0032.desc:0 "并州の辺地は再び安定し、郡吏の報告によれば、辺境の民がまた応募するようになったという。塞の道を知り、馳せ追うことに慣れたあの若者たちが、弓を背負い馬を引いて、すでに郡城の外に幾組も集まっている。\n\n彼らを騎兵の陣に編成するには、なお別に投資が必要だ。だが本当に必要とあらば、すでに手を付けることはできる。"
 hd_maa_source.0032.a:0 "辺騎を募れる。行軍にも再び余裕が生まれる。"
 hd_tengjia:0 "藤甲兵"
 hd_tengjia_flavor:0 "#F 永昌の蛮人は山の藤を採って油に浸し、何度も日に干して甲冑に編み上げる。軽く強靭で、刀も矢も通しにくく、水を渡っても沈まない。ただ藤甲は火攻めを最も忌み、北の地の厳寒にも耐えられない。#!"
 hd_maa_source.0033.t:0 "永昌の藤甲が続かない"
 hd_maa_source.0033.desc:0 "永昌からの知らせによれば、藤甲兵はもはや徴発できなくなった。かの一帯はあなたの手を離れたか、諸部が背いたり従ったりと定まらないかのいずれかで、藤を採り油に浸して藤甲を編む職人も、それを着て戦場に出られる蛮兵も、もうあなたの召集には応じない。\n\n陣中の現有の藤甲兵はなお動かせる。ただ今後の用兵は、現有の人数で算段するほかない。"
 hd_maa_source.0033.a:0 "現有の部隊は、従来どおり命に従う。"
 hd_maa_source.0034.t:0 "藤甲再び出づ"
 hd_maa_source.0034.desc:0 "永昌諸部が再び帰順し、山中からはまた束ねた古藤と甲を編める職人が送られてきた。部中の蛮兵が新たに作られた藤甲をまとって陣営の前に並び、油でつやつやと光っている。\n\n新たな営に編成するには、甲械と兵士にはなお別に銭穀がかかる。だが棚上げにするほかなかった事柄に、今日再び手を付けられるようになった。"
 hd_maa_source.0034.a:0 "藤甲の士、再び募れる。"
 hd_maa_training_no_valid_trainer:0 "麾下には今のところ選抜訓練の任に堪える者がおらず、この件は取りやめるほかない。"
 hd_maa_training_invest_0_tt:0 "#EMP 新軍はあなたの首府で編成される。費用は抑えられるが、精粗や多寡は、主に選練者の腕前と、いくらかの運にかかっている。#!"
 hd_maa_training_invest_10_tt:0 "#EMP 新軍はあなたの首府で編成される。恩賞が手厚ければ、精鋭が幾分多く得られるかもしれない。#!"
 hd_maa_training_invest_20_tt:0 "#EMP 新軍はあなたの首府で編成される。全力で供給すれば、得られるものはより大きいはずだ。#!"
 hd_debug_prepare_youzhou_tuqi_decision:0 "【デバッグ】幽州突騎の軍制を設立"
 hd_debug_prepare_youzhou_tuqi_decision_desc:0 "通常の条件を無視して幽州突騎の軍制を設立し、直轄の兵源テストに必要な統制度を補う。"
 hd_debug_prepare_youzhou_tuqi_decision_tooltip:0 "幽州突騎の募集・拡充・兵源変化のテスト用。"
 hd_debug_prepare_youzhou_tuqi_decision_effect:0 "幽州突騎のテスト条件が設定された。"
 hd_debug_train_xianzhenying_decision:0 "【デバッグ】陥陣営を訓練"
 hd_debug_train_xianzhenying_decision_desc:0 "自分自身を訓練者として、直接陥陣営の訓練イベントに入る。"
 hd_debug_train_xianzhenying_decision_tooltip:0 "陥陣営の投資と編成結果のテスト用。"
 hd_xianzhenying:0 "陥陣営"
 hd_xianzhenying_flavor:0 "#F 高順の率いる部隊は人数こそ多くないが、鎧と器械は精錬されて整い、攻撃するたびに破らぬことはなく、世に陥陣営と称された。重甲が隙なく連なり、号令は乱れない。陣を破る鋭い刃である。#!"
 hd_xianzhenying_army:0 "陥陣営"
 hd_maa_training.1000.t:0 "陥陣営の訓練"
 hd_maa_training.1000.desc:0 "[hd_maa_trainer.GetTitledFirstName]は選練の議をあなたの机上に差し出したが、まず口にしたのは勇力ではなく軍紀だった。陥陣の士は刃に向かって前へ進む度胸が要るが、それ以上に仲間の傍らに踏みとどまる覚悟が要る。真っ先に飛び出す者ばかり選んでも、ともに生きて帰れる者が選べるとは限らない。\n\n甲片、盾、賞銭――[hd_maa_trainer.GetSheHe]は一つ一つ指し示した。腕利きが身を投じるかどうかは、賞銭だけでなく、あなたが自ら表に出て、自分の名望をもって彼らに前途を約束するかどうかにもかかっている。出費を惜しむほど、選べる人間は少なくなる。\n\nこの軍はまだ形を成していないのに、出費のほうが先に陣を組んでいる。"
 hd_maa_training.1000.a:0 "力に応じて行い、勇者を選んで軍とする。"
 hd_maa_training.1000.b:0 "選んだ兵に厚く賞し、甲械を十分に備える。"
 hd_maa_training.1000.c:0 "府庫を惜しまず、鋭士を選び尽くせ！"
 hd_maa_training.1001.t:0 "陥陣営の成軍"
 hd_maa_training.1001.desc_tier1:0 "練兵場で、新たに編成された陥陣営が陣を組んだ。[hd_maa_trainer.GetTitledFirstName]はあなたとともに演習を見終えると、その欠点を隠さなかった。陣替えがやや遅く、前後の連携も十分に緊密ではない。\n\nそれでもこの軍はついに成り、もはや空っぽの名から始める必要はない。ただ今後彼らをどこへ派遣するにせよ、今日目にしたこのためらいを覚えておかねばならない。響きのよい軍号に目を曇らされてはならないのだ。"
 hd_maa_training.1001.desc_tier2:0 "新たに編成された陥陣営が、練兵場で一通りの演習を行った。甲械は揃い、隊伍は整い、進退もおおむね号令に従っている。[hd_maa_trainer.GetTitledFirstName]の評はごく淡々としたもので、最後に「使えます」と一言添えただけだった。\n\nそれで十分である。陥陣の名は身内に向けて叫ぶものではない。戦場に出れば、盾の後ろの一人一人が自分の持ち場を守れるかどうかにかかっている。これからは誰が前へ進めるかと問われたとき、あなたには考慮に入れられる部隊が一つ増えたのだ。"
 hd_maa_training.1001.desc_tier3:0 "太鼓が鳴るや、陥陣営の前列は盾を掲げ、後隊が続いて進み、兵を収める際も先を争うことばかり考える者は一人もいなかった。将台から見ていたあなたは、知らず知らずのうちに欄干を押さえていた手を緩めていた。\n\nこれは甲冑をまとっただけの向こう見ずの群れではなく、号令が前後に通じた一つの軍である。これまでに注いだ銭穀と名望は、ようやく目に見える形となった。"
 hd_maa_training.1001.desc_tier4:0 "演習の終わりに太鼓が急調子に変わると、陥陣営は全営そろって陣を収め、最後の一列さえ乱れなかった。[hd_maa_trainer.GetTitledFirstName]は振り返ってあなたに礼をし、珍しく得意げな表情を見せた。\n\n前列が敵に接し、後隊が補い、号令一つで全営が順序よく退くこともできる。この新軍を眺めながら、あなたはもう次の軍議に彼らを書き込みたくてたまらなくなっていた。"
 hd_maa_training.1001.a:0 "陥陣の士よ、我が軍令を聞け。"
 hd_hubaoqi:0 "虎豹騎"
 hd_hubaoqi_flavor:0 "#F 曹氏が自ら率いた精鋭騎兵で、兵士の多くは百人将の中から抜擢され、天下の驍鋭と号された。甲をまとって疾駆突撃し、開けた地で一気に陣を破り、敗軍をどこまでも追撃することを得意とする。#!"
 hd_hubaoqi_army:0 "虎豹騎"
 hd_maa_training.1100.t:0 "虎豹騎の訓練"
 hd_maa_training.1100.desc:0 "[hd_maa_trainer.GetTitledFirstName]は虎豹騎の選練について語るにあたり、まず馬の値段をあなたに示し、さらに甲械と選抜の費用を書き加えた。銭穀の帳簿には、軽く流せる項目がほとんどない。\n\n「騎手が進む度胸を持っていても、馬もまた進めねばなりませぬ」と[hd_maa_trainer.GetSheHe]は言った。虎豹騎の兵士は昔から百人将の中から抜擢されてきた。こうした者たちが旧部を捨ててまで身を投じるのは、恩賞のためだけでなく、一時に名高い主君に従うためでもある。\n\n敵陣へ駆け出す前に、この騎兵隊はまずあなたの府庫の前を通らねばならない。"
 hd_maa_training.1100.a:0 "今いる騎手の中から優れた者を選ぶ。"
 hd_maa_training.1100.b:0 "騎士に厚く賞し、馬と甲を充実させる。"
 hd_maa_training.1100.c:0 "良馬と鋭士、資財を惜しむな！"
 hd_maa_training.1101.t:0 "虎豹騎の成軍"
 hd_maa_training.1101.desc_tier1:0 "虎豹騎は軍として成ったが、演習は思っていたほど胸のすくものではなかった。騎手はそれぞれ腕を持っているが、一つにまとまって陣形を変える際には前後にばらつきがあり、太鼓が鳴っても誰もが揃って進退するわけではない。\n\nあなたは少々落胆したが、席を蹴って立ち去りはしなかった。新たな騎兵はともかく使えるのであり、もはや一枚の計画書にとどまるものではない。実際に彼らを敵に当てるときは、今日目にしたこのためらいを覚えておかねばならない。"
 hd_maa_training.1101.desc_tier2:0 "虎豹騎が練兵場を一周駆け抜けた。何よりあなたの目を引いたのは、騎兵隊が前後途切れずに続き、順序を乱さなかったことだ。馬を駆って前へ出られる者は多いが、号令に従って踏みとどまれる者も、同じく得がたい。\n\n甲械も編成もすでに整っている。あなたはこれで次の戦は必勝だと大言しはしなかった。だが今後平原での戦を議するとき、手元には確かに一つの重みが加わったのである。"
 hd_maa_training.1101.desc_tier3:0 "太鼓の音の中、虎豹騎は陣列を展開し、突進した後も号令に従って向きを転じた。騎手と乗馬の息は寸分の狂いもなく合っている。こわばっていたあなたの表情も、ようやく緩んだ。\n\nこれは胆力だけで寄せ集めた部隊ではない。選練の際に費やした銭帛は、今や命令に従う馬蹄へと姿を変えた。あなたは心の中で、まずどの方面で敵に当たらせるべきかを思案した。"
 hd_maa_training.1101.desc_tier4:0 "虎豹騎が練兵場の一端から疾駆してきて、将台の前で一斉に手綱を引いた。蹄の音がぴたりと止み、舞い上がった土埃がしばらくしてようやく落ち着いた。[hd_maa_trainer.GetTitledFirstName]があなたの傍らで低く言った。「天下の驍鋭、ことごとくここにあり」\n\n甲械、馬匹、陣列、どれ一つとして非の打ち所がない。初めは重く感じられたあの出費も、今思えば、大したことではなかった。"
 hd_maa_training.1101.a:0 "虎豹は集った。命を待って突撃せよ。"
 hd_baier:0 "白毦"
 hd_baier_flavor:0 "#F 白毦は劉備の幕下の親兵で、白い毦飾りを印とする。陳到がこの軍を率い、趙雲と並んで忠勇をもって知られた。危急にあっては主を護り、決して軽々しく本陣を離れなかった。#!"
 hd_baier_army:0 "白毦"
 hd_maa_training.1200.t:0 "白毦の訓練"
 hd_maa_training.1200.desc:0 "[hd_maa_trainer.GetTitledFirstName]が白毦の選練の議を差し出した。どれほどの勇士を選べるのかとあなたが問うと、[hd_maa_trainer.GetSheHe]はまず、敵に遭ったとき誰が空いた所を埋め、誰が退却を援護するかを語り始めた。\n\n護衛の軍は甲が良く力が強いだけでは足りず、他の者が退くときにも自分の持ち場を守り抜かねばならない。そうした者は見つけにくく、身を投じる者も、主君が命を託すに値するかどうかを見極める。あなたの名望こそが、彼らに約束する証となるのだ。\n\n手間を惜しんで適当に一隊を編んだだけでは、最も彼らを必要とするときに、軍号がいくら立派でも何の役にも立たない。"
 hd_maa_training.1200.a:0 "今ある資財に応じて、護衛を選練する。"
 hd_maa_training.1200.b:0 "厚く賞して優れた者を選び、甲械を十分に備える。"
 hd_maa_training.1200.c:0 "護衛の軍には、力の限り供給せよ。"
 hd_maa_training.1201.t:0 "白毦の成軍"
 hd_maa_training.1201.desc_tier1:0 "白毦は編成を終えたが、演習の中で互いの援護がもたつく箇所がいくつかあり、それを見たあなたは思わず眉をひそめた。\n\n護衛の軍が最も恐れるのは、補うべきときにためらうことだ。だがこの新軍が使えないわけではなく、あなたの期待がより高かったからといって、この選練にまったく得るものがなかったとみなすわけにはいかない。今後彼らをどこに置くかは今の力量に応じて決めねばならず、白毦の二字だけを頼みに安心して背を向けるわけにはいかない。"
 hd_maa_training.1201.desc_tier2:0 "白毦が練兵場で一通りの演習を行った。隊伍は乱れず、前後は持ちこたえ、兵を収める際にも後列を気遣う者がいる。見終えてから、あなたは自分が終始いちばん気にかけていたのが最後のくだりだったことに気づいた。\n\n彼らの誰もが一人で一方面を担えるとは限らないが、一つにまとまれば、もはや各自が勇を誇る人の群れではなく、統率の取れた護衛のように見える。以前は両立しがたかったいくつかの守備も、今なら改めて考え直せるだろう。"
 hd_maa_training.1201.desc_tier3:0 "演習の中で、あなたが特に注意深く見た場面が一つあった。前列が向きを転じるとき、後隊がすかさず隙間を埋め、隊列が整うまで援護を失わなかったのだ。\n\n進退の間に仲間を守り抜ける者こそ、背後の道を託すに値する。今回の選練の結果は当初の望み以上であり、費やした銭帛を、あなたはもはや惜しいとは思わなかった。"
 hd_maa_training.1201.desc_tier4:0 "演習が終わりかけたところで、あなたは後隊が前列を受け止めるあのくだりをもう一度演じさせた。他の者が皆軍容に見入る中、あなただけはその細部を気にかけていた。\n\n進退は整然とし、向きを転じる際も互いを護り合う。いつか戦場で退かねばならぬ日が来たなら、あなたが見たいのはまさにこのような隊伍であって、誰もが自分の足元の道しか知らぬ集団ではない。つい先ほどまで重く感じていたこの選練の費用にも、今は一言たりとも文句のつけようがない。"
 hd_maa_training.1201.a:0 "白毦は成った。陣の後ろを託せる。"
 hd_jiefanbing:0 "解煩兵"
 hd_jiefanbing_flavor:0 "#F 解煩兵は孫呉の中軍の精鋭で、主君の煩難を解くという意から名づけられた。急報があるたびに信任厚い将が率いて夜を徹して救援に駆けつけ、林沢の間を自在に転戦する。#!"
 hd_jiefanbing_army:0 "解煩兵"
 hd_maa_training.1300.t:0 "解煩兵の訓練"
 hd_maa_training.1300.desc:0 "[hd_maa_trainer.GetTitledFirstName]は選練の議を広げ、解煩兵がどのように隊を分けて援護し、敵に遭えば再び合流すべきかを説いた。聞きながら、あなたは一通ごとに催促の度を増していったあの軍報を思い出していた。\n\n速さとは、ただ足が速いことではない。武器と行装が足を引っ張ってはならず、小隊が本陣を離れても号令をわきまえていなければならない。さもなければ、早く着いても早く散るだけだ。[hd_maa_trainer.GetSheHe]が言うには、こうした腕利きはどこでも奪い合いになっており、彼らを招くには賞銭のほかに、あなたの名声も頼みにせねばならないという。\n\n軍中の煩いを解く前に、まず目の前のこの勘定を解かねばならない。"
 hd_maa_training.1300.a:0 "今いる兵士の中から優れた者を選ぶ。"
 hd_maa_training.1300.b:0 "厚く賞して選び募り、部隊を充実させる。"
 hd_maa_training.1300.c:0 "急に応ずる軍、全力で備えよ！"
 hd_maa_training.1301.t:0 "解煩兵の成軍"
 hd_maa_training.1301.desc_tier1:0 "解煩兵は編成を終えたが、演習で隊を転じる際の呼応が十分に迅速ではなかった。それを目にしたあなたは、彼らに任せるつもりだった急務の一つを、ひとまず机の端に戻した。\n\nこの軍に何の収穫もなかったとは言えないが、切迫した場面で独力で臨機応変に動くことまで、過大な期待を抱くのはまだ早い。軍号はすでに立った。今後彼らをどう適切に用いるかは、なおあなたの心配りにかかっている。"
 hd_maa_training.1301.desc_tier2:0 "解煩兵は練兵場で何度か分散と合流を繰り返した。各隊は散ることも集まることもでき、号令を受ければすぐさま向きを変え、前へ走ることばかり考えて援護を失う者もいない。\n\nこの新軍があらゆる急務を一手に引き受けられるとは限らないが、すでに動かせる手勢である。以前のあちこちをやりくりする算段を見直してみると、あなたの心はいくらか軽くなった。"
 hd_maa_training.1301.desc_tier3:0 "演習の中で、解煩兵の各隊は交互に進退し、援護も収束も手際よくこなした。分かれればすぐ散ってしまうのではと案じていたあなたも、ここでようやく胸をなで下ろした。\n\n駆け回る力がありながら、仲間の号令にも耳を傾けられる。これでこそ急に応ずる軍であり、名を変えただけの並の歩兵ではない。真の急難に間に合うかどうかはあなたの采配次第だが、軍中に使える人材が増えたのは確かだ。"
 hd_maa_training.1301.desc_tier4:0 "[hd_maa_trainer.GetTitledFirstName]は地図の上で各隊の行き先を一つずつ示した。どの隊が分かれて敵を遮り、どの隊が背後に回って援護し、最後にどこで合流するか。練兵場の解煩兵は果たして寸分違わず、どの隊も時刻どおりに合流した。\n\nあなたは、かつてどこもかしこも人手が足りず、どうやりくりしても遅すぎた日々を思い出した。今や、本当に彼らに託す最初の軍令を何にすべきか、考えずにはいられなくなっている。"
 hd_maa_training.1301.a:0 "軍中に急あらば、解煩を動かせる。"
 hd_quyi_xiandeng:0 "麴義先登"
 hd_quyi_xiandeng_flavor:0 "#F 麴義は長く涼州にあり、羌の戦い方に通じていた。界橋の戦いで、彼は先登の士を盾の下に伏せさせ、強弩を両側に挟んで支え、敵騎が迫るのを待って一斉に放ち、白馬義従を大いに破った。#!"
 hd_quyi_xiandeng_army:0 "麴義先登"
 hd_maa_training.1400.t:0 "麴義先登の訓練"
 hd_maa_training.1400.desc:0 "[hd_maa_trainer.GetTitledFirstName]は先登弩軍の訓練について語るにあたり、まず兵士が敵騎に迫られても手を震わせずにいられるかを問うた。弩機の値段を眺めていたあなたは、そこでようやく顔を上げた。\n\n強弩は買えるが、盾の下に伏して号令を待てる人間は念入りに選ばねばならない。[hd_maa_trainer.GetSheHe]は盾持ち、弩の装填、斉射を一連のものとして練り上げるつもりで、ばらばらに訓練させる気はない。決死の士が命を差し出すかどうかも、兵を率いる主君が一時に名高く、死をもって報いるに値するかどうかにかかっている。\n\n幕の外では伝令が控えており、机上に欠けているのはあなたの最後の一言だけだ。"
 hd_maa_training.1400.a:0 "今ある資財に応じて、弩陣を選練する。"
 hd_maa_training.1400.b:0 "厚く賞して人を選び、弩械を十分に備える。"
 hd_maa_training.1400.c:0 "全力で供給し、先登を練り上げよ！"
 hd_maa_training.1401.t:0 "麴義先登の成軍"
 hd_maa_training.1401.desc_tier1:0 "先登弩軍は編成を終えたが、演習では号令が下る前に矢を放ってしまう場面が何度かあった。あなたはそれらを書き留め、「強弩、騎を破る」という評判にこれらを覆い隠させまいとした。\n\n陣列はひとまず土台ができたが、敵に臨んでどこまで落ち着いていられるかは、あなたの願うほど誇張できるものではない。今後本当に彼らに騎兵の陣を迎え撃たせるなら、まず今日のこのためらいを覚えておかねばならない。"
 hd_maa_training.1401.desc_tier2:0 "盾の列と弩手は互いに呼応できるようになり、斉射の際も号令に耳を傾けている。演習を見終えたあなたは、うなずいた。\n\nどんな敵陣の前でも山のごとく動かずにいられるとまでは言えないが、弩軍としてあるべき規律はすでに備わっている。次に騎兵の脅威を議するとき、どう避けるかばかり考えずに済むだろう。もっとも実際に交戦するまでは、的場に放った弩の矢が、あなたに代わって前もって一戦に勝ってくれるわけではない。"
 hd_maa_training.1401.desc_tier3:0 "演習の中で、弩陣は命を待ち、一斉に放ち、態勢を立て直す順序がはっきりしており、あなたが最も案じていた抜け駆けや乱れは、一つとして見られなかった。\n\n盾と弩は、もはやばらばらに戦うことはない。敵と接する場所さえうまく選べば、攻め寄せる騎兵に代償を払わせることも望めるだろう。先登の法はもはや威勢のいい一言ではなく、あなたが命令を下せる一つの軍となったのである。"
 hd_maa_training.1401.desc_tier4:0 "「令が下らぬうちは、弩陣に先に放つ者なし」[hd_maa_trainer.GetTitledFirstName]がそう言ったとき、練兵場の弩手たちは盾の下に伏したまま、微動だにしなかった。太鼓が鳴り止むや、万の矢が一斉に放たれ、的はたちまち矢柄で埋め尽くされた。\n\nあなたは、かつて騎兵を前にして何度も変更を余儀なくされた布陣を思い出し、思わず指先で袖口を握りしめた。避けて通るしかなかったあの道々も、今日なら改めてじっくり見直せる。"
 hd_maa_training.1401.a:0 "令が至れば一斉に放て。陣脚を乱すな。"
 hd_suwei_hushi:0 "宿衛虎士"
 hd_suwei_hushi_flavor:0 "#F 許褚が統べた宿衛は虎士と号し、多くは彼に従って事を起こした豪侠の壮士であった。彼らは昼夜主君の左右に侍り、刺客も乱兵も近づくことはできなかった。#!"
 hd_suwei_hushi_army:0 "宿衛虎士"
 hd_maa_training.1500.t:0 "宿衛虎士の訓練"
 hd_maa_training.1500.desc:0 "[hd_maa_trainer.GetTitledFirstName]が虎士の選練を議しに来て、礼を終えた後もあなたのすぐそばに立っていた。自分のために近衛を選ぼうとしているこの人物を眺めていると、銭穀の帳簿の数字もさほど目障りには思えなくなった。\n\n[hd_maa_trainer.GetSheHe]のやり方は明快だ。まず勇健な者を選び、次に命令を守れるかを見て、甲械と恩賞もそれに見合ったものにする。命を賭して主君を護る豪侠の士が重んじるのは知遇の恩である。あなたが自ら表に出て名望をもって約束しなければ、いくら金を積んでも招けはしない。\n\n平時に見栄えがよいだけの近衛なら、わざわざ軍号を立てる価値はない。"
 hd_maa_training.1500.a:0 "今ある資財に応じて、勇者を選び護衛とする。"
 hd_maa_training.1500.b:0 "厚く賞して優れた者を選び、近衛を充実させる。"
 hd_maa_training.1500.c:0 "身辺の軍には、資財を惜しまぬ。"
 hd_maa_training.1501.t:0 "宿衛虎士の成軍"
 hd_maa_training.1501.desc_tier1:0 "虎士は軍として成ったが、演習ではなおいくつかの連携に遅れが見られた。近衛はあなたの最も近くに立つ者たちであるだけに、些細な手抜かりもひときわ目につく。\n\nだがこの軍はともかく形を成したのであり、意に満たないからといって、今回の選練を無駄だったとみなすわけにはいかない。どこを託せて、どこにはなお用心が要るか、あなたは誰よりもはっきりと覚えておかねばならず、虎士の二字だけで安心してはならない。"
 hd_maa_training.1501.desc_tier2:0 "虎士があなたの前で一通りの演習を行った。甲械は揃い、隊列の入れ替えは整然とし、号令は前後に通じている。最後まで見て、あなたはずっと剣の柄にかけていた手がいつの間にか離れていたことに気づいた。\n\nこの新軍を万能と称する必要はない。自分の持ち場を守り抜けさえすれば、残しておく価値がある。以前は両立しがたかったいくつかの護衛の手配も、今なら改めて相談できる。"
 hd_maa_training.1501.desc_tier3:0 "命令の受領、隊列の入れ替え、相互の援護――虎士の演習のどの場面も、美辞麗句でごまかしたものではなかった。あなたは思わず二歩前に出て、さらに注意深く見入った。\n\n費やした銭穀は、ついにまともな護衛となって返ってきた。急変があっても、その場しのぎに他から人を引き抜いて埋めずに済むと思うと、張り詰めていた心の糸がようやく少し緩んだ。"
 hd_maa_training.1501.desc_tier4:0 "演習が終わるや、虎士は一斉に兵を収めて立ち止まり、甲の札が触れ合う音がぴたりと止んだ。[hd_maa_trainer.GetTitledFirstName]が進み出て報告したが、あなたはまず振り返って背後に目をやった。宿衛といえば、人がまず思い浮かべるのは、結局のところ自分に最も近いあの数歩なのだ。\n\n隊列の入れ替え、援護、号令、どれ一つとして非の打ち所がない。あの金は確かに無駄ではなかった。少なくとも今日は、このような部隊が身辺を守っていると知って、あなたはいくらか安心できる。"
 hd_maa_training.1501.a:0 "虎士は命に従い、宿衛に備えあり。"
 hd_nanman_xiangbing:0 "南蛮象兵"
 hd_nanman_xiangbing_flavor:0 "#F 南中の徼外の諸部は象を馴らして兵とし、御者が象の背にまたがって、これを駆って陣に突入させる。巨象の通った後は隊列が崩れ散り、中原の兵馬は初めてこれを見ると、戦う前から怯えることが多い。#!"
 hd_nanman_xiangbing_army:0 "南蛮象兵"
 hd_maa_training.1600.t:0 "南蛮象兵の訓練"
 hd_maa_training.1600.desc:0 "[hd_maa_trainer.GetTitledFirstName]が象兵の出費を机上に並べた。飼い葉、装具、御者と、項目が次々と続く。その数字を見て、あなたは危うく、軍中で養わねばならないのは象だけでなく、決して満たされることのない口なのではないかと思った。\n\nだが[hd_maa_trainer.GetSheHe]がまず語ったのは進退の号令だった。戦象は前途を切り開けるが、それを止め、向きを変えさせる者もいなければならない。前へ追い立てることしかできなければ、後ろに立つ兵士も安心できない。南中諸部の象使いの名手はやすやすと山を出てはこず、彼らを動かすには金だけでなく、あなたの名声も要る。\n\n象軍に要するものは莫大だ。最後の一言は、あなたが言わねばならない。"
 hd_maa_training.1600.a:0 "今ある資財に応じて象軍を整える。"
 hd_maa_training.1600.b:0 "資財を追加し、選練を充実させる。"
 hd_maa_training.1600.c:0 "象軍に要するものは、力の限り供給せよ。"
 hd_maa_training.1601.t:0 "南蛮象兵の成軍"
 hd_maa_training.1601.desc_tier1:0 "象兵は軍として成ったが、演習では向きを転じる際に滑らかさを欠く場面が何度かあった。あの巨体が練兵場でためらいがちにぐるぐると回るのを見て、あなたは思わず動きを止めた。\n\n御者も部隊もすでに編成されたが、まだ練度が足りない。どこへ派遣し、どう戦わせるかは、その恐るべき威勢だけを見て軽々しく決めてはならない。軍令の手配を誤れば、先に驚くのは敵とは限らないのだ。"
 hd_maa_training.1601.desc_tier2:0 "御者は号令に従って象を前進させ、向きを転じさせ、護衛の兵もすでに適切に編成されている。あなたは何度も見返して、ようやくこの新軍への懸念を下ろした。\n\nこれほどの威勢は、並の歩兵の陣のやり方では測れない。実際に敵と当たるときには、彼らが力を振るえるだけの場所を十分に残し、後隊にも気を配らねばならない。費やした資財は、ともかく実を結んだ。"
 hd_maa_training.1601.desc_tier3:0 "象兵の前進、転回、収束はいずれもきちんと型にはまっており、御者と護衛の息もぴったりだ。一通り見終えて、あなたはようやく、あの重い出費がそれに見合う重みのものに変わったと感じた。\n\nその威勢は、もはや遠くから眺めて感嘆するだけのものではなく、軍令に従って動かせるようになった。今日得たものが良ければ良いほど、今後の軽率な采配でそれを無駄にしてはならない。"
 hd_maa_training.1601.desc_tier4:0 "象の陣がゆっくりと進み、将台の前で一声長く鳴くと、一斉に足を止めた。[hd_maa_trainer.GetTitledFirstName]は両腕を広げて象の陣の幅を示していたが、あなたが見ているのに気づくと、慌てて腕を下ろした。あなたはかえって笑い、[hd_maa_trainer.GetSheHe]に続けるよう促し、とりわけ向きの転じ方をしっかり説明させた。\n\n最初は恐ろしいほどだったあの資財の帳簿も、ついに同じだけ重みのあるものに変わった。いつか敵軍が本当に象の陣の前進を目にしたなら、その顔に浮かぶ表情も、こうして事細かに報告するに値するものであってほしい。"
 hd_maa_training.1601.a:0 "象軍は列をなした。命を待って進め。"
 hd_baiyibing:0 "白衣兵"
 hd_baiyibing_flavor:0 "#F 呂蒙が江陵を襲取した際、精兵を船中に伏せさせ、櫓を漕ぐ者には皆白衣を着せて商人に扮させ、昼夜兼行で進んだ。長江沿いの烽火台の見張りはことごとく捕らえられ、誰も気づかなかった。以来、軽装で奇襲する兵の多くは白衣を号とした。#!"
 hd_baiyibing_army:0 "白衣兵"
 hd_maa_training.1700.t:0 "白衣兵の訓練"
 hd_maa_training.1700.desc:0 "[hd_maa_trainer.GetTitledFirstName]は白衣兵の選練について語るにあたり、まず甲械を数えるのではなく、誰が道を見分けられるか、誰が本隊を離れた後も約束の行き先を覚えていられるかを問うた。\n\nあなたは手を伸ばし、地図上の小旗を一本、道の脇に移した。軽装とは荷物をいくつか減らせば済むものではなく、分隊とは人を適当にばら撒くことでもない。いざというとき互いを見つけられなければ、どれほど速い足も隊を一層ばらばらにするだけだ。こうした腕利きは、賞銭だけでなく、あなたの名望によっても招かねばならない。\n\n敵に臨んでは身軽に動いてもらいたいが、今の銭穀は量らずにはいられない。"
 hd_maa_training.1700.a:0 "今いる兵士の中から優れた者を選んで練兵する。"
 hd_maa_training.1700.b:0 "腕利きに厚く賞し、部隊を充実させる。"
 hd_maa_training.1700.c:0 "軽兵を精練せよ。全力で支援する。"
 hd_maa_training.1701.t:0 "白衣兵の成軍"
 hd_maa_training.1701.desc_tier1:0 "白衣兵は編成を終えたが、演習で援護の手際が悪い箇所がいくつかあった。それを見たあなたは、彼らに任せるつもりだった危険な任務の一つを、ひとまず棚上げにした。\n\n身軽さという長所に何の収穫もなかったわけではないが、散った後にどう再び集まるかは、あなたが思っていたほど安心できるものではない。軍号の響きがよいというだけで彼らを遠くへ送りすぎれば、結局痛い目を見るのはあなたの兵である。"
 hd_maa_training.1701.desc_tier2:0 "白衣兵の演習はなかなか安定していた。分隊も援護も号令どおりにこなし、速さを競うあまり仲間を見失う者もいない。あなたは以前の懸念をいくらか下ろした。\n\nこの部隊はまだ「神出鬼没」の賛辞には値しないが、すでに役に立つ。今後追跡や援護の軍務に出くわしても、鈍重な本隊にいつも兼務させずに済むだろう。"
 hd_maa_training.1701.desc_tier3:0 "白衣兵の各隊は離合が整然とし、援護も時宜を得て、移動の際にもあなたが案じていた乱れは見せなかった。演習を見終えて、あなたは今回の選練は十分価値があったと思った。\n\n脚力に加え、互いに連携できる一揃いの号令もある。林や嶺の間で敵を追い、道を断ち、あるいは撤収を援護するのに、ようやく使える部隊ができた。正面からの威勢で勝つのでない部隊ほど、最初の軍令はよく考えねばならない。"
 hd_maa_training.1701.desc_tier4:0 "演習が始まって間もなく、白衣兵は練兵場から跡形もなく姿を消した。あなたがいぶかっていると、[hd_maa_trainer.GetTitledFirstName]が振り返るよう促した。いくつかの軽兵の隊が、いつの間にか将台の後ろに回り込み、命令どおりに整列していたのだ。\n\n地図上の小道に沿って目をやると、あの目立たない脇道が、にわかにどれも使い道を持ち始めた。敵に臨んで、兵が到着するまで相手に誰が来たのか悟らせずにいられるなら、それこそあなたが真に覚えておくべきことだ。"
 hd_maa_training.1701.a:0 "軽兵の備えは整った。慎重に進退を定めよ。"
