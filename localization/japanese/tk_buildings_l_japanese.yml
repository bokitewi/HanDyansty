l_japanese:

 #####三国新增建筑
 building_type_TK_20_10_WaHuangGong: "陵墓・祖地"
 building_type_TK_20_10_WaHuangGong_desc: "先王や聖賢が眠り、あるいは祀られる所。後の人々は時節ごとにここへ参って祭り、先祖の功徳を偲ぶ。"
 TK_20_10_WaHuangGong: "媧皇宮"
 building_TK_20_10_WaHuangGong: "$TK_20_10_WaHuangGong$"
 building_TK_20_10_WaHuangGong_desc: "伝説によれば、女媧はここで土をこねて人を造り、石を練って天を補ったといい、崖の間には今なおその遺跡が残る。晩春になると、遠近の郷人が香を携えて山に登り、媧皇に子宝と豊作を祈る。"
 building_type_TK_20_10_FuXiMiao: "陵墓・祖地"
 building_type_TK_20_10_FuXiMiao_desc: "先王や聖賢が眠り、あるいは祀られる所。後の人々は時節ごとにここへ参って祭り、先祖の功徳を偲ぶ。"
 TK_20_10_FuXiMiao: "伏羲廟"
 building_TK_20_10_FuXiMiao: "$TK_20_10_FuXiMiao$"
 building_TK_20_10_FuXiMiao_desc: "陳の地は太昊伏羲氏の旧都と伝えられる。伏羲は八卦を描き、網を編み、婚姻の礼を定めたことから人祖として尊ばれ、毎年正月には四方の村の民が連れ立って「人宗に朝す」ために訪れ、香の煙が終日絶えない。"
 building_type_TK_20_10_HuangDiLing: "陵墓・祖地"
 building_type_TK_20_10_HuangDiLing_desc: "先王や聖賢が眠り、あるいは祀られる所。後の人々は時節ごとにここへ参って祭り、先祖の功徳を偲ぶ。"
 TK_20_10_HuangDiLing: "黄帝陵"
 building_TK_20_10_HuangDiLing: "$TK_20_10_HuangDiLing$"
 building_TK_20_10_HuangDiLing_desc: "橋山の上に黄帝の塚がある。黄帝は龍に乗って天に昇ったため、群臣はその衣冠をここに葬るほかなかったと伝わる。孝武皇帝も北方の朔方を巡幸して帰還した折、自ら山麓に至って祭りを行った。"
 building_type_TK_20_10_YanDiLing: "陵墓・祖地"
 building_type_TK_20_10_YanDiLing_desc: "先王や聖賢が眠り、あるいは祀られる所。後の人々は時節ごとにここへ参って祭り、先祖の功徳を偲ぶ。"
 TK_20_10_YanDiLing: "炎帝陵"
 building_TK_20_10_YanDiLing: "$TK_20_10_YanDiLing$"
 building_TK_20_10_YanDiLing_desc: "炎帝神農氏は百草を嘗め、民に農耕を教え、晩年に南方を巡行してこの地で崩じ葬られたと伝わる。郷民は彼を農耕の祖として奉り、春の耕作の前には必ず祭りに訪れる。"
 building_type_TK_20_10_DaYuLing: "陵墓・祖地"
 building_type_TK_20_10_DaYuLing_desc: "先王や聖賢が眠り、あるいは祀られる所。後の人々は時節ごとにここへ参って祭り、先祖の功徳を偲ぶ。"
 TK_20_10_DaYuLing: "大禹陵"
 building_TK_20_10_DaYuLing: "$TK_20_10_DaYuLing$"
 building_TK_20_10_DaYuLing_desc: "大禹は洪水を治め、江南で諸侯を会して功を計り、そこで崩じて会稽山の麓に葬られた。山上には禹穴がある。太史公も若き日に会稽に登って禹穴を探り、越人は代々これを守り祀ってきた。"
 building_type_TK_20_10_MaZuMiao: "陵墓・祖地"
 building_type_TK_20_10_MaZuMiao_desc: "先王や聖賢が眠り、あるいは祀られる所。後の人々は時節ごとにここへ参って祭り、先祖の功徳を偲ぶ。"
 TK_20_10_MaZuMiao: "媽祖廟"
 building_TK_20_10_MaZuMiao: "$TK_20_10_MaZuMiao$"
 building_TK_20_10_MaZuMiao_desc: "閩中の沖合に湄洲嶼があり、風濤の間に孤立して浮かぶ。行き交う漁師は島を目印に航行し、風浪に遭うたびに海神に叩頭して祈り、無事の帰航を願う。"
 building_type_TK_20_10_DaHuaiShu: "陵墓・祖地"
 building_type_TK_20_10_DaHuaiShu_desc: "先王や聖賢が眠り、あるいは祀られる所。後の人々は時節ごとにここへ参って祭り、先祖の功徳を偲ぶ。"
 TK_20_10_DaHuaiShu: "大槐樹"
 building_TK_20_10_DaHuaiShu: "$TK_20_10_DaHuaiShu$"
 building_TK_20_10_DaHuaiShu_desc: "河東の汾水のほとりは堯の都平陽に近く、古来人家が密集している。村の入口には古い槐が天を衝いてそびえ、枝葉は傘のように広がる。往来の旅人の多くはその下で足を休め、遠方へ旅立つ者は別れ際に必ず振り返って一目見るという。"
 building_type_TK_20_10_QianLing: "陵墓・祖地"
 building_type_TK_20_10_QianLing_desc: "先王や聖賢が眠り、あるいは祀られる所。後の人々は時節ごとにここへ参って祭り、先祖の功徳を偲ぶ。"
 TK_20_10_QianLing: "乾陵"
 building_TK_20_10_QianLing: "$TK_20_10_QianLing$"
 building_TK_20_10_QianLing_desc: "梁山は扶風好畤の北にあり、三つの峰が並び立つ。北峰が最も高く、南の二峰は闕のように向かい合う。始皇帝はかつてここに梁山宮を築き、登って遠くを眺めた。"
 building_type_TK_20_20_TianZhaoShenGong: "寺院・神社"
 building_type_TK_20_20_TianZhaoShenGong_desc: "神仏を祀る所。香火は一年中絶えず、四方の信者が千里を遠しとせず参拝に訪れる。"
 TK_20_20_TianZhaoShenGong: "天照神宮"
 building_TK_20_20_TianZhaoShenGong: "$TK_20_20_TianZhaoShenGong$"
 building_TK_20_20_TianZhaoShenGong_desc: "海東の倭国の女王卑弥呼は鬼道に仕えてよく衆を惑わし、年長けても嫁がず、宮中の奥深くに住んで、その姿を見る者は稀であった。倭人はここで日の神を祀り、国運のかかるところとしている。"
 building_type_TK_20_20_BaiMaSi: "寺院・神社"
 building_type_TK_20_20_BaiMaSi_desc: "神仏を祀る所。香火は一年中絶えず、四方の信者が千里を遠しとせず参拝に訪れる。"
 TK_20_20_BaiMaSi: "白馬寺"
 building_TK_20_20_BaiMaSi: "$TK_20_20_BaiMaSi$"
 building_TK_20_20_BaiMaSi_desc: "孝明皇帝は夜に金人の夢を見て、西方へ使者を遣わして仏法を求めさせ、摂摩騰と竺法蘭の二人の沙門を迎えた。白馬に経典を載せて洛陽に至ったことから、この寺を建てた。寺で訳出された経巻は、中土最古の浮屠の書である。"
 building_type_TK_20_20_FaMenSi: "寺院・神社"
 building_type_TK_20_20_FaMenSi_desc: "神仏を祀る所。香火は一年中絶えず、四方の信者が千里を遠しとせず参拝に訪れる。"
 TK_20_20_FaMenSi: "法門寺"
 building_TK_20_20_FaMenSi: "$TK_20_20_FaMenSi$"
 building_TK_20_20_FaMenSi_desc: "扶風美陽の地には仏陀の指骨舎利が納められていると伝わり、天竺の阿育王が舎利を分けて塔を建てた地の一つという。桓帝・霊帝の頃、浮屠の徒がここに庵を結んで守護し、時の人はこれを阿育王寺と呼んだ。"
 building_type_TK_20_20_ChuYunDaShe: "寺院・神社"
 building_type_TK_20_20_ChuYunDaShe_desc: "神仏を祀る所。香火は一年中絶えず、四方の信者が千里を遠しとせず参拝に訪れる。"
 TK_20_20_ChuYunDaShe: "出雲大社"
 building_TK_20_20_ChuYunDaShe: "$TK_20_20_ChuYunDaShe$"
 building_TK_20_20_ChuYunDaShe_desc: "倭地の出雲では、国土を開き幽冥を司る大国主の神を祀る。伝説によれば、毎年十月には諸神がここに集い、人の世のことを共に議するという。"
 building_type_TK_20_20_HaiYinSi: "寺院・神社"
 building_type_TK_20_20_HaiYinSi_desc: "神仏を祀る所。香火は一年中絶えず、四方の信者が千里を遠しとせず参拝に訪れる。"
 TK_20_20_HaiYinSi: "海印寺"
 building_TK_20_20_HaiYinSi: "$TK_20_20_HaiYinSi$"
 building_TK_20_20_HaiYinSi_desc: "伽耶山は弁韓の地にあり、峰々が重なり、林は深く静かである。三韓の風俗は鬼神を敬い、毎年種まきの後には郷民が山間に集まって祭りを行い、昼夜を問わず歌い舞い酒を飲む。"
 building_type_TK_20_20_WuDangShanDaoGuan: "寺院・神社"
 building_type_TK_20_20_WuDangShanDaoGuan_desc: "神仏を祀る所。香火は一年中絶えず、四方の信者が千里を遠しとせず参拝に訪れる。"
 TK_20_20_WuDangShanDaoGuan: "武当山道観"
 building_TK_20_20_WuDangShanDaoGuan: "$TK_20_20_WuDangShanDaoGuan$"
 building_TK_20_20_WuDangShanDaoGuan_desc: "武当山の諸峰は天柱峰を仰ぎ囲み、岩と谷は深く静かで、古来方士や隠者がここに庵を結んで修行してきた。山中の宮観は峰に寄り崖に沿って建てられ、鐘や磬の音が終日林間に響く。"
 building_type_TK_20_20_ShaoLinSi: "寺院・神社"
 building_type_TK_20_20_ShaoLinSi_desc: "神仏を祀る所。香火は一年中絶えず、四方の信者が千里を遠しとせず参拝に訪れる。"
 TK_20_20_ShaoLinSi: "少林寺"
 building_TK_20_20_ShaoLinSi: "$TK_20_20_ShaoLinSi$"
 building_TK_20_20_ShaoLinSi_desc: "少室山は嵩高の西にあり、太室山と並び立つ。大禹の妻の妹がここに住んだことからその名がついたと伝わる。峰々は削ったように切り立ち、木々は鬱蒼と茂り、しばしば隠者が山に入って道を修める。"
 building_type_TK_20_20_LingYinSi: "寺院・神社"
 building_type_TK_20_20_LingYinSi_desc: "神仏を祀る所。香火は一年中絶えず、四方の信者が千里を遠しとせず参拝に訪れる。"
 TK_20_20_LingYinSi: "霊隠寺"
 building_TK_20_20_LingYinSi: "$TK_20_20_LingYinSi$"
 building_TK_20_20_LingYinSi_desc: "銭唐県の西に武林山があり、武林水がここから流れ出る。山中には奇岩がそびえ、洞窟や谷は奥深く、林泉は清らかで、呉越の間に名高い隠逸の地である。"
 building_type_TK_20_20_DaYanTa: "寺院・神社"
 building_type_TK_20_20_DaYanTa_desc: "神仏を祀る所。香火は一年中絶えず、四方の信者が千里を遠しとせず参拝に訪れる。"
 TK_20_20_DaYanTa: "大雁塔"
 building_TK_20_20_DaYanTa: "$TK_20_20_DaYanTa$"
 building_TK_20_20_DaYanTa_desc: "長安城の東南は原野と湿地が起伏し、近くには曲江池の水がある。孝武皇帝はかつてここに宜春苑を造営し、池のほとりで狩猟や宴を催した。"
 building_type_TK_20_20_XuanKongSi: "寺院・神社"
 building_type_TK_20_20_XuanKongSi_desc: "神仏を祀る所。香火は一年中絶えず、四方の信者が千里を遠しとせず参拝に訪れる。"
 TK_20_20_XuanKongSi: "懸空寺"
 building_TK_20_20_XuanKongSi: "$TK_20_20_XuanKongSi$"
 building_TK_20_20_XuanKongSi_desc: "恒山の麓の峡谷は深く険しく、両岸の崖は削ったように切り立ち、谷にはわずか一筋の山道が通るのみである。北地の商人や戍卒が行き来するには、必ずこの峡谷を抜けねばならない。"
 building_type_TK_20_20_YanDaoShenShe_01: "寺院・神社"
 building_type_TK_20_20_YanDaoShenShe_01_desc: "神仏を祀る所。香火は一年中絶えず、四方の信者が千里を遠しとせず参拝に訪れる。"
 TK_20_20_YanDaoShenShe_01: "厳島神社"
 building_TK_20_20_YanDaoShenShe_01: "$TK_20_20_YanDaoShenShe_01$"
 building_TK_20_20_YanDaoShenShe_01_desc: "倭地の内海に一つの小島があり、山林は青々と茂り、潮が満ちると海水が砂州に寄せる。倭人は島全体を神の住まいと見なし、島で耕作や伐採をあえてしない。"
 building_type_TK_20_20_YanDaoShenShe_02: "寺院・神社"
 building_type_TK_20_20_YanDaoShenShe_02_desc: "神仏を祀る所。香火は一年中絶えず、四方の信者が千里を遠しとせず参拝に訪れる。"
 TK_20_20_YanDaoShenShe_02: "厳島神社（上級）"
 building_TK_20_20_YanDaoShenShe_02: "$TK_20_20_YanDaoShenShe_02$"
 building_TK_20_20_YanDaoShenShe_02_desc: "倭地の内海に一つの小島があり、山林は青々と茂り、潮が満ちると海水が砂州に寄せる。倭人は島全体を神の住まいと見なし、島で耕作や伐採をあえてしない。"
 building_type_TK_20_20_YiShiShenGong: "寺院・神社"
 building_type_TK_20_20_YiShiShenGong_desc: "神仏を祀る所。香火は一年中絶えず、四方の信者が千里を遠しとせず参拝に訪れる。"
 TK_20_20_YiShiShenGong: "伊勢神宮"
 building_TK_20_20_YiShiShenGong: "$TK_20_20_YiShiShenGong$"
 building_TK_20_20_YiShiShenGong_desc: "倭地の東方に清冽な川が流れ、両岸には木々が厳かに茂る。日の神がこの清浄な地を選んで鎮まったと伝えられ、倭人は川のほとりでこれを祀り、いささかも冒涜しようとはしない。"
 building_type_TK_20_20_HuangLongSi: "寺院・神社"
 building_type_TK_20_20_HuangLongSi_desc: "神仏を祀る所。香火は一年中絶えず、四方の信者が千里を遠しとせず参拝に訪れる。"
 TK_20_20_HuangLongSi: "皇龍寺"
 building_TK_20_20_HuangLongSi: "$TK_20_20_HuangLongSi$"
 building_TK_20_20_HuangLongSi_desc: "辰韓の斯盧国の都邑近くの平野は土地が肥え、川がめぐっている。辰韓の人々は五穀をよく育て、養蚕を知り、絹布を織ることができ、邑落の多くがこのあたりに集まっている。"
 building_type_TK_20_20_TianTaiZongSiYuan: "寺院・神社"
 building_type_TK_20_20_TianTaiZongSiYuan_desc: "神仏を祀る所。香火は一年中絶えず、四方の信者が千里を遠しとせず参拝に訪れる。"
 TK_20_20_TianTaiZongSiYuan: "天台宗寺院"
 building_TK_20_20_TianTaiZongSiYuan: "$TK_20_20_TianTaiZongSiYuan$"
 building_TK_20_20_TianTaiZongSiYuan_desc: "会稽の東南、群山の奥深くに巨岩が地からそそり立ち、四方は絶壁ながら頂は台のように平らに開けている。頂に登って夜空を望めば、星や月がすぐ手の届くところにあるかのようである。"
 building_type_TK_20_20_NanHuaSi: "寺院・神社"
 building_type_TK_20_20_NanHuaSi_desc: "神仏を祀る所。香火は一年中絶えず、四方の信者が千里を遠しとせず参拝に訪れる。"
 TK_20_20_NanHuaSi: "南華寺"
 building_TK_20_20_NanHuaSi: "$TK_20_20_NanHuaSi$"
 building_TK_20_20_NanHuaSi_desc: "曲江県の南に曹渓があり、渓流は清く浅く、両岸の山林は静かである。嶺南の暑さもここではいくらか和らぎ、往来の旅人はよく渓のほとりで休む。"
 building_type_TK_20_20_DaZhaoSi: "寺院・神社"
 building_type_TK_20_20_DaZhaoSi_desc: "神仏を祀る所。香火は一年中絶えず、四方の信者が千里を遠しとせず参拝に訪れる。"
 TK_20_20_DaZhaoSi: "大昭寺"
 building_TK_20_20_DaZhaoSi: "$TK_20_20_DaZhaoSi$"
 building_TK_20_20_DaZhaoSi_desc: "西南のはるか遠い地に、雪山に抱かれた高原の河谷がある。土地の人々は牛や羊を牧して暮らし、山川湖沼の神を敬い奉る。中原の人が至ることは稀で、ただその地が極寒で奇異の事が多いと聞くのみである。"
 building_type_TK_20_21_ChangAnCheng: "文化古城"
 building_type_TK_20_21_ChangAnCheng_desc: "城郭は久しく立ち、前代の王侯がここに都を置き国を建てた。市井には今も往時の風物が残っている。"
 TK_20_21_ChangAnCheng: "長安城"
 building_TK_20_21_ChangAnCheng: "$TK_20_21_ChangAnCheng$"
 building_TK_20_21_ChangAnCheng_desc: "漢の西京。高祖がここに都を定め、未央・長楽の両宮が巍然とそびえ、八つの川がめぐり、関中の沃野は千里に及んで天府と称された。光武中興で洛陽に遷都して以後、西京はもはや帝の住まいではなくなったが、宗廟や陵寝はなお存し、三輔は依然として繁栄している。"
 building_type_TK_20_21_LuoYangCheng: "文化古城"
 building_type_TK_20_21_LuoYangCheng_desc: "城郭は久しく立ち、前代の王侯がここに都を置き国を建てた。市井には今も往時の風物が残っている。"
 TK_20_21_LuoYangCheng: "洛陽城"
 building_TK_20_21_LuoYangCheng: "$TK_20_21_LuoYangCheng$"
 building_TK_20_21_LuoYangCheng_desc: "洛陽は天下の中央に位置し、北は邙山に寄り、南は洛水に臨む。周公が洛邑を築いて以来、王者の都であった。光武中興でここに都が定められ、南北両宮が相望み、四方の貢賦と遊学の士子がここに集まる。"
 building_type_TK_20_21_ZiJinCheng: "文化古城"
 building_type_TK_20_21_ZiJinCheng_desc: "城郭は久しく立ち、前代の王侯がここに都を置き国を建てた。市井には今も往時の風物が残っている。"
 TK_20_21_ZiJinCheng: "紫禁城"
 building_TK_20_21_ZiJinCheng: "$TK_20_21_ZiJinCheng$"
 building_TK_20_21_ZiJinCheng_desc: "薊城は燕国の旧都で幽州の治所である。北は燕山に寄り、塞外から中原へ通じる門戸を扼し、胡漢の商人や辺境守備の兵馬がここに集う。"
 building_type_TK_20_21_JinGuanCheng: "文化古城"
 building_type_TK_20_21_JinGuanCheng_desc: "城郭は久しく立ち、前代の王侯がここに都を置き国を建てた。市井には今も往時の風物が残っている。"
 TK_20_21_JinGuanCheng: "錦官城"
 building_TK_20_21_JinGuanCheng: "$TK_20_21_JinGuanCheng$"
 building_TK_20_21_JinGuanCheng_desc: "成都は蜀郡の治所で、張儀が咸陽の制にならって築いたと伝わる。城中では織錦の業が盛んで、官府は特に錦官を置いて製造を監督させ、蜀錦は天下に売りさばかれる。城外には水路や堰が縦横に走り、沃野は千里に及び、水も旱も人の意のままである。"
 building_type_TK_20_21_GuSuCheng: "文化古城"
 building_type_TK_20_21_GuSuCheng_desc: "城郭は久しく立ち、前代の王侯がここに都を置き国を建てた。市井には今も往時の風物が残っている。"
 TK_20_21_GuSuCheng: "姑蘇城"
 building_TK_20_21_GuSuCheng: "$TK_20_21_GuSuCheng$"
 building_TK_20_21_GuSuCheng_desc: "呉県は呉郡の治所で、伍子胥が呉王闔閭の命を受け、土地を相し水を嘗めてこの大城を築いたと伝わる。城の西には姑蘇台があり、太湖の煙波がそばに広がり、水路が縦横に走って、舟の往来は織るがごとくである。"
 building_type_TK_20_21_YangZhouCheng: "文化古城"
 building_type_TK_20_21_YangZhouCheng_desc: "城郭は久しく立ち、前代の王侯がここに都を置き国を建てた。市井には今も往時の風物が残っている。"
 TK_20_21_YangZhouCheng: "揚州城"
 building_TK_20_21_YangZhouCheng: "$TK_20_21_YangZhouCheng$"
 building_TK_20_21_YangZhouCheng_desc: "広陵城は呉王夫差が築いた邗城に始まり、夫差はさらに邗溝を掘って長江と淮水を結んだ。高祖の時には呉王劉濞がここに都し、海水を煮て塩を作り、山に就いて銭を鋳造し、その富は東南に冠たるものであった。"
 building_type_TK_20_21_JingZhouCheng: "文化古城"
 building_type_TK_20_21_JingZhouCheng_desc: "城郭は久しく立ち、前代の王侯がここに都を置き国を建てた。市井には今も往時の風物が残っている。"
 TK_20_21_JingZhouCheng: "荊州城"
 building_TK_20_21_JingZhouCheng: "$TK_20_21_JingZhouCheng$"
 building_TK_20_21_JingZhouCheng_desc: "江陵は南郡の治所で、楚国の旧都郢城に近い。北は漢水・沔水に拠り、南は大江に臨み、西は巴蜀に通じ、東は呉会に連なる。荊楚の門戸にして、武を用いるべき地である。"
 building_type_TK_20_21_ShiTouCheng: "文化古城"
 building_type_TK_20_21_ShiTouCheng_desc: "城郭は久しく立ち、前代の王侯がここに都を置き国を建てた。市井には今も往時の風物が残っている。"
 TK_20_21_ShiTouCheng: "石頭城"
 building_TK_20_21_ShiTouCheng: "$TK_20_21_ShiTouCheng$"
 building_TK_20_21_ShiTouCheng_desc: "秣陵は西に大江を臨み、石頭山が江辺に壁のようにそびえる。楚の威王がかつてここに金陵邑を置いたと伝わる。山は険しく江水を見下ろし、ここに拠れば大江の上下を扼することができ、兵を用いる者が必ず争う地である。"
 building_type_TK_20_21_KaiFengHuangCheng: "文化古城"
 building_type_TK_20_21_KaiFengHuangCheng_desc: "城郭は久しく立ち、前代の王侯がここに都を置き国を建てた。市井には今も往時の風物が残っている。"
 TK_20_21_KaiFengHuangCheng: "開封皇城"
 building_TK_20_21_KaiFengHuangCheng: "$TK_20_21_KaiFengHuangCheng$"
 building_TK_20_21_KaiFengHuangCheng_desc: "陳留浚儀は、戦国時代の魏の都大梁の旧地である。魏の恵王が安邑からここへ遷都し、鴻溝を開いて河水を引き、城郭は雄壮であったが、のちに秦将王賁が河水を引いて城を水攻めにし、陥落した。"
 building_type_TK_20_21_LinAnHuangCheng: "文化古城"
 building_type_TK_20_21_LinAnHuangCheng_desc: "城郭は久しく立ち、前代の王侯がここに都を置き国を建てた。市井には今も往時の風物が残っている。"
 TK_20_21_LinAnHuangCheng: "臨安皇城"
 building_TK_20_21_LinAnHuangCheng: "$TK_20_21_LinAnHuangCheng$"
 building_TK_20_21_LinAnHuangCheng_desc: "銭唐江のほとりに、鳳凰が翼を広げたような形の山がある。東は大江に臨み、北は湖水を望む。江の潮が押し寄せるたび、その勢いは雷のごとく、郷人は伍子胥の怒れる魂が水を駆って波を起こすのだと言い伝える。"
 building_type_TK_20_21_PingYaoGuCheng: "文化古城"
 building_type_TK_20_21_PingYaoGuCheng_desc: "城郭は久しく立ち、前代の王侯がここに都を置き国を建てた。市井には今も往時の風物が残っている。"
 TK_20_21_PingYaoGuCheng: "平遥古城"
 building_TK_20_21_PingYaoGuCheng: "$TK_20_21_PingYaoGuCheng$"
 building_TK_20_21_PingYaoGuCheng_desc: "平陶の県城は、周の宣王の時代に大将尹吉甫が北の玁狁を討った際、ここに兵を駐めて城を築いたと伝わる。城壁は方正で、周囲は平らな沃野が広がり、汾水東岸の要衝である。"
 building_type_TK_20_21_FengDuGuiCheng: "文化古城"
 building_type_TK_20_21_FengDuGuiCheng_desc: "城郭は久しく立ち、前代の王侯がここに都を置き国を建てた。市井には今も往時の風物が残っている。"
 TK_20_21_FengDuGuiCheng: "豊都鬼城"
 building_TK_20_21_FengDuGuiCheng: "$TK_20_21_FengDuGuiCheng$"
 building_TK_20_21_FengDuGuiCheng_desc: "巴郡の平都山は江に臨んでそびえ、木々は鬱蒼と茂る。方士の王方平と陰長生がここで道を修め、ついに昇仙したと伝わる。夜には山間に陰風が吹きすさび、郷人の多くは一人で歩こうとしない。"
 building_type_TK_20_21_LouLanGuGuo: "文化古城"
 building_type_TK_20_21_LouLanGuGuo_desc: "城郭は久しく立ち、前代の王侯がここに都を置き国を建てた。市井には今も往時の風物が残っている。"
 TK_20_21_LouLanGuGuo: "楼蘭古国"
 building_TK_20_21_LouLanGuGuo: "$TK_20_21_LouLanGuGuo$"
 building_TK_20_21_LouLanGuGuo_desc: "楼蘭は塩沢の西にあり、西域南北両道の要衝に当たり、胡商の駱駝隊は必ずここを通る。孝昭皇帝の時、傅介子が楼蘭王を斬り、朝廷はその国名を鄯善と改め、以後漢に帰服した。"
 building_type_TK_20_21_JingJueGuCheng: "文化古城"
 building_type_TK_20_21_JingJueGuCheng_desc: "城郭は久しく立ち、前代の王侯がここに都を置き国を建てた。市井には今も往時の風物が残っている。"
 TK_20_21_JingJueGuCheng: "精絶古城"
 building_TK_20_21_JingJueGuCheng: "$TK_20_21_JingJueGuCheng$"
 building_TK_20_21_JingJueGuCheng_desc: "精絶は西域南道の小国で、王城は小川のほとりにあり、四方はすべて流沙である。国の戸口は多くないが、商旅の往来によってかなり富裕であった。今はすでに鄯善に併合されている。"
 building_type_TK_20_21_GaoChangGuCheng: "文化古城"
 building_type_TK_20_21_GaoChangGuCheng_desc: "城郭は久しく立ち、前代の王侯がここに都を置き国を建てた。市井には今も往時の風物が残っている。"
 TK_20_21_GaoChangGuCheng: "高昌故城"
 building_TK_20_21_GaoChangGuCheng: "$TK_20_21_GaoChangGuCheng$"
 building_TK_20_21_GaoChangGuCheng_desc: "高昌壁は車師前国の領内にあり、地勢が高く開け、人々が繁栄していることからこの名がある。朝廷は戊己校尉を派遣してここで屯田と守備にあたらせ、西域北道の要衝を扼している。"
 building_type_TK_20_21_GeShengGuCheng: "文化古城"
 building_type_TK_20_21_GeShengGuCheng_desc: "城郭は久しく立ち、前代の王侯がここに都を置き国を建てた。市井には今も往時の風物が残っている。"
 TK_20_21_GeShengGuCheng: "紇升骨城"
 building_TK_20_21_GeShengGuCheng: "$TK_20_21_GeShengGuCheng$"
 building_TK_20_21_GeShengGuCheng_desc: "高句驪の始祖朱蒙は夫余から南へ逃れ、卒本川のほとりで国を建てて王を称し、この山の上に城を築いた。城は山の地勢に沿って築かれ、四方は険しく、守りやすく攻めにくい。"
 building_type_TK_20_21_MingTiePeiGuCheng: "文化古城"
 building_type_TK_20_21_MingTiePeiGuCheng_desc: "城郭は久しく立ち、前代の王侯がここに都を置き国を建てた。市井には今も往時の風物が残っている。"
 TK_20_21_MingTiePeiGuCheng: "明鉄佩古城"
 building_TK_20_21_MingTiePeiGuCheng: "$TK_20_21_MingTiePeiGuCheng$"
 building_TK_20_21_MingTiePeiGuCheng_desc: "大宛国内最大の城邑で、城郭は堅固、街路と工房は整然としている。大宛には良馬が多く、汗血の天馬はここに産する。孝武皇帝はかつて弐師将軍を遠征させ、その良馬を奪って帰還させた。"
 building_type_TK_20_21_AiLaoGuGuo: "文化古城"
 building_type_TK_20_21_AiLaoGuGuo_desc: "城郭は久しく立ち、前代の王侯がここに都を置き国を建てた。市井には今も往時の風物が残っている。"
 TK_20_21_AiLaoGuGuo: "哀牢古国"
 building_TK_20_21_AiLaoGuGuo: "$TK_20_21_AiLaoGuGuo$"
 building_TK_20_21_AiLaoGuGuo_desc: "哀牢夷の始祖母沙壱は水中で沈木に触れて身ごもり、十人の子を生み、末子の九隆が推されて王となったと伝わる。孝明皇帝の時、哀牢王柳貌が衆を率いて内附し、朝廷はその地に永昌郡を置いた。"
 building_type_TK_20_21_WuGeKu: "文化古城"
 building_type_TK_20_21_WuGeKu_desc: "城郭は久しく立ち、前代の王侯がここに都を置き国を建てた。市井には今も往時の風物が残っている。"
 TK_20_21_WuGeKu: "アンコール・ワット"
 building_TK_20_21_WuGeKu: "$TK_20_21_WuGeKu$"
 building_TK_20_21_WuGeKu_desc: "南海の彼方に扶南国があり、国中には広大な湖がある。夏から秋の雨の多い時期には湖水が逆流して満ち、魚や蝦がきわめて豊富である。その開国の君混塡は海を渡って来て、女王柳葉を妻に迎え、これより国を建てたと伝わる。"
 building_type_TK_20_21_GongShanCheng: "文化古城"
 building_type_TK_20_21_GongShanCheng_desc: "城郭は久しく立ち、前代の王侯がここに都を置き国を建てた。市井には今も往時の風物が残っている。"
 TK_20_21_GongShanCheng: "公山城"
 building_TK_20_21_GongShanCheng: "$TK_20_21_GongShanCheng$"
 building_TK_20_21_GongShanCheng_desc: "馬韓の地に江に臨む山の岡があり、江水が山をめぐって流れ、山の形は険しい。馬韓の諸国は山と海の間に散らばって住み、それぞれに長帥がいる。この地は高みに居て水に臨み、まさに拠って守るべき所である。"
 building_type_TK_20_21_PingAnJing: "文化古城"
 building_type_TK_20_21_PingAnJing_desc: "城郭は久しく立ち、前代の王侯がここに都を置き国を建てた。市井には今も往時の風物が残っている。"
 TK_20_21_PingAnJing: "平安京"
 building_TK_20_21_PingAnJing: "$TK_20_21_PingAnJing$"
 building_TK_20_21_PingAnJing_desc: "倭地に四方を山に囲まれた平らな川辺の地があり、いくつもの川が山間から流れ出ている。土地は平らに開けて耕作に適し、倭人の邑落がその間に散らばっている。"
 building_type_TK_20_21_ShengLongHuangCheng01: "文化古城"
 building_type_TK_20_21_ShengLongHuangCheng01_desc: "城郭は久しく立ち、前代の王侯がここに都を置き国を建てた。市井には今も往時の風物が残っている。"
 TK_20_21_ShengLongHuangCheng01: "昇龍城"
 building_TK_20_21_ShengLongHuangCheng01: "$TK_20_21_ShengLongHuangCheng01$"
 building_TK_20_21_ShengLongHuangCheng01_desc: "交趾郡の治所は大河のほとりにあり、地勢は平坦で、稲田は年に二度実る。中原の士人が乱を避けて南へ来ると、多くはここに身を寄せ、城中にはかなり文教の気風がある。"
 building_type_TK_20_21_ShengLongHuangCheng02: "文化古城"
 building_type_TK_20_21_ShengLongHuangCheng02_desc: "城郭は久しく立ち、前代の王侯がここに都を置き国を建てた。市井には今も往時の風物が残っている。"
 TK_20_21_ShengLongHuangCheng02: "昇龍皇城"
 building_TK_20_21_ShengLongHuangCheng02: "$TK_20_21_ShengLongHuangCheng02$"
 building_TK_20_21_ShengLongHuangCheng02_desc: "交趾郡の治所は大河のほとりにあり、地勢は平坦で、稲田は年に二度実る。中原の士人が乱を避けて南へ来ると、多くはここに身を寄せ、城中にはかなり文教の気風がある。"
 building_type_TK_20_22_DaWenKouYiZhi: "集落遺跡"
 building_type_TK_20_22_DaWenKouYiZhi_desc: "上古の先民が集まり住んだ旧跡。荒れた草むらの間からしばしば陶器や石器が掘り出され、父老たちは遠い昔の民が残したものだと言い伝える。"
 TK_20_22_DaWenKouYiZhi: "大汶口遺跡"
 building_TK_20_22_DaWenKouYiZhi: "$TK_20_22_DaWenKouYiZhi$"
 building_TK_20_22_DaWenKouYiZhi_desc: "汶水のほとりの高台では、郷人が田を耕す際にしばしば古い陶器や石斧を掘り出すが、その形は今日の器物とまるで異なる。父老たちは、ここは上古の先民が集まり住み、葬られた地だと言い伝える。"
 building_type_TK_20_22_BanPoYiZhi: "集落遺跡"
 building_type_TK_20_22_BanPoYiZhi_desc: "上古の先民が集まり住んだ旧跡。荒れた草むらの間からしばしば陶器や石器が掘り出され、父老たちは遠い昔の民が残したものだと言い伝える。"
 TK_20_22_BanPoYiZhi: "半坡遺跡"
 building_TK_20_22_BanPoYiZhi: "$TK_20_22_BanPoYiZhi$"
 building_TK_20_22_BanPoYiZhi_desc: "滻水東岸の原上では、ときおり円形の家の礎や彩色された陶器が出土する。長安の父老は、これは三代よりもはるか昔の先民の村だと言う。"
 building_type_TK_20_22_HeMuDuYiZhi: "集落遺跡"
 building_type_TK_20_22_HeMuDuYiZhi_desc: "上古の先民が集まり住んだ旧跡。荒れた草むらの間からしばしば陶器や石器が掘り出され、父老たちは遠い昔の民が残したものだと言い伝える。"
 TK_20_22_HeMuDuYiZhi: "河姆渡遺跡"
 building_TK_20_22_HeMuDuYiZhi: "$TK_20_22_HeMuDuYiZhi$"
 building_TK_20_22_HeMuDuYiZhi_desc: "会稽余姚江のほとりの低地では、郷人が地を掘るとしばしば朽ちた木杭、焦げた稲籾、骨器が幾層にも重なっているのが見つかり、上古の越人の住居の名残であるらしい。"
 building_type_TK_20_22_ShiGangPingYuan: "集落遺跡"
 building_type_TK_20_22_ShiGangPingYuan_desc: "上古の先民が集まり住んだ旧跡。荒れた草むらの間からしばしば陶器や石器が掘り出され、父老たちは遠い昔の民が残したものだと言い伝える。"
 TK_20_22_ShiGangPingYuan: "ジャール平原"
 building_TK_20_22_ShiGangPingYuan: "$TK_20_22_ShiGangPingYuan$"
 building_TK_20_22_ShiGangPingYuan_desc: "西南夷のさらに外の深山に高原があり、巨大な石の甕が一面に散らばっている。大きなものは数人が入れるほどである。土地の人は、古の巨人が酒を醸すのに用いたものだと言うが、誰が彫ったのかはもはや知る者がいない。"
 building_type_TK_20_23_BaiLuDongShuYuan: "書院・大学"
 building_type_TK_20_23_BaiLuDongShuYuan_desc: "学者が弟子を集めて講学する所。経籍が棚を満たし、四方の士子が書を背負ってやって来る。"
 TK_20_23_BaiLuDongShuYuan: "白鹿洞書院"
 building_TK_20_23_BaiLuDongShuYuan: "$TK_20_23_BaiLuDongShuYuan$"
 building_TK_20_23_BaiLuDongShuYuan_desc: "廬山五老峰の南麓は四方を山に囲まれ、渓流は清らかで静かで、俗世から遠く離れている。まさに隠士が読書し講学するのにふさわしい所である。"
 building_type_TK_20_23_ShiGuShuYuan: "書院・大学"
 building_type_TK_20_23_ShiGuShuYuan_desc: "学者が弟子を集めて講学する所。経籍が棚を満たし、四方の士子が書を背負ってやって来る。"
 TK_20_23_ShiGuShuYuan: "石鼓書院"
 building_TK_20_23_ShiGuShuYuan: "$TK_20_23_ShiGuShuYuan$"
 building_TK_20_23_ShiGuShuYuan_desc: "蒸水と湘水がここで合流し、江辺には石鼓のような形の山があって三方が水に臨む。郷人は、戦が起ころうとするたびに山上の石鼓がひとりでに鳴ると言い伝える。"
 building_type_TK_20_23_CuLaiShuYuan: "書院・大学"
 building_type_TK_20_23_CuLaiShuYuan_desc: "学者が弟子を集めて講学する所。経籍が棚を満たし、四方の士子が書を背負ってやって来る。"
 TK_20_23_CuLaiShuYuan: "徂徠書院"
 building_TK_20_23_CuLaiShuYuan: "$TK_20_23_CuLaiShuYuan$"
 building_TK_20_23_CuLaiShuYuan_desc: "徂徠山は泰山と南北に相望み、山中の松柏は青々としている。『詩』で魯人が讃えた「徂来の松」はここに産する。山の住まいは清らかで静かで、門を閉ざして学問に励むのに適している。"
 building_type_TK_20_23_LiZeShuYuan: "書院・大学"
 building_type_TK_20_23_LiZeShuYuan_desc: "学者が弟子を集めて講学する所。経籍が棚を満たし、四方の士子が書を背負ってやって来る。"
 TK_20_23_LiZeShuYuan: "麗沢書院"
 building_TK_20_23_LiZeShuYuan: "$TK_20_23_LiZeShuYuan$"
 building_TK_20_23_LiZeShuYuan_desc: "会稽西部の山水の間に二つの湖が連なり、水の光が互いに映える。『易』に「麗沢は兌なり。君子は以て朋友講習す」とあり、二つの沢が寄り添って互いを潤すさまは、まさに朋友が集い切磋する意にかなう。"
 building_type_TK_20_23_MaoShanShuYuan: "書院・大学"
 building_type_TK_20_23_MaoShanShuYuan_desc: "学者が弟子を集めて講学する所。経籍が棚を満たし、四方の士子が書を背負ってやって来る。"
 TK_20_23_MaoShanShuYuan: "茅山書院"
 building_TK_20_23_MaoShanShuYuan: "$TK_20_23_MaoShanShuYuan$"
 building_TK_20_23_MaoShanShuYuan_desc: "句曲山は茅盈・茅固・茅衷の三兄弟が道を修めて仙人となった所と伝わり、ゆえに三茅山とも呼ばれる。山中は清らかで静かで、道士も読書人もここに庵を結ぶことを好む。"
 building_type_TK_20_23_JiXiaXueGong: "書院・大学"
 building_type_TK_20_23_JiXiaXueGong_desc: "学者が弟子を集めて講学する所。経籍が棚を満たし、四方の士子が書を背負ってやって来る。"
 TK_20_23_JiXiaXueGong: "稷下学宮"
 building_TK_20_23_JiXiaXueGong: "$TK_20_23_JiXiaXueGong$"
 building_TK_20_23_JiXiaXueGong_desc: "斉の都臨淄の稷門の下では、宣王の時に天下の文学遊説の士を広く招き、鄒衍・淳于髡・田駢・荀卿らがみなここで議論し講学した。政務を執らずに国政を論じ、稷下先生と号された。"
 building_type_TK_20_23_JiXianShuYuan: "書院・大学"
 building_type_TK_20_23_JiXianShuYuan_desc: "学者が弟子を集めて講学する所。経籍が棚を満たし、四方の士子が書を背負ってやって来る。"
 TK_20_23_JiXianShuYuan: "集賢書院"
 building_TK_20_23_JiXianShuYuan: "$TK_20_23_JiXianShuYuan$"
 building_TK_20_23_JiXianShuYuan_desc: "宮中で図籍を所蔵する所。天下の秘書がここに集められ、博学の士がここで経伝を校勘し史書を撰述し、灯火はしばしば夜を徹して消えることがない。"
 building_type_TK_20_23_NiShanShuYuan: "書院・大学"
 building_type_TK_20_23_NiShanShuYuan_desc: "学者が弟子を集めて講学する所。経籍が棚を満たし、四方の士子が書を背負ってやって来る。"
 TK_20_23_NiShanShuYuan: "尼山書院"
 building_TK_20_23_NiShanShuYuan: "$TK_20_23_NiShanShuYuan$"
 building_TK_20_23_NiShanShuYuan_desc: "魯国昌平郷の尼丘山は、孔子の父母がかつて山中で祈って孔子を授かった所と伝わり、ゆえに孔子は名を丘、字を仲尼という。魯の地の儒生はしばしばここを訪れて仰ぎ見る。"
 building_type_TK_20_23_SongYangShuYuan: "書院・大学"
 building_type_TK_20_23_SongYangShuYuan_desc: "学者が弟子を集めて講学する所。経籍が棚を満たし、四方の士子が書を背負ってやって来る。"
 TK_20_23_SongYangShuYuan: "嵩陽書院"
 building_TK_20_23_SongYangShuYuan: "$TK_20_23_SongYangShuYuan$"
 building_TK_20_23_SongYangShuYuan_desc: "太室山の南麓には古い柏が天を衝いてそびえる。孝武皇帝が嵩高に遊んだ際、この柏の高大なのを見て将軍に封じたと伝わり、郷人は今もこれを将軍柏と呼ぶ。"
 building_type_TK_20_23_YuLuShuYuan: "書院・大学"
 building_type_TK_20_23_YuLuShuYuan_desc: "学者が弟子を集めて講学する所。経籍が棚を満たし、四方の士子が書を背負ってやって来る。"
 TK_20_23_YuLuShuYuan: "岳麓書院"
 building_TK_20_23_YuLuShuYuan: "$TK_20_23_YuLuShuYuan$"
 building_TK_20_23_YuLuShuYuan_desc: "臨湘城から湘水を隔てて西を望むと、木々の青々とした山がある。南岳衡山の余脈であるため岳麓と呼ばれる。山前を湘水が北へ流れ、橘洲が江の中央に横たわる。"
 building_type_TK_20_23_YingTianShuYuan: "書院・大学"
 building_type_TK_20_23_YingTianShuYuan_desc: "学者が弟子を集めて講学する所。経籍が棚を満たし、四方の士子が書を背負ってやって来る。"
 TK_20_23_YingTianShuYuan: "応天書院"
 building_TK_20_23_YingTianShuYuan: "$TK_20_23_YingTianShuYuan$"
 building_TK_20_23_YingTianShuYuan_desc: "梁国の睢陽では、かつて梁の孝王がここで宮殿や苑囿を盛んに造営し、兎園を築いて四方の豪傑を招いた。枚乗・司馬相如・鄒陽ら名士がみなここで賦を作り遊宴した。"
 building_type_TK_20_23_AnDingShuYuan: "書院・大学"
 building_type_TK_20_23_AnDingShuYuan_desc: "学者が弟子を集めて講学する所。経籍が棚を満たし、四方の士子が書を背負ってやって来る。"
 TK_20_23_AnDingShuYuan: "安定書院"
 building_TK_20_23_AnDingShuYuan: "$TK_20_23_AnDingShuYuan$"
 building_TK_20_23_AnDingShuYuan_desc: "広陵の東境にある海陵は海辺に近く、古くから製塩の利があって倉廩は豊かであり、呉王劉濞の時にはすでに「海陵の倉」として名高かった。"
 building_type_TK_20_23_WanSongShuYuan: "書院・大学"
 building_type_TK_20_23_WanSongShuYuan_desc: "学者が弟子を集めて講学する所。経籍が棚を満たし、四方の士子が書を背負ってやって来る。"
 TK_20_23_WanSongShuYuan: "万松書院"
 building_TK_20_23_WanSongShuYuan: "$TK_20_23_WanSongShuYuan$"
 building_TK_20_23_WanSongShuYuan_desc: "銭唐城の南の山嶺には松林が連なり、風が吹けば松籟は海のように響く。嶺の下では湖水と大江がはるかに相望み、山の住まいは清らかで静かで、読書に適している。"
 building_type_TK_20_23_EHuShuYuan: "書院・大学"
 building_type_TK_20_23_EHuShuYuan_desc: "学者が弟子を集めて講学する所。経籍が棚を満たし、四方の士子が書を背負ってやって来る。"
 TK_20_23_EHuShuYuan: "鵝湖書院"
 building_TK_20_23_EHuShuYuan: "$TK_20_23_EHuShuYuan$"
 building_TK_20_23_EHuShuYuan_desc: "鄱陽の東南の群山の中に一つの山があり、山頂には湖が広がる。周囲は木々が青々と茂り、雲気がたなびき、人跡まれで、隠棲して講学するにふさわしい清らかで静かな地である。"
 building_type_TK_20_23_LiZhengShuYuan: "書院・大学"
 building_type_TK_20_23_LiZhengShuYuan_desc: "学者が弟子を集めて講学する所。経籍が棚を満たし、四方の士子が書を背負ってやって来る。"
 TK_20_23_LiZhengShuYuan: "麗正書院"
 building_TK_20_23_LiZhengShuYuan: "$TK_20_23_LiZhengShuYuan$"
 building_TK_20_23_LiZhengShuYuan_desc: "宮中で書を修める所で、『易』の「重明以て正に麗く」の義をとって名づけられた。学士たちはここで遺書を探し求め、典籍を校訂し、天子の顧問に備える。"
 building_type_TK_20_24_YangGuangDaJinTa: "名建築遺跡"
 building_type_TK_20_24_YangGuangDaJinTa_desc: "遠近に名高い楼閣の古跡。通りかかる旅人はここに至れば、誰もが足を止めて眺める。"
 TK_20_24_YangGuangDaJinTa: "シュエダゴン・パゴダ"
 building_TK_20_24_YangGuangDaJinTa: "$TK_20_24_YangGuangDaJinTa$"
 building_TK_20_24_YangGuangDaJinTa_desc: "南海のほとりの小山の上に、仏陀在世の折、二人の商人の兄弟が天竺から仏陀の髪を持ち帰り、ここに祀ったと伝わる。土地の人はこれを聖地と崇め、遠近から参拝する者が絶えない。"
 building_type_TK_20_24_WuHouCi: "名建築遺跡"
 building_type_TK_20_24_WuHouCi_desc: "遠近に名高い楼閣の古跡。通りかかる旅人はここに至れば、誰もが足を止めて眺める。"
 TK_20_24_WuHouCi: "武侯祠"
 building_TK_20_24_WuHouCi: "$TK_20_24_WuHouCi$"
 building_TK_20_24_WuHouCi_desc: "錦官城の南には古い柏が鬱蒼と茂る。蜀の人々はここに祠を建て、身を捧げて尽くした一人の賢相を祀っている。四季を通じて香火は絶えず、士民がここに至れば、誰もが粛然とする。"
 building_type_TK_20_24_YingXianMuTa: "名建築遺跡"
 building_type_TK_20_24_YingXianMuTa_desc: "遠近に名高い楼閣の古跡。通りかかる旅人はここに至れば、誰もが足を止めて眺める。"
 TK_20_24_YingXianMuTa: "応県木塔"
 building_TK_20_24_YingXianMuTa: "$TK_20_24_YingXianMuTa$"
 building_TK_20_24_YingXianMuTa_desc: "雁門郡南境の河谷の平野は地勢が平らに開け、北は長城を望み、南は恒山に寄る。胡騎が南下するにも辺境の軍が北へ出るにも、必ず通る地である。"
 building_type_TK_20_24_ZhaoZhouQiao: "名建築遺跡"
 building_type_TK_20_24_ZhaoZhouQiao_desc: "遠近に名高い楼閣の古跡。通りかかる旅人はここに至れば、誰もが足を止めて眺める。"
 TK_20_24_ZhaoZhouQiao: "趙州橋"
 building_TK_20_24_ZhaoZhouQiao: "$TK_20_24_ZhaoZhouQiao$"
 building_TK_20_24_ZhaoZhouQiao_desc: "常山平棘城の南を洨水が流れる。水量は多くないが、夏秋の増水時にはしばしば渡しの橋を押し流し、往来の人々は水を徒歩で渡るほかない。"
 building_type_TK_20_24_FaShiLvGuan: "名建築遺跡"
 building_type_TK_20_24_FaShiLvGuan_desc: "遠近に名高い楼閣の古跡。通りかかる旅人はここに至れば、誰もが足を止めて眺める。"
 TK_20_24_FaShiLvGuan: "法師旅館"
 building_TK_20_24_FaShiLvGuan: "$TK_20_24_FaShiLvGuan$"
 building_TK_20_24_FaShiLvGuan_desc: "倭地北方の山中には温泉が湧き出し、湯は温かく、土地の人は病を癒やすと信じている。遠方から来て泉のほとりに泊まり湯浴みする人がしばしばいる。"
 building_type_TK_20_24_GuangZhouFanFang: "名建築遺跡"
 building_type_TK_20_24_GuangZhouFanFang_desc: "遠近に名高い楼閣の古跡。通りかかる旅人はここに至れば、誰もが足を止めて眺める。"
 TK_20_24_GuangZhouFanFang: "広州蕃坊"
 building_TK_20_24_GuangZhouFanFang: "$TK_20_24_GuangZhouFanFang$"
 building_TK_20_24_GuangZhouFanFang_desc: "番禺は南海郡の治所で、大海に臨む嶺南の都会である。犀角・象牙・玳瑁・珠玉など海外の珍品の多くがここで集散し、胡商や蛮族の客の往来が絶えない。"
 building_type_TK_20_24_DaLiShiKu: "名建築遺跡"
 building_type_TK_20_24_DaLiShiKu_desc: "遠近に名高い楼閣の古跡。通りかかる旅人はここに至れば、誰もが足を止めて眺める。"
 TK_20_24_DaLiShiKu: "大理三塔"
 building_TK_20_24_DaLiShiKu: "$TK_20_24_DaLiShiKu$"
 building_TK_20_24_DaLiShiKu_desc: "点蒼山の東麓と葉楡沢の西岸の間には細長い平野があり、渓流が縦横に走り、田畑が連なっている。葉楡の県城はここにある。"
 building_type_TK_20_24_CangZhouTieShiZi: "名建築遺跡"
 building_type_TK_20_24_CangZhouTieShiZi_desc: "遠近に名高い楼閣の古跡。通りかかる旅人はここに至れば、誰もが足を止めて眺める。"
 TK_20_24_CangZhouTieShiZi: "滄州鉄獅子"
 building_TK_20_24_CangZhouTieShiZi: "$TK_20_24_CangZhouTieShiZi$"
 building_TK_20_24_CangZhouTieShiZi_desc: "渤海の浜は地勢が低く湿っており、海の潮がしばしば逆流して押し寄せる。製塩の利は厚いが水害も多く、海辺の民は毎年潮と争わねばならない。"
 building_type_TK_20_24_YueYangLou: "名建築遺跡"
 building_type_TK_20_24_YueYangLou_desc: "遠近に名高い楼閣の古跡。通りかかる旅人はここに至れば、誰もが足を止めて眺める。"
 TK_20_24_YueYangLou: "岳陽楼"
 building_TK_20_24_YueYangLou: "$TK_20_24_YueYangLou$"
 building_TK_20_24_YueYangLou_desc: "巴丘城は洞庭湖の湖口に臨む。城に登って西を望めば、湖水は果てしなく広がり、君山が波の中に浮かぶ。この地は湘水が江に注ぐ口を扼し、水軍がここに停泊すれば荊南を制することができる。"
 building_type_TK_20_24_HuangHeLou: "名建築遺跡"
 building_type_TK_20_24_HuangHeLou_desc: "遠近に名高い楼閣の古跡。通りかかる旅人はここに至れば、誰もが足を止めて眺める。"
 TK_20_24_HuangHeLou: "黄鶴楼"
 building_TK_20_24_HuangHeLou: "$TK_20_24_HuangHeLou$"
 building_TK_20_24_HuangHeLou_desc: "江夏の黄鵠山は大江に臨み、北岸では漢水がここで合流する。高みに登れば江漢合流のさまを一望できる。かつて仙人が黄鵠に乗ってここを飛び過ぎたと伝わり、山の名はそれに由来する。"
 building_type_TK_20_24_TengWangGe: "名建築遺跡"
 building_type_TK_20_24_TengWangGe_desc: "遠近に名高い楼閣の古跡。通りかかる旅人はここに至れば、誰もが足を止めて眺める。"
 TK_20_24_TengWangGe: "滕王閣"
 building_TK_20_24_TengWangGe: "$TK_20_24_TengWangGe$"
 building_TK_20_24_TengWangGe_desc: "豫章郡の治所南昌城は西に贛水を臨み、川面は広く、西岸には山々が連なる。郡内には樟の木が多く、豫章の名はここから来たと伝わる。"
 building_type_TK_20_24_PengLaiGe: "名建築遺跡"
 building_type_TK_20_24_PengLaiGe_desc: "遠近に名高い楼閣の古跡。通りかかる旅人はここに至れば、誰もが足を止めて眺める。"
 TK_20_24_PengLaiGe: "蓬莱閣"
 building_TK_20_24_PengLaiGe: "$TK_20_24_PengLaiGe$"
 building_TK_20_24_PengLaiGe_desc: "東莱の海辺の丹崖の上は大海を見下ろし、春から夏にかけてはしばしば蜃気楼が現れ、楼台や城郭が波濤の間に見え隠れする。孝武皇帝が東巡してここに至り、海中の蓬莱の仙山をはるかに望んで、久しく去りがたかったと伝わる。"
 building_type_TK_20_24_GuanQueLou: "名建築遺跡"
 building_type_TK_20_24_GuanQueLou_desc: "遠近に名高い楼閣の古跡。通りかかる旅人はここに至れば、誰もが足を止めて眺める。"
 TK_20_24_GuanQueLou: "鸛雀楼"
 building_TK_20_24_GuanQueLou: "$TK_20_24_GuanQueLou$"
 building_TK_20_24_GuanQueLou_desc: "河東の蒲坂城は西に大河を臨み、舜がかつてここに都を置いたと伝わる。河岸の高所にはしばしば鸛雀が棲み、高みに登って西を望めば、大河が北から奔流して下るのが見える。"
 building_type_TK_20_30_MingTiaoZhiZhan: "古戦場"
 building_type_TK_20_30_MingTiaoZhiZhan_desc: "かつて両軍が激戦を交えた地。荒野では今なお折れた戟や欠けた鏃を拾うことができ、旅人は訪れるたびに往時を偲んで嘆息する。"
 TK_20_30_MingTiaoZhiZhan: "鳴条の戦い"
 building_TK_20_30_MingTiaoZhiZhan: "$TK_20_30_MingTiaoZhiZhan$"
 building_TK_20_30_MingTiaoZhiZhan_desc: "商の湯王が夏の桀王を討ち、両軍は鳴条の野で決戦した。夏の軍は大敗し、桀は南巣へ逃れ、商はこれより夏に代わって天下を治めた。"
 building_type_TK_20_30_MuYeZhiZhan: "古戦場"
 building_type_TK_20_30_MuYeZhiZhan_desc: "かつて両軍が激戦を交えた地。荒野では今なお折れた戟や欠けた鏃を拾うことができ、旅人は訪れるたびに往時を偲んで嘆息する。"
 TK_20_30_MuYeZhiZhan: "牧野の戦い"
 building_TK_20_30_MuYeZhiZhan: "$TK_20_30_MuYeZhiZhan$"
 building_TK_20_30_MuYeZhiZhan_desc: "周の武王は諸侯を会して紂を討ち、牧野で出陣の誓いを立てた。商軍は陣前で寝返り、紂王は鹿台に登って自ら焼け死んだ。周室八百年の基業はここに開かれた。"
 building_type_TK_20_30_ChangShaoZhiZhan: "古戦場"
 building_type_TK_20_30_ChangShaoZhiZhan_desc: "かつて両軍が激戦を交えた地。荒野では今なお折れた戟や欠けた鏃を拾うことができ、旅人は訪れるたびに往時を偲んで嘆息する。"
 TK_20_30_ChangShaoZhiZhan: "長勺の戦い"
 building_TK_20_30_ChangShaoZhiZhan: "$TK_20_30_ChangShaoZhiZhan$"
 building_TK_20_30_ChangShaoZhiZhan_desc: "斉軍が魯を討ち、魯の荘公は長勺でこれを迎え撃った。曹劌は斉軍が三度太鼓を打つのを待ってから進撃した。いわゆる一鼓して気を作し、再びして衰え、三たびして竭くであり、魯軍はついに斉軍を大いに破った。"
 building_type_TK_20_30_ChangPingZhiZhan: "古戦場"
 building_type_TK_20_30_ChangPingZhiZhan_desc: "かつて両軍が激戦を交えた地。荒野では今なお折れた戟や欠けた鏃を拾うことができ、旅人は訪れるたびに往時を偲んで嘆息する。"
 TK_20_30_ChangPingZhiZhan: "長平の戦い"
 building_TK_20_30_ChangPingZhiZhan: "$TK_20_30_ChangPingZhiZhan$"
 building_TK_20_30_ChangPingZhiZhan_desc: "秦と趙は上党を争い、長平で対峙した。趙王は反間の計にかかり、趙括を廉頗に代えて将としたが、趙括は敗れて戦死し、四十余万の降卒はことごとく白起に生き埋めにされた。今なお山野ではしばしば枯骨が掘り出される。"
 building_type_TK_20_30_GaiXiaZhiZhan: "古戦場"
 building_type_TK_20_30_GaiXiaZhiZhan_desc: "かつて両軍が激戦を交えた地。荒野では今なお折れた戟や欠けた鏃を拾うことができ、旅人は訪れるたびに往時を偲んで嘆息する。"
 TK_20_30_GaiXiaZhiZhan: "垓下の戦い"
 building_TK_20_30_GaiXiaZhiZhan: "$TK_20_30_GaiXiaZhiZhan$"
 building_TK_20_30_GaiXiaZhiZhan_desc: "高祖は諸侯の兵を会して、項羽を垓下に囲んだ。夜に四面から楚歌が聞こえると、項王は帳中で悲歌して酒を飲み、虞姫と訣別して包囲を突破し南へ走ったが、ついに烏江で自刎し、漢の天下はこれにより定まった。"
 building_type_TK_20_30_KunYangZhiZhan: "古戦場"
 building_type_TK_20_30_KunYangZhiZhan_desc: "かつて両軍が激戦を交えた地。荒野では今なお折れた戟や欠けた鏃を拾うことができ、旅人は訪れるたびに往時を偲んで嘆息する。"
 TK_20_30_KunYangZhiZhan: "昆陽の戦い"
 building_TK_20_30_KunYangZhiZhan: "$TK_20_30_KunYangZhiZhan$"
 building_TK_20_30_KunYangZhiZhan_desc: "王莽は大軍を遣わして昆陽を包囲し、旌旗と輜重は千里に連なった。光武皇帝が決死の士を率いて陣に突撃すると、折しも雷雨が激しく起こり、莽軍は潰走して互いに踏みつけ合い、漢室はこれにより中興した。"
 building_type_TK_20_30_ChiBiZhiZhan: "古戦場"
 building_type_TK_20_30_ChiBiZhiZhan_desc: "かつて両軍が激戦を交えた地。荒野では今なお折れた戟や欠けた鏃を拾うことができ、旅人は訪れるたびに往時を偲んで嘆息する。"
 TK_20_30_ChiBiZhiZhan: "赤壁の戦い"
 building_TK_20_30_ChiBiZhiZhan: "$TK_20_30_ChiBiZhiZhan$"
 building_TK_20_30_ChiBiZhiZhan_desc: "大江がこの地を流れ、南岸には赤い崖が削ったように切り立ち、北岸の烏林がこれと相対する。川面は広く、風向きは定まらない。水軍がここで対峙すれば、勝敗はしばしば一陣の東風にかかる。"
 building_type_TK_20_30_YiLingZhiZhan: "古戦場"
 building_type_TK_20_30_YiLingZhiZhan_desc: "かつて両軍が激戦を交えた地。荒野では今なお折れた戟や欠けた鏃を拾うことができ、旅人は訪れるたびに往時を偲んで嘆息する。"
 TK_20_30_YiLingZhiZhan: "夷陵の戦い"
 building_TK_20_30_YiLingZhiZhan: "$TK_20_30_YiLingZhiZhan$"
 building_TK_20_30_YiLingZhiZhan_desc: "大江が峡谷を出た後も、夷陵・猇亭一帯はなお山が険しく木々が茂り、蜀から東へ荊楚に出るにはみなここを通る。もしここで山間に陣営を連ねれば、ひとたび火に遭うと前後を顧みることができない。"
 building_type_TK_20_30_FeiShuiZhiZhan: "古戦場"
 building_type_TK_20_30_FeiShuiZhiZhan_desc: "かつて両軍が激戦を交えた地。荒野では今なお折れた戟や欠けた鏃を拾うことができ、旅人は訪れるたびに往時を偲んで嘆息する。"
 TK_20_30_FeiShuiZhiZhan: "淝水の戦い"
 building_TK_20_30_FeiShuiZhiZhan: "$TK_20_30_FeiShuiZhiZhan$"
 building_TK_20_30_FeiShuiZhiZhan_desc: "淝水は寿春の城下を流れて北の淮水に入り、江淮の間で南北が兵を交える際の必経の地である。城の北の八公山は、淮南王劉安と八人の食客が丹を練って昇仙した所と伝わる。"
 building_type_TK_20_30_CanHePoZhiZhan: "古戦場"
 building_type_TK_20_30_CanHePoZhiZhan_desc: "かつて両軍が激戦を交えた地。荒野では今なお折れた戟や欠けた鏃を拾うことができ、旅人は訪れるたびに往時を偲んで嘆息する。"
 TK_20_30_CanHePoZhiZhan: "参合陂の戦い"
 building_TK_20_30_CanHePoZhiZhan: "$TK_20_30_CanHePoZhiZhan$"
 building_TK_20_30_CanHePoZhiZhan_desc: "代郡参合県の境には塞上の湖沼が連なり、水と草が豊かで、胡騎が南下する要路である。高祖の時、韓王信が匈奴と結んで反乱を起こすと、漢将柴武がここでその軍を大いに破り、参合で信を斬った。"
 building_type_TK_20_30_BaiJiangKouZhiZhan: "古戦場"
 building_type_TK_20_30_BaiJiangKouZhiZhan_desc: "かつて両軍が激戦を交えた地。荒野では今なお折れた戟や欠けた鏃を拾うことができ、旅人は訪れるたびに往時を偲んで嘆息する。"
 TK_20_30_BaiJiangKouZhiZhan: "白江口の戦い"
 building_TK_20_30_BaiJiangKouZhiZhan: "$TK_20_30_BaiJiangKouZhiZhan$"
 building_TK_20_30_BaiJiangKouZhiZhan_desc: "馬韓の地で大江がここから海に注ぐ。河口は広く、潮の干満はきわめて大きい。干潟が連なり、船の出入りは潮を待たねばならず、少しでも油断すれば座礁してしまう。"
 building_type_TK_20_30_XiangJiSiZhiZhan: "古戦場"
 building_type_TK_20_30_XiangJiSiZhiZhan_desc: "かつて両軍が激戦を交えた地。荒野では今なお折れた戟や欠けた鏃を拾うことができ、旅人は訪れるたびに往時を偲んで嘆息する。"
 TK_20_30_XiangJiSiZhiZhan: "香積寺の戦い"
 building_TK_20_30_XiangJiSiZhiZhan: "$TK_20_30_XiangJiSiZhiZhan$"
 building_TK_20_30_XiangJiSiZhiZhan_desc: "長安城南の灃水と潏水の間には平坦で広い原野が広がり、南は終南山に寄り、北は長安の城闕を望む。京畿の南の門戸である。"
 building_type_TK_20_30_GaoLiangHeZhiZhan: "古戦場"
 building_type_TK_20_30_GaoLiangHeZhiZhan_desc: "かつて両軍が激戦を交えた地。荒野では今なお折れた戟や欠けた鏃を拾うことができ、旅人は訪れるたびに往時を偲んで嘆息する。"
 TK_20_30_GaoLiangHeZhiZhan: "高粱河の戦い"
 building_TK_20_30_GaoLiangHeZhiZhan: "$TK_20_30_GaoLiangHeZhiZhan$"
 building_TK_20_30_GaoLiangHeZhiZhan_desc: "薊城の西郊を一筋の小川が平野と沼沢の間を流れている。川辺には葦が生い茂り、地勢は低くぬかるみ、大軍がここで力を発揮するのは難しい。"
 building_type_TK_20_31_DuJiangYan: "水利工事"
 building_type_TK_20_31_DuJiangYan_desc: "先人が水路を開き堰を築き、水を導いて田を潤した功績。沿岸の田畑はこれによって旱魃や洪水を免れ、民は代々その恩を偲ぶ。"
 TK_20_31_DuJiangYan: "都江堰"
 building_TK_20_31_DuJiangYan: "$TK_20_31_DuJiangYan$"
 building_TK_20_31_DuJiangYan_desc: "蜀郡太守李冰は離堆を穿って岷江の水を分け、堰を築いて流れを導き、蜀中千里の沃野を灌漑した。以来蜀の地は水も旱も人の意のままとなって飢饉を知らず、天下はこれを天府と呼んだ。"
 building_type_TK_20_31_LingQu: "水利工事"
 building_type_TK_20_31_LingQu_desc: "先人が水路を開き堰を築き、水を導いて田を潤した功績。沿岸の田畑はこれによって旱魃や洪水を免れ、民は代々その恩を偲ぶ。"
 TK_20_31_LingQu: "霊渠"
 building_TK_20_31_LingQu: "$TK_20_31_LingQu$"
 building_TK_20_31_LingQu_desc: "始皇帝は南の百越を征するにあたり、監禄に命じて渠を掘らせ、湘水と漓水を結んで、楼船や兵糧が大江からそのまま嶺南へ入れるようにした。水路は狭いながらも、南北の水運を結びつけた。"
 building_type_TK_20_31_KanErJing: "水利工事"
 building_type_TK_20_31_KanErJing_desc: "先人が水路を開き堰を築き、水を導いて田を潤した功績。沿岸の田畑はこれによって旱魃や洪水を免れ、民は代々その恩を偲ぶ。"
 TK_20_31_KanErJing: "カレーズ"
 building_TK_20_31_KanErJing: "$TK_20_31_KanErJing$"
 building_TK_20_31_KanErJing_desc: "西域は乾燥して雨が少なく、土地の人と屯田の漢軍は地下に暗渠を掘り、一定の間隔ごとに竪井を掘ってつなぎ、雪山の水を地下から引き出して田を灌漑した。これを井渠と呼ぶ。"
 building_type_TK_20_32_MoGaoKu: "石窟・碑刻"
 building_type_TK_20_32_MoGaoKu_desc: "山に依って石を穿った所。鑿の痕の間に、先人の敬虔さと技芸がうかがえる。"
 TK_20_32_MoGaoKu: "莫高窟"
 building_TK_20_32_MoGaoKu: "$TK_20_32_MoGaoKu$"
 building_TK_20_32_MoGaoKu_desc: "敦煌城の東南に鳴沙山があり、砂の嶺が起伏して、人馬が通れば轟音を発する。山麓の崖は小川に臨み、向かいの三危山は舜が三苗を流した所と伝わる。"
 building_type_TK_20_32_YunGangShiKu: "石窟・碑刻"
 building_type_TK_20_32_YunGangShiKu_desc: "山に依って石を穿った所。鑿の痕の間に、先人の敬虔さと技芸がうかがえる。"
 TK_20_32_YunGangShiKu: "雲岡石窟"
 building_TK_20_32_YunGangShiKu: "$TK_20_32_YunGangShiKu$"
 building_TK_20_32_YunGangShiKu_desc: "雁門郡平城の西に武州山があり、山麓には武州塞が置かれ、漢が塞外を扼する要害である。孝武皇帝の時に馬邑の謀がめぐらされ、匈奴の単于が十万騎を率いて塞内に入ったのもここからであった。"
 building_type_TK_20_32_LongMenShiKu: "石窟・碑刻"
 building_type_TK_20_32_LongMenShiKu_desc: "山に依って石を穿った所。鑿の痕の間に、先人の敬虔さと技芸がうかがえる。"
 TK_20_32_LongMenShiKu: "龍門石窟"
 building_TK_20_32_LongMenShiKu: "$TK_20_32_LongMenShiKu$"
 building_TK_20_32_LongMenShiKu_desc: "洛陽の南では伊水が二つの山の間を貫いて流れ、両山は闕門のように対峙しているため伊闕と呼ばれる。大禹が治水の際にこの山を穿ち、伊水を北へ導いたと伝わる。"
 building_type_TK_20_32_DaZuShiKe: "石窟・碑刻"
 building_type_TK_20_32_DaZuShiKe_desc: "山に依って石を穿った所。鑿の痕の間に、先人の敬虔さと技芸がうかがえる。"
 TK_20_32_DaZuShiKe: "大足石刻"
 building_TK_20_32_DaZuShiKe: "$TK_20_32_DaZuShiKe$"
 building_TK_20_32_DaZuShiKe_desc: "巴郡西部の丘陵の間は、山はさほど高くないが岩肌がむき出しで、渓流が縦横に走る。郷民は山に沿って田を開き、民風は質朴である。"
 building_type_TK_20_32_LeShanDaFu: "石窟・碑刻"
 building_type_TK_20_32_LeShanDaFu_desc: "山に依って石を穿った所。鑿の痕の間に、先人の敬虔さと技芸がうかがえる。"
 TK_20_32_LeShanDaFu: "楽山大仏"
 building_TK_20_32_LeShanDaFu: "$TK_20_32_LeShanDaFu$"
 building_TK_20_32_LeShanDaFu_desc: "犍為南安の城外では、沫水・青衣水と岷江がここで合流し、水勢は激しく、しばしば舟が転覆する。江に臨む崖は削ったように切り立ち、舟人はここを通るとき誰もが息を殺す。"
 building_type_TK_20_32_MaiJiShanShiKu: "石窟・碑刻"
 building_type_TK_20_32_MaiJiShanShiKu_desc: "山に依って石を穿った所。鑿の痕の間に、先人の敬虔さと技芸がうかがえる。"
 TK_20_32_MaiJiShanShiKu: "麦積山石窟"
 building_TK_20_32_MaiJiShanShiKu: "$TK_20_32_MaiJiShanShiKu$"
 building_TK_20_32_MaiJiShanShiKu_desc: "漢陽郡の南の群山の中に、一つの孤峰が地からそそり立つ。その形が農家の積み上げた麦の山に似ていることから、郷人は麦積山と呼ぶ。山上の松柏は青々とし、雲霧が時に湧き時に散る。"
 building_type_TK_20_36_YanMenGuan: "関所・険隘"
 building_type_TK_20_36_YanMenGuan_desc: "山川の険に拠って関を設け隘を立てる。一夫関に当たれば万夫も開くなし。往来の旅人は符伝を検められてはじめて通ることができる。"
 TK_20_36_YanMenGuan: "雁門関"
 building_TK_20_36_YanMenGuan: "$TK_20_36_YanMenGuan$"
 building_TK_20_36_YanMenGuan_desc: "雁門郡の南に句注山があり、二つの山が門のように対峙していて、鴻雁が南へ渡り北へ帰る際はみなここを通り抜けると伝わる。山上には句注塞が置かれ、胡騎が太原へ南下する要路を扼し、天下九塞の一つに数えられる。"
 building_type_TK_20_36_YuMenGuan: "関所・険隘"
 building_type_TK_20_36_YuMenGuan_desc: "山川の険に拠って関を設け隘を立てる。一夫関に当たれば万夫も開くなし。往来の旅人は符伝を検められてはじめて通ることができる。"
 TK_20_36_YuMenGuan: "玉門関"
 building_TK_20_36_YuMenGuan: "$TK_20_36_YuMenGuan$"
 building_TK_20_36_YuMenGuan_desc: "敦煌郡の西北にある関所で、孝武皇帝の時に設けられた。西域諸国の使節や商人はみなこの関を経て塞内に入る。于闐の美玉もここから運び込まれたと伝わり、ゆえに玉門と名づけられた。関を出れば、流沙が千里に広がる。"
 building_type_TK_20_36_YangGuan: "関所・険隘"
 building_type_TK_20_36_YangGuan_desc: "山川の険に拠って関を設け隘を立てる。一夫関に当たれば万夫も開くなし。往来の旅人は符伝を検められてはじめて通ることができる。"
 TK_20_36_YangGuan: "陽関"
 building_TK_20_36_YangGuan: "$TK_20_36_YangGuan$"
 building_TK_20_36_YangGuan_desc: "陽関は玉門関の南にあるため陽関と呼ばれ、西域南道へ西に出る門戸である。関の外は砂礫が果てしなく広がり、水も草も乏しく、見送りの人はたいていここで足を止める。"
 building_type_TK_20_36_JianMenGuan: "関所・険隘"
 building_type_TK_20_36_JianMenGuan_desc: "山川の険に拠って関を設け隘を立てる。一夫関に当たれば万夫も開くなし。往来の旅人は符伝を検められてはじめて通ることができる。"
 TK_20_36_JianMenGuan: "剣門関"
 building_TK_20_36_JianMenGuan: "$TK_20_36_JianMenGuan$"
 building_TK_20_36_JianMenGuan_desc: "大剣・小剣の二つの山の間では、両側の崖が剣のように向かい合い、その間はわずか一筋の道が通るのみで、まさに一つの石門のようである。秦人が石牛道を開いて蜀に入ったのもここを通ってであり、一人がこれを守れば万人も越え難い。"
 building_type_TK_20_36_WuGuan: "関所・険隘"
 building_type_TK_20_36_WuGuan_desc: "山川の険に拠って関を設け隘を立てる。一夫関に当たれば万夫も開くなし。往来の旅人は符伝を検められてはじめて通ることができる。"
 TK_20_36_WuGuan: "武関"
 building_TK_20_36_WuGuan: "$TK_20_36_WuGuan$"
 building_TK_20_36_WuGuan_desc: "武関は秦嶺の東南の山谷にあり、春秋時代には少習と呼ばれた。関中から南陽・荊楚へ通じる咽喉である。秦の昭王はかつてここで楚の懐王を誘い出して捕らえ、高祖が関中に入ったのもここを破って進んだのであった。"
 building_type_TK_20_36_HuLaoGuan: "関所・険隘"
 building_type_TK_20_36_HuLaoGuan_desc: "山川の険に拠って関を設け隘を立てる。一夫関に当たれば万夫も開くなし。往来の旅人は符伝を検められてはじめて通ることができる。"
 TK_20_36_HuLaoGuan: "虎牢関"
 building_TK_20_36_HuLaoGuan: "$TK_20_36_HuLaoGuan$"
 building_TK_20_36_HuLaoGuan_desc: "成皋の険は南は嵩高に連なり、北は大河に臨み、山嶺が入り組んで、洛陽の東の門戸となっている。周の穆王がかつてここで猛虎を飼ったことから虎牢と呼ばれると伝わる。楚漢の際には、高祖と項羽がここで年を越えて対峙した。"
 building_type_TK_20_36_DaSanGuan: "関所・険隘"
 building_type_TK_20_36_DaSanGuan_desc: "山川の険に拠って関を設け隘を立てる。一夫関に当たれば万夫も開くなし。往来の旅人は符伝を検められてはじめて通ることができる。"
 TK_20_36_DaSanGuan: "大散関"
 building_TK_20_36_DaSanGuan: "$TK_20_36_DaSanGuan$"
 building_TK_20_36_DaSanGuan_desc: "散関は陳倉の南の大散嶺の上にあり、関中から漢中・巴蜀へ入る道を扼している。かつて高祖が漢中から兵を出して三秦を平定した際も、ここを通って北上した。"
 building_type_TK_20_36_TongGuan: "関所・険隘"
 building_type_TK_20_36_TongGuan_desc: "山川の険に拠って関を設け隘を立てる。一夫関に当たれば万夫も開くなし。往来の旅人は符伝を検められてはじめて通ることができる。"
 TK_20_36_TongGuan: "潼関"
 building_TK_20_36_TongGuan: "$TK_20_36_TongGuan$"
 building_TK_20_36_TongGuan_desc: "大河は北から南へ流れてここに至り、折れて東へ向かう。河水が関山に激しく打ち寄せることから潼と呼ばれる。この地は北に大河を臨み、南に秦嶺を負い、長安と洛陽の間の通路を扼する、地勢険要の地である。"
 building_type_TK_20_36_ShanHaiGuan: "関所・険隘"
 building_type_TK_20_36_ShanHaiGuan_desc: "山川の険に拠って関を設け隘を立てる。一夫関に当たれば万夫も開くなし。往来の旅人は符伝を検められてはじめて通ることができる。"
 TK_20_36_ShanHaiGuan: "山海関"
 building_TK_20_36_ShanHaiGuan: "$TK_20_36_ShanHaiGuan$"
 building_TK_20_36_ShanHaiGuan_desc: "遼西郡臨渝県では燕山の余脈がここで海辺にまで迫り、山と海の間にはわずか一筋の通路が残るのみで、幽州から遼東へ通じる必経の道である。始皇帝と孝武皇帝が東巡した際、いずれも海辺の碣石に登って海を観たと伝わる。"
 building_type_TK_20_36_XiaoGuan: "関所・険隘"
 building_type_TK_20_36_XiaoGuan_desc: "山川の険に拠って関を設け隘を立てる。一夫関に当たれば万夫も開くなし。往来の旅人は符伝を検められてはじめて通ることができる。"
 TK_20_36_XiaoGuan: "蕭関"
 building_TK_20_36_XiaoGuan: "$TK_20_36_XiaoGuan$"
 building_TK_20_36_XiaoGuan_desc: "蕭関は安定郡の領内にあり、隴山を背に涇水の河谷を扼し、隴西・北地から関中へ通じる門戸である。孝文皇帝の時、匈奴の十四万騎が蕭関を破り、遊騎は甘泉にまで達した。"
 building_type_TK_20_37_QuanZhouGang: "港・渡し・海峡"
 building_type_TK_20_37_QuanZhouGang_desc: "舟が集まる渡し場や港湾。商人はここから行き来し、百貨がここで集散する。"
 TK_20_37_QuanZhouGang: "泉州港"
 building_TK_20_37_QuanZhouGang: "$TK_20_37_QuanZhouGang$"
 building_TK_20_37_QuanZhouGang_desc: "閩中の一筋の大江が海に注ぐ所で、港湾は入り組んで風濤を避けることができる。閩越の旧民は舟の操りに長け、沿海の漁船が湾の間を行き交う。"
 building_type_TK_20_37_BoDuoGang: "港・渡し・海峡"
 building_type_TK_20_37_BoDuoGang_desc: "舟が集まる渡し場や港湾。商人はここから行き来し、百貨がここで集散する。"
 TK_20_37_BoDuoGang: "博多港"
 building_TK_20_37_BoDuoGang: "$TK_20_37_BoDuoGang$"
 building_TK_20_37_BoDuoGang_desc: "倭地の奴国がある湾で、山を背に海に面し、風浪は穏やかである。倭人が海を渡って三韓や楽浪へ向かう出発の地である。光武皇帝の時、奴国はかつて使者を遣わして貢物を奉り、金印を賜った。"
 building_type_TK_20_37_BiLanDu: "港・渡し・海峡"
 building_type_TK_20_37_BiLanDu_desc: "舟が集まる渡し場や港湾。商人はここから行き来し、百貨がここで集散する。"
 TK_20_37_BiLanDu: "碧瀾渡"
 building_TK_20_37_BiLanDu: "$TK_20_37_BiLanDu$"
 building_TK_20_37_BiLanDu_desc: "楽浪郡の南境で、一筋の大江がここで西海に注ぐ。河口は広く、潮の干満の際には大船も出入りできる。楽浪と三韓の間を往来する商船の多くはここに停泊する。"
 building_type_TK_20_40_DongYueTaiShan: "五岳"
 building_type_TK_20_40_DongYueTaiShan_desc: "五岳は天下の四方と中央を鎮め、天子が巡狩する際は必ずここで祭りを行う。群山の及ぶところではない。"
 TK_20_40_DongYueTaiShan: "東岳泰山"
 building_TK_20_40_DongYueTaiShan: "$TK_20_40_DongYueTaiShan$"
 building_TK_20_40_DongYueTaiShan_desc: "泰山は五岳の長であり、古来天命を受けた帝王は必ず泰山に登って封禅し、成功を天に告げた。始皇帝・孝武皇帝・光武皇帝はいずれもここで封禅の礼を行った。また世の人は、人が死ねば魂は泰山に帰ると伝える。"
 building_type_TK_20_40_NanYueHengShan: "五岳"
 building_type_TK_20_40_NanYueHengShan_desc: "五岳は天下の四方と中央を鎮め、天子が巡狩する際は必ずここで祭りを行う。群山の及ぶところではない。"
 TK_20_40_NanYueHengShan: "南岳衡山"
 building_TK_20_40_NanYueHengShan: "$TK_20_40_NanYueHengShan$"
 building_TK_20_40_NanYueHengShan_desc: "衡山の七十二峰は連綿と起伏する。その位置は天の星宿に応じ、秤の竿のように天地を量ることができるとされ、ゆえに衡山と名づけられたと伝わる。舜帝は南巡の折、南岳に至って祭りを行った。"
 building_type_TK_20_40_XiYueHuaShan: "五岳"
 building_type_TK_20_40_XiYueHuaShan_desc: "五岳は天下の四方と中央を鎮め、天子が巡狩する際は必ずここで祭りを行う。群山の及ぶところではない。"
 TK_20_40_XiYueHuaShan: "西岳華山"
 building_TK_20_40_XiYueHuaShan: "$TK_20_40_XiYueHuaShan$"
 building_TK_20_40_XiYueHuaShan_desc: "華山は弘農華陰県の南にあり、五つの峰がそびえ立ち、四方は削ったように切り立って、その険しさは諸山に冠たる。山麓には西岳廟があり、朝廷は時節ごとに使者を遣わして祭りを行い、廟中には碑碣が林立している。"
 building_type_TK_20_40_BeiYueHengShan: "五岳"
 building_type_TK_20_40_BeiYueHengShan_desc: "五岳は天下の四方と中央を鎮め、天子が巡狩する際は必ずここで祭りを行う。群山の及ぶところではない。"
 TK_20_40_BeiYueHengShan: "北岳恒山"
 building_TK_20_40_BeiYueHengShan: "$TK_20_40_BeiYueHengShan$"
 building_TK_20_40_BeiYueHengShan_desc: "北岳はもとの名を恒山といったが、孝文皇帝の諱を避けて常山と改称された。群峰が幾重にも連なり、代の地と冀州の間に横たわる、北方諸山の宗であり、天子は時節ごとに使者を遣わして祭りを行う。"
 building_type_TK_20_40_ZhongYueSongShan: "五岳"
 building_type_TK_20_40_ZhongYueSongShan_desc: "五岳は天下の四方と中央を鎮め、天子が巡狩する際は必ずここで祭りを行う。群山の及ぶところではない。"
 TK_20_40_ZhongYueSongShan: "中岳嵩山"
 building_TK_20_40_ZhongYueSongShan: "$TK_20_40_ZhongYueSongShan$"
 building_TK_20_40_ZhongYueSongShan_desc: "嵩高は天下の中央に位置し、太室・少室の両山が東西に対峙する。孝武皇帝が太室に登った際、従官が山麓で三たび万歳を呼ぶ声を聞いたと伝わり、そこで山麓の三百戸に祭祀を奉らせ、崇高邑と号した。"
 building_type_TK_20_41_HuangShan: "名山"
 building_type_TK_20_41_HuangShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_HuangShan: "黄山"
 building_TK_20_41_HuangShan: "$TK_20_41_HuangShan$"
 building_TK_20_41_HuangShan_desc: "丹陽郡黟県の境内に黟山があり、峰や岩は青黒く、遠くから望むと深い青に見えるため、黟の名がつけられた。山中には奇松怪石があり、雲海が湧き返る。黄帝がかつてここで丹を練ったと伝わる。"
 building_type_TK_20_41_LuShan: "名山"
 building_type_TK_20_41_LuShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_LuShan: "廬山"
 building_TK_20_41_LuShan: "$TK_20_41_LuShan$"
 building_TK_20_41_LuShan_desc: "廬山は彭蠡沢の西にあり、周の時代に匡俗の兄弟がここに庵を結んで道を修めたと伝わり、ゆえに匡廬とも呼ばれる。太史公はかつて南へ廬山に登り、大禹が疏通した九江を観た。"
 building_type_TK_20_41_ShenNongShan: "名山"
 building_type_TK_20_41_ShenNongShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_ShenNongShan: "神農山"
 building_TK_20_41_ShenNongShan: "$TK_20_41_ShenNongShan$"
 building_TK_20_41_ShenNongShan_desc: "河内郡の北の太行山中で、炎帝神農氏がかつてここで五穀を見分け、百草を嘗め、壇を築いて天を祀ったと伝わる。山勢は険しく、峰は龍の背のように雲霧の間をうねっている。"
 building_type_TK_20_41_LaoJunShan: "名山"
 building_type_TK_20_41_LaoJunShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_LaoJunShan: "老君山"
 building_TK_20_41_LaoJunShan: "$TK_20_41_LaoJunShan$"
 building_TK_20_41_LaoJunShan_desc: "景室山は伏牛の群山の主峰で、老子が西の函谷関を出る前にこの山に隠棲して修行したと伝わる。山上には雲霧がたなびき、道を修める者の多くがその名を慕ってやって来る。"
 building_type_TK_20_41_WuDangShan: "名山"
 building_type_TK_20_41_WuDangShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_WuDangShan: "武当山"
 building_TK_20_41_WuDangShan: "$TK_20_41_WuDangShan$"
 building_TK_20_41_WuDangShan_desc: "武当山は南陽郡武当県の境内にあり、群峰が主峰を囲み、岩と谷は奥深く、古くは太和山と呼ばれた。周の時代に尹喜がここに隠棲したと伝わり、山中にはしばしば方士が庵を結んで修行している。"
 building_type_TK_20_41_LongHuShan: "名山"
 building_type_TK_20_41_LongHuShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_LongHuShan: "龍虎山"
 building_TK_20_41_LongHuShan: "$TK_20_41_LongHuShan$"
 building_TK_20_41_LongHuShan_desc: "豫章東部の群山の中、赤い崖と碧い水があり、二つの峰が向かい合って龍が蟠り虎が踞るかのようであることから龍虎と名づけられた。張道陵がかつてここで丹を練り、丹が成ると龍虎が現れたと伝わる。"
 building_type_TK_20_41_QingChengShan: "名山"
 building_type_TK_20_41_QingChengShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_QingChengShan: "青城山"
 building_TK_20_41_QingChengShan: "$TK_20_41_QingChengShan$"
 building_TK_20_41_QingChengShan_desc: "青城山の諸峰は環のように取り囲み、城郭のような形をしていて、木々は四季を通じて青々としている。黄帝がかつてここで寧封子を五岳丈人として拝したと伝わる。順帝の時、張道陵が蜀に入り、鶴鳴・青城一帯で道を伝え、信者は巴蜀と漢中に遍く広がった。"
 building_type_TK_20_41_QiYunShan: "名山"
 building_type_TK_20_41_QiYunShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_QiYunShan: "斉雲山"
 building_TK_20_41_QiYunShan: "$TK_20_41_QiYunShan$"
 building_TK_20_41_QiYunShan_desc: "丹陽郡の南境に白岳という山があり、峰の頂は雲と同じ高さで、崖壁は丹のように赤く、山間には清泉や飛瀑があって人跡まれである。"
 building_type_TK_20_41_JingFuShan: "名山"
 building_type_TK_20_41_JingFuShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_JingFuShan: "景福山"
 building_TK_20_41_JingFuShan: "$TK_20_41_JingFuShan$"
 building_TK_20_41_JingFuShan_desc: "扶風汧県の西境にある龍門山は、峰々が青く重なり、岩窟は深く静かである。古に仙人が岩の中に棲んだと伝わり、ゆえに霊仙岩とも呼ばれる。"
 building_type_TK_20_41_MaoShan: "名山"
 building_type_TK_20_41_MaoShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_MaoShan: "茅山"
 building_TK_20_41_MaoShan: "$TK_20_41_MaoShan$"
 building_TK_20_41_MaoShan_desc: "句曲山は山勢が曲がりくねり、「己」の字のような形をしていることから句曲と名づけられた。孝景皇帝の時、茅盈・茅固・茅衷の三兄弟がここで道を修め善行を積み、郷人はその徳に感じて三茅山と改称したと伝わる。"
 building_type_TK_20_41_WuTaiShan: "名山"
 building_type_TK_20_41_WuTaiShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_WuTaiShan: "五台山"
 building_TK_20_41_WuTaiShan: "$TK_20_41_WuTaiShan$"
 building_TK_20_41_WuTaiShan_desc: "五つの峰が環のように連なり、峰の頂は台のように平らで、盛夏にもなお積雪がある。古の方士はこれを紫府山と呼び、ここで修行した。孝明皇帝の時、西から来た沙門もここに寺を建てて経を講じたと伝わる。"
 building_type_TK_20_41_EMeiShan: "名山"
 building_type_TK_20_41_EMeiShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_EMeiShan: "峨眉山"
 building_TK_20_41_EMeiShan: "$TK_20_41_EMeiShan$"
 building_TK_20_41_EMeiShan_desc: "峨眉山は犍為郡南安県の境内にあり、二つの峰が蛾の眉のように向かい合うことからその名がある。山は雲に届くほど高く、木々は奥深い。周の時代に仙人葛由が木の羊に乗って蜀に入り、彼に従った者はみなこの山のあたりで道を得て仙人となったと伝わる。"
 building_type_TK_20_41_PuTuoShan: "名山"
 building_type_TK_20_41_PuTuoShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_PuTuoShan: "普陀山"
 building_TK_20_41_PuTuoShan: "$TK_20_41_PuTuoShan$"
 building_TK_20_41_PuTuoShan_desc: "会稽の東海の中に一つの小島があり、島には岩がごつごつとそびえ、木々が青々と茂る。王莽が専権を振るった頃、南昌尉の梅福が家を捨てて出奔し、ここに隠棲して丹を練ったと伝わり、島の山は梅岑と呼ばれるようになった。"
 building_type_TK_20_41_JiuHuaShan: "名山"
 building_type_TK_20_41_JiuHuaShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_JiuHuaShan: "九華山"
 building_TK_20_41_JiuHuaShan: "$TK_20_41_JiuHuaShan$"
 building_TK_20_41_JiuHuaShan_desc: "江南の群山の中に九つの峰が並び立ち、その頂はしばしば雲霧の中に見え隠れする。林は深く泉は静かで、人跡まれである。"
 building_type_TK_20_41_FanJingShan: "名山"
 building_type_TK_20_41_FanJingShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_FanJingShan: "梵浄山"
 building_TK_20_41_FanJingShan: "$TK_20_41_FanJingShan$"
 building_TK_20_41_FanJingShan_desc: "武陵郡西部の深山の中に群峰が地からそそり立ち、一年中雲霧がたなびく。武陵蛮の人々はこれを神山として奉り、祭祀のたびに山麓に集まる。"
 building_type_TK_20_41_KongDongShan: "名山"
 building_type_TK_20_41_KongDongShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_KongDongShan: "崆峒山"
 building_TK_20_41_KongDongShan: "$TK_20_41_KongDongShan$"
 building_TK_20_41_KongDongShan_desc: "崆峒山は安定郡の境内にあり、黄帝が自らこの山に至り、仙人広成子に身を治める道を問うたと伝わる。孝武皇帝が西巡した際も、隴山を越えて崆峒に登った。"
 building_type_TK_20_41_XuanWuShan: "名山"
 building_type_TK_20_41_XuanWuShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_XuanWuShan: "玄武山"
 building_TK_20_41_XuanWuShan: "$TK_20_41_XuanWuShan$"
 building_TK_20_41_XuanWuShan_desc: "南海郡東境の海辺に小さな丘があり、丘の上は木々が青々と茂り、南はすぐに果てしない大海である。漁師は海から戻る際、遠くにこの丘を望むと故郷に着いたことを知る。"
 building_type_TK_20_41_YanDangShan: "名山"
 building_type_TK_20_41_YanDangShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_YanDangShan: "雁蕩山"
 building_TK_20_41_YanDangShan: "$TK_20_41_YanDangShan$"
 building_TK_20_41_YanDangShan_desc: "会稽南部の海辺の群山で、奇峰怪石が林立する。山頂には葦の生い茂る湖があり、秋になると鴻雁の多くがここに宿ることから雁蕩と名づけられたと伝わる。"
 building_type_TK_20_41_SanQingShan: "名山"
 building_type_TK_20_41_SanQingShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_SanQingShan: "三清山"
 building_TK_20_41_SanQingShan: "$TK_20_41_SanQingShan$"
 building_TK_20_41_SanQingShan_desc: "鄱陽の東境に一つの山があり、三つの峰が並び立つさまは、あたかも三柱の尊神が山頂に列座しているかのようである。山中には奇峰怪石があり、雲霧は一年中散ることがない。"
 building_type_TK_20_41_LaoShan: "名山"
 building_type_TK_20_41_LaoShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_LaoShan: "嶗山"
 building_TK_20_41_LaoShan: "$TK_20_41_LaoShan$"
 building_TK_20_41_LaoShan_desc: "東莱郡不其県の東南に嶗山が海に臨んでそびえ、海上の名山と号される。戦国以来、方士がここで修行してきた。孝武皇帝が東巡した際には、山麓の不其県に祠を建てて神を祀った。"
 building_type_TK_20_41_ZhongNanShan: "名山"
 building_type_TK_20_41_ZhongNanShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_ZhongNanShan: "終南山"
 building_TK_20_41_ZhongNanShan: "$TK_20_41_ZhongNanShan$"
 building_TK_20_41_ZhongNanShan_desc: "終南山は長安の南に横たわり、南山とも呼ばれ、数百里にわたって連なり、峰々が重なり合う。山中には隠士や方士が多く、老子がかつて山の北の楼観で尹喜のために道徳五千言を講じたと伝わる。"
 building_type_TK_20_41_MangDangShan: "名山"
 building_type_TK_20_41_MangDangShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_MangDangShan: "芒碭山"
 building_TK_20_41_MangDangShan: "$TK_20_41_MangDangShan$"
 building_TK_20_41_MangDangShan_desc: "芒碭山は梁国の領内にあり、山と沢が深く険しい。高祖は挙兵前、芒碭の山沢の間に逃れ隠れたことがあり、その居所にはいつも雲気がかかっていた。のちに梁の孝王以下歴代の梁王の多くが山を穿って陵とし、ここに眠っている。"
 building_type_TK_20_41_KunLunShan: "名山"
 building_type_TK_20_41_KunLunShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_KunLunShan: "崑崙山"
 building_TK_20_41_KunLunShan: "$TK_20_41_KunLunShan$"
 building_TK_20_41_KunLunShan_desc: "崑崙は西方のはるか遠くにあり、天帝の下界の都にして西王母の住まう所と伝えられ、河水はここに発する。孝武皇帝は古の図書に照らし、于闐の南で河水の流れ出る大山を崑崙と名づけた。"
 building_type_TK_20_41_QiLianDaXueShan: "名山"
 building_type_TK_20_41_QiLianDaXueShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_QiLianDaXueShan: "祁連大雪山"
 building_TK_20_41_QiLianDaXueShan: "$TK_20_41_QiLianDaXueShan$"
 building_TK_20_41_QiLianDaXueShan_desc: "祁連山は河西諸郡の南に横たわり、山頂は一年中雪に覆われ、雪解け水が麓の牧場を潤している。匈奴はこの山を失った後、「我が祁連山を失い、我が六畜をして蕃息せざらしむ」と悲しく歌った。"
 building_type_TK_20_41_ZhuMuLangMaFeng: "名山"
 building_type_TK_20_41_ZhuMuLangMaFeng_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_ZhuMuLangMaFeng: "チョモランマ"
 building_TK_20_41_ZhuMuLangMaFeng: "$TK_20_41_ZhuMuLangMaFeng$"
 building_TK_20_41_ZhuMuLangMaFeng_desc: "西南のはるか遠くに雪山が幾重にも連なり、その中の一峰は最も高く険しく、一年中氷雪に覆われて雲を突く。土地の人々はこれを神女の住まいとして奉り、軽々しく近づこうとはしない。"
 building_type_TK_20_41_BaiTouShan: "名山"
 building_type_TK_20_41_BaiTouShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_BaiTouShan: "白頭山"
 building_TK_20_41_BaiTouShan: "$TK_20_41_BaiTouShan$"
 building_TK_20_41_BaiTouShan_desc: "東北のはるか遠くに不咸山があり、山頂は一年中雪に覆われ、遠くから望むと一面真っ白である。『山海経』は粛慎の国がこの山の近くにあるといい、土地の人々はこれを神山として奉る。"
 building_type_TK_20_41_WuLiangShan: "名山"
 building_type_TK_20_41_WuLiangShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_WuLiangShan: "無量山"
 building_TK_20_41_WuLiangShan: "$TK_20_41_WuLiangShan$"
 building_TK_20_41_WuLiangShan_desc: "益州西南の群山の中で、蒙楽山の峰々は連綿として数え切れず、ゆえに無量と称される。山中は木々が天を衝き、瘴気が立ちこめ、珍しい鳥や奇妙な獣が出没する。"
 building_type_TK_20_41_DianCangShan: "名山"
 building_type_TK_20_41_DianCangShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_DianCangShan: "点蒼山"
 building_TK_20_41_DianCangShan: "$TK_20_41_DianCangShan$"
 building_TK_20_41_DianCangShan_desc: "点蒼山の諸峰は南北に連なり、山頂の積雪は年を経ても解けず、山の色が蒼く青々としていることからその名がある。山間の渓流は東へ流れ、ことごとく葉楡沢に注ぐ。"
 building_type_TK_20_41_YaoShan: "名山"
 building_type_TK_20_41_YaoShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_YaoShan: "堯山"
 building_TK_20_41_YaoShan: "$TK_20_41_YaoShan$"
 building_TK_20_41_YaoShan_desc: "魯陽県の西の堯山は、堯帝の末裔劉累がここに祠を建てて先祖を祀ったことから堯山と名づけられたと伝わる。劉氏の子孫はここを祖地と見なし、山中の峰や岩は奇秀で、林泉は清らかで静かである。"
 building_type_TK_20_41_LangJiXuShan: "名山"
 building_type_TK_20_41_LangJiXuShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_LangJiXuShan: "狼居胥山"
 building_TK_20_41_LangJiXuShan: "$TK_20_41_LangJiXuShan$"
 building_TK_20_41_LangJiXuShan_desc: "漠北の狼居胥山。孝武皇帝の時、驃騎将軍霍去病が匈奴に遠征して左賢王を大いに破り、狼居胥山に封じ、姑衍に禅し、瀚海に臨んで帰還した。以来「狼居胥に封ず」は天下の将兵が夢にまで見る功業となった。"
 building_type_TK_20_41_ZiJinShan: "名山"
 building_type_TK_20_41_ZiJinShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_ZiJinShan: "紫金山"
 building_TK_20_41_ZiJinShan: "$TK_20_41_ZiJinShan$"
 building_TK_20_41_ZiJinShan_desc: "秣陵城の東の鍾山は、山の形が龍のようにうねり、岩が日の光の下でかすかに紫色を帯びる、江東の名山である。"
 building_type_TK_20_41_JinGangShan: "名山"
 building_type_TK_20_41_JinGangShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_JinGangShan: "金剛山"
 building_TK_20_41_JinGangShan: "$TK_20_41_JinGangShan$"
 building_TK_20_41_JinGangShan_desc: "濊人の地の海辺の群山で、峰々は万を数え、岩は削ったように切り立ち、四季ごとに景色が異なる。秋には山一面の紅葉が炎のようである。"
 building_type_TK_20_41_FuShiShan: "名山"
 building_type_TK_20_41_FuShiShan_desc: "名山は雲に届くほど高くそびえ、古来方士や隠者が身を寄せる所であり、山中には多くの神仙の物語が伝わっている。"
 TK_20_41_FuShiShan: "富士山"
 building_TK_20_41_FuShiShan: "$TK_20_41_FuShiShan$"
 building_TK_20_41_FuShiShan_desc: "倭地の東方に一つの高山があり、伏せた笠のような形で、山頂は一年中雪に覆われ、時に煙と火を吐く。倭人はこれを神山と見なし、遠くに望むと必ず礼拝する。"
 building_type_TK_20_50_ChangBaiShanTianChi: "湖沼・水沢"
 building_type_TK_20_50_ChangBaiShanTianChi_desc: "大沢は果てしなく広がり、魚や蝦、菱や蓮根は取り尽くせない。水辺の民は漁猟と舟で生計を立てている。"
 TK_20_50_ChangBaiShanTianChi: "長白山天池"
 building_TK_20_50_ChangBaiShanTianChi: "$TK_20_50_ChangBaiShanTianChi$"
 building_TK_20_50_ChangBaiShanTianChi_desc: "不咸山の頂には深い池があり、四方を群峰に囲まれ、水の色は深い碧で、寒気が身に迫る。いくつもの大河がこの山から流れ出ている。土地の人々はこれを神池と見なし、軽々しく近づこうとはしない。"
 building_type_TK_20_50_XiHu: "湖沼・水沢"
 building_type_TK_20_50_XiHu_desc: "大沢は果てしなく広がり、魚や蝦、菱や蓮根は取り尽くせない。水辺の民は漁猟と舟で生計を立てている。"
 TK_20_50_XiHu: "西湖"
 building_TK_20_50_XiHu: "$TK_20_50_XiHu$"
 building_TK_20_50_XiHu_desc: "銭唐県の西に湖があり、三方を山に囲まれ、東は城郭に接する。かつて金の牛がその中に出没したと伝わり、ゆえに明聖湖とも呼ばれる。湖の光と山の色は、四季いずれも趣がある。"
 building_type_TK_20_50_QingHaiHu: "湖沼・水沢"
 building_type_TK_20_50_QingHaiHu_desc: "大沢は果てしなく広がり、魚や蝦、菱や蓮根は取り尽くせない。水辺の民は漁猟と舟で生計を立てている。"
 TK_20_50_QingHaiHu: "青海湖"
 building_TK_20_50_QingHaiHu: "$TK_20_50_QingHaiHu$"
 building_TK_20_50_QingHaiHu_desc: "湟中の西に大きな湖があり、湖水は苦く塩辛く、碧い波が果てしなく広がる。羌人はこれを卑禾羌海と呼ぶ。王莽の時、羌人を誘って土地を献じさせ、湖畔に西海郡を置いたが、まもなく荒廃した。"
 building_type_TK_20_50_YunMengZe: "湖沼・水沢"
 building_type_TK_20_50_YunMengZe_desc: "大沢は果てしなく広がり、魚や蝦、菱や蓮根は取り尽くせない。水辺の民は漁猟と舟で生計を立てている。"
 TK_20_50_YunMengZe: "雲夢沢"
 building_TK_20_50_YunMengZe: "$TK_20_50_YunMengZe$"
 building_TK_20_50_YunMengZe_desc: "楚国の旧時の大沢で、湖沼が連なり、葦や荻が生い茂る。司馬相如は『子虚賦』で雲夢は方九百里と述べ、楚王はしばしば沢中で狩猟を楽しんだ。"
 building_type_TK_20_50_DongTingHu: "湖沼・水沢"
 building_type_TK_20_50_DongTingHu_desc: "大沢は果てしなく広がり、魚や蝦、菱や蓮根は取り尽くせない。水辺の民は漁猟と舟で生計を立てている。"
 TK_20_50_DongTingHu: "洞庭湖"
 building_TK_20_50_DongTingHu: "$TK_20_50_DongTingHu$"
 building_TK_20_50_DongTingHu_desc: "洞庭湖は長沙郡の北にあり、湘・資・沅・澧の諸水がここに注ぎ、煙波は果てしない。湖中の君山は湘君の住まいと伝わる。舜帝が南巡して蒼梧で崩じると、二妃がその後を追ってここに至り、竹に涙を注ぐと、竹は斑竹となった。"
 building_type_TK_20_50_TaiHu: "湖沼・水沢"
 building_type_TK_20_50_TaiHu_desc: "大沢は果てしなく広がり、魚や蝦、菱や蓮根は取り尽くせない。水辺の民は漁猟と舟で生計を立てている。"
 TK_20_50_TaiHu: "太湖"
 building_TK_20_50_TaiHu: "$TK_20_50_TaiHu$"
 building_TK_20_50_TaiHu_desc: "太湖は古くは震沢・具区と呼ばれ、呉郡と丹陽の間にまたがり、湖中には島々が星のように散らばる。呉王夫差はかつて湖中の夫椒で越軍を大いに破り、越王勾践が呉を滅ぼした後、范蠡は舟を浮かべて五湖へと去った。"
 building_type_TK_20_50_ChaoHu: "湖沼・水沢"
 building_type_TK_20_50_ChaoHu_desc: "大沢は果てしなく広がり、魚や蝦、菱や蓮根は取り尽くせない。水辺の民は漁猟と舟で生計を立てている。"
 TK_20_50_ChaoHu: "巣湖"
 building_TK_20_50_ChaoHu: "$TK_20_50_ChaoHu$"
 building_TK_20_50_ChaoHu_desc: "巣湖は居巣県の南にあり、湖面は広く、八百里の湖天と称される。古に居巣城が一夜にして大湖に沈んだとき、焦姥が身を捨てて郷民を呼び起こしたと伝わる。郷人はその恩を偲んで焦湖と呼び、湖中の小山を姥山と名づけた。"
 building_type_TK_20_50_PoYangHu: "湖沼・水沢"
 building_type_TK_20_50_PoYangHu_desc: "大沢は果てしなく広がり、魚や蝦、菱や蓮根は取り尽くせない。水辺の民は漁猟と舟で生計を立てている。"
 TK_20_50_PoYangHu: "鄱陽湖"
 building_TK_20_50_PoYangHu: "$TK_20_50_PoYangHu$"
 building_TK_20_50_PoYangHu_desc: "彭蠡沢は豫章郡の北、大江の南にあり、湖面は果てしなく広い。『禹貢』に「彭蠡既に潴す」とあり、大禹の治水の後、多くの川がここに集まった。湖中には鄱陽山が水上に孤立してそびえ、往来する舟人はいつもこの山を目印とする。"
 building_type_TK_20_50_RiYueTan: "湖沼・水沢"
 building_type_TK_20_50_RiYueTan_desc: "大沢は果てしなく広がり、魚や蝦、菱や蓮根は取り尽くせない。水辺の民は漁猟と舟で生計を立てている。"
 TK_20_50_RiYueTan: "日月潭"
 building_TK_20_50_RiYueTan: "$TK_20_50_RiYueTan$"
 building_TK_20_50_RiYueTan_desc: "東海の彼方の夷洲島で、群山に抱かれた深い潭があり、潭中には小島がある。北半分の湖は丸い日のような形、南半分は三日月のような形をしている。島の土人は漁猟で暮らし、丸木舟に乗って水上を行き来する。"
 building_type_TK_20_50_YueYaQuan: "湖沼・水沢"
 building_type_TK_20_50_YueYaQuan_desc: "大沢は果てしなく広がり、魚や蝦、菱や蓮根は取り尽くせない。水辺の民は漁猟と舟で生計を立てている。"
 TK_20_50_YueYaQuan: "月牙泉"
 building_TK_20_50_YueYaQuan: "$TK_20_50_YueYaQuan$"
 building_TK_20_50_YueYaQuan_desc: "敦煌城の南、鳴沙山の麓に一泓の泉があり、新月のような形をしている。四方はすべて流沙だが、泉は決して砂に埋もれず、人々はこれを沙井と呼ぶ。泉のほとりは水草が豊かで、往来する商旅はよくここで馬に水を飲ませる。"
 building_type_TK_20_50_LuGuHu: "湖沼・水沢"
 building_type_TK_20_50_LuGuHu_desc: "大沢は果てしなく広がり、魚や蝦、菱や蓮根は取り尽くせない。水辺の民は漁猟と舟で生計を立てている。"
 TK_20_50_LuGuHu: "濾沽湖"
 building_TK_20_50_LuGuHu: "$TK_20_50_LuGuHu$"
 building_TK_20_50_LuGuHu_desc: "越巂郡西南の深山の中に高山の湖があり、湖水は澄み渡り、四方の青山がその中に映る。湖畔の夷人は舟で行き来し、その婚姻の習俗は中原とまるで異なる。"
 building_type_TK_20_50_SaiLiMuHu: "湖沼・水沢"
 building_type_TK_20_50_SaiLiMuHu_desc: "大沢は果てしなく広がり、魚や蝦、菱や蓮根は取り尽くせない。水辺の民は漁猟と舟で生計を立てている。"
 TK_20_50_SaiLiMuHu: "セリム湖"
 building_TK_20_50_SaiLiMuHu: "$TK_20_50_SaiLiMuHu$"
 building_TK_20_50_SaiLiMuHu_desc: "烏孫国の領内、天山北麓の高みに大きな湖があり、湖水は冷たく澄み切って湖底まで見通せる。水中には魚も蝦も棲まず、烏孫の牧人は湖畔の草原で馬の群れを放牧している。"
 building_type_TK_20_51_HuangGuoShuPuBu: "瀑布・激流"
 building_type_TK_20_51_HuangGuoShuPuBu_desc: "水が高い崖から落ちかかり、その音は雷鳴のようで、水しぶきが立ちこめ、数里の外でもなお聞こえる。"
 TK_20_51_HuangGuoShuPuBu: "黄果樹瀑布"
 building_TK_20_51_HuangGuoShuPuBu: "$TK_20_51_HuangGuoShuPuBu$"
 building_TK_20_51_HuangGuoShuPuBu_desc: "牂柯郡の深山の中で、白水河はここで急に落下し、飛瀑が潭へと注ぎ込む。その音は雷鳴のようで、水しぶきは数里の外にまで立ちこめる。土地の人々は、滝のそばにかつて黄色い実をつける神木があったと言い伝える。"
 building_type_TK_20_51_HuKouPuBu: "瀑布・激流"
 building_type_TK_20_51_HuKouPuBu_desc: "水が高い崖から落ちかかり、その音は雷鳴のようで、水しぶきが立ちこめ、数里の外でもなお聞こえる。"
 TK_20_51_HuKouPuBu: "壺口瀑布"
 building_TK_20_51_HuKouPuBu: "$TK_20_51_HuKouPuBu$"
 building_TK_20_51_HuKouPuBu_desc: "大河はここまで奔流して来ると、両岸の岩壁に挟まれ、河口は壺の口のように狭まる。濁流が高い崖から落ちかかり、その音は数里に響き、水煙が立ちのぼる。『禹貢』に記された壺口とはここのことである。"
 building_type_TK_20_52_QinHuaiHe: "水辺の景観"
 building_type_TK_20_52_QinHuaiHe_desc: "一筋の川の流れ、両岸の人家、舟がその上を行き、風物は絵のようである。"
 TK_20_52_QinHuaiHe: "秦淮河"
 building_TK_20_52_QinHuaiHe: "$TK_20_52_QinHuaiHe$"
 building_TK_20_52_QinHuaiHe_desc: "淮水は東南の群山から流れ来て、秣陵を曲がりくねって貫き、大江に注ぐ。始皇帝が東巡した際、金陵に天子の気があるのを望み見て、方山を穿たせ、淮水を引いて貫流させ、その気を漏らしたと伝わる。"
 building_type_TK_20_52_MiLuoJiang: "水辺の景観"
 building_type_TK_20_52_MiLuoJiang_desc: "一筋の川の流れ、両岸の人家、舟がその上を行き、風物は絵のようである。"
 TK_20_52_MiLuoJiang: "汨羅江"
 building_TK_20_52_MiLuoJiang: "$TK_20_52_MiLuoJiang$"
 building_TK_20_52_MiLuoJiang_desc: "汨水と羅水が長沙郡羅県の境内で合流することから汨羅と名づけられた。楚の三閭大夫屈原は江南に追放され、郢都が秦軍に破られた後、石を抱いてこの江に身を投げた。毎年五月五日に楚の人々が江で競渡するのは、屈原を引き揚げるためだと伝えられる。"
 building_type_TK_20_52_LiJiang: "水辺の景観"
 building_type_TK_20_52_LiJiang_desc: "一筋の川の流れ、両岸の人家、舟がその上を行き、風物は絵のようである。"
 TK_20_52_LiJiang: "漓江"
 building_TK_20_52_LiJiang: "$TK_20_52_LiJiang$"
 building_TK_20_52_LiJiang_desc: "漓水は越城嶠に源を発し、始皇帝が開いた霊渠を経て湘水と通じ、南へ流れて蒼梧に入る。両岸には奇峰が林立し、筍のように簪のようにそびえ、江水は碧く澄み渡る。"
 building_type_TK_20_60_JiuZhaiGou: "総合景勝地"
 building_type_TK_20_60_JiuZhaiGou_desc: "深山の中で、湖や池、林や泉が幾重にも映え合い、景色は奇麗だが、訪れる人はまれである。"
 TK_20_60_JiuZhaiGou: "九寨溝"
 building_TK_20_60_JiuZhaiGou: "$TK_20_60_JiuZhaiGou$"
 building_TK_20_60_JiuZhaiGou_desc: "岷山の北の深山の中、谷あいに湖が幾重にも重なり、水の色は碧藍で色とりどりに輝き、まるで連なる珠のようである。氐羌の諸部族が谷間に散らばって住み、代々農耕と牧畜で暮らしている。"
 building_type_TK_20_60_HuangLongJingQu: "総合景勝地"
 building_type_TK_20_60_HuangLongJingQu_desc: "深山の中で、湖や池、林や泉が幾重にも映え合い、景色は奇麗だが、訪れる人はまれである。"
 TK_20_60_HuangLongJingQu: "黄龍景勝地"
 building_TK_20_60_HuangLongJingQu: "$TK_20_60_HuangLongJingQu$"
 building_TK_20_60_HuangLongJingQu_desc: "岷山の奥深く、一筋の尾根の上に黄金色の石の池が幾重にも敷き詰められ、その間を水が流れる。遠くから望むと、一匹の黄龍が雪山からうねりながら下ってくるかのようである。羌人はこれを神の御業と見なし、時節ごとに祭る。"
 building_type_TK_20_61_CangShanErHai: "山水の風光"
 building_type_TK_20_61_CangShanErHai_desc: "山と水が映え合い、風物は清らかで美しく、文人墨客や往来の旅人はしばしばここで去りがたく留まる。"
 TK_20_61_CangShanErHai: "蒼山洱海"
 building_TK_20_61_CangShanErHai: "$TK_20_61_CangShanErHai$"
 building_TK_20_61_CangShanErHai_desc: "葉楡沢は碧い波が広々と広がり、西岸の点蒼山がその中に映る。山と水が映え合い、風物はこの上なく美しい。沢のほとりの昆明の諸部族は漁猟と耕牧で暮らしている。"
 building_type_TK_20_61_TianYaHaiJiao: "山水の風光"
 building_type_TK_20_61_TianYaHaiJiao_desc: "山と水が映え合い、風物は清らかで美しく、文人墨客や往来の旅人はしばしばここで去りがたく留まる。"
 TK_20_61_TianYaHaiJiao: "天涯海角"
 building_TK_20_61_TianYaHaiJiao: "$TK_20_61_TianYaHaiJiao$"
 building_TK_20_61_TianYaHaiJiao_desc: "南海の中の大島で、孝武皇帝が南越を平定した後、ここに珠崖・儋耳の二郡を置いたが、のちに反乱がたびたび起こったため廃された。島の南端の浜辺には巨岩がごつごつと並び、果てしない大海に面して、あたかも天の果てに至ったかのようである。"
 building_type_TK_20_61_CaiShiJi: "山水の風光"
 building_type_TK_20_61_CaiShiJi_desc: "山と水が映え合い、風物は清らかで美しく、文人墨客や往来の旅人はしばしばここで去りがたく留まる。"
 TK_20_61_CaiShiJi: "采石磯"
 building_TK_20_61_CaiShiJi: "$TK_20_61_CaiShiJi$"
 building_TK_20_61_CaiShiJi_desc: "牛渚山が大江に突き出し、絶壁が水に臨み、江の流れはここで急になる。この地は江東と江北の間の要津であり、兵家が江を渡る際はしばしばここを経る。"
 building_type_TK_20_61_GuLangYu: "山水の風光"
 building_type_TK_20_61_GuLangYu_desc: "山と水が映え合い、風物は清らかで美しく、文人墨客や往来の旅人はしばしばここで去りがたく留まる。"
 TK_20_61_GuLangYu: "鼓浪嶼"
 building_TK_20_61_GuLangYu: "$TK_20_61_GuLangYu$"
 building_TK_20_61_GuLangYu_desc: "閩の地の湾にある小島で、島の西南には岩礁があり、潮が満ちるたびに波が岩礁を打ち、太鼓を打ち鳴らすような音がする。"
 building_type_TK_20_61_KeKeXiLi: "山水の風光"
 building_type_TK_20_61_KeKeXiLi_desc: "山と水が映え合い、風物は清らかで美しく、文人墨客や往来の旅人はしばしばここで去りがたく留まる。"
 TK_20_61_KeKeXiLi: "ココシリ"
 building_TK_20_61_KeKeXiLi: "$TK_20_61_KeKeXiLi$"
 building_TK_20_61_KeKeXiLi_desc: "西羌の地のさらに西は、寒冷で荒涼とした高原で、地勢は高く険しく、人跡まれである。原には野生のヤクやカモシカが群れをなして駆け、時おり猟師が追ってくるが、その多くは寒風を恐れて引き返す。"
 building_type_TK_20_61_LanYanJing: "山水の風光"
 building_type_TK_20_61_LanYanJing_desc: "山と水が映え合い、風物は清らかで美しく、文人墨客や往来の旅人はしばしばここで去りがたく留まる。"
 TK_20_61_LanYanJing: "青い瞳"
 building_TK_20_61_LanYanJing: "$TK_20_61_LanYanJing$"
 building_TK_20_61_LanYanJing_desc: "匈奴北境の北海は、湖水が深く広く、厳冬には鏡のように凍りつく。孝武皇帝の時、蘇武は匈奴に使いして屈せず、北海のほとりに流されて羊を牧し、十九年にわたって節を失わなかった。"
 building_type_TK_20_62_XuanLanJiGuang: "自然景観"
 building_type_TK_20_62_XuanLanJiGuang_desc: "天地造化の奇景で、人の力の及ぶところではなく、見る者はみな驚嘆する。"
 TK_20_62_XuanLanJiGuang: "絢爛たるオーロラ"
 building_TK_20_62_XuanLanJiGuang: "$TK_20_62_XuanLanJiGuang$"
 building_TK_20_62_XuanLanJiGuang_desc: "北方のはるか遠い地では、冬の夜空にしばしば五色の光気が現れ、帳のように幕のように明滅し、旗や幡が翻るように舞う。これこそ『山海経』にいう、燭をくわえて北方の幽冥を照らす燭龍だと言う者もいる。"
 building_type_TK_20_62_ChiLeChuan: "自然景観"
 building_type_TK_20_62_ChiLeChuan_desc: "天地造化の奇景で、人の力の及ぶところではなく、見る者はみな驚嘆する。"
 TK_20_62_ChiLeChuan: "敕勒川"
 building_TK_20_62_ChiLeChuan: "$TK_20_62_ChiLeChuan$"
 building_TK_20_62_ChiLeChuan_desc: "陰山の麓の大平原で、水草が豊かに茂り、見渡す限り果てしない。風が吹けば草が波打ち、牛や羊がその間に見え隠れする。匈奴の冒頓単于はかつて陰山に拠り、ここを苑囿とした。"
 building_type_TK_20_62_DaoChengYaDingJingQu: "自然景観"
 building_type_TK_20_62_DaoChengYaDingJingQu_desc: "天地造化の奇景で、人の力の及ぶところではなく、見る者はみな驚嘆する。"
 TK_20_62_DaoChengYaDingJingQu: "稲城亜丁景勝地"
 building_TK_20_62_DaoChengYaDingJingQu: "$TK_20_62_DaoChengYaDingJingQu$"
 building_TK_20_62_DaoChengYaDingJingQu_desc: "西南の辺境の外、雪域の奥深くに三つの雪山が鼎のように立ち、峰の頂は一年中雪に覆われている。山麓の湖は澄んだ碧色で、芳しい草が敷物のように広がり、土地の人々は三つの山を神霊と見なしている。"
 building_type_TK_20_62_ShuNanZhuHai: "自然景観"
 building_type_TK_20_62_ShuNanZhuHai_desc: "天地造化の奇景で、人の力の及ぶところではなく、見る者はみな驚嘆する。"
 TK_20_62_ShuNanZhuHai: "蜀南竹海"
 building_TK_20_62_ShuNanZhuHai: "$TK_20_62_ShuNanZhuHai$"
 building_TK_20_62_ShuNanZhuHai_desc: "犍為郡僰道県の南の山嶺の間には、竹林が数百里にわたって連なり、風が吹けば竹の葉ずれが海のように響く。僰人は林の中で竹を伐って家を建て、竹を編んで器を作る。"
 building_type_TK_20_62_LinZhiTaoHuaYuan: "自然景観"
 building_type_TK_20_62_LinZhiTaoHuaYuan_desc: "天地造化の奇景で、人の力の及ぶところではなく、見る者はみな驚嘆する。"
 TK_20_62_LinZhiTaoHuaYuan: "林芝桃花源"
 building_TK_20_62_LinZhiTaoHuaYuan: "$TK_20_62_LinZhiTaoHuaYuan$"
 building_TK_20_62_LinZhiTaoHuaYuan_desc: "西南の雪山の奥深くに一つの河谷があり、江水は玉のように碧い。春には桃の花が野に満ち、雪の峰が雲霧の間に見え隠れして、まるで俗世の外のようである。"
 building_type_TK_20_62_LinHaiXueYuan: "自然景観"
 building_type_TK_20_62_LinHaiXueYuan_desc: "天地造化の奇景で、人の力の及ぶところではなく、見る者はみな驚嘆する。"
 TK_20_62_LinHaiXueYuan: "林海雪原"
 building_TK_20_62_LinHaiXueYuan: "$TK_20_62_LinHaiXueYuan$"
 building_TK_20_62_LinHaiXueYuan_desc: "夫余の北、挹婁の住む深山の中は、木々が日を遮り、冬には積雪が膝を没するほど深い。挹婁の人々は山林に穴居し、弓に長け、冬には豚の脂を体に塗って寒さを防ぐ。"
 building_type_TK_20_63_WuXia: "河谷の風光"
 building_type_TK_20_63_WuXia_desc: "大河が山を貫いて流れ、両岸には峰々が迫り、谷の中には水音が終日絶えない。"
 TK_20_63_WuXia: "巫峡"
 building_TK_20_63_WuXia: "$TK_20_63_WuXia$"
 building_TK_20_63_WuXia_desc: "大江は巫山を貫いて流れ、両岸には群峰が連なり、重なる岩と峰が天を隠し日を遮り、猿の声が終日絶えない。巫山の神女は朝には行雲となり、夕べには行雨となると伝わり、楚王はかつて夢の中で彼女と相会したという。"
 building_type_TK_20_63_YiLiHeGu: "河谷の風光"
 building_type_TK_20_63_YiLiHeGu_desc: "大河が山を貫いて流れ、両岸には峰々が迫り、谷の中には水音が終日絶えない。"
 TK_20_63_YiLiHeGu: "イリ河谷"
 building_TK_20_63_YiLiHeGu: "$TK_20_63_YiLiHeGu$"
 building_TK_20_63_YiLiHeGu_desc: "烏孫国の住む河谷で、三方を山に囲まれ、川は西へ流れ、牧草地は肥えて馬が多く育つ。孝武皇帝の時、細君公主と解憂公主が相次いで烏孫に嫁ぎ、漢と烏孫はこれにより婚姻の国となった。"
 building_type_TK_20_63_YaLuCangBuDaXiaGu: "河谷の風光"
 building_type_TK_20_63_YaLuCangBuDaXiaGu_desc: "大河が山を貫いて流れ、両岸には峰々が迫り、谷の中には水音が終日絶えない。"
 TK_20_63_YaLuCangBuDaXiaGu: "ヤルンツァンポ大峡谷"
 building_TK_20_63_YaLuCangBuDaXiaGu: "$TK_20_63_YaLuCangBuDaXiaGu$"
 building_TK_20_63_YaLuCangBuDaXiaGu_desc: "西南の雪域の中で、一筋の大江が群山の間に深い峡谷を切り開き、両岸の絶壁は万仞に及び、堅い氷が垂れ下がり、江水は奔騰して咆哮する。峡谷の中は木々が日を遮り、猛獣が出没し、人跡まれである。"
