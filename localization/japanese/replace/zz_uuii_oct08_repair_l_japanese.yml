 WJ_dd_ui_dispatch_own:0 "指名して派遣"
 WJ_independent_county_title:0 "県"
 WJ_independent_commandery_title:0 "郡"
 WJ_independent_province_title:0 "州"
 duke_celestial_male_chinese:0 "[Character.Custom('WJ_NativeCommanderyRank')]"
 count_celestial_male_chinese:0 "[Character.Custom('WJ_NativeCountyRank')]"
 count_celestial_female_chinese:0 "[Character.Custom('WJ_NativeConsortRank')]"
 WJ_mt_already_picked_tt:0 "この人物はすでにこちら側に選ばれている。選び直すには別の人物を選ぶか、もう一方の側に回すこと。"
 WJ_mt_different_pair_tt:0 "引き渡す側と受け取る側を同一人物にはできない。"
 WJ_miaoshi_text_prompt:0 "定める称号を入力してください"
 WJ_miaoshi_text_required_tt:0 "まず定める号を書き入れなければ勅定できない。自ら定める気がなければ、戻って別のものを選ぶこと。"
 WJ_miaoshi_back:0 "一つ上の階層に戻る"
 WJ_peer_choose_ting_tt:0 "一つの亭を封号に選び、その租税を食邑とする。"
 WJ_peer_choose_hou_tt:0 "一つの県を封号に選び、その租税を食邑とする。"
 WJ_peer_choose_county_princess_tt:0 "一つの県を公主の封号に選び、その租税を食む。その地を領せず、その政にも関与しない。"
 WJ_peer_choose_duchy_princess_tt:0 "一つの郡を公主の封号に選び、その郡治の置かれた県の租税を食む。その地を領せず、その政にも関与しない。"
 WJ_peer_back_tt:0 "前の段階に戻る。この時点ではまだ授爵しておらず、費用もかからない。"
 WJ_peer_rank_desc:0 "あなたは[ROOT.Char.MakeScope.Var('wj_peer_target').Char.GetFirstNameNoTooltip]のために爵号を議定しようとしている。功臣は勲業によって爵を受け、宗室の娘は親族の誼によって公主に封じられる。爵にはその号があり、食にはその邑があるが、封を受けた者がその地を治めるわけではなく、元の官職もこれによって変わることはない。"
 WJ_peer_choose_rank_tt:0 "爵等を議定し、それから封号と食邑を選ぶ。"
 WJ_peer_choose_place_tt:0 "州郡であればその中に入って細かく選ぶ。封じうる地であれば、ここで詔を下して冊封する。"
 WJ_peer_pick_desc:0 "有司が輿図と簿籍を広げ、まだ分封できる州・郡・県・邑を一つ一つ挙げていく。封号と食邑が選ばれれば、冊封の詔書を下すことができる。"
 WJ_peer_navigation_tt:0 "輿籍を調べ、別の地を選ぶ。"
 WJ_peer_cancel_tt:0 "こたびの冊封はひとまず取りやめ、何も授けず、何も費やさない。"
 game_concept_governor:0 "官員"
 game_concept_governor_possessive:0 "官員"
 game_concept_governors:0 "官員"
 game_concept_governors_possessive:0 "官員"
 game_concept_governorship:0 "官職"
 game_concept_governorships:0 "官職"
 game_concept_governor_desc:0 "[government_bureaucratic_gov|E]の官員は命を受けて[realm|E]内の土地を治め、[governor_efficiency|E]によって賦税・民生・兵務を処理する。\n\n官員が掌る[title|E]とその配下の[counties|E]を合わせて[province|E]と呼ぶ。管区に[governance_issues|E]が生じた際は、官員がこれに対処しなければならない。\n\n官員は[influence|E]を蓄え、他の官職の任命や[succession|E]に関与できる。"
 game_concept_province:0 "郡県"
 game_concept_provinces:0 "郡県"
 game_concept_provincial:0 "郡県"
 game_concept_province_desc:0 "[province|E]は[government_bureaucratic_type|E]において[governor|E]が治める管区であり、その[title|E]と所属する県邑からなる。\n\n管区の[province_administration|E]が統治の重点を定め、税収や兵務などの効果に影響する。"
 game_concept_province_administration:0 "管区行政"
 game_concept_province_administrations:0 "管区行政"
 game_concept_province_administration_desc:0 "[government_bureaucratic_type|E]の[realm|E]の[province|E]は、職責に応じて行政類型を定め、[liege|E]と[governor|E]が協議して決める。\n\n各管区は同時に一つの行政類型しか採用できない。"
 game_concept_wj_xianwang_level_xian_desc:0 "才と行いが初めて現れ、郷里に称えられる。士人はすでに一地方の信頼を得て、県務の選たりうる。任を受けられるかどうかは、なお朝廷の命を待たねばならない。"
 game_concept_wj_xianwang_level_jun_desc:0 "声は郡中に聞こえ、治事に評判がある。郡中の賢士や官員がしだいにその才を知り、一郡の任に推薦されうる。"
 game_concept_wj_xianwang_level_zhou_desc:0 "士林に推重され、誉れは州境に満ちる。才学と功業はすでに一州に知られ、地方の重任の選に列するに足る。"
 game_concept_wj_xianwang_level_chao_desc:0 "名は海内に著れ、朝野に重んじられる。その徳望と治績にはいずれも裏付けがあり、公卿の選に列して朝廷の重務を担うことができる。"
 game_concept_wj_xianwang_level_gong_desc:0 "天下の宗とするところとなり、士林に望み重し。徳行・功業・声誉いずれも卓越し、公輔の選たるに足る。任を受けてはじめて、相応の職務を掌ることができる。"
