 game_concept_obedience_threshold_desc: "$game_concept_obedience_threshold$は、[characters|E]が[obedient|E]とみなされるために必要なスコアである。\n\nこの閾値は一連の要因に影響される：[overlord|E]の[close_family|E]であるか、[primary_heir|E]であるか、[friendship|E]または[rivalry|E]の関係にあるか、[traits|E]、そしてあなたの[kurultai|E]または[court|E]にいるかどうか。成人に比べ、[children|E]はより忠順になりやすい。\n\n[GetGovernment( 'nomad_government' ).GetName]の[rulers|E]は、#EMP $mpo_desperate_stance_decision$#!の[decision|E]によって全員を忠順にさせることや、[GetActivityType( 'activity_hunt').GetName]で1人のキャラクターに#EMP $impose_obedience_intent$#!の[intent|E]を用いることも引き続き可能である。忠順の仕組みが有効なすべての主君は、#EMP $mpo_demand_obedience_interaction$#!または#EMP $mpo_negotiate_obedience_interaction$#!の[character_interaction|E]を使用できる。"
