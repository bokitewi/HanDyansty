 building_type_hospices_01: "養疾院"
 building_type_hospices_01_desc: "養疾院は病弱で困窮した人々を受け入れ、医方に通じ身を清く保つ者たちが、その薬湯と起居の世話をする。"
 building_hospices_08_desc: "大医院は老いて体の弱った者に衣食と薬湯を施し、病に倒れた旅人をも治療する。病人はここで外の者から隔てられ、医方に通じ身を清く保つ者たちに手厚く看護される。"
 building_london_bridge_01: "ロンドン橋"
 building_type_holy_site_cathedral_01: "大聖堂"
 building_type_holy_site_cathedral_01_desc: "この[holy_site|E]は、既知の世界の各地からキリスト教の巡礼者を引き寄せている。大聖堂は工学と美の驚異であるのみならず、旅人の安らかな避難所であり、その後援者を称える名高い記念碑でもある。"
