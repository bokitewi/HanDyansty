l_japanese:
 # 旧 kuzhu_admin_recruit_* 系列は2026-10-31に原版の軍隊指揮体系へ統合：名称と説明のみ引き継ぐ
 celestial_army_liege_law_0: "軍府募兵制"
 celestial_army_liege_law_0_subname: "各地の軍政長官が自ら軍を募り養い、中枢は名目上の統轄権のみを保持する。"
 celestial_army_liege_law_1: "中外分掌制"
 celestial_army_liege_law_1_subname: "中枢と地方が共同で兵員、軍費、運用の責任を負う。"
 celestial_army_liege_law_2: "府兵制"
 celestial_army_liege_law_2_subname: "田土によって編戸の軍士を養い、平時は農耕と訓練に従事させ、戦時には詔を奉じて出征させる。"
 celestial_army_liege_law_3: "禁軍制"
 celestial_army_liege_law_3_subname: "精鋭の常備軍は中枢が直接養い、将を選び、派遣する。地方が手を出すことは難しい。"
 celestial_army_vassal_law_0_subname: "君主は軍を募り養う権限を地方長官に委ねている。"
 celestial_army_vassal_law_1_subname: "君主と地方が共同で兵員、軍費、運用の責任を負う。"
 celestial_army_vassal_law_2_subname: "田土によって編戸の軍士を養い、君主の詔令に従って出征させる。"
 celestial_army_vassal_law_3_subname: "兵権、軍費、将の選任権はすべて中枢に帰し、地方長官は勝手に干渉できない。"
