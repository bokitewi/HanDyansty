 game_concept_celestial_government_desc:0 "$game_concept_wj_junguozhi_desc$"
 game_concept_wj_junguozhi_desc:0 "[GetGovernment('celestial_government').GetRuleInfo][GetGovernment('celestial_government').GetFlagInfo]\n[wj_junguozhi|E]は漢・晋の[government_bureaucratic_type|E][government_form|E]である。天子が朝廷を統べ、[liege|E]が[wj_guanyuan|E]を任命して地方を治めさせ、授けた契約に応じて州郡・軍戍・司隷に分かれる。\n\nキャラクターは[influence|E]、[noble_families|E]、[family_estates|E]、[treasury|E]を用いる。独立した[rulers|E]は[legitimacy|E]を持ち、臣下は[merit|E]によって仕途を進む。\n\n士人の仕官は辟召・孝廉・茂才・清談・考課の諸途によるもので、科挙は設けない。地方の[title_men_at_arms|E]は爵級に応じて授けられ、県級の称号は称号兵を持たない。\n\n#F 郡国並び行われ、権は天子に帰す。中央の公卿は政を輔け、地方の州郡は詔を奉じて民を治む。#!"
 game_concept_merit:0 "賢望"
 game_concept_meritorious:0 "賢望卓著"
 game_concept_merit_desc:0 "$game_concept_wj_mingwang_desc$"
 game_concept_wj_mingwang_desc:0 "賢望は士人の徳行・声誉・功業に由来する。清談は才学を人に知らしめ、推挙は名声を朝野に伝え、任職と考課は治事の能力を検証する。\n\n[merit|E]が高いほど朝廷や士林に重んじられやすく、担える官職も重くなる。ただし声誉がいかに盛んでも、正式な任命を経てはじめて職を掌ることができる。"
 game_concept_merit_level:0 "賢望レベル"
 game_concept_merit_levels:0 "賢望レベル"
 game_concept_merit_level_desc:0 "[merit_level|E]はキャラクターの声誉と任官の上限を測るものであり、現在の実職ではない。表示は県・郡・州・卿・公の五等に分かれる：\n\n$EFFECT_LIST_BULLET$[wj_xianwang_level_xian|E]――県等\n$EFFECT_LIST_BULLET$[wj_xianwang_level_jun|E]――郡等\n$EFFECT_LIST_BULLET$[wj_xianwang_level_zhou|E]――州等\n$EFFECT_LIST_BULLET$[wj_xianwang_level_chao|E]――卿等\n$EFFECT_LIST_BULLET$[wj_xianwang_level_gong|E]――公等\n\n賢望が定めるのは任官の上限のみである。仕官の資格と官職は、別途得なければならない。"
 game_concept_merit_level_impact:0 "賢望レベルの影響"
 game_concept_merit_level_impact_desc:0 "賢望レベルの影響は、現在の[merit_level|E]が与える[modifiers|E]を増減させる。"
 MERIT_COST_LONG:0 "賢望：[merit_i]$VALUE|0$"
 MERIT_COST_LONG_MAINTENANCE:0 "賢望：[merit_i]$VALUE|2$"
