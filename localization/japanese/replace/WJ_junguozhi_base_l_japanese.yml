 ra_merit_candidacy_merit_desc:0 "[merit|E]は朝廷が任官候補者を量る重要な基準である。郷里で称えられる者は県の務めを治めることができ、名声が郡や州に聞こえる者は地方の重任を担うことができ、名が海内に著しい者こそ公卿の選に入る。\n\n任官されるか否かは、なお資格・功業および朝廷の任命と合わせて決まる。"
