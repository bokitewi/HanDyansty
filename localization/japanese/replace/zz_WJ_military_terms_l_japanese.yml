l_japanese:
 # 仅覆盖个人军职模块的可见用词；ID、授予池及机制不变。
 WJ_mr.110.t:0 "その他の軍職"
 WJ_mr.167.t:0 "四方の軍職"
 WJ_mr.184.t:0 "四方の軍職"
 WJ_mr.189.t:0 "その他の軍職"
 WJ_mr.199.t:0 "四方の軍職"
 WJ_mr.208.t:0 "その他の軍職"
 WJ_failure_26:0 "現在の軍職はすでにその官職に相応している"
 WJ_failure_30:0 "立案された軍職がなお資格に合致し、他者に占められていないこと"
 WJ_mr_propose:0 "授与する軍職を立案する"
 WJ_mr_propose_desc:0 "この武官のために軍職を立案する。天子、都督中外、王国の重将は直接授与できる。大将軍が立案したものは、上表して裁可を仰がねばならない。以前に提出していない草案も、引き続き立案できる。"
 WJ_mr_request:0 "軍職を奏請する"
 WJ_mr_request_desc:0 "望む軍職を選び、上表して上官の裁定を請う。以前に提出していない草案も、引き続き立案できる。"
 WJ_mr_submit:0 "軍職の奏請を提出する"
 trait_WJ_mr_jiangjun_anbei_desc:0 "安北の号は、北辺の安定を名とする。朝廷がこの人物にこの号を授けたのは、塞を守り胡を慰撫し、辺境の民を安らかに眠らせることを望んでのことである。"
 trait_WJ_mr_jiangjun_andong_desc:0 "安東の号は、東土を安んじ和らげることを名とする。朝廷がこの人物にこの号を授けたのは、青州・徐州を慰撫し、流散した民を田里に帰らせることを望んでのことである。"
 trait_WJ_mr_jiangjun_annan_desc:0 "安南の号は、南土の平定を名とする。朝廷がこの人物にこの号を授けたのは、江南の山越を鎮撫し、恩と威を併せ用いることを望んでのことである。"
 trait_WJ_mr_jiangjun_anxi_desc:0 "安西の号は、西陲の安定を名とする。朝廷がこの人物にこの号を授けたのは、隴右に屯戍し、羌・氐を次第に王化に服させることを望んでのことである。"
 trait_WJ_mr_jiangjun_caiguan_desc:0 "材官とは本来、強弩を引ける力士を指し、材官将軍はその者たちを統べることから名づけられた。この人物はこの号をもって兵を率い、多く歩兵の力に頼る。"
 trait_WJ_mr_jiangjun_dangkou_desc:0 "蕩寇の号は、寇賊を掃蕩する意を取る。この人物はこの号をもって討伐・捕縛を専任し、四方の賊徒はその名を聞いて逃げ去るであろう。"
 trait_WJ_mr_jiangjun_dingbei_desc:0 "定北と号するのは、朔方を平定する意を取る。この人物はこの号を受けた以上、塞上で弓を引き、北の夷を遠く退けねばならない。"
 trait_WJ_mr_jiangjun_dingdong_desc:0 "定東と号するのは、東土を平定する意を取る。この人物はこの号を受けた以上、淮海に威を及ぼし、一方の豪強に手を引かせねばならない。"
 trait_WJ_mr_jiangjun_dingnan_desc:0 "定南と号するのは、南疆を平定する意を取る。この人物はこの号を受けた以上、瘴癘の地に深く入り、兵威をもって諸蛮を服させねばならない。"
 trait_WJ_mr_jiangjun_dingnan_variant_2_desc:0 "定難の号は、禍難を平定する意を取る。この人物は多く乱局の中で命を受け、一旅の兵で残局を収拾せねばならない。"
 trait_WJ_mr_jiangjun_dingxi_desc:0 "定西と号するのは、西陲を平定する意を取る。この人物はこの号を受けた以上、河隴を駆け巡り、号令の及ぶところ羌胡が従わぬことのないようにせねばならない。"
 trait_WJ_mr_jiangjun_duliao_desc:0 "度遼の号は、初めは遼水を渡って塞外に出征するために設けられ、のちに辺郡に駐屯して諸胡を監護するものとなった。この号を持つ人物は、辺境の事に通じ、胡の実情を深く知っているはずである。"
 trait_WJ_mr_jiangjun_fenwei_desc:0 "奮威の号は、威武を奮い揚げる意を取る。この人物は鋭気盛んで、戦うたびに奮い立って先を争うであろう。"
 trait_WJ_mr_jiangjun_fenwu_desc:0 "奮武の号は、武勇を奮い起こす意を取る。乱世にあってこの号は多く新たに興った豪傑に授けられ、この人物もまた功を立てることを期している。"
 trait_WJ_mr_jiangjun_fubei_desc:0 "撫北の号は、北辺の懐柔を重んじる。この号を持つ人物は、互市を通じ、胡の首長と結び、信義をもって塞外を安定させるのがよい。"
 trait_WJ_mr_jiangjun_fubo_desc:0 "伏波の号は、波濤を降し伏せる意を取る。かつて馬援はこの号をもって南方の交趾を征し、威名を遠くまで轟かせた。この号を得た人物は、水戦に習熟し、江海を渡ること平地を行くがごとくであるべきだ。"
 trait_WJ_mr_jiangjun_fudong_desc:0 "撫東の号は、東方の懐柔を重んじる。この号を持つ人物は、寛厳を併せ用い、徳をもって海辺の民心を収めるのがよい。"
 trait_WJ_mr_jiangjun_fuguo_desc:0 "輔国の号は、社稷を匡し輔ける意を取る。この人物は国の干城たらんと自ら期し、その名望は並の諸将を上回る。"
 trait_WJ_mr_jiangjun_fujun_desc:0 "輔軍の号は、大軍を輔け翼する意を取る。この人物は常に主帥を補佐して指揮し、進退に規律がある。"
 trait_WJ_mr_jiangjun_funan_desc:0 "撫南の号は、南土の懐柔を重んじる。この号を持つ人物は、夷越を厚く遇し、恩と信によって遠方の人々の心を結ぶのがよい。"
 trait_WJ_mr_jiangjun_fuxi_desc:0 "撫西の号は、西陲の懐柔を重んじる。この号を持つ人物は、羌・氐を羈縻し、和をもって戦に代えられるのを上策とする。"
 trait_WJ_mr_jiangjun_fuyuan_desc:0 "撫遠の号は、遠方を安撫する意を取る。この人物は多く辺境に戍り、恩と信によって遠方の人々を招き寄せるのがよい。"
 trait_WJ_mr_jiangjun_guanjun_desc:0 "冠軍の号は、勇が三軍に冠たる意を取る。この人物は勇力を自負し、常に独りで一方を担うことを思っている。"
 trait_WJ_mr_jiangjun_hengye_desc:0 "横野の号は、原野を縦横に行く意を取る。この人物は軽兵を率いて広野を駆け抜けるのに長け、その去来は風のごとし。"
 trait_WJ_mr_jiangjun_hou_desc:0 "前・後・左・右の四将軍の一つ。後将軍は重きを保って殿を務め、大軍の進退はその根本の堅固さに頼る。この人物は沈着剛毅をもって自らを律すべきである。"
 trait_WJ_mr_jiangjun_hujun_desc:0 "護軍の職は、諸将を監護し武官を選考することを司る。この重号にある人物は、諸将の間を周旋し、軍中の人事の多くはその手を経ねばならない。"
 trait_WJ_mr_jiangjun_huwei_desc:0 "虎威の号は、猛虎の威を取る。この人物の統兵は虎が山林に踞るがごとく、兵士に仰ぎ見て畏れさせるべきである。"
 trait_WJ_mr_jiangjun_jianwei_desc:0 "建威の号は、威名を打ち立てる意を取る。この人物は功を立てて名を揚げることに急で、行軍に際して険阻を避けない。"
 trait_WJ_mr_jiangjun_jianwu_desc:0 "建武の号は、武功を打ち立てる意を取る。この人物は戦功によって身を起こし、戎馬に明け暮れて少しも休むことがない。"
 trait_WJ_mr_jiangjun_jianzhong_desc:0 "建忠の号は、忠節を打ち立てる意を取る。この人物は忠義をもって自ら任じ、身を国に捧げることを誓っている。"
 trait_WJ_mr_jiangjun_jingbei_desc:0 "靖北を号とし、北辺の粛清を期待される。この人物は関塞を厳しく守り、胡騎に辺境を叩かせぬようにすべきである。"
 trait_WJ_mr_jiangjun_jingbian_desc:0 "靖辺の号は、辺陲を安んじ鎮める意を取る。この人物は長く辺地にあり、烽燧や斥候の事に通じている。"
 trait_WJ_mr_jiangjun_jingdong_desc:0 "靖東を号とし、東方の粛清を期待される。この人物は軍を治めるに厳整を第一とし、海辺の盗賊をその名を聞いて散らせるべきである。"
 trait_WJ_mr_jiangjun_jinglue_desc:0 "経略の号は、経営し方策を巡らす意を取る。この人物は謀略に長け、攻守進退のすべてに筋道がある。"
 trait_WJ_mr_jiangjun_jingnan_desc:0 "靖南を号とし、南土の粛清を期待される。この人物は討伐と招撫を併せ行い、江湖の間に再び群れ集う徒が出ぬようにすべきである。"
 trait_WJ_mr_jiangjun_jingnan_zhong_desc:0 "靖難の号は、禍乱を平定する意を取る。この人物は危難の際に命を受け、身を挺して傾いたものを支えるべきである。"
 trait_WJ_mr_jiangjun_jingxi_desc:0 "靖西を号とし、西陲の粛清を期待される。この人物は辺境を巡って寇を駆逐し、隴の道を再び商旅が通れるようにすべきである。"
 trait_WJ_mr_jiangjun_jinu_desc:0 "積弩の号は、強弩の士を統べることを名とする。この人物は弩陣を布くのに長け、その矢の雨の下では敵騎も近づきがたい。"
 trait_WJ_mr_jiangjun_lingjun_desc:0 "宣威の号は、国威を宣揚する意を取る。この人物は使者として辺境に赴くにせよ、兵を率いて出征するにせよ、兵威をもって朝廷の声勢を示すべきである。"
 trait_WJ_mr_jiangjun_longxiang_desc:0 "龍驤とは、龍が首を高く掲げて躍り上がるさまである。この重号を得た人物は、気宇軒昂として、風雲を呑吐する志を抱くべきである。"
 trait_WJ_mr_jiangjun_louchuan_desc:0 "楼船の号は、舟師と戦艦を統べることを名とする。この人物は水戦に熟達し、しばしば楼船を率いて江を下る。"
 trait_WJ_mr_jiangjun_piaoyao_desc:0 "嫖姚とは、強く速いさまである。かつて霍去病が嫖姚校尉として軽騎で遠く襲撃し、この号はそれによって名高くなった。この重号を得た人物は、迅速な奔襲を得手とすべきである。"
 trait_WJ_mr_jiangjun_pingbei_desc:0 "平北の号は、北疆を掃平することを意図する。この人物はこの号をもって兵を率い、塞外に出て逃げる敵を追い、胡の塵を再び南へ舞い上がらせぬようにすべきである。"
 trait_WJ_mr_jiangjun_pingdong_desc:0 "平東の号は、東方を掃平することを意図する。この人物はこの号をもって兵を率い、海岱の残寇を洗い流し、東土に再び清らかな安寧を取り戻すべきである。"
 trait_WJ_mr_jiangjun_pingnan_desc:0 "平南の号は、南方を掃平することを意図する。この人物はこの号をもって兵を率い、南のかた江漢を渡り、服さぬ者を討ち反乱を平らげるべきである。"
 trait_WJ_mr_jiangjun_pingxi_desc:0 "平西の号は、西陲を掃平することを意図する。この人物はこの号をもって兵を率い、関隴を転戦して羌の乱を平らげるべきである。"
 trait_WJ_mr_jiangjun_qian_desc:0 "前・後・左・右の四将軍は、いずれも重号である。前将軍は陣に臨んで全軍の先駆けとなり、この人物は突撃して敵陣を陥れ、身をもって兵士に先んじるべきである。"
 trait_WJ_mr_jiangjun_qingche_desc:0 "軽車の号は、戦車と軽兵を統べることを名とする。この人物は駆け抜けることに長け、行軍は迅速である。"
 trait_WJ_mr_jiangjun_saoni_desc:0 "掃逆の号は、逆乱を掃除する意を取る。この人物は叛逆者の討伐を専任とし、臣従せぬ輩はこれを聞いて戦々恐々とする。"
 trait_WJ_mr_jiangjun_tunqi_desc:0 "屯騎の号は、屯駐する騎士を統べる意を取る。この人物はこの号をもって一軍の騎士を独りで率い、外地を駆け巡る。"
 trait_WJ_mr_jiangjun_weibei_desc:0 "威北の号は、兵威をもって北辺を震え上がらせることを旨とする。この人物の大旗の向かうところ、塞外の諸部は砂塵を望んで拝伏するであろう。"
 trait_WJ_mr_jiangjun_weidong_desc:0 "威東の号は、兵威をもって東方を震え上がらせることを旨とする。この人物がこの赫々たる名号を戴く以上、東土の諸雄も幾度となく思案を重ね、軽々しく動くことはできまい。"
 trait_WJ_mr_jiangjun_weinan_desc:0 "威南の号は、兵威をもって南土を震え上がらせることを旨とする。この人物がこの号を持って江に臨めば、諸夷の豪帥も皆その兵鋒を推し量らねばならない。"
 trait_WJ_mr_jiangjun_weishuo_desc:0 "衛朔の号は、朔方を護衛する意を取る。この重号を受けた人物は、長く北辺に戍り、風霜に顔を刻まれようとも志節を変えぬであろう。"
 trait_WJ_mr_jiangjun_weixi_desc:0 "威西の号は、兵威をもって西陲を震え上がらせることを旨とする。この人物の名号が出れば、隴坂の外の羌胡も朝廷に人ありと知る。"
 trait_WJ_mr_jiangjun_wuwei_desc:0 "武衛の号は、禁中に宿衛する親兵を司る。この人物は親軍を率い、昼夜君側を護衛する。腹心でなければこの地位には就けない。"
 trait_WJ_mr_jiangjun_wuyi_desc:0 "武毅の号は、剛毅果敢の意を取る。この人物はこの号をもって自らを励まし、陣に臨んでは剛直果断にして恐れを知らぬであろう。"
 trait_WJ_mr_jiangjun_xiaoqi_desc:0 "驍騎の号は、騎兵の驍勇の意を取る。この人物は馬に跨り戈を振るい、敵陣に突入すること無人の境を行くがごとしである。"
 trait_WJ_mr_jiangjun_xuanfeng_desc:0 "宣風の号は、風化を宣揚する意を取る。この人物は文武を兼ね備え、兵威と教化を並び行うべきである。"
 trait_WJ_mr_jiangjun_xuanrui_desc:0 "宣鋭の号は、鋭気を宣揚する意を取る。この人物は兵士を鼓舞するのに長け、陣に臨んで鬨の声を上げれば、三軍はそのために奮い立つ。"
 trait_WJ_mr_jiangjun_yangwu_desc:0 "揚武の号は、武威を発揚する意を取る。この人物は意気盛んで、常に敵を破って名を揚げることを念頭に置いている。"
 trait_WJ_mr_jiangjun_yaowu_desc:0 "耀武の号は、武威を誇示する意を取る。この人物は兵を並べ陣を布くことを好み、盛大な軍容によって敵を威服させる。"
 trait_WJ_mr_jiangjun_yijun_desc:0 "翊軍の号は、大軍を翼け護る意を取る。この人物は常に主帥の左右を護衛し、忠実勤勉で託すに足る。"
 trait_WJ_mr_jiangjun_yingyang_desc:0 "鷹揚の号は、鷹や隼が舞い上がる勢いを取る。この人物は眼光鋭く、出撃すれば鷹隼が兎を打つがごとくである。"
 trait_WJ_mr_jiangjun_you_desc:0 "前・後・左・右の四将軍の一つ。右将軍は中軍の右を翼として護り、この人物は左翼と掎角の勢いをなして、共に中軍を守るべきである。"
 trait_WJ_mr_jiangjun_youji_desc:0 "遊撃の号は、遊兵を率いて往来し呼応することを名とする。この人物は一か所にとどまらず、もっぱら敵の隙をうかがって奇兵を繰り出す。"
 trait_WJ_mr_jiangjun_yulin_desc:0 "羽林の名は、国の羽翼となり、林のごとく盛んであることを取る。この人物はこの号をもって兵を率い、その軍容の盛んなること禁軍にも比肩しうる。"
 trait_WJ_mr_jiangjun_zhechong_desc:0 "折衝の号は、敵の突撃を挫く意を取る。この人物は堅陣を砕き精鋭を破るのに長け、敵軍の鋒先を一挙に鈍らせる。"
 trait_WJ_mr_jiangjun_zhenbei_desc:0 "鎮北は四鎮の一つで、一方に鎮座することを任とする。この号を負う人物は、幽州・并州の辺塞を守り、烽燧を騒がせぬようにせねばならない。"
 trait_WJ_mr_jiangjun_zhendong_desc:0 "鎮東は四鎮の一つで、一方に鎮座することを任とする。この号を負う人物は、淮泗に兵を屯し海岱を扼守して、東土をこれまでどおり安堵させねばならない。"
 trait_WJ_mr_jiangjun_zhengbei_desc:0 "征北は四征に列し、北疆の征伐をもっぱら司る方面の重任である。この重号を担う人物は、幽州・并州を押さえ、胡騎に南下して馬を放牧させぬようにすべきである。"
 trait_WJ_mr_jiangjun_zhengdong_desc:0 "征東は四征に列し、東方の征伐をもっぱら司る方面の重任である。この重号を担う人物は、兵を率いて東へ向かい、青徐・海岱をことごとく号令の下に帰させるべきである。"
 trait_WJ_mr_jiangjun_zhengnan_desc:0 "征南は四征に列し、南方の征伐をもっぱら司る方面の重任である。この重号を担う人物は、江漢に舟を浮かべ、荊揚・百越に命に背かせぬようにすべきである。"
 trait_WJ_mr_jiangjun_zhenguo_desc:0 "鎮国の号は、国家を鎮め護る意を取る。この号を負う人物は、社稷の安危を一身に担い、その威望は一方を鎮め服させるに足る。"
 trait_WJ_mr_jiangjun_zhengxi_desc:0 "征西は四征に列し、西陲の征伐をもっぱら司る方面の重任である。この重号を担う人物は、西のかた関隴に出て、羌・氐にその名を聞いて畏れさせるべきである。"
 trait_WJ_mr_jiangjun_zhenjun_desc:0 "鎮軍の号は、六軍を鎮撫する意を取る。この重号にある人物は、重きを保って沈着であり、諸軍の頼みとなるべきである。"
 trait_WJ_mr_jiangjun_zhennan_desc:0 "鎮南は四鎮の一つで、一方に鎮座することを任とする。この号を負う人物は、江漢の険に拠り、朝廷のために荊揚を守る屏となるべきである。"
 trait_WJ_mr_jiangjun_zhenwei_desc:0 "振威の号は、軍威を奮い立たせる意を取る。この人物が軍中に至るたび、士気は一新されるであろう。"
 trait_WJ_mr_jiangjun_zhenwu_desc:0 "振武の号は、武事を振興する意を取る。この人物は軍を整え武を修めることを己の任とし、配下の号令は厳正である。"
 trait_WJ_mr_jiangjun_zhenxi_desc:0 "鎮西は四鎮の一つで、一方に鎮座することを任とする。この号を負う人物は、関隴の要衝を扼し、河西の諸羌に隙をうかがわせぬようにせねばならない。"
 trait_WJ_mr_jiangjun_zuo_desc:0 "前・後・左・右の四将軍の一つ。左将軍は中軍の左を翼として護り、この人物は主帥の股肱となって、進退を互いに助け合うべきである。"
 trait_WJ_mr_xiaowei_anbei_desc:0 "安北を号とする校尉。この人物は一営の兵を率いて北塞を守り、昼夜烽燧を見張っている。"
 trait_WJ_mr_xiaowei_anding_desc:0 "安東を号とする校尉。この人物は一営を率いて東土の郷里を守り、盗賊に備える。"
 trait_WJ_mr_xiaowei_andingyi_desc:0 "定夷校尉は、夷の乱を平定する意を取る。この人物は一営を率いて辺境に駐屯し、諸夷を鎮撫する。"
 trait_WJ_mr_xiaowei_annan_desc:0 "安南を号とする校尉。この人物は一営の兵を率いて南方に駐屯し、山越の出没に備える。"
 trait_WJ_mr_xiaowei_anxi_desc:0 "安西を号とする校尉。この人物は一営の兵を率いて西陲を守り、往来する商旅を護衛する。"
 trait_WJ_mr_xiaowei_bingbu_desc:0 "歩兵校尉は北軍五校の一つで、上林苑の門の屯兵を司る。この人物は歩兵の統率に長け、陣列は整然としている。"
 trait_WJ_mr_xiaowei_bingwei_desc:0 "兵衛校尉は衛兵の統率を司る。この人物は一営の衛士を率い、官署の門を守っている。"
 trait_WJ_mr_xiaowei_canjun_desc:0 "参軍校尉は軍事に参謀する。この人物は常に主将の帳中にあって策を巡らせている。"
 trait_WJ_mr_xiaowei_ceying_desc:0 "策応校尉は諸軍の接応を司る。この人物はあちこちへ救援に赴き、陣中の欠けた所を補う。"
 trait_WJ_mr_xiaowei_chengmen_desc:0 "城門校尉は京城の諸門の屯兵を司り、その地位と声望はかなり重い。この人物は城門の開閉を掌り、京師の安危をその一身に担う。"
 trait_WJ_mr_xiaowei_chengwei_desc:0 "城衛校尉は城池の守護を司る。この人物は一営を率いて城壁に登って当直し、夜ごとに拍子木を打つ。"
 trait_WJ_mr_xiaowei_chijie_desc:0 "持節校尉は節を奉じて使いに出る。この人物は符節を手に四方を奔走し、朝命を伝える。"
 trait_WJ_mr_xiaowei_dangkou_desc:0 "蕩寇を号とする校尉。この人物は郷野を駆け回り、盗賊を討ち捕らえる。"
 trait_WJ_mr_xiaowei_dianhou_desc:0 "殿後校尉は大軍の殿を司る。この人物は沈着で忍耐強く、退却の際には独りで追撃を食い止める。"
 trait_WJ_mr_xiaowei_dianjun_desc:0 "典軍校尉は西園八校尉の一つで、禁軍の統率を司る。この人物は軍を治めること厳正で、号令は整然としている。"
 trait_WJ_mr_xiaowei_dianjunqi_desc:0 "典軍器校尉は一営の甲冑・兵器・器械を司る。この人物は常に武庫で刀や甲を点検し、損じた物を修繕している。"
 trait_WJ_mr_xiaowei_dianma_desc:0 "典馬校尉は軍馬の飼育を司る。この人物は常に厩舎のそばに寝泊まりし、軍馬の肥え具合に目を配っている。"
 trait_WJ_mr_xiaowei_diannong_desc:0 "典農校尉は一郡内の屯田を司る。この人物は自ら田畑に出て、屯民の開墾を励まし督促する。"
 trait_WJ_mr_xiaowei_dingbei_desc:0 "定北校尉は、北辺を平定する意を取る。この人物は一営の軽騎を率い、塞を侵す胡騎を追撃する。"
 trait_WJ_mr_xiaowei_dingdong_desc:0 "定東校尉は、東土を平定する意を取る。この人物は一営の兵を率い、海辺の盗賊を掃討する。"
 trait_WJ_mr_xiaowei_dingnan_desc:0 "定南校尉は、南方を平定する意を取る。この人物は一営を率いて山を越え嶺を渡り、乱をなす蛮族を追討する。"
 trait_WJ_mr_xiaowei_dingnan_variant_2_desc:0 "定難を号とする校尉。この人物は乱れた地を奔走し、急を救い危難を解く。"
 trait_WJ_mr_xiaowei_dingxi_desc:0 "定西校尉は、西陲を平定する意を取る。この人物は一営の兵を率いて隴上に駆けつけ、羌の騎兵と渡り合う。"
 trait_WJ_mr_xiaowei_fenwu_desc:0 "奮武を号とする校尉。この人物は初めて一営を率い、戦功によって名を上げようと逸っている。"
 trait_WJ_mr_xiaowei_fubei_desc:0 "撫北校尉は、北辺を懐柔する意を取る。この人物は塞外の胡族と往来し、利害を説いて聞かせる。"
 trait_WJ_mr_xiaowei_fudong_desc:0 "撫東校尉は、東方を懐柔する意を取る。この人物は一営を率いて郷里に駐屯し、父老と親しく交わっている。"
 trait_WJ_mr_xiaowei_fuguo_desc:0 "輔国校尉は、国家を輔佐する意を取る。この人物は王事に忠勤し、次第に上官に知られるようになった。"
 trait_WJ_mr_xiaowei_funan_desc:0 "撫南校尉は、南方を懐柔する意を取る。この人物は越の言葉を学び、山中の部族と次第に往来するようになった。"
 trait_WJ_mr_xiaowei_furong_desc:0 "撫戎校尉は、西戎を安撫する意を取る。この人物は恩と信義によって羌胡を結びつけている。"
 trait_WJ_mr_xiaowei_fuxi_desc:0 "撫西校尉は、西辺を懐柔する意を取る。この人物は諸部族の幕営の間を奔走し、草場の争いを調停している。"
 trait_WJ_mr_xiaowei_fuyu_desc:0 "撫輿校尉は乗輿を支え車駕を護衛することを掌る。この人物は常に御側に侍り、慎重で注意深い。"
 trait_WJ_mr_xiaowei_fuyuan_desc:0 "撫遠校尉は、遠方を安撫する意を取る。この人物は一営を率いて辺郡に駐屯し、遠来の胡商や使者を応接している。"
 trait_WJ_mr_xiaowei_guanjun_desc:0 "冠軍を号とする校尉。この人物は若く勇敢で鋭く、名を揚げることを志している。"
 trait_WJ_mr_xiaowei_guanwei_desc:0 "関衛校尉は一営を率いて関所を守る。この人物は昼夜通行証を検め、奸人の出入りを許さない。"
 trait_WJ_mr_xiaowei_huaiyuan_desc:0 "懐遠校尉は、遠方の人々を懐柔する意を取る。この人物は辺境を守り、礼をもって遠方の部族を招撫している。"
 trait_WJ_mr_xiaowei_huben_desc:0 "虎賁校尉は一営の虎賁の勇士を統べる。この人物は虎のように勇猛で、左右を奔走して護衛する。"
 trait_WJ_mr_xiaowei_hudi_desc:0 "護狄校尉は北方の狄の諸部を監護する。この人物は塞上に常駐し、諸部の紛争を調停している。"
 trait_WJ_mr_xiaowei_hujie_desc:0 "虎節校尉は虎符を信とし、兵の動員を掌る。この人物は符節を謹んで守り、軽々しく動こうとしない。"
 trait_WJ_mr_xiaowei_hujun_desc:0 "護軍校尉は一営の監護を掌る。この人物は軍紀を監察し、命令違反者を糾弾する。"
 trait_WJ_mr_xiaowei_human_desc:0 "護蛮校尉は南方の諸蛮を監護する。この人物は一営を率いて蛮地の縁辺に駐屯し、その向背を窺っている。"
 trait_WJ_mr_xiaowei_huqi_desc:0 "胡騎校尉は一営の内附した胡騎を統べる。この人物は胡兵と寝食を共にし、その心を深く掴んでいる。"
 trait_WJ_mr_xiaowei_huqiang_desc:0 "護羌校尉は西方の諸羌を監護し、昔から涼州の要職である。この人物は湟中に駐節し、羌族の大小の事務はすべて関与せねばならない。"
 trait_WJ_mr_xiaowei_hurong_desc:0 "護戎校尉は西方の諸戎を監護する。この人物は隴右を往来し、諸部を羈縻している。"
 trait_WJ_mr_xiaowei_huwu_desc:0 "護烏桓校尉は幽州塞外の烏桓を監護し、互市を主宰し、諸部を調停する。この人物は胡の事情に通じ、進退を誤らぬようにせねばならない。"
 trait_WJ_mr_xiaowei_huxiongnu_desc:0 "護匈奴校尉は内附した匈奴の諸部を監護する。この人物は一営を率いて部落の近くに駐屯し、変事に備えている。"
 trait_WJ_mr_xiaowei_huyi_desc:0 "護夷校尉は西南の諸夷を監護する。この人物は朝廷の下賜品を携えてしばしば夷の地に入り、諸夷の首領と好を結んでいる。"
 trait_WJ_mr_xiaowei_jianjun_desc:0 "監軍校尉は命を受けて一軍を監察する。この人物は軍に随行し、見聞きしたことはすべて上に報告せねばならない。"
 trait_WJ_mr_xiaowei_jianning_desc:0 "建寧校尉は、安寧を打ち立てる意を取る。この人物は南中を守り、境を保ち民を安んじている。"
 trait_WJ_mr_xiaowei_jianwei_desc:0 "建威を号とする校尉。この人物は練兵に励み、功を立てることを渇望している。"
 trait_WJ_mr_xiaowei_jianzhong_desc:0 "建忠を号とする校尉。この人物は上に仕えて恭しく慎み深く、二心を抱いたことがない。"
 trait_WJ_mr_xiaowei_jieying_desc:0 "接応校尉は前軍の接応を掌る。この人物は常に後方に兵を伏せ、敗走する軍を救援する。"
 trait_WJ_mr_xiaowei_jingbei_desc:0 "靖北校尉は、北辺を粛清する意を取る。この人物は一営を率いて塞下を往来し、遊騎を捕らえ斬っている。"
 trait_WJ_mr_xiaowei_jingbian_desc:0 "靖辺校尉は、辺境を安んじ鎮める意を取る。この人物は一営を率いて辺境の亭を守り、山川や道路に精通している。"
 trait_WJ_mr_xiaowei_jingdong_desc:0 "靖東校尉は、東方を粛清する意を取る。この人物は一営を率いて駅道を守り、旅人を保護している。"
 trait_WJ_mr_xiaowei_jinglue_desc:0 "経略を号とする校尉。この人物は計画に長け、しばしば上官に献策する。"
 trait_WJ_mr_xiaowei_jingman_desc:0 "靖蛮校尉は、蛮の乱を平らげ鎮める意を取る。この人物はしばしば一営を率いて渓谷の奥深くへ入り、討伐と招撫を併用している。"
 trait_WJ_mr_xiaowei_jingnan_desc:0 "靖南校尉は、南方を粛清する意を取る。この人物は一営を率いて渡し場を巡回し、盗賊を捕縛している。"
 trait_WJ_mr_xiaowei_jingnan_variant_2_desc:0 "靖難を号とする校尉。この人物は一営の兵馬を率い、いつでも呼び出しに応じて救援に赴く。"
 trait_WJ_mr_xiaowei_jingxi_desc:0 "靖西校尉は、西辺を粛清する意を取る。この人物は一営を率いて往来する使節や糧食の隊列を護送している。"
 trait_WJ_mr_xiaowei_liadong_desc:0 "遼東校尉は、遼東の鎮守を名とする。この人物は遼海の浜に駐屯し、高句麗と鮮卑に備えている。"
 trait_WJ_mr_xiaowei_lide_desc:0 "立徳校尉は、徳行を打ち立てる意を取る。この人物は品行方正で、自ら手本を示している。"
 trait_WJ_mr_xiaowei_longxiang_desc:0 "龍驤を号とする校尉。この人物は若々しい意気に溢れ、志は高く遠い。"
 trait_WJ_mr_xiaowei_nuqi_desc:0 "弩騎校尉は弩手と騎士を統べる。この人物は騎射を得意とし、遠戦に長けている。"
 trait_WJ_mr_xiaowei_pingbei_desc:0 "平北校尉は、北辺を平定する意を取る。この人物は一営を率いて塞下を守り、いつでも胡騎を迎え撃つ構えである。"
 trait_WJ_mr_xiaowei_pingdong_desc:0 "平東校尉は、東方を平定する意を取る。この人物は一営を率いて青州・徐州を転戦し、小規模な乱兵を討ち平らげている。"
 trait_WJ_mr_xiaowei_pinghu_desc:0 "平胡校尉は、胡の乱を平定する意を取る。この人物は胡騎の戦法に精通し、歩兵で陣を組んで対抗できる。"
 trait_WJ_mr_xiaowei_pingnan_desc:0 "平南校尉は、南方を平定する意を取る。この人物は一営を率いて南征し、山寨を攻め破っている。"
 trait_WJ_mr_xiaowei_pingxi_desc:0 "平西校尉は、西方を平定する意を取る。この人物は一営を率いて辺郡の救援に駆けつけ、反乱した羌を討っている。"
 trait_WJ_mr_xiaowei_polu_desc:0 "破虜校尉は、敵虜を打ち破る意を取る。この人物は勇猛で戦に長け、常に将を斬り旗を奪うことを思っている。"
 trait_WJ_mr_xiaowei_saoni_desc:0 "掃逆を号とする校尉。この人物は一営を率いて乱党を追討し、艱難を避けない。"
 trait_WJ_mr_xiaowei_shesheng_desc:0 "射声校尉は北軍五校の一つで、射声の士を統べる。この人物は弓術に優れ、しばしば兵卒と腕比べをする。"
 trait_WJ_mr_xiaowei_shuijun_desc:0 "水軍校尉は一営の舟船と水兵を統べる。この人物は水に慣れ親しみ、舟の操縦に長けている。"
 trait_WJ_mr_xiaowei_sima_desc:0 "司馬校尉は営中の兵馬の差配を掌る。この人物は兵卒を点呼し、営伍を割り振り、事務は繁忙を極める。"
 trait_WJ_mr_xiaowei_taolu_desc:0 "討虜校尉は、敵虜を討伐する意を取る。この人物は若く進取の気性に富み、一戦で名を成すことを渇望している。"
 trait_WJ_mr_xiaowei_taoni_desc:0 "討逆校尉は、叛逆を討伐する意を取る。この人物は一営を率いて軍に従って征討し、たびたび先鋒を願い出ている。"
 trait_WJ_mr_xiaowei_tianlu_desc:0 "殄虜校尉は、敵虜を殲滅する意を取る。この人物は戦いぶりが凶猛で、容赦しない。"
 trait_WJ_mr_xiaowei_tiaobeilu_desc:0 "調北校尉は北方の兵馬の動員を掌る。この人物は辺郡を往来し、兵卒を徴集し、糧秣を輸送している。"
 trait_WJ_mr_xiaowei_tiaoman_desc:0 "調蛮校尉は南方の蛮兵の派遣を掌る。この人物は蛮の言葉に通じ、蛮兵を朝廷のために働かせることができる。"
 trait_WJ_mr_xiaowei_tiaonan_desc:0 "調南校尉は南方の兵馬の動員を掌る。この人物は諸郡を奔走し、兵卒を徴発し、軍需物資を輸送している。"
 trait_WJ_mr_xiaowei_tunqi_desc:0 "屯騎校尉は北軍五校の一つで、騎士を統べて京師に駐屯し護衛する。この人物は騎兵の扱いに長け、部隊は整然としている。"
 trait_WJ_mr_xiaowei_weibei_desc:0 "威北校尉は、北辺に威を振るう意を取る。この人物は勇猛果敢で、胡騎がその名を聞いて恐れるようになることを望んでいる。"
 trait_WJ_mr_xiaowei_weidong_desc:0 "威東校尉は、東方に威を振るう意を取る。この人物は営の統治が厳格で、一地方の盗賊が鳴りを潜めることを望んでいる。"
 trait_WJ_mr_xiaowei_weinan_desc:0 "威南校尉は、南方に威を振るう意を取る。この人物は勇猛さを自負し、江南に名を揚げることを望んでいる。"
 trait_WJ_mr_xiaowei_weishuo_desc:0 "衛朔校尉は、朔方を護衛する意を取る。この人物は一営を率いて朔方に駐屯し、冬でも巡回を怠らない。"
 trait_WJ_mr_xiaowei_weixi_desc:0 "威西校尉は、西辺に威を振るう意を取る。この人物は隴右を駆け巡り、羌人が旗を見ただけで避けるようになることを望んでいる。"
 trait_WJ_mr_xiaowei_wuling_desc:0 "武陵校尉は、武陵の山地を守ることからその名を得た。この人物は五渓蛮の事情に精通し、討伐と招撫を併せ行っている。"
 trait_WJ_mr_xiaowei_wuwei_desc:0 "武衛を号とする校尉で、宿衛の親兵を掌る。この人物は一営の親兵を率いて宿直し、夜も甲冑を解かない。"
 trait_WJ_mr_xiaowei_wuyi_desc:0 "武毅を号とする校尉。この人物は性格が剛強で、折れても曲がらない。"
 trait_WJ_mr_xiaowei_xianfeng_desc:0 "先鋒校尉は一営を率いて先駆けとなる。この人物は戦のたびに兵を率いて真っ先に城壁を登り、その勇は全軍に冠たる。"
 trait_WJ_mr_xiaowei_xiongjie_desc:0 "熊節校尉は、熊羆の勇を取る。この人物は体格が雄壮で、膂力は人並み外れている。"
 trait_WJ_mr_xiaowei_xiping_desc:0 "西平校尉は、西辺を平定する意を取る。この人物は河湟の間を守り、羌の乱に備えている。"
 trait_WJ_mr_xiaowei_xuanfeng_desc:0 "宣風を号とする校尉。この人物は書を知り理をわきまえ、営の統治の傍ら礼義も講じている。"
 trait_WJ_mr_xiaowei_xuanrui_desc:0 "宣鋭を号とする校尉。この人物は若く血気盛んで、しばしば豪語して部下を鼓舞する。"
 trait_WJ_mr_xiaowei_xuanwei_desc:0 "宣威を号とする校尉。この人物は軍容を整えることを好み、旗印は鮮やかである。"
 trait_WJ_mr_xiaowei_xuanyi_desc:0 "宣義を号とする校尉。この人物は忠義をもって部下を号令する。"
 trait_WJ_mr_xiaowei_xunwei_desc:0 "巡衛校尉は巡回と警護を掌る。この人物は一営を率いて街を巡回し、悪人を捕縛している。"
 trait_WJ_mr_xiaowei_yangwu_desc:0 "揚武を号とする校尉。この人物は勇を好んで先を争い、演習のたびに必ず一番を取る。"
 trait_WJ_mr_xiaowei_yaowei_desc:0 "耀威を号とする校尉。この人物は営を出て巡回するたびに、必ず華やかな衣を纏い駿馬に乗って、一営の威勢を示す。"
 trait_WJ_mr_xiaowei_yaowu_desc:0 "耀武を号とする校尉。この人物は甲冑や武器を大切にし、一営の軍容はなかなか見栄えがする。"
 trait_WJ_mr_xiaowei_yifeng_desc:0 "翊軍を号とする校尉。この人物は一営を率いて中軍に随侍し、命令を待っている。"
 trait_WJ_mr_xiaowei_yingyang_desc:0 "鷹揚を号とする校尉。この人物は目が利き手が早く、瞬く間に過ぎ去る戦機を捉えることに長けている。"
 trait_WJ_mr_xiaowei_yongchang_desc:0 "永昌校尉は、永昌の辺郡を鎮守することからその名を得た。この人物は遠く西南の果てにあって、哀牢の諸夷と雑居している。"
 trait_WJ_mr_xiaowei_yueqi_desc:0 "越騎校尉は北軍五校の一つで、越騎を統べる。この人物はしばしば自ら勇猛な士を選んで営に補充している。"
 trait_WJ_mr_xiaowei_yulin_desc:0 "羽林校尉は一営の羽林騎士を統べる。この人物は禁軍の出身で、少年の頃から弓馬を習ってきた。"
 trait_WJ_mr_xiaowei_yuqi_desc:0 "輿騎校尉は乗輿を護衛する騎士を掌る。この人物は御駕に随って出入りし、儀仗は整然としている。"
 trait_WJ_mr_xiaowei_zhangshi_desc:0 "長史校尉は営中の文書を掌る。この人物は簿籍に精通し、主将の憂いを分かち合っている。"
 trait_WJ_mr_xiaowei_zhangshui_desc:0 "長水校尉は北軍五校の一つで、長水の胡騎を統べる。この人物は営中を出入りし、胡漢の兵卒に号令して、それぞれを適所に用いている。"
 trait_WJ_mr_xiaowei_zhaowu_desc:0 "昭武を号とする校尉。この人物は功を積んで昇進し、名声が次第に高まっている。"
 trait_WJ_mr_xiaowei_zhechong_desc:0 "折衝を号とする校尉。この人物は戦陣に臨んで沈着であり、一営の兵は磐石のように揺るがない。"
 trait_WJ_mr_xiaowei_zhengdi_desc:0 "征狄校尉は、北狄の討伐を専らとする。この人物は軽騎を率いて塞外に出て、逃げる敵を追撃する。"
 trait_WJ_mr_xiaowei_zhenglu_desc:0 "征虜校尉は、胡虜の討伐を専らとする。この人物は突撃に勇敢で、強敵を恐れない。"
 trait_WJ_mr_xiaowei_zhengman_desc:0 "征蛮校尉は、南蛮の討伐を専らとする。この人物は一営の山地の兵を率い、林中での戦闘に慣れている。"
 trait_WJ_mr_xiaowei_zhengrong_desc:0 "征戎校尉は、西戎の討伐を専らとする。この人物は一営の騎兵と歩兵を率い、しばしば大軍に従って西征する。"
 trait_WJ_mr_xiaowei_zhenguo_desc:0 "鎮国校尉は、国家を鎮め守る意を取る。この人物は位は低いが、国を保つことを念頭に置いている。"
 trait_WJ_mr_xiaowei_zhengyi_desc:0 "征夷校尉は、東夷の討伐を専らとする。この人物は東方の山海の道に精通し、しばしば大軍の道案内を務める。"
 trait_WJ_mr_xiaowei_zhenshuo_desc:0 "鎮朔校尉は、朔方を鎮守する意を取る。この人物は一営を率いて塞下に駐屯し、堅守を本分としている。"
 trait_WJ_mr_xiaowei_zhenwei_desc:0 "振威を号とする校尉。この人物は疲弊した軍の士気を再び奮い立たせることができる。"
 trait_WJ_mr_xiaowei_zhenwu_desc:0 "振武を号とする校尉。この人物は初めて一営を掌り、毎日自ら兵卒に撃刺を教えている。"
 trait_WJ_mr_xiaowei_zhonglei_desc:0 "中塁校尉は北軍の営塁のことを掌る。この人物は昼夜門の出入りを監督し、営中への出入りはすべて検分を要する。"
 trait_WJ_mr_zhonglang_anbei_desc:0 "安北中郎将は、北辺の安定を託された者である。この人物は一部を率いて塞下に駐屯し、亭障の修繕を務めとすべきである。"
 trait_WJ_mr_zhonglang_anding_desc:0 "安東中郎将は、東方の安定を託された者である。この人物は一部を率いて海浜に駐屯し、境を保ち民を安んじることを務めとすべきである。"
 trait_WJ_mr_zhonglang_annan_desc:0 "安南中郎将は、南方の平定を託された者である。この人物は一部を率いて長江のほとりに駐屯し、沿江の郡県を安定させることを務めとすべきである。"
 trait_WJ_mr_zhonglang_anxi_desc:0 "安西中郎将は、西辺の安定を託された者である。この人物は一部を率いて河西に駐屯し、諸郡を安んじることを務めとすべきである。"
 trait_WJ_mr_zhonglang_anyi_desc:0 "安夷の号は、夷狄を安撫する意を取る。この人物はしばしば辺境の諸族と関わり、羈縻の道に深く通じているべきである。"
 trait_WJ_mr_zhonglang_bei_desc:0 "四方中郎将の一つで、北方の征討を専ら命じられる。この人物は位は将軍に及ばないものの、一方面を独りで担い、兵を率いて賊を討つべきである。"
 trait_WJ_mr_zhonglang_bingwei_desc:0 "兵衛中郎将は衛兵の統率を掌る。この人物の部隊は精鋭で秩序正しく、一方の安寧を守るべきである。"
 trait_WJ_mr_zhonglang_caiguan_desc:0 "材官中郎将は一部の材官力士を統べる。この人物は膂力が人並み外れ、強弩を引くことができる。"
 trait_WJ_mr_zhonglang_changshui_desc:0 "長水の名は、長水の胡騎に由来する。この人物は一部の精鋭騎兵を統べ、騎射の術は諸軍に冠たるべきである。"
 trait_WJ_mr_zhonglang_chengmen_desc:0 "城門中郎将は城門の駐屯兵を統べる。この人物は昼夜諸門を巡回して守り、出入りを厳しく詮議し、怠ることはない。"
 trait_WJ_mr_zhonglang_chengwei_desc:0 "城衛中郎将は城池の守護を掌る。この人物は城の防備を修繕し、守兵を整え、城壁を金城湯池のごとく堅固にすべきである。"
 trait_WJ_mr_zhonglang_chijie_desc:0 "持節中郎将は節を奉じて行き、朝廷に代わって威命を宣示する。この人物の節旄が至るところ、州郡は皆奉迎すべきである。"
 trait_WJ_mr_zhonglang_dianjun_desc:0 "典軍中郎将は軍務の統領を掌る。この人物は一部の簿籍と部隊を総理し、事の大小を問わず胸中に把握しているべきである。"
 trait_WJ_mr_zhonglang_dianjunqi_desc:0 "典軍器中郎将は甲冑と武器を掌る。この人物は刀・甲・弓・弩の製造を監督し、軍中の器械を精良に保つよう努める。"
 trait_WJ_mr_zhonglang_dianma_desc:0 "典馬中郎将は軍馬の飼育と差配を掌る。この人物は馬の目利きに長け、馬政を整然とさせるべきである。"
 trait_WJ_mr_zhonglang_diannong_desc:0 "典農中郎将は屯田と穀物の備蓄を掌る。この人物は屯民を督率して耕作と戦闘を両立させ、大軍のために糧秣を蓄える。"
 trait_WJ_mr_zhonglang_dingyuan_desc:0 "定遠の号は、班超が筆を投げ捨てて軍に従い、遥かな異域で功を立てた故事を遠く思わせる。この人物もまた万里の志を抱くべきである。"
 trait_WJ_mr_zhonglang_dong_desc:0 "東・南・西・北の四中郎将は、それぞれ一方面の征討を専ら命じられる。東中郎将は位こそ将軍に及ばないが、この人物は一軍を独りで率い、青州・徐州の間を転戦できる。"
 trait_WJ_mr_zhonglang_fengche_desc:0 "奉車中郎将は乗輿・車駕の御を掌る。この人物は出入りに随侍し、信任厚い近臣でなければこの職に就くことはできない。"
 trait_WJ_mr_zhonglang_fenwei_desc:0 "奮威を号とする中郎将。この人物は一部の精鋭を率い、果敢に進取し、敵に臨んで怯まぬべきである。"
 trait_WJ_mr_zhonglang_fenwu_desc:0 "奮武を号とする中郎将。この人物は一部の勇敢な士を率い、しばしば出陣を願い出る。"
 trait_WJ_mr_zhonglang_fubei_desc:0 "撫北中郎将は、北辺の懐柔を任とする。この人物はしばしば塞下で胡の使者を送迎し、礼をもって遇している。"
 trait_WJ_mr_zhonglang_fubo_desc:0 "伏波中郎将は一部の水軍を率いる。この人物は江河の上に出没し、伏波を名とし、風濤を平らげることを望んでいる。"
 trait_WJ_mr_zhonglang_fudong_desc:0 "撫東中郎将は、東方の懐柔を任とする。この人物は農桑を奨励し、流散した民を呼び戻している。"
 trait_WJ_mr_zhonglang_fujun_desc:0 "撫軍の号は、兵卒を慈しみ労わる意を取る。この人物は部下を思いやり、兵卒は喜んでその命に従うはずである。"
 trait_WJ_mr_zhonglang_funan_desc:0 "撫南中郎将は、南方の懐柔を任とする。この人物はしばしば使者を山中に遣わし、塩や布を贈って蛮夷を招撫している。"
 trait_WJ_mr_zhonglang_fuxi_desc:0 "撫西中郎将は、西辺の懐柔を任とする。この人物はしばしば羌・氐の酋長と会盟して宴を共にし、恩義によって結びついている。"
 trait_WJ_mr_zhonglang_guanjun_desc:0 "冠軍を号とする中郎将。この人物は武芸に秀で、常に一戦で名を成すことを望んでいる。"
 trait_WJ_mr_zhonglang_guanwei_desc:0 "関衛中郎将は関所の守衛を掌る。この人物は要衝を扼して往来を検問し、一夫関に当たれば万夫も開くなしの気概を持つべきである。"
 trait_WJ_mr_zhonglang_huaihua_desc:0 "懐化の号は、懐柔して帰化させる意を取る。この人物は帰順した辺境の諸族と多く往来し、恩義によってその心を掴むべきである。"
 trait_WJ_mr_zhonglang_huben_desc:0 "虎賁とは、勇士が猛虎のように奔走することである。この人物は虎賁の宿衛を統べて君主の側に侍衛し、忠勇をもって称えられるべきである。"
 trait_WJ_mr_zhonglang_hujun_desc:0 "護軍中郎将は軍に随って諸将を監護する。この人物は諸部の進退を調和させ、軍中の人事を補佐している。"
 trait_WJ_mr_zhonglang_human_desc:0 "護蛮中郎将は南方の諸蛮を監護する。この人物は荊南の渓谷の間を往来し、教化に従う者は撫し、叛く者は討つ。"
 trait_WJ_mr_zhonglang_huqi_desc:0 "胡騎中郎将は内附した胡人の騎士を統べる。この人物は胡の風俗に通じ、恩威をもって胡騎を御せるはずである。"
 trait_WJ_mr_zhonglang_huqiang_desc:0 "護羌中郎将は西方の諸羌を監護する。この人物は羌の諸部族の種落の恩讐に精通し、分断と招撫をそれぞれ適切に行うべきである。"
 trait_WJ_mr_zhonglang_huwei_desc:0 "虎威を号とする中郎将。この人物は勇猛剛烈で、戦陣に臨んでは敵を震え上がらせるべきである。"
 trait_WJ_mr_zhonglang_huwuhuan_desc:0 "護烏桓中郎将は幽州塞外の烏桓の諸部を監護する。この人物は長城の内外を往来し、恩威をもって胡騎を羈縻している。"
 trait_WJ_mr_zhonglang_huxiongnu_desc:0 "護匈奴中郎将は内附した匈奴の諸部を監護する。この人物は并州に駐節し、単于と往来して渡り合い、その動静を監視している。"
 trait_WJ_mr_zhonglang_huyi_desc:0 "護夷中郎将は西南の諸夷を監護する。この人物は南中の山川に出入りし、恩と信義によって夷の首領を籠絡している。"
 trait_WJ_mr_zhonglang_jianjun_desc:0 "監軍中郎将は命を受けて諸軍を監護する。この人物は諸将の功過を察し、朝廷の耳目となっている。"
 trait_WJ_mr_zhonglang_jianwu_desc:0 "建武を号とする中郎将。この人物は日夜殊勲を立てることを思い、さらなる昇進を図っている。"
 trait_WJ_mr_zhonglang_jingbei_desc:0 "靖北中郎将は、北辺の粛清を託された者である。この人物は一部を率いて塞を巡回して寇を追い、辺境の烽火を稀にしている。"
 trait_WJ_mr_zhonglang_jingdong_desc:0 "靖東中郎将は、東方の粛清を託された者である。この人物は一部を率いて海賊や山賊を捜索・捕縛し、道路を再び通じさせている。"
 trait_WJ_mr_zhonglang_jingnan_desc:0 "靖南中郎将は、南方の粛清を託された者である。この人物は一部を率いて江湖を往来し、水賊を掃討している。"
 trait_WJ_mr_zhonglang_jingnan_variant_2_desc:0 "靖難を号とする中郎将。この人物は変乱が起こるたびに、本部を率いて急ぎ救援に駆けつける。"
 trait_WJ_mr_zhonglang_jingxi_desc:0 "靖西中郎将は、西辺の粛清を託された者である。この人物は一部を率いて隴坂に駐屯し、略奪を働く羌胡を鎮圧している。"
 trait_WJ_mr_zhonglang_lingjun_desc:0 "領軍中郎将は一部の禁軍を統べる。この人物は部隊を整え、軍を厳正に治めている。"
 trait_WJ_mr_zhonglang_longxiang_desc:0 "龍驤を号とする中郎将。この人物は意気軒昂で、いつまでも人の下に甘んじることを良しとしない。"
 trait_WJ_mr_zhonglang_louchuan_desc:0 "楼船中郎将は一部の戦船と水軍を率いる。この人物は長く船上にあり、風浪の中でも泰然と指揮を執ることができる。"
 trait_WJ_mr_zhonglang_nan_desc:0 "四方中郎将の一つで、南方の征討を専ら命じられる。この人物は兵を率いて南下し、江湖山沢に出没して、服従しない者を討伐すべきである。"
 trait_WJ_mr_zhonglang_pinglu_desc:0 "平虜の号は、胡虜を平定する意を取る。この人物はしばしば胡騎と交戦し、その虚実を深く知っている。"
 trait_WJ_mr_zhonglang_qingche_desc:0 "軽車中郎将は一部の軽車の精鋭を率いる。この人物は奇襲を得意とし、しばしば敵の不意を突く。"
 trait_WJ_mr_zhonglang_shesheng_desc:0 "射声とは、声を聞いただけで射て命中させることである。この人物は射術に長けた士を統べ、闇夜の中でも矢を外さぬべきである。"
 trait_WJ_mr_zhonglang_sima_desc:0 "司馬中郎将は軍中の賞罰と兵馬の差配を掌る。この人物は法を執行して阿らず、軍紀を粛然とさせるべきである。"
 trait_WJ_mr_zhonglang_taoni_desc:0 "討逆の号は、叛逆を討伐する意を取る。この人物は不臣の者を誅することを己の任とし、鋭気を露わにしている。"
 trait_WJ_mr_zhonglang_tianjin_desc:0 "渡津中郎将は渡し場と橋梁の守備を掌る。この人物は河の渡しを扼し、舟の往来をすべて掌握している。"
 trait_WJ_mr_zhonglang_tunqi_desc:0 "屯騎中郎将は一部の駐屯騎士を率いる。この人物は騎戦に長け、進退は迅速である。"
 trait_WJ_mr_zhonglang_wuguan_desc:0 "五官中郎将は五官郎署を統べ、昔から清貴の選とされる。この人物がこの職にある以上、その進退は朝野の注目を集める。"
 trait_WJ_mr_zhonglang_wuwei_desc:0 "武衛中郎将は親衛の士を統べ、主上の左右を宿衛する。この人物は勇武で忠実かつ慎み深く、深く信任されている。"
 trait_WJ_mr_zhonglang_xi_desc:0 "四方中郎将の一つで、西方の征討を専ら命じられる。この人物は軍を統べて西へ向かい、関隴で羌胡と渡り合うべきである。"
 trait_WJ_mr_zhonglang_xiaoqi_desc:0 "驍騎中郎将は一部の勇猛な騎士を率いる。この人物は弓馬に習熟し、戦のたびに先頭に立って突撃する。"
 trait_WJ_mr_zhonglang_xunwei_desc:0 "巡衛中郎将は巡回と警護を掌る。この人物は往来して巡察し、小悪党どもに乱を起こさせない。"
 trait_WJ_mr_zhonglang_yangwei_desc:0 "揚威の号は、軍威を宣揚する意を取る。この人物は兵を並べて武威を誇示し、声勢を盛んにすることを好む。"
 trait_WJ_mr_zhonglang_yingyang_desc:0 "鷹揚を号とする中郎将。この人物はしばしば高所に登って敵陣を見定め、機を窺って撃つ。"
 trait_WJ_mr_zhonglang_you_desc:0 "右中郎将は左中郎将とともに郎署の宿衛を分掌する。この人物は禁中に出入りし、命を受けて兵を率い賊を討つこともできる。"
 trait_WJ_mr_zhonglang_youji_desc:0 "遊撃中郎将は一部の遊兵を率いて往来し、策応する。この人物は所在が定まらず、どこであれ急を要する所へ駆けつける。"
 trait_WJ_mr_zhonglang_yueqi_desc:0 "越騎とは、才力の卓越した騎士を指す。この人物が率いる一部は皆勇猛で騎乗に長けた士であり、突撃して陣を陥れ、向かうところ敵なしであるべきだ。"
 trait_WJ_mr_zhonglang_yulin_desc:0 "羽林中郎将は羽林騎士を統べ、宮禁を宿衛する。この人物は弓馬に習熟し、号令を整然とさせるべきである。"
 trait_WJ_mr_zhonglang_zhangjun_desc:0 "掌軍中郎将は一部の号令を主掌する。この人物は軍を治めるに巧みで、進退はすべて法度に従う。"
 trait_WJ_mr_zhonglang_zhangshi_desc:0 "長史中郎将は幕府の諸務を補佐する。この人物は周到で有能であり、主将に片腕として頼られている。"
 trait_WJ_mr_zhonglang_zhechong_desc:0 "折衝を号とする中郎将。この人物は一部を率いて前方に陣を敷き、敵軍の突撃を専ら食い止める。"
 trait_WJ_mr_zhonglang_zhengdi_desc:0 "征狄中郎将は、北狄の討伐を専らとする。この人物は一部を率いて塞外を駆け巡り、胡騎と鋒を争う。"
 trait_WJ_mr_zhonglang_zhengman_desc:0 "征蛮中郎将は、南蛮の討伐を専らとする。この人物は一部を率いて瘴癘の地を跋渉し、渓谷の乱を平定する。"
 trait_WJ_mr_zhonglang_zhengrong_desc:0 "征戎中郎将は、西戎の討伐を専らとする。この人物は一部を率いて河湟を転戦し、羌・氐と鋒を争う。"
 trait_WJ_mr_zhonglang_zhengyi_desc:0 "征夷中郎将は、東夷の討伐を専らとする。この人物は一部を率いて海を渡り嶺を越え、東方に威を示す。"
 trait_WJ_mr_zhonglang_zhenjun_desc:0 "鎮軍の号は、軍旅を鎮め撫する意を取る。この人物は一部に重きをなし、変事に処して動じない。"
 trait_WJ_mr_zhonglang_zhenshuo_desc:0 "鎮朔中郎将は、朔方を鎮守する意を取る。この人物は長年辺境を守り、風砂に磨かれて堅忍な気性を身につけた。"
 trait_WJ_mr_zhonglang_zhenwei_desc:0 "振威を号とする中郎将。この人物の治める一部は軍容が整い、鼓角の音が響き合っている。"
 trait_WJ_mr_zhonglang_zhenwu_desc:0 "振武を号とする中郎将。この人物は部隊の監督が極めて厳しく、演習を欠かしたことがない。"
 trait_WJ_mr_zhonglang_zhonglei_desc:0 "中塁の名は、軍中の営塁を守る意を取る。この人物は営を厳整に治め、堡塁を森然とさせるべきである。"
 trait_WJ_mr_zhonglang_zuo_desc:0 "左中郎将はもともと殿中の郎署を統べる清顕の職である。この乱世にあって、この人物は外に出ては兵を率いて征伐し、内に入っては宮禁を宿衛することができる。"
