l_japanese:
 rule_embattle_side_advantage_multiplier:0 "布陣――旧版の優位倍率（無効化済み）"
 setting_embattle_side_advantage_1x:0 "旧版の選択肢"
 setting_embattle_side_advantage_1x_desc:0 "旧版テキストとの互換用。現行の副将軍事修正は軍事の平均値による計算式を用いる。"
 setting_embattle_side_advantage_0.5x:0 "旧版の選択肢"
 setting_embattle_side_advantage_0.5x_desc:0 "旧版テキストとの互換用。現行の副将軍事修正は軍事の平均値による計算式を用いる。"
 rule_embattle_side_commander_traits_sharing:0 "布陣――副将の戦闘特性共有"
 setting_embattle_side_commander_traits_sharing_enable:0 "有効"
 setting_embattle_side_commander_traits_sharing_enable_desc:0 "あなたの麾下の軍の主将は、交戦時に副将の特定の戦闘特性を借用できる。同種の特性は経験が最も高い段階を採用し、重複して加算されない。"
 setting_embattle_side_commander_traits_sharing_disable:0 "無効"
 setting_embattle_side_commander_traits_sharing_disable_desc:0 "主将は副将の戦闘特性を借用しない。副将の任命と軍事平均値によるボーナスには影響しない。すでに借用している特性は次回の軍の再編時に取り除かれる。"
 rule_embattle_side_commander_appointor:0 "布陣――副将の手動任免"
 setting_embattle_side_commander_appointor_ai_only_except_own_troop:0 "親征部隊のみ"
 setting_embattle_side_commander_appointor_ai_only_except_own_troop_desc:0 "あなたが自ら率いる軍の副将のみ手動で任免でき、その他の軍の副将は自動で補充される。"
 setting_embattle_side_commander_appointor_player_exempt:0 "すべての自軍部隊"
 setting_embattle_side_commander_appointor_player_exempt_desc:0 "麾下のどの軍の副将でも手動で任免でき、自ら主将を務める必要はない。"
 rule_embattle_tactic:0 "布陣――旧版の戦術（削除済み）"
 setting_embattle_tactic_enabled:0 "無効化済み（旧セーブ互換）"
 setting_embattle_tactic_enabled_desc:0 "付随戦術は廃止されており、この項目を選んでも再び有効にはならない。"
 setting_embattle_tactic_disabled:0 "無効化済み"
 setting_embattle_tactic_disabled_desc:0 "付随戦術は廃止された。"
 rule_embattle_side_commanders_trait_xp:0 "布陣――副将の追加特性経験"
 setting_embattle_side_commanders_trait_xp_enabled:0 "有効"
 setting_embattle_side_commanders_trait_xp_enabled_desc:0 "副将は行軍・攻城・略奪の際に、対応する特性の経験を追加で獲得できる。行軍経験はあなたの麾下の軍の副将にのみ与えられ、攻城と略奪の経験はどの陣営の軍にも与えられる。副将はまだ自軍に属し、かつ対応する特性をすでに持っていなければならない。"
 setting_embattle_side_commanders_trait_xp_disabled:0 "無効"
 setting_embattle_side_commanders_trait_xp_disabled_desc:0 "副将は行軍・攻城・略奪の経験を追加で獲得しなくなる。主将の経験獲得は通常通りである。"
 rule_embattle_acotw_compatch:0 "布陣――旧互換オプション（無効化済み）"
 setting_embattle_acotw_compatch_enabled:0 "無効化済み（旧セーブ互換）"
 setting_embattle_acotw_compatch_enabled_desc:0 "この項目は無効化された。副将の選任は自軍の中でのみ行われ、補充できない場合は保留となる。"
 setting_embattle_acotw_compatch_disabled:0 "無効化済み"
 setting_embattle_acotw_compatch_disabled_desc:0 "この項目は無効化されており、副将の自動任命には影響しない。"
