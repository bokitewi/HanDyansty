 hd_yiling_return_part_jingzhou:0 "係争地の一部を返還する。"
 hd_yiling_risk_camps_modifier:0 "連営百里"
 hd_yiling_risk_camps_modifier_desc:0 "陣営が連なっているため、軍中で迅速に救援し合うのが難しい。"
 hd_yiling_risk_heat_modifier:0 "盛夏の酷暑"
 hd_yiling_risk_heat_modifier_desc:0 "酷暑の気が、遠征軍の戦力をすり減らしている。"
 hd_yiling_risk_lu_xun_modifier:0 "陸遜の統兵"
 hd_yiling_risk_lu_xun_modifier_desc:0 "陸遜が反撃の機をうかがっている。"
 hd_yiling_risk_mountain_modifier:0 "山の関が行く手を阻む。"
 hd_yiling_risk_mountain_modifier_desc:0 "山地が険しく、大軍を展開しにくい。"
 hd_yiling_risk_supply_modifier:0 "夷陵の糧道"
 hd_yiling_risk_supply_modifier_desc:0 "呉を攻める軍の糧道は狭く脆い。"
 quix_murder_ongoing.3010.a:0 "[agent_in_question.GetFirstNameNoTooltip]のこの熱意こそ、皆の手本とすべきだ！"
 quix_murder_ongoing.3010.a.failure:0 "[agent_in_question.GetSheHe|U]は自ら正体を露わにした"
 quix_murder_ongoing.3010.a.success:0 "[agent_in_question.GetHerHis|U]のこの執念は、まさに値がつけられぬほどの宝だ。"
 quix_murder_ongoing.3010.b:0 "[agent_in_question.GetTitledFirstNameNoTooltip]を革紐で縛り上げる。"
 quix_murder_ongoing.3010.c:0 "この件について我らは一切責任を負わぬ。"
 quix_murder_ongoing.3010.desc:0 "[agent_in_question.GetTitledFirstName]の提案する策はどれも拷問を主眼としており、[scheme.GetTarget.GetTitledFirstName]を殺すことはかえって二の次になっている。[agent_in_question.GetHerHis]の才は確かに役立つが、これほどの残忍さは、謀略全体を露見させかねない。"
 quix_murder_ongoing.3010.desc_hero:0 "[agent_in_question.GetTitledFirstName]の提案する策はどれも拷問を優先し、[scheme.GetTarget.GetTitledFirstName]を殺すことはかえって二の次になっている。この残忍さは、[agent_hero_of_the_moment.GetTitledFirstName]――[scheme.GetTarget.GetTitleAsNamePossessiveNoTooltip][target.Custom2('RelationToMe', SCOPE.sC('agent_hero_of_the_moment'))]――をすでに怒らせている。抑えなければ、二人とも謀略全体を台無しにしかねない。"
 quix_murder_ongoing.3010.desc_opening:0 "[agent_in_question.GetTitledFirstName]はこの暗殺にあまりにも熱を入れすぎているようだ。"
 quix_murder_ongoing.3010.t:0 "$murder_event_title$ 残虐な刺客"
 quix_murder_ongoing.3301.a:0 "何がそれほど難しいというのだ！？"
 quix_murder_ongoing.3301.desc:0 "あなたは苦心して密かに共謀者たちを集め、[target.GetTitledFirstName]をいかに除くかを話し合った。ところが一晩議論しても結論は出ず、皆はかえって以前よりためらうようになってしまった。"
 quix_murder_ongoing.3301.t:0 "$murder_event_title$ 議して決せず"
 quix_seduce_outcome.2030.desc:0 "あなたと[target.GetTitledFirstName]の互いの思いはすでに明らかで、これ以上探り合っても無駄である。あなたの腹心が二人のために人目につかぬ場所を用意した。\n\nあなたが想いを告げようとしたその時、[target.GetFirstName]は指をあなたの唇に当てて制した。それからの逢瀬は熱く率直で、もはや何の約束も要らなかった。"
 quix_seduce_outcome.2302.desc:0 "遠い道のりがずっとあなたと[target.GetTitledFirstName]の間を隔てていたため、[target.GetSheHe]は参詣を口実にひそかにやって来て、目立たぬ使用人部屋に仮住まいした。\n\n二人は夜通し語り合ったが、どちらも本心を口にはしなかった。しかしそれぞれの部屋に戻った後、[target.GetFirstName]はそっとあなたの寝床へやって来た。"
 quix_seduce_outcome.3030.desc:0 "あなたと[owner.GetTitledFirstName]の互いの思いはすでに明らかで、これ以上探り合っても無駄である。信頼できる腹心が二人のために人目につかぬ場所を用意した。\n\n[owner.GetSheHe|U]が想いを告げようとしたその時、あなたは手ぶりで[owner.GetHerHis]を制した。それからの逢瀬は熱く率直で、もはや何の約束も要らなかった。"
 quix_seduce_outcome.3302.desc:0 "[owner.GetTitledFirstName]がとうにあなたを慕っていることを知っていたあなたは、ひそかに参詣を口実にして[owner.GetHerHis]の屋敷へ赴き、目立たぬ使用人部屋に身を寄せた。\n\n二人は夜半まで語り合ったが、どちらも本心を口にはしなかった。それぞれの部屋に戻った後、あなたは考えを改め、そっと[owner.GetFirstName]の寝床へ向かった。"
