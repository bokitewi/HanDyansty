 sworn_brotherhood_ferocity_path_tt:0 "武勇をもって義を結べば、我らは戦力と揺るがぬ志を得るであろう。この道は張飛の武勇に倣うものである。"
 sworn_brotherhood_ferocity_strengthened_tt:0 "我らの熱き血の義は、歳月の鍛錬の中でその尊さを示した。"
 sworn_brotherhood_humble_refusal_tt:0 "我らは謙辞する：この義にさらなる儀礼は要らず、褒賞も要らない。"
 sworn_brotherhood_loyalty_path_tt:0 "忠義をもって契りを結べば、我らは軍中の威信を得て、誓約はより固くなるであろう。この道は関羽の忠義に倣うものである。"
 sworn_brotherhood_loyalty_strengthened_tt:0 "我らの忠義の盟は試練を経て、以前よりもさらに堅固となった。"
 sworn_brotherhood_righteous_path_tt:0 "仁義をもって義を結べば、我らはより多くの威信を得て、さらに正しくある機会を得るであろう。この道は劉備の遺風を受け継ぐものである。"
 sworn_brotherhood_simple_path_tt:0 "素朴で誠実な義兄弟の契りを立て、いささかの儀礼の栄誉を得る。"
 sworn_brotherhood_tested_tt:0 "我らの義兄弟の盟は歳月の試練に耐え、それゆえいっそう固くなった。"
 uuii_claim_mandate_blocked_by_legitimate_hegemon_tt:0 "正統な天子が帝位にある限り、天命を宣言したり奪ったりすることはできない。"
 uuii_dynastic_cycle.0001.a:0 "天下の大勢は、これより変わる。"
 uuii_dynastic_cycle.0001.desc.high_authority_1:0 "天子の正統の威は極盛に達し、覇業は存続する。しかし一段階の皇権では諸侯を御しきれず、すべての直属封臣が独立を宣言した。そのうち以前覇主に従っていた者は、天朝の朝貢国となる。この時、誰も天命を宣言することも奪うこともできない。"
 uuii_dynastic_cycle.0001.desc.high_authority_2:0 "天子の正統は極盛に達し、覇業は存続する。二段階の支配権により、京畿の法定管轄区内の封臣は引き続き臣従し、その他の直属封臣はそれぞれ独立した。そのうちかつて天子を推戴し、その権威を守ろうとした者は、天朝の朝貢国となる。この時、誰も天命を宣言することも奪うこともできない。"
 uuii_dynastic_cycle.0001.desc.high_authority_3:0 "天子の正統は極盛に達し、覇業は存続する。三段階の支配権により、京畿の法定王国内の封臣は引き続き臣従し、その他の直属封臣はそれぞれ独立した。そのうちかつて天子を推戴し、その権威を守ろうとした者は、天朝の朝貢国となる。この時、誰も天命を宣言することも奪うこともできない。"
 uuii_dynastic_cycle.0001.desc.high_authority_4:0 "天子の正統は極盛に達し、覇業は存続する。四段階の皇権により、京畿の法定帝国内の封臣は引き続き臣従し、その他の直属封臣はそれぞれ独立した。そのうちかつて天子を推戴し、その権威を守ろうとした者は、天朝の朝貢国となる。この時、誰も天命を宣言することも奪うこともできない。"
 uuii_dynastic_cycle.0001.desc.low_authority_1:0 "天子の正統は足りず、覇主の号は王朝の傾きとともに去った。しかし天子は退位を強いられず、直属の称号と通常の称号を保持する。一段階の支配権の下では、すべての直属封臣が独立を宣言し、天命は再び天下の争奪に開かれる。"
 uuii_dynastic_cycle.0001.desc.low_authority_2:0 "天子の正統は足りず、覇主の号は王朝の傾きとともに去った。しかし天子は退位を強いられず、直属の称号と通常の称号を保持する。二段階の支配権により、京畿の法定公領内の封臣は引き続き服従し、その他の直属封臣はそれぞれ独立し、天下は再び天命の争いに開かれる。"
 uuii_dynastic_cycle.0001.desc.low_authority_3:0 "天子の正統は足りず、覇主の号は王朝の傾きとともに去った。しかし天子は退位を強いられず、直属の称号と通常の称号を保持する。三段階の支配権により、京畿の法定王国内の封臣は引き続き服従し、その他の直属封臣はそれぞれ独立し、天下は再び天命の争いに開かれる。"
 uuii_dynastic_cycle.0001.desc.low_authority_4:0 "天子の正統は足りず、覇主の号は王朝の傾きとともに去った。しかし天子は退位を強いられず、直属の称号と通常の称号を保持する。四段階の支配権により、京畿の法定帝国内の封臣は引き続き服従し、その他の直属封臣はそれぞれ独立し、天下は再び天命の争いに開かれる。"
 uuii_dynastic_cycle.0001.t:0 "群雄割拠し、天下再び分かる"
