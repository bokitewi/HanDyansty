l_japanese:
 HD_LIU_BEI_184_STORY_STATUS:0 "現在の章：#V 涿郡挙兵#!\nこの物語は中平元年の桃園の誓いと黄巾蜂起の始まりのみを扱う。天下の黄巾の情勢が定まった時点で物語は終わる。"
 HD_LIU_BEI_LIFE_STORY_STATUS:0 "現在の章：#V [Story.MakeScope.Var('hd_liu_bei_life_phase').GetFlagName]#!\n涿郡で義兵を挙げてから西蜀に基業を築くまで、劉備の選択、誓い、征戦は、すべて一筋の個人の歴史となって流れゆく。"
 MUSIC_PLAYER_PLAY_TRACK_TT:0 "クリックして[MusicTrack.GetName]を再生"
 hd_dc_debug.0001.desc:0 "確認する項目を選択する。状態を見てもイベントは進まない。ポイントを調整すると関連する地区が直ちに更新される。\n\n支払い、応答、待機の期間は引き続き通常の手続きで処理される。"
 hd_dc_debug.0001.t:0 "王朝循環デバッグ"
 hd_dc_debug.0002.ready:0 "乱世W：[scope:hd_dc_debug_region.Var('hd_dc_pressure_percent').GetValue|1] / 100\n盛世H：[scope:hd_dc_debug_region.Var('hd_dc_prosperity_percent').GetValue|1] / 100\n乱世等級：[scope:hd_dc_debug_region.Var('hd_dc_pressure_band').GetValue|0]\n現在あなたに適用されるイベントF：[SCOPE.GetValue('hd_dc_debug_f')|2]、派閥P：[SCOPE.GetValue('hd_dc_debug_p')|2]、工作の合成倍率：[SCOPE.GetValue('hd_dc_debug_scheme_f')|2]。適用地区外では1となる。疫病Dは郡ごとに決まり、5段階で1/1.05/1.10/1.15/1.20である。\n\n前回のW要求/実際の増分：[scope:hd_dc_debug_region.Var('hd_dc_last_w_requested').GetValue|0] / [scope:hd_dc_debug_region.Var('hd_dc_last_w_actual').GetValue|0]\n前回のH要求/実際の増分：[scope:hd_dc_debug_region.Var('hd_dc_last_h_requested').GetValue|0] / [scope:hd_dc_debug_region.Var('hd_dc_last_h_actual').GetValue|0]\n。以上の増分はすべて内部ポイントで、20ポイントごとに画面上の1ポイントに換算される。"
 hd_dc_debug.0002.t:0 "現在の王朝循環の状況"
 hd_dc_debug.0002.waiting:0 "王朝循環はすでに始まっているが、W/Hはまだ初期化されていない。毎月の定例の正式考察を待つか、ただちに正式考察と更新を行うことを選べる。"
 hd_dc_debug.0020.desc:0 "年次抽選の待機を飛ばして、正式イベントを手動で発生させる。人物の資格、応答待ちの事柄、履行条件は引き続き有効である。選択できない項目もメニューに残るので、どの条件が欠けているかを確認できる。"
 hd_dc_debug.0030.desc:0 "以下の操作は現在の世界を実際に改変する。該当するシナリオをクリックしたときにのみ実行される。メニューを閉じても、新たに生成された人物、関係、金は自動的には元に戻らない。シナリオの準備が整った後も、イベントメニューから正式に手続きを開始する必要がある。"
 hd_dc_debug.back:0 "デバッグメニューに戻る"
 hd_dc_debug.close:0 "閉じる"
 hd_dc_debug.events:0 "有効なイベントが見つかった。"
 hd_dc_debug.h:0 "盛世Hを調整する"
 hd_dc_debug.minus_1:0 "1ポイント減らす"
 hd_dc_debug.minus_10:0 "10ポイント減らす"
 hd_dc_debug.ord09:0 "ORD-09：親族を身請けする"
 hd_dc_debug.ord09.tt:0 "条件を満たす親族が実際に投獄されており、法的に拘留している者と現在の行動権がそろっている必要がある。応答待ちの通常イベントがある場合は、別に開始することはできない。"
 hd_dc_debug.ord13:0 "ORD-13：公文書と凶報"
 hd_dc_debug.ord13.tt:0 "その地区に成人の君主がおり、乱世の圧力が少なくとも2段階で、統制度が50未満の、適格な直臣が治める郡が必要である。応答待ちの通常イベントがある場合は開けない。"
 hd_dc_debug.ord19:0 "ORD-19：仇の子"
 hd_dc_debug.ord19.tt:0 "旧敵の成人した子が実際に宮廷におり、投獄に使える私的な罪がなく、あなたの個人的な仇でもないことが必要である。限定的な協力の場合は、双方が信頼する保証人がさらに1人必要である。応答待ちの通常イベントがある場合は開始できない。"
 hd_dc_debug.plus_1:0 "1ポイント増やす"
 hd_dc_debug.plus_10:0 "10ポイント増やす"
 hd_dc_debug.points.desc:0 "調整値は画面上のポイントで数え、範囲は0から100である。乱世は20、40、60、80で一段階上がる。\n\nポイントの変動は一括して記録され、更新に影響する。乱世を下げても、すでに失った統制度や開発度は返還されず、時局が直接変わることもない。"
 hd_dc_debug.prepare:0 "テストシナリオを準備する"
 hd_dc_debug.prepare_ord19:0 "ORD-19のために3人のシナリオを準備する"
 hd_dc_debug.prepare_ord19.tt:0 "45歳の父、20歳の若者、40歳の保証人を生成してあなたの宮廷に入れる。直ちに父とは宿敵となり、若者は独自の私的関係と罪責を保持する。あなた、若者、保証人の間に必要な4つの関係にはそれぞれ5年の期間と好感度+100が加えられ、さらにあなたに金300が与えられる。各プレイヤーキャラクターにつき一度だけ準備され、誰かの代わりに提案を自動で承諾することはない。"
 hd_dc_debug.refresh:0 "正式な考察と更新を行う。"
 hd_dc_debug.refresh.tt:0 "正式考察の手順に従い、地区の情勢、危機の影響、イベントプール、未決事項を更新する。これにより情勢は変わるが、経過した年月が水増しされることはない。"
 hd_dc_debug.set_0:0 "0に設定"
 hd_dc_debug.set_100:0 "100に設定"
 hd_dc_debug.set_20:0 "20に設定"
 hd_dc_debug.set_40:0 "40に設定"
 hd_dc_debug.set_60:0 "60に設定"
 hd_dc_debug.set_80:0 "80に設定"
 hd_dc_debug.status:0 "現在の状況を確認する"
 hd_dc_debug.w:0 "乱世Wを調整する"
 hd_dc_debug_decision:0 "王朝循環デバッグ"
 hd_dc_debug_decision_confirm:0 "デバッグメニューを開く"
 hd_dc_debug_decision_desc:0 "王朝循環の現在の状態を確認し、乱世と盛世を調整し、イベントの進行を点検する。この項目はデバッグモードでのみ表示される。"
 hd_dc_debug_decision_tooltip:0 "王朝循環デバッグメニューを開く"
 hd_dc_debug_rival_reason:0 "[TARGET_CHARACTER.GetShortUIName]と[CHARACTER.GetShortUIName]はデバッグシナリオの設定により宿敵となった"
 hd_dc_debug_trust_opinion:0 "デバッグシナリオ：相互信頼"
 hd_dc_extra_faction_created:0 "新たに設立された派閥を読み込んだ。"
 hd_dc_extra_faction_creation_failed:0 "タイプは選ばれたが、設立前の資格再審査に通らなかったか、設立結果の読み取りに失敗した。今年は再抽選しない。"
 hd_dc_extra_faction_low_w:0 "Wが20未満のため、機会は増えなかった。"
 hd_dc_extra_faction_missed:0 "確率抽選に外れた"
 hd_dc_extra_faction_no_type:0 "勃興の機会はあるが、設立可能な有効タイプがない。"
 hd_dc_faction_pulse_debug.actor:0 "\n実際の発起者：[scope:hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_actor').Char.GetShortUIName]"
 hd_dc_faction_pulse_debug.check:0 "この政権に対して今年度の正式考察を行う。"
 hd_dc_faction_pulse_debug.check.tt:0 "この主称号の今年1回分の考察機会を消費する。失敗した場合は再抽選できない。成功すると正当な派閥が設立され、その後は元の手順に従って敵対を引き起こせる。このページを見るだけでは派閥は設立されない。"
 hd_dc_faction_pulse_debug.claimant:0 "\n真の継承権主張者：[scope:hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_claimant').Char.GetShortUIName]\n争われる称号：[scope:hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_claimed_title').Title.GetName]"
 hd_dc_faction_pulse_debug.county:0 "\n実際の発起郡：[scope:hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_county').Title.GetName]"
 hd_dc_faction_pulse_debug.desc:0 "原版の自動設立は維持される。Wが20に達すると、各政権は毎年10%の基礎機会を追加で得て、Pにより1−(1−p₀)^Pで換算される。成功すると、その時点で法的に利用可能なタイプから派閥を1つ選び、最大1つまで設立する。発起者はAIでなければならず、郡単位の蜂起には厳密な郡単位の資格が適用される。同タイプの既存派閥は重複加速を防ぐため数えない。\n\n擁立系の派閥には確定した請求者と称号が必要である。日本の派閥を禁止する現行の条件は引き続き有効であり、農民派閥の拡大は原版の既存の反乱拡大手順を維持する。この機会は原版の最終的な設立確率に取って代わるものではなく、直接反乱や宣戦を起こすこともない。"
 hd_dc_faction_pulse_debug.low_w:0 "\n現在Wが20未満のため、今年の考察で派閥の機会は増えない。"
 hd_dc_faction_pulse_debug.no_record:0 "\nこの主称号にはまだ年次考察の記録がない。"
 hd_dc_faction_pulse_debug.no_title:0 "\n実行不可：現在の人物は主称号を持っていない。"
 hd_dc_faction_pulse_debug.outside:0 "\n実行不可：現在の人物は王朝循環が関わる地区内にいない。"
 hd_dc_faction_pulse_debug.record:0 "\n 政権：[scope:hd_dc_debug_pulse_realm.GetName]\n 前回考察の年：[scope:hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_year').GetValue|0]\n 実際の抽選確率：[scope:hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_chance').GetValue|2]% \n 結果：[SCOPE.GetFlagName('hd_dc_debug_pulse_result')]"
 hd_dc_faction_pulse_debug.title:0 "追加派閥の年次考察"
 hd_dc_faction_pulse_debug.type:0 "\n派閥タイプフラグ：[scope:hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_type').GetFlagKey]"
 hd_dc_faction_pulse_debug.used:0 "\n 今年の考察はすでに使用済みである。君主の交代、このページの再表示、Wの調整のいずれによっても、同じ主称号の今年の機会は回復しない。"
 hd_dc_ord.0009.b.tt:0 "乱世+1。囚われた者の存命の近親により、あなたの影響力が15減少する。確かに強硬論を唱える側近がいれば、その支持によりあなたの影響力が5年間10増加する。捕虜は元の捕獲者が引き続き監視し、この選択肢で死ぬことはない。"
 hd_dc_ord.0013.a.tt:0 "私財から30金を支出して書記や行政事務に充て、現在の評議員が原版の内政の仕組みに従って実際に職務を担えるようにする。任務確立後：ストレス−15、同盟者からの好感度+15、請願を引き延ばした封臣からの好感度−10。5年間持続し、危機の際も変わらない。傲慢な者はさらに基礎ストレス+20を受け、ストレス倍率の修正も受ける。これにより、その評議員の現在の評議会任務が変更される。任務が失敗した場合、費やした金は返還されるが、ストレスは減らない。"
 hd_dc_ord.0019.a.tt:0 "乱世−1。客人からあなたへの好感度+20。父の代の宿敵に復讐を望む側近がいて、その者が実際に宿敵である場合、その側近からあなたへの好感度が5年間−15。あなたと父の代の宿敵との間の本当の怨恨は維持される。客人に免責、称号、政治権力を与えてはならない。"
 hd_dc_ord.0019.b.tt:0 "乱世+2。あなたが冷遇したため、客人の威信−30。その父と旧怨のある側近が報復した場合、その側近からあなたへの威信が5年間+15。拘留する法的根拠がないため、あなたは客人を投獄、処刑、称号剥奪することはなく、客人が自動的に宿敵になることもない。"
 hd_dc_ord.0113.a.tt:0 "相手の私信を自ら読み、その憂いを整理して、良き言葉で返書する：相手のストレス−20、地区危機−1、あなたから相手への好感度が5年間+20。これにより統治権が移譲されることはない。"
 hd_dc_par.0001.c.tt:0 "現在の策の確定した決断を記録する。争議+10。両派の指導者はあなたの叱責によりそれぞれ−10の罰を受ける。府庫を保全する策に署名して支持した者は、あなたがその策を残したため、あなたへの好感度がさらに+10。この節の終了時に税率と統治ポイントは増えない。"
 hd_dc_par.1001.c.tt:0 "今回の政策論争には加わらない。この件で朋党の争いの危機は起こらず、50年のクールダウンも課されず、拒否がいずれかの側の支持とみなされることもない。"
 hd_dc_par.1101.a.tt:0 "この件は決着し、百金は支払い済みである。減税の議は直ちに発効する：税収−10%、開発度の成長速度+25%、民望+20、期間12か月。統治ポイントは期間満了時に確定する。この支払い済みの証書で追加の費用は取られず、ポイントも調整されない。"
 hd_dc_par.1202.a.tt:0 "この議は試行されておらず、統治ポイントにも数えられない。この応答により支払い、補償、返金が新たに生じることはない。支払い済みの額と未決済の差額はいずれも影響を受けない。"
 hd_dc_roy.0001.a.tt:0 "危機の中で定めた旧制を復し、近座の者への優遇を停止する。対立−5、統治+10。旧制を支持する派閥からあなたへの好感度+10、近座を求めた者からあなたへの好感度−10。この効果は5年間持続する。"
 hd_dc_roy.0001.c.tt:0 "現在の名簿を照合し、双方の争いを退ける。対立+10、わずかな威信を得る。争う双方からあなたへの好感度がそれぞれ−15、強力な非宗室の封臣からあなたへの好感度+10、宗室協力の好感度−5、5年間持続。"
 hd_dc_support.0008.a.tt:0 "資格を再確認した後、書状が指す真の継承権主張者の派閥に必ず加わる。約束の私財は成功後にのみ支払われる。動員の報奨は1人につき1回の危機で最大1回まで：候補者として初めて派閥加入に成功すると、本人の動員+15。候補者からあなたへの好感度+25、現職者からの好感度−20、他の候補者からの好感度−10、5年間持続。拒否の抽選制限は別途設けず、10年間脱退できないという禁止もない。"
 hd_dc_support.0008.c.tt:0 "この勧誘をはっきり拒絶する：候補者の動員値−5。現職者からあなたへの威信+100、候補者からあなたへの威信−20、この効果は5年間持続する。2人は2年間再び招かれず、罰も受けず、派閥への所属も増えない。"
 hd_dc_theft_pulse_debug.actor:0 "\n\n 考察対象の人物：[scope:hd_dc_theft_debug_actor.GetName]。"
 hd_dc_theft_pulse_debug.check:0 "この人物に対して今年度の正式考察を行う。"
 hd_dc_theft_pulse_debug.check_tt:0 "正式な年次考課を開始する。この人物の今年のロック、確かな候補条件、原版の5年クールダウンと工作上限は維持される。今年すでに考課された人物は再抽選できない。無効化されている関門は解除されない。"
 hd_dc_theft_pulse_debug.gates:0 "#warning 現在のDakuoは依然として原版の4つの無効化関門に阻まれている：策略許可、有効、そして相互作用の is_shown と can_send。#!\nこのページは無効化関門を解除せず、過去のスロット崩壊が修正されたことを証明するものでもない。閲覧のみの進入では年次考課は行われない。"
 hd_dc_theft_pulse_debug.native_gate_failed:0 "\n 考課結果：生業の候補者はいるが、原版の工作発動判定に失敗した。既存の無効化関門は引き続き有効である。この結果ではクールダウンと上限の判定も飛ばされた。"
 hd_dc_theft_pulse_debug.native_start_failed:0 "\n考課結果：抽選後、原版の呼び出しは新しい工作を返さなかった。"
 hd_dc_theft_pulse_debug.no_actor:0 "地区内に\n\n今年の正式な盗賊記録の条件を満たすAI人物はいない。"
 hd_dc_theft_pulse_debug.no_business_candidate:0 "\n考課結果：この職の候補資格を満たす者がいない。確率計算と抽選は行われなかった。"
 hd_dc_theft_pulse_debug.no_record:0 "\n現在、閲覧できる年次考課記録はない。"
 hd_dc_theft_pulse_debug.no_scheme:0 "\n 工作記録：現在、現存する工作の参照はない。これをもって過去に成功したと推断しないこと。"
 hd_dc_theft_pulse_debug.other:0 "閲覧のみで別の適格な人物を確認する"
 hd_dc_theft_pulse_debug.probability:0 "\n実際に選ばれた対象：[scope:hd_dc_theft_debug_actor.MakeScope.Var('hd_dc_theft_pulse_target').Char.GetName]。\n基礎確率：[scope:hd_dc_theft_debug_actor.MakeScope.Var('hd_dc_theft_pulse_p0').GetValue|3]%。調整後の実際の抽選確率：[scope:hd_dc_theft_debug_actor.MakeScope.Var('hd_dc_theft_pulse_probability').GetValue|3]%。"
 hd_dc_theft_pulse_debug.probability_failed:0 "\n考課結果：有効な対象は存在するが、確率抽選に外れた。"
 hd_dc_theft_pulse_debug.refresh:0 "現在の人物のみ更新する"
 hd_dc_theft_pulse_debug.scheme_exists:0 "\n 工作記録：記録された工作は現在存在している。"
 hd_dc_theft_pulse_debug.started:0 "\n 直近の考課結果：原版の発動により工作が生成された。工作がまだ存在するかどうかは下記を参照。"
 hd_dc_theft_pulse_debug.title:0 "盗賊の年次考課"
 hd_dc_theft_pulse_debug.year:0 "\n前回考課の年：[scope:hd_dc_theft_debug_actor.MakeScope.Var('hd_dc_theft_pulse_year').GetValue|0]。"
 hd_fengying.0011.alt_desc:0 "天子を迎える好機は訪れたが、あなたはまだ独立した領土を持つ君主ではなく、朝廷を自らの治所に移すことはできない。助けるか、遠くから見守るか、他者を阻むか――それが今のあなたに現実的に取りうる選択である。"
 hd_fengying.0011.desc:0 "天子はすでに有力な後ろ盾を失い、一方で河北の兵馬は精鋭で、糧秣も十分である。天子を迎え奉り朝廷を支えれば、あなたは群雄を圧倒できよう。しかし朝廷の公卿や宗室は、あなたの軍政の下で最も扱いにくい者たちとなるだろう。曹操もまた、この時を待っている。"
 hd_fengying.0011.t:0 "天子を迎え帰すべきか"
 hd_fengying_yuan_aid:0 "車馬と輜重を出し、いささか援助する。"
 hd_fengying_yuan_hesitate:0 "この件は絡み合う事情が多い。しばし様子を見よう。"
 hd_fengying_yuan_obstruct:0 "その道を断ち、曹操に事を成させぬ。"
 hd_fengying_yuan_receive:0 "天子を河北へ護送する。"
 hd_huangjin.3.reward_4000:0 "青州兵四千を得る。"
 hd_huangjin.3.reward_8000:0 "青州兵八千を得る。"
 hd_huangjin.3.reward_full:0 "三度の考課をすべて通過！青州兵二万二千を得る（考課ごとに四千、三度すべて通過でさらに一万）。直轄の諸郡の開発度が二十年間30%増加する。"
 hd_lb22_appoint_guan_yu_jingzhou:0 "関羽を荊州の主君に任命する。"
 hd_lb22_keep_jingzhou_arrangement:0 "現行の取り決めを維持する。"
 hd_lb24_align_cao:0 "使者を遣わして曹氏と連絡し、いささかの利を求める。"
 hd_lb24_attack_jingzhou:0 "荊州の手薄に乗じて、これを奪う。"
 hd_lb24_await_sun_decision:0 "江東の選択が、我が軍の退路を決めるであろう。"
 hd_lb24_keep_alliance:0 "盟約を破らず、引き続き友好を守る。"
 hd_lb24_wait:0 "しばし北方の情勢を見守る。"
 hd_lb_bequest_decline_tt:0 "称号は移譲されず、陶謙も殺されない。この譲地の機会はこれで立ち消えとなる。"
 hd_lb_no_effect_tt:0 "盟約、戦争、称号、陣営の変化は生じない。この招きが再び来ることはない。"
 hd_lb_zhao_friend_tt:0 "劉備と趙雲は友人となる。趙雲はしばらく公孫瓚の陣営に留まる。"
 hd_lb_zhao_join_tt:0 "趙雲は主も領地も持たぬ身で劉備の門下に加わる。既存の封地は決して没収されない。"
 hd_liu_bei_late.2200.desc:0 "益州のことは定まった。あなたは荊州を、独りで一方を担える至高の主に託さねばならない。関羽はこの任に必要な威信、経歴、忠誠を兼ね備えているが、彼に任せれば、荊・益両州の間の権勢の構図が変わることになる。"
 hd_liu_bei_late.2200.t:0 "荊州を守る"
 hd_liu_bei_late.2400.desc:0 "関羽はすでに荊州から北上した。江東、曹氏、そして留守を預かる諸将は、この防衛線がどれほどの圧力に耐えられるかを推し量っている。"
 hd_liu_bei_late.2400.t:0 "荊州の北伐"
 hd_liu_bei_late.2410.alt_desc:0 "関羽の北伐は江東の選択の段に至ったが、現在の君臣関係、盟約、荊州の帰属のため、今は直接攻め取ることはできない。待つか、盟を守るか、曹氏と結ぶかによって、この段階を締めくくることはできる。"
 hd_liu_bei_late.2410.desc:0 "関羽の主力が北進し、荊州の後方に隙が生じた。荊州を奪えば上流から江東への脅威を除けるが、そうすれば孫劉の同盟は完全に壊れるであろう。"
 hd_liu_bei_late.2410.t:0 "荊州の隙"
 hd_liu_bei_late.2491.desc:0 "戦の最中、荊州はその主を替えた。関羽の運命は、なお戦場、捕縛、そして人の生死によって定まる。"
 hd_liu_bei_late.2491.t:0 "荊州、主を替える"
 hd_liu_bei_late.2492.desc:0 "曹操の軍は戦の中で荊州を守り抜き、歴史の流れを書き換えた。"
 hd_liu_bei_late.2492.t:0 "荊州保全"
 hd_liu_bei_late.2500.alt_desc:0 "関羽はすでに没したが、復讐の議はなお残る。しかし今の君臣の分、領地、盟約、荊州の帰属のいずれも、名分の正しい夷陵の戦いを起こすには足りない。それでもなお、和解、荊州返還の要求、復讐の延期を選ぶことができる。"
 hd_liu_bei_late.2500.desc:0 "関羽はすでに死し、荊州は孫氏の手に落ちた。復讐、同盟、各派の存続が互いに牽制し合う。出兵すれば、糧道、山地、連営、暑熱、そして呉軍の主将が、戦局に確かな影響を及ぼすであろう。"
 hd_liu_bei_late.2500.t:0 "討呉の議"
 hd_liu_bei_late.2510.desc:0 "劉備は使者を遣わして荊州の返還を求めてきた。これに応じれば大戦は避けられるが、江東の上流の守りはそれによって弱まる。"
 hd_liu_bei_late.2510.t:0 "荊州返還の要求"
 hd_liu_bei_late.2590.desc:0 "劉備の軍は戦場で敗れた。長い糧道、山地の険、連営の禍が、ついに大敗を招いた。"
 hd_liu_bei_late.2590.t:0 "夷陵の敗戦"
 hd_liu_bei_late.2591.desc:0 "劉備の軍は戦場で勝利した。荊州をめぐる争いは、正式な戦争目標に従って決着する。"
 hd_liu_bei_late.2591.t:0 "討呉の勝利"
 hd_liu_bei_phase_jingzhou:0 "荊州の喪失"
 hd_liu_bei_phase_yiling:0 "夷陵の争い"
 hd_liu_bei_phase_yizhou:0 "西川に基業を立てる"
