 hd_yiling_attack_wu:0 "兵を挙げて呉を伐ち、関羽の仇を討つ。"
 hd_yiling_delay_revenge:0 "復讐はしばし控え、軍を整えて時を待つ。"
 hd_yiling_demand_jingzhou:0 "まず使者を遣わして荊州の返還を求める。"
 hd_yiling_keep_alliance:0 "遠くからその策に応じ、旧盟を修復する。"
