l_japanese:
 hdpc.9000.t:0 "人物数調整：統計報告"
 hdpc.9000.desc:0 "#bold 今回の調査#!\n生存者総数：[GetGlobalVariable('hdpc_living').GetValue|0]\nうちキャラクタープール人数：[GetGlobalVariable('hdpc_pooled').GetValue|0]\n統治者数：[GetGlobalVariable('hdpc_rulers').GetValue|0]\n\n#bold 直近の年次整理#!\n完了回数：[GetGlobalVariable('hdpc_cycles').GetValue|0]\n年間死亡上限：[GetGlobalVariable('hdpc_death_budget').GetValue|0]\n実際の除去数：[GetGlobalVariable('hdpc_killed_last').GetValue|0]\nうち放浪人物：[GetGlobalVariable('hdpc_pool_killed_last').GetValue|0]\nうち遊牧・部族の遊休廷臣：[GetGlobalVariable('hdpc_court_killed_last').GetValue|0]\n死亡処理の失敗：[GetGlobalVariable('hdpc_failed_last').GetValue|0]\n検査した宮廷：[GetGlobalVariable('hdpc_courts_last').GetValue|0]\n選出された候補：[GetGlobalVariable('hdpc_candidates_last').GetValue|0]\n\n整理状態：[GetGlobalVariable('hdpc_active').GetValue|0]（0停止、1有効）\n一時停止フラグ：[GetGlobalVariable('hdpc_disabled').GetValue|0]（0稼働、1一時停止）\n\n生存者数が10,000を超えると年次整理が有効になり、8,000まで下がると停止する。11,000を超えると年間上限は300から600に引き上げられる。まずキャラクタープール内の遊休中の低出自人物を処理し、次に遊牧・部族の宮廷の遊休中の低出自廷臣を処理する。30～49歳の放浪人物は毎年10%、50歳以上は25%の追加死亡確率を持つ。上記2種の宮廷では、それぞれ15%と30%となる。確率は年間人数上限、人口停止ライン、宮廷の保留人数によって制限される。歴史上の人物、プレイヤーとその近親、統治者、後継者、役職に就いている人物などは保護される。この報告は調査結果を更新するのみで、整理は実行しない。"
 hdpc.9000.a:0 "閉じる"
