 HuangDi_miaoshi.011_d:0 "礼官はさらに一通の文書を差し出した。今度議するのは身後の諡である。候補の字と字義が並べて記されており、あなたはそれを目で追ううちに、短い一字一字の背後に、それぞれ異なる言い分が控えているように感じた。\n\n功業を重んずる者もいれば、哀敬をより顧みる者もいて、先の議論ですでに多くが語られた。あなたは彼らに再び争わせることはせず、ただ先帝の記録を手元に置いて、目の前の名目を改めて見た。\n\n殿中は静かに裁定を待っている。どれを選ぼうとも、今後の礼文はそれをもって呼ぶことになる。今はまず、あなたがそれを口にするのだ。"
