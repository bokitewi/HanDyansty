l_japanese:
 Color_EHuang:0 "#color:{0.745,0.541,0.184}; #bold "
 HouGong_ShiHao.021_desc:0 "あなたは礼官に命じて候補の諡字をすべて下げさせた。案上には一枚の白紙の冊頁だけが残り、かえって先ほどのどの候補よりも筆を下ろしがたく感じられる。\n\n先帝の一生について語るべきことはまだ多いが、諡号に書き込めるのはわずか一、二字にすぎない。あなたは筆を手にし、心中に定めた字を一度黙して唱え、わずかなためらいがゆっくりと落ち着くのを待った。\n\n#weak 以下に定めた諡号を書き記す。#!"
 HouGong_ShiHao.021_title:0 "自ら尊諡を定める"
 HuangDi_miaoshi.001.a:0 "先帝は鴻業を肇造された。開国の号を尊ぶべきである。"
 HuangDi_miaoshi.001.b:0 "先帝は宗社を再造された。中興の号を尊ぶべきである。"
 HuangDi_miaoshi.001.c:0 "先帝は天下を治め平らげられた。明君の号を尊ぶべきである。"
 HuangDi_miaoshi.001.d:0 "先帝は文を守り体を継がれた。守成の号を尊ぶべきである。"
 HuangDi_miaoshi.001.e:0 "先帝には失徳もあったが、それでも廟祀は存続させるべきである。"
 HuangDi_miaoshi.001.e1:0 "やはり廟号を追立し、その祀りを存続させる。"
 HuangDi_miaoshi.001.event_title:0 "廟号を議定する"
 HuangDi_miaoshi.001.j:0 "廟号は朕が自ら定める。"
 HuangDi_miaoshi.001_tt:0 "先帝は[GetTrait('SanGong_HunJun').GetName( GetNullCharacter )][trait|E]を持つ"
 HuangDi_miaoshi.003.a:0 "区夏を肇造し、始めて天命を受く、太と曰う。先帝の廟号は$Color_EHuang$ #bold 太祖"
 HuangDi_miaoshi.003.b:0 "徳は万方を覆い、首めて皇基を啓く、高と曰う。先帝の廟号は$Color_EHuang$ #bold 高祖"
 HuangDi_miaoshi.003_d:0 "開国の業についての議が終わると、礼官が廟号の候補を捧げ持ってきた。先ほど読み上げられた旧事がまだ耳に残っているのに、目の前には厳かな数文字が残るばかりである。\n\n後世の人々は先帝の一つ一つの軍令や、一度一度の艱難を覚えてはいないかもしれない。だが祭祀や文書の中で、今日定める呼び名を幾度となく唱えることになる。案の傍らで誰かがもう一度読み上げましょうかと小声で尋ねたが、あなたは首を振り、自ら諸号を一つずつ確かめた。\n\nまず廟号を定め、次に諡号を議する。礼官はすでに筆を用意し、あなたがその中から一つを指し示すのを待つばかりである。"
 HuangDi_miaoshi.003_t:0 "先帝の廟号を追尊する"
 HuangDi_miaoshi.004.a:0 "国を復し再造し、重ねて社稷を安んず、世と曰う。先帝の廟号は$Color_EHuang$ #bold 世祖"
 HuangDi_miaoshi.004.b:0 "危うきを扶け傾きを定め、中興を光啓す、中と曰う。先帝の廟号は$Color_EHuang$ #bold 中祖"
 HuangDi_miaoshi.004.c:0 "山河を光復し、絶えたるを継ぎ邦を興す、代と曰う。先帝の廟号は$Color_EHuang$ #bold 代祖"
 HuangDi_miaoshi.004.d:0 "統を継ぎ基を開き、宗祧を光復す、高と曰う。先帝の廟号は$Color_EHuang$ #bold 高祖"
 HuangDi_miaoshi.004.e:0 "乱を戡め難を定め、ついに中興を成す、成と曰う。先帝の廟号は$Color_EHuang$ #bold 成祖"
 HuangDi_miaoshi.004.f:0 "禍乱を戡平し、世を安んじ宗を保つ、烈と曰う。先帝の廟号は$Color_EHuang$ #bold 烈祖"
 HuangDi_miaoshi.004_d:0 "中興の功が議定されると、礼官は廟号の候補を御前に差し出した。文書は新しいものに替わったが、国統がほとんど断絶しかけたかつての出来事が、なお殿中をひときわ静まり返らせていた。\n\nあなたは候補を一つずつ読んでいった。威厳ある字もあれば、穏やかな字もある。先帝の身後に置かれれば、いずれももはや尋常の辞句ではない。なおも理由を述べ立てようとする者がいたが、あなたは手を挙げて少し待たせた――前置きはもう十分に聞いた。この最後の一点だけは、結局あなた自身が定めねばならない。"
 HuangDi_miaoshi.004_t:0 "先帝の廟号を議定する"
 HuangDi_miaoshi.005.a:0 "功徳これに過ぐるなく、その業煌々たり、太と曰う。先帝の廟号は$Color_EHuang$ #bold 太宗"
 HuangDi_miaoshi.005.e:0 "中興して為すあり、徳高く尊ぶべし、高と曰う。先帝の廟号は$Color_EHuang$ #bold 高宗"
 HuangDi_miaoshi.005.f:0 "中興に功あり、百世遷さず、世と曰う。先帝の廟号は$Color_EHuang$ #bold 世宗"
 HuangDi_miaoshi.005.g:0 "中興に功あり、百世遷さず、代と曰う。先帝の廟号は$Color_EHuang$ #bold 代宗"
 HuangDi_miaoshi.005.h:0 "神器を中興し、宗祚を復興す、中と曰う。先帝の廟号は$Color_EHuang$ #bold 中宗"
 HuangDi_miaoshi.005.i:0 "盛徳巍々として、於穆として已まず、仁と曰う。先帝の廟号は$Color_EHuang$ #bold 仁宗"
 HuangDi_miaoshi.005.k:0 "功は四海に光り、仁は千載に行わる、顕と曰う。先帝の廟号は$Color_EHuang$ #bold 顕宗"
 HuangDi_miaoshi.005.l:0 "乃ち聖乃ち神、益々尭の徳を称す、神と曰う。先帝の廟号は$Color_EHuang$ #bold 神宗"
 HuangDi_miaoshi.005.m:0 "通ぜざるところなく、峻徳統を垂る、聖と曰う。先帝の廟号は$Color_EHuang$ #bold 聖宗"
 HuangDi_miaoshi.005.o:0 "剛徳克く就り、重ねて六合を明らかにす、粛と曰う。先帝の廟号は$Color_EHuang$ #bold 粛宗"
 HuangDi_miaoshi.005.p:0 "至仁至孝にして、善く継ぎ善く述ぶ、孝と曰う。先帝の廟号は$Color_EHuang$ #bold 孝宗"
 HuangDi_miaoshi.005.q:0 "これ天は聡明、これ聖は時に憲る、憲と曰う。先帝の廟号は$Color_EHuang$ #bold 憲宗"
 HuangDi_miaoshi.005.r:0 "聖善あまねく聞こえ、政教広く布く、宣と曰う。先帝の廟号は$Color_EHuang$ #bold 宣宗"
 HuangDi_miaoshi.005.s:0 "功ありて民を安んじ、命を受くること溥く将いなり、烈と曰う。先帝の廟号は$Color_EHuang$ #bold 烈宗"
 HuangDi_miaoshi.005.t:0 "四方を照臨し、徳は神尭に象る、明と曰う。先帝の廟号は$Color_EHuang$ #bold 明宗"
 HuangDi_miaoshi.005.u:0 "功を立て功を成し、奄く四方を有つ、成と曰う。先帝の廟号は$Color_EHuang$ #bold 成宗"
 HuangDi_miaoshi.005.v:0 "安楽にして民を撫し、成康に庶幾し、康と曰う。先帝の廟号は$Color_EHuang$ #bold 康宗"
 HuangDi_miaoshi.005.w:0 "至道至真、玄のまた玄、玄と曰う。先帝の廟号は$Color_EHuang$ #bold 玄宗"
 HuangDi_miaoshi.005.x:0 "治は至道に近く、徳をもって宗と称す、真と曰う。先帝の廟号は$Color_EHuang$ #bold 真宗"
 HuangDi_miaoshi.005.y:0 "禍乱を克定し、刑民克服す、武と曰う。先帝の廟号は$Color_EHuang$ #bold 武宗"
 HuangDi_miaoshi.005_d:0 "礼官は先帝が天下を経略した功業に基づき、廟号の候補を差し出した。読み上げが終わると、殿中には袖のかすかに動く音だけが残った。あなたは文書を引き寄せ、先帝の在世中に朝堂で議論を呼んだ政事の数々を思い起こした。\n\n事を成した人はもういない。だが論じた人々はなおここに立ち、彼のために長く残る呼び名を選ぼうと待っている。あなたは諸号に目を通したが、すぐには決めかねた――一字を替えれば、重きを置く所もそれにつれて変わるのだ。\n\n礼官は急かすこともできず、ただ筆をしっかりと置き直した。誰かがまず、この最後のためらいに区切りをつけねばならない。"
 HuangDi_miaoshi.005_t:0 "先帝の廟号を議定する"
 HuangDi_miaoshi.006.a:0 "経天緯地、慈恵にして民を愛す、文と曰う。先帝の廟号は$Color_EHuang$ #bold 文宗"
 HuangDi_miaoshi.006.b:0 "英異の主、出類抜萃、英と曰う。先帝の廟号は$Color_EHuang$ #bold 英宗"
 HuangDi_miaoshi.006.c:0 "これ睿にして聖を作し、智慮深遠、睿と曰う。先帝の廟号は$Color_EHuang$ #bold 睿宗"
 HuangDi_miaoshi.006.d:0 "尭は人を知るを曰い、世に哲王あり、哲と曰う。先帝の廟号は$Color_EHuang$ #bold 哲宗"
 HuangDi_miaoshi.006.e:0 "墳史は徳を徴し、生安允迪、徳と曰う。先帝の廟号は$Color_EHuang$ #bold 徳宗"
 HuangDi_miaoshi.006.f:0 "徳を崇め本に報い、祖を尊び宗を隆んにす、崇と曰う。先帝の廟号は$Color_EHuang$ #bold 崇宗"
 HuangDi_miaoshi.006.g:0 "徳を布き義を執り、徳容静深、穆と曰う。先帝の廟号は$Color_EHuang$ #bold 穆宗"
 HuangDi_miaoshi.006.h:0 "光大にして功あり、よく前業を紹ぐ、光と曰う。先帝の廟号は$Color_EHuang$ #bold 光宗"
 HuangDi_miaoshi.006.i:0 "義によりて済し、光いに令緒あり、景と曰う。先帝の廟号は$Color_EHuang$ #bold 景宗"
 HuangDi_miaoshi.006.j:0 "為さずして成り、疾からずして速し、順と曰う。先帝の廟号は$Color_EHuang$ #bold 順宗"
 HuangDi_miaoshi.006.k:0 "善く法典に合し、荘敬厳威、敬と曰う。先帝の廟号は$Color_EHuang$ #bold 敬宗"
 HuangDi_miaoshi.006.l:0 "淵衷湛一、寧考安康、寧と曰う。先帝の廟号は$Color_EHuang$ #bold 寧宗"
 HuangDi_miaoshi.006.m:0 "興して大業あり、聖図丕いに振るう、興と曰う。先帝の廟号は$Color_EHuang$ #bold 興宗"
 HuangDi_miaoshi.006.n:0 "道を体し一を得、天縦自然、道と曰う。先帝の廟号は$Color_EHuang$ #bold 道宗"
 HuangDi_miaoshi.006.o:0 "法度明大、言を出して文あり、章と曰う。先帝の廟号は$Color_EHuang$ #bold 章宗"
 HuangDi_miaoshi.006.p:0 "温和聖善、民を愛し質淵、懿と曰う。先帝の廟号は$Color_EHuang$ #bold 懿宗"
 HuangDi_miaoshi.006.q:0 "法度明大、言を出して文あり、章と曰う。先帝の廟号は$Color_EHuang$ #bold 章宗"
 HuangDi_miaoshi.006.r:0 "果敢堅毅、秉性剛断、毅と曰う。先帝の廟号は$Color_EHuang$ #bold 毅宗"
 HuangDi_miaoshi.006.s:0 "寛仁にして衆を得、厚徳にして統を承く、裕と曰う。先帝の廟号は$Color_EHuang$ #bold 裕宗"
 HuangDi_miaoshi.006.t:0 "政平らかに刑粛み、道術を表章す、理と曰う。先帝の廟号は$Color_EHuang$ #bold 理宗"
 HuangDi_miaoshi.006.u:0 "敵に勝ちて志強く、威儀忒わず、荘と曰う。先帝の廟号は$Color_EHuang$ #bold 荘宗"
 HuangDi_miaoshi.006.v:0 "盛明熙和、敬徳光輝、熙と曰う。先帝の廟号は$Color_EHuang$ #bold 熙宗"
 HuangDi_miaoshi.006_d:0 "先帝の守成の在位記録が読み終えられ、礼官は廟号の候補を奉じて、あなたに選定を請うた。文書が手元に届くと、先ほどまでびっしりと並んでいた年月は、今や選ばれるのを待つ数文字だけになっていた。\n\n開国の時のような鮮やかな戦の話はない。それでも日々の政務は一つ一つ途切れることなく今日まで続いてきた。殿中には頌辞をさらに付け加えようとする者もいたが、あなたはそれを止め、自ら候補を順に見ていった。言葉はもう十分に尽くされた。\n\nまず廟号を定めてこそ、宗廟での呼び名が宙に浮いたままにならずに済む。"
 HuangDi_miaoshi.006_t:0 "先帝の廟号を議定する"
 HuangDi_miaoshi.007.a:0 "和気広く敷き、功ありて人を安んず、熹と曰う。先帝の廟号は$Color_EHuang$ #bold 熹宗"
 HuangDi_miaoshi.007.b:0 "質淵にして諫を受け、慈恵にして親を愛す、僖と曰う。先帝の廟号は$Color_EHuang$ #bold 僖宗"
 HuangDi_miaoshi.007.c:0 "博聞多能、恵にして内に徳あり、献と曰う。先帝の廟号は$Color_EHuang$ #bold 献宗"
 HuangDi_miaoshi.007.d:0 "道徳純一、仁を体し民に長たり、元と曰う。先帝の廟号は$Color_EHuang$ #bold 元宗"
 HuangDi_miaoshi.007.e:0 "福慶綿延、善く継ぎ宗を承く、慶と曰う。先帝の廟号は$Color_EHuang$ #bold 慶宗"
 HuangDi_miaoshi.007.f:0 "義を奉じ則に順い、恭倹荘敬、礼と曰う。先帝の廟号は$Color_EHuang$ #bold 礼宗"
 HuangDi_miaoshi.007.g:0 "元徳充美、雅韻昭彰、徽と曰う。先帝の廟号は$Color_EHuang$ #bold 徽宗"
 HuangDi_miaoshi.007.h:0 "容儀恭美、徳を昭らかにして労あり、昭と曰う。先帝の廟号は$Color_EHuang$ #bold 昭宗"
 HuangDi_miaoshi.007.i:0 "民を愛し与うるを好み、柔質にして諫を受く、恵と曰う。先帝の廟号は$Color_EHuang$ #bold 恵宗"
 HuangDi_miaoshi.007.j:0 "強毅にして政を執り、荘をもって下に臨む、威と曰う。先帝の廟号は$Color_EHuang$ #bold 威宗"
 HuangDi_miaoshi.007.k:0 "賢を尊び義を貴び、正徳美容、恭と曰う。先帝の廟号は$Color_EHuang$ #bold 恭宗"
 HuangDi_miaoshi.007.l:0 "和を好み争わず、兆民寧頼す、安と曰う。先帝の廟号は$Color_EHuang$ #bold 安宗"
 HuangDi_miaoshi.007.m:0 "疏遠より位を継ぎ、前業を紹継す、紹と曰う。先帝の廟号は$Color_EHuang$ #bold 紹宗"
 HuangDi_miaoshi.007.n:0 "威儀悉く備わり、事を敬い用を節す、欽と曰う。先帝の廟号は$Color_EHuang$ #bold 欽宗"
 HuangDi_miaoshi.007.o:0 "慮り深く通敏、前過を追悔す、思と曰う。先帝の廟号は$Color_EHuang$ #bold 思宗"
 HuangDi_miaoshi.007.p:0 "進退軌とすべく、従容として常あり、度と曰う。先帝の廟号は$Color_EHuang$ #bold 度宗"
 HuangDi_miaoshi.007.q:0 "礼を守り義を執り、聖修式化、端と曰う。先帝の廟号は$Color_EHuang$ #bold 端宗"
 HuangDi_miaoshi.007.r:0 "克く敬い民に勤め、よく武志を成す、桓と曰う。先帝の廟号は$Color_EHuang$ #bold 桓宗"
 HuangDi_miaoshi.007.s:0 "甲冑に労あり、協賛して成あり、襄と曰う。先帝の廟号は$Color_EHuang$ #bold 襄宗"
 HuangDi_miaoshi.007.t:0 "大緒を統承し、万方を総御す、統と曰う。先帝の廟号は$Color_EHuang$ #bold 統宗"
 HuangDi_miaoshi.007.u:0 "民を安んじ大いに慮り、純行二ならず、定と曰う。先帝の廟号は$Color_EHuang$ #bold 定宗"
 HuangDi_miaoshi.007_d:0 "先帝の過失に話が及ぶと、殿中は先ほどよりもいっそう静まり返った。礼官は祀りを存続させるための廟号の候補を差し出したが、その言葉遣いはことのほか慎重で、どの一字を強く読んでも、別の含みがあると思われかねないかのようであった。\n\nあなたはそれらの名目を見つめ、さらに先の政事の記録にも目をやった。人はすでに去ったが、多くの難事はなお生きている者に残されている。今日一つの呼び名を定めたところで、堂下の者すべてが同じ考えを抱くわけでもない。\n\n礼官はなお控えている。この一字は結局あなたが指し示さねばならず、他人の沈黙があなたに代わって答えてくれることはない。"
 HuangDi_miaoshi.007_t:0 "先帝の廟号を追尊する"
 HuangDi_miaoshi.008.a:0 "これを尊んで祖とする。"
 HuangDi_miaoshi.008.b:0 "これを尊んで宗とする。"
 HuangDi_miaoshi.008.c:0 "前のページに戻る"
 HuangDi_miaoshi.008_d:0 "候補はすべて見終えたが、あなたはなお自ら廟号を定めることに決めた。礼官が原稿を片付け、筆と白紙の冊頁だけを残すと、案前は急にがらんとした。\n\n先ほど不満だったときには、その理由を一つ一つ挙げることができた。だが自ら字を書く段になると、それらの理由はあなたに代わって一つの名を書いてはくれない。あなたは筆をまっすぐに持ち直し、先帝が最も宗廟に残すべき呼び名を改めて考えた。\n\n#weak 以下に定めた廟号を書き記し、祖と称するか宗と称するかを選ぶ。#!"
 HuangDi_miaoshi.008_t:0 "自ら廟号を定める"
 HuangDi_miaoshi.009.a:0 "謹んで礼制に従い、廟号と諡を議定する。"
 HuangDi_miaoshi.009.b:0 "幼主は早くに崩じた。廟号は立てず、諡のみを議する。"
 HuangDi_miaoshi.009.desc.1:0 "大行皇帝はすでに崩御し、廟号と諡を議定する文書があなたの前に届けられた。先帝生前の多くの事はまだ軽重を分ける暇もないのに、礼官はもはやこの逝きし君主をどう呼ぶかを準備せねばならなかった。\n\nあなたはまず先帝の功業と死後の礼制とを分けて述べさせた。親疎にかかわらず、今日定める名号は後世の人々に呼ばれ続けるものであり、今この時の哀しみだけで軽々しく片付けるわけにはいかない。\n\n"
 HuangDi_miaoshi.009.desc.2:0 "先帝には開国の功がある。今日廟号を議するにあたっては、まずこの根本を顧みるべきである。基業は彼が築いたものだが、それにどう名を立てるかは、後を継いだあなたが厳粛に裁定せねばならない。"
 HuangDi_miaoshi.009.desc.3:0 "礼官が先帝の中興の功に言及すると、うつむいていた者たちも目を上げた。一時は存続も危ぶまれた国統は今なお続いている。それを支えた人を宗廟でどう呼ぶべきか、あなたの裁定が待たれている。"
 HuangDi_miaoshi.009.desc.4:0 "先帝が治世を経略した記述の宣読が終わった。生前ならば長く議論の的となったであろう事柄も、今はすべてわずか数文字の中に収めねばならない。"
 HuangDi_miaoshi.009.desc.5:0 "先帝の守成の業はすでに議論し尽くされた。あなたがその在位記録をめくると、日々の政務がびっしりと書き込まれている。だが今日はただ、百世にふさわしい名号を一つ選べばよい。"
 HuangDi_miaoshi.009.desc.6:0 "礼官は先帝の年齢を読み上げるところで声を詰まらせ、それから身後の礼議を述べ続けた。まだ施行されていなかった多くの計画は、今となってはもう答えを待つ必要もない。"
 HuangDi_miaoshi.009.desc.7:0 "先帝の生前の政事には失当が多く、今日の哀しみもそれらの記録を消し去ってはくれない。祀りの存続と褒貶の間でいかに取捨するか、それこそがこの礼議で最も筆を下ろしがたいところである。"
 HuangDi_miaoshi.009.event_title:0 "諡と尊号を議する"
