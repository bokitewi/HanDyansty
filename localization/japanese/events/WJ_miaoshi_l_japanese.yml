 HuangDi_miaoshi.015.y:0 "端方にして曲なきを正と曰い、民を安んじ大いに慮るを定と曰う。尊諡 #Y 【正定】"
 HuangDi_miaoshi.015.z:0 "道徳物に応ずるを英と曰い、聡哲明達を睿と曰う。尊諡 #Y 【英睿】"
 HuangDi_miaoshi.081.a:0 "義を執り善を揚げ、慈行短折なるを懐と曰う。諡は #Y 【懐】"
 HuangDi_miaoshi.081.b:0 "年中にして早夭し、肆行労祀なるを悼と曰う。諡は #Y 【悼】"
 HuangDi_miaoshi.081.c:0 "国にありて難に逢い、民をして折傷せしむるを愍と曰う。諡は #Y 【愍】"
 HuangDi_miaoshi.081.d:0 "国にありて難に逢い、民をして折傷せしむるを閔と曰う。諡は #Y 【閔】"
 HuangDi_miaoshi.081.e:0 "蚤くして孤となり短折し、恭仁にして短折するを哀と曰う。諡は #Y 【哀】"
 HuangDi_miaoshi.081.f:0 "国に尸たるを顕さず、隠払して成らざるを隠と曰う。諡は #Y 【隠】"
 HuangDi_miaoshi.081.g:0 "好んで旧を更改し、軽々しく成法を変ずるを易と曰う。諡は #Y 【易】"
 HuangDi_miaoshi.081.h:0 "愆を思うこと深遠にして、戒慎憂思するを懼と曰う。諡は #Y 【懼】"
 HuangDi_miaoshi.081.i:0 "その国に生まれずして、誉聞遠く達するを声と曰う。諡は #Y 【声】"
 HuangDi_miaoshi.081.j:0 "謀慮成らず、為さんと欲して止むを息と曰う。諡は #Y 【息】"
 HuangDi_miaoshi.081.k:0 "義を述べて克たず、迷いて悌ならざるを丁と曰う。諡は #Y 【丁】"
 HuangDi_miaoshi.081.l:0 "事を挙ぐるに遅く、従容安和なるを舒と曰う。諡は #Y 【舒】"
 HuangDi_miaoshi.081.m:0 "幼少にして短折し、虚を懐き静を守るを沖と曰う。諡は #Y 【沖】"
 HuangDi_miaoshi.081.n:0 "質その文に勝ち、敬して礼に中らざるを野と曰う。諡は #Y 【野】"
 HuangDi_miaoshi.081.o:0 "菲薄にして礼を廃し、倹にして礼に中らざるを倹と曰う。諡は #Y 【倹】"
 HuangDi_miaoshi.081.p:0 "名実爽わず、中正にして邪なきを質と曰う。諡は #Y 【質】"
 HuangDi_miaoshi.081_d:0 "先帝の年齢を読み上げるところで、礼官はわずかに言葉を止めた。あなたが目を落としてその生涯の記録を見ると、案上の紙は、あらかじめ用意された頌辞よりもなお短いことに気づいた。\n\n多くの事は手を付ける暇もないうちに、もはや問うべき人もいなくなった。かつての期待を口にしかけた者もいたが、言葉半ばで呑み込み、代わりにあなたに諡号の候補を見るよう請うた。\n\nあなたはその数文字を一つずつ読んだ。これほど短い歳月にも、身後の呼び名を残さねばならぬ時が来たのだ。"
 HuangDi_miaoshi.081_t:0 "幼主の諡"
 HuangDi_miaoshi.082.a:0 "暴虐にして親しむ者なし、厲と曰う。諡号は$Color_EHuang$ #bold 厲帝"
 HuangDi_miaoshi.082.b:0 "壅遏して通ぜず、幽と曰う。諡号は$Color_EHuang$ #bold 幽帝"
 HuangDi_miaoshi.082.c:0 "礼を去り衆を遠ざく、煬と曰う。諡号は$Color_EHuang$ #bold 煬帝"
 HuangDi_miaoshi.082.d:0 "乱れて損わず、霊と曰う。諡号は$Color_EHuang$ #bold 霊帝"
 HuangDi_miaoshi.082.e:0 "楽しみに耽り政を怠る、荒と曰う。諡号は$Color_EHuang$ #bold 荒帝"
 HuangDi_miaoshi.082.f:0 "威を怙み肆に行う、戻と曰う。諡号は$Color_EHuang$ #bold 戻帝"
 HuangDi_miaoshi.082.g:0 "名実乖違す、繆と曰う。諡号は$Color_EHuang$ #bold 繆帝"
 HuangDi_miaoshi.082.h:0 "政令軽佻なり、躁と曰う。諡号は$Color_EHuang$ #bold 躁帝"
 HuangDi_miaoshi.082.i:0 "欲を縦にし礼を廃す、蕩と曰う。諡号は$Color_EHuang$ #bold 蕩帝"
 HuangDi_miaoshi.082.j:0 "残虐にして肆に殺す、暴と曰う。諡号は$Color_EHuang$ #bold 暴帝"
 HuangDi_miaoshi.082_d:0 "前代の廃帝の褒貶と祀りの存続について、有司はあなたに改めて裁定を請うた。これは一字を選んで諡とするだけのことではなく、例を破って別に廟号を存するか否か、そしてその名分をどこに帰すべきかにも関わる。\n\nあなたは差し出された礼議をよく確かめた。たとえ彼のために祀りを存続させるとしても、本朝の太廟には祔さず、前朝の後裔のみがこれを奉祀する。一つの称号を残すことと、本朝の宗統を継ぐこととは、もとより別の事である。\n\n褒貶は一度定まれば、一時の哀憫によって軽々しく改めることはできない。あなたは礼官に諸議を順に読み上げさせ、この身後の名分をはっきりと定めようとした。"
 HuangDi_miaoshi.082_t:0 "前朝廃帝の諡号を議する"
 HuangDi_miaoshi.092.a:0 "これを諡とする。"
 HuangDi_miaoshi.shturl:0 "典を治めて殺さざるを簡と曰う。諡は $Color_EHuang$ #bold 簡"
 HuangDi_miaoshi_012_d:0 "礼官は議定された尊諡を改めて宣読した。それまでの紛々たる褒貶と追念は、ここに至ってようやく衆口一致の呼び名を得た。\n\n#high [XianDi.GetName]： [XianDi.GetNicknameNoTooltip]皇帝#!\n\nあなたは聞き終えると、自ら謄本にも目を通した。名は変わらずその名であるが、その後ろに添えられた字は、もはや他人が呼ぶほかないものとなった。礼官はあなたの合図を待って文書を収め、残りの礼事を執り行いに向かった。"
 HuangDi_miaoshi_012_t:0 "尊号を議定する"
 HuangDi_miaoshi_014_d:0 "議定された身後の称謂が差し出され、礼官があなたの前で最後にもう一度読み上げた。堂中にもはや異論を唱える者はなく、ただ筆が謄本に落ちるかすかな音だけが響く。\n\n#high [XianDi.GetName]： [XianDi.GetNicknameNoTooltip]#!\n\nあなたは初めから目を通し、文書を返した。議論が尽きなかった時には、あと数言加えさえすれば言い尽くせるような気がしていた。だが名号が本当に定まった今も、殿中にはなお言葉にならない空白が一つ残っている。残りの礼事は、これに従って執り行われる。"
 SG_right_portrait_event:0 "[Character.Custom('WJ_GetUIName')]\n[Character.GetRelationToString( GetPlayer )]"
 SanGong_HunJun_desc:0 "このキャラクターは万機を怠り捨て、暗愚にして政を乱し、ついには禍を宗社にまで及ぼした。"
 SanGong_KaiGuo_desc:0 "このキャラクターは基を開き統を肇め、乱を戡めて鼎を定めた、一代の創業の主である。"
 SanGong_ShouCheng_desc:0 "このキャラクターは体を継ぎ文を守り、成法に従って天下を太平安定に保った。"
 SanGong_XiongZhu_desc:0 "このキャラクターは精励して治を図り、海内は安らかで、世に有道の君と称される。"
 SanGong_YouZhu_desc:0 "このキャラクターは幼くして践祚し、自ら万機を執る間もなく、朝政の多くを輔弼に委ねた。"
 SanGong_Zdy_WangHao_text:0 ""
 SanGong_ZhongXing_desc:0 "このキャラクターは危うきを扶け傾きを定め、宗社を光復し、国祚を再び興した。"
 SanGong_miaohao_01_desc:0 "区夏を肇造し、始めて天命を受く。ゆえに廟号を奉って太祖と曰う。"
 SanGong_miaohao_02_desc:0 "徳は万方を覆い、首めて皇基を啓く。ゆえに廟号を奉って高祖と曰う。"
 SanGong_miaohao_05_desc:0 "功ありて民を安んじ、徳を秉り業に遵う。ゆえに廟号を奉って烈祖と曰う。"
 SanGong_miaohao_09_desc:0 "民を安んじ政を立て、洪業を肇成す。ゆえに廟号を奉って成祖と曰う。"
 SanGong_miaohao_21_desc:0 "社稷を中興し、再び江山を定む。ゆえに廟号を奉って世祖と曰う。"
 SanGong_miaohao_22_desc:0 "社稷を匡輔し、帝業を中興す。ゆえに廟号を奉って中祖と曰う。"
 SanGong_miaohao_23_desc:0 "社稷を中興し、再び江山を定む。ゆえに廟号を奉って代祖と曰う。"
 SanGong_miaohao_27_desc:0 "功徳これに過ぐるなく、その業煌々たり。ゆえに廟号を奉って太宗と曰う。"
 SanGong_miaohao_28_desc:0 "中興して為すあり、徳高く尊ぶべし。ゆえに廟号を奉って高宗と曰う。"
 SanGong_miaohao_29_desc:0 "中興に功あり、百世遷さず。ゆえに廟号を奉って世宗と曰う。"
 SanGong_miaohao_30_desc:0 "中興に功あり、百世遷さず。ゆえに廟号を奉って代宗と曰う。"
 SanGong_miaohao_31_desc:0 "神器を中興し、宗祚を復興す。ゆえに廟号を奉って中宗と曰う。"
 SanGong_miaohao_32_desc:0 "盛徳巍々として、於穆として已まず。ゆえに廟号を奉って仁宗と曰う。"
 SanGong_miaohao_33_desc:0 "功は四海に光り、仁は千載に行わる。ゆえに廟号を奉って顕宗と曰う。"
 SanGong_miaohao_34_desc:0 "乃ち聖乃ち神、益々尭の徳を称す。ゆえに廟号を奉って神宗と曰う。"
 SanGong_miaohao_35_desc:0 "通ぜざるところなく、峻徳統を垂る。ゆえに廟号を奉って聖宗と曰う。"
 SanGong_miaohao_36_desc:0 "剛徳克く就り、重ねて六合を明らかにす。ゆえに廟号を奉って粛宗と曰う。"
 SanGong_miaohao_37_desc:0 "至仁至孝にして、善く継ぎ善く述ぶ。ゆえに廟号を奉って孝宗と曰う。"
 SanGong_miaohao_38_desc:0 "これ天は聡明、これ聖は時に憲る。ゆえに廟号を奉って憲宗と曰う。"
 SanGong_miaohao_39_desc:0 "聖善あまねく聞こえ、政教広く布く。ゆえに廟号を奉って宣宗と曰う。"
 SanGong_miaohao_40_desc:0 "功ありて民を安んじ、命を受くること溥く将いなり。ゆえに廟号を奉って烈宗と曰う。"
 SanGong_miaohao_41_desc:0 "四方を照臨し、徳は神尭に象る。ゆえに廟号を奉って明宗と曰う。"
 SanGong_miaohao_42_desc:0 "功を立て功を成し、奄く四方を有つ。ゆえに廟号を奉って成宗と曰う。"
 SanGong_miaohao_43_desc:0 "安楽にして民を撫し、成康に庶幾す。ゆえに廟号を奉って康宗と曰う。"
 SanGong_miaohao_44_desc:0 "至道至真、玄のまた玄。ゆえに廟号を奉って玄宗と曰う。"
 SanGong_miaohao_45_desc:0 "治は至道に近く、徳をもって宗と称す。ゆえに廟号を奉って真宗と曰う。"
 SanGong_miaohao_46_desc:0 "禍乱を克定し、刑民克服す。ゆえに廟号を奉って武宗と曰う。"
 SanGong_miaohao_47_desc:0 "経天緯地、慈恵にして民を愛す。ゆえに廟号を奉って文宗と曰う。"
 SanGong_miaohao_48_desc:0 "英異の主、出類抜萃。ゆえに廟号を奉って英宗と曰う。"
 SanGong_miaohao_49_desc:0 "これ睿にして聖を作し、智慮深遠。ゆえに廟号を奉って睿宗と曰う。"
 SanGong_miaohao_50_desc:0 "尭は人を知るを曰い、世に哲王あり。ゆえに廟号を奉って哲宗と曰う。"
 SanGong_miaohao_51_desc:0 "墳史は徳を徴し、生安允迪。ゆえに廟号を奉って徳宗と曰う。"
 SanGong_miaohao_52_desc:0 "徳を崇め本に報い、祖を尊び宗を隆んにす。ゆえに廟号を奉って崇宗と曰う。"
 SanGong_miaohao_53_desc:0 "徳を布き義を執り、徳容静深。ゆえに廟号を奉って穆宗と曰う。"
 SanGong_miaohao_54_desc:0 "光大にして功あり、よく前業を紹ぐ。ゆえに廟号を奉って光宗と曰う。"
 SanGong_miaohao_55_desc:0 "義によりて済し、光いに令緒あり。ゆえに廟号を奉って景宗と曰う。"
 SanGong_miaohao_56_desc:0 "為さずして成り、疾からずして速し。ゆえに廟号を奉って順宗と曰う。"
 SanGong_miaohao_57_desc:0 "善く法典に合し、荘敬厳威。ゆえに廟号を奉って敬宗と曰う。"
 SanGong_miaohao_58_desc:0 "淵衷湛一、寧考安康。ゆえに廟号を奉って寧宗と曰う。"
 SanGong_miaohao_59_desc:0 "興して大業あり、聖図丕いに振るう。ゆえに廟号を奉って興宗と曰う。"
 SanGong_miaohao_60_desc:0 "道を体し一を得、天縦自然。ゆえに廟号を奉って道宗と曰う。"
 SanGong_miaohao_61_desc:0 "法度明大、言を出して文あり。ゆえに廟号を奉って章宗と曰う。"
 SanGong_miaohao_62_desc:0 "温和聖善、民を愛し質淵。ゆえに廟号を奉って懿宗と曰う。"
 SanGong_miaohao_63_desc:0 "法度明大、言を出して文あり。ゆえに廟号を奉って章宗と曰う。"
 SanGong_miaohao_64_desc:0 "果敢堅毅、秉性剛断。ゆえに廟号を奉って毅宗と曰う。"
 SanGong_miaohao_65_desc:0 "寛仁にして衆を得、厚徳にして統を承く。ゆえに廟号を奉って裕宗と曰う。"
 SanGong_miaohao_66_desc:0 "政平らかに刑粛み、道術を表章す。ゆえに廟号を奉って理宗と曰う。"
 SanGong_miaohao_67_desc:0 "敵に勝ちて志強く、威儀忒わず。ゆえに廟号を奉って荘宗と曰う。"
 SanGong_miaohao_68_desc:0 "盛明熙和、敬徳光輝。ゆえに廟号を奉って熙宗と曰う。"
 SanGong_miaohao_69_desc:0 "和気広く敷き、功ありて人を安んず。ゆえに廟号を奉って熹宗と曰う。"
 SanGong_miaohao_70_desc:0 "質淵にして諫を受け、慈恵にして親を愛す。ゆえに廟号を奉って僖宗と曰う。"
 SanGong_miaohao_71_desc:0 "博聞多能、恵にして内に徳あり。ゆえに廟号を奉って献宗と曰う。"
 SanGong_miaohao_72_desc:0 "道徳純一、仁を体し民に長たり。ゆえに廟号を奉って元宗と曰う。"
 SanGong_miaohao_73_desc:0 "福慶綿延、善く継ぎ宗を承く。ゆえに廟号を奉って慶宗と曰う。"
 SanGong_miaohao_74_desc:0 "義を奉じ則に順い、恭倹荘敬。ゆえに廟号を奉って礼宗と曰う。"
 SanGong_miaohao_75_desc:0 "元徳充美、雅韻昭彰。ゆえに廟号を奉って徽宗と曰う。"
 SanGong_miaohao_76_desc:0 "容儀恭美、徳を昭らかにして労あり。ゆえに廟号を奉って昭宗と曰う。"
 SanGong_miaohao_77_desc:0 "民を愛し与うるを好み、柔質にして諫を受く。ゆえに廟号を奉って恵宗と曰う。"
 SanGong_miaohao_78_desc:0 "強毅にして政を執り、荘をもって下に臨む。ゆえに廟号を奉って威宗と曰う。"
 SanGong_miaohao_79_desc:0 "賢を尊び義を貴び、正徳美容。ゆえに廟号を奉って恭宗と曰う。"
 SanGong_miaohao_80_desc:0 "和を好み争わず、兆民寧頼す。ゆえに廟号を奉って安宗と曰う。"
 SanGong_miaohao_81_desc:0 "疏遠より位を継ぎ、前業を紹継す。ゆえに廟号を奉って紹宗と曰う。"
 SanGong_miaohao_82_desc:0 "威儀悉く備わり、事を敬い用を節す。ゆえに廟号を奉って欽宗と曰う。"
 SanGong_miaohao_83_desc:0 "慮り深く通敏、前過を追悔す。ゆえに廟号を奉って思宗と曰う。"
 SanGong_miaohao_84_desc:0 "進退軌とすべく、従容として常あり。ゆえに廟号を奉って度宗と曰う。"
 SanGong_miaohao_85_desc:0 "礼を守り義を執り、聖修式化。ゆえに廟号を奉って端宗と曰う。"
 SanGong_miaohao_86_desc:0 "克く敬い民に勤め、よく武志を成す。ゆえに廟号を奉って桓宗と曰う。"
 SanGong_miaohao_87_desc:0 "甲冑に労あり、協賛して成あり。ゆえに廟号を奉って襄宗と曰う。"
 SanGong_miaohao_88_desc:0 "大緒を統承し、万方を総御す。ゆえに廟号を奉って統宗と曰う。"
 SanGong_miaohao_89_desc:0 "民を安んじ大いに慮り、純行二ならず。ゆえに廟号を奉って定宗と曰う。"
 SanGong_miaohao_zdy_desc:0 "嗣君が自ら廟号を定め、「[ROOT.Char.GetLocalizedText( 'SanGong_miaohao_zdy_text' )]」の字を取った。"
