l_japanese:
 activity_wj_coronation:0 "中国式進位礼"
 activity_wj_coronation_desc:0 "臣属を召集し、儀注を議定し、冊書・璽綬・朝会をもって君位を明示する。進位の名分は一連の儀式がすべて終わってはじめて正式に確立する。"
 activity_wj_coronation_host_desc:0 "完了後、身分に応じて「進位して王となる」または「皇帝位に即く」法を得て、さらに国号を議定する。旧朝から授けられた軍職は同時に解かれる。"
 activity_wj_coronation_guest_desc:0 "会に赴いて進位を見届け、新君に臣属としての責務を述べる。"
 WJ_cr_type_king:0 "進位して王となる"
 WJ_cr_type_king_desc:0 "独立した州級の統治者が王号を受ける。儀式を終えるまでは旧来の官称を用いる。"
 WJ_cr_type_usurp:0 "僭越して帝を称す"
 WJ_cr_type_usurp_desc:0 "天下にはなお天子がいるが、私は自ら帝号を立てる。現存の覇権を奪うことはなく、儀式によって自動的に戦争を起こすこともない。"
 WJ_cr_type_found:0 "鼎を定めて開国する"
 WJ_cr_type_found_desc:0 "旧き覇権はもはや存在しない。帝国の基をもって鼎を定め国を建てる。"
 WJ_cr_type_accession:0 "践祚大典"
 WJ_cr_type_accession_desc:0 "$BULLET_WITH_TAB$[GetLaw('crowned_emperor').GetName]の[law|E]を得る
$BULLET_WITH_TAB$式典の盛況に応じて[legitimacy_i][legitimacy|E]と[vassals|E]の[opinion_i][opinion|E]を得る
$BULLET_WITH_TAB$廟に告げ、璽を受け、朝に臨む。宴席では[oath|E]を立てられる
$BULLET_WITH_TAB$礼成の後に国号を定め、旧朝の授けた軍職は解かれる
$BULLET_WITH_TAB$@alert_icon!#alert_trial 郡国制の独立した皇帝のみ。自らの都で執り行う#!

#weak 皇位すでに承け、有司は儀を整える。宗廟に告げ、璽綬を受け、朝賀を受けて、君臣の義を天下に示す。#!"
 WJ_cr_location_desc:0 "自らの都で進位礼を執り行う。宗教的聖地や教会の司式者は必要としない。"
 WJ_cr_phase_preparation:0 "礼を議し儀を備う"
 WJ_cr_phase_preparation_desc:0 "儀注を集議し、冊書を校訂し、臣属の来会を待つ。"
 WJ_cr_phase_investiture:0 "冊を受け朝に臨む"
 WJ_cr_phase_investiture_desc:0 "冊書を宣読し、璽綬を授受し、臣属の朝賀を受ける。"
 WJ_cr_phase_banquet:0 "燕饗して成るを告ぐ"
 WJ_cr_phase_banquet_desc:0 "臣属と燕饗し、新政を申明し、礼儀を完成させる。"
 WJ_cr_conclusion_desc:0 "進位礼はすでに成った。法と国号は今回の儀式の実際の結果に従って決まる。"
 WJ_cr.1.t:0 "礼を議し儀を備う"
 WJ_cr.1.desc:0 "礼官が歴代の儀注を案前に並べ、臣属の車駕も次々と入城してくる。今回の進位は、冊書に一つの称号を書き加えるだけのことではない。朝会の序列、璽綬の制度、臣属の名分――そのすべてを、居並ぶ者たちにはっきりと示さねばならない。\n\n私は儀注の照合を命じた。繁簡は斟酌してよいが、受冊と宣告の要節を省くことはできない。"
 WJ_cr.1.a:0 "旧章を参酌し、儀注を完備させよ。"
 WJ_cr.1.b:0 "無駄な費えは削れ。ただし礼の大節は廃してはならぬ。"
 WJ_cr.2.t:0 "冊を受け朝に臨む"
 WJ_cr.2.desc:0 "冊書は定まり、璽綬は御案に並べられた。礼官が儀文を宣読し、臣属は順に進み出て、列をなして拝賀する。\n\n私は璽綬を受け取り、殿下を見渡した。今日受けたものは栄誉だけではない。これより号令も治乱も、すべてこの君位の名において四方へ伝えられるのだ。燕饗が成ったとき、新たな名分ははじめて朝廷の制度に書き記される。"
 WJ_cr.2.a:0 "冊を受けて朝に臨み、皆とともに治世の責を担う。"
 WJ_cr.3.t:0 "燕饗の申誡"
 WJ_cr.3.desc:0 "礼が終わると席が設けられ、臣属は席上で互いに祝いを述べ合う。新君は多くの頌辞を耳にするが、頌辞ばかりを聞いているわけにはいかない。\n\n私は杯を挙げて喧騒を鎮め、今後の施政の意を皆に告げた。今日の誓いは、本来の戴冠の誓約の制度に倣って私を縛ることになる。宴席での美辞麗句に終わらせてはならない。"
 # 2026-10-23 补全立誓流程
 WJ_cr.3.a:0 "盟友を広く結ぶと誓う：信義を慎んで守り、与国と好を結ぶ。"
 WJ_cr.3.b:0 "平和を保つと誓う：武を収めて文を修め、民を休ませる。"
 WJ_cr.3.c:0 "申誡にとどめ、誓いは立てない。"
 WJ_cr_oath_on_complete_tt:0 "誓いは進位礼が成った日に正式に立てられ、期限はその日から数える。"
 WJ_cr.4.t:0 "進位礼成る"
 WJ_cr.4.desc:0 "冊書、受璽、朝賀、燕饗はすべて終わった。礼官は新たな君位の名分を制度に記し、続いて国号の候補を差し出した。\n\nこの時に至って、進位はようやく成就した。旧朝から授けられた軍職もこれに伴って解かれる。"
 WJ_cr.4.a:0 "礼成る。国号を議定せよ。"
 WJ_cr_crowned_king_male:0 "王"
 WJ_cr_crowned_king_female:0 "王"
 WJ_cr_king_country:0 "国"
 WJ_cr_crowned_king_law:0 "進位して王となる"
 WJ_cr_crowned_emperor_law:0 "皇帝位に即く"
 # 2026-10-23 践祚大典を加冕礼に統合
 WJ_cr_type_not_celestial_tt:0 "郡国制ではない（郡国制の君主は践祚大典を行う）"
 WJ_cr_type_celestial_only_tt:0 "郡国制の独立した皇帝である"
 WJ_cr_location_capital_tt:0 "主催者の都である（践祚大典は都でのみ行う）"
