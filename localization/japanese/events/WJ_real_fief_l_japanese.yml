 WJ_rf_request_valid_tt:0 "あなたは太傅・丞相・大将軍または三公の位にあり、すでに侯爵を受け、天子をあなたの[puppet|E]としていなければならない。録尚書事はあなた自身かあなたの門生・幕僚が務めており、侍中・大司馬・尚書令の三職のうち少なくとも二職があなたの門生・幕僚の手中になければならない"
 WJ_rf_promote_valid_tt:0 "天子の称号が[hegemony|E]級であり、かつあなたの[puppet|E]でなければならない。録尚書事はあなた自身かあなたの門生・幕僚が務めていなければならない。あなたの封国は少なくとも100の県を管轄していなければならない"
 WJ_rf_no_pending_tt:0 "現在、まだ議定されていない封国の件はない"
 WJ_rf_expand_liege_tt:0 "あなたはなお天子の臣である"
 WJ_rf_expand_cooldown_tt:0 "あなたが封を受けてから、または前回の益封から3年が経過している"
