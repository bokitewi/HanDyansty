l_japanese:
 WJ_rf_grant:0 "実封の公に冊封する"
 WJ_rf_grant_desc:0 "三郡を割いて、この人物のために世襲の封国を建てる。"
 WJ_rf_request_decision:0 "封公を申請する"
 WJ_rf_request_decision_desc:0 "天子がすでに我が掌中にあり、台閣の要職もことごとく我が門生故吏で占められているならば、尋常の爵禄では到底報いるに足りない。その時こそ、天子に郡を割いて国を建てさせ、我が家門に一方を代々守らせるべきである。"
 WJ_rf_request_decision_tooltip:0 "天子に三郡を割かせ、あなたのために世襲の封国を建てるよう請う"
 WJ_rf_request_decision_confirm:0 "封建を請う！"
 WJ_rf_expand_decision:0 "封国の拡張を申請する"
 WJ_rf_expand_decision_desc:0 "封国は建てられたばかりで、疆土はまだ狭い。隣接する一郡をも国に併せてこそ、この基業はしっかりと立つといえる。"
 WJ_rf_expand_decision_tooltip:0 "封国と境を接する郡を一つ封国に併合する"
 WJ_rf_expand_decision_confirm:0 "益封を請う！"
 WJ_rf_promote_decision:0 "王への晋封を請う"
 WJ_rf_promote_decision_desc:0 "封国は日に日に広がり、朝中にはもはや我と肩を並べる者はいない。たかが公爵では、今の権勢に釣り合わぬ――あと一歩で、爵を進めて王となれる。"
 WJ_rf_promote_decision_tooltip:0 "爵を進めて王となる。元の封国は引き続きあなたのものとなる"
 WJ_rf_promote_decision_confirm:0 "爵を進めて王となる！"
 WJ_rf_pick:0 "封国の疆域を画定する"
 WJ_rf_pick_desc:0 "輿図が案上に広げられた。[ROOT.Char.MakeScope.Var('wj_rf_target').Char.GetUIName]の封国の境界は、これらの数郡の間から画定されることになる。\n\n[ROOT.Char.Custom('WJ_rf_step_desc')]\n\n諸郡が封国に併入された後も、旧来の長吏の多くはその職に留まるが、以後は封国の所属に改められる。"
 WJ_rf_success:0 "詔命は下された"
 WJ_rf_success_desc:0 "詔書が下り、[wj_rf_beneficiary.GetUIName]の封国の疆域と名号は、これより朝廷の版籍に記載される。"
 WJ_rf_failed:0 "封国の議は中断された"
 WJ_rf_failed_desc:0 "詔書はすでに起草されたものの、諸郡の引き渡しは議定どおりには成し遂げられなかった。封国の件はひとまず棚上げとするほかなく、朝廷がこれによって何かを損なったわけではない。後日また議することができる。"
 WJ_rf_duke_rank:0 "公"
 WJ_rf_dynamic_name:0 "[ROOT.Char.Custom('WJ_rf_selected_name')]国"
 WJ_rf_held_name_dispatch:0 "[ROOT.Char.Custom('WJ_rf_held_name')]"
 WJ_rf_held_name_prefix:0 "[ROOT.Char.Custom('WJ_rf_held_name')] "
 WJ_rf_promoted_name:0 "[wj_rf_new_fief.Custom('WJ_rf_title_stem')]国"
 WJ_rf_county_name:0 "[ROOT.Char.MakeScope.Var('wj_rf_capital').Title.GetNameNoTierNoTooltip]"
 WJ_rf_title_county_name:0 "[ROOT.Title.MakeScope.Var('wj_rf_stem_capital').Title.GetNameNoTierNoTooltip]"
 WJ_rf_real_duke_name:0 "[ROOT.Char.MakeScope.Var('wj_rf_owned_title').Title.Custom('WJ_rf_title_stem')]公"
 WJ_rf_real_king_name:0 "[ROOT.Char.MakeScope.Var('wj_rf_owned_title').Title.Custom('WJ_rf_title_stem')]王"
 WJ_rf_real_duke_prefix:0 " [ROOT.Char.Custom('WJ_rf_held_name')]"
 WJ_rf_stage_0:0 "まず封国を置く州を選ぶ。"
 WJ_rf_stage_1:0 "次に国都を置く郡を選ぶ。"
 WJ_rf_stage_2:0 "さらに一郡を選ぶ。国都の郡と境を接していなければならない。"
 WJ_rf_stage_3:0 "最後に一郡を選ぶ。すでに選んだ諸郡と境を接していなければならない。選び終えれば、封国が建てられる。"
 WJ_rf_stage_expand:0 "封国と境を接する郡を一つ選び、国に併入する。"
