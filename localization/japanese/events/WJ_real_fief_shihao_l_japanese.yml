l_japanese:
 WJ_rf_shihao.title:0 "先君の諡を議定する"
 WJ_rf_shihao.desc:0 "[XianDi.GetUIName]はすでに世を去った。掌故の官が先君の治国と行事の記録を案前に差し出し、あなたに諡号の議定を請うた。\n\n諡は行いを彰らかにするものであり、嗣君の親疎によって先人の功過を書き換えることはない。あなたはその生涯に基づいて字を選ばねばならない。封国の君は、礼として帝を称さず、廟号も立てない。先君のために議定できるのは、わずか一、二字の諡だけである。"
 WJ_rf_shihao.finish:0 "これをもって諡と定め、礼典の完成を告げる。"
 WJ_rf_shihao.double:0 "一字では尽くせぬ。もう一字を議する。"
 WJ_rf_shihao.custom:0 "別の諡を定める。"
 WJ_rf_shihao.granted_tt:0 "先君の諡は、これより譜牒に記される。"
