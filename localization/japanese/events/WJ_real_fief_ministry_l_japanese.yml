l_japanese:
 WJ_rf_ministry_grant:0 "爵を承けて職に復す"
 WJ_rf_ministry_grant_desc:0 "朝廷の使者が詔を奉じてやって来た。捧げ持つ印綬は、まさしく先君が生前に任じていた職の証である。\n\n封国の爵はすでにあなたが承け継いだ。そして今、朝廷はさらにあなたに[wj_rf_inherited_office.GetNameNoTierNoTooltip]の職を引き継ぐよう命じた。府中の旧吏たちは顔を見合わせて喜んだ。引き続き朝政を握ることができれば、先君の遺した基業は一国の内にとどまらない。\n\n詔書が下った以上、現任者は印綬を返上し、あなたが赴任することになる。"
 WJ_rf_ministry_accept:0 "謹んで詔命を奉じ、その職を承け継ぐ。"
 WJ_rf_ministry_refused:0 "朝廷は補任を認めず"
 WJ_rf_ministry_refused_desc:0 "朝廷から返事が届いた。[wj_rf_inherited_office.GetNameNoTierNoTooltip]の職は、あなたには補任しないという。\n\n封爵は承け継げても、朝職は爵位の付属物ではない。先君が朝廷で握っていた権勢は、印綬とともにあなたの手に落ちてはこなかった。この職は朝廷が別に処置することとなり、あなたは別の足場を探さねばならない。"
 WJ_rf_ministry_refused_accept:0 "この件はひとまず胸に留めておく。"
