l_japanese:
 hd_dc_roy_end.0001.t: "帝位争いの終幕"
 hd_dc_enthronement_support_opinion: "新君を擁立した"
 hd_dc_faithful_royal_opinion: "約を守り変わらず"
 hd_dc_roy_end.0001.enthroned: "登殿の日、あなたは見慣れた宗親たちが御座の両脇に立っているのを目にした。ある者はあなたのために奔走し、ある者は戦が止んでようやく目の前の結果を認めた。\n\n今回の天命の改まりは戦場の勝敗によるもので、帝位争いの戦もすでに収まった。だが、天下をあなたの手に渡した者たちは、皆かつて口にした言葉を覚えている――今日帝位に即くことはできても、昔日の約束を、これで果たしたことにはできない。"
 hd_dc_roy_end.0001.defended: "最後の戦報が机上に届いた。宗親が起こした帝位争いの戦は敗れ、あなたは依然としてもとの座にある。\n\n御座は守られたが、宗廟の亀裂がひとりでに癒えることはない。軍中に、家中に、そして詔書に残された事柄を、一つずつ片付けねばならない。逆に与しなかった宗親たちも、ただ同姓というだけで封地を奪われるべきではない。"
 hd_dc_roy_end.0001.a: "勝敗は決した。古い約束は後で整理する。"
 hd_dc_roy_end.0002.t: "宮城からの知らせ"
 hd_dc_roy_end.0002.enthroned: "宮城から新君即位の知らせが届いた。この帝位争いに連なる戦はすでに終わり、御座の主は替わった。\n\nあなたにとって、これは軽々しく片付く話ではない。かつて口にした言葉、立った側、そしてまだ果たされていない約束は、新たに発せられた詔令によって帳消しになりはしない。"
 hd_dc_roy_end.0002.defended: "朝廷は御座を守り、帝位争いの戦は終わった。だが、宗廟の席次と親疎は、一枚の戦報で書き定められるものではない。\n\n為したことには、その責を負わねばならない。同姓の者が、皆同じ選択をしたわけでもないのだ。"
 hd_dc_roy_end.0002.a: "ひとまずその後の振る舞いを見るとしよう。"
