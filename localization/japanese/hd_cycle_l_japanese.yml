 hd_siyi_struggle_modifier: "乱に乗じて入寇"
 hd_siyi_struggle_modifier_desc: "中原の群雄が相争う今こそ、四夷が南下する好機である。"
 hd_strat_expander_modifier: "窮兵黷武"
 hd_strat_expander_modifier_desc: "府庫を傾けて軍備を拡充し、一方の覇を志す。"
 hd_authority_crisis_major_modifier: "地方への権限移譲"
