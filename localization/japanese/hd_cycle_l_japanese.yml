 # ===== 崩溃期事件 =====
 hd_collapse.2002.t: "新たな主を擁立する"
 hd_collapse.2002.desc: "ある者たちが密かに結託し、強藩の一人を擁立して天子に取って代わらせようとしている。密使はすでにあなたの屋敷を訪れ、この挙に加わるよう求めている。"
 hd_collapse.2002.a: "喜んで驥尾に付そう。"
 hd_collapse.2002.b: "我はなお朝廷に忠を尽くす。"
 hd_collapse.4001.t: "朝廷の威信地に落つ"
 hd_collapse.4001.desc: "州郡はそれぞれ勝手に政を行い、詔令は畿内の外に届かず、朝堂での奏対もますますおざなりになっている。取捨を決めねば、朝廷は目下のわずかな体面すら保てなくなると、あなたは心中で悟っている。"
 hd_collapse.4001.a: "州郡に権限を委ね、一時の安寧を求める。"
 hd_collapse.4001.b: "罪己の詔を下し、人心をまとめる。"
 hd_collapse.4001.c: "群臣を強く圧し、威権を失わない。"

 # ===== 饥荒 =====
 situation_type_natural_disaster_hd_famine: "$natural_disaster_hd_famine_situation$"
