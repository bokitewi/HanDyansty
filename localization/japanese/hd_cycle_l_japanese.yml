 natural_disaster_hd_famine_sub_region_disaster_area_desc: "$natural_disaster_earthquake_sub_region_disaster_area_desc$"
 hd_famine.0001.t: "歳大いに飢う"
 hd_famine.0001.desc: "統治下の各地で収穫は皆無となり、穀物の値は一日に三度も上がる。城外では飢民が老人の手を引き子を連れて、道々食を乞うている。官吏たちは災害の報告を手に堂下で控え、あなたの指示を待っている。"
 hd_famine.0001.a: "倉を開いて食糧を放出し、飢民を救う。"
 hd_famine.0001.b: "災害の年でも徴税は行い、府庫を満たす。"
 hd_famine.0001.c: "天災は人の力で挽回できるものではない。"

