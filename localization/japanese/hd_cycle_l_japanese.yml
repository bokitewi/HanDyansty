l_japanese:
 # ===== 天朝循环大修：新时代 =====
 situation_dynastic_cycle_phase_hd_recovery: "百廃待興"
 situation_dynastic_cycle_phase_hd_recovery_icon: "@hd_dc_dynastic_cycle_recovery_icon!$situation_dynastic_cycle_phase_hd_recovery$"
 situation_dynastic_cycle_phase_hd_recovery_desc_short: "乱世はようやく収まり、あらゆるものが復興を待っている。干戈は次第に止み、田畑は再び開墾され、人心は安定を願う。"
 situation_dynastic_cycle_phase_hd_recovery_desc: "$situation_dynastic_cycle_phase_hd_recovery_desc_short$\n\nこの[dynastic_cycle_era_short|E]では、戦乱が次第に収まり、流民は田畑に帰り、郡県は日ごとに豊かになっていく。朝政が清明であれば、天下は政通人和あるいは開疆拓土の世へと進むことが期待できる。処置を誤れば、底流が再び沸き起こり、再び情勢緊迫へと陥るだろう。\n\n天下の内では[son_of_heaven|E]のみが[kingdom|E]を創設でき、[empire|E]を新たに立てることはできない。"
 dynastic_cycle_situation_dynastic_cycle_phase_hd_recovery_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"

 situation_dynastic_cycle_phase_hd_collapse: "天下崩壊"
 situation_dynastic_cycle_phase_hd_collapse_icon: "@hd_dc_dynastic_cycle_collapse_icon!$situation_dynastic_cycle_phase_hd_collapse$"
 situation_dynastic_cycle_phase_hd_collapse_desc_short: "王朝の末世、綱紀は廃れ緩む。災異が相次ぎ、盗賊が蜂起し、州郡はそれぞれ異心を抱く。"
 situation_dynastic_cycle_phase_hd_collapse_desc: "$situation_dynastic_cycle_phase_hd_collapse_desc_short$\n\nこの[dynastic_cycle_era_short|E]では、朝廷は2年ごとに危機に見舞われる。強藩が簒奪して帝を称する、民衆が蜂起する、あるいは朝廷の威信が地に落ちる、といったものである。天災や流賊の報もしばしば聞かれる。\n\n中華の[hegemony|E]に主がいないか、[son_of_heaven|E]が掌握する天下の法定[counties|E]が4割に満たない場合、天下はただちに群雄割拠に陥る。その国家の支配権が最高段階に達していない間は、毎年天下を群雄割拠へと押しやる。[son_of_heaven|E]が危機を平定し、綱紀を立て直すことができれば、情勢緊迫まで持ち直すことができる。"
 dynastic_cycle_situation_dynastic_cycle_phase_hd_collapse_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"

 situation_dynastic_cycle_phase_hd_standoff: "鼎足対峙"
 situation_dynastic_cycle_phase_hd_standoff_icon: "@hd_dc_dynastic_cycle_standoff_icon!$situation_dynastic_cycle_phase_hd_standoff$"
 situation_dynastic_cycle_phase_hd_standoff_desc_short: "群雄の勢力図は定まり、諸強が一方に割拠して互いに牽制し合い、天下は長い対峙に陥った。"
 situation_dynastic_cycle_phase_hd_standoff_desc: "$situation_dynastic_cycle_phase_hd_standoff_desc_short$\n\nこの[dynastic_cycle_era_short|E]では、諸勢力の府庫は次第に豊かになり、正統性は日に日に固まるが、隣国の隙をうかがわない日は一日としてない。盟約を破る者、敵臣を寝返らせる者、兵を挙げて内乱を起こす者、一戦で大きな戦果を挙げる者が現れるか、あるいは幼主が位を継ぐ、四夷の侵攻が成功する、強藩が林立するといった事態となれば、天下は再び群雄割拠に戻る。子を人質に送る、貢納して和を求めるといった手段で、戦火を一時的に遠ざけることはできる。\n\n天下の法定[counties|E]の8割を掌握し、戴冠を済ませ、十分な[legitimacy|E]または威信を持つ統治者のみが、乱世を終わらせることができる。"
 dynastic_cycle_situation_dynastic_cycle_phase_hd_standoff_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"

