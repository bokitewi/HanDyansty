 natural_disaster_hd_famine_situation_desc: "$situation_natural_disaster_hd_famine_desc$"
 natural_disaster_hd_famine_warning_situation_phase: "不作"
 natural_disaster_hd_famine_warning_situation_phase_desc: "久しく雨が降らず、蝗が四方に起こり、秋の収穫はもはや望めない。"
 natural_disaster_hd_famine_impact_situation_phase: "飢饉"
 natural_disaster_hd_famine_impact_situation_phase_desc: "穀物の値は高騰し、飢えて死んだ者が野に満ち、流民が四散している。"
