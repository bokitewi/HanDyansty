l_japanese:
 hd_embattle_retry_deputies_decision:0 "副将の欠員を再点検"
 hd_embattle_retry_deputies_decision_desc:0 "諸軍が転戦して久しく、両翼の副将は傷つき、あるいは去り、長らく空いたまま誰も補われていない席もある。あなたは各軍に改めて点検するよう命じた。なお任にある副将はそのまま留め、空席には配下から改めて人選を行う。"
 hd_embattle_retry_deputies_decision_tooltip:0 "諸軍の両翼を点検し、副将の欠員を補う"
 hd_embattle_retry_deputies_decision_confirm:0 "諸軍を点検せよ！"
 hd_embattle_retry_deputies_decision_effect:0 "各軍でなお任にある副将はそのまま留任する。空席は、あなたが以前意図的に空けておいた席も含め、配下から改めて人選される。すぐに補える者がいない場合は、ひとまず空位のままとする。"
