 # 2026-10-25：190 历史事件新增——蒯越献策平定江南（hd190.0002~0005）、李傕郭汜相攻（hd190.0006~0007）
 hd190.0002.t:0 "蒯越の献策"
 hd190.0002.desc:0 "初平元年、あなたは詔によって荊州刺史に任じられた。このころ江南では宗賊がはびこっていた。蘇代は長沙太守を称し、華容長の貝羽とともにそれぞれ兵を擁して乱をなし、江夏の賊張虎・陳生は衆を集めて襄陽城に拠っている。さらに袁術が魯陽に兵を屯して道をふさぎ、刺史は任地に入ることもできない。\n\nあなたは単騎で宜城に入り、南郡の名士蒯良・蒯越を招いてともに謀った。蒯越は進言した。「治平の世には仁義を先とし、乱世には権謀を先とします。宗賊の帥は多くが貪欲で残虐、配下にも憎まれております。越がかねて養ってきた者たちに利を示させれば、必ず衆を率いてやって来ましょう。君が無道の者を誅し、残りを慰撫して用いれば、一州の民はみな生を楽しむ心を抱きます。兵が集まり衆がなびけば、南は江陵に拠り、北は襄陽を守り、荊州八郡は檄を伝えるだけで定まりましょう。」"
 hd190.0002.a:0 "異度の計に従おう。"
 hd190.0002.a.tt:0 "半年後、江南の宗賊の帥たちは招きに応じて宴に赴き誅され、張虎・陳生は降って幕下に加わる。長沙・南平・襄陽・南郷はすべてあなたの直轄となり、あなたは襄陽に治所を移す。"
 hd190.0002.b:0 "宗賊のことは、しばらく措こう。"
 hd190.0002.b.tt:0 "蒯越の計を用いず、江南の帥たちは後日あらためて兵をもって平定することになる。"
 hd190.0003.t:0 "宜城の宴"
 hd190.0003.desc:0 "劉表の使者が書状を携えてやって来た。荊州は定まったばかりで、郡中の豪帥とともに大事を図りたいという。宜城の宴にあなたを招き、官爵を授けると約している。使者によれば、招きに応じて出立した江南の帥はすでに数十人にのぼるという。\n\n配下の一人が声をひそめて諫めた。劉景升は単騎で荊州に入り、手元にはろくに兵もいないはず。なぜ宗帥をここまで厚遇するのか、と。"
 hd190.0003.a:0 "宴に赴く。"
 hd190.0003.b:0 "病と称して行かない。"
 hd190.0003.b.tt:0 "劉表が兵を挙げて攻めてくる。"
 hd190.0004.t:0 "単騎の説降"
 hd190.0004.desc:0 "蒯越と龐季の二人が、一兵も連れずに単騎で陣の前に現れ、面会を求めてきた。蒯越は利害を説いた。宴の招きに応じた江南の宗帥はことごとく誅され、劉使君のもとには兵が集まり衆もなびいている。あなたが守るのは一つの孤城にすぎず、朝夕にも落ちよう。甲を解いて降れば、命は保たれ、幕下に列することもできる、と。"
 hd190.0004.a:0 "甲を解いて降る。"
 hd190.0004.b:0 "城に拠って死守する。"
 hd190.0004.b.tt:0 "劉表が兵を挙げて攻めてくる。"
 hd190.0005.t:0 "江南ことごとく平らぐ"
 hd190.0005.desc:0 "蒯越の計に従い、あなたは江南の宗賊の帥たちをあまねく宜城の宴に招いた。応じてやって来た者は席上でことごとく誅され、その部曲はすべて麾下に収められた。蒯越と龐季はさらに単騎で襄陽に赴いて説き、張虎・陳生は相次いで降った。\n\n命に応じた者はすべて平定された。なお命を拒んで来なかった者には、兵をもって臨むほかない。荊州八郡は、いまや檄を伝えるだけで定まる。"
 hd190.0005.a:0 "異度の謀は十万の兵にまさる。"
 hd190.0006.t:0 "李郭相攻"
 hd190.0006.desc_fan:0 "興平二年の春、あなたは座中で胡封に命じて樊稠を引き倒させ殺した。これより諸将はみな疑い恐れるようになった。郭汜はたびたびあなたのもとで酒宴に加わり、泊まって帰らないこともあった。郭汜の妻は、あなたが婢妾をもって夫の心を奪うのではと恐れ、あなたが贈った酒食に豉を入れて毒に見せかけ、郭汜に示して「一つの巣に二羽の雄はおれぬ」と言った。のちにあなたがまた郭汜を酒に招くと、郭汜は泥酔して帰り、毒を盛られたと疑って糞汁を飲んでようやく吐き出した。\n\nこうして郭汜は兵を整えてあなたと攻め合うことになった。あなたは[hd190_lg_li_duchy.GetName]に拠り、郭汜は[hd190_lg_guo_duchy.GetName]に退いた。関中の残る諸県はそれぞれ自ら守り、もはや命に従わない。"
 hd190.0006.desc:0 "興平二年の春、郭汜はたびたびあなたのもとで酒宴に加わり、泊まって帰らないこともあった。郭汜の妻は、あなたが婢妾をもって夫の心を奪うのではと恐れ、あなたが贈った酒食に豉を入れて毒に見せかけ、郭汜に示して「一つの巣に二羽の雄はおれぬ」と言った。のちにあなたがまた郭汜を酒に招くと、郭汜は泥酔して帰り、毒を盛られたと疑って糞汁を飲んでようやく吐き出した。\n\nこうして郭汜は兵を整えてあなたと攻め合うことになった。あなたは[hd190_lg_li_duchy.GetName]に拠り、郭汜は[hd190_lg_guo_duchy.GetName]に退いた。関中の残る諸県はそれぞれ自ら守り、もはや命に従わない。"
 hd190.0006.a:0 "小僧め、よくもこのような真似を！"
 hd190.0007.t:0 "一つの巣に二羽の雄なし"
 hd190.0007.desc_fan:0 "興平二年の春、李傕は座中で胡封に命じて樊稠を引き倒させ殺した。これより諸将はみな疑い恐れるようになった。あなたはたびたび李傕のもとで酒宴に加わり、泊まって帰らないこともあった。あなたの妻は、李傕が婢妾をもってあなたの心を奪うのではと恐れ、李傕が贈ってきた酒食に豉を入れて毒に見せかけ、あなたに示して「一つの巣に二羽の雄はおれぬ」と言った。のちに李傕がまたあなたを酒に招くと、あなたは泥酔して帰り、毒を盛られたと疑って糞汁を飲んでようやく吐き出した。\n\nいまあなたは[hd190_lg_guo_duchy.GetName]に退き、李傕とそれぞれ一郡を領している。関中の残る諸県はそれぞれ自ら守っている。ただちに兵を挙げて李傕を攻めるか？"
 hd190.0007.desc:0 "興平二年の春、あなたはたびたび李傕のもとで酒宴に加わり、泊まって帰らないこともあった。あなたの妻は、李傕が婢妾をもってあなたの心を奪うのではと恐れ、李傕が贈ってきた酒食に豉を入れて毒に見せかけ、あなたに示して「一つの巣に二羽の雄はおれぬ」と言った。のちに李傕がまたあなたを酒に招くと、あなたは泥酔して帰り、毒を盛られたと疑って糞汁を飲んでようやく吐き出した。\n\nいまあなたは[hd190_lg_guo_duchy.GetName]に退き、李傕とそれぞれ一郡を領している。関中の残る諸県はそれぞれ自ら守っている。ただちに兵を挙げて李傕を攻めるか？"
 hd190.0007.a:0 "ただちに兵を挙げよ！"
 hd190.0007.a.tt:0 "「併呑」で李傕に宣戦する。開戦すると、重歩兵35隊・重騎兵60隊の部衆を得る。"
 hd190.0007.b:0 "しばらく兵を動かさない。"
 hd190.0008.t:0 "郭汜、扶風に拠る"
 hd190.0008.desc:0 "興平二年の春、李傕と郭汜は長安で互いに毒殺を疑い、兵を交えた。郭汜は衆を率いて西へ走り、郿に拠って扶風の地をことごとく手中に収めた。\n\n扶風にあるあなたの領地は、郭汜に奪われたか、さもなくば郭汜を主と仰ぐほかなくなった。"
 hd190.0008.a:0 "乱兵が道をふさぐ。いかんともしがたい。"
 hd190_rival_li_guo:0 "[CHARACTER.GetShortUIName]と[TARGET_CHARACTER.GetShortUIName]は酒宴の席で互いに毒殺を疑い、ついに兵を交えた"
