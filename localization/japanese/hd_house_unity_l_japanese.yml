 hd_unity_bloc_kicked.desc: "家族集団から追放された"
 hd_unity_bloc_leadership_lost.desc: "集団の盟主の座を奪われた"
 hd_unity_bloc_relation.desc: "家族集団内の関係改善"
 hd_unity_aspiration_drift_up.desc: "家の志向が人心をまとめる"
 hd_unity_aspiration_drift_down.desc: "家の志向が人心を揺るがす"
 hd_unity_aspiration_cap.desc: "家の志向の制約により、人心はこれ以上まとまりにくい"
 hd_unity_discord_mediated.desc: "当主が一族内の紛争を調停した"
 hd_unity_discord_favouritism.desc: "当主が一方に肩入れした"
 hd_unity_discord_ignored.desc: "一族内の紛争が放置された"
 hd_unity_split_relief.desc: "離反者が分家し、家はひと息ついた"
 hd_unity_goodwill_opinion: "厚礼による挨拶"
 hd_unity_suspicion_opinion: "出る杭は打たれる、猜疑を抱く"
 hd_unity_forced_stay_opinion: "強引に引き留められた"
 hd_unity.0001.t: "一族内の軋轢"
 hd_unity.0001.desc: "一族の心はまとまらず、各房が職務・田産・蔭補をめぐって争いを繰り返している。中でも[hd_unity_branch.GetShortUIName]の房の騒ぎはひどい。陰での結託や互いの誹謗の声が、すでにあなたの耳にまで届いている。このまま手を打たねば、家の恥が外に漏れることになろう。"
 hd_unity.0001.a: "宗親を集め、間に立って調停する。"
 hd_unity.0001.b: "[hd_unity_branch.GetShortUIName]の房の言い分に理がある。"
 hd_unity.0001.c: "家の些事に、いちいち口を挟むまでもない。"
 hd_unity.0002.t: "出る杭は打たれる"
 hd_unity.0002.desc: "あなたの家は上下一心、一族は栄え、子弟は朝廷にも州郡にも行き渡っている。だが盛りを極めれば衰えやすい。[hd_unity_liege.GetShortUIName]は近ごろあなたの家に疑いを抱いており、朝廷ではそれにかこつけてこう言い立てる者もいる。「強宗大族には、備えを怠るべからず」"
 hd_unity.0002.a: "子弟を戒め、鳴りを潜めて身を守る。"
 hd_unity.0002.b: "厚礼を献じ、忠心を示す。"
 hd_unity.0002.c: "潔白な者はおのずと明らか。相手にするまでもない。"
 hd_unity.0003.t: "分家独立"
 hd_unity.0003.desc: "一族の離心は久しく、[hd_unity_branch.GetShortUIName]の房はたびたび別家を立てて宗支を開きたいと申し出ている。力ずくで止めれば骨肉の情を損ないかねず、放っておけば家は日ごとに衰えていくだろう。"
 hd_unity.0003.a: "分家を許し、別に宗支を立てさせる。"
 hd_unity.0003.b: "家法がある以上、分家は許さぬ。"
 hd_unity.0003.c: "この件はひとまず棚上げとする。"
