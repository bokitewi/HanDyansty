l_japanese:
 trait_hd_wangzuo_zhicai:0 "王佐の才"
 trait_hd_wangzuo_zhicai_desc:0 "この人物は王業を補佐し、庶政を総攬する才を備えている。内にあっては政を治め財を理め、外にあっては樽俎の間に敵を折き、権謀機変にも深く通じている。一方の鎮撫を任せれば、政令は必ずや滞りなく行き渡るであろう。"
 hd_wangzuo_governor_efficiency_desc:0 "王佐の才"
 trait_hd_laodang_yizhuang:0 "老いて益々壮ん"
 trait_hd_laodang_yizhuang_desc:0 "この人物は年老いてなお筋骨も気力も衰えず、甲冑をまとい馬に跨がる姿は、往年と変わらず矍鑠としている。"
