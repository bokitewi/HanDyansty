l_japanese:
 # 2026-10-24 boki：徐州内斗削弱刘备（徐州未附、丹阳兵之乱），见 zz_hd_lbxz_effects.txt 节点 0、2b
 hd_lbxz_xuzhou_unsettled:0 "徐州未だ附かず"
 hd_lbxz_xuzhou_unsettled_desc:0 "陶謙が世を去ったばかりで、丹陽の旧部も徐州の士族も、このよそ者の主君に服していない。徴発も租税も、いたるところで滞る。"
 hd_lbxz.0210.t:0 "丹陽兵の乱"
 hd_lbxz.0210.desc_killed:0 "急報が陣中に届いた。あなたが兵を率いて出ている間に、張飛が下邳相曹豹と争い、怒りにまかせて曹豹を斬った。城中の丹陽兵はもともと陶使君の旧部で、よそ者の主君であるあなたに心服していなかった。中郎将[hd_lbxz_dy_leader_e.GetName]は夜のうちに城門を閉ざして叛き、州城を占拠した。\n\n徐州の士民は様子をうかがうばかりで、留守の諸将も多くが乱兵に降った。張飛は家族を守って城を斬り抜け、地に伏して罪を請うている。陶使君に託された徐州は、ついに守りきれなかった。"
 hd_lbxz.0210.desc:0 "急報が陣中に届いた。あなたが兵を率いて出ている間に、城中の丹陽兵が反乱を起こした。彼らはもともと陶使君の旧部で、よそ者の主君であるあなたに心服していなかった。[hd_lbxz_dy_leader_e.GetName]はこの機に城門を閉ざして叛き、州城を占拠した。\n\n徐州の士民は様子をうかがうばかりで、留守の諸将も多くが乱兵に降った。陶使君に託された徐州は、ついに守りきれなかった。"
 hd_lbxz.0210.a:0 "残兵をまとめ、ひとまず小沛へ退く。"
 hd_lbxz_danyang_tt:0 "[hd_lbxz_dy_leader_e.GetName]があなたの全領地とAI封臣を引き継ぎ、あなたの地位に取って代わる。あなたは部衆を率いて再び流寓の軍となり、小沛に駐屯する。プレイヤーの封臣はその場で独立する。"
