 hd_fengying.0001.t:0 "天子奉迎"
 hd_fengying.0001.desc:0 "天子奉迎の話が出るや、帳中には急に忠義の言葉があふれた。あなたは彼らが代わる代わる語り終えるのを聞き、ただ一つ問うた。「車駕は誰が護送する？着いた後は、どこに駐蹕させるのか？」今度は、皆先ほどのように声を揃えはしなかった。\n\nあなたは長安と許昌の間の道筋を皆に指し示した。天子を迎えるには、まず司隷を経営して長安を手に入れ、それから車駕を許昌に落ち着かせねばならない。天子の名分はそこにある。だがその名分で四方に号令させるには、兵馬と銭糧が要るのであって、臣下の幾筋かの涙では足りない。\n\n護送の意を示すだけにとどめるか、いっそこの件には関わらないよう勧める者もいた。あなたの指は許昌の上に止まったまま動かなかった。これほどの好機が目の前にあるのだ。あなたが取らなければ、いずれ他の誰かが取るだろう。"
 hd_fengying_cao_receive:0 "司隷を経営し、車駕を奉迎する。"
 hd_fengying_cao_warfare_unlocked:0 "これより、天子奉迎の名をもって、長安に拠る者に兵を起こして罪を問うことができる。"
 hd_fengying_cao_escort:0 "護駕の意を示すにとどめ、朝政は握らない。"
 hd_fengying_cao_refuse:0 "この件には関わらず、まずは目の前のことに専念する。"

 hd_cao_fengying_cb:0 "天子を挟みて諸侯に令す"
 hd_cao_fengying_cb_name:0 "天子を挟みて諸侯に令す"
 HD_CAO_FENGYING_WAR_NAME:0 "曹操の長安奪取戦"
 hd_cao_fengying_victory_desc:0 "曹操は京兆とその管轄下の諸県を奪取する。許昌がなおその掌中にあれば、天子を迎えて許都に駐蹕させ、摂政として朝政を総攬し、天子の直轄地と諸侯はすべてその節制に帰し、公卿百官はなお天子に直属する。許昌がすでに失われていれば、ひとまず長安に拠り、許昌を取り戻してから車駕を迎える。"
 hd_cao_fengying_no_victory_desc:0 "曹操は長安を奪取できなかった。司隷への請求権はなお残っており、[truce|E]の期限が満了した後、再び兵を挙げることができる。"
 hd_cao_fengying_start_war_decision:0 "天子を挟みて諸侯に令すを発動"
 hd_cao_fengying_start_war_decision_desc:0 "京兆はなお他人の手に握られている。まず長安を取らなければ、奉迎の二字はただの空言にすぎない。"
 hd_cao_fengying_start_war_decision_tooltip:0 "「天子を挟みて諸侯に令す」を名目に、京兆を領する者に開戦する。"
 hd_cao_fengying_start_war_decision_confirm:0 "長安へ進め！"

 hd_historical_world.0100.t:0 "官渡の前に"
 hd_historical_world.0100.desc:0 "軍報がまた袁紹に触れると、帳中でまずため息をつく者がいた。あなたはそのため息は取っておけと言い、まず黄河両岸の守備をはっきり説明させた。袁軍の多さは確かに恐ろしいが、それであなたの軍議がため息だけになるほどではない。\n\n地図の上の官渡の一点は、すでに何度も指でなぞられている。あなたは各路の糧道を眺め、敵陣の動きを問い、自軍の側背についても問うた。皆の議論は次第にいくつかの派に分かれた。戦いを主張する者、守りを主張する者、和を主張する者、そしてまず他所の敵を片付けるよう勧める者もいる。\n\nあなたは聞き終えても、指先はなお地図の端を押さえていた。本初はこちらの議論が周到だからといって一隊の兵も減らしはしない。だがこの勢いをどう受け止めるかを、彼に決めさせるいわれもない。"
 hd_historical_world.0100.alt_desc:0 "官渡の軍議が半ばまで進んだところで、予定していた軍令が出せなくなった。境界、旧約、上下の統属のしがらみが一つまた一つと報告され、先ほどまで進軍を強く主張していた者も口ぶりを変え始めた。\n\nあなたは出せずに終わったその文書を折りたたんだ。今このように開戦できない以上、改めて威勢のいい言葉を並べ、皆を帳の中で無為に待たせる必要もない。\n\n「別のやり方で行こう」あなたは諸将に議論を続けるよう促した。本初の側がどう考えているかはさておき、あなたの兵馬が出せない軍令をいつまでも待ち続けるわけにはいかない。官渡の議は、今日決着をつけるべきだ。"
 hd_historical_world.0100.small_realm_desc:0 "官渡の議を意気盛んに語る者がいた。まるで角笛が一度鳴れば天下を驚かせられるかのように。あなたはまず手元の軍籍を一通り読み上げさせた。案の定、帳中は先ほどより少し静かになった。\n\n袁紹には確かに対処しなければならない。だがあなたの手にある州県も兵糧も、すべてここに並んでいる。戦うなら、この身代で戦う。戦わぬとしても、必ずしも弱みを見せることにはならない。\n\nあなたは軍籍を机の上に押し戻した。地盤は小さくとも、進退の道ははっきり考えておかねばならない。諸将はもう十分に語った。今度はあなたの手配を聞かせる番だ。"
 hd_guandu_decide_battle:0 "官渡で決戦し、本初を阻む。"
 hd_guandu_defend_yellow_river:0 "河に沿って守りを固め、鋭鋒を争わない。"
 hd_guandu_compromise:0 "ひとまず譲歩し、本初と和睦する。"
 hd_guandu_clear_other_enemies:0 "まず側背を平らげ、それから河北を図る。"
 hd_historical_world.0190.t:0 "官渡：河北軍退く"
 hd_historical_world.0190.desc:0 "「袁軍が退きました！」使者が二度目にそう報じて、あなたはようやく手にしていた文書を本当に置いた。帳の外ではすでに歓声を上げる者がおり、あなたは笑って彼に尋ねた。自分の目で見たのか、それとも褒美欲しさに急いで来たのか。彼は慌ててもう一度経緯を詳しく語った。\n\n確かに勝ったのだ。昨日まではまだ糧の数を数えながら日々を耐え忍んでいたのに、今日は退路を先に考えるよう勧めていた者たちまでもが、急いで河北のことを議論している。あなたは彼らに、まず各部を収容して糧道をつなげと命じ、手に入れたばかりの勝利をまた混乱に陥れぬよう戒めた。\n\n帳の入口を出ると、歓声はいっそう大きくなった。あなたは北の方を見上げ、胸につかえていた息をようやく吐き尽くした。本初の根本はまだ残っている。それもよい。これからは、彼のほうがあなたの軍報を念入りに読む番だ。"
 hd_historical_world.0191.t:0 "官渡：袁軍勝利す"
 hd_historical_world.0191.desc:0 "曹軍は敗れた。捷報がその一文まで読まれると、帳中は一瞬静まり返り、たちまち祝いの声が一斉に湧き起こった。あなたは使者にもう一度読ませ、とりわけ曹軍がいかに退いたかをはっきり説明させた。\n\nこれまであなたの用兵を疑っていた者たちが、今は一人残らず恭しい。あなたはその場で彼らの古い借りを蒸し返すことはせず、ただ捷報の文書を机の一番前に置き、左右に戦利品を数えさせ、将兵を落ち着かせるよう命じた。将兵たちが袁氏のために勝ち取った声勢を、宴席の数杯の酒に変えてしまうわけにはいかない。\n\n孟徳にどれほどの根本が残っているかは、後で改めて議論すればよい。今日、官渡では勝った。この中原の争いで先に頭を下げたのが誰なのか、天下の人々に知らしめるべきだ。"

 hd_historical_world.0200.t:0 "赤壁の前に"
 hd_historical_world.0200.desc:0 "荊州の返答はすでに受け取ったが、左右はなお江東の水路を囲んでそれぞれ自説を譲らない。あなたは彼らに、まず水軍・糧道・軍中の様子をきちんと列挙させ、対岸の城邑の名をあなたに読み聞かせるだけで済ませるなと命じた。\n\n直ちに進軍すべしと請う者もいれば、もう一月整えるべきだと請う者もいる。あなたは舟船と糧秣の帳簿に一つひとつ目を通し、どの懸念がすでに片付き、どれがまだ警戒を要するのかを問いただした。以前の話は一度聞けば十分だ。今日事を行うには、今日の根拠が要る。\n\n江東は目の前にある。兵を収めるのもまた一つの道だ。あなたは地図を広げ、誰にもあなたの雄心に結論を下させようとは急がない。進むか、整えるか、それともここで止めるか――全軍があなたの号令を待っている。"
 hd_historical_world.0200.alt_desc:0 "渡江の軍議は、またしても新たな報せに遮られた。あなたはそこに記された領属と旧約の変化を読み、予定していた号令を机の下に押し込んだ。帳中の何人かはたちまち口を閉ざした。\n\n彼らはおそらく、あなたが怒るかどうかを見守っているのだろう。だが怒ったところでどうなる。江上の水路が古い地図どおりに並べ直されるとでもいうのか。今は当初の議のとおりに江東と決戦できない以上、別の策を立てるほかない。\n\nあなたは文書を一通替えさせた。ここまで一歩進んだからといって、次の一歩が一本道しかないわけではない。今日何をなすべきか、全軍に知らせなければならない。"
 hd_chibi_continue_southeast:0 "軍を東へ下し、江東を目指す。"
 hd_chibi_prepare_fleet:0 "舟師と糧道を整え、一月余りの後に改めて議する。"
 hd_chibi_withdraw:0 "兵を収めて北へ帰り、士卒を休ませる。"
 hd_chibi_hold_jingzhou:0 "ほどほどで止め、これ以上東へは進まない。"
 hd_historical_world.0210.t:0 "荊州の去就"
 hd_historical_world.0210.desc:0 "曹軍が迫るとの知らせが州府に届くと、議する者たちは二派に分かれた。一派は荊州の山川は守れると言い、もう一派は兵糧を何度も勘定した末に、「民を保全するに如かず」の一言だけを残した。\n\nあなたは机の上の州印を見つめた。以前に誰が何を約束していようと、今荊州を治めているのはあなたであり、降るか守るかの決断を、この場にいない誰かに押しつけることはできない。\n\n堂の外ではなお返答の刻限を催促している。あなたは皆の言い争いを止め、まず自分自身の決定を聞かせることにした。"
 hd_chibi_jingzhou_surrender:0 "州を挙げて帰順し、士民を守る。"
 hd_chibi_jingzhou_resist:0 "険に拠って固守し、曹操には決して降らない。"
 hd_historical_world.0290.t:0 "赤壁：北軍退却"
 hd_historical_world.0290.desc:0 "北軍が退いた。江上から送られてくる戦報が繰り返しそれを裏付け、各地の守備隊からも同じ知らせが届いて、帳中の者たちはようやく本当に安堵の息をついた。\n\nあなたはまだ波の静まらぬ江面を見つめながら、死傷と追撃の報告を聞いた。曹軍を食い止めたからといって、今後の江の守りを緩めてよいことにはならない。対岸にはなお再起の力があり、自分たちにも集め直すべき将兵と修繕すべき舟船がある。\n\nこの戦いをどう広めるかを早くも口にする者がいたが、あなたはまず彼を下がらせた。まず生き残った者たちを落ち着かせ、それから守り抜いた地を固めるのだ。江東は目の前のこの関門を越えたが、この先の道はなお歩み続けなければならない。"
 hd_historical_world.0291.t:0 "赤壁：江防突破"
 hd_historical_world.0291.desc:0 "江の守りは破れた。前軍の捷報を伝える者が語り終えると、帳中ではしばし誰も口を開かなかった。あなたは皆を見回し、ついに声を上げて笑った。「先ほどまでは急ぐなと諫めていたのに、今は皆言葉も出ないのか？」\n\n皆はそこでようやく一斉に祝いを述べた。あなたは彼らに、まず舟船と兵糧をきちんと数えさせた。勝ち戦の後に手柄争いばかりしていれば、後で同じように乱れる。だが地図の上で隔てられていただけの水路は、今日ようやく、手を伸ばしても届かぬ場所ではなくなった。\n\n江東がこれからどうするつもりかは、いずれ報せが来るだろう。あなたは南方の地図をさらに広げ、帳の外で次々と高まる勝利の声に耳を傾けた。まず目の前で得たものをしっかり固めれば、残りの道は、もういつも彼らの思うとおりに歩む必要はない。"


