l_japanese:
 hd_historical_war_victory_desc:0 "[attacker.GetShortUIName|U]は争われた地を奪取する。"
 hd_historical_war_white_peace_desc:0 "双方が兵を収め、境界はもとのまま。"
 hd_historical_war_defeat_desc:0 "攻撃側は功なくして帰り、境界はもとのまま。"
 hd_chain_acknowledge:0 "天下の大勢は、これより変わる。"
 hd_historical_world.0188.t:0 "荊州鎮撫"
 hd_historical_world.0188.desc:0 "荊州へ出鎮せよとの朝廷の詔書が届いた。あなたは文書を読み終えると、まず前任者が残した属吏と郡県について尋ねた。州の名は詔書の上ではわずか二文字にすぎないが、あなたの手に渡される務めは一つたりとも減りはしない。\n\n旧印、軍籍、府庫、所属の人々は、すべて一つひとつ引き継がねばならない。江漢の間では宗賊が並び起こり、それぞれ塢壁に拠っている。新しい刺史が来たと聞いたからといって、素直に頭を垂れて命に従うとは限らない。\n\nあなたはまず引き継げる地を列挙させ、残りは改めて調べることにした。朝命を受けた以上、一州の責務を本当に担わねばならない。州府の机に着いてから土地の難しさを知らなかったと言うのでは、遅すぎる。"
 hd_historical_world.0188.a:0 "詔を奉じて赴任し、荊州を引き継ぐ。"

 hd_guandu_xu_you_wuchao_modifier:0 "烏巣の屯糧"
 hd_guandu_xu_you_wuchao_modifier_desc:0 "大軍の糧秣の多くは烏巣に貯えられているが、守りはさほど厳重ではない。帳下の謀士たちもまた互いに不和であり、怨みを抱く者がいないとは言い切れない。"
 hd_guandu_scout_wuchao_modifier:0 "糧道の攪乱"
 hd_guandu_scout_wuchao_modifier_desc:0 "敵軍の斥候がたびたび糧道の近くに出没し、輸送がしばしば滞る。"
 hd_chibi_risk_disease_modifier:0 "軍中の疫病"
 hd_chibi_risk_disease_modifier_desc:0 "北方の兵士は風土になじまず、軍中に疫病が広がり始めた。"
 hd_chibi_risk_expedition_modifier:0 "遠征の疲労"
 hd_chibi_risk_expedition_modifier_desc:0 "北軍は長い道のりを南下し、すでに人馬ともに疲れ果てている。"
 hd_chibi_risk_naval_modifier:0 "水戦に不慣れ"
 hd_chibi_risk_naval_modifier_desc:0 "北方の将兵の多くは舟の扱いに慣れておらず、江上での交戦では本領を発揮しにくい。"
 hd_chibi_risk_jingzhou_loyalty_modifier:0 "荊州の新附"
 hd_chibi_risk_jingzhou_loyalty_modifier_desc:0 "荊州軍は最近帰順したばかりで人心が定まらず、新たな主のために命を懸けるとは限らない。"
 hd_chibi_risk_tied_ships_modifier:0 "艦船の連結"
 hd_chibi_risk_tied_ships_modifier_desc:0 "兵士の船酔いを防ぐため、艦船を船首と船尾でつないだ。進むにも止まるにも安定するが、進退は難しくなる。"
 hd_chibi_risk_logistics_modifier:0 "長大な糧道"
 hd_chibi_risk_logistics_modifier_desc:0 "糧秣は北方から千里を運ばれてくるため、長くはもたない。"
 hd_chibi_risk_huang_gai_modifier:0 "江東の宿将"
 hd_chibi_risk_huang_gai_modifier_desc:0 "黄蓋はなお江東軍の中にいる。この人物は長く戦陣を経て水戦に通じ、しばしば人の意表を突く策を持っている。"

 hd_story_cao_life:0 "曹操本紀"
 hd_story_yuan_life:0 "袁紹本紀"
 hd_story_liu_bei_life:0 "劉備本紀"
