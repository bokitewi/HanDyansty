 hd_yuan_shu_assertive_ai:0 "汝南の野望"
 hd_yuan_shu_assertive_ai_desc:0 "このキャラクターは野心に満ち、権術で内外を操ることを好み、常に豪族を招き入れ隣国を併呑しようと考えている。"
 hd_wang_yun_historical_murder_scheme:0 "董卓誅殺の謀"
 hd_wang_yun_historical_murder_scheme_desc:0 "このキャラクターは長年耐え忍び、周到に計画を練ってきた。企てはいよいよ図窮まりて匕首見わるの時を迎えた。"
 hd_wang_yun_historical_sway_scheme:0 "呂布を抱き込む"
 hd_wang_yun_historical_sway_scheme_desc:0 "このキャラクターは呂布と董卓の間の確執を熟知しており、その一言一言が呂布の心に響いている。"
