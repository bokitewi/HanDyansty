 hd_story_liu_biao_life:0 "劉表本紀"
 hd_story_wang_yun_life:0 "王允本紀"
 hd_story_yuan_shu_life:0 "袁術本紀"
 HD_CAO_LIFE_STORY_STATUS:0 "現在の篇章：#V [Story.MakeScope.Var('hd_cao_life_phase').GetFlagName]#!\n曹孟徳は幼くして機敏で権謀に長け、任侠を好んで放蕩し、家業を治めなかった。天下が乱れんとする時にあって、この人物の一挙一動が中原の情勢を揺り動かしている。"
 HD_YUAN_LIFE_STORY_STATUS:0 "現在の篇章：#V [Story.MakeScope.Var('hd_yuan_life_phase').GetFlagName]#!\n袁本初は四世三公の家に生まれ、節を折って士にへりくだり、門生故吏は天下に遍くいる。海内の豪傑には、その旗印を望んで起つ者が多い。"
 HD_DONG_ZHUO_LIFE_STORY_STATUS:0 "現在の篇章：#V [Story.MakeScope.Var('hd_dong_zhuo_life_phase').GetFlagName]#!\n董仲穎は涼州の辺地から身を起こし、粗暴勇猛にして謀があり、麾下の多くは歴戦の羌胡の精騎である。"
 HD_GONGSUN_ZAN_LIFE_STORY_STATUS:0 "現在の篇章：#V [Story.MakeScope.Var('hd_gongsun_zan_life_phase').GetFlagName]#!\n公孫伯圭は長く幽燕の辺塞を鎮め、白馬義従をもって胡虜を震え上がらせ、かねてより北方に雄踞する志を抱いている。"
 HD_SUN_JIAN_LIFE_STORY_STATUS:0 "現在の篇章：#V [Story.MakeScope.Var('hd_sun_life_phase').GetFlagName]#!\n孫氏は呉郡富春から身を起こし、勇烈をもって世に名高い。江東の基業は、この一家の手から始まったのである。"
 HD_LIU_BIAO_LIFE_STORY_STATUS:0 "現在の篇章：#V [Story.MakeScope.Var('hd_liu_biao_life_phase').GetFlagName]#!\n劉景升は名士としての声望をもって荊州に出鎮し、求めるのは境を保ち民を安んじることのみで、中原の争いに軽々しく巻き込まれることを望まない。"
 HD_WANG_YUN_LIFE_STORY_STATUS:0 "現在の篇章：#V [Story.MakeScope.Var('hd_wang_yun_life_phase').GetFlagName]#!\n王子師は朝廷にあって剛直であり、表向きは権臣と渡り合いながらも、心中では一日たりとも漢室を忘れたことがない。"
 HD_YUAN_SHU_LIFE_STORY_STATUS:0 "現在の篇章：#V [Story.MakeScope.Var('hd_yuan_shu_life_phase').GetFlagName]#!\n袁公路は家柄の高貴さを恃み、かねてより大志を抱いている。汝南は袁氏の故郷であり、彼が常に心にかける根本の地でもある。"
