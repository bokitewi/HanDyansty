 # 2026-10-09 从旧版原版副本 buildings_l_simp_chinese.yml 拆出的 mod 新增建筑键
 building_type_Storehouse_01: "穀倉"
 building_type_Storehouse_01_desc: "穀物を蓄える倉廩。倉廩実ちて礼節を知る。一地に余剰の糧があってこそ、兵を養い民を救い、水害や旱魃、戦乱や飢饉にも落ち着いて対処できる。"
 building_Storehouse_01: "地下窖"
 building_Storehouse_01_desc: "その場で土を掘って穴蔵とし、火で穴の壁を焼いて固く乾かし、さらに筵と籾殻を敷く。穀物をその中に蓄えれば、年を越えても傷まない。"
 building_Storehouse_02: "地下倉"
 building_Storehouse_02_desc: "穴蔵はますます深く広く掘られ、口は小さく腹は大きく、上を土と木で覆う。一つの穴蔵に蓄えたものだけで、一郷の食をまかなうに足る。"
 building_Storehouse_03: "貯蔵の分類"
 building_Storehouse_03_desc: "倉の中で品目ごとの区分が始まった。粟や麦は窖に、豆類は囷に入れ、干し肉や漬物、塩は別室に置き、それぞれ倉吏が見張って帳簿に記す。"
 building_Storehouse_04: "地下倉群"
 building_Storehouse_04_desc: "この地は食糧が豊かで、城外には窖穴が一面に掘られて整然と並び、倉吏が帳簿に従って出納を行う。"
 building_Storehouse_05: "地上倉庫"
 building_Storehouse_05_desc: "地下の窖穴ではもはや足りなくなり、高く乾いた場所に廩倉を築いた。土を突き固めて基礎とし、木を組んで屋根を架け、四方の壁に窓を開けて風を通し、倉の中には穀物が山のように積まれている。"
 building_Storehouse_06: "資源の貯蔵"
 building_Storehouse_06_desc: "食糧のほか、塩や鉄、布帛、薪炭、まぐさなども蓄える必要があり、官府は倉庫を増築して品目ごとに収め、不時の需要に備える。"
 building_Storehouse_07: "巨大倉庫"
 building_Storehouse_07_desc: "城中は豊かで、食糧も百貨も余剰が多く、そこで壮大な倉城を築いた。垣が周りを囲み、倉が列をなし、遠目にはまるで一つの小城のようである。"
 building_Storehouse_08: "貯蔵複合施設"
 building_Storehouse_08_desc: "倉城の規模は壮大で、京師の太倉に比肩するほどである。窖の口は草と泥で幾重にも封じられ、蓄えられた粟は古いものの上に古いものが重なり、数十年を経ても腐らない。"
 building_type_swahili_port_pembas: "$building_swahili_port_pemba$"
