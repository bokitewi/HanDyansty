 # ============================================================
 # 特质：汉家冠带
 # ============================================================
 trait_zgrc_hanjia_guandai:0 "漢家冠帯"
 trait_zgrc_hanjia_guandai_desc:0 "このキャラクターは漢家の冠帯の家に生まれ、振る舞いは礼にかない、衣冠は端正である。"
 trait_zgrc_hanjia_guandai_character_desc:0 "冠帯の家に生まれ、礼楽を習い、名節を重んじ、郷里から敬われている。"

 # ============================================================
 # 游戏决议
 # ============================================================
 decision_group_type_zgrc:0 "漢人地域風俗の決断"

 zgrc_debug_distribute_hanjia_guandai_decision:0 "Debug：漢家冠帯を再配布"
 zgrc_debug_distribute_hanjia_guandai_decision_desc:0 "（デバッグ）華夏礼楽文化のすべての家に「漢家冠帯」特性を手動で再配布する。"
 zgrc_debug_distribute_hanjia_guandai_decision_tooltip:0 "華夏礼楽文化のすべての家に「漢家冠帯」特性を再配布する。"
 zgrc_debug_distribute_hanjia_guandai_decision_confirm:0 "漢家冠帯を再配布"

 zgrc_debug_distribute_regional_customs_decision:0 "Debug：各地の風俗を初期化"
 zgrc_debug_distribute_regional_customs_decision_desc:0 "（デバッグ）『漢書』地理志の区分に従い、各公国の領地と称号保有者を対応する漢文化の分派に書き換える。"
 zgrc_debug_distribute_regional_customs_decision_tooltip:0 "各公国の領地と称号保有者（中華の伝統）および宮廷を、対応する漢文化の分派に書き換える。"
 zgrc_debug_distribute_regional_customs_decision_confirm:0 "各地の風俗を初期化"

 # ============================================================
 # 游戏规则
 # ============================================================
 # ============================================================
 # 入乡随俗 —— 久居时限
 # ============================================================
 rule_zgrc_ruxiang_time:0 "郷に入っては郷に従え：居住期間"
 setting_zgrc_ruxiang_time_5:0 "5年"
 setting_zgrc_ruxiang_time_5_desc:0 "異郷に客居する者は、#high 5#!年間続けて住んではじめて、郷に入っては郷に従うことができる。"
 setting_zgrc_ruxiang_time_10:0 "10年"
 setting_zgrc_ruxiang_time_10_desc:0 "異郷に客居する者は、#high 10#!年間続けて住んではじめて、郷に入っては郷に従うことができる。"
 setting_zgrc_ruxiang_time_30:0 "30年"
 setting_zgrc_ruxiang_time_30_desc:0 "異郷に客居する者は、#high 30#!年間続けて住んではじめて、郷に入っては郷に従うことができる。"

 # ============================================================
 # 开局初始化 —— 地域风俗/汉家冠带分发
 # ============================================================
 rule_zgrc_init_on_start:0 "開始時の初期化"
 setting_zgrc_init_on_start_enabled:0 "有効"
 setting_zgrc_init_on_start_enabled_desc:0 "ゲーム開始時に、各漢地文化へ#EMP 地域風俗の伝統#!と#EMP 漢家冠帯#!を自動で配布する。"
 setting_zgrc_init_on_start_disabled:0 "無効"
 setting_zgrc_init_on_start_disabled_desc:0 "ゲーム開始時には自動配布せず、デバッグ用の決断で手動実行する必要がある。既存のセーブデータやカスタム開始に適する。"

 # ============================================================
 # 革新同步 —— 开关与周期（归一）
