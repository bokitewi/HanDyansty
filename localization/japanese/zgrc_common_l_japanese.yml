 setting_zgrc_innovation_sync_disabled_desc:0 "革新の同期を無効にし、各文化はすべての革新を自力で研究しなければならない。"
 setting_zgrc_innovation_sync_1:0 "1年ごと"
 setting_zgrc_innovation_sync_1_desc:0 "#high 1#!年ごとに革新の同期を行う。"
 setting_zgrc_innovation_sync_3:0 "3年ごと"
 setting_zgrc_innovation_sync_3_desc:0 "#high 3#!年ごとに革新の同期を行う。"
 setting_zgrc_innovation_sync_5:0 "5年ごと"
 setting_zgrc_innovation_sync_5_desc:0 "#high 5#!年ごとに革新の同期を行う。"
 setting_zgrc_innovation_sync_enabled:0 "有効"
 setting_zgrc_innovation_sync_enabled_desc:0 "#EMP 漢文明共有の革新#!を定期的に各漢地文化へ同期する。"
 setting_zgrc_innovation_sync_threshold_1:0 "1年ごと"
 setting_zgrc_innovation_sync_threshold_1_desc:0 "#high 1#!年ごとに革新の同期を行う。"
 setting_zgrc_innovation_sync_threshold_3:0 "3年ごと"
 setting_zgrc_innovation_sync_threshold_3_desc:0 "#high 3#!年ごとに革新の同期を行う。"
 setting_zgrc_innovation_sync_threshold_5:0 "5年ごと"
 setting_zgrc_innovation_sync_threshold_5_desc:0 "#high 5#!年ごとに革新の同期を行う。"

 # ============================================================
 # 天下响应 —— 非常时期封臣表态（事件 1010）
 # ============================================================
 rule_zgrc_luanshi_xiangying:0 "天下響応"
 setting_zgrc_luanshi_xiangying_disabled:0 "閉じる"
 setting_zgrc_luanshi_xiangying_disabled_desc:0 "乱世において、封臣の立場を問わなくなる。"
 setting_zgrc_luanshi_xiangying_player_only:0 "プレイヤーのみ"
 setting_zgrc_luanshi_xiangying_player_only_desc:0 "（封臣である場合の）あなただけが立場を問われ、AIの封臣はこのイベントに煩わされない。"
 setting_zgrc_luanshi_xiangying_enabled:0 "全キャラクター"
 setting_zgrc_luanshi_xiangying_enabled_desc:0 "非常時には、あなたもAIの封臣も立場を問われる。AIの多くは勤王し、少数が挙兵または静観する。"

 # ============================================================
 # 消息通知
 # ============================================================
 zgrc_innovation_sync_toast_title:0 "華夏の革新伝来"
 zgrc_innovation_sync_toast_desc:0 "華夏の諸邦は往来が絶えず、他所の新しい法や良き制度が、すでにあなたの同族の間に伝わり広まっている。"
 # ============================================================
 # 新增士兵
 # ============================================================
 zgrc_hanjia_yiyong:0 "漢家義勇"
 zgrc_hanjia_yiyong_flavor:0 "これら郷勇は平時には農に務め、烽火が上がれば槍を執って従う。槍陣は粗末ながら密集して破りがたく、城攻めでも進んで堀を埋め陣を陥れる。"

 zgrc_yuyang_tuqi:0 "河朔飛騎"
 zgrc_yuyang_tuqi_flavor:0 "河朔の辺郡の弓騎兵は騎射に長け、矢の雨は軽快で絶え間なく、敗走する敵の追撃にきわめて長けており、侵入した騎兵を逃さない。"
 zgrc_liujun_liangjiazi:0 "六郡鉄騎"
 zgrc_liujun_liangjiazi_flavor:0 "天水・隴西など六郡の良家の子弟は、才力人に優れ、幼くして射を習う。重甲を身にまとえば精鋭の鉄騎となり、突撃の勢いは止めようがない。"
 zgrc_hexi_muqi:0 "河西突騎"
 zgrc_hexi_muqi_flavor:0 "河西涼州は水草が豊かで、そこから出る軽騎兵は軽装で弓に長ける。長年辺塞を巡回して守り、来たり去るは風のごとく、襲撃と追撃にきわめて長けている。"
 zgrc_jingchu_weishi:0 "荊楚衛士"
 zgrc_jingchu_weishi_flavor:0 "荊楚の地は昔から強弩で名高く、山沢の間には弩に長けた者が多い。衛士たちは水に拠って陣を組み、連弩を一斉に放ち、矢の雨が空を覆う。"
 zgrc_wuyue_jianshi:0 "呉越剣士"
 zgrc_wuyue_jianshi_flavor:0 "呉越の地は古来剣を尊ぶ。これら剣士は白兵戦では疾風のように素早く、林や沢の間に突き進んで斬り結ぶのを得意とし、勇猛にして死を恐れない。"
 zgrc_wuling_caiguan:0 "五陵材官"
 zgrc_wuling_caiguan_flavor:0 "関中の五陵の間では豪族が土地を兼併し、良家の子弟が材官に選ばれる。材官は足で強弩を張り、重甲をまとい、盾を壁のように構え、関中の精鋭と号される。"
 zgrc_zhongyuan_jieshi:0 "中原介士"
 zgrc_zhongyuan_jieshi_flavor:0 "介とは甲のことである。中原の介士は軽甲をまとって迅速であり、来たり去るは風のごとく、田畑の畦や街巷の間での格闘に長け、集まれば陣をなし、散ればとらえがたい。"

 zgrc_beiwei_zhongbu:0 "背嵬重歩"
 zgrc_beiwei_zhongbu_flavor:0 "主将の帳下の親兵で、みな驍勇の士を選んで充てる。重甲は壁のごとく、陣に臨んでは山岳のように揺るがず、進めば敵の鋭鋒を打ち砕く。"
 zgrc_beiwei_zhongqi:0 "背嵬重騎"
 zgrc_beiwei_zhongqi_flavor:0 "主将の帳下の親衛騎兵で、人馬ともに鉄甲をまとう。陣に臨めば雷霆のごとき勢いで、進めば敵陣を踏み破る。"

 # 华夏锐士 / 华夏突骑 —— 汉传兵法基础兵种（独立兵种）
 zgrc_han_ruishi:0 "華夏鋭士"
 zgrc_han_ruishi_flavor:0 "重甲をまとった鋭士は両手持ちの長刃を手にし、防護と殺傷力を兼ね備える。とりわけ接近戦で馬を斬り陣を破るのに長け、敵の前列を潰走させる。"
 zgrc_han_tuqi:0 "華夏突騎"
 zgrc_han_tuqi_flavor:0 "重甲をまとった精鋭の騎手は、雷霆が耳を貫くかのように敵陣へ突撃する。平原での突撃で敵の隊列を粉砕することも、友軍の側面を援護することもできる。"

 culture_parameter_unlock_maa_yuyang_tuqi:0 "[GetMaA('zgrc_yuyang_tuqi').GetName][men_at_arms|E]を募集できる"
 culture_parameter_unlock_maa_liujun_liangjiazi:0 "[GetMaA('zgrc_liujun_liangjiazi').GetName][men_at_arms|E]を募集できる"
 culture_parameter_unlock_maa_hexi_muqi:0 "[GetMaA('zgrc_hexi_muqi').GetName][men_at_arms|E]を募集できる"
 culture_parameter_unlock_maa_jingchu_weishi:0 "[GetMaA('zgrc_jingchu_weishi').GetName][men_at_arms|E]を募集できる"
 culture_parameter_unlock_maa_wuyue_jianshi:0 "[GetMaA('zgrc_wuyue_jianshi').GetName][men_at_arms|E]を募集できる"
 culture_parameter_unlock_maa_zgrc_wuling_caiguan:0 "[GetMaA('zgrc_wuling_caiguan').GetName][men_at_arms|E]を募集できる"
 culture_parameter_unlock_maa_zhongyuan_jieshi:0 "[GetMaA('zgrc_zhongyuan_jieshi').GetName][men_at_arms|E]を募集できる"
 culture_parameter_unlock_maa_beiwei_zhongbu:0 "[GetMaA('zgrc_beiwei_zhongbu').GetName][men_at_arms|E]を募集できる"
