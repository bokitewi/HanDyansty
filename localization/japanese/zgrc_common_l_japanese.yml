 culture_parameter_unlock_maa_zgrc_han_tuqi:0 "[GetMaA('zgrc_han_tuqi').GetName][men_at_arms|E]を募集できる"

 # ============================================================
 # 汉文明基础兵种革新
 # ============================================================
 innovation_zgrc_han_bingfa:0 "華夏兵法"
 innovation_zgrc_han_bingfa_desc:0 "孫呉の略、司馬の法は、代々伝え習われてきた。教練と閲兵は整然とし、令すれば行われ、禁ずれば止む。"
 innovation_zgrc_han_wubei:0 "帝国の武備"
 innovation_zgrc_han_wubei_desc:0 "冶金鍛造の技は熟達し、甲冑・武器・弓弩の制は完備している。重甲の歩兵と騎兵は、制度に則って軍を成す。"

 # ============================================================
 # 人物 modifier
 # ============================================================
 zgrc_rende_modifier:0 "仁徳の君子"
 zgrc_rende_modifier_desc:0 "義軍が来投しても、彼らを鋒鏑の前に駆り立てるに忍びず、仁徳の名が大いに轟いた。"
 zgrc_gouquan_modifier:0 "苟も性命を全うす"
 zgrc_gouquan_modifier_desc:0 "兵は凶事、戦は危うし。賢明に身を守った。天寿を全うできようが、同胞が難に赴くときに隠忍して出なかったことが、心に重くのしかかる。"
 zgrc_zhongyi_modifier:0 "忠義"
 zgrc_zhongyi_modifier_desc:0 "家を毀ちて難を紓い、財を散じて兵を起こし、君父の難を救った。郷党はその義を称え、士民はその人に心を寄せる。"
 zgrc_yexin_modifier:0 "野心"
 zgrc_yexin_modifier_desc:0 "このキャラクターは旧主に背き、旗を挙げて自立した。その兵鋒を恐れる者もいれば、その人柄を軽蔑する者もいる。"
 # ============================================================
 # 传言系统 —— 祠/像（县 modifier）
 # ============================================================
 zgrc_ci_zhong:0 "忠烈の祠"
 zgrc_ci_zhong_desc:0 "郷人が祠を建て、忠烈を祀っている。義の声が及ぶところ、民心は奮い立つ。"
 zgrc_ci_ren:0 "懐仁の祠"
 zgrc_ci_ren_desc:0 "郷人が祠を建て、仁徳を偲んでいる。仁の声が及ぶところ、民はその生業に安んじる。"
 zgrc_xiang_zui:0 "罪人の像"
 zgrc_xiang_zui_desc:0 "鉄を鋳て像を作り、その罪状を記して、通る者に戒めを知らしめる。"
 zgrc_xiang_ni:0 "逆臣唾棄の像"
 zgrc_xiang_ni_desc:0 "鉄を鋳て像を作り、郷人は通るたびにこれに唾を吐く。悪名はいまだ消えない。"
 # ============================================================
 # 传言系统 —— 主角 modifier
 # ============================================================
 zgrc_shengci_modifier:0 "生祠の香火"
 zgrc_shengci_modifier_desc:0 "郷人が祠を建ててこれを祀り、香火は絶えない。賢名は遠くまで広まり、四方がこれを称える。"
 zgrc_tuozhi_modifier:0 "誰もが唾棄する者"
 zgrc_tuozhi_modifier_desc:0 "悪名高く、郷里では鉄像を鋳てこれに唾を吐く。街を通る人は誰もが白い目で見る。"
 zgrc_tuozhi_ni_modifier:0 "郷邦に悪名を残す"
 zgrc_tuozhi_ni_modifier_desc:0 "逆賊に与した罪により、郷党こぞって見捨てられた。生きては郷人に唾され、死してはその魂まで辱められよう。"
 zgrc_jidan_modifier:0 "憚られる"
 zgrc_jidan_modifier_desc:0 "悪名が知れ渡り、誰もが警戒している。鳴りを潜めて鋭鋒を隠し、再び勢いを張ることはできない。"
 # ============================================================
 # 传言系统 —— 好感修正（opinion modifier）
 # 时长见 common/opinion_modifiers/zgrc_opinion_modifiers.txt
 # 数值由事件按情节轻重在 add_opinion 调用处给定
 # ============================================================
 zgrc_opinion_zhongyi:0 "忠義の名"
 zgrc_opinion_rende:0 "仁徳の名"
 zgrc_opinion_yexin:0 "野心の名"
 zgrc_opinion_funi:0 "逆賊に与した名"

 # ============================================================
 # 祖风 · 跨大区迁居（30 条：名称按源区一致，描述逐方向各异）
 # ============================================================
 zgrc_zufeng_yanzhao_qilu_modifier:0 "燕趙の祖風"
 zgrc_zufeng_yanzhao_qilu_modifier_desc:0 "血気はなお残り、ゆるやかな風俗にはなじめない。礼数が合わず、心穏やかではいられない。"
 zgrc_zufeng_yanzhao_sanhe_modifier:0 "燕趙の祖風"
 zgrc_zufeng_yanzhao_sanhe_modifier_desc:0 "鋭気をあらわにしすぎて郷党に白眼視され、権略も弁舌も振るえない。"
 zgrc_zufeng_yanzhao_qinlong_modifier:0 "燕趙の祖風"
 zgrc_zufeng_yanzhao_qinlong_modifier_desc:0 "弓馬の腕は昔のままだが、土地の言葉は通じない。帰郷の思いは日に日に募り、鬱々として楽しまない。"
 zgrc_zufeng_yanzhao_jingwu_modifier:0 "燕趙の祖風"
 zgrc_zufeng_yanzhao_jingwu_modifier_desc:0 "勇力は衰えていないが、人情に親しめない。権略は振るえず、心は落ち着かない。"
 zgrc_zufeng_yanzhao_dongyi_modifier:0 "燕趙の祖風"
 zgrc_zufeng_yanzhao_dongyi_modifier_desc:0 "弓馬の勇はなお健在だが、塞外の言葉と風俗に隔たりがあり、人情は疎遠である。"

 zgrc_zufeng_qilu_yanzhao_modifier:0 "斉魯の祖風"
 zgrc_zufeng_qilu_yanzhao_modifier_desc:0 "弦歌の習いはなお残るが、剽悍な郷里は文を軽んじる。礼数を施すすべもなく、権略を振るう場もない。"
 zgrc_zufeng_qilu_sanhe_modifier:0 "斉魯の祖風"
 zgrc_zufeng_qilu_sanhe_modifier_desc:0 "文教はもとより相通じるが、礼法は厳しい。権略は振るいがたく、言葉で失敗しやすい。"
 zgrc_zufeng_qilu_qinlong_modifier:0 "斉魯の祖風"
 zgrc_zufeng_qilu_qinlong_modifier_desc:0 "関山は険しく遠く、言葉も風俗も異なる。書と剣を携えて流浪し、鬱々として晴れない。"
 zgrc_zufeng_qilu_jingwu_modifier:0 "斉魯の祖風"
 zgrc_zufeng_qilu_jingwu_modifier_desc:0 "詩書の教えはなお残るが、湿潤の地の人情とは隔たりがある。権略は振るわず、心は落ち着かない。"
 zgrc_zufeng_qilu_dongyi_modifier:0 "斉魯の祖風"
 zgrc_zufeng_qilu_dongyi_modifier_desc:0 "章句の学は捨てずとも、遼海の言葉と風俗に隔たりがあり、人情は疎遠である。"

 zgrc_zufeng_sanhe_yanzhao_modifier:0 "三河の祖風"
 zgrc_zufeng_sanhe_yanzhao_modifier_desc:0 "勤勉で篤実な性はなお残るが、剽悍な土地は穏重を尊ばない。礼数は行いがたく、心穏やかではいられない。"
 zgrc_zufeng_sanhe_qilu_modifier:0 "三河の祖風"
 zgrc_zufeng_sanhe_qilu_modifier_desc:0 "農桑の習いは近いが、礼数の応酬には結局一枚の隔たりがある。心穏やかではいられない。"
 zgrc_zufeng_sanhe_qinlong_modifier:0 "三河の祖風"
 zgrc_zufeng_sanhe_qinlong_modifier_desc:0 "関山に隔てられ、訛りも次第に変わっていく。西に故郷を望み、愁いは晴れない。"
 zgrc_zufeng_sanhe_jingwu_modifier:0 "三河の祖風"
 zgrc_zufeng_sanhe_jingwu_modifier_desc:0 "生業には勤勉だが、江湖の人情は測りがたい。権略は振るわず、心は落ち着かない。"
 zgrc_zufeng_sanhe_dongyi_modifier:0 "三河の祖風"
 zgrc_zufeng_sanhe_dongyi_modifier_desc:0 "極寒の辺境では古い習わしが通じない。言葉と風俗に隔たりがあり、人情は疎遠である。"

 zgrc_zufeng_qinlong_yanzhao_modifier:0 "秦隴の祖風"
 zgrc_zufeng_qinlong_yanzhao_modifier_desc:0 "馬を駆る腕はなお健在だが、剽悍な郷里は文を軽んじる。礼数を施す場もなく、権略も振るえない。"
 zgrc_zufeng_qinlong_qilu_modifier:0 "秦隴の祖風"
 zgrc_zufeng_qinlong_qilu_modifier_desc:0 "鞍馬の習いはなお残るが、揖譲の国では応酬が合わない。心穏やかではいられない。"
 zgrc_zufeng_qinlong_sanhe_modifier:0 "秦隴の祖風"
 zgrc_zufeng_qinlong_sanhe_modifier_desc:0 "馬を駆る気性は中原の礼法になじまない。権略も弁舌も振るえない。"
 zgrc_zufeng_qinlong_jingwu_modifier:0 "秦隴の祖風"
 zgrc_zufeng_qinlong_jingwu_modifier_desc:0 "鞍馬を舟楫に替えても、立ち居振る舞いがなじまない。権略は振るわず、心は落ち着かない。"
 zgrc_zufeng_qinlong_dongyi_modifier:0 "秦隴の祖風"
 zgrc_zufeng_qinlong_dongyi_modifier_desc:0 "関山万里を隔て、昔の技は施すところがない。言葉と風俗に隔たりがあり、人情は疎遠である。"

 zgrc_zufeng_jingwu_yanzhao_modifier:0 "荊呉の祖風"
 zgrc_zufeng_jingwu_yanzhao_modifier_desc:0 "江湖で鍛えた体はなお壮健だが、剽悍な郷里は柔和を尊ばず、礼数は行いがたい。"
 zgrc_zufeng_jingwu_qilu_modifier:0 "荊呉の祖風"
 zgrc_zufeng_jingwu_qilu_modifier_desc:0 "潮を操る勇はなお健在だが、礼義の国では応酬が合わず、心穏やかではいられない。"
 zgrc_zufeng_jingwu_sanhe_modifier:0 "荊呉の祖風"
 zgrc_zufeng_jingwu_sanhe_modifier_desc:0 "軽捷な気性は中原の重厚さになじまない。権略も弁舌も振るえない。"
 zgrc_zufeng_jingwu_qinlong_modifier:0 "荊呉の祖風"
 zgrc_zufeng_jingwu_qinlong_modifier_desc:0 "舟を捨てて馬に乗るも、風土はまるで異なる。言葉は通じず、鬱々として晴れない。"
 zgrc_zufeng_jingwu_dongyi_modifier:0 "荊呉の祖風"
 zgrc_zufeng_jingwu_dongyi_modifier_desc:0 "風物は江南と大いに異なる。言葉と風俗に隔たりがあり、人情は疎遠である。"

 zgrc_zufeng_dongyi_yanzhao_modifier:0 "東夷の祖風"
 zgrc_zufeng_dongyi_yanzhao_modifier_desc:0 "柔順貞信の習いはなお残るが、気概を尊ぶ土地では何かにつけ咎められる。権略を施す場もない。"
 zgrc_zufeng_dongyi_qilu_modifier:0 "東夷の祖風"
 zgrc_zufeng_dongyi_qilu_modifier_desc:0 "礼義はもとより相通じるが、言葉と礼節にはなお合わせる必要がある。"
 zgrc_zufeng_dongyi_sanhe_modifier:0 "東夷の祖風"
 zgrc_zufeng_dongyi_sanhe_modifier_desc:0 "規律は厳しく、権略は振るいがたく、言葉で失敗しやすい。"
 zgrc_zufeng_dongyi_qinlong_modifier:0 "東夷の祖風"
 zgrc_zufeng_dongyi_qinlong_modifier_desc:0 "風土はまるで異なり、言葉も通じず、鬱々として晴れない。"
 zgrc_zufeng_dongyi_jingwu_modifier:0 "東夷の祖風"
 zgrc_zufeng_dongyi_jingwu_modifier_desc:0 "江湖の人情は浮薄で、柔順な者は侮られやすい。権略は振るわず、心は落ち着かない。"

