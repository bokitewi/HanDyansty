l_japanese:
 quix_murder_outcome.1001.t:0 "旅籠の夜火"
 quix_murder_outcome.1001.d:0 "あなたの共謀者が探り出したところでは、[target.GetTitledFirstName]は今回の旅で、道端のある旅籠に泊まるという。その宿の梁や柱はすべて古く朽ちた木で、軒下には薪や柴が山と積まれている。夜半に火を一つ放てば、[target.GetSheHe]は逃れようもない。夜が明ければ、誰もがただの失火だと思うだろう。"
 quix_murder_outcome.1001.a:0 "一炬のもとに焼き払え。"
 quix_murder_outcome.1001.b:0 "あの旅籠は我がよく泊まる宿だ。やめておこう。"
 quix_murder_outcome.1002.t:0 "楼上の冷箭"
 quix_murder_outcome.1002.d:0 "[target.GetTitledFirstName]は毎日午後になると、一人で欄干にもたれて楼台にしばらく佇むのを好む。通りの向かいにはちょうど酒楼があり、その二階なら弓手一人を潜ませられる。両所の距離は近く、矢一本で片が付くだろう。"
 quix_murder_outcome.1002.a:0 "弓の名手を呼べ。"
 quix_murder_outcome.1002.b:0 "[target.GetFirstNameNoTooltip]には、これほど楽な死に方はふさわしくない。"
 quix_murder_outcome.1003.t:0 "一壺の美酒"
 quix_murder_outcome.1003.d:0 "[target.GetName]が酒好きであることは誰もが知っている。得がたい美酒を一甕用意してひそかに毒を仕込み、崇拝者の名を騙って贈ればよい。"
 quix_murder_outcome.1003.a:0 "この贈り物こそ、あの者の好みに合う。"
 quix_murder_outcome.1003.b:0 "この鴆酒は、他日のために取っておこう。"
 quix_murder_outcome.1004.t:0 "夜道は危うし"
 quix_murder_outcome.1004.d:0 "あなたの共謀者が気づいたところでは、[target.GetName]には夜に一人で散歩する習慣がある。あらかじめ道端に潜んでいれば、[target.GetHerHim]を音もなく消し去ることができる。"
 quix_murder_outcome.1004.a:0 "その怯えた顔を誰も見られぬのが惜しい。"
 quix_murder_outcome.1004.b:0 "この計は容易すぎる。もっと妙案があるはずだ。"
 quix_murder_outcome.1005.t:0 "危うき壁の下"
 quix_murder_outcome.1005.d:0 "[target.GetName]はよく城壁の下の中庭でひと休みしている。その一角の城壁は長年修繕されておらず、前もって大石をいくつか緩めておけば、落ちてきた石がちょうど[target.GetHerHim]の上に落ちるだろう。"
 quix_murder_outcome.1005.a:0 "行け、壁の石を緩めてこい。"
 quix_murder_outcome.1005.b:0 "[target.GetFirstNameNoTooltip]のために我が城壁を壊すなど、割に合わぬ。"
 quix_murder_outcome.1006.t:0 "門を開いて盗賊を招く"
 quix_murder_outcome.1006.d:0 "[target.GetTitledFirstName]の屋敷の使用人の一人があなたの金を受け取り、夜にあなたの手の者のために寝所の扉を開けると約束した。この者が約束を守りさえすれば、[target.GetSheHe]は今夜を越せない。"
 quix_murder_outcome.1006.a:0 "あの奴僕の口さえ封じればよい。"
 quix_murder_outcome.1006.b:0 "罠かもしれぬ。やめておけ。"
 quix_murder_outcome.1007.t:0 "地下道からの夜襲"
 quix_murder_outcome.1007.d:0 "[target.GetTitledFirstName]の住まいに直接通じる秘密の地下道がある。あなたの手の者は地下道から忍び込み、戸口の護衛を制圧し、[target.GetHerHim]を殺して、来た道を引き返すつもりだ。"
 quix_murder_outcome.1007.a:0 "諸君の勇壮なること、天の加護あれ！"
 quix_murder_outcome.1007.b:0 "この計は危険すぎる。慎重に事を運ぶべきだ。"
 quix_murder_outcome.1008.t:0 "夜の騎馬襲撃"
 quix_murder_outcome.1008.d:0 "[target.GetName]は近隣の城邑へ赴こうとしており、帰りは必ず日が暮れるだろう。あなたの手の者は駿馬に乗って途中で[target.GetHerHim]を襲い殺し、追手が来る前に遠くへ逃げ去ることができる。"
 quix_murder_outcome.1008.a:0 "最も騎乗に長けた者を、我が最も速い馬に乗せて遣わせ。"
 quix_murder_outcome.1008.b:0 "この計はあまりに卑劣だ。行わぬ。"
 quix_murder_outcome.1009.t:0 "偽医者"
 quix_murder_outcome.1009.d:0 "[target.GetTitledFirstName]は砭石で血を抜いて病を治すことで名高い医工を招こうとしており、そのやり取りの書簡がすでにあなたの手に落ちている。誰かを遣わして名を騙って約束に赴かせれば、[target.GetSheHe]は自らの手で命を差し出すことになるだろう。"
 quix_murder_outcome.1009.a:0 "[target.GetTitledFirstNameNoTooltip]は自ら網にかかった。計画どおりに行え。"
 quix_murder_outcome.1009.b:0 "万一、かえって[target.GetHerHim]を治してしまったらどうする？"
 quix_murder_outcome.1010.t:0 "儺面の刺客"
 quix_murder_outcome.1010.d:0 "城中で大儺が行われることになり、[target.GetTitledFirstName]は儺を見物して宴に赴くという。その時には儺面をつけた舞い手が場に満ちるので、あなたの手の者は面をかぶって紛れ込むだけで、疑われることなく[target.GetHerHim]のそばに近づける。"
 quix_murder_outcome.1010.a:0 "儺戯であれば、何人か多く遣わしてともに舞わせよ。"
 quix_murder_outcome.1010.b:0 "容易すぎる。罠かもしれぬ。"
 quix_murder_outcome.1011.t:0 "胡の客"
 quix_murder_outcome.1011.d:0 "あなたの共謀者が、遠方からやってきた胡人の武人と知り合った。この者は武芸に秀で、行方をくらますことにも慣れている。報酬さえ見合えば、[target.GetTitledFirstName]の命を取るのは造作もないはずだ。"
 quix_murder_outcome.1011.a:0 "この地に縁もゆかりもない者を雇うのがよい。"
 quix_murder_outcome.1011.b:0 "事は重大だ。見知らぬ者に託すわけにはいかぬ。"
 quix_murder_outcome.1012.t:0 "猛犬をけしかける"
 quix_murder_outcome.1012.d:0 "[target.GetName]は野外を一人で散歩するのを好む。あなたの手の者は飼い慣らした猛犬を何頭か放ち、[target.GetHerHis]死を野獣に襲われたことにすればよい。"
 quix_murder_outcome.1012.a:0 "最も獰猛なものを選び、数日飢えさせておけ。"
 quix_murder_outcome.1012.b:0 "畜生のすることなど、当てにはならぬ。"
 quix_murder_outcome.1013.t:0 "温泉"
 quix_murder_outcome.1013.d:0 "[target.GetName]はよく一人で城外の温泉に入浴しに行く。そこには護衛がおらず、[target.GetSheHe]も武器を身に帯びていない。手を下す絶好の機会だ。"
 quix_murder_outcome.1013.a:0 "温泉で命を落としたとの知らせを静かに待とう。"
 quix_murder_outcome.1013.b:0 "どうも胸騒ぎがする。"
 quix_murder_outcome.1014.t:0 "川辺での偶然の出会い"
 quix_murder_outcome.1014.d:0 "あなたは道中で偶然、[target.GetName]が一人で川岸に立っているのに出くわした。川の流れは急で、あたりには誰もいない――背後からひと押しするだけでよい。"
 quix_murder_outcome.1014.a:0 "いっそ[target.GetTitledFirstNameNoTooltip]を送ってやろう。"
 quix_murder_outcome.1014.b:0 "好機ではあるが、我が手を血で汚すわけにはいかぬ。"
 quix_murder_outcome.1015.t:0 "白昼の暗殺"
 quix_murder_outcome.1015.d:0 "あなたはもう十分に待った。これ以上巧妙な手が思いつかない以上、人を遣わして通りで[target.GetTitledFirstName]を襲い殺させるまでだ。この方法は単純だが、最も隠しにくくもある。"
 quix_murder_outcome.1015.a:0 "刺客にただちに手を下させよ。"
 quix_murder_outcome.1015.b:0 "いかん、別に万全の策を練るべきだ。"
 quix_murder_outcome.1016.t:0 "偽令による捕縛"
 quix_murder_outcome.1016.d:0 "あなたの手の者は文書を一通偽造し、命を受けて捕縛すると偽って、通りで[target.GetTitledFirstName]を連れ去るつもりだ。見物人と護衛の目さえごまかせれば、[target.GetHerHim]を誰も気に留めない場所へ連行して始末できる。"
 quix_murder_outcome.1016.a:0 "この計は使える。"
 quix_murder_outcome.1016.b:0 "この計は使えぬ。"
 quix_murder_outcome.1017.t:0 "吹き矢"
 quix_murder_outcome.1017.d:0 "あなたの手の者が、南中の蛮夷の奇妙な武器を手に入れた。一本の竹筒で、遠くから細い飛び針を吹き出すことができる。針に毒を塗っておけば、近づく必要すらなく[target.GetName]の命を奪えるだろう。"
 quix_murder_outcome.1017.a:0 "見事な道具だ。"
 quix_murder_outcome.1017.b:0 "大事を一本の空竹に託せるものか！"
 quix_murder_outcome.1018.t:0 "自ら短刀を執る"
 quix_murder_outcome.1018.d:0 "共謀者たちが言い争うのは、もう聞き飽きた。[target.GetTitledFirstName]がどこで寝ているかわかっているのだから、自ら窓から忍び込み、[target.GetSheHe]が目覚めぬうちに、一気に片を付ければよい。"
 quix_murder_outcome.1018.a:0 "我が頭巾と短刀を持て！"
 quix_murder_outcome.1018.b:0 "万一露見すれば、身も名も滅ぶ。やめておけ。"
 quix_murder_outcome.1019.t:0 "唖の力士"
 quix_murder_outcome.1019.d:0 "屈強な体つきの異郷の角抵力士が、生計を求めてあなたの領内に流れてきた。この者は土地の言葉が通じず、古傷のせいで口もきけない。[target.GetTitledFirstName]を除くという声なき仕事を任せるにはうってつけだ。"
 quix_murder_outcome.1019.a:0 "この者なら喜んで我が用に供するだろう！"
 quix_murder_outcome.1019.b:0 "このような粗野な者に、大任は務まらぬ。"
 quix_murder_outcome.1020.t:0 "探丸の党"
 quix_murder_outcome.1020.d:0 "あなたの共謀者が、謎めいた街の若者の一味と渡りをつけた。この連中は金を受けて人を殺し、手を下す前に皆で丸を探り、引き当てた色によって誰が手を下すかを決めるといい、これまで仕損じたことがない。彼らはあなたのために[target.GetTitledFirstName]を除けると豪語している。あなたは彼らについてほとんど何も知らないが、仕事ぶりが鮮やかだという評判は確かに嘘ではない。"
 quix_murder_outcome.1020.a:0 "これほど謎めいているなら、事を成せるか見てみたいものだ。"
 quix_murder_outcome.1020.b:0 "これほど謎めいていては、我は安心できぬ。"
 quix_murder_outcome.2001.t:0 "旅籠の夜火"
 quix_murder_outcome.2001.opening_1:0 "[target.GetName]は火の海に呑まれて死んだ。"
 quix_murder_outcome.2001.opening_2:0 "火は予想より早く上がった。火付け役はいっそのこと、数人の宿泊客もろとも[target.GetName]を戸口の中に閉じ込めてしまった。[target.GetSheHe]がよりにもよってあの夜その宿に泊まっていたのが運の尽きだ。"
 quix_murder_outcome.2001.opening_3:0 "大火は一晩中燃え続け、あの旅籠を跡形もなく焼き尽くした。[target.GetName]には逃げる機会すらなかった。"
 quix_murder_outcome.2001.heh:0 "\n\nあの天を衝く炎を思い出すと、あなたはなぜか少し美しかったとさえ感じた。"
 quix_murder_outcome.2001.owner_is_known_1:0 "\n\nだが誰もが、この「失火」はあなたが仕組んだものだと思い込んでいる。"
 quix_murder_outcome.2001.owner_is_known_2:0 "\n\n誰が秘密を漏らしたのかはわからないが、今や町じゅうで、あなたが[target.GetTitledFirstName]の命を奪ったのだと噂されている。"
 quix_murder_outcome.2001.no_awareness_1:0 "\n\n幸い宿は瓦一枚残さず焼け落ち、あなたに疑いをかける者はいなかった。"
 quix_murder_outcome.2001.no_awareness_2:0 "\n\n火付け役を見た者は、皆その宿とともに灰になった。"
 quix_murder_outcome.2001.a.discovered:0 "火付けをした者はただの狂徒だ。我に何の関わりがある！"
 quix_murder_outcome.2001.a:0 "今後は寝台の脇に常に水甕を置いておかねば。"
 quix_murder_outcome.2002.t:0 "楼上の冷箭"
 quix_murder_outcome.2002.opening_1:0 "聞けばあの矢は[target.GetName]の喉を正確に射抜き、[target.GetSheHe]は自らの血にむせて死んだという。"
 quix_murder_outcome.2002.opening_2:0 "聞けば[target.GetName]は矢を受けた後に欄干を越え、楼上から真っ逆さまに落ちて、ちょうど通りかかった荷車の上に叩きつけられたという……"
 quix_murder_outcome.2002.opening_3:0 "[target.GetName]は腹に矢を受け、傷ついた体を引きずって屋内に戻ったが、ほどなくして重傷のため息絶えた。"
 quix_murder_outcome.2002.owner_is_known_1:0 "\n\nあいにく弓手が捕らえられ、あなたの名を白状してしまった。"
 quix_murder_outcome.2002.owner_is_known_2:0 "\n\nあまりに見事な一矢だったので、弓手自身も得意になって有頂天になり、あなたが大金を出して[target.GetTitledFirstName]の命を取るよう頼んだのだと、会う人ごとに自慢して回った！"
 quix_murder_outcome.2002.no_awareness_1:0 "\n\n見る目のある者には暗殺だとわかったが、黒幕があなただと見抜いた者はいなかった。"
 quix_murder_outcome.2002.no_awareness_2:0 "\n\n何より肝心なのは、弓手がきれいに逃げおおせたことだ。"
 quix_murder_outcome.2002.a.discovered:0 "我はただ驢馬を射よと命じただけだ。こんな誤解になろうとは！"
 quix_murder_outcome.2002.a:0 "今夜は楼に上るまい。"
 quix_murder_outcome.2003.t:0 "一壺の美酒"
 quix_murder_outcome.2003.opening_1:0 "[target.GetName]は昨夜、眠ったまま息を引き取った。"
 quix_murder_outcome.2003.opening_2:0 "聞けば[target.GetTitledFirstName]は酔った後に正気を失い、何刻もの間狂い乱れたあげく、最後には血を吐いて死んだという。"
 quix_murder_outcome.2003.opening_3:0 "[target.GetTitledFirstName]は死んだ。臨終の数刻は耐えがたい苦しみで、叫び、血を咳き込み、狂ったようにわめき続けた。"
 quix_murder_outcome.2003.owner_is_known_1:0 "\n\n悪い知らせは、酒を届けた者があなたを巻き込んだことだ――拷問にかける前に、すべて白状してしまった。"
 quix_murder_outcome.2003.owner_is_known_2:0 "\n\nあなたは致命的な見落としをした。酒甕の底に、なんとあなたの家の名が刻まれていたのだ。まったく愚の骨頂である。"
 quix_murder_outcome.2003.no_awareness_1:0 "\n\nどうやら誰もこれを殺人だと疑ってはおらず、ましてあなたを疑う者などいない。"
 quix_murder_outcome.2003.no_awareness_2:0 "\n\n事に関わった者は皆固く口を閉ざしており、あなたの役割を知る者はいない。"
 quix_murder_outcome.2003.a.discovered:0 "あの酒に毒が？幸い我は飲まなかった！"
 quix_murder_outcome.2003.a:0 "結局は酒の飲みすぎで死んだのだ。"
 quix_murder_outcome.2004.t:0 "夜道は危うし"
 quix_murder_outcome.2004.opening_1:0 "[target.GetName]がいつものように夕方散歩に出ると、あなたの刺客が短刀を握って暗がりから飛びかかった。[target.GetTitledFirstName]は逃げようとしたが、暗闇の中で突き倒され、一刀のもとに絶命した。"
 quix_murder_outcome.2004.opening_2:0 "[target.GetTitledFirstName]が我に返る間もなく、冷たい刃が[target.GetHerHis]喉に突き刺さっていた。ほどなくして、[target.GetSheHe]は自らの血だまりの中に倒れ伏した。"
 quix_murder_outcome.2004.opening_3:0 "刺客は暗がりから[target.GetTitledFirstName]をずっと尾けていた。[target.GetSheHe]は気づいて慌てふためき、荒野へと逃げ込んだが、結局は無駄だった――刺客は追いつき、背後から深々と突き刺した。"
 quix_murder_outcome.2004.owner_is_known_1:0 "\n\nあいにく事はすんなりとは運ばなかった。近くを夜回りしていた亭卒がその場で刺客を捕らえたのだ。ほどなく、あなたが関わっていたことは誰もが知るところとなるだろう。"
 quix_murder_outcome.2004.owner_is_known_2:0 "\n\nほどなくして死体が見つかり、刺客も捕まって、あなたの名を白状した。"
 quix_murder_outcome.2004.no_awareness_1:0 "\n\n刺客はついでに[target.GetTitledFirstName]の財布も空にしたので、ありふれた強盗殺人にしか見えない。"
 quix_murder_outcome.2004.no_awareness_2:0 "\n\n刺客は夜陰に紛れて悠々と逃げおおせ、現場には次第に冷えていく死体が一つ残されただけだった。"
 quix_murder_outcome.2004.a.discovered:0 "夜道は危険だ。こうした災難も避けられまい。"
 quix_murder_outcome.2004.a:0 "よろしい、夜道はやはり危ういものだ。"
 quix_murder_outcome.2005.t:0 "危うき壁の下"
 quix_murder_outcome.2005.opening_1:0 "落石が頭上から直撃し、[target.GetTitledFirstName]はその場で絶命した。最期まで、自分がどうして死んだのかもわからなかっただろう。"
 quix_murder_outcome.2005.opening_2:0 "[target.GetTitledFirstName]は死んだ。[target.GetSheHe]は巨石に押し潰されて骨は砕け、体はばらばらになり、衛士が[target.GetHerHim]を掘り出す前に息絶えた。"
 quix_murder_outcome.2005.opening_3:0 "聞けば[target.GetTitledFirstName]は最後の瞬間に煉瓦や石の砕ける音を聞きつけ、振り返ったとたんに巨石が頭上から落ちてきて、凄まじい悲鳴を一つ残しただけだったという。"
 quix_murder_outcome.2005.owner_is_known_1:0 "\n\n不運なことに、あなたの手の者も城壁から足を踏み外して落ち、衛士に生け捕りにされた。ほどなく、あなたが関わっていたことは誰もが知るところとなるだろう。"
 quix_murder_outcome.2005.owner_is_known_2:0 "\n\nところが、あなたの手の者が城壁から降りようとしたところを、衛士に見つかって捕らえられた。ほどなく、あなたが黒幕だということは誰もが知るところとなるだろう。"
 quix_murder_outcome.2005.no_awareness_1:0 "\n\n誰もが、ただの事故にすぎないと言っている……あなたもまったく同感だ。"
 quix_murder_outcome.2005.no_awareness_2:0 "\n\nどうやら不運な事故にすぎないようだ。たとえ疑念を抱く者がいても、あなたに疑いが向くことは決してない。"
 quix_murder_outcome.2005.a.discovered:0 "職人を呼べ。我が城壁も修繕せねばならぬ。"
 quix_murder_outcome.2005.a:0 "その有様をこの目で見られなかったのが惜しい。"
 quix_murder_outcome.2006.t:0 "門を開いて盗賊を招く"
 quix_murder_outcome.2006.opening_1:0 "[target.GetName]の殺害はすこぶる順調に運んだ。あの使用人は金を受け取ると、夜明け前にあなたの刺客を寝室に招き入れた。"
 quix_murder_outcome.2006.opening_2:0 "[target.GetTitledFirstName]は死の間際、[target.GetHerHim]を裏切った使用人をむんずとつかんだ。息絶える前に[target.GetSheHe]が罵ったのは、刺客ではなくあの裏切り者の奴僕だった。"
 quix_murder_outcome.2006.opening_3:0 "不忠の使用人が扉を開け、[target.GetTitledFirstName]は死んだ！[target.GetSheHe]はそのとき奥の間にいてまったく無防備で、扉が開け放たれ、刺客が踏み込んでくるまで気づかなかった。"
 quix_murder_outcome.2006.owner_is_known_1:0 "\n\n不運なことに、この一刀は音もなくとはいかず、刺客は守衛を起こしてしまった！最悪の事態に備えておかねばならない。"
 quix_murder_outcome.2006.owner_is_known_2:0 "\n\n刺客は事の後まもなく捕らえられた。死体が見つかれば、あなたが黒幕だと誰もが知ることになるだろう。"
 quix_murder_outcome.2006.no_awareness_1:0 "\n\nあの使用人の手助けのおかげで、事はずっと順調に運んだ。守衛が気づく前に、あなたの刺客はとうに目的を果たして逃げおおせていた。"
 quix_murder_outcome.2006.no_awareness_2:0 "\n\n事を成し遂げた後、刺客はひっそりと[target.GetTitledFirstName]の屋敷を後にした。"
 quix_murder_outcome.2006.a.discovered:0 "家の奴僕が主を殺したのだ。我に何の関わりがある！"
 quix_murder_outcome.2006.a:0 "頼りになる者は、まことに得がたいものよ。"
 quix_murder_outcome.2007.t:0 "地下道からの夜襲"
 quix_murder_outcome.2007.opening_1:0 "あなたの勇士たちが寝室で[target.GetTitledFirstName]の首を斬り落とした！この夜襲は大成功に終わった。"
 quix_murder_outcome.2007.opening_2:0 "あなたの手の者は[target.GetName]がぐっすり眠っているのを見つけ、一刀で[target.GetHerHis]喉をかき切った！"
 quix_murder_outcome.2007.opening_3:0 "あなたの手の者が踏み込んだとき、[target.GetTitledFirstName]は誰かと同衾しており、その場で寝台の上に斬り伏せられた！"
 quix_murder_outcome.2007.owner_is_known_1:0 "\n\nあいにく事は計画どおりにはいかなかった。一同は踏み込むなり守衛に出くわし、慌てて退くほかなかった。負傷して敵の手に落ちた者がおり、すでにすべて白状してしまった！"
 quix_murder_outcome.2007.owner_is_known_2:0 "\n\n夜襲そのものは順調だったが、同行した者の中に忠誠心の足りない者がいた。この者は他人から賄賂を受け取り、計画の一部始終をあなたの名もろとも漏らしてしまったのだ！卑劣な裏切り者め！"
 quix_murder_outcome.2007.no_awareness_1:0 "\n\n一同は行く手を阻む者をすべて制圧し、来た道から引き上げた。その間、茶を一杯飲むほどの時間もかからなかった。"
 quix_murder_outcome.2007.no_awareness_2:0 "\n\n目的は果たしたものの、撤退の際に守衛に気づかれ、一同は死に物狂いで戦い抜くほかなかった！幸い彼らは厩舎まで駆けつけ、馬を奪って悠々と去った。捕らえられた者は一人もおらず、襲撃者が誰なのかは今なお誰も知らない。"
 quix_murder_outcome.2007.a.discovered:0 "彼らが我を憎もうと構わぬ。恐れさえすれば十分だ。"
 quix_murder_outcome.2007.a:0 "諸君、ご苦労であった。今夜は安らかに眠れよう。"
 quix_murder_outcome.2008.t:0 "夜の騎馬襲撃"
 quix_murder_outcome.2008.opening_1:0 "あなたの騎手が[target.GetTitledFirstName]を殺した。彼は打ち捨てられた草葺きの小屋から飛び出し、[target.GetTitledFirstName]の供回りの脇をすり抜け、皆が我に返る前に、長矛で[target.GetHerHis]胸を貫いていた！"
 quix_murder_outcome.2008.opening_2:0 "[target.GetName]は死んだ。あなたの騎手が林の中から一矢を放ち、その場で[target.GetHerHim]を射殺したのだ！"
 quix_murder_outcome.2008.opening_3:0 "[target.GetName]はついに死んだ。あなたの騎手は馬を駆って供回りの脇を疾走し、間近に迫ってからようやく刀を抜き、一刀で[target.GetTitledFirstName]を斬り伏せると、たちまち砂煙を残して走り去った。"
 quix_murder_outcome.2008.owner_is_known_1:0 "\n\n不運なことに、馬がつまずいて騎手を鞍から振り落とした。騎手は捕らえられ、あなたの企みも露見してしまった！"
 quix_murder_outcome.2008.owner_is_known_2:0 "\n\nよりにもよって、騎手は物音を聞きつけて駆けつけた巡回中の衛士とまともに鉢合わせしてしまった！陰謀はすでに露見した。"
 quix_murder_outcome.2008.no_awareness_1:0 "\n\n騎手が乗っていたのはあなたの最も優れた駿馬で、追手はまるで及ばず、彼はあっという間に林の中へ消えた！"
 quix_murder_outcome.2008.no_awareness_2:0 "\n\n皆が何が起きたのか理解する前に、あなたの騎手はとうに遠くへ去っていた！"
 quix_murder_outcome.2008.a.discovered:0 "夜は暗く見分けがつかず、猛獣と見誤っただけだ！"
 quix_murder_outcome.2008.a:0 "この道はやはり危うい。"
 quix_murder_outcome.2009.t:0 "偽医者"
 quix_murder_outcome.2009.opening_1:0 "[target.GetName]は死んだ！あなたが遣わした偽医工は[target.GetHerHis]血を抜き尽くし、帰り際には家人に、病人は長いことぐっすり眠るので決して邪魔をしないようにと言い含めていった。"
 quix_murder_outcome.2009.opening_2:0 "[target.GetName]はあなたが遣わした偽医工によって黄泉路へと送られた！[target.GetSheHe]は相手に手首を委ね、最後にもう一度目を閉じ、柔らかな枕にもたれて安らかに眠りについた。"
 quix_murder_outcome.2009.opening_3:0 "[target.GetName]は名を騙った医工を家に招き入れ、自ら手首を差し出して血を抜かせた。血が流れすぎて初めて、[target.GetSheHe]は信じる相手を誤ったと悟った。"
 quix_murder_outcome.2009.owner_is_known_1:0 "\n\nところがあの偽者は門を出る前に、本物の医工を知る者に見破られてしまった！あなたの陰謀はこれで露見した。"
 quix_murder_outcome.2009.owner_is_known_2:0 "\n\nところが門を出る前に、あなたの手の者は見つかって捕らえられてしまった！今や事の一部始終が知れ渡っている。"
 quix_murder_outcome.2009.no_awareness_1:0 "\n\nあなたの偽医工はそのまま堂々と門を出て、夜の闇に消えていった！"
 quix_murder_outcome.2009.no_awareness_2:0 "\n\n立ち去る前に、屋敷の者が何人も診察を頼んできた！彼はやむなく一人一人に刺絡を施し、丸一晩忙殺されて、夜明け近くになってようやく抜け出した。"
 quix_murder_outcome.2009.a.discovered:0 "我はあの者に良医を推薦しただけだ。他意などあるものか！"
 quix_murder_outcome.2009.a:0 "病はことごとく除かれ、もはや後の憂いはない。"
 quix_murder_outcome.2010.t:0 "儺面の刺客"
 quix_murder_outcome.2010.opening_1:0 "儺の舞がたけなわを迎えたところで、[target.GetName]がその場で殺された！あなたの刺客は舞い手に紛れ込み、周りの目を逸らして、[target.GetTitledFirstName]の背中に一刀を突き立てたのだ！"
 quix_murder_outcome.2010.opening_2:0 "[target.GetName]は満座の賓客の目の前で殺された。刃が[target.GetHerHis]胸に沈んだとき、皆はその場で呆然とし、儺戯の何か奇妙な趣向だと思っていた！"
 quix_murder_outcome.2010.opening_3:0 "あなたの刺客は人混みの中から[target.GetName]をひと気のない部屋へ引きずり込み、[target.GetSheHe]は悲鳴を上げて息絶えた！"
 quix_murder_outcome.2010.owner_is_known_1:0 "\n\nあなたの手の者の大半は逃げたが、手を血まみれにした一人がその場で捕らえられた！あなたが関わっていたことは、すでに誰もが知るところとなった！"
 quix_murder_outcome.2010.owner_is_known_2:0 "\n\nあいにく人混みの中には血の気の多い連中が少なくなく、[target.GetName]が叫び声を上げるや、場は大混乱に陥った！あなたの手の者が何人か負傷して捕らえられ、この計略はもう誰もが知るところとなった！"
 quix_murder_outcome.2010.no_awareness_1:0 "\n\nあなたの手の者は混乱に乗じて散り散りになり、暗がりに入るなり面を捨て、舞衣を脱ぎ、血を拭い、それぞれひそかに立ち去った。捕らえられた者は一人もいない！"
 quix_murder_outcome.2010.no_awareness_2:0 "\n\n一同は面をかぶっていたので誰が誰かもわからず、行く手を阻む者を次々と打ち倒した。捕らえられた者は一人もおらず、この件があなたに関わっていると気づいた者もいないようだ。"
 quix_murder_outcome.2010.a.discovered:0 "儺戯が度を越しただけのこと。我に何の関わりがある？"
 quix_murder_outcome.2010.a:0 "我が自ら赴かなかったのが惜しい。さぞ面白かったろうに。"
 quix_murder_outcome.2011.t:0 "胡の客"
 quix_murder_outcome.2011.opening_1:0 "[target.GetName]は死んだ！この胡の客は噂どおりの優れた刺客であることが証明された。"
 quix_murder_outcome.2011.opening_2:0 "胡の客の奇妙な曲刀が[target.GetTitledFirstName]の喉を切り裂き、この取引はこれで片が付いた。"
 quix_murder_outcome.2011.opening_3:0 "あなたが雇った胡の客はひそかに[target.GetName]の住まいに忍び込み、[target.GetHerHis]命を絶った！"
 quix_murder_outcome.2011.owner_is_known_1:0 "\n\nだがこの胡人は噂ほど逃げ足が巧みではなく、捕らえられてしまった！"
 quix_murder_outcome.2011.owner_is_known_2:0 "\n\nあいにく刺客は屋敷からは逃げ出せたものの、土地勘がなく、いくらも行かないうちに捕らえられた！"
 quix_murder_outcome.2011.no_awareness_1:0 "\n\n事を成し遂げた後、あの胡の客はまるで煙のように消え失せた――少なくとも衛士たちはそう言っている。あなたとこの件との関わりも、多くの内情も、誰にも知られていない！"
 quix_murder_outcome.2011.no_awareness_2:0 "\n\nあの胡の客は城を出るとすぐに西へ向かう隊商に紛れ込み、それきり消息を絶った。彼の背後に雇い主がいたなどとは、誰も思いもしなかった。"
 quix_murder_outcome.2011.a.discovered:0 "次は身内の者を使うべきだな。"
 quix_murder_outcome.2011.a:0 "今夜は彼を招いて一杯酌み交わそう。"
 quix_murder_outcome.2012.t:0 "猛犬をけしかける"
 quix_murder_outcome.2012.opening_1:0 "[target.GetTitledFirstName]は悲鳴を上げながら猛犬にずたずたに引き裂かれた。"
 quix_murder_outcome.2012.opening_2:0 "[target.GetTitledFirstName]は犬の群れから抜け出したが、結局はあの獣どもより速く走ることはできなかった。"
 quix_murder_outcome.2012.opening_3:0 "猛犬が[target.GetTitledFirstName]の喉を引き裂いた。あなたはついに[target.GetHerHim]を除いたのだ。"
 quix_murder_outcome.2012.owner_is_known_1:0 "\n\nだが[target.GetSheHe]の助けを求める声が守衛を呼び寄せた。猛犬はその場で殺され、犬使いも捕らえられて、尋問の際にあなたの名を白状した。"
 quix_murder_outcome.2012.owner_is_known_2:0 "\n\n事の後、ひどく飢えていた犬どもが犬使いの叱声にも構わずその場で貪り始め、ほどなくしてこの恐ろしい光景が人に見られ、犬使いはそのために捕らえられた！厳しく問い詰められて、彼はどうやらあなたの名を口にしたらしい。"
 quix_murder_outcome.2012.no_awareness_1:0 "\n\n犬使いは犬を引き連れて来た道を戻り、道中誰にも咎められなかった。"
 quix_murder_outcome.2012.no_awareness_2:0 "\n\nすべて順調に運んだ。人々はおおかた、これを山犬や狼、虎や豹の仕業とするだろう。"
 quix_murder_outcome.2012.a.discovered:0 "獣が人を傷つけたのを、どうして我のせいにできよう？"
 quix_murder_outcome.2012.a:0 "よしよし、いい犬だ。"
 quix_murder_outcome.2013.t:0 "温泉"
 quix_murder_outcome.2013.opening_1:0 "[target.GetTitledFirstName]は入浴中にあなたの手の者に殺された。彼らは[target.GetHerHim]が一人きりで無防備なところを狙って手を下し、いくらか手こずったものの、結局は仕留めた。"
 quix_murder_outcome.2013.opening_2:0 "今日、[target.GetName]の血が温泉を赤く染めた。"
 quix_murder_outcome.2013.opening_3:0 "[target.GetTitledFirstName]は素手であなたの手の者としばらく格闘し、意外なほど手ごわかったが、最後には湯船に押し込まれて溺れ死んだ。"
 quix_murder_outcome.2013.owner_is_known_1:0 "\n\nだが[target.GetTitledFirstName]の悲鳴が浴堂に響き渡って衛士を呼び寄せ、あなたの手の者はその場で捕らえられた！"
 quix_murder_outcome.2013.owner_is_known_2:0 "\n\nこの格闘で、あなたの刺客たちも全身に返り血を浴びた。彼らは洗い流す暇もなく逃げ出したが、ほどなく血まみれの姿を見られ、その場で捕らえられた。今やあなたの役割は誰もが知るところとなった。"
 quix_murder_outcome.2013.no_awareness_1:0 "\n\nあなたの手の者は無事に引き上げ、あなたが関わっていたことを知る者はいない。"
 quix_murder_outcome.2013.no_awareness_2:0 "\n\n格闘の物音を聞きつけて温泉に居合わせた入浴客が何人かやってきたが、彼らもまた刺客たちにまとめて片付けられた。生き証人がいない以上、あなたまでたどり着くことはもうできない！"
 quix_murder_outcome.2013.a.discovered:0 "我は潔白だ。洗い流すべきものなどない！"
 quix_murder_outcome.2013.a:0 "[target.GetFirstNameNoTooltip]も、これできれいさっぱり洗い流されたな。"
 quix_murder_outcome.2014.t:0 "川辺での偶然の出会い"
 quix_murder_outcome.2014.opening_1:0 "あなたはまっすぐ[target.GetName]の背後に歩み寄った。[target.GetSheHe]は川の流れを見つめてぼんやりとし、身じろぎもしない。あなたはいきなり手を伸ばし、[target.GetHerHim]を急流の中へ突き落とした！[target.GetHerHis]頭が最後に水中に沈む前に、二人はしばし見つめ合った。あのとき、あなたはおそらく笑っていたのだろう。"
 quix_murder_outcome.2014.opening_2:0 "あなたは音もなく近づくつもりだったが、[target.GetName]は足音を聞きつけたかのように、最後の瞬間に振り返った。「さらばだ」あなたは小声でそう言いながら、[target.GetHerHim]を急流の中へ突き落とした！"
 quix_murder_outcome.2014.opening_3:0 "あなたは数歩助走をつけ、全身の力を込めて[target.GetTitledFirstName]を蹴り飛ばし、[target.GetHerHim]を急流の中へ蹴り落とした。[target.GetSheHe]は岩に激しく打ちつけられ、そのまま朽ち木のように下流へと流されていった。"
 quix_murder_outcome.2014.owner_is_known_1:0 "\n\nあいにくあなたは大胆すぎた――この罪には、あなたの見落とした目撃者がいたのだ！"
 quix_murder_outcome.2014.owner_is_known_2:0 "\n\n[target.GetSheHe]は一時、水中の岩にしがみつき、岸の通行人に向かって、[target.GetHerHim]を突き落としたのはあなただと叫んだ！ほどなく力尽きて再び川に滑り落ち、おそらく大河へと押し流されていっただろう。"
 quix_murder_outcome.2014.no_awareness_1:0 "\n\nあなたは旅を続け、この上なく心地よい午後を過ごした。"
 quix_murder_outcome.2014.no_awareness_2:0 "\n\nどうやら皆一様に、[target.GetName]は自分で足を滑らせて落ちたのだと思い込んでいるようだ！"
 quix_murder_outcome.2014.a.discovered:0 "あれは我ではない。誰かが我の名を騙って陥れようとしているに違いない！"
 quix_murder_outcome.2014.a:0 "あれこれ手間をかけるより、ひと押しするほうがよかったのだな。"
 quix_murder_outcome.2015.t:0 "白昼の暗殺"
 quix_murder_outcome.2015.opening_1:0 "[target.GetName]は市場であなたの手の者に行く手を阻まれ、曲がり角へ引きずり込まれて、たちまち片付けられた。"
 quix_murder_outcome.2015.opening_2:0 "あなたの手の者は[target.GetName]と揉め事を起こし、通りで[target.GetHerHim]を殺した。通りじゅうの人々が肝をつぶした。"
 quix_murder_outcome.2015.opening_3:0 "あなたの刺客は市中に露店を構え、[target.GetName]が目の前まで歩いてくると、いきなり矛で[target.GetHerHis]胸を突き刺した。"
 quix_murder_outcome.2015.owner_is_known_1:0 "\n\nたちまち叫び声があちこちで上がり、あなたの手下の一人が捕らえられた。どうやら彼は、すでにあなたの名を白状してしまったらしい。"
 quix_murder_outcome.2015.owner_is_known_2:0 "\n\n思いがけず市の人々がこぞって取り囲み、あなたの手の者の何人かが逃げる途中で捕らえられた！あなたが関わっていたことは、どうやらすでに漏れてしまったようだ。"
 quix_murder_outcome.2015.no_awareness_1:0 "\n\nあなたの手の者は徒歩で散り散りに逃げ、あなたが関わっていたことを知る者はいない。"
 quix_murder_outcome.2015.no_awareness_2:0 "\n\nこの一刀がどういうわけか騒動を引き起こした！幸いあなたの手の者は混乱に乗じて逃げおおせ、あなたの役割を知る者はいない！"
 quix_murder_outcome.2015.a.discovered:0 "これほどあからさまな真似を、わしがするものか！"
 quix_murder_outcome.2015.a:0 "上策とは、ただ率直であることよ。"
 quix_murder_outcome.2016.t:0 "偽令による捕縛"
 quix_murder_outcome.2016.opening_1:0 "[target.GetTitledFirstName]があなたの前に引き据えられた！あなたの手の者があの文書を示し、いくつか適当な罪状を並べ立てると、[target.GetName]は抵抗すらせず縛についた。こうしている間にも、首斬り役人は牢で斧を研いでいる。[target.GetSheHe]はもはや死人も同然だ。"
 quix_murder_outcome.2016.opening_2:0 "あなたの手の者が[target.GetTitledFirstName]を捕らえた。彼らが乗りつけたのは、[target.GetSheHe]が思い描いていたのとそっくり同じ輜重車であった！[target.GetSheHe]がようやく行き先を尋ねたときには、もう手遅れであった。"
 quix_murder_outcome.2016.opening_3:0 "あなたの手の者が[target.GetTitledFirstName]を捕らえた。結局のところ、頭にかぶせる麻袋ひとつと、近くの草車一台があれば足りたのだ。[target.GetTitledFirstName]が命乞いに忙しい間に、あなたの手下は処刑の支度を進めている。あなたはその声を聞くのがなかなか気に入っていた。"
 quix_murder_outcome.2016.owner_is_known_1:0 "\n\n不運にも、そのうちの一人が買収され、あなたの正体を漏らしてしまった！卑劣な裏切り者め！"
 quix_murder_outcome.2016.owner_is_known_2:0 "\n\nあいにく刺客の一人が口の軽い男で、この妙計をあちこちで自慢して回った！今やあなたが関わっていたことは誰もが知るところとなった。"
 quix_murder_outcome.2016.no_awareness_1:0 "\n\nどうやら、あなたまで辿り着ける者はいないようだ。"
 quix_murder_outcome.2016.no_awareness_2:0 "\n\nこれからは、[target.GetName]のいない世で悠々と暮らせるのだ！"
 quix_murder_outcome.2016.a.discovered:0 "脅すだけのつもりが、手が滑ったのだ！"
 quix_murder_outcome.2016.a:0 "あの数え上げた罪状の口上を使わずじまいとは、惜しいことよ。"
 quix_murder_outcome.2017.t:0 "吹き矢"
 quix_murder_outcome.2017.opening_1:0 "[target.GetName]は針を受けると顔色が青ざめ、そのまま息絶えた。あなたの刺客は[target.GetHerHis]窓の外で何刻も潜み、ようやく好機を得たのである。"
 quix_murder_outcome.2017.opening_2:0 "この奇妙な武器は確かに役に立った。物陰に潜んだ刺客が小さな針を吹き放つと、わずかに塗られた毒だけで[target.GetName]の命は奪われた。"
 quix_murder_outcome.2017.opening_3:0 "見た目は珍奇だが、使ってみれば極めて効果的であった。[target.GetName]は開け放たれた窓から一針を受け、全身を青くして死んだ。大成功だ！"
 quix_murder_outcome.2017.owner_is_known_1:0 "\n\n残念ながら、刺客はあの武器ほど役には立たず、逃げる途中であっさり捕まってしまった！"
 quix_murder_outcome.2017.owner_is_known_2:0 "\n\n刺客は当初こそ追手を逃れたが、身につけていた吹き針が[target.GetName]の身体から出た一本と寸分違わず、罪を問うには十分であった。そして彼はあなたの名まで白状してしまった！"
 quix_murder_outcome.2017.no_awareness_1:0 "\n\nどうやら[target.GetName]は初めあの小さな針を気にも留めず、死ぬ前に何気なく抜き捨てたらしい。あなたの関与を知る者はいない！"
 quix_murder_outcome.2017.no_awareness_2:0 "\n\nどうやら[target.GetName]の遺骸を清めた者たちは誰もあの吹き針に気づかず、死因は謎のままとなった！"
 quix_murder_outcome.2017.a.discovered:0 "これは……いささか気まずいな。"
 quix_murder_outcome.2017.a:0 "この品の妙、まさしく評判どおりよ。"
 quix_murder_outcome.2018.t:0 "自ら短刀を執る"
 quix_murder_outcome.2018.opening_1:0 "日暮れどき、あなたは最も目立たぬ衣に着替え、懐に短刀を忍ばせて住まいの窓から抜け出し、[target.GetName]の住まいへ忍び寄った。[target.GetHerHim]が火鉢にもたれて休んでいるのを見ると、片手で[target.GetHerHis]口を塞ぎ、[target.GetHerHis]耳元で「さらばだ、[target.GetName]」と囁いた。あなたの仕業だと[target.GetSheHe]に知らしめるために。次の瞬間、[target.GetHerHis]の血が膝を濡らしていた！"
 quix_murder_outcome.2018.opening_2:0 "[target.GetTitledFirstName]の最期は……まるで夢のようであった。あなたがそっと[target.GetHerHis]部屋に忍び込むと、[target.GetHerHim]は火鉢のそばの机に向かって座っていた。あなたは黙って歩み寄り、[target.GetTitledFirstName]の向かいに腰を下ろした。顔を上げた[target.GetSheHe]はあなたの姿を見て、驚きのあまり言葉を失った。気まずい沈黙ののち、[target.GetSheHe]はあなたが[target.GetHerHim]を殺しに来たのかと尋ねた。あなたはうなずき、淡々とその理由を語った。すると[target.GetName]は、そのまま……受け入れたのである。これから起こることをはっきり告げた上で、まったく抵抗しない者を殺すというのは、実に奇妙な感覚であった。"
 quix_murder_outcome.2018.opening_3:0 "あなたはまず賑やかな宿に身を落ち着け、夜が更けてから全身を黒衣で包んで出かけることにした。短刀を口にくわえて[target.GetTitledFirstName]の屋敷の露台をよじ登り、半ば開いた窓の隙間から中をうかがうと、[target.GetHerHim]は眠り込んでいた。あなたは素早く事を済ませた。"
 quix_murder_outcome.2018.owner_is_known_1:0 "\n\nあなたはしばし時間をかけて血を洗い流し、心を落ち着けてから立ち去った。ところが魔が差したのか、短刀をその場に置き忘れてしまった！柄にはあなたの私印が刻まれている。あなたの仕業だと必ず知られるだろう！"
 quix_murder_outcome.2018.owner_is_known_2:0 "\n\nすべては順調だった……通りすがりの者に窓から出るところを見られるまでは！さらに悪いことに、その者は一目であなたを見分け、その場で大声を上げたのだ！あなたはやっとの思いで逃げ帰った。"
 quix_murder_outcome.2018.no_awareness_1:0 "\n\nあなたは悠然と[target.GetTitledFirstName]の持ち物を物色し、[target.GetHerHis]食事を何口か味見までした。事が済むと、堂々と歩いて出て行ったが、誰一人あなたを見た者はいなかった。我ながらなかなかの刺客だ、とあなたは思った……"
 quix_murder_outcome.2018.no_awareness_2:0 "\n\nあなたは手際よく事を済ませ、窓から音もなく姿を消した。いちばん難しかったのは、むしろ衛士たちのそばを通り過ぎる際に、こみ上げる得意を押し殺すことであった！"
 quix_murder_outcome.2018.a.discovered:0 "わしに似た者などいくらでもおる。なぜわしだとわかる？"
 quix_murder_outcome.2018.a:0 "事を成さんと欲すれば、必ず自ら手を下すべし。"
 quix_murder_outcome.2019.t:0 "唖の力士"
 quix_murder_outcome.2019.opening_1:0 "[target.GetName]が死んだ！[target.GetSheHe]がぶらぶらと出歩いていたところを、あなたの雇った力士がその大きな手で絞め殺したのだ。事は成った！"
 quix_murder_outcome.2019.opening_2:0 "[target.GetName]は弱々しく何度か反撃したが、あなたの雇った力士の敵ではなかった！その場面をこの目で見たかったものだ。聞けば[target.GetName]は顔もわからぬほど打ちのめされ、身体の痣がなければ家族ですら見分けられなかったという。"
 quix_murder_outcome.2019.opening_3:0 "公平に言えば、[target.GetName]はあなたの力士と正面から渡り合おうとしたのだ。両者の腕前の差を思えば、[target.GetSheHe]はよく持ちこたえたほうである。最後は力士の重い一撃が[target.GetHerHis]構えを崩し、[target.GetHerHim]を固い地面に叩きつけ、とどめに容赦ない蹴りを一発見舞って片をつけた。"
 quix_murder_outcome.2019.owner_is_known_1:0 "\n\nあいにくこの力士は人目を避けることをまるで知らず、殺すところをその場で見られていた！ほどなくして彼は捕らえられた。"
 quix_murder_outcome.2019.owner_is_known_2:0 "\n\n力士は凶行のあと徒歩で逃げたが、追いつかれて捕らえられた！彼はすでに処刑され、あなたの関与も露見してしまった。"
 quix_murder_outcome.2019.no_awareness_1:0 "\n\n[target.GetName]はそのとき一人きりで、あなたの手の者を見た者はいないようだ。万事きれいに片付いた。"
 quix_murder_outcome.2019.no_awareness_2:0 "\n\n[target.GetName]の護衛が阻もうとしたが、力士にことごとく打ち倒された！彼は痛む拳をさすりながら悠然と立ち去った。"
 quix_murder_outcome.2019.a.discovered:0 "あのような者、わしは知らぬ。殴られて頭がおかしくなったのであろう！"
 quix_murder_outcome.2019.a:0 "恐ろしき死にざま、見事なり。"
 quix_murder_outcome.2020.t:0 "探丸の党"
 quix_murder_outcome.2020.opening_1:0 "[target.GetName]が死んだ！聞くところでは、[target.GetSheHe]が厠にいたとき、刺客が厠の中から躍り出て、一太刀で[target.GetHerHim]を仕留めたという。なんとも不体裁な死にざまである。"
 quix_murder_outcome.2020.opening_2:0 "[target.GetTitledFirstName]は夜中に喉を掻き切られた！あなたはついに[target.GetHerHim]から解放されたのだ。素性の知れないあの連中は、約束どおり見事に事を成し遂げた……"
 quix_murder_outcome.2020.opening_3:0 "この素性を隠した連中は、人を殺すとなると実に手際がよい。[target.GetName]は宴の席で殺されたのだ！"
 quix_murder_outcome.2020.owner_is_known_1:0 "\n\nだが刺客はあなたが望んだほど隠密ではなく、たちまち捕らえられ、すでにあなたの名を口にしてしまった。"
 quix_murder_outcome.2020.owner_is_known_2:0 "\n\nなんと相手は契約書の写しをわざと残し、罪をすべてあなたになすりつけたのだ。どうやらこの取引は初めから、あなたを狙って仕組まれた罠だったらしい。"
 quix_murder_outcome.2020.no_awareness_1:0 "\n\nどうやら刺客は誰にも気づかれずに出入りしたようだ。この件におけるあなたの役割は、もはや調べようがない。"
 quix_murder_outcome.2020.no_awareness_2:0 "\n\n刺客はまるで幽鬼のごとく、跡形も残さなかった。あなたにつながる手がかりは、ひとかけらも見つかっていない。"
 quix_murder_outcome.2020.a.discovered:0 "誰かが裏で糸を引き、わしに罪を着せたに違いない！"
 quix_murder_outcome.2020.a:0 "この者ども、来たりて跡なく去りて跡なし。恐るべし、恐るべし。"
 quix_murder_outcome.4001.t:0 "旅籠の夜火"
 quix_murder_outcome.4001.failure_declaration_1:0 "[target.GetTitledFirstName]はまだ生きている！"
 quix_murder_outcome.4001.failure_declaration_2:0 "[target.GetTitledFirstName]の命を奪うあなたの謀は、空振りに終わった。"
 quix_murder_outcome.4001.failure_declaration_3:0 "[target.GetTitledFirstName]を殺すのは、思っていたほど容易ではなかった――[target.GetSheHe]はまだ生きている。"
 quix_murder_outcome.4001.desc:0 "\n\n火付け役は宿を取り違えた。[target.GetName]は傷ひとつ負わず、それどころか通りに出て、夜半まで火事見物をしていた。"
 quix_murder_outcome.4001.exposed_scheme:0 "\n\n火付け役はその場で捕らえられ、あなたの名を白状した。"
 quix_murder_outcome.4001.not_exposed_scheme:0 "\n\n火付け役は危うく捕まりかけたが、どうにか徒歩で逃げおおせた。ただ、[target.GetName]はこれから必ずや何事にも用心するだろう。"
 quix_murder_outcome.4001.a.discovered:0 "かくも下劣な真似を、わしがするはずもない。誤解に違いない。"
 quix_murder_outcome.4001.a:0 "[target.GetFirstNameNoTooltip]の悪運が強かったということだ。この件は打ち切る。"
 quix_murder_outcome.4001.b:0 "百密にも一疎あり。また図るとしよう。"
 quix_murder_outcome.4002.t:0 "楼上の冷箭"
 quix_murder_outcome.4002.failure_declaration_1:0 "矢は狙いを外れた！[target.GetName]はまだ生きている。"
 quix_murder_outcome.4002.failure_declaration_2:0 "あの一矢は、結局[target.GetTitledFirstName]の命を奪えなかった。"
 quix_murder_outcome.4002.failure_declaration_3:0 "一矢で[target.GetTitledFirstName]の命を取るという目論見は、これにて潰えた。残念だ。"
 quix_murder_outcome.4002.desc:0 "\n\n射手が弦を放したその刹那、一羽の鳩が横切り、[target.GetTitledFirstName]の身代わりとなってこの矢を受けたのだった。"
 quix_murder_outcome.4002.exposed_scheme:0 "\n\n[target.GetName]はただちに気づき、射手は探し出されて捕らえられ、あなたの名を白状した。"
 quix_murder_outcome.4002.not_exposed_scheme:0 "\n\n幸い射手は足が速く、追手が来る前にさっさと逃げおおせた。あなたの関与を知る者はいない。"
 quix_murder_outcome.4002.a.discovered:0 "わしの家僕は鳩を射て厨に供しただけのこと。何の罪があろうか！"
 quix_murder_outcome.4002.a:0 "[target.GetFirstNameNoTooltip]の件は、これで打ち切りとする。"
 quix_murder_outcome.4002.b:0 "射手にもう一矢放たせよ。"
 quix_murder_outcome.4003.t:0 "一壺の美酒"
 quix_murder_outcome.4003.failure_declaration_1:0 "[target.GetTitledFirstName]はまだぴんぴんしている。"
 quix_murder_outcome.4003.failure_declaration_2:0 "上等な酒一甕ならば必ずや[target.GetTitledFirstName]を釣れると思っていたが、あいにく当てが外れた。"
 quix_murder_outcome.4003.failure_declaration_3:0 "[target.GetTitledFirstName]の生涯最後の一杯は、まだ飲み干されていない。[target.GetSheHe]はまだ生きている――少なくとも今のところは。"
 quix_murder_outcome.4003.desc:0 "\n\n[target.GetName]はこの酒の味を熟知しており、口に含む前に異変に気づいた。[target.GetHerHim]の命を救ったのが、ほかならぬ[target.GetHerHis]あの酒好きだったとは、誰が思っただろう。"
 quix_murder_outcome.4003.exposed_scheme:0 "\n\nさらに悪いことに、あなたはうっかり酒に添えた書状の末尾に自分の名を署してしまっていた！愚かにもほどがある。"
 quix_murder_outcome.4003.not_exposed_scheme:0 "\n\n幸い、この酒をあなたが送ったと突き止められる者はいない。何事もなかったことにしておこう。"
 quix_murder_outcome.4003.a.discovered:0 "これは毒酒ではない……疑うなら飲んでみよ！"
 quix_murder_outcome.4003.a:0 "あの良い酒が惜しいことよ。まあよい。"
 quix_murder_outcome.4003.b:0 "次はもっと非情にやらねばならぬ。"
 quix_murder_outcome.4004.t:0 "夜道は危うし"
 quix_murder_outcome.4004.failure_declaration_1:0 "[target.GetTitledFirstName]の夜の散歩を狙う謀は失敗した！"
 quix_murder_outcome.4004.failure_declaration_2:0 "あなたの刺客は[target.GetTitledFirstName]の命を奪えなかった！"
 quix_murder_outcome.4004.failure_declaration_3:0 "[target.GetTitledFirstName]を殺す謀は空振りに終わり、苦心はすべて水の泡となった！"
 quix_murder_outcome.4004.desc:0 "\n\n[target.GetName]は物陰に潜む刺客にいち早く気づき、相手が近づく前に大声で衛士を呼んだ。"
 quix_murder_outcome.4004.exposed_scheme:0 "\n\n衛士たちは刺客を捕らえ、その裏切り者はその場で白状した。今や誰もがこの陰謀を知っている。"
 quix_murder_outcome.4004.not_exposed_scheme:0 "\n\n幸い、刺客は捕まる前に夜陰に紛れて逃げ去った。"
 quix_murder_outcome.4004.a.discovered:0 "わしの静かな夜を乱すとは、腹立たしい！"
 quix_murder_outcome.4004.a:0 "この手の茶番には、もう飽きた。"
 quix_murder_outcome.4004.b:0 "次は、そううまくはいかぬぞ。"
 quix_murder_outcome.4005.t:0 "危うき壁の下"
 quix_murder_outcome.4005.failure_declaration_1:0 "[target.GetTitledFirstName]を虫けらのように石の下で押し潰してやりたかったが、思いどおりにはならなかった。"
 quix_murder_outcome.4005.failure_declaration_2:0 "今日は出だしから散々だ。[target.GetTitledFirstName]が石に押し潰されなかったという知らせが届いたのだ！"
 quix_murder_outcome.4005.failure_declaration_3:0 "巨石は[target.GetTitledFirstName]を押し潰せなかった！"
 quix_murder_outcome.4005.desc:0 "\n\n共謀者はなかなか巨石を動かせなかった。ようやく石が落ちたときには、[target.GetName]はとうに立ち上がって去っており、先ほどまで自分が座っていた場所が粉々に砕けるのを目の当たりにするばかりであった。"
 quix_murder_outcome.4005.exposed_scheme:0 "\n\nあなたの手の者はその場で捕らえられ、あなたの名を白状した！"
 quix_murder_outcome.4005.not_exposed_scheme:0 "\n\n幸い、あの役立たずは城壁から隣の屋根へ飛び移り、追手を振り切った。あなたの役割を知る者はいない。"
 quix_murder_outcome.4005.a.discovered:0 "古い壁から石が落ちただけのこと、わしに何の関わりがある？"
 quix_murder_outcome.4005.a:0 "まあよい。押し潰されるなど[target.GetFirstNameNoTooltip]には生ぬるすぎる。"
 quix_murder_outcome.4005.b:0 "次はもっと簡単な手を選ぶとしよう。"
 quix_murder_outcome.4006.t:0 "門を開いて盗賊を招く"
 quix_murder_outcome.4006.failure_declaration_1:0 "ああ、[target.GetName]を始末するあなたの謀は失敗に終わった。"
 quix_murder_outcome.4006.failure_declaration_2:0 "運に見放された！[target.GetTitledFirstName]は予定どおりには死ななかった。"
 quix_murder_outcome.4006.failure_declaration_3:0 "しくじった！[target.GetTitledFirstName]はまだ生きている。"
 quix_murder_outcome.4006.desc:0 "\n\nあの召使いには、初めから約束を守るつもりなどなかった。部屋にはすでに伏兵が配され、衛兵たちはあなたの手の者が罠に飛び込んでくるのを待ち構えていたのだ。"
 quix_murder_outcome.4006.exposed_scheme:0 "\n\nすべては罠だったのだ！今や[target.GetTitledFirstName]はあなたの謀を知ってしまった。"
 quix_murder_outcome.4006.not_exposed_scheme:0 "\n\nそれでも、あなたの刺客は死に物狂いで逃げ延びた。甲冑をまとい武器を手にした追手は足が遅く、彼は路地で振り切った。さらに一晩中あちこちに身を隠し、ついに捕まらずに済んだのである。"
 quix_murder_outcome.4006.a.discovered:0 "これは濡れ衣だ！"
 quix_murder_outcome.4006.a:0 "[target.GetFirstNameNoTooltip]は見かけより抜け目がない。まあよい。"
 quix_murder_outcome.4006.b:0 "小さなつまずきにすぎぬ。また策を練ろう。"
 quix_murder_outcome.4007.t:0 "地下道からの夜襲"
 quix_murder_outcome.4007.failure_declaration_1:0 "危険は承知の上であった――[target.GetTitledFirstName]を殺すための夜襲は、ついに失敗した。"
 quix_murder_outcome.4007.failure_declaration_2:0 "[target.GetTitledFirstName]への夜襲は失敗に終わった！"
 quix_murder_outcome.4007.failure_declaration_3:0 "あなたの手の者は[target.GetTitledFirstName]を殺せなかった！この夜襲はまさに大失態であった。"
 quix_murder_outcome.4007.desc:0 "\n\nあなたの手の者は[target.GetTitledFirstName]の住まいに忍び込むと次々に下男下女と鉢合わせし、その騒ぎがたちまち衛兵の耳に入った。[target.GetTitledFirstName]も混乱に乗じて逃げ去った。"
 quix_murder_outcome.4007.exposed_scheme:0 "\n\n一同はある部屋に追い詰められ、突破の望みもないと見るや、武器を捨てて降伏し、あなたの名を白状した！"
 quix_murder_outcome.4007.not_exposed_scheme:0 "\n\n唯一の朗報は、一同が捕まる前に逃げおおせたことだ。"
 quix_murder_outcome.4007.a.discovered:0 "それもよい。わしの恐ろしさを[target.GetFirstNameNoTooltip]に思い知らせてやれ！"
 quix_murder_outcome.4007.a:0 "わしは疲れた。この件は打ち切りだ。"
 quix_murder_outcome.4007.b:0 "遅かれ早かれのことよ。[target.GetFirstNameNoTooltip]め、首を洗って待っておれ！"
 quix_murder_outcome.4008.t:0 "夜の騎馬襲撃"
 quix_murder_outcome.4008.failure_declaration_1:0 "[target.GetTitledFirstName]はあなたの騎手の手にかからなかった！"
 quix_murder_outcome.4008.failure_declaration_2:0 "[target.GetTitledFirstName]を待ち伏せて討つ計画は失敗した！"
 quix_murder_outcome.4008.failure_declaration_3:0 "忌々しい！[target.GetTitledFirstName]はまだ生きている。あなたの騎手は[target.GetHerHim]を仕留められなかったのだ！"
 quix_murder_outcome.4008.desc:0 "\n\n[target.GetName]の傍らには折しも名射手が控えていた。騎手は近くまで駆け寄る前に、一矢で馬から射落とされた。"
 quix_murder_outcome.4008.exposed_scheme:0 "\n\n騎手は生け捕りにされ、取り調べであなたの名を白状した！"
 quix_murder_outcome.4008.not_exposed_scheme:0 "\n\nせめてもの慰めは、その男が落馬の際に首の骨を折り、もはやあなたのことを白状できなくなったことだ。"
 quix_murder_outcome.4008.a.discovered:0 "夜道には盗賊が多い。何もかもわしのせいにされてはかなわぬ。"
 quix_murder_outcome.4008.a:0 "まあよい。[target.GetFirstNameNoTooltip]の運が良かったのだ。"
 quix_murder_outcome.4008.b:0 "あの良い馬が惜しい。また図るとしよう。"
 quix_murder_outcome.4009.t:0 "偽医者"
 quix_murder_outcome.4009.failure_declaration_1:0 "[target.GetTitledFirstName]はまだ生きている――少なくとも今のところは。"
 quix_murder_outcome.4009.failure_declaration_2:0 "ああ、[target.GetTitledFirstName]はついに血を流して死にはしなかった。実に惜しい。"
 quix_murder_outcome.4009.failure_declaration_3:0 "医工に成りすました者を送り込んで[target.GetTitledFirstName]を殺すという策は、どうやら空振りに終わったようだ。"
 quix_murder_outcome.4009.desc:0 "\n\nまさに砭石を当てようとしたその時、本物の医工がふいに訪ねてきた。偽者はその場で化けの皮が剥がれ、[target.GetTitledFirstName]もすぐさま守られた。"
 quix_murder_outcome.4009.exposed_scheme:0 "\n\n偽者は追い詰められ、自分はあなたが差し向けた刺客だと白状してしまい、満座は騒然となった！"
 quix_murder_outcome.4009.not_exposed_scheme:0 "\n\n幸い、あなたの偽医工は、名医を慕うあまり名を騙って教えを乞いに来たふりをすることができた！しどろもどろに言い繕ったのち、彼は荷物をまとめてそそくさと辞去した。"
 quix_murder_outcome.4009.a.discovered:0 "馬鹿げておる、馬鹿げておる！"
 quix_murder_outcome.4009.a:0 "[target.GetFirstNameNoTooltip]を血が尽きるまで流させてやるつもりだったが、まあよい。"
 quix_murder_outcome.4009.b:0 "時の運が悪かっただけのこと。改めて図るとしよう。"
 quix_murder_outcome.4010.t:0 "儺面の刺客"
 quix_murder_outcome.4010.failure_declaration_1:0 "あなたにとって腹立たしいことに、[target.GetTitledFirstName]はまだ生きている。"
 quix_murder_outcome.4010.failure_declaration_2:0 "駆儺の宴に乗じて[target.GetTitledFirstName]を殺す謀は、完全に失敗した。"
 quix_murder_outcome.4010.failure_declaration_3:0 "なんと縁起の悪い！[target.GetTitledFirstName]はあなたの刺客の手にかからなかった！"
 quix_murder_outcome.4010.desc:0 "\n\n満座の客がみな儺の面をかぶっており、あなたの手の者はどれが[target.GetTitledFirstName]なのか最後まで見分けられなかった。宴が果てるまで、刺客は標的を見つけられなかった。"
 quix_murder_outcome.4010.exposed_scheme:0 "\n\n何刻も右往左往した末、彼らが最後に狙いを定めたのはまったくの人違いであった！[target.GetTitledFirstName]はそもそも宴に来ていなかったのだ！あなたの手の者はほどなく捕らえられ、口の軽い一人がすべてを話してしまった。"
 quix_murder_outcome.4010.not_exposed_scheme:0 "\n\nあなたの役立たずの刺客たちが一晩じゅうただで儺戯を見物しただけで、ほかには何も起こらなかった！"
 quix_murder_outcome.4010.a.discovered:0 "人違いをしただけのことよ！"
 quix_murder_outcome.4010.a:0 "皆は存分に楽しみ、わしだけが骨折り損か。まあよい。"
 quix_murder_outcome.4010.b:0 "他日を待って改めて図るべし。"
 quix_murder_outcome.4011.t:0 "胡の客"
 quix_murder_outcome.4011.failure_declaration_1:0 "あなたの雇った刺客は[target.GetTitledFirstName]を殺せなかった！"
 quix_murder_outcome.4011.failure_declaration_2:0 "[target.GetTitledFirstName]暗殺の謀は失敗した！あの胡人の刺客は、期待したほど頼りにならなかった。"
 quix_murder_outcome.4011.failure_declaration_3:0 "[target.GetTitledFirstName]があの風変わりな胡人の刺客の手にかからなかったと知り、あなたは悔しくてたまらない！"
 quix_murder_outcome.4011.desc:0 "\n\nあの胡人は装束も武器もあまりに目立ち、たちまち衛兵の詰問を招いた。身体を検められると、あなたが渡した道筋の図まで見つかり、暗殺の計はここに露見した。"
 quix_murder_outcome.4011.not_exposed_scheme:0 "\n\n幸い、この件はあなたには累が及ばない――彼はあなたの姓名すら知らないのだ！"
 quix_murder_outcome.4011.exposed_scheme:0 "\n\nその図には報酬の明細と、あなたへの返信の手立てまで挟まれていた！不運にも、そこにはあなたの名が記されていた。"
 quix_murder_outcome.4011.a.discovered:0 "あの者は言葉が通じぬ。通訳の誤りに違いない！"
 quix_murder_outcome.4011.a:0 "わしは疲れた。もうこのようなことはせぬ。"
 quix_murder_outcome.4011.b:0 "次は二人で行かせよ。"
 quix_murder_outcome.4012.t:0 "猛犬をけしかける"
 quix_murder_outcome.4012.failure_declaration_1:0 "[target.GetTitledFirstName]を犬の餌食にしてやりたかったが、思いどおりにはならなかった。"
 quix_murder_outcome.4012.failure_declaration_2:0 "[target.GetTitledFirstName]が群犬に噛み裂かれる様を思い浮かべるだけで胸がすく思いだった――だが残念ながら、計画は空振りに終わった。"
 quix_murder_outcome.4012.failure_declaration_3:0 "犬を放って[target.GetTitledFirstName]を殺すというのは、そもそも良い考えではなかったのかもしれない。"
 quix_murder_outcome.4012.desc:0 "\n\n[target.GetName]はたまたま干し肉を持っており、すかさず投げ与えて猛犬をなだめた。飢えた犬たちは今度は犬使いに襲いかかり、この計は完全に失敗した。"
 quix_murder_outcome.4012.exposed_scheme:0 "\n\n犬使いは全身を噛まれて傷だらけになったところを捕らえられた。もう一度犬をけしかけると脅されると、彼はあなたの名を白状した！"
 quix_murder_outcome.4012.not_exposed_scheme:0 "\n\n今日唯一の幸いは、あの男があなたを巻き込む前に、自分の犬に噛み殺されたことだ！"
 quix_murder_outcome.4012.a.discovered:0 "あれは悪犬よ、わしが差し向けたのではない！"
 quix_murder_outcome.4012.a:0 "[target.GetFirstNameNoTooltip]が難を逃れたということだ。まあよい。"
 quix_murder_outcome.4012.b:0 "これしきで興を削がれるな。他日また図ろう。"
 quix_murder_outcome.4013.t:0 "温泉"
 quix_murder_outcome.4013.failure_declaration_1:0 "残念ながら、[target.GetTitledFirstName]はまだこの世を去っていない。"
 quix_murder_outcome.4013.failure_declaration_2:0 "今宵こそ[target.GetName]のいない世で安らかに眠れると、あなたはどれほど願っていたことか――だが、思いどおりにはいかなかった。"
 quix_murder_outcome.4013.failure_declaration_3:0 "[target.GetTitledFirstName]はまるで泥鰌のようにぬるりと逃げる！[target.GetHerHim]を捕まえたと思ったのに、[target.GetSheHe]はまだ生きている。"
 quix_murder_outcome.4013.desc:0 "\n\n刺客が浴布の中から短刀を抜くと同時に、[target.GetTitledFirstName]もあらかじめ隠しておいた武器を手に取った。[target.GetSheHe]は襲撃を防ぎ、騒ぎを聞きつけた衛士が駆けつけるまで持ちこたえた。"
 quix_murder_outcome.4013.exposed_scheme:0 "\n\n刺客たちは慌てて浴堂から逃げ出したが、その場にいた者たちに顔を見られ、あなたの指図であることも知られてしまった。"
 quix_murder_outcome.4013.not_exposed_scheme:0 "\n\n刺客たちは浴布で顔を覆って浴堂から逃げ出した。誰にも見分けられず、当然あなたの関与に気づく者もいなかった。"
 quix_murder_outcome.4013.a.discovered:0 "湯殿での口論を、わしの罪にするというのか？"
 quix_murder_outcome.4013.a:0 "皆がこれほどの恥をかいたのだ、それで十分であろう。"
 quix_murder_outcome.4013.b:0 "此度は試しにすぎぬ。もう一度だ。"
 quix_murder_outcome.4014.t:0 "川辺での偶然の出会い"
 quix_murder_outcome.4014.failure_declaration_1:0 "あなたはありとあらゆる手を尽くしたが、[target.GetTitledFirstName]はあの川で溺れ死ななかった！"
 quix_murder_outcome.4014.failure_declaration_2:0 "思いに反して、[target.GetTitledFirstName]は急流に押し流されなかった！"
 quix_murder_outcome.4014.failure_declaration_3:0 "[target.GetTitledFirstName]が川に落ちれば必ず死ぬと思っていたが、あなたは間違っていた！"
 quix_murder_outcome.4014.desc:0 "\n\nあなたは背後から[target.GetHerHim]を力いっぱい突き飛ばしたが、[target.GetSheHe]は川には落ちず、斜面を転がり落ちて岸辺で止まっただけだった。"
 quix_murder_outcome.4014.exposed_scheme:0 "\n\n追いかけたあなたは自ら足を滑らせて水に落ち、[target.GetHerHim]もろとも激流に呑み込まれた！幸い橋の上で漁師が網を下ろしていたので、二人とも網につかまって岸に引き上げられ、そろって大きく息を切らした。あなたは起き上がるなり一目散に立ち去ったが、[target.GetTitledFirstName]はすでに、あなたが[target.GetHerHim]を殺そうとしたことを知っている！"
 quix_murder_outcome.4014.not_exposed_scheme:0 "\n\n[target.GetSheHe]は岩場の上の浅瀬に落ち、軽い怪我を負っただけで、すぐさま大声で助けを求めた。あなたは誰かに見られる前に抜け出した。せめて[target.GetTitledFirstName]の一日を台無しにしてやったのがささやかな慰めだが、あなたが望んでいたのはそんなものではない！"
 quix_murder_outcome.4014.a.discovered:0 "足を滑らせただけのことよ！"
 quix_murder_outcome.4014.a:0 "[target.GetFirstNameNoTooltip]め、しぶとい奴よ。まあよい！"
 quix_murder_outcome.4014.b:0 "次は水中に押さえつけてやらねばならぬ。"
 quix_murder_outcome.4015.t:0 "白昼の暗殺"
 quix_murder_outcome.4015.failure_declaration_1:0 "あなたの手の者は[target.GetTitledFirstName]を殺せなかった。"
 quix_murder_outcome.4015.failure_declaration_2:0 "市中で[target.GetTitledFirstName]を暗殺する謀は失敗した！"
 quix_murder_outcome.4015.failure_declaration_3:0 "ああ、仕損じた。往来で[target.GetTitledFirstName]を殺すほど率直な策が、ほかにあろうか？"
 quix_murder_outcome.4015.desc:0 "\n\n[target.GetName]は終始人だかりに囲まれていた。刺客がやっとの思いで近くまで割り込んだものの、たちまち群衆に阻まれ、断念するほかなかった。"
 quix_murder_outcome.4015.exposed_scheme:0 "\n\n野菜売りの老婆が杖を振りかざして露店から飛び出し、刺客たちを滅多打ちにして、なんと一人を気絶させてしまった！残りの者は逃げたが、捕まった一人がすでにあなたの名を白状している！"
 quix_murder_outcome.4015.not_exposed_scheme:0 "\n\nあなたの刺客は怒り狂った市人たちに追われて市場から逃げ出し、さらに騎馬の追手に一日じゅう追い回された末、ようやく逃げおおせた。少なくとも、あなたとこの件の関わりはまだ誰にも知られていない。"
 quix_murder_outcome.4015.a.discovered:0 "我らは物笑いの種になったわ！"
 quix_murder_outcome.4015.a:0 "まことに不運であった。まあよい。"
 quix_murder_outcome.4015.b:0 "気を落とすな。また図るとしよう。"
 quix_murder_outcome.4016.t:0 "偽令による捕縛"
 quix_murder_outcome.4016.failure_declaration_1:0 "[target.GetTitledFirstName]を捕らえて処刑する謀は、うまくいかなかった。"
 quix_murder_outcome.4016.failure_declaration_2:0 "失敗だ！[target.GetTitledFirstName]はまだ生きている。しかも……ぴんぴんしている。"
 quix_murder_outcome.4016.failure_declaration_3:0 "[target.GetTitledFirstName]は連れ去られもせず、殺されもしなかった！まったく失望この上ない。"
 quix_murder_outcome.4016.desc:0 "\n\n[target.GetName]はいったんは偽の文書を信じたが、あいにく共謀者が口にしたその役人がすぐ近くにいた。偽りはその場で暴かれ、差役に化けた者たちは散り散りに逃げるほかなかった。"
 quix_murder_outcome.4016.exposed_scheme:0 "\n\n事態は急変し、あなたの手の者は捕らえられ、拷問に耐えきれずにすべてを白状した！"
 quix_murder_outcome.4016.not_exposed_scheme:0 "\n\n唯一の救いは、一同がこれを伝達違いによる誤解だと言い繕って、そそくさと引き上げたことだ。この愚かな一件におけるあなたの役割は、今のところ誰にも知られていない。"
 quix_murder_outcome.4016.a.discovered:0 "そのときの[target.GetTitledFirstName]の顔つきを、ぜひ見てみたかったものよ！"
 quix_murder_outcome.4016.a:0 "なんとも失望させられる。まあよい。"
 quix_murder_outcome.4016.b:0 "また一からやり直さねばならぬ。"
 quix_murder_outcome.4017.t:0 "吹き矢"
 quix_murder_outcome.4017.failure_declaration_1:0 "[target.GetTitledFirstName]はあなたの刺客の手にかからなかった！"
 quix_murder_outcome.4017.failure_declaration_2:0 "やはりありふれた武器を使うべきだったか――[target.GetTitledFirstName]は死ななかった！"
 quix_murder_outcome.4017.failure_declaration_3:0 "あの奇妙な小さな針は、[target.GetTitledFirstName]の命を絶つには至らなかった！"
 quix_murder_outcome.4017.desc:0 "\n\n刺客はこの武器を一度も試したことがなく、いざ放つ段になって息を逆に吸い込んでしまった。毒針は彼自身の喉に飛び込み、[target.GetName]は傷ひとつ負わなかった。"
 quix_murder_outcome.4017.exposed_scheme:0 "\n\n刺客は地面でしばらくもがき苦しんだのちに息絶え、そばに落ちていた竹筒と数通の書状が[target.GetName]の手に渡った。それを手繰っていけば、あなたに行き着くのは容易であった。"
 quix_murder_outcome.4017.not_exposed_scheme:0 "\n\n幸い、刺客はほぼその場で絶命した。もともと誰も知らない新顔であったため、彼とあなたを結びつけられる者はいない！"
 quix_murder_outcome.4017.a.discovered:0 "小僧めとは、ともに謀るに足らぬ！"
 quix_murder_outcome.4017.a:0 "運が悪すぎた。まあよい。"
 quix_murder_outcome.4017.b:0 "やはり尋常な手立てで、また図るとしよう。"
 quix_murder_outcome.4018.t:0 "自ら短刀を執る"
 quix_murder_outcome.4018.failure_declaration_1:0 "なぜこれほど無謀だったのか？なぜこれほど愚かだったのか？[target.GetTitledFirstName]を殺す謀は失敗に終わった。"
 quix_murder_outcome.4018.failure_declaration_2:0 "運命のいたずらだ！あなたは[target.GetTitledFirstName]を殺せなかった。"
 quix_murder_outcome.4018.failure_declaration_3:0 "あなたが[target.GetTitledFirstName]を殺すために練ったこの計は、結局あまり当てにならなかった……"
 quix_murder_outcome.4018.desc:0 "\n\nあなたはうまく窓から寝室に忍び込んだが、寝台に近づいたところで一人の侍女に見つかってしまった。彼女の悲鳴で[target.GetTitledFirstName]が目を覚まし、あなたはすぐさま逃げるほかなかった。"
 quix_murder_outcome.4018.not_exposed_scheme:0 "\n\nあなたは急いで頭巾を引き下ろし、窓から跳び出して隣の屋根に飛び移った。あの侍女はあなたを見たことがなく、辺りも暗かったので、正体は見破られなかったと確信している。今後はこれほど油断してはならない……"
 quix_murder_outcome.4018.a.discovered:0 "わしはまことの愚か者よ！"
 quix_murder_outcome.4018.a:0 "古き言い伝えに惑わされたわ。まあよい。"
 quix_murder_outcome.4018.b:0 "やはりこの件は玄人に任せるとしよう。"
 quix_murder_outcome.4019.t:0 "唖の力士"
 quix_murder_outcome.4019.failure_declaration_1:0 "[target.GetTitledFirstName]はあなたの雇ったあの荒くれ者の手にかからなかった！"
 quix_murder_outcome.4019.failure_declaration_2:0 "[target.GetTitledFirstName]を殺すために雇った者は、仕損じた。"
 quix_murder_outcome.4019.failure_declaration_3:0 "[target.GetTitledFirstName]はまだ生きている――ひとえにあなたの雇ったあの大男が無能だったおかげだ。"
 quix_murder_outcome.4019.desc:0 "\n\nあの力士は[target.GetName]を見つけると、なんとまず身振り手振りで相手に本人かどうか認めさせようとした。[target.GetTitledFirstName]はしきりに首を振り、別の方角を指さして、いとも簡単に難を逃れたのである。"
 quix_murder_outcome.4019.exposed_scheme:0 "\n\n[target.GetTitledFirstName]はすぐに衛兵を探しに行った。衛兵たちはあの愚かな大男を捕らえ、彼は身振り手振りであなたの名を白状した！今や誰もがあなたがこの陰謀に関わっていたことを知っている。"
 quix_murder_outcome.4019.not_exposed_scheme:0 "\n\n[target.GetTitledFirstName]が一声叫ぶと、あなたの力士は城外の空き墓に隠れ、日が暮れるまで潜んでいるほかなかった！幸い追手の捜索を逃れ、尻尾を巻いてこそこそと戻ってきた。少なくとも、この愚かな一件があなたにまで累を及ぼすことはない。"
 quix_murder_outcome.4019.a.discovered:0 "あの者はとうに殴られて頭がおかしくなっておる。その言など信ずるに足らぬ！"
 quix_murder_outcome.4019.a:0 "惜しいことよ。だが人生にはもっと大事なことがある。"
 quix_murder_outcome.4019.b:0 "構わぬ。事を成すには幾たびかの曲折がつきものよ。"
 quix_murder_outcome.4020.t:0 "探丸の党"
 quix_murder_outcome.4020.failure_declaration_1:0 "[target.GetTitledFirstName]はあなたの雇った刺客の手にかからなかった！"
 quix_murder_outcome.4020.failure_declaration_2:0 "[target.GetTitledFirstName]は死ななかった！"
 quix_murder_outcome.4020.failure_declaration_3:0 "残念ながら、[target.GetTitledFirstName]はまだ生きている。"
 quix_murder_outcome.4020.desc:0 "\n\nあの謎の連中は金を受け取ると、それきり杳として行方が知れなくなった。初めから終わりまで、これはただの詐欺だったのだ。"
 quix_murder_outcome.4020.exposed_scheme:0 "\n\nあなたが取引していた相手は、もともと[target.GetTitledFirstName]に忠実な者たちだったのだろうか？あるいは名も知れぬ第三者か？いずれにせよ、彼らは計画の一部始終を[target.GetTitledFirstName]に告げてしまい、今や事の全容は誰もが知るところとなった。"
 quix_murder_outcome.4020.not_exposed_scheme:0 "\n\nあの連中と取り決めた連絡の手立ては、すべて途絶えた。見張りに出した者の報告によれば、彼らは初めから手を下すつもりなどなく、そのまま姿を消したという。詐欺か？罠か？それとも頓挫した陰謀か？あなたには推し量ることしかできない。幸い、後腐れはなさそうだ。この件であなたを脅す者もなく、[target.GetTitledFirstName]の耳にも入っていない。この一件は、今なお謎のままである……"
 quix_murder_outcome.4020.a.discovered:0 "これが何者かの仕組んだ濡れ衣であると、そなたらにはわからぬのか？"
 quix_murder_outcome.4020.a:0 "わしは騙されたのだ！"
 quix_murder_outcome.4020.b:0 "大した商売よ。次はもっと信用できる者を探すとしよう。"
 hd_quix_defer_murder_setup_tt:0 "ひとまず手を引き、別の好機を待つ。ただし、これまでの仕掛けがすでに露見しているかどうかは、まだ予測がつかない。"
