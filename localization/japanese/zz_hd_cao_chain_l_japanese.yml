l_japanese:
 hd_cao_chain.0001.t:0 "宮門の血痕"
 hd_cao_chain.0001.desc:0 "伍孚は董卓の暗殺に失敗し、すでに処刑された。知らせが届いたとき、人々はまず門の外をちらりと見てから声を潜めた。まるであの刀のことを口にするだけで、身を滅ぼす災いを招くかのように。\n\nあなたは暗殺の顛末を聞きながら、机の縁で指を止めた。朝廷には董卓を痛罵する者は少なくないが、その面前まで歩み寄る勇気のあった者は、今や誰もが口にするのを憚る一つの屍となった。伍孚は彼を殺せなかったばかりか、かえって宮門に兵を満たし、側近の一人ひとりに猜疑を向けるもっともな口実を与えてしまった。\n\n誰かが先に動くのを待つばかりなら、あなたたちはこうして声を潜めて議論するのをあと何年も続けられるだろう。だがその時、朝廷にはまだ誰が残っているというのか。"
 hd_cao_chain.0001.a:0 "伍君の死を、戒めとせねばならぬ。"
 hd_cao_chain.0002.t:0 "満座の涙"
 hd_cao_chain.0002.desc:0 "伍孚の死後、朝廷での議論はますます慎重になった。王允は酒宴にかこつけて旧臣を集めた。扉が閉ざされると、席上では俯く者が現れ、やがて袖で顔を覆って声を上げて泣き出した。酒をいくらも口にせぬうちに、泣き声が話し声をかき消していた。\n\nあなたは彼らが董卓の罪状を数え上げるのを聞いた。誰が追われ、何が奪われ、天子がいかに制せられているか。話が進むにつれ、皆が口にするのは「漢室はまさに滅びんとす」の一言ばかりになった。まるで悲しみを十分に切実に語れば、それで臣下の本分を尽くしたことになるかのように。\n\nあなたの口から笑い声が漏れた。涙に濡れたいくつもの目があなたに向けられ、王允も話を止めた。満座はようやく泣きやんだが、皆、なぜまだ笑えるのか、あなたの説明を待っている。"
 hd_cao_chain.0002.a:0 "夜は泣いて朝に至り、朝は泣いて夜に至る。それで董卓を泣き殺せるのか？"
 hd_cao_chain.0003.t:0 "借刀"
 hd_cao_chain.0003.desc:0 "あの宴の後、王允はあなたの笑い声を忘れていなかった。再び董卓誅殺の件を議したとき、彼はまず左右を退け、あの日の言葉が一時の激情だったのか、それとも既に考えがあるのかとあなたに尋ねた。\n\n「泣いても賊は除けぬが、刀ならあるいは」あなたはゆっくりと言った。董卓はなおあなたが近づくことを許している。他の者には入れぬあの門を、あなたにはくぐる機会がある。王允は長く答えなかったが、最後に七星宝刀を取り出し、二人の間に置いた。\n\nあなたは刀の柄を握り、わずかに抜いた。冷たい光が指の節に映る。刀を借りるのはたやすい。だがいざ抜くときには、満座の公卿がその危険を代わりに負ってくれるわけではない。今回は、あなた自身が董卓の前まで歩み出なければならない。"
 hd_cao_chain.0003.a:0 "刀はすでに手にある。残る事は我にあり。"
 hd_cao_chain.0003.a.tt:0 "七星宝刀があなたの腰に佩かれた。"
 hd_cao_chain.0004.t:0 "鏡中の寒光"
 hd_cao_chain.0004.desc:0 "七星刀を身の脇に隠すと、衣越しにも鞘の角が感じられた。あなたは董卓に近づき、彼が目を逸らすのを待って、ゆっくりと刀の柄を握った。\n\nよりによって刃が鞘を離れたその瞬間、銅鏡に一点の光がきらめいた。董卓は勢いよく振り返り、刀を持って何をするのかと問うた。あなたは考える暇もなく、刀を横たえて捧げ持ち、身をかがめて献上の宝物を持参したのだと言った。その視線はなおあなたの背に留まっている。あと少しでも長く立っていれば、先ほどの言い訳も問い詰められて持ちこたえられるとは限らない。\n\nあなたはようやく門の外まで退いたが、掌はとうに汗でびっしょりだった。賊を除く企ては空に帰した。次の召し出しには、決して応じてはならない。今ただ一つ肝心なのは、追手の騎兵が城を出る前に十分遠くまで逃れることだ。"
 hd_cao_chain.0004.a:0 "事は成らず、急ぎ去れ！"
 hd_cao_chain.0006.t:0 "道中の古き血"
 hd_cao_chain.0006.desc:0 "莱蕪の住まいはすっかり落ち着き、門の外にはもはや追手の騎兵の気配もない。佩剣を外してはじめて、あなたは自分がまだ門前を通る足音の一つひとつに耳を澄ませていることに気づいた。\n\n呂伯奢一家の血も、あなたについてここまで来ていた。説客や流言はそれぞれ勝手な話をこしらえ、まるであなたの善悪を定めさえすれば、あの夜をもう一度やり直せるかのようだ。だがあなたは覚えている。刀を振り下ろしたとき、自分は彼らの言うほど落ち着いてなどいなかった。\n\n灯火が剣の影を机の上に落としている。あなたは手を伸ばして剣を脇へどけ、門の外の者を呼び入れた。なおも従おうとする者もいれば、あなたがいかに滅びるかを見物しようと待つ者もいる。今ここで足を止めて一人ひとりに弁明すれば、それこそ彼らの思う壺だろう。"
 hd_cao_chain.0006.a:0 "寧ろ我、人に負くとも、人をして我に負かしむることなかれ。"
 hd_cao_chain.0094.t:0 "莱蕪にて衆を整う"
 hd_cao_chain.0094.desc:0 "莱蕪の城外にはまた天幕が増えた。一族や旧部の知らせが次々と届き、馳せ参じることのできる者はそれぞれ部曲と家財を携え、自ら来られない者も、軍中に何が足りぬかを人を遣わして尋ねてきた。数日前までは道々の追手を警戒しなければならなかったが、今では命令を待つ者がいる。\n\n銭糧と丹陽兵の名簿が机の前に届けられ、あなたは一項ずつ目を通して、地図の片隅に重しとして置いた。足場はもう得た。次になすべきは、もはや董卓の追及を逃れることだけではない。四方に散らばる憤りを、誰かが軍令と糧道と前へ進む部隊に変えなければならないのだ。\n\nあなたは陣中に隊列を組み直すよう命じた。天下はいまだ定まらぬ。曹氏は、ひとまず身を寄せる場所を得ただけの逃亡の一家で終わるわけにはいかない。"
 hd_cao_chain.0094.a:0 "莱蕪を基とし、軍を整えて出陣を待つ。"
 hd_cao_chenliu_danyang_army:0 "莱蕪丹陽兵"
