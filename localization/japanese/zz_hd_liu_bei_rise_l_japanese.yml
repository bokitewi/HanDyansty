l_japanese:
 hd_liu_bei_rise.0100.t:0 "黄旗、野に遍し"
 hd_liu_bei_rise.0100.desc:0 "急報には地名が次々と並び、黄巾の至る所で、官軍はすでに乱衆と交戦している。使者は逃げ惑う民のことを語りながら袖で顔を拭い、再び口を開いたときには声がかすれていた。\n\nあなたは彼を座らせて水を飲ませ、自分はもう一度軍報に目を通した。これらの州県には遠いものも近いものもある。だが逃げ惑う人々のうち、妻子を守るためでない者が一人でもいるだろうか。今日兵が少ないというだけで旗を巻いてしまえば、この先、あなたに従おうとする者たちに何と言って声をかけられようか。\n\n帳の外で、どこへ向かうのかと問う者がいた。あなたは待っている顔ぶれを見渡し、ふとその一言がいつもより重く感じられた。人を救いに行くなら、目の前のこの者たちも一緒に連れて行かねばならない。"
 hd_liu_bei_rise.0100.a:0 "衆を率いて従軍し、共に黄巾を討つ。"
 hd_liu_bei_rise.0100.b:0 "兵は少なく将も乏しい。ひとまず部衆を守る。"
 hd_liu_bei_rise.0200.t:0 "関東の義旗"
 hd_liu_bei_rise.0200.desc:0 "関東の諸侯が董卓討伐の兵を挙げたとの知らせが届いた。使者は盟書の名号を語り、各家の旌旗を指し示しながら熱を込めて話したが、あなたの旗印について問われると、ふと言葉に詰まった。\n\nあなたはあの諸侯の席に連なってはおらず、麾下の兵も各路の大軍とは比べものにならない。だが董卓が朝廷を挟んでいることは遠近の誰もが知っている。盟書に自分の名がないというだけでこの件は関わりないと決めつけるなら、これまで口にしてきた言葉にどれほどの価値があるというのか。\n\nあなたは軍情を聞き終えると、旅装を点検させた。部衆はなおあなたが率いている。彼らが聞きたいのは、あなた自身の決断なのだ。"
 hd_liu_bei_rise.0200.a:0 "盟書に名はなくとも、賊を討つ心はある。"
 hd_liu_bei_rise.0200.b:0 "この度の董卓討伐には関わらない。"
 hd_liu_bei_rise.0300.t:0 "故人からの一通"
 hd_liu_bei_rise.0300.desc:0 "「劉玄徳は今どこにいる？」董卓討伐の諸軍が散って一月、彼の消息に目を留めたあなたは書吏を呼び止めた。他の者は皆それぞれどれだけの兵糧を持ち帰ったかを数えているが、あなたはむしろこのかつての同窓がどこに身を落ち着けたのかを知りたかった。\n\n玄徳が志を語るとき、その気概はいつも手元の兵馬より大きい。それは必ずしも悪いことではない。ただ乱世にあっては、志の気概だけで一つの陣営を支えることはできない。こちらに助力してくれる者が一人増えれば、南方の軍務にも一つ頼りが増える。\n\nあなたは書吏に新しい竹簡を持って来させたが、文面は属吏を召し出すときのように硬くする必要はない。故人を招くのだから、同盟の意をはっきり書けばよい。彼がなお陣営の衆を率いて各地を転々としているなら、こちらで受け入れることもできる。"
 hd_liu_bei_rise.0300.a:0 "玄徳に書を送り、北へ招く。"
 hd_liu_bei_rise.0300.b:0 "ひとまず招かず、それぞれの務めに安んじる。"
 hd_liu_bei_rise.0301.t:0 "伯圭からの書状"
 hd_liu_bei_rise.0301.desc:0 "「伯圭兄はまだ私を覚えていてくれたか」書中の招きの一文を読んだところで、あなたの口元はもう緩んでいた。使者はさらに同盟のことを語り、あなたがなお陣営の衆を率いて流浪しているなら、公孫瓚の治所に駐屯してもよいと言った。\n\nあなたは彼を近くに招き、故人の近況を尋ねた。各地を転々とする中で、兵が少ない、名が軽いと嫌われるのには慣れてしまったが、この手紙はまずどれだけの兵馬を連れて来られるかを問うてはいなかった。だがひとたび応じれば、そこをただの仮の宿と見なすわけにはいかない。伯圭に事あらば、あなたもまた力を尽くさねばならない。\n\n手の中で書状がわずかに丸まった。あなたはその端を伸ばし、改めて使者を見た。故人からの問いかけなのだから、返事は本心から出るべきもので、ただ社交辞令をいくつか持ち帰らせるだけではいけない。"
 hd_liu_bei_rise.0301.a:0 "伯圭と共に助け合おう。陣営を移して北上する。"
 hd_liu_bei_rise.0301.b:0 "伯圭の厚意に感謝しつつ、別の道を図る。"
 hd_liu_bei_rise.0400.t:0 "子龍と相知る"
 hd_liu_bei_rise.0400.desc:0 "公孫瓚の領内にしばらく滞在するうちに、あなたは軍中の顔ぶれと次第に親しくなった。趙雲もその一人だった。兵事を語っても決して誇らず、郷里や流民のことを尋ねると、いつも言葉を惜しまない。\n\nこの日の雑談で、また軍に加わった理由の話になった。彼は言った。乱世に生まれたからには、民を落ち着かせてくれる人に従いたいと願うものだ、と。すでに立ち上がっていたあなたは、その一言を聞いて元の席に座り直した。こうした言葉を口にするのは難しくない。難しいのは、口にした後、利害に直面してもなお覚えていることだ。\n\n彼は今なお伯圭の麾下で務めており、あなたもすぐに故人から部将を一人譲り受けようとは思わない。今日はまず一人の心の友を得た。それだけでも得がたい収穫である。"
 hd_liu_bei_rise.0400.a:0 "子龍の志は、我と合う。"
 hd_liu_bei_rise.0410.t:0 "旧友、門を叩く"
 hd_liu_bei_rise.0410.desc:0 "来訪者がまだ名を告げ終わらぬうちに、あなたはもう戸口のそばで立ち上がっていた。趙雲が来たのだ。旅装を携え、その面持ちは初めて会った時と同じく静かで落ち着いていた。\n\n伯圭のもとで交わって以来、あなたたちは互いが何をしたいのかを知っていた。ただそれぞれに行くべき所があり、惺々相惜むの一言ですべての手はずを変えるわけにはいかなかった。今、彼は以前の所を離れ、自ら主を選べる身となり、こうしてあなたのもとを訪れ、まだ共に歩む気があるかと尋ねている。\n\nあなたは彼の携えてきた旅装を見て、厳かな招聘の言葉をいくつか述べようと思ったが、口をついて出たのは、道中で休めたかという問いだけだった。友がこれからの道をあなたと共に歩むと託してくれる。それは多くの慷慨の誓いよりも重い。"
 hd_liu_bei_rise.0410.a:0 "子龍よ、ここに留まり共に大事を図ってくれ。"
 hd_liu_bei_rise.0500.t:0 "徐州城下の影"
 hd_liu_bei_rise.0500.desc:0 "曹操は兗州を手に入れ、さらに隣州へと勢力を伸ばしている。州府に届く軍報は一通ごとに切迫し、徐州の城と糧道は、もはや平時のように扱うことはできない。\n\nあなたは治める諸県の守備を改めて調べさせ、崩れた城堞や欠けた戍卒を一つひとつ帳簿に列挙させた。修繕は先に進められるが、外からの援助には来てくれる者が要る。劉玄徳はかねてより危うきを扶け困窮を救う志を持つ。使者を遣わして招けば、あなたと盟を結び、徐州へ助けに来てくれるかもしれない。\n\n机の上には城を守るための帳簿と、まだ封をしていない書状が並んでいる。今手を打たなければ、次に耳にするのは、もはや隣州の知らせではないかもしれない。"
 hd_liu_bei_rise.0500.a:0 "城の守りを修め、使者を遣わして玄徳を招く。"
 hd_liu_bei_rise.0500.b:0 "守備はこのままとし、ひとまず招かない。"
 hd_liu_bei_rise.0501.t:0 "徐州からの招き"
 hd_liu_bei_rise.0501.desc:0 "陶謙の使者があなたの前に立っている。衣の埃もまだ払い落とさぬまま、徐州の守備を語るのに夢中で、水を一杯求める余裕すらない。「使君が望みをかけておられるのは、まさに玄徳殿なのです」そう言い終えても、彼は座ろうとしなかった。\n\nあなたは書状を受け取り、州の様子をもう少し詳しく話すよう頼んだ。耳に入る地名から思い浮かぶのは城だけではない。大軍が迫りつつあることをまだ知らぬ城中の民もいる。だがあなたの後ろにも部衆がおり、あなたに出口を探してくれることを期待している者たちがいる。\n\n陶使君はあなたと盟を結んで助け合うことを望んでおり、あなたがなお陣営の衆を率いて流浪しているなら、徐州へ陣営を移すことも受け入れるという。あなたは書状を閉じた。この「玄徳殿」という呼びかけに応じるなら、これからは本当の援助を差し出さねばならず、使者をぬか喜びさせるだけで終わらせてはならない。"
 hd_liu_bei_rise.0501.a:0 "陶使君と心を一つにし、陣営を徐州へ移そう。"
 hd_liu_bei_rise.0501.b:0 "この約にはにわかに応じかねる。どうかお伝え願いたい。"
 hd_liu_bei_rise.0600.t:0 "麋氏の心意"
 hd_liu_bei_rise.0600.desc:0 "麋竺は助力の話をするにあたり、どんな官位を約束してくれるのかを急いで問うことはせず、まずあなたの部衆が今どのように落ち着いているかを尋ねた。あなたが答えると、彼はようやく麋芳のことに触れ、さらに話をゆっくりと両家の婚姻へと導いていった。\n\nあなたは酒杯を置き、彼に恭しく一揖した。各地を奔走して以来、自家の門戸の行く末まであなたと結びつけようとする者はまれであった。この心意を軽んじることはできない。ただ人にはそれぞれ気にかけるものがあり、麋氏の兄弟が今いる所を離れられるのか、この婚姻がふさわしいのかは、まずはっきりさせねばならない。\n\n子仲はなおあなたの返事を待っている。人材は喜んで招きたいし、情義はありがたく受けたい。だが婚姻を結ぶかどうかは、席上で意気投合したからといって、他人の一生を代わりに決めてしまうわけにはいかない。"
 hd_liu_bei_rise.0600.a:0 "お二方の助力を得て、秦晋の好みも結びたい。"
 hd_liu_bei_rise.0600.b:0 "お二方の助力は願いたいが、婚姻の話はしない。"
 hd_liu_bei_rise.0700.t:0 "病床の州印"
 hd_liu_bei_rise.0700.desc:0 "目を通すべき文書の束が床の前に届けられたが、あなたは長いこと見つめたまま、一番上の一巻すら広げられなかった。病は日に日に重くなり、州の大小の務めは、もはや気力だけで支えて片付けられるものではなくなった。\n\n劉備は今まさに徐州にいる。あなたが治める州郡と部衆を彼に託せば、死後の慌ただしい争奪を避けられるかもしれない。だがこれは結局、兵を一隊貸したり援助を一度頼んだりするのとはわけが違う。ひとたび渡してしまえば、治下の官吏がこれから誰の号令に従うのか、新たな答えが出ることになる。\n\nあなたは州印をもっと近くに置かせた。陶家には陶家の継承がある。だが徐州の軍民には、まだ堂上に座って事を決められる者が必要なのだ。"
 hd_liu_bei_rise.0700.a:0 "劉備でなければこの州を安んじることはできぬ。"
 hd_liu_bei_rise.0700.b:0 "家業には自ずと帰する所がある。州を譲るには及ばぬ。"
 hd_liu_bei_rise.0701.t:0 "徐州を託される"
 hd_liu_bei_rise.0701.desc:0 "使者が陶謙の意向を二度述べても、あなたはなお州郡の簿籍に手を伸ばさなかった。そもそも徐州に来たときに約束したのは助力であった。それが今日、陶使君が肩に負う重荷を丸ごと引き受けることになろうとは。\n\n「これは虚礼の譲りではございません」使者は静かに言いながら、文書をさらに一寸前へ押し出した。そこにびっしりと並ぶ県名を目にすると、城門や村々、そして守備兵がもう旗印を替えずにいてくれることを願う人々の姿が目の前に浮かぶようだった。陶家の家業には別の継承者がいる。あなたの手に渡されるのは、これらの州郡のこれからの安危なのだ。\n\nあなたは立ち上がって二歩ほど歩き、また机の前に戻った。辞退するのはたやすい。だが陶使君はなお病床で返事を待っており、徐州も誰かが担わねばならない。"
 hd_liu_bei_rise.0701.a:0 "この重託を受けた以上、決して背きはせぬ。"
 hd_liu_bei_rise.0701.b:0 "この任はあまりに重い。備には務まりませぬ。"
 HD_LIU_BEI_RISE_STORY_STATUS:0 "現在の篇章：#V [Story.MakeScope.Var('hd_liu_bei_life_phase').GetFlagName]#!\n劉玄徳は涿郡から身を起こし、筵を織り草鞋を売る出自でありながら、中山靖王の末裔を自称している。乱世の中、生死を共にしようとする者たちを連れて四方を転々とし、部衆を落ち着かせ、抱負を実現できる地を探している。"
 hd_liu_bei_phase_yellow_turban:0 "黄巾討伐に従う"
 hd_liu_bei_phase_wandering:0 "四方を転々とする"
 hd_liu_bei_phase_anti_dong:0 "従軍して董卓を討つ"
 hd_liu_bei_phase_gongsun:0 "伯圭に身を寄せる"
 hd_liu_bei_phase_zhao_yun:0 "子龍と知り合う"
 hd_liu_bei_phase_xuzhou:0 "徐州に客居する"
 hd_liu_bei_phase_xuzhou_lord:0 "徐州を領する"
 hd_lb_xuzhou_prepared_defenses:0 "徐州の守備を整える"
 hd_lb_xuzhou_prepared_defenses_desc:0 "陶謙が城堞を修繕させ、戍卒を補充させたため、この地の守備は一新された。"
 hd_lb_yellow_join_tt:0 "あなたは部隊を率いて官軍に加わり、黄巾と戦う。"
 hd_lb_dong_join_tt:0 "盟書にあなたの名はないが、あなたは関東の諸軍に従って董卓討伐に進む。"
 hd_lb_gongsun_send_tt:0 "書状は玄徳の手に届けられる。応じるか否かは、彼自身が決める。"
 hd_lb_gongsun_accept_tt:0 "あなたがなお陣営の衆を率いて流浪しているなら、陣営を移して北上し、伯圭の治所に駐屯する。"
 hd_lb_tao_defense_tt:0 "あなたは劉玄徳のもとへ使者を遣わし、徐州へ助けに来てくれるよう請う。"
 hd_lb_tao_accept_tt:0 "あなたがなお陣営の衆を率いて流浪しているなら、陣営を徐州へ移し、近くで助力する。"
 hd_lb_mi_visit_tt:0 "麋竺と麋芳が相次いであなたの帳下に加わる。麋家にふさわしい女性がいれば、あなたの妻として嫁がせる。"
 hd_lb_mi_recruit_only_tt:0 "麋竺と麋芳が相次いであなたの帳下に加わる。"
 hd_lb_bequest_tao_tt:0 "あなたは治める州郡と部衆をすべて劉玄徳に託す。#EMP 引き継ぎが済めば、あなたもこの世を去る。#!"
 hd_lb_bequest_liu_tt:0 "あなたは陶謙が治めていた州郡と部衆を引き継ぎ、徐州の主となる。引き継ぎが済むと、陶使君はほどなく息を引き取る。"
