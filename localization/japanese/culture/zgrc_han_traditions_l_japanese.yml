l_japanese:
 # ============================================================
 # 共有传统（2 个）
 # ============================================================
 tradition_zgrc_hua_xia_li_yue_name:0 "華夏礼楽"
 tradition_zgrc_hua_xia_li_yue_desc:0 "服章の美しさを華といい、礼儀の大なるゆえに夏と称する。この文化は黄帝を始祖と奉じ、礼楽によって尊卑を定め、親疎を分かつ。"
 zgrc_hua_xia_li_yue_heritage_discount_desc:0 "この[culture|E]はもともと華夏の一系である"
 zgrc_hua_xia_li_yue_alien_penalty_desc:0 "この[culture|E]は華夏の一系ではなく、まず礼楽と法度を習わねばならない"

 culture_parameter_zgrc_huayi_zhibian_effect:0 "[GetTrait('zgrc_hanjia_guandai').GetName( GetNullCharacter )]が解禁され、郡望の豪族は互いに通婚しやすくなる。"
 culture_parameter_zgrc_ruxiang_suisu_effect:0 "人物の風俗は出生地によって定まり、長く客居すれば、郷に入っては郷に従うようになる。"

 tradition_zgrc_hou_sheng_shen_si_name:0 "厚生慎死"
 tradition_zgrc_hou_sheng_shen_si_desc:0 "徳を正し用を利して生を厚くし、祖を敬い遠きを追って死を慎む。この文化は平時には忍耐し己を律し、土地に安んじて移住を好まないが、ひとたび国家に危難があれば、郷を挙げて従い、身を顧みず奮い立つ。"

 culture_parameter_zgrc_linnan_xiangying_effect:0 "社稷の危難や故土回復の際には、郷里が衆を集めて義兵を挙げ、[GetMaA('zgrc_hanjia_yiyong').GetName]の[men_at_arms|E]として馳せ参じる。"
 # ============================================================
 # 区域风俗传统（20 个）
 # ============================================================
 tradition_zgrc_yandan_legacy_name:0 "燕丹の遺風"
 tradition_zgrc_yandan_legacy_desc:0 "人の急に敢えて赴くは、燕丹の遺風なり。この文化の人々は義勇に富み命を軽んじ、隣里に難があれば全力で救援に駆けつけ、土地を守ることでは決して人後に落ちない。"
 tradition_zgrc_kangkai_beige_name:0 "慷慨悲歌"
 tradition_zgrc_kangkai_beige_desc:0 "丈夫相集いて遊戯し、悲歌慷慨す。この文化の人々は意気高く武を尚び、死を軽んじ義を重んじるが、それゆえに身命をも惜しまない。"
 tradition_zgrc_qidi_jinxiu_name:0 "斉地の錦繡"
 tradition_zgrc_qidi_jinxiu_desc:0 "氷紈・綺繡を織り成し、冠帯衣履の天下と号す。この文化は織物によって富み、衣冠服飾は天下に模倣されるが、その欠点は奢侈と朋党にある。"
 tradition_zgrc_sage_education_name:0 "聖人の教化"
 tradition_zgrc_sage_education_desc:0 "斉一変すれば魯に至り、魯一変すれば道に至る。この文化は孔門の師承を受け継ぎ、学を好み礼を重んじるが、礼文は備わっても実は乏しい。"
 tradition_zgrc_han_legalist_governance_name:0 "法術治民"
 tradition_zgrc_han_legalist_governance_desc:0 "申韓の烈しさ、刻害の余風。この文化は文法を好んで吏治を重んじ、信賞必罰を旨とするが、民は訴訟によって疎遠になる。"
 tradition_zgrc_wenguan_tianxia_name:0 "文冠天下"
 tradition_zgrc_wenguan_tianxia_desc:0 "文翁がその教えを唱え、相如がその師となる。この文化の風俗は愁苦せず、文辞によって名を顕し、文章は天下に冠たる。"
 tradition_zgrc_jizi_legacy_name:0 "箕子の遺教"
 tradition_zgrc_jizi_legacy_desc:0 "箕子は去りて朝鮮に之き、民に礼義を教う。この文化では民は互いに盗まず、婦人は貞信を守り、柔順で吏民が互いに安んじている。"
 tradition_zgrc_luhai_haoyou_name:0 "陸海の豪右"
 tradition_zgrc_luhai_haoyou_desc:0 "陸海と号され、九州の膏腴たる地。この文化は五方の人々が雑居し、世家は礼文を好み、豪傑は任侠を好むため、風俗は純一でない。"

 tradition_zgrc_hexi_pastoral_frontier_name:0 "河西の牧政"
 tradition_zgrc_hexi_pastoral_frontier_desc:0 "水草は牧畜に適し、涼州の家畜は天下に豊かなり。この文化は馬政によって辺境を保ち、穀物は安く盗みは少なく、吏民は互いに親しむ。"
 tradition_zgrc_frontier_chivalry_name:0 "辺地の任侠"
 tradition_zgrc_frontier_chivalry_desc:0 "気を尚び任侠を好み、仇に報いること直きに過ぐ。この文化の人々は剣と義によって身を立て、睚眦の怨みにも必ず報いるが、恩礼に薄く、疎遠になりやすい。"
 tradition_zgrc_zheng_wei_music_name:0 "鄭衛の音"
 tradition_zgrc_zheng_wei_music_desc:0 "桑間濮上、男女しばしば集い会う。この文化は宴楽を尊び、交遊が風潮となっているが、その欠点は嫁娶と葬送が度を越すことにある。"
 tradition_zgrc_wu_gui_fangshu_name:0 "巫鬼方術"
 tradition_zgrc_wu_gui_fangshu_desc:0 "祭祀を好み、史巫を用いる。ゆえにその俗は巫鬼なり。この文化では祠祀が広く行われ、巫覡が輩出し、呪詛の術もその間にひそかに行われている。"
 tradition_zgrc_merchant_hubs_name:0 "商賈の通衢"
 tradition_zgrc_merchant_hubs_desc:0 "都会に輻輳し、財貨の集まる所。この文化の人々は商いを好み、四方に利を追うが、財を貴び義を賤しみ、富者を高く貧者を低く見る。"
 tradition_zgrc_classics_literature_name:0 "経術文章"
 tradition_zgrc_classics_literature_desc:0 "経術を好み、功名を誇り、ゆったりと闊達にして智に足る。この文化は弦歌が絶えず、書を著し説を立て、文教は四方に流れる。"
 tradition_zgrc_hunting_warfare_name:0 "射猟戦備"
 tradition_zgrc_hunting_warfare_desc:0 "戎狄に迫り近く、戦備を修習し、射猟を先とする。この文化は弓馬に習熟し、名将を輩出するが、素朴で礼文に乏しい。"
 tradition_zgrc_wuyue_swordsmanship_name:0 "呉越の剣風"
 tradition_zgrc_wuyue_swordsmanship_desc:0 "その君は勇を好み、その民は剣を用いることを好む。この文化は死を軽んじ激しやすく、剣士を輩出し、闘将の気風は東南に冠たる。"
 tradition_zgrc_jingchu_watermanship_name:0 "荊楚の水郷"
 tradition_zgrc_jingchu_watermanship_desc:0 "江漢の川沢の豊かさ、三江五湖の利。この文化は舟を馬とし、漁と稲作で自給し、水戦では地の利を存分に得る。"
 tradition_zgrc_zhongyuan_houtu_name:0 "中原の厚土"
 tradition_zgrc_zhongyuan_houtu_desc:0 "河洛の地、民の性は重厚なり。この文化は陣列が整然とし、守りは山のごとく、辺境の軽騎の剽悍さと表裏をなす。"
 tradition_zgrc_grain_storage_name:0 "服田力穡"
 tradition_zgrc_grain_storage_desc:0 "稼穡を好み、衣食を倹しくし、もって蓄えをなす。この文化は本業に励んで農に力を尽くし、倉廩に蓄えがあり、凶年にも飢えない。"
 tradition_zgrc_baoyuan_shouyi_name:0 "抱元守一"
 tradition_zgrc_baoyuan_shouyi_desc:0 "元を抱き一を守り、清静にして欲少なし。この文化は黄老の道を慕い、服食・導引・方薬による養生を行い、心を清めて長寿を保つ。"
