l_japanese:
 hd_refill_maa_gold_interaction:0 "私兵の欠員を買い補う"
 hd_refill_maa_gold_interaction_desc:0 "[treasury|E]（国庫がなければ[gold|E]）を費やして直ちに兵員を募り、欠員の出た私有の[men_at_arms|E][regiments|E]を補充する。[title_men_at_arms|E]は各称号の下で別に補充する。"
 hd_refill_maa_any_personal_regiment_tt:0 "私有の[men_at_arms|E][regiment|E]を持っていなければならない"
 hd_refill_maa_unfull_personal_regiment_tt:0 "欠員のある私有の[men_at_arms|E][regiment|E]がなければならない"
 hd_refill_personal_maa_full_tt:0 "私有の[men_at_arms|E][regiments|E]が[THIS.Char.MakeScope.ScriptValue('hd_refill_personal_maa_soldiers_tt_value')|0P][soldiers|E]を得る$refill_maa_regiments_fully_reinforced_tt$"
 hd_refill_personal_maa_partial_tt:0 "私有の[men_at_arms|E][regiments|E]が[THIS.Char.MakeScope.ScriptValue('hd_refill_personal_maa_soldiers_tt_value')|0P][soldiers|E]を得る\n#alert_trial $BULLET_WITH_TAB$資金が足りず、連隊は一部しか補充されない！#!"
 hd_refill_personal_maa_cost_treasury_tt:0 "[treasury_i][THIS.Char.MakeScope.ScriptValue('hd_refill_personal_maa_cost_tt_value')|0N]を失う"
 hd_refill_personal_maa_cost_gold_tt:0 "[gold_i][THIS.Char.MakeScope.ScriptValue('hd_refill_personal_maa_cost_tt_value')|0N]を失う"

 hd_refill_title_maa_gold_interaction:0 "称号兵の欠員を買い補う"
 hd_refill_title_maa_gold_interaction_desc:0 "[treasury|E]（国庫がなければ[gold|E]）を費やして直ちに兵員を募り、この称号の欠員の出た[title_men_at_arms|E]を補充する。他者に貸している兵も補う。冷却は称号ごとに別々に数える。"
 hd_refill_title_maa_unfull_regiment_tt:0 "この称号に欠員のある[title_men_at_arms|E][regiment|E]がなければならない"
 hd_refill_title_maa_cooldown_tt:0 "この称号は半年以内に補充済みで、まだ冷却中"
 hd_refill_title_maa_full_tt:0 "[THIS.Title.GetName]の[title_men_at_arms|E]が[THIS.Title.MakeScope.ScriptValue('hd_refill_title_maa_soldiers_tt_value')|0P][soldiers|E]を得る$refill_maa_regiments_fully_reinforced_tt$"
 hd_refill_title_maa_partial_tt:0 "[THIS.Title.GetName]の[title_men_at_arms|E]が[THIS.Title.MakeScope.ScriptValue('hd_refill_title_maa_soldiers_tt_value')|0P][soldiers|E]を得る\n#alert_trial $BULLET_WITH_TAB$資金が足りず、連隊は一部しか補充されない！#!"
 hd_refill_title_maa_cost_treasury_tt:0 "[treasury_i][THIS.Title.MakeScope.ScriptValue('hd_refill_title_maa_cost_tt_value')|0N]を失う"
 hd_refill_title_maa_cost_gold_tt:0 "[gold_i][THIS.Title.MakeScope.ScriptValue('hd_refill_title_maa_cost_tt_value')|0N]を失う"
 hd_refill_title_maa_cooldown_set_tt:0 "[THIS.Title.GetName]の買い補いは6か月の冷却に入る"
 HD_REFILL_TITLE_MAA_BTN_TT:0 "[Title.GetNameNoTooltip]の[title_men_at_arms|E]を補充する。他者に貸している兵も補う。\n欠員 #V [Title.MakeScope.ScriptValue('hd_refill_title_maa_missing_tt_value')|0]#! 人、全補充に #V [Title.MakeScope.ScriptValue('hd_refill_title_maa_full_cost_tt_value')|0]#! [Select_CString( Title.GetHolder.HasTreasury, '国庫', '金' )]が必要。\n冷却は称号ごとに6か月[Select_CString( Title.MakeScope.Var('hd_refill_title_maa_cd').IsSet, '、この称号はまだ冷却中', '' )]。\n[Select_CString( Character.IsPlayerInteractionValid('hd_refill_title_maa_gold_interaction'), '', Character.GetPlayerInteractionTooltip('hd_refill_title_maa_gold_interaction') )]"
