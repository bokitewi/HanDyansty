 hd_yiguan_guinan_decision: "州を挙げて南に帰す"
 hd_yiguan_guinan_decision_desc: "胡人の支配は日ごとに苛烈になり、南方の朝廷は目と鼻の先にある。義旗を挙げ、南朝の兵馬と南北呼応しさえすれば、我が州郡を率いて華夏に復帰できる。"
 hd_yiguan_guinan_decision_tooltip: "挙兵してあなたの[liege|E]から離脱し、境を接する南方の宗主に帰附する"
 hd_yiguan_guinan_decision_confirm: "州を挙げて南に帰せ！"
