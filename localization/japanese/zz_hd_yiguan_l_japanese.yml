 hd_yiguan_sinicization_decision_tooltip: "$hd_dc_con_sinicization_decision_tooltip$"
 hd_yiguan_sinicization_decision_confirm: "$hd_dc_con_sinicization_decision_confirm$"
 hd_yiguan_celestial_decision: "天朝の制を建てる"
 hd_yiguan_celestial_decision_desc: "我が王朝はすでに服を改め姓を変え、ことごとく漢制を行っている。中原の典章に倣い、天朝の体制を建てる時が来た。"
 hd_yiguan_celestial_decision_tooltip: "[GetGovernment('celestial_government').GetName]に改める"
 hd_yiguan_celestial_decision_confirm: "制を建て朝を立てよ！"
 hd_yiguan_celestial_decision_effect_tt: "あなたは[GetGovernment('celestial_government').GetName]に改める。"
 hd_yiguan_return_capital_decision: "旧都に還る"
 hd_yiguan_return_capital_decision_desc: "旧都はすでに回復され、宗廟陵寝はみな北方にある。旧都に還都してこそ、歴代の祖霊を慰め、天下に正朔の所在を知らしめることができる。"
 hd_yiguan_return_capital_decision_tooltip: "洛陽または長安に遷都する"
 hd_yiguan_return_capital_decision_confirm: "旧都に還れ！"
 hd_yiguan_return_capital_hold_tt: "あなたは洛陽または長安を直轄しなければならない"
 hd_yiguan_return_capital_already_tt: "あなたの都はまだ洛陽にも長安にもない"

 # ---------- 通告 ----------
 hd_yiguan_toast_start: "北方は胡人の手に落ち、衣冠の士族は次々と南へ渡った。"
 hd_yiguan_toast_phase2: "南から来た流人はすでに江左に落ち着いた。"
 hd_yiguan_toast_phase3: "南北が江を隔てて対峙する形勢が定まった。"
 hd_yiguan_toast_restored: "王師は中原を奪還し、衣冠南渡はここに終わりを告げた。"
 hd_yiguan_toast_sinicized: "北方の胡人はことごとく漢制を行い、胡漢は次第に一つになりつつある。"
 hd_yiguan_toast_lost: "中原はことごとく胡人の手に落ち、江左は一隅に偏安している。"
 hd_yiguan_toast_partition: "南北分治は既定の事実となった。"

 hd_yiguan.0001.t: "衣冠南渡"
 hd_yiguan.0001.desc: "胡騎が中原を踏み破ったという知らせが次々と届く。北方の城邑は相次いで陥落し、胡人の君王はかつての宮闕で即位して名号を称した。世家大族は老人を助け子供を連れて淮水を渡り江を越え、南へと奔った。逃げ遅れた者は、胡人の支配下で屈辱に耐えて生き延びるほかない。\n\n渡し場は南へ逃れる車馬でひしめき、士族の衣冠と庶民のぼろが入り混じっている。天下の重心は、ひそかに南へと移りつつある。"
 hd_yiguan.0001.a: "天下はどこへ向かうのか？"
 hd_yiguan.0002.t: "流人次第に定まる"
 hd_yiguan.0002.desc: "喪乱がやや収まり、南から来た流人は江左に落ち着いた。朝廷は彼らのために僑郡県を立て、北方の旧族は新天地で家門を再建した。南北の士人は同じ朝廷で共に仕えているが、時に軋轢も生じる。"
 hd_yiguan.0002.a: "ひとまず落ち着こう。"
 hd_yiguan.0003.t: "南北対峙"
 hd_yiguan.0003.desc: "二十余年が過ぎ、南北の構図は次第にはっきりしてきた。江南は兵を練り粟を蓄え、北方では胡漢が雑居し、双方は淮水と大江を隔てて相対している。北伐と南侵の議論は、朝堂で収まったためしがない。"
 hd_yiguan.0003.a: "先はまだ長い。"
 hd_yiguan.0011.t: "中原回復"
 hd_yiguan.0011.desc: "王師は北上し、旌旗は再び中原の城頭に立てられた。江南に流寓していた士族は遠く故郷を望み、その場で声を上げて泣き崩れる者も少なくなかった。衣冠南渡の歳月は、ここに終止符を打った。"
 hd_yiguan.0011.a: "旧都に再び光あり！"
 hd_yiguan.0012.t: "胡漢合流"
 hd_yiguan.0012.desc: "北方の胡人の君主は服を改め姓を変え、漢制を推し進め、かつての胡漢の別は日ごとにぼやけていった。南方の士人はなおも正朔の所在を自任しているが、北方はもはや彼らの記憶にある胡塵の地ではない。"
 hd_yiguan.0012.a: "礼楽のある所こそ、華夏である。"
 hd_yiguan.0013.t: "中原の喪失"
 hd_yiguan.0013.desc: "北方最後の漢人の拠点が相次いで陥落し、中原はことごとく胡人の手に落ちた。江左の君臣はついに悟った。北へ帰る日ははるか遠く見込みもなく、ただ江南でこの一隅の衣冠を守るほかないのだと。"
 hd_yiguan.0013.a: "神州は沈み、嘆けども如何ともしがたい。"
 hd_yiguan.0014.t: "南北分治"
 hd_yiguan.0014.desc: "衣冠南渡以来、すでに一世紀半が過ぎた。南北の双方とも相手を併呑する力はなく、江を隔てた分治が常態となった。江南の子弟はとうにこの地で生まれ育ち、北方の旧き夢は、族譜と詩賦の中に残るのみである。"
 hd_yiguan.0014.a: "南北それぞれ天命に安んずる。"

 # ---------- 南方·难民 ----------
 hd_yiguan.1001.t: "洛陽の士女"
 hd_yiguan.1001.desc: "城門の外には北から来た車馬が並んでいる。先頭に立つのは北方の旧家の子弟数人で、衣冠はすでにぼろぼろだが、その話しぶりにはなお中州の名士の風格がある。その後ろには家族・部曲・付き従う小作人が続き、果てが見えない。\n\n彼らはあなたに身を落ち着ける土地を求め、出仕して力を尽くすことも望んでいる。"
 hd_yiguan.1001.a: "名士を招き、その一族を落ち着かせる。"
 hd_yiguan.1001.b: "その部曲を収め、軍伍に編入する。"
 hd_yiguan.1001.c: "城中に余地はない。他所へ行かれよ。"
 hd_yiguan.1002.t: "道に流離する"
 hd_yiguan.1002.desc: "夏に入ってから、北方の流民が一群また一群とあなたの領内に流れ込んでいる。彼らは着る物もなく飢えに苦しみ、道中ではすでに少なからぬ老人や弱者が道端で倒れ死んだ。地方官吏の文書は一通ごとに切迫の度を増している。早く安置しなければ、変乱が起きかねないと。"
 hd_yiguan.1002.a: "倉を開いて食糧を放出し、流人を落ち着かせる。"
 hd_yiguan.1002.b: "その壮丁を選び、部曲に編成する。"
 hd_yiguan.1002.c: "関を閉ざして自らを守り、流民を受け入れない。"
 hd_yiguan.1003.t: "江北に渡りを待つ"
 hd_yiguan.1003.desc: "江の北岸には北から来た難民が大勢集まっている。渡し船は少なく人は多く、毎日のように一席を争って水に落ちて死ぬ者が出て、対岸の泣き声が水を隔てて聞こえてくる。あなたの属僚は官船を多く派遣して江を渡らせるよう進言するが、それもまた少なからぬ出費となる。"
 hd_yiguan.1003.d: "官船をすべて出し、北人を渡らせる。"
 hd_yiguan.1003.a: "倉を開いて救済し、ゆっくりと渡らせる。"
 hd_yiguan.1003.b: "その壮丁を選び、部曲に編成する。"
 hd_yiguan.1003.c: "江防が大事である。勝手な渡江は許さぬ。"

 # ---------- 南方·流民帅 ----------
 hd_yiguan.1101.t: "中流に楫を撃つ"
 hd_yiguan.1101.desc: "[hd_yiguan_shuai.GetName]が数百家の郷党を連れて南へ来て、あなたに身を寄せた。この人物は北方にいた頃から衆を集めて自衛し、たびたび胡騎を挫いてきた。江を渡る際には中流で楫を撃って誓ったという。中原を清めずして再び渡る者は、この大江のごとくあれ、と。\n\n彼は北方へ戻るため、兵と糧食を求めている。"
 hd_yiguan.1101.a: "辺境の県を授け、前線を守らせる。"
 hd_yiguan.1101.b: "将として留め、流民を統率させる。"
 hd_yiguan.1101.c: "その北伐を支援し、回復を図る。"
 hd_yiguan.1101.d: "この者は御しがたい。拒むに如かず。"
 hd_yiguan.1102.t: "流民の宗主"
 hd_yiguan.1102.desc: "[hd_yiguan_shuai.GetName]が郷里の千余家を率いて南へ来た。彼は北方の乱の中で衆から宗主に推され、飢饉の時には食糧を分けて共に食べたため、人々はその恩を感じ、死ぬまで付き従うと誓っている。この人物は慎重で謀に長け、流人を安んじることも、各方面を調停することもできる。"
 hd_yiguan.1102.a: "辺境の県を授け、流人を安んじさせる。"
 hd_yiguan.1102.b: "将として留め、その部衆を率いさせる。"
 hd_yiguan.1102.c: "北方へ送り返し、機を見て回復させる。"
 hd_yiguan.1102.d: "領内に受け入れる土地はない。"
 hd_yiguan.1103.t: "驕兵悍将"
 hd_yiguan.1103.desc: "[hd_yiguan_shuai.GetName]が剽悍な流民軍を率いてあなたの領内にやって来た。その部衆の多くは北方の命知らずで、戦いぶりは凶暴だが、軍紀は極めて悪く、道中ですでに略奪の噂が立っている。本人も言葉遣いが傲慢で、求める見返りも安くはない。"
 hd_yiguan.1103.a: "一県を与え、その衆を羈縻する。"
 hd_yiguan.1103.b: "麾下に収め、厳しく統制する。"
 hd_yiguan.1103.c: "北へ駆り立て、毒をもって毒を制す。"
 hd_yiguan.1103.d: "この虎狼の輩は断じて留めてはならぬ。"
 hd_yiguan_shuai_refuse_tt: "#EMP この者は恨みを抱き、後日乱を起こすかもしれない。#!"
 hd_yiguan.1111.t: "流民の乱"
 hd_yiguan.1111.desc: "かつてあなたが門前払いにした[hd_yiguan_shuai.GetName]が、今やあなたの領内で衆を集めて兵を挙げた。彼はあなたが北人を冷遇したと至る所で触れ回り、行き場を失った流民が続々とその旗の下に集まっている。"
 hd_yiguan.1111.a: "小僧め、よくも！"

 # ---------- 南方·侨置 ----------
 hd_yiguan.1201.t: "州郡を僑立する"
 hd_yiguan.1201.desc: "北方の故郷はすでに陥落したが、南から来た士族はなお故郷の郡望を誇りとしている。[hd_yiguan_qiao_title.GetName]を僑立し、流寓の者に統属する所を与え、あなたが北方を忘れていないことを天下に知らしめるよう上書する者がいる。"
 hd_yiguan.1201.a: "州郡を僑立し、人心をつなぎ留める。"
 hd_yiguan.1201.b: "この件は後日改めて議する。"
 hd_yiguan.1202.t: "僑郡に戸を安んず"
 hd_yiguan.1202.desc: "南から来た流人は各地に散らばって住み、戸籍は乱れ、賦役は徴収しがたい。あなたの属僚は、一地を選んで郡県を僑立し、これらの北人を名簿に登録して別に管轄し、賦役を軽くして安心して開墾させるよう進言している。"
 hd_yiguan.1202.a: "郡県を僑立し、流人を安置する。"
 hd_yiguan.1202.b: "流人は当然、当地の戸籍に編入すべきだ。"
 hd_yiguan.1203.t: "僑旧の争い"
 hd_yiguan.1203.desc: "堂上でまた争いが起きた。北から来た僑姓の士族は江南の旧族を見下し、粗野だと嘲る。江南の呉姓の豪族は、北人が官位と良田を占めていると恨む。双方がそれぞれの言い分を譲らず、皆あなたの態度をうかがっている。"
 hd_yiguan.1203.a: "北来の士族こそ国の棟梁である。"
 hd_yiguan.1203.b: "江東の旧族こそ立国の基である。"
 hd_yiguan.1203.c: "手厚く恩賞を与え、双方を調停する。"
 hd_yiguan.1210.t: "土断"
 hd_yiguan.1210.desc: "僑郡僑県が設けられて久しく、流人はとうに南方で田を買い家を構えているのに、なお北方の郡望を掲げ、減免された賦役を享受している。土断を行うよう上書する者がいる。僑置を廃し、これらの者を一律に居住する郡県の戸籍に編入せよと。\n\nこれを行えば必ず府庫は充実するが、北から来た士族を大いに失望させることにもなる。"
 hd_yiguan.1210.a: "土断を行い、一律に編戸とする。"
 hd_yiguan.1210.b: "北人は帰郷を思っている。にわかに断じてはならぬ。"

 # ---------- 南方·北府军 ----------
 hd_yiguan.1301.t: "北府の創設"
 hd_yiguan.1301.desc: "京口と広陵一帯には北から来た流民が大勢集まっており、彼らは長く戦陣を経て、勇猛で戦いに長けている。あなたに献策する者がいる。この北人たちをその地で募り、一支の精兵を編成・訓練して、北方を防いではどうかと。"
 hd_yiguan.1301.a: "北人を募って兵とし、北府と号する。"
 hd_yiguan.1301.a.tt: "#EMP 衣冠南渡の期間中、京口・広陵で北府兵を募集できる。#!"
 hd_yiguan.1302.t: "北府の名将"
 hd_yiguan.1302.desc: "北府軍の中から驍将[hd_yiguan_beifu_general.GetName]が現れた。北方の寒門の出で、戦ではいつも自ら先頭に立ち、北府の将士は皆彼のためなら死をも厭わない。今や諸将は彼を北府の統領に推挙しており、あとはあなたの承認を待つばかりである。"
 hd_yiguan.1302.a: "兵権を委ね、北府を専任させる。"
 hd_yiguan.1302.b: "兵権を一人に専らにさせてはならぬ。"
 hd_yiguan.1303.t: "北府の擁兵"
 hd_yiguan.1303.desc: "[hd_yiguan_beifu_general.GetName]は長年北府を統率し、将士は将軍あるを知って朝廷あるを知らない。近ごろ彼はたびたび異動命令に背き、京口からの軍報もますます少なくなっている。あなたの近臣は深く憂えている。北府が異心を抱けば、都は危ういと。"
 hd_yiguan.1303.a: "その兵権を奪い、後の憂いを絶つ。"
 hd_yiguan.1303.a.tt: "#EMP この者は京口に拠って挙兵するかもしれない。#!"
 hd_yiguan.1303.b: "官爵を加え、その心を安んじる。"
 hd_yiguan.1303.c: "好きにさせておけ。"

 # ---------- 北方·流民逃窜 ----------
 hd_yiguan.2001.t: "漢民南へ奔る"
 hd_yiguan.2001.desc: "治下の漢人がまた一群逃げ出した。彼らは夜陰に乗じて家族を引き連れ、関所を越えて南方へ逃れ、がらんとした村落と刈り取る者のいない田畑を後に残した。あなたの部将は兵を出して追撃させてほしいと願い出ている。"
 hd_yiguan.2001.a: "兵を出して連れ戻し、見せしめとする。"
 hd_yiguan.2001.b: "逃げたければ逃げればよい。取るに足らぬ。"
 hd_yiguan.2001.c: "賦役を軽くし、残った民を慰撫する。"
 hd_yiguan.2002.t: "塢主の出奔"
 hd_yiguan.2002.desc: "[hd_yiguan_occ_county.GetName]のある漢人の塢主が、塢の部衆をすべて連れて堡を捨てて南へ去った。彼は去る前に塢の穀倉を焼き払い、死んでも胡人の奴僕にはならぬと言い放った。"
 hd_yiguan.2002.a: "騎兵を遣わして追わせ、取り逃がすな。"
 hd_yiguan.2002.b: "好きにさせておけ。"
 hd_yiguan.2002.c: "倉を開いて民を慰撫し、人心を収める。"
 hd_yiguan.2003.t: "辺境の県の空洞化"
 hd_yiguan.2003.desc: "地方官の報告によれば、[hd_yiguan_occ_county.GetName]の漢人はすでに大半が逃げ去り、田畑は荒れ果て、賦税すら徴収できないという。残った者も様子をうかがっており、機会さえあれば南下するつもりでいる。"
 hd_yiguan.2003.a: "関津を厳しく調べ、逃亡者を追捕する。"
 hd_yiguan.2003.b: "成り行きに任せる。"
 hd_yiguan.2003.c: "倉を開いて救済し、流亡者を呼び戻す。"
 hd_yiguan.2011.t: "一族、南渡を議す"
 hd_yiguan.2011.desc: "家中の長老たちが一所に集まり、一族の子弟を南渡させて江左に身を寄せるべきかどうかを話し合っている。北方に留まれば、結局は胡人の顔色をうかがうことになる。だが一族を挙げて南遷するとなれば、祖先の墳墓と田産をどうして捨てられようか。最後に、皆の目があなたに向けられた。"
 hd_yiguan.2011.a: "子弟を南渡させ、宗祀を存続させる。"
 hd_yiguan.2011.b: "塢に拠って自らを守り、郷土を離れない。"
 hd_yiguan.2011.c: "郷里を諭し、安心して主に仕えさせる。"
 hd_yiguan.2012.t: "父老の請願"
 hd_yiguan.2012.desc: "郷里の父老があなたの門前にひざまずき、胡兵がまた食糧の徴発と壮丁の狩り出しに来て、多くの家がもはや生きてゆけないと訴えている。彼らはあなたに決めてほしいと願っている。南方へ逃れるか、それとも郷里に塢を築いて自らを守るか。"
 hd_yiguan.2012.a: "子弟を先に南下させる。"
 hd_yiguan.2012.b: "塢を築いて衆を集め、郷里を守ると誓う。"
 hd_yiguan.2012.c: "しばし耐え忍び、民に帰附を勧める。"
 hd_yiguan.2013.t: "南朝の密使"
 hd_yiguan.2013.desc: "南朝から来たと名乗る使者が夜陰に乗じて訪ねてきた。彼によれば、南方は北方の忠義の士のために席を空けて待っているという。あなたにその気があるなら、まず子弟を南下させて誠意を示せばよいと。"
 hd_yiguan.2013.a: "子弟を使者とともに南へ帰らせる。"
 hd_yiguan.2013.b: "南朝は遠い。自ら守るに如かず。"
 hd_yiguan.2013.c: "この件は二度と口にするな。"

 # ---------- 北方·义军起义 ----------
 hd_yiguan.2101.t: "塢堡の挙兵"
 hd_yiguan.2101.desc: "[hd_yiguan_occ_county.GetName]の漢人の豪強[hd_yiguan_new_leader.GetName]が塢に拠って挙兵し、あなたが遣わした官吏を殺し、郷里に胡人を駆逐するよう呼びかけた。知らせが伝わると、近隣の漢人は皆動き出そうとしている。"
 hd_yiguan.2101.a: "兵を出して討伐せよ！"
 hd_yiguan.2101.b: "官職を約束し、その衆を招安する。"
 hd_yiguan.2101.c: "財貨をもってその部衆を散じさせる。"
 hd_yiguan.2102.t: "乞活軍"
 hd_yiguan.2102.desc: "乞活軍と自称する流民の武装集団が[hd_yiguan_occ_county.GetName]に現れた。もとは北方の飢民で、群れをなして食を求めていたが、今では[hd_yiguan_new_leader.GetName]に率いられて各地を転戦し、もっぱら胡人を敵としている。"
 hd_yiguan.2102.a: "乞活を討滅し、地方を安んじる。"
 hd_yiguan.2102.b: "我が用に収める。"
 hd_yiguan.2102.c: "銭糧を与え、解散させる。"
 hd_yiguan.2103.t: "豪傑の挙義"
 hd_yiguan.2103.desc: "[hd_yiguan_new_leader.GetName]が[hd_yiguan_occ_county.GetName]で腕を振り上げて一声叫ぶと、四方の漢人が雲のように集まって呼応した。彼は胡虜誅滅の旗を掲げ、通る所では胡人がことごとく殺戮され、その勢いは尋常の乱民とは比べものにならない。"
 hd_yiguan.2103.a: "国を挙げての兵で、必ず討滅せよ！"
 hd_yiguan.2103.b: "高位を約束し、その勢いを分断する。"
 hd_yiguan.2103.c: "大金で買収し、ひとまずその鋒を緩める。"
 hd_yiguan.2111.t: "隣県の挙義"
 hd_yiguan.2111.desc: "隣の[hd_yiguan_up_county.GetName]で胡人に反旗を翻す者が現れた。首領の[hd_yiguan_new_leader.GetName]は四方に檄を飛ばし、各地の漢人にともに義旗を挙げるよう呼びかけている。宗主はまだあなたの態度を知らないが、この一歩を踏み誤れば、一族滅亡の禍となる。"
 hd_yiguan.2111.a: "ともに義旗を挙げ、胡虜を駆逐する。"
 hd_yiguan.2111.b: "宗主に告げ、忠心を示す。"
 hd_yiguan.2111.c: "ひそかに糧食と武具を送る。"
 hd_yiguan.2112.t: "義軍の使者"
 hd_yiguan.2112.desc: "[hd_yiguan_new_leader.GetName]の使者が商人に変装し、ひそかにあなたの邸にやって来て一通の書状をもたらした。義軍はすでに[hd_yiguan_up_county.GetName]で事を起こした、ただあなたが高みに登って一声叫び、内外呼応してくれることを願う、と。"
 hd_yiguan.2112.a: "内外呼応し、ともに義挙を成す。"
 hd_yiguan.2112.b: "その使者を縛り、宗主に献ずる。"
 hd_yiguan.2112.c: "糧食と武具を援助し、痕跡は見せない。"
 hd_yiguan.2113.t: "旧知の誘い"
 hd_yiguan.2113.desc: "挙兵した[hd_yiguan_new_leader.GetName]はあなたの旧知である。彼は人づてに伝言を寄こし、かつて同窓であった頃に華夏を正し扶けようと約束したこと、今やその時が来たことを告げ、あの日の約束を覚えているかと問うてきた。"
 hd_yiguan.2113.a: "旧き約束は胸にある。どうして背けようか。"
 hd_yiguan.2113.b: "時は移り世は変わった。申し訳ないが従えぬ。"
 hd_yiguan.2113.c: "ひそかに旧友に一臂の力を貸す。"
 hd_yiguan.2120.t: "南帰の議"
 hd_yiguan.2120.desc: "義軍は勝利し、あなたはすでに胡人の軛から脱した。南方から人が来て、衆を率いて帰附し、以後南朝の正朔を奉じるよう求めている。一方で、自ら一家を立て、他人の庇護に頼る必要はないと勧める者もいる。"
 hd_yiguan.2120.a: "南朝に帰附し、臣節を全うする。"
 hd_yiguan.2120.b: "自ら一家を立て、人に頼る必要はない。"

 # ---------- 北方·胡汉对峙 ----------
 hd_yiguan.2201.t: "胡漢の田争い"
 hd_yiguan.2201.desc: "胡人の部族と漢人の農家が田地をめぐってまた衝突した。胡人は放牧したく、漢人は耕作したい。双方の乱闘で何人もの死者が出た。両方の首領があなたの帳前にひざまずき、あなたの決断を待っている。"
 hd_yiguan.2201.a: "胡漢分治とし、それぞれの業に安んじさせる。"
 hd_yiguan.2201.b: "漢人は田畑を治めるのに長けている。その長所を用いるべきだ。"
 hd_yiguan.2201.c: "漢人は狡猾で頑迷だ。厳しく取り締まれ。"
 hd_yiguan.2202.t: "胡人の漢人迫害"
 hd_yiguan.2202.desc: "あなたの同族の将士が城中で横暴を働き、漢人の財物を奪い、漢人の婦女を辱めている。漢人は怒りを口にできないが、陰では南方の歌謡を口ずさんでいる。"
 hd_yiguan.2202.a: "胡漢はそれぞれの所に帰し、互いに乱してはならぬ。"
 hd_yiguan.2202.b: "同族を処罰し、漢人の心を収める。"
 hd_yiguan.2202.c: "漢人が恨みを抱くなら、まさに威を示すべきだ。"
 hd_yiguan.2203.t: "漢士の進言"
 hd_yiguan.2203.desc: "ある漢人の士人があなたの前で滔々と論じている。馬上で天下を得ても、馬上で治めることはできない。長く安定した治世を望むなら、漢人の典章を用い、漢人の賢才を任用せねばならないと。あなたの同族の将領は傍らで冷笑をやめない。"
 hd_yiguan.2203.a: "胡には胡の法があり、漢には漢の制がある。"
 hd_yiguan.2203.b: "先生の仰ることはもっともだ。"
 hd_yiguan.2203.c: "腐れ儒者の妄言だ。帳の外へ追い出せ。"
 hd_yiguan.2211.t: "胡吏の凌辱"
 hd_yiguan.2211.desc: "宗主が遣わした胡人の官吏があなたの領地で威張り散らし、衆人の前であなたの家族を鞭打ち、漢人など奴僕にすぎぬと言い放った。あなたの一族は皆あなたを見つめ、どう対処するかを待っている。"
 hd_yiguan.2211.a: "屈辱に耐えて重責を負い、ひとまず隠忍する。"
 hd_yiguan.2211.b: "宗主に上書し、道理をもって強く争う。"
 hd_yiguan.2211.c: "ひそかに南朝と通じ、後の策を図る。"
 hd_yiguan.2212.t: "宗主の徴発"
 hd_yiguan.2212.desc: "宗主がまたあなたの領地の壮丁と糧秣の徴発を命じてきた。南征のためだという。だが徴発された者で戻ってくる者はわずかで、郷里はすでに怨嗟の声に満ちている。"
 hd_yiguan.2212.a: "謹んで命を奉じ、背くことはしない。"
 hd_yiguan.2212.b: "民の力は尽きた。徴発の軽減を願い出る。"
 hd_yiguan.2212.c: "表向きは従い裏では背き、ひそかに南朝へ使いを送る。"
 hd_yiguan.2213.t: "南の音、北に伝わる"
 hd_yiguan.2213.desc: "南方の詩文と知らせが巡り巡って北方に伝わってきた。江左の衣冠風流はあなたの一族の心を惹きつけ、陰では、胡人の支配下で生き長らえるよりも早めに手を打つべきだと論じる者もいる。"
 hd_yiguan.2213.a: "口を慎め！　禍は口より出ずる。"
 hd_yiguan.2213.b: "胡漢は一体である。宗主は漢人を厚遇すべきだ。"
 hd_yiguan.2213.c: "人を南下させ、ひそかに江左と結ぶ。"

 # ---------- 举州归南·通知 ----------
 hd_yiguan.3101.t: "州を挙げて来帰す"
 hd_yiguan.3101.desc: "北方の[hd_yiguan_gn_vassal.GetName]が挙兵して胡人から離脱し、使者を寄こして州を挙げてあなたに帰附したいと願い出た。あなたはすでに兵を北上させて迎えに出している。"
 hd_yiguan.3101.a: "王師は北上し、義士を迎えよ！"
