 # 衣冠南渡（docs/衣冠南渡_设计草案.md）

 # ---------- 游戏规则 ----------
 rule_hd_yiguan_rule: "衣冠南渡"
 setting_hd_yiguan_rule_on: "#high 有効#!"
 setting_hd_yiguan_rule_on_desc: "北方が胡人の手に落ちた後、天下は衣冠南渡の局面に入り、中原の回復、胡人の漢化、中原の喪失、または南北分治のいずれかに至るまで続く。"
 setting_hd_yiguan_rule_off: "#high 無効#!"
 setting_hd_yiguan_rule_off_desc: "衣冠南渡は発生しない。"

 # ---------- 局势 ----------
 situation_type_hd_yiguan_nandu: "衣冠南渡"
 situation_type_hd_yiguan_nandu_desc: "胡騎が南下し、中原は揺れ動いた。北方の世家大族は老人を助け子供を連れ、淮水を渡り江を越えて江左へと奔った。北方に残った漢人は胡人の支配下で屈辱に耐えて生き延び、あるいは塢に拠って自らを守り、あるいは衆を集めて義兵を挙げた。\n\n南方の君主は流人を受け入れ、僑州郡を立て、北府を編成し訓練する。北方の胡人の君主は弾圧と懐柔の間で揺れ動く。この大移住は最終的に、中原の回復、胡漢の合流、中原の喪失、あるいは南北分治によって幕を閉じるであろう。"
 situation_hd_yiguan_nandu: "$situation_type_hd_yiguan_nandu$"
 situation_hd_yiguan_nandu_desc: "[SITUATION.GetType.GetDesc]"

 hd_yiguan_phase_sangluan: "喪乱"
 hd_yiguan_phase_sangluan_desc: "胡騎の至る所、城邑は廃墟と化す。北方の士民は群れをなして南へ逃れ、道は老人を助け子供を連れた流人で埋め尽くされている。"
 hd_yiguan_nandu_hd_yiguan_phase_sangluan_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"
 hd_yiguan_nandu_hd_yiguan_phase_sangluan_situation_phase_desc: "$hd_yiguan_phase_sangluan_desc$"
 hd_yiguan_phase_nandu: "南渡"
 hd_yiguan_phase_nandu_desc: "流人は次第に江左に落ち着いた。朝廷は僑州郡を立てて北人を安置し、南北の士族が同じ朝廷で共に仕えるが、時に軋轢も生じる。"
 hd_yiguan_nandu_hd_yiguan_phase_nandu_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"
 hd_yiguan_nandu_hd_yiguan_phase_nandu_situation_phase_desc: "$hd_yiguan_phase_nandu_desc$"
 hd_yiguan_phase_duizhi: "対峙"
 hd_yiguan_phase_duizhi_desc: "南北は淮水と大江を隔てて相対している。江南は兵を練り粟を蓄えて回復を図り、北方では胡漢が雑居し、義軍が時に起こる。天下の帰属は、今後の成否にかかっている。"
 hd_yiguan_nandu_hd_yiguan_phase_duizhi_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"
 hd_yiguan_nandu_hd_yiguan_phase_duizhi_situation_phase_desc: "$hd_yiguan_phase_duizhi_desc$"

 hd_yiguan_sangluan_effects: "喪乱"
 hd_yiguan_nandu_effects: "南渡"
 hd_yiguan_duizhi_effects: "対峙"

 hd_yiguan_nandu_sub_region_hd_yiguan_north: "陥落地域"
 hd_yiguan_nandu_sub_region_hd_yiguan_north_desc: "北方諸州のうち、民はなお華夏の遺民でありながら、宗主はすでに胡人となっている[counties|E]"
 hd_yiguan_nandu_sub_region_hd_yiguan_south: "江左"
 hd_yiguan_nandu_sub_region_hd_yiguan_south_desc: "荊・揚の二州"
 hd_yiguan_nandu_sub_region_hd_yiguan_front: "前線"
 hd_yiguan_nandu_sub_region_hd_yiguan_front_desc: "陥落地域と境を接する前線の郡守の領地"

 hd_yiguan_nandu_participant_group_hd_yiguan_south_lord: "南方の宗主"
 hd_yiguan_nandu_participant_group_hd_yiguan_south_lord_desc: "江左に領地を持つ、王国級以上の華夏の独立[rulers|E]"
 hd_yiguan_nandu_participant_group_hd_yiguan_front_duke: "前線の郡守"
 hd_yiguan_nandu_participant_group_hd_yiguan_front_duke_desc: "陥落地域と境を接する領地を持つ、公爵級の華夏の独立[rulers|E]"
 hd_yiguan_nandu_participant_group_hd_yiguan_south_vassal: "南方の封臣"
 hd_yiguan_nandu_participant_group_hd_yiguan_south_vassal_desc: "南方の宗主の治下で江左に領地を持つ、公爵級以上の[vassals|E]"
 hd_yiguan_nandu_participant_group_hd_yiguan_hu_lord: "胡人の宗主"
 hd_yiguan_nandu_participant_group_hd_yiguan_hu_lord_desc: "陥落地域に領地を持つ胡人の独立[rulers|E]"
 hd_yiguan_nandu_participant_group_hd_yiguan_han_vassal: "漢人の封臣"
 hd_yiguan_nandu_participant_group_hd_yiguan_han_vassal_desc: "陥落地域内の華夏の伝統を持つ公爵級以上の[vassals|E]"
 hd_yiguan_nandu_hd_yiguan_south_lord: "衣冠南渡：#weak 南方の宗主#!"
 hd_yiguan_nandu_hd_yiguan_front_duke: "衣冠南渡：#weak 前線の郡守#!"
 hd_yiguan_nandu_hd_yiguan_south_vassal: "衣冠南渡：#weak 南方の封臣#!"
 hd_yiguan_nandu_hd_yiguan_hu_lord: "衣冠南渡：#weak 胡人の宗主#!"
 hd_yiguan_nandu_hd_yiguan_han_vassal: "衣冠南渡：#weak 漢人の封臣#!"

 # ---------- 修正 ----------
 hd_yiguan_nanlai_county_modifier: "南来の戸口"
 hd_yiguan_nanlai_county_modifier_desc: "北方の流人が老人を助け子供を連れてやって来て、荒れ地は次第に拓かれ、戸口は日に日に増えている。"
 hd_yiguan_nanlai_big_county_modifier: "南来の戸口"
 hd_yiguan_nanlai_big_county_modifier_desc: "官船がことごとく北人を渡し、一時は江岸が人であふれ、荒れ田はすべて開墾された。"
 hd_yiguan_qiaojun_county_modifier: "僑郡"
 hd_yiguan_qiaojun_county_modifier_desc: "この地には北方の郡県を僑立して流人を安置しており、戸籍は別冊とし、賦役は軽くしている。"
 hd_yiguan_liusan_county_modifier: "戸口の離散"
 hd_yiguan_liusan_county_modifier_desc: "民は連れ立って南へ逃れ、十戸に九戸は空き家となり、田畑は荒れ果てている。"
 hd_yiguan_wubao_county_modifier: "塢堡"
 hd_yiguan_wubao_county_modifier_desc: "郷里の豪族が塢を築いて自らを守り、一族で集住しているため、胡騎も容易には侵せない。"
 hd_yiguan_buqu_modifier: "流民の部曲"
 hd_yiguan_buqu_modifier_desc: "このキャラクターは北から来た流民を部曲に編成しており、兵源が充実している。"
 hd_yiguan_fenzhi_modifier: "胡漢分治"
 hd_yiguan_fenzhi_modifier_desc: "胡人と漢人がそれぞれ別の官司を持ち、それぞれの習俗に従っている。"
 hd_yiguan_zhuoyong_modifier: "漢士の登用"
 hd_yiguan_zhuoyong_modifier_desc: "このキャラクターは漢人の士族を幕下に招き、その典章への精通を頼りにしている。"
 hd_yiguan_qiangya_modifier: "漢人の強圧"
 hd_yiguan_qiangya_modifier_desc: "このキャラクターは厳しい刑罰と峻厳な法で漢人を弾圧しており、誰もが冷たい目を向けている。"
 hd_yiguan_beifu_commander_modifier: "北府の統帥"
 hd_yiguan_beifu_commander_modifier_desc: "北府の諸将が命を受けて軍を整え、精兵が日に日に増えている。"
 hd_yiguan_beifu_yongbing_modifier: "北府の擁兵"
 hd_yiguan_beifu_yongbing_modifier_desc: "北府の将領が大軍を握り、朝廷の号令は京口ではなかなか行き届かない。"
 hd_yiguan_pianan_modifier: "江左に偏安す"
 hd_yiguan_pianan_modifier_desc: "中原はもはや回復できず、君臣はただ江南で境を保ち民を休ませることのみを求めている。"
 hd_yiguan_ruzhu_modifier: "中原に入主す"
 hd_yiguan_ruzhu_modifier_desc: "このキャラクターは中原の故地を保有し、その威名は遠くまで轟いている。"
 hd_yiguan_heliu_modifier: "胡漢合流"
 hd_yiguan_heliu_modifier_desc: "胡漢の間の隔たりは次第に消え、ともに編戸の民となった。"
 hd_yiguan_zhongxing_modifier: "中興"
 hd_yiguan_zhongxing_modifier_desc: "王師は旧都を奪還し、天下は中興の主を仰ぎ見ている。"
 hd_yiguan_beiding_modifier: "王師北定"
 hd_yiguan_beiding_modifier_desc: "このキャラクターはかつて中原奪還の戦役に加わり、その名声は遠くまで広まっている。"
 hd_yiguan_fenzhi_south_modifier: "南北分治"
 hd_yiguan_fenzhi_south_modifier_desc: "南北は江を隔てて対峙し、それぞれの境界を守っている。"
 hd_yiguan_fenzhi_north_modifier: "南北分治"
 hd_yiguan_fenzhi_north_modifier_desc: "南北は江を隔てて対峙し、それぞれの境界を守っている。"

