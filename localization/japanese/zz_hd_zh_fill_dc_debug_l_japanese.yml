l_japanese:
 hd_dc_debug.counties:0 "首都郡の実際の影響帳簿を確認する。"
 hd_dc_debug.counties.desc:0 "現在[scope:hd_dc_debug_county.GetName]を確認中。このページは統制度・開発度・民心・政策に影響しない。損失周期のフィールドが欠けている場合、欠落した記録は差し引き済みとはみなされない。"
 hd_dc_debug.counties.loss:0 "\n 統制度の基準値：[scope:hd_dc_debug_county.Var('hd_dc_control_baseline').GetValue|2]\n 開発度の基準値：[scope:hd_dc_debug_county.Var('hd_dc_development_baseline').GetValue|0]\n 処理済みの最高段階：[scope:hd_dc_debug_county.Var('hd_dc_highest_loss_band').GetValue|0]\n 累計差し引き済み統制度：[scope:hd_dc_debug_county.Var('hd_dc_control_paid').GetValue|2]\n 累計差し引き済み開発度：[scope:hd_dc_debug_county.Var('hd_dc_development_paid').GetValue|0]"
 hd_dc_debug.counties.policy:0 "\nこの郡は現在、公式の制度政策による審査を受けており、再び占領することはできない。"
 hd_dc_debug.counties.recovery:0 "\n 今周期は現在、低段階の回復観察期間にあり、連続60か月の要件をまだ満たしていない。"
 hd_dc_debug.details:0 "この受領書の内容を確認する"
 hd_dc_debug.details.desc:0 "以下のリストには、この記録においてすでに発生した、または登録された結果のみが含まれる。空欄の項目は成功を意味しない。対応する結果のない項目は、まだ保留中であるか、この記録に属さない可能性がある。"
 hd_dc_debug.disaster_scene:0 "実際の地震または洪水の災害シナリオを準備する"
 hd_dc_debug.disaster_scene.created:0 "正式な入口が実際の災害状況を返し、災害の種類ごとに読み戻しを行った。マップと災害画面を確認し、実際の対応策を選択すること。PARの準備には、なお被災した臣従者の郡が必要であり、その郡で統治を実施できること、さらに実在の派閥が二つ存在することが求められる。災害はこれらの条件の代わりにはならない。"
 hd_dc_debug.disaster_scene.desc:0 "下に被災郡が明示される。選択すると、公式のネイティブ災害発生入口を呼び出し、実際の災害シナリオと後続の対応策を作成する。災害は自然なメンテナンス抽選を待たずにシナリオ内で直接発生する。この操作は過去の日付、既存の政治体、詔令、対応結果、審査期間を変更しない。この操作は自然なD率の抽選ではない。"
 hd_dc_debug.disaster_scene.earthquake:0 "指定した郡で地震を発生させる"
 hd_dc_debug.disaster_scene.earthquake_target:0 "\n地震の対象：[scope:hd_dc_debug_earthquake_county.GetName]。"
 hd_dc_debug.disaster_scene.flood:0 "指定した郡が属する実際の流域で実際の洪水を発生させる。"
 hd_dc_debug.disaster_scene.flood_target:0 "\n洪水災害の対象：[scope:hd_dc_debug_flood_county.GetName]。"
 hd_dc_debug.disaster_scene.no_earthquake:0 "\n地震に適格な郡がない：王朝循環の郡リストに含まれ、実際の開発度が少なくとも2段階あり、中国本土の地理範囲内にあり、かつ現在進行中の地震がないことが必要。"
 hd_dc_debug.disaster_scene.no_flood:0 "\n洪水災害に適格な郡がない：王朝循環の郡リストに含まれ、実際の開発度が少なくとも2段階あり、全世界の洪水地域内にあり、初期化済みの実際の黄河または長江の河段であり、かつ現在進行中の洪水災害がないことが必要。修正を加えた郡で河川の代わりとすることはない。"
 hd_dc_debug.disaster_scene.unconfirmed:0 "正式な入口が実際の災害状況を確認できなかったため、災害発生の成功を報告できない。対象の地理、開発状況、既存の災害、初期化状況、ログを確認すること。このメニューは損失修正を書き込まず、対応の失敗を偽造することもない。"
 hd_dc_debug.epidemic.active_block:0 "\n#N 当地では黒死病が流行中である。これ以上壊滅的な疫病は作成できない。#!"
 hd_dc_debug.epidemic.apocalyptic:0 "壊滅的"
 hd_dc_debug.epidemic.bubonic_plague:0 "腺ペスト"
 hd_dc_debug.epidemic.confirm:0 "疫病の実際の発生を確認する。"
 hd_dc_debug.epidemic.confirm.desc:0 "災害の種類：[SCOPE.GetFlagName('hd_dc_debug_epidemic_name')]\n 強度：[SCOPE.GetFlagName('hd_dc_debug_epidemic_intensity')]\n\n このページでは選択した組み合わせに従い、実際の地域の郡を確認済みである。下の「確認」をクリックした場合にのみ、疫病が実際に発生し、拡散してキャラクターを罹患・死亡させる可能性がある。手動シナリオは自然なD確率の抽選を行わず、既存の疫病、DLC、ルール、過去の日付、政治的義務を変更しない。"
 hd_dc_debug.epidemic.consumption:0 "肺結核"
 hd_dc_debug.epidemic.create:0 "確認：指定した郡で選択した疫病を作成する。"
 hd_dc_debug.epidemic.dlc_block:0 "\n#N この災害の種類には原版『Legends of the Dead』の機能ライセンスが必要だが、現在満たされていない。ボタンでDLCのロックを回避することはできない。#!"
 hd_dc_debug.epidemic.dysentery:0 "赤痢"
 hd_dc_debug.epidemic.ergotism:0 "聖アントニウスの火"
 hd_dc_debug.epidemic.historical_block:0 "\n#N この組み合わせは実際のマップの制約により阻まれている：現在読み込まれているカスタムマップには、歴史上の黒死病発生地点の分岐がない。そのため歴史イベントのルールに従い、壊滅的な鼻疽の疫病は準備できない。また一時的にルールを変更したり、1346年の地理的制限を回避したりすることもない。#!"
 hd_dc_debug.epidemic.intensity:0 "実際の疫病の強度を選択する"
 hd_dc_debug.epidemic.intensity.desc:0 "選択した災害：[SCOPE.GetFlagName('hd_dc_debug_epidemic_name')]。三つの選択肢は\n\n原版の軽微・深刻・壊滅的に対応する。壊滅的な鼻疽の疫病は黒死病に属し、独自のルール、実際の発生状況、現在のマップの地理的制限を保持する。すべてのルールの組み合わせで合法的に発生できる郡が見つかるわけではない。"
 hd_dc_debug.epidemic.major:0 "深刻"
 hd_dc_debug.epidemic.measles:0 "麻疹"
 hd_dc_debug.epidemic.menu:0 "実際の疫病災害の種類を選択する"
 hd_dc_debug.epidemic.menu.desc:0 "災害の種類を選んだ後、さらにその強度を選び、指定した郡の実行ページで確認する必要がある。最初の二段階はパラメータを選ぶだけで、疫病の発生は引き起こさない。原版の七種の疫病にはそれぞれ三つの強度の入口がある。DLC、ルール、黒死病および類似の疾病は、引き続き実際の状況に応じてその発動を阻止する。"
 hd_dc_debug.epidemic.minor:0 "軽微"
 hd_dc_debug.epidemic.never_block:0 "\n#N 現在のルールでは黒死病が禁止されている。ペスト起源の壊滅的な疫病は作成できない。#!"
 hd_dc_debug.epidemic.once_block:0 "\n#N 現在のルールでは黒死病の発生は一度のみ許可されており、発生フラグがすでに存在するため、その記録を消去して再作成することはない。#!"
 hd_dc_debug.epidemic.smallpox:0 "天然痘"
 hd_dc_debug.epidemic.typhus:0 "発疹チフス"
 hd_dc_debug.faction_scene:0 "実際の派閥作成と最後通牒"
 hd_dc_debug.faction_scene.demand:0 "蜂起の準備：実際の派閥の不満度 +25"
 hd_dc_debug.faction_scene.demand.tt:0 "派閥の不満度を実際に25上昇させ、変化前後の数値を同時に読み取る。軍事力は増やさず、成立日も変更しない。最後通牒のコールバックを直接呼び出さず、独自の「送信済み」フラグも追加しない。準備完了後、このページで資格を再確認し、原版の派閥画面のリーダーに切り替えて正式に攻撃を開始すること。"
 hd_dc_debug.faction_scene.demand_target:0 "\n、実際にあなたへ最後通牒を突きつけるリーダー：[scope:hd_dc_debug_demand_leader.GetShortUIName]。"
 hd_dc_debug.faction_scene.desc:0 "「作成」ボタンは原版の can_create_faction 関数を再利用する。キャラクター、主君、統治形態、派閥資格のすべての条件が満たされた場合にのみ、派閥が実際に成立する。NEG-05から07は原版の作成方式を保持する。W≥20のとき、統治形態ごとに毎年さらに10%の確率（Pで換算）で、最大一つの派閥を追加作成する。実際の抽選記録は年次チェックページで確認できる。最終的な最後通牒には、依然として原版の実力・不満度・日付の要件を満たす必要がある。"
 hd_dc_debug.faction_scene.independence:0 "現在の主君に対し、独立派閥を実際に作成する。"
 hd_dc_debug.faction_scene.liberty:0 "現在の主君に対し、自由派閥を実際に作成する。"
 hd_dc_debug.faction_scene.liege:0 "\n派閥作成の実際の対象：[ROOT.Char.GetLiege.GetShortUIName]。"
 hd_dc_debug.faction_scene.no_demand:0 "\n現在、準備可能な要求派閥はない：確実にあなたを対象としており、リーダー/候補者/対象の称号がなお存在し、進行中の戦争がなく、かつROY-08の一時停止状態でないことが必要。まずROY-01で合法的に成立させること。このメニューはリーダー、主張、称号を作成しない。"
 hd_dc_debug.faction_scene.no_peasant:0 "この地域には原版の can_title_create_faction チェックを通過した農民の郡がない：実際の郡、対象、既存組織の制約条件を満たしていない。原版の派閥画面を確認すること。直接の宣戦は派閥作成の代わりにはならない。"
 hd_dc_debug.faction_scene.no_populist:0 "この地域には原版の can_title_create_faction チェックを通過した民衆の郡がない：原版の統治形態、宗派/文化、構成員、既存組織の制約を満たす必要があり、実際の郡と対象も必要である。宗教や文化を変更したり、既存の蜂起を取り消したりして条件を満たすことはできない。"
 hd_dc_debug.faction_scene.not_ready:0 "\n 原版の現在の反乱チェックを通過していない。不満度を実際に上げることはできるが、実力や日付などの資格は現実に満たす必要がある。不満度を上げるだけでは反乱の成功にはならない。"
 hd_dc_debug.faction_scene.peasant:0 "指定した適格な郡から、農民派閥を実際に作成する。"
 hd_dc_debug.faction_scene.peasant_county:0 "\n適格な農民の設立郡：[scope:hd_dc_debug_peasant_county.GetName]。実際にあなたを対象とする。"
 hd_dc_debug.faction_scene.populist:0 "実際に成立済みの指定された適格な郡から、民衆派閥を作成する。"
 hd_dc_debug.faction_scene.populist_county:0 "\n適格な民衆の設立郡：[scope:hd_dc_debug_populist_county.GetName]。実際にあなたを対象とする。"
 hd_dc_debug.faction_scene.ready:0 "\n 原版の現在の反乱チェック：通過済み。上で指定したリーダーに切り替え、派閥画面の正式な最後通牒ボタンを使うか、原版AIが自ら選択するのを待つこと。デバッグは最後通牒イベントを直接発行しない。エンジンの初期の反乱状態を保持するためである。"
 hd_dc_debug.fields.actor:0 "\n記録の行為者：[scope:hd_dc_debug_record.Var('hd_dc_actor').Char.GetShortUIName]"
 hd_dc_debug.fields.audit_first:0 "\n第一の当事者の実際の回答：[scope:hd_dc_debug_record.Var('hd_dc_audit_first_answer').GetFlagKey]"
 hd_dc_debug.fields.audit_second:0 "\n第二の当事者の実際の回答：[scope:hd_dc_debug_record.Var('hd_dc_audit_second_answer').GetFlagKey]"
 hd_dc_debug.fields.cooperation:0 "\nORD-19 青年：[scope:hd_dc_debug_record.Var('hd_dc_visitor').Char.GetShortUIName]\n 保証人：[scope:hd_dc_debug_record.Var('hd_dc_guarantor').Char.GetShortUIName]"
 hd_dc_debug.fields.disaster:0 "\n実際の災害の関連番号：[scope:hd_dc_debug_record.Var('hd_dc_disaster_identity').GetValue|0]\n災害の種類：[scope:hd_dc_debug_record.Var('hd_dc_disaster_type').GetFlagKey]\nこの項目の実際の段階：[scope:hd_dc_debug_record.Var('hd_dc_disaster_stage').GetFlagKey]\n発生と回復の記録は同一の災害の異なる実際の通し番号を表す。回復の記録は、あなたが何らかの政治的審査を完了したことを意味しない。"
 hd_dc_debug.fields.disaster_county:0 "\n実際の災害の中心：[scope:hd_dc_debug_record.Var('hd_dc_disaster_epicenter').Title.GetName]"
 hd_dc_debug.fields.exchange:0 "捕虜の交換も正式な手続きによって確認され、解放された。\n"
 hd_dc_debug.fields.from_signature:0 "発起人の実際の署名：\n [scope:hd_dc_debug_record.Var('hd_dc_from_signature').Char.GetShortUIName]"
 hd_dc_debug.fields.help:0 "\n 親族・友人の実際の返答：[scope:hd_dc_debug_record.Var('hd_dc_help_answer').GetFlagKey]"
 hd_dc_debug.fields.help_stress:0 "\n 記録された人格ストレスの純増分：[scope:hd_dc_debug_record.Var('hd_dc_personality_stress_actual').GetValue|2]"
 hd_dc_debug.fields.node:0 "\n ノード番号：[scope:hd_dc_debug_record.Var('hd_dc_node').GetValue|0]"
 hd_dc_debug.fields.par_choice:0 "\nPAR-01 で選択した行動：[scope:hd_dc_debug_record.Var('hd_dc_par01_action').GetFlagKey]"
 hd_dc_debug.fields.pay_parties:0 "\n 実際の支払者：[scope:hd_dc_debug_record.Var('hd_dc_payer').Char.GetShortUIName]\n 実際の受取者：[scope:hd_dc_debug_record.Var('hd_dc_payee').Char.GetShortUIName]"
 hd_dc_debug.fields.petitioner:0 "\n請願者：[scope:hd_dc_debug_record.Var('hd_dc_petitioner').Char.GetShortUIName]"
 hd_dc_debug.fields.proposal:0 "\n 提案の現在の状態：[scope:hd_dc_debug_record.Var('hd_dc_proposal_state').GetFlagKey]"
 hd_dc_debug.fields.protection_signature:0 "\n 盟約の真の署名者の保護者：[scope:hd_dc_debug_record.Var('hd_dc_protection_signature').Char.GetShortUIName]"
 hd_dc_debug.fields.ransom:0 "\n親族：[scope:hd_dc_debug_record.Var('hd_dc_prisoner').Char.GetShortUIName]\n捕縛者：[scope:hd_dc_debug_record.Var('hd_dc_captor').Char.GetShortUIName]"
 hd_dc_debug.fields.roy_choice:0 "\nROY-01 で選択した行動：[scope:hd_dc_debug_record.Var('hd_dc_roy01_action').GetFlagKey]"
 hd_dc_debug.fields.support:0 "\nROY-08 の実際の回答：[scope:hd_dc_debug_record.Var('hd_dc_support_answer').GetFlagKey]"
 hd_dc_debug.fields.to_signature:0 "\n 受取側の実際の署名：[scope:hd_dc_debug_record.Var('hd_dc_to_signature').Char.GetShortUIName]"
 hd_dc_debug.fields.trait:0 "\n特性抽選の出所：[scope:hd_dc_debug_record.Var('hd_dc_trait_source').GetFlagKey]\n基礎確率：[scope:hd_dc_debug_record.Var('hd_dc_trait_base_chance').GetValue|2]%\n倍率：[scope:hd_dc_debug_record.Var('hd_dc_trait_multiplier').GetValue|2]\n実際の確率：[scope:hd_dc_debug_record.Var('hd_dc_trait_actual_chance').GetValue|2]%\n実際の結果：[scope:hd_dc_debug_record.Var('hd_dc_trait_result').GetFlagKey]"
 hd_dc_debug.fields.trial_first:0 "\n第一の郡の実際の審査結果：[scope:hd_dc_debug_record.Var('hd_dc_audit_first_result').GetFlagKey]"
 hd_dc_debug.fields.trial_second:0 "\n第二の郡の実際の審査結果：[scope:hd_dc_debug_record.Var('hd_dc_audit_second_result').GetFlagKey]"
 hd_dc_debug.history_unavailable:0 "\n#N 史録の警告：少なくとも一回のW/H書き込みの間、在席する記録保持者がいなかった。この領域には最後の書き込みの詳細のみが保持される。この表示は補足記録が成功したことを意味しない。#!"
 hd_dc_debug.impact_detail:0 "[SCOPE.GetFlagName('hd_dc_debug_impact')]"
 hd_dc_debug.impacts:0 "二十種の危険の世界への影響と確認入口"
 hd_dc_debug.impacts.desc:0 "番号ごとに実際の接続点と検証方法を確認する。現存する検証可能な入口のみを実行可能な項目として列挙する。インターフェースが閉じていない項目は欠落を明記しなければならず、独立したランダムイベントで原版の発生率を代替することはできない。"
 hd_dc_debug.latest:0 "最新の受領書に戻る"
 hd_dc_debug.native_delta:0 "今回の原版増分の実際の読み取り値"
 hd_dc_debug.native_delta.desc:0 "実行前：[SCOPE.GetValue('hd_dc_debug_before_amount')|2]\n 実行後：[SCOPE.GetValue('hd_dc_debug_after_amount')|2]\n 今回の純変化：[SCOPE.GetValue('hd_dc_debug_actual_delta')|2]\n\n 数値は同一のエフェクトチェーンから読み取ったもので、原版の修正と範囲制限を含む。このページに表示されるのは直前の操作の観測値であり、自然発生源として記録されたものではなく、すべての発生源の最終増分の遮断が閉じられたことを証明するものでもない。"
 hd_dc_debug.native_scene:0 "実際のシナリオと原版増分の確認"
 hd_dc_debug.native_scene.desc:0 "このページには具体的な対象が表示される。クリックすると新たな世界が実際に変化し、メニューに戻ってもこの操作は取り消されない。原版増分と特性抽選では現在の段階を確認できる。秘密や疫病を手動で準備しても自然発生の抽選を意味せず、二十種のインターフェースがすべて完成したことも意味しない。"
 hd_dc_debug.native_scene.drunkard:0 "合法的な酒飲み特性の抽選を一回行う（基礎10%）"
 hd_dc_debug.native_scene.drunkard.tt:0 "正式な飲酒抽選インターフェースを呼び出し、現在のFに基づいて一回換算する。当たらなくても有効な結果である。ひとたび誰かに酒飲みが付与されると、再び得ることはできない。基礎確率、倍率、実際の確率、付与結果はすべて帳簿に保持される。すべての負の特性の入口が証拠で網羅されているわけではない。"
 hd_dc_debug.native_scene.legitimacy_gain:0 "正統性+10を実際に適用し、前後の数値を読み取る"
 hd_dc_debug.native_scene.legitimacy_loss:0 "正統性-10を実際に適用し、前後の数値を読み取る"
 hd_dc_debug.native_scene.no_drunkard:0 "\n飲酒抽選を実行できない：原版の can_be_drunkard チェックを通過しなかった。成年状態、既存の酒飲み特性、排他条件、宗派の要件は引き続き元のシステムで確認される。重複付与は許可されない。"
 hd_dc_debug.native_scene.no_legitimacy:0 "\n正統性の上昇を実行できない：現在のキャラクターには内在的な正統性の仕組みがない。資格を偽造するために統治形態を変更することはない。"
 hd_dc_debug.native_scene.no_outbreak_county:0 "\n この組み合わせの準備に使える地域または郡がない：臣従者が郡を保有し、主君が存命かつ自由であり、現在疫病が存在せず、使用中のシステム審査や税の減免もないことが必要。選択した強度における原版の基礎値・倍率・最近の疫病要因が発生を許容しなければならない。さらに、麻疹/赤痢/聖アントニウスの火のDLCロック、聖アントニウスの火の同病クールダウン、黒死病の無効/一回のみ発生済み/流行中/歴史的地理制限は引き続き保持される。チュートリアルや初期猶予期間により基礎値がゼロになる場合、日付は変更しない。肺結核/麻疹の風土病ボーナスは引き続き原版の順序で読み取られる。"
 hd_dc_debug.native_scene.no_secret_target:0 "\n秘密シナリオに対象がいない：あなたの宮廷には、存命・成年・自由で、原版の脅迫用秘密チェック機能に選ばれうるキャラクターがいない。まず適格な廷臣を招くこと。このページは既存のフックを秘密と偽ることはしない。"
 hd_dc_debug.native_scene.outbreak:0 "七種の疫病と三種の強度を選ぶ"
 hd_dc_debug.native_scene.outbreak.tt:0 "原版の州の create_epidemic_outbreak を再利用し、上記の災害の種類と強度を実際に作成する。クリック時に同名の郡を再度確認する。自然発生率の変更や追加の抽選は行わず、郡に架空の疫病修正を加えることもない。発生後は実際の疫病を読み取る。伝播・感染・死亡は原版のシステムが処理する。"
 hd_dc_debug.native_scene.outbreak_county:0 "\n選択した疫病の発生予定地となる実際の州郡：[scope:hd_dc_debug_outbreak_county.GetName]。その郡が属する州の州治所在地に位置する。"
 hd_dc_debug.native_scene.outbreak_created:0 "[scope:hd_dc_debug_outbreak_county.GetName]で実際の疫病を読み取った。先ほどの要求は[SCOPE.GetFlagName('hd_dc_debug_epidemic_name')]/[SCOPE.GetFlagName('hd_dc_debug_epidemic_intensity')]である。疫病マップで実際の種類・強度・伝播状況を確認すること。他の疫病との自然な統合は引き続きエンジンが処理する。郡で感染を読み取れたとしても、統合されないことの証明にはならない。\n\n PARの二郡比較が必要な場合は、疫病のない適格な郡を別に用意してから、シナリオ準備メニューに入ること。システムは対応策を自動で記入せず、救済金も支払わず、12か月の審査期間を飛ばすこともない。"
 hd_dc_debug.native_scene.outbreak_unconfirmed:0 "原版の疫病エフェクトは[scope:hd_dc_debug_outbreak_county.GetName]の州治に適用されたが、現在のエフェクトチェーンではまだ感染した州が検出されていない。疫病を確認済みと報告することはできず、そのために郡レベルの修正を加えて偽装することもない。原版の疫病更新後に、マップと実際の被災資格を照合してから、PARシナリオを準備すること。"
 hd_dc_debug.native_scene.secret:0 "指定した宮廷官員のために、実際に脅迫に使える秘密を一つ準備する。"
 hd_dc_debug.native_scene.secret.tt:0 "そのキャラクター本来の資格に基づいて実際の秘密を生成し、あなたに知らせる。証拠を発行したり、金を差し引いたり、そのキャラクターに代わって要求を受け入れたりはしない。その後、そのキャラクターを右クリックし、正式な脅迫の交流で要求を出すこと。"
 hd_dc_debug.native_scene.secret_created:0 "秘密の生成が実行され、原版の秘密オブジェクトを取得した。現在これを知るのはあなただけで、対象は[scope:hd_dc_debug_secret_target.GetShortUIName]である。\n秘密の内容：[scope:new_secret.Custom('SecretDescriptionThirdPerson')]\n\n秘密パネルを確認し、その後この人物を右クリックして脅迫の要求を出すこと。交流では引き続き、秘密が露見しているか、脅迫可能か、既存のフック、返答待ちの状態が確認される。結果を決めるのは相手の正式な返答のみである。"
 hd_dc_debug.native_scene.secret_failed:0 "原版の秘密オブジェクトを取得できなかったため、生成成功と報告することはできない。対象の現在の資格とログを確認すること。このページはオブジェクト参照の再割り当てや結果の差し替えをサポートしない。"
 hd_dc_debug.native_scene.secret_target:0 "\n実際の秘密を付与する予定のキャラクター：[scope:hd_dc_debug_secret_target.GetShortUIName]。秘密の種類は、この人物の宗派・既存の特性・秘密の資格に基づいて原版が選定する。"
 hd_dc_debug.neg01:0 "NEG-01 暗殺の企て"
 hd_dc_debug.neg01.desc:0 "暗殺を企てる基礎確率は危険率に基づいて換算済みであり、動的な基礎確率と原版の対象資格を保持する。Fは1/1.15/1.40/1.80/2.30。「群雄割拠」の固定倍率は別途合算され、最大3となる。\n\n 実際の対象の暗殺交流チェックを使って実際の陰謀を確認すること。プレイヤーの手動クリックはAIの自動発生確率のサンプルを意味しない。このメニューは別のランダムプールで原版の抽選を代替しない。"
 hd_dc_debug.neg02:0 "NEG-02 誘拐の企て"
 hd_dc_debug.neg02.desc:0 "誘拐の原版の発起者は、能力・合法的な対象・策略の条件を保持する。Fは1/1.15/1.40/1.80/2.30。誘拐の能力を持たない者は引き続き実行できない。\n\n 実際の工作シナリオのページでは、指定した合法的な対象を検索して表示する。発起前に原版の資格を再度確認し、それから実際の誘拐工作を開始すること。その後の行動と結果は工作の流れが処理する。手動で一度発起しても、AIの自然発生率のサンプルを意味しない。"
 hd_dc_debug.neg03:0 "NEG-03 脅迫の提案"
 hd_dc_debug.neg03.desc:0 "脅迫の入口は、実際の秘密、それを知る者、原版の動的な基礎値を保持し、Fは1/1.15/1.40/1.80/2.30。正式に脅迫の要求を出した後も、結果は相手の実際の返答次第である。\n\n 実際のシナリオのページでは、指定した適格な宮廷官員に原版の新しい秘密を一つ追加し、あなたに知らせることができる。その後この人物を右クリックし、正式に脅迫の要求を出す。準備操作は明確に現時点で発生するものであり、過去の罪をでっち上げることはない。直接の証拠は発行せず、手動の提案もAIの確率サンプルとしては数えない。"
 hd_dc_debug.neg04:0 "NEG-04 国庫の窃取"
 hd_dc_debug.neg04.desc:0 "一時的に利用不可：今回の更新の確認によれば、横領された国庫の原版の四つの入口は依然として閉じている。年次のAI検出と動的確率、五年のクールダウン、原版の五つの密偵枠、引き出しの記帳はすべて保持される。検出時には原版の入口が閉じていると報告し、陰謀を強制的に生成することはない。\n\n 各段階および終局の引き出し、実際の差し引き、実収額、未精算の差額は、実際の帳簿項目に基づいて引き続き処理され、原版の固定引き出しによる当座貸越を許容する。既存のクラッシュデータでは、旧来のアクセス違反の根本原因を証明できない。横領された国庫がプレイ可能かどうかは、なお検証されていない。"
 hd_dc_debug.neg05:0 "NEG-05 民衆蜂起"
 hd_dc_debug.neg05.desc:0 "民衆派閥の合法性はPから読み取られ、五段階に分かれ、1/1.10/1.25/1.50/1.80に設定される。成立時には新たに承認された規則を採用する：原版の自動作成を保持し、W≥20のとき、統治形態ごとに毎年10%を基礎として追加の機会を一回抽選し、Pで換算して、実際に合法な種類の中から均等に選び、最大一つを作成する。\n\n 民衆の種類は実際の郡の原版作成資格を踏襲し、原版の最終作成確率を代替しない。年次チェックページには実際の記録が表示され、シナリオページでは実際の派閥を準備できるが、蜂起を直接発動したり勝利させたりはしない。"
 hd_dc_debug.neg06:0 "NEG-06 農民蜂起"
 hd_dc_debug.neg06.desc:0 "農民派閥の合法的な蜂起はPを読み取り、五段階に分かれ、1/1.10/1.25/1.50/1.80に設定される。通常の農民の種類には現在、年次の追加成立機会がある：W≥20のとき、10%を基礎としてPで換算し、他の合法的な種類と統治形態ごとに年一つの上限を共有する。原版の作成は変わらない。\n\n 農民派閥への昇格は引き続き原版の蜂起昇格の流れに従って作成され、実際のリーダーと郡の移転を保持する。追加の機会が前提となる蜂起、軍隊、勝利を捏造することはない。"
 hd_dc_debug.neg07:0 "NEG-07 派閥の作成"
 hd_dc_debug.neg07.desc:0 "変更後の設定を用いて、承認された年次の追加機会を一回作成する：原版の自動作成を保持し、W≥20のとき、統治形態ごとに毎年10%を基礎としてPで換算する。成功すれば、実際に合法な種類の中から等しい重みで一つを選び、最大一つを作成する。失敗しても再抽選はしない。候補の数が種類の重みを増やすことはない。\n\n 通常のキャラクター、郡の蜂起、実際の請求者の原版作成資格をそれぞれ確認し、同種の既存派閥を除外する。閉じられた日本の仕組みは現状の条件で引き続き除外し、昇格した農民はその原版の昇格の流れを保持する。この項目は、エンジンの最終作成確率を読み取ったり置き換えたりすることを意味しない。年次チェックページで実際の抽選と作成結果を確認できる。"
 hd_dc_debug.neg08:0 "NEG-08 派閥の蜂起"
 hd_dc_debug.neg08.desc:0 "原版の派閥の蜂起入口は、P内の種類ごとの基礎値に動的に関連付けられている。五段階は1/1.10/1.25/1.50/1.80。既存の派閥は引き続き、その実力・不満度およびその他の前提を満たさねばならない。0と100の両端点は本来の意味を保つ。\n\n 実際の派閥ページでは、指定した一時停止していない請求派閥に実際の不満度を加え、純変化を再生し、同時に原版の派閥が現在蜂起できるかを表示できる。蜂起は原版の派閥画面から発しなければならず、デバッグは初回蜂起の内部状態を飛ばさない。ROY-08Dの一時停止による保護は引き続き有効である。"
 hd_dc_debug.neg09:0 "NEG-09 ストレスの増加"
 hd_dc_debug.neg09.desc:0 "原版の修正を統合済み：キャラクターのストレス増加の段階は0 / +10% / +20% / +35% / +50%に設定される。システム範囲内のイベントに参加するキャラクターに適用される。段階は毎月の観察時に初期化・更新され、その範囲を離れると除去される。他のストレス修正との重ね合わせおよび実際の変化は原版の規則で処理される。\n\n まずキャラクターの現在のストレスを記録し、次に下の操作で基礎+10のストレス増加を適用し、操作前後の実際のストレス読み取り値と現在の修正を比較すること。"
 hd_dc_debug.neg10:0 "正統性の上昇"
 hd_dc_debug.neg10.desc:0 "原版の修正を適用済み：キャラクターの正統性上昇は五段階で、それぞれ0 / -10% / -20% / -35% / -50%。システム範囲内の状況に参加するキャラクターに適用される。他の正統性修正との重ね合わせおよび実際の上昇は原版の規則で処理される。\n\n W段階に切り替えて更新し、キャラクターの修正を確認すること。まず現在の正統性の数値を記録し、それから実際に正統性を上げる行動を完了し、前後の読み取り値を比較すること。"
 hd_dc_debug.neg11:0 "正統性の喪失"
 hd_dc_debug.neg11.desc:0 "原版の修正を統合済み：キャラクターの正統性喪失の段階は0 / +10% / +25% / +50% / +80%。システム範囲内のキャラクターに適用される。他の正統性修正との重ね合わせおよび実際の喪失は原版の規則で処理される。\n\n キャラクターの現在の正統性を記録すること。正統性を下げる行動を完了した後、前後の読み取り値を比較する。段階を切り替えるとこのシステム修正は置き換えられ、範囲を離れると除去される。"
 hd_dc_debug.neg12:0 "NEG-12 疫病の発生"
 hd_dc_debug.neg12.desc:0 "原版の七種の疫病の種類には現在、強度ごとに有効な入口がある。五段階は1/1.05/1.10/1.15/1.20。\n\n 実際のシナリオページでは、七種の災害の種類と三種の強度を順に選び、指定した郡を確認できる。原版の発生エフェクトを再利用し、感染データを再度読み取る。DLC、同種疾病のクールダウン、原版の基礎ルールおよび黒死病の規定は引き続き有効である。歴史上の黒死病が現在のマップで発生地点を見つけられない場合は、明確に阻止される。21のメニューの組み合わせは、どのルールセットでも有効な21のシナリオを意味せず、手動作成も自然なD確率やエンジンによる伝播を証明しない。"
 hd_dc_debug.neg13:0 "NEG-13 自然災害"
 hd_dc_debug.neg13.desc:0 "実際の地震と洪水災害の入口を復元し、中国・黄河・長江の既存の地理マッピングを踏襲した。デバッグページは正式な郡の資格とイベント生成インターフェースを再利用する。開発度は最低2段階を保ち、同一郡内の地震および同一流域内の洪水を除外し、災害条件を偽造しない。\n\n 手動シナリオでは、実際の災害が明示的に作成され、その後の対応は引き続き原版の条件で動作する。自然なD倍率、季節、実行時コールバックは別途確認が必要であり、手動で一度発動しても自然確率は検証できない。"
 hd_dc_debug.neg14:0 "NEG-14 負の特性の機会"
 hd_dc_debug.neg14.desc:0 "この固定チェックは14種類を対象とする：酒飲み、大麻使用者、放蕩者、隠者、短気、浪費家、慈善家、懺悔者、大食漢、拒食者、自傷者、ならびに非遺伝の抑うつ、狂気、憑依。確認済みのキャラクター属性、F値を得る自然なランダム機会、実際の資格の保持、排他性、動的な分母、単一の抽選を含む。新キャラクターの生成、確定的な選択、100%の結果の条件はそのまま保たれる。\n\n 飲酒・教育・宴会・霊感・決闘・賓客の特性は、実際のイベントの状況によって処理される。実際のシナリオページでは、適格な飲酒抽選と確率の記録を確認できる。ストレスとクールダウンが条件を満たせば、完全なストレスイベントを開始できる。適格な機会から特性を引けなかったのは正常な結果である。"
 hd_dc_debug.neg15:0 "NEG-15 統制度の蓄え"
 hd_dc_debug.neg15.desc:0 "統制度は今周期で初めて危機に入った時の実際の値を基準とし、0/5/10/15/20%を累積で差し引く。処理済みの最高段階を超える差分のみを補う。繰り返しの更新、主君の交代、いったん下がってから元の段階に戻ることのいずれでも、重複した差し引きは発生しない。低段階の安定状態が60か月続いた場合にのみ、損失期間が終わる。\n\n 首都郡の統制度を記録し、20→80→40→80のパターンでWを調整して繰り返し更新し、処理済みおよび差し引き済みの総額を確認すること。段階が下がっても、損失は返還されない。"
 hd_dc_debug.neg16:0 "開発度の蓄え"
 hd_dc_debug.neg16.desc:0 "開発の進捗は今周期の実際の基準値から0/2/4/6/8%を累積で差し引く。端数処理の後、新たに生じた差分のみを補う。通常の開発は引き続き保持される。主君の交代時には精算せず、毎月繰り返し更新しても差し引きが重なることはない。\n\n 統制度の段階と合わせて確認すること。開発度の基準値が低い場合、端数処理によって新たな損失が生じないことがある。"
 hd_dc_debug.neg17:0 "NEG-17 家族関係"
 hd_dc_debug.neg17.desc:0 "婚姻の紛争、既存の敵対的な分家、宴会、子供の集まり、馬上槍試合の妨害、魔術の集会、および主君との関係の混合プールは、すべて現在の調整プールに組み込まれている。実際の親族または配偶者の関係を読み取る。F値は1/1.15/1.40/1.80/2.30。ある一組が親族と旧怨の両方の資格を同時に満たす場合、一度だけ適用する。キャラクターの特性、相性、子女の資格、実際の結果を保持する。\n\n 混合プールは原版の死亡と負傷の分岐を保持し、通常の結果を割り当てうる条件付き関係の確率のみを調整する。端点の確率は引き続き0%または100%を保つ。家族紛争のシナリオでは、完全な adultery.0001 の疑念の連鎖を開始でき、実際の対象と五年のクールダウンを保持する。"
 hd_dc_debug.neg18:0 "NEG-18 敵対イベント"
 hd_dc_debug.neg18.desc:0 "今回調整した関係確率の出所は16か所に統合されており、既存の仇敵、宴会や子供の紛争、新たに加わった武芸の試合、魔術の集会、yearly.4001 の非死亡条件プールを含む。実際の旧怨と負の好感度を確認した後にFを使用し、同一の抽選インスタンス内で重ねて増幅することはない。死亡、負傷、あるいは必然的な敵対を伴う分岐経路のみ、原版の死傷確率と100%の端点条件を保持する\n\n。真の敵対シナリオでは、完全な入口 yearly.1010 から親族・友人の誘拐などのイベントを開始でき、各当事者の資格と年代フラグを保持する。結果として死亡もありうる。ORD-19 には別途協力の手続きがあり、青年と保証人がそれぞれ回答する。"
 hd_dc_debug.neg19:0 "NEG-19 家の結束の喪失"
 hd_dc_debug.neg19.desc:0 "統合済み：現在読み込まれているスクリプトでは、家の結束の負方向または正負可変の書き込みに1/1.10/1.25/1.50/1.80を採用する。固定の正方向の増分は増幅しない。元のキャラクターの帰属、原版の説明、範囲処理を保持する。実際の結束の仕組みを持たない統治形態には適用されない\n\n。適格な家は基礎-10の結束を適用でき（下記）、五段階をそれぞれ確認して家の変化を記録する。今回のテストでは、結束の仕組みを偽造するために統治形態を変更することはない。"
 hd_dc_debug.neg20:0 "NEG-20 民心"
 hd_dc_debug.neg20.desc:0 "現在の地域の郡と民衆の世論には単一の出所を採用し、全五段階：0/−5/−10/−15/−20。段階を切り替える際は、まず旧段階を除去してから新段階を追加する。適用地域を離れるとこの出所は消去される。\n\n 繰り返し更新して、同一段階が重複しないことを確認できる。キャラクターの好感度はこの郡レベルの世論には属さない。"
 hd_dc_debug.next:0 "次の影響群"
 hd_dc_debug.older:0 "前の受領書を確認する"
 hd_dc_debug.par01:0 "PAR-01：双方への政策照会を開始する"
 hd_dc_debug.par01.tt:0 "あなたは在位中の皇帝でなければならず、その地域は誰にも占領されておらず、派閥抗争がクールダウン中であってはならない。二つの実際の派閥はそれぞれ少なくとも3名の活動中の構成員を持ち、実力比率がそれぞれ20%以上で、かつそのリーダー同士が互いに敵対していなければならない。さらに、実際の疫病または災害の影響を受け、統治を実施できる臣従者の郡が存在しなければならない。まず二人の派閥リーダーに照会し、その実際の回答が相反する場合にのみ主要イベントが作成される。誰かに代わって政策を記入することはない。"
 hd_dc_debug.prepare_ord09:0 "ORD-09 を準備：実際の親族関係と捕虜交換"
 hd_dc_debug.prepare_ord09.tt:0 "その地域で条件を満たす在位中の統治者を別に一人選んで捕縛者とし、あなたの18歳の子女一人とその人物の18歳の子女一人を生成する。前者は相手に拘束され、後者はあなたが拘束する。あなたは300金を得る。拘束、親族関係、キャラクターはすべて実際のものであり、メニューを閉じてもこの操作は取り消されない。その後、あなたはなお要求を出し、捕縛者の実際の返答を得なければならない。"
 hd_dc_debug.prepare_ord13:0 "ORD-13 を準備：低統制度の郡、ストレス、親族"
 hd_dc_debug.prepare_ord13.tt:0 "既存の成年で自由な直属の臣従者を一人選び、その者のある郡に対する統制度を40に設定する。35歳の親族または友人を一人生成してあなたの宮廷に加え、友情を結ばせ、300金を得て、ストレスを少なくとも200増加させる。これにより原版のストレスイベントが発生する可能性がある。現職の尚書は五年間あなたに対する好感度+100となる。まだ大臣が一人も任命されていない場合、あなた自ら一人を任命しなければならない。"
 hd_dc_debug.prepare_par:0 "PAR-01 を準備：二つの実際の派閥と被災郡の比較"
 hd_dc_debug.prepare_par.tt:0 "構成員の数、官職、実際の影響力がいずれも適格な原版の派閥が二つすでに存在し、さらに実際に災害を受けて統治の資格を持つ臣従者の郡が二つ必要である。両派のリーダーは互いに五年間-200の好感度を得る。第二の郡の現在の開発度と統制度は第一の郡と一致するよう調整され、あなたは300金と五年間の+16管理を得る。疫病は発生させず、派閥構成員の数を偽造したり政策対応を差し替えたりもしない。その後、実際の政策上の対立が正式な照会を通じて生じる。"
 hd_dc_debug.prepare_roy:0 "ROY-01 を準備：既存の宗親二人の不満を激化させる。"
 hd_dc_debug.prepare_roy.tt:0 "すでに封地を持ち、皇室の血筋に属し、原版の派閥許可を満たす成年で自由な宗親二人のみを選べる。各人は五年間の皇帝に対する好感度-200と300金を得る。あなたは300金を得る。キャラクターを作成せず、王朝を変更せず、封地を再分配せず、過去の罪をでっち上げることもない。選べる人物が二人に満たない場合、準備はできない。その後、正統イベントメニューから正式に登録しなければならない。"
 hd_dc_debug.prepare_support:0 "ROY-08 を準備：資金と実際の人的フック"
 hd_dc_debug.prepare_support.tt:0 "最新の候補宗室名簿から、合法的にあなたに招待を送れる実際の候補者を一人選ぶ。あなたと選ばれた候補者はそれぞれ300金を得る。フックの作成を許可すれば、その候補者に対する個人的なフックを得る。フックは実際のDの選択肢で使用しなければならない。早まって一時停止せず、保護の誓約に自動で署名することもしないこと。"
 hd_dc_debug.protection.actor:0 "\n記録された実際の執行者：[scope:hd_dc_debug_record.Var('hd_dc_protection_harm_actor').Char.GetShortUIName]"
 hd_dc_debug.protection.execute:0 "\n死亡コールバックを記録した。実際の処刑に該当するかどうかは、死亡後に正式な観察を経て判定しなければならない。"
 hd_dc_debug.protection.illegal:0 "\n 事前の根拠：合法的な根拠がないことを確認済み。実際に執行された後にのみ、違約が処理される。"
 hd_dc_debug.protection.imprison:0 "\n 実行された操作：拘束。"
 hd_dc_debug.protection.legal:0 "\n 事前の理由：合法的な根拠を得ている。この行動は違約に当たらない。"
 hd_dc_debug.protection.revoke:0 "\n 実行された操作：称号移転の凍結。"
 hd_dc_debug.protection.title:0 "\n実際に移転された凍結称号：[scope:hd_dc_debug_record.Var('hd_dc_protection_harm_title').Title.GetName]"
 hd_dc_debug.protection.unknown:0 "\n 事前の根拠：不明。合法とも違法とも推定できず、これを理由に義務履行の完了報酬を与えるべきでもない。"
 hd_dc_debug.protection.unknown_actor:0 "\n原版のコールバックは検証可能な実際の執行者を提供しなかった。称号の受領者や他のキャラクターを指揮者と推測することはしない。"
 hd_dc_debug.receipt.audit_pending:0 "\n実際の処罰の記録が存在するが、まだ事前の合法的根拠と照合して検証できない。検証待ちであり、約束どおり完了したと記録してはならない。対応する名指しの被保護者の記録をめくって、実際の執行者と行動を確認できる。"
 hd_dc_debug.receipt.closed:0 "\nこの通常ノードは閉じられた。支払い記録と未払い記録は引き続き登記簿に保存される。"
 hd_dc_debug.receipt.desc:0 "地区受領証番号：[scope:hd_dc_debug_record.Var('hd_dc_record_id').GetValue|0]\n 記録バージョン：[scope:hd_dc_debug_record.Var('hd_dc_record_version').GetValue|0]\n 記録種別フラグ：[scope:hd_dc_debug_record.Var('hd_dc_record_kind').GetFlagKey]\n\n このページは元の記録を読み取って保存する。ページをめくっても費用の差し引き、追認の要求、日付の進行、帳簿の決済は行われない。表示されない項目はこの記録に該当欄が欠けていることを示し、履行済みを意味するものではない。"
 hd_dc_debug.receipt.empty:0 "現在のページ範囲に一致する記録はない。最新の受領証に戻ることができる。自然発生または手動の正式手続きで作成された記録は地区登記簿に保存される。"
 hd_dc_debug.receipt.instance:0 "\n主要インスタンス：統治Q [scope:hd_dc_debug_record.Var('hd_dc_q').GetValue|0]、強度X [scope:hd_dc_debug_record.Var('hd_dc_x').GetValue|0]、未了の義務 [scope:hd_dc_debug_record.Var('hd_dc_open_obligations').GetValue|0]。"
 hd_dc_debug.receipt.letters:0 "\n この記録はORD-19に属する。双方はまず3か月以内にそれぞれ受諾を済ませ、その後実際に30金を支払うことで、さらに3か月の指定通信期間に入れる。W−2の決済は、双方の実際の返答がすべて完了した場合にのみ行われる。"
 hd_dc_debug.receipt.pause:0 "\n 交渉材料は実際に消費された。動員停止は[scope:hd_dc_debug_record.Var('hd_dc_pause_date_year').GetValue|0]/[scope:hd_dc_debug_record.Var('hd_dc_pause_date_month').GetValue|0]/[scope:hd_dc_debug_record.Var('hd_dc_pause_date_day').GetValue|0]から開始する。その時点で元の派閥と人物を再確認すること。すでに発生した戦争は取り消されない。"
 hd_dc_debug.receipt.payment:0 "\n 支払うべき額：[scope:hd_dc_debug_record.Var('hd_dc_amount_due').GetValue|2]\n 実際の差し引き：[scope:hd_dc_debug_record.Var('hd_dc_actual_debit').GetValue|2]\n 実際の受領：[scope:hd_dc_debug_record.Var('hd_dc_actual_credit').GetValue|2]\n 支払いと政治的な返答は別々に記録される。全額受領は、金銭以外のすべての義務が履行されたことを意味しない。"
 hd_dc_debug.receipt.points:0 "\nポイント番号：[scope:hd_dc_debug_record.Var('hd_dc_point_sequence').GetValue|0]\n出所フラグ：[scope:hd_dc_debug_record.Var('hd_dc_point_source').GetFlagKey]\n日付：[scope:hd_dc_debug_record.Var('hd_dc_point_date_year').GetValue|0]年[scope:hd_dc_debug_record.Var('hd_dc_point_date_month').GetValue|0]月[scope:hd_dc_debug_record.Var('hd_dc_point_date_day').GetValue|0]日\nW 要求/実際：[scope:hd_dc_debug_record.Var('hd_dc_w_requested').GetValue|0]/[scope:hd_dc_debug_record.Var('hd_dc_w_committed').GetValue|0]\nH 要求/実際：[scope:hd_dc_debug_record.Var('hd_dc_h_requested').GetValue|0]/[scope:hd_dc_debug_record.Var('hd_dc_h_committed').GetValue|0]\n書き込み後 W/H：[scope:hd_dc_debug_record.Var('hd_dc_w_after').GetValue|0]/[scope:hd_dc_debug_record.Var('hd_dc_h_after').GetValue|0]\n。以上は内部ポイントで、20ポイントごとに画面上の1ポイントに相当する。この番号は毎月の義務処理には関与しない。"
 hd_dc_debug.receipt.protection:0 "指定保護は\n[scope:hd_dc_debug_record.Var('hd_dc_protection_date_year').GetValue|0]:[scope:hd_dc_debug_record.Var('hd_dc_protection_date_month').GetValue|0]:[scope:hd_dc_debug_record.Var('hd_dc_protection_date_day').GetValue|0]に締結され、期間は5年である。保護対象は締結時の相手方と、当時存命の近親者である。称号は締結日から凍結され、その後に生まれた者やその後に称号を得た者は自動的には含まれない。"
 hd_dc_debug.receipt.protection_wait:0 "前回の5年保護期間はまだ有効である。日付はゲームの進行に従って進み、このメニューで期間が短縮されることはない。\n"
 hd_dc_debug.receipt.refund:0 "\n 未返還の累計差し引き額：[scope:hd_dc_debug_record.Var('hd_dc_unreturned_debit').GetValue|2]。イベントを閉じてもこの残高は消去されない。"
 hd_dc_debug.receipt.subject:0 "締結時に凍結された保護対象：\n。保護受領証の所有者：[scope:hd_dc_debug_record.Var('hd_dc_protected_person').Char.GetShortUIName]。受領証番号：\n。所有者：[scope:hd_dc_debug_record.Var('hd_dc_protection_contract').Var('hd_dc_record_id').GetValue|0]。"
 hd_dc_debug.receipt.trial:0 "\n第一地方当局が実際に資金を受け取った日付は[scope:hd_dc_debug_record.Var('hd_dc_audit_first_date_year').GetValue|0]年[scope:hd_dc_debug_record.Var('hd_dc_audit_first_date_month').GetValue|0]月[scope:hd_dc_debug_record.Var('hd_dc_audit_first_date_day').GetValue|0]日である。照合審査では各郡をそれぞれ12か月追跡する。一方の失効はもう一方の義務履行を意味せず、期間満了後も双方の指導者による照合を待たねばならない。"
 hd_dc_debug.refresh_stocks:0 "正式な郡単位の影響更新を実行する"
 hd_dc_debug.refresh_stocks.tt:0 "その地区の統制度、開発度、民心の源泉を実際に更新する。初回の段階上昇では既存の備蓄の損失が差し引かれる。繰り返し呼び出す場合は、処理済みの最高段階を同じに保つ必要がある。"
 hd_dc_debug.region:0 "地区、時代、参加制限"
 hd_dc_debug.region.chaos:0 "\n現在の時代は群雄が割拠し、それぞれ州郡に拠る情勢である。"
 hd_dc_debug.region.desc:0 "中核郡の数：[scope:hd_dc_debug_region.Var('hd_dc_total_counties').GetValue|0]\n 実際に支配している郡の数：[scope:hd_dc_debug_region.Var('hd_dc_controlled_counties').GetValue|0]\n 実効支配率：[scope:hd_dc_debug_region.Var('hd_dc_control_percent').GetValue|1]%\n\n 覇権は、12か月覇権が存在しないか、24か月実効支配率が50%を下回った後にのみ終わり、その時点で公式に群雄時代へ移行したと裁定される。65%まで回復して60か月安定すると脱出する。朝貢は実効支配に数えない。W/Hの調整で時代が直接切り替わることはない。\n 以下には現在有効な制限のみを示す："
 hd_dc_debug.region.invalid:0 "地区\nのスナップショットは無効である。まず正式な観察を行い、世界における実際の領土を確認すること。"
 hd_dc_debug.region.locked:0 "地区\nの主要危機枠はすでに実際のインスタンスに占有されており、上書きできない。"
 hd_dc_debug.region.no_affected_county:0 "\nPAR-01 には実在し統治可能な被災郡が欠けている：地区登記簿に記載され、実際に疫病または災害があり、天子配下の従属郡であり、主君が存命かつ自由で、現在の審査措置や減税に占有されていないこと。まず実際のシナリオページで疫病または災害を用意し、再度確認すること。"
 hd_dc_debug.region.no_parties:0 "\n PAR-01 には実在する適格な派閥が2つ欠けている：各派閥は少なくとも3名の活動中の構成員と、有効な成人で自由な派閥指導者を持ち、構成員は今年度の実際の勢力スナップショットと一致し、各派閥の勢力が少なくとも20%を占めていること。互いに宿敵である2人では1つの組織の代わりにはならない。"
 hd_dc_debug.region.no_roy_instance:0 "\nROY-08 には正式な王室インスタンスが欠けている。まずROY-01を正当に確立し、実際の候補者派閥を形成してから、その派閥に加入できる招待対象の人物に切り替えること。"
 hd_dc_debug.region.no_royals:0 "\nROY-01 には候補者が欠けている：正式な宗室候補者審査を通過した実在の人物が2人未満である。彼らは存命、成人、自由で、同じ血統に属して封地を持ち、かつ原版の派閥条件を満たしていなければならない。準備メニューは既存の適格な宗族を強化するのみで、新たな封地や王朝は作成しない。"
 hd_dc_debug.region.not_emperor:0 "\nROY-01/PAR-01 の資格不適合：あなたは現在の皇帝ではない。発起する前に実際の皇帝に切り替えること。保有者は置き換えられない。"
 hd_dc_debug.region.ordinary_wait:0 "\nあなたには保留中の通常イベントがあるため、別の通常ノードを開くことはできない。"
 hd_dc_debug.region.outside:0 "\nあなたは王朝循環の参加者ではない。人物増分と通常ノードは、地区外の人物を適格な人物とみなすことはできない。"
 hd_dc_debug.region.par_cooldown:0 "\n50年間の派閥抗争クールダウンがまだ終わっていない。"
 hd_dc_debug.region.party_wait:0 "双方への政策照会がまだ進行中であり、正式な回答を待っている。\n"
 hd_dc_debug.region.prepared:0 "\nの政治的実体はまだ確立されていないため、再度作成することはできない。"
 hd_dc_debug.region.roy_cooldown:0 "\n皇族タイプの50年クールダウンがまだ終わっていない。"
 hd_dc_debug.relation_scene:0 "実際の家族の揉め事または敵対イベントに入る"
 hd_dc_debug.relation_scene.desc:0 "完全な原版の入口から入った場合にのみ、原版イベントは実際の対象を選び、その後の対応を進めることができる。ここではランダムプールを構築せず、密通、旧怨、誘拐の成功や関係の結果を強制的に設定することもない。前提条件が満たされれば、イベントで指定された人物と各選択が実際に世界を変える。"
 hd_dc_debug.relation_scene.family:0 "適格な原版の伴侶への疑念チェーンを発生させる。"
 hd_dc_debug.relation_scene.family.tt:0 "イベント adultery.0001 を呼び出す。原版イベントの選択肢が実際の伴侶を選び、疑われた者に既存の5年制限を課したうえで、直接問い詰めるかどうかをあなたに尋ねる。相手が告発を否認した場合にのみ、本当の疑念の分岐に入る。あなたが相手の代わりに否認を選ぶことはできない。秘密が事実無根であれば原版のシナリオで処理され、不貞が捏造されることはない。"
 hd_dc_debug.relation_scene.no_family:0 "\n 家族の揉め事の前提条件が不足している：あなたはその地区内におり、原版の年次人物資格を満たし、かつ騙されやすい者であってはならない。最近疑われていない健康な成人の実在の配偶者が少なくとも1人おり、さらにあなたが猜疑心を持つか、原版の伴侶が好色家/誘惑者の特性を持つか、実際の不貞の兆候を示している必要がある。また、宗派が罰則なしの姦通を認めていないこと。元の5年の対象クールダウンは消去されない。"
 hd_dc_debug.relation_scene.no_rival:0 "\n敵対イベントの前提条件が不足している：原版の10年フラグが存在しないこと。成人で操作可能なAIの宿敵がおり、その宿敵は領地を持つか、主君の後継者であり、その主君は存在してあなた自身ではないこと。あなたの宮廷に、成人で操作可能なAIの配偶者/親族/愛妾がいて、あなたの宿敵ではないこと。さらに、操作可能で重傷を負っていないAIの指揮官、または実際の狩猟長の役職があること。"
 hd_dc_debug.relation_scene.rival:0 "適格な原版の宿敵による誘拐の家族チェーンを発生させる。"
 hd_dc_debug.relation_scene.rival.tt:0 "yearly.1010 を呼び出し、原版イベントから実際の宿敵、あなたの宮廷の親族・友人、追跡者を選ぶ。このチェーンは実際の投獄、負傷、死亡、支払い、関係の変化を引き起こす可能性がある。これは誘拐工作の発生率のテストではない。原版の10年の発生制限は維持される。親族・友人が自ら去るかどうかや救出の結果を代わりに決めることはない。"
 hd_dc_debug.result.breached:0 "\n実際に発生した、正当な根拠のない侵害が記録され、保護対象の違約に該当する。"
 hd_dc_debug.result.expired:0 "\nの回答期限はすでに満了した。"
 hd_dc_debug.result.fulfilled:0 "\n5年の保護期間は約定どおり満了して終了した。"
 hd_dc_debug.result.guarantor_letter:0 "\n保証人の署名入りの返書を受け取った。"
 hd_dc_debug.result.invalidated:0 "関係者、権力、場所、その他の実際の前提条件が失効したため、完了報酬は支給されなかった。\n"
 hd_dc_debug.result.ordinary_code:0 "\n通常ノードの実際の結案フラグ：[scope:hd_dc_debug_record.Var('hd_dc_ordinary_result').GetFlagKey]"
 hd_dc_debug.result.par_code:0 "\n政策ノードの実際の結案フラグ：[scope:hd_dc_debug_record.Var('hd_dc_par01_result').GetFlagKey]"
 hd_dc_debug.result.partial:0 "\n一部履行済み、または未清算の勘定が残っている。引き続き支払いと地方の記録を照合すること。"
 hd_dc_debug.result.pause_code:0 "\n動員停止の実際の結案フラグ：[scope:hd_dc_debug_record.Var('hd_dc_pause_result').GetFlagKey]"
 hd_dc_debug.result.protection_code:0 "\n指定保護の実際の結案フラグ：[scope:hd_dc_debug_record.Var('hd_dc_protection_result').GetFlagKey]"
 hd_dc_debug.result.rejected:0 "地方または派閥の指導者が拒否した。全面履行とはみなされない。\n"
 hd_dc_debug.result.released:0 "\n親族の実際の返還が確認された。"
 hd_dc_debug.result.roy_code:0 "\n宮廷礼儀令の実際の結案フラグ：[scope:hd_dc_debug_record.Var('hd_dc_roy01_result').GetFlagKey]"
 hd_dc_debug.result.verified:0 "\n名指しされた2人の派閥指導者がともに実際の決済を完了した。現在の政策ノードは協定どおり清算された。"
 hd_dc_debug.result.writing:0 "\n双方が受諾して支払いを済ませ、指定通信を待っている。"
 hd_dc_debug.result.youth_letter:0 "\n青年の署名入りの返書を受け取った。"
 hd_dc_debug.results:0 "現在のインスタンスを実際の受領証と照合する"
 hd_dc_debug.roy01:0 "ROY-01：礼制秩序をめぐる争いを起こす"
 hd_dc_debug.roy01.tt:0 "あなたは在位中の天子で、有効な地区スナップショットを持ち、少なくとも2人の適格な原版の宗室候補者がおり、皇室タイプがクールダウン中でなく、かつその地区に現行または保留中のインスタンスが存在しないことが必要である。正式に成立すると実際の請求権と派閥が生じ、50年のタイプ別クールダウンが始まる。"
 hd_dc_debug.roy08:0 "ROY-08：我が宗族の正当な招きにより、私を加わらせてほしい。"
 hd_dc_debug.roy08.tt:0 "最近の王朝インスタンスと、有効な請求権を持つ現行の派閥が存在する必要がある。あなたはその派閥に加入する資格を持つ適格な招待対象でなければならない。皇帝、候補者本人、既加入者、またはいずれかの側と対立している者であってはならない。いずれの人物の組にも保留中の招待、既存の加入記録、再試行クールダウンがあってはならない。停止状態の派閥は構成員を募集できない。"
 hd_dc_debug.scheme_scene:0 "実際の暗殺または誘拐の工作を準備する"
 hd_dc_debug.scheme_scene.abduct:0 "指定した対象に対して実際の誘拐工作を開始する"
 hd_dc_debug.scheme_scene.abduct_target:0 "\n誘拐予定の対象：[scope:hd_dc_debug_abduct_target.GetShortUIName]。"
 hd_dc_debug.scheme_scene.desc:0 "王朝循環の実際の参加者の中から、原版で can_start_scheme の資格を持つ指定のAI対象を1人選ぶ。クリックすると工作が始まる。成功率、段階、共謀者、結果は引き続き原版の工作システムによって決まる。誰かを直接殺害・投獄することはなく、AIが発起する危険率のサンプリングにも数えられない。実際の工作は工作パネルで確認すること。"
 hd_dc_debug.scheme_scene.murder:0 "指定した対象に対して実際の暗殺工作を開始する"
 hd_dc_debug.scheme_scene.murder_target:0 "\n暗殺予定の対象：[scope:hd_dc_debug_murder_target.GetShortUIName]。"
 hd_dc_debug.scheme_scene.no_abduct:0 "\n 原版で正当な誘拐対象がいない：実行者は誘拐者のスキルを持つか、その陣営が解禁されているか、関連する争奪許可を持っている必要がある。対象は成人で自由かつ操作可能な統治者でなければならない。対象が投獄中や人質であってはならず、実際の所在地と外交範囲が必要である。子供の制限、行動不能、原版のクールダウン/枠も引き続き確認される。資格を得るためにスキルが追加されることはない。"
 hd_dc_debug.scheme_scene.no_murder:0 "\n原版で正当な暗殺対象がいない：人物の資格、工作枠、同一人物に対する既存の工作、クールダウン、外交範囲、親族制限を確認すること。現在その地区内で存命のAI人物のみを選ぶ。対象があなたに対する強力なフックを持っていてはならない。既存の工作は消去されない。"
 hd_dc_debug.test_native_breakdown:0 "適格な原版のストレスイベントを発生させる"
 hd_dc_debug.test_native_breakdown.tt:0 "現在のストレス水準と、それに応じた原版のクールダウン残量が必要である。1日後に資格を再確認し、その後原版のストレスイベントが実際の内容を選ぶ。特性が強制的に付与されることはない。"
 hd_dc_debug.test_stress:0 "基礎ストレス+10を実際に適用する"
 hd_dc_debug.test_stress.tt:0 "これにより実際のストレスが増加し、原版のストレスイベントの閾値に達する可能性がある。その他の原版の修正も引き続き計算に含まれる。"
 hd_dc_debug.test_unity:0 "基礎家結束度-10を実際に適用する"
 hd_dc_debug.test_unity.tt:0 "王朝循環の地域内にいて、実在する家があり、現在の統治形態に固有の結束度システムがある必要がある。家結束度の実際の減少は現在のPごとに1回のみ適用され、自動的に返還されることはない。"
 hd_dc_debug.unity_change:0 "王朝循環デバッグ：実際の結束度損失"
