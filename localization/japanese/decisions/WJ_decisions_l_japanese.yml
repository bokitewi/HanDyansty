l_japanese:
# 汉晋风华：按类型整合；键名与现行文本保留。来源逐键见本批manifest。

 # 来源：localization/simp_chinese/WJ_appointment_flavor_l_simp_chinese.yml

 # 来源：localization/simp_chinese/WJ_kaoke_central_l_simp_chinese.yml
 wj_kaoke_table_decision:0 "全朝の考課表を閲覧"
 wj_kaoke_table_decision_confirm:0 "考課表を差し出す"
 wj_kaoke_table_decision_desc:0 "尚書台が本朝の地方官の課簿を一つの表にまとめ、あなたの机上に差し出した。誰が勤勉で誰が怠惰か、一目瞭然である。"
 wj_kaoke_table_decision_tooltip:0 "本朝の地方官の考課に目を通す"

 # 来源：localization/simp_chinese/WJ_kaoke_l_simp_chinese.yml
 wj_kaoke_ledger_decision:0 "考課簿を閲覧"
 wj_kaoke_ledger_decision_confirm:0 "簿冊を差し出す"
 wj_kaoke_ledger_decision_desc:0 "書吏があなたの考課簿を捧げ持ってきた。今期に処理した公務、自ら臨んだ戦陣、裁いた案件が、すべてあなたの名の下に一つ一つ記されている。たとえ他所へ転任しても、この簿はあなたについて回る。"
 wj_kaoke_ledger_decision_tooltip:0 "今期の功過、前回の考第、考功の法に目を通す"

 # 来源：localization/simp_chinese/WJ_military_governance_l_simp_chinese.yml
 WJ_zw_acquire_decision:0 "都督中外の詔を請う"
 WJ_zw_acquire_decision_confirm:0 "上表して詔を請う"
 WJ_zw_acquire_decision_desc:0 "内には尚書の奏事を掌り、外には将相の声望を集める。すでに録尚書事の重責を担い、朝中の要職にも誼を通じる者が多い。今こそ詔命を請い、中外諸軍事を都督し、黄鉞を仮して軍令を一つにすべし。"
 WJ_zw_acquire_decision_tooltip:0 "都督中外諸軍事・仮黄鉞の詔命を請う"

 # 来源：localization/simp_chinese/WJ_ministry_l_simp_chinese.yml
 wj_create_cheng_xiang_decision:0 "拝相して政を執る"
 wj_create_cheng_xiang_decision_confirm:0 "拝相して政を執る"
 wj_create_cheng_xiang_decision_desc:0 "丞相の位は久しく空いている。非常の時には、非常の人が朝政を総攬すべきである。今日の我が声望をもってすれば、天子に請うて丞相に拝され、閣に入って政を執り、万機を代行するにふさわしい。"
 wj_create_cheng_xiang_decision_tooltip:0 "丞相に拝され、閣に入って政を執り、天子の摂政となる"

 # 来源：localization/simp_chinese/WJ_office_roads_loc_l_simp_chinese.yml
 wj_langguan_kaoxiao_decision:0 "郎官考校"
 wj_langguan_kaoxiao_decision_confirm:0 "署に入り考校を受ける"
 wj_langguan_kaoxiao_decision_desc:0 "郎官署の考校がまた始まろうとしている。経義・律令・奏対の三場を終えて、ようやくこの数年の学問が確かなものか分かる。合格すれば孝廉の出身として署を離れて仕官し、さもなくば一年署に留まり、翌年また受験するほかない。"
 wj_langguan_kaoxiao_decision_tooltip:0 "郎官考校に参加する"
 wj_temp_official_kaoke_decision:0 "考課を奏請"
 wj_temp_official_kaoke_decision_confirm:0 "文書を呈して考課を受ける"
 wj_temp_official_kaoke_decision_desc:0 "仮吏の身で試みに職を守り、早くも一年が過ぎた。今こそ任内の簿書と治績を有司に報告し、考課を待つべき時である。考課は政務を処理する才を重んじる。合格すれば、現任官職の高下に応じて孝廉または茂才の出身を得られる。"
 wj_temp_official_kaoke_decision_tooltip:0 "治績を報告して考課を受け、正式な仕官を目指す"

 # 来源：localization/simp_chinese/WJ_yangwang_l_simp_chinese.yml
 WJ_yangwang_rename_decision:0 "雅号を変更"
 WJ_yangwang_rename_decision_confirm:0 "別の雅号を選ぶ"
 WJ_yangwang_rename_decision_desc:0 "古い号も長く使ううちに、今の心境に合わなくなったかもしれない。新たな雅号を選び、胸中の思いを託そう。"
 WJ_yangwang_rename_decision_tooltip:0 "隠士の特性に表示される雅号を変更する"
