l_japanese:
 hd_dc_ord.0019.c: "互いに信頼する者を保証人に立て、まず書簡を交わす。"
 hd_dc_ord.0019.c.tt: "[hd_dc_visitor.GetTitledFirstName]と保証人がともに応じれば、誠意の証として[hd_dc_visitor.GetHerHim]にささやかな贈り物をし、書簡を交わす："
 hd_dc_ord.0119.t: "封をしていない手紙"
 hd_dc_ord.0119.desc: "使者が封をしていない手紙を広げた。手紙には官職のことも兵馬のことも書かれておらず、ただ、一度わだかまりなく往来する気はないかと問うている。\n\n[hd_dc_ordinary.Var('hd_dc_actor').Char.GetTitledFirstName]は手紙ではっきりと述べている。[hd_dc_ordinary.Var('hd_dc_visitor').Char.GetTitledFirstName]の父祖の代からの旧怨はひとまず脇に置き、このたびは[hd_dc_ordinary.Var('hd_dc_guarantor').Char.GetTitledFirstName]に間に立って保証してもらう、と。二人がともに頷いてはじめて書簡の往来が叶い、[hd_dc_ordinary.Var('hd_dc_actor').Char.GetSheHe]も誠意の証としてささやかな贈り物を用意するという。\n\n古い貸し借りはまだ清算されていない。だがこの一筆は、目の前の者が自ら記さねばならない。"
 hd_dc_ord.0119.a: "名を署し、自ら返答しよう。"
 hd_dc_ord.0119.a.tt: "#EMP 二人がともに応じなければ、書簡の往来はできない。#!"
 hd_dc_ord.0119.b: "この約定は、あいにく引き受けかねる。"
 hd_dc_ord.0219.t: "あなたが筆を執る番"
 hd_dc_ord.0219.desc: "二人ともすでに応じ、[hd_dc_ordinary.Var('hd_dc_actor').Char.GetTitledFirstName]の贈り物も[hd_dc_ordinary.Var('hd_dc_visitor').Char.GetTitledFirstName]の手元に届いた。書吏が紙をあなたの前に押しやり、あなたが自分の名を書くのを待っている。\n\nこの手紙を出せば、公に心のうちを示すことになる。今なら翻意してもまだ間に合う。ただし、この一筆は他人が代わりに署名することはできない。"
 hd_dc_ord.0219.a: "往来の意を記し、自らの名を署す。"
 hd_dc_ord.0219.b: "筆を置く。この約束、我には果たせぬ。"
 hd_dc_ord_correspondence_archive_title: "一束の書簡"
 hd_dc_ord.0319.completed: "[hd_dc_ordinary.Var('hd_dc_visitor').Char.GetTitledFirstName]と[hd_dc_ordinary.Var('hd_dc_guarantor').Char.GetTitledFirstName]の返書がともに届いた。書吏はそれらを[hd_dc_ordinary.Var('hd_dc_actor').Char.GetTitledFirstName]の送った手紙と一緒にまとめ、絹紐で束ねた。\n\n父祖の代からの旧怨がこれで帳消しになったわけではない。だが目の前のこの者たちの間には、ようやく付き合いの拠り所となる新たな事柄ができたのだ。"
 hd_dc_ord.0319.rejected: "誰かがこの手紙を断り、双方の同意は得られなかった。贈り物は送られず、書簡の往来も叶わなかった。\n\n今回の好意は、ひとまずしまっておくほかない。"
 hd_dc_ord.0319.unpaid: "二人ともすでに応じたが、あのささやかな贈り物は全額届かなかった。書吏は帳簿の上で筆を止め、書簡の往来もここで沙汰止みとなった。\n\n贈り物は揃わず、手紙も往来せず、この良き話は中途で止まるほかなかった。"
 hd_dc_ord.0319.withdrawn: "手紙を半ばまで書いたところで、誰かが筆を置き、先の同意を撤回した。\n\n贈り物はすでに送られたが、書簡は結局往来しなかった。今回の和解は、あと一歩のところで及ばなかった。"
 hd_dc_ord.0319.expired: "日々は過ぎていったが、来るべき返書はいつまでも揃わなかった。\n\n書吏は届いた数通を重ねてしまい込んだ。書かれなかった残りの半分は、そのまま空白となった。"
 hd_dc_ord.0319.invalidated: "情勢はすでに変わり、往来を約した者たちの中には、もはや元のように振る舞えない者もいる。書吏はもう返書を催促せず、手元の数通を一つにまとめた。\n\n今回の往来は、何の結果も得られなかった。"
 hd_dc_ord.0319.a: "ひとまず書簡をしまっておこう。"
