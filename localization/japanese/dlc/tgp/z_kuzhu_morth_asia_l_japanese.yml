l_japanese:
 #苦竹新增特殊文化
 culture_parameter_kuzhu_stewardship_logistics_bonus: "管理の教育特性も、そのレベルに応じて軍事能力を高める"
 kuzhu_tradition_mengan_mouke_name: "猛安謀克"
 kuzhu_tradition_mengan_mouke_desc: "軍民一体にして、耕すこともでき戦うこともできる。国事に専心し、私心を抱かない。"
 tradition_kuzhu_proved_by_sword_name: "武をもって統を証す"
 tradition_kuzhu_proved_by_sword_desc: "王侯いずくんぞ種あらんや？時の運にすぎぬ。国に常なる主なし、ただ兵強く馬壮なる者がこれとなる！" 
 tradition_kuzhu_minor_china_name: "小中華"
 tradition_kuzhu_minor_china_desc: "この文化は衣冠も礼楽もすべて中国に倣い、聖賢の書を読み、周孔の教えを行い、その民もまた華夏の末裔をもって自任している。"
 tradition_kuzhu_praise_literature_name: "文章による取士"
 tradition_kuzhu_praise_literature_desc: "大国を治めるには武ではなく文をもってする。君たる者は文章の才によって天下の名士を量り、その優れた者を選んで用いるべきである。"
 culture_parameter_kuzhu_confucian_education_add_merit_level: "[GetTrait('confucian_education').GetName( GetNullCharacter )]の特性が賢能の[merit_level|E]上限を与える。"
 cannot_have_tradition_loyal_soldiers: "[GetCultureTradition('tradition_loyal_soldiers').GetName]の伝統と同時に持つことはできない"
 cannot_have_tradition_scholar_officials: "[GetCultureTradition('tradition_scholar_officials').GetName]の伝統と同時に持つことはできない"
