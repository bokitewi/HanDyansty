 kuzhu_small_government_size_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 外交、管理、策略が上昇し、兵士の攻撃力と強靭さが低下する。#!"
 kuzhu_medium_government_size: "中規模な文官"
