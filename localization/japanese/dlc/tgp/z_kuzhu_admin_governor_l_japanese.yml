 kuzhu_medium_government_size_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 外交、管理、策略が上昇し、兵士の攻撃力と強靭さ、軍の行軍速度が低下する。#!"
 kuzhu_large_government_size: "大規模な文官"
 kuzhu_large_government_size_subname: "巨大な文官集団が全国の大小の事務を一手に掌握し、地方官吏が中枢の統制から逃れる術はほとんどない。"  
 kuzhu_large_government_size_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 外交、管理、策略が上昇し、兵士の攻撃力と強靭さ、軍の行軍速度が低下する。#!"
