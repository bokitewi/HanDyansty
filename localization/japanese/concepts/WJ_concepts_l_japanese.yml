# 汉晋风华：按类型整合；键名与现行文本保留。来源逐键见本批manifest。

 # 来源：localization/simp_chinese/WJ_contract_privileges_l_simp_chinese.yml
 game_concept_wj_kaifu:0 "開府"
 game_concept_wj_zhoumu:0 "州牧への抜擢"
 game_concept_wj_zhoumu_desc:0 "$WJ_zhoumu_grant_desc$"
 game_concept_wj_huangyue:0 "仮黄鉞"
 game_concept_wj_huangyue_desc:0 "$WJ_huangyue_grant_desc$"
 game_concept_wj_kaifu_desc:0 "開府は朝廷が契約により特別に授けるもので、自ら僚属を置き、掾史を辟召することができる。大将軍・太傅・丞相・司徒・司空・太尉は在任中に開府を得られ、その他の重臣は別途授与を受けねばならない。"
 game_concept_wj_maojie:0 "旄節"
 game_concept_wj_maojie_desc:0 "旄節には仮節・持節・使持節の三等があり、一人が持てるのはそのうち一つだけである。天子は軍事ウィンドウの「都督区」ページで区を設けて節を授ける。在任中に授け直すことはできるが、取り上げて無にすることはできない。中核となる実職が通常どおり継承された場合、新任者がその節を受け継ぎ、前任者は罷免される。持節者の号令は、直属に限らず区内のすべての資格ある官員に及ぶ。朝廷に反旗を翻した場合、もはや朝廷の命を借りて忠臣に号令することはできない。軍法は「都督軍令を頒行」によって施行され、開府の有無は別途判定される。"

 # 来源：localization/simp_chinese/WJ_merit_flavor_loc_l_simp_chinese.yml
 game_concept_wj_chushi:0 "処士"
 game_concept_wj_chushi_desc:0 "まだ官職を持たず、かつ土地なし士族でもない者は[wj_chushi|E]と称され、朝野の間に身を置く。仕官の資格を備えていることは、すでに[wj_luyi|E]を有していることを意味しない。"
 game_concept_wj_guanyuan:0 "官員"
 game_concept_wj_guanyuan_desc:0 "[wj_guanyuan|E]は[wj_junguozhi|E]のもとで命を受けて地方を治める[liege|E]の封臣である。官員は主君によって任命され、[governor_efficiency|E]を用いて[realm|E]内の土地を管理する。文武の別は、統治する省区の契約によって定まる。\n\n官員の[title|E]とその下の[counties|E]が[province|E]を構成し、管轄内の[governance_issues|E]は在任の官員が処置する。\n\n官員は[influence|E]を蓄積し、他の官職の[succession|E]に影響を及ぼすことができる。\n\n#F その位に居りてその事に任じ、詔を奉じて土を守り、期に従って考課を受く。#!"
 game_concept_wj_junguozhi:0 "郡国制"
 game_concept_wj_junguozhi_desc:0 "[GetGovernment('celestial_government').GetRuleInfo][GetGovernment('celestial_government').GetFlagInfo]\n[wj_junguozhi|E]は漢・晋の[government_bureaucratic_type|E][government_form|E]である。天子が朝廷を統べ、[liege|E]が[wj_guanyuan|E]を任命して地方を治めさせ、授けた契約に応じて州郡・軍戍・司隷に分かれる。\n\nキャラクターは[influence|E]、[noble_families|E]、[family_estates|E]、[treasury|E]を用いる。独立した[rulers|E]は[legitimacy|E]を持ち、臣下は[merit|E]によって仕途を進む。\n\n士人の仕官は辟召・孝廉・茂才・清談・考課の諸途によるもので、科挙は設けない。地方の[title_men_at_arms|E]は爵級に応じて授けられ、県級の称号は称号兵を持たない。\n\n#F 郡国並び行われ、権は天子に帰す。中央の公卿は政を輔け、地方の州郡は詔を奉じて民を治む。#!"
 game_concept_wj_luyi:0 "禄秩"
 game_concept_wj_luyi_desc:0 "[wj_luyi|E]は官によって秩を定め、禄は官に従って移るもので、キャラクターの任じる官職に応じた俸禄の等級を表す。\n\n男爵級官職は[wj_luzhi_liubaishi|E]、伯爵級は[wj_luzhi_qianerbai|E]、公国級は[wj_luzhi_bierqian|E]、王国級は[wj_luzhi_zhongerqian|E]、帝国級以上は[wj_luzhi_wanshi|E]である。\n\nまだ官職のない者は[wj_chushi|E]または[wj_shizu|E]と称する。正式な仕官の途を経ずに先に官に就いた者は暫定的に[wj_shishou|E]となり、期間満了後に能力の考課を受けねばならない。"
 game_concept_wj_luyi_i:0 "@merit_icon!"
 game_concept_wj_luzhi_bierqian:0 "比二千石"
 game_concept_wj_luzhi_bierqian_desc:0 "[wj_luzhi_bierqian|E]は公国級官職の秩である。"
 game_concept_wj_luzhi_liubaishi:0 "六百石"
 game_concept_wj_luzhi_liubaishi_desc:0 "[wj_luzhi_liubaishi|E]は男爵級官職の秩である。"
 game_concept_wj_luzhi_qianerbai:0 "千二百石"
 game_concept_wj_luzhi_qianerbai_desc:0 "[wj_luzhi_qianerbai|E]は伯爵級官職の秩である。"
 game_concept_wj_luzhi_wanshi:0 "万石"
 game_concept_wj_luzhi_wanshi_desc:0 "[wj_luzhi_wanshi|E]は帝国級以上の官職の秩である。"
 game_concept_wj_luzhi_zhongerqian:0 "中二千石"
 game_concept_wj_luzhi_zhongerqian_desc:0 "[wj_luzhi_zhongerqian|E]は王国級官職の秩である。"
 game_concept_wj_mingwang:0 "賢望"
 game_concept_wj_mingwang_desc:0 "賢望は士人の徳行・声誉・功業に由来する。清談は才学を人に知らしめ、推挙は名声を朝野に伝え、任職と考課は治事の能力を検証する。\n\n[merit|E]が高いほど朝廷や士林に重んじられやすく、担える官職も重くなる。ただし声誉がいかに盛んでも、正式な任命を経てはじめて職を掌ることができる。"
 game_concept_wj_mingwang_i:0 "@merit_icon!"
 game_concept_wj_ruzhi:0 "仕官の途"
 game_concept_wj_ruzhi_desc:0 "漢晋の仕官の途は三つある：\n\n辟召——挙主の幕府に入り、その引き立てを受けて出仕する。\n\n孝廉——公国級官員が、まだ官身のない者を察挙して郎官署に入れ、考校に合格すれば孝廉の出身を得る。\n\n茂才——王国級以上の官員が才士を察挙する。現任の官員、孝廉や辟召出身の者も推挙を受けることができ、より高い仕官資格を得る。\n\n正式な仕官の途を持たずに先に官に就いた者は暫定的に試守となり、期間満了後に能力の考課を受ける。男爵・伯爵級官職で合格した者には孝廉を、公国級以上の官職で合格した者には茂才を授ける。"
 game_concept_wj_ruzhi_i:0 "@merit_icon!"
 game_concept_wj_shishou:0 "試守"
 game_concept_wj_shishou_desc:0 "正式な仕官の途を持たずに先に実職に就いた者は、暫定的に[wj_shishou|E]となる。試守期間中は仮吏のペナルティを負い、期間満了後に能力の考課に合格してはじめて、正式な仕官資格を得られる。"
 game_concept_wj_shizu:0 "士族"
 game_concept_wj_shizu_desc:0 "土地なし士族の家の称号を持ちながら官に就いていない者は[wj_shizu|E]と称する。正式な仕官資格を備えた者が官に就いた後は、任じた官職に応じて[wj_luyi|E]が定まる。資格を持たずに先に官に就いた者は、なお[wj_shishou|E]として考課を待つ。"
 game_concept_wj_xianwang_level_chao:0 "海内の称誉"
 game_concept_wj_xianwang_level_chao_desc:0 "名は海内に著れ、朝野に重んじられる。その徳望と治績にはいずれも裏付けがあり、公卿の選に列して朝廷の重務を担うことができる。"
 game_concept_wj_xianwang_level_gong:0 "天下の宗とするところ"
 game_concept_wj_xianwang_level_gong_desc:0 "天下の宗とするところとなり、士林に望み重し。徳行・功業・声誉いずれも卓越し、公輔の選たるに足る。任を受けてはじめて、相応の職務を掌ることができる。"
 game_concept_wj_xianwang_level_jun:0 "郡中に聞こえる"
 game_concept_wj_xianwang_level_jun_desc:0 "声は郡中に聞こえ、治事に評判がある。郡中の賢士や官員がしだいにその才を知り、一郡の任に推薦されうる。"
 game_concept_wj_xianwang_level_xian:0 "郷里に称えられる"
 game_concept_wj_xianwang_level_xian_desc:0 "才と行いが初めて現れ、郷里に称えられる。士人はすでに一地方の信頼を得て、県務の選たりうる。任を受けられるかどうかは、なお朝廷の命を待たねばならない。"
 game_concept_wj_xianwang_level_zhou:0 "士林に称えられる"
 game_concept_wj_xianwang_level_zhou_desc:0 "士林に推重され、誉れは州境に満ちる。才学と功業はすでに一州に知られ、地方の重任の選に列するに足る。"

 # 来源：localization/simp_chinese/WJ_office_roads_loc_l_simp_chinese.yml
 game_concept_WJ_maocai:0 "茂才を挙げる"
 game_concept_WJ_maocai_desc:0 "王国級以上の官員は、同じ天朝の才士を茂才として察挙できる。現任の官員、孝廉および辟召出身の者はいずれも改めて茂才に挙げられうるが、すでに茂才である者は重ねて推挙を受けられない。推挙を受けた者はただちに正式な仕官資格を得るが、禄秩はなお任じる官職によって定まる。挙主は察挙の機会を借りてその者を門生とすることもできる。"
