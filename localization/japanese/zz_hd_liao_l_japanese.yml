l_japanese:
 # 僚人入蜀（见 docs/五胡乱华_僚人入蜀_设计草案.md 第 3 节）

 rule_hd_liao_migration_rule: "獠人の入蜀"
 setting_hd_liao_rule_historical: "#high 史実#!"
 setting_hd_liao_rule_historical_desc: "280年以降、王朝サイクルが動揺・乱世・崩壊の段階にあり、かつ蜀の地の防衛側の兵力が獠帥（イベント軍を含む）の2倍を超えない場合、AIは毎年10%の確率で獠人の入蜀を起こす。"
 setting_hd_liao_rule_random: "#high ランダム#!"
 setting_hd_liao_rule_random_desc: "年代に関係なく、条件さえ満たせばAIが獠人の入蜀を起こすことがある。"
 setting_hd_liao_rule_player_only: "#high プレイヤーのみ#!"
 setting_hd_liao_rule_player_only_desc: "AIは獠人の入蜀を起こさず、プレイヤーのみが決断によって発動できる。"
 setting_hd_liao_rule_off: "#high 無効#!"
 setting_hd_liao_rule_off_desc: "獠人の入蜀を無効にする。"

 hd_liao_migration_decision: "衆を率いて入蜀"
 hd_liao_migration_decision_desc: "蜀の地は連年の戦乱で田野は荒れ果て、城邑は空になっている。山谷の獠人はますます数を増し、故地ではもはやこれほどの人を養えない。北の巴蜀の沃野が、開墾する者を待っている。"
 hd_liao_migration_decision_tooltip: "一族を挙げて北上し、蜀の地を占拠する"
 hd_liao_migration_decision_confirm: "各部に命を伝えよ、装いを整えて北上だ！"
 hd_liao_migration_decision_flavour_effect: "一度限りの[hd_liao_migration_casus_belli|E]を獲得する"
 hd_liao_migration_decision_year_ok: "北上の時が来た"
 hd_liao_migration_decision_phase_ok: "王朝サイクルが動揺・新王朝の征服・闘争・対峙・崩壊のいずれかの段階にある"

 hd_liao.0001.t: "獠人の入蜀"
 hd_liao.0001.desc: "山での暮らしは年々苦しくなっている。各洞・各寨の人口はますます増えるのに、耕せる斜面は相変わらずわずかしかない。\n\n北から戻った斥候によれば、蜀中は長年の戦乱を経て、多くの郡県にはほとんど人家が残っておらず、田畑は荒れたまま耕す者もなく、官府も手が回らないという。\n\nあなたが衆を率いて北上すれば、あなたの一族は巴蜀に根を下ろすことができるだろう。"
 hd_liao.0001.a: "蜀の地へ進発せよ！"
 hd_liao.0001.a.tt: "蜀の地の統治者に対して、一度限りの特別な[hd_liao_migration_casus_belli|E]を使用できる"
 hd_liao.0002.desc: "あなたの封臣[hd_liao_invader.GetShortUIName]が思いがけずすべての獠人の部衆を召集し、一族を挙げて北上し、蜀の地へ移ろうとしている。\n\nこれが成し遂げられれば、あの一帯に対するあなたの支配はおそらく保てなくなるだろう。"
 hd_liao.0002.a: "勇あって謀なし！"
 hd_liao.0002.a.tt: "獠人が[hd_liao_migration|E]を開始する"
 hd_liao.0003.desc: "南から悪い知らせが届いた。獠人の首領の一人[hd_liao_invader.GetShortUIName]が配下のすべての人馬を集め、大挙して北上し蜀の地を占拠しようとしている。\n\n今この時、獠人の各部が集結しつつある……"
 hd_liao.0003.a: "山中の蛮人が、どうして嶺を越えて来られようか？"

 HD_LIAO_MIGRATION_WAR_NAME: "獠人の[TITLE.GetBaseName]入り"
 HD_LIAO_MIGRATION_WAR_NAME_BASE: ""
 HD_LIAO_MIGRATION_CB_NAME: "獠人の入蜀"
 hd_liao_migration_cb: "$HD_LIAO_MIGRATION_CB_NAME$"
 hd_liao_migration_war_victory_desc_attacker: "あなたは蜀の地にある[defender.GetShortUINamePossessive]のすべての称号を奪取する。蜀の地以外の領地はすべて放棄される。"
 hd_liao_migration_war_victory_desc: "蜀の地にある[defender.GetShortUINamePossessive]のすべての称号を奪取する。蜀の地以外の領地はすべて放棄される。"
 hd_liao_migration_war_warning_desc: "\n\n#X 獠人の入蜀は1回のゲームにつき一度きりの機会である。#!"

 game_concept_hd_liao_migration_casus_belli: "$HD_LIAO_MIGRATION_CB_NAME$開戦事由"
 game_concept_hd_liao_migration: "$HD_LIAO_MIGRATION_CB_NAME$"
 game_concept_hd_liao_migration_casus_belli_desc: "1回のゲームにつき一度しか使用できない強力な[casus_belli|E]で、蜀の腹心部と巴西の全領土を征服目標とする。\n\n勝利すると、獠帥は蜀の地へ遷都し、新首都は獠人の文化に変わり、以後周辺の伯爵領も次第に獠化していく。蜀の地以外の封臣と領地はすべて放棄され、現地の軍閥に委ねられる。"

 hd_liao_migration_effect.tt.new_capital: "蜀の地で開発度が最も高い直轄伯爵領へ遷都する"
 hd_liao_migration_effect.tt.capital_culture: "新首都のある[county|E]が$liaoren$文化に変わる"
 hd_liao_migration_effect.tt.destroy_other_kingdoms: "[primary_title|E]以外に保有する他の[kingdoms|E]はすべて破棄される"
 hd_liao_migration_effect.tt.non_liao_vassals: "蜀の地以外にいる$liaoren$以外の[vassals|E]は[independent|E]となる"
 hd_liao_migration_effect.tt.liao_vassals: "蜀の地以外にいる$liaoren$の[vassals|E]は、蜀の地で新たに得た称号の中から[titles|E]を分け与えられる"
 hd_liao_migration_effect.tt.former_territories: "蜀の地以外の故地は現地の軍閥に引き渡される"
 hd_liao_migration_effect.tt.settlement_story: "以後毎年、近隣の[county|E]が一つ$liaoren$文化に変わる可能性がある"

 hd_liao_horde_title_name: "獠部"
 hd_liao_horde_title_adj: "獠"
 hd_liao_conquer_army_name: "入蜀獠兵"
 hd_liao_hold_army_name: "獠部留守兵"

 hd_foreign_settlement_county_modifier: "異民族雑居"
 hd_foreign_settlement_county_modifier_desc: "新たに移り住んだ異民族の部衆が元からの住民と一所に雑居しており、互いになじむには時間がかかる。"
