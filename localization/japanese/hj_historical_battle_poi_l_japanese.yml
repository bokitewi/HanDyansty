l_japanese:
 HJ_BattlePoIHistoricalNameChangShao: "長勺の戦い"
 HJ_BattlePoIHistoricalDescChangShao: "#emp 勝者：魯\n敗者：斉\n年代：魯の荘公十年#!\n#weak 魯軍は兵を動かさず斉軍の到来時の鋭気を避け、斉軍が三度太鼓を打ち終えて士気が衰え尽きるのを待って、ようやく太鼓を打って反撃し、寡兵をもって大軍を破った。\n\n#italic 「夫れ戦は、勇気なり。一鼓して気を作し、再びして衰え、三たびして竭く」#!――『春秋左氏伝』#!"
 HJ_BattlePoIHistoricalNameChengPu: "城濮の戦い"
 HJ_BattlePoIHistoricalDescChengPu: "#emp 勝者：晋\n敗者：楚\n年代：魯の僖公二十八年#!\n#weak 晋の文公は亡命中に楚王と交わした約束を忘れず、両軍が相対するや三舎を退いて楚軍を深く誘い込んだ。その後、晋軍は諸軍を整え、楚軍の両翼を分けて撃ち、楚軍を大いに破った。晋はこれにより中原の覇者となった。\n\n#italic 「元戎十乗、以て先んじて行を啓く」#!――『詩経・小雅・六月』#!"
 HJ_BattlePoIHistoricalNameYanLing: "鄢陵の戦い"
 HJ_BattlePoIHistoricalDescYanLing: "#emp 勝者：晋\n敗者：楚\n年代：魯の成公十六年#!\n#weak 晋と楚が再び覇を争った。晋軍は楚軍の中軍が手薄であると見抜き、兵力を集中して突撃した。楚の共王は矢を受けて目を傷つけ、楚軍は夜のうちに逃げ去った。\n\n#italic 「赳赳たる武夫は、公侯の干城」#!――『詩経・周南・兎罝』#!"
 HJ_BattlePoIHistoricalNameGuiLing: "桂陵の戦い"
 HJ_BattlePoIHistoricalDescGuiLing: "#emp 勝者：斉\n敗者：魏\n年代：魏の恵王十七年～十八年#!\n#weak 魏軍が趙の都・邯鄲を包囲すると、孫臏は邯鄲を正面から救おうとはせず、魏の都・大梁へ直行した。魏軍が自国を救うため引き返すと、斉軍は桂陵でこれを迎え撃ち、魏軍を大いに破った。世の人はこれを「囲魏救趙」と呼んだ。\n\n#italic 「彼の四牡に駕す、四牡騤騤たり。君子の依る所、小人の腓う所」#!――『詩経・小雅・采薇』#!"
 HJ_BattlePoIHistoricalNameYiQue: "伊闕の戦い"
 HJ_BattlePoIHistoricalDescYiQue: "#emp 勝者：秦\n敗者：韓・魏の軍\n年代：秦の昭王十四年#!\n#weak 白起は実を避けて虚を撃ち、まず弱い韓軍を破り、次いで軍を返して魏軍を挟撃した。韓魏の軍はたちまち潰走し、斬首は二十四万に及んだ。\n\n#italic 「呉戈を操りて犀甲を被り、車は轂を錯えて短兵接す」#!――屈原『九歌・国殤』#!"
 HJ_BattlePoIHistoricalNameChangPing: "長平の戦い"
 HJ_BattlePoIHistoricalDescChangPing: "#emp 勝者：秦\n敗者：趙\n年代：秦の昭王四十七年#!\n#weak 秦と趙は三年にわたり対峙した。秦軍は偽って敗走して敵を誘い出し、趙軍の糧道を断って長平に包囲した。趙兵は食を断たれること四十六日、ついに秦に降り、穴埋めにされた者は四十余万に上った。\n\n#italic 「城南に戦い、郭北に死す、野に死して葬られず烏食らうべし」#!――漢楽府『戦城南』#!"
 HJ_BattlePoIHistoricalNameZui: "蕞の戦い"
 HJ_BattlePoIHistoricalDescZui: "#emp 勝者：秦\n敗者：趙・楚・魏・燕・韓の五国の軍\n年代：秦王政六年#!\n#weak 五国は合従して秦を攻め、大軍は蕞の地まで深く侵入したが、諸侯がそれぞれ異心を抱き進退がそろわなかったため、ついに兵を退いた。以後、山東の諸侯は二度と合従して秦に抗する力を持たなかった。\n\n#italic 「鼓を撃つこと其れ鏜たり、踊躍して兵を用う」#!――『詩経・邶風・撃鼓』#!"
 HJ_BattlePoIHistoricalNameJuLu: "鉅鹿の戦い"
 HJ_BattlePoIHistoricalDescJuLu: "#emp 勝者：楚軍および諸侯の軍\n敗者：秦軍\n年代：秦の二世皇帝三年#!\n#weak 項羽は兵を率いて河を渡ると、船を沈め釜を破り、宿舎を焼き払い、三日分の糧食だけを携えて必死の覚悟を示した。秦軍と九度戦って鉅鹿の包囲を解くと、諸侯の将たちは轅門に入って拝謁する際、皆膝で進み、仰ぎ見る者は一人もいなかった。\n\n#italic 「誠に既に勇にして又以て武、終に剛強にして凌ぐべからず」#!――屈原『九歌・国殤』#!"
 HJ_BattlePoIHistoricalNamePengCheng: "彭城の戦い"
 HJ_BattlePoIHistoricalDescPengCheng: "#emp 勝者：西楚\n敗者：漢王および諸侯の軍\n年代：漢の二年#!\n#weak 漢王は項羽が北の斉を攻めている隙に、諸侯の兵を率いて彭城に攻め入り、連日酒宴を開いた。項羽は自ら精鋭の騎兵三万を率いて急ぎ引き返し、早朝に攻撃をかけた。漢軍は大いに潰え、死者は十余万、睢水はそのために流れを止めた。\n\n#italic 「力は山を抜き気は世を蓋う」#!――項羽『垓下の歌』#!"
 HJ_BattlePoIHistoricalNameJingXing: "井陘の戦い"
 HJ_BattlePoIHistoricalDescJingXing: "#emp 勝者：漢軍\n敗者：趙軍\n年代：漢の三年#!\n#weak 韓信は川を背にして陣を布き、兵士に退路をなくして皆を死戦させた。さらにあらかじめ軽騎兵を趙の陣営に潜入させ、趙の旗を抜いて漢の赤い旗を立てさせた。趙軍は大いに乱れ、漢軍は前後から挟撃して趙軍を大破した。\n\n#italic 「出でて入らず往きて反らず、平原忽として路超遠なり」#!――屈原『九歌・国殤』#!"
 HJ_BattlePoIHistoricalNameGaiXia: "垓下の戦い"
 HJ_BattlePoIHistoricalDescGaiXia: "#emp 勝者：漢王および諸侯の軍\n敗者：西楚\n年代：漢の五年#!\n#weak 漢軍は楚軍を幾重にも包囲し、夜には四方からみな楚の歌を歌わせたため、楚軍の士気は離散した。項羽は包囲を破って南へ逃れ、烏江に至って自刎し、楚漢の争いはここに終わった。\n\n#italic 「時利あらず騅逝かず、騅の逝かざるを奈何すべき！」#!――項羽『垓下の歌』#!"
 HJ_BattlePoIHistoricalNameBaiDeng: "白登の囲み"
 HJ_BattlePoIHistoricalDescBaiDeng: "#emp 優勢側：匈奴\n包囲された側：漢軍\n年代：高皇帝七年#!\n#weak 高皇帝は軽兵で匈奴を追撃したが、冒頓単于の精鋭騎兵に白登山で七日間包囲され、のちに陳平の計を用いてようやく包囲を解かれた。以後、漢は匈奴と和親し、北の辺境を安んじた。\n\n#italic 「平城の下も亦た誠に苦し、七日食らわず、弩を彀る能わず」#!――漢初の民謡#!"
 HJ_BattlePoIHistoricalNameHeXi: "河西の戦い"
 HJ_BattlePoIHistoricalDescHeXi: "#emp 勝者：漢軍\n敗者：匈奴の渾邪王・休屠王の部\n年代：孝武皇帝の元狩二年#!\n#weak 驃騎将軍霍去病は一年のうちに二度河西に出撃し、焉支山を越えて祁連山深くまで進み、匈奴の渾邪・休屠などの諸部を大いに破った。渾邪王は部衆を率いて漢に降り、朝廷はこうして河西に郡県を開いた。\n\n#italic 「匈奴未だ滅びず、以て家を為す無きなり」#!――驃騎将軍霍去病の言#!"
 HJ_BattlePoIHistoricalNamePanYu: "番禺の戦い"
 HJ_BattlePoIHistoricalDescPanYu: "#emp 勝者：漢軍\n敗者：南越\n年代：孝武皇帝の元鼎六年#!\n#weak 伏波将軍路博徳と楼船将軍楊僕は道を分けて南下し、合流して番禺を包囲した。南越の都城は陥落し、嶺南はこれよりことごとく漢の郡県となった。\n\n#italic 「南に喬木有り、休むべからず。漢に游女有り、求むべからず」#!――『詩経・周南・漢広』#!"
 HJ_BattlePoIHistoricalNameWangXian: "王険城の戦い"
 HJ_BattlePoIHistoricalDescWangXian: "#emp 勝者：漢軍\n敗者：朝鮮王右渠\n年代：孝武皇帝の元封三年#!\n#weak 漢軍は水陸から並進したが、王険城を長く囲んでも落とせなかった。城中の大臣が内変を起こし、朝鮮王右渠を殺して降伏したため、漢はその故地に郡県を設置した。\n\n#italic 「江漢湯湯たり、武夫洸洸たり。四方を経営し、成るを王に告ぐ」#!――『詩経・大雅・江漢』#!"
 HJ_BattlePoIHistoricalNameDaYuan: "大宛の戦い"
 HJ_BattlePoIHistoricalDescDaYuan: "#emp 勝者：漢軍\n敗者：大宛\n年代：孝武皇帝の太初元年～三年#!\n#weak 弐師将軍李広利は二度にわたり大宛に遠征し、二度目には大軍を率いてその都城を包囲し、城中の水源を断った。大宛の貴人たちは王を殺して降伏を請い、良馬を献じた。\n\n#italic 「天馬徠たる、西極より、万里を経て有徳に帰す」#!――孝武皇帝『西極天馬の歌』#!"
 HJ_BattlePoIHistoricalNameLunTai: "輪台の戦い"
 HJ_BattlePoIHistoricalDescLunTai: "#emp 勝者：漢軍\n敗者：輪台\n年代：孝武皇帝の太初三年#!\n#weak 第二次大宛遠征の途上、輪台は城門を閉ざして漢軍への補給を拒んだ。弐師将軍はこれを数日攻めて城を屠った。沿道の諸国はこれに震え上がり、こぞって城門を開いて補給に応じた。\n\n#italic 「昔我往きしとき、黍稷方に華さく。今我来たるとき、雨雪塗に載つ」#!――『詩経・小雅・出車』#!"
 HJ_BattlePoIHistoricalNameJuShi: "車師の戦い"
 HJ_BattlePoIHistoricalDescJuShi: "#emp 勝者：漢軍および城郭諸国の兵\n敗者：車師\n年代：孝宣皇帝の地節年間#!\n#weak 鄭吉は渠犁で屯田する兵士を率い、さらに西域の城郭諸国の兵を徴発して車師を攻めた。車師王は降伏を請い、漢はこれにより天山南北の道を開いた。\n\n#italic 「豈に衣無しと曰わんや、子と袍を同じうせん。王于に師を興さば、我が戈矛を修めん」#!――『詩経・秦風・無衣』#!"
 HJ_BattlePoIHistoricalNameZhiZhi: "郅支城の戦い"
 HJ_BattlePoIHistoricalDescZhiZhi: "#emp 勝者：漢軍および西域諸国の兵\n敗者：郅支単于\n年代：孝元皇帝の建昭三年#!\n#weak 西域副校尉陳湯は都護甘延寿とともに詔を偽って兵を発し、康居領内の郅支城を遠征して襲った。城を破って郅支単于を斬り、その首を都へ送った。西域における郅支の勢力はここに滅びた。\n\n#italic 「明らかに強漢を犯す者は、遠しと雖も必ず誅す！」#!――陳湯の上疏#!"
 HJ_BattlePoIHistoricalNameKunYang: "昆陽の戦い"
 HJ_BattlePoIHistoricalDescKunYang: "#emp 勝者：漢軍\n敗者：王莽軍\n年代：更始元年#!\n#weak 光武皇帝は決死の士三千を率いて王莽の大軍の中核に突撃し、昆陽の守備軍も同時に城を出て挟撃した。莽軍の主帥王尋は戦死し、百万と号した大軍はたちまち潰散した。\n\n#italic 「殷商の旅、其の会すること林の如し。牧野に矢う、維れ予れ侯れ興らん」#!――『詩経・大雅・大明』#!"
 HJ_BattlePoIHistoricalNameLangBo: "浪泊の戦い"
 HJ_BattlePoIHistoricalDescLangBo: "#emp 勝者：漢軍\n敗者：徴側・徴弐\n年代：光武皇帝の建武十八年#!\n#weak 伏波将軍馬援は軍を率いて浪泊に至り、徴側・徴弐の主力を撃破し、続いて残党を追討した。交趾の乱はこうして平定された。\n\n#italic 「男児は要ず当に辺野に死し、馬革を以て屍を裹みて還り葬らるべきのみ」#!――伏波将軍馬援の言#!"
 HJ_BattlePoIHistoricalNameYiWuLu: "伊吾盧の戦い"
 HJ_BattlePoIHistoricalDescYiWuLu: "#emp 勝者：漢軍\n敗者：北匈奴\n年代：孝明皇帝の永平十六年#!\n#weak 奉車都尉竇固と副将耿忠は酒泉塞を出て北匈奴の呼衍王を撃破し、伊吾盧の地を奪取して宜禾都尉を置き屯田させた。漢はこれによって西域へ復帰した。\n\n#italic 「大丈夫は它の志略無くんば、猶お当に傅介子・張騫に效いて功を異域に立つべし」#!――班超の言#!"
 HJ_BattlePoIHistoricalNameTianShan: "天山の戦い"
 HJ_BattlePoIHistoricalDescTianShan: "#emp 勝者：漢軍\n敗者：北匈奴の呼衍王の部\n年代：孝明皇帝の永平十六年#!\n#weak 竇固は軍を率いて酒泉を出て、天山で北匈奴の呼衍王の部を撃破し、蒲類海まで追撃して、漢が西域へ復帰する道を開いた。\n\n#italic 「顕允なる方叔、玁狁を征伐し、蛮荊来たり威る」#!――『詩経・小雅・采芑』#!"
 HJ_BattlePoIHistoricalNameShuLe: "疏勒城の防衛戦"
 HJ_BattlePoIHistoricalDescShuLe: "#emp 守備側：戊己校尉耿恭\n攻撃側：北匈奴および車師の兵\n年代：孝明皇帝の永平十八年#!\n#weak 耿恭は孤軍を率いて疏勒城を堅守した。匈奴が谷川の水を断ったため、城中で井戸を十五丈掘っても水は出なかったが、耿恭が衣を整えて井戸に再拝すると、泉水がたちまち湧き出したという。包囲は年をまたぎ、ついに援軍が到着したが、彼に従って東の玉門へ帰り着いたのはわずか十三人であった。\n\n#italic 「聞く、昔弐師将軍は佩刀を抜きて山を刺し、飛泉涌き出づと。今漢の徳は神明なり、豈に窮まること有らんや！」#!――耿恭の言#!"
