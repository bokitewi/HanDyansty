l_japanese:
 hd_hj_qingzhou_army:0 "青州軍"
 hd_hj_qingzhou_reclaim_county_modifier:0 "青州軍屯"
 hd_hj_qingzhou_reclaim_county_modifier_desc:0 "降伏した黄巾の部衆が軍屯に編成され、耕しながら戦い、郷野は日増しに豊かになっている。"
 hd_huangjin.1.t:0 "轅門にて降を受く"
 hd_huangjin.1.desc_fail:0 "太鼓はすでに鳴り終えたのに、後列はまだ乱れ動いている。あなたは轅門の前に立ち、一本の令旗がこれほど多くの者に伝わらないのを見て、強兵を得られるかもしれぬというささやかな期待も冷めていった。\n\n近づいてよく見れば、武器は欠け、隊伍もはっきりせず、多くはただ人の群れについて食べ物を求めているにすぎない。渠帥が慌てて弁明しようとしたが、あなたは手を挙げて黙らせた。自分の部衆すら数えきれぬのに、陣前に出たとき、誰に命令を聞かせるというのか。\n\n彼はうなだれ、周りの者も誰一人声を上げなかった。あなたは閲兵をひとまず打ち切った。軍に要るのは使える兵だが、陣営の外にいるこの大勢の口は、なお食べ物を待っている。明日はまず糧のことを議し、この招撫で結局何を残せるかを見極めよう。"
 hd_huangjin.1.desc_success:0 "太鼓の号令が何度か伝わって、降衆はようやく次第に整列した。あなたは隊列に沿って歩いていった。自分の立つべき場所をまだ探している者もいれば、号令を聞くやすぐに足を止める者もいる。\n\n「後ろの者たちは、使える」あなたは左右に指し示し、前列が乱れているからといって全員をひとまとめに追い払うことはしなかった。武器は与えればよく、隊伍は整えればよい。乱世にあって、なお号令に従い、刀槍を振るえる者を、軽々しく手放すべきではない。\n\nあなたが名を記し始めたのを見て、渠帥は急いでいつ陣営に入れるのかと尋ねた。あなたはすぐには兵の定員を約束せず、ただ食わせねばならぬ者が何人いるのかを問うた。その言葉が終わるや、あたりは整列していた時よりもなお静まり返った。彼らが最も恐れていたのは、結局この問いに続きがないことだったのだ。"
 hd_huangjin.1.desc_crit:0 "轅門の外には降衆がびっしりと並んでいた。あなたはあと何度か怒鳴らねばならぬと思っていたが、意外にも太鼓が鳴るや、前後の各隊が順に整列し、旗の後尾の者までぴたりと動かなかった。\n\n隊列に沿って歩き、肩と背のがっしりした兵士の何人かの前であなたは足を止めた。手にした武器はまちまちだが、令旗を見つめる目には少しの迷いもない。「以前からこのように陣を組んでいたのか？」とあなたが問うと、渠帥は急いで答え、その口ぶりにはようやくいくらかの自信がにじんでいた。\n\nこの者たちをただの流浪の飢民として放ってしまえば、それこそあなたの見誤りというものだ。あなたは振り返って使える者たちを記録させ、さらに陣中に糧がどれほど残っているかを尋ねた。彼らに自分のために戦わせるなら、まず帰順した後に進むべき道があることをわからせなければならない。"
 hd_huangjin.1.a:0 "閲兵は終わった。明日、糧を議す。"
 hd_huangjin.2.t:0 "耕しつつ戦う"
 hd_huangjin.2.desc_fail:0 "昨日の太鼓の音はまだ耳に残っているが、今日広げた糧の帳簿は、まずあなたに冷や水を浴びせた。報告された人数の分だけ糧を出さねばならない。まだ開墾されていない田は、今は一食の足しにもならない。\n\n書吏は三度目の計算に入り、声はますます小さくなった。あなたが書き誤りの一か所を指摘して直させると、不足はかえってはっきりした。陣営の外ではまた援助を求める者が来て、左右は顔を見合わせ、誰も先に出て答えようとしない。\n\nあなたは帳簿を押さえ、困難をありのままに記させた。明日はなお諸渠帥と会わねばならないが、今日のこの糧の勘定だけはどうにもごまかしようがない。人を招くときの「引き取ろう」の一言は容易いが、本当に留めておくとなると、これほどまでに骨が折れるものなのか。"
 hd_huangjin.2.desc_success:0 "今日はもう弓や刀を試さず、まず食べ物の勘定をする。陣営に従う老弱と壮丁にはそれぞれ名簿があり、あなたは一項ずつ尋ねていった。最も聞きたくないのは、すべての人数を兵の定員として報告する者だ。\n\n何度か照合を重ね、ようやく落ち着かせる方策がまとまった。戦える者は隊伍に編入し、それ以外の者は別に落ち着かせる。手元の蓄えと今後の耕作も、どうにかつなげられる。あなたは書吏に写し直させ、空欄があっても構わないから、好い言葉を一つもらうために存在しない糧を書き加えるなと命じた。\n\n章程を机に戻し、あなたはもう一度目を通した。勘定が合っても、うまく運ぶとは限らない。明日はなお諸渠帥と直に話し合い、あなたが何を与えるつもりか、そしてあなたの号令に帰する以上何を守らねばならないかを、彼らに知らせなければならない。"
 hd_huangjin.2.desc_crit:0 "昨日の閲兵の後、あなたはすでに人数と田畝を別々に調べて報告させていた。今日何通かの帳簿を広げてみると、以前はそれぞれ勝手なことを言っていた数字が、意外にも一項ずつ合致した。\n\n戦える者は兵となり、それ以外の者は落ち着かせて耕作させ、当面の援助にも実行できる道筋が見つかった。最後まで聞き終えると、あなたは自ら筆を執って二か所を照合し、ずっと張り詰めていた気持ちがようやく落ち着いた。人を集めて糧を食わせるだけなら、どれほど大きな府庫でも、終わりのない降伏の受け入れを養うことはできない。\n\n「このとおりに処理せよ」あなたは帳簿を返した。畑にはまだ収穫はない。だが少なくとも、もう空言で飢民をあしらう必要はない。明日諸渠帥に会うとき、ようやく頼りになる話ができる。"
 hd_huangjin.2.a:0 "帳簿は定まった。明日、渠帥と約を結ぶ。"
 hd_huangjin.3.t:0 "血を啜りて誓う"
 hd_huangjin.3.desc_fail:0 "話が長く命に従うことに及ぶと、諸渠帥の返答は鈍くなった。地面を見つめる者もいれば、ひとまず留まりたいとだけ言う者もいる。先ほどまで応じていた者も、口を固く閉ざしてしまった。\n\nあなたは条件をもう一度述べたが、忍耐はもはや最初ほどではなかった。「軍に入れば、もはや各々勝手に命令を出すことは許されぬ」その言葉が出ると、帳内はいっそう静まり返った。散会するまで、頼りになる言葉を一言でもくれる者は一人もいなかった。\n\nあなたは空いた座席を見つめ、この二日間の軍籍と安置の帳簿を机の前に取り戻した。何人を留められるかは、この二日の成果の中から探すしかない。使える壮丁にも糧の手当てにも目処が立たなければ、この招撫は本当に手ぶらで終わることになる。"
 hd_huangjin.3.desc_success:0 "諸渠帥が帳に入ると、あなたはまずこの二日間の調べの結果を話し、それから軍中の規律を一つずつはっきり説明した。終わりのほうまで聞いて、ついにこらえきれずに尋ねる者がいた。「もし不当な扱いがあれば、また申し立てに来てもよろしいのですか？」\n\nあなたは彼を一瞥し、最後まで言わせた。問うてくるだけ、うつむいて唯々諾々としているよりはましだ。何度かのやり取りの後、皆はついに約を結ぶことを承知し、先ほどまでこわばっていた肩や背もいくらか緩んだ。\n\n手元の水を手に取って、あなたはようやく話し疲れて喉が渇いていることに気づいた。人心はひとまず落ち着いた。次は使える者たちと糧の手当てを突き合わせ、最終的な兵の定員を定めねばならない。帳の外にはすでに命令を待つ者がいる。今日はもう、彼らを疑念を抱えたまま散らせる必要はない。"
 hd_huangjin.3.desc_crit:0 "諸渠帥は約束どおり帳に入ったが、はじめは皆かしこまって座っていた。あなたは誓いを急かさず、まず編伍・安置・軍中の規律を一つずつ説明し、どこかわからぬところはないかと尋ねた。\n\nついに顔を上げる者がおり、家族を落ち着かせてもらえるかと尋ねた。また別の者は、陣営に入った後は誰の号令に従うのかと尋ねた。言葉が増えるにつれ、先ほどまでの警戒は次第に解けていった。最後の一人が承諾すると、周りの者もそれに続いて身をかがめ、その声は来た時よりもずっと揃っていた。\n\nあなたは彼らを立たせ、心中ではすでにこの二日間に残された名簿と糧の数を量り始めていた。心から帰順してくれるのはよいことだ。だが実際に何人に武器を執らせられるかは、どれほどの壮丁を選び出せ、どれほどの人々を落ち着かせられるかにかかっている。今日の話は、ともかく無駄にはならなかった。"
 hd_huangjin.3.a:0 "兵の定員を定め、降衆を収め整える。"
 hd_huangjin.3.reward_none:0 "降衆は結局散ってしまい、今回あなたは何も得られなかった。"
 hd_huangjin.3.closed_crit:0 "あなたの招撫は当を得ており、青州の降衆の心はあなたに収められた。他の者がこの件に手を出すのはもはや難しい。"
 hd_huangjin.3.closed_full:0 "青州の降衆はことごとくあなたの麾下に帰した。以後、天下にこれを招撫できる者は二人といない。"
 hd_huangjin.3.closed_third:0 "青州黄巾は幾度も招撫を経て人心がすでに離散した。以後、招安の名でその衆を収められる者はいない。"
 hd_huangjin.10.t:0 "済北にて降を受く"
 hd_huangjin.10.desc:0 "青州黄巾は東から押し寄せ、百万と号し、済水を渡るや四方で略奪を働き、通り過ぎた郡県は門を閉ざして自衛した。あなたは兵を率いてこれを迎え撃ち、昼夜陣営を離れず、時に伏兵を設け、時に後を追い、春先から冬に入るまで戦い続けた。\n\n彼らは数こそ多いが、家族と輜重を引きずっており、進むほどに飢えていった。あなたは彼らの行く手を断ち、決戦を急がず、少しずつ包囲を締めていった。ついにある渠帥が陣営の前に人を遣わし、降伏したい、ただ老弱に生きる道を与えてほしいと申し出た。\n\n使者が去った後、あなたは陣営の塁に登って眺めた。済北の原野は一面降衆の天幕で埋め尽くされ、見渡す限り果てがない。壮健な者は選び出して一軍に編成し、残りの者には田畑を分け与え、耕しながら守らせる。この兵を鍛え上げることができれば、今後天下を争うにあたって、一つの確かな基盤が加わることになる。"
 hd_huangjin.10.a:0 "その精鋭を収め、青州兵と号す。"
