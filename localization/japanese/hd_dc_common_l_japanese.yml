l_japanese:
 hd_dc_com.0004.t: "印を押す前に"
 hd_dc_com.0004.desc: "文書は[hd_dc_proposer.GetTitledFirstName]と[hd_dc_recipient.GetTitledFirstName]の間を行き来し、今あなたの机の上に届いた。使者は急かすことなく、まだ印の押されていない箇所をあなたの方へ向けただけだった。\n\n[SCOPE.GetFlagName('hd_dc_proposal_terms')]\n\n言葉はいくらでも周到に書ける。印を押した後、誰が先に約束を実行に移すか――それこそが皆が本当に見ているものだ。"
 hd_dc_com.0004.a: "これに印を押す。"
 hd_dc_com.0004.a.tt: "印を押した後は、互いに約定に従って行動せねばならない："
 hd_dc_com.0004.b: "もう一段の保証を加えるなら、応じよう。"
 hd_dc_com.0004.b.tt: "以下の条件で返書し、相手に再考を求める：\n[SCOPE.GetFlagName('hd_dc_counter_terms')]"
 hd_dc_com.0004.c: "この約定は認められない。"
 hd_dc_signed_terms_opinion: "同じ約定に署名した"
 hd_dc_counter_terms_opinion: "追加の保証を求めた"
 hd_dc_rejected_terms_opinion: "提示された条件を拒否した"
