 WJ_mufu_empty_short:0 "空席。本府の僚属を転任させるか、別途辟召できる"
 WJ_mufu_history_detail:0 "#high 開府置属#!\n開府とは単に官署をもう一つ設けることではなく、府主が僚属を配置し、曹を分けて政務を処理する地位に関わるものである。漢代の三公府には長史および諸曹の掾属が置かれ、将軍府にも長史・司馬などの官が置かれて、府務と軍政を分掌した。\n\n府中の各曹にはそれぞれ所管があり、選挙を掌る者、奏議・文書・簿籍を扱う者などがいた。職掌と定員は官府や時代によって異なり、歴代不変の一つの定制とみなすべきではない。\n\n漢末以来、辟召はまた士人を招き入れる重要な道となった。僚佐は府主のそばで議事・策画・行政に参与し、府主と故吏の間には知遇と報恩の関係が続くことも多かった。\n\n参考史料：『後漢書・百官志一』。"
 WJ_mufu_history_intro:0 "#high 開府と幕府#!\n漢代の公府と将軍府には僚属が置かれ、曹を分けて事務を処理した。長史は府務を総理し、司馬は軍政に参与し、掾属は文書や選挙などを補佐した。漢末は軍政に事多く、府主は士人を辟召し、幕府は議事・参謀・人材招致の場を兼ねた。府主と僚佐の間にも、これによって任用と報恩の結びつきが生まれた。"

