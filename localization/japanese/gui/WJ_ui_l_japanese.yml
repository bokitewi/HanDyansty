 WJ_kaoke_step_tt:0 "1回押すごとに10点の加点または減点を立案する。確定するまで課簿は変わらない。一括での増減合計は100点を超えられない。同一人物への加点と減点は相殺できる。任期の交代、資格喪失、王朝交代があった場合は、閉じてから立案し直すこと。"
 WJ_kaoke_table_help:0 "この表には本朝で考課を受けるすべての地方官が収録されている。▲▼で1回ごとに10点の増減を立案でき、ページ送りや絞り込みでも立案済みの調整は失われない。一括の合計は100点を超えられず、確定後にまとめて課簿へ記録される。点数を調整できるのは天子と現任の尚書令のみで、1人につき5年に1度だけである。"
