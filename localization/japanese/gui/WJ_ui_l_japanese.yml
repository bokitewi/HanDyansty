 WJ_mt_zhongwai_help:0 "都督中外が空席の時は、天子が自ら全国の調兵権を握る。地方都督は引き続き本区を調度でき、その他の者は閲覧のみ可能である。\n\n中外を総督するには、天子の摂政であり、かつ侍中・大将軍・尚書令・大司馬の四席のうち少なくとも三席を、あなた自身、あなたの門生、府中の僚属、または同族の者が占めていなければならない（一人の兼任は席数で数える）。本朝に置かれるのは一人のみである。\n\n「総督中外を詔に請う」決断によって詔を奉じ、黄鉞を仮される。四席は任命時にのみ確認され、摂政の地位を失えば両者ともに回収される。"
 WJ_zw_takeover_notice:0 "#warning 都督中外諸軍事が接管中#!\n都督区は閲覧できる。設置・撤廃、区割り、節の授与、改名と派遣は現任の中外が処理する。中外が地位を失うと元の権限に戻る。"

