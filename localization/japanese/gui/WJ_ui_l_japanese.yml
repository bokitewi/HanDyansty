 WJ_kaoke_risk_help:0 "改変が多いほど、噂が漏れやすくなる。各人の増減点数の合計が10点以内ならリスクはないが、以後10点ごとにリスクが1割増え、最大9割となる。結果は確定した時点で判明する。"
