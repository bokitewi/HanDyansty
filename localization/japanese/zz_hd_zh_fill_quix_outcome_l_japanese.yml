 quix_murder_outcome.4302.scheme_unknown:0 "\n\n少なくとも兵たちを逃がしたことには、一片の情けがあったといえよう。彼らは戦いの際に[target.GetTitledFirstName]を救いに来たのだと言い張り、それが状況を混乱させて、あなたの関与を推し量る者はいなかった。"
