 quix_murder_outcome.4304.failure:0 "[target.GetTitledFirstName]を暗殺する計画は失敗した。刺客たちは厳しい寒さもかまわず強引に事を進めようとしたが、藁の荷車には火がつかず、建物に直接突入しようとしたところで見つかり、結局徒労に終わった。"
 quix_murder_outcome.4304.scheme_owner_known:0 "さらに悪いことに、この愚か者どもは数歩も逃げないうちに捕まった！彼らはあなたも関わっていると白状し、あなたの役割は漏れてしまった！\n\n"
 quix_murder_outcome.4304.scheme_unknown:0 "\n\n幸い、彼らは自分たちの怪しい振る舞いを言い繕い、すばやく逃れることができた。少なくとも、この件とあなたとの関わりはまだ知られていない。"
