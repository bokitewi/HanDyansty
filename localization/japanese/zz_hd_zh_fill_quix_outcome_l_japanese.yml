 quix_murder_outcome.4303.scheme_owner_known:0 "\n\nその囚人はそもそも存在しなかったことが判明した！あなたの愚かな刺客たちはなんと衛兵と話し込み、しかもその話は地下牢ではなく兵舎を指していたため、今や全員捕らえられてしまった！"
