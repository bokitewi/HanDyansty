l_japanese:
 quix_murder_outcome.1201.a:0 "泳げる者は、世にもまれである。"
 quix_murder_outcome.1201.b:0 "この策はいささかやりすぎだ。"
 quix_murder_outcome.1201.desc:0 "あなたの腹心[acting_agent.GetTitledFirstName]は、幼い[target.GetTitledFirstName]が湖畔の別邸に泊まることを探り当てた。見張りのいない隙に、[acting_agent.GetSheHe]が水辺へ誘い込めば、ただの足を滑らせての溺死に見せかけられる。"
 quix_murder_outcome.1201.no_acting_agent:0 "あなたの共謀者は、幼い[target.GetTitledFirstName]が湖畔の別邸に泊まることを探り当てた。誰も気にとめていない時を見計らって子供を水へ誘い込めば、この件はただの足を滑らせての溺死に見えるだろう。"
 quix_murder_outcome.1201.t:0 "湖畔の水練"
 quix_murder_outcome.1202.a:0 "オデュッセウスが喜ぶなら、私も喜んで。"
 quix_murder_outcome.1202.b:0 "これは本意ではない。"
 quix_murder_outcome.1202.desc:0 "あなたの腹心[acting_agent.GetTitledFirstName]は精巧な木馬を用意し、ひそかに[target.GetTitledFirstName]へ贈ろうとしている。木馬の腹には毒蜘蛛が潜み、子供が遊ぶ時に仕掛けが作動して、死因はただの不運な虫刺されに見えるだろう。"
 quix_murder_outcome.1202.no_acting_agent:0 "あなたの共謀者は、精巧なトロイの木馬をひそかに[target.GetTitledFirstName]へ贈ろうとしている。木馬の腹には毒蜘蛛が潜み、子供が遊ぶ時に仕掛けが作動して、死因はただの不運な虫刺されに見えるだろう。"
 quix_murder_outcome.1202.t:0 "トロイの木馬"
 quix_murder_outcome.1203.a:0 "これには策略が必要だ。"
 quix_murder_outcome.1203.b:0 "この策は気に入らぬ。"
 quix_murder_outcome.1203.desc:0 "あなたの腹心[acting_agent.GetTitledFirstName]は[target.GetTitledFirstName]の筆跡を手に入れ、それを真似て家出の書き置きを書くことができる。この無邪気な子供を騙して連れ出しさえすれば、周りは[target.GetSheHe]が自ら出ていったと思うだけだろう。"
 quix_murder_outcome.1203.no_acting_agent:0 "あなたの共謀者は[target.GetTitledFirstName]の筆跡を手に入れ、それを真似て家出の書き置きを書くことができる。この無邪気な子供を騙して連れ出しさえすれば、周りは[target.GetSheHe]が自ら出ていったと思うだけだろう。"
 quix_murder_outcome.1203.t:0 "偽りの家出書"
 quix_murder_outcome.1204.a:0 "ここは幼子に最もふさわしい。"
 quix_murder_outcome.1204.b:0 "この策はあまりに浅はかだ。"
 quix_murder_outcome.1204.desc:0 "あなたの腹心[acting_agent.GetTitledFirstName]は、事後の逃亡を手助けすると約束して[target.GetTitledFirstName]の衛兵の一人を買収した。衛兵は誰も見ていない隙に、赤子を堀に投げ込むだけでよい。"
 quix_murder_outcome.1204.no_acting_agent:0 "あなたの共謀者は、事後の逃亡を手助けすると約束して[target.GetTitledFirstName]のもとの乳母の一人を買収した。乳母は誰も気にとめていない隙に、赤子を堀に投げ込むだけでよい。"
 quix_murder_outcome.1204.t:0 "産湯ごと赤子を流す"
 quix_murder_outcome.1205.a:0 "恋とは、最も危険なものだ。"
 quix_murder_outcome.1205.b:0 "そうではない。"
 quix_murder_outcome.1205.desc:0 "あなたの腹心[acting_agent.GetTitledFirstName]は、幼い[target.GetFirstNameNoTooltip]に想い人がいることを探り当てた。その恋人になりすまし、真夜中の密会に誘い出せばよい。[target.GetHerHim]を待っているのは想い人ではなく、あなたの手の者である。"
 quix_murder_outcome.1205.no_acting_agent:0 "あなたの共謀者は、幼い[target.GetFirstNameNoTooltip]に想い人がいることを探り当てた。あなたはその恋人になりすまし、真夜中の密会に誘い出せばよい。[target.GetHerHim]を待っているのは想い人ではなく、あなたの手の者である。"
 quix_murder_outcome.1205.t:0 "真夜中の約束"
 quix_murder_outcome.1206.a:0 "この件は覚えておこう。"
 quix_murder_outcome.1206.b:0 "もう少し考えてみよう。"
 quix_murder_outcome.1206.desc:0 "あなたの腹心[acting_agent.GetTitledFirstName]は、夜に子供部屋へ忍び込み、こっそり[target.GetTitledFirstName]を連れ去る算段をしている。この子を宮城から遠く離れた場所へ送ってしまえば、その後は誰にも見つけられまい。"
 quix_murder_outcome.1206.no_acting_agent:0 "あなたの共謀者は、夜に子供部屋へ忍び込み、こっそり[target.GetTitledFirstName]を連れ去る算段をしている。この子を宮城から遠く離れた場所へ送ってしまえば、その後は誰にも見つけられまい。"
 quix_murder_outcome.1206.t:0 "夜半の子供さらい"
 quix_murder_outcome.1301.a:0 "食い扶持が一人減るのだ、[prison_owner.GetFirstNameNoTooltip]も気にはすまい。"
 quix_murder_outcome.1301.b:0 "まだ時機ではない。待て。"
 quix_murder_outcome.1301.desc:0 "[target.GetTitledFirstName]は[prison_owner.GetTitledFirstNamePossessive]の地下牢に囚われており、あなたはすでに食事を運ぶ者を買収している。毎日少しずつ毒を混ぜて徐々に進めれば、[target.GetHerHis]の死は獄中でかかった重い病と誤認されるだろう。"
 quix_murder_outcome.1301.t:0 "地下牢の瘴気"
 quix_murder_outcome.1302.a:0 "よかろう。ただし山賊を使い、雇い主が誰かは告げるな。"
 quix_murder_outcome.1302.b:0 "この策は危うすぎる。実行できぬ。"
 quix_murder_outcome.1302.desc:0 "[target.GetTitledFirstName]は軟禁されており、身辺には常に見張りがいる。あなたの手の者が[target.GetHerHim]を救出に来たふりをして、混乱に乗じて致命の罠を仕掛けることができる。これは[target.GetHerHim]に近づける数少ない手段である。"
 quix_murder_outcome.1302.t:0 "偽りの救出"
 quix_murder_outcome.1303.a:0 "何人失うことになる？"
 quix_murder_outcome.1303.b:0 "これが良策といえるか？"
 quix_murder_outcome.1303.desc:0 "部外者が[prison_owner.GetTitledFirstNamePossessive]の地下牢に忍び込むのは難しいが、壁の土台の裂け目から伝言を通すことはできる。あなたはある囚人の家族の面倒を見ると約束し、その見返りに、その囚人は同じ房にいる[target.GetTitledFirstName]を始末すると申し出た。"
 quix_murder_outcome.1303.t:0 "獄中の取引"
 quix_murder_outcome.1304.a:0 "我が心は燃えるようだ！"
 quix_murder_outcome.1304.b:0 "この策は良くないかもしれぬ。"
 quix_murder_outcome.1304.desc:0 "[target.GetTitledFirstName]は軟禁中で、警備は厳重である。あなたの手の者は火油を用意し、裏口に火を放って[target.GetHerHim]を正門から逃げ出させようとしている。屋根に潜んだ弓手が、その時を狙って矢を放つ手筈だ。"
 quix_murder_outcome.1304.t:0 "焼き討ちの計"
 quix_murder_outcome.2201.a:0 "面倒事が一つ減った。"
 quix_murder_outcome.2201.a.discovered:0 "泳ぎの術がいかに大切か、これで分かったであろう！"
 quix_murder_outcome.2201.opening:0 "[target.GetTitledFirstName]は溺死した！\n\n[target.GetHerHis|U]の水中での最後のもがきはついに静まり、亡骸は湖底に沈んで、翌日になってようやく発見された。"
 quix_murder_outcome.2201.scheme_owner_known:0 "\n\nしかし、一部始終を目撃した者がいたようだ！あなたの刺客は捕らえられ、この陰謀は今や皆の知るところとなり、あなたも無関係ではいられない。"
 quix_murder_outcome.2201.scheme_unknown:0 "\n\nあらゆる兆候が痛ましい事故を示している。少なくとも、あなたを疑う者はいない。"
 quix_murder_outcome.2201.t:0 "水練の失敗"
 quix_murder_outcome.2202.a:0 "この手は決して廃れぬ。"
 quix_murder_outcome.2202.a.discovered:0 "私にもこの蜘蛛は御しきれぬ！"
 quix_murder_outcome.2202.opening:0 "[target.GetTitledFirstName]は息絶えた！\n\n「ギリシアの小蜘蛛」と名づけたあなたの毒蜘蛛が隠れ場所から這い出し、その毒が[target.GetHerHis]の小さな鼓動を止めた。"
 quix_murder_outcome.2202.scheme_owner_known:0 "\n\n残念ながら、この策はあなたが思ったほど万全ではなかった。毒蜘蛛を隠した木馬が見つかるや、運んだ刺客は取り押さえられた！今や皆が、この件にあなたが関わっていることを知っている。"
 quix_murder_outcome.2202.scheme_unknown:0 "\n\n子供の死の背後にある陰湿な意図に、誰も気づいていないようだ。"
 quix_murder_outcome.2202.t:0 "木馬を信ずるなかれ"
 quix_murder_outcome.2203.a:0 "世の中は険しいものだ。"
 quix_murder_outcome.2203.a.discovered:0 "あの子もじきに家へ戻ってくるだろう！"
 quix_murder_outcome.2203.opening:0 "愚かな[target.GetTitledFirstName]は殺された！\n\n[target.GetTitledFirstName]は一人で歩いているところを待ち伏せされた。刺客は亡骸を遠くへ運び、人目につかぬ場所に埋めた。そして子供の筆跡を真似て、皆を恨み、ただ一人になりたいと記した書き置きを残した。"
 quix_murder_outcome.2203.scheme_owner_known:0 "\n\nだが悪い知らせがある。その書き置きは、なんと間抜けな刺客自身の印で封がされていたのだ！この稚拙な策は見破られ、あなたの関与は誰もが知るところとなった。"
 quix_murder_outcome.2203.scheme_unknown:0 "この年頃の子供が家出をするのはよくあること、誰が疑おうか！\n\n"
 quix_murder_outcome.2203.t:0 "去りて帰らず"
 quix_murder_outcome.2204.a:0 "私に言わせれば、これは慈悲深い行いだ。"
 quix_murder_outcome.2204.a.discovered:0 "馬鹿げている！自分でしくじっておきながら、今さら責任を押しつけるのか！"
 quix_murder_outcome.2204.opening:0 "幼い[target.GetTitledFirstName]はもうこの世にいない！\n\n無力な子供は窓から投げ落とされ、淀んだ堀の水の中で死んだ。なんとも残酷な運命である。"
 quix_murder_outcome.2204.scheme_owner_known:0 "\n\n不幸にも、数十人の証人が、乳母が窓から赤子を投げ落とすのを目撃していた！乳母はすぐに捕らえられ、尋問されるやたちまち崩れ落ちた！この件におけるあなたの役割はすべて露見した。"
 quix_murder_outcome.2204.scheme_unknown:0 "\n\n乳母はすでに逃げおおせた。この件は、ただの残酷な悲劇にしか見えない。"
 quix_murder_outcome.2204.t:0 "産湯ごと赤子を流す"
 quix_murder_outcome.2205.a:0 "恋と戦に、決まった道理などない。"
 quix_murder_outcome.2205.a.discovered:0 "これはなんとも都合が悪い。"
 quix_murder_outcome.2205.opening:0 "あなたの刺客は、幼い[target.GetTitledFirstName]を首尾よく始末した。\n\n[target.GetTitledFirstName]が約束の場所に着いて間もなく、刺客が暗がりから躍り出て、大きな石で打ち殺した。"
 quix_murder_outcome.2205.scheme_owner_known:0 "\n\nしかし、子供の断末魔の叫びが衛兵を呼び寄せ、刺客はその場で捕らえられた！この惨事の中で、あなたの素性は露見してしまった。"
 quix_murder_outcome.2205.scheme_unknown:0 "\n\n亡骸を始末した後、刺客は夜陰に紛れてひっそりと立ち去り、誰にも知られることはなかった。"
 quix_murder_outcome.2205.t:0 "夜の逢瀬の刺殺"
 quix_murder_outcome.2206.a:0 "天の道は残酷なものだ。"
 quix_murder_outcome.2206.a.discovered:0 "私が？馬鹿げているにも程がある！"
 quix_murder_outcome.2206.opening:0 "幼い[target.GetTitledFirstName]はもう屋敷にいない。\n\n計画は滞りなく進み、子供は田舎の深い山の頂へ連れて行かれ、そこに置き去りにされて天命に委ねられた。"
 quix_murder_outcome.2206.scheme_owner_known:0 "\n\n不幸にも、刺客の犯行は手がかりを残しており、それはまっすぐあなたを指していた！"
 quix_murder_outcome.2206.scheme_unknown:0 "皆の目には、あの子がただ忽然と消えたように映っている。\n\n"
 quix_murder_outcome.2206.t:0 "山頂の置き去り"
 quix_murder_outcome.2301.a:0 "さて、今日の務めを続けよう。"
 quix_murder_outcome.2301.a.discovered:0 "皆がなぜこれほど不機嫌なのか、私にはまったく分からぬ。"
 quix_murder_outcome.2301.heh:0 "正直なところ、この苦しみがもう少し長く続いてほしかったくらいだ。"
 quix_murder_outcome.2301.no_awareness_1:0 "\n\n表向きには、地下の悪しき気に当てられた犠牲者がまた一人増えたにすぎない。"
 quix_murder_outcome.2301.opening_1:0 "[target.GetTitledFirstName]は[prison_owner.GetTitledFirstName]の地下牢で突然倒れ、恐ろしい急病にかかったかのようだった。わずか数日のうちに、[target.GetHerHim]の命は次第に消えていった。"
 quix_murder_outcome.2301.owner_is_known_1:0 "\n\nだが悪い知らせがある。地下牢の看守はすぐさま収賄を疑われ、追及に耐えきれず崩れ落ちた！あなたの謀略は[prison_owner.GetTitledFirstName]によって突き止められ、暴かれた。"
 quix_murder_outcome.2301.t:0 "地下牢の瘴気"
 quix_murder_outcome.2302.a:0 "救出！そうだ、まさにその通り！"
 quix_murder_outcome.2302.a.discovered:0 "お前たちは私ではなく、乱民どもを信じるのか？"
 quix_murder_outcome.2302.no_awareness_1:0 "\n\nこの策は成功したようだ。誰もこれを暗殺とは考えず、むしろ途中でしくじった勇敢な救出劇とみなしている！言うまでもなく、あなたが[target.GetHerHim]を救おうとしたことを疑う者はいない。"
 quix_murder_outcome.2302.opening_1:0 "[target.GetTitledFirstName]は殺された！救出を装った者たちが屋敷に突入して見張りを制圧し、[target.GetFirstNameNoTooltip]を捕まえて[target.GetHerHim]を馬に乗せ、逃げ去ろうとした。逃げおおせた後になって、刺客は矢で[target.GetTitledFirstName]を射抜き、亡骸を道端に捨てて、作戦の失敗に見せかけた。"
 quix_murder_outcome.2302.owner_is_known_1:0 "\n\nこの策はあまりに鮮やかだった。惜しむらくは、雇われ者が一晩中この件を自慢して回ったことだ！不幸にも、この秘密は今や誰もが知るところとなった。"
 quix_murder_outcome.2302.t:0 "偽りの救出"
 quix_murder_outcome.2303.a:0 "これでようやく一息つける。"
 quix_murder_outcome.2303.a.discovered:0 "そのような告発は、まったく根拠のないものだ！"
 quix_murder_outcome.2303.heh:0 "自分の喉がゴロゴロと鳴る音さえ聞こえる！耳の中で楽の音が奏でられているかのようだ。\n\n"
 quix_murder_outcome.2303.no_awareness_1:0 "\n\nあの囚人は穴の中のネズミのように獄に閉じ込められている。これがあなたと少しでも関わりがあるとは、誰も信じないだろう。"
 quix_murder_outcome.2303.opening_1:0 "[target.GetTitledFirstName]は息絶えた！別の囚人に絞め殺されたのだ。恥知らずな者には、同じく恥知らずな最期がふさわしい！"
 quix_murder_outcome.2303.owner_is_known_1:0 "\n\nだが良い知らせばかりではない。首尾よく事を成したものの、話は誰かに盗み聞きされていたらしく、あなたの刺客も捕らえられた！彼らはあなたこそがすべての黒幕だと名指しした。"
 quix_murder_outcome.2303.t:0 "獄中の取引"
 quix_murder_outcome.2304.a:0 "よく燃えた、焼き尽くしたぞ！"
 quix_murder_outcome.2304.a.discovered:0 "お前たちはあの人殺しどもを信じるのか？"
 quix_murder_outcome.2304.no_awareness_1:0 "\n\n炎はたちまち手がつけられなくなり、亡骸はすっかり焼き尽くされた！これが刺客の仕業だと気づいた者はいないようだ……"
 quix_murder_outcome.2304.opening_1:0 "[target.GetTitledFirstName]が深夜に猛火の中から逃げ出した時、[target.GetSheHe]は待ち伏せていた弓手に射殺された。数本の矢が急所に命中し、[target.GetSheHe]は階段の上に倒れ、[target.GetHerHis]の衣の襟は血に染まった。"
 quix_murder_outcome.2304.owner_is_known_1:0 "\n\nだが事は計画通りには運ばなかった。弓手はすぐに捕らえられ、拷問の末に自白して、あなたを巻き込んだ！"
 quix_murder_outcome.2304.t:0 "焼き討ちの計"
 quix_murder_outcome.4201.a:0 "水に押さえつけねばならぬ！"
 quix_murder_outcome.4201.a.discovered:0 "私はただ、子供を水難から守ろうとしただけだ！"
 quix_murder_outcome.4201.agent.scheme_owner_known:0 "[acting_agent.GetFirstNameNoTooltip]は罪悪感に押しつぶされ、あなたの計画をすべて白状してしまった！"
 quix_murder_outcome.4201.agent.scheme_unknown:0 "だが[acting_agent.GetFirstNameNoTooltip]は、もう水練の手ほどきはできそうにない。幸い、これが陰謀だと見抜いた者はいない。"
 quix_murder_outcome.4201.failure_declaration_1:0 "幼い[target.GetTitledFirstName]が息を吹き返した！どうやらあの小僧、今や魚のように泳げるらしい！"
 quix_murder_outcome.4201.failure_declaration_2:0 "忌々しい！あの憎たらしい子供、[target.GetTitledFirstName]が我らの計画を逃れた！刺客は仕留めたと思っていたが、数分後、その子は湖の反対側から這い上がってきたのだ。"
 quix_murder_outcome.4201.failure_declaration_3:0 "[target.GetTitledFirstName]は確かに水に落ちたが、溺れ方が足りなかった！通りがかりの者が子供を引き上げ、すでに息のない体をなんとか蘇生させたため、この策は失敗に終わった！"
 quix_murder_outcome.4201.noagent.scheme_owner_known:0 "だがあなたの刺客は罪悪感に押しつぶされ、なんとあなたの計画を裏切った！"
 quix_murder_outcome.4201.noagent.scheme_unknown:0 "だが幸いにも、この失敗した陰謀はまだ誰にも知られていない。"
 quix_murder_outcome.4201.t:0 "湖畔の水練"
 quix_murder_outcome.4202.a:0 "蜘蛛は好きだが、私には近づけるな。"
 quix_murder_outcome.4202.a.discovered:0 "すべて嘘だ！こんな愚かな策を、私が許すはずがない。"
 quix_murder_outcome.4202.agent.scheme_owner_known:0 "[acting_agent.GetFirstNameNoTooltip]は罪悪感に押しつぶされ、あなたの計画をすべて白状してしまった！"
 quix_murder_outcome.4202.agent.scheme_unknown:0 "幸い、これが陰謀だと見抜いた者はいない。少なくとも、あなたの陰謀だとは。"
 quix_murder_outcome.4202.failure_declaration_1:0 "[target.GetTitledFirstName]を暗殺する計画は失敗した！あの子は贈り物を受け取ることを嫌い、なんと下げさせてしまったのだ！"
 quix_murder_outcome.4202.failure_declaration_2:0 "毒蜘蛛を詰め込んだ木馬は、幼い[target.GetTitledFirstName]を殺せなかったようだ。仕掛けが作動しなかったのか、毒蜘蛛が目を覚まして役目を果たさなかったのか、誰にも分からない。"
