l_japanese:
 hd_qin_lun_name:0 "秦論"
 hd_qin_lun.0001.t:0 "異域からの客"
 hd_qin_lun.0001.desc:0 "鼻が高く目の窪んだ一人の異邦人が、人の紹介を経て、あなたの堂下に目通りを求めてきた。彼は秦論と名乗り、万里の彼方の大秦国から交趾を経て海を渡ってきたという。言葉の端々から、天文・算術・異域の典籍に通じていることがうかがえる。\n\n堂上の者たちはこのような容貌を見たことがなく、口々にひそひそと噂し合った。だが彼は落ち着き払って礼をし、生涯の学びを賢主に捧げたい、ただ身を置く場所を求めるのみだと述べた。"
 hd_qin_lun.0001.a:0 "この者は役に立つ。傍らに留めよう。"
 hd_qin_lun.0001.b:0 "路銀を贈り、送り出す。"
