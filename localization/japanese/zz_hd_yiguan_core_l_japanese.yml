 # 衣冠南渡·核心框架（docs/衣冠南渡_重做设计.md §5.12：局势/组/阶段/参数/修正集/催化剂/修正/好感/游戏规则/霸权头衔）

 # ---------- 游戏规则 ----------
 rule_hd_yiguan_rule:0 "衣冠南渡"
 setting_hd_yiguan_rule_on:0 "#high 开启#!"
 setting_hd_yiguan_rule_on_desc:0 "北方的胡人强权攻陷洛阳、长安之后，天下将进入衣冠南渡的局势：士族南迁，北伐、讨胡与起义此起彼伏，局势在逃亡、冲突、停滞之间往复，直至中原光复、胡汉合流或衣冠沦丧。"
 setting_hd_yiguan_rule_off:0 "#high 关闭#!"
 setting_hd_yiguan_rule_off_desc:0 "衣冠南渡不会发生。"

 # ---------- 局势 ----------
 situation_type_hd_yiguan_nandu:0 "衣冠南渡"
 situation_type_hd_yiguan_nandu_desc:0 "胡骑南下，两京倾覆。北方的衣冠士族扶老携幼，渡淮过江，奔向江左；留在故土的汉人或在胡人治下忍辱求存，或据坞自守，或聚众举义。\n\n南方的君主收容流人、侨立州郡、整军北伐；北方的胡人君主在弹压与怀柔之间摇摆，有人推行汉制，也有人强令胡化。天下时而奔逃，时而交兵，时而相持，终将以#V 光复中原#!、#V 胡汉合流#!或#V 衣冠沦丧#!收场。"
 situation_hd_yiguan_nandu:0 "$situation_type_hd_yiguan_nandu$"
 situation_hd_yiguan_nandu_desc:0 "[SITUATION.GetType.GetDesc]"

 hd_yiguan_nandu_sub_region_hd_yiguan_core:0 "中原与江左"
 hd_yiguan_nandu_sub_region_hd_yiguan_core_desc:0 "北方八州（司、冀、幽、并、青、兖、徐、豫）与荆、扬二州"

 # ---------- 参与者组 ----------
 hd_yiguan_nandu_participant_group_hd_yiguan_grp_sinicized:0 "汉化政权"
 hd_yiguan_nandu_participant_group_hd_yiguan_grp_sinicized_desc:0 "王朝已完成汉化改制、都城在北方八州或荆扬、主头衔为公爵级以上的独立[rulers|E]。汉化政权算作华夏，其治下的汉人不算沦陷"
 hd_yiguan_nandu_participant_group_hd_yiguan_grp_hu:0 "胡人政权"
 hd_yiguan_nandu_participant_group_hd_yiguan_grp_hu_desc:0 "非华夏传承、尚未汉化、都城在北方八州或荆扬、主头衔为公爵级以上的独立[rulers|E]"
 hd_yiguan_nandu_participant_group_hd_yiguan_grp_south:0 "南方政权"
 hd_yiguan_nandu_participant_group_hd_yiguan_grp_south_desc:0 "华夏传承、都城在荆扬二州、主头衔为公爵级以上的独立[rulers|E]"
 hd_yiguan_nandu_participant_group_hd_yiguan_grp_north_han:0 "北方汉人"
 hd_yiguan_nandu_participant_group_hd_yiguan_grp_north_han_desc:0 "华夏传承、都城仍在北方八州、主头衔为公爵级以上的独立[rulers|E]"
 hd_yiguan_nandu_participant_group_hd_yiguan_grp_occupied:0 "沦陷区汉人"
 hd_yiguan_nandu_participant_group_hd_yiguan_grp_occupied_desc:0 "胡人宗主治下、都城在北方八州、伯爵级以上的华夏[vassals|E]，以及宗主为胡人、宅邸在北方的无地世族"
 hd_yiguan_nandu_hd_yiguan_grp_sinicized:0 "衣冠南渡：#weak 汉化政权#!"
 hd_yiguan_nandu_hd_yiguan_grp_hu:0 "衣冠南渡：#weak 胡人政权#!"
 hd_yiguan_nandu_hd_yiguan_grp_south:0 "衣冠南渡：#weak 南方政权#!"
 hd_yiguan_nandu_hd_yiguan_grp_north_han:0 "衣冠南渡：#weak 北方汉人#!"
 hd_yiguan_nandu_hd_yiguan_grp_occupied:0 "衣冠南渡：#weak 沦陷区汉人#!"

 # ---------- 阶段 ----------
 hd_yiguan_phase_taowang:0 "逃亡"
 hd_yiguan_phase_taowang_desc_short:0 "胡骑所至，城邑为墟，北方士民成群结队地向南奔逃。"
 hd_yiguan_phase_taowang_desc:0 "$hd_yiguan_phase_taowang_desc_short$\n\n胡人兵锋正盛，汉人政权节节败退，世家大族纷纷举族南迁。逃亡日久，人心思战，#V 时间推移#!本身便会把天下推向冲突。\n\n沦陷区起义、胡人兴兵攻汉、胡化改县等变故一多，局势将转入#V 冲突#!；胡汉议和、汉化改制、侨置安民渐有成效，局势将转入#V 停滞#!。\n\n此阶段内，胡人政权若已据有中原，可宣布#V 衣冠沦丧#!。"
 hd_yiguan_nandu_hd_yiguan_phase_taowang_situation_phase:0 "[SITUATION_PHASE_TYPE.GetName]"
 hd_yiguan_nandu_hd_yiguan_phase_taowang_situation_phase_desc:0 "$hd_yiguan_phase_taowang_desc$"
 hd_yiguan_phase_chongtu:0 "冲突"
 hd_yiguan_phase_chongtu_desc_short:0 "南北交兵，北伐、讨胡与起义此起彼伏。"
 hd_yiguan_phase_chongtu_desc:0 "$hd_yiguan_phase_chongtu_desc_short$\n\n南方政权可以挥师北伐，北方汉人可以讨胡收复，流亡江左的侨姓也能起兵北还。兵连祸结既久，师老兵疲，#V 时间推移#!会把天下推向停滞。\n\n两京再陷、汉人政权屡遭败绩，局势将退回#V 逃亡#!；议和与安置渐多，局势将转入#V 停滞#!。\n\n此阶段内，南方政权或北方汉人若已克复中原，可宣布#V 光复中原#!。"
 hd_yiguan_nandu_hd_yiguan_phase_chongtu_situation_phase:0 "[SITUATION_PHASE_TYPE.GetName]"
 hd_yiguan_nandu_hd_yiguan_phase_chongtu_situation_phase_desc:0 "$hd_yiguan_phase_chongtu_desc$"
 hd_yiguan_phase_tingzhi:0 "停滞"
 hd_yiguan_phase_tingzhi_desc_short:0 "南北隔江相持，胡汉杂处，各自经营。"
 hd_yiguan_phase_tingzhi_desc:0 "$hd_yiguan_phase_tingzhi_desc_short$\n\n战事渐息，南方安置流人、清理户籍，北方的胡人君主则可趁此推行汉化或胡化。停滞期#V 不会随时间推移而改变#!，只有兵事与变故才能打破僵局。\n\n胡人再破汉人城池，局势将退回#V 逃亡#!；胡人兴兵攻汉、沦陷区起义或推行胡化，局势将转入#V 冲突#!。\n\n此阶段内，汉化政权若已合据中原，可宣布#V 胡汉合流#!。"
 hd_yiguan_nandu_hd_yiguan_phase_tingzhi_situation_phase:0 "[SITUATION_PHASE_TYPE.GetName]"
 hd_yiguan_nandu_hd_yiguan_phase_tingzhi_situation_phase_desc:0 "$hd_yiguan_phase_tingzhi_desc$"

