l_japanese:
 han_artifact_sunzi_bingfa_name:0 "『孫子兵法』善本"
 han_artifact_sunzi_bingfa_description:0 "孫武が伝えた兵法十三篇は、言葉は簡潔ながら意味は深く、春秋以来、将たる者で誦習しない者はない。この善本は竹簡が整い、絹糸で編まれ、久しく秘閣に蔵されて、字跡はなお新しい。"
 han_artifact_liutao_name:0 "『六韜』秘本"
 han_artifact_liutao_description:0 "太公望の著と伝えられ、文・武・龍・虎・豹・犬の六韜をもって治国用兵の道を論じる。兵家は代々これを書き写し、太公の遺法として奉じてきた。陣に臨んで機を決するにも、すべて手本とすることができる。"
 han_artifact_sanlue_name:0 "『三略』秘本"
 han_artifact_sanlue_description:0 "黄石公が圯上で張良に書を授けたと伝わるが、その授けたものがこの三略である。書中には諸家の言が雑多に採られ、もっぱら将略と治国の要を論じる。その来歴はすべてを考証しきれないが、その法は確かに用いることができる。"
 han_artifact_simafa_name:0 "『司馬法』古本"
 han_artifact_simafa_description:0 "司馬穰苴が伝えた古の兵法。篇章はすでに半ば以上が失われたが、なお三代の軍礼の古義を存している。将たる者がこれを読めば、古人が仁を本とし、義をもって軍を行った道を知ることができる。"
 han_artifact_wuzi_name:0 "『呉子』古本"
 han_artifact_wuzi_description:0 "呉起と魏の文侯が兵を論じた言葉で、内には文徳を修め、外には武備を整えることを説く。将の選抜、兵の訓練、軍法の厳正は、多くこの書を範とする。"
 han_artifact_sunbin_bingfa_name:0 "『孫臏兵法』残巻"
 han_artifact_sunbin_bingfa_description:0 "孫臏の遺著は久しく散逸していたが、この残巻は古い塚の旧蔵から再び日の目を見た。断簡残編の間に、魏を囲んで趙を救い、竈を減らして敵を誘った奇謀がなおかすかに読み取れる。ただ編み紐は朽ち、簡上の墨跡は日に日に薄れ、このまま整理しなければ、いずれ塵と化してしまうだろう。"
 han_artifact_weiliaozi_name:0 "『尉繚子』校本"
 han_artifact_weiliaozi_description:0 "尉繚が兵・刑・政令を論じた書。官撰の竹簡の上には、先人が朱筆で文字を校定した跡があり、校記は整然としている。軍を治める者がこれを読めば、令すれば行われ禁ずれば止み、法を明らかにし令を審らかにすることの要を知ることができる。"
 han_artifact_mengde_xinshu_name:0 "『孟徳新書』"
 han_artifact_mengde_xinshu_description:0 "曹操が諸家の兵法を集め、生涯の用兵で得たところを参酌して撰した書。竹簡の上にはしばしば朱筆の書き込みが見られ、一字一字がすべて戦陣から生まれたものである。"
 han_artifact_bingfa_24_name:0 "『兵法二十四篇』"
 han_artifact_bingfa_24_description:0 "諸葛亮が生涯の用兵の要をまとめ、二十四篇に著したもの。行軍・布陣・治軍の法から、八陣の図、木牛流馬の制に至るまで、すべて篇中に散見される。"
 han_artifact_qingnang_shu_name:0 "『青嚢書』"
 han_artifact_qingnang_shu_description:0 "華佗の生涯の医術がすべてここに記され、腹を割き腸を洗う術や麻沸散の法もことごとく巻中にある。世に伝わる写本はごくわずかで、これを得た者は神医から直接授かったも同然であり、他の者には救えぬ人をも生かすことができる。"
 han_artifact_shanghan_zabing_lun_name:0 "『傷寒雑病論』"
 han_artifact_shanghan_zabing_lun_description:0 "張仲景は一族の多くが疫病で死んだことを痛み、古の教えを熱心に求め、多くの処方を広く集めてこの書を成した。六経を弁じ、病機を分析し、処方と証候がすべて備わる。医家にとってこの一巻を得ることは、千金を得るに勝る。"
 han_artifact_taiping_qingling_dao_name:0 "『太平清領道』"
 han_artifact_taiping_qingling_dao_description:0 "于吉が伝えた道書で、符水で病を治し、人に叩頭して過ちを省みることを教える。江東の民はこれを神のごとく奉じるが、官府は妖妄にして衆を惑わすものと斥ける。世を救う書か衆を惑わす書かは、すべて誰の手に落ちるか次第である。"
 han_artifact_dunjia_tianshu_name:0 "『遁甲天書』"
 han_artifact_dunjia_tianshu_description:0 "方士が秘伝する奇書で、遁甲の術数や暦算占験の法を記す。帛の巻物は古び、山中の隠者から授けられたものと伝わる。これを習えば天機の一端を窺えるが、身を滅ぼす災いを招くこともある。"
 han_artifact_taiping_yaoshu_name:0 "『太平要術』"
 han_artifact_taiping_yaoshu_description:0 "南華老仙が張角に授けたと伝わる天書三巻で、風を呼び雨を降らせ、符水で病を癒やすことができる。張角はこれをもって十余年道を伝え、青・徐・幽・冀・荊・揚・兗・豫の八州の人々で、こぞって従わない者はなかった。"
 han_artifact_shanhaijing_name:0 "『山海経』異本"
 han_artifact_shanhaijing_description:0 "山川草木や異獣神祇を記した古書。この異本は秘閣所蔵のものと互いに異同がある。校書者はこれによって地理を考訂でき、好事家はこれによって奇聞を語り尽くせる。太史も方士も、ともに宝として重んじる。"
 han_artifact_xishu_map_name:0 "西蜀地形図"
 han_artifact_xishu_map_description:0 "益州の官府が描いた蜀中の山川の険易の図で、帛の上に朱と墨で道路や関隘が記されている。これを得た者は平地を行くがごとく蜀に入れるが、失った者はたとえ雄兵を擁していても、蜀道を望んで嘆くほかない。帛図は年を経て、墨の色が次第に薄れている。"
 han_artifact_imperial_seal_name:0 "伝国の玉璽"
 han_artifact_imperial_seal_description:0 "秦の始皇帝が作らせた伝国の璽で、和氏の璧を彫って作られたと伝わり、「受命於天、既寿永昌」の八字が刻まれている。秦が滅び漢が興ると璽は漢室に帰し、歴代の天子は神明のごとくこれを奉じた。この璽を執る者はあたかも天命の帰するところのようであり、璽がその所を失えば、天下がこぞってこれを追い求める。"
 han_artifact_wang_mang_head_name:0 "王莽の首"
 han_artifact_wang_mang_head_description:0 "漢を簒奪した王莽の首級。かつて漢兵が長安に攻め入ると、莽は漸台で死に、首級は宛の市に送られ、民は争ってこれに物を投げつけ、その舌を切って食らう者さえいた。その後首級は武庫に納められ、孔子の屐、高祖の斬蛇剣と並んで累代の宝とされ、簒逆者の末路を示している。"
 han_artifact_confucius_shoes_name:0 "孔子の屐"
 han_artifact_confucius_shoes_description:0 "孔子が履いたと伝わる木の屐。聖人の遺徳であり、儒生はこれを見て粛然としない者はない。この屐は武庫に納められ、高祖の斬蛇剣、王莽の首と共に累代の宝とされている。"
 han_artifact_zhou_ding_name:0 "周鼎"
 han_artifact_zhou_ding_description:0 "周室の宗廟の重器で、饕餮や蟠螭の文様の間に銘文がかすかに見え、数百年を経てもその威儀は変わらない。鼎は徳に在りて鼎に在らず――古来、鼎の軽重を問う者は、みな臣たらざる輩であった。この鼎を得た者は宗廟が輝き、一族もまたその栄誉に浴する。"
 han_artifact_heshi_bi_name:0 "和氏の璧"
 han_artifact_heshi_bi_description:0 "卞和は荊山で璞を得て、三たび楚王に献じ、二度足を斬られて、ようやく璞の中の玉が剖き出された。秦王はかつて十五城と交換しようと願ったが、ついに藺相如が璧を完うして趙に帰した。世の人は皆、伝国の玉璽はこの璧を彫って作られたと言う。真偽は考証しがたいが、天下至宝の名は久しく変わらない。"
 han_artifact_four_spirits_mirror_name:0 "四霊文鏡"
 han_artifact_four_spirits_mirror_description:0 "鏡の背には青龍・白虎・朱雀・玄武の四霊の像が鋳られ、銘帯がこれを巡り、青銅が澄んだ光を放つ。時の人は、この鏡は精怪を照らし出し不祥を払うと言い、婚礼を挙げる家はとりわけ重い礼物とした。銅鏡は年月が経つと緑青が生じやすく、常に磨き拭う必要がある。"
 han_artifact_seismograph_name:0 "地動儀"
 han_artifact_seismograph_description:0 "陽嘉元年、太史令張衡は候風地動儀を鋳造した。その器は丸い胴が酒樽のようで、八匹の龍が珠をくわえ、蟾蜍がこれを受け、地が動けば龍の口が珠を吐いてその方位を知らせる。ある時一匹の龍が珠を吐いたが、京師では地震が感じられず、学者は皆その兆しのなさを怪しんだ。数日後に駅使が到着し、果たして隴西の地震を報じたので、人々はその妙に感服した。"
 han_artifact_zhinan_che_name:0 "指南車"
 han_artifact_zhinan_che_description:0 "車上の木の人形が腕を伸ばして南を指し、車がどの方向へ進もうと、山を巡り道を曲がろうと、その手は常に南を指す。黄帝が蚩尤の起こした大霧を破るためにこれを作ったと伝わり、歴代の名匠がたびたび模造を試みたが、成功した者はわずかである。仕掛けは精緻で、風雨による損傷を最も嫌う。"
 han_artifact_white_feather_fan_name:0 "白羽扇"
 han_artifact_white_feather_fan_description:0 "真っ白な羽根に竹や木を柄とした羽扇で、形は古風で素朴である。名士が清談し、謀臣が策をめぐらすとき、しばしばこの扇を手にゆっくりとあおぎ、悠然として動じない。あたかも千軍万馬がそのひとあおぎの間にあるかのようである。"
 han_artifact_shenshou_inkstone_name:0 "神獣硯"
 han_artifact_shenshou_inkstone_description:0 "獣の形をした石の硯で、彫刻は古拙、墨池は深く広く、硯面はきめ細かい。尚書台の郎官や文士はこれを用いて詔令を起草し典籍を校勘し、文房の珍品と見なして、名士の間で贈答される。"
 han_artifact_bianzhong_name:0 "編鐘"
 han_artifact_bianzhong_description:0 "木の架に吊り並べた一揃いの青銅の編鐘で、大小が順に並び、宮・商・角・徴・羽の音律に従って鋳られている。宗廟の祭祀にも宮廷の宴楽にも欠かせず、鐘の音が一たび響けば、礼楽はおのずと興る。乱世にはばらばらになって散逸しやすく、揃いのものはとりわけ得がたい。"
 han_artifact_tongque_name:0 "銅雀"
 han_artifact_tongque_description:0 "鄴城の銅雀台の上の銅雀で、頭をもたげ翼を振るい、今にも空へ飛び立たんとするかのようである。錆の色はまだらだが、その気象は雄渾である。曹操は漳水のほとりに台を築き、登って詩を詠み、天下の心を己に帰せしめんとする志を示した。"
 han_artifact_bronze_chariot_name:0 "銅馬車"
 han_artifact_bronze_chariot_description:0 "漢の車馬制度に則って鋳造された小型の銅の車馬で、車体・装飾・車輪・轅のいずれも規格にかなっている。公卿や列侯はこれを邸宅に飾って朝廷の儀制の尊さを示し、また巧みな工匠がこれを鋳て権貴に献じたり、主人とともに大墓に納められたりもする。"
 han_artifact_boshanlu_name:0 "錯金博山炉"
 han_artifact_boshanlu_description:0 "炉の蓋は海上の仙山の形に鋳られ、金象嵌で文様を施し、峰々が重なり合い、その間に煙の孔がひそかに散らばっている。香を焚くと、青い煙が山間から立ちのぼり、雲霧が峰々にたなびくかのように、部屋中に仙気が満ちるかのようである。宴や雅集では、この炉が最上品とされる。"
 han_artifact_changxin_lamp_name:0 "長信宮灯"
 han_artifact_changxin_lamp_description:0 "西京の長信宮に旧蔵されていた金鍍金の銅灯で、宮女がひざまずいて灯を捧げ持つ姿をしており、灯の煙はすべて袖の中に入って部屋に散らない。その工夫には感嘆させられる。旧宮に長年埃をかぶっていたが、塵を払えば、なお往時の宮廷の気配が見える。"
 han_artifact_crane_feather_fan_name:0 "鶴羽扇"
 han_artifact_crane_feather_fan_description:0 "灰白色の鶴の羽で作られた長い柄の羽扇で、白羽扇よりもいっそう引き締まって落ち着いて見え、帷幄に籌をめぐらす士でなければ釣り合わない。陣に臨んでゆっくりとあおげば、三軍に号令すること腕が指を使うがごとし。"
