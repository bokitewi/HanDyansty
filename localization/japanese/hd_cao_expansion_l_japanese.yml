l_japanese:
 hd_story_cao_expansion:0 "曹操：勢力拡大"
 hd_story_cao_expansion_desc:0 "反董卓連合はすでに解散した。曹操は一州ずつ進軍の目標を定め、各地の割拠勢力を順に従えていく。"
 HD_CAO_EXPANSION_STORY_STATUS:0 "曹操は一州を目標として兵を用いている。この州が平定されるか、州内に攻めるべき敵がいなくなれば、次の進路を議する。この方面の戦は、曹操自らが命を下して兵を起こさねばならない。"
 hd_cao_expansion.0001.t:0 "兵鋒の向かう所"
 hd_cao_expansion.0001.desc:0 "諸将が前の方面の軍務を報告し終えても、あなたは彼らを下がらせなかった。地図はまだ広げられたまま、兵糧の確認も済んでいる。ちょうどよい、次はどこにあなたの陣太鼓を先に聞かせるべきか議するとしよう。\n\n豫州、青州、徐州――名を口にするのはたやすいが、本当に奪うには大軍を一里一里進めねばならない。守備兵と糧道について問いただしていると、誰かがまた古い議論を繰り返し始めたので、手を挙げて制した。以前の命令がどこまで果たされたかは、胸の内で分かっていれば足りる。今日の議論をそれで埋める必要はない。\n\n三州のうち未だ定まらぬものがあれば、その要所を選んで先に攻める。すべて手中にあるならば、得たものを真にあなたの役に立てるべきだ。あなたは令箋を一枚指先につまみ、最後の軍情報告が終わるのを待った。"
 hd_cao_expansion.0001.a:0 "豫州へ兵を進める。"
 hd_cao_expansion.0001.b:0 "青州へ兵を進める。"
 hd_cao_expansion.0001.c:0 "徐州へ兵を進める。"
 hd_cao_expansion.0001.d:0 "三州はすでに定まった。領土を整える。"
 hd_cao_expansion.yuzhou_tt:0 "あなたは兵鋒を豫州に向けた。この方面の事が終われば、次の手を議する。"
 hd_cao_expansion.qingzhou_tt:0 "あなたは兵鋒を東の青州に向けた。この方面の事が終われば、次の手を議する。"
 hd_cao_expansion.xuzhou_tt:0 "あなたは兵鋒を徐州に転じた。この方面の事が終われば、次の手を議する。"
 hd_cao_expansion.finished_tt:0 "豫・青・徐の三州はことごとくあなたの版図に入った。あなたはもはや四方に征伐することをやめ、得た領土を整えることに転じた。"
 hd_cao_expansion_cb_victory_desc:0 "曹操は敵の領土をすべて呑み込む。相手が保有するすべての称号は曹操のものとなり、その配下の封臣はことごとく曹操に鞍替えする。"
 hd_cao_expansion_cb_white_peace_desc:0 "両者は兵を引き、それぞれ元の境界を守る。"
 hd_cao_expansion_cb_defeat_desc:0 "曹操の今回の進軍は成果なく終わり、それぞれ元の境界を守る。"
 hd_cao_expansion_cb_invalidated_desc:0 "この戦いは名分を失って取りやめとなり、それぞれ元の境界を守る。"
