 WJ_name_service_court_musician:0 "[GetCourtPositionType('court_musician_court_position').CalcTriggeredNameNoTooltip(SCOPE.sC('wj_name_court_musician_employer'))] "
 WJ_name_service_cupbearer:0 "[GetCourtPositionType('cupbearer_court_position').CalcTriggeredNameNoTooltip(SCOPE.sC('wj_name_cupbearer_employer'))] "
 WJ_name_service_bodyguard:0 "[GetCourtPositionType('bodyguard_court_position').CalcTriggeredNameNoTooltip(SCOPE.sC('wj_name_bodyguard_employer'))] "
 WJ_name_service_keeper_of_the_harem:0 "[GetCourtPositionType('keeper_of_the_harem_court_position').CalcTriggeredNameNoTooltip(SCOPE.sC('wj_name_keeper_of_the_harem_employer'))] "
 WJ_name_service_prefix:0 "[ROOT.Char.Custom('WJ_NameCourtService')]"
 # 内阁tooltip原生scope：councillor_liege是实际雇主。假定任职接口也支持空席。
 WJ_desc_councillor_chancellor: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_chancellor', SCOPE.sC('councillor_liege'))]は最高位の[minister|E]で外交を担い、通常[grand_secretariat_director|E]を兼ねる。\n\n[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_chancellor', SCOPE.sC('councillor_liege'))]は、#V [GetLawGroup('grand_secretariat_laws').GetName]#![law|E]に応じて[grand_secretariat_director|E]に指名されることがある。\n\n$WJ_desc_councillor_chancellor_actions$"
 WJ_desc_councillor_chancellor_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_chancellor', SCOPE.sC('councillor_liege'))]にできること：\n$BULLET$[GetDecision('favored_movement_consults_heaven_decision').GetName|V][decision|E]を使用する\n$BULLET$[GetDecision('tgp_minister_recruit_courtiers_decision').GetName|V][decision|E]で任意の種類の[courtier|E]を招く\n$BULLET$[GetGreatProjectType('minister_compel_religious_uniformity').GetName|V][great_project|E]を開始する\n$BULLET$より低い費用で特別な#V $influence_meritorious_career_interaction$#![interaction|E]の選択肢を使用する#!#!"
 WJ_desc_councillor_chancellor_local: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_chancellor', SCOPE.sC('councillor_liege'))]是負責[realm|E]内外的交際工作的[councillor|E]。"
 WJ_desc_councillor_steward: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_steward', SCOPE.sC('councillor_liege'))]是負責[taxation|E]的[minister|E]，在[treasury|E]事務上輔佐[son_of_heaven|E]。\n\n$WJ_desc_councillor_steward_actions$"
 WJ_desc_councillor_steward_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_steward', SCOPE.sC('councillor_liege'))]にできること：\n$BULLET$#V $celestial_request_treasury_interaction$#!を行う[vassals|E]を助ける\n$BULLET$[GetDecision('tgp_suggest_budget_change_decision').GetName|V][decision|E]を使用する\n$BULLET$[GetGreatProjectType('minister_project_conduct_census').GetName|V][great_project|E]を開始する\n$BULLET$#V $pay_treasury_debt_interaction$#![interaction|E]で[civilian_governors|E]の[treasury_debt|E]を清算すると、#V 「$catalyst_cleared_treasury_debt$」#![dynastic_cycle_catalyst|E]が発生する\n$BULLET$特別な#V $influence_meritorious_career_interaction$#![interaction|E]の選択肢を使用する#!#!"
 WJ_desc_councillor_steward_local: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_steward', SCOPE.sC('councillor_liege'))]是負責[domain|E]管理的[councillor|E]，例如[taxation|E]、[culture|E]和[development|E]事務。"
 WJ_desc_councillor_marshal: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_marshal', SCOPE.sC('councillor_liege'))]は部隊の軍政管理を担う[minister|E]である。配下の[governors|E]が軍事支援を必要とする時、[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_marshal', SCOPE.sC('councillor_liege'))]は武官を派遣して手を貸すことができる。\n\nこの朝臣は[commander|E]ではなく、軍を率いることはない。それは[minister_grand_marshal|E]の仕事である。\n\n#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_marshal', SCOPE.sC('councillor_liege'))]にできること：\n$BULLET$#V $celestial_request_military_aid_interaction$#!を行える[war|E]中の[vassals|E]に援助を送る\n$BULLET$[military_governors|E]に他の[governors|E]の[wars|E]へ参加するよう命じる#!#!\n\n$WJ_desc_councillor_marshal_actions$"
 WJ_desc_councillor_marshal_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_marshal', SCOPE.sC('councillor_liege'))]にできること：\n$BULLET$[war|E]中に#V $celestial_request_military_aid_interaction$#!を行う[vassals|E]に援軍を送る\n$BULLET$[military_governors|E]に他の[governors|E]の[wars|E]へ参加するよう命じる\n$BULLET$[GetGreatProjectType('minister_project_train_troops').GetName|V][great_project|E]を開始する\n$BULLET$#V $pay_treasury_debt_interaction$#![interaction|E]で[military_governors|E]の[treasury_debt|E]を清算し、#V 「$catalyst_cleared_treasury_debt$」#![dynastic_cycle_catalyst|E]を処罰する\n$BULLET$特別な#V $influence_meritorious_career_interaction$#![interaction|E]の選択肢を使用する#!#!"
 WJ_desc_councillor_marshal_local: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_marshal', SCOPE.sC('councillor_liege'))]はあなたの最高の[commander|E]であり、軍事全般を統べる[councillor|E]である。"
 WJ_desc_councillor_spymaster: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_spymaster', SCOPE.sC('councillor_liege'))]は陰謀と情報を担う[minister|E]である。\n\n[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_spymaster', SCOPE.sC('councillor_liege'))]の不忠には用心せよ。彼らはあなたやあなたの[close_family|E]に対する[schemes|E]を容易に隠し、あるいは加担することさえできるのだ！\n\n[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_spymaster', SCOPE.sC('councillor_liege'))]は、[GetLawGroup('grand_secretariat_laws').GetName|V][law|E]に応じて[grand_secretariat_director|E]に指名されることがある。\n\n$WJ_desc_councillor_spymaster_actions$"
 WJ_desc_councillor_spymaster_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_spymaster', SCOPE.sC('councillor_liege'))]にできること：\n$BULLET$#V $censor_find_secrets_interaction$#![interaction|E]を使って[vassal|E]の[courts|E]で[secrets|E]を探す。これにより[liege|E]から[gold_i][gold|E]の褒賞を得たり、[hooks|E]を得たりできる\n$BULLET$[blackmail|E]を行うと#V 「$catalyst_minister_blackmailed$」#![dynastic_cycle_catalyst|E]が発生する\n$BULLET$特別な#V $influence_meritorious_career_interaction$#![interaction|E]の選択肢を使用する#!#!"
 WJ_desc_councillor_spymaster_local: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_spymaster', SCOPE.sC('councillor_liege'))]は工作と諜報を担う[councillor|E]である。[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_spymaster', SCOPE.sC('councillor_liege'))]の不忠には用心せよ。彼らはあなたやあなたの近親に対する[GetScheme('murder').GetTypeName]を容易に隠し、あるいは加担することさえできるのだ！"
 WJ_desc_councillor_court_chaplain: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_court_chaplain', SCOPE.sC('councillor_liege'))]は宗教と精神の事柄を担う[minister|E]であり、[governors|E]が[examinations|E]を主催するのを助けることができる。\n\n$WJ_desc_councillor_court_chaplain_actions$"
 WJ_desc_councillor_court_chaplain_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_court_chaplain', SCOPE.sC('councillor_liege'))]にできること：\n$BULLET$[GetGreatProjectType('minister_project_culture').GetName|V][great_project|E]を開始する\n$BULLET$[GetGreatProjectType('minister_compel_religious_uniformity').GetName|V][great_project|E]を開始する\n$BULLET$[vassals|E]が[examinations|E]を行うのを補佐する\n$BULLET$[faith_hostile|E]または[faith_evil|E]の[faiths|E]を持つ[characters|E]に#V $demand_conversion_minister_rites_interaction$#!\n$BULLET$特別な#V $influence_meritorious_career_interaction$#![interaction|E]の選択肢を使用する#!#!"
 WJ_desc_minister_personnel: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_personnel', SCOPE.sC('councillor_liege'))]は[appointments|E]の事務を全面的に司る[minister|E]であり、他の[characters|E]の[candidate_score|E]に大きな影響を与えることができる。\n\n$WJ_desc_minister_personnel_actions$"
 WJ_desc_minister_personnel_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_personnel', SCOPE.sC('councillor_liege'))]にできること：\n$BULLET$[GetLawGroup('celestial_retirement_law').GetName][law|E]を無視して#V $force_governor_removal_interaction$#![interaction|E]で[governors|E]を罷免する\n$BULLET$[GetDecision('tgp_minister_recruit_courtiers_decision').GetName|V][decision|E]で任意の種類の[courtier|E]を招く\n$BULLET$相手に#V $offer_courtier_interaction$#!と#V $demand_courtier_interaction$#![interactions|E]を強制的に受け入れさせる\n$BULLET$より低い費用で特別な#V $influence_meritorious_career_interaction$#![interaction|E]の選択肢を使用する#!#!"
 WJ_desc_minister_justice: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_justice', SCOPE.sC('councillor_liege'))]は法務を担う[minister|E]であり、[son_of_heaven|E]を補佐して正義を維持する。\n\n$WJ_desc_minister_justice_actions$"
 WJ_desc_minister_justice_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_justice', SCOPE.sC('councillor_liege'))]にできること：\n$BULLET$[GetGreatProjectType('minister_project_establish_control').GetName|V][great_project|E]を開始する\n$BULLET$[vassals|E]と[courtiers|E]に#V $imprison_interaction$#![interaction|E]を使用でき、相手は拒否できない\n$BULLET$[crimes|E]を犯した[characters|E]に#V $pardon_interaction$#![interaction|E]を使用する\n$BULLET$$censor_find_secrets_interaction$[interaction|E]を使って[vassal|E]の[courts|E]で[secrets|E]を探し、既知の[criminals|E]を[imprison|E]または赦免する\n$BULLET$[secrets|E]を暴露すると「$catalyst_minister_exposed_secret$」[dynastic_cycle_catalyst|E]が発生する\n$BULLET$特別な#V $influence_meritorious_career_interaction$#![interaction|E]の選択肢を使用する#!#!"
 WJ_desc_minister_works: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_works', SCOPE.sC('councillor_liege'))]は[realm|E]の建設と発展を担う[minister|E]であり、[great_projects|E]を開始できる。\n\n$WJ_desc_minister_works_actions$"
 WJ_desc_minister_works_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_works', SCOPE.sC('councillor_liege'))]にできること：\n$BULLET$[GetGreatProjectType('minister_project_development').GetName|V][great_project|E]を開始する\n$BULLET$[GetGreatProjectType('grand_canals').GetName|V][great_project|E]を開始する\n$BULLET$[GetGreatProjectType('great_wall').GetName|V][great_project|E]を開始する\n$BULLET$[realm|E]内で[buildings|E]と[holdings|E]を建設できる\n$BULLET$[GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName][dynastic_cycle_era_short|E]中は、[son_of_heaven|E]の[tributaries|E]の領地内で[buildings|E]と[holdings|E]を建設できる\n$BULLET$特別な#V $influence_meritorious_career_interaction$#![interaction|E]の選択肢を使用する#!#!"
 WJ_desc_minister_grand_marshal: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_grand_marshal', SCOPE.sC('councillor_liege'))]は[realm|E]の最高位の武官であり、[title_men_at_arms|E]の[army|E]を指揮する。\n\n[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_grand_marshal', SCOPE.sC('councillor_liege'))]は、#V [GetLawGroup('grand_secretariat_laws').GetName]#![law|E]に応じて[grand_secretariat_director|E]に指名されることがある。\n\n$WJ_desc_minister_grand_marshal_actions$"
 WJ_desc_minister_grand_marshal_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_grand_marshal', SCOPE.sC('councillor_liege'))]にできること：\n$BULLET$#V 開辺#![great_project|E]を開始する\n$BULLET$[GetGreatProjectType('construct_great_barracks').GetName|V][great_project|E]を開始する\n$BULLET$[GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName]と[GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability_conquest').GetName]の[dynastic_cycle_eras_short|E]に#V $CHINA_SEIZE_COUNTY_CB_NAME$#!と#V $CHINA_SEIZE_DUCHY_CB_NAME$#!の[casus_bellis|E]を使用する\n$BULLET$特別な#V $influence_meritorious_career_interaction$#![interaction|E]の選択肢を使用する#!#!"

 # 宫廷任务GUI持有明确雇主才用此桥；未知任务及非汉晋保留原描述。
 WJ_court_task_description: "[Select_CString(And(GetScriptedGui('WJ_name_tooltip_hanjin').IsShown(GuiScope.SetRoot(Character.MakeScope).End), Not(ObjectsEqual(Concatenate('WJ_desc_', CourtPositionTaskType.GetKey), Localize(Concatenate('WJ_desc_', CourtPositionTaskType.GetKey))))), Localize(Concatenate('WJ_desc_', CourtPositionTaskType.GetKey)), CourtPositionTaskType.GetDescription)]"
 WJ_desc_court_poet_court_position_task_create_poetry: "あなたの[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)]は、あなた、あなたの領地、あなたの功績を讃える美しい詩を作り、朗誦する。"
 WJ_desc_grand_guardian_court_position_task_guard_the_capital: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)]将負責保護帝都的安全。"
 WJ_desc_grand_guardian_court_position_task_shield_the_realm: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)]は、その武功と韜略を振るって帝国全体を守る。"
 WJ_desc_grand_guardian_court_position_task_instill_martial_discipline: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)]は、軍中で積み重ねた経験を、まだ戦陣に臨んだことのない者たちに伝えようと努める。"
 WJ_desc_grand_mentor_court_position_task_teach_liege: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)]将致力于教育其領主。"
 WJ_desc_grand_mentor_court_position_task_edify_heirs: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)]会致力于培養帝国的下一代。"
 WJ_desc_grand_mentor_court_position_task_train_officials: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)]は、領内全土の官吏が自らと同じ知恵、美徳、技能を備えるよう取り計らう。"
 WJ_desc_grand_preceptor_court_position_task_instill_righteousness: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)]は、これらの臣下の主君に代わって、彼らの心性を正しく導く。"
 WJ_desc_grand_preceptor_court_position_task_propagate_civic_virtue: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)]は、一般の民衆の間に礼楽による教化を広める任を担う。"
 WJ_desc_grand_preceptor_court_position_task_exalt_imperial_deeds: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)]として、この人物の言葉には深い道徳の力が宿り、多くの人がそれを真理とみなす傾向にある。"

