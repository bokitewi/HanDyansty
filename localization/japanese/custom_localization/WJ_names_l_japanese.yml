 WJ_baiguan_label_tingwei:0 "廷尉"
 WJ_court_taiyiling:0 "太医令"
 WJ_court_taiyiling_desc:0 "$WJ_court_taiyiling$は、その属する[court|E]の健康と福祉を担う。病を治し、傷を縫うために全力を尽くす。"
 WJ_court_yishi:0 "医師"
 WJ_court_yishi_desc:0 "$WJ_court_yishi$は、その属する[court|E]の健康と福祉を担う。病を治し、傷を縫うために全力を尽くす。"
 WJ_court_jiayi:0 "家医"
 WJ_court_jiayi_desc:0 "$WJ_court_jiayi$は、その属する[court|E]の健康と福祉を担う。病を治し、傷を縫うために全力を尽くす。"
 WJ_court_shaofucheng:0 "少府丞"
 WJ_court_shaofucheng_desc:0 "$WJ_court_shaofucheng$は皇家の日々の生活において重要な役割を担い、使用人を管理し、すべてが円滑に運ぶよう取り計らう。"
 WJ_court_taizhongdafu:0 "太中大夫"
 WJ_court_taizhongdafu_desc:0 "$WJ_court_taizhongdafu$は宮廷のすべての子供の[education|E]を担い、その能力は生徒に影響を与える。子供はなお自分の[guardians|E]を持つことができる。"
 WJ_court_jingshi:0 "経師"
 WJ_court_jingshi_desc:0 "$WJ_court_jingshi$は宮廷のすべての子供の[education|E]を担い、その能力は生徒に影響を与える。子供はなお自分の[guardians|E]を持つことができる。"
 WJ_court_jiashushi:0 "家塾師"
 WJ_court_jiashushi_desc:0 "$WJ_court_jiashushi$は宮廷のすべての子供の[education|E]を担い、その能力は生徒に影響を与える。子供はなお自分の[guardians|E]を持つことができる。"
 WJ_court_zhongchangshi:0 "中常侍"
 WJ_court_zhongchangshi_desc:0 "$WJ_court_zhongchangshi$は宮廷の宦官を束ねる信頼された僕である。使用人や宗室の中で、宦官の耳を逃れる事柄はほとんどない。"
 WJ_court_muli:0 "牧吏"
 WJ_court_muli_desc:0 "$WJ_court_muli$は主君の雄々しい馬と厩舎を担う。手入れの行き届いた馬は戦場でも道中でも役立つため、この役職の務めは重い。"
 WJ_court_yuzhe:0 "御者"
 WJ_court_yuzhe_desc:0 "$WJ_court_yuzhe$は皇帝の雄々しい馬と厩舎を担う。手入れの行き届いた馬は戦場でも道中でも役立つため、この役職の務めは重い。"
 WJ_court_sanqishilang:0 "散騎侍郎"
 WJ_court_sanqishilang_desc:0 "$WJ_court_sanqishilang$は言葉と詩句の達人であり、主君と宮廷のすべての者に楽しみ、知的な刺激、情緒的な体験をもたらす。"
 WJ_court_wenxue:0 "文学"
 WJ_court_wenxue_desc:0 "$WJ_court_wenxue$は言葉と詩句の達人であり、主君と宮廷のすべての者に楽しみ、知的な刺激、情緒的な体験をもたらす。"
 WJ_court_yuegong:0 "楽工"
 WJ_court_yuegong_desc:0 "$WJ_court_yuegong$は歌と演奏で主君と宮廷を楽しませる芸術家である。"
 WJ_court_yueshi:0 "楽師"
 WJ_court_yueshi_desc:0 "$WJ_court_yueshi$は歌と演奏で主君と宮廷を楽しませる芸術家である。"
 WJ_court_hubenlang:0 "虎賁郎"
 WJ_court_hubenlang_desc:0 "$WJ_court_hubenlang$はあらゆる襲撃者に対する最後の防衛線であり、警護する者の行く先にはどこへでも付き従い、潜む危険に直面すれば迷わずその前に立ちはだかる。"
 WJ_court_suwei:0 "宿衛"
 WJ_court_suwei_desc:0 "$WJ_court_suwei$はあらゆる襲撃者に対する最後の防衛線であり、警護する者の行く先にはどこへでも付き従い、潜む危険に直面すれば迷わずその前に立ちはだかる。"
 WJ_court_qinwei:0 "親衛"
 WJ_court_qinwei_desc:0 "$WJ_court_qinwei$はあらゆる襲撃者に対する最後の防衛線であり、警護する者の行く先にはどこへでも付き従い、潜む危険に直面すれば迷わずその前に立ちはだかる。"
 WJ_court_huyuan:0 "護院"
 WJ_court_huyuan_desc:0 "$WJ_court_huyuan$はあらゆる襲撃者に対する最後の防衛線であり、警護する者の行く先にはどこへでも付き従い、潜む危険に直面すれば迷わずその前に立ちはだかる。"
 WJ_court_guangludafu:0 "光禄大夫"
 WJ_court_guangludafu_desc:0 "$WJ_court_guangludafu$は宮廷における道徳の模範である。その務めは自ら仁義を実践し、百官の手本となることである。"
 WJ_court_sanqichangshi:0 "散騎常侍"
 WJ_court_sanqichangshi_desc:0 "$WJ_court_sanqichangshi$は宗室の子弟の教育と指導という重責を担い、次の世代が祖先の打ち立てた模範から外れぬよう尽力する。"
 WJ_court_zhonghujun:0 "中護軍"
 WJ_court_zhonghujun_desc:0 "$WJ_court_zhonghujun$は帝国の棟梁にして干城であり、輝かしい戦功と韜略によって万人の尊敬を受けている。"
 WJ_court_shizhong:0 "侍中"
 WJ_court_shizhong_desc:0 "$WJ_court_shizhong$は君主の側近として仕え、諮問に備えて応対し、朝政に参与する。その職能と収益は王宮役職と選択した任務によって決まる。"
 WJ_name_court_grand_preceptor:0 "$WJ_court_guangludafu$ "
 WJ_name_court_grand_mentor:0 "$WJ_court_sanqichangshi$ "
 WJ_name_court_grand_guardian:0 "$WJ_court_zhonghujun$ "
 WJ_name_court_chief_eunuch:0 "$WJ_court_zhongchangshi$ "
 WJ_name_court_seneschal:0 "$WJ_court_shaofucheng$ "
 WJ_name_court_court_tutor:0 "$WJ_court_taizhongdafu$ "
 WJ_name_court_court_poet:0 "$WJ_court_sanqishilang$ "
 WJ_name_court_honors:0 "[ROOT.Char.Custom('WJ_NameCourtPreceptor')][ROOT.Char.Custom('WJ_NameCourtMentor')][ROOT.Char.Custom('WJ_NameCourtGuardian')][ROOT.Char.Custom('WJ_NameCourtEunuch')][ROOT.Char.Custom('WJ_NameCourtSeneschal')][ROOT.Char.Custom('WJ_NameCourtTutor')][ROOT.Char.Custom('WJ_NameCourtPoet')]"
 WJ_name_service_court_physician:0 "[GetCourtPositionType('court_physician_court_position').CalcTriggeredNameNoTooltip(SCOPE.sC('wj_name_court_physician_employer'))] "
 WJ_name_service_seneschal:0 "[GetCourtPositionType('seneschal_court_position').CalcTriggeredNameNoTooltip(SCOPE.sC('wj_name_seneschal_employer'))] "
 WJ_name_service_court_tutor:0 "[GetCourtPositionType('court_tutor_court_position').CalcTriggeredNameNoTooltip(SCOPE.sC('wj_name_court_tutor_employer'))] "
 WJ_name_service_chief_eunuch:0 "[GetCourtPositionType('chief_eunuch_court_position').CalcTriggeredNameNoTooltip(SCOPE.sC('wj_name_chief_eunuch_employer'))] "
 WJ_name_service_master_of_horse:0 "[GetCourtPositionType('master_of_horse_court_position').CalcTriggeredNameNoTooltip(SCOPE.sC('wj_name_master_of_horse_employer'))] "
 WJ_name_service_master_of_hunt:0 "[GetCourtPositionType('master_of_hunt_court_position').CalcTriggeredNameNoTooltip(SCOPE.sC('wj_name_master_of_hunt_employer'))] "
