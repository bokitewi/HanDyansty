l_japanese:
 # ==========================================================================
 # 隐士故事循环（养望重制，2026-10-09）
 # ==========================================================================
 story_WJ_yinshi:0 "隠居"
 WJ_YINSHI_STORY_INFORMATION_STRING:0 "あなたは山林に隠れ住み、書を読み人と交わり、徴辟には応じない。山中の日々は平凡に見えるが、経巻の難問、郷里の争い、旧友からの書簡が絶えず訪れる。時には、柴の門の外に車馬が止まることもある。"

 WJ_yinshi_enter_decision:0 "隠居して名望を養う"
 WJ_yinshi_enter_decision_desc:0 "宦途の波風は、つまるところ長く身を置くべきものではない。いっそ官職を辞し、門を閉ざして書を読み、郷里の旧友と往来しつつ、学問と節操によって清望を養うがよい。いずれ天下に道が行われるようになってから世に出ても、遅くはあるまい。"
 WJ_yinshi_enter_decision_tooltip:0 "官職を辞し、山林に隠棲して門を閉ざし名望を養う"
 WJ_yinshi_enter_decision_confirm:0 "帰らんかな！"
 WJ_yinshi_enter_decision_effect_tt:0 "あなたは自ら雅号を名乗り、以後は門を閉ざして書を読み、あらゆる徴辟と任命を謝絶し、兵馬を率いることもなくなる。"
 WJ_yinshi_enter_decision_resign_tt:0 "あなたの保有する官職と封地は、その配下もろとも、すべて主上に返還される。"
 WJ_yinshi_cooldown_tt:0 "山を出てからまだ十五年に満たない。再び隠居できるのは [GetPlayer.MakeScope.Var('wj_yinshi_cooldown_end').GetValue|0] 年になってからである"
 WJ_yinshi_blocked_tt:0 "この人物は隠居中のため、任命を受けない"

 WJ_yinshi_exit_decision:0 "出山"
 WJ_yinshi_exit_decision_desc:0 "山中の歳月は久しく過ぎたが、天下の事はいささかも休まってはいない。衣を整えて山を出で、再び朝廷と州郡の召しに応じる時が来た。"
 WJ_yinshi_exit_decision_tooltip:0 "隠居を終え、再び徴辟に応じる"
 WJ_yinshi_exit_decision_confirm:0 "衣を整えて山を出る"
 WJ_yinshi_exit_decision_effect_tt:0 "あなたは山居に別れを告げ、再び俗世へ戻る。こたび山を出れば、向こう数年は再び隠居を口にすべきではない。"

 WJ_yinshi_risk_success:0 "為すところ成る"
 WJ_yinshi_risk_fail:0 "事、志と違う"
 WJ_yinshi_friend_reason:0 "隠居中に知り合った"

 # ---------------------------------------------------------------- 学习
 WJ_yinshi.1001.t:0 "灯下に古注を校す"
 WJ_yinshi.1001.desc:0 "借りていた写本がようやく届いたが、何か所か文字が家にある古い巻と異なっていた。同じ章句でも、一家は礼制を重んじ、一家は名実を弁ずる。門下の後学たちはそれぞれ一説を奉じ、昼餉の席でさえ議論が絶えない。\n\n夜が更けても、あなたはなお二つの写本に向かっていた。軽々しく異説を立てれば、一時の名声を得るのはたやすい。だが旧解に不安があると知りながら一言も発さぬのも、学問に誠実とは言えまい。灯芯はひと節短くなり、机上にはまだ新解を書き記すに足る白紙が残っている。"
 WJ_yinshi.1001.a:0 "まず文字を校訂し、疑わしきは疑わしきままに。"
 WJ_yinshi.1001.b:0 "一条ずつ弁析し、今夜のうちに論を成す。"
 WJ_yinshi.1001.c:0 "夜明けまで対校し、一字もおろそかにせぬ。"

 WJ_yinshi.1002.t:0 "旧注をふたたび開く"
 WJ_yinshi.1002.desc:0 "古い箱を探っていると、家に伝わる一巻の経注が出てきた。紙の縁はすでに虫に食われているが、いくつかの書き込みはまだ判読できる。先人が厳かに筆を下ろしたものもあれば、読んで興が乗った折の疑問にすぎぬものもある。今あらためて読むと、かつて定説と奉じられた解釈が、近年のあなたの見聞と少なからず食い違っていた。外では風が竹の葉を渡り、机上の古い文字はあなたになかなか頁をめくらせない。\n\n新説を別に書けば、後の読書人は回り道をせずに済むかもしれないが、あなたの反論だけを覚え、旧学本来の長所を忘れてしまうかもしれない。欠けたところを補うだけにすれば、家学は完全な形で伝わるが、心中の疑問は置き場を失う。灯下に二枚の白紙があり、一枚には疑問の弁を、一枚には旧注を記すことができる。今夜、まずはどちらかに筆を下ろさねばならない。"
 WJ_yinshi.1002.a:0 "旧注を補い、家学の本来の姿を残す。"
 WJ_yinshi.1002.b:0 "別に弁疑を著し、旧説と並べて伝える。"

 WJ_yinshi.1003.t:0 "二本の異文"
 WJ_yinshi.1003.desc:0 "借りてきた一巻の写本は、手元の旧本と互いに食い違っていた。同じ一句でも、一字が変わるだけで、慎重を勧める意味から進取を促す意味へと変わってしまう。傍らの小注も、後人が誤って本文に書き写したもののように見える。何度か読み返すと、二つの説にはそれぞれ通じるところがあった。紙の擦り切れも墨の濃淡も、どちらが先でどちらが後かを容易には決めてくれない。\n\n一つの読み方を選んで本文に書き写せば、読者はいちいち気を散らさずに済むが、あなたの取捨を古書本来の姿と取り違えるだろう。異文を並べて、取捨を後の人に委ねれば、文字は煩雑に見えるが、疑わしい箇所はなおも人目に触れ続ける。机上に二巻の書を広げたまま、あなたはふと、きっぱりとした一字の改変で写し伝えの曲折を覆い隠したくはないと思った。"
 WJ_yinshi.1003.a:0 "両説を並存させ、疑わしきは欠いて待つ。"
 WJ_yinshi.1003.b:0 "一方を本文に採り、別にその理由を注す。"
 WJ_yinshi.1003.c:0 "しばし論断せず、広く諸本を借りる。"

 WJ_yinshi.1004.t:0 "夜の誦読"
 WJ_yinshi.1004.desc:0 "夜に入ると山中はひときわ静かで、軒下の雨垂れの音しか聞こえない。昼間に読んだ経文の一章は、一句一句みな見知っているのに、書を閉じると前後がどうつながるのか言えない。若い頃、師に暗誦を求められたときは、あなたはそれを愚直だと嫌ったものだ。今になってようやく、多くの道理は口の中で何度も繰り返してこそ、心に落ち着くのだと気づく。\n\n灯油は夜半過ぎまでは持ちそうだ。この章はまだ読み込めていないのに、後ろにはまだ長い一篇が待っている。眠気はすでにそっと眉根に忍び寄っていた。"
 WJ_yinshi.1004.a:0 "まずはこの章を熟読し、明日先へ進む。"
 WJ_yinshi.1004.b:0 "夜を徹して誦読し、必ず通暁する。"

 WJ_yinshi.1005.t:0 "碑に臨んで字を習う"
 WJ_yinshi.1005.desc:0 "友人が樵に託して古碑の拓本を届けてきた。墨の濃淡はむらがあり、いくつかの字はすでに摩滅している。それでも筆画の間の気象は実に雄大で、当世流行の書風とはまるで異なっていた。紙を広げて数行試し書きしてみたが、手首がどうにも思うように動かず、書けた字は形を写すばかりである。\n\n古老は言う、書を学ぶにはまず数年は愚直に臨模せよと。また別の者は言う、ある境地に至れば手本を捨て、己の面目を書き出すべきだと。拓本は机上に広げられ、墨はすでに磨り終えてある。"
 WJ_yinshi.1005.a:0 "日に一紙を臨模し、まず形似を求める。"
 WJ_yinshi.1005.b:0 "手本を捨てて自ら筆を運び、己の意を試す。"

 WJ_yinshi.1006.t:0 "律を読む"
 WJ_yinshi.1006.desc:0 "郷里の者が田地の訴訟について律文を尋ねに来て、あなたは初めて、多くの経書を読みながら現行の律令にはかえって疎いことに気づいた。借りてきた律本は条目が煩雑で、同じ事柄でも前後の規定によって軽重がまるで違う。読書人はよく律令を刀筆の吏の学問と言うが、郷人が損をするのは、往々にして律文を知らぬがゆえなのだ。\n\n律本は分厚い束で、一条ずつ書き写して読むだけでも相当の手間がかかる。各条の間の道理を通し、郷人にも読める文章にまとめようとすれば、さらに幾晩徹夜せねばならぬか分からない。"
 WJ_yinshi.1006.a:0 "まず一通り書き写して読み、条目に通じる。"
 WJ_yinshi.1006.b:0 "律意を疏通し、郷人のために解説を作る。"
 WJ_yinshi.1006.c:0 "郷人のために一条ずつ比較検討し、公平を期す。"

 WJ_yinshi.1007.t:0 "九章算術"
 WJ_yinshi.1007.desc:0 "書物を整理していると、一部の『九章算術』が出てきた。若い頃に課業のため買ったもので、頁にはほとんどめくった跡がない。何題か目を通してみると、均輸も方田も郷里の実際と関わりがある。徭役の分担も田畝の測量も、これらの算法なしには立ち行かない。郷里の帳簿にしばしば争いが起こるのも、大半は誰も正しく計算できないからだ。\n\n書中の算題を一題ずつ解いていけば、いずれ熟達はするだろう。ただあなたは、これらの法則を目の前の実事に推し広げれば、より簡便な算術が求められるのではないかと、うっすら感じていた。"
 WJ_yinshi.1007.a:0 "最初から演算し、まず本来の法に熟する。"
 WJ_yinshi.1007.b:0 "実事に推し広げ、別に新たな術を求める。"

 WJ_yinshi.1008.t:0 "星を観て暦を記す"
 WJ_yinshi.1008.desc:0 "晴れた夜が続き、星象はひときわはっきりしている。手元の暦書と照らし合わせると、書に載る節気と目の前に見えるものとの間に一、二日のずれがあることに気づいた。暦法は農時と祭祀に関わり、もとより太史の掌るところで、山中の隠者が口を出すべきことではない。だが、このずれが本当なら、郷人の種まきが数日ずれるかもしれない。\n\n夜風はもういくらか冷たい。ずれの原因を突き止めるには、幾夜も続けて星空の下に留まり、自ら推歩しなければならない。"
 WJ_yinshi.1008.a:0 "まず暦書を写し、後の検証に備える。"
 WJ_yinshi.1008.b:0 "夜通し観測し、推歩して真を求める。"

 # ---------------------------------------------------------------- 探究
 WJ_yinshi.2001.t:0 "畦の上で学を問う"
 WJ_yinshi.2001.desc:0 "早朝に田のほとりへ出ると、同じ斜面の稲の苗に高低があるのが見えた。郷人が土の色や日当たり、雨水の行方を語る言葉は、あなたが読み慣れた篇章には見えないものだが、その見立ては往々にして目の前の実情を的確に突いている。詳しく尋ねてみて初めて、かつて口にした「天の時に順う」という漠然とした一言が、畦の間では多くの異なる手間に分けねばならぬのだと知った。\n\n今日聞いた経験を順に書き留め、天候の異なる日にまた来て確かめれば、信頼できる農事の札記が残せるかもしれない。自ら痩せた田を一枚借りて試しに植えれば、どの定説が他所にしか当てはまらないのか見分けられるかもしれないが、一季の収穫をそれに賭けることになる。泥が履の縁につき、あなたは家に戻ったとたんにこれらの話を雑談として忘れてしまいたくはなかった。"
 WJ_yinshi.2001.a:0 "田に残り、まず郷人の言葉を記す。"
 WJ_yinshi.2001.b:0 "田を借りて試しに植え、自ら新法を験す。"

 WJ_yinshi.2002.t:0 "薬を採り草を識る"
 WJ_yinshi.2002.desc:0 "山の裏手に薬草採りの老人がいて、よく竹籠を背負って家の前を通る。今日は水を求めて立ち寄ったが、籠の中の草葉は大半が名も分からない。老人は、どれが熱を下げるか、どれが干してこそ薬になるか、どれが似ていても人を害するかを理路整然と語るが、それがどの書に載っているかは言えない。\n\n老人は水を飲み終えると山へ戻ろうとしている。籠の中の数株はまだ露を帯びていた。古書に記された薬性と老人の言うことが合うのかどうか、自ら口にしてみなければ分からない。"
 WJ_yinshi.2002.a:0 "老人について山に入り、見ながら記す。"
 WJ_yinshi.2002.b:0 "草を持ち帰り、書に照らして自ら嘗める。"

 WJ_yinshi.2003.t:0 "紙背にもう一つの春秋"
 WJ_yinshi.2003.desc:0 "古紙を裁ち整えていると、ある経文の頁の裏に数行の日常の記録があるのを見つけた。何日に穀を借り、何日に返したか、それに長雨で道が悪いという愚痴が一句。字は乱雑で、明らかに名を残すために書かれたものではない。いつもの習いどおり破れた縁を裁ち落とせば、真っ先に消えるのはこれらの散らばった小さな文字だ。だがそれは、表の端正な章句の外にあった日々の一端をあなたに見せてくれた。\n\n原紙を丸ごと挟んで保管し、目録に雑記ありと注記するだけにすれば、後の読者は筆跡や前後を自分で見分けられる。これらの雑記がいつ誰の手によるものか突き止めようとすれば、古い箱をすべて探り、筆跡を比べねばならず、数句の言葉から一つの身の上をまるごと臆造してしまわぬよう用心も要る。紙を裁つ手を止め、あなたはもう無名を無用と見なしたくはなかった。"
 WJ_yinshi.2003.a:0 "原貌を保ち、表裏ともに記録する。"
 WJ_yinshi.2003.b:0 "来歴を追い、その年月を考証する。"

 WJ_yinshi.2004.t:0 "山川地誌"
 WJ_yinshi.2004.desc:0 "地誌を読んでいて、書中に記された水路が郷人の言うことと一致しないことに気づいた。書にはある川が東に流れて河に入るとあるが、郷人によればその川はとうに流れを変え、今は南へ向かって別の渓流に合流しているという。地誌の多くは先人が転々と書き写してきたもので、誰かが実際に歩いたとは限らない。\n\n何種かの地誌の説を一か所に書き写せば、異同はおのずと見えてくる。だが結局どの説が正しいのかは、誰かが水路に沿って数日歩いてみなければ分からない。山道は険しく、渓流のほとりには危うい所も多い。"
 WJ_yinshi.2004.a:0 "諸誌をまとめて記録し、異同を注す。"
 WJ_yinshi.2004.b:0 "水路に沿って踏査し、自らその流れを確かめる。"

 WJ_yinshi.2005.t:0 "病を問う"
 WJ_yinshi.2005.desc:0 "隣家の子供が数日熱を出したまま下がらず、家の者は医者を呼ぶ金もなく、書物に処方はないかとあなたに尋ねに来た。あなたは医経を何巻か読んだことはあるが、人を診たことは一度もない。医書に言う陰陽表裏も、熱にうなされる子供を前にしては、どこから手をつけてよいか分からない。\n\n子供の母親は戸口に立ち、すがるような目をしている。書物の言葉が当てになるとは限らないと分かってはいるが、遠方の医者もすぐには呼べない。"
 WJ_yinshi.2005.a:0 "医経を調べ出し、医者を招くよう勧める。"
 WJ_yinshi.2005.b:0 "自ら往診し、処方に従って治療を試みる。"

 WJ_yinshi.2006.t:0 "樵道の付け替え"
 WJ_yinshi.2006.desc:0 "通い慣れた山道が雨水に一部えぐられ、緩んだ土の縁から木の根が露出していた。道に慣れた者ならまだ迂回できるが、荷を担ぐ者には余計な手間がかかる。近道を新たに開こうと言う者もいれば、新しい道は水の溜まりやすい低地を通ると言う者もいる。あなたは斜面に沿ってひと回り歩いてみて、紙の上で縮まるように見える道のりも、足元では必ずしも楽にはならないと気づいた。\n\n旧道に沿って排水と足場を調べ、まず危険な箇所を示しておけば、皆の慣れた道筋を保てるが、今後も雨のたびに見回らねばならない。新しい道を二本とも歩き、晴雨での違いを記録すれば、より歩きやすい道を見定められるかもしれないが、山中を駆け回るのは苦労を伴う。帰り道、履物はすっかり濡れたが、来たときよりも事情はよく分かっていた。"
 WJ_yinshi.2006.a:0 "旧道を細かく調べ、危険な箇所を示す。"
 WJ_yinshi.2006.b:0 "新しい道をくまなく歩き、一本に定める。"

 WJ_yinshi.2007.t:0 "玄を談ず"
 WJ_yinshi.2007.desc:0 "雲遊の道士が一晩の宿を借り、夜にあなたと向かい合って座った。彼は符籙や丹薬の話はせず、ただ『老子』『荘子』をどこまで読んだかを問う。あなたが日頃の所感を幾言か述べると、彼はそれはみな書物の言葉だと笑った。\n\n灯花がぱちりと爆ぜた。道士は鬚をひねって黙り込み、あなたがさらに何か言うのを待っているようだった。"
 WJ_yinshi.2007.a:0 "聞き流し、各々己の書を読む。"
 WJ_yinshi.2007.b:0 "先入観を捨て、夜を徹して道を論じる。"
 WJ_yinshi.2007.c:0 "得失は彼に任せ、心静かに耳を傾ける。"

 WJ_yinshi.2008.t:0 "自省"
 WJ_yinshi.2008.desc:0 "雨の日で外へ出られず、あなたは昨年書いた日記を数頁めくってみた。今読むと幼稚に思える言葉もあれば、当時は悟ったと思ったことが今なお堂々巡りしているものもある。隠居はもともと書を読むためであったのに、読めば読むほど、自分の気性こそ書中のどんな難問よりも解き難いと感じる。\n\n雨音は止まない。机上の書は開かれたままだが、硯の墨はとうに乾いていた。"
 WJ_yinshi.2008.a:0 "いつもどおり書を読み、深く追究はしない。"
 WJ_yinshi.2008.b:0 "数日門を閉ざし、心中の思いをすべて書き記す。"
 WJ_yinshi.2008.c:0 "心を平らかにし、おのずと本来を見る。"

 # ---------------------------------------------------------------- 当地人
 WJ_yinshi.3001.t:0 "衡門前の郷里の争い"
 WJ_yinshi.3001.desc:0 "二軒の郷人がそれぞれの家の長老を連れて門前にやって来た。共用の水路を使う順番をめぐって争いが収まらないのだ。一方は古い取り決めを盾にし、一方は田の苗がもう待てないと言う。皆は先に役所へ訴え出ることを望まず、あなたが書を読んだ人であり、両家のどちらとも私怨がないからと、公平な裁きを期待していた。\n\nあなたには官印がなく、県に代わって裁くことはできない。だが「隠者は俗事に関わらず」の一言で人を追い返すのなら、いわゆる郷里の清望とは、いったいどこにあるというのか。"
 WJ_yinshi.3001.a:0 "郷老を招いて共に議し、分を越えて口出しはしない。"
 WJ_yinshi.3001.b:0 "古い取り決めを調べ、自ら是非を裁く。"
 WJ_yinshi.3001.c:0 "取り決めに基づき公正に、偏りなく裁く。"

 WJ_yinshi.3002.t:0 "童子門を叩く"
 WJ_yinshi.3002.desc:0 "郷里の少年が数人連れ立って門前にやって来た。携えてきたのは束脩ではなく、習字の反故紙の束である。常用の字はいくらか知っているが、短い章を読むと句読をしばしば取り違える。先頭の少年は、昼間に家の仕事を手伝わねばならぬ身では、経書は学べないのかと尋ねた。指の間の墨の跡を見て、あなたは自分も学び始めの頃、長い章句に怖気づいたことを思い出した。\n\n昔ながらの師法に従い、一部の経書を一字ずつ講じれば、基礎は固まるが、長い課業を最後まで続けられる者がいるとは限らない。書簡や契約書で役立つ語句から先に教えれば、読書はすぐに家の役に立つが、目先の用事をこなすだけで終わりやすい。門の外の足音はまだ去らない。彼らにどのような始まりを与えるべきだろうか。"
 WJ_yinshi.3002.a:0 "まず日用の文字を教え、学んだことを実地に生かす。"
 WJ_yinshi.3002.b:0 "経書を授け、句読から教える。"

 WJ_yinshi.3003.t:0 "渡し場で道を譲る"
 WJ_yinshi.3003.desc:0 "渡し場を通りかかると、数人の旅人が順番をめぐって言い争っていた。荷の多い者は長く待てないと言い、遠路を急ぐ者は日が暮れれば進めないと言い、とうに岸辺で待っていた者は口を挟むこともできずにいる。自分が得をしていると認めたがる者はおらず、言い争うほどに些事が品行の話にまで膨らんでいく。傍らに立ったあなたは、書中の「礼譲」の二字もここで足場を得ねばならぬのだと、ふと思った。\n\n岸に着いた順に並ばせるのが最も明快で、口下手な者にも拠り所となる。目の前で本当に急を要する者を先に気遣えば、思いやりにはより近いかもしれないが、理由をはっきり説かねば、誰もが我先にと急を言い立てるだろう。水面にはもう塒へ帰る鳥がかすめていく。これ以上ぐずぐずしていては、誰も先へ進めない。"
 WJ_yinshi.3003.a:0 "岸に着いた順に従い、各々その順を守る。"
 WJ_yinshi.3003.b:0 "まず急を要する者を問い、物言わぬ者に代わって事情を述べる。"

 WJ_yinshi.3004.t:0 "葬送の議"
 WJ_yinshi.3004.desc:0 "郷里で葬儀のことが噂になっていた。近頃は何軒かが競って棺槨を手厚く備え、暮らしに窮する家までが不孝と指さされるのを恐れているという。一方では古人の薄葬の言を引き、一律に簡素にすべきだと説く者もいる。あなたの家に喪があるわけではないが、参考に幾言か書いてほしいと頼む者がいた。礼書をめくってみると、儀節は詳しく列挙されているが、一戸一戸の暮らし向きを量ってくれてはいない。\n\n厚葬の弊害をはっきり述べれば、困窮した家の重荷を一つ下ろしてやれるかもしれないが、肉親の情を軽んじると言われやすい。哀悼の心と器物の用とを分けて論じ、各家がその分に応じて礼を行えるようにすれば、言葉はより行き届くが、奢侈を好む者に旧習の言い訳として利用されるかもしれない。他人の哀しみで自分の議論を飾り立てたくはない。あなたはただ、一字一字をより慎重に書くほかなかった。"
 WJ_yinshi.3004.a:0 "礼の意と器物の用を分けて説き、家ごとに宜しきを制す。"
 WJ_yinshi.3004.b:0 "厚葬の弊害をはっきり述べ、郷里に簡素を勧める。"

 WJ_yinshi.3005.t:0 "急を救うにも順序あり"
 WJ_yinshi.3005.desc:0 "道がぬかるむ日が続き、何軒かの家で薪や食糧が一時途切れた。郷里に助けたいと思う者がいないわけではない。ただ、それぞれが聞いた事情が異なり、何度も世話を受ける者がいる一方、口に出すのを恥じて、隣人がたまたま話題にしてようやく気づかれる者もいる。相談に来た者は軒下に座り、話を聞き終えてあなたは、目の前に欠けているのが慷慨の心だけではないと悟った。\n\nまず急ぎの世話が要る事情を一戸ずつはっきり尋ね、それから交代で見舞う段取りを決めれば、取りこぼしは減らせるが、窮状が人々の噂の種にならぬよう格別の慎みが要る。各家をよく知る近隣の者にひそかに通じ合ってもらうだけなら、面目は保ちやすいが、互いの持つ情報が揃うとは限らない。紙の上なら順番を並べられるが、人の心は数字のように容易には取りまとめられない。"
 WJ_yinshi.3005.a:0 "近隣にひそかに見舞ってもらい、人前で口を開かせぬようにする。"
 WJ_yinshi.3005.b:0 "郷人を集め、急を救う順序を共に議する。"
 WJ_yinshi.3005.c:0 "まず自家の倉を開いて急を救う。"

 WJ_yinshi.3006.t:0 "垣根の一尺"
 WJ_yinshi.3006.desc:0 "垣根のほとりの雑草を刈っていると、二つの古い境界標の間に新しい竹が一叢生えているのを見つけた。隣人たちの言い分はまちまちで、木の根を境とする者もいれば、何年も前の小道の位置だけを覚えている者もいる。筍は今のところ大した値打ちもないが、争っているのは、この先何を基準とするかなのだ。あなたは門を閉ざして関わらずにいることもできる。だが皆に寛容を説くだけでは、今日の曖昧さは来年また生えてくるだろう。\n\n古い標と地勢を共に見て、確かめられる境界を先に記し、定めがたい所は共議に回せば、後日の争いは減らせるが、目の前に空白が残ることは我慢せねばならない。垣根の辺りを共に通行し利用する取り決めを先に定め、この一尺が誰のものかはひとまず争わないことにすれば、隣人の情はより保ちやすいかもしれないが、便宜上の約束も皆が長く覚えていなければならない。"
 WJ_yinshi.3006.a:0 "まず垣根の共用を約し、小さな争いで隣人の情を損なわない。"
 WJ_yinshi.3006.b:0 "古い標と地勢を共に見て、境界をはっきりさせる。"

 WJ_yinshi.3007.t:0 "郷塾で共に読む"
 WJ_yinshi.3007.desc:0 "郷里で、空き家を一軒借りて少年たちに共に読書させようという話が持ち上がったが、難しいのは書物の有無ではなかった。各家が教えたい篇目は異なり、字を覚えて書簡が書ければよいとする者もいれば、まず経書を読むべきだと譲らない者もいる。農繁期に課業が途切れ、かえって子供に怠け者の評判が立つのを心配する者もいる。皆の言い分を聞き終えて、あなたは小さな書屋一つにも多くの異なる期待がかかっていることを知った。\n\nまず誰もが使える短い章を選び、暇な時に集まって読み、忙しい時は各自で復習すると約せば、事を始めるのは容易だが、余力のある者が深く読み進められるとは限らない。程度に応じて幾つかの席に分け、先に学んだ者に初学者を導いて復唱させれば、進む者にも遅れる者にも配慮できるが、席の高下が子供同士の侮りに変わらぬよう気をつけねばならない。書物は巻に分けられても、人は学び始めの早い遅いで貴賤を分けられるべきではない。"
 WJ_yinshi.3007.a:0 "まず短い課業を定め、どの家も従えるようにする。"
 WJ_yinshi.3007.b:0 "自ら郷塾を主宰し、席を分けて授業する。"

 WJ_yinshi.3008.t:0 "社の酒宴にて"
 WJ_yinshi.3008.desc:0 "郷社の集まりで、旧例に従って酒を勧める者がいた。杯を干さぬのは郷里の情を疎んじることだという。あなたは人と同席するのが嫌いなわけではない。ただ、酒に弱い何人かが無理に付き合い、笑顔がしだいにこわばっていくのが目に入った。今席を立って辞去すれば、周りの者は名望を養う人を郷里に親しもうとせぬ冷たい客と思うかもしれない。かといって皆に倣って酒を勧めれば、自分の目に映ったものと相容れない。\n\n席に残って農時や昔話を語り、話の流れに乗せて勧酒を和らげれば、皆が和を損なわずに別の集い方へ移れるかもしれない。面と向かって酒量は人それぞれであり、杯の数で親疎を論じるべきではないと説けば、道理はより明快だが、旧例を守る者を一時気まずくさせるのは免れない。杯の酒はまだ冷めていない。人と親しくはありたいが、無理強いを礼と呼びたくはなかった。"
 WJ_yinshi.3008.a:0 "席に残って郷里の話をし、ゆるやかに勧酒を和らげる。"
 WJ_yinshi.3008.b:0 "親疎は杯の数にあらずと明言し、各自の酒量に任せる。"
 WJ_yinshi.3008.c:0 "杯を挙げて共に楽しみ、一座の歓を尽くす。"

 # ---------------------------------------------------------------- 朋友
 WJ_yinshi.4001.t:0 "夕雨に届く書簡"
 WJ_yinshi.4001.desc:0 "夕暮れの雨の中、旅人が[wj_yinshi_friend.GetName]からの書簡を届けてきた。前半には別れて以来の近況が綴られ、後半では進退の難しさに触れていた。衆意に従えば心が安らぐとは限らず、己の見解を独り貫けば知己を失うのではと恐れる、と。末尾ではただ、山中で近頃何を読んでいるかと問うていた。\n\nあなたは手紙を二度読んだ。旧友に欠けているのは大げさな道理ではなく、かつて同席して学を論じた者が今もなお真剣に耳を傾けてくれるかを知りたいのだろう。返書では世事を論じるべきか、それともまず自愛を勧めるべきか。"
 WJ_yinshi.4001.a:0 "まず旧情を述べ、自愛を勧める。"
 WJ_yinshi.4001.b:0 "問われたことを詳しく論じ、知己として憚らず語る。"

 WJ_yinshi.4002.t:0 "柴門に書き置きを残す"
 WJ_yinshi.4002.desc:0 "昔の記憶にある小道をたどって[wj_yinshi_friend.GetName]を訪ねたが、着いてみると柴の門は半ば開いたままで、庭には洗ったばかりの布が干され、炉の灰はとうに冷えていた。垣根越しに尋ねても、出かけてまだ戻らないという一言しか得られない。来る前に積もっていた話したいこと、経義の一節から道中で見たものまでが、今はすべて胸に宙吊りになっている。山の色はしだいに暗くなり、待つこともこの旅の一部になったかのようだった。\n\n門の傍らに短い書き置きを残し、最も肝心な疑問をはっきり書いて、近くに宿を探して帰りを待てば、話を尽くせるかもしれない。挨拶の一言だけを残して去り、長い語らいは次に会う時に取っておくこともできる。紙には長い道理を収められても、語り合いの中のためらいや間、心通う微笑までは収めきれないかもしれない。"
 WJ_yinshi.4002.a:0 "挨拶を一言残し、長い語らいは後日に期す。"
 WJ_yinshi.4002.b:0 "書き置きに疑問を記し、[wj_yinshi_friend.GetFirstName]の帰りを待つ。"

 WJ_yinshi.4003.t:0 "旧友の頼み"
 WJ_yinshi.4003.desc:0 "人づてに届いた一通の書簡は、ある文章に序を書いてほしいという依頼だった。差出人の[wj_yinshi_friend.GetName]はあなたとは旧交があり、文中にはあなたの清望を称える言葉も多く、読めば心を動かされずにはいられない。だが添えられた篇章をよく見ると、いくつかの論断は偏っており、伝聞をあまりにも確かなことのように書いている。巻首に署名すれば、あなたが称えているのが友情なのか見解なのか、人には見分けがつかないかもしれない。\n\n序を婉曲に断り、検討すべき点を詳しく書けば、自分の判断は守れるが、相手には学問を鼻にかけていると思われるかもしれない。それでも序を書き、文章の優れた点だけを述べ、留保の意見もはっきり伝えれば、旧情は保てるかもしれないが、読者はその留保を読み飛ばすかもしれない。山中でゆったりと筆を執れるからといって、すべての一筆が両立できるわけではない。"
 WJ_yinshi.4003.a:0 "序を書き、検討すべき点も明言する。"
 WJ_yinshi.4003.b:0 "序を辞退し、返書で詳しく検討を加える。"
 WJ_yinshi.4003.c:0 "率直に誤りを指摘し、心にもない言葉は書かない。"

 WJ_yinshi.4004.t:0 "貸した書の期限"
 WJ_yinshi.4004.desc:0 "[wj_yinshi_friend.GetName]に貸した書が約束の期日を過ぎても戻らず、あなたが机上で書いている札記には二か所の引用が欠けたままになっている。借りに来た時の相手の丁重な様子を思い出すと、軽々しく人を疑いたくはない。だが山道は遠回りで、伝言が少し行き違えば、書巻はどこか別の所に忘れられてしまうこともある。誰もが一時の好意だけで借りていくなら、いかに蔵書が豊かでも長い往来には耐えられない。\n\n手紙で返却を促し、急ぎ必要な理由を説明すれば、約束を守らせつつ、遅れが実際に迷惑であることも相手に伝わるが、語気が少し強すぎれば貸し借りの情を損ねかねない。別の写本をしばらく借りて校読を続け、相手とは改めて返却の期日を約せば、当面は穏やかに済むが、期限をそのまま空文にしてしまうわけにもいかない。あなたは以前の借用の書付を取り出し、責める文句を何度も書き直した。"
 WJ_yinshi.4004.a:0 "別の写本を借りて読み続け、改めて返却期日を約す。"
 WJ_yinshi.4004.b:0 "急ぎ必要であると伝え、[wj_yinshi_friend.GetFirstName]に約束どおり返却を求める。"

 WJ_yinshi.4005.t:0 "清名と旧知"
 WJ_yinshi.4005.desc:0 "[wj_yinshi_friend.GetName]との往来を控えるよう勧める者がいた。その人物は近頃権門に阿り、名声はもはや昔ほどではないという。だがあなたが知っているのは若い頃に共に過ごした些細な出来事だけで、今の振る舞いを保証することもできなければ、村の噂話を自分の目で見たことのように扱うつもりもない。門を閉ざして以来、世の事はいつも幾重もの伝聞を経て届く。そしてよりによって節義をめぐる評価ほど、人に立場の表明を迫るものはない。\n\nまず手紙で尋ね、聞いたことと疑問を率直に述べれば、少なくとも旧友に弁明の機会を与えられるが、外の者からは庇い立てと見られるかもしれない。しばらく往来を控えつつ、皆と一緒に品評することもしなければ、自分の分は守れるが、相手が最も直言を必要とする時に友としての務めを欠くかもしれない。書きかけの宛名を紙の端で止めたまま、あなたは本当に守りがたいのは軽率でないことだと思った。"
 WJ_yinshi.4005.a:0 "しばらく往来を控え、明らかでない話は伝えない。"
 WJ_yinshi.4005.b:0 "手紙で率直に問い、真相を求める。"

 WJ_yinshi.4006.t:0 "切れた弦と友の訪れ"
 WJ_yinshi.4006.desc:0 "[wj_yinshi_friend.GetName]が訪ねてきた時、あなたはちょうど長く仕舞っていた琴を布袋から取り出したところだった。数音試しただけで、古い弦が一本ゆるんで切れた。[wj_yinshi_friend.GetFirstName]は間の悪い時に来たと笑い、自分も久しく琴を弾いていないと言った。窓の外には風があり、切れた音はすぐに散ったが、指先にはまだ先ほど成りきらなかった曲の趣が残っている。\n\n机上には予備の弦があり、古い譜も書物の下に挟んである。だが弦が切れた後のわずかな余韻は、二人の心に絡みついて、いつまでも散ろうとしなかった。"
 WJ_yinshi.4006.a:0 "共に新しい弦を張り、古い曲を取り戻す。"
 WJ_yinshi.4006.b:0 "この余韻に乗って、即興で新しい曲を合奏する。"

 WJ_yinshi.4007.t:0 "竹林の清談"
 WJ_yinshi.4007.desc:0 "何人かの友人が竹林のほとりで小さな集まりを約し、[wj_yinshi_friend.GetName]もその中にいた。話題は経義の一句から時局へ移り、時局からまた人性の善悪へと戻り、語るほどに遠くへ広がっていく。舌鋒鋭い者もいれば、ただ微笑んで黙っている者もいる。あなたの番になると、皆が静まり返った。\n\n近頃あなたには確かに心得があり、長らく胸に秘めていた。ただ、ひとたび口を開けば、この一座の行方はもはや他の者の手に委ねられなくなるだろう。"
 WJ_yinshi.4007.a:0 "静かに皆の論を聞き、時折一言挟む。"
 WJ_yinshi.4007.b:0 "話の主導を引き取り、この一座を取り仕切る。"

 WJ_yinshi.4008.t:0 "雪の夜に友を訪ねる"
 WJ_yinshi.4008.desc:0 "夜のうちに大雪が降り、窓を開けると四方の野は一面の白だった。あなたは急に[wj_yinshi_friend.GetName]に会いたくなった。炉を囲んで語り合いたい。だが雪は深く道は遠い。今発てば着く頃には夜が明けているだろうし、相手が家にいるとも、都合がよいとも限らない。\n\n炉の火は消えかけているのに、窓の外の雪明かりは眠れぬほどに明るかった。"
 WJ_yinshi.4008.a:0 "一通の手紙をしたため、雪が晴れたら会おうと約す。"
 WJ_yinshi.4008.b:0 "興に乗って出かけ、門に着いてから考える。"

 # ---------------------------------------------------------------- 邀请
 WJ_yinshi.5001.t:0 "辟書、衡門を叩く"
 WJ_yinshi.5001.desc:0 "庭にはまだ昨夜の雨の名残がある。門の外にふいに車馬が止まった。使者は衣の塵を払い、[actor.GetName]の辟書を差し出した。府中に席を空けて待っている、山を出て共に事を議してほしいという。書には官禄のことは並べられておらず、ただ天下はいまだ安らかならず、読書人もまた担うべきものがあると記されていた。\n\nあなたは書を机上に置き、長いあいだ答えなかった。門を閉ざせば一身の志は守れるが、世の事まで門の外で止めておくことはできない。召しに応じれば学んだことをいささか生かせるかもしれないが、以後は府主の知遇と託された務めを背負わねばならない。使者はなお階下で控え、あなたが返書をしたためるのを待っている。"
 WJ_yinshi.5001.a:0 "書巻をまとめ、使者に従って府へ赴く。"
 WJ_yinshi.5001.b:0 "知遇に謹んで感謝しつつ、この身はまだ出られぬと断る。"

 WJ_yinshi.5002.t:0 "郷論、郡府に入る"
 WJ_yinshi.5002.desc:0 "訪ねてきた郷老によれば、あなたはめったに宴席に出ないのに、その名はすでに郷里の議論の中で広まっているという。節操を称える者もいれば、世家の子弟が郷党の後押しを受けた以上、いずれ郷党のために何かせねばならぬと言う者もいる。今、[actor.GetName]はこれをもとにあなたを孝廉に挙げ、[actor.GetTopLiege.GetPrimaryTitle.GetNameNoTier]に推薦しようとしている。\n\n推挙状が目の前に届けられ、末尾にはあなたの返答を待つ空欄がある。推挙を受けたからといってすぐに帯を締めて任官するわけではないが、この郷評がひとたびあなたの名に帰すれば、以後の言行はもはや自分の家だけのことではなくなる。"
 WJ_yinshi.5002.a:0 "この郷挙を受け、山を出る。"
 WJ_yinshi.5002.b:0 "徳行いまだ充たず、他の賢者を挙げられたい。"

 WJ_yinshi.5003.t:0 "山中にも経世の学あり"
 WJ_yinshi.5003.desc:0 "[actor.GetName]からの書簡が一巻の古い注釈の上に置かれている。書中ではあなたの近頃の議論に触れ、山林にも時務を識る者は少なくないとして、あなたを茂才に推薦したいという。紙上の幾句かの称賛は、よりによってあなたが誰も気に留めていないと思っていた見解ばかりであった。\n\nあなたはもともと文章をもって仕官を求めるつもりはなかったが、学んだことは書斎に留めておくほかないと決めつけたこともない。推挙を受けることは、この学問がなお世に用いられうると認めることである。いつ出仕し、誰のために尽くすかは、なお慎重に自ら選ぶべきであろう。"
 WJ_yinshi.5003.a:0 "この推挙を受け、山を出る。"
 WJ_yinshi.5003.b:0 "名と実がいまだ伴わず、先んじる勇はない。"
 WJ_yinshi_invite_lapsed_tt:0 "書簡で約されたことはすでに空言となったが、あなたはそれでも山を出る。"

 WJ_yinshi.5101.t:0 "官誥、門に至る"
 WJ_yinshi.5101.desc:0 "使者が届けた文書にははっきりと書かれていた。あなたの名に一つの官職が加えられ、即日赴任せよと促している。郷人は知らせを聞いて皆祝いに訪れ、隠者もやはり結局は出て事を為すのだと言った。机上の読みかけの書を見つめ、あなたはしばし、どちらを先に手放すべきか分からなかった。\n\nこの官職を受ければ、それは出山であり、これからの日々はもはや自分だけのものではない。辞して受けなければ、印綬をそのまま送り返し、これまでどおり山居の日々を送ることになる。"
 WJ_yinshi.5101.a:0 "命を受けて山を出で、託されたことに背かない。"
 WJ_yinshi.5101.b:0 "官を辞して受けず、印綬を封還する。"
