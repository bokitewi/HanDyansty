 SG_Nianhao_event.010_t:0 "年号の選定 — 封禅紀事"
 SG_Nianhao_event.010_d:0 "有司は新元に事績を記す名を付けたいと考えている。封禅や郊祀を記すもの、宮室の落成を記すものなど、候補はそれぞれ指すところがある。何度か説明を受けた後、あなたは彼らをひとまず止め、案だけを机の上に残させた。\n\n果たしてどの事が今後の紀年に書き込むに値するか、それはあなたが決めねばならない。"
