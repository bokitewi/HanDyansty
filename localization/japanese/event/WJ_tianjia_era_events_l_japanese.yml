 SG_Nianhao_event.013_d:0 "候補はひとまず片付けられ、机の前には一つの空白だけが残された。あなたは筆を握ったまま下ろさず、まず心中で選んだ文字を一度黙誦する。\n\nこれより先、捷報であれ急報であれ、すべてこの名をもって歳月を記すことになるのだ。"
