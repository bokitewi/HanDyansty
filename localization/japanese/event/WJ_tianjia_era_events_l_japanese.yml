l_japanese:
 SG_Nianhao_event.001_t:0 "改元$Color_ZanBai$「[SCOPE.sC('wj_era_author').Custom('SanGong_NianHao')]」の詔"
 SG_Nianhao_event.001_d:0 "改元の詔書はすでに下され、今後は#high [SCOPE.sC('wj_era_author').Custom('SanGong_NianHao')]#!をもって紀年とする。\n\nあなたは、これから詔令や簿冊に書き込まれていくその名を読む。旧年の多くの事は、年号を改めたからといって自ずと消え去るわけではない。新元に託された願いは、結局のところ今後の政事によって一つ一つ実現されねばならないのだ。\n\n[SCOPE.sC('wj_era_author').Custom('SanGong_NianHao_tt')]"
 SG_Nianhao_event.001.a:0 "新元すでに立ち、歳序は改まる。"
 SG_Nianhao_event.002_t:0 "年号の選定"
 SG_Nianhao_event.002_d:0 "有司が議定した年号案を奉呈し、まず今回の改元にどのような意を込めるかを伺った。祥瑞、修徳、更始、武功と、諸儒はそれぞれ一説を唱え、殿中はたちまちまた議論となった。\n\nあなたは手を挙げて一同を制した。字もまだ定まらぬうちから、今後の詔書のために多くを語りすぎている。込める意が定まれば、名目は自ずとそれに従う。もし諸案がどれも意に適わなければ、あなた自ら筆を執るほかない。"
 SG_Nianhao_event.002.a:0 "祥瑞符応"
 SG_Nianhao_event.002.b:0 "天象暦法"
 SG_Nianhao_event.002.c:0 "徳政教化"
 SG_Nianhao_event.002.d:0 "祈福頌安"
 SG_Nianhao_event.002.e:0 "更始中興"
 SG_Nianhao_event.002.f:0 "継承紹述"
 SG_Nianhao_event.002.g:0 "軍事武功"
 SG_Nianhao_event.002.h:0 "封禅紀事"
 SG_Nianhao_event.002.i:0 "四字年号"
 SG_Nianhao_event.002.j:0 "長字年号"
 SG_Nianhao_event.002.k:0 "卜筮に委ねる"
 SG_Nianhao_event.002.l:0 "自ら年号を考える"
 SG_Nianhao_event.002.m:0 "前のページに戻る"
 SG_Nianhao_event.003_t:0 "年号の選定 — 祥瑞符応"
 SG_Nianhao_event.003_d:0 "祥瑞に由来する年号があなたの前に並べられ、礼官は一つ読み上げるごとに、その込められた意を一言解説する。甘露の降下、黄龍の出現、鳳凰の飛来——前代の史官が恭しく記録した符応が、今また一つ一つ机の上に並べられた。\n\nあなたは聞き終えると、文書を近くに置いておくよう命じ、もう一度初めから読み上げるには及ばないと告げた。"
