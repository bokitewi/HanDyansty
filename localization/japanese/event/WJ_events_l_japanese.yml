# 汉晋风华：按类型整合；键名与现行文本保留。来源逐键见本批manifest。

 # 来源：localization/replace/simp_chinese/WJ_xiaolian_direct_qualification_l_simp_chinese.yml
 WJ_recommendation_reply.0001.desc:0 "明公が私を孝廉に挙げてくださったこと、謹んで書をもってお受けいたします。\n\nお手紙が届いたとき、私は幾度も読み返して、ようやく自分の名が本当に挙状に記されたと信じることができました。郷里の評判など、これまでは断片的に耳にするだけでした。今日明公の一言による推挙を得て、喜びのほかに、今後の一言一行がこれまで以上に人目にさらされることも承知しております。\n\n先日話し合った諸事は、必ず一つ一つ約束を果たします。知遇の恩は一通の書では尽くせませんが、まずはこれをもって明公にお伝えいたします。私は推挙をお受けいたします。"
 WJ_recommendation_reply.0101.desc:0 "お手紙のご依頼、承知いたしました。今年の孝廉には、[secondary_actor.Custom('WJ_GetLinkedUIName')]を挙げましょう。\n\n挙状において、人々が見るのは推挙される者だけではなく、挙主の眼力でもあります。私がこれに署名する以上、軽んずるつもりはありません。ただ、今後いかに身を立て職務を果たすかは、結局のところ本人が担うべきことです。\n\n話し合った諸事も、すべてそのとおりにいたします。どうかお伝えください。今日の一枚の挙状は、彼のために扉を一つ開けたにすぎないと。"

 # 来源：localization/simp_chinese/WJ_bizhao_reply_l_simp_chinese.yml
 WJ_bizhao_reply.0001.a:0 "卿の助力を得られるとは、実に良い。"
 WJ_bizhao_reply.0001.desc:0 "辟書が届き、読み終えて大いに喜びました。明公に見捨てられず、私は召しに応じて幕府に入ることを願い、話し合った諸事もすべて遵守いたします。\n\nかつて府中の事務について人から聞いても、いつも伝聞を一枚隔てたものでした。今こうして自ら経験できることとなり、恐れもありますが、期待も抱いております。着任後は、どうか古い簿書と未了の案件をあわせてお引き渡しいただき、早く慣れて、徒に一席を占めることのないようにしたく存じます。\n\n知遇の恩は肝に銘じ、多くの儀礼的な言葉は控えます。共に事に当たること久しくなりましたら、改めて明公に、私がいかほど役に立つかをお見定めいただきたく存じます。"
 WJ_bizhao_reply.0002.a:0 "そうであれば、無理強いはすまい。"
 WJ_bizhao_reply.0002.desc:0 "辟書はすでに拝受いたしました。ご厚意の深さに幾度も読み返し、感じ入らずにはおれません。ただ、このたびはどうしても召しに応じかねます。返書が遅れたのも、一通の辞退の書が軽んじているように見えはしないかと恐れたためです。\n\n再三思案いたしましたが、まだ自分が担いきれない職任を先に引き受けることはできません。府中が急いで人を求めているのであれば、私が情に流されて頷き、後になって責任逃れをするようでは、かえって皆様に迷惑をかけることになります。幕中の席は、どうか別に賢者をお選びになり、私のために空けておかれませぬよう。\n\nこのたび共に事に当たれないのは、お招きの情を受け取らぬからではありません。謹んで書をもってお答えいたします。明公のご寛恕を願います。"

 # 来源：localization/simp_chinese/WJ_district_war_l_simp_chinese.yml
 WJ_district.200.desc:0 "軍前の戦いはいまだ止まず、謹んで都督に援軍を請います。\n\n各部はなお持ちこたえておりますが、現有の兵力だけで長く渡り合っていては、手が回らなくなる恐れがあります。それゆえ使者を遣わして必要なものを申し述べるのであり、万策尽きてから慌てて急を告げるような真似はいたしません。\n\nもし都督自ら大軍を率いてお越しくだされば、それこそ全軍上下の望むところです。もし別の軍務にお忙しいのであれば、本区の戦える将を選んで救援に遣わしてください。その将と敵情を通じ合い、共に連携を図りたく存じます。首を長くしてご返事をお待ちしております。"
 WJ_district.200.dispatch:0 "別に部将を救援に遣わす。"
 WJ_district.200.personal:0 "わしが自ら本部を率いて救援に赴こう。"
 WJ_district.201.desc:0 "先に援軍を請うた件、今や目処がついた。[SCOPE.sC('wj_dd_target').Custom('WJ_GetLinkedUIName')]が部隊を率いてあなたの戦争に加わった。\n\n軍前で最も恐れるのは、長く待っても音沙汰がないことである。ゆえに戦果を待たず、まずこの知らせを届けさせた。今後両軍は敵情を通じ合い、軍令を引き継ぎ、各部が互いの所在を知るようにせねばならぬ。各自が一隅を守るばかりで、敵に臨んで初めて互いを探すようなことがあってはならない。\n\n進退の宜しきは、なお兵勢と道路を見極めて定めるべきである。この書を受け取ったら、早く援軍に必要なものを伝えるがよい。"
 WJ_district.202.desc:0 "[SCOPE.sC('wj_dd_beneficiary').Custom('WJ_GetLinkedUIName')]が急を告げて援軍を求めている。今、あなたに部隊を率いてその戦争に加わることを命じる。\n\n救援を受ける側は久しく返事を待っている。あなたは援軍がすでに途上にあることを早く知らせねばならない。今後の軍情、道路、連携の諸事は、互いに明確に伝え合うこと。文書の上で同じ軍に名を連ねるだけで、敵に臨んで互いを知らぬようなことがあってはならない。\n\n進退は、形勢を見極めて行うべきである。この書はあなたに援戦の責を授けるのみであり、勝敗は陣前にかかっている。"

 # 来源：localization/simp_chinese/WJ_kaoke_duties_l_simp_chinese.yml
 wj_kaoke_duties.1001.a:0 "私財を投じて糧を補い、被災戸を再調査する。"
 wj_kaoke_duties.1001.a.tt:0 "郡中ではこれを善政とみなし、今年の考課に記録される。"
 wj_kaoke_duties.1001.b:0 "被災状況を詳しく報告し、分割納入を願い出る。"
 wj_kaoke_duties.1001.b.tt:0 "この件は慣例どおり考簿に記録され、功も過もない。"
 wj_kaoke_duties.1001.c:0 "従来どおりの額で取り立て、さらに手数料を徴収する。"
 wj_kaoke_duties.1001.c.tt:0 "苛斂誅求の評判が広まり、考課の際に汚点となるおそれがある。"
 wj_kaoke_duties.1001.d:0 "自ら倉簿を調べ、滞納分を取り立てる。"
 wj_kaoke_duties.1001.d.failure:0 "滞納分はもはや取り立てようがなく、督促はかえって秩序を乱した"
 wj_kaoke_duties.1001.d.failure.tt:0 "督促が秩序を乱し、考課の際に過失として記録されるのは避けられない。"
 wj_kaoke_duties.1001.d.success:0 "倉簿を突き合わせ、隠匿されていた税糧を取り戻した"
 wj_kaoke_duties.1001.d.success.tt:0 "滞納の回収に功があり、考課の際に一つ記録できる。"
 wj_kaoke_duties.1001.desc:0 "計吏は納めるべき税糧の数を木牘に記したが、倉曹は空の斛をあなたの机の前に押し出した。春の出水が低い田を水浸しにし、秋の収穫もさらに一割減った。上府からの督促状は旧来の額しか認めず、田にどれほど残っているかは問わない。\n\n門下掾は、不足分をまだ逃散していない戸に割り当てるよう進言した。郷老はそれを聞くとひれ伏し、去年隣家のために糧を立て替えた者は、今年すでに耕牛を売ったと言う。倉簿の滞納は年月が深く、どれほど取り戻せるのか誰にもはっきりとは分からない。\n\n木牘の末尾は署名の欄が空いている。帳簿は辻褄を合わせられても、来年の田に、なお耕す者がいるとは限らない。"
 wj_kaoke_duties.1001.t:0 "帳簿は満ちて、倉は空"
 wj_kaoke_duties.1002.a:0 "資金を出して田を測量し、保証状を突き返す。"
 wj_kaoke_duties.1002.a.tt:0 "田の境界が明らかに裁定され、考課の際に一功として記録されよう。"
 wj_kaoke_duties.1002.b:0 "田の境界を封鎖し、元の戸に先に耕作を許す。"
 wj_kaoke_duties.1002.b.tt:0 "案牘は考簿に記録され、功も過も見られない。"
 wj_kaoke_duties.1002.c:0 "謝礼を受け取り、新しい帳簿に従って結審する。"
 wj_kaoke_duties.1002.c.tt:0 "賄賂を受けて曲げて裁いたことは、考課の際に隠し通すのは難しかろう。"
 wj_kaoke_duties.1002.d:0 "里正と隣人を呼び集め、法廷で対質させる。"
 wj_kaoke_duties.1002.d.failure:0 "証人が証言を翻し、官府の裁定はかえって郷中の笑い物となった"
 wj_kaoke_duties.1002.d.failure.tt:0 "裁定が郷里で笑い話として広まり、考課の際に過失として記録されるのは避けられない。"
 wj_kaoke_duties.1002.d.success:0 "証言が古い証文と一致し、豪族は侵した田を返還した"
 wj_kaoke_duties.1002.d.success.tt:0 "法廷で明らかに裁き、考課の際に一つ記録できる。"
 wj_kaoke_duties.1002.desc:0 "数戸の小民が古い証文を手に訴え出た。郷中の大姓が境界石を立て直し、彼らの田を自家の荘園に取り込んだのだという。相手が差し出した新しい帳簿には印がすべて揃っているが、記した書佐はまさにその家の姻戚である。案巻には刃傷沙汰は見えないが、畦の向こうではもう誰も種を蒔こうとしない。\n\n主簿は小声であなたに注意を促した。大姓が差し出した保証状には地元の名士が何人も署名しており、どの一人も軽々しくは退けられない。古い証文があるとはいえ、里正と隣接する田の者が法廷で証言しなければ、境界は裁定し難い。\n\n大姓はひとまず工事を止めて境界を協議することを望み、別に謝礼も用意していた。小民が問うのはただ一つ――来年、元の田に戻れるのかどうか。"
 wj_kaoke_duties.1002.t:0 "阡陌の間"
 wj_kaoke_duties.1003.a:0 "資金を立て替えて運送を雇い、自ら日程を組む。"
 wj_kaoke_duties.1003.a.tt:0 "駅路は滞りなく通じ、考課の際に一功として記録されよう。"
 wj_kaoke_duties.1003.b:0 "急ぎの務めを先に処理し、残りは延期を申請する。"
 wj_kaoke_duties.1003.b.tt:0 "この件はいつもどおり考簿に記録され、功も過もない。"
 wj_kaoke_duties.1003.c:0 "定額どおり人夫を徴発し、さらに免役銭を徴収する。"
 wj_kaoke_duties.1003.c.tt:0 "賦役を増やして銭を取り立てたことは、考課の際に汚点となるおそれがある。"
 wj_kaoke_duties.1003.d:0 "自ら伝舎に赴き、区間ごとに交代させる。"
 wj_kaoke_duties.1003.d.failure:0 "引き継ぎが期限に遅れ、人馬は疲弊し、沿道の秩序が損なわれた"
 wj_kaoke_duties.1003.d.failure.tt:0 "期限に遅れ、考課の際に過失として記録されるのは避けられない。"
 wj_kaoke_duties.1003.d.success:0 "人馬の交代が整然と行われ、急ぎの務めは期日どおりに引き渡された"
 wj_kaoke_duties.1003.d.success.tt:0 "差配が適切で、考課の際に一つ記録できる。"
 wj_kaoke_duties.1003.desc:0 "駅吏が三通の急牒を差し出した。一通は府庫への糧物の送付を、一通は伝車の継ぎ替えを、もう一通は沿道の人夫の徴発を催促するものである。いくつもの期限が重なり、駅馬は骨が浮き出るほど痩せている。村は農作業の真っ最中で、さらに働き手を引き抜けば、この季節の収穫が遅れてしまう。\n\n都吏が指を折って計算してみせる。車を雇い人夫を募るには金がかかる。務めをまとめて区間ごとに継送するには、誰かが遅延の責を負わねばならない。一件ずつ緩急を申請すれば、上府との文書のやり取りも欠かせない。\n\n駅の門の外では、務めを待つ人々が農具を壁際に立てかけている。彼らがあなたの署名を待っているのは、ここ数日の道程であると同時に、家の田が空いたままになる日々でもある。"
 wj_kaoke_duties.1003.t:0 "伝舎に暇人なし"

