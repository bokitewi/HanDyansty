 WJ_langguan_xuncha.0001.a:0 "儀仗を整え、四境を巡視する。"
 WJ_langguan_xuncha.0001.desc:0 "あなたは属吏を率いて城を出て巡察し、沿道の吏民が道の両側に並んで出迎えた。"
 WJ_langguan_xuncha.0001.t:0 "郎官の巡行・巡察"
 WJ_langguan_xuncha.0002.a:0 "法廷に上がって案件を審理し、是非を明らかに裁く。"
 WJ_langguan_xuncha.0002.desc:0 "県の役所には未決の案件が山積し、吏民の訴えは絶えない。"
 WJ_langguan_xuncha.0002.t:0 "郎官の巡行・裁判"
 WJ_langguan_xuncha.0003.a:0 "貧しき者を訪ね苦しみを問い、民情をつぶさに察する。"
 WJ_langguan_xuncha.0003.desc:0 "田畑の老農にも市井の商人にも、それぞれの苦楽がある。"
 WJ_langguan_xuncha.0003.t:0 "郎官の巡行・民情を問う"
 WJ_langguan_xuncha.0100.a:0 "このたびの巡行で、得るところは多かった。"
 WJ_langguan_xuncha.0100.desc:0 "数か月の巡行で、政務に次第に慣れ、賢望も次第に増した。"
 WJ_langguan_xuncha.0100.t:0 "郎官の巡行・署への帰還"
 WJ_recommendation_reply.0001.a:0 "よし、朝廷のために一人の士を得たことになろう。"
 WJ_recommendation_reply.0001.t:0 "孝廉察挙への返書"
 WJ_recommendation_reply.0002.a:0 "人にはそれぞれ志がある。別の賢者を選ぼう。"
 WJ_recommendation_reply.0002.desc:0 "明公が私を孝廉に挙げてくださるとのお手紙、拝読いたしました。ご厚意はまことに深いものです。ただ、このたびはどうしてもお受けいたしかねますので、明公に早くお知らせできるよう、謹んでご返事申し上げます。\n\n「辞退」の二文字を書くのは容易ではなく、この一枠を得るのが容易でないことも承知しております。しかし、一時の感激でお受けして、後に迷いから挙主に余計なお手数をおかけするようでは、かえって今日のご期待にいっそう背くことになります。挙状には私の名を記されず、別に賢者をお求めください。\n\n推挙をお受けできずとも、知遇の情は肝に銘じております。謹んでここにお伝えいたします。明公にはどうかお気になさいませぬよう。"
 WJ_recommendation_reply.0002.t:0 "孝廉察挙への返書"
 WJ_recommendation_reply.0101.a:0 "謹んで知遇に感謝いたします。"
 WJ_recommendation_reply.0101.t:0 "孝廉推挙の依頼への返書"
 WJ_recommendation_reply.0102.a:0 "別の機会を待つほかあるまい。"
 WJ_recommendation_reply.0102.desc:0 "ご依頼は詳しく拝見しました。今年の孝廉の選において、私は[secondary_actor.Custom('WJ_GetLinkedUIName')]を挙げることはできません。率直にご返事いたしますので、怠慢と思われませぬよう。\n\n人から頼みを受けると、つい含みを残した言葉を返したくなるものです。しかし相手が仕官の望みをこれに託している以上、私がいつまでもはっきり言わずにいれば、人をむなしく待たせるだけです。今の私には、まだその人物をこのように推すことはできません。挙状が定まる前にはっきり申し上げておくほうがよいと考えます。\n\nこの件はこれで打ち切りとしてください。後日別の機会があれば、改めて相談いたしましょう。"
 WJ_recommendation_reply.0102.t:0 "孝廉推挙の依頼への返書"
 WJ_recommendation_reply.0201.a:0 "この推挙は公論に背かぬであろう。"
 WJ_recommendation_reply.0201.desc:0 "明公に茂才に挙げていただき、謹んでお受けいたします。お手紙を読み終えると、これまで机上で思いめぐらすだけだったあれこれが、急に試す機会を得たように思えました。\n\n平素政治を論じるときは、いくらでも悠然と語ることができます。いざ職務に就いてこそ、学問が実際にどれほど役立つのかが分かるものです。一通の推薦書を頼みに万事をこなせると大言するつもりはありませんが、ひたすら辞退するのも、今日の明公のご推挙に背くことになります。\n\n話し合った諸事はすべて承知しており、必ず約束を果たします。まずはこの書を奉り、推挙に応じる意を明らかにいたします。明公の知遇には、今後政績をもってお報いし、推挙された者に聞こえのよい名だけが残るようなことはいたしません。"
 WJ_recommendation_reply.0201.t:0 "茂才察挙への返書"
 WJ_recommendation_reply.0202.a:0 "そうであれば、別に賢才を探そう。"
 WJ_recommendation_reply.0202.desc:0 "明公が私を茂才に挙げてくださるとのお手紙、確かに拝受いたしました。ご厚意を軽々しく忘れることはできません。ただ、このたびはどうしてもお受けできませんので、挙状に私のための空きが残されたままにならぬよう、まず書をもって辞退いたします。\n\n人に推されるのは本来喜ばしいことで、筆を執って断る前に、私も再三ためらいました。しかし今、腹を据えて担うことができない以上、先にその名を取って、後になって口実を探して逃れるべきではありません。もしこれによって明公を失望させるとすれば、それも私の本意ではありません。\n\n推薦の件は、どうか別の人をお選びください。お従いできずとも、このように推してくださった明公の厚意は、いつまでも感謝いたしております。"
 WJ_recommendation_reply.0202.t:0 "茂才察挙への返書"
 WJ_recommendation_reply.0301.a:0 "謹んで挙主に感謝いたします。"
 WJ_recommendation_reply.0301.desc:0 "ご依頼は拝見しました。今年の茂才には[secondary_actor.Custom('WJ_GetLinkedUIName')]を挙げることといたします。この意はすでに定まっており、これ以上お待ちいただくには及びません。\n\n朝廷に人を推薦するということは、結局のところ自分の眼力もあわせて差し出すことです。私がこのように推すのは、推挙された者に腕を振るう場があることを願えばこそです。後日その名を再び耳にするとき、聞きたいのは往年の才名だけでなく、見るべき政績でもあります。\n\n話し合った諸事は、すべてそのとおりにいたします。どうか私の承諾を伝え、あわせてこの期待も伝えてください。今日は彼のために扉を一つ開けたにすぎず、この先どこまで歩めるかは、彼自身の足にかかっていると。"
 WJ_recommendation_reply.0301.t:0 "茂才推挙の依頼への返書"
 WJ_recommendation_reply.0302.a:0 "別の挙主を探すほかあるまい。"
 WJ_recommendation_reply.0302.desc:0 "茂才推挙のご依頼について、私はすでに考えました。今年は[secondary_actor.Custom('WJ_GetLinkedUIName')]を挙げることはできません。謹んで書をもってはっきりお伝えいたします。\n\n使いの方の懇切な申し出はすべて伺いましたが、それでも推薦書に筆を下ろすには足りません。もし先に「改めて相談しよう」と一言約束し、皆様にこのために奔走させ続けて、後で果たせなければ、かえって情誼をいっそう損ねることになります。承諾できない以上、返事を遅らせることで辞退を避けるべきではありません。\n\nこの件はこれまでとし、今年の推薦書のためにこれ以上お待ちにならないでください。ご厚意はありがたく心に留めておきます。"
 WJ_recommendation_reply.0302.t:0 "茂才推挙の依頼への返書"
 wj_temp_official.1000.a:0 "一項目ずつ照合し、食い違いを直に指摘する。"
 wj_temp_official.1000.b:0 "旧来の形式どおりに再検査し、確かな誤りのみを報告する。"
 wj_temp_official.1000.desc:0 "[wj_assessment_examiner.Custom('WJ_GetLinkedUIName')]は一冊の計簿をあなたの前に押しやり、治国の道は問わず、ただその中の戸口・田租・倉穀の数を見よと命じた。\n\nあなたが数ページめくると、前後で合わない箇所がいくつかあることに気づいた。一項目ずつ照合すれば、誰かが故意に隠した誤りを暴けるかもしれないが、判断を誤れば、かえって自分の平素の職務の手落ちを露呈しかねない。旧来の形式どおりに再検査するだけなら、間違える恐れは少ないが、それで優れた評語を得るのも難しい。\n\n考官は急かさないが、机の傍らにはすでに筆が用意されている。この回に差し出すものは、あなたが本当に理解したものでなければならず、空疎な善政の言葉でごまかすことはできない。"
 wj_temp_official.1000.t:0 "仮吏考課：簿書の精査"
 wj_temp_official.1001.a:0 "緩急を量り、別に規程を起草する。"
 wj_temp_official.1001.b:0 "謹んで常例に従い、先に救済してから徴収する。"
 wj_temp_official.1001.desc:0 "計簿が下げられたばかりのところで、考官は別の問いに替えた。水害と旱魃の後、倉の糧食は限られているのに、救済の貸与を求める者は少なくない。しかも地元の豪族は先に取り分を得ようとしている。あなたはどう処置するか？\n\n先ほど向き合ったのは帳簿上の数字にすぎなかったが、今度は一つ一つの順序がそれぞれ別の人々に関わっている。別に規程を起草するなら、救済・徴税・治安の間の絡み合いに配慮しなければならない。常例を謹んで守れば、無難ではあるが、得られるのは間違いのない答えというだけである。\n\nあなたは口元まで出かかった「仁政」の二文字を呑み込んだ。考官が聞きたいのは、あなたが民をいかに慈しむかではなく、糧食が本当に足りないとき、まず何をするつもりかということなのだ。"
 wj_temp_official.1001.t:0 "仮吏考課：臨機の処断"
 wj_temp_official.1002.a:0 "得失を率直に述べ、改革の策を箇条書きにする。"
 wj_temp_official.1002.b:0 "成例のみを述べ、空言は弄さない。"
 wj_temp_official.1002.desc:0 "簿書と治事の二問は終わったが、[wj_assessment_examiner.Custom('WJ_GetLinkedUIName')]は筆を置かなかった。「あなた自身のことを話してもらおう。試守してからこれまで、どの件が最もうまくいき、どの件を最も改めるべきか？」\n\nあなたが用意していた決まり文句は、急にどれも口にできなくなった。前の二問なら他所の県邑や仮定の災害を論じることもできたが、この問いは人名も経緯も記録で確かめられる。深く語れば腕前を示せるかもしれないが、うまく語れなければ、平素隠してきた手落ちを自ら差し出すことになる。\n\nあなたは姿勢を正し、一息置いた。旧来どおり無難なことだけを語るか、それとも心中で考えてきた改革の策を洗いざらい打ち明けるか。考官の筆先はなお宙に浮いたまま、あなたが口を開くのを待っている。"
 wj_temp_official.1002.t:0 "仮吏考課：吏部での奏対"
 wj_temp_official.1005.a:0 "課第を謹んで受け、正式に仕官する。"
 wj_temp_official.1005.b:0 "失点を心に刻み、来年再び考課を受ける。"
 wj_temp_official.1005.desc:0 "簿書、治事、そして最後の陳奏がすべて終わった。考官は数回分の記録を一つにまとめ、さらにあなたの平素の賢望を参照して、ようやく課第をあなたの前に差し出した。\n\n先ほどまでは言葉で取り繕えたところも、今やすべて紙の上に記されている。あなたはその評定を見つめ、試守の去就に関する最後の一言を待った。\n\n"
 wj_temp_official.1005.desc_fail:0 "「合格に及ばず」。まずその文字が目に入り、それから続く文を読み取った。官職はひとまず留め置き、引き続き仮吏として試守し、来年再び考課するという。先ほどうまく答えられなかった箇所が一斉に胸に押し寄せるが、今さら言い直しても、もはや課第に記してくれる者はいない。"
 wj_temp_official.1005.desc_good:0 "課第は良とされ、あなたの試守の職はこれをもって正式に任じられた。ここまで読んで、長く張り詰めていた心がようやく落ち着いた。評語にはまだ改めるべき点もあるが、この結果を大切にしまっておく妨げにはならない。"
 wj_temp_official.1005.desc_high:0 "課第は優とされ、あなたの試守の職はこれをもって正式に任じられた。あなたはその「優」の字を二度見返してから、使いの者がまだ簿冊を回収しようと待っていることに気づいた。試験の前に何度も練った言葉は、ついに無駄にはならなかった。"
 wj_temp_official.1005.desc_pass:0 "課第は合格とされ、あなたの試守の職はこれをもって正式に任じられた。評語を読み進めると、いくつかの不手際がなおはっきりと記されているが、幸いにも最後にあなたを門前で締め出すことはなかった。今回は、どうにか通ったのだ。"
 wj_temp_official.1005.t:0 "仮吏考課：課第の決定"

