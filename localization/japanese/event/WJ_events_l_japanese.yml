 # 来源：localization/simp_chinese/WJ_langguan_loc_l_simp_chinese.yml
 wj_langguan.1000.a:0 "率直に自らの見解を述べ、経義によってその理を折衷する"
 wj_langguan.1000.b:0 "旧注を謹んで守り、危うい解釈はしない"
 wj_langguan.1000.desc:0 "[wj_assessment_examiner.Custom('WJ_GetLinkedUIName')]はあなたに経伝を解読させ、章句の異同を弁別させたうえで、経義によって人倫に関わる疑案を一つ裁かせた。この問いは訓詁を論じるだけのように見えて、実は経を引きつつ古に拘泥しないでいられるかを見るものである。"
 wj_langguan.1000.t:0 "郎官考校：経に通じ義を明らかにする"
 wj_langguan.1001.a:0 "経義と律令を斟酌し、獄を断ずる法を詳しく述べる"
 wj_langguan.1001.b:0 "先例に従って判じ、誤りなきを期す"
 wj_langguan.1001.desc:0 "第二問は律令に移る。同じ事件に数人が関わり、情状には軽重があり、法には正条がある。主考はあなたにその場で判決を起草させる。情に流されて法を廃してもならず、法を執って義を損なってもならない。"
 wj_langguan.1001.t:0 "郎官考校：律令による裁断"
 wj_langguan.1002.a:0 "古を引いて今を証し、弊害を救う策を一通り述べる"
 wj_langguan.1002.b:0 "最も無難な救恤の常法のみを述べる"
 wj_langguan.1002.desc:0 "最後の問いは奏対である。主考は郡国で災害と凶作が起こり、盗賊が蜂起し、しかも朝廷の財用が足りないと仮定し、あなたに短い時間で先後と緩急を箇条書きで述べさせる。満座は静まり返り、竹簡のかすかな音だけが聞こえる。"
 wj_langguan.1002.t:0 "郎官考校：殿前の奏対"
 wj_langguan.1005.a:0 "謹んで考第を受け、これより署を出る"
 wj_langguan.1005.b:0 "署に留まって学業を修め、来年再び試験を受ける"
 wj_langguan.1005.desc:0 "三問が終わると、主考は巻牘を閉じ、面と向かってあなたの経術・法意・奏対を評定した。"
 wj_langguan.1005.desc_fail:0 "あなたの答えは、ある所では拘泥に失し、ある所では法意に疎く、まだ署を離れるには足りない。主考はもう一年学ぶよう命じ、来年改めて考校すると告げた。"
 wj_langguan.1005.desc_good:0 "あなたの答えは筋道がはっきりしており、時に取るべき新味もあった。評語は良好とされ、正式に孝廉出身を得るに十分である。"
 wj_langguan.1005.desc_high:0 "あなたの答えは経と法を貫き、しかも時務を的確に突いていた。評語は優秀とされた。これより署を離れて出身を得、朝中もあなたの名を記憶した。"
 wj_langguan.1005.desc_pass:0 "あなたの答えは鋭さには欠けるものの、大きな失点もなかった。評語は合格とされ、正式に孝廉出身を得ることが許された。"
 wj_langguan.1005.t:0 "郎官考校：等第の決定"

 # 来源：localization/simp_chinese/WJ_military_governance_l_simp_chinese.yml
 WJ_zhongwai.0001.a:0 "節を受け詔を奉じ、中外を総督する。"
 WJ_zhongwai.0001.desc:0 "総督中外諸軍事の詔命が読み上げられた後も、あなたはなお目の前の符節を見つめていた。今後、諸軍が節制を争い、前後の連携が取れなくなれば、誰かがその文書をあなたの机に持ってくる。もはや他の官署のことだと言い逃れはできない。\n\n詔を宣する者はしばし間を置き、あなたが詔を奉じるのを待っている。殿中のいくつかの視線がそれにつれて移ってくる。あなたを見る者もいれば、節を見る者もいて、何を推し量っているのかは定かでない。あなたは襟を正し、間もなく自分の机に回されてくるであろう軍報のことを早くも考えていた。\n\nこの権柄は輔政の任に伴って来るものであり、家門が私に伝えられるものではない。だが今、中外の軍務を統べるのはあなたである。最後の「臣、詔を奉ず」の一声は、殿上の誰もがはっきりと聞き取れるようにすべきだ。"
 WJ_zhongwai.0001.t:0 "中外を総べる詔"
 WJ_zhongwai.0002.a:0 "謹んで詔命を奉ずる。"
 WJ_zhongwai.0002.desc:0 "詔命が下された。[wj_zw_holder.Custom('WJ_GetLinkedUIName')]を総督中外諸軍事とし、黄鉞を仮す。先ほどまで小声で話していた者たちも次第に口を閉ざした。この数文字は、先の礼辞よりも人に顔を上げさせるものだった。\n\nあなたは新たに定められた節制を聞きながら、かつて各署の間をたらい回しにされた軍報のことを思い出した。今後は、誰が命令を発し、誰が伺いを立てるべきかを改めてしっかり覚えねばならない。従来どおりの経路で送られた文書は、そのまま突き返されるかもしれない。\n\n詔を伝える者はなお読み進めており、周囲の者はそれぞれの表情を浮かべている。あなたは急いで他人と論じ合うことはせず、ただその名を心に刻んだ。次に軍中で事が起きたとき、どこへ申し出るべきかは、今日から変わったのだ。"

