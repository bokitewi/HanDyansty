l_japanese:
# 清议开场 / 会期 / 散席事件文本（2026-10-08 重写）。
# 月旦评专属事件（3xxx）与新增事件（1009–1012、2009–2012）在 mechanisms/WJ_qingyi_yuedan_l_simp_chinese.yml。

 # ---------------------------------------------------------------- 通用提示
 WJ_qingyi_yd_nudge_plus1_tt:0 "#P 席上でこれにより[wj_qingyi_subject.Custom('WJ_GetUIName')]を推そうとする者が増えた#!"
 WJ_qingyi_yd_nudge_plus2_tt:0 "#P 席上でこれにより少なからぬ者が[wj_qingyi_subject.Custom('WJ_GetUIName')]の推挙に転じた#!"
 WJ_qingyi_yd_nudge_minus1_tt:0 "#N 席上でこれによりこの人物を評価しなくなった者がいる#!"

 # ---------------------------------------------------------------- 0001 候客
 WJ_qingyi.0001.t:0 "清議：席を空けて待つ"
 WJ_qingyi.0001.desc.host:0 "館舎はすでに掃き清められ、座席は両側の廊下に沿って敷かれ、机の上には経書が数巻置かれ、茶器も揃っている。あなたは門口から奥の堂へ、奥の堂から門口へと行き来し、どこかに手落ちがないかと気を揉んでいる。\n\n先に着いた何人かの客は、廊下で旧交を温めている。招待状を出した時は、誰を招くべきかばかり考えていたが、実際に人々が次々とやって来て初めて、彼らが互いに馬が合うとは限らないことに思い至った。\n\n主人たる者の難しさは、この時から始まるのだ。"
 WJ_qingyi.0001.desc.host_yuedan:0 "館舎はすでに掃き清められ、座席は両側の廊下に沿って敷かれている。今回の招待状にははっきりと記されていた――清談のほかに、当世の人物を品評すると。\n\n多くの客はまさにそれを目当てにやって来た。廊下で、あなたが誰の名を挙げるのかを小声で探る者もいれば、拱手して挨拶を交わしながらも、目はずっと門の外を窺い、まだ誰が来るのかを見ている者もいる。\n\n名簿のおおよそは、あなたの心中ですでに固まっている。皆が揃えば、席を開くことができる。"
 WJ_qingyi.0001.desc.guest:0 "あなたが門口で名を告げると、侍者が中へ案内した。廊下にはすでに何人かの客が座っており、顔見知りもいれば、名を聞くだけの者もいる。\n\n主人の[host.Custom('WJ_GetLinkedUIName')]はまだ奥の堂で采配を振るっており、机上の経巻はまだ広げられていない。人々が話しているのは、もっぱら道中の見聞や各地の近況である。\n\n本格的な議論はまだ始まっていない。あなたは席を見つけて腰を下ろし、まずはここの人々が何に関心を持っているのかを聞いてみることにした。"
 WJ_qingyi.0001.a:0 "まずは諸賢が揃うのを待とう。"

 # ---------------------------------------------------------------- 0002 主人开席
 WJ_qingyi.0002.t:0 "清議：客と主人が集う"
 WJ_qingyi.0002.desc:0 "客人がようやく全員揃い、門外の取次の声も止んだ。あなたは一同に着席を促し、最後の挨拶が途切れるのを待ってから、口を開いた。\n\n「本日ご列席の諸君は、官爵をもって高下を論じません。疑問があれば問い、見解があれば述べていただきたい。」\n\nこの言葉は清議のたびに言われるが、本当に実践できることは少ない。最初の論題を誰が出すかが、往々にしてこの数日の気風を決めるのだ。"
 WJ_qingyi.0002.desc.yuedan:0 "客人がようやく全員揃った。あなたは一同に着席を促したが、すぐには題を出さず、まず前置きをした。\n\n「本日はまず時事を論じ、次いで人物を品評します。諸君がこの数日に述べることは、最後にはいくつかの名前に行き着くでしょう。月旦がひとたび出れば、それが公論となります。諸君には慎重に、そして率直に語っていただきたい。」\n\n席はしばし静まり、すぐにさざめきが起こった。"
 WJ_qingyi.0002.desc.learning:0 "客人がようやく全員揃った。あなたは一同に着席を促すと、単刀直入に、本日諸君を招いたのは、皆様の長所を借りて自分の短所を補いたいからだと述べた。\n\n「経義に明らかでないところ、時務に通じないところがあれば、諸君は遠慮なく語ってください。私は謹んで拝聴いたします。」\n\n主人が後学をもって自任するのを見て、客人たちはかえってしばらく固くなった。幸い、ほどなくして誰かが話を引き取った。"
 WJ_qingyi.0002.a:0 "まず私が一題出そう。"
 WJ_qingyi.0002.b:0 "[wj_qingyi_opening_guest.Custom('WJ_GetUIName')]に口火を切ってもらう。"

 # ---------------------------------------------------------------- 0003 宾客入席
 WJ_qingyi.0003.t:0 "清議：席に着いて道を論ず"
 WJ_qingyi.0003.desc:0 "主人の[host.Custom('WJ_GetLinkedUIName')]が一同に着席を促し、清議の開始を告げた。席上では官爵を論じず、疑問があれば問い、見解があれば述べてよい、と。\n\nあなたは自分の席に腰を落ち着けた。同席の者の中には、以前から名を聞いていた者もいれば、今日初めて会う者もいる。この数日の議論がどのようなものになるか、今はまだ分からない。\n\nここに来る前に、この旅の目的はすでに考えてある。今こそ取りかかる時だ。"
 WJ_qingyi.0003.a:0 "礼に従って着席し、静かに出題を聞く。"
 WJ_qingyi.0003.b:0 "まず主人に礼を執って教えを請う。"
 WJ_qingyi.0003.c:0 "静かな場所を選んで座る。"

 # ---------------------------------------------------------------- 1001 清虚发端
 WJ_qingyi.1001.t:0 "清虚の口火"
 WJ_qingyi.1001.desc:0 "あなたが本日の論題を出すや否や、[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]が言葉を継いで問うた。「万物は有によってその用が見える。では器の中の空は、用と言えるのか？」\n\n何人かの客が期せずして机上の空の杯を見た。この問いは冗談のように見えて、実は有無の弁という古い題目である。うまく答えれば今日の議論に基礎ができ、答え損なえば、主人たるあなたの重みは軽くなる。"
 WJ_qingyi.1001.a:0 "玄理をもって答える。有の以て利を為すは、無の以て用を為せばなり。"
 WJ_qingyi.1001.a.success:0 "義理が一貫し、満座が首肯した"
 WJ_qingyi.1001.a.failure:0 "言葉がふらつき、かえって追及された"
 WJ_qingyi.1001.b:0 "実事によって検証する。空の杯は水を盛れ、空の倉は粟を蓄えられる。"
 WJ_qingyi.1001.b.success:0 "小をもって大を示し、一同は妙なりと称えた"
 WJ_qingyi.1001.b.failure:0 "譬えが的外れで、人を納得させられなかった"
 WJ_qingyi.1001.c:0 "列席の諸君にそれぞれ見解を述べてもらう。"

 # ---------------------------------------------------------------- 1002 折角之问
 WJ_qingyi.1002.t:0 "折角の問い"
 WJ_qingyi.1002.desc:0 "[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]はあなたの出題を聞き終えても先へ進まず、その中の一句を取り上げて、その場で問い返した。主人の言うとおりなら、自己矛盾ではないか、と。\n\nこの問いは素早く的確で、列席の者は皆杯を置いた。相手は明らかに準備してきており、必ずしもあなたを困らせるつもりではないのだろうが、いずれにせよ、この問いには答えねばならない。"
 WJ_qingyi.1002.a:0 "居住まいを正して反駁する。"
 WJ_qingyi.1002.a.success:0 "一つ一つ解き明かし、相手は感服した"
 WJ_qingyi.1002.a.failure:0 "相手に綻びを突かれた"
 WJ_qingyi.1002.b:0 "笑ってその矛先をかわす。"
 WJ_qingyi.1002.b.success:0 "軽々とやってのけ、席上に笑いが起こった"
 WJ_qingyi.1002.b.failure:0 "いささか苦しげに見えた"
 WJ_qingyi.1002.c:0 "「客人はいささか礼を失しておられる。」"

 # ---------------------------------------------------------------- 1003 经义与时务
 WJ_qingyi.1003.t:0 "経義と時務"
 WJ_qingyi.1003.desc:0 "席上で最も学問の深い[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]は、『春秋』から近年の州郡の賦役に話を進め、経義が当世に用いられないなら、いくら読み込んでも空文にすぎないと説いた。\n\nその言葉は理にかなっているが、引証のいくつかは妥当でないとあなたは感じた。その場で論じ合うか、それともこの機に教えを請うか。"
 WJ_qingyi.1003.a:0 "経を引いて事を断じ、論じ合う。"
 WJ_qingyi.1003.a.success:0 "引証が的確で、相手は感服した"
 WJ_qingyi.1003.a.failure:0 "逆に相手に訂正された"
 WJ_qingyi.1003.b:0 "虚心に教えを請う。"
 WJ_qingyi.1003.c:0 "経義と時務にはそれぞれ長所がある。優劣を比べる必要はない。"

 # ---------------------------------------------------------------- 1004 一言之鉴
 WJ_qingyi.1004.t:0 "一言の鑑"
 WJ_qingyi.1004.desc:0 "特別に招かれた名士の[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]はずっとほとんど口を開かなかったが、この時茶碗を置き、あなたに一言の評語を述べた。言葉は短いが、あなたが平素認めたくないところをまさに言い当てていた。\n\n満座があなたがどう応じるかを見守っている。"
 WJ_qingyi.1004.desc.yuedan:0 "特別に招かれた名士の[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]はずっとほとんど口を開かなかった。議論が名簿に載る[wj_qingyi_subject.Custom('WJ_GetLinkedUIName')]に及ぶと、名士は茶碗を置き、称賛の言葉をただ一言述べた。満座はたちまち静まり返った。\n\n名士の言葉の重みは極めて大きい。評主たるあなたが賛同するか反駁するかで、この人物に対する一同の見方が左右されるだろう。"
 WJ_qingyi.1004.a:0 "その言葉を謹んで受ける。"
 WJ_qingyi.1004.b:0 "何度も論弁を交わす。"
 WJ_qingyi.1004.b.success:0 "何度も応酬し、互角に渡り合った"
 WJ_qingyi.1004.b.failure:0 "論弁に勝てず、浅薄さを晒しただけだった"
 WJ_qingyi.1004.c:0 "名士の評に賛同する。"
 WJ_qingyi.1004.d:0 "その場で反駁する。"
 WJ_qingyi.1004.d.success:0 "理路整然と反駁した"
 WJ_qingyi.1004.d.failure:0 "逆に名士に言葉を詰まらされた"
 WJ_qingyi.1004.e:0 "一笑に付す。"

 # ---------------------------------------------------------------- 1005 席间月旦
 WJ_qingyi.1005.t:0 "席上の月旦"
 WJ_qingyi.1005.desc:0 "議論が人物の話に移った。ある者が[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]の近頃の行いを持ち出すと、すぐに同調する者もいれば、首を振る者もいた。\n\n一同は次第にあなたの方を見て、主人たるあなたの一言を待っている。本人の面前で品評するのだから、褒めるにも貶すにも加減を量らねばならない。"
 WJ_qingyi.1005.desc.yuedan:0 "議論が名簿に載る[wj_qingyi_subject.Custom('WJ_GetLinkedUIName')]に移った。その昔の行いを挙げて称える者もいれば、近頃の行いは必ずしも噂ほど良くないと言う者もいる。\n\n[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]は評主たるあなたに、まず断を下すよう求めた。あなたの言葉は、一同が票を投じる際に少なからず心に留められるだろう。"
 WJ_qingyi.1005.a:0 "その長所を褒める。"
 WJ_qingyi.1005.b:0 "その短所を直に指摘する。"
 WJ_qingyi.1005.b.success:0 "言葉が的確で、誰も反駁できなかった"
 WJ_qingyi.1005.b.failure:0 "言葉が人を傷つけ、わだかまりを生んだ"
 WJ_qingyi.1005.c:0 "その人物を称賛する。"
 WJ_qingyi.1005.d:0 "その人物を貶める。"
 WJ_qingyi.1005.d.success:0 "論拠が十分で、一同は納得した"
 WJ_qingyi.1005.d.failure:0 "根拠なく人を貶め、かえって公平さを欠いた"
 WJ_qingyi.1005.e:0 "論評を差し控える。"

 # ---------------------------------------------------------------- 1006 酒至微醺
 WJ_qingyi.1006.t:0 "興たけなわの時"
 WJ_qingyi.1006.desc.wine:0 "酒が何巡かすると、席上の話し声が大きくなってきた。[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]が杯を挙げて勧め、清議もここまで来たのだから、少しは堅苦しさを捨てるべきだと言う。\n\n酒は人に本音を語らせもするが、失言もさせる。主人たるあなたがどれほど飲むか、客人たちは皆見ている。"
 WJ_qingyi.1006.desc.tea:0 "茶が何度か入れ替えられ、議論も緩やかになった。[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]が茶碗を手にやって来て、数日論争した後でこのような閑暇は珍しいと言う。\n\n席上の空気は緩み、まさに平素は口にしにくいことを語る時である。"
 WJ_qingyi.1006.a:0 "杯を挙げて共に楽しむ。"
 WJ_qingyi.1006.b:0 "礼を守り自らを律する。"
 WJ_qingyi.1006.c:0 "興に乗じて人物を論評する。"
 WJ_qingyi.1006.c.success:0 "妙語が次々と飛び出し、満座が快哉を叫んだ"
 WJ_qingyi.1006.c.failure:0 "皆の前で失言した"

 # ---------------------------------------------------------------- 1007 竹下忘年
 WJ_qingyi.1007.t:0 "竹下の忘年の交わり"
 WJ_qingyi.1007.desc:0 "散会後、[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]は帰らず、あなたと共に庭の竹の下に座った。他に人はなく、話も気ままになった。若い頃に書を読んだ昔話から、ここ数年のそれぞれの境遇に至るまで。\n\nいつの間にか夜も更けていた。主人と客の区別など、今はもうどうでもよいことのように思えた。"
 WJ_qingyi.1007.a:0 "知己として迎える。"
 WJ_qingyi.1007.b:0 "家蔵の書巻を贈る。"
 WJ_qingyi.1007.c:0 "一夜の語らいで十分だ。"

 # ---------------------------------------------------------------- 1008 清议之外
 WJ_qingyi.1008.t:0 "清議の外"
 WJ_qingyi.1008.desc:0 "[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]は皆が散ってからあなたを訪ねてきた。まず社交辞令をいくつか述べると、すぐに話題を変え、ある件で便宜を図ってほしいと頼み、ささやかな礼物も用意したと言う。\n\n清議の名は本来清流に重んじられるものだが、席の後の頼み事が絶えたためしはない。"
 WJ_qingyi.1008.desc.yuedan:0 "[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]は皆が散ってからあなたを訪ねてきた。挨拶を少し交わすと、相手は声を潜め、名簿に載る[wj_qingyi_subject.Custom('WJ_GetLinkedUIName')]は得難い人材であるから、評主には皆の前でいくらか良いことを言ってほしいと頼み、ささやかな礼物も用意したと言う。\n\n月旦評にひとたび私情が混じれば、それはもはや公論ではない。"
 WJ_qingyi.1008.a:0 "贈り物を受け取る。"
 WJ_qingyi.1008.b:0 "皆の前で断る。"
 WJ_qingyi.1008.c:0 "適当にあしらい、この人情を貸しとして残す。"

 # ---------------------------------------------------------------- 2001 名教与自然
 WJ_qingyi.2001.t:0 "名教と自然"
 WJ_qingyi.2001.desc:0 "主人の[host.Custom('WJ_GetLinkedUIName')]が突然あなたを名指しして問うた。礼法名教は人の本性から出たものか、それとも聖人が世を治めるために定めたものか？\n\nこれは近頃士林で最も論争の多い題目の一つで、列席の多くはとうに持論を持っている。主人がわざわざあなたに尋ねたのは、おそらく違った説を聞きたいからだろう。"
 WJ_qingyi.2001.a:0 "名教は自然より出る。"
 WJ_qingyi.2001.a.success:0 "理の説き方が円満で、主人は頷いた"
 WJ_qingyi.2001.a.failure:0 "要領を得なかった"
 WJ_qingyi.2001.b:0 "名教は世を治めるためのものである。"
 WJ_qingyi.2001.b.success:0 "時弊を的確に突いた"
 WJ_qingyi.2001.b.failure:0 "例えが不適切だった"
 WJ_qingyi.2001.c:0 "主人に先に述べていただく。"

 # ---------------------------------------------------------------- 2002 众目相逼
 WJ_qingyi.2002.t:0 "衆目に迫られる"
 WJ_qingyi.2002.desc:0 "あなたが自分の見解を述べ終えるや、[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]が立ち上がり、一条ずつ反駁した。語気はますます強まり、ついには原典を本当に読んだのかと問いただした。\n\n満座の視線があなたに集まる。ここで一歩退けば、今後この人々の前で口を開くのは難しくなるだろう。"
 WJ_qingyi.2002.a:0 "学問をもって応じる。"
 WJ_qingyi.2002.a.success:0 "引証が詳しく明快で、相手は返す言葉がなかった"
 WJ_qingyi.2002.a.failure:0 "問い詰められて言葉に窮した"
 WJ_qingyi.2002.b:0 "言葉巧みに和らげる。"
 WJ_qingyi.2002.b.success:0 "冗談一つで膠着を解いた"
 WJ_qingyi.2002.b.failure:0 "収められなかった"
 WJ_qingyi.2002.c:0 "相手の弱点を問い返す。"
 WJ_qingyi.2002.c.success:0 "逆に一本取った"
 WJ_qingyi.2002.c.failure:0 "策に溺れた"

 # ---------------------------------------------------------------- 2003 执经请益
 WJ_qingyi.2003.t:0 "経書を携えて教えを請う"
 WJ_qingyi.2003.desc:0 "あなたが持参した書巻には、ずっと読み解けなかった箇所がいくつかある。今日は[wj_qingyi_luminary.Custom('WJ_GetLinkedUIName')]も列席している。この人物は学問が深く、平素はなかなか会えないので、まさにこの機に疑問を解くことができる。\n\nただ、皆の前で教えを請えば、自分の不足を晒すことは避けられない。"
 WJ_qingyi.2003.a:0 "面と向かって教えを請う。"
 WJ_qingyi.2003.a.success:0 "疑問がたちまち解けた"
 WJ_qingyi.2003.a.failure:0 "問いが要領を得なかった"
 WJ_qingyi.2003.b:0 "その説を書き写し、帰ってから精読する。"
 WJ_qingyi.2003.c:0 "後日に回す。"

 # ---------------------------------------------------------------- 2004 名士一顾
 WJ_qingyi.2004.t:0 "名士の一顧"
 WJ_qingyi.2004.desc:0 "特別に招かれた名士の[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]は、あなたの話を聞き終えると、振り向いてあなたをもう一度見やり、一言述べた。「この君とは語るに足る。」\n\n短い一言だが、列席の者は皆耳にした。名士の一顧は、往々にして十篇の文章よりも人の名を記憶に留めさせるものである。"
 WJ_qingyi.2004.a:0 "喜んで受ける。"
 WJ_qingyi.2004.b:0 "謙遜して辞退する。"
 WJ_qingyi.2004.c:0 "勢いに乗じて学識を披露する。"
 WJ_qingyi.2004.c.success:0 "名士は膝を打って称賛した"
 WJ_qingyi.2004.c.failure:0 "蛇足を加えてしまった"

 # ---------------------------------------------------------------- 2005 谁为上品
 WJ_qingyi.2005.t:0 "誰が上品か"
 WJ_qingyi.2005.desc:0 "誰が言い出したのかは分からないが、席上で列席者の優劣が論じられ始めた。[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]は半ば冗談めかして、今日の振る舞いからして、あなたと自分のどちらが一枚上か、皆に評してもらおうではないかと言った。\n\n冗談は冗談だが、一同は本当に成り行きを見守っている。"
 WJ_qingyi.2005.desc.yuedan:0 "一同は名簿に載る[wj_qingyi_subject.Custom('WJ_GetLinkedUIName')]について議論している。最も熱心に語っていた[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]が、振り向いてあなたの考えを尋ねた。\n\nあなた一人の言葉で結果が決まるわけではないが、説得力があれば、何人かの考えを変えることはできるだろう。"
 WJ_qingyi.2005.a:0 "貴殿を上に推そう。"
 WJ_qingyi.2005.b:0 "自らの長所を述べる。"
 WJ_qingyi.2005.b.success:0 "筋が通っていた"
 WJ_qingyi.2005.b.failure:0 "自慢が過ぎた"
 WJ_qingyi.2005.c:0 "その人物を力強く擁護する。"
 WJ_qingyi.2005.c.success:0 "何人かの客を動かした"
 WJ_qingyi.2005.c.failure:0 "誰も同調しなかった"
 WJ_qingyi.2005.d:0 "その人物の短所を力説する。"
 WJ_qingyi.2005.d.success:0 "言葉が急所を突いた"
 WJ_qingyi.2005.d.failure:0 "私情によるものと非難された"
 WJ_qingyi.2005.e:0 "人と争わない。"

 # ---------------------------------------------------------------- 2006 杯中任达
 WJ_qingyi.2006.t:0 "杯中の任達"
 WJ_qingyi.2006.desc.wine:0 "酒は進むばかりで、帯を解く者もいれば、机を叩いて歌う者もいる。[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]は大杯をあなたの前に押しやり、清談の士たる者、何も俗礼に拘ることはないと言う。\n\n放達は名士の風度であるが、醜態もまたそうである。どこまでやるかは、すべてあなた次第だ。"
 WJ_qingyi.2006.desc.tea:0 "席には茶しかないが、一同の談論は大いに盛り上がっている。[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]は座を近くに寄せ、話の合う人にはなかなか会えないのだから、今夜は早々に散会するには及ばないと言う。\n\nこのような時、胸襟を開くか、規矩を守るかは、すべてあなた次第だ。"
 WJ_qingyi.2006.a:0 "心を解き放って任達に振る舞う。"
 WJ_qingyi.2006.b:0 "杯を手にしつつ自らを律する。"
 WJ_qingyi.2006.c:0 "隣の席の者と酌み交わす。"

 # ---------------------------------------------------------------- 2007 抵掌而谈
 WJ_qingyi.2007.t:0 "手を打って語らう"
 WJ_qingyi.2007.desc:0 "散会後、[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]はあなたを引き留めて話を続けた。意気投合したところで、相手は手を打って大笑し、この数日多くの人に会ったが、これほど自分と考えの近い者は珍しいと言った。\n\n行きずりの出会いが長い交わりとなるかどうかは、今夜にかかっている。"
 WJ_qingyi.2007.a:0 "同志として迎える。"
 WJ_qingyi.2007.b:0 "財帛を贈る。"
 WJ_qingyi.2007.c:0 "ほどほどにとどめる。"

 # ---------------------------------------------------------------- 2008 帷幕后语
 WJ_qingyi.2008.t:0 "帳の陰の話"
 WJ_qingyi.2008.desc:0 "分かれて座って話していた時、[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]の何気ない一言から、ある昔の出来事の端緒が漏れた。相手はあなたが聞き取ったことに気づくと、すぐに声を潜め、顔色も変わった。\n\nこの件は、主人はおそらくまだ知らないだろう。聞かなかったふりをするか、それとも別の考えがあるか。"
 WJ_qingyi.2008.a:0 "この件を主人に知らせるべきだ。"
 WJ_qingyi.2008.b:0 "黙って心に留め、周りを驚かせない。"
 WJ_qingyi.2008.c:0 "口を固く閉ざす。ただし見返りは必要だ。"

 # ---------------------------------------------------------------- 2011 补：月旦评版本
 WJ_qingyi.2011.desc.yuedan:0 "主人の[host.Custom('WJ_GetLinkedUIName')]が突然あなたの方を向き、名簿に載る[wj_qingyi_subject.Custom('WJ_GetLinkedUIName')]についてどう思うかと尋ねた。\n\n席が静まり返った。月旦評が進行中であり、あなたのこの一言が、何人かの票を変えるかもしれない。"

 # ---------------------------------------------------------------- 9001 / 9002 散席
 WJ_qingyi.9001.t:0 "品題の散会"
 WJ_qingyi.9001.desc:0 "客人たちは次々と衣を整えて立ち上がり、この数日の議論もようやく一区切りがついた。侍者が席を片付け始めたが、あなたには主人として最後の言葉を述べることが残っている。\n\nこの清議が何を残すか、どの言葉が外に伝わるかは、あなたが今どう締めくくるかに少なからずかかっている。"
 WJ_qingyi.9001.desc.yuedan:0 "客人たちは次々と衣を整えて立ち上がった。この清議で人々が最もよく覚えているのは、おそらく[wj_qingyi_yd_winner.Custom('WJ_GetLinkedUIName')]が第一に推された時の満座の反応であろう。\n\n月旦評の結果はほどなく各地に広まり、評主たるあなたの名もそれとともに語られるだろう。最後の言葉をどう述べるか、まだ考えねばならない。"
 WJ_qingyi.9001.a:0 "諸賢の言を記録し、士林に伝える"
 WJ_qingyi.9001.b:0 "自ら客人を門まで見送る。"
 WJ_qingyi.9001.c:0 "用いるべき才を選び、朝廷に推薦する"
 WJ_qingyi.9002.t:0 "耳に残る余韻"
 WJ_qingyi.9002.desc:0 "清議が終わろうとし、あなたも皆とともに立ち上がると、座りすぎて足が少しこわばっていることに気づいた。廊下の外から風が吹きつけ、この数日最も激しく争われた言葉がまだ耳に残っている。\n\nこの旅で何を得たのかは、帰ってからゆっくり考えて初めて分かるだろう。"
 WJ_qingyi.9002.desc.yuedan:0 "清議が終わろうとする中、一同はまだ[wj_qingyi_yd_winner.Custom('WJ_GetLinkedUIName')]が選ばれたことを話している。心服する者もいれば、納得しない者もいる。\n\n今回の月旦評にはあなたも票を投じた。結果がどうあれ、後日この品評が語られる時、あなたもその場にいた一人ということになる。"
 WJ_qingyi.9002.a:0 "学んだことを記録して帰る。"
 WJ_qingyi.9002.b:0 "主人に礼を述べる。"
 WJ_qingyi.9002.c:0 "飄然と去る。"

