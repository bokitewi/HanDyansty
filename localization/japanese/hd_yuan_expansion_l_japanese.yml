l_japanese:
 hd_story_yuan_expansion:0 "袁紹：北方への拡張"
 hd_story_yuan_expansion_desc:0 "袁紹は冀州を根本とし、北に幽州を収め、東に青州を取り、西は太行山を出て、上党・河内・楽平・太原・新興・雁門・西河の諸郡を経営し、河北の地をことごとく手中にしようとしている。"
 HD_YUAN_EXPANSION_STORY_STATUS:0 "袁紹は選んだ方面に兵を進めている。この方面が平定されるか、その間にもはや狙うべき敵がいなくなれば、次の方面を改めて議する。この方面の戦は、袁紹自らが命を下して兵を興さねばならない。"
 HD_YUAN_NORTHERN_LIFE_STORY_STATUS:0 "$HD_YUAN_LIFE_STORY_STATUS$\n\n冀・幽・青の三州と太行以西の諸郡は、本初が片時も忘れぬ河北の根本である。その地をことごとく領する者こそ、北方を握るのだ。"
 hd_yuan_expansion.1000.t:0 "河北の軍議"
 hd_yuan_expansion.1000.desc:0 "河北の図籍が改めて広げられた。あなたは、かつてそれぞれ一方に割拠していた名を眺める。あるものはすでに袁氏の節制に帰し、あるものはなお頑なに一角を占めている。側近がまず前の方面の軍務を報告し、あなたはそれを聞き終えてから、次はどこへ向かうかを尋ねた。\n\n冀・幽・青の三州にはまだ経営の余地があり、太行以西も并州と北の辺境に連なっている。軍中には戦いを望む者が少なくないが、糧道を皆の指す方角すべてに同時に通すことはできない。\n\nあなたは諸将に一斉に口を開かぬよう手で制した。今日定めるべきは、どの方面を先に進むかである。すでに定まった地にはそれなりの処置がある。兵も糧もあなたの命令を待っている以上、この軍議を互いに譲らぬ主張の並ぶ卓に終わらせてはならない。"
 hd_yuan_expansion.1000.a:0 "まず冀州を平定する。"
 hd_yuan_expansion.1000.b:0 "幽州へ兵を進める。"
 hd_yuan_expansion.1000.c:0 "東へ青州を取る。"
 hd_yuan_expansion.1000.d:0 "上党を奪取する。"
 hd_yuan_expansion.1000.e:0 "河内へ進攻する。"
 hd_yuan_expansion.1000.f:0 "楽平を平定する。"
 hd_yuan_expansion.1000.g:0 "太原を奪取する。"
 hd_yuan_expansion.1000.h:0 "新興へ進攻する。"
 hd_yuan_expansion.1000.i:0 "北へ雁門を制する。"
 hd_yuan_expansion.1000.j:0 "西河を平定する。"
 hd_yuan_expansion.1000.k:0 "河北の諸地は定まった。天下を図るべし。"
 hd_yuan_expansion.jizhou_tt:0 "あなたはまず冀州の境内でまだ帰順していない地に矛先を向ける。この方面の事が終われば、次の一手を改めて議する。"
 hd_yuan_expansion.youzhou_tt:0 "あなたは矛先を北の幽州へ転じる。この方面の事が終われば、次の一手を改めて議する。"
 hd_yuan_expansion.qingzhou_tt:0 "あなたは兵鋒を東の青州に向けた。この方面の事が終われば、次の手を議する。"
 hd_yuan_expansion.shangdang_tt:0 "あなたは矛先を西へ太行山の外に出し、上党を目指す。この方面の事が終われば、次の一手を改めて議する。"
 hd_yuan_expansion.henei_tt:0 "あなたは矛先を南の河内へ向ける。この方面の事が終われば、次の一手を改めて議する。"
 hd_yuan_expansion.leping_tt:0 "あなたは矛先を楽平へ向ける。この方面の事が終われば、次の一手を改めて議する。"
 hd_yuan_expansion.taiyuan_tt:0 "あなたは矛先を西の太原へ向ける。この方面の事が終われば、次の一手を改めて議する。"
 hd_yuan_expansion.xinxing_tt:0 "あなたは矛先を北の新興へ向ける。この方面の事が終われば、次の一手を改めて議する。"
 hd_yuan_expansion.yanmen_tt:0 "あなたは矛先を北の雁門へ向ける。この方面の事が終われば、次の一手を改めて議する。"
 hd_yuan_expansion.xihe_tt:0 "あなたは矛先を西の西河へ向ける。この方面の事が終われば、次の一手を改めて議する。"
 hd_yuan_expansion.finished_tt:0 "河北の諸州郡はことごとく袁氏に帰し、北方経略はここにひと区切りを迎えた。"
 hd_yuan_expansion_cb_victory_desc:0 "袁紹は敵の領土をことごとく呑み込む。相手の保持する称号はすべて袁紹に帰し、その配下の封臣はみな袁紹に鞍替えする。"
 hd_yuan_expansion_cb_white_peace_desc:0 "両者は兵を引き、それぞれ元の境界を守る。"
 hd_yuan_expansion_cb_defeat_desc:0 "袁紹のこの度の進軍は成果なく引き返し、双方とも元の境を守る。"
 hd_yuan_expansion_cb_invalidated_desc:0 "この戦いは名分を失って取りやめとなり、それぞれ元の境界を守る。"
