l_japanese:
 # ============================================================
 # 事件：入乡随俗
 # ============================================================
 zgrc_common.0002.t:0 "郷に入っては郷に従え"
 zgrc_common.0002.desc:0 "あなたがこの地に客居してすでに長い年月が経った。飲食や起居、言葉遣いや口調まで、知らず知らずのうちにすべて土地の気風に染まっている。故郷の訛りと古い習わしは、今やどれほど残っているだろうか。"
 zgrc_common.0002.a:0 "郷に入っては郷に従い、その土地の風に倣おう。"
 zgrc_common.0002.b:0 "土に安んじて移るを重んじ、故郷の習わしは改めぬ。"

 # ============================================================
 # 事件：天下响应 —— 非常时期封臣表态（1010）
 # ============================================================
 zgrc_common.1010.t:0 "天下響応"
 zgrc_common.1010.desc_foreign:0 "外寇が国を挙げての大軍で境を侵し、烽火は天に連なり、その兵鋒は[ROOT.Char.GetTopLiege.GetName]の社稷にまっすぐ向けられている。\n\nあなたは代々国恩を受け、この地に封土を賜っている。檄文が届いたとき、郷里の父老はすでに門の外に集まり、皆あなたの決断を待っている。"
 zgrc_common.1010.desc_civil:0 "同じ華夏の衣冠でありながら、今や同室にて矛を交えている。攻め寄せる者の兵鋒は[ROOT.Char.GetTopLiege.GetName]の社稷にまっすぐ向けられ、争うは天命の帰する所である。\n\nあなたは代々国恩を受け、この地に封土を賜っている。檄文が届いたとき、郷里の父老はすでに門の外に集まり、皆あなたの決断を待っている。"
 zgrc_common.1010.a:0 "家財を散じ、郷勇を起こし、直ちに勤王せよ！"
 zgrc_common.1010.a_locked:0 "家に余財なく、勤王の資がない。"
 zgrc_common.1010.b:0 "王侯将相、いずくんぞ種あらんや！"
 zgrc_common.1010.b_locked:0 "兵は少なく地は遠く、義兵を挙げる拠り所がない。"
 zgrc_common.1010.c:0 "兵は凶事、戦は危うし。しばし成り行きを見よう。"
 zgrc_common.2001.t:0 "義軍来投"
 zgrc_common.2001.desc:0 "この戦いで争われているのは、もとより漢の故地である。知らせが広まると、土地の義民は次々と竿を掲げて馳せ参じ、先鋒となって共に旧領を回復せんと願い出た。\n\n義軍の頭領はすでに帳の外に控え、あなたの裁きを待っている。"
 zgrc_common.2001.a:0 "ひとまず軍に従って先鋒を務め、事が済めば郷里へ帰らせよう。"
 zgrc_common.2001.b:0 "糧秣と俸給を厚く与え、軍に編入しよう。"
 zgrc_common.2001.c:0 "温かい言葉で慰め、郷里へ帰らせよう。"
 # 民粹/农民战争直接来投的事件兵军队名
 zgrc_yijun_army_name:0 "郷勇義軍"

 # ============================================================
 # 传言系统 —— 旅行听闻（3001-3004）
 # ============================================================
 # 3001 美名·忠义传闻
 zgrc_common.3001.t:0 "義声耳に入る"
 zgrc_common.3001.desc:0 "あなたが[ROOT.Var('zgrc_wen_county').Title.GetName]を通りかかると、道端の郷老があなたを引き止めて昔話を始めた。かつて戦乱が急に起こったとき、[zgrc_wen_hero.GetName]は家財を散じ尽くして郷勇を募り、君父の難に駆けつけたという。邑の民は今なおその義挙を語り継いでいる。"
 zgrc_common.3001.desc_late:0 "あなたが[ROOT.Var('zgrc_wen_county').Title.GetName]を通りかかると、道端の郷老があなたを引き止めて昔話を始めた。かつて戦乱が急に起こったとき、[zgrc_wen_hero.GetName]は家財を散じ尽くして郷勇を募り、君父の難に駆けつけたという。今ではその人の墓の木もひと抱えほどに育ったが、郷人はこの義挙を語るたび、なお粛然と襟を正す。"
 zgrc_common.3001.a:0 "資金を出して祠を建て、忠烈を顕彰しよう。"
 zgrc_common.3001.a_renew:0 "さらに香火料を寄進し、先賢の名を輝かせよう。"
 zgrc_common.3001.b:0 "その賢を礼敬し、心にこれを慕う。"
 zgrc_common.3001.c:0 "道を急いでおり、気にも留めない。"
 # 3002 美名·仁德传闻
 zgrc_common.3002.t:0 "仁声耳に入る"
 zgrc_common.3002.desc:0 "あなたが[ROOT.Var('zgrc_wen_county').Title.GetName]を通りかかると、郷人が道端で昔話をしていた。かつて義軍がこの地を通った折、[zgrc_wen_hero.GetName]は彼らを陣前に駆り立てて死なせることなく、温かい言葉で慰めて郷里へ帰らせ、一地方の民を守り抜いたという。郷人は今なおその恩徳を偲んでいる。"
 zgrc_common.3002.desc_late:0 "あなたが[ROOT.Var('zgrc_wen_county').Title.GetName]を通りかかると、郷人が道端で昔話をしていた。かつて義軍がこの地を通った折、[zgrc_wen_hero.GetName]は彼らを陣前に駆り立てて死なせることなく、温かい言葉で慰めて郷里へ帰らせ、一地方の民を守り抜いたという。その人はもはやこの世にないが、郷人は語るうちに今も涙を落とす。"
 zgrc_common.3002.a:0 "資金を出して祠を建て、仁徳を顕彰しよう。"
 zgrc_common.3002.a_renew:0 "さらに香火料を寄進し、先賢の名を輝かせよう。"
 zgrc_common.3002.b:0 "その賢を礼敬し、心にこれを慕う。"
 zgrc_common.3002.c:0 "道を急いでおり、気にも留めない。"
 # 3003 恶名·野心传闻
 zgrc_common.3003.t:0 "耳に逆らう言"
 zgrc_common.3003.desc:0 "あなたが[ROOT.Var('zgrc_wen_county').Title.GetName]を通りかかると、路地で人々が声を潜めて噂しているのが聞こえた。かつて天下に変事があった折、[zgrc_wen_hero.GetName]は国に報いることを思わず、かえって乱に乗じて主に背き、旗を挙げて自立し、攻め寄せた者と兵を合わせたという。話す者はしきりにあたりを見回し、聞く者は誰もが肝を冷やしている。"
 zgrc_common.3003.desc_late:0 "あなたが[ROOT.Var('zgrc_wen_county').Title.GetName]を通りかかると、路地で人々が声を潜めて噂しているのが聞こえた。かつて天下に変事があった折、[zgrc_wen_hero.GetName]は国に報いることを思わず、かえって乱に乗じて主に背き、旗を挙げて自立し、攻め寄せた者と兵を合わせたという。その人はとうに枯骨と化したが、郷人はその名が出るたび、今なお歯ぎしりして憎む。"
 zgrc_common.3003.a:0 "資金を出してその罪人の像を鋳造し、後人への戒めとしよう。"
 zgrc_common.3003.a_renew:0 "さらに罪人の像を修繕し、長く後人を戒めよう。"
 zgrc_common.3003.b:0 "広く世に知らしめ、胸のつかえを晴らそう。"
 zgrc_common.3003.c:0 "自分には関わりのないこと、気に掛けるまでもない。"
 # 3004 恶名·附逆传闻
 zgrc_common.3004.t:0 "遺臭の聞こえ"
 zgrc_common.3004.desc:0 "あなたが[ROOT.Var('zgrc_wen_county').Title.GetName]を通りかかると、父老が一面の廃墟を指さして語った。かつて外寇が侵入した折、[zgrc_wen_hero.GetName]は自ら進んでその先鋒となり、兵を率いて故郷を荒らし害したという。郷人は今なお、その肉を食らっても飽き足らぬほど憎んでいる。"
 zgrc_common.3004.desc_late:0 "あなたが[ROOT.Var('zgrc_wen_county').Title.GetName]を通りかかると、父老が一面の廃墟を指さして語った。かつて外寇が侵入した折、[zgrc_wen_hero.GetName]は自ら進んでその先鋒となり、兵を率いて故郷を荒らし害したという。今ではその人の墓の木もひと抱えほどに育ったが、郷人はその墓の前を通るたび、今なお唾を吐きかける。"
 zgrc_common.3004.a:0 "資金を出して像を鋳造し、千載にわたって皆に唾させよう。"
 zgrc_common.3004.a_renew:0 "さらにこの像を修繕し、その悪名を万年に残そう。"
 zgrc_common.3004.b:0 "広く世に知らしめ、胸の恨みを晴らそう。"
 zgrc_common.3004.c:0 "道を急いでおり、聞き流す。"

 # 大复仇：亲属得知凶手后的抉择
 zgrc_common.4001.t:0 "悲報至る"
 zgrc_common.4001.desc:0 "悲報が届いた――あなたの[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('zgrc_victim'))]である[zgrc_victim.GetName]が非業の死を遂げ、その下手人はあの[zgrc_killer.GetName]だという。\n\n九世の仇すらなお報ゆべし、ましてや至親の痛みにおいてをや。"
 zgrc_common.4001.a:0 "この仇を討たずして、誓って人たるを得ず！"
 zgrc_common.4001.b:0 "恥を忍び辱めに耐え、この恨みを深く胸に埋めよう。"
