 rule_siege_building_destruction_game_rule: "包囲戦：建物の破壊"
 setting_siege_building_destruction_enabled: "有効"
 setting_siege_building_destruction_disabled: "閉じる"
 setting_siege_building_destruction_enabled_desc: "包囲戦の終了時、一定の確率で通常の建物が破壊される。確率は占領側の現地兵力と伯爵領の開発度に応じて上昇する。"
 setting_siege_building_destruction_disabled_desc: "この機能による包囲戦での建物破壊効果は発生しない。"
 rule_siege_encampment_game_rule: "包囲戦：陣営"
 setting_siege_encampment_enabled: "有効"
 setting_siege_encampment_disabled: "閉じる"
 setting_siege_encampment_enabled_desc: "包囲する軍は毎月陣営を築き、守備側の領分の優位を弱める。包囲終了後に陣営は撤去される。"
 setting_siege_encampment_disabled_desc: "包囲する軍は陣営を築かない。"
 siege_encampment: "包囲陣営"
 siege_encampment_desc: "包囲する軍は城外に塹壕を掘り塁を築き、陣営は日ごとに堅固になってゆく。城に拠って守る守備軍の優位も、それに応じて削がれていく。"
 rule_scorched_earth_game_rule: "屠城"
 setting_scorched_earth_enabled: "有効"
 setting_scorched_earth_player_only: "プレイヤーのみ"
 setting_scorched_earth_independent_and_player_only: "独立統治者とプレイヤー"
 setting_scorched_earth_independent_player_only: "独立したプレイヤーのみ"
 setting_scorched_earth_independent_only: "独立統治者のみ"
 setting_scorched_earth_disabled: "閉じる"
 setting_scorched_earth_enabled_desc: "プレイヤーとAIの双方が条件を満たせば屠城を行える。実行するたびにその伯爵領は現在の開発度のうちランダムに30～90%を即座に失い、5年間の負の修正が適用される。"
 setting_scorched_earth_player_only_desc: "プレイヤーのみ屠城を行え、AIは自動では実行しない。"
 setting_scorched_earth_independent_and_player_only_desc: "すべてのプレイヤーと独立したAI統治者が屠城を行える。"
 setting_scorched_earth_independent_player_only_desc: "独立したプレイヤー統治者のみ屠城を行える。"
 setting_scorched_earth_independent_only_desc: "独立統治者のみ屠城を行える（プレイヤーとAIを含む）。"
 setting_scorched_earth_disabled_desc: "屠城ボタンとAIの自動屠城を無効にする。"
 scorch_earth_tooltip_desc: "#T 屠城#!\n兵を放って軍のいる地を焼き払い略奪し、城郭も田畑も家屋もことごとく灰燼に帰す。たとえ自領であっても、危急の際には焼き払い、敵軍の糧を断つことができる。\n\n[GetScriptedGui('scorched_earth').BuildTooltip( GuiScope.SetRoot( ArmyWindow.GetArmy.MakeScope ).End )]"
 hd_scorched_earth_development_loss_tt: "#N この伯爵領の[development|E]は急激に後退する。軽くとも大きく活力を損ない、重ければ十のうち九を失う。#!"
 hd_scorched_earth_army_ready_tt: "軍が戦闘中または略奪中でない"
 hd_scorched_earth_at_war_tt: "軍が属する統治者が交戦中である"
 hd_scorched_earth_county_exists_tt: "軍が伯爵領内にいる"
 hd_scorched_earth_territory_tt: "この地はあなたに占領されている。あなたまたはあなたの封臣の領地である場合は、なおその支配下にあり、かつあなたがいずれかの戦争の主要参戦者であるか、上位の主君と交戦中でなければならない"
 hd_scorched_earth_not_scorched_tt: "この伯爵領は近年屠城を受けていない"
 scorched_earth_county_modifier: "屠城の余波"
 scorched_earth_county_modifier_desc: "この地は最近殺戮に遭い、城郭は破れ、家々の十のうち九は空となり、生き残った民の怨嗟は天を衝いている。"
 scorched_earth_province_modifier: "屠城の余波"
 scorched_earth_province_modifier_desc: "田畑も家屋も焼け落ち、倉廩には何も残っていない。冬にここへ駐屯する軍は、現地で食糧を得るのが難しい。"
 scorched_my_holding: "我が領分を屠る"
