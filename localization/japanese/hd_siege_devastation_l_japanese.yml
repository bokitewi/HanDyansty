 setting_siege_epidemic_risk_none_desc: "包囲戦によって疫病耐性は追加で低下しない。"
 setting_siege_epidemic_risk_minimal_desc: "伯爵領首府を包囲する兵力が閾値に達すると、疫病耐性を1ポイント低下させ、1か月間持続する。包囲中は毎月継続して加算される。"
 setting_siege_epidemic_risk_slight_desc: "伯爵領首府を包囲する兵力が閾値に達すると、疫病耐性を2ポイント低下させ、1か月間持続する。包囲中は毎月継続して加算される。"
 setting_siege_epidemic_risk_limited_desc: "伯爵領首府を包囲する兵力が閾値に達すると、疫病耐性を5ポイント低下させ、1か月間持続する。包囲中は毎月継続して加算される。"
 setting_siege_epidemic_risk_small_desc: "伯爵領首府を包囲する兵力が閾値に達すると、疫病耐性を10ポイント低下させ、1か月間持続する。包囲中は毎月継続して加算される。"
 setting_siege_epidemic_risk_notable_desc: "伯爵領首府を包囲する兵力が閾値に達すると、疫病耐性を15ポイント低下させ、1か月間持続する。包囲中は毎月継続して加算される。"
 setting_siege_epidemic_risk_great_desc: "伯爵領首府を包囲する兵力が閾値に達すると、疫病耐性を20ポイント低下させ、1か月間持続する。包囲中は毎月継続して加算される。"
 setting_siege_epidemic_risk_immense_desc: "伯爵領首府を包囲する兵力が閾値に達すると、疫病耐性を25ポイント低下させ、1か月間持続する。包囲中は毎月継続して加算される。"
 setting_siege_epidemic_risk_extreme_desc: "伯爵領首府を包囲する兵力が閾値に達すると、疫病耐性を50ポイント低下させ、1か月間持続する。包囲中は毎月継続して加算される。"
 siege_epidemic_resistance_decrease: "包囲による疫病の危険"
 siege_epidemic_resistance_decrease_desc: "城中の軍民は一隅に閉じこもり、人も家畜もひしめき合い、汚物がたまって、疫気が最も流行しやすい。"
