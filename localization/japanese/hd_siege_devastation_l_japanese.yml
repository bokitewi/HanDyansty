 setting_siege_devastation_none_desc: "包囲戦によって追加の開発度損耗修正は適用されない。"
 setting_siege_devastation_minimal_desc: "伯爵領首府を包囲する兵力が閾値に達すると、1ポイントの開発度損耗修正を1か月間適用する。包囲中は毎月継続して加算される。"
 setting_siege_devastation_slight_desc: "伯爵領首府を包囲する兵力が閾値に達すると、2ポイントの開発度損耗修正を1か月間適用する。包囲中は毎月継続して加算される。"
 setting_siege_devastation_limited_desc: "伯爵領首府を包囲する兵力が閾値に達すると、5ポイントの開発度損耗修正を1か月間適用する。包囲中は毎月継続して加算される。"
 setting_siege_devastation_small_desc: "伯爵領首府を包囲する兵力が閾値に達すると、10ポイントの開発度損耗修正を1か月間適用する。包囲中は毎月継続して加算される。"
 setting_siege_devastation_notable_desc: "伯爵領首府を包囲する兵力が閾値に達すると、15ポイントの開発度損耗修正を1か月間適用する。包囲中は毎月継続して加算される。"
 setting_siege_devastation_great_desc: "伯爵領首府を包囲する兵力が閾値に達すると、20ポイントの開発度損耗修正を1か月間適用する。包囲中は毎月継続して加算される。"
 setting_siege_devastation_immense_desc: "伯爵領首府を包囲する兵力が閾値に達すると、25ポイントの開発度損耗修正を1か月間適用する。包囲中は毎月継続して加算される。"
 setting_siege_devastation_extreme_desc: "伯爵領首府を包囲する兵力が閾値に達すると、50ポイントの開発度損耗修正を1か月間適用する。包囲中は毎月継続して加算される。"
 siege_development_decline: "包囲による損耗"
 siege_development_decline_desc: "大軍による包囲が長引き、城外の田園は荒れ果て、商旅は途絶え、地方の活力は日ごとに衰えている。"
 rule_siege_epidemic_risk_game_rule: "包囲戦：疫病の危険"
 setting_siege_epidemic_risk_none: "閉じる"
