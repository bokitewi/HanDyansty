 sworn_brotherhood_interaction_desc:0 "향을 사르고 하늘에 고하여 상대와 성이 다른 형제의 의를 맺고, 이후로 기쁨과 근심을 함께하며 환난 속에서 서로 돕습니다."
 SWORN_BROTHERHOOD_NORMAL:0 "의형제 결의 제안"
