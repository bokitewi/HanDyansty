 # Peach Garden Oath Ceremony
 sworn_brotherhood_events.0001.t:0 "금란의 언약"
 
 # Dynamic Event Descriptions
 sworn_brotherhood_events.0001.desc.intro:0 "향탁이 이미 차려지고 술잔도 가득 채워졌습니다. 당신과 [blood_bro.GetTitledFirstName](이)가 마주 서자, 곁에 있던 이들도 차츰 웃고 떠들던 것을 멈추었습니다. 평소 입에 익은 호칭이 오늘따라 문득 한층 엄숙하게 느껴집니다.\n\n"
 sworn_brotherhood_events.0001.desc.outro:0 "\n\n누군가 술잔을 당신 손에 건넵니다. 맹세의 말에 세상의 좋은 말을 다 담을 필요는 없습니다. 가장 지키고 싶은 한마디를 골라, 앞으로 그대로 행하면 될 일입니다."
 sworn_brotherhood_events.0001.desc.just:0 "앞으로 서로를 어떻게 대할지 이야기하다 보니, 말은 결국 ‘신의’ 두 글자로 모였습니다. 잘나갈 때만 형님 아우 하다가 이해가 걸린 순간 얼굴을 바꾼다면, 오늘의 예를 아무리 갖추어도 웃음거리만 더할 뿐입니다."
 sworn_brotherhood_events.0001.desc.brave:0 "앞날의 위험을 이야기할 때 두 사람 누구도 피하지 않았습니다. 용맹은 사람을 앞으로 나아가게 하지만, 곁에 있는 이가 곤경에 처했을 때에도 여전히 나아가려 하는지는 또 다른 문제입니다. 오늘의 이 잔은 바로 그 뒤의 일을 위해 마셔야 합니다."
 sworn_brotherhood_events.0001.desc.loyal:0 "지금까지 사귀어 오며 두 사람은 이미 서로를 맡길 수 있는 신뢰를 쌓았습니다. 당신은 이 신뢰가 몇 마디 인사치레에만 머물기를 원치 않습니다. 훗날 소식이 어지럽고 이해가 다툴 때에도, 오늘 마주하고 정한 말만은 기억해야 할 것입니다."
 sworn_brotherhood_events.0001.desc.ambitious:0 "두 사람 모두 눈앞의 나날에 안주하려 하지 않으며, 앞날을 이야기하면 저마다 이루고 싶은 큰일이 있습니다. 뜻이 비슷하니 서로 모이게 되었지만, 바라는 것이 비슷하다고 해서 반목하지 않을 방도야말로 오늘 엄숙히 맹세할 만한 것입니다."
 sworn_brotherhood_events.0001.desc.generic:0 "두 사람은 모든 일에 한마음이 아닐 수도 있고 모든 면이 닮은 것도 아니지만, 사귀어 온 이래 서로 쉽게 버리고 싶지 않은 정이 생겼습니다. 오늘 형제라 부르기로 한 것은, 이 정을 여느 왕래보다 무겁게 여기겠다는 뜻입니다."
 
 # Oath Options
 sworn_brotherhood_events.0001.a:0 "신의를 으뜸으로 삼으니, 황천후토께서 함께 굽어보소서."
 sworn_brotherhood_events.0001.b:0 "충으로 서로를 맡기니, 죽어도 저버리지 않으리라."
 sworn_brotherhood_events.0001.c:0 "함께 험난한 길에 나서며, 용기로 서로 약속하리라."
 sworn_brotherhood_events.0001.d:0 "한 잔의 박주로도 이 마음을 밝히기에 족하오."
 
 # Oath Tooltips
 
 # Follow-up Event
 sworn_brotherhood_events.0002.t:0 "금란 이후"
 sworn_brotherhood_events.0002.desc:0 "당신이 [blood_bro.GetTitledFirstName](와)과 형제의 의를 맺은 지 어느덧 몇 달이 지났습니다. 그날 술자리 예식의 많은 일들은 차츰 흐릿해졌지만, 진지하게 나누었던 몇 마디 말은 앞으로의 왕래를 생각할 때마다 다시금 마음에 떠오릅니다.\n\n맹세를 세웠다고 해서 이후로 마음 써서 지켜 갈 필요가 없어지는 것은 아닙니다. 요즘 두 사람이 다시 모인 자리에서, 누군가는 그날의 맹세를 꺼냈고, 누군가는 함께 고난을 겪어야 진심이 보인다고 했으며, 또 누군가는 정이 있으면 그만이지 무엇하러 격식을 차리느냐며 웃었습니다.\n\n당신은 맞은편의 익숙한 얼굴을 바라봅니다. 앞으로 서로를 어떻게 대할지는 결국 두 사람이 스스로 정해야 합니다."

 sworn_brotherhood_events.0002.a:0 "지난 맹세를 거듭 다짐하고, 서로 충으로 대하리라."
 sworn_brotherhood_events.0002.b:0 "다시 생사를 약속하고, 함께 험난한 길에 나서리라."
 sworn_brotherhood_events.0002.c:0 "옛 정을 새기며 금란의 의를 두터이 하리라."
 sworn_brotherhood_events.0002.d:0 "정은 이미 분명한데, 허례가 무슨 필요하겠소."

 sworn_brotherhood_strengthened_tt:0 "우리 의형제의 정은 함께 환난을 겪으며 더욱 굳건해졌습니다."
 
 # Modifier Names & Descriptions
 brotherhood_loyalty_modifier:0 "충의로 이어진 형제"
 brotherhood_loyalty_modifier_desc:0 "이 인물은 의형제와 충으로 서로를 맡겼으며, 그 맹세는 쇠와 돌처럼 변치 않습니다."
 
 brotherhood_ferocity_modifier:0 "용렬한 형제"  
 brotherhood_ferocity_modifier_desc:0 "이 인물은 의형제와 용기로 서로 약속했으니, 누구든 감히 그 형제를 범하면 반드시 몸을 돌보지 않고 나섭니다."
 
 tested_brotherhood_modifier:0 "시련을 겪은 정"
 tested_brotherhood_modifier_desc:0 "세월을 지나며 이 금란의 정은 더욱 깊어졌습니다."
 
 brotherhood_ambition_modifier:0 "웅지의 맹약"
 brotherhood_ambition_modifier_desc:0 "피로 맺은 형제와 웅지의 맹세를 세우고, 대업을 이루기 위해 손을 잡았습니다."
 
 # Oath Breaking Penalties
 oath_breaker_modifier:0 "맹세를 저버린 자"
 oath_breaker_modifier_desc:0 "이 인물은 금란의 맹세를 저버려 세상 사람들의 멸시를 받으며, 다시 남의 믿음을 얻기 어렵습니다."
 
 dishonorable_modifier:0 "신의 없는 자"
 dishonorable_modifier_desc:0 "이 인물은 의리를 저버리고 맹약을 배신하여, 신의 없다는 이름이 사방에 퍼졌습니다."
 
 # Oath-Breaking Events
 sworn_brotherhood_events.0003.t:0 "형제의 배신"
 sworn_brotherhood_events.0003.desc.intro:0 "[betrayer.GetName](이)가 형제의 맹세를 저버렸다는 소식이 전해졌습니다. 당신은 전하러 온 자의 말을 다 듣고도 다시 한번 말하게 했고, 그것을 잘못 전해진 말로 여길 구실이 더는 없을 때까지 들었습니다.\n\n"
 sworn_brotherhood_events.0003.desc.just_betrayed:0 "당신이 가장 용납할 수 없는 것은, 그날 신의로 약속해 놓고 오늘 그것을 헌신짝처럼 버린 일입니다. 앞으로 남이 엄숙히 맹세하는 것을 들어도, 예전처럼 아무 의심 없이 믿기는 어려울 것입니다."
 sworn_brotherhood_events.0003.desc.wrathful_betrayed:0 "분노가 치밀어 올라 당신은 하마터면 그 자리에서 벌떡 일어날 뻔했습니다. 당신을 가장 잘 아는 사람이 칼날을 어디에 내려야 하는지도 가장 잘 아는 법. 그렇기에 이 배신은 여느 적의보다 더 삼키기 어렵습니다."
 sworn_brotherhood_events.0003.desc.cynical_betrayed:0 "당신도 맹세의 무게를 한 번도 의심해 본 적이 없는 것은 아니지만, 눈앞의 이 맹세만은 예외일 수 있다고 늘 믿어 왔습니다. 이제 그 작은 요행마저 [betrayer.GetSheHe](이)가 제 손으로 깨뜨려 버렸습니다."
 sworn_brotherhood_events.0003.desc.generic_betrayed:0 "당신은 처음 마주 보고 잔을 들던 때를 떠올리며, 그 순간과 눈앞의 소식을 나란히 놓아 보려 했지만, 아무리 해도 원래의 모습으로 맞춰지지 않습니다."
 sworn_brotherhood_events.0003.desc.outro:0 "\n\n소식을 전한 자가 아직 당신이 입을 열기를 기다리고 있습니다. 옛 맹세는 더 이상 [betrayer.GetSheHe](을)를 구속하지 못하지만, 당신이 어떻게 응하느냐는 여전히 남들이 당신을 어떻게 볼지, 그리고 앞으로 당신이 남을 어떻게 믿을지를 결정할 것입니다."
 sworn_brotherhood_events.0003.a:0 "맹세를 저버린 자이니, 천하가 모두 알게 하리라."
 sworn_brotherhood_events.0003.b:0 "나를 저버렸으니 이제 원수로다."
 sworn_brotherhood_events.0003.c:0 "그 사람됨을 똑똑히 알았으니, 내 이름에는 흠이 없으리라."
 sworn_brotherhood_events.0003.d:0 "은혜도 의리도 끊겼으니, 이제부터 남남이로다."
 
 # Betrayer Event
 sworn_brotherhood_events.0004.t:0 "깨어진 맹세"
 sworn_brotherhood_events.0004.desc:0 "당신은 [actor.GetName](와)과 세운 형제의 맹세를 저버렸습니다. 그때 어떤 이유가 있었든, 신의를 잃은 오명은 결국 당신 한 몸이 짊어지게 될 것입니다."
 sworn_brotherhood_events.0004.a:0 "배신한 행위를 뉘우친다"
 sworn_brotherhood_events.0004.b:0 "야심을 받아들인다"
 
# Opinion Modifiers & Tooltips
 hd_sworn_brotherhood_declined:0 "나의 결의 요청을 거절함"
 opinion_betrayed_me:0 "나를 배신함"
 opinion_broken_oath_justice:0 "신성한 맹약을 배신함"
 opinion_expected_betrayal:0 "간사함을 진작 짐작함"
 stress_broken_oath_tt:0 "의형제의 배신이 당신의 마음을 뒤흔들었습니다."
 stress_vengeful_rage_tt:0 "정의로운 분노가 당신을 집어삼키지만, 평온을 가져다주지는 못합니다."
 
 # Enhanced Follow-up Event Options
