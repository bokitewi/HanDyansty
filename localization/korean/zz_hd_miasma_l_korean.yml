l_korean:
 hd_miasma_county_modifier:0 "장기"
 hd_miasma_county_modifier_desc:0 "숲은 깊고 습한 열기가 자욱하여 장기와 역병이 횡행한다. 군대가 그 땅에 들어서면 역병이 뒤따르고, 백성이 그 땅에 살면 개간이 고되다.\n\n#X @warning_icon!이 [county|E]의 [development|E](이)가 #V 30#! 이상으로 오르면, 그 직할 주군이 [GetDecisionWithKey('hd_clear_miasma_decision').GetName] [decision|E](을)를 통해 이 우환을 뿌리 뽑을 수 있습니다!#!\n\n"
 hd_clear_miasma_decision:0 "장기 제거"
 hd_clear_miasma_decision_desc:0 "강과 고개 남쪽은 낮고 습하며 무더워 장기의 구름이 흩어지지 않는다. 사는 이는 병들고, 길 가는 이는 길을 경계한다.\n\n이제 경내에 인구가 날로 불어나고 밭두렁이 차츰 개간되었으니, 의원을 보내고 늪을 트고 썩은 풀을 태우며 병든 백성을 옮겨, 이 땅의 물과 흙을 맑게 되돌릴 때다."
 hd_clear_miasma_decision_tooltip:0 "치하에서 이미 상당한 [development|E](을)를 갖춘 직할 [counties|E]에서 [GetModifier('hd_miasma_county_modifier').GetNameWithTooltip](을)를 몰아냄"
 hd_clear_miasma_decision_confirm:0 "풀을 태우고 늪을 터라!"
 hd_miasma_county_eligible_removal_tt:0 "적어도 하나의 직할 [county|E]에 [GetModifier('hd_miasma_county_modifier').GetName] [county_modifier|E](이)가 있고, [development|E](이)가 #V 30#! 이상임"
 hd_miasma_removal_tt:0 "[development|E](이)가 #V 30#! 이상인 모든 직할 [counties|E](은)는 더 이상 [GetModifier('hd_miasma_county_modifier').GetNameWithTooltip]에 시달리지 않음"
 hd_miasma_no_counties_meet_criteria_tt:0 "@alert_icon!#alert_trial 현재 이 기준을 충족하는 직할 백작령이 없습니다!#!"
 hd_miasma_cleared.t:0 "장기와 역병이 차츰 사라짐"
 hd_miasma_cleared.desc:0 "[ROOT.Char.GetFullName](이)가 늪을 트고 의원을 널리 보내니, 치하의 장기 서린 땅이 다시 맑아졌습니다."
