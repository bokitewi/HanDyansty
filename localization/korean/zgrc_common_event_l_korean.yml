l_korean:
 # ============================================================
 # 事件：入乡随俗
 # ============================================================
 zgrc_common.0002.t:0 "입향순속"
 zgrc_common.0002.desc:0 "당신이 이곳에 객으로 머문 지도 여러 해가 지났다. 먹고 마시고 생활하는 법이며 말투와 억양까지, 어느새 모두 이 고장의 풍속에 물들었다. 고향의 말씨와 옛 풍속은 이제 얼마나 남아 있을까?"
 zgrc_common.0002.a:0 "고장에 들면 고장의 풍속을 따르리라."
 zgrc_common.0002.b:0 "고향 땅을 아끼니, 옛 풍속을 바꾸지 않으리라."

 # ============================================================
 # 事件：天下响应 —— 非常时期封臣表态（1010）
 # ============================================================
 zgrc_common.1010.t:0 "천하의 호응"
 zgrc_common.1010.desc_foreign:0 "외적이 나라의 온 병력을 일으켜 국경을 침범하니, 봉화가 하늘에 닿고 그 칼끝은 곧장 [ROOT.Char.GetTopLiege.GetName]의 사직을 겨누고 있다.\n\n당신은 대대로 나라의 은혜를 입어 이곳에 봉토를 받았다. 격문이 전해졌을 때, 고을의 부로들은 이미 문밖에 모여 당신의 결정을 기다리고 있었다."
 zgrc_common.1010.desc_civil:0 "같은 화하의 의관이건만, 이제는 한집안끼리 창을 겨누고 있다. 침입자의 칼끝은 곧장 [ROOT.Char.GetTopLiege.GetName]의 사직을 겨누고 있으니, 다투는 것은 천명이 누구에게 돌아가느냐이다.\n\n당신은 대대로 나라의 은혜를 입어 이곳에 봉토를 받았다. 격문이 전해졌을 때, 고을의 부로들은 이미 문밖에 모여 당신의 결정을 기다리고 있었다."
 zgrc_common.1010.a:0 "가산을 흩어 향용을 일으켜, 즉시 근왕하라!"
 zgrc_common.1010.a_locked:0 "집에 남은 재물이 없으니, 근왕할 밑천이 없구나."
 zgrc_common.1010.b:0 "왕후장상의 씨가 따로 있단 말인가?"
 zgrc_common.1010.b_locked:0 "병력은 미약하고 땅은 머니, 의병을 일으킬 근거가 없다."
 zgrc_common.1010.c:0 "전쟁은 흉하고 위태로운 법, 잠시 형세를 지켜보자."
 zgrc_common.2001.t:0 "의군의 귀순"
 zgrc_common.2001.desc:0 "이번 싸움에서 다투는 것은 본디 한나라의 옛 땅이다. 소식이 퍼지자 그 고장의 의로운 백성들이 잇달아 깃발을 들고 찾아와, 선봉이 되어 함께 옛 강토를 되찾겠다고 한다.\n\n의군의 우두머리가 이미 장막 밖에서 당신의 처분을 기다리고 있다."
 zgrc_common.2001.a:0 "잠시 군을 따라 선봉에 서고, 일이 끝나면 고향으로 돌아가라."
 zgrc_common.2001.b:0 "군량과 급료를 넉넉히 주고 대오에 편입하라."
 zgrc_common.2001.c:0 "따뜻한 말로 위로하고 고향으로 돌려보내라."
 # 民粹/农民战争直接来投的事件兵军队名
 zgrc_yijun_army_name:0 "향용 의군"

 # ============================================================
 # 传言系统 —— 旅行听闻（3001-3004）
 # ============================================================
 # 3001 美名·忠义传闻
 zgrc_common.3001.t:0 "귀에 들려오는 의로운 명성"
 zgrc_common.3001.desc:0 "당신이 [ROOT.Var('zgrc_wen_county').Title.GetName](을)를 지날 때, 길가의 마을 노인이 당신을 붙잡고 옛일을 이야기했다. 그 옛날 전란이 갑자기 일어났을 때, [zgrc_wen_hero.GetName](은)는 가산을 모두 흩어 향용을 모아 군부의 환난에 달려갔다고 한다. 고을 백성들은 지금도 그의 의로운 행적을 칭송한다."
 zgrc_common.3001.desc_late:0 "당신이 [ROOT.Var('zgrc_wen_county').Title.GetName](을)를 지날 때, 길가의 마을 노인이 당신을 붙잡고 옛일을 이야기했다. 그 옛날 전란이 갑자기 일어났을 때, [zgrc_wen_hero.GetName](은)는 가산을 모두 흩어 향용을 모아 군부의 환난에 달려갔다고 한다. 이제 그의 무덤가 나무는 아름드리가 되었지만, 마을 사람들은 그 의로운 행적을 이야기할 때면 여전히 숙연해진다."
 zgrc_common.3001.a:0 "재물을 내어 사당을 세우고, 그 충렬을 기리리라."
 zgrc_common.3001.a_renew:0 "향불 비용을 계속 대어, 앞선 현인을 빛내리라."
 zgrc_common.3001.b:0 "그 어짊에 예를 표하며, 마음으로 우러른다."
 zgrc_common.3001.c:0 "길이 바쁘니 마음에 두지 않는다."
 # 3002 美名·仁德传闻
 zgrc_common.3002.t:0 "귀에 들려오는 어진 명성"
 zgrc_common.3002.desc:0 "당신이 [ROOT.Var('zgrc_wen_county').Title.GetName](을)를 지날 때, 마을 사람들이 길가에서 옛일을 이야기했다. 그 옛날 의군이 이 땅을 지날 때, [zgrc_wen_hero.GetName](은)는 그들을 전장으로 몰아 죽게 하지 않고 좋은 말로 위로하여 고향으로 돌려보냈으니, 이로써 한 지방의 백성을 온전히 지켰다고 한다. 마을 사람들은 지금도 그의 은덕을 잊지 않는다."
 zgrc_common.3002.desc_late:0 "당신이 [ROOT.Var('zgrc_wen_county').Title.GetName](을)를 지날 때, 마을 사람들이 길가에서 옛일을 이야기했다. 그 옛날 의군이 이 땅을 지날 때, [zgrc_wen_hero.GetName](은)는 그들을 전장으로 몰아 죽게 하지 않고 좋은 말로 위로하여 고향으로 돌려보냈으니, 이로써 한 지방의 백성을 온전히 지켰다고 한다. 이제 그 사람은 세상을 떠났지만, 마을 사람들은 그 이야기를 할 때면 여전히 눈물을 흘린다."
 zgrc_common.3002.a:0 "재물을 내어 사당을 세우고, 그 인덕을 드러내리라."
 zgrc_common.3002.a_renew:0 "향불 비용을 계속 대어, 앞선 현인을 빛내리라."
 zgrc_common.3002.b:0 "그 어짊에 예를 표하며, 마음으로 우러른다."
 zgrc_common.3002.c:0 "길이 바쁘니 마음에 두지 않는다."
 # 3003 恶名·野心传闻
 zgrc_common.3003.t:0 "귀에 거슬리는 말"
 zgrc_common.3003.desc:0 "당신이 [ROOT.Var('zgrc_wen_county').Title.GetName](을)를 지날 때, 골목에서 누군가 목소리를 낮추어 수군거리는 것을 들었다. 그 옛날 천하에 변고가 일어났을 때, [zgrc_wen_hero.GetName](은)는 나라에 보답할 생각은커녕 혼란을 틈타 주군을 배반하고 깃발을 들어 자립하여 침입자와 군사를 합쳤다는 것이다. 말하는 이는 연신 사방을 두리번거리고, 듣는 이들은 하나같이 가슴을 졸였다."
 zgrc_common.3003.desc_late:0 "당신이 [ROOT.Var('zgrc_wen_county').Title.GetName](을)를 지날 때, 골목에서 누군가 목소리를 낮추어 수군거리는 것을 들었다. 그 옛날 천하에 변고가 일어났을 때, [zgrc_wen_hero.GetName](은)는 나라에 보답할 생각은커녕 혼란을 틈타 주군을 배반하고 깃발을 들어 자립하여 침입자와 군사를 합쳤다는 것이다. 그 사람은 이미 오래전에 백골이 되었으나, 마을 사람들은 그 이야기만 나오면 여전히 이를 간다."
 zgrc_common.3003.a:0 "재물을 내어 그 죄인의 상을 주조하여, 뒷사람들을 경계하리라."
 zgrc_common.3003.a_renew:0 "죄인의 상을 계속 보수하여, 길이 후인을 경계하리라."
 zgrc_common.3003.b:0 "널리 알려, 속 시원히 털어놓으리라."
 zgrc_common.3003.c:0 "나와 상관없는 일이니, 신경 쓸 것 없다."
 # 3004 恶名·附逆传闻
 zgrc_common.3004.t:0 "악명의 소문"
 zgrc_common.3004.desc:0 "당신이 [ROOT.Var('zgrc_wen_county').Title.GetName](을)를 지날 때, 부로들이 폐허 한 곳을 가리키며 말했다. 그 옛날 외적이 쳐들어왔을 때, [zgrc_wen_hero.GetName](은)는 자청하여 앞잡이가 되어 군사를 이끌고 고향 땅을 짓밟았다고 한다. 마을 사람들은 지금도 그의 살을 씹어 먹지 못해 한이 맺혀 있다."
 zgrc_common.3004.desc_late:0 "당신이 [ROOT.Var('zgrc_wen_county').Title.GetName](을)를 지날 때, 부로들이 폐허 한 곳을 가리키며 말했다. 그 옛날 외적이 쳐들어왔을 때, [zgrc_wen_hero.GetName](은)는 자청하여 앞잡이가 되어 군사를 이끌고 고향 땅을 짓밟았다고 한다. 이제 그의 무덤가 나무는 아름드리가 되었지만, 마을 사람들은 그 무덤 앞을 지날 때면 여전히 침을 뱉는다."
 zgrc_common.3004.a:0 "재물을 내어 상을 주조하여, 천 년 동안 모두가 침을 뱉게 하리라."
 zgrc_common.3004.a_renew:0 "이 상을 계속 보수하여, 그 악명이 만년토록 남게 하리라."
 zgrc_common.3004.b:0 "널리 알려, 가슴속 원한을 풀리라."
 zgrc_common.3004.c:0 "길이 바쁘니, 귓등으로 흘려듣는다."

 # 大复仇：亲属得知凶手后的抉择
 zgrc_common.4001.t:0 "비보가 전해지다"
 zgrc_common.4001.desc:0 "비보가 전해졌다. 당신의 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('zgrc_victim'))] [zgrc_victim.GetName](이)가 비명에 죽었으니, 그를 해친 자는 바로 [zgrc_killer.GetName](이)라 한다.\n\n구세의 원수도 갚아야 하거늘, 하물며 혈육을 잃은 아픔이랴?"
 zgrc_common.4001.a:0 "이 원수를 갚지 못하면, 맹세코 사람이라 할 수 없다!"
 zgrc_common.4001.b:0 "치욕을 참고 견디며, 이 한을 깊이 묻어 두리라."
