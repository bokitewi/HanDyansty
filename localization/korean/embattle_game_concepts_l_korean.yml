l_korean:
 game_concept_embattle:0 "포진"
 game_concept_embattle_desc:0 "군대마다 좌우 두 명의 부장을 둘 수 있으며, 본군의 기사 가운데서 선임합니다. 부장이 비면 모든 세력의 군대가 자동으로 보충하며, 당장 보충할 사람이 없으면 잠시 공석으로 둡니다. “부장 공석 재점검” 결단으로 다시 점검할 수 있습니다."
 game_concept_embattle_side_advantage_modifier:0 "부장 전투 수정치"
 game_concept_embattle_side_advantage_modifier_desc:0 "부장의 전투 능력은 휘하 군대의 전투 우위에 영향을 줍니다. 부장이 둘이면 추가 우위는 주장과 두 부장의 전투 평균에서 주장의 전투를 뺀 값입니다. 부장이 하나면 주장과 부장의 전투 평균에서 2를 빼고, 다시 주장의 전투를 뺀 값입니다. 부장이 없으면 보통 -5이며, 반란군 수장과 기사 정원이 없는 통치자는 이 불이익을 받지 않습니다. 본군에 남아 있는 부장만 계산되며, 부장의 전투가 주장보다 낮으면 추가 우위가 음수가 될 수 있습니다."
 game_concept_embattle_tactic:0 "전술(제거됨)"
 game_concept_embattle_tactic_desc:0 "포진 부가 전술은 폐지되었습니다. 전투에서의 병종 상성과 승패는 평소와 같습니다."
 game_concept_embattle_tactic_counter:0 "구버전 전술 상성"
 game_concept_embattle_tactic_counter_desc:0 "부가 전술 간의 상성은 폐지되어 더 이상 전투 우위에 영향을 주지 않습니다."
 game_concept_embattle_general_tactic_group:0 "구버전 일반 전술군"
 game_concept_embattle_general_tactic_group_desc:0 "이 전술군은 폐지되었습니다."
 game_concept_embattle_clumsy_tactic_group:0 "구버전 서툰 전술군"
 game_concept_embattle_clumsy_tactic_group_desc:0 "이 전술군은 폐지되었습니다."
 game_concept_a_culling_of_the_weak:0 "약육강식 호환 설명"
 game_concept_a_culling_of_the_weak_desc:0 "부장의 선임과 유지는 본군 안에서만 이루어집니다. 보충하지 못하면 다시 점검할 때까지 잠시 공석으로 둡니다."
 game_concept_embattle_volly_tactic:0 "일제 사격(제거됨)"
 game_concept_embattle_volly_tactic_desc:0 "이 전술은 폐지되어 전투에 나타나지 않습니다."
