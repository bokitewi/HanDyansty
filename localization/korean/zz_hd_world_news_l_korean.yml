l_korean:
 hd_world_news.a:0 "천하가 또다시 바뀌려 하는군"
 hd_world_news.0001.t:0 "황천이 마땅히 설 것이다"
 hd_world_news.0007.t:0 "성과 없는 연합군"
 hd_world_news.0001.desc:0 "기주에서 급보가 도착했다. 당주가 태평도의 계획을 밀고했고, 마원의는 낙양에서 거열형을 당했다. [hd_news_a.GetName](은)는 더 기다리지 않고 천공장군을 자칭하며 [hd_news_place.GetName]에서 봉기했다.\n\n같은 무렵 [hd_news_c.GetName](은)는 [hd_news_place_c.GetName]에서, [hd_news_d.GetName](은)는 [hd_news_place_d.GetName]에서 군사를 일으켰다. 서른여섯 방의 신도들이 노란 두건을 두르자, 각 주와 군에서 구원을 청하는 소식이 하루에도 몇 차례씩 밀려든다.\n\n“창천은 이미 죽었으니 황천이 마땅히 일어서리라.” 이제 이 말이 온 천하에 퍼졌다."
 hd_world_news.0001.missing_details_desc:0 "기주에서 급보가 도착했다. 당주가 태평도의 계획을 밀고했고, 마원의는 낙양에서 거열형을 당했다. [hd_news_a.GetName](은)는 더 기다리지 않고 천공장군을 자칭하며 봉기했다.\n\n서른여섯 방의 신도들이 노란 두건을 두르자, 각 주와 군에서 구원을 청하는 소식이 하루에도 몇 차례씩 밀려든다.\n\n“창천은 이미 죽었으니 황천이 마땅히 일어서리라.” 이제 이 말이 온 천하에 퍼졌다."
 hd_world_news.0007.desc:0 "동탁을 토벌하겠다던 맹서가 다시 펼쳐졌다. 보관할 때 생긴 접힌 자국이 아직 선명하다. 그러나 [hd_news_a.GetName](은)는 끝내 여러 군대를 승리로 이끌지 못했고, 병사들은 하나둘 흩어졌다. [hd_news_b.GetName](은)는 여전히 [hd_news_place.GetName]에 버티고 있으며, 천자의 처지도 그 맹세 덕분에 나아지지는 않았다.\n\n나는 종이에 빽빽하게 적힌 이름들을 손가락으로 짚었다. 군사를 일으킬 때만 해도 조정의 구원자로 불리던 이름들이다. 이제 그들을 말하는 이들은 누가 먼저 물러났는지, 누가 군량을 아꼈는지, 누가 다른 이의 패전을 제 이익으로 삼았는지부터 묻는다. 한 사람을 향하던 욕설이 어느새 옛 동맹자들에게로 흩어졌다.\n\n누군가 맹서를 치우려 했지만, 나는 여전히 종이 귀퉁이를 누르고 있었다. 이제 아무도 그에 따르려 하지 않더라도, 그 맹세를 입 밖에 냈다는 사실까지 사라지지는 않는다. 흩어졌던 이들이 다시 만나 예전처럼 술잔을 들려 할 때면, 오늘의 원망을 다시 떠올리게 되리라."
 hd_world_news.0007.no_place_desc:0 "동탁을 토벌하겠다던 맹서가 다시 펼쳐졌다. 보관할 때 생긴 접힌 자국이 아직 선명하다. 그러나 [hd_news_a.GetName](은)는 끝내 여러 군대를 승리로 이끌지 못했고, 병사들은 하나둘 흩어졌다. [hd_news_b.GetName](은)는 아직 살아 있으며, 천자의 처지도 그 맹세 덕분에 나아지지는 않았다.\n\n나는 종이에 빽빽하게 적힌 이름들을 손가락으로 짚었다. 군사를 일으킬 때만 해도 조정의 구원자로 불리던 이름들이다. 이제 그들을 말하는 이들은 누가 먼저 물러났는지, 누가 군량을 아꼈는지, 누가 다른 이의 패전을 제 이익으로 삼았는지부터 묻는다. 한 사람을 향하던 욕설이 어느새 옛 동맹자들에게로 흩어졌다.\n\n누군가 맹서를 치우려 했지만, 나는 여전히 종이 귀퉁이를 누르고 있었다. 이제 아무도 그에 따르려 하지 않더라도, 그 맹세를 입 밖에 냈다는 사실까지 사라지지는 않는다. 흩어졌던 이들이 다시 만나 예전처럼 술잔을 들려 할 때면, 오늘의 원망을 다시 떠올리게 되리라."
