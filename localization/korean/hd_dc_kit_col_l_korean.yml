l_korean:
 # 天朝循环·时代特色：崩溃期（天下大乱 + 大厦将倾）套件

 # ---------- 招募流民 ----------
 hd_dc_col_recruit_refugees_decision: "유민 모집"
 hd_dc_col_recruit_refugees_decision_desc: "굶주린 백성이 떠돌다가 머무는 곳마다 도적이 된다. 그들이 무리를 지어 난을 일으키는 것을 가만히 지켜보느니, 관아에서 장정은 병사로 모으고 노약자는 황무지를 개간하게 하는 편이 낫다. 병력도 얻고 지방도 안정시킬 수 있다."
 hd_dc_col_recruit_refugees_decision_tooltip: "유민을 병사로 모으고, 노약자는 전답에 정착시킵니다."
 hd_dc_col_recruit_refugees_decision_confirm: "유민을 병사로 모으라"
 hd_dc_col_recruit_refugees_county_tt: "천자의 나라에 속한 모든 [county|E]"
 hd_dc_col_refugee_army_name: "유민군"
 hd_dc_col_refugees_county_modifier: "유민 모집"
 hd_dc_col_refugees_county_modifier_desc: "관아가 유민을 병사로 모으고 노약자를 정착시키니, 지방이 다소 안정되었다."

 # ---------- 勤王诏 ----------
 hd_dc_col_qinwang_decision: "근왕조"
 hd_dc_col_qinwang_decision_desc: "도적이 번갈아 침노하여 사직이 위태롭다. 천자가 혈서로 천하 제후에게 조서를 내린다. 무릇 충의로운 선비라면 서둘러 군사를 일으켜 구원하러 와서 함께 국난에 나서라."
 hd_dc_col_qinwang_decision_tooltip: "천하의 제후에게 조서를 내려 군사를 일으켜 근왕하고 함께 국난에 나서게 합니다."
 hd_dc_col_qinwang_decision_confirm: "천하에 근왕을 명하노라"
 hd_dc_col_qinwang_no_war_tt: "당신이 한 전쟁에서 수비하고 있으며, 아직 이 전쟁을 위해 근왕조를 내린 적이 없음"
 hd_dc_col_qinwang_legitimacy_tt: "당신의 [legitimacy|E](이)가 최소 #V [ROOT.Char.MakeScope.ScriptValue('hd_dc_col_qinwang_legitimacy_cost_value')|0]#! 이상이어야 함"
 hd_dc_col_qinwang_invite_tt: "조서는 아직 당신에게 충심이 남아 있는 제후들에게 전해지며, 이에 응한 자는 군사를 일으켜 이 전쟁에 참여합니다. 왕사가 승리하면 근왕한 제후들은 반드시 후한 보답을 받습니다."
 hd_dc_col_qinwang_joined_msg: "[hd_dc_col_qinwang_joiner.GetShortUIName](이)가 군사를 일으켜 근왕에 나섰습니다"
 hd_dc_col_qinwang_opinion: "근왕의 공"

 hd_dc_col.0001.t: "근왕조가 이르다"
 hd_dc_col.0001.desc: "천자의 조사가 밤을 새워 달려와 먹물도 채 마르지 않은 조서를 올렸다. 도적이 번갈아 침노하여 경사가 위급하니, [hd_dc_col_qinwang_emperor.GetTitledFirstName](이)가 천하의 충의로운 선비들에게 군사를 일으켜 구원하러 오라고 호소한다는 것이다.\n\n휘하 장수들이 서로 얼굴만 쳐다본다. 이번 출병이 근왕의 공을 세우는 길일까, 아니면 헛되이 남 좋은 일만 하는 길일까?"
 hd_dc_col.0001.a: "군부께서 어려움에 처하셨는데 어찌 가만히 보고만 있겠는가!"
 hd_dc_col.0001.a.tt: "당신은 부대를 이끌고 천자 측에 가담합니다. 왕사가 승리하면 천자는 결코 당신의 근왕의 공을 잊지 않을 것입니다:"
 hd_dc_col.0001.b: "군사를 멈추고 관망한다"

 # ---------- 赈灾 ----------
 hd_dc_col_disaster_relief_decision: "진재"
 hd_dc_col_disaster_relief_decision_desc: "천재가 널리 퍼져 굶어 죽은 이가 길을 메운다. 태창의 곡식을 열고 사자를 재해 지역으로 나누어 보내, 굶주린 백성을 구휼하고 집을 고쳐 주어 백성이 조정에 버림받지 않았음을 알게 한다."
 hd_dc_col_disaster_relief_decision_tooltip: "태창의 곡식을 열어 천자의 나라에서 재해를 입은 여러 현을 구휼합니다."
 hd_dc_col_disaster_relief_decision_confirm: "창고를 열어 곡식을 풀라"
 hd_dc_col_relief_no_disaster_tt: "천자의 나라 안에 자연재해나 기근의 영향을 받은 현이 있음"
 hd_dc_col_disaster_relief_county_tt: "천자의 나라 안에서 재해를 입은 모든 [county|E]의 피해가 전부 회복됨"
 hd_dc_col_relief_county_modifier: "창고를 열어 구휼함"
 hd_dc_col_relief_county_modifier_desc: "조정이 창고를 열어 구휼하니, 이재민이 감읍한다."

 # ---------- 地方自强 ----------
 hd_dc_col_local_selfstrengthen_decision: "지방 자강"
 hd_dc_col_local_selfstrengthen_decision_desc: "조정은 제 앞가림도 못 하고 도적은 사방에서 일어난다. 조정의 구원을 앉아서 기다리느니, 스스로 향용을 모으고 성보를 수리하여 경내를 지키고 백성을 편안히 하는 편이 낫다. 다만 천자가 지방이 커지는 것을 반기지 않을 수도 있다."
 hd_dc_col_local_selfstrengthen_decision_tooltip: "스스로 향용을 모으고 성보를 수리하여 경내를 지키고 백성을 편안히 하지만, 천자가 이 때문에 당신을 의심하게 됩니다."
 hd_dc_col_local_selfstrengthen_decision_confirm: "병사를 모아 스스로를 지키라"
 hd_dc_col_militia_active_tt: "아직 #V 지방 자강#! 또는 #V 모병 수권#! 상태가 아님"
 hd_dc_col_selfstrengthen_modifier: "지방 자강"
 hd_dc_col_selfstrengthen_modifier_desc: "스스로 향용을 모아 경내를 지키고 백성을 편안히 한다."
 hd_dc_col_selfstrengthen_opinion: "멋대로 병사를 모음"

 # ---------- 授权募兵 ----------
 hd_dc_col_authorize_militia_interaction: "모병 수권"
 hd_dc_col_authorize_militia_interaction_desc: "이 봉신이 스스로 병사를 모으도록 허락하고, 부세의 일부를 떼어 군자금으로 쓰게 합니다."
 hd_dc_col_authorize_militia_notification: "[actor.GetTitledFirstName](이)가 당신이 스스로 병사를 모으도록 허락하고, 부세의 일부를 떼어 군자금으로 쓰게 했습니다."
 hd_dc_col_authorize_militia_tax_tt: "앞으로 조정은 매년 이 봉신이 바친 부세의 절반을 돌려주어 군자금으로 쓰게 해야 합니다."
 hd_dc_col_authorized_militia_modifier: "모병 수권"
 hd_dc_col_authorized_militia_modifier_desc: "천자의 명을 받들어 병사를 모으고, 부세의 일부를 떼어 군자금으로 쓴다."
 hd_dc_col_authorized_militia_opinion: "모병 수권"

 # ---------- 招安 ----------
 hd_dc_col_amnesty_rebels_interaction: "초안"
 hd_dc_col_amnesty_rebels_interaction_desc: "사자를 보내 이 반군 수령을 초안하고, 관작이나 토지를 약속하여 그가 군사를 거두고 귀순하게 합니다. 상대가 초안을 받아들이면 이 반란은 [white_peace|E](으)로 끝납니다."
 hd_dc_col_amnesty_rebels_notification: "[actor.GetTitledFirstName](이)가 사자를 보내 관작과 토지를 약속하며, 군사를 거두고 귀순하라고 권합니다."
 hd_dc_col_amnesty_option_office: "봉관"
 hd_dc_col_amnesty_option_office_desc: "금백을 후하게 내리고 관직을 줍니다. 상대에게 땅이 없다면 조정으로 불러들여 신하로 삼습니다."
 hd_dc_col_amnesty_option_fief: "봉지"
 hd_dc_col_amnesty_option_fief_desc: "당신의 직할지 중 가장 척박한 현 하나(도성 제외)를 떼어 상대에게 봉하여, 당신의 봉신으로 삼습니다."
 hd_dc_col_amnesty_office_gold_tt: "봉관의 상으로 지불할 금화가 충분함"
 hd_dc_col_amnesty_must_select_tt: "초안 방식을 골라야 합니다: 봉관 또는 봉지"
 hd_dc_col_amnesty_no_fief_tt: "도성이 있는 현 외에도 최소 한 개의 현을 직할함"
 hd_dc_col_amnesty_declined_msg: "[recipient.GetShortUIName](이)가 초안을 거절했습니다"
 hd_dc_col_amnesty_ai_warscore_reason: "전황"
 hd_dc_col_amnesty_ai_fief_reason: "토지를 받음"
 hd_dc_col_amnesty_ai_greedy_reason: "상을 탐함"
 hd_dc_col_amnesty_ai_content_reason: "현상에 안주함"
 hd_dc_col_amnesty_ai_craven_reason: "싸움을 두려워함"
 hd_dc_col_amnesty_ai_ambitious_reason: "야심만만함"
 hd_dc_col_amnesty_ai_arrogant_reason: "오만방자함"
 hd_dc_col_amnesty_office_modifier: "초안을 받아 관직을 얻음"
 hd_dc_col_amnesty_office_modifier_desc: "초안을 받아들여 군사를 거두고 귀순하여 관직을 얻었다."
 hd_dc_col_amnesty_accepted_opinion: "초안의 은혜"
