l_korean:
 # 僚人入蜀（见 docs/五胡乱华_僚人入蜀_设计草案.md 第 3 节）

 rule_hd_liao_migration_rule: "요인의 입촉"
 setting_hd_liao_rule_historical: "#high 역사#!"
 setting_hd_liao_rule_historical_desc: "280년 이후, 왕조 순환이 동요, 난세 또는 붕괴 단계에 있고 촉 지역 수비 측 병력이 요족 수령(이벤트 군대 포함)의 두 배를 넘지 않을 때, AI가 매년 10% 확률로 요인의 입촉을 일으킵니다."
 setting_hd_liao_rule_random: "#high 무작위#!"
 setting_hd_liao_rule_random_desc: "연도와 관계없이 조건만 충족되면 AI가 요인의 입촉을 일으킬 수 있습니다."
 setting_hd_liao_rule_player_only: "#high 플레이어만#!"
 setting_hd_liao_rule_player_only_desc: "AI는 요인의 입촉을 일으키지 않으며, 플레이어만 결단을 통해 발동할 수 있습니다."
 setting_hd_liao_rule_off: "#high 비활성화#!"
 setting_hd_liao_rule_off_desc: "요인의 입촉을 비활성화합니다."

 hd_liao_migration_decision: "무리를 이끌고 촉으로 들어감"
 hd_liao_migration_decision_desc: "촉 땅은 해마다 전란으로 들판이 황폐하고 성읍이 비었다. 산골짜기의 요인들은 갈수록 불어나 옛 땅으로는 더 이상 이 많은 사람을 먹여 살릴 수 없다. 북쪽 파촉의 기름진 들판이 개간할 사람을 기다리고 있다."
 hd_liao_migration_decision_tooltip: "온 일족이 북상하여 촉 땅을 차지한다"
 hd_liao_migration_decision_confirm: "각 부에 명하라, 채비를 갖추고 북상한다!"
 hd_liao_migration_decision_flavour_effect: "일회성 [hd_liao_migration_casus_belli|E](을)를 얻습니다"
 hd_liao_migration_decision_year_ok: "북상할 때가 되었음"
 hd_liao_migration_decision_phase_ok: "왕조 순환이 동요, 신왕조 정복, 투쟁, 대치 또는 붕괴 단계에 있음"

 hd_liao.0001.t: "요인의 입촉"
 hd_liao.0001.desc: "산속의 삶은 해가 갈수록 힘들어진다. 동과 채마다 사람은 늘어만 가는데, 경작할 수 있는 비탈밭은 여전히 그만큼뿐이다.\n\n북쪽에서 돌아온 정탐꾼이 말하길, 촉중은 여러 해의 전란을 거치며 많은 군현에 남은 집이 몇 채 되지 않고, 밭은 묵은 채 경작하는 이가 없으며 관부도 돌볼 여력이 없다고 한다.\n\n당신이 무리를 이끌고 북상한다면, 당신의 일족은 파촉에 뿌리를 내릴 수 있을 것이다."
 hd_liao.0001.a: "촉 땅으로 진군하라!"
 hd_liao.0001.a.tt: "촉 땅의 통치자에게 일회성 특수 [hd_liao_migration_casus_belli|E](을)를 사용할 수 있습니다"
 hd_liao.0002.desc: "당신의 봉신 [hd_liao_invader.GetShortUIName](이)가 뜻밖에도 모든 요인 부중을 불러 모아 온 일족을 이끌고 북상해 촉 땅으로 옮겨 가려 한다.\n\n이 일이 이루어지면, 그 일대에 대한 당신의 장악력은 지키기 어려울 것이다."
 hd_liao.0002.a: "용맹만 있고 지모는 없구나!"
 hd_liao.0002.a.tt: "요인이 [hd_liao_migration|E](을)를 시작합니다"
 hd_liao.0003.desc: "남쪽에서 나쁜 소식이 전해졌다. 요인의 수령인 [hd_liao_invader.GetShortUIName](이)가 수하의 모든 인마를 모아 대거 북상하여 촉 땅을 차지하려 한다.\n\n지금 요인 각 부가 집결하고 있다……."
 hd_liao.0003.a: "산속의 오랑캐가 어찌 고개를 넘어오겠는가?"

 HD_LIAO_MIGRATION_WAR_NAME: "요인의 [TITLE.GetBaseName] 진입"
 HD_LIAO_MIGRATION_WAR_NAME_BASE: ""
 HD_LIAO_MIGRATION_CB_NAME: "요인의 입촉"
 hd_liao_migration_cb: "$HD_LIAO_MIGRATION_CB_NAME$"
 hd_liao_migration_war_victory_desc_attacker: "촉 땅에 있는 [defender.GetShortUINamePossessive] 모든 작위를 빼앗게 됩니다. 촉 땅 밖의 영지는 모두 포기합니다."
 hd_liao_migration_war_victory_desc: "촉 땅에 있는 [defender.GetShortUINamePossessive] 모든 작위를 빼앗습니다. 촉 땅 밖의 영지는 모두 포기합니다."
 hd_liao_migration_war_warning_desc: "\n\n#X 한 게임에서 요인의 입촉 기회는 단 한 번뿐입니다.#!"

 game_concept_hd_liao_migration_casus_belli: "$HD_LIAO_MIGRATION_CB_NAME$ 전쟁 명분"
 game_concept_hd_liao_migration: "$HD_LIAO_MIGRATION_CB_NAME$"
 game_concept_hd_liao_migration_casus_belli_desc: "한 게임에서 단 한 번만 쓸 수 있는 강력한 [casus_belli|E]로, 촉 땅 중심부와 파서의 모든 영토를 정복 목표로 합니다.\n\n승리하면 요족 수령이 촉 땅으로 천도하고, 새 수도는 요인 문화로 바뀌며, 이후 주변 백작령이 차츰 요인화됩니다. 촉 땅 밖의 봉신과 영지는 모두 포기하여 현지 군벌에게 넘깁니다."

 hd_liao_migration_effect.tt.new_capital: "촉 땅에서 개발도가 가장 높은 직할 백작령으로 천도"
 hd_liao_migration_effect.tt.capital_culture: "새 수도가 있는 [county|E](이)가 $liaoren$ 문화로 바뀜"
 hd_liao_migration_effect.tt.destroy_other_kingdoms: "[primary_title|E](을)를 제외하고 보유한 다른 [kingdoms|E](은)는 모두 소멸"
 hd_liao_migration_effect.tt.non_liao_vassals: "촉 땅 밖의 비$liaoren$ [vassals|E] [independent|E]"
 hd_liao_migration_effect.tt.liao_vassals: "촉 땅 밖의 $liaoren$ [vassals|E](은)는 촉 땅에서 새로 얻은 작위 가운데 [titles|E](을)를 나누어 받음"
 hd_liao_migration_effect.tt.former_territories: "촉 땅 밖의 옛 땅은 현지 군벌에게 넘겨짐"
 hd_liao_migration_effect.tt.settlement_story: "이후 매년 인접한 [county|E] 하나가 $liaoren$ 문화로 바뀔 수 있음"

 hd_liao_horde_title_name: "요부"
 hd_liao_horde_title_adj: "요"
 hd_liao_conquer_army_name: "입촉 요병"
 hd_liao_hold_army_name: "요부 잔류병"

 hd_foreign_settlement_county_modifier: "이민족 잡거"
 hd_foreign_settlement_county_modifier_desc: "새로 옮겨 온 이민족 부중이 원래 주민과 한데 섞여 살고 있어, 서로 어울리는 데 시간이 필요합니다."
