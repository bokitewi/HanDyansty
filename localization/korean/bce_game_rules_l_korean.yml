l_korean:
 game_rule_category_bce_mod_series:0 "@bce_icon_rule! Better Chinese Emblems（BCE）"
 rule_bce_noble_family_title:0 "@bce_icon_rule! #Clickable #Bold BCE 중국식 문장#!#!: 귀족 작위"
 setting_default_noble_family_title:0 "귀족 작위 활성화(기본)"
 setting_default_noble_family_title_desc:0 "귀족 작위가 없으면 기본적으로 성씨 인장을 사용하지 않습니다. 이 설정을 변경하면 새로 게임을 시작해야 합니다."
 setting_never_noble_family_title:0 "귀족 작위 제한 없음"
 setting_never_noble_family_title_desc:0 "귀족 작위 보유 여부와 관계없이 자격을 갖춘 집안은 모두 BCE 성씨 인장을 사용할 수 있습니다. 이 설정을 변경하면 새로 게임을 시작해야 합니다."
 rule_bce_create_cadet_branch:0 "@bce_icon_rule! #Clickable #Bold BCE 중국식 문장#!#!: 분가"
 setting_default_create_cadet_branch:0 "원판 분가 문장(기본)"
 setting_default_create_cadet_branch_desc:0 "평소대로 분가를 만들며, 새 분가는 본가와 구별되는 중국식 문장을 받습니다."
 setting_always_bce_cadet_branch:0 "성씨 인장 유지"
 setting_always_bce_cadet_branch_desc:0 "분가를 만들 때 본가의 알아볼 수 있는 성씨 인장을 유지하고, 그 위에 구별 문양을 더합니다."
