 rule_siege_building_destruction_game_rule: "공성: 건물 파괴"
 setting_siege_building_destruction_enabled: "켜기"
 setting_siege_building_destruction_disabled: "닫기"
 setting_siege_building_destruction_enabled_desc: "공성이 끝날 때 일정 확률로 일반 건물이 파괴됩니다. 확률은 점령 측의 현지 병력과 백작령 개발도에 따라 높아집니다."
 setting_siege_building_destruction_disabled_desc: "이 기능의 공성 건물 파괴 효과를 발동하지 않습니다."
 rule_siege_encampment_game_rule: "공성: 진영"
 setting_siege_encampment_enabled: "켜기"
 setting_siege_encampment_disabled: "닫기"
 setting_siege_encampment_enabled_desc: "공성 중인 군대가 매달 진영을 구축해 수비 측의 지형 이점을 약화시킵니다. 공성이 끝나면 진영은 제거됩니다."
 setting_siege_encampment_disabled_desc: "공성 중인 군대가 진영을 구축하지 않습니다."
 siege_encampment: "공성 진영"
 siege_encampment_desc: "성을 에워싼 군대가 성 밖에 참호를 파고 보루를 쌓으니, 진영은 날이 갈수록 견고해지고 성에 기대어 버티는 수비군의 이점도 그만큼 줄어든다."
 rule_scorched_earth_game_rule: "도성"
 setting_scorched_earth_enabled: "켜기"
 setting_scorched_earth_player_only: "플레이어만"
 setting_scorched_earth_independent_and_player_only: "독립 통치자와 플레이어만"
 setting_scorched_earth_independent_player_only: "독립 플레이어만"
 setting_scorched_earth_independent_only: "독립 통치자만"
 setting_scorched_earth_disabled: "닫기"
 setting_scorched_earth_enabled_desc: "플레이어와 AI 모두 조건에 따라 도성할 수 있습니다. 매번 해당 백작령이 현재 개발도의 30–90%를 무작위로 즉시 잃고, 5년간 부정적인 수정치를 받습니다."
 setting_scorched_earth_player_only_desc: "플레이어만 도성할 수 있으며, AI는 자동으로 실행하지 않습니다."
 setting_scorched_earth_independent_and_player_only_desc: "모든 플레이어와 독립 AI 통치자가 도성할 수 있습니다."
 setting_scorched_earth_independent_player_only_desc: "독립된 플레이어 통치자만 도성할 수 있습니다."
 setting_scorched_earth_independent_only_desc: "플레이어와 AI를 포함해 독립 통치자만 도성할 수 있습니다."
 setting_scorched_earth_disabled_desc: "도성 버튼과 AI의 자동 도성을 끕니다."
 scorch_earth_tooltip_desc: "#T 도성#!\n군대가 있는 땅에 병사를 풀어 불사르고 약탈하니, 성곽과 논밭과 가옥이 모조리 잿더미가 됩니다. 비록 자신의 영지라 해도 위급할 때는 불살라 적군의 물자를 끊을 수 있습니다.\n\n[GetScriptedGui('scorched_earth').BuildTooltip( GuiScope.SetRoot( ArmyWindow.GetArmy.MakeScope ).End )]"
 hd_scorched_earth_development_loss_tt: "#N 해당 백작령의 [development|E]가 급격히 후퇴합니다. 가볍게는 활력이 크게 꺾이고, 심하면 열에 아홉이 사라집니다.#!"
 hd_scorched_earth_army_ready_tt: "군대가 전투나 약탈 중이 아님"
 hd_scorched_earth_at_war_tt: "군대의 소속 통치자가 전쟁 중임"
 hd_scorched_earth_county_exists_tt: "군대가 백작령 안에 있음"
 hd_scorched_earth_territory_tt: "이 땅을 당신이 점령했음. 당신이나 당신 봉신의 영지라면 여전히 그 장악 하에 있어야 하며, 당신이 전쟁의 주요 참전자이거나 상위 주군과 교전 중이어야 함"
 hd_scorched_earth_not_scorched_tt: "해당 백작령이 최근 몇 년간 도성을 당하지 않았음"
 scorched_earth_county_modifier: "도성의 여파"
 scorched_earth_county_modifier_desc: "이 땅은 얼마 전 도륙을 당해 성곽은 무너지고 열 집 중 아홉 집이 비었으며, 살아남은 백성의 원성이 하늘을 찌른다."
 scorched_earth_province_modifier: "도성의 여파"
 scorched_earth_province_modifier_desc: "논밭과 가옥이 불타고 창고가 텅 비어, 겨울에 이곳에 주둔하는 군대는 현지에서 식량을 구하기 어렵다."
 scorched_my_holding: "나의 봉토 도륙"
