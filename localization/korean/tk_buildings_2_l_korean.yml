 building_TK_20_87_WanShanZhuShaKuang2Ji_desc: "무릉군 서남쪽 깊은 산속에는 단사 광맥이 두텁게 묻혀 있어, 토착민들이 굴을 뚫고 단사를 캔다. 태사공의 기록에 따르면 파촉의 과부 청의 선조가 단사 굴을 얻어 여러 대에 걸쳐 그 이익을 독차지했다는데, 어떤 이는 그 단사 굴이 바로 이 일대의 산속에 있다고 한다. 단사 구덩이가 점점 깊어지고, 단사를 캐는 가구들이 모여 살며 마을을 이루었다."
