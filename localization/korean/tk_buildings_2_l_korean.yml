 building_TK_20_86_KeShiMiErBaoShiKuang1Ji_desc: "계빈국 북쪽 경계의 설산 깊은 곳, 벼랑 사이에 하늘처럼 새파란 보석이 숨어 있는데, 빛깔이 짙고 고와 마치 비로드 같다. 계빈은 본래 진주와 산호, 호박의 산지로 이름났으나, 이 푸른 돌만큼은 몹시 드물다. 지금은 몇몇 토착민만 이곳에서 보석을 찾아다닌다."
