 building_type_TK_20_80_DeXingTongKuang1Ji: "구리 광산"
 building_type_TK_20_80_DeXingTongKuang1Ji_desc: "구리는 돈을 주조하고 그릇을 만드는 근본이다. 이곳은 광맥이 풍부하여 채굴과 제련의 불길이 일 년 내내 골짜기를 붉게 물들인다."
 TK_20_80_DeXingTongKuang1Ji: "덕흥 구리 광산 Ⅰ단계"
 building_TK_20_80_DeXingTongKuang1Ji: "$TK_20_80_DeXingTongKuang1Ji$"
 building_TK_20_80_DeXingTongKuang1Ji_desc: "예장군 파양현 동쪽 경계는 뭇 산에 둘러싸여 있는데, 산 사이 몇몇 샘물은 맛이 쓰고 빛깔이 푸르며, 흘러 지나는 곳마다 돌에 구릿빛이 돈다. 마을 사람들은 이를 보고 산 아래 구리 광맥이 있음을 알았다. 지금은 얕은 갱도 몇 곳만 열었을 뿐이고, 제련로도 몇 안 된다."
