 TK_20_81_TangXiTieKuang1Ji: "당계 철광 Ⅰ단계"
 building_TK_20_81_TangXiTieKuang1Ji: "$TK_20_81_TangXiTieKuang1Ji$"
 building_TK_20_81_TangXiTieKuang1Ji_desc: "여남군 서평현의 당계는 전국 시대 한나라가 검을 주조하던 곳이다. 소진이 한왕에게 유세할 때, 한나라 병사의 검과 창은 명산, 당계, 묵양 등지에서 나와 뭍에서는 소와 말을 베고 물에서는 고니와 기러기를 친다고 자랑했다. 본조는 서평현에 철관을 두었다. 지금은 얕은 갱도 몇 곳만 열었을 뿐이고, 제련로도 몇 안 된다."
