 building_type_TK_20_80_TongLvShanKuang1Ji_desc: "구리는 돈을 주조하고 그릇을 만드는 근본이다. 이곳은 광맥이 풍부하여 채굴과 제련의 불길이 일 년 내내 골짜기를 붉게 물들인다."
 TK_20_80_TongLvShanKuang1Ji: "동록산 광산 Ⅰ단계"
 building_TK_20_80_TongLvShanKuang1Ji: "$TK_20_80_TongLvShanKuang1Ji$"
 building_TK_20_80_TongLvShanKuang1Ji_desc: "강하군 악현 경내에 작은 산이 하나 있는데, 큰비가 내린 뒤면 산비탈에 푸른 녹이 점점이 피어나 마을 사람들은 이를 동록산이라 불렀다. 산중에는 아주 오래된 광정과 쇠똥이 많아, 노인들은 은주 시대부터 이곳에서 구리를 캤다고 전한다. 지금은 얕은 갱도 몇 곳만 열었을 뿐이고, 제련로도 몇 안 된다."
 building_type_TK_20_80_TongLvShanKuang2Ji: "구리 광산"
