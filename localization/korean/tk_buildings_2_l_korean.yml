 building_type_TK_20_81_WuAnTieKuang1Ji: "철광"
 building_type_TK_20_81_WuAnTieKuang1Ji_desc: "산을 뚫어 돌을 캐고 용광로를 모아 쇠를 제련하니, 나온 쇠로 쟁기와 호미, 칼과 창을 주조한다. 예로부터 관부가 철관을 두어 전담해 왔다."
 TK_20_81_WuAnTieKuang1Ji: "무안 철광 Ⅰ단계"
 building_TK_20_81_WuAnTieKuang1Ji: "$TK_20_81_WuAnTieKuang1Ji$"
 building_TK_20_81_WuAnTieKuang1Ji_desc: "위군 무안현은 서쪽으로 태항산에 기대어 있고, 산중에 철광이 풍부하여 전국 시대 조나라가 이미 이곳에서 쇠를 제련했다. 효무황제 때 조정이 이곳에 철관을 설치했다. 지금은 얕은 갱도 몇 곳만 열었을 뿐이고, 제련로도 몇 안 된다."
