 building_TK_20_81_WanChengTieKuang1Ji_desc: "남양군의 치소 완성은 예로부터 제철로 이름났으니, 초나라 사람들은 완 땅의 강철로 창을 주조했는데 그 날카롭기가 벌과 전갈의 침과 같았다. 진나라 때 양 땅 사람 공씨가 이곳으로 옮겨 와 크게 풀무질하여 주조함으로써 거부가 되었고, 지금은 조정이 다시 완성에 철관을 두었다. 지금은 얕은 갱도 몇 곳만 열었을 뿐이고, 제련로도 몇 안 된다."
