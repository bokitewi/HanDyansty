 TK_20_82_JiaMingYinKuang3Ji: "가명 은광 Ⅲ단계"
 building_TK_20_82_JiaMingYinKuang3Ji: "$TK_20_82_JiaMingYinKuang3Ji$"
 building_TK_20_82_JiaMingYinKuang3Ji_desc: "광한군 가맹현은 강가에 자리하여 두 물이 만나는 곳에 있으니, 한중에서 촉으로 들어가는 요충지이다. 현 경내의 산에 은광이 있어, 마을 사람들이 해마다 이곳에서 캐고 씻는다. 갱도와 제련장이 서로 마주 보고 일꾼들이 구름처럼 모여드니, 용광로 불이 밤낮으로 꺼지지 않는다."
