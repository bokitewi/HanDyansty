 TK_20_83_LingYangJinKuang1Ji: "능양 금광 Ⅰ단계"
 building_TK_20_83_LingYangJinKuang1Ji: "$TK_20_83_LingYangJinKuang1Ji$"
 building_TK_20_83_LingYangJinKuang1Ji_desc: "단양군 능양현의 산에서는 금이 나며, 능양의 금은 예로부터 강동에 이름이 높았다. 전하는 말에 신선 능양자명이 석지를 먹었더니 훗날 백룡이 맞으러 와서, 이 산 위에서 백여 년을 살았다고 한다. 지금은 몇몇 금 채취 가구만 이곳에서 사금을 일고 있어, 얻는 것이 얼마 되지 않는다."
