 TK_20_85_LanTianYuShiKuang1Ji: "남전 옥석 광산 Ⅰ단계"
 building_TK_20_85_LanTianYuShiKuang1Ji: "$TK_20_85_LanTianYuShiKuang1Ji$"
 building_TK_20_85_LanTianYuShiKuang1Ji_desc: "경조 남전현의 산에서는 아름다운 옥이 나는데, 빛깔이 따스하고 윤택하여 진나라 때부터 궁정에서 귀히 여겼다. 반고는 《서도부》를 지어 장안의 풍성한 물산을 자랑하며 일부러 ‘남전의 아름다운 옥’이라는 구절을 적어 넣었다. 지금은 몇몇 옥 캐는 이들만 이곳을 오간다."
