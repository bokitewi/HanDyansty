 building_type_TK_20_82_TangLangYinKuang1Ji_desc: "갱도를 열어 돌을 캐고 녹여서 은을 얻으니, 그릇과 장신구를 만들고 하사품으로 삼는다. 관부의 창고에서 귀히 여기는 물건이다."
 TK_20_82_TangLangYinKuang1Ji: "당랑 은광 Ⅰ단계"
 building_TK_20_82_TangLangYinKuang1Ji: "$TK_20_82_TangLangYinKuang1Ji$"
 building_TK_20_82_TangLangYinKuang1Ji_desc: "건위군 남부의 당랑현은 경내의 당랑산에서 이름을 땄다. 산에서는 은과 납, 백동이 나고, 부자 같은 여러 약재도 난다. 지금은 얕은 갱도 몇 곳만 열었을 뿐이고, 제련로도 몇 안 된다."
