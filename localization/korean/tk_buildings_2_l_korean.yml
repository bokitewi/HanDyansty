 TK_20_81_BianDanShanTieKuang1Ji: "편담산 철광 Ⅰ단계"
 building_TK_20_81_BianDanShanTieKuang1Ji: "$TK_20_81_BianDanShanTieKuang1Ji$"
 building_TK_20_81_BianDanShanTieKuang1Ji_desc: "남방의 아주 먼 땅, 부남국 북쪽에 길게 뻗은 산줄기가 있는데, 숲이 울창하고 장기가 자욱하다. 산중에는 철광석이 많아, 토착민들이 돌을 캐어 쇠를 제련하고 칼과 도끼를 벼린다. 지금은 얕은 갱도 몇 곳만 열었을 뿐이고, 제련로도 몇 안 된다."
