 building_TK_20_81_DaYeTieKuang1Ji_desc: "강하군 악현 동쪽의 산마루 사이에는 붉은빛 바위가 많고, 산중에는 넓은 철광이 묻혀 있다. 이곳은 큰 강에 가까워, 제련장을 두고 병기를 주조하면 물길을 따라 사방으로 실어 나를 수 있다. 지금은 얕은 갱도 몇 곳만 열었을 뿐이고, 제련로도 몇 안 된다."
