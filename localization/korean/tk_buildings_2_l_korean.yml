 building_type_TK_20_87_WanShanZhuShaKuang2Ji_desc: "단사는 피처럼 붉은빛을 띠어 약재로도 쓰고 안료로도 쓰니, 방사들은 이를 단약을 만드는 지극한 보물로 여긴다."
 TK_20_87_WanShanZhuShaKuang2Ji: "만산 주사 광산 Ⅱ단계"
