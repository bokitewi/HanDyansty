 TK_20_82_BenGuYinKuang1Ji: "분고 은광 Ⅰ단계"
 building_TK_20_82_BenGuYinKuang1Ji: "$TK_20_82_BenGuYinKuang1Ji$"
 building_TK_20_82_BenGuYinKuang1Ji_desc: "익주군 분고현은 뭇 산에 둘러싸여 있다. 현 서쪽의 양산에서는 은과 납이 나고, 북쪽의 채산과 남쪽의 오산에서는 주석이 나니, 남중에서 이름난 광산지이다. 지금은 얕은 갱도 몇 곳만 열었을 뿐이고, 제련로도 몇 안 된다."
