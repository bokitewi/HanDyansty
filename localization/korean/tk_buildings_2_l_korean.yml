 building_TK_20_83_JinShanJinKuang1Ji_desc: "광한군 북쪽 경계에 금산이라는 산이 있는데, 칠팔 리에 걸쳐 이어진다. 여름에 장마가 길어지면 산이 자주 무너지고, 무너진 자리에서 좁쌀 같은 금 알갱이가 흩어져 나와 마을 사람들이 다투어 줍는다. 지금은 몇몇 금 채취 가구만 이곳에서 사금을 일고 있어, 얻는 것이 얼마 되지 않는다."
