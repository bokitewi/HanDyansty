 building_TK_20_87_WanShanZhuShaKuang4Ji_desc: "무릉군 서남쪽 깊은 산속에는 단사 광맥이 두텁게 묻혀 있어, 토착민들이 굴을 뚫고 단사를 캔다. 태사공의 기록에 따르면 파촉의 과부 청의 선조가 단사 굴을 얻어 여러 대에 걸쳐 그 이익을 독차지했다는데, 어떤 이는 그 단사 굴이 바로 이 일대의 산속에 있다고 한다. 단사의 이익이 한 지방에서 으뜸이니, 멀고 가까운 방사와 상인들이 이름을 듣고 찾아오지 않는 이가 없다."
 building_type_TK_20_87_YuanLingZhuShaKuang1Ji: "주사 광산"
 building_type_TK_20_87_YuanLingZhuShaKuang1Ji_desc: "단사는 피처럼 붉은빛을 띠어 약재로도 쓰고 안료로도 쓰니, 방사들은 이를 단약을 만드는 지극한 보물로 여긴다."
 TK_20_87_YuanLingZhuShaKuang1Ji: "원릉 주사 광산 Ⅰ단계"
 building_TK_20_87_YuanLingZhuShaKuang1Ji: "$TK_20_87_YuanLingZhuShaKuang1Ji$"
 building_TK_20_87_YuanLingZhuShaKuang1Ji_desc: "무릉군 원릉현은 원수 가에 자리하고 있으며, 산에서 나는 단사는 빛깔이 선홍빛이고 거울처럼 영롱하여 예로부터 단사 가운데 상품으로 꼽혔다. 방사들은 이를 구해 단약을 만들고, 화공들은 이를 써서 채색한다. 지금은 단사 구덩이 몇 곳만 열었을 뿐이라, 얻는 것이 얼마 되지 않는다."
 building_type_TK_20_87_YuanLingZhuShaKuang2Ji: "주사 광산"
 building_type_TK_20_87_YuanLingZhuShaKuang2Ji_desc: "단사는 피처럼 붉은빛을 띠어 약재로도 쓰고 안료로도 쓰니, 방사들은 이를 단약을 만드는 지극한 보물로 여긴다."
 TK_20_87_YuanLingZhuShaKuang2Ji: "원릉 주사 광산 Ⅱ단계"
 building_TK_20_87_YuanLingZhuShaKuang2Ji: "$TK_20_87_YuanLingZhuShaKuang2Ji$"
 building_TK_20_87_YuanLingZhuShaKuang2Ji_desc: "무릉군 원릉현은 원수 가에 자리하고 있으며, 산에서 나는 단사는 빛깔이 선홍빛이고 거울처럼 영롱하여 예로부터 단사 가운데 상품으로 꼽혔다. 방사들은 이를 구해 단약을 만들고, 화공들은 이를 써서 채색한다. 단사 구덩이가 점점 깊어지고, 단사를 캐는 가구들이 모여 살며 마을을 이루었다."
