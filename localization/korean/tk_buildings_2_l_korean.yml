 building_TK_20_84_HeDongChiYan3Ji_desc: "하동군 안읍성 서남쪽에 큰 염지가 있어 수십 리에 걸쳐 이어지며, 못물은 짜고 쓰다. 여름날 남풍이 불 때마다 못 위에 저절로 소금이 맺혀 굳이 끓일 필요가 없으니, 조정은 이 때문에 안읍에 염관을 두었다. 염호가 모여 살며 마을을 이루고, 소금을 실은 수레와 배가 길에 끊이지 않는다."
 building_type_TK_20_84_HeDongChiYan4Ji: "염광"
 building_type_TK_20_84_HeDongChiYan4Ji_desc: "소금은 백성이 날마다 쓰는 데 없어서는 안 되는 것이다. 우물을 파 간수를 긷고, 바닷물을 끓이고 염지에서 볕에 말리니, 그 이익이 두터워 예로부터 관부가 중시했다."
 TK_20_84_HeDongChiYan4Ji: "하동 지염 Ⅳ단계"
 building_TK_20_84_HeDongChiYan4Ji: "$TK_20_84_HeDongChiYan4Ji$"
 building_TK_20_84_HeDongChiYan4Ji_desc: "하동군 안읍성 서남쪽에 큰 염지가 있어 수십 리에 걸쳐 이어지며, 못물은 짜고 쓰다. 여름날 남풍이 불 때마다 못 위에 저절로 소금이 맺혀 굳이 끓일 필요가 없으니, 조정은 이 때문에 안읍에 염관을 두었다. 소금의 이익이 두터워 한 지방을 넉넉히 부유하게 하니, 사방의 상인들이 몰려든다."
 building_type_TK_20_84_ShuoFangQingYan1Ji: "염광"
 building_type_TK_20_84_ShuoFangQingYan1Ji_desc: "소금은 백성이 날마다 쓰는 데 없어서는 안 되는 것이다. 우물을 파 간수를 긷고, 바닷물을 끓이고 염지에서 볕에 말리니, 그 이익이 두터워 예로부터 관부가 중시했다."
 TK_20_84_ShuoFangQingYan1Ji: "삭방 청염 Ⅰ단계"
 building_TK_20_84_ShuoFangQingYan1Ji: "$TK_20_84_ShuoFangQingYan1Ji$"
 building_TK_20_84_ShuoFangQingYan1Ji_desc: "삭방현 남쪽에 금련염택과 청염택이 있는데, 못에서 나는 소금은 알갱이가 굵고 빛깔이 푸르스름하게 희어 청염 또는 융염이라 불리며, 의원들이 약재로 쓴다. 조정은 이곳에 관리를 두어 소금을 관장한다. 지금은 몇몇 염호만 이곳에서 소금을 얻어, 나오는 것이 가까운 고을에서 쓰기에도 빠듯하다."
 building_type_TK_20_84_ShuoFangQingYan2Ji: "염광"
 building_type_TK_20_84_ShuoFangQingYan2Ji_desc: "소금은 백성이 날마다 쓰는 데 없어서는 안 되는 것이다. 우물을 파 간수를 긷고, 바닷물을 끓이고 염지에서 볕에 말리니, 그 이익이 두터워 예로부터 관부가 중시했다."
