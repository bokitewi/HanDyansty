 TK_20_85_DuShanYuShiKuang1Ji: "독산 옥석 광산 Ⅰ단계"
 building_TK_20_85_DuShanYuShiKuang1Ji: "$TK_20_85_DuShanYuShiKuang1Ji$"
 building_TK_20_85_DuShanYuShiKuang1Ji_desc: "남양 완성의 북쪽 교외에 독산이라는 산이 있는데, 산에서 나는 아름다운 옥은 빛깔이 얼룩덜룩하여 푸르고 희고 초록빛이고 자줏빛인 것이 뒤섞여 있다. 장형은 《남도부》를 지어 남양의 보배와 진기한 물산을 자랑하며 ‘금빛 광채의 옥돌, 수후의 구슬과 야광주’라는 구절을 남겼다. 지금은 몇몇 옥 캐는 이들만 이곳을 오간다."
