 building_TK_20_81_LiaoDongTieKuang1Ji_desc: "요동군 평곽현은 산을 등지고 바다에 닿아 있어, 산에서는 철이 나고 바닷가에서는 소금이 난다. 효무황제 때 이곳에 철관과 염관을 함께 두었다. 요동은 변경에 자리하여 병기와 갑옷, 농기구 모두 철 없이는 안 된다. 지금은 얕은 갱도 몇 곳만 열었을 뿐이고, 제련로도 몇 안 된다."
