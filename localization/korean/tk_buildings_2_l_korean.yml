 building_type_TK_20_87_WanShanZhuShaKuang1Ji: "주사 광산"
 building_type_TK_20_87_WanShanZhuShaKuang1Ji_desc: "단사는 피처럼 붉은빛을 띠어 약재로도 쓰고 안료로도 쓰니, 방사들은 이를 단약을 만드는 지극한 보물로 여긴다."
 TK_20_87_WanShanZhuShaKuang1Ji: "만산 주사 광산 Ⅰ단계"
 building_TK_20_87_WanShanZhuShaKuang1Ji: "$TK_20_87_WanShanZhuShaKuang1Ji$"
 building_TK_20_87_WanShanZhuShaKuang1Ji_desc: "무릉군 서남쪽 깊은 산속에는 단사 광맥이 두텁게 묻혀 있어, 토착민들이 굴을 뚫고 단사를 캔다. 태사공의 기록에 따르면 파촉의 과부 청의 선조가 단사 굴을 얻어 여러 대에 걸쳐 그 이익을 독차지했다는데, 어떤 이는 그 단사 굴이 바로 이 일대의 산속에 있다고 한다. 지금은 단사 구덩이 몇 곳만 열었을 뿐이라, 얻는 것이 얼마 되지 않는다."
