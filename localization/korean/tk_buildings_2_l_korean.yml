 building_TK_20_81_GongXianTieKuang1Ji_desc: "공현은 낙양 동쪽에 있으며, 남쪽으로 숭산의 남은 줄기에 기대어 있어 산중의 철광을 캘 수 있다. 하남군의 철관이 이곳에 제련장을 두었는데, 주조한 철기에는 모두 ‘하삼’ 두 글자를 새겨 표시했다. 지금은 얕은 갱도 몇 곳만 열었을 뿐이고, 제련로도 몇 안 된다."
