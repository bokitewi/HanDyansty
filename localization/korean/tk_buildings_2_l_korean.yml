 TK_20_83_HanZhongShaJinKuang1Ji: "한중 사금 광산 Ⅰ단계"
 building_TK_20_83_HanZhongShaJinKuang1Ji: "$TK_20_83_HanZhongShaJinKuang1Ji$"
 building_TK_20_83_HanZhongShaJinKuang1Ji_desc: "한수가 한중군을 흐르는데, 물밑 모래 속에 자잘한 금 알갱이가 섞여 있어 일어서 씻으면 금을 얻을 수 있다. 지금은 몇몇 금 채취 가구만 이곳에서 사금을 일고 있어, 얻는 것이 얼마 되지 않는다."
