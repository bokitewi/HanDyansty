 building_TK_20_81_LiaoDongTieKuang2Ji_desc: "요동군 평곽현은 산을 등지고 바다에 닿아 있어, 산에서는 철이 나고 바닷가에서는 소금이 난다. 효무황제 때 이곳에 철관과 염관을 함께 두었다. 요동은 변경에 자리하여 병기와 갑옷, 농기구 모두 철 없이는 안 된다. 갱도는 점점 깊어지고 제련로도 늘어나, 장인들이 모여 살며 마을을 이루었다."
 building_type_TK_20_81_LiaoDongTieKuang3Ji: "철광"
 building_type_TK_20_81_LiaoDongTieKuang3Ji_desc: "산을 뚫어 돌을 캐고 용광로를 모아 쇠를 제련하니, 나온 쇠로 쟁기와 호미, 칼과 창을 주조한다. 예로부터 관부가 철관을 두어 전담해 왔다."
