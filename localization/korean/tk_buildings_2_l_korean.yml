 building_type_TK_20_83_HanJiaJinKuang1Ji: "금광"
 building_type_TK_20_83_HanJiaJinKuang1Ji_desc: "모래를 일고 돌을 쪼아야 비로소 한 방울의 황금을 얻는다. 이 물건은 천하에 더없이 귀하여, 예로부터 관부와 호족들이 다투어 왔다."
 TK_20_83_HanJiaJinKuang1Ji: "한가 금광 Ⅰ단계"
 building_TK_20_83_HanJiaJinKuang1Ji: "$TK_20_83_HanJiaJinKuang1Ji$"
 building_TK_20_83_HanJiaJinKuang1Ji_desc: "촉군 속국의 한가현은 옛 이름이 청의였는데, 효순황제 양가 연간에 지금의 이름으로 바뀌었다. 청의수 양안의 산에서 금이 나, 사금을 이는 사람들이 물가에 흩어져 산다. 지금은 몇몇 금 채취 가구만 이곳에서 사금을 일고 있어, 얻는 것이 얼마 되지 않는다."
 building_type_TK_20_83_HanJiaJinKuang2Ji: "금광"
 building_type_TK_20_83_HanJiaJinKuang2Ji_desc: "모래를 일고 돌을 쪼아야 비로소 한 방울의 황금을 얻는다. 이 물건은 천하에 더없이 귀하여, 예로부터 관부와 호족들이 다투어 왔다."
