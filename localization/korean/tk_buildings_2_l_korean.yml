l_korean:

 building_type_TK_20_64_ZhangYeDanXiaDiMao: "지형 경관"
 building_type_TK_20_64_ZhangYeDanXiaDiMao_desc: "산과 바위가 기기묘묘하여 사람의 힘으로 만들 수 있는 것이 아니니, 마을 사람들은 흔히 신이나 요괴의 이야기를 끌어다 그 내력을 설명한다."
 TK_20_64_ZhangYeDanXiaDiMao: "장액 단하 지형"
 building_TK_20_64_ZhangYeDanXiaDiMao: "$TK_20_64_ZhangYeDanXiaDiMao$"
 building_TK_20_64_ZhangYeDanXiaDiMao_desc: "장액군 남쪽 기련산 아래의 구릉 사이에 바위가 층층이 겹쳐 있어, 붉고 누렇고 푸르고 흰 여러 빛깔이 어우러지니 마치 비단을 펼쳐 놓은 듯하다. 해가 뜨고 질 때마다 온 산이 불타는 듯하여, 오가는 수자리 병사와 상인들이 멀리서 바라보며 감탄하지 않는 이가 없다."
 building_type_TK_20_64_BaDanJiLinShaMo: "지형 경관"
 building_type_TK_20_64_BaDanJiLinShaMo_desc: "산과 바위가 기기묘묘하여 사람의 힘으로 만들 수 있는 것이 아니니, 마을 사람들은 흔히 신이나 요괴의 이야기를 끌어다 그 내력을 설명한다."
 TK_20_64_BaDanJiLinShaMo: "바단지린 사막"
 building_TK_20_64_BaDanJiLinShaMo: "$TK_20_64_BaDanJiLinShaMo$"
 building_TK_20_64_BaDanJiLinShaMo_desc: "거연택 남쪽, 약수 동쪽으로 누런 모래가 몇천 리인지 모르게 이어지고, 모래 언덕은 산처럼 높이 솟아 바람이 지나가면 모래가 천둥처럼 운다. 그런데 모래산 사이에는 푸른 작은 호수가 많이 숨어 있어 물과 풀이 풍성하니, 호인 목자들이 이따금 말을 몰고 와 물을 먹인다."
 building_type_TK_20_64_GuiLinQiXingYan: "지형 경관"
 building_type_TK_20_64_GuiLinQiXingYan_desc: "산과 바위가 기기묘묘하여 사람의 힘으로 만들 수 있는 것이 아니니, 마을 사람들은 흔히 신이나 요괴의 이야기를 끌어다 그 내력을 설명한다."
 TK_20_64_GuiLinQiXingYan: "계림 칠성암"
 building_TK_20_64_GuiLinQiXingYan: "$TK_20_64_GuiLinQiXingYan$"
 building_TK_20_64_GuiLinQiXingYan_desc: "영릉군 시안현 동쪽에 일곱 개의 돌 봉우리가 북두칠성처럼 늘어서 있다. 봉우리 속에는 깊고 그윽한 바위굴이 숨어 있는데, 굴 안에는 종유석이 거꾸로 드리우고 석순이 숲처럼 솟아 옥과 눈처럼 반짝이며, 발아래로는 지하 강이 졸졸 흐른다."
 building_type_TK_20_64_WuLingYuan: "지형 경관"
 building_type_TK_20_64_WuLingYuan_desc: "산과 바위가 기기묘묘하여 사람의 힘으로 만들 수 있는 것이 아니니, 마을 사람들은 흔히 신이나 요괴의 이야기를 끌어다 그 내력을 설명한다."
 TK_20_64_WuLingYuan: "무릉원"
 building_TK_20_64_WuLingYuan: "$TK_20_64_WuLingYuan$"
 building_TK_20_64_WuLingYuan_desc: "무릉군 충현의 깊은 산속에 수많은 돌 봉우리가 땅에서 솟아올라 죽순 같기도 하고 기둥 같기도 하며, 봉우리 꼭대기에는 푸른 소나무가 자라고 일 년 내내 구름과 안개가 감돈다. 산 아래로는 시내가 이리저리 흐르고 동굴이 깊으며, 원숭이와 사슴이 그 사이를 드나드니, 오직 무릉의 만인들만이 드나드는 길을 안다."
 building_type_TK_20_64_YunNanShiLin: "지형 경관"
 building_type_TK_20_64_YunNanShiLin_desc: "산과 바위가 기기묘묘하여 사람의 힘으로 만들 수 있는 것이 아니니, 마을 사람들은 흔히 신이나 요괴의 이야기를 끌어다 그 내력을 설명한다."
 TK_20_64_YunNanShiLin: "운남 석림"
 building_TK_20_64_YunNanShiLin: "$TK_20_64_YunNanShiLin$"
 building_TK_20_64_YunNanShiLin_desc: "익주군 전지 동남쪽의 산야에 잿빛 돌 봉우리들이 무리 지어 땅에서 솟아 있는데, 높은 것은 십여 장에 이르고 빽빽하기가 숲과 같다. 그 사이를 걷노라면 미로에 들어선 듯하여, 반나절을 돌아다녀도 출구를 찾지 못하기 일쑤다."
 building_type_TK_20_64_HaiShangShiLin: "지형 경관"
 building_type_TK_20_64_HaiShangShiLin_desc: "산과 바위가 기기묘묘하여 사람의 힘으로 만들 수 있는 것이 아니니, 마을 사람들은 흔히 신이나 요괴의 이야기를 끌어다 그 내력을 설명한다."
 TK_20_64_HaiShangShiLin: "바다 위의 석림"
 building_TK_20_64_HaiShangShiLin: "$TK_20_64_HaiShangShiLin$"
 building_TK_20_64_HaiShangShiLin_desc: "교지군 동쪽의 만에는 수많은 바위섬이 푸른 물결 속에서 우뚝 솟아 있다. 어떤 것은 기둥 같고 어떤 것은 병풍 같아, 멀리서 바라보면 마치 바다 위에 돌숲이 돋아난 듯하다. 섬의 바위굴은 깊고 그윽하며 종유석이 드리워 있어, 어부들이 작은 배를 몰고 굴에 들어가 바람을 피하곤 한다."
 building_type_TK_20_80_ShouShanTongKuang1Ji: "구리 광산"
 building_type_TK_20_80_ShouShanTongKuang1Ji_desc: "구리는 돈을 주조하고 그릇을 만드는 근본이다. 이곳은 광맥이 풍부하여 채굴과 제련의 불길이 일 년 내내 골짜기를 붉게 물들인다."
 TK_20_80_ShouShanTongKuang1Ji: "수산 구리 광산 Ⅰ단계"
 building_TK_20_80_ShouShanTongKuang1Ji: "$TK_20_80_ShouShanTongKuang1Ji$"
 building_TK_20_80_ShouShanTongKuang1Ji_desc: "태사공의 기록에 따르면, 황제가 수산의 구리를 캐어 형산 아래에서 보정을 주조했는데, 솥이 완성되던 날 용이 수염을 드리우고 내려와 황제를 맞아 하늘로 올라갔다고 한다. 수산의 구리는 이로써 천하에 이름을 떨쳤다. 지금은 얕은 갱도 몇 곳만 열었을 뿐이고, 제련로도 몇 안 된다."
 building_type_TK_20_80_ShouShanTongKuang2Ji: "구리 광산"
 building_type_TK_20_80_ShouShanTongKuang2Ji_desc: "구리는 돈을 주조하고 그릇을 만드는 근본이다. 이곳은 광맥이 풍부하여 채굴과 제련의 불길이 일 년 내내 골짜기를 붉게 물들인다."
 TK_20_80_ShouShanTongKuang2Ji: "수산 구리 광산 Ⅱ단계"
 building_TK_20_80_ShouShanTongKuang2Ji: "$TK_20_80_ShouShanTongKuang2Ji$"
 building_TK_20_80_ShouShanTongKuang2Ji_desc: "태사공의 기록에 따르면, 황제가 수산의 구리를 캐어 형산 아래에서 보정을 주조했는데, 솥이 완성되던 날 용이 수염을 드리우고 내려와 황제를 맞아 하늘로 올라갔다고 한다. 수산의 구리는 이로써 천하에 이름을 떨쳤다. 갱도는 점점 깊어지고 제련로도 늘어나, 장인들이 모여 살며 마을을 이루었다."
 building_type_TK_20_80_ShouShanTongKuang3Ji: "구리 광산"
 building_type_TK_20_80_ShouShanTongKuang3Ji_desc: "구리는 돈을 주조하고 그릇을 만드는 근본이다. 이곳은 광맥이 풍부하여 채굴과 제련의 불길이 일 년 내내 골짜기를 붉게 물들인다."
 TK_20_80_ShouShanTongKuang3Ji: "수산 구리 광산 Ⅲ단계"
 building_TK_20_80_ShouShanTongKuang3Ji: "$TK_20_80_ShouShanTongKuang3Ji$"
 building_TK_20_80_ShouShanTongKuang3Ji_desc: "태사공의 기록에 따르면, 황제가 수산의 구리를 캐어 형산 아래에서 보정을 주조했는데, 솥이 완성되던 날 용이 수염을 드리우고 내려와 황제를 맞아 하늘로 올라갔다고 한다. 수산의 구리는 이로써 천하에 이름을 떨쳤다. 갱도와 제련장이 서로 마주 보고 일꾼들이 구름처럼 모여드니, 용광로 불이 밤낮으로 꺼지지 않는다."
 building_type_TK_20_80_ShouShanTongKuang4Ji: "구리 광산"
 building_type_TK_20_80_ShouShanTongKuang4Ji_desc: "구리는 돈을 주조하고 그릇을 만드는 근본이다. 이곳은 광맥이 풍부하여 채굴과 제련의 불길이 일 년 내내 골짜기를 붉게 물들인다."
 TK_20_80_ShouShanTongKuang4Ji: "수산 구리 광산 Ⅳ단계"
 building_TK_20_80_ShouShanTongKuang4Ji: "$TK_20_80_ShouShanTongKuang4Ji$"
 building_TK_20_80_ShouShanTongKuang4Ji_desc: "태사공의 기록에 따르면, 황제가 수산의 구리를 캐어 형산 아래에서 보정을 주조했는데, 솥이 완성되던 날 용이 수염을 드리우고 내려와 황제를 맞아 하늘로 올라갔다고 한다. 수산의 구리는 이로써 천하에 이름을 떨쳤다. 갱도와 제련장이 골짜기마다 퍼져 있고 장인과 일꾼은 헤아릴 수 없으며, 나오는 것만으로 한 지방을 넉넉히 댈 수 있다."
 building_type_TK_20_80_DanYangTongKuang1Ji: "구리 광산"
 building_type_TK_20_80_DanYangTongKuang1Ji_desc: "구리는 돈을 주조하고 그릇을 만드는 근본이다. 이곳은 광맥이 풍부하여 채굴과 제련의 불길이 일 년 내내 골짜기를 붉게 물들인다."
 TK_20_80_DanYangTongKuang1Ji: "단양 구리 광산 Ⅰ단계"
 building_TK_20_80_DanYangTongKuang1Ji: "$TK_20_80_DanYangTongKuang1Ji$"
 building_TK_20_80_DanYangTongKuang1Ji_desc: "단양군의 산에는 구리 광맥이 풍부하여, 조정이 이곳에 동관을 두고 채굴과 제련을 전담하게 했다. 이곳에서 나는 구리는 천하의 좋은 구리라 일컬어져, 장인들이 거울을 주조할 때면 거울 뒷면에 흔히 ‘한나라의 좋은 구리는 단양에서 난다’는 명문을 새겼다. 지금은 얕은 갱도 몇 곳만 열었을 뿐이고, 제련로도 몇 안 된다."
