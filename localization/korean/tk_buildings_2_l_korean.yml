 TK_20_84_YanChengHaiYan1Ji: "염성 해염 Ⅰ단계"
 building_TK_20_84_YanChengHaiYan1Ji: "$TK_20_84_YanChengHaiYan1Ji$"
 building_TK_20_84_YanChengHaiYan1Ji_desc: "광릉군 염독현은 큰 바다에 닿아 있어, 바닷물에 잠겼던 갯벌 흙에 소금기가 있으니 흙을 긁어 간수를 거르고 바닷물을 끓여 소금을 만들 수 있다. 현의 수로는 오로지 소금을 실어 나르기 위해 판 것이라, 현의 이름도 염독이라 지었다. 지금은 몇몇 염호만 이곳에서 소금을 얻어, 나오는 것이 가까운 고을에서 쓰기에도 빠듯하다."
