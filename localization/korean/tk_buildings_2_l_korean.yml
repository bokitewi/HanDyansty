 building_type_TK_20_82_JiaMingYinKuang4Ji_desc: "갱도를 열어 돌을 캐고 녹여서 은을 얻으니, 그릇과 장신구를 만들고 하사품으로 삼는다. 관부의 창고에서 귀히 여기는 물건이다."
