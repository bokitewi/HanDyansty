 building_type_TK_20_85_HeTianYuShiKuang1Ji: "옥석 광산"
 building_type_TK_20_85_HeTianYuShiKuang1Ji_desc: "산에서 아름다운 옥을 캐어 규벽과 장신구로 다듬는다. 군자는 옥에 덕을 견주었으니, 예로부터 이를 귀히 여겼다."
 TK_20_85_HeTianYuShiKuang1Ji: "화전 옥석 광산 Ⅰ단계"
 building_TK_20_85_HeTianYuShiKuang1Ji: "$TK_20_85_HeTianYuShiKuang1Ji$"
 building_TK_20_85_HeTianYuShiKuang1Ji_desc: "우전국 남쪽 큰 산 아래의 강물 속에서는 아름다운 옥이 많이 난다. 효무황제 때 한나라 사신이 황하의 근원을 끝까지 찾아가 이곳의 옥석을 캐 오자, 천자는 옛 도서를 상고하여 옥석이 나는 산을 곤륜이라 이름 지었다. 지금은 몇몇 옥 캐는 이들만 이곳을 오간다."
 building_type_TK_20_85_HeTianYuShiKuang2Ji: "옥석 광산"
 building_type_TK_20_85_HeTianYuShiKuang2Ji_desc: "산에서 아름다운 옥을 캐어 규벽과 장신구로 다듬는다. 군자는 옥에 덕을 견주었으니, 예로부터 이를 귀히 여겼다."
 TK_20_85_HeTianYuShiKuang2Ji: "화전 옥석 광산 Ⅱ단계"
 building_TK_20_85_HeTianYuShiKuang2Ji: "$TK_20_85_HeTianYuShiKuang2Ji$"
 building_TK_20_85_HeTianYuShiKuang2Ji_desc: "우전국 남쪽 큰 산 아래의 강물 속에서는 아름다운 옥이 많이 난다. 효무황제 때 한나라 사신이 황하의 근원을 끝까지 찾아가 이곳의 옥석을 캐 오자, 천자는 옛 도서를 상고하여 옥석이 나는 산을 곤륜이라 이름 지었다. 옥 캐는 이들이 점점 늘어나, 옥공들이 근처에 공방을 열었다."
 building_type_TK_20_85_HeTianYuShiKuang3Ji: "옥석 광산"
 building_type_TK_20_85_HeTianYuShiKuang3Ji_desc: "산에서 아름다운 옥을 캐어 규벽과 장신구로 다듬는다. 군자는 옥에 덕을 견주었으니, 예로부터 이를 귀히 여겼다."
 TK_20_85_HeTianYuShiKuang3Ji: "화전 옥석 광산 Ⅲ단계"
 building_TK_20_85_HeTianYuShiKuang3Ji: "$TK_20_85_HeTianYuShiKuang3Ji$"
 building_TK_20_85_HeTianYuShiKuang3Ji_desc: "우전국 남쪽 큰 산 아래의 강물 속에서는 아름다운 옥이 많이 난다. 효무황제 때 한나라 사신이 황하의 근원을 끝까지 찾아가 이곳의 옥석을 캐 오자, 천자는 옛 도서를 상고하여 옥석이 나는 산을 곤륜이라 이름 지었다. 옥공들이 모여 살며 저자를 이루니, 옥을 다듬는 소리가 종일 그치지 않는다."
 building_type_TK_20_85_HeTianYuShiKuang4Ji: "옥석 광산"
 building_type_TK_20_85_HeTianYuShiKuang4Ji_desc: "산에서 아름다운 옥을 캐어 규벽과 장신구로 다듬는다. 군자는 옥에 덕을 견주었으니, 예로부터 이를 귀히 여겼다."
