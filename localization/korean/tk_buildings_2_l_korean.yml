 TK_20_83_BoNanJinKuang1Ji: "박남 금광 Ⅰ단계"
 building_TK_20_83_BoNanJinKuang1Ji: "$TK_20_83_BoNanJinKuang1Ji$"
 building_TK_20_83_BoNanJinKuang1Ji_desc: "영창군 박남현은 효명황제 때 설치되었으며, 현 남쪽 난창수의 모래에서 금이 난다. 나그네들은 박남산을 넘고 난창수를 건너야 하니 길이 몹시 험하여, 민간에서는 이런 노래가 불렸다. “박남을 넘고 난진을 지나, 난창을 건너니 남 좋은 일만 하는구나.” 지금은 몇몇 금 채취 가구만 이곳에서 사금을 일고 있어, 얻는 것이 얼마 되지 않는다."
