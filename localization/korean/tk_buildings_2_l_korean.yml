 TK_20_88_HeXianXiKuang1Ji: "하현 주석 광산 Ⅰ단계"
 building_TK_20_88_HeXianXiKuang1Ji: "$TK_20_88_HeXianXiKuang1Ji$"
 building_TK_20_88_HeXianXiKuang1Ji_desc: "창오군 임하현은 뭇 산에 둘러싸여 있고, 산속에 주석 광맥이 숨어 있다. 하수가 성 아래를 흐르니, 물길을 따라 남쪽으로 내려가면 군의 치소 광신에 닿을 수 있다. 지금은 얕은 갱도 몇 곳만 열었을 뿐이고, 제련로도 몇 안 된다."
