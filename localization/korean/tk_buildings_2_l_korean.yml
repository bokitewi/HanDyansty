 TK_20_84_WuXiBaYan1Ji: "무계 파염 Ⅰ단계"
 building_TK_20_84_WuXiBaYan1Ji: "$TK_20_84_WuXiBaYan1Ji$"
 building_TK_20_84_WuXiBaYan1Ji_desc: "남군 무현 북쪽 경계의 보원산 아래에서는 짠 샘이 솟아나, 아득한 옛날부터 사람들이 이곳에서 간수를 길어 소금을 끓였으니 이를 파염이라 부른다. 조정은 무현에 염관을 두었다. 지금은 몇몇 염호만 이곳에서 소금을 얻어, 나오는 것이 가까운 고을에서 쓰기에도 빠듯하다."
