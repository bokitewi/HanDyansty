 TK_20_81_LinQiongTieKuang1Ji: "임공 철광 Ⅰ단계"
 building_TK_20_81_LinQiongTieKuang1Ji: "$TK_20_81_LinQiongTieKuang1Ji$"
 building_TK_20_81_LinQiongTieKuang1Ji_desc: "진나라가 조나라를 무너뜨렸을 때, 조나라 사람 탁씨가 촉군 임공으로 옮겨졌다. 그는 현에 철산이 있는 것을 보고 곧 산에서 풀무질하여 주조했는데, 부리는 노비가 천 명에 이르러 한 지방의 갑부가 되었다. 조정은 훗날 임공에 철관을 설치했으며, 탁왕손의 딸 문군이 술청에서 술을 팔던 옛이야기는 지금도 마을에 전해진다. 지금은 얕은 갱도 몇 곳만 열었을 뿐이고, 제련로도 몇 안 된다."
