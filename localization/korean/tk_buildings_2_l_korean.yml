 building_TK_20_83_JinShanJinKuang3Ji_desc: "광한군 북쪽 경계에 금산이라는 산이 있는데, 칠팔 리에 걸쳐 이어진다. 여름에 장마가 길어지면 산이 자주 무너지고, 무너진 자리에서 좁쌀 같은 금 알갱이가 흩어져 나와 마을 사람들이 다투어 줍는다. 금 채취 가구가 모여 살며 마을을 이루니, 얻는 것이 날로 늘어난다."
 building_type_TK_20_83_JinShanJinKuang4Ji: "금광"
 building_type_TK_20_83_JinShanJinKuang4Ji_desc: "모래를 일고 돌을 쪼아야 비로소 한 방울의 황금을 얻는다. 이 물건은 천하에 더없이 귀하여, 예로부터 관부와 호족들이 다투어 왔다."
 TK_20_83_JinShanJinKuang4Ji: "금산 금광 Ⅳ단계"
 building_TK_20_83_JinShanJinKuang4Ji: "$TK_20_83_JinShanJinKuang4Ji$"
 building_TK_20_83_JinShanJinKuang4Ji_desc: "광한군 북쪽 경계에 금산이라는 산이 있는데, 칠팔 리에 걸쳐 이어진다. 여름에 장마가 길어지면 산이 자주 무너지고, 무너진 자리에서 좁쌀 같은 금 알갱이가 흩어져 나와 마을 사람들이 다투어 줍는다. 금 채취 가구가 구름처럼 모여들어 황금이 끊임없이 나오니, 한 지방의 큰 이익이 된다."
 building_type_TK_20_83_JiaoDongJinKuang1Ji: "금광"
 building_type_TK_20_83_JiaoDongJinKuang1Ji_desc: "모래를 일고 돌을 쪼아야 비로소 한 방울의 황금을 얻는다. 이 물건은 천하에 더없이 귀하여, 예로부터 관부와 호족들이 다투어 왔다."
 TK_20_83_JiaoDongJinKuang1Ji: "교동 금광 Ⅰ단계"
 building_TK_20_83_JiaoDongJinKuang1Ji: "$TK_20_83_JiaoDongJinKuang1Ji$"
 building_TK_20_83_JiaoDongJinKuang1Ji_desc: "동래군은 북쪽으로 큰 바다에 닿아 있고 구릉이 기복을 이루며, 시냇물의 모래와 돌 사이에 이따금 금가루가 반짝여 마을 사람들이 가끔 강가 모래톱에서 사금을 인다. 지금은 몇몇 금 채취 가구만 이곳에서 사금을 일고 있어, 얻는 것이 얼마 되지 않는다."
