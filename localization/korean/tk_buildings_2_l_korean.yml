 TK_20_85_XiuYanYuShiKuang1Ji: "수암 옥석 광산 Ⅰ단계"
 building_TK_20_85_XiuYanYuShiKuang1Ji: "$TK_20_85_XiuYanYuShiKuang1Ji$"
 building_TK_20_85_XiuYanYuShiKuang1Ji_desc: "요동군 동남쪽의 산에서는 푸른빛이 도는 아름다운 옥이 나는데, 질감이 따스하고 윤택하다. 《이아》는 의무려에서 나는 아름다운 옥을 동방의 보배로 꼽았으니, 요동의 옥은 예로부터 사람들의 칭송을 받아 왔다. 지금은 몇몇 옥 캐는 이들만 이곳을 오간다."
