 building_TK_20_81_JinChengTieKuang1Ji_desc: "상당군 남쪽 경계에는 산이 많아, 태항산의 여러 봉우리 사이에 철광이 숨어 있다. 양아 일대의 제련과 주조는 그 내력이 오래되어, 마을 사람들은 옛날 이곳에서 간장, 막야와 이름을 나란히 하는 명검이 나왔다고 전한다. 지금은 얕은 갱도 몇 곳만 열었을 뿐이고, 제련로도 몇 안 된다."
