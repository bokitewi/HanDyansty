 building_TK_20_82_ShaoGuanYinKuang1Ji_desc: "계양군 남쪽 경계의 곡강현은 두 물이 이곳에서 합쳐지고 사방에 산줄기가 겹겹이 둘러 있다. 여름과 가을에 장마가 길어지면 벼랑이 이따금 무너지는데, 무너진 자리의 부서진 돌 사이로 은빛이 점점이 반짝인다. 지금은 얕은 갱도 몇 곳만 열었을 뿐이고, 제련로도 몇 안 된다."
