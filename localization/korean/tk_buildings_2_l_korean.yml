 building_TK_20_85_PaGanYuShiKuang1Ji_desc: "영창 변경 밖 서남쪽의 깊은 산속으로 큰 강 하나가 세차게 흐르는데, 강가의 어지러운 돌 사이에서 비췻빛의 아름다운 돌을 자주 주울 수 있어, 토착민들이 이를 다듬어 장신구로 삼고 보물로 여긴다. 지금은 몇몇 옥 캐는 이들만 이곳을 오간다."
 building_type_TK_20_85_PaGanYuShiKuang2Ji: "옥석 광산"
 building_type_TK_20_85_PaGanYuShiKuang2Ji_desc: "산에서 아름다운 옥을 캐어 규벽과 장신구로 다듬는다. 군자는 옥에 덕을 견주었으니, 예로부터 이를 귀히 여겼다."
 TK_20_85_PaGanYuShiKuang2Ji: "파칸트 옥석 광산 Ⅱ단계"
 building_TK_20_85_PaGanYuShiKuang2Ji: "$TK_20_85_PaGanYuShiKuang2Ji$"
 building_TK_20_85_PaGanYuShiKuang2Ji_desc: "영창 변경 밖 서남쪽의 깊은 산속으로 큰 강 하나가 세차게 흐르는데, 강가의 어지러운 돌 사이에서 비췻빛의 아름다운 돌을 자주 주울 수 있어, 토착민들이 이를 다듬어 장신구로 삼고 보물로 여긴다. 옥 캐는 이들이 점점 늘어나, 옥공들이 근처에 공방을 열었다."
 building_type_TK_20_85_PaGanYuShiKuang3Ji: "옥석 광산"
 building_type_TK_20_85_PaGanYuShiKuang3Ji_desc: "산에서 아름다운 옥을 캐어 규벽과 장신구로 다듬는다. 군자는 옥에 덕을 견주었으니, 예로부터 이를 귀히 여겼다."
 TK_20_85_PaGanYuShiKuang3Ji: "파칸트 옥석 광산 Ⅲ단계"
 building_TK_20_85_PaGanYuShiKuang3Ji: "$TK_20_85_PaGanYuShiKuang3Ji$"
 building_TK_20_85_PaGanYuShiKuang3Ji_desc: "영창 변경 밖 서남쪽의 깊은 산속으로 큰 강 하나가 세차게 흐르는데, 강가의 어지러운 돌 사이에서 비췻빛의 아름다운 돌을 자주 주울 수 있어, 토착민들이 이를 다듬어 장신구로 삼고 보물로 여긴다. 옥공들이 모여 살며 저자를 이루니, 옥을 다듬는 소리가 종일 그치지 않는다."
 building_type_TK_20_85_PaGanYuShiKuang4Ji: "옥석 광산"
 building_type_TK_20_85_PaGanYuShiKuang4Ji_desc: "산에서 아름다운 옥을 캐어 규벽과 장신구로 다듬는다. 군자는 옥에 덕을 견주었으니, 예로부터 이를 귀히 여겼다."
 TK_20_85_PaGanYuShiKuang4Ji: "파칸트 옥석 광산 Ⅳ단계"
 building_TK_20_85_PaGanYuShiKuang4Ji: "$TK_20_85_PaGanYuShiKuang4Ji$"
 building_TK_20_85_PaGanYuShiKuang4Ji_desc: "영창 변경 밖 서남쪽의 깊은 산속으로 큰 강 하나가 세차게 흐르는데, 강가의 어지러운 돌 사이에서 비췻빛의 아름다운 돌을 자주 주울 수 있어, 토착민들이 이를 다듬어 장신구로 삼고 보물로 여긴다. 아름다운 옥이 끊임없이 나오니, 멀고 가까운 귀인들이 다투어 사들이려 한다."
 building_type_TK_20_86_MoGuBaoShiKuang1Ji: "보석 광산"
 building_type_TK_20_86_MoGuBaoShiKuang1Ji_desc: "산의 바위 사이에서 이따금 눈부시게 빛나는 아름다운 돌을 얻어 다듬어 기물로 만드니, 값이 황금에 견줄 만하여 귀인들이 다투어 소장한다."
 TK_20_86_MoGuBaoShiKuang1Ji: "모곡 보석 광산 Ⅰ단계"
 building_TK_20_86_MoGuBaoShiKuang1Ji: "$TK_20_86_MoGuBaoShiKuang1Ji$"
 building_TK_20_86_MoGuBaoShiKuang1Ji_desc: "탄국 경내에는 뭇 산이 겹겹이 솟아 있고, 골짜기의 흙과 돌 속에 피처럼 붉은 보석이 숨어 있다. 토착민들은 시냇물의 모래와 자갈 속에서 이를 일어 내는데, 어쩌다 한 알이라도 얻으면 목숨처럼 귀히 여긴다. 지금은 몇몇 토착민만 이곳에서 보석을 찾아다닌다."
 building_type_TK_20_86_MoGuBaoShiKuang2Ji: "보석 광산"
 building_type_TK_20_86_MoGuBaoShiKuang2Ji_desc: "산의 바위 사이에서 이따금 눈부시게 빛나는 아름다운 돌을 얻어 다듬어 기물로 만드니, 값이 황금에 견줄 만하여 귀인들이 다투어 소장한다."
