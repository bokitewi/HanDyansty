 building_TK_20_83_ZuoDuJinKuang1Ji_desc: "왜 땅 북쪽 바다에 큰 섬이 하나 있는데, 바람 거세고 물결 높은 해협을 사이에 두고 뭍과 떨어져 있다. 섬에는 산봉우리가 굽이치고, 산의 바위 사이에 금과 은이 숨어 있다. 지금은 몇몇 금 채취 가구만 이곳에서 사금을 일고 있어, 얻는 것이 얼마 되지 않는다."
