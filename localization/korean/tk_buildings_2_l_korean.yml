 building_TK_20_85_HeTianYuShiKuang4Ji: "$TK_20_85_HeTianYuShiKuang4Ji$"
 building_TK_20_85_HeTianYuShiKuang4Ji_desc: "우전국 남쪽 큰 산 아래의 강물 속에서는 아름다운 옥이 많이 난다. 효무황제 때 한나라 사신이 황하의 근원을 끝까지 찾아가 이곳의 옥석을 캐 오자, 천자는 옛 도서를 상고하여 옥석이 나는 산을 곤륜이라 이름 지었다. 아름다운 옥이 끊임없이 나오니, 멀고 가까운 귀인들이 다투어 사들이려 한다."
 building_type_TK_20_85_LanTianYuShiKuang1Ji: "옥석 광산"
