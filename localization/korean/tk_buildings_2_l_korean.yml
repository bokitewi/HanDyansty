 building_type_TK_20_84_ZiGongJingYan1Ji: "염광"
 building_type_TK_20_84_ZiGongJingYan1Ji_desc: "소금은 백성이 날마다 쓰는 데 없어서는 안 되는 것이다. 우물을 파 간수를 긷고, 바닷물을 끓이고 염지에서 볕에 말리니, 그 이익이 두터워 예로부터 관부가 중시했다."
 TK_20_84_ZiGongJingYan1Ji: "자공 정염 Ⅰ단계"
 building_TK_20_84_ZiGongJingYan1Ji: "$TK_20_84_ZiGongJingYan1Ji$"
 building_TK_20_84_ZiGongJingYan1Ji_desc: "건위군 강양현의 산간에는 짠 샘이 많아, 마을 사람들이 우물을 파 간수를 긷고 아궁이를 걸어 끓여 소금을 만든다. 촉 땅에서 우물을 파 소금을 얻는 법은 진나라 때 촉군 태수 이빙에게서 비롯되었다고 전한다. 지금은 몇몇 염호만 이곳에서 소금을 얻어, 나오는 것이 가까운 고을에서 쓰기에도 빠듯하다."
 building_type_TK_20_84_ZiGongJingYan2Ji: "염광"
 building_type_TK_20_84_ZiGongJingYan2Ji_desc: "소금은 백성이 날마다 쓰는 데 없어서는 안 되는 것이다. 우물을 파 간수를 긷고, 바닷물을 끓이고 염지에서 볕에 말리니, 그 이익이 두터워 예로부터 관부가 중시했다."
 TK_20_84_ZiGongJingYan2Ji: "자공 정염 Ⅱ단계"
 building_TK_20_84_ZiGongJingYan2Ji: "$TK_20_84_ZiGongJingYan2Ji$"
 building_TK_20_84_ZiGongJingYan2Ji_desc: "건위군 강양현의 산간에는 짠 샘이 많아, 마을 사람들이 우물을 파 간수를 긷고 아궁이를 걸어 끓여 소금을 만든다. 촉 땅에서 우물을 파 소금을 얻는 법은 진나라 때 촉군 태수 이빙에게서 비롯되었다고 전한다. 염호가 점점 늘어나, 소금을 파는 상인들이 오가기 시작했다."
 building_type_TK_20_84_ZiGongJingYan3Ji: "염광"
 building_type_TK_20_84_ZiGongJingYan3Ji_desc: "소금은 백성이 날마다 쓰는 데 없어서는 안 되는 것이다. 우물을 파 간수를 긷고, 바닷물을 끓이고 염지에서 볕에 말리니, 그 이익이 두터워 예로부터 관부가 중시했다."
 TK_20_84_ZiGongJingYan3Ji: "자공 정염 Ⅲ단계"
 building_TK_20_84_ZiGongJingYan3Ji: "$TK_20_84_ZiGongJingYan3Ji$"
 building_TK_20_84_ZiGongJingYan3Ji_desc: "건위군 강양현의 산간에는 짠 샘이 많아, 마을 사람들이 우물을 파 간수를 긷고 아궁이를 걸어 끓여 소금을 만든다. 촉 땅에서 우물을 파 소금을 얻는 법은 진나라 때 촉군 태수 이빙에게서 비롯되었다고 전한다. 염호가 모여 살며 마을을 이루고, 소금을 실은 수레와 배가 길에 끊이지 않는다."
 building_type_TK_20_84_ZiGongJingYan4Ji: "염광"
 building_type_TK_20_84_ZiGongJingYan4Ji_desc: "소금은 백성이 날마다 쓰는 데 없어서는 안 되는 것이다. 우물을 파 간수를 긷고, 바닷물을 끓이고 염지에서 볕에 말리니, 그 이익이 두터워 예로부터 관부가 중시했다."
 TK_20_84_ZiGongJingYan4Ji: "자공 정염 Ⅳ단계"
 building_TK_20_84_ZiGongJingYan4Ji: "$TK_20_84_ZiGongJingYan4Ji$"
 building_TK_20_84_ZiGongJingYan4Ji_desc: "건위군 강양현의 산간에는 짠 샘이 많아, 마을 사람들이 우물을 파 간수를 긷고 아궁이를 걸어 끓여 소금을 만든다. 촉 땅에서 우물을 파 소금을 얻는 법은 진나라 때 촉군 태수 이빙에게서 비롯되었다고 전한다. 소금의 이익이 두터워 한 지방을 넉넉히 부유하게 하니, 사방의 상인들이 몰려든다."
 building_type_TK_20_84_HeDongChiYan1Ji: "염광"
 building_type_TK_20_84_HeDongChiYan1Ji_desc: "소금은 백성이 날마다 쓰는 데 없어서는 안 되는 것이다. 우물을 파 간수를 긷고, 바닷물을 끓이고 염지에서 볕에 말리니, 그 이익이 두터워 예로부터 관부가 중시했다."
 TK_20_84_HeDongChiYan1Ji: "하동 지염 Ⅰ단계"
 building_TK_20_84_HeDongChiYan1Ji: "$TK_20_84_HeDongChiYan1Ji$"
 building_TK_20_84_HeDongChiYan1Ji_desc: "하동군 안읍성 서남쪽에 큰 염지가 있어 수십 리에 걸쳐 이어지며, 못물은 짜고 쓰다. 여름날 남풍이 불 때마다 못 위에 저절로 소금이 맺혀 굳이 끓일 필요가 없으니, 조정은 이 때문에 안읍에 염관을 두었다. 지금은 몇몇 염호만 이곳에서 소금을 얻어, 나오는 것이 가까운 고을에서 쓰기에도 빠듯하다."
