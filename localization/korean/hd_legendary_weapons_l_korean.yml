l_korean:
 hd_cixiong_shuanggujian_name:0 "자웅쌍고검"
 hd_cixiong_shuanggujian_description:0 "모양은 서로 다르나 기운이 서로 어울리는 한 쌍의 장검으로, 웅검은 묵직하고 자검은 날렵하여 나눌 수도 합칠 수도 있다. 전하기를 유비가 평소 이 검을 아껴 늘 두 검을 한 손에 함께 쥐고서 의병을 호령하고 위태로운 이를 돕고 곤궁한 이를 구했다고 한다."
 hd_zhangba_shemao_name:0 "장팔사모"
 hd_zhangba_shemao_description:0 "창의 길이가 한 장 여덟 자이고, 칼날은 헤엄치는 뱀처럼 구불구불하며, 긴 자루는 묵직하고 안정되어 나아가고 물러남의 변화를 헤아리기 어렵다. 이 창은 장비처럼 굳세고 사나워 앞을 가로막을 자가 없는 용사에게 가장 어울리니, 만군 가운데서 진을 깨뜨리고 깃발을 빼앗을 수 있다."
 hd_liangyin_qiang_name:0 "양은창"
 hd_liangyin_qiang_description:0 "창신은 은빛으로 빛나고 칼날은 맑고 차가우며, 장식은 간결하되 날카로운 기세를 잃지 않았다. 조운이 이를 들고 싸움에 나서면 창 그림자가 흐르는 빛처럼 오가니, 수비는 빈틈없고 공세는 날래다."
 hd_shenwei_longdan_qiang_name:0 "신위용담창"
 hd_shenwei_longdan_qiang_description:0 "뛰어난 장인이 정철과 백은을 겹겹이 상감하여 만든 장창으로, 창끝과 탄구가 맞닿는 곳이 마치 은룡이 머리를 치켜든 듯하다. 싸움터에서 들어 올리면 그 위엄이 적의 간담을 서늘하게 하기에 족하고, 무고에 간직하면 대대로 전할 보배로 삼을 만하다."
 hd_hao_longdan_name:0 "호용담"
 hd_hao_longdan_description:0 "창날은 넓고 곧게 뻗었으며, 금빛 문양이 날등을 따라 휘감아 오르니, 굳셈 속에 절로 화려한 기상이 있다. 이 창은 일격에 적을 깨뜨리는 데 중점을 두어, 창을 쥔 자의 담력과 무명을 가장 잘 드러낸다."
 hd_wushuang_fangtian_huaji_name:0 "무쌍방천화극"
 hd_wushuang_fangtian_huaji_description:0 "극의 끝은 높이 솟았고, 양옆의 초승달 모양 곁날은 날개처럼 펼쳐져 있어, 온몸에서 매서운 살기가 배어 나온다. 전하기를 여포처럼 완력이 비할 데 없는 자만이 이를 나는 듯이 휘두를 수 있었다고 한다."
