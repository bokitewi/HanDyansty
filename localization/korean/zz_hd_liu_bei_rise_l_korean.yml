l_korean:
 hd_liu_bei_rise.0100.t:0 "들판을 뒤덮은 황색 깃발"
 hd_liu_bei_rise.0100.desc:0 "급보에 적힌 지명이 하나 또 하나 이어진다. 황건이 이르는 곳마다 관군이 이미 난민 무리와 맞붙었다. 소식을 전한 자는 피란하는 백성 이야기를 하다가 소매로 얼굴을 훔쳤고, 다시 입을 열었을 때는 목이 다 쉬어 있었다.\n\n당신은 그를 앉혀 물 한 모금 마시게 하고, 직접 군보를 다시 읽어 보았다. 이 주현들은 멀기도 하고 가깝기도 하지만, 피란하는 이들 가운데 처자식을 지키려 하지 않는 이가 누가 있겠는가? 오늘 병력이 적다는 이유만으로 깃발을 거둔다면, 앞으로 무슨 낯으로 당신을 따르려는 이들에게 말을 꺼내겠는가?\n\n장막 밖에서 누군가 어디로 가느냐고 묻는다. 기다리는 얼굴들을 바라보니, 그 한마디가 평소보다 무겁게 느껴졌다. 사람을 구하러 가려면, 눈앞의 이 사람들도 함께 데려가야 한다."
 hd_liu_bei_rise.0100.a:0 "무리를 이끌고 종군하여 함께 황건을 토벌한다."
 hd_liu_bei_rise.0100.b:0 "병사도 장수도 적으니 우선 부중을 지킨다."
 hd_liu_bei_rise.0200.t:0 "관동의 의기"
 hd_liu_bei_rise.0200.desc:0 "관동의 제후들이 동탁을 토벌하려 군사를 일으켰다는 소식이 전해졌다. 전령은 맹서에 적힌 이름들을 이야기하며 각 가문의 깃발을 가리키며 신이 나서 말하다가, 당신의 깃발을 묻자 갑자기 말을 멈추었다.\n\n당신은 그 제후들의 자리에 끼어 있지 않고, 휘하의 병력도 각 방면의 대군과 견줄 수 없다. 그러나 동탁이 조정을 겁박하고 있다는 것은 원근이 다 아는 일이다. 맹서에 당신의 이름이 없다는 이유만으로 이 일이 당신과 무관하다고 여긴다면, 예전에 했던 말들은 무슨 값어치가 있겠는가?\n\n당신은 군정을 다 듣고 나서 행장을 점검하게 했다. 부중은 여전히 당신이 통솔하며, 그들이 들어야 할 것은 당신 자신의 결단이다."
 hd_liu_bei_rise.0200.a:0 "맹서에 이름은 없으나, 역적을 칠 마음은 있다."
 hd_liu_bei_rise.0200.b:0 "이번 동탁 토벌에는 관여하지 않는다."
 hd_liu_bei_rise.0300.t:0 "옛 벗의 편지"
 hd_liu_bei_rise.0300.desc:0 "“유현덕은 지금 어디에 있는가?” 동탁을 토벌하던 여러 군대가 흩어진 지 한 달, 그의 소식을 넘겨 본 당신은 서리를 불러 세웠다. 다른 이들은 저마다 얼마나 많은 병량을 가지고 돌아왔는지 헤아리고 있는데, 당신은 오히려 이 옛 동창이 어디에 발을 붙였는지 궁금했다.\n\n현덕은 뜻을 말할 때면 늘 손에 쥔 병마보다 기개가 더 넉넉했다. 그것이 꼭 나쁜 일은 아니나, 난세에 기개 하나만으로는 영채 하나도 지탱할 수 없다. 이쪽에 도와줄 사람이 하나 더 있다면, 남쪽의 군무에도 그만큼 의지할 데가 생긴다.\n\n당신은 서리에게 새 죽간을 가져오게 했지만, 속리를 징소할 때처럼 딱딱하게 쓸 필요는 없었다. 옛 벗을 초청하는 것이니 결맹의 뜻을 분명히 적으면 된다. 그가 아직 영중의 무리를 이끌고 사방을 떠돈다면, 이곳에서 받아들일 수 있다."
 hd_liu_bei_rise.0300.a:0 "현덕에게 편지를 보내 북쪽으로 오라 청한다."
 hd_liu_bei_rise.0300.b:0 "잠시 청하지 않고 각자 자기 일을 한다."
 hd_liu_bei_rise.0301.t:0 "백규의 편지"
 hd_liu_bei_rise.0301.desc:0 "“백규 형이 아직 나를 기억하는구나.” 편지 속 초청하는 대목을 읽자 당신의 입가가 먼저 풀어졌다. 사자는 이어서 결맹에 관한 일을 말하며, 당신이 아직 영중의 무리를 이끌고 떠돌고 있다면 공손찬의 치소에 주둔해도 된다고 했다.\n\n당신은 그를 가까이 앉게 하고 옛 벗의 근황을 물었다. 이리저리 떠돌며 병력이 적다, 이름이 가볍다는 말을 숱하게 들어 왔는데, 이 편지는 먼저 당신이 인마를 얼마나 데려올 수 있는지 묻지 않았다. 그러나 일단 응한다면 그곳을 그저 하룻밤 묵어가는 곳으로 여길 수는 없다. 백규에게 일이 생기면 당신도 힘을 보태야 한다.\n\n편지지가 손안에서 살짝 말려 올라갔다. 당신은 가장자리를 펴고 다시 사자를 바라보았다. 옛 벗이 물어 온 것이니, 답은 진심에서 나와야 한다. 그에게 의례적인 말 몇 마디만 들려 보낼 수는 없다."
 hd_liu_bei_rise.0301.a:0 "백규와 함께 어려움을 헤쳐 나가고자 영채를 북쪽으로 옮긴다."
 hd_liu_bei_rise.0301.b:0 "백규의 후의에 감사하되 다른 길을 도모한다."
 hd_liu_bei_rise.0400.t:0 "자룡과 서로 알아보다"
 hd_liu_bei_rise.0400.desc:0 "공손찬의 경내에 얼마간 머무는 동안 당신은 군중의 몇몇 얼굴과 차츰 친해졌다. 조운이 그중 하나였다. 병사를 논할 때는 결코 자랑하지 않으면서, 고향과 유민에 관해 물으면 늘 몇 마디 더 해 주는 사람이었다.\n\n이날 한담을 나누다 또 종군한 연유에 이르렀다. 그는 난세를 만난 사람은 누구나 백성을 편안히 정착시킬 수 있는 이를 따르기를 바란다고 했다. 당신은 이미 일어섰다가 그 말을 듣고 다시 자리에 앉았다. 그런 말을 하기는 어렵지 않다. 어려운 것은 말한 뒤에도 이해득실 앞에서 그 말을 기억하는 일이다.\n\n그는 지금도 백규의 휘하에서 일하고 있고, 당신도 곧바로 옛 벗에게 부장 하나를 달라고 할 생각은 없다. 오늘은 마음을 아는 벗 하나를 얻은 것만으로도 귀한 수확이다."
 hd_liu_bei_rise.0400.a:0 "자룡의 뜻이 나와 같다."
 hd_liu_bei_rise.0410.t:0 "옛 벗이 문을 두드리다"
 hd_liu_bei_rise.0410.desc:0 "찾아온 이가 이름을 다 고하기도 전에 당신은 이미 문가에서 일어섰다. 조운이 행장을 지닌 채 도착했는데, 그 표정은 처음 만났을 때처럼 여전히 침착했다.\n\n백규의 곁에서 사귄 뒤로 당신들은 서로가 무엇을 하고 싶어 하는지 알았지만, 저마다 갈 곳이 있어 서로 아낀다는 말 한마디로 모든 계획을 바꿀 수는 없었다. 이제 그가 옛 자리를 떠나 스스로 주인을 고를 수 있게 되자, 비로소 당신을 찾아와 아직 그와 함께 갈 생각이 있느냐고 물었다.\n\n그가 가져온 행장을 바라보며 당신은 정중한 초빙의 말을 몇 마디 하려 했으나, 말이 입가에 이르자 그저 오는 길에 쉬기는 했느냐고만 물었다. 벗이 앞으로의 길을 당신과 함께 걷겠다고 맡겨 온 것, 그것은 수많은 강개한 맹세보다 무겁다."
 hd_liu_bei_rise.0410.a:0 "자룡이 이곳에 머물러 함께 대사를 도모하기를 바란다."
 hd_liu_bei_rise.0500.t:0 "서주성 아래의 그림자"
 hd_liu_bei_rise.0500.desc:0 "조조가 연주를 차지하고 다시 이웃 주로 세력을 뻗쳤다. 주부에 들어오는 군보가 한 통 한 통 더 급박해지니, 서주의 성지와 보급로를 더는 평소처럼 다룰 수 없다.\n\n당신은 다스리는 여러 현의 수비를 다시 조사하게 하여, 무너진 성가퀴와 비어 있는 수졸을 하나하나 장부에 적었다. 수리는 먼저 할 수 있지만, 외부의 원조는 기꺼이 와 줄 사람이 있어야 한다. 유현덕은 평소 위태로운 이를 돕고 곤궁한 이를 구하려는 뜻을 품고 있으니, 사신을 보내 청한다면 당신과 맹약을 맺고 서주를 도우러 올지도 모른다.\n\n책상 위에는 성을 지키기 위한 장부와 아직 봉하지 않은 편지가 함께 놓여 있다. 지금 대비하지 않는다면, 다음에 듣게 될 것은 이웃 주의 소식이 아닐지도 모른다."
 hd_liu_bei_rise.0500.a:0 "성의 수비를 수리하고 사신을 보내 현덕을 초청한다."
 hd_liu_bei_rise.0500.b:0 "수비는 그대로 두고 잠시 청하지 않는다."
 hd_liu_bei_rise.0501.t:0 "서주에서 온 초청"
 hd_liu_bei_rise.0501.desc:0 "도겸의 사자가 당신 앞에 서 있다. 옷의 먼지도 미처 털지 못한 채, 서주의 수비를 이야기하느라 물 한 모금 청할 겨를도 없었다. “사군께서 바라시는 분은 바로 현덕공이십니다.” 그는 말을 마치고도 앉으려 하지 않았다.\n\n당신은 편지를 받아 들고, 주 안의 사정을 더 자세히 말해 달라고 청했다. 그 지명들이 귀에 들어오자, 떠오르는 것은 성지만이 아니었다. 대군이 다가오는 줄도 모르는 성안의 백성들도 있었다. 그러나 당신의 뒤에도 부중이 있고, 당신이 살길을 찾아 주기를 바라는 이들이 있다.\n\n도 사군은 당신과 결맹하여 돕기를 원하며, 당신이 아직 영중의 무리를 이끌고 떠돌고 있다면 영채를 서주로 옮기도록 받아들이겠다고 한다. 당신은 편지를 덮었다. ‘현덕’이라는 이 부름에 응한다면, 앞으로 진정한 도움을 내놓아야 한다. 찾아온 이에게 헛된 기쁨만 안겨 줄 수는 없다."
 hd_liu_bei_rise.0501.a:0 "도 사군과 한마음이 되어 영채를 서주로 옮긴다."
 hd_liu_bei_rise.0501.b:0 "이 약조는 당장 응하기 어려우니, 그대가 대신 전해 주시오."
 hd_liu_bei_rise.0600.t:0 "미씨의 마음"
 hd_liu_bei_rise.0600.desc:0 "미축은 돕겠다는 말을 꺼내며, 당신이 어떤 관직을 약속해 줄 수 있는지 서둘러 묻지 않고 오히려 당신의 부중이 지금 어떻게 지내는지부터 물었다. 당신이 대답하자 그제야 그는 미방의 이야기를 꺼내고, 천천히 두 집안의 혼사로 화제를 이끌었다.\n\n당신은 술잔을 내려놓고 정중하게 그에게 읍했다. 떠돌아다닌 이래로 자기 집안의 앞날까지 당신과 함께 묶으려는 이는 드물었으니, 이 마음을 가볍게 여길 수 없다. 다만 사람마다 얽매인 것이 있으니, 미씨 형제가 지금 있는 곳을 떠날 수 있는지, 이 혼사가 마땅한지는 먼저 분명히 해 두어야 한다.\n\n자중은 아직 당신의 대답을 기다리고 있다. 인재라면 기꺼이 초빙하고, 정의라면 기꺼이 받겠다. 그러나 혼인을 맺을지는, 술자리에서 뜻이 맞았다는 이유만으로 남의 일생을 정해 줄 수는 없다."
 hd_liu_bei_rise.0600.a:0 "두 분의 도움을 얻고, 진진지호도 맺기를 바란다."
 hd_liu_bei_rise.0600.b:0 "두 분의 도움을 청하되, 혼사는 논하지 않는다."
 hd_liu_bei_rise.0700.t:0 "병상 위의 주인"
 hd_liu_bei_rise.0700.desc:0 "살펴볼 문서 한 묶음이 병상 앞으로 왔지만, 당신은 한참을 보고도 맨 위의 한 권조차 펼치지 못했다. 병세는 하루가 다르게 무거워지고, 주의 크고 작은 일은 이제 억지로 버틴다고 처리할 수 있는 것이 아니다.\n\n유비가 지금 서주에 있다. 당신이 맡은 주군과 부중을 그에게 맡긴다면, 사후의 다급한 쟁탈은 피할 수 있을지도 모른다. 그러나 이것은 군사 한 부대를 빌리거나 원군을 한 번 청하는 것과는 다르다. 일단 넘겨주면, 치하의 관리들이 앞으로 누구의 호령을 따를지에 새로운 답이 생긴다.\n\n당신은 주인을 가까이 놓게 했다. 도씨 집안에는 도씨 집안의 승계가 있지만, 서주의 군민에게는 아직 당상에 앉아 일을 결단할 수 있는 사람이 필요하다."
 hd_liu_bei_rise.0700.a:0 "유비가 아니면 이 주를 안정시킬 수 없다."
 hd_liu_bei_rise.0700.b:0 "가업은 이어받을 사람이 따로 있으니 주를 넘길 필요 없다."
 hd_liu_bei_rise.0701.t:0 "서주를 맡기다"
 hd_liu_bei_rise.0701.desc:0 "사자가 도겸의 뜻을 두 번이나 전했지만, 당신은 여전히 그 주군 장부에 손을 뻗지 않았다. 처음 서주에 왔을 때 약속한 것은 돕는 일이었는데, 오늘 도 사군 어깨 위의 짐을 통째로 넘겨받게 될 줄이야.\n\n“이것은 빈말로 하는 양보가 아닙니다.” 사자는 나지막이 말하며 문서를 한 치 더 앞으로 밀었다. 그 위에 빽빽한 현 이름들을 보자, 눈앞에 성문과 마을, 그리고 수비군이 더는 깃발을 바꾸지 않기를 바라는 사람들이 떠오르는 듯했다. 도씨 집안의 가업은 따로 이을 사람이 있고, 당신 손에 넘어오는 것은 이 주군들의 앞날의 안위다.\n\n당신은 일어나 두어 걸음 걷다가 다시 책상 앞으로 돌아왔다. 사양하기는 쉽다. 그러나 도 사군은 병중에서 답을 기다리고 있고, 서주도 누군가는 짊어져야 한다."
 hd_liu_bei_rise.0701.a:0 "이 중한 부탁을 받으니, 감히 저버리지 않겠다."
 hd_liu_bei_rise.0701.b:0 "이 소임은 너무 무거워 비는 감당할 수 없다."
 HD_LIU_BEI_RISE_STORY_STATUS:0 "현재 장: #V [Story.MakeScope.Var('hd_liu_bei_life_phase').GetFlagName]#!\n유현덕은 탁군에서 일어났다. 돗자리를 짜고 짚신을 팔던 출신이지만, 스스로 중산정왕의 후손이라 일컬었다. 난세 속에서 그는 생사를 함께하려는 이들을 이끌고 사방을 떠돌며, 부중을 안돈하고 포부를 펼칠 수 있는 곳을 찾고 있다."
 hd_liu_bei_phase_yellow_turban:0 "황건 토벌 종군"
 hd_liu_bei_phase_wandering:0 "사방을 떠돎"
 hd_liu_bei_phase_anti_dong:0 "종군하여 동탁 토벌"
 hd_liu_bei_phase_gongsun:0 "백규에게 의탁"
 hd_liu_bei_phase_zhao_yun:0 "자룡과의 만남"
 hd_liu_bei_phase_xuzhou:0 "서주에 객거"
 hd_liu_bei_phase_xuzhou_lord:0 "서주를 다스림"
 hd_lb_xuzhou_prepared_defenses:0 "서주의 수비 정비"
 hd_lb_xuzhou_prepared_defenses_desc:0 "도겸이 성가퀴를 수리하고 수졸을 보충하게 하여, 이곳의 수비가 새로워졌습니다."
 hd_lb_yellow_join_tt:0 "당신은 부대를 이끌고 관군에 투신하여 황건과 싸웁니다."
 hd_lb_dong_join_tt:0 "맹서에 당신의 이름은 없지만, 당신은 관동의 여러 군대를 따라 동탁 토벌에 나섭니다."
 hd_lb_gongsun_send_tt:0 "편지가 현덕에게 전해질 것이며, 응할지 말지는 그가 스스로 정합니다."
 hd_lb_gongsun_accept_tt:0 "당신이 아직 영중의 무리를 이끌고 떠돌고 있다면, 영채를 북쪽으로 옮겨 백규의 치소에 주둔합니다."
 hd_lb_tao_defense_tt:0 "당신은 사신을 보내 유현덕을 만나, 서주로 와서 도와 달라고 청합니다."
 hd_lb_tao_accept_tt:0 "당신이 아직 영중의 무리를 이끌고 떠돌고 있다면, 영채를 서주로 옮겨 가까이에서 돕습니다."
 hd_lb_mi_visit_tt:0 "미축과 미방이 차례로 당신 휘하에 들어옵니다. 미씨 집안에 알맞은 여인이 있다면 당신의 아내로 허락합니다."
 hd_lb_mi_recruit_only_tt:0 "미축과 미방이 차례로 당신 휘하에 들어옵니다."
 hd_lb_bequest_tao_tt:0 "당신이 다스리던 주군과 부중을 모두 유현덕에게 맡깁니다. #EMP 인수인계가 끝나면 당신도 세상을 떠나게 됩니다.#!"
 hd_lb_bequest_liu_tt:0 "당신은 도겸이 다스리던 주군과 부중을 넘겨받아 서주의 주인이 됩니다. 인수인계가 끝나자 도 사군은 홀연히 세상을 떠납니다."
