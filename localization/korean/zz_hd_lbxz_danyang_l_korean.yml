l_korean:
 # 2026-10-24 boki：徐州内斗削弱刘备（徐州未附、丹阳兵之乱），见 zz_hd_lbxz_effects.txt 节点 0、2b
 hd_lbxz_xuzhou_unsettled:0 "서주 민심 미복"
 hd_lbxz_xuzhou_unsettled_desc:0 "도겸이 막 세상을 떠났고, 단양의 옛 부하들도 서주의 사족도 이 외지에서 온 주군에게 복종하지 않습니다. 징발도 조세도 곳곳에서 막힙니다."
 hd_lbxz.0210.t:0 "단양병의 난"
 hd_lbxz.0210.desc_killed:0 "급보가 진중에 도착했습니다. 당신이 군을 이끌고 나가 있는 사이, 장비가 하비상 조표와 다투다 노한 김에 조표를 베었습니다. 성안의 단양병은 본래 도 사군의 옛 부하들로, 외지에서 온 주군인 당신에게 마음으로 복종한 적이 없었습니다. 중랑장 [hd_lbxz_dy_leader_e.GetName]이(가) 밤사이 성문을 닫고 반란을 일으켜 주성을 차지했습니다.\n\n서주의 사민은 관망만 하고, 남아 지키던 장수들도 대부분 난병에게 항복했습니다. 장비는 가족을 지키며 성을 빠져나와 땅에 엎드려 죄를 청하고 있습니다. 도 사군이 맡긴 서주를 끝내 지켜 내지 못했습니다."
 hd_lbxz.0210.desc:0 "급보가 진중에 도착했습니다. 당신이 군을 이끌고 나가 있는 사이, 성안의 단양병이 반란을 일으켰습니다. 그들은 본래 도 사군의 옛 부하들로, 외지에서 온 주군인 당신에게 마음으로 복종한 적이 없었습니다. [hd_lbxz_dy_leader_e.GetName]이(가) 이 틈에 성문을 닫고 반란을 일으켜 주성을 차지했습니다.\n\n서주의 사민은 관망만 하고, 남아 지키던 장수들도 대부분 난병에게 항복했습니다. 도 사군이 맡긴 서주를 끝내 지켜 내지 못했습니다."
 hd_lbxz.0210.a:0 "남은 병사를 수습해 잠시 소패로 물러난다."
 hd_lbxz_danyang_tt:0 "[hd_lbxz_dy_leader_e.GetName]이(가) 당신의 모든 영지와 AI 봉신을 넘겨받아 당신의 자리를 대신합니다. 당신은 부중을 이끌고 다시 떠도는 군대가 되어 소패에 주둔합니다. 플레이어 봉신은 그 자리에서 독립합니다."
