l_korean:
 # 2026-10-26：190 曹操陈留—兖州接力（hd190.0102~0103）
 hd190.0102.t:0 "진류의 계책"
 hd190.0102.desc:0 "동탁은 이미 죽었고 연합군도 진작 흩어졌다. 제후들은 저마다 자기 군현으로 돌아가 지키고 있다. 당신이 가진 것은 진류 서쪽 변경의 기오·양읍·옹구 같은 작은 성 몇 곳뿐이고, 그곳에 주둔한 병사들의 군량은 모두 [hd190_relay_def.GetName]의 도움에 기대고 있다.

휘하의 한 사람이 진언했다. \"진류는 사방으로 통하는 땅입니다. [hd190_relay_def.GetName]이 명공의 오랜 벗이기는 하나, 너그럽기만 하고 결단이 없어 땅을 지킬 주인이 못 됩니다. 지금 제후들은 저마다 딴마음을 품고 있습니다. 명공께서 취하지 않으시면 반드시 다른 자가 취할 것입니다. 진류를 차지하면 연주를 도모할 수 있습니다.\""
 hd190.0102.a:0 "진류는 반드시 취해야 한다. 즉시 진군하라."
 hd190.0102.a.tt:0 "[hd190_relay_def.GetName]에게 병탄으로 선전포고하며, 그의 모든 영지를 목표로 한다. 승리 후에는 이어서 연주의 여러 군으로 진군한다"
 hd190.0102.b:0 "맹탁은 오랜 벗이다. 이 일은 미루자."
 hd190.0103.t:0 "연주 동략"
 hd190.0103.desc:0 "새로 얻은 성읍이 아직 안정되지도 않았는데 척후가 보고해 왔다. 연주의 여러 군은 저마다 스스로를 지킬 뿐 서로 통속되지 않으며, [hd190_relay_def.GetName]의 군사가 바로 경계 밖에 있다고 한다.

모사들은 말한다. 연주는 천하의 한가운데이자 사방에서 공격받는 땅이니, 먼저 이곳을 차지하지 않으면 발 디딜 곳이 없다. 제후들이 아직 힘을 합치지 못한 지금, 하나씩 취해야 한다고."
 hd190.0103.a:0 "승세를 타고 동진하여 [hd190_relay_def.GetName]을 친다."
 hd190.0103.a.tt:0 "[hd190_relay_def.GetName]에게 병탄으로 선전포고하며, 그의 연주 내 영지를 목표로 한다. 승리 후에도 연주 현의 7할을 실제로 장악할 때까지 동진을 계속한다"
 hd190.0103.b:0 "군사들이 지쳤다. 잠시 쉬게 하자."
