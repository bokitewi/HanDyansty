 # 来源：localization/simp_chinese/WJ_kaoke_central_l_simp_chinese.yml
 wj_kaoke_table_decision:0 "전 조정 고과표 열람"
 wj_kaoke_table_decision_confirm:0 "고과표 올리기"
 wj_kaoke_table_decision_desc:0 "상서대가 이 조정의 지방관 과부를 한 표로 모아 당신의 책상 앞에 올렸습니다. 누가 부지런하고 누가 게으른지 한눈에 알 수 있습니다."
 wj_kaoke_table_decision_tooltip:0 "이 조정 지방관들의 고과를 열람합니다"

 # 来源：localization/simp_chinese/WJ_kaoke_l_simp_chinese.yml
 wj_kaoke_ledger_decision:0 "고과부 열람"
 wj_kaoke_ledger_decision_confirm:0 "장부 올리기"
 wj_kaoke_ledger_decision_desc:0 "서리가 당신의 고과부를 받쳐 들고 왔습니다. 이번 기간에 처리한 공무, 몸소 겪은 전투, 판결한 송사가 모두 당신의 이름 아래 하나하나 기록되어 있습니다. 다른 곳으로 전임하더라도 이 장부는 당신을 따라갑니다."
 wj_kaoke_ledger_decision_tooltip:0 "이번 기간의 공과, 지난 고과 등급과 고공법을 열람합니다"

 # 来源：localization/simp_chinese/WJ_military_governance_l_simp_chinese.yml
 WJ_zw_acquire_decision:0 "총독중외 조서 청원"
 WJ_zw_acquire_decision_confirm:0 "표를 올려 조서를 청함"
 WJ_zw_acquire_decision_desc:0 "안으로는 상서의 상주를 관장하고, 밖으로는 장상의 신망을 한 몸에 지녔습니다. 녹상서사의 중임을 맡았고 조정 요직에도 뜻을 함께하는 이가 많으니, 이제 조명을 내려 달라고 청하여 중외의 모든 군사를 총독하고 황월을 빌려 군령을 하나로 할 수 있습니다."
 WJ_zw_acquire_decision_tooltip:0 "총독중외제군사, 가황월의 조명을 반포해 달라고 청합니다"

 # 来源：localization/simp_chinese/WJ_ministry_l_simp_chinese.yml
 wj_create_cheng_xiang_decision:0 "배상병정"
 wj_create_cheng_xiang_decision_confirm:0 "배상병정"
 wj_create_cheng_xiang_decision_desc:0 "승상의 자리가 오래 비어 있습니다. 비상한 때에는 비상한 인물이 조정을 총괄해야 하는 법. 지금 나의 명망이라면 천자께 나를 승상으로 임명해 달라 청하여, 입각해 정사를 잡고 만기를 대신 행할 만합니다."
 wj_create_cheng_xiang_decision_tooltip:0 "승상에 임명되어 입각해 정사를 잡고 천자의 섭정이 됩니다"

 # 来源：localization/simp_chinese/WJ_office_roads_loc_l_simp_chinese.yml
 wj_langguan_kaoxiao_decision:0 "낭관 고교"
 wj_langguan_kaoxiao_decision_confirm:0 "관서에 들어 시험을 받음"
 wj_langguan_kaoxiao_decision_desc:0 "낭관서의 고교가 또 시작됩니다. 경의, 율령, 주대의 세 시험을 치르고 나면 그간의 학문이 튼실했는지 알게 됩니다. 통과하면 효렴 출신으로 관서를 떠나 벼슬길에 나서고, 그렇지 못하면 관서에 한 해 더 머물러 이듬해에 다시 시험을 치러야 합니다."
 wj_langguan_kaoxiao_decision_tooltip:0 "낭관 고교에 참가합니다"
 wj_temp_official_kaoke_decision:0 "고과 주청"
 wj_temp_official_kaoke_decision_confirm:0 "문서를 올려 고과를 받음"
 wj_temp_official_kaoke_decision_desc:0 "가리의 신분으로 시수한 지 어느덧 한 해가 찼습니다. 이제 재임 중의 장부와 치적을 유사에 올려 고과를 기다릴 때입니다. 고과는 일을 다스리는 재능을 중시하며, 통과하면 현직의 높낮이에 따라 효렴이나 무재 출신을 얻게 됩니다."
 wj_temp_official_kaoke_decision_tooltip:0 "치적을 보고하고 고과를 받아 정식으로 벼슬길에 나서기를 구합니다"

 # 来源：localization/simp_chinese/WJ_yangwang_l_simp_chinese.yml
 WJ_yangwang_rename_decision:0 "아호 변경"
 WJ_yangwang_rename_decision_confirm:0 "아호를 새로 고름"
 WJ_yangwang_rename_decision_desc:0 "옛 호를 오래 쓰다 보니 지금의 심경과는 맞지 않을지도 모릅니다. 새 아호를 지어 가슴속 품은 뜻을 담아 봅니다."
 WJ_yangwang_rename_decision_tooltip:0 "은사 특성에 표시되는 아호를 변경합니다"
