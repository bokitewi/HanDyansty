 WJ_mufu_empty_short:0 "공석. 본부 막료를 전임시키거나 따로 벽소할 수 있음"
 WJ_mufu_history_detail:0 "#high 개부치속#!\n개부란 단지 관서 하나를 따로 세우는 것이 아니라, 부주가 막료를 두고 조를 나누어 정무를 처리하는 지위와 관련됩니다. 한대 삼공부에는 장사와 여러 조의 연속을 두었고, 장군부에도 장사, 사마 등의 관원을 두어 부의 사무와 군정을 나누어 맡겼습니다.\n\n부 안의 각 조는 저마다 맡은 바가 있어, 선거를 맡은 조도 있고 주의, 문서, 장부를 다루는 조도 있었습니다. 직무와 정원은 관부와 시대에 따라 달랐으므로, 역대로 변함없는 하나의 정해진 제도로 보아서는 안 됩니다.\n\n한말 이래로 벽소는 다시 사인을 끌어들이는 중요한 길이 되었습니다. 막료들은 부주 곁에서 논의와 계획, 행정에 참여했으며, 부주와 고리 사이에는 알아줌과 보답의 관계가 이어지곤 했습니다.\n\n사료 참고: 『후한서·백관지 1』."
 WJ_mufu_history_intro:0 "#high 개부와 막부#!\n한대의 공부와 장군부에는 막료를 두어 조를 나누어 일을 처리했습니다. 장사는 부의 사무를 총괄하고, 사마는 군정에 참여했으며, 연속은 문서와 선거 등의 일을 보좌했습니다. 한말에는 군정에 변고가 많아 부주가 사인을 벽소하니, 막부는 논의와 참모, 인재 영입의 장소를 겸하게 되었습니다. 부주와 막료 사이에도 이로써 임용과 보은의 유대가 형성되었습니다."

