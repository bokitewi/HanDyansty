 WJ_mt_subordinates_title:0 "[Character.Custom('WJ_GetUIName')] 휘하 무관"
 WJ_mt_title_label:0 "이군역예"
 WJ_mt_window_title:0 "교적조군"
 WJ_mt_zhongwai_help:0 "도독중외가 공석이면 천자가 직접 전국의 병력 조도권을 장악합니다. 지방 도독은 여전히 관할 도독구를 조도할 수 있으며, 나머지는 열람만 할 수 있습니다.\n\n중외를 총독하려면 천자의 섭정이어야 하며, 시중, 대장군, 상서령, 대사마 네 자리 중 적어도 세 자리를 당신 자신이나 당신의 문생, 부중 막료 또는 같은 종족이 맡고 있어야 합니다(한 사람이 겸임하면 자리 수대로 계산). 본조에는 단 한 명만 둡니다.\n\n'조서를 청해 중외를 총독함' 결단으로 조서를 받들고 황월을 빌립니다. 네 자리는 임명받을 때만 확인하며, 섭정 자리를 잃으면 둘 다 함께 회수됩니다."
 WJ_zw_takeover_notice:0 "#warning 도독중외제군사가 접수함#!\n도독구를 볼 수 있습니다. 설치·폐지, 구역 획정, 절 수여, 개명 및 조견은 현임 중외가 처리합니다. 중외가 자리를 잃으면 원래 권한이 회복됩니다."

