 WJ_kaoke_step_tt:0 "한 번 누를 때마다 10점을 늘리거나 줄이도록 입안하며, 확정 전에는 과부를 바꾸지 않습니다. 한 번에 증감 합계는 100점을 넘을 수 없으며, 같은 인물에게 늘렸다가 줄이면 서로 상쇄됩니다. 누군가 기가 바뀌거나 자격을 잃거나 왕조가 바뀌면 창을 닫고 다시 입안해야 합니다."
 WJ_kaoke_table_help:0 "이 표에는 본조에서 고과를 받는 모든 지방관이 수록되어 있습니다. ▲▼로 한 번에 10점씩 증감을 입안하며, 쪽을 넘기거나 필터를 써도 입안한 조정은 사라지지 않습니다. 한 번에 합계 100점을 넘을 수 없으며, 확정하면 함께 과부에 기록됩니다. 천자와 현임 상서령만 점수를 조정할 수 있으며, 각자 5년에 한 번만 가능합니다."
