 WJ_mt_preview_hint:0 "이 명령의 이행 여부는 오직 내주는 쪽의 뜻에 달려 있습니다. 명을 거역하면 군법으로 죄를 묻되, 천자는 예외입니다. 도중에 그만두는 것은 문제 삼지 않습니다."
 WJ_mt_preview_line:0 "위 내용은 입안일 뿐이며 확정해야 시행됩니다. 받는 쪽은 병력 상한을 넘을 수 있으며, 이전이 끝나면 선택이 곧바로 비워집니다."
