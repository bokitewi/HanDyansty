 WJ_mt_b_empty:0 "먼저 받을 작위를 고른 뒤, 왼쪽 열의 군단을 클릭해 이전 대기에 추가하십시오. 이 열에는 B가 원래 가진 작위 병력은 표시되지 않습니다."
 WJ_mt_b_heading:0 "B · 받을 작위 선택 (아래 열은 이번 이전 대기분만 표시)"
 WJ_mt_central_desc:0 "본조의 군적을 열람하여 여러 장수의 소속을 확인합니다. 현임 도독중외는 전국 병마를 조도하며, 중외가 공석이면 황제가 대행하고, 지방 도독은 자격에 따라 관할 도독구를 조도합니다. 같은 조정의 인물은 명부를 열람할 수 있습니다."
 WJ_mt_compensation_line:0 "국고 보상: [GetPlayer.MakeScope.Var('wj_mt_cost').GetValue|0]금화　사병을 개편하면 등급마다 원래 주인의 사재에 금화 20을 보상하며, 당신 자신의 사병도 마찬가지입니다."
