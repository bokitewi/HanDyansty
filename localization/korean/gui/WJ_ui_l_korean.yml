 WJ_mt_refresh_desc:0 "병력 출처, 비용, 내주는 쪽의 의향을 다시 점검합니다. 확정할 때 한 번 더 점검하며, 명령이 이미 무효가 되었다면 비용도 차감하지 않고 죄도 묻지 않습니다."
