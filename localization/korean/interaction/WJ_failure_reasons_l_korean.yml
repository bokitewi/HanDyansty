l_korean:
 WJ_failure_0:0 "개부하는 자는 조정 대신이거나 현임 주급 이상 지방관이어야 함"
 WJ_failure_1:0 "독립 개부 특권이나 육공 재임 개부 특권이 있어야 함"
 WJ_failure_2:0 "부주는 조정 대신, 군수 주관 또는 사례교위여야 함"
 WJ_failure_3:0 "막부에 공석인 속관 자리가 적어도 하나 있어야 함"
 WJ_failure_4:0 "후보자는 부주와 같은 조정이어야 함. 빈객은 기거하는 조정을 기준으로 함"
 WJ_failure_5:0 "후보자는 현임 관원, 정신, 빈객 또는 출사하지 않은 사족이어야 함"
 WJ_failure_6:0 "공석인 막부 직위 하나를 골라야 함"
 WJ_failure_7:0 "군국제 정체여야 함"
 WJ_failure_8:0 "명령을 내리는 자는 천자, 도독중외 또는 대장군이어야 함"
 WJ_failure_9:0 "군태수, 군수 또는 사례 지방관 계약이 있어야 함"
 WJ_failure_10:0 "군수 또는 사례의 관원이어야 하며, 군태수는 모절의 권한을 행사할 수 없음"
 WJ_failure_11:0 "대상은 선택한 도독구 또는 그 관할 군현에 속해야 함"
 WJ_failure_12:0 "도독 본인이나 그 휘하에 원조하러 갈 수 있는 사람이 있어야 함"
 WJ_failure_13:0 "사면은 황제, 섭정 또는 황제 직속의 정위가 처리해야 함"
 WJ_failure_14:0 "대상은 도독중외의 황월이 미치는 범위 안에 있거나, 명령을 내린 도독의 모절 관할 안에 있어야 함"
 WJ_failure_15:0 "당신이 시행할 권한이 있는 군령 하나를 골라야 함"
 WJ_failure_16:0 "천자나 도독중외가 직접 처리해야 함"
 WJ_failure_17:0 "원군은 이미 같은 편 참전자이거나, 원조받는 자의 적이거나, 적측과 충돌 관계에 있어서는 안 됨"
 WJ_failure_18:0 "도독구 관할 관원이거나 그 관할 군현의 관원이어야 함"
 WJ_failure_19:0 "대상은 본조의 지방관 또는 조정 대신이어야 함"
 WJ_failure_20:0 "책봉받는 자는 황제의 정처 또는 귀인이어야 함"
 WJ_failure_21:0 "부름받는 자는 임신 중이 아니어야 하며 최근에 시침하지 않았어야 함"
 WJ_failure_22:0 "현재 주급 관직에 있거나 문관 또는 무관의 직임을 맡고 있어야 함"
 WJ_failure_23:0 "지방 고과는 소속 주관에게 요청해야 함. 주관에 속하지 않은 자는 상서령에게 요청해야 함"
 WJ_failure_24:0 "본인, 접대자 또는 남작의 주군이 행정 영향력을 사용할 수 있어야 함"
 WJ_failure_25:0 "조정은 본조의 자격 있는 자에게 수여를 입안할 수 있음. 주관은 그 관할 아래 주급보다 낮은 관원에게만 입안할 수 있음"
 WJ_failure_26:0 "현재 군직이 이미 그 관직에 걸맞음"
 WJ_failure_27:0 "황제 직속인 자는 황제, 중외 또는 대장군에게 신청하고, 그 밖의 관원은 소속된 자격 있는 주관에게 신청함"
 WJ_failure_28:0 "원래 수여를 입안한 자는 여전히 본인이거나 관할권이 있는 황제, 중외, 대장군, 주관이어야 함"
 WJ_failure_29:0 "심사자는 여전히 권한이 있는 황제, 중외 또는 소속 주관이어야 함"
 WJ_failure_30:0 "입안한 군직이 여전히 그 자격에 맞고 다른 사람이 차지하지 않았어야 함"
 WJ_failure_31:0 "올해 효렴 정원을 아직 쓰지 않았고, 회답을 기다리는 천거가 없어야 함"
 WJ_failure_32:0 "후보자가 이미 벽소, 효렴 또는 무재로 출사하지 않았어야 함"
 WJ_failure_33:0 "청탁받은 자의 올해 효렴 정원이 아직 쓰이지 않았고, 회답을 기다리는 천거가 없어야 함"
 WJ_failure_34:0 "올해 무재 정원을 아직 쓰지 않았고, 회답을 기다리는 천거가 없어야 함"
 WJ_failure_35:0 "청탁받은 자의 올해 무재 정원이 아직 쓰이지 않았고, 회답을 기다리는 천거가 없어야 함"
 WJ_failure_36:0 "대상은 이미 작위가 있어서는 안 되며, 이미 책립된 황태자여서도 안 됨"
 WJ_failure_37:0 "종실이 아닌 수봉자는 작위를 계승할 사족 작위를 이미 가지고 있거나 세울 수 있어야 함"
 WJ_failure_38:0 "여성은 같은 조정의 종실이어야 함. 남성 종실은 근친 범위에 들어야 하며, 이성 남성은 군공이나 정적이 적어도 25 있어야 함"
 WJ_failure_39:0 "현임 조정 대신이거나 가문 소유가 아닌 땅을 영유해야 함"
