l_korean:
# ACOTW Compatch
trait_acotw_obscured:0 "가려진 자"
trait_acotw_obscured_desc:0 "이 캐릭터는 [diplomatic_range|E] 밖에 있어 생애의 자세한 내용을 확인하기 어렵다."
trait_acotw_obscured_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip](은)는 [diplomatic_range|E] 밖에 있어 [ROOT.GetCharacter.GetHerHis] 행적을 자세히 확인하기 어렵다."

#Commander Traits
trait_embattle_logistician: "병참 전문가"
trait_embattle_logistician_1: "숙련된 병참관"
trait_embattle_logistician_2: "군수 총관"
trait_embattle_logistician_3: "병참의 대가"
trait_embattle_logistician_desc: "병참 전문가가 아는 것이 하나 있다면, 그것은 보급을 더 오래 버티게 하는 법이다. 오래 갈수록 좋다."
trait_embattle_logistician_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip](이)가 아는 것이 하나 있다면, 그것은 보급을 더 오래 버티게 하는 법이다. 오래 갈수록 좋다."
trait_track_embattle_logistician: "병참가"
trait_track_embattle_logistician_desc: "#help 군대를 이끌고 지도 위를 이동하면 이 계열의 경험을 얻을 수 있습니다.#!\n\n보급을 장악하는 자가 전쟁을 지배하니, 그런 군대는 가장 결정적인 순간에도 결코 흔들리지 않는다."

trait_embattle_military_engineer: "군사 공병"
trait_embattle_military_engineer_1: "숙련된 공성 기술자"
trait_embattle_military_engineer_2: "파성의 대가"
trait_embattle_military_engineer_3: "성채 파괴자"
trait_embattle_military_engineer_desc: "공성 병기와 방어 시설에 폭넓은 지식을 갖춘 군사 공병은 성벽에 가로막히지 않는다."
trait_embattle_military_engineer_character_desc: "공성 병기와 방어 시설에 폭넓은 지식을 갖춘 [ROOT.GetCharacter.GetFirstNameNoTooltip](은)는 성벽에 가로막히지 않는다.\n\n#weak [embattle|E]: 부장에게서 얻음#!"
trait_track_embattle_military_engineer: "공성자"
trait_track_embattle_military_engineer_desc: "#help 공성을 성공적으로 마치면 이 계열의 경험을 얻을 수 있습니다.#!\n\n전쟁에서 겹겹의 성벽은 군대 앞에 놓인, 반드시 넘어야 할 시련이다."

trait_embattle_aggressive_attacker: "과감한 공격자"
trait_embattle_aggressive_attacker_1: "대담한 전위"
trait_embattle_aggressive_attacker_2: "두려움 없는 선봉"
trait_embattle_aggressive_attacker_3: "이름난 함진사"
trait_embattle_aggressive_attacker_desc: "적의 피가 아니면 그 무엇도 과감한 공격자를 만족시킬 수 없다."
trait_embattle_aggressive_attacker_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip](을)를 만족시킬 수 있는 것은 [ROOT.GetCharacter.GetHerHis] 적의 피뿐이다.\n\n#weak [embattle|E]: 부장에게서 얻음#!"
trait_track_embattle_aggressive_attacker: "공격 전문가"
trait_track_embattle_aggressive_attacker_desc: "#help 먼저 공격을 걸면 이 계열의 경험을 얻을 수 있습니다.#!\n\n신속한 공격이야말로 최선의 방어이다."

trait_embattle_unyielding_defender: "방어자"
trait_embattle_unyielding_defender_1: "굳건한 수호자"
trait_embattle_unyielding_defender_2: "불굴의 방어자"
trait_embattle_unyielding_defender_3: "꺼지지 않는 파수꾼"
trait_embattle_unyielding_defender_desc: "방어자가 아는 철칙: 적은 여기까지만 올 수 있다."
trait_embattle_unyielding_defender_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip](이)가 아는 철칙: 적은 여기까지만 올 수 있다.\n\n#weak [embattle|E]: 부장에게서 얻음#!"
trait_track_embattle_unyielding_defender: "방어 전문가"
trait_track_embattle_unyielding_defender_desc: "#help 전투에서 방어하면 이 계열의 경험을 얻을 수 있습니다.#!\n\n요새의 견고함은 지키는 자의 의지에 달려 있다."

trait_embattle_forder: "도하자"
trait_embattle_forder_1: "강 건넌 졸병"
trait_embattle_forder_2: "나루를 건너는 자"
trait_embattle_forder_3: "파도를 가르는 자"
trait_embattle_forder_desc: "이 캐릭터는 물가에서 제집처럼 편안하며, 전쟁에서 강이나 해협을 건너도 우위 불이익을 받지 않는다."
trait_embattle_forder_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip](은)는 물가에서 제집처럼 편안하며, 전쟁에서 강이나 해협을 건너도 우위 불이익을 받지 않는다.\n\n#weak [embattle|E]: 부장에게서 얻음#!"
trait_track_embattle_forder: "하천 전문가"
trait_track_embattle_forder_desc: "#help 해안이나 강 양안의 속주에서 싸우면 이 계열의 경험을 얻을 수 있습니다.#!\n\n남들이 거센 강과 골짜기를 볼 때, 그들은 승리로 가는 큰길을 본다."

trait_embattle_flexible_leader: "유연한 지휘관"
trait_embattle_flexible_leader_1: "임기응변가"
trait_embattle_flexible_leader_2: "전장의 만능가"
trait_embattle_flexible_leader_3: "기동전의 대가"
trait_embattle_flexible_leader_desc: "이 캐릭터는 방어 측 군대가 방어 시설, 지형, 하천, 해협에서 얻는 우위를 줄이는 법을 안다."
trait_embattle_flexible_leader_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip](은)는 방어 측 군대가 방어 시설, 지형, 하천, 해협에서 얻는 우위를 줄이는 법을 안다.\n\n#weak [embattle|E]: 부장에게서 얻음#!"
trait_track_embattle_flexible_leader: "임기응변"
trait_track_embattle_flexible_leader_desc: "#help 군대와 싸우면 이 계열의 경험을 얻을 수 있습니다.#!\n\n어느 전장에서든 적응이 생존의 열쇠이다."

trait_embattle_desert_warrior: "사막 전사"
trait_embattle_desert_warrior_1: "사구 전사"
trait_embattle_desert_warrior_2: "모래바다의 나그네"
trait_embattle_desert_warrior_3: "유사의 재앙"
trait_embattle_desert_warrior_desc: "사막의 뙤약볕과 혹서는 이 캐릭터의 적이 아니다."
trait_embattle_desert_warrior_character_desc: "사막의 뙤약볕과 혹서는 [ROOT.GetCharacter.GetFirstNameNoTooltip]의 적이 아니다.\n\n#weak [embattle|E]: 부장에게서 얻음#!"
trait_track_embattle_desert_warrior: "사막전 전문가"
trait_track_embattle_desert_warrior_desc: "#help 사막, 사막 산지, 오아시스, 건조 지대에서 싸우면 이 계열의 경험을 얻을 수 있습니다.#!\n\n광막하고 혹독한 사막에서는 굳건히 견디는 자가 모든 것을 이긴다."

trait_embattle_jungle_stalker: "정글 추적자"
trait_embattle_jungle_stalker_1: "덩굴의 칼날"
trait_embattle_jungle_stalker_2: "수관의 사냥꾼"
trait_embattle_jungle_stalker_3: "정글의 그림자"
trait_embattle_jungle_stalker_desc: "정글의 무성한 숲은 모두 이 캐릭터의 동맹이다."
trait_embattle_jungle_stalker_character_desc: "정글의 무성한 숲은 모두 [ROOT.GetCharacter.GetFirstNameNoTooltip]의 동맹이다.\n\n#weak [embattle|E]: 부장에게서 얻음#!"
trait_track_embattle_jungle_stalker: "정글전 전문가"
trait_track_embattle_jungle_stalker_desc: "#help 정글 지형에서 싸우면 이 계열의 경험을 얻을 수 있습니다.#!\n\n하늘을 가린 정글 속에는 은신의 대가가 매복하여, 언제든 어둠 속에서 공격할 채비를 하고 있다."

trait_embattle_reaver: "약탈자"
trait_embattle_reaver_1: "노략자"
trait_embattle_reaver_2: "강탈자"
trait_embattle_reaver_3: "공포의 화신"
trait_embattle_reaver_desc: "약탈자는 승리만큼이나 전리품을 갈망한다. 값진 것이 있다면 약탈자는 반드시 찾아낸다."
trait_embattle_reaver_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip](은)는 승리만큼이나 전리품을 갈망하여, 값진 것이 있다면 [ROOT.GetCharacter.GetSheHe] 반드시 찾아낸다.\n\n#weak [embattle|E]: 부장에게서 얻음#!"
trait_track_embattle_reaver: "약탈자"
trait_track_embattle_reaver_desc: "#help 정착지를 성공적으로 약탈하면 이 계열의 경험을 얻을 수 있습니다.#!\n\n약탈자가 지나간 곳은 모든 것이 전화와 정복으로 깊이 뒤바뀐다."

trait_embattle_reckless: "무모함"
trait_embattle_reckless_1: "모험적인 지휘관"
trait_embattle_reckless_2: "전장의 도박꾼"
trait_embattle_reckless_3: "야성의 심장"
trait_embattle_reckless_desc: "무모한 지휘관은 우위를 발견하면 반드시 단단히 움켜쥔다."
trait_embattle_reckless_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip](은)는 우위를 발견하면 반드시 단단히 움켜쥔다.\n\n#weak [embattle|E]: 부장에게서 얻음#!"
trait_track_embattle_reckless: "대담한 지휘관"
trait_track_embattle_reckless_desc: "#help 더 큰 규모의 군대와 싸우면 이 계열의 경험을 얻을 수 있습니다.#!\n\n운명은 위대한 대업을 위해 모든 위험을 무릅쓰는 자를 돌본다."

trait_embattle_holy_warrior: "신앙의 검"
trait_embattle_holy_warrior_1: "신명의 칼날"
trait_embattle_holy_warrior_2: "성전사"
trait_embattle_holy_warrior_3: "신앙의 용사"
trait_embattle_holy_warrior_desc: "정의의 열정이 활활 타오르니, 신앙의 검은 모든 이교도가 멸할 때까지 멈추지 않는다."
trait_embattle_holy_warrior_character_desc: "정의의 광열이 타오르니, [ROOT.GetCharacter.GetFirstNameNoTooltip](은)는 이교도가 모두 무너질 때까지 쉬지 않는다.\n\n#weak [embattle|E]: 부장에게서 얻음#!"
trait_track_embattle_holy_warrior: "광신자"
trait_track_embattle_holy_warrior_desc: "#help 다른 신앙의 적과 싸우면 이 계열의 경험을 얻을 수 있습니다.#!\n\n신앙으로 마음을 단련하면 이기지 못할 적도, 물러설 싸움도 없다."

trait_embattle_open_terrain_expert: "개활지 전문가"
trait_embattle_open_terrain_expert_1: "들판의 파수꾼"
trait_embattle_open_terrain_expert_2: "광야의 전략가"
trait_embattle_open_terrain_expert_3: "평원의 주인"
trait_embattle_open_terrain_expert_desc: "탁 트인 들판과 넓은 공간에 이르면 이 캐릭터는 제집에 온 듯하며, 이를 재빨리 전투에 활용한다."
trait_embattle_open_terrain_expert_character_desc: "탁 트인 들판과 넓은 공간에 이르면 [ROOT.GetCharacter.GetFirstNameNoTooltip](은)는 제집에 온 듯하며, 이를 재빨리 전투에 활용한다.\n\n#weak [embattle|E]: 부장에게서 얻음#!"
trait_track_embattle_open_terrain_expert: "개활지 전문가"
trait_track_embattle_open_terrain_expert_desc: "#help 평원, 농지, 초원 지형에서 싸우면 이 계열의 경험을 얻을 수 있습니다.#!\n\n탁 트인 들판은 무한한 기동과 승리의 기회를 준다."

trait_embattle_rough_terrain_expert: "험지 전문가"
trait_embattle_rough_terrain_expert_1: "개척의 선구자"
trait_embattle_rough_terrain_expert_2: "고지 전술가"
trait_embattle_rough_terrain_expert_3: "군봉의 주인"
trait_embattle_rough_terrain_expert_desc: "험한 지형을 이용해 전투에서 우위를 점할 줄 아는 자에게 험지는 강력한 도구가 될 수 있다."
trait_embattle_rough_terrain_expert_character_desc: "험한 지형을 이용해 전투에서 우위를 점할 줄 아는 자에게 험지는 강력한 도구가 될 수 있다.\n\n#weak [embattle|E]: 부장에게서 얻음#!"
trait_track_embattle_rough_terrain_expert: "험지 전문가"
trait_track_embattle_rough_terrain_expert_desc: "#help 구릉, 산악, 습지 지형에서 싸우면 이 계열의 경험을 얻을 수 있습니다.#!\n\n가장 혹독한 환경에서 승리는 어려움에 맞서는 자의 것이다."

trait_embattle_forest_fighter: "숲의 투사"
trait_embattle_forest_fighter_1: "숲속 추적자"
trait_embattle_forest_fighter_2: "숲의 파수꾼"
trait_embattle_forest_fighter_3: "숲의 주인"
trait_embattle_forest_fighter_desc: "어떤 이들은 숲을 장애물로 보지만, 이 캐릭터는 숲을 기회로 본다."
trait_embattle_forest_fighter_character_desc: "어떤 이들은 숲을 장애물로 보지만, [ROOT.GetCharacter.GetFirstNameNoTooltip](은)는 숲을 기회로 본다.\n\n#weak [embattle|E]: 부장에게서 얻음#!"
trait_track_embattle_forest_fighter: "삼림전 전문가"
trait_track_embattle_forest_fighter_desc: "#help 숲이나 침엽수림 지형에서 싸우면 이 계열의 경험을 얻을 수 있습니다.#!\n\n숲속에서는 나무 그림자 하나하나가 방패이고, 나뭇가지 하나하나가 동맹이다."

trait_embattle_cautious_leader: "신중한 지휘관"
trait_embattle_cautious_leader_1: "인내심 있는 계획가"
trait_embattle_cautious_leader_2: "경계하는 지휘관"
trait_embattle_cautious_leader_3: "신중함의 대가"
trait_embattle_cautious_leader_desc: "신중한 지휘관은 전투에서 불필요한 위험을 조심스럽게 피하지만, 그 때문에 잠재적인 이득을 놓치기도 한다."
trait_embattle_cautious_leader_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip](은)는 전투에서 불필요한 위험을 조심스럽게 피하지만, 그 때문에 잠재적인 이득을 놓치기도 한다.\n\n#weak [embattle|E]: 부장에게서 얻음#!"
trait_track_embattle_cautious_leader: "신중한 사령관"
trait_track_embattle_cautious_leader_desc: "#help 더 큰 규모의 군대와 싸우면 이 계열의 경험을 얻을 수 있습니다.#!\n\n인내와 치밀함으로 모든 걸음을 계획 안에 두어 손실을 최소로 줄인다."

trait_embattle_organizer: "조직가"
trait_embattle_organizer_1: "전술가"
trait_embattle_organizer_2: "강행군 기획자"
trait_embattle_organizer_3: "운동전의 대가"
trait_embattle_organizer_desc: "유능한 자의 손에서 잘 조직된 군대는 어떤 상황에서도 신속히 적을 격파한다."
trait_embattle_organizer_character_desc: "유능한 자의 손에서 잘 조직된 군대는 어떤 상황에서도 신속히 적을 격파한다.\n\n#weak [embattle|E]: 부장에게서 얻음#!"
trait_track_embattle_organizer: "행군자"
trait_track_embattle_organizer_desc: "#help 군대를 이끌고 지도 위를 이동하면 이 계열의 경험을 얻을 수 있습니다.#!\n\n잘 조율된 부대는 빠르게 움직여 적을 정확히 타격한다."

trait_embattle_winter_soldier: "동장군"
trait_embattle_winter_soldier_1: "서리의 파수꾼"
trait_embattle_winter_soldier_2: "설원의 노병"
trait_embattle_winter_soldier_3: "혹한의 주인"
trait_embattle_winter_soldier_desc: "이 캐릭터는 혹독한 겨울에 단련되어 이를 자신의 우위로 바꾸는 법을 안다."
trait_embattle_winter_soldier_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip](은)는 혹독한 겨울에 단련되어 이를 [ROOT.GetCharacter.GetHerHis] 우위로 바꾸는 법을 안다.\n\n#weak [embattle|E]: 부장에게서 얻음#!"
trait_track_embattle_winter_soldier: "동계전 전문가"
trait_track_embattle_winter_soldier_desc: "#help 겨울의 영향을 받는 속주에서 싸우면 이 계열의 경험을 얻을 수 있습니다.#!\n\n혹한은 적이 아니다. 굳건히 견디는 자에게 혹한은 동맹이다."

#Commander Traits (cultural traditions)
trait_embattle_sea_raider: "해상 습격자"
trait_embattle_sea_raider_desc: "해상 습격자는 바다의 거센 파도를 두려워하지 않으며, 대담하고 뛰어난 항해술로 방비 없는 해안을 예고 없이 습격한다."
