 hd_dc_sta_scheme_not_bordering: "상대의 영지가 당신과 국경을 맞대지 않음"
 hd_dc_sta_scheme_target_in_faction: "상대가 이미 주군에 맞서는 파벌에 속해 있음"
 hd_dc_sta_subversion_invalidated_title: "@scheme_icon!회유 중단"
 hd_dc_sta_subversion_invalidated_tt: "회유 대상이나 정세가 바뀌어 모략이 중단됨"
