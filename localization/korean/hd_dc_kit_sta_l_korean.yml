 hd_dc_sta_incited_rebellion_modifier_desc: "누군가 은밀히 이 자를 지원하여 그 주군과 적이 되게 하였으며, 모은 병력이 매우 많다."

 # 策反：事件
 hd_dc_sta.0101.t: "반기가 오르다"
 hd_dc_sta.0101.desc: "사자가 돌아와 보고하였다. [target.GetShortUIName](이)가 마침내 결심을 굳히고 군사를 일으켜 [target.GetHerHis] 주군에게 반기를 들고 독립하였다는 것이다. 적국은 이제 심복지환을 하나 더 떠안게 되었다."
 hd_dc_sta.0101.a: "잠시 앉아서 저들끼리 싸우는 것을 지켜보리라."
 hd_dc_sta.0102.t: "땅을 들고 귀순하다"
 hd_dc_sta.0102.desc: "[target.GetShortUIName](이)가 약속대로 찾아와, 자신의 봉토를 가지고 섬기는 이를 바꾸어 당신을 주군으로 받들었다. 적국은 한 팔을 잃고, 당신은 한 팔을 얻었다."
 hd_dc_sta.0102.a: "좋은 새는 나무를 가려 깃드는 법이지."
 hd_dc_sta.0103.t: "화기소장"
 hd_dc_sta.0103.desc: "[target.GetShortUIName](은)는 이미 설득되어 [target.GetHerHis] 주군과의 틈이 날로 깊어지고 있으며, 뜻을 같이하는 자들을 규합하며 병기를 갈고 말을 먹이고 있다."
 hd_dc_sta.0103.a: "불씨는 이미 붙었으니, 조용히 변고를 기다리리라."
 hd_dc_sta.subversion_target_gone.desc: "사자가 돌아와 보고하였다. 시세가 바뀌어 [target.GetShortUIName]의 처지가 처음과 달라졌으니, 이번 회유는 더 말할 것도 없게 되었다."
 hd_dc_sta.0109.t: "설득 실패"
 hd_dc_sta.0109.desc: "[target.GetShortUIName](은)는 당신의 사자를 건성으로 대하더니, 끝내 [target.GetHerHis] 주군을 저버리려 하지 않았다. 다행히 이 일은 아직 소문나지 않았다."
 hd_dc_sta.0109.desc_reported: "[target.GetShortUIName](은)는 당신의 사자를 거절했을 뿐 아니라, 이 일을 [target.GetHerHis] 주군에게 낱낱이 고해 바쳤다. 이제 두 나라 사이에는 더 이상 신의라 할 것이 남지 않았을 것이다."
 hd_dc_sta.0109.a: "애석하도다."
