 hd_dc_sta_subversion_exposed_owner_tt: "당신의 회유 모략이 상대에게 발각되어 양측의 사이가 틀어짐"
 hd_dc_sta_subversion_exposed_opinion: "내 봉신을 회유함"
 hd_dc_sta_defected_opinion: "타국으로 배반하여 귀순함"
