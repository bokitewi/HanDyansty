 # 策反：互动
 hd_dc_sta_incite_independence_interaction: "독립 선동#weak (모략)#!"
 hd_dc_sta_incite_independence_interaction_desc: "적국의 이 [vassal|E](을)를 은밀히 설득하여 군사를 일으켜 독립하고 그 주군과 등지게 만듭니다."
 hd_dc_sta_incite_defection_interaction: "투항 회유#weak (모략)#!"
 hd_dc_sta_incite_defection_interaction_desc: "적국의 이 [vassal|E](을)를 은밀히 설득하여 영지를 가지고 당신에게 귀순하게 만듭니다. 상대는 당신의 [realm|E](와)과 국경을 맞대고 있어야 하며, 그렇지 않으면 성공하기가 매우 어렵습니다."
 hd_dc_sta_incite_faction_interaction: "반역 선동#weak (모략)#!"
 hd_dc_sta_incite_faction_interaction_desc: "적국의 이 [vassal|E](을)를 은밀히 선동하여 주군에 맞서는 [faction|E]에 가입하거나 이를 세우게 하고, 파벌의 기세를 키웁니다."
 hd_dc_sta_subversion_started_toast: "회유 개시"

 # 策反：阴谋
 hd_dc_sta_incite_independence: "독립 선동"
 hd_dc_sta_incite_independence_action: "독립 선동:"
 hd_dc_sta_incite_independence_desc: "나는 [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip]에게 군사를 일으켜 독립하도록 설득할 것이다."
 hd_dc_sta_incite_independence_desc_general: "$hd_dc_sta_incite_independence$(은)는 은밀한 적대적 [scheme|E]입니다. 적국의 [vassal|E](을)를 설득하여 그 주군에 맞서 독립 전쟁을 일으키게 합니다.\n이 모략은 주로 당신의 [diplomacy|E]에 의존합니다.\n\n[success_chance|E](은)는 주로 당신의 [diplomacy|E](와)과 상대가 그 주군에게 가진 [opinion|E]에 따라 결정됩니다. 상대의 [spymaster|E]에게 발각되면 그 주군과 사이가 틀어지고, 맹약을 저버렸다는 오명을 쓰게 됩니다."
 HD_DC_STA_INCITE_INDEPENDENCE_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U](이)가 그 주군에 맞서 독립 전쟁을 일으킴"
 hd_dc_sta_incite_defection: "투항 회유"
 hd_dc_sta_incite_defection_action: "투항 회유:"
 hd_dc_sta_incite_defection_desc: "나는 [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip]에게 영지를 가지고 귀순하도록 설득할 것이다."
 hd_dc_sta_incite_defection_desc_general: "$hd_dc_sta_incite_defection$(은)는 은밀한 적대적 [scheme|E]입니다. 적국의 [vassal|E](을)를 설득하여 영지를 가지고 섬기는 이를 바꾸어 당신에게 귀순하게 합니다.\n이 모략은 주로 당신의 [diplomacy|E]에 의존합니다.\n\n[success_chance|E](은)는 주로 당신의 [diplomacy|E], 상대가 그 주군에게 가진 [opinion|E], 그리고 당신과 그 주군의 국력 차이에 따라 결정됩니다. 상대의 [spymaster|E]에게 발각되면 그 주군과 사이가 틀어지고, 맹약을 저버렸다는 오명을 쓰게 됩니다."
 HD_DC_STA_INCITE_DEFECTION_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U](이)가 영지를 가지고 당신의 [vassal|E](이)가 됨"
 hd_dc_sta_incite_faction: "반역 선동"
 hd_dc_sta_incite_faction_action: "반역 선동:"
 hd_dc_sta_incite_faction_desc: "나는 [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip](을)를 부추겨 그 주군과 적이 되게 할 것이다."
 hd_dc_sta_incite_faction_desc_general: "$hd_dc_sta_incite_faction$(은)는 은밀한 적대적 [scheme|E]입니다. 적국의 [vassal|E](을)를 부추겨 주군에 맞서는 [faction|E]에 가입하거나 이를 세우게 하여, 그 파벌의 원한을 더 키우고 병력을 더 늘립니다.\n이 모략은 주로 당신의 [diplomacy|E]에 의존합니다.\n\n상대의 [spymaster|E]에게 발각되면 그 주군과 사이가 틀어지고, 맹약을 저버렸다는 오명을 쓰게 됩니다."
 HD_DC_STA_INCITE_FACTION_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U](이)가 주군에 맞서는 [faction|E]에 가입하거나 이를 세움"
 HD_DC_STA_SUBVERSION_DISCOVERY_DESC: "당신은 적국의 군주와 사이가 틀어지고, 맹약을 저버렸다는 오명을 씀"
 hd_dc_sta_scheme_target_liege_opinion: "주군에 대한 [opinion|E]"
 hd_dc_sta_scheme_target_owner_opinion: "당신에 대한 [opinion|E]"
