 hd_dc_sta_scheme_target_rival_of_liege: "상대가 그 주군과 [rival|E] 관계임"
 hd_dc_sta_scheme_target_liege_family: "상대가 그 주군의 가까운 혈족임"
 hd_dc_sta_scheme_target_liege_friend: "상대가 그 주군과 사이가 좋음"
 hd_dc_sta_scheme_target_hooked: "그 주군이 상대의 [hook|E](을)를 쥐고 있음"
