l_korean:
 # ==========================================================================
 # 隐士故事循环（养望重制，2026-10-09）
 # ==========================================================================
 story_WJ_yinshi:0 "은거"
 WJ_YINSHI_STORY_INFORMATION_STRING:0 "당신은 산림에 은거하여 책을 읽고 벗과 사귀며 징벽에 응하지 않습니다. 산속의 나날은 평범해 보이지만, 경전 속의 난제, 고을의 분쟁, 옛 벗의 편지가 늘 문을 두드려 옵니다. 이따금 수레와 말이 사립문 밖에 멈추기도 합니다."

 WJ_yinshi_enter_decision:0 "은거하여 명망을 기름"
 WJ_yinshi_enter_decision_desc:0 "벼슬길의 풍파는 결국 오래 갈 계책이 아닙니다. 차라리 관직을 사양하고 문을 닫고 책을 읽으며, 고향의 옛 벗들과 왕래하고 학문과 지조로 맑은 명망을 기르는 것이 낫습니다. 훗날 천하에 도가 서면 그때 나서도 늦지 않습니다."
 WJ_yinshi_enter_decision_tooltip:0 "관직을 사양하고 산림에 은거하여 문을 닫고 명망을 기름"
 WJ_yinshi_enter_decision_confirm:0 "돌아가리라!"
 WJ_yinshi_enter_decision_effect_tt:0 "당신은 스스로 아호를 짓고, 이로부터 문을 닫고 책을 읽으며 모든 징벽과 임명을 사절하고, 더 이상 병마도 맡지 않을 것입니다."
 WJ_yinshi_enter_decision_resign_tt:0 "당신이 맡은 관직과 봉토는 그 휘하와 함께 모두 주군에게 반환됩니다."
 WJ_yinshi_cooldown_tt:0 "당신은 산을 나온 지 15년이 되지 않았으므로 [GetPlayer.MakeScope.Var('wj_yinshi_cooldown_end').GetValue|0]년이 되어야 다시 은거할 수 있음"
 WJ_yinshi_blocked_tt:0 "이 인물은 은거 중이므로 임명을 받지 않음"

 WJ_yinshi_exit_decision:0 "출산"
 WJ_yinshi_exit_decision_desc:0 "산중의 세월은 이미 오래되었으나, 천하의 일은 잠시도 쉰 적이 없습니다. 이제 옷매무새를 가다듬고 산을 나서, 다시 조정과 주군의 징소에 응할 때입니다."
 WJ_yinshi_exit_decision_tooltip:0 "은거를 끝내고 다시 징벽에 응함"
 WJ_yinshi_exit_decision_confirm:0 "옷매무새를 가다듬고 산을 나선다"
 WJ_yinshi_exit_decision_effect_tt:0 "당신은 산중 거처를 떠나 다시 속세로 돌아갑니다. 이번에 산을 나서면 여러 해 동안은 다시 은거를 말하기 어렵습니다."

 WJ_yinshi_risk_success:0 "하는 일이 이루어짐"
 WJ_yinshi_risk_fail:0 "일이 바람과 어긋남"
 WJ_yinshi_friend_reason:0 "은거할 때 서로 알게 됨"

 # ---------------------------------------------------------------- 学习
 WJ_yinshi.1001.t:0 "등불 아래 옛 주석을 교감하다"
 WJ_yinshi.1001.desc:0 "빌려 온 필사본이 마침내 도착했지만, 몇 군데 글자가 집안의 옛 판본과 다릅니다. 같은 장구를 두고 한쪽은 예제를 중시하고 다른 쪽은 명실을 가리니, 문하의 후학들은 저마다 한 설을 붙들고 점심 때까지도 논쟁을 그치지 않습니다.\n\n밤이 깊었는데도 당신은 여전히 두 필사본을 마주하고 있습니다. 섣불리 새 견해를 세우면 한때의 명성을 얻기 쉽지만, 옛 해석이 온당치 않음을 알면서도 한마디 하지 않는다면 학문에 성실하다 할 수 없습니다. 등잔 심지가 한 마디 타 들어갔고, 책상 위에는 새 해석을 적기에 충분한 빈 종이가 남아 있습니다."
 WJ_yinshi.1001.a:0 "먼저 글자를 교감하고 의심스러운 곳은 의심으로 남겨 둔다."
 WJ_yinshi.1001.b:0 "조목조목 분석하여 오늘 밤 논을 완성한다."
 WJ_yinshi.1001.c:0 "새벽까지 대조하며 한 글자도 소홀히 하지 않는다."

 WJ_yinshi.1002.t:0 "옛 주석을 다시 펼치다"
 WJ_yinshi.1002.desc:0 "옛 상자를 뒤지다가 집안에 전해 내려온 경전 주석 한 권을 찾아냅니다. 종이 가장자리는 이미 좀이 슬었지만 몇 군데 비평은 아직 알아볼 수 있습니다. 어떤 것은 선인이 정중히 붓을 댄 것이고, 어떤 것은 흥이 나서 읽다가 적은 의문일 뿐입니다. 지금 다시 읽어 보니, 한때 정론으로 받들어졌던 해석들이 근래 당신이 보고 들은 것과 자못 어긋납니다. 집 밖에서 바람이 대나무 잎을 스치는데, 책상 위의 옛 글자는 좀처럼 다음 장으로 넘어가지 못하게 합니다.\n\n새 설을 따로 쓰면 뒤에 책을 읽는 이들이 헛걸음을 덜 할 수 있겠지만, 당신의 반박만 기억하고 옛 학문이 본래 지닌 장점은 잊을지도 모릅니다. 빠진 곳만 기워 넣으면 가학은 온전히 전해지겠지만, 마음속의 의문은 끝내 둘 곳이 없습니다. 등불 아래 흰 종이 두 장, 한 장에는 변의를 쓰고 한 장에는 옛 주석을 옮길 수 있습니다. 오늘 밤 어느 쪽이든 먼저 붓을 대야 합니다."
 WJ_yinshi.1002.a:0 "옛 주석을 보완하여 가학의 본래 모습을 보존한다."
 WJ_yinshi.1002.b:0 "따로 변의를 지어 옛 설과 함께 전한다."

 WJ_yinshi.1003.t:0 "두 판본의 이문"
 WJ_yinshi.1003.desc:0 "빌려 온 필사본 한 권이 당신 손에 있는 옛 판본과 서로 차이가 납니다. 같은 문장인데 글자 하나가 바뀌자, 사람에게 신중하라고 권하던 뜻이 나아가라고 재촉하는 뜻으로 바뀝니다. 곁의 작은 주석은 또 후인이 잘못 베껴 본문에 넣은 것 같습니다. 몇 번을 거듭 읽어 보니 두 설이 저마다 통하는 데가 있습니다. 종이의 닳음이나 먹빛의 짙고 옅음으로도 어느 것이 먼저인지 쉽게 가릴 수 없습니다.\n\n한 가지 독법을 골라 본문에 옮겨 적으면 독자가 일일이 신경 쓸 필요는 없겠지만, 당신의 취사를 옛 책의 본래 모습으로 여기게 될 것입니다. 이문을 나란히 적어 취사를 잠시 후인에게 맡기면 글이 번잡해 보이기는 해도 의심스러운 곳이 계속 드러나 보이게 됩니다. 책상 위에 두 권의 책이 펼쳐져 있는데, 당신은 문득 깔끔하게 글자 하나를 고치는 것으로 필사 전승의 곡절을 덮고 싶지 않아집니다."
 WJ_yinshi.1003.a:0 "두 설을 함께 남기고, 의문은 비워 두고 기다린다."
 WJ_yinshi.1003.b:0 "하나를 골라 본문에 넣고 따로 그 까닭을 주석한다."
 WJ_yinshi.1003.c:0 "잠시 단정하지 않고 여러 판본을 널리 빌려 온다."

 WJ_yinshi.1004.t:0 "밤의 낭송"
 WJ_yinshi.1004.desc:0 "밤이 되자 산중은 유난히 고요하여 처마 밑에 떨어지는 물소리만 들립니다. 낮에 읽은 경문 한 장은 구절마다 다 아는데, 책을 덮으면 앞뒤가 어떻게 이어지는지 말하지 못합니다. 소년 시절 스승께서 외우기를 요구하셨을 때는 미련한 방법이라 여겼는데, 이제야 많은 이치가 입으로 몇 번이고 되뇌어야 마음에 자리 잡는다는 것을 깨닫습니다.\n\n등잔 기름은 한밤중까지 탈 만큼 남았습니다. 이 장도 아직 익숙하지 않은데, 뒤에는 긴 한 편이 또 기다리고 있고, 졸음이 어느새 눈썹 위로 기어오르고 있습니다."
 WJ_yinshi.1004.a:0 "우선 이 장을 익히고 내일 다시 나아간다."
 WJ_yinshi.1004.b:0 "밤새 낭송하여 반드시 꿰뚫는다."

 WJ_yinshi.1005.t:0 "비문을 보고 글씨를 익히다"
 WJ_yinshi.1005.desc:0 "벗이 나무꾼 편에 옛 비석 탁본 한 부를 보내왔습니다. 먹빛의 짙고 옅음이 고르지 않고 몇 군데 글자는 이미 흐려졌지만, 획 사이의 기상은 무척 넓어 요즘 유행하는 서풍과는 자못 다릅니다. 종이를 펴고 몇 줄 써 보지만 손목이 도무지 말을 듣지 않아, 써낸 글자는 겉모양만 닮았을 뿐입니다.\n\n노인들은 글씨를 배우려면 먼저 몇 해 동안 우직하게 본떠 써야 한다고 하고, 어떤 이는 어느 경지에 이르면 법첩을 버리고 자기 면모를 써내야 한다고 합니다. 탁본은 책상 위에 펼쳐져 있고, 먹은 이미 갈아 두었습니다."
 WJ_yinshi.1005.a:0 "매일 한 장씩 본떠 먼저 형태를 닮게 한다."
 WJ_yinshi.1005.b:0 "법첩을 버리고 스스로 써서 자기 뜻을 드러내 본다."

 WJ_yinshi.1006.t:0 "율령을 읽다"
 WJ_yinshi.1006.desc:0 "고을에서 누군가 토지 소송 한 건 때문에 율문을 물으러 오자, 당신은 그제야 경서는 많이 읽었으면서도 현행 율령에는 오히려 서툴다는 것을 깨닫습니다. 빌려 온 율서는 조목이 번잡하여, 같은 일에 대해 앞뒤 여러 조의 규정이 경중이 서로 다릅니다. 글 읽는 이들은 흔히 율령을 도필리의 학문이라 하지만, 고을 사람들이 손해를 보는 것은 바로 율문을 모르는 데서 비롯되는 경우가 많습니다.\n\n율서는 두툼한 한 묶음이라 조목조목 베껴 읽는 것만도 많은 공이 듭니다. 각 조 사이의 이치를 꿰어 밝히고 고을 사람도 알아볼 수 있는 글로 쓰려면 또 며칠 밤을 새워야 할지 모릅니다."
 WJ_yinshi.1006.a:0 "먼저 한 번 베껴 읽어 조목을 익힌다."
 WJ_yinshi.1006.b:0 "율령의 뜻을 꿰어 밝혀 고을 사람들을 위해 풀이한다."
 WJ_yinshi.1006.c:0 "고을 사람들을 위해 조목조목 대조하여 공정을 기한다."

 WJ_yinshi.1007.t:0 "구장산술"
 WJ_yinshi.1007.desc:0 "책을 정리하다가 『구장산술』 한 부를 찾아냅니다. 젊은 시절 과업을 위해 사 두었던 것인데, 책장은 거의 넘긴 흔적이 없습니다. 아무렇게나 몇 문제를 보니 균수와 방전이 모두 고을의 실제 일과 관련됩니다. 요역을 분담하고 밭을 측량하는 데 이 산법들이 빠질 수 없습니다. 고을의 장부를 두고 다툼이 잦은 것도 대개는 셈을 제대로 할 줄 아는 사람이 없기 때문입니다.\n\n책 속의 산제는 하나하나 풀어 나가면 언젠가는 익숙해질 것입니다. 다만 당신은 이 법칙들을 눈앞의 실제 일에 적용하면 더 간편한 산술을 찾아낼 수 있으리라는 느낌을 어렴풋이 받습니다."
 WJ_yinshi.1007.a:0 "처음부터 풀어 보며 먼저 본래의 법을 익힌다."
 WJ_yinshi.1007.b:0 "실제 일에 적용하여 따로 새 산법을 구한다."

 WJ_yinshi.1008.t:0 "별을 보고 역법을 기록하다"
 WJ_yinshi.1008.desc:0 "여러 날 맑은 밤이 이어져 별자리가 유난히 또렷합니다. 손에 든 역서와 대조해 보니, 책에 실린 절기가 눈앞에 보이는 것과 하루이틀 어긋납니다. 역법은 농시와 제사에 관계되어 예로부터 태사가 맡아 왔으니, 산중의 은자가 본래 관여할 일은 아닙니다. 그러나 이 어긋남이 사실이라면 고을 사람들의 파종이 며칠 어긋날 수도 있습니다.\n\n밤바람이 벌써 조금 서늘합니다. 어긋난 곳을 밝혀내려면 며칠 밤을 연달아 별하늘 아래를 지키며 직접 추보해야 합니다."
 WJ_yinshi.1008.a:0 "먼저 역서를 기록해 두고 검증을 기다린다."
 WJ_yinshi.1008.b:0 "밤새 관측하며 추보하여 참을 구한다."

 # ---------------------------------------------------------------- 探究
 WJ_yinshi.2001.t:0 "밭두렁에서 묻고 배우다"
 WJ_yinshi.2001.desc:0 "이른 아침 밭가로 나가 보니, 같은 비탈의 벼 싹이 높은 것도 있고 낮은 것도 있습니다. 고을 사람들이 흙빛과 햇볕, 빗물이 흘러가는 곳을 이야기하는데, 쓰는 말은 당신이 숙독한 글에는 보이지 않지만 판별은 대개 눈앞의 정황에 꼭 들어맞습니다. 자세히 물어보고서야, 지난날 당신이 뭉뚱그려 말하던 '천시에 순응한다'는 한마디가 밭두렁 사이에서는 여러 가지 다른 공부로 나뉘어야 한다는 것을 알게 됩니다.\n\n오늘 들은 경험을 차례로 적어 두고 날씨가 다를 때 다시 와서 살피면, 믿을 만한 농사 찰기 한 편으로 남길 수 있을 것입니다. 직접 척박한 밭 한 뙈기를 빌려 시험 삼아 심어 보면 어떤 통설이 다른 곳에서만 들어맞는지 가려낼 수 있을지도 모르지만, 한 철의 수확을 거기에 걸어야 합니다. 신발 가장자리에 흙이 묻었는데, 당신은 방으로 돌아간 뒤 이 말들을 한담으로 여겨 잊고 싶지 않습니다."
 WJ_yinshi.2001.a:0 "밭에 남아 먼저 고을 사람들의 말을 기록한다."
 WJ_yinshi.2001.b:0 "밭을 빌려 시험 삼아 심으며 새 방법을 몸소 검증한다."

 WJ_yinshi.2002.t:0 "약초를 캐며 풀을 익히다"
 WJ_yinshi.2002.desc:0 "산 뒤쪽에 약초 캐는 노인이 하나 있어, 자주 대광주리를 메고 집 앞을 지나갑니다. 오늘 그가 멈춰 물을 청하는데, 광주리 속 풀잎은 태반이 당신이 이름을 모르는 것입니다. 노인은 어느 것이 열을 내리고, 어느 것은 볕에 말려야만 약으로 쓸 수 있으며, 어느 것은 비슷해 보여도 사람을 해친다고 조리 있게 말하지만, 그것이 어느 책에 있는지는 말하지 못합니다.\n\n노인은 물을 다 마시면 산에 오를 참입니다. 광주리 속 풀 몇 포기에는 아직 이슬이 맺혀 있습니다. 옛 책에 실린 약성과 노인의 말이 대체 맞는지 아닌지는 직접 맛보아야만 알 수 있습니다."
 WJ_yinshi.2002.a:0 "노인을 따라 산에 올라 보면서 기록한다."
 WJ_yinshi.2002.b:0 "풀을 가지고 돌아와 책에 따라 직접 맛본다."

 WJ_yinshi.2003.t:0 "종이 뒷면의 또 다른 춘추"
 WJ_yinshi.2003.desc:0 "오래된 종이를 재단하다가, 경문 한 장의 뒷면에서 일상을 적은 몇 줄을 발견합니다. 어느 날 곡식을 빌리고 어느 날 갚았다는 것, 또 오랜 비에 길을 다니기 어렵다는 불평 한 구절도 있습니다. 글씨는 흘려 쓴 것이라 이름을 남기려고 쓴 것이 아님이 분명합니다. 평소 버릇대로 해진 가장자리를 잘라 내면 가장 먼저 사라지는 것이 바로 이 흩어진 잔글씨들입니다. 그러나 이것들은 앞면의 단정한 장구 밖에 있던 한 시절의 나날을 당신에게 보여 줍니다.\n\n원래 장을 온전히 끼워 보관하고 목록에 잡기가 있다고만 적어 두면, 뒤의 독자가 스스로 필적과 선후를 가려볼 수 있습니다. 이 잡기가 언제 누구에게서 나왔는지 추적하려면 옛 상자를 모두 뒤지고 필적을 대조해야 하며, 몇 마디 말로 한 사람의 내력을 통째로 지어내지 않도록 조심해야 합니다. 당신은 종이를 자르던 손을 멈추고, 이름 없는 것을 쓸모없는 것으로 여기지 않기로 합니다."
 WJ_yinshi.2003.a:0 "원래 모습을 보존하여 앞뒷면을 함께 기록한다."
 WJ_yinshi.2003.b:0 "내력을 추적하여 그 연월을 고증한다."

 WJ_yinshi.2004.t:0 "산천 지지"
 WJ_yinshi.2004.desc:0 "지지를 읽다가, 책에 기록된 물길이 고을 사람들의 말과 일치하지 않음을 발견합니다. 책에는 어느 물이 동쪽으로 흘러 강에 들어간다고 되어 있는데, 고을 사람들은 그 물이 오래전에 물길을 바꾸어 지금은 남쪽으로 흘러 다른 시내에 합친다고 합니다. 지지는 대개 선인들이 여기저기서 베껴 온 것이라, 누군가 직접 걸어 보았다고 장담할 수 없습니다.\n\n여러 지지의 설을 한데 베껴 놓으면 같고 다름이 절로 드러나겠지만, 대체 어느 설이 옳은지는 결국 누군가 며칠 동안 물길을 따라 걸어 보아야 알 수 있습니다. 산길은 험하고 시냇가에는 위험한 곳이 많습니다."
 WJ_yinshi.2004.a:0 "여러 지지를 모아 기록하고 같고 다름을 주석한다."
 WJ_yinshi.2004.b:0 "물길을 따라 답사하여 그 길을 직접 확인한다."

 WJ_yinshi.2005.t:0 "병문안"
 WJ_yinshi.2005.desc:0 "이웃집 아이가 며칠째 열이 내리지 않는데, 식구들이 의원을 부를 형편이 못 되어 당신에게 책에 처방이 있느냐고 물으러 왔습니다. 당신은 의경을 몇 권 읽었지만 사람을 진찰해 본 적은 없습니다. 의서에서 말하는 음양과 표리가 몸이 펄펄 끓는 아이 앞에서는 어디서부터 손을 대야 할지 막막합니다.\n\n아이의 어머니가 문간에 서서 간절한 눈빛으로 바라봅니다. 책의 말을 다 믿을 수는 없다는 것을 알지만, 먼 곳의 의원은 당장 부를 수도 없습니다."
 WJ_yinshi.2005.a:0 "의경을 찾아 주고 의원을 부르라고 권한다."
 WJ_yinshi.2005.b:0 "직접 가서 진찰하고 처방대로 치료해 본다."

 WJ_yinshi.2006.t:0 "나뭇길이 바뀌다"
 WJ_yinshi.2006.desc:0 "늘 다니던 산길 한 구간이 빗물에 쓸려 무너져, 헐거워진 흙가장자리 아래로 나무뿌리가 드러났습니다. 길에 익숙한 사람은 그래도 돌아갈 수 있지만, 짐을 진 사람은 훨씬 더 애를 써야 합니다. 누구는 지름길을 새로 내자고 하고, 누구는 새 길이 물이 잘 고이는 낮은 곳을 지난다고 합니다. 당신이 비탈을 따라 한 바퀴 걸어 보니, 종이 위에서는 줄어든 듯한 거리가 발밑에서는 꼭 힘을 덜어 주지는 않는다는 것을 깨닫습니다.\n\n옛길을 따라 물 빠짐과 발 디딜 곳을 살피고 먼저 위험한 구간의 위치를 알려 두면 사람들이 익숙한 길을 지킬 수 있지만, 앞으로도 비가 올 때마다 살펴야 합니다. 새 길 두 갈래를 모두 걸어 보며 맑은 날과 비 오는 날의 차이를 기록하면 더 다니기 좋은 길을 찾아낼 수 있을지도 모르지만, 산속을 분주히 다니자면 고생을 피할 수 없습니다. 돌아오는 길에 신발이 흠뻑 젖었지만, 당신은 올 때보다 오히려 더 분명히 알게 되었습니다."
 WJ_yinshi.2006.a:0 "옛길을 자세히 살펴 위험한 곳을 표시한다."
 WJ_yinshi.2006.b:0 "새 길을 두루 밟아 보고 한 길을 정한다."

 WJ_yinshi.2007.t:0 "현담"
 WJ_yinshi.2007.desc:0 "떠돌아다니는 도인 하나가 하룻밤 묵어 가며 밤에 당신과 마주 앉습니다. 그는 부록이나 단약은 이야기하지 않고, 『노자』와 『장자』를 어디까지 읽었느냐고만 묻습니다. 당신이 평소의 깨달음을 몇 마디 말하자, 그는 웃으며 그것은 모두 책에 있는 말이라고 합니다.\n\n등잔불이 탁 하고 튑니다. 도인은 수염을 꼬며 말이 없고, 당신이 무언가를 더 말하기를 기다리는 듯합니다."
 WJ_yinshi.2007.a:0 "그냥 들어 두고 각자 자기 책을 읽는다."
 WJ_yinshi.2007.b:0 "선입견을 내려놓고 그와 밤새 도를 논한다."
 WJ_yinshi.2007.c:0 "득실은 그에게 맡기고 편안히 듣는다."

 WJ_yinshi.2008.t:0 "자성"
 WJ_yinshi.2008.desc:0 "비 오는 날이라 나가지 못하고, 당신은 지난해 쓴 일기 몇 장을 넘겨 봅니다. 어떤 말은 지금 읽으니 유치하고, 그때 깨달았다고 여긴 어떤 일은 지금도 여전히 되풀이되고 있습니다. 은거는 본래 책을 읽기 위한 것이었는데, 읽으면 읽을수록 자신의 성미가 책 속의 어떤 난제보다도 풀기 어렵다는 생각이 듭니다.\n\n빗소리가 그치지 않습니다. 책상 위의 책은 아직 펼쳐져 있는데, 벼루의 먹은 이미 말라 버렸습니다."
 WJ_yinshi.2008.a:0 "평소대로 책을 읽고 깊이 파고들지 않는다."
 WJ_yinshi.2008.b:0 "며칠 문을 닫고 마음속 생각을 모두 기록한다."
 WJ_yinshi.2008.c:0 "마음을 평온히 하니 본래 모습이 절로 보인다."

 # ---------------------------------------------------------------- 当地人
 WJ_yinshi.3001.t:0 "형문 앞의 고을 다툼"
 WJ_yinshi.3001.desc:0 "두 집 고을 사람이 각자 집안 어른을 데리고 문 앞에 와서, 함께 쓰는 물길의 차례를 두고 다툼을 그치지 않습니다. 한쪽은 옛 약정을 들고, 다른 쪽은 밭의 벼 싹이 더는 기다릴 수 없다고 합니다. 사람들은 먼저 관아에 호소하기를 원치 않아, 당신이 글을 읽었고 두 집 모두와 사사로운 원한이 없다며 공정하게 판단해 주기를 바랍니다.\n\n당신에게는 관인이 없으니 현을 대신해 판결할 수 없습니다. 그러나 『은자는 속세의 일을 묻지 않는다』는 한마디로 사람들을 밀어낸다면, 이른바 고을의 맑은 명망은 대체 어디에 있단 말입니까?"
 WJ_yinshi.3001.a:0 "고을 어른들을 청해 함께 의논하고 남의 일에 나서지 않는다."
 WJ_yinshi.3001.b:0 "옛 약정을 조사해 직접 시비를 가린다."
 WJ_yinshi.3001.c:0 "약정에 따라 공정하게 하여 어느 쪽에도 치우치지 않는다."

 WJ_yinshi.3002.t:0 "아이들이 문을 두드리다"
 WJ_yinshi.3002.desc:0 "고을의 소년 몇이 함께 문 앞에 왔는데, 가져온 것은 속수가 아니라 글씨 연습을 한 폐지 한 묶음입니다. 그들은 흔히 쓰는 글자는 좀 알지만 짧은 글을 읽을 때는 구두를 자주 잘못 끊습니다. 앞장선 소년이 묻기를, 낮에 집안일을 도와야 한다면 경서를 배울 수 없느냐고 합니다. 당신은 그들의 손가락 사이에 묻은 먹 자국을 바라보며, 자신도 처음 배울 때 긴 장구에 겁먹었던 일을 떠올립니다.\n\n옛 스승의 법대로 경서 한 부를 한 글자씩 강론하면 기초는 튼튼해지겠지만, 그 긴 과업을 끝까지 버텨낼 사람이 있을지는 알 수 없습니다. 먼저 편지나 계약서에 쓰일 만한 말을 가르치면 글공부가 곧 집안에 도움이 되겠지만, 눈앞의 일을 처리하는 데서 그치기도 쉽습니다. 문밖의 발소리는 아직 흩어지지 않았습니다. 그들에게 어떤 시작을 열어 주어야 하겠습니까?"
 WJ_yinshi.3002.a:0 "먼저 일상의 글자를 가르쳐 배워서 쓰게 한다."
 WJ_yinshi.3002.b:0 "경서를 가르치되 구두부터 가르친다."

 WJ_yinshi.3003.t:0 "나루터에서 길을 양보하다"
 WJ_yinshi.3003.desc:0 "나루터를 지나는데 행인 몇이 차례를 두고 다투고 있습니다. 짐이 많은 이는 오래 기다리기 어렵다 하고, 먼 길을 가는 이는 해가 저물면 가기 어렵다 하며, 일찍부터 물가에서 기다린 이는 끝내 말 한마디 끼어들지 못합니다. 아무도 자기가 이득을 본다고 먼저 인정하려 하지 않아, 따질수록 작은 일이 품행의 문제로 번집니다. 곁에 서 있던 당신은 문득 책 속의 '예양' 두 글자도 여기서 발 디딜 곳이 있어야 한다는 생각이 듭니다.\n\n물가에 도착한 순서대로 차례를 정하면 방법이 가장 분명하고, 말주변 없는 이도 기댈 데가 생깁니다. 눈앞에 정말 급한 사정이 있는 이를 먼저 돌보면 더 너그러움에 가깝겠지만, 그 까닭을 분명히 말해 두어야 저마다 급하다고 다투지 않을 것입니다. 수면 위로 벌써 둥지로 돌아가는 새들이 스쳐 지나가니, 더 미적거리면 누구도 가기 어렵습니다."
 WJ_yinshi.3003.a:0 "물가에 닿은 순서대로 각자 차례를 지킨다."
 WJ_yinshi.3003.b:0 "먼저 급한 사정을 묻고, 말하지 못하는 이를 대신해 사정을 아뢴다."

 WJ_yinshi.3004.t:0 "장례에 관한 논의"
 WJ_yinshi.3004.desc:0 "고을에서 장례를 두고 의논이 일고 있습니다. 요즘 몇몇 집이 다투어 관곽을 후하게 갖추니, 형편이 어려운 집까지 불효자로 지목될까 두려워한다는 것입니다. 다른 쪽에서는 옛사람의 박장에 관한 말을 끌어와 모두 간소하게 하자고 주장합니다. 당신 집에 상이 난 것도 아닌데, 여전히 누군가 참고할 말을 몇 마디 써 달라고 청합니다. 예서를 넘겨 보니, 책에는 의절이 자세히 나열되어 있지만 집집마다의 살림을 헤아려 준 것은 아닙니다.\n\n후장의 폐단을 곧바로 지적하면 어려운 집들의 무거운 짐을 하나 덜어 줄 수 있겠지만, 친정을 가벼이 여긴다는 말을 듣기 쉽습니다. 슬픔과 공경, 기물의 쓰임을 나누어 논하고 집집마다 능력에 따라 예를 행하게 하면 말은 더 두루 갖추어지겠지만, 사치를 좋아하는 이들이 이를 빌려 옛 풍습을 변명할 수도 있습니다. 당신은 남의 슬픔으로 자신의 논의를 이루고 싶지 않으니, 글자 하나하나를 더 신중하게 쓸 수밖에 없습니다."
 WJ_yinshi.3004.a:0 "예의 뜻과 기물의 쓰임을 나누어 말하고 집안 형편에 맞게 한다."
 WJ_yinshi.3004.b:0 "후장의 폐단을 곧바로 지적하여 고을에 간소함을 권한다."

 WJ_yinshi.3005.t:0 "급한 이를 돕는 데도 차례가 있다"
 WJ_yinshi.3005.desc:0 "여러 날 길이 질척여 몇몇 집의 땔감과 양식이 잠시 이어지지 못하고 있습니다. 고을에 도우려는 사람이 없는 것은 아니지만, 각자 들은 사정이 달라서 어떤 이는 거듭 보살핌을 받고, 어떤 이는 부끄러워 입을 열지 못하다가 이웃이 우연히 말을 꺼내서야 기억됩니다. 의견을 물으러 온 사람이 처마 밑에 앉아 있는데, 다 듣고 나서야 당신은 눈앞에 부족한 것이 꼭 너그러움만은 아님을 깨닫습니다.\n\n먼저 급히 돌봐야 할 사정을 집집마다 자세히 묻고 돌아가며 찾아가기로 정하면 빠뜨리는 일은 줄겠지만, 어려운 형편이 사람들의 이야깃거리가 되지 않도록 각별히 조심해야 합니다. 각 집을 잘 아는 가까운 이웃들에게만 몰래 서로 통하게 하면 체면은 지키기 쉽겠지만, 서로 아는 소식이 다 갖추어지지 않을 수도 있습니다. 종이 위에서는 선후를 정할 수 있어도, 사람의 마음은 숫자처럼 쉽게 모을 수 없습니다."
 WJ_yinshi.3005.a:0 "가까운 이웃에게 몰래 안부를 묻게 하여 여러 사람 앞에서 입을 열지 않게 한다."
 WJ_yinshi.3005.b:0 "고을 사람들을 불러 모아 급한 이를 돕는 차례를 함께 의논한다."
 WJ_yinshi.3005.c:0 "먼저 자기 집 곳간을 열어 그 급함을 구제한다."

 WJ_yinshi.3006.t:0 "울타리 가의 한 자"
 WJ_yinshi.3006.desc:0 "울타리 가의 잡초를 다듬다가, 옛 경계 표지 두 개 사이에 새 대나무 한 무더기가 돋아난 것을 발견합니다. 이웃들의 말은 엇갈립니다. 누구는 나무뿌리를 경계로 삼고, 누구는 여러 해 전 오솔길의 위치만 기억합니다. 죽순은 지금 당장은 값이 얼마 나가지 않지만, 다투는 것은 앞으로 무엇을 기준으로 삼느냐입니다. 문을 닫고 모른 척할 수도 있지만, 사람들에게 너그러우라고만 권한다면 오늘 흐릿하게 넘긴 곳이 내년에 다시 자라날 것입니다.\n\n옛 표지와 지세를 함께 보고 확인할 수 있는 경계부터 분명히 적어 두고, 정하기 어려운 곳은 함께 의논하도록 남겨 두면 훗날의 다툼은 줄겠지만, 당장은 빈 곳을 견뎌야 합니다. 울타리 가를 함께 다니고 쓰는 방법을 먼저 정하고 이 한 자가 누구 것인지는 잠시 다투지 않는다면, 이웃 간의 정은 더 쉽게 지킬 수 있겠지만, 편리한 약속도 사람들이 오래 기억해야 합니다."
 WJ_yinshi.3006.a:0 "먼저 울타리 가를 함께 쓰기로 약속하여 작은 다툼으로 이웃을 상하게 하지 않는다."
 WJ_yinshi.3006.b:0 "옛 표지와 지세를 함께 보고 경계를 분명히 가린다."

 WJ_yinshi.3007.t:0 "향숙에서 함께 읽다"
 WJ_yinshi.3007.desc:0 "고을에서 빈집 한 채를 빌려 소년들이 함께 공부하게 하자는 의논이 일었는데, 어려움은 책이 있느냐 없느냐에 있지 않습니다. 집집마다 가르치고 싶은 편목이 다르니, 누구는 글자를 익히고 편지를 쓰는 것을 중시하고, 누구는 먼저 경서를 읽어야 한다고 고집하며, 또 누구는 농번기에 과업이 끊겨 도리어 아이가 게으르다는 이름을 얻을까 걱정합니다. 사람들의 말을 다 듣고서야, 당신은 작은 서당 하나에도 저마다 다른 기대가 실려 있음을 깨닫습니다.\n\n누구에게나 쓸모 있는 짧은 글부터 고르고, 한가할 때는 모여 읽고 바쁠 때는 각자 복습하기로 정하면 이 일을 시작하기는 쉽겠지만, 여력이 있는 아이가 깊이 읽게 하기는 어려울 것입니다. 수준에 따라 몇 자리로 나누고 먼저 배운 아이가 처음 배우는 아이를 이끌어 되풀이하게 하면 나아가고 물러섬을 두루 살필 수 있겠지만, 자리의 높고 낮음이 아이들 사이의 업신여김으로 바뀌지 않도록 막아야 합니다. 책은 권으로 나눌 수 있어도, 사람은 시작이 이르고 늦음으로 귀천이 나뉘어서는 안 됩니다."
 WJ_yinshi.3007.a:0 "먼저 짧은 과업을 정해 집집마다 모두 따를 수 있게 한다."
 WJ_yinshi.3007.b:0 "직접 향숙을 맡아 자리를 나누어 가르친다."

 WJ_yinshi.3008.t:0 "사음의 자리에서"
 WJ_yinshi.3008.desc:0 "향사의 모임에서 누군가 옛 관례대로 술을 권하며, 잔을 비우지 않으면 고을의 정을 멀리하는 것이라고 합니다. 당신은 사람들과 함께 앉는 것이 싫은 것은 아니지만, 술을 잘 못하는 몇 사람이 억지로 응대하느라 웃음이 점점 굳어 가는 것이 보입니다. 지금 일어나 자리를 뜨면 사람들은 명망을 기르는 이를 고을과 가까이하지 않으려는 냉정한 손님으로 여길지도 모르고, 여전히 사람들을 따라 권한다면 마음속으로 본 바와 맞지 않습니다.\n\n자리에 남아 농시와 옛 소문을 이야기하며 말머리를 빌려 술 권하기를 늦추면, 사람들이 화목을 해치지 않고 다른 방식으로 어울리게 할 수 있을지도 모릅니다. 사람마다 주량이 다르니 잔 수로 친소를 따져서는 안 된다고 대놓고 말하면 이치는 더 분명하겠지만, 옛 관례를 지키는 이들을 잠시 난처하게 만들 수밖에 없습니다. 잔 속의 술은 아직 식지 않았습니다. 당신은 사람들과 가까워지고 싶지만, 억지를 예의라고 부르고 싶지는 않습니다."
 WJ_yinshi.3008.a:0 "자리에 남아 고을 일을 한담하며 천천히 술 권하기를 늦춘다."
 WJ_yinshi.3008.b:0 "친소는 잔 수에 있지 않다고 분명히 말하고 각자 주량대로 하게 한다."
 WJ_yinshi.3008.c:0 "잔을 들어 함께 즐기며 한자리에서 마음껏 즐거워한다."

 # ---------------------------------------------------------------- 朋友
 WJ_yinshi.4001.t:0 "저녁 비에 편지가 이르다"
 WJ_yinshi.4001.desc:0 "저녁 빗속에 행인이 [wj_yinshi_friend.GetName]의 편지 한 통을 가져왔습니다. 앞부분은 헤어진 뒤의 근황을 적었고, 뒷부분은 나아가고 물러남의 어려움을 이야기합니다. 여러 사람의 뜻을 따르자니 마음이 편치 않고, 홀로 자기 견해를 지키자니 서로 알아주던 이들을 잃을까 두렵다는 것입니다. 끝에 가서는 그저 요즘 산중에서 무엇을 읽느냐고만 묻습니다.\n\n당신은 편지를 두 번 읽습니다. 옛 벗에게 부족한 것은 거창한 도리가 아니라, 옛날 같은 자리에서 학문을 논하던 사람이 아직도 진지하게 들어 줄 것인지 알고 싶은 것뿐입니다. 답장에서는 세상일을 논해야 할까요, 아니면 먼저 몸을 보중하라고 권해야 할까요?"
 WJ_yinshi.4001.a:0 "먼저 옛정을 적고 스스로를 소중히 하라고 권한다."
 WJ_yinshi.4001.b:0 "물은 바를 자세히 논하며 지기에게 숨기지 않는다."

 WJ_yinshi.4002.t:0 "사립문에 남긴 편지"
 WJ_yinshi.4002.desc:0 "예전에 기억해 둔 오솔길을 따라 [wj_yinshi_friend.GetName](을)를 찾아갔지만, 도착해 보니 사립문은 반쯤 닫혀 있고 뜰에는 새로 빤 천이 널려 있으며 화로의 재는 이미 식어 있습니다. 울타리 너머로 물어보아도 외출하여 아직 돌아오지 않았다는 말만 들을 뿐입니다. 오기 전에 하고 싶은 말이 많이 쌓였는데, 경의 한 대목에서 길에서 본 것까지 지금은 모두 마음속에 매달려 있습니다. 산빛이 점점 어두워지니, 기다림도 이번 걸음의 일부가 된 듯합니다.\n\n문 옆에 짧은 편지를 남겨 가장 중요한 의문을 분명히 적고, 근처에 묵을 곳을 찾아 그가 돌아오기를 기다리면 하고 싶은 말을 다 할 수 있을지도 모릅니다. 안부 한마디만 남기고 떠나면 긴 이야기는 다음 만남으로 미루게 됩니다. 종이는 긴 도리를 담을 수 있지만, 대화 속의 머뭇거림과 멈춤, 마음이 통하는 웃음까지 담을 수 있는 것은 아닙니다."
 WJ_yinshi.4002.a:0 "안부 한마디만 남기고 긴 이야기는 훗날로 미룬다."
 WJ_yinshi.4002.b:0 "편지를 남겨 의문을 적고 [wj_yinshi_friend.GetFirstName]의 귀가를 기다린다."

 WJ_yinshi.4003.t:0 "옛 벗의 부탁"
 WJ_yinshi.4003.desc:0 "돌고 돌아 전해진 편지 한 통이 글 한 편에 서문을 써 달라고 청합니다. 편지를 쓴 [wj_yinshi_friend.GetName](은)는 당신과 옛 교분이 있고, 글에서도 당신의 맑은 명망을 많이 칭찬하니 읽으며 마음이 움직이지 않기 어렵습니다. 그러나 함께 보내온 글을 자세히 보니, 몇몇 단정은 한쪽으로 치우쳤고 소문을 지나치게 확실한 것처럼 썼습니다. 당신은 일단 책머리에 이름을 적으면, 사람들이 당신이 칭찬하는 것이 정인지 견해인지 가리지 못하리라는 것을 압니다.\n\n서문을 완곡히 사양하고 논의할 점을 자세히 적으면 자신의 판단은 지킬 수 있지만, 상대는 당신이 학문으로 스스로를 높인다고 느낄 수 있습니다. 그래도 서문을 써 주되 글의 취할 만한 점만 말하고 유보하는 견해를 분명히 밝혀 두면 옛정은 지킬 수 있겠지만, 독자들이 그 유보를 건너뛸 수도 있습니다. 산중에서 여유롭게 붓을 들 수 있다고 해서, 한 획 한 획이 모두 두 가지를 다 얻을 수 있는 것은 아닙니다."
 WJ_yinshi.4003.a:0 "서문을 써 주되 논의할 점을 분명히 밝힌다."
 WJ_yinshi.4003.b:0 "서문을 사양하고 답장에서 자세히 논의한다."
 WJ_yinshi.4003.c:0 "그 잘못을 곧이곧대로 말하고 마음에 없는 말은 하지 않는다."

 WJ_yinshi.4004.t:0 "책을 빌려준 기한"
 WJ_yinshi.4004.desc:0 "[wj_yinshi_friend.GetName]에게 빌려준 책이 약속한 기한이 지나도록 돌아오지 않아, 책상 위에서 쓰고 있던 찰기에 인용문 두 군데가 비었습니다. 상대가 빌리러 왔을 때의 정중함을 떠올리면 쉽게 의심하고 싶지 않습니다. 그러나 산길이 굽이굽이 멀어 전갈이 조금만 어긋나도 책이 다른 곳에 잊혀 있을 수 있습니다. 모두가 한때의 호의만으로 빌려 간다면, 장서가 아무리 많아도 오래도록 오가며 쓰기는 어렵습니다.\n\n편지를 써서 돌려 달라고 재촉하며 급히 써야 하는 사정을 밝히면 약속도 지키고 지연이 정말로 불편하다는 것도 알릴 수 있지만, 어조가 조금만 무거워도 빌려주고 빌리던 정이 상할까 두렵습니다. 다른 필사본을 잠시 빌려 교감을 이어 가고 상대와 따로 반환 기한을 정하면 당장은 여유롭겠지만, 기한이 이로써 빈말이 되게 해서도 안 됩니다. 당신은 옛 차용 문서를 꺼내, 꾸짖는 구절을 고치고 또 고칩니다."
 WJ_yinshi.4004.a:0 "다른 필사본을 빌려 이어 읽고 다시 반환 기한을 정한다."
 WJ_yinshi.4004.b:0 "급히 써야 함을 밝히고 [wj_yinshi_friend.GetFirstName]에게 약속대로 돌려 달라고 청한다."

 WJ_yinshi.4005.t:0 "맑은 이름과 옛 친분"
 WJ_yinshi.4005.desc:0 "누군가 [wj_yinshi_friend.GetName](와)과는 왕래를 줄이라고 권합니다. 그 사람이 근래 권문에 빌붙어 이름이 예전만 못하다는 것입니다. 그러나 당신이 아는 것은 젊은 시절 함께 지내며 겪은 작은 일 몇 가지뿐이라, 지금의 행실을 보증할 수도 없고, 고을의 이야기를 직접 본 것으로 여기고 싶지도 않습니다. 문을 닫은 뒤로 세상일은 늘 소문을 몇 겹 거쳐 이르는데, 하필이면 절의에 관한 평가가 가장 태도를 정하라고 재촉합니다.\n\n먼저 편지를 보내 들은 것과 의혹을 솔직히 말하면 적어도 옛 벗에게 스스로 해명할 기회는 줄 수 있지만, 바깥 사람들에게는 억지로 감싸 주는 것으로 보일 수 있습니다. 왕래를 잠시 늦추되 사람들을 따라 품평하지 않으면 자신의 분수는 지킬 수 있겠지만, 상대가 직언을 가장 필요로 할 때 벗의 책임을 다하지 못할 수도 있습니다. 당신은 다 쓰지 못한 호칭을 종이 머리에 멈춰 둔 채, 정말로 지키기 어려운 것은 경솔하지 않음이라고 느낍니다."
 WJ_yinshi.4005.a:0 "왕래를 잠시 늦추고 확실치 않은 말은 전하지 않는다."
 WJ_yinshi.4005.b:0 "편지를 보내 곧바로 물어 분명히 알고자 한다."

 WJ_yinshi.4006.t:0 "끊어진 줄로 벗을 만나다"
 WJ_yinshi.4006.desc:0 "[wj_yinshi_friend.GetName](이)가 찾아왔을 때, 당신은 마침 오래 두었던 거문고를 천 주머니에서 꺼내던 참이었는데, 몇 소리 시험해 보자마자 낡은 줄 하나가 풀려 끊어졌습니다. [wj_yinshi_friend.GetFirstName](은)는 공교롭게 왔다며 웃고, 자신도 오랫동안 거문고를 타지 않았다고 말합니다. 창밖에 바람이 불어 끊어진 소리는 금세 흩어지지만, 손끝에는 방금 다 이루지 못한 곡의 뜻이 아직 남아 있습니다.\n\n책상 위에는 예비 줄도 있고 옛 악보도 책 밑에 눌려 있습니다. 그러나 줄이 끊어진 뒤의 그 작은 여운이 두 사람의 마음에 맴돌며 좀처럼 흩어지지 않습니다."
 WJ_yinshi.4006.a:0 "함께 새 줄을 매고 옛 곡을 되찾는다."
 WJ_yinshi.4006.b:0 "이 여운을 살려 그 자리에서 새 곡을 합주한다."

 WJ_yinshi.4007.t:0 "죽림청담"
 WJ_yinshi.4007.desc:0 "벗 몇이 대숲 가에서 잠시 앉기로 약속했는데, [wj_yinshi_friend.GetName]도 그 가운데 있습니다. 이야기는 경의 한 구절에서 시국으로, 다시 시국에서 인성의 선악으로 돌아가며 점점 멀어집니다. 누구는 말이 날카롭고, 누구는 그저 웃음을 머금고 말이 없습니다. 당신의 차례가 되자 모두가 조용해집니다.\n\n근래 당신에게 깨달은 바가 있어 오랫동안 마음속에 눌러 두었습니다. 다만 일단 입을 열면, 이 자리의 흐름은 아마 다른 사람 뜻대로 되지 않을 것입니다."
 WJ_yinshi.4007.a:0 "조용히 여러 의견을 듣다가 이따금 한마디 거든다."
 WJ_yinshi.4007.b:0 "말머리를 받아 이 자리를 이끈다."

 WJ_yinshi.4008.t:0 "눈 오는 밤에 벗을 찾다"
 WJ_yinshi.4008.desc:0 "밤사이 큰 눈이 내려 창을 열자 사방 들판이 온통 하얗습니다. 당신은 문득 [wj_yinshi_friend.GetName](을)를 만나 화로를 둘러싸고 이야기하고 싶어집니다. 그러나 눈은 깊고 길은 멀어, 지금 길을 나서면 도착할 즈음에는 날이 밝을 것이고, 상대가 집에 있을지, 편할지도 알 수 없습니다.\n\n화롯불은 꺼져 가는데, 창밖의 눈빛은 잠들 수 없을 만큼 환합니다."
 WJ_yinshi.4008.a:0 "편지 한 통을 써서 눈이 갠 뒤로 약속한다."
 WJ_yinshi.4008.b:0 "흥에 겨워 가 보고, 문 앞에 이르러 다시 생각한다."

 # ---------------------------------------------------------------- 邀请
 WJ_yinshi.5001.t:0 "벽소장이 형문을 두드리다"
 WJ_yinshi.5001.desc:0 "뜰에는 아직 간밤의 비가 남아 있는데, 문밖에 갑자기 수레와 말이 멈춥니다. 사자가 옷의 먼지를 털고 [actor.GetName]의 벽소장을 올립니다. 부중에 자리를 비워 두고 기다리니, 산을 나와 함께 일을 의논해 달라는 것입니다. 글에는 관록을 늘어놓지 않고, 다만 천하가 아직 평안하지 않으니 글 읽는 사람도 마땅히 짊어질 바가 있다고만 했습니다.\n\n당신은 글을 책상 머리에 두고 오래도록 답하지 않습니다. 문을 닫으면 자신의 뜻과 취향은 지킬 수 있지만, 세상일까지 문밖에 멈춰 세울 수는 없습니다. 부름에 응하면 배운 바를 조금은 펼칠 수 있겠지만, 이제부터 부주의 알아줌과 부탁도 짊어져야 합니다. 사자는 여전히 섬돌 아래에서 당신이 답장을 쓰기를 기다리고 있습니다."
 WJ_yinshi.5001.a:0 "서책을 챙겨 사자를 따라 부로 간다."
 WJ_yinshi.5001.b:0 "알아주심에 삼가 감사하나 이 몸은 나설 수 없다."

 WJ_yinshi.5002.t:0 "고을의 공론이 군부에 이르다"
 WJ_yinshi.5002.desc:0 "찾아온 고을 어른이 말하기를, 당신이 연회에는 잘 나가지 않지만 이름은 이미 고을의 의논 속에 퍼졌다고 합니다. 누구는 지조를 칭찬하고, 누구는 세가의 자제가 향당의 도움을 받았으니 결국 향당을 위해 무언가를 해야 한다고 말합니다. 이제 [actor.GetName](이)가 이를 근거로 당신을 효렴으로 천거하여 [actor.GetTopLiege.GetPrimaryTitle.GetNameNoTier]에 추천하려 합니다.\n\n천거장이 당신 앞에 놓였고, 끝에는 당신의 답이 남아 있습니다. 천거를 받는다고 곧바로 띠를 매고 관직에 나가는 것은 아니지만, 이 고을의 평판이 일단 당신 이름에 돌아가면 앞으로의 언행은 더 이상 자기 집안만의 일이 아닙니다."
 WJ_yinshi.5002.a:0 "이 고을의 천거를 받아 이대로 산을 나선다."
 WJ_yinshi.5002.b:0 "덕행이 아직 부족하니 다른 현자를 천거해 달라고 청한다."

 WJ_yinshi.5003.t:0 "산중에도 경세의 학문이 있다"
 WJ_yinshi.5003.desc:0 "[actor.GetName]의 편지가 옛 주석 한 권 위에 눌려 있습니다. 편지에서는 근래 당신의 논의를 언급하며, 산림에도 시무를 아는 사람이 적지 않으니 당신을 무재로 천거하고 싶다고 합니다. 종이 위의 몇 마디 칭찬은 하필이면 모두 당신이 아무도 눈여겨보지 않으리라 여겼던 견해들입니다.\n\n당신은 본래 글로 벼슬을 구하고 싶지 않았지만, 배운 바가 서재에만 머물러야 한다고 단정한 적도 없습니다. 천거를 받는 것은 이 학문이 여전히 세상에 쓰일 수 있음을 인정하는 것이고, 언제 출사하고 누구를 위해 힘쓸지는 여전히 신중히 스스로 골라야 합니다."
 WJ_yinshi.5003.a:0 "이 천거를 받아 이대로 산을 나선다."
 WJ_yinshi.5003.b:0 "이름과 실상이 걸맞지 않으니 감히 앞자리에 설 수 없다."
 WJ_yinshi_invite_lapsed_tt:0 "보내온 글이 허락한 것은 이미 빈말이 되었으나, 당신은 그래도 이대로 산을 나섭니다."

 WJ_yinshi.5101.t:0 "관고가 문에 이르다"
 WJ_yinshi.5101.desc:0 "사자가 가져온 문서에는 분명히 적혀 있습니다. 당신 이름에 관직이 하나 더해졌으니 오늘로 부임하라는 것입니다. 고을 사람들이 소식을 듣고 모두 축하하러 와서, 은자도 결국 나와서 일을 하게 되는구나 합니다. 당신은 책상 위의 다 읽지 못한 책을 바라보며, 잠시 무엇을 먼저 내려놓아야 할지 모릅니다.\n\n이 관직을 받으면 곧 산을 나서는 것이니, 앞으로의 나날은 더 이상 자기 것만이 아닙니다. 사양하고 받지 않는다면 인수를 봉한 그대로 돌려보내고, 여전히 산속의 삶을 이어 가게 됩니다."
 WJ_yinshi.5101.a:0 "명을 받아 산을 나서며 맡겨진 일을 저버리지 않는다."
 WJ_yinshi.5101.b:0 "관직을 사양하고 받지 않으며 인수를 봉해 돌려보낸다."
