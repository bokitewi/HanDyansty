l_korean:
# 清议开场 / 会期 / 散席事件文本（2026-10-08 重写）。
# 月旦评专属事件（3xxx）与新增事件（1009–1012、2009–2012）在 mechanisms/WJ_qingyi_yuedan_l_simp_chinese.yml。

 # ---------------------------------------------------------------- 通用提示
 WJ_qingyi_yd_nudge_plus1_tt:0 "#P 자리에 있던 누군가가 이로 인해 [wj_qingyi_subject.Custom('WJ_GetUIName')](을)를 더 기꺼이 추천하려 함#!"
 WJ_qingyi_yd_nudge_plus2_tt:0 "#P 자리에 있던 적지 않은 이들이 이로 인해 [wj_qingyi_subject.Custom('WJ_GetUIName')](을)를 추천하는 쪽으로 돌아섬#!"
 WJ_qingyi_yd_nudge_minus1_tt:0 "#N 자리에 있던 누군가가 이로 인해 더 이상 이 사람을 좋게 보지 않음#!"

 # ---------------------------------------------------------------- 0001 候客
 WJ_qingyi.0001.t:0 "청의: 자리를 비워 두고 기다림"
 WJ_qingyi.0001.desc.host:0 "관사는 이미 깨끗이 쓸어 두었고, 좌석은 양쪽 회랑을 따라 펼쳐져 있으며, 책상에는 경서 몇 권이 놓이고 다구도 갖추어졌습니다. 당신은 문간에서 안채로, 다시 안채에서 문간으로 걸으며 어디 빠진 데가 없을까 마음을 졸입니다.\n\n먼저 온 손님 몇이 회랑 아래에서 옛정을 나누고 있습니다. 초대장을 보낼 때는 누구를 부를지만 생각했는데, 막상 사람들이 하나둘 도착하자 이들이 서로 다 잘 맞지는 않으리라는 생각이 듭니다.\n\n주인 노릇의 어려움은 지금부터 시작입니다."
 WJ_qingyi.0001.desc.host_yuedan:0 "관사는 이미 깨끗이 쓸어 두었고, 좌석은 양쪽 회랑을 따라 펼쳐져 있습니다. 이번 초대장에는 분명히 적혀 있었습니다. 청담 외에 당대 인물도 품평한다고.\n\n적지 않은 손님이 바로 그 때문에 왔습니다. 누구는 회랑 아래에서 당신이 누구의 이름을 거론할지 낮은 목소리로 수소문하고, 누구는 그저 공수하고 인사를 나누면서도 눈은 줄곧 문밖을 흘끔거리며 또 누가 올지 살핍니다.\n\n명단은 이미 마음속에 대강 있습니다. 사람들이 다 모이면 자리를 열 수 있습니다."
 WJ_qingyi.0001.desc.guest:0 "당신이 문간에서 이름을 밝히자 시종이 안으로 안내합니다. 회랑 아래에는 이미 손님 몇이 앉아 있는데, 아는 이도 있고 이름만 들어 본 이도 있습니다.\n\n주인 [host.Custom('WJ_GetLinkedUIName')](은)는 아직 안채에서 일을 돌보고 있고, 책상 위의 경권도 아직 펼쳐지지 않았습니다. 사람들은 대개 오는 길에 보고 들은 일과 각지의 근황을 이야기합니다.\n\n본격적인 의논은 아직 시작되지 않았습니다. 당신은 자리를 하나 찾아 앉아, 먼저 이곳 사람들이 무엇에 관심을 두는지 들어 봅니다."
 WJ_qingyi.0001.a:0 "여러 현자가 다 오기를 기다리자."

 # ---------------------------------------------------------------- 0002 主人开席
 WJ_qingyi.0002.t:0 "청의: 손님과 주인이 모두 모이다"
 WJ_qingyi.0002.desc:0 "손님들이 마침내 다 모였고, 문밖의 알림 소리도 그쳤습니다. 당신은 모두에게 자리를 권하고, 마지막 인사말 몇 마디가 끝나기를 기다렸다가 입을 엽니다.\n\n“오늘 이 자리의 여러분은 관작으로 높고 낮음을 따지지 않소. 의문이 있으면 묻고, 견해가 있으면 말씀하시오.”\n\n이 말은 청의 때마다 한 번씩 하지만, 정말로 그리 되는 경우는 많지 않습니다. 첫 논제를 누가 꺼내느냐가 흔히 이 며칠의 분위기를 정합니다."
 WJ_qingyi.0002.desc.yuedan:0 "손님들이 마침내 다 모였습니다. 당신은 모두에게 자리를 권하되 서둘러 논제를 내지 않고, 먼저 말을 꺼내 둡니다.\n\n“오늘은 먼저 시사를 논하고 그다음에 인물을 품평하겠소. 여러분이 이 며칠 동안 하신 말씀은 결국 몇몇 이름으로 귀결될 것이오. 월단평이 나오면 곧 공론이 되니, 여러분은 말을 삼가시되 또한 곧게 말씀해 주시오.”\n\n자리가 잠시 고요해지더니 이윽고 낮은 웅성거림이 일어납니다."
 WJ_qingyi.0002.desc.learning:0 "손님들이 마침내 다 모였습니다. 당신은 모두에게 자리를 권하고, 오늘 여러분을 모신 것은 여러분의 장점을 빌려 자신의 부족함을 메우려는 것이라고 단도직입적으로 말합니다.\n\n“경의에 밝지 못한 곳이 있고 시무에 통하지 못한 곳이 있으니, 여러분은 거리낌 없이 말씀하시오. 내 귀를 씻고 삼가 듣겠소.”\n\n주인인 당신이 스스로 후학을 자처하자 손님들은 오히려 잠시 어색해합니다. 다행히 머지않아 누군가 말을 이어받습니다."
 WJ_qingyi.0002.a:0 "내가 먼저 논제를 하나 내겠소."
 WJ_qingyi.0002.b:0 "[wj_qingyi_opening_guest.Custom('WJ_GetUIName')]께서 먼저 실마리를 열어 주시오."

 # ---------------------------------------------------------------- 0003 宾客入席
 WJ_qingyi.0003.t:0 "청의: 자리에 들어 도를 논하다"
 WJ_qingyi.0003.desc:0 "주인 [host.Custom('WJ_GetLinkedUIName')](이)가 모두에게 자리를 권하고 청의의 시작을 알립니다. 이 자리에서는 관작을 따지지 않으니, 의문이 있으면 묻고 견해가 있으면 펼치라는 것입니다.\n\n당신은 자기 자리에 앉습니다. 함께 앉은 이들 중에는 일찍이 이름을 들은 이도 있고, 오늘 처음 만나는 이도 있습니다. 이 며칠의 의논이 어떤 모습일지는 아직 알 수 없습니다.\n\n오기 전에 이번 걸음의 목적을 이미 정해 두었으니, 이제 손을 쓸 때입니다."
 WJ_qingyi.0003.a:0 "예법대로 자리에 앉아 조용히 논제를 듣는다."
 WJ_qingyi.0003.b:0 "먼저 예를 갖추어 주인에게 가르침을 청한다."
 WJ_qingyi.0003.c:0 "조용한 곳을 골라 앉는다."

 # ---------------------------------------------------------------- 1001 清虚发端
 WJ_qingyi.1001.t:0 "청허발단"
 WJ_qingyi.1001.desc:0 "당신이 오늘의 논제를 꺼내자마자 [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')](이)가 말을 받아 묻습니다. “만물은 있음으로 인해 그 쓰임이 드러나오. 그렇다면 그릇 속의 빈 곳은 쓰임이라 할 수 있겠소?”\n\n손님 몇이 약속이나 한 듯 책상 위의 빈 잔을 바라봅니다. 이 물음은 농담처럼 보이지만 실은 유무지변의 오래된 논제입니다. 잘 답하면 오늘의 의논에 기틀이 서고, 잘못 답하면 주인인 당신의 무게가 가벼워질 것입니다."
 WJ_qingyi.1001.a:0 "현리로 답한다. 있음은 이로움이 되고, 없음은 쓰임이 된다."
 WJ_qingyi.1001.a.success:0 "의리가 꿰뚫어져 온 좌중이 고개를 끄덕였다"
 WJ_qingyi.1001.a.failure:0 "말이 오락가락하여 도리어 추궁당했다"
 WJ_qingyi.1001.b:0 "실제의 일로 증명한다. 빈 잔은 물을 담고, 빈 창고는 곡식을 쌓는다."
 WJ_qingyi.1001.b.success:0 "작은 것으로 큰 것을 보여 모두가 묘하다고 칭찬했다"
 WJ_qingyi.1001.b.failure:0 "비유가 적절하지 못해 사람들을 설복하지 못했다"
 WJ_qingyi.1001.c:0 "이 자리의 여러분께 각자의 견해를 펼쳐 달라고 청한다."

 # ---------------------------------------------------------------- 1002 折角之问
 WJ_qingyi.1002.t:0 "절각지문"
 WJ_qingyi.1002.desc:0 "[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')](은)는 당신의 개제를 다 듣고도 이어받지 않고, 그중 한 구절을 골라 그 자리에서 되묻습니다. 주인의 말대로라면 스스로 모순되는 것이 아니냐고.\n\n이 물음은 빠르고도 정확하여, 좌중의 사람들이 모두 잔을 내려놓습니다. 상대는 분명 준비를 하고 왔으며, 일부러 당신을 곤란하게 하려는 것은 아닐지 모르지만, 어쨌든 이 물음에는 답하지 않을 수 없습니다."
 WJ_qingyi.1002.a:0 "정색하고 반박한다."
 WJ_qingyi.1002.a.success:0 "겹겹이 분석하니 상대가 승복했다"
 WJ_qingyi.1002.a.failure:0 "상대에게 허점을 잡혔다"
 WJ_qingyi.1002.b:0 "웃으며 그 칼끝을 돌린다."
 WJ_qingyi.1002.b.success:0 "무거운 것을 가볍게 들어 좌중이 한바탕 웃었다"
 WJ_qingyi.1002.b.failure:0 "다소 억지스러워 보였다"
 WJ_qingyi.1002.c:0 "“손님께서 예를 잃으신 것 같구려.”"

 # ---------------------------------------------------------------- 1003 经义与时务
 WJ_qingyi.1003.t:0 "경의와 시무"
 WJ_qingyi.1003.desc:0 "좌중에서 학문이 가장 깊은 [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')](이)가 『춘추』에서 근년 주군의 부역까지 이야기하며, 경의를 당세에 쓸 수 없다면 아무리 익숙하게 읽어도 빈 글일 뿐이라고 말합니다.\n\n이치에 맞는 말이지만, 그중 몇몇 인용은 당신이 보기에 그리 타당하지 않습니다. 그 자리에서 그와 따져 볼 것인가, 아니면 이 기회에 가르침을 청할 것인가?"
 WJ_qingyi.1003.a:0 "경전을 인용해 일을 판단하며 그와 따져 본다."
 WJ_qingyi.1003.a.success:0 "인용이 정확하여 상대가 감탄했다"
 WJ_qingyi.1003.a.failure:0 "도리어 상대에게 바로잡혔다"
 WJ_qingyi.1003.b:0 "겸허하게 가르침을 구한다."
 WJ_qingyi.1003.c:0 "경의와 시무는 저마다 장점이 있으니, 굳이 우열을 따질 필요가 있겠소."

 # ---------------------------------------------------------------- 1004 一言之鉴
 WJ_qingyi.1004.t:0 "일언지감"
 WJ_qingyi.1004.desc:0 "특별히 초대받은 명사 [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')](은)는 줄곧 말이 적었는데, 이때 찻잔을 내려놓고 당신에게 평어 한마디를 건넵니다. 말은 길지 않지만, 당신이 평소 인정하기 싫어하던 곳을 정확히 짚었습니다.\n\n온 좌중이 당신이 어떻게 응할지 지켜봅니다."
 WJ_qingyi.1004.desc.yuedan:0 "특별히 초대받은 명사 [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')](은)는 줄곧 말이 적었습니다. 의논이 명단의 [wj_qingyi_subject.Custom('WJ_GetLinkedUIName')]에 이르자, 명사는 찻잔을 내려놓고 칭찬하는 말 한마디만 하니, 온 좌중이 곧 조용해집니다.\n\n명사의 말은 무게가 대단합니다. 평주인 당신이 맞장구를 치든 반박하든, 모두 이 인물에 대한 사람들의 생각을 좌우할 것입니다."
 WJ_qingyi.1004.a:0 "절하며 그 말을 받아들인다."
 WJ_qingyi.1004.b:0 "그와 주고받으며 논변한다."
 WJ_qingyi.1004.b.success:0 "몇 차례 주고받으니 막상막하였다"
 WJ_qingyi.1004.b.failure:0 "논변에서 이기지 못하고 얕음만 드러냈다"
 WJ_qingyi.1004.c:0 "명사의 평에 동조한다."
 WJ_qingyi.1004.d:0 "그 자리에서 반박한다."
 WJ_qingyi.1004.d.success:0 "이치와 근거를 갖추어 반박했다"
 WJ_qingyi.1004.d.failure:0 "도리어 명사의 물음에 말문이 막혔다"
 WJ_qingyi.1004.e:0 "웃어넘긴다."

 # ---------------------------------------------------------------- 1005 席间月旦
 WJ_qingyi.1005.t:0 "석간월단"
 WJ_qingyi.1005.desc:0 "의논이 인물에게로 옮겨 갑니다. 누군가 [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]의 근래 행적을 꺼내자, 곧 맞장구치는 이도 있고 고개를 젓는 이도 있습니다.\n\n사람들이 점점 당신을 바라보며, 주인인 당신이 한마디 하기를 기다립니다. 본인을 앞에 두고 품평하자니, 칭찬이든 비판이든 분수를 잘 가늠해야 합니다."
 WJ_qingyi.1005.desc.yuedan:0 "의논이 명단의 [wj_qingyi_subject.Custom('WJ_GetLinkedUIName')]에게로 옮겨 갑니다. 누구는 그의 옛일을 들어 칭찬하고, 누구는 근래의 행적이 소문만큼 좋지는 않다고 말합니다.\n\n[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')](이)가 평주인 당신에게 먼저 단언 한마디를 청합니다. 당신의 말은 사람들이 투표할 때 얼마간 마음에 남을 것입니다."
 WJ_qingyi.1005.a:0 "그 장점을 칭찬한다."
 WJ_qingyi.1005.b:0 "그 단점을 곧바로 지적한다."
 WJ_qingyi.1005.b.success:0 "말이 정곡을 찔러 아무도 반박하지 못했다"
 WJ_qingyi.1005.b.failure:0 "말이 사람을 상하게 하여 틈이 생겼다"
 WJ_qingyi.1005.c:0 "그 사람을 칭찬한다."
 WJ_qingyi.1005.d:0 "그 사람을 깎아내린다."
 WJ_qingyi.1005.d.success:0 "논거가 충분하여 모두가 수긍했다"
 WJ_qingyi.1005.d.failure:0 "근거 없이 사람을 깎아내려 도리어 공정함을 잃었다"
 WJ_qingyi.1005.e:0 "논하지 않고 남겨 둔다."

 # ---------------------------------------------------------------- 1006 酒至微醺
 WJ_qingyi.1006.t:0 "흥이 무르익을 때"
 WJ_qingyi.1006.desc.wine:0 "술잔이 몇 순배 돌자 좌중의 말소리가 커집니다. [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')](이)가 잔을 들어 권하며, 청의가 여기까지 왔으니 이제 구속을 좀 내려놓아도 되지 않겠느냐고 합니다.\n\n술은 사람에게 참말을 하게도 하고, 실언을 하게도 합니다. 주인인 당신이 얼마나 마시는지 손님들은 모두 보고 있습니다."
 WJ_qingyi.1006.desc.tea:0 "차를 몇 번 바꾸자 의논도 느긋해졌습니다. [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')](이)가 찻잔을 들고 다가와, 며칠 동안 논쟁한 끝에 이런 한가로움은 얻기 어렵다고 말합니다.\n\n좌중의 분위기가 풀렸으니, 평소에 하기 어려운 말을 할 때입니다."
 WJ_qingyi.1006.a:0 "잔을 들어 함께 즐긴다."
 WJ_qingyi.1006.b:0 "예를 지키며 스스로 절제한다."
 WJ_qingyi.1006.c:0 "흥에 겨워 인물을 품평한다."
 WJ_qingyi.1006.c.success:0 "묘한 말이 꼬리를 물어 온 좌중이 통쾌해했다"
 WJ_qingyi.1006.c.failure:0 "여러 사람 앞에서 실언했다"

 # ---------------------------------------------------------------- 1007 竹下忘年
 WJ_qingyi.1007.t:0 "죽하망년"
 WJ_qingyi.1007.desc:0 "자리가 파한 뒤에도 [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')](은)는 떠나지 않고 당신과 함께 뜰의 대나무 아래 앉았습니다. 다른 사람이 없으니 말도 편해져, 젊은 시절 글 읽던 옛일에서 그간 각자 겪은 처지까지 이야기합니다.\n\n어느새 밤이 깊었습니다. 주인과 손님의 구분은 이제 아무래도 상관없는 듯합니다."
 WJ_qingyi.1007.a:0 "지기로 삼는다."
 WJ_qingyi.1007.b:0 "집안에 소장한 책을 선물한다."
 WJ_qingyi.1007.c:0 "하룻밤의 이야기로 족하다."

 # ---------------------------------------------------------------- 1008 清议之外
 WJ_qingyi.1008.t:0 "청의 밖에서"
 WJ_qingyi.1008.desc:0 "[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')](은)는 사람들이 다 흩어진 뒤에야 당신을 찾아와, 먼저 인사치레를 몇 마디 하더니 곧 말머리를 돌려 어떤 일에 편의를 봐 달라고 청하며, 작은 예물을 준비했다고 합니다.\n\n청의의 이름은 본래 청류가 중히 여기는 것이지만, 자리가 끝난 뒤의 청탁은 한 번도 줄어든 적이 없습니다."
 WJ_qingyi.1008.desc.yuedan:0 "[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')](은)는 사람들이 다 흩어진 뒤에야 당신을 찾아왔습니다. 몇 마디 인사를 나눈 뒤 상대는 목소리를 낮추어, 명단의 [wj_qingyi_subject.Custom('WJ_GetLinkedUIName')](은)는 얻기 어려운 인재이니 평주께서 사람들 앞에서 좋은 말을 몇 마디 더 해 주기를 바란다며, 작은 예물을 준비했다고 합니다.\n\n월단평에 사사로운 정이 섞이면 더 이상 공론이 아닙니다."
 WJ_qingyi.1008.a:0 "그 선물을 받는다."
 WJ_qingyi.1008.b:0 "여러 사람 앞에서 거절한다."
 WJ_qingyi.1008.c:0 "적당히 응대하여 이 인정을 남겨 둔다."

 # ---------------------------------------------------------------- 2001 名教与自然
 WJ_qingyi.2001.t:0 "명교와 자연"
 WJ_qingyi.2001.desc:0 "주인 [host.Custom('WJ_GetLinkedUIName')](이)가 갑자기 당신을 지목하여 묻습니다. 예법과 명교는 사람의 본성에서 나온 것이오, 아니면 성인이 세상을 다스리기 위해 정한 것이오?\n\n이는 근래 사림에서 가장 많이 논쟁하는 논제 중 하나로, 좌중의 적지 않은 이들이 이미 굳은 견해를 가지고 있습니다. 주인이 굳이 당신에게 묻는 것은 아마 다른 견해를 듣고 싶어서일 것입니다."
 WJ_qingyi.2001.a:0 "명교는 자연에서 나온다."
 WJ_qingyi.2001.a.success:0 "이치를 원만하게 풀어내니 주인이 고개를 끄덕였다"
 WJ_qingyi.2001.a.failure:0 "말이 요점에 미치지 못했다"
 WJ_qingyi.2001.b:0 "명교는 세상을 다스리기 위한 것이다."
 WJ_qingyi.2001.b.success:0 "시대의 폐단을 정확히 짚었다"
 WJ_qingyi.2001.b.failure:0 "예를 잘못 들었다"
 WJ_qingyi.2001.c:0 "주인께 먼저 말씀해 달라고 청한다."

 # ---------------------------------------------------------------- 2002 众目相逼
 WJ_qingyi.2002.t:0 "뭇 시선의 압박"
 WJ_qingyi.2002.desc:0 "당신이 견해를 다 말하자마자 [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')](이)가 일어나 하나하나 반박하는데, 어조가 갈수록 거세지더니 마침내 대놓고 원전을 읽기는 했느냐고 묻습니다.\n\n온 좌중의 시선이 당신에게 쏠립니다. 여기서 한발 물러서면 앞으로 이 사람들 앞에서 다시 입을 열기 어려울 것입니다."
 WJ_qingyi.2002.a:0 "학문으로 응수한다."
 WJ_qingyi.2002.a.success:0 "근거를 상세히 밝히니 상대가 말이 없었다"
 WJ_qingyi.2002.a.failure:0 "질문에 말문이 막혀 아무 말도 하지 못했다"
 WJ_qingyi.2002.b:0 "말솜씨로 누그러뜨린다."
 WJ_qingyi.2002.b.success:0 "농담 한마디로 경색된 분위기를 풀었다"
 WJ_qingyi.2002.b.failure:0 "가라앉히지 못했다"
 WJ_qingyi.2002.c:0 "그의 약점을 되묻는다."
 WJ_qingyi.2002.c.success:0 "도리어 한 방 먹였다"
 WJ_qingyi.2002.c.failure:0 "잔꾀를 부리다 일을 망쳤다"

 # ---------------------------------------------------------------- 2003 执经请益
 WJ_qingyi.2003.t:0 "집경청익"
 WJ_qingyi.2003.desc:0 "당신이 가져온 그 책에는 줄곧 이해하지 못한 곳이 몇 군데 있습니다. 오늘 [wj_qingyi_luminary.Custom('WJ_GetLinkedUIName')]도 자리에 있는데, 이 사람은 학문이 깊고 평소 만나기 어려우니 이 기회에 의문을 풀 수 있습니다.\n\n다만 여러 사람 앞에서 가르침을 청하면 자신의 부족함을 드러낼 수밖에 없습니다."
 WJ_qingyi.2003.a:0 "직접 가르침을 청한다."
 WJ_qingyi.2003.a.success:0 "의문이 단번에 풀렸다"
 WJ_qingyi.2003.a.failure:0 "요점을 짚지 못한 질문이었다"
 WJ_qingyi.2003.b:0 "그 설명을 받아 적고 돌아가서 자세히 읽는다."
 WJ_qingyi.2003.c:0 "다른 날로 미룬다."

 # ---------------------------------------------------------------- 2004 名士一顾
 WJ_qingyi.2004.t:0 "명사일고"
 WJ_qingyi.2004.desc:0 "특별히 초대받은 명사 [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')](은)는 당신의 말을 다 듣고 고개를 돌려 당신을 한 번 더 바라보더니 한마디 합니다. “이 사람과는 더불어 말할 만하오.”\n\n이 말은 길지 않지만 좌중의 모두가 들었습니다. 명사의 한 번 돌아봄은 흔히 열 편의 글보다 더 사람들에게 이름을 기억하게 합니다."
 WJ_qingyi.2004.a:0 "기쁘게 받아들인다."
 WJ_qingyi.2004.b:0 "겸손히 사양하며 감당할 수 없다고 한다."
 WJ_qingyi.2004.c:0 "이 기세를 타고 배운 바를 펼친다."
 WJ_qingyi.2004.c.success:0 "명사가 무릎을 치며 칭찬했다"
 WJ_qingyi.2004.c.failure:0 "사족을 달았다"

 # ---------------------------------------------------------------- 2005 谁为上品
 WJ_qingyi.2005.t:0 "누가 상품인가"
 WJ_qingyi.2005.desc:0 "누가 먼저 꺼냈는지 모르게, 좌중에서 이 자리 사람들의 우열을 논하기 시작합니다. [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')](이)가 반 농담으로, 오늘의 모습으로 보아 당신과 자신 중 누가 한 수 위인지 모두에게 평가해 달라고 하자고 말합니다.\n\n농담은 농담이지만, 사람들은 정말로 지켜보고 있습니다."
 WJ_qingyi.2005.desc.yuedan:0 "사람들이 명단의 [wj_qingyi_subject.Custom('WJ_GetLinkedUIName')]에 대해 한창 논쟁하고 있습니다. 가장 열을 올리던 [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')](이)가 고개를 돌려 당신의 생각을 묻습니다.\n\n당신 한 사람의 말로 결과가 정해지지는 않지만, 힘 있게 말한다면 몇 사람의 마음은 바꿀 수 있습니다."
 WJ_qingyi.2005.a:0 "그대를 윗자리로 추대하겠소."
 WJ_qingyi.2005.b:0 "자신의 장점을 스스로 밝힌다."
 WJ_qingyi.2005.b.success:0 "말에 조리가 있었다"
 WJ_qingyi.2005.b.failure:0 "자화자찬이 지나쳤다"
 WJ_qingyi.2005.c:0 "그 사람을 힘껏 두둔한다."
 WJ_qingyi.2005.c.success:0 "손님 몇 사람의 마음을 움직였다"
 WJ_qingyi.2005.c.failure:0 "아무도 맞장구치지 않았다"
 WJ_qingyi.2005.d:0 "그 사람의 단점을 힘껏 늘어놓는다."
 WJ_qingyi.2005.d.success:0 "말이 급소를 정확히 찔렀다"
 WJ_qingyi.2005.d.failure:0 "사사로운 감정을 품었다고 비난받았다"
 WJ_qingyi.2005.e:0 "남과 다투지 않는다."

 # ---------------------------------------------------------------- 2006 杯中任达
 WJ_qingyi.2006.t:0 "배중임달"
 WJ_qingyi.2006.desc.wine:0 "술을 마실수록 더 마시게 되어, 누구는 옷끈을 풀고 누구는 책상을 두드리며 노래합니다. [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')](이)가 큰 잔 하나를 당신 앞으로 밀며, 청담하는 선비가 어찌 속된 예법에 얽매이겠느냐고 합니다.\n\n거리낌 없는 것도 명사의 풍도이고, 추태도 그러합니다. 분수는 오로지 당신에게 달렸습니다."
 WJ_qingyi.2006.desc.tea:0 "자리에는 차뿐이지만 사람들의 이야기는 무르익었습니다. [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')](이)가 자리를 가까이 옮기며, 말이 통하는 사람을 만나기 어려우니 오늘 밤은 일찍 파할 것 없다고 말합니다.\n\n이런 때에 가슴을 활짝 열 것인지 법도를 지킬 것인지는 모두 당신에게 달렸습니다."
 WJ_qingyi.2006.a:0 "마음을 풀어 거리낌 없이 즐긴다."
 WJ_qingyi.2006.b:0 "잔을 들되 스스로를 지킨다."
 WJ_qingyi.2006.c:0 "옆자리 사람과 대작한다."

 # ---------------------------------------------------------------- 2007 抵掌而谈
 WJ_qingyi.2007.t:0 "저장이담"
 WJ_qingyi.2007.desc:0 "자리가 파한 뒤, [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')](이)가 당신을 붙잡고 이야기를 이어 갑니다. 말이 통하는 대목에 이르자 상대는 손뼉을 치며 크게 웃고, 요 며칠 그토록 많은 사람을 만났지만 생각이 자기와 이렇게 가까운 사람은 처음이라고 말합니다.\n\n우연히 만난 사이가 오랜 교분으로 이어질 수 있을지는 오늘 밤에 달렸습니다."
 WJ_qingyi.2007.a:0 "동도로 삼는다."
 WJ_qingyi.2007.b:0 "재물과 비단을 선물한다."
 WJ_qingyi.2007.c:0 "적당한 선에서 그친다."

 # ---------------------------------------------------------------- 2008 帷幕后语
 WJ_qingyi.2008.t:0 "장막 뒤의 말"
 WJ_qingyi.2008.desc:0 "따로 앉아 이야기를 나누던 중, [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]의 무심한 한마디에서 어떤 옛일의 실마리가 드러났습니다. 상대는 당신이 알아챘다는 것을 눈치채고 곧바로 목소리를 낮추었고, 안색도 변했습니다.\n\n이 일은 주인이 아직 모르고 있을 것입니다. 못 들은 척할 것인가, 아니면 달리 꾀할 것인가?"
 WJ_qingyi.2008.a:0 "이 일을 주인에게 알려야 한다."
 WJ_qingyi.2008.b:0 "마음속에 새겨 두고 다른 이를 놀라게 하지 않는다."
 WJ_qingyi.2008.c:0 "입을 다물어 주되 대가가 있어야 한다."

 # ---------------------------------------------------------------- 2011 补：月旦评版本
 WJ_qingyi.2011.desc.yuedan:0 "주인 [host.Custom('WJ_GetLinkedUIName')](이)가 갑자기 당신에게 몸을 돌려, 명단의 [wj_qingyi_subject.Custom('WJ_GetLinkedUIName')]에 대해 어떻게 보느냐고 묻습니다.\n\n좌중이 조용해집니다. 월단평이 진행 중이니, 당신의 이 한마디가 몇 사람 손의 표를 바꿀지도 모릅니다."

 # ---------------------------------------------------------------- 9001 / 9002 散席
 WJ_qingyi.9001.t:0 "품제산석"
 WJ_qingyi.9001.desc:0 "손님들이 하나둘 옷매무새를 고치고 일어서니, 며칠간의 의논이 마침내 일단락됩니다. 시종들이 자리를 치우기 시작하고, 당신은 주인으로서 마지막 몇 마디를 해야 합니다.\n\n이번 청의가 무엇을 남길지, 밖으로 전해질 말이 어느 구절일지는 지금 당신이 어떻게 마무리하느냐에 얼마간 달려 있습니다."
 WJ_qingyi.9001.desc.yuedan:0 "손님들이 하나둘 옷매무새를 고치고 일어섭니다. 이번 청의에서 사람들이 가장 똑똑히 기억할 것은 아마 [wj_qingyi_yd_winner.Custom('WJ_GetLinkedUIName')](이)가 첫째로 추대될 때 좌중이 보인 반응일 것입니다.\n\n월단평의 결과는 머지않아 각지에 퍼질 것이고, 평주인 당신의 이름도 그와 함께 회자될 것입니다. 마지막 몇 마디를 어떻게 할지 좀 더 생각해야 합니다."
 WJ_qingyi.9001.a:0 "여러 현자의 말을 기록하여 사림에 전한다"
 WJ_qingyi.9001.b:0 "직접 손님들을 문밖까지 배웅한다."
 WJ_qingyi.9001.c:0 "쓸 만한 인재를 골라 조정에 천거한다"
 WJ_qingyi.9002.t:0 "귓가의 여운"
 WJ_qingyi.9002.desc:0 "청의가 파하려 하자 당신도 사람들을 따라 일어서고서야 너무 오래 앉아 있어 다리가 좀 뻣뻣해졌음을 느낍니다. 회랑 밖의 바람이 얼굴로 불어오고, 요 며칠 가장 뜨겁게 다투던 몇 마디가 아직 귓가에 맴돕니다.\n\n이번 걸음에서 무엇을 얻었는지는 돌아간 뒤에야 천천히 깨닫게 될 것입니다."
 WJ_qingyi.9002.desc.yuedan:0 "청의가 파하려 하는데도 사람들은 여전히 [wj_qingyi_yd_winner.Custom('WJ_GetLinkedUIName')]의 당선을 이야기하고 있습니다. 진심으로 수긍하는 이도 있고, 그렇지 않다고 여기는 이도 있습니다.\n\n이번 월단평에 당신도 표를 던졌습니다. 결과가 어떻든, 훗날 누군가 이 품평을 이야기할 때 당신도 그 자리에 있었던 사람인 셈입니다."
 WJ_qingyi.9002.a:0 "배운 바를 기록하여 돌아간다."
 WJ_qingyi.9002.b:0 "주인에게 절하여 감사한다."
 WJ_qingyi.9002.c:0 "훌훌 떠나간다."

 # ================================================================ 活动记录
 WJ_qingyi_log_0001_host:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 관사를 정돈하고 자리를 비워 손님을 기다림"
 WJ_qingyi_log_0001_host_title:0 "허석후현"
 WJ_qingyi_log_0001_arrival:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 [TARGET_CHARACTER.Custom('WJ_GetUIName')]의 초대에 응해 관사에 도착함"
 WJ_qingyi_log_0001_arrival_title:0 "손님 도착"
 WJ_qingyi_log_0002:0 "손님과 주인이 모두 모이자 [CHARACTER.Custom('WJ_GetUIName')](이)가 직접 논제를 내어 청의가 시작됨"
 WJ_qingyi_log_0002_title:0 "거주개석"
 WJ_qingyi_log_0002_b:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 [TARGET_CHARACTER.Custom('WJ_GetUIName')]에게 먼저 논제를 내 달라고 청함"
 WJ_qingyi_log_0002_b_title:0 "양석개제"
 WJ_qingyi_log_0003:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 [TARGET_CHARACTER.Custom('WJ_GetUIName')](이)가 주관하는 청의에 자리함"
 WJ_qingyi_log_0003_title:0 "손님 착석"
 WJ_qingyi_log_0003_b:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 자리에 앉기 전 [TARGET_CHARACTER.Custom('WJ_GetUIName')]에게 예를 갖추어 가르침을 청함"
 WJ_qingyi_log_0003_b_title:0 "집례청교"
