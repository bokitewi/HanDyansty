 SG_Nianhao_event.004_d:0 "해와 달, 역법의 차례와 천시가 유사의 손에서 몇 개의 짧은 이름으로 담겼습니다. 태사령이 곁에서 역원과 정삭을 이야기하니, 읽어 보면 저마다 기상이 있습니다.\n\n앞으로의 조서가 대체 어느 것으로 시작될지는 여전히 당신이 고개를 끄덕이기를 기다립니다."
