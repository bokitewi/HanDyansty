 SG_Nianhao_event.002.i:0 "네 글자 연호"
 SG_Nianhao_event.002.j:0 "긴 연호"
 SG_Nianhao_event.002.k:0 "점복에 맡김"
 SG_Nianhao_event.002.l:0 "직접 연호를 지음"
 SG_Nianhao_event.002.m:0 "이전 쪽으로"
 SG_Nianhao_event.003_t:0 "연호 선정 — 상서부응"
 SG_Nianhao_event.003_d:0 "상서에서 취한 연호들이 당신 앞에 늘어서 있고, 예관은 하나를 읽을 때마다 그 담긴 뜻을 한마디씩 풀이합니다. 감로가 내리고, 황룡이 나타나고, 봉황이 모였다는, 전대 사관이 정중히 기록한 부응들이 이제 다시 하나하나 책상 위에 놓였습니다.\n\n당신은 다 듣고 나서, 문서를 가까이 두게 하고 처음부터 다시 읽을 필요는 없다고 이릅니다."
