l_korean:
 SG_Nianhao_event.001_t:0 "개원 $Color_ZanBai$「[SCOPE.sC('wj_era_author').Custom('SanGong_NianHao')]」 조서"
 SG_Nianhao_event.001_d:0 "개원의 조서가 이미 반포되어, 이제부터 #high [SCOPE.sC('wj_era_author').Custom('SanGong_NianHao')]#!(으)로 해를 헤아립니다.\n\n당신은 앞으로 조령과 장부에 적힐 이 이름을 읽어 봅니다. 지난해의 많은 일들은 연호를 바꾸었다고 저절로 사라지지 않습니다. 새 연호에 담긴 바람은 결국 앞으로의 정사로 하나하나 증명해 나가야 합니다.\n\n[SCOPE.sC('wj_era_author').Custom('SanGong_NianHao_tt')]"
 SG_Nianhao_event.001.a:0 "새 연호가 섰으니 세월의 차례가 새로 시작되는구나."
 SG_Nianhao_event.002_t:0 "연호 선정"
 SG_Nianhao_event.002_d:0 "유사가 의논한 연호를 올리며, 먼저 이번 개원에 어떤 뜻을 담을지 묻습니다. 상서, 수덕, 경시, 무공을 두고 여러 유자가 저마다 주장을 펴니, 전각 안은 곧 다시 논쟁으로 시끄러워집니다.\n\n당신은 손을 들어 모두를 멈추게 합니다. 글자도 아직 정하지 않았는데, 앞으로의 조서를 대신해 벌써 이토록 많은 말을 하고 있습니다. 뜻을 정하면 이름은 자연히 따라올 것이고, 여러 논의가 모두 마음에 들지 않는다면 당신이 직접 붓을 들 수밖에 없습니다."
 SG_Nianhao_event.002.a:0 "상서부응"
 SG_Nianhao_event.002.b:0 "천상역법"
