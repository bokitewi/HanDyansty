 # 来源：localization/simp_chinese/WJ_office_roads_loc_l_simp_chinese.yml
 WJ_langguan_xuncha.0001.a:0 "의장을 정돈하고 사방 경계를 순시한다."
 WJ_langguan_xuncha.0001.desc:0 "당신은 속리를 거느리고 성을 나서 순찰하니, 연도의 관리와 백성이 길을 메워 맞이합니다."
 WJ_langguan_xuncha.0001.t:0 "낭관 순행·순찰"
 WJ_langguan_xuncha.0002.a:0 "관아에 올라 사건을 심문하고 시비를 분명히 가린다."
 WJ_langguan_xuncha.0002.desc:0 "현청에는 미결 사건이 산더미처럼 쌓였고, 관리와 백성의 송사가 끊이지 않습니다."
 WJ_langguan_xuncha.0002.t:0 "낭관 순행·판결"
 WJ_langguan_xuncha.0003.a:0 "가난한 이를 찾아 고충을 묻고 민정을 살핀다."
 WJ_langguan_xuncha.0003.desc:0 "밭의 늙은 농부와 저잣거리의 장사치에게는 저마다의 괴로움과 즐거움이 있습니다."
 WJ_langguan_xuncha.0003.t:0 "낭관 순행·민정 문안"
 WJ_langguan_xuncha.0100.a:0 "이번 순행으로 얻은 바가 많구나."
 WJ_langguan_xuncha.0100.desc:0 "몇 달 동안 순행하며 정사에 차츰 익숙해지고 현망도 점차 높아졌습니다."
 WJ_langguan_xuncha.0100.t:0 "낭관 순행·귀서"
 WJ_recommendation_reply.0001.a:0 "좋소. 조정을 위해 선비 하나를 얻겠구려."
 WJ_recommendation_reply.0001.t:0 "효렴 찰거에 대한 회신"
 WJ_recommendation_reply.0002.a:0 "사람마다 뜻이 있는 법이니 다른 현자를 고르겠소."
 WJ_recommendation_reply.0002.desc:0 "명공께서 저를 효렴으로 천거하신다는 글은 이미 읽었습니다. 두터운 뜻에 감사드립니다. 다만 이번에는 참으로 감히 받을 수 없어, 정중히 회신을 올려 명공께서 일찍 아시도록 합니다.\n\n‘사양’이라는 두 글자를 쓰기가 쉽지 않았고, 이 한 자리를 얻기가 어렵다는 것도 압니다. 하지만 한때의 감격으로 받아들였다가 훗날 망설임 때문에 천거한 분께 다시 수고를 끼친다면, 오늘의 허락을 더욱 저버리는 셈이 됩니다. 천거장에는 제 이름을 올리지 마시고 다른 현자를 구하십시오.\n\n천거를 받지는 못하나, 알아주신 정은 여전히 마음에 새기고 있습니다. 삼가 이를 아뢰오니 명공께서는 마음에 두지 마십시오."
 WJ_recommendation_reply.0002.t:0 "효렴 찰거에 대한 회신"
 WJ_recommendation_reply.0101.a:0 "삼가 알아주심에 감사드립니다."
 WJ_recommendation_reply.0101.t:0 "효렴 천거 요청에 대한 회신"
 WJ_recommendation_reply.0102.a:0 "다른 기회를 기다릴 수밖에 없겠군."
 WJ_recommendation_reply.0102.desc:0 "보내온 청은 이미 자세히 살폈소. 올해 효렴 선발에 나는 [secondary_actor.Custom('WJ_GetLinkedUIName')](을)를 천거할 수 없으니, 회신으로 솔직히 말하오. 태만하다 여기지 마시오.\n\n남의 청탁을 받으면 여지를 남기는 말 한마디를 하기가 가장 쉽소. 그러나 상대가 벼슬길을 여기에 기대고 있는데 내가 끝내 분명히 말하지 않으면 공연히 기다리게만 할 뿐이오. 지금 나는 아직 그를 위해 이런 추천을 할 수 없으니, 차라리 천거장이 정해지기 전에 분명히 해 두겠소.\n\n이 일은 여기서 그만두기를 바라오. 훗날 다른 기회가 있다면 다시 논의할 수 있을 것이오."
 WJ_recommendation_reply.0102.t:0 "효렴 천거 요청에 대한 회신"
 WJ_recommendation_reply.0201.a:0 "이번 천거는 공론을 저버리지 않을 것이다."
 WJ_recommendation_reply.0201.desc:0 "명공께서 무재로 천거해 주시니 기꺼이 받겠습니다. 보내신 글을 읽고 나니, 지난날 책상머리에서만 궁리하던 일들이 문득 모두 시험해 볼 기회를 얻은 듯합니다.\n\n평소 정사를 논할 때는 얼마든지 여유롭게 말할 수 있지만, 일을 맡게 되어서야 학문이 과연 얼마나 쓸모 있는지 드러납니다. 추천서 한 장으로 만사를 처리할 수 있다고 감히 큰소리치지는 못하나, 사양만 거듭한다면 명공의 오늘 추천을 저버리는 것이기도 합니다.\n\n논의한 일들은 모두 알고 있으니 마땅히 약속을 지키겠습니다. 삼가 먼저 이 글을 올려 천거에 응하는 뜻을 밝힙니다. 명공의 알아주심에는 앞으로 치적으로 보답하여, 천거받은 사람이 듣기 좋은 이름만 남기지 않도록 하겠습니다."
 WJ_recommendation_reply.0201.t:0 "무재 찰거에 대한 회신"
 WJ_recommendation_reply.0202.a:0 "그렇다면 다른 현재를 찾겠소."
 WJ_recommendation_reply.0202.desc:0 "명공께서 저를 무재로 천거하시려는 글은 이미 받았고, 두터운 뜻은 감히 가벼이 잊지 못합니다. 다만 이번에는 참으로 받을 수 없어 먼저 글을 올려 사양하오니, 천거장에 저를 위해 빈자리를 남겨 두지 않으셨으면 합니다.\n\n남의 추천을 받는 것은 본래 기쁜 일이니, 붓을 들어 거절하기 전에 저도 거듭 망설였습니다. 그러나 지금 마음을 정하고 감당할 수 없다면 먼저 그 이름을 취했다가 훗날 핑계를 찾아 빠져나가서는 안 될 것입니다. 이로 인해 명공을 실망시켜 드리는 것 또한 제가 바라는 바가 아닙니다.\n\n천거의 일은 다른 사람을 골라 주십시오. 따르지는 못하지만, 명공께서 이렇게 허락해 주신 두터운 뜻은 언제까지나 감사히 여기겠습니다."
 WJ_recommendation_reply.0202.t:0 "무재 찰거에 대한 회신"
 WJ_recommendation_reply.0301.a:0 "삼가 천거해 주신 분께 감사드립니다."
 WJ_recommendation_reply.0301.desc:0 "보내온 청은 이미 읽었소. 올해 무재로는 [secondary_actor.Custom('WJ_GetLinkedUIName')](을)를 천거하겠소. 이 뜻은 이미 정해졌으니 더 기다릴 필요 없소.\n\n조정에 사람을 천거하는 것은 결국 자기 안목까지 함께 내놓는 일이오. 내가 이런 추천을 하는 것은 바로 천거받는 사람이 재능을 펼칠 곳을 얻기를 바라기 때문이오. 훗날 다시 그 이름을 들을 때 옛 재명만이 아니라 볼 만한 치적도 듣기를 바라오.\n\n논의한 일들도 모두 그대로 시행하겠소. 나의 허락을 전해 주고, 이 기대도 함께 전해 주시오. 오늘 그에게 문 하나를 열어 주었으나, 앞으로 얼마나 멀리 갈지는 그 자신의 걸음에 달렸다고."
 WJ_recommendation_reply.0301.t:0 "무재 천거 요청에 대한 회신"
 WJ_recommendation_reply.0302.a:0 "다른 천거자를 찾을 수밖에 없겠군."
 WJ_recommendation_reply.0302.desc:0 "무재로 천거해 달라는 청은 내가 이미 숙고하였소. 올해는 [secondary_actor.Custom('WJ_GetLinkedUIName')](을)를 천거할 수 없으니 삼가 글로 분명히 알리오.\n\n온 사람의 간절한 말은 모두 들었으나, 아직 내가 추천서에 붓을 대기에는 부족하오. ‘다시 논의하자’는 말 한마디를 먼저 해 두어 여러분이 계속 이 일로 분주하게 하고서 훗날 지키지 못한다면 오히려 정분을 더 상하게 할 것이오. 허락할 수 없다면 늦은 회신을 핑계로 사양을 피해서는 안 될 것이오.\n\n이 일은 여기서 끝내고, 올해의 추천서를 더는 기다리지 마시오. 두터운 뜻은 마음으로 받겠소."
 WJ_recommendation_reply.0302.t:0 "무재 천거 요청에 대한 회신"
 wj_temp_official.1000.a:0 "항목마다 대조하여 서로 어긋나는 곳을 곧바로 짚는다."
 wj_temp_official.1000.b:0 "옛 방식대로 재검토하여 확실한 오류만 보고한다."
 wj_temp_official.1000.desc:0 "[wj_assessment_examiner.Custom('WJ_GetLinkedUIName')](이)가 계부 한 권을 당신 앞으로 밀어 놓습니다. 치국의 도는 묻지 않고, 그 안의 호구, 전조, 창곡의 수만 살피라고 합니다.\n\n몇 쪽을 넘기자 앞뒤로 맞지 않는 곳이 몇 군데 보입니다. 항목마다 대조하면 누군가 일부러 숨겨 둔 착오를 찾아낼 수도 있지만, 판단을 그르치면 도리어 평소 일 처리의 허술함을 드러낼 수도 있습니다. 옛 방식대로만 재검토하면 실수할 일은 적겠지만, 이것으로 뛰어난 평어를 얻기도 어렵습니다.\n\n고관은 재촉하지 않지만 책상 곁의 붓은 이미 준비되어 있습니다. 이번에 올려야 할 것은 당신이 정말로 똑똑히 이해한 내용이어야 하며, 선정에 관한 공허한 말 한 마디로는 넘어갈 수 없습니다."
 wj_temp_official.1000.t:0 "가리 고과: 장부 정밀 검사"
 wj_temp_official.1001.a:0 "완급을 저울질하여 따로 장정을 마련한다."
 wj_temp_official.1001.b:0 "삼가 상례를 따라 먼저 진휼하고 나중에 징수한다."
 wj_temp_official.1001.desc:0 "계부를 거두어 가자마자 고관이 다른 물음을 던집니다. 수재와 한재 뒤에 창고의 양식은 한정되어 있는데, 진대를 청하러 오는 사람은 적지 않고, 지방 호강들은 먼저 한몫 챙기려 하니, 당신은 어떻게 처리하겠느냐는 것입니다.\n\n방금 마주한 것은 장부 위의 숫자뿐이었지만, 이제는 선후 하나하나에 서로 다른 사람들이 얽혀 있습니다. 따로 장정을 마련하려면 진급, 징세, 치안 사이의 연관을 두루 고려해야 하고, 상례를 삼가 지키면 안전하기는 하나 얻는 것은 실수 없는 답변 하나에 불과합니다.\n\n당신은 입가까지 나온 ‘인정’이라는 두 글자를 도로 삼킵니다. 고관이 듣고 싶은 것은 당신이 백성을 얼마나 잘 대할지가 아니라, 양식이 정말로 모자랄 때 무엇부터 할 작정인지입니다."
 wj_temp_official.1001.t:0 "가리 고과: 임사처단"
 wj_temp_official.1002.a:0 "득실을 솔직히 아뢰고 개혁책을 조목조목 늘어놓는다."
 wj_temp_official.1002.b:0 "선례만 아뢰고 빈말은 하지 않는다."
 wj_temp_official.1002.desc:0 "장부와 치사, 두 물음이 지났지만 [wj_assessment_examiner.Custom('WJ_GetLinkedUIName')](은)는 붓을 내려놓지 않습니다. “자네 자신에 대해 말해 보게. 시수한 이래로 어떤 일을 가장 잘 처리했고, 어떤 일을 가장 고쳐야 하겠는가?”\n\n미리 준비한 상투적인 말 몇 마디가 갑자기 하나도 나오지 않습니다. 앞의 두 물음은 다른 곳의 현읍이나 가정된 재해를 논할 수 있었지만, 이 물음은 사람의 이름과 경위까지 모두 근거를 찾아볼 수 있습니다. 깊이 말하면 역량을 드러낼 수 있겠지만, 잘못 말하면 평소 숨겨 둔 허술함을 제 손으로 건네는 꼴이 됩니다.\n\n당신은 몸을 곧게 펴고 숨 한 번 쉴 만큼 멈춥니다. 옛 방식대로 무난한 일만 이야기할 것인가, 아니면 마음속에 품어 온 개혁책을 모두 털어놓을 것인가? 고관의 붓끝은 여전히 허공에 멈춘 채 당신이 입을 열기를 기다립니다."
 wj_temp_official.1002.t:0 "가리 고과: 이부 주대"
 wj_temp_official.1005.a:0 "과제를 절하여 받고 정식으로 출사한다."
 wj_temp_official.1005.b:0 "잘못한 바를 새겨 두고 내년에 다시 응시한다."
 wj_temp_official.1005.desc:0 "장부, 치사, 그리고 마지막 진술까지 모두 끝났습니다. 고관은 몇 차례의 기록을 한데 모으고 당신의 평소 현망도 참작한 뒤에야 과제를 당신 앞에 내밉니다.\n\n방금까지 말로 메울 수 있던 부분은 이제 모두 종이 위에 적혔습니다. 당신은 그 평정을 바라보며 시수의 거취에 관한 마지막 한마디를 기다립니다.\n\n"
 wj_temp_official.1005.desc_fail:0 "“합격에 미치지 못함.” 당신은 먼저 이 몇 글자를 보고서야 그 아래 내용을 읽습니다. 관직은 잠시 유지하되 여전히 가리로 시수하고, 내년에 다시 고과를 받으라는 것입니다. 방금 불안하게 답한 곳들이 한꺼번에 떠오르지만, 지금 다시 말해 본들 그것을 과제에 적어 줄 사람은 없습니다."
 wj_temp_official.1005.desc_good:0 "과제가 양으로 매겨져, 당신이 시수하던 직책은 이로써 정식으로 제수되었습니다. 여기까지 읽고서야 오래 졸이던 마음이 마침내 놓입니다. 평어에 고칠 점이 아직 있지만, 이 결과를 잘 간직하는 데에는 지장이 없습니다."
 wj_temp_official.1005.desc_high:0 "과제가 우로 매겨져, 당신이 시수하던 직책은 이로써 정식으로 제수되었습니다. 당신은 그 ‘우’ 자를 두 번이나 보고 나서야, 온 사람이 아직 장부를 거두어 가려고 기다리고 있음을 알아챕니다. 시험 전에 거듭 다듬었던 말들이 마침내 헛되지 않았습니다."
 wj_temp_official.1005.desc_pass:0 "과제가 합격으로 매겨져, 당신이 시수하던 직책은 이로써 정식으로 제수되었습니다. 평어를 따라 읽어 내려가니 몇몇 실수가 여전히 뚜렷하게 눈에 띄지만, 다행히 끝내 당신을 문밖에 막아 세우지는 않았습니다. 이번에는 어쨌든 통과했습니다."
 wj_temp_official.1005.t:0 "가리 고과: 과제 판정"

