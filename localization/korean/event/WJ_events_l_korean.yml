l_korean:
# 汉晋风华：按类型整合；键名与现行文本保留。来源逐键见本批manifest。

 # 来源：localization/replace/simp_chinese/WJ_xiaolian_direct_qualification_l_simp_chinese.yml
 WJ_recommendation_reply.0001.desc:0 "명공께서 저를 효렴으로 천거해 주시니, 삼가 글을 올려 받들겠습니다.\n\n보내신 글이 처음 왔을 때 저는 몇 번이고 거듭 읽고서야 제 이름이 정말 천거장에 올랐음을 믿을 수 있었습니다. 고향의 평판은 지난날 단편적으로만 들었을 뿐인데, 오늘 명공의 한마디 추천을 얻으니 기쁜 마음과 함께 앞으로는 한마디 말과 한 가지 행동이 예전보다 더 사람들의 눈길을 받으리라는 것도 압니다.\n\n지난번 논의한 일들은 마땅히 하나하나 약속을 지키겠습니다. 알아주신 은혜는 글 한 통으로 다할 수 없으니, 삼가 먼저 이로써 명공께 아룁니다. 저는 천거에 응하겠습니다."
 WJ_recommendation_reply.0101.desc:0 "보내온 글의 청은 내가 이미 허락하였소. 올해 효렴으로는 [secondary_actor.Custom('WJ_GetLinkedUIName')](을)를 천거하겠소.\n\n천거장 위에서 사람들이 보는 것은 천거받은 이만이 아니라 천거한 이의 안목이기도 하오. 내가 기꺼이 여기에 서명하는 이상 이를 가벼이 여기지 않을 것이오. 다만 훗날 어떻게 몸을 세우고 일을 맡을지는 결국 그 사람 스스로가 감당해야 하오.\n\n논의한 일들도 모두 그대로 시행하겠소. 나 대신 전해 주시오. 오늘의 천거장 한 장은 그저 그에게 문 하나를 열어 주었을 뿐이라고."

 # 来源：localization/simp_chinese/WJ_bizhao_reply_l_simp_chinese.yml
 WJ_bizhao_reply.0001.a:0 "경이 도와준다니 참으로 좋소."
 WJ_bizhao_reply.0001.desc:0 "벽소장이 이르러 읽고 나니 무척 기뻤습니다. 명공께서 버리지 않으시니 저는 부름에 응하여 막부에 들겠으며, 논의한 일들은 모두 따르겠습니다.\n\n지난날 부중의 사무를 남에게서 들을 때는 늘 소문 한 겹을 사이에 두었는데, 이제 직접 겪게 되니 황공하면서도 기대가 됩니다. 부임한 뒤에는 옛 장부와 끝내지 못한 일들을 함께 넘겨주시어 제가 빨리 익숙해지고 헛되이 자리만 차지하지 않게 해 주십시오.\n\n알아주신 은혜는 마음에 깊이 새기니, 감히 많은 인사치레를 늘어놓지 않겠습니다. 함께 일한 지 오래된 뒤에 명공께서 제가 과연 얼마나 쓸모 있는지 보아 주십시오."
 WJ_bizhao_reply.0002.a:0 "그렇다면 억지로 청하지 않겠소."
 WJ_bizhao_reply.0002.desc:0 "벽소장은 이미 받았습니다. 정성 어린 뜻에 거듭 읽으며 감동하지 않을 수 없었습니다. 다만 이번에는 참으로 부름에 응하기 어려워, 회답이 늦어진 것도 사양의 글 한 장이 가벼이 보일까 두려웠기 때문입니다.\n\n거듭 생각했으나, 끝내 아직 감당할 수 없는 직임을 먼저 받아들일 수는 없었습니다. 부중에서 사람이 급히 필요한데 제가 단지 정 때문에 고개를 끄덕였다가 훗날 다시 미룬다면 도리어 여러분의 일을 그르칠 것입니다. 막부의 자리는 다른 현자를 골라 주시고, 저를 위해 비워 두지 마십시오.\n\n이번에 함께 일하지 못하는 것은 초청의 정을 모르기 때문이 아닙니다. 삼가 글로 답하오니 명공께서 양해해 주십시오."

 # 来源：localization/simp_chinese/WJ_district_war_l_simp_chinese.yml
 WJ_district.200.desc:0 "전선의 싸움이 아직 그치지 않아 삼가 도독께 원군을 청합니다.\n\n각 부대가 아직은 버티고 있으나 지금의 병력만으로 오래 맞서다가는 두루 돌보기 어려울까 염려되어, 사자를 보내 필요한 바를 밝히는 것입니다. 막다른 지경에 이르러서야 허둥지둥 위급을 알리고 싶지는 않습니다.\n\n도독께서 친히 대군을 이끌고 오신다면 군중 상하가 모두 바라는 바이고, 다른 군무에 매여 계시다면 이 도독구에서 싸울 만한 장수를 골라 보내 주십시오. 그와 적정을 서로 통하고 함께 접응을 의논하겠습니다. 목을 빼고 회신을 기다립니다."
 WJ_district.200.dispatch:0 "따로 부장을 보내 원조하라."
 WJ_district.200.personal:0 "내가 친히 본부를 이끌고 원조하러 가겠다."
 WJ_district.201.desc:0 "앞서 원군을 청한 글이 이제 결실을 맺었습니다. [SCOPE.sC('wj_dd_target').Custom('WJ_GetLinkedUIName')](이)가 부대를 이끌고 당신의 전쟁에 합류했습니다.\n\n전선에서는 오래 기다려도 소식이 없는 것이 가장 두려우니, 전과를 기다리지 않고 먼저 사람을 보내 이 소식을 알립니다. 이후 두 군대는 적정을 서로 통하고 군령을 이어받아, 각 부대가 서로의 위치를 알게 해야 합니다. 각자 한구석만 지키다가 적을 마주하고서야 서로를 찾는 일이 없도록 하십시오.\n\n나아가고 물러나는 일은 여전히 병세와 도로를 살펴 정해야 합니다. 이 글을 받는 대로 서둘러 원군에게 필요한 바를 알리기 바랍니다."
 WJ_district.202.desc:0 "[SCOPE.sC('wj_dd_beneficiary').Custom('WJ_GetLinkedUIName')](이)가 위급을 알리며 원군을 청하니, 이제 당신에게 부대를 이끌고 그 전쟁에 합류할 것을 명합니다.\n\n원조를 받는 쪽은 오래도록 회신을 기다렸으니, 원군이 이미 길에 올랐음을 서둘러 알려야 합니다. 앞으로 군정, 도로, 접응 등의 일은 서로 분명히 해야 하며, 문서상으로만 한 군대로 묶여 있다가 적을 마주하고서는 서로를 모르는 일이 없어야 합니다.\n\n나아가고 물러남은 마땅히 형세를 살펴 행하십시오. 이 글은 당신에게 원전의 책임만을 줄 뿐, 승부는 진 앞에서 갈릴 것입니다."

 # 来源：localization/simp_chinese/WJ_kaoke_duties_l_simp_chinese.yml
 wj_kaoke_duties.1001.a:0 "사재를 털어 양식을 보충하고 재해 가구를 다시 조사한다."
 wj_kaoke_duties.1001.a.tt:0 "군에서는 이를 선정으로 여겨 올해 고과에 기록할 것입니다."
 wj_kaoke_duties.1001.b:0 "재해 상황을 자세히 아뢰고 분할 납부를 청한다."
 wj_kaoke_duties.1001.b.tt:0 "이 일은 관례대로 고과부에 기록되며, 공도 과도 없습니다."
 wj_kaoke_duties.1001.c:0 "예전 액수대로 독촉하고 따로 처리비를 거둔다."
 wj_kaoke_duties.1001.c.tt:0 "가혹하게 거둔다는 이름이 퍼져 고과 때 오점이 될 수 있습니다."
 wj_kaoke_duties.1001.d:0 "직접 창고 장부를 조사하여 체납분을 추징한다."
 wj_kaoke_duties.1001.d.failure:0 "체납분은 이미 추징할 길이 없었고, 독촉은 오히려 질서를 잃었다"
 wj_kaoke_duties.1001.d.failure.tt:0 "독촉이 질서를 잃었으니 고과 때 과실로 기록되기를 피하기 어렵습니다."
 wj_kaoke_duties.1001.d.success:0 "창고 장부를 서로 대조하여 빼돌린 세곡을 되찾았다"
 wj_kaoke_duties.1001.d.success.tt:0 "체납을 추징한 공이 있으니 고과 때 한 줄 기록할 만합니다."
 wj_kaoke_duties.1001.desc:0 "계리는 바쳐야 할 세곡의 수를 목독에 적었지만, 창조는 빈 곡을 당신의 책상 앞으로 밀어 놓았습니다. 봄물이 낮은 밭을 잠기게 했고, 가을 수확은 또 1할이 줄었습니다. 상부의 독촉 문서는 옛 액수만 따질 뿐, 밭에 얼마가 남았는지는 묻지 않습니다.\n\n문하연은 모자라는 액수를 아직 흩어져 도망가지 않은 가구들에게 나누어 매기자고 건의했습니다. 향로는 그 말을 듣고 땅에 엎드려, 작년에 이웃 집 대신 양식을 대 준 사람이 올해는 이미 밭갈이 소를 팔았다고 말합니다. 창고 장부의 체납은 해묵은 것이라 대체 몇 할이나 되찾을 수 있을지 아무도 말하지 못합니다.\n\n목독 끝에는 서명할 자리가 비어 있습니다. 장부는 맞출 수 있지만, 내년 밭에 여전히 갈 사람이 있을지는 알 수 없습니다."
 wj_kaoke_duties.1001.t:0 "장부는 넉넉하고 창고는 비었다"
 wj_kaoke_duties.1002.a:0 "돈을 내어 땅을 측량하고 보증서를 반려한다."
 wj_kaoke_duties.1002.a.tt:0 "땅의 경계를 분명히 판결했으니 고과 때 공으로 기록될 것입니다."
 wj_kaoke_duties.1002.b:0 "땅의 경계를 봉해 두고 원래 가구가 먼저 경작하게 한다."
 wj_kaoke_duties.1002.b.tt:0 "문서는 고과부에 기록되었으나 공도 과도 보이지 않습니다."
 wj_kaoke_duties.1002.c:0 "사례를 받고 새 장부대로 사건을 종결한다."
 wj_kaoke_duties.1002.c.tt:0 "예물을 받고 그릇되게 판결한 일은 고과 때 감추기 어려울 것입니다."
 wj_kaoke_duties.1002.d:0 "이정과 이웃들을 불러 모아 법정에서 대질한다."
 wj_kaoke_duties.1002.d.failure:0 "증인이 진술을 뒤집어 관부의 판결이 오히려 고을의 웃음거리가 되었다"
 wj_kaoke_duties.1002.d.failure.tt:0 "판결이 고을에서 웃음거리로 전해졌으니 고과 때 과실로 기록되기를 피하기 어렵습니다."
 wj_kaoke_duties.1002.d.success:0 "증언이 옛 문서와 맞아떨어져 호족이 침탈한 땅을 돌려주었다"
 wj_kaoke_duties.1002.d.success.tt:0 "법정에서 분명히 판결했으니 고과 때 한 줄 기록할 만합니다."
 wj_kaoke_duties.1002.desc:0 "몇몇 소민 가구가 옛 문서를 들고 와서 고했습니다. 고을의 대성이 경계석을 새로 세워 그들의 땅을 자기 장원에 합쳐 버렸다는 것입니다. 상대가 보내온 새 장부에는 인장이 모두 갖추어져 있지만, 붓을 든 서좌가 바로 그 집안의 인척입니다. 문서상으로는 칼부림이 보이지 않지만, 밭두렁 저편에서는 이미 아무도 감히 씨를 뿌리지 못합니다.\n\n주부는 낮은 목소리로, 대성이 보내온 보증서에 여러 지방 명사의 이름이 서명되어 있어 누구도 쉽게 반박할 수 없다고 일러 줍니다. 옛 문서가 있다 해도 이정과 이웃 밭 사람들이 법정에서 증언하지 않으면 경계를 분명히 가리기 어렵습니다.\n\n대성은 먼저 공사를 멈추고 경계를 논의하겠다며 따로 사례를 준비했습니다. 소민들은 단 한 가지만 묻습니다. 내년에도 원래의 밭으로 돌아갈 수 있느냐고."
 wj_kaoke_duties.1002.t:0 "밭두렁 사이에서"
 wj_kaoke_duties.1003.a:0 "돈을 미리 내어 운송을 고용하고 직접 일정을 짠다."
 wj_kaoke_duties.1003.a.tt:0 "역로가 원활하니 고과 때 공으로 기록될 것입니다."
 wj_kaoke_duties.1003.b:0 "급한 일부터 처리하고 나머지는 연기를 신청한다."
 wj_kaoke_duties.1003.b.tt:0 "이 일은 평소대로 고과부에 기록되며, 공도 과도 없습니다."
 wj_kaoke_duties.1003.c:0 "정원대로 인부를 징발하고 따로 면역전을 거둔다."
 wj_kaoke_duties.1003.c.tt:0 "부역을 늘리고 돈을 거두었으니 고과 때 오점이 될 수 있습니다."
 wj_kaoke_duties.1003.d:0 "직접 전사에 가서 구간을 나누어 교대시킨다."
 wj_kaoke_duties.1003.d.failure:0 "인계가 기한을 놓쳐 사람과 말이 지치고 연도의 질서가 무너졌다"
 wj_kaoke_duties.1003.d.failure.tt:0 "기한을 그르쳤으니 고과 때 과실로 기록되기를 피하기 어렵습니다."
 wj_kaoke_duties.1003.d.success:0 "사람과 말이 질서 있게 교대하여 급한 임무를 기한 내에 인계했다"
 wj_kaoke_duties.1003.d.success.tt:0 "조도가 적절했으니 고과 때 한 줄 기록할 만합니다."
 wj_kaoke_duties.1003.desc:0 "역리가 급한 공문 세 통을 올립니다. 하나는 부고로 양식과 물자를 보내라는 독촉이고, 하나는 전거를 이어 대라는 것이며, 또 하나는 연도의 부역 인부를 내놓으라는 독촉입니다. 여러 기한이 한데 몰려 역마는 이미 뼈가 드러날 만큼 말랐습니다. 시골은 한창 농사철인데 장정을 또 한 무리 빼 가면 이번 철의 수확이 늦어질 것입니다.\n\n도리가 손가락을 꼽으며 셈해 줍니다. 수레를 빌리고 인부를 모으려면 돈이 들고, 차수를 합치고 구간을 나누어 운송하려면 누군가 기한을 어긴 책임을 져야 하며, 일마다 완급을 신고하려면 상부와 오가는 문서도 빠질 수 없습니다.\n\n역문 밖에서는 차출을 기다리는 사람들이 농기구를 담 밑에 기대어 두었습니다. 그들이 당신의 서명을 기다리는 것은 며칠간의 노정이자, 집안의 밭이 비어 있을 날들이기도 합니다."
 wj_kaoke_duties.1003.t:0 "전사에 한가한 사람 없다"

