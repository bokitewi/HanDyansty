 # 来源：localization/simp_chinese/WJ_langguan_loc_l_simp_chinese.yml
 wj_langguan.1000.a:0 "자기 견해를 솔직히 밝히고 경의로 그 이치를 절충한다"
 wj_langguan.1000.b:0 "옛 주석을 삼가 지키고 위태로운 해석은 하지 않는다"
 wj_langguan.1000.desc:0 "[wj_assessment_examiner.Custom('WJ_GetLinkedUIName')](이)가 당신에게 경전을 풀이하고 장구의 차이를 가린 뒤, 경의로 윤리에 관한 의옥 하나를 판단하라고 명합니다. 이 물음은 훈고만 따지는 듯하지만, 실은 당신이 경전을 인용하되 옛것에 얽매이지 않을 수 있는지를 보려는 것입니다."
 wj_langguan.1000.t:0 "낭관 고교: 통경명의"
 wj_langguan.1001.a:0 "경의와 율령을 참작하여 옥사를 판결하는 법을 자세히 아뢴다"
 wj_langguan.1001.b:0 "선례를 따라 판결하여 실수가 없도록 힘쓴다"
 wj_langguan.1001.desc:0 "두 번째 물음은 율령으로 넘어갑니다. 같은 사건에 여러 사람이 얽혀 있고, 정상에는 경중이 있으며, 법에는 정해진 조문이 있습니다. 주고관은 당신에게 그 자리에서 판결문을 작성하라 하니, 인정에 끌려 법을 버려서도 안 되고 법을 집행하다 의리를 해쳐서도 안 됩니다."
 wj_langguan.1001.t:0 "낭관 고교: 율령단사"
 wj_langguan.1002.a:0 "옛일을 끌어 지금을 증명하며 폐단을 구할 방책 하나를 아뢴다"
 wj_langguan.1002.b:0 "가장 안전한 진휼의 상법만 아뢴다"
 wj_langguan.1002.desc:0 "마지막 물음은 주대입니다. 주고관은 군국에 재해와 흉년이 들고 도적이 함께 일어났는데 조정의 재정이 부족하다고 가정하고, 잠깐 사이에 선후와 완급을 조목조목 아뢰라 명합니다. 온 좌중이 고요한 가운데 죽간 넘기는 소리만 가볍게 들립니다."
 wj_langguan.1002.t:0 "낭관 고교: 전전주대"
 wj_langguan.1005.a:0 "삼가 고제를 받고 이제 관서를 나선다"
 wj_langguan.1005.b:0 "관서에 남아 학업을 익히고 내년에 다시 응시한다"
 wj_langguan.1005.desc:0 "세 물음이 모두 끝나자 주고관이 두루마리를 덮고, 그 자리에서 당신의 경술, 법의, 주대를 평가합니다."
 wj_langguan.1005.desc_fail:0 "당신의 답변은 얽매임에 치우치거나 법의에 소홀하여 아직 관서를 떠나기에는 부족합니다. 주고관은 한 해 더 익혀 내년에 다시 고교를 받으라 명합니다."
 wj_langguan.1005.desc_good:0 "당신의 답변은 조리가 분명하고 이따금 취할 만한 새로운 뜻도 있어 평어가 양호로 매겨졌으니, 정식으로 효렴 출신을 얻기에 충분합니다."
 wj_langguan.1005.desc_high:0 "당신의 답변은 경학과 법을 꿰뚫고 시무에도 적중하여 평어가 우수로 매겨졌습니다. 이로써 관서를 떠나 출신하게 되었고, 조정에서도 당신의 이름을 기억하게 되었습니다."
 wj_langguan.1005.desc_pass:0 "당신의 답변은 날카로움은 적었으나 큰 실수가 없어 평어가 합격으로 매겨졌으니, 정식으로 효렴 출신을 얻는 것이 허락되었습니다."
 wj_langguan.1005.t:0 "낭관 고교: 등급 판정"

 # 来源：localization/simp_chinese/WJ_military_governance_l_simp_chinese.yml
 WJ_zhongwai.0001.a:0 "절을 받고 조서를 받들어 중외를 총독한다."
 WJ_zhongwai.0001.desc:0 "총독중외제군사의 조명 낭독이 끝났지만, 당신은 여전히 눈앞의 부절을 바라보고 있습니다. 앞으로 여러 군대가 절제를 두고 다투거나 앞뒤로 서로 구원하기 어려울 때면 누군가 문서를 당신의 책상에 올릴 것이고, 다시는 그것이 다른 관서의 일이라 핑계 댈 수 없을 것입니다.\n\n조서를 읽은 자가 잠시 멈추고 당신이 조서를 받들기를 기다립니다. 전각 안의 몇몇 시선이 따라 옮겨 오는데, 누구는 당신을 보고 누구는 부절을 보니, 대체 무엇을 가늠하는지 알 수 없습니다. 당신은 옷깃을 여미며, 머지않아 당신의 책상으로 바뀌어 올라올 몇 통의 군보를 벌써 떠올립니다.\n\n이 권한은 보정의 직임을 따라 온 것이지, 가문이 사사로이 물려줄 수 있는 것이 아닙니다. 그러나 지금 중외의 군무를 총괄하는 사람은 당신입니다. 마지막 “신이 조서를 받드옵니다”라는 한마디는 전각 위의 모든 이가 똑똑히 듣게 해야 합니다."
 WJ_zhongwai.0001.t:0 "조총중외"
 WJ_zhongwai.0002.a:0 "삼가 조명을 받들겠습니다."
 WJ_zhongwai.0002.desc:0 "조명이 내려집니다. [wj_zw_holder.Custom('WJ_GetLinkedUIName')](이)가 총독중외제군사가 되고 황월을 빌린다고 합니다. 방금까지 낮은 소리로 이야기하던 사람들이 차츰 입을 다무니, 이 몇 글자가 앞선 예사보다 더 사람들의 고개를 들게 합니다.\n\n당신은 새로 정해진 절제를 들으며, 전에 여러 관서가 서로 떠넘기던 군보들을 떠올립니다. 이제부터는 누가 명령을 내릴 수 있고 누가 품의해야 하는지 다시 분명히 기억해야 합니다. 여전히 옛 경로로 보내는 문서는 아마 봉한 그대로 되돌아올 것입니다.\n\n조서를 전하는 자는 여전히 낭독을 이어 가고, 사방의 낯빛은 저마다 다릅니다. 당신은 서둘러 다른 이와 논의하지 않고 그 이름만 마음에 새겨 둡니다. 다음에 군중에 일이 생기면 어디에 청해야 할지, 오늘부로 달라졌습니다."

