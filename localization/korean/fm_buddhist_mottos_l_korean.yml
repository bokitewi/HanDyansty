 motto_fm_buddhist_516:0 "염불하는 이는 누구인가, 본래를 꿰뚫어라"
 motto_fm_buddhist_517:0 "화두를 돌보아 한 번 더 들어 올려라"
 motto_fm_buddhist_518:0 "만 가지 인연을 내려놓고 오직 한 생각만 들어라"
 motto_fm_buddhist_519:0 "한 생각도 일지 않으면 전체가 드러난다"
 motto_fm_buddhist_520:0 "육근이 막 움직이면 구름에 가려진다"
 motto_fm_buddhist_521:0 "마음이 움직이지 않으면 바람인들 어찌하랴"
 motto_fm_buddhist_522:0 "미친 마음이 문득 쉬니, 쉼이 곧 보리다"
 motto_fm_buddhist_523:0 "망상이 쉬는 곳이 곧 보리다"
 motto_fm_buddhist_524:0 "무명의 참된 성품이 곧 불성이다"
 motto_fm_buddhist_525:0 "허깨비 같은 빈 몸이 곧 법신이다"
 motto_fm_buddhist_526:0 "스스로 그 마음을 맑히는 것이 모든 부처의 가르침이다"
 motto_fm_buddhist_527:0 "마음이 맑으면 국토가 맑고, 마음이 편하면 중생이 편하다"
 motto_fm_buddhist_528:0 "극락세계는 오직 마음의 정토다"
 motto_fm_buddhist_529:0 "자성이 곧 아미타요, 오직 마음이 정토다"
 motto_fm_buddhist_530:0 "꽃 피어 부처를 보고 무생을 깨닫는다"
 motto_fm_buddhist_531:0 "연꽃에서 화생하여 구품으로 왕생한다"
 motto_fm_buddhist_532:0 "삼배구품이 모두 왕생한다"
 motto_fm_buddhist_533:0 "업을 지닌 채 왕생하고 원을 타고 다시 온다"
 motto_fm_buddhist_534:0 "자비의 배를 거꾸로 몰아 중생을 널리 건넨다"
 motto_fm_buddhist_535:0 "보살은 원인을 두려워하고 중생은 결과를 두려워한다"
 motto_fm_buddhist_536:0 "전생의 원인을 알려거든 이생에 받는 것을 보라"
 motto_fm_buddhist_537:0 "내생의 결과를 알려거든 이생에 짓는 것을 보라"
 motto_fm_buddhist_538:0 "삼세의 인과는 순환하여 헛되지 않다"
 motto_fm_buddhist_539:0 "만 가지를 가져가지 못하나 오직 업만은 몸을 따른다"
 motto_fm_buddhist_540:0 "인과는 삼세에 통하니 선악에는 모두 갚음이 있다"
 motto_fm_buddhist_541:0 "업의 힘은 그림자가 몸을 따르듯 헛되지 않다"
 motto_fm_buddhist_542:0 "업장을 소멸하려면 진실로 참회해야 한다"
 motto_fm_buddhist_543:0 "죄는 마음에서 일어나니 마음으로 참회하라, 마음이 사라지면 죄도 사라진다"
 motto_fm_buddhist_544:0 "마음이 사라지고 죄가 멸하여 둘 다 공하면, 이를 참된 참회라 한다"
 motto_fm_buddhist_545:0 "지난날 지은 모든 악업은 모두 시작 없는 탐진치에서 비롯되었다"
 motto_fm_buddhist_546:0 "몸과 말과 뜻으로 지은 모든 것을 내 이제 모두 참회합니다"
 motto_fm_buddhist_547:0 "참회는 맑은 물과 같아 모든 때를 씻어 낸다"
 motto_fm_buddhist_548:0 "지난 일을 고치고 앞날을 닦으며 지난 잘못을 통렬히 고친다"
 motto_fm_buddhist_549:0 "머리에 붙은 불을 끄듯 용맹하게 정진하라"
 motto_fm_buddhist_550:0 "다만 무상을 생각하며 방일하지 말라"
 motto_fm_buddhist_551:0 "이날이 이미 지나니 목숨도 따라 줄어든다"
 motto_fm_buddhist_552:0 "머리에 붙은 불을 끄듯 마땅히 부지런히 정진하라"
 motto_fm_buddhist_553:0 "사람 몸 받기 어려운데 이제 받았고, 불법 듣기 어려운데 이제 들었다"
 motto_fm_buddhist_554:0 "이 몸을 이생에 제도하지 않으면 다시 어느 생을 기다려 제도하랴"
 motto_fm_buddhist_555:0 "늙어서야 도를 배우려 하지 말라, 외로운 무덤에는 젊은이가 많다"
 motto_fm_buddhist_556:0 "도를 듣는 데 선후가 없고, 도를 깨치는 데 나이가 없다"
 motto_fm_buddhist_557:0 "노승이 삼십 년 전 참선하기 전에는 산은 산으로 보였다"
 motto_fm_buddhist_558:0 "뒤에 선지식을 친견하여 들어갈 곳을 얻고 나니"
 motto_fm_buddhist_559:0 "이제 쉴 곳을 얻으니 산은 다만 산으로 보인다"
 motto_fm_buddhist_560:0 "산은 여전히 산이요, 물은 여전히 물이다"
 motto_fm_buddhist_561:0 "산을 보니 산이 아니요, 물을 보니 물이 아니다"
 motto_fm_buddhist_562:0 "빈손에 호미를 쥐고, 걸어가며 물소를 탄다"
 motto_fm_buddhist_563:0 "배고프면 밥 먹고 졸리면 자니, 가고 머물고 앉고 눕는 것이 모두 선이다"
 motto_fm_buddhist_564:0 "마음이 편한 곳이면 어디든 고향이다"
 motto_fm_buddhist_565:0 "봄에는 온갖 꽃, 가을에는 달, 여름에는 서늘한 바람, 겨울에는 눈"
 motto_fm_buddhist_566:0 "마음에 걸린 부질없는 일 없으면 그것이 곧 인간 세상의 좋은 시절이라"
 motto_fm_buddhist_567:0 "만고의 긴 허공, 하루아침의 바람과 달"
 motto_fm_buddhist_568:0 "시냇물 소리와 산 빛이 모두 선의 뜻이다"
 motto_fm_buddhist_569:0 "시냇물 소리는 모두 부처의 설법이요, 산 빛은 청정한 법신 아님이 없다"
 motto_fm_buddhist_570:0 "연못 가득한 연잎은 다함 없는 옷이요, 몇 그루 솔꽃은 넉넉한 양식이다"
 motto_fm_buddhist_571:0 "밝은 달은 밤길을 위함이 아니요, 거센 바람도 우뚝한 소나무를 꺾지 못한다"
 motto_fm_buddhist_572:0 "대 그림자가 섬돌을 쓸어도 먼지는 움직이지 않고, 달이 바다를 뚫어도 물에는 흔적이 없다"
 motto_fm_buddhist_573:0 "구름은 푸른 하늘에, 물은 병 속에"
 motto_fm_buddhist_574:0 "물을 움켜쥐니 달이 손안에 있고, 꽃을 만지니 향기가 옷에 가득하다"
 motto_fm_buddhist_575:0 "걸어서 물이 다하는 곳에 이르러, 앉아서 구름 이는 때를 바라보네"
 motto_fm_buddhist_576:0 "산 빛은 새의 마음을 기쁘게 하고, 못에 비친 그림자는 사람의 마음을 비우네"
 motto_fm_buddhist_577:0 "온갖 소리 모두 고요한데, 오직 종과 경쇠 소리만 남았네"
 motto_fm_buddhist_578:0 "굽은 길은 그윽한 곳으로 통하고, 선방에는 꽃과 나무가 깊구나"
 motto_fm_buddhist_579:0 "빈 산에 사람은 보이지 않고, 다만 사람 말소리만 들려오네"
 motto_fm_buddhist_580:0 "밝은 달은 소나무 사이를 비추고, 맑은 샘은 돌 위로 흐르네"
 motto_fm_buddhist_581:0 "걸으며 흐르는 물을 보고, 앉아서 구름을 보네"
 motto_fm_buddhist_582:0 "하늘 밖 구름이 말리고 펴지는 것을 바라보네"
 motto_fm_buddhist_583:0 "물은 흘러도 마음은 다투지 않고, 구름이 머무니 뜻도 함께 느긋하네"
 motto_fm_buddhist_584:0 "지는 꽃 아래 사람은 홀로 서 있고, 가랑비 속에 제비는 쌍쌍이 나네"
 motto_fm_buddhist_585:0 "성긴 그림자 비스듬히 맑고 얕은 물에 드리우고, 그윽한 향기는 황혼의 달빛 아래 떠도네"
 motto_fm_buddhist_586:0 "동쪽 울타리 아래 국화를 따다가, 유연히 남산을 바라보네"
 motto_fm_buddhist_587:0 "이 가운데 참뜻이 있으나, 말하려니 이미 말을 잊었네"
 motto_fm_buddhist_588:0 "마음이 멀어지니 땅도 절로 외져, 수레와 말의 소란이 없네"
 motto_fm_buddhist_589:0 "사람 사는 곳에 초막을 지었으나, 수레와 말의 소란이 없네"
 motto_fm_buddhist_590:0 "그대에게 묻노니 어찌 그럴 수 있는가, 마음이 멀어지니 땅도 절로 외지다네"
 motto_fm_buddhist_591:0 "오랫동안 새장 속에 있다가, 다시 자연으로 돌아왔네"
 motto_fm_buddhist_592:0 "갇힌 새는 옛 숲을 그리고, 연못의 물고기는 옛 못을 생각하네"
 motto_fm_buddhist_593:0 "어려서부터 세속에 맞는 기질이 없고, 본성이 본래 언덕과 산을 사랑하였네"
 motto_fm_buddhist_594:0 "인생이 이르는 곳마다 무엇과 같은지 아는가, 마땅히 기러기가 눈 쌓인 진흙을 밟는 것과 같으리"
 motto_fm_buddhist_595:0 "진흙 위에 우연히 발톱 자국을 남겨도, 기러기 날아가면 어찌 동서를 따지랴"
 motto_fm_buddhist_596:0 "여산의 참모습을 알지 못하는 것은, 다만 이 몸이 산속에 있기 때문이라"
 motto_fm_buddhist_597:0 "가로로 보면 고개요 옆으로 보면 봉우리, 멀고 가깝고 높고 낮음에 따라 저마다 다르네"
 motto_fm_buddhist_598:0 "도롱이 하나 안개비를 누가 두려워하랴"
 motto_fm_buddhist_599:0 "돌아가니 비바람도 없고 갠 날도 없도다"
 motto_fm_buddhist_600:0 "다만 바라노니 사람은 오래 살아, 천 리 밖에서도 함께 달을 보기를"
 motto_fm_buddhist_601:0 "사람에게는 슬픔과 기쁨, 만남과 헤어짐이 있고, 달에는 흐림과 갬, 차고 이지러짐이 있네"
 motto_fm_buddhist_602:0 "바다 위에 밝은 달이 떠오르니, 하늘 끝에서도 이때를 함께하네"
 motto_fm_buddhist_603:0 "큰 강은 동으로 흘러가며, 물결이 천고의 풍류 인물을 모두 씻어 갔네"
 motto_fm_buddhist_604:0 "어지러운 바위는 하늘을 뚫고, 놀란 파도는 기슭을 때려 천 무더기 눈을 말아 올리네"
 motto_fm_buddhist_605:0 "강산은 그림 같은데, 한때 그 얼마나 많은 호걸이 있었던가"
 motto_fm_buddhist_606:0 "인생은 꿈과 같으니, 술 한 잔을 강 위의 달에 부어 올리네"
 motto_fm_buddhist_607:0 "도도한 장강은 동으로 흘러가고, 물보라는 영웅들을 모두 씻어 갔네"
 motto_fm_buddhist_608:0 "시비와 성패는 고개 돌리면 공허하다"
 motto_fm_buddhist_609:0 "백발의 어부와 나무꾼은 강가에서 가을 달과 봄바람에 익숙하네"
 motto_fm_buddhist_610:0 "고금의 수많은 일이 모두 웃음 섞인 이야기 속에 담기네"
 motto_fm_buddhist_611:0 "저녁놀은 외로운 따오기와 나란히 날고, 가을 물은 긴 하늘과 한 빛이로다"
 motto_fm_buddhist_612:0 "늙을수록 더욱 굳세야 하니, 어찌 백발의 마음을 바꾸랴"
 motto_fm_buddhist_613:0 "궁할수록 더욱 굳건해야 하니, 청운의 뜻을 떨어뜨리지 않으리"
 motto_fm_buddhist_614:0 "천하의 근심에 앞서 근심하고, 천하의 즐거움보다 뒤에 즐거워한다"
 motto_fm_buddhist_615:0 "외물로 기뻐하지 않고, 자신의 처지로 슬퍼하지 않는다"
 motto_fm_buddhist_616:0 "묘당의 높은 자리에 있으면 그 백성을 근심한다"
 motto_fm_buddhist_617:0 "천지에 바른 기운이 있으니, 뒤섞여 온갖 형상으로 흐른다"
 motto_fm_buddhist_618:0 "예로부터 인생에 죽지 않는 이 누구랴, 붉은 마음을 남겨 역사를 비추리라"
 motto_fm_buddhist_619:0 "부귀도 음탕하게 하지 못하고, 빈천도 뜻을 옮기지 못하며, 위세와 무력도 굽히지 못한다"
 motto_fm_buddhist_620:0 "하늘이 장차 큰 소임을 이 사람에게 내리려 하면, 반드시 먼저 그 마음과 뜻을 괴롭힌다"
 motto_fm_buddhist_621:0 "근심과 환난 속에 살고, 안락 속에 죽는다"
 motto_fm_buddhist_622:0 "길은 아득히 멀고 머니, 나는 위아래로 오르내리며 찾으리라"
 motto_fm_buddhist_623:0 "이 또한 내 마음이 선하다 여기는 것이니, 아홉 번 죽더라도 뉘우치지 않으리"
 motto_fm_buddhist_624:0 "아침에 도를 들으면 저녁에 죽어도 좋다"
 motto_fm_buddhist_625:0 "선비는 넓고 굳세지 않을 수 없으니, 짐은 무겁고 길은 멀다"
 motto_fm_buddhist_626:0 "내가 서고자 하면 남을 세우고, 내가 이루고자 하면 남을 이루게 한다"
 motto_fm_buddhist_627:0 "널리 배우고 뜻을 독실히 하며, 절실히 묻고 가까이 생각한다"
 motto_fm_buddhist_628:0 "배우기만 하고 생각하지 않으면 어둡고, 생각만 하고 배우지 않으면 위태롭다"
 motto_fm_buddhist_629:0 "옛것을 익혀 새것을 알면 스승이 될 만하다"
 motto_fm_buddhist_630:0 "아는 것을 안다 하고 모르는 것을 모른다 하는 것, 이것이 앎이다"
 motto_fm_buddhist_631:0 "영민하면서도 배우기를 좋아하고, 아랫사람에게 묻기를 부끄러워하지 않는다"
 motto_fm_buddhist_632:0 "남이 나를 알아주지 않음을 걱정하지 말고, 내가 남을 알지 못함을 걱정하라"
 motto_fm_buddhist_633:0 "군자는 평탄하고 너그러우며, 소인은 늘 근심에 차 있다"
 motto_fm_buddhist_634:0 "군자는 화합하되 같아지지 않고, 소인은 같아지되 화합하지 않는다"
 motto_fm_buddhist_635:0 "날이 추워진 뒤에야 소나무와 측백이 늦게 시듦을 안다"
 motto_fm_buddhist_636:0 "하늘의 운행이 굳건하니, 군자는 이를 본받아 스스로 쉼 없이 힘쓴다"
 motto_fm_buddhist_637:0 "고요함으로 몸을 닦고, 검소함으로 덕을 기른다"
 motto_fm_buddhist_638:0 "담박하지 않으면 뜻을 밝힐 수 없고, 고요하지 않으면 멀리 이를 수 없다"
 motto_fm_buddhist_639:0 "뜻은 마땅히 높고 멀리 두어야 한다"
 motto_fm_buddhist_640:0 "산은 높음을 마다하지 않고, 바다는 깊음을 마다하지 않는다"
 motto_fm_buddhist_641:0 "바다가 넓으니 물고기는 마음껏 뛰고, 하늘이 높으니 새는 마음껏 난다"
 motto_fm_buddhist_642:0 "언젠가 반드시 정상에 올라, 뭇 산이 작음을 한눈에 보리라"
 motto_fm_buddhist_643:0 "천 리 밖까지 바라보고자 다시 한 층 누각을 오르네"
 motto_fm_buddhist_644:0 "뜬구름이 눈을 가려도 두렵지 않으니, 이 몸이 가장 높은 곳에 있기 때문이라"
 motto_fm_buddhist_645:0 "저 물이 어찌 이리 맑은가 물으니, 원천에서 살아 있는 물이 흘러오기 때문이라"
 motto_fm_buddhist_646:0 "종이 위에서 얻은 것은 끝내 얕으니, 이 일을 제대로 알려면 몸소 행해야 한다"
 motto_fm_buddhist_647:0 "갈고닦지 않으면 그릇을 이루지 못한다"
 motto_fm_buddhist_648:0 "긴 바람 타고 물결을 헤칠 때가 오리니, 구름 돛을 곧게 달고 푸른 바다를 건너리라"
 motto_fm_buddhist_649:0 "하늘이 나를 낳았으니 반드시 쓰일 데가 있고, 천금을 다 써도 다시 돌아오리라"
 motto_fm_buddhist_650:0 "가라앉은 배 곁으로 천 척의 돛배가 지나가고, 병든 나무 앞에 만 그루 나무가 봄을 맞네"
 motto_fm_buddhist_651:0 "떨어진 꽃잎은 무정한 것이 아니니, 봄 흙이 되어 다시 꽃을 지키네"
 motto_fm_buddhist_652:0 "봄누에는 죽어서야 실 뽑기를 다하고, 촛불은 재가 되어서야 눈물이 마르네"
 motto_fm_buddhist_653:0 "들불이 다 태우지 못하니, 봄바람 불면 다시 돋아나네"
 motto_fm_buddhist_654:0 "도성 거리에 보슬비가 연유처럼 촉촉하니, 풀빛은 멀리서 보이나 가까이서는 없네"
 motto_fm_buddhist_655:0 "해 뜨면 강가의 꽃은 불보다 붉고, 봄이 오면 강물은 쪽빛처럼 푸르네"
 motto_fm_buddhist_656:0 "작은 연잎이 뾰족한 끝을 막 드러내니, 벌써 잠자리가 그 위에 앉아 있네"
 motto_fm_buddhist_657:0 "하늘에 닿은 연잎은 끝없이 푸르고, 햇살에 비친 연꽃은 유달리 붉네"
 motto_fm_buddhist_658:0 "대숲 밖 복사꽃 두세 가지, 봄 강물 따뜻함을 오리가 먼저 아네"
 motto_fm_buddhist_659:0 "수레 멈추고 앉아 저무는 단풍 숲을 사랑하니, 서리 맞은 잎이 이월의 꽃보다 붉네"
 motto_fm_buddhist_660:0 "온갖 꽃에서 모아 꿀을 이룬 뒤에, 누구를 위해 고생하고 누구를 위해 달게 하였나"
 motto_fm_buddhist_661:0 "천 번 갈리고 만 번 맞아도 여전히 굳세니, 동서남북 어느 바람이든 불어 보라"
 motto_fm_buddhist_662:0 "남이 빛깔 좋다 칭찬하기를 바라지 않고, 다만 맑은 기운을 천지에 가득 남기리"
 motto_fm_buddhist_663:0 "보잘것없는 우리 고을 관리지만, 가지 하나 잎 하나에도 늘 마음이 쓰이네"
 motto_fm_buddhist_664:0 "세상일에 밝으면 모두 학문이요, 인정에 능숙하면 곧 문장이다"
 motto_fm_buddhist_665:0 "만 권의 책을 독파하면 붓을 들 때 신들린 듯하다"
 motto_fm_buddhist_666:0 "문장은 천고의 일이요, 득실은 한 치 마음이 안다"
 motto_fm_buddhist_667:0 "두 구절을 삼 년 만에 얻어, 한 번 읊으니 두 줄기 눈물이 흐르네"
 motto_fm_buddhist_668:0 "글자 하나를 바로 앉히려 수염 몇 가닥을 비벼 끊었네"
 motto_fm_buddhist_669:0 "새는 연못가 나무에 깃들고, 스님은 달 아래 문을 두드리네"
 motto_fm_buddhist_670:0 "몸에는 채색 봉황의 두 날개가 없어도, 마음에는 영험한 무소뿔처럼 한 점 통함이 있네"
 motto_fm_buddhist_671:0 "허리띠가 점점 헐렁해져도 끝내 후회하지 않으니, 그대 위해 이렇게 여위었네"
 motto_fm_buddhist_672:0 "무리 속에서 그를 천 번 백 번 찾았네"
 motto_fm_buddhist_673:0 "두 마음이 오래도록 이어진다면, 어찌 아침저녁으로 함께해야만 하리"
 motto_fm_buddhist_674:0 "가을바람과 옥 같은 이슬이 한 번 만나니, 인간 세상의 수많은 만남보다 낫네"
 motto_fm_buddhist_675:0 "산처럼 굳은 맹세는 남았으나 비단 편지를 부칠 길 없으니, 그만두자, 그만두자, 그만두자"
 motto_fm_buddhist_676:0 "그대의 손을 잡고 그대와 함께 늙으리라"
 motto_fm_buddhist_677:0 "죽든 살든 만나든 헤어지든, 그대와 굳게 약속하였네"
 motto_fm_buddhist_678:0 "하늘에서는 비익조가 되기를, 땅에서는 연리지가 되기를 바라네"
 motto_fm_buddhist_679:0 "하늘과 땅은 길고 오래도 다할 때가 있으나, 이 한은 끝없이 이어져 다할 날이 없으리"
 motto_fm_buddhist_680:0 "푸른 바다를 겪고 나면 다른 물은 물이라 하기 어렵고, 무산을 떠나면 구름이 구름이 아니네"
 motto_fm_buddhist_681:0 "만나기도 어렵고 헤어지기도 어려운데, 봄바람은 힘없고 온갖 꽃은 시드네"
 motto_fm_buddhist_682:0 "언제 함께 서쪽 창가의 촛불 심지를 자르며, 파산의 밤비 내리던 때를 이야기할까"
 motto_fm_buddhist_683:0 "이 정은 추억이 되기를 기다릴 만하나, 그때 이미 아득하였네"
 motto_fm_buddhist_684:0 "그 얼굴은 어디로 갔는지 모르는데, 복사꽃은 여전히 봄바람에 웃고 있네"
 motto_fm_buddhist_685:0 "작년 오늘 이 문 안에서, 그 얼굴과 복사꽃이 서로 붉게 비추었네"
 motto_fm_buddhist_686:0 "포도주 빛 고운 술을 야광배에 따르니, 마시려는데 비파 소리가 말 위에서 재촉하네"
 motto_fm_buddhist_687:0 "술에 취해 모래 싸움터에 누워도 그대여 웃지 마오, 예로부터 출정하여 몇이나 돌아왔던가"
 motto_fm_buddhist_688:0 "누런 모래 속 백 번 싸움에 쇠갑옷이 뚫려도, 누란을 깨뜨리지 못하면 끝내 돌아가지 않으리"
 motto_fm_buddhist_689:0 "용성의 비장군이 있기만 하다면, 오랑캐 말이 음산을 넘지 못하게 하리라"
 motto_fm_buddhist_690:0 "진나라 때의 밝은 달, 한나라 때의 관문, 만 리 원정길에 사람은 돌아오지 못했네"
 motto_fm_buddhist_691:0 "넓은 사막에 외로운 연기 곧게 오르고, 긴 강에 지는 해 둥글다"
 motto_fm_buddhist_692:0 "밝은 달이 천산 위로 떠오르니, 아득한 구름바다 사이로다"
 motto_fm_buddhist_693:0 "황하는 멀리 흰 구름 사이로 오르고, 외로운 성 하나가 만 길 산 위에 있네"
 motto_fm_buddhist_694:0 "강족의 피리는 어찌하여 버들을 원망하는가, 봄바람은 옥문관을 넘지 못하는데"
 motto_fm_buddhist_695:0 "그대에게 권하노니 다시 한 잔 비우게, 서쪽으로 양관을 나서면 벗이 없으리니"
 motto_fm_buddhist_696:0 "온 세상에 나를 아는 벗이 있으니, 하늘 끝도 이웃과 같도다"
 motto_fm_buddhist_697:0 "앞길에 벗 없을까 걱정 마오, 천하에 누가 그대를 모르리"
 motto_fm_buddhist_698:0 "도화담 물이 천 자나 깊다 해도, 왕륜이 나를 보내는 정에는 미치지 못하네"
 motto_fm_buddhist_699:0 "낙양의 벗들이 혹 묻거든, 한 조각 얼음 같은 마음이 옥병에 있다 하게"
