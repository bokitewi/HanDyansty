 HD_UNIFICATION_FULL_VICTORY:0 "공격자가 방어자 본인이 보유한 작위를 모두 차지하며, 그 휘하 봉신들은 모두 공격자에게 귀속됩니다."
 HD_UNIFICATION_WHITE_PEACE:0 "양측이 군사를 거두고 각자의 영토를 지킵니다. 공격자는 위신이 약간 감소합니다."
 HD_UNIFICATION_DEFEAT:0 "공격자는 패하여 돌아가며 방어자에게 배상금을 지불해야 하고, 위신과 정통성이 모두 감소합니다. 방어자는 위세를 크게 떨칩니다."
 HD_UNIFICATION_REGIONAL_INVALIDATED:0 "공격자가 더 이상 중국 땅을 보유한 독립 천조의 군주가 아니거나, 목표 안에 방어자에게서 빼앗을 땅이 더는 없습니다."
 HD_UNIFICATION_FULL_INVALIDATED:0 "공격자가 더 이상 천하를 호령할 만한 힘이 없거나, 한쪽이 중국 땅을 모두 잃었거나, 방어자가 더 이상 독립 상태가 아닙니다."
