l_korean:
 hd_dong_aftermath.0010.t:0 "궁문의 수비 교대"
 hd_dong_aftermath.0010.desc:0 "궁문 밖의 갑병 소리가 조금 잦아들자, 왕윤이 전각에 들어와 동탁이 죽었다고 아뢰었고, 여포는 섬돌 아래 서 있었으며 그 뒤의 군사들은 호령을 바꾸었다. 그 순간 당신은 며칠째 전각을 짓누르던 숨 막힘이 풀렸다고 거의 믿을 뻔했다.\n\n그러나 이어서 올라온 것은 조정과 군진에 대한 새로운 안배였다. 왕윤이 정무를 주관하고, 여포는 장안 일대의 병력을 장악한다. 사방의 주군들은 동탁이 주살되었다고 해서 인신과 병권을 다시 어전에 바치지는 않았다.\n\n당신은 그들이 하나하나 다 말하기를 듣고, 전각 밖을 바라보았다. 천자를 억누르던 자를 죽이는 것과 천자가 명령을 내릴 수 있게 하는 것은, 알고 보니 같은 일이 아니었다. 지금 먼저 지킬 수 있는 것은 여전히 이 몇 겹의 궁문과, 아직 명을 따르려는 이 사람들뿐이다."
 hd_dong_aftermath.0010.a:0 "먼저 궁성을 안정시키고, 그다음 조정을 도모하리라."
 hd_li_jue_changan_cb:0 "장안 탈취"
 hd_li_jue_changan_cb_name:0 "장안 탈취"
 HD_LI_JUE_CHANGAN_WAR_NAME:0 "이각의 장안 공격전"
 hd_li_jue_event_troops:0 "양주의 옛 부하들"
 hd_li_jue_changan_victory_desc:0 "이각이 경조를 차지하고 장안을 도읍으로 삼습니다. 왕윤과 천자의 경내에 있는 그의 친족과 처첩, 그리고 양녀 초선까지 모두 주살당합니다."
 hd_li_jue_changan_no_victory_desc:0 "이각이 장안을 공략하지 못했습니다."
