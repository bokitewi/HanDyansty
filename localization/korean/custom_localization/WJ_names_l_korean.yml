 WJ_court_taiyiling:0 "태의령"
 WJ_court_taiyiling_desc:0 "$WJ_court_taiyiling$(은)는 자신이 속한 [court|E]의 건강과 안녕을 책임집니다. 이들은 질병을 치료하고 상처를 꿰매기 위해 최선을 다합니다."
 WJ_court_yishi:0 "의사"
 WJ_court_yishi_desc:0 "$WJ_court_yishi$(은)는 자신이 속한 [court|E]의 건강과 안녕을 책임집니다. 이들은 질병을 치료하고 상처를 꿰매기 위해 최선을 다합니다."
 WJ_court_jiayi:0 "가의"
 WJ_court_jiayi_desc:0 "$WJ_court_jiayi$(은)는 자신이 속한 [court|E]의 건강과 안녕을 책임집니다. 이들은 질병을 치료하고 상처를 꿰매기 위해 최선을 다합니다."
 WJ_court_shaofucheng:0 "소부승"
 WJ_court_shaofucheng_desc:0 "$WJ_court_shaofucheng$(은)는 황실의 일상생활에서 중요한 역할을 맡아, 하인들을 관리하고 모든 일이 순조롭게 돌아가도록 합니다."
 WJ_court_taizhongdafu:0 "태중대부"
 WJ_court_taizhongdafu_desc:0 "$WJ_court_taizhongdafu$(은)는 궁정의 모든 아이들의 [education|E](을)를 책임지며, 그 능력이 학생들에게 영향을 줍니다. 아이들은 여전히 자신의 [guardians|E](을)를 둘 수 있습니다."
 WJ_court_jingshi:0 "경사"
 WJ_court_jingshi_desc:0 "$WJ_court_jingshi$(은)는 궁정의 모든 아이들의 [education|E](을)를 책임지며, 그 능력이 학생들에게 영향을 줍니다. 아이들은 여전히 자신의 [guardians|E](을)를 둘 수 있습니다."
 WJ_court_jiashushi:0 "가숙사"
 WJ_court_jiashushi_desc:0 "$WJ_court_jiashushi$(은)는 궁정의 모든 아이들의 [education|E](을)를 책임지며, 그 능력이 학생들에게 영향을 줍니다. 아이들은 여전히 자신의 [guardians|E](을)를 둘 수 있습니다."
 WJ_court_zhongchangshi:0 "중상시"
 WJ_court_zhongchangshi_desc:0 "$WJ_court_zhongchangshi$(은)는 궁정의 환관을 관장하는 신임받는 시종입니다. 하인들과 종실 사이의 일 가운데 환관의 귀를 피해 가는 것은 거의 없습니다."
 WJ_court_muli:0 "목리"
 WJ_court_muli_desc:0 "$WJ_court_muli$(은)는 주군의 위풍당당한 말과 마구간을 책임집니다. 잘 돌본 말은 전장에서도 길 위에서도 쓸모가 있기에, 이 직위의 일은 매우 고됩니다."
 WJ_court_yuzhe:0 "어자"
 WJ_court_yuzhe_desc:0 "$WJ_court_yuzhe$(은)는 황제의 위풍당당한 말과 마구간을 책임집니다. 잘 돌본 말은 전장에서도 길 위에서도 쓸모가 있기에, 이 직위의 일은 매우 고됩니다."
 WJ_court_sanqishilang:0 "산기시랑"
 WJ_court_sanqishilang_desc:0 "$WJ_court_sanqishilang$(은)는 말과 시구에 능한 자로, 주군과 궁정의 모든 이에게 즐거움과 지적 자극, 정서적 경험을 선사합니다."
 WJ_court_wenxue:0 "문학"
 WJ_court_wenxue_desc:0 "$WJ_court_wenxue$(은)는 말과 시구에 능한 자로, 주군과 궁정의 모든 이에게 즐거움과 지적 자극, 정서적 경험을 선사합니다."
 WJ_court_yuegong:0 "낙공"
 WJ_court_yuegong_desc:0 "$WJ_court_yuegong$(은)는 노래와 연주로 주군과 궁정을 즐겁게 하는 예술가입니다."
 WJ_court_yueshi:0 "낙사"
 WJ_court_yueshi_desc:0 "$WJ_court_yueshi$(은)는 노래와 연주로 주군과 궁정을 즐겁게 하는 예술가입니다."
 WJ_court_hubenlang:0 "호분랑"
 WJ_court_hubenlang_desc:0 "$WJ_court_hubenlang$(은)는 어떤 공격자에 대해서도 최후의 방어선입니다. 지키는 사람이 가는 곳이면 어디든 따라가며, 도사린 위험 앞에서 주저 없이 앞을 가로막습니다."
 WJ_court_suwei:0 "숙위"
 WJ_court_suwei_desc:0 "$WJ_court_suwei$(은)는 어떤 공격자에 대해서도 최후의 방어선입니다. 지키는 사람이 가는 곳이면 어디든 따라가며, 도사린 위험 앞에서 주저 없이 앞을 가로막습니다."
 WJ_court_qinwei:0 "친위"
 WJ_court_qinwei_desc:0 "$WJ_court_qinwei$(은)는 어떤 공격자에 대해서도 최후의 방어선입니다. 지키는 사람이 가는 곳이면 어디든 따라가며, 도사린 위험 앞에서 주저 없이 앞을 가로막습니다."
 WJ_court_huyuan:0 "호원"
 WJ_court_huyuan_desc:0 "$WJ_court_huyuan$(은)는 어떤 공격자에 대해서도 최후의 방어선입니다. 지키는 사람이 가는 곳이면 어디든 따라가며, 도사린 위험 앞에서 주저 없이 앞을 가로막습니다."
 WJ_court_guangludafu:0 "광록대부"
 WJ_court_guangludafu_desc:0 "$WJ_court_guangludafu$(은)는 궁정의 도덕적 본보기입니다. 그들의 직분은 몸소 인의를 실천하여 백관의 모범이 되는 것입니다."
 WJ_court_sanqichangshi:0 "산기상시"
 WJ_court_sanqichangshi_desc:0 "$WJ_court_sanqichangshi$(은)는 종실 자제의 교육과 지도라는 중책을 맡아, 다음 세대가 선조가 세운 모범에서 벗어나지 않도록 힘씁니다."
 WJ_court_zhonghujun:0 "중호군"
 WJ_court_zhonghujun_desc:0 "$WJ_court_zhonghujun$(은)는 제국의 동량이자 간성으로, 혁혁한 전공과 도략으로 모든 이의 존경을 받습니다."
 WJ_court_shizhong:0 "시중"
 WJ_court_shizhong_desc:0 "$WJ_court_shizhong$(은)는 군주를 가까이 모시며 자문에 응하고 조정에 참여합니다. 그 기능과 수익은 궁정 직위와 선택한 임무에 따라 정해집니다."
