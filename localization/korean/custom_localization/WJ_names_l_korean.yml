 # 内阁tooltip原生scope：councillor_liege是实际雇主。假定任职接口也支持空席。
 WJ_desc_councillor_chancellor: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_chancellor', SCOPE.sC('councillor_liege'))](은)는 최고위 [minister|E](으)로서 외교를 맡으며, 보통 [grand_secretariat_director|E](을)를 겸합니다.\n\n[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_chancellor', SCOPE.sC('councillor_liege'))](은)는 #V [GetLawGroup('grand_secretariat_laws').GetName]#! [law|E]에 따라 [grand_secretariat_director|E](으)로 지정될 수 있습니다.\n\n$WJ_desc_councillor_chancellor_actions$"
 WJ_desc_councillor_chancellor_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_chancellor', SCOPE.sC('councillor_liege'))](은)는 다음을 할 수 있습니다.\n$BULLET$[GetDecision('favored_movement_consults_heaven_decision').GetName|V] [decision|E] 사용\n$BULLET$[GetDecision('tgp_minister_recruit_courtiers_decision').GetName|V] [decision|E](으)로 모든 유형의 [courtier|E] 소환\n$BULLET$[GetGreatProjectType('minister_compel_religious_uniformity').GetName|V] [great_project|E] 시작\n$BULLET$더 적은 비용으로 특수 #V $influence_meritorious_career_interaction$#! [interaction|E] 선택지 사용#!#!"
 WJ_desc_councillor_chancellor_local: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_chancellor', SCOPE.sC('councillor_liege'))]시부책[realm|E]내외적교제공작적[councillor|E]。"
 WJ_desc_councillor_steward: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_steward', SCOPE.sC('councillor_liege'))]시부책[taxation|E]적[minister|E]，재[treasury|E]사무상보좌[son_of_heaven|E]。\n\n$WJ_desc_councillor_steward_actions$"
 WJ_desc_councillor_steward_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_steward', SCOPE.sC('councillor_liege'))](은)는 다음을 할 수 있습니다.\n$BULLET$#V $celestial_request_treasury_interaction$#!하는 [vassals|E] 지원\n$BULLET$[GetDecision('tgp_suggest_budget_change_decision').GetName|V] [decision|E] 사용\n$BULLET$[GetGreatProjectType('minister_project_conduct_census').GetName|V] [great_project|E] 시작\n$BULLET$#V $pay_treasury_debt_interaction$#! [interaction|E](으)로 [civilian_governors|E]의 [treasury_debt|E](을)를 청산하면 #V “$catalyst_cleared_treasury_debt$”#! [dynastic_cycle_catalyst|E] 발동\n$BULLET$특수 #V $influence_meritorious_career_interaction$#! [interaction|E] 선택지 사용#!#!"
 WJ_desc_councillor_steward_local: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_steward', SCOPE.sC('councillor_liege'))]시부책[domain|E]관리적[councillor|E]，예여[taxation|E]、[culture|E]화[development|E]사무。"
 WJ_desc_councillor_marshal: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_marshal', SCOPE.sC('councillor_liege'))](은)는 부대의 군정 관리를 맡는 [minister|E]입니다. 휘하 [governors|E](이)가 군사 원조를 필요로 할 때, [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_marshal', SCOPE.sC('councillor_liege'))](은)는 무관을 파견해 도울 수 있습니다.\n\n이 조신은 [commander|E](이)가 아니며 군대를 이끌지 않습니다. 그것은 [minister_grand_marshal|E]의 일입니다.\n\n#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_marshal', SCOPE.sC('councillor_liege'))](은)는 다음을 할 수 있습니다.\n$BULLET$#V $celestial_request_military_aid_interaction$#!할 수 있는 [war|E] 중인 [vassals|E]에게 원조 파견\n$BULLET$[military_governors|E]에게 다른 [governors|E]의 [wars|E]에 참전하도록 명령#!#!\n\n$WJ_desc_councillor_marshal_actions$"
 WJ_desc_councillor_marshal_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_marshal', SCOPE.sC('councillor_liege'))](은)는 다음을 할 수 있습니다.\n$BULLET$[war|E] 중에 #V $celestial_request_military_aid_interaction$#!하는 [vassals|E]에게 원군 파견\n$BULLET$[military_governors|E]에게 다른 [governors|E]의 [wars|E]에 참전하도록 명령\n$BULLET$[GetGreatProjectType('minister_project_train_troops').GetName|V] [great_project|E] 시작\n$BULLET$#V $pay_treasury_debt_interaction$#! [interaction|E](으)로 [military_governors|E]의 [treasury_debt|E](을)를 청산하고 #V “$catalyst_cleared_treasury_debt$”#! [dynastic_cycle_catalyst|E] 발동\n$BULLET$특수 #V $influence_meritorious_career_interaction$#! [interaction|E] 선택지 사용#!#!"
 WJ_desc_councillor_marshal_local: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_marshal', SCOPE.sC('councillor_liege'))](은)는 당신의 최고 [commander|E]이자 군사 업무를 총괄하는 [councillor|E]입니다."
 WJ_desc_councillor_spymaster: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_spymaster', SCOPE.sC('councillor_liege'))](은)는 모략과 첩보를 맡는 [minister|E]입니다.\n\n[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_spymaster', SCOPE.sC('councillor_liege'))]의 불충을 경계하십시오. 이들은 당신과 당신의 [close_family|E](을)를 노리는 [schemes|E](을)를 쉽게 숨기거나 심지어 가담할 수도 있습니다!\n\n[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_spymaster', SCOPE.sC('councillor_liege'))](은)는 [GetLawGroup('grand_secretariat_laws').GetName|V] [law|E]에 따라 [grand_secretariat_director|E](으)로 지정될 수 있습니다.\n\n$WJ_desc_councillor_spymaster_actions$"
 WJ_desc_councillor_spymaster_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_spymaster', SCOPE.sC('councillor_liege'))](은)는 다음을 할 수 있습니다.\n$BULLET$#V $censor_find_secrets_interaction$#! [interaction|E](으)로 [vassal|E]의 [courts|E]에서 [secrets|E](을)를 찾아내어, [liege|E]에게서 [gold_i][gold|E] 보상을 받거나 [hooks|E](을)를 얻을 수 있음\n$BULLET$[blackmail|E] 시 #V “$catalyst_minister_blackmailed$”#! [dynastic_cycle_catalyst|E] 발동\n$BULLET$특수 #V $influence_meritorious_career_interaction$#! [interaction|E] 선택지 사용#!#!"
 WJ_desc_councillor_spymaster_local: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_spymaster', SCOPE.sC('councillor_liege'))](은)는 모략과 첩보를 맡는 [councillor|E]입니다. [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_spymaster', SCOPE.sC('councillor_liege'))]의 불충을 경계하십시오. 이들은 당신과 당신의 가까운 가족을 노리는 [GetScheme('murder').GetTypeName](을)를 쉽게 숨기거나 심지어 가담할 수도 있습니다!"
 WJ_desc_councillor_court_chaplain: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_court_chaplain', SCOPE.sC('councillor_liege'))](은)는 종교와 정신적 사무를 맡는 [minister|E]이며, [governors|E](이)가 [examinations|E](을)를 주관하는 것을 도울 수 있습니다.\n\n$WJ_desc_councillor_court_chaplain_actions$"
 WJ_desc_councillor_court_chaplain_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('councillor_court_chaplain', SCOPE.sC('councillor_liege'))](은)는 다음을 할 수 있습니다.\n$BULLET$[GetGreatProjectType('minister_project_culture').GetName|V] [great_project|E] 시작\n$BULLET$[GetGreatProjectType('minister_compel_religious_uniformity').GetName|V] [great_project|E] 시작\n$BULLET$[vassals|E]의 [examinations|E] 개최 지원\n$BULLET$[faith_hostile|E] 또는 [faith_evil|E] [faiths|E]의 [characters|E]에게 #V $demand_conversion_minister_rites_interaction$#!\n$BULLET$특수 #V $influence_meritorious_career_interaction$#! [interaction|E] 선택지 사용#!#!"
 WJ_desc_minister_personnel: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_personnel', SCOPE.sC('councillor_liege'))](은)는 [appointments|E] 업무를 전담하는 [minister|E](으)로, 다른 [characters|E]의 [candidate_score|E]에 큰 영향을 줄 수 있습니다.\n\n$WJ_desc_minister_personnel_actions$"
 WJ_desc_minister_personnel_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_personnel', SCOPE.sC('councillor_liege'))](은)는 다음을 할 수 있습니다.\n$BULLET$[GetLawGroup('celestial_retirement_law').GetName] [law|E](을)를 무시하고 #V $force_governor_removal_interaction$#! [interaction|E](으)로 [governors|E] 해임\n$BULLET$[GetDecision('tgp_minister_recruit_courtiers_decision').GetName|V] [decision|E](으)로 모든 유형의 [courtier|E] 초청\n$BULLET$상대가 #V $offer_courtier_interaction$#! 및 #V $demand_courtier_interaction$#! [interactions|E](을)를 반드시 받아들이게 함\n$BULLET$더 적은 비용으로 특수 #V $influence_meritorious_career_interaction$#! [interaction|E] 선택지 사용#!#!"
 WJ_desc_minister_justice: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_justice', SCOPE.sC('councillor_liege'))](은)는 법률 업무를 맡는 [minister|E](으)로, [son_of_heaven|E](을)를 보좌하여 정의를 지킵니다.\n\n$WJ_desc_minister_justice_actions$"
 WJ_desc_minister_justice_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_justice', SCOPE.sC('councillor_liege'))](은)는 다음을 할 수 있습니다.\n$BULLET$[GetGreatProjectType('minister_project_establish_control').GetName|V] [great_project|E] 시작\n$BULLET$[vassals|E](와)과 [courtiers|E]에게 #V $imprison_interaction$#! [interaction|E] 사용, 상대는 거부할 수 없음\n$BULLET$[crimes|E](을)를 저지른 [characters|E]에게 #V $pardon_interaction$#! [interaction|E] 사용\n$BULLET$$censor_find_secrets_interaction$ [interaction|E](으)로 [vassal|E] [courts|E]에서 [secrets|E](을)를 찾아내고, 알려진 [criminals|E](을)를 [imprison|E]하거나 사면\n$BULLET$[secrets|E] 폭로 시 “$catalyst_minister_exposed_secret$” [dynastic_cycle_catalyst|E] 발동\n$BULLET$특수 #V $influence_meritorious_career_interaction$#! [interaction|E] 선택지 사용#!#!"
 WJ_desc_minister_works: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_works', SCOPE.sC('councillor_liege'))](은)는 [realm|E]의 건설과 발전을 맡는 [minister|E]이며, [great_projects|E](을)를 시작할 수 있습니다.\n\n$WJ_desc_minister_works_actions$"
 WJ_desc_minister_works_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_works', SCOPE.sC('councillor_liege'))](은)는 다음을 할 수 있습니다.\n$BULLET$[GetGreatProjectType('minister_project_development').GetName|V] [great_project|E] 시작\n$BULLET$[GetGreatProjectType('grand_canals').GetName|V] [great_project|E] 시작\n$BULLET$[GetGreatProjectType('great_wall').GetName|V] [great_project|E] 시작\n$BULLET$[realm|E] 안에 [buildings|E](와)과 [holdings|E] 건설 가능\n$BULLET$[GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName] [dynastic_cycle_era_short|E]에는 [son_of_heaven|E]의 [tributaries|E] 영지 안에 [buildings|E](와)과 [holdings|E] 건설 가능\n$BULLET$특수 #V $influence_meritorious_career_interaction$#! [interaction|E] 선택지 사용#!#!"
 WJ_desc_minister_grand_marshal: "[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_grand_marshal', SCOPE.sC('councillor_liege'))](은)는 [realm|E]의 최고 무관으로, [title_men_at_arms|E] [army|E](을)를 지휘합니다.\n\n[SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_grand_marshal', SCOPE.sC('councillor_liege'))](은)는 #V [GetLawGroup('grand_secretariat_laws').GetName]#! [law|E]에 따라 [grand_secretariat_director|E](으)로 지정될 수 있습니다.\n\n$WJ_desc_minister_grand_marshal_actions$"
 WJ_desc_minister_grand_marshal_actions: "#indent_newline:4 #weak [SCOPE.sC('councillor_liege').GetCouncilTitleForPosition('minister_grand_marshal', SCOPE.sC('councillor_liege'))](은)는 다음을 할 수 있습니다.\n$BULLET$#V 개변#! [great_project|E] 시작\n$BULLET$[GetGreatProjectType('construct_great_barracks').GetName|V] [great_project|E] 시작\n$BULLET$[GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName] 및 [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability_conquest').GetName] [dynastic_cycle_eras_short|E]에 #V $CHINA_SEIZE_COUNTY_CB_NAME$#! 및 #V $CHINA_SEIZE_DUCHY_CB_NAME$#! [casus_bellis|E] 사용\n$BULLET$특수 #V $influence_meritorious_career_interaction$#! [interaction|E] 선택지 사용#!#!"

 # 宫廷任务GUI持有明确雇主才用此桥；未知任务及非汉晋保留原描述。
 WJ_court_task_description: "[Select_CString(And(GetScriptedGui('WJ_name_tooltip_hanjin').IsShown(GuiScope.SetRoot(Character.MakeScope).End), Not(ObjectsEqual(Concatenate('WJ_desc_', CourtPositionTaskType.GetKey), Localize(Concatenate('WJ_desc_', CourtPositionTaskType.GetKey))))), Localize(Concatenate('WJ_desc_', CourtPositionTaskType.GetKey)), CourtPositionTaskType.GetDescription)]"
 WJ_desc_court_poet_court_position_task_create_poetry: "당신의 [CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)](은)는 당신과 당신의 영지, 당신의 업적을 찬양하는 아름다운 시를 짓고 낭송합니다."
 WJ_desc_grand_guardian_court_position_task_guard_the_capital: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)]장부책보호제도적안전。"
 WJ_desc_grand_guardian_court_position_task_shield_the_realm: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)](은)는 무공과 도략을 펼쳐 제국 전체를 지킵니다."
 WJ_desc_grand_guardian_court_position_task_instill_martial_discipline: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)](은)는 군대에서 쌓은 경험을 아직 전장에 나가 보지 못한 이들에게 전수하려 애씁니다."
 WJ_desc_grand_mentor_court_position_task_teach_liege: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)]장치력우교육기령주。"
 WJ_desc_grand_mentor_court_position_task_edify_heirs: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)]회치력우배양제국적하일대。"
 WJ_desc_grand_mentor_court_position_task_train_officials: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)](은)는 영지 전역의 관리들이 자신과 같은 지혜와 미덕과 기술을 갖추도록 합니다."
 WJ_desc_grand_preceptor_court_position_task_instill_righteousness: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)](은)는 이 신하들의 주군을 대신하여 그들의 심성을 바로잡습니다."
 WJ_desc_grand_preceptor_court_position_task_propagate_civic_virtue: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)](은)는 일반 백성 사이에 예악의 교화를 퍼뜨리는 일을 맡습니다."
 WJ_desc_grand_preceptor_court_position_task_exalt_imperial_deeds: "[CourtPositionType.CalcTriggeredNameNoTooltip(Character.Self)](으)로서 이 인물의 말에는 깊은 도덕적 힘이 담겨 있어, 많은 이들이 그것을 진리로 여기는 경향이 있습니다."

