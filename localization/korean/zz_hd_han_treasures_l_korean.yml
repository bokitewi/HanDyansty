l_korean:
 han_artifact_sunzi_bingfa_name:0 "《손자병법》 선본"
 han_artifact_sunzi_bingfa_description:0 "손무가 전한 병법 13편으로, 말은 간결하나 뜻은 깊어 춘추 시대 이래로 장수 된 자라면 외워 익히지 않은 이가 없다. 이 선본은 죽간이 가지런하고 명주실로 엮여 있으며, 오래도록 비각에 소장되어 글자가 아직도 새것 같다."
 han_artifact_liutao_name:0 "《육도》 비본"
 han_artifact_liutao_description:0 "태공망이 지었다고 전하며, 문도·무도·용도·호도·표도·견도의 여섯 도로 나라를 다스리고 군사를 부리는 도를 논했다. 병가에서 대대로 베껴 전하며 태공이 남긴 법으로 받드니, 진에 임해 결단할 때 모두 본받을 만하다."
 han_artifact_sanlue_name:0 "《삼략》 비본"
 han_artifact_sanlue_description:0 "황석공이 다리 위에서 장량에게 책을 전했는데, 그것이 바로 이 삼략이라 전한다. 책은 여러 학파의 말을 두루 모아 장수의 지략과 나라 다스림의 요체를 오로지 논했다. 그 내력은 다 상고할 수 없으나, 그 법은 확실히 쓸 만하다."
 han_artifact_simafa_name:0 "《사마법》 고본"
 han_artifact_simafa_description:0 "사마양저가 전한 옛 병법으로, 편장은 이미 절반 넘게 사라졌으나 삼대 군례의 옛 뜻이 아직 남아 있다. 장수가 이를 읽으면, 옛사람들이 인을 근본으로 삼고 의로써 군사를 부린 도를 알 수 있다."
 han_artifact_wuzi_name:0 "《오자》 고본"
 han_artifact_wuzi_description:0 "오기가 위 문후와 병법을 논한 말로, 안으로는 문덕을 닦고 밖으로는 무비를 갖출 것을 주장했다. 장수를 뽑고 병사를 훈련하며 군법을 엄명하게 하는 데 흔히 이 책을 본보기로 삼는다."
 han_artifact_sunbin_bingfa_name:0 "《손빈병법》 잔권"
 han_artifact_sunbin_bingfa_description:0 "손빈의 유저로 오래전에 흩어져 사라졌는데, 이 잔권은 옛 무덤의 부장품 속에서 다시 세상에 나왔다. 끊어진 죽간과 남은 편 사이로 위위구조와 감조유적의 기묘한 계책을 어렴풋이 알아볼 수 있다. 다만 엮은 끈이 썩고 죽간의 먹 자국이 날로 옅어지니, 정리하지 않으면 머지않아 티끌이 될까 두렵다."
 han_artifact_weiliaozi_name:0 "《울료자》 교본"
 han_artifact_weiliaozi_description:0 "울료가 병형과 정령을 논한 책이다. 관에서 편찬한 죽간 위에 옛사람이 붉은 붓으로 글자를 바로잡아 교감기가 정연하다. 군을 다스리는 자가 이를 읽으면, 명령하면 행하고 금하면 그치며 법을 밝히고 영을 살피는 요체를 알 수 있다."
 han_artifact_mengde_xinshu_name:0 "《맹덕신서》"
 han_artifact_mengde_xinshu_description:0 "조조가 여러 병가의 병법을 모으고 평생 군사를 부리며 얻은 바를 더하여 지은 책이다. 죽간 위에는 붉은 비점이 곳곳에 보이니, 한 글자 한 글자가 모두 전장에서 나온 것이다."
 han_artifact_bingfa_24_name:0 "《병법 이십사편》"
 han_artifact_bingfa_24_description:0 "제갈량이 평생 군사를 부린 요체를 총괄하여 24편으로 저술했다. 행군과 포진, 군을 다스리는 법에서부터 팔진도와 목우유마의 제도에 이르기까지 모두 편 곳곳에 흩어져 있다."
 han_artifact_qingnang_shu_name:0 "《청낭서》"
 han_artifact_qingnang_shu_description:0 "화타의 평생 의술이 모두 이곳에 기록되어 있으니, 배를 갈라 장을 씻는 법과 마비산의 처방이 모두 권 안에 있다. 세상에 전하는 본이 드물어, 이를 얻는 자는 신의에게 직접 전수받은 것과 같아 남들이 구하지 못하는 사람도 살릴 수 있다."
 han_artifact_shanghan_zabing_lun_name:0 "《상한잡병론》"
 han_artifact_shanghan_zabing_lun_description:0 "장중경은 종족이 역병으로 많이 죽은 것을 애통해하여, 옛 가르침을 부지런히 구하고 뭇 처방을 널리 모아 이 책을 지었다. 육경을 가리고 병의 기전을 분석하여 처방과 증상이 모두 갖추어져 있으니, 의원이 이 한 권을 얻으면 천금을 얻는 것보다 낫다."
 han_artifact_taiping_qingling_dao_name:0 "《태평청령도》"
 han_artifact_taiping_qingling_dao_description:0 "우길이 전한 도서로, 부적을 태운 물로 병을 고치고 사람들에게 머리를 조아려 허물을 반성하게 가르친다. 강동의 백성들은 이를 신처럼 받들지만, 관부는 요망하게 사람들을 현혹한다고 배척한다. 세상을 구하는 책인지 사람을 현혹하는 책인지는 오로지 누구의 손에 들어가느냐에 달려 있다."
 han_artifact_dunjia_tianshu_name:0 "《둔갑천서》"
 han_artifact_dunjia_tianshu_description:0 "방사들이 비밀리에 전해 온 기서로, 둔갑의 술수와 천문을 추산하여 점치는 법이 실려 있다. 비단 두루마리는 낡았는데, 산속의 은자가 전해 주었다고 한다. 이를 익히면 천기의 한 귀퉁이를 엿볼 수 있으나, 죽음을 부를 수도 있다."
 han_artifact_taiping_yaoshu_name:0 "《태평요술》"
 han_artifact_taiping_yaoshu_description:0 "남화노선이 장각에게 전해 주었다는 천서 세 권으로, 바람과 비를 부르고 부적을 태운 물로 병을 고칠 수 있다고 한다. 장각은 이를 바탕으로 십여 년 동안 도를 전했으니, 청주·서주·유주·기주·형주·양주·연주·예주 여덟 주의 사람들이 너도나도 그를 따랐다."
 han_artifact_shanhaijing_name:0 "《산해경》 이본"
 han_artifact_shanhaijing_description:0 "산천과 초목, 기이한 짐승과 신령을 기록한 옛 책이다. 이 이본은 비각에 소장된 것과 서로 다른 데가 있어, 교서하는 이는 이를 근거로 지리를 고증하고 호사가는 이를 근거로 기이한 이야기를 늘어놓으니, 태사와 방사 모두 이를 보물처럼 여긴다."
 han_artifact_xishu_map_name:0 "서촉 지형도"
 han_artifact_xishu_map_description:0 "익주 관부가 그린 촉 땅 산천의 험하고 평탄함을 담은 지도로, 비단 위에 붉고 검은 먹으로 도로와 관문을 표시했다. 이를 얻은 자는 평지를 걷듯 촉에 들어가고, 이를 잃은 자는 아무리 웅병을 거느려도 촉도를 바라보며 탄식할 수밖에 없다. 비단 지도가 오래되어 먹빛이 점점 옅어진다."
 han_artifact_imperial_seal_name:0 "전국옥새"
 han_artifact_imperial_seal_description:0 "진시황이 만든 나라를 전하는 옥새로, 화씨벽을 다듬어 만들었다고 전하며 위에는 ‘하늘에서 명을 받았으니, 수명이 길고 영원히 번창하리라’는 여덟 글자가 새겨져 있다. 진나라가 망하고 한나라가 일어나자 옥새는 한 왕실로 돌아갔고, 역대 천자가 이를 신명처럼 받들었다. 이 옥새를 쥔 자는 천명이 돌아간 듯하고, 옥새가 제자리를 잃으면 천하가 함께 이를 쫓는다."
 han_artifact_wang_mang_head_name:0 "왕망의 머리"
 han_artifact_wang_mang_head_description:0 "한나라를 찬탈한 왕망의 수급이다. 그 옛날 한나라 군대가 장안에 쳐들어왔을 때 왕망은 점대에서 죽었고, 수급이 완의 저잣거리로 전해지자 백성들이 다투어 던지고 때렸으며, 심지어 그 혀를 잘라 먹은 자도 있었다. 그 뒤 수급은 무고에 보관되어 공자의 나막신, 고조의 참사검과 함께 대대로 전하는 보물로 나란히 놓였으니, 찬역자의 말로를 보여 준다."
 han_artifact_confucius_shoes_name:0 "공자의 나막신"
 han_artifact_confucius_shoes_description:0 "공자가 신었다고 전하는 나막신으로, 성인이 남긴 은택이라 유생들이 이를 보면 숙연해지지 않는 이가 없다. 이 나막신은 무고에 보관되어, 고조의 참사검, 왕망의 머리와 함께 대대로 전하는 보물이 되었다."
 han_artifact_zhou_ding_name:0 "주나라 정"
 han_artifact_zhou_ding_description:0 "주 왕실 종묘의 귀중한 기물로, 도철과 반리 무늬 사이로 명문이 은은히 보이며, 수백 년이 지나도 위엄이 변하지 않았다. 정은 덕에 있지 정 자체에 있지 않으니, 예로부터 정의 무게를 물은 자는 모두 신하의 도리를 지키지 않는 무리였다. 이 정을 얻는 자는 종묘가 빛나고 일족 또한 영광을 누린다."
 han_artifact_heshi_bi_name:0 "화씨벽"
 han_artifact_heshi_bi_description:0 "변화가 형산에서 옥돌을 얻어 세 번이나 초왕에게 바쳤다가 두 번이나 발꿈치를 잘리고서야, 옥돌 속의 옥이 비로소 쪼개져 나왔다. 진왕은 일찍이 열다섯 성과 바꾸기를 원했으나, 끝내 인상여가 구슬을 온전히 조나라로 돌려보냈다. 세상 사람들은 모두 전국옥새가 이 구슬로 다듬어졌다고 말하니, 진위는 상고하기 어려우나 천하의 지극한 보배라는 명성은 오래도록 변하지 않았다."
 han_artifact_four_spirits_mirror_name:0 "사령문 거울"
 han_artifact_four_spirits_mirror_description:0 "거울 뒷면에 청룡, 백호, 주작, 현무 사령의 형상을 주조하고 명문 띠를 둘렀으니, 청동이 영롱하게 빛난다. 당시 사람들은 이 거울로 요괴를 비추어 보고 상서롭지 못한 것을 물리칠 수 있다고 여겼으며, 혼인하는 집에서는 더욱 귀한 예물로 여겼다. 구리 거울은 오래되면 푸른 녹이 슬기 쉬우니, 늘 갈고 닦아야 한다."
 han_artifact_seismograph_name:0 "지동의"
 han_artifact_seismograph_description:0 "양가 원년, 태사령 장형이 후풍지동의를 주조했다. 그 기구는 술독처럼 배가 둥글고, 여덟 마리 용이 구슬을 물고 두꺼비가 이를 받치고 있어, 땅이 흔들리면 용의 입에서 구슬이 떨어져 그 방위를 알려 준다. 한번은 용 한 마리가 구슬을 토했는데 도성에서는 지진을 느끼지 못하여 학자들이 모두 그 징험이 없음을 괴이하게 여겼으나, 며칠 뒤 역사가 도착하여 과연 농서에 지진이 났다고 알리니, 사람들은 그 오묘함에 탄복했다."
 han_artifact_zhinan_che_name:0 "지남거"
 han_artifact_zhinan_che_description:0 "수레 위의 나무 인형이 팔을 뻗어 남쪽을 가리키는데, 수레가 어느 쪽으로 가든, 산을 돌고 길이 굽어도 그 손은 늘 남쪽을 가리킨다. 황제가 이를 만들어 치우가 일으킨 짙은 안개를 깨뜨렸다고 전하며, 역대의 이름난 장인들이 여러 번 본떠 만들려 했으나 성공한 이는 드물다. 기관이 정교하여 비바람에 상하는 것을 가장 꺼린다."
 han_artifact_white_feather_fan_name:0 "백우선"
 han_artifact_white_feather_fan_description:0 "새하얀 깃털에 대나무와 나무로 자루를 단 깃털 부채로, 생김새가 고박하다. 명사가 청담을 나누고 모신이 계책을 세울 때 흔히 이 부채를 들고 천천히 부치며 태연자약하니, 마치 천군만마가 부채질 한 번에 달려 있는 듯하다."
 han_artifact_shenshou_inkstone_name:0 "신수 벼루"
 han_artifact_shenshou_inkstone_description:0 "짐승 모양의 돌벼루로, 조각이 예스럽고 소박하며 먹못이 깊고 넓고 연면이 매끄럽다. 상서대의 낭관과 문사들이 이것으로 조령을 기초하고 전적을 교감하니, 문방의 진품으로 여겨 명사들 사이에서 서로 주고받는다."
 han_artifact_bianzhong_name:0 "편종"
 han_artifact_bianzhong_description:0 "나무틀에 줄지어 매단 한 벌의 청동 편종으로, 크고 작은 종이 차례로 놓였으며 궁상각치우의 음률에 맞추어 주조되었다. 종묘 제사와 궁정 연회에 빠질 수 없는 것이라, 종소리 한 번에 예악이 절로 일어난다. 난세에는 흩어져 떠돌기 쉬워 한 벌을 온전히 갖춘 것은 더욱 귀하다."
 han_artifact_tongque_name:0 "동작"
 han_artifact_tongque_description:0 "업성 동작대 위의 구리 참새. 고개를 들고 날개를 펼쳐 금방이라도 하늘로 날아오를 듯하며, 녹빛이 얼룩졌어도 기상은 웅혼하다. 조조가 장수 가에 누대를 쌓고 올라 시를 지어 천하의 인심이 자신에게 돌아왔음을 드러냈다."
 han_artifact_bronze_chariot_name:0 "동거마"
 han_artifact_bronze_chariot_description:0 "한나라의 거마 제도에 따라 주조한 작은 구리 수레와 말로, 수레의 장식과 바퀴, 끌채가 하나같이 법도에 맞는다. 공경과 열후는 이를 저택에 진열하여 조정 의례의 존엄을 드러냈고, 솜씨 좋은 장인이 만들어 권세가에게 바치거나 주인을 따라 큰 무덤에 묻히기도 했다."
 han_artifact_boshanlu_name:0 "착금 박산로"
 han_artifact_boshanlu_description:0 "뚜껑을 바다 위 선산의 모양으로 주조하고 금을 상감하여 무늬를 낸 향로로, 겹겹이 솟은 봉우리 사이에 연기 구멍이 숨어 있다. 향을 사르면 푸른 연기가 산 사이로 하늘하늘 피어올라 구름과 안개가 봉우리를 감싸는 듯하니, 온 방에 선기가 감도는 듯하다. 연회와 아집에서는 이 향로를 으뜸으로 친다."
 han_artifact_changxin_lamp_name:0 "장신궁등"
 han_artifact_changxin_lamp_description:0 "서경 장신궁에 옛날부터 간직되어 온 도금 구리 등잔. 무릎 꿇고 앉은 궁녀가 등을 받쳐 들었는데, 등잔의 연기가 모두 소매 속으로 들어가 방 안에 퍼지지 않으니 그 기발한 솜씨에 감탄하게 된다. 오랫동안 먼지에 덮였던 옛 궁궐의 것이나, 먼지를 털어 내면 아직도 그 시절 궁궐의 기상이 보인다."
 han_artifact_crane_feather_fan_name:0 "학우선"
 han_artifact_crane_feather_fan_description:0 "잿빛 학의 깃털로 만든 자루 긴 깃털 부채로, 백우선보다 더욱 응축되고 침착한 멋이 있어 장막 안에서 계책을 운용하는 선비가 아니면 어울리지 않는다. 진중에서 천천히 부치며 삼군을 호령하니, 팔이 손가락을 부리듯 자유롭다."
