 hd_form_saved_k_qinzhou_decision_desc:0 "농산 서쪽에서는 천수, 무도 등 여러 군이 산천과 도로를 틀어쥐고 있다. 이곳의 군량과 정령이 더는 제각각 움직이지 않게 하려면, 지도 위의 경계를 한 주의 법도로 바꾸어야 한다."
