 hd_form_saved_k_hezhou_decision:0 "하주 설치"
 hd_form_saved_k_hezhou_decision_desc:0 "금성과 농서의 사자들이 잇달아 뜰 앞에 이르렀으나, 가져온 것은 여전히 각 군의 장부였다. 하주의 여러 군이 한 관서에 속하게 된다면, 강을 따라 늘어선 관문과 나루, 창고와 병역에도 함께 맡아 다스릴 주인이 생길 것이다."
