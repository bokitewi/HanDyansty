l_korean:
 hd_form_saved_k_yongzhou_decision:0 "옹주 설치"
 hd_form_saved_k_yongzhou_decision_desc:0 "안정과 풍익 사이의 군현은 저마다 소속이 있으나, 오가는 문서는 결국 한곳으로 모여야 한다. 이제 여러 군이 차츰 내 손에 들어왔으니, 옹주라는 이름에도 사방을 진정으로 호령하는 주부가 있어야 하리라."
 hd_form_saved_k_yongzhou_decision_tooltip:0 "옛 관할 군들을 통합해 옹주를 설치함"
 hd_form_saved_k_yongzhou_decision_confirm:0 "주를 세우고 제도를 정하라."
 hd_form_saved_k_yongzhou_decision_requirement:0 "옹주를 다스리는 자가 아직 없고, 옛 관할 7개 군 중 최소 6개 군 전역을 당신이 장악하고 있음"
