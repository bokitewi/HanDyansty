 hd_form_saved_k_uuii_bingzhou_decision_desc:0 "변방 군의 급보와 태원의 장부가 책상 위에 나란히 놓여 일깨워 준다. 한 땅을 차지했다고 해서 여러 군이 한마음이 되는 것은 아니라고. 병주의 주부를 내가 세운다면, 이 군정의 일들도 마땅히 돌아갈 곳이 생기리라."
