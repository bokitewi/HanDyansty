l_korean:

 #####三国新增建筑
 building_type_TK_20_10_WaHuangGong: "능묘와 조상의 땅"
 building_type_TK_20_10_WaHuangGong_desc: "선왕과 성현이 잠들어 있거나 제사를 받는 곳으로, 후손들이 때마다 이곳에 와 제사를 올리며 선조의 공덕을 기린다."
 TK_20_10_WaHuangGong: "왜황궁"
 building_TK_20_10_WaHuangGong: "$TK_20_10_WaHuangGong$"
 building_TK_20_10_WaHuangGong_desc: "전하는 말에 여와가 이곳에서 흙을 빚어 사람을 만들고 돌을 녹여 하늘을 기웠다고 하며, 벼랑 사이에는 지금도 그녀의 자취가 남아 있다. 늦봄이 될 때마다 원근의 마을 사람들이 향을 들고 산에 올라, 왜황께 자손과 풍년을 빈다."
 building_type_TK_20_10_FuXiMiao: "능묘와 조상의 땅"
 building_type_TK_20_10_FuXiMiao_desc: "선왕과 성현이 잠들어 있거나 제사를 받는 곳으로, 후손들이 때마다 이곳에 와 제사를 올리며 선조의 공덕을 기린다."
 TK_20_10_FuXiMiao: "복희묘"
 building_TK_20_10_FuXiMiao: "$TK_20_10_FuXiMiao$"
 building_TK_20_10_FuXiMiao_desc: "진 땅은 태호 복희씨의 옛 도읍이라 전해진다. 복희는 팔괘를 그리고 그물을 엮고 혼인의 예를 정하여 인류의 시조로 받들어지니, 정월이 될 때마다 사방 마을의 백성들이 무리 지어 이곳에 와 ‘인종을 뵙는’ 예를 올려 향 연기가 종일 흩어지지 않는다."
 building_type_TK_20_10_HuangDiLing: "능묘와 조상의 땅"
 building_type_TK_20_10_HuangDiLing_desc: "선왕과 성현이 잠들어 있거나 제사를 받는 곳으로, 후손들이 때마다 이곳에 와 제사를 올리며 선조의 공덕을 기린다."
 TK_20_10_HuangDiLing: "황제릉"
 building_TK_20_10_HuangDiLing: "$TK_20_10_HuangDiLing$"
 building_TK_20_10_HuangDiLing_desc: "교산 위에 황제의 무덤이 있다. 전하는 말에 황제가 용을 타고 하늘로 올라가니, 신하들은 하는 수 없이 그 의관만을 이곳에 묻었다고 한다. 효무황제도 북쪽으로 삭방을 순행하고 돌아오는 길에 몸소 산 아래에 와 제사를 올렸다."
 building_type_TK_20_10_YanDiLing: "능묘와 조상의 땅"
 building_type_TK_20_10_YanDiLing_desc: "선왕과 성현이 잠들어 있거나 제사를 받는 곳으로, 후손들이 때마다 이곳에 와 제사를 올리며 선조의 공덕을 기린다."
 TK_20_10_YanDiLing: "염제릉"
 building_TK_20_10_YanDiLing: "$TK_20_10_YanDiLing$"
 building_TK_20_10_YanDiLing_desc: "전하는 말에 염제 신농씨는 온갖 풀을 맛보고 백성에게 농사를 가르쳤으며, 만년에 남방을 순행하다가 이곳에서 붕어하여 묻혔다고 한다. 마을 사람들은 그를 농경의 시조로 받들어, 봄갈이 전에는 반드시 와서 제사를 올린다."
 building_type_TK_20_10_DaYuLing: "능묘와 조상의 땅"
 building_type_TK_20_10_DaYuLing_desc: "선왕과 성현이 잠들어 있거나 제사를 받는 곳으로, 후손들이 때마다 이곳에 와 제사를 올리며 선조의 공덕을 기린다."
 TK_20_10_DaYuLing: "대우릉"
 building_TK_20_10_DaYuLing: "$TK_20_10_DaYuLing$"
 building_TK_20_10_DaYuLing_desc: "대우는 홍수를 다스린 뒤 강남에서 제후들을 모아 공적을 헤아리다가 붕어하여 회계산 아래에 묻혔으니, 산 위에는 우혈이 있다. 태사공은 젊은 시절 회계산에 올라 우혈을 탐방했으며, 월 땅 사람들은 대대로 이곳을 지키며 제사를 받들어 왔다."
 building_type_TK_20_10_MaZuMiao: "능묘와 조상의 땅"
 building_type_TK_20_10_MaZuMiao_desc: "선왕과 성현이 잠들어 있거나 제사를 받는 곳으로, 후손들이 때마다 이곳에 와 제사를 올리며 선조의 공덕을 기린다."
 TK_20_10_MaZuMiao: "마조묘"
 building_TK_20_10_MaZuMiao: "$TK_20_10_MaZuMiao$"
 building_TK_20_10_MaZuMiao_desc: "민 땅 바다 밖에 미주서라는 섬이 있어, 풍랑 사이에 외로이 떠 있다. 오가는 어부들은 이 섬을 바라보며 배를 몰고, 풍랑을 만날 때마다 바다의 신에게 머리를 조아려 무사히 돌아가기를 빈다."
 building_type_TK_20_10_DaHuaiShu: "능묘와 조상의 땅"
 building_type_TK_20_10_DaHuaiShu_desc: "선왕과 성현이 잠들어 있거나 제사를 받는 곳으로, 후손들이 때마다 이곳에 와 제사를 올리며 선조의 공덕을 기린다."
 TK_20_10_DaHuaiShu: "큰 홰나무"
 building_TK_20_10_DaHuaiShu: "$TK_20_10_DaHuaiShu$"
 building_TK_20_10_DaHuaiShu_desc: "하동 분수 가는 요임금의 도읍 평양에 가까워 예로부터 인가가 조밀했다. 마을 어귀의 늙은 홰나무는 하늘을 찌를 듯 솟아 가지와 잎이 일산처럼 드리우니, 오가는 길손들이 흔히 나무 아래서 쉬어 가고, 먼 길 떠나는 이들은 이별할 때면 늘 한 번 돌아보곤 한다."
 building_type_TK_20_10_QianLing: "능묘와 조상의 땅"
 building_type_TK_20_10_QianLing_desc: "선왕과 성현이 잠들어 있거나 제사를 받는 곳으로, 후손들이 때마다 이곳에 와 제사를 올리며 선조의 공덕을 기린다."
 TK_20_10_QianLing: "건릉"
 building_TK_20_10_QianLing: "$TK_20_10_QianLing$"
 building_TK_20_10_QianLing_desc: "양산은 부풍 호치의 북쪽에 있는데, 세 봉우리가 나란히 솟아 북쪽 봉우리가 가장 높고, 남쪽 두 봉우리는 궐문처럼 마주 서 있다. 시황제는 일찍이 이곳에 양산궁을 짓고 올라 먼 곳을 바라보았다."
 building_type_TK_20_20_TianZhaoShenGong: "사원과 신사"
 building_type_TK_20_20_TianZhaoShenGong_desc: "신명을 모시는 곳으로, 향불이 일 년 내내 끊이지 않으며 사방의 신도들이 천 리를 멀다 않고 찾아와 예배한다."
 TK_20_20_TianZhaoShenGong: "천조신궁"
 building_TK_20_20_TianZhaoShenGong: "$TK_20_20_TianZhaoShenGong$"
 building_TK_20_20_TianZhaoShenGong_desc: "바다 동쪽 왜국의 여왕 비미호는 귀도를 섬기며 사람들을 능히 현혹했는데, 나이가 들도록 시집가지 않고 궁 깊숙이 머물러 그를 본 이가 드물었다. 왜인들은 이곳에서 해의 신을 모시며, 나라의 운명이 여기에 달려 있다고 여긴다."
 building_type_TK_20_20_BaiMaSi: "사원과 신사"
 building_type_TK_20_20_BaiMaSi_desc: "신명을 모시는 곳으로, 향불이 일 년 내내 끊이지 않으며 사방의 신도들이 천 리를 멀다 않고 찾아와 예배한다."
 TK_20_20_BaiMaSi: "백마사"
 building_TK_20_20_BaiMaSi: "$TK_20_20_BaiMaSi$"
 building_TK_20_20_BaiMaSi_desc: "효명황제가 밤에 꿈에서 금인을 보고 서쪽으로 사신을 보내 불법을 구하니, 섭마등과 축법란 두 사문을 맞아 백마에 경전을 싣고 낙양에 이르렀고, 이로 인해 이 절을 세웠다. 절에서 번역해 낸 경전은 중원 최초의 부도의 책이다."
 building_type_TK_20_20_FaMenSi: "사원과 신사"
 building_type_TK_20_20_FaMenSi_desc: "신명을 모시는 곳으로, 향불이 일 년 내내 끊이지 않으며 사방의 신도들이 천 리를 멀다 않고 찾아와 예배한다."
 TK_20_20_FaMenSi: "법문사"
 building_TK_20_20_FaMenSi: "$TK_20_20_FaMenSi$"
 building_TK_20_20_FaMenSi_desc: "전하는 말에 부풍 미양 땅에는 부처의 지골 사리가 묻혀 있는데, 이곳은 천축의 아육왕이 사리를 나누어 탑을 세운 곳 가운데 하나라고 한다. 환제와 영제 무렵에 부도의 무리가 이곳에 암자를 짓고 지키니, 당시 사람들은 이를 아육왕사라 불렀다."
 building_type_TK_20_20_ChuYunDaShe: "사원과 신사"
 building_type_TK_20_20_ChuYunDaShe_desc: "신명을 모시는 곳으로, 향불이 일 년 내내 끊이지 않으며 사방의 신도들이 천 리를 멀다 않고 찾아와 예배한다."
 TK_20_20_ChuYunDaShe: "출운대사"
 building_TK_20_20_ChuYunDaShe: "$TK_20_20_ChuYunDaShe$"
 building_TK_20_20_ChuYunDaShe_desc: "왜 땅 출운에서는 국토를 개척하고 저승을 다스리는 대국주신을 모신다. 전설에 따르면 해마다 시월이 되면 뭇 신들이 모두 이곳에 모여 인간 세상의 일을 함께 의논한다고 한다."
 building_type_TK_20_20_HaiYinSi: "사원과 신사"
 building_type_TK_20_20_HaiYinSi_desc: "신명을 모시는 곳으로, 향불이 일 년 내내 끊이지 않으며 사방의 신도들이 천 리를 멀다 않고 찾아와 예배한다."
 TK_20_20_HaiYinSi: "해인사"
 building_TK_20_20_HaiYinSi: "$TK_20_20_HaiYinSi$"
 building_TK_20_20_HaiYinSi_desc: "가야산은 변한 땅에 있으며, 봉우리가 겹겹이 이어지고 숲이 깊고 그윽하다. 삼한의 풍속은 귀신을 공경하여 섬기니, 해마다 씨를 뿌리고 나면 마을 사람들이 산중에 모여 제사를 지내고 노래하고 춤추며 술을 마시기를 밤낮으로 그치지 않는다."
 building_type_TK_20_20_WuDangShanDaoGuan: "사원과 신사"
 building_type_TK_20_20_WuDangShanDaoGuan_desc: "신명을 모시는 곳으로, 향불이 일 년 내내 끊이지 않으며 사방의 신도들이 천 리를 멀다 않고 찾아와 예배한다."
 TK_20_20_WuDangShanDaoGuan: "무당산 도관"
 building_TK_20_20_WuDangShanDaoGuan: "$TK_20_20_WuDangShanDaoGuan$"
 building_TK_20_20_WuDangShanDaoGuan_desc: "무당산의 뭇 봉우리는 천주봉을 향해 읍하듯 둘러서 있고, 바위 골짜기가 깊고 그윽하여 예로부터 방사와 은자들이 이곳에 암자를 짓고 수련했다. 산속의 궁관은 봉우리와 벼랑에 기대어 지어졌고, 종과 경쇠 소리가 종일 숲속에 울려 퍼진다."
 building_type_TK_20_20_ShaoLinSi: "사원과 신사"
 building_type_TK_20_20_ShaoLinSi_desc: "신명을 모시는 곳으로, 향불이 일 년 내내 끊이지 않으며 사방의 신도들이 천 리를 멀다 않고 찾아와 예배한다."
 TK_20_20_ShaoLinSi: "소림사"
 building_TK_20_20_ShaoLinSi: "$TK_20_20_ShaoLinSi$"
 building_TK_20_20_ShaoLinSi_desc: "소실산은 숭고산의 서쪽에 있어 태실산과 나란히 솟아 있는데, 대우의 처제가 이곳에 살았다 하여 이름이 붙었다고 전한다. 봉우리는 깎아지른 듯하고 숲이 무성하여, 은자들이 자주 산에 들어와 도를 닦는다."
 building_type_TK_20_20_LingYinSi: "사원과 신사"
 building_type_TK_20_20_LingYinSi_desc: "신명을 모시는 곳으로, 향불이 일 년 내내 끊이지 않으며 사방의 신도들이 천 리를 멀다 않고 찾아와 예배한다."
 TK_20_20_LingYinSi: "영은사"
 building_TK_20_20_LingYinSi: "$TK_20_20_LingYinSi$"
 building_TK_20_20_LingYinSi_desc: "전당현 서쪽에 무림산이 있어 무림수가 여기서 흘러나온다. 산속에는 봉우리와 바위가 우뚝하고 동굴과 골짜기가 깊으며 숲과 샘이 맑기 그지없으니, 오와 월 사이의 은거 명승지이다."
 building_type_TK_20_20_DaYanTa: "사원과 신사"
 building_type_TK_20_20_DaYanTa_desc: "신명을 모시는 곳으로, 향불이 일 년 내내 끊이지 않으며 사방의 신도들이 천 리를 멀다 않고 찾아와 예배한다."
 TK_20_20_DaYanTa: "대안탑"
 building_TK_20_20_DaYanTa: "$TK_20_20_DaYanTa$"
 building_TK_20_20_DaYanTa_desc: "장안성 동남쪽에는 언덕과 습지가 기복을 이루고, 가까이에 곡강지의 물이 있다. 효무황제는 일찍이 이곳에 의춘원을 짓고, 못가에서 사냥하며 연회를 즐겼다."
 building_type_TK_20_20_XuanKongSi: "사원과 신사"
 building_type_TK_20_20_XuanKongSi_desc: "신명을 모시는 곳으로, 향불이 일 년 내내 끊이지 않으며 사방의 신도들이 천 리를 멀다 않고 찾아와 예배한다."
 TK_20_20_XuanKongSi: "현공사"
 building_TK_20_20_XuanKongSi: "$TK_20_20_XuanKongSi$"
 building_TK_20_20_XuanKongSi_desc: "항산 기슭의 협곡은 깊고 험하여, 양쪽 벼랑이 깎아지른 듯 솟아 있고 골짜기에는 겨우 한 줄기 산길만 나 있다. 북방의 상인과 수자리 병사들이 오가려면 모두 이 협곡을 지나야 한다."
 building_type_TK_20_20_YanDaoShenShe_01: "사원과 신사"
 building_type_TK_20_20_YanDaoShenShe_01_desc: "신명을 모시는 곳으로, 향불이 일 년 내내 끊이지 않으며 사방의 신도들이 천 리를 멀다 않고 찾아와 예배한다."
 TK_20_20_YanDaoShenShe_01: "엄도신사"
 building_TK_20_20_YanDaoShenShe_01: "$TK_20_20_YanDaoShenShe_01$"
 building_TK_20_20_YanDaoShenShe_01_desc: "왜 땅의 내해에 작은 섬 하나가 있는데, 산림이 울창하고 밀물 때면 바닷물이 모래톱 위로 차오른다. 왜인들은 섬 전체를 신명이 사는 곳으로 여겨, 감히 섬에서 밭을 갈거나 나무를 베지 못한다."
 building_type_TK_20_20_YanDaoShenShe_02: "사원과 신사"
 building_type_TK_20_20_YanDaoShenShe_02_desc: "신명을 모시는 곳으로, 향불이 일 년 내내 끊이지 않으며 사방의 신도들이 천 리를 멀다 않고 찾아와 예배한다."
 TK_20_20_YanDaoShenShe_02: "엄도신사 상급"
 building_TK_20_20_YanDaoShenShe_02: "$TK_20_20_YanDaoShenShe_02$"
 building_TK_20_20_YanDaoShenShe_02_desc: "왜 땅의 내해에 작은 섬 하나가 있는데, 산림이 울창하고 밀물 때면 바닷물이 모래톱 위로 차오른다. 왜인들은 섬 전체를 신명이 사는 곳으로 여겨, 감히 섬에서 밭을 갈거나 나무를 베지 못한다."
 building_type_TK_20_20_YiShiShenGong: "사원과 신사"
 building_type_TK_20_20_YiShiShenGong_desc: "신명을 모시는 곳으로, 향불이 일 년 내내 끊이지 않으며 사방의 신도들이 천 리를 멀다 않고 찾아와 예배한다."
 TK_20_20_YiShiShenGong: "이세신궁"
 building_TK_20_20_YiShiShenGong: "$TK_20_20_YiShiShenGong$"
 building_TK_20_20_YiShiShenGong_desc: "왜 땅 동쪽에 맑고 차가운 냇물이 흐르는데, 양쪽 기슭에 숲이 빽빽하다. 전설에 해의 신이 이 깨끗한 땅을 골라 머물렀다 하여, 왜인들은 냇가에서 제사를 받들며 조금이라도 더럽힐까 두려워한다."
 building_type_TK_20_20_HuangLongSi: "사원과 신사"
 building_type_TK_20_20_HuangLongSi_desc: "신명을 모시는 곳으로, 향불이 일 년 내내 끊이지 않으며 사방의 신도들이 천 리를 멀다 않고 찾아와 예배한다."
 TK_20_20_HuangLongSi: "황룡사"
 building_TK_20_20_HuangLongSi: "$TK_20_20_HuangLongSi$"
 building_TK_20_20_HuangLongSi_desc: "진한 사로국 도읍 부근의 평야는 땅이 기름지고 강이 휘감아 흐른다. 진한 사람들은 오곡을 잘 기르고 누에치기와 뽕나무 가꾸기에 밝으며 비단과 베를 짤 줄 아니, 읍락이 대부분 이 일대에 모여 있다."
 building_type_TK_20_20_TianTaiZongSiYuan: "사원과 신사"
 building_type_TK_20_20_TianTaiZongSiYuan_desc: "신명을 모시는 곳으로, 향불이 일 년 내내 끊이지 않으며 사방의 신도들이 천 리를 멀다 않고 찾아와 예배한다."
 TK_20_20_TianTaiZongSiYuan: "천태종 사원"
 building_TK_20_20_TianTaiZongSiYuan: "$TK_20_20_TianTaiZongSiYuan$"
 building_TK_20_20_TianTaiZongSiYuan_desc: "회계 동남쪽의 뭇 산 깊은 곳에 거대한 바위가 땅에서 솟아 있는데, 사방이 깎아지른 절벽이지만 바위 꼭대기는 누대처럼 평평하고 넓다. 꼭대기에 올라 밤하늘을 바라보면 별과 달이 지척에 있는 듯하다."
 building_type_TK_20_20_NanHuaSi: "사원과 신사"
 building_type_TK_20_20_NanHuaSi_desc: "신명을 모시는 곳으로, 향불이 일 년 내내 끊이지 않으며 사방의 신도들이 천 리를 멀다 않고 찾아와 예배한다."
 TK_20_20_NanHuaSi: "남화사"
 building_TK_20_20_NanHuaSi: "$TK_20_20_NanHuaSi$"
 building_TK_20_20_NanHuaSi_desc: "곡강현 남쪽에 조계가 있는데, 시냇물이 맑고 얕으며 양쪽 기슭의 산림이 고요하다. 영남의 더위도 이곳에 이르면 조금 누그러져, 오가는 길손들이 자주 시냇가에서 쉬어 간다."
 building_type_TK_20_20_DaZhaoSi: "사원과 신사"
 building_type_TK_20_20_DaZhaoSi_desc: "신명을 모시는 곳으로, 향불이 일 년 내내 끊이지 않으며 사방의 신도들이 천 리를 멀다 않고 찾아와 예배한다."
 TK_20_20_DaZhaoSi: "대소사"
 building_TK_20_20_DaZhaoSi: "$TK_20_20_DaZhaoSi$"
 building_TK_20_20_DaZhaoSi_desc: "서남쪽 아주 먼 땅에 설산이 고원의 강 골짜기를 감싸 안고 있는데, 토착민들은 소와 양을 쳐서 살아가며 산천과 호수의 신을 공경해 받든다. 중원 사람으로 이곳에 이른 자는 드물어, 그저 그 땅이 몹시 춥고 기이한 것이 많다는 소문만 들릴 뿐이다."
 building_type_TK_20_21_ChangAnCheng: "문화 고도"
 building_type_TK_20_21_ChangAnCheng_desc: "성곽이 오래도록 서 있어 전대의 왕후들이 이곳에 도읍하고 나라를 세웠으니, 저잣거리에는 아직도 옛 풍물이 남아 있다."
 TK_20_21_ChangAnCheng: "장안성"
 building_TK_20_21_ChangAnCheng: "$TK_20_21_ChangAnCheng$"
 building_TK_20_21_ChangAnCheng_desc: "한나라의 서경으로, 고조께서 이곳에 도읍을 정하셨다. 미앙궁과 장락궁 두 궁궐이 우뚝 솟아 있고 여덟 강이 둘러 흐르며, 관중의 기름진 들판이 천 리에 이어져 천부라 일컬어진다. 광무제께서 중흥하여 낙양으로 천도한 뒤로 서경은 더 이상 황제의 거처가 아니게 되었으나, 종묘와 능침이 여전히 남아 있어 삼보는 변함없이 번성하다."
 building_type_TK_20_21_LuoYangCheng: "문화 고도"
 building_type_TK_20_21_LuoYangCheng_desc: "성곽이 오래도록 서 있어 전대의 왕후들이 이곳에 도읍하고 나라를 세웠으니, 저잣거리에는 아직도 옛 풍물이 남아 있다."
 TK_20_21_LuoYangCheng: "낙양성"
 building_TK_20_21_LuoYangCheng: "$TK_20_21_LuoYangCheng$"
 building_TK_20_21_LuoYangCheng_desc: "낙양은 천하의 한가운데 자리하여 북쪽으로 망산에 기대고 남쪽으로 낙수에 임하니, 주공이 낙읍을 건설한 이래로 줄곧 왕자의 도읍이었다. 광무제께서 중흥하여 이곳에 도읍을 정하시니, 남궁과 북궁 두 궁궐이 서로 마주 보고, 사방의 공물과 유학하는 선비들이 이곳으로 몰려든다."
 building_type_TK_20_21_ZiJinCheng: "문화 고도"
 building_type_TK_20_21_ZiJinCheng_desc: "성곽이 오래도록 서 있어 전대의 왕후들이 이곳에 도읍하고 나라를 세웠으니, 저잣거리에는 아직도 옛 풍물이 남아 있다."
 TK_20_21_ZiJinCheng: "자금성"
 building_TK_20_21_ZiJinCheng: "$TK_20_21_ZiJinCheng$"
 building_TK_20_21_ZiJinCheng_desc: "계성은 연나라의 옛 도읍이자 유주의 치소로, 북쪽으로 연산에 기대어 변방 밖에서 중원으로 통하는 관문을 지키니, 호한의 상인과 변경을 지키는 군마가 모두 이곳에 모여든다."
 building_type_TK_20_21_JinGuanCheng: "문화 고도"
 building_type_TK_20_21_JinGuanCheng_desc: "성곽이 오래도록 서 있어 전대의 왕후들이 이곳에 도읍하고 나라를 세웠으니, 저잣거리에는 아직도 옛 풍물이 남아 있다."
 TK_20_21_JinGuanCheng: "금관성"
 building_TK_20_21_JinGuanCheng: "$TK_20_21_JinGuanCheng$"
 building_TK_20_21_JinGuanCheng_desc: "성도는 촉군의 치소로, 장의가 함양의 제도를 본떠 쌓았다고 전한다. 성안에는 비단 짜는 일이 성하여 관부가 금관을 따로 두어 제조를 감독하니, 촉금이 천하에 팔려 나간다. 성 밖에는 수로와 보가 종횡으로 뻗어 있고 기름진 들판이 천 리에 이르니, 가뭄과 홍수도 사람의 뜻대로 다스린다."
 building_type_TK_20_21_GuSuCheng: "문화 고도"
 building_type_TK_20_21_GuSuCheng_desc: "성곽이 오래도록 서 있어 전대의 왕후들이 이곳에 도읍하고 나라를 세웠으니, 저잣거리에는 아직도 옛 풍물이 남아 있다."
 TK_20_21_GuSuCheng: "고소성"
 building_TK_20_21_GuSuCheng: "$TK_20_21_GuSuCheng$"
 building_TK_20_21_GuSuCheng_desc: "오현은 오군의 치소로, 오자서가 오왕 합려의 명을 받아 땅을 살피고 물맛을 보아 이 큰 성을 쌓았다고 전한다. 성 서쪽에 고소대가 있고, 태호의 안개 낀 물결이 곁에 있으며, 물길이 종횡으로 뻗어 배들이 베틀의 북처럼 오간다."
 building_type_TK_20_21_YangZhouCheng: "문화 고도"
 building_type_TK_20_21_YangZhouCheng_desc: "성곽이 오래도록 서 있어 전대의 왕후들이 이곳에 도읍하고 나라를 세웠으니, 저잣거리에는 아직도 옛 풍물이 남아 있다."
 TK_20_21_YangZhouCheng: "양주성"
 building_TK_20_21_YangZhouCheng: "$TK_20_21_YangZhouCheng$"
 building_TK_20_21_YangZhouCheng_desc: "광릉성은 오왕 부차가 쌓은 한성에서 비롯되었으며, 부차는 또 한구를 파서 장강과 회수를 이었다. 고조 때 오왕 유비가 이곳에 도읍하여 바닷물을 끓여 소금을 만들고 산에서 돈을 주조하니, 그 부유함이 동남에서 으뜸이었다."
 building_type_TK_20_21_JingZhouCheng: "문화 고도"
 building_type_TK_20_21_JingZhouCheng_desc: "성곽이 오래도록 서 있어 전대의 왕후들이 이곳에 도읍하고 나라를 세웠으니, 저잣거리에는 아직도 옛 풍물이 남아 있다."
 TK_20_21_JingZhouCheng: "형주성"
 building_TK_20_21_JingZhouCheng: "$TK_20_21_JingZhouCheng$"
 building_TK_20_21_JingZhouCheng_desc: "강릉은 남군의 치소로, 초나라의 옛 도읍 영성에 가깝다. 북쪽으로 한수와 면수를 차지하고 남쪽으로 큰 강에 임하며, 서쪽으로 파촉에 통하고 동쪽으로 오회에 이어지니, 형초의 관문이자 무력을 쓸 만한 땅이다."
 building_type_TK_20_21_ShiTouCheng: "문화 고도"
 building_type_TK_20_21_ShiTouCheng_desc: "성곽이 오래도록 서 있어 전대의 왕후들이 이곳에 도읍하고 나라를 세웠으니, 저잣거리에는 아직도 옛 풍물이 남아 있다."
 TK_20_21_ShiTouCheng: "석두성"
 building_TK_20_21_ShiTouCheng: "$TK_20_21_ShiTouCheng$"
 building_TK_20_21_ShiTouCheng_desc: "말릉은 서쪽으로 큰 강에 임하고, 석두산이 강가에 벽처럼 솟아 있으니, 초 위왕이 일찍이 이곳에 금릉읍을 두었다고 전한다. 산세가 험준하고 아래로 강물이 흘러, 이곳을 차지하면 큰 강의 위아래를 틀어쥘 수 있으니 용병하는 자라면 반드시 다투는 땅이다."
 building_type_TK_20_21_KaiFengHuangCheng: "문화 고도"
 building_type_TK_20_21_KaiFengHuangCheng_desc: "성곽이 오래도록 서 있어 전대의 왕후들이 이곳에 도읍하고 나라를 세웠으니, 저잣거리에는 아직도 옛 풍물이 남아 있다."
 TK_20_21_KaiFengHuangCheng: "개봉 황성"
 building_TK_20_21_KaiFengHuangCheng: "$TK_20_21_KaiFengHuangCheng$"
 building_TK_20_21_KaiFengHuangCheng_desc: "진류의 준의는 전국 시대 위나라의 도성 대량의 옛 땅이다. 위 혜왕이 안읍에서 이곳으로 천도하여 홍구를 파 황하의 물을 끌어오니 성곽이 웅장했으나, 훗날 진나라 장수 왕분이 황하의 물을 끌어 성을 잠기게 하여 함락되었다."
 building_type_TK_20_21_LinAnHuangCheng: "문화 고도"
 building_type_TK_20_21_LinAnHuangCheng_desc: "성곽이 오래도록 서 있어 전대의 왕후들이 이곳에 도읍하고 나라를 세웠으니, 저잣거리에는 아직도 옛 풍물이 남아 있다."
 TK_20_21_LinAnHuangCheng: "임안 황성"
 building_TK_20_21_LinAnHuangCheng: "$TK_20_21_LinAnHuangCheng$"
 building_TK_20_21_LinAnHuangCheng_desc: "전당강 가에 봉황이 날개를 펼친 듯한 산이 있어, 동쪽으로 큰 강에 임하고 북쪽으로 호수를 바라본다. 강의 조수가 밀려들 때마다 그 기세가 천둥 같으니, 마을 사람들은 그것이 오자서의 성난 혼이 물을 몰아 파도를 일으키는 것이라 전한다."
 building_type_TK_20_21_PingYaoGuCheng: "문화 고도"
 building_type_TK_20_21_PingYaoGuCheng_desc: "성곽이 오래도록 서 있어 전대의 왕후들이 이곳에 도읍하고 나라를 세웠으니, 저잣거리에는 아직도 옛 풍물이 남아 있다."
 TK_20_21_PingYaoGuCheng: "평요 고성"
 building_TK_20_21_PingYaoGuCheng: "$TK_20_21_PingYaoGuCheng$"
 building_TK_20_21_PingYaoGuCheng_desc: "평도현성은 주 선왕 때 대장 윤길보가 북쪽으로 험윤을 칠 때 이곳에 군사를 주둔시키고 성을 쌓았다고 전한다. 성벽은 반듯한 네모꼴이고 사방이 평평하고 기름진 들판이니, 분수 동쪽 기슭의 중요한 진이다."
 building_type_TK_20_21_FengDuGuiCheng: "문화 고도"
 building_type_TK_20_21_FengDuGuiCheng_desc: "성곽이 오래도록 서 있어 전대의 왕후들이 이곳에 도읍하고 나라를 세웠으니, 저잣거리에는 아직도 옛 풍물이 남아 있다."
 TK_20_21_FengDuGuiCheng: "풍도 귀성"
 building_TK_20_21_FengDuGuiCheng: "$TK_20_21_FengDuGuiCheng$"
 building_TK_20_21_FengDuGuiCheng_desc: "파군의 평도산은 강가에 솟아 있고 숲이 빽빽하다. 전하는 말에 방사 왕방평과 음장생이 이곳에서 도를 닦아 마침내 신선이 되어 하늘로 올랐다 하며, 밤이면 산속에 음산한 바람이 쏴쏴 불어 마을 사람들은 대개 홀로 다니지 못한다."
 building_type_TK_20_21_LouLanGuGuo: "문화 고도"
 building_type_TK_20_21_LouLanGuGuo_desc: "성곽이 오래도록 서 있어 전대의 왕후들이 이곳에 도읍하고 나라를 세웠으니, 저잣거리에는 아직도 옛 풍물이 남아 있다."
 TK_20_21_LouLanGuGuo: "누란 고국"
 building_TK_20_21_LouLanGuGuo: "$TK_20_21_LouLanGuGuo$"
 building_TK_20_21_LouLanGuGuo_desc: "누란은 염택 서쪽에 있어 서역 남북 두 길의 요충지에 자리하니, 호상의 낙타 대상이 반드시 이곳을 지난다. 효소황제 때 부개자가 누란왕을 베자, 조정은 그 나라의 이름을 선선으로 바꾸었고, 이로부터 한나라에 귀부했다."
 building_type_TK_20_21_JingJueGuCheng: "문화 고도"
 building_type_TK_20_21_JingJueGuCheng_desc: "성곽이 오래도록 서 있어 전대의 왕후들이 이곳에 도읍하고 나라를 세웠으니, 저잣거리에는 아직도 옛 풍물이 남아 있다."
 TK_20_21_JingJueGuCheng: "정절 고성"
 building_TK_20_21_JingJueGuCheng: "$TK_20_21_JingJueGuCheng$"
 building_TK_20_21_JingJueGuCheng_desc: "정절은 서역 남도의 작은 나라로, 왕성은 작은 강가에 자리하고 사방이 모두 유사이다. 나라 안의 호구는 많지 않으나 상인들의 왕래로 꽤 부유했는데, 지금은 이미 선선에 병합되었다."
 building_type_TK_20_21_GaoChangGuCheng: "문화 고도"
 building_type_TK_20_21_GaoChangGuCheng_desc: "성곽이 오래도록 서 있어 전대의 왕후들이 이곳에 도읍하고 나라를 세웠으니, 저잣거리에는 아직도 옛 풍물이 남아 있다."
 TK_20_21_GaoChangGuCheng: "고창 고성"
 building_TK_20_21_GaoChangGuCheng: "$TK_20_21_GaoChangGuCheng$"
 building_TK_20_21_GaoChangGuCheng_desc: "고창벽은 거사전국 경내에 있는데, 지세가 높고 탁 트였으며 사람이 많고 번창하여 이런 이름이 붙었다. 조정은 무기교위를 보내 이곳에서 둔전하며 지키게 하여 서역 북도의 요충을 틀어쥐었다."
 building_type_TK_20_21_GeShengGuCheng: "문화 고도"
 building_type_TK_20_21_GeShengGuCheng_desc: "성곽이 오래도록 서 있어 전대의 왕후들이 이곳에 도읍하고 나라를 세웠으니, 저잣거리에는 아직도 옛 풍물이 남아 있다."
 TK_20_21_GeShengGuCheng: "흘승골성"
 building_TK_20_21_GeShengGuCheng: "$TK_20_21_GeShengGuCheng$"
 building_TK_20_21_GeShengGuCheng_desc: "고구려의 시조 주몽은 부여에서 남쪽으로 달아나 졸본천 가에 나라를 세우고 왕을 칭했으며, 이 산 위에 성을 쌓았다. 성은 산세를 따라 지어져 사방이 험준하니, 지키기는 쉽고 공격하기는 어렵다."
 building_type_TK_20_21_MingTiePeiGuCheng: "문화 고도"
 building_type_TK_20_21_MingTiePeiGuCheng_desc: "성곽이 오래도록 서 있어 전대의 왕후들이 이곳에 도읍하고 나라를 세웠으니, 저잣거리에는 아직도 옛 풍물이 남아 있다."
 TK_20_21_MingTiePeiGuCheng: "명철패 고성"
 building_TK_20_21_MingTiePeiGuCheng: "$TK_20_21_MingTiePeiGuCheng$"
 building_TK_20_21_MingTiePeiGuCheng_desc: "대완 경내에서 가장 큰 성읍으로, 성곽이 견고하고 거리와 공방이 질서정연하다. 대완에는 좋은 말이 많아 한혈천마가 바로 이곳에서 나니, 효무황제는 일찍이 이사장군을 보내 멀리 원정하여 그 좋은 말을 빼앗아 돌아오게 했다."
 building_type_TK_20_21_AiLaoGuGuo: "문화 고도"
 building_type_TK_20_21_AiLaoGuGuo_desc: "성곽이 오래도록 서 있어 전대의 왕후들이 이곳에 도읍하고 나라를 세웠으니, 저잣거리에는 아직도 옛 풍물이 남아 있다."
 TK_20_21_AiLaoGuGuo: "애뢰 고국"
 building_TK_20_21_AiLaoGuGuo: "$TK_20_21_AiLaoGuGuo$"
 building_TK_20_21_AiLaoGuGuo_desc: "전하는 말에 애뢰이의 시조모 사일이 물속에서 가라앉은 나무에 닿아 잉태하여 열 아들을 낳았는데, 막내아들 구륭이 왕으로 추대되었다고 한다. 효명황제 때 애뢰왕 유모가 무리를 이끌고 귀부하자, 조정은 그 땅에 영창군을 설치했다."
 building_type_TK_20_21_WuGeKu: "문화 고도"
 building_type_TK_20_21_WuGeKu_desc: "성곽이 오래도록 서 있어 전대의 왕후들이 이곳에 도읍하고 나라를 세웠으니, 저잣거리에는 아직도 옛 풍물이 남아 있다."
 TK_20_21_WuGeKu: "앙코르 와트"
 building_TK_20_21_WuGeKu: "$TK_20_21_WuGeKu$"
 building_TK_20_21_WuGeKu_desc: "남해 밖에 부남국이 있는데, 나라 안의 큰 호수가 넓디넓어 여름과 가을 비가 많이 올 때마다 호숫물이 거꾸로 불어나 물고기와 새우가 매우 풍성하다. 전하는 말에 그 개국 군주 혼전은 바다를 건너와 여왕 유엽을 아내로 맞아 이로부터 나라를 세웠다고 한다."
 building_type_TK_20_21_GongShanCheng: "문화 고도"
 building_type_TK_20_21_GongShanCheng_desc: "성곽이 오래도록 서 있어 전대의 왕후들이 이곳에 도읍하고 나라를 세웠으니, 저잣거리에는 아직도 옛 풍물이 남아 있다."
 TK_20_21_GongShanCheng: "공산성"
 building_TK_20_21_GongShanCheng: "$TK_20_21_GongShanCheng$"
 building_TK_20_21_GongShanCheng_desc: "마한 땅에 강을 낀 산등성이 하나가 있는데, 강물이 산을 감돌아 흐르고 산세가 가파르다. 마한의 여러 나라는 산과 바다 사이에 흩어져 살며 저마다 우두머리를 두고 있으니, 이곳은 높은 데서 물을 내려다보는 자리라 지키기에 알맞은 곳이다."
 building_type_TK_20_21_PingAnJing: "문화 고도"
 building_type_TK_20_21_PingAnJing_desc: "성곽이 오래도록 서 있어 전대의 왕후들이 이곳에 도읍하고 나라를 세웠으니, 저잣거리에는 아직도 옛 풍물이 남아 있다."
 TK_20_21_PingAnJing: "평안경"
 building_TK_20_21_PingAnJing: "$TK_20_21_PingAnJing$"
 building_TK_20_21_PingAnJing_desc: "왜 땅에 사방의 산이 둘러싼 평평한 들이 있는데, 몇 줄기 강물이 산 사이에서 흘러나오고 땅이 평평하고 넓어 농사짓기에 알맞으니, 왜인들의 읍락이 그 사이에 흩어져 있다."
 building_type_TK_20_21_ShengLongHuangCheng01: "문화 고도"
 building_type_TK_20_21_ShengLongHuangCheng01_desc: "성곽이 오래도록 서 있어 전대의 왕후들이 이곳에 도읍하고 나라를 세웠으니, 저잣거리에는 아직도 옛 풍물이 남아 있다."
 TK_20_21_ShengLongHuangCheng01: "승룡성"
 building_TK_20_21_ShengLongHuangCheng01: "$TK_20_21_ShengLongHuangCheng01$"
 building_TK_20_21_ShengLongHuangCheng01_desc: "교지군의 치소는 큰 강가에 자리하여 지세가 평탄하고 벼가 한 해에 두 번 익는다. 난을 피해 남쪽으로 내려온 중원의 선비들이 대개 이곳에 몸을 의탁하니, 성안에는 문교의 기풍이 꽤 있다."
 building_type_TK_20_21_ShengLongHuangCheng02: "문화 고도"
 building_type_TK_20_21_ShengLongHuangCheng02_desc: "성곽이 오래도록 서 있어 전대의 왕후들이 이곳에 도읍하고 나라를 세웠으니, 저잣거리에는 아직도 옛 풍물이 남아 있다."
 TK_20_21_ShengLongHuangCheng02: "승룡 황성"
 building_TK_20_21_ShengLongHuangCheng02: "$TK_20_21_ShengLongHuangCheng02$"
 building_TK_20_21_ShengLongHuangCheng02_desc: "교지군의 치소는 큰 강가에 자리하여 지세가 평탄하고 벼가 한 해에 두 번 익는다. 난을 피해 남쪽으로 내려온 중원의 선비들이 대개 이곳에 몸을 의탁하니, 성안에는 문교의 기풍이 꽤 있다."
 building_type_TK_20_22_DaWenKouYiZhi: "촌락 유적"
 building_type_TK_20_22_DaWenKouYiZhi_desc: "상고 시대 선민들이 모여 살던 옛터로, 무성한 풀숲 사이에서 질그릇과 석기가 자주 파내어지니, 노인들은 아득한 옛사람들이 남긴 것이라 전한다."
 TK_20_22_DaWenKouYiZhi: "대문구 유적"
 building_TK_20_22_DaWenKouYiZhi: "$TK_20_22_DaWenKouYiZhi$"
 building_TK_20_22_DaWenKouYiZhi_desc: "문수 가의 높은 언덕에서 마을 사람들이 밭을 갈다 보면 옛 질그릇과 돌도끼가 자주 나오는데, 생김새가 오늘날의 기물과 사뭇 다르다. 노인들은 이곳이 상고 시대 선민들이 모여 살고 묻히던 곳이라 전한다."
 building_type_TK_20_22_BanPoYiZhi: "촌락 유적"
 building_type_TK_20_22_BanPoYiZhi_desc: "상고 시대 선민들이 모여 살던 옛터로, 무성한 풀숲 사이에서 질그릇과 석기가 자주 파내어지니, 노인들은 아득한 옛사람들이 남긴 것이라 전한다."
 TK_20_22_BanPoYiZhi: "반파 유적"
 building_TK_20_22_BanPoYiZhi: "$TK_20_22_BanPoYiZhi$"
 building_TK_20_22_BanPoYiZhi_desc: "산수 동쪽 기슭의 언덕에서는 이따금 둥근 집터와 채색 질그릇이 출토된다. 장안의 노인들은 이것이 삼대보다도 훨씬 이전 선민들의 마을이라고 말한다."
 building_type_TK_20_22_HeMuDuYiZhi: "촌락 유적"
 building_type_TK_20_22_HeMuDuYiZhi_desc: "상고 시대 선민들이 모여 살던 옛터로, 무성한 풀숲 사이에서 질그릇과 석기가 자주 파내어지니, 노인들은 아득한 옛사람들이 남긴 것이라 전한다."
 TK_20_22_HeMuDuYiZhi: "하모도 유적"
 building_TK_20_22_HeMuDuYiZhi: "$TK_20_22_HeMuDuYiZhi$"
 building_TK_20_22_HeMuDuYiZhi_desc: "회계 여요강 가의 낮은 땅에서는 마을 사람들이 땅을 파다 보면 썩은 나무 말뚝과 새까맣게 탄 볍씨, 뼈로 만든 도구가 층층이 쌓여 있는 것을 자주 보게 되니, 아마도 상고 시대 월나라 사람들의 집터가 남은 것인 듯하다."
 building_type_TK_20_22_ShiGangPingYuan: "촌락 유적"
 building_type_TK_20_22_ShiGangPingYuan_desc: "상고 시대 선민들이 모여 살던 옛터로, 무성한 풀숲 사이에서 질그릇과 석기가 자주 파내어지니, 노인들은 아득한 옛사람들이 남긴 것이라 전한다."
 TK_20_22_ShiGangPingYuan: "석항 평원"
 building_TK_20_22_ShiGangPingYuan: "$TK_20_22_ShiGangPingYuan$"
 building_TK_20_22_ShiGangPingYuan_desc: "서남이 너머 깊은 산속에 고원이 하나 있는데, 거대한 돌 항아리들이 온 땅에 흩어져 있어 큰 것은 여러 사람이 들어갈 만하다. 토착민들은 옛날 거인들이 술을 빚던 것이라 말하지만, 누가 깎아 만들었는지는 이제 아무도 모른다."
 building_type_TK_20_23_BaiLuDongShuYuan: "서원과 학궁"
 building_type_TK_20_23_BaiLuDongShuYuan_desc: "학자들이 제자를 모아 강학하던 곳으로, 경전이 서가에 가득하고 사방의 선비들이 책 상자를 지고 찾아온다."
 TK_20_23_BaiLuDongShuYuan: "백록동서원"
 building_TK_20_23_BaiLuDongShuYuan: "$TK_20_23_BaiLuDongShuYuan$"
 building_TK_20_23_BaiLuDongShuYuan_desc: "여산 오로봉의 남쪽 기슭은 사방의 산이 둘러싸고 시냇물이 맑고 그윽하며 속세의 번잡함에서 멀리 떨어져 있으니, 은사가 글을 읽고 강학하기에 더없이 좋은 곳이다."
 building_type_TK_20_23_ShiGuShuYuan: "서원과 학궁"
 building_type_TK_20_23_ShiGuShuYuan_desc: "학자들이 제자를 모아 강학하던 곳으로, 경전이 서가에 가득하고 사방의 선비들이 책 상자를 지고 찾아온다."
 TK_20_23_ShiGuShuYuan: "석고서원"
 building_TK_20_23_ShiGuShuYuan: "$TK_20_23_ShiGuShuYuan$"
 building_TK_20_23_ShiGuShuYuan_desc: "증수와 상수가 이곳에서 합류하며, 강가의 산 하나가 돌북처럼 생겨 삼면이 물에 닿아 있다. 마을 사람들은 산 위의 돌북이 전란이 일어나려 할 때마다 저절로 울린다고 전한다."
 building_type_TK_20_23_CuLaiShuYuan: "서원과 학궁"
 building_type_TK_20_23_CuLaiShuYuan_desc: "학자들이 제자를 모아 강학하던 곳으로, 경전이 서가에 가득하고 사방의 선비들이 책 상자를 지고 찾아온다."
 TK_20_23_CuLaiShuYuan: "조래서원"
 building_TK_20_23_CuLaiShuYuan: "$TK_20_23_CuLaiShuYuan$"
 building_TK_20_23_CuLaiShuYuan_desc: "조래산은 태산과 남북으로 마주 보고 있으며, 산속의 소나무와 측백나무가 푸르디푸르다. 《시경》에서 노나라 사람들이 기린 ‘조래의 소나무’가 바로 이곳에서 났다. 산중의 거처가 고요하여 문을 닫고 학문하기에 알맞다."
 building_type_TK_20_23_LiZeShuYuan: "서원과 학궁"
 building_type_TK_20_23_LiZeShuYuan_desc: "학자들이 제자를 모아 강학하던 곳으로, 경전이 서가에 가득하고 사방의 선비들이 책 상자를 지고 찾아온다."
 TK_20_23_LiZeShuYuan: "여택서원"
 building_TK_20_23_LiZeShuYuan: "$TK_20_23_LiZeShuYuan$"
 building_TK_20_23_LiZeShuYuan_desc: "회계 서부의 산수 사이에 두 호수가 이어져 물빛이 서로 비춘다. 《주역》에 ‘두 못이 붙어 있는 것이 태괘이니, 군자는 이로써 벗과 함께 강습한다’고 했으니, 두 못이 서로 붙어 서로를 적셔 주는 모습이 벗들이 모여 학문을 갈고닦는 뜻과 꼭 맞는다."
 building_type_TK_20_23_MaoShanShuYuan: "서원과 학궁"
 building_type_TK_20_23_MaoShanShuYuan_desc: "학자들이 제자를 모아 강학하던 곳으로, 경전이 서가에 가득하고 사방의 선비들이 책 상자를 지고 찾아온다."
 TK_20_23_MaoShanShuYuan: "모산서원"
 building_TK_20_23_MaoShanShuYuan: "$TK_20_23_MaoShanShuYuan$"
 building_TK_20_23_MaoShanShuYuan_desc: "구곡산은 모영, 모고, 모충 세 형제가 도를 닦아 신선이 된 곳이라 전하여, 삼모산이라고도 부른다. 산속이 맑고 그윽하여 도인과 글 읽는 이들이 모두 이곳에 암자를 짓기를 좋아한다."
 building_type_TK_20_23_JiXiaXueGong: "서원과 학궁"
 building_type_TK_20_23_JiXiaXueGong_desc: "학자들이 제자를 모아 강학하던 곳으로, 경전이 서가에 가득하고 사방의 선비들이 책 상자를 지고 찾아온다."
 TK_20_23_JiXiaXueGong: "직하학궁"
 building_TK_20_23_JiXiaXueGong: "$TK_20_23_JiXiaXueGong$"
 building_TK_20_23_JiXiaXueGong_desc: "제나라 도성 임치의 직문 아래에서 선왕 때 천하의 문학하는 선비와 유세객들을 널리 불러 모았으니, 추연, 순우곤, 전병, 순경 등이 모두 이곳에서 논쟁하고 강학했다. 그들은 실무를 맡지 않고 국정을 논했으니, 직하 선생이라 불렸다."
 building_type_TK_20_23_JiXianShuYuan: "서원과 학궁"
 building_type_TK_20_23_JiXianShuYuan_desc: "학자들이 제자를 모아 강학하던 곳으로, 경전이 서가에 가득하고 사방의 선비들이 책 상자를 지고 찾아온다."
 TK_20_23_JiXianShuYuan: "집현서원"
 building_TK_20_23_JiXianShuYuan: "$TK_20_23_JiXianShuYuan$"
 building_TK_20_23_JiXianShuYuan_desc: "궁중에서 도서를 소장하는 곳으로, 천하의 비서가 이곳에 모이니 박학한 선비들이 여기서 경전을 교감하고 사서를 편찬하며, 촛불이 밤새 꺼지지 않는 일이 잦다."
 building_type_TK_20_23_NiShanShuYuan: "서원과 학궁"
 building_type_TK_20_23_NiShanShuYuan_desc: "학자들이 제자를 모아 강학하던 곳으로, 경전이 서가에 가득하고 사방의 선비들이 책 상자를 지고 찾아온다."
 TK_20_23_NiShanShuYuan: "니산서원"
 building_TK_20_23_NiShanShuYuan: "$TK_20_23_NiShanShuYuan$"
 building_TK_20_23_NiShanShuYuan_desc: "노나라 창평향의 니구산은 공자의 부모가 산속에서 기도하여 공자를 얻었다고 전하는 곳이라, 공자의 이름은 구, 자는 중니가 되었다. 노 땅의 유생들이 자주 이곳에 와서 우러러 참배한다."
 building_type_TK_20_23_SongYangShuYuan: "서원과 학궁"
 building_type_TK_20_23_SongYangShuYuan_desc: "학자들이 제자를 모아 강학하던 곳으로, 경전이 서가에 가득하고 사방의 선비들이 책 상자를 지고 찾아온다."
 TK_20_23_SongYangShuYuan: "숭양서원"
 building_TK_20_23_SongYangShuYuan: "$TK_20_23_SongYangShuYuan$"
 building_TK_20_23_SongYangShuYuan_desc: "태실산 남쪽 기슭에는 오래된 측백나무가 하늘을 찌를 듯 솟아 있다. 전하는 말에 효무황제가 숭고산을 유람할 때 이 측백나무가 크고 우람한 것을 보고 장군으로 봉했다 하여, 마을 사람들은 지금도 장군백이라 부른다."
 building_type_TK_20_23_YuLuShuYuan: "서원과 학궁"
 building_type_TK_20_23_YuLuShuYuan_desc: "학자들이 제자를 모아 강학하던 곳으로, 경전이 서가에 가득하고 사방의 선비들이 책 상자를 지고 찾아온다."
 TK_20_23_YuLuShuYuan: "악록서원"
 building_TK_20_23_YuLuShuYuan: "$TK_20_23_YuLuShuYuan$"
 building_TK_20_23_YuLuShuYuan_desc: "임상성에서 상수 너머 서쪽을 바라보면 숲이 푸르디푸른 산이 있으니, 남악 형산의 남은 줄기라 하여 악록이라 부른다. 산 앞으로는 상수가 북쪽으로 흘러가고, 귤주가 강 한가운데 가로누워 있다."
 building_type_TK_20_23_YingTianShuYuan: "서원과 학궁"
 building_type_TK_20_23_YingTianShuYuan_desc: "학자들이 제자를 모아 강학하던 곳으로, 경전이 서가에 가득하고 사방의 선비들이 책 상자를 지고 찾아온다."
 TK_20_23_YingTianShuYuan: "응천서원"
 building_TK_20_23_YingTianShuYuan: "$TK_20_23_YingTianShuYuan$"
 building_TK_20_23_YingTianShuYuan_desc: "양국의 수양은 옛날 양 효왕이 궁실과 원유를 크게 짓고 토원을 쌓아 사방의 호걸을 불러 모은 곳으로, 매승, 사마상여, 추양 등 명사들이 모두 이곳에서 부를 짓고 노닐며 잔치를 즐겼다."
 building_type_TK_20_23_AnDingShuYuan: "서원과 학궁"
 building_type_TK_20_23_AnDingShuYuan_desc: "학자들이 제자를 모아 강학하던 곳으로, 경전이 서가에 가득하고 사방의 선비들이 책 상자를 지고 찾아온다."
 TK_20_23_AnDingShuYuan: "안정서원"
 building_TK_20_23_AnDingShuYuan: "$TK_20_23_AnDingShuYuan$"
 building_TK_20_23_AnDingShuYuan_desc: "광릉 동쪽 경계의 해릉은 바닷가에 가까워 본디 소금을 굽는 이익이 있고 창고가 풍족하니, 오왕 유비 때 이미 ‘해릉의 창고’라는 명성이 있었다."
 building_type_TK_20_23_WanSongShuYuan: "서원과 학궁"
 building_type_TK_20_23_WanSongShuYuan_desc: "학자들이 제자를 모아 강학하던 곳으로, 경전이 서가에 가득하고 사방의 선비들이 책 상자를 지고 찾아온다."
 TK_20_23_WanSongShuYuan: "만송서원"
 building_TK_20_23_WanSongShuYuan: "$TK_20_23_WanSongShuYuan$"
 building_TK_20_23_WanSongShuYuan_desc: "전당성 남쪽의 산마루에는 소나무 숲이 끝없이 이어져, 바람이 불면 솔바람 소리가 바다와 같다. 고개 아래의 호수와 큰 강이 멀리 마주 보고, 산중 거처가 맑고 그윽하여 글 읽기에 알맞다."
 building_type_TK_20_23_EHuShuYuan: "서원과 학궁"
 building_type_TK_20_23_EHuShuYuan_desc: "학자들이 제자를 모아 강학하던 곳으로, 경전이 서가에 가득하고 사방의 선비들이 책 상자를 지고 찾아온다."
 TK_20_23_EHuShuYuan: "아호서원"
 building_TK_20_23_EHuShuYuan: "$TK_20_23_EHuShuYuan$"
 building_TK_20_23_EHuShuYuan_desc: "파양 동남쪽의 뭇 산 가운데 한 산이 있는데, 산꼭대기에 호수가 있고 사방에 숲이 울창하며 구름이 감돌아 인적이 드무니, 은거하며 강학하기에 맑고 그윽한 곳이다."
 building_type_TK_20_23_LiZhengShuYuan: "서원과 학궁"
 building_type_TK_20_23_LiZhengShuYuan_desc: "학자들이 제자를 모아 강학하던 곳으로, 경전이 서가에 가득하고 사방의 선비들이 책 상자를 지고 찾아온다."
 TK_20_23_LiZhengShuYuan: "여정서원"
 building_TK_20_23_LiZhengShuYuan: "$TK_20_23_LiZhengShuYuan$"
 building_TK_20_23_LiZhengShuYuan_desc: "궁중에서 책을 편찬하는 곳으로, 《주역》의 ‘거듭 밝음으로써 바름에 붙는다’는 뜻을 취해 이름 지었다. 학사들은 이곳에서 흩어진 책을 찾아 모으고 전적을 교정하여 천자의 자문에 대비한다."
 building_type_TK_20_24_YangGuangDaJinTa: "이름난 건축 유적"
 building_type_TK_20_24_YangGuangDaJinTa_desc: "널리 이름난 누각 고적으로, 지나가는 길손들이 이곳에 이르면 발길을 멈추고 바라보지 않는 이가 없다."
 TK_20_24_YangGuangDaJinTa: "양곤 대금탑"
 building_TK_20_24_YangGuangDaJinTa: "$TK_20_24_YangGuangDaJinTa$"
 building_TK_20_24_YangGuangDaJinTa_desc: "남해 바닷가의 작은 산 위에, 부처가 살아 계실 때 상인 형제 둘이 천축에서 부처의 머리카락을 가져와 이곳에 모셨다고 전한다. 토착민들은 이곳을 성지로 받드니, 원근의 참배객이 줄을 잇는다."
 building_type_TK_20_24_WuHouCi: "이름난 건축 유적"
 building_type_TK_20_24_WuHouCi_desc: "널리 이름난 누각 고적으로, 지나가는 길손들이 이곳에 이르면 발길을 멈추고 바라보지 않는 이가 없다."
 TK_20_24_WuHouCi: "무후사"
 building_TK_20_24_WuHouCi: "$TK_20_24_WuHouCi$"
 building_TK_20_24_WuHouCi_desc: "금관성 남쪽에는 오래된 측백나무가 빽빽하다. 촉 사람들은 이곳에 사당을 세워 몸을 굽혀 온 힘을 다한 한 어진 재상을 모시니, 사철 향불이 끊이지 않고 선비와 백성들이 이곳에 이르면 숙연해지지 않는 이가 없다."
 building_type_TK_20_24_YingXianMuTa: "이름난 건축 유적"
 building_type_TK_20_24_YingXianMuTa_desc: "널리 이름난 누각 고적으로, 지나가는 길손들이 이곳에 이르면 발길을 멈추고 바라보지 않는 이가 없다."
 TK_20_24_YingXianMuTa: "응현 목탑"
 building_TK_20_24_YingXianMuTa: "$TK_20_24_YingXianMuTa$"
 building_TK_20_24_YingXianMuTa_desc: "안문군 남쪽 경계의 강 골짜기 평야는 지세가 평탄하고 넓으며, 북쪽으로 장성을 바라보고 남쪽으로 항산에 기대어 있어, 남하하는 호인 기병과 북쪽으로 나가는 변방 군대가 모두 지나야 하는 곳이다."
 building_type_TK_20_24_ZhaoZhouQiao: "이름난 건축 유적"
 building_type_TK_20_24_ZhaoZhouQiao_desc: "널리 이름난 누각 고적으로, 지나가는 길손들이 이곳에 이르면 발길을 멈추고 바라보지 않는 이가 없다."
 TK_20_24_ZhaoZhouQiao: "조주교"
 building_TK_20_24_ZhaoZhouQiao: "$TK_20_24_ZhaoZhouQiao$"
 building_TK_20_24_ZhaoZhouQiao_desc: "상산 평극성 남쪽으로 효수가 흐르는데, 물살은 크지 않으나 여름과 가을에 물이 불어나면 나루의 다리를 자주 쓸어 가 버려, 오가는 사람들은 하는 수 없이 물을 건너 지나간다."
 building_type_TK_20_24_FaShiLvGuan: "이름난 건축 유적"
 building_type_TK_20_24_FaShiLvGuan_desc: "널리 이름난 누각 고적으로, 지나가는 길손들이 이곳에 이르면 발길을 멈추고 바라보지 않는 이가 없다."
 TK_20_24_FaShiLvGuan: "법사 여관"
 building_TK_20_24_FaShiLvGuan: "$TK_20_24_FaShiLvGuan$"
 building_TK_20_24_FaShiLvGuan_desc: "왜 땅 북쪽의 산속에서 온천이 솟아나는데, 샘물이 따뜻하여 토착민들은 병을 고치고 질병을 물리칠 수 있다고 믿으니, 먼 길을 찾아온 이들이 자주 샘가에서 묵으며 목욕을 한다."
 building_type_TK_20_24_GuangZhouFanFang: "이름난 건축 유적"
 building_type_TK_20_24_GuangZhouFanFang_desc: "널리 이름난 누각 고적으로, 지나가는 길손들이 이곳에 이르면 발길을 멈추고 바라보지 않는 이가 없다."
 TK_20_24_GuangZhouFanFang: "광주 번방"
 building_TK_20_24_GuangZhouFanFang: "$TK_20_24_GuangZhouFanFang$"
 building_TK_20_24_GuangZhouFanFang_desc: "번우는 남해군의 치소로, 큰 바다에 닿아 있는 영남의 도회이다. 무소뿔, 상아, 대모, 진주 등 해외의 진귀한 물건이 대부분 이곳에서 모이고 흩어지니, 호상과 만족 손님들의 왕래가 끊이지 않는다."
 building_type_TK_20_24_DaLiShiKu: "이름난 건축 유적"
 building_type_TK_20_24_DaLiShiKu_desc: "널리 이름난 누각 고적으로, 지나가는 길손들이 이곳에 이르면 발길을 멈추고 바라보지 않는 이가 없다."
 TK_20_24_DaLiShiKu: "대리 삼탑"
 building_TK_20_24_DaLiShiKu: "$TK_20_24_DaLiShiKu$"
 building_TK_20_24_DaLiShiKu_desc: "점창산 동쪽 기슭과 엽유택 서쪽 기슭 사이에 좁고 긴 평야가 있는데, 시냇물이 이리저리 흐르고 논밭이 서로 잇닿아 있으며, 엽유현성이 바로 이곳에 자리하고 있다."
 building_type_TK_20_24_CangZhouTieShiZi: "이름난 건축 유적"
 building_type_TK_20_24_CangZhouTieShiZi_desc: "널리 이름난 누각 고적으로, 지나가는 길손들이 이곳에 이르면 발길을 멈추고 바라보지 않는 이가 없다."
 TK_20_24_CangZhouTieShiZi: "창주 철사자"
 building_TK_20_24_CangZhouTieShiZi: "$TK_20_24_CangZhouTieShiZi$"
 building_TK_20_24_CangZhouTieShiZi_desc: "발해 바닷가는 지세가 낮고 습하여 바닷물이 자주 거꾸로 밀려든다. 소금 굽는 이익은 두텁지만 물난리도 잦아, 바닷가 백성들은 해마다 조수와 다투어야 한다."
 building_type_TK_20_24_YueYangLou: "이름난 건축 유적"
 building_type_TK_20_24_YueYangLou_desc: "널리 이름난 누각 고적으로, 지나가는 길손들이 이곳에 이르면 발길을 멈추고 바라보지 않는 이가 없다."
 TK_20_24_YueYangLou: "악양루"
 building_TK_20_24_YueYangLou: "$TK_20_24_YueYangLou$"
 building_TK_20_24_YueYangLou_desc: "파구성은 동정호 어귀에 임해 있어, 성에 올라 서쪽을 바라보면 호수가 아득히 넓고 군산이 물결 한가운데 떠 있다. 이곳은 상수가 강으로 들어가는 어귀를 틀어쥐고 있어, 수군이 이곳에 머물면 형남을 제압할 수 있다."
 building_type_TK_20_24_HuangHeLou: "이름난 건축 유적"
 building_type_TK_20_24_HuangHeLou_desc: "널리 이름난 누각 고적으로, 지나가는 길손들이 이곳에 이르면 발길을 멈추고 바라보지 않는 이가 없다."
 TK_20_24_HuangHeLou: "황학루"
 building_TK_20_24_HuangHeLou: "$TK_20_24_HuangHeLou$"
 building_TK_20_24_HuangHeLou_desc: "강하의 황곡산은 큰 강에 임해 있고 북쪽 기슭의 한수가 이곳에서 합류하니, 높이 오르면 강수와 한수가 합쳐 흐르는 기세를 한눈에 볼 수 있다. 일찍이 신선이 누런 고니를 타고 이곳을 날아 지나갔다 하여 산의 이름이 붙었다고 전한다."
 building_type_TK_20_24_TengWangGe: "이름난 건축 유적"
 building_type_TK_20_24_TengWangGe_desc: "널리 이름난 누각 고적으로, 지나가는 길손들이 이곳에 이르면 발길을 멈추고 바라보지 않는 이가 없다."
 TK_20_24_TengWangGe: "등왕각"
 building_TK_20_24_TengWangGe: "$TK_20_24_TengWangGe$"
 building_TK_20_24_TengWangGe_desc: "예장군의 치소 남창성은 서쪽으로 감수에 임해 있어 강폭이 넓고, 서쪽 기슭에는 뭇 산이 이어져 있다. 군에는 녹나무가 많아, 예장이라는 이름도 여기서 비롯되었다고 전한다."
 building_type_TK_20_24_PengLaiGe: "이름난 건축 유적"
 building_type_TK_20_24_PengLaiGe_desc: "널리 이름난 누각 고적으로, 지나가는 길손들이 이곳에 이르면 발길을 멈추고 바라보지 않는 이가 없다."
 TK_20_24_PengLaiGe: "봉래각"
 building_TK_20_24_PengLaiGe: "$TK_20_24_PengLaiGe$"
 building_TK_20_24_PengLaiGe_desc: "동래 바닷가의 붉은 벼랑 위는 아래로 큰 바다에 임해 있어, 봄여름이 바뀔 무렵이면 신기루가 자주 나타나 누대와 성곽이 파도 사이로 아른거린다. 전하는 말에 효무황제가 동쪽으로 순행하여 이곳에 이르러 바다 속 봉래 선산을 멀리 바라보며 오래도록 차마 떠나지 못했다고 한다."
 building_type_TK_20_24_GuanQueLou: "이름난 건축 유적"
 building_type_TK_20_24_GuanQueLou_desc: "널리 이름난 누각 고적으로, 지나가는 길손들이 이곳에 이르면 발길을 멈추고 바라보지 않는 이가 없다."
 TK_20_24_GuanQueLou: "관작루"
 building_TK_20_24_GuanQueLou: "$TK_20_24_GuanQueLou$"
 building_TK_20_24_GuanQueLou_desc: "하동 포판성은 서쪽으로 큰 강에 임해 있으며, 순임금이 이곳에 도읍했다고 전한다. 강기슭 높은 곳에는 황새가 자주 깃들고, 높이 올라 서쪽을 바라보면 큰 강이 북쪽에서 내달려 내려오는 모습을 볼 수 있다."
 building_type_TK_20_30_MingTiaoZhiZhan: "옛 전장"
 building_type_TK_20_30_MingTiaoZhiZhan_desc: "지난날 두 군대가 격전을 벌인 곳으로, 거친 들판에서 지금도 부러진 창과 화살촉을 주울 수 있어 지나는 길손마다 옛일을 애도하며 탄식한다."
 TK_20_30_MingTiaoZhiZhan: "명조 전투"
 building_TK_20_30_MingTiaoZhiZhan: "$TK_20_30_MingTiaoZhiZhan$"
 building_TK_20_30_MingTiaoZhiZhan_desc: "상나라 탕왕이 하나라 걸왕을 칠 때, 두 군대가 명조의 들판에서 결전을 벌였다. 하나라 군대는 크게 패했고, 걸왕은 남소로 달아났으며, 상나라는 이로써 하나라를 대신해 천하를 차지했다."
 building_type_TK_20_30_MuYeZhiZhan: "옛 전장"
 building_type_TK_20_30_MuYeZhiZhan_desc: "지난날 두 군대가 격전을 벌인 곳으로, 거친 들판에서 지금도 부러진 창과 화살촉을 주울 수 있어 지나는 길손마다 옛일을 애도하며 탄식한다."
 TK_20_30_MuYeZhiZhan: "목야 전투"
 building_TK_20_30_MuYeZhiZhan: "$TK_20_30_MuYeZhiZhan$"
 building_TK_20_30_MuYeZhiZhan_desc: "주 무왕이 제후들을 모아 주왕을 칠 때, 목야에서 군사들에게 맹세했다. 상나라 군대가 진 앞에서 창끝을 거꾸로 돌리자, 주왕은 녹대에 올라 스스로 불에 타 죽었으니, 주 왕실 8백 년의 기업이 이로써 열렸다."
 building_type_TK_20_30_ChangShaoZhiZhan: "옛 전장"
 building_type_TK_20_30_ChangShaoZhiZhan_desc: "지난날 두 군대가 격전을 벌인 곳으로, 거친 들판에서 지금도 부러진 창과 화살촉을 주울 수 있어 지나는 길손마다 옛일을 애도하며 탄식한다."
 TK_20_30_ChangShaoZhiZhan: "장작 전투"
 building_TK_20_30_ChangShaoZhiZhan: "$TK_20_30_ChangShaoZhiZhan$"
 building_TK_20_30_ChangShaoZhiZhan_desc: "제나라 군대가 노나라를 치자, 노 장공이 장작에서 맞서 싸웠다. 조귀가 제나라 군대가 북을 세 번 울린 뒤에야 진격하니, 이른바 첫 북에 기세를 일으키고 두 번째에 쇠하고 세 번째에 다한다는 것이었다. 노나라 군대는 마침내 제군을 크게 무찔렀다."
 building_type_TK_20_30_ChangPingZhiZhan: "옛 전장"
 building_type_TK_20_30_ChangPingZhiZhan_desc: "지난날 두 군대가 격전을 벌인 곳으로, 거친 들판에서 지금도 부러진 창과 화살촉을 주울 수 있어 지나는 길손마다 옛일을 애도하며 탄식한다."
 TK_20_30_ChangPingZhiZhan: "장평 전투"
 building_TK_20_30_ChangPingZhiZhan: "$TK_20_30_ChangPingZhiZhan$"
 building_TK_20_30_ChangPingZhiZhan_desc: "진과 조가 상당을 두고 다투어 장평에서 대치했다. 조왕이 이간계에 넘어가 조괄로 염파를 대신해 장수로 삼으니, 조괄은 싸움에 패해 죽고 40여만의 항복한 병사들은 모두 백기에게 생매장당했다. 지금도 산야에서는 마른 뼈가 자주 파내어진다."
 building_type_TK_20_30_GaiXiaZhiZhan: "옛 전장"
 building_type_TK_20_30_GaiXiaZhiZhan_desc: "지난날 두 군대가 격전을 벌인 곳으로, 거친 들판에서 지금도 부러진 창과 화살촉을 주울 수 있어 지나는 길손마다 옛일을 애도하며 탄식한다."
 TK_20_30_GaiXiaZhiZhan: "해하 전투"
 building_TK_20_30_GaiXiaZhiZhan: "$TK_20_30_GaiXiaZhiZhan$"
 building_TK_20_30_GaiXiaZhiZhan_desc: "고조께서 제후들의 군사를 모아 항우를 해하에서 포위했다. 밤에 사방에서 초나라 노래가 들려오자, 항왕은 장막 안에서 슬피 노래하며 술을 마시고 우희와 영결한 뒤 포위를 뚫고 남쪽으로 달아났으나, 끝내 오강에서 스스로 목을 찔렀다. 한나라의 천하는 이로써 정해졌다."
 building_type_TK_20_30_KunYangZhiZhan: "옛 전장"
 building_type_TK_20_30_KunYangZhiZhan_desc: "지난날 두 군대가 격전을 벌인 곳으로, 거친 들판에서 지금도 부러진 창과 화살촉을 주울 수 있어 지나는 길손마다 옛일을 애도하며 탄식한다."
 TK_20_30_KunYangZhiZhan: "곤양 전투"
 building_TK_20_30_KunYangZhiZhan: "$TK_20_30_KunYangZhiZhan$"
 building_TK_20_30_KunYangZhiZhan_desc: "왕망이 대군을 보내 곤양을 포위 공격하니, 깃발과 치중이 천 리에 이어졌다. 광무황제가 결사대를 이끌고 적진을 들이치는데, 마침 천둥과 큰비가 몰아쳐 왕망군이 무너져 흩어지며 서로 짓밟았으니, 한 왕실은 이로써 중흥했다."
 building_type_TK_20_30_ChiBiZhiZhan: "옛 전장"
 building_type_TK_20_30_ChiBiZhiZhan_desc: "지난날 두 군대가 격전을 벌인 곳으로, 거친 들판에서 지금도 부러진 창과 화살촉을 주울 수 있어 지나는 길손마다 옛일을 애도하며 탄식한다."
 TK_20_30_ChiBiZhiZhan: "적벽 전투"
 building_TK_20_30_ChiBiZhiZhan: "$TK_20_30_ChiBiZhiZhan$"
 building_TK_20_30_ChiBiZhiZhan_desc: "큰 강이 이곳을 흐르는데, 남쪽 기슭에는 붉은 벼랑이 깎아지른 듯 솟아 있고 북쪽 기슭의 오림이 이를 마주 보고 있다. 강폭이 넓고 바람의 방향이 일정하지 않아, 수군이 이곳에서 대치하면 승패가 흔히 한 줄기 동풍에 달려 있다."
 building_type_TK_20_30_YiLingZhiZhan: "옛 전장"
 building_type_TK_20_30_YiLingZhiZhan_desc: "지난날 두 군대가 격전을 벌인 곳으로, 거친 들판에서 지금도 부러진 창과 화살촉을 주울 수 있어 지나는 길손마다 옛일을 애도하며 탄식한다."
 TK_20_30_YiLingZhiZhan: "이릉 전투"
 building_TK_20_30_YiLingZhiZhan: "$TK_20_30_YiLingZhiZhan$"
 building_TK_20_30_YiLingZhiZhan_desc: "큰 강이 협곡을 빠져나온 뒤에도 이릉과 효정 일대는 산세가 여전히 험준하고 숲이 무성하여, 촉 땅에서 동쪽 형초로 나가려면 모두 이곳을 지나야 한다. 이곳 산간에 진영을 잇달아 세웠다가 불을 만나기라도 하면, 머리와 꼬리를 서로 돌볼 수 없게 된다."
 building_type_TK_20_30_FeiShuiZhiZhan: "옛 전장"
 building_type_TK_20_30_FeiShuiZhiZhan_desc: "지난날 두 군대가 격전을 벌인 곳으로, 거친 들판에서 지금도 부러진 창과 화살촉을 주울 수 있어 지나는 길손마다 옛일을 애도하며 탄식한다."
 TK_20_30_FeiShuiZhiZhan: "비수 전투"
 building_TK_20_30_FeiShuiZhiZhan: "$TK_20_30_FeiShuiZhiZhan$"
 building_TK_20_30_FeiShuiZhiZhan_desc: "비수는 수춘성 아래를 흘러 북쪽으로 회수에 들어가니, 강회 사이에서 남북이 군사를 맞부딪칠 때 반드시 거쳐야 하는 곳이다. 성 북쪽의 팔공산은 회남왕 유안이 여덟 문객과 함께 단약을 만들어 신선이 되어 올라간 곳이라 전한다."
 building_type_TK_20_30_CanHePoZhiZhan: "옛 전장"
 building_type_TK_20_30_CanHePoZhiZhan_desc: "지난날 두 군대가 격전을 벌인 곳으로, 거친 들판에서 지금도 부러진 창과 화살촉을 주울 수 있어 지나는 길손마다 옛일을 애도하며 탄식한다."
 TK_20_30_CanHePoZhiZhan: "참합피 전투"
 building_TK_20_30_CanHePoZhiZhan: "$TK_20_30_CanHePoZhiZhan$"
 building_TK_20_30_CanHePoZhiZhan_desc: "대군 참합현 경내에는 변방 위의 호수와 못이 이어져 있고 물과 풀이 풍성하니, 호인 기병이 남하하는 요로이다. 고조 때 한왕 신이 흉노와 결탁해 반란을 일으키자, 한나라 장수 시무가 이곳에서 그 군대를 크게 무찌르고 참합에서 신의 목을 베었다."
 building_type_TK_20_30_BaiJiangKouZhiZhan: "옛 전장"
 building_type_TK_20_30_BaiJiangKouZhiZhan_desc: "지난날 두 군대가 격전을 벌인 곳으로, 거친 들판에서 지금도 부러진 창과 화살촉을 주울 수 있어 지나는 길손마다 옛일을 애도하며 탄식한다."
 TK_20_30_BaiJiangKouZhiZhan: "백강구 전투"
 building_TK_20_30_BaiJiangKouZhiZhan: "$TK_20_30_BaiJiangKouZhiZhan$"
 building_TK_20_30_BaiJiangKouZhiZhan_desc: "마한 땅에서 큰 강이 이곳을 통해 바다로 들어가는데, 강어귀가 넓고 조수 간만의 차가 매우 크다. 개펄이 길게 이어져 있어 배가 드나들려면 밀물을 기다려야 하며, 조금만 방심해도 좌초하고 만다."
 building_type_TK_20_30_XiangJiSiZhiZhan: "옛 전장"
 building_type_TK_20_30_XiangJiSiZhiZhan_desc: "지난날 두 군대가 격전을 벌인 곳으로, 거친 들판에서 지금도 부러진 창과 화살촉을 주울 수 있어 지나는 길손마다 옛일을 애도하며 탄식한다."
 TK_20_30_XiangJiSiZhiZhan: "향적사 전투"
 building_TK_20_30_XiangJiSiZhiZhan: "$TK_20_30_XiangJiSiZhiZhan$"
 building_TK_20_30_XiangJiSiZhiZhan_desc: "장안성 남쪽의 풍수와 휼수 사이는 들판이 평탄하고 넓으며, 남쪽으로 종남산에 기대고 북쪽으로 장안의 성궐을 바라보니, 경기 남쪽의 관문이다."
 building_type_TK_20_30_GaoLiangHeZhiZhan: "옛 전장"
 building_type_TK_20_30_GaoLiangHeZhiZhan_desc: "지난날 두 군대가 격전을 벌인 곳으로, 거친 들판에서 지금도 부러진 창과 화살촉을 주울 수 있어 지나는 길손마다 옛일을 애도하며 탄식한다."
 TK_20_30_GaoLiangHeZhiZhan: "고량하 전투"
 building_TK_20_30_GaoLiangHeZhiZhan: "$TK_20_30_GaoLiangHeZhiZhan$"
 building_TK_20_30_GaoLiangHeZhiZhan_desc: "계성 서쪽 교외에 작은 강 하나가 평야와 늪지 사이를 흐르는데, 강가에는 갈대가 무성하고 지대가 낮고 질척하여 대군이 이곳에서 제 힘을 펴기 어렵다."
 building_type_TK_20_31_DuJiangYan: "수리 시설"
 building_type_TK_20_31_DuJiangYan_desc: "옛사람들이 수로를 파고 보를 쌓아 물을 끌어 논밭에 댄 공적으로, 강가의 논밭이 이에 힘입어 가뭄과 홍수를 면하니 백성들이 대대로 그 은혜를 기린다."
 TK_20_31_DuJiangYan: "도강언"
 building_TK_20_31_DuJiangYan: "$TK_20_31_DuJiangYan$"
 building_TK_20_31_DuJiangYan_desc: "촉군 태수 이빙이 이퇴를 뚫어 민강의 물을 나누고 보를 쌓아 물길을 이끌어, 촉 땅의 천 리 옥야에 물을 댔다. 이로부터 촉 땅은 가뭄과 홍수를 사람의 뜻대로 다스려 굶주림을 몰랐으니, 천하가 이를 천부라 불렀다."
 building_type_TK_20_31_LingQu: "수리 시설"
 building_type_TK_20_31_LingQu_desc: "옛사람들이 수로를 파고 보를 쌓아 물을 끌어 논밭에 댄 공적으로, 강가의 논밭이 이에 힘입어 가뭄과 홍수를 면하니 백성들이 대대로 그 은혜를 기린다."
 TK_20_31_LingQu: "영거"
 building_TK_20_31_LingQu: "$TK_20_31_LingQu$"
 building_TK_20_31_LingQu_desc: "시황제가 남쪽으로 백월을 정벌할 때 감록에게 명하여 수로를 파게 해 상수와 이수를 잇게 하니, 누선과 군량이 큰 강에서 곧장 영남으로 들어갈 수 있게 되었다. 수로는 비록 좁으나 남북 두 방면의 물길을 이어 주었다."
 building_type_TK_20_31_KanErJing: "수리 시설"
 building_type_TK_20_31_KanErJing_desc: "옛사람들이 수로를 파고 보를 쌓아 물을 끌어 논밭에 댄 공적으로, 강가의 논밭이 이에 힘입어 가뭄과 홍수를 면하니 백성들이 대대로 그 은혜를 기린다."
 TK_20_31_KanErJing: "카레즈"
 building_TK_20_31_KanErJing: "$TK_20_31_KanErJing$"
 building_TK_20_31_KanErJing_desc: "서역은 건조하고 비가 적어, 토착민과 둔전하던 한군이 땅속에 암거를 파고 일정한 간격마다 수직 우물을 뚫어 서로 이었으니, 설산의 물을 땅속으로 끌어 흘려 논밭에 대었다. 이를 정거라 불렀다."
 building_type_TK_20_32_MoGaoKu: "석굴과 비각"
 building_type_TK_20_32_MoGaoKu_desc: "산에 기대어 돌을 쪼아 낸 곳으로, 도끼와 끌 자국 사이로 옛사람들의 경건함과 솜씨를 엿볼 수 있다."
 TK_20_32_MoGaoKu: "막고굴"
 building_TK_20_32_MoGaoKu: "$TK_20_32_MoGaoKu$"
 building_TK_20_32_MoGaoKu_desc: "돈황성 동남쪽에 명사산이 있는데, 모래 언덕이 기복을 이루어 사람과 말이 지나가면 우르릉 울리는 소리가 난다. 산 아래 벼랑은 작은 강에 닿아 있고, 맞은편의 삼위산은 순임금이 삼묘를 유배 보낸 곳이라 전한다."
 building_type_TK_20_32_YunGangShiKu: "석굴과 비각"
 building_type_TK_20_32_YunGangShiKu_desc: "산에 기대어 돌을 쪼아 낸 곳으로, 도끼와 끌 자국 사이로 옛사람들의 경건함과 솜씨를 엿볼 수 있다."
 TK_20_32_YunGangShiKu: "운강 석굴"
 building_TK_20_32_YunGangShiKu: "$TK_20_32_YunGangShiKu$"
 building_TK_20_32_YunGangShiKu_desc: "안문군 평성 서쪽에 무주산이 있고 산 아래에 무주새를 두었으니, 한나라가 변방 밖을 지키는 요충이다. 효무황제 때 마읍의 계책을 꾸몄을 때, 흉노 선우가 10만 기병을 이끌고 들어온 곳이 바로 이곳이다."
 building_type_TK_20_32_LongMenShiKu: "석굴과 비각"
 building_type_TK_20_32_LongMenShiKu_desc: "산에 기대어 돌을 쪼아 낸 곳으로, 도끼와 끌 자국 사이로 옛사람들의 경건함과 솜씨를 엿볼 수 있다."
 TK_20_32_LongMenShiKu: "용문 석굴"
 building_TK_20_32_LongMenShiKu: "$TK_20_32_LongMenShiKu$"
 building_TK_20_32_LongMenShiKu_desc: "낙양 남쪽에서 이수가 두 산 사이를 뚫고 흐르는데, 두 산이 궐문처럼 마주 솟아 있어 이궐이라 부른다. 대우가 치수할 때 이 산을 뚫어 이수를 북쪽으로 흐르게 했다고 전한다."
 building_type_TK_20_32_DaZuShiKe: "석굴과 비각"
 building_type_TK_20_32_DaZuShiKe_desc: "산에 기대어 돌을 쪼아 낸 곳으로, 도끼와 끌 자국 사이로 옛사람들의 경건함과 솜씨를 엿볼 수 있다."
 TK_20_32_DaZuShiKe: "대족 석각"
 building_TK_20_32_DaZuShiKe: "$TK_20_32_DaZuShiKe$"
 building_TK_20_32_DaZuShiKe_desc: "파군 서부의 구릉 사이는 산이 그리 높지 않으나 바위가 드러나 있고 시냇물이 이리저리 흐르며, 마을 사람들은 산에 기대어 밭을 일구고 풍속이 순박하다."
 building_type_TK_20_32_LeShanDaFu: "석굴과 비각"
 building_type_TK_20_32_LeShanDaFu_desc: "산에 기대어 돌을 쪼아 낸 곳으로, 도끼와 끌 자국 사이로 옛사람들의 경건함과 솜씨를 엿볼 수 있다."
 TK_20_32_LeShanDaFu: "낙산 대불"
 building_TK_20_32_LeShanDaFu: "$TK_20_32_LeShanDaFu$"
 building_TK_20_32_LeShanDaFu_desc: "건위 남안성 밖에서 말수와 청의수가 민강과 합류하니, 물살이 사나워 배가 뒤집히는 일이 잦다. 강에 임한 벼랑이 깎아지른 듯 솟아 있어, 뱃사람들은 이곳을 지날 때마다 숨을 죽인다."
 building_type_TK_20_32_MaiJiShanShiKu: "석굴과 비각"
 building_type_TK_20_32_MaiJiShanShiKu_desc: "산에 기대어 돌을 쪼아 낸 곳으로, 도끼와 끌 자국 사이로 옛사람들의 경건함과 솜씨를 엿볼 수 있다."
 TK_20_32_MaiJiShanShiKu: "맥적산 석굴"
 building_TK_20_32_MaiJiShanShiKu: "$TK_20_32_MaiJiShanShiKu$"
 building_TK_20_32_MaiJiShanShiKu_desc: "한양군 남쪽의 뭇 산 가운데 외로운 봉우리 하나가 땅에서 우뚝 솟아 있는데, 그 모양이 농가에 쌓아 둔 보릿단 같아 마을 사람들은 이를 맥적산이라 부른다. 산 위에는 소나무와 측백나무가 푸르고, 구름과 안개가 피었다 흩어졌다 한다."
 building_type_TK_20_36_YanMenGuan: "관문과 요새"
 building_type_TK_20_36_YanMenGuan_desc: "산천의 험한 곳을 골라 관문과 요새를 세우니, 한 사람이 관문을 지키면 만 명이 와도 열 수 없다. 오가는 길손은 반드시 통행증을 검사받아야 지나갈 수 있다."
 TK_20_36_YanMenGuan: "안문관"
 building_TK_20_36_YanMenGuan: "$TK_20_36_YanMenGuan$"
 building_TK_20_36_YanMenGuan_desc: "안문군 남쪽에 구주산이 있는데, 두 산이 문처럼 마주 솟아 있어 기러기가 남북으로 오갈 때 모두 이곳을 지난다고 전한다. 산 위에 구주새를 두어 호인 기병이 태원으로 남하하는 요로를 지키니, 천하 9대 요새 가운데 하나로 꼽힌다."
 building_type_TK_20_36_YuMenGuan: "관문과 요새"
 building_type_TK_20_36_YuMenGuan_desc: "산천의 험한 곳을 골라 관문과 요새를 세우니, 한 사람이 관문을 지키면 만 명이 와도 열 수 없다. 오가는 길손은 반드시 통행증을 검사받아야 지나갈 수 있다."
 TK_20_36_YuMenGuan: "옥문관"
 building_TK_20_36_YuMenGuan: "$TK_20_36_YuMenGuan$"
 building_TK_20_36_YuMenGuan_desc: "돈황군 서북쪽의 관문으로, 효무황제 때 설치되었다. 서역 여러 나라의 사신과 상인들이 모두 이 관문을 거쳐 변방 안으로 들어오며, 우전의 아름다운 옥도 이곳을 통해 들어왔다 하여 옥문이라 이름했다고 전한다. 관문을 나서면 곧 천 리의 유사가 펼쳐진다."
 building_type_TK_20_36_YangGuan: "관문과 요새"
 building_type_TK_20_36_YangGuan_desc: "산천의 험한 곳을 골라 관문과 요새를 세우니, 한 사람이 관문을 지키면 만 명이 와도 열 수 없다. 오가는 길손은 반드시 통행증을 검사받아야 지나갈 수 있다."
 TK_20_36_YangGuan: "양관"
 building_TK_20_36_YangGuan: "$TK_20_36_YangGuan$"
 building_TK_20_36_YangGuan_desc: "양관은 옥문관의 남쪽에 있어 양관이라 부르니, 서쪽으로 서역 남도로 나가는 관문이다. 관문 밖은 모래벌판이 아득하고 물과 풀이 드물어, 배웅하는 이들은 흔히 이곳에서 발걸음을 멈춘다."
 building_type_TK_20_36_JianMenGuan: "관문과 요새"
 building_type_TK_20_36_JianMenGuan_desc: "산천의 험한 곳을 골라 관문과 요새를 세우니, 한 사람이 관문을 지키면 만 명이 와도 열 수 없다. 오가는 길손은 반드시 통행증을 검사받아야 지나갈 수 있다."
 TK_20_36_JianMenGuan: "검문관"
 building_TK_20_36_JianMenGuan: "$TK_20_36_JianMenGuan$"
 building_TK_20_36_JianMenGuan_desc: "대검산과 소검산 사이에 두 벼랑이 칼처럼 마주 서 있고 그 사이로 겨우 한 줄기 길만 지나니, 마치 하나의 돌문과 같다. 진나라 사람들이 석우도를 열어 촉으로 들어갈 때 바로 이곳을 지났으니, 한 사람이 지키면 만 명도 넘기 어렵다."
 building_type_TK_20_36_WuGuan: "관문과 요새"
 building_type_TK_20_36_WuGuan_desc: "산천의 험한 곳을 골라 관문과 요새를 세우니, 한 사람이 관문을 지키면 만 명이 와도 열 수 없다. 오가는 길손은 반드시 통행증을 검사받아야 지나갈 수 있다."
 TK_20_36_WuGuan: "무관"
 building_TK_20_36_WuGuan: "$TK_20_36_WuGuan$"
 building_TK_20_36_WuGuan_desc: "무관은 진령 동남쪽의 산골짜기에 자리하여, 춘추 시대에는 소습이라 불렸으며 관중에서 남양과 형초로 통하는 목구멍이다. 진 소왕은 일찍이 이곳에서 초 회왕을 꾀어 사로잡았고, 고조가 관중에 들어갈 때도 이곳에서 관문을 깨뜨리고 나아갔다."
 building_type_TK_20_36_HuLaoGuan: "관문과 요새"
 building_type_TK_20_36_HuLaoGuan_desc: "산천의 험한 곳을 골라 관문과 요새를 세우니, 한 사람이 관문을 지키면 만 명이 와도 열 수 없다. 오가는 길손은 반드시 통행증을 검사받아야 지나갈 수 있다."
 TK_20_36_HuLaoGuan: "호뢰관"
 building_TK_20_36_HuLaoGuan: "$TK_20_36_HuLaoGuan$"
 building_TK_20_36_HuLaoGuan_desc: "성고의 험지는 남쪽으로 숭고산에 이어지고 북쪽으로 큰 강에 임하며 산줄기가 얽혀 있으니, 낙양 동쪽의 관문이다. 주 목왕이 이곳에서 사나운 호랑이를 가두어 길렀다 하여 호뢰라 부른다고 전하며, 초한 시절 고조와 항우는 이곳에서 해를 넘기며 대치했다."
 building_type_TK_20_36_DaSanGuan: "관문과 요새"
 building_type_TK_20_36_DaSanGuan_desc: "산천의 험한 곳을 골라 관문과 요새를 세우니, 한 사람이 관문을 지키면 만 명이 와도 열 수 없다. 오가는 길손은 반드시 통행증을 검사받아야 지나갈 수 있다."
 TK_20_36_DaSanGuan: "대산관"
 building_TK_20_36_DaSanGuan: "$TK_20_36_DaSanGuan$"
 building_TK_20_36_DaSanGuan_desc: "산관은 진창 남쪽의 대산령 위에 있어, 관중에서 한중과 파촉으로 들어가는 길을 지킨다. 지난날 고조가 한중에서 군사를 내어 삼진을 다시 평정할 때, 바로 이 길을 택해 북쪽으로 올라갔다."
 building_type_TK_20_36_TongGuan: "관문과 요새"
 building_type_TK_20_36_TongGuan_desc: "산천의 험한 곳을 골라 관문과 요새를 세우니, 한 사람이 관문을 지키면 만 명이 와도 열 수 없다. 오가는 길손은 반드시 통행증을 검사받아야 지나갈 수 있다."
 TK_20_36_TongGuan: "동관"
 building_TK_20_36_TongGuan: "$TK_20_36_TongGuan$"
 building_TK_20_36_TongGuan_desc: "큰 강이 북쪽에서 남쪽으로 흐르다 이곳에 이르러 꺾여 동쪽으로 가는데, 강물이 관문과 산에 부딪쳐 출렁이므로 동이라 이름했다. 이곳은 북쪽으로 큰 강에 임하고 남쪽으로 진령에 기대어 장안과 낙양 사이의 통로를 지키니, 형세가 험하고 요긴하다."
 building_type_TK_20_36_ShanHaiGuan: "관문과 요새"
 building_type_TK_20_36_ShanHaiGuan_desc: "산천의 험한 곳을 골라 관문과 요새를 세우니, 한 사람이 관문을 지키면 만 명이 와도 열 수 없다. 오가는 길손은 반드시 통행증을 검사받아야 지나갈 수 있다."
 TK_20_36_ShanHaiGuan: "산해관"
 building_TK_20_36_ShanHaiGuan: "$TK_20_36_ShanHaiGuan$"
 building_TK_20_36_ShanHaiGuan_desc: "요서군 임유현은 연산의 남은 줄기가 곧장 바닷가에 닿아, 산과 바다 사이에 겨우 한 줄기 통로만 남아 있으니, 유주에서 요동으로 가는 필경의 길이다. 시황제와 효무황제가 동쪽으로 순행할 때 모두 바닷가의 갈석에 올라 바다를 바라보았다고 전한다."
 building_type_TK_20_36_XiaoGuan: "관문과 요새"
 building_type_TK_20_36_XiaoGuan_desc: "산천의 험한 곳을 골라 관문과 요새를 세우니, 한 사람이 관문을 지키면 만 명이 와도 열 수 없다. 오가는 길손은 반드시 통행증을 검사받아야 지나갈 수 있다."
 TK_20_36_XiaoGuan: "소관"
 building_TK_20_36_XiaoGuan: "$TK_20_36_XiaoGuan$"
 building_TK_20_36_XiaoGuan_desc: "소관은 안정군 경내에 있으며, 농산을 등지고 경수의 강 골짜기를 지키니 농서와 북지에서 관중으로 통하는 관문이다. 효문황제 때 흉노의 14만 기병이 소관을 깨뜨리자, 유격 기병이 곧장 감천까지 이르렀다."
 building_type_TK_20_37_QuanZhouGang: "항구와 나루"
 building_type_TK_20_37_QuanZhouGang_desc: "배들이 모여드는 나루와 포구로, 상인들이 이곳을 통해 오가고 온갖 물건이 이곳에서 모이고 흩어진다."
 TK_20_37_QuanZhouGang: "천주항"
 building_TK_20_37_QuanZhouGang: "$TK_20_37_QuanZhouGang$"
 building_TK_20_37_QuanZhouGang_desc: "민 땅의 큰 강 하나가 바다로 들어가는 곳으로, 만이 구불구불하여 풍랑을 피할 수 있다. 민월의 옛 백성들은 배를 잘 다루어, 연해의 고깃배들이 만 사이를 오간다."
 building_type_TK_20_37_BoDuoGang: "항구와 나루"
 building_type_TK_20_37_BoDuoGang_desc: "배들이 모여드는 나루와 포구로, 상인들이 이곳을 통해 오가고 온갖 물건이 이곳에서 모이고 흩어진다."
 TK_20_37_BoDuoGang: "박다항"
 building_TK_20_37_BoDuoGang: "$TK_20_37_BoDuoGang$"
 building_TK_20_37_BoDuoGang_desc: "왜 땅 노국이 자리한 만으로, 산을 등지고 바다를 마주하여 풍랑이 잔잔하니, 왜인들이 바다를 건너 삼한과 낙랑으로 떠나는 출발지이다. 광무황제 때 노국이 사신을 보내 공물을 바치고 금인을 하사받았다."
 building_type_TK_20_37_BiLanDu: "항구와 나루"
 building_type_TK_20_37_BiLanDu_desc: "배들이 모여드는 나루와 포구로, 상인들이 이곳을 통해 오가고 온갖 물건이 이곳에서 모이고 흩어진다."
 TK_20_37_BiLanDu: "벽란도"
 building_TK_20_37_BiLanDu: "$TK_20_37_BiLanDu$"
 building_TK_20_37_BiLanDu_desc: "낙랑군 남쪽 경계에서 큰 강 하나가 서해로 흘러드는데, 강어귀가 넓어 조수가 드나들 때 큰 배도 드나들 수 있다. 낙랑과 삼한 사이를 오가는 상선들이 대개 이곳에 정박한다."
 building_type_TK_20_40_DongYueTaiShan: "오악"
 building_type_TK_20_40_DongYueTaiShan_desc: "오악은 천하의 사방과 중앙을 진무하니, 천자가 순수할 때면 반드시 이곳에 제사를 올렸다. 뭇 산은 이에 미치지 못한다."
 TK_20_40_DongYueTaiShan: "동악 태산"
 building_TK_20_40_DongYueTaiShan: "$TK_20_40_DongYueTaiShan$"
 building_TK_20_40_DongYueTaiShan_desc: "태산은 오악의 으뜸으로, 예로부터 천명을 받은 제왕은 반드시 태산에 올라 봉선하여 하늘에 공업의 완성을 고했으니, 시황제와 효무황제, 광무황제 모두 이곳에서 봉선의 예를 행했다. 세상 사람들은 또 사람이 죽으면 혼이 태산으로 돌아간다고 전한다."
 building_type_TK_20_40_NanYueHengShan: "오악"
 building_type_TK_20_40_NanYueHengShan_desc: "오악은 천하의 사방과 중앙을 진무하니, 천자가 순수할 때면 반드시 이곳에 제사를 올렸다. 뭇 산은 이에 미치지 못한다."
 TK_20_40_NanYueHengShan: "남악 형산"
 building_TK_20_40_NanYueHengShan: "$TK_20_40_NanYueHengShan$"
 building_TK_20_40_NanYueHengShan_desc: "형산의 72봉은 끝없이 기복을 이루며 이어지는데, 그 자리가 위로 별자리에 응하여 저울대처럼 천지를 잴 수 있다 하여 형산이라 이름했다고 전한다. 순임금이 남쪽으로 순행할 때 일찍이 남악에 이르러 제사를 올렸다."
 building_type_TK_20_40_XiYueHuaShan: "오악"
 building_type_TK_20_40_XiYueHuaShan_desc: "오악은 천하의 사방과 중앙을 진무하니, 천자가 순수할 때면 반드시 이곳에 제사를 올렸다. 뭇 산은 이에 미치지 못한다."
 TK_20_40_XiYueHuaShan: "서악 화산"
 building_TK_20_40_XiYueHuaShan: "$TK_20_40_XiYueHuaShan$"
 building_TK_20_40_XiYueHuaShan_desc: "화산은 홍농 화음현 남쪽에 있으며, 다섯 봉우리가 우뚝 솟고 사면이 깎아지른 듯하여 그 험준함이 뭇 산 가운데 으뜸이다. 산 아래에 서악묘가 있어 조정이 때마다 사신을 보내 제사를 올리니, 묘 안에는 비석이 숲처럼 늘어서 있다."
 building_type_TK_20_40_BeiYueHengShan: "오악"
 building_type_TK_20_40_BeiYueHengShan_desc: "오악은 천하의 사방과 중앙을 진무하니, 천자가 순수할 때면 반드시 이곳에 제사를 올렸다. 뭇 산은 이에 미치지 못한다."
 TK_20_40_BeiYueHengShan: "북악 항산"
 building_TK_20_40_BeiYueHengShan: "$TK_20_40_BeiYueHengShan$"
 building_TK_20_40_BeiYueHengShan_desc: "북악은 본래 이름이 항산이었으나 효문황제의 이름을 피하여 상산으로 고쳐 불렀다. 뭇 봉우리가 첩첩이 솟아 대 땅과 기주 사이에 가로놓여 있으니 북방 뭇 산의 으뜸이며, 천자가 때마다 사신을 보내 제사를 올린다."
 building_type_TK_20_40_ZhongYueSongShan: "오악"
 building_type_TK_20_40_ZhongYueSongShan_desc: "오악은 천하의 사방과 중앙을 진무하니, 천자가 순수할 때면 반드시 이곳에 제사를 올렸다. 뭇 산은 이에 미치지 못한다."
 TK_20_40_ZhongYueSongShan: "중악 숭산"
 building_TK_20_40_ZhongYueSongShan: "$TK_20_40_ZhongYueSongShan$"
 building_TK_20_40_ZhongYueSongShan_desc: "숭고산은 천하의 한가운데 자리하며, 태실산과 소실산 두 산이 동서로 마주 솟아 있다. 효무황제가 태실산에 올랐을 때, 산 아래의 수행 관리들이 만세를 세 번 외치는 소리를 들었다고 전하여, 이에 산 아래 3백 호로 제사를 받들게 하고 숭고읍이라 불렀다."
 building_type_TK_20_41_HuangShan: "명산"
 building_type_TK_20_41_HuangShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_HuangShan: "황산"
 building_TK_20_41_HuangShan: "$TK_20_41_HuangShan$"
 building_TK_20_41_HuangShan_desc: "단양군 이현 경내에 이산이 있는데, 봉우리와 바위가 검푸르러 멀리서 보면 짙푸르게 보이므로 이라는 이름이 붙었다. 산속에는 기이한 소나무와 괴석이 있고 운해가 넘실거리며, 황제가 이곳에서 단약을 만들었다고 전한다."
 building_type_TK_20_41_LuShan: "명산"
 building_type_TK_20_41_LuShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_LuShan: "여산"
 building_TK_20_41_LuShan: "$TK_20_41_LuShan$"
 building_TK_20_41_LuShan_desc: "여산은 팽려택 서쪽에 있으며, 주나라 때 광속 형제가 이곳에 오두막을 짓고 도를 닦았다 하여 광려라고도 부른다고 전한다. 태사공은 일찍이 남쪽으로 여산에 올라 대우가 터 놓은 구강을 살펴보았다."
 building_type_TK_20_41_ShenNongShan: "명산"
 building_type_TK_20_41_ShenNongShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_ShenNongShan: "신농산"
 building_TK_20_41_ShenNongShan: "$TK_20_41_ShenNongShan$"
 building_TK_20_41_ShenNongShan_desc: "하내군 북쪽의 태항산 속은 염제 신농씨가 이곳에서 오곡을 가리고 온갖 풀을 맛보며 제단을 쌓아 하늘에 제사 지냈다고 전하는 곳이다. 산세가 험준하고 봉우리가 용의 등뼈 같아, 구름과 안개 사이로 구불구불 이어진다."
 building_type_TK_20_41_LaoJunShan: "명산"
 building_type_TK_20_41_LaoJunShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_LaoJunShan: "노군산"
 building_TK_20_41_LaoJunShan: "$TK_20_41_LaoJunShan$"
 building_TK_20_41_LaoJunShan_desc: "경실산은 복우산 줄기의 주봉으로, 노자가 서쪽으로 함곡관을 나서기 전에 이 산에 은거하며 수련했다고 전한다. 산 위에는 구름과 안개가 감돌아, 도를 닦는 이들이 흔히 그 이름을 흠모하여 찾아온다."
 building_type_TK_20_41_WuDangShan: "명산"
 building_type_TK_20_41_WuDangShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_WuDangShan: "무당산"
 building_TK_20_41_WuDangShan: "$TK_20_41_WuDangShan$"
 building_TK_20_41_WuDangShan_desc: "무당산은 남양군 무당현 경내에 있으며, 뭇 봉우리가 주봉을 둘러싸고 바위 골짜기가 깊고 그윽하니, 옛날에는 태화산이라 불렀다. 주나라 때 윤희가 이곳에 은거했다고 전하며, 산속에는 방사들이 암자를 짓고 수련하는 일이 잦다."
 building_type_TK_20_41_LongHuShan: "명산"
 building_type_TK_20_41_LongHuShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_LongHuShan: "용호산"
 building_TK_20_41_LongHuShan: "$TK_20_41_LongHuShan$"
 building_TK_20_41_LongHuShan_desc: "예장 동부의 뭇 산 가운데 붉은 벼랑과 푸른 물이 있고 두 봉우리가 마주 서 있어, 용이 서리고 범이 웅크린 듯하므로 용호라 이름했다. 장도릉이 이곳에서 단약을 만들었는데, 단약이 완성되자 용과 범이 나타났다고 전한다."
 building_type_TK_20_41_QingChengShan: "명산"
 building_type_TK_20_41_QingChengShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_QingChengShan: "청성산"
 building_TK_20_41_QingChengShan: "$TK_20_41_QingChengShan$"
 building_TK_20_41_QingChengShan_desc: "청성산은 뭇 봉우리가 둘러서 있어 그 모양이 성곽과 같고 숲이 사철 푸르니, 황제가 이곳에서 영봉자를 오악장인으로 모셨다고 전한다. 순제 때 장도릉이 촉에 들어와 학명산과 청성산 일대에서 도를 전하니, 신도가 파촉과 한중에 두루 퍼졌다."
 building_type_TK_20_41_QiYunShan: "명산"
 building_type_TK_20_41_QiYunShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_QiYunShan: "제운산"
 building_TK_20_41_QiYunShan: "$TK_20_41_QiYunShan$"
 building_TK_20_41_QiYunShan_desc: "단양군 남쪽 경계에 백악이라는 산이 있는데, 봉우리 꼭대기가 구름과 나란하고 벼랑이 단사처럼 붉으며, 산간에는 맑은 샘과 폭포가 날리고 인적이 드물다."
 building_type_TK_20_41_JingFuShan: "명산"
 building_type_TK_20_41_JingFuShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_JingFuShan: "경복산"
 building_TK_20_41_JingFuShan: "$TK_20_41_JingFuShan$"
 building_TK_20_41_JingFuShan_desc: "부풍 견현 서쪽 경계의 용문산은 봉우리가 첩첩이 푸르고 바위굴이 깊고 그윽하다. 옛날에 신선이 바위 속에 깃들었다 하여 영선암이라고도 부른다고 전한다."
 building_type_TK_20_41_MaoShan: "명산"
 building_type_TK_20_41_MaoShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_MaoShan: "모산"
 building_TK_20_41_MaoShan: "$TK_20_41_MaoShan$"
 building_TK_20_41_MaoShan_desc: "구곡산은 산세가 구불구불하여 그 모양이 ‘기’ 자를 닮았으므로 구곡이라 이름했다. 효경황제 때 모영, 모고, 모충 세 형제가 이곳에서 도를 닦고 선행을 베풀자, 마을 사람들이 그 덕을 기려 삼모산으로 이름을 바꾸었다고 전한다."
 building_type_TK_20_41_WuTaiShan: "명산"
 building_type_TK_20_41_WuTaiShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_WuTaiShan: "오대산"
 building_TK_20_41_WuTaiShan: "$TK_20_41_WuTaiShan$"
 building_TK_20_41_WuTaiShan_desc: "다섯 봉우리가 둘러서 있고 꼭대기가 누대처럼 평평하며, 한여름에도 눈이 쌓여 있으니, 옛날 방사들은 이를 자부산이라 부르며 이곳에서 수련했다. 효명황제 때 서쪽에서 온 사문들도 이곳에 절을 세우고 경전을 강론했다고 전한다."
 building_type_TK_20_41_EMeiShan: "명산"
 building_type_TK_20_41_EMeiShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_EMeiShan: "아미산"
 building_TK_20_41_EMeiShan: "$TK_20_41_EMeiShan$"
 building_TK_20_41_EMeiShan_desc: "아미산은 건위군 남안현 경내에 있으며, 두 봉우리가 누에나방의 눈썹처럼 마주 보고 있어 이름이 붙었다. 산이 구름 속으로 높이 솟고 숲이 깊고 그윽한데, 주나라 때 신선 갈유가 나무 양을 타고 촉에 들어오자, 그를 따르던 이들이 모두 이 산 일대에서 도를 얻어 신선이 되었다고 전한다."
 building_type_TK_20_41_PuTuoShan: "명산"
 building_type_TK_20_41_PuTuoShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_PuTuoShan: "보타산"
 building_TK_20_41_PuTuoShan: "$TK_20_41_PuTuoShan$"
 building_TK_20_41_PuTuoShan_desc: "회계 동해 가운데 작은 섬 하나가 있는데, 섬에는 바위가 우뚝우뚝하고 숲이 울창하다. 왕망이 정권을 농단하던 때, 남창위 매복이 집을 버리고 떠나 이곳에 은거하며 단약을 만들었다 하여, 섬의 산을 매잠이라 불렀다고 전한다."
 building_type_TK_20_41_JiuHuaShan: "명산"
 building_type_TK_20_41_JiuHuaShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_JiuHuaShan: "구화산"
 building_TK_20_41_JiuHuaShan: "$TK_20_41_JiuHuaShan$"
 building_TK_20_41_JiuHuaShan_desc: "강남의 뭇 산 가운데 아홉 봉우리가 나란히 솟아 있는데, 봉우리 꼭대기가 늘 구름과 안개 속에 보일 듯 말 듯하며, 숲이 깊고 샘이 그윽하여 인적이 드물다."
 building_type_TK_20_41_FanJingShan: "명산"
 building_type_TK_20_41_FanJingShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_FanJingShan: "범정산"
 building_TK_20_41_FanJingShan: "$TK_20_41_FanJingShan$"
 building_TK_20_41_FanJingShan_desc: "무릉군 서부의 깊은 산속에 뭇 봉우리가 땅에서 우뚝 솟아 일 년 내내 구름과 안개가 감돈다. 무릉의 만인들은 이를 신산으로 받들어, 제사 때마다 산 아래에 모인다."
 building_type_TK_20_41_KongDongShan: "명산"
 building_type_TK_20_41_KongDongShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_KongDongShan: "공동산"
 building_TK_20_41_KongDongShan: "$TK_20_41_KongDongShan$"
 building_TK_20_41_KongDongShan_desc: "공동산은 안정군 경내에 있으며, 황제가 몸소 이 산에 와서 신선 광성자에게 몸을 다스리는 도를 물었다고 전한다. 효무황제도 서쪽으로 순행할 때 농산을 넘어 공동산에 올랐다."
 building_type_TK_20_41_XuanWuShan: "명산"
 building_type_TK_20_41_XuanWuShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_XuanWuShan: "현무산"
 building_TK_20_41_XuanWuShan: "$TK_20_41_XuanWuShan$"
 building_TK_20_41_XuanWuShan_desc: "남해군 동쪽 경계의 바닷가에 작은 산등성이가 하나 있는데, 등성이 위에는 숲이 울창하고 남쪽으로는 망망대해가 펼쳐져 있다. 고기잡이를 나갔다 돌아오는 어부들은 멀리서 이 등성이를 보면 고향에 왔음을 안다."
 building_type_TK_20_41_YanDangShan: "명산"
 building_type_TK_20_41_YanDangShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_YanDangShan: "안탕산"
 building_TK_20_41_YanDangShan: "$TK_20_41_YanDangShan$"
 building_TK_20_41_YanDangShan_desc: "회계 남부의 바닷가 뭇 산으로, 기이한 봉우리와 괴석이 숲처럼 늘어서 있다. 산꼭대기에 갈대가 무성한 호수가 있어, 가을이면 기러기들이 많이 깃들어 자므로 안탕이라 이름했다고 전한다."
 building_type_TK_20_41_SanQingShan: "명산"
 building_type_TK_20_41_SanQingShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_SanQingShan: "삼청산"
 building_TK_20_41_SanQingShan: "$TK_20_41_SanQingShan$"
 building_TK_20_41_SanQingShan_desc: "파양 동쪽 경계에 산이 하나 있는데, 세 봉우리가 나란히 서 있어 마치 세 분의 존신이 산마루에 줄지어 앉은 듯하다. 산속에는 기이한 봉우리와 괴석이 있고, 구름과 안개가 일 년 내내 걷히지 않는다."
 building_type_TK_20_41_LaoShan: "명산"
 building_type_TK_20_41_LaoShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_LaoShan: "노산"
 building_TK_20_41_LaoShan: "$TK_20_41_LaoShan$"
 building_TK_20_41_LaoShan_desc: "동래군 불기현 동남쪽에 노산이 바다에 임해 솟아 있으니, 바다 위의 명산이라 일컬어진다. 전국 시대 이래로 방사들이 이곳에서 수련했으며, 효무황제가 동쪽으로 순행할 때 산 아래 불기현에 사당을 세우고 신에게 제사 지냈다."
 building_type_TK_20_41_ZhongNanShan: "명산"
 building_type_TK_20_41_ZhongNanShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_ZhongNanShan: "종남산"
 building_TK_20_41_ZhongNanShan: "$TK_20_41_ZhongNanShan$"
 building_TK_20_41_ZhongNanShan_desc: "종남산은 장안 남쪽에 가로놓여 남산이라고도 부르며, 수백 리에 걸쳐 봉우리가 겹겹이 이어진다. 산속에는 은사와 방사가 많고, 노자가 산 북쪽의 누관에서 윤희에게 도덕경 오천 언을 강론했다고 전한다."
 building_type_TK_20_41_MangDangShan: "명산"
 building_type_TK_20_41_MangDangShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_MangDangShan: "망탕산"
 building_TK_20_41_MangDangShan: "$TK_20_41_MangDangShan$"
 building_TK_20_41_MangDangShan_desc: "망탕산은 양국 경내에 있으며, 산과 늪이 깊고 험하다. 고조가 거사하기 전 망탕산의 산택 사이에 숨어 지냈는데, 머물던 곳에는 늘 구름 기운이 감돌았다. 훗날 양 효왕 이하 역대 양왕들이 대부분 산을 뚫어 능을 만들어 이곳에 영원히 잠들었다."
 building_type_TK_20_41_KunLunShan: "명산"
 building_type_TK_20_41_KunLunShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_KunLunShan: "곤륜산"
 building_TK_20_41_KunLunShan: "$TK_20_41_KunLunShan$"
 building_TK_20_41_KunLunShan_desc: "곤륜은 서방의 아주 먼 곳에 있는데, 천제의 아랫도읍이자 서왕모가 사는 곳이며 황하가 이곳에서 발원한다고 전한다. 효무황제는 옛 도서를 살펴, 우전 남쪽에서 황하가 나오는 큰 산을 곤륜이라 이름 지었다."
 building_type_TK_20_41_QiLianDaXueShan: "명산"
 building_type_TK_20_41_QiLianDaXueShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_QiLianDaXueShan: "기련 대설산"
 building_TK_20_41_QiLianDaXueShan: "$TK_20_41_QiLianDaXueShan$"
 building_TK_20_41_QiLianDaXueShan_desc: "기련산은 하서 여러 군의 남쪽에 가로놓여 있는데, 산꼭대기에는 일 년 내내 눈이 쌓여 있고 눈 녹은 물이 산 아래의 목장을 적셔 준다. 흉노는 이 산을 잃은 뒤 슬피 노래했다. “우리 기련산을 잃으니, 우리의 육축이 번성하지 못하는구나.”"
 building_type_TK_20_41_ZhuMuLangMaFeng: "명산"
 building_type_TK_20_41_ZhuMuLangMaFeng_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_ZhuMuLangMaFeng: "주무랑마봉"
 building_TK_20_41_ZhuMuLangMaFeng: "$TK_20_41_ZhuMuLangMaFeng$"
 building_TK_20_41_ZhuMuLangMaFeng_desc: "서남쪽 아주 먼 곳에 설산이 겹겹이 솟아 있는데, 그중 한 봉우리가 가장 높고 험하여 일 년 내내 얼음과 눈에 덮인 채 하늘을 찌른다. 그곳 토착민들은 이를 여신이 사는 곳으로 받들어 감히 함부로 다가가지 못한다."
 building_type_TK_20_41_BaiTouShan: "명산"
 building_type_TK_20_41_BaiTouShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_BaiTouShan: "백두산"
 building_TK_20_41_BaiTouShan: "$TK_20_41_BaiTouShan$"
 building_TK_20_41_BaiTouShan_desc: "동북쪽 아주 먼 곳에 불함산이 있는데, 산꼭대기에는 일 년 내내 눈이 쌓여 멀리서 보면 온통 새하얗다. 《산해경》에 따르면 숙신국이 바로 이 산 부근에 있다고 하며, 토착민들은 이를 신산으로 받든다."
 building_type_TK_20_41_WuLiangShan: "명산"
 building_type_TK_20_41_WuLiangShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_WuLiangShan: "무량산"
 building_TK_20_41_WuLiangShan: "$TK_20_41_WuLiangShan$"
 building_TK_20_41_WuLiangShan_desc: "익주 서남쪽의 뭇 산 가운데 몽락산은 봉우리가 끝없이 이어져 그 수를 헤아릴 수 없으므로 무량이라는 이름이 붙었다. 산속에는 나무가 하늘을 찌르고 장기가 자욱하며, 진귀한 새와 기이한 짐승이 그 사이를 드나든다."
 building_type_TK_20_41_DianCangShan: "명산"
 building_type_TK_20_41_DianCangShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_DianCangShan: "점창산"
 building_TK_20_41_DianCangShan: "$TK_20_41_DianCangShan$"
 building_TK_20_41_DianCangShan_desc: "점창산의 뭇 봉우리는 남북으로 길게 이어지는데, 봉우리 꼭대기의 눈은 해가 지나도 녹지 않고 산빛이 푸르러 이런 이름을 얻었다. 산간의 시냇물은 동쪽으로 흘러 모두 엽유택으로 들어간다."
 building_type_TK_20_41_YaoShan: "명산"
 building_type_TK_20_41_YaoShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_YaoShan: "요산"
 building_TK_20_41_YaoShan: "$TK_20_41_YaoShan$"
 building_TK_20_41_YaoShan_desc: "노양현 서쪽의 요산은 요임금의 후손 유루가 이곳에 사당을 세우고 선조에게 제사를 지냈다 하여 요산이라 이름했다고 전한다. 유씨 자손들은 이곳을 조상의 땅으로 여기며, 산속의 봉우리와 바위가 기이하고 빼어나며 숲과 샘이 맑고 그윽하다."
 building_type_TK_20_41_LangJiXuShan: "명산"
 building_type_TK_20_41_LangJiXuShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_LangJiXuShan: "낭거서산"
 building_TK_20_41_LangJiXuShan: "$TK_20_41_LangJiXuShan$"
 building_TK_20_41_LangJiXuShan_desc: "막북의 낭거서산이다. 효무황제 때 표기장군 곽거병이 멀리 흉노를 정벌하여 좌현왕을 크게 무찌르고, 낭거서산에서 봉제를 올리고 고연산에서 선제를 지낸 뒤 한해에 올랐다가 돌아왔다. 이로부터 낭거서산에서의 봉제는 천하 장병들이 꿈에도 바라는 공업이 되었다."
 building_type_TK_20_41_ZiJinShan: "명산"
 building_type_TK_20_41_ZiJinShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_ZiJinShan: "자금산"
 building_TK_20_41_ZiJinShan: "$TK_20_41_ZiJinShan$"
 building_TK_20_41_ZiJinShan_desc: "말릉성 동쪽의 종산은 산세가 용처럼 서려 있고, 바위가 햇빛 아래서 은은히 자줏빛을 띠니, 강동의 명산이다."
 building_type_TK_20_41_JinGangShan: "명산"
 building_type_TK_20_41_JinGangShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_JinGangShan: "금강산"
 building_TK_20_41_JinGangShan: "$TK_20_41_JinGangShan$"
 building_TK_20_41_JinGangShan_desc: "예인의 땅 바닷가에 있는 뭇 산으로, 봉우리가 천만이고 바위가 깎아지른 듯하며, 사계절의 경치가 저마다 다르고 가을이면 온 산의 단풍이 불타는 듯하다."
 building_type_TK_20_41_FuShiShan: "명산"
 building_type_TK_20_41_FuShiShan_desc: "명산은 구름 속으로 높이 솟아, 예로부터 방사와 은자들이 몸을 의탁하던 곳이었으니, 산속에는 신선 이야기가 많이 전해진다."
 TK_20_41_FuShiShan: "부사산"
 building_TK_20_41_FuShiShan: "$TK_20_41_FuShiShan$"
 building_TK_20_41_FuShiShan_desc: "왜 땅 동쪽에 높은 산이 하나 있는데, 그 모양이 엎어 놓은 삿갓 같고 산꼭대기에는 일 년 내내 눈이 쌓여 있으며 이따금 연기와 불을 뿜는다. 왜인들은 이를 신산으로 여겨, 멀리서 바라보기만 해도 절을 올린다."
 building_type_TK_20_50_ChangBaiShanTianChi: "호수와 늪"
 building_type_TK_20_50_ChangBaiShanTianChi_desc: "큰 늪이 아득히 넓어 물고기와 새우, 마름과 연근이 끝없이 나니, 물가의 백성들은 고기잡이와 사냥, 뱃일로 생계를 꾸린다."
 TK_20_50_ChangBaiShanTianChi: "장백산 천지"
 building_TK_20_50_ChangBaiShanTianChi: "$TK_20_50_ChangBaiShanTianChi$"
 building_TK_20_50_ChangBaiShanTianChi_desc: "불함산 꼭대기에 깊은 못이 하나 있는데, 사방을 뭇 봉우리가 둘러싸고 물빛은 짙푸르며 냉기가 사람을 엄습하고, 여러 큰 강이 모두 이 산에서 흘러나온다. 토착민들은 이를 신의 못으로 여겨 감히 함부로 다가가지 못한다."
 building_type_TK_20_50_XiHu: "호수와 늪"
 building_type_TK_20_50_XiHu_desc: "큰 늪이 아득히 넓어 물고기와 새우, 마름과 연근이 끝없이 나니, 물가의 백성들은 고기잡이와 사냥, 뱃일로 생계를 꾸린다."
 TK_20_50_XiHu: "서호"
 building_TK_20_50_XiHu: "$TK_20_50_XiHu$"
 building_TK_20_50_XiHu_desc: "전당현 서쪽에 호수가 하나 있는데, 삼면이 산으로 둘러싸이고 동쪽으로 성곽과 이웃해 있다. 일찍이 금소가 그 안에 나타났다 하여 명성호라고도 부른다고 전한다. 호수 빛과 산 빛이 사철 모두 아름답다."
 building_type_TK_20_50_QingHaiHu: "호수와 늪"
 building_type_TK_20_50_QingHaiHu_desc: "큰 늪이 아득히 넓어 물고기와 새우, 마름과 연근이 끝없이 나니, 물가의 백성들은 고기잡이와 사냥, 뱃일로 생계를 꾸린다."
 TK_20_50_QingHaiHu: "청해호"
 building_TK_20_50_QingHaiHu: "$TK_20_50_QingHaiHu$"
 building_TK_20_50_QingHaiHu_desc: "황중 서쪽에 큰 호수가 하나 있는데, 호숫물은 쓰고 짜며 푸른 물결이 아득히 넓으니, 강인들은 이를 비화강해라 부른다. 왕망 때 강인들을 꾀어 땅을 바치게 하고 호숫가에 서해군을 두었으나, 얼마 지나지 않아 버려지고 말았다."
 building_type_TK_20_50_YunMengZe: "호수와 늪"
 building_type_TK_20_50_YunMengZe_desc: "큰 늪이 아득히 넓어 물고기와 새우, 마름과 연근이 끝없이 나니, 물가의 백성들은 고기잡이와 사냥, 뱃일로 생계를 꾸린다."
 TK_20_50_YunMengZe: "운몽택"
 building_TK_20_50_YunMengZe: "$TK_20_50_YunMengZe$"
 building_TK_20_50_YunMengZe_desc: "초나라의 옛 큰 늪으로, 호수와 늪이 서로 이어지고 갈대와 물억새가 무성하다. 사마상여는 《자허부》에서 운몽이 사방 9백 리라 했으며, 초왕은 늘 늪 속에서 사냥을 즐겼다."
 building_type_TK_20_50_DongTingHu: "호수와 늪"
 building_type_TK_20_50_DongTingHu_desc: "큰 늪이 아득히 넓어 물고기와 새우, 마름과 연근이 끝없이 나니, 물가의 백성들은 고기잡이와 사냥, 뱃일로 생계를 꾸린다."
 TK_20_50_DongTingHu: "동정호"
 building_TK_20_50_DongTingHu: "$TK_20_50_DongTingHu$"
 building_TK_20_50_DongTingHu_desc: "동정호는 장사군 북쪽에 있어 상수, 자수, 원수, 예수 등 여러 강물이 모여들어 안개 낀 물결이 아득히 넓다. 호수 가운데의 군산은 상군이 사는 곳이라 전하는데, 순임금이 남쪽으로 순행하다 창오에서 붕어하자 두 왕비가 뒤쫓아 이곳에 이르러 대나무에 눈물을 뿌리니, 그 대나무가 얼룩대가 되었다고 한다."
 building_type_TK_20_50_TaiHu: "호수와 늪"
 building_type_TK_20_50_TaiHu_desc: "큰 늪이 아득히 넓어 물고기와 새우, 마름과 연근이 끝없이 나니, 물가의 백성들은 고기잡이와 사냥, 뱃일로 생계를 꾸린다."
 TK_20_50_TaiHu: "태호"
 building_TK_20_50_TaiHu: "$TK_20_50_TaiHu$"
 building_TK_20_50_TaiHu_desc: "태호는 옛날에 진택 또는 구구라 불렸으며, 오군과 단양 사이에 걸쳐 있고 호수 안에 섬들이 별처럼 흩어져 있다. 오왕 부차는 일찍이 호수 가운데의 부초에서 월군을 크게 무찔렀고, 월왕 구천이 오를 멸한 뒤 범려는 배를 띄워 오호로 떠나갔다."
 building_type_TK_20_50_ChaoHu: "호수와 늪"
 building_type_TK_20_50_ChaoHu_desc: "큰 늪이 아득히 넓어 물고기와 새우, 마름과 연근이 끝없이 나니, 물가의 백성들은 고기잡이와 사냥, 뱃일로 생계를 꾸린다."
 TK_20_50_ChaoHu: "소호"
 building_TK_20_50_ChaoHu: "$TK_20_50_ChaoHu$"
 building_TK_20_50_ChaoHu_desc: "소호는 거소현 남쪽에 있으며 호수 면이 넓어 8백 리 호천이라 일컬어진다. 옛날 거소성이 하룻밤 사이에 꺼져 큰 호수가 되었는데, 초 노파가 몸을 버려 마을 사람들을 깨웠다 하여, 마을 사람들이 그 은혜를 기려 초호라 불렀고 호수 가운데의 작은 산을 모산이라 했다고 전한다."
 building_type_TK_20_50_PoYangHu: "호수와 늪"
 building_type_TK_20_50_PoYangHu_desc: "큰 늪이 아득히 넓어 물고기와 새우, 마름과 연근이 끝없이 나니, 물가의 백성들은 고기잡이와 사냥, 뱃일로 생계를 꾸린다."
 TK_20_50_PoYangHu: "파양호"
 building_TK_20_50_PoYangHu: "$TK_20_50_PoYangHu$"
 building_TK_20_50_PoYangHu_desc: "팽려택은 예장군 북쪽, 큰 강의 남쪽에 있으며 호수 면이 아득히 넓다. 《우공》에 ‘팽려가 이미 물을 모았다’고 했으니, 대우가 치수한 뒤로 뭇 물줄기가 이곳에 모여들었다. 호수 가운데에 파양산이 물 위에 홀로 솟아 있어, 오가는 뱃사람들이 흔히 이 산을 표지로 삼는다."
 building_type_TK_20_50_RiYueTan: "호수와 늪"
 building_type_TK_20_50_RiYueTan_desc: "큰 늪이 아득히 넓어 물고기와 새우, 마름과 연근이 끝없이 나니, 물가의 백성들은 고기잡이와 사냥, 뱃일로 생계를 꾸린다."
 TK_20_50_RiYueTan: "일월담"
 building_TK_20_50_RiYueTan: "$TK_20_50_RiYueTan$"
 building_TK_20_50_RiYueTan_desc: "동해 밖 이주섬에는 뭇 산이 깊은 못 하나를 감싸 안고 있는데, 못 가운데에 작은 섬이 있고, 북쪽 절반은 둥근 해 같고 남쪽 절반은 초승달 같은 모양이다. 섬의 토착민들은 고기잡이와 사냥으로 살아가며, 통나무배를 타고 물 위를 오간다."
 building_type_TK_20_50_YueYaQuan: "호수와 늪"
 building_type_TK_20_50_YueYaQuan_desc: "큰 늪이 아득히 넓어 물고기와 새우, 마름과 연근이 끝없이 나니, 물가의 백성들은 고기잡이와 사냥, 뱃일로 생계를 꾸린다."
 TK_20_50_YueYaQuan: "월아천"
 building_TK_20_50_YueYaQuan: "$TK_20_50_YueYaQuan$"
 building_TK_20_50_YueYaQuan_desc: "돈황성 남쪽 명사산 아래에 샘물 한 줄기가 있는데, 생김새가 초승달 같다. 사방이 모두 유사인데도 샘물은 끝내 모래에 덮이지 않아 사람들은 사정이라 부른다. 샘가에는 물과 풀이 풍성하여, 오가는 상인들이 자주 이곳에서 말에게 물을 먹인다."
 building_type_TK_20_50_LuGuHu: "호수와 늪"
 building_type_TK_20_50_LuGuHu_desc: "큰 늪이 아득히 넓어 물고기와 새우, 마름과 연근이 끝없이 나니, 물가의 백성들은 고기잡이와 사냥, 뱃일로 생계를 꾸린다."
 TK_20_50_LuGuHu: "노고호"
 building_TK_20_50_LuGuHu: "$TK_20_50_LuGuHu$"
 building_TK_20_50_LuGuHu_desc: "월수군 서남쪽의 깊은 산속에 고산 호수가 하나 있는데, 호숫물이 맑아 사방의 푸른 산이 그 안에 거꾸로 비친다. 호숫가의 이인들은 배를 타고 오가며, 혼인 풍속이 중원과 사뭇 다르다."
 building_type_TK_20_50_SaiLiMuHu: "호수와 늪"
 building_type_TK_20_50_SaiLiMuHu_desc: "큰 늪이 아득히 넓어 물고기와 새우, 마름과 연근이 끝없이 나니, 물가의 백성들은 고기잡이와 사냥, 뱃일로 생계를 꾸린다."
 TK_20_50_SaiLiMuHu: "새리목호"
 building_TK_20_50_SaiLiMuHu: "$TK_20_50_SaiLiMuHu$"
 building_TK_20_50_SaiLiMuHu_desc: "오손국 경내 천산 북쪽 기슭의 높은 곳에 큰 호수가 하나 있는데, 호숫물이 차고 맑아 바닥이 보일 정도이며 물속에는 물고기도 새우도 살지 않는다. 오손의 목자들은 호숫가 초원에서 말 떼를 놓아 기른다."
 building_type_TK_20_51_HuangGuoShuPuBu: "폭포와 급류"
 building_type_TK_20_51_HuangGuoShuPuBu_desc: "물이 높은 벼랑에서 쏟아져 내리니 천둥 같은 소리가 나고 물안개가 자욱하여, 몇 리 밖에서도 그 소리를 들을 수 있다."
 TK_20_51_HuangGuoShuPuBu: "황과수 폭포"
 building_TK_20_51_HuangGuoShuPuBu: "$TK_20_51_HuangGuoShuPuBu$"
 building_TK_20_51_HuangGuoShuPuBu_desc: "장가군 경내의 깊은 산속에서 백수하가 이곳에 이르러 갑자기 떨어지니, 날리는 폭포가 못으로 쏟아지며 천둥 같은 소리를 내고 물안개가 몇 리 밖까지 자욱하다. 토착민들은 폭포 곁에 누런 열매가 열리는 신령한 나무가 있었다고 전한다."
 building_type_TK_20_51_HuKouPuBu: "폭포와 급류"
 building_type_TK_20_51_HuKouPuBu_desc: "물이 높은 벼랑에서 쏟아져 내리니 천둥 같은 소리가 나고 물안개가 자욱하여, 몇 리 밖에서도 그 소리를 들을 수 있다."
 TK_20_51_HuKouPuBu: "호구 폭포"
 building_TK_20_51_HuKouPuBu: "$TK_20_51_HuKouPuBu$"
 building_TK_20_51_HuKouPuBu_desc: "큰 강이 내달려 이곳에 이르면 양쪽 기슭의 석벽이 좁아져 강어귀가 병 주둥이처럼 좁아지니, 흐린 물결이 높은 벼랑에서 쏟아져 내려 그 소리가 몇 리를 울리고 물안개가 피어오른다. 《우공》에 실린 호구가 바로 이곳이다."
 building_type_TK_20_52_QinHuaiHe: "물 위의 풍광"
 building_type_TK_20_52_QinHuaiHe_desc: "한 줄기 강물에 양쪽 기슭의 인가, 그 위로 배가 지나가니 풍광이 그림 같다."
 TK_20_52_QinHuaiHe: "진회하"
 building_TK_20_52_QinHuaiHe: "$TK_20_52_QinHuaiHe$"
 building_TK_20_52_QinHuaiHe_desc: "회수가 동남쪽의 뭇 산에서 흘러와 말릉을 굽이굽이 지나 큰 강으로 들어간다. 시황제가 동쪽으로 순행할 때 금릉에 천자의 기운이 서린 것을 보고, 사람을 시켜 방산을 뚫어 회수가 그 사이로 흐르게 하여 그 기운을 빼 버렸다고 전한다."
 building_type_TK_20_52_MiLuoJiang: "물 위의 풍광"
 building_type_TK_20_52_MiLuoJiang_desc: "한 줄기 강물에 양쪽 기슭의 인가, 그 위로 배가 지나가니 풍광이 그림 같다."
 TK_20_52_MiLuoJiang: "멱라강"
 building_TK_20_52_MiLuoJiang: "$TK_20_52_MiLuoJiang$"
 building_TK_20_52_MiLuoJiang_desc: "멱수와 나수가 장사군 나현 경내에서 합류하므로 멱라라 이름했다. 초나라 삼려대부 굴원이 강남으로 쫓겨났다가, 영도가 진군에게 함락되자 돌을 품고 이 강에 몸을 던졌다. 해마다 오월 초닷새가 되면 초나라 사람들이 강 위에서 배를 겨루니, 굴원을 건지기 위해서라고 전한다."
 building_type_TK_20_52_LiJiang: "물 위의 풍광"
 building_type_TK_20_52_LiJiang_desc: "한 줄기 강물에 양쪽 기슭의 인가, 그 위로 배가 지나가니 풍광이 그림 같다."
 TK_20_52_LiJiang: "이강"
 building_TK_20_52_LiJiang: "$TK_20_52_LiJiang$"
 building_TK_20_52_LiJiang_desc: "이수는 월성교에서 발원하여 시황제가 판 영거를 통해 상수와 이어지고, 남쪽으로 흘러 창오로 들어간다. 양쪽 기슭에는 기이한 봉우리가 죽순 같고 비녀 같이 늘어서 있고, 강물은 푸르고 맑다."
 building_type_TK_20_60_JiuZhaiGou: "종합 명승지"
 building_type_TK_20_60_JiuZhaiGou_desc: "깊은 산속에 호수와 못, 숲과 샘이 층층이 어우러져 경치가 기이하고 아름다우나, 찾는 이가 드물다."
 TK_20_60_JiuZhaiGou: "구채구"
 building_TK_20_60_JiuZhaiGou: "$TK_20_60_JiuZhaiGou$"
 building_TK_20_60_JiuZhaiGou_desc: "민산 북쪽의 깊은 산속, 골짜기 사이에 호수가 층층이 이어져 물빛이 짙푸르고 알록달록하니 마치 구슬을 꿴 듯하다. 저강의 여러 부족이 골짜기에 흩어져 살며 대대로 농사와 목축으로 살아간다."
 building_type_TK_20_60_HuangLongJingQu: "종합 명승지"
 building_type_TK_20_60_HuangLongJingQu_desc: "깊은 산속에 호수와 못, 숲과 샘이 층층이 어우러져 경치가 기이하고 아름다우나, 찾는 이가 드물다."
 TK_20_60_HuangLongJingQu: "황룡 명승지"
 building_TK_20_60_HuangLongJingQu: "$TK_20_60_HuangLongJingQu$"
 building_TK_20_60_HuangLongJingQu_desc: "민산 깊은 곳의 한 산등성이에 금빛 돌못이 층층이 깔려 있고 그 사이로 물이 흐르니, 멀리서 보면 마치 누런 용 한 마리가 설산에서 구불구불 내려오는 듯하다. 강인들은 이를 신의 자취로 여겨 때마다 제사를 지낸다."
 building_type_TK_20_61_CangShanErHai: "산수의 풍광"
 building_type_TK_20_61_CangShanErHai_desc: "산과 물이 서로 비추고 풍물이 맑고 아름다워, 문인과 선비, 오가는 길손들이 자주 이곳에 머물며 돌아갈 줄을 모른다."
 TK_20_61_CangShanErHai: "창산 이해"
 building_TK_20_61_CangShanErHai: "$TK_20_61_CangShanErHai$"
 building_TK_20_61_CangShanErHai_desc: "엽유택은 푸른 물결이 넘실거리고 서쪽 기슭의 점창산이 그 안에 거꾸로 비치니, 산과 물이 서로 어우러져 풍물이 더없이 아름답다. 못가의 곤명 여러 부족은 고기잡이와 사냥, 농사와 목축으로 살아간다."
 building_type_TK_20_61_TianYaHaiJiao: "산수의 풍광"
 building_type_TK_20_61_TianYaHaiJiao_desc: "산과 물이 서로 비추고 풍물이 맑고 아름다워, 문인과 선비, 오가는 길손들이 자주 이곳에 머물며 돌아갈 줄을 모른다."
 TK_20_61_TianYaHaiJiao: "천애해각"
 building_TK_20_61_TianYaHaiJiao: "$TK_20_61_TianYaHaiJiao$"
 building_TK_20_61_TianYaHaiJiao_desc: "남해 가운데의 큰 섬으로, 효무황제가 남월을 평정한 뒤 이곳에 주애와 담이 두 군을 두었으나, 반란이 거듭 일어나자 폐지했다. 섬 남쪽 끝 바닷가에는 거대한 바위들이 우뚝우뚝 서서 망망대해를 마주하니, 마치 하늘의 끝에 이른 듯하다."
 building_type_TK_20_61_CaiShiJi: "산수의 풍광"
 building_type_TK_20_61_CaiShiJi_desc: "산과 물이 서로 비추고 풍물이 맑고 아름다워, 문인과 선비, 오가는 길손들이 자주 이곳에 머물며 돌아갈 줄을 모른다."
 TK_20_61_CaiShiJi: "채석기"
 building_TK_20_61_CaiShiJi: "$TK_20_61_CaiShiJi$"
 building_TK_20_61_CaiShiJi_desc: "우저산이 큰 강으로 돌출해 있어 절벽이 물에 닿아 있고, 강물이 이곳에 이르면 물살이 급해진다. 이곳은 강동과 강북 사이의 중요한 나루로, 강을 건너려는 병가들이 흔히 이 길을 택한다."
 building_type_TK_20_61_GuLangYu: "산수의 풍광"
 building_type_TK_20_61_GuLangYu_desc: "산과 물이 서로 비추고 풍물이 맑고 아름다워, 문인과 선비, 오가는 길손들이 자주 이곳에 머물며 돌아갈 줄을 모른다."
 TK_20_61_GuLangYu: "고랑서"
 building_TK_20_61_GuLangYu: "$TK_20_61_GuLangYu$"
 building_TK_20_61_GuLangYu_desc: "민 땅의 만 안에 있는 작은 섬으로, 섬 서남쪽에 암초가 있어 밀물 때마다 파도가 암초를 때리면 북을 치는 듯한 소리가 난다."
 building_type_TK_20_61_KeKeXiLi: "산수의 풍광"
 building_type_TK_20_61_KeKeXiLi_desc: "산과 물이 서로 비추고 풍물이 맑고 아름다워, 문인과 선비, 오가는 길손들이 자주 이곳에 머물며 돌아갈 줄을 모른다."
 TK_20_61_KeKeXiLi: "가가서리"
 building_TK_20_61_KeKeXiLi: "$TK_20_61_KeKeXiLi$"
 building_TK_20_61_KeKeXiLi_desc: "서강의 땅 서쪽은 춥고 황량한 고원으로, 지세가 높고 험하여 인적이 드물다. 고원 위로 들소와 영양 떼가 내달리고, 이따금 사냥꾼이 뒤쫓아 오지만 대개는 찬바람이 두려워 되돌아간다."
 building_type_TK_20_61_LanYanJing: "산수의 풍광"
 building_type_TK_20_61_LanYanJing_desc: "산과 물이 서로 비추고 풍물이 맑고 아름다워, 문인과 선비, 오가는 길손들이 자주 이곳에 머물며 돌아갈 줄을 모른다."
 TK_20_61_LanYanJing: "푸른 눈"
 building_TK_20_61_LanYanJing: "$TK_20_61_LanYanJing$"
 building_TK_20_61_LanYanJing_desc: "흉노 북쪽 경계의 북해는 호숫물이 깊고 넓으며, 한겨울이면 거울처럼 얼어붙는다. 효무황제 때 소무는 흉노에 사신으로 갔다가 굴복하지 않아 북해 가로 유배되어 양을 쳤으나, 19년 동안 절부를 잃지 않았다."
 building_type_TK_20_62_XuanLanJiGuang: "자연 경관"
 building_type_TK_20_62_XuanLanJiGuang_desc: "천지가 빚어낸 기이한 경관으로, 사람의 힘으로는 미칠 수 없으니 보는 이마다 감탄하지 않는 이가 없다."
 TK_20_62_XuanLanJiGuang: "찬란한 극광"
 building_TK_20_62_XuanLanJiGuang: "$TK_20_62_XuanLanJiGuang$"
 building_TK_20_62_XuanLanJiGuang_desc: "북방의 아주 먼 땅에서는 겨울밤 하늘에 오색 빛 기운이 자주 나타나, 휘장 같기도 하고 장막 같기도 하며 밝았다 어두웠다 하는 것이 깃발이 펄럭이는 듯하다. 어떤 이는 이것이 바로 《산해경》에 나오는, 촛불을 물고 북방의 어둠을 비추는 촉룡이라 한다."
 building_type_TK_20_62_ChiLeChuan: "자연 경관"
 building_type_TK_20_62_ChiLeChuan_desc: "천지가 빚어낸 기이한 경관으로, 사람의 힘으로는 미칠 수 없으니 보는 이마다 감탄하지 않는 이가 없다."
 TK_20_62_ChiLeChuan: "칙륵천"
 building_TK_20_62_ChiLeChuan: "$TK_20_62_ChiLeChuan$"
 building_TK_20_62_ChiLeChuan_desc: "음산 기슭의 큰 들판으로, 물과 풀이 풍성하고 끝없이 펼쳐져 있어, 바람이 지나는 곳마다 풀 물결이 일렁이고 소와 양이 그 사이로 보였다 숨었다 한다. 흉노의 묵돌 선우는 일찍이 음산에 기대어 이곳을 원유로 삼았다."
 building_type_TK_20_62_DaoChengYaDingJingQu: "자연 경관"
 building_type_TK_20_62_DaoChengYaDingJingQu_desc: "천지가 빚어낸 기이한 경관으로, 사람의 힘으로는 미칠 수 없으니 보는 이마다 감탄하지 않는 이가 없다."
 TK_20_62_DaoChengYaDingJingQu: "도성 아정 명승지"
 building_TK_20_62_DaoChengYaDingJingQu: "$TK_20_62_DaoChengYaDingJingQu$"
 building_TK_20_62_DaoChengYaDingJingQu_desc: "서남쪽 변경 밖 설원 깊은 곳에 세 설산이 솥발처럼 서 있고, 봉우리 꼭대기에는 일 년 내내 눈이 쌓여 있다. 산 아래 호수는 맑고 푸르며 향기로운 풀이 융단 같으니, 토착민들은 세 산을 신령으로 여긴다."
 building_type_TK_20_62_ShuNanZhuHai: "자연 경관"
 building_type_TK_20_62_ShuNanZhuHai_desc: "천지가 빚어낸 기이한 경관으로, 사람의 힘으로는 미칠 수 없으니 보는 이마다 감탄하지 않는 이가 없다."
 TK_20_62_ShuNanZhuHai: "촉남 죽해"
 building_TK_20_62_ShuNanZhuHai: "$TK_20_62_ShuNanZhuHai$"
 building_TK_20_62_ShuNanZhuHai_desc: "건위군 북도현 남쪽의 산마루 사이에 대숲이 수백 리에 걸쳐 이어져, 바람이 불면 댓잎 물결이 바다와 같다. 북인들은 숲속에서 대나무를 베어 집을 짓고, 대나무를 엮어 기물을 만든다."
 building_type_TK_20_62_LinZhiTaoHuaYuan: "자연 경관"
 building_type_TK_20_62_LinZhiTaoHuaYuan_desc: "천지가 빚어낸 기이한 경관으로, 사람의 힘으로는 미칠 수 없으니 보는 이마다 감탄하지 않는 이가 없다."
 TK_20_62_LinZhiTaoHuaYuan: "임지 도화원"
 building_TK_20_62_LinZhiTaoHuaYuan: "$TK_20_62_LinZhiTaoHuaYuan$"
 building_TK_20_62_LinZhiTaoHuaYuan_desc: "서남쪽 설산 깊은 곳에 강 골짜기가 하나 있는데, 강물이 옥처럼 푸르고 봄이면 복숭아꽃이 들판 가득 피며, 눈 덮인 봉우리가 구름과 안개 사이로 보일 듯 말 듯하니 마치 속세 밖과 같다."
 building_type_TK_20_62_LinHaiXueYuan: "자연 경관"
 building_type_TK_20_62_LinHaiXueYuan_desc: "천지가 빚어낸 기이한 경관으로, 사람의 힘으로는 미칠 수 없으니 보는 이마다 감탄하지 않는 이가 없다."
 TK_20_62_LinHaiXueYuan: "임해 설원"
 building_TK_20_62_LinHaiXueYuan: "$TK_20_62_LinHaiXueYuan$"
 building_TK_20_62_LinHaiXueYuan_desc: "부여 북쪽, 읍루가 사는 깊은 산속은 나무가 해를 가리고 겨울이면 눈이 무릎까지 쌓인다. 읍루 사람들은 산림 속 굴에서 살며 활을 잘 쏘고, 겨울에는 돼지기름을 몸에 발라 추위를 막는다."
 building_type_TK_20_63_WuXia: "강 골짜기의 풍광"
 building_type_TK_20_63_WuXia_desc: "큰 강이 산을 뚫고 지나가니, 양쪽 기슭에는 봉우리가 마주 솟아 있고 골짜기에는 물소리가 종일 그치지 않는다."
 TK_20_63_WuXia: "무협"
 building_TK_20_63_WuXia: "$TK_20_63_WuXia$"
 building_TK_20_63_WuXia_desc: "큰 강이 무산을 뚫고 지나가는데, 양쪽 기슭에는 뭇 봉우리가 끝없이 이어지고 바위가 겹겹이 쌓여 하늘을 가리고 해를 덮으니, 원숭이 울음소리가 종일 그치지 않는다. 무산의 신녀는 아침에는 떠가는 구름이 되고 저녁에는 내리는 비가 된다 하며, 초왕이 일찍이 꿈속에서 그녀와 만났다고 전한다."
 building_type_TK_20_63_YiLiHeGu: "강 골짜기의 풍광"
 building_type_TK_20_63_YiLiHeGu_desc: "큰 강이 산을 뚫고 지나가니, 양쪽 기슭에는 봉우리가 마주 솟아 있고 골짜기에는 물소리가 종일 그치지 않는다."
 TK_20_63_YiLiHeGu: "이리하 골짜기"
 building_TK_20_63_YiLiHeGu: "$TK_20_63_YiLiHeGu$"
 building_TK_20_63_YiLiHeGu_desc: "오손국이 자리한 강 골짜기로, 삼면이 산으로 둘러싸이고 강물이 서쪽으로 흐르며 초원이 기름져 말이 번성한다. 효무황제 때 세군공주와 해우공주가 잇달아 멀리 오손으로 시집가니, 한나라와 오손은 이로써 혼인으로 맺어진 나라가 되었다."
 building_type_TK_20_63_YaLuCangBuDaXiaGu: "강 골짜기의 풍광"
 building_type_TK_20_63_YaLuCangBuDaXiaGu_desc: "큰 강이 산을 뚫고 지나가니, 양쪽 기슭에는 봉우리가 마주 솟아 있고 골짜기에는 물소리가 종일 그치지 않는다."
 TK_20_63_YaLuCangBuDaXiaGu: "아로장포 대협곡"
 building_TK_20_63_YaLuCangBuDaXiaGu: "$TK_20_63_YaLuCangBuDaXiaGu$"
 building_TK_20_63_YaLuCangBuDaXiaGu_desc: "서남쪽 설원 가운데 큰 강 하나가 뭇 산 사이를 쪼개어 깊은 협곡을 이루니, 양쪽 기슭은 만 길 절벽이고 단단한 얼음이 매달려 있으며, 강물은 내달리며 울부짖는다. 협곡 안은 숲이 해를 가리고 맹수가 드나들어 인적이 드물다."
