l_korean:
 hd_embattle_retry_deputies_decision:0 "부장 공석 재점검"
 hd_embattle_retry_deputies_decision_desc:0 "여러 군이 오래도록 전전하는 사이, 양익의 부장들이 다치거나 떠나 어떤 자리는 오랫동안 비어 있어도 끝내 채워지지 않았다. 당신은 각 군에 명을 내려 다시 점검하게 한다. 여전히 자리를 지키는 부장은 그대로 유임하고, 빈자리는 휘하에서 다시 사람을 고른다."
 hd_embattle_retry_deputies_decision_tooltip:0 "여러 군의 양익을 점검하여 부장 공석을 채움"
 hd_embattle_retry_deputies_decision_confirm:0 "여러 군을 점검하라!"
 hd_embattle_retry_deputies_decision_effect:0 "각 군에서 여전히 자리를 지키는 부장은 그대로 유임합니다. 빈자리는, 당신이 앞서 일부러 비워 둔 자리까지 포함하여 모두 휘하에서 다시 사람을 고릅니다. 당장 채울 사람이 없는 자리는 잠시 비워 둔 채 기다립니다."
