 nick_hd_xiaobawang: "小霸王"
 nick_hd_xiaobawang_desc: "猛锐冠世，志陵中夏，时人比之项籍，号曰「小霸王」。"
 hd_sc_bawang_army: "江东子弟"
 hd_sc_bawang.0001.t: "江东小霸王"
 hd_sc_bawang.0001.desc: "自渡江以来，[ROOT.Char.GetFirstName]转斗千里，所向皆破，江东豪杰望风归附。如今裂土称尊，威震江表，士民畏其锋锐，皆以项羽比之，呼为「小霸王」。\n\n旧部闻讯，携子弟三千来投，愿随麾下效死。"
 hd_sc_bawang.0001.a: "吾当与天下争衡！"
 nick_hd_da_qiao: "대교"
 nick_hd_da_qiao_desc: "교공의 장녀. 동생과 함께 절세미인으로 이름났으며 손책에게 시집갔다."
 nick_hd_xiao_qiao: "소교"
 nick_hd_xiao_qiao_desc: "교공의 차녀. 언니와 함께 절세미인으로 이름났으며 주유에게 시집갔다."
