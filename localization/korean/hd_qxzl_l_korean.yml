l_korean:
 hd_qxzl.0001.t:0 "군웅축록"
 hd_qxzl.0001.desc:0 "동탁 토벌의 맹약이 흩어진 뒤로, 각지에서 전해지는 명령은 갈수록 엇갈렸다. 지난날 함께 군사를 일으켰던 이들은 저마다 본거지로 돌아갔고, 조정의 문서는 여전히 오가고 있지만, 실제로 군마를 움직이는 것은 대개 각자가 손에 쥔 돈과 곡식이었다.\n\n당신에게도 휘하의 관리와 다스리는 백성이 있다. 옛 주군을 계속 섬긴다면 본래의 명분으로 위아래를 묶어 둘 수 있다. 그러나 이대로 통제에서 벗어난다면, 다스리는 땅의 안위는 온전히 스스로 짊어져야 하며, 더는 매사에 윗선의 회답을 기다릴 수 없다.\n\n책상 앞에서 누군가 다음 문서는 여전히 어디로 보내야 하느냐고 묻는다. 아직 봉하지 않은 편지를 바라보며, 당신은 오늘의 결단이 한마디 호언장담에 있는 것이 아니라, 앞으로 내려질 모든 명령에 과연 누가 도장을 찍느냐에 달려 있음을 깨닫는다."
 hd_qxzl.0001.a:0 "스스로 일가를 이루어, 더는 남의 통제를 받지 않으리라."
 hd_qxzl.0001.b:0 "군신의 분수는 가벼이 버릴 수 없다."
 hd_qxzl_independence_tt:0 "당신은 이제 옛 주군의 통제에서 벗어나 독자적인 세력을 이룹니다."
 hd_qxzl_ineligible_tt:0 "시세가 바뀌어 자립은 더 이상 논할 수 없습니다."
