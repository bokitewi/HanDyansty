l_korean:
 hd_qin_lun_name:0 "진론"
 hd_qin_lun.0001.t:0 "이역에서 온 손님"
 hd_qin_lun.0001.desc:0 "코가 높고 눈이 깊은 이방인 하나가 누군가의 소개로 당신의 당하에 찾아와 뵙기를 청했다. 그는 자신을 진론이라 하며, 만 리 밖의 대진국에서 교지를 거쳐 바다를 건너왔다고 했다. 말하는 가운데 천문과 산술과 이역의 전적에 통달해 있음이 드러났다.\n\n당상의 사람들은 이런 생김새를 처음 보는지라 저마다 수군거렸다. 그러나 그는 침착하게 예를 올리며, 평생 배운 바를 어진 주군께 바치고 싶으니 몸 둘 곳만 있으면 된다고 말했다."
 hd_qin_lun.0001.a:0 "이 사람은 쓸모가 있으니, 곁에 둔다."
 hd_qin_lun.0001.b:0 "노자를 주어 길을 떠나보낸다."
