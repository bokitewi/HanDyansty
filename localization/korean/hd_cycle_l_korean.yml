l_korean:
 # ===== 天朝循环大修：新时代 =====
 situation_dynastic_cycle_phase_hd_recovery: "백폐대흥"
 situation_dynastic_cycle_phase_hd_recovery_icon: "@hd_dc_dynastic_cycle_recovery_icon!$situation_dynastic_cycle_phase_hd_recovery$"
 situation_dynastic_cycle_phase_hd_recovery_desc_short: "난세가 막 그쳐 온갖 것이 다시 일어나기를 기다린다. 전란이 잦아들고 전답이 다시 개간되며 인심은 안정을 바란다."
 situation_dynastic_cycle_phase_hd_recovery_desc: "$situation_dynastic_cycle_phase_hd_recovery_desc_short$\n\n이 [dynastic_cycle_era_short|E]에는 전란이 점차 잦아들고 유민이 고향의 밭으로 돌아오며 군현이 날로 넉넉해집니다. 조정이 맑게 다스려진다면 천하는 정통인화나 개강척토의 시대로 나아갈 수 있으나, 대처를 그르쳐 암류가 다시 일어나면 국세 긴장으로 다시 빠져들 것입니다.\n\n천하 안에서는 오직 [son_of_heaven|E]만이 [kingdom|E](을)를 창설할 수 있으며, [empire|E](은)는 새로 세울 수 없습니다."
 dynastic_cycle_situation_dynastic_cycle_phase_hd_recovery_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"

 situation_dynastic_cycle_phase_hd_collapse: "천하 붕괴"
 situation_dynastic_cycle_phase_hd_collapse_icon: "@hd_dc_dynastic_cycle_collapse_icon!$situation_dynastic_cycle_phase_hd_collapse$"
 situation_dynastic_cycle_phase_hd_collapse_desc_short: "왕조의 말세에 기강이 무너졌다. 재이가 잇따르고 도적이 벌떼처럼 일어나며, 주군은 저마다 딴마음을 품고 있다."
 situation_dynastic_cycle_phase_hd_collapse_desc: "$situation_dynastic_cycle_phase_hd_collapse_desc_short$\n\n이 [dynastic_cycle_era_short|E]에는 조정이 2년마다 위기를 하나씩 겪습니다. 강번이 찬탈하여 황제를 칭하거나, 백성이 들고일어나거나, 조정의 위신이 땅에 떨어지는 것입니다. 천재와 유적의 소식도 때때로 들려옵니다.\n\n중화의 [hegemony|E]에 주인이 없거나 [son_of_heaven|E](이)가 장악한 천하의 법리상 [counties|E](이)가 4할에 미치지 못하면 천하는 즉시 군웅축록에 빠집니다. 군권이 최고 단계에 이르지 못했다면 해마다 천하를 군웅축록 쪽으로 밀어냅니다. [son_of_heaven|E](이)가 위기를 평정하고 기강을 다시 세운다면 국세 긴장으로 되돌릴 수 있습니다."
 dynastic_cycle_situation_dynastic_cycle_phase_hd_collapse_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"

 situation_dynastic_cycle_phase_hd_standoff: "정족대치"
 situation_dynastic_cycle_phase_hd_standoff_icon: "@hd_dc_dynastic_cycle_standoff_icon!$situation_dynastic_cycle_phase_hd_standoff$"
  situation_dynastic_cycle_phase_instability_conquest_icon: "@hd_dc_dynastic_cycle_new_dynasty_icon!$situation_dynastic_cycle_phase_instability_conquest$"
 situation_dynastic_cycle_phase_hd_standoff_desc_short: "군웅의 판도가 이미 정해졌다. 여러 강자가 한 지방씩 할거하여 서로를 견제하니, 천하는 기나긴 대치에 빠졌다."
 situation_dynastic_cycle_phase_hd_standoff_desc: "$situation_dynastic_cycle_phase_hd_standoff_desc_short$\n\n이 [dynastic_cycle_era_short|E]에는 각 세력의 부고가 점차 넉넉해지고 정통이 나날이 굳어지지만, 이웃 나라를 엿보지 않는 날이 하루도 없습니다. 누군가 맹약을 깨거나, 적의 신하를 회유하거나, 내란을 일으키거나, 한 번의 전쟁에서 큰 전과를 올리거나, 어린 군주가 즉위하거나, 사이의 침입이 성공하거나, 강번이 즐비해지면 천하는 다시 군웅축록으로 돌아갑니다. 아들을 볼모로 보내거나 금화를 바쳐 화친을 구하면 전란을 잠시 늦출 수 있습니다.\n\n천하 법리상 [counties|E]의 8할을 장악하고 이미 대관식을 치렀으며 충분한 [legitimacy|E]나 위신을 갖춘 통치자만이 난세를 끝낼 수 있습니다."
 dynastic_cycle_situation_dynastic_cycle_phase_hd_standoff_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"

