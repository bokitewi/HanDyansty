 natural_disaster_hd_famine_warning_situation_phase_desc: "오랜 가뭄에 비가 내리지 않고 메뚜기 떼가 사방에서 일어나니, 가을 수확은 이미 가망이 없다."
 natural_disaster_hd_famine_impact_situation_phase: "기근"
 natural_disaster_hd_famine_impact_situation_phase_desc: "곡식 값이 치솟고 굶어 죽은 이가 들판에 가득하며 유민이 사방으로 흩어진다."
 natural_disaster_hd_famine_recovery_situation_phase: "회복"
 natural_disaster_hd_famine_recovery_situation_phase_desc: "$natural_disaster_earthquake_recovery_situation_phase_desc$"
