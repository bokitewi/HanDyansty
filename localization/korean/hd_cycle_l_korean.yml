 natural_disaster_hd_famine_sub_region_disaster_area_desc: "$natural_disaster_earthquake_sub_region_disaster_area_desc$"
 hd_famine.0001.t: "해마다 크게 굶주리다"
 hd_famine.0001.desc: "다스리는 땅 곳곳에서 낟알 하나 거두지 못했다. 곡식 값은 하루에 세 번씩 오르고, 성 밖의 굶주린 백성은 노인을 부축하고 아이를 이끈 채 길을 따라 걸식한다. 관리들이 재해 보고서를 받쳐 들고 당하에서 당신의 지시를 기다린다."
 hd_famine.0001.a: "창고를 열어 곡식을 풀고 굶주린 백성을 살린다."
 hd_famine.0001.b: "흉년이라도 세금은 거두어 부고를 채워야 한다."
 hd_famine.0001.c: "천재는 사람의 힘으로 어찌할 수 없다."

