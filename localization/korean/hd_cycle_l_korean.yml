 # ===== 崩溃期事件 =====
 hd_collapse.2002.t: "새 주인을 옹립하다"
 hd_collapse.2002.desc: "누군가 은밀히 사람들을 규합하여 강번 하나를 옹립해 천자를 대신하려 한다. 밀사가 이미 당신의 저택에 와서, 이 거사에 함께하기를 청하고 있다."
 hd_collapse.2002.a: "기꺼이 뒤를 따르겠소."
 hd_collapse.2002.b: "나는 여전히 조정에 충성하오."
 hd_collapse.4001.t: "조정의 위신 추락"
 hd_collapse.4001.desc: "주군은 저마다 제멋대로 다스리고, 조령은 경기 밖으로 나가지 못하며, 조당의 주대도 갈수록 건성이다. 당신은 마음속으로 알고 있다. 무언가를 취하고 버리지 않으면 조정은 지금 남은 이 체면조차 지키기 어렵다는 것을."
 hd_collapse.4001.a: "주군에 권한을 넘겨 구차한 안정이라도 구한다."
 hd_collapse.4001.b: "죄기조를 내려 인심을 수습한다."
 hd_collapse.4001.c: "군신을 억눌러 위권을 잃지 않는다."

