l_korean:
 hd_dc_ord.0019.c: "서로 믿는 이에게 보증을 서게 하고, 먼저 서신을 주고받는다."
 hd_dc_ord.0019.c.tt: "[hd_dc_visitor.GetTitledFirstName](와)과 보증인이 모두 응한다면, 당신은 [hd_dc_visitor.GetHerHim]에게 성의의 표시로 작은 선물을 보내고 서신을 주고받게 됩니다:"
 hd_dc_ord.0119.t: "봉하지 않은 편지"
 hd_dc_ord.0119.desc: "사자가 봉하지 않은 편지 한 통을 펼친다. 편지에는 관직 이야기도, 병마 이야기도 없다. 그저 떳떳하게 한번 왕래해 볼 뜻이 있는지를 물을 뿐이다.\n\n[scope:hd_dc_ordinary.Var('hd_dc_actor').Char.GetTitledFirstName](은)는 편지에서 분명히 밝혔다. [scope:hd_dc_ordinary.Var('hd_dc_visitor').Char.GetTitledFirstName]의 아버지 대와 얽힌 묵은 원한은 잠시 접어 두고, 이번에는 [scope:hd_dc_ordinary.Var('hd_dc_guarantor').Char.GetTitledFirstName]에게 중간에서 보증을 서 달라고 청한다는 것이다. 두 사람이 모두 고개를 끄덕여야 서신이 오갈 수 있으며, [scope:hd_dc_ordinary.Var('hd_dc_actor').Char.GetSheHe]도 작은 선물을 마련하여 성의를 보일 것이라 했다.\n\n묵은 빚은 아직 다 셈하지 못했으나, 이번 한 획만큼은 눈앞의 사람이 스스로 그어야 한다."
 hd_dc_ord.0119.a: "기꺼이 이름을 적고 친히 답하겠다."
 hd_dc_ord.0119.a.tt: "#EMP 두 사람이 모두 응해야 서신이 오갈 수 있습니다.#!"
 hd_dc_ord.0119.b: "이 약조는 받아들이기 어렵소."
 hd_dc_ord.0219.t: "당신이 붓을 들 차례"
 hd_dc_ord.0219.desc: "두 사람 모두 이미 응했고, [scope:hd_dc_ordinary.Var('hd_dc_actor').Char.GetTitledFirstName]의 선물도 [scope:hd_dc_ordinary.Var('hd_dc_visitor').Char.GetTitledFirstName]의 손에 전해졌다. 서리가 종이를 당신 앞으로 밀어 놓고, 당신이 이름을 써넣기를 기다린다.\n\n이 편지가 나가면 뭇사람 앞에서 속내를 밝히는 셈이다. 지금 마음을 바꾼다 해도 아직 늦지 않다. 다만 이 한 획만큼은 남이 대신 서명할 수 없다."
 hd_dc_ord.0219.a: "왕래의 뜻을 밝히고 내 이름을 적는다."
 hd_dc_ord.0219.b: "붓을 내려놓는다. 이 약속은 내가 지킬 수 없다."
 hd_dc_ord_correspondence_archive_title: "한 묶음의 서신"
 hd_dc_ord.0319.completed: "[scope:hd_dc_ordinary.Var('hd_dc_visitor').Char.GetTitledFirstName](와)과 [scope:hd_dc_ordinary.Var('hd_dc_guarantor').Char.GetTitledFirstName]의 답장이 모두 도착했다. 서리는 그것들을 [scope:hd_dc_ordinary.Var('hd_dc_actor').Char.GetTitledFirstName](이)가 보낸 편지와 한데 모아 비단 끈으로 묶었다.\n\n아버지 대의 묵은 원한이 이로써 한 번에 지워지지는 않았지만, 눈앞의 이 몇 사람 사이에는 마침내 서로 기대어 지낼 수 있는 새로운 일이 하나 생겼다."
 hd_dc_ord.0319.rejected: "누군가 이 편지를 거절하여 양쪽 모두의 승낙을 얻지 못했다. 선물은 보내지지 않았고, 서신도 오갈 길이 없어졌다.\n\n이번의 호의는 일단 거두어 둘 수밖에 없다."
 hd_dc_ord.0319.unpaid: "두 사람 모두 응했지만, 그 작은 선물이 온전히 전해지지 못했다. 서리는 장부 위에서 붓을 멈추었고, 서신 왕래도 그대로 멈추었다.\n\n선물도 다 보내지 못하고 편지도 오가지 못했으니, 이 좋은 일은 중도에 그칠 수밖에 없었다."
 hd_dc_ord.0319.withdrawn: "편지를 반쯤 썼을 때 누군가 붓을 내려놓고 앞서 했던 승낙을 거두어들였다.\n\n선물은 이미 보냈으나 서신은 끝내 오가지 못했다. 이번의 화해는 결국 마지막 한 걸음이 모자랐다."
 hd_dc_ord.0319.expired: "하루하루 날이 지나도 와야 할 답장은 끝내 다 모이지 않았다.\n\n서리는 이미 도착한 몇 통을 차곡차곡 개어 거두어 두었다. 채 쓰지 못한 나머지 절반은 그렇게 빈 채로 남았다."
 hd_dc_ord.0319.invalidated: "사정이 이미 달라져, 본래 왕래하기로 약조했던 이들 중 몇은 더는 예전처럼 행할 수 없게 되었다. 서리는 더 이상 편지를 재촉하지 않고, 이미 온 몇 통을 한곳에 모아 두었다.\n\n이번의 왕래는 아무 결말도 맺지 못했다."
 hd_dc_ord.0319.a: "일단 서신을 잘 거두어 둔다."
