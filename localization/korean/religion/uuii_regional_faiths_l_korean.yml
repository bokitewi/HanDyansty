 wudoumidao_adherent_plural:0 "오두미도 신도"
 wudoumidao_desc:0 "오두미도는 노자를 근본으로 삼아 부적 물로 병을 고치며, 병자를 고요한 방에서 허물을 반성하게 하고 죄상을 적어 하늘, 땅, 물의 삼관에게 올립니다. 입도하는 자는 쌀 다섯 말을 내고, 각 치는 좨주가 도중을 거느리며, 길가에 의사를 두고 쌀과 고기를 걸어 두어 길손을 구제합니다."
 wudoumidao_religious_head_title:0 "천사"
 wudoumidao_religious_head_title_name:0 "오두미도 교정"

 fusang_pagan:0 "부상 원시 신앙"
 fusang_pagan_adj:0 "부상 원시 신앙"
