 wugui_desc:0 "남중의 여러 이민족은 풍속이 무당과 귀신을 믿고 저주와 맹약을 좋아하여, 돌을 던지고 풀을 묶어 약속의 증표로 삼습니다. 무당은 영을 몸에 붙여 사악한 기운을 몰아내고 길흉을 점치며, 골짜기의 떠도는 혼령을 달랩니다. 큰 제사 때마다 희생을 잡고 함께 마시며 해에 절하고 신을 맞이합니다."
