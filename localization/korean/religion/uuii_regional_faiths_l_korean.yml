 fusang_pagan_adherent_plural:0 "부상 원시 신앙 신도"
 fusang_pagan_desc:0 "왜인은 귀도를 섬기며, 산과 바다, 숲과 바위 사이에 모두 신령이 깃들어 있고 씨족의 조상 영혼도 자손을 보우한다고 여깁니다. 그 풍속은 정결을 중히 여겨, 일을 벌이거나 길을 나설 때면 뼈를 지져 점을 칩니다. 제사 때는 공물을 바치고 함께 술을 마시며 노래와 춤으로 신을 즐겁게 합니다."
