 yemaek_shamanism:0 "예맥계 원시 샤머니즘"
 yemaek_shamanism_adj:0 "예맥계 원시 샤머니즘"
 yemaek_shamanism_adherent:0 "예맥 샤머니즘 신도"
 yemaek_shamanism_adherent_plural:0 "예맥 샤머니즘 신도"
 yemaek_shamanism_desc:0 "예맥, 부여, 고구려의 여러 부족은 하늘을 공경하고 산에 제사 지내며 조상의 영혼을 받듭니다. 해마다 큰 모임을 열어 하늘에 제사 지내는데, 부여는 이를 영고, 고구려는 동맹, 예인은 무천이라 부르며, 온 나라가 여러 날 동안 술 마시고 노래하고 춤춥니다. 무당은 신을 몸에 내리게 하여 족인을 위해 재앙을 물리치고 병을 고칩니다."
 yemaek_shamanism_old:0 "옛 예맥계 원시 샤머니즘"
 yemaek_shamanism_old_adj:0 "옛 예맥계 원시 샤머니즘"
 yemaek_shamanism_old_adherent:0 "옛 예맥 샤머니즘 신도"
 yemaek_shamanism_old_adherent_plural:0 "옛 예맥 샤머니즘 신도"

 samhan_shamanism:0 "삼한 샤머니즘"
