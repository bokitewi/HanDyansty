 xianbei_polytheism_desc:0 "선비의 여러 부족은 귀신을 공경하여 천지와 해와 달, 별과 산천에 제사 지내고, 선대에 용맹과 강건함으로 이름난 대인들에게도 제사를 올립니다. 그 풍속은 젊은이를 귀히 여기고 노인을 천하게 여기며 전사를 영예로 삼고, 죽은 자의 혼백은 적산으로 돌아가며 그 영명은 부족의 제가 속에 길이 남는다고 믿습니다."
