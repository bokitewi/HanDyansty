 samhan_shamanism_adherent_plural:0 "삼한 샤머니즘 신도"
 samhan_shamanism_desc:0 "삼한의 풍속은 귀신을 믿어, 나라의 읍마다 한 사람을 세워 천신의 제사를 주관하게 하고 이를 천군이라 부릅니다. 또 별읍을 두어 소도라 이름하고, 큰 나무를 세워 방울과 북을 매달고 귀신을 섬깁니다. 해마다 오월 파종 때와 시월 농사를 마칠 때 사람들이 무리 지어 모여 노래하고 춤추며 술을 마시고 산천의 귀신에게 제사 지냅니다."
