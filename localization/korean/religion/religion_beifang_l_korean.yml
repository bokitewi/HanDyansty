 xirongfangling_adj:0 "서융 정령 신앙"
 xirongfangling_adherent:1 "신도"
 xirongfangling_adherent_plural:1 "신도"
 xirongfangling_desc:0 "융인은 농산 안팎에 흩어져 살며, 주나라 이래로 진나라 사람 및 제하와 섞여 살면서 끊임없이 서로 공격했습니다. 그들의 풍속은 무를 숭상하고 삶을 가벼이 여기며, 사람을 희생으로 삼아 하늘에 제사 지냅니다. 죽은 자는 들판에 버려 새와 짐승이 쪼아 먹게 하기도 하는데, 그렇게 해야 혼백이 하늘로 오른다고 여깁니다."

