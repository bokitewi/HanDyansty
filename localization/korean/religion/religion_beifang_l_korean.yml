 saman_adj:0 "살만"
 saman_adherent:1 "신도"
 saman_adherent_plural:1 "신도"
 saman_desc:0 "동북의 숙신, 읍루 등 여러 부족과 새외의 어렵민은 모두 무당이 신령과 통할 수 있다고 믿습니다. 무당이 북을 치며 춤추면 신이 그 몸에 내리고, 족인을 위해 사악한 기운을 몰아내고 병을 고치며 길흉을 점칩니다. 큰 제사 때마다 희생을 잡고 실컷 마시며 산림과 새와 짐승의 영에게 감사합니다."

