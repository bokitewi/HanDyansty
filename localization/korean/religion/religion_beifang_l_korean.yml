 beidifangling:1 "북적 정령 신앙"
 beidifangling_adj:0 "북적 정령 신앙"
 beidifangling_adherent:1 "신도"
 beidifangling_adherent_plural:1 "신도"
 beidifangling_desc:0 "적인은 대대로 태항산과 항산 사이에 살며, 주나라 때부터 제하와 섞여 살면서 싸우기도 하고 혼인하기도 했습니다. 그들의 풍속은 천지와 산천을 공경하고 조상의 영혼을 받들며, 무당은 신을 몸에 내리게 할 수 있고 남녀 모두 제사를 주관할 수 있습니다."

