 yili:1 "이례"
 yili_adj:0 "이례"
 yili_adherent:1 "신도"
 yili_adherent_plural:1 "신도"
 yili_desc:0 "동이 사람들은 소호를 시조로 받드는데, 전하기를 그는 새로 관직을 기록하여 봉조, 현조, 백조, 청조, 단조가 각각 역법과 절기를 맡았다고 합니다. 이인들은 별을 관측해 때를 알려 주고 새와 조상에게 제사 지냈으며, 그들이 옥을 쓰고 솥을 늘어놓던 예법이 곧 삼대 예악의 근본이었다고도 합니다."

