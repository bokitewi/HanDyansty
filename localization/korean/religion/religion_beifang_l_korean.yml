 beifangzongjiao_religion_desc:0 "북방의 여러 민족은 예로부터 저마다 자신의 신에게 제사 지냈습니다. 동방의 백성은 현조를 받들고 이례를 지켰으며, 융적은 천지와 산천, 조상의 영혼을 공경하고, 새외의 여러 부족에서는 무당이 북을 치며 신을 내리게 했습니다. 그 제사는 저마다 달라도, 하늘을 공경하고 조상을 받드는 것은 하나였습니다."

