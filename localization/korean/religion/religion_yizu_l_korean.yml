 nanfangzongjiao_religion_desc:0 "남방의 여러 만족과 백월은 예로부터 귀신을 공경하고 무축을 중히 여겼습니다. 산천초목에 저마다 영이 있고 조상의 망혼이 자손을 보우한다고 믿으며, 월인, 초인, 파인이 저마다의 풍속에 따라 제사 지냅니다."

