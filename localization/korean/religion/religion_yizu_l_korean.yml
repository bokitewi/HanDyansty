 guiwu_adj:0 "파인 무교"
 guiwu_adherent:1 "파인 무교 신도"
 guiwu_adherent_plural:1 "파인 무교 신도"
 guiwu_desc:0 "파인은 귀신을 두려워하고 무당을 숭상합니다. 전하기를 유도에는 토백이 문을 지키는데, 호랑이 머리에 소의 몸, 세 눈에 날카로운 뿔을 지니고 손에 아홉 매듭의 밧줄을 쥐고 망혼을 쫓는다고 하며, 파와 촉의 여러 부족이 함께 그를 귀제로 받듭니다. 제삿날마다 무당은 북을 치고 발을 구르며 노래하여 해를 맞이하고 재앙을 물리칩니다."

