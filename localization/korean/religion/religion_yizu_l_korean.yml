 chuwu:1 "초무"
 chuwu_adj:0 "초무"
 chuwu_adherent:1 "신도"
 chuwu_adherent_plural:1 "신도"
 chuwu_desc:0 "초 땅의 풍속은 무당과 귀신을 믿고 음사를 중히 여깁니다. 위로는 동황태일, 동군, 운중군에서 아래로는 산천과 사람의 귀신에 이르기까지 모두 제사를 지냅니다. 무격은 성대히 차려입고 노래하고 춤추어 신을 즐겁게 하며, 하늘과 땅에 통하고 귀신과 사귀며 삶과 죽음을 맡긴다고 일컬어집니다."

