 baiyuefanlin:1 "월무"
 baiyuefanlin_adj:0 "월무"
 baiyuefanlin_adherent:1 "월무 신도"
 baiyuefanlin_adherent_plural:1 "월무 신도"
 baiyuefanlin_desc:0 "월인은 귀신을 믿고 사당 제사를 좋아하며, 산천초목과 강과 바다의 만령을 경외합니다. 무당은 제가와 닭뼈 점으로 신과 통해 길흉을 묻고, 족인들은 용맹한 조상이 죽은 뒤에도 여전히 남아 자손과 고향 땅을 보우한다고 믿습니다."

