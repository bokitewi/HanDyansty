l_korean:
 hd_beifang_faith:0 "북방 정령 신앙"
 hd_beifang_faith_adj:0 "북방 정령 신앙"
 hd_beifang_faith_adherent:0 "정령 신앙자"
 hd_beifang_faith_adherent_plural:0 "정령 신앙자"
 hd_beifang_faith_desc:0 "북방의 여러 민족은 천지, 조상의 영혼, 산천을 공경하며, 각 부족은 저마다의 전승에 따라 신령에게 제사 지냅니다. 동이는 이례를 지키고, 적과 융은 저마다 자신의 신에게 제사 지내며, 새외의 어렵민은 무당의 강신을 따릅니다."
 hd_nanfang_faith:0 "남방 정령 신앙"
 hd_nanfang_faith_adj:0 "남방 정령 신앙"
 hd_nanfang_faith_adherent:0 "정령 신앙자"
 hd_nanfang_faith_adherent_plural:0 "정령 신앙자"
 hd_nanfang_faith_desc:0 "남방의 여러 민족은 조상의 영혼과 산천, 해와 달에게 제사 지내며, 귀신을 섬기고 무축을 중히 여깁니다. 월인, 초인, 파인과 남중의 여러 이민족이 저마다의 제사를 지키며, 무풍이 미치는 범위는 강한에서 영외에까지 이릅니다."
 hd_han_taoism_faith:0 "한대 도교"
 hd_han_taoism_faith_adj:0 "한대 도교"
 hd_han_taoism_faith_adherent:0 "도중"
 hd_han_taoism_faith_adherent_plural:0 "도중"
 hd_han_taoism_faith_desc:0 "도를 받드는 이들은 황로를 존숭하고 몸과 마음을 닦으며, 부적 물과 재초로 사람들의 병을 물리치고 재앙을 없앱니다. 촉 땅과 한중의 오두미도, 관동의 태평도가 모두 이 문하에서 나왔으며, 신도가 주군에 두루 퍼져 있습니다."
 ashari:0 "아샤리파"
 ashari_adj:0 "아샤리파"
 ashari_adherent:0 "아샤리파 신도"
 ashari_adherent_plural:0 "아샤리파 신도"
 ashari_desc:0 "이 파는 순니 정통을 엄격히 지키며 경전의 가르침을 교리의 근본으로 삼고, 법학자의 판단을 존중하며 신도들에게 경건하게 율법을 지킬 것을 요구합니다."
 muwalladi:0 "무왈라드파"
 muwalladi_adj:0 "무왈라드파"
 muwalladi_adherent:0 "무왈라드파 신도"
 muwalladi_adherent_plural:0 "무왈라드파 신도"
 muwalladi_desc:0 "이 파의 신도는 대부분 새로 개종한 현지인으로, 순니의 가르침을 받들면서도 고향의 풍속을 간직하고 있으며 향토의 정으로 신도들을 결속합니다."
 maturidi:0 "마투리디파"
 maturidi_adj:0 "마투리디파"
 maturidi_adherent:0 "마투리디파 신도"
 maturidi_adherent_plural:0 "마투리디파 신도"
 maturidi_desc:0 "이 파는 순니 정통을 엄격히 지키며 율법을 근본으로 삼되, 신도들이 각지의 풍속에 따라 융통성 있게 행하는 것을 허용합니다."
 mutazila:0 "무타질라파"
 mutazila_adj:0 "무타질라파"
 mutazila_adherent:0 "무타질라파 신도"
 mutazila_adherent_plural:0 "무타질라파 신도"
 mutazila_desc:0 "이 파는 순니의 가르침을 받들며 이성적 논변으로 경전의 뜻을 밝히는 것을 높이 여기고, 학문적 논쟁과 율법 연구를 중시합니다."
