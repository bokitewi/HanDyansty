l_korean:
 taipingdao:0 "태평도"
 taipingdao_adj:0 "태평도"
 taipingdao_adherent:0 "태평도 신도"
 taipingdao_adherent_plural:0 "태평도 신도"
 taipingdao_desc:0 "태평도는 《태평경》을 근본으로 삼고, 구절장과 부적 물, 주문으로 사람들의 병을 고치며 병자에게 머리를 조아리고 허물을 반성하게 합니다. 그 제자들은 사방으로 나가 도를 전하고, 신도들은 창천은 이미 죽었고 황천이 마땅히 설 것이며 태평의 세상이 끝내 오리라 굳게 믿습니다."
