l_korean:
 hd_hj_qingzhou_army:0 "청주군"
 hd_hj_qingzhou_reclaim_county_modifier:0 "청주군 둔전"
 hd_hj_qingzhou_reclaim_county_modifier_desc:0 "항복한 황건 무리를 군둔으로 편성하여 농사를 지으며 싸우게 하니, 향촌이 날로 번성합니다."
 hd_huangjin.1.t:0 "원문에서의 항복 수용"
 hd_huangjin.1.desc_fail:0 "북소리는 이미 울렸으나 뒷줄은 여전히 어수선했다. 원문 앞에 선 당신은 깃발 하나로 이 많은 사람을 움직이지 못하는 것을 보고, 강병을 얻으리라던 조금 전의 기대가 식어 버렸다.\n\n가까이 가서야 똑똑히 보였다. 병기는 망가져 있고 대오는 분명치 않으며, 많은 이들이 그저 무리를 따라 밥이나 얻어먹으려던 사람들이었다. 거수가 다급히 변명하려 하자 당신은 손을 들어 그의 입을 막았다. 자기 부중의 수조차 헤아리지 못하면서, 진 앞에 나가면 누구에게 명령을 듣게 하겠는가?\n\n그가 고개를 떨구자 주위에서도 더는 아무도 입을 열지 않았다. 당신은 열병을 잠시 거두었다. 군중에 필요한 것은 쓸 만한 병사이지만, 영 밖의 수많은 입이 아직 밥을 기다리고 있다. 내일은 먼저 군량을 논하며, 이번 초무에서 무엇을 남길 수 있을지 보아야 한다."
 hd_huangjin.1.desc_success:0 "북 신호가 몇 번이나 전해지고서야 항복한 무리가 차츰 줄을 맞추었다. 대오를 따라 걸어가 보니, 아직도 제자리를 찾는 이가 있는가 하면 호령 한마디에 곧바로 발을 멈추는 이도 있었다.\n\n“뒤쪽의 저들은 쓸 만하다.” 당신은 좌우에게 가리켜 보이며, 앞줄이 어지럽다고 해서 모두를 한꺼번에 내쫓지는 않았다. 병기는 갖춰 주면 되고 대오는 정비하면 된다. 난세에 아직 호령을 따르고 칼과 창을 들 수 있는 사람을 쉽게 놓쳐서는 안 된다.\n\n거수는 당신이 이름을 적기 시작하자 언제 영에 들 수 있느냐고 서둘러 물었다. 당신은 곧바로 군액을 약속하지 않고, 먹여야 할 입이 얼마나 되느냐고만 물었다. 그 말이 떨어지자 사방이 대오를 정비할 때보다 더 조용해졌다. 알고 보니 그들이 가장 두려워한 것은 처음부터 이 물음에 뒷말이 없는 것이었다."
 hd_huangjin.1.desc_crit:0 "원문 밖에 항복한 무리가 빽빽이 늘어섰다. 몇 번은 고함을 쳐야 할 줄 알았는데, 북소리가 울리자 앞뒤의 각 대가 차례로 자리를 잡았고, 깃발 끝의 사람들까지 꼼짝도 하지 않았다.\n\n대오를 따라 걷던 당신은 어깨와 등이 단단한 군사 몇 명 앞에서 걸음을 멈추었다. 그들의 손에 든 병기는 뒤죽박죽이었으나, 깃발을 바라보는 눈빛만은 조금도 흐트러짐이 없었다. “예전에도 이렇게 진을 쳤는가?” 당신이 묻자 거수가 서둘러 대답했는데, 그 말투에 마침내 얼마간 자신감이 묻어났다.\n\n이들을 흩어진 굶주린 백성으로만 여겨 놓아 보냈다면, 그것은 당신이 사람을 잘못 본 것이다. 당신은 돌아서서 쓸 만한 무리를 기록하게 하고, 영중에 군량이 얼마나 남았는지도 물었다. 그들에게 당신을 위해 싸우게 하려면, 먼저 귀순한 뒤에도 갈 길이 있다는 것을 알게 해야 한다."
 hd_huangjin.1.a:0 "열병을 마쳤으니 내일 군량을 논한다."
 hd_huangjin.2.t:0 "농사지으며 싸우다"
 hd_huangjin.2.desc_fail:0 "어제의 북소리가 아직 귀에 맴도는데, 오늘 펼친 군량 장부가 먼저 당신에게 찬물을 끼얹었다. 보고된 입의 수만큼 군량을 내놓아야 하는데, 아직 개간하지 못한 밭으로는 당장 한 끼도 메울 수 없다.\n\n서리가 세 번째로 계산할 즈음 목소리가 점점 작아졌다. 당신이 그가 잘못 적은 곳 하나를 짚어 고쳐 주니, 오히려 부족분이 더 뚜렷해졌다. 영 밖에서 또 누군가 구휼을 물으러 왔는데, 좌우는 서로 얼굴만 쳐다볼 뿐 아무도 먼저 나가 대답하려 하지 않았다.\n\n당신은 장부를 누르고, 어려운 점을 있는 그대로 적게 했다. 내일은 여러 거수를 만나야 하는데, 오늘의 이 군량 셈은 아무리 해도 얼버무릴 수가 없다. 사람을 모을 때 거두어 주겠다는 말 한마디는 쉬웠지만, 정작 그들을 머물게 하는 것은 이토록 힘든 일이다."
 hd_huangjin.2.desc_success:0 "오늘은 더 이상 활과 칼을 시험하지 않고 먼저 먹을 것부터 셈한다. 군영을 따르는 노약자와 장정의 수를 하나하나 물었는데, 가장 듣기 싫은 것은 모든 입을 병사 수로 부풀려 보고하는 것이었다.\n\n여러 차례 대조한 끝에 마침내 안치할 방법이 나왔다. 싸울 수 있는 자는 대오에 편입하고 나머지는 따로 안돈하니, 지금의 비축 군량과 앞으로의 경작이 겨우 맞물린다. 당신은 서리에게 한 부를 다시 옮겨 적게 하며, 빈칸은 차라리 남겨 둘지언정 좋은 말 한마디 들으려고 있지도 않은 군량을 보태지 말라고 했다.\n\n장정을 책상 위에 돌려놓고 당신은 다시 한번 살펴보았다. 셈이 맞는다고 해서 일이 순조로운 것은 아니다. 내일은 여러 거수와 얼굴을 맞대고 분명히 말해야 한다. 당신이 무엇을 줄 수 있는지, 그리고 당신의 호령을 따르려면 무엇을 지켜야 하는지."
 hd_huangjin.2.desc_crit:0 "어제 열병을 마친 뒤 당신은 이미 사람 수와 전지를 따로 조사해 보고하게 했다. 오늘 장부 몇 권을 펼치니, 앞서 제각각이던 숫자들이 하나하나 맞아떨어졌다.\n\n싸울 수 있는 자는 입대하고 나머지 사람들은 경작에 안치하며, 당장의 구휼도 실행할 수 있는 방도를 찾았다. 끝까지 듣고 나서 당신이 직접 붓을 들어 두 곳을 대조하고서야, 줄곧 조이던 숨이 비로소 내려앉았다. 사람을 모아 군량만 먹게 한다면, 아무리 큰 부고라도 끝없는 항복 수용을 감당할 수 없다.\n\n“이대로 시행하라.” 당신은 장부를 돌려주었다. 밭에서는 아직 수확이 없지만, 적어도 더는 빈말로 굶주린 백성을 달랠 필요는 없다. 내일 여러 거수를 만나면, 마침내 믿을 만한 말을 할 수 있을 것이다."
 hd_huangjin.2.a:0 "장부가 정해졌으니 내일 거수들과 약조를 맺는다."
 hd_huangjin.3.t:0 "삽혈의 맹세"
 hd_huangjin.3.desc_fail:0 "오래도록 명을 따르라는 말이 나오자 여러 거수의 대답이 느려졌다. 어떤 이는 땅만 바라보고, 어떤 이는 잠시 머물겠다고만 하며, 방금까지 대답하던 이들도 입을 꾹 다물었다.\n\n당신은 조건을 다시 한번 말했지만, 인내심은 이미 처음만 못했다. “군중에 들어오면 각자 따로 명을 내릴 수 없다.” 이 말이 나오자 장막 안은 더욱 조용해졌다. 흩어질 때까지 믿을 만한 말을 건넨 이는 한 사람도 없었다.\n\n당신은 빈자리를 바라보며 지난 이틀의 군적과 안치 장부를 책상 앞으로 다시 가져왔다. 몇 사람이나 남길 수 있을지는 이 이틀 동안 얻은 것에서 찾아야 한다. 쓸 만한 장정과 보급마저 마련되지 않는다면, 이번 초무는 정말 빈손으로 끝나고 만다."
 hd_huangjin.3.desc_success:0 "여러 거수가 장막에 들어오자, 당신은 먼저 이틀 동안 조사한 내용을 말하고 군중의 규율을 하나하나 분명히 설명했다. 뒤쪽까지 듣던 누군가가 마침내 참지 못하고 물었다. “억울한 일이 있으면 저희가 다시 와서 아뢰어도 되겠습니까?”\n\n당신은 그를 한번 쳐다보고 말을 끝까지 하게 했다. 그가 묻는 것이 고개를 숙이고 예예 하는 것보다는 낫다. 몇 차례 말이 오간 끝에 사람들은 마침내 약조를 맺기로 했고, 앞서 굳어 있던 어깨와 등도 조금 풀어졌다.\n\n당신은 곁에 있던 물을 들고서야 말을 많이 해 입이 마른 것을 느꼈다. 인심은 잠시 안정되었으니, 이제 쓸 만한 무리와 군량 안치를 맞추어 보고 최종 군액을 정해야 한다. 장막 밖에는 이미 명을 기다리는 이들이 있다. 오늘은 그들을 의심을 품은 채 흩어지게 하지 않아도 된다."
 hd_huangjin.3.desc_crit:0 "여러 거수가 약속대로 장막에 들어왔는데, 처음에는 모두 조심스럽게 앉아 있었다. 당신은 맹세를 재촉하지 않고, 먼저 편오와 안치, 군중의 규율을 하나하나 풀어 설명하며 어디가 아직 이해되지 않느냐고 물었다.\n\n마침내 누군가 고개를 들어 가솔을 안돈할 수 있느냐고 물었고, 또 누군가는 입영한 뒤에는 누구의 호령을 따르느냐고 물었다. 말이 많아지자 앞서의 경계심이 차츰 풀어졌다. 마지막 사람이 응낙하자 다른 이들도 따라 몸을 숙였는데, 그 소리가 올 때보다 훨씬 가지런했다.\n\n당신은 그들을 일으키며, 속으로는 이미 지난 이틀 동안 남긴 명부와 군량 수를 헤아리기 시작했다. 마음으로 귀순하는 것은 좋은 일이다. 하지만 실제로 몇 명이나 병기를 들게 할 수 있을지는 장정을 얼마나 골라낼 수 있고 몇 명의 입을 안치할 수 있느냐에 달려 있다. 오늘의 이 말들은 그래도 헛되지 않았다."
 hd_huangjin.3.a:0 "군액을 정하고 항복한 무리를 수습한다."
 hd_huangjin.3.reward_none:0 "항복한 무리는 끝내 흩어졌고, 당신은 이번에 아무것도 얻지 못했습니다."
 hd_huangjin.3.closed_crit:0 "당신이 초무를 잘 해내어 청주 항복민의 인심이 이미 당신에게 돌아왔으니, 다른 이가 이 일에 끼어들기는 어렵습니다."
 hd_huangjin.3.closed_full:0 "청주의 항복민이 모두 당신 휘하에 들어왔으니, 이제 천하에 그들을 초무할 수 있는 두 번째 세력은 없습니다."
 hd_huangjin.3.closed_third:0 "청주 황건은 여러 차례 초무를 겪으며 인심이 이미 흩어졌으니, 이제 누구도 초안의 명분으로 그 무리를 거둘 수 없습니다."
 hd_huangjin.10.t:0 "제북에서의 항복 수용"
 hd_huangjin.10.desc:0 "청주 황건이 동쪽에서 몰려왔다. 백만이라 일컫는 그들은 제수를 건너자 사방을 노략했고, 지나는 군현마다 성문을 닫고 스스로를 지켰다. 당신은 군사를 이끌고 맞서 싸우며 밤낮으로 영루를 떠나지 않았다. 때로는 복병을 두고 때로는 뒤를 밟으며, 봄부터 겨울까지 싸웠다.\n\n그들은 수는 많았으나 가솔과 짐을 끌고 다녀 갈수록 굶주렸다. 당신은 그들의 갈 길을 끊고 결전을 서두르지 않은 채 조금씩 조여 갔다. 마침내 한 거수가 사람을 영 앞으로 보내 항복하겠다며, 노약자에게 살길만 열어 달라고 청했다.\n\n사자가 돌아간 뒤 당신이 영루에 올라 바라보니, 제북의 들판은 온통 항복한 무리의 막사로 끝이 보이지 않았다. 장정은 골라내어 한 군으로 편성하고, 나머지에게는 밭을 나누어 주어 농사지으며 지키게 할 수 있다. 이 군대를 제대로 단련해 낸다면, 앞으로 천하를 다툴 때 든든한 근간이 하나 더 생기는 셈이다."
 hd_huangjin.10.a:0 "정예를 거두어 청주병이라 부른다."
