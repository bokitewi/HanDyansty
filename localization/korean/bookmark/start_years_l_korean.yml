l_korean:

 uuii_bm_group_184: "한말풍운"
 bm_uuii_184: "184년"
 bm_uuii_184_desc: "광화 7년, 갑자년. 한 왕실이 나라를 누린 지 어언 사백 년에 가깝습니다. 낙양의 궁중에서는 환관과 외척이 드러내 놓고 또 암암리에 다투고, 관직을 사고파는 풍조가 조야에 만연합니다. 주군 사이에서는 호족들이 토지를 겸병하고, 해마다 이어지는 재해와 역병, 요역이 이미 백성을 막다른 곳까지 몰아붙였습니다.\n\n태평도의 부적 물과 경문은 청주, 서주, 유주, 기주, 형주, 양주, 연주, 예주의 여덟 주에 은밀히 퍼졌고, 서른여섯 방의 신도들은 오직 한마디 호령만을 기다리고 있습니다. 경성의 관아 문과 주군 관청의 담벼락에는 어느새 흰 흙으로 '갑자'라는 두 글자가 가득 쓰여 있습니다.\n\n#bold 폭풍우가 몰려옵니다. 당신은 쓰러져 가는 한 왕실을 바로 세울 것입니까, 아니면 기세를 타고 일어나 새로운 천지를 열 것입니까?#!"
 bm_hd_190: "동탁 토벌 연합"
 bm_hd_190_desc: "초평 원년, 경오년. 동탁은 소제를 폐하고 헌제를 세워 스스로 상국을 칭하고, 군사를 풀어 낙양을 약탈하게 했습니다. 관동의 주목과 태수들이 잇따라 거병하여 발해 태수 원소를 맹주로 추대하였고, 십여 갈래의 제후가 회맹하여 역적 토벌을 맹세했습니다.\n\n동탁은 천자를 끼고 사예에 웅거하며, 서량의 철기는 관중을 마음껏 누빕니다. 양주의 장수들은 제각기 움직이고, 병주는 주인이 없어 군현이 흩어졌습니다. 봄이 오면 연합군은 북으로 하내, 동으로 성고를 향해 진군할 것이며, 낙양과 호뢰관이 가장 먼저 부딪힐 것입니다.\n\n#bold 한 왕실의 운명이 풍전등화입니다. 당신은 의병을 이끌고 역적을 칠 것입니까, 혼란을 틈타 할거할 것입니까, 아니면 이 쟁패의 시대에 다른 뜻을 품을 것입니까?#!"
uuii_book_cao_cao_name_subheading: "치세의 능신, 난세의 간웅"
uuii_book_liu_bei_name_subheading: "그 덕은 밝고 밝으며, 그 뜻은 굳세고 굳세도다"
uuii_book_yuan_shao_name_subheading: "고결한 기풍과 의로운 법도로 천하의 으뜸이 되다"
uuii_book_sun_jian_name_subheading: "파로장군"
uuii_book_zhang_jiao_name_subheading: "대현양사"
 uuii_book_cao_cao_name_desc: "조조는 진류 기오에서 가산을 털어 향용 오천을 모아 동탁 토벌의 군사를 일으켰습니다. 장막, 위자 등과 뜻을 같이하지만 군사는 적고 땅은 좁아 진류의 한 귀퉁이에 몸을 의탁할 뿐입니다.\n\n관동 연합은 이름뿐인 동맹입니다. 맹주 원소는 권력을 쥐는 데 뜻이 있고, 제후들은 군사를 묶어 둔 채 관망하며 누구도 먼저 움직이려 하지 않습니다. 조조는 애가 타지만 이 작은 근거지에서 군사를 조련하며 때를 기다릴 수밖에 없습니다.\n\n#bold 당신은 군웅 사이에서 발판을 마련하고, 언젠가 천자를 받들어 제후들을 호령할 수 있겠습니까?#!"

 uuii_book_yuan_shao_name_desc: "여남 원씨는 4대에 걸쳐 삼공을 배출했고 그 문생과 옛 부하는 천하에 가득합니다. 하진이 죽고 동탁이 낙양에 들어오자 원소는 벼슬을 버리고 동쪽으로 나와 관동 제후들에게 맹주로 추대되었습니다. 발해 한 군에 의지해 십여 갈래의 병마를 호령합니다.\n\n연합의 기세는 크지만 군량과 명분, 그리고 제후들 사이의 의심이 늘 맹주의 발목을 잡습니다. 기주목 한복은 가까이 있어 도움이 되기도, 화근이 되기도 합니다.\n\n#bold 당신은 연합을 하나로 묶어 동탁을 쳐부수고, 여남 원씨를 권력의 정점에 올릴 수 있겠습니까?#!"

 uuii_book_liu_bei_name_desc: "유비는 중산정왕의 후손을 자칭하며, 젊은 시절 자리를 짜고 신을 팔아 살았고 훗날 노식에게 배웠습니다. 황건적이 일어나자 관우, 장비와 도원에서 의형제를 맺고 향용을 모아 탁군과 유주를 오갔습니다.\n\n천하가 크게 어지럽고 제후들이 곳곳에서 일어난 지금도 그는 땅이 없고 수하는 수백 명의 의용군뿐이지만, 공손찬과 도겸 등과는 교분이 있습니다. 난세에 종실의 명분과 옛 벗의 의리가 그의 가장 큰 밑천입니다.\n\n#bold 당신은 아무것도 없는 처지에서 의로운 이들을 모으고 자신의 터전을 얻어 한 왕실을 중흥할 수 있겠습니까?#!"

 uuii_book_sun_jian_name_desc: "손견은 오군 부춘 출신으로, 열일곱 살에 해적을 쫓아내 용맹을 떨쳤습니다. 황건의 난에서는 주준을 따라 싸워 공을 세웠고, 이후 장사 태수가 되어 구성의 난을 평정했습니다.\n\n관동에서 군사가 일어나자 손견은 북상하여 형주자사 왕예를 죽음으로 몰고 남양태수 장자를 벤 뒤, 강동의 자제들을 이끌고 노양의 원술에게 의탁했습니다. 자기 땅은 한 치도 없습니다. 연합군에서 가장 날카로운 칼이지만 남에게 의지하는 몸이라 사사건건 제약을 받습니다.\n\n#bold 당신은 난세에서 일개 장수로 시작해 강동 손씨의 개창자가 될 수 있겠습니까?#!"

 uuii_book_zhang_jiao_name_desc: "장각은 민간의 고통을 목격하고 스스로 대현량사라 칭하며 황로의 도를 받들고, 부적 물과 주문으로 사람들의 병을 고쳤습니다. 십여 년 사이에 태평도의 신도는 여덟 주에 두루 퍼져 서른여섯 방으로 나뉘었는데, 큰 방은 만여 명, 작은 방은 육칠천 명에 이르며, 모두 대현량사를 세상을 구원할 사람으로 여깁니다.\n\n봉기할 날은 이미 정해졌고, 경사의 내응과 각 방의 거수들이 모두 은밀히 준비하고 있습니다. 그러나 가담하는 이가 많아질수록 비밀을 지키기는 어려워지고, 조정이 눈치채는 순간 모든 준비가 물거품이 될 수도 있습니다.\n\n#bold 창천은 이미 죽었으니 황천이 마땅히 서리라. 당신은 황천의 이름으로 천명을 다시 쓸 수 있겠습니까?#!"

