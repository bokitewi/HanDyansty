 bm_hd_190_yuan_shu: "원술"
 bm_hd_190_yuan_shu_subheading: "후장군"
 bm_hd_190_yuan_shu_desc: "원술의 자는 공로로, 여남 원씨 출신이며 사공 원봉의 아들이다. 젊어서부터 협기로 이름났고 하남윤과 호분중랑장을 지냈다. 동탁이 황제를 폐립하고 그를 후장군에 임명하려 하자, 원술은 화를 두려워해 남양으로 달아났다. 마침 북상한 손견이 남양태수 장자를 베자 원술은 남양을 차지했고, 손견도 강동 자제들을 이끌고 그에게 귀부했다.\n\n남양은 호구가 수백만에 이르고 돈과 곡식이 넉넉하여, 관동 제후 가운데 가장 부유한 근거지이다. 그러나 원술은 맹주 원소와 본래 사이가 나빴고, 적서의 다툼과 가문의 오만은 언젠가 같은 집안 형제를 철천지원수로 만들 것이다.\n\n#bold 원소를 누르고 '한을 대신할 자는 당도고'라는 참언을 그대 자신에게서 이루어낼 수 있겠는가?#!"
 bm_hd_190_liu_chong: "유총"
 bm_hd_190_liu_chong_subheading: "진왕"
 bm_hd_190_liu_chong_desc: "유총은 한 명제의 현손으로 진왕의 작위를 이어받았다. 쇠뇌에 능해 열 번 쏘면 열 번 맞혔고, 화살이 모두 한 곳에 꽂혔다. 황건이 일어나 군현의 관리들이 잇달아 성을 버리고 달아날 때, 진왕만은 강노 수천 장을 꺼내 도정에 군사를 주둔시켰다. 백성들은 왕의 활솜씨를 알기에 감히 배반하지 못했고, 진국은 온전히 보존되어 의탁해 온 백성이 십여만에 이르렀다.\n\n관동 제후들이 동탁 토벌에 나서자 유총도 군사를 이끌고 양하에 주둔하며 보한대장군을 자칭했다. 국상 낙준이 은혜와 위엄을 함께 베풀어 진국의 창고를 가득 채웠지만, 그 풍요는 식량이 모자란 이웃 제후들의 눈길을 끌고 있다.\n\n#bold 수천 장의 강노로 진국을 지켜내고, 군웅이 에워싼 가운데 종번을 보전하며, 나아가 한실을 바로 세울 수 있겠는가?#!"
