l_korean:

 uuii_bm_group_184: "한말풍운"
 bm_uuii_184: "184년"
 bm_uuii_184_desc: "광화 7년, 갑자년. 한 왕실이 나라를 누린 지 어언 사백 년에 가깝습니다. 낙양의 궁중에서는 환관과 외척이 드러내 놓고 또 암암리에 다투고, 관직을 사고파는 풍조가 조야에 만연합니다. 주군 사이에서는 호족들이 토지를 겸병하고, 해마다 이어지는 재해와 역병, 요역이 이미 백성을 막다른 곳까지 몰아붙였습니다.\n\n태평도의 부적 물과 경문은 청주, 서주, 유주, 기주, 형주, 양주, 연주, 예주의 여덟 주에 은밀히 퍼졌고, 서른여섯 방의 신도들은 오직 한마디 호령만을 기다리고 있습니다. 경성의 관아 문과 주군 관청의 담벼락에는 어느새 흰 흙으로 '갑자'라는 두 글자가 가득 쓰여 있습니다.\n\n#bold 폭풍우가 몰려옵니다. 당신은 쓰러져 가는 한 왕실을 바로 세울 것입니까, 아니면 기세를 타고 일어나 새로운 천지를 열 것입니까?#!"
uuii_book_cao_cao_name_subheading: "치세의 능신, 난세의 간웅"
uuii_book_liu_bei_name_subheading: "그 덕은 밝고 밝으며, 그 뜻은 굳세고 굳세도다"
uuii_book_yuan_shao_name_subheading: "고결한 기풍과 의로운 법도로 천하의 으뜸이 되다"
uuii_book_sun_jian_name_subheading: "파로장군"
uuii_book_zhang_jiao_name_subheading: "대현양사"
 uuii_book_cao_cao_name_desc: "조조는 패국 조씨 출신으로 재략이 남달랐으나, 조부 조등이 환관이었던 탓에 청류에게서 거듭 비난을 받았습니다. 혁혁한 가문은 그에게 벼슬길을 열어 주었지만, 평생 씻어 내기 어려운 출신이 되기도 했습니다.\n\n그는 젊어서 낙양 북부위를 맡아 금령을 어긴 권세 높은 환관의 친척을 매질해 죽여 이름을 떨쳤고, 그 뒤 여러 차례 글을 올려 시대의 폐단을 직언했으나 조정은 이를 받아들이지 못했습니다. 한 왕실이 날로 쇠미해지는 것을 보면서도, 조조의 가슴에는 여전히 나라에 보답하려는 뜻이 가득합니다.\n\n#bold 당신은 치세의 능신이 될 것입니까, 난세의 간웅이 될 것입니까?#!"

 uuii_book_yuan_shao_name_desc: "여남 원씨는 4대에 걸쳐 삼공을 배출하였고, 그 문생과 옛 부하가 천하에 두루 퍼져 있습니다. 원소는 가문의 명성과 몸을 낮추어 선비를 대하는 명망에 힘입어 일찍이 사인들의 주목을 받는 인물이 되었고, 낙양 권력의 중심에서 물 만난 물고기처럼 활약하고 있습니다.\n\n궁중의 환관과 외척의 다툼은 날로 격해지고, 조야는 누군가 먼저 손을 쓰기만을 기다리고 있습니다. 원소에게는 뭇 선비를 불러 모을 명망이 있으나, 이 명망을 어디에 쓸지 결정해야만 합니다.\n\n#bold 당신은 천하의 영걸을 모아, 이 비바람 몰아치는 세상에서 여남 원씨를 권력의 정점에 올려놓을 수 있겠습니까?#!"

 uuii_book_liu_bei_name_desc: "유비는 중산정왕의 후손을 자칭하지만, 이 종실의 갈래는 이미 오래전에 몰락했습니다. 그는 어려서 아버지를 여의고 어머니와 함께 돗자리를 짜고 짚신을 팔아 생계를 꾸렸으며, 다행히 같은 종친의 도움을 받아 공손찬과 함께 노식의 문하에 들어가 배울 수 있었습니다.\n\n변방 유주의 민심은 술렁이고, 불안한 기운이 사방으로 번지고 있습니다. 유비는 본디 한 왕실을 바로 세우려는 뜻을 품었고 호협과 사귀기를 좋아하여 고을 젊은이들이 앞다투어 그를 따랐습니다. 그러나 종실 후손이라는 명분과 젊은 날 유협으로서 쌓은 명성 말고는, 그의 손에 천하를 좌우할 만한 힘은 없습니다.\n\n#bold 당신은 탁군에서 출발해 함께할 이들을 모으고, 스스로 설 땅을 얻어 마침내 한 왕실을 중흥할 수 있겠습니까?#!"

 uuii_book_sun_jian_name_desc: "손견은 오군 부춘 출신으로, 열일곱 살에 홀몸으로 상인들을 약탈하던 해적을 쫓아내어 그때부터 과감함으로 이름을 떨쳤습니다. 이후 군의 병사를 따라 회계의 허창의 난을 평정했고, 염독과 우이의 현승을 거쳐 지금은 하비로 전임했습니다.\n\n북방의 동란은 곧 각 주로 번질 것입니다. 손견은 혼란 속에서 자신이 설 자리를 신중히 골라야 합니다. 한 조정의 명을 받들어 사방을 정벌할 것인가, 아니면 기세를 타고 이름을 떨쳐 손씨를 위해 더 원대한 앞날을 개척할 것인가?\n\n#bold 당신은 한 걸음씩 기반을 다져, 난세 속에서 강동 손씨의 기업을 열 수 있겠습니까?#!"

 uuii_book_zhang_jiao_name_desc: "장각은 민간의 고통을 목격하고 스스로 대현량사라 칭하며 황로의 도를 받들고, 부적 물과 주문으로 사람들의 병을 고쳤습니다. 십여 년 사이에 태평도의 신도는 여덟 주에 두루 퍼져 서른여섯 방으로 나뉘었는데, 큰 방은 만여 명, 작은 방은 육칠천 명에 이르며, 모두 대현량사를 세상을 구원할 사람으로 여깁니다.\n\n봉기할 날은 이미 정해졌고, 경사의 내응과 각 방의 거수들이 모두 은밀히 준비하고 있습니다. 그러나 가담하는 이가 많아질수록 비밀을 지키기는 어려워지고, 조정이 눈치채는 순간 모든 준비가 물거품이 될 수도 있습니다.\n\n#bold 창천은 이미 죽었으니 황천이 마땅히 서리라. 당신은 황천의 이름으로 천명을 다시 쓸 수 있겠습니까?#!"

