l_korean:
 HD_UPRISING_WAR_NAME:0 "봉기 전쟁"
 hd_peasant_populist_uprising_war_victory_desc:0 "봉기군이 승리하여, 점령한 군현은 각각 점령자에게 귀속되고, 봉기 수령은 원래 주군에게서 벗어나 자립합니다."
 hd_peasant_populist_uprising_war_white_peace_desc:0 "양측이 군사를 거두고, 군현의 귀속은 예전과 같습니다."
 hd_peasant_populist_uprising_war_defeat_desc:0 "봉기가 무너져 거사한 자는 아무것도 얻지 못하고, 수령은 사로잡힌 몸이 됩니다."
 hd_uprising_war_victory_desc:0 "봉기군이 승리하여 수령이 원래 주군에게서 벗어나 자립합니다."
 hd_yellow_turban_war_victory_desc:0 "이 방면의 황건이 승리하여, 전쟁 중에 빼앗은 군현은 여전히 각 점령자에게 귀속됩니다."
 hd_uprising_war_white_peace_desc:0 "양측이 군사를 거두고, 전쟁 중에 주인이 바뀐 군현은 각각 현상을 유지합니다."
 hd_uprising_war_defeat_desc:0 "봉기가 실패하여, 거사한 자가 전쟁 중에 빼앗은 군현은 모두 원래 주인에게 돌아갑니다."
 hd_yellow_turban.0001.t:0 "창천이사"
 hd_yellow_turban.0001.desc:0 "낙양에서 온 급보를 펼치자마자, 당신은 [tang_zhou.GetName]의 밀고 소식을 보았다. 삼십육 방의 배치가 이미 드러났고, [ma_yuan_yi.GetName]도 이미 붙잡혀 처형되었다. 원래 정한 거사일은 아직 오지 않았지만, 관부의 수색은 기다려 주지 않는다.\n\n소식을 전한 이가 당신 앞에 엎드려 있는데, 소맷부리는 온통 길을 서두르며 묻은 진흙투성이다. 아직 몇 사람이나 알고 있느냐고 묻자, 그는 고개만 저었다. 지금 하루를 더 망설이면, 황색 깃발을 들려는 신도가 또 한 방면 줄어들지도 모른다.\n\n남양에는 장만성이, 영천에는 파재가 있어, 각 방면이 부중을 나누어 거느리고 있지만 아직은 동시에 군사를 일으킬 수 있다. 당신은 급보를 책상 위에 누르고, 다시 호령을 전하게 했다. 이미 예전으로 돌아갈 길이 없으니, 굳이 삼월 오일까지 기다릴 필요도 없다."
 hd_yellow_turban.0001.a:0 "창천은 이미 죽었으니, 황천이 마땅히 서리라!"
 hd_yellow_turban.0002.t:0 "황건의 득세"
 hd_yellow_turban.0002.desc:0 "황건이 승리했다는 소식이 사방으로 퍼졌다. 보고하러 온 이는 먼저 어느 곳을 함락했는지 말하고, 이어서 한 조정이 한 방면의 전장에서 이미 패배를 인정했다고 했으며, 끝으로 한마디를 덧붙였다. 나머지 몇 방면의 싸움은 아직 다 멈추지 않았다고.\n\n세 방면에서 황색 깃발이 나뉘어 올랐고, 이제 한 방면이 발판을 굳혔으며, 직접 함락한 현읍도 여전히 공취한 이의 손에 있다. 이 승리는 한 조정의 위망을 흔들기에 충분하지만, 각 방면의 군대와 각처 향리의 난제를 함께 사라지게 하지는 못한다.\n\n문밖에서는 벌써 천명이 바뀐다는 이야기가 오간다. 이 소식이 기뻐할 일이든 두려워할 일이든, 앞으로의 계획은 모두 새로 세워야 한다."
 hd_yellow_turban.0002.a:0 "천하가 이제부터 다사다난하리라."
 hd_yellow_turban.0003.t:0 "황건의 패망"
 hd_yellow_turban.0003.desc:0 "황건에 관한 마지막 전황 보고가 도착했다. 세 방면의 대군이 모두 패했다. 지난날 잇달아 위급을 알리던 곳들이 이제는 수복한 현읍과 흩어진 무리를 보고하기 시작했고, 소식을 전하는 이도 마침내 목소리를 높일 수 있게 되었다.\n\n그러나 전쟁은 승전보 한 장으로 끝낼 수 있어도, 묵어 버린 밭과 비어 버린 마을은 봉니가 굳는다고 해서 원래대로 돌아오지 않는다. 한 조정은 명위를 지켰지만, 지방에서 병권을 쥐어 본 이들도 모두 자신이 한때 어떻게 호령했는지 기억하고 있다.\n\n황건의 거사는 이미 실패로 끝났다. 이제 마주해야 할 것은 그것이 주군과 인심에 남긴 빈자리다."
 hd_yellow_turban.0003.a:0 "난은 평정되었으나 상처는 아직 아물지 않았다."
 hd_zhuojun_rangers:0 "탁군 의종"
 hd_zhuojun_rangers_adj:0 "탁군 의종"
