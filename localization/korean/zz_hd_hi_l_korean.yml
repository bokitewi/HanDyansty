 hd_hi.kebineng.t: "가비능의 변경 침략"
 hd_hi.kebineng.ctx: "단석괴가 죽은 뒤 선비의 여러 부족은 저마다 따로 움직였다. 소종 출신인 가비능은 상벌이 분명하여 차츰 막남의 여러 부족을 거두어들였고, 활을 당기는 기병이 십여만에 이르렀다."
 hd_hi.kebineng.rise: "\n\n가비능이 여러 부족의 기병을 모아 장성을 넘어 대군과 상곡으로 곧장 들이닥쳤다. 변새의 봉화가 하룻밤 사이에 모조리 타올랐다."
 hd_hi.kebineng.wait: "\n\n한나라 변군의 수비가 아직 엄중하니 가비능은 함부로 움직이지 못하고, 변새 밖에서 흩어진 부중을 거두고 활과 말을 다듬으며 남하할 때를 기다렸다."
 hd_hi.shujineng.t: "수기능의 난"
 hd_hi.shujineng.ctx: "진주와 양주 일대에 해마다 큰 가뭄이 들었는데도 관부는 부역을 다그쳤고, 하서의 선비와 여러 강족의 원한은 깊어만 갔다. 독발부의 수기능은 용맹하고 꾀가 많아 여러 호족이 기꺼이 그의 호령을 따랐다."
 hd_hi.shujineng.rise: "\n\n수기능이 진압하러 온 자사를 베어 죽이자 하서의 여러 호족이 일제히 호응하여 양주로 가는 길이 끊겼다."
 hd_hi.shujineng.wait: "\n\n조정이 진주와 양주에 대군을 주둔시키고 있으니, 수기능은 참고 움직이지 않은 채 몰래 여러 강족과 연락하며 원한을 칼날에 새겨 두었다."
 hd_hi.muronghui.t: "모용외의 굴기"
 hd_hi.muronghui.ctx: "모용부는 대대로 요서에 살며 단부, 우문부와 패권을 다투었다. 젊은 모용외는 부족을 물려받은 뒤 백성에게 농사와 양잠을 가르치고 떠돌던 중원의 사인들을 불러들여 부중이 날로 번성했다."
 hd_hi.muronghui.rise: "\n\n모용외가 부중을 정비하여 동쪽으로 부여를 치고 서쪽으로 단부와 우문부에 맞서며, 요서와 요동을 모두 모용씨의 휘하에 거두려 한다."
 hd_hi.muronghui.wait: "\n\n요동의 여러 부족이 세력이 엇비슷하니 모용외는 잠시 예봉을 감추고, 한편으로 유민을 안정시키며 한편으로 적이 빈틈을 보이기를 기다렸다."
 hd_hi.murongjun.t: "전연의 중원 진출"
 hd_hi.murongjun.ctx: "중원이 크게 어지러워져 염민이 호인을 도륙하니, 여러 호족과 한인이 서로 공격하고 죽여 하북이 온통 초토가 되었다. 요서의 모용씨는 병사가 강하고 말이 튼튼하여 장성 북쪽에서 형세를 지켜보고 있었다."
 hd_hi.murongjun.rise: "\n\n모용준이 군사를 세 길로 나누어 남하해 노룡새를 넘어 곧장 계성을 쳤다. 연나라의 철기가 하북 전체를 손에 넣으려 한다."
 hd_hi.murongjun.wait: "\n\n관내가 아직 안정되어 있으니 모용준은 군사를 움직이지 않고 요서에서 무기를 갈고 말을 먹이며 중원에 변고가 생기기를 조용히 기다렸다."
 hd_hi.tuobagui.t: "탁발규의 대 부흥과 위 건국"
 hd_hi.tuobagui.ctx: "대나라가 망한 뒤 탁발씨의 자손은 여러 부족에 흩어졌다. 소년 탁발규는 남의 집에 얹혀살았으나, 옛 부하들은 끝내 탁발씨의 은의를 잊지 않았다."
 hd_hi.tuobagui.rise: "\n\n탁발규가 우천에서 여러 부족을 크게 모아 대왕의 자리에 오르고, 곧이어 국호를 위로 고쳤다. 탁발씨의 기병이 다시 음산 기슭을 내달린다."
 hd_hi.tuobagui.wait: "\n\n여러 부족의 호수들이 저마다 딴마음을 품었고 탁발규는 아직 날개가 덜 자랐으니, 친족들 사이에 몸을 숨긴 채 한편으로 옛 부하를 결집하고 한편으로 천시를 기다릴 수밖에 없었다."
 hd_hi.murongchui.t: "모용수의 복국"
 hd_hi.murongchui.ctx: "모용수는 지난날 화를 피하려 타국에 몸을 의탁하여 그 많은 재주를 펼칠 곳이 없었다. 이제 천하가 요동치니, 옛 연나라의 유민들이 아직 하북에서 모용씨가 돌아오기를 기다리고 있다."
 hd_hi.murongchui.rise: "\n\n모용수가 형양에서 연왕을 자칭하자 옛 부하들이 소문을 듣고 몰려왔고, 대군이 북쪽으로 황하를 건너 곧장 업성을 겨누었다."
 hd_hi.murongchui.wait: "\n\n지금은 시국이 아직 어지럽지 않으니 모용수는 참을 수밖에 없다. 모용씨의 자제들을 거두며, 한 번 부르면 백 사람이 응할 때를 기다렸다."
 hd_hi.yaochang.t: "요장의 진 건국"
 hd_hi.yaochang.ctx: "요씨 강족은 대대로 관중에 살았고 부중이 수만에 이르렀다. 요장은 반평생을 부형을 따라 싸웠는데, 이제 형들이 모두 죽어 강족의 운명이 그 한 사람에게 지워졌다."
 hd_hi.yaochang.rise: "\n\n요장이 위북으로 달아나자 여러 강족이 그를 맹주로 추대했고, 그는 대선우, 만년진왕을 자칭했다. 관중에 다시 전란이 일었다."
 hd_hi.yaochang.wait: "\n\n관중에 아직 강한 군주가 버티고 있으니 요장은 잠시 고개를 숙이고, 강족의 호수들을 하나하나 자기 곁으로 끌어들였다."
 hd_hi.qifuguoren.t: "걸복국인의 서진 건국"
 hd_hi.qifuguoren.ctx: "걸복부는 대대로 농서에 살며 여러 차례 강한 이웃에 의탁했다. 걸복국인은 용맹과 지략이 남달라, 부중은 모두 그가 걸복씨를 이끌고 자립하기를 바랐다."
 hd_hi.qifuguoren.rise: "\n\n걸복국인이 농서의 여러 부족을 불러 모아 대도독, 대선우를 자칭하고 용사천에 성을 쌓아 나라를 세웠다."
 hd_hi.qifuguoren.wait: "\n\n농우의 강한 이웃이 아직 건재하니 걸복국인은 겉으로만 비위를 맞추며 몰래 농서 선비를 모았다."
 hd_hi.lvguang.t: "여광의 하서 회군"
 hd_hi.lvguang.ctx: "여광은 명을 받들어 서쪽을 정벌하여 서역의 삼십여 나라를 평정하고, 기병 이만과 수많은 낙타와 말, 구자의 보화를 이끌고 동쪽으로 돌아오고 있었다. 도중에 소식이 전해졌다. 중원이 이미 크게 어지러워졌다는 것이다."
 hd_hi.lvguang.rise: "\n\n여광의 대군이 옥문관으로 들어오자 하서의 여러 군이 형세를 보고 항복했다. 그가 고장에서 양주목을 자칭하니, 하서는 이로써 여씨의 땅이 되었다."
 hd_hi.lvguang.wait: "\n\n하서의 수장들이 아직 스스로를 지킬 만하니 여광의 대군은 잠시 돈황에 머물 수밖에 없었다. 사람도 말도 지친 채 정세가 바뀌기를 기다렸다."
 hd_hi.tufawugu.t: "독발오고의 남량 건국"
 hd_hi.tufawugu.ctx: "수기능이 패망한 지 이미 백 년이 지났으나 독발부는 선조의 영광을 잊은 적이 없었다. 오고는 농사에 힘쓰고 무예를 익히며 인재를 불러들여 부중이 날로 강성해졌다."
 hd_hi.tufawugu.rise: "\n\n독발오고가 서평왕을 자칭하고 군사를 곧장 황수와 금성으로 향하니, 하서 선비가 다시 한번 칼과 창을 들었다."
 hd_hi.tufawugu.wait: "\n\n양주에 아직 강한 군주가 있으니 오고는 신하를 칭하며 공물을 바칠 수밖에 없었고, 야심을 공손한 말 속에 감추었다."
 hd_hi.juqumengxun.t: "저거몽손의 양주 점거"
 hd_hi.juqumengxun.ctx: "노수호 저거씨는 대대로 부락의 수령이었다. 몽손은 여러 역사서를 두루 읽고 천문에도 밝아, 부중은 모두 그에게 영웅호걸의 재주가 있다고 말했다."
 hd_hi.juqumengxun.rise: "\n\n저거몽손이 무리 만 명을 모아 금산에 주둔하고, 장액의 호족들과 함께 거사를 꾀하니 하서의 여러 군이 들썩였다."
 hd_hi.juqumengxun.wait: "\n\n하서의 주인이 아직 강하니 몽손은 거짓으로 신복하는 척하며 뒤로는 노수호의 부락을 하나하나 거두어들였다."
 hd_hi.helianbobo.t: "혁련발발의 하 건국"
 hd_hi.helianbobo.ctx: "철불부가 북위에게 격파되었을 때 소년 발발은 요행히 살아남아 이리저리 남에게 몸을 의탁했다. 키가 여덟 자 다섯 치에 성정이 사나운 그는 일족이 멸망당한 원수를 한시도 잊지 않았다."
 hd_hi.helianbobo.rise: "\n\n발발이 장인을 기습해 죽이고 그 부중을 빼앗아 대하천왕을 자칭했다. 하나라 군대는 바람처럼 오가니, 영북의 여러 성은 아침에 저녁을 기약할 수 없었다."
 hd_hi.helianbobo.wait: "\n\n변새 밖의 여러 강자가 둘러싸고 노려보니 발발은 남에게 얹혀살며 원한과 야심을 함께 가슴 깊이 눌러 둘 수밖에 없었다."
 hd_hi.shelun.t: "사륜의 칸 즉위"
 hd_hi.shelun.ctx: "유연부는 거듭 북위에게 패하여 사륜은 남은 무리를 이끌고 멀리 막북으로 달아났다. 그곳은 물과 풀이 풍성하고 고차의 여러 부족이 흩어져 사는, 부족을 다시 일으키기에 좋은 땅이었다."
 hd_hi.shelun.rise: "\n\n사륜이 고차의 여러 부족을 병합하고 구두벌가한이라 자칭하며 군법을 세워 천 명을 군으로, 백 명을 당으로 삼았다. 유연의 기병이 남쪽 변경을 침략하기 시작했다."
 hd_hi.shelun.wait: "\n\n남쪽의 강적이 병세가 한창 성하니 사륜은 막북에서 유목하며 흩어진 부락을 거두고 남쪽이 빈틈을 보이기를 기다릴 수밖에 없었다."
 hd_hi.tande.t: "광개토왕의 영토 확장"
 hd_hi.tande.ctx: "고구려는 요동과 백제 사이에 끼어 살아남기를 도모했으며, 여러 대의 군왕이 전장에서 한을 삼켰다. 젊은 담덕이 즉위하여 선왕의 치욕을 씻겠다고 맹세했다."
 hd_hi.tande.rise: "\n\n담덕이 몸소 보병과 기병을 이끌고 서쪽으로 요수를 건너고, 다시 군사를 돌려 남하하니 백제의 여러 성이 잇달아 함락되었다. 고구려 사람들은 그를 광개토경평안호태왕이라 불렀다."
 hd_hi.tande.wait: "\n\n요동의 강한 이웃이 아직 쇠하지 않았으니 담덕은 군대를 정비하고 무예를 닦으며 영토를 넓힐 좋은 때를 기다렸다."
 hd_hi.balin.t: "육진의 난"
 hd_hi.balin.ctx: "북쪽 변경 육진의 장병은 본디 나라의 손발이었으나, 이제는 진호로 전락하여 굶주림과 추위에 시달리며 온갖 업신여김을 받았다. 옥야진의 파육한발릉은 군중에서 평소 위망이 높았다."
 hd_hi.balin.rise: "\n\n발릉이 무리를 모아 진장을 죽이고 진왕으로 개원했다. 육진의 굶주린 백성이 잇달아 호응하니 북쪽 변경에 들불이 번졌다."
 hd_hi.balin.wait: "\n\n진장이 아직 억누를 힘이 있으니 발릉은 분노를 가슴에 묻고 몰래 각 진의 호걸들과 연락했다."
 hd_hi.tumen.t: "돌궐의 굴기"
 hd_hi.tumen.ctx: "돌궐인은 대대로 유연을 위해 쇠를 단련하여 단노라 불렸다. 토문의 부중이 차츰 번성하자 유연 가한에게 혼인을 청했으나 돌아온 것은 모욕뿐이었다."
 hd_hi.tumen.rise: "\n\n토문이 고차의 여러 부족과 연합하여 유연을 크게 격파하고 이리가한이라 자칭했다. 초원의 주인이 이로써 돌궐로 바뀌었다."
 hd_hi.tumen.wait: "\n\n유연 가한의 병세가 아직 성하니 토문은 굴욕을 참고 무거운 짐을 지며 여전히 유연을 위해 쇠를 두드리고 몰래 부중을 거두었다."
 hd_hi.muhan.t: "목간가한의 남침"
 hd_hi.muhan.ctx: "목간가한은 생김새가 기이하고 굳세며 꾀가 많아, 서쪽으로 엽달을 격파하고 동쪽으로 거란을 몰아냈으며 북쪽으로 계골을 병합하여 변새 밖 여러 나라를 위엄으로 복종시켰다. 남쪽의 두 나라는 앞다투어 그의 환심을 사려 했다."
 hd_hi.muhan.rise: "\n\n목간가한이 기병 십만을 이끌고 남하하여 중원의 군대와 함께 진양을 공격했다. 돌궐의 철기가 처음으로 병주 땅을 밟았다."
 hd_hi.muhan.wait: "\n\n남쪽의 병력이 아직 강하니 목간가한은 두 나라의 세폐만 앉아서 받으며 그들이 서로 죽이는 것을 조용히 지켜보았다."
 hd_hi.shabolue.t: "사발략의 변경 침략"
 hd_hi.shabolue.ctx: "사발략가한의 가하돈은 중원의 옛 왕조 출신이었다. 옛 왕조가 무너지자 그녀는 밤낮으로 가한에게 친정 나라의 원수를 갚아 달라고 청했다."
 hd_hi.shabolue.rise: "\n\n사발략가한이 여러 가한과 군사 사십만을 합쳐 목협과 석문 두 길로 변새를 넘으니, 하서와 농우, 대북이 동시에 위급을 알렸다."
 hd_hi.shabolue.wait: "\n\n중원의 새 군주는 기반이 아직 굳지 않았으나 병세가 한창 성하니, 사발략은 군사를 움직이지 않고 가하돈이 밤낮으로 울며 호소하는 것을 들을 수밖에 없었다."
 hd_hi.liuyu.t: "유유의 경구 거병"
 hd_hi.liuyu.ctx: "유유는 미천한 출신으로 소년 시절 짚신을 팔아 생계를 이었으며, 전공으로 북부군에서 두각을 나타냈다. 이제 조정의 권신이 찬역을 저지르니, 천하 사람들은 누가 감히 맨 먼저 나설지 지켜보고 있다."
 hd_hi.liuyu.rise: "\n\n유유가 경구에서 의사들을 모아 수장을 베고 사방에 격문을 돌렸다. 북부의 건아들이 그를 따라 강을 건너 서쪽으로 진군하니 가는 곳마다 파죽지세였다."
 hd_hi.liuyu.wait: "\n\n조정 권신의 기반이 한창 굳건하니 유유는 참을 수밖에 없었고, 북부군 안에서 뜻을 같이하는 형제들을 사귀었다."
 hd_hi.erzhurong.t: "이주영의 낙양 입성"
 hd_hi.erzhurong.ctx: "이주씨는 대대로 수용천에 살며 소와 양, 낙타와 말이 온 산과 들을 덮었다. 육진의 난이 일어나자 이주영은 가산을 모두 털어 의용병을 모았고, 그 휘하는 이미 북방에서 가장 정예한 기병이 되었다."
 hd_hi.erzhurong.rise: "\n\n이주영이 선제의 원수를 갚는다는 구실로 군사를 이끌고 남하하여 황하를 건너 곧장 낙양으로 들어갔다. 조정의 공경들은 저마다 위태로움을 느꼈다."
 hd_hi.erzhurong.wait: "\n\n낙양 조정이 아직 사방에 호령할 수 있으니 이주영은 수용에 머물며 한편으로 유민을 거두고 한편으로 조정의 형세를 엿볼 수밖에 없었다."
 hd_hi.gaohuan.t: "고환의 신도 거병"
 hd_hi.gaohuan.ctx: "고환은 회삭진에서 자라 육진 장병의 고초를 잘 알았다. 일찍이 이주씨의 휘하에서 일했던 그는 이제 육진의 항호 이십만을 손에 쥐고 있다."
 hd_hi.gaohuan.rise: "\n\n고환이 신도에서 거병하여 하북의 호족들과 동맹을 맺고, 이주씨를 쓸어버리고 천하를 호령하겠다고 맹세했다."
 hd_hi.gaohuan.wait: "\n\n이주씨의 병사가 강하고 말이 튼튼하니 고환은 겉으로 공손한 척하며 육진의 항호를 단단히 손에 쥐고 있을 수밖에 없었다."
 hd_hi.yuwentai.t: "우문태의 관중 점거"
 hd_hi.yuwentai.ctx: "우문태는 무천진 출신으로 군을 따라 관중에 들어온 뒤 여러 차례 전공을 세웠다. 관롱의 장병들은 모두 그에게 식견과 도량이 있다며 기꺼이 따르려 했다."
 hd_hi.yuwentai.rise: "\n\n우문태가 여러 장수에게 추대되어 통수가 되고 군사를 이끌고 동진하여 장안을 차지하니, 관중은 이로써 독자적인 나라가 되었다."
 hd_hi.yuwentai.wait: "\n\n관중의 주장이 아직 건재하니 우문태는 참고 움직이지 않으며, 무천의 옛 벗들을 하나하나 곁으로 끌어들였다."
 hd_hi.houjing.t: "후경의 난"
 hd_hi.houjing.ctx: "후경은 오른발이 짧아 활쏘기와 말타기는 뛰어나지 않았으나 지략에 능했다. 이리저리 떠돌다 남조에 몸을 의탁해 지금은 수양에 군사를 주둔시키고 있는데, 자신이 포로 교환의 대가로 넘겨질지도 모른다는 소식을 들었다."
 hd_hi.houjing.rise: "\n\n후경이 군주 곁의 간신을 제거한다는 명분으로 팔천 명을 이끌고 장강을 건너 대성을 포위했다. 강남 백 년의 번영이 이로써 잿더미가 되었다."
 hd_hi.houjing.wait: "\n\n강남 조정의 병력이 아직 두터우니 후경은 수양에서 목숨을 내던질 무리를 거두며 조용히 때를 기다릴 수밖에 없었다."
 hd_hi.yangjian.t: "양견의 주 찬탈"
 hd_hi.yangjian.ctx: "양견은 관롱의 무장 세가 출신으로 용모가 기이하고 웅장하여 사람들이 제왕의 상이 있다고 했다. 어린 군주가 즉위하자 조정의 대권이 차츰 그의 손에 들어왔다."
 hd_hi.yangjian.rise: "\n\n양견이 조정을 총괄하고 세 방면의 반란을 평정한 뒤 곧바로 선양을 받아 황제를 칭하니, 국호를 수라 했다. 그의 눈길은 이미 장강 이남을 향하고 있다."
 hd_hi.yangjian.wait: "\n\n조정의 종실이 아직 강하니 양견은 매사에 신중히 처신하며 관롱의 장수들을 하나하나 끌어들일 수밖에 없었다."

 hd_hi.0200.ok: "\n\n당신은 오랜 세월을 기다렸다. 이제 사방의 수비가 차츰 느슨해지고, 옛 부하와 호걸들이 무리 지어 찾아와 모두 같은 것을 묻는다. 언제 움직이느냐고."
 hd_hi.0200.bad: "\n\n당신은 오랜 세월을 기다렸지만, 지금도 상대는 여전히 강대하여 정면으로 부딪치면 부중을 헛되이 잃을 뿐이다. 어떤 이는 눈앞의 모든 것을 버리고 심복을 데리고 멀리 고향으로 떠나, 옛 명분을 내걸고 기회를 엿보라고 권한다."
 hd_hi.0200.vassal: "\n\n일단 거사하면 당신과 주상 사이의 군신 관계는 거기서 끝난다."
 hd_hi.0200.a: "때는 기다려 주지 않는다. 군사를 일으키자"
 hd_hi.0200.b: "땅을 버리고 멀리 떠나 기회를 엿본다"
 hd_hi.0200.c: "잠시 예봉을 피하며 천시를 기다린다"
 hd_hi.0200.d: "본분을 지키며 군사를 움직이지 않는다"

 hd_hi.0300.desc: "\n\n[hd_hi_leader.GetFirstNameNoTooltip]의 옛 부하들과의 왕래가 근래 잦았다. 어젯밤 그가 당신 앞에 와서, 늘 하고 싶었던 일을 하러 떠날 수 있게 놓아 달라고 청했다."
 hd_hi.0300.a: "사람마다 뜻이 있는 법, 가게 둔다"
 hd_hi.0300.b: "이 자는 놓아줄 수 없다. 억지로 붙잡아 둔다"

 hd_hi.1001.a: "변화를 조용히 지켜본다"
 hd_hi.1001.b: "그 일에 몸을 던진다"

 hd_hi.1002.desc: "\n\n당신이 다스리는 땅을 그는 이미 마음에 새겨 두었다."
 hd_hi.1002.a: "경계를 엄중히 한다"

