l_korean:
 # 衣冠南渡·核心逻辑（模块 A2）：通告事件 0001–0004、0011–0014、弹窗、结局决议与提示

 ############################
 # 结局决议
 ############################
 hd_yiguan_ending_guangfu_decision:0 "光复中原"
 hd_yiguan_ending_guangfu_decision_desc:0 "王师北上，旧都在望。北方八州大半重归版图，洛阳、长安的宫阙之上又插起了汉家旌旗。此时昭告天下、宣布中原光复，方能告慰南渡以来流离失所的衣冠士民。"
 hd_yiguan_ending_guangfu_decision_tooltip:0 "宣告中原光复，结束衣冠南渡"
 hd_yiguan_ending_guangfu_decision_confirm:0 "旧都重光！"
 hd_yiguan_ending_heliu_decision:0 "胡汉合流"
 hd_yiguan_ending_heliu_decision_desc:0 "北方诸朝早已易衣冠、行汉制，朝堂上胡汉同列，乡里间婚姻相通。当年南渡时那条泾渭分明的界线，如今已模糊难辨。由北方最强的汉化之朝昭告天下：此后不复以胡汉论人。"
 hd_yiguan_ending_heliu_decision_tooltip:0 "宣告胡汉合流，结束衣冠南渡"
 hd_yiguan_ending_heliu_decision_confirm:0 "礼乐所在，便是华夏。"
 hd_yiguan_ending_lunsang_decision:0 "衣冠沦丧"
 hd_yiguan_ending_lunsang_decision_desc:0 "两京俱在掌中，北方诸州望风而附，江左小朝廷已无力北顾。是时候昭告四方：中原之主，自此易姓。"
 hd_yiguan_ending_lunsang_decision_tooltip:0 "宣告入主中原，结束衣冠南渡"
 hd_yiguan_ending_lunsang_decision_confirm:0 "天下已定！"

