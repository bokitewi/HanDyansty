 ############################
 # 弹窗（非参与者玩家）
 ############################
 hd_yiguan_toast_start:0 "北方沦于胡人，衣冠士族纷纷南渡。"
 hd_yiguan_toast_taowang:0 "胡骑复炽，北方士民再度南逃。衣冠南渡重入逃亡期。"
 hd_yiguan_toast_chongtu:0 "南北交兵，衣冠南渡进入冲突期。"
 hd_yiguan_toast_tingzhi:0 "南北隔江对峙之势已成，衣冠南渡进入停滞期。"
 hd_yiguan_toast_restored:0 "王师克复中原，衣冠南渡至此告终。"
 hd_yiguan_toast_sinicized:0 "北方诸朝尽行汉制，胡汉渐归一体，衣冠南渡至此告终。"
 hd_yiguan_toast_lost:0 "中原尽入胡人之手，江左偏安一隅，衣冠南渡至此告终。"
 hd_yiguan_toast_fallback_guangfu:0 "南渡二百年，北方大半复归汉人，衣冠南渡以光复中原告终。"
 hd_yiguan_toast_fallback_heliu:0 "南渡二百年，北方尽归汉化之朝，衣冠南渡以胡汉合流告终。"
 hd_yiguan_toast_fallback_lunsang:0 "南渡二百年，北方终为胡人所有，衣冠南渡以衣冠沦丧告终。"

 ############################
 # 0001 开局
 ############################
 hd_yiguan.0001.t:0 "衣冠南渡"
 hd_yiguan.0001.desc:0 "报信的人说到渡口，嗓子已经哑了：车轮陷在泥里，抱孩子的人挤不到船边，连往日不肯与人同席的士族，如今也在争一处落脚的地方。我让他歇一口气，他却急着问，后面的人还能往哪里去。\n\n北方的来信接连断了音讯，城邑易主、乡里离散的传闻越来越多。有人携着家谱南行，有人守着坞壁不走；同一个故乡的名字，正被写在相隔千里的求援书上。\n\n我听着门外仍未停息的通报。无论如何看待这场兵乱，此后要面对的，已不只是换了旗号的几座城。"
 hd_yiguan.0001.a:0 "天下将何去何从？"
 hd_yiguan.0001.desc_north:0 "捷报是夜里送到的。信使跪在帐前，一口气报出好几座城邑的名字，末了才说：洛阳、长安，俱已入手。帐中诸将哄然称贺，有人把从宫中搬出的器物摆了一地，问我该赏给哪一部。\n\n南边的消息也陆续传来：汉人的公卿士族扶老携幼，争渡江淮，许多坞壁人去楼空；也有豪强闭门自守，遣人来探我的口风。打下城池不难，可这些空出来的田土、逃散的户口，往后由谁耕种、向谁纳赋，一时还无人说得清。\n\n我让人把舆图铺开。中原这片地方，从前只在老人口中听过；如今它就在马蹄之下，怎样坐稳它，才是真正的难处。"
 hd_yiguan.0001.b:0 "中原已在马蹄之下。"

 ############################
 # 0002 重入逃亡
 ############################
 hd_yiguan.0002.t:0 "胡尘再起"
 hd_yiguan.0002.desc:0 "城外又来了一批扶老携幼的人。问起来历，说的都是前些年才收复、如今又丢了的地名。有人背着刚誊好的户籍，有人只抱出一卷祖先的牌位；他们并不哭，只是反复打听哪一处渡口还有船。\n\n北边的消息一日紧过一日：城池易手，守将或死或降，胡骑的游哨已出没于淮北。前些年北还故土、重开阡陌的盘算，转眼都成了空话，许多人家只好再一次收拾行装。\n\n我让人在城门边多设几处粥棚。人们又一次涌向江边，这一回，谁也说不准还能退到哪里。"
 hd_yiguan.0002.a:0 "且固守江淮。"
 hd_yiguan.0002.desc_north:0 "前些年丢掉的几座城，这一年又一座座收了回来。守城的南人或降或走，降卒说，城中百姓一听见我军的鼓声，便背着户籍、抱着牌位往南逃去。\n\n诸将请令乘胜追击，有人主张直下淮北，有人劝我先安抚新得的郡县。南边这些年在此重开阡陌、招抚流亡的那番经营，转眼都落了空。\n\n我站在城头，望着南去的大路，路上的人群一直延伸到看不见的地方。土地回来了，人却又一次走了。"
 hd_yiguan.0002.b:0 "乘势经略淮北。"

 ############################
 # 0003 进入冲突
 ############################
 hd_yiguan.0003.t:0 "南北交兵"
 hd_yiguan.0003.desc:0 "校场上的鼓声比往年密了。新募的士卒多半操着北方口音，问他们为何从军，答的总是同一句：家在河北，想回去看看。将领们围着舆图争得面红耳赤，有人主张先取淮北，有人说要直趋洛阳。\n\n北边的胡主也没有闲着。边境的戍堡接连告急，坞壁里的豪强一面向胡廷纳贡，一面暗中遣人南来联络；那些寄人篱下多年的侨姓子弟，也开始变卖田宅、招募部曲。\n\n我翻看着往来的军书，知道安稳的日子到头了。江淮之间，从今往后不只是一道疆界，也是一条战线。"
 hd_yiguan.0003.a:0 "枕戈待旦。"
 hd_yiguan.0003.desc_north:0 "南边的细作回报：江淮之间又在募兵，营中多是北方口音的流民子弟，日夜操练，口口声声要打回故乡。边境的戍堡接连告急，有几处坞壁明里向我纳贡，暗里却与南人书信往还。\n\n朝中议论纷纷。有人主张先发制人，渡淮扫荡；有人担心境内汉人趁机响应，劝我先收紧各郡的守备。听说那些南逃多年的士族子弟，也在变卖田宅、招募部曲。\n\n我把边报一封封看完。往后这条边界不会再太平，与其坐等他们打来，不如早作准备。"

 ############################
 # 0004 进入停滞
 ############################
 hd_yiguan.0004.t:0 "南北对峙"
 hd_yiguan.0004.desc:0 "一位来客指着舆图上的淮水，说起某处渡口，仍叫得出沿岸村落的旧名；年轻的随从却要凑近细看，才知道那地方究竟在哪。兵乱拖得久了，同一条河，在不同人心里竟已隔着这样的距离。\n\n南方屯田积粟，北方安抚郡县，往来的消息渐渐从攻守换成了互市、通使与婚聘。有人说恢复无期，有人说正好休养，话虽相反，都不得不承认两边谁也吃不下谁。\n\n我听见来客又提起一次未成的归乡之行。眼前的疆界还会不会改变，无人能向他担保；但南北各据一方的局面，已须当作眼下的实情来应对。"
 hd_yiguan.0004.a:0 "来日方长。"

 ############################
 # 0011 光复中原
 ############################
 hd_yiguan.0011.t:0 "中原光复"
 hd_yiguan.0011.desc_ender:0 "#high [hd_yiguan_ender.GetTitledFirstName]#!的诏书传遍南北：王师已克复中原，衣冠南渡，至此终了。\n\n"
 hd_yiguan.0011.desc:0 "报捷的消息念到故都时，旁边一名老者忽然请人再念一遍。他问的不是斩获多少，而是通往旧乡的道路是否已经打开；得到答复后，他低头拭了拭眼角，许久没有说话。\n\n王师重新占据中原诸地，南迁以来悬在许多人心头的那件事，总算有了一个交代。我却还听见有人追问田契、坟茔与失散的亲人：城池可以收复，当年离开的人，未必都能原样回去。\n\n消息很快传开，听闻的人有喜有忧。我将战报收好，想到那些只凭家中口述才认得北方的后辈：对他们而言，这些旧乡的名字，终于不再只是故事里的地方。"
 hd_yiguan.0011.a:0 "旧都重光！"
 hd_yiguan.0011.desc_north:0 "汉军入城的消息传到时，殿上许久没有人开口。几位老臣还记得当年入主中原时的盛况，如今却要商议往哪里退、留多少人马断后。\n\n城中的汉人百姓有的闭门不出，有的已在街口焚香迎候王师；我的部众收拾车帐，各自寻路北去。那些年修起的宫室、定下的法度，转眼都要换上别人的旗号。\n\n我最后看了一眼这座城。打下它的时候，以为可以传之子孙；如今才明白，守住一片土地，远比夺取它难。"
 hd_yiguan.0011.b:0 "且退守故地，以待来日。"

 ############################
 # 0012 胡汉合流
 ############################
 hd_yiguan.0012.t:0 "胡汉合流"
 hd_yiguan.0012.desc_ender:0 "#high [hd_yiguan_ender.GetTitledFirstName]#!颁诏天下：胡汉一体，礼乐同风。衣冠南渡，至此告一段落。\n\n"
 hd_yiguan.0012.desc:0 "谈到北方的新政，来客拿出一封书信，请我看看上面的称谓与署名。他说，如今许多事情须依中原的礼法办理，过去隔在胡汉之间的界线，已经不像从前那样分明。旁边有人点头，也有人仍不肯轻信。\n\n我逐句读着，没有急着替谁下结论。改用衣冠、语言与典章，能够写进诏令；邻里肯不肯相亲，旧怨能否消解，却还要看日后的待人处事。只是把北方一概说成旧时模样，显然也已失实。\n\n来客等着我的答语。我把信折回原处：这场南渡留下的问题，如今有了一种不同于刀兵的回答。"
 hd_yiguan.0012.a:0 "礼乐所在，便是华夏。"

 ############################
 # 0013 衣冠沦丧
 ############################
 hd_yiguan.0013.t:0 "中原沦丧"
 hd_yiguan.0013.desc_ender:0 "#high [hd_yiguan_ender.GetTitledFirstName]#!入据两京，北方诸州尽归其手，昭告四方：中原之主，自此易姓。\n\n"
 hd_yiguan.0013.desc:0 "最后一处北方据点失守的消息传来，先前还在争论援兵的人慢慢住了口。一名熟悉当地道路的来客问了几句，终于不再追问，只把随身带来的旧图卷了起来。\n\n这些年，许多人把留守、逃亡与举兵的希望寄在那里；如今城邑尽失，再说接应，连可以落脚的地方也难指出。江左传来的人还在争论能否再出兵，隔着江淮望向北方，却不得不承认眼前的兵势已经改变。\n\n我看着那卷被收起的地图。它没有因此少一条道路、一个乡名，可从今往后，谁若还要谈归去，就必须先说明，准备怎样越过如今横在其间的重重关隘。"
 hd_yiguan.0013.a:0 "神州陆沉，徒唤奈何。"
 hd_yiguan.0013.desc_victor:0 "最后一处据城顽抗的汉人营垒开门出降，捷报传遍诸部。将士们在营中饮酒高歌，有人把缴获的旧朝印绶捧到我面前，问该如何处置。\n\n南边的朝廷只剩江左一隅，再也无力北顾。北方诸州的豪强坞主陆续遣子弟来朝，愿意纳贡称臣；那些不肯低头的士族，早已渡江而去。从河北到关中，再没有人能与我们争夺这片土地。\n\n我让人把印绶收进府库。中原换主，自古不止一回；往后史官会用怎样的笔墨写下我们，还要看我们如何治理这片天下。"
 hd_yiguan.0013.b:0 "天命在我！"

 ############################
 # 0014 二百年定局（兜底）
 ############################
 hd_yiguan.0014.t:0 "二百年定局"
 hd_yiguan.0014.desc_guangfu:0 "南渡至今，已历二百年。当年仓皇过江的人早已作古，他们的子孙却一代代打了回去：淮北、河南、关中，旧日的郡县一处处重新编入汉家户籍。\n\n这场光复没有哪一位君主能独揽其功。它是许多次北伐、许多处坞壁、许多家侨姓前后相续的结果，等到史官回头清点，才发觉北方大半早已复归汉人。\n\n我听人念完各地报来的户口数，想起祖上留下的那份北方家谱。旧乡的名字，终于又能写进当今的地志了。"
 hd_yiguan.0014.desc_heliu:0 "南渡至今，已历二百年。北方诸朝改易衣冠、修订礼律，入仕的胡人子弟读的是一样的经书，乡里的婚聘也早已不问出身。\n\n没有哪一纸诏书宣告过合流，只是年复一年，旧日的界线自己淡了下去。等到有人想起要问胡汉之别，才发现已很难说清。\n\n我看着北来使者递上的国书，文辞典雅，与江左并无二致。这一场南渡留下的问题，终究被岁月给了回答。"
 hd_yiguan.0014.desc_lunsang:0 "南渡至今，已历二百年。北方的城邑换了几轮主人，却始终没有回到汉人手中；江左的人说起中原，语气已像在说一段遥远的往事。\n\n北伐的檄文越写越少，侨州的名号还挂在南方的郡县上，只是再没有人真以为能凭它们回去。年轻一辈生在江南、长在江南，对北方的了解，只剩书中几句。\n\n我听着席间关于收成与漕运的议论，明白这已是两个天下的格局。所谓南渡，早已不是一时的避难，而是一代代人安身的定局。"
 hd_yiguan.0014.desc_guangfu_north:0 "南渡至今，已历二百年。先人打下的郡县，一处处被汉人收了回去：有的是兵败而失，有的是城中百姓开门迎降。到如今，北方大半已重新编入汉家的户籍。\n\n族中老人还会讲起当年入主中原的故事，年轻一辈听着，只觉得遥远。部众有的北归故地，有的留在中原，渐渐也学会了耕种与读书。\n\n我看着使者带回的汉人史书，那上面记的是诸胡兴亡之数。这二百年的往事，终究要由别人来书写了。"
 hd_yiguan.0014.desc_heliu_north:0 "南渡至今，已历二百年。当年入主中原的先人说的是另一种话，穿的是另一样衣裳；到了如今，北方朝堂上的诏令、学宫里的经书，都已与江左并无二致。\n\n胡汉通婚早成寻常事，族中子弟读的是同样的经义，写的是同一种文辞。偶尔有人想起要分辨谁是胡、谁是汉，却发现已很难说清。\n\n我翻阅着新修的礼典。南渡留下的那道界线，没有被刀兵抹平，却在岁月里自己淡了下去。"
 hd_yiguan.0014.desc_lunsang_north:0 "南渡至今，已历二百年。先人打下的中原，已经传了好几代。南人仍守着江左，侨州的名号挂在他们的郡县上，北伐的檄文却越来越少。\n\n族中子弟生在中原、长在中原，说起祖辈的故地，倒像在说一段遥远的往事。坞壁里的汉人豪强早已纳贡称臣，与我们通婚、同朝为官。\n\n我听着席间关于收成与漕运的议论，明白这已是两个天下的格局。这片土地，已是我们子孙安身立命的地方。"
 hd_yiguan.0014.a:0 "百年兴替，尽付史笔。"
