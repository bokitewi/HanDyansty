l_korean:
 trait_hd_wangzuo_zhicai:0 "왕좌지재"
 trait_hd_wangzuo_zhicai_desc:0 "이 인물은 왕업을 보필하고 뭇 정사를 총괄할 재능을 지녔다. 안으로는 정사와 재정을 다스리고, 밖으로는 외교의 자리에서 상대를 꺾으며, 권모와 임기응변에도 깊이 통달했다. 한 지방을 맡겨 다스리게 하면 정령이 막힘없이 통할 것이다."
 hd_wangzuo_governor_efficiency_desc:0 "왕좌지재"
 trait_hd_laodang_yizhuang:0 "노당익장"
 trait_hd_laodang_yizhuang_desc:0 "이 인물은 나이가 들었으나 근골과 기력은 쇠하지 않아, 갑옷을 입고 말에 오르는 모습이 예전과 다름없이 정정하다."
