l_korean:
 hds_nr.1.t:0 "남양 황건의 항복"
 hds_nr.1.desc:0 "남양에 흩어져 있던 황건 무리가 사람을 보내 항복을 청해 왔습니다. 명부를 읽어 내려가던 사자는 나중에는 입이 바싹 말라, 당신은 그에게 잠시 멈추고 물 한 모금 마시라 하고 뒷부분의 이름을 직접 넘겨 보았습니다.\n\n인원수는 한 치의 틀림도 없이 보고되었지만, 막상 대오로 편성하려면 얼마나 더 품이 들지 알 수 없습니다. 유벽, 황소, 하의, 하만 등 옛 부하들도 그 안에 들어 있습니다. 따르기로 한 장수들은 차례로 도착할 것이니, 오늘의 약속 하나에 모두를 밀어 넣을 필요는 없습니다.\n\n당신은 명부를 책상 앞에 두었습니다. 영문은 사람을 들이기만 해서는 안 되며, 누가 어느 부대를 이끌고 누가 어떤 명령을 따르는지도 이어서 분명히 해야 합니다. 그래도 사람들이 귀순하겠다니, 시골에 흩어져 당신의 병사들과 밭두렁을 사이에 두고 마주 보게 하는 것보다는 낫습니다."
 hds_nr.1.a:0 "그 무리를 거두고 대오를 편성하라."
 hds_nr_nanyang_yellow_turbans:0 "남양 황건 항복군"
 hds_nr_sun_jian_mortal_risk:0 "강동의 범의 험난한 길"
 hds_nr_sun_jian_mortal_risk_desc:0 "동탁 토벌군이 흩어진 뒤에도 이 인물은 여전히 여러 차례 칼날을 무릅쓰고 위험한 곳을 드나들어, 측근들이 늘 마음을 졸입니다."
