 # 来源：localization/replace/simp_chinese/WJ_xiaolian_direct_qualification_l_simp_chinese.yml
 wj_request_xiaolian_interaction_desc:0 "상대에게 당신 자신이나 당신 문하의 남자 한 명을 효렴으로 천거해 달라고 청하여, 벼슬길에 나설 수 있게 합니다."
 wj_xiaolian_interaction_desc:0 "올해 찰거 정원으로 이 사람을 효렴으로 천거하여 벼슬길에 나설 수 있게 합니다. 요구가 지나치면 상대가 사양할 수도 있습니다."

 # 来源：localization/simp_chinese/WJ_conquest_l_simp_chinese.yml
 WJ_conquest_commission_interaction:0 "정벌 지정"
 WJ_conquest_commission_interaction_desc:0 "도독 [recipient.Custom('WJ_GetLinkedUIName')]에게 휘하를 이끌고 인접한 경외의 [duchy|E](을)를 정벌하게 하며, 얻은 땅은 조정에 귀속됩니다."

 # 来源：localization/simp_chinese/WJ_district_expansion_l_simp_chinese.yml
 wj_dd_petition_create_ai:0 "도독 설치 표청"
 wj_dd_petition_create_ai_desc:0 "표를 올려 천자에게 당신이 거느린 왕국을 중심으로 도독구를 설치해 달라고 청합니다."
 wj_dd_petition_create_player:0 "도독 설치 표청"
 wj_dd_petition_create_player_desc:0 "표를 올려 천자에게 당신이 거느린 왕국을 중심으로 도독구를 설치해 달라고 청하고, 수여받을 절을 스스로 청합니다."
 wj_dd_petition_expand_ai:0 "관할 확장 표주"
 wj_dd_petition_expand_ai_desc:0 "표를 올려 인접하고 아직 다른 구역에 속하지 않은 왕국을 당신의 도독구에 편입해 달라고 청합니다."
 wj_dd_petition_expand_player:0 "관할 확장 표주"
 wj_dd_petition_expand_player_desc:0 "표를 올려 인접하고 아직 다른 구역에 속하지 않은 왕국을 당신의 도독구에 편입해 달라고 청합니다."
 wj_dd_qinwang_interaction:0 "도독 근왕 조서"
 wj_dd_qinwang_interaction_desc:0 "이 도독에게 조서를 내려 휘하를 직접 이끌고 근왕하여, 천자가 주도하는 [wars|E]에 참여하게 합니다."

 # 来源：localization/simp_chinese/WJ_district_l_simp_chinese.yml
 wj_dd_create_interaction:0 "도독구 설치"
 wj_dd_create_interaction_desc:0 "이 사람이 거느린 왕국을 중심으로 도독구를 설치하고 모절을 수여합니다."
 wj_dd_dissolve_interaction:0 "도독구 폐지"
 wj_dd_dissolve_interaction_desc:0 "이 도독구를 폐지하고 도독의 모절을 회수합니다. 그의 본직과 봉토는 변하지 않습니다."
 wj_dd_manage_interaction:0 "도독구 조정"
 wj_dd_manage_interaction_desc:0 "이 구역과 접하고 아직 다른 구역에 속하지 않은 왕국 관원 한 명을 도독구에 편입합니다."

 # 来源：localization/simp_chinese/WJ_district_orders_l_simp_chinese.yml
 wj_dd_command_interaction:0 "도독 군령 반포"
 wj_dd_command_interaction_desc:0 "모절의 권한으로 이 구역의 관원들에게 군령을 반포합니다."
 wj_dd_justice_detain_interaction:0 "군법에 따라 구금"
 wj_dd_justice_detain_interaction_desc:0 "정위의 직권으로 군법을 범한 이 사람을 구금합니다."
 wj_dd_pardon_interaction:0 "군법 죄 특사"
 wj_dd_pardon_interaction_desc:0 "이 사람이 범한 군법의 죄를 사면합니다."
 wj_dd_request_aid_interaction:0 "도독 지원 요청"
 wj_dd_request_aid_interaction_desc:0 "이 구역의 도독에게 군사를 보내 도와 달라고 청하여, 당신이 주도하는 [war|E]에 참여하게 합니다."
 wj_dd_request_pardon_interaction:0 "군법 특사 요청"
 wj_dd_request_pardon_interaction_desc:0 "글을 올려 당신이 범한 군법의 죄를 사면해 달라고 청합니다. 천자에게 올린 청은 대개 정위에게 넘겨져 처리됩니다."

 # 来源：localization/simp_chinese/WJ_district_ui_l_simp_chinese.yml
 wj_dd_adjust_jie_interaction:0 "모절 갱수"
 wj_dd_adjust_jie_interaction_desc:0 "군정을 총괄하는 권한으로 이 도독이 지닐 절을 다시 정합니다."
 wj_dd_promote_interaction:0 "도독으로 승격"
 wj_dd_promote_interaction_desc:0 "이 무관에게 이 도독구를 맡기고 따로 모절을 수여합니다. 원래 도독은 모절을 내놓되 계속 구역 안에서 직을 맡습니다."
 wj_dd_withdraw_interaction:0 "도독구에서 탈퇴"
 wj_dd_withdraw_interaction_desc:0 "이 왕국을 도독구에서 제외합니다."

 # 来源：localization/simp_chinese/WJ_district_war_l_simp_chinese.yml
 wj_dd_deploy_aid_interaction:0 "관할 구역 원군 배치"
 wj_dd_deploy_aid_interaction_desc:0 "이 구역의 공작 또는 왕국급 무관 한 명을 보내, 이 사람이 주도하는 [war|E]에 참여하게 합니다."
 wj_dd_join_wars_01:0 "도독 직접 참전"
 wj_dd_join_wars_01_desc:0 "도독이 휘하를 직접 이끌고 이 사람이 주도하는 [war|E]에 참여합니다."

 # 来源：localization/simp_chinese/WJ_kaoke_central_l_simp_chinese.yml
 wj_kaoke_request_interaction:0 "고과 가점 요청"
 wj_kaoke_request_interaction_desc:0 "담당 장관에게 이번 고과에서 당신을 좋게 말해 달라고 청합니다."
 wj_kaoke_request_interaction_send:0 "인가 요청"

 # 来源：localization/simp_chinese/WJ_military_rank_l_simp_chinese.yml
 WJ_mr_propose:0 "군직 수여 입안"
 WJ_mr_propose_desc:0 "이 무관에게 줄 군직을 입안합니다. 천자, 도독중외, 왕국의 중장은 바로 수여할 수 있으나, 대장군이 입안한 것은 표를 올려 재가를 받아야 합니다. 이전에 올리지 않은 초안도 이어서 입안할 수 있습니다."
 WJ_mr_request:0 "군직 주청"
 WJ_mr_request_desc:0 "마음에 둔 군직을 골라 표를 갖추어 상관에게 재결을 청합니다. 이전에 올리지 않은 초안도 이어서 입안할 수 있습니다."
 WJ_mr_submit:0 "군직 주청 제출"
 WJ_mr_submit_desc:0 "[secondary_recipient.Custom('WJ_GetLinkedUIName')](을)를 위해 [secondary_recipient.Custom('WJMRChoice')](을)를 주청합니다. 원안대로 재정하거나 다른 직을 수여하십시오."

