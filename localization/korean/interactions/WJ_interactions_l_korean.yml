 # 来源：localization/simp_chinese/WJ_office_roads_loc_l_simp_chinese.yml
 wj_bizhao_interaction:0 "막부로 징벽"
 wj_bizhao_interaction_desc:0 "이 사람을 징벽하여 자신의 막부에 들이고 문생으로 삼습니다."
 wj_huangdi_zhaoshu_interaction:0 "조서 하달"
 wj_huangdi_zhaoshu_interaction_desc:0 "천자의 존엄으로 조서를 내려 이 사람을 처분합니다. 궁으로 부르거나, 발탁하거나 좌천하거나, 상을 주거나 징계할 수 있습니다."
 wj_maocai_interaction:0 "무재 천거"
 wj_maocai_interaction_desc:0 "올해 찰거 정원으로 이 사람을 무재로 천거하여 벼슬길에 나설 수 있게 합니다. 무재는 얻기 어려워 천거받은 이는 대개 기꺼이 응하지만, 요구가 지나치면 사양할 수도 있습니다."
 wj_maocai_interaction_reply_item_key:0 "[CHARACTER.Custom('WJ_GetLinkedUIName')](이)가 당신을 무재로 천거하고 당신의 답을 기다리고 있습니다"
 wj_maocai_interaction_send_name:0 "이 사람을 무재로 천거"
 wj_request_bizhao_interaction:0 "막부로 징벽"
 wj_request_bizhao_interaction_desc:0 "개부의 이름으로 어진 인재를 맞아들여 막부에서 일해 달라고 청합니다."
 wj_request_maocai_interaction:0 "무재 천거 요청"
 wj_request_maocai_interaction_desc:0 "상대에게 당신 자신이나 당신 문하의 남자 한 명을 무재로 천거해 달라고 청하여, 벼슬길에 나설 수 있게 합니다."
 wj_request_maocai_interaction_reply_item_key:0 "[CHARACTER.Custom('WJ_GetLinkedUIName')](이)가 당신에게 한 사람을 무재로 천거해 달라고 청합니다"
 wj_request_maocai_interaction_send_name:0 "무재 천거 청원"
 wj_request_xiaolian_interaction:0 "효렴 천거 요청"
 wj_request_xiaolian_interaction_reply_item_key:0 "[CHARACTER.Custom('WJ_GetLinkedUIName')](이)가 당신에게 한 사람을 효렴으로 천거해 달라고 청합니다"
 wj_request_xiaolian_interaction_send_name:0 "효렴 천거 청원"
 wj_xiaolian_interaction:0 "효렴 천거"
 wj_xiaolian_interaction_reply_item_key:0 "[CHARACTER.Custom('WJ_GetLinkedUIName')](이)가 당신을 효렴으로 천거하고 당신의 답을 기다리고 있습니다"
