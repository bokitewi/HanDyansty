l_korean:
 # 天朝循环·时代特色：恢复期（中兴再造）套件

 # ---------- 轻徭薄赋 ----------
 hd_dc_rec_light_taxes_decision: "경요박부"
 hd_dc_rec_light_taxes_decision_desc: "난리를 겪은 뒤 호구는 줄어들고 들판은 황폐해졌다. 문경지치를 본받아 형벌을 줄이고 세금을 가볍게 하여 백성을 쉬게 하면, 천하의 원기가 회복될 것이다."
 hd_dc_rec_light_taxes_decision_tooltip: "천하의 조세를 줄이라는 조서를 내려 백성을 쉬게 합니다."
 hd_dc_rec_light_taxes_decision_confirm: "천하의 조세 감면을 명함"
 hd_dc_rec_light_taxes_active_tt: "경요박부의 조서가 시행 중임"
 hd_dc_rec_light_taxes_county_tt: "천자의 나라에 속한 모든 [county|E]"

 hd_dc_rec_cancel_light_taxes_decision: "경요박부 중지"
 hd_dc_rec_cancel_light_taxes_decision_desc: "나라의 재용이 부족하고 부고가 텅 비었다. 조세 감면의 조서를 앞당겨 폐지하고 예전의 세액을 되살린다. 그러나 백성은 반드시 조정이 신의를 저버렸다 여기고 이를 가혹한 정치로 볼 것이다."
 hd_dc_rec_cancel_light_taxes_decision_tooltip: "감세의 조서를 앞당겨 폐지하고 예전 세액을 다시 징수합니다."
 hd_dc_rec_cancel_light_taxes_decision_confirm: "예전 세액 복구"
 hd_dc_rec_cancel_light_taxes_county_tt: "아직 감세 중인 모든 [county|E]"

 hd_dc_rec_light_taxes_modifier: "경요박부"
 hd_dc_rec_light_taxes_modifier_desc: "조정이 천하의 조세를 감면하여 백성을 쉬게 하고 있다."
 hd_dc_rec_light_taxes_county_modifier: "경요박부"
 hd_dc_rec_light_taxes_county_modifier_desc: "조정이 조세를 감면하여 백성이 휴양하며 생업을 되찾고 있다."

 # ---------- 招抚流民 ----------
 hd_dc_rec_resettle_refugees_decision: "유민 초무"
 hd_dc_rec_resettle_refugees_decision_desc: "전란이 지나간 뒤 유민이 길을 메웠다. 한 주의 땅을 골라 관부에서 밭과 종자를 나누어 주고 밭갈이 소를 빌려주어, 떠돌던 이들을 고향으로 불러들여 생업을 되찾게 하고 황무지를 다시 옥토로 만든다."
 hd_dc_rec_resettle_refugees_decision_tooltip: "주 하나를 골라 유민을 고향으로 불러들여 생업을 되찾게 합니다."
 hd_dc_rec_resettle_refugees_decision_confirm: "유민을 불러들임"
 hd_dc_rec_resettle_refugees_pick_tt: "적어도 한 현이 천자의 나라에 속한 주를 선택해야 함"
 hd_dc_rec_resettle_refugees_county_tt: "해당 주에서 천자의 나라에 속한 모든 [county|E]"
 hd_dc_rec_resettle_refugees_county_modifier: "유민 초무"
 hd_dc_rec_resettle_refugees_county_modifier_desc: "유민이 생업으로 돌아오고 황무지가 다시 개간되어 호구가 점차 늘고 있다."

 # ---------- 大赦天下 ----------
 hd_dc_rec_grand_amnesty_decision: "대사천하"
 hd_dc_rec_grand_amnesty_decision_desc: "중흥의 때를 맞아 천하와 더불어 새로 시작한다. 대사면의 조서를 반포하여 갇힌 자들을 너그러이 풀어 주고, 천자의 인덕을 보여 민심을 수습한다."
 hd_dc_rec_grand_amnesty_decision_tooltip: "죄수들을 크게 사면하여 너그러움으로 민심을 수습합니다."
 hd_dc_rec_grand_amnesty_decision_confirm: "대사면 조서 반포"
 hd_dc_rec_grand_amnesty_no_prisoner_tt: "천자 또는 그 봉신이 적어도 한 명의 죄수를 가두고 있음"
 hd_dc_rec_grand_amnesty_decision_effect_tt: "조정에서 대사면의 범위를 논의합니다. 조정이 가둔 죄수만 사면하거나, 제후와 군국의 옥에 갇힌 죄수까지 함께 풀어 줄 수 있습니다."

 hd_dc_rec.0001.t: "대사천하"
 hd_dc_rec.0001.desc: "조서는 이미 작성되어 옥새를 찍기만 기다리고 있다. 상서령이 아뢰었다. “대사면의 은혜를 조정이 가둔 죄수에게만 미치게 하시겠습니까, 아니면 제후와 군국의 옥에 갇힌 죄수까지 함께 너그러이 풀어 주시겠습니까? 온 천하를 함께 사면하면 은택이야 더 넓겠으나, 제후들이 조정이 제 분수를 넘어 남의 일에 손을 댄다 여겨 원망을 품을까 두렵습니다.”"
 hd_dc_rec.0001.a: "조정의 죄수만 사면한다"
 hd_dc_rec.0001.b: "온 천하를 사면하고, 제후의 죄수까지 함께 풀어 준다"
 hd_dc_rec.0001.c: "옥이 이미 비었으니 명을 거둔다"

 hd_dc_rec_amnesty_opinion: "대사천하"
 hd_dc_rec_prisoners_released_opinion: "내 죄수를 강제로 풀어 줌"

 # ---------- 求贤诏 ----------
 hd_dc_rec_seek_talent_decision: "구현조"
 hd_dc_rec_seek_talent_decision_desc: "나라의 중흥은 무엇보다 인재를 얻는 데 있다. 주군에 조서를 내려 현량방정과 명경무재를 천거하게 하고, 한 가지 재주라도 있는 자는 누구든 궁궐에 나아와 스스로를 천거할 수 있게 한다."
 hd_dc_rec_seek_talent_decision_tooltip: "인재를 구하는 조서를 내려 사방의 뛰어난 인재를 조정으로 불러들입니다."
 hd_dc_rec_seek_talent_decision_confirm: "현량 천거를 명함"
 hd_dc_rec_seek_talent_decision_effect_tt: "사방의 선비들이 조서를 듣고 찾아와, #EMP 한 명에서 세 명 정도#!가 부름에 응해 조정에 들어올 수 있으며, 저마다 남다른 장점을 지니고 있습니다."

 hd_dc_rec.0002.t: "사방의 현사"
 hd_dc_rec.0002.desc_1: "인재를 구하는 조서가 주군에 내려간 지 몇 달 만에, 한 인재가 부름에 응하여 찾아와 궁궐에 나아가 글을 올리고 스스로 배운 바를 아뢰었다."
 hd_dc_rec.0002.desc_2: "인재를 구하는 조서가 주군에 내려간 지 몇 달 만에, 두 인재가 함께 도성에 들어와 궁궐에 나아가 글을 올리고 각자의 장점을 아뢰었다."
 hd_dc_rec.0002.desc_3: "인재를 구하는 조서가 주군에 내려간 지 몇 달 만에 사방의 선비들이 소문을 듣고 몰려들어, 무려 세 사람이 같은 날 궁궐에 나아와 한자리에 모였다."
 hd_dc_rec.0002.a: "나라가 인재를 얻었으니 사직의 복이로다"
 hd_dc_rec_talent_summoned_opinion: "부름에 응해 조정에 들어옴"
