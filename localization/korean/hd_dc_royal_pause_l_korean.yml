l_korean:
 hd_dc_support.0008.d: "그대는 예전에 내게 약속 하나를 빚졌으니, 1년간 군사를 거두는 것으로 갚아 주시오."
 hd_dc_support.0008.d.tt: "[hd_dc_support_claimant.GetTitledFirstName]의 파는 1년 동안 군사를 움직이지 않아야 합니다. 최후통첩을 보내지도, 군사를 일으켜 맞서지도 않습니다."
 hd_dc_support.0308.t: "병간을 잠시 거두다"
 hd_dc_support.0308.desc: "오가는 서신 옆에 1년이라는 기한이 덧붙었다. [hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName](이)가 [hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName](이)가 예전에 진 인정의 빚을 꺼내어 이 1년간의 정병을 얻어 냈으니, 군사를 일으키려던 문서는 잠시 묻혀 두게 되었다.\n\n파의 사람들은 흩어지지 않았고, 마음속의 불평도 여전히 남아 있다. 1년 뒤 이 일은 다시 거론되겠지만, 당장은 이 파가 그 때문에 칼을 들지는 않을 것이다."
 hd_dc_support.0308.a: "1년을 기한으로 삼겠소. 삼가 명심하리다."
 hd_dc_support.paused_demand: "군사를 늦추기로 한 약조가 있으니, 이 문서는 잠시 묻어 두고 내보내지 않는다."
