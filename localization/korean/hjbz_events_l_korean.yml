l_korean:
 # ══════════════════════════════════════════════════════════════════
 # 汉晋春秋 · 兵戈志 —— 禁军事件与修正 本地化（hjbz_）
 #
 # 内容：事件 4×3（题/述/选项）＋ 修正 4×2（名/述）＋ 旅行选项 1×2
 # 文风：参《后汉书》
 # ══════════════════════════════════════════════════════════════════

 # ────────────────── 事件一 · 重建羽林军 ──────────────────

 hjbz_guard.0001.t:0 "우림군 재건"
 hjbz_guard.0001.desc:0 "우림의 제도가 다시 세워지자, 양가의 자제 가운데 재주와 힘이 남다른 자를 뽑아 채웠다. 이날 궁문 밖에 갑병을 늘어세우니, 깃발이 잇닿고 북과 방울 소리가 울렸다.\n\n주장이 여러 교위를 이끌고 북쪽을 향해 두 번 절하자, 교위 이하 모두가 칼을 풀고 머리를 조아려 목숨을 바쳐 궁궐을 지키겠노라 맹세했다. 담당 관리가 책문을 읽고 군호를 내리니 그 소리가 궐문까지 닿았다. 황제가 친히 나와 이를 살피며, 대오가 가지런하고 갑옷과 병장기가 선명한 것을 보고 좌우를 돌아보며 말했다. 「이들이 바로 짐의 날개로다.」"
 hjbz_guard.0001.a:0 "이런 군대가 있으니, 짐이 편히 잠들 수 있겠구나."

 # ────────────────── 事件二 · 重建执金吾 ──────────────────

 hjbz_guard.0002.t:0 "집금오 재건"
 hjbz_guard.0002.desc:0 "집금오가 다시 세워지자, 낡은 것을 없애고 새것으로 바꾸었다. 처음에는 관사가 무너지고 병졸들이 흩어져, 거리에서는 도적이 대낮에도 활개를 쳤고, 길 가는 이들은 서로 경계하며 밤에 감히 나다니지 못했다.\n\n이제 제기가 순찰하고 창을 든 병사들이 길가에 늘어서며, 한 달에 세 번 궁궐을 돌았다. 밤에 불이 나면 즉시 달려와 지체하는 일이 없었다. 몇 달이 지나자 백성들은 비로소 밤길을 다니게 되었다. 담당 관리가 아뢰었다. 「도성 안에 경고의 북이 울리지 않습니다.」"
 hjbz_guard.0002.a:0 "천자의 수레 아래라면 마땅히 이러해야지."

 # ────────────────── 事件三 · 瘫痪的羽林军 ──────────────────

 hjbz_guard.0003.t:0 "마비된 우림군"
 hjbz_guard.0003.desc:0 "황제가 권병을 잃으니, 조령이 궁궐 밖으로 나가지 못한다. 우림의 여러 영은 혹은 다른 이의 격문을 받고, 혹은 보루를 닫고 스스로를 지킬 뿐 더 이상 명에 응하지 않는다.\n\n숙위하던 신하들은 서로 이끌어 떠나가고, 갑옷과 병장기는 회랑에 버려졌다. 지난날 북쪽을 향해 죽음을 맹세하던 자들은 이제 모두 사방으로 흩어졌다. 전문 밖에는 늙은 병졸 몇이 창을 들고 서 있을 뿐인데, 황제를 보고는 눈물을 흘린다."
 hjbz_guard.0003.a:0 "날개가 이미 꺾였으니, 짐은 무엇에 기대리오?"

 # ────────────────── 事件四 · 崩溃的执金吾 ──────────────────

 hjbz_guard.0004.t:0 "무너진 집금오"
 hjbz_guard.0004.desc:0 "집금오의 직책이 폐지되자, 제기와 창을 든 무리는 통솔할 이가 없어졌다. 약삭빠른 자는 권문세가에 몸을 의탁해 그 앞잡이가 되어 동료들을 업신여기고, 어수룩한 자는 거리를 떠돌다 도적과 어울려 도리어 백성에게 해를 끼친다.\n\n궁 밖의 경계를 맡는 이가 다시는 없고, 불이 나도 끄러 오는 자가 없다. 예전에 세운 관사는 이제 노름꾼과 술꾼이 모여드는 곳이 되었다. 식견 있는 이들은 그곳을 지날 때마다 탄식하지 않은 적이 없다."
 hjbz_guard.0004.a:0 "궁 밖의 일이 끝내 이 지경에 이르렀구나."

 # ────────────────── 角色修正 ──────────────────

 hjbz_yulin_rebuilder_modifier:0 "우림군 재건자"
 hjbz_yulin_rebuilder_modifier_desc:0 "이 사람은 우림의 옛 제도를 되살려 양가의 자제를 뽑아 숙위를 채웠으니, 이로써 궁궐의 방비가 한층 엄밀해졌다. 군중에서 그 이름을 듣는 자들은 대부분 그를 위해 쓰이기를 원하고, 간사한 자가 음모를 꾸미려 해도 먼저 제 힘을 헤아려 보게 된다."

 hjbz_yulin_guard_modifier:0 "우림군"
 hjbz_yulin_guard_modifier_desc:0 "우림의 군대가 늘 곁을 지킨다. 갑옷과 병장기가 갖추어지고 숙위할 사람이 있으니, 오가는 사이에 적이 틈을 엿볼 길이 없다."

 # ────────────────── 伯爵领修正 ──────────────────

 hjbz_zhijinwu_renewed_modifier:0 "면모를 일신한 집금오"
 hjbz_zhijinwu_renewed_modifier_desc:0 "집금오가 다시 세워져 제기가 순찰하고 창을 든 병사들이 길가에 늘어서며 한 달에 세 번 궁궐을 돈다. 경고의 북이 울리지 않으니 길 가는 이가 밤에 나다녀도 걱정이 없고, 저잣거리도 차츰 옛 모습을 되찾는다."

 hjbz_zhijinwu_collapsed_modifier:0 "무너진 집금오"
 hjbz_zhijinwu_collapsed_modifier_desc:0 "집금오가 폐지되어 그 직책을 맡는 이가 없다. 제기와 창을 든 무리는 사방으로 흩어져, 약삭빠른 자는 권문세가의 앞잡이가 되고 어수룩한 자는 도적과 어울리니, 골목에서는 대낮에도 노략질을 피하지 못한다."

 # ────────────────── 旅行选项 ──────────────────

 hjbz_yulin_escort_travel_option:0 "우림군 호위"
 hjbz_yulin_escort_travel_option_desc:0 "우림의 무사를 뽑아 수행하게 한다. 이들은 모두 오랫동안 숙위를 맡아 경계에 익숙하여, 지나는 곳마다 먼저 허실을 살핀다. 도중에 간사한 자가 있더라도 그 재주를 부릴 데가 없다."
