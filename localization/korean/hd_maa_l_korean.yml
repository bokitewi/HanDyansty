l_korean:
 hd_youzhou_tuqi:0 "유주 돌기"
 hd_youzhou_tuqi_flavor:0 "#F 유주는 변새에 가까워 백성이 말안장 위에서 나고 자라니, 날래고 용맹하여 돌격에 능하다. 광무제가 지난날 어양과 상곡의 돌기를 일으켜 하북을 평정한 뒤로, 천하에서 정예 기병을 논할 때면 반드시 유주를 먼저 꼽았다.#!"
 hd_maa_source.0001.t:0 "유주 기병 모집 중단"
 hd_maa_source.0001.desc:0 "유주에서 전해 온 소식에 당신은 한참 동안 말이 없었다. 그곳의 군현은 이제 당신의 손을 벗어났거나, 난리 뒤라 인심이 안정되지 않아, 기병을 모으러 보낸 사자가 마을마다 돌아다녀도 응하는 이가 드물었다.\n\n이미 군에 편입된 돌기는 여전히 당신의 깃발 아래에서 명을 듣지만, 앞으로 더 모으려 해도 당분간은 징발할 곳이 없다. 변새의 좋은 말과 기수는 여전히 그곳에 있으나, 이제는 당신을 위해 쓰이지 않는다."
 hd_maa_source.0001.a:0 "잠시 지금 있는 기병에 의지한다."
 hd_maa_source.0002.t:0 "유주에서 다시 기병 모집 가능"
 hd_maa_source.0002.desc:0 "유주의 여러 현이 다시 안정을 되찾고, 군의 호걸들도 당신의 징소에 응하려 한다. 소식이 전해지자 막하의 늙은 기병 몇이 서로 돌아보며 웃으며, 고향의 자제들이 다시 군에 들어올 수 있게 되었다고 했다.\n\n새 기병이 스스로 진영 앞까지 달려오지는 않으니, 모집과 증편에는 따로 재물과 군량을 내려야 한다. 하지만 당신이 이 돈을 아끼지 않는다면, 유주의 돌기는 다시 끊임없이 몰려올 것이다."
 hd_maa_source.0002.a:0 "유연의 돌기가 다시 나의 쓰임이 되리라."
 hd_baima_yicong:0 "백마의종"
 hd_baima_yicong_flavor:0 "#F 우북평은 변새 아래에 자리하여, 군에서 활을 잘 쏘는 이들이 의종을 맺으니, 저마다 백마를 타고 활을 끼고 내달렸다. 백마가 떼 지어 돌진할 때면 변새 밖의 여러 오랑캐가 멀리서 바라보고는 함부로 침범할 수 없음을 알았다.#!"
 hd_gongsun_baima_event_army:0 "공손찬의 백마의종"
 hd_maa_source.0003.t:0 "백마는 다시 북쪽에서 오지 않는다"
 hd_maa_source.0003.desc:0 "우북평의 사자가 섬돌 아래 무릎을 꿇고, 군에 더 이상 모병에 응하는 이가 없다고 아뢰었다. 그 변군은 이제 당신의 다스림 아래에 있지 않거나, 병란 뒤에 인심이 흩어져, 활 잘 쏘는 자제들은 난을 피해 멀리 떠나거나 다른 주인에게 몸을 의탁했다.\n\n진영의 백마의종은 여전히 당신의 호령을 따르고, 깃발 위의 백마도 아직 선명하다. 다만 새 기병을 더하려면 우북평이 다시 당신의 손에 돌아오기를 기다려야 한다."
 hd_maa_source.0003.a:0 "백마의 이름은 잠시 옛 부하들이 지키게 하라."
 hd_maa_source.0004.t:0 "백마가 다시 모이다"
 hd_maa_source.0004.desc:0 "우북평이 다시 안정을 되찾자, 군의 활 잘 쏘는 이들이 또 하나둘 찾아와 몸을 바쳤다. 듣자니 어떤 이는 자기 집 백마를 끌고 와 진영 문밖에서 꼬박 하루를 기다렸다고 한다.\n\n그들을 의종으로 편성하려면 여전히 안장과 말, 갑옷과 병기, 군량과 급료를 따로 마련해야 한다. 그러나 이 백마 기병대는 마침내 늙은 병졸들만으로 이름을 지탱하지 않아도 되게 되었다."
 hd_maa_source.0004.a:0 "다시 의종을 모집할 수 있다."
 hd_wuhuan_qicong:0 "오환 기종"
 hd_wuhuan_qicong_flavor:0 "#F 오환 사람들은 물과 풀을 따라 옮겨 살며, 사내들은 어려서부터 말을 잘 타고 활을 잘 쏜다. 한나라는 종종 그 부중을 기종으로 모집하여 군을 따라 사방을 정벌하게 했는데, 오고 감이 날래어 기습과 패주하는 적의 추격에 가장 뛰어났다.#!"
 hd_maa_source.0005.t:0 "오환 여러 부족의 이산"
 hd_maa_source.0005.desc:0 "북쪽 변경의 오환 부족들이 더 이상 당신의 징발에 응하지 않는다. 상곡, 어양에서 요동에 이르는 일대는 이미 당신의 손을 벗어났거나, 여러 부족이 마음이 떠나, 당신이 보낸 사자가 가지고 돌아온 것은 핑계뿐이었다.\n\n이미 당신을 따라 싸워 온 오환 기종은 여전히 군중에 있으며, 말 타고 활 쏘는 솜씨도 그대로다. 그러나 이런 기수들은 어려서부터 말 등에서 자란 자들이라, 보병 진영의 깃발 하나 바꾼다고 한 명도 만들어 낼 수 없다."
 hd_maa_source.0005.a:0 "증원 모집을 잠시 늦추고 그들이 돌아오기를 기다린다."
 hd_maa_source.0006.t:0 "오환이 다시 귀부하다"
 hd_maa_source.0006.desc:0 "오환 여러 부족의 대인이 사자를 보내 와, 다시 당신을 위해 기종을 내겠다는 뜻을 밝혔다. 사자의 말은 거침이 없었다. 군량과 급료만 넉넉히 준다면 부족의 자제들은 언제든 말에 오를 수 있다는 것이다.\n\n기종은 아직 진영에 이르지 않았고, 모집과 증편에는 여전히 따로 재물과 군량을 내려야 한다. 그러나 북쪽의 이 기병 공급로는 이미 다시 열렸다."
 hd_maa_source.0006.a:0 "오환의 기병을 다시 징발할 수 있다."
 hd_jizhou_qiangnu:0 "기주 강노"
 hd_jizhou_qiangnu_flavor:0 "#F 기주의 재관은 궐장에 익숙하여, 쓰는 것은 모두 발로 밟아 당겨야 하는 강노이다. 노수들이 여러 줄로 나뉘어 번갈아 쏘면 화살이 메뚜기 떼처럼 날아, 갑옷을 걸치고 진으로 돌격하는 자라도 가까이 다가가기 어렵다.#!"
 hd_maa_source.0007.t:0 "기주 노수 모집난"
 hd_maa_source.0007.desc:0 "기주 여러 군에 보낸 모병 문서가 그대로 되돌아왔다. 그 일대는 이미 당신의 다스림 아래에 있지 않거나, 병란 뒤에 호구가 흩어져, 궐장으로 노를 당길 줄 아는 장정을 당장은 몇 명도 찾을 수 없다.\n\n노기는 장인을 시켜 만들 수 있지만, 노를 쏠 사람은 허공에서 더할 수 없다. 이미 군을 이룬 기주 노수는 여전히 부릴 수 있으니, 앞으로 진을 칠 때는 손에 있는 이 인원만으로 셈할 수밖에 없다."
 hd_maa_source.0007.a:0 "지금 있는 노수에 맞추어 진을 친다."
 hd_maa_source.0008.t:0 "기주 노수가 다시 모이다"
 hd_maa_source.0008.desc:0 "기주 여러 군이 점차 옛 모습을 되찾자, 군리가 보고하기를 마을에서 노를 익힌 재관들이 다시 모병에 응하려 한다고 했다. 당신은 예전에 사람이 모자라 접어 두었던 진도 몇 폭을 떠올렸다.\n\n노기, 화살통, 군량과 급료는 모두 따로 돈을 들여 마련해야 하며, 새 노수가 스스로 진 앞에 늘어서지는 않는다. 그러나 이번에는 적어도 “기계는 있는데 사람이 없다”는 말을 다시 듣지 않아도 된다."
 hd_maa_source.0008.a:0 "다시 노수를 모집할 수 있다."
 hd_xiandeng_ruishi:0 "선등예사"
 hd_xiandeng_ruishi_flavor:0 "#F 성을 공격하고 진을 함락할 때는 반드시 선등이 있어야 한다. 기주의 예사들은 단단한 갑옷을 입고 방패를 들고서, 화살과 돌을 무릅쓰고 앞다투어 성벽에 오르고 적진에 뛰어들어, 맨 먼저 오른 공으로 봉상을 얻는다.#!"
 hd_maa_source.0009.t:0 "선등할 사람이 없다"
 hd_maa_source.0009.desc:0 "기주에서 전해 온 소식에 따르면, 선등예사는 이미 가려 뽑을 수 없게 되었다. 청하와 거록 일대는 이미 주인이 바뀌었거나 인심이 안정되지 않아, 화살과 돌을 무릅쓰고 앞다투어 성벽에 오르려는 결사대를 더는 모을 수 없다.\n\n진영에 있는 예사들은 여전히 당신의 명을 따른다. 다만 앞으로 성을 공격하고 진을 함락할 때 선봉에 설 사람은 지금 있는 몇 개 영에서만 고를 수밖에 없다."
 hd_maa_source.0009.a:0 "선등의 병사는 당분간 더 모집하지 않는다."
 hd_maa_source.0010.t:0 "선등 재모집"
 hd_maa_source.0010.desc:0 "기주 여러 군이 다시 안정을 되찾자, 가난하고 천한 처지를 달가워하지 않고 전공으로 출세하려는 마을의 젊은이들이 다시 당신의 모병 방문을 수소문하기 시작했다.\n\n갑옷과 병기, 상금은 여전히 따로 마련해야 하고, 새 영도 하루아침에 이루어지지 않는다. 그러나 다음에 누가 선등할지 물을 때, 지금 있는 몇 개 영의 사람들만 바라보며 근심하지 않아도 된다."
 hd_maa_source.0010.a:0 "다시 용감한 병사를 가려 뽑는다."
 hd_qingzhou_bing:0 "청주병"
 hd_qingzhou_bing_flavor:0 "#F 청주는 바다에 면해 있고 민풍이 사나워, 난세를 만날 때마다 무리를 모아 스스로를 지켰다. 그 무리는 싸움에 용감하나 단속하기 어려운데, 일단 호령이 엄정하고 편제가 제대로 되면 볼만한 보병이 된다.#!"
 hd_maa_source.0011.t:0 "청주 병력 공급원 고갈"
 hd_maa_source.0011.desc:0 "청주의 모병 사자가 빈손으로 돌아왔다. 제국과 북해 일대는 이미 당신의 손을 벗어났거나, 병란 뒤에 유민이 사방으로 흩어져, 다시 진영에 편입하려던 그 장정들은 찾을 길이 없다.\n\n이미 군을 이룬 청주병은 여전히 당신의 호령을 따른다. 그러나 군적에 숫자를 하나 더 적는다고 진영에 사람이 하나 더 서는 것은 아니니, 앞으로 군사를 쓸 때는 지금 있는 병마에 맞추어 계획할 수밖에 없다."
 hd_maa_source.0011.a:0 "군액은 실제대로 하고, 수를 부풀리지 말라."
 hd_maa_source.0012.t:0 "청주에서 다시 징병 가능"
 hd_maa_source.0012.desc:0 "청주 여러 군이 다시 안정을 되찾고, 흩어졌던 백성들이 하나둘 고향으로 돌아오니, 군리가 다시 징집할 장정이 있다고 보고했다. 그곳 사람들은 사납고 싸움을 좋아하니, 호령만 엄정하면 좋은 병사가 된다.\n\n새 병사는 여전히 재물과 군량으로 불러들이고 갑옷과 병기를 갖춰 주어야 하며, 스스로 진영에 걸어 들어오지는 않는다. 그러나 청주의 이 병력 공급원이 마침내 다시 열렸다."
 hd_maa_source.0012.a:0 "청주의 무리를 다시 징발할 수 있다."
 hd_liujun_liangjiazi:0 "육군양가자"
 hd_liujun_liangjiazi_flavor:0 "#F 농서, 천수, 안정, 북지, 상군, 서하의 여섯 군은 융적과 가까워, 백성의 풍속이 전쟁 준비를 익히고 기력을 숭상하며 말 타고 활 쏘는 것을 으뜸으로 여긴다. 한나라의 우림과 기문은 대부분 이곳에서 뽑았고, 명장도 많이 이곳에서 나왔다.#!"
 hd_maa_source.0013.t:0 "여섯 군의 자제가 오지 않는다"
 hd_maa_source.0013.desc:0 "농서와 북지 여러 군에서 소식이 전해졌는데, 양가의 자제들이 더 이상 당신의 징소에 응하지 않는다고 한다. 그 일대는 이미 주인이 바뀌었거나, 강족의 난이 아직 그치지 않아 마을이 쇠잔해져, 말 타고 활 쏘는 데 뛰어난 소년들은 대부분 다른 길을 찾아 떠났다.\n\n진영에 있는 여섯 군의 기사들은 여전히 명을 따르지만, 더 증편하려 해도 당장은 손쓸 방도가 없다. 말 잘 타는 병사는 한마디 부른다고 생기는 것이 아니라는 옛말이, 오늘 당신 자신에게 떨어졌다."
 hd_maa_source.0013.a:0 "기병 진은 잠시 예전의 정원대로 한다."
 hd_maa_source.0014.t:0 "여섯 군의 자제가 다시 오다"
 hd_maa_source.0014.desc:0 "여섯 군이 다시 안정을 되찾자, 마을의 양가자들이 또다시 활을 메고 말을 끌고 진영 앞으로 모병에 응하러 왔다. 어떤 이는 조상이 일찍이 우림에 들었다며 말투에 자부심이 가득했다.\n\n그들을 기병 진으로 편성하려면 여전히 말과 군량, 급료를 따로 마련해야 한다. 그러나 앞으로 군비 확장을 다시 논할 때, 여섯 군은 다시 믿을 만한 공급로가 되었다."
 hd_maa_source.0014.a:0 "여섯 군의 궁마가 다시 나의 군적에 들어온다."
 hd_huangzhong_yicong:0 "황중의종"
 hd_huangzhong_yicong_flavor:0 "#F 황중의 월지 호인들은 한나라에 의탁하여 의종이라 불렸다. 그들은 하황의 산천을 잘 알고 말 타고 활 쏘는 데 능숙하여, 늘 한군을 따라 여러 강족을 토벌했으니, 흩어지면 적을 정찰하고 모이면 진을 함락할 수 있었다.#!"
 hd_maa_source.0015.t:0 "황중의종의 이산"
 hd_maa_source.0015.desc:0 "금성과 황중 일대의 의종 호인들이 더 이상 당신의 징소에 응하지 않는다. 그곳은 이미 당신의 손을 벗어났거나, 여러 부족이 마음이 떠나, 당신이 보낸 사자는 부족 대인의 얼굴조차 보지 못했다.\n\n이미 군을 따르는 의종은 여전히 당신 휘하에 있으며, 변경의 길을 잘 알고 말 타고 활 쏘는 솜씨도 그대로다. 다만 지도 위에서 누군가 정찰하러 가기를 기다리는 길이 당신이 원래 예상했던 것보다 몇 갈래나 더 많아졌다."
 hd_maa_source.0015.a:0 "잠시 지금 있는 의종을 쓴다."
 hd_maa_source.0016.t:0 "황중이 다시 의종을 보내다"
 hd_maa_source.0016.desc:0 "황중의 여러 부족이 다시 귀부하여, 부족 대인이 자제들을 보내 당신을 위해 기종을 내겠다고 했다. 이들은 하황의 골짜기를 하나하나 다 알고 있어, 강족의 행방을 말할 때면 척후보다도 더 훤하다.\n\n그들을 불러 모으려면 여전히 재물과 군량이 들고, 새 기병도 편성하고 훈련해야 군을 이룰 수 있다. 그러나 변경의 길에 사람이 모자라던 날들은 마침내 끝낼 수 있게 되었다."
 hd_maa_source.0016.a:0 "황중의종을 다시 불러 모을 수 있다."
 hd_bandun_congbing:0 "판순종병"
 hd_bandun_congbing_flavor:0 "#F 파군의 판순만은 나무판으로 방패를 만들며, 천성이 굳세고 용맹하여 진 앞에서 노래하고 춤추기를 좋아한다. 고조가 지난날 이들을 써서 삼진을 다시 평정했고, 한대에 강족이 여러 차례 한천을 침범했을 때도 대부분 이들의 병력에 힘입어 물리쳤으니, 신병이라 불렸다.#!"
 hd_maa_source.0017.t:0 "파군의 종인이 응하지 않다"
 hd_maa_source.0017.desc:0 "파군의 모병 사자가 돌아왔으나, 뒤에는 종인을 한 명도 데려오지 못했다. 그 일대는 이미 주인이 바뀌었거나, 여러 부족이 마음이 떠나, 판순 여러 성씨의 수령들이 모두 부족에 내보낼 사람이 없다고 둘러댔다.\n\n진영에 있는 판순종병은 여전히 당신의 명을 따른다. 다만 앞으로 험한 산길에서의 임무는 손에 있는 이 몇 개 영의 사람들에게만 맡길 수밖에 없다."
 hd_maa_source.0017.a:0 "잠시 지금 있는 판순의 병사를 쓴다."
 hd_maa_source.0018.t:0 "종인이 다시 나서다"
 hd_maa_source.0018.desc:0 "파군이 다시 안정을 되찾자, 판순 여러 성씨의 수령들이 일족의 자제들을 데리고 와서, 진영 앞에서 북을 치며 노래하고 다시 당신을 위해 병사를 내겠다고 했다.\n\n방패와 병기, 군량과 급료는 여전히 따로 마련해야 한다. 그러나 그 좁은 길과 험한 요새를 다시 당신 대신 지킬 사람이 생겼다."
 hd_maa_source.0018.a:0 "파군 종인의 굳센 용맹, 다시 사람을 더할 수 있다."
 hd_wudang_feijun:0 "무당비군"
 hd_wudang_feijun_flavor:0 "#F 남중은 산이 깊고 숲이 빽빽한데, 여러 부족의 굳센 병사들은 평지를 걷듯 산을 넘고 고개를 넘으며, 궁노와 단병을 함께 익혀 맞서는 자가 없으니, 그래서 비군이라 불렸다. 대군이 펼쳐지기 어려운 험한 땅이야말로 그들이 싸우는 곳이다.#!"
 hd_maa_source.0019.t:0 "남중의 굳센 병사 징발난"
 hd_maa_source.0019.desc:0 "남중의 소식이 전해졌다. 건녕과 장가 일대는 이미 당신의 손을 벗어났거나, 여러 부족이 배반과 복종을 거듭하여, 험한 산길에 익숙한 그 굳센 병사들을 더는 징발할 수 없다.\n\n지금 있는 무당비군은 여전히 당신의 호령을 따른다. 다만 산길은 사람을 기다려 주지 않고, 군중에 모자란 인원도 비군의 명성으로 채울 수는 없다."
 hd_maa_source.0019.a:0 "산지에서 군사를 쓸 때는 먼저 지금 있는 병력을 헤아린다."
 hd_maa_source.0020.t:0 "남중의 굳센 병사가 다시 오다"
 hd_maa_source.0020.desc:0 "남중 여러 군이 다시 안정을 되찾자, 각 부족이 다시 굳센 병사를 내어 당신의 징소에 응하려 한다. 사자의 말로는 이들은 평지를 걷듯 산을 넘고 고개를 넘으며, 궁노와 단병을 모두 다룰 줄 안다고 한다.\n\n그들을 모집하려면 여전히 재물과 군량이 들고, 편성하고 훈련하여 군을 이루는 데에도 시간이 걸린다. 그러나 다음에 험지에서 군사를 쓸 일이 생기면, 지금 있는 여러 영에서만 사람을 빼내지 않아도 된다."
 hd_maa_source.0020.a:0 "비군을 다시 징집할 수 있다."
 hd_wuxi_manbing:0 "오계만병"
 hd_wuxi_manbing_flavor:0 "#F 무릉 오계 사이에는 만인들이 산과 물에 기대어 사는데, 숲속에서 몰래 움직이고 시냇가에 매복하는 데 익숙하다. 복파장군 마원이 남정하여 이곳에 이르렀다가 장독에 시달려 끝내 돌아가지 못했다.#!"
 hd_maa_source.0021.t:0 "오계 만족이 귀부하지 않다"
 hd_maa_source.0021.desc:0 "무릉 오계의 만인들이 더 이상 당신의 징발에 응하지 않는다. 그 일대는 이미 주인이 바뀌었거나, 만족들이 마음이 떠나, 당신이 보낸 사자는 시냇가에서 보름을 기다렸으나 핑계 몇 마디만 듣고 왔다.\n\n진영에 있는 오계의 군사들은 여전히 명을 따른다. 그러나 지도 위의 그 구불구불한 물길 몇 갈래는 원래 모두 같은 새 병사들을 기다리고 있었으니, 이제는 따로 안배할 수밖에 없다."
 hd_maa_source.0021.a_keep:0 "오계의 병사 증원 모집을 잠시 늦춘다."
 hd_maa_source.0022.t:0 "오계 만족이 다시 귀부하다"
 hd_maa_source.0022.desc:0 "오계의 만족들이 다시 귀부하여, 각처의 수령들이 사람을 보내 진영 앞에서 모병에 응했다. 그들은 숲속의 오솔길과 시냇가의 매복처를 마치 자기 집 보물을 세듯 훤히 꿰고 있었다.\n\n새 병사는 여전히 재물과 군량으로 불러 모아야 하고, 편성하고 훈련해야 군을 이룰 수 있다. 그러나 숲과 늪 사이에서 군사를 쓰는 어려움에, 마침내 다시 기댈 만한 사람이 생겼다."
 hd_maa_source.0022.a:0 "산과 시내 사이에 다시 모집할 사람이 생겼다."
 hd_shanyue_jiashi:0 "산월갑사"
 hd_shanyue_jiashi_flavor:0 "#F 산월은 험한 산에 의지하여 왕조의 조세를 바치지 않았고, 산에서 구리와 쇠가 나니 스스로 갑옷과 병기를 주조했다. 항복한 뒤에는 그 가운데 건장한 자들을 군대에 편입했는데, 갑옷을 입고 병기를 들고서 숲과 산등성이 사이에서 싸우는 데 익숙했다.#!"
 hd_maa_source.0023.t:0 "산월이 다시 산을 나오지 않다"
 hd_maa_source.0023.desc:0 "단양, 회계, 예장 일대의 산월이 더 이상 산을 내려와 모병에 응하지 않는다. 그 산지들은 이미 당신의 손을 벗어났거나, 여러 종부가 다시 험한 곳에 의지해 스스로를 지키고 있어, 당신이 보낸 사람은 산 어귀에도 들어가지 못했다.\n\n이미 군대에 편입된 산월갑사는 여전히 당신의 호령을 따른다. 다만 병력을 더하려 해도 당장은 고를 사람이 없다."
 hd_maa_source.0023.a:0 "지금 있는 갑사는 예전처럼 명을 따른다."
 hd_maa_source.0024.t:0 "산월이 다시 산을 나오다"
 hd_maa_source.0024.desc:0 "산중의 여러 종부가 다시 귀부하여, 건장한 자제들이 또다시 산 아래로 보내져 진영 앞에서 선발을 기다리고 있다. 그들은 저마다 자기 집에서 주조한 칼을 메고, 표정이 고집스럽다.\n\n그들에게 갑옷을 입히고 편성하려면 여전히 따로 재물과 군량을 들여야 한다. 그러나 모집할 수 있는 것과 모집할 길이 없는 것은 어디까지나 별개의 일이다."
 hd_maa_source.0024.a:0 "다시 건장한 자를 골라 갑옷을 입힌다."
 hd_danyang_jingbing:0 "단양정병"
 hd_danyang_jingbing_flavor:0 "#F 단양은 산이 험하고 백성들이 대부분 과감하고 굳세어, 무예를 좋아하고 싸움을 익히며 기력을 숭상한다. 천하에서 정병을 말할 때면 늘 단양을 꼽았고, 주군에 위급한 일이 생기면 흔히 사자를 이곳에 보내 병사를 모았다.#!"
 hd_maa_source.0025.t:0 "단양 모병의 길이 막히다"
 hd_maa_source.0025.desc:0 "단양에서 전해 온 소식에 당신은 눈살을 찌푸렸다. 군은 이미 주인이 바뀌었거나, 병란 뒤에 인심이 안정되지 않아, 예년에 앞다투어 군에 들어오던 산골 백성의 자제를 이제는 한 명도 모을 수 없다.\n\n진영에 있는 단양정병은 여전히 당신의 지휘를 받는다. 그러나 앞서 새 병사에 의지해 세웠던 몇 가지 배치는 다시 계획할 수밖에 없다."
 hd_maa_source.0025.a:0 "군사를 쓸 때는 먼저 실제 수를 헤아린다."
 hd_maa_source.0026.t:0 "단양에서 다시 모병 가능"
 hd_maa_source.0026.desc:0 "단양이 다시 안정을 되찾자, 군리가 보고하기를 산중의 자제들이 다시 나와 군에 들어오려 한다고 했다. 단양병의 명성은 천하가 다 아는 터라, 소식이 퍼지자 막하의 장수들이 모두 찾아와 이번에 몇 명이나 나누어 받을 수 있는지 물었다.\n\n한 영을 더하는 데에도 여전히 돈이 들고, 곧바로 증원 모집을 할지는 당신이 정해야 한다. 그러나 이 병력 공급원은 마침내 다시 당신의 손에 돌아왔다."
 hd_maa_source.0026.a:0 "단양정병을 다시 모집할 수 있다."
 hd_fuling_liannushi:0 "부릉연노사"
 hd_fuling_liannushi_flavor:0 "#F 부릉의 산골 백성들은 대부분 우직하고 용맹하며 사냥에 익숙하다. 그들은 연노로 번갈아 화살을 쏘아 화살촉이 끊임없이 이어지니, 산 어귀의 좁은 길을 지킬 때면 쳐들어오는 적이 틈을 타 가까이 다가오기 어렵다.#!"
 hd_maa_source.0027.t:0 "부릉 노사 모집난"
 hd_maa_source.0027.desc:0 "부릉의 소식이 전해졌다. 그 일대는 이미 당신의 손을 벗어났거나, 산골 백성들이 마음이 떠나, 사냥에 익숙한 장정들이 모두 깊은 산으로 숨어 버렸다. 연노는 장인을 시켜 본떠 만들 수 있지만, 그것을 다룰 줄 아는 사람은 징발할 수 없게 되었다.\n\n진영에 있는 연노사는 여전히 호령을 따른다. 앞으로 산 어귀를 지키는 일은 손에 있는 이 노진에만 의지할 수밖에 없다."
 hd_maa_source.0027.a:0 "잠시 지금 있는 노사로 수비한다."
 hd_maa_source.0028.t:0 "부릉 노사가 다시 모이다"
 hd_maa_source.0028.desc:0 "부릉이 다시 안정을 되찾자, 산중의 사냥꾼들이 다시 산을 내려와 모병에 응하려 한다. 그들이 연노를 들고 시험 삼아 쏘자 화살이 한 대 또 한 대 과녁에 꽂히니, 막하의 장인들이 보고 연신 고개를 끄덕였다.\n\n모집과 훈련에는 여전히 따로 재물과 군량을 들여야 하고, 새 군대도 스스로 오지는 않는다. 그러나 쓸 사람이 없어 접어 두었던 그 수비 방안 한 묶음을 마침내 다시 꺼낼 수 있게 되었다."
 hd_maa_source.0028.a:0 "노사를 모집할 수 있으니, 예전 방안을 이어 가자."
 hd_qiang_qi:0 "강기"
 hd_qiang_qi_flavor:0 "#F 서강의 여러 종족은 농우와 하황에 흩어져 살며 목축과 사냥으로 생계를 꾸린다. 강족 기병은 바람처럼 오가니, 모이면 진을 이루고 흩어지면 쫓기 어려워, 양주의 호걸들이 거병할 때면 대부분 이들을 앞잡이로 삼았다.#!"
 hd_maa_source.0029.t:0 "강기가 오지 않다"
 hd_maa_source.0029.desc:0 "농우의 여러 강족이 더 이상 당신의 징발에 응하지 않는다. 금성과 농서 일대는 이미 주인이 바뀌었거나, 여러 종족이 배반과 복종을 거듭하여, 당신이 보낸 사자가 가지고 돌아온 것은 양가죽 몇 장과 한바탕 핑계뿐이었다.\n\n진영에 있는 강기는 여전히 당신의 지휘를 받는다. 다만 앞으로 빠른 기병이 필요한 곳에는 이 몇 개 영의 사람들이 한 번 또 한 번 달려야 할 것이다."
 hd_maa_source.0029.a:0 "잠시 지금 있는 강기에 맞추어 계획한다."
 hd_maa_source.0030.t:0 "여러 강족이 다시 귀부하다"
 hd_maa_source.0030.desc:0 "농우의 여러 강족이 다시 귀부하여, 각 부족의 호수가 자제들을 보내 당신을 위해 기병을 내겠다고 했다. 그들이 진영 앞에서 말을 달리며 활을 쏘는데 오고 감이 바람 같으니, 한나라 기병들도 속으로 감탄했다.\n\n그들을 불러 모으려면 여전히 재물과 군량이 들고, 편성에도 시간이 걸린다. 그러나 다시 빠른 기병이 필요할 때, 지금 있는 부대만 이리저리 내달리게 하지 않아도 된다."
 hd_maa_source.0030.a:0 "서강의 기수를 다시 징집할 수 있다."
 hd_bingzhou_bianqi:0 "병주 변기"
 hd_bingzhou_bianqi_flavor:0 "#F 병주는 북으로 흉노와 선비에 닿아 있어, 변방 백성들이 말안장 위에서 자라 변새의 길을 알고 말달려 쫓는 데 익숙하다. 천하에 일이 생기면 병주의 기병은 늘 제후들이 앞다투어 끌어들이려는 정예였다.#!"
 hd_maa_source.0031.t:0 "병주 변기 모집난"
 hd_maa_source.0031.desc:0 "병주에서 전해 온 소식에 따르면, 변기를 더는 모집할 수 없게 되었다. 안문과 운중 일대는 이미 당신의 손을 벗어났거나, 호족 기병이 출몰하여 변방 백성이 흩어져, 말안장 위에서 나고 자란 변경의 자제들은 이미 간 곳을 알 수 없다.\n\n진영에 있는 병주 변기는 여전히 당신의 지휘를 받는다. 다만 다음 군령의 선후는 다시 헤아려야 한다."
 hd_maa_source.0031.a:0 "기병을 헤아린 뒤에 명령을 내린다."
 hd_maa_source.0032.t:0 "병주에서 다시 기병 모집 가능"
 hd_maa_source.0032.desc:0 "병주의 변경이 다시 안정을 되찾자, 군리가 보고하기를 변방 백성들이 다시 모병에 응하려 한다고 했다. 변새의 길을 알고 말달려 쫓는 데 익숙한 젊은이들이 활을 메고 말을 끌고, 이미 군성 밖에 여러 무리가 모여 있다.\n\n그들을 기병 진으로 편성하려면 여전히 따로 투자해야 한다. 그러나 정말 필요하다면 이제 착수할 수 있다."
 hd_maa_source.0032.a:0 "변기를 모집할 수 있으니, 행군에 다시 여유가 생겼다."
 hd_tengjia:0 "등갑병"
 hd_tengjia_flavor:0 "#F 영창의 만인들은 산의 등나무를 캐어 기름에 담갔다가 거듭 볕에 말려 갑주를 엮으니, 가볍고 질겨 칼과 화살이 잘 들지 않고 물을 건너도 가라앉지 않는다. 다만 등갑은 화공을 가장 꺼리며, 북방의 혹한도 견디지 못한다.#!"
 hd_maa_source.0033.t:0 "영창 등갑의 맥이 끊기다"
 hd_maa_source.0033.desc:0 "영창에서 전해 온 소식에 따르면, 등갑병을 더는 징발할 수 없게 되었다. 그 일대는 이미 당신의 손을 벗어났거나, 여러 부족이 배반과 복종을 거듭하여, 등나무를 캐어 기름에 담그고 등갑을 엮을 줄 아는 장인과 그것을 입고 싸움에 나설 수 있는 만병이 모두 더 이상 당신의 부름을 듣지 않는다.\n\n진영에 있는 등갑병은 여전히 부릴 수 있다. 다만 앞으로 군사를 쓸 때는 지금 있는 인원수에 맞추어 셈할 수밖에 없다."
 hd_maa_source.0033.a:0 "지금 있는 부대는 예전처럼 지휘를 받는다."
 hd_maa_source.0034.t:0 "등갑이 다시 나오다"
 hd_maa_source.0034.desc:0 "영창의 여러 부족이 다시 귀부하자, 산중에서 다시 묵은 등나무 다발과 갑옷을 엮을 줄 아는 장인들을 보내왔다. 부족의 만병들이 새로 만든 등갑을 걸치고 진영 앞에 늘어서니, 기름기가 번들번들 빛났다.\n\n새 영을 편성하려면 갑옷과 병기, 군사에 여전히 따로 재물과 군량을 들여야 한다. 그러나 예전에는 미뤄 둘 수밖에 없던 일을 오늘 다시 착수할 수 있게 되었다."
 hd_maa_source.0034.a:0 "등갑의 병사를 다시 모집할 수 있다."
 hd_maa_training_no_valid_trainer:0 "휘하에 당장 선발과 훈련의 임무를 맡을 사람이 없어, 이 일은 접을 수밖에 없습니다."
 hd_maa_training_invest_0_tt:0 "#EMP 새 군대는 당신의 수도에서 편성됩니다. 비용을 아낀 만큼, 정예의 정도와 규모는 대체로 선발·훈련을 맡은 자의 역량에 달려 있으며, 운도 조금 작용합니다.#!"
 hd_maa_training_invest_10_tt:0 "#EMP 새 군대는 당신의 수도에서 편성됩니다. 포상이 후하니, 정예를 조금 더 얻을 수도 있습니다.#!"
 hd_maa_training_invest_20_tt:0 "#EMP 새 군대는 당신의 수도에서 편성됩니다. 힘을 다해 공급하니, 얻는 바가 더욱 볼만할 것입니다.#!"
 hd_debug_prepare_youzhou_tuqi_decision:0 "【디버그】 유주 돌기 군제 수립"
 hd_debug_prepare_youzhou_tuqi_decision_desc:0 "일반 조건을 무시하고 유주 돌기 군제를 수립하며, 직할 병력 공급원 테스트에 필요한 장악력을 채웁니다."
 hd_debug_prepare_youzhou_tuqi_decision_tooltip:0 "유주 돌기의 모집, 증편, 병력 공급원 변화를 테스트하는 데 사용합니다."
 hd_debug_prepare_youzhou_tuqi_decision_effect:0 "유주 돌기 테스트 조건이 수립되었습니다."
 hd_debug_train_xianzhenying_decision:0 "【디버그】 함진영 조련"
 hd_debug_train_xianzhenying_decision_desc:0 "나 자신을 훈련자로 삼아 곧바로 함진영 훈련 이벤트로 들어갑니다."
 hd_debug_train_xianzhenying_decision_tooltip:0 "함진영의 투입과 편성 결과를 테스트하는 데 사용합니다."
 hd_xianzhenying:0 "함진영"
 hd_xianzhenying_flavor:0 "#F 고순의 부대는 인원은 많지 않으나 갑옷과 기계가 정련되고 가지런하여, 공격할 때마다 깨뜨리지 못하는 것이 없었으니, 세상에서 함진영이라 불렀다. 중갑이 서로 맞닿고 호령이 흐트러지지 않으니, 진을 깨뜨리는 날카로운 칼날이다.#!"
 hd_xianzhenying_army:0 "함진영"
 hd_maa_training.1000.t:0 "함진영 조련"
 hd_maa_training.1000.desc:0 "[hd_maa_trainer.GetTitledFirstName](이)가 선발과 훈련의 방안을 당신 앞에 올리며, 먼저 꺼낸 말은 용력이 아니라 군기였다. 함진의 병사는 칼날을 맞받아 앞으로 나아갈 용기도 있어야 하지만, 그보다 동료 곁에 버티고 설 줄 알아야 한다. 가장 먼저 뛰쳐나가는 자만 고르면, 함께 살아 돌아올 수 있는 자를 고르지 못할 수도 있다.\n\n갑편, 방패, 상금을 [hd_maa_trainer.GetSheHe](이)가 하나하나 짚어 보였다. 뛰어난 이들이 찾아와 몸을 바치는 것은 상금만 보고서가 아니라, 당신이 직접 나서서 자신의 명망으로 그들에게 앞날을 약속해 주는지도 본다. 아낄수록 고를 수 있는 사람은 줄어든다.\n\n이 군대는 아직 모습을 갖추지 않았는데, 지출은 이미 진을 이루어 늘어서 있다."
 hd_maa_training.1000.a:0 "힘닿는 대로 하되, 용사를 골라 군을 이룬다."
 hd_maa_training.1000.b:0 "선발한 병사에게 후한 상을 내리고, 갑옷과 기계를 충분히 갖춘다."
 hd_maa_training.1000.c:0 "부고를 아끼지 말고, 정예를 모두 골라라!"
 hd_maa_training.1001.t:0 "함진영 편성"
 hd_maa_training.1001.desc_tier1:0 "교장에 새로 편성된 함진영이 진을 이루었다. [hd_maa_trainer.GetTitledFirstName](은)는 당신과 함께 조련을 다 지켜본 뒤, 그 결점을 숨기지 않았다. 진형 전환이 조금 느리고, 앞뒤의 연결도 충분히 긴밀하지 않다는 것이다.\n\n그래도 이 군대는 결국 이루어졌으니, 빈 이름에서 시작할 필요는 없게 되었다. 다만 앞으로 그들을 어디로 보내든, 오늘 본 이 머뭇거림을 기억해야 하며, 우렁찬 군호에 눈이 가려져서는 안 된다."
 hd_maa_training.1001.desc_tier2:0 "새로 편성된 함진영이 교장에서 한 차례 조련을 했다. 갑옷과 기계가 갖추어지고 대오가 질서 있으며, 나아가고 물러남이 대체로 호령을 따랐다. [hd_maa_trainer.GetTitledFirstName]의 평은 담담했고, 끝에 “쓸 만합니다”라는 한마디만 덧붙였다.\n\n그것이면 충분하다. 함진이라는 이름은 아군에게 외쳐 들려주는 것이 아니며, 진 앞에 이르면 방패 뒤의 한 사람 한 사람이 자기 자리를 지켜야 한다. 이제 다시 누가 앞으로 나설 수 있느냐고 물을 때, 당신에게는 고려할 수 있는 부대가 하나 더 생겼다."
 hd_maa_training.1001.desc_tier3:0 "북소리가 울리자 함진영의 앞줄은 방패를 들고 뒷대는 이어 나아가며, 군사를 거둘 때도 누구 하나 앞다투기만 하지 않았다. 장대 위에서 지켜보던 당신은 저도 모르게 난간을 짚고 있던 손을 풀었다.\n\n이것은 갑옷을 걸친 용맹한 자들의 무리가 아니라, 호령이 앞뒤로 꿰뚫어 통하는 군대다. 앞서 들인 재물과 군량과 명망이 마침내 눈에 보이는 결실을 맺었다."
 hd_maa_training.1001.desc_tier4:0 "조련이 막바지에 이르자 북소리가 급해지고, 함진영이 영 전체로 진을 거두었는데 맨 끝줄도 흐트러지지 않았다. [hd_maa_trainer.GetTitledFirstName](이)가 몸을 돌려 당신에게 예를 올리는데, 얼굴에 드물게 득의의 빛이 비쳤다.\n\n앞줄이 적을 맞고 뒷대가 메우며, 호령이 바뀌면 영 전체가 다시 차례대로 물러날 수 있다. 이 새 군대를 바라보며, 당신은 벌써 다음 군의에 그들을 써넣고 싶어 견딜 수가 없다."
 hd_maa_training.1001.a:0 "함진의 병사들이여, 나의 군령을 들으라."
 hd_hubaoqi:0 "호표기"
 hd_hubaoqi_flavor:0 "#F 조씨가 친히 거느린 정예 기병으로, 병사들은 대부분 백인장 가운데서 발탁되어 천하의 날랜 정예라 불렸다. 그들은 갑옷을 입고 말을 달려 돌격하며, 탁 트인 곳에서 단숨에 진을 깨뜨리고 패주하는 군대를 끝까지 추격하는 데 뛰어나다.#!"
 hd_hubaoqi_army:0 "호표기"
 hd_maa_training.1100.t:0 "호표기 조련"
 hd_maa_training.1100.desc:0 "[hd_maa_trainer.GetTitledFirstName](은)는 호표기의 선발과 훈련을 이야기하면서 먼저 말값을 짚어 보이고, 이어 갑옷과 기계, 선발과 모집의 비용을 덧붙였으니, 재물과 군량 장부에 가볍게 넘길 수 있는 항목이 거의 없었다.\n\n“기수가 나아갈 용기가 있어도, 말 또한 나아갈 수 있어야 합니다.” [hd_maa_trainer.GetSheHe]의 말이다. 호표기의 병사는 예로부터 백인장 가운데서 발탁되었으니, 이들이 옛 부하를 버리고 찾아오는 것은 상만 바라서가 아니라, 한 시대에 명망 높은 주군을 따르기 위해서이기도 하다.\n\n적진으로 내달리기 전에, 이 기병대는 먼저 당신의 부고 앞을 지나가야 한다."
 hd_maa_training.1100.a:0 "지금 있는 기수 중에서 뛰어난 자를 고른다."
 hd_maa_training.1100.b:0 "기사들에게 후한 상을 내리고, 말과 갑옷을 채운다."
 hd_maa_training.1100.c:0 "좋은 말과 정예 병사에는 재물을 아끼지 않는다!"
 hd_maa_training.1101.t:0 "호표기 편성"
 hd_maa_training.1101.desc_tier1:0 "호표기가 이미 편성되었으나, 조련은 당신이 생각한 만큼 시원스럽지 않았다. 기수들은 저마다 재주가 있으나 한데 모여 진세를 바꿀 때 앞뒤가 여전히 들쭉날쭉하고, 북소리가 울려도 모두가 함께 나아가고 물러나지는 않았다.\n\n당신은 조금 실망했지만 소매를 떨치고 가 버리지는 않았다. 새 기병은 어쨌든 쓸 수 있게 되었고, 더 이상 종이 위의 계획만이 아니다. 정말로 그들을 보내 적과 맞서게 할 때는 오늘 본 이 머뭇거림을 기억해야 한다."
 hd_maa_training.1101.desc_tier2:0 "호표기가 교장을 한 바퀴 내달렸는데, 당신의 눈길을 가장 끈 것은 기병대의 앞뒤가 이어지며 차례가 흐트러지지 않은 점이었다. 말을 재촉해 앞으로 나아갈 수 있는 자는 많지만, 호령에 따라 멈출 줄 아는 자도 그만큼 귀하다.\n\n갑옷과 기계, 편성이 모두 갖추어졌다. 당신은 이로써 다음 싸움에서 반드시 이긴다고 큰소리치지는 않았다. 그래도 평원에서의 접전을 다시 논할 때, 당신 손에는 마침내 무게가 하나 더해졌다."
 hd_maa_training.1101.desc_tier3:0 "북소리 속에 호표기가 대열을 펼쳐 돌진한 뒤 다시 명에 따라 방향을 거두니, 기수와 말이 한 치의 틈도 없이 맞아떨어졌다. 굳어 있던 당신의 얼굴빛이 마침내 풀렸다.\n\n이것은 담력 하나만으로 끌어모은 부대가 아니다. 선발과 훈련에 쓴 돈과 비단이 이제는 모두 명령을 따르는 말발굽이 되었다. 당신은 속으로 그들을 먼저 어느 쪽 적과 맞서게 할지 셈하고 있다."
 hd_maa_training.1101.desc_tier4:0 "호표기가 교장 한쪽 끝에서 질풍처럼 달려와 장대 앞에 이르러 일제히 말고삐를 당기니, 말발굽 소리가 뚝 그치고 일어난 흙먼지가 한참 만에야 가라앉았다. [hd_maa_trainer.GetTitledFirstName](이)가 당신 곁에서 낮게 말했다. “천하의 날랜 정예가 모두 여기 있습니다.”\n\n갑옷과 기계, 말과 대열 어느 것 하나 흠잡을 데가 없다. 처음에는 꽤 무겁게 보이던 그 지출도, 지금 생각하니 대수롭지 않게 느껴진다."
 hd_maa_training.1101.a:0 "호표가 이미 모였으니, 명을 기다려 내달린다."
 hd_baier:0 "백이"
 hd_baier_flavor:0 "#F 백이는 유비 휘하의 친위병으로, 흰 털 장식을 표지로 삼았다. 진도가 이 군을 통솔했는데, 조운과 더불어 충성과 용맹으로 이름났으며, 위급할 때 주군을 호위하여 결코 함부로 본진을 떠나지 않았다.#!"
 hd_baier_army:0 "백이"
 hd_maa_training.1200.t:0 "백이 조련"
 hd_maa_training.1200.desc:0 "[hd_maa_trainer.GetTitledFirstName](이)가 백이의 선발과 훈련 방안을 올렸다. 당신이 고를 수 있는 용사가 몇이나 되느냐고 묻자, [hd_maa_trainer.GetSheHe](은)는 오히려 적을 만났을 때 누가 빈자리를 메우고 누가 대열을 거두는 것을 엄호할지부터 이야기했다.\n\n호위하는 군대는 갑옷이 좋고 힘이 센 것만으로는 안 되며, 남들이 물러날 때 자기 자리를 지켜야 한다. 이런 사람은 찾기 어렵고, 찾아오는 이들도 주군이 목숨을 맡길 만한지 살피니, 당신의 명망이 곧 그들에게 내주는 증표다.\n\n그저 손쉽게 하려고 아무렇게나 한 대를 꾸린다면, 그들이 가장 필요할 때 군호가 아무리 듣기 좋아도 소용이 없을 것이다."
 hd_maa_training.1200.a:0 "지금 있는 재원에 따라 호위병을 선발·훈련한다."
 hd_maa_training.1200.b:0 "후한 상으로 뛰어난 자를 고르고, 갑옷과 기계를 충분히 갖춘다."
 hd_maa_training.1200.c:0 "호위하는 군대에는 힘을 다해 공급한다."
 hd_maa_training.1201.t:0 "백이 편성"
 hd_maa_training.1201.desc_tier1:0 "백이가 이미 편성되었으나, 조련 중 몇 군데에서 서로 엄호하는 것이 매끄럽지 않아, 그것을 본 당신은 저도 모르게 눈살을 찌푸렸다.\n\n호위하는 군대가 가장 꺼리는 것은 자리를 메워야 할 때 머뭇거리는 것이다. 그러나 이 새 군대를 쓸 수 없는 것은 아니며, 당신의 기대가 더 높았다고 해서 이번 선발과 훈련에서 얻은 것이 전혀 없다고 여길 수는 없다. 앞으로 그들을 어디에 둘지는 지금의 역량에 맞추어 정해야 하며, 백이라는 두 글자만 믿고 안심하고 등을 돌려서는 안 된다."
 hd_maa_training.1201.desc_tier2:0 "백이가 교장에서 한 차례 조련을 했다. 대오가 흐트러지지 않고 앞뒤가 서로 버틸 수 있으며, 대열을 거둘 때도 뒷줄을 챙기는 이가 있었다. 다 보고 나서야 당신은 자신이 가장 신경 쓴 것이 언제나 그 마지막 대목이었음을 깨달았다.\n\n그들이 모두 홀로 한몫을 해낼 수 있는 것은 아니지만, 한데 묶어 놓으니 이미 저마다 용맹을 뽐내는 사람의 무리가 아니라 통솔이 선 호위대 같았다. 예전에는 함께 돌보기 어렵던 몇몇 수비도 이제 다시 생각해 볼 수 있게 되었다."
 hd_maa_training.1201.desc_tier3:0 "조련 중 한 대목을 당신은 특히 자세히 지켜보았다. 앞줄이 방향을 거둘 때 뒷대가 제때 빈틈을 메웠고, 대열 전체가 정돈될 때까지도 서로 챙기는 것을 잃지 않았다.\n\n나아가고 물러나는 사이에 동료를 지킬 수 있는 사람이라야 등 뒤의 길을 맡길 만하다. 이번 선발과 훈련의 결과는 당신이 처음 바랐던 것보다 나았고, 들인 돈과 비단도 이제는 전혀 아깝지 않다."
 hd_maa_training.1201.desc_tier4:0 "조련이 거의 끝나 갈 무렵, 당신은 뒷대가 앞줄을 받아 내는 그 대목을 한 번 더 해 보이라고 일렀다. 다른 이들은 모두 군용을 보고 있었지만, 당신은 오직 이 세부만을 신경 썼다.\n\n나아가고 물러남이 엄정하고, 방향을 거둘 때 서로를 지킨다. 언젠가 전선에서 물러날 수밖에 없는 날이 온다면, 당신이 보고 싶은 것은 바로 이런 대열이지, 저마다 제 발밑의 길만 아는 무리가 아니다. 방금 전까지 무겁게 느껴지던 이 선발·훈련 비용도 이제는 아깝다는 말 한마디조차 하기 어렵다."
 hd_maa_training.1201.a:0 "백이가 편성되었으니, 진의 뒤를 맡길 만하다."
 hd_jiefanbing:0 "해번병"
 hd_jiefanbing_flavor:0 "#F 해번병은 손오 중군의 정예로, 주상의 번거로움과 어려움을 풀어 준다는 뜻에서 이름을 따왔다. 급한 경보가 있을 때마다 신임하는 장수가 이끌고 밤을 새워 달려가 구원하며, 숲과 늪 사이를 자유자재로 옮겨 다니며 싸웠다.#!"
 hd_jiefanbing_army:0 "해번병"
 hd_maa_training.1300.t:0 "해번병 조련"
 hd_maa_training.1300.desc:0 "[hd_maa_trainer.GetTitledFirstName](이)가 선발과 훈련의 방안을 펼치며, 해번병이 어떻게 대를 나누어 서로 호응하고 적을 만나면 다시 합칠지를 설명했다. 그 말을 들으며 당신은 한 통 한 통 더 급하게 재촉하던 군보들을 떠올렸다.\n\n빠르다는 것은 그저 잘 달린다는 뜻만은 아니다. 병기와 행장이 발걸음을 묶어서는 안 되고, 작은 대가 큰 진을 떠나서도 호령을 알아들어야 한다. 그렇지 않으면 일찍 도착한 만큼 일찍 흩어진다. [hd_maa_trainer.GetSheHe]의 말로는 이런 뛰어난 자들은 곳곳에서 서로 데려가려 다투니, 그들을 불러오려면 상금 말고도 당신의 명성으로 끌어들여야 한다고 한다.\n\n군중의 번거로움을 풀어 주려면, 먼저 눈앞의 이 셈부터 풀어야 한다."
 hd_maa_training.1300.a:0 "지금 있는 군사 중에서 뛰어난 자를 고른다."
 hd_maa_training.1300.b:0 "후한 상으로 선발·모집하여 부대를 채운다."
 hd_maa_training.1300.c:0 "위급에 대응하는 군대이니, 힘을 다해 준비하라!"
 hd_maa_training.1301.t:0 "해번병 편성"
 hd_maa_training.1301.desc_tier1:0 "해번병이 이미 편성되었으나, 조련 중 대를 바꿀 때 호응이 충분히 빠르지 않았다. 그것을 본 당신은 원래 그들에게 맡기려던 급한 임무 하나를 잠시 책상 한쪽에 도로 내려놓았다.\n\n이 군대가 아무것도 얻지 못했다고 할 수는 없지만, 급박할 때 홀로 임기응변하기를 너무 크게 기대해서는 안 된다. 군호는 이미 세워졌으니, 앞으로 그들을 어떻게 알맞게 쓸지는 여전히 당신이 마음을 더 써야 한다."
 hd_maa_training.1301.desc_tier2:0 "해번병이 교장에서 몇 차례 나뉘고 합쳤는데, 각 대가 흩어질 수도 모일 수도 있었고, 호령을 받으면 제때 방향을 틀 수 있었으며, 누구 하나 앞으로만 달리다가 서로 챙기는 것을 놓치지 않았다.\n\n이 새 군대가 모든 급한 일을 도맡을 수는 없겠지만, 이미 부릴 수 있는 인력이 되었다. 당신은 앞서 이쪽을 헐어 저쪽을 메우던 계획들을 다시 한 번 살펴보고, 마음이 조금 가벼워졌다."
 hd_maa_training.1301.desc_tier3:0 "조련 때 해번병의 각 대가 번갈아 나아가고 물러났으며, 호응과 수습이 모두 깔끔했다. 당신은 원래 그들이 한번 나뉘면 흩어질까 걱정했는데, 이제야 마음을 놓았다.\n\n분주히 달릴 힘이 있으면서도 동료의 호령을 알아듣고 있으니, 비로소 위급에 대응하는 군대답다. 이름만 바꾼 평범한 보병이 아니다. 정말 급한 난리에 제때 닿을 수 있을지는 당신의 지휘에 달렸지만, 군중에 쓸 만한 인재가 늘어난 것은 분명하다."
 hd_maa_training.1301.desc_tier4:0 "[hd_maa_trainer.GetTitledFirstName](이)가 지도 위에서 각 대의 행선지를 하나하나 짚었다. 어느 길은 나뉘어 나가 적을 끊고, 어느 길은 뒤로 돌아 호응하며, 마지막에는 어디서 다시 합칠지를. 교장의 해번병은 과연 한 치의 어긋남도 없이 모든 길이 제때 합쳐졌다.\n\n당신은 예전에 곳곳에 사람이 모자라고 아무리 옮겨 봐도 느리기만 하던 날들을 떠올렸다. 이제 당신은 벌써 그들에게 정말로 맡길 첫 군령이 무엇이어야 할지 생각하지 않을 수 없다."
 hd_maa_training.1301.a:0 "군중에 급한 일이 있으면 해번병을 부를 수 있다."
 hd_quyi_xiandeng:0 "국의 선등"
 hd_quyi_xiandeng_flavor:0 "#F 국의는 오랫동안 양주에 있어 강족의 싸움법을 익혔다. 계교 전투에서 그는 선등의 병사들을 방패 아래 엎드리게 하고, 강노를 진 양옆에 배치해 서로 받치게 한 뒤, 적 기병이 가까이 달려오기를 기다려 일제히 쏘게 하여 백마의종을 크게 격파했다.#!"
 hd_quyi_xiandeng_army:0 "국의 선등"
 hd_maa_training.1400.t:0 "국의 선등 조련"
 hd_maa_training.1400.desc:0 "[hd_maa_trainer.GetTitledFirstName](은)는 선등 노군의 조련을 이야기하면서, 먼저 군사들이 적 기병이 다가올 때 손을 흔들림 없이 유지할 수 있는지를 물었다. 노기의 값을 보고 있던 당신은 그 말에 비로소 고개를 들었다.\n\n강노는 사들일 수 있지만, 방패 아래 엎드려 호령을 기다릴 사람은 꼼꼼히 골라야 한다. [hd_maa_trainer.GetSheHe](은)는 방패를 드는 것, 노를 당기는 것, 일제히 쏘는 것을 하나로 이어야 하며 따로따로 익혀서는 안 된다고 했다. 결사의 병사가 목숨을 내놓으려면, 군을 이끄는 주군이 한 시대에 명망이 높아 목숨 바칠 만한지도 보아야 한다.\n\n장막 밖에는 명을 전하려고 기다리는 이가 있고, 책상 위에는 당신의 마지막 한마디만 남았다."
 hd_maa_training.1400.a:0 "지금 있는 재원에 따라 노진을 선발·훈련한다."
 hd_maa_training.1400.b:0 "후한 상으로 사람을 고르고, 노기를 충분히 갖춘다."
 hd_maa_training.1400.c:0 "힘을 다해 공급하여 선등을 길러 내라!"
 hd_maa_training.1401.t:0 "국의 선등 편성"
 hd_maa_training.1401.desc_tier1:0 "선등 노군이 이미 편성되었으나, 조련 중 몇 번은 호령이 내려지기도 전에 먼저 화살을 쏘았다. 당신은 이 몇 군데를 적어 두었다. “강노로 기병을 깨뜨린다”는 좋은 명성이 이를 덮어 버리게 두고 싶지 않았다.\n\n진열은 마침내 기틀을 갖추었지만, 적을 맞았을 때 어디까지 흔들림 없을지는 당신의 바람대로 부풀릴 수 없다. 앞으로 정말 그들에게 기병 진을 맞받아치게 하려면, 먼저 오늘의 이 머뭇거림을 기억해야 한다."
 hd_maa_training.1401.desc_tier2:0 "방패 대열과 노수들이 이미 서로 호응할 수 있고, 일제히 쏠 때도 호령을 따랐다. 조련을 다 본 당신은 고개를 끄덕였다.\n\n어떤 적진 앞에서도 산처럼 꿈쩍하지 않는다고 하기에는 아직 이르지만, 노군이라면 갖추어야 할 규율은 이미 갖추었다. 다음에 기병의 우환을 다시 논할 때는 그저 피할 방도만 생각하지 않아도 된다. 다만 실제로 맞붙기 전까지, 과녁을 향해 쏜 화살이 당신 대신 싸움을 미리 이겨 주지는 않는다."
 hd_maa_training.1401.desc_tier3:0 "조련 중 노진은 명을 기다리고, 일제히 쏘고, 다시 정돈하는 차례가 분명했으며, 당신이 가장 걱정하던 먼저 쏘기와 흐트러짐은 한 곳에서도 나타나지 않았다.\n\n방패와 노가 더 이상 따로 싸우지 않는다. 적을 맞을 곳만 잘 고르면, 쳐들어오는 기병에게 대가를 치르게 할 가망이 있다. 선등의 법은 더 이상 한마디 장담이 아니라, 당신 손에 쥔 명령할 수 있는 군대가 되었다."
 hd_maa_training.1401.desc_tier4:0 "“명이 내려지지 않으면 노진에서 먼저 쏘는 자가 없습니다.” [hd_maa_trainer.GetTitledFirstName](이)가 이 말을 할 때, 교장의 노수들은 방패 아래 엎드린 채 꼼짝도 하지 않았다. 북소리가 그치자 만 개의 화살이 일제히 날아, 과녁 더미는 순식간에 화살대로 빼곡해졌다.\n\n당신은 예전에 기병을 마주할 때마다 거듭 고쳐야 했던 배치를 떠올리며, 저도 모르게 손끝으로 소맷부리를 꽉 쥐었다. 예전에는 피해 갈 수밖에 없던 길들을, 오늘은 다시 꼼꼼히 살펴볼 수 있게 되었다."
 hd_maa_training.1401.a:0 "명이 이르면 일제히 쏘고, 진의 발판을 흐트러뜨리지 말라."
 hd_suwei_hushi:0 "숙위호사"
 hd_suwei_hushi_flavor:0 "#F 허저가 거느린 숙위는 호사라 불렸는데, 대부분 그를 따라 거병한 호협과 장사들이었다. 그들은 밤낮으로 주군의 곁을 모시니, 자객도 난병도 감히 가까이 다가오지 못했다.#!"
 hd_suwei_hushi_army:0 "숙위호사"
 hd_maa_training.1500.t:0 "숙위호사 조련"
 hd_maa_training.1500.desc:0 "[hd_maa_trainer.GetTitledFirstName](이)가 호사의 선발과 훈련을 논하러 와서, 예를 올린 뒤에도 여전히 당신 곁에 서 있었다. 당신을 대신해 근위를 고를 이 사람을 바라보노라니, 문득 재물과 군량 장부의 숫자도 그리 눈에 거슬리지 않았다.\n\n[hd_maa_trainer.GetSheHe]의 방법은 분명했다. 먼저 용감하고 건장한 자를 고르고, 이어 명령을 지킬 수 있는지 보며, 갑옷과 기계와 상도 그에 걸맞아야 한다. 목숨을 걸고 주군을 호위하려는 호협들이 중시하는 것은 알아주는 은혜이니, 당신이 직접 나서 명망으로 약속하지 않는다면 아무리 많은 돈으로도 불러올 수 없다.\n\n근위가 일이 없을 때만 보기 좋다면, 따로 군호를 세울 가치가 없다."
 hd_maa_training.1500.a:0 "지금 있는 재원에 따라 용사를 골라 호위로 삼는다."
 hd_maa_training.1500.b:0 "후한 상으로 뛰어난 자를 골라 근위를 채운다."
 hd_maa_training.1500.c:0 "몸 가까이 두는 군대이니, 재원을 아끼지 않는다."
 hd_maa_training.1501.t:0 "숙위호사 편성"
 hd_maa_training.1501.desc_tier1:0 "호사가 이미 편성되었으나, 조련 중 몇 군데 연결이 여전히 더뎠다. 근위는 당신에게서 가장 가까이 서 있으니, 작은 허점도 유난히 눈에 거슬린다.\n\n그러나 이 군대는 어쨌든 이미 모습을 갖추었으니, 당신의 뜻에 다 차지 않는다고 이번 선발과 훈련을 헛된 것으로 여길 수는 없다. 어디는 맡길 만하고 어디는 아직 조심해야 하는지, 당신은 남보다 더 분명히 기억해야 하며, 호사라는 두 글자만 믿고 안심해서는 안 된다."
 hd_maa_training.1501.desc_tier2:0 "호사가 당신 앞에서 한 차례 조련을 했다. 갑옷과 기계가 갖추어지고 대열 바꿈이 질서 있으며, 호령이 앞뒤로 이어졌다. 끝까지 보고 나서야 당신은 줄곧 칼자루를 쥐고 있던 손이 이미 풀려 있음을 깨달았다.\n\n이 새 군대를 못 하는 것이 없다고 말할 필요는 없다. 자기 자리만 지킬 수 있다면 남겨 둘 가치가 있다. 예전에는 함께 돌보기 어렵던 몇 가지 호위 배치도 이제 다시 상의할 수 있게 되었다."
 hd_maa_training.1501.desc_tier3:0 "명을 받고, 대열을 바꾸고, 서로 엄호하는 것까지, 호사의 조련 어느 대목도 좋은 말 몇 마디로 얼버무리지 않았다. 당신은 저도 모르게 두어 걸음 앞으로 나가 더 자세히 보았다.\n\n들인 재물과 군량이 마침내 그럴듯한 호위를 낳았다. 급변이 생겨도 더는 임시로 다른 곳에서 사람을 빼내 메우지 않아도 된다고 생각하니, 마음속에 팽팽하던 줄이 조금 느슨해졌다."
 hd_maa_training.1501.desc_tier4:0 "조련이 막 끝나자 호사들이 일제히 병기를 거두고 멈추어 서니, 갑옷 미늘이 부딪치던 소리가 뚝 그쳤다. [hd_maa_trainer.GetTitledFirstName](이)가 앞으로 나와 아뢰려 했지만, 당신은 먼저 뒤를 한번 돌아보았다. 숙위라 하면 사람이 가장 먼저 떠올리는 것은 결국 자신에게서 가장 가까운 몇 걸음이다.\n\n대열 바꿈, 엄호, 호령 어느 것 하나 흠잡을 데가 없다. 그 돈은 정말 헛되이 쓰지 않았다. 적어도 오늘은, 이런 부대가 곁을 지킨다는 것을 아는 것만으로도 조금은 안심할 수 있다."
 hd_maa_training.1501.a:0 "호사가 명을 들으니, 숙위에 대비가 갖추어졌다."
 hd_nanman_xiangbing:0 "남만상병"
 hd_nanman_xiangbing_flavor:0 "#F 남중 변경 밖의 여러 부족은 코끼리를 길들여 병사로 삼았으니, 조련사가 코끼리 등에 걸터앉아 몰아서 진으로 돌격하게 했다. 거대한 코끼리가 지나는 곳마다 대열이 무너지니, 중원의 병마는 처음 이것을 보면 싸우기도 전에 놀라기 일쑤였다.#!"
 hd_nanman_xiangbing_army:0 "남만상병"
 hd_maa_training.1600.t:0 "남만상병 조련"
 hd_maa_training.1600.desc:0 "[hd_maa_trainer.GetTitledFirstName](이)가 상병의 지출을 책상 위에 늘어놓았다. 꼴과 사료, 장구, 조련사가 하나하나 이어졌다. 그 액수를 본 당신은 군중에서 먹여 살려야 할 것이 코끼리만이 아니라 영원히 채워지지 않는 입 하나가 더 있는 줄 알 뻔했다.\n\n그러나 [hd_maa_trainer.GetSheHe](은)는 먼저 나아가고 물러나는 호령부터 이야기했다. 전투 코끼리는 앞길을 열 수 있지만, 멈추고 방향을 틀게 할 사람도 있어야 한다. 앞으로 몰기만 할 줄 안다면, 뒤에 선 군사들도 안심하지 못할 것이다. 남중 여러 부족의 코끼리 부리는 명수들은 좀처럼 산을 나오지 않으니, 그들을 움직이는 데에는 돈뿐 아니라 당신의 명성도 필요하다.\n\n상군에는 드는 것이 막대하니, 마지막 한마디는 당신이 해야 한다."
 hd_maa_training.1600.a:0 "지금 있는 재원에 따라 상군을 마련한다."
 hd_maa_training.1600.b:0 "재물을 더 내려 선발과 훈련을 충실히 한다."
 hd_maa_training.1600.c:0 "상군에 필요한 것은 힘을 다해 공급한다."
 hd_maa_training.1601.t:0 "남만상병 편성"
 hd_maa_training.1601.desc_tier1:0 "상병이 이미 편성되었으나, 조련 중 몇 번은 방향 전환이 매끄럽지 않았다. 그 거대한 몸뚱이들이 교장에서 머뭇거리며 빙빙 도는 것을 보며, 당신은 잠시 멈칫했다.\n\n조련사와 부대는 이미 편성되었지만, 아직 무르익지 않았다. 어디로 보내고 어떻게 맞서게 할지는 그 위세가 놀랍다는 것만 보고 함부로 정할 수 없다. 군령을 잘못 짜면, 먼저 놀라는 것이 적이라는 보장은 없다."
 hd_maa_training.1601.desc_tier2:0 "조련사가 명에 따라 코끼리를 몰아 나아가고 방향을 거두었으며, 호위병도 알맞게 편성되었다. 당신은 몇 번이고 거듭 지켜보고 나서야 이 새 군대에 대한 걱정을 내려놓았다.\n\n이런 위세는 평범한 보병 진의 방법으로 헤아릴 수 없다. 실제로 적과 맞설 때는 그들이 힘을 펼칠 곳을 충분히 남겨 두어야 하고, 뒷대도 잘 돌보아야 한다. 들인 재물이 마침내 보람을 찾았다."
 hd_maa_training.1601.desc_tier3:0 "상병의 진격, 방향 전환, 수습이 모두 착착 들어맞고, 조련사와 호위병의 호흡도 척척 맞았다. 한 번 다 보고 나서야 당신은 그 무거운 지출이 그에 걸맞은 무게의 것을 가져왔다고 느꼈다.\n\n그들의 위세는 더 이상 멀리서 바라볼 때나 감탄을 자아내는 것이 아니라, 이미 군령에 따라 부릴 수 있게 되었다. 오늘 얻은 것이 좋을수록, 앞으로 경솔한 지휘로 헛되이 망쳐서는 더욱 안 된다."
 hd_maa_training.1601.desc_tier4:0 "코끼리 진이 천천히 나아가더니, 장대 앞에 이르러 길게 한 번 울고는 일제히 멈추었다. [hd_maa_trainer.GetTitledFirstName](이)가 두 팔을 벌려 코끼리 진의 너비를 손짓해 보이다가, 당신이 보고 있는 것을 알고 황급히 내렸다. 당신은 오히려 웃으며 [hd_maa_trainer.GetSheHe]에게 계속 말하게 했는데, 특히 어떻게 방향을 거두는지 분명히 설명하라고 했다.\n\n처음에는 거의 겁이 날 지경이던 그 재원 장부가 마침내 그만큼 무게 있는 것으로 바뀌었다. 언젠가 적군이 정말로 코끼리 진이 다가오는 것을 보게 된다면, 그들의 얼굴에 떠오른 표정도 이렇게 자세히 보고할 가치가 있기를 바란다."
 hd_maa_training.1601.a:0 "상군이 대열을 이루었으니, 명을 기다려 나아간다."
 hd_baiyibing:0 "백의병"
 hd_baiyibing_flavor:0 "#F 여몽이 강릉을 습격해 취할 때, 정병을 배 안에 숨기고 노 젓는 자들에게 모두 흰옷을 입혀 상인으로 꾸민 뒤 밤낮으로 길을 재촉하니, 강을 따라 늘어선 봉화대의 척후들이 모두 사로잡히고도 눈치채지 못했다. 이후로 가벼운 차림으로 기습하는 군사는 대부분 백의를 표지로 삼았다.#!"
 hd_baiyibing_army:0 "백의병"
 hd_maa_training.1700.t:0 "백의병 조련"
 hd_maa_training.1700.desc:0 "[hd_maa_trainer.GetTitledFirstName](은)는 백의병의 선발과 훈련을 이야기하면서 먼저 갑옷과 기계를 헤아리지 않고, 누가 길을 분별할 수 있는지, 누가 큰 무리를 떠난 뒤에도 약속한 행선지를 기억할 수 있는지를 물었다.\n\n당신은 손을 뻗어 지도 위의 작은 깃발 하나를 길가로 옮겼다. 가벼운 차림이란 그저 짐 몇 가지를 덜 지는 것이 아니고, 대를 나누는 것도 사람을 아무렇게나 흩어 놓는 것이 아니다. 때가 되어 서로를 찾지 못한다면, 아무리 빠른 걸음도 대열을 더 흩어지게 할 뿐이다. 이런 뛰어난 자들은 상금으로도, 당신의 명망으로도 불러 모아야 한다.\n\n적과 마주할 때 그들이 가볍게 움직이기를 바란다면, 지금의 재물과 군량은 따져 보지 않을 수 없다."
 hd_maa_training.1700.a:0 "지금 있는 군사 중에서 뛰어난 자를 골라 선발·훈련한다."
 hd_maa_training.1700.b:0 "뛰어난 자에게 후한 상을 내려 부대를 채운다."
 hd_maa_training.1700.c:0 "가벼운 군사를 정련하는 데 힘을 다해 지원한다."
 hd_maa_training.1701.t:0 "백의병 편성"
 hd_maa_training.1701.desc_tier1:0 "백의병이 이미 편성되었으나, 조련 중 몇 군데에서 호응이 매끄럽지 않았다. 그것을 본 당신은 원래 그들에게 맡기려던 모험적인 임무 하나를 잠시 미뤄 두었다.\n\n날쌘 장점이 아무것도 아닌 것은 아니지만, 흩어진 뒤 어떻게 다시 모일지는 당신이 처음 생각했던 것만큼 마음 편하지 않다. 군호가 듣기 좋다는 이유만으로 그들을 너무 멀리 보낸다면, 결국 손해를 보는 것은 당신의 병사들이다."
 hd_maa_training.1701.desc_tier2:0 "백의병의 조련은 꽤 안정적이었다. 대를 나누는 것과 호응하는 것이 모두 명령을 따랐고, 누구 하나 빨리 가려고만 하다가 동료를 놓치지 않았다. 당신은 앞서 품었던 걱정을 조금 내려놓았다.\n\n이 부대는 아직 “종적 없이 오간다”는 칭찬을 받기에는 이르지만, 이미 쓸모가 있다. 앞으로 추적이나 엄호가 필요한 군무를 만나면, 둔중한 큰 무리에게 늘 함께 맡기지 않아도 된다."
 hd_maa_training.1701.desc_tier3:0 "백의병의 각 대가 질서 있게 흩어지고 모이며 제때 호응했고, 이동할 때도 당신이 걱정하던 흐트러짐이 드러나지 않았다. 조련을 다 본 당신은 이번 선발과 훈련이 충분히 값졌다고 느꼈다.\n\n발힘 외에도 서로 이어지는 호령 체계가 있다. 숲과 산등성이 사이에서 적을 쫓고 길을 끊거나 철수를 엄호해야 한다면, 이제 마침내 알맞은 부대가 생겼다. 정면의 기세에 기대지 않고 이기는 부대일수록 첫 군령은 더 깊이 생각해야 한다."
 hd_maa_training.1701.desc_tier4:0 "조련이 시작된 지 얼마 안 되어 백의병이 교장에서 흔적도 없이 사라졌다. 당신이 의아해하는데, [hd_maa_trainer.GetTitledFirstName](이)가 뒤를 돌아보시라고 청했다. 가벼운 병사 몇 대가 어느새 장대 뒤로 돌아가 명령대로 대열을 갖추고 있었다.\n\n당신이 지도 위의 오솔길을 따라 눈길을 옮기자, 눈에 띄지 않던 그 갈림길들이 갑자기 모두 쓸모를 지니게 되었다. 적과 마주할 때, 상대가 군사가 들이닥친 뒤에야 누가 왔는지 깨닫게 할 수 있다면, 그것이야말로 당신이 정말로 기억해 둘 만한 일이다."
 hd_maa_training.1701.a:0 "가벼운 군사가 갖추어졌으니, 나아가고 물러남을 신중히 정한다."
