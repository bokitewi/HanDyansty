 # 四个实际局势子区域
 silk_road_situation_sub_region_region_silk_road_eastern_section:0 "동단"
 silk_road_situation_sub_region_region_silk_road_eastern_section_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak 상인들은 장안에서 서쪽으로 길을 떠나 하서의 무위, 장액, 주천, 돈황 4군을 거쳐 옥문관이나 양관을 나서 서역으로 들어간다. 비단과 좋은 말, 새로운 지식이 해마다 이 길을 오간다.#!"
 silk_road_situation_sub_region_region_silk_road_middle_northern_route:0 "중단 북도"
 silk_road_situation_sub_region_region_silk_road_middle_northern_route_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak 북도는 누란에서 출발해 북산 남쪽 기슭을 따라 서쪽으로 나아가며, 위리, 오루, 윤대, 구자, 고묵을 거쳐 마침내 소륵에 이른다.#!"
 silk_road_situation_sub_region_region_silk_road_middle_southern_route:0 "중단 남도"
 silk_road_situation_sub_region_region_silk_road_middle_southern_route_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak 남도는 누란에서 남산 북쪽 기슭을 따라 서쪽으로 나아가며, 차말, 정절, 한미, 우전, 피산, 사차를 거쳐 마침내 소륵에 이른다.#!"
 silk_road_situation_sub_region_region_silk_road_western_section:0 "서단"
 silk_road_situation_sub_region_region_silk_road_western_section_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak 남북 두 길은 소륵에서 만나 서쪽으로 총령을 넘으니, 대상들은 이곳을 거쳐 대완의 성곽과 시진으로 들어간다.#!"

 # 四座可访问市场
 visit_silk_road_market_decision_loulan:0 "$building_uuii_loulan_market_01$ #weak （[GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_middle_northern_route').MakeScope.Var('innovation').CultureInnovationType.GetName]）#!"
 visit_silk_road_market_decision_khotan:0 "$building_uuii_khotan_market_01$ #weak （[GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_middle_southern_route').MakeScope.Var('innovation').CultureInnovationType.GetName]）#!"
 visit_silk_road_market_decision_dayuan:0 "$building_uuii_dayuan_market_01$ #weak （[GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_western_section').MakeScope.Var('innovation').CultureInnovationType.GetName]）#!"

 building_type_uuii_loulan_market_01:0 "$building_uuii_loulan_market_01$"
 building_type_uuii_loulan_market_01_desc:0 "$building_uuii_loulan_market_01_desc$"
 building_uuii_loulan_market_01:0 "누란 시장"
 building_uuii_loulan_market_01_desc:0 "누란성은 포창해 서북쪽에 자리하여, 서역 남북 두 길이 갈라지는 곳에 있다. 옥문관을 나선 낙타 대상들은 이곳에서 물을 마시고 쉬며 행장을 정비한 뒤, 저마다 길을 골라 서쪽으로 떠난다."
 building_uuii_loulan_market_02:0 "번성한 누란 시장"
 building_uuii_loulan_market_02_desc:0 "누란성 밖에는 객사가 즐비하고, 우물과 역참이 시장을 둘러싸고 서 있어, 동서를 오가는 상인들이 일 년 내내 끊이지 않는다."
 building_uuii_loulan_market_01_destination_desc:0 "[GetBuilding('uuii_loulan_market_01').GetName]에는 북도나 남도로 떠날 대상들이 모여들어, 낙타 방울 소리와 흥정 소리, 호어와 한어가 뒤섞인 말소리가 밤낮으로 그치지 않는다."

 building_type_uuii_khotan_market_01:0 "$building_uuii_khotan_market_01$"
 building_type_uuii_khotan_market_01_desc:0 "$building_uuii_khotan_market_01_desc$"
 building_uuii_khotan_market_01:0 "우전 시장"
 building_uuii_khotan_market_01_desc:0 "우전 성곽은 곤륜산 기슭에 기대어 있으며, 아름다운 옥과 비단, 남도 교역으로 이름이 높다. 먼 나라의 상인들이 이곳에서 물건을 바꾸고, 견문도 함께 나눈다."
 building_uuii_khotan_market_02:0 "번성한 우전 시장"
 building_uuii_khotan_market_02_desc:0 "우전 시장은 여러 거리로 넓어졌으며, 옥 공방과 창고와 객사가 사막을 건너온 상인들을 밤낮으로 맞이하고 보낸다."
 building_uuii_khotan_market_01_destination_desc:0 "[GetBuilding('uuii_khotan_market_01').GetName]에는 곤륜의 미옥과 비단, 이국의 향료가 진열되어 있어, 남도에서 가장 눈부신 무역항이다."

 building_type_uuii_dayuan_market_01:0 "$building_uuii_dayuan_market_01$"
 building_type_uuii_dayuan_market_01_desc:0 "$building_uuii_dayuan_market_01_desc$"
 building_uuii_dayuan_market_01:0 "대완 시장"
 building_uuii_dayuan_market_01_desc:0 "총령을 넘은 대상들은 대완에서 다시 모인다. 한혈마, 철기, 포도주와 동방에서 온 비단이 이곳의 성읍들 사이에서 손에서 손으로 옮겨 간다."
 building_uuii_dayuan_market_02:0 "번성한 대완 시장"
 building_uuii_dayuan_market_02_desc:0 "대완 시장은 이미 총령 서쪽 교역로의 큰 도회가 되었다. 너른 화물장에는 짐을 실은 대상이 가득하고, 말 상인과 먼 길손들이 이곳에서 다음 여정을 정한다."
 building_uuii_dayuan_market_01_destination_desc:0 "[GetBuilding('uuii_dayuan_market_01').GetName]는 좋은 말과 총령을 넘는 원거리 교역으로 이름나 있으며, 한나라 땅과 강거, 안식의 물산이 이곳에서 만난다."
