###战术###

embattle_volly_tactic_modifier:0 "일제 사격 전술"
embattle_volly_tactic_modifier_desc:0 "이 군단은 빗발치듯 일제히 활을 쏘아, 싸우기도 전에 적의 예기를 꺾는다."
embattle_charge_tactic_modifier:0 "돌격 전술"
embattle_charge_tactic_modifier_desc:0 "이 군단은 성난 파도처럼 생사를 돌보지 않고 돌격한다."
embattle_stand_fast_tactic_modifier:0 "고수 전술"
embattle_stand_fast_tactic_modifier_desc:0 "이 군단은 산처럼 버티어 한 치도 물러서지 않는다."
embattle_advance_tactic_modifier:0 "전진 전술"
embattle_advance_tactic_modifier_desc:0 "이 군단은 쇳물이 흐르듯 밀고 나아가 겹겹이 압박한다."
embattle_harass_tactic_modifier:0 "교란 전술"
embattle_harass_tactic_modifier_desc:0 "이 군단은 뱀처럼 적을 교란하며 신출귀몰한다."

embattle_tactic_diversity_modifier:0 "전술 다양성"
embattle_tactic_diversity_modifier_desc:0 "이 지휘관의 전술은 풍부하고 다양하다."
embattle_tactic_counter_modifier:0 "전술 상성 열세"
embattle_tactic_counter_modifier_desc:0 "이 지휘관의 전술은 적에게 간파당했다."

embattle_potshots_tactic_modifier:0 "난사 전술"
embattle_potshots_tactic_modifier_desc:0 "이 군단은 눈먼 궁수처럼 마구 쏘아 대니 도무지 법도가 없다."
embattle_reckless_charge_tactic_modifier:0 "무모한 돌격 전술"
embattle_reckless_charge_tactic_modifier_desc:0 "이 군단은 날뛰는 맹수처럼 적을 상하게 하나 스스로도 다친다."
embattle_confused_orders_tactic_modifier:0 "혼란스러운 군령 전술"
embattle_confused_orders_tactic_modifier_desc:0 "이 군단은 우두머리 잃은 무리처럼 제각기 싸운다."
embattle_timid_advance_tactic_modifier:0 "겁먹은 전진 전술"
embattle_timid_advance_tactic_modifier_desc:0 "이 군단은 살얼음을 밟듯 진퇴를 가누지 못한다."
embattle_disorganised_harass_tactic_modifier:0 "무질서한 교란 전술"
embattle_disorganised_harass_tactic_modifier_desc:0 "이 군단은 둥지를 나선 개미 떼처럼 어지러이 교란한다."

