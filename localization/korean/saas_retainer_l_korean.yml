l_korean:
 saas_recruit_talent_edict_modifier: "초현령"
 saas_recruit_talent_edict_modifier_desc: "이 군주는 천하의 현사를 널리 구하며, 마찬가지로 영을 내걸어 인재를 구하는 제후들과 다투어 인재를 끌어모으고 있습니다."
 saas_retainer_defense_reform_modifier: "수비 정비"
 saas_retainer_defense_reform_modifier_desc: "문객이 수비 명부를 다시 정하고 무기고를 정비하며 향병을 조련하니, 성의 방비가 면모를 일신했습니다."

 saas_retainer_patronage_opinion: "등용됨"
 saas_retainer_rejected_opinion: "건의가 거절됨"
 saas_retainer_project_success_opinion: "재능을 인정받음"
 saas_retainer_project_failure_opinion: "일을 그르침"
 saas_retainer_diplomatic_success_opinion: "사신의 중재"

 saas_recruit_talent_decision: "초현령 반포"
 saas_recruit_talent_decision_confirm: "영을 내걸어 현자를 구하라!"
 saas_recruit_talent_decision_desc: "예법이 무너지고 음악이 어지러우니, 선비에게 정해진 주인이 없다. 사방에 영을 내걸고 예우와 후한 녹봉을 약속한다면, 재주를 품고도 때를 만나지 못한 천하의 선비들이 소문을 듣고 찾아올지도 모른다."
 saas_recruit_talent_decision_tooltip: "초현령을 널리 반포하여, 천하의 제후들과 사방의 영재를 두고 다툼"
 saas_recruit_talent_decision_effect: "초현령이 격문처럼 사방에 퍼지니, 재주 있는 선비들이 주인을 골라 찾아올 수도 있습니다."
 saas_retainer_project_pending_tt: "#EMP 이 일의 성패는 몇 달 뒤에야 판가름 납니다.#!"

 saas_elite_guest_arrived_title: "명사의 방문"
 saas_elite_guest_arrived_desc: "[saas_elite_guest.GetShortUIName](이)가 명성을 흠모하여 찾아와, 당신의 궁정에 손님으로 머물고 있습니다."
 saas_elite_adventurer_spawned_title: "호걸의 자립"
 saas_elite_adventurer_spawned_desc: "[saas_elite_guest.GetShortUIName](이)가 당신의 영지에 나타났으나, 남의 아래에 있기를 원치 않아 스스로 무리를 모아 사방으로 떠돌러 떠났습니다."

 saas_retainer.1100.t: "재화 증식의 계책"
 saas_retainer.1100.desc: "[retainer.GetShortUIName](이)가 재화를 불리는 방책을 적은 글을 올리며, 몇 달만 있으면 밑천을 두 배로 늘릴 수 있다고 말한다. 이자는 확신에 차서 자신만만하게 말하지만, 밑천을 모두 날린다면 그 손실은 당신이 떠안을 수밖에 없다."
 saas_retainer.1100.a: "그 재주를 조금 시험해 보자. 약간만 내주어라."
 saas_retainer.1100.b: "형편에 맞게 내주고 성과를 지켜보자."
 saas_retainer.1100.c: "주머니를 털어 맡기겠다. 성공하면 큰 이익이리라."
 saas_retainer.1100.d: "내 재물은 따로 쓸 곳이 있다."
 saas_retainer.1101.t: "재화 증식의 결과"
 saas_retainer.1101.desc.success: "[retainer.GetShortUIName](이)가 깔끔하게 정리된 장부를 들고 돌아왔다. 수익이 상당하니, 이번 경영은 과연 밑천을 두 배로 불려 놓았다."
 saas_retainer.1101.desc.failure: "[retainer.GetShortUIName](은)는 빈손으로 돌아왔다. 시세도 인심도 예상대로 움직이지 않았고, 쏟아부은 재물은 다시는 되찾을 수 없게 되었다."
 saas_retainer.1101.desc.invalid: "세상일이 변하여 이 경영은 더 이상 이어갈 수 없게 되었고, 장부와 밑천도 그에 따라 흩어져 사라졌다."
 saas_retainer.1101.a: "이자야말로 내게 필요한 인재로다."
 saas_retainer.1101.b: "앞선 수레의 교훈으로 삼자."
 saas_retainer.1101.c: "이 일은 더 이상 따질 수도 없구나."

 saas_retainer.1200.t: "이웃 나라에 사신을 청함"
 saas_retainer.1200.desc: "[retainer.GetShortUIName](이)가 [neighboring_ruler.GetShortUIName]의 궁정에 사신으로 가기를 청하며, 세 치 혀와 약간의 예물만으로도 두 집안의 앙금을 풀기에 충분하다고 자부한다."
 saas_retainer.1200.a: "사신 비용을 갖추어 보내라."
 saas_retainer.1200.b: "지금은 사신을 보낼 때가 아니다."
 saas_retainer.1201.t: "사신의 귀환"
 saas_retainer.1201.desc.success: "[retainer.GetShortUIName](은)는 사명을 욕되게 하지 않았다. [neighboring_ruler.GetShortUIName](은)는 예물을 받았을 뿐 아니라, 당신의 성의를 크게 칭찬했다."
 saas_retainer.1201.desc.failure: "[retainer.GetShortUIName]의 언변은 [neighboring_ruler.GetShortUIName](을)를 움직이지 못했고, 이번 사행은 빈손으로 돌아왔다."
 saas_retainer.1201.desc.invalid: "사절단이 사명을 마치기도 전에 정세가 크게 바뀌어, 이번 사행은 아무 성과 없이 돌아올 수밖에 없었다."
 saas_retainer.1201.a: "좋다! 두 집안이 이로써 화친하게 되었구나."
 saas_retainer.1201.b: "화근이 생기지 않았으니, 그것만으로도 다행이다."
 saas_retainer.1201.c: "시세가 이러하니, 사람의 힘으로 어찌할 수 없구나."

 saas_retainer.1300.t: "성 방비 정비"
 saas_retainer.1300.desc: "[retainer.GetShortUIName](이)가 도성을 순시한 뒤, 무기고와 성문과 징발 명부가 많이 해이해졌다고 지적하며 [retainer.GetHerHim]에게 정비를 맡겨 달라고 청한다."
 saas_retainer.1300.a: "돈과 곡식을 내주고 즉시 정비하라."
 saas_retainer.1300.b: "옛 제도로도 지킬 만하니, 굳이 고칠 것 없다."
 saas_retainer.1301.t: "새로워진 성 방비"
 saas_retainer.1301.desc.success: "[retainer.GetShortUIName](이)가 정비를 마쳤다. 성문의 경계는 삼엄하고 무기고는 질서정연하며, 향리의 징발 명부도 새로 편성되었다."
 saas_retainer.1301.desc.failure: "정비는 곳곳에서 가로막혔다. [retainer.GetShortUIName](은)는 온 힘을 다했으나 방비는 끝내 나아지지 않았다."
 saas_retainer.1301.desc.invalid: "정세가 갑자기 바뀌어, 예정했던 수비 정비를 더 이상 진행할 수 없게 되었다."
 saas_retainer.1301.a: "도성이 안전하니, 내 마음이 매우 놓이는구나."
 saas_retainer.1301.b: "쌓인 폐단은 없애기 어려우니, 하루아침에 될 일이 아니다."
 saas_retainer.1301.c: "우선 눈앞의 일부터 돌보자."

 saas_retainer.1400.t: "횡령 조사"
 saas_retainer.1400.desc: "[retainer.GetShortUIName](이)가 장부 사이에서 의심스러운 구멍을 발견하고, 누군가 공금을 횡령했다고 의심하며 은밀히 이 일을 추적하겠다고 나선다."
 saas_retainer.1400.a: "경비를 내줄 테니 반드시 밝혀내라."
 saas_retainer.1400.b: "궁중 사람들이 모두 불안에 떨게 해서는 안 된다."
 saas_retainer.1401.t: "장물 추적의 결과"
 saas_retainer.1401.desc.success: "[retainer.GetShortUIName](은)는 장부와 진술을 따라가 숨겨 둔 장물을 찾아냈다. 연루된 자들은 이미 죄를 자백했고, 궁중의 위아래 모두 당신의 이목을 더욱 두려워하게 되었다."
 saas_retainer.1401.desc.failure: "단서는 결국 끊기고 말았다. [retainer.GetShortUIName](은)는 재물을 되찾지 못했고, 이번 조사로 도리어 궁중에 원한을 품는 자가 생겼다."
 saas_retainer.1401.desc.invalid: "조사를 주관하던 사람과 정세가 모두 바뀌어, 이 일은 잠시 보류할 수밖에 없다."
 saas_retainer.1401.a: "장물을 되찾았으니, 법도도 바로 섰다."
 saas_retainer.1401.b: "이쯤에서 그만두자."
 saas_retainer.1401.c: "옛 문서는 봉해 두고, 다시는 꺼내지 않겠다."

 saas_retainer.1500.t: "전적 교정"
 saas_retainer.1500.desc: "[retainer.GetShortUIName](이)가 옛 전적과 농서, 지방 장부가 어지럽게 흩어져 있다며, 서리들을 불러 모아 하나하나 교정하여 예제와 농정에 모두 따를 법도가 있게 하자고 청한다."
 saas_retainer.1500.a: "경비를 내줄 테니 서둘러 교정하라."
 saas_retainer.1500.b: "지금은 그럴 여유가 없다."
 saas_retainer.1501.t: "새 책의 완성"
 saas_retainer.1501.desc.success: "[retainer.GetShortUIName](이)가 흩어진 문서들을 조리 정연한 새 책으로 엮어 냈다. 관리들은 이를 바탕으로 정사를 펴고, 선비와 백성들도 예법과 농사철을 더 잘 알게 되었다."
 saas_retainer.1501.desc.failure: "문서가 방대한 데다 서로 어긋나는 곳이 많았다. [retainer.GetShortUIName](은)는 끝내 기한 안에 쓸 만한 책을 엮어 내지 못했다."
 saas_retainer.1501.desc.invalid: "일을 맡은 사람이나 정세가 바뀌어, 전적 교정은 이대로 중단되었다."
 saas_retainer.1501.a: "이 책은 후세에까지 은혜를 끼치기에 족하다."
 saas_retainer.1501.b: "남은 원고라도 거두어 두자."
 saas_retainer.1501.c: "잠시 미루어 두자."
