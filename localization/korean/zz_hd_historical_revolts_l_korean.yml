 # REV-01 184.6 交趾柱天将军
 hd_historical_revolts.0001.t:0 "주천장군"
 hd_historical_revolts.0001.desc:0 "교지에서 급보가 도착했다. 용편의 둔병이 이미 거사하여 [hd_revolt_leader.GetName](이)가 거수로 추대되었고, 스스로 주천장군이라 칭했다고 한다. 소식을 전한 자는 먼저 도중에 다닐 수 있는 길들을 한바탕 늘어놓았는데, 그것이 반군의 병력 수보다도 설명하기 어려웠다.\n\n당신은 지도 위에 멀리 떨어진 군현들을 바라본다. 영외는 산천이 가로막혀 한 둔영에 난이 나도 이웃 현읍이 곧바로 알지 못한다. 소식이 이곳에 닿을 즈음이면, 또 얼마나 많은 이가 반기를 따라 갈 길을 바꾸었겠는가?\n\n당하에서 누군가 이 급보를 어디로 넘겨야 하느냐고 묻는다. 당신은 그것을 책상 위에 남겨 두었다. 전화가 이미 당신의 치하에까지 번졌으니, ‘주천장군’을 그저 황당한 칭호로 여겨 웃어넘길 수는 없다."
 # REV-02 184.10 北宫伯玉
 hd_historical_revolts.0002.t:0 "황중의 강호가 반기를 들다"
 hd_historical_revolts.0002.desc:0 "금성 쪽에서 온 군보가 황중과 하관에서 군사가 일어났다는 소식을 전했다. [hd_revolt_leader.GetName](이)가 여러 부족을 규합하니, 양주의 길과 관문은 더 이상 옛 지도에서처럼 평온하지 않다.\n\n소식을 전한 자는 기병의 자취를 말하며 지도 위에 손으로 몇 곳을 잇달아 그었다. 당신은 지도 모서리를 누르고, 어느 것이 직접 본 것이고 어느 것이 도중에 들은 소문인지 가려 말하게 했다. 변방에서 기병 한 무리를 부풀릴 때마다 후방에서는 수비군 한 곳을 헛되이 빼낼 수 있다. 그러나 소식이 어지럽다고 머뭇거린다면, 정말로 쳐들어오는 적병도 당신을 기다려 주지 않는다.\n\n양주에서 삼보로 통하는 길이 지금 갑자기 모두 좁아진 듯하다. 당신은 정탐해야 할 곳을 다시 짚어 냈다. 이 전쟁은 이미 피할 길이 없다."
 # REV-03 185.2 黑山军
 hd_historical_revolts.0003.t:0 "흑산군이 일어나다"
 hd_historical_revolts.0003.desc:0 "태항산의 무리는 더 이상 흩어져 길을 터는 데 그치지 않고, 이미 하나의 깃발을 내걸었다. [hd_revolt_leader.GetName](이)가 무리를 모아 거병하니, 흑산군에 관한 보고가 각지의 현서에서 잇달아 날아들었다.\n\n당신은 서리를 시켜 산 어귀와 피해를 입은 곳을 한데 표시하게 했다. 그제야 흩어져 보이던 소식들이 골짜기를 따라 한 곳 한 곳 이어져 하나로 연결되어 있음을 알 수 있었다. 평지의 군대는 정탐하기 쉬우나, 일단 산에 들어가면 갈림길 몇 개만으로도 자취가 다시 흩어진다.\n\n누군가는 여전히 그들을 소규모 도적 떼라 부르는 데 익숙하다. 당신은 책상 위에 갈수록 두껍게 쌓이는 급보를 가리켰다. 이름이야 예전처럼 업신여기듯 써도 되지만, 방비만은 예전처럼 해서는 안 된다. 지금 당신과 맞서 싸우는 자들은 이미 병세를 하나로 모을 수 있는 이들이다."
 # REV-04 185.4 江夏蛮（设计性日期后移：史载主要叛乱约180年）
 hd_historical_revolts.0004.t:0 "강하만의 반란"
 hd_historical_revolts.0004.desc:0 "강하에서 보고가 왔다. 경릉 부근의 여러 부족이 이미 무리를 모아 산을 나왔고, [hd_revolt_leader.GetName](이)가 이끄는 무리가 현읍을 침범하기 시작했다고 한다. 급보 말고도 상인들이 길을 바꾸었다는 소식을 전해 왔는데, 물길이든 뭍길이든 평소보다 늦어졌다.\n\n당신은 군리에게 어디서 추격할 수 있고 어디서는 길목만 막아야 하는지 물었다. 그는 숲과 늪을 이야기했는데, 어느 곳 하나 지도에 선 하나 긋는다고 지켜 낼 수 있는 곳이 아니었다. 상대는 길에 익숙하여 나아가고 물러남이 자유로우니, 아군이 곳곳마다 뒤를 쫓다가는 오히려 군대가 흩어질 수 있다.\n\n책상 위의 두 보고서는 같은 곳을 가리키지만, 글줄마다 경중이 달랐다. 당신은 그것들을 나란히 놓고, 이미 당신에게 군사를 일으킨 이 적을 먼저 똑똑히 파악하려 한다."
 # REV-05 187.4 王国
 hd_historical_revolts.0005.t:0 "왕국의 거병"
 hd_historical_revolts.0005.desc:0 "한양 쪽에서 소식이 왔다. [hd_revolt_leader.GetName](이)가 이미 거병하여 그 칼끝이 곧장 진창을 향한다고 한다. 장막 안에서 다른 군무를 논하던 이들도 이 지명을 듣자 모두 잠시 말을 멈추었다.\n\n당신은 관중 서쪽의 지도와 서적을 가져와 길을 따라 양주까지 훑어보았다. 앞서의 그 전장이 정말 평정되었는지는 눈앞의 이 군대를 대신해 판단해 주지 않는다. 진창이 위협받는다면 군량 수송과 관문을 모두 다시 조사해 보고해야 한다.\n\n전령이 예전의 배치대로 명령을 전하면 되느냐고 묻는다. 당신은 지난날의 승전보로 답하지 않고, 먼저 이번 적군의 동정을 분명히 말하라고 했다. 관문을 지킬 수 있느냐는 오늘 그곳을 지키는 병사에게 달린 것이지, 어제 문서에 남은 명성에 달린 것이 아니다."
 # REV-06 187.6 张纯、张举
 hd_historical_revolts.0006.t:0 "장거가 천자를 칭하다"
 hd_historical_revolts.0006.desc:0 "비여 쪽에서 급보가 도착했다. 장거와 장순이 이미 오환과 결탁하여 군사를 일으켜 난을 일으켰다고 한다. 보고에는 한편으로 그들이 새로 세운 천자와 장군의 칭호가 나열되어 있었고, 한편으로는 변군이 어떻게 적을 맞아야 하느냐고 재촉하고 있었다.\n\n당신은 그 과장된 칭호들을 읽어 넘기고, 뒤에 적힌 길과 성읍에 시선을 멈추었다. 황제를 칭했다는 말은 하루 만에 퍼질 수 있지만, 정작 주군을 불안하게 하는 것은 깃발을 따라오는 기병, 그리고 원래 관망하던 자들이 이를 계기로 호응할지 여부다.\n\n문밖에 또 누군가 뵙기를 청하는데, 가져온 것은 역시 북쪽 소식이다. 당신은 서리에게 격문만 베끼지 말고 각처의 군정을 반드시 나누어 똑똑히 기록하라고 일렀다. 상대가 이미 무기를 들고 맞섰으니, 당신 또한 칭호를 두고만 그들과 다툴 수는 없다."
 # REV-07 188.3 休屠各胡
 hd_historical_revolts.0007.t:0 "휴도각호의 반란"
 hd_historical_revolts.0007.desc:0 "미직 일대의 동란이 마침내 전쟁으로 번졌다. 휴도각의 여러 부족이 [hd_revolt_leader.GetName](을)를 따라 거병하니, 병주의 급보가 한꺼번에 도착했다. 예전 회신에 적혀 있던 ‘길이 평온하다’는 말은 더 이상 믿을 수 없다.\n\n여러 부족의 행방을 하나하나 보고받고서야, 예전의 귀속만으로 누가 아직 명을 따를지 판단할 수 없음을 깨달았다. 어떤 부중은 여전히 제자리를 지키고, 어떤 부중은 이미 새 호령을 따라 움직였으며, 현서와 군중에서 보고한 이름도 서로 맞지 않을 수 있다.\n\n당신은 모호한 몇 곳에 동그라미를 치고 전령에게 다시 조사해 오라 했다. 지금 가장 시급한 것은 어느 길이 아직 다닐 수 있고 어디에 확실히 수비군이 있는지 밝히는 것이지, 여러 해 전의 안치 장부로 오늘의 변경을 보증하는 것이 아니다."
 # REV-08 188.6 马相
 hd_historical_revolts.0008.t:0 "익주 황건"
 hd_historical_revolts.0008.desc:0 "면죽 쪽의 급보는 처음에 황건이 무리를 모았다고 했으나, 뒤이어 온 문서에서는 이미 황제를 칭했다고 했다. [hd_revolt_leader.GetName]의 깃발이 촉 땅에 내걸렸고, 현읍과 길에서 오는 소식은 한 통 한 통 더 급해졌다.\n\n당신은 앞뒤의 두 급보를 대조해 보았다. 그 사이의 날짜는 그리 길지 않았지만, 정세는 이미 크게 바뀌어 있었다. 산천은 외부의 군대를 막을 수도 있지만, 주 안의 위급 보고를 늦게 만들기도 한다. 한 곳이 정말로 함락될 때쯤이면 이웃 고을에 여유 있게 준비할 틈이 남아 있지 않을지도 모른다.\n\n누군가 이것이 옛 황건 잔당이 이름만 바꾼 것인지 먼저 가려내라고 권한다. 당신은 그에게 먼저 병력의 행방부터 조사하라고 했다. 어느 깃발을 빌려 일어났든, 이제는 모두 당신에게 군사를 일으킨 적이다."
 # REV-09 196.1 严白虎
 hd_historical_revolts.0009.t:0 "엄백호의 둔취"
 hd_historical_revolts.0009.desc:0 "오군 각지에서 오는 보고마다 [hd_revolt_leader.GetName](을)를 언급했다. 원래 각자 오벽을 차지하고 있던 무리가 모여들고, 물길과 뭍길의 요충에 새 깃발이 세워졌으며, 오가는 상인들도 누구와 교섭해야 하는지 묻기 시작했다.\n\n여러 현의 회신을 살펴보니, 가장 모호하게 쓰인 것은 하필 성에서 먼 곳들이었다. 현성의 성문을 지키는 것과, 산과 물 사이의 길이 여전히 같은 호령을 따르게 하는 것은 별개의 일이다.\n\n당하에서 누군가 여전히 이 일을 시골의 둔취라 부르기에, 당신은 그에게 이미 도착한 전황 보고를 보게 했다. 강동의 귀속은 현서의 현판에만 쓰여 있는 것이 아니다. 왕래를 틀어쥐고 군사를 모을 수 있는 그자가 이미 당신과 이 땅을 다투고 있다."

 hd_historical_revolts.0010.t:0 "병위에 눌리다"
 hd_historical_revolts.0010.desc:0 "[hd_beigong_victor.GetName]의 사자가 장막 안으로 들어와 먼저 군중의 호령을 한 번 낭독한 뒤에야 당신의 거취를 말했다. 그는 당신이 귀부하여 앞으로 그를 주인으로 받들기를 요구했으며, 장황한 사양의 말을 더 들어 줄 생각은 없어 보였다.\n\n당신은 고개를 숙여 손 옆의 인신을 바라본다. 명위는 아직 남아 있으나, 그것으로 부릴 수 있는 사람은 이 명령을 경계 밖으로 막아 내기에 부족하다. 휘하에서는 아무도 말을 받지 않았고, 문서를 주고받는 발소리마저 한결 조용해졌다.\n\n이것은 후한 예물로 초대하는 맹약이 아니다. 당신은 내키지 않을 수 있으나, 그 내키지 않음으로 이미 눈앞에 닥친 병세를 바꿀 수는 없다. 지금 할 수 있는 일은 귀부의 조건을 잘 매듭지어, 앞으로도 경영할 수 있는 곳을 지키는 것이다."
 hd_historical_revolts.0010.a:0 "호령을 받들어 그의 절제를 따른다."

 hd_historical_revolts.a:0 "여러 군에 격문을 돌려 경계를 엄중히 하라."
