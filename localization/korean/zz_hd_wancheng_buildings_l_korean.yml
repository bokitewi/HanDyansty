 building_type_hd_wancheng_city_01:0 "완성"
 building_type_hd_wancheng_city_01_desc:0 "완은 남양군의 치소로, 성안에 제철과 상업이 번성하여 왕망 때 낙양, 한단, 임치, 성도와 함께 천하 오도로 꼽혔다. 광무황제가 남양에서 일어났으므로 군내에 공신과 외척의 집안이 많아 제향이라 불린다."
