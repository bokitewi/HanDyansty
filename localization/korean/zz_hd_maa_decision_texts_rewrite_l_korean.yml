 # ══════════════════════════════════════════════════════════════════
 # 汉晋春秋 · 兵制决议文本
 #
 # 范围：17 个「建立军制」决议 × 5 键 + 8 个「操练勋号兵」决议 × 4 键，另有共用提示 1 键
 #
 # 体例（2026-10-09 沉浸化重写）：
 #   · desc     —— 白话带古意，写此地何以出此兵、立制之意
 #   · tooltip  —— 一句概括所为之事；花费、条件、冷却由引擎显示，不在文案中复述
 #   · confirm  —— 短促决心语
 #   · effect   —— 立制后的非数值说明（兵源所出、随主头衔传承）
 # ══════════════════════════════════════════════════════════════════

 # ─────────────── 一、建立军制决议（17） ───────────────

 # 1. 幽州突骑
 hd_establish_youzhou_tuqi_decision:0 "유주 돌기 제도 확립"
 hd_establish_youzhou_tuqi_decision_desc:0 "유주는 북쪽으로 오환, 선비와 맞닿아 있어 탁군, 어양, 상곡 일대의 백성은 어려서부터 말 등에서 자라 변경의 길을 알고 돌격과 추격에 익숙하다. 일찍이 경엄이 광무제에게 어양과 상곡의 돌기를 동원하라 권하여 하북이 평정되었으니, 천하에서 정예 기병을 논할 때면 지금도 유주를 으뜸으로 꼽는다.\n\n다만 변군의 병사는 예로부터 모였다 흩어졌다 일정치 않아, 적을 맞아 급히 징발하면 사람과 말이 갖춰지지 않기 일쑤였다. 현지에서 군적을 편성하고 꼴과 곡식을 비축하며, 당신의 명망으로 변경의 호걸을 끌어모은다면 유주 돌기를 늘 상비할 수 있을 것이다."
 hd_establish_youzhou_tuqi_decision_tooltip:0 "유주에서 돌기 군적을 편성하여 모병에 대비한다"
 hd_establish_youzhou_tuqi_decision_confirm:0 "돌기의 군적을 편성하라!"
 hd_establish_youzhou_tuqi_decision_effect:0 "이제부터 유주 돌기를 당신의 [men_at_arms|E](으)로 모집할 수 있습니다. 이 병사들은 유주 출신이므로, 그곳에 당신이 직접 다스리는 현이 남아 있고 민심이 안정되어 있어야 모집과 증편이 가능합니다. 이 제도는 당신의 [primary_title|E]에 귀속되어 함께 계승됩니다."

 # 2. 白马义从
 hd_establish_baima_yicong_decision:0 "백마의종 제도 확립"
 hd_establish_baima_yicong_decision_desc:0 "우북평은 변새 아래에 자리하여 오환, 선비와 산을 사이에 두고 마주 본다. 군의 자제들은 어려서부터 말 위에서 활을 쏘며 사냥했고, 무리 지어 다니기를 좋아해 백마를 표지로 삼고 서로를 의종이라 불렀다.\n\n그들이 존경하는 것은 자신들을 이끌고 공을 세울 수 있는 호걸이지, 종이 한 장짜리 징발 문서가 아니다. 당신이 직접 나서서 자신의 명망으로 그 우두머리들과 교분을 맺고, 그들을 위해 군적을 편성하고 말먹이를 넉넉히 갖추어야만 백마의종이 부르면 곧 달려올 것이다."
 hd_establish_baima_yicong_decision_tooltip:0 "우북평의 백마의종을 위해 군적을 편성하여 모병에 대비한다"
 hd_establish_baima_yicong_decision_confirm:0 "의종의 군적을 정하라!"
 hd_establish_baima_yicong_decision_effect:0 "이제부터 백마의종을 당신의 [men_at_arms|E](으)로 모집할 수 있습니다. 이 병사들은 우북평 출신이므로, 그곳에 당신이 직접 다스리는 현이 남아 있고 민심이 안정되어 있어야 모집과 증편이 가능합니다. 이 제도는 당신의 [primary_title|E]에 귀속되어 함께 계승됩니다."

 # 3. 乌桓骑从
 hd_establish_wuhuan_qicong_decision:0 "오환 기종 제도 확립"
 hd_establish_wuhuan_qicong_decision_desc:0 "오환은 본래 동호의 후예로, 효무황제 때부터 상곡, 어양에서 요동에 이르는 변새 밖으로 옮겨 살며 물과 풀을 따라 거처했고, 남자들은 어려서부터 말을 잘 타고 활을 잘 쏘았다. 한나라가 북방에서 용병할 때면 늘 그 부중을 기종으로 모집했는데, 정찰과 교란, 패주하는 적의 추격에 이르기까지 힘을 다하지 않은 적이 없었다.\n\n오환의 여러 부족에는 저마다 대인이 있어, 예로부터 자신들이 믿고 따르는 사람의 말만 들었다. 당신이 사신을 보내 여러 부족의 대인과 두터운 교분을 맺고 징발의 약조를 정한 뒤, 군중에 그들을 위한 군량과 말먹이를 마련해 둔다면, 오환 기종은 언제든 변새를 나와 당신을 따를 것이다."
 hd_establish_wuhuan_qicong_decision_tooltip:0 "오환의 여러 부족과 징발의 약조를 맺어 기종 모병에 대비한다"
 hd_establish_wuhuan_qicong_decision_confirm:0 "오환과 약조를 맺어라!"
 hd_establish_wuhuan_qicong_decision_effect:0 "이제부터 오환 기종을 당신의 [men_at_arms|E](으)로 모집할 수 있습니다. 이 병사들은 상곡에서 요동에 이르는 오환의 옛 땅 출신이므로, 그곳에 당신이 직접 다스리는 현이 남아 있고 민심이 안정되어 있어야 모집과 증편이 가능합니다. 이 제도는 당신의 [primary_title|E]에 귀속되어 함께 계승됩니다."

 # 4. 冀州强弩
 hd_establish_jizhou_qiangnu_decision:0 "기주 강노 제도 확립"
 hd_establish_jizhou_qiangnu_decision_desc:0 "기주는 땅이 넓고 백성이 많으며, 군국마다 재관이 많아 대황, 궐장 같은 강노를 잘 다룬다. 이런 쇠뇌는 힘이 남다르고 여러 해 연습한 자가 아니면 당길 수 없으며, 쇠뇌수 한 줄이 번갈아 일제히 쏘면 돌격해 오는 철기도 막아 낼 수 있다. 일찍이 우후가 무도를 지킬 때, 먼저 작은 쇠뇌로 약한 척하여 강족을 가까이 끌어들인 뒤 강노로 일제히 쏘니 맞은 자는 모두 쓰러졌다. 쇠뇌의 장점은 오로지 호령에 달려 있다.\n\n기주에서 쇠뇌수의 군적을 편성하고 쇠뇌와 화살촉을 갖추며, 당신의 명망으로 현지에서 활을 잘 쏘는 노병을 초빙해 후진을 가르치게 한다면, 기주 강노가 대대로 이어질 것이다."
 hd_establish_jizhou_qiangnu_decision_tooltip:0 "기주 쇠뇌수의 군적을 편성하여 모병에 대비한다"
 hd_establish_jizhou_qiangnu_decision_confirm:0 "강노의 군적을 정하라!"
 hd_establish_jizhou_qiangnu_decision_effect:0 "이제부터 기주 강노를 당신의 [men_at_arms|E](으)로 모집할 수 있습니다. 이 병사들은 기주 출신이므로, 그곳에 당신이 직접 다스리는 현이 남아 있고 민심이 안정되어 있어야 모집과 증편이 가능합니다. 이 제도는 당신의 [primary_title|E]에 귀속되어 함께 계승됩니다."

 # 5. 先登锐士
 hd_establish_xiandeng_ruishi_decision:0 "선등 예사 제도 확립"
 hd_establish_xiandeng_ruishi_decision_desc:0 "성을 공격할 때마다 팔을 휘두르며 선등을 자청하는 이는 늘 있다. 그러나 화살과 돌이 쏟아질 때 정말로 그를 따라 성벽에 오르는 이는 대개 손꼽을 정도다. 기주는 민풍이 굳세고 사나우며, 향리의 호협들은 평소 죽음을 두려워하지 않는 것을 숭상하니, 선등을 뽑기에 딱 맞는 곳이다.\n\n그중에서 용감한 자를 골라 장부에 따라 대오를 편성하고, 같은 대오의 사람들이 서로 알고 생사를 맡기게 한다면 진퇴에 기댈 곳이 생긴다. 당신이 자신의 명망으로 이 제도를 보증한다면, 앞으로 상을 걸고 모집할 때 기주의 예사들이 소문을 듣고 모여들 것이다."
 hd_establish_xiandeng_ruishi_decision_tooltip:0 "기주에 선등 예사 제도를 세워 모병에 대비한다"
 hd_establish_xiandeng_ruishi_decision_confirm:0 "선등의 제도를 세워라!"
 hd_establish_xiandeng_ruishi_decision_effect:0 "이제부터 선등 예사를 당신의 [men_at_arms|E](으)로 모집할 수 있습니다. 이 병사들은 기주 출신이므로, 그곳에 당신이 직접 다스리는 현이 남아 있고 민심이 안정되어 있어야 모집과 증편이 가능합니다. 이 제도는 당신의 [primary_title|E]에 귀속되어 함께 계승됩니다."

 # 6. 青州兵
 hd_establish_qingzhou_bing_decision:0 "청주병 제도 확립"
 hd_establish_qingzhou_bing_decision_desc:0 "청주는 바다를 등진 옛 제나라 땅으로, 밭은 좁고 사람은 많아 흉년이 들면 유민이 넘쳐 난다. 향리의 젊은이들은 용맹을 좋아하고 싸움을 즐기며, 세상이 어지러울 때면 흔히 채를 짓고 서로를 지켰다. 호령은 뒤섞여 있어도 싸우려는 기세만은 다른 주에 뒤지지 않는다.\n\n이런 사람들은 흩어지면 도적이 되고 모이면 병사가 된다. 그 장정들을 거두어 대오를 편성하고, 누구의 호령을 따르고 어디서 군량을 받는지 알게 한다면, 청주의 무리는 쓸 만한 보병이 된다. 다만 그들이 기꺼이 응모하게 하려면, 무리를 복종시킬 만한 위망을 당신이 내보여야 한다."
 hd_establish_qingzhou_bing_decision_tooltip:0 "청주 장정의 군적을 편성하여 모병에 대비한다"
 hd_establish_qingzhou_bing_decision_confirm:0 "청주병의 군적을 정하라!"
 hd_establish_qingzhou_bing_decision_effect:0 "이제부터 청주병을 당신의 [men_at_arms|E](으)로 모집할 수 있습니다. 이 병사들은 청주 출신이므로, 그곳에 당신이 직접 다스리는 현이 남아 있고 민심이 안정되어 있어야 모집과 증편이 가능합니다. 이 제도는 당신의 [primary_title|E]에 귀속되어 함께 계승됩니다."

 # 7. 六郡良家子
 hd_establish_liujun_liangjiazi_decision:0 "육군 양가자 제도 확립"
 hd_establish_liujun_liangjiazi_decision_desc:0 "육군은 강호와 가까워 집집마다 싸움을 익히고, 자제들은 어려서부터 말 타고 활 쏘는 것을 업으로 삼는다. 조정이 우림과 기문의 숙위를 뽑을 때도 대부분 육군의 양가자를 취했다. 조충국도 일찍이 이 신분으로 우림에 보임되어 훗날 서강을 떨게 했다.\n\n양가의 자제는 출신이 깨끗하여 시정의 무뢰배와 같은 줄에 서려 하지 않으니, 부를 때에는 체면을 세워 주어야 한다. 당신이 직접 나서서 그들을 초빙하고, 군적을 편성하며 안장과 말, 활과 화살을 갖춰 준다면 육군의 자제들이 앞다투어 종군할 것이다."
 hd_establish_liujun_liangjiazi_decision_tooltip:0 "육군 양가자의 군적을 편성하여 모병에 대비한다"
 hd_establish_liujun_liangjiazi_decision_confirm:0 "양가자의 군적을 정하라!"
 hd_establish_liujun_liangjiazi_decision_effect:0 "이제부터 육군 양가자를 당신의 [men_at_arms|E](으)로 모집할 수 있습니다. 이 병사들은 육군 출신이므로, 그곳에 당신이 직접 다스리는 현이 남아 있고 민심이 안정되어 있어야 모집과 증편이 가능합니다. 이 제도는 당신의 [primary_title|E]에 귀속되어 함께 계승됩니다."

 # 8. 湟中义从
 hd_establish_huangzhong_yicong_decision:0 "황중 의종 제도 확립"
 hd_establish_huangzhong_yicong_decision_desc:0 "황중은 하황 사이에 자리하여 월지의 후예와 여러 강족이 섞여 산다. 그중 한나라에 귀부하여 대대로 군을 따라 싸운 호족 기병을 의종이라 부른다. 그들은 하황의 물과 풀이 있는 곳을 하나하나 알아, 어디서 말에게 물을 먹일 수 있고 어디서 한 부대의 인마가 돌 수 있는지를 지도보다도 더 잘 안다.\n\n의종호는 약속을 중히 여기고 체면도 중히 여긴다. 당신이 사람을 보내 여러 부족의 거수와 약조를 맺고 은상을 약속하며, 자신의 명망으로 보증한다면 황중 의종은 기꺼이 당신의 깃발을 따라 출정할 것이다."
 hd_establish_huangzhong_yicong_decision_tooltip:0 "황중 의종호와 종군의 약조를 맺어 모병에 대비한다"
 hd_establish_huangzhong_yicong_decision_confirm:0 "의종과 약조를 맺어라!"
 hd_establish_huangzhong_yicong_decision_effect:0 "이제부터 황중 의종을 당신의 [men_at_arms|E](으)로 모집할 수 있습니다. 이 병사들은 황중 출신이므로, 그곳에 당신이 직접 다스리는 현이 남아 있고 민심이 안정되어 있어야 모집과 증편이 가능합니다. 이 제도는 당신의 [primary_title|E]에 귀속되어 함께 계승됩니다."

 # 9. 板楯賨兵
 hd_establish_bandun_congbing_decision:0 "판순 종병 제도 확립"
 hd_establish_bandun_congbing_decision_desc:0 "파군 산중의 판순만은 나무판으로 방패를 삼았으며, 대대로 용맹하고 건장하기로 이름났다. 그들은 한나라에 종전을 바쳐 부역을 대신했으므로 종인이라고도 불린다. 조정은 강족의 난이 있을 때마다 그들의 군사를 자주 징발했는데, 험한 곳을 드나들기를 평지 걷듯 했다.\n\n판순만은 옛 은혜를 잊지 않지만 옛 원한도 기억하여, 조정이 박하게 대하면 일어나 난을 일으켰다. 당신이 후하게 위무하고 상을 내리며 명망으로 그 거수들과 교분을 맺는다면, 그 자제들을 종병으로 편성하여 언제든 징발할 수 있다."
 hd_establish_bandun_congbing_decision_tooltip:0 "파 땅의 판순만 군적을 편성하여 모병에 대비한다"
 hd_establish_bandun_congbing_decision_confirm:0 "종병의 군적을 정하라!"
 hd_establish_bandun_congbing_decision_effect:0 "이제부터 판순 종병을 당신의 [men_at_arms|E](으)로 모집할 수 있습니다. 이 병사들은 파 땅 출신이므로, 그곳에 당신이 직접 다스리는 현이 남아 있고 민심이 안정되어 있어야 모집과 증편이 가능합니다. 이 제도는 당신의 [primary_title|E]에 귀속되어 함께 계승됩니다."

 # 10. 无当飞军
 hd_establish_wudang_feijun_decision:0 "무당비군 제도 확립"
 hd_establish_wudang_feijun_decision_desc:0 "남중은 익주 남쪽 멀리에 있어 산은 높고 대숲은 깊으며, 장기의 안개가 일 년 내내 걷히지 않는다. 중원의 대군이 이곳에 오면 진조차 펼치지 못하기 일쑤다. 그러나 현지의 이인들은 양의 창자 같은 좁은 길에 익숙하여, 쇠뇌를 지고 벼랑을 오르며 나는 듯이 오간다.\n\n남중에서 그중 굳센 병졸을 골라 부대를 편성하고 군량과 무기를 준다면, 당신은 산속을 오가며 내달릴 수 있는 군대를 갖게 되어 험지를 만날 때마다 산을 바라보며 탄식할 필요가 없어진다. 다만 남중의 여러 부족은 예로부터 강자에게만 복종하니, 그들의 마음을 얻으려면 당신에게 충분한 위명이 있어야 한다."
 hd_establish_wudang_feijun_decision_tooltip:0 "남중에 무당비군 제도를 세워 모병에 대비한다"
 hd_establish_wudang_feijun_decision_confirm:0 "비군의 제도를 세워라!"
 hd_establish_wudang_feijun_decision_effect:0 "이제부터 무당비군을 당신의 [men_at_arms|E](으)로 모집할 수 있습니다. 이 병사들은 남중 출신이므로, 그곳에 당신이 직접 다스리는 현이 남아 있고 민심이 안정되어 있어야 모집과 증편이 가능합니다. 이 제도는 당신의 [primary_title|E]에 귀속되어 함께 계승됩니다."

 # 11. 五溪蛮兵
 hd_establish_wuxi_manbing_decision:0 "오계 만병 제도 확립"
 hd_establish_wuxi_manbing_decision_desc:0 "무릉군에는 다섯 갈래 시냇물이 뭇 산 사이를 흐르고, 산길은 시냇물을 따라 굽이져 산 하나만 사이에 두어도 건너편의 북소리가 들리지 않는다. 일찍이 복파장군 마원이 오계를 남정했을 때, 대군은 계곡에 갇혔고 그 자신도 군중에서 병사했다.\n\n계곡에서 여러 만족과 적이 되느니, 차라리 그 무리를 거두어 자기 편으로 쓰는 것이 낫다. 당신이 사신을 보내 여러 부족과 약조를 맺고, 위명으로 누르고 은상으로 달래며, 그 자제들을 군적에 편입한다면 오계 만병이 당신을 위해 길을 열 것이다."
 hd_establish_wuxi_manbing_decision_tooltip:0 "오계의 여러 부족과 징발의 약조를 맺어 만병 모병에 대비한다"
 hd_establish_wuxi_manbing_decision_confirm:0 "오계와 약조를 맺어라!"
 hd_establish_wuxi_manbing_decision_effect:0 "이제부터 오계 만병을 당신의 [men_at_arms|E](으)로 모집할 수 있습니다. 이 병사들은 무릉 오계 출신이므로, 그곳에 당신이 직접 다스리는 현이 남아 있고 민심이 안정되어 있어야 모집과 증편이 가능합니다. 이 제도는 당신의 [primary_title|E]에 귀속되어 함께 계승됩니다."

 # 12. 山越甲士
 hd_establish_shanyue_jiashi_decision:0 "산월 갑사 제도 확립"
 hd_establish_shanyue_jiashi_decision_desc:0 "강동의 단양, 회계, 예장 등 여러 군은 산줄기가 수백 리나 이어지고, 산중의 종부가 일족끼리 모여 살며 요역에 응하지 않고 조세를 바치지 않는다. 관군이 토벌하러 오면 깊은 산으로 물러나 험지에 의지해 지키고, 관군이 떠나면 다시 산을 나온다.\n\n산월 가운데에는 건장하고 싸움에 용감한 자가 매우 많다. 그 무리를 항복시켜 군적에 편입하고 갑옷을 입히고 병기를 쥐게 한다면, 숲과 산에서의 싸움에 익숙한 강군이 된다. 다만 항복한 무리의 마음은 한순간에 얻기 어려우니, 당신이 은혜와 위엄을 함께 쓰고 명망으로 그 종수들을 위압해야 한다."
 hd_establish_shanyue_jiashi_decision_tooltip:0 "산월 항복민의 군적을 편성하여 모병에 대비한다"
 hd_establish_shanyue_jiashi_decision_confirm:0 "산월의 군적을 정하라!"
 hd_establish_shanyue_jiashi_decision_effect:0 "이제부터 산월 갑사를 당신의 [men_at_arms|E](으)로 모집할 수 있습니다. 이 병사들은 강동 산월의 여러 군 출신이므로, 그곳에 당신이 직접 다스리는 현이 남아 있고 민심이 안정되어 있어야 모집과 증편이 가능합니다. 이 제도는 당신의 [primary_title|E]에 귀속되어 함께 계승됩니다."

 # 13. 丹阳精兵
 hd_establish_danyang_jingbing_decision:0 "단양 정병 제도 확립"
 hd_establish_danyang_jingbing_decision_desc:0 "단양군은 오와 월 사이에 자리하여 산은 많고 밭은 적다. 백성들은 산에 올라 구리를 캐고 숲에 들어 사냥하니, 하나같이 근골이 단단하다. 향리의 젊은이들은 목숨을 가벼이 여기고 의리를 중히 여겨, 평소에는 말 한마디가 어긋나면 칼을 뽑지만 전장에 나서면 누구보다 목숨을 건다.\n\n다만 단양병의 이름이 높다 한들, 이름 그 자체로 영루 하나를 지킬 수는 없다. 현지에 모병 제도를 세워 군적을 편성하고 상시 녹봉을 주며, 당신의 명망으로 향리의 호걸을 초빙해 그들을 거느리게 한다면, 앞으로 보병이 필요할 때 급히 사방에 사람을 구하러 다닐 필요가 없다."
 hd_establish_danyang_jingbing_decision_tooltip:0 "단양에 모병 제도를 세워 징발에 대비한다"
 hd_establish_danyang_jingbing_decision_confirm:0 "단양 모병제를 세워라!"
 hd_establish_danyang_jingbing_decision_effect:0 "이제부터 단양 정병을 당신의 [men_at_arms|E](으)로 모집할 수 있습니다. 이 병사들은 단양 출신이므로, 그곳에 당신이 직접 다스리는 현이 남아 있고 민심이 안정되어 있어야 모집과 증편이 가능합니다. 이 제도는 당신의 [primary_title|E]에 귀속되어 함께 계승됩니다."

 # 14. 涪陵连弩士
 hd_establish_fuling_liannushi_decision:0 "부릉 연노사 제도 확립"
 hd_establish_fuling_liannushi_decision_desc:0 "부릉은 파군 동남쪽에 자리하여 강물이 뭇 산 사이를 흐르고, 양안에는 벼랑길이 많다. 산민들은 대대로 숲속에서 쇠뇌를 당겨 사냥했으니, 그들 손에 들린 쇠뇌는 농부 손에 들린 호미처럼 익숙하다.\n\n다만 쇠뇌는 정교하여 숙련된 손이 돌보아야 하고, 화살촉은 빨리 닳아 장인이 끊임없이 만들어야 한다. 당신의 명망으로 활을 잘 쏘는 부릉의 산민을 모아 군적을 편성하고, 쇠뇌와 화살촉의 공급처까지 갖춘다면 이 연노사를 언제든 부릴 수 있다."
 hd_establish_fuling_liannushi_decision_tooltip:0 "부릉에 연노사 제도를 세워 모병에 대비한다"
 hd_establish_fuling_liannushi_decision_confirm:0 "연노의 제도를 세워라!"
 hd_establish_fuling_liannushi_decision_effect:0 "이제부터 부릉 연노사를 당신의 [men_at_arms|E](으)로 모집할 수 있습니다. 이 병사들은 부릉 출신이므로, 그곳에 당신이 직접 다스리는 현이 남아 있고 민심이 안정되어 있어야 모집과 증편이 가능합니다. 이 제도는 당신의 [primary_title|E]에 귀속되어 함께 계승됩니다."

 # 15. 羌骑
 hd_establish_qiang_qi_decision:0 "강기 제도 확립"
 hd_establish_qiang_qi_decision_desc:0 "금성과 농서의 산골짜기에는 여러 강족 종락이 저마다 한 곳을 차지하고 물과 풀을 따라 유목하며, 남자들은 누구나 말을 잘 탄다. 올 때는 흙먼지가 날리고 물러날 때는 먼 골짜기로 흩어지니, 뒤에서 쫓는 보병은 그들이 어디로 갔는지조차 모르기 일쑤다.\n\n여러 강족 종락과 종군의 약조를 맺고 은상을 약속하며 그 기사들을 군적에 편입한다면, 당신은 적과 속도를 겨룰 수 있는 기병을 갖게 된다. 강인은 용맹을 존중하고 신의도 중히 여기니, 이 일은 당신이 명망으로 보증해야 한다."
 hd_establish_qiang_qi_decision_tooltip:0 "농우의 여러 강족과 종군의 약조를 맺어 강기 모병에 대비한다"
