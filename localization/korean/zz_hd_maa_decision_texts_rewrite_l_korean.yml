 # 17. 藤甲兵
 hd_establish_tengjia_decision:0 "등갑병 제도 확립"
 hd_establish_tengjia_decision_desc:0 "영창은 남중의 서쪽 끝 멀리에 있으며, 본래 애뢰이의 옛 땅이다. 산에는 오래된 등나무가 많아 이인들이 이를 엮어 갑주를 만드는데, 이를 입고 밀림 속을 오가면 철갑을 걸친 중원의 병졸보다 훨씬 날렵하다.\n\n다만 기이한 갑옷 한 벌로 칼과 창을 막아 낼 수 있는 것은 아니다. 중요한 것은 갑옷을 입은 뒤에도 대오가 호령에 따라 나아가고 물러날 수 있느냐다. 영창에서 현지 이인을 뽑아 군적을 편성하고 등갑을 갖추며, 당신의 명망으로 여러 부족의 수령과 교분을 맺는다면 등갑병을 쓸 수 있다."
 hd_establish_tengjia_decision_tooltip:0 "영창에 등갑병 제도를 세워 모병에 대비한다"
 hd_establish_tengjia_decision_confirm:0 "등갑의 제도를 세워라!"
 hd_establish_tengjia_decision_effect:0 "이제부터 등갑병을 당신의 [men_at_arms|E](으)로 모집할 수 있습니다. 이 병사들은 영창 출신이므로, 그곳에 당신이 직접 다스리는 현이 남아 있고 민심이 안정되어 있어야 모집과 증편이 가능합니다. 이 제도는 당신의 [primary_title|E]에 귀속되어 함께 계승됩니다."

