 # ─────────────── 二、操练勋号兵决议（8） ───────────────

 # 1. 陷阵营
 hd_train_xianzhenying_decision:0 "함진영 훈련"
 hd_train_xianzhenying_decision_desc:0 "군중에 팔을 휘두르며 싸우겠다는 이는 결코 부족하지 않다. 부족한 것은 적진에 뛰어든 뒤에도 등 뒤의 호령을 들을 수 있는 사람이다. 중갑, 굳센 방패, 날카로운 칼은 모두 돈으로 마련할 수 있지만, 한 영의 무리를 칼날 앞에서 한 몸처럼 나아가고 물러나게 하려면 치군에 능한 장수가 밤낮으로 조련해야만 한다.\n\n이런 정병은 한 사람 한 사람 골라 손수 길러 내야 하며, 방을 붙여 모집한다고 채워지는 것이 아니다. 한번 해산하면 처음부터 다시 훈련해야 한다. 적진을 부수는 날카로운 칼날을 만들 뜻이 있다면, 먼저 그것을 위한 전량을 마련해야 한다."
 hd_train_xianzhenying_decision_tooltip:0 "휘하의 유능한 장수를 골라 함진영을 선발하고 훈련한다"
 hd_train_xianzhenying_decision_confirm:0 "함진의 용사를 뽑아 훈련하라!"

 # 2. 虎豹骑
 hd_train_hubaoqi_decision:0 "호표기 훈련"
 hd_train_hubaoqi_decision_desc:0 "패잔병을 추격하는 것과, 적진을 향해 말을 몰아 뛰어드는 것은 전혀 다른 일이다. 당신은 기병 가운데 가장 날랜 자들을 발탁해 따로 한 군을 편성하고, 사람과 말 모두 중갑을 입혀 결전의 때에 단숨에 적진을 깨뜨리려 한다.\n\n인마와 갑주는 수만 늘려서는 안 되고, 이들을 거느릴 이는 용맹하면서도 병법을 알고, 진에 임해 결코 물러서지 않는 효장이어야 한다. 이런 정예 기병은 사람을 골라 훈련할 수 있을 뿐 방을 붙여 늘릴 수는 없으며, 한번 흩어지면 다시 훈련해야 한다."
 hd_train_hubaoqi_decision_tooltip:0 "휘하의 효장을 골라 호표기를 선발하고 훈련한다"
 hd_train_hubaoqi_decision_confirm:0 "호표의 기병을 뽑아 훈련하라!"

 # 3. 白毦
 hd_train_baier_decision:0 "백이 훈련"
 hd_train_baier_decision_desc:0 "누구나 깃발 아래 서서 상을 받으려 하지만, 적군이 다가올 때도 그 자리에 버티고 물러서지 않는 자야말로 진정으로 쓸 만한 사람이다. 당신에게는 갑옷을 입은 친위대가 필요하다. 진의 발판을 굳게 지키고, 험한 길에서도 동료를 지킬 수 있는 이들이.\n\n이 일은 용감하고 굳세며 수비에 능한 장수에게 맡겨 군중에서 사람을 골라 조련하게 해야 한다. 친병은 많음보다 정예함이 귀하니, 하나하나 고를 수 있을 뿐 방을 붙여 모집할 수 없다. 한번 해산하면 처음부터 다시 훈련해야 한다."
 hd_train_baier_decision_tooltip:0 "휘하의 충성스럽고 용맹한 장수를 골라 백이 친병을 선발하고 훈련한다"
 hd_train_baier_decision_confirm:0 "백이 친병을 뽑아 훈련하라!"

 # 4. 解烦兵
 hd_train_jiefanbing_decision:0 "해번병 훈련"
 hd_train_jiefanbing_decision_desc:0 "급보가 도착하고서야 급히 병사를 모으면, 대오가 다 모이기도 전에 전선의 정세는 이미 바뀌어 있기 일쑤다. 당신은 위급할 때 사방을 구원하고, 숲과 늪 사이에서도 자유롭게 싸울 수 있는 해번병을 훈련하려 한다.\n\n이 군을 거느릴 이는 임기응변에 능하고 지휘를 잘하는 장수여야 하며, 전량도 따로 마련해야 한다. 이런 병사는 따로 조련할 수밖에 없고 평상시의 모병으로 늘릴 수 없으며, 흩어진 뒤에는 훗날 다시 훈련해야 한다."
 hd_train_jiefanbing_decision_tooltip:0 "휘하의 유능한 장수를 골라 해번병을 선발하고 훈련한다"
 hd_train_jiefanbing_decision_confirm:0 "해번의 병사를 뽑아 훈련하라!"

 # 5. 麴义先登
 hd_train_quyi_xiandeng_decision:0 "국의 선등 훈련"
 hd_train_quyi_xiandeng_decision_desc:0 "적 기병이 닥치면 쇠뇌수가 먼저 흐트러지니, 아무리 강한 쇠뇌라도 진흙 속에 쏘아 넣을 뿐이다. 당신은 국의의 선등법을 본떠, 기병을 맞아 진을 펼치고 호령이 떨어질 때까지 기다렸다 화살을 쏘는 부대를 훈련하려 한다. 앞줄은 방패 아래 엎드리고, 뒷줄은 강노로 받치는 것이다.\n\n이 일은 싸움에 용감하고 평원의 진전에 익숙한 장수에게 맡겨야 하며, 선발과 군기에 드는 비용도 따로 마련해야 한다. 이런 부대는 군호 하나 내건다고 늘 모집할 수 있는 것이 아니며, 한번 해산하면 처음부터 다시 훈련해야 한다."
 hd_train_quyi_xiandeng_decision_tooltip:0 "휘하의 유능한 장수를 골라 국의의 방법으로 선등을 선발하고 훈련한다"
 hd_train_quyi_xiandeng_decision_confirm:0 "선등의 용사를 뽑아 훈련하라!"

 # 6. 宿卫虎士
 hd_train_suwei_hushi_decision:0 "숙위 호사 훈련"
 hd_train_suwei_hushi_decision_desc:0 "문 앞의 위사들은 몸가짐이 엄정하지만, 당신은 정말로 자객이 뛰어든 뒤에야 그들이 얼마나 버틸 수 있는지 알게 되기를 원하지 않는다. 숙위의 무사는 비할 데 없이 용맹하고 건장해야 하며, 무엇보다 충심을 믿고 맡길 수 있어야 한다. 풍채가 우람하다는 것만으로 사람을 골라서는 안 된다.\n\n이 일은 용력이 남다르고 당신에게 충성을 다하는 맹사에게만 맡길 수 있으며, 그가 직접 골라 조련해야 한다. 이런 위사는 방을 붙여 모집할 수 없으며, 한번 해산하면 따로 골라 처음부터 훈련해야 한다."
 hd_train_suwei_hushi_decision_tooltip:0 "휘하의 충성스럽고 용맹한 무사를 골라 숙위 호사를 선발하고 훈련한다"
 hd_train_suwei_hushi_decision_confirm:0 "숙위 호사를 뽑아 훈련하라!"

 # 7. 南蛮象兵
 hd_train_nanman_xiangbing_decision:0 "남만 상병 훈련"
 hd_train_nanman_xiangbing_decision_desc:0 "전투 코끼리의 모습만으로도 적진을 술렁이게 하기에 충분하다. 그러나 정말 걱정해야 할 것은, 코끼리가 놀란 뒤 어느 쪽으로 달려가느냐다. 숙련된 조련사와 이치를 아는 장수가 없다면, 거대한 코끼리가 아무리 웅장해도 적에게 달려든다는 보장은 없다.\n\n남중 변경 밖의 여러 부족은 코끼리를 길들여 병사로 삼으니, 당신의 강역이 남중에 미치기만 하면 그곳에서 코끼리 떼와 조련사를 구할 수 있다. 이 군을 거느릴 이는 산지에 익숙하고 지휘에 능한 장수여야 한다. 이런 기병은 평상시의 규례대로 모집하여 늘릴 수 없으며, 한번 해산하면 처음부터 다시 훈련할 수밖에 없다."
 hd_train_nanman_xiangbing_decision_tooltip:0 "휘하의 유능한 장수를 골라 코끼리를 길들이고 병졸을 뽑아 남만 상병을 훈련한다"
 hd_train_nanman_xiangbing_decision_confirm:0 "코끼리를 길들여 병사를 훈련하라!"

 # 8. 白衣兵
 hd_train_baiyibing_decision:0 "백의병 훈련"
 hd_train_baiyibing_decision_desc:0 "적이 깃발을 보고서야 대군이 왔음을 안다면 이미 늦다. 누군가 먼저 가까이 다가가 길과 퇴로를 정탐해 둔다면, 두 군대가 맞붙을 때 곳곳에서 제압당하지는 않을 것이다. 당신은 숲과 산속에서 추적하고 요격하며 엄호하는 일을 전담할 백의병을 훈련하려 한다.\n\n이 군을 거느릴 이는 기지와 지모가 풍부하고 기습에 익숙한 장수여야 한다. 바라는 것은 기세 등등한 대부대가 아니라, 제때 도착하고 깔끔하게 물러날 수 있는 한 부대의 인마다. 이런 병사는 따로 골라 조련할 수밖에 없고 평상시의 모병으로 늘릴 수 없으며, 한번 흩어지면 처음부터 다시 훈련해야 한다."
 hd_train_baiyibing_decision_tooltip:0 "휘하의 유능한 장수를 골라 백의병을 선발하고 훈련한다"
 hd_train_baiyibing_decision_confirm:0 "백의의 병사를 뽑아 훈련하라!"
