 # 16. 并州边骑
 hd_establish_bingzhou_bianqi_decision:0 "병주 변기 제도 확립"
 hd_establish_bingzhou_bianqi_decision_desc:0 "안문, 운중, 삭방 등 여러 군은 모두 병주의 최북단에 있어 봉수대가 서로 바라보고, 호족 기병이 수시로 변새를 침범한다. 변군의 자제들은 어려서부터 봉화의 경보를 듣고 자라 말 타기를 걷는 것처럼 하며, 언제 말을 몰아 질주하고 언제 고삐를 당겨 힘을 비축해야 하는지 안다.\n\n변기를 상설 제도에 편입한다면, 대군이 행군할 때 매사에 보병대가 도착하기를 기다려야만 소식을 얻는 일은 없을 것이다. 모병과 군량, 군적은 모두 누군가 오래도록 관리해야 하며, 한때의 큰 상으로 병사를 모으는 것만으로는 안 된다. 당신의 명망으로 변군의 호걸을 초빙하고 전량을 떼어 규정을 세워야 병주 변기를 늘 쓸 수 있다."
 hd_establish_bingzhou_bianqi_decision_tooltip:0 "병주 변군 기사의 군적을 편성하여 모병에 대비한다"
