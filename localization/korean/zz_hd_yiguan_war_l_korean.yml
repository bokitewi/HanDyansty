l_korean:
 # 衣冠南渡·战争侧本地化（宣战理由、汉人侧决议、hd_yiguan.4101–4149 事件、战争侧弹窗与提示）
 # 兵名 hd_yiguan_uprising_army、hd_yiguan_liumin_army 在 zz_hd_yiguan_l_simp_chinese.yml（旧事件改编模块），此处不重复

 ############################
 # 宣战理由：义军起义
 ############################
 hd_yiguan_uprising_cb:0 "义军起义"
 hd_yiguan_uprising_cb_desc:0 "沦陷区的汉人义军据城起事，夺取所争郡县，自立一方。"
 HD_YIGUAN_UPRISING_WAR_NAME:0 "[ATTACKER.GetShortUIName]举义"
 hd_yiguan_uprising_victory_desc:0 "[attacker.GetShortUIName|U]据有所争郡县，自立一方，改行[GetGovernment('celestial_government').GetName]。"
 hd_yiguan_uprising_white_peace_desc:0 "义军罢兵，各自散去。"
 hd_yiguan_uprising_defeat_desc:0 "义军溃散，所争郡县仍归[defender.GetShortUIName]。"
 hd_yiguan_uprising_invalidated_desc:0 "[war.GetName]已结束：所争郡县已不在[defender.GetShortUIName]治下。"

 ############################
 # 宣战理由：北伐
 ############################
 hd_yiguan_beifa_cb:0 "$HD_YIGUAN_BEIFA_CB_NAME$"
 hd_yiguan_beifa_cb_desc:0 "王师北指，收复北方的一州。获胜则夺取守方在该州的全部郡县，州内华夏之县得「王师北定」。只在衣冠南渡的冲突期，由南方政权发动。"
 HD_YIGUAN_BEIFA_CB_NAME:0 "北伐"
 HD_YIGUAN_BEIFA_WAR_NAME:0 "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')][ATTACKER.GetPrimaryTitle.GetAdjective]北伐[TITLE.GetBaseName]"
 HD_YIGUAN_BEIFA_WAR_NAME_BASE:0 "[ATTACKER.GetPrimaryTitle.GetAdjective]北伐"
 hd_yiguan_beifa_cb_victory_desc_attacker:0 "王师北定：你夺取了[defender.GetShortUIName]在所争之州的全部郡县，州内华夏之县得「王师北定」。"
 hd_yiguan_beifa_cb_victory_desc:0 "[attacker.GetShortUIName|U]北伐得胜，夺取[defender.GetShortUIName]在所争之州的全部郡县。"
 hd_yiguan_beifa_cb_white_peace_desc:0 "两军罢兵，北伐无功而还。"
 hd_yiguan_beifa_cb_defeat_desc_defender:0 "你击退了北伐之师，[attacker.GetShortUIName]须向你支付赔款。"
 hd_yiguan_beifa_cb_defeat_desc:0 "北伐失利，[attacker.GetShortUIName]须向[defender.GetShortUIName]支付赔款。"

 ############################
 # 宣战理由：讨胡收复
 ############################
 hd_yiguan_taohu_cb:0 "$HD_YIGUAN_TAOHU_CB_NAME$"
 hd_yiguan_taohu_cb_desc:0 "北方汉人出兵讨胡，收复一个接壤的郡。获胜则夺取守方在该郡的全部县，得威望与宗族威望，郡内华夏之县得「王师北定」，并免费招集一次流民。只在衣冠南渡的冲突期发动。"
 HD_YIGUAN_TAOHU_CB_NAME:0 "讨胡收复"
 HD_YIGUAN_TAOHU_WAR_NAME:0 "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')][ATTACKER.GetPrimaryTitle.GetAdjective]收复[TITLE.GetBaseName]"
 HD_YIGUAN_TAOHU_WAR_NAME_BASE:0 "[ATTACKER.GetPrimaryTitle.GetAdjective]讨胡"
 hd_yiguan_taohu_cb_victory_desc_attacker:0 "你收复了所争之郡，[defender.GetShortUIName]在郡内的县尽归于你，流民闻讯来归。"
 hd_yiguan_taohu_cb_victory_desc:0 "[attacker.GetShortUIName|U]收复所争之郡。"
 hd_yiguan_taohu_cb_white_peace_desc:0 "两军罢兵，所争之郡仍归[defender.GetShortUIName]。"
 hd_yiguan_taohu_cb_defeat_desc_defender:0 "你击退了[attacker.GetShortUIName]，守住了所争之郡。"
 hd_yiguan_taohu_cb_defeat_desc:0 "[attacker.GetShortUIName|U]讨胡不克，须向[defender.GetShortUIName]支付赔款。"

 ############################
 # 宣战理由：起兵北还
 ############################
 hd_yiguan_beihuan_cb:0 "$HD_YIGUAN_BEIHUAN_CB_NAME$"
 hd_yiguan_beihuan_cb_desc:0 "南渡的侨姓士族率部曲打回故土，夺取所择之州中守方的郡县，自立一方。"
 HD_YIGUAN_BEIHUAN_CB_NAME:0 "起兵北还"
 HD_YIGUAN_BEIHUAN_WAR_NAME:0 "[ATTACKER.GetShortUIName]北还[TITLE.GetBaseName]"
 HD_YIGUAN_BEIHUAN_WAR_NAME_BASE:0 "[ATTACKER.GetShortUIName]北还"
 hd_yiguan_beihuan_cb_victory_desc_attacker:0 "你打回了故土，据有[defender.GetShortUIName]在所争之州的郡县，从此自立一方，改行[GetGovernment('celestial_government').GetName]。"
 hd_yiguan_beihuan_cb_victory_desc:0 "[attacker.GetShortUIName|U]打回故土，据有所争之州的郡县，自立一方。"
 hd_yiguan_beihuan_cb_white_peace_desc:0 "北还之师罢兵，终未能踏上故土。"
 hd_yiguan_beihuan_cb_defeat_desc_defender:0 "你击溃了[attacker.GetShortUIName]的北还之师。"
 hd_yiguan_beihuan_cb_defeat_desc:0 "北还之师溃败，[attacker.GetShortUIName]须向[defender.GetShortUIName]支付赔款。"

 ############################
 # 宣战理由：举兵起义
 ############################
 hd_yiguan_qiyi_cb:0 "举兵起义"
 hd_yiguan_qiyi_cb_desc:0 "沦陷区的汉人封臣不堪胡人领主驱使，举兵自立。"
 HD_YIGUAN_QIYI_WAR_NAME:0 "[ATTACKER.GetPrimaryTitle.GetBaseName]举义"
 hd_yiguan_qiyi_cb_victory_desc_attacker:0 "你摆脱了[defender.GetShortUIName]，从此自立一方。"
 hd_yiguan_qiyi_cb_victory_desc:0 "[attacker.GetShortUIName|U]摆脱[defender.GetShortUIName]，自立一方。"
 hd_yiguan_qiyi_cb_white_peace_desc:0 "两军罢兵，[attacker.GetShortUIName]仍奉[defender.GetShortUIName]为主。"
 hd_yiguan_qiyi_cb_defeat_desc_defender:0 "你平定了[attacker.GetShortUIName]的起义，并将其下狱。"
 hd_yiguan_qiyi_cb_defeat_desc:0 "起义失败，[attacker.GetShortUIName]被[defender.GetShortUIName]下狱。"
 hd_yiguan_qiyi_army:0 "起义军"

 ############################
 # 补立郡号：动态郡号名（创建时取都城县名，先例原版 NEW_CREATED_TITLE_NAME）
 ############################
 hd_yiguan_war_dyn_duchy_name:0 "[hd_yiguan_duchy_county.GetBaseNameNoTierNoTooltip]"

 ############################
 # 战争侧弹窗与提示
 ############################
 hd_yiguan_beifa_won_toast:0 "北伐告捷"
 hd_yiguan_beifa_won_toast_desc:0 "[hd_yiguan_toast_attacker.GetShortUIName|U]北伐得胜，收复[hd_yiguan_toast_title.GetBaseName]。"
 hd_yiguan_taohu_liumin_tt:0 "流民闻讯来归：免费招集一次流民（不计冷却）"
 hd_yiguan_qiyi_helper_joined_toast:0 "援军将至"
 hd_yiguan_qiyi_helper_joined_toast_desc:0 "[hd_yiguan_qy_helper.GetShortUIName|U]应你之请，发兵相援。"
 hd_yiguan_qiyi_helper_declined_toast:0 "求援无果"
 hd_yiguan_qiyi_helper_declined_toast_desc:0 "[hd_yiguan_qy_helper.GetShortUIName|U]按兵不动，你只能独力支撑。"

 ############################
 # 决议：举兵起义
 ############################
 hd_yiguan_jubing_qiyi_decision:0 "举兵起义"
 hd_yiguan_jubing_qiyi_decision_desc:0 "胡骑踞我乡土，赋役苛重，衣冠扫地。与其俯首终老，不如揭竿而起，据城自守，传檄四方，以待王师。\n\n#weak 冲突期花费威望100；其他阶段花费威望200和金币100；领主或最高宗主推行胡化期间减半。冷却10年。#!"
 hd_yiguan_jubing_qiyi_decision_tooltip:0 "对你的胡人领主发动独立战争，并邀邻近的汉人政权出兵相助"
 hd_yiguan_jubing_qiyi_decision_confirm:0 "举义旗！"
 hd_yiguan_qiyi_liege_hu_tt:0 "你的最高宗主是胡人（汉化王朝不算）"
 hd_yiguan_qiyi_direct_vassal_tt:0 "你将先脱离直属领主、改为直接臣属胡人最高宗主，随即与之决裂"
 hd_yiguan_qiyi_not_at_war_tt:0 "你没有在与领主交战"
 hd_yiguan_qiyi_one_war_tt:0 "你的领主和最高宗主眼下都没有在应付另一场义军、举兵起义或起兵北还之战"
 hd_yiguan_jubing_qiyi_decision_effect_tt:0 "对[hd_yiguan_qy_def.GetShortUIName]发动#V 举兵起义#!战争；获胜则完全独立"
 hd_yiguan_jubing_qiyi_decision_army_tt:0 "得起义军#V [GetPlayer.MakeScope.ScriptValue('hd_yiguan_qiyi_army_value')|0]#!人（500 + 每个直辖县100，上限3000；不可继承）"
 hd_yiguan_jubing_qiyi_decision_help_tt:0 "邀请与你接壤的最强汉人政权出兵相助"

 ############################
 # 决议：招集流民
 ############################
 hd_yiguan_zhaoji_liumin_decision:0 "招集流民"
 hd_yiguan_zhaoji_liumin_decision_desc:0 "北土丧乱，流民扶老携幼，转徙道路。若开仓授田，招之来归，既可充实户口，亦可编为部伍。\n\n#weak 冷却5年。讨胡收复获胜时另免费招集一次。#!"
 hd_yiguan_zhaoji_liumin_decision_tooltip:0 "收拢流民：直辖县得「流民归附」，并得一支可继承的流民军"
 hd_yiguan_zhaoji_liumin_decision_confirm:0 "开仓招抚"
 hd_yiguan_zhaoji_liumin_decision_effect_tt:0 "#V [GetPlayer.MakeScope.ScriptValue('hd_yiguan_liumin_level_value')|0]#!个直辖县（优先发展度低者）得「流民归附」，持续10年（发展度增长+20%，征兵+10%）"
 hd_yiguan_zhaoji_liumin_decision_army_tt:0 "得流民军#V [GetPlayer.MakeScope.ScriptValue('hd_yiguan_liumin_army_value')|0]#!人（每级威望600人；可继承）"

 ############################
 # 决议：归附南朝
 ############################
 hd_yiguan_guifu_nanchao_decision:0 "归附南朝"
 hd_yiguan_guifu_nanchao_decision_desc:0 "孤城悬于胡尘之中，独力难以久支。南朝犹奉正朔，若奉表称藩，既得声援，亦全名节。"
 hd_yiguan_guifu_nanchao_decision_tooltip:0 "向一个与你接壤、爵位更高的南方政权称臣"
 hd_yiguan_guifu_nanchao_decision_confirm:0 "奉表称藩"
 hd_yiguan_guifu_not_at_war_tt:0 "你眼下不在战争中"
 hd_yiguan_guifu_no_lord_tt:0 "有一个与你接壤、实领爵位高于你、未与你交战的南方政权"
 hd_yiguan_guifu_nanchao_decision_effect_tt:0 "向[hd_yiguan_gf_lord.GetShortUIName]宣誓效忠，成为其封臣；对方不需同意，只会收到通知"

 ############################
 # 决议：还都旧京（键自旧本地化移来）
 ############################
 hd_yiguan_return_capital_decision:0 "还都旧京"
 hd_yiguan_return_capital_decision_desc:0 "旧都已复，宗庙陵寝都在北方。还都旧京，方能告慰列祖列宗，也让天下知道正朔所在。"
 hd_yiguan_return_capital_decision_tooltip:0 "迁都于洛阳或长安"
 hd_yiguan_return_capital_decision_confirm:0 "还于旧都！"
 hd_yiguan_return_capital_hold_tt:0 "你须直辖洛阳或长安"
 hd_yiguan_return_capital_already_tt:0 "你的都城尚不在洛阳或长安"

 ############################
 # 事件 4101 起义求援
 ############################
 hd_yiguan.4101.t:0 "北方义旗"
 hd_yiguan.4101.desc:0 "[hd_yiguan_qy_rebel.GetTitledFirstName]的使者是夜里到的，衣上还沾着北地的尘土。他说主公已在[hd_yiguan_qy_rebel.GetPrimaryTitle.GetBaseName]举兵，不再奉[hd_yiguan_qy_def.GetShortUIName]的号令；如今城下胡骑渐集，独力难支，恳请我发兵相援，与义军首尾相应。\n\n帐中诸将意见不一。有人说唇亡齿寒，义军若败，胡人下一个便要找上我们；也有人说兵者凶器，替旁人火中取栗，未必值得。使者伏在地上不起，只等我一句话。"
 hd_yiguan.4101.a:0 "义不容辞，发兵相援！"
 hd_yiguan.4101.a.tt:0 "你作为攻方加入[hd_yiguan_qy_rebel.GetShortUIName]的起义战争"
 hd_yiguan.4101.b:0 "时机未至，按兵不动。"

 ############################
 # 事件 4110 归附南朝·受降
 ############################
 hd_yiguan.4110.t:0 "北人来归"
 hd_yiguan.4110.desc:0 "[hd_yiguan_gf_vassal.GetTitledFirstName]的表文送到了。他在北方孤守多年，四面皆是胡骑，如今奉上版籍，愿为藩屏，受我节度。\n\n朝中有人说北人反复，不可轻信；也有人说北土故地，正可借此重归版图。表文末尾写着：「愿王师早日北指，臣当执鞭前驱。」"
 hd_yiguan.4110.a:0 "优诏褒答，以示怀远。"
 hd_yiguan.4110.a.tt:0 "[hd_yiguan_gf_vassal.GetShortUIName]已成为你的封臣"
