l_korean:
 # ══════════════════════════════════════════════════════════════════
 # 汉晋春秋 · 兵戈志 —— 禁军兵士与重建决议 本地化（hjbz_）
 #
 # 计 18 条：兵士 4×2（名 + 描述）＋ 决议 2×5（名/述/提示/确认/效果）
 # 文风：参《后汉书》—— 用典取自《百官志》《光武帝纪》《皇后纪》
 # ══════════════════════════════════════════════════════════════════

 # ────────────────────── 兵士 · 羽林 ──────────────────────

 hjbz_yulin_wei:0 "우림위"
 hjbz_yulin_wei_flavor:0 "#F 우림이란 「나라의 날개가 되어 숲처럼 성하다」는 뜻을 취한 것이다. 한 무제가 처음 건장영기를 두었다가 뒤에 우림으로 이름을 바꾸었고, 또 종군하다 전사한 자의 자손을 우림에서 길러 다섯 가지 병기를 가르치니 이를 우림고아라 불렀다. 이들은 무거운 갑옷을 입고 방패를 들고 나아가 방진을 이루며, 내달리는 것을 능사로 삼지 않고 흔들리지 않는 것을 공으로 삼는다.#!"

 hjbz_yulin_qi:0 "우림기"
 hjbz_yulin_qi_flavor:0 "#F 우림에는 예로부터 기병이 있어 낭관과 함께 숙위를 나누어 맡았다. 모두 양가의 자제 가운데 재주와 힘이 남다른 자를 뽑았으며, 말 타기에 익숙하고 궁궐을 떠나지 않는다. 평소에는 천자의 수레를 시종하고, 일이 생기면 중군의 날개가 된다. 말에 굳이 무거운 갑옷을 입히지 않으나 진퇴에 절도가 있어, 그저 빠르기만으로 기세를 얻는 것이 아니다.#!"

 # ──────────────────── 兵士 · 执金吾 ────────────────────

 hjbz_zhijinwu_jishi:0 "집금오 지극사"
 hjbz_zhijinwu_jishi_flavor:0 "#F 집금오는 궁 밖의 경계를 맡고 뜻밖의 수재와 화재를 관장하며, 한 달에 세 번 궁 밖을 돌고 병기도 함께 주관한다. 그 휘하에 창을 든 무사들이 있어 길가에 늘어서니, 이로써 변고에 대비하고 도읍을 엄숙히 한다. 이들은 야전의 병졸은 아니나, 도성에 일이 생기면 창을 들고 거리 한복판에 버티고 서서 길 가는 이들이 감히 방자하게 굴지 못하게 한다.#!"

 hjbz_zhijinwu_tiqi:0 "집금오 제기"
 hjbz_zhijinwu_tiqi_flavor:0 "#F 제란 붉은빛이 도는 누런색이다. 집금오에는 제기 2백 명이 속해 있었는데, 복색이 특이하여 다른 군대와 구별되었다. 광무제는 미천하던 시절 일찍이 「벼슬을 하려면 집금오가 되어야 한다」고 탄식했다. 그 수레와 복식과 행렬이 길을 환히 빛내니, 뭇 관료 가운데 가장 장대했다. 그러나 그 직무는 순찰하며 폭력을 막는 데 있지, 적의 예봉을 꺾고 적진을 함락하는 데 있지 않다.#!"

 # ────────────── 决议一 · 重建羽林军 ──────────────

 hjbz_rebuild_yulin_decision:0 "우림군 재건"
 hjbz_rebuild_yulin_decision_desc:0 "우림의 설치는 본디 궁궐을 숙위하고 변고에 대비하기 위함이었습니다. 무제께서는 종군하다 전사한 자의 자손을 거두어 길러 다섯 가지 병기를 가르치시고 대대로 이어 온 업을 잃지 않게 하셨으며, 선제와 원제 이후로는 마침내 궁중의 정예 부대가 되었습니다. 지금 그 이름은 남아 있으나 제도는 오래전에 폐하여져, 숙위의 직책을 혹은 다른 군대에 맡기기도 하니, 이는 근본을 중히 여기는 도리가 아닙니다.\n\n신이 듣건대 나라를 다스리는 자에게는 반드시 날개가 있어야 하니, 이는 숲에 나무가 있어 서로 붙들어 준 뒤에야 무성해지는 것과 같습니다. 만약 옛 제도를 되살려 양가의 자제 가운데 재주와 힘이 남다른 자를 뽑아 두 군으로 나눈다면, 하나는 무거운 갑옷을 입고 방패를 들어 방진을 이루어 궁궐을 지키고, 하나는 말 타기에 익숙하고 활을 잘 쏘아 천자의 수레를 시종하며 추격에 대비할 것입니다. 이 둘이 함께 선다면 중군은 믿을 곳이 생기고, 도성의 무리는 감히 가벼이 움직이지 못할 것입니다.\n\n그러나 이는 종이 한 장의 명령으로 이룰 수 있는 일이 아닙니다. 군적과 갑옷, 병기, 보급에 모두 정해진 규정이 있어야 하며, 이를 주관할 사람 또한 적임자를 얻어야 합니다. 바라옵건대 폐하께서는 먼저 그 제도를 세우시고, 그 뒤에 천천히 병력을 논의하시옵소서."

 hjbz_rebuild_yulin_decision_tooltip:0 "우림군 제도를 재건합니다. 제도를 세운 뒤에는 #Y 우림위#!와 #Y 우림기#!를 모집할 수 있습니다.\n\n#EMP 먼저 권병을 갖추어야 함:#! 중화 패권국의 주인으로서 권력을 자신에게 집중해야 합니다. 천조 관료제가 「제한적 행정」 이상, 군제가 「중외분장제」 이상이어야 하며, 위신 3단계, 영향력 3단계, 정통성 7단계를 모두 갖추어야 합니다.\n\n또한 안팎에 틈이 없어야 함: 강력한 봉신들이 모두 충성을 바쳐야 하며(의견이 모두 50 초과), 사례의 권병은 자신의 손에 있거나 그 마음을 얻고 있어야 합니다. 공동 통치자와 권력을 나누고 있다면, 그가 두 마음 없이 충성하거나 권력의 저울이 한쪽으로 기울지 않아야 합니다."

 hjbz_rebuild_yulin_decision_confirm:0 "국고 500과 위신 1000을 바쳐 제도를 세웁니다. 이 결단으로 즉시 연대를 얻지는 않습니다."
 hjbz_rebuild_yulin_decision_effect:0 "우림군 제도가 세워졌습니다. 이제부터 우림위와 우림기를 모집할 수 있습니다."

 # ────────────── 决议二 · 重建执金吾 ──────────────

 hjbz_rebuild_zhijinwu_decision:0 "집금오 재건"
 hjbz_rebuild_zhijinwu_decision_desc:0 "집금오는 한 사람으로 질록은 중이천석이며, 궁 밖의 경계를 맡고 뜻밖의 수재와 화재를 관장합니다. 한 달에 세 번 궁 밖을 돌고 병기도 주관합니다. 그 휘하에는 제기 2백 명과 지극 520명이 있어, 수레와 복식과 행렬이 길을 환히 빛냈습니다. 광무제께서 미천하실 때 일찍이 「벼슬을 하려면 집금오가 되어야 한다」고 탄식하셨으니, 그 성대함을 알 만합니다.\n\n도성이 여러 번 바뀐 뒤로 이 관직은 빈 이름만 남았고, 궁 밖의 경계는 통솔하는 이가 없습니다. 무릇 궁궐의 엄중함은 담장의 높이에 있지 않고, 순찰할 사람이 있고 변고에 대비가 있는 데 있습니다. 만약 그 직을 다시 두어 재주와 힘 있는 무사를 뽑아 창을 들고 길에 늘어서게 하고, 따로 제기로 거리를 순찰하게 한다면, 화재의 경보와 골목의 간악함이 모두 돌아갈 곳이 생길 것입니다.\n\n그러나 이 제도는 먼 곳에 있는 이가 멀리서 맡아 다스릴 수 있는 것이 아닙니다. 반드시 도성 안, 천자의 수레 아래에서라야 시행할 수 있습니다. 낙양과 장안은 예로부터 모두 제도였으니, 그 거처를 살펴 세워야 할 것입니다."

 hjbz_rebuild_zhijinwu_decision_tooltip:0 "집금오 제도를 재건합니다. 제도를 세운 뒤에는 #Y 집금오 지극사#!와 #Y 집금오 제기#!를 모집할 수 있습니다.\n\n#EMP 먼저 근본을 굳혀야 함:#! 중화 패권국의 주인으로서 #Y 낙양#! 또는 #Y 장안#!에 도읍해야 하며, 도성의 장악력이 80을 넘어야 합니다. 위신 2단계와 영향력 2단계를 모두 갖추어야 합니다.\n\n또한 권병이 자신에게 있어야 함: 공동 통치자와 권력을 나누고 있다면, 그가 두 마음 없이 충성하거나 권력의 저울이 한쪽으로 기울지 않아야 합니다."
 hjbz_rebuild_zhijinwu_decision_confirm:0 "금화 200과 위신 300을 바쳐 제도를 세웁니다. 이 결단으로 즉시 연대를 얻지는 않습니다."
 hjbz_rebuild_zhijinwu_decision_effect:0 "집금오 제도가 세워졌습니다. 이제부터 집금오 지극사와 집금오 제기를 모집할 수 있습니다."
