 # Shared descriptions for strategic and ordinary new chains
 building_hd_pass_p_4628_01_desc:0 "상산은 본래 항산이라 불렸으나, 효문황제의 휘를 피하여 이름을 바꾸었다. 관성은 항산 남쪽의 골짜기 사이에 있으며, 북쪽으로는 대군과 통하고 동쪽으로 내려가면 곧 기주 평원이다."
 building_hd_pass_p_4628_02_desc:0 "$building_hd_pass_p_4628_01_desc$"
 building_hd_pass_p_4628_03_desc:0 "$building_hd_pass_p_4628_01_desc$"
 building_hd_pass_p_4628_04_desc:0 "$building_hd_pass_p_4628_01_desc$"
 building_hd_pass_p_638_01_desc:0 "진류군 중모 일대에는 예로부터 유관이라는 이름이 있었으며, 전국 시대 위나라의 변경 관문이었다고 전한다. 지금은 관새가 폐허가 되어 길가에 흙 보루만 남았지만, 낙양과 진류 사이를 오가는 거마는 여전히 이곳을 지난다."
 building_hd_pass_p_638_02_desc:0 "$building_hd_pass_p_638_01_desc$"
 building_hd_pass_p_638_03_desc:0 "$building_hd_pass_p_638_01_desc$"
 building_hd_pass_p_638_04_desc:0 "$building_hd_pass_p_638_01_desc$"
 building_hd_pass_p_3734_01_desc:0 "촉군 엄도 서쪽의 산중에 영관도가 있다. 효무황제 때 사마상여가 서남이에 사신으로 가서 영관도를 개통하고 손수 위에 다리를 놓아 곧장 공도에 닿게 했다. 관 밖은 곧 공, 작 등 여러 부족이 모여 사는 땅이다."
 building_hd_pass_p_3734_02_desc:0 "$building_hd_pass_p_3734_01_desc$"
 building_hd_pass_p_3734_03_desc:0 "$building_hd_pass_p_3734_01_desc$"
 building_hd_pass_p_3734_04_desc:0 "$building_hd_pass_p_3734_01_desc$"
 building_hd_pass_p_3636_01_desc:0 "한중군 동부의 뭇 산 사이에 꼭대기가 네모난 산봉우리 하나가 길가에 우뚝 서 있다. 관성은 산에 기대어 쌓였으며, 한중에서 동쪽 상용으로 가고 서쪽 남정으로 드는 산길을 틀어막고 있다."
 building_hd_pass_p_3636_02_desc:0 "$building_hd_pass_p_3636_01_desc$"
 building_hd_pass_p_3636_03_desc:0 "$building_hd_pass_p_3636_01_desc$"
 building_hd_pass_p_3636_04_desc:0 "$building_hd_pass_p_3636_01_desc$"
 building_hd_pass_p_3116_01_desc:0 "한수 상류에는 뭇 산이 이어지는데, 말의 등줄기처럼 구불구불한 산줄기가 하나 있다. 길은 그 등성이를 따라 나 있고 양쪽은 모두 깊은 골짜기이며, 관성은 고개 위의 요충을 지키고 있다."
 building_hd_pass_p_3116_02_desc:0 "$building_hd_pass_p_3116_01_desc$"
 building_hd_pass_p_3116_03_desc:0 "$building_hd_pass_p_3116_01_desc$"
 building_hd_pass_p_3116_04_desc:0 "$building_hd_pass_p_3116_01_desc$"
 building_hd_pass_p_833_01_desc:0 "홍농군 노씨현 일대, 웅이 등의 산 사이에 두 벽이 문처럼 높이 솟아 있어 나그네가 그 사이를 지난다. 이곳은 낙수 상류에서 상락으로 통하는 산길의 관문이다."
 building_hd_pass_p_833_02_desc:0 "$building_hd_pass_p_833_01_desc$"
 building_hd_pass_p_833_03_desc:0 "$building_hd_pass_p_833_01_desc$"
 building_hd_pass_p_833_04_desc:0 "$building_hd_pass_p_833_01_desc$"
 building_hd_pass_p_1064_01_desc:0 "하동군 원현의 왕옥산 속, 산의 모양이 키와 같으며 관성은 험지에 의지해 서 있다. 남쪽으로 내려가 강을 건너면 낙양에 닿을 수 있다. 광무황제가 천하를 평정하던 초기에 등우가 바로 기관에서 진군하여 하동을 공략했다."
 building_hd_pass_p_1064_02_desc:0 "$building_hd_pass_p_1064_01_desc$"
 building_hd_pass_p_1064_03_desc:0 "$building_hd_pass_p_1064_01_desc$"
 building_hd_pass_p_1064_04_desc:0 "$building_hd_pass_p_1064_01_desc$"
 building_hd_pass_p_1509_01_desc:0 "농산은 높고 험하여 관중과 농서 사이에 가로놓여 있으며, 산꼭대기에 관을 두어 농관이라 부른다. 나그네가 농산을 넘어 서쪽으로 가다가 높은 곳에 올라 진천을 돌아보면 슬픔이 절로 북받치곤 한다. 건무 연간에는 외효도 농저를 지키며 한군에 맞섰다."
 building_hd_pass_p_1509_02_desc:0 "$building_hd_pass_p_1509_01_desc$"
 building_hd_pass_p_1509_03_desc:0 "$building_hd_pass_p_1509_01_desc$"
 building_hd_pass_p_1509_04_desc:0 "$building_hd_pass_p_1509_01_desc$"
 building_hd_pass_p_1942_01_desc:0 "강하군 북쪽 경계의 대별 등 여러 산 사이, 산 북쪽의 골짜기 길은 그윽하고 구불구불하여 숲에 하루 종일 햇빛이 들지 않으며, 관성이 그 가운데를 지키고 있다."
 building_hd_pass_p_1942_02_desc:0 "$building_hd_pass_p_1942_01_desc$"
 building_hd_pass_p_1942_03_desc:0 "$building_hd_pass_p_1942_01_desc$"
 building_hd_pass_p_1942_04_desc:0 "$building_hd_pass_p_1942_01_desc$"
 building_hd_pass_p_3642_01_desc:0 "상용은 옛 용나라의 땅이다. 춘추 시대에 용인이 여러 만족을 이끌고 초나라를 배반했다가 끝내 초, 진, 파 세 나라에 멸망당했다. 성은 도수 가에 자리하여 뭇 산에 둘러싸여 있으며, 서쪽으로 한중과 통하고 동쪽으로 양양에 이르니, 한수 상류의 산길과 물길을 틀어막고 있다."
 building_hd_pass_p_3642_02_desc:0 "$building_hd_pass_p_3642_01_desc$"
 building_hd_pass_p_3642_03_desc:0 "$building_hd_pass_p_3642_01_desc$"
 building_hd_pass_p_3642_04_desc:0 "$building_hd_pass_p_3642_01_desc$"
 building_hd_pass_p_3449_01_desc:0 "요동의 산지는 봉우리가 겹겹이 이어지고, 안시 동쪽의 골짜기 어귀에 관새가 설치되어 요수 평야에서 동쪽 산지로 들어가는 길을 틀어막고 있다. 고구려와 한나라의 병마가 이 일대를 자주 오갔다."
 building_hd_pass_p_3449_02_desc:0 "$building_hd_pass_p_3449_01_desc$"
 building_hd_pass_p_3449_03_desc:0 "$building_hd_pass_p_3449_01_desc$"
 building_hd_pass_p_3449_04_desc:0 "$building_hd_pass_p_3449_01_desc$"
 building_hd_pass_p_568_01_desc:0 "대군 광창현 동남쪽의 오완관은 대 땅에서 남쪽으로 중산과 탁군에 이르는 산길을 틀어막고 있다. 산세가 휘감기고 길이 험하고 좁아, 선비와 오환이 침입할 때면 이 관이 연조 중심부의 방벽이 된다."
 building_hd_pass_p_568_02_desc:0 "$building_hd_pass_p_568_01_desc$"
 building_hd_pass_p_568_03_desc:0 "$building_hd_pass_p_568_01_desc$"
 building_hd_pass_p_568_04_desc:0 "$building_hd_pass_p_568_01_desc$"
 building_hd_pass_p_1447_01_desc:0 "상군 북부의 황토 구릉 사이에는 골짜기가 종횡으로 뻗어 있고, 연수가 깊은 골짜기를 굽이굽이 흐른다. 관성은 골짜기 어귀에 설치되어 북쪽에서 오는 호족 기병을 막는다."
 building_hd_pass_p_1447_02_desc:0 "$building_hd_pass_p_1447_01_desc$"
 building_hd_pass_p_1447_03_desc:0 "$building_hd_pass_p_1447_01_desc$"
 building_hd_pass_p_1447_04_desc:0 "$building_hd_pass_p_1447_01_desc$"
 building_hd_pass_p_1452_01_desc:0 "상군 남쪽 경계의 황토 고원은 높이 솟아 있고 길은 골짜기를 따라 구불구불 이어진다. 관성은 골짜기의 요로를 틀어막고 있으니, 관중에서 북쪽 상군으로 나가는 방벽 가운데 하나다."
 building_hd_pass_p_1452_02_desc:0 "$building_hd_pass_p_1452_01_desc$"
 building_hd_pass_p_1452_03_desc:0 "$building_hd_pass_p_1452_01_desc$"
 building_hd_pass_p_1452_04_desc:0 "$building_hd_pass_p_1452_01_desc$"
 building_hd_pass_p_811_01_desc:0 "상락의 산중에는 소나무 숲이 울창하고 산길은 계곡을 따라 나 있으며, 관성은 숲에 가려진 채 서서 상락에서 동쪽 남양으로 통하는 오솔길을 지키고 있다."
 building_hd_pass_p_811_02_desc:0 "$building_hd_pass_p_811_01_desc$"
 building_hd_pass_p_811_03_desc:0 "$building_hd_pass_p_811_01_desc$"
 building_hd_pass_p_811_04_desc:0 "$building_hd_pass_p_811_01_desc$"
 building_hd_pass_p_3757_01_desc:0 "노씨현의 깊은 산속, 산의 바위가 쇠처럼 검으며, 관성은 낙수 상류의 골짜기 길을 틀어막고 있다. 지세가 험하고 좁아 적은 병졸로도 지킬 수 있다."
 building_hd_pass_p_3757_02_desc:0 "$building_hd_pass_p_3757_01_desc$"
 building_hd_pass_p_3757_03_desc:0 "$building_hd_pass_p_3757_01_desc$"
 building_hd_pass_p_3757_04_desc:0 "$building_hd_pass_p_3757_01_desc$"
 building_hd_pass_p_832_01_desc:0 "상락 동부의 뭇 산 사이에는 계곡이 깊고 그윽하며, 관성은 단수 상류에서 홍농으로 통하는 산길을 틀어막고 있다. 숲 사이 계곡의 소 위에는 물새 떼가 자주 모여든다."
 building_hd_pass_p_832_02_desc:0 "$building_hd_pass_p_832_01_desc$"
 building_hd_pass_p_832_03_desc:0 "$building_hd_pass_p_832_01_desc$"
 building_hd_pass_p_832_04_desc:0 "$building_hd_pass_p_832_01_desc$"
 building_hd_pass_p_3059_01_desc:0 "조수 가에서 세 갈래 산길이 만나니, 하나는 농서로 통하고, 하나는 강족 땅으로 들어가며, 하나는 하관으로 내려간다. 관성은 갈림길을 틀어막고 있으니, 양주 서남쪽에서 여러 강족을 막는 전초다."
 building_hd_pass_p_3059_02_desc:0 "$building_hd_pass_p_3059_01_desc$"
 building_hd_pass_p_3059_03_desc:0 "$building_hd_pass_p_3059_01_desc$"
 building_hd_pass_p_3059_04_desc:0 "$building_hd_pass_p_3059_01_desc$"
 building_hd_pass_p_5540_01_desc:0 "창오군 사목현은 오령 사이의 한 산 어귀로, 영릉에서 남쪽으로 산을 넘어 영남으로 들어가는 길 가운데 하나다. 효무황제가 남월을 평정한 뒤 이 일대의 관문은 모두 한나라에 귀속되었다."
 building_hd_pass_p_5540_02_desc:0 "$building_hd_pass_p_5540_01_desc$"
 building_hd_pass_p_5540_03_desc:0 "$building_hd_pass_p_5540_01_desc$"
 building_hd_pass_p_5540_04_desc:0 "$building_hd_pass_p_5540_01_desc$"
 building_hd_pass_p_6399_01_desc:0 "광수가 북쪽에서 산을 뚫고 남쪽으로 흘러 이곳에서 진수에 합류한다. 남월국이 일찍이 여기에 관을 두어 횡포, 양산과 함께 영남 북쪽의 방벽으로 삼았다. 효무황제가 남월을 칠 때 한군 한 갈래가 광수를 따라 내려갔다."
 building_hd_pass_p_6399_02_desc:0 "$building_hd_pass_p_6399_01_desc$"
 building_hd_pass_p_6399_03_desc:0 "$building_hd_pass_p_6399_01_desc$"
 building_hd_pass_p_6399_04_desc:0 "$building_hd_pass_p_6399_01_desc$"
 building_hd_pass_p_1924_01_desc:0 "대별산 남쪽 기슭의 한 산 어귀로, 시냇바닥이 온통 흰 모래이고 맑은 물이 졸졸 흐르며, 관성은 강하에서 북쪽으로 대별산을 넘는 산길을 틀어막고 있다."
 building_hd_pass_p_1924_02_desc:0 "$building_hd_pass_p_1924_01_desc$"
 building_hd_pass_p_1924_03_desc:0 "$building_hd_pass_p_1924_01_desc$"
 building_hd_pass_p_1924_04_desc:0 "$building_hd_pass_p_1924_01_desc$"
 building_hd_pass_p_3744_01_desc:0 "대강이 무산을 꿰뚫고 지나가며 양안은 산이 높고 골짜기가 깊어 숲이 해를 가린다. 관성은 강을 따라 난 산길을 틀어막고 있으니, 파와 초 사이의 요해처다."
 building_hd_pass_p_3744_02_desc:0 "$building_hd_pass_p_3744_01_desc$"
 building_hd_pass_p_3744_03_desc:0 "$building_hd_pass_p_3744_01_desc$"
 building_hd_pass_p_3744_04_desc:0 "$building_hd_pass_p_3744_01_desc$"
 building_hd_pass_p_1929_01_desc:0 "대별 등 여러 산 사이에 황토 산비탈 하나가 남북을 잇는데, 비가 온 뒤에는 진창이 되어 다니기 어렵다. 관성은 비탈 꼭대기를 지키고 있으니, 강한 땅에서 북쪽으로 회수로 나가는 요충 가운데 하나다."
 building_hd_pass_p_1929_02_desc:0 "$building_hd_pass_p_1929_01_desc$"
