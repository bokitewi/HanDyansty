 # New major pass chains
 building_hd_pass_p_2203_01:0 "목릉관"
 building_hd_pass_p_2203_01_desc:0 "대현산 위의 목릉관은 제 땅 남쪽의 관문으로, 관중이 초나라 사자에게 답하며 말한 “남쪽으로는 목릉에 이른다”는 곳이 바로 여기다. 산길이 좁아 수레와 말이 나란히 지나기 어렵고, 이 관을 넘으면 북쪽으로는 끝없이 평탄한 제나라의 중심부가 펼쳐진다."
 building_hd_pass_p_2203_02:0 "목릉관"
 building_hd_pass_p_2203_02_desc:0 "$building_hd_pass_p_2203_01_desc$"
 building_hd_pass_p_2203_03:0 "목릉관"
 building_hd_pass_p_2203_03_desc:0 "$building_hd_pass_p_2203_01_desc$"
 building_hd_pass_p_2203_04:0 "목릉관"
 building_hd_pass_p_2203_04_desc:0 "$building_hd_pass_p_2203_01_desc$"
 building_hd_pass_p_4403_01:0 "강유관"
 building_hd_pass_p_4403_01_desc:0 "음평 산길이 끝나는 곳, 부수 가에 뭇 산으로 둘러싸인 작은 수성이 하나 있다. 북쪽에서 오는 험하고 외진 오솔길은 여기에 이르러서야 깊은 산을 벗어나며, 남쪽으로 내려가면 곧장 부현과 성도 평야에 닿는다."
 building_hd_pass_p_4403_02:0 "강유관"
 building_hd_pass_p_4403_02_desc:0 "$building_hd_pass_p_4403_01_desc$"
 building_hd_pass_p_4403_03:0 "강유관"
 building_hd_pass_p_4403_03_desc:0 "$building_hd_pass_p_4403_01_desc$"
 building_hd_pass_p_4403_04:0 "강유관"
 building_hd_pass_p_4403_04_desc:0 "$building_hd_pass_p_4403_01_desc$"
 building_hd_pass_p_1135_01:0 "호관"
 building_hd_pass_p_1135_01_desc:0 "상당군 호관현은 산의 모양이 병과 같아 입구는 좁고 속은 넓으므로 호구라 이름 붙었다. 관성은 태항산의 험준함에 의지하고 있어, 동쪽으로 내려가면 곧 하북 평원이니 상당에서 동쪽으로 나가는 관문이다. 효무황제 때 호관삼로가 상소를 올려 여태자의 억울함을 호소한 바 있다."
 building_hd_pass_p_1135_02:0 "호관"
 building_hd_pass_p_1135_02_desc:0 "$building_hd_pass_p_1135_01_desc$"
 building_hd_pass_p_1135_03:0 "호관"
 building_hd_pass_p_1135_03_desc:0 "$building_hd_pass_p_1135_01_desc$"
 building_hd_pass_p_1135_04:0 "호관"
 building_hd_pass_p_1135_04_desc:0 "$building_hd_pass_p_1135_01_desc$"
 building_hd_pass_p_3121_01:0 "백수관"
 building_hd_pass_p_3121_01_desc:0 "광한군 백수현에서 백수가 서북쪽으로부터 흘러와 이곳에서 서한수에 합류한다. 관성은 무도와 한중에서 남하하여 촉으로 들어가는 북쪽 길을 틀어막고 있으니, 익주 북쪽의 중요한 관문이다."
 building_hd_pass_p_3121_02:0 "백수관"
 building_hd_pass_p_3121_02_desc:0 "$building_hd_pass_p_3121_01_desc$"
 building_hd_pass_p_3121_03:0 "백수관"
 building_hd_pass_p_3121_03_desc:0 "$building_hd_pass_p_3121_01_desc$"
 building_hd_pass_p_3121_04:0 "백수관"
 building_hd_pass_p_3121_04_desc:0 "$building_hd_pass_p_3121_01_desc$"
 building_hd_pass_p_3634_01:0 "자오관"
 building_hd_pass_p_3634_01_desc:0 "장안 남쪽의 진령 속에 남북을 꿰뚫는 골짜기 길이 있다. 왕망 때 개통되어 자오도라 불렸으며, 곧장 한중으로 내려갈 수 있다. 관성은 북쪽 어귀에 있고, 골짜기 안의 잔도는 끝없이 이어져 험준하여 다니기 어렵다."
 building_hd_pass_p_3634_02:0 "자오관"
 building_hd_pass_p_3634_02_desc:0 "$building_hd_pass_p_3634_01_desc$"
 building_hd_pass_p_3634_03:0 "자오관"
 building_hd_pass_p_3634_03_desc:0 "$building_hd_pass_p_3634_01_desc$"
 building_hd_pass_p_3634_04:0 "자오관"
 building_hd_pass_p_3634_04_desc:0 "$building_hd_pass_p_3634_01_desc$"
 building_hd_pass_p_5969_01:0 "가욕관"
 building_hd_pass_p_5969_01_desc:0 "주천군 서쪽, 남산과 북산 사이에는 좁고 긴 평야만이 남아 있으니, 하서 여러 군 가운데 가장 좁은 곳이다. 수졸들이 이곳에서 봉수를 살피며, 더 서쪽으로 가면 돈황과 서역이다."
 building_hd_pass_p_5969_02:0 "가욕관"
 building_hd_pass_p_5969_02_desc:0 "$building_hd_pass_p_5969_01_desc$"
