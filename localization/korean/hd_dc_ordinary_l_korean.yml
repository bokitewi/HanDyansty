l_korean:
 hd_dc_ord.0009.t: "옥에 갇힌 친족"
 hd_dc_ord.0009.desc: "보내온 문서에는 [hd_dc_prisoner.GetTitledFirstName]의 이름이 적혀 있었다. 그는 아직 [hd_dc_captor.GetTitledFirstName]의 옥에 갇혀 있고, 집안 친족들이 사람을 넣어 몇 번이나 알아보았으나 돌아오는 말은 늘 “값”이라는 한 글자를 벗어나지 못했다.\n\n친족들은 모두 당신을 바라보며 결정을 기다리고 있다. 몸값은 적은 액수가 아니지만, 옥중의 나날은 더 견디기 어렵다. 게다가 당신의 옥에도 상대가 마음 놓지 못하는 누군가가 갇혀 있을지 모른다."
 hd_dc_ord.0009.a: "백금으로 속량하라. 더 말하지 말라."
 hd_dc_ord.0009.a.tt: "[hd_dc_captor.GetTitledFirstName](이)가 몸값을 받고 사람을 돌려보낸다면:"
 hd_dc_ord.0009.b: "이 값은 받아들일 수 없다. 다시 방도를 찾겠다."
 hd_dc_ord.0009.c: "포로를 포로와 맞바꾸어 각자 주인에게 돌려보낸다."
 hd_dc_ord.0009.c.tt: "[hd_dc_captor.GetTitledFirstName](이)가 교환에 응한다면, 당신도 옥에 갇힌 [hd_dc_captor.GetHerHis] 친족 한 명을 돌려보내야 합니다:"
 hd_dc_ord09_a_terms: "[hd_dc_proposer.GetTitledFirstName](이)가 [hd_dc_recipient.GetTitledFirstName]에게 서신을 보냄: 백금을 내어 [hd_dc_prisoner.GetTitledFirstName](을)를 속량하고자 하니, 금이 도착하는 날 사람을 집으로 돌려보내 주기를 청함. 서신에서는 몸값과 석방만을 논할 뿐, 충성을 요구하지 않고 인질을 청하지 않으며 훗날의 도움도 약속하지 않음. 석 달 안에 답이 없으면 이 제의는 무효가 됨."
 hd_dc_ord09_c_terms: "[hd_dc_proposer.GetTitledFirstName](이)가 [hd_dc_recipient.GetTitledFirstName]에게 서신을 보냄: 양가가 각각 한 사람씩 풀어 주기로 함. [hd_dc_recipient.GetTitledFirstName](은)는 [hd_dc_prisoner.GetTitledFirstName](을)를, [hd_dc_proposer.GetTitledFirstName](은)는 [hd_dc_exchange_prisoner.GetTitledFirstName](을)를 돌려보냄. 사람을 사람과 맞바꿀 뿐 금백을 요구하지 않고 충성을 구하지 않으며, 두 사람이 모두 옥문을 나서야 이 약조가 성립함. 석 달 안에 답이 없으면 이 제의는 무효가 됨."
 hd_dc_ord.0209.t: "속량 서신의 회신"
 hd_dc_ord.0209.ransomed: "몸값이 이미 [hd_dc_ordinary.Var('hd_dc_captor').Char.GetTitledFirstName]의 손에 들어갔고, 옥문도 그에 따라 열렸다. [hd_dc_ordinary.Var('hd_dc_prisoner').Char.GetTitledFirstName](이)가 봉두난발에 때 묻은 얼굴로 걸어 나와, 가족의 부축을 받으며 수레에 올랐다.\n\n친족들은 벌써 환영 잔치의 술과 음식을 준비하고 있다. 이 걱정거리 하나를 마침내 내려놓게 되었다."
 hd_dc_ord.0209.exchanged: "두 곳의 옥문이 같은 날 열렸다. [hd_dc_ordinary.Var('hd_dc_prisoner').Char.GetTitledFirstName](은)는 집으로 돌아왔고, 당신의 옥에 있던 [hd_dc_ordinary.Var('hd_dc_exchange_prisoner').Char.GetTitledFirstName]도 [hd_dc_ordinary.Var('hd_dc_captor').Char.GetTitledFirstName]에게 돌려보내졌다.\n\n양가가 각자 사람을 되찾았지만, 묵은 원한이 이로써 끝났다고 할 수는 없다."
 hd_dc_ord.0209.rejected: "사자가 봉인도 뜯지 않은 문서를 들고 돌아왔다. [hd_dc_ordinary.Var('hd_dc_captor').Char.GetTitledFirstName](이)가 응하지 않은 것이다.\n\n몸값은 아직 당신의 창고에 있고, 사람도 아직 상대의 옥에 있다. 이 일은 다른 방도를 찾을 수밖에 없다."
 hd_dc_ord.0209.partial: "약조는 양쪽이 함께 사람을 풀어 주는 것이었다. [hd_dc_ordinary.Var('hd_dc_prisoner').Char.GetTitledFirstName](은)는 이미 집으로 돌아왔지만, 당신 쪽에서 풀어 주어야 할 사람은 옥문을 나서지 못했다.\n\n이것은 성사된 교환이라 할 수 없다. 일을 맡은 이가 전후 경과를 하나하나 기록해 두었으니, 앞으로 양가는 이 일로 또 다투게 될 것이다."
 hd_dc_ord.0209.unpaid: "[hd_dc_ordinary.Var('hd_dc_captor').Char.GetTitledFirstName](이)가 이미 응낙했으나, 몸값이 액수대로 전달되지 못했다. 일을 맡은 이는 석방 절차를 멈추고, 보낸 돈 가운데 되찾을 수 있는 것은 모두 되찾아 왔다.\n\n사람을 속량해 오지 못했으니, 이 일은 접을 수밖에 없다."
 hd_dc_ord.0209.failed: "약조는 맺어졌으나 [hd_dc_ordinary.Var('hd_dc_prisoner').Char.GetTitledFirstName](은)는 끝내 옥문을 나서지 못했다. 이미 보낸 재물이 있다면 일을 맡은 이가 되찾으려 애썼고, 되찾을 수 있는 것은 모두 되찾았다.\n\n사람은 여전히 상대의 옥에 있으니, 이 일은 따로 계획을 세워야 한다."
 hd_dc_ord.0209.cancelled: "문서가 아직 길 위에 있는 동안 상황이 이미 바뀌었다. 사람이 더 이상 그곳에 없거나, 기한이 지나 버린 것이다. 예전의 약조는 더 이상 효력이 없다.\n\n이번 속량의 일은 이것으로 끝이다."
 hd_dc_ord.0209.a: "이 일은 기록해 두자."
 hd_dc_ord.0019.t: "원수의 후손"
 hd_dc_ord.0019.desc: "[hd_dc_visitor.GetTitledFirstName](이)가 섬돌 앞에 서서 자신의 이름을 밝혔다. 사실 밝힐 필요도 없었다. [hd_dc_visitor.GetSheHe](이)가 누구의 자식인지 당신은 이미 알고 있었다. [hd_dc_enemy_parent.GetTitledFirstName]이라는 이름은 당신의 마음속에서 언제나 또 다른 옛일과 이어져 있었다.\n\n그러나 눈앞의 이 사람은 스스로 아무런 잘못도 저지르지 않았다. 아버지 대의 묵은 빚을 누구의 몫으로 돌릴지, 오늘 [hd_dc_visitor.GetHerHim](을)를 어떻게 대할지, 당상의 사람들은 모두 당신이 입을 열기를 기다리고 있다."
 hd_dc_ord.0019.a: "사람은 그 행실로 논할 것이지, 그 아비로 논할 것이 아니다."
 hd_dc_ord.0019.b: "네 집안이 한 일을 나는 감히 잊지 못하였다."
 hd_dc_ord.0013.t: "산더미 같은 문서"
 hd_dc_ord.0013.desc: "[hd_dc_petitioner.GetTitledFirstName]의 문서가 또 책상 위에 쌓였다. 그가 다스리는 지역은 이미 단속이 되지 않는데도, 크고 작은 일을 가리지 않고 하나하나 당신에게 올려 결재를 받으려 한다.\n\n당신은 맨 위의 두루마리를 펼쳐 두 줄을 읽다가 다시 덮었다. 연일 쌓인 피로는 공무가 급하다고 해서 저절로 물러가지 않는다. 문밖에는 아직 사람이 기다리고, 책상 위의 일도 누군가는 처리해야 한다."
 hd_dc_ord.0013.a: "정무가 번잡하니 중신에게 일을 나누어 맡긴다."
 hd_dc_ord.0013.b: "소식을 전한 자에게 화풀이한다."
 hd_dc_ord.0013.b.tt: "#EMP 한때의 분노를 쏟아 내도, 가슴에 맺힌 응어리가 그로써 풀린다는 보장은 없습니다.#!"
 hd_dc_ord.0013.c: "막역한 벗에게 속내를 털어놓되, 큰일은 여전히 스스로 결정한다."
 hd_dc_ord.0013.c.tt: "막역한 벗이 답장으로 위로해 준다면:"
 hd_dc_ord.invalidated: "시세가 바뀌어 이 일은 없던 것으로 함."
 hd_dc_ord.0113.t: "상주문 밖의 이야기"
 hd_dc_ord.0113.desc: "[hd_dc_ordinary_ruler.GetTitledFirstName](이)가 보낸 것은 사사로운 편지였고, 전편을 통틀어 공문의 상투적인 말은 한 마디도 없었다.\n\n“그대에게 대신 결정해 달라는 것이 아니오. 다만 몇 마디 말을 믿을 만한 사람에게 털어놓고 싶었을 뿐이오.” 이어지는 몇 장에는 문서와 품의, 그리고 밤늦도록 잠들지 못하는 까닭이 빼곡히 적혀 있었다.\n\n편지를 끝까지 읽으니, 종이 위의 피로가 거의 넘쳐흐를 듯했다. 이 편지에 어떻게 답할지는 당신 스스로 헤아려야 한다."
 hd_dc_ord.0113.a: "조목조목 답장하여 근심을 나누어 진다."
 hd_dc_ord.0113.b: "나 또한 내 앞가림하기도 벅차니, 돕지 못해 부끄럽소."
 hd_dc_ord.0213.t: "책상 위의 작은 빈자리"
 hd_dc_ord.0213.helped: "답장을 다 읽었지만 책상 위의 상주문은 한 권도 줄지 않았다. 그래도 이제는 어느 것을 오늘 반드시 결정해야 하고, 어느 것을 내일로 미뤄도 되는지 구분할 수 있게 되었다.\n\n누군가가 당신의 근심을 진지하게 읽고 조목조목 위로의 말을 적어 주었으니, 마음이 한결 가벼워졌다. 결정은 여전히 당신이 내리지만, 다음 조령을 어떻게 써야 할지도 전보다 분명해졌다."
 hd_dc_ord.0213.declined: "답장이 왔는데, 상대도 지금은 짐을 나누어 질 여력이 없다는 내용이었다. 당신은 더 재촉하지 않았다.\n\n책상 위의 두루마리는 그대로 있고, 마음의 무거운 짐도 여전히 짓누른다. 이번에는 혼자서 짊어질 수밖에 없다."
 hd_dc_ord.0213.a: "오늘의 일은 오늘 끝낸다."
 hd_dc_ordinary_response_opinion: "최근의 왕래"
