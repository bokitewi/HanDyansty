l_korean:
 hd_dc_roy.0001.t: "종묘 아래, 자리의 차례가 다르다"
 hd_dc_roy.0001.desc: "예관이 막 좌석 표찰을 펼쳐 놓자, [hd_dc_favored.GetTitledFirstName](이)가 어좌에서 가장 가까운 표찰 하나를 손으로 눌렀다.\n\n“신이 밖에서 여러 해 동분서주했는데, 설마 자리 하나조차 얻지 못하겠습니까.” [hd_dc_favored.GetSheHe](은)는 손을 떼지 않았다. [hd_dc_displaced.GetTitledFirstName](이)가 명부를 당신 앞으로 밀며 원래 정해진 차례를 가리켰다. “오늘 자리 하나를 옮길 수 있다면, 내일은 무엇인들 옮기지 못하겠습니까?”\n\n두 사람 모두 당신이 입을 열기를 기다리고 있다. 비단 명부에 오른 다른 종친들도 이 한마디에서 자기의 무게를 듣게 될 것이다."
 hd_dc_roy.0001.a: "종친에게는 저마다 자리가 있으니, 모두 옛 관례를 따르라."
 hd_dc_roy.0001.b: "가까운 자리를 경에게 주겠으니, 논의할 때에는 짐을 도와야 하오."
 hd_dc_roy.0001.b.tt: "[hd_dc_favored.GetTitledFirstName](이)가 이 약조에 응하면, 다른 종친들은 원망을 품게 될 것입니다:"
 hd_dc_roy.0001.c: "짐의 자리 차례에 종친이 이러쿵저러쿵할 수 없다."
 hd_dc_roy.0001.d: "종중의 어른들께 예의 차례를 주관해 달라고 청한다."
 hd_dc_roy.0001.d.tt: "종중의 어른이 나서기로 응하면, 당신은 사례금을 바쳐야 합니다. #EMP 어른이 양측을 승복시킬 수 있을지는 예측하기 어렵습니다.#!"
 hd_dc_roy01_mediation_terms: "[hd_dc_proposer.GetTitledFirstName](이)가 [hd_dc_recipient.GetTitledFirstName]에게 종중 어른의 존엄으로 옛 명부에 따라 예의 차례를 주관하고, 가까운 자리를 청한 쪽에 양보를 권해 주기를 공손히 청함. 설득이 되든 안 되든 사례금 30금은 어김없이 바침. 석 달 안에 답이 없으면 이 청은 무효가 됨."
 hd_dc_roy01_mediation_written_terms: "[hd_dc_recipient.GetTitledFirstName](이)가 [hd_dc_proposer.GetTitledFirstName]에게 답서를 보냄: 기꺼이 가서 주관하겠으며, 사례금은 그대로 받겠음. 다만 증인, 내린 재정, 그리고 승복하지 않는 이가 누구인지를 모두 종중 명부에 실어 후세에 밝히기를 청함."
 hd_dc_roy.0101.mediation_success: "어른이 옛 명부를 펼치고, 한 자리 한 자리 처음 정했던 차례를 짚어 나갔다. 가까운 자리를 청했던 종친은 아직 반박하려 했으나, 끝까지 듣고 나서는 마침내 손에 쥔 표찰을 놓았다.\n\n예관은 재정에 따라 명부를 다시 정리하고 증인의 이름을 적었다. 사례금 30금이 액수대로 바쳐졌고, 다투던 두 사람도 서로에게 예를 갖추었다. 이번에는 더 이상 다투는 이가 없었다."
 hd_dc_roy.0101.mediation_failure: "어른은 옛 명부에 따라 자리마다 재정을 내렸다. 예관이 막 명부를 거두자, 가까운 자리를 청했던 종친이 일어섰다. “차례는 그대로 적으셔도 좋으나, 신은 승복하지 못하겠습니다.”\n\n사례금은 이미 바쳐졌고, 재정도 명부에 적혔다. 일은 처리되었으나 다툼은 그로써 가라앉지 않았다. 승복하지 않은 그 종친의 이름은 명부 끝에 따로 적혔다."
 hd_dc_roy.0101.mediation_unpaid: "어른은 이미 응낙했으나, 사례금이 액수대로 전달되지 못했다. 예관은 문서를 들고 돌아와 감히 더 진행하지 못했다.\n\n명부는 여전히 원래대로 늘어서 있고, 이번 중재는 그렇게 미뤄지고 말았다."
 hd_dc_roy.0101.mediation_cancelled: "중재는 끝내 재정의 단계까지 이르지 못했다. 어른에게서 답이 없었거나, 완곡히 사양했거나, 혹은 이제는 나서기 곤란해진 것이다.\n\n예관은 오간 서신을 봉해 보관했다. 명부에는 있지도 않았던 화해가 덧붙여지지 않았다."
 hd_dc_roy.window_closed: "정세가 바뀌어 이 일은 따로 논의해야 함."
 hd_dc_roy01_precedence_terms: "[hd_dc_proposer.GetTitledFirstName](이)가 종묘의 수석을 [hd_dc_recipient.GetTitledFirstName]에게 내리고, 다른 종친의 차례는 예전대로 둠. 종실 논의의 문서가 도착하는 날, [hd_dc_recipient.GetTitledFirstName](은)는 석 달 안에 이름을 걸고 회주하여 각 지파의 청을 함께 논의해야 함. 이 자리는 병권이나 녹봉에 미치지 않으며, 도성으로 옮겨 살 필요도 없음. 석 달 안에 답이 없으면 이 제의는 무효가 됨."
 hd_dc_roy01_precedence_guarantee: "[hd_dc_recipient.GetTitledFirstName](이)가 [hd_dc_proposer.GetTitledFirstName]에게 답서를 보냄: 수석을 내려 주심을 기꺼이 받겠음. 다만 1년 안에는 이 자리를 다시 바꾸지 않고 명부도 다시 정리하지 않기를 청함. 논의의 문서가 도착하면 석 달 안에 이름을 걸고 회주하겠음. 병권과 녹봉은 일절 구하지 않음."
 hd_dc_roy.0101.t: "좌석 표찰과 답서"
 hd_dc_roy.0101.accepted: "사자가 도장이 찍힌 문서를 책상 위에 돌려놓았다. 예관은 약조대로 좌석 표찰을 다시 배치했고, 가까운 자리의 그 이름은 이미 명부에 적혔다.\n\n명부와 함께 각 지파의 종친에게 보낼 논의 초청장도 나갔다. 인신은 이미 갖추어졌으니, 이제 지켜볼 것은 수석을 얻은 사람이 약조대로 회주할지 여부다."
 hd_dc_roy.0101.rejected: "문서가 되돌아왔고, 도장 찍는 자리는 여전히 텅 비어 있었다. 사자가 한마디 말을 전해 왔다. “자리와 충성은 같은 종이에 적을 것이 아니오.”\n\n예관은 준비해 둔 좌석 표찰을 거두고, 옛 명부대로 논의 초청장을 보냈다. 가까운 자리의 주인은 바뀌지 않았고, 이번 약속도 반 푼의 지지조차 얻어 내지 못했다."
 hd_dc_roy.0101.expired: "기한이 지났으나 답서를 담을 함은 여전히 비어 있다. 예관이 더 기다릴지 묻자, 당신은 끝내 도장이 찍히지 않은 그 문서를 힐끗 보았다.\n\n이 제의는 이것으로 접고, 좌석 표찰은 옛 명부대로 늘어놓는다."
 hd_dc_roy.0101.invalidated: "예관이 가까운 자리에 관한 그 문서를 가지고 돌아왔으나, 명부에는 손대지 않았다. 처음 약조를 맺은 이들 가운데 어떤 이는 더 이상 논의에 나올 수 없고, 어떤 이는 이미 세력을 잃어, 이 약조는 더 이상 원래대로 진행될 수 없게 되었다.\n\n종친들의 요구는 여전히 남아 있지만, 옛 문서는 이제 효력이 없다."
 hd_dc_roy.0101.a: "명부에 기록한다."
 hd_dc_roy.0102.t: "종실 논의서"
 hd_dc_roy.0102.desc: "사자가 논의서 한 통을 가져왔는데, 겉봉에는 당신의 예의 차례가 적혀 있었다. 제[SCOPE.GetValue('hd_dc_invitation_rank')|0]석이다. 종실 명부가 이미 정해졌으니, 조정은 당신에게 각 지파의 봉상과 직임에 관해 이름을 건 회주를 써 달라고 청한다.\n\n이번에는 수행원을 데리고 입궐할 필요 없이, 의견을 종이에 적기만 하면 의제에 오른다. 도장 찍는 자리는 아직 비어 있다."
 hd_dc_roy.0102.a: "종이와 붓을 가져오라. 할 말은 분명히 적어야 한다."
 hd_dc_roy.0102.a.tt: "가까운 자리를 구할 때 했던 약속을 이로써 이행합니다."
 hd_dc_roy.0102.b: "논의서를 돌려보내고, 이에 도장을 찍지 않는다."
 hd_dc_roy.0102.b.tt: "당신은 이를 약속하여 가까운 자리를 얻었으나, 이제 그 말을 어기려 합니다."
 hd_dc_ritual_fairness_opinion: "종실의 옛 차례를 회복함"
 hd_dc_ritual_disappointment_opinion: "가까운 자리의 청이 기각됨"
 hd_dc_ritual_command_opinion: "황제가 예의 차례를 재정함"
 hd_dc_ritual_precedence_opinion: "가까운 자리를 편중되게 줌"
 hd_dc_royal_cooperation_opinion: "종실의 논의가 억눌림"
 hd_dc_royal_support_opinion: "제위 다툼에서의 입장"
