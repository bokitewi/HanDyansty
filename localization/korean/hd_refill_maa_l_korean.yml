l_korean:
 hd_refill_maa_gold_interaction:0 "돈을 들여 사병 보충"
 hd_refill_maa_gold_interaction_desc:0 "[treasury|E](국고가 없으면 [gold|E])를 소모해 즉시 병사를 모집하여, 결원이 생긴 사유 [men_at_arms|E] [regiments|E]를 가득 채웁니다. [title_men_at_arms|E]는 각 작위 아래에서 따로 보충합니다."
 hd_refill_maa_any_personal_regiment_tt:0 "사유 [men_at_arms|E] [regiment|E]를 보유해야 합니다"
 hd_refill_maa_unfull_personal_regiment_tt:0 "결원이 있는 사유 [men_at_arms|E] [regiment|E]가 있어야 합니다"
 hd_refill_personal_maa_full_tt:0 "사유 [men_at_arms|E] [regiments|E]가 [THIS.Char.MakeScope.ScriptValue('hd_refill_personal_maa_soldiers_tt_value')|0P]명의 [soldiers|E]를 얻습니다$refill_maa_regiments_fully_reinforced_tt$"
 hd_refill_personal_maa_partial_tt:0 "사유 [men_at_arms|E] [regiments|E]가 [THIS.Char.MakeScope.ScriptValue('hd_refill_personal_maa_soldiers_tt_value')|0P]명의 [soldiers|E]를 얻습니다\n#alert_trial $BULLET_WITH_TAB$자금이 부족해 연대가 일부만 보충됩니다!#!"
 hd_refill_personal_maa_cost_treasury_tt:0 "[treasury_i][THIS.Char.MakeScope.ScriptValue('hd_refill_personal_maa_cost_tt_value')|0N] 잃음"
 hd_refill_personal_maa_cost_gold_tt:0 "[gold_i][THIS.Char.MakeScope.ScriptValue('hd_refill_personal_maa_cost_tt_value')|0N] 잃음"

 hd_refill_title_maa_gold_interaction:0 "돈을 들여 작위병 보충"
 hd_refill_title_maa_gold_interaction_desc:0 "[treasury|E](국고가 없으면 [gold|E])를 소모해 즉시 병사를 모집하여, 이 작위의 결원이 생긴 [title_men_at_arms|E]를 가득 채웁니다. 다른 이에게 빌려준 병력도 함께 보충합니다. 재사용 대기시간은 작위마다 따로 계산합니다."
 hd_refill_title_maa_unfull_regiment_tt:0 "이 작위에 결원이 있는 [title_men_at_arms|E] [regiment|E]가 있어야 합니다"
 hd_refill_title_maa_cooldown_tt:0 "이 작위는 반년 안에 이미 보충했으며, 아직 재사용 대기 중입니다"
 hd_refill_title_maa_full_tt:0 "[THIS.Title.GetName]의 [title_men_at_arms|E]가 [THIS.Title.MakeScope.ScriptValue('hd_refill_title_maa_soldiers_tt_value')|0P]명의 [soldiers|E]를 얻습니다$refill_maa_regiments_fully_reinforced_tt$"
 hd_refill_title_maa_partial_tt:0 "[THIS.Title.GetName]의 [title_men_at_arms|E]가 [THIS.Title.MakeScope.ScriptValue('hd_refill_title_maa_soldiers_tt_value')|0P]명의 [soldiers|E]를 얻습니다\n#alert_trial $BULLET_WITH_TAB$자금이 부족해 연대가 일부만 보충됩니다!#!"
 hd_refill_title_maa_cost_treasury_tt:0 "[treasury_i][THIS.Title.MakeScope.ScriptValue('hd_refill_title_maa_cost_tt_value')|0N] 잃음"
 hd_refill_title_maa_cost_gold_tt:0 "[gold_i][THIS.Title.MakeScope.ScriptValue('hd_refill_title_maa_cost_tt_value')|0N] 잃음"
 hd_refill_title_maa_cooldown_set_tt:0 "[THIS.Title.GetName]의 보충이 6개월 재사용 대기에 들어갑니다"
 HD_REFILL_TITLE_MAA_BTN_TT:0 "[Title.GetNameNoTooltip]의 [title_men_at_arms|E]를 보충합니다. 다른 이에게 빌려준 병력도 함께 보충합니다.\n결원 #V [Title.MakeScope.ScriptValue('hd_refill_title_maa_missing_tt_value')|0]#!명, 전부 채우려면 #V [Title.MakeScope.ScriptValue('hd_refill_title_maa_full_cost_tt_value')|0]#! [Select_CString( Title.GetHolder.HasTreasury, '국고', '금' )] 필요.\n재사용 대기시간은 작위마다 6개월[Select_CString( Title.MakeScope.Var('hd_refill_title_maa_cd').IsSet, ', 이 작위는 아직 대기 중', '' )].\n[Select_CString( Character.IsPlayerInteractionValid('hd_refill_title_maa_gold_interaction'), '', Character.GetPlayerInteractionTooltip('hd_refill_title_maa_gold_interaction') )]"
