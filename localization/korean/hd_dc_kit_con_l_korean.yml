l_korean:
 # 天朝循环·时代特色：新朝征服期套件（圈地 / 天子改文化 / 汉化改制 / 保俗 / 前朝遗民 / 前朝复辟 / 本族叛乱）

 # ---------- 圈地（打压汉人） ----------
 hd_dc_con_quandi_decision: "권지"
 hd_dc_con_quandi_decision_desc: "한나라 땅의 기름진 토지를 어찌 남인들만 누리게 두겠는가? 주 하나를 골라 그 안의 천자 직할 한인 현을 모두 본족 공신에게 내려, 용을 따른 공로에 보답한다.\n\n본족 봉신들은 이에 기뻐하겠지만, 땅을 잃은 한인들은 원성이 자자할 것이다."
 hd_dc_con_quandi_decision_tooltip: "한 주의 한인 현을 본족 공신에게 상으로 내립니다"
 hd_dc_con_quandi_decision_confirm: "땅을 권점하여 공신에게 내리라"
 hd_dc_con_quandi_land_tt: "도성 이외에 한인(중화 전승 문화) 현을 최소 하나 직할함"
 hd_dc_con_quandi_decision_effect_tt: "한 주의 땅을 골라 그 안에서 당신이 직할하는 한인 현(도성 제외)을 모두 본족 공신 한 명에게 내립니다. 본족 장병은 크게 기뻐하나, 땅을 잃은 한인 백성은 원성이 자자할 것입니다."
 hd_dc_con_quandi_county_modifier: "권지의 원한"
 hd_dc_con_quandi_county_modifier_desc: "조상 대대의 땅을 빼앗겨 호인 공신에게 상으로 내려지니, 이곳 한인 백성의 원한이 그치지 않는다."
 hd_dc_con_quandi_native_opinion: "권지로 공을 상줌"
 hd_dc_con_quandi_grantee_opinion: "권지를 하사받음"

 # ---------- 天子改文化 ----------
 hd_dc_con_hybrid_culture_decision: "호한 합류"
 hd_dc_con_hybrid_culture_decision_desc: "중원에 들어와 주인이 된 지 오래, 옛 풍속과 한의 제도는 이미 어우러졌다. 본족 문화와 도성의 한 문화를 합쳐 새로운 문화를 세우고, 중화의 정통을 잇는다."
 hd_dc_con_hybrid_culture_decision_tooltip: "호한 혼합 문화를 창설합니다"
 hd_dc_con_hybrid_culture_decision_confirm: "호와 한은 한 집안이다"
 hd_dc_con_capital_han_tt: "도성이 있는 현의 문화가 한인(중화 전승) 문화임"
 hd_dc_con_can_hybridize_tt: "도성 문화와 혼합할 수 있음(문화 혼합 기능과 해당 게임 규칙이 켜져 있어야 함)"
 hd_dc_con_hybrid_heritage_tt: "새 문화는 중화의 정통을 잇습니다. 당신이 직할하는 본족 현과, 궁중에 함께 있는 배우자와 자녀도 모두 새 풍속을 따르게 됩니다"

 # ---------- 汉化改制 ----------
 hd_dc_con_sinicization_decision: "한화 개제"
 hd_dc_con_sinicization_decision_desc: "이하변이, 중화로써 오랑캐를 바꾼다. 천도하고, 복식을 바꾸고, 성을 고치고, 호어를 금하여 옛 풍속을 모두 고치고 한의 제도를 시행한다. 개제는 한번 반포되면 차례로 추진되며, 단계마다 본족 귀족의 불만을 사고 심지어 병변을 부를 수도 있다."
 hd_dc_con_sinicization_decision_tooltip: "한화 개제를 반포합니다"
 hd_dc_con_sinicization_decision_confirm: "한화를 시행하라는 조서를 내린다"
 hd_dc_con_sinicization_decision_effect_tt: "천도, 역복, 개성, 금호어의 네 가지 조령이 2~3년 간격으로 차례로 반포되며, 단계마다 중단할 수 있습니다. 본족 훈귀들은 단계를 거듭할수록 원망을 품고 #EMP 심지어 군사를 일으켜 난을 일으킬 수도 있으며#!, 한인 봉신들은 날로 마음을 붙입니다. 네 가지가 모두 이루어지면 당신은 호한 합류의 풍속으로 바뀝니다.\n한 단계를 추진할 때마다:"
 hd_dc_con_native_vassals_tt: "모든 본족 [vassal|E]"
 hd_dc_con_han_vassals_tt: "모든 한인 [vassal|E]"
 hd_dc_con_sinicization_active_tt: "한화 개제가 아직 시행되지 않음"
 hd_dc_con_baosu_blocks_tt: "'보속'을 반포한 적이 없음"
 hd_dc_con_sinicization_abandoned_tt: "10년 내에 한화 개제를 폐지한 적이 없음"
 hd_dc_con_native_revolt_risk_tt: "본족 가운데 원망을 품은 가장 강한 봉신이 군사를 일으켜 난을 일으킴"
 hd_dc_con_capital_already_han_tt: "도성이 이미 한나라 땅에 있어 다시 옮길 필요가 없음"
 hd_dc_con_sinicization_native_opinion: "한화 개제"
 hd_dc_con_sinicization_han_opinion: "한화 개제"
 hd_dc_con_yifu_modifier: "역복"
 hd_dc_con_yifu_modifier_desc: "천자가 한나라의 의관으로 갈아입어 화하의 정통임을 보인다."

 # ---------- 保俗 ----------
 hd_dc_con_baosu_decision: "보속"
 hd_dc_con_baosu_decision_desc: "나라의 근본은 본족의 궁마에 있다. 조종의 옛 풍속을 엄히 지키고 본족 장병을 후대하니, 한인들의 원망은 근심할 것이 못 된다."
 hd_dc_con_baosu_decision_tooltip: "본족의 옛 풍속을 지킵니다"
 hd_dc_con_baosu_decision_confirm: "조종의 제도를 굳게 지키라"
 hd_dc_con_baosu_decision_effect_tt: "20년 동안 조종의 제도를 굳게 지키며 한화를 논하지 않습니다:"
 hd_dc_con_sinicization_blocks_tt: "한화 개제를 시행한 적이 없음"
 hd_dc_con_baosu_active_tt: "'보속'이 시행 중이 아님"
 hd_dc_con_baosu_levy_modifier: "보속"
 hd_dc_con_baosu_levy_modifier_desc: "천자가 조종의 제도를 굳게 지키고 본족을 후대하니, 일족의 자제들이 앞다투어 종군한다."
 hd_dc_con_baosu_han_opinion: "보속하며 한을 경시함"

 # ---------- 前朝遗民 ----------
 hd_dc_con_watched_tt: "이 사람은 앞으로 여러 해 동안 당신의 감시 아래 놓여, 다시는 몰래 일을 꾸미기 어려울 것입니다."
 hd_dc_con_remnant_honored_opinion: "전조 종실을 우대함"
 hd_dc_con_remnant_honored_han_opinion: "전조 유민을 우대함"
 hd_dc_con_remnant_killed_han_opinion: "전조 종실을 주살함"

 # ---------- 事件：圈地 ----------
 hd_dc_con.0100.t: "권지"
 hd_dc_con.0100.desc: "용을 따른 장수들이 거듭 진언한다. 중원의 기름진 땅은 마땅히 공신들에게 나누어 주어야 하며, 밭의 한인 백성은 내쫓든 부리든 새 주인의 뜻에 맡기자는 것이다.\n\n어느 주의 땅을 권점할 것인가?"
 hd_dc_con.0100.a: "[hd_dc_con_slot_1.GetName]의 땅을 권점한다"
 hd_dc_con.0100.b: "[hd_dc_con_slot_2.GetName]의 땅을 권점한다"
 hd_dc_con.0100.c: "[hd_dc_con_slot_3.GetName]의 땅을 권점한다"
 hd_dc_con.0100.d: "[hd_dc_con_slot_4.GetName]의 땅을 권점한다"
 hd_dc_con.0100.e: "잠시 그만둔다"

 # ---------- 事件：汉化改制 ----------
 hd_dc_con.0201.t: "한화 개제: 천도"
 hd_dc_con.0201.desc: "옛 도읍은 한쪽 구석에 치우쳐 있고 풍속이 거칠어 천하를 경영할 곳이 못 된다. 조정에서는 한나라 땅의 중심부로 도읍을 옮겨 중원의 사민과 가까이하자는 논의가 오간다. 본족 훈귀들은 고향을 떠나기 아쉬워하여 여론이 들끓는다."
 hd_dc_con.0201.a: "천도는 반드시 해야 할 일이다"
 hd_dc_con.0201.b: "뭇사람의 뜻을 거스르기 어려우니, 개제 논의를 멈춘다"
 hd_dc_con.0202.t: "한화 개제: 역복"
 hd_dc_con.0202.desc: "새 도읍이 정해지자 조정과 재야에 한나라의 의관으로 갈아입고 호복을 금하라는 조령이 내려졌다. 늙은 신하들은 옛 도포를 어루만지며 말없이 침묵한다."
 hd_dc_con.0202.a: "의관이 바뀌었으니 인심도 새로워지리라"
 hd_dc_con.0202.b: "역복의 명을 거두고 개제를 그만둔다"
 hd_dc_con.0203.t: "한화 개제: 개성"
 hd_dc_con.0203.desc: "종실과 훈귀의 복성은 대개 부락의 옛 이름에서 나왔다. 조서를 내려 한성으로 고치고 그 문벌을 정하여 중원의 사족과 어깨를 나란히 하게 한다."
 hd_dc_con.0203.a: "한성을 반포하고 그 문벌을 정한다"
 hd_dc_con.0203.b: "조상의 성은 고치기 어려우니, 개제를 그만둔다"
 hd_dc_con.0204.t: "한화 개제: 금호어"
 hd_dc_con.0204.desc: "마지막 조서이다. 무릇 조정에 있는 이는 더 이상 본족의 말을 써서는 안 되며, 어기는 자는 작위를 깎고 관직에서 내친다. 이 조서가 내려지면 개제는 대업을 이룬다."
 hd_dc_con.0204.a: "북방 말을 끊고 오로지 정음을 따르라"
 hd_dc_con.0204.b: "이 명은 지나치니, 개제를 그만둔다"

 # ---------- 事件：前朝遗民 ----------
 hd_dc_con.0300.t: "전조의 유민"
 hd_dc_con.0300.desc: "전조의 종실 [hd_dc_con_remnant.GetShortUIName](이)가 아직 살아 있다. 옛 나라의 유민들은 그를 잊지 못하고, 조정의 의논도 분분하다. 후하게 우대하여 한인의 마음을 거두자는 이도 있고, 엄히 감시하자는 이도 있으며, 낮은 목소리로 풀을 베려면 뿌리까지 뽑아야 한다고 말하는 이도 있다."
 hd_dc_con.0300.desc.landed: "\n\n이 사람은 지금도 봉지를 차지하고 있으니, 경계하지 않을 수 없다."
 hd_dc_con.0300.desc.landless: "\n\n이 사람은 지금 떠돌며 의지할 데가 없으니, 후하게 대우하여 너그러움을 보이기에 알맞다."
 hd_dc_con.0300.a: "전조 종실을 우대함"
 hd_dc_con.0300.b: "엄히 감시한다"
 hd_dc_con.0300.c: "풀을 베고 뿌리까지 뽑는다"
