l_korean:
 hd_cao_chain.0001.t:0 "궁문의 핏자국"
 hd_cao_chain.0001.desc:0 "오부가 동탁을 찌르려다 실패하여 이미 처형되었다. 소식이 전해지자 사람들은 먼저 문밖을 한번 살피고서야 목소리를 낮추었다. 마치 그 칼을 입에 올리기만 해도 죽음을 부를 것처럼.\n\n당신은 암살의 경위를 들으며 책상 모서리에 손가락을 멈추었다. 조정에서 동탁을 욕하는 이는 적지 않았으나, 감히 그 앞까지 걸어간 이는 이제 아무도 입에 올리지 못하는 시신 한 구가 되었다. 오부는 그를 죽이지 못했고, 도리어 그에게 궁문마다 병사를 깔고 곁에 다가오는 모든 이를 의심할 구실만 더 주었다.\n\n남이 먼저 나서기만 기다린다면, 당신들은 아마 이렇게 낮은 목소리로 수군거리며 여러 해를 더 보낼 수 있을 것이다. 다만 그때가 되면, 조정에 남아 있을 이가 누구이겠는가?"
 hd_cao_chain.0001.a:0 "오군의 죽음을 거울로 삼아야 하리라."
 hd_cao_chain.0002.t:0 "눈물에 젖은 좌중"
 hd_cao_chain.0002.desc:0 "오부가 죽은 뒤로 조정의 의론은 더욱 조심스러워졌다. 왕윤이 연회를 핑계로 옛 신하들을 불러 모았는데, 문이 닫히자 좌중의 누군가가 고개를 숙이더니 이내 소매로 얼굴을 가리고 흐느꼈다. 술을 몇 모금 마시기도 전에 울음소리가 말소리를 덮어 버렸다.\n\n당신은 그들이 동탁의 죄상을 하나하나 늘어놓는 것을 들었다. 누가 쫓겨났고, 무엇을 빼앗겼으며, 천자가 어떻게 제압당하고 있는지. 나중에는 모두가 한 왕실이 망하게 되었다는 말만 되풀이할 뿐이었다. 마치 슬픔을 충분히 절절하게 말하기만 하면 신하의 본분을 다한 것처럼.\n\n당신의 입에서 웃음소리가 새어 나왔다. 눈물 젖은 눈 몇 쌍이 당신을 향했고, 왕윤도 말을 멈추었다. 좌중은 마침내 울음을 그쳤으나, 모두가 당신이 어찌 웃을 수 있는지 해명하기를 기다리고 있었다."
 hd_cao_chain.0002.a:0 "밤새 울어 아침이 되고 아침부터 울어 밤이 된들, 울어서 동탁을 죽일 수 있겠소?"
 hd_cao_chain.0003.t:0 "칼을 빌리다"
 hd_cao_chain.0003.desc:0 "그 연회 뒤로도 왕윤은 당신의 웃음소리를 잊지 않았다. 다시 동탁을 주살할 일을 논의할 때, 그는 먼저 좌우를 물리고 그날 당신이 한 말이 한때의 격분이었는지, 아니면 이미 계획이 있었던 것인지를 물었다.\n\n“울음으로는 역적을 없앨 수 없으나, 칼이라면 혹 가능할지도 모르지요.” 당신은 천천히 말했다. 동탁은 아직 당신이 곁에 다가오는 것을 허락하니, 다른 이들은 들어갈 수 없는 그 문을 당신은 아직 들어설 기회가 있다. 왕윤은 한참을 대답하지 않다가, 마침내 칠성보도를 꺼내 두 사람 사이에 놓았다.\n\n당신이 칼자루를 쥐고 살짝 뽑자, 차가운 빛이 손가락 마디에 비쳤다. 칼을 빌리기는 쉽다. 그러나 정말로 뽑아야 할 때, 그 위험을 대신 짊어져 줄 공경들은 없다. 이번에는 당신이 스스로 동탁 앞으로 걸어가야 한다."
 hd_cao_chain.0003.a:0 "칼은 이미 손에 있으니, 나머지는 내게 달렸다."
 hd_cao_chain.0003.a.tt:0 "칠성보도가 이미 당신의 허리에 채워졌습니다."
 hd_cao_chain.0004.t:0 "거울 속의 차가운 빛"
 hd_cao_chain.0004.desc:0 "칠성도를 몸에 숨기고 있으니, 옷감 너머로도 칼집의 모서리가 느껴졌다. 당신은 동탁에게 다가가, 그가 시선을 돌리기를 기다렸다가 천천히 칼자루를 쥐었다.\n\n하필 칼날이 칼집에서 나오는 순간, 구리 거울 속에서 한 점 빛이 번뜩였다. 동탁이 홱 돌아보며 칼을 들고 무엇을 하려느냐고 물었다. 당신은 생각할 겨를도 없이 칼을 가로로 받쳐 들고 몸을 숙여, 특별히 바치러 온 보물이라고 말했다. 그 시선은 여전히 당신의 등에 머물러 있었다. 조금만 더 서 있다가는, 방금 한 핑계가 캐묻는 말을 견뎌 내지 못할지도 모른다.\n\n당신은 마침내 문밖으로 물러났고, 손바닥은 이미 흠뻑 젖어 있었다. 역적을 없애려던 계획은 수포로 돌아갔고, 다음 부름에는 결코 응해서는 안 된다. 지금 가장 중요한 것은 추격하는 기병이 성을 나서기 전에 충분히 멀리 달아나는 것이다."
 hd_cao_chain.0004.a:0 "일이 틀어졌다. 어서 달아나자!"
 hd_cao_chain.0006.t:0 "도중의 옛 피"
 hd_cao_chain.0006.desc:0 "내무의 거처는 이미 잘 정돈되었고, 문밖에서는 마침내 추격하는 기병의 기척이 끊겼다. 차고 있던 검을 풀고 나서야, 당신은 자신이 여전히 문 앞을 지나는 발소리 하나하나에 신경을 곤두세우고 있음을 깨달았다.\n\n여백사 일가의 피도 당신을 따라 이곳까지 왔다. 세객과 소문은 저마다 다른 이야기를 늘어놓았으니, 마치 당신의 선악을 정해 주기만 하면 그날 밤을 다시 겪을 수 있다는 듯했다. 그러나 당신은 칼이 내려가던 순간, 자신이 그들이 말하는 것만큼 태연하지 않았음을 기억한다.\n\n등불이 검의 그림자를 책상 위에 드리웠다. 당신은 손을 뻗어 검을 밀어내고 문밖의 사람을 불러들였다. 아직 당신을 따르려는 이도 있고, 당신이 어떻게 망하는지 지켜보려는 이도 있다. 지금 멈추어 모두에게 일일이 해명한다면, 오히려 그들의 바람대로 되어 줄 뿐이다."
 hd_cao_chain.0006.a:0 "차라리 내가 남을 저버릴지언정, 남이 나를 저버리게 하지는 않으리라."
 hd_cao_chain.0094.t:0 "내무에서 무리를 정비하다"
 hd_cao_chain.0094.desc:0 "내무성 밖에 또 막사가 늘었다. 종족과 옛 부하들의 소식이 잇달아 전해지니, 올 수 있는 이들은 저마다 부곡과 가산을 이끌고 왔고, 직접 오지 못하는 이들도 사람을 보내 군중에 부족한 것이 무엇인지 물었다. 며칠 전만 해도 길목마다 추격하는 기병을 경계해야 했는데, 이제는 당신의 명령을 기다리는 이들이 있다.\n\n돈과 곡식, 단양병의 명부가 책상 앞에 올라오자, 당신은 하나하나 살펴본 뒤 지도의 한 귀퉁이에 눌러 두었다. 발 디딜 곳이 이미 생겼으니, 이제 해야 할 일은 동탁의 추적을 피하는 것만이 아니다. 사방에 흩어진 분노를 누군가는 군령과 군량 길, 그리고 기꺼이 앞으로 나아갈 대오로 바꾸어야 한다.\n\n당신은 진영에 대오를 다시 정비하라고 명했다. 천하가 아직 정해지지 않았으니, 조씨는 잠시 몸 둘 곳을 얻은 도망자 집안으로만 머물러서는 안 된다."
 hd_cao_chain.0094.a:0 "내무를 기반으로 삼아 군을 정비하고 출격을 기다리라."
 hd_cao_chenliu_danyang_army:0 "내무 단양병"
