l_korean:
 # 五胡乱华（见 docs/五胡乱华_僚人入蜀_设计草案.md 第 4 节）

 rule_hd_wuhu_rule: "오호난화"
 setting_hd_wuhu_rule_historical: "#high 역사#!"
 setting_hd_wuhu_rule_historical_desc: "남흉노, 무도의 저족, 오환이 역사적 연도에 맞추어 땅을 청하러 오며, 280년 이후의 난세에는 내부한 호족이 군사를 일으켜 자립하고, 유연과 석륵 등이 역사적 연도 전후에 거병합니다. 439년부터는 변경 수용, 일반 땅 요청, 이민족 내지 이주 결단, 점진적 호화가 더 이상 일어나지 않습니다."
 setting_hd_wuhu_rule_random: "#high 무작위#!"
 setting_hd_wuhu_rule_random_desc: "연도 범위와 관계없이 조건만 충족되면 일어날 수 있습니다. 439년의 마감은 여전히 유효합니다."
 setting_hd_wuhu_rule_player_only: "#high 플레이어만#!"
 setting_hd_wuhu_rule_player_only_desc: "AI는 스스로 땅을 청하거나 거병하거나 독립을 추진하지 않습니다. 변경 수용과 점진적 호화는 평소대로 일어나며, 플레이어는 여전히 관련 결단을 사용할 수 있습니다."
 setting_hd_wuhu_rule_off: "#high 비활성화#!"
 setting_hd_wuhu_rule_off_desc: "오호난화를 비활성화합니다."

 hd_wuhu_land_seized_opinion: "봉토를 강제로 떼어 호인을 정착시키다"

 ### 第二层：边疆收留链
 hd_wuhu.2000.t: "변경 호족 부락의 귀부 요청"
 hd_wuhu.2000.desc: "[hd_wuhu_nomads_county.GetNameNoTier] 일대의 호인 부중이 경계를 넘어 방목하면서, 초지와 물을 두고 현지 백성과 걷잡을 수 없이 다투고 있다.\n\n오늘 이 호인들의 수령 [turkic_leader.GetName](이)가 직접 당신을 만나러 왔다. [turkic_leader.GetSheHe|U](은)는 부중이 변새 밖에서 더는 버틸 수 없으니 당신의 영역 안에 몸 붙일 곳을 찾게 해 달라고 청한다. 그 대가로 [turkic_leader.GetHerHis] 기병들이 당신을 위해 싸우겠다고 한다."
 hd_wuhu.2000.a: "받아들여 나를 위해 쓰게 하라."
 hd_wuhu.2000.b: "호인은 변덕스러우니, 변새 밖으로 돌려보내라."

 hd_wuhu.2001_opening: "주상께 올립니다"
 hd_wuhu.2001_letter: "이제 고아 둘을 보냅니다. 그들의 부모는 이미 굶어 죽었는데, 다름 아닌 [turkic_leader.GetCulture.GetName]인의 말 떼가 그 집의 곡식과 과수원을 짓밟았기 때문입니다. 주상께서 이토록 호인을 후대하시니, 호인에게 해를 입은 이들에 대한 책임도 기꺼이 지시리라 믿습니다."
 hd_wuhu.2001.a: "이자는 참으로 무례하구나……"
 hd_wuhu.2002_opening: "주상께 올립니다"
 hd_wuhu.2002_letter: "지난번 호인의 일은 제가 분수를 잃은 것이라 지금까지도 후회하고 있습니다. 듣자니 그들이 이미 [nomads_county.GetNameNoTier](을)를 떠났고, 백성과의 다툼도 차츰 가라앉았다고 합니다. 저는 여전히 주상께서 호인을 경계하셔야 한다고 생각하오나, 서역 호상이 가져온 금병 몇 개를 삼가 바쳐 경의를 표합니다."
 hd_wuhu.2002.a: "예물이 왔으니 지난 일은 없던 것으로 하겠다."
 hd_wuhu.2002.b: "원래 물건을 돌려줄 테니, 알아서 처신하라."
 hd_wuhu.2003.t: "호족 부락의 부세"
 hd_wuhu.2003_beginning: "보아하니 당신의 [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('greedy_chaplain'))] [greedy_chaplain.GetFirstName](이)가 [turkic_leader.GetName](와)과 [turkic_leader.GetHerHis] 부중을 지켜본 지 꽤 된 모양이다.\n\n“[ROOT.Char.Custom('FormOfAddressForLiege')],” [greedy_chaplain.GetFirstNameNoTooltip](이)가 말했다. “저 호인들은 우리 땅에 살고 우리 풀을 먹으면서도 호적에 따라 부세를 내지 않습니다."
 hd_wuhu.2003_jizya: "제가 보기에는 머릿수에 따라 따로 세금을 내게 해야 합니다.”\n\n"
 hd_wuhu.2003_not_jizya: "제가 보기에는 천막 수에 따라 따로 부세를 바치게 해야 합니다. 주군께서는 그들을 이미 충분히 너그럽게 대하셨습니다.”\n\n"
 hd_wuhu.2003_ending: "“이건 공정하지 않습니다!” [turkic_leader.GetFirstNameNoTooltip](이)가 항변했다. “저는 수하의 기사들을 이끌고 직접 주군을 위해 힘쓰고 있습니다. 주군께서 저희에게 이렇게 세금을 매기지만 않으신다면, 이 은혜를 반드시 기억하겠습니다.”"
 hd_wuhu.2003.a: "너희 부락이 감춘 동전 한 닢까지 찾아내리라!"
 hd_wuhu.2003.b: "[greedy_chaplain.GetFirstNameNoTooltip]의 말이 옳다. 너희는 부세를 내야 한다."
 hd_wuhu.2003.c: "되었다. [turkic_leader.GetFirstNameNoTooltip]의 말도 일리가 있다."
 hd_wuhu.2004.t: "호족 기병이 남긴 고아"
 hd_wuhu.2004.desc: "[orphan_girl.GetName](이)가 당신 앞에 서 있는데, 그 모습이 참으로 가엾다. 그녀의 남동생 [orphan_boy.GetName]도 마찬가지로 온몸이 상처투성이다.\n\n“제발요, [ROOT.Char.GetTitleTierName],” 그녀가 떨리는 목소리로 말했다. “저희는 벌써 며칠째 아무것도 먹지 못했어요. 밥 좀 주실 수 있나요? 쉰 밥이라도 괜찮아요…….”\n\n더 물어보니, 사실 그녀도 누구를 탓해야 할지 분명히 말하지 못했다. “말을 탄 사람들이 저희 농사를 망치고, 양을 빼앗아 갔어요……. 그리고 사라져 버렸어요. 앞으로 어떻게 해야 할지 모르겠어요. [upset_vassal.GetTitledFirstName]께서 이런 사소한 일로 폐를 끼쳐서 죄송해요.”"
 hd_wuhu.2004.a: "두려워 마라, 내 곁에 머물거라."
 hd_wuhu.2004.b: "[turkic_leader.GetFirstNamePossessiveNoTooltip] 부락이 너희를 거두어 기르는 것이 공정하다."
 hd_wuhu.2004.c: "절이나 도관에 보내 세속 밖에 의탁하게 한다."
 hd_wuhu.2004.d: "[upset_vassal.GetFirstNameNoTooltip](은)는 무슨 속셈인가? 너희는 다른 곳을 찾아보거라."
 hd_wuhu.2005.t: "호족 기병의 참전"
 hd_wuhu.2005.desc: "당신이 전쟁 때문에 근심하고 있을 때, [turkic_leader.GetName](이)가 기병 한 무리를 이끌고 왔다.\n\n“[ROOT.Char.GetTitleTierName],” [turkic_leader.GetSheHe](이)가 예를 올리며 말했다. “저는 당신을 지지하겠다고 약속했고, 제 부락도 그렇게 약속했습니다. 지금 전쟁 중이시니, 숙련된 기사 한 무리를 더 빌려 드려 이번 싸움만 돕겠습니다. 전쟁이 끝나면 그들은 자기 천막과 가족 곁으로 돌아가야 합니다. 이 인정만 잊지 말아 주십시오.”"
 hd_wuhu.2005.a: "좋다, 이 인정은 기억해 두겠다."
 hd_wuhu.2005.b: "인정이니 뭐니 하는 말은 다시 꺼내지 마라!"
 hd_wuhu.2005.c: "마음은 고맙게 받겠으나, 이번 싸움은 내 힘으로 감당할 수 있다."
 hd_wuhu.2006.t: "빗나간 화살"
 hd_wuhu.2006_beginning: "[one_eyed_child.GetName](이)가 여느 때처럼 [ROOT.Char.Custom('ResidenceBuilding')] 안을 뛰어다니다가 뜻밖의 일을 당했다. [turkic_leader.GetName](이)가 [turkic_leader.GetHerHis] 전사들을 데리고 활쏘기를 연습하던 중, 빗나간 화살 하나가 장난꾸러기인 당신의 [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('one_eyed_child'))]의 눈에 맞은 것이다."
 hd_wuhu.2006_has_court_physician: "“[one_eyed_child.GetSheHe|U]의 목숨에는 지장이 없습니다.” 의원 [scoped_physician.GetFirstName](이)가 말했다. “안타깝게도 이 눈은 지킬 수 없겠습니다. 외람된 말씀이지만, 앞으로 뜰에서는 활을 덜 쏘는 편이 좋겠습니다.”\n\n"
 hd_wuhu.2006_no_court_physician: "급히 불러온 현지 의원은 [one_eyed_child.GetSheHe](이)가 나을 것이라고 했지만, 그 눈은 영영 보이지 않게 되었다.\n\n"
 hd_wuhu.2006_ending: "“이건 사고였습니다.” [turkic_leader.GetFirstName](이)가 변명했다. “부디 서둘러 벌하지 마십시오, [ROOT.Char.Custom('FormOfAddressForLiege')]. 저희가 훈련하지 않으면 어떻게 주군을 위해 이 땅을 지키겠습니까?”"
 hd_wuhu.2006.a: "하옥하여 옥중에서 궁술을 반성하게 하라."
 hd_wuhu.2006.b: "이제부터 [ROOT.Char.Custom('ResidenceBuilding')] 근처에서는 활쏘기를 금한다."
 hd_wuhu.2006.c: "이는 하늘의 뜻이지 사람의 잘못이 아니다."
 hd_wuhu.2007.t: "상로의 약탈"
 hd_wuhu.2007.desc: "“[ROOT.Char.GetTitleTierName],” 당신의 [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('warmonger_councillor'))] [warmonger_councillor.GetFirstName](이)가 말했다. “[bandits_county.GetName]의 상인들이 마적에게 약탈당했다고 합니다. 지금 상단들이 모두 그 일대를 돌아서 다니니 장사가 다 틀어졌습니다. 제가 가서 이 일을 조사하게 해 주십시오.”\n\n“그럴 필요 없습니다.” [turkic_leader.GetName](이)가 먼저 나서서 말했다. “앞으로 저희가 [bandits_county.GetNameNoTierNoTooltip]에서 방목하도록 허락해 주시기만 하면, 제 전사들을 보내 상로를 오래도록 호위하겠습니다. 이 방법이 더 낫지 않습니까?”\n\n[warmonger_councillor.GetFirstNameNoTooltip](은)는 반대했다. “조심하십시오, [ROOT.Char.Custom('FormOfAddressForLiege')]. 백성들은 주군께서 호인이 사방에서 유목하도록 내버려 두는 것을 가장 싫어합니다.”"
 hd_wuhu.2007.a: "[turkic_leader.GetFirstNamePossessiveNoTooltip] 방법이 더 타당하다."
 hd_wuhu.2007.b: "이 일은 그대에게 맡겨 조사하게 하겠다."
 hd_wuhu.2007.c: "시간이 지나면 상인들은 저절로 다시 올 것이다."

 hd_wuhu.2099.t: "[turkic_leader.GetFirstNamePossessiveNoTooltip] 봉토 요청"
 hd_wuhu.2099.desc: "[turkic_leader.GetName](와)과 [turkic_leader.GetHerHis] 부중은 이미 여러 해 동안 당신을 위해 힘써 왔다. 오늘 [turkic_leader.GetSheHe](이)가 정중하게 당신을 찾아왔다.\n\n“[ROOT.Char.Custom('FormOfAddressForLiege')], 저희 사람들은 당신의 영역 안에서 아이를 낳고 노인을 묻으며 이곳을 이미 집으로 여기게 되었습니다. 그런데 저희는 아직도 남의 집에 얹혀사는 신세입니다. 부디 땅 한 조각을 내려 주시어 부중이 진정으로 자리 잡게 해 주십시오.”\n\n이번에는 [turkic_leader.GetSheHe](이)가 결코 빈손으로 돌아가려 하지 않을 것이 분명하다."
 hd_wuhu.2099.a: "[hd_wuhu_grant_county_1.GetNameNoTier](을)를 너에게 내리겠다."
 hd_wuhu.2099.b: "[hd_wuhu_grant_county_2.GetNameNoTier](은)는 어떠한가?"
 hd_wuhu.2099.c: "[hd_wuhu_grant_county_3.GetNameNoTier]만은 줄 수 있다."
 hd_wuhu.2099.d: "이 일은 결코 안 된다."
 hd_wuhu.2099.d.tt: "#EMP [turkic_leader.GetFirstNameNoTooltip](이)가 소매를 떨치고 떠나거나, 무리를 모아 난을 일으킬 수 있습니다.#!"

 ### 第三层：胡帅带兵求地
 hd_wuhu.3001.t: "호족 부락의 귀부"
 hd_wuhu.3001.desc: "변새 밖의 [hd_wuhu_chief.GetCulture.GetNameNoTooltip] 부중이 변경에 이르렀고, 수령 [hd_wuhu_chief.GetName](이)가 사람을 보내 당신을 뵙기를 청했다. 그들은 [hd_wuhu_petition_target.GetNameNoTier]에 머물고자 하며,"
 hd_wuhu.3001.desc_vassal: "당신의 신하가 되어 전시에는 당신을 위해 힘쓰겠으니, 당신의 치하에서 몸 붙일 곳을 달라고 한다.\n\n그들이 이미 막다른 길에 몰렸다는 것은 분명하다. 그러나 갈 곳이 없기 때문에, 당신이 거절하는 순간 충돌은 피할 수 없다."
 hd_wuhu.3001.desc_independent: "당신을 주인으로 받들고 당신을 위해 힘쓰겠으니, 당신 치하의 땅 한 조각을 달라고 한다.\n\n그들이 막다른 길에 몰렸는지도 모른다. 그러나 저 사나운 기병들을 보면, 이것은 요청이라기보다 최후통첩에 가깝다."
 hd_wuhu.3001.a: "내 호령을 따른다면 [hd_wuhu_petition_target.GetNameNoTierNoTooltip](을)를 너희에게 주겠다."
 hd_wuhu.3001.b: "어림없다! 오랑캐에게는 한 치의 땅도 내줄 수 없다!"

 HD_WUHU_PETITION_CB_NAME: "호족 부락의 땅 요청"
 HD_WUHU_PETITION_WAR_NAME: "[ATTACKER.GetCulture.GetNameNoTooltip] 부락의 [TITLE.GetNameNoTier] 요구"
 hd_wuhu_petition_cb: "$HD_WUHU_PETITION_CB_NAME$"
 hd_wuhu_petition_cb_victory_desc: "호족 부락이 무력으로 분쟁 중인 [titles|E](을)를 빼앗았습니다."
 hd_wuhu_petition_cb_victory_desc_attacker: "당신이 무력으로 분쟁 중인 [titles|E](을)를 빼앗았습니다."
 hd_wuhu_petition_cb_defeat_desc: "호족 부락이 격파되어 당신의 땅을 떠날 수밖에 없었습니다."
 hd_wuhu_petition_cb_defeat_desc_attacker: "당신은 다른 곳을 찾아야 합니다."
 hd_wuhu_petition_cb_white_peace_desc: "호족 부락이 그 용맹으로 땅을 받아 당신의 봉신이 되었습니다."
 hd_wuhu_petition_cb_white_peace_desc_attacker: "당신은 정착할 수 있는 땅을 얻고, 방어 측의 봉신이 되었습니다."

 hd_wuhu_frontier_army_name: "귀부한 호족 기병"
 hd_wuhu_frontier_revolt_army_name: "배반한 호인"
 hd_wuhu_petition_army_name: "내부한 호족 부락"

 ### 史实大单于
 hd_wuhu_chanyu_decision: "거병하여 자립"
 hd_wuhu_chanyu_decision_desc: "천하가 크게 어지러워 진 황실의 여러 왕이 서로 공격하니, 조정은 더 이상 변경을 돌볼 겨를이 없다. 나의 족인들은 변새 안에 흩어져 산 지 이미 여러 대가 지났고, 갖은 부림과 업신여김을 받아 왔다. 지금이야말로 부중을 불러 모아 자립할 때다."
 hd_wuhu_chanyu_decision_tooltip: "부중을 불러 모아 거병하고 자신의 나라를 세운다"
 hd_wuhu_chanyu_decision_confirm: "거병하라!"
 hd_wuhu_chanyu_decision_year_ok: "거병할 해가 되었음"
 hd_wuhu_chanyu_decision_phase_ok: "왕조 순환이 동요, 신왕조 정복, 투쟁, 대치 또는 붕괴 단계에 있음"
