l_korean:
 building_type_hd_shouchun_city_01:0 "수춘성"
 building_type_hd_shouchun_city_01_desc:0 "수춘은 회수 남쪽 기슭에 있으며 팔공산을 등지고, 비수가 성을 둘러 북쪽으로 흘러 회수에 든다. 초 고열왕이 동쪽으로 옮겨 이곳에 도읍하고 여전히 영이라 불렀으며, 한나라가 일어선 뒤 회남왕 유안도 이곳에 도읍하여 빈객과 방사를 불러 모아 책을 짓고 도를 논하니, 이 성은 마침내 회남 제일의 도회가 되었다."
 building_hd_shouchun_city_01:0 "$building_type_hd_shouchun_city_01$"
 building_hd_shouchun_city_01_desc:0 "$building_type_hd_shouchun_city_01_desc$"
 building_type_hd_jinyang_city_01:0 "진양성"
 building_type_hd_jinyang_city_01_desc:0 "진양은 조간자의 가신 동안우가 쌓은 옛 성이다. 지백이 물을 끌어 성을 잠기게 하자 성안에서는 솥을 매달아 밥을 지었으나, 조양자는 끝까지 버티며 항복하지 않았고 마침내 지씨를 멸했다. 성은 분수 가에 있으며, 지금은 태원군의 치소이자 병주의 요충이다."
 building_hd_jinyang_city_01:0 "$building_type_hd_jinyang_city_01$"
 building_hd_jinyang_city_01_desc:0 "$building_type_hd_jinyang_city_01_desc$"
 building_type_hd_yubi_city_01:0 "옥벽성"
 building_type_hd_yubi_city_01_desc:0 "하동군 분수 남쪽 기슭에 높은 언덕이 하나 있는데, 언덕 위는 평탄하고 사방은 골짜기가 깊이 패어 마치 천연의 성벽 같다. 언덕 위에 서면 분수 하곡을 내려다볼 수 있어, 태원과 평양 사이를 오가는 행인들이 모두 눈 아래에 있다."
 building_hd_yubi_city_01:0 "$building_type_hd_yubi_city_01$"
 building_hd_yubi_city_01_desc:0 "$building_type_hd_yubi_city_01_desc$"
 building_type_hd_baidi_city_01:0 "백제성"
 building_type_hd_baidi_city_01_desc:0 "파군 어복현에서 대강이 협곡 어귀를 뚫고 나가며, 산 벼랑이 벽처럼 솟아 있다. 공손술이 촉을 차지했을 때 우물 속에서 용 같은 흰 기운이 피어오르는 것을 보고 스스로 백제라 칭하며 산 위에 성을 쌓았다고 전한다. 성은 협곡 어귀에 높이 자리하여 파촉에서 동쪽으로 형초로 나가는 물길을 틀어막고 있다."
 building_hd_baidi_city_01:0 "$building_type_hd_baidi_city_01$"
 building_hd_baidi_city_01_desc:0 "$building_type_hd_baidi_city_01_desc$"
 building_type_hd_yecheng_city_01:0 "업성"
 building_type_hd_yecheng_city_01_desc:0 "업은 제 환공이 쌓은 옛 성이다. 전국 시대에 서문표가 업령이 되어 하백에게 아내를 바치는 악습을 없애고, 수로를 뚫어 장수를 끌어다 밭에 대니 업 땅이 이로써 풍요로워졌다. 지금은 위군의 치소로, 성곽이 반듯하고 시가가 번성하여 하북에서 손꼽히는 큰 성이다."
 building_hd_yecheng_city_01:0 "$building_type_hd_yecheng_city_01$"
 building_hd_yecheng_city_01_desc:0 "$building_type_hd_yecheng_city_01_desc$"
 building_type_hd_yecheng_three_platforms_01:0 "업성 삼대"
 building_type_hd_yecheng_three_platforms_01_desc:0 "업성 서북쪽 모퉁이는 성벽이 높고 두터우며 지대가 높고 시원하다. 성에 올라 북쪽을 바라보면 장수가 동쪽으로 흐르는 것이 보이고, 서쪽을 바라보면 태항산이 가로누워 있다. 이곳은 누대를 쌓아 경치를 감상하기에 꼭 알맞으니, 웅주가 이곳에 높은 누대를 세우고 빈객을 모은다면 반드시 천하에 이름을 떨칠 것이다."
 building_hd_yecheng_three_platforms_01:0 "$building_type_hd_yecheng_three_platforms_01$"
 building_hd_yecheng_three_platforms_01_desc:0 "$building_type_hd_yecheng_three_platforms_01_desc$"
 building_type_hd_pengcheng_city_01:0 "팽성"
 building_type_hd_pengcheng_city_01_desc:0 "팽성은 팽조의 봉국이었다고 전하며, 서초패왕 항우도 이곳에 도읍했다. 성은 사수와 획수가 만나는 곳에 자리하여 북쪽으로 제와 노를 누르고 남쪽으로 강회와 통하며, 성벽이 높고 크고 시가가 둘러 늘어서 있으니, 지금은 팽성국의 도읍이다."
 building_hd_pengcheng_city_01:0 "$building_type_hd_pengcheng_city_01$"
 building_hd_pengcheng_city_01_desc:0 "$building_type_hd_pengcheng_city_01_desc$"
 building_type_hd_linzi_city_01:0 "임치성"
 building_type_hd_linzi_city_01_desc:0 "임치는 제나라의 옛 도읍으로, 대성과 소성이 이어져 있고 궁전과 종묘, 시가가 저마다 제자리를 잡고 있다. 소진은 일찍이 이 성의 거리에서는 수레바퀴 통이 서로 부딪치고 행인이 어깨를 스치며, 소매를 들면 장막이 되고 땀을 뿌리면 비가 된다고 했다. 지금도 동방에서 으뜸가는 대도회다."
 building_hd_linzi_city_01:0 "$building_type_hd_linzi_city_01$"
 building_hd_linzi_city_01_desc:0 "$building_type_hd_linzi_city_01_desc$"
 building_type_hd_tongwan_city_01:0 "통만성"
 building_type_hd_tongwan_city_01_desc:0 "상군 북쪽 사연수 가에는 흰 흙으로 된 고지가 있는데, 사방에 모래벌과 물풀이 뒤섞여 있어 흉노와 강호의 부중이 이곳에서 자주 유목한다. 이곳의 흙은 희고 단단하여 다져 쌓으면 숫돌처럼 굳다."
 building_hd_tongwan_city_01:0 "$building_type_hd_tongwan_city_01$"
 building_hd_tongwan_city_01_desc:0 "$building_type_hd_tongwan_city_01_desc$"
 building_type_hd_zuoguo_city_01:0 "좌국성"
 building_type_hd_zuoguo_city_01_desc:0 "서하군 이석 북쪽의 좌국성은 남흉노 부중이 모여 사는 곳이다. 성벽이 둘러 있으나 성안의 민가는 드문드문하고, 펠트 천막과 가축 떼가 사방 들판에 흩어져 있어 변새의 황량한 기상이 감돈다."
 building_hd_zuoguo_city_01:0 "$building_type_hd_zuoguo_city_01$"
 building_hd_zuoguo_city_01_desc:0 "$building_type_hd_zuoguo_city_01_desc$"
 building_type_hd_xiangyang_city_01:0 "양양성"
 building_type_hd_xiangyang_city_01_desc:0 "양양성은 북쪽으로 한수에 닿아 강 건너 번성과 마주 보며, 성 남쪽에는 현산이 병풍처럼 막아서 있고 성은 높고 해자는 깊다. 남양에서 강릉으로 가는 큰길이 이곳을 지나니, 강한 사이에서 남북을 틀어막는 요충이다."
 building_hd_xiangyang_city_01:0 "$building_type_hd_xiangyang_city_01$"
 building_hd_xiangyang_city_01_desc:0 "$building_type_hd_xiangyang_city_01_desc$"
 building_type_hd_hefei_city_01:0 "합비성"
 building_type_hd_hefei_city_01_desc:0 "합비는 강회 사이에 자리하며, 여름에 물이 불면 시수와 비수가 이곳에서 합쳐지므로 합비라 이름 붙었다. 남방의 가죽과 절인 생선, 목재가 모두 이곳에서 모이고 흩어지니, 강회 사이의 상업 도회다."
 building_hd_hefei_city_01:0 "$building_type_hd_hefei_city_01$"
 building_hd_hefei_city_01_desc:0 "$building_type_hd_hefei_city_01_desc$"
