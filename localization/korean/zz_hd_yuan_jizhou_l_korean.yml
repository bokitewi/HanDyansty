l_korean:
 hd_yuan_jizhou.0001.t:0 "병력을 빌려 기주를 도모하다"
 hd_yuan_jizhou.0001.desc:0 "동탁을 토벌하던 여러 군대가 흩어졌지만, 발해의 보급로는 여전히 한복의 눈치를 보아야 한다. 군량을 재촉한 보고를 다 듣고 나서, 당신은 기주 북쪽의 동정을 물었다.\n\n한복은 풍요로운 주군을 차지하고 있으니, 외환이 없다면 당신의 ‘도움’이라는 말을 진지하게 들으려 하지 않을 것이다. 공손찬의 병마가 마침 북방에 있다. 그를 남하하도록 부른다면, 한복이 자신의 처지를 다시 따져 보게 만들 수 있을 뿐 아니라, 당신도 언제까지나 발해를 지키며 남의 도움을 기다리지 않아도 된다.\n\n북쪽으로 보낼 편지는 이미 발송되었다. 종이에 적힌 것은 함께 나아갈 길을 도모하자는 말이지만, 정말로 수를 둔 뒤에는 한복이 어떻게 구원을 청하고 공손찬이 어떻게 용병할지를 보아야 한다. 당신은 답장을 놓을 자리를 책상 위에 비워 두고, 두 곳의 소식이 차례로 오기를 기다린다."
 hd_yuan_jizhou.0001.a:0 "잠시 백규의 병세를 살피며 기주의 회신을 조용히 기다린다."
 hd_yuan_jizhou.0002.t:0 "기주의 주인이 바뀌다"
 hd_yuan_jizhou.0002.desc:0 "한복의 주인이 마침내 당신 앞에 놓였다. 받아 들고 보니 손에 느껴지는 무게는 생각보다 가벼웠고, 오히려 함께 넘겨받은 장부가 한 권 또 한 권 책상을 가득 덮었다.\n\n그의 주군과 부중은 이제 당신의 지휘 아래 들어왔고, 그 자신도 이미 부중에 들어와 거처를 마련했다. 북쪽의 옛 싸움도 이에 따라 멈추었지만, 공손찬이 바라던 이득은 앞서처럼 그의 손에 떨어지지 않았다. 좌우가 이 일을 꺼내자, 당신은 먼저 기주의 인수인계부터 마무리하라고 했다.\n\n보급로는 더 이상 남의 눈치를 볼 필요가 없고, 원씨는 마침내 한 주의 근본을 손에 쥐었다. 백규가 어떻게 생각할지는 훗날의 편지에서 드러날 것이다. 오늘 이 주인은 우선 당신이 잘 간수해 둔다."
 hd_yuan_jizhou.0002.a:0 "주인을 품에 넣고 기주를 다스린다."
 hd_yuan_jizhou_victory_desc:0 "공손찬이 기주 경내에서 한복이 차지한 땅을 빼앗고, 현지 봉신들도 그에 따라 소속을 바꿉니다."
 hd_yuan_jizhou_no_conquest_desc:0 "두 세력이 군사를 거두어 기주의 다툼은 이로써 끝납니다."
 hd_yuan_jizhou_handover_peace_desc:0 "기주의 형세가 바뀌어 이 전쟁은 명분을 잃었으므로 이로써 끝납니다."
 hd_yuan_life_jizhou:0 "기주 입주"
