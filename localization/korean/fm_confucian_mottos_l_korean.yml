 motto_fm_confucian_134:0 "아는 자는 좋아하는 자만 못하고"
 motto_fm_confucian_135:0 "좋아하는 자는 즐기는 자만 못하다"
 motto_fm_confucian_136:0 "중간 이상의 사람에게는 높은 것을 말할 수 있다"
 motto_fm_confucian_137:0 "지자요수 인자요산"
 motto_fm_confucian_138:0 "지혜로운 이는 움직이고 어진 이는 고요하다"
 motto_fm_confucian_139:0 "지혜로운 이는 즐겁고 어진 이는 오래 산다"
 motto_fm_confucian_140:0 "내가 서고자 하면 남을 세운다"
 motto_fm_confucian_141:0 "내가 이루고자 하면 남을 이루게 한다"
 motto_fm_confucian_142:0 "묵묵히 마음에 새기고 배움에 싫증 내지 않는다"
