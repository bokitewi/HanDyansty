 motto_fm_confucian_144:0 "분발하지 않으면 열어 주지 않고, 애태우지 않으면 일깨워 주지 않는다"
 motto_fm_confucian_145:0 "한 모퉁이를 들어 주었는데 세 모퉁이로 돌이키지 못하면"
