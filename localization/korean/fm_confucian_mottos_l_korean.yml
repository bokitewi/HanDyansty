l_korean:
 motto_confucian_motto:0 "$1$"

 # 大学
 motto_fm_confucian_001:0 "대학의 도는 밝은 덕을 밝히는 데 있고"
 motto_fm_confucian_002:0 "백성을 새롭게 하는 데 있으며, 지극한 선에 머무는 데 있다"
 motto_fm_confucian_003:0 "머무를 데를 안 뒤에야 정함이 있고"
 motto_fm_confucian_004:0 "정한 뒤에야 고요할 수 있으며"
 motto_fm_confucian_005:0 "고요한 뒤에야 편안할 수 있고"
 motto_fm_confucian_006:0 "편안한 뒤에야 생각할 수 있으며"
 motto_fm_confucian_007:0 "생각한 뒤에야 얻을 수 있다"
 motto_fm_confucian_008:0 "사물에는 근본과 말단이 있고, 일에는 끝과 시작이 있다"
 motto_fm_confucian_009:0 "먼저 할 것과 나중 할 것을 알면 도에 가깝다"
 motto_fm_confucian_010:0 "옛날 천하에 밝은 덕을 밝히고자 한 자는"
 motto_fm_confucian_011:0 "선치기국"
 motto_fm_confucian_012:0 "그 나라를 다스리고자 하면 먼저 그 집안을 가지런히 하고"
 motto_fm_confucian_013:0 "그 집안을 가지런히 하고자 하면 먼저 그 몸을 닦고"
 motto_fm_confucian_014:0 "그 몸을 닦고자 하면 먼저 그 마음을 바르게 하고"
 motto_fm_confucian_015:0 "그 마음을 바르게 하고자 하면 먼저 그 뜻을 정성스럽게 하고"
 motto_fm_confucian_016:0 "그 뜻을 정성스럽게 하고자 하면 먼저 그 앎을 지극히 한다"
 motto_fm_confucian_017:0 "앎을 지극히 함은 사물의 이치를 궁구하는 데 있다"
 motto_fm_confucian_018:0 "사물의 이치가 궁구된 뒤에 앎이 지극해지고"
 motto_fm_confucian_019:0 "앎이 지극해진 뒤에 뜻이 정성스러워지고"
 motto_fm_confucian_020:0 "뜻이 정성스러워진 뒤에 마음이 바르게 되고"
 motto_fm_confucian_021:0 "마음이 바르게 된 뒤에 몸이 닦이고"
 motto_fm_confucian_022:0 "몸이 닦인 뒤에 집안이 가지런해지고"
 motto_fm_confucian_023:0 "집안이 가지런해진 뒤에 나라가 다스려지고"
 motto_fm_confucian_024:0 "나라가 다스려진 뒤에 천하가 평안해진다"
 motto_fm_confucian_025:0 "천자로부터 서인에 이르기까지"
 motto_fm_confucian_026:0 "한결같이 모두 몸을 닦는 것을 근본으로 삼는다"
 motto_fm_confucian_027:0 "진실로 하루가 새로워지려면 날마다 새롭고 또 날마다 새로워라"
 motto_fm_confucian_028:0 "자르듯 다듬듯, 쪼듯 갈듯"
 motto_fm_confucian_029:0 "마음이 있지 않으면 보아도 보이지 않는다"
 motto_fm_confucian_030:0 "한 집안이 어질면 온 나라에 어짊이 일어난다"

 # 中庸
 motto_fm_confucian_031:0 "하늘이 명한 것을 성이라 하고, 성을 따르는 것을 도라 한다"
 motto_fm_confucian_032:0 "도를 닦는 것을 교라 한다"
 motto_fm_confucian_033:0 "도라는 것은 잠시도 떠날 수 없다"
 motto_fm_confucian_034:0 "희로애락이 아직 드러나지 않은 것을 중이라 하고"
 motto_fm_confucian_035:0 "드러나 모두 절도에 맞는 것을 화라 한다"
 motto_fm_confucian_036:0 "중이란 천하의 큰 근본이요"
 motto_fm_confucian_037:0 "화란 천하에 두루 통하는 도이다"
 motto_fm_confucian_038:0 "중과 화를 지극히 하면 천지가 제자리를 잡는다"
 motto_fm_confucian_039:0 "만물육언"
 motto_fm_confucian_040:0 "군자는 중용을 지키고, 소인은 중용을 거스른다"
 motto_fm_confucian_041:0 "군자의 중용은 군자로서 때에 맞게 중을 지키는 것이다"
 motto_fm_confucian_042:0 "군자는 화합하되 휩쓸리지 않는다"
 motto_fm_confucian_043:0 "가운데 서서 치우치지 않는다"
 motto_fm_confucian_044:0 "군자는 처한 자리에 맞게 행한다"
 motto_fm_confucian_045:0 "그 밖의 것을 바라지 않는다"
 motto_fm_confucian_046:0 "위로 하늘을 원망하지 않고 아래로 남을 탓하지 않는다"
 motto_fm_confucian_047:0 "군자는 평이함에 머물며 천명을 기다린다"
 motto_fm_confucian_048:0 "소인은 위험을 행하며 요행을 바란다"
 motto_fm_confucian_049:0 "활쏘기는 군자의 도와 닮은 데가 있다"
 motto_fm_confucian_050:0 "과녁을 맞히지 못하면 돌이켜 자신에게서 원인을 찾는다"
 motto_fm_confucian_051:0 "군자의 도는 먼 길을 가려면 반드시 가까운 곳에서 시작하는 것과 같다"
 motto_fm_confucian_052:0 "널리 배우고, 자세히 묻고"
 motto_fm_confucian_053:0 "신중히 생각하고, 밝게 분별하고, 독실히 행한다"
 motto_fm_confucian_054:0 "남이 한 번에 능하면 나는 백 번을 하고"
 motto_fm_confucian_055:0 "남이 열 번에 능하면 나는 천 번을 한다"
 motto_fm_confucian_056:0 "과연 이 도를 해낼 수 있다면"
 motto_fm_confucian_057:0 "비록 어리석어도 반드시 밝아지고, 비록 유약해도 반드시 강해진다"
 motto_fm_confucian_058:0 "성은 하늘의 도이다"
 motto_fm_confucian_059:0 "성하려 하는 것은 사람의 도이다"
 motto_fm_confucian_060:0 "성한 자는 애쓰지 않아도 들어맞고"
 motto_fm_confucian_061:0 "생각하지 않아도 얻으며, 느긋하게도 도에 들어맞는다"
 motto_fm_confucian_062:0 "성은 만물의 끝이자 시작이다"
 motto_fm_confucian_063:0 "불성무물"
 motto_fm_confucian_064:0 "지성무식"
 motto_fm_confucian_065:0 "쉬지 않으면 오래가고, 오래가면 드러난다"
 motto_fm_confucian_066:0 "드러나면 멀리 미치고, 멀리 미치면 넓고 두터워진다"
 motto_fm_confucian_067:0 "넓고 두터우면 높고 밝아진다"
 motto_fm_confucian_068:0 "넓고 두터움은 만물을 싣는 까닭이다"
 motto_fm_confucian_069:0 "높고 밝음은 만물을 덮는 까닭이다"
 motto_fm_confucian_070:0 "멀고 오램은 만물을 이루는 까닭이다"

 # 论语
 motto_fm_confucian_071:0 "배우고 때때로 익히면 또한 기쁘지 아니한가"
 motto_fm_confucian_072:0 "벗이 먼 곳에서 찾아오면 또한 즐겁지 아니한가"
 motto_fm_confucian_073:0 "남이 알아주지 않아도 성내지 않으면 또한 군자가 아니겠는가"
 motto_fm_confucian_074:0 "나는 날마다 세 번 나 자신을 돌아본다"
 motto_fm_confucian_075:0 "남을 위해 일을 꾀함에 정성을 다하지 않았는가"
 motto_fm_confucian_076:0 "벗과 사귐에 믿음을 잃지 않았는가"
 motto_fm_confucian_077:0 "전불습호"
