 motto_fm_confucian_096:0 "가난해도 즐거워하고 부유해도 예를 좋아함만 못하다"
 motto_fm_confucian_097:0 "남이 나를 알아주지 않음을 걱정하지 말고"
 motto_fm_confucian_098:0 "내가 남을 알지 못함을 걱정하라"
 motto_fm_confucian_099:0 "덕으로 정치하는 것은 북극성과 같다"
 motto_fm_confucian_100:0 "제자리에 있으면 뭇별이 그를 향해 돈다"
 motto_fm_confucian_101:0 "시 삼백 편을 한마디로 말하자면"
 motto_fm_confucian_102:0 "왈사무사"
 motto_fm_confucian_103:0 "나는 열다섯에 학문에 뜻을 두었다"
 motto_fm_confucian_104:0 "서른에 섰고, 마흔에 미혹되지 않았다"
 motto_fm_confucian_105:0 "쉰에 천명을 알았다"
 motto_fm_confucian_106:0 "예순에 귀가 순해졌다"
 motto_fm_confucian_107:0 "일흔에 마음 가는 대로 해도 법도를 넘지 않았다"
 motto_fm_confucian_108:0 "옛것을 익혀 새것을 알면 스승이 될 만하다"
 motto_fm_confucian_109:0 "배우기만 하고 생각하지 않으면 어둡다"
