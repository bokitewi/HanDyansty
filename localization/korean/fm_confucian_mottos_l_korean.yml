 motto_fm_confucian_122:0 "부모를 섬김에 완곡하게 간한다"
 motto_fm_confucian_123:0 "부모가 계시면 멀리 떠나지 않고, 떠나더라도 반드시 행방을 알린다"
 motto_fm_confucian_124:0 "부모의 나이는 알지 않으면 안 된다"
 motto_fm_confucian_125:0 "군자는 말은 어눌하되 행동은 민첩하고자 한다"
 motto_fm_confucian_126:0 "덕은 외롭지 않으니 반드시 이웃이 있다"
