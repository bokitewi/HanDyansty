 motto_fm_confucian_088:0 "예의 쓰임은 조화가 귀하다"
 motto_fm_confucian_089:0 "선왕의 도도 이를 아름답게 여겼다"
 motto_fm_confucian_090:0 "조화만 알고 조화를 이루되 예로 절제하지 않으면"
 motto_fm_confucian_091:0 "군자는 먹음에 배부름을 구하지 않고 거처함에 편안함을 구하지 않는다"
 motto_fm_confucian_092:0 "일에는 민첩하고 말에는 신중하다"
 motto_fm_confucian_093:0 "도가 있는 이에게 나아가 자신을 바로잡는다"
 motto_fm_confucian_094:0 "배우기를 좋아한다고 이를 만하다"
