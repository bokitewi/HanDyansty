 motto_fm_confucian_114:0 "의를 보고도 행하지 않는 것은 용기가 없는 것이다"
 motto_fm_confucian_115:0 "이미 이룬 일은 말하지 않고, 끝난 일은 간하지 않는다"
 motto_fm_confucian_116:0 "기왕불구"
 motto_fm_confucian_117:0 "아침에 도를 들으면 저녁에 죽어도 좋다"
 motto_fm_confucian_118:0 "선비가 도에 뜻을 두고서 거친 옷과 거친 음식을 부끄러워한다면"
