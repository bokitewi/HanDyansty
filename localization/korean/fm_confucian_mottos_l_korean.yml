 motto_fm_confucian_130:0 "영무자는 나라에 도가 있으면 지혜로웠다"
 motto_fm_confucian_131:0 "그 지혜는 따를 수 있으나 그 어리석음은 따를 수 없다"
 motto_fm_confucian_132:0 "바탕이 꾸밈을 이기면 촌스럽고, 꾸밈이 바탕을 이기면 겉치레가 된다"
