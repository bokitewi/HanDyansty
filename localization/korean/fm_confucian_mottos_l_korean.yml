 motto_fm_confucian_082:0 "행하고도 힘이 남으면 글을 배운다"
 motto_fm_confucian_083:0 "군자가 무게가 없으면 위엄이 없다"
 motto_fm_confucian_084:0 "학칙불고"
 motto_fm_confucian_085:0 "충과 신을 중히 여기고, 자기만 못한 이를 벗하지 말라"
