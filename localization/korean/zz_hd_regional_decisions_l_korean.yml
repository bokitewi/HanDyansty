 hd_regional_decisions.610.e: "[hd_partition_child_5.GetShortUINameNoTooltip]에게 다른 한을 잇게 한다"
 hd_regional_decisions.610.f: "[hd_partition_child_6.GetShortUINameNoTooltip]에게 다른 한을 잇게 한다"
 hd_regional_decisions.610.g: "[hd_partition_child_7.GetShortUINameNoTooltip]에게 다른 한을 잇게 한다"
 hd_regional_decisions.610.h: "[hd_partition_child_8.GetShortUINameNoTooltip]에게 다른 한을 잇게 한다"
 hd_regional_decisions.610.fallback: "종실에 맡길 만한 이가 없으니, 같은 종친 가운데 다른 이를 고른다."
