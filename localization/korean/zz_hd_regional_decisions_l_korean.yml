l_korean:
 hd_repair_shu_roads_decision: "촉도 수리"
 hd_repair_shu_roads_decision_desc: "촉 땅은 뭇 산이 가로막고 있어, 잔도가 비와 눈, 전화로 자주 망가진다. 돈과 비단을 내주고 장인을 징발하면, 요로 하나를 골라 다시 수리할 수 있다."
 hd_repair_shu_roads_decision_tooltip: "경내의 촉도 하나를 골라 장인을 징발하여 잔각을 다시 수리한다"
 hd_repair_shu_roads_decision_confirm:0 "당일로 공사를 시작하라!"
 hd_tuntian_tazhong_decision: "답중 둔전"
 hd_tuntian_tazhong_decision_desc: "답중 골짜기는 경작도 할 수 있고 지킬 수도 있다. 수로를 내고 창고를 지어 군민이 섞여 살게 하면, 변경의 군대에 보급할 수 있을 뿐 아니라 차츰 기름진 들판이 될 것이다."
 hd_tuntian_tazhong_decision_tooltip: "답중에 수로를 내고 밭을 개간하여 군민이 그 자리에서 둔전하게 한다"
 hd_tuntian_tazhong_decision_confirm:0 "수로를 내고 둔전하라!"
 hd_consume_wushisan_decision: "오석산 복용"
 hd_consume_wushisan_decision_desc: "가루약이 잔 속에서 희고 고운 빛을 낸다. 의원은 이것이 정신을 상쾌하게 하고 몸과 마음을 풀어 준다고 했다. 적어도 약효가 가시기 전까지는."
 hd_consume_wushisan_decision_tooltip: "오석산을 먹고 가슴속 번민을 잠시 잊는다"
 hd_consume_wushisan_decision_confirm:0 "복산"

 hd_repaired_shu_road_modifier: "촉도 수리"
 hd_repaired_shu_road_modifier_desc: "잔도와 교량, 길가의 역참이 정비되어 군대와 행인이 안전하게 다닐 수 있습니다."
 hd_tazhong_tuntian_modifier: "답중 둔전"
 hd_tazhong_tuntian_modifier_desc: "군호가 수로를 내고 개간하여 곡물을 가까운 창고에 들이니, 이 변경 땅이 경작과 군수를 함께 맡게 되었습니다."
 hd_satisfied_nanman_modifier: "만족한 만족"
 hd_satisfied_nanman_modifier_desc: "현지 수령이 조정의 승인을 얻어, 부중이 당분간 공부를 바치고 징집에 응하려 합니다."
 hd_inward_migration_modifier: "이민족의 내지 이주"
 hd_inward_migration_modifier_desc: "새로 옮겨 온 부중이 가축과 노동력, 날랜 전사들을 데려왔고, 황폐한 땅도 다시 개간했습니다."

 hd_regional_decisions.10.t: "산발"
 hd_regional_decisions.10.desc:0 "산을 먹은 뒤로 가슴에 쌓였던 답답함이 차츰 멀어지고, 좌우의 말소리도 휘장 하나를 사이에 둔 듯 들린다. 방금까지 거듭 고민하던 어려움이 지금은 도무지 마음을 붙잡지 못한다.\n\n책상 가장자리를 짚고 일어서서야 손끝이 가늘게 떨리고, 발밑도 평소처럼 단단하지 않다는 것을 느꼈다. 그 가벼움은 갑자기 찾아왔지만, 공무 하나를 대신 처리해 주지도 않았고, 책상 위의 문서도 저절로 사라지지 않았다.\n\n좌우는 당신의 안색이 조금 풀린 것을 보고 더 이상 묻지 않았다. 당신은 사람들을 물리고 옷을 걸친 채 천천히 걸었다. 눈앞의 근심은 잠시 쉴 수 있지만, 약을 먹은 뒤의 열기와 불편함은 결국 이 몸이 스스로 견뎌야 한다."
 hd_regional_decisions.10.a: "옷을 걸치고 천천히 걸으며 약 기운이 흩어지게 둔다."

 hd_regional_decisions.100.t: "촉으로 드는 여섯 길"
 hd_regional_decisions.100.desc:0 "촉도의 지도와 장부가 책상 앞에 가득 펼쳐져 있고, 망가진 곳은 모두 붉은 붓으로 동그라미가 쳐져 있다. 당신이 길 하나를 끝까지 따라 보며 아직 입을 열기도 전에, 서리가 벌써 목석과 역부, 전량의 소요를 올려 바쳤다.\n\n잔도 한 구간은 지도 위에서 고작 한 치 남짓이지만, 정말로 고치려면 얼마나 많은 사람이 짐을 지고 산에 들어가야 할지 모른다. 여섯 길마다 보고가 올라와 저마다 자기 쪽이 가장 급하다고 하지만, 부고의 돈은 이 ‘급하다’는 말과 함께 늘어나지 않는다.\n\n당신은 지도 모서리를 누르고, 사람들에게 잠시 멈추라 했다. 이번에 어느 길을 고칠지, 아니면 잠시 미뤄 둘지는 당신이 결정해야 한다."
 hd_regional_decisions.100.a: "미창도를 수리한다"
 hd_regional_decisions.100.b: "관성도를 수리한다"
 hd_regional_decisions.100.c: "포사도를 수리한다"
 hd_regional_decisions.100.d: "양당·진창도를 수리한다"
 hd_regional_decisions.100.e: "자오도를 수리한다"
 hd_regional_decisions.100.f: "당락도를 수리한다"
 hd_regional_decisions.100.cancel: "이 일은 잠시 미루어 논한다."

 hd_pacify_nanman_decision: "남만 위무"
 hd_pacify_nanman_decision_desc: "영주는 산천이 가로막혀 옛 군현의 이름만으로는 무리를 복종시키기 어렵다. 현지 수령 하나를 인정하여 부족의 옛 풍속대로 그 고장을 다스리게 한다면, 수십 년의 안정을 얻을 수 있을지도 모른다."
 hd_pacify_nanman_decision_tooltip: "영주의 한 군을 골라 현지 수령을 당신의 부족 봉신으로 책봉하고, 옛 풍속에 따라 다스리게 한다"
 hd_pacify_nanman_decision_confirm:0 "풍속에 따라 다스린다"
 hd_nanman_acceptance_gain: "남만 위무"
 hd_regional_decisions.200.t: "풍속에 따라 다스린다"
 hd_regional_decisions.200.desc:0 "남중 여러 군에서 온 이들이 당 아래에서 기다리고 있다. 통역이 한마디 할 때마다 그들은 서로 눈빛을 주고받는다. 다스림에 관해 묻자, 몇몇 수령이 갑자기 조용해졌다. 마치 정말 듣고 싶던 그 한마디를 마침내 기다렸다는 듯이.\n\n땅 하나를 주고 옛 풍속대로 무리를 다스리게 허락한다면, 앞으로 여러 군현에서 처리하기 어려운 일들이 따로 맡을 곳을 얻게 된다. 그러나 어느 군을 먼저 할지, 인신을 누구 손에 넘길지는 나열된 곳들 가운데 당신이 한 곳을 정해야 한다.\n\n당신은 통역에게 다음 말을 재촉하지 않고, 먼저 책상 위의 명단을 바라보았다. 똑같이 한 번 고개를 끄덕이는 것이라도, 어느 이름 뒤에 떨어지느냐에 따라 당 아래의 표정은 전혀 달라질 것이다."
 hd_regional_decisions.200.yunnan: "운남의 현지 수령을 책봉한다"
 hd_regional_decisions.200.jianning: "건녕의 현지 수령을 책봉한다"
 hd_regional_decisions.200.zangke: "장가의 현지 수령을 책봉한다"
 hd_regional_decisions.200.wuling: "무릉의 현지 수령을 책봉한다"
 hd_regional_decisions.200.fuling: "부릉의 현지 수령을 책봉한다"
 hd_regional_decisions.200.yuexi: "월수의 현지 수령을 책봉한다"
 hd_regional_decisions.200.bajun: "파군의 현지 수령을 책봉한다"
 hd_regional_decisions.200.yongchang: "영창의 현지 수령을 책봉한다"
 hd_regional_decisions.200.cancel: "이 논의는 중대하니 나중에 정한다."

 hd_move_foreign_peoples_inward_decision: "이민족의 내지 이주"
 hd_move_foreign_peoples_inward_decision_desc:0 "변새 밖의 여러 부족이 가축과 가솔을 이끌고 경내로 들어오기를 청한다. 그들의 정착지로 현 하나를 내주어 그 수령을 직속 봉신으로 삼으면, 황무지를 채울 수 있을 뿐 아니라 그 가운데서 날랜 전사를 모집할 수도 있다. 다만 호인이 모여 살면 훗날 얌전히 지내리라는 보장은 없다."
 hd_move_foreign_peoples_inward_decision_tooltip:0 "변새 밖의 한 부족을 내지로 받아들여 현 하나를 주어 정착시키고, 그 수령을 당신의 직속 봉신으로 삼는다"
 hd_move_foreign_peoples_inward_decision_confirm:0 "변새 밖 사자 접견"
 hd_regional_decisions.300.t: "변새 밖에서 온 손님"
 hd_regional_decisions.300.desc:0 "북방 여러 부족의 사자가 잇달아 뵙기를 청한다. 수령의 이름을 막 고하자마자 내지로 옮겨 올 부중을 어디에 정착시킬 수 있느냐고 묻는다. 당신은 통역에게 서두르지 말고 각 부족의 뜻을 따로 나누어 분명히 말하라고 했다.\n\n흉노, 선비, 갈, 저, 강, 오환은 부중의 수도, 예전의 왕래도, 쓰는 말도 저마다 다르다. 그런데 자리에는 늘 ‘호’라는 한 글자로만 말하는 이가 있다. 마치 그렇게 하면 뒤따르는 모든 안배를 생략할 수 있다는 듯이.\n\n당신은 서리에게 몇 통의 서신을 차례로 펼치게 했다. 먼저 어느 쪽을 받아들일지 정하고, 그다음에 어느 현을 내줄지 논한다. 당 아래의 기대에 찬 눈빛들이 당신 대신 이 결단을 내려 주지는 않는다."
 hd_regional_decisions.300.xiongnu: "흉노 부중의 내지 이주를 허락한다"
 hd_regional_decisions.300.xianbei: "선비 부중의 내지 이주를 허락한다"
 hd_regional_decisions.300.qiang: "강인 부중의 내지 이주를 허락한다"
 hd_regional_decisions.300.jieren:0 "갈인 부중의 내지 이주를 허락한다"
 hd_regional_decisions.300.diren:0 "저인 부중의 내지 이주를 허락한다"
 hd_move_foreign_peoples_inward_decision_effect_tt:0 "변새 밖 여러 부족의 사자를 접견하여 내지로 옮길 부족과 정착할 땅을 정합니다. 내주는 현이 원래 봉신의 것이라면, 그 사람은 불만을 품기 마련입니다."
 hd_regional_decisions.300.wuhuan: "오환 부중의 내지 이주를 허락한다"
 hd_regional_decisions.300.cancel: "변경이 아직 준비되지 않았다."
 hd_regional_decisions.310.t: "정착지 선정"
 hd_regional_decisions.310.desc:0 "어느 쪽을 받아들일지 정해지자, 서리가 곧바로 물었다. “어느 현을 내주시겠습니까?” 그는 그 부족이 예전에 모여 살던 땅 가운데 당신이나 직속 봉신이 다스리면서 수부가 아닌 현들을 하나하나 나열했다. 방금 여유롭게 내뱉은 허락의 말에 순식간에 묵직한 행선지가 생겼다.\n\n명단을 따라 내려가 보니, 현 이름 하나하나에 원래 살던 주민과 관리들이 매여 있다. 봉신의 손에서 떼어 낸다면 그 봉신의 마음도 편치 않을 것이다. 옮겨 오는 이들은 정착시켜야 하고, 이웃한 이들도 앞으로 누구의 호령을 따라야 하는지 알아야 한다.\n\n붓은 책상 가장자리에 멈춰 있고, 사자는 아직 답을 기다리고 있다."
 hd_regional_decisions.310.a: "[hd_migration_county_1.GetNameNoTier](을)를 내준다"
 hd_regional_decisions.310.b: "[hd_migration_county_2.GetNameNoTier](을)를 내준다"
 hd_regional_decisions.310.c: "[hd_migration_county_3.GetNameNoTier](을)를 내준다"
 hd_regional_decisions.310.d: "[hd_migration_county_4.GetNameNoTier](을)를 내준다"
 hd_regional_decisions.310.e: "[hd_migration_county_5.GetNameNoTier](을)를 내준다"
 hd_regional_decisions.310.f: "[hd_migration_county_6.GetNameNoTier](을)를 내준다"
 hd_regional_decisions.310.g: "[hd_migration_county_7.GetNameNoTier](을)를 내준다"
 hd_regional_decisions.310.h: "[hd_migration_county_8.GetNameNoTier](을)를 내준다"
 hd_regional_decisions.310.cancel: "당분간 땅을 내주지 않는다."

 hd_explore_far_west_decision: "극서 탐험"
 hd_explore_far_west_decision_desc: "양주의 상인들이 여러 사람을 거쳐 전해 온 소식이 있다. 총령과 수많은 성읍 국가를 넘어 해가 지는 곳에 스스로 대진이라 칭하는 나라가 있다는 것이다. 사절단을 꾸린다면 그곳의 사람과 견문을 동방으로 가져올 수 있을지도 모른다."
 hd_explore_far_west_decision_tooltip: "사신을 보내 서쪽으로 총령을 넘어 해 지는 곳의 대진을 찾게 한다"
 hd_explore_far_west_decision_confirm:0 "서쪽으로 사신을 보낸다"
 hd_regional_decisions.400.t: "해 지는 땅을 향하여"
 hd_regional_decisions.400.desc:0 "서쪽으로 갈 사절단의 행장이 갖추어졌고, 통역은 떠나기 전에 지니고 갈 문서를 다시 한번 점검했다. 하직 인사를 하러 온 이가 연도의 길을 당신에게 가리켜 보였지만, 더 먼 곳에 이르러서는 예전 상인들의 전언에 기댈 수밖에 없었다.\n\n당신은 군량과 자금, 접응의 안배를 분명히 묻고, 직접 본 것과 들은 것을 따로 기록하라고 당부했다. 서쪽으로 관진을 하나 지날 때마다 문자와 예속, 길이 달라질 것이다. 먼 나라의 이름은 요란하게 전해질 수 있지만, 정말로 가져올 수 있는 견문은 한 걸음 한 걸음 걸어서 얻어 내야 한다.\n\n사절단이 길을 떠난 뒤로 책상 앞에 그들의 답신이 곧 도착하지는 않을 것이다. 당신은 남겨 둔 노선도를 잘 거두고, 서방에서 올 소식을 조용히 기다린다."
 hd_regional_decisions.400.a: "부절을 들고 서쪽으로 가서 본 것을 반드시 기록하라."
 hd_regional_decisions.401.t: "유사에서 끊긴 군량"
 hd_regional_decisions.401.desc:0 "서쪽으로 간 사절단의 보고가 도착했는데, 봉투 가장자리가 닳아 보풀이 일어 있다. 모래바람에 원래의 일정이 망가졌고, 군량과 물도 예전 할당량으로는 더 버티기 어렵다고 한다. 구원을 청하는 대목을 읽으며 당신은 저도 모르게 문서를 더 가까이 가져갔다.\n\n노선도를 펼쳤지만, 손가락은 보고에 표시된 곳에 머물 수밖에 없었다. 사람들은 그토록 먼 곳에 있으니 목마름과 피로를 당신이 대신 겪어 줄 수는 없다. 그러나 답신만은 여전히 당신이 써야 한다."
 hd_regional_decisions.401.safe: "이백 금을 더 보내 현지에서 군량과 물을 사게 한다."
 hd_regional_decisions.401.risk: "원래 장부대로 대를 나누어 모래를 무릅쓰고 나아가게 한다."
 hd_regional_decisions.risk.tt:0 "#EMP 이 결정의 성패는 예측하기 어렵습니다. 거듭 좌절한다면 이번 여정은 이어가기 어려울 것입니다.#!"
 hd_regional_decisions.402.t: "여러 성의 관문과 나루"
 hd_regional_decisions.402.desc:0 "사절단은 군량과 물의 고비를 막 넘기자마자 또 한 상로의 성읍에 가로막혔다. 편지에 따르면 그곳에서 후한 예물을 요구하는데, 통역이 한참 교섭했지만 상대는 같은 말만 되풀이할 뿐이라고 한다.\n\n요구하는 값을 읽은 당신은 참지 못하고 문서를 앞으로 넘겨, 정말로 이곳을 지나야만 하는지 다시 살폈다. 출발할 때 논한 것은 먼 곳의 견문이었는데, 지금은 늘 다음 문을 열려면 돈이 얼마나 드느냐는 물음뿐이다.\n\n당신은 편지를 평평하게 내려놓았다. 성 밖에서 기다리는 그 무리는 당신의 답 한마디를 기다려야 한다."
 hd_regional_decisions.402.safe: "이백 금을 내주어 예를 갖춰 현지 수령에게 선물한다."
 hd_regional_decisions.402.risk: "국서를 밝히고, 명분 없는 세금은 내지 않는다."
 hd_regional_decisions.403.t: "낯선 문자"
 hd_regional_decisions.403.desc:0 "같은 지명을 두고 길잡이가 두 갈래 길을 가리켰다. 사절단의 보고는 두 가지 설명을 나란히 적어 보냈는데, 끝까지 읽은 당신도 옛 지도 앞에서 눈살을 찌푸릴 수밖에 없었다. 어느 쪽도 쉽게 지워 버릴 수 있는 잘못된 획 같지는 않다.\n\n두 기록을 한데 놓고 보니, 문득 처음 지도를 그린 사람을 불러 물어보고 싶어졌다. 그러나 책상 앞에는 먼 곳의 길을 아는 이가 없으니, 할 수 있는 일은 여전히 방도 하나를 정해 답신을 보내는 것뿐이다."
 hd_regional_decisions.403.safe: "이백 금을 내주어 현지 학자를 초빙한다."
 hd_regional_decisions.403.risk: "옛 지도와 대조하며 길을 따라 서쪽으로 나아간다."
 hd_regional_decisions.404.t: "대진에서 온 손님"
 hd_regional_decisions.404.desc:0 "여러 해가 지나 사절단이 마침내 새로운 견문을 안고 돌아왔다. 함께 온 먼 나라의 학자가 당신 앞으로 안내되었는데, 행장에는 아직 여행의 먼지가 묻어 있었지만 상로와 해안을 이야기하는 품은 많은 옛 지도보다도 조리가 있었다.\n\n당신은 통역에게 천천히 하라고 청하고, 직접 증명할 수 있는 일들을 하나하나 분명히 기록하게 했다. 예전에는 전해 들은 이야기 속에만 나오던 이름들이, 이제야 비로소 서로 어떻게 오가는지, 그곳 사람들은 어떻게 살아가는지 설명해 줄 사람을 얻었다.\n\n학자는 남아서 함께 일하기를 원하며, 가져온 전적도 천천히 교감하여 읽을 수 있다. 당신은 먼저 먼 곳의 손님이 머물 곳을 마련하게 했다. 이번 서행에서 얻은 것이 그저 자랑할 만한 먼 나라의 이름 하나로 끝나서는 안 된다."
 hd_regional_decisions.404.a: "먼 곳의 손님을 위해 연회를 베푼다."
 hd_regional_decisions.409.t: "돌아오지 못한 서쪽 사절"
 hd_regional_decisions.409.desc:0 "돌아온 사자는 기쁜 소식부터 전하지 않고, 남은 기록만 책상 위에 올려놓았다. 당신이 잠시 기다리자, 그제야 그는 서쪽으로 가는 여정을 더는 이어갈 수 없었다고 말했다.\n\n종이에는 아직 닿지 못한 곳들이 적혀 있지만, 그 뒤로는 새로운 기록이 없다. 연도의 좌절이 마침내 남은 여지를 다 소진했고, 돌아올 수 있었던 것은 눈앞의 이 사람들과 이 몇 권의 문서뿐이다. 몇몇 경유지를 묻자 그는 아주 천천히 대답했고, 말이 멈출 때마다 그 침묵이 지명들보다 더 알아듣기 어려웠다.\n\n당신은 기록을 한쪽에 거두었다. 돈과 군량은 이미 쓰였고, 먼 길도 분명 걸었지만, 원래 정한 사명은 끝내 이루지 못했다."
 hd_regional_decisions.409.a: "남은 문서를 보관하며 훗날을 기약한다."

 hd_explore_yizhou_decision: "이주 탐험"
 hd_explore_yizhou_decision_desc: "회계의 바닷사람들은 동남쪽 큰 바다 너머에 넓은 섬이 있다고 전한다. 바다를 건널 배를 짓고 조수에 밝은 이들을 모집한다면, 조정이 처음으로 믿을 만한 이주 항로를 얻을 수 있을지도 모른다."
 hd_explore_yizhou_decision_tooltip: "회계에서 선단을 보내 바다 건너 이주를 찾게 한다"
 hd_explore_yizhou_decision_confirm:0 "돛을 올려 출항하라"
 hd_regional_decisions.500.t: "회계를 떠나는 돛"
 hd_regional_decisions.500.desc:0 "출항할 선단이 채비를 마쳤고, 항해사는 연안의 산세와 물길, 귀항의 약속을 마지막으로 점검했다. 올라온 출항 보고에는 배와 군량, 물, 수행하는 사람들의 수가 빼곡히 적혀 있다.\n\n당신은 그들이 아는 바닷길을 하나하나 분명히 물었지만, 더 먼 방향은 여전히 커다란 공백이었다. 이주라는 이름은 오래전부터 소문으로 전해졌지만, 어떻게 닿을 수 있는지, 어디에 배를 댈 수 있는지는 뭍에서 들은 몇 마디 말만으로는 알 수 없다.\n\n원항이 이미 시작되었으니, 당신은 그들에게 연도에서 기록을 남기되 추측을 직접 본 것처럼 쓰지 말라고 당부했다. 이후 소식의 왕래는 빠르지 않을 것이며, 배 위에서 겪는 어려움도 앞서의 준비와 잇달아 전달될 안배로 감당할 수밖에 없다."
 hd_regional_decisions.500.a: "조수를 따라 나아가며 반드시 항해 기록을 남겨라."
 hd_regional_decisions.501.t: "바닥나는 민물"
 hd_regional_decisions.501.desc:0 "출항한 선단의 보고가 마침내 도착했는데, 첫머리에 적힌 것은 본 것이 아니라 물과 식량이었다. 역풍으로 여정이 길어졌고, 대장은 배급을 계산해 보고도 여전히 자금을 더 보내 달라고 청했다.\n\n보고서를 첫 장으로 되넘기다가, 당신은 자신이 두 번 연달아 ‘물’이라는 글자부터 보았다는 것을 깨달았다. 배는 이미 멀리 갔고, 책상 앞에는 마른 먹 몇 줄만 남아 있다. 답신은 길지 않지만, 배 위의 사람들은 그것에 기대어 다음 바닷길을 버텨야 한다."
 hd_regional_decisions.501.safe: "백 금을 내주어 연도에서 보급품을 사게 한다."
 hd_regional_decisions.501.risk: "하루 배급을 줄이되 항로는 바꾸지 않는다."
 hd_regional_decisions.502.t: "사라진 뭍의 그림자"
 hd_regional_decisions.502.desc:0 "물과 식량의 고비를 막 넘기자, 선단은 새로운 바다에서 또 의견이 갈렸다. 연안 뱃사람들이 말하는 길과 옛 기록이 다르니, 항해사가 두 가지 설명을 함께 보내며 당신의 판단을 청했다.\n\n그 항해도를 보다가, 당신은 문득 뭍에서는 분명하게 그려진 선이 바다에서는 이토록 믿을 수 없다는 것을 느꼈다. 사자가 답신을 언제 보낼 수 있느냐고 묻자, 당신은 지도 모서리를 평평하게 눌렀다. “조심해서 나아가라” 한마디만 적어서는 답이 되지 않는다. 앞에서 정말로 필요한 것은 어느 길을 믿어야 하느냐다."
 hd_regional_decisions.502.safe: "백 금을 내주어 현지 항해사를 고용한다."
 hd_regional_decisions.502.risk: "조수를 재고 별을 보며 스스로 길을 찾는다."
 hd_regional_decisions.503.t:0 "몰려오는 풍랑"
 hd_regional_decisions.503.desc:0 "항해사의 보고에는 수리해야 할 선체와 삭구의 세부 목록이 붙어 있었고, 끝에는 앞길의 풍랑이 점점 거세지는데 마침 근처에 잠시 정박할 만한 만이 있다고 적혀 있었다. 그 손상 내역을 읽자, 앞서 그들에게 계속 나아가라고 재촉하던 말이 입가에서 멈추었다.\n\n처음에는 물과 식량, 다음에는 방향, 이제는 배마저 돈을 달라고 한다. 당신은 지난 보고들을 함께 꺼내 놓고, 갈수록 멀어지는 이 선단을 바라보았다. 이미 쓴 돈이 그들 대신 바람을 막아 주지는 못한다. 다음 이 한 몫도 당신이 결정해야 한다."
 hd_regional_decisions.503.safe: "백 금을 내주어 만으로 들어가 배를 고치고 바람을 피하게 한다."
 hd_regional_decisions.503.risk:0 "수군을 정비하여 파도를 무릅쓰고 나아간다."
 hd_regional_decisions.504.t: "이주에서 돌아온 돛"
 hd_regional_decisions.504.desc:0 "선단이 마침내 돌아왔다. 앞서 보고로만 접했던 물과 식량, 길 잃음과 풍랑이 지금은 모두 선체에 실제로 남은 마모로 바뀌어 있다. 수행원들이 기록을 올리고, 이주 출신의 길잡이 한 명을 데려왔다.\n\n당신은 그에게 지도 위의 해안과 정박처를 설명해 달라고 청했고, 통역은 곁에서 한마디 한마디를 기록했다. 섬의 항만과 부중, 배를 부리는 요령이 마침내 출발 전의 흐릿한 풍문에 머물지 않게 되었다.\n\n길잡이가 남기를 원하자, 당신은 그가 머물 곳을 마련하게 하고 가져온 기록을 잘 보관하게 했다. 이번 원항은 이로써 비로소 마무리되었으니, 얻은 것도 술자리의 신기한 이야깃거리로만 쓰일 것이 아니라 뒤에 올 이들에게 남겨져야 한다."
 hd_regional_decisions.504.a: "해도를 보관하고 그를 조정으로 맞아들인다."
 hd_regional_decisions.509.t: "돛을 접고 돌아오다"
 hd_regional_decisions.509.desc:0 "귀항한 배의 보고가 도착했는데, 출항할 때보다 훨씬 쓸쓸했다. 대장은 남은 기록을 올리며, 더는 나아갈 수 없었다는 대목에 이르자 목소리가 낮아지더니 한참 동안 말을 잇지 못했다.\n\n당신은 그 기록을 한 장 한 장 넘겼다. 물과 식량, 길 찾기, 풍랑. 앞서의 편지마다 아직 다시 시도해 볼 방법이 있었지만, 이제는 모두 같은 결과로 모였다. 이번 원항은 더 이상 완수할 수 없다.\n\n사자는 위로의 말을 몇 마디 더 하려는 듯했지만, 당신은 먼저 경과부터 분명히 말하게 했다. 배는 고칠 수 있고 문서는 남길 수 있지만, 닿지 못한 곳은 끝내 닿지 못한 것이다."
 hd_regional_decisions.509.a: "조선소를 정비하며 훗날을 기약한다."

 hd_partition_han_decision: "양한 분치"
 hd_partition_han_decision_desc: "강역이 너무 넓어 조서가 낙양에서 양주까지 전해지는 데만 몇 달이 걸린다. 한 천자가 동서를 모두 돌보기 어렵다면, 옛사람을 본받아 천하를 동한과 서한으로 나누고 같은 종실의 두 황제가 각기 한 방면을 다스리게 하는 것은 어떠한가?"
 hd_partition_han_decision_tooltip: "천하를 동한과 서한으로 나누고, 낙양과 장안을 두 도읍으로 삼는다"
 hd_partition_han_decision_confirm:0 "동서 분치를 논한다"
 hd_regional_decisions.600.t: "동서 두 도읍"
 hd_regional_decisions.600.desc:0 "낙양과 장안의 두 지도가 나란히 펼쳐졌고, 분치의 논의도 당신이 입장을 밝혀야 할 때에 이르렀다. 이 계책을 시행하면 관중, 양주, 익주는 서한에, 나머지 천하는 동한에 속하며, 양쪽이 각기 천자와 도읍을 갖게 된다.\n\n당신은 먼저 낙양을 바라보다가 손을 장안으로 옮겼다. 어느 쪽에 남느냐는 앞으로 어디서 조회를 열지뿐 아니라, 어느 땅과 신하가 여전히 당신의 손에 있고 어느 것을 같은 종실의 다른 이에게 넘겨야 하는지도 결정한다.\n\n조서는 아직 반포되지 않았으니, 이 논의는 지금이라면 아직 거둘 수 있다."
 hd_regional_decisions.600.east: "짐은 낙양에 남아 동한에 군림하리라."
 hd_regional_decisions.600.west: "짐은 장안으로 옮겨 서한에 군림하리라."
 hd_regional_decisions.600.cancel: "지도를 거두고 이 논의를 그만둔다."
 hd_regional_decisions.610.t: "다른 한 황제의 옹립"
 hd_regional_decisions.610.desc:0 "동서 분치의 뜻은 이미 정해졌고, 당신이 남을 쪽도 이미 골랐지만, 조서에는 아직 가장 중요한 이름 하나가 비어 있다.\n\n명단에 오른 종실 가운데 한 사람이 다른 쪽의 도읍과 강토를 얻어 제호로 당신과 나란히 서게 된다. 이것은 손 가는 대로 덧붙이는 존호가 아니라, 본래 한곳에서 나오던 호령을 정말로 둘로 나누는 일이다.\n\n당신은 명단을 처음부터 훑어보았다. 서리가 붓을 들고 기다리고 있지만, 당신은 그에게 송사부터 쓰라고 하지 않았다. 지금 가장 분명히 생각해야 할 것은 여전히 그 빈자리에 채워질 사람이다."
