l_korean:
 activity_wj_coronation:0 "중국 진위례"
 activity_wj_coronation_desc:0 "신하들을 불러 모아 의주를 정하고, 책서와 새수, 조회로 군위를 밝힙니다. 진위의 명분은 모든 의식을 마친 뒤에야 정식으로 확립됩니다."
 activity_wj_coronation_host_desc:0 "완료 후 신분에 따라 '왕으로 진위함' 또는 '황제 즉위' 법률을 얻고, 이어서 국호를 의논하여 정합니다. 옛 왕조가 수여한 군직은 동시에 철회됩니다."
 activity_wj_coronation_guest_desc:0 "진위를 지켜보러 가서, 새 군주에게 신하로서의 책임을 진술합니다."
 WJ_cr_type_king:0 "왕으로 진위"
 WJ_cr_type_king_desc:0 "독립한 주급 통치자가 왕호를 받습니다. 의식을 마치기 전에는 예전 관칭을 그대로 씁니다."
 WJ_cr_type_usurp:0 "참월하여 칭제"
 WJ_cr_type_usurp_desc:0 "천하에 아직 천자가 있으나, 나는 스스로 제호를 세우겠다. 현존하는 패권국을 빼앗지 않으며, 의식으로 인해 자동으로 전쟁을 일으키지도 않는다."
 WJ_cr_type_found:0 "정정 개국"
 WJ_cr_type_found_desc:0 "옛 패권국은 이미 존재하지 않으니, 제국의 기반 위에 도읍을 정하고 나라를 세웁니다."
 WJ_cr_type_accession:0 "천조 즉위"
 WJ_cr_type_accession_desc:0 "이미 황위를 이어받았으니, 정통의 절차에 따라 종묘에 고하고 옥새를 받고 조회에 임합니다."
 WJ_cr_location_desc:0 "자신의 도성에서 진위례를 거행하며, 종교 성지나 교회 주관자가 필요하지 않습니다."
 WJ_cr_phase_preparation:0 "예를 의논하고 의식을 갖춤"
 WJ_cr_phase_preparation_desc:0 "의주를 함께 의논하고 책서를 교정하며, 신하들이 모임에 오기를 기다립니다."
 WJ_cr_phase_investiture:0 "책봉을 받고 조회에 임함"
 WJ_cr_phase_investiture_desc:0 "책서를 낭독하고 새수를 주고받으며, 신하들의 하례를 받습니다."
 WJ_cr_phase_banquet:0 "연향으로 완성을 고함"
 WJ_cr_phase_banquet_desc:0 "신하들과 연회를 열어 새 정사를 밝히고 의례를 마칩니다."
 WJ_cr_conclusion_desc:0 "진위례가 완성되었습니다. 법률과 국호는 이번 의식의 실제 결과에 따라 정산됩니다."
 WJ_cr.1.t:0 "예를 의논하고 의식을 갖춤"
 WJ_cr.1.desc:0 "예관이 역대의 의주를 책상 앞에 늘어놓았고, 신하들의 수레도 차례로 성에 들어왔다. 이번 진위는 책서에 칭호 하나를 더하는 것에 그치지 않는다. 조회의 차례, 새수의 제도, 신하의 명분을 모두 그 자리에 있는 이들이 분명히 알 수 있게 해야 한다.\n\n나는 의주를 대조하도록 명했다. 번잡함과 간소함은 헤아려 조절할 수 있으나, 책봉을 받고 선포하는 요체만큼은 빠뜨릴 수 없다."
 WJ_cr.1.a:0 "옛 전장을 참작하여 의주를 완비한다."
 WJ_cr.1.b:0 "쓸데없는 비용은 줄이되, 예의 큰 마디는 폐할 수 없다."
 WJ_cr.2.t:0 "책봉을 받고 조회에 임함"
 WJ_cr.2.desc:0 "책서가 정해지고 새수가 어안 위에 놓였다. 예관이 의문을 낭독하자, 신하들이 차례로 나아가 줄지어 절하며 하례했다.\n\n나는 새수를 받아 들고 전각 아래를 바라보았다. 오늘 받는 것은 영예만이 아니다. 이제부터 호령과 치란은 모두 이 군위의 이름으로 사방에 전해질 것이다. 연향이 끝나야 새로운 명분이 조정의 제도에 기록된다."
 WJ_cr.2.a:0 "책봉을 받고 조회에 임하여, 모두와 함께 치세의 책임을 진다."
 WJ_cr.3.t:0 "연향에서의 훈계"
 WJ_cr.3.desc:0 "예가 끝나고 자리가 마련되자, 신하들은 서로 축하를 나누었다. 새 군주는 수많은 송사를 들을 수 있지만, 송사만 들어서는 안 된다.\n\n나는 잔을 들어 소란을 멈추고, 앞으로의 시정 방향을 모두에게 알렸다. 오늘의 약속은 기본 대관 서약의 제도에 따라 나를 구속할 것이며, 연회 자리의 듣기 좋은 말로만 끝나서는 안 된다."
 WJ_cr.3.a:0 "위아래가 정성으로 서로 대하고, 신의를 삼가 지킨다."
 WJ_cr.3.b:0 "재정과 부세를 정돈하여 나라의 살림에 법도가 있게 한다."
 WJ_cr.4.t:0 "진위례 완성"
 WJ_cr.4.desc:0 "책서, 수새, 조하, 연향이 모두 끝났다. 예관이 새로운 군위의 명분을 제도에 기록하고, 이어서 국호의 후보를 올렸다.\n\n이 순간에 이르러서야 진위가 완성되었으며, 옛 왕조가 수여한 군직도 함께 철회되었다."
 WJ_cr.4.a:0 "예가 끝났으니, 국호를 의논하여 정한다."
 WJ_cr_crowned_king_male:0 "왕"
 WJ_cr_crowned_king_female:0 "왕"
 WJ_cr_king_country:0 "국"
 WJ_cr_crowned_king_law:0 "왕으로 진위함"
 WJ_cr_crowned_emperor_law:0 "황제 즉위"

