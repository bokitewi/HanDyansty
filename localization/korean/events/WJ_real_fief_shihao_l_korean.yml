l_korean:
 WJ_rf_shihao.title:0 "선군의 시호 의정"
 WJ_rf_shihao.desc:0 "[XianDi.GetUIName](이)가 이미 세상을 떠났다. 장고의 관리가 선군이 나라를 다스리고 일을 행한 기록을 책상 앞에 올리며, 시호를 의논하여 정해 달라고 청했다.\n\n시호는 행실을 드러내는 것이니, 뒤를 이은 군주와의 친소에 따라 앞사람의 공과를 고쳐 써서는 안 된다. 당신은 그의 생애에 근거하여 글자를 골라야 한다. 봉국의 군주는 예법상 황제라 칭하지 않고 묘호도 세우지 않으니, 선군을 위해 정할 수 있는 것은 고작 한두 글자의 시호뿐이다."
 WJ_rf_shihao.finish:0 "이것으로 시호를 정하고 예전을 마친다."
 WJ_rf_shihao.double:0 "한 글자로는 다하지 못하니, 한 글자를 더 의논한다."
 WJ_rf_shihao.custom:0 "따로 시호를 정한다."
 WJ_rf_shihao.granted_tt:0 "선군의 시호가 이제부터 족보에 기록됩니다."
