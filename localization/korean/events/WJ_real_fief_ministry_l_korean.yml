l_korean:
 WJ_rf_ministry_grant:0 "작위 계승과 복직"
 WJ_rf_ministry_grant_desc:0 "조정의 사자가 조서를 받들고 왔다. 그가 받쳐 든 인수는 바로 선군이 생전에 맡았던 직의 증표였다.\n\n봉국의 작위는 이미 당신이 이어받았는데, 이제 조정은 또 당신에게 [wj_rf_inherited_office.GetNameNoTierNoTooltip]의 직을 맡으라 명했다. 부중의 옛 관리들은 서로 바라보며 기뻐했다. 계속 조정의 정사를 쥘 수 있다면, 선군이 남긴 기업은 한 나라 안에 그치지 않을 것이다.\n\n조서가 내려졌으니, 현임자는 인수를 반납하고 당신이 부임하게 된다."
 WJ_rf_ministry_accept:0 "삼가 조명을 받들어 그 직을 잇겠습니다."
 WJ_rf_ministry_refused:0 "조정이 보임하지 않음"
 WJ_rf_ministry_refused_desc:0 "조정의 회답이 도착했다. [wj_rf_inherited_office.GetNameNoTierNoTooltip]의 직은 당신에게 보임하지 않는다는 것이다.\n\n봉작은 이어받을 수 있으나, 조정의 직은 작위에 딸린 것이 아니다. 선군이 조정에 있을 때의 권세는 인수와 함께 당신의 손에 떨어지지 않았다. 이 직위는 이미 조정이 따로 처리하게 되었으니, 당신은 다른 발판을 찾아야 한다."
 WJ_rf_ministry_refused_accept:0 "이 일은 일단 기억해 두겠다."
