l_korean:
 Color_EHuang:0 "#color:{0.745,0.541,0.184}; #bold "
 HouGong_ShiHao.021_desc:0 "당신은 예관에게 후보 시호 글자를 모두 치우게 했다. 책상 위에는 빈 책장 하나만 남았는데, 오히려 방금 전의 어떤 후보보다도 붓을 대기가 어려웠다.\n\n선제의 생애에서 말할 만한 일은 아직 많지만, 시호에 담을 수 있는 것은 고작 한두 글자뿐이다. 당신은 붓을 손에 들고 마음속에 정해 둔 글자를 조용히 한 번 읊조리며, 그 작은 망설임이 천천히 가라앉기를 기다렸다.\n\n#weak 아래에 정한 시호를 적으십시오.#!"
 HouGong_ShiHao.021_title:0 "존시 친정"
 HuangDi_miaoshi.001.a:0 "선제께서 큰 업을 처음 이루셨으니, 개국의 칭호로 높여야 한다."
 HuangDi_miaoshi.001.b:0 "선제께서 종사를 다시 일으키셨으니, 중흥의 칭호로 높여야 한다."
 HuangDi_miaoshi.001.c:0 "선제께서 천하를 태평하게 다스리셨으니, 명군의 칭호로 높여야 한다."
 HuangDi_miaoshi.001.d:0 "선제께서 문치를 지키고 대통을 이으셨으니, 수성의 칭호로 높여야 한다."
 HuangDi_miaoshi.001.e:0 "선제께 비록 덕을 잃음이 있었으나, 그래도 종묘의 제사는 보존해야 한다."
 HuangDi_miaoshi.001.e1:0 "그래도 묘호를 추존하여 그 제사를 보존한다."
 HuangDi_miaoshi.001.event_title:0 "묘호 의정"
 HuangDi_miaoshi.001.j:0 "묘호는 짐이 직접 정하겠다."
 HuangDi_miaoshi.001_tt:0 "선제가 [GetTrait('SanGong_HunJun').GetName( GetNullCharacter )] [trait|E](을)를 지님"
 HuangDi_miaoshi.003.a:0 "처음으로 중화를 세우고 비로소 천명을 받았으니 '태'라 함. 선제의 묘호: $Color_EHuang$ #bold 태조"
 HuangDi_miaoshi.003.b:0 "덕이 만방을 덮고 처음으로 황업의 기틀을 열었으니 '고'라 함. 선제의 묘호: $Color_EHuang$ #bold 고조"
 HuangDi_miaoshi.003_d:0 "개국의 업에 대한 의논이 끝나자, 예관이 묘호의 후보를 받쳐 들고 왔다. 방금 낭독한 옛일이 아직 귓가에 맴도는데, 눈앞에는 엄숙한 몇 글자만이 남아 있었다.\n\n후세 사람들은 선제의 모든 군령과 모든 고난을 기억하지는 못할지라도, 제사와 문서 속에서 오늘 정한 호칭을 거듭 부르게 될 것이다. 책상 곁의 누군가가 한 번 더 읽어 드릴지 조용히 물었으나, 당신은 고개를 젓고 여러 칭호를 직접 하나하나 살폈다.\n\n먼저 묘호를 정하고, 그다음에 시호를 의논한다. 예관은 이미 붓을 준비해 두고, 당신이 그중 하나를 지정하기만을 기다리고 있다."
 HuangDi_miaoshi.003_t:0 "선제 묘호 추존"
 HuangDi_miaoshi.004.a:0 "나라를 되찾아 다시 세우고 사직을 거듭 안정시켰으니 '세'라 함. 선제의 묘호: $Color_EHuang$ #bold 세조"
 HuangDi_miaoshi.004.b:0 "위태로움을 붙들고 기울어짐을 바로잡아 중흥을 빛나게 열었으니 '중'이라 함. 선제의 묘호: $Color_EHuang$ #bold 중조"
 HuangDi_miaoshi.004.c:0 "산하를 되찾고 끊어진 것을 이어 나라를 일으켰으니 '대'라 함. 선제의 묘호: $Color_EHuang$ #bold 대조"
 HuangDi_miaoshi.004.d:0 "대통을 잇고 기틀을 열어 종조를 되찾았으니 '고'라 함. 선제의 묘호: $Color_EHuang$ #bold 고조"
 HuangDi_miaoshi.004.e:0 "난을 평정하고 어려움을 다스려 끝내 중흥을 이루었으니 '성'이라 함. 선제의 묘호: $Color_EHuang$ #bold 성조"
 HuangDi_miaoshi.004.f:0 "화란을 평정하고 세상을 안정시켜 종묘를 지켰으니 '열'이라 함. 선제의 묘호: $Color_EHuang$ #bold 열조"
 HuangDi_miaoshi.004_d:0 "중흥의 공에 대한 의논이 정해지자, 예관이 묘호의 후보를 가까이 올렸다. 문서는 새것으로 바뀌었으나, 방금 전의 국통이 거의 끊어질 뻔했던 옛일 때문에 전각 안은 여전히 유난히 고요했다.\n\n당신은 후보를 하나하나 읽었다. 어떤 글자는 위엄 있고 무거우며, 어떤 글자는 평온하고 부드러웠다. 선제의 이름 뒤에 놓이는 순간, 그것들은 더 이상 평범한 말이 아니게 된다. 누군가 이유를 더 아뢰려 하자 당신은 손을 들어 잠시 기다리게 했다. 앞서 이미 충분히 들었다. 이 마지막 하나만큼은 결국 당신이 직접 정해야 한다."
 HuangDi_miaoshi.004_t:0 "선제 묘호 의정"
 HuangDi_miaoshi.005.a:0 "공덕이 그보다 더할 수 없고 그 업이 찬란하니 '태'라 함. 선제의 묘호: $Color_EHuang$ #bold 태종"
 HuangDi_miaoshi.005.e:0 "중흥에 큰 일을 하였고 덕이 높아 존숭할 만하니 '고'라 함. 선제의 묘호: $Color_EHuang$ #bold 고종"
 HuangDi_miaoshi.005.f:0 "중흥에 공이 있어 백세토록 옮기지 않으니 '세'라 함. 선제의 묘호: $Color_EHuang$ #bold 세종"
 HuangDi_miaoshi.005.g:0 "중흥에 공이 있어 백세토록 옮기지 않으니 '대'라 함. 선제의 묘호: $Color_EHuang$ #bold 대종"
 HuangDi_miaoshi.005.h:0 "신기를 중흥하고 종조를 다시 떨쳤으니 '중'이라 함. 선제의 묘호: $Color_EHuang$ #bold 중종"
 HuangDi_miaoshi.005.i:0 "성대한 덕이 높고 높으며 그 아름다움이 그치지 않으니 '인'이라 함. 선제의 묘호: $Color_EHuang$ #bold 인종"
 HuangDi_miaoshi.005.k:0 "공이 사해에 빛나고 인이 천 년에 행해지니 '현'이라 함. 선제의 묘호: $Color_EHuang$ #bold 현종"
 HuangDi_miaoshi.005.l:0 "성스럽고 신령하여 요임금의 덕에 더욱 걸맞으니 '신'이라 함. 선제의 묘호: $Color_EHuang$ #bold 신종"
 HuangDi_miaoshi.005.m:0 "통하지 않는 바가 없고 높은 덕으로 대통을 드리웠으니 '성'이라 함. 선제의 묘호: $Color_EHuang$ #bold 성종"
 HuangDi_miaoshi.005.o:0 "굳센 덕으로 능히 이루고 천지사방을 거듭 밝혔으니 '숙'이라 함. 선제의 묘호: $Color_EHuang$ #bold 숙종"
 HuangDi_miaoshi.005.p:0 "지극히 어질고 지극히 효성스러우며 뜻을 잘 잇고 일을 잘 펼쳤으니 '효'라 함. 선제의 묘호: $Color_EHuang$ #bold 효종"
 HuangDi_miaoshi.005.q:0 "하늘만이 총명하고 성인만이 이를 본받으니 '헌'이라 함. 선제의 묘호: $Color_EHuang$ #bold 헌종"
 HuangDi_miaoshi.005.r:0 "성스러운 선함이 널리 알려지고 정교가 널리 펼쳐졌으니 '선'이라 함. 선제의 묘호: $Color_EHuang$ #bold 선종"
 HuangDi_miaoshi.005.s:0 "공이 있어 백성을 편안히 하고 명을 받아 크게 펼쳤으니 '열'이라 함. 선제의 묘호: $Color_EHuang$ #bold 열종"
 HuangDi_miaoshi.005.t:0 "사방을 밝게 비추고 덕이 신령한 요임금을 닮았으니 '명'이라 함. 선제의 묘호: $Color_EHuang$ #bold 명종"
 HuangDi_miaoshi.005.u:0 "세운 것이 이루어지고 공을 이루어 사방을 모두 차지했으니 '성'이라 함. 선제의 묘호: $Color_EHuang$ #bold 성종"
 HuangDi_miaoshi.005.v:0 "백성을 편안하고 즐겁게 보살펴 성강의 치세에 가까웠으니 '강'이라 함. 선제의 묘호: $Color_EHuang$ #bold 강종"
 HuangDi_miaoshi.005.w:0 "지극한 도와 지극한 참됨이 그윽하고 또 그윽하니 '현'이라 함. 선제의 묘호: $Color_EHuang$ #bold 현종"
 HuangDi_miaoshi.005.x:0 "다스림이 지극한 도에 가깝고 덕이 종으로 일컬을 만하니 '진'이라 함. 선제의 묘호: $Color_EHuang$ #bold 진종"
 HuangDi_miaoshi.005.y:0 "화란을 능히 평정하고 형벌로 백성을 능히 복종시켰으니 '무'라 함. 선제의 묘호: $Color_EHuang$ #bold 무종"
 HuangDi_miaoshi.005_d:0 "예관이 선제가 천하를 경략한 공업에 따라 묘호의 후보를 올렸다. 낭독이 끝나자 전각 안에는 옷소매가 가볍게 스치는 소리만 남았다. 당신은 문서를 가까이 당기며, 선제가 살아 있을 때 조정에서 논쟁을 불러일으켰던 정사들을 떠올렸다.\n\n일을 했던 사람은 이미 없는데, 논하는 사람들은 여전히 여기 서서 그를 위해 영원한 호칭 하나를 고르기를 기다리고 있다. 당신은 여러 칭호를 살펴보았으나 한동안 정하지 못했다. 글자 하나만 바꾸어도 무게를 두는 곳이 따라서 달라진다.\n\n예관은 감히 재촉하지 못하고 붓만 가지런히 놓아 두었다. 누군가는 먼저 이 마지막 망설임을 거두어야 한다."
 HuangDi_miaoshi.005_t:0 "선제 묘호 의정"
 HuangDi_miaoshi.006.a:0 "천지를 경위하고 자애롭게 백성을 사랑했으니 '문'이라 함. 선제의 묘호: $Color_EHuang$ #bold 문종"
 HuangDi_miaoshi.006.b:0 "뛰어나고 남다른 군주로 무리 중에 빼어났으니 '영'이라 함. 선제의 묘호: $Color_EHuang$ #bold 영종"
 HuangDi_miaoshi.006.c:0 "슬기로움으로 성인이 되고 지혜와 생각이 깊고 멀었으니 '예'라 함. 선제의 묘호: $Color_EHuang$ #bold 예종"
 HuangDi_miaoshi.006.d:0 "요임금이 사람을 알아보는 것을 말하였듯 대대로 밝은 왕이 있으니 '철'이라 함. 선제의 묘호: $Color_EHuang$ #bold 철종"
 HuangDi_miaoshi.006.e:0 "전적과 역사가 그 덕을 증명하고 백성을 편안히 하여 진실로 이끌었으니 '덕'이라 함. 선제의 묘호: $Color_EHuang$ #bold 덕종"
 HuangDi_miaoshi.006.f:0 "덕을 숭상하고 근본에 보답하며 조상을 높이고 종묘를 융성케 했으니 '숭'이라 함. 선제의 묘호: $Color_EHuang$ #bold 숭종"
 HuangDi_miaoshi.006.g:0 "덕을 펴고 의를 지키며 덕스러운 용모가 고요하고 깊으니 '목'이라 함. 선제의 묘호: $Color_EHuang$ #bold 목종"
 HuangDi_miaoshi.006.h:0 "빛나고 크게 공을 세워 앞선 업을 능히 이었으니 '광'이라 함. 선제의 묘호: $Color_EHuang$ #bold 광종"
 HuangDi_miaoshi.006.i:0 "의로써 이루고 아름다운 업을 빛나게 이었으니 '경'이라 함. 선제의 묘호: $Color_EHuang$ #bold 경종"
 HuangDi_miaoshi.006.j:0 "억지로 하지 않아도 이루어지고 서두르지 않아도 빨랐으니 '순'이라 함. 선제의 묘호: $Color_EHuang$ #bold 순종"
 HuangDi_miaoshi.006.k:0 "법전에 잘 맞고 장중하며 공경스럽고 위엄이 있었으니 '경'이라 함. 선제의 묘호: $Color_EHuang$ #bold 경종"
 HuangDi_miaoshi.006.l:0 "속마음이 깊고 맑아 한결같으며 편안히 오래 살았으니 '영'이라 함. 선제의 묘호: $Color_EHuang$ #bold 영종"
 HuangDi_miaoshi.006.m:0 "큰 업을 일으키고 성스러운 계획을 크게 떨쳤으니 '흥'이라 함. 선제의 묘호: $Color_EHuang$ #bold 흥종"
 HuangDi_miaoshi.006.n:0 "도를 체득하여 하나를 얻고 하늘이 내린 자연을 따랐으니 '도'라 함. 선제의 묘호: $Color_EHuang$ #bold 도종"
 HuangDi_miaoshi.006.o:0 "법도가 밝고 크며 말에 문채가 있었으니 '장'이라 함. 선제의 묘호: $Color_EHuang$ #bold 장종"
 HuangDi_miaoshi.006.p:0 "온화하고 성스럽고 선하며 백성을 사랑하고 바탕이 깊었으니 '의'라 함. 선제의 묘호: $Color_EHuang$ #bold 의종"
 HuangDi_miaoshi.006.q:0 "법도가 밝고 크며 말에 문채가 있었으니 '장'이라 함. 선제의 묘호: $Color_EHuang$ #bold 장종"
 HuangDi_miaoshi.006.r:0 "과감하고 굳세며 성품이 강직하고 결단력이 있었으니 '의'라 함. 선제의 묘호: $Color_EHuang$ #bold 의종"
 HuangDi_miaoshi.006.s:0 "너그럽고 어질어 뭇사람을 얻고 두터운 덕으로 대통을 이었으니 '유'라 함. 선제의 묘호: $Color_EHuang$ #bold 유종"
 HuangDi_miaoshi.006.t:0 "정사가 공평하고 형벌이 엄정하며 도술을 드러내 밝혔으니 '이'라 함. 선제의 묘호: $Color_EHuang$ #bold 이종"
 HuangDi_miaoshi.006.u:0 "적을 이기고 뜻이 굳세며 위의에 어긋남이 없었으니 '장'이라 함. 선제의 묘호: $Color_EHuang$ #bold 장종"
 HuangDi_miaoshi.006.v:0 "성대하고 밝으며 화락하고 공경스러운 덕이 빛났으니 '희'라 함. 선제의 묘호: $Color_EHuang$ #bold 희종"
 HuangDi_miaoshi.006_d:0 "선제의 수성 재위 기록의 낭독이 끝나자, 예관이 묘호의 후보를 받들어 올리며 정해 주기를 청했다. 문서가 손에 들어오니, 앞서의 빽빽한 연월이 이제는 고를 몇 글자로만 남았다.\n\n개국 때처럼 분명한 전쟁의 이야기는 없으나, 일상의 정무는 하나하나 이어져 오늘에 이르렀다. 전각 안의 누군가가 송사 몇 마디를 더 보태려 하자 당신은 그를 멈추게 하고, 직접 후보를 따라 살펴보았다. 말은 이미 충분히 했다.\n\n먼저 묘호를 정해야 종묘 안의 호칭이 미정인 채로 남지 않는다."
 HuangDi_miaoshi.006_t:0 "선제 묘호 의정"
 HuangDi_miaoshi.007.a:0 "화기가 널리 퍼지고 공이 있어 사람을 편안히 했으니 '희'라 함. 선제의 묘호: $Color_EHuang$ #bold 희종"
 HuangDi_miaoshi.007.b:0 "바탕이 깊어 간언을 받아들이고 자애롭게 친족을 사랑했으니 '희'라 함. 선제의 묘호: $Color_EHuang$ #bold 희종"
 HuangDi_miaoshi.007.c:0 "널리 듣고 재능이 많으며 은혜롭고 안으로 덕이 있었으니 '헌'이라 함. 선제의 묘호: $Color_EHuang$ #bold 헌종"
 HuangDi_miaoshi.007.d:0 "도덕이 순일하고 인을 체득하여 백성을 길렀으니 '원'이라 함. 선제의 묘호: $Color_EHuang$ #bold 원종"
 HuangDi_miaoshi.007.e:0 "복과 경사가 끊이지 않고 종통을 잘 이었으니 '경'이라 함. 선제의 묘호: $Color_EHuang$ #bold 경종"
 HuangDi_miaoshi.007.f:0 "의를 받들고 법도를 따르며 공손하고 검소하며 장중하고 공경스러웠으니 '예'라 함. 선제의 묘호: $Color_EHuang$ #bold 예종"
 HuangDi_miaoshi.007.g:0 "큰 덕이 아름답게 가득하고 고아한 운치가 밝게 드러났으니 '휘'라 함. 선제의 묘호: $Color_EHuang$ #bold 휘종"
 HuangDi_miaoshi.007.h:0 "용모와 위의가 공손하고 아름다우며 덕을 밝히고 노고가 있었으니 '소'라 함. 선제의 묘호: $Color_EHuang$ #bold 소종"
 HuangDi_miaoshi.007.i:0 "백성을 사랑하여 베풀기를 좋아하고 부드러운 바탕으로 간언을 받아들였으니 '혜'라 함. 선제의 묘호: $Color_EHuang$ #bold 혜종"
 HuangDi_miaoshi.007.j:0 "강하고 굳세게 정사를 잡고 장엄하게 아랫사람을 대했으니 '위'라 함. 선제의 묘호: $Color_EHuang$ #bold 위종"
 HuangDi_miaoshi.007.k:0 "현자를 높이고 의를 귀히 여기며 덕이 바르고 용모가 아름다웠으니 '공'이라 함. 선제의 묘호: $Color_EHuang$ #bold 공종"
 HuangDi_miaoshi.007.l:0 "화합을 좋아하여 다투지 않으니 만백성이 편안히 의지했으므로 '안'이라 함. 선제의 묘호: $Color_EHuang$ #bold 안종"
 HuangDi_miaoshi.007.m:0 "먼 방계에서 제위를 이어 앞선 업을 계승했으니 '소'라 함. 선제의 묘호: $Color_EHuang$ #bold 소종"
 HuangDi_miaoshi.007.n:0 "위의를 모두 갖추고 일을 공경하며 씀씀이를 절약했으니 '흠'이라 함. 선제의 묘호: $Color_EHuang$ #bold 흠종"
 HuangDi_miaoshi.007.o:0 "생각이 깊고 통달하며 민첩하고 지난 허물을 뉘우쳤으니 '사'라 함. 선제의 묘호: $Color_EHuang$ #bold 사종"
 HuangDi_miaoshi.007.p:0 "나아가고 물러남이 본받을 만하고 조용하여 한결같았으니 '도'라 함. 선제의 묘호: $Color_EHuang$ #bold 도종"
 HuangDi_miaoshi.007.q:0 "예를 지키고 의를 잡으며 성스럽게 닦아 교화를 본보였으니 '단'이라 함. 선제의 묘호: $Color_EHuang$ #bold 단종"
 HuangDi_miaoshi.007.r:0 "능히 공경하고 백성을 위해 부지런하며 무의 뜻을 능히 이루었으니 '환'이라 함. 선제의 묘호: $Color_EHuang$ #bold 환종"
 HuangDi_miaoshi.007.s:0 "갑주를 입고 노고가 있었으며 도와서 이룸이 있었으니 '양'이라 함. 선제의 묘호: $Color_EHuang$ #bold 양종"
 HuangDi_miaoshi.007.t:0 "큰 계통을 이어받아 만방을 모두 다스렸으니 '통'이라 함. 선제의 묘호: $Color_EHuang$ #bold 통종"
 HuangDi_miaoshi.007.u:0 "백성을 편안히 하려 크게 생각하고 행실이 순수하여 둘이 없었으니 '정'이라 함. 선제의 묘호: $Color_EHuang$ #bold 정종"
 HuangDi_miaoshi.007_d:0 "선제의 과실에 이르자 전각 안은 방금 전보다 더 고요해졌다. 예관은 제사를 보존하기 위한 묘호의 후보를 올리며 말을 유난히 조심스럽게 골랐다. 어느 글자 하나라도 무겁게 읽으면 다른 뜻이 있는 것으로 여겨질까 두려운 듯했다.\n\n당신은 그 명목들을 바라보다가, 앞쪽의 정사 기록을 다시 한번 보았다. 사람은 이미 떠났으나 많은 어려움은 여전히 살아 있는 이들에게 남겨졌다. 오늘 호칭 하나를 정한다고 해서 당하의 모든 이가 같은 생각을 하게 되지는 않을 것이다.\n\n예관은 여전히 기다리고 있다. 이 글자는 결국 당신이 가리켜야 하며, 다른 이들의 침묵이 당신 대신 답해 줄 수는 없다."
 HuangDi_miaoshi.007_t:0 "선제 묘호 추존"
 HuangDi_miaoshi.008.a:0 "조로 높인다."
 HuangDi_miaoshi.008.b:0 "종으로 높인다."
 HuangDi_miaoshi.008.c:0 "이전 페이지로 돌아가기"
 HuangDi_miaoshi.008_d:0 "후보를 모두 보았으나, 당신은 그래도 따로 묘호를 정하기로 했다. 예관이 원고를 치우고 붓과 빈 책장만 남겨 두자, 책상 앞이 단번에 훨씬 휑해졌다.\n\n마음에 들지 않을 때는 그 까닭을 하나하나 말할 수 있었다. 그러나 이제 직접 글자를 써야 할 차례가 되니, 그 까닭들이 당신 대신 이름 하나를 써 주지는 못했다. 당신은 붓을 바로잡고, 선제가 종묘에 가장 마땅히 남겨야 할 그 호칭을 다시 생각했다.\n\n#weak 아래에 정한 묘호를 적은 뒤, 조로 할지 종으로 할지 고르십시오.#!"
 HuangDi_miaoshi.008_t:0 "묘호 친정"
 HuangDi_miaoshi.009.a:0 "예제에 따라 삼가 묘호와 시호를 의논하여 정한다."
 HuangDi_miaoshi.009.b:0 "어린 군주가 일찍 붕어하였으니, 묘호는 세우지 않고 시호만 의논한다."
 HuangDi_miaoshi.009.desc.1:0 "대행 황제가 이미 붕어하여, 묘호와 시호를 의논하여 정하는 문서가 당신 앞에 올라왔다. 선제의 생전의 많은 일들은 아직 경중을 가리지도 못했는데, 예관은 벌써 이 세상을 떠난 군주를 어떻게 부를지 준비하지 않을 수 없었다.\n\n당신은 먼저 선제의 공업과 사후의 예제를 각각 아뢰게 했다. 친소를 막론하고 오늘 정하는 명호는 후세 사람들이 부르게 될 것이니, 지금의 슬픔에만 기대어 대충 끝낼 수는 없다.\n\n"
 HuangDi_miaoshi.009.desc.2:0 "선제께는 개국의 공이 있다. 오늘 묘호를 의논함에 있어 먼저 이 근본을 헤아려야 한다. 기업은 그가 세운 것이지만, 그에게 어떤 이름을 붙일지는 뒤를 이은 당신이 엄숙히 재결해야 한다."
 HuangDi_miaoshi.009.desc.3:0 "예관이 선제의 중흥의 공을 이야기하자, 고개를 숙이고 있던 이들도 눈을 들었다. 한때 이어지기 어려웠던 국통이 지금도 남아 있으니, 종묘에서 그것을 붙들어 준 이를 어떻게 부를지 당신의 재정을 기다리고 있다."
 HuangDi_miaoshi.009.desc.4:0 "선제가 치세를 경략한 기록의 낭독이 끝났다. 생전에는 오래도록 논쟁할 만했던 일들이, 이제는 모두 몇 글자 안에 담겨야 한다."
 HuangDi_miaoshi.009.desc.5:0 "선제의 수성의 업은 이미 의논하여 밝혀졌다. 당신이 그 재위 기록을 넘겨 보니 일상의 정무가 빽빽하게 적혀 있었으나, 오늘은 그를 위해 백세토록 걸맞을 명호 하나만 고르면 된다."
 HuangDi_miaoshi.009.desc.6:0 "예관이 선제의 나이를 읽다가 목소리가 잠시 멈추었고, 그제야 사후의 예의를 이어서 아뢰었다. 아직 시행하지 못한 많은 계획들은 이제 더 이상 답을 기다릴 필요가 없다."
 HuangDi_miaoshi.009.desc.7:0 "선제는 생전에 정사에서 실책이 많았고, 오늘의 슬픔도 그 기록들을 저절로 사라지게 하지는 못한다. 제사의 보존과 포폄 사이에서 어떻게 취사할 것인가, 이것이 바로 이 예의 의논에서 가장 붓을 대기 어려운 부분이다."
 HuangDi_miaoshi.009.event_title:0 "시호와 존호 의논"
 HuangDi_miaoshi.011.a:0 "천지를 경위함을 '문'이라 함. 시호: $Color_EHuang$ #bold 문"
 HuangDi_miaoshi.011.aa:0 "호령이 백성을 기쁘게 함을 '화'라 함. 시호: $Color_EHuang$ #bold 화"
 HuangDi_miaoshi.011.ab:0 "의를 쌓고 공을 풍성히 함을 '인'이라 함. 시호: $Color_EHuang$ #bold 인"
 HuangDi_miaoshi.011.ac:0 "선을 상 주고 악을 벌함을 '헌'이라 함. 시호: $Color_EHuang$ #bold 헌"
 HuangDi_miaoshi.011.ad:0 "민첩하게 시작하여 행실을 이룸을 '진'이라 함. 시호: $Color_EHuang$ #bold 진"
 HuangDi_miaoshi.011.ae:0 "행실이 안팎에 드러남을 '현'이라 함. 시호: $Color_EHuang$ #bold 현"
 HuangDi_miaoshi.011.af:0 "밝음을 높여 환난을 이겨냄을 '지'라 함. 시호: $Color_EHuang$ #bold 지"
 HuangDi_miaoshi.011.ag:0 "무리 중에 빼어남을 '영'이라 함. 시호: $Color_EHuang$ #bold 영"
 HuangDi_miaoshi.011.ah:0 "총명하고 밝게 통달함을 '예'라 함. 시호: $Color_EHuang$ #bold 예"
 HuangDi_miaoshi.011.ai:0 "부드러운 바탕으로 백성을 자애함을 '혜'라 함. 시호: $Color_EHuang$ #bold 혜"
 HuangDi_miaoshi.011.aj:0 "재주와 이치가 자세하고 분명함을 '이'라 함. 시호: $Color_EHuang$ #bold 이"
 HuangDi_miaoshi.011.ak:0 "중정하고 정밀하며 순수함을 '순'이라 함. 시호: $Color_EHuang$ #bold 순"
 HuangDi_miaoshi.011.al:0 "온유하고 어질며 선함을 '의'라 함. 시호: $Color_EHuang$ #bold 의"
 HuangDi_miaoshi.011.an:0 "다스려 허물이 없음을 '평'이라 함. 시호: $Color_EHuang$ #bold 평"
 HuangDi_miaoshi.011.ao:0 "절개를 굳게 지키고 일을 해냄을 '정'이라 함. 시호: $Color_EHuang$ #bold 정"
 HuangDi_miaoshi.011.ap:0 "하늘을 두려워하고 백성을 사랑함을 '경'이라 함. 시호: $Color_EHuang$ #bold 경"
 HuangDi_miaoshi.011.aq:0 "아름다운 교화가 멀리 미침을 '광'이라 함. 시호: $Color_EHuang$ #bold 광"
 HuangDi_miaoshi.011.ar:0 "일에 응하여 공이 있음을 '민'이라 함. 시호: $Color_EHuang$ #bold 민"
 HuangDi_miaoshi.011.as:0 "화합을 좋아하여 다투지 않음을 '안'이라 함. 시호: $Color_EHuang$ #bold 안"
 HuangDi_miaoshi.011.at:0 "백성을 편안히 하려 크게 생각함을 '정'이라 함. 시호: $Color_EHuang$ #bold 정"
 HuangDi_miaoshi.011.au:0 "너그럽고 즐거우며 끝을 잘 맺음을 '정'이라 함. 시호: $Color_EHuang$ #bold 정"
 HuangDi_miaoshi.011.av:0 "생각이 깊고 멂을 '익'이라 함. 시호: $Color_EHuang$ #bold 익"
 HuangDi_miaoshi.011.aw:0 "의를 행하여 도에 맞음을 '현'이라 함. 시호: $Color_EHuang$ #bold 현"
 HuangDi_miaoshi.011.ax:0 "현자를 높이고 의를 귀히 여김을 '공'이라 함. 시호: $Color_EHuang$ #bold 공"
 HuangDi_miaoshi.011.ay:0 "현자를 높이고 의를 귀히 여김을 '공(함께할 공)'이라 함. 시호: $Color_EHuang$ #bold 공"
 HuangDi_miaoshi.011.az:0 "백성을 사랑하고 다스림을 좋아함을 '대'라 함. 시호: $Color_EHuang$ #bold 대"
 HuangDi_miaoshi.011.b:0 "화란을 능히 평정함을 '무'라 함. 시호: $Color_EHuang$ #bold 무"
 HuangDi_miaoshi.011.ba:0 "많이 듣고 굳게 기억함을 '박'이라 함. 시호: $Color_EHuang$ #bold 박"
 HuangDi_miaoshi.011.bb:0 "바탕이 깊어 간언을 받아들임을 '이'라 함. 시호: $Color_EHuang$ #bold 이"
 HuangDi_miaoshi.011.bc:0 "군대를 다스리고 군세를 떨침을 '군'이라 함. 시호: $Color_EHuang$ #bold 군"
 HuangDi_miaoshi.011.bd:0 "의를 드러내고 굳게 지킴을 '견'이라 함. 시호: $Color_EHuang$ #bold 견"
 HuangDi_miaoshi.011.be:0 "뜻이 깊고 생각이 멂을 '방'이라 함. 시호: $Color_EHuang$ #bold 방"
 HuangDi_miaoshi.011.bf:0 "민첩하면서도 공경함을 '신'이라 함. 시호: $Color_EHuang$ #bold 신"
 HuangDi_miaoshi.011.bg:0 "공손하고 검소하며 장중하고 공경함을 '예'라 함. 시호: $Color_EHuang$ #bold 예"
 HuangDi_miaoshi.011.bh:0 "일을 마땅하게 처리함을 '의'라 함. 시호: $Color_EHuang$ #bold 의"
 HuangDi_miaoshi.011.bi:0 "한 말을 지킬 수 있음을 '신'이라 함. 시호: $Color_EHuang$ #bold 신"
 HuangDi_miaoshi.011.bj:0 "막힘없이 통하고 이치에 맞음을 '달'이라 함. 시호: $Color_EHuang$ #bold 달"
 HuangDi_miaoshi.011.bk:0 "어질고 후하며 도량이 있음을 '관'이라 함. 시호: $Color_EHuang$ #bold 관"
 HuangDi_miaoshi.011.bl:0 "편안하고 부드럽게 뭇사람을 기쁘게 함을 '개'라 함. 시호: $Color_EHuang$ #bold 개"
 HuangDi_miaoshi.011.bm:0 "마음을 맑게 하고 욕심을 적게 함을 '청'이라 함. 시호: $Color_EHuang$ #bold 청"
 HuangDi_miaoshi.011.bn:0 "친족의 허물을 감추지 않음을 '직'이라 함. 시호: $Color_EHuang$ #bold 직"
 HuangDi_miaoshi.011.bo:0 "일을 공경하고 씀씀이를 절약함을 '흠'이라 함. 시호: $Color_EHuang$ #bold 흠"
 HuangDi_miaoshi.011.bp:0 "선으로 옮기고 허물을 고침을 '익'이라 함. 시호: $Color_EHuang$ #bold 익"
 HuangDi_miaoshi.011.bq:0 "온화하고 선량하며 즐기기를 좋아함을 '양'이라 함. 시호: $Color_EHuang$ #bold 양"
 HuangDi_miaoshi.011.br:0 "때를 살피고 법도에 맞음을 '도'라 함. 시호: $Color_EHuang$ #bold 도"
 HuangDi_miaoshi.011.bs:0 "능히 선하여 같은 무리를 천거함을 '유'라 함. 시호: $Color_EHuang$ #bold 유"
 HuangDi_miaoshi.011.bt:0 "덕성이 온화하고 공손함을 '기'라 함. 시호: $Color_EHuang$ #bold 기"
 HuangDi_miaoshi.011.bu:0 "고아를 돌보고 약한 이를 불쌍히 여김을 '자'라 함. 시호: $Color_EHuang$ #bold 자"
 HuangDi_miaoshi.011.bv:0 "지난 허물을 뒤늦게 고침을 '정'이라 함. 시호: $Color_EHuang$ #bold 정"
 HuangDi_miaoshi.011.bw:0 "마음을 잡아 능히 장중함을 '제'라 함. 시호: $Color_EHuang$ #bold 제"
 HuangDi_miaoshi.011.bx:0 "꾀와 생각이 깊고 멂을 '심'이라 함. 시호: $Color_EHuang$ #bold 심"
