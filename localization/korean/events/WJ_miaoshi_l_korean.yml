 HuangDi_miaoshi.011.zdy:0 "시호는 짐이 직접 정하겠다."
 HuangDi_miaoshi.011_d:0 "예관이 또 문서 한 부를 올렸다. 이번에 의논하는 것은 사후의 시호였다. 후보 글자와 그 뜻이 나란히 적혀 있었고, 당신은 그것을 따라 읽어 내려가다가 문득 짧은 글자 하나하나 뒤에 저마다 다른 견해가 서 있다는 것을 느꼈다.\n\n공업을 중히 여기는 이도 있고, 애도와 공경을 더 헤아리는 이도 있으며, 앞선 의논에서 이미 많은 말이 오갔다. 당신은 그들이 다시 다투게 하지 않고, 선제의 기록을 손 곁에 둔 채 눈앞의 명목들을 다시 보았다.\n\n전각 안은 고요히 재정을 기다리고 있다. 어느 것을 고르든 앞으로의 예문은 이것으로 그를 부를 것이다. 지금은 먼저 당신이 그것을 소리 내어 읽어야 한다."
 HuangDi_miaoshi.011_t:0 "대행 시호 의논"
