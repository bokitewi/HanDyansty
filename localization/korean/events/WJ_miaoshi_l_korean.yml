 HuangDi_miaoshi.081.b:0 "한창 나이에 일찍 요절하고 제사를 힘써 받들었으니 '도'라 함. 시호 #Y 【도】"
 HuangDi_miaoshi.081.c:0 "나라에 있으며 난을 만나 백성이 꺾이고 다쳤으니 '민'이라 함. 시호 #Y 【민】"
 HuangDi_miaoshi.081.d:0 "나라에 있으며 난을 만나 백성이 꺾이고 다쳤으니 '민(위문할 민)'이라 함. 시호 #Y 【민】"
 HuangDi_miaoshi.081.e:0 "일찍 고아가 되어 짧게 살았고 공손하고 어질었으나 일찍 꺾였으니 '애'라 함. 시호 #Y 【애】"
 HuangDi_miaoshi.081.f:0 "나라를 맡았으나 드러나지 않았고 숨은 뜻을 이루지 못했으니 '은'이라 함. 시호 #Y 【은】"
 HuangDi_miaoshi.081.g:0 "옛것을 바꾸기 좋아하고 이루어진 법을 가벼이 고쳤으니 '이'라 함. 시호 #Y 【이】"
 HuangDi_miaoshi.081.h:0 "허물을 생각함이 깊고 멀며 삼가 근심했으니 '구'라 함. 시호 #Y 【구】"
 HuangDi_miaoshi.081.i:0 "나라에서 살지 못했으나 명예가 멀리까지 전해졌으니 '성'이라 함. 시호 #Y 【성】"
 HuangDi_miaoshi.081.j:0 "꾀하던 것을 이루지 못하고 하고자 하다 그쳤으니 '식'이라 함. 시호 #Y 【식】"
 HuangDi_miaoshi.081.k:0 "의를 펴려 했으나 이기지 못하고 미혹되어 공손하지 못했으니 '정'이라 함. 시호 #Y 【정】"
 HuangDi_miaoshi.081.l:0 "일을 일으키되 더디고 차분하며 편안하고 온화했으니 '서'라 함. 시호 #Y 【서】"
 HuangDi_miaoshi.081.m:0 "어려서 일찍 꺾였고 마음을 비워 고요함을 지켰으니 '충'이라 함. 시호 #Y 【충】"
 HuangDi_miaoshi.081.n:0 "바탕이 꾸밈을 이기고 공경하되 예에 맞지 않았으니 '야'라 함. 시호 #Y 【야】"
 HuangDi_miaoshi.081.o:0 "박하게 하여 예를 폐하고 검소하되 예에 맞지 않았으니 '검'이라 함. 시호 #Y 【검】"
 HuangDi_miaoshi.081.p:0 "이름과 실제가 어긋나지 않고 중정하여 사악함이 없었으니 '질'이라 함. 시호 #Y 【질】"
 HuangDi_miaoshi.081_d:0 "선제의 나이를 읽을 때 예관이 잠시 멈칫했다. 당신이 고개를 숙여 그 생애의 기록을 보니, 그제야 책상 위의 종이가 미리 준비한 송사보다도 짧다는 것을 알았다.\n\n많은 일들은 미처 하지도 못한 채, 이제는 물을 사람조차 없다. 누군가 지난날의 기대를 꺼내려다 말을 반쯤 하고는 거두고, 대신 후보 시호를 보아 달라고 청했다.\n\n당신은 그 몇 글자를 하나하나 읽었다. 이토록 짧은 세월에도, 끝내 사후의 호칭을 남겨야 할 때가 온 것이다."
 HuangDi_miaoshi.081_t:0 "어린 군주의 시호"
 HuangDi_miaoshi.082.a:0 "포악하여 친한 이가 없으니 '여'라 함. 시호: $Color_EHuang$ #bold 여제"
 HuangDi_miaoshi.082.b:0 "막혀서 통하지 않으니 '유'라 함. 시호: $Color_EHuang$ #bold 유제"
 HuangDi_miaoshi.082.c:0 "예를 버리고 뭇사람을 멀리하니 '양'이라 함. 시호: $Color_EHuang$ #bold 양제"
 HuangDi_miaoshi.082.d:0 "어지러웠으나 손상되지 않았으니 '영'이라 함. 시호: $Color_EHuang$ #bold 영제"
 HuangDi_miaoshi.082.e:0 "쾌락에 빠져 정사를 게을리하니 '황'이라 함. 시호: $Color_EHuang$ #bold 황제"
 HuangDi_miaoshi.082.f:0 "위세를 믿고 제멋대로 행하니 '여(어그러질 려)'라 함. 시호: $Color_EHuang$ #bold 여제"
 HuangDi_miaoshi.082.g:0 "이름과 실제가 어긋나니 '유'라 함. 시호: $Color_EHuang$ #bold 유제"
 HuangDi_miaoshi.082.h:0 "정령이 경박하니 '조'라 함. 시호: $Color_EHuang$ #bold 조제"
 HuangDi_miaoshi.082.i:0 "욕망을 좇아 예를 폐하니 '탕'이라 함. 시호: $Color_EHuang$ #bold 탕제"
 HuangDi_miaoshi.082.j:0 "잔학하여 함부로 죽이니 '폭'이라 함. 시호: $Color_EHuang$ #bold 폭제"
 HuangDi_miaoshi.082_d:0 "전대 폐제의 포폄과 제사 보존에 대해 담당 관청이 다시 재정을 청했다. 이것은 시호 한 글자를 고르는 일만이 아니라, 관례를 깨고 그를 위해 따로 묘호를 남길 것인지, 그리고 이 명분을 어디에 귀속시킬 것인지와도 관련된다.\n\n당신은 올라온 예의 의논을 자세히 살폈다. 그를 위해 제사를 보존한다 해도 본조의 태묘에 합사하지 않고, 전조의 후예만이 제사를 받든다. 칭호 하나를 남기는 것과 본조의 종통을 잇는 것은 본래 별개의 일이다.\n\n포폄이 한번 정해지면 한때의 연민으로 가벼이 고칠 수 없다. 당신은 예관에게 여러 의논을 차례로 읽게 하여, 이 사후의 명분을 분명하게 정하고자 했다."
 HuangDi_miaoshi.082_t:0 "전조 폐제의 시호 의논"
 HuangDi_miaoshi.092.a:0 "이것으로 시호를 삼는다."
 HuangDi_miaoshi.shturl:0 "법을 다스리되 죽이지 않음을 '간'이라 함. 시호: $Color_EHuang$ #bold 간"
 HuangDi_miaoshi_012_d:0 "예관이 의논하여 정한 존시를 다시 한번 낭독했다. 앞서의 분분하던 포폄과 추념이 여기에 이르러 마침내 모두가 한목소리로 부르는 호칭 하나가 되었다.\n\n#high [XianDi.GetName]: [XianDi.GetNicknameNoTooltip]황제#!\n\n당신은 다 듣고 나서 옮겨 적은 사본을 직접 살폈다. 이름은 여전히 그 이름이지만, 그 뒤에 덧붙은 글자는 이제 남들만이 부를 수 있다. 예관은 당신의 신호를 기다렸다가 문서를 거두어 보관하고, 남은 예사를 처리하러 갔다."
 HuangDi_miaoshi_012_t:0 "존호 의정"
 HuangDi_miaoshi_014_d:0 "의논하여 정한 사후의 호칭이 올라왔고, 예관이 당신 앞에서 마지막으로 한 번 읽었다. 당중에는 더 이상 이의를 다는 이가 없었고, 붓이 사본 위에 떨어지는 가벼운 소리만 들렸다.\n\n#high [XianDi.GetName]: [XianDi.GetNicknameNoTooltip]#!\n\n당신은 처음부터 다 보고 문서를 돌려주었다. 앞서 끝없이 논쟁할 때는 몇 마디만 더 보태면 다 말할 수 있을 것 같았다. 그러나 이제 명호가 정말로 정해지고 나니, 전각 안에는 여전히 말로 다 할 수 없는 빈자리 하나가 남아 있었다. 남은 예사는 이에 따라 처리하면 된다."
 SG_right_portrait_event:0 "[Character.Custom('WJ_GetUIName')]\n[Character.GetRelationToString( GetPlayer )]"
 SanGong_HunJun_desc:0 "이 인물은 만기를 게을리하고 혼용하여 정사를 어지럽혀, 그 화가 종사에까지 미쳤습니다."
 SanGong_KaiGuo_desc:0 "이 인물은 기틀을 열고 대통을 시작하였으며, 난을 평정하고 도읍을 정한 한 시대의 창업 군주입니다."
 SanGong_ShouCheng_desc:0 "이 인물은 대통을 잇고 문치를 지키며 이루어진 법을 따라, 천하를 태평하고 안정되게 하였습니다."
 SanGong_XiongZhu_desc:0 "이 인물은 정사에 힘써 나라를 잘 다스려 온 천하가 평안하니, 세상 사람들이 도가 있는 군주라 일컫습니다."
 SanGong_YouZhu_desc:0 "이 인물은 어린 나이에 즉위하여 미처 친정하지 못했으며, 조정의 정사는 대부분 보필하는 신하들에게 맡겨졌습니다."
 SanGong_Zdy_WangHao_text:0 ""
 SanGong_ZhongXing_desc:0 "이 인물은 위태로움을 붙들고 기울어짐을 바로잡아 종사를 되찾았으며, 국운을 다시 일으켰습니다."
 SanGong_miaohao_01_desc:0 "처음으로 중화를 세우고 비로소 천명을 받았으므로, 묘호를 태조라 올렸습니다."
 SanGong_miaohao_02_desc:0 "덕이 만방을 덮고 처음으로 황업의 기틀을 열었으므로, 묘호를 고조라 올렸습니다."
 SanGong_miaohao_05_desc:0 "공이 있어 백성을 편안히 하고 덕을 지녀 업을 따랐으므로, 묘호를 열조라 올렸습니다."
 SanGong_miaohao_09_desc:0 "백성을 편안히 하고 정사를 세워 큰 업을 처음 이루었으므로, 묘호를 성조라 올렸습니다."
 SanGong_miaohao_21_desc:0 "사직을 중흥하고 강산을 다시 안정시켰으므로, 묘호를 세조라 올렸습니다."
 SanGong_miaohao_22_desc:0 "사직을 바로잡아 돕고 제업을 중흥했으므로, 묘호를 중조라 올렸습니다."
 SanGong_miaohao_23_desc:0 "사직을 중흥하고 강산을 다시 안정시켰으므로, 묘호를 대조라 올렸습니다."
 SanGong_miaohao_27_desc:0 "공덕이 그보다 더할 수 없고 그 업이 찬란했으므로, 묘호를 태종이라 올렸습니다."
 SanGong_miaohao_28_desc:0 "중흥에 큰 일을 하였고 덕이 높아 존숭할 만했으므로, 묘호를 고종이라 올렸습니다."
 SanGong_miaohao_29_desc:0 "중흥에 공이 있어 백세토록 옮기지 않으므로, 묘호를 세종이라 올렸습니다."
 SanGong_miaohao_30_desc:0 "중흥에 공이 있어 백세토록 옮기지 않으므로, 묘호를 대종이라 올렸습니다."
 SanGong_miaohao_31_desc:0 "신기를 중흥하고 종조를 다시 떨쳤으므로, 묘호를 중종이라 올렸습니다."
 SanGong_miaohao_32_desc:0 "성대한 덕이 높고 높으며 그 아름다움이 그치지 않았으므로, 묘호를 인종이라 올렸습니다."
 SanGong_miaohao_33_desc:0 "공이 사해에 빛나고 인이 천 년에 행해졌으므로, 묘호를 현종이라 올렸습니다."
 SanGong_miaohao_34_desc:0 "성스럽고 신령하여 요임금의 덕에 더욱 걸맞았으므로, 묘호를 신종이라 올렸습니다."
 SanGong_miaohao_35_desc:0 "통하지 않는 바가 없고 높은 덕으로 대통을 드리웠으므로, 묘호를 성종이라 올렸습니다."
 SanGong_miaohao_36_desc:0 "굳센 덕으로 능히 이루고 천지사방을 거듭 밝혔으므로, 묘호를 숙종이라 올렸습니다."
 SanGong_miaohao_37_desc:0 "지극히 어질고 지극히 효성스러우며 뜻을 잘 잇고 일을 잘 펼쳤으므로, 묘호를 효종이라 올렸습니다."
 SanGong_miaohao_38_desc:0 "하늘만이 총명하고 성인만이 이를 본받으므로, 묘호를 헌종이라 올렸습니다."
 SanGong_miaohao_39_desc:0 "성스러운 선함이 널리 알려지고 정교가 널리 펼쳐졌으므로, 묘호를 선종이라 올렸습니다."
 SanGong_miaohao_40_desc:0 "공이 있어 백성을 편안히 하고 명을 받아 크게 펼쳤으므로, 묘호를 열종이라 올렸습니다."
 SanGong_miaohao_41_desc:0 "사방을 밝게 비추고 덕이 신령한 요임금을 닮았으므로, 묘호를 명종이라 올렸습니다."
 SanGong_miaohao_42_desc:0 "세운 것이 이루어지고 공을 이루어 사방을 모두 차지했으므로, 묘호를 성종이라 올렸습니다."
 SanGong_miaohao_43_desc:0 "백성을 편안하고 즐겁게 보살펴 성강의 치세에 가까웠으므로, 묘호를 강종이라 올렸습니다."
 SanGong_miaohao_44_desc:0 "지극한 도와 지극한 참됨이 그윽하고 또 그윽했으므로, 묘호를 현종이라 올렸습니다."
 SanGong_miaohao_45_desc:0 "다스림이 지극한 도에 가깝고 덕이 종으로 일컬을 만했으므로, 묘호를 진종이라 올렸습니다."
 SanGong_miaohao_46_desc:0 "화란을 능히 평정하고 형벌로 백성을 능히 복종시켰으므로, 묘호를 무종이라 올렸습니다."
 SanGong_miaohao_47_desc:0 "천지를 경위하고 자애롭게 백성을 사랑했으므로, 묘호를 문종이라 올렸습니다."
 SanGong_miaohao_48_desc:0 "뛰어나고 남다른 군주로 무리 중에 빼어났으므로, 묘호를 영종이라 올렸습니다."
 SanGong_miaohao_49_desc:0 "슬기로움으로 성인이 되고 지혜와 생각이 깊고 멀었으므로, 묘호를 예종이라 올렸습니다."
 SanGong_miaohao_50_desc:0 "요임금이 사람을 알아보는 것을 말하였듯 대대로 밝은 왕이 있으므로, 묘호를 철종이라 올렸습니다."
 SanGong_miaohao_51_desc:0 "전적과 역사가 그 덕을 증명하고 백성을 편안히 하여 진실로 이끌었으므로, 묘호를 덕종이라 올렸습니다."
 SanGong_miaohao_52_desc:0 "덕을 숭상하고 근본에 보답하며 조상을 높이고 종묘를 융성케 했으므로, 묘호를 숭종이라 올렸습니다."
 SanGong_miaohao_53_desc:0 "덕을 펴고 의를 지키며 덕스러운 용모가 고요하고 깊었으므로, 묘호를 목종이라 올렸습니다."
 SanGong_miaohao_54_desc:0 "빛나고 크게 공을 세워 앞선 업을 능히 이었으므로, 묘호를 광종이라 올렸습니다."
 SanGong_miaohao_55_desc:0 "의로써 이루고 아름다운 업을 빛나게 이었으므로, 묘호를 경종이라 올렸습니다."
 SanGong_miaohao_56_desc:0 "억지로 하지 않아도 이루어지고 서두르지 않아도 빨랐으므로, 묘호를 순종이라 올렸습니다."
 SanGong_miaohao_57_desc:0 "법전에 잘 맞고 장중하며 공경스럽고 위엄이 있었으므로, 묘호를 경종이라 올렸습니다."
 SanGong_miaohao_58_desc:0 "속마음이 깊고 맑아 한결같으며 편안히 오래 살았으므로, 묘호를 영종이라 올렸습니다."
 SanGong_miaohao_59_desc:0 "큰 업을 일으키고 성스러운 계획을 크게 떨쳤으므로, 묘호를 흥종이라 올렸습니다."
 SanGong_miaohao_60_desc:0 "도를 체득하여 하나를 얻고 하늘이 내린 자연을 따랐으므로, 묘호를 도종이라 올렸습니다."
 SanGong_miaohao_61_desc:0 "법도가 밝고 크며 말에 문채가 있었으므로, 묘호를 장종이라 올렸습니다."
 SanGong_miaohao_62_desc:0 "온화하고 성스럽고 선하며 백성을 사랑하고 바탕이 깊었으므로, 묘호를 의종이라 올렸습니다."
 SanGong_miaohao_63_desc:0 "법도가 밝고 크며 말에 문채가 있었으므로, 묘호를 장종이라 올렸습니다."
 SanGong_miaohao_64_desc:0 "과감하고 굳세며 성품이 강직하고 결단력이 있었으므로, 묘호를 의종이라 올렸습니다."
 SanGong_miaohao_65_desc:0 "너그럽고 어질어 뭇사람을 얻고 두터운 덕으로 대통을 이었으므로, 묘호를 유종이라 올렸습니다."
 SanGong_miaohao_66_desc:0 "정사가 공평하고 형벌이 엄정하며 도술을 드러내 밝혔으므로, 묘호를 이종이라 올렸습니다."
 SanGong_miaohao_67_desc:0 "적을 이기고 뜻이 굳세며 위의에 어긋남이 없었으므로, 묘호를 장종이라 올렸습니다."
 SanGong_miaohao_68_desc:0 "성대하고 밝으며 화락하고 공경스러운 덕이 빛났으므로, 묘호를 희종이라 올렸습니다."
 SanGong_miaohao_69_desc:0 "화기가 널리 퍼지고 공이 있어 사람을 편안히 했으므로, 묘호를 희종이라 올렸습니다."
 SanGong_miaohao_70_desc:0 "바탕이 깊어 간언을 받아들이고 자애롭게 친족을 사랑했으므로, 묘호를 희종이라 올렸습니다."
 SanGong_miaohao_71_desc:0 "널리 듣고 재능이 많으며 은혜롭고 안으로 덕이 있었으므로, 묘호를 헌종이라 올렸습니다."
 SanGong_miaohao_72_desc:0 "도덕이 순일하고 인을 체득하여 백성을 길렀으므로, 묘호를 원종이라 올렸습니다."
 SanGong_miaohao_73_desc:0 "복과 경사가 끊이지 않고 종통을 잘 이었으므로, 묘호를 경종이라 올렸습니다."
 SanGong_miaohao_74_desc:0 "의를 받들고 법도를 따르며 공손하고 검소하며 장중하고 공경스러웠으므로, 묘호를 예종이라 올렸습니다."
 SanGong_miaohao_75_desc:0 "큰 덕이 아름답게 가득하고 고아한 운치가 밝게 드러났으므로, 묘호를 휘종이라 올렸습니다."
 SanGong_miaohao_76_desc:0 "용모와 위의가 공손하고 아름다우며 덕을 밝히고 노고가 있었으므로, 묘호를 소종이라 올렸습니다."
 SanGong_miaohao_77_desc:0 "백성을 사랑하여 베풀기를 좋아하고 부드러운 바탕으로 간언을 받아들였으므로, 묘호를 혜종이라 올렸습니다."
 SanGong_miaohao_78_desc:0 "강하고 굳세게 정사를 잡고 장엄하게 아랫사람을 대했으므로, 묘호를 위종이라 올렸습니다."
 SanGong_miaohao_79_desc:0 "현자를 높이고 의를 귀히 여기며 덕이 바르고 용모가 아름다웠으므로, 묘호를 공종이라 올렸습니다."
 SanGong_miaohao_80_desc:0 "화합을 좋아하여 다투지 않으니 만백성이 편안히 의지했으므로, 묘호를 안종이라 올렸습니다."
 SanGong_miaohao_81_desc:0 "먼 방계에서 제위를 이어 앞선 업을 계승했으므로, 묘호를 소종이라 올렸습니다."
 SanGong_miaohao_82_desc:0 "위의를 모두 갖추고 일을 공경하며 씀씀이를 절약했으므로, 묘호를 흠종이라 올렸습니다."
 SanGong_miaohao_83_desc:0 "생각이 깊고 통달하며 민첩하고 지난 허물을 뉘우쳤으므로, 묘호를 사종이라 올렸습니다."
 SanGong_miaohao_84_desc:0 "나아가고 물러남이 본받을 만하고 조용하여 한결같았으므로, 묘호를 도종이라 올렸습니다."
 SanGong_miaohao_85_desc:0 "예를 지키고 의를 잡으며 성스럽게 닦아 교화를 본보였으므로, 묘호를 단종이라 올렸습니다."
 SanGong_miaohao_86_desc:0 "능히 공경하고 백성을 위해 부지런하며 무의 뜻을 능히 이루었으므로, 묘호를 환종이라 올렸습니다."
 SanGong_miaohao_87_desc:0 "갑주를 입고 노고가 있었으며 도와서 이룸이 있었으므로, 묘호를 양종이라 올렸습니다."
 SanGong_miaohao_88_desc:0 "큰 계통을 이어받아 만방을 모두 다스렸으므로, 묘호를 통종이라 올렸습니다."
 SanGong_miaohao_89_desc:0 "백성을 편안히 하려 크게 생각하고 행실이 순수하여 둘이 없었으므로, 묘호를 정종이라 올렸습니다."
 SanGong_miaohao_zdy_desc:0 "뒤를 이은 군주가 직접 묘호를 정하여 「[ROOT.Char.GetLocalizedText( 'SanGong_miaohao_zdy_text' )]」 자를 취했습니다."
