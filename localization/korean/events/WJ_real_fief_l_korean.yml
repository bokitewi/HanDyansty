 WJ_rf_request_valid_tt:0 "당신은 태부, 승상, 대장군 또는 삼공의 자리에 있어야 하고, 이미 후작을 받았으며, 천자를 당신의 [puppet|E](으)로 두고 있어야 함. 녹상서사는 당신이나 당신의 문생, 막료가 맡아야 하며, 시중, 대사마, 상서령 세 직 중 적어도 두 직이 당신의 문생, 막료의 손에 있어야 함"
 WJ_rf_promote_valid_tt:0 "천자의 작위가 [hegemony|E]급이어야 하며 당신의 [puppet|E]이어야 함. 녹상서사는 당신이나 당신의 문생, 막료가 맡아야 하며, 당신의 봉국은 적어도 100개의 현을 다스려야 함"
 WJ_rf_no_pending_tt:0 "지금은 아직 의논이 끝나지 않은 봉국의 일이 없음"
 WJ_rf_expand_liege_tt:0 "당신은 여전히 천자의 신하임"
 WJ_rf_expand_cooldown_tt:0 "당신이 봉함을 받았거나 마지막으로 봉지를 더한 지 3년이 지났음"
