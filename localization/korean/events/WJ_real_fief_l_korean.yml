 WJ_rf_stage_0:0 "먼저 봉국이 있을 주를 고르십시오."
 WJ_rf_stage_1:0 "다음으로 국도가 있을 군을 고르십시오."
 WJ_rf_stage_2:0 "다음으로 군 하나를 고르십시오. 국도가 있는 군과 맞닿아 있어야 합니다."
 WJ_rf_stage_3:0 "마지막으로 군 하나를 고르십시오. 이미 고른 군들과 맞닿아 있어야 합니다. 고르고 나면 봉국이 곧바로 세워집니다."
 WJ_rf_stage_expand:0 "봉국과 맞닿은 군 하나를 골라 나라에 편입합니다."
