l_korean:
 WJ_rf_grant:0 "실봉공 책봉"
 WJ_rf_grant_desc:0 "세 군을 떼어 이 사람을 위해 세습 봉국을 세웁니다."
 WJ_rf_request_decision:0 "봉공 신청"
 WJ_rf_request_decision_desc:0 "천자가 이미 내 손안에 있고 대각의 요직도 모두 나의 문생과 옛 관리들이라면, 평범한 작록으로는 보답이 되지 않는다. 그때가 되면 천자에게 군을 떼어 나라를 세우게 하여, 내 가문이 대대로 한 지방을 지키게 할 수 있다."
 WJ_rf_request_decision_tooltip:0 "천자에게 세 군을 떼어 당신을 위한 세습 봉국을 세워 달라고 청함"
 WJ_rf_request_decision_confirm:0 "봉국 건립을 청하라!"
 WJ_rf_expand_decision:0 "봉국 확장 신청"
 WJ_rf_expand_decision_desc:0 "봉국이 막 세워져 강토가 아직 좁다. 인접한 군 하나를 나라에 더 편입할 수 있다면, 이 기업이 비로소 든든히 서게 될 것이다."
 WJ_rf_expand_decision_tooltip:0 "봉국과 맞닿은 군 하나를 봉국에 편입함"
 WJ_rf_expand_decision_confirm:0 "봉지를 더해 달라고 청하라!"
 WJ_rf_promote_decision:0 "왕으로 진봉 요청"
 WJ_rf_promote_decision_desc:0 "봉국은 날로 커지고, 조정에는 더 이상 나와 어깨를 나란히 할 자가 없다. 일개 공작으로는 지금의 권세에 걸맞지 않으니, 한 걸음만 더 나아가면 왕으로 작위를 올릴 수 있다."
 WJ_rf_promote_decision_tooltip:0 "왕으로 작위를 올리며, 기존 봉국은 여전히 당신의 소유로 남음"
 WJ_rf_promote_decision_confirm:0 "왕으로 작위를 올려라!"
 WJ_rf_pick:0 "봉국 강역 획정"
 WJ_rf_pick_desc:0 "지도가 책상 위에 펼쳐졌다. [ROOT.Char.MakeScope.Var('wj_rf_target').Char.GetUIName]의 봉국 경계를 이 몇 군 사이에서 그어야 한다.\n\n[ROOT.Char.Custom('WJ_rf_step_desc')]\n\n여러 군이 봉국에 편입된 뒤에도 기존의 장리들은 대부분 그 직을 지키며, 다만 이제부터 봉국에 예속된다."
 WJ_rf_success:0 "조명이 내려짐"
 WJ_rf_success_desc:0 "조서가 내려져, [wj_rf_beneficiary.GetUIName] 봉국의 강역과 명호가 이제부터 조정의 판적에 기록됩니다."
 WJ_rf_failed:0 "봉국 의논 중단"
 WJ_rf_failed_desc:0 "조서는 이미 작성되었으나, 여러 군의 인계가 의논대로 이루어지지 못했습니다. 봉국의 일은 잠시 보류할 수밖에 없으며, 조정은 이로 인해 아무것도 소모하지 않았으니 훗날 다시 의논할 수 있습니다."
 WJ_rf_duke_rank:0 "공"
 WJ_rf_dynamic_name:0 "[ROOT.Char.Custom('WJ_rf_selected_name')]국"
