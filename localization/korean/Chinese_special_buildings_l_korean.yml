l_korean:
 building_type_jiaodong_golden_mines_01: "교동 금광"
 building_type_jiaodong_golden_mines_01_desc: "동래와 교동 일대는 구릉이 굽이치고, 시냇물 모래 속에서 금가루를 일어 낼 수 있다. 마을 사람들은 무리 지어 산에 들어가 돌을 깨고 모래를 일었는데, 얻는 것은 한 줌에 불과하나 티끌 모아 태산이라 그 양이 제법 쏠쏠하였다."
 building_type_Xinglong_golden_mines_01: "하북 흥륭 금광"
 building_type_Xinglong_golden_mines_01_desc: "어양 북쪽 연산 깊은 곳, 골짜기에 금맥이 숨어 있다. 광부들은 돌을 깨 모래를 캐내어 시냇가에서 거듭 일어 씻었는데, 이따금 덩어리 금을 얻기도 하였다."
 building_type_lishui_golden_mines_01: "여수 금광"
 building_type_lishui_golden_mines_01_desc: "형남의 여수에서는 금이 나니, 모래를 일면 금 알갱이가 보인다. 한비자가 말하길, 이곳 사람들은 금모래를 몰래 캐는 이가 많아 관아가 엄히 금하여도 금령을 어기는 자가 길에 끊이지 않았다고 한다."
 building_type_yaan_golden_mines_01: "아안 영경 금광"
 building_type_yaan_golden_mines_01_desc: "촉군 엄도현의 첩첩산중에는 시냇물이 세차게 흐르고 모래 속에 금가루가 숨어 있다. 효문황제가 일찍이 엄도의 동산을 등통에게 내려 돈을 주조하게 하였으니, 이곳 광물이 얼마나 풍부한지 알 수 있어 예로부터 촉 사람들이 귀히 여겼다."

 building_type_jiaodong_crystal_mines_01: "수정·마노·옥 광산"
 building_type_jiaodong_crystal_mines_01_desc: "이곳 산에서는 수정과 마노, 아름다운 옥이 나는데 빛깔이 영롱하다. 장인들이 이를 다듬어 잔과 띠고리, 패물을 만드니 귀인들이 앞다투어 사들였다."
