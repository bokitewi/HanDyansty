 building_type_xibeiyanchi_salt_mines_01: "염지"
 building_type_xibeiyanchi_salt_mines_01_desc: "서북 변경에는 염지가 많은데, 못물이 마른 자리에 소금이 엉기니 이를 융염이라 부른다. 먹을 수도 있고 약재로도 쓴다."
 building_type_bashu_salt_mines_01: "파촉 염정"
 building_type_bashu_salt_mines_01_desc: "파촉의 산중에는 짠 샘이 많아 마을 사람들이 우물을 파 소금물을 길어 올리고 졸여 소금을 만든다. 전하기를 진나라 때 촉군 태수 이빙이 광도에 염정을 팠다 하니, 그 뒤로 정염의 이익이 촉 땅 전역에 퍼졌다."
 building_type_liaodong_salt_mines_01: "요동 염전"
 building_type_liaodong_salt_mines_01_desc: "요동 해안은 암초가 험하여 소금을 구울 갯벌이 좁으니, 나는 해염은 많지 않으나 희고 고운 것으로 이름났다."
 building_type_jiaodong_salt_mines_01: "교동 염전"
 building_type_jiaodong_salt_mines_01_desc: "교동의 만은 대부분 바위 해안이라 염전이 좁고 산출이 적지만, 바다 가까운 마을들에 대기에는 족하다."
 building_type_lubei_salt_mines_01: "노북 염구"
 building_type_lubei_salt_mines_01_desc: "제나라 북쪽 바닷가는 땅속 소금물이 바닷물보다 짜서 끓이면 소금이 된다. 관중이 어염의 이익을 일으킨 뒤로 제나라 땅은 이로써 천하에서 가장 부유해졌다."
 building_type_wuyue_salt_mines_01: "오월 해염 지대"
 building_type_wuyue_salt_mines_01_desc: "오월의 바닷가에서는 바닷물을 끓여 소금을 만들었는데 그 산출이 매우 풍부하였다. 고조 때 오왕 유비가 바닷물을 끓여 소금을 만들고 산의 구리로 돈을 주조하여 나라 살림이 넉넉하였으니, 태사공은 오 땅을 두고 “동쪽에 해염의 풍요가 있다”고 하였다."

