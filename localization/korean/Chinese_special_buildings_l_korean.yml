 building_type_linzi_iron_mines_01: "소형 철광"
 building_type_linzi_iron_mines_01_desc: "제나라 땅은 관중 이래로 소금과 철의 이익에 힘입어 제후들 가운데 으뜸가는 부를 누렸다. 임치 근교에 작은 철광이 하나 있는데, 광맥이 깊지 않아 산출은 많지 않으나 마을의 농기구를 대기에는 넉넉하였다."
 building_type_xuzhou_iron_mines_01: "대형 철광 지대"
 building_type_xuzhou_iron_mines_01_desc: "팽성 일대의 산에는 철광이 풍부하여 조정이 이곳에 철관을 두고 일꾼들을 부려 돌을 캐고 쇠를 제련하였다. 세월이 흐르며 갱도와 용광로가 줄지어 늘어섰고, 주변에는 주조를 업으로 삼는 집들이 대거 모여들었다."
