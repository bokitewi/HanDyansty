l_korean:
 hd_peach_garden.0001.t:0 "도원결의"
 hd_peach_garden.0001.desc:0 "어제만 해도 당신은 모병 방 아래에 서서 병사를 모을 돈이 없음을 길게 탄식하고 있었다. 장비가 한 번 소리쳐 묻더니 당신을 주막으로 끌고 들어갔다. 그는 가산을 내어 향용을 모집하겠다고 했고, 뒤이어 주막에 들어온 관우는 본래 종군하러 서둘러 오던 길이었는데, 당신의 뜻을 듣고는 자리를 옮겨 함께 앉았다. 이야기가 무르익자 익덕은 자신의 장원으로 가자며 형제의 의를 맺자고 했다.\n\n지금 장원 뒤편의 복숭아꽃이 한창 피어 있다. 검은 소와 흰 말의 제물은 이미 갖춰졌고, 향 연기가 제상 앞에서 하늘하늘 피어오른다. 어제 집안을 털어 거사하겠다던 익덕은 웃음을 거두었고, 운장은 옷매무새를 가다듬고 곁에 서서 당신이 앞으로 나오기를 기다린다.\n\n당신은 고개를 숙여 옷깃을 바로잡는다. 한실의 종친이면서도 지금까지 돗자리를 짜고 짚신을 팔아 노모를 봉양할 수밖에 없었다. 이제 가산을 내놓겠다는 이가 있고, 목숨을 맡기겠다는 이가 있는데, 어찌 그들을 저버릴 수 있겠는가?\n\n당신은 두 사람 사이에 무릎을 꿇었다. 눈앞의 이 향이 다 타고 나면, 당신들은 더 이상 함께 종군하러 가는 남남이 아니다."
 hd_peach_garden.0001.a:0 "같은 해 같은 날 태어나기를 바라지 않으나, 같은 해 같은 날 죽기를 바라노라"
 hd_peach_garden.0002.t:0 "의기를 처음 세우다"
 hd_peach_garden.0002.desc:0 "결의의 술잔을 거둔 지 얼마 되지 않아, 의군을 돕겠다는 손님이 문밖에 찾아왔다. 중산의 대상인 장세평과 소쌍이 말을 팔러 탁군을 지나다 당신을 보고 범상치 않다 여겨 금과 비단을 후하게 내주었다. 소식을 듣고 찾아온 고을 자제들도 이미 삼천에 이르렀다.\n\n마당이 단번에 붐볐다. 어디서 병기를 받느냐고 묻는 이, 대오 배정을 기다리는 이, 그리고 언제 밥을 먹을 수 있는지만 알고 싶어 하는 이도 있었다. 군사를 일으켜 백성을 구하겠다는 말은 이미 당신 입에서 나왔다. 몸과 목숨을 당신 손에 맡긴 이 사람들을 더욱 실망시켜서는 안 된다.\n\n당신은 지원을 받아들이고, 먼저 명부부터 정리하게 했다. 의기 아래에 이제 정말로 행군할 수 있는 군대가 있어야 한다."
 hd_peach_garden.0002.a:0 "이 후한 도움을 받아 의군을 정비한다."
 hd_liu_bei_sponsored_army:0 "중산 의상의 의병"
