 hd_historical_actor_protection:0 "길인천상"
 hd_historical_actor_protection_desc:0 "이 인물은 복이 두터워 여러 차례 위험을 겪고도 늘 무사히 빠져나옵니다."
 hd_dong_zhuo_timeline_protection:0 "갑사 호위"
 hd_dong_zhuo_timeline_protection_desc:0 "이 인물은 체격이 우람하고 드나들 때마다 갑사가 호위하여 다른 이가 가까이 다가가기 어렵습니다."

 hd_fengying.0001.t:0 "천자 봉영"
 hd_fengying.0001.desc:0 "천자를 봉영하자는 말이 나오자 장막 안에 갑자기 충의의 말이 넘쳐 났다. 당신은 그들이 번갈아 말하는 것을 다 듣고 나서 한마디만 물었다. “어가는 누가 호송하는가? 도착한 뒤에는 또 어디에 머무시게 할 것인가?” 이번에는 사람들이 방금처럼 한목소리를 내지 못했다.\n\n당신은 장안과 허창 사이의 길을 사람들에게 가리켜 보였다. 천자를 맞이하려면 먼저 사례를 경영하고 장안을 취한 뒤, 어가를 허창으로 모셔 안치해야 한다. 천자의 명분은 거기 있지만, 그 명분으로 사방을 호령하려면 필요한 것은 병마와 전량이지 신하들의 눈물 몇 줄이 아니다.\n\n호송할 뜻만 표하거나 아예 이 일에 관여하지 말라고 권하는 이도 있었다. 당신의 손가락은 허창 위에 머문 채 움직이지 않았다. 이런 기회가 눈앞에 있는데, 당신이 취하지 않는다면 언젠가는 다른 누군가가 취할 것이다."
 hd_fengying_cao_receive:0 "사례를 경영하고 어가를 봉영한다."
 hd_fengying_cao_warfare_unlocked:0 "이제부터 천자를 봉영한다는 명분으로 장안을 차지한 자에게 군사를 일으켜 죄를 물을 수 있습니다."
 hd_fengying_cao_escort:0 "어가를 호위할 뜻만 표하고 조정은 장악하지 않는다."
 hd_fengying_cao_refuse:0 "이 일에는 관여하지 않고 눈앞의 일부터 돌본다."

 hd_cao_fengying_cb:0 "협천자이령제후"
 hd_cao_fengying_cb_name:0 "협천자이령제후"
 HD_CAO_FENGYING_WAR_NAME:0 "조조의 장안 탈취전"
 hd_cao_fengying_victory_desc:0 "조조가 경조와 그 관할 현들을 차지합니다. 허창이 여전히 그의 손에 있다면 천자를 맞이하여 허도에 머무시게 하고, 섭정으로서 조정을 총괄하며, 천자 직할의 땅과 제후들이 모두 그의 지휘 아래 들어가고 공경백관은 여전히 천자에게 직속합니다. 허창을 이미 잃었다면 잠시 장안을 점거하고, 허창을 되찾은 뒤에 어가를 맞이합니다."
 hd_cao_fengying_no_victory_desc:0 "조조가 장안을 차지하지 못했습니다. 사례에 대한 명분은 남아 있으니, [truce|E] 기간이 끝나면 다시 일으킬 수 있습니다."
 hd_cao_fengying_start_war_decision:0 "협천자이령제후 발동"
 hd_cao_fengying_start_war_decision_desc:0 "경조는 아직 다른 이의 손에 있다. 장안을 먼저 취하지 않으면 봉영이라는 두 글자는 빈말일 뿐이다."
 hd_cao_fengying_start_war_decision_tooltip:0 "‘협천자이령제후’를 명분으로 경조를 차지한 자에게 전쟁을 겁니다."
 hd_cao_fengying_start_war_decision_confirm:0 "장안으로 진격하라!"

 hd_historical_world.0100.t:0 "관도 전야"
 hd_historical_world.0100.desc:0 "군보에 또 원소가 언급되자 장막 안의 누군가가 먼저 한숨을 내쉬었다. 당신은 그 한숨은 아껴 두고 먼저 황하 양안의 수비부터 분명히 말하라고 했다. 원군의 수가 많은 것은 분명 두렵지만, 그렇다고 당신의 군의가 한숨만 남을 정도는 아니다.\n\n지도 위의 관도 한 곳은 이미 수없이 손가락으로 짚였다. 당신은 각 방면의 보급로를 살피며 적진의 동정을 묻고, 아군의 측후도 물었다. 사람들의 의견은 차츰 몇 갈래로 나뉘었다. 싸우자는 이, 지키자는 이, 화친하자는 이가 있었고, 먼저 다른 곳의 적을 정리하라고 권하는 이도 있었다.\n\n당신은 다 듣고 나서도 손끝으로 지도 모서리를 누르고 있었다. 당신들이 아무리 빈틈없이 논의한다 해도 본초가 군사 한 부대라도 덜 보내지는 않을 것이다. 그러나 이 기세를 어떻게 받아 낼지는 그가 대신 정해 줄 일이 아니다."
 hd_historical_world.0100.alt_desc:0 "관도의 군의가 절반쯤 진행되었을 때, 미리 정해 둔 군령을 내릴 수 없게 되었다. 경계와 옛 약조, 상하 통속의 얽힘이 하나하나 보고되자, 방금까지 진군을 강하게 주장하던 이들도 말을 바꾸기 시작했다.\n\n당신은 내보내지 못한 그 문서를 접었다. 지금 이런 식으로 전쟁을 시작할 수 없는 이상, 호기로운 말을 다시 늘어놓으며 사람들을 장막 안에 붙잡아 둘 필요도 없다.\n\n“다른 방법을 논하자.” 당신은 장수들에게 계속 논의하라는 손짓을 했다. 본초 쪽이 무슨 생각을 하든 그것은 별개의 문제이고, 당신의 병마가 내릴 수 없는 군령 하나를 마냥 기다리고 있을 수는 없다. 관도에 관한 논의는 오늘 결론을 지어야 한다."
 hd_historical_world.0100.small_realm_desc:0 "누군가 관도에 관한 논의를 강개하게 늘어놓았다. 마치 뿔나팔 한 번에 천하를 뒤흔들 수 있다는 듯이. 당신이 그에게 먼저 손에 든 군적을 한 번 읽어 보라고 하자, 장막 안은 과연 방금보다 조용해졌다.\n\n원소는 반드시 상대해야 할 적이지만, 당신 손에 있는 주현과 병량도 모두 여기 그대로 있다. 싸운다면 이 밑천으로 싸우는 것이고, 싸우지 않는다 해도 꼭 약함을 보이는 것은 아니다.\n\n당신은 군적을 책상 위로 밀어 놓았다. 땅은 좁아도 진퇴의 길은 분명히 생각해 두어야 한다. 장수들은 이미 충분히 말했으니, 이제 당신의 계획을 들려줄 차례다."
 hd_guandu_decide_battle:0 "관도에서 결전하여 본초를 막는다."
 hd_guandu_defend_yellow_river:0 "강을 따라 굳게 지키며 정면으로 다투지 않는다."
 hd_guandu_compromise:0 "잠시 물러나 본초와 화친한다."
 hd_guandu_clear_other_enemies:0 "먼저 측후를 안정시킨 뒤 하북을 도모한다."
 hd_historical_world.0190.t:0 "관도: 하북군 퇴각"
 hd_historical_world.0190.desc:0 "“원군이 물러났습니다!” 전령이 두 번째로 보고하고서야 당신은 비로소 손에 든 문서를 내려놓았다. 장막 밖에서는 벌써 환호성이 터지기 시작했다. 당신이 웃으며 직접 본 것이냐, 아니면 상을 받으려고 서두른 것이냐 묻자, 그는 서둘러 경과를 다시 자세히 이야기했다.\n\n분명히 이겼다. 어제까지만 해도 군량을 헤아리며 하루하루를 버텨야 했는데, 오늘은 먼저 퇴로를 생각하라고 권하던 이들이 오히려 앞다투어 하북을 논한다. 당신은 그들에게 먼저 각 부대를 수습하고 보급로를 잇게 하여, 방금 손에 넣은 승세를 다시 엉망으로 만들지 않도록 했다.\n\n장막 입구를 나서자 환호성이 더욱 커졌다. 북쪽을 올려다보니, 가슴에 막혀 있던 숨이 그제야 다 풀려 나왔다. 본초의 근본은 아직 남아 있다. 그래도 좋다. 이제부터는 그가 당신의 군보를 꼼꼼히 읽어야 할 차례다."
 hd_historical_world.0191.t:0 "관도: 원군의 승리"
 hd_historical_world.0191.desc:0 "조군이 패했다. 승전보가 이 대목에 이르자 장막 안이 잠시 조용해졌다가, 곧이어 축하하는 소리가 한데 어우러졌다. 당신은 전령에게 다시 한번 읽게 하며, 특히 조군이 어떻게 물러났는지를 분명히 말하게 했다.\n\n앞서 당신의 용병을 의심하던 이들이 지금은 하나같이 공손하다. 당신은 그 자리에서 그들의 묵은 잘못을 들추지 않고, 승전 문서를 책상 맨 앞에 놓은 채 좌우에 명해 전리품을 헤아리고 장병을 안돈하게 했다. 장병들이 원씨를 위해 얻어 낸 성세를 그저 연회석의 술 몇 잔으로 흘려보낼 수는 없다.\n\n맹덕에게 근본이 얼마나 남았는지는 나중에 다시 논하면 된다. 오늘 관도에서 이겼으니, 이 중원의 다툼에서 누가 먼저 고개를 숙였는지 천하 사람들에게 알려야 한다."

 hd_historical_world.0200.t:0 "적벽 전야"
 hd_historical_world.0200.desc:0 "형주의 답서는 이미 받았으나, 좌우는 여전히 강동의 물길을 두고 저마다 다른 말을 한다. 당신은 그들에게 먼저 수군과 보급로, 군중의 사정을 분명히 정리하라고 했다. 건너편 성읍의 이름만 읽어 주지 말고.\n\n당장 진군하자는 이도 있고, 한 달 더 정비하자는 이도 있다. 당신은 배와 군량의 장부를 하나하나 살펴보며, 어떤 우환은 이미 처리되었고 어떤 것은 아직 경계해야 하는지 분명히 물었다. 앞서의 말은 한 번 들었으면 충분하다. 오늘의 일은 오늘의 근거가 있어야 한다.\n\n강동이 바로 눈앞에 있지만, 군사를 거두는 것도 여전히 하나의 길이다. 당신은 지도를 펼치며, 누구에게도 서둘러 당신의 웅심에 결론을 내리게 하지 않았다. 나아갈지, 정비할지, 아니면 여기서 멈출지. 전군이 당신의 호령을 기다리고 있다."
 hd_historical_world.0200.alt_desc:0 "도강을 논하는 군의가 새 보고 하나로 또 중단되었다. 그 안에 적힌 영속과 옛 약조의 변화를 읽은 당신이 미리 정해 둔 호령을 책상 아래로 밀어 두자, 장막 안의 몇 사람이 곧 입을 다물었다.\n\n그들은 아마 당신이 화를 낼지 지켜보고 있을 것이다. 하지만 화를 낸들 무엇하겠는가. 강 위의 물길이 옛 지도대로 다시 놓이기라도 한단 말인가? 지금 원래 논의대로 강동과 결전할 수 없다면, 달리 계획을 세울 수밖에 없다.\n\n당신은 문서를 새로 가져오게 했다. 앞의 한 걸음이 여기까지 왔다고 해서 다음 걸음에 길이 하나만 남은 것은 아니다. 오늘 무엇을 해야 하는지는 전군에게 알려야 한다."
 hd_chibi_continue_southeast:0 "군사를 이끌고 동쪽으로 내려가 곧장 강동을 친다."
 hd_chibi_prepare_fleet:0 "수군과 보급로를 정비하고 한 달 뒤에 다시 논한다."
 hd_chibi_withdraw:0 "군사를 거두어 북으로 돌아가 병사들을 쉬게 한다."
 hd_chibi_hold_jingzhou:0 "적당한 데서 멈추고 더는 동진하지 않는다."
 hd_historical_world.0210.t:0 "형주의 거취"
 hd_historical_world.0210.desc:0 "조군이 다가온다는 소식이 주부에 전해지자 의논하던 이들이 두 파로 갈라졌다. 한쪽은 형주의 산천이 지킬 만하다고 했고, 다른 쪽은 병량을 거듭 따져 보다가 끝내 “차라리 백성을 보전하는 편이 낫다”는 한마디만 남겼다.\n\n당신은 책상 위의 주인을 바라본다. 예전에 누가 무엇을 약속했든, 지금 형주를 맡고 있는 것은 당신이니, 항복할지 지킬지의 결단을 이 자리에 없는 사람에게 미룰 수는 없다.\n\n당 밖에서는 아직도 언제 답을 줄 것이냐고 재촉한다. 당신은 사람들의 다툼을 멈추게 하고, 먼저 당신 자신의 결정을 듣게 했다."
 hd_chibi_jingzhou_surrender:0 "주 전체를 들어 귀부하여 사민을 보전한다."
 hd_chibi_jingzhou_resist:0 "험지에 의지해 굳게 지키며 결코 조조에게 항복하지 않는다."
 hd_historical_world.0290.t:0 "적벽: 북군 퇴각"
 hd_historical_world.0290.desc:0 "북군이 물러났다. 강 위에서 보내온 전황 보고가 거듭 이를 확인했고, 각처의 수비군도 같은 소식을 보내오자 장막 안의 사람들은 그제야 진정으로 한숨을 돌렸다.\n\n당신은 아직 잔잔해지지 않은 강물을 바라보며 사상자와 추격에 관한 보고를 들었다. 조군을 막아 냈다고 해서 앞으로 강 방어를 늦추어도 된다는 뜻은 아니다. 건너편에는 아직 다시 일어설 힘이 있고, 아군에게도 수습할 장병과 수리할 배가 있다.\n\n누군가 벌써 이 싸움을 어떻게 널리 알릴지 이야기하기에, 당신은 그를 먼저 물러가게 했다. 살아남은 이들부터 안돈하고, 지켜 낸 곳부터 안정시켜야 한다. 강동은 눈앞의 이 고비를 넘겼지만, 앞으로의 길은 계속 걸어가야 한다."
 hd_historical_world.0291.t:0 "적벽: 강 방어선 붕괴"
 hd_historical_world.0291.desc:0 "강 방어선이 무너졌다. 선봉에서 승전을 알리러 온 이가 말을 마치자, 장막 안에서 한동안 아무도 말을 받지 못했다. 당신은 사람들을 둘러보다가 마침내 소리 내어 웃었다. “방금까지 천천히 하라고 권하더니, 이제는 다들 할 말이 없는가?”\n\n사람들은 그제야 일제히 축하했다. 당신은 그들에게 먼저 배와 병량을 분명히 헤아리게 했다. 이겨 놓고도 공만 다투면 뒤에서 똑같이 혼란이 생긴다. 그래도 지도 위에서만 가로막혀 있던 물길이, 오늘은 마침내 손을 뻗어도 닿지 않는 곳이 아니게 되었다.\n\n강동이 앞으로 어떻게 나올지는 누군가 알려 올 것이다. 당신은 남방의 지도를 더 넓게 펼치고, 장막 밖에서 갈수록 높아지는 승전의 함성을 들었다. 먼저 눈앞에서 얻은 것을 단단히 쥐면, 나머지 길은 굳이 늘 그들의 뜻대로 걸을 필요가 없다."


