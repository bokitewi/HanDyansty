 hd_story_phase_runan_ambition:0 "여남에서 세력을 일으킴"
 hd_sun_life_sun_jian:0 "강동의 기틀을 다짐"
 hd_sun_life_sun_ce:0 "소패왕의 도강"
 hd_liu_biao_stable_ai:0 "경내를 지키고 백성을 편안케 함"
 hd_liu_biao_stable_ai_desc:0 "이 인물은 경내를 지키고 백성을 편안케 하는 것을 마음에 두어, 함부로 전쟁을 일으키려 하지 않습니다."
 hd_yuan_shu_assertive_ai:0 "여남의 야망"
 hd_yuan_shu_assertive_ai_desc:0 "이 인물은 야심만만하여 권모술수로 안팎을 다스리기를 좋아하며, 늘 호족을 끌어들이고 이웃 땅을 병합할 생각을 합니다."
 hd_wang_yun_historical_murder_scheme:0 "동탁 주살 모의"
 hd_wang_yun_historical_murder_scheme_desc:0 "이 인물은 여러 해를 참아 오며 치밀하게 계획했고, 도모하던 일이 이제 마침내 정체를 드러낼 때에 이르렀습니다."
 hd_wang_yun_historical_sway_scheme:0 "여포 포섭"
 hd_wang_yun_historical_sway_scheme_desc:0 "이 인물은 여포와 동탁 사이의 틈을 잘 알고 있어, 한마디 한마디가 여포의 마음을 파고듭니다."
