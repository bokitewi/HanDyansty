l_korean:
 HD_HISTORICAL_WAR_NAME:0 "[ATTACKER.GetPrimaryTitle.GetNameNoTierNoTooltip](와)과 [DEFENDER.GetPrimaryTitle.GetNameNoTierNoTooltip]의 전쟁"
 hd_historical_war_victory_desc:0 "[attacker.GetShortUIName|U](이)가 다투던 땅을 차지합니다."
 hd_historical_war_white_peace_desc:0 "양측이 군사를 거두고 경계는 그대로입니다."
 hd_historical_war_defeat_desc:0 "공격 측은 아무 성과 없이 돌아가고 경계는 그대로입니다."
 hd_chain_acknowledge:0 "천하의 대세가 이로써 바뀐다."
 hd_historical_world.0188.t:0 "형주 진무"
 hd_historical_world.0188.desc:0 "형주로 나가 진수하라는 조정의 조서가 도착했다. 문서를 다 읽은 뒤 당신이 가장 먼저 한 일은 전임자가 남긴 속리와 군현에 대해 묻는 것이었다. 조서에 적힌 주의 이름은 고작 두 글자이지만, 당신 손에 넘어오는 일은 하나도 줄지 않는다.\n\n옛 인장, 군적, 부고와 소속된 사람들을 모두 하나하나 인수인계해야 한다. 강한 사이에는 종적이 아울러 일어나 저마다 오벽을 차지하고 있으니, 새 자사가 왔다는 소식을 들었다고 해서 순순히 고개를 숙이고 명을 따르리라는 법은 없다.\n\n당신은 먼저 인수할 수 있는 곳부터 나열하게 하고, 나머지는 다시 조사하기로 했다. 조정의 명을 받은 이상 한 주의 책임을 진정으로 져야 한다. 주부의 책상 앞에 앉고 나서야 지방의 어려움을 몰랐다고 말한다면 이미 늦은 것이다."
 hd_historical_world.0188.a:0 "조서를 받들어 부임하고 형주를 맡는다."

 hd_guandu_xu_you_wuchao_modifier:0 "오소의 둔량"
 hd_guandu_xu_you_wuchao_modifier_desc:0 "대군의 군량과 말먹이가 대부분 오소에 쌓여 있으나 수비는 그리 엄밀하지 않다. 휘하의 모사들도 서로 화목하지 않으니, 원망을 품은 자가 없으리라 장담하기 어렵다."
 hd_guandu_scout_wuchao_modifier:0 "군량 수송로 교란"
 hd_guandu_scout_wuchao_modifier_desc:0 "적군의 척후가 군량 수송로 부근에 자주 출몰하여 수송이 때때로 지체됩니다."
 hd_chibi_risk_disease_modifier:0 "군중의 역병"
 hd_chibi_risk_disease_modifier_desc:0 "북방 병사들이 풍토에 적응하지 못하여 군중에 역병이 차츰 퍼집니다."
 hd_chibi_risk_expedition_modifier:0 "원정의 피로"
 hd_chibi_risk_expedition_modifier_desc:0 "북군이 먼 길을 남하하여 이미 사람과 말이 모두 지쳤습니다."
 hd_chibi_risk_naval_modifier:0 "수전에 익숙하지 않음"
 hd_chibi_risk_naval_modifier_desc:0 "북방의 장병은 대부분 배에 익숙하지 않아 강 위에서 맞붙으면 장기를 펼치기 어렵습니다."
 hd_chibi_risk_jingzhou_loyalty_modifier:0 "형주의 신부"
 hd_chibi_risk_jingzhou_loyalty_modifier_desc:0 "형주군은 새로 귀부하여 인심이 아직 안정되지 않았으니, 새 주인을 위해 목숨을 바치려 하지 않을 수도 있습니다."
 hd_chibi_risk_tied_ships_modifier:0 "연환선"
 hd_chibi_risk_tied_ships_modifier_desc:0 "병사들의 뱃멀미를 막기 위해 배의 머리와 꼬리를 서로 이어, 움직임은 안정되었으나 나아가고 물러나기는 어렵습니다."
 hd_chibi_risk_logistics_modifier:0 "길게 늘어진 보급로"
 hd_chibi_risk_logistics_modifier_desc:0 "군량과 말먹이를 북방에서 천 리 길로 실어 와야 하니 오래 버티기 어렵습니다."
 hd_chibi_risk_huang_gai_modifier:0 "강동의 노장"
 hd_chibi_risk_huang_gai_modifier_desc:0 "황개가 아직 강동군에 있습니다. 이 사람은 오래 전장을 누볐고 수전에 정통하여 늘 뜻밖의 계책을 내놓습니다."

 hd_story_cao_life:0 "조조 본기"
 hd_story_yuan_life:0 "원소 본기"
 hd_story_liu_bei_life:0 "유비 본기"
 hd_story_dong_zhuo_life:0 "동탁 본기"
 hd_story_gongsun_zan_life:0 "공손찬 본기"
 hd_story_sun_jian_life:0 "손씨의 강동 기업"
 hd_story_liu_biao_life:0 "유표 본기"
 hd_story_wang_yun_life:0 "왕윤 본기"
 hd_story_yuan_shu_life:0 "원술 본기"
 HD_CAO_LIFE_STORY_STATUS:0 "현재 장: #V [Story.MakeScope.Var('hd_cao_life_phase').GetFlagName]#!\n조맹덕은 어려서부터 기민하고 권모술수에 능했으며, 협객 노릇을 하며 방탕하게 지내 생업을 돌보지 않았다. 천하가 어지러워지려는 이때, 그의 일거수일투족이 중원의 정세를 뒤흔든다."
 HD_YUAN_LIFE_STORY_STATUS:0 "현재 장: #V [Story.MakeScope.Var('hd_yuan_life_phase').GetFlagName]#!\n원본초는 사세삼공의 가문 출신으로, 몸을 낮추어 선비를 대하니 문생과 옛 관리가 천하에 두루 퍼져 있다. 해내의 호걸 가운데 그의 깃발을 바라보고 일어선 자가 많다."
 HD_DONG_ZHUO_LIFE_STORY_STATUS:0 "현재 장: #V [Story.MakeScope.Var('hd_dong_zhuo_life_phase').GetFlagName]#!\n동중영은 양주의 변경에서 일어난 인물로, 거칠고 사나우나 꾀가 있으며 휘하에는 오랜 전장을 겪은 강호의 정예 기병이 많다."
 HD_GONGSUN_ZAN_LIFE_STORY_STATUS:0 "현재 장: #V [Story.MakeScope.Var('hd_gongsun_zan_life_phase').GetFlagName]#!\n공손백규는 오래도록 유연의 변새를 지키며 백마의종으로 오랑캐를 떨게 했고, 평소 북방에 웅거하려는 뜻을 품고 있었다."
 HD_SUN_JIAN_LIFE_STORY_STATUS:0 "현재 장: #V [Story.MakeScope.Var('hd_sun_life_phase').GetFlagName]#!\n손씨는 오군 부춘에서 일어나 용맹하고 굳세기로 세상에 이름을 떨쳤다. 강동의 기업은 바로 이 일가의 손에서 비롯되었다."
 HD_LIU_BIAO_LIFE_STORY_STATUS:0 "현재 장: #V [Story.MakeScope.Var('hd_liu_biao_life_phase').GetFlagName]#!\n유경승은 명사의 명망으로 형주에 부임하여, 바라는 것은 그저 경내를 지키고 백성을 편안케 하는 것뿐이니 중원의 분쟁에 함부로 휘말리려 하지 않는다."
 HD_WANG_YUN_LIFE_STORY_STATUS:0 "현재 장: #V [Story.MakeScope.Var('hd_wang_yun_life_phase').GetFlagName]#!\n왕자사는 조정에서 강직하기로 이름났으며, 겉으로는 권신과 어울리고 있으나 마음속으로는 하루도 한실을 잊은 적이 없다."
 HD_YUAN_SHU_LIFE_STORY_STATUS:0 "현재 장: #V [Story.MakeScope.Var('hd_yuan_shu_life_phase').GetFlagName]#!\n원공로는 고귀한 가문을 믿고 평소 큰 뜻을 품었다. 여남은 원씨의 고향이자 그가 늘 마음에 두고 있는 근본의 땅이다."
