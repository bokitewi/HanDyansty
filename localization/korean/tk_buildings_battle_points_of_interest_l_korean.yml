l_korean:

 #####三国新增建筑战场本地化

 BattlePoIHistoricalNameZhuoLu: "탁록 전투"
 BattlePoIHistoricalDescZhuoLu: "#emp 승자: 황제\n패자: 치우\n시기: 황제의 시대#!\n#weak 치우가 난을 일으켜 황제의 명을 따르지 않자, 황제는 제후들의 군사를 징발하여 탁록의 들판에서 치우와 싸워 마침내 치우를 사로잡아 죽였다.\n\n제후들은 이로써 함께 황제를 천자로 받들었고, 황제는 신농씨를 대신하여 천하를 차지했다.#!"
 BattlePoIHistoricalNameMingTiao: "명조 전투"
 BattlePoIHistoricalDescMingTiao: "#emp 승자: 상나라 탕왕\n패자: 하나라 걸왕\n시기: 하나라 걸왕 말기#!\n#weak 하나라 걸왕이 황음무도하여 백성들이 원망하고 등을 돌렸다. 상나라 탕왕은 이윤의 보필을 받아 덕을 닦고 인을 행하니, 제후들이 잇달아 귀부했다. 탕왕이 군사를 일으켜 걸왕을 치니, 두 군대가 명조의 들판에서 싸워 하나라 군대가 크게 패했다.\n\n걸왕은 남소로 달아났고, 탕왕은 마침내 하나라를 대신해 천하를 차지했다.#!"
 BattlePoIHistoricalNameChangShao: "장작 전투"
 BattlePoIHistoricalDescChangShao: "#emp 승자: 노 장공\n패자: 제 환공\n시기: 노 장공 10년#!\n#weak 제 환공이 즉위한 초기, 노나라가 일찍이 공자 규의 왕위 다툼을 도왔던 까닭에 이듬해 곧바로 군사를 일으켜 노나라를 쳤다. 노나라 사람 조귀가 장공을 뵙기를 청하고 군대를 따라 장작에 이르러, 제나라 군대가 북을 세 번 울리기를 기다린 뒤에야 진격하니 제군이 크게 패했다.\n\n조귀는 말했다. “싸움은 용기로 하는 것이다. 첫 북에 기세를 일으키고, 두 번째에 쇠하고, 세 번째에 다한다.” 이 싸움은 약한 쪽이 강한 쪽을 이긴 것으로, 예로부터 병가들의 칭송을 받았다.#!"
 BattlePoIHistoricalNameChangPing: "장평 전투"
 BattlePoIHistoricalDescChangPing: "#emp 승자: 진 소왕\n패자: 조 효성왕\n시기: 진 소왕 47년#!\n#weak 진나라가 한나라의 상당을 공격하자, 상당 태수 풍정이 군을 들어 조나라에 항복했고, 진과 조 양군은 이로써 장평에서 대치하게 되었다. 조나라 장수 염파는 성벽을 굳게 지키며 나가지 않았으나, 조왕은 진나라의 이간계에 넘어가 조괄로 그를 대신하게 했다. 조괄이 경솔하게 나가 싸우다가 백기에게 군량 길을 끊기고 겹겹이 포위되었다.\n\n조나라 병사들은 46일 동안 굶주린 끝에 진에 항복했고, 40여만 명이 모두 생매장당했으니, 조나라는 이로부터 다시 일어서지 못했다.#!"
 BattlePoIHistoricalNameGaiXia: "해하 전투"
 BattlePoIHistoricalDescGaiXia: "#emp 승자: 한왕\n패자: 항우\n시기: 한 5년#!\n#weak 초와 한이 홍구를 경계로 삼기로 약조하자, 항우는 군사를 이끌고 동쪽으로 돌아갔다. 장량과 진평이 초군이 지친 틈을 타 추격하라고 한왕에게 권하니, 한왕은 한신, 팽월 등의 군대와 합류하여 항우를 해하에서 겹겹이 포위했다.\n\n항우는 싸움에 패하여 오강에서 스스로 목을 찔렀고, 천하는 이로써 한나라에 돌아갔다.#!"
 BattlePoIHistoricalNameKunYang: "곤양 전투"
 BattlePoIHistoricalDescKunYang: "#emp 승자: 한군\n패자: 왕망군\n시기: 경시 원년#!\n#weak 왕망이 대사공 왕읍과 사도 왕심을 보내 대군으로 곤양을 포위 공격하자, 성안의 장수들은 겁에 질려 흩어지려 했다. 당시 편장군이던 광무황제는 장수들에게 굳게 지키라고 힘써 권하고, 자신은 포위를 뚫고 성을 나가 원군을 모았다.\n\n원군이 도착하자 광무황제는 몸소 결사대를 이끌고 적진을 들이쳤고, 성안의 수비군도 함성을 지르며 뛰쳐나와 안팎에서 협공하니, 왕심이 전사하고 왕망군은 크게 무너졌다. 천하가 이로써 잇달아 호응했고, 왕망은 머지않아 멸망했다.#!"


