l_korean:
 building_type_TK_HD_TaiXue: "국립 대학"
 building_type_TK_HD_TaiXue_desc: "천자가 세운 학궁으로, 박사가 경술로 제생을 가르치며, 천하의 사인은 모두 태학에 들어가 수업하는 것을 영예로 여긴다."
 TK_HD_TaiXue: "태학"
 building_TK_HD_TaiXue: "$TK_HD_TaiXue$"
 building_TK_HD_TaiXue_desc: "천자가 경사에 세운 학궁. 효무황제 때 처음으로 오경박사를 두어 제자를 가르치게 하고, 경전에 통달한 자는 낭리로 보임되었다. 이후 학사가 여러 차례 증축되어, 책 상자를 지고 사방에서 찾아온 제생이 이곳에 구름처럼 모였다. 태학생들이 경의를 강론하고 인물을 품평하니, 청의의 기풍이 이로부터 성해졌다."
 hd_taixue_student_modifier: "태학 수업"
 hd_taixue_student_modifier_desc: "이 인물의 어른이 태학을 주관하여, 박사와 제생을 따라 함께 수업할 수 있습니다."
 hd_build_taixue_luoyang_decision: "태학 설립(낙양)"
 hd_build_taixue_luoyang_decision_desc: "천하의 다스림은 교화에 근본을 둔다. 낙양은 천자가 계신 곳이자 사방의 선비들이 우러러보는 땅이니, 나는 성 동쪽에 땅을 골라 학사를 널리 세우고 경사를 초빙하며 박사 제자를 두어, 책 상자를 지고 찾아오는 선비들이 의지할 곳을 얻게 하려 한다."
 hd_build_taixue_luoyang_decision_tooltip: "낙양 동쪽에 태학을 세우고 경사를 초빙하여 제생을 널리 받아들인다."
 hd_build_taixue_changan_decision: "태학 설립(장안)"
 hd_build_taixue_changan_decision_desc: "장안은 고제가 도읍을 정한 땅이고, 효무황제도 이곳에 처음 태학을 세웠으나, 아쉽게도 옛날의 글 읽는 소리는 이미 들리지 않은 지 오래다. 나는 이곳에 학사를 다시 세우고 경사를 초빙하여, 관중의 자제들도 가까이에서 수업할 수 있게 하려 한다."
 hd_build_taixue_changan_decision_tooltip: "장안에 태학을 재건하고 경사를 초빙하여 제생을 널리 받아들인다."
 hd_build_taixue_decision_confirm: "학교를 세워 인재를 기르라!"
