l_korean:
 hd_dc_era.0001.t: "조령이 닿지 않는 땅"
 hd_dc_era.0001.desc: "책상 위의 지도는 오래도록 바뀌지 않았건만, 각지에서 올라오는 문서의 칭호는 조금씩 달라졌다. 어떤 곳은 여전히 조정의 정삭을 받들고, 어떤 곳은 자기 경내의 군량만을 이야기하며, 또 몇 곳은 끝내 회신조차 없다.\n\n이 경계선들은 오늘 처음 생긴 것이 아니다. 해를 거듭한 이산이 마침내 누구도 피할 수 없는 국면이 되었을 뿐이다. 새로운 맹약과 정벌, 건국의 논의가 이미 달라진 이 관계들 속에서 자라날 것이며, 당신 또한 그 안에서 제 갈 곳을 찾아야 한다."
 hd_dc_era.0001.a: "우선 천하의 변화를 지켜본 뒤 거취를 정하리라."
 hd_dc_era_rules_tt: "다음의 경우 천하는 즉시 군웅축록에 빠집니다([tributaries|E]의 영지와 전시 점령지는 [son_of_heaven|E]의 장악으로 치지 않음):\n$BULLET$국세 긴장 시기에 [son_of_heaven|E](이)가 장악한 천하 법리상 [counties|E](이)가 2할 미만일 때\n$BULLET$천하 붕괴 시기에 중화의 [hegemony|E]에 주인이 없거나, [son_of_heaven|E](이)가 장악한 천하 법리상 [counties|E](이)가 4할 미만일 때\n난세는 오직 '난세 종결' [decision|E](으)로만 수습할 수 있습니다. 천하 법리상 [counties|E]의 8할을 장악해야 하며, [tributaries|E]의 치하도 이에 포함됩니다."
 hd_dc_era_no_sovereignty_change_tt: "옛 명분은 남아 있으나 제후들은 이미 저마다 거취를 따로 품었습니다. 천자의 직속 [vassals|E](은)는 각자 땅을 차지하고 자립하며, 천자에게는 직할지만 남습니다. 난세에는 [vassals|E](이)가 주군에게 '독립 요구'를 할 수 있으며, 주군이 허락하면 평화롭게 분립하고, 허락하지 않으면 그래도 자립하되 주군은 '토역'의 군사를 일으킬 수 있습니다."
 hd_dc_mandate_observation_tt: "천명이 다시 당신에게 돌아왔으나, 이번 난세의 봉상은 이미 받았으므로 다시 내리지 않습니다."
 hd_dc_mandate_once_per_era_tt: "당신은 이번 난세에서 아직 천명의 상을 받지 않았거나, 중화의 [hegemony|E](을)를 보유하고 있지 않습니다"
