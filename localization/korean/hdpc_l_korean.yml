l_korean:
 hdpc.9000.t:0 "인물 수 조절: 통계 보고서"
 hdpc.9000.desc:0 "#bold 이번 조사#!\n전체 생존자: [GetGlobalVariable('hdpc_living').GetValue|0]\n그중 인물 풀 인원: [GetGlobalVariable('hdpc_pooled').GetValue|0]\n통치자 수: [GetGlobalVariable('hdpc_rulers').GetValue|0]\n\n#bold 최근 연간 정리#!\n완료한 횟수: [GetGlobalVariable('hdpc_cycles').GetValue|0]\n연간 사망 상한: [GetGlobalVariable('hdpc_death_budget').GetValue|0]\n실제 제거: [GetGlobalVariable('hdpc_killed_last').GetValue|0]\n그중 떠돌이 인물: [GetGlobalVariable('hdpc_pool_killed_last').GetValue|0]\n그중 유목·부족의 유휴 조신: [GetGlobalVariable('hdpc_court_killed_last').GetValue|0]\n사망 처리 실패: [GetGlobalVariable('hdpc_failed_last').GetValue|0]\n검사한 궁정: [GetGlobalVariable('hdpc_courts_last').GetValue|0]\n선정된 후보: [GetGlobalVariable('hdpc_candidates_last').GetValue|0]\n\n정리 상태: [GetGlobalVariable('hdpc_active').GetValue|0](0 정지, 1 활성)\n일시 정지 플래그: [GetGlobalVariable('hdpc_disabled').GetValue|0](0 실행, 1 일시 정지)\n\n생존자 수가 10,000명을 넘으면 연간 정리를 활성화하고, 8,000명으로 줄면 정지합니다. 11,000명을 넘으면 연간 상한이 300에서 600으로 늘어납니다. 먼저 인물 풀의 유휴 저출신 인물을 처리하고, 그다음 유목·부족 궁정의 유휴 저출신 조신을 처리합니다. 30–49세 떠돌이 인물은 매년 추가 사망 확률이 10%, 50세 이상은 25%이며, 두 유형의 궁정에서는 각각 15%와 30%입니다. 확률은 연간 인원 상한, 인구 정지선 및 궁정 보존 인원의 제한을 받습니다. 역사 인물, 플레이어와 그 근친, 통치자, 후계자, 직책을 맡은 인물 등은 보호됩니다. 이 보고서는 조사만 갱신하며 정리는 실행하지 않습니다."
 hdpc.9000.a:0 "닫기"
