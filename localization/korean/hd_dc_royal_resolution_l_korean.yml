l_korean:
 hd_dc_roy_end.0001.t: "제위 다툼의 막이 내리다"
 hd_dc_enthronement_support_opinion: "새 군주를 옹립한 적이 있음"
 hd_dc_faithful_royal_opinion: "약조를 변함없이 지킴"
 hd_dc_roy_end.0001.enthroned: "등극하던 날, 당신은 낯익은 종친들이 어좌 양옆에 서 있는 것을 보았다. 어떤 이는 당신을 위해 동분서주했고, 어떤 이는 전쟁이 멎고서야 눈앞의 결과를 인정했다.\n\n이번에 천명을 바꾼 것은 전장의 승패에 의한 것이었고, 제위 다툼의 전쟁도 이미 가라앉았다. 그러나 천하를 당신의 손에 넘겨준 사람들은 모두 처음에 했던 말을 기억하고 있다. 오늘 보위에 오를 수는 있어도, 지난날의 약속을 이로써 이미 지킨 것으로 여길 수는 없다."
 hd_dc_roy_end.0001.defended: "마지막 전황 보고가 책상 앞에 도착했다. 종친이 일으킨 제위 다툼의 전쟁은 이미 패배로 끝났고, 당신은 여전히 원래의 자리에 앉아 있다.\n\n어좌는 지켰지만, 종묘에 생긴 균열은 저절로 메워지지 않는다. 군중과 집안과 조서에 남은 일들을 하나하나 처리해야 한다. 역도에 가담하지 않은 종친들까지 단지 성이 같다는 이유로 봉지를 빼앗겨서도 안 된다."
 hd_dc_roy_end.0001.a: "승패는 이미 정해졌으니, 옛 약속은 나중에 정리하겠다."
 hd_dc_roy_end.0002.t: "궁성에서 전해 온 소식"
 hd_dc_roy_end.0002.enthroned: "궁성에서 새 군주가 보위에 올랐다는 소식이 전해졌다. 이번 제위 다툼과 얽힌 전쟁은 이미 끝났고, 어좌의 주인이 바뀌었다.\n\n당신에게 이것은 가볍게 끝날 일이 아니다. 예전에 했던 말, 섰던 편, 그리고 아직 지키지 못한 약속은 새로 반포된 조령과 함께 한꺼번에 지워지지 않는다."
 hd_dc_roy_end.0002.defended: "조정은 어좌를 지켰고, 제위 다툼의 전쟁은 이미 끝났다. 그러나 종묘 안의 자리 차례와 친소는 한 장의 전황 보고로 정해질 수 있는 것이 아니다.\n\n당신이 한 일은 당신이 감당해야 한다. 같은 성을 가진 사람이라 해서 모두가 같은 선택을 한 것도 아니다."
 hd_dc_roy_end.0002.a: "앞으로의 행보를 지켜보자."
