l_korean:
 quix_murder_outcome.1201.a:0 "헤엄칠 줄 아는 자는 세상에 드문 법이지."
 quix_murder_outcome.1201.b:0 "이 계책은 너무 지나치오."
 quix_murder_outcome.1201.desc:0 "당신의 심복 [acting_agent.GetTitledFirstName](이)가 어린 [target.GetTitledFirstName](이)가 호숫가 별장에 묵는다는 것을 알아냈습니다. 지켜보는 이가 없는 틈을 타 [acting_agent.GetSheHe](이)가 아이를 물속으로 꾀어내면, 이 일은 그저 발을 헛디뎌 익사한 사고로 보일 것입니다."
 quix_murder_outcome.1201.no_acting_agent:0 "당신의 공모자가 어린 [target.GetTitledFirstName](이)가 호숫가 별장에 묵는다는 것을 알아냈습니다. 아무도 눈여겨보지 않는 때를 기다려 아이를 물속으로 꾀어내면, 이 사건은 그저 발을 헛디뎌 익사한 사고로 보일 것입니다."
 quix_murder_outcome.1201.t:0 "호숫가 물놀이"
 quix_murder_outcome.1202.a:0 "오디세우스가 기뻐한다면 나 또한 기쁘겠소."
 quix_murder_outcome.1202.b:0 "이건 본뜻이 아니오."
 quix_murder_outcome.1202.desc:0 "당신의 심복 [acting_agent.GetTitledFirstName](이)가 정교한 목마 한 필을 마련해 몰래 [target.GetTitledFirstName]에게 보내려 합니다. 목마 배 속에는 독거미가 숨겨져 있어, 아이가 가지고 놀 때 장치가 작동하면 사인은 그저 불운한 벌레 물림으로 보일 것입니다."
 quix_murder_outcome.1202.no_acting_agent:0 "당신의 공모자가 정교한 트로이 목마 한 필을 몰래 [target.GetTitledFirstName]에게 보내려 합니다. 목마 배 속에는 독거미가 숨겨져 있어, 아이가 가지고 놀 때 장치가 작동하면 사인은 그저 불운한 벌레 물림으로 보일 것입니다."
 quix_murder_outcome.1202.t:0 "트로이 목마"
 quix_murder_outcome.1203.a:0 "이 일에는 계책이 필요하오."
 quix_murder_outcome.1203.b:0 "이 계책은 내 마음에 들지 않소."
 quix_murder_outcome.1203.desc:0 "당신의 심복 [acting_agent.GetTitledFirstName](이)가 [target.GetTitledFirstName]의 필적을 손에 넣어, 집을 떠난다는 편지를 그 손글씨로 꾸며 쓸 수 있게 되었습니다. 이 철없는 아이를 속여 데려가기만 하면, 사람들은 [target.GetSheHe](이)가 스스로 집을 나갔다고만 여길 것입니다."
 quix_murder_outcome.1203.no_acting_agent:0 "당신의 공모자가 [target.GetTitledFirstName]의 필적을 손에 넣어, 집을 떠난다는 편지를 그 손글씨로 꾸며 쓸 수 있게 되었습니다. 이 철없는 아이를 속여 데려가기만 하면, 사람들은 [target.GetSheHe](이)가 스스로 집을 나갔다고만 여길 것입니다."
 quix_murder_outcome.1203.t:0 "가출 편지 위조"
 quix_murder_outcome.1204.a:0 "어린아이에게는 여기가 제격이오."
 quix_murder_outcome.1204.b:0 "이 계책은 너무 얕소."
 quix_murder_outcome.1204.desc:0 "당신의 심복 [acting_agent.GetTitledFirstName](이)가 [target.GetTitledFirstName]의 경비병 한 명을 매수하고, 일이 끝나면 도망치도록 돕겠다고 약속했습니다. 경비병은 아무도 보지 않는 틈에 아기를 해자에 던지기만 하면 됩니다."
 quix_murder_outcome.1204.no_acting_agent:0 "당신의 공모자가 [target.GetTitledFirstName]의 유모 한 명을 매수하고, 일이 끝나면 도망치도록 돕겠다고 약속했습니다. 유모는 아무도 눈여겨보지 않는 틈에 아기를 해자에 던지기만 하면 됩니다."
 quix_murder_outcome.1204.t:0 "목욕물과 함께 아기까지"
 quix_murder_outcome.1205.a:0 "정이란 것은 세상에서 가장 위험한 것이로다."
 quix_murder_outcome.1205.b:0 "그렇지 않소."
 quix_murder_outcome.1205.desc:0 "당신의 심복 [acting_agent.GetTitledFirstName](이)가 어린 [target.GetFirstNameNoTooltip]에게 이미 마음에 둔 사람이 있다는 것을 알아냈으니, 그 연인으로 가장하여 한밤중에 몰래 만나자고 꾀어낼 수 있습니다. [target.GetHerHim](을)를 기다리는 것은 마음에 둔 사람이 아니라 당신의 사람일 것입니다."
 quix_murder_outcome.1205.no_acting_agent:0 "당신의 공모자가 어린 [target.GetFirstNameNoTooltip]에게 이미 마음에 둔 사람이 있다는 것을 알아냈으니, 당신은 그 연인으로 가장하여 한밤중에 몰래 만나자고 꾀어낼 수 있습니다. [target.GetHerHim](을)를 기다리는 것은 마음에 둔 사람이 아니라 당신의 사람일 것입니다."
 quix_murder_outcome.1205.t:0 "한밤중의 약속"
 quix_murder_outcome.1206.a:0 "이 일을 기억해 두시오."
 quix_murder_outcome.1206.b:0 "다시 한번 생각해 보겠소."
 quix_murder_outcome.1206.desc:0 "당신의 심복 [acting_agent.GetTitledFirstName](이)가 밤에 아이 방에 들어가 몰래 [target.GetTitledFirstName](을)를 데려가려 합니다. 이 아이를 궁성에서 멀리 떨어진 곳으로 보내기만 하면, 그 뒤로는 아무도 찾아내지 못할 것입니다."
 quix_murder_outcome.1206.no_acting_agent:0 "당신의 공모자가 밤에 아이 방에 들어가 몰래 [target.GetTitledFirstName](을)를 데려가려 합니다. 이 아이를 궁성에서 멀리 떨어진 곳으로 보내기만 하면, 그 뒤로는 아무도 찾아내지 못할 것입니다."
 quix_murder_outcome.1206.t:0 "한밤의 아이 납치"
 quix_murder_outcome.1301.a:0 "입 하나 덜 먹이는 것이니 [prison_owner.GetFirstNameNoTooltip]도 개의치 않을 것이오."
 quix_murder_outcome.1301.b:0 "아직 때가 아니니 잠시 미루겠소."
 quix_murder_outcome.1301.desc:0 "[target.GetTitledFirstName](은)는 [prison_owner.GetTitledFirstNamePossessive] 지하 감옥에 갇혀 있고, 당신은 이미 밥을 나르는 자를 매수해 두었습니다. 매일 조금씩 독을 섞어 서서히 늘려 가면, [target.GetHerHis] 죽음은 옥중에서 걸린 중병으로 오인될 것입니다."
 quix_murder_outcome.1301.t:0 "지하 감옥의 독기"
 quix_murder_outcome.1302.a:0 "좋소. 다만 산적을 쓰되, 그 고용주가 누구인지는 알리지 마시오."
 quix_murder_outcome.1302.b:0 "이 계책은 너무 위험하니 행할 수 없소."
 quix_murder_outcome.1302.desc:0 "[target.GetTitledFirstName](은)는 연금 상태로 늘 곁에 경비병이 지키고 있습니다. 당신의 사람들이 [target.GetHerHim](을)를 구출하러 온 척하다가 혼란을 틈타 치명적인 함정을 놓을 수 있습니다. 이것이 [target.GetHerHim]에게 접근할 수 있는 몇 안 되는 방법입니다."
 quix_murder_outcome.1302.t:0 "거짓 구출"
 quix_murder_outcome.1303.a:0 "몇 명을 잃어야 하오?"
 quix_murder_outcome.1303.b:0 "이 계책이 어찌 좋은 방책이겠소?"
 quix_murder_outcome.1303.desc:0 "외부인이 [prison_owner.GetTitledFirstNamePossessive] 지하 감옥에 잠입하기는 어렵지만, 소식은 벽 밑의 틈으로 전할 수 있습니다. 당신이 어느 죄수의 가족을 돌봐 주겠다고 약속하자, 그 대가로 그는 같은 감방에 갇힌 [target.GetTitledFirstName](을)를 없애 주겠다고 했습니다."
 quix_murder_outcome.1303.t:0 "옥중 거래"
 quix_murder_outcome.1304.a:0 "내 마음이 불타는 듯하오!"
 quix_murder_outcome.1304.b:0 "이 계책은 아무래도 좋은 방책이 아닌 듯하오."
 quix_murder_outcome.1304.desc:0 "[target.GetTitledFirstName](은)는 연금 상태로 경비가 삼엄합니다. 당신의 사람들이 기름을 준비해 뒷문에 불을 질러 [target.GetHerHim](을)를 정문으로 도망치게 몰고, 지붕에 매복한 궁수가 기회를 노려 쏠 것입니다."
 quix_murder_outcome.1304.t:0 "집을 불태우는 계책"
 quix_murder_outcome.2201.a:0 "골칫거리 하나가 줄었군."
 quix_murder_outcome.2201.a.discovered:0 "헤엄치는 법이 얼마나 중요한지 알 만하구나!"
 quix_murder_outcome.2201.opening:0 "[target.GetTitledFirstName](이)가 물에 빠져 죽었습니다!\n\n[target.GetHerHis|U] 물속에서의 마지막 몸부림은 끝내 잠잠해졌고, 시신은 호수 바닥에 가라앉아 다음 날에야 발견되었습니다."
 quix_murder_outcome.2201.scheme_owner_known:0 "\n\n그러나 누군가 그 모든 과정을 지켜본 듯합니다! 당신의 자객은 붙잡혔고, 이 음모는 이제 모두에게 알려졌으니 당신도 빠져나가기 어렵게 되었습니다."
 quix_murder_outcome.2201.scheme_unknown:0 "\n\n모든 정황이 참혹한 사고를 가리키고 있습니다. 적어도 아무도 당신을 의심하지 않았습니다."
 quix_murder_outcome.2201.t:0 "물놀이의 실수"
 quix_murder_outcome.2202.a:0 "이 방법은 결코 낡지 않는구나."
 quix_murder_outcome.2202.a.discovered:0 "나조차 이 거미는 다룰 수 없소!"
 quix_murder_outcome.2202.opening:0 "[target.GetTitledFirstName](이)가 숨을 거두었습니다!\n\n그리스 꼬마 거미라 불리는 당신의 독물이 숨은 곳에서 기어 나와, 그 독으로 [target.GetHerHis] 작은 심장을 멎게 했습니다."
 quix_murder_outcome.2202.scheme_owner_known:0 "\n\n안타깝게도 이 계책은 당신이 생각한 만큼 빈틈없지 않았습니다. 독물을 숨긴 목마가 발견되자 이를 운반한 자객이 붙잡혔습니다! 이제 모두가 이 일에 당신이 연루되었음을 압니다."
 quix_murder_outcome.2202.scheme_unknown:0 "\n\n아이의 죽음 뒤에 숨은 음흉한 의도를 눈치챈 사람은 아무도 없는 듯합니다."
 quix_murder_outcome.2202.t:0 "목마를 믿지 마라"
 quix_murder_outcome.2203.a:0 "세상이 참으로 험하구나."
 quix_murder_outcome.2203.a.discovered:0 "아마 아이는 머지않아 집으로 돌아오겠지!"
 quix_murder_outcome.2203.opening:0 "어리석은 [target.GetTitledFirstName](이)가 살해되었습니다!\n\n[target.GetTitledFirstName](은)는 홀로 걷다가 매복에 당했습니다. 자객은 시신을 먼 곳으로 옮겨 은밀한 곳에 묻었습니다. 그리고 아이의 필적을 흉내 내어 모두를 원망하며 홀로 있고 싶다는 편지를 남겼습니다."
 quix_murder_outcome.2203.scheme_owner_known:0 "\n\n그러나 나쁜 소식은, 이 편지가 당신의 멍청한 자객 자신의 인장으로 봉해져 있었다는 것입니다! 이 서툰 계책은 들통났고, 당신의 연루는 모두가 알게 되었습니다."
 quix_murder_outcome.2203.scheme_unknown:0 "이 나이 또래의 아이들은 대개 집을 뛰쳐나가곤 하니, 누가 의심하겠습니까!\n\n"
 quix_murder_outcome.2203.t:0 "떠나서 돌아오지 않다"
 quix_murder_outcome.2204.a:0 "내가 보기에 이는 어진 행위요."
 quix_murder_outcome.2204.a.discovered:0 "터무니없다! 그 여자가 스스로 실수해 놓고 이제 와서 떠넘기려 하는구나!"
 quix_murder_outcome.2204.opening:0 "어린 [target.GetTitledFirstName](은)는 더 이상 이 세상에 없습니다!\n\n이 무력한 아이는 창밖으로 내던져져 흐르지 않는 탁한 해자에서 죽었습니다. 참으로 잔혹한 운명입니다."
 quix_murder_outcome.2204.scheme_owner_known:0 "\n\n불행히도 수십 명의 증인이 유모가 아기를 창밖으로 던지는 것을 똑똑히 보았습니다! 유모는 곧 붙잡혔고, 심문을 받자마자 무너졌습니다! 이 일에서 당신이 맡은 역할은 모두 드러났습니다."
 quix_murder_outcome.2204.scheme_unknown:0 "\n\n유모는 이미 빠져나갔고, 이 일은 그저 잔혹한 비극으로 보일 뿐입니다."
 quix_murder_outcome.2204.t:0 "목욕물과 함께 아기까지"
 quix_murder_outcome.2205.a:0 "사랑과 전쟁에는 본래 정해진 이치가 없는 법이오."
 quix_murder_outcome.2205.a.discovered:0 "이건 참으로 곤란하군."
 quix_murder_outcome.2205.opening:0 "당신의 자객이 어린 [target.GetTitledFirstName](을)를 성공적으로 제거했습니다.\n\n[target.GetTitledFirstName](이)가 약속한 장소에 도착한 지 얼마 되지 않아, 한 자객이 어둠 속에서 튀어나와 큰 돌로 내리쳐 죽였습니다."
 quix_murder_outcome.2205.scheme_owner_known:0 "\n\n그러나 아이가 죽기 전에 지른 비명이 경비병들을 놀라게 했고, 자객은 그 자리에서 붙잡혔습니다! 이 참사 속에서 당신의 정체는 이미 드러났습니다."
 quix_murder_outcome.2205.scheme_unknown:0 "\n\n시신을 처리한 뒤, 자객은 밤의 어둠을 틈타 아무도 모르게 조용히 떠났습니다."
 quix_murder_outcome.2205.t:0 "밤의 밀회에서 습격당하다"
 quix_murder_outcome.2206.a:0 "하늘의 도리는 잔혹한 것이로다."
 quix_murder_outcome.2206.a.discovered:0 "나 말이오? 참으로 터무니없소!"
 quix_murder_outcome.2206.opening:0 "어린 [target.GetTitledFirstName](은)는 이제 집에 없습니다.\n\n계획은 아주 순조롭게 진행되었습니다. 아이는 시골의 깊은 산꼭대기로 끌려가 그곳에 버려졌고, 하늘의 뜻에 운명을 맡기게 되었습니다."
 quix_murder_outcome.2206.scheme_owner_known:0 "\n\n불행히도 자객의 범행은 단서를 남겼고, 그 단서는 곧장 당신을 가리켰습니다!"
 quix_murder_outcome.2206.scheme_unknown:0 "사람들의 눈에는 그 아이가 그저 감쪽같이 사라진 것일 뿐입니다.\n\n"
 quix_murder_outcome.2206.t:0 "산꼭대기에 버려진 아이"
 quix_murder_outcome.2301.a:0 "가서 오늘 일을 계속하지."
 quix_murder_outcome.2301.a.discovered:0 "다들 왜 이리 언짢아하는지 나는 정말 모르겠소."
 quix_murder_outcome.2301.heh:0 "솔직히 말하면, 그 고통이 좀 더 오래갔으면 좋았을 텐데."
 quix_murder_outcome.2301.no_awareness_1:0 "\n\n겉으로 보기에는 지하의 독한 기운에 쓰러진 또 한 명의 희생자일 뿐입니다."
 quix_murder_outcome.2301.opening_1:0 "[target.GetTitledFirstName](이)가 [prison_owner.GetTitledFirstName]의 지하 감옥에서 갑자기 쓰러졌습니다. 무서운 급병에 걸린 듯했고, 불과 며칠 만에 [target.GetHerHim]의 목숨은 서서히 꺼져 갔습니다."
 quix_murder_outcome.2301.owner_is_known_1:0 "\n\n그러나 나쁜 소식은, 감옥 간수가 곧바로 뇌물을 받은 혐의를 받아 추궁을 견디지 못하고 무너졌다는 것입니다! 당신의 계략은 [prison_owner.GetTitledFirstName]에게 밝혀져 폭로되었습니다."
 quix_murder_outcome.2301.t:0 "지하 감옥의 독기"
 quix_murder_outcome.2302.a:0 "구출이라! 그렇소, 바로 그것이오!"
 quix_murder_outcome.2302.a.discovered:0 "너희는 폭도를 믿고 나는 믿지 않는단 말이냐?"
 quix_murder_outcome.2302.no_awareness_1:0 "\n\n이 계책은 성공한 듯합니다. 아무도 이것을 암살로 여기지 않고, 오히려 도중에 일이 틀어진 용감한 구출 작전으로 여깁니다! 말할 것도 없이, 당신이 [target.GetHerHim](을)를 구하려 했다는 것을 의심하는 사람은 아무도 없습니다."
 quix_murder_outcome.2302.opening_1:0 "[target.GetTitledFirstName](이)가 살해되었습니다! 이른바 구출하러 온 자들이 저택에 들이닥쳐 경비병을 제압하고 [target.GetFirstNameNoTooltip](을)를 붙잡아 [target.GetHerHim](을)를 말에 태우고 달아나려 했습니다. 빠져나간 뒤에야 자객은 화살로 [target.GetTitledFirstName](을)를 쏘아 쓰러뜨리고, 시신을 길가에 버려 작전에 착오가 생긴 것처럼 꾸몄습니다."
 quix_murder_outcome.2302.owner_is_known_1:0 "\n\n이 계책은 너무나 깔끔했습니다. 안타깝게도 고용된 자가 밤새 이 일을 떠벌리고 다녔습니다! 불행히도 이 비밀은 이제 모두가 아는 사실이 되었습니다."
 quix_murder_outcome.2302.t:0 "거짓 구출"
 quix_murder_outcome.2303.a:0 "이제야 한숨 돌릴 수 있겠군."
 quix_murder_outcome.2303.a.discovered:0 "그런 고발은 전혀 터무니없소!"
 quix_murder_outcome.2303.heh:0 "내 목에서 꼬르륵 소리가 나는 것까지 들리는구나! 귓가에 음악이 울려 퍼지는 듯하다.\n\n"
 quix_murder_outcome.2303.no_awareness_1:0 "\n\n그 죄수는 구덩이 속의 쥐처럼 감옥에 갇혀 있습니다. 이 일이 당신과 조금이라도 관계가 있다고 믿을 사람은 없을 것입니다."
 quix_murder_outcome.2303.opening_1:0 "[target.GetTitledFirstName](이)가 숨을 거두었습니다! 다른 죄수에게 목 졸려 죽었습니다. 이처럼 파렴치한 자가 똑같이 파렴치한 최후를 맞았습니다!"
 quix_murder_outcome.2303.owner_is_known_1:0 "\n\n그러나 좋은 소식만 있는 것은 아닙니다. 일은 성공했지만 대화를 누군가 엿들은 듯하고, 당신의 자객도 붙잡혔습니다! 그들은 당신이야말로 이 모든 일의 배후라고 지목했습니다."
 quix_murder_outcome.2303.t:0 "옥중 거래"
 quix_murder_outcome.2304.a:0 "잘 탔구나, 남김없이 탔구나!"
 quix_murder_outcome.2304.a.discovered:0 "너희가 그 살인자 무리를 믿는단 말이냐?"
 quix_murder_outcome.2304.no_awareness_1:0 "\n\n불길은 곧 걷잡을 수 없게 되었고, 시신은 모두 불타 버렸습니다! 이것이 자객의 소행임을 눈치챈 사람은 아무도 없는 듯합니다……"
 quix_murder_outcome.2304.opening_1:0 "[target.GetTitledFirstName](이)가 한밤중 맹렬한 불길 속에서 빠져나올 때, [target.GetSheHe](은)는 매복한 궁수 한 명에게 사살되었습니다. 화살 몇 대가 급소에 꽂혔고, [target.GetSheHe](은)는 계단 위에 쓰러져 [target.GetHerHis] 옷깃을 피로 물들였습니다."
 quix_murder_outcome.2304.owner_is_known_1:0 "\n\n그러나 일은 계획대로 되지 않았습니다. 궁수는 곧 붙잡혔고, 고문을 받자 자백하여 당신까지 끌어들였습니다!"
 quix_murder_outcome.2304.t:0 "집을 불태우는 계책"
 quix_murder_outcome.4201.a:0 "물속으로 눌러 넣어야 하오!"
 quix_murder_outcome.4201.a.discovered:0 "나는 그저 아이를 물의 재앙에서 지키려 했을 뿐이오!"
 quix_murder_outcome.4201.agent.scheme_owner_known:0 "[acting_agent.GetFirstNameNoTooltip](이)가 죄책감에 짓눌려 당신의 계획을 모조리 털어놓았습니다!"
 quix_murder_outcome.4201.agent.scheme_unknown:0 "그러나 [acting_agent.GetFirstNameNoTooltip](은)는 아마 다시는 헤엄 수업을 가르치지 못할 것입니다. 다행히 이것이 음모임을 알아챈 사람은 없습니다."
 quix_murder_outcome.4201.failure_declaration_1:0 "어린 [target.GetTitledFirstName](이)가 다시 살아났습니다! 이 꼬마는 이제 물고기처럼 헤엄칠 줄 아는 모양입니다!"
 quix_murder_outcome.4201.failure_declaration_2:0 "젠장! 그 성가신 아이 [target.GetTitledFirstName](이)가 우리 계획을 피해 갔습니다! 자객은 성공한 줄 알았지만, 몇 분 뒤 아이는 호수 건너편으로 기어 올라왔습니다."
 quix_murder_outcome.4201.failure_declaration_3:0 "[target.GetTitledFirstName](은)는 분명 물에 빠졌지만, 충분히 깊이 빠지지 않았습니다! 지나가던 사람이 아이를 건져 내어 숨이 끊긴 몸을 되살려 냈고, 계책은 실패로 끝났습니다!"
 quix_murder_outcome.4201.noagent.scheme_owner_known:0 "그러나 당신의 자객이 죄책감에 짓눌려 당신의 계획을 배신했습니다!"
 quix_murder_outcome.4201.noagent.scheme_unknown:0 "그러나 다행히 이번에 실패한 음모는 아직 아무도 모릅니다."
 quix_murder_outcome.4201.t:0 "호숫가 물놀이"
 quix_murder_outcome.4202.a:0 "나는 거미를 좋아하지만, 내 몸 가까이 오지는 마시오."
 quix_murder_outcome.4202.a.discovered:0 "모두 거짓말이오! 이런 어리석은 계책은 내가 결코 허락하지 않소."
 quix_murder_outcome.4202.agent.scheme_owner_known:0 "[acting_agent.GetFirstNameNoTooltip](이)가 죄책감에 짓눌려 당신의 계획을 모조리 털어놓았습니다!"
 quix_murder_outcome.4202.agent.scheme_unknown:0 "다행히 이것이 음모임을 알아챈 사람은 없습니다. 적어도 당신의 음모라는 것은요."
 quix_murder_outcome.4202.failure_declaration_1:0 "[target.GetTitledFirstName](을)를 암살하려던 계책은 실패했습니다! 그 아이는 선물을 하찮게 여겨 치워 버리라고 명령했습니다!"
 quix_murder_outcome.4202.failure_declaration_2:0 "독거미를 가득 실은 목마는 어린 [target.GetTitledFirstName](을)를 죽이지 못한 듯합니다. 장치가 고장 났는지, 독거미가 깨어나 제 할 일을 하지 못했는지는 아무도 모릅니다."
 quix_murder_outcome.4202.failure_declaration_3:0 "[target.GetTitledFirstName](은)는 아직 제거되지 않았는데, 오히려 그 독거미가 청소하는 아낙 한 명을 잘못 죽이고 말았습니다!"
 quix_murder_outcome.4202.noagent.scheme_owner_known:0 "그러나 당신의 자객이 죄책감에 짓눌려 당신의 계획을 배신했습니다!"
 quix_murder_outcome.4202.noagent.scheme_unknown:0 "다행히 이번의 어리석은 짓은 당신의 연루를 드러내지 않았습니다. 그랬다면 꽤나 곤란했을 것입니다."
 quix_murder_outcome.4202.t:0 "트로이 목마"
 quix_murder_outcome.4203.a:0 "다음번에는 깔끔하게 처리해야지."
 quix_murder_outcome.4203.a.discovered:0 "나 말이오? 너희가 이미 그자를 잡았는데, 나와 무슨 상관이오!"
 quix_murder_outcome.4203.agent.scheme_owner_known:0 "[acting_agent.GetFirstNameNoTooltip](이)가 현장에서 붙잡혔고, 주고받은 서신까지 함께 남의 손에 넘어갔습니다!"
 quix_murder_outcome.4203.agent.scheme_unknown:0 "당신의 자객은 복면을 쓰고 있어 이번에는 빠져나갔습니다! 당신의 정체는 아직 드러나지 않았지만, 다음번에도 이런 운이 따르리라는 법은 없습니다."
 quix_murder_outcome.4203.failure_declaration_1:0 "불행히도 당신의 자객은 [target.GetTitledFirstName] 암살에 실패했습니다. 거의 소년이 다 된 이 아이가 힘껏 저항하는 바람에, 자객은 몸싸움 중에 종아리를 크게 다쳤습니다!"
 quix_murder_outcome.4203.failure_declaration_2:0 "실패했습니다. [target.GetTitledFirstName](은)는 여전히 살아 있으며, 여전히 당신의 심복지환입니다. 자객이 떠나자마자 쪽지가 발견되어 수색대가 곧장 출동했고, 아이는 제때 구조되었습니다!"
 quix_murder_outcome.4203.failure_declaration_3:0 "참패입니다! [target.GetTitledFirstName](은)는 죽기는커녕 털끝 하나 다치지 않았습니다! 이 아이는 용케 빠져나와 자객을 피하고 소리쳐 도움을 청해 당신의 큰 계획을 망쳐 버렸습니다!"
 quix_murder_outcome.4203.noagent.scheme_owner_known:0 "당신의 어리석은 자객이 당신의 밀령을 지닌 채 붙잡혔습니다! 이 일은 이제 모두가 알게 되었습니다."
 quix_murder_outcome.4203.noagent.scheme_unknown:0 "당신의 자객은 두건을 쓰고 얼굴 가리개를 한 덕에 정체를 숨긴 채 달아날 수 있었습니다. 이 잔혹한 판에서 그나마 다행이라 할 만합니다."
 quix_murder_outcome.4203.t:0 "줄행랑"
 quix_murder_outcome.4204.a:0 "다시 천천히 궁리해 보세."
 quix_murder_outcome.4204.a.discovered:0 "이는 나를 죄에 빠뜨리려고 정교하게 꾸민 함정이오!"
 quix_murder_outcome.4204.agent.scheme_owner_known:0 "간수가 붙잡혀 [acting_agent.GetFirstNameNoTooltip](을)를 실토했고, 그자는 당신에게 편지를 보내던 중에 체포되었습니다! 당신의 연루는 이미 드러났습니다."
 quix_murder_outcome.4204.agent.scheme_unknown:0 "다행히 [acting_agent.GetFirstNameNoTooltip](이)가 간수가 이미 도망친 것을 제때 보았으니, 당신의 연루는 아직 아무도 모릅니다."
 quix_murder_outcome.4204.failure_declaration_1:0 "어린 [target.GetTitledFirstName](을)를 암살하려던 계책은 실패했습니다! 창밖으로 던져져 해자에 떨어진 아이는 곧 지나가던 사람에게 구조되었습니다!"
 quix_murder_outcome.4204.failure_declaration_2:0 "완전히 망했습니다. [target.GetTitledFirstName](은)는 익사하지 않았고, 그 돌보미는 일을 해내지 못했습니다!"
 quix_murder_outcome.4204.failure_declaration_3:0 "이 계책은 너무 쉬울 줄 내 진작 알았지! [target.GetTitledFirstName](은)는 여전히 살아 있습니다. 계획은 처음에는 성공했지만, 아이가 성의 경비병에게 발견되어 물에서 건져졌고, 결국 되살아났습니다!"
 quix_murder_outcome.4204.noagent.scheme_owner_known:0 "간수가 붙잡혀 당신의 자객을 실토했고, 그 자객은 당신에게 편지를 쓰던 중에 체포되었습니다! 당신의 연루는 이미 드러났습니다."
 quix_murder_outcome.4204.noagent.scheme_unknown:0 "다행히 그 간수는 무사히 빠져나갔고, 이 일에서 당신이 맡은 역할은 여전히 아무도 모릅니다."
 quix_murder_outcome.4204.t:0 "목욕물과 함께 아기까지"
 quix_murder_outcome.4205.a:0 "나 역시 이 계책에 기대를 걸었소."
 quix_murder_outcome.4205.a.discovered:0 "내가 무엇 때문에 [target.GetTitledFirstName](을)를 해치겠소?"
 quix_murder_outcome.4205.agent.scheme_owner_known:0 "[acting_agent.GetFirstNameNoTooltip](와)과 당신의 자객이 모두 붙잡혔고, 이 사건의 전말은 이미 드러났습니다."
 quix_murder_outcome.4205.agent.scheme_unknown:0 "다행히 자객은 들키지 않고 조용히 빠져나갔습니다."
 quix_murder_outcome.4205.failure_declaration_1:0 "당신의 자객이 [target.GetTitledFirstName](을)를 죽이지 못했습니다! 그 아이가 약속한 장소에 갔을 때 이미 달아나 버렸습니다!"
 quix_murder_outcome.4205.failure_declaration_2:0 "[target.GetTitledFirstName] 암살은 실패했습니다. 이 아이가 뜻밖에도 맞서 저항한 모양입니다!"
 quix_murder_outcome.4205.failure_declaration_3:0 "안타깝게도 [target.GetTitledFirstName](은)는 여전히 살아 있습니다! 이 모든 일은 자객들을 위해 놓은 덫이었습니다!"
 quix_murder_outcome.4205.noagent.scheme_owner_known:0 "당신의 자객이 산 채로 붙잡혔고, 그 배신자는 당신을 배후 주모자로 지목했습니다."
 quix_murder_outcome.4205.noagent.scheme_unknown:0 "다행히 자객은 들키지 않고 조용히 빠져나갔습니다."
 quix_murder_outcome.4205.t:0 "남몰래 품은 연모"
 quix_murder_outcome.4206.a:0 "이 계책은 확실히 엉성했지."
 quix_murder_outcome.4206.a.discovered:0 "헛소리! 이건 협박이오!"
 quix_murder_outcome.4206.agent.scheme_owner_known:0 "[acting_agent.GetFirstNameNoTooltip](이)가 행동 중에 가로막혀 체포되었습니다. 심문을 받을 때 [acting_agent.GetSheHe](은)는 당신의 계획 일부를 실토했습니다!"
 quix_murder_outcome.4206.agent.scheme_unknown:0 "자객은 조용히 빠져나갈 수 있었지만, 밤중의 아이 경호가 예상보다 훨씬 삼엄하여 이 계책은 뜻대로 되기 어려울 듯합니다."
 quix_murder_outcome.4206.failure_declaration_1:0 "안타깝게도 [target.GetTitledFirstName](은)는 아직 처리되지 않았습니다!"
 quix_murder_outcome.4206.failure_declaration_2:0 "어린 [target.GetTitledFirstName](은)는 여전히 살아 있습니다!"
 quix_murder_outcome.4206.failure_declaration_3:0 "[target.GetTitledFirstName] 암살은 실패했습니다."
 quix_murder_outcome.4206.noagent.scheme_owner_known:0 "당신의 자객이 행동 중에 붙잡혔습니다. 심문을 받은 뒤, 그 배신자는 당신의 이름을 실토했습니다."
 quix_murder_outcome.4206.noagent.scheme_unknown:0 "자객은 조용히 빠져나갈 수 있었지만, 밤중의 아이 경호가 예상보다 훨씬 삼엄하여 이 계책은 뜻대로 되기 어려울 듯합니다."
 quix_murder_outcome.4206.t:0 "일이 새어 나가다"
 quix_murder_outcome.4301.a:0 "되었소, 되었소."
 quix_murder_outcome.4301.a.discovered:0 "헛소리! 내게 무슨 죄가 있단 말이오?"
 quix_murder_outcome.4301.failure:0 "불행히도 [target.GetTitledFirstName](은)는 여전히 그 안에 단단히 갇혀 있습니다. 당신이 구한 물건은 전혀 효과가 없었던 듯하며, 소문에 따르면 [target.GetTitledFirstName](은)는 오히려 전보다 더 건강해졌다고 합니다."
 quix_murder_outcome.4301.scheme_owner_known:0 "\n\n그러나 이 계책은 헛수고보다도 못했습니다. 간수가 갑자기 부유해진 탓에 뇌물을 받은 혐의를 받았고, 심문 중에 당신의 역할을 모두 실토했습니다! 당신의 마음은 칼로 베이는 듯합니다."
 quix_murder_outcome.4301.scheme_unknown:0 "\n\n다행히 당신의 원래 의도를 아는 사람은 없습니다. 다만 그 간수는 당신과의 관계에 잔뜩 겁을 먹은 듯하여, 앞으로 무슨 일이 있어도 더는 협조하지 않으려 할 것입니다."
 quix_murder_outcome.4301.t:0 "지하 감옥의 독기"
 quix_murder_outcome.4302.a:0 "진작 그곳을 불태워 버렸어야 했는데……"
 quix_murder_outcome.4302.a.discovered:0 "그렇소, 내가 한 일이오! 나는 그저 [target.GetHerHim](을)를 감옥에서 구해 내고 싶었을 뿐이오!"
 quix_murder_outcome.4302.failure:0 "[target.GetTitledFirstName](은)는 여전히 살아 있습니다! 당신이 [target.GetHerHim](을)를 위해 짠 복잡한 배치는 모두 허사가 되었습니다. 경비병들은 죽기로 버텼고 곧 증원을 받았습니다. 기회는 이미 지나갔고, 공격자들은 물러날 수밖에 없었습니다."
 quix_murder_outcome.4302.scheme_owner_known:0 "\n\n그들은 싸우는 도중에 물러나려 했지만, 원군이 점점 몰려와 끝내 포위되어 항복했습니다! 그들은 당신이 고용주라고 실토했습니다!"
 quix_murder_outcome.4302.scheme_unknown:0 "\n\n적어도 병사들을 살려 보낸 것은 한 가닥 어진 마음이었다 하겠습니다. 그들은 싸우면서 [target.GetTitledFirstName](을)를 구하러 왔다고 주장했고, 이것이 상황을 어지럽혀 아무도 당신의 연루를 추론해 내지 못했습니다."
 quix_murder_outcome.4302.t:0 "거짓 구출"
 quix_murder_outcome.4303.a:0 "귀한 것은 아무것도 상하지 않았군."
 quix_murder_outcome.4303.a.discovered:0 "이건 한낱 장난일 뿐이라고 진작 알았소!"
 quix_murder_outcome.4303.failure:0 "죄수 몇 명에게 되는대로 [target.GetTitledFirstName](을)를 찌르게 했으니, 본래부터 허술했던 음모는 역시 아무 결과도 내지 못했습니다."
 quix_murder_outcome.4303.scheme_owner_known:0 "\n\n알고 보니 그 죄수는 애초에 존재하지 않았습니다! 당신의 어리석은 자객들은 경비병과 이야기를 나누다가 지하 감옥이 아닌 병영을 가리키는 말을 했고, 이제 모두 붙잡혔습니다!"
 quix_murder_outcome.4303.scheme_unknown:0 "당신의 자객은 몸싸움 중에 맞아 죽은 듯합니다. 머리가 돌바닥에 부딪혀 박살 났습니다! 그것이 그 자객들의 정체였습니다. 적어도 그들과 함께, 그 동기에 대한 모든 단서도 사라졌습니다……\n\n"
 quix_murder_outcome.4303.t:0 "옥중 거래"
 quix_murder_outcome.4304.a:0 "좀 더 직접적이었어야 했나?"
 quix_murder_outcome.4304.a.discovered:0 "분명 이자는 나를 모함하러 온 것이오!"
 quix_murder_outcome.4304.failure:0 "[target.GetTitledFirstName](을)를 암살하려던 계책은 실패했습니다. 자객들은 혹한에도 아랑곳하지 않고 밀어붙이기로 했지만, 짚수레에 불이 붙지 않았고, 집으로 곧장 돌진하려다 발각되어 결국 헛수고로 끝났습니다."
 quix_murder_outcome.4304.scheme_owner_known:0 "더 나쁜 것은, 이 멍청이들이 몇 걸음 도망치지도 못하고 붙잡혔다는 것입니다! 그들은 당신도 연루되었다고 실토했고, 당신의 역할은 이미 새어 나갔습니다!\n\n"
 quix_murder_outcome.4304.scheme_unknown:0 "\n\n다행히 그들은 수상한 행동을 해명하고 재빨리 빠져나올 수 있었습니다. 적어도 이 일과 당신의 관계는 여전히 알려지지 않았습니다."
 quix_murder_outcome.4304.t:0 "집을 불태우는 계책"
 quix_murder_outcome.5001.generic:0 "한 자객이 갑자기 당신 앞에 나타났습니다. 당신은 한순간 공포를 느낄 겨를밖에 없었고, 이내 적이 뜻을 이루었음을 깨달았습니다. 의식이 점점 멀어질 때, 마지막으로 마음을 스친 것은 죽음 너머의 알 수 없는 저승이었습니다."
 quix_murder_outcome.5002.generic:0 "믿을 만한 자가 막 장막 안으로 들어와 보고하기를, 누군가 당신을 암살하려 했으나 간파되어 저지되었다고 합니다! 그 개 같은 놈들이 당신을 잡으려면 훨씬 더 애써야 할 것입니다!"
