l_korean:
 hd_dc_com.0004.t: "날인하기 전"
 hd_dc_com.0004.desc: "문서가 [hd_dc_proposer.GetTitledFirstName](와)과 [hd_dc_recipient.GetTitledFirstName] 사이를 오가다가 이제 당신의 책상 앞에 이르렀다. 사자는 재촉하지 않고, 아직 날인하지 않은 자리를 당신 쪽으로 돌려놓을 뿐이었다.\n\n[SCOPE.GetFlagName('hd_dc_proposal_terms')]\n\n말이야 빈틈없이 쓸 수 있다. 날인한 뒤에 누가 먼저 약속을 실제로 지키는지, 그것이야말로 모두가 진정 지켜보는 바이다."
 hd_dc_com.0004.a: "이대로 날인한다."
 hd_dc_com.0004.a.tt: "날인한 뒤에는 서로 약조대로 행해야 합니다:"
 hd_dc_com.0004.b: "보증을 한 겹 더해야 응하겠다."
 hd_dc_com.0004.b.tt: "다음 조건으로 답서를 고쳐 보내 상대에게 재논의를 청합니다:\n[SCOPE.GetFlagName('hd_dc_counter_terms')]"
 hd_dc_com.0004.c: "이 약조는 허락할 수 없다."
 hd_dc_signed_terms_opinion: "같은 약조에 서명함"
 hd_dc_counter_terms_opinion: "추가 보증을 요구함"
 hd_dc_rejected_terms_opinion: "제시한 조건을 거절함"
