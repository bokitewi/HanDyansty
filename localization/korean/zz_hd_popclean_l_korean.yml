l_korean:
 hd_popclean_decision:0 "과잉 인구 정리"
 hd_popclean_decision_desc:0 "천하의 궁정과 길거리에 이름 없는 이들이 넘쳐 난다. 왕조도 봉지도 없는 정신과 떠돌이를 한 차례 정리하여 게임의 부담을 줄인다."
 hd_popclean_decision_tooltip:0 "왕조도 봉지도 없는 정신과 떠돌이 7000명을 정리합니다."
 hd_popclean_decision_confirm:0 "정리"
 hd_popclean_decision_effect_tt:0 "앞으로 석 달 안에 왕조도 봉지도 없는 정신과 떠돌이 7000명이 소리 없이 사라집니다. 패권 밖의 백작과 남작 궁정, 그리고 부족, 봉건, 유목, 목축민 궁정을 우선 정리하며, 패권 안의 공작 이상 궁정은 영향을 받지 않습니다. 통치자의 배우자, 첩, 자녀, 공작 이상 궁정의 현직 의원, 관원, 기사, 군관, 역사 인물, 그리고 재능이 뛰어나거나 우수한 선천적 특성을 지닌 이는 모두 보존됩니다."
 hd_popclean_message_title:0 "과잉 인구 정리 예약됨"
 hd_popclean_message_desc:0 "앞으로 석 달 안에 [GetGlobalVariable('hd_popclean_scheduled').GetValue|0]명이 소리 없이 사라집니다."
