l_korean:
 # 2026-10-09 从旧版原版副本 buildings_l_simp_chinese.yml 拆出的 mod 新增建筑键
 building_type_Storehouse_01: "곡식 창고"
 building_type_Storehouse_01_desc: "곡식을 쌓아 두는 창고이다. 창고가 차야 예절을 아는 법이니, 한 고장에 남는 곡식이 있어야 비로소 군사를 기르고 백성을 구제하며, 가뭄과 홍수와 전란에 여유 있게 대처할 수 있다."
 building_Storehouse_01: "지하 움"
 building_Storehouse_01_desc: "그 자리에서 흙을 파 움을 만들고 불로 구덩이 벽을 그슬려 단단하고 마르게 한 뒤, 거적과 겨를 깔고 곡식을 그 안에 저장하면 해가 지나도 상하지 않는다."
 building_Storehouse_02: "지하 창고"
 building_Storehouse_02_desc: "움을 점점 더 깊고 넓게 파니, 입구는 좁고 속은 넓으며 위는 흙과 나무로 덮었다. 움 하나에 저장한 것만으로도 한 고을의 식량을 대기에 충분하다."
 building_Storehouse_03: "저장 분류"
 building_Storehouse_03_desc: "창고 안을 종류별로 나누기 시작한다. 조와 보리는 움에, 콩과 팥은 둥근 곳간에 넣고, 말린 고기와 절인 채소와 소금은 따로 방에 두어, 저마다 창고 관리가 지키며 장부에 기록한다."
 building_Storehouse_04: "지하 창고 군락"
 building_Storehouse_04_desc: "이곳은 식량이 풍족하여 성 밖에 움을 무리 지어 파 놓았으니, 가지런히 늘어선 움들을 창고 관리가 장부에 따라 출납한다."
 building_Storehouse_05: "지상 창고"
 building_Storehouse_05_desc: "지하 움만으로는 부족하게 되자, 높고 마른 곳에 곳간을 세웠다. 흙을 다져 기초를 놓고 나무를 엮어 지붕을 올렸으며, 사방 벽에 창을 내어 바람이 통하게 하니, 창고 안에는 곡식이 산처럼 쌓였다."
 building_Storehouse_06: "자원 저장"
 building_Storehouse_06_desc: "곡식 말고도 소금과 쇠, 베와 비단, 땔감과 숯, 꼴과 짚 등도 거두어 저장해야 하니, 관부가 창고를 더 지어 종류별로 나누어 들여놓고 뜻밖의 일에 대비한다."
 building_Storehouse_07: "거대 창고"
 building_Storehouse_07_desc: "성안이 풍족하여 식량과 온갖 물자가 넘쳐나자, 웅장한 창성을 쌓았다. 담장이 둘러싸고 창고가 줄지어 늘어서 있어, 바라보면 마치 작은 성 하나와 같다."
 building_Storehouse_08: "저장 복합 시설"
 building_Storehouse_08_desc: "창성의 규모가 웅장하여 도성의 태창에 견줄 만하다. 움의 입구를 풀과 진흙으로 겹겹이 봉하니, 저장한 조가 묵은 위에 또 묵어도 수십 년이 지나도록 썩지 않는다."
 building_type_swahili_port_pembas: "$building_swahili_port_pemba$"
