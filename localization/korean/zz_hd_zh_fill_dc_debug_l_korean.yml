l_korean:
 hd_dc_debug.counties:0 "수도 군의 실제 영향 장부를 확인합니다."
 hd_dc_debug.counties.desc:0 "현재 [hd_dc_debug_county.GetName](을)를 확인 중입니다. 이 페이지는 장악력, 개발도, 민심 또는 정책에 영향을 주지 않습니다. 손실 주기 필드가 없으면, 누락된 기록은 이미 차감된 것으로 간주되지 않습니다."
 hd_dc_debug.counties.loss:0 "\n 장악력 기준: [hd_dc_debug_county.Var('hd_dc_control_baseline').GetValue|2]\n 개발도 기준: [hd_dc_debug_county.Var('hd_dc_development_baseline').GetValue|0]\n 처리된 최고 단계: [hd_dc_debug_county.Var('hd_dc_highest_loss_band').GetValue|0]\n 누적 차감 장악력: [hd_dc_debug_county.Var('hd_dc_control_paid').GetValue|2]\n 누적 차감 개발도: [hd_dc_debug_county.Var('hd_dc_development_paid').GetValue|0]"
 hd_dc_debug.counties.policy:0 "\n이 군은 현재 공식 제도 정책의 심사를 받고 있어 다시 점령될 수 없습니다."
 hd_dc_debug.counties.recovery:0 "\n 이번 주기는 현재 낮은 단계 회복 관찰 기간이며, 아직 60개월 연속 요건을 충족하지 못했습니다."
 hd_dc_debug.details:0 "이 영수증의 내용 확인"
 hd_dc_debug.details.desc:0 "아래 목록에는 이 기록에서 이미 발생했거나 등록된 결과만 포함됩니다. 빈 항목이 성공을 뜻하지는 않습니다. 대응하는 결과가 없는 항목은 아직 대기 중이거나 이 기록에 속하지 않을 수 있습니다."
 hd_dc_debug.disaster_scene:0 "실제 지진 또는 홍수 재해 상황 준비"
 hd_dc_debug.disaster_scene.created:0 "공식 진입점이 실제 재해 상황을 반환했으며, 재해 유형별로 다시 읽어 들였습니다. 지도와 재해 화면을 확인하여 실제 대응 조치를 선택하십시오. PAR 준비에는 여전히 재해를 입은 속신 군이 필요하고, 그 군에서 치리를 시행할 수 있어야 하며, 실제 파벌 두 개가 존재해야 합니다. 재해가 이 조건들을 대신할 수는 없습니다."
 hd_dc_debug.disaster_scene.desc:0 "재해를 입은 군이 아래에 명확히 표시됩니다. 선택하면 공식 기본 재해 발생 진입점을 호출하여 실제 재해 상황과 후속 대응 조치를 만듭니다. 재해는 시나리오에서 즉시 발생하며 자연적인 정비 추첨을 기다리지 않습니다. 이 조작은 이미 지난 날짜, 기존 정치 실체, 칙령, 대응 결과 또는 심사 기간을 바꾸지 않습니다. 이 조작은 자연적인 D율 표본 추출이 아닙니다."
 hd_dc_debug.disaster_scene.earthquake:0 "지정한 군에 지진 발생"
 hd_dc_debug.disaster_scene.earthquake_target:0 "\n지진 목표: [hd_dc_debug_earthquake_county.GetName]."
 hd_dc_debug.disaster_scene.flood:0 "지정한 군이 속한 실제 유역에서 실제 홍수를 일으킵니다."
 hd_dc_debug.disaster_scene.flood_target:0 "\n홍수 재해 목표: [hd_dc_debug_flood_county.GetName]."
 hd_dc_debug.disaster_scene.no_earthquake:0 "\n지진에 적합한 군이 없음: 왕조 순환의 군 명단 안에 있어야 하고, 실제로 최소 2단계까지 개발되어 있어야 하며, 중국 본토 지리 범위 안에 있어야 하고, 현재 진행 중인 지진이 없어야 합니다."
 hd_dc_debug.disaster_scene.no_flood:0 "\n홍수 재해에 적합한 군이 없음: 왕조 순환의 군 명단 안에 있어야 하고, 실제로 최소 2단계까지 개발되어 있어야 하며, 전 세계 홍수 지역 안에 있어야 하고, 초기화된 실제 황하 또는 장강 구간이어야 하며, 현재 진행 중인 홍수 재해가 없어야 합니다. 수정치가 붙은 군으로 강을 대신하지 않습니다."
 hd_dc_debug.disaster_scene.unconfirmed:0 "공식 진입점에서 실제 재해 상황을 확인할 수 없으므로, 재해 발생 성공을 보고할 수 없습니다. 목표 지리, 개발 상태, 기존 재해, 초기화 상태 및 로그를 확인하십시오. 이 메뉴는 손실 수정치를 기록하지 않으며, 대응 실패를 위조하지도 않습니다."
 hd_dc_debug.epidemic.active_block:0 "\n#N 현지에서 흑사병이 유행 중이므로 파괴적 역병을 더 만들 수 없습니다.#!"
 hd_dc_debug.epidemic.apocalyptic:0 "파괴적"
 hd_dc_debug.epidemic.bubonic_plague:0 "페스트"
 hd_dc_debug.epidemic.confirm:0 "역병의 실제 발생을 확인합니다."
 hd_dc_debug.epidemic.confirm.desc:0 "재해 유형: [SCOPE.GetFlagName('hd_dc_debug_epidemic_name')]\n 강도: [SCOPE.GetFlagName('hd_dc_debug_epidemic_intensity')]\n\n 이 페이지는 선택한 조합에 따라 실제 지역의 군을 확인했습니다. 아래의 “확인”을 눌러야만 역병이 실제로 발생하며, 퍼져서 인물이 병에 걸리거나 죽을 수 있습니다. 수동 시나리오는 자연 D 확률을 추첨하지 않으며, 기존 역병, DLC, 규칙, 이미 지난 날짜 또는 정치적 의무를 수정하지 않습니다."
 hd_dc_debug.epidemic.consumption:0 "결핵"
 hd_dc_debug.epidemic.create:0 "확인: 지정한 군에 선택한 역병을 만듭니다."
 hd_dc_debug.epidemic.dlc_block:0 "\n#N 이 재해 유형에는 원본 《망자의 전설》 기능 권한이 필요하지만 현재 충족되지 않았습니다. 버튼으로 DLC 잠금을 우회할 수 없습니다.#!"
 hd_dc_debug.epidemic.dysentery:0 "이질"
 hd_dc_debug.epidemic.ergotism:0 "성 안토니우스의 불"
 hd_dc_debug.epidemic.historical_block:0 "\n#N 이 조합은 실제 지도의 제약으로 막혀 있습니다. 현재 불러온 사용자 지정 지도에는 역사적 흑사병 발생지의 분기가 없습니다. 따라서 역사 이벤트 규칙에 따라 파괴적 비저 역병을 준비할 수 없으며, 규칙을 임시로 바꾸거나 1346년의 지리 제한을 우회하지도 않습니다.#!"
 hd_dc_debug.epidemic.intensity:0 "실제 역병 강도 선택"
 hd_dc_debug.epidemic.intensity.desc:0 "선택한 재해: [SCOPE.GetFlagName('hd_dc_debug_epidemic_name')]. 세 가지 선택지는\n\n원본의 경미, 심각, 파괴적에 대응합니다. 파괴적 비저 역병은 흑사병에 속하며, 독자적인 규칙, 실제 발생 상황 및 현재 지도의 지리 제한을 유지합니다. 모든 규칙 조합에서 합법적으로 발생할 수 있는 군을 찾을 수 있는 것은 아닙니다."
 hd_dc_debug.epidemic.major:0 "심각"
 hd_dc_debug.epidemic.measles:0 "홍역"
 hd_dc_debug.epidemic.menu:0 "실제 역병 재해 유형 선택"
 hd_dc_debug.epidemic.menu.desc:0 "재해 유형을 고른 뒤에는 강도도 선택해야 하며, 지정한 군의 실행 페이지에서 확인해야 합니다. 앞의 두 단계는 매개변수만 선택할 뿐 역병을 발생시키지 않습니다. 원본의 일곱 가지 역병은 각각 세 가지 강도의 진입점이 있으며, DLC, 규칙, 흑사병 및 유사 질병은 여전히 실제 상황에 따라 활성화가 막힐 수 있습니다."
 hd_dc_debug.epidemic.minor:0 "경미"
 hd_dc_debug.epidemic.never_block:0 "\n#N 현재 규칙이 흑사병을 금지하므로 페스트에서 비롯된 파괴적 역병을 만들 수 없습니다.#!"
 hd_dc_debug.epidemic.once_block:0 "\n#N 현재 규칙은 흑사병이 한 번만 발생하도록 허용하며 발생 표시가 이미 있으므로, 그 기록을 지우고 다시 만들지 않습니다.#!"
 hd_dc_debug.epidemic.smallpox:0 "천연두"
 hd_dc_debug.epidemic.typhus:0 "발진티푸스"
 hd_dc_debug.faction_scene:0 "실제 파벌 생성과 최후통첩"
 hd_dc_debug.faction_scene.demand:0 "반란 준비: 실제 파벌 불만도 +25"
 hd_dc_debug.faction_scene.demand.tt:0 "파벌의 불만도를 실제로 25 높이고, 변경 전후의 수치를 함께 읽습니다. 군사력을 늘리지 않으며 결성 날짜도 바꾸지 않습니다. 최후통첩 콜백을 직접 호출하지 않으며, 자체적인 “발송됨” 표시도 추가하지 않습니다. 준비를 마친 뒤 이 페이지에서 자격을 다시 확인하고, 원본 파벌 화면의 지도자로 전환하여 정식으로 공격을 시작하십시오."
 hd_dc_debug.faction_scene.demand_target:0 "\n, 실제로 당신에게 최후통첩을 보낼 지도자: [hd_dc_debug_demand_leader.GetShortUIName]."
 hd_dc_debug.faction_scene.desc:0 "“생성” 버튼은 원본의 can_create_faction 함수를 재사용합니다. 인물, 주군, 정체 및 파벌 자격의 모든 조건이 충족되어야만 파벌이 실제로 결성됩니다. NEG-05~07은 원본의 생성 방식을 유지합니다. W≥20일 때, 정체마다 매년 추가로 10% 확률(P로 환산)이 있으며 최대 하나의 파벌을 추가로 생성합니다. 실제 추첨 기록은 연간 검사 페이지에서 볼 수 있습니다. 최종 최후통첩은 여전히 원본의 세력, 불만도, 날짜 요건을 충족해야 합니다."
 hd_dc_debug.faction_scene.independence:0 "현재 주군을 대상으로 독립 파벌을 실제로 생성합니다."
 hd_dc_debug.faction_scene.liberty:0 "현재 주군을 대상으로 자유 파벌을 실제로 생성합니다."
 hd_dc_debug.faction_scene.liege:0 "\n파벌 생성의 실제 대상: [ROOT.Char.GetLiege.GetShortUIName]."
 hd_dc_debug.faction_scene.no_demand:0 "\n현재 준비할 수 있는 요구 파벌이 없음: 반드시 실제로 당신을 대상으로 해야 하고, 지도자/후보/목표 작위가 여전히 존재해야 하며, 진행 중인 전쟁이 없고 ROY-08 중지 상태가 아니어야 합니다. 먼저 ROY-01을 통해 합법적으로 결성하십시오. 이 메뉴는 지도자, 명분 또는 작위를 만들지 않습니다."
 hd_dc_debug.faction_scene.no_peasant:0 "이 지역에는 원본 can_title_create_faction 검사를 통과한 농민 군이 없습니다. 실제 군, 목표 및 기존 조직의 제약 조건을 충족하지 못했습니다. 원본 파벌 화면을 확인하십시오. 직접 선전포고는 파벌 생성을 대신할 수 없습니다."
 hd_dc_debug.faction_scene.no_populist:0 "이 지역에는 원본 can_title_create_faction 검사를 통과한 민중 군이 없습니다. 원본의 정체, 신앙/문화, 구성원 및 기존 조직 제약을 충족해야 하며, 실제 군과 목표가 필요합니다. 종교나 문화를 바꾸거나 기존 봉기를 취소하는 방식으로 조건을 맞출 수는 없습니다."
 hd_dc_debug.faction_scene.not_ready:0 "\n 원본의 현재 반란 검사를 통과하지 못했습니다. 불만도를 실제로 높일 수는 있지만, 세력과 날짜 등의 자격은 여전히 실제로 충족되어야 합니다. 불만도만 높인다고 반란이 성공하는 것은 아닙니다."
 hd_dc_debug.faction_scene.peasant:0 "지정한 적합한 군에서 농민 파벌을 실제로 생성합니다."
 hd_dc_debug.faction_scene.peasant_county:0 "\n적합한 농민 결성 군: [hd_dc_debug_peasant_county.GetName]. 실제로 당신을 대상으로 합니다."
 hd_dc_debug.faction_scene.populist:0 "이미 실제로 결성된 지정 적합 군에서 민중 파벌을 생성합니다."
 hd_dc_debug.faction_scene.populist_county:0 "\n적합한 민중 결성 군: [hd_dc_debug_populist_county.GetName]. 실제로 당신을 대상으로 합니다."
 hd_dc_debug.faction_scene.ready:0 "\n 원본의 현재 반란 검사: 통과. 위에 지정된 지도자로 전환하여 파벌 화면의 정식 최후통첩 버튼을 사용하거나, 원본 AI가 스스로 선택하기를 기다리십시오. 엔진의 초기 반란 상태를 유지하기 위해 디버그는 최후통첩 이벤트를 직접 보내지 않습니다."
 hd_dc_debug.fields.actor:0 "\n기록 행위자: [hd_dc_debug_record.Var('hd_dc_actor').Char.GetShortUIName]"
 hd_dc_debug.fields.audit_first:0 "\n첫 번째 측의 실제 답변: [hd_dc_debug_record.Var('hd_dc_audit_first_answer').GetFlagKey]"
 hd_dc_debug.fields.audit_second:0 "\n두 번째 측의 실제 답변: [hd_dc_debug_record.Var('hd_dc_audit_second_answer').GetFlagKey]"
 hd_dc_debug.fields.cooperation:0 "\nORD-19 청년: [hd_dc_debug_record.Var('hd_dc_visitor').Char.GetShortUIName]\n 보증인: [hd_dc_debug_record.Var('hd_dc_guarantor').Char.GetShortUIName]"
 hd_dc_debug.fields.disaster:0 "\n실제 재해 연관 번호: [hd_dc_debug_record.Var('hd_dc_disaster_identity').GetValue|0]\n재해 유형: [hd_dc_debug_record.Var('hd_dc_disaster_type').GetFlagKey]\n이 항목의 실제 단계: [hd_dc_debug_record.Var('hd_dc_disaster_stage').GetFlagKey]\n발생 기록과 회복 기록은 같은 재해의 서로 다른 실제 순번을 나타냅니다. 회복 기록이 당신이 어떤 정치 심사를 마쳤다는 뜻은 아닙니다."
 hd_dc_debug.fields.disaster_county:0 "\n실제 재해 중심지: [hd_dc_debug_record.Var('hd_dc_disaster_epicenter').Title.GetName]"
 hd_dc_debug.fields.exchange:0 "포로 교환도 정식 절차를 통해 확인되어 석방되었습니다.\n"
 hd_dc_debug.fields.from_signature:0 "발기인의 실제 서명:\n [hd_dc_debug_record.Var('hd_dc_from_signature').Char.GetShortUIName]"
 hd_dc_debug.fields.help:0 "\n 친지의 실제 회신: [hd_dc_debug_record.Var('hd_dc_help_answer').GetFlagKey]"
 hd_dc_debug.fields.help_stress:0 "\n 기록된 인격 스트레스 순증가량: [hd_dc_debug_record.Var('hd_dc_personality_stress_actual').GetValue|2]"
 hd_dc_debug.fields.node:0 "\n 노드 번호: [hd_dc_debug_record.Var('hd_dc_node').GetValue|0]"
 hd_dc_debug.fields.par_choice:0 "\nPAR-01 선택한 행동: [hd_dc_debug_record.Var('hd_dc_par01_action').GetFlagKey]"
 hd_dc_debug.fields.pay_parties:0 "\n 실제 지급인: [hd_dc_debug_record.Var('hd_dc_payer').Char.GetShortUIName]\n 실제 수령인: [hd_dc_debug_record.Var('hd_dc_payee').Char.GetShortUIName]"
 hd_dc_debug.fields.petitioner:0 "\n청원인: [hd_dc_debug_record.Var('hd_dc_petitioner').Char.GetShortUIName]"
 hd_dc_debug.fields.proposal:0 "\n 제안의 현재 상태: [hd_dc_debug_record.Var('hd_dc_proposal_state').GetFlagKey]"
 hd_dc_debug.fields.protection_signature:0 "\n 맹약에 실제로 서명한 이의 보호자: [hd_dc_debug_record.Var('hd_dc_protection_signature').Char.GetShortUIName]"
 hd_dc_debug.fields.ransom:0 "\n친족: [hd_dc_debug_record.Var('hd_dc_prisoner').Char.GetShortUIName]\n포로: [hd_dc_debug_record.Var('hd_dc_captor').Char.GetShortUIName]"
 hd_dc_debug.fields.roy_choice:0 "\nROY-01 선택한 행동: [hd_dc_debug_record.Var('hd_dc_roy01_action').GetFlagKey]"
 hd_dc_debug.fields.support:0 "\nROY-08 실제 답변: [hd_dc_debug_record.Var('hd_dc_support_answer').GetFlagKey]"
 hd_dc_debug.fields.to_signature:0 "\n 수신 측의 실제 서명: [hd_dc_debug_record.Var('hd_dc_to_signature').Char.GetShortUIName]"
 hd_dc_debug.fields.trait:0 "\n특성 추첨 출처: [hd_dc_debug_record.Var('hd_dc_trait_source').GetFlagKey]\n기본 확률: [hd_dc_debug_record.Var('hd_dc_trait_base_chance').GetValue|2]%\n배율: [hd_dc_debug_record.Var('hd_dc_trait_multiplier').GetValue|2]\n실제 확률: [hd_dc_debug_record.Var('hd_dc_trait_actual_chance').GetValue|2]%\n실제 결과: [hd_dc_debug_record.Var('hd_dc_trait_result').GetFlagKey]"
 hd_dc_debug.fields.trial_first:0 "\n첫 번째 군의 실제 심사 결과: [hd_dc_debug_record.Var('hd_dc_audit_first_result').GetFlagKey]"
 hd_dc_debug.fields.trial_second:0 "\n두 번째 군의 실제 심사 결과: [hd_dc_debug_record.Var('hd_dc_audit_second_result').GetFlagKey]"
 hd_dc_debug.history_unavailable:0 "\n#N 사록 경고: 최소 한 번의 W/H 기록 중에 보존 기록 담당자가 자리에 없었습니다. 이 영역에는 마지막 기록의 세부 내용만 남습니다. 이 알림은 보충 기록이 성공했음을 뜻하지 않습니다.#!"
 hd_dc_debug.impact_detail:0 "[SCOPE.GetFlagName('hd_dc_debug_impact')]"
 hd_dc_debug.impacts:0 "스무 가지 위험의 세계 영향 및 검사 진입점"
 hd_dc_debug.impacts.desc:0 "번호별로 실제 연결 지점과 검증 방법을 확인합니다. 현재 검증 가능한 진입점만 실행 가능 항목으로 표시합니다. 인터페이스가 닫히지 않은 항목은 공백을 명시해야 하며, 독립적인 무작위 이벤트로 원본 발생률을 대신할 수 없습니다."
 hd_dc_debug.latest:0 "최신 영수증으로 돌아가기"
 hd_dc_debug.native_delta:0 "이번 원본 증가량의 실제 수치"
 hd_dc_debug.native_delta.desc:0 "실행 전: [SCOPE.GetValue('hd_dc_debug_before_amount')|2]\n 실행 후: [SCOPE.GetValue('hd_dc_debug_after_amount')|2]\n 이번 순변화: [SCOPE.GetValue('hd_dc_debug_actual_delta')|2]\n\n 수치는 같은 효과 체인에서 읽은 것으로, 원본 수정치와 범위 제한이 포함되어 있습니다. 이 페이지에 표시되는 것은 마지막 조작의 관측값입니다. 자연 출처로 기록되지 않으며, 모든 출처의 최종 증가량 차단이 닫혔음을 증명하지도 않습니다."
 hd_dc_debug.native_scene:0 "실제 시나리오와 원본 증가량 검사"
 hd_dc_debug.native_scene.desc:0 "이 페이지는 구체적인 대상을 표시합니다. 클릭하면 새 세계가 실제로 바뀌며, 메뉴로 돌아가도 이 조작은 취소되지 않습니다. 원본 증가량과 특성 추첨으로 현재 단계를 검사할 수 있습니다. 비밀이나 역병을 수동으로 준비하는 것은 자연 발생 추첨을 나타내지 않으며, 스무 가지 인터페이스 유형이 모두 완성되었다는 뜻도 아닙니다."
 hd_dc_debug.native_scene.drunkard:0 "합법적인 술고래 특성 추첨을 한 번 실행합니다(기본 10%)"
 hd_dc_debug.native_scene.drunkard.tt:0 "정식 음주 추첨 인터페이스를 호출하여 현재 F에 따라 한 번 환산합니다. 당첨되지 않은 것도 유효한 결과입니다. 누군가에게 술고래가 부여되면 다시 얻을 수 없으며, 기본 확률, 배율, 실제 확률 및 부여 결과가 모두 장부에 남습니다. 모든 부정적 특성의 진입점이 증거로 뒷받침되는 것은 아닙니다."
 hd_dc_debug.native_scene.legitimacy_gain:0 "정통성 +10을 실제로 제출하고 전후 수치를 읽습니다"
 hd_dc_debug.native_scene.legitimacy_loss:0 "정통성 -10을 실제로 제출하고 전후 수치를 읽습니다"
 hd_dc_debug.native_scene.no_drunkard:0 "\n음주 추첨을 실행할 수 없음: 원본 can_be_drunkard 검사를 통과하지 못했습니다. 성년 여부, 기존 술고래 특성, 상호 배타 조건 및 신앙 요건은 여전히 원래 시스템이 검사하며, 중복 부여는 허용되지 않습니다."
 hd_dc_debug.native_scene.no_legitimacy:0 "\n정통성 증가를 실행할 수 없음: 현재 인물에게는 내재된 정통성 메커니즘이 없습니다. 자격을 위조하기 위해 정체를 수정하지 않습니다."
 hd_dc_debug.native_scene.no_outbreak_county:0 "\n 이 조합을 준비할 수 있는 지역이나 군이 없음: 속신이 군을 보유해야 하고, 주군이 살아 있고 자유로워야 하며, 현재 진행 중인 역병이 없고, 사용 중인 시스템 심사나 세금 감면도 없어야 합니다. 선택한 강도에서 원본 기본값, 배율 및 최근 역병 요소가 발생을 허용해야 합니다. 또한 홍역/이질/성 안토니우스의 불의 DLC 잠금, 성 안토니우스의 불의 동일 질병 대기 시간, 흑사병의 금지/1회 발생 완료/유행 중/역사적 지리 제한은 여전히 유지됩니다. 튜토리얼이나 초기 유예 기간으로 기본값이 0이 될 때는 날짜가 바뀌지 않으며, 결핵/홍역의 풍토병 보너스는 여전히 원본 순서대로 읽습니다."
 hd_dc_debug.native_scene.no_secret_target:0 "\n비밀 시나리오에 대상이 없음: 당신의 궁정에 살아 있고 성년이며 자유롭고 원본 협박 비밀 검사 기능으로 선택될 수 있는 인물이 없습니다. 먼저 적합한 정신을 영입해야 합니다. 이 페이지는 기존의 약점을 비밀로 꾸미지 않습니다."
 hd_dc_debug.native_scene.outbreak:0 "일곱 가지 역병과 세 가지 강도 선택"
 hd_dc_debug.native_scene.outbreak.tt:0 "원본 속주의 create_epidemic_outbreak을 재사용하여 위의 재해 유형과 강도를 실제로 생성합니다. 클릭할 때 같은 이름의 군을 다시 검사합니다. 자연 발생률을 수정하거나 추가 추첨을 하지 않으며, 군에 가상의 역병 수정치를 추가하지도 않습니다. 발생한 뒤에는 실제 역병을 읽으며, 전파, 감염 및 사망은 원본 시스템이 처리합니다."
 hd_dc_debug.native_scene.outbreak_county:0 "\n선택한 역병이 발생할 실제 주군: [hd_dc_debug_outbreak_county.GetName]. 이 군이 속한 주의 치소에 있습니다."
 hd_dc_debug.native_scene.outbreak_created:0 "[hd_dc_debug_outbreak_county.GetName]에서 실제 역병을 읽어 들였습니다. 방금 요청한 것은 [SCOPE.GetFlagName('hd_dc_debug_epidemic_name')]/[SCOPE.GetFlagName('hd_dc_debug_epidemic_intensity')]입니다. 역병 지도에서 실제 유형, 강도 및 전파 상황을 확인하십시오. 다른 역병과의 자연 병합은 여전히 엔진이 처리합니다. 군에서 감염을 읽어 들였다고 해서 병합되지 않는다는 것이 증명되지는 않습니다.\n\n PAR 두 군 비교가 필요하다면, 역병이 없는 적합한 군을 따로 준비한 뒤 시나리오 준비 메뉴로 들어가십시오. 시스템은 대응 조치를 자동으로 채우거나, 구휼금을 지급하거나, 12개월의 심사 기간을 건너뛰지 않습니다."
 hd_dc_debug.native_scene.outbreak_unconfirmed:0 "원본 역병 효과가 [hd_dc_debug_outbreak_county.GetName]의 주 치소에 제출되었지만, 현재 효과 체인에서 감염된 주가 아직 감지되지 않았습니다. 역병을 확인된 것으로 보고할 수 없으며, 이를 꾸미기 위해 군 단위 수정치를 추가하지도 않습니다. 원본 역병이 갱신된 뒤 지도와 실제 재해 자격을 대조하고 나서 PAR 시나리오를 준비하십시오."
 hd_dc_debug.native_scene.secret:0 "지정한 궁정 관원에게 협박에 실제로 쓸 수 있는 비밀을 하나 준비합니다."
 hd_dc_debug.native_scene.secret.tt:0 "그 인물의 원래 자격에 따라 실제 비밀을 생성하고 당신에게 알립니다. 증거를 발급하거나 돈을 차감하지 않으며, 그 인물을 대신해 어떤 요구도 받아들이지 않습니다. 이후 그 인물을 우클릭하여 정식 협박 상호작용으로 요구하십시오."
 hd_dc_debug.native_scene.secret_created:0 "비밀 생성이 실행되어 원본 비밀 객체를 얻었습니다. 현재 이 사실은 당신만 알고 있으며, 대상은 [hd_dc_debug_secret_target.GetShortUIName]입니다.\n비밀 내용: [new_secret.Custom('SecretDescriptionThirdPerson')]\n\n비밀 창을 확인한 뒤, 이 인물을 우클릭하여 협박 요구를 하십시오. 상호작용은 여전히 비밀의 노출 여부, 협박 가능 여부, 기존 약점 및 답변 대기 상태를 검사하며, 결과는 상대의 정식 답변으로만 결정됩니다."
 hd_dc_debug.native_scene.secret_failed:0 "원본 비밀 객체를 얻지 못했으므로 생성 성공을 보고할 수 없습니다. 대상의 현재 자격과 로그를 확인하십시오. 이 페이지는 객체 참조를 다시 할당하거나 결과를 바꾸는 것을 지원하지 않습니다."
 hd_dc_debug.native_scene.secret_target:0 "\n실제 비밀을 추가할 인물: [hd_dc_debug_secret_target.GetShortUIName]. 비밀의 유형은 원본이 이 인물의 신앙, 기존 특성 및 비밀 자격에 따라 선택합니다."
 hd_dc_debug.neg01:0 "NEG-01 암살 시도"
 hd_dc_debug.neg01.desc:0 "암살을 시작하는 기본 확률은 위험률에 따라 환산되었으며, 동적 기본 확률과 원본 목표 자격을 유지합니다. F는 1/1.15/1.40/1.80/2.30입니다. “군웅할거”의 고정 배율은 따로 합산되며 최대 3입니다.\n\n 실제 목표의 암살 상호작용 검사를 사용하여 실제 음모를 확인하십시오. 플레이어의 수동 클릭은 AI가 자동으로 일으키는 확률 표본을 나타내지 않습니다. 이 메뉴는 다른 무작위 풀로 원본 추첨을 대신하지 않습니다."
 hd_dc_debug.neg02:0 "NEG-02 납치 시작"
 hd_dc_debug.neg02.desc:0 "납치의 원본 발기인은 능력, 합법적인 목표 및 모략 조건을 유지합니다. F는 1/1.15/1.40/1.80/2.30입니다. 납치 능력이 없는 자는 여전히 실행할 수 없습니다.\n\n 실제 모략 시나리오 페이지는 지정한 합법적 목표를 검색하여 표시합니다. 시작하기 전에 원본 자격을 다시 확인한 뒤 실제 납치 모략을 시작하십시오. 이후의 행동과 결과는 모략 흐름이 처리합니다. 수동으로 한 번 시작하는 것은 AI의 자연 발생률 표본을 나타내지 않습니다."
 hd_dc_debug.neg03:0 "NEG-03 협박 제안"
 hd_dc_debug.neg03.desc:0 "협박 진입점은 실제 비밀, 아는 측 및 원본 동적 기본값을 유지하며, F는 1/1.15/1.40/1.80/2.30입니다. 정식으로 협박을 요구한 뒤에도 결과는 상대의 실제 답변에 달려 있습니다.\n\n 실제 시나리오 페이지에서는 지정한 적합한 궁정 관원에게 새 원본 비밀을 추가하고 당신에게 알릴 수 있습니다. 그런 다음 이 인물을 우클릭하여 정식으로 협박을 요구하십시오. 준비 조작은 분명히 현재 시점에 일어나며, 과거의 죄를 꾸며내지 않습니다. 직접 증거를 발급하지 않으며, 수동 제안은 AI 확률 표본으로 계산되지 않습니다."
 hd_dc_debug.neg04:0 "NEG-04 국고 절취"
 hd_dc_debug.neg04.desc:0 "일시적으로 사용 불가: 이번 업데이트의 확인에 따르면, 횡령된 국고의 원본 진입점 네 개는 여전히 닫혀 있습니다. 연간 AI 탐지와 동적 확률, 5년 대기 시간, 원본 첩자 자리 다섯 개 및 인출 장부 기록은 유지되며, 탐지 시 원본 진입점이 닫혀 있다고 보고할 뿐 음모를 강제로 생성하지 않습니다.\n\n 각 단계와 최종의 인출, 실제 차감, 실수령액 및 정산 대기 차액은 실제 장부 항목에 따라 계속 처리되며, 원본의 고정 인출로 인한 초과 인출도 허용합니다. 기존 충돌 데이터로는 예전 접근 위반의 근본 원인을 증명할 수 없으며, 횡령된 국고가 플레이 가능한지는 아직 검증되지 않았습니다."
 hd_dc_debug.neg05:0 "NEG-05 민중 봉기"
 hd_dc_debug.neg05.desc:0 "민중 파벌의 합법성은 P로 읽으며, 다섯 단계로 나뉘어 1/1.10/1.25/1.50/1.80으로 설정됩니다. 결성 시에는 새로 승인된 규칙을 적용합니다. 원본의 자동 생성은 유지하고, W≥20일 때 정체마다 매년 10%를 기본으로 추가 기회를 한 번 더 추첨하며, P로 환산하여 실제로 합법적인 유형 가운데 균등하게 선택하고 최대 하나를 생성합니다.\n\n 민중 유형은 실제 군의 원본 생성 자격을 따르며, 원본의 최종 생성 확률을 대신하지 않습니다. 연간 검사 페이지에서 실제 기록을 볼 수 있고, 시나리오 페이지에서 실제 파벌을 준비할 수 있지만, 봉기를 직접 일으키거나 승리하게 하지는 않습니다."
 hd_dc_debug.neg06:0 "NEG-06 농민 봉기"
 hd_dc_debug.neg06.desc:0 "농민 파벌의 합법적 봉기는 P를 읽으며, 다섯 단계로 나뉘어 1/1.10/1.25/1.50/1.80으로 설정됩니다. 일반 농민 유형은 이제 추가 연간 결성 기회를 얻습니다. W≥20일 때 10%를 기본으로 P로 환산하며, 다른 합법적 유형과 정체마다 매년 하나라는 상한을 공유합니다. 원본 생성은 그대로 유지됩니다.\n\n 농민 파벌로의 격상은 여전히 원본 봉기 격상 흐름을 따라 생성되며, 실제 지도자와 군의 이전을 유지합니다. 추가 기회는 전제가 되는 봉기, 군대 또는 승리를 꾸며내지 않습니다."
 hd_dc_debug.neg07:0 "NEG-07 파벌 생성"
 hd_dc_debug.neg07.desc:0 "수정된 설정을 사용하여 승인된 추가 연간 기회를 한 번 생성합니다. 원본 자동 생성은 유지하고, W≥20일 때 정체마다 매년 10%를 기본으로 P로 환산합니다. 성공하면 실제로 합법적인 유형 가운데 같은 가중치로 하나를 골라 최대 하나를 생성하며, 실패하면 다시 추첨하지 않습니다. 후보 수가 유형 가중치를 늘리지는 않습니다.\n\n 일반 인물, 군의 봉기 및 실제 명분 보유자의 원본 생성 자격을 각각 검증하고, 같은 유형의 기존 파벌을 제외합니다. 이미 닫힌 일본 메커니즘은 현재 조건에서 계속 제외되며, 격상된 농민은 원본 격상 흐름을 유지합니다. 이 항목은 엔진의 최종 생성 확률을 읽거나 대체한다는 뜻이 아닙니다. 연간 검사 페이지에서 실제 추첨과 생성 결과를 볼 수 있습니다."
 hd_dc_debug.neg08:0 "NEG-08 파벌 봉기"
 hd_dc_debug.neg08.desc:0 "원본 파벌의 봉기 진입점이 P의 유형별 기본값에 동적으로 연결되었습니다. 다섯 단계는 1/1.10/1.25/1.50/1.80입니다. 기존 파벌은 여전히 세력, 불만도 및 기타 전제를 충족해야 하며, 0과 100 두 끝점은 원래 의미를 유지합니다.\n\n 실제 파벌 페이지에서는 지정한 중지되지 않은 요구 파벌에 실제 불만도를 추가하고 순변화를 재현하며, 원본 파벌이 현재 봉기할 수 있는지도 표시합니다. 반드시 원본 파벌 화면에서 보내야 하며, 디버그는 첫 봉기의 내부 상태를 건너뛰지 않습니다. ROY-08D 중지의 보호는 여전히 유효합니다."
 hd_dc_debug.neg09:0 "NEG-09 스트레스 증가"
 hd_dc_debug.neg09.desc:0 "원본 수정치를 통합했습니다. 인물 스트레스 증가 단계는 0 / +10% / +20% / +35% / +50%입니다. 시스템 범위 내 이벤트에 참여하는 인물에게 적용됩니다. 단계는 매월 관찰할 때 초기화되고 갱신되며, 범위를 벗어나면 제거됩니다. 다른 스트레스 수정치와의 중첩 및 실제 변화는 원본 규칙이 처리합니다.\n\n 먼저 인물의 현재 스트레스를 기록한 뒤, 아래 조작으로 기본 +10 스트레스 증가를 제출하고, 조작 전후의 실제 스트레스 수치를 현재 수정치와 비교하십시오."
 hd_dc_debug.neg10:0 "정통성 증가"
 hd_dc_debug.neg10.desc:0 "원본 수정치를 적용했습니다. 인물 정통성 증가는 다섯 단계로, 각각 0 / -10% / -20% / -35% / -50%입니다. 시스템 범위 내 상황에 참여하는 인물에게 적용됩니다. 다른 정통성 수정치와의 중첩 및 실제 증가는 원본 규칙이 처리합니다.\n\n W 단계로 전환하고 새로 고쳐 인물 수정치를 확인하십시오. 먼저 현재 정통성 수치를 기록한 뒤, 실제로 정통성을 높일 수 있는 행동을 마치고 전후 수치를 비교하십시오."
 hd_dc_debug.neg11:0 "정통성 손실"
 hd_dc_debug.neg11.desc:0 "원본 수정치를 통합했습니다. 인물 정통성 손실 단계는 0 / +10% / +25% / +50% / +80%입니다. 시스템 범위 내 인물에게 적용됩니다. 다른 정통성 수정치와의 중첩 및 실제 손실은 원본 규칙이 처리합니다.\n\n 인물의 현재 정통성을 기록하십시오. 정통성을 낮추는 행동을 마친 뒤 전후 수치를 비교합니다. 단계를 바꾸면 이 시스템 수정치가 교체되며, 범위를 벗어나면 제거됩니다."
 hd_dc_debug.neg12:0 "NEG-12 역병 발생"
 hd_dc_debug.neg12.desc:0 "원본의 일곱 가지 역병 유형은 이제 강도마다 유효한 진입점을 제공하며, 다섯 단계는 1/1.05/1.10/1.15/1.20입니다.\n\n 실제 시나리오 페이지에서는 일곱 가지 재해 유형과 세 가지 강도를 차례로 고르고 지정한 군을 확인할 수 있으며, 원본 발생 효과를 재사용하고 감염 데이터를 다시 읽습니다. DLC, 동일 질병 대기 시간, 원본 기본 규칙 및 흑사병 규정은 여전히 유효합니다. 역사적 흑사병이 현재 지도에서 발생지를 찾을 수 없다면 명확히 차단됩니다. 21개의 메뉴 조합이 어떤 규칙 집합에서도 유효한 21가지 시나리오를 뜻하는 것은 아니며, 수동 생성으로 자연 D 확률이나 엔진의 전파를 증명할 수도 없습니다."
 hd_dc_debug.neg13:0 "NEG-13 자연재해"
 hd_dc_debug.neg13.desc:0 "실제 지진과 홍수 재해 진입점을 복구했으며, 중국, 황하 및 장강의 기존 지리 매핑을 그대로 사용합니다. 디버그 페이지는 정식 군 자격과 이벤트 생성 인터페이스를 재사용합니다. 개발도는 최소 2단계를 유지하고, 같은 군 안의 지진과 같은 유역 안의 홍수는 제외하며, 재해 조건을 위조하지 않습니다.\n\n 수동 시나리오에서는 실제 재해가 명확히 생성되며, 이후의 대응은 여전히 원본 조건에 따라 진행됩니다. 자연 D 배율, 계절 및 실행 중 콜백은 따로 확인해야 합니다. 수동으로 한 번 일으킨 것으로 자연 확률을 검증할 수는 없습니다."
 hd_dc_debug.neg14:0 "NEG-14 부정적 특성 획득 기회"
 hd_dc_debug.neg14.desc:0 "이 고정 검사는 14개 유형을 다룹니다. 술꾼, 대마초 흡연자, 방탕아, 은둔자, 성마른 자, 낭비벽, 자선가, 참회자, 폭식가, 거식증, 자해자, 그리고 유전되지 않는 우울증, 광기, 빙의가 포함됩니다. 검증된 인물 속성, F값을 얻는 자연 무작위 기회, 실제 자격 유지, 상호 배타성, 동적 분모와 단일 추첨이 포함되며, 새 인물 생성, 확정적 선택 및 100% 결과의 조건은 그대로 유지됩니다.\n\n 음주, 교육, 연회, 영감, 결투 및 손님 특성은 실제 이벤트 상황에서 처리됩니다. 실제 상황 페이지에서 자격을 갖춘 음주 추첨과 확률 기록을 검사할 수 있으며, 스트레스와 재사용 대기시간이 조건을 충족하면 완전한 스트레스 이벤트를 발생시킬 수 있습니다. 자격을 갖춘 기회에서 특성을 얻지 못하는 것은 정상적인 결과입니다."
 hd_dc_debug.neg15:0 "NEG-15 장악력 비축"
 hd_dc_debug.neg15.desc:0 "장악력은 이번 주기에 처음 위기에 진입했을 때의 실제 값을 기준으로 0/5/10/15/20%를 누적 차감합니다. 이미 처리된 최고 단계를 초과하는 차액만 보충하며, 반복 갱신, 주군 교체, 하락 후 이전 단계로 복귀하는 경우에는 중복 차감이 발생하지 않습니다. 낮은 단계의 안정 상태가 60개월 지속되어야만 손실 기간이 끝납니다.\n\n 수도 백작령의 장악력을 기록하고, 20→80→40→80 패턴으로 W를 조정하며 반복 갱신하여 처리 및 차감된 총액을 확인하십시오. 단계가 낮아져도 손실은 환급되지 않습니다."
 hd_dc_debug.neg16:0 "개발도 비축"
 hd_dc_debug.neg16.desc:0 "개발 진행도는 이번 주기의 실제 기준치에서 0/2/4/6/8%를 누적 차감하며, 반올림 후 새로 발생한 차액만 보상합니다. 정상적인 개발은 유지되며, 주군 교체 시에는 정산하지 않고, 매월 반복 갱신해도 차감이 중첩되지 않습니다.\n\n 장악력 단계와 함께 검사하십시오. 개발도 기준치가 낮으면 반올림으로 인해 새로운 손실이 발생하지 않을 수 있습니다."
 hd_dc_debug.neg17:0 "NEG-17 가족 관계"
 hd_dc_debug.neg17.desc:0 "혼인 분쟁, 기존 적대 분가, 연회, 아이들 모임, 마상 시합 방해, 마법 집회, 그리고 주군 관계의 혼합 풀이 모두 현재의 조정 풀에 포함되었습니다. 실제 친족 또는 배우자 관계를 읽으며, F값은 1/1.15/1.40/1.80/2.30입니다. 한 쌍이 친족과 묵은 원한 자격을 동시에 충족하면 한 번만 적용합니다. 인물 특성, 적합도, 자녀 자격 및 실제 결과는 유지됩니다.\n\n 혼합 풀은 원작의 사망 및 부상 분기를 유지하며, 일반 결과를 배분할 수 있는 조건부 관계 확률만 조정합니다. 끝점 확률은 여전히 0% 또는 100%로 유지됩니다. 가족 분쟁 상황에서는 완전한 adultery.0001 의심 연쇄를 발생시킬 수 있으며, 실제 대상과 5년 재사용 대기시간이 유지됩니다."
 hd_dc_debug.neg18:0 "NEG-18 적대 이벤트"
 hd_dc_debug.neg18.desc:0 "이번 조정의 관계 확률 출처는 기존 경쟁자, 연회 및 아이들 분쟁, 그리고 새로 추가된 무예 시합, 마법 집회, yearly.4001 비사망 조건 풀을 포함한 16개 위치로 통합되었습니다. 실제 묵은 원한과 부정적인 의견을 확인한 뒤 F를 사용하며, 같은 추첨 인스턴스 안에서는 중복 증폭하지 않습니다. 사망, 부상 또는 필연적 원한이 관련된 분기 경로에서만 원작의 사상 확률과 100% 끝점 조건을 유지합니다\n\n. 실제 적대 상황에서는 완전한 진입점 yearly.1010을 통해 친족 납치 등의 이벤트를 발생시킬 수 있으며, 각 당사자의 자격과 시대 표식이 유지됩니다. 결과에는 사망이 포함될 수 있습니다. ORD-19에는 별도의 협력 절차가 있어 청년과 보증인이 각각 답합니다."
 hd_dc_debug.neg19:0 "NEG-19 집안 결속 상실"
 hd_dc_debug.neg19.desc:0 "통합 완료: 현재 불러온 스크립트에서 집안 결속의 부정적 또는 가변적 기록에는 1/1.10/1.25/1.50/1.80이 적용되며, 고정된 긍정적 증가분은 증폭하지 않습니다. 기존 인물 소속, 원작 설명 및 범위 처리는 유지됩니다. 실제 결속 메커니즘이 없는 정치 체제에는 적용되지 않습니다\n\n. 자격을 갖춘 집안은 기본 -10 결속을 제출할 수 있으며(아래 참조), 다섯 단계를 각각 검사하고 집안의 변화를 기록합니다. 이번 테스트는 결속 메커니즘을 꾸며내기 위해 정치 체제를 바꾸지 않습니다."
 hd_dc_debug.neg20:0 "NEG-20 민심"
 hd_dc_debug.neg20.desc:0 "현재 지역의 백작령 및 민중 여론은 단일 출처를 사용하며, 0/−5/−10/−15/−20의 다섯 단계가 있습니다. 단계를 전환할 때는 기존 단계를 먼저 제거한 뒤 새 단계를 추가하며, 해당 지역을 벗어나면 이 출처는 제거됩니다.\n\n 반복 갱신하여 같은 단계가 중첩되지 않는지 확인할 수 있습니다. 인물의 의견은 이 백작령 단위 여론에 속하지 않습니다."
 hd_dc_debug.next:0 "다음 영향 묶음"
 hd_dc_debug.older:0 "이전 영수증 보기"
 hd_dc_debug.par01:0 "PAR-01: 양측 정책 질의 시작"
 hd_dc_debug.par01.tt:0 "당신은 재위 중인 황제여야 하며, 해당 지역은 점령되지 않아야 하고, 파벌 분쟁은 재사용 대기 중이 아니어야 합니다. 두 실제 파벌은 각각 활동 구성원이 최소 3명이고 세력 비중이 각각 20% 이상이어야 하며, 그 수장들은 서로 적대해야 합니다. 또한 실제 역병이나 재해의 영향을 받고 통치 조치를 시행할 수 있는 봉신 백작령이 있어야 합니다. 먼저 두 파벌 수장에게 질의하며, 실제 답변이 상반될 때에만 주요 이벤트가 성립합니다. 누구의 정책도 대신 작성하지 않습니다."
 hd_dc_debug.prepare_ord09:0 "ORD-09 준비: 실제 혈연관계와 포로 교환"
 hd_dc_debug.prepare_ord09.tt:0 "해당 지역에서 조건을 충족하는 다른 재위 통치자를 포획자로 지정하고, 당신의 18세 자녀 한 명과 그 사람의 18세 자녀 한 명을 생성합니다. 전자는 상대에게 억류되고, 후자는 당신이 억류합니다. 당신은 300금화를 얻습니다. 억류, 친족 관계, 인물은 모두 실제이며, 메뉴를 닫아도 이 조작은 취소되지 않습니다. 이후에도 당신은 요청을 제출하고 포획자의 실제 응답을 받아야 합니다."
 hd_dc_debug.prepare_ord13:0 "ORD-13 준비: 장악력 낮은 백작령, 스트레스와 친족"
 hd_dc_debug.prepare_ord13.tt:0 "기존의 성인 자유 직속 봉신 한 명을 선택해 그의 한 백작령 장악력을 40으로 설정합니다. 35세 친족 또는 친구 한 명을 생성해 당신의 궁정에 합류시키고 우정을 맺으며, 300금화를 얻고, 스트레스가 최소 200 증가하여 원작 스트레스 이벤트가 발생할 수 있습니다. 현 상서는 5년간 당신에 대한 의견이 +100이 됩니다. 아직 임명된 대신이 없다면 직접 한 명을 임명해야 합니다."
 hd_dc_debug.prepare_par:0 "PAR-01 준비: 두 실제 파벌과 재해 백작령 비교"
 hd_dc_debug.prepare_par.tt:0 "원작 파벌 두 개가 이미 존재해야 하며, 그 구성원 수, 관직 및 실제 영향력이 모두 조건을 충족해야 합니다. 또한 실제로 재해를 입고 통치 자격이 있는 봉신 백작령 두 곳이 필요합니다. 두 파벌 수장은 서로에 대해 5년간 -200 의견을 얻습니다. 두 번째 백작령의 현재 개발도와 장악력은 첫 번째 백작령과 같게 조정되며, 당신은 300금화와 5년간 +16 관리를 얻습니다. 역병은 발생하지 않으며, 파벌 구성원 수를 꾸며내거나 정책 대응을 바꾸지도 않습니다. 이후 실제 정책 갈등은 정식 질의를 통해 발생합니다."
 hd_dc_debug.prepare_roy:0 "ROY-01 준비: 기존 종친 두 명의 불만 격화."
 hd_dc_debug.prepare_roy.tt:0 "봉토를 보유하고 황실 혈통에 속하며 원작 파벌 허가를 충족하는 성인 자유 종친 두 명만 선택할 수 있습니다. 각자 5년간 황제에 대한 -200 의견과 300금화를 얻으며, 당신은 300금화를 얻습니다. 인물을 생성하지 않고, 가문을 바꾸지 않으며, 봉토를 재분배하지 않고, 과거의 죄를 꾸며내지도 않습니다. 선택 가능한 인물이 두 명 미만이면 준비할 수 없습니다. 이후 정통 이벤트 메뉴에서 정식으로 등록해야 합니다."
 hd_dc_debug.prepare_support:0 "ROY-08 준비: 자금과 실제 인적 약점"
 hd_dc_debug.prepare_support.tt:0 "최신 종실 후보 명단에서 당신에게 합법적으로 초청을 보낼 수 있는 실제 후보 한 명을 선택합니다. 당신과 선택된 후보는 각각 300금화를 얻으며, 약점 설정을 허용하면 해당 후보에 대한 개인 약점을 얻습니다. 약점은 실제 D 선택지에서 사용해야 합니다. 너무 일찍 중단하지 말고, 보호 서약에 자동으로 서명하지도 마십시오."
 hd_dc_debug.protection.actor:0 "\n기록된 실제 실행자: [hd_dc_debug_record.Var('hd_dc_protection_harm_actor').Char.GetShortUIName]"
 hd_dc_debug.protection.execute:0 "\n사망 콜백을 기록합니다. 실제 처형인지 여부는 사망 후 정식 관찰을 통해 판정해야 합니다."
 hd_dc_debug.protection.illegal:0 "\n 사전 근거: 합법적 근거가 없음이 확인됨. 실제 실행 후에만 위약이 처리됩니다."
 hd_dc_debug.protection.imprison:0 "\n 실행된 조치: 억류."
 hd_dc_debug.protection.legal:0 "\n 사전 사유: 합법적 근거를 확보함. 이 행동은 위약에 해당하지 않습니다."
 hd_dc_debug.protection.revoke:0 "\n 실행된 조치: 작위 이전 동결."
 hd_dc_debug.protection.title:0 "\n실제로 이전된 동결 작위: [hd_dc_debug_record.Var('hd_dc_protection_harm_title').Title.GetName]"
 hd_dc_debug.protection.unknown:0 "\n 사전 근거: 알 수 없음. 합법 또는 불법으로 추정할 수 없으며, 이를 이유로 의무 이행 완료 보상을 지급해서도 안 됩니다."
 hd_dc_debug.protection.unknown_actor:0 "\n원작 콜백이 확인 가능한 실제 실행자를 제공하지 않았으므로, 작위 승계자나 다른 인물을 지휘자로 추측하지 않습니다."
 hd_dc_debug.receipt.audit_pending:0 "\n실제 처벌 기록은 있으나 아직 사전 합법 근거와 대조하여 검증할 수 없습니다. 검증 대기 중이며 약정 완료로 기록해서는 안 됩니다. 해당 이름이 지정된 피보호자 기록으로 넘겨 실제 실행자와 행동을 확인할 수 있습니다."
 hd_dc_debug.receipt.closed:0 "\n이 일반 노드는 종료되었습니다. 지불 및 미지불 기록은 등기부에 그대로 남습니다."
 hd_dc_debug.receipt.desc:0 "지역 영수증 번호: [hd_dc_debug_record.Var('hd_dc_record_id').GetValue|0]\n 기록 버전: [hd_dc_debug_record.Var('hd_dc_record_version').GetValue|0]\n 기록 유형 식별자: [hd_dc_debug_record.Var('hd_dc_record_kind').GetFlagKey]\n\n 이 페이지는 원본 기록을 읽고 보존합니다. 페이지를 넘겨도 비용을 차감하거나, 추가 서명을 요구하거나, 날짜를 진행하거나, 장부를 정산하지 않습니다. 나타나지 않은 항목은 이 기록에 해당 필드가 없다는 뜻이며, 이행되었음을 의미하지 않습니다."
 hd_dc_debug.receipt.empty:0 "현재 페이지 범위 안에 일치하는 기록이 없습니다. 최신 영수증으로 돌아갈 수 있으며, 자연적 또는 수동 정식 절차로 생성된 기록은 지역 등기부에 보존됩니다."
 hd_dc_debug.receipt.instance:0 "\n주요 인스턴스: 통치 Q [hd_dc_debug_record.Var('hd_dc_q').GetValue|0], 강도 X [hd_dc_debug_record.Var('hd_dc_x').GetValue|0], 미결 의무 [hd_dc_debug_record.Var('hd_dc_open_obligations').GetValue|0]."
 hd_dc_debug.receipt.letters:0 "\n 이 기록은 ORD-19에 속합니다. 양측은 먼저 3개월 안에 각자 수락을 마치고, 이어서 실제로 30금화를 지불해야 또 다른 3개월의 지정 서신 기간에 들어갈 수 있습니다. W−2 정산은 양측의 실제 답신이 모두 완료되었을 때에만 이루어집니다."
 hd_dc_debug.receipt.pause:0 "\n 약점이 실제로 소모됨. 동원 중단은 [hd_dc_debug_record.Var('hd_dc_pause_date_year').GetValue|0]/[hd_dc_debug_record.Var('hd_dc_pause_date_month').GetValue|0]/[hd_dc_debug_record.Var('hd_dc_pause_date_day').GetValue|0]부터 시작됩니다. 그때 원래 파벌과 인물을 다시 검증하십시오. 이미 발생한 전쟁은 취소되지 않습니다."
 hd_dc_debug.receipt.payment:0 "\n 지불해야 할 금액: [hd_dc_debug_record.Var('hd_dc_amount_due').GetValue|2]\n 실제 차감액: [hd_dc_debug_record.Var('hd_dc_actual_debit').GetValue|2]\n 실제 수령액: [hd_dc_debug_record.Var('hd_dc_actual_credit').GetValue|2]\n 지불과 정치적 답신은 별도로 기록됩니다. 전액을 수령했다고 해서 모든 비금전적 의무가 이행된 것은 아닙니다."
 hd_dc_debug.receipt.points:0 "\n포인트 일련번호: [hd_dc_debug_record.Var('hd_dc_point_sequence').GetValue|0]\n출처 식별자: [hd_dc_debug_record.Var('hd_dc_point_source').GetFlagKey]\n날짜: [hd_dc_debug_record.Var('hd_dc_point_date_year').GetValue|0]년 [hd_dc_debug_record.Var('hd_dc_point_date_month').GetValue|0]월 [hd_dc_debug_record.Var('hd_dc_point_date_day').GetValue|0]일\nW 요청/실제: [hd_dc_debug_record.Var('hd_dc_w_requested').GetValue|0]/[hd_dc_debug_record.Var('hd_dc_w_committed').GetValue|0]\nH 요청/실제: [hd_dc_debug_record.Var('hd_dc_h_requested').GetValue|0]/[hd_dc_debug_record.Var('hd_dc_h_committed').GetValue|0]\n기록 후 W/H: [hd_dc_debug_record.Var('hd_dc_w_after').GetValue|0]/[hd_dc_debug_record.Var('hd_dc_h_after').GetValue|0]\n. 이상은 내부 포인트이며, 20포인트가 화면상의 1포인트에 해당합니다. 이 일련번호는 매월 의무 처리에 참여하지 않습니다."
 hd_dc_debug.receipt.protection:0 "지정 보호는\n[hd_dc_debug_record.Var('hd_dc_protection_date_year').GetValue|0]:[hd_dc_debug_record.Var('hd_dc_protection_date_month').GetValue|0]:[hd_dc_debug_record.Var('hd_dc_protection_date_day').GetValue|0]에 체결되었으며, 기한은 5년입니다. 피보호자에는 체결 당시의 상대방과 당시 생존해 있던 가까운 친족이 포함됩니다. 작위는 체결일부터 동결되며, 이후에 태어난 사람이나 이후에 작위를 얻은 사람은 자동으로 포함되지 않습니다."
 hd_dc_debug.receipt.protection_wait:0 "이전 5년 보호 기간이 아직 유효합니다. 날짜는 게임 진행에 따라 흐르며, 이 메뉴로 기한을 단축할 수 없습니다.\n"
 hd_dc_debug.receipt.refund:0 "\n 아직 환급되지 않은 누적 차감액: [hd_dc_debug_record.Var('hd_dc_unreturned_debit').GetValue|2]. 이벤트를 닫아도 이 잔액은 지워지지 않습니다."
 hd_dc_debug.receipt.subject:0 "체결 시 동결된 피보호 대상:\n. 피보호 영수증 소속자: [hd_dc_debug_record.Var('hd_dc_protected_person').Char.GetShortUIName]. 영수증 번호:\n. 소유자: [hd_dc_debug_record.Var('hd_dc_protection_contract').Var('hd_dc_record_id').GetValue|0]."
 hd_dc_debug.receipt.trial:0 "\n제1 지방 당국이 실제로 자금을 받은 날짜는 [hd_dc_debug_record.Var('hd_dc_audit_first_date_year').GetValue|0]년 [hd_dc_debug_record.Var('hd_dc_audit_first_date_month').GetValue|0]월 [hd_dc_debug_record.Var('hd_dc_audit_first_date_day').GetValue|0]일입니다. 대조 심사에 따라 각 백작령을 12개월간 따로 추적합니다. 한쪽이 실효되었다고 해서 다른 쪽이 의무를 이행한 것은 아니며, 기한 만료 후에도 양측 수장의 장부 대조를 기다려야 합니다."
 hd_dc_debug.refresh_stocks:0 "정식 백작령 단위 영향 갱신 실행"
 hd_dc_debug.refresh_stocks.tt:0 "해당 지역의 장악력, 개발도 및 민심 출처를 실제로 갱신합니다. 처음 단계가 오르면 기존 비축에서 손실이 차감되며, 반복 호출 시에는 같은 처리 최고 단계를 유지해야 합니다."
 hd_dc_debug.region:0 "지역, 시대 및 진입 제한"
 hd_dc_debug.region.chaos:0 "\n현재 시대는 군웅이 할거하여 각자 주군을 차지한 국면입니다."
 hd_dc_debug.region.desc:0 "핵심 백작령 수: [hd_dc_debug_region.Var('hd_dc_total_counties').GetValue|0]\n 실제 장악한 백작령 수: [hd_dc_debug_region.Var('hd_dc_controlled_counties').GetValue|0]\n 실제 장악률: [hd_dc_debug_region.Var('hd_dc_control_percent').GetValue|1]%\n\n 패권은 12개월간 패권국이 없거나 24개월간 실제 장악률이 50% 미만일 때에만 끝나며, 이때 공식적으로 군웅 시대에 들어선 것으로 판정합니다. 65%로 회복하여 60개월간 안정되면 벗어납니다. 조공은 실제 장악으로 계산되지 않습니다. W/H 조정은 시대를 직접 전환하지 않습니다.\n 아래에는 현재 유효한 제한만 표시됩니다."
 hd_dc_debug.region.invalid:0 "지역\n의 스냅숏이 유효하지 않습니다. 먼저 정식 관찰을 진행하여 세계의 실제 영토를 확인하십시오."
 hd_dc_debug.region.locked:0 "지역\n의 주요 위기 슬롯이 실제 인스턴스에 의해 점유되어 덮어쓸 수 없습니다."
 hd_dc_debug.region.no_affected_county:0 "\nPAR-01에 실제로 통치 가능한 재해 백작령이 없습니다. 지역 등기부에 등재되어 있고, 실제 역병이나 재해가 있으며, 천자 휘하의 봉신 백작령이고, 주군이 생존해 있고 자유로우며, 현재 진행 중인 심사 조치나 세금 감면에 점유되어 있지 않아야 합니다. 먼저 실제 상황 페이지에서 역병이나 재해를 준비한 뒤 다시 검사할 수 있습니다."
 hd_dc_debug.region.no_parties:0 "\n PAR-01에 자격을 갖춘 실제 파벌 두 개가 없습니다. 각 파벌은 활동 구성원이 최소 3명이고, 유효한 성인 자유 파벌 수장이 있어야 하며, 구성원이 올해의 실제 세력 스냅숏과 일치하고, 각 파벌의 세력이 최소 20%를 차지해야 합니다. 서로 경쟁자인 두 사람이 하나의 조직을 대신할 수는 없습니다."
 hd_dc_debug.region.no_roy_instance:0 "\nROY-08에 정식 황실 인스턴스가 없습니다. 먼저 ROY-01을 합법적으로 확립하여 실제 후보 파벌을 형성한 뒤, 그 파벌에 가입할 수 있는 초청 대상 인물로 전환해야 합니다."
 hd_dc_debug.region.no_royals:0 "\nROY-01 후보 부족: 정식 종실 후보 심사를 통과한 실제 인물이 두 명 미만입니다. 그들은 생존해 있고, 성인이며, 자유롭고, 같은 혈통에 속하며 봉토를 보유하고, 원작 파벌 허가를 받아야 합니다. 준비 메뉴는 기존의 자격 있는 종친만 강화할 수 있으며, 새 봉토나 가문을 만들지 않습니다."
 hd_dc_debug.region.not_emperor:0 "\nROY-01/PAR-01 자격 미달: 당신은 현 황제가 아닙니다. 시작하기 전에 실제 황제로 전환하십시오. 보유자는 교체되지 않습니다."
 hd_dc_debug.region.ordinary_wait:0 "\n처리 대기 중인 일반 이벤트가 있어 다른 일반 노드를 열 수 없습니다."
 hd_dc_debug.region.outside:0 "\n당신은 왕조 순환의 참여자가 아닙니다. 인물 증분과 일반 노드는 지역 밖의 인물을 자격 있는 인물로 간주할 수 없습니다."
 hd_dc_debug.region.par_cooldown:0 "\n50년의 파벌 분쟁 재사용 대기시간이 아직 끝나지 않았습니다."
 hd_dc_debug.region.party_wait:0 "양측 정책 질의가 아직 진행 중이며, 정식 답변을 기다리고 있습니다.\n"
 hd_dc_debug.region.prepared:0 "\n의 정치 실체가 아직 수립되지 않아 다시 생성할 수 없습니다."
 hd_dc_debug.region.roy_cooldown:0 "\n황족 유형의 50년 재사용 대기시간이 아직 끝나지 않았습니다."
 hd_dc_debug.relation_scene:0 "실제 가족 분쟁 또는 적대 이벤트 진입"
 hd_dc_debug.relation_scene.desc:0 "완전한 원작 진입점을 통해 들어가야만 원작 이벤트가 실제 대상을 선택하고 후속 대응을 진행할 수 있습니다. 여기서는 무작위 풀을 구성하지 않으며, 간통, 묵은 원한, 납치 성공 또는 관계 결과를 강제로 설정하지도 않습니다. 전제 조건이 충족되면 이벤트에서 지정된 인물과 모든 선택이 실제로 세계를 바꿉니다."
 hd_dc_debug.relation_scene.family:0 "조건을 충족하는 원작 배우자 의심 연쇄를 시작합니다."
 hd_dc_debug.relation_scene.family.tt:0 "adultery.0001 이벤트를 호출합니다. 원작 이벤트 선택지가 실제 배우자를 선정하고 의심받는 사람에게 기존의 5년 제한을 적용한 뒤, 당신에게 직접 추궁할지 묻습니다. 상대가 혐의를 부인할 때에만 실제 의심 분기로 들어가며, 당신이 상대 대신 부인을 선택할 수는 없습니다. 비밀이 사실이 아니라면 원작 줄거리가 처리하며, 불륜을 꾸며내지 않습니다."
 hd_dc_debug.relation_scene.no_family:0 "\n 가족 분쟁 전제 부족: 당신은 해당 지역 안에 있어야 하고, 원작의 연간 인물 자격을 충족해야 하며, 귀가 얇은 사람이어서는 안 됩니다. 최근 의심받지 않은 신체 건강한 성인 실제 배우자가 최소 한 명 있어야 하고, 당신에게 의심하는 마음이 있거나, 원작 배우자에게 문란함/유혹자 특성이 있거나 실제 불륜의 징후가 보여야 합니다. 신앙이 처벌 없는 간통을 허용해서는 안 됩니다. 기존의 5년 대상 재사용 대기시간은 지워지지 않습니다."
 hd_dc_debug.relation_scene.no_rival:0 "\n적대 이벤트 전제 부족: 원작의 10년 표식이 있어서는 안 됩니다. 성인이며 조작 가능한 AI 경쟁자가 있어야 하고, 그 경쟁자는 영지를 보유하거나 그 주군의 후계자여야 하며, 그 주군은 존재하고 당신 본인이 아니어야 합니다. 당신의 궁정에 성인이며 조작 가능한 AI 배우자/친족/정부가 있어야 하며 당신의 경쟁자가 아니어야 합니다. 또한 조작 가능하고 중상을 입지 않은 AI 지휘관이나 실제 사냥 관련 관직이 있어야 합니다."
 hd_dc_debug.relation_scene.rival:0 "조건을 충족하는 원작 경쟁자 가족 납치 연쇄를 시작합니다."
 hd_dc_debug.relation_scene.rival.tt:0 "yearly.1010을 호출하여 원작 이벤트에서 실제 경쟁자, 당신 궁정의 친족이나 친구, 그리고 추격자를 선정합니다. 이 연쇄는 실제 투옥, 부상, 사망, 지불 또는 관계 변화를 초래할 수 있습니다. 이는 납치 모략 발동률 테스트가 아닙니다. 원작의 10년 발생 제한을 유지하며, 친족이나 친구의 자발적 이탈 여부나 구출 결과를 대신 정하지 않습니다."
 hd_dc_debug.result.breached:0 "\n실제로 발생한, 합법적 근거가 없는 침해가 기록되었으며, 이는 피보호 위약에 해당합니다."
 hd_dc_debug.result.expired:0 "\n의 답변 기한이 만료되었습니다."
 hd_dc_debug.result.fulfilled:0 "\n5년 보호 기간이 약정대로 만료되었습니다."
 hd_dc_debug.result.guarantor_letter:0 "\n보증인이 서명한 답신을 받았습니다."
 hd_dc_debug.result.invalidated:0 "관련 당사자, 권력, 장소 또는 기타 실제 전제 조건이 실효되었습니다. 완료 보상이 지급되지 않았습니다.\n"
 hd_dc_debug.result.ordinary_code:0 "\n일반 노드 실제 종결 표식: [hd_dc_debug_record.Var('hd_dc_ordinary_result').GetFlagKey]"
 hd_dc_debug.result.par_code:0 "\n정책 노드 실제 종결 표식: [hd_dc_debug_record.Var('hd_dc_par01_result').GetFlagKey]"
 hd_dc_debug.result.partial:0 "\n일부만 이행되었거나 아직 정산되지 않은 장부가 있습니다. 지불과 지방 기록을 계속 대조하십시오."
 hd_dc_debug.result.pause_code:0 "\n동원 중단 실제 종결 표식: [hd_dc_debug_record.Var('hd_dc_pause_result').GetFlagKey]"
 hd_dc_debug.result.protection_code:0 "\n지정 보호 실제 종결 표식: [hd_dc_debug_record.Var('hd_dc_protection_result').GetFlagKey]"
 hd_dc_debug.result.rejected:0 "지방 또는 파벌 수장이 거절함. 전부 이행된 것으로 간주하지 않습니다.\n"
 hd_dc_debug.result.released:0 "\n친족의 실제 석방이 확인되었습니다."
 hd_dc_debug.result.roy_code:0 "\n궁정 예의령 실제 종결 표식: [hd_dc_debug_record.Var('hd_dc_roy01_result').GetFlagKey]"
 hd_dc_debug.result.verified:0 "\n이름이 지정된 두 파벌 수장이 모두 실제 정산을 마쳤습니다. 현재 정책 노드는 협약에 따라 정산되었습니다."
 hd_dc_debug.result.writing:0 "\n양측 모두 수락하고 지불했으며, 지금은 지정 서신을 기다리고 있습니다."
 hd_dc_debug.result.youth_letter:0 "\n청년이 서명한 답신을 받았습니다."
 hd_dc_debug.results:0 "현재 인스턴스와 실제 영수증 대조"
 hd_dc_debug.roy01:0 "ROY-01: 예제 질서 논쟁 시작"
 hd_dc_debug.roy01.tt:0 "당신은 재위 중인 천자여야 하며, 유효한 지역 스냅숏, 자격을 갖춘 원작 종실 후보 최소 두 명이 있어야 하고, 황실 유형이 재사용 대기 중이 아니어야 하며, 해당 지역에 현재 또는 대기 중인 인스턴스가 없어야 합니다. 정식으로 성립하면 실제 명분과 파벌이 생겨나며, 50년의 유형 재사용 대기시간이 시작됩니다."
 hd_dc_debug.roy08:0 "ROY-08: 내 종친의 정당한 초청으로 나를 판에 끌어들이시오."
 hd_dc_debug.roy08.tt:0 "최근의 왕조 인스턴스와, 활성 명분을 가진 현재 유효한 파벌이 있어야 합니다. 당신은 그 파벌에 가입할 자격이 있는 초청 대상이어야 하며, 황제, 후보 본인, 이미 가입한 자, 또는 어느 한쪽과 분쟁 중인 자여서는 안 됩니다. 어떤 인물 쌍도 대기 중인 초청, 기존 가입 기록 또는 재시도 재사용 대기시간이 있어서는 안 됩니다. 중단 상태의 파벌은 구성원을 모집할 수 없습니다."
 hd_dc_debug.scheme_scene:0 "실제 살해 또는 납치 모략 준비"
 hd_dc_debug.scheme_scene.abduct:0 "지정 대상에게 실제 납치 모략 개시"
 hd_dc_debug.scheme_scene.abduct_target:0 "\n납치 예정 대상: [hd_dc_debug_abduct_target.GetShortUIName]."
 hd_dc_debug.scheme_scene.desc:0 "왕조 순환의 실제 참여자 가운데, 원작 기준으로 can_start_scheme 자격을 갖춘 지정 AI 대상 한 명을 선택합니다. 클릭하면 모략이 시작되며, 성공률, 단계, 공모자와 결과는 여전히 원작 모략 시스템이 결정합니다. 누구도 직접 죽이거나 투옥하지 않으며, AI가 시작하는 위험률 추첨으로도 계산되지 않습니다. 모략 패널에서 실제 모략을 확인하십시오."
 hd_dc_debug.scheme_scene.murder:0 "지정 대상에게 실제 살해 모략 개시"
 hd_dc_debug.scheme_scene.murder_target:0 "\n암살 예정 대상: [hd_dc_debug_murder_target.GetShortUIName]."
 hd_dc_debug.scheme_scene.no_abduct:0 "\n 원작 기준으로 합법적인 납치 대상이 없습니다. 실행자는 납치자 기술을 보유하거나, 그 진영이 해금되었거나, 관련 쟁탈 허가를 보유해야 합니다. 대상은 성인이고 자유로우며 조작 가능한 통치자여야 합니다. 대상은 투옥되거나 인질이어서는 안 되며, 실제 위치와 외교 범위 안에 있어야 합니다. 아동 제한, 행동 불능 및 원작 재사용 대기시간/할당량도 여전히 검사합니다. 자격을 얻기 위해 기술을 추가하지 않습니다."
 hd_dc_debug.scheme_scene.no_murder:0 "\n원작 기준으로 합법적인 살해 대상이 없습니다. 인물 자격, 모략 슬롯, 같은 사람을 겨냥한 기존 모략, 재사용 대기시간, 외교 범위 및 혈연 제한을 확인하십시오. 현재 해당 지역 안에 생존해 있는 AI 인물만 선택하며, 대상이 당신에 대한 강력한 약점을 쥐고 있어서는 안 됩니다. 기존 모략은 지워지지 않습니다."
 hd_dc_debug.test_native_breakdown:0 "조건을 충족하는 원작 스트레스 이벤트 발생"
 hd_dc_debug.test_native_breakdown.tt:0 "현재 스트레스 수준과 그에 해당하는 원작 재사용 대기시간 잔여분이 필요합니다. 하루 뒤 자격을 다시 검증한 다음, 원작 스트레스 이벤트가 실제 내용을 선택합니다. 특성을 강제로 부여하지 않습니다."
 hd_dc_debug.test_stress:0 "기본 +10 스트레스 실제 적용"
 hd_dc_debug.test_stress.tt:0 "실제 스트레스가 증가하며, 원작 스트레스 이벤트의 임계값에 도달할 수 있습니다. 다른 원작 보정치도 계속 계산에 반영됩니다."
 hd_dc_debug.test_unity:0 "기본 -10 집안 결속 실제 적용"
 hd_dc_debug.test_unity.tt:0 "왕조 순환 지역 안에 있어야 하고, 실제 집안이 존재해야 하며, 현재 정치 체제에 고유한 결속 메커니즘이 있어야 합니다. 집안 결속의 실제 감소는 현재 P마다 한 번만 적용되며, 자동으로 환급되지 않습니다."
