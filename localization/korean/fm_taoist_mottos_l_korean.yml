 motto_fm_taoist_1973:0 "억지로 이름하여 크다고 한다"
 motto_fm_taoist_1974:0 "그러므로 도가 크고, 하늘이 크고, 땅이 크고, 사람 또한 크다"
 motto_fm_taoist_1975:0 "사람이 그 하나를 차지한다"
 motto_fm_taoist_1976:0 "무거움은 가벼움의 뿌리요, 고요함은 조급함의 임금이다"
 motto_fm_taoist_1977:0 "그러므로 군자는 종일 다녀도 짐수레를 떠나지 않는다"
 motto_fm_taoist_1978:0 "비록 화려한 경관이 있어도 편히 머물며 초연하다"
 motto_fm_taoist_1979:0 "어찌 만승의 임금이 제 몸을 천하보다 가벼이 여기랴"
 motto_fm_taoist_1980:0 "가벼우면 뿌리를 잃고 조급하면 임금을 잃는다"
 motto_fm_taoist_1981:0 "잘 다니는 이는 바퀴 자국을 남기지 않고"
 motto_fm_taoist_1982:0 "잘 말하는 이는 흠잡을 데가 없으며"
 motto_fm_taoist_1983:0 "잘 셈하는 이는 산가지를 쓰지 않고"
 motto_fm_taoist_1984:0 "잘 닫는 이는 빗장 없이도 열 수 없게 하며"
 motto_fm_taoist_1985:0 "잘 묶는 이는 끈 없이도 풀 수 없게 한다"
 motto_fm_taoist_1986:0 "성인은 늘 사람을 잘 구하므로 버리는 사람이 없고"
 motto_fm_taoist_1987:0 "늘 사물을 잘 구하므로 버리는 사물이 없다"
 motto_fm_taoist_1988:0 "시위습명"
 motto_fm_taoist_1989:0 "선한 사람은 선하지 않은 사람의 스승이요"
 motto_fm_taoist_1990:0 "선하지 않은 사람은 선한 사람의 거울이다"
 motto_fm_taoist_1991:0 "그 스승을 귀히 여기지 않고 그 거울을 아끼지 않으면"
 motto_fm_taoist_1992:0 "비록 지혜로워도 크게 미혹되니 이를 요묘라 한다"
 motto_fm_taoist_1993:0 "무릇 훌륭한 무기는 상서롭지 못한 도구이다"
 motto_fm_taoist_1994:0 "어쩔 수 없을 때 쓰되 담담함을 으뜸으로 삼는다"
 motto_fm_taoist_1995:0 "승이불미"
 motto_fm_taoist_1996:0 "시위미명"
 motto_fm_taoist_1997:0 "공을 이루어도 이름을 내세우지 않는다"
 motto_fm_taoist_1998:0 "가명위대"
 motto_fm_taoist_1999:0 "가서 해치지 않으니 편안하고 태평하다"
 motto_fm_taoist_2000:0 "백성은 명하지 않아도 스스로 고르게 된다"
