l_korean:
# 汉晋风华：按类型整合；键名与现行文本保留。来源逐键见本批manifest。

 # 来源：localization/simp_chinese/WJ_kaoke_assessment_additions_l_simp_chinese.yml
 trait_WJ_kaoke_malpractice:0 "사사로운 부정"
 trait_WJ_kaoke_malpractice_desc:0 "이 인물은 고과에서 농간을 부리고 사사로이 부정을 저질렀다가 일이 발각되었습니다. 설령 용서받는다 해도 이 오명은 평생 따라다닐 것입니다."

 # 来源：localization/simp_chinese/WJ_military_governance_l_simp_chinese.yml
 trait_WJ_zhongwai:0 "도독중외제군사"
 trait_WJ_zhongwai_desc:0 "이 인물은 조서를 받들어 도독중외제군사가 되고 황월을 빌려 육군을 총괄하며 군법을 바로잡습니다. 이 병권은 보정의 자리를 따라 왔으며, 보정의 자리와 함께 떠날 것입니다."

 # 来源：localization/simp_chinese/WJ_military_rank_l_simp_chinese.yml
 trait_WJ_mr_jiangjun_anbei:0 "안북장군"
 trait_WJ_mr_jiangjun_anbei_desc:0 "안북이라는 칭호는 북방을 안정시킨다는 뜻입니다. 조정이 이 인물에게 이 칭호를 내린 것은 변방을 지키고 호족을 어루만져 변경의 백성이 편히 잠들게 하기를 바라서입니다."
 trait_WJ_mr_jiangjun_andong:0 "안동장군"
 trait_WJ_mr_jiangjun_andong_desc:0 "안동이라는 칭호는 동쪽 땅을 안정시켜 화목하게 한다는 뜻입니다. 조정이 이 인물에게 이 칭호를 내린 것은 청주와 서주를 어루만져 흩어진 백성을 다시 논밭으로 돌아가게 하기를 바라서입니다."
 trait_WJ_mr_jiangjun_annan:0 "안남장군"
 trait_WJ_mr_jiangjun_annan_desc:0 "안남이라는 칭호는 남쪽 땅을 평온하게 한다는 뜻입니다. 조정이 이 인물에게 이 칭호를 내린 것은 강남의 산월을 진무하되 은혜와 위엄을 함께 베풀기를 바라서입니다."
 trait_WJ_mr_jiangjun_anxi:0 "안서장군"
 trait_WJ_mr_jiangjun_anxi_desc:0 "안서라는 칭호는 서쪽 변경을 안정시킨다는 뜻입니다. 조정이 이 인물에게 이 칭호를 내린 것은 농우에 둔전하여 지키며 강족과 저족이 차츰 왕화에 복종하게 하기를 바라서입니다."
 trait_WJ_mr_jiangjun_caiguan:0 "재관장군"
 trait_WJ_mr_jiangjun_caiguan_desc:0 "재관은 본래 강한 쇠뇌를 당길 수 있는 장사를 가리키며, 재관장군은 이런 이들을 거느린다는 데서 이름이 붙었습니다. 이 인물은 이 칭호로 병사를 이끌며 주로 보병의 힘에 의지합니다."
 trait_WJ_mr_jiangjun_dangkou:0 "탕구장군"
 trait_WJ_mr_jiangjun_dangkou_desc:0 "탕구라는 칭호는 도적을 소탕한다는 뜻입니다. 이 인물은 이 칭호로 토벌과 체포를 전담하니, 사방의 초적들은 소문만 듣고도 달아날 것입니다."
 trait_WJ_mr_jiangjun_dingbei:0 "정북장군"
 trait_WJ_mr_jiangjun_dingbei_desc:0 "정북이라 함은 북방을 평정한다는 뜻입니다. 이 인물은 이 칭호를 받았으니 변방 위에서 활시위를 당겨 북쪽 오랑캐를 멀리 쫓아내야 합니다."
 trait_WJ_mr_jiangjun_dingdong:0 "정동장군"
 trait_WJ_mr_jiangjun_dingdong_desc:0 "정동이라 함은 동쪽 땅을 평정한다는 뜻입니다. 이 인물은 이 칭호를 받았으니 회수와 바다에 위엄을 떨쳐 한 지방의 호족들이 손을 거두게 해야 합니다."
 trait_WJ_mr_jiangjun_dingnan:0 "정남장군"
 trait_WJ_mr_jiangjun_dingnan_desc:0 "정남이라 함은 남쪽 변경을 평정한다는 뜻입니다. 이 인물은 이 칭호를 받았으니 풍토병이 도는 땅 깊숙이 들어가 군대의 위세로 여러 만족을 굴복시켜야 합니다."
 trait_WJ_mr_jiangjun_dingnan_variant_2:0 "정난장군"
 trait_WJ_mr_jiangjun_dingnan_variant_2_desc:0 "정난이라는 칭호는 화란을 평정한다는 뜻입니다. 이 인물은 대개 혼란한 판국에 명을 받아, 한 부대의 병력으로 남은 국면을 수습해야 합니다."
 trait_WJ_mr_jiangjun_dingxi:0 "정서장군"
 trait_WJ_mr_jiangjun_dingxi_desc:0 "정서라 함은 서쪽 변경을 평정한다는 뜻입니다. 이 인물은 이 칭호를 받았으니 하서와 농우를 내달려, 호령이 미치는 곳마다 강족과 호족이 감히 따르지 않는 자가 없게 해야 합니다."
 trait_WJ_mr_jiangjun_duliao:0 "도료장군"
 trait_WJ_mr_jiangjun_duliao_desc:0 "도료라는 칭호는 처음에는 요수를 건너 변방 밖으로 출정하기 위해 두었으나, 그 뒤로는 변경 군에 주둔하며 여러 호족을 감독하고 보호하게 되었습니다. 이 칭호를 가진 이 인물은 변방의 일에 익숙하고 호족의 사정을 깊이 알아야 합니다."
 trait_WJ_mr_jiangjun_fenwei:0 "분위장군"
 trait_WJ_mr_jiangjun_fenwei_desc:0 "분위라는 칭호는 위엄과 무용을 떨친다는 뜻입니다. 이 인물은 예기가 한창 왕성하니, 싸움마다 용감히 앞장서야 합니다."
 trait_WJ_mr_jiangjun_fenwu:0 "분무장군"
 trait_WJ_mr_jiangjun_fenwu_desc:0 "분무라는 칭호는 무용을 떨쳐 일으킨다는 뜻입니다. 난세에는 이 칭호가 새로 일어난 호걸에게 주로 내려지니, 이 인물 또한 공을 세우기를 스스로 기약해야 합니다."
 trait_WJ_mr_jiangjun_fubei:0 "무북장군"
 trait_WJ_mr_jiangjun_fubei_desc:0 "무북이라는 칭호는 북쪽 변경을 회유하는 데 중점을 둡니다. 이 칭호를 가진 이 인물은 호시를 열고 호족 추장과 교분을 맺어 신의로 변방 밖을 안정시켜야 합니다."
 trait_WJ_mr_jiangjun_fubo:0 "복파장군"
 trait_WJ_mr_jiangjun_fubo_desc:0 "복파라는 칭호는 파도를 굴복시킨다는 뜻입니다. 옛날 마원이 이 칭호로 남쪽 교지를 정벌하여 위명을 멀리 떨쳤습니다. 이 칭호를 얻은 이 인물은 수전에 익숙하여 강과 바다를 평지처럼 건너야 합니다."
 trait_WJ_mr_jiangjun_fudong:0 "무동장군"
 trait_WJ_mr_jiangjun_fudong_desc:0 "무동이라는 칭호는 동방을 회유하는 데 중점을 둡니다. 이 칭호를 가진 이 인물은 너그러움과 엄격함을 아울러 덕으로 바닷가 백성의 마음을 거두어야 합니다."
 trait_WJ_mr_jiangjun_fuguo:0 "보국장군"
 trait_WJ_mr_jiangjun_fuguo_desc:0 "보국이라는 칭호는 사직을 바로잡고 돕는다는 뜻입니다. 이 인물은 스스로 나라의 간성이 되기를 기약하며, 그 명망이 여느 장수들보다 높습니다."
 trait_WJ_mr_jiangjun_fujun:0 "보군장군"
 trait_WJ_mr_jiangjun_fujun_desc:0 "보군이라는 칭호는 대군을 보좌한다는 뜻입니다. 이 인물은 늘 주장을 도와 군을 지휘하며, 나아가고 물러남에 법도가 있습니다."
 trait_WJ_mr_jiangjun_funan:0 "무남장군"
 trait_WJ_mr_jiangjun_funan_desc:0 "무남이라는 칭호는 남쪽 땅을 회유하는 데 중점을 둡니다. 이 칭호를 가진 이 인물은 이족과 월족을 잘 대우하여 은혜와 신의로 먼 곳 사람들의 마음을 얻어야 합니다."
 trait_WJ_mr_jiangjun_fuxi:0 "무서장군"
 trait_WJ_mr_jiangjun_fuxi_desc:0 "무서라는 칭호는 서쪽 변경을 회유하는 데 중점을 둡니다. 이 칭호를 가진 이 인물은 강족과 저족을 기미하여, 화친으로 전쟁을 대신할 수 있다면 그것이 최선입니다."
 trait_WJ_mr_jiangjun_fuyuan:0 "무원장군"
 trait_WJ_mr_jiangjun_fuyuan_desc:0 "무원이라는 칭호는 먼 곳을 안무한다는 뜻입니다. 이 인물은 주로 변경을 지키니, 은혜와 신의로 먼 곳 사람들을 불러들여야 합니다."
 trait_WJ_mr_jiangjun_guanjun:0 "관군장군"
 trait_WJ_mr_jiangjun_guanjun_desc:0 "관군이라는 칭호는 용맹이 삼군에서 으뜸이라는 뜻입니다. 이 인물은 자신의 용력을 자부하며, 늘 홀로 한 방면을 맡기를 바랍니다."
 trait_WJ_mr_jiangjun_hengye:0 "횡야장군"
 trait_WJ_mr_jiangjun_hengye_desc:0 "횡야라는 칭호는 들판을 종횡으로 누빈다는 뜻입니다. 이 인물은 경병을 이끌고 넓은 들판을 내달리는 데 능하여, 바람처럼 오고 갑니다."
 trait_WJ_mr_jiangjun_hou:0 "후장군"
 trait_WJ_mr_jiangjun_hou_desc:0 "전, 후, 좌, 우 네 장군 중 하나입니다. 후장군은 신중하게 후미를 맡으니, 대군이 나아가고 물러날 때 그 근본을 굳건히 지키는 데 의지합니다. 이 인물은 침착하고 굳센 태도를 지켜야 합니다."
 trait_WJ_mr_jiangjun_hujun:0 "호군장군"
 trait_WJ_mr_jiangjun_hujun_desc:0 "호군의 직책은 여러 장수를 감독하고 무관을 선발하는 일을 관장합니다. 이 인물은 이 중요한 칭호를 지니고 장수들 사이를 오가니, 군중의 인사는 대부분 그의 손을 거쳐야 합니다."
 trait_WJ_mr_jiangjun_huwei:0 "호위장군"
 trait_WJ_mr_jiangjun_huwei_desc:0 "호위라는 칭호는 사나운 범의 위엄에서 따왔습니다. 이 인물은 범이 산림에 웅크린 듯 군을 거느려 병사들이 바라만 보아도 두려워하게 해야 합니다."
 trait_WJ_mr_jiangjun_jianwei:0 "건위장군"
 trait_WJ_mr_jiangjun_jianwei_desc:0 "건위라는 칭호는 위명을 세운다는 뜻입니다. 이 인물은 공을 세워 이름을 떨치기에 급급하여, 행군할 때 험난함을 피하지 않습니다."
 trait_WJ_mr_jiangjun_jianwu:0 "건무장군"
 trait_WJ_mr_jiangjun_jianwu_desc:0 "건무라는 칭호는 무공을 세운다는 뜻입니다. 이 인물은 전공으로 입신하여, 군마 속에서 바삐 지내며 잠시도 쉰 적이 없습니다."
 trait_WJ_mr_jiangjun_jianzhong:0 "건충장군"
 trait_WJ_mr_jiangjun_jianzhong_desc:0 "건충이라는 칭호는 충절을 세운다는 뜻입니다. 이 인물은 충의를 자부하며 몸을 나라에 바치기로 맹세했습니다."
 trait_WJ_mr_jiangjun_jingbei:0 "정북장군"
 trait_WJ_mr_jiangjun_jingbei_desc:0 "정북이라는 칭호에는 북쪽 변경을 숙청하기를 바라는 뜻이 담겨 있습니다. 이 인물은 관문과 요새를 엄히 지켜 호족 기병이 감히 변경을 두드리지 못하게 해야 합니다."
 trait_WJ_mr_jiangjun_jingbian:0 "정변장군"
 trait_WJ_mr_jiangjun_jingbian_desc:0 "정변이라는 칭호는 변경을 평안하게 한다는 뜻입니다. 이 인물은 오랫동안 변방에 있어 봉수와 척후의 일에 밝습니다."
 trait_WJ_mr_jiangjun_jingdong:0 "정동장군"
 trait_WJ_mr_jiangjun_jingdong_desc:0 "정동이라는 칭호에는 동방을 숙청하기를 바라는 뜻이 담겨 있습니다. 이 인물은 군을 다스림에 엄정함을 으뜸으로 삼아, 바닷가의 도적들이 소문만 듣고도 흩어지게 해야 합니다."
 trait_WJ_mr_jiangjun_jinglue:0 "경략장군"
 trait_WJ_mr_jiangjun_jinglue_desc:0 "경략이라는 칭호는 경영하고 계략을 세운다는 뜻입니다. 이 인물은 계획에 뛰어나 공격과 수비, 진격과 후퇴에 모두 법도가 있습니다."
 trait_WJ_mr_jiangjun_jingnan:0 "정남장군"
 trait_WJ_mr_jiangjun_jingnan_desc:0 "정남이라는 칭호에는 남쪽 땅을 숙청하기를 바라는 뜻이 담겨 있습니다. 이 인물은 토벌과 회유를 함께 써서 강호 사이에 더는 무리 지어 날뛰는 자가 없게 해야 합니다."
 trait_WJ_mr_jiangjun_jingnan_zhong:0 "정난장군"
 trait_WJ_mr_jiangjun_jingnan_zhong_desc:0 "정난이라는 칭호는 화란을 평정한다는 뜻입니다. 이 인물은 위급한 때에 명을 받았으니, 몸을 던져 기울어 가는 나라를 붙들어야 합니다."
 trait_WJ_mr_jiangjun_jingxi:0 "정서장군"
 trait_WJ_mr_jiangjun_jingxi_desc:0 "정서라는 칭호에는 서쪽 변경을 숙청하기를 바라는 뜻이 담겨 있습니다. 이 인물은 변경을 순찰하고 도적을 쫓아 농도에 다시 상인이 오가게 해야 합니다."
 trait_WJ_mr_jiangjun_jinu:0 "적노장군"
 trait_WJ_mr_jiangjun_jinu_desc:0 "적노라는 칭호는 강노를 쏘는 병사들을 거느린다는 데서 이름이 붙었습니다. 이 인물은 노진을 잘 펼치니, 화살비 아래에서는 적 기병이 가까이 오기 어렵습니다."
 trait_WJ_mr_jiangjun_lingjun:0 "선위장군"
 trait_WJ_mr_jiangjun_lingjun_desc:0 "선위라는 칭호는 나라의 위엄을 널리 떨친다는 뜻입니다. 이 인물은 사신으로 변경에 가든 군을 이끌고 출정하든, 모두 군대의 위세로 조정의 위엄을 드러내야 합니다."
 trait_WJ_mr_jiangjun_longxiang:0 "용양장군"
 trait_WJ_mr_jiangjun_longxiang_desc:0 "용양이란 용이 머리를 높이 들고 솟구쳐 오르는 모습입니다. 이 중요한 칭호를 얻은 이 인물은 기상이 당당하여 풍운을 삼키고 토할 뜻을 품어야 합니다."
 trait_WJ_mr_jiangjun_louchuan:0 "누선장군"
 trait_WJ_mr_jiangjun_louchuan_desc:0 "누선이라는 칭호는 수군과 전함을 거느린다는 데서 이름이 붙었습니다. 이 인물은 수전에 정통하여 늘 누선을 이끌고 강을 따라 내려갑니다."
 trait_WJ_mr_jiangjun_piaoyao:0 "표요장군"
 trait_WJ_mr_jiangjun_piaoyao_desc:0 "표요란 굳세고 날랜 모습을 이릅니다. 옛날 곽거병이 표요교위로서 경기병을 이끌고 멀리 기습한 일로 이 칭호가 이름을 얻었습니다. 이 중요한 칭호를 얻은 이 인물은 신속한 급습을 장기로 삼아야 합니다."
 trait_WJ_mr_jiangjun_pingbei:0 "평북장군"
 trait_WJ_mr_jiangjun_pingbei_desc:0 "평북이라는 칭호는 북쪽 변경을 쓸어 평정하는 데 뜻이 있습니다. 이 칭호로 군을 거느리는 이 인물은 변방 밖으로 나가 달아나는 적을 쫓아, 호족의 먼지가 다시는 남쪽으로 날리지 않게 해야 합니다."
 trait_WJ_mr_jiangjun_pingdong:0 "평동장군"
 trait_WJ_mr_jiangjun_pingdong_desc:0 "평동이라는 칭호는 동방을 쓸어 평정하는 데 뜻이 있습니다. 이 칭호로 군을 거느리는 이 인물은 바다와 태산 사이의 남은 도적을 씻어 내어 동쪽 땅을 다시 맑고 평안하게 해야 합니다."
 trait_WJ_mr_jiangjun_pingnan:0 "평남장군"
 trait_WJ_mr_jiangjun_pingnan_desc:0 "평남이라는 칭호는 남방을 쓸어 평정하는 데 뜻이 있습니다. 이 칭호로 군을 거느리는 이 인물은 남쪽으로 장강과 한수를 건너 복종하지 않는 자를 치고 반란을 평정해야 합니다."
 trait_WJ_mr_jiangjun_pingxi:0 "평서장군"
 trait_WJ_mr_jiangjun_pingxi_desc:0 "평서라는 칭호는 서쪽 변경을 쓸어 평정하는 데 뜻이 있습니다. 이 칭호로 군을 거느리는 이 인물은 관중과 농우를 전전하며 강족의 난을 평정해야 합니다."
 trait_WJ_mr_jiangjun_qian:0 "전장군"
 trait_WJ_mr_jiangjun_qian_desc:0 "전, 후, 좌, 우 네 장군은 모두 중요한 칭호입니다. 전장군은 전투에 임하여 전군의 선봉이 되니, 이 인물은 적진을 돌파하며 병사들보다 앞장서야 합니다."
 trait_WJ_mr_jiangjun_qingche:0 "경거장군"
 trait_WJ_mr_jiangjun_qingche_desc:0 "경거라는 칭호는 전차와 경병을 거느린다는 데서 이름이 붙었습니다. 이 인물은 돌격에 능하며 행군이 신속합니다."
 trait_WJ_mr_jiangjun_saoni:0 "소역장군"
 trait_WJ_mr_jiangjun_saoni_desc:0 "소역이라는 칭호는 역란을 쓸어 없앤다는 뜻입니다. 이 인물은 반역자 토벌을 전담하니, 신하 노릇을 하지 않는 무리들은 그 이름만 들어도 벌벌 떱니다."
 trait_WJ_mr_jiangjun_tunqi:0 "둔기장군"
 trait_WJ_mr_jiangjun_tunqi_desc:0 "둔기라는 칭호는 주둔한 기사들을 거느린다는 뜻입니다. 이 인물은 이 칭호로 홀로 한 부대의 기사를 거느리고 바깥을 누빕니다."
 trait_WJ_mr_jiangjun_weibei:0 "위북장군"
 trait_WJ_mr_jiangjun_weibei_desc:0 "위북이라는 칭호는 군대의 위세로 북쪽 변경을 진압한다는 뜻입니다. 이 인물의 큰 깃발이 향하는 곳마다 변방 밖의 부족들이 먼지만 보고도 절해야 합니다."
 trait_WJ_mr_jiangjun_weidong:0 "위동장군"
 trait_WJ_mr_jiangjun_weidong_desc:0 "위동이라는 칭호는 군대의 위세로 동방을 진압한다는 뜻입니다. 이 인물이 이 혁혁한 칭호를 지니고 있으니, 동쪽 땅의 군웅들은 거듭 저울질하며 감히 가볍게 움직이지 못할 것입니다."
 trait_WJ_mr_jiangjun_weinan:0 "위남장군"
 trait_WJ_mr_jiangjun_weinan_desc:0 "위남이라는 칭호는 군대의 위세로 남쪽 땅을 진압한다는 뜻입니다. 이 인물이 이 칭호를 지니고 강가에 임하면, 여러 이족의 호수들은 모두 그 칼끝을 저울질해야 합니다."
 trait_WJ_mr_jiangjun_weishuo:0 "위삭장군"
 trait_WJ_mr_jiangjun_weishuo_desc:0 "위삭이라는 칭호는 북방을 지킨다는 뜻입니다. 이 중요한 칭호를 받은 이 인물은 오래도록 북쪽 변경을 지키며, 얼굴에 풍상이 가득해도 뜻과 절개를 바꾸지 않아야 합니다."
 trait_WJ_mr_jiangjun_weixi:0 "위서장군"
 trait_WJ_mr_jiangjun_weixi_desc:0 "위서라는 칭호는 군대의 위세로 서쪽 변경을 진압한다는 뜻입니다. 이 인물의 이름이 나서기만 하면, 농판 너머의 강족과 호족은 조정에 인물이 있음을 알게 됩니다."
 trait_WJ_mr_jiangjun_wuwei:0 "무위장군"
 trait_WJ_mr_jiangjun_wuwei_desc:0 "무위라는 칭호는 궁중을 숙위하는 친위병을 관장합니다. 이 인물은 친위군을 거느리고 밤낮으로 군주 곁을 지키니, 심복이 아니면 이 자리에 앉을 수 없습니다."
 trait_WJ_mr_jiangjun_wuyi:0 "무의장군"
 trait_WJ_mr_jiangjun_wuyi_desc:0 "무의라는 칭호는 강직하고 과감하다는 뜻입니다. 이 인물은 이 칭호로 스스로를 격려하니, 전투에 임하여 굳세고 결단력 있게 두려움이 없어야 합니다."
 trait_WJ_mr_jiangjun_xiaoqi:0 "효기장군"
 trait_WJ_mr_jiangjun_xiaoqi_desc:0 "효기라는 칭호는 기병이 날래고 용맹하다는 뜻입니다. 이 인물은 말을 타고 창을 휘두르며, 적진에 돌격할 때 무인지경에 들어가듯 해야 합니다."
 trait_WJ_mr_jiangjun_xuanfeng:0 "선풍장군"
 trait_WJ_mr_jiangjun_xuanfeng_desc:0 "선풍이라는 칭호는 풍속과 교화를 널리 편다는 뜻입니다. 이 인물은 문무를 겸비하여 군대의 위세와 교화를 함께 펼쳐야 합니다."
 trait_WJ_mr_jiangjun_xuanrui:0 "선예장군"
 trait_WJ_mr_jiangjun_xuanrui_desc:0 "선예라는 칭호는 예기를 떨친다는 뜻입니다. 이 인물은 병사들을 북돋는 데 능하여, 전투에 임해 함성을 지르면 삼군이 한꺼번에 떨쳐 일어납니다."
 trait_WJ_mr_jiangjun_yangwu:0 "양무장군"
 trait_WJ_mr_jiangjun_yangwu_desc:0 "양무라는 칭호는 무위를 떨친다는 뜻입니다. 이 인물은 의기가 드높아 늘 적을 무찔러 이름을 떨칠 생각을 합니다."
 trait_WJ_mr_jiangjun_yaowu:0 "요무장군"
 trait_WJ_mr_jiangjun_yaowu_desc:0 "요무라는 칭호는 무위를 과시한다는 뜻입니다. 이 인물은 군사를 늘어세우고 진을 치기를 좋아하여, 성대한 군용으로 적을 굴복시킵니다."
 trait_WJ_mr_jiangjun_yijun:0 "익군장군"
 trait_WJ_mr_jiangjun_yijun_desc:0 "익군이라는 칭호는 대군을 보위한다는 뜻입니다. 이 인물은 늘 주장의 좌우를 호위하며, 충성스럽고 부지런하여 믿고 맡길 만합니다."
 trait_WJ_mr_jiangjun_yingyang:0 "응양장군"
 trait_WJ_mr_jiangjun_yingyang_desc:0 "응양이라는 칭호는 매와 송골매가 날아오르는 기세에서 따왔습니다. 이 인물은 눈빛이 날카로우니, 출격할 때는 매가 토끼를 덮치듯 해야 합니다."
 trait_WJ_mr_jiangjun_you:0 "우장군"
 trait_WJ_mr_jiangjun_you_desc:0 "전, 후, 좌, 우 네 장군 중 하나입니다. 우장군은 중군의 오른쪽을 보호하니, 이 인물은 좌익과 서로 기각지세를 이루어 함께 중군을 지켜야 합니다."
 trait_WJ_mr_jiangjun_youji:0 "유격장군"
 trait_WJ_mr_jiangjun_youji_desc:0 "유격이라는 칭호는 유격병을 거느리고 오가며 호응한다는 데서 이름이 붙었습니다. 이 인물은 한곳에 얽매이지 않고 오로지 적의 틈을 엿보아 기습병을 냅니다."
 trait_WJ_mr_jiangjun_yulin:0 "우림장군"
 trait_WJ_mr_jiangjun_yulin_desc:0 "우림이라는 이름은 나라의 날개가 되어 숲처럼 성대하다는 데서 따왔습니다. 이 인물이 이 칭호로 군을 거느리니, 그 군용의 성대함이 금군에 견줄 만합니다."
 trait_WJ_mr_jiangjun_zhechong:0 "절충장군"
 trait_WJ_mr_jiangjun_zhechong_desc:0 "절충이라는 칭호는 적의 돌격을 꺾는다는 뜻입니다. 이 인물은 굳센 적을 무너뜨리고 정예를 깨뜨리는 데 능하여, 적군의 예봉을 단번에 꺾어 놓습니다."
 trait_WJ_mr_jiangjun_zhenbei:0 "진북장군"
 trait_WJ_mr_jiangjun_zhenbei_desc:0 "진북은 사진의 하나로, 한 지방을 진수하는 것을 임무로 합니다. 이 칭호를 짊어진 이 인물은 유주와 병주의 변방을 지켜 봉수가 놀라는 일이 없게 해야 합니다."
 trait_WJ_mr_jiangjun_zhendong:0 "진동장군"
 trait_WJ_mr_jiangjun_zhendong_desc:0 "진동은 사진의 하나로, 한 지방을 진수하는 것을 임무로 합니다. 이 칭호를 짊어진 이 인물은 회수와 사수에 군을 주둔시키고 바다와 태산 사이를 지켜, 동쪽 땅을 예전처럼 평안하게 해야 합니다."
 trait_WJ_mr_jiangjun_zhengbei:0 "정북장군"
 trait_WJ_mr_jiangjun_zhengbei_desc:0 "정북은 사정의 반열에 들어 북쪽 변경의 정벌을 전담하니, 한 방면을 맡는 중임입니다. 이 중요한 칭호를 받은 이 인물은 유주와 병주를 장악하여 호족 기병이 감히 남쪽으로 내려와 말을 먹이지 못하게 해야 합니다."
 trait_WJ_mr_jiangjun_zhengdong:0 "정동장군"
 trait_WJ_mr_jiangjun_zhengdong_desc:0 "정동은 사정의 반열에 들어 동방의 정벌을 전담하니, 한 방면을 맡는 중임입니다. 이 중요한 칭호를 받은 이 인물은 군을 이끌고 동쪽으로 나아가 청주, 서주와 바다, 태산 일대를 모두 호령 아래 두어야 합니다."
 trait_WJ_mr_jiangjun_zhengnan:0 "정남장군"
 trait_WJ_mr_jiangjun_zhengnan_desc:0 "정남은 사정의 반열에 들어 남방의 정벌을 전담하니, 한 방면을 맡는 중임입니다. 이 중요한 칭호를 받은 이 인물은 배를 띄워 장강과 한수를 오가며, 형주, 양주와 백월이 감히 명을 어기지 못하게 해야 합니다."
 trait_WJ_mr_jiangjun_zhenguo:0 "진국장군"
 trait_WJ_mr_jiangjun_zhenguo_desc:0 "진국이라는 칭호는 나라를 진수하여 지킨다는 뜻입니다. 이 칭호를 짊어진 이 인물은 사직의 안위를 한 몸에 지고 있으며, 그 위망은 한 지방을 진압하고 복종시키기에 충분합니다."
 trait_WJ_mr_jiangjun_zhengxi:0 "정서장군"
 trait_WJ_mr_jiangjun_zhengxi_desc:0 "정서는 사정의 반열에 들어 서쪽 변경의 정벌을 전담하니, 한 방면을 맡는 중임입니다. 이 중요한 칭호를 받은 이 인물은 서쪽으로 관중과 농우를 나서서, 강족과 저족이 그 이름만 듣고도 두려워하게 해야 합니다."
 trait_WJ_mr_jiangjun_zhenjun:0 "진군장군"
 trait_WJ_mr_jiangjun_zhenjun_desc:0 "진군이라는 칭호는 육군을 진무한다는 뜻입니다. 이 중요한 칭호에 있는 이 인물은 신중하고 침착하여 여러 군대가 의지하는 바가 되어야 합니다."
 trait_WJ_mr_jiangjun_zhennan:0 "진남장군"
 trait_WJ_mr_jiangjun_zhennan_desc:0 "진남은 사진의 하나로, 한 지방을 진수하는 것을 임무로 합니다. 이 칭호를 짊어진 이 인물은 장강과 한수의 험지를 차지하여 조정을 위해 형주와 양주를 막아 지켜야 합니다."
 trait_WJ_mr_jiangjun_zhenwei:0 "진위장군"
 trait_WJ_mr_jiangjun_zhenwei_desc:0 "진위라는 칭호는 군의 위세를 떨쳐 일으킨다는 뜻입니다. 이 인물이 군중에 이를 때마다 사기가 새로워져야 합니다."
 trait_WJ_mr_jiangjun_zhenwu:0 "진무장군"
 trait_WJ_mr_jiangjun_zhenwu_desc:0 "진무라는 칭호는 무비를 진흥한다는 뜻입니다. 이 인물은 군을 정비하고 무비를 닦는 것을 자기 소임으로 삼으니, 거느린 부대의 호령이 엄정합니다."
 trait_WJ_mr_jiangjun_zhenxi:0 "진서장군"
 trait_WJ_mr_jiangjun_zhenxi_desc:0 "진서는 사진의 하나로, 한 지방을 진수하는 것을 임무로 합니다. 이 칭호를 짊어진 이 인물은 관중과 농우의 요충지를 틀어쥐어, 하서의 여러 강족이 감히 엿보지 못하게 해야 합니다."
 trait_WJ_mr_jiangjun_zuo:0 "좌장군"
 trait_WJ_mr_jiangjun_zuo_desc:0 "전, 후, 좌, 우 네 장군 중 하나입니다. 좌장군은 중군의 왼쪽을 보호하니, 이 인물은 주장의 팔다리가 되어 나아가고 물러남에 서로 도와야 합니다."
 trait_WJ_mr_xiaowei_anbei:0 "안북교위"
 trait_WJ_mr_xiaowei_anbei_desc:0 "안북을 칭호로 삼은 교위입니다. 이 인물은 한 영의 병사를 거느리고 북쪽 변방을 지키며, 밤낮으로 봉수를 살핍니다."
 trait_WJ_mr_xiaowei_anding:0 "안동교위"
 trait_WJ_mr_xiaowei_anding_desc:0 "안동을 칭호로 삼은 교위입니다. 이 인물은 한 영을 거느리고 동쪽 땅의 향리를 지키며 도적을 막습니다."
 trait_WJ_mr_xiaowei_andingyi:0 "정이교위"
 trait_WJ_mr_xiaowei_andingyi_desc:0 "정이교위는 이족의 난을 평정한다는 뜻입니다. 이 인물은 한 영을 거느리고 변경에 주둔하며 여러 이족을 진무합니다."
 trait_WJ_mr_xiaowei_annan:0 "안남교위"
 trait_WJ_mr_xiaowei_annan_desc:0 "안남을 칭호로 삼은 교위입니다. 이 인물은 한 영의 병사를 거느리고 남방에 주둔하며 산월의 출몰에 대비합니다."
 trait_WJ_mr_xiaowei_anxi:0 "안서교위"
 trait_WJ_mr_xiaowei_anxi_desc:0 "안서를 칭호로 삼은 교위입니다. 이 인물은 한 영의 병사를 거느리고 서쪽 변경을 지키며 오가는 상인을 호위합니다."
 trait_WJ_mr_xiaowei_bingbu:0 "보병교위"
 trait_WJ_mr_xiaowei_bingbu_desc:0 "보병교위는 북군 오교의 하나로, 상림원 문의 둔병을 관장합니다. 이 인물은 보병을 다스리는 데 법도가 있어 진열이 가지런합니다."
 trait_WJ_mr_xiaowei_bingwei:0 "병위교위"
 trait_WJ_mr_xiaowei_bingwei_desc:0 "병위교위는 위병을 거느리는 일을 관장합니다. 이 인물은 한 영의 위사를 거느리고 관청의 문호를 지킵니다."
 trait_WJ_mr_xiaowei_canjun:0 "참군교위"
 trait_WJ_mr_xiaowei_canjun_desc:0 "참군교위는 군사에 참모합니다. 이 인물은 늘 주장의 막사에서 계책을 냅니다."
 trait_WJ_mr_xiaowei_ceying:0 "책응교위"
 trait_WJ_mr_xiaowei_ceying_desc:0 "책응교위는 여러 군을 접응하는 일을 관장합니다. 이 인물은 오가며 구원하여 진중의 빈틈을 메웁니다."
 trait_WJ_mr_xiaowei_chengmen:0 "성문교위"
 trait_WJ_mr_xiaowei_chengmen_desc:0 "성문교위는 도성 여러 문의 둔병을 관장하니, 지위와 명망이 꽤 무겁습니다. 이 인물은 성문의 개폐를 맡으니, 경사의 안위가 한 몸에 달려 있습니다."
 trait_WJ_mr_xiaowei_chengwei:0 "성위교위"
 trait_WJ_mr_xiaowei_chengwei_desc:0 "성위교위는 성지를 지키는 일을 관장합니다. 이 인물은 한 영을 거느리고 성에 올라 당직을 서며, 밤마다 딱따기를 칩니다."
 trait_WJ_mr_xiaowei_chijie:0 "지절교위"
 trait_WJ_mr_xiaowei_chijie_desc:0 "지절교위는 절을 받들고 사신으로 나갑니다. 이 인물은 부절을 손에 쥐고 사방을 분주히 다니며 조정의 명을 전합니다."
 trait_WJ_mr_xiaowei_dangkou:0 "탕구교위"
 trait_WJ_mr_xiaowei_dangkou_desc:0 "탕구를 칭호로 삼은 교위입니다. 이 인물은 시골 들판을 누비며 도적을 토벌하고 붙잡습니다."
 trait_WJ_mr_xiaowei_dianhou:0 "전후교위"
 trait_WJ_mr_xiaowei_dianhou_desc:0 "전후교위는 대군의 후미를 지키는 일을 관장합니다. 이 인물은 침착하고 굳세어, 군을 물릴 때 홀로 추격병을 막아 냅니다."
 trait_WJ_mr_xiaowei_dianjun:0 "전군교위"
 trait_WJ_mr_xiaowei_dianjun_desc:0 "전군교위는 서원팔교위의 하나로, 금군을 거느리는 일을 관장합니다. 이 인물은 군을 엄명하게 다스리고 호령이 정연합니다."
 trait_WJ_mr_xiaowei_dianjunqi:0 "전군기교위"
 trait_WJ_mr_xiaowei_dianjunqi_desc:0 "전군기교위는 한 영의 갑옷과 병기를 관장합니다. 이 인물은 늘 무기고에서 칼과 갑옷을 점검하고 망가진 것을 손질합니다."
 trait_WJ_mr_xiaowei_dianma:0 "전마교위"
 trait_WJ_mr_xiaowei_dianma_desc:0 "전마교위는 군마의 사육을 관장합니다. 이 인물은 늘 마구간 곁에서 묵으며 군마가 살졌는지 여위었는지 돌봅니다."
 trait_WJ_mr_xiaowei_diannong:0 "전농교위"
 trait_WJ_mr_xiaowei_diannong_desc:0 "전농교위는 한 군 안의 둔전을 관장합니다. 이 인물은 몸소 밭에 나가 둔민의 개간을 독려합니다."
 trait_WJ_mr_xiaowei_dingbei:0 "정북교위"
 trait_WJ_mr_xiaowei_dingbei_desc:0 "정북교위는 북쪽 변경을 평정한다는 뜻입니다. 이 인물은 한 영의 경기병을 이끌고 변방을 침범한 호족 기병을 추격합니다."
 trait_WJ_mr_xiaowei_dingdong:0 "정동교위"
 trait_WJ_mr_xiaowei_dingdong_desc:0 "정동교위는 동쪽 땅을 평정한다는 뜻입니다. 이 인물은 한 영의 병사를 이끌고 바닷가의 도적을 소탕합니다."
 trait_WJ_mr_xiaowei_dingnan:0 "정남교위"
 trait_WJ_mr_xiaowei_dingnan_desc:0 "정남교위는 남방을 평정한다는 뜻입니다. 이 인물은 한 영을 이끌고 산을 넘고 고개를 넘어 난을 일으킨 만족 부락을 추격해 토벌합니다."
 trait_WJ_mr_xiaowei_dingnan_variant_2:0 "정난교위"
 trait_WJ_mr_xiaowei_dingnan_variant_2_desc:0 "정난을 칭호로 삼은 교위입니다. 이 인물은 어지러운 땅 사이를 분주히 다니며 급한 일을 구하고 위기를 풉니다."
 trait_WJ_mr_xiaowei_dingxi:0 "정서교위"
 trait_WJ_mr_xiaowei_dingxi_desc:0 "정서교위는 서쪽 변경을 평정한다는 뜻입니다. 이 인물은 한 영의 병사를 이끌고 농상으로 달려가 강족 기병과 맞섭니다."
 trait_WJ_mr_xiaowei_fenwu:0 "분무교위"
 trait_WJ_mr_xiaowei_fenwu_desc:0 "분무를 칭호로 삼은 교위입니다. 이 인물은 처음 한 영을 거느리게 되어, 전공으로 자신을 드러내기를 간절히 바랍니다."
 trait_WJ_mr_xiaowei_fubei:0 "무북교위"
 trait_WJ_mr_xiaowei_fubei_desc:0 "무북교위는 북쪽 변경을 회유한다는 뜻입니다. 이 인물은 변방 밖의 호족 부락과 왕래하며 이해득실로 설득합니다."
 trait_WJ_mr_xiaowei_fudong:0 "무동교위"
 trait_WJ_mr_xiaowei_fudong_desc:0 "무동교위는 동쪽 땅을 회유한다는 뜻입니다. 이 인물은 한 영을 거느리고 향리에 주둔하며 마을 어른들과 사이좋게 지냅니다."
 trait_WJ_mr_xiaowei_fuguo:0 "보국교위"
 trait_WJ_mr_xiaowei_fuguo_desc:0 "보국교위는 나라를 보좌한다는 뜻입니다. 이 인물은 나랏일에 충성스럽고 부지런하여 차츰 윗사람에게 알려지고 있습니다."
 trait_WJ_mr_xiaowei_funan:0 "무남교위"
 trait_WJ_mr_xiaowei_funan_desc:0 "무남교위는 남방을 회유한다는 뜻입니다. 이 인물은 월족의 말을 배워 산속 부락과 차츰 왕래하고 있습니다."
 trait_WJ_mr_xiaowei_furong:0 "무융교위"
 trait_WJ_mr_xiaowei_furong_desc:0 "무융교위는 서융을 안무한다는 뜻입니다. 이 인물은 은혜와 신의로 강족과 호족을 끌어들입니다."
 trait_WJ_mr_xiaowei_fuxi:0 "무서교위"
 trait_WJ_mr_xiaowei_fuxi_desc:0 "무서교위는 서쪽 변경을 회유한다는 뜻입니다. 이 인물은 여러 부락의 천막 사이를 분주히 다니며 목초지 다툼을 중재합니다."
 trait_WJ_mr_xiaowei_fuyu:0 "무여교위"
 trait_WJ_mr_xiaowei_fuyu_desc:0 "무여교위는 승여를 붙들고 거가를 호위하는 일을 관장합니다. 이 인물은 늘 어가 곁을 따르며 조심스럽고 신중합니다."
 trait_WJ_mr_xiaowei_fuyuan:0 "무원교위"
 trait_WJ_mr_xiaowei_fuyuan_desc:0 "무원교위는 먼 곳을 안무한다는 뜻입니다. 이 인물은 한 영을 거느리고 변경 군에 주둔하며, 멀리서 온 호족 상인과 사신을 접대합니다."
 trait_WJ_mr_xiaowei_guanjun:0 "관군교위"
 trait_WJ_mr_xiaowei_guanjun_desc:0 "관군을 칭호로 삼은 교위입니다. 이 인물은 나이가 젊고 용맹하며 날카로워, 이름을 떨치는 데 뜻을 둡니다."
 trait_WJ_mr_xiaowei_guanwei:0 "관위교위"
 trait_WJ_mr_xiaowei_guanwei_desc:0 "관위교위는 한 영을 거느리고 관문을 지킵니다. 이 인물은 밤낮으로 통행증을 검사하여 간사한 자의 출입을 허락하지 않습니다."
 trait_WJ_mr_xiaowei_huaiyuan:0 "회원교위"
 trait_WJ_mr_xiaowei_huaiyuan_desc:0 "회원교위는 먼 곳 사람들을 회유한다는 뜻입니다. 이 인물은 변경을 지키며 예로써 먼 곳의 부족을 불러 어루만집니다."
 trait_WJ_mr_xiaowei_huben:0 "호분교위"
 trait_WJ_mr_xiaowei_huben_desc:0 "호분교위는 한 영의 호분 용사를 거느립니다. 이 인물은 범처럼 용맹하여 분주히 좌우를 호위합니다."
 trait_WJ_mr_xiaowei_hudi:0 "호적교위"
 trait_WJ_mr_xiaowei_hudi_desc:0 "호적교위는 북방의 적족 부락을 감독하고 보호합니다. 이 인물은 늘 변방 위에 머물며 여러 부락의 분쟁을 조정합니다."
 trait_WJ_mr_xiaowei_hujie:0 "호절교위"
 trait_WJ_mr_xiaowei_hujie_desc:0 "호절교위는 호부를 신표로 삼아 군대를 동원하는 일을 관장합니다. 이 인물은 부절을 삼가 지키며 감히 가볍게 움직이지 않습니다."
 trait_WJ_mr_xiaowei_hujun:0 "호군교위"
 trait_WJ_mr_xiaowei_hujun_desc:0 "호군교위는 한 영을 감독하고 보호하는 일을 관장합니다. 이 인물은 군기를 감찰하고 명령을 어긴 자를 규탄합니다."
 trait_WJ_mr_xiaowei_human:0 "호만교위"
 trait_WJ_mr_xiaowei_human_desc:0 "호만교위는 남방의 여러 만족을 감독하고 보호합니다. 이 인물은 한 영을 거느리고 만족 땅의 가장자리에 주둔하며 그들의 향배를 살핍니다."
 trait_WJ_mr_xiaowei_huqi:0 "호기교위"
 trait_WJ_mr_xiaowei_huqi_desc:0 "호기교위는 귀부한 호족 기병 한 영을 거느립니다. 이 인물은 호족 병사들과 같이 먹고 같이 자며 그들의 마음을 깊이 얻었습니다."
 trait_WJ_mr_xiaowei_huqiang:0 "호강교위"
 trait_WJ_mr_xiaowei_huqiang_desc:0 "호강교위는 서방의 여러 강족을 감독하고 보호하니, 예로부터 양주의 요직이었습니다. 이 인물은 황중에 주재하며, 강족 부락의 크고 작은 일을 모두 살펴야 합니다."
 trait_WJ_mr_xiaowei_hurong:0 "호융교위"
 trait_WJ_mr_xiaowei_hurong_desc:0 "호융교위는 서방의 여러 융족을 감독하고 보호합니다. 이 인물은 농우를 오가며 여러 부락을 기미합니다."
 trait_WJ_mr_xiaowei_huwu:0 "호오환교위"
 trait_WJ_mr_xiaowei_huwu_desc:0 "호오환교위는 유주 변방 밖의 오환을 감독하고 보호하며, 호시를 주관하고 여러 부락을 중재합니다. 이 인물은 호족의 사정을 잘 알아 나아가고 물러남이 마땅해야 합니다."
 trait_WJ_mr_xiaowei_huxiongnu:0 "호흉노교위"
 trait_WJ_mr_xiaowei_huxiongnu_desc:0 "호흉노교위는 귀부한 흉노 여러 부락을 감독하고 보호합니다. 이 인물은 한 영을 거느리고 부락 근처에 주둔하며 변란에 대비합니다."
 trait_WJ_mr_xiaowei_huyi:0 "호이교위"
 trait_WJ_mr_xiaowei_huyi_desc:0 "호이교위는 서남의 여러 이족을 감독하고 보호합니다. 이 인물은 늘 조정의 하사품을 가지고 이족 땅에 들어가 여러 이족 수령과 친교를 맺습니다."
 trait_WJ_mr_xiaowei_jianjun:0 "감군교위"
 trait_WJ_mr_xiaowei_jianjun_desc:0 "감군교위는 명을 받아 한 군을 감찰합니다. 이 인물은 군을 따라 다니며, 보고 들은 것을 모두 위에 보고해야 합니다."
 trait_WJ_mr_xiaowei_jianning:0 "건녕교위"
 trait_WJ_mr_xiaowei_jianning_desc:0 "건녕교위는 안녕을 세운다는 뜻입니다. 이 인물은 남중을 지키며 경계를 보전하고 백성을 편안히 합니다."
 trait_WJ_mr_xiaowei_jianwei:0 "건위교위"
 trait_WJ_mr_xiaowei_jianwei_desc:0 "건위를 칭호로 삼은 교위입니다. 이 인물은 부지런히 군사를 훈련하며 공을 세우기를 갈망합니다."
 trait_WJ_mr_xiaowei_jianzhong:0 "건충교위"
 trait_WJ_mr_xiaowei_jianzhong_desc:0 "건충을 칭호로 삼은 교위입니다. 이 인물은 윗사람을 공손하고 삼가 섬기며, 두 마음을 품은 적이 없습니다."
 trait_WJ_mr_xiaowei_jieying:0 "접응교위"
 trait_WJ_mr_xiaowei_jieying_desc:0 "접응교위는 전군을 접응하는 일을 관장합니다. 이 인물은 늘 뒤에 병사를 매복시켜 두었다가 패퇴하는 부대를 구원합니다."
 trait_WJ_mr_xiaowei_jingbei:0 "정북교위"
 trait_WJ_mr_xiaowei_jingbei_desc:0 "정북교위는 북쪽 변경을 숙청한다는 뜻입니다. 이 인물은 한 영을 이끌고 변방 아래를 오가며 떠도는 기병을 잡아 벱니다."
 trait_WJ_mr_xiaowei_jingbian:0 "정변교위"
 trait_WJ_mr_xiaowei_jingbian_desc:0 "정변교위는 변경을 평안하게 한다는 뜻입니다. 이 인물은 한 영을 거느리고 변경의 정자를 지키며, 산천과 도로에 밝습니다."
 trait_WJ_mr_xiaowei_jingdong:0 "정동교위"
 trait_WJ_mr_xiaowei_jingdong_desc:0 "정동교위는 동쪽 땅을 숙청한다는 뜻입니다. 이 인물은 한 영을 이끌고 역도를 지키며 길손을 보호합니다."
 trait_WJ_mr_xiaowei_jinglue:0 "경략교위"
 trait_WJ_mr_xiaowei_jinglue_desc:0 "경략을 칭호로 삼은 교위입니다. 이 인물은 계획에 뛰어나 늘 윗사람에게 계책을 올립니다."
 trait_WJ_mr_xiaowei_jingman:0 "정만교위"
 trait_WJ_mr_xiaowei_jingman_desc:0 "정만교위는 만족의 난을 평정한다는 뜻입니다. 이 인물은 늘 한 영을 이끌고 깊은 계곡과 동굴로 들어가, 토벌과 회유를 함께 씁니다."
 trait_WJ_mr_xiaowei_jingnan:0 "정남교위"
 trait_WJ_mr_xiaowei_jingnan_desc:0 "정남교위는 남쪽 땅을 숙청한다는 뜻입니다. 이 인물은 한 영을 이끌고 나루터를 순찰하며 도적을 잡아들입니다."
 trait_WJ_mr_xiaowei_jingnan_variant_2:0 "정난교위"
 trait_WJ_mr_xiaowei_jingnan_variant_2_desc:0 "정난을 칭호로 삼은 교위입니다. 이 인물은 한 영의 병마를 거느리고 언제든 명을 받아 구원하러 갑니다."
 trait_WJ_mr_xiaowei_jingxi:0 "정서교위"
 trait_WJ_mr_xiaowei_jingxi_desc:0 "정서교위는 서쪽 변경을 숙청한다는 뜻입니다. 이 인물은 한 영을 이끌고 오가는 사절과 군량 수송대를 호송합니다."
 trait_WJ_mr_xiaowei_liadong:0 "요동교위"
 trait_WJ_mr_xiaowei_liadong_desc:0 "요동교위는 요동을 진수한다는 데서 이름이 붙었습니다. 이 인물은 요해의 바닷가에 주둔하며 고구려와 선비에 대비합니다."
 trait_WJ_mr_xiaowei_lide:0 "입덕교위"
 trait_WJ_mr_xiaowei_lide_desc:0 "입덕교위는 덕행을 세운다는 뜻입니다. 이 인물은 품행이 단정하여 몸소 모범을 보입니다."
 trait_WJ_mr_xiaowei_longxiang:0 "용양교위"
 trait_WJ_mr_xiaowei_longxiang_desc:0 "용양을 칭호로 삼은 교위입니다. 이 인물은 소년의 의기로 뜻을 높고 멀리 둡니다."
 trait_WJ_mr_xiaowei_nuqi:0 "노기교위"
 trait_WJ_mr_xiaowei_nuqi_desc:0 "노기교위는 쇠뇌수와 기사를 거느립니다. 이 인물은 말 위에서 활쏘기에 능하며 원거리 전투에 뛰어납니다."
 trait_WJ_mr_xiaowei_pingbei:0 "평북교위"
 trait_WJ_mr_xiaowei_pingbei_desc:0 "평북교위는 북쪽 변경을 평정한다는 뜻입니다. 이 인물은 한 영을 이끌고 변방 아래를 지키며, 언제든 호족 기병을 맞아 칠 준비를 하고 있습니다."
 trait_WJ_mr_xiaowei_pingdong:0 "평동교위"
 trait_WJ_mr_xiaowei_pingdong_desc:0 "평동교위는 동방을 평정한다는 뜻입니다. 이 인물은 한 영을 이끌고 청주와 서주를 전전하며 소규모 반란군을 토벌해 평정합니다."
 trait_WJ_mr_xiaowei_pinghu:0 "평호교위"
 trait_WJ_mr_xiaowei_pinghu_desc:0 "평호교위는 호족의 난을 평정한다는 뜻입니다. 이 인물은 호족 기병의 전법에 밝아, 보병으로 진을 쳐 맞설 수 있습니다."
 trait_WJ_mr_xiaowei_pingnan:0 "평남교위"
 trait_WJ_mr_xiaowei_pingnan_desc:0 "평남교위는 남방을 평정한다는 뜻입니다. 이 인물은 한 영을 이끌고 남쪽을 정벌하여 산채를 깨뜨립니다."
 trait_WJ_mr_xiaowei_pingxi:0 "평서교위"
 trait_WJ_mr_xiaowei_pingxi_desc:0 "평서교위는 서방을 평정한다는 뜻입니다. 이 인물은 한 영을 이끌고 변경 군으로 달려가 배반한 강족을 칩니다."
 trait_WJ_mr_xiaowei_polu:0 "파로교위"
 trait_WJ_mr_xiaowei_polu_desc:0 "파로교위는 적을 깨뜨린다는 뜻입니다. 이 인물은 날래고 싸움에 능하여, 늘 적장을 베고 깃발을 빼앗을 생각을 합니다."
 trait_WJ_mr_xiaowei_saoni:0 "소역교위"
 trait_WJ_mr_xiaowei_saoni_desc:0 "소역을 칭호로 삼은 교위입니다. 이 인물은 한 영을 거느리고 난당을 추격해 소탕하며, 고난과 위험을 피하지 않습니다."
 trait_WJ_mr_xiaowei_shesheng:0 "사성교위"
 trait_WJ_mr_xiaowei_shesheng_desc:0 "사성교위는 북군 오교의 하나로, 사성사를 거느립니다. 이 인물은 활 솜씨가 뛰어나 늘 병사들과 활쏘기를 겨룹니다."
 trait_WJ_mr_xiaowei_shuijun:0 "수군교위"
 trait_WJ_mr_xiaowei_shuijun_desc:0 "수군교위는 한 영의 배와 수졸을 거느립니다. 이 인물은 물에 익숙하여 배를 잘 다룹니다."
 trait_WJ_mr_xiaowei_sima:0 "사마교위"
 trait_WJ_mr_xiaowei_sima_desc:0 "사마교위는 영중의 병마 배치를 관장합니다. 이 인물은 병사를 점고하고 대오를 나누어 배치하니, 사무가 매우 번잡합니다."
 trait_WJ_mr_xiaowei_taolu:0 "토로교위"
 trait_WJ_mr_xiaowei_taolu_desc:0 "토로교위는 적을 토벌한다는 뜻입니다. 이 인물은 나이가 젊고 날카롭게 나아가니, 한 번의 싸움으로 이름을 떨치기를 갈망합니다."
 trait_WJ_mr_xiaowei_taoni:0 "토역교위"
 trait_WJ_mr_xiaowei_taoni_desc:0 "토역교위는 반역자를 토벌한다는 뜻입니다. 이 인물은 한 영을 거느리고 군을 따라 정벌에 나서며, 여러 차례 선봉을 자청합니다."
 trait_WJ_mr_xiaowei_tianlu:0 "진로교위"
 trait_WJ_mr_xiaowei_tianlu_desc:0 "진로교위는 적을 섬멸한다는 뜻입니다. 이 인물은 싸움이 사나워 여지를 남기지 않습니다."
 trait_WJ_mr_xiaowei_tiaobeilu:0 "조북교위"
 trait_WJ_mr_xiaowei_tiaobeilu_desc:0 "조북교위는 북방의 병마를 징발하는 일을 관장합니다. 이 인물은 변경 군을 오가며 병사를 모으고 군량과 꼴을 실어 나릅니다."
 trait_WJ_mr_xiaowei_tiaoman:0 "조만교위"
 trait_WJ_mr_xiaowei_tiaoman_desc:0 "조만교위는 남방의 만족 병사를 조달하는 일을 관장합니다. 이 인물은 만족의 말에 통하여 만족 병사들이 조정을 위해 힘쓰게 할 수 있습니다."
 trait_WJ_mr_xiaowei_tiaonan:0 "조남교위"
 trait_WJ_mr_xiaowei_tiaonan_desc:0 "조남교위는 남방의 병마를 징발하는 일을 관장합니다. 이 인물은 여러 군을 분주히 다니며 병사를 징발하고 군수품을 실어 나릅니다."
 trait_WJ_mr_xiaowei_tunqi:0 "둔기교위"
 trait_WJ_mr_xiaowei_tunqi_desc:0 "둔기교위는 북군 오교의 하나로, 기사를 거느리고 경사를 둔위합니다. 이 인물은 기병을 다루는 데 법도가 있어 부대가 정연합니다."
 trait_WJ_mr_xiaowei_weibei:0 "위북교위"
 trait_WJ_mr_xiaowei_weibei_desc:0 "위북교위는 위세로 북쪽 변경을 떨게 한다는 뜻입니다. 이 인물은 날래고 용감하게 싸우며, 호족 기병이 그 이름만 들어도 꺼리기를 바랍니다."
 trait_WJ_mr_xiaowei_weidong:0 "위동교위"
 trait_WJ_mr_xiaowei_weidong_desc:0 "위동교위는 위세로 동방을 떨게 한다는 뜻입니다. 이 인물은 영을 엄격하게 다스리며, 한 지방의 도적이 자취를 감추기를 바랍니다."
 trait_WJ_mr_xiaowei_weinan:0 "위남교위"
 trait_WJ_mr_xiaowei_weinan_desc:0 "위남교위는 위세로 남방을 떨게 한다는 뜻입니다. 이 인물은 용맹하고 사나움을 자부하며, 강남에 이름을 떨치기를 바랍니다."
 trait_WJ_mr_xiaowei_weishuo:0 "위삭교위"
 trait_WJ_mr_xiaowei_weishuo_desc:0 "위삭교위는 북방을 지킨다는 뜻입니다. 이 인물은 한 영을 거느리고 삭방에 주둔하며, 겨울에도 순찰을 거르지 않습니다."
 trait_WJ_mr_xiaowei_weixi:0 "위서교위"
 trait_WJ_mr_xiaowei_weixi_desc:0 "위서교위는 위세로 서쪽 변경을 떨게 한다는 뜻입니다. 이 인물은 농우를 누비며, 강족이 깃발만 보고도 피하기를 바랍니다."
 trait_WJ_mr_xiaowei_wuling:0 "무릉교위"
 trait_WJ_mr_xiaowei_wuling_desc:0 "무릉교위는 무릉의 산지를 지킨다는 데서 이름이 붙었습니다. 이 인물은 오계만의 사정에 밝아 토벌과 회유를 함께 씁니다."
 trait_WJ_mr_xiaowei_wuwei:0 "무위교위"
 trait_WJ_mr_xiaowei_wuwei_desc:0 "무위를 칭호로 삼은 교위로, 숙위 친병을 관장합니다. 이 인물은 한 영의 친병을 거느리고 숙직하며, 밤에도 갑옷을 벗지 않습니다."
 trait_WJ_mr_xiaowei_wuyi:0 "무의교위"
 trait_WJ_mr_xiaowei_wuyi_desc:0 "무의를 칭호로 삼은 교위입니다. 이 인물은 성정이 굳세어 부러질지언정 굽히지 않습니다."
 trait_WJ_mr_xiaowei_xianfeng:0 "선봉교위"
 trait_WJ_mr_xiaowei_xianfeng_desc:0 "선봉교위는 한 영을 거느리고 앞장섭니다. 이 인물은 싸울 때마다 무리를 이끌고 먼저 성에 오르니, 그 용맹이 한 군에서 으뜸입니다."
 trait_WJ_mr_xiaowei_xiongjie:0 "웅절교위"
 trait_WJ_mr_xiaowei_xiongjie_desc:0 "웅절교위는 곰의 용맹에서 따왔습니다. 이 인물은 체격이 우람하고 완력이 남다릅니다."
 trait_WJ_mr_xiaowei_xiping:0 "서평교위"
 trait_WJ_mr_xiaowei_xiping_desc:0 "서평교위는 서쪽 변경을 평정한다는 뜻입니다. 이 인물은 황하와 황수 사이를 지키며 강족의 난에 대비합니다."
 trait_WJ_mr_xiaowei_xuanfeng:0 "선풍교위"
 trait_WJ_mr_xiaowei_xuanfeng_desc:0 "선풍을 칭호로 삼은 교위입니다. 이 인물은 글을 알고 이치에 밝아, 영을 다스리는 여가에도 예의를 강론합니다."
 trait_WJ_mr_xiaowei_xuanrui:0 "선예교위"
 trait_WJ_mr_xiaowei_xuanrui_desc:0 "선예를 칭호로 삼은 교위입니다. 이 인물은 젊고 혈기가 왕성하여 늘 호언장담으로 부하들을 북돋습니다."
 trait_WJ_mr_xiaowei_xuanwei:0 "선위교위"
 trait_WJ_mr_xiaowei_xuanwei_desc:0 "선위를 칭호로 삼은 교위입니다. 이 인물은 군용을 정돈하기를 좋아하여 깃발이 선명합니다."
 trait_WJ_mr_xiaowei_xuanyi:0 "선의교위"
 trait_WJ_mr_xiaowei_xuanyi_desc:0 "선의를 칭호로 삼은 교위입니다. 이 인물은 충의로써 부하들을 이끕니다."
 trait_WJ_mr_xiaowei_xunwei:0 "순위교위"
 trait_WJ_mr_xiaowei_xunwei_desc:0 "순위교위는 순찰과 경비를 관장합니다. 이 인물은 한 영을 거느리고 거리를 순찰하며 간악한 무리를 잡아들입니다."
 trait_WJ_mr_xiaowei_yangwu:0 "양무교위"
 trait_WJ_mr_xiaowei_yangwu_desc:0 "양무를 칭호로 삼은 교위입니다. 이 인물은 용맹을 좋아하고 앞을 다투어, 훈련 때마다 반드시 으뜸을 차지합니다."
 trait_WJ_mr_xiaowei_yaowei:0 "요위교위"
 trait_WJ_mr_xiaowei_yaowei_desc:0 "요위를 칭호로 삼은 교위입니다. 이 인물은 영을 나서 순행할 때마다 반드시 화려한 옷차림에 날랜 말을 타고 한 영의 위세를 드높입니다."
 trait_WJ_mr_xiaowei_yaowu:0 "요무교위"
 trait_WJ_mr_xiaowei_yaowu_desc:0 "요무를 칭호로 삼은 교위입니다. 이 인물은 갑옷과 병기를 아껴, 한 영의 군용이 꽤 번듯합니다."
 trait_WJ_mr_xiaowei_yifeng:0 "익군교위"
 trait_WJ_mr_xiaowei_yifeng_desc:0 "익군을 칭호로 삼은 교위입니다. 이 인물은 한 영을 거느리고 중군을 따르며 명령을 기다립니다."
 trait_WJ_mr_xiaowei_yingyang:0 "응양교위"
 trait_WJ_mr_xiaowei_yingyang_desc:0 "응양을 칭호로 삼은 교위입니다. 이 인물은 눈이 밝고 손이 빨라, 순식간에 사라지는 전기를 잘 붙잡습니다."
 trait_WJ_mr_xiaowei_yongchang:0 "영창교위"
 trait_WJ_mr_xiaowei_yongchang_desc:0 "영창교위는 영창 변경 군을 진수한다는 데서 이름이 붙었습니다. 이 인물은 서남쪽 끝 변경에서 애뢰의 여러 이족과 섞여 지냅니다."
 trait_WJ_mr_xiaowei_yueqi:0 "월기교위"
 trait_WJ_mr_xiaowei_yueqi_desc:0 "월기교위는 북군 오교의 하나로, 월기를 거느립니다. 이 인물은 늘 직접 날랜 용사를 골라 영에 보충합니다."
 trait_WJ_mr_xiaowei_yulin:0 "우림교위"
 trait_WJ_mr_xiaowei_yulin_desc:0 "우림교위는 한 영의 우림 기사를 거느립니다. 이 인물은 금군 출신으로, 어려서부터 활과 말을 익혔습니다."
 trait_WJ_mr_xiaowei_yuqi:0 "여기교위"
 trait_WJ_mr_xiaowei_yuqi_desc:0 "여기교위는 승여를 호위하는 기사를 관장합니다. 이 인물은 어가를 따라 드나들며 의장이 정연합니다."
 trait_WJ_mr_xiaowei_zhangshi:0 "장사교위"
 trait_WJ_mr_xiaowei_zhangshi_desc:0 "장사교위는 영중의 문서를 관장합니다. 이 인물은 장부와 문적에 정통하여 주장의 근심을 덜어 줍니다."
 trait_WJ_mr_xiaowei_zhangshui:0 "장수교위"
 trait_WJ_mr_xiaowei_zhangshui_desc:0 "장수교위는 북군 오교의 하나로, 장수 호기를 거느립니다. 이 인물은 영중을 드나들며 호족과 한족 병사를 호령하여 저마다 쓰임을 얻게 합니다."
 trait_WJ_mr_xiaowei_zhaowu:0 "소무교위"
 trait_WJ_mr_xiaowei_zhaowu_desc:0 "소무를 칭호로 삼은 교위입니다. 이 인물은 공을 쌓아 승진하여 명성이 차츰 드러나고 있습니다."
 trait_WJ_mr_xiaowei_zhechong:0 "절충교위"
 trait_WJ_mr_xiaowei_zhechong_desc:0 "절충을 칭호로 삼은 교위입니다. 이 인물은 전투에 임해 침착하여, 한 영의 병사가 반석처럼 든든합니다."
 trait_WJ_mr_xiaowei_zhengdi:0 "정적교위"
 trait_WJ_mr_xiaowei_zhengdi_desc:0 "정적교위는 북적 토벌을 전담합니다. 이 인물은 경기병을 이끌고 변방 밖으로 나가 달아나는 적을 북쪽 끝까지 쫓습니다."
 trait_WJ_mr_xiaowei_zhenglu:0 "정로교위"
 trait_WJ_mr_xiaowei_zhenglu_desc:0 "정로교위는 호로 토벌을 전담합니다. 이 인물은 돌격에 용감하여 강적을 두려워하지 않습니다."
 trait_WJ_mr_xiaowei_zhengman:0 "정만교위"
 trait_WJ_mr_xiaowei_zhengman_desc:0 "정만교위는 남만 토벌을 전담합니다. 이 인물은 한 영의 산악병을 거느리며 숲속 전투에 익숙합니다."
 trait_WJ_mr_xiaowei_zhengrong:0 "정융교위"
 trait_WJ_mr_xiaowei_zhengrong_desc:0 "정융교위는 서융 토벌을 전담합니다. 이 인물은 한 영의 기병과 보병을 거느리고 늘 대군을 따라 서쪽을 정벌합니다."
 trait_WJ_mr_xiaowei_zhenguo:0 "진국교위"
 trait_WJ_mr_xiaowei_zhenguo_desc:0 "진국교위는 나라를 진수하여 지킨다는 뜻입니다. 이 인물은 비록 지위는 낮으나 나라를 지키는 일을 늘 마음에 둡니다."
 trait_WJ_mr_xiaowei_zhengyi:0 "정이교위"
 trait_WJ_mr_xiaowei_zhengyi_desc:0 "정이교위는 동이 토벌을 전담합니다. 이 인물은 동방의 산과 바다, 도로에 밝아 늘 대군의 길잡이가 됩니다."
 trait_WJ_mr_xiaowei_zhenshuo:0 "진삭교위"
 trait_WJ_mr_xiaowei_zhenshuo_desc:0 "진삭교위는 북방을 진수한다는 뜻입니다. 이 인물은 한 영을 거느리고 변방 아래에 주둔하며, 굳게 지키는 것을 근본으로 삼습니다."
 trait_WJ_mr_xiaowei_zhenwei:0 "진위교위"
 trait_WJ_mr_xiaowei_zhenwei_desc:0 "진위를 칭호로 삼은 교위입니다. 이 인물은 지친 군대의 사기를 다시 떨쳐 일으킬 수 있습니다."
 trait_WJ_mr_xiaowei_zhenwu:0 "진무교위"
 trait_WJ_mr_xiaowei_zhenwu_desc:0 "진무를 칭호로 삼은 교위입니다. 이 인물은 처음 한 영을 맡아 매일 몸소 병사들에게 찌르고 베는 법을 가르칩니다."
 trait_WJ_mr_xiaowei_zhonglei:0 "중루교위"
 trait_WJ_mr_xiaowei_zhonglei_desc:0 "중루교위는 북군 영루의 일을 관장합니다. 이 인물은 밤낮으로 문의 출입을 감독하니, 영중을 드나드는 자는 모두 검사를 받아야 합니다."
 trait_WJ_mr_zhonglang_anbei:0 "안북중랑장"
 trait_WJ_mr_zhonglang_anbei_desc:0 "안북중랑장은 북쪽 변경의 안정을 바라는 칭호입니다. 이 인물은 한 부대를 거느리고 변방 아래에 주둔하며, 정자와 보루를 손보는 일에 힘써야 합니다."
 trait_WJ_mr_zhonglang_anding:0 "안동중랑장"
 trait_WJ_mr_zhonglang_anding_desc:0 "안동중랑장은 동쪽 땅을 안정시켜 화목하게 하기를 바라는 칭호입니다. 이 인물은 한 부대를 거느리고 바닷가에 주둔하며, 경계를 지키고 백성을 편안히 하는 일에 힘써야 합니다."
 trait_WJ_mr_zhonglang_annan:0 "안남중랑장"
 trait_WJ_mr_zhonglang_annan_desc:0 "안남중랑장은 남방을 평온하게 하기를 바라는 칭호입니다. 이 인물은 한 부대를 거느리고 강가에 주둔하며, 강을 따라 있는 군현을 안정시키는 일에 힘써야 합니다."
 trait_WJ_mr_zhonglang_anxi:0 "안서중랑장"
 trait_WJ_mr_zhonglang_anxi_desc:0 "안서중랑장은 서쪽 변경의 안정을 바라는 칭호입니다. 이 인물은 한 부대를 거느리고 하서에 주둔하며, 여러 군을 안정시켜 화목하게 하는 일에 힘써야 합니다."
 trait_WJ_mr_zhonglang_anyi:0 "안이중랑장"
 trait_WJ_mr_zhonglang_anyi_desc:0 "안이라는 칭호는 이적을 안무한다는 뜻입니다. 이 인물은 늘 변방의 여러 종족과 교섭하니, 기미의 도에 깊이 통달해야 합니다."
 trait_WJ_mr_zhonglang_bei:0 "북중랑장"
 trait_WJ_mr_zhonglang_bei_desc:0 "사방 중랑장의 하나로, 명을 받아 북방 정벌을 전담합니다. 이 인물은 비록 지위가 장군에 미치지 못하나, 홀로 한 방면을 맡아 군을 거느리고 도적을 토벌해야 합니다."
 trait_WJ_mr_zhonglang_bingwei:0 "병위중랑장"
 trait_WJ_mr_zhonglang_bingwei_desc:0 "병위중랑장은 위병을 거느리는 일을 관장합니다. 이 인물이 거느린 부대는 정예하고 질서 있어 한 지방의 안녕을 지켜야 합니다."
 trait_WJ_mr_zhonglang_caiguan:0 "재관중랑장"
 trait_WJ_mr_zhonglang_caiguan_desc:0 "재관중랑장은 한 부대의 재관 장사를 거느립니다. 이 인물은 완력이 남달라 강한 쇠뇌를 당길 수 있습니다."
 trait_WJ_mr_zhonglang_changshui:0 "장수중랑장"
 trait_WJ_mr_zhonglang_changshui_desc:0 "장수라는 이름은 장수 호기에서 유래했습니다. 이 인물은 한 부대의 정예 기병을 거느리니, 말 타고 활 쏘는 솜씨가 여러 군 가운데 으뜸이어야 합니다."
 trait_WJ_mr_zhonglang_chengmen:0 "성문중랑장"
 trait_WJ_mr_zhonglang_chengmen_desc:0 "성문중랑장은 성문의 둔병을 거느립니다. 이 인물은 밤낮으로 여러 문을 순찰하며 출입하는 자를 검문하고, 감히 게을리하지 않습니다."
 trait_WJ_mr_zhonglang_chengwei:0 "성위중랑장"
 trait_WJ_mr_zhonglang_chengwei_desc:0 "성위중랑장은 성지를 지키는 일을 관장합니다. 이 인물은 성의 방비를 손보고 수비병을 정비하여 성벽을 금성탕지처럼 굳건히 해야 합니다."
 trait_WJ_mr_zhonglang_chijie:0 "지절중랑장"
 trait_WJ_mr_zhonglang_chijie_desc:0 "지절중랑장은 절을 받들고 다니며 조정을 대신해 위엄과 명령을 펼칩니다. 이 인물의 절모가 이르는 곳마다 주군이 모두 받들어 맞이해야 합니다."
 trait_WJ_mr_zhonglang_dianjun:0 "전군중랑장"
 trait_WJ_mr_zhonglang_dianjun_desc:0 "전군중랑장은 군무를 관장합니다. 이 인물은 한 부대의 장부와 대오를 총괄하니, 크고 작은 일을 모두 훤히 꿰고 있어야 합니다."
 trait_WJ_mr_zhonglang_dianjunqi:0 "전군기중랑장"
 trait_WJ_mr_zhonglang_dianjunqi_desc:0 "전군기중랑장은 갑옷과 병기를 관장합니다. 이 인물은 칼, 갑옷, 활, 쇠뇌의 제작을 감독하여 군중의 병기가 정교하고 날카롭도록 힘씁니다."
 trait_WJ_mr_zhonglang_dianma:0 "전마중랑장"
 trait_WJ_mr_zhonglang_dianma_desc:0 "전마중랑장은 군마의 사육과 배치를 관장합니다. 이 인물은 말을 잘 감별하여 마정이 질서 정연하게 해야 합니다."
 trait_WJ_mr_zhonglang_diannong:0 "전농중랑장"
 trait_WJ_mr_zhonglang_diannong_desc:0 "전농중랑장은 둔전과 곡식 비축을 관장합니다. 이 인물은 둔민을 거느려 농사와 싸움을 함께 하게 하며, 대군을 위해 군량과 꼴을 비축합니다."
 trait_WJ_mr_zhonglang_dingyuan:0 "정원중랑장"
 trait_WJ_mr_zhonglang_dingyuan_desc:0 "정원이라는 칭호는 반초가 붓을 던지고 종군하여 먼 이역에서 공을 세운 옛일을 떠올리게 합니다. 이 인물 또한 만 리의 뜻을 품어야 합니다."
 trait_WJ_mr_zhonglang_dong:0 "동중랑장"
 trait_WJ_mr_zhonglang_dong_desc:0 "동, 남, 서, 북 네 중랑장은 각각 명을 받아 한 방면의 정벌을 전담합니다. 동중랑장은 지위가 장군에 미치지 못하지만, 이 인물은 홀로 한 군을 거느리고 청주와 서주 사이를 전전할 수 있습니다."
 trait_WJ_mr_zhonglang_fengche:0 "봉거중랑장"
 trait_WJ_mr_zhonglang_fengche_desc:0 "봉거중랑장은 승여와 거가를 모는 일을 관장합니다. 이 인물은 드나들며 곁에서 모시니, 가까이 믿는 신하가 아니면 이 자리에 앉을 수 없습니다."
 trait_WJ_mr_zhonglang_fenwei:0 "분위중랑장"
 trait_WJ_mr_zhonglang_fenwei_desc:0 "분위를 칭호로 삼은 중랑장입니다. 이 인물은 한 부대의 정예 병사를 거느리니, 예리하게 진취하여 적 앞에서 겁내지 않아야 합니다."
 trait_WJ_mr_zhonglang_fenwu:0 "분무중랑장"
 trait_WJ_mr_zhonglang_fenwu_desc:0 "분무를 칭호로 삼은 중랑장입니다. 이 인물은 한 부대의 용감한 병사를 거느리며, 늘 출전을 자청합니다."
 trait_WJ_mr_zhonglang_fubei:0 "무북중랑장"
 trait_WJ_mr_zhonglang_fubei_desc:0 "무북중랑장은 북쪽 변경을 회유하는 것을 임무로 합니다. 이 인물은 늘 변방 아래에서 호족 사신을 맞이하고 보내며 예로써 대합니다."
 trait_WJ_mr_zhonglang_fubo:0 "복파중랑장"
 trait_WJ_mr_zhonglang_fubo_desc:0 "복파중랑장은 한 부대의 수군을 거느립니다. 이 인물은 강과 하천 위에 출몰하며, 복파라는 이름처럼 풍랑을 평정하기를 바랍니다."
 trait_WJ_mr_zhonglang_fudong:0 "무동중랑장"
 trait_WJ_mr_zhonglang_fudong_desc:0 "무동중랑장은 동쪽 땅을 회유하는 것을 임무로 합니다. 이 인물은 농사와 양잠을 권장하고 흩어진 백성을 불러들입니다."
 trait_WJ_mr_zhonglang_fujun:0 "무군중랑장"
 trait_WJ_mr_zhonglang_fujun_desc:0 "무군이라는 칭호는 병사들을 어루만진다는 뜻입니다. 이 인물은 부하들을 아끼니, 병사들이 기꺼이 그를 위해 힘써야 합니다."
 trait_WJ_mr_zhonglang_funan:0 "무남중랑장"
 trait_WJ_mr_zhonglang_funan_desc:0 "무남중랑장은 남쪽 땅을 회유하는 것을 임무로 합니다. 이 인물은 늘 사신을 산으로 보내 소금과 베를 선사하며 만이를 불러 어루만집니다."
 trait_WJ_mr_zhonglang_fuxi:0 "무서중랑장"
 trait_WJ_mr_zhonglang_fuxi_desc:0 "무서중랑장은 서쪽 변경을 회유하는 것을 임무로 합니다. 이 인물은 늘 강족과 저족의 추장들과 회맹하고 연회를 열어 은의로 결속합니다."
 trait_WJ_mr_zhonglang_guanjun:0 "관군중랑장"
 trait_WJ_mr_zhonglang_guanjun_desc:0 "관군을 칭호로 삼은 중랑장입니다. 이 인물은 무예가 출중하여, 늘 한 번의 싸움으로 이름을 떨치기를 바랍니다."
 trait_WJ_mr_zhonglang_guanwei:0 "관위중랑장"
 trait_WJ_mr_zhonglang_guanwei_desc:0 "관위중랑장은 관문과 요새를 지키는 일을 관장합니다. 이 인물은 요충지를 틀어쥐고 오가는 이를 검문하니, 한 사람이 관문을 막으면 만 명도 열지 못하는 기개가 있어야 합니다."
 trait_WJ_mr_zhonglang_huaihua:0 "회화중랑장"
 trait_WJ_mr_zhonglang_huaihua_desc:0 "회화라는 칭호는 회유하여 귀화시킨다는 뜻입니다. 이 인물은 귀부한 변방 종족과 자주 왕래하니, 은의로 그 마음을 거두어야 합니다."
 trait_WJ_mr_zhonglang_huben:0 "호분중랑장"
 trait_WJ_mr_zhonglang_huben_desc:0 "호분이란 용사가 사나운 범처럼 내달린다는 뜻입니다. 이 인물은 호분 숙위를 거느리고 군주 곁을 모시니, 충성과 용맹으로 이름나야 합니다."
 trait_WJ_mr_zhonglang_hujun:0 "호군중랑장"
 trait_WJ_mr_zhonglang_hujun_desc:0 "호군중랑장은 군을 따라 여러 장수를 감독하고 보호합니다. 이 인물은 여러 부대의 진퇴를 조율하고 군중의 인사를 함께 처리합니다."
 trait_WJ_mr_zhonglang_human:0 "호만중랑장"
 trait_WJ_mr_zhonglang_human_desc:0 "호만중랑장은 남방의 여러 만족을 감독하고 보호합니다. 이 인물은 형남의 계곡과 동굴 사이를 오가며, 교화를 따르는 자는 어루만지고 배반하는 자는 토벌합니다."
 trait_WJ_mr_zhonglang_huqi:0 "호기중랑장"
 trait_WJ_mr_zhonglang_huqi_desc:0 "호기중랑장은 귀부한 호인 기사를 거느립니다. 이 인물은 호족의 풍속에 통하니, 은혜와 위엄으로 호족 기병을 다룰 수 있어야 합니다."
 trait_WJ_mr_zhonglang_huqiang:0 "호강중랑장"
 trait_WJ_mr_zhonglang_huqiang_desc:0 "호강중랑장은 서방의 여러 강족을 감독하고 보호합니다. 이 인물은 강족 부락과 종족 사이의 은원을 잘 알아, 갈라놓고 회유하며 받아들이는 일을 저마다 마땅하게 해야 합니다."
 trait_WJ_mr_zhonglang_huwei:0 "호위중랑장"
 trait_WJ_mr_zhonglang_huwei_desc:0 "호위를 칭호로 삼은 중랑장입니다. 이 인물은 용맹하고 굳세니, 전투에 임하면 적의 간담을 서늘하게 해야 합니다."
 trait_WJ_mr_zhonglang_huwuhuan:0 "호오환중랑장"
 trait_WJ_mr_zhonglang_huwuhuan_desc:0 "호오환중랑장은 유주 변방 밖의 오환 여러 부락을 감독하고 보호합니다. 이 인물은 장성 안팎을 오가며 은혜와 위엄으로 호족 기병을 기미합니다."
 trait_WJ_mr_zhonglang_huxiongnu:0 "호흉노중랑장"
 trait_WJ_mr_zhonglang_huxiongnu_desc:0 "호흉노중랑장은 귀부한 흉노 여러 부락을 감독하고 보호합니다. 이 인물은 병주에 주재하며 선우와 교섭하고 그 동정을 감시합니다."
 trait_WJ_mr_zhonglang_huyi:0 "호이중랑장"
 trait_WJ_mr_zhonglang_huyi_desc:0 "호이중랑장은 서남의 여러 이족을 감독하고 보호합니다. 이 인물은 남중의 산천을 드나들며 은혜와 신의로 이족 수령들을 끌어들입니다."
 trait_WJ_mr_zhonglang_jianjun:0 "감군중랑장"
 trait_WJ_mr_zhonglang_jianjun_desc:0 "감군중랑장은 명을 받아 여러 군을 감독하고 보호합니다. 이 인물은 여러 장수의 공과를 살피며 조정의 귀와 눈이 됩니다."
 trait_WJ_mr_zhonglang_jianwu:0 "건무중랑장"
 trait_WJ_mr_zhonglang_jianwu_desc:0 "건무를 칭호로 삼은 중랑장입니다. 이 인물은 밤낮으로 뛰어난 공훈을 세울 생각을 하며 한 걸음 더 나아가기를 꾀합니다."
 trait_WJ_mr_zhonglang_jingbei:0 "정북중랑장"
 trait_WJ_mr_zhonglang_jingbei_desc:0 "정북중랑장은 북쪽 변경을 숙청하기를 바라는 칭호입니다. 이 인물은 한 부대를 거느리고 변방을 순찰하며 도적을 쫓아, 변경의 봉화가 드물게 오르게 합니다."
 trait_WJ_mr_zhonglang_jingdong:0 "정동중랑장"
 trait_WJ_mr_zhonglang_jingdong_desc:0 "정동중랑장은 동쪽 땅을 숙청하기를 바라는 칭호입니다. 이 인물은 한 부대를 거느리고 해적과 산적을 수색해 잡아, 길이 다시 통하게 합니다."
 trait_WJ_mr_zhonglang_jingnan:0 "정남중랑장"
 trait_WJ_mr_zhonglang_jingnan_desc:0 "정남중랑장은 남쪽 땅을 숙청하기를 바라는 칭호입니다. 이 인물은 한 부대를 거느리고 강호를 오가며 수적을 소탕합니다."
 trait_WJ_mr_zhonglang_jingnan_variant_2:0 "정난중랑장"
 trait_WJ_mr_zhonglang_jingnan_variant_2_desc:0 "정난을 칭호로 삼은 중랑장입니다. 이 인물은 변란이 일어날 때마다 본부를 이끌고 급히 달려가 구원합니다."
 trait_WJ_mr_zhonglang_jingxi:0 "정서중랑장"
 trait_WJ_mr_zhonglang_jingxi_desc:0 "정서중랑장은 서쪽 변경을 숙청하기를 바라는 칭호입니다. 이 인물은 한 부대를 거느리고 농판에 주둔하며, 노략질하는 강족과 호족을 진압합니다."
 trait_WJ_mr_zhonglang_lingjun:0 "영군중랑장"
 trait_WJ_mr_zhonglang_lingjun_desc:0 "영군중랑장은 한 부대의 금군을 거느립니다. 이 인물은 대오를 정비하고 군을 엄명하게 다스립니다."
 trait_WJ_mr_zhonglang_longxiang:0 "용양중랑장"
 trait_WJ_mr_zhonglang_longxiang_desc:0 "용양을 칭호로 삼은 중랑장입니다. 이 인물은 의기가 드높아 오래도록 남의 아래에 있기를 달가워하지 않습니다."
 trait_WJ_mr_zhonglang_louchuan:0 "누선중랑장"
 trait_WJ_mr_zhonglang_louchuan_desc:0 "누선중랑장은 한 부대의 전선과 수군을 거느립니다. 이 인물은 오랫동안 배 위에 있어 풍랑 속에서도 침착하게 지휘할 수 있습니다."
 trait_WJ_mr_zhonglang_nan:0 "남중랑장"
 trait_WJ_mr_zhonglang_nan_desc:0 "사방 중랑장의 하나로, 명을 받아 남방 정벌을 전담합니다. 이 인물은 군을 이끌고 남하하여 강호와 산택에 출몰하며 복종하지 않는 자를 토벌해야 합니다."
 trait_WJ_mr_zhonglang_pinglu:0 "평로중랑장"
 trait_WJ_mr_zhonglang_pinglu_desc:0 "평로라는 칭호는 호로를 평정한다는 뜻입니다. 이 인물은 늘 호족 기병과 맞붙어 그 허실을 깊이 압니다."
 trait_WJ_mr_zhonglang_qingche:0 "경거중랑장"
 trait_WJ_mr_zhonglang_qingche_desc:0 "경거중랑장은 한 부대의 경거와 정예 병사를 거느립니다. 이 인물은 급습에 능하여 늘 적의 허를 찌릅니다."
 trait_WJ_mr_zhonglang_shesheng:0 "사성중랑장"
 trait_WJ_mr_zhonglang_shesheng_desc:0 "사성이란 소리만 듣고도 쏘아 맞힌다는 뜻입니다. 이 인물은 활 잘 쏘는 병사들을 거느리니, 어두운 밤에도 헛되이 쏘는 화살이 없어야 합니다."
 trait_WJ_mr_zhonglang_sima:0 "사마중랑장"
 trait_WJ_mr_zhonglang_sima_desc:0 "사마중랑장은 군중의 상벌과 병마 배치를 관장합니다. 이 인물은 법을 집행함에 아부하지 않아 군기를 엄숙하게 해야 합니다."
 trait_WJ_mr_zhonglang_taoni:0 "토역중랑장"
 trait_WJ_mr_zhonglang_taoni_desc:0 "토역이라는 칭호는 반역자를 토벌한다는 뜻입니다. 이 인물은 신하 노릇을 하지 않는 자를 주살하는 것을 자기 소임으로 삼으니, 그 예봉이 고스란히 드러납니다."
 trait_WJ_mr_zhonglang_tianjin:0 "도진중랑장"
 trait_WJ_mr_zhonglang_tianjin_desc:0 "도진중랑장은 나루와 다리를 지키는 일을 관장합니다. 이 인물은 강나루를 틀어쥐고 있어, 오가는 배가 모두 그의 손바닥 안에 있습니다."
 trait_WJ_mr_zhonglang_tunqi:0 "둔기중랑장"
 trait_WJ_mr_zhonglang_tunqi_desc:0 "둔기중랑장은 한 부대의 주둔 기사를 거느립니다. 이 인물은 기마전에 뛰어나 진퇴가 신속합니다."
 trait_WJ_mr_zhonglang_wuguan:0 "오관중랑장"
 trait_WJ_mr_zhonglang_wuguan_desc:0 "오관중랑장은 오관 낭서를 거느리니, 예로부터 청귀한 자리였습니다. 이 직책에 있는 이 인물은 나아가고 물러남이 모두 조야의 주목을 받습니다."
 trait_WJ_mr_zhonglang_wuwei:0 "무위중랑장"
 trait_WJ_mr_zhonglang_wuwei_desc:0 "무위중랑장은 친위 병사를 거느리고 주상의 좌우를 숙위합니다. 이 인물은 용맹하고 충성스러우며 신중하여 깊은 신임을 받습니다."
 trait_WJ_mr_zhonglang_xi:0 "서중랑장"
 trait_WJ_mr_zhonglang_xi_desc:0 "사방 중랑장의 하나로, 명을 받아 서방 정벌을 전담합니다. 이 인물은 군을 거느리고 서쪽으로 향하여 관중과 농우에서 강족, 호족과 맞서야 합니다."
 trait_WJ_mr_zhonglang_xiaoqi:0 "효기중랑장"
 trait_WJ_mr_zhonglang_xiaoqi_desc:0 "효기중랑장은 한 부대의 날랜 기사를 거느립니다. 이 인물은 활과 말에 능숙하여 싸울 때마다 앞장서 돌격합니다."
 trait_WJ_mr_zhonglang_xunwei:0 "순위중랑장"
 trait_WJ_mr_zhonglang_xunwei_desc:0 "순위중랑장은 순찰과 경비를 관장합니다. 이 인물은 오가며 순시하여 좀도둑 무리가 감히 난을 일으키지 못하게 합니다."
 trait_WJ_mr_zhonglang_yangwei:0 "양위중랑장"
 trait_WJ_mr_zhonglang_yangwei_desc:0 "양위라는 칭호는 군의 위세를 떨친다는 뜻입니다. 이 인물은 군사를 늘어세워 무용을 뽐내기를 좋아하여 기세를 드높입니다."
 trait_WJ_mr_zhonglang_yingyang:0 "응양중랑장"
 trait_WJ_mr_zhonglang_yingyang_desc:0 "응양을 칭호로 삼은 중랑장입니다. 이 인물은 늘 높은 곳에 올라 적진을 살피다가 기회를 엿보아 칩니다."
 trait_WJ_mr_zhonglang_you:0 "우중랑장"
 trait_WJ_mr_zhonglang_you_desc:0 "우중랑장은 좌중랑장과 함께 낭서의 숙위를 나누어 관장합니다. 이 인물은 궁궐을 드나들며, 명을 받아 군을 이끌고 도적을 토벌할 수도 있습니다."
 trait_WJ_mr_zhonglang_youji:0 "유격중랑장"
 trait_WJ_mr_zhonglang_youji_desc:0 "유격중랑장은 한 부대의 유격병을 거느리고 오가며 호응합니다. 이 인물은 행방이 일정하지 않아, 어디든 급한 곳이 있으면 그곳으로 달려갑니다."
 trait_WJ_mr_zhonglang_yueqi:0 "월기중랑장"
 trait_WJ_mr_zhonglang_yueqi_desc:0 "월기란 재주와 힘이 남보다 뛰어난 기사를 이릅니다. 이 인물이 거느린 부대는 모두 날래고 말 타기에 능한 용사들이니, 적진을 돌파하면 가는 곳마다 거칠 것이 없어야 합니다."
 trait_WJ_mr_zhonglang_yulin:0 "우림중랑장"
 trait_WJ_mr_zhonglang_yulin_desc:0 "우림중랑장은 우림 기사를 거느리고 궁궐을 숙위합니다. 이 인물은 활과 말에 능숙하고 호령이 정연해야 합니다."
 trait_WJ_mr_zhonglang_zhangjun:0 "장군중랑장"
 trait_WJ_mr_zhonglang_zhangjun_desc:0 "장군중랑장은 한 부대의 호령을 주관합니다. 이 인물은 군을 다스리는 데 법도가 있어 진퇴가 모두 법도를 따릅니다."
 trait_WJ_mr_zhonglang_zhangshi:0 "장사중랑장"
 trait_WJ_mr_zhonglang_zhangshi_desc:0 "장사중랑장은 막부의 여러 사무를 보좌합니다. 이 인물은 치밀하고 유능하여 주장이 팔다리처럼 의지합니다."
 trait_WJ_mr_zhonglang_zhechong:0 "절충중랑장"
 trait_WJ_mr_zhonglang_zhechong_desc:0 "절충을 칭호로 삼은 중랑장입니다. 이 인물은 한 부대를 거느리고 맨 앞에 진을 쳐 적군의 돌격을 전담하여 막습니다."
 trait_WJ_mr_zhonglang_zhengdi:0 "정적중랑장"
 trait_WJ_mr_zhonglang_zhengdi_desc:0 "정적중랑장은 북적 토벌을 전담합니다. 이 인물은 한 부대를 거느리고 변방 밖을 누비며 호족 기병과 겨룹니다."
 trait_WJ_mr_zhonglang_zhengman:0 "정만중랑장"
 trait_WJ_mr_zhonglang_zhengman_desc:0 "정만중랑장은 남만 토벌을 전담합니다. 이 인물은 한 부대를 거느리고 풍토병이 도는 땅을 헤치며 계곡과 동굴의 난을 평정합니다."
 trait_WJ_mr_zhonglang_zhengrong:0 "정융중랑장"
 trait_WJ_mr_zhonglang_zhengrong_desc:0 "정융중랑장은 서융 토벌을 전담합니다. 이 인물은 한 부대를 거느리고 황하와 황수 일대를 전전하며 강족, 저족과 겨룹니다."
 trait_WJ_mr_zhonglang_zhengyi:0 "정이중랑장"
 trait_WJ_mr_zhonglang_zhengyi_desc:0 "정이중랑장은 동이 토벌을 전담합니다. 이 인물은 한 부대를 거느리고 바다를 건너고 고개를 넘어 동방에 위엄을 떨칩니다."
 trait_WJ_mr_zhonglang_zhenjun:0 "진군중랑장"
 trait_WJ_mr_zhonglang_zhenjun_desc:0 "진군이라는 칭호는 군대를 진무한다는 뜻입니다. 이 인물은 한 부대를 진수하며, 변고를 당해도 놀라지 않습니다."
 trait_WJ_mr_zhonglang_zhenshuo:0 "진삭중랑장"
 trait_WJ_mr_zhonglang_zhenshuo_desc:0 "진삭중랑장은 북방을 진수한다는 뜻입니다. 이 인물은 해마다 변경을 지키며, 모래바람 속에서 굳센 의지를 다져 왔습니다."
 trait_WJ_mr_zhonglang_zhenwei:0 "진위중랑장"
 trait_WJ_mr_zhonglang_zhenwei_desc:0 "진위를 칭호로 삼은 중랑장입니다. 이 인물이 다스리는 부대는 군용이 정연하여 북과 뿔피리 소리가 서로 들립니다."
 trait_WJ_mr_zhonglang_zhenwu:0 "진무중랑장"
 trait_WJ_mr_zhonglang_zhenwu_desc:0 "진무를 칭호로 삼은 중랑장입니다. 이 인물은 대오를 매우 엄격하게 감독하여 훈련을 한 번도 거르지 않습니다."
 trait_WJ_mr_zhonglang_zhonglei:0 "중루중랑장"
 trait_WJ_mr_zhonglang_zhonglei_desc:0 "중루라는 이름은 군중의 영루를 지킨다는 뜻에서 따왔습니다. 이 인물은 영을 엄정하게 다스려 보루가 삼엄해야 합니다."
 trait_WJ_mr_zhonglang_zuo:0 "좌중랑장"
 trait_WJ_mr_zhonglang_zuo_desc:0 "좌중랑장은 본래 전중 낭서를 거느리는 청현한 직책입니다. 이 난세를 만나, 이 인물은 나가서는 군을 거느리고 정벌하며 들어와서는 궁궐을 숙위할 수 있습니다."

 # 来源：localization/simp_chinese/WJ_mingshi_track_loc_l_simp_chinese.yml
 trait_track_jungong:0 "무훈"
 trait_track_jungong_desc:0 "몸소 전장을 겪고 군을 거느려 승리하며 난을 평정하니, 공명은 모두 칼과 창 속에서 나옵니다. 군중의 위신이 높아질수록 휘하 용사들은 더욱 기꺼이 목숨을 바칩니다."
 trait_track_qingtan:0 "청의"
 trait_track_qingtan_desc:0 "청담으로 논변하고 인물을 품평하며 사림과 교유하는 가운데, 어지러운 비방과 칭찬 속에서도 외물에 흔들리지 않는 기개를 차츰 길러 갑니다."
 trait_track_zhengji:0 "치적"
 trait_track_zhengji_desc:0 "고과, 순행, 공사, 진휼 등 정사를 하나하나 겪으며 연마한 끝에 장부와 인정, 지방의 이해관계를 훤히 꿰뚫게 되었고, 일을 처리하고 계획하는 솜씨도 더욱 치밀해졌습니다."
 trait_track_zili:0 "사력"
 trait_track_zili_desc:0 "오랫동안 관서에 재직하며 조정에서 단련되어 조정의 법도와 인사, 출세의 길에 밝으니, 나아가고 물러날 때마다 절로 성원하는 이들이 있습니다."

 # 来源：localization/simp_chinese/WJ_office_roads_loc_l_simp_chinese.yml
 trait_track_WJ_mingshi_trait:0 "환해부침"
 trait_track_WJ_mingshi_trait_desc:0 "청의, 사력, 무훈, 치적의 네 길이 모여 한평생의 벼슬살이를 이룹니다. 네 길을 모두 통달한 자는 천하에 이름을 떨치기에 족합니다."
 trait_WJ_langguan_trait:0 "낭관"
 trait_WJ_langguan_trait_desc:0 "이 인물은 효렴으로 천거되어 낭관이 되었습니다. 창을 들고 전각을 숙위하며 고과를 기다리다가 관리로 보임되기를 기다리고 있습니다."
 trait_WJ_mingshi_trait:0 "환해부침"
 trait_WJ_mingshi_trait_desc:0 "벼슬길은 바다와 같아 한때의 영달로 그 사람을 다 말할 수 없고, 한때의 몰락으로 옛 명성을 지울 수도 없습니다. 이 인물은 벽소와 찰거로 출사한 이래 청담과 인물 품평, 오랜 관서 재직, 전장에서의 공훈, 백성을 다스린 치적이 하나하나 평생을 따라다녔습니다. 비록 파면되거나 실각하고 왕조가 바뀌더라도 옛 명망은 여전하니, 다시 때를 만난다면 공경의 자리에 오른다 해도 이상할 것이 없습니다."

 # 来源：localization/simp_chinese/WJ_yangwang_l_simp_chinese.yml
 WJ_yangwang_trait:0 "은사"
 WJ_yangwang_trait_desc:0 "이 인물은 벼슬을 버리고 은거하여 문을 닫고 책을 읽으며, 징벽에 응하지 않고 조정의 관직에도 나아가지 않으며 군무에도 관여하지 않고, 오직 고향의 옛 벗들과만 왕래합니다."
