l_korean:
 hd_warlord_offer_vassalization_interaction:0 "귀부 권유"
 hd_warlord_offer_vassalization_interaction_desc:0 "사신을 보내 이웃 제후에게 당신을 주군으로 받들도록 권합니다. 그 봉토와 신하는 예전 그대로입니다"
 hd_sub_request_notification:0 "천하가 어지러운데 홀로 한 귀퉁이를 지키니 오래가기 어려울 것이오. 그대와 군신의 분을 정하고자 하오. 그대의 봉토와 신하는 예전 그대로 두고, 나는 그대의 안위를 보장하겠소. 그대의 뜻은 어떠하오?"
 hd_sub_accept_summary_tt:0 "명분이 정해졌으며, 봉토와 신하는 예전 그대로입니다."
 hd_sub_decline_summary_tt:0 "이 제의가 완곡히 거절당했으니, 당분간 다시 꺼내기 어렵습니다."
 hd_sub_no_personality_veto_tt:0 "상대가 당신을 [rival|E]이나 [nemesis|E](으)로 여기지 않으며, 독실한 신앙 때문에 다른 신앙이나 다른 문화 전통의 주군을 섬기기를 거부하지도 않음"
 hd_sub_no_outgoing_request_tt:0 "당신에게 답변을 기다리는 다른 귀부 요청이 없음"
 hd_sub_inbox_free_tt:0 "상대가 지금 다른 귀부를 논의할 겨를이 있으며, 최근 당신을 거절한 적도 없음"
