 hd_submission_momentum_1:0 "병합 기세 · 1단계"
 hd_submission_momentum_1_desc:0 "이 인물은 최근 승리를 거두어 명성이 일기 시작했고, 이웃 제후들이 형세를 관망하기 시작했습니다."
 hd_submission_momentum_2:0 "병합 기세 · 2단계"
 hd_submission_momentum_2_desc:0 "이 인물은 싸울 때마다 승리하여 명성이 날로 높아지니, 이웃 제후들이 점차 두려워 복종하려는 마음을 품습니다."
 hd_submission_momentum_3:0 "병합 기세 · 3단계"
 hd_submission_momentum_3_desc:0 "이 인물의 칼끝이 향하는 곳마다 적을 연이어 격파하니, 사방의 제후들이 귀부를 깊이 고려합니다."
 hd_submission_momentum_4:0 "병합 기세 · 4단계"
 hd_submission_momentum_4_desc:0 "이 인물의 위세가 한 지방을 뒤흔드니, 이웃 제후들이 소문만 듣고도 두려워하며 앞다투어 사신을 보내 우호를 청합니다."
 hd_submission_momentum_5:0 "병합 기세 · 5단계"
 hd_submission_momentum_5_desc:0 "이 인물의 위세가 사해에 미쳐 가는 곳마다 거칠 것이 없으니, 사방의 제후들이 그 기세를 바라보고 귀부합니다."
 hd_submission_recently_submitted:0 "최근 귀부함"
 hd_submission_recently_submitted_desc:0 "이 인물은 최근 다른 이를 주군으로 받들어, 군신의 명분이 막 정해졌습니다."
