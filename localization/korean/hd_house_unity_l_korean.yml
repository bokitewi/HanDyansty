 hd_unity_bloc_left.desc: "가문 연합 탈퇴"
 hd_unity_bloc_kicked.desc: "가문 연합에서 축출됨"
 hd_unity_bloc_leadership_lost.desc: "연합 맹주의 자리를 빼앗김"
 hd_unity_bloc_relation.desc: "가문 연합 내 관계 개선"
 hd_unity_aspiration_drift_up.desc: "가문의 포부가 인심을 결집시킴"
 hd_unity_aspiration_drift_down.desc: "가문의 포부로 인해 인심이 동요함"
 hd_unity_aspiration_cap.desc: "가문의 포부에 한계가 있어 인심을 더 결집시키기 어려움"
 hd_unity_discord_mediated.desc: "가장이 나서서 일족 내 분쟁을 중재함"
 hd_unity_discord_favouritism.desc: "가장이 한쪽을 편듦"
 hd_unity_discord_ignored.desc: "일족 내 분쟁을 아무도 돌보지 않음"
 hd_unity_split_relief.desc: "이탈자들이 분가하여 가문이 한숨 돌림"
 hd_unity_goodwill_opinion: "후한 예물로 경의를 표함"
 hd_unity_suspicion_opinion: "나무가 크면 바람을 부르니, 의심을 품음"
 hd_unity_forced_stay_opinion: "강제로 붙잡힘"
 hd_unity.0001.t: "일족 내 알력"
 hd_unity.0001.desc: "일족의 인심이 하나로 모이지 않아, 각 방이 직책과 전답과 음보를 두고 끊임없이 다투는데, [hd_unity_branch.GetShortUIName]의 방이 특히 심하다. 뒤에서 서로 결탁하고 헐뜯는 소리가 이미 당신의 귀에까지 들려왔다. 더 이상 처리하지 않으면 집안의 추문이 밖으로 새어 나갈까 두렵다."
 hd_unity.0001.a: "종친들을 불러 모아 가운데서 중재한다."
 hd_unity.0001.b: "[hd_unity_branch.GetShortUIName]의 방이 하는 말에 일리가 있다."
 hd_unity.0001.c: "집안의 사소한 일이니 관여할 필요 없다."
 hd_unity.0002.t: "나무가 크면 바람을 부른다"
 hd_unity.0002.desc: "당신의 집안은 위아래가 한마음이고 종족이 번성하여, 자제들이 조정과 주군 곳곳에 퍼져 있다. 그러나 성하면 쇠하기 쉬운 법. [hd_unity_liege.GetShortUIName](이)가 근래 당신의 집안을 자못 의심하고 꺼리니, 조정에서는 이미 이를 빌미로 삼는 이가 있다. “강성한 종족과 대가는 경계하지 않을 수 없습니다.”"
 hd_unity.0002.a: "자제들을 단속하여 몸을 낮추고 스스로를 지킨다."
 hd_unity.0002.b: "후한 예물을 바쳐 충심을 보인다."
 hd_unity.0002.c: "맑은 자는 절로 맑은 법, 상관할 것 없다."
 hd_unity.0003.t: "분가"
 hd_unity.0003.desc: "일족 안에 이심이 생긴 지 오래되어, [hd_unity_branch.GetShortUIName]의 방이 여러 차례 따로 집안을 세우고 별도의 종지를 열겠다고 요구했다. 억지로 막으면 골육의 정을 상할까 두렵고, 내버려 두면 가문이 날로 쇠약해질 것이다."
 hd_unity.0003.a: "분가를 허락하여 따로 종지를 세우게 한다."
 hd_unity.0003.b: "가법이 여기 있으니, 분가는 허락하지 않는다."
 hd_unity.0003.c: "이 일은 잠시 미뤄 두고 논하지 않는다."
