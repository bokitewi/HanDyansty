l_korean:
 HD_DEFENSIVE_LEAGUE_NAME:0 "방어 동맹"
 HD_ANTI_REGENT_LEAGUE_NAME:0 "동탁 토벌 동맹"
 hd_league_member_modifier:0 "동맹 제후"
 hd_league_member_modifier_desc:0 "이 인물은 맹약에 참여하여 제후들과 진퇴를 함께합니다."
 hd_league_leader_modifier:0 "맹주의 자리"
 hd_league_leader_modifier_desc:0 "이 인물은 제후들의 추대를 받아 맹주의 자리에 있습니다."
 hd_league_disorganized_modifier:0 "흐트러진 맹심"
 hd_league_disorganized_modifier_desc:0 "동맹의 제후들이 저마다 다른 뜻을 품고 있어 호령이 서지 않습니다."
 hd_offer_defensive_league_interaction:0 "방어 동맹 결성 제안"
 hd_offer_defensive_league_interaction_desc:0 "상대와 맹약을 맺어 함께 외적을 막습니다."
 hd_offer_defensive_league_interaction_notification:0 "[actor.GetTitledFirstName](이)가 사신을 보내 와, 함께 외적을 막자며 동맹을 청합니다."
 hd_join_defensive_league_interaction:0 "방어 동맹 가입"
 hd_join_defensive_league_interaction_desc:0 "[recipient.GetTitledFirstName](이)가 주관하는 방어 동맹에 참여합니다."
 hd_demand_defensive_league_vote_interaction:0 "동맹 투표 지지 요구"
 hd_demand_defensive_league_vote_interaction_desc:0 "약점이나 동맹의 우의를 빌미로, 맹주를 추대할 때 상대가 당신을 지지하도록 요구합니다."
 hd_call_defensive_league_to_war_interaction:0 "동맹 참전 소집"
 hd_call_defensive_league_to_war_interaction_desc:0 "맹주의 이름으로 동맹의 제후들을 불러 당신과 함께 출정하게 합니다."
 hd_leave_defensive_league_decision:0 "방어 동맹 탈퇴"
 hd_leave_defensive_league_decision_desc:0 "처음의 맹약은 이제 발목을 잡을 뿐이다. 억지로 함께 가느니, 여기서 헤어져 각자 몸조심하는 편이 낫다."
 hd_leave_defensive_league_decision_tooltip:0 "당신이 속한 방어 동맹에서 탈퇴합니다"
 hd_unify_defensive_league_decision:0 "동맹 통일"
 hd_unify_defensive_league_decision_desc:0 "맹약이 여러 해 이어지면서 여러 가문은 이미 진퇴를 함께해 왔다. 해마다 회맹하느니, 하나의 나라로 합쳐 한 곳에서 명령이 나오게 하는 편이 낫다."
 hd_unify_defensive_league_decision_tooltip:0 "동맹을 하나로 합쳐 당신의 도성이 있는 주를 취하며, 동맹의 제후들은 모두 당신을 주군으로 받듭니다"
 hd_confederation.0500.t:0 "동맹을 합쳐 나라를 세우다"
 hd_confederation.0500.desc:0 "지난날 회맹의 문서는 아직 남아 있으나, 오늘 올라온 것은 여러 땅을 통합하는 새 장정이다. 당신의 도성이 있는 강역은 점점 하나로 이어졌고, 동맹의 여러 가문도 서로 돕고 호응하던 데서 한 사람의 호령을 함께 따르는 데까지 이르렀다.\n\n새로 정한 명위와 예속 관계를 바라보며, 당신은 이제부터 모든 일을 각 가문의 맹세로 미룰 수 없음을 안다. 땅과 병력과 백성의 삶이 한데 합쳐진 이상, 짊어져야 할 책임도 모두 당신의 어깨에 떨어졌다. 칭호는 오늘 얻을 수 있으나, 오래가는 복종은 앞으로의 다스림으로 지켜 나가야 한다.\n\n당 아래에는 선포를 기다리는 이들이 이미 모두 모였다. 당신은 옛 맹서를 새 문서 옆에 놓고, 통합의 일을 낭독하게 했다. 이제부터 느슨하던 옛 약속은 실질적인 귀속을 갖게 되었다."
 hd_confederation.0500.a:0 "동맹을 합쳐 나라를 세우니, 호령이 하나로 돌아간다."
 hd_confederation_subjugation_victory_desc:0 "패배한 쪽은 동맹에 가입해야 합니다."
 hd_confederation_subjugation_white_peace_desc:0 "양측이 군사를 거두고, 상대는 여전히 동맹에 들지 않습니다."
 hd_confederation_subjugation_defeat_desc:0 "정벌에 실패하여, 상대는 동맹에 들 필요가 없습니다."
 hd_anti_regent.0001.t:0 "맹주로 추대되다"
 hd_anti_regent.0001.desc:0 "사람들이 당신을 맹주로 추대하자, 사양하는 말이 몇 차례나 오갔고 당신도 일일이 답했다. 마침내 출병을 논의하게 되자, 좌중의 목소리는 방금 전만큼 가지런하지 않았다.\n\n이 집안은 군량이 모자라고, 저 집안은 경계를 지킬 군사를 남겨 두어야 한다. 방금 전까지만 해도 동탁의 목을 제 손으로 베지 못해 안달하던 이들에게 갑자기 저마다 어려운 사정이 생겼다. 당신은 술잔을 든 채 그들의 말을 들으며 얼굴에는 여전히 미소를 띠고 있었다. 제후들을 한자리에 앉힐 수 있었던 것은 역적을 치자는 의분 덕분이었으나, 앞으로 그들이 하나의 호령을 따르게 하는 것은 당신에게 달려 있다.\n\n당신이 술잔을 내려놓자, 좌중은 그제야 차츰 조용해졌다. 명분이 정해졌으니, 더 이상 모두가 자기 말을 마지막 한마디로 여기게 두어서는 안 된다. 여러분, 먼저 맹주의 안배를 들어 주시오."
 hd_anti_regent.0001.a:0 "피를 마셔 맹세하고, 함께 동탁 역적을 치리라."
 hd_anti_regent.0002.t:0 "사방으로 보내는 맹서"
 hd_anti_regent.0002.desc:0 "맹서를 봉하자, 역마가 저마다 다른 길로 출발했다. 한 통을 보낼 때마다 당신 앞에는 사본 한 부가 남았으니, 비어 있는 답신란은 아직 다 모이지 않은 깃발의 행렬 같았다.\n\n제후들은 저마다 망설이는 까닭이 있었다. 어떤 이는 먼저 이웃 땅의 동정을 살피려 하고, 어떤 이는 지난날의 예속 관계를 염려하며, 또 어떤 이는 동탁이 쓰러진 뒤 대권을 쥐는 자가 또 다른 사람일까 걱정한다. 당신은 모든 답장에 같은 글자가 적혀 있기를 기대할 수 없고, 더욱이 거병의 날짜가 망설임 하나하나에 따라 뒤로 밀리게 둘 수도 없다.\n\n집결의 날은 이미 정해졌다. 지금 해야 할 일은 오려는 이들을 기다리고, 떠날 수 있는 군마를 정비하여, 맹서 위의 비분강개한 말을 실제의 행군으로 바꾸는 것이다."
 hd_anti_regent.0002.a:0 "기일에 맞추어 군사를 모으되, 모두가 맹약에 응하기를 기다리지 않는다."
 hd_anti_regent.0003.t:0 "동탁 토벌 맹서"
 hd_anti_regent.0003.desc:0 "[hd_anti_regent_inviter_scope.GetTitledFirstName]의 맹서가 도착했다. 봉투에는 함께 동탁을 치고 한 왕실을 바로잡자고 적혀 있었다. 사자는 여러 갈래 군세를 다 이야기하고 나서 입을 다물고 당신의 답을 기다렸다.\n\n당신은 바로 붓을 들지 않았다. 맹약에 응한다는 것은 동탁을 죽여야 한다는 말 한마디로 끝나는 일이 아니다. 맹서에 일단 이름을 적으면, 당신은 옛 예속에서 벗어나 여러 군과 함께 서쪽으로 향해야 한다. 답서에서 단칼에 거절한다면 맹주는 반드시 원한을 품을 것이고, 동탁 쪽에서는 오히려 그 정을 기억할 것이다. 애매하게 미루기만 한다면, 그저 잠시 바깥에 서 있는 셈일 뿐이다.\n\n당 아래의 사람들은 모두 이 답서가 관동 전역에 퍼지리라는 것을 안다. 결국 누가 군마를 이끌고 그 결과를 감당할지는 당신 스스로 결정해야 한다."
 hd_anti_regent.0003.a:0 "옛 예속에서 벗어나 맹약에 들어 동탁을 치리라."
 hd_anti_regent.0003.a.tt:0 "당신은 옛 예속에서 벗어나 독자적인 세력을 이루고, 제후들과 함께 동탁 토벌의 군사를 일으킵니다."
 hd_anti_regent.0003.b:0 "이 맹약은 조명을 받든 것이 아니니, 따르기 어렵소."
 hd_anti_regent.0003.c:0 "경계를 닫고 스스로 지키며 형세를 지켜보리라."
 hd_anti_regent.0009.t:0 "발해 정비"
 hd_anti_regent.0009.desc:0 "발해에서 당신을 만나러 온 사람들이 문밖을 가득 메웠다. 먼저 부곡을 보고하는 이는 공로를 논하고 싶어 하고, 먼저 돈과 곡식을 보낸 이는 이름을 남기고 싶어 했다. 원씨가 어떻게 군사를 일으킬지에 대해서는, 모두 당신이 마지막으로 입을 열기를 기다리겠다고 했다.\n\n당신은 서리에게 하나하나 기록하게 했다. 돈과 비단은 얼마이고 갑사는 얼마이며, 또 어떤 명사들이 따르기를 원하는지. 낙양을 떠날 때 동탁은 아마 전상에서 감히 칼자루를 쥐는 사람 하나가 줄었으니 베개를 높이 하고 잘 수 있다고 여겼을 것이다. 이제 이 사람들이 당신에게 모여든 것이야말로 가장 좋은 대답이다.\n\n문밖에서 또 손님이 왔다고 알려 오자, 당신은 군적을 좌우에게 밀어 두고 옷매무새를 가다듬고 나가 맞이했다. 원씨 사세삼공의 명망은 바로 오늘 이곳에 써야 한다. 먼저 따르려는 이들을 받아들이고, 그다음 동탁이 그들의 발소리를 듣게 하리라."
 hd_anti_regent.0009.a:0 "군사를 거두고 곡식을 모아 발해를 기반으로 삼으리라."
 hd_anti_regent.0012.t:0 "제군의 회맹"
 hd_anti_regent.0012.desc:0 "집결의 날이 되자, 진영 앞에 각 집안의 깃발이 바람에 펄럭였다. 당신이 연합군의 호령을 넘겨받자, 보고하러 온 이들은 먼저 병력 수를, 다음으로 군량 수를 보고하고, 마지막에야 아직 도착하지 않은 부대를 이야기했다.\n\n기다림에도 끝이 있어야 한다. 동탁은 여전히 조정을 장악하고 있으니, 맹서 위의 역적 토벌의 말이 끝내 실행되지 않는다면 자기 진영 안에서부터 무게를 잃게 될 것이다. 당신이 이미 제군에게 출발을 명하자, 장막 밖에서는 곧 대오를 정비하고 치중을 재촉하는 고함이 울렸다.\n\n저마다 다른 깃발들을 다시 바라보며, 당신은 모든 이의 사심을 대신 없애 줄 수는 없지만, 그들이 먼저 같은 길을 걷게는 해야 함을 안다. 오늘부터 회맹은 전쟁이 되었다."
 hd_anti_regent.0012.a:0 "호령이 내려졌으니, 제군은 앞으로 나아가라."
 hd_anti_regent.0004.t:0 "동탁 토벌의 거병"
 hd_anti_regent.0004.desc:0 "출병의 호령이 이미 전해졌다. 치중 수레가 천천히 진문을 지나고, 갑옷을 입은 병사들이 길을 따라 늘어섰다. 방금까지 장막 안에서 논의하던 동탁 토벌의 싸움이 눈 깜짝할 사이에 눈앞의 발소리가 되었다.\n\n당신은 각 부대의 보고를 듣고, 군량 길을 묻고, 또 선봉군이 어디에서 합류하는지를 물었다. 입으로는 똑같이 군주 곁의 간신을 치자고 외치는 이들이라도, 모두가 같은 위험을 짊어지려 하지는 않을 것이다. 그러나 대군이 이미 움직였으니, 더 이상 술자리의 비분강개로 지탱할 수는 없다.\n\n동탁의 군마는 조정을 지키고, 연합군의 깃발은 도성을 향해 펼쳐졌다. 당신은 마지막 군보를 덮고, 사람을 보내 먼저 떠난 부대를 뒤쫓게 했다. 맹세가 효력이 있을지는, 이제 맞붙는 싸움에서 판가름 날 것이다."
 hd_anti_regent.0004.a:0 "제군을 엄정히 정비하여 함께 동탁을 향하라."
 hd_yuan_bohai_armored_army:0 "발해 중보병"
 hd_anti_regent.0100.t:0 "연합군의 철수"
 hd_anti_regent.0100.desc:0 "동탁 토벌의 싸움은 이미 승리로 끝났고 하남의 여러 현은 저마다 자립하여 누구의 다스림도 받지 않게 되었으나, 관중으로 계속 진군하자는 논의는 점점 줄어들었다. 진영을 오가는 이들의 화제도 바뀌었다. 자기 집 군량이 며칠이나 버틸지, 옛 땅은 안정되어 있는지, 언제 군사를 거둘 수 있는지.\n\n당신은 하나둘 내려지는 깃발들을 바라보았다. 동탁은 여전히 관중에 있는데, 모두를 한자리에 모았던 맹세는 이제 각 집안을 며칠 더 붙잡아 두지도 못한다. 작별 인사에 바쁜 이도 있고, 작별 인사도 기다리지 않고 치중부터 먼저 길에 오르게 한 이도 있다.\n\n이번 승리는 하남을 누구의 손에도 남기지 않았고, 다만 저마다 군사를 거느린 제후들을 남겼다. 당신은 옛 맹서를 거두며, 앞으로 이들과 다시 만날 때 반드시 같은 편에 서 있지는 않으리라는 것을 안다."
 hd_anti_regent.0100.b:0 "군사를 거두어 각자 돌아가니, 맹약의 일은 여기까지로다."
 hd_anti_regent_punitive_victory_desc:0 "맹주가 하남을 차지하고 참전한 제후들의 위세가 크게 떨칩니다. 연합군은 곧 해산하고, 제후들은 각자 군사를 거둡니다."
 hd_anti_regent_punitive_white_peace_desc:0 "양측이 군사를 거두고, 연합군은 아무 성과 없이 흩어집니다."
 hd_anti_regent_punitive_defeat_desc:0 "권신이 연합군을 격퇴하여 수비 측 장수들의 위세가 크게 떨칩니다. 연합군은 이로써 와해됩니다."
 HD_CONFEDERATION_SUBJUGATION_WAR_NAME:0 "동맹 정복 전쟁"
 HD_ANTI_REGENT_PUNITIVE_WAR_NAME:0 "토벌"
