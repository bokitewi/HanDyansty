l_korean:
 hd_story_yuan_expansion:0 "원소: 북방 확장"
 hd_story_yuan_expansion_desc:0 "원소는 기주를 근본으로 삼아, 북으로는 유주를 거두고 동으로는 청주를 취하며 서로는 태항산을 넘어 상당, 하내, 낙평, 태원, 신흥, 안문, 서하 등 여러 군을 경영하여, 하북 땅을 모두 차지하고자 한다."
 HD_YUAN_EXPANSION_STORY_STATUS:0 "원소는 선택한 방향으로 군사를 움직이는 중입니다. 이 방면이 평정되거나 그사이 더 노릴 만한 적이 없으면, 다음 방면을 다시 논의합니다. 이 방면의 전쟁은 원소가 직접 명을 내려 군사를 일으켜야 합니다."
 HD_YUAN_NORTHERN_LIFE_STORY_STATUS:0 "$HD_YUAN_LIFE_STORY_STATUS$\n\n기주, 유주, 청주 3주와 태항산 서쪽의 여러 군은 본초가 늘 마음에 품어 온 하북의 근본이다. 그 땅을 모두 차지하는 자가 곧 북방을 손에 쥐게 된다."
 hd_yuan_expansion.1000.t:0 "하북 군의"
 hd_yuan_expansion.1000.desc:0 "하북의 지도와 호적이 다시 펼쳐졌다. 당신은 지난날 저마다 한쪽을 차지하던 이름들을 훑어본다. 어떤 곳은 이미 원씨의 통제에 들어왔고, 어떤 곳은 여전히 완강하게 한 귀퉁이를 붙들고 있다. 좌우가 먼저 지난 방면의 군무를 보고하자, 당신은 다 듣고 나서야 다음은 어디로 향할지를 묻는다.\n\n기주, 유주, 청주 3주에는 아직 경영할 곳이 남아 있고, 태항산 서쪽도 병주와 북쪽 변경으로 이어진다. 군중에는 싸우기를 원하는 자가 적지 않으나, 군량 길을 모든 이가 가리키는 방향으로 동시에 낼 수는 없다.\n\n당신은 장수들에게 한꺼번에 입을 열지 말라고 손짓한다. 오늘 정할 것은 어느 방면이 먼저 나서느냐이며, 이미 평정된 땅은 따로 처리할 방도가 있다. 병사와 군량이 모두 당신의 명령만 기다리고 있으니, 이 군의가 서로 양보하지 않는 주장들로 흩어지게 두어서는 안 된다."
 hd_yuan_expansion.1000.a:0 "먼저 기주를 평정하라."
 hd_yuan_expansion.1000.b:0 "유주로 진군하라."
 hd_yuan_expansion.1000.c:0 "동쪽으로 청주를 취하라."
 hd_yuan_expansion.1000.d:0 "상당을 탈취하라."
 hd_yuan_expansion.1000.e:0 "하내로 진격하라."
 hd_yuan_expansion.1000.f:0 "낙평을 평정하라."
 hd_yuan_expansion.1000.g:0 "태원을 탈취하라."
 hd_yuan_expansion.1000.h:0 "신흥으로 진격하라."
 hd_yuan_expansion.1000.i:0 "북쪽으로 안문을 장악하라."
 hd_yuan_expansion.1000.j:0 "서하를 평정하라."
 hd_yuan_expansion.1000.k:0 "하북 땅이 모두 평정되었으니, 천하를 도모할 만하다."
 hd_yuan_expansion.jizhou_tt:0 "먼저 기주 경내에서 아직 귀부하지 않은 땅으로 칼끝을 돌립니다. 이 방면의 일이 끝나면 다음 행보를 논의합니다."
 hd_yuan_expansion.youzhou_tt:0 "칼끝을 북쪽 유주로 돌립니다. 이 방면의 일이 끝나면 다음 행보를 논의합니다."
 hd_yuan_expansion.qingzhou_tt:0 "칼끝을 동쪽 청주로 향합니다. 이 방면의 일이 끝나면 다음 단계를 의논합니다."
 hd_yuan_expansion.shangdang_tt:0 "서쪽으로 태항산을 넘어 곧장 상당으로 칼끝을 겨눕니다. 이 방면의 일이 끝나면 다음 행보를 논의합니다."
 hd_yuan_expansion.henei_tt:0 "칼끝을 남쪽 하내로 돌립니다. 이 방면의 일이 끝나면 다음 행보를 논의합니다."
 hd_yuan_expansion.leping_tt:0 "칼끝을 낙평으로 겨눕니다. 이 방면의 일이 끝나면 다음 행보를 논의합니다."
 hd_yuan_expansion.taiyuan_tt:0 "칼끝을 서쪽 태원으로 겨눕니다. 이 방면의 일이 끝나면 다음 행보를 논의합니다."
 hd_yuan_expansion.xinxing_tt:0 "칼끝을 북쪽 신흥으로 돌립니다. 이 방면의 일이 끝나면 다음 행보를 논의합니다."
 hd_yuan_expansion.yanmen_tt:0 "칼끝을 북쪽 안문으로 겨눕니다. 이 방면의 일이 끝나면 다음 행보를 논의합니다."
 hd_yuan_expansion.xihe_tt:0 "칼끝을 서쪽 서하로 돌립니다. 이 방면의 일이 끝나면 다음 행보를 논의합니다."
 hd_yuan_expansion.finished_tt:0 "하북의 여러 주군이 모두 원씨에게 돌아왔으니, 북방 경략은 이로써 일단락됩니다."
 hd_yuan_expansion_cb_victory_desc:0 "원소가 적의 강역을 모두 삼킵니다. 상대가 보유한 모든 작위가 원소에게 돌아가고, 그 휘하 봉신들은 모두 원소에게 귀순합니다."
 hd_yuan_expansion_cb_white_peace_desc:0 "양측이 군사를 거두고 각자 원래의 경계를 지킵니다."
 hd_yuan_expansion_cb_defeat_desc:0 "원소의 이번 진군은 아무 성과 없이 끝나고, 양측은 각자 원래의 경계를 지킵니다."
 hd_yuan_expansion_cb_invalidated_desc:0 "이 전쟁은 명분을 잃어 이로써 그치며, 각자 원래의 경계를 지킵니다."
