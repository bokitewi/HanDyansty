l_korean:
 hd_petition_vassalage_interaction:0 "귀부 요청"
 hd_petition_vassalage_interaction_desc:0 "세력이 약하고 외로우니, 강한 이웃을 주군으로 받들고 봉토와 신하는 예전 그대로 두기를 원합니다"
 hd_petition_request_notification:0 "저는 차지한 땅이 좁고 병사와 장수가 적어, 이 난세에 스스로를 지키기 어렵습니다. 오랫동안 명공의 위엄과 덕망을 우러러 왔으니, 거느린 무리를 이끌고 휘하에 들어가 대대로 번신이 되고자 합니다. 엎드려 바라오니 명공께서는 받아 주소서."
 hd_petition_accept_summary_tt:0 "상대가 땅을 들어 귀부하며, 봉토와 신하는 예전 그대로입니다."
 hd_petition_decline_summary_tt:0 "사신이 거절당했으니, 상대는 2년 안에 다시 귀부하러 오지 않습니다."
