l_korean:
 # 天朝循环·时代特色：扩张期套件（开边 CB / 册封朝贡 / 屯田 / 军功）

 # ---------- 开边 CB ----------
 hd_dc_exp_frontier_cb: "개변"
 hd_dc_exp_frontier_cb_name: "개변"
 hd_dc_exp_frontier_cb_war_name: "[ATTACKER.GetShortUINamePossessive] 개변 전쟁"
 hd_dc_exp_frontier_cb_victory_desc_attacker: "당신은 [defender.GetShortUINamePossessive] 군 가운데 당신의 강역과 맞닿은 모든 군에서 [defender.GetHerHim]에게 속한 현을 전부 빼앗고, [defender.GetHerHim](와)과 10년간 휴전합니다."
 hd_dc_exp_frontier_cb_victory_desc: "[attacker.GetShortUIName|U](이)가 [defender.GetShortUINamePossessive] 군 가운데 천조의 강역과 맞닿은 모든 군에서 [defender.GetHerHim]에게 속한 현을 전부 빼앗고, 양측은 10년간 휴전합니다."
 hd_dc_exp_frontier_cb_white_peace_desc: "두 나라가 전쟁을 멈추고 각자의 강역을 지킵니다."
 hd_dc_exp_frontier_cb_defeat_desc: "왕사가 패하여 [attacker.GetShortUIName|U](이)가 [defender.GetShortUIName]에게 배상금을 지불해야 합니다."

 # ---------- 册封朝贡 ----------
 hd_dc_exp_investiture_interaction: "책봉 조공"
 hd_dc_exp_investiture_interaction_desc: "사자에게 후한 예물을 들려 보내 [recipient.GetShortUINameNoTooltip](을)를 책봉하고, 천조의 정삭을 받들게 하여 당신의 [tributary|E](으)로 삼습니다."
 hd_dc_exp_investiture_interaction_notification: "천조의 사절이 조서와 하사품을 가지고 와서 [recipient.GetShortUIName](을)를 번속으로 책봉하려 합니다."
 hd_dc_exp_investiture_cooldown_tt: "[recipient.GetShortUINameNoTooltip|U](은)는 근년에 천조의 책봉을 거절한 적이 있어 몇 년 동안은 다시 받아들이지 않음"
 hd_dc_exp_investiture_reason_gift: "천조의 하사품: $VALUE|=+0$"
 hd_dc_exp_investiture_reason_weak: "천자의 절반에도 못 미치는 국력: $VALUE|=+0$"
 hd_dc_exp_investiture_reason_strong: "천자보다 강한 국력: $VALUE|=+0$"
 hd_dc_exp_investiture_reason_king: "군왕의 신분: $VALUE|=+0$"
 hd_dc_exp_investiture_reason_emperor: "황제의 신분: $VALUE|=+0$"
 hd_dc_exp_investiture_reason_rival: "천자와 경쟁자 관계: $VALUE|=+0$"
 hd_dc_exp_investiture_reason_nemesis: "천자와 천적 관계: $VALUE|=+0$"
 hd_dc_exp_investiture_reason_proud: "오만하거나 야심만만함: $VALUE|=+0$"
 hd_dc_exp_investiture_accepted_opinion: "천조의 책봉을 받음"
 hd_dc_exp_investiture_declined_opinion: "천조의 책봉을 거절함"

 # ---------- 屯田 ----------
 hd_dc_exp_tuntian_decision: "둔전"
 hd_dc_exp_tuntian_decision_desc: "변경의 황무지가 끝없이 이어지고, 수졸을 위한 군량 수송에 드는 비용이 헤아릴 수 없다. 병사와 백성을 모아 그 자리에서 땅을 일구어 둔전을 열고, 농사지으며 지키게 하면 군량을 실어 나르지 않아도 넉넉해질 것이다."
 hd_dc_exp_tuntian_decision_tooltip: "변경 주에 둔전을 설치함"
 hd_dc_exp_tuntian_decision_confirm: "둔전 설치"
 hd_dc_exp_tuntian_border_tt: "봉역 안에 외부와 접한 변경 현이 적어도 하나 있음"
 hd_dc_exp_tuntian_decision_effect_tt: "변경 주 하나를 골라 둔전을 설치합니다. 그 주에서 당신의 봉역에 속한 여러 현의 병사와 백성이 농사지으며 지킵니다."
 hd_dc_exp_tuntian_apply_tt: "해당 주에서 당신의 봉역에 속한 모든 [county|E]"
 hd_dc_exp_tuntian_modifier: "둔전"
 hd_dc_exp_tuntian_modifier_desc: "변경의 병사와 백성이 농사지으며 지키니, 군량이 넉넉하고 병력의 원천이 풍부하다."

 # ---------- 军功 ----------
 hd_dc_exp_military_merit_decision: "군공수작"
 hd_dc_exp_military_merit_decision_desc: "왕사가 새로이 외적을 격파하였으니, 공을 따져 상을 내려야 한다. 이번 전쟁에서 군을 이끈 지휘관 가운데 한 명을 골라 관직과 작위를 높여 준다."
 hd_dc_exp_military_merit_decision_tooltip: "공을 세운 지휘관 한 명에게 작위를 내림"
 hd_dc_exp_military_merit_decision_confirm: "논공행상"
 hd_dc_exp_merit_window_tt: "1년 이내에 천하 바깥의 세력과 싸워 이긴 적이 있음"
 hd_dc_exp_merit_candidate_tt: "그 전쟁에서 군을 이끈 지휘관 중 아직 당신의 봉역 안에 있는 자가 적어도 한 명 있음"
 hd_dc_exp_merit_decision_effect_tt: "이번 전쟁에서 군을 이끈 장수들 중 한 명을 골라 관직과 작위를 높여 줍니다. 이로써 군신 간의 은의가 더욱 깊어집니다."
 hd_dc_exp_merit_open_peerage_tt: "이 자는 아직 작위가 없으나 봉작을 받을 만하니, 당신이 직접 그의 봉읍을 정해 줄 수 있습니다."
 hd_dc_exp_merit_window_toast: "왕사의 개선"
 hd_dc_exp_merit_window_toast_desc: "개선의 기회를 틈타 공을 세운 장수들에게 논공행상을 할 수 있습니다. 늦으면 은상의 때를 놓칩니다."
 hd_dc_exp_military_merit_modifier: "군공"
 hd_dc_exp_military_merit_modifier_desc: "이 자는 전공으로 천자의 봉상을 받아 한때 이름을 크게 떨쳤다."
 hd_dc_exp_military_merit_opinion: "군공수작"

 # ---------- 事件 ----------
 hd_dc_exp.0100.t: "둔전 설치"
 hd_dc_exp.0100.desc: "대사농과 장작대장의 상소가 책상 위에 수북이 쌓였다. 변경의 황무지가 끝없이 이어지고, 수졸을 위한 군량 수송에 드는 비용이 헤아릴 수 없다는 것이다. 병사와 백성을 모아 그 자리에서 땅을 일구고 농사지으며 지키게 한다면, 군량을 실어 나르지 않아도 넉넉해질 것이다.\n\n여러 변경 주 가운데 어디에 먼저 둔전을 설치할 것인가?"
 hd_dc_exp.0100.a: "[hd_dc_exp_slot_1.GetName]에 둔전을 설치한다"
 hd_dc_exp.0100.b: "[hd_dc_exp_slot_2.GetName]에 둔전을 설치한다"
 hd_dc_exp.0100.c: "[hd_dc_exp_slot_3.GetName]에 둔전을 설치한다"
 hd_dc_exp.0100.d: "[hd_dc_exp_slot_4.GetName]에 둔전을 설치한다"
 hd_dc_exp.0100.e: "변경에 더는 둔전을 둘 곳이 없으니, 재물을 국고로 돌린다"
 hd_dc_exp.0200.t: "논공행상"
 hd_dc_exp.0200.desc: "왕사가 개선하여 장수들이 섬돌 아래 늘어섰다. 이번 싸움에서 적장을 베고 깃발을 빼앗은 자가 많으나, 작위와 상은 사람을 제대로 얻는 데 그 귀함이 있다. 천자께서 그중 공이 가장 뛰어난 자를 몸소 골라 특별한 영예를 내리셔야 한다."
 hd_dc_exp.0200.a: "[hd_dc_exp_merit_1.GetShortUIName]에게 봉상을 내린다"
 hd_dc_exp.0200.b: "[hd_dc_exp_merit_2.GetShortUIName]에게 봉상을 내린다"
 hd_dc_exp.0200.c: "[hd_dc_exp_merit_3.GetShortUIName]에게 봉상을 내린다"
 hd_dc_exp.0200.d: "[hd_dc_exp_merit_4.GetShortUIName]에게 봉상을 내린다"
 hd_dc_exp.0200.e: "장수들이 죽거나 떠나 상을 줄 사람이 없다"
