l_korean:
 hd_palace_crisis.0001.t:0 "경사의 풍문"
 hd_palace_crisis.0001.desc:0 "낙양에서 전해 오는 소식은 군보보다도 어지럽다. 하진과 환관이 다투는데, 오늘은 이미 결론이 났다 하고 내일은 태후가 허락하지 않았다 한다. 말을 전하는 이마다 먼저 당신이 어느 쪽 이야기를 믿고 싶은지부터 떠본다.\n\n당신은 편지를 좌우에게 다시 보게 하고 몸소 장막 입구로 걸어갔다. 양주의 병졸들은 여느 때처럼 마구를 점검하고 있다. 경사의 궁문 안에서 벌어지는 다툼은 그들에게 먼 일일 뿐이다. 그러나 조정에 정말로 외병을 빌려 승부를 가르려는 자가 있다면, 이들은 갑자기 가장 중요한 패가 될 것이다.\n\n편지에는 아직 정식 소명이 없다. 어느 쪽 편을 들겠다고 서둘러 나설 필요는 없다. 다만 주의해야 한다. 다투는 이들이 언제 말로 다투기를 그만두고, 당신의 병마를 자신들의 셈법에 써넣으려 하는지를."
 hd_palace_crisis.0001.a:0 "잠시 경사의 변화를 조용히 지켜본다."
 hd_palace_crisis.0002.t:0 "외병의 논의"
 hd_palace_crisis.0002.desc:0 "경사의 다툼에 마침내 새로운 길이 열렸다. 전해 온 소식에 따르면, 원소가 하진에게 외병을 불러들여 병세로 태후를 압박해 환관을 주살하라고 권했으며, 거론된 병력을 거느린 이들 가운데 바로 당신이 있다고 한다.\n\n당신은 그 몇 줄을 두 번 읽었다. 하진은 그저 갑병의 위세를 빌려 오래 결론 나지 않던 일을 매듭지으려는 것인지도 모른다. 하지만 병마가 일단 성 아래에 이르면, 더는 거두어들일 수 있는 상주문 한 통이 아니라는 것을 그가 생각해 보았을지는 알 수 없다.\n\n좌우가 당장 움직이겠느냐고 묻자 당신은 손을 저어 막았다. 소식은 어디까지나 조명이 아니다. 군량은 미리 점검할 수 있고 길은 미리 물어 둘 수 있지만, 어떤 명분으로 입경할지는 정말로 군 앞에 도착할 문서를 기다려야 한다."
 hd_palace_crisis.0002.a:0 "보급로부터 점검하며 소서를 조용히 기다린다."
 hd_palace_crisis.0003.t:0 "부름을 받들어 입경"
 hd_palace_crisis.0003.desc:0 "소명이 마침내 도착했다. 문서를 펼쳐 군사를 이끌고 입경하라는 구절에 이르자, 당신은 손가락으로 그곳을 누르고 좌우에게 다시 한번 들려주었다. 장막 밖에서 말 한 마리가 울었는데, 마치 그들보다 먼저 이것이 좋은 일임을 알아챈 듯했다.\n\n조정의 그자들이 이리저리 다투더니, 결국은 당신의 군사를 빌려야 했다. 누군가 낙양에 이르면 누구의 지휘를 받느냐고 묻자, 당신이 눈을 들어 그를 보았다. 그는 서둘러 말을 바꾸어 군량을 물었다. 군사를 데려가기도 전에, 벌써 남 대신 당신을 어떻게 단속할지 생각하는 자가 있다.\n\n당신은 소명을 말아 들고 책상 가장자리를 톡톡 두드렸다. 경사의 궁문이 아무리 깊어도 사람을 불러들일 때는 있게 마련이다. 이제 문서는 손에 있고 갑병은 곁에 있으니, 무엇을 망설이겠는가?"
 hd_palace_crisis.0003.a:0 "조서를 받들어 진군하고, 당일로 길을 떠난다."
 hd_palace_crisis.0004.t:0 "닫히는 궁문"
 hd_palace_crisis.0004.desc:0 "궁문이 등 뒤에서 닫힐 때, 당신은 그저 관례대로 길을 비우는 것이라고 생각했다. 앞에서도 누군가 길을 막아서고서야, 방금까지 따라오던 이들의 소리가 더는 들리지 않는다는 것을 알아차렸다.\n\n환관들은 더 이상 예전처럼 완곡하지 않았다. 그들은 곧 닥칠 외병을 들먹이고, 당신과 원소의 밀의를 들먹였는데, 그 말투에는 이미 변명할 여지조차 남아 있지 않았다. 당신이 감히 누가 대장군을 막느냐고 꾸짖자, 돌아온 대답은 다가오는 발소리와 칼집에서 뽑히는 칼이었다.\n\n당신은 손을 뻗어 허리띠를 누르다가, 문득 아직 궁문 밖에서 기다리고 있는 이들을 떠올렸다. 그들은 당신의 거마는 볼 수 있어도, 지금 이 순간 에워싸는 칼날은 보지 못한다. 외병을 부른 그 문서는 끝내 이 문 하나를 당신 대신 열어 주지 못했다."
 hd_palace_crisis.0004.a:0 "문밖의 병마는…… 어찌하여 아직 오지 않는가?"
 hd_palace_crisis.0005.t:0 "피로 물든 궁문"
 hd_palace_crisis.0005.desc:0 "하진이 살해되었다는 소식이 궁문 밖으로 전해지자, 방금까지 기다리던 병사들은 순식간에 혼란에 빠졌다. 당신이 무리를 이끌고 뛰어드니, 금문 뒤에서 고함과 도망치는 소리가 뒤엉켜, 더는 누구도 걸음을 멈추고 온전한 호령 하나를 끝까지 들으려 하지 않았다.\n\n환관과 그 무리는 이미 소탕되었으나, 처마 밑과 용도 사이에는 아직 핏자국이 남아 있다. 방금까지 누군가 지키던 문을 지나며 당신은 비로소 깨달았다. 칼을 뽑아 한 무리를 제거한다고 해서, 곧바로 조정의 호령을 이어받을 사람이 생기는 것은 아니라는 것을.\n\n성 밖에서는 또 동탁의 병마가 다가온다는 소식이 들려왔다. 처음 외병을 부른 것은 궁중을 압박해 물러서게 하려는 것이었다. 이제 하진은 죽었고 궁문은 부서졌으니, 그 군대에게 더는 입성할 필요가 없다고 누가 알려 줄 것인가?"
 hd_palace_crisis.0005.cao_desc:0 "원소는 이미 죽었고, 하진마저 궁중에서 살해되었다. 소식이 닿자, 더 기다리는 것이야말로 가장 위험한 일이 되었다. 당신이 병사를 이끌고 금문으로 뛰어드니, 앞서 서로 떠보던 속삭임은 순식간에 추격과 호령으로 바뀌었다.\n\n환관과 그 무리는 이미 소탕되었다. 당신은 어지러운 궁도 위에 서 있지만, 이 난국을 분명히 설명해 줄 사람은 하나도 찾을 수 없다. 계속 수색해 달라는 이, 천자가 어디 계신지만 알고 싶어 하는 이, 그리고 자신은 이 일에 관여한 적이 없다고 변명하기 바쁜 이도 있다.\n\n동탁의 병마는 여전히 낙양으로 다가오고 있다. 궁 안의 원수들은 이미 쓰러졌지만, 하진의 손에서 나온 성 밖의 그 소명은 그의 죽음과 함께 무효가 되지 않는다."
 hd_palace_crisis.0005.dong_desc:0 "원소와 조조가 모두 죽었고, 하진마저 환관에게 살해되었다. 경사에서 온 급보는 처음에는 구원을 청하더니, 나중에는 각처의 병사들이 제멋대로 수색한다는 소식으로 바뀌었다. 편지를 쓴 이조차 누가 아직 조정을 주관하고 있는지 분명히 말하지 못했다.\n\n당신은 환관과 그 무리를 추궁하라 명했고, 소탕의 결과가 곧 보고되었다. 그러나 이 이름들이 명부에서 지워진 뒤에도, 비어 버린 궁문과 통제를 잃은 병졸들은 그로 인해 예전의 질서를 되찾지 못했다.\n\n당신은 군보를 거두고, 경사로 가는 길을 물었다. 당신을 부른 이는 이미 죽었고, 궁 안에도 난국을 수습할 사람이 없으니, 이 군대가 입성한 뒤 누구의 호령을 따를지는 굳이 원래의 계획대로 할 필요가 없다."
 hd_palace_crisis.0005.a:0 "소탕은 끝났으나 난국은 수습되지 않았다."
 hd_palace_crisis.0007.t:0 "양주병의 낙양 입성"
 hd_palace_crisis.0007.desc:0 "낙양 성문이 바로 앞에 있다. 수졸은 깃발을 보고 서둘러 알리려 했으나, 한참이 지나도록 누구에게 보고해야 할지조차 분명히 말하지 못했다. 당신은 짜증이 나서 말을 한 걸음 앞으로 몰았다.\n\n하진은 죽었고 환관도 처형되었는데, 온 성안 사람들이 모두 남이 먼저 입을 열기를 기다리는 것 같다. 조정이 당신의 병사가 필요할 때는 소명을 그리도 다급히 내리더니, 이제 병사가 도착하자 나와서 일을 처리하려는 이조차 하나 없다.\n\n당신은 뒤를 돌아 대오를 한번 보고, 선봉에게 차례로 입성하라 명했다. 궁문은 누군가 지켜야 하고, 사례의 군정은 누군가 맡아야 한다. 다른 이들이 서로 눈치만 보고 있다면, 앞으로 누구에게 보고해야 하는지 똑똑히 보여 주면 된다."
 hd_palace_crisis.0007.a:0 "군사를 이끌고 낙양에 들어가 사례를 총괄한다."
 hd_palace_crisis.0015.t:0 "폐립"
 hd_palace_crisis.0015.desc:0 "입경한 이래로 궁문 수위와 사례의 군정은 차츰 당신의 뜻대로 돌아가고 있지만, 전상의 명위는 여전히 명령 하나하나 앞을 가로막고 있다. 신하들이 조종의 법도를 논할 때면, 그 눈길은 늘 은연중에 어좌를 향한다.\n\n당신은 폐립의 논의를 그들 앞에 내놓았다. 유변을 폐하고 유협을 세운다. 조서에 쓰면 고작 몇 줄에 불과하지만, 이 몇 줄이 일단 정해지면, 조정에 아직 남은 망설임과 요행은 모두 다른 말로 바뀌어야 한다. 홀을 꽉 쥐는 이도 있고, 고개를 숙이고 말없이 당신이 이 말을 거두기를 기다리는 이도 있다.\n\n당신은 거두지 않았다. 병권은 이미 손에 있다. 누가 그 어좌에 앉을지조차 정하지 못한다면, 어찌 조정을 총괄한다 하겠는가?"
 hd_palace_crisis.0015.a:0 "유변을 폐하고 유협을 세운다."
 hd_palace_crisis.0016.t:0 "칼을 비껴 들고 길게 읍하다"
 hd_palace_crisis.0016.desc:0 "동탁이 폐립의 논의를 입 밖에 내자, 전 앞에는 잠시 아무도 대답하지 않았다. 눈길을 피하는 동료들을 바라보던 당신은 마침내 검을 짚고 앞으로 나서서, 무슨 권리로 제멋대로 천자를 폐립하느냐고 따져 물었다.\n\n말이 한번 나오자, 더는 평범한 논쟁으로 여길 수 없게 되었다. 동탁의 병사는 성안에 있지만, 당신의 분노는 그와 맞설 만한 갑사로 바뀌지 않는다. 주위에서 말리려는 이도 있었지만, 더 많은 이들은 그저 두 사람이 그 자리에서 칼을 뽑지 않기만을 바랐다.\n\n당신은 칼을 비껴 들고 길게 읍한 뒤 전 밖으로 물러나서야 팽팽히 쥐었던 손을 풀었다. 이곳에 남는 것은 목숨을 그의 한순간의 망설임에 맡기는 것일 뿐이다. 발해는 아직 경영할 만하니, 앞으로의 대사를 모두 이 도움 없는 다툼에 걸 필요가 어디 있겠는가."
 hd_palace_crisis.0016.a:0 "상동문에 부절을 걸어 두고 발해로 달려간다."
 hd_palace_crisis.0021.t:0 "병주의 옛 부하"
 hd_palace_crisis.0021.desc:0 "동탁의 병사들이 몇 걸음 다가오자, 당신 곁의 여포가 맞서 나갔다. 갑자기 머뭇거리는 맞은편의 진세를 바라보며 당신은 코웃음을 쳤다. 양주병이 감히 경사에서 횡행하지만, 그들도 두려워하는 사람이 없는 것은 아니다.\n\n봉선이 물러나 돌아오자, 당신은 그에게 영중을 잘 살피고 병주의 옛 부하들을 잘 거두라고 일렀다. 요즘 성안에는 동탁이 어떻게 상을 내리는지, 또 누가 밤에 드나드는지 하는 이야기만 돌아 듣기에 거슬린다. 조정의 일은 아직 정리되지도 않았는데, 벌써 제 살길을 찾기 바쁜 자들이 있다.\n\n여포는 대답만 하고 더 말하지 않았다. 당신은 그를 한번 보고는, 다음 군령도 그의 손에 맡겼다. 그가 곁에 있는 한, 이 다툼은 아직 동탁이 마음대로 할 수 있는 것이 아니다."
 hd_palace_crisis.0021.a:0 "봉선, 영중의 일은 그대가 더 신경 써 주게."
 hd_palace_crisis.0022.t:0 "곁에 있던 칼날"
 hd_palace_crisis.0022.desc:0 "여포가 장막에 들어왔을 때, 당신은 새 군보가 온 줄 알고 봉선을 부르며 가까이 오라 했다. 그런데 그는 예를 올리지 않고, 손을 줄곧 병기에 얹고 있었다.\n\n“이게 무슨 뜻인가?” 그 말을 하고서야 당신은 몸을 일으켰다. 그는 동탁을 언급하고 새로운 갈 곳을 언급했는데, 그 말투는 마치 이미 처리한 군무를 보고하는 것 같았다. 당신은 홱 장막 입구를 바라보았다. 익숙한 영중의 소리는 여전한데, 들어오는 이는 하나도 없다.\n\n어제까지만 해도 그가 당신 대신 동탁을 막아 주었는데, 오늘은 이 병기가 당신을 겨누고 있다. 당신은 손을 뻗어 패검을 누르지만, 분노가 남은 말을 모두 목구멍에 막아 버렸다. 봉선, 영중을 잘 살피라 했더니, 결국 내 목숨까지 그의 손에 맡긴 셈이었구나!"
 hd_palace_crisis.0022.a:0 "봉선, 네가 감히 내게 손을 대려느냐?"
 hd_palace_crisis.0023.t:0 "낙양을 불태우고 서쪽으로 천도하다"
 hd_palace_crisis.0023.desc:0 "관동의 여러 군대가 이미 거병했고, 동탁 토벌의 격문도 낙양에 전해졌다. 예전에는 저마다 주군을 지키던 자들이 지금은 당신의 이름을 같은 죄상 한 장에 적어 넣었으니, 오히려 조정의 신하들보다 말이 더 잘 맞는다.\n\n좌우는 장안으로 서천하여 관중의 험고함에 기대어 다시 계획을 세우자고 권한다. 당신이 군보를 책상 위에 내던지자 전 아래가 순식간에 조용해졌다. 낙양을 버리는 것은 분하지만, 이곳에 남아 여러 군대가 다가오기를 기다리는 것은 더욱 마음에 들지 않는다.\n\n궁실과 부고, 군민의 이주가 모두 이 명령과 함께 움직여야 한다. 성안에서 따라가려 하지 않는 부호와 권문도 뒤에 올 자들에게 남겨 둘 필요가 없다. 당신은 지도 위의 관중으로 통하는 길을 바라보다가, 마침내 사람을 가까이 불렀다. 떠날 바에야, 뒤쫓아 오는 자들에게 여유 있게 넘겨받을 수 있는 경사를 남겨 두어서는 안 된다."
 hd_palace_crisis.0023.a:0 "낙양을 모조리 불태우고 서쪽 장안으로 옮긴다."


