 HD_PARTY_DEMAND_LOYALTY_TT: "#T 충성 요구#!\n[influence|E], [legitimacy|E], [prestige|E] 또는 [hook|E](으)로 위협하여, 이 당이 존왕으로 돌아서도록 강요한다. 고개를 숙이면 그 당수나 군주가 바뀔 때까지 다시는 입장을 바꾸지 않으며, 따르지 않으면 이 당은 군주와 맞서는 쪽으로 돌아서고 5년 동안 마음을 돌리지 않는다.\n#weak 같은 당에는 5년에 한 번만 요구할 수 있다.#!"
