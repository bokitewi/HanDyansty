 HD_DEBATE_OPPOSE_OTHER_LABEL: "기타 반대자: [Subtract_int32( GetDataModelSize( ActivityWindow.GetCurrentPhaseGuestSubset( 'hd_debate_oppose' ) ), '(int32)3' )]"
