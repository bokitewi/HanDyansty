 HD_PARTY_FAVORED_TT: "#T 총애받음#!\n이 당은 지금 군주가 크게 의지하고 있다. 이 당이 당대에 겪는 득실과 이해를 군주도 함께 떠안으며, 그 당인의 군주에 대한 의견 #P +10#!, 임명 점수 #P +15%#!."
