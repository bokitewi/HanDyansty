 hd_party_favor_decision_desc: "조정의 여러 당은 저마다 장점이 있으나, 저마다 사심도 품고 있다. 그중 하나를 골라 가까이하고 심복으로 삼으면 그들의 사력을 얻을 수 있다. 다만 예전에 총애받던 이들이 하루아침에 세력을 잃으면, 원망을 품지 않을 수 없다."
