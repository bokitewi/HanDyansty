 hd_party_choose_attitude_decision: "붕당의 태도"
 hd_party_choose_attitude_decision_desc: "당신은 본당의 우두머리이니, 당의 진퇴와 향배가 모두 당신의 한마디에 달려 있다. 주상을 받들 것인가, 변화를 조용히 지켜볼 것인가, 아니면 맞서 대등하게 겨룰 것인가?"
