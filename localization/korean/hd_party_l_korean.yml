 hd_party.0020.t: "마음을 돌리도록 압박하다"
 hd_party.0020.desc: "[hd_party_target_leader.GetShortUIName](와)과 그 일당은 조정에서 스스로 한 파를 이루고 있다. 그들을 굴복시킬 수 있다면, 이 당은 그 당수가 바뀌거나 당신이 더 이상 자리에 있지 않을 때까지 “존왕”을 따르게 될 것이다.\n\n다만 강압 아래에서 모두가 진심으로 따르는 것은 아니다."
 hd_party.0020.a: "권세를 끼고 압박한다"
 hd_party.0020.b: "명분과 대의로 꾸짖는다"
 hd_party.0020.c: "위신으로 누른다"
 hd_party.0020.d: "명망을 다 쏟아 굴복을 강요한다"
 hd_party.0020.e: "약점을 쥐고 위협한다"
 hd_party.0020.f: "이 일은 잠시 미룬다"
 hd_party.0101.t: "당고 해제"
 hd_party.0101.desc: "황건의 난이 갑자기 일어나 사방이 진동했다. 중상시 여강이 당신에게 진언했다. 당고로 쌓인 원한이 오래되었으니, 사면하지 않으면 당인들이 장각과 손잡아 화가 더욱 커질까 두렵다는 것이다."
 hd_party.0101.a: "당인들을 크게 사면한다"
 hd_party.0101.a.tt: "금고되었던 사인들이 고향으로 돌아갈 수 있게 되어, 한문 사이의 인심이 조금 안정됩니다."
 hd_party_chain.11.t: "중상시의 총애"
 hd_party_chain.11.desc: "[hd_party_chain_leader.GetShortUIName](이)가 밤낮으로 당신 곁을 모시며 조심스럽고 공손하니, 당신의 마음을 깊이 얻었다. 궁중 사람들은 모두 뒤에서 말한다. 중상시의 자리는 이 사람이 아니면 안 된다고."
 hd_party_chain.11.a: "중상시에 임명한다"
 hd_party_chain.11.b: "돈과 비단을 내려 그 노고에 보답한다"
 hd_party_chain.11.c: "궁중의 일은 많이 논할 것이 아니다"
 hd_party_chain.12.t: "서원의 병권 장악"
 hd_party_chain.12.desc: "[hd_party_chain_leader.GetShortUIName](이)가 아뢰어, 서원에 팔교위를 두고 환관이 금병을 통솔하여 비상시에 대비하자고 청했다. 소식이 전해지자 무인들 사이에 불만이 많았다."
 hd_party_chain.12.a: "청한 대로 허락한다"
 hd_party_chain.12.b: "명호는 내리되 병권은 주지 않는다"
 hd_party_chain.12.c: "군사는 나라의 큰일이니, 가볍게 맡길 수 없다"
 hd_party_chain.13.t: "환관의 간정"
 hd_party_chain.13.desc: "여러 상시들이 연명으로 상주하여, 당신 대신 상주문을 결재하겠다고 청했다. “주상의 수고를 덜어 드리기 위해서”라는 것이다. 허락하면 호령이 궁중에서 나오게 되고, 허락하지 않으면 환관들이 원망을 품을까 두렵다."
 hd_party_chain.13.a: "상주문을 맡긴다"
 hd_party_chain.13.c: "이 일은 결코 행할 수 없다"
 hd_party_chain.21.t: "황후 일족의 봉후"
 hd_party_chain.21.desc: "황후 일족인 [hd_party_chain_leader.GetShortUIName](이)가 여러 차례 공을 세우니, 조정 신하들이 잇달아 상소를 올려 후작으로 보답하라고 청했다."
 hd_party_chain.21.a: "땅을 떼어 봉한다"
 hd_party_chain.21.b: "금과 비단을 후하게 내린다"
 hd_party_chain.21.c: "공이 없으면 후로 봉할 수 없다"
 hd_party_chain.22.t: "외척의 병권 장악"
 hd_party_chain.22.desc: "[hd_party_chain_leader.GetShortUIName](이)가 장군의 칭호를 받아 금병을 통솔하고 경사를 숙위하겠다고 청했다."
 hd_party_chain.22.a: "장군에 임명한다"
 hd_party_chain.22.b: "영예로운 이름을 내린다"
 hd_party_chain.22.c: "병권은 남에게 빌려줄 수 없다"
 hd_party_chain.23.t: "외척의 보정"
 hd_party_chain.23.desc: "외척의 세력이 날로 높아진다. [hd_party_chain_leader.GetShortUIName](이)가 표문을 올려, 녹상서사가 되어 조정의 정사를 보좌하겠다고 청했다."
 hd_party_chain.23.a: "보정을 맡긴다"
 hd_party_chain.23.c: "내가 친히 조정을 다스리겠다"
 hd_party_chain.51.t: "찰거 발탁"
 hd_party_chain.51.desc: "한문의 사인들이 연명으로 상소를 올려, 찰거를 널리 열어 외롭고 가난한 선비들을 발탁해 달라고 청했다."
 hd_party_chain.51.a: "찰거를 널리 열고, 문벌에 구애받지 않는다"
 hd_party_chain.51.b: "한두 명만 뽑는다"
 hd_party_chain.51.c: "벼슬길에는 본디 정해진 규칙이 있다"
 hd_party_chain.52.t: "청의의 성행"
 hd_party_chain.52.desc: "태학의 제생들이 공경들을 품평하고 집정을 평가하니, 청의의 목소리가 조정과 민간에 두루 퍼지고, 당신의 시정마저 그 평론의 대상이 되었다."
 hd_party_chain.52.a: "그 직언을 가상히 여긴다"
 hd_party_chain.52.b: "들어 줄 뿐이다"
 hd_party_chain.52.c: "함부로 조정의 정사를 논하는 자는 금해야 한다"
 hd_party_chain.53.t: "한문의 대각 진출"
 hd_party_chain.53.desc: "한문의 명망가 [hd_party_chain_leader.GetShortUIName]의 명성이 날로 높아지니, 사람들이 모두 그를 대각에 끌어들여 기무에 참여하게 하라고 청한다."
 hd_party_chain.53.a: "대각에 끌어들인다"
 hd_party_chain.53.c: "자격과 명망이 아직 얕다"
 hd_party_chain.41.t: "문벌 천거"
 hd_party_chain.41.desc: "세족의 공들이 서로 천거하며, 문벌의 자제를 낭관으로 채우자고 청했다."
 hd_party_chain.41.a: "천거한 바를 허락한다"
 hd_party_chain.41.b: "뛰어난 자를 골라 쓴다"
 hd_party_chain.41.c: "관리 선발은 재능과 덕을 따져야 한다"
 hd_party_chain.42.t: "전답 겸병"
 hd_party_chain.42.desc: "호족의 집안들이 전답을 널리 차지하여, 노비와 식객이 걸핏하면 천 명을 헤아린다. 담당 관청이 금령을 더하자고 청했으나, 세족의 공들은 앞다투어 당신에게 사정한다."
 hd_party_chain.42.a: "하는 대로 내버려 둔다"
 hd_party_chain.42.b: "조금 단속한다"
 hd_party_chain.42.c: "겸병을 엄금한다"
 hd_party_chain.43.t: "문벌의 벼슬길 독점"
 hd_party_chain.43.desc: "세족의 공들이 품제의 법을 정하여, 문벌의 높고 낮음으로 관품을 정하자고 청했다. 그렇게 되면 한문의 자제들은 이제 출세할 길이 거의 없어진다."
 hd_party_chain.43.a: "정해진 법으로 삼는다"
 hd_party_chain.43.c: "이 법은 결코 행할 수 없다"
 hd_party_chain.31.t: "배장봉후"
 hd_party_chain.31.desc: "[hd_party_chain_leader.GetShortUIName](이)가 여러 차례 전공을 세우니, 휘하 장병들이 잇달아 그를 장수로 임명하고 후하게 봉상하여 삼군을 격려해 달라고 청했다."
 hd_party_chain.31.a: "장군에 임명한다"
 hd_party_chain.31.b: "후하게 상을 내린다"
 hd_party_chain.31.c: "공이 거기에 미치지 못한다"
 hd_party_chain.32.t: "변장의 옹병"
 hd_party_chain.32.desc: "여러 변경 장수들이 상소를 올려, 각자 사병을 거느리고 스스로 병마를 모아 외적의 침입을 막겠다고 청했다."
 hd_party_chain.32.a: "스스로 모병하도록 허락한다"
 hd_party_chain.32.b: "재물과 군량을 내린다"
 hd_party_chain.32.c: "병권은 조정에 돌아가야 한다"
 hd_party_chain.33.t: "무인의 발호"
 hd_party_chain.33.desc: "장수들이 공을 믿고 교만하여 여러 차례 불법을 저질렀다. 내버려 두면 무인들이 더욱 발호할 것이고, 억누르면 병란을 일으킬까 두렵다."
 hd_party_chain.33.a: "잠시 용납한다"
 hd_party_chain.33.c: "엄히 억누른다"
 hd_party_tt_huanguan_pleased: "환관당이 이를 듣고 크게 기뻐하니, 기세가 날로 성해집니다."
 hd_party_tt_huanguan_soothed: "환관당이 조금 위안을 얻습니다."
 hd_party_tt_huanguan_resent: "환관당이 불만을 품고 언짢아합니다."
 hd_party_tt_huanguan_dominant: "환관당의 기세가 크게 일어나, 권세가 조정과 민간을 기울입니다."
 hd_party_tt_waiqi_pleased: "외척당이 이를 듣고 크게 기뻐하니, 기세가 날로 성해집니다."
 hd_party_tt_waiqi_soothed: "외척당이 조금 위안을 얻습니다."
 hd_party_tt_waiqi_resent: "외척당이 불만을 품고 언짢아합니다."
 hd_party_tt_waiqi_dominant: "외척당의 기세가 크게 일어나, 권세가 조정과 민간을 기울입니다."
 hd_party_tt_wuxun_pleased: "무훈당이 이를 듣고 크게 기뻐하니, 기세가 날로 성해집니다."
 hd_party_tt_wuxun_soothed: "무훈당이 조금 위안을 얻습니다."
 hd_party_tt_wuxun_resent: "무훈당이 불만을 품고 언짢아합니다."
 hd_party_tt_wuxun_dominant: "무훈당의 기세가 크게 일어나, 권세가 조정과 민간을 기울입니다."
 hd_party_tt_shizu_pleased: "세족당이 이를 듣고 크게 기뻐하니, 기세가 날로 성해집니다."
 hd_party_tt_shizu_soothed: "세족당이 조금 위안을 얻습니다."
 hd_party_tt_shizu_resent: "세족당이 불만을 품고 언짢아합니다."
 hd_party_tt_shizu_dominant: "세족당의 기세가 크게 일어나, 권세가 조정과 민간을 기울입니다."
 hd_party_tt_hanmen_pleased: "한문당이 이를 듣고 크게 기뻐하니, 기세가 날로 성해집니다."
 hd_party_tt_hanmen_soothed: "한문당이 조금 위안을 얻습니다."
 hd_party_tt_hanmen_resent: "한문당이 불만을 품고 언짢아합니다."
 hd_party_tt_hanmen_dominant: "한문당의 기세가 크게 일어나, 권세가 조정과 민간을 기울입니다."
 hd_party_tt_others_resent: "나머지 여러 당이 곁눈질하며 원망의 말이 많습니다."
 activity_hd_party_debate: "입장 논쟁"
 activity_hd_party_debate_plural: "입장 논쟁"
 activity_hd_party_debate_desc: "같은 당 사람들과 여러 당의 우두머리를 불러 모아, 본당이 견지하는 입장에 대해 조정에서 논쟁한다. 논쟁에서 이기면 본당은 노선을 바꾸고, 지면 발기한 사람은 명성이 땅에 떨어진다."
 activity_hd_party_debate_selection_tooltip: "입장 논쟁을 일으켜 본당의 정치 입장을 바꾸려 함"
 activity_hd_party_debate_destination_selection: "논쟁은 당신 또는 군주의 수도에서만 열 수 있습니다."
 activity_hd_party_debate_host_desc: "\n$BULLET_WITH_TAB$논쟁 승리: 본당이 새 입장으로 돌아서고, 당신은 [prestige|E](을)를 얻으며 원래의 당수를 대신함\n$BULLET_WITH_TAB$논쟁 패배: 당신은 [prestige|E](을)를 잃고, 여러 해 동안 당권을 잡거나 다시 조정 논쟁을 일으킬 수 없으며, 본당의 [movement_power|E]도 손상됨"
 activity_hd_party_debate_guest_desc: "\n$BULLET_WITH_TAB$옹호자: 논쟁에서 이기면 [prestige|E](을)를 얻고 발기인과 정을 맺으며, 지면 당내에서 세력을 잃음\n$BULLET_WITH_TAB$반대자: 발기인이 패하면 [prestige|E](을)를 얻음"
 activity_hd_party_debate_predicted_cost: "예상 비용"
 activity_hd_party_debate_host_an_a: "$articleblank_article$"
 activity_hd_party_debate_guest_help_text: "초청받은 사람은 발기인을 옹호할 수도, 수수방관할 수도, 일어나 반대할 수도 있습니다."
 hd_party_debate_province_desc: "#P +수도#!"
 hd_party_debate_location_desc: "당신 또는 군주의 수도에서만 열 수 있음"
 hd_debate_target: "목표 입장"
 hd_debate_target_desc: "본당이 따르기를 바라는 입장"
 hd_target_zunwang: "존왕으로 전환"
 hd_target_zunwang_desc: "군주를 높이 받든다. 당인들은 파벌을 맺지 않고 군사를 일으켜 윗사람을 범하지 않으며, 주군을 공경히 섬긴다. 무신은 군주를 따라 출정하고, 문신은 마음을 다해 백성을 다스린다."
 hd_target_kaituo: "개척으로 전환"
 hd_target_kaituo_desc: "영토 확장을 강력히 주장한다. 청원과 국정 논의에서 군대 확충, 군진 증설, 보호국 확대를 주로 요구한다."
 hd_target_jinqu: "진취로 전환"
 hd_target_jinqu_desc: "이로움을 일으키고 폐단을 없애기를 강력히 주장한다. 청원과 국정 논의에서 관서 확충, 과거를 통한 인재 선발, 녹봉 증액을 주로 요구한다."
 hd_target_shoujiu: "수구로 전환"
 hd_target_shoujiu_desc: "조종의 제도를 굳게 지키기를 강력히 주장한다. 청원과 국정 논의에서 치사의 법, 여러 관서의 비용, 관리 선발의 자격에 주로 관심을 둔다."
 hd_target_zhongli: "중립으로 전환"
 hd_target_zhongli_desc: "분쟁에 끼어들지 않으며, 조정의 정사에 치우친 바가 없다."
 hd_debate_phase_prep: "준비"
 hd_debate_phase_prep_desc: "각 측이 분주히 오가며 결탁하고, 중립인 자들을 끌어들인다."
 hd_debate_phase_early: "논쟁 초기"
 hd_debate_phase_early_desc: "양측이 경전과 고사를 인용하며 서로 공격하고 방어한다."
 hd_debate_phase_late: "논쟁 후기"
 hd_debate_phase_late_desc: "승부가 곧 갈릴 것이니, 군주의 재결을 청해야 할 수도 있다."
 hd_debate_support: "옹호"
 hd_debate_neutral: "중립"
 hd_debate_oppose: "반대"
 hd_debate_host_intent: "조정 논쟁 주재"
 hd_debate_host_intent_desc: "당신은 본당이 새 입장으로 돌아서야 한다고 주장한다."
 hd_debate_support_intent: "옹호"
 hd_debate_support_intent_desc: "당신은 발기인의 주장을 지지한다."
 hd_debate_neutral_intent: "중립"
 hd_debate_neutral_intent_desc: "당신은 그저 수수방관할 뿐이다."
 hd_debate_oppose_intent: "반대"
 hd_debate_oppose_intent_desc: "당신은 본당의 현재 입장을 유지해야 한다고 주장한다."
 hd_party_debate_conclusion_success: "입장 논쟁이 발기인 측의 승리로 끝나, 이 당은 새 입장으로 돌아섰습니다."
 hd_party_debate_conclusion_fail: "입장 논쟁이 발기인 측의 패배로 끝났습니다."
 hd_party_debate_conclusion_default: "입장 논쟁이 끝났습니다."
