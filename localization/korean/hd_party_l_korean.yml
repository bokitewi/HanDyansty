l_korean:
 HD_PARTY_GROUP_NAME_HUANGUAN: "환관"
 HD_PARTY_GROUP_NAME_WAIQI: "외척"
 HD_PARTY_GROUP_NAME_WUXUN: "무훈"
 HD_PARTY_GROUP_NAME_SHIZU: "세족"
 HD_PARTY_GROUP_NAME_HANMEN: "한문"
 HD_PARTY_STANCE_ZUNWANG_TT: "#T 존왕#!\n이 당은 군주를 높이 받든다. 당인들은 파벌을 맺지 않고 군사를 일으켜 윗사람을 범하지 않으며, 주군에 대한 의견 #P +15#!, 주군을 상대로 몰래 음모를 꾸미는 일도 극히 드물다. 주군이 그 당인을 체포할 때 저항을 거의 받지 않으며, 당 안의 무신은 기꺼이 군주를 따라 출정하고, 문신이 총독을 맡으면 효율 #P +10%#!. 그 당인이 봉신일 경우 대체로 “궁정 예법”의 [vassal_stance|E](을)를 가진다."
 hd_party_stance_zunwang: "존왕"
 HD_PARTY_STANCE_KAITUO_TT: "#T 개척#!\n이 당은 영토 확장을 강력히 주장한다. 주상에게 청원하거나 국정을 논할 때 군대 확충, 군진 증설, 보호국 확대를 주로 요구한다. 그 당인이 봉신일 경우 대체로 “상무 호전”의 [vassal_stance|E](을)를 가진다."
 hd_party_stance_kaituo: "개척"
 HD_PARTY_STANCE_JINQU_TT: "#T 진취#!\n이 당은 이로움을 일으키고 폐단을 없애기를 강력히 주장한다. 청원과 국정 논의에서 관서 확충, 과거를 통한 인재 선발, 녹봉 증액을 주로 요구한다. 그 당인이 봉신일 경우 대체로 “향토 중시”의 [vassal_stance|E](을)를 가진다."
 hd_party_stance_jinqu: "진취"
 HD_PARTY_STANCE_SHOUJIU_TT: "#T 수구#!\n이 당은 조종의 제도를 굳게 지키기를 강력히 주장한다. 청원과 국정 논의에서 치사의 법, 여러 관서의 비용, 관리 선발의 자격에 주로 관심을 둔다. 그 당인이 봉신일 경우 대체로 “명리 추구”의 [vassal_stance|E](을)를 가진다."
 hd_party_stance_shoujiu: "수구"
 HD_PARTY_STANCE_ZHONGLI_TT: "#T 중립#!\n이 당은 분쟁에 끼어들지 않으며, 조정의 정사에 치우친 바가 없다."
 hd_party_stance_zhongli: "중립"
 HD_PARTY_RELATION_COOP_TT: "#T 협력#!\n두 당의 입장이 비슷하여(진취와 개척, 중립과 수구, 존왕과 군주 옹호파), 두 당의 당수와 각자의 상위 요인 세 명이 서로 친선하며, 서로 #P +10#! 의견을 가진다."
 HD_PARTY_RELATION_NONE_TT: "#T 없음#!\n두 당은 대립하지도 협력하지도 않는다."
 HD_PARTY_RELATION_HOSTILE_TT: "#T 대립#!\n두 당의 입장이 서로 어긋나(진취와 수구, 개척과 수구, 존왕과 군주 대항파), 두 당의 당수와 각자의 상위 요인 세 명이 서로 혐오하며, 서로 #N −15#! 의견을 가지니, 당쟁이 이로부터 일어날 수 있다."
 HD_PARTY_POLICY_BAN_TT: "#T 정치 공작: 금지#!\n이 당을 금고하여 당인의 벼슬길을 막는다. 그 구성원의 영향력 #N −50%#!, 위신과 정통성 획득 #N −30%#!, 임명 및 계승 점수 #N −50#!, 군주에 대한 의견 #N −30#!. 군주는 그 당인을 마음대로 체포할 수 있으며, 그 당인과 문하의 신하들도 더 쉽게 떠나간다.\n매월 비용: 영향력 3 (영향력이 없는 정체는 위신 5 소모).\n\n#weak 정령이 내려진 뒤 5년 안에는 바꿀 수 없음 (중립으로 되돌리는 것은 예외).#!"
 HD_PARTY_POLICY_RESTRICT_TT: "#T 정치 공작: 제한#!\n이 당을 억누른다. 그 구성원의 영향력 #N −20%#!, 위신과 정통성 획득 #N −10%#!, 임명 및 계승 점수 #N −20#!, 군주에 대한 의견 #N −10#!.\n매월 비용: 영향력 1 (영향력이 없는 정체는 위신 2 소모).\n\n#weak 정령이 내려진 뒤 5년 안에는 바꿀 수 없음 (중립으로 되돌리는 것은 예외).#!"
 HD_PARTY_POLICY_NEUTRAL_TT: "#T 정치 공작: 중립#!\n돕지도 억누르지도 않고 자연에 맡기며, 비용이 들지 않는다.\n\n#weak 정령이 내려진 뒤 5년 안에는 바꿀 수 없음 (중립으로 되돌리는 것은 예외).#!"
 HD_PARTY_POLICY_PROMOTE_TT: "#T 정치 공작: 촉진#!\n이 당을 지원한다. 그 구성원의 영향력 #P +20%#!, 위신과 정통성 획득 #P +10%#!, 임명 및 계승 점수 #P +20#!, 군주에 대한 의견 #P +10#!.\n매월 비용: 영향력 1 (영향력이 없는 정체는 위신 2 소모).\n\n#weak 정령이 내려진 뒤 5년 안에는 바꿀 수 없음 (중립으로 되돌리는 것은 예외).#!"
 HD_PARTY_ATTITUDE_HUANGUAN_TT: "#T 군주에 대한 환관의 태도: [SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_huanguan_attitude').GetFlagName, 'support' ), 'hd_party_attitude_support_name', SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_huanguan_attitude').GetFlagName, 'oppose' ), 'hd_party_attitude_oppose_name', 'hd_party_attitude_neutral_name' ) )]#!\n옹호 점수: [Character.MakeScope.Var('hd_party_huanguan_score').GetValue|0] (≥ 50이면 옹호로, ≤ −50이면 대항으로 전환. 옹호 중 20 미만, 대항 중 −20 초과가 되면 중립으로 복귀)\n\n옹호 시 군주가 얻는 효과: 영향력 획득 #P +15%#!, 공포 기준치 #P +10#!, 적대적 모략 성공률 #P +10%#!\n대항 시 군주가 받는 효과: 영향력 획득 #N −22.5%#!, 공포 기준치 #N −15#!, 적대적 모략 성공률 #N −15%#!\n\n#weak 한 당의 세력이 조정의 1할에도 못 미치면, 그 향배는 대세에 영향을 주지 않는다.#!"
 HD_PARTY_PANEL_POWER_HUANGUAN: "세력 [Character.MakeScope.Var('hd_party_huanguan_power').GetValue|0] · 비중 [Character.MakeScope.Var('hd_party_huanguan_share').GetValue|0]%"
