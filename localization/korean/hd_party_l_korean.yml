 hd_party_convert_identity_decision: "신분 전환"
 hd_party_convert_identity_decision_desc: "당신의 출신과 이력은 이미 다른 당의 문하로 옮겨 가기에 충분하다. 다만 섬기는 문을 바꾸는 사람은 예전의 동료들에게 변덕스러운 자로 여겨지기 마련이니, 명성이 반드시 손상될 것이다."
 hd_party_convert_identity_decision_tooltip: "조정에서 당신이 속한 신분을 바꾸어, 다른 당의 문하로 옮겨 감"
