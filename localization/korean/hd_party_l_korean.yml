 HD_DEBATE_OPPOSE_OTHER_HOVER: "#T 반대자#!\n본당의 현재 입장을 유지해야 한다고 주장하는 사람."
 hd_party_debate.0010.t: "임박한 조정 논쟁"
 hd_party_debate.0010.desc: "조정 논쟁까지 아직 한 달 남짓 남았으나, 조정에는 이미 물밑의 흐름이 요동치고 있다. 같은 당 사람들은 당신이 앞장서 외치기를 기다리고, 중립의 선비들은 아직 관망하며, 상대의 문객들도 사방으로 분주히 돌아다니고 있다."
 hd_party_debate.0010.a: "같은 당 사람들을 두루 초청하여 함께 대책을 논의한다"
 hd_party_debate.0010.b: "중립의 선비들을 찾아가 뵙는다"
 hd_party_debate.0010.c: "몰래 유언비어를 퍼뜨린다"
 hd_party_debate.0020.t: "경전과 고사를 인용하다"
 hd_party_debate.0020.desc: "[hd_party_debate_rival.GetShortUIName](이)가 《춘추》의 대의를 인용하여 당신을 공격하니, 좌중의 눈길이 모두 당신에게 쏠렸다."
 hd_party_debate.0020.a: "경전의 뜻으로 되받아 따진다"
 hd_party_debate.0021.t: "청의의 성원"
 hd_party_debate.0021.desc: "태학의 제생들이 소식을 듣고 앞다투어 당신을 편들어 주니, 청의의 목소리가 끊이지 않는다."
 hd_party_debate.0021.a: "인심을 쓸 만하다"
 hd_party_debate.0022.t: "주연으로 회유하다"
 hd_party_debate.0022.desc: "당신은 저택에서 연회를 열어 여러 동료를 대접할 생각이다. 술기운이 오르고 귀가 달아오를 즈음이면 지지를 조금 더 얻을 수 있을지도 모른다."
 hd_party_debate.0022.a: "성대한 연회를 열어 동료들을 널리 초청한다"
 hd_party_debate.0022.b: "그럴 필요는 없다"
 hd_party_debate.0023.t: "조정에서의 반박"
 hd_party_debate.0023.desc: "[hd_party_debate_rival.GetShortUIName](이)가 조정에서 공격하며, 당신의 말이 조종의 제도에 어긋난다고 꾸짖었다."
 hd_party_debate.0023.a: "이치를 들어 힘껏 반박한다"
 hd_party_debate.0023.b: "잠시 예봉을 피한다"
 hd_party_debate.0024.t: "조종의 제도를 인용하다"
 hd_party_debate.0024.desc: "반대자들이 잇달아 조상의 성법을 인용하니, 수구의 논리가 한때 우세를 점했다."
 hd_party_debate.0024.a: "잠시 득의하게 놔둔다"
 hd_party_debate.0025.t: "들끓는 여론"
 hd_party_debate.0025.desc: "당하에서 의논이 분분한 가운데, 누군가 참지 못하고 그 자리에서 태도를 밝혔다."
 hd_party_debate.0025.a: "바람의 방향을 지켜보자"
 hd_party_debate.0030.t: "결승의 논쟁"
 hd_party_debate.0030.desc: "논쟁이 결정적인 고비에 이르렀다. 당신은 [hd_party_debate_rival.GetShortUIName](와)과 정면으로 맞붙으니, 승패가 이 한 번에 달렸다."
 hd_party_debate.0030.a: "전력을 다한다"
 hd_party_debate.0031.t: "싸움터에서의 변절"
 hd_party_debate.0031.desc: "조정 논쟁이 한창일 때, 자리에서 누군가 갑자기 일어나 진영을 바꾸었다."
 hd_party_debate.0031.a: "세상일은 알 수 없구나"
 hd_party_debate.0032.t: "소매를 떨치고 떠나다"
 hd_party_debate.0032.desc: "[hd_party_debate_rival.GetShortUIName](이)가 논쟁에서 당해 내지 못하고 소매를 떨치고 떠나니, 반대자들의 기세가 크게 꺾였다."
 hd_party_debate.0032.a: "절묘하도다"
 hd_party_debate.0033.t: "이치로 힘껏 다투다"
 hd_party_debate.0033.desc: "사람들이 반신반의하고 있다. 당신이 자신의 명망을 걸고 보증한다면, 더 많은 이를 설득할 수 있을지도 모른다."
 hd_party_debate.0033.a: "내 한 몸의 명망을 걸고 보증한다"
 hd_party_debate.0033.b: "굳이 그럴 필요는 없다"
 hd_party_debate.0040.t: "조정 논쟁 중"
 hd_party_debate.0040.desc: "조정 논쟁이 한창인데, 당신이 속한 쪽에 도움이 필요하다."
 hd_party_debate.0040.a: "주머니를 털어 돕는다"
 hd_party_debate.0040.b: "명망으로 편을 들어 준다"
 hd_party_debate.0040.c: "변화를 조용히 지켜본다"
 hd_party_debate.0050.t: "군주의 재결을 청하다"
 hd_party_debate.0050.desc: "[host.GetShortUIName](이)가 일으킨 입장 논쟁이 팽팽히 맞서, 양측 모두 당신이 태도를 밝히기를 기다리고 있다. 당신이 입을 열면 승패는 거의 정해질 것이다."
 hd_party_debate.0050.a: "발기인의 말에 일리가 있다"
 hd_party_debate.0050.b: "반대자의 말에 일리가 있다"
 hd_party_debate.0050.c: "가타부타 말하지 않는다"
 hd_party_debate.0090.t: "논쟁 승리"
 hd_party_debate.0090.desc: "조정 논쟁이 당신 측의 승리로 끝났다. 오늘부터 본당은 새 입장을 따른다."
 hd_party_debate.0090.a: "뭇사람의 기대가 모이는 바로다"
 hd_party_debate.0091.t: "논쟁 패배"
 hd_party_debate.0091.desc: "조정 논쟁이 당신 측의 패배로 끝났다. 같은 당 사람들이 당신에게 자못 불만을 품으니, 앞으로 여러 해 동안 당신은 무리를 이끌기 어려울 것이다."
 hd_party_debate.0091.a: "때로다, 운명이로다"
