 hd_party_join_chaos_decision: "난세에 몸을 던지다"
 hd_party_join_chaos_decision_desc: "천하가 크게 어지러우니, 지금이야말로 대장부가 공을 세우고 업을 이룰 때다! 나는 친족과 문생을 거느리고, 가산을 털어 의종을 모아, 군웅축록의 소용돌이에 몸을 던지리라."
