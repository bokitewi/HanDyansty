l_korean:
 # ============================================================
 # 共有传统（2 个）
 # ============================================================
 tradition_zgrc_hua_xia_li_yue_name:0 "화하예악"
 tradition_zgrc_hua_xia_li_yue_desc:0 "복장의 아름다움을 화라 하고 예의의 성대함을 하라 합니다. 이 문화는 황제를 시조로 받들며, 예악으로 존비를 정하고 친소를 가립니다."
 zgrc_hua_xia_li_yue_heritage_discount_desc:0 "이 [culture|E](은)는 본래 화하의 일맥임"
 zgrc_hua_xia_li_yue_alien_penalty_desc:0 "이 [culture|E](은)는 화하의 일맥이 아니므로 먼저 예악과 법도를 익혀야 함"

 culture_parameter_zgrc_huayi_zhibian_effect:0 "[GetTrait('zgrc_hanjia_guandai').GetName( GetNullCharacter )] 해금, 군망 호족들이 서로 통혼하는 경향이 강해짐"
 culture_parameter_zgrc_ruxiang_suisu_effect:0 "인물의 풍속은 출생지에 따라 정해지며, 객지에 오래 머물면 그곳의 풍속을 따르게 됨"

 tradition_zgrc_hou_sheng_shen_si_name:0 "후생신사"
 tradition_zgrc_hou_sheng_shen_si_desc:0 "덕을 바로 하고 쓰임을 이롭게 하여 삶을 두텁게 하고, 조상을 공경하고 먼 조상을 추모하여 죽음을 삼갑니다. 이 문화는 평소에는 참고 절제하며 고향을 떠나기를 꺼리지만, 일단 나라에 환난이 닥치면 온 고을이 함께 일어나 몸을 돌보지 않고 싸웁니다."

 culture_parameter_zgrc_linnan_xiangying_effect:0 "사직이 위태롭거나 옛 땅을 수복할 때, 고을에서 무리를 모아 의병을 일으키고 [GetMaA('zgrc_hanjia_yiyong').GetName] [men_at_arms|E](으)로 찾아옴"
 # ============================================================
 # 区域风俗传统（20 个）
 # ============================================================
 tradition_zgrc_yandan_legacy_name:0 "연단유풍"
 tradition_zgrc_yandan_legacy_desc:0 "남의 위급함을 감히 구하니, 연 태자 단의 유풍입니다. 이 문화의 백성은 의롭고 용감하며 목숨을 가벼이 여겨, 이웃에 환난이 있으면 힘을 다해 달려가 돕고 땅을 지키는 데 결코 남에게 뒤지지 않습니다."
 tradition_zgrc_kangkai_beige_name:0 "강개비가"
 tradition_zgrc_kangkai_beige_desc:0 "장부들이 모여 놀 때면 슬픈 노래를 부르며 비분강개합니다. 이 문화의 백성은 기개가 높고 무를 숭상하며 죽음을 가벼이 여기고 의리를 중히 여기나, 자기 목숨을 아끼지도 않습니다."
 tradition_zgrc_qidi_jinxiu_name:0 "제지금수"
 tradition_zgrc_qidi_jinxiu_desc:0 "얼음같이 흰 비단과 수놓은 비단을 짜내니, 관대와 의복, 신발이 천하에 으뜸이라 일컬어집니다. 이 문화는 직조로 부를 이루고 의관과 복식은 천하가 본받지만, 그 폐단은 사치를 자랑하고 붕당을 짓는 데 있습니다."
 tradition_zgrc_sage_education_name:0 "성인교화"
 tradition_zgrc_sage_education_desc:0 "제나라가 한 번 변하면 노나라에 이르고, 노나라가 한 번 변하면 도에 이릅니다. 이 문화는 공문의 사승을 이어 배우기를 좋아하고 예를 중시하나, 예의 형식은 갖추어도 실질은 부족합니다."
 tradition_zgrc_han_legalist_governance_name:0 "법술치민"
 tradition_zgrc_han_legalist_governance_desc:0 "신불해와 한비자의 엄혹함과 각박한 유풍이 남아 있습니다. 이 문화는 법조문을 좋아하고 관리의 다스림을 중시하며 상벌을 엄정히 하나, 백성들이 송사로 서로 갈라섭니다."
 tradition_zgrc_wenguan_tianxia_name:0 "문관천하"
 tradition_zgrc_wenguan_tianxia_desc:0 "문옹이 가르침을 일으키고 사마상여가 스승이 되었습니다. 이 문화는 풍속에 근심과 고통이 없고 문장으로 이름을 떨치니, 그 글이 천하에 으뜸입니다."
 tradition_zgrc_jizi_legacy_name:0 "기자유교"
 tradition_zgrc_jizi_legacy_desc:0 "기자가 조선으로 가서 백성에게 예의를 가르쳤습니다. 이 문화의 백성은 서로 도둑질하지 않고 부녀자는 정절과 신의를 지키며, 온순하여 관리와 백성이 서로 편안합니다."
 tradition_zgrc_luhai_haoyou_name:0 "육해호우"
 tradition_zgrc_luhai_haoyou_desc:0 "육지의 바다라 불리니 구주에서 가장 기름진 땅입니다. 이 문화는 사방의 사람들이 뒤섞여 살며 세가는 예문을 좋아하고 호걸은 협기를 부리니, 풍속이 순일하지 않습니다."

 tradition_zgrc_hexi_pastoral_frontier_name:0 "하서목정"
 tradition_zgrc_hexi_pastoral_frontier_desc:0 "물과 풀이 목축에 알맞아 양주의 가축은 천하에 가장 풍족합니다. 이 문화는 마정으로 변경을 지키며, 곡식이 싸고 도둑이 적어 관리와 백성이 서로 친밀합니다."
 tradition_zgrc_frontier_chivalry_name:0 "변지임협"
 tradition_zgrc_frontier_chivalry_desc:0 "기개를 숭상하고 협기를 부리며 원수를 갚음에 지나치게 곧습니다. 이 문화의 백성은 검과 의리로 몸을 세우고 작은 원한도 반드시 갚지만, 은혜와 예를 가벼이 여기고 쉽게 갈라섭니다."
 tradition_zgrc_zheng_wei_music_name:0 "정위지음"
 tradition_zgrc_zheng_wei_music_desc:0 "뽕나무 사이와 복수 가에서 남녀가 자주 모여듭니다. 이 문화는 연회와 음악을 서로 숭상하고 교유가 풍조를 이루지만, 그 폐단은 혼례와 장례가 지나치게 호사스러운 데 있습니다."
 tradition_zgrc_wu_gui_fangshu_name:0 "무귀방술"
 tradition_zgrc_wu_gui_fangshu_desc:0 "제사를 좋아하고 사관과 무당을 부리니 그 풍속이 귀신을 섬깁니다. 이 문화는 사당과 제사가 널리 퍼져 있고 무격이 줄지어 나오며, 저주의 술법도 그 사이에서 은밀히 행해집니다."
 tradition_zgrc_merchant_hubs_name:0 "상고통구"
 tradition_zgrc_merchant_hubs_desc:0 "도회지에 사람과 재화가 모여듭니다. 이 문화의 백성은 장사를 좋아하여 사방으로 이익을 쫓지만, 재물을 귀히 여기고 의리를 천히 여기며 부자를 높이고 가난한 자를 낮춥니다."
 tradition_zgrc_classics_literature_name:0 "경술문장"
 tradition_zgrc_classics_literature_desc:0 "경학을 좋아하고 공명을 자랑하며, 느긋하고 활달하면서도 지혜가 풍부합니다. 이 문화는 글 읽는 소리가 끊이지 않고 저술에 힘써, 문교가 사방으로 퍼져 나갑니다."
 tradition_zgrc_hunting_warfare_name:0 "사렵전비"
 tradition_zgrc_hunting_warfare_desc:0 "융적과 가까이 맞닿아 전쟁 대비를 익히고 사냥을 으뜸으로 여깁니다. 이 문화는 활쏘기와 말타기에 능숙하고 명장이 줄지어 나오지만, 질박하고 예문이 부족합니다."
 tradition_zgrc_wuyue_swordsmanship_name:0 "오월검풍"
 tradition_zgrc_wuyue_swordsmanship_desc:0 "그 임금이 용맹을 좋아하니 그 백성은 검 쓰기를 좋아합니다. 이 문화는 죽음을 가벼이 여기고 쉽게 격발하며, 검객이 줄지어 나와 장수끼리 맞붙는 기풍이 동남에서 으뜸입니다."
 tradition_zgrc_jingchu_watermanship_name:0 "형초수향"
 tradition_zgrc_jingchu_watermanship_desc:0 "강수와 한수의 풍부한 하천과 늪, 삼강오호의 이로움이 있습니다. 이 문화는 배를 말처럼 부리고 고기잡이와 벼농사로 자급하며, 수전에서 지리의 이점을 모두 누립니다."
 tradition_zgrc_zhongyuan_houtu_name:0 "중원후토"
 tradition_zgrc_zhongyuan_houtu_desc:0 "하락의 땅으로 백성의 성품이 무겁고 두텁습니다. 이 문화는 진열이 엄정하고 산처럼 굳게 지키니, 변경 경기병의 날래고 빠름과 서로 표리를 이룹니다."
 tradition_zgrc_grain_storage_name:0 "복전역색"
 tradition_zgrc_grain_storage_desc:0 "농사짓기를 좋아하고 의식을 검소하게 하여 저축을 이룹니다. 이 문화는 근본인 농사에 힘써 창고에 비축이 있으니 흉년에도 굶주림이 없습니다."
 tradition_zgrc_baoyuan_shouyi_name:0 "포원수일"
 tradition_zgrc_baoyuan_shouyi_desc:0 "근원을 품고 하나를 지키며 맑고 고요하게 욕심을 적게 합니다. 이 문화는 황로의 도를 흠모하여 복식과 도인, 방약으로 양생하니 마음이 맑고 장수합니다."
