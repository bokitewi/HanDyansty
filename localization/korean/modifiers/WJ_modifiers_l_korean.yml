 # 来源：localization/simp_chinese/WJ_office_roads_loc_l_simp_chinese.yml
 dynasty_celestial_favor_interaction_modifier:0 "천자의 은택"
 WJ_bizhao_modifier:0 "벽소"
 WJ_bizhao_modifier_desc:0 "이 인물은 부주의 벽소로 막부에 들어가 벼슬길에 나섰으며, 천거한 이를 은사로 받듭니다."
 WJ_maocai_modifier:0 "무재 천거"
 WJ_maocai_modifier_desc:0 "이 인물은 무재로 천거된 적이 있어 그 재명이 주군에서 중히 여겨지며, 벼슬길이 남보다 순탄합니다."
 WJ_refused_bizhao_modifier:0 "징벽 거절"
 WJ_refused_bizhao_modifier_desc:0 "이 인물은 벽소를 사양한 적이 있어, 한때의 영화를 탐하지 않았기에 오히려 명성이 더 높아졌습니다."
 WJ_temp_official_modifier:0 "가리 시수"
 WJ_temp_official_modifier_desc:0 "이 인물은 벽소, 효렴, 무재 출신 없이 먼저 실직을 맡아 가리로 시수할 수밖에 없습니다. 봉급이 보잘것없고 동료들 사이에서도 꽤 업신여김을 받습니다."
