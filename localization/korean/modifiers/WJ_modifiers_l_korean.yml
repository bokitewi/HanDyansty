 # 来源：localization/replace/simp_chinese/WJ_xiaolian_direct_qualification_l_simp_chinese.yml
 WJ_xiaolian_modifier_desc:0 "이 인물은 효렴으로 천거되어 정식으로 벼슬길에 나설 출신을 갖추었습니다."

 # 来源：localization/simp_chinese/WJ_district_orders_l_simp_chinese.yml
 WJ_dd_execution_modifier:0 "참장제기"
 WJ_dd_execution_modifier_desc:0 "군법으로 대오를 엄숙히 다잡아 위령이 군중에 행해집니다."
 WJ_dd_public_crime_modifier:0 "군법 위반"
 WJ_dd_public_crime_modifier_desc:0 "이 인물은 군법을 범한 적이 있어 죄명이 기록에 남아 있으며, 아직 사면받지 못했습니다."

 # 来源：localization/simp_chinese/WJ_kaoke_duties_l_simp_chinese.yml
 wj_kaoke_duties_boundaries_modifier:0 "경계 명확"
 wj_kaoke_duties_boundaries_modifier_desc:0 "옛 문서와 논밭 경계가 공정하게 확정되어, 백성들이 다시 관부가 공정하게 일을 처리할 수 있다고 믿게 되었습니다."
 wj_kaoke_duties_exactions_modifier:0 "가렴으로 백성을 해침"
 wj_kaoke_duties_exactions_modifier_desc:0 "관부가 세곡, 토지 송사, 부역을 빌미로 이익을 챙겨 백성들이 관부에 원망을 품게 되었습니다."
 wj_kaoke_duties_post_roads_modifier:0 "역역의 질서"
 wj_kaoke_duties_post_roads_modifier_desc:0 "운송과 부역이 적절히 배치되어 전사가 원활히 돌아가고, 농가도 농사철을 지킬 수 있었습니다."
 wj_kaoke_duties_relief_modifier:0 "재해 확인과 구휼"
 wj_kaoke_duties_relief_modifier_desc:0 "지방관이 재해 상황을 확인하여 재해를 입은 집들이 추가 부담을 면하니, 향리가 안심하고 농사지을 수 있게 되었습니다."

 # 来源：localization/simp_chinese/WJ_kaoke_l_simp_chinese.yml
 WJ_kaoke_bad_modifier:0 "고과 열등"
 WJ_kaoke_bad_modifier_desc:0 "고과부에 기록된 바, 잘못이 잘한 것보다 많습니다. 유사가 그의 봉급을 깎고 관리 기강을 바로잡게 했습니다."
 WJ_kaoke_poor_modifier:0 "고과 하등"
 WJ_kaoke_poor_modifier_desc:0 "유사가 일을 다스림이 미진하다고 질책하여, 그 성과를 지켜보기 위해 현망과 봉급을 잠시 억제했습니다."

