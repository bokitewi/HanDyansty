l_korean:
 quix_murder_outcome.4018.exposed_scheme:0 "\n\n공교롭게도 당신은 몸을 돌리다가 대들보에 머리를 정통으로 들이받았다! 눈앞에 별이 번쩍하여 당신은 바닥에 주저앉아 멍하니 있었다. [target.GetName](이)가 침상에서 일어나 앉아 믿을 수 없다는 듯 당신을 노려보았고, 두 사람은 한참 동안 서로 눈을 마주쳤다. 밖에서 어지러운 발소리가 들려오고서야 당신은 정신을 차리고 비틀거리며 창문을 넘어 달아났다. 그 한 번의 눈길로 [target.GetSheHe](은)는 이미 당신의 얼굴을 똑똑히 알아보았다. 상대가 사냥개를 풀어 당신을 쫓게 하니, 당신은 진흙 늪 속에서 하룻밤을 숨어 지낼 수밖에 없었다!"
 quix_seduce_outcome.2010.b:0 "흡족하기 그지없으니, 하룻밤이면 족하다."
 quix_seduce_outcome.2301.a.tt:0 "이후로 그 집에는 밤마다 찾아오는 이가 자주 있게 되었습니다."
 quix_seduce_outcome.3301.a.tt:0 "이후로 그 집의 등불은 자주 날이 밝을 때까지 켜져 있게 되었습니다."
 quix_seduce_outcome.2030.a.desc:0 "당신과 [target.GetTitledFirstName](은)는 서로가 무엇을 원하는지 잘 알고 있으니, 더 떠보는 것은 아무런 의미가 없었다. 심복이 두 사람을 위해 아무도 방해하지 않는 곳을 찾아 주었다."
 quix_seduce_outcome.2030.alcohol.desc:0 "술 몇 잔이 들어가자, 두 사람은 더욱 거리낌이 없어졌다."
 quix_seduce_outcome.2030.b.desc:0 "\n\n당신이 막 속마음을 털어놓으려 하자, [target.GetFirstName](이)가 손가락 하나를 뻗어 당신의 입술을 눌렀다. 그 뒤의 만남은 뜨겁고 거침없었으며, 누구도 약속 따위는 다시 꺼내지 않았다."
 quix_seduce_outcome.2302.desc_court_owner:0 "당신과 [target.GetTitledFirstName](은)는 너무 멀리 떨어져 있어 좀처럼 기회를 찾을 수 없었다. 그래서 당신은 명산에 제사를 지내러 간다는 핑계를 대고, 길에서 행색을 바꾸어 [target.GetTitledFirstNamePossessive] 저택에 숨어들어, 하인들이 묵는 곁채에 몸을 숨겼다."
 quix_seduce_outcome.2302.desc_end:0 "\n\n두 사람은 밤을 틈타 반나절 동안 이야기를 나누었으나, 누구도 찾아온 뜻을 드러내지 않았다. 그러나 각자 흩어진 뒤, [target.GetFirstName](이)가 다시 살며시 당신의 침상 곁으로 더듬어 왔다."
 quix_seduce_outcome.2302.desc_not_court_owner:0 "당신과 [target.GetTitledFirstName](은)는 너무 멀리 떨어져 있어 좀처럼 기회를 찾을 수 없었다. 그래서 당신은 명산에 제사를 지내러 간다는 핑계를 대고, 길에서 [target.GetSheHe](이)가 머무는 저택을 수소문하여, 하인으로 꾸미고 숨어들어 곁채에 몸을 숨겼다."
 quix_seduce_outcome.3023.b:0 "오늘 밤의 일은 이곳에 남겨 두자."
 quix_seduce_outcome.3030.a.desc:0 "당신과 [owner.GetTitledFirstName](은)는 서로가 무엇을 원하는지 잘 알고 있으니, 더 떠보는 것은 아무런 의미가 없었다. 심복이 두 사람을 위해 아무도 방해하지 않는 곳을 찾아 주었다."
 quix_seduce_outcome.3030.alcohol.desc:0 "술 몇 잔이 들어가자, 두 사람의 얼굴에 모두 홍조가 떠올랐다."
 quix_seduce_outcome.3030.b.desc:0 "\n\n[owner.GetSheHe|U](이)가 막 속마음을 털어놓으려 하자, 당신이 손가락 하나를 뻗어 [owner.GetHerHis] 입술을 눌렀다. 그 뒤의 만남은 뜨겁고 거침없었으며, 누구도 약속 따위는 다시 꺼내지 않았다."
 quix_seduce_outcome.3031.a.desc:0 "연회석에는 사람들이 오가니, 당신과 [owner.GetTitledFirstName](은)는 끝내 속 깊은 이야기를 몇 마디 나누지 못했다. [owner.GetSheHe|U](이)가 갑자기 당신의 귓가로 다가와, 함께 자리를 뜨자고 낮게 제안했다."
 quix_seduce_outcome.3031.alcohol.desc:0 "당신은 술기운을 빌려 생각할 것도 없이 고개를 끄덕였다."
 quix_seduce_outcome.3031.b.desc:0 "\n\n두 사람은 사람들의 눈을 피해 연회석을 빠져나왔다. 사람들에게서 멀어진 뒤에야 당신은 밤새 이런 기회를 찾고 있었다고 털어놓았다. 두 사람은 마침내 더 이상 숨기지 않아도 되었다."
 quix_seduce_outcome.3302.desc_court_owner:0 "이번에는 [owner.GetSheHe](이)가 뜻밖에도 제사를 지내러 간다는 핑계를 대고, 길에서 행색을 바꾸어 당신의 저택에 숨어들어, 하인들이 묵는 곁채에 몸을 숨겼다."
 quix_seduce_outcome.3302.desc_end:0 "\n\n두 사람은 밤을 틈타 반나절 동안 이야기를 나누었으나, 누구도 찾아온 뜻을 드러내지 않았다. 그러나 각자 흩어진 뒤, 당신은 다시 마음을 바꾸어 살며시 [owner.GetFirstName]의 침상 곁으로 더듬어 갔다."
 quix_seduce_outcome.3302.desc_not_court_owner:0 "이번에는 [owner.GetSheHe](이)가 뜻밖에도 제사를 지내러 간다는 핑계를 대고, 길에서 당신이 머무는 저택을 수소문하여, 하인으로 꾸미고 숨어들어 왔다."
 quix_seduce_outcome.3302.desc_opening:0 "[owner.GetTitledFirstName](은)는 줄곧 당신에게 마음이 있었으나, 두 사람은 너무 멀리 떨어져 있었다."
