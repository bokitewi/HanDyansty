l_korean:
 quix_murder_outcome.1001.t:0 "객사의 밤불"
 quix_murder_outcome.1001.d:0 "당신의 공모자가 알아낸 바에 따르면, [target.GetTitledFirstName](은)는 이번 길에 길가의 한 객사에서 묵을 예정이다. 그 객사는 기둥과 대들보가 모두 오래 썩은 나무이고, 처마 밑에는 땔나무와 짚이 잔뜩 쌓여 있으니, 한밤중에 불씨 하나만 던지면 [target.GetSheHe](은)는 날개가 있어도 빠져나가지 못할 것이다. 날이 밝으면 모두 그저 불이 난 줄로만 알 것이다."
 quix_murder_outcome.1001.a:0 "한 횃불로 태워 버린다."
 quix_murder_outcome.1001.b:0 "그 객사는 내가 자주 묵는 곳이니, 그만두자."
 quix_murder_outcome.1002.t:0 "누각 위의 암전"
 quix_murder_outcome.1002.d:0 "[target.GetTitledFirstName](은)는 매일 오후 늘 홀로 난간에 기대어 누대 위에 한참 동안 서 있곤 한다. 마침 길 건너편에 주막이 하나 있어, 그 위층에 궁수 한 명을 숨길 수 있다. 두 곳의 거리가 멀지 않으니, 화살 한 대면 이 일을 끝낼 수 있다."
 quix_murder_outcome.1002.a:0 "활 잘 쏘는 자를 불러오라."
 quix_murder_outcome.1002.b:0 "[target.GetFirstNameNoTooltip]에게는 이렇게 시원하게 죽을 자격도 없다."
 quix_murder_outcome.1003.t:0 "한 병의 좋은 술"
 quix_murder_outcome.1003.d:0 "[target.GetName](이)가 술을 즐긴다는 것은 누구나 안다. 귀한 좋은 술 한 동이를 마련하여 몰래 독을 탄 뒤, 흠모하는 자의 이름을 빌려 보내면 된다."
 quix_murder_outcome.1003.a:0 "이 선물은 그의 마음에 쏙 들 것이다."
 quix_murder_outcome.1003.b:0 "이 짐독 술은 훗날을 위해 남겨 두자."
 quix_murder_outcome.1004.t:0 "걷기 힘든 밤길"
 quix_murder_outcome.1004.d:0 "당신의 공모자가 [target.GetName]에게 밤에 홀로 산책하는 습관이 있음을 알아냈다. 미리 길가에 매복해 두기만 하면, [target.GetHerHim](을)를 소리 없이 사라지게 할 수 있다."
 quix_murder_outcome.1004.a:0 "그가 두려워하는 얼굴을 볼 사람이 없다는 것이 아쉽구나."
 quix_murder_outcome.1004.b:0 "이 계책은 너무 쉽다. 더 묘한 방법이 있을 것이다."
 quix_murder_outcome.1005.t:0 "위태로운 담장 아래"
 quix_murder_outcome.1005.d:0 "[target.GetName](은)는 자주 성벽 아래 뜰에서 잠시 쉰다. 그 성벽 구간은 오래도록 손보지 않았으니, 미리 큰 돌 몇 개를 헐겁게 해 두기만 하면 돌이 떨어질 때 마침 [target.GetHerHim]의 몸 위로 내리칠 것이다."
 quix_murder_outcome.1005.a:0 "가서 성벽의 돌을 헐겁게 하라."
 quix_murder_outcome.1005.b:0 "[target.GetFirstNameNoTooltip] 따위를 위해 내 성벽을 허무는 것은 가치가 없다."
 quix_murder_outcome.1006.t:0 "문을 열어 도적을 들이다"
 quix_murder_outcome.1006.d:0 "[target.GetTitledFirstName]의 저택 하인 하나가 당신의 돈을 받고, 밤에 당신의 사람들을 위해 침실 문을 열어 주기로 했다. 이자가 약속만 지킨다면, [target.GetSheHe](은)는 오늘 밤을 넘기지 못할 것이다."
 quix_murder_outcome.1006.a:0 "이 종놈의 입만 막으면 된다."
 quix_murder_outcome.1006.b:0 "함정일까 두려우니, 안 된다."
 quix_murder_outcome.1007.t:0 "땅굴을 파고 밤에 습격하다"
 quix_murder_outcome.1007.d:0 "[target.GetTitledFirstName]의 거처로 곧장 통하는 은밀한 땅굴이 하나 있다. 당신의 사람들은 땅굴로 잠입하여 문 앞의 호위를 제압하고 [target.GetHerHim](을)를 죽인 뒤, 온 길로 되돌아 철수할 계획이다."
 quix_murder_outcome.1007.a:0 "장하도다 그대들이여, 하늘이 도우시기를!"
 quix_murder_outcome.1007.b:0 "이 계책은 너무 위험하니, 신중히 행해야 한다."
 quix_murder_outcome.1008.t:0 "밤길의 기마 습격"
 quix_murder_outcome.1008.d:0 "[target.GetName](은)는 곧 인근 성읍에 갈 예정이며, 돌아오는 길에는 틀림없이 날이 저물어 있을 것이다. 당신의 사람들은 빠른 말을 타고 길 중간에서 [target.GetHerHim](을)를 가로막아 죽인 뒤, 추격병이 오기 전에 멀리 달아날 수 있다."
 quix_murder_outcome.1008.a:0 "가장 말을 잘 타는 자를 보내, 나의 가장 빠른 말을 타게 하라."
 quix_murder_outcome.1008.b:0 "이 계책은 너무 비열하니, 하지 않겠다."
 quix_murder_outcome.1009.t:0 "가짜 의원"
 quix_murder_outcome.1009.d:0 "[target.GetTitledFirstName](은)는 폄석으로 피를 뽑아 병을 고치기로 이름난 의원을 모셔 오려 하고 있는데, 오간 서신이 이미 당신의 손에 들어왔다. 사람을 보내 그 이름을 사칭하고 약속에 나가게 하기만 하면, [target.GetSheHe](은)는 제 손으로 목숨을 내놓게 될 것이다."
 quix_murder_outcome.1009.a:0 "[target.GetTitledFirstNameNoTooltip](이)가 스스로 그물에 들어오는구나. 계획대로 하라."
 quix_murder_outcome.1009.b:0 "혹시 도리어 [target.GetHerHim](을)를 고쳐 버리면 어찌하는가?"
 quix_murder_outcome.1010.t:0 "나면의 자객"
 quix_murder_outcome.1010.d:0 "성안에서 곧 대나 의식이 열리는데, [target.GetTitledFirstName](이)가 나희를 구경하고 연회에 참석할 예정이다. 그때가 되면 마당 가득 나면을 쓴 춤꾼들이 있을 테니, 당신의 사람들은 가면을 쓰고 그 속에 섞여 들기만 하면 의심을 사지 않고 [target.GetHerHim]의 곁까지 다가갈 수 있다."
 quix_murder_outcome.1010.a:0 "나희이니, 여럿을 보내 함께 춤추게 하라."
 quix_murder_outcome.1010.b:0 "너무 쉽다. 함정일까 두렵다."
 quix_murder_outcome.1011.t:0 "호인 손님"
 quix_murder_outcome.1011.d:0 "당신의 공모자가 먼 곳에서 온 호인 무사 하나와 안면을 텄다. 이자는 무예가 뛰어나고 자취를 감추는 데에도 익숙하니, 값만 맞으면 [target.GetTitledFirstName]의 목숨을 거두는 것쯤은 문제없을 것이다."
 quix_murder_outcome.1011.a:0 "이 땅에 아무 연고가 없는 자를 고용하는 것이 좋겠다."
 quix_murder_outcome.1011.b:0 "일이 중대하니, 낯선 이에게 맡길 수 없다."
 quix_murder_outcome.1012.t:0 "사나운 개를 부추기다"
 quix_murder_outcome.1012.d:0 "[target.GetName](은)는 들판을 홀로 거니는 것을 좋아한다. 당신의 사람들은 잘 길들인 사나운 개 몇 마리를 풀어놓고, [target.GetHerHis] 죽음을 들짐승을 만난 탓으로 꾸밀 수 있다."
 quix_murder_outcome.1012.a:0 "가장 사나운 놈을 골라 며칠 굶겨라."
 quix_murder_outcome.1012.b:0 "짐승의 일은 믿을 것이 못 된다."
 quix_murder_outcome.1013.t:0 "온천"
 quix_murder_outcome.1013.d:0 "[target.GetName](은)는 자주 홀로 성 밖의 온천에 가서 목욕을 한다. 그곳에는 호위가 없고, [target.GetSheHe]의 몸에도 병기가 없으니, 손을 쓰기에 좋은 때다."
 quix_murder_outcome.1013.a:0 "온천에서 목숨을 잃었다는 소식을 조용히 기다리겠다."
 quix_murder_outcome.1013.b:0 "내 마음에 불길한 예감이 든다."
 quix_murder_outcome.1014.t:0 "강가에서의 우연한 만남"
 quix_murder_outcome.1014.d:0 "당신은 길에서 우연히 [target.GetName](이)가 홀로 강기슭에 서 있는 것을 마주쳤다. 물살은 거세고 사방에 아무도 없다. 뒤에서 한 번 밀기만 하면 된다."
 quix_murder_outcome.1014.a:0 "[target.GetTitledFirstNameNoTooltip](을)를 배웅해 주는 것이 좋겠군."
 quix_murder_outcome.1014.b:0 "좋은 기회이기는 하나, 내 손에 피를 묻힐 수는 없다."
 quix_murder_outcome.1015.t:0 "대낮의 암살"
 quix_murder_outcome.1015.d:0 "당신은 이미 오래 기다렸다. 더 교묘한 방법이 떠오르지 않으니, 사람을 보내 길거리에서 [target.GetTitledFirstName](을)를 습격해 죽이게 한다. 이 방법은 간단하지만, 그만큼 감추기도 가장 어렵다."
 quix_murder_outcome.1015.a:0 "자객에게 즉시 손을 쓰라 명하라."
 quix_murder_outcome.1015.b:0 "안 된다. 따로 만전의 계책을 세워야 한다."
 quix_murder_outcome.1016.t:0 "거짓 명령으로 체포하다"
 quix_murder_outcome.1016.d:0 "당신의 사람들은 문서 한 통을 위조하여 명을 받들어 체포한다고 속이고, 길거리에서 [target.GetTitledFirstName](을)를 끌고 갈 계획이다. 구경꾼과 호위만 속일 수 있다면, [target.GetHerHim](을)를 아무도 묻지 않는 곳으로 끌고 가 처리할 수 있다."
 quix_murder_outcome.1016.a:0 "이 계책은 할 만하다."
 quix_murder_outcome.1016.b:0 "이 계책은 안 된다."
 quix_murder_outcome.1017.t:0 "취전"
 quix_murder_outcome.1017.d:0 "당신의 사람들이 남중 만이의 기묘한 병기 하나를 손에 넣었다. 대롱 하나로, 멀리서 가느다란 바늘을 불어 날릴 수 있는 것이다. 바늘에 독만 묻히면 가까이 다가가지 않고도 [target.GetName]의 목숨을 거둘 수 있다."
 quix_murder_outcome.1017.a:0 "절묘하구나, 이 물건은."
 quix_murder_outcome.1017.b:0 "큰일을 어찌 빈 대나무 토막 하나에 맡기겠는가!"
 quix_murder_outcome.1018.t:0 "손수 비수를 쥐다"
 quix_murder_outcome.1018.d:0 "공모자들이 이러쿵저러쿵 다투는 소리를 당신은 이미 들을 만큼 들었다. [target.GetTitledFirstName](이)가 어디서 자는지 알고 있으니, 직접 창문을 넘어 들어가 [target.GetSheHe](이)가 깨기 전에 단번에 끝장낼 수도 있다."
 quix_murder_outcome.1018.a:0 "내 두건과 비수를 가져오라!"
 quix_murder_outcome.1018.b:0 "만에 하나 들통나면 몸과 이름을 모두 잃을 것이니, 안 된다."
 quix_murder_outcome.1019.t:0 "벙어리 역사"
 quix_murder_outcome.1019.d:0 "몸집이 크고 건장한 타향의 각저 역사 하나가 생계를 찾아 당신의 땅으로 흘러들어 왔다. 이자는 이곳 말을 알지 못하고, 옛 상처 때문에 입으로 말을 하지 못하니, 당신 대신 그 소리 없는 일을 맡아 [target.GetTitledFirstName](을)를 없애기에 안성맞춤이다."
 quix_murder_outcome.1019.a:0 "이자는 기꺼이 나의 쓰임이 될 것이다!"
 quix_murder_outcome.1019.b:0 "이런 거친 자에게 큰일을 맡기기는 어렵다."
 quix_murder_outcome.1020.t:0 "탐환의 무리"
 quix_murder_outcome.1020.d:0 "당신의 공모자가 수상한 여항의 젊은이 무리와 줄이 닿았다. 이들은 돈을 받고 사람을 죽이는데, 손쓰기 전에 함께 구슬을 더듬어 뽑아, 뽑힌 구슬에 따라 누구를 죽일지 정하며 단 한 번도 실패한 적이 없다. 그들은 당신 대신 [target.GetTitledFirstName](을)를 없앨 수 있다고 자부한다. 당신은 그들에 대해 아는 것이 거의 없지만, 일을 깔끔하게 처리한다는 그들의 명성은 과연 헛소문이 아니다."
 quix_murder_outcome.1020.a:0 "이토록 수상하니, 오히려 일을 해낼 수 있을지 보고 싶군."
 quix_murder_outcome.1020.b:0 "이토록 수상하니, 마음이 놓이지 않는다."
 quix_murder_outcome.2001.t:0 "객사의 밤불"
 quix_murder_outcome.2001.opening_1:0 "[target.GetName](은)는 불바다 속에서 목숨을 잃었다."
 quix_murder_outcome.2001.opening_2:0 "불이 예상보다 일찍 일어나자, 불을 지른 자는 아예 투숙객 몇 명을 [target.GetName](와)과 함께 문 안에 가두어 버렸다. 하필 [target.GetSheHe](이)가 그날 밤 이곳에 묵은 것을 탓할 수밖에."
 quix_murder_outcome.2001.opening_3:0 "큰불이 꼬박 하룻밤 동안 타올라, 그 객사를 잿더미로 만들어 버렸다. [target.GetName](은)는 달아날 기회조차 없었다."
 quix_murder_outcome.2001.heh:0 "\n\n하늘을 찌르던 불길을 떠올리니, 당신은 뜻밖에도 조금 아름다웠다고 느낀다."
 quix_murder_outcome.2001.owner_is_known_1:0 "\n\n그러나 모두가 이 “실화”를 당신이 꾸민 일이라고 굳게 믿고 있다."
 quix_murder_outcome.2001.owner_is_known_2:0 "\n\n누가 소문을 흘렸는지 모르지만, 이제 거리와 골목마다 당신이 [target.GetTitledFirstName]의 목숨을 앗아 갔다는 말이 돌고 있다."
 quix_murder_outcome.2001.no_awareness_1:0 "\n\n다행히 객사가 기와 한 조각 남지 않고 타 버려, 아무도 당신을 의심하지 않는다."
 quix_murder_outcome.2001.no_awareness_2:0 "\n\n불을 지른 자를 본 이들은 모두 그 객사와 함께 재가 되었다."
 quix_murder_outcome.2001.a.discovered:0 "불을 지른 자는 미치광이일 뿐, 나와 무슨 상관이냐!"
 quix_murder_outcome.2001.a:0 "앞으로는 침상 곁에 늘 물독을 두어야겠다."
 quix_murder_outcome.2002.t:0 "누각 위의 암전"
 quix_murder_outcome.2002.opening_1:0 "듣자 하니 그 화살이 [target.GetName]의 목구멍에 정통으로 꽂혀, [target.GetSheHe](은)는 자기 피에 숨이 막혀 죽었다고 한다."
 quix_murder_outcome.2002.opening_2:0 "듣자 하니 [target.GetName](은)는 화살에 맞은 뒤 난간을 넘어 누각에서 곧장 떨어졌는데, 마침 지나가던 짐수레 위에 떨어졌다고 한다……"
 quix_murder_outcome.2002.opening_3:0 "[target.GetName](은)는 배에 화살을 맞고 다친 몸을 끌고 방 안으로 기어 돌아갔으나, 얼마 지나지 않아 상처가 깊어 숨을 거두었다."
 quix_murder_outcome.2002.owner_is_known_1:0 "\n\n안타깝게도 궁수가 붙잡혀 당신을 불어 버렸다."
 quix_murder_outcome.2002.owner_is_known_2:0 "\n\n그 한 발이 너무도 훌륭했던 탓에 궁수 자신이 우쭐해져서, 만나는 사람마다 당신이 거금을 들여 [target.GetTitledFirstName]의 목숨을 거두게 했다고 자랑하고 다녔다!"
 quix_murder_outcome.2002.no_awareness_1:0 "\n\n눈 밝은 이라면 누구나 이것이 암살임을 알아보았지만, 주모자가 당신이라고 짐작한 사람은 없었다."
 quix_murder_outcome.2002.no_awareness_2:0 "\n\n무엇보다 중요한 것은, 궁수가 깨끗하게 빠져나갔다는 점이다."
 quix_murder_outcome.2002.a.discovered:0 "나는 당나귀를 쏘라고 했을 뿐인데, 이런 오해가 생길 줄이야!"
 quix_murder_outcome.2002.a:0 "오늘 밤은 누각에 오르지 않겠다."
 quix_murder_outcome.2003.t:0 "한 병의 좋은 술"
 quix_murder_outcome.2003.opening_1:0 "[target.GetName](은)는 어젯밤 잠든 채로 죽었다."
 quix_murder_outcome.2003.opening_2:0 "듣자 하니 [target.GetTitledFirstName](은)는 취한 뒤 정신이 혼미해져 몇 시진 동안 미쳐 날뛰다가, 마지막에는 피를 토하고 죽었다고 한다."
 quix_murder_outcome.2003.opening_3:0 "[target.GetTitledFirstName](이)가 죽었다. 임종 전 몇 시진은 말할 수 없이 고통스러웠으니, 비명을 지르고 피를 토하고 미친 듯이 울부짖었다."
 quix_murder_outcome.2003.owner_is_known_1:0 "\n\n나쁜 소식은, 술을 전한 자가 당신을 끌어들였다는 것이다. 고문을 하기도 전에 그는 모든 것을 자백했다."
 quix_murder_outcome.2003.owner_is_known_2:0 "\n\n당신은 치명적인 실수를 저질렀다. 술동이 바닥에 당신 집안의 이름이 새겨져 있었던 것이다. 실로 어리석기 짝이 없다."
 quix_murder_outcome.2003.no_awareness_1:0 "\n\n이것이 살인이라고 의심하는 사람은 없는 듯하며, 당신을 의심하는 사람은 더더욱 없다."
 quix_murder_outcome.2003.no_awareness_2:0 "\n\n가담한 자들이 모두 입을 굳게 다물고 있어, 당신이 맡은 역할은 아무도 모른다."
 quix_murder_outcome.2003.a.discovered:0 "그 술에 독이 있었다고? 다행히 나는 마시지 않았구나!"
 quix_murder_outcome.2003.a:0 "결국 술을 탐하다 죽었구나."
 quix_murder_outcome.2004.t:0 "걷기 힘든 밤길"
 quix_murder_outcome.2004.opening_1:0 "[target.GetName](이)가 늘 하던 대로 저녁 무렵 산책을 나서자, 당신의 자객이 단도를 쥐고 어둠 속에서 덮쳤다. [target.GetTitledFirstName](은)는 다리를 들어 달아나려 했으나, 어둠 속에서 부딪혀 쓰러지고 칼 한 번에 목숨을 잃었다."
 quix_murder_outcome.2004.opening_2:0 "[target.GetTitledFirstName](이)가 미처 정신을 차리기도 전에, 차가운 칼날이 이미 [target.GetHerHis] 목구멍을 찔렀다. 잠시 뒤 [target.GetSheHe](은)는 자기 피 웅덩이 속에 쓰러졌다."
 quix_murder_outcome.2004.opening_3:0 "자객은 어둠 속에서 [target.GetTitledFirstName](을)를 내내 뒤따랐다. [target.GetSheHe](은)는 낌새를 채고 허둥지둥 길을 가리지 않고 황야로 달아났지만, 끝내 헛수고였다. 자객이 뒤쫓아 가서 등 뒤에서 매섭게 칼을 찔러 넣었다."
 quix_murder_outcome.2004.owner_is_known_1:0 "\n\n안타깝게도 일이 순조롭지만은 않았다. 근처에서 밤 순찰을 돌던 정졸이 그 자리에서 자객을 붙잡았다. 머지않아 모두가 당신이 연루되었음을 알게 될 것이다."
 quix_murder_outcome.2004.owner_is_known_2:0 "\n\n얼마 지나지 않아 시신이 발견되었고, 자객도 붙잡혀 당신의 이름을 털어놓았다."
 quix_murder_outcome.2004.no_awareness_1:0 "\n\n자객은 내친김에 [target.GetTitledFirstName]의 돈주머니까지 털어 갔으니, 겉보기에는 재물을 노린 흔한 강도 살인 사건에 지나지 않는다."
 quix_murder_outcome.2004.no_awareness_2:0 "\n\n자객은 밤의 어둠을 틈타 유유히 빠져나갔고, 현장에는 점점 식어 가는 시신 한 구만 남았다."
 quix_murder_outcome.2004.a.discovered:0 "밤길이 험하니, 이런 횡액도 피하기 어려운 법이지."
 quix_murder_outcome.2004.a:0 "좋다, 밤길은 과연 걷기 힘들구나."
 quix_murder_outcome.2005.t:0 "위태로운 담장 아래"
 quix_murder_outcome.2005.opening_1:0 "떨어진 돌이 머리 위로 내리꽂혀, [target.GetTitledFirstName](은)는 그 자리에서 즉사했다. 죽을 때까지도 자신이 어떻게 죽는지 알지 못했다."
 quix_murder_outcome.2005.opening_2:0 "[target.GetTitledFirstName](이)가 죽었다. [target.GetSheHe](은)는 거석에 깔려 힘줄이 끊기고 뼈가 부러지고 팔다리가 으스러져, 위사들이 [target.GetHerHim](을)를 파내기도 전에 숨이 끊어졌다."
 quix_murder_outcome.2005.opening_3:0 "듣자 하니 [target.GetTitledFirstName](은)는 마지막 순간에 벽돌과 돌이 깨지는 소리를 듣고 막 몸을 돌렸는데, 거석이 머리 위로 내리덮쳐 처절한 비명 한 마디만 남겼다고 한다."
 quix_murder_outcome.2005.owner_is_known_1:0 "\n\n불행히도 당신의 사람도 성벽에서 발을 헛디뎌 떨어지는 바람에 위사들에게 산 채로 붙잡혔다. 머지않아 모두가 당신이 연루되었음을 알게 될 것이다."
 quix_murder_outcome.2005.owner_is_known_2:0 "\n\n그러나 당신의 사람이 성벽에서 막 기어 내려오려 할 때 위사들에게 발각되어 붙잡혔다. 머지않아 모두가 당신이 주모자임을 알게 될 것이다."
 quix_murder_outcome.2005.no_awareness_1:0 "\n\n모두들 이것이 그저 사고일 뿐이라고 말한다…… 당신도 깊이 그렇게 생각한다."
 quix_murder_outcome.2005.no_awareness_2:0 "\n\n그저 불행한 사고였던 것 같다. 설령 의심을 품는 이가 있더라도, 결코 당신에게까지 의심이 미치지는 않을 것이다."
 quix_murder_outcome.2005.a.discovered:0 "장인을 불러라. 내 성벽도 손봐야겠다."
 quix_murder_outcome.2005.a:0 "그 꼴을 직접 보지 못한 것이 아쉽구나."
 quix_murder_outcome.2006.t:0 "문을 열어 도적을 들이다"
 quix_murder_outcome.2006.opening_1:0 "[target.GetName](을)를 죽이는 일은 아주 순조로웠다. 그 하인이 돈을 받고, 날이 밝기 전에 당신의 자객을 침실로 들여보냈다."
 quix_murder_outcome.2006.opening_2:0 "[target.GetTitledFirstName](은)는 죽기 직전 [target.GetHerHim](을)를 배신한 하인을 와락 움켜잡았다. 숨이 끊어지기 전 [target.GetSheHe](이)가 저주한 것은 자객이 아니라 그 배신한 종이었다."
 quix_murder_outcome.2006.opening_3:0 "불충한 하인이 방문을 열었고, [target.GetTitledFirstName](은)는 그렇게 죽었다! [target.GetSheHe](은)는 그때 안방에 있어 아무런 대비도 없다가, 문짝이 활짝 열리고 자객이 뛰어들고 나서야 알아차렸다."
 quix_murder_outcome.2006.owner_is_known_1:0 "\n\n불행히도 그 칼질은 소리 없이 끝나지 않았고, 자객이 경비를 깨우고 말았다! 최악의 경우에 대비해야 한다."
 quix_murder_outcome.2006.owner_is_known_2:0 "\n\n자객은 일을 치른 뒤 얼마 안 되어 붙잡혔으니, 시신이 발견되면 모두가 당신이 주모자임을 알게 될 것이다."
 quix_murder_outcome.2006.no_awareness_1:0 "\n\n그 하인의 도움으로 일은 훨씬 순조로웠다. 경비가 낌새를 채기도 전에, 당신의 자객은 이미 일을 마치고 빠져나갔다."
 quix_murder_outcome.2006.no_awareness_2:0 "\n\n일을 마친 뒤, 자객은 조용히 [target.GetTitledFirstName]의 저택을 떠났다."
 quix_murder_outcome.2006.a.discovered:0 "종이 주인을 시해했는데, 나와 무슨 상관이냐!"
 quix_murder_outcome.2006.a:0 "쓸 만한 사람은 참으로 얻기 어렵구나."
 quix_murder_outcome.2007.t:0 "땅굴을 파고 밤에 습격하다"
 quix_murder_outcome.2007.opening_1:0 "당신의 용사들이 침실에서 [target.GetTitledFirstName]의 목을 베었다! 이번 야습은 대성공이었다."
 quix_murder_outcome.2007.opening_2:0 "당신의 사람들은 [target.GetName](이)가 깊이 잠들어 있는 것을 발견하고, 단칼에 [target.GetHerHis] 목을 그었다!"
 quix_murder_outcome.2007.opening_3:0 "당신의 사람들이 쳐들어갔을 때 [target.GetTitledFirstName](은)는 누군가와 이불을 함께 덮고 있다가, 그 자리에서 침상 위에 베여 쓰러졌다!"
 quix_murder_outcome.2007.owner_is_known_1:0 "\n\n안타깝게도 일이 모두 계획대로 되지는 않았다. 일행은 문에 들어서자마자 경비에게 들켜 허둥지둥 물러날 수밖에 없었다. 누군가 다쳐 적의 손에 떨어졌고, 이미 모든 것을 자백했다!"
 quix_murder_outcome.2007.owner_is_known_2:0 "\n\n야습 자체는 순조로웠으나, 함께 간 이들 가운데 충성이 부족한 자가 있었다. 이자가 다른 사람의 뇌물을 받고, 계획의 전말과 당신의 이름까지 함께 누설해 버렸다! 비열한 배신자 같으니!"
 quix_murder_outcome.2007.no_awareness_1:0 "\n\n일행은 길을 막는 자들을 모두 제압하고 온 길로 물러났으니, 앞뒤로 차 한 잔 마실 시간밖에 걸리지 않았다."
 quix_murder_outcome.2007.no_awareness_2:0 "\n\n일을 마친 뒤 물러나다가 경비를 깨우는 바람에, 일행은 내내 사투를 벌여야 했다! 다행히 그들은 마구간으로 돌진해 말을 빼앗아 유유히 사라졌다. 붙잡힌 사람은 하나도 없으며, 습격자가 누구인지는 지금까지도 아무도 모른다."
 quix_murder_outcome.2007.a.discovered:0 "저들이 나를 미워한들 어떠랴, 나를 두려워하면 족하다."
 quix_murder_outcome.2007.a:0 "그대들 수고했다. 오늘 밤은 편히 잘 수 있겠구나."
 quix_murder_outcome.2008.t:0 "밤길의 기마 습격"
 quix_murder_outcome.2008.opening_1:0 "당신의 기수가 [target.GetTitledFirstName](을)를 죽였다. 그는 버려진 초가에서 뛰쳐나와 [target.GetTitledFirstName]의 수행원들을 스치고 지나갔고, 사람들이 미처 정신을 차리기도 전에 긴 창이 이미 [target.GetHerHis] 가슴을 꿰뚫었다!"
 quix_murder_outcome.2008.opening_2:0 "[target.GetName](은)는 이미 죽었다. 당신의 기수가 숲속에서 화살 한 대를 쏘아, 그 자리에서 [target.GetHerHim](을)를 쏘아 죽였다!"
 quix_murder_outcome.2008.opening_3:0 "[target.GetName](은)는 마침내 죽었다. 당신의 기수는 말을 달려 수행원들 곁을 질풍처럼 지나다가, 가까이 다가서서야 칼을 뽑아 단칼에 [target.GetTitledFirstName](을)를 베고, 곧바로 먼지를 일으키며 사라졌다."
 quix_murder_outcome.2008.owner_is_known_1:0 "\n\n불행히도 그 말이 비틀거리는 바람에 기수가 안장에서 떨어지고 말았다. 사람이 붙잡혔으니, 당신의 계략도 들통나고 말았다!"
 quix_murder_outcome.2008.owner_is_known_2:0 "\n\n하필이면 기수가 소리를 듣고 달려온 순찰 위사들과 정면으로 맞닥뜨렸다! 음모는 이미 들통났다."
 quix_murder_outcome.2008.no_awareness_1:0 "\n\n기수가 탄 것은 당신의 가장 좋은 준마였으니, 추격병은 뒤꽁무니도 따라잡지 못했고, 그는 눈 깜짝할 사이에 숲속으로 사라졌다!"
 quix_murder_outcome.2008.no_awareness_2:0 "\n\n사람들이 무슨 일이 일어났는지 깨닫기도 전에, 당신의 기수는 이미 멀리 가 버렸다!"
 quix_murder_outcome.2008.a.discovered:0 "밤이 어두워 분간하기 어려워, 사나운 짐승으로 잘못 본 것뿐이다!"
 quix_murder_outcome.2008.a:0 "이 길은 과연 험하구나."
 quix_murder_outcome.2009.t:0 "가짜 의원"
 quix_murder_outcome.2009.opening_1:0 "[target.GetName](이)가 죽었다! 당신이 보낸 가짜 의원이 [target.GetHerHis] 피를 다 뽑아 버리고, 떠나기 전에 식구들에게 환자가 오랫동안 깊이 잠들 것이니 절대 방해하지 말라고 당부까지 했다."
 quix_murder_outcome.2009.opening_2:0 "[target.GetName](은)는 당신이 보낸 가짜 의원에 의해 황천길로 보내졌다! [target.GetSheHe](은)는 손목을 상대에게 내맡긴 채 마지막으로 두 눈을 감고, 부드러운 베개 몇 개를 벤 채 편안히 잠들었다."
 quix_murder_outcome.2009.opening_3:0 "[target.GetName](은)는 이름을 사칭한 의원을 집 안으로 맞아들이고, 스스로 손목을 내밀어 피를 뽑게 했다. 피가 너무 많이 흐르고 나서야, [target.GetSheHe](은)는 사람을 잘못 믿었음을 깨달았다."
 quix_murder_outcome.2009.owner_is_known_1:0 "\n\n그러나 그 가짜는 문을 나서기도 전에 진짜 의원을 아는 사람에게 정체를 간파당했다! 당신의 음모는 이로써 들통났다."
 quix_murder_outcome.2009.owner_is_known_2:0 "\n\n그러나 문을 나서기도 전에 당신의 사람이 발각되어 붙잡혔다! 이제 이 일은 모두가 다 알게 되었다."
 quix_murder_outcome.2009.no_awareness_1:0 "\n\n당신의 가짜 의원은 그렇게 거들먹거리며 문을 나서, 밤의 어둠 속으로 사라졌다!"
 quix_murder_outcome.2009.no_awareness_2:0 "\n\n미처 떠나기도 전에 저택의 몇 사람이 또 그에게 진찰을 청했다! 그는 하는 수 없이 사람들에게 하나하나 피를 뽑아 주며 꼬박 밤을 새웠고, 날이 밝을 무렵에야 빠져나갔다."
 quix_murder_outcome.2009.a.discovered:0 "나는 그에게 좋은 의원을 천거했을 뿐, 무슨 다른 뜻이 있었겠는가!"
 quix_murder_outcome.2009.a:0 "그의 병은 모두 나았으니, 다시는 뒤탈이 없으리라."
 quix_murder_outcome.2010.t:0 "나면의 자객"
 quix_murder_outcome.2010.opening_1:0 "나무가 한창 무르익었을 때, [target.GetName](이)가 마당 한가운데서 살해되었다! 당신의 자객이 춤꾼들 사이에 섞여 사람들의 시선을 돌린 뒤, [target.GetTitledFirstName]의 등에 칼을 꽂았다!"
 quix_murder_outcome.2010.opening_2:0 "[target.GetName](은)는 좌중의 빈객들이 보는 앞에서 살해되었다. 칼날이 [target.GetHerHis] 가슴에 박힐 때, 사람들은 모두 멍하니 서서 나희의 무슨 기묘한 놀음인 줄로만 알았다!"
 quix_murder_outcome.2010.opening_3:0 "당신의 자객이 군중 속에서 [target.GetName](을)를 한적한 방으로 끌고 갔고, [target.GetSheHe](은)는 비명을 지르며 숨이 끊어졌다!"
 quix_murder_outcome.2010.owner_is_known_1:0 "\n\n당신의 사람들은 대부분 달아났지만, 손이 피투성이인 한 명이 그 자리에서 붙잡혔다! 당신이 연루된 일은 이미 모두가 알게 되었다!"
 quix_murder_outcome.2010.owner_is_known_2:0 "\n\n공교롭게도 군중 속에 싸움 좋아하는 자들이 적지 않아, [target.GetName](이)가 소리를 지르자마자 마당이 아수라장이 되었다! 당신의 사람 몇이 다쳐 붙잡혔으니, 이 계책은 이미 모르는 사람이 없게 되었다!"
 quix_murder_outcome.2010.no_awareness_1:0 "\n\n당신의 사람들은 혼란을 틈타 흩어졌고, 어두운 곳에 이르자마자 가면을 버리고 춤옷을 벗고 핏자국을 닦은 뒤 각자 조용히 떠났으니, 붙잡힌 자는 하나도 없다!"
 quix_murder_outcome.2010.no_awareness_2:0 "\n\n모두 가면을 쓰고 있어 누가 누구인지 알아볼 수 없었고, 길을 막는 자들은 그들이 하나하나 쓰러뜨렸다. 붙잡힌 자는 하나도 없으며, 이 일이 당신과 관련 있다는 것을 눈치챈 사람도 없는 듯하다."
 quix_murder_outcome.2010.a.discovered:0 "그저 나희가 지나쳤을 뿐인데, 나와 무슨 상관이냐?"
 quix_murder_outcome.2010.a:0 "내가 직접 가 보지 못한 것이 아쉽구나. 퍽 재미있었을 텐데."
 quix_murder_outcome.2011.t:0 "호인 손님"
 quix_murder_outcome.2011.opening_1:0 "[target.GetName](이)가 죽었다! 이 호인 손님은 소문대로 훌륭한 자객임이 증명되었다."
 quix_murder_outcome.2011.opening_2:0 "호인 손님의 기묘한 곡도가 [target.GetTitledFirstName]의 목을 갈랐으니, 이 거래는 이로써 끝이 났다."
 quix_murder_outcome.2011.opening_3:0 "당신이 고용한 호인 손님이 몰래 [target.GetName]의 거처에 숨어들어, [target.GetHerHis] 목숨을 끝장냈다!"
 quix_murder_outcome.2011.owner_is_known_1:0 "\n\n그러나 이 호인은 소문만큼 빠져나가는 데 능하지 않아, 붙잡히고 말았다!"
 quix_murder_outcome.2011.owner_is_known_2:0 "\n\n안타깝게도 자객은 저택을 빠져나왔지만, 지리에 어두운 탓에 얼마 가지 못해 붙잡혔다!"
 quix_murder_outcome.2011.no_awareness_1:0 "\n\n일을 마친 뒤 그 호인 손님은 마치 허공으로 사라진 듯했다. 적어도 위사들은 그렇게 말한다. 당신과 이 일의 연관도, 여러 속사정도 아무도 모른다!"
 quix_murder_outcome.2011.no_awareness_2:0 "\n\n그 호인 손님은 성을 나서자마자 서쪽으로 가는 상단에 섞여 들어, 그 뒤로 소식이 끊겼다. 그 뒤에 고용주가 있으리라고는 아무도 생각하지 못했다."
 quix_murder_outcome.2011.a.discovered:0 "다음에는 내 사람을 써야겠다."
 quix_murder_outcome.2011.a:0 "오늘 밤 그에게 술 한잔 대접해야겠다."
 quix_murder_outcome.2012.t:0 "사나운 개를 부추기다"
 quix_murder_outcome.2012.opening_1:0 "[target.GetTitledFirstName](은)는 비명을 지르며 사나운 개들에게 갈가리 찢겼다."
 quix_murder_outcome.2012.opening_2:0 "[target.GetTitledFirstName](은)는 개 떼에서 몸을 빼냈지만, 끝내 그 짐승들보다 빨리 달리지는 못했다."
 quix_murder_outcome.2012.opening_3:0 "사나운 개들이 [target.GetTitledFirstName]의 목을 물어뜯었다. 당신은 마침내 [target.GetHerHim](을)를 없앴다."
 quix_murder_outcome.2012.owner_is_known_1:0 "\n\n그러나 [target.GetSheHe]의 구조 요청에 경비가 깨어났다. 사나운 개들은 그 자리에서 죽임을 당했고, 개 조련사도 붙잡혀 심문 중에 당신의 이름을 털어놓았다."
 quix_murder_outcome.2012.owner_is_known_2:0 "\n\n일이 끝난 뒤 몹시 굶주린 개 몇 마리가 조련사의 호통도 아랑곳없이 그 자리에서 뜯어먹기 시작했고, 얼마 지나지 않아 이 끔찍한 광경이 누군가에게 목격되어 조련사가 붙잡혔다! 한바탕 추궁 끝에, 그는 당신의 이름을 말해 버린 듯하다."
 quix_murder_outcome.2012.no_awareness_1:0 "\n\n개 조련사는 개를 끌고 온 길로 돌아왔고, 도중에 아무도 막지 않았다."
 quix_murder_outcome.2012.no_awareness_2:0 "\n\n모든 것이 순조로웠으니, 사람들은 아마 이 일을 승냥이나 호랑이, 표범의 소행으로 여길 것이다."
 quix_murder_outcome.2012.a.discovered:0 "짐승이 사람을 해친 것을 어찌 내 탓으로 돌리겠는가?"
 quix_murder_outcome.2012.a:0 "좋구나, 훌륭한 개들이로다."
 quix_murder_outcome.2013.t:0 "온천"
 quix_murder_outcome.2013.opening_1:0 "[target.GetTitledFirstName](은)는 목욕하던 중 당신의 사람들에게 살해되었다. 그들은 [target.GetHerHim](이)가 홀몸으로 아무런 대비도 없을 때를 노려 손을 썼으니, 조금 애를 먹기는 했지만 결국 일을 해냈다."
 quix_murder_outcome.2013.opening_2:0 "오늘, [target.GetName]의 피가 온천을 붉게 물들였다."
 quix_murder_outcome.2013.opening_3:0 "[target.GetTitledFirstName](은)는 맨손으로 당신의 사람들과 한동안 맞붙었는데, 뜻밖에도 몹시 사나웠지만 끝내 못 속에 처박혀 익사했다."
 quix_murder_outcome.2013.owner_is_known_1:0 "\n\n그러나 [target.GetTitledFirstName]의 비명이 욕실 안에 울려 퍼져 위사들을 깨웠고, 당신의 사람들은 그 자리에서 붙잡혔다!"
 quix_murder_outcome.2013.owner_is_known_2:0 "\n\n이 격투로 당신의 자객들도 온몸에 피를 뒤집어썼다. 그들은 미처 씻을 겨를도 없이 달아났다가, 얼마 안 가 온몸이 피투성이인 채로 누군가에게 들켜 그 자리에서 붙잡혔다. 이제 당신이 맡은 역할은 모두가 다 알게 되었다."
 quix_murder_outcome.2013.no_awareness_1:0 "\n\n당신의 사람들은 무사히 물러났으며, 아무도 당신이 연루된 것을 알지 못한다."
 quix_murder_outcome.2013.no_awareness_2:0 "\n\n싸우는 소리에 같은 온천에 있던 목욕객 몇 명이 몰려왔지만, 그들도 모두 자객들에게 함께 처리되었다. 살아남은 자가 없으니, 더 이상 당신에게까지 추적이 미칠 일은 없다!"
 quix_murder_outcome.2013.a.discovered:0 "나는 본디 깨끗하니, 씻을 필요가 무엇이냐!"
 quix_murder_outcome.2013.a:0 "[target.GetFirstNameNoTooltip](은)는 이번에 깨끗이 씻었구나."
 quix_murder_outcome.2014.t:0 "강가에서의 우연한 만남"
 quix_murder_outcome.2014.opening_1:0 "당신은 곧장 [target.GetName]의 등 뒤로 걸어갔다. [target.GetSheHe](은)는 강물을 바라보며 넋을 놓고 꼼짝도 하지 않았다. 당신은 불쑥 손을 뻗어 [target.GetHerHim](을)를 세찬 물살 속으로 밀어 넣었다! [target.GetHerHis] 머리가 마지막으로 가라앉기 전, 두 사람은 잠시 서로를 마주 보았다. 그때 당신은 아마 웃고 있었을 것이다."
 quix_murder_outcome.2014.opening_2:0 "당신은 소리 없이 다가가려 했으나, [target.GetName](은)는 발소리를 들은 듯 마지막 순간에 몸을 돌렸다. “잘 가시오.” 당신은 나직이 말하며 [target.GetHerHim](을)를 세찬 강물 속으로 와락 밀어 넣었다!"
 quix_murder_outcome.2014.opening_3:0 "당신은 몇 걸음 도움닫기를 하고 온 힘을 다해 [target.GetTitledFirstName](을)를 걷어차, [target.GetHerHim](을)를 세찬 강물 속으로 차 넣었다. [target.GetSheHe](은)는 암초에 세게 부딪힌 뒤, 마른 나무토막처럼 하류로 떠내려갔다."
 quix_murder_outcome.2014.owner_is_known_1:0 "\n\n안타깝게도 당신은 너무 대담했다. 이 범행에는 당신이 보지 못한 목격자가 하나 있었다!"
 quix_murder_outcome.2014.owner_is_known_2:0 "\n\n[target.GetSheHe](은)는 한때 물속의 암초 하나를 붙잡고, 기슭의 행인들을 향해 당신이 [target.GetHerHim](을)를 밀었다고 크게 외쳤다! 잠시 뒤 힘이 다해 다시 강물 속으로 미끄러졌으니, 아마 큰 강으로 휩쓸려 갔을 것이다."
 quix_murder_outcome.2014.no_awareness_1:0 "\n\n당신은 계속 길을 가며 더없이 느긋한 오후를 보냈다."
 quix_murder_outcome.2014.no_awareness_2:0 "\n\n사람들은 모두 [target.GetName](이)가 스스로 발을 헛디뎌 물에 빠졌다고 여기는 듯하다!"
 quix_murder_outcome.2014.a.discovered:0 "그건 내가 아니다. 누군가 내 이름을 사칭해 모함한 것이 틀림없다!"
 quix_murder_outcome.2014.a:0 "그토록 공들일 것 없이, 한 번 밀면 되는 것이었구나."
 quix_murder_outcome.2015.t:0 "대낮의 암살"
 quix_murder_outcome.2015.opening_1:0 "[target.GetName](은)는 시장에서 당신의 사람들에게 가로막혀 모퉁이로 끌려갔고, 눈 깜짝할 사이에 끝장났다."
 quix_murder_outcome.2015.opening_2:0 "당신의 사람들이 [target.GetName](와)과 시비가 붙어 길거리에서 [target.GetHerHim](을)를 죽여 버리니, 거리의 사람들이 모두 아연실색했다."
 quix_murder_outcome.2015.opening_3:0 "당신의 자객이 시장에 좌판을 차려 놓고 있다가, [target.GetName](이)가 앞까지 어슬렁거리며 오자 창으로 [target.GetHerHis] 가슴을 단숨에 꿰뚫었다."
 quix_murder_outcome.2015.owner_is_known_1:0 "\n\n이내 사방에서 고함이 터져 나왔고, 당신의 수하 하나가 붙잡혔다. 보아하니 그는 이미 당신의 이름을 털어놓은 모양이다!"
 quix_murder_outcome.2015.owner_is_known_2:0 "\n\n뜻밖에도 시장 사람들이 무리 지어 에워싸는 바람에, 당신의 사람 몇이 달아나다 붙잡혔다! 당신이 연루된 일은 이미 새어 나간 듯하다."
 quix_murder_outcome.2015.no_awareness_1:0 "\n\n당신의 사람들은 걸어서 흩어져 달아났고, 아무도 당신이 연루된 것을 알지 못한다."
 quix_murder_outcome.2015.no_awareness_2:0 "\n\n이 칼부림이 어찌 된 일인지 소동을 일으켰다! 다행히 당신의 사람들은 혼란을 틈타 빠져나갔고, 당신이 맡은 역할은 아무도 모른다!"
 quix_murder_outcome.2015.a.discovered:0 "내가 어찌 이토록 대놓고 일을 벌이겠는가!"
 quix_murder_outcome.2015.a:0 "상책이란 곧장 하는 것일 뿐이다."
 quix_murder_outcome.2016.t:0 "거짓 명령으로 체포하다"
 quix_murder_outcome.2016.opening_1:0 "[target.GetTitledFirstName](이)가 당신 앞으로 끌려왔다! 당신의 사람들이 그 문서를 내보이고 되는대로 죄목 몇 가지를 늘어놓자, [target.GetName](은)는 저항도 하지 않고 순순히 붙잡혔다. 말하는 사이에 망나니는 이미 감방에서 도끼를 갈고 있다. [target.GetSheHe](은)는 죽은 사람이나 다름없다."
 quix_murder_outcome.2016.opening_2:0 "당신의 사람들이 이미 [target.GetTitledFirstName](을)를 붙잡았다. 그들은 [target.GetSheHe](이)가 예상한 것과 똑같이 생긴 짐수레를 몰고 와 앞에 세웠다! [target.GetSheHe](이)가 마침내 수레가 어디로 가느냐고 물었을 때는 이미 너무 늦었다."
 quix_murder_outcome.2016.opening_3:0 "당신의 사람들이 이미 [target.GetTitledFirstName](을)를 붙잡았다. 따지고 보면 머리에 씌운 삼베 자루 하나와 근처의 짚수레 한 대만 썼을 뿐이다. [target.GetTitledFirstName](이)가 목숨을 구걸하느라 바쁜 동안, 당신의 수하들은 이미 처형을 준비하고 있다. 당신은 그 소리를 듣는 것이 꽤 마음에 든다."
 quix_murder_outcome.2016.owner_is_known_1:0 "\n\n불행히도 그중 한 명이 누군가에게 매수되어 당신의 정체를 누설했다! 비열한 배신자 같으니!"
 quix_murder_outcome.2016.owner_is_known_2:0 "\n\n하필 당신의 자객 하나가 입을 다물지 못하고 이 묘책을 사방에 자랑하고 다녔다! 이제 당신이 연루된 일은 모두가 다 안다."
 quix_murder_outcome.2016.no_awareness_1:0 "\n\n아무도 당신에게까지 추적해 오지는 못할 것 같다."
 quix_murder_outcome.2016.no_awareness_2:0 "\n\n이제부터 당신은 [target.GetName](이)가 없는 세상에서 유유자적하게 살 수 있다!"
 quix_murder_outcome.2016.a.discovered:0 "나는 그저 겁만 주려 했는데, 그만 손이 미끄러질 줄이야!"
 quix_murder_outcome.2016.a:0 "그 죄를 열거하는 말을 끝내 써먹지 못한 것이 아쉽구나."
 quix_murder_outcome.2017.t:0 "취전"
 quix_murder_outcome.2017.opening_1:0 "[target.GetName](은)는 바늘에 맞은 뒤 얼굴이 퍼렇게 변하더니 곧 숨이 끊어졌다. 당신의 자객은 [target.GetHerHis] 창밖에 몇 시진이나 엎드려 있다가 비로소 손쓸 때를 잡았다."
 quix_murder_outcome.2017.opening_2:0 "이 기묘한 병기는 과연 쓸모가 있었다. 어둠 속에 숨은 자객이 작은 바늘 하나를 불었는데, 독이 조금 묻었을 뿐인데도 [target.GetName]의 목숨을 앗아 갔다."
 quix_murder_outcome.2017.opening_3:0 "이 물건은 보기에는 신기하지만, 쓰기에는 매우 효과적이었다. [target.GetName](은)는 열린 창으로 바늘 하나를 맞고 온몸이 퍼렇게 변해 죽었다. 큰일을 이루었다!"
 quix_murder_outcome.2017.owner_is_known_1:0 "\n\n안타깝게도 당신의 자객은 그 병기만큼 쓸모 있지 못해, 일을 치르고 달아나다 금세 붙잡혔다!"
 quix_murder_outcome.2017.owner_is_known_2:0 "\n\n자객은 처음에는 수색을 피했지만, 그의 몸에서 나온 날침이 [target.GetName]의 몸에 박힌 것과 똑같아 그의 죄를 입증하기에 충분했다. 그리고 그는 당신까지 불어 버렸다!"
 quix_murder_outcome.2017.no_awareness_1:0 "\n\n보아하니 [target.GetName](은)는 처음에 그 작은 바늘을 대수롭지 않게 여기고 죽기 전에 아무렇게나 뽑아 버린 모양이다. 당신이 연루된 것을 아는 사람은 없다!"
 quix_murder_outcome.2017.no_awareness_2:0 "\n\n보아하니 [target.GetName]의 염습을 맡은 사람들 모두 그 날침을 발견하지 못해, 사인이 미궁에 빠져 버렸다!"
 quix_murder_outcome.2017.a.discovered:0 "이 일은…… 자못 난처하구나."
 quix_murder_outcome.2017.a:0 "이 물건의 묘함은 명불허전이로다."
 quix_murder_outcome.2018.t:0 "손수 비수를 쥐다"
 quix_murder_outcome.2018.opening_1:0 "해 질 녘, 당신은 가장 눈에 띄지 않는 옷으로 갈아입고 비수를 품은 채 거처의 창문으로 빠져나가 [target.GetName]의 거처로 더듬어 갔다. [target.GetHerHim](이)가 화로에 기대어 쉬고 있는 것을 보고, 당신은 한 손으로 [target.GetHerHis] 입을 틀어막고 [target.GetHerHis] 귓가에 다가가 낮게 말했다. “잘 가라, [target.GetName].” [target.GetSheHe](이)가 당신임을 알게 하기 위해서였다. 잠시 뒤, [target.GetHerHis] 피가 무릎을 흥건히 적셨다!"
 quix_murder_outcome.2018.opening_2:0 "[target.GetTitledFirstName]의 마지막 순간은…… 마치 꿈만 같았다. 당신은 살며시 [target.GetHerHis] 방에 들어가, [target.GetHerHim](이)가 화로 곁의 책상 앞에 앉아 있는 것을 보았다. 당신이 아무 말 없이 다가가 [target.GetTitledFirstName]의 맞은편에 앉자, [target.GetSheHe](은)는 고개를 들어 당신을 보고 놀라 말을 잇지 못했다. 한동안 어색한 침묵이 흐른 뒤, [target.GetSheHe](은)는 당신에게 [target.GetHerHim](을)를 죽이러 왔느냐고 물었다. 당신은 그렇다고 고개를 끄덕이고, 담담하게 그 까닭을 말했다. [target.GetName](은)는 뜻밖에도 그저…… 받아들였다. 앞으로 일어날 일을 분명히 말해 주고서, 전혀 저항하지 않는 사람을 죽이는 그 느낌은 참으로 묘했다."
 quix_murder_outcome.2018.opening_3:0 "당신은 먼저 붐비는 객사에 머물러 있다가, 밤이 깊고 인적이 끊긴 뒤에야 머리부터 발끝까지 검은 옷을 두르고 나서는 것이 가장 좋겠다고 생각했다. 당신은 비수를 입에 물고 [target.GetTitledFirstName]의 방 밖 누대를 기어올라, 살짝 열린 창틈으로 안을 엿보았다. [target.GetHerHim](이)가 깊이 잠든 것을 보고는 재빨리 손을 썼다."
 quix_murder_outcome.2018.owner_is_known_1:0 "\n\n당신은 시간을 들여 핏자국을 씻고 마음을 가라앉힌 뒤에야 떠났는데, 무엇에 홀렸는지 비수를 그곳에 두고 오고 말았다! 자루에 당신의 사인이 새겨져 있으니, 그들은 틀림없이 당신이 한 짓임을 알게 될 것이다!"
 quix_murder_outcome.2018.owner_is_known_2:0 "\n\n모든 것이 순조로웠다…… 한 행인이 창문을 넘어 나오는 당신과 마주치기 전까지는! 더 나쁜 것은, 그 사람이 한눈에 당신을 알아보고 그 자리에서 크게 소리쳤다는 것이다! 당신은 간신히 도망쳐 돌아왔다."
 quix_murder_outcome.2018.no_awareness_1:0 "\n\n당신은 서두르지 않고 [target.GetTitledFirstName]의 소지품을 뒤졌고, 심지어 [target.GetHerHis] 음식까지 몇 입 맛보았다. 일을 마친 뒤 당신은 거들먹거리며 걸어 나왔으나, 아무도 당신을 보지 못했다. 당신은 스스로가 최고의 자객이라고 느낀다……"
 quix_murder_outcome.2018.no_awareness_2:0 "\n\n당신은 깔끔하게 손을 쓰고 창문으로 조용히 사라졌다. 오히려 가장 어려웠던 것은 위사 몇 명 곁을 지나갈 때 마음속의 득의양양함을 억누르는 일이었다!"
 quix_murder_outcome.2018.a.discovered:0 "나 같은 자는 많은데, 어찌 나라고 알겠는가?"
 quix_murder_outcome.2018.a:0 "일을 이루려면 반드시 몸소 해야 한다."
 quix_murder_outcome.2019.t:0 "벙어리 역사"
 quix_murder_outcome.2019.opening_1:0 "[target.GetName](이)가 죽었다! [target.GetSheHe](이)가 바깥을 거닐다가, 당신의 역사가 큰 두 손으로 산 채로 목 졸라 죽였다. 일이 처리되었다!"
 quix_murder_outcome.2019.opening_2:0 "[target.GetName](은)는 힘없이 몇 번 맞섰지만, 어찌 당신이 고용한 역사의 상대가 되겠는가! 그 장면을 직접 보고 싶을 정도다. 듣자 하니 [target.GetName](은)는 얼굴을 알아볼 수 없을 만큼 맞아, 몸에 있는 반점이 아니었다면 가족조차 알아보지 못했을 것이라 한다."
 quix_murder_outcome.2019.opening_3:0 "공정하게 말하자면, [target.GetName](은)는 감히 당신의 역사와 정면으로 맞붙었으니, 두 사람의 현격한 실력 차이를 생각하면 [target.GetSheHe](은)는 꽤 오래 버틴 셈이다. 결국 역사의 묵직한 주먹 한 방이 [target.GetHerHis] 자세를 무너뜨리고 [target.GetHerHim](을)를 단단한 땅바닥에 메다꽂은 뒤, 매서운 발길질 한 번으로 일을 끝냈다."
 quix_murder_outcome.2019.owner_is_known_1:0 "\n\n안타깝게도 이 역사는 사람을 죽이면서 남의 눈을 전혀 피할 줄 몰라, 그 자리에서 누군가에게 목격되었다! 얼마 지나지 않아 그는 붙잡혔다."
 quix_murder_outcome.2019.owner_is_known_2:0 "\n\n역사는 범행 후 걸어서 달아났지만, 사람들에게 끝까지 쫓겨 붙잡혔다! 그는 이미 처형되었고, 당신이 연루된 일도 들통났다."
 quix_murder_outcome.2019.no_awareness_1:0 "\n\n[target.GetName](은)는 당시 홀로 있었으니, 아무도 당신의 사람을 보지 못한 듯하다. 이 일은 깔끔하게 처리되었다."
 quix_murder_outcome.2019.no_awareness_2:0 "\n\n[target.GetName]의 호위들이 앞으로 나서 막으려 했으나, 모두 역사에게 하나하나 나가떨어졌다! 그는 쑤시는 손마디를 문지르며 유유히 떠나갔다."
 quix_murder_outcome.2019.a.discovered:0 "나는 평소 이자를 알지 못한다. 아마 머리를 얻어맞아 망가진 모양이지!"
 quix_murder_outcome.2019.a:0 "죽음이 끔찍하구나, 절묘하도다."
 quix_murder_outcome.2020.t:0 "탐환의 무리"
 quix_murder_outcome.2020.opening_1:0 "[target.GetName](이)가 죽었다! 듣자 하니 [target.GetSheHe](이)가 측간에 갔을 때, 자객이 측간 속에서 불쑥 튀어나와 단칼에 [target.GetHerHim](을)를 끝장냈다고 한다. 참으로 볼썽사나운 죽음이다."
 quix_murder_outcome.2020.opening_2:0 "[target.GetTitledFirstName](이)가 밤중에 누군가에게 목이 베였다! 당신은 마침내 [target.GetHerHim]에게서 벗어났다. 정체를 알 수 없는 그 무리는 과연 약속대로 이 일을 해냈다……"
 quix_murder_outcome.2020.opening_3:0 "머리를 감추고 꼬리를 드러내는 이 무리가 사람을 죽이는 솜씨는 이토록 깔끔했다. [target.GetName](은)는 한 연회에서 살해되었다!"
 quix_murder_outcome.2020.owner_is_known_1:0 "\n\n그러나 자객은 당신이 바랐던 만큼 은밀하지 못해, 순식간에 붙잡혀 이미 당신의 이름을 말해 버렸다."
 quix_murder_outcome.2020.owner_is_known_2:0 "\n\n뜻밖에도 상대는 일부러 약정서의 사본 한 부를 남겨, 모든 죄를 당신에게 떠넘겼다. 보아하니 이 거래는 처음부터 당신을 노리고 놓은 덫이었던 모양이다."
 quix_murder_outcome.2020.no_awareness_1:0 "\n\n자객은 오갈 때 아무에게도 들키지 않은 듯하니, 이 일에서 당신이 한 역할도 조사할 길이 없다."
 quix_murder_outcome.2020.no_awareness_2:0 "\n\n자객은 귀신처럼 흔적 하나 찾을 수 없었다. 당신과 관련된 단서는 털끝만큼도 발견되지 않았다."
 quix_murder_outcome.2020.a.discovered:0 "틀림없이 누군가 뒤에서 꾸며 나에게 죄를 뒤집어씌운 것이다!"
 quix_murder_outcome.2020.a:0 "이 무리는 오고 감에 자취가 없으니, 두렵고도 두렵구나."
 quix_murder_outcome.4001.t:0 "객사의 밤불"
 quix_murder_outcome.4001.failure_declaration_1:0 "[target.GetTitledFirstName](이)가 아직도 살아 있다니!"
 quix_murder_outcome.4001.failure_declaration_2:0 "[target.GetTitledFirstName]의 목숨을 거두려던 당신의 계획이 수포로 돌아갔다."
 quix_murder_outcome.4001.failure_declaration_3:0 "[target.GetTitledFirstName](을)를 죽이는 것은 당신이 생각한 것만큼 쉽지 않았다. [target.GetSheHe](은)는 아직 살아 있다."
 quix_murder_outcome.4001.desc:0 "\n\n불을 지른 자가 객사를 잘못 알았다. [target.GetName](은)는 털끝 하나 다치지 않았고, 심지어 거리로 나와 반나절 동안 불구경까지 했다."
 quix_murder_outcome.4001.exposed_scheme:0 "\n\n불을 지른 자가 그 자리에서 붙잡혀 당신을 불어 버렸다."
 quix_murder_outcome.4001.not_exposed_scheme:0 "\n\n불을 지른 자는 하마터면 붙잡힐 뻔했지만, 그럭저럭 걸어서 달아났다. 다만 [target.GetName](은)는 이제부터 틀림없이 곳곳을 경계할 것이다."
 quix_murder_outcome.4001.a.discovered:0 "내가 어찌 이런 비열한 짓을 하겠는가? 틀림없이 오해다."
 quix_murder_outcome.4001.a:0 "[target.GetFirstNameNoTooltip]의 명이 길었다 치고, 이 일은 그만두자."
 quix_murder_outcome.4001.b:0 "백 번 치밀해도 한 번 빈틈이 있는 법, 다시 도모하자."
 quix_murder_outcome.4002.t:0 "누각 위의 암전"
 quix_murder_outcome.4002.failure_declaration_1:0 "화살이 빗나갔다! [target.GetName](은)는 아직 살아 있다."
 quix_murder_outcome.4002.failure_declaration_2:0 "그 화살은 끝내 [target.GetTitledFirstName]의 목숨을 앗아 가지 못했다."
 quix_murder_outcome.4002.failure_declaration_3:0 "화살 한 대로 [target.GetTitledFirstName]의 목숨을 거두려던 셈은 이로써 수포로 돌아갔으니, 아쉽구나."
 quix_murder_outcome.4002.desc:0 "\n\n궁수가 시위를 놓는 찰나, 마침 비둘기 한 마리가 스쳐 지나가며 [target.GetTitledFirstName] 대신 그 화살을 고스란히 막아 냈다."
 quix_murder_outcome.4002.exposed_scheme:0 "\n\n[target.GetName](이)가 곧바로 낌새를 채니, 궁수가 수색 끝에 붙잡혀 당신을 불었다."
 quix_murder_outcome.4002.not_exposed_scheme:0 "\n\n다행히 궁수는 발이 날래어 추격병이 오기 전에 줄행랑을 쳤고, 아무도 당신이 연루된 것을 알지 못한다."
 quix_murder_outcome.4002.a.discovered:0 "우리 집 하인이 비둘기를 쏘아 반찬거리로 삼으려 했을 뿐인데, 무슨 죄가 있겠는가!"
 quix_murder_outcome.4002.a:0 "[target.GetFirstNameNoTooltip]의 일은 이것으로 그만두자."
 quix_murder_outcome.4002.b:0 "궁수에게 다시 한 발을 쏘게 하라."
 quix_murder_outcome.4003.t:0 "한 병의 좋은 술"
 quix_murder_outcome.4003.failure_declaration_1:0 "[target.GetTitledFirstName](은)는 아직 멀쩡히 살아 있다."
 quix_murder_outcome.4003.failure_declaration_2:0 "당신은 좋은 술 한 동이면 [target.GetTitledFirstName](을)를 틀림없이 낚을 수 있으리라 여겼으나, 아쉽게도 셈이 틀어졌다."
 quix_murder_outcome.4003.failure_declaration_3:0 "[target.GetTitledFirstName]의 생애 마지막 술잔은 아직 넘어가지 않았다. [target.GetSheHe](은)는 아직 살아 있다. 적어도 지금은."
 quix_murder_outcome.4003.desc:0 "\n\n[target.GetName](은)는 이 술맛을 훤히 알고 있어, 입에 대기도 전에 이상한 낌새를 알아챘다. [target.GetHerHim]의 목숨을 구한 것이 바로 [target.GetHerHis]의 그 술버릇이었을 줄 누가 알았겠는가."
 quix_murder_outcome.4003.exposed_scheme:0 "\n\n더 나쁜 것은, 당신이 잠시 방심하여 술과 함께 보낸 편지 끝에 자기 이름을 서명해 버렸다는 것이다! 참으로 어리석기 짝이 없다."
 quix_murder_outcome.4003.not_exposed_scheme:0 "\n\n다행히 이 술을 당신이 보냈다는 것은 아무도 알아내지 못한다. 이 일은 없었던 것으로 치자."
 quix_murder_outcome.4003.a.discovered:0 "이것은 독주가 아니다…… 믿지 못하겠다면 마셔 보라!"
 quix_murder_outcome.4003.a:0 "그 좋은 술 한 동이가 아깝구나. 그만두자."
 quix_murder_outcome.4003.b:0 "다음에는 더 독하게 해야겠다."
 quix_murder_outcome.4004.t:0 "걷기 힘든 밤길"
 quix_murder_outcome.4004.failure_declaration_1:0 "[target.GetTitledFirstName]의 밤 산책을 틈타 손쓰려던 계획이 실패했다!"
 quix_murder_outcome.4004.failure_declaration_2:0 "당신의 자객은 [target.GetTitledFirstName]의 목숨을 거두지 못했다!"
 quix_murder_outcome.4004.failure_declaration_3:0 "[target.GetTitledFirstName](을)를 죽이려던 계획이 수포로 돌아가, 온갖 고심이 모두 물거품이 되었다!"
 quix_murder_outcome.4004.desc:0 "\n\n[target.GetName](은)는 어둠 속에 매복한 자객을 일찌감치 알아채고, 상대가 다가오기도 전에 큰 소리로 위사를 불렀다."
 quix_murder_outcome.4004.exposed_scheme:0 "\n\n위사들이 자객을 붙잡자, 그 배신자는 그 자리에서 자백해 버렸다. 이제 모두가 이 음모를 알게 되었다."
 quix_murder_outcome.4004.not_exposed_scheme:0 "\n\n다행히 자객은 붙잡히기 전에 밤의 어둠을 틈타 빠져나갔다."
 quix_murder_outcome.4004.a.discovered:0 "나의 고요한 밤을 어지럽히다니, 괘씸하구나!"
 quix_murder_outcome.4004.a:0 "이런 장난질은 이제 지겹다."
 quix_murder_outcome.4004.b:0 "다음에는 네가 이렇게 운이 좋지는 않을 것이다."
 quix_murder_outcome.4005.t:0 "위태로운 담장 아래"
 quix_murder_outcome.4005.failure_declaration_1:0 "당신은 [target.GetTitledFirstName](이)가 벌레처럼 돌 밑에 깔려 죽기를 바랐으나, 아쉽게도 뜻대로 되지 않았다."
 quix_murder_outcome.4005.failure_declaration_2:0 "이날은 시작부터 순조롭지 않았다. [target.GetTitledFirstName](이)가 돌에 깔려 죽지 않았다는 소식이 전해진 것이다!"
 quix_murder_outcome.4005.failure_declaration_3:0 "거석이 [target.GetTitledFirstName](을)를 깔아 죽이지 못했다!"
 quix_murder_outcome.4005.desc:0 "\n\n공모자는 그 거석들을 좀처럼 비틀어 떼어 내지 못했다. 마침내 돌이 떨어졌을 때 [target.GetName](은)는 이미 일어나 자리를 뜬 뒤였고, 자신이 방금 앉아 있던 자리가 산산조각 나는 것을 지켜볼 뿐이었다."
 quix_murder_outcome.4005.exposed_scheme:0 "\n\n당신의 사람은 그 자리에서 붙잡혀 당신의 이름을 털어놓았다!"
 quix_murder_outcome.4005.not_exposed_scheme:0 "\n\n다행히 그 쓸모없는 녀석은 성벽에서 이웃 지붕으로 뛰어올라 추격병을 따돌렸다. 당신이 맡은 역할은 아무도 모른다."
 quix_murder_outcome.4005.a.discovered:0 "성벽이 낡아 돌이 떨어진 것이 나와 무슨 상관이냐?"
 quix_murder_outcome.4005.a:0 "그만두자. 깔려 죽는 것은 [target.GetFirstNameNoTooltip]에게 너무 쉬운 죽음이다."
 quix_murder_outcome.4005.b:0 "다음에는 따로 쉬운 방법을 골라야겠다."
 quix_murder_outcome.4006.t:0 "문을 열어 도적을 들이다"
 quix_murder_outcome.4006.failure_declaration_1:0 "아아, [target.GetName](을)를 끝장내려던 당신의 계획이 실패했다."
 quix_murder_outcome.4006.failure_declaration_2:0 "운이 따르지 않는구나! [target.GetTitledFirstName](은)는 예정대로 목숨을 잃지 않았다."
 quix_murder_outcome.4006.failure_declaration_3:0 "실패했다! [target.GetTitledFirstName](은)는 아직 살아 있다."
 quix_murder_outcome.4006.desc:0 "\n\n그 하인은 애초에 약속을 지킬 생각이 없었다. 방 안에는 이미 매복이 갖추어져 있었고, 경비들은 당신의 사람들이 스스로 그물에 걸려들기를 기다리고 있었다."
 quix_murder_outcome.4006.exposed_scheme:0 "\n\n이 모든 일이 함정이었다! 이제 [target.GetTitledFirstName](은)는 당신의 계획을 이미 알게 되었다."
 quix_murder_outcome.4006.not_exposed_scheme:0 "\n\n그래도 당신의 자객은 죽기 살기로 빠져나왔다. 추격병들은 갑옷을 입고 병기를 들고 있어 빨리 달리지 못했으니, 그는 골목 사이에서 그들을 따돌렸고, 또 밤새도록 이리저리 숨어 다니며 끝내 붙잡히지 않았다."
 quix_murder_outcome.4006.a.discovered:0 "이것은 모함이다!"
 quix_murder_outcome.4006.a:0 "[target.GetFirstNameNoTooltip](은)는 보기보다 영리하구나. 그만두자."
 quix_murder_outcome.4006.b:0 "작은 좌절일 뿐이니, 다시 궁리하자."
 quix_murder_outcome.4007.t:0 "땅굴을 파고 밤에 습격하다"
 quix_murder_outcome.4007.failure_declaration_1:0 "당신은 그 위험을 이미 알고 있었다. [target.GetTitledFirstName](을)를 죽이려던 야습은 결국 실패했다."
 quix_murder_outcome.4007.failure_declaration_2:0 "[target.GetTitledFirstName]에 대한 야습은 실패로 끝났다!"
 quix_murder_outcome.4007.failure_declaration_3:0 "당신의 사람들은 [target.GetTitledFirstName](을)를 죽이지 못했다! 이번 야습은 그야말로 재앙이었다."
 quix_murder_outcome.4007.desc:0 "\n\n당신의 사람들은 [target.GetTitledFirstName]의 거처에 숨어든 뒤 하인과 시녀들과 잇달아 마주쳤고, 한바탕 혼란이 이내 경비를 깨워, [target.GetTitledFirstName]도 혼란을 틈타 달아났다."
 quix_murder_outcome.4007.exposed_scheme:0 "\n\n일행은 한 방에 갇혀 포위를 뚫을 가망이 없음을 보고, 병기를 버리고 항복하며 당신을 불어 버렸다!"
 quix_murder_outcome.4007.not_exposed_scheme:0 "\n\n유일한 좋은 소식은 일행이 붙잡히기 전에 빠져나왔다는 것이다."
 quix_murder_outcome.4007.a.discovered:0 "그것도 좋다. [target.GetFirstNameNoTooltip]에게 내가 얼마나 두려운지 알게 해 주마!"
 quix_murder_outcome.4007.a:0 "나는 지쳤다. 이 일은 그만두자."
 quix_murder_outcome.4007.b:0 "조만간의 일일 뿐이다. [target.GetFirstNameNoTooltip], 기다리고 있거라!"
 quix_murder_outcome.4008.t:0 "밤길의 기마 습격"
 quix_murder_outcome.4008.failure_declaration_1:0 "[target.GetTitledFirstName](은)는 당신의 기수 손에 죽지 않았다!"
 quix_murder_outcome.4008.failure_declaration_2:0 "[target.GetTitledFirstName](을)를 가로막아 죽이려던 매복이 실패했다!"
 quix_murder_outcome.4008.failure_declaration_3:0 "원통하구나! [target.GetTitledFirstName](은)는 아직 살아 있으니, 당신의 기수가 [target.GetHerHim](을)를 죽이지 못했다!"
 quix_murder_outcome.4008.desc:0 "\n\n[target.GetName]의 곁에는 마침 명사수 한 명이 따르고 있었다. 기수는 가까이 다가가기도 전에 화살 한 대를 맞고 말에서 떨어졌다."
 quix_murder_outcome.4008.exposed_scheme:0 "\n\n기수는 산 채로 붙잡혀, 심문 중에 당신의 이름을 털어놓았다!"
 quix_murder_outcome.4008.not_exposed_scheme:0 "\n\n유일한 위안이라면, 그자가 말에서 떨어질 때 목이 부러져 더 이상 당신을 불 수 없게 되었다는 것이다."
 quix_murder_outcome.4008.a.discovered:0 "밤길에는 도적이 많은데, 어찌 모든 것을 내 탓으로 돌리겠는가?"
 quix_murder_outcome.4008.a:0 "그만두자. [target.GetFirstNameNoTooltip](이)가 운이 좋았던 것으로 치자."
 quix_murder_outcome.4008.b:0 "그 좋은 말이 아깝구나. 다시 도모하자."
 quix_murder_outcome.4009.t:0 "가짜 의원"
 quix_murder_outcome.4009.failure_declaration_1:0 "[target.GetTitledFirstName](은)는 아직 살아 있다. 적어도 지금은."
 quix_murder_outcome.4009.failure_declaration_2:0 "아아, [target.GetTitledFirstName](은)는 끝내 피를 흘리며 죽지 않았다. 참으로 아쉽구나."
 quix_murder_outcome.4009.failure_declaration_3:0 "의원으로 꾸민 사람을 보내 [target.GetTitledFirstName](을)를 죽이려던 이 계책은 수포로 돌아간 듯하다."
 quix_murder_outcome.4009.desc:0 "\n\n막 폄석을 대려는 순간, 진짜 의원이 갑자기 문을 두드렸다. 이름을 사칭한 자는 그 자리에서 탄로 났고, [target.GetTitledFirstName]도 곧바로 사람들에게 보호받았다."
 quix_murder_outcome.4009.exposed_scheme:0 "\n\n이름을 사칭한 자는 다급한 나머지 자신이 당신이 보낸 자객이라고 실토해 버렸으니, 좌중이 한바탕 떠들썩해졌다!"
 quix_murder_outcome.4009.not_exposed_scheme:0 "\n\n다행히 당신의 가짜 의원은 명의를 흠모하여 이름을 빌려 가르침을 구하러 왔다는 시늉을 해낼 수 있었다! 몇 마디 얼버무린 뒤, 그는 짐을 챙겨 서둘러 작별했다."
 quix_murder_outcome.4009.a.discovered:0 "황당하구나, 황당해!"
 quix_murder_outcome.4009.a:0 "[target.GetFirstNameNoTooltip](을)를 피가 다해 죽게 하려 했건만, 그만두자."
 quix_murder_outcome.4009.b:0 "운이 따르지 않았을 뿐, 나중에 다시 도모하자."
 quix_murder_outcome.4010.t:0 "나면의 자객"
 quix_murder_outcome.4010.failure_declaration_1:0 "몹시 분하게도, [target.GetTitledFirstName](은)는 아직 살아 있다."
 quix_murder_outcome.4010.failure_declaration_2:0 "구나 연회를 틈타 [target.GetTitledFirstName](을)를 죽이려던 계획은 완전히 실패했다."
 quix_murder_outcome.4010.failure_declaration_3:0 "참으로 재수 없구나! [target.GetTitledFirstName](은)는 당신의 자객 손에 죽지 않았다!"
 quix_murder_outcome.4010.desc:0 "\n\n장내의 빈객들이 모두 나면을 쓰고 있어, 당신의 사람들은 끝내 누가 [target.GetTitledFirstName]인지 가려내지 못했다. 연회가 파할 때까지 자객은 목표를 찾지 못했다."
 quix_murder_outcome.4010.exposed_scheme:0 "\n\n몇 시진이나 법석을 떤 끝에 그들이 마지막으로 노린 것은 엉뚱한 사람이었다! [target.GetTitledFirstName](은)는 아예 연회에 오지도 않았던 것이다! 당신의 사람들은 금세 붙잡혔고, 그중 입을 다물지 못한 자가 모든 것을 말해 버렸다."
 quix_murder_outcome.4010.not_exposed_scheme:0 "\n\n쓸모없는 자객 몇이 하룻밤 나희를 공짜로 구경한 것 말고는 아무 일도 일어나지 않았다!"
 quix_murder_outcome.4010.a.discovered:0 "그저 사람을 잘못 알아봤을 뿐이다!"
 quix_murder_outcome.4010.a:0 "모두가 흥겨웠는데 나만 헛수고를 했구나. 그만두자."
 quix_murder_outcome.4010.b:0 "훗날을 기다려 다시 도모하자."
 quix_murder_outcome.4011.t:0 "호인 손님"
 quix_murder_outcome.4011.failure_declaration_1:0 "당신이 고용한 자객은 [target.GetTitledFirstName](을)를 죽이지 못했다!"
 quix_murder_outcome.4011.failure_declaration_2:0 "[target.GetTitledFirstName](을)를 암살하려던 계획이 실패했다! 그 호인 손님은 당신이 기대한 만큼 쓸모 있지 못했다."
 quix_murder_outcome.4011.failure_declaration_3:0 "[target.GetTitledFirstName](이)가 그 기묘한 호인 손님의 손에 죽지 않았다는 것을 알고, 당신은 속이 몹시 상했다!"
 quix_murder_outcome.4011.desc:0 "\n\n그 이방인의 차림새와 병기가 너무 눈에 띄어 곧 경비병의 검문을 받게 되었다. 몸을 뒤지자 당신이 건넨 경로도까지 나와, 암살 계획은 그대로 들통나고 말았다."
 quix_murder_outcome.4011.not_exposed_scheme:0 "\n\n다행히 이 일은 당신에게까지 번지지 않았다. 그는 당신의 이름조차 모르고 있었으니까!"
 quix_murder_outcome.4011.exposed_scheme:0 "\n\n그 지도에는 대금 내역과 당신에게 답신을 보낼 연락 경로까지 끼워져 있었다! 불행히도, 거기엔 당신의 이름이 적혀 있었다."
 quix_murder_outcome.4011.a.discovered:0 "그자는 말이 통하지 않으니, 필시 통역이 잘못된 것이오!"
 quix_murder_outcome.4011.a:0 "지쳤소. 다시는 이런 짓 않겠소."
 quix_murder_outcome.4011.b:0 "다음엔 두 사람을 함께 보내야겠군."
 quix_murder_outcome.4012.t:0 "사나운 개를 부추기다"
 quix_murder_outcome.4012.failure_declaration_1:0 "당신은 [target.GetTitledFirstName](이)가 개밥이 되기를 바랐으나, 안타깝게도 뜻대로 되지 않았다."
 quix_murder_outcome.4012.failure_declaration_2:0 "[target.GetTitledFirstName](이)가 개 떼에게 물어뜯기는 광경을 상상하는 것만으로도 통쾌했건만, 아쉽게도 계획은 수포로 돌아갔다."
 quix_murder_outcome.4012.failure_declaration_3:0 "개를 풀어 [target.GetTitledFirstName](을)를 죽이려 한 것부터가 애초에 좋은 생각이 아니었는지도 모른다."
 quix_murder_outcome.4012.desc:0 "\n\n마침 [target.GetName]의 몸에 육포가 있어, 재빨리 던져 사나운 개들을 달랬다. 굶주린 개들은 도리어 조련사에게 달려들었고, 계략은 완전히 실패했다."
 quix_murder_outcome.4012.exposed_scheme:0 "\n\n조련사는 온몸이 물어뜯긴 채 붙잡혔다. 상대가 개를 다시 풀 듯한 시늉을 하자, 그는 당신의 이름을 불어 버렸다!"
 quix_murder_outcome.4012.not_exposed_scheme:0 "\n\n오늘의 유일한 다행이라면, 그자가 당신을 끌어들이기도 전에 제 개에게 물려 죽었다는 것이다!"
 quix_murder_outcome.4012.a.discovered:0 "이건 사나운 개일 뿐, 내가 보낸 것이 아니오!"
 quix_murder_outcome.4012.a:0 "[target.GetFirstNameNoTooltip]의 운이 좋았던 셈 치지. 그만두자."
 quix_murder_outcome.4012.b:0 "이번 실패로 기죽지 말자. 훗날 다시 도모하리라."
 quix_murder_outcome.4013.t:0 "온천"
 quix_murder_outcome.4013.failure_declaration_1:0 "안타깝게도 [target.GetTitledFirstName](은)는 아직 이 세상을 떠나지 않았다."
 quix_murder_outcome.4013.failure_declaration_2:0 "오늘 밤만큼은 [target.GetName](이)가 없는 세상에서 편히 잠들기를 얼마나 바랐던가. 하지만 일은 뜻대로 되지 않았다."
 quix_murder_outcome.4013.failure_declaration_3:0 "[target.GetTitledFirstName](은)는 미꾸라지처럼 미끄러웠다! [target.GetHerHim](을)를 붙잡았다고 여겼건만, [target.GetSheHe](은)는 아직 살아 있다."
 quix_murder_outcome.4013.desc:0 "\n\n자객이 목욕 수건 속에서 단도를 뽑아 드는 순간, [target.GetTitledFirstName] 역시 미리 숨겨 둔 병기를 꺼내 들었다. [target.GetSheHe](은)는 공격을 막아 내며 소리를 듣고 달려온 호위병이 올 때까지 버텼다."
 quix_murder_outcome.4013.exposed_scheme:0 "\n\n자객들은 허둥지둥 욕장을 빠져나갔지만, 그 자리에 있던 이들이 그들을 알아보았고 당신이 시킨 일이라는 것도 알게 되었다."
 quix_murder_outcome.4013.not_exposed_scheme:0 "\n\n자객들은 수건으로 얼굴을 가린 채 욕장을 빠져나갔다. 그들을 알아본 사람은 없었고, 당연히 당신이 연루된 것을 눈치챈 이도 없었다."
 quix_murder_outcome.4013.a.discovered:0 "욕장에서 벌어진 말다툼을 어찌 내 탓으로 돌리는가?"
 quix_murder_outcome.4013.a:0 "다들 이만큼 망신을 당했으면 됐지."
 quix_murder_outcome.4013.b:0 "이번은 시험 삼아 해 본 것이라 치고, 다시 하자."
 quix_murder_outcome.4014.t:0 "강가에서의 우연한 만남"
 quix_murder_outcome.4014.failure_declaration_1:0 "온갖 수를 다 썼건만, [target.GetTitledFirstName](은)는 끝내 그 강물에 빠져 죽지 않았다!"
 quix_murder_outcome.4014.failure_declaration_2:0 "일은 뜻대로 되지 않았다. [target.GetTitledFirstName](은)는 거센 물살에 휩쓸려 가지 않았다!"
 quix_murder_outcome.4014.failure_declaration_3:0 "[target.GetTitledFirstName](이)가 강에 빠지면 틀림없이 죽으리라 여겼지만, 당신의 착각이었다!"
 quix_murder_outcome.4014.desc:0 "\n\n당신은 등 뒤에서 [target.GetHerHim](을)를 힘껏 떠밀었으나, [target.GetSheHe](은)는 강에 빠지지 않고 비탈을 굴러 강가에 멈췄을 뿐이었다."
 quix_murder_outcome.4014.exposed_scheme:0 "\n\n쫓아 내려가던 당신은 도리어 발을 헛디뎌 물에 빠졌고, [target.GetHerHim](와)과 함께 급류에 휩쓸렸다! 다행히 다리 위에서 어부가 그물을 내리고 있어, 두 사람은 그물을 붙잡고 끌어올려져 숨을 헐떡였다. 당신은 몸을 일으키자마자 줄행랑을 쳤지만, [target.GetTitledFirstName](은)는 당신이 [target.GetHerHim](을)를 죽이려 했다는 것을 이미 알아 버렸다!"
 quix_murder_outcome.4014.not_exposed_scheme:0 "\n\n[target.GetSheHe](은)는 암초 위쪽의 얕은 여울에 떨어져 가벼운 상처만 입고는 곧장 큰 소리로 도움을 청했다. 당신은 남의 눈에 띄기 전에 슬그머니 빠져나왔다. 그나마 [target.GetTitledFirstName]의 하루를 망쳐 놓은 것으로 위안을 삼을 수는 있겠으나, 당신이 원한 건 이보다 훨씬 큰 것이었다!"
 quix_murder_outcome.4014.a.discovered:0 "내가 발을 헛디뎌 미끄러졌을 뿐이오!"
 quix_murder_outcome.4014.a:0 "[target.GetFirstNameNoTooltip]의 명줄이 질긴 것이 원통하구나. 그만두자!"
 quix_murder_outcome.4014.b:0 "다음엔 물속에 눌러 버려야겠군."
 quix_murder_outcome.4015.t:0 "대낮의 암살"
 quix_murder_outcome.4015.failure_declaration_1:0 "당신의 사람들은 [target.GetTitledFirstName](을)를 죽이지 못했다."
 quix_murder_outcome.4015.failure_declaration_2:0 "저잣거리에서 [target.GetTitledFirstName](을)를 찔러 죽이려던 계획이 실패했다!"
 quix_murder_outcome.4015.failure_declaration_3:0 "아아, 실패했다. 길 한복판에서 [target.GetTitledFirstName](을)를 죽이는 것보다 더 단도직입적인 계책이 또 있겠는가?"
 quix_murder_outcome.4015.desc:0 "\n\n[target.GetName]의 곁에는 늘 사람들이 북적였다. 자객은 간신히 가까이 다가갔으나 곧바로 사람들에게 가로막혀, 하는 수 없이 물러났다."
 quix_murder_outcome.4015.exposed_scheme:0 "\n\n채소를 팔던 노파가 지팡이를 들고 좌판에서 뛰쳐나와 자객들을 마구 두들기더니, 그중 하나를 기절시켜 버렸다! 나머지는 달아났지만, 붙잡힌 자가 이미 당신을 불어 버렸다!"
 quix_murder_outcome.4015.not_exposed_scheme:0 "\n\n당신의 자객들은 성난 저잣거리 사람들에게 쫓겨 시장을 빠져나갔고, 말 탄 자들에게 하루 종일 쫓긴 끝에 겨우 따돌렸다. 적어도 당신이 이 일에 연루된 것을 아는 사람은 아직 없다."
 quix_murder_outcome.4015.a.discovered:0 "우리가 웃음거리가 되었구나!"
 quix_murder_outcome.4015.a:0 "참으로 불운하도다. 그만두자."
 quix_murder_outcome.4015.b:0 "낙심하지 말고 다시 도모하자."
 quix_murder_outcome.4016.t:0 "거짓 명령으로 체포하다"
 quix_murder_outcome.4016.failure_declaration_1:0 "[target.GetTitledFirstName](을)를 잡아들여 처형하려던 계획은 성공하지 못했다."
 quix_murder_outcome.4016.failure_declaration_2:0 "실패했다! [target.GetTitledFirstName](은)는 아직 살아 있다. 그것도... 멀쩡하게."
 quix_murder_outcome.4016.failure_declaration_3:0 "[target.GetTitledFirstName](은)는 붙잡혀 가지도, 죽지도 않았다! 참으로 실망스럽기 짝이 없다."
 quix_murder_outcome.4016.desc:0 "\n\n[target.GetName](은)는 이미 그 가짜 문서를 믿었건만, 하필이면 공모자가 무심코 언급한 관리가 바로 근처에 있었다. 속임수는 그 자리에서 들통났고, 관원으로 위장한 자들은 사방으로 흩어져 달아날 수밖에 없었다."
 quix_murder_outcome.4016.exposed_scheme:0 "\n\n일이 순식간에 틀어져 당신의 사람들이 붙잡혔고, 고문을 견디지 못해 모든 것을 자백했다!"
 quix_murder_outcome.4016.not_exposed_scheme:0 "\n\n그나마 다행인 것은, 사람들이 이 일을 말이 잘못 전해진 오해로 여기고 서둘러 물러갔다는 점이다. 다행히 이 어리석은 일에서 당신이 맡은 역할은 지금까지 아무도 모른다."
 quix_murder_outcome.4016.a.discovered:0 "그때 [target.GetTitledFirstName]의 낯빛을 한번 보고 싶었는데!"
 quix_murder_outcome.4016.a:0 "이 얼마나 실망스러운가. 그만두자."
 quix_murder_outcome.4016.b:0 "또 처음부터 다시 해야 하는군."
 quix_murder_outcome.4017.t:0 "취전"
 quix_murder_outcome.4017.failure_declaration_1:0 "[target.GetTitledFirstName](은)는 당신의 자객 손에 죽지 않았다!"
 quix_murder_outcome.4017.failure_declaration_2:0 "역시 평범한 병기를 썼어야 했나 보다. [target.GetTitledFirstName](은)는 죽지 않았다!"
 quix_murder_outcome.4017.failure_declaration_3:0 "그 괴상한 작은 바늘로는 [target.GetTitledFirstName]의 목숨을 끊지 못했다!"
 quix_murder_outcome.4017.desc:0 "\n\n자객은 이 병기를 한 번도 써 본 적이 없었고, 쏘려는 순간 숨을 거꾸로 들이마시고 말았다. 독침은 그 자신의 목구멍에 박혔고, [target.GetName](은)는 털끝 하나 다치지 않았다."
 quix_murder_outcome.4017.exposed_scheme:0 "\n\n자객은 바닥에 쓰러져 한참을 경련하다 숨이 끊어졌고, 곁에 떨어진 대나무 관과 서신 몇 통이 [target.GetName]의 손에 들어갔다. 꼬리를 밟아 나가자 결국 당신에게까지 이르렀다."
 quix_murder_outcome.4017.not_exposed_scheme:0 "\n\n다행히 자객은 거의 그 자리에서 즉사했다. 본디 아무도 모르는 낯선 얼굴이었으니, 그를 당신과 연관 지을 수 있는 사람은 없다!"
 quix_murder_outcome.4017.a.discovered:0 "풋내기와는 함께 일을 꾀할 수 없구나!"
 quix_murder_outcome.4017.a:0 "운이 너무 나빴다. 그만두자."
 quix_murder_outcome.4017.b:0 "역시 평범한 방법으로 다시 도모하자."
 quix_murder_outcome.4018.t:0 "손수 비수를 쥐다"
 quix_murder_outcome.4018.failure_declaration_1:0 "어찌 이리 경솔하고 어리석었단 말인가? [target.GetTitledFirstName](을)를 죽이려던 계획은 이미 실패했다."
 quix_murder_outcome.4018.failure_declaration_2:0 "운명의 장난이로다! 당신은 [target.GetTitledFirstName](을)를 죽이지 못했다."
 quix_murder_outcome.4018.failure_declaration_3:0 "[target.GetTitledFirstName](을)를 죽이려던 이번 계책은 결국 그다지 믿을 만한 것이 아니었다..."
 quix_murder_outcome.4018.desc:0 "\n\n당신은 창문을 넘어 침실에 무사히 들어갔지만, 침상 앞에 거의 다다랐을 때 시녀에게 들키고 말았다. 그녀의 비명에 [target.GetTitledFirstName](이)가 잠에서 깨어났고, 당신은 곧바로 달아날 수밖에 없었다."
 quix_murder_outcome.4018.not_exposed_scheme:0 "\n\n당신은 황급히 두건을 끌어내리고 창문으로 뛰어내려 이웃 지붕 위로 올라섰다. 그 시녀는 당신을 본 적이 없고 날도 어두웠으니, 정체를 들키지 않았다고 확신한다. 앞으로는 다시는 이렇게 방심해서는 안 되겠지..."
 quix_murder_outcome.4018.a.discovered:0 "나는 참으로 어리석은 자로다!"
 quix_murder_outcome.4018.a:0 "옛말이 나를 그르쳤구나. 그만두자."
 quix_murder_outcome.4018.b:0 "이런 일은 역시 전문가에게 맡기는 게 낫겠군."
 quix_murder_outcome.4019.t:0 "벙어리 역사"
 quix_murder_outcome.4019.failure_declaration_1:0 "[target.GetTitledFirstName](은)는 당신이 고용한 그 무뢰한의 손에 죽지 않았다!"
 quix_murder_outcome.4019.failure_declaration_2:0 "[target.GetTitledFirstName](을)를 죽이라고 고용한 자가 일을 그르쳤다."
 quix_murder_outcome.4019.failure_declaration_3:0 "[target.GetTitledFirstName](은)는 아직 살아 있다. 모두 당신이 고용한 그 덩치 큰 사내의 무능 덕분이다."
 quix_murder_outcome.4019.desc:0 "\n\n그 장사는 [target.GetName](을)를 찾아내더니, 먼저 손짓 발짓으로 상대에게 신원을 확인시키려 들었다. [target.GetTitledFirstName](은)는 연신 고개를 저으며 다른 쪽을 가리켰고, 그렇게 손쉽게 위기를 넘겼다."
 quix_murder_outcome.4019.exposed_scheme:0 "\n\n[target.GetTitledFirstName](은)는 곧바로 경비병을 찾아갔다. 그들이 그 멍청한 사내를 붙잡자, 그는 손짓으로 당신을 불어 버렸다! 이제 모두가 당신이 이 음모에 가담했음을 안다."
 quix_murder_outcome.4019.not_exposed_scheme:0 "\n\n[target.GetTitledFirstName]의 고함 소리에 당신의 장사는 성 밖의 빈 무덤에 숨어 날이 저물 때까지 버텨야 했다! 다행히 그는 수색을 피해 꽁지가 빠지게 돌아왔다. 적어도 이 어리석은 일이 당신에게까지 번지지는 않았다."
 quix_murder_outcome.4019.a.discovered:0 "그자의 머리는 진작에 얻어맞아 망가졌으니, 그 말을 어찌 믿겠소!"
 quix_murder_outcome.4019.a:0 "아쉽군. 하나 인생에는 더 중요한 일들이 있는 법."
 quix_murder_outcome.4019.b:0 "괜찮다. 일을 이루려면 본디 몇 번의 우여곡절을 겪는 법이지."
 quix_murder_outcome.4020.t:0 "탐환의 무리"
 quix_murder_outcome.4020.failure_declaration_1:0 "[target.GetTitledFirstName](은)는 당신이 고용한 자객 손에 죽지 않았다!"
 quix_murder_outcome.4020.failure_declaration_2:0 "[target.GetTitledFirstName](은)는 죽지 않았다!"
 quix_murder_outcome.4020.failure_declaration_3:0 "안타깝게도 [target.GetTitledFirstName](은)는 아직 살아 있다."
 quix_murder_outcome.4020.desc:0 "\n\n그 수상한 무리는 돈을 받고는 그대로 종적을 감췄다. 처음부터 끝까지 이것은 사기극이었다."
 quix_murder_outcome.4020.exposed_scheme:0 "\n\n어쩌면 당신이 상대한 자들은 애초에 [target.GetTitledFirstName]에게 충성하는 이들이었을까? 아니면 정체 모를 제삼자였을까? 누구든 간에, 그들은 계획의 전말을 [target.GetTitledFirstName]에게 고해 바쳤고, 이제 이 일은 모두가 아는 사실이 되었다."
 quix_murder_outcome.4020.not_exposed_scheme:0 "\n\n그 무리와 약속한 연락 경로는 모두 끊겼다. 감시하라고 보낸 사람은 그들이 애초에 일을 벌일 생각이 없었으며 그대로 사라졌다고 보고했다. 사기극인가? 함정인가? 아니면 무산된 음모인가? 당신은 그저 속으로 짐작해 볼 뿐이다. 다행히 뒤탈은 없는 듯하다. 이 일로 당신을 협박하는 자도 없고, [target.GetTitledFirstName] 또한 낌새를 채지 못했다. 이 일은 지금까지도 수수께끼로 남아 있다..."
 quix_murder_outcome.4020.a.discovered:0 "그대들은 누군가 날조하여 모함한 것임을 모르겠는가?"
 quix_murder_outcome.4020.a:0 "내가 속았구나!"
 quix_murder_outcome.4020.b:0 "대단한 장사로군. 다음엔 믿을 만한 자를 따로 찾아야겠다."
 hd_quix_defer_murder_setup_tt:0 "일단 손을 떼고 다른 때를 기다립니다. 다만 앞서 꾸며 둔 일이 이미 드러났는지는 아직 알 수 없습니다."
