l_korean:
 hd_story_cao_expansion:0 "조조: 세력 확장"
 hd_story_cao_expansion_desc:0 "반동탁 연합은 이미 흩어졌다. 조조는 매번 한 주를 진군 방향으로 삼아 각지에 할거한 무리를 하나씩 굴복시킨다."
 HD_CAO_EXPANSION_STORY_STATUS:0 "조조는 지금 한 주를 목표로 군사를 움직이고 있다. 이 주가 평정되거나 주 안에 더 이상 노릴 적이 없으면 다음 진로를 의논한다. 이 방면의 전쟁은 조조가 직접 명을 내려 일으켜야 한다."
 hd_cao_expansion.0001.t:0 "칼끝이 향하는 곳"
 hd_cao_expansion.0001.desc:0 "장수들이 지난 방면의 군무를 다 보고했지만, 당신은 그들을 물러가게 하지 않았다. 지도는 아직 펼쳐져 있고 군량도 이미 점검을 마쳤으니, 다음에는 어느 곳이 먼저 당신의 북소리를 듣게 할지 의논하기에 마침 좋다.\n\n예주, 청주, 서주. 이름은 입에 올리면 가볍지만, 정말로 차지하려면 대군을 한 리 한 리 이끌고 가야 한다. 수비군과 군량길에 대해 이미 물어 두었기에, 누군가 다시 옛 논의를 되풀이하기 시작하자 손을 들어 막았다. 옛 명령이 어디까지 이행되었는지는 마음속으로 알고 있으면 그만이지, 오늘 자리를 그것으로 채울 필요는 없다.\n\n세 주 가운데 아직 평정되지 않은 곳이 있다면 그중 요긴한 곳부터 치고, 모두 손에 넣었다면 얻은 것을 진정 당신의 쓰임이 되게 해야 한다. 당신은 영전 하나를 손가락 사이에 쥔 채 마지막 군정 보고가 끝나기를 기다린다."
 hd_cao_expansion.0001.a:0 "예주로 진군한다."
 hd_cao_expansion.0001.b:0 "청주로 진군한다."
 hd_cao_expansion.0001.c:0 "서주로 진군한다."
 hd_cao_expansion.0001.d:0 "세 주는 이미 평정되었으니 강토를 정비한다."
 hd_cao_expansion.yuzhou_tt:0 "칼끝을 예주로 향합니다. 이 방면의 일이 끝나면 다음 단계를 의논합니다."
 hd_cao_expansion.qingzhou_tt:0 "칼끝을 동쪽 청주로 향합니다. 이 방면의 일이 끝나면 다음 단계를 의논합니다."
 hd_cao_expansion.xuzhou_tt:0 "칼끝을 서주로 돌립니다. 이 방면의 일이 끝나면 다음 단계를 의논합니다."
 hd_cao_expansion.finished_tt:0 "예주, 청주, 서주 세 주가 모두 당신의 판도에 들어왔습니다. 더 이상 사방으로 정벌하지 않고, 얻은 강토를 정비하는 데 힘씁니다."
 hd_cao_expansion_cb_victory_desc:0 "조조가 적의 강토를 모두 집어삼킵니다. 상대가 가진 모든 작위가 조조에게 넘어가고, 그 휘하 봉신들은 모두 조조에게 귀순합니다."
 hd_cao_expansion_cb_white_peace_desc:0 "양측이 군사를 거두고 각자 원래의 경계를 지킵니다."
 hd_cao_expansion_cb_defeat_desc:0 "조조의 이번 진군은 성과 없이 돌아가고, 각자 원래의 경계를 지킵니다."
 hd_cao_expansion_cb_invalidated_desc:0 "이 전쟁은 명분을 잃어 이로써 그치며, 각자 원래의 경계를 지킵니다."
