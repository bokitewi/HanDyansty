l_korean:
 hd_dc_par.0001.t: "한 번의 진휼, 두 통의 상주문"
 hd_dc_par.0001.desc: "두 통의 상주문은 같은 재해를 다루고 있었으나, 주장은 정반대였다. 한쪽은 세금을 줄여 백성이 우선 눈앞의 고비를 넘기게 하자고 청했고, 다른 쪽은 국고와 군비의 지출을 열거하며 지금은 오히려 현행 세제를 지켜야 한다고 보았다.\n\n두 영수가 저마다 자기 주장을 고집하며 당신의 재결을 기다리고 있다. 조령은 결국 지방 수령의 손에 떨어질 것이니, 조정에서 명분만 다툴 일이 아니다."
 hd_dc_par.0001.a: "양측에 각자 수입과 지출의 내역을 갖추게 하여 장부를 철저히 조사한다."
 hd_dc_par.0001.a.tt: "현지 수령이 장부 작성을 맡겠다고 하면, 다시 두 영수에게 각각 넘겨 검증하게 합니다:"
 hd_dc_par.0001.b: "우선 감세를 허락하고, 그것을 주장한 자가 앞장서게 한다."
 hd_dc_par.0001.b.tt: "감세를 주장한 영수가 명을 받들고 현지 수령도 시행에 응하면, 감세를 1년간 시범 시행할 수 있습니다:"
 hd_dc_par.0001.c: "옛 제도를 그대로 지키되, 두 경은 각자 자중하라."
 hd_dc_par.0001.d: "서로 가까운 두 군을 골라 함께 시험하여 검증한다."
 hd_dc_par.0001.d.tt: "두 군의 수령이 모두 맡겠다고 하면(한 군은 감세, 한 군은 종전대로), 1년 뒤 두 영수가 함께 검증합니다:"
 hd_dc_par.invalid: "시세가 바뀌어 예전의 문서는 더 이상 시행할 수 없음."
 hd_dc_par.1301.t: "지방에 내려온 조령"
 hd_dc_par.1301.audit: "조정이 [hd_dc_audit_county.GetName]의 재물과 군량의 출입 및 수혜자를 조사하려 하며, 당신에게 장부 작성을 맡겼다. 당신이 응하면 조정이 30금을 내려 보내고, 장부는 현지 사정과 함께 두 영수에게 넘겨져 검증을 받는다.\n\n석 달 안에 분명한 답을 해야 한다. 문서만 받아 두고 조정이 일이 다 처리된 줄 알게 할 수는 없다."
 hd_dc_par.1301.relief: "[hd_dc_audit_county.GetName](이)가 감세를 시범 시행할 곳으로 선정되었다. 조정은 50금을 내려 보내, 당신에게 이곳에서 1년간 세금을 줄이고 가까운 다른 피해 군과 서로 비교하게 할 계획이다.\n\n두 곳이 모두 응한 뒤에야 돈이 내려온다. 보고서에는 당신의 이름이 적힐 것이니, 시범 기간 중 통치권을 잃거나 도중에 감세를 철회하면 처음과 끝을 잘 맺었다고 할 수 없다."
 hd_dc_par.1301.reserve: "[hd_dc_audit_county.GetName](이)가 종전대로 세금을 거둘 곳으로 선정되었다. 조정은 50금을 내려 보내, 당신에게 1년 동안 현행 세제를 유지하며 현지의 통치와 생계를 기록하게 하고, 감세한 다른 군과 함께 검증할 계획이다.\n\n당신이 속한 파가 언제나 옳다는 것을 증명할 필요는 없지만, 손수 처리한 일에는 책임을 져야 한다."
 hd_dc_par.1301.a: "이 소임을 내가 기꺼이 맡겠소."
 hd_dc_par.1301.a.tt: "각 측이 모두 응하면 조정의 지원금이 도착합니다:"
 hd_dc_par.1301.b: "이 소임은 맡기 어렵소."
 hd_dc_par.1302.t: "장부 검증과 서명"
 hd_dc_par.1302.first: "문서에 적힌 첫 번째 곳은 [hd_dc_instance.Var('hd_dc_audit_first_county').Title.GetName]이며, [hd_dc_instance.Var('hd_dc_audit_first_executor').Char.GetTitledFirstName](이)가 맡았다. 장부에는 [hd_dc_instance.Var('hd_dc_audit_first_payment').Var('hd_dc_actual_debit').GetValue|0]금을 내보내고 [hd_dc_instance.Var('hd_dc_audit_first_payment').Var('hd_dc_actual_credit').GetValue|0]금이 도착했다고 적혀 있다.\n\n이 장부는 당신이 직접 검증해야 한다. 다른 영수도 따로 답할 것이니, 누구도 남을 대신해 서명할 수 없다."
 hd_dc_par.1302.second: "\n\n다른 한 곳은 [hd_dc_instance.Var('hd_dc_audit_second_county').Title.GetName]이며, [hd_dc_instance.Var('hd_dc_audit_second_executor').Char.GetTitledFirstName](이)가 맡았다. 장부에는 [hd_dc_instance.Var('hd_dc_audit_second_payment').Var('hd_dc_actual_debit').GetValue|0]금을 내보내고 [hd_dc_instance.Var('hd_dc_audit_second_payment').Var('hd_dc_actual_credit').GetValue|0]금이 도착했다고 적혀 있다.\n\n두 곳의 1년 시범 시행이 모두 만료되었다. 첫 번째 곳은 장악력이 [hd_dc_instance.Var('hd_dc_audit_first_start_control').GetValue|0]에서 [hd_dc_instance.Var('hd_dc_audit_first_end_control').GetValue|0](으)로, 개발도가 [hd_dc_instance.Var('hd_dc_audit_first_start_development').GetValue|0]에서 [hd_dc_instance.Var('hd_dc_audit_first_end_development').GetValue|0](으)로 바뀌었고, 두 번째 곳은 장악력이 [hd_dc_instance.Var('hd_dc_audit_second_start_control').GetValue|0]에서 [hd_dc_instance.Var('hd_dc_audit_second_end_control').GetValue|0](으)로, 개발도가 [hd_dc_instance.Var('hd_dc_audit_second_start_development').GetValue|0]에서 [hd_dc_instance.Var('hd_dc_audit_second_end_development').GetValue|0](으)로 바뀌었다. 이 변화가 모두 시범 시행의 공이라고 할 수는 없으니, 이것만으로 어느 파가 이겼다고 자랑하는 것은 온당치 않다."
 hd_dc_par.1302.a: "항목마다 검증을 마쳤으니, 기꺼이 서명하겠소."
 hd_dc_par.1302.b: "이 검수에는 서명하지 않겠소."
 hd_dc_par.1303.t: "문서를 덮을 때"
 hd_dc_par.1303.verified: "돈의 증빙과 두 영수 각자의 서명이 모두 갖추어졌다. 일을 맡은 이가 이 사건의 문서를 하나로 묶었으니, 더 이상 돈을 내려 보내지 않고 시범 시행도 이어 가지 않는다.\n\n문서는 이로써 천하가 안정되었다고 선언하지 않으며, 아직 끝나지 않은 전쟁과 약속의 결말을 대신 적어 주지도 않는다."
 hd_dc_par.1303.partial: "두 곳의 시범 시행이 함께 기한을 채우지 못했다. 이미 내려 보낸 돈, 시행했던 정령, 도중에 끊긴 까닭이 모두 문서에 따로 기록되었고, 아직 도착하지 않은 돈도 장부에 걸려 있다.\n\n한 곳이 성사되었다고 해서 두 곳이 모두 성사되었다고 할 수는 없다."
 hd_dc_par.1303.failed: "이 소임은 필요한 응낙과 시행과 검증을 모두 갖추지 못했다. 일을 맡은 이가 중단된 까닭을 기록해 두었고, 이미 오간 돈은 그대로 장부에 남는다. 빠진 증빙은 한 장의 결론으로 채울 수 없다."
 hd_dc_par.1303.a: "문서를 보관하여 훗날 참고하게 한다."
