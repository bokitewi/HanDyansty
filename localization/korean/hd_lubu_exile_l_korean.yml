l_korean:
 hd_story_lubu_exile:0 "여포: 장안에서 패주하다"
 hd_story_lubu_exile_desc:0 "장안 전투에서 패한 여포는 예전의 관작과 영지를 잃고, 옛 부하들을 불러 모아 천하를 떠도는 길에 올랐다."
 HD_LUBU_EXILE_STORY_STATUS:0 "장안을 잃은 여포는 병주의 옛 부하들을 수습하여 사방을 전전하며 다음 발붙일 곳을 찾고 있다."
 hd_lbx_event_troops:0 "여포의 병주 옛 부하"
 hd_lubu_exile.0001.t:0 "장안에서 패주하다"
 hd_lubu_exile.0001.desc:0 "장안은 더 이상 지킬 수 없었다. 성을 나설 때 누군가 부중의 물건을 어떻게 처리할지 물었으나, 당신은 돌아보며 그를 한 번 노려보고는 말을 재촉하여 떠났다. 이각이 성을 차지했다 한들, 설마 당신의 손발까지 붙잡아 둘 수 있겠는가?\n\n갑옷을 걸친 옛 부하들이 다시 깃발 아래 모였지만, 점호 소리 속에 낯익은 대답 몇 개가 빠져 있었다. 고삐를 움켜쥐고 끝까지 듣고 나니, 가슴속 분노가 더욱 풀 길이 없었다. 지금이라도 돌아가 싸울 수 있다면, 어찌 이들이 당신을 따라 성 밖에서 잘 곳을 찾게 했겠는가!\n\n그러나 장병들은 모두 당신이 입을 열기를 기다리고 있다. 당신은 병기를 바로 들고 각 대에 집결하라 명했다. 천하가 곳곳에서 당신을 받아 주지는 않겠지만, 그렇다고 당신이 무용을 쓸 곳이 없을 만큼 넓지도 않다. 우선 이곳을 벗어나고, 그다음에 누가 감히 이 여봉선을 얕보는지 두고 보리라."
 hd_lubu_exile.0001.a:0 "옛 부하들을 수습하여 따로 몸 둘 곳을 찾는다."
 hd_lubu_exile.0003.t:0 "관동으로 달아나다"
 hd_lubu_exile.0003.desc:0 "관중은 당신을 받아 주지 않지만, 천하에 관중만 있는 것은 아니다.\n\n진궁이 등불 아래 지도를 펼치더니, 손가락으로 동쪽을 따라 짚어 가다 연주에서 멈추었다. 그곳은 조조가 멀리 다른 곳에 가 있고, 여러 군의 수신들은 저마다 딴마음을 품고 있으며, 제양 일대에는 진정으로 장악할 만한 자가 없다고 했다. 명분이야 다투면 그만이니, 손에 군사만 있으면 된다는 것이다.\n\n옛 부하들은 이미 집결했고, 군량 수레도 준비되었다. 당신은 극을 땅에 짚고 무리에게 말했다. 동쪽으로 간다, 먼저 제양을 취하고 그다음 연주를 취하리라!"
 hd_lubu_exile.0003.a:0 "진영을 거두어 동쪽으로 가서, 먼저 제양을 취한다."
 hd_lubu_exile.0003.a.tt:0 "머지않아 당신은 군사를 일으켜 제양을 공략할 것입니다."
