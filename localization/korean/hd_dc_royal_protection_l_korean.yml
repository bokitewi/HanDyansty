l_korean:
 hd_dc_support.0008.b: "가족과 봉지를 보전한다는 맹약이 없으면 감히 명을 받들 수 없소."
 hd_dc_support.0008.b.tt: "[hd_dc_support_claimant.GetTitledFirstName](이)가 당신의 가족과 봉지를 보전하겠다는 맹서에 서명한다면:"
 hd_dc_support.0208.t: "보전을 약속하는 한 장의 문서"
 hd_dc_support.0208.desc: "답서에는 병마를 약속하는 말이 없었고, 먼저 열거된 것은 [hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName](이)가 가장 마음 놓지 못하는 몇 가지였다. 자기 자신, 지금 살아 있는 가까운 혈족, 그리고 그들이 현재 가진 봉지였다.\n\n“이것조차 분명히 말하지 않으려 한다면, 내 어찌 온 집안 식솔을 훗날의 봉상이라는 한마디에 맡기겠소?”\n\n상대는 당신에게 5년간 직접 보증해 달라고 한다. 훗날 태어날 후손이나 새로 얻을 봉지는 여기에 포함되지 않으며, 정말로 죄를 지은 자가 있다면 그대로 법에 따라 처리할 수 있다."
 hd_dc_support.0208.a: "오늘의 명부에 따라 약조를 맺되, 5년을 기한으로 한다."
 hd_dc_support.0208.a.tt: "당신은 자신의 이름으로 맹세합니다. 5년 동안 맹서에 적힌 사람들과 그 봉지를 보전하겠다고."
 hd_dc_support.0208.b: "이 약조는 구속이 너무 심하니, 따르기 어렵소."
 hd_dc_support.0408.t: "맹서의 회신"
 hd_dc_support.0408.accepted: "[hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName](이)가 손수 맹서에 서명하였다. 당신과 가까운 혈족의 이름, 각자 명의의 봉지가 모두 서명한 날의 상황대로 하나하나 기록되었고, 5년의 기한이 이로써 시작되었다.\n\n이 맹서가 당신이 어느 파에 들어갔다는 뜻은 아니며, 먼저 봉상을 받은 것도 없다. 앞으로 약조를 지킬지는 서명한 사람이 실제로 어떻게 하느냐에 달려 있다."
 hd_dc_support.0408.rejected: "[hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName](이)가 맹서를 돌려보내며, 이 5년의 책임을 지려 하지 않았다.\n\n당신은 이 때문에 어느 파에 들어가지도 않았고, 아무런 이익도 얻지 못했다. 이번의 왕래는 이것으로 끝이다."
 hd_dc_support.0408.a: "답서를 삼가 보관한다."
