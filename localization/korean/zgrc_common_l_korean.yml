 culture_parameter_unlock_maa_wuyue_jianshi:0 "[GetMaA('zgrc_wuyue_jianshi').GetName] [men_at_arms|E](을)를 모집할 수 있음"
 culture_parameter_unlock_maa_zgrc_wuling_caiguan:0 "[GetMaA('zgrc_wuling_caiguan').GetName] [men_at_arms|E](을)를 모집할 수 있음"
