l_korean:
 # ============================================================
 # 特质：汉家冠带
 # ============================================================
 trait_zgrc_hanjia_guandai:0 "한가의 관대"
 trait_zgrc_hanjia_guandai_desc:0 "이 인물은 한나라의 관대를 갖춘 가문 출신으로, 행동거지에 예의가 있고 의관이 단정하다."
 trait_zgrc_hanjia_guandai_character_desc:0 "관대를 갖춘 집안에서 태어나 예악을 익히고 명예와 절개를 중히 여기니, 고을에서 존경을 받는다."

 # ============================================================
 # 游戏决议
 # ============================================================
 decision_group_type_zgrc:0 "한인 지역 풍속 결단"

 zgrc_debug_distribute_hanjia_guandai_decision:0 "Debug: 한가의 관대 재분배"
 zgrc_debug_distribute_hanjia_guandai_decision_desc:0 "(디버그) 화하 예악 문화의 모든 가문에 「한가의 관대」 특성을 수동으로 다시 분배합니다."
 zgrc_debug_distribute_hanjia_guandai_decision_tooltip:0 "화하 예악 문화의 모든 가문에 「한가의 관대」 특성을 다시 분배합니다."
 zgrc_debug_distribute_hanjia_guandai_decision_confirm:0 "한가의 관대 재분배"

 zgrc_debug_distribute_regional_customs_decision:0 "Debug: 각 지역 풍속 초기화"
 zgrc_debug_distribute_regional_customs_decision_desc:0 "(디버그) 《한서》 지리지의 구역 구분에 따라, 각 공작령의 영지와 작위 보유자를 해당 한 문화 분파로 바꿉니다."
 zgrc_debug_distribute_regional_customs_decision_tooltip:0 "각 공작령의 영지와 작위 보유자(중화 계승) 및 궁정을 해당 한 문화 분파로 바꿉니다."
 zgrc_debug_distribute_regional_customs_decision_confirm:0 "각 지역 풍속 초기화"

 # ============================================================
 # 游戏规则
 # ============================================================
 # ============================================================
 # 入乡随俗 —— 久居时限
 # ============================================================
 rule_zgrc_ruxiang_time:0 "입향순속: 거주 기한"
 setting_zgrc_ruxiang_time_5:0 "5년"
 setting_zgrc_ruxiang_time_5_desc:0 "타향에 객으로 머무는 자는 #high 5#!년을 연속으로 거주해야 입향순속할 수 있습니다."
 setting_zgrc_ruxiang_time_10:0 "10년"
 setting_zgrc_ruxiang_time_10_desc:0 "타향에 객으로 머무는 자는 #high 10#!년을 연속으로 거주해야 입향순속할 수 있습니다."
 setting_zgrc_ruxiang_time_30:0 "30년"
 setting_zgrc_ruxiang_time_30_desc:0 "타향에 객으로 머무는 자는 #high 30#!년을 연속으로 거주해야 입향순속할 수 있습니다."

 # ============================================================
 # 开局初始化 —— 地域风俗/汉家冠带分发
 # ============================================================
 rule_zgrc_init_on_start:0 "게임 시작 시 초기화"
 setting_zgrc_init_on_start_enabled:0 "활성화"
 setting_zgrc_init_on_start_enabled_desc:0 "게임 시작 시 각 한 지역 문화에 #EMP 지역 풍속 전통#!과 #EMP 한가의 관대#!를 자동으로 분배합니다."
 setting_zgrc_init_on_start_disabled:0 "비활성화"
 setting_zgrc_init_on_start_disabled_desc:0 "게임 시작 시 자동으로 분배하지 않으며, 디버그 결단을 통해 수동으로 실행해야 합니다. 기존 저장 파일이나 사용자 지정 시작에 적합합니다."

 # ============================================================
 # 革新同步 —— 开关与周期（归一）
 # ============================================================
 rule_zgrc_innovation_sync:0 "혁신 동기화"
 setting_zgrc_innovation_sync_disabled:0 "닫기"
 setting_zgrc_innovation_sync_disabled_desc:0 "혁신 동기화를 끕니다. 각 문화가 모든 혁신을 스스로 연구해야 합니다."
 setting_zgrc_innovation_sync_1:0 "1년마다"
 setting_zgrc_innovation_sync_1_desc:0 "#high 1#!년마다 혁신 동기화를 한 번 실행합니다."
 setting_zgrc_innovation_sync_3:0 "3년마다"
 setting_zgrc_innovation_sync_3_desc:0 "#high 3#!년마다 혁신 동기화를 한 번 실행합니다."
 setting_zgrc_innovation_sync_5:0 "5년마다"
 setting_zgrc_innovation_sync_5_desc:0 "#high 5#!년마다 혁신 동기화를 한 번 실행합니다."
 setting_zgrc_innovation_sync_enabled:0 "활성화"
 setting_zgrc_innovation_sync_enabled_desc:0 "#EMP 한 문명 공유 혁신#!을 주기적으로 각 한 지역 문화에 동기화합니다."
 setting_zgrc_innovation_sync_threshold_1:0 "1년마다"
 setting_zgrc_innovation_sync_threshold_1_desc:0 "#high 1#!년마다 혁신 동기화를 한 번 실행합니다."
 setting_zgrc_innovation_sync_threshold_3:0 "3년마다"
 setting_zgrc_innovation_sync_threshold_3_desc:0 "#high 3#!년마다 혁신 동기화를 한 번 실행합니다."
 setting_zgrc_innovation_sync_threshold_5:0 "5년마다"
 setting_zgrc_innovation_sync_threshold_5_desc:0 "#high 5#!년마다 혁신 동기화를 한 번 실행합니다."

 # ============================================================
 # 天下响应 —— 非常时期封臣表态（事件 1010）
 # ============================================================
 rule_zgrc_luanshi_xiangying:0 "천하의 호응"
 setting_zgrc_luanshi_xiangying_disabled:0 "닫기"
 setting_zgrc_luanshi_xiangying_disabled_desc:0 "난세에 더 이상 봉신의 입장을 묻지 않습니다."
 setting_zgrc_luanshi_xiangying_player_only:0 "플레이어만"
 setting_zgrc_luanshi_xiangying_player_only_desc:0 "당신(봉신일 때)만 입장을 질문받으며, AI 봉신은 이 이벤트의 방해를 받지 않습니다."
 setting_zgrc_luanshi_xiangying_enabled:0 "모든 인물"
 setting_zgrc_luanshi_xiangying_enabled_desc:0 "당신과 AI 봉신 모두 비상시에 입장을 질문받습니다. AI는 대부분 근왕하고, 소수는 의병을 일으키거나 관망합니다."

 # ============================================================
 # 消息通知
 # ============================================================
 zgrc_innovation_sync_toast_title:0 "화하의 혁신이 전해지다"
 zgrc_innovation_sync_toast_desc:0 "화하의 여러 나라가 끊임없이 오가니, 다른 곳의 새로운 법과 좋은 제도가 이미 당신의 일족 사이에서 전해져 익혀지고 있습니다."
 # ============================================================
 # 新增士兵
 # ============================================================
 zgrc_hanjia_yiyong:0 "한가 의용병"
 zgrc_hanjia_yiyong_flavor:0 "이 향용들은 평소에는 농사를 짓다가 봉화가 오르면 창을 들고 따라나선다. 창진은 엉성하지만 빽빽하여 깨뜨리기 어렵고, 공성할 때도 기꺼이 해자를 메우고 적진에 뛰어든다."

 zgrc_yuyang_tuqi:0 "하삭 비기"
 zgrc_yuyang_tuqi_flavor:0 "하삭 변군의 궁기병은 기사에 뛰어나 화살비가 가볍고 끊임없으며, 무너져 달아나는 적을 추격하는 데 아주 능하여 침입한 기병들이 벗어나기 어렵다."
 zgrc_liujun_liangjiazi:0 "육군 철기"
 zgrc_liujun_liangjiazi_flavor:0 "천수, 농서 등 여섯 군의 양가 자제들은 재주와 힘이 남다르고 어려서부터 활쏘기를 익혔다. 이들이 무거운 갑옷을 걸치면 곧 정예 철기가 되어, 적진에 돌격할 때 그 기세를 막을 수 없다."
 zgrc_hexi_muqi:0 "하서 돌기"
 zgrc_hexi_muqi_flavor:0 "하서 양주는 물과 풀이 풍성하여, 그곳에서 나는 경기병은 가볍게 차려입고 활을 잘 쏜다. 이들은 늘 변새를 순찰하고 지키며 바람처럼 오가니, 습격과 추격에 아주 능하다."
 zgrc_jingchu_weishi:0 "형초 위사"
 zgrc_jingchu_weishi_flavor:0 "형초 땅은 예로부터 강한 쇠뇌로 이름났으니, 산과 늪 사이에는 쇠뇌를 잘 다루는 이가 많다. 위사들이 물에 의지해 진을 치고 연노를 일제히 쏘면, 화살비가 하늘을 가린다."
 zgrc_wuyue_jianshi:0 "오월 검사"
 zgrc_wuyue_jianshi_flavor:0 "오월 땅은 예로부터 검을 숭상했으니, 이 검사들은 근접전에서 질풍처럼 빠르고 숲과 늪 사이에서 돌진하여 싸우는 데 능하며, 용맹하고 사나워 죽음을 가벼이 여긴다."
 zgrc_wuling_caiguan:0 "오릉 재관"
 zgrc_wuling_caiguan_flavor:0 "관중의 오릉 일대에서는 호족들이 땅을 겸병하니, 양가의 자제들이 재관으로 뽑혔다. 재관은 발로 밟아 강한 쇠뇌를 당기고 무거운 갑옷을 입으며 방패를 벽처럼 세우니, 관중의 정예라 불린다."
 zgrc_zhongyuan_jieshi:0 "중원 개사"
 zgrc_zhongyuan_jieshi_flavor:0 "개란 갑옷을 뜻한다. 중원의 개사는 가벼운 갑옷을 입어 날쌔고 바람처럼 오가며, 밭두렁과 골목 사이에서 싸우는 데 능하니, 모이면 진을 이루고 흩어지면 찾기 어렵다."

 zgrc_beiwei_zhongbu:0 "배외 중보병"
 zgrc_beiwei_zhongbu_flavor:0 "주장의 장막 아래 친병으로, 모두 날래고 용감한 무사들로 채워졌다. 이들은 무거운 갑옷이 벽과 같고 진에 임하면 산악처럼 굳건하여, 나아가면 적의 예봉을 꺾어 버린다."
 zgrc_beiwei_zhongqi:0 "배외 중기병"
 zgrc_beiwei_zhongqi_flavor:0 "주장의 장막 아래 친위 기병으로, 사람과 말이 모두 철갑을 둘렀다. 진에 임하면 그 기세가 우레와 같아, 나아가면 적의 진영을 짓밟아 깨뜨린다."

 # 华夏锐士 / 华夏突骑 —— 汉传兵法基础兵种（独立兵种）
 zgrc_han_ruishi:0 "화하 예사"
 zgrc_han_ruishi_flavor:0 "무거운 갑옷을 입은 예사들이 양손으로 긴 칼날을 쥐어 방어와 살상력을 겸비했으니, 특히 근접전에서 말을 베고 진을 깨뜨려 적의 전열을 무너뜨리는 데 능하다."
 zgrc_han_tuqi:0 "화하 돌기"
 zgrc_han_tuqi_flavor:0 "무거운 갑옷을 입은 정예 기수들이 적진에 돌격하는 모습은 귀를 찢는 우레와 같다. 이들은 평원에서 돌격하여 적의 대열을 짓뭉갤 수도 있고, 아군의 측면을 엄호할 수도 있다."

 culture_parameter_unlock_maa_yuyang_tuqi:0 "[GetMaA('zgrc_yuyang_tuqi').GetName] [men_at_arms|E](을)를 모집할 수 있음"
