 # 祖风 · 跨大区迁居（30 条：名称按源区一致，描述逐方向各异）
 # ============================================================
 zgrc_zufeng_yanzhao_qilu_modifier:0 "연조의 선조 풍속"
 zgrc_zufeng_yanzhao_qilu_modifier_desc:0 "혈기가 아직 남아 느긋한 풍속에 녹아들기 어렵고, 예법이 맞지 않으니 마음이 편치 않다."
 zgrc_zufeng_yanzhao_sanhe_modifier:0 "연조의 선조 풍속"
 zgrc_zufeng_yanzhao_sanhe_modifier_desc:0 "날카로움이 지나치게 드러나 고을 사람들이 곁눈질하니, 권략도 언변도 펼치지 못한다."
 zgrc_zufeng_yanzhao_qinlong_modifier:0 "연조의 선조 풍속"
 zgrc_zufeng_yanzhao_qinlong_modifier_desc:0 "활과 말은 예전 그대로이나 고향 말이 통하지 않으니, 돌아갈 생각만 날로 간절하여 울적하다."
 zgrc_zufeng_yanzhao_jingwu_modifier:0 "연조의 선조 풍속"
 zgrc_zufeng_yanzhao_jingwu_modifier_desc:0 "용력은 줄지 않았으나 인정이 가깝지 않고, 권략을 펼치기 어려우니 마음이 편치 않다."
 zgrc_zufeng_yanzhao_dongyi_modifier:0 "연조의 선조 풍속"
 zgrc_zufeng_yanzhao_dongyi_modifier_desc:0 "활과 말의 용맹은 아직 남아 있으나, 변방 밖의 말과 풍속이 낯설어 인정이 성기다."

 zgrc_zufeng_qilu_yanzhao_modifier:0 "제노의 선조 풍속"
 zgrc_zufeng_qilu_yanzhao_modifier_desc:0 "현가의 습속은 아직 남아 있으나 사나운 고장은 글을 가벼이 여기니, 예법을 베풀 곳이 없고 권략을 펼칠 길이 없다."
 zgrc_zufeng_qilu_sanhe_modifier:0 "제노의 선조 풍속"
 zgrc_zufeng_qilu_sanhe_modifier_desc:0 "문교는 본디 서로 이어지나 예법이 엄격하니, 권략을 펼치기 어렵고 말실수를 하기 쉽다."
 zgrc_zufeng_qilu_qinlong_modifier:0 "제노의 선조 풍속"
 zgrc_zufeng_qilu_qinlong_modifier_desc:0 "관산이 험하고 멀며 말과 풍속이 다르니, 글과 검을 지닌 채 떠도는 신세라 울적함을 풀기 어렵다."
 zgrc_zufeng_qilu_jingwu_modifier:0 "제노의 선조 풍속"
 zgrc_zufeng_qilu_jingwu_modifier_desc:0 "시서의 가르침은 아직 남아 있으나 낮고 습한 땅의 인정과는 거리가 있으니, 권략이 드러나지 않아 마음이 편치 않다."
 zgrc_zufeng_qilu_dongyi_modifier:0 "제노의 선조 풍속"
 zgrc_zufeng_qilu_dongyi_modifier_desc:0 "장구의 학업은 버리지 않았으나, 요해의 말과 풍속이 낯설어 인정이 성기다."

 zgrc_zufeng_sanhe_yanzhao_modifier:0 "삼하의 선조 풍속"
 zgrc_zufeng_sanhe_yanzhao_modifier_desc:0 "부지런하고 두터운 성품은 아직 남아 있으나 사나운 땅에서는 신중함을 숭상하지 않으니, 예법을 행하기 어려워 마음이 편치 않다."
 zgrc_zufeng_sanhe_qilu_modifier:0 "삼하의 선조 풍속"
 zgrc_zufeng_sanhe_qilu_modifier_desc:0 "농사와 누에치기의 습속은 비슷하나 예법을 주고받는 데는 끝내 한 겹의 벽이 있으니, 마음이 편치 않다."
 zgrc_zufeng_sanhe_qinlong_modifier:0 "삼하의 선조 풍속"
 zgrc_zufeng_sanhe_qinlong_modifier_desc:0 "관산이 가로막혀 고향 말씨가 점점 바뀌니, 서쪽으로 고향을 바라보며 시름을 풀기 어렵다."
 zgrc_zufeng_sanhe_jingwu_modifier:0 "삼하의 선조 풍속"
 zgrc_zufeng_sanhe_jingwu_modifier_desc:0 "살림은 부지런히 꾸리나 강호의 인정은 헤아리기 어렵고, 권략이 드러나지 않으니 마음이 편치 않다."
 zgrc_zufeng_sanhe_dongyi_modifier:0 "삼하의 선조 풍속"
 zgrc_zufeng_sanhe_dongyi_modifier_desc:0 "추운 변방 땅에서는 옛 풍속을 펼치기 어렵고, 말과 풍속이 낯설어 인정이 성기다."

 zgrc_zufeng_qinlong_yanzhao_modifier:0 "진롱의 선조 풍속"
 zgrc_zufeng_qinlong_yanzhao_modifier_desc:0 "말 달리는 재주는 아직 남아 있으나 사나운 고장은 글을 가벼이 여기니, 예법을 베풀 곳이 없고 권략도 펼치지 못한다."
 zgrc_zufeng_qinlong_qilu_modifier:0 "진롱의 선조 풍속"
 zgrc_zufeng_qinlong_qilu_modifier_desc:0 "안장과 말의 습속은 아직 남아 있으나 읍양하는 나라에서는 주고받는 예가 맞지 않으니, 마음이 편치 않다."
 zgrc_zufeng_qinlong_sanhe_modifier:0 "진롱의 선조 풍속"
 zgrc_zufeng_qinlong_sanhe_modifier_desc:0 "말 달리는 성미는 중원의 예법에 용납되기 어려우니, 권략도 언변도 펼치지 못한다."
 zgrc_zufeng_qinlong_jingwu_modifier:0 "진롱의 선조 풍속"
 zgrc_zufeng_qinlong_jingwu_modifier_desc:0 "안장과 말을 배와 노로 바꾸니 행동거지가 맞지 않고, 권략이 드러나지 않으니 마음이 편치 않다."
 zgrc_zufeng_qinlong_dongyi_modifier:0 "진롱의 선조 풍속"
 zgrc_zufeng_qinlong_dongyi_modifier_desc:0 "관산이 만 리라 옛 재주를 쓸 곳이 없고, 말과 풍속이 낯설어 인정이 성기다."

 zgrc_zufeng_jingwu_yanzhao_modifier:0 "형오의 선조 풍속"
 zgrc_zufeng_jingwu_yanzhao_modifier_desc:0 "강호에서 다진 몸은 아직 튼튼하나, 사나운 고장은 부드러움을 숭상하지 않으니 예법을 행하기 어렵다."
 zgrc_zufeng_jingwu_qilu_modifier:0 "형오의 선조 풍속"
 zgrc_zufeng_jingwu_qilu_modifier_desc:0 "파도를 타는 용맹은 아직 남아 있으나, 예의의 나라에서는 주고받는 예가 맞지 않아 마음이 편치 않다."
 zgrc_zufeng_jingwu_sanhe_modifier:0 "형오의 선조 풍속"
 zgrc_zufeng_jingwu_sanhe_modifier_desc:0 "가볍고 날랜 성품은 중원의 묵직함에 용납되기 어려우니, 권략도 언변도 펼치지 못한다."
 zgrc_zufeng_jingwu_qinlong_modifier:0 "형오의 선조 풍속"
 zgrc_zufeng_jingwu_qinlong_modifier_desc:0 "배를 버리고 말에 오르니 풍토가 사뭇 다르고, 말이 통하지 않아 울적함을 풀기 어렵다."
 zgrc_zufeng_jingwu_dongyi_modifier:0 "형오의 선조 풍속"
 zgrc_zufeng_jingwu_dongyi_modifier_desc:0 "풍물이 강남과 크게 달라, 말과 풍속이 낯설고 인정이 성기다."

 zgrc_zufeng_dongyi_yanzhao_modifier:0 "동이의 선조 풍속"
 zgrc_zufeng_dongyi_yanzhao_modifier_desc:0 "유순하고 정숙하며 신의 있는 습속은 아직 남아 있으나, 기개를 숭상하는 땅에서는 걸핏하면 허물을 얻으니 권략을 베풀 곳이 없다."
 zgrc_zufeng_dongyi_qilu_modifier:0 "동이의 선조 풍속"
 zgrc_zufeng_dongyi_qilu_modifier_desc:0 "예의는 본디 서로 통하나, 다만 말과 예절은 아직 맞추어 가야 한다."
 zgrc_zufeng_dongyi_sanhe_modifier:0 "동이의 선조 풍속"
 zgrc_zufeng_dongyi_sanhe_modifier_desc:0 "법도가 엄격하여 권략을 펼치기 어렵고 말실수를 하기 쉽다."
 zgrc_zufeng_dongyi_qinlong_modifier:0 "동이의 선조 풍속"
 zgrc_zufeng_dongyi_qinlong_modifier_desc:0 "풍토가 사뭇 다르고 말이 통하지 않아 울적함을 풀기 어렵다."
 zgrc_zufeng_dongyi_jingwu_modifier:0 "동이의 선조 풍속"
 zgrc_zufeng_dongyi_jingwu_modifier_desc:0 "강호의 인정은 가볍고 약아서 유순한 이는 속기 쉬우니, 권략이 드러나지 않아 마음이 편치 않다."

