 # ============================================================
 # 汉文明基础兵种革新
 # ============================================================
 innovation_zgrc_han_bingfa:0 "화하 병법"
 innovation_zgrc_han_bingfa_desc:0 "손무와 오기의 전략, 사마의 법이 대대로 전해져 익혀졌다. 훈련과 사열이 분명하고 정연하니, 명령하면 행하고 금하면 그친다."
 innovation_zgrc_han_wubei:0 "제국의 무비"
 innovation_zgrc_han_wubei_desc:0 "제련과 단조의 기술이 정밀하고 능숙하며, 갑옷과 병장기, 활과 쇠뇌의 제도가 완비되었다. 중장 보병과 기병이 법도에 따라 군을 이룬다."

 # ============================================================
 # 人物 modifier
 # ============================================================
 zgrc_rende_modifier:0 "인덕 군자"
 zgrc_rende_modifier_desc:0 "귀순한 의군을 차마 칼날과 화살촉 앞으로 몰지 못하니, 인덕의 명성이 크게 떨쳤다."
 zgrc_gouquan_modifier:0 "구차한 목숨 보전"
 zgrc_gouquan_modifier_desc:0 "전쟁은 흉하고 위태로운 법이니, 현명하게 처신하여 몸을 보전했다. 비록 천수를 누릴 수는 있겠으나, 동료들이 환난에 달려갈 때 숨죽이고 나서지 않았으니 마음이 편치 않다."
 zgrc_zhongyi_modifier:0 "충의"
 zgrc_zhongyi_modifier_desc:0 "집안을 허물어 나라의 환난을 덜고, 재물을 흩어 군사를 일으켜 군부의 환난을 구했다. 고을 사람들은 그 의로움을 칭송하고, 선비와 백성은 그에게 마음을 돌린다."
 zgrc_yexin_modifier:0 "야심"
 zgrc_yexin_modifier_desc:0 "이 인물은 옛 주군을 저버리고 깃발을 들어 자립했다. 어떤 이는 그 칼끝을 두려워하고, 어떤 이는 그 사람됨을 경멸한다."
 # ============================================================
 # 传言系统 —— 祠/像（县 modifier）
 # ============================================================
 zgrc_ci_zhong:0 "충렬의 사당"
 zgrc_ci_zhong_desc:0 "마을 사람들이 사당을 세워 충렬을 제사 지낸다. 의로운 명성이 미치는 곳마다 민심이 분발한다."
 zgrc_ci_ren:0 "회인의 사당"
 zgrc_ci_ren_desc:0 "마을 사람들이 사당을 세워 인덕을 기린다. 어진 명성이 미치는 곳마다 백성들이 생업에 안주한다."
 zgrc_xiang_zui:0 "죄인의 상"
 zgrc_xiang_zui_desc:0 "쇠를 부어 상을 만들고 그 죄상을 적어, 지나는 이들이 경계로 삼게 한다."
 zgrc_xiang_ni:0 "침 뱉음을 받는 역적의 상"
 zgrc_xiang_ni_desc:0 "쇠를 부어 상을 만드니, 지나가는 마을 사람마다 침을 뱉어 그 악명이 그치지 않는다."
 # ============================================================
 # 传言系统 —— 主角 modifier
 # ============================================================
 zgrc_shengci_modifier:0 "생사당의 향불"
 zgrc_shengci_modifier_desc:0 "마을 사람들이 사당을 세워 그를 모시니 향불이 끊이지 않는다. 어진 이름이 멀리 퍼져 사방에서 칭송한다."
 zgrc_tuozhi_modifier:0 "누구나 침을 뱉는 자"
 zgrc_tuozhi_modifier_desc:0 "악명이 자자하여 고을에서 쇠로 상을 부어 침을 뱉는다. 거리를 지나는 이들마다 곁눈질하지 않는 이가 없다."
 zgrc_tuozhi_ni_modifier:0 "고향에 남은 악명"
 zgrc_tuozhi_ni_modifier_desc:0 "역적에 붙은 죄로 고을 사람들이 모두 그를 버렸다. 살아서는 고향 사람들의 침을 받고, 죽어서는 혼백까지 욕을 당할까 두렵다."
 zgrc_jidan_modifier:0 "꺼리는 바가 있음"
 zgrc_jidan_modifier_desc:0 "악명이 밖에 알려져 모두가 그를 경계한다. 자취를 감추고 날을 숨기니, 감히 다시 날뛰지 못한다."
 # ============================================================
 # 传言系统 —— 好感修正（opinion modifier）
 # 时长见 common/opinion_modifiers/zgrc_opinion_modifiers.txt
