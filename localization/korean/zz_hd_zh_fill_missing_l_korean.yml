l_korean:
 appoint_a_righteous_caliph_decision_mutazila_variant:0 "이성으로 정통 칼리파 옹립"
 appoint_a_righteous_caliph_decision_mutazila_variant_desc:0 "교단의 수장은 백성과 멀어졌고 교리에도 밝지 못하여 움마를 이끌기에 부족합니다. 이성의 길에 따르면 칼리파는 현자가 맡아야 하니, 나는 옳고 그름을 진정으로 분별할 수 있는 정통 칼리파를 따로 세워야 합니다."
 cancel:0 "취소"
 childhood.2200.desc:0 "[educator.GetNameNoTooltip]의 곁을 따르던 당신은 문득 [educator.GetSheHe]의 입에서 나오는 말이 궁정 사람들의 말과 똑같다는 것을 듣게 되었습니다. 귀 기울여 들어 보니 어렴풋이 몇 마디는 알아들을 수 있었습니다. 조금만 노력한다면 이 궁정의 말을 정말로 배울 수 있을지도 모릅니다."
 create_dar_al_islam_decision_tooltip:0 "여러 종파를 통합하여 다르 알이슬람을 세우고, 이를 당신의 [primary_title|E](으)로 삼습니다"
 demand_faction_switch_bribe_large_desc:0 "막대한 재물을 모두 내주며 다른 파벌로 옮기도록 설득합니다."
 demand_faction_switch_bribe_medium_desc:0 "상당한 금화와 비단으로 사례하며 다른 파벌로 옮기도록 설득합니다."
 demand_faction_switch_bribe_small_desc:0 "약간의 금화와 비단으로 사례하며 다른 파벌로 옮기도록 설득합니다."
 demand_faction_switch_force_desc:0 "위세로 압박하여 다른 파벌로 옮기게 합니다."
 demand_faction_switch_hook_desc:0 "손에 쥔 약점으로 협박하여 다른 파벌로 옮기게 합니다."
 fp3_name_read_in_friday_prayer_decision:0 "금요 예배에서 이름 낭독"
 fp3_name_read_in_friday_prayer_decision_desc:0 "금요 예배에서 누구의 이름을 낭독하느냐가 나의 입장을 가장 분명히 드러낸다. 나는 모든 이 앞에서 누구를 정통으로 받드는지 분명히 밝혀야 한다."
 fp3_promote_persian_scripture_decision:0 "페르시아 경전 보급"
 fund_inspiration.0051.burma:0 "버마로 가자!"
 hd_debug_prepare_youzhou_tuqi_decision_confirm:0 "즉시 편제하라!"
 hd_debug_train_xianzhenying_decision_confirm:0 "즉시 훈련하라!"
 hd_leave_defensive_league_decision_confirm:0 "여기서 작별하오!"
 hd_unify_defensive_league_decision_confirm:0 "하나로 합치자!"
 liberty_war_victory_defender_desc_admin:0 "당신의 [defender.Custom('GetGovernmentAuthority')](이)가 한 단계 낮아지며, 당신은 [liberty_faction|E]의 모든 구성원에게 [favor|E](을)를 하나씩 빚지게 됩니다."
 liberty_war_victory_defender_desc_tribal:0 "부족 내 당신의 [defender.Custom('GetGovernmentAuthority')](이)가 한 단계 낮아지고 부족민의 마음이 떠나며, 당신은 [liberty_faction|E]의 모든 구성원에게 [favor|E](을)를 하나씩 빚지게 됩니다."
 liberty_war_victory_desc_admin:0 "[defender.GetPrimaryTitle.GetName]의 [defender.Custom('GetGovernmentAuthority')](이)가 한 단계 낮아지며, [defender.GetShortUIName](은)는 [liberty_faction|E]의 모든 구성원에게 [favor|E](을)를 하나씩 빚지게 됩니다."
 liberty_war_victory_desc_tribal:0 "[defender.GetPrimaryTitle.GetName] 부족 내의 [defender.Custom('GetGovernmentAuthority')](이)가 한 단계 낮아지며, [defender.GetShortUIName](은)는 [liberty_faction|E]의 모든 구성원에게 [favor|E](을)를 하나씩 빚지게 됩니다."
 petition_ceremonial_liege_decision_tooltip:0 "당신의 [ceremonial_liege|E]에게 청원합니다"
 religious_interaction.1021:0 "교단의 장로들이 논의 끝에 당신을 [actor.GetFaith.GetAdjective] 신앙에서 파문하기로 결정했습니다. 이제 당신은 교단의 제례에 다시는 들 수 없습니다. [actor.GetFaith.HighGodName]께서 당신의 영혼을 불쌍히 여기시기를."
 struggle_persia_ending_assertion_decision:0 "칼리파국 재건"
 struggle_persia_ending_assertion_decision_tooltip:0 "정통 칼리파를 수호하고, 움마의 적들을 먼지 속에 짓밟아야 합니다."
 struggle_persia_ending_foundation_decision:0 "아바스의 치욕"
 struggle_persia_ending_foundation_decision_tooltip:0 "옛 칼리파국은 시간도 인내도 다 써 버렸습니다. 움마는 안정과 새로운 지도자를 부르고 있습니다."
 struggle_persia_ending_rekindle_iran_decision:0 "페르시아 부흥"
 struggle_persia_ending_rekindle_iran_decision_tooltip:0 "페르시아 민족들은 오랫동안 이방인에게 예속되어 왔습니다. 그들이 페르시아의 힘을 다시 기억하게 해야 합니다."
 submit_to_the_great_khan_decision_desc:0 "내 국토는 잿더미가 되고, 백성은 마른 뼈가 되며, 내 몸은 천 갈래로 찢길 것이다…… 천하를 정복한 대칸에게 목숨을 구걸하지 않는 한, 다른 방법은 없다."
 trait_SanGong_GongWei_1:0 "황후"
 trait_SanGong_Sizi:0 "사자"
 trait_SanGong_TaiHuangTaihou:0 "#bold 태황태후#!"
 trait_SanGong_Taihou:0 "#bold 황태후#!"
 trait_character_interloper_of_zhou_dynasty:0 "훼방꾼"
 trait_character_interloper_of_zhou_dynasty_desc:0 "당신은 주 왕실의 편도 아니고 어느 쪽에도 서지 않으며, 오로지 판을 어지럽혀 그 틈에서 이익을 챙기는 데 능합니다."
 trait_character_involve_neutral_of_zhou_dynasty:0 "중립파"
 trait_character_involve_neutral_of_zhou_dynasty_desc:0 "당신은 어느 쪽에도 치우치지 않고 주 왕실의 다툼에서 홀로 몸을 지키니, 누가 이기고 지든 당신과는 별 상관이 없습니다."
 trait_character_involve_opponents_of_zhou_dynasty:0 "패도파"
 trait_character_involve_opponents_of_zhou_dynasty_desc:0 "당신은 일찍부터 주 왕실에 불복하는 마음을 품어, 천자를 허명으로 여기고 맞서기로 맹세했습니다."
 trait_character_involve_supporters_of_zhou_dynasty:0 "왕도파"
 trait_character_involve_supporters_of_zhou_dynasty_desc:0 "당신은 주 왕실의 정통을 마음에 두고 기꺼이 천자의 옹호자가 되어, 존왕양이를 감히 어기지 않습니다."
 trait_scholar:0 "학자"
 trait_scholar_desc:0 "당신은 경서와 사서에 두루 통달하고 학문의 길에 부지런히 힘쓰며, 늘 책을 벗 삼습니다."
 trait_tk_fictional_character01:0 "허구 인물(1)"
 trait_tk_fictional_character01_desc:0 "이 인물은 연의 소설에서 나왔으며, 그 사람과 행적은 대부분 후대 사람들이 부연한 것입니다."
 trait_tk_fictional_character02:0 "허구 인물(2)"
 trait_tk_fictional_character02_desc:0 "이 인물은 희곡과 화본에서 나왔으며, 그 형상은 이야기꾼과 청중이 함께 그려 낸 것입니다."
 trait_tk_historical_character01:0 "역사 인물(1)"
 trait_tk_historical_character01_desc:0 "이 인물의 원형은 사서에 보이며, 그 생애는 근거를 들어 고증할 수 있습니다."
 trait_tk_historical_character02:0 "역사 인물(2)"
 trait_tk_historical_character02_desc:0 "이 인물의 원형은 사서에 보이며, 그 행적이 세상에 전해집니다."
 trait_tk_historical_character03:0 "역사 인물(3)"
 trait_tk_historical_character03_desc:0 "이 인물의 원형은 사서에 보이며, 그 이름이 후세에 남아 있습니다."
 tribute_mission_decision_dar_al_islam_desc:0 "[GetTitleByKey('h_dar_al_islam').GetDefinitiveName]의 [GetTitleByKey('h_dar_al_islam').GetHolder.GetTitleAsName](이)가 우리의 지평선에 무거운 그림자를 드리우며, 마땅한 공손함을 보이라고 말없이 요구하고 있습니다. 조공은 우리의 정통성을 드러낼 뿐 아니라 다른 이점도 가져다줄지 모릅니다……"
