 sworn_brotherhood_ferocity_path_tt:0 "용맹으로 의형제를 맺으면 우리는 전투력과 흔들리지 않는 의지를 얻을 것입니다. 이 길은 장비의 무용을 본받습니다."
 sworn_brotherhood_ferocity_strengthened_tt:0 "우리의 뜨거운 의리는 세월의 단련 속에서 그 귀함이 드러났습니다."
 sworn_brotherhood_humble_refusal_tt:0 "우리는 겸손히 사양합니다. 이 의리에는 더 이상의 예식도, 상도 필요하지 않습니다."
 sworn_brotherhood_loyalty_path_tt:0 "충의로 결의하면 우리는 군중에서의 위엄을 얻고 맹세를 더욱 굳게 할 것입니다. 이 길은 관우의 충의를 본받습니다."
 sworn_brotherhood_loyalty_strengthened_tt:0 "우리의 충의의 맹약은 시험을 거쳐 이전보다 더욱 굳건해졌습니다."
 sworn_brotherhood_righteous_path_tt:0 "인의로 결의하면 우리는 더 많은 위신을 얻고 더욱 바르게 될 기회를 얻을 것입니다. 이 길은 유비의 유풍을 잇습니다."
 sworn_brotherhood_simple_path_tt:0 "소박하고 진실한 결의의 약속을 맺으면 약간의 의례적 영예를 얻을 수 있습니다."
 sworn_brotherhood_tested_tt:0 "우리의 결의의 맹약은 세월의 시험을 견뎌 내어 더욱 굳건해졌습니다."
 uuii_claim_mandate_blocked_by_legitimate_hegemon_tt:0 "정통 천자가 여전히 제위에 있는 한, 천명을 주장하거나 빼앗을 수 없습니다."
 uuii_dynastic_cycle.0001.a:0 "천하의 대세가 이로써 바뀐다."
 uuii_dynastic_cycle.0001.desc.high_authority_1:0 "천자의 정통한 위엄이 극에 달하여 패업이 이어집니다. 그러나 단일 단계의 황권으로는 제후들을 다스리기에 부족하여 모든 직속 봉신이 독립을 선언합니다. 그중 이전에 패자를 따르던 이들은 천조의 조공국이 됩니다. 이때에는 누구도 천명을 주장하거나 빼앗을 수 없습니다."
 uuii_dynastic_cycle.0001.desc.high_authority_2:0 "천자의 정통성이 극에 달하여 패업이 이어집니다. 2단계 주권은 경기의 법정 관할 구역 안의 봉신들이 계속 신하로 남도록 보장하며, 나머지 직속 봉신은 각자 독립합니다. 그중 천자를 받들어 그 권위를 지키려 애쓴 이들은 천조의 조공국이 됩니다. 이때에는 누구도 천명을 주장하거나 빼앗을 수 없습니다."
 uuii_dynastic_cycle.0001.desc.high_authority_3:0 "천자의 정통성이 극에 달하여 패업이 이어집니다. 3단계 주권은 경기의 법정 왕국 안의 봉신들이 계속 신하로 남도록 보장하며, 나머지 직속 봉신은 각자 독립합니다. 그중 천자를 받들어 그 권위를 지키려 애쓴 이들은 천조의 조공국이 됩니다. 이때에는 누구도 천명을 주장하거나 빼앗을 수 없습니다."
 uuii_dynastic_cycle.0001.desc.high_authority_4:0 "천자의 정통성이 극에 달하여 패업이 이어집니다. 4단계 황권은 경기의 법정 제국 안의 봉신들이 계속 신하로 남도록 보장하며, 나머지 직속 봉신은 각자 독립합니다. 그중 천자를 받들어 그 권위를 지키려 애쓴 이들은 천조의 조공국이 됩니다. 이때에는 누구도 천명을 주장하거나 빼앗을 수 없습니다."
 uuii_dynastic_cycle.0001.desc.low_authority_1:0 "천자의 정통성이 부족하여 패자의 칭호는 왕조의 쇠퇴와 함께 사라집니다. 그러나 천자는 퇴위를 강요받지 않고 직할 및 일반 작위를 계속 보유합니다. 1단계 주권 아래에서 모든 직속 봉신이 독립을 선언하며, 천명은 다시 한번 천하의 경쟁에 열립니다."
 uuii_dynastic_cycle.0001.desc.low_authority_2:0 "천자의 정통성이 부족하여 패자의 칭호는 왕조의 쇠퇴와 함께 사라집니다. 그러나 천자는 퇴위를 강요받지 않고 직할 및 일반 작위를 계속 보유합니다. 2단계 주권은 경기의 법정 공작령 안의 봉신들이 계속 복종하도록 보장하며, 나머지 직속 봉신은 각자 독립하고, 천하는 다시 천명을 다투는 장으로 열립니다."
 uuii_dynastic_cycle.0001.desc.low_authority_3:0 "천자의 정통성이 부족하여 패자의 칭호는 왕조의 쇠퇴와 함께 사라집니다. 그러나 천자는 퇴위를 강요받지 않고 직할 및 일반 작위를 계속 보유합니다. 3단계 주권은 경기의 법정 왕국 안의 봉신들이 계속 복종하도록 보장하며, 나머지 직속 봉신은 각자 독립하고, 천하는 다시 천명을 다투는 장으로 열립니다."
 uuii_dynastic_cycle.0001.desc.low_authority_4:0 "천자의 정통성이 부족하여 패자의 칭호는 왕조의 쇠퇴와 함께 사라집니다. 그러나 천자는 퇴위를 강요받지 않고 직할 및 일반 작위를 계속 보유합니다. 4단계 주권은 경기의 법정 제국 안의 봉신들이 계속 복종하도록 보장하며, 나머지 직속 봉신은 각자 독립하고, 천하는 다시 천명을 다투는 장으로 열립니다."
 uuii_dynastic_cycle.0001.t:0 "군웅할거, 천하가 다시 나뉘다"
 uuii_silk_road_situation:0 "비단길 네 구간(구버전 호환 키)"
 uuii_silk_road_situation_desc:0 "구버전 현지화 호환용입니다. 현재 유효한 상황은 원작의 silk_road_situation 고정 키를 그대로 사용하며, 동부 구간, 북중부 길, 남중부 길, 서부 구간으로 나뉩니다."
