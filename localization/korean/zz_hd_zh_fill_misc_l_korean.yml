l_korean:
 HD_LIU_BEI_184_STORY_STATUS:0 "현재 장: #V 탁군 기병#!\n이 이야기는 중평 원년의 도원결의와 황건 봉기의 시작만을 다룹니다. 천하 황건의 형세가 정해지는 순간 이야기는 끝을 맺습니다."
 HD_LIU_BEI_LIFE_STORY_STATUS:0 "현재 장: #V [Story.MakeScope.Var('hd_liu_bei_life_phase').GetFlagName]#!\n탁군에서 의기를 든 날부터 서촉에 기업을 세우기까지, 유비의 선택과 맹세와 정벌은 모두 한 사람의 역사로 이어집니다."
 MUSIC_PLAYER_PLAY_TRACK_TT:0 "클릭하여 [MusicTrack.GetName] 재생"
 hd_dc_debug.0001.desc:0 "살펴볼 항목을 선택하십시오. 상태를 확인해도 이벤트는 진행되지 않으며, 포인트를 조정하면 관련 지역이 즉시 갱신됩니다.\n\n지불, 응답 및 대기 기간은 여전히 정규 절차대로 처리됩니다."
 hd_dc_debug.0001.t:0 "왕조 순환 디버그"
 hd_dc_debug.0002.ready:0 "난세 W: [hd_dc_debug_region.Var('hd_dc_pressure_percent').GetValue|1] / 100\n성세 H: [hd_dc_debug_region.Var('hd_dc_prosperity_percent').GetValue|1] / 100\n난세 등급: [hd_dc_debug_region.Var('hd_dc_pressure_band').GetValue|0]\n현재 당신에게 적용되는 이벤트 F: [SCOPE.GetValue('hd_dc_debug_f')|2], 파벌 P: [SCOPE.GetValue('hd_dc_debug_p')|2], 모략 합산 배율: [SCOPE.GetValue('hd_dc_debug_scheme_f')|2]. 적용 지역 밖에서는 1입니다. 역병 D는 백작령별로 정해지며, 다섯 단계로 1/1.05/1.10/1.15/1.20입니다.\n\n지난번 W 요청/실제 증분: [hd_dc_debug_region.Var('hd_dc_last_w_requested').GetValue|0] / [hd_dc_debug_region.Var('hd_dc_last_w_actual').GetValue|0]\n지난번 H 요청/실제 증분: [hd_dc_debug_region.Var('hd_dc_last_h_requested').GetValue|0] / [hd_dc_debug_region.Var('hd_dc_last_h_actual').GetValue|0]\n. 이상의 증분은 모두 내부 포인트이며, 20포인트가 화면상의 1포인트에 해당합니다."
 hd_dc_debug.0002.t:0 "현재 왕조 순환 상황"
 hd_dc_debug.0002.waiting:0 "왕조 순환이 이미 시작되었으나 W/H가 아직 초기화되지 않았습니다. 매월 정기 정식 관찰을 기다리거나, 지금 바로 정식 관찰을 진행하여 갱신할 수 있습니다."
 hd_dc_debug.0020.desc:0 "연간 추첨을 기다리지 않고 정식 이벤트를 수동으로 발생시킵니다. 인물 자격, 대기 중인 일, 이행 조건은 여전히 유효합니다. 선택할 수 없는 항목도 메뉴에 남아 있으니 어떤 조건이 부족한지 직접 확인할 수 있습니다."
 hd_dc_debug.0030.desc:0 "아래 조작은 현재 세계를 실제로 바꿉니다. 해당 상황을 클릭할 때에만 실행되며, 메뉴를 닫아도 새로 생성된 인물, 관계, 금화는 자동으로 되돌아가지 않습니다. 상황 준비를 마친 뒤에도 이벤트 메뉴에서 정식으로 절차를 시작해야 합니다."
 hd_dc_debug.back:0 "디버그 메뉴로 돌아가기"
 hd_dc_debug.close:0 "닫기"
 hd_dc_debug.events:0 "유효한 이벤트를 발견했습니다."
 hd_dc_debug.h:0 "성세 H 조정"
 hd_dc_debug.minus_1:0 "1포인트 감소"
 hd_dc_debug.minus_10:0 "10포인트 감소"
 hd_dc_debug.ord09:0 "ORD-09: 친족 몸값 지불"
 hd_dc_debug.ord09.tt:0 "조건을 충족하는 친족이 실제로 투옥되어 있어야 하며, 법적 억류자와 현재 행동 권한이 모두 갖추어져야 합니다. 응답 대기 중인 일반 이벤트가 있으면 따로 시작할 수 없습니다."
 hd_dc_debug.ord13:0 "ORD-13: 공문과 흉보"
 hd_dc_debug.ord13.tt:0 "해당 지역에 성인 군주가 있고, 난세 압력이 최소 2단계이며, 장악력이 50 미만인 자격 있는 직속 봉신의 백작령이 있어야 합니다. 응답 대기 중인 일반 이벤트가 있으면 열 수 없습니다."
 hd_dc_debug.ord19:0 "ORD-19: 원수의 아들"
 hd_dc_debug.ord19.tt:0 "옛 적의 성인 자식이 실제로 조정에 있어야 하며, 투옥에 쓸 수 있는 사적 죄목이 없고, 당신의 개인적 원수도 아니어야 합니다. 제한적 협력의 경우에는 양측이 모두 신뢰하는 보증인이 한 명 더 필요합니다. 응답 대기 중인 일반 이벤트가 있으면 시작할 수 없습니다."
 hd_dc_debug.plus_1:0 "1포인트 증가"
 hd_dc_debug.plus_10:0 "10포인트 증가"
 hd_dc_debug.points.desc:0 "조정값은 화면 포인트 기준이며, 범위는 0에서 100입니다. 난세는 20, 40, 60, 80에서 한 단계씩 올라갑니다.\n\n포인트 변동은 일괄 기록되며 갱신에 영향을 줍니다. 난세를 낮춰도 이미 잃은 장악력이나 개발도는 환급되지 않으며, 시국을 직접 바꾸지도 않습니다."
 hd_dc_debug.prepare:0 "테스트 상황 준비"
 hd_dc_debug.prepare_ord19:0 "ORD-19용 3인 상황 준비"
 hd_dc_debug.prepare_ord19.tt:0 "45세 아버지, 20세 소년, 40세 보증인을 생성하여 당신의 조정에 들입니다. 이 시점에 아버지와는 경쟁자가 되며, 소년은 독립적인 개인 관계와 죄책을 유지합니다. 당신, 소년, 보증인 사이에 필요한 네 가지 관계에 각각 5년간 의견 +100을 부여하고, 당신에게 금화 300을 줍니다. 각 플레이어 인물마다 한 번만 준비하며, 누구를 대신해서도 제안을 자동으로 수락하지 않습니다."
 hd_dc_debug.refresh:0 "정식 관찰을 진행하고 갱신합니다."
 hd_dc_debug.refresh.tt:0 "정식 관찰 절차에 따라 지역 형세, 위기 영향, 이벤트 풀 및 미결 사항을 갱신합니다. 이 조작은 국면을 바꾸지만, 지나간 세월을 부풀리지는 않습니다."
 hd_dc_debug.set_0:0 "0으로 설정"
 hd_dc_debug.set_100:0 "100으로 설정"
 hd_dc_debug.set_20:0 "20으로 설정"
 hd_dc_debug.set_40:0 "40으로 설정"
 hd_dc_debug.set_60:0 "60으로 설정"
 hd_dc_debug.set_80:0 "80으로 설정"
 hd_dc_debug.status:0 "현재 상황 보기"
 hd_dc_debug.w:0 "난세 W 조정"
 hd_dc_debug_decision:0 "왕조 순환 디버그"
 hd_dc_debug_decision_confirm:0 "디버그 메뉴 열기"
 hd_dc_debug_decision_desc:0 "왕조 순환의 현재 상태를 확인하고, 난세와 성세를 조정하며, 이벤트 진행을 살펴봅니다. 이 항목은 디버그 모드에서만 나타납니다."
 hd_dc_debug_decision_tooltip:0 "왕조 순환 디버그 메뉴 열기"
 hd_dc_debug_rival_reason:0 "[TARGET_CHARACTER.GetShortUIName](와)과 [CHARACTER.GetShortUIName](이)가 디버그 상황 준비로 인해 경쟁자가 되었습니다"
 hd_dc_debug_trust_opinion:0 "디버그 상황: 상호 신뢰"
 hd_dc_extra_faction_created:0 "새로 설립된 파벌을 불러왔습니다."
 hd_dc_extra_faction_creation_failed:0 "유형은 선택되었으나 설립 전 자격 재검토를 통과하지 못했거나 설립 결과를 읽지 못했습니다. 올해는 다시 추첨하지 않습니다."
 hd_dc_extra_faction_low_w:0 "W가 20 미만이라 기회가 늘지 않았습니다."
 hd_dc_extra_faction_missed:0 "확률 추첨 실패"
 hd_dc_extra_faction_no_type:0 "일어날 기회는 있었으나 설립 가능한 유효 유형이 없습니다."
 hd_dc_faction_pulse_debug.actor:0 "\n실제 발기인: [hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_actor').Char.GetShortUIName]"
 hd_dc_faction_pulse_debug.check:0 "이 정권에 대해 올해의 정식 관찰을 진행합니다."
 hd_dc_faction_pulse_debug.check.tt:0 "이 주요 작위의 올해 관찰 기회 1회를 소모합니다. 실패하면 다시 추첨할 수 없습니다. 성공하면 정식 파벌이 설립되며, 이후 원래 절차에 따라 적대를 일으킬 수 있습니다. 이 페이지를 보기만 해서는 파벌이 설립되지 않습니다."
 hd_dc_faction_pulse_debug.claimant:0 "\n실제 왕위 요구자: [hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_claimant').Char.GetShortUIName]\n쟁탈 대상 작위: [hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_claimed_title').Title.GetName]"
 hd_dc_faction_pulse_debug.county:0 "\n실제 봉기 백작령: [hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_county').Title.GetName]"
 hd_dc_faction_pulse_debug.desc:0 "원작의 자동 설립은 유지됩니다. W가 20에 이르면 각 정권은 매년 10%의 기본 기회를 추가로 얻으며, P에 따라 1−(1−p₀)^P로 환산합니다. 성공하면 그 시점에 법적으로 가능한 유형 중에서 파벌 하나를 골라 최대 하나만 설립합니다. 발기인은 AI여야 하며, 백작령 단위 봉기는 정확한 백작령 단위 자격을 사용합니다. 같은 유형의 기존 파벌은 계산에서 제외하여 중복 가속을 막습니다.\n\n옹립형 파벌에는 정확한 왕위 요구자와 작위가 있어야 합니다. 현재 일본 파벌을 비활성화하는 조건은 여전히 유효하며, 농민 파벌의 격상은 원작의 기존 반란 격상 절차를 유지합니다. 이 기회는 원작의 최종 설립 확률을 대체하지 않으며, 반란이나 선전포고를 직접 일으키지도 않습니다."
 hd_dc_faction_pulse_debug.low_w:0 "\n현재 W가 20 미만이면 올해 관찰에서 파벌 기회가 늘지 않습니다."
 hd_dc_faction_pulse_debug.no_record:0 "\n이 주요 작위에는 아직 연간 관찰 기록이 없습니다."
 hd_dc_faction_pulse_debug.no_title:0 "\n실행 불가: 현재 인물에게 주요 작위가 없습니다."
 hd_dc_faction_pulse_debug.outside:0 "\n실행 불가: 현재 인물이 왕조 순환 관련 지역 안에 있지 않습니다."
 hd_dc_faction_pulse_debug.record:0 "\n 정권: [hd_dc_debug_pulse_realm.GetName]\n 지난 관찰 연도: [hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_year').GetValue|0]\n 실제 추첨 확률: [hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_chance').GetValue|2]% \n 결과: [SCOPE.GetFlagName('hd_dc_debug_pulse_result')]"
 hd_dc_faction_pulse_debug.title:0 "추가 파벌 연간 관찰"
 hd_dc_faction_pulse_debug.type:0 "\n파벌 유형 식별자: [hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_type').GetFlagKey]"
 hd_dc_faction_pulse_debug.used:0 "\n 올해 관찰은 이미 사용했습니다. 군주를 바꾸거나, 이 페이지를 다시 열거나, W를 조정해도 같은 주요 작위의 올해 기회는 회복되지 않습니다."
 hd_dc_ord.0009.b.tt:0 "난세 +1. 투옥된 자의 생존한 가까운 친족 때문에 당신의 영향력이 15 감소합니다. 실제로 강경책을 주장하는 측근이 있다면 그의 지지로 당신의 영향력이 5년간 10 증가합니다. 포로는 여전히 원래 포획자가 감시하며, 이 선택지로 포로가 죽지는 않습니다."
 hd_dc_ord.0013.a.tt:0 "사재에서 30금화를 지출하여 문서 담당 서리와 행정 사무에 쓰고, 현재의 자문위원이 원작 내정 메커니즘에 따라 실제로 직무를 맡게 합니다. 임무가 확정되면 스트레스 −15, 동맹의 당신에 대한 의견 +15, 청원을 미룬 봉신의 당신에 대한 의견 −10이 5년간 지속되며, 위기 시에도 변하지 않습니다. 오만한 자는 기본 스트레스 +20을 추가로 받으며, 스트레스 증가 보정의 영향을 받습니다. 이 조작은 해당 자문위원의 현재 자문회 임무를 바꿉니다. 임무에 실패하면 지출한 금화는 돌려받지만 스트레스는 줄지 않습니다."
 hd_dc_ord.0019.a.tt:0 "난세 −1. 손님의 당신에 대한 의견 +20. 당신 아버지 대의 원수에게 복수하려는 측근이 있고 그 사람이 실제로 원수라면, 그 측근의 당신에 대한 의견이 5년간 −15가 됩니다. 당신과 아버지 대 원수 사이의 실제 원한은 유지됩니다. 손님에게 면책, 작위 또는 정치 권력을 주지 마십시오."
 hd_dc_ord.0019.b.tt:0 "난세 +2. 당신이 냉대하여 손님의 위신 −30. 그 아버지와 옛 원한이 있는 측근이 대신 보복하면 그 측근의 당신에 대한 의견이 5년간 +15가 됩니다. 구금할 법적 근거가 없으므로 당신은 손님을 투옥, 처형하거나 작위를 박탈하지 않으며, 손님도 자동으로 경쟁자가 되지 않습니다."
 hd_dc_ord.0113.a.tt:0 "상대의 사신을 직접 읽어 그가 근심하는 바를 정리하고 좋은 말로 답합니다. 상대 스트레스 −20, 지역 위기 −1, 상대에 대한 당신의 의견 +20이 5년간 지속됩니다. 이로써 어떠한 통치권도 넘기지 않았습니다."
 hd_dc_par.0001.c.tt:0 "현재 정책의 확정된 결단을 기록합니다. 논쟁 +10. 두 파벌 수장은 당신의 질책으로 각각 −10의 벌을 받습니다. 국고 보전책에 서명해 지지한 자는 당신이 그 정책을 유지했으므로 당신에 대한 의견이 추가로 +10이 됩니다. 이 절이 끝날 때 세율과 통치 포인트는 늘지 않습니다."
 hd_dc_par.1001.c.tt:0 "이번 정책 논쟁에 참여하지 않습니다. 이 안건은 붕당 분쟁 위기를 일으키지 않고, 50년의 재사용 대기시간도 부과하지 않으며, 거절을 어느 한쪽에 대한 지지로 간주하지도 않습니다."
 hd_dc_par.1101.a.tt:0 "이 안건은 종결되었으며 100금화는 지불이 끝났습니다. 감세안이 즉시 발효되어 세수 −10%, 개발 속도 +25%, 민심 +20이 12개월간 지속됩니다. 통치 포인트는 기간 만료 시 확정되며, 이 지불 증빙에는 별도 비용이 없고 포인트도 조정하지 않습니다."
 hd_dc_par.1202.a.tt:0 "이 안은 시행되지 않았으며 통치 포인트에도 계산되지 않습니다. 이번 응답으로는 더 이상 지불, 보상, 환불이 발생하지 않으며, 이미 지불한 금액과 미정산 차액은 모두 영향을 받지 않습니다."
 hd_dc_roy.0001.a.tt:0 "위기 중에 정한 옛 제도를 회복하고, 가까운 자리에 앉는 이들에 대한 우대를 중단합니다. 갈등 −5, 통치 +10. 옛 제도를 지지하는 파벌의 당신에 대한 의견 +10, 가까운 자리를 청한 이들의 당신에 대한 의견 −10. 이 효과는 5년간 지속됩니다."
 hd_dc_roy.0001.c.tt:0 "현재 명부를 대조하여 양측의 다툼을 기각합니다. 갈등 +10, 약간의 위신을 얻습니다. 소송 양측의 당신에 대한 의견 각각 −15, 강력한 비종실 봉신의 당신에 대한 의견 +10, 종실 협력 의견 −5가 5년간 지속됩니다."
 hd_dc_support.0008.a.tt:0 "자격을 재검토한 뒤, 서신에서 가리킨 실제 왕위 요구자의 파벌에 반드시 가입합니다. 약속한 사재는 성공한 뒤에만 지불됩니다. 각 사람은 위기마다 동원 보상을 최대 한 번만 받을 수 있습니다. 후보 신분으로 처음 파벌 가입에 성공하면 본인 동원 +15, 후보의 당신에 대한 의견 +25, 현 재위자의 당신에 대한 의견 −20, 나머지 후보의 당신에 대한 의견 −10이 5년간 지속됩니다. 별도의 거절 추첨 제한이 없으며, 10년간 탈퇴 금지 조항도 없습니다."
 hd_dc_support.0008.c.tt:0 "이번 모집을 분명히 거절합니다. 후보 동원치 −5, 현 재위자의 당신에 대한 의견 +100, 후보의 당신에 대한 의견 −20이 5년간 지속됩니다. 두 사람은 2년 안에 다시 초청받지 않으며, 벌을 받지도 않고, 파벌 소속도 늘지 않습니다."
 hd_dc_theft_pulse_debug.actor:0 "\n\n 관찰 대상자: [hd_dc_theft_debug_actor.GetName]."
 hd_dc_theft_pulse_debug.check:0 "이 사람에 대해 올해의 정식 관찰을 진행합니다."
 hd_dc_theft_pulse_debug.check_tt:0 "정식 연간 심사를 시작합니다. 이 사람의 올해 잠금, 실제 후보 조건, 원작의 5년 재사용 대기시간과 모략 상한은 유지됩니다. 올해 이미 심사한 사람은 다시 추첨할 수 없습니다. 비활성화된 관문은 해제되지 않습니다."
 hd_dc_theft_pulse_debug.gates:0 "#warning 현재 Dakuo는 원작의 네 가지 비활성화 관문에 여전히 막혀 있습니다. 모략 허용, 유효성, 그리고 상호작용의 is_shown, can_send입니다.#!\n이 페이지는 비활성화 관문을 해제하지 않으며, 과거의 슬롯 붕괴가 고쳐졌음을 증명하지도 않습니다. 읽기 전용으로 들어가면 연간 심사를 진행하지 않습니다."
 hd_dc_theft_pulse_debug.native_gate_failed:0 "\n 심사 결과: 생업 후보자는 있으나 원작 모략 개시 판정을 통과하지 못했습니다. 기존 비활성화 관문은 여전히 유효하며, 이 결과는 재사용 대기시간과 상한 판정도 건너뛰었습니다."
 hd_dc_theft_pulse_debug.native_start_failed:0 "\n심사 결과: 추첨 후 원작 호출이 새 모략을 반환하지 않았습니다."
 hd_dc_theft_pulse_debug.no_actor:0 "지역 안에\n\n올해 정식 약탈 기록 조건에 맞는 AI 인물이 없습니다."
 hd_dc_theft_pulse_debug.no_business_candidate:0 "\n심사 결과: 이 직무의 후보 자격에 맞는 사람이 없습니다. 확률 계산과 추첨을 하지 않았습니다."
 hd_dc_theft_pulse_debug.no_record:0 "\n아직 열람할 수 있는 연간 심사 기록이 없습니다."
 hd_dc_theft_pulse_debug.no_scheme:0 "\n 모략 기록: 현재 존재하는 모략 참조가 없습니다. 이를 근거로 과거에 성공한 적이 있다고 추정하지 마십시오."
 hd_dc_theft_pulse_debug.other:0 "다른 자격 있는 인물 열람만 하기"
 hd_dc_theft_pulse_debug.probability:0 "\n실제로 선정된 대상: [hd_dc_theft_debug_actor.MakeScope.Var('hd_dc_theft_pulse_target').Char.GetName].\n기본 확률: [hd_dc_theft_debug_actor.MakeScope.Var('hd_dc_theft_pulse_p0').GetValue|3]%, 조정된 실제 추첨 확률: [hd_dc_theft_debug_actor.MakeScope.Var('hd_dc_theft_pulse_probability').GetValue|3]%."
 hd_dc_theft_pulse_debug.probability_failed:0 "\n심사 결과: 유효한 대상이 있으나 확률 추첨에 실패했습니다."
 hd_dc_theft_pulse_debug.refresh:0 "현재 인물만 갱신"
 hd_dc_theft_pulse_debug.scheme_exists:0 "\n 모략 기록: 기록된 모략이 현재 존재합니다."
 hd_dc_theft_pulse_debug.started:0 "\n 최근 심사 결과: 원작 개시로 모략이 성공적으로 생성되었습니다. 모략이 아직 남아 있는지는 아래를 보십시오."
 hd_dc_theft_pulse_debug.title:0 "약탈 연간 심사"
 hd_dc_theft_pulse_debug.year:0 "\n지난 심사 연도: [hd_dc_theft_debug_actor.MakeScope.Var('hd_dc_theft_pulse_year').GetValue|0]."
 hd_fengying.0011.alt_desc:0 "천자를 맞이할 기회가 왔으나, 당신은 아직 독립된 영토를 가진 군주가 아니므로 조정을 자신의 치소로 옮길 수 없습니다. 돕거나, 멀리서 지켜보거나, 다른 이를 막는 것이 지금 당신이 실제로 할 수 있는 선택입니다."
 hd_fengying.0011.desc:0 "천자는 이미 강력한 후원자를 잃었고, 하북의 병마는 정예하며 군량도 넉넉합니다. 천자를 받들어 조정을 지탱하면 군웅을 압도할 수 있을 것입니다. 그러나 조정의 공경과 종실은 당신의 군정 아래에서 가장 다루기 어려운 무리가 될 것입니다. 조조 역시 이 기회를 기다리고 있습니다."
 hd_fengying.0011.t:0 "천자를 맞이할 수 있을지도"
 hd_fengying_yuan_aid:0 "수레와 말, 군수품을 내어 조금 돕는다."
 hd_fengying_yuan_hesitate:0 "이 일은 얽힌 것이 많으니, 잠시 지켜보자."
 hd_fengying_yuan_obstruct:0 "길을 끊어 조조가 일을 이루지 못하게 한다."
 hd_fengying_yuan_receive:0 "천자를 하북으로 호송한다."
 hd_huangjin.3.reward_4000:0 "청주병 4천을 얻습니다."
 hd_huangjin.3.reward_8000:0 "청주병 8천을 얻습니다."
 hd_huangjin.3.reward_full:0 "세 차례 심사를 모두 통과했습니다! 청주병 2만 2천을 얻습니다(심사마다 4천, 세 번 모두 통과 시 1만 추가). 직할 백작령들의 개발도가 20년간 30% 증가합니다."
 hd_lb22_appoint_guan_yu_jingzhou:0 "관우를 형주의 주군으로 임명한다."
 hd_lb22_keep_jingzhou_arrangement:0 "기존 배치를 유지한다."
 hd_lb24_align_cao:0 "조씨에게 사신을 보내 약간의 이익을 구한다."
 hd_lb24_attack_jingzhou:0 "형주가 빈 틈을 타 빼앗는다."
 hd_lb24_await_sun_decision:0 "강동의 선택이 우리 군의 퇴로를 정할 것이다."
 hd_lb24_keep_alliance:0 "맹약을 깨지 않고 화친을 지킨다."
 hd_lb24_wait:0 "잠시 북쪽의 형세를 지켜본다."
 hd_lb_bequest_decline_tt:0 "작위를 넘기지 않으며, 도겸도 살해되지 않습니다. 이 땅을 양도받을 기회는 이것으로 끝납니다."
 hd_lb_no_effect_tt:0 "맹약, 전쟁, 작위 또는 진영의 변화가 생기지 않습니다. 이번 초청은 다시 오지 않습니다."
 hd_lb_zhao_friend_tt:0 "유비와 조운이 친구가 됩니다. 조운은 잠시 공손찬 휘하에 남습니다."
 hd_lb_zhao_join_tt:0 "조운이 주군도 영지도 없는 몸으로 유비 휘하에 들어옵니다. 기존 봉토는 결코 몰수되지 않습니다."
 hd_liu_bei_late.2200.desc:0 "익주의 일이 정해졌으니, 당신은 형주를 홀로 한 방면을 감당할 수 있는 지극히 존귀한 주인에게 맡겨야 합니다. 관우는 이 소임에 필요한 위신과 경력과 충성을 두루 갖추었으나, 그에게 맡긴다면 형주와 익주 사이의 권력 구도가 바뀔 것입니다."
 hd_liu_bei_late.2200.t:0 "형주 진수"
 hd_liu_bei_late.2400.desc:0 "관우가 이미 형주에서 북상했습니다. 강동, 조씨, 그리고 남아 지키는 장수들 모두가 이 방어선이 얼마나 더 버틸 수 있을지 가늠하고 있습니다."
 hd_liu_bei_late.2400.t:0 "형주 북벌"
 hd_liu_bei_late.2410.alt_desc:0 "관우의 북벌은 강동의 결단에 이르렀으나, 기존의 군신 관계, 맹약 또는 형주의 귀속 때문에 지금은 곧바로 공격해 빼앗을 수 없습니다. 기다리거나, 맹약을 지키거나, 조씨와 연락하는 것으로 이 단계를 마무리할 수 있습니다."
 hd_liu_bei_late.2410.desc:0 "관우의 주력이 북진하자 형주 후방에 빈틈이 생겼습니다. 형주를 빼앗으면 상류에서 강동을 위협하는 세력을 없앨 수 있습니다. 그러나 그리하면 손유 동맹은 완전히 무너질 것입니다."
 hd_liu_bei_late.2410.t:0 "형주의 빈틈"
 hd_liu_bei_late.2491.desc:0 "전쟁 중에 형주의 주인이 바뀌었습니다. 관우의 운명은 여전히 전장과 포로, 그리고 사람의 생사에 달려 있습니다."
 hd_liu_bei_late.2491.t:0 "형주의 주인이 바뀌다"
 hd_liu_bei_late.2492.desc:0 "조조의 군대가 전쟁 중에 형주를 지켜내어 역사의 흐름을 바꾸었습니다."
 hd_liu_bei_late.2492.t:0 "형주 보전"
 hd_liu_bei_late.2500.alt_desc:0 "관우는 이미 죽었으나 복수의 논의는 여전히 남아 있습니다. 하지만 지금의 군신 관계, 영지, 맹약 또는 형주의 귀속 어느 것도 명분이 뚜렷한 이릉 전투를 일으키기에 부족합니다. 화해하거나, 형주 반환을 요구하거나, 복수를 미루는 것을 택할 수 있습니다."
 hd_liu_bei_late.2500.desc:0 "관우는 이미 죽었고 형주는 손씨의 손에 떨어졌습니다. 복수, 동맹, 그리고 각 세력의 존속이 서로를 견제합니다. 군을 일으킨다면 보급로, 산지, 연영, 무더위, 그리고 오군의 주장이 모두 전황에 실질적인 영향을 줄 것입니다."
 hd_liu_bei_late.2500.t:0 "오 토벌 논의"
 hd_liu_bei_late.2510.desc:0 "유비가 사신을 보내 형주 반환을 요구합니다. 내어준다면 큰 전쟁을 피할 수 있으나, 그로 인해 강동 상류의 방벽이 약해질 것입니다."
 hd_liu_bei_late.2510.t:0 "형주 반환 요구"
 hd_liu_bei_late.2590.desc:0 "유비의 군대가 전장에서 패배했습니다. 길고 긴 보급로, 험한 산지, 연영의 폐단이 끝내 대패를 불렀습니다."
 hd_liu_bei_late.2590.t:0 "이릉의 패배"
 hd_liu_bei_late.2591.desc:0 "유비의 군대가 전장에서 승리했습니다. 형주를 둘러싼 다툼은 정식 전쟁 목표에 따라 결정될 것입니다."
 hd_liu_bei_late.2591.t:0 "오 토벌 승리"
 hd_liu_bei_phase_jingzhou:0 "형주의 상실"
 hd_liu_bei_phase_yiling:0 "이릉의 다툼"
 hd_liu_bei_phase_yizhou:0 "서천에 기업을 세우다"
 hd_story_liu_bei_lb24:0 "형주의 상실"
 hd_story_liu_bei_lb25:0 "이릉"
 hd_yiling_attack_wu:0 "군을 일으켜 오를 치고 관우의 원수를 갚는다."
 hd_yiling_delay_revenge:0 "복수를 잠시 미루고 군을 정비하며 때를 기다린다."
 hd_yiling_demand_jingzhou:0 "먼저 사신을 보내 형주 반환을 요구한다."
 hd_yiling_keep_alliance:0 "멀리서 그 계책에 응하여 옛 맹약을 다시 닦는다."
 hd_yiling_reject_demand:0 "그 요청을 거절한다."
 hd_yiling_return_part_jingzhou:0 "분쟁 지역 일부를 돌려준다."
 hd_yiling_risk_camps_modifier:0 "백 리에 걸친 연영"
 hd_yiling_risk_camps_modifier_desc:0 "진영이 서로 이어져 있어 군중에서 신속히 서로 구원하기 어렵습니다."
 hd_yiling_risk_heat_modifier:0 "한여름 무더위"
 hd_yiling_risk_heat_modifier_desc:0 "혹독한 더위가 원정군의 전력을 갉아먹고 있습니다."
 hd_yiling_risk_lu_xun_modifier:0 "육손의 지휘"
 hd_yiling_risk_lu_xun_modifier_desc:0 "육손이 반격할 기회를 엿보고 있습니다."
 hd_yiling_risk_mountain_modifier:0 "산의 관문이 길을 가로막는다."
 hd_yiling_risk_mountain_modifier_desc:0 "산지가 험준하여 대군이 펼쳐지기 어렵습니다."
 hd_yiling_risk_supply_modifier:0 "이릉 보급로"
 hd_yiling_risk_supply_modifier_desc:0 "오를 공격하는 군대의 보급로가 좁고 취약합니다."
 quix_murder_ongoing.3010.a:0 "[agent_in_question.GetFirstNameNoTooltip]의 이런 열정이야말로 모두의 본보기가 되어야 하오!"
 quix_murder_ongoing.3010.a.failure:0 "[agent_in_question.GetSheHe|U] 스스로 정체를 드러냄"
 quix_murder_ongoing.3010.a.success:0 "[agent_in_question.GetHerHis|U] 이 집념은 참으로 값을 매길 수 없는 보배로다."
 quix_murder_ongoing.3010.b:0 "[agent_in_question.GetTitledFirstNameNoTooltip](을)를 가죽 끈으로 묶는다."
 quix_murder_ongoing.3010.c:0 "이 일에 대해 우리는 일절 책임지지 않소."
 quix_murder_ongoing.3010.desc:0 "[agent_in_question.GetTitledFirstName](이)가 내놓는 계책은 하나같이 고문에 힘을 쏟고, [scheme.GetTarget.GetTitledFirstName](을)를 죽이는 일은 오히려 부차적인 것이 되어 버렸습니다. [agent_in_question.GetHerHis] 재간은 분명 쓸모가 있지만, 이토록 잔인해서는 모략 전체가 드러날 수도 있습니다."
 quix_murder_ongoing.3010.desc_hero:0 "[agent_in_question.GetTitledFirstName](이)가 내놓는 계책은 하나같이 고문을 앞세우고, [scheme.GetTarget.GetTitledFirstName](을)를 죽이는 일은 오히려 부차적인 것이 되어 버렸습니다. 이 같은 잔인함은 이미 [agent_hero_of_the_moment.GetTitledFirstName]의 분노를 샀습니다. 그는 [scheme.GetTarget.GetTitleAsNamePossessiveNoTooltip][target.Custom2('RelationToMe', SCOPE.sC('agent_hero_of_the_moment'))]입니다. 제지하지 않으면 두 사람 모두 모략 전체를 망쳐 버릴지도 모릅니다."
 quix_murder_ongoing.3010.desc_opening:0 "[agent_in_question.GetTitledFirstName](은)는 이 살해 모략에 지나치게 많은 열정을 쏟는 듯합니다."
 quix_murder_ongoing.3010.t:0 "$murder_event_title$ 잔학한 자객"
 quix_murder_ongoing.3301.a:0 "무슨 일이 이토록 번거롭단 말인가!?"
 quix_murder_ongoing.3301.desc:0 "당신은 온갖 수고를 들여 몰래 공모자들을 모아 [target.GetTitledFirstName](을)를 제거할 방법을 의논했습니다. 그러나 밤새 논쟁하고도 끝내 결론을 내지 못했고, 모두가 오히려 전보다 더 망설이게 되었습니다."
 quix_murder_ongoing.3301.t:0 "$murder_event_title$ 의논만 하고 결정하지 못하다"
 quix_seduce_outcome.2030.desc:0 "당신과 [target.GetTitledFirstName](은)는 서로의 마음을 이미 알고 있으니, 더 떠보는 것은 부질없는 일입니다. 당신의 심복이 두 사람을 위해 한적한 곳을 마련해 주었습니다.\n\n당신이 막 마음을 고백하려는 순간, [target.GetFirstName](이)가 손가락을 당신의 입술에 대어 말을 막았습니다. 이후 두 사람의 만남은 뜨겁고 솔직했으며, 더 이상 어떤 약속도 필요하지 않았습니다."
 quix_seduce_outcome.2302.desc:0 "먼 길이 줄곧 [target.GetTitledFirstName]에 대한 당신의 구애를 가로막았기에, [target.GetSheHe](은)는 향을 올리러 간다는 핑계로 조용히 찾아와 눈에 띄지 않는 하인 방에 잠시 머물렀습니다.\n\n두 사람은 밤새 이야기를 나누었지만 누구도 마음을 직접 말하지 않았습니다. 그러나 각자 방으로 돌아간 뒤, [target.GetFirstName](이)가 다시 조용히 당신의 침상 앞으로 찾아왔습니다."
 quix_seduce_outcome.3030.desc:0 "당신과 [owner.GetTitledFirstName](은)는 서로의 마음을 이미 알고 있으니, 더 떠보는 것은 부질없는 일입니다. 믿을 만한 심복이 두 사람을 위해 한적한 곳을 마련해 주었습니다.\n\n[owner.GetSheHe|U](이)가 막 마음을 고백하려 할 때, 당신은 손짓으로 [owner.GetHerHis] 말을 막았습니다. 이후 두 사람의 만남은 뜨겁고 솔직했으며, 더 이상 어떤 약속도 필요하지 않았습니다."
 quix_seduce_outcome.3302.desc:0 "[owner.GetTitledFirstName](이)가 오래전부터 당신을 연모해 왔음을 알기에, 당신은 몰래 향을 올리러 간다는 핑계로 [owner.GetHerHis] 저택을 찾아가 눈에 띄지 않는 하인 방에 머물렀습니다.\n\n두 사람은 한밤중까지 이야기를 나누었지만 누구도 마음을 직접 말하지 않았습니다. 각자 방으로 돌아간 뒤, 당신은 마음을 바꾸어 조용히 [owner.GetFirstName]의 침상 앞으로 걸어갔습니다."
