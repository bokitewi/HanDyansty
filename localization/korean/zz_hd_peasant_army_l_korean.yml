l_korean:
 # 农民义军
 hd_peasant_army.0001.t: "찾아온 향민들"
 hd_peasant_army.0001.desc: "며칠째 영문 밖에는 노인을 부축하고 아이를 데리고 오는 이들이 끊이지 않았다. 괭이를 멘 이도 있고, 끝을 뾰족하게 깎은 대나무 장대 하나만 든 이도 있었다. 그들은 깃발을 보자 무릎을 꿇고, 집안의 밭은 일찍이 호족에게 빼앗겼고 현의 조세는 사람이 살 수 없을 만큼 가혹하다고 했다.\n\n그들은 [ROOT.Char.GetFirstName] 역시 가난한 출신으로 고향 사람들을 업신여기지 않는다고 들었다며, 그를 따라 살길을 걷고 싶다고 했다. 점검해 보니, 또 한 부대가 꾸려졌다."
 hd_peasant_army.0001.a: "모두 편입하여 한솥밥을 먹게 하라."
 hd_peasant_army.0001.a.tt: "#P 향민이 모여 한 부대가 되어 찾아왔습니다#!(병력 = 외교×관리×5, 별도로 민병 창병 1부대)"
 hd_peasant_army_troops_name: "의군 향용"
 hd_peasant_army_siege_toast: "찾아온 향민들"
