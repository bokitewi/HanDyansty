l_korean:
 quix_seduce_outcome.2000.t:0 "용의 비늘을 붙잡고"
 quix_seduce_outcome.2000.desc:0 "당신은 [target.GetTitledFirstNamePossessive] 내실에서 기다렸다. 곁에는 술 한 상과 과일 몇 접시뿐이었다.\n\n[target.GetSheHe|U](은)는 방에 들어와 당신을 보고도 놀라지 않고, 오히려 미소를 띠며 다가왔다. 몇 마디 떠보는 말이 오간 뒤, 두 사람은 더 이상 서로의 마음을 감추지 않았다."
 quix_seduce_outcome.2000.a:0 "부귀와 다정함이라니, 언제까지나 곁에 있고 싶소."
 quix_seduce_outcome.2000.b:0 "하룻밤의 즐거움이니, 마음에 둘 것 없소."
 hd_quix_seduce_outcome.2010.t:0 "고통 속의 쾌락"
 quix_seduce_outcome.2010.desc:0 "[target.GetTitledFirstName](은)는 당신을 감방으로 불러 은밀히 만났다. 당신이 도착했을 때 안에는 이미 촛불이 밝혀져 있었고, 형구 옆에는 꽃잎까지 뿌려져 있었다. 분명 [target.GetSheHe](이)가 미리 준비해 둔 것이었다.\n\n“오늘 밤은 내 말을 따르시오.” [target.GetSheHe](이)가 말했다. 이어진 일들은 [target.GetHerHis] 취향이 평범한 쾌락을 훨씬 넘어선다는 것을 증명했다."
 quix_seduce_outcome.2010.a:0 "다음번엔 내가 채찍을 쥘 차례요."
 quix_seduce_outcome.2020.t:0 "건초 다락에서"
 quix_seduce_outcome.2020.desc:0 "당신과 [target.GetName](은)는 좀처럼 단둘이 있을 기회를 얻지 못해, 인편에 짧은 쪽지를 보내 [target.GetHerHim](을)를 마구간 위 건초 다락으로 불러냈다.\n\n가축들의 소리가 두 사람의 속삭임을 덮어 주었다. [target.GetSheHe|U](이)가 당신 쪽으로 다가올 때, 당신은 이 밀회가 어떻게 끝날지 이미 알고 있었다."
 quix_seduce_outcome.2020.a:0 "다음엔 그럴듯한 곳을 찾아야겠소."
 quix_seduce_outcome.2020.b:0 "우선 몸부터 씻고, 이만 헤어지세."
 quix_seduce_outcome.2021.t:0 "사당 안의 속삭임"
 quix_seduce_outcome.2021.desc:0 "[target.GetName](은)는 재계하고 복을 빈다는 명목으로 당신을 한 사당에 불렀다. 당신이 저녁 무렵 도착했을 때, 전각 안에는 소복 차림의 [target.GetHerHim] 말고는 아무도 없었다.\n\n[target.GetSheHe|U](은)는 본래 당신과 사랑과 경건함의 도리를 논하려 했으나, 몇 마디 나누기도 전에 두 사람 모두 미리 준비한 말을 잊고 말았다. 그날의 기도는 결국 전혀 다른 것이 되었다."
 quix_seduce_outcome.2021.a:0 "신명께서 굽어보시니, 이 마음 변치 않으리."
 quix_seduce_outcome.2021.b:0 "신명께서 한 번 눈감아 주신 셈 치지."
 quix_seduce_outcome.2022.t:0 "별장의 오후"
 quix_seduce_outcome.2022.desc:0 "옛 지인이 성 밖 별장에 잠시 머물다 가라고 당신을 초대했다. 도착해서야 당신은 그곳에서 진짜로 당신을 기다리던 이가 [target.GetTitledFirstName]임을 알게 되었다.\n\n두 사람은 함께 정원을 거닐고 식사를 하며 점점 은밀한 이야기를 나누었다. 오후가 되자 [target.GetSheHe](은)는 위층으로 올라가 더 이야기하자고 당신을 이끌었다. 명목상의 주인은 며칠이 지나도록 모습을 드러내지 않았다."
 quix_seduce_outcome.2022.a:0 "마음이 통했으니, 마땅히 오래가야지."
 quix_seduce_outcome.2022.b:0 "오늘의 즐거움은 추억으로 남겨 두겠소."
 quix_seduce_outcome.2023.t:0 "옛 무덤의 그윽한 정"
 quix_seduce_outcome.2023.desc:0 "하인과 조신들의 이목을 피하려고, 당신은 [target.GetTitledFirstName](을)를 버려진 옛 무덤의 묘도로 불러냈다. 음산한 곳이지만, 방해할 사람은 절대 없었다.\n\n당신이 마음을 고백하려는 찰나, [target.GetSheHe](이)가 먼저 같은 말을 꺼냈다. 그 뒤로 이어진 긴 침묵에는 더 이상의 설명이 필요 없었다."
 quix_seduce_outcome.2023.a:0 "다음엔 그래도 다른 곳으로 가야겠소."
 quix_seduce_outcome.2023.b:0 "옛사람들이 편히 잠들도록 더는 방해하지 말자."
 quix_seduce_outcome.2024.t:0 "산중의 초가"
 quix_seduce_outcome.2024.desc:0 "[target.GetTitledFirstName](은)는 산야의 한 초가에서 당신과 밀회하기로 했다. 이곳에는 하인도, 엿보는 눈도 없어 두 사람은 마침내 속마음을 털어놓을 수 있었다.\n\n밤이 되자 [target.GetSheHe](은)는 곧장 당신의 마음을 물었다. 당신은 피하지 않았고, [target.GetSheHe] 역시 당신의 대답을 받아들였다."
 quix_seduce_outcome.2024.b:0 "산중에서의 하룻밤, 영원히 잊지 않으리."
 quix_seduce_outcome.2025.t:0 "시골에서의 한가한 나날"
 quix_seduce_outcome.2025.desc:0 "당신은 [target.GetTitledFirstName](을)를 시골 장원으로 초대해 머물게 하며, 한적한 나날이 두 사람을 더 가깝게 해 주기를 바랐다.\n\n하루 종일 한가로이 거닐고 오래 이야기를 나눈 뒤, 두 사람은 회랑 아래서 저물어 가는 하늘을 바라보았다. [target.GetSheHe|U](은)는 마침내 더 이상 감추지 않고, 먼저 당신에게 입을 맞추었다."
 quix_seduce_outcome.2025.a:0 "그대와 함께라면, 해마다 이렇기를."
 quix_seduce_outcome.2025.b:0 "잠깐의 맑은 즐거움으로 내 마음은 족하오."
 quix_seduce_outcome.2026.t:0 "밤의 뱃놀이"
 quix_seduce_outcome.2026.desc:0 "당신은 유람선 한 척을 빌려 [target.GetTitledFirstName](을)를 단둘이 뱃놀이에 초대했다. 저녁 식사를 마친 뒤, 두 사람은 등롱이 가득 걸린 뱃머리에서 한담을 나누었다.\n\n[target.GetSheHe|U](은)는 이런 자리를 마련해 주어 고맙다고 말하더니, 말이 끝나자마자 당신에게 입을 맞추었다. 처음의 놀라움은 금세 사라졌고, 두 사람 중 누구도 서둘러 뭍에 닿으려 하지 않았다."
 quix_seduce_outcome.2026.a:0 "훗날 다시 그대와 배를 띄우리다."
 quix_seduce_outcome.2026.b:0 "풍파에 흔들리는 배라니, 다시는 타지 않겠소."
 quix_seduce_outcome.2027.t:0 "지하 창고의 밀회"
 quix_seduce_outcome.2027.desc:0 "몇 달 동안의 탐색은 이제 충분했다. 당신은 [target.GetTitledFirstName](을)를 술 창고로 불러냈다. 외진 곳이라 아무도 찾으러 오지 않을 터였다.\n\n[target.GetSheHe|U](은)는 사다리를 타고 내려오자마자 당신에게 마음을 털어놓았다. 당신 역시 솔직하게 답했고, 이 만남은 곧 말 이상의 것이 되었다."
 quix_seduce_outcome.2027.a:0 "이 창고는 앞으로 우리 둘만의 장소요."
 quix_seduce_outcome.2027.b:0 "술 한 단지 챙겨서 이만 헤어지세."
 quix_seduce_outcome.2028.t:0 "흉금을 터놓고"
 quix_seduce_outcome.2028.desc:0 "오래 고민한 끝에 당신은 [target.GetTitledFirstName]에게 솔직하게 마음을 털어놓기로 했다. 남몰래 만났을 때 [target.GetSheHe](은)는 처음엔 어리둥절한 얼굴이었지만, 끝내 자리를 뜨지 않았다.\n\n당신의 말을 다 들은 [target.GetSheHe](은)는 입맞춤으로 답했다. 알고 보니 [target.GetSheHe] 역시 진작부터 마음이 있었으나, 당신이 진심인지 몰랐던 것이다."
 quix_seduce_outcome.2028.a:0 "흉금을 터놓았으니, 이제부터 한마음이오."
 quix_seduce_outcome.2028.b:0 "다시 생각해 보니, 여기까지 하는 게 좋겠소."
 quix_seduce_outcome.2029.t:0 "정면으로 따져 묻다"
 quix_seduce_outcome.2029.desc:0 "[target.GetTitledFirstName]의 애매한 태도에 진작 질려 버린 당신은 밀회를 마련해 [target.GetHerHim]에게 확답을 요구했다.\n\n[target.GetSheHe|U](은)는 당신을 가지고 논 것이 아니라고 거듭 부인하며, 자신도 오래전부터 마음이 있었다고 털어놓았다. 오해가 풀리자 두 사람은 마주 보고 웃더니 곧 서로를 끌어안았다."
 quix_seduce_outcome.2029.a:0 "진작 털어놓을 것을. 이제부터 함께하리다."
 quix_seduce_outcome.2029.b:0 "할 말은 다 했으니, 각자 몸조심하시오."
 quix_seduce_outcome.2030.t:0 "참을 수 없는 욕정"
 quix_seduce_outcome.2030.a:0 "그대와 뒤엉키는 일이라면 언제라도 즐겁소!"
 quix_seduce_outcome.2030.b:0 "하룻밤의 즐거움이면 족하오."
 quix_seduce_outcome.2031.t:0 "인적 없는 곳에서"
 quix_seduce_outcome.2031.desc:0 "[target.GetTitledFirstName](이)가 당신에게 마음이 있다는 것은 알 수 있었지만, 연회장에는 줄곧 사람들이 오갔다. 당신이 [target.GetHerHis] 귓가에 다가가 함께 빠져나가자고 속삭이자, 두 사람은 남들이 방심한 틈을 타 슬며시 연회를 빠져나왔다.\n\n사람들에게서 멀어진 뒤에야 [target.GetSheHe](은)는 자신도 밤새 이런 기회를 찾고 있었다고 털어놓았다. 두 사람은 마침내 더는 숨기지 않아도 되었다."
 quix_seduce_outcome.2031.a:0 "다음에 자리를 뜰 때는 핑계를 하나 지어내야겠군!"
 quix_seduce_outcome.2031.b:0 "이만 헤어지고, 다시는 찾지 마시오."
 quix_seduce_outcome.2301.t:0 "밀실의 밀회"
 quix_seduce_outcome.2301.desc:0 "당신의 첩자들이 은밀한 저택 한 채를 마련해 주어, 당신은 남의 눈을 피해 [target.GetTitledFirstName](와)과 만날 수 있었다.\n\n아무도 뒤따라오지 않았음을 확인하고서야 문을 밀고 들어가니, [target.GetSheHe](은)는 이미 화로 곁에 앉아 기다리고 있었다. “겉옷을 벗으시지요.” 보아하니 당신의 속셈은 처음부터 [target.GetHerHim]에게 감춰진 적이 없었던 모양이다."
 quix_seduce_outcome.2301.b:0 "벽에도 귀가 있으니, 이번이 마지막이오."
 quix_seduce_outcome.2302.t:0 "하인 숙소에 숨어들다"
 quix_seduce_outcome.2302.a:0 "며칠만 더 머물게 해 주시오."
 quix_seduce_outcome.2302.b:0 "날이 밝기 전에 각자 돌아가세."
 quix_seduce_outcome.2303.t:0 "무산의 운우"
 quix_seduce_outcome.2303.desc:0 "당신은 숲속 야제를 핑계로 [target.GetTitledFirstName](을)를 한밤중에 은밀한 숲으로 불러냈다. 두 사람 모두 이 모임에 다른 목적이 있다는 것을 알고 있었다.\n\n무당과 박수들이 북을 치며 춤추고, 축원의 노래가 끊임없이 울려 퍼졌다. [target.GetSheHe](은)는 당신의 암시에 응했고, 두 사람은 노랫소리 속에서 저마다의 방식으로 이 은밀한 제례를 완수했다."
 quix_seduce_outcome.2303.a:0 "주술이 이루어졌으니, 그대는 이제 내 사람이오!"
 quix_seduce_outcome.2303.b:0 "노랫소리가 귀만 시끄럽군. 다음엔 사양하겠소."
 quix_seduce_outcome.2304.t:0 "사일의 잔치"
 quix_seduce_outcome.2304.desc:0 "사일이 돌아올 때마다 [target.GetName](은)는 늘 홀로 시골 장터에 가곤 했다. 올해는 당신도 사람들 틈에 섞여 들었다. 두 사람은 함께 술을 마시고 신을 즐겁게 하는 북춤을 구경하며, 금세 평소의 신분을 잊어버렸다.\n\n성 밖에서 쉬어 가던 장막으로 돌아와 당신은 마침내 마음을 고백했다. [target.GetSheHe|U](은)는 그저 웃으며 답했다. “진작 알고 있었소.”"
 quix_seduce_outcome.2304.a:0 "해마다 사일이면, 그대와 함께 오리라!"
 quix_seduce_outcome.2304.b:0 "시골의 즐거움, 실컷 누리고 돌아가세."
 quix_seduce_outcome.2305.t:0 "타향의 연회 뒤"
 quix_seduce_outcome.2305.desc:0 "당신과 [target.GetName](은)는 함께 먼 곳의 연회에 초대받았다. 익숙한 조신들과 이목에서 벗어나, 두 사람은 밤새 한자리에 앉아 술을 마시며 담소를 나누었다.\n\n연회가 끝나자 [target.GetSheHe](은)는 슬며시 당신의 손을 건드렸다. 두 사람은 차례로 자리를 떠나 결국 당신의 거처에서 다시 만났다. 이번에는 [target.GetSheHe]도 자신의 갈망을 더 이상 감추지 않았다."
 quix_seduce_outcome.2305.a:0 "며칠 더 머무는 게 어떻겠소?"
 quix_seduce_outcome.2305.b:0 "이곳의 일은 이곳에서 끝내세."
 quix_seduce_outcome.3000.desc:0 "당신이 내실로 돌아왔을 때, [owner.GetTitledFirstName](은)는 이미 그곳에서 기다리고 있었고, 상 위에는 술과 과일이 차려져 있었다.\n\n당신은 웃으며 다가가 손수 과일을 집어 [owner.GetHerHim]의 입가에 가져갔다. [owner.GetSheHe|U](은)는 사양하지 않았고, 두 사람은 곧 서로의 마음을 더는 감추지 않았다."
 quix_seduce_outcome.3000.a:0 "이 사람은 내 마음에 꼭 드는군. 곁에 두겠다."
 quix_seduce_outcome.3010.desc:0 "[owner.GetTitledFirstName](은)는 몇 달째 당신에게 구애해 왔다. 당신은 감방에서 [owner.GetHerHim]에게 마지막 시험을 내리기로 하고, 촛불과 꽃잎과 형구를 하나하나 준비해 두었다.\n\n“오늘 밤은 내 말을 따르시오.” 당신이 [owner.GetHerHim]에게 말했다. [owner.GetSheHe|U](은)는 초대에 응했고, 당신이 마련한 모든 것을 받아들였다."
 quix_seduce_outcome.3010.a:0 "이 사람은 잘 견디는군. 곁에 둘 만하다."
 quix_seduce_outcome.3020.desc:0 "[owner.GetTitledFirstNamePossessive] 정성은 당신도 진작 눈치채고 있었다. 이번에 [owner.GetSheHe](은)는 인편에 짧은 쪽지를 보내 마구간 위 건초 다락에서 만나자고 했고, 당신은 마침내 그곳으로 갔다.\n\n가축들의 소리가 두 사람의 속삭임을 덮어 주었다. [owner.GetSheHe|U](이)가 다가오자, 당신도 더 이상 짐짓 새침한 척하지 않았다."
 quix_seduce_outcome.3020.a:0 "다음엔 내가 그대의 방으로 몰래 숨어들겠소."
 quix_seduce_outcome.3021.desc:0 "당신은 재계하고 복을 빈다는 명목으로 [owner.GetTitledFirstName](을)를 외진 사당으로 불러냈다. 저녁 무렵, 전각 안에는 두 사람 말고 아무도 없었다.\n\n당신은 먼저 사랑과 경건함의 도리부터 논하려 했으나, [owner.GetSheHe](은)는 곧 당신의 진짜 속셈을 알아차렸다. 준비한 말은 결국 한마디도 쓰이지 않았다."
 quix_seduce_outcome.3021.a:0 "앞으로 복을 빌 때도 함께 와 주시오."
 quix_seduce_outcome.3022.desc:0 "[owner.GetName](은)는 한동안 당신에게 구애해 왔다. 당신은 옛 지인의 성 밖 별장을 빌려 이 밀회를 마련했다. 그 주인은 물론 모습을 드러내지 않을 것이었다.\n\n두 사람은 함께 정원을 거닐고 식사를 하며 점점 은밀한 이야기를 나누었다. 오후가 되자 당신은 위층으로 올라가 더 이야기하자고 [owner.GetHerHim](을)를 이끌었고, [owner.GetSheHe](은)는 기꺼이 따랐다."
 quix_seduce_outcome.3022.a:0 "이 정원 참 좋군. 자주 와야겠소."
 quix_seduce_outcome.3023.desc:0 "[owner.GetTitledFirstName](은)는 버려진 옛 무덤의 묘도에서 만나자고 당신을 불러냈다. 음산한 곳이지만, 방해할 사람은 절대 없었다.\n\n[owner.GetSheHe|U](이)가 용건을 꺼내려는 찰나, 당신이 먼저 자신의 속마음을 털어놓았다. 알고 보니 그것이 바로 [owner.GetHerHis] 당신을 부른 까닭이었다."
 quix_seduce_outcome.3023.a:0 "땅속의 옛사람들을 중매쟁이로 삼으리라."
 quix_seduce_outcome.3024.desc:0 "당신은 [owner.GetTitledFirstName](와)과 산야의 한 초가에서 밀회하기로 했다. 이곳에는 하인도, 엿보는 눈도 없어 두 사람은 마침내 속마음을 털어놓을 수 있었다.\n\n밤이 되자 당신은 [owner.GetHerHis] 속뜻을 곧장 물었다. [owner.GetSheHe|U](은)는 자신의 마음을 솔직히 인정했고, 당신도 그것을 받아들였다."
 quix_seduce_outcome.2024.a:0 "이생에 그대를 얻었으니, 더 바랄 것이 무엇이랴!"
 quix_seduce_outcome.3025.desc:0 "[owner.GetTitledFirstName](은)는 당신을 시골 장원으로 불러 머물게 했다. 당신은 [owner.GetSheHe](이)가 당신에게 마음이 있음을 알았지만, [owner.GetHerHim]의 입으로 직접 듣고 싶었다.\n\n하루 종일 한가로이 거닐고 오래 이야기를 나누었는데도, [owner.GetSheHe](은)는 여전히 입을 떼지 못했다. 더 기다릴 수 없었던 당신은 회랑 아래서 먼저 [owner.GetHerHim]에게 입을 맞추었다."
 quix_seduce_outcome.3025.a:0 "이토록 좋은 때가 자주 있기를."
 quix_seduce_outcome.3026.desc:0 "[owner.GetTitledFirstName](은)는 당신을 뱃놀이에 초대했고, 당신은 [owner.GetSheHe](이)가 이를 빌미로 단둘이 있고 싶어 한다는 것을 알았다. 저녁 식사를 마친 뒤, 두 사람은 등롱이 가득 걸린 뱃머리에서 한담을 나누었다.\n\n당신은 이런 자리를 마련해 준 [owner.GetHerHim]에게 고맙다고 말하고는, 말이 끝나자마자 [owner.GetHerHim]에게 입을 맞추었다. [owner.GetSheHe|U](은)는 피하지 않았고, 두 사람 중 누구도 서둘러 뭍에 닿으려 하지 않았다."
 quix_seduce_outcome.3026.a:0 "이 배 참 좋군. 자주 띄워야겠소."
 quix_seduce_outcome.3027.desc:0 "[owner.GetTitledFirstName](은)는 술 창고에서 만나자고 당신을 불러냈다. 마침 고백할 기회를 찾던 당신은 홀로 제시간에 그곳으로 갔다.\n\n사다리를 타고 내려가자마자 당신은 [owner.GetHerHim]에게 마음을 털어놓았다. [owner.GetSheHe|U](은)는 말없이 고개를 끄덕였고, 두 사람 사이에 남아 있던 마지막 망설임도 사라졌다."
 quix_seduce_outcome.3027.a:0 "이 즐거움이 어디까지 가랴, 오래도록 이어지기를!"
 quix_seduce_outcome.3028.desc:0 "[owner.GetTitledFirstName](은)는 당신을 남몰래 불러, 단도직입적으로 당신을 향한 마음을 털어놓았다.\n\n당신은 입맞춤으로 답했다. 사실 당신도 진작부터 마음이 있었으나, [owner.GetSheHe](이)가 진심인지 몰랐을 뿐이다. 이제는 더 의심할 필요가 없었다."
 quix_seduce_outcome.3028.a:0 "마음을 확인했으니, 오래도록 함께하기를."
 quix_seduce_outcome.3029.desc:0 "[owner.GetTitledFirstName](은)는 당신과 밀회하자마자, [owner.GetHerHis] 마음을 뻔히 알면서도 일부러 대답을 미루었다며 당신을 나무랐다.\n\n당신은 황급히 부인했다. 당신 역시 줄곧 남몰래 [owner.GetHerHim](을)를 사모해 왔던 것이다. 오해가 풀리자 두 사람은 마주 보고 웃더니 곧 서로를 끌어안았다."
 quix_seduce_outcome.3029.a:0 "앞으로는 더 숨길 필요 없겠구려."
 quix_seduce_outcome.3030.a:0 "이 몸과 이 밤, 모두 그대에게 바치리다."
 quix_seduce_outcome.3301.desc:0 "[owner.GetTitledFirstName](은)는 은밀한 저택 한 채를 마련해, 남의 눈을 피해 만나자고 당신을 불렀다. [owner.GetHerHis] 속뜻은 짐작할 수 있었고, 그것은 당신의 바람과도 꼭 맞았다.\n\n아무도 뒤따라오지 않았음을 확인한 당신은 먼저 방에 들어가 기다렸다. [owner.GetSheHe|U](이)가 문을 들어서자, 당신은 딱 한마디만 했다. “겉옷을 벗으시지요.”"
 quix_seduce_outcome.2301.a:0 "이곳의 등불은 언제나 그대를 위해 켜 두겠소."
 quix_seduce_outcome.3302.a:0 "며칠 더 머물다 가시오."
 quix_seduce_outcome.3303.desc:0 "[owner.GetTitledFirstName](은)는 한밤중 숲속 야제에 당신을 초대했다. 두 사람 모두 이 숲속 모임에 다른 목적이 있다는 것을 알고 있었다.\n\n무당과 박수들이 북을 치며 춤추고, 축원의 노래가 끊임없이 울려 퍼졌다. 당신은 [owner.GetHerHis] 암시에 응했고, 두 사람은 노랫소리 속에서 저마다의 방식으로 이 은밀한 제례를 완수했다."
 quix_seduce_outcome.3303.a:0 "이 노래 참 좋구려. 자주 듣고 싶소."
 quix_seduce_outcome.3304.desc:0 "사일이 돌아올 때마다 당신은 홀로 시골 장터에 가서 관아의 번잡한 일을 잠시 잊곤 했다. 올해는 [owner.GetTitledFirstName]도 사람들 틈에 나타났다.\n\n두 사람은 함께 술을 마시고 신을 즐겁게 하는 북춤을 구경한 뒤, 성 밖에서 쉬어 가던 장막으로 함께 돌아왔다. [owner.GetSheHe|U](이)가 마침내 마음을 고백하자, 당신은 그저 웃으며 답했다. “진작 알고 있었소.”"
 quix_seduce_outcome.3304.a:0 "내년 사일에도 그대와 만나리라."
 quix_seduce_outcome.3305.desc:0 "당신과 [owner.GetName](은)는 함께 먼 곳의 연회에 초대받았다. 당신은 [owner.GetSheHe](이)가 줄곧 당신에게 마음이 있었음을 알았고, 익숙한 이목에서 벗어난 지금이 두 사람에게 좋은 기회였다.\n\n두 사람은 밤새 한자리에 앉아 술을 마시며 담소를 나누었다. 연회가 끝나자 당신은 슬며시 [owner.GetHerHis] 손을 건드렸고, 두 사람은 차례로 자리를 떠나 결국 [owner.GetHerHis] 거처에서 다시 만났다."
 quix_seduce_outcome.3305.a:0 "좋은 밤은 짧기만 하니, 며칠 더 머무르세."
