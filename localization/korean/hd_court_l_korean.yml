l_korean:
 # 乱世霸权·天子与权臣（2026-10-10）


 # 傀儡
 hd_court_puppet: "끼고 있는 천자"
 hd_court_puppet_desc: "천자는 여전히 옥좌에 앉아 있으나, 조서는 당신의 막부에서 나온다. 그의 이름을 빌려 당신은 정벌하고, 봉하고 임명하며, 옥에 가두고 사면할 수 있다."
 puppet_action_description_hd_court_puppet_action_grant_titles: "천자의 이름으로 #V [GetPlayer.GetPlayerInteractionName('grant_titles_interaction')]#! [interaction|E]을 사용하여 천자 명의의 [titles|E]을 다른 이에게 분봉합니다"
 puppet_action_description_hd_court_puppet_action_revoke_title: "천자의 이름으로 #V [GetPlayer.GetPlayerInteractionName('revoke_title_interaction')]#! [interaction|E]을 사용하여 천자의 [vassals|E]에게서 [titles|E]을 거두어들입니다"
 hd_court_puppet_placeholder_interaction: "천자 끼기"

 # 挟天子成立
 hd_court.0001.t: "천자몽진"
 hd_court.0001.desc: "도성의 소식이 전해졌을 때, 성문은 이미 수비군이 바뀌어 있었다. [hd_court_new_regent.GetTitledFirstName]의 군대가 궁성에 진주하였고, [hd_court_emperor.GetTitledFirstName]의 수레는 새 행재소로 맞아들여졌다.\n\n조서는 여전히 천자의 말투로 쓰였고, 찍힌 것도 여전히 천자의 옥새였다. 그러나 누구나 알았다. 이제부터 붓을 쥔 것은 다른 손이라는 것을."
 hd_court.0001.a: "천자가 누구의 손에 있느냐에 따라 천하의 눈길이 향한다."

 # 弃天子自立
 hd_court_abandon_emperor_decision: "천자를 버리고 자립"
 hd_court_abandon_emperor_decision_desc: "천자를 받들고 있으니 제후들이 감히 드러내 놓고 나와 적대하지 못하지만, 이 깃발은 내 손발도 묶어 놓았다. 조정의 예법, 신하들의 눈치, 천자의 그 말 없는 얼굴…… 이제 이 모든 것을 그에게 돌려줄 때가 되었는지도 모른다."
 hd_court_abandon_emperor_decision_tooltip: "보정에서 물러나 영지를 이끌고 천자를 떠나 한 지역에 자립합니다"
 hd_court_abandon_emperor_decision_confirm: "이제부터 각자의 길을 간다!"
 hd_court_abandon_emperor_decision_effect_tt: "승상과 보정의 직에서 물러나 자신의 영지를 이끌고 천자를 떠납니다. 천자는 이제 더 이상 당신의 통제를 받지 않습니다"
 hd_court_abandoned_emperor_opinion: "천자를 저버림"

 # 第 3 期：立场
 hd_court_stance_zunhan_modifier: "존한"
 hd_court_stance_zunhan_modifier_desc: "이 사람은 여전히 한나라의 정삭을 받들며, 역적을 토벌하고 한을 안정시키는 것을 자기 소임으로 삼는다."
 hd_court_stance_moni_modifier: "모역"
 hd_court_stance_moni_modifier_desc: "이 사람의 눈에는 이미 한나라 천자가 없고, 오직 손에 쥔 칼과 병기만 믿는다."
 hd_court_declare_zunhan_decision: "한나라 정삭을 받들다"
 hd_court_declare_zunhan_decision_desc: "한의 국운이 비록 쇠하였으나 천자는 아직 계신다. 나는 그 정삭을 받들어 불신을 토벌하고 사직을 안정시키리라. 적어도 천하 사람들은 나를 그렇게 볼 것이다."
 hd_court_declare_zunhan_decision_tooltip: "한 황실을 받들 것을 선포하고, 역적을 토벌하고 한을 안정시키는 것을 자기 소임으로 삼습니다"
 hd_court_declare_zunhan_decision_confirm: "한 황실을 돕지 않을 수 없다!"
 hd_court_declare_moni_decision: "더는 조서를 받들지 않다"
 hd_court_declare_moni_decision_desc: "이른바 조서란 천자를 끼고 있는 자가 빌려 온 명분일 뿐이다. 천명은 무상하여 오직 덕 있는 자가 차지하는 것이니, 덕이란 칼과 창으로 다투어 얻는 것이다."
 hd_court_declare_moni_decision_tooltip: "더 이상 조정의 호령을 따르지 않을 것을 선포합니다"
 hd_court_declare_moni_decision_confirm: "천하는 능력 있는 자가 차지한다!"
 hd_court_stance_cooldown_tt: "최근에 이미 입장을 밝혔으므로, 아침저녁으로 명령을 바꾸는 것은 마땅치 않습니다"

 # 第 3 期：朝廷特权
 hd_court_grant_rank_interaction: "장군호 수여"
 hd_court_grant_rank_interaction_desc: "조정의 이름으로 [recipient.GetShortUIName]에게 장군 명호를 수여합니다"
 hd_court_grant_rank_interaction_notification: "조정이 [recipient.GetShortUIName]에게 장군의 호를 수여함"
 hd_court_already_has_rank_tt: "[recipient.GetShortUIName](은)는 이미 장군 명호를 가지고 있습니다"
 hd_court_yaoling_interaction: "주를 요령하게 함"
 hd_court_yaoling_interaction_desc: "조정의 이름으로 [recipient.GetShortUIName]에게 [secondary_recipient.GetShortUIName](이)가 차지한 주를 요령하게 하여, 그곳의 각 군에 대한 [claims|E]을 갖게 합니다"
 hd_court_yaoling_interaction_notification: "조정이 [recipient.GetShortUIName]에게 한 주를 요령하게 함"
 hd_court_order_campaign_interaction: "정벌 조령"
 hd_court_order_campaign_interaction_desc: "조정의 이름으로 [recipient.GetShortUIName]에게 [secondary_recipient.GetShortUIName](을)를 토벌하라 명합니다"
 hd_court_order_campaign_interaction_notification: "조정이 [recipient.GetShortUIName]에게 [secondary_recipient.GetShortUIName] 토벌을 조령함"
 hd_court_order_campaign_decline_tt: "조서를 거역하고 따르지 않으면 천하 제후들이 이를 구실로 삼을 것입니다"
 hd_court_demand_tribute_interaction: "공물 진상 명령"
 hd_court_demand_tribute_interaction_desc: "조정의 이름으로 [recipient.GetShortUIName]에게 금화와 곡식을 조정에 바치라 명합니다"
 hd_court_demand_tribute_interaction_notification: "조정이 [recipient.GetShortUIName]에게 진상을 명함"
 hd_court_emperor_prestige_tt: "천자에게 충분한 [prestige|E]이 있어야 제후들이 조령을 무겁게 여깁니다"
 hd_court_request_campaign_interaction: "토벌 조서 요청"
 hd_court_request_campaign_interaction_desc: "조정에 조서를 내려 [secondary_recipient.GetShortUIName] 토벌을 허락해 달라고 청합니다"
 hd_court_request_campaign_interaction_notification: "[actor.GetShortUIName](이)가 [secondary_recipient.GetShortUIName] 토벌 조서를 청함"
 hd_court_return_land_interaction: "조정에 땅을 바침"
 hd_court_return_land_interaction_desc: "[target.GetName](을)를 천자께 돌려드려 조정이 따로 분봉하게 합니다"
 hd_court_return_land_interaction_notification: "[actor.GetShortUIName](이)가 영지를 조정에 바침"

 hd_court_reason_zunhan: "한 황실을 받듦"
 hd_court_reason_moni: "한의 조서를 받들지 않음"
 hd_court_reason_friend_of_target: "상대와 사이가 좋음"
 hd_court_reason_rival_of_target: "상대와 틈이 있음"
 hd_court_reason_target_moni: "상대는 모역한 자임"
 hd_court_reason_weaker_than_target: "병력이 상대에 미치지 못함"
 hd_court_reason_at_war: "전쟁 중임"
 hd_court_reason_asker_zunhan: "조서를 청한 자가 한 황실을 받듦"
 hd_court_reason_target_friend_of_court: "상대가 조정과 사이가 좋음"
 hd_court_reason_zunhan_to_emperor: "천자에게 귀부하기를 원함"
 hd_court_reason_same_zunhan: "함께 한 황실을 받듦"
 hd_court_reason_zunhan_vs_moni: "모역한 자와 한패가 되기를 부끄러워함"
 hd_court_reason_moni_vs_emperor: "천자에게 귀부하기를 업신여김"

 hd_court_defied_edict_modifier: "항조"
 hd_court_defied_edict_modifier_desc: "이 사람은 조서를 거부하였으니, 천하 사람들이 조정과 제후들이 그를 어떻게 대하는지 지켜보고 있다."
 hd_court_defied_edict_opinion: "조서를 거역함"
 hd_court_honored_by_court_opinion: "조정의 은우"
 hd_court_returned_land_opinion: "땅을 바친 공"

 # 奉诏讨伐 CB
 hd_court_fengzhao_cb: "봉조토벌"
 hd_court_fengzhao_cb_war_name: "[ATTACKER.GetShortUINamePossessive] 봉조 전쟁"
 hd_court_fengzhao_cb_victory_desc: "[attacker.GetShortUIName|U](이)가 목표 군에서 [defender.GetShortUINamePossessive] 차지한 각 현을 빼앗습니다."
 hd_court_fengzhao_cb_white_peace_desc: "양측이 군사를 거두고 화친합니다."
 hd_court_fengzhao_cb_defeat_desc: "[attacker.GetShortUIName|U](이)가 토벌에 실패하여 [defender.GetShortUIName]에게 배상금을 지불해야 합니다."

 # 第 4 期：天子反击
 hd_court_suborn_interaction: "은밀한 결탁"
 hd_court_suborn_interaction_desc: "금과 비단으로 [recipient.GetShortUIName](와)과 은밀히 결탁하여, 훗날 권신을 제거할 동지로 삼습니다"
 hd_court_suborn_interaction_notification: "천자가 은밀히 [recipient.GetShortUIName](와)과 결탁함"
 hd_court_suborn_exposed_tt: "#EMP 이 일이 권신에게 발각되면 그가 당신을 더욱 경계하게 될 뿐입니다.#!"
 hd_court_secret_edict_interaction: "의대조"
 hd_court_secret_edict_interaction_desc: "피로 쓴 밀조를 옷띠에 꿰매어 [recipient.GetShortUIName]에게 전하게 하고, 군사를 일으켜 역적을 치라 명합니다"
 hd_court_secret_edict_interaction_notification: "[recipient.GetShortUIName](이)가 천자의 의대조를 받았습니다"
 hd_court_secret_edict_exposed_tt: "#EMP 밀조가 한번 새어 나가면 궁중에서 반드시 누군가 목숨을 잃게 됩니다.#!"
 hd_court_flee_interaction: "출분"
 hd_court_flee_interaction_desc: "밤을 틈타 몰래 궁성을 빠져나가 [recipient.GetShortUIName]에게 의탁합니다"
 hd_court_flee_interaction_notification: "천자가 [recipient.GetShortUIName]에게로 출분하려 함"
 hd_court_flee_success_tt: "빠져나갈 수 있다면 [recipient.GetShortUIName](이)가 당신을 그의 영내로 맞아들여 대신 보정할 것입니다"
 hd_court_flee_failure_tt: "가로막히면 더욱 엄중히 감시받게 됩니다"
 hd_court_closely_watched_tt: "당신은 권신에게 엄중히 감시받고 있습니다"
 hd_court_reason_loyal: "주군에게 충성함"
 hd_court_reason_greedy: "금과 비단을 탐함"
 hd_court_reason_ambitious: "큰 뜻을 품음"
 hd_court_reason_rival_of_regent: "권신과 틈이 있음"
 hd_court_reason_weaker_than_regent: "병력이 권신에 미치지 못함"

 hd_court_palace_coup_decision: "권신 주살"
 hd_court_palace_coup_decision_desc: "궁문 수비병 가운데 내 사람이 있고, 권신의 문하에도 내 사람이 있다. 다만 한 번의 때를 기다릴 뿐이다. 그가 입궁하여 정사를 아뢰는 그날을."
 hd_court_palace_coup_decision_tooltip: "은밀히 결탁한 동지들과 함께 거사하여 권신을 주살합니다"
 hd_court_palace_coup_decision_confirm: "오늘 반드시 이 역적을 베리라!"
 hd_court_palace_coup_decision_effect_tt: "#EMP 성공하면 친정하고, 실패하면 동지들이 모두 죽습니다. 동지가 많을수록, 당신의 [intrigue|E]가 권신보다 뛰어날수록 승산이 커집니다.#!"
 hd_court_coup_supporters_tt: "살아 있는 동지가 최소 세 명 있어야 합니다"
 hd_court_raise_guards_decision: "친위 근위대 모집"
 hd_court_raise_guards_decision_desc: "궁중의 위사들은 몇 번이나 바뀌었지만, 그중 내 사람은 하나도 없다. 직접 용사 몇을 골라 곁을 지키게 할 수 있다면, 적어도 밤에는 조금 편히 잘 수 있으리라."
 hd_court_raise_guards_decision_tooltip: "용맹한 무사 두 명을 불러 궁에 들여 숙위하게 하며, 훗날 권신을 제거할 동지로 삼을 수 있습니다"
 hd_court_raise_guards_decision_confirm: "용맹한 자를 골라 궁궐을 숙위하게 하라!"
 hd_court_guards_cooldown_tt: "최근에 이미 근위를 모집했습니다"

 hd_court_closely_watched_modifier: "엄중 감시"
 hd_court_closely_watched_modifier_desc: "이 사람 곁의 모든 이가 권신의 눈과 귀일 수 있다."
 hd_court_restored_emperor_opinion: "정권을 돌려준 은혜"
 hd_court_plotted_against_opinion: "나를 해치려 꾀함"
 hd_court_suspicious_opinion: "의심을 품음"

 hd_court.0010.t: "천자를 맞아 모시다"
 hd_court.0010.desc: "역당은 이미 무너졌고 궁문은 활짝 열렸다. [hd_court_restore_emperor.GetTitledFirstName](은)는 전각 앞에 서서, 손에는 아직도 그 옷띠를 움켜쥐고 있었다. 그는 당신을 바라보며 아무 말도 하지 않았다.\n\n처음에 당신은 조서를 받들고 왔다. 이제 조서에 적힌 일은 다 끝났지만, 그다음 일은 조서에 적혀 있지 않았다."
 hd_court.0010.a: "신은 조서를 받들어 역적을 토벌하였으니, 이제 정사를 폐하께 돌려드리겠나이다."
 hd_court.0010.b: "천하가 아직 안정되지 않았으니, 폐하께서는 아직 보좌할 이가 필요하옵니다."
 hd_court.0011.t: "전상에 숨긴 갑사"
 hd_court.0011.desc: "권신은 여느 때처럼 입궁하여 정사를 아뢰려 칼을 풀고 신을 벗은 채 전각 계단을 올랐다. 휘장 뒤에 매복한 갑사들이 일제히 달려들었다.\n\n핏자국이 채 닦이기도 전에 당신은 이미 옥좌로 돌아와 앉았다. 이번에는 당신 뒤에 서서 대신 말해 줄 사람이 아무도 없었다."
 hd_court.0011.a: "짐은 오늘부터 친정하노라."
 hd_court.0012.t: "일이 새어 나가다"
 hd_court.0012.desc: "약속한 시각이 되었으나 전각 밖에서는 좀처럼 아무 기척이 없었다. 기다린 끝에 찾아온 것은 권신의 갑사들이었고, 그들은 당신의 동지들을 하나씩 끌고 전각 앞을 지나갔다.\n\n당신을 끌고 가러 온 사람은 없었다. 권신은 그저 사람을 보내 이렇게 전했을 뿐이다. 폐하께서 요즘 피로하시니 궁중에서 조용히 쉬시는 것이 좋겠다고."
 hd_court.0012.a: "……"
 hd_court.0014.t: "밤에 궁문을 나서다"
 hd_court.0014.desc: "수레는 밤의 어둠 속에 성을 빠져나갔고, 도중에 세 번이나 말을 바꾸었다. 동틀 무렵, 맞이하러 온 군대가 이미 길가에 줄지어 서 있었다.\n\n당신은 마침내 그 궁성을 떠났다. 앞에서 당신을 맞이하는 이가 다음 권신이 될지는, 지금은 돌아볼 겨를이 없었다."
 hd_court.0014.a: "우선 이 새장부터 벗어나야 한다."
 hd_court.0015.t: "추격"
 hd_court.0015.desc: "어가가 성문을 나선 지 얼마 되지 않아 추격병이 들이닥쳤다. 수행하던 이들은 하나둘 끌려갔고, 당신은 궁 안으로 '모셔져' 돌아왔다.\n\n그날부터 당신의 침전 밖을 지키는 병사가 배로 늘었다."
 hd_court.0015.a: "하늘이 나를 돕지 않는구나."

 hd_court_welcome_army_toast: "왕사를 맞이하다"
 hd_court_welcome_army_toast_desc: "성안의 부로들이 단사호장으로 근왕의 군대를 맞이한다."

 # 第 5 期：篡位与僭号
 hd_court_depose_ceremonial_decision: "허위로 폐하다"
 hd_court_depose_ceremonial_decision_desc: "굳이 수선단을 쌓아 선양을 받을 필요가 있겠는가? 천자는 여전히 궁에 머물며 예전처럼 백관의 조배를 받으면 된다. 다만 이제부터 천하의 일에는 관여하지 않을 뿐이다."
 hd_court_depose_ceremonial_decision_tooltip: "스스로 천명을 취하고, 옛 천자에게는 허울뿐인 자리를 남겨 둡니다"
 hd_court_depose_ceremonial_decision_confirm: "폐하께서는 부디 옥체를 보중하소서."
 hd_court_depose_ceremonial_decision_effect_tt: "당신은 천명을 얻고, 옛 천자는 허위를 유지하되 당신의 통제를 받습니다. 이는 선양보다도 민심을 얻기 어려우니 한실을 받드는 천하의 사람들이 결코 당신에게 복종하지 않을 것이며, 제후들도 찬탈자 토벌을 명분 삼아 군사를 일으킬 것입니다"
 hd_court_regent_tenure_tt: "당신이 섭정한 지 오래지 않아 아직 인심이 따르지 않습니다"
 hd_court_abdicated_title_name: "산양"
 hd_court_ceremonial_title_name: "한실"
 hd_court_ceremonial_monarch_modifier: "허위 천자"
 hd_court_ceremonial_monarch_modifier_desc: "이 사람은 여전히 백관의 조배를 받지만, 더는 천하의 일에 관여할 수 없다."
 hd_court_usurper_opinion: "한을 찬탈한 역적"

 hd_court_proclaim_emperor_decision: "참칭 칭제"
 hd_court_proclaim_emperor_decision_desc: "한실이 쇠미한 지 오래, 천자는 남의 손에 쥐인 인장 하나에 지나지 않는다. 나는 한 지방을 차지하고 병사는 정예하며 군량은 넉넉하고 백성의 마음도 내게 돌아왔다. 어찌 스스로 명호를 세우지 못하겠는가?"
 hd_court_proclaim_emperor_decision_tooltip: "스스로 제호를 세우고 한의 천자와 대등하게 맞섭니다"
 hd_court_proclaim_emperor_decision_confirm: "한을 대신할 자는 당도고로다!"
 hd_court_proclaim_emperor_decision_effect_tt: "당신은 스스로 황제가 되어 한 천자의 정통 절반을 나누어 가집니다. 이로써 당신은 역모를 꾀한 자가 되며, 한을 받드는 이웃 나라들이 조서를 받들어 당신을 토벌할 것입니다"
 hd_court_proclaim_size_tt: "최소 서른 개 현의 땅을 차지해야 합니다"
 hd_court_proclaim_army_tt: "병력이 천자(혹은 천자를 끼고 있는 자)보다 약하지 않아야 합니다"
 hd_court_proclaim_popular_tt: "다스리는 현 대부분의 민심이 따라야 합니다"
 hd_court_pseudo_empire_name: "[hd_court_pseudo_founder.GetPrimaryTitle.GetBaseName]"
 hd_court_pseudo_emperor_modifier: "참칭 칭제"
 hd_court_pseudo_emperor_modifier_desc: "이 사람은 스스로 제호를 세우고 한의 천자와 대등하게 맞서고 있다."
 hd_court_pseudo_emperor_opinion: "제호를 참칭한 역적"

 hd_court.0020.t: "한조의 교체"
 hd_court.0020.desc: "소식이 천하에 퍼졌다. [hd_court_usurper.GetTitledFirstName]의 제위 등극과 [hd_court_deposed_emperor.GetTitledFirstName]의 옥새 반납 소식이었다.\n\n누군가는 천명이 돌아간 것이라 하고, 누군가는 찬역이라 한다. 각지의 주군은 형세를 관망하고 있으며, 적지 않은 이들이 이미 토벌의 명분을 찾기 시작했다."
 hd_court.0020.a: "천명이란 언제나 승자가 써 내려가는 법."
 hd_court.0021.t: "참호"
 hd_court.0021.desc: "[hd_court_pseudo_founder.GetTitledFirstName](이)가 단을 쌓아 하늘에 제사하고 스스로 황제가 되었다. 연호를 고치고 국호를 세웠으며, 백관을 두고 종묘를 세웠다.\n\n한의 천자가 아직 건재하니, 천하에 두 천자가 생긴 셈이다. 한실을 받드는 이들이 잇달아 상소하여 이 참월한 무리를 토벌하기를 청하고 있다."
 hd_court.0021.a: "하늘에 두 해가 있고, 백성에게 두 임금이 있도다."

 hd_court_taocuan_cb: "토찬"
 hd_court_taocuan_cb_war_name: "[ATTACKER.GetShortUINamePossessive] 토찬 전쟁"
 hd_court_taocuan_cb_victory_desc: "[attacker.GetShortUIName|U](이)가 찬역을 토평하고 천명을 취하여 대신합니다."
 hd_court_taocuan_cb_white_peace_desc: "양측이 군사를 거두고 화친합니다."
 hd_court_taocuan_cb_defeat_desc: "[attacker.GetShortUIName|U](이)가 토찬에 실패하여 [defender.GetShortUIName]에게 배상금을 지불해야 합니다."

 # 第 6 期：都督区
 hd_court_dudu_grant_claim_interaction: "명분 원격 수여"
 hd_court_dudu_grant_claim_interaction_desc: "조정의 이름으로 [recipient.GetShortUIName]에게 인접한 군 하나에 대한 [claims|E](을)를 허락하고, 스스로 때를 골라 정벌하게 합니다"
 hd_court_dudu_grant_claim_interaction_notification: "조정이 [recipient.GetShortUIName]에게 이웃 군의 정벌을 허락했습니다"

