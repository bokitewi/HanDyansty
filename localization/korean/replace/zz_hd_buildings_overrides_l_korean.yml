 # 2026-10-09 从旧版原版副本 buildings_l_simp_chinese.yml 拆出的 mod 对原版建筑文本的覆盖
 building_type_hospices_01: "양질원"
 building_type_hospices_01_desc: "양질원은 병들고 쇠약하며 곤궁한 이들을 거두어, 의술에 밝고 몸가짐이 청렴한 이들이 그들의 탕약과 기거를 돌봅니다."
 building_hospices_08_desc: "대의원은 늙고 병약한 이들에게 의식과 탕약을 제공하고, 병든 길손도 치료합니다. 환자들은 이곳에서 외부와 격리되어, 의술에 밝고 몸가짐이 청렴한 이들의 세심한 보살핌을 받습니다."
 building_london_bridge_01: "런던 다리"
 building_type_holy_site_cathedral_01: "대성당"
 building_type_holy_site_cathedral_01_desc: "이 [holy_site|E]|에는 알려진 온 세상에서 그리스도교 순례자들이 모여듭니다. 대성당은 공학과 미학의 경이일 뿐 아니라, 여행자들의 안전한 피난처이자 후원자들의 이름 높은 기념비이기도 합니다."
 building_holy_site_cathedral_01: "대성당"
 building_holy_site_japanese_temple_01: "$building_holy_site_other_grand_temple_01$"
 building_citadel_thang_long_01_desc: "성 안에 정예병이 주둔하고 성벽이 여러 차례 증축되어, 외적을 성 아래에서 막아 내기에 충분한 난공불락의 견성이 되었습니다."
