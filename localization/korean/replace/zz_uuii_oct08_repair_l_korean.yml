 WJ_mt_already_picked_tt:0 "이 사람은 이미 이쪽으로 선택되었습니다. 바꾸려면 다른 사람을 고르거나 다른 쪽으로 바꾸십시오."
 WJ_mt_different_pair_tt:0 "넘기는 쪽과 받는 쪽은 같은 사람일 수 없습니다."
 WJ_miaoshi_text_prompt:0 "정하려는 칭호를 입력하십시오"
 WJ_miaoshi_text_required_tt:0 "먼저 정하려는 칭호를 적어야 흠정할 수 있습니다. 직접 정할 생각이 없다면 돌아가서 다른 것을 고를 수 있습니다."
 WJ_miaoshi_back:0 "이전 단계로 돌아가기"
 WJ_peer_choose_ting_tt:0 "정 하나를 골라 봉호로 삼고, 그 조세를 식읍으로 삼습니다."
 WJ_peer_choose_hou_tt:0 "현 하나를 골라 봉호로 삼고, 그 조세를 식읍으로 삼습니다."
 WJ_peer_choose_county_princess_tt:0 "현 하나를 골라 공주의 봉호로 삼아 그 조세를 받게 합니다. 그 땅을 다스리지 않으며 정사에도 관여하지 않습니다."
 WJ_peer_choose_duchy_princess_tt:0 "군 하나를 골라 공주의 봉호로 삼아 군치가 있는 현의 조세를 받게 합니다. 그 땅을 다스리지 않으며 정사에도 관여하지 않습니다."
 WJ_peer_back_tt:0 "이전 단계로 돌아갑니다. 아직 작위를 수여하지 않았으므로 드는 비용도 없습니다."
 WJ_peer_rank_desc:0 "당신은 [ROOT.Char.MakeScope.Var('wj_peer_target').Char.GetFirstNameNoTooltip]의 작호를 정해야 합니다. 공신은 훈업으로 작위를 받고, 종실의 여인은 친족의 정으로 공주에 봉해집니다. 작위에는 그 칭호가 있고 식읍에는 그 고을이 있으나, 봉함을 받은 자가 그 땅을 다스리지는 않으며, 원래 맡던 관직도 이로 인해 바뀌지 않습니다."
 WJ_peer_choose_rank_tt:0 "작위 등급을 정한 뒤, 봉호와 식읍을 고릅니다."
 WJ_peer_choose_place_tt:0 "주군이라면 그 안으로 들어가 세세히 고르고, 봉할 수 있는 땅이라면 곧바로 이곳으로 조서를 내려 책봉합니다."
 WJ_peer_pick_desc:0 "담당 관청이 지도와 장부를 펼쳐, 아직 분봉할 수 있는 주군현읍을 하나하나 나열했습니다. 봉호와 식읍을 고르면 곧 책봉의 조서를 내릴 수 있습니다."
 WJ_peer_navigation_tt:0 "지도와 장부를 뒤져 다른 곳을 고릅니다."
 WJ_peer_cancel_tt:0 "이번 책봉은 일단 그만둡니다. 아무것도 수여하지 않으며, 아무것도 소모하지 않습니다."
 game_concept_governor:0 "관원"
 game_concept_governor_possessive:0 "관원"
 game_concept_governors:0 "관원"
 game_concept_governors_possessive:0 "관원"
 game_concept_governorship:0 "관직"
 game_concept_governorships:0 "관직"
 game_concept_governor_desc:0 "[government_bureaucratic_gov|E]의 관원은 명을 받아 [realm|E] 안의 땅을 다스리며, [governor_efficiency|E]에 따라 부세, 민생, 병무를 처리합니다.\n\n관원이 관장하는 [title|E](와)과 그 아래 [counties|E](을)를 합쳐 [province|E](이)라 부릅니다. 관할 구역에 [governance_issues|E](이)가 생기면 관원이 처리해야 합니다.\n\n관원은 [influence|E](을)를 쌓아 다른 관직의 임명과 [succession|E]에 참여할 수 있습니다."
 game_concept_province:0 "군현"
 game_concept_provinces:0 "군현"
 game_concept_provincial:0 "군현"
 game_concept_province_desc:0 "[province|E](은)는 [government_bureaucratic_type|E]에서 [governor|E](이)가 다스리는 관할 구역으로, 그 [title|E](와)과 소속 현읍을 포함합니다.\n\n관할 구역의 [province_administration|E](은)는 통치의 중점을 정하며 세수, 병무 등의 효율에 영향을 줍니다."
 game_concept_province_administration:0 "관할 구역 행정"
 game_concept_province_administrations:0 "관할 구역 행정"
 game_concept_province_administration_desc:0 "[government_bureaucratic_type|E] [realm|E]의 [province|E](은)는 직무에 따라 행정 유형을 정하며, [liege|E](와)과 [governor|E](이)가 협의하여 결정합니다.\n\n각 관할 구역은 한 번에 한 가지 행정 유형만 쓸 수 있습니다."
 game_concept_wj_xianwang_level_xian_desc:0 "재주와 행실이 처음 드러나 고을에서 칭찬합니다. 사인이 이미 한 지방의 신뢰를 얻어 현무의 후보가 될 만하나, 임명받을 수 있는지는 여전히 조정의 명을 받들어야 합니다."
 game_concept_wj_xianwang_level_jun_desc:0 "명성이 군에 알려지고 일을 다스림에 칭찬이 있습니다. 군의 현사와 관원들이 점차 그 재능을 알게 되어, 한 군의 직임에 천거될 만합니다."
 game_concept_wj_xianwang_level_zhou_desc:0 "사림의 추중을 받아 칭송이 주 경내에 가득합니다. 재학과 공업이 이미 한 주에 알려져, 지방 중임의 후보에 오르기에 족합니다."
 game_concept_wj_xianwang_level_chao_desc:0 "이름이 해내에 드러나 조야의 중시를 받습니다. 그 덕망과 치적에 모두 근거가 있어 공경의 후보에 오를 수 있고, 조정의 중요한 업무를 맡을 수 있습니다."
 game_concept_wj_xianwang_level_gong_desc:0 "천하가 우러르는 바이며, 사림에서 명망이 높습니다. 덕행, 공업, 명성이 뛰어나 공보의 후보로 족하며, 임명을 받은 뒤에야 해당 직무를 맡을 수 있습니다."
