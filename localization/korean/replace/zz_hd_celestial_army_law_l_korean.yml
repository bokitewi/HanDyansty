l_korean:
 # 구 kuzhu_admin_recruit_* 계열은 2026-10-31 원판 군대 지휘 체계로 통합: 명칭과 설명만 계승
 celestial_army_liege_law_0: "군부 모병제"
 celestial_army_liege_law_0_subname: "각지의 군정 장관이 스스로 군대를 모집하고 부양하며, 중앙은 명목상의 통할권만 유지합니다."
 celestial_army_liege_law_1: "중외 분장제"
 celestial_army_liege_law_1_subname: "중앙과 지방이 병력, 군비, 지휘의 책임을 함께 집니다."
 celestial_army_liege_law_2: "부병제"
 celestial_army_liege_law_2_subname: "토지로 호적에 편입된 군사를 부양하여, 평시에는 농사짓고 훈련하며 전시에는 조서를 받들어 출정합니다."
 celestial_army_liege_law_3: "금군제"
 celestial_army_liege_law_3_subname: "정예 상비군을 중앙이 직접 부양하고 장수를 뽑아 운용하므로 지방이 손댈 수 없습니다."
 celestial_army_vassal_law_0_subname: "군주가 군대를 모집하고 부양하는 권한을 지방 장관에게 넘겼습니다."
 celestial_army_vassal_law_1_subname: "군주와 지방이 병력, 군비, 지휘의 책임을 함께 집니다."
 celestial_army_vassal_law_2_subname: "토지로 호적에 편입된 군사를 부양하여, 군주의 조령에 따라 출정하게 합니다."
 celestial_army_vassal_law_3_subname: "병권, 군비, 장수 선발의 권한이 모두 중앙에 속하며, 지방 장관은 임의로 간여할 수 없습니다."
