 ra_merit_candidacy_merit_desc:0 "[merit|E](은)는 조정이 임관 후보자를 가늠하는 중요한 근거입니다. 향리에서 칭송받는 자는 현의 일을 맡을 수 있고, 명성이 군과 주에 알려진 자는 지방의 중임을 맡을 수 있으며, 이름이 천하에 드러난 자라야 비로소 공경의 재목이 됩니다.\n\n임용 여부는 여전히 자격, 공적, 조정의 임명을 함께 따져야 합니다."
