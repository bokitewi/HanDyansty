 favored_minister_court_position:0 "시중"
 favored_minister_court_position_desc:0 "시중은 천자의 측근 신하로서 금중을 드나들며 고문과 응대를 맡습니다. 그가 관장하는 부서의 [treasury|E] 배분도 이로 인해 넉넉해집니다."
