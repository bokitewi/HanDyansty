 game_concept_celestial_government_desc:0 "$game_concept_wj_junguozhi_desc$"
 game_concept_wj_junguozhi_desc:0 "[GetGovernment('celestial_government').GetRuleInfo][GetGovernment('celestial_government').GetFlagInfo]\n[wj_junguozhi|E](은)는 한진의 [government_bureaucratic_type|E] [government_form|E]입니다. 천자가 조정을 총괄하고, [liege|E](이)가 [wj_guanyuan|E](을)를 임명해 지방을 다스리며, 수여한 계약에 따라 주군, 군수, 사례로 나뉩니다.\n\n인물은 [influence|E], [noble_families|E], [family_estates|E], [treasury|E](을)를 사용합니다. 독립 [rulers|E](은)는 [legitimacy|E](을)를 가지며, 신하는 [merit|E](으)로 벼슬길을 올라갑니다.\n\n사인은 벽소, 효렴 천거, 무재 천거, 청담, 고과 등의 길로 출사하며, 과거는 두지 않습니다. 지방의 [title_men_at_arms|E](은)는 작위 등급에 따라 주어지며, 현급 작위는 작위 병력을 거느리지 않습니다.\n\n#F 군과 국이 나란히 행해지되 권한은 천자에게 돌아간다. 중앙의 공경은 정사를 보좌하고, 지방의 주군은 조서를 받들어 백성을 다스린다.#!"
 game_concept_merit:0 "현망"
 game_concept_meritorious:0 "현망 탁월"
 game_concept_merit_desc:0 "$game_concept_wj_mingwang_desc$"
 game_concept_wj_mingwang_desc:0 "현망은 사인의 덕행, 명성, 공업에서 비롯됩니다. 청담은 재학을 남에게 알리고, 천거는 명성을 조야에 퍼뜨리며, 재직과 고과는 일을 다스리는 능력을 검증합니다.\n\n[merit|E](이)가 높을수록 조정과 사림의 추중을 받기 쉽고, 맡을 수 있는 관직도 무거워집니다. 명성이 아무리 높아도 정식 임명을 거쳐야만 직무를 맡을 수 있습니다."
 game_concept_merit_level:0 "현망 등급"
 game_concept_merit_levels:0 "현망 등급"
 game_concept_merit_level_desc:0 "[merit_level|E](은)는 인물의 명성과 임관 상한을 가늠하는 것으로, 현재의 실직이 아닙니다. 현, 군, 주, 경, 공의 다섯 등급으로 표시됩니다.\n\n$EFFECT_LIST_BULLET$[wj_xianwang_level_xian|E] - 현 등급\n$EFFECT_LIST_BULLET$[wj_xianwang_level_jun|E] - 군 등급\n$EFFECT_LIST_BULLET$[wj_xianwang_level_zhou|E] - 주 등급\n$EFFECT_LIST_BULLET$[wj_xianwang_level_chao|E] - 경 등급\n$EFFECT_LIST_BULLET$[wj_xianwang_level_gong|E] - 공 등급\n\n현망은 임관 상한만 정할 뿐이며, 출사 자격과 관직은 따로 얻어야 합니다."
 game_concept_merit_level_impact:0 "현망 등급 영향"
 game_concept_merit_level_impact_desc:0 "현망 등급 영향은 현재 [merit_level|E](이)가 제공하는 [modifiers|E](을)를 높이거나 낮춥니다."
 MERIT_COST_LONG:0 "현망: [merit_i]$VALUE|0$"
