 game_concept_obedience_threshold_desc: "$game_concept_obedience_threshold$(은)는 [characters|E](이)가 [obedient|E] 상태로 간주되기 위해 도달해야 하는 점수입니다.\n\n이 기준치는 [overlord|E]의 [close_family|E]인지, [primary_heir|E]인지, [friendship|E] 또는 [rivalry|E] 관계인지, [traits|E], 그리고 당신의 [kurultai|E]나 [court|E]에 있는지 등 여러 요인의 영향을 받습니다. 성인에 비해 [children|E](은)는 더 쉽게 충순해집니다.\n\n[GetGovernment( 'nomad_government' ).GetName] [rulers|E](은)는 여전히 #EMP $mpo_desperate_stance_decision$#! [decision|E](으)로 모두를 충순하게 만들거나, [GetActivityType( 'activity_hunt').GetName]에서 한 인물에게 #EMP $impose_obedience_intent$#! [intent|E](을)를 사용할 수 있습니다. 충순 체계가 활성화된 모든 주군은 #EMP $mpo_demand_obedience_interaction$#! 또는 #EMP $mpo_negotiate_obedience_interaction$#! [character_interaction|E](을)를 사용할 수 있습니다."
