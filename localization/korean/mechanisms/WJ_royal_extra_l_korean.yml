 ZongWang_ShiHao.020.event_title: "태자 추시"
 ZongWang_ShiHao.020.event_desc:0 "태자의 사후 예의에 관한 의안이 책상 앞에 올라왔고, 담당 관청은 시호를 정해 주기를 청했다. '동궁'이라는 두 글자를 듣자, 당신이 먼저 떠올린 것은 아직 마치지 못한 일들이었다. 한참이 지나서야 시선을 후보 시호 글자로 옮겼다.\n\n사람은 이미 없으나, 예관은 여전히 차례대로 물어 나가야 한다. 지난날 앞날을 위해 세웠던 온갖 계획은 이제 사후의 기록에 어떻게 적을지만 남았다. 생애의 이 장이 넘어갔으니, 그 뒤에는 더 보탤 새 일이 없다.\n\n당신은 후보를 다시 한번 살폈다. 예관은 붓을 든 채 기다리며 감히 재촉하지 못했지만, 그 빈자리에는 결국 호칭 하나가 남아야 한다."
