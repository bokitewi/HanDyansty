 ZongWang_ShiHao.021.event_title: "태자 추시"
 ZongWang_ShiHao.021.event_desc:0 "태자가 어린 나이에 세상을 떠나, 동궁의 많은 안배는 펼쳐지기도 전에 사후의 일로 바뀌어 버렸다. 담당 관청은 시호 글자의 후보를 올리며 평소보다 목소리를 낮추었다. 마치 이 엄숙한 글자들마저 너무 무겁게 짓누를까 두려운 듯했다.\n\n당신은 그 짧은 생애의 기록을 바라보며, 미처 일어나지 못한 일들을 그 안에 채워 넣고 싶지 않았다. 다 자라지 못한 아이라고 해서, 먼저 원만한 공업이 있어야만 진심으로 애도받을 자격이 생기는 것은 아니다.\n\n시호는 결국 정해야 한다. 붓을 댈 때 당신이 남기고 싶은 것은, 짧았으나 분명히 존재했던 이 한 생명이지, 사람들이 그를 위해 그려 보았던 미래가 아니었다."
