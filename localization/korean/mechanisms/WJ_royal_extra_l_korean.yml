 ZongWang_ShiHao.022_t: "시호 친정"
 ZongWang_ShiHao.022_d:0 "후보는 이미 거두어졌고, 책상 위에는 붓과 먹, 그리고 빈자리 하나만 남았다. 저위와 사후 예제에 관한 해설들도 마침내 잠시 멎었다.\n\n당신은 책상 가장자리에 손을 얹은 채 한참 동안 붓을 쥐지 않았다. 생전에 그토록 많은 이들이 동궁의 앞날을 그려 보았으나, 이제는 모두 한쪽으로 물러나 당신이 이 마지막 호칭을 쓰기만을 기다리고 있다."
 ZongWang_ShiHao.022.a: "이것으로 시호를 삼는다."
 SanGong_Zongzu.002.t: "태손 책립"
 SanGong_Zongzu.002.d:0 "[Taizi.GetName](이)가 세상을 떠나 상사를 아직 치르는 중인데, 후사의 명부가 또 당신 앞에 올라왔다. 그 익숙한 호칭을 듣자 책상 가장자리를 짚은 손가락이 잠시 멈추었고, 그제야 온 사람에게 계속 읽으라고 했다.\n\n이 계통의 후손 가운데 따로 한 사람을 골라 저위를 잇게 할 것인가? 이름이 하나하나 읽히는 동안, 당신은 얼굴 하나하나를 또렷이 떠올려 보려 했다. 죽은 이가 남긴 것은 빈자리 하나지만, 그 자리에 설 사람을 그저 빈자리를 메우는 한 획으로 여겨서는 안 된다.\n\n당신은 명부를 손 곁에 둔 채 송사를 지으라고 재촉하지 않았다. 당하에서 기다리는 것은 이름 하나뿐이지만, 당신이 떠올린 것은 그 사람이 이제 다시는 돌아갈 수 없을 평범한 나날이었다."
 SanGong_Zongzu.002.a: "태손으로 세운다"
 SanGong_Zongzu.002.b: "태손을 세우지 않고 다른 저군을 고른다"
