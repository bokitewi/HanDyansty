l_korean:
 WJ_harem_guiren:0 "귀인"
 WJ_harem_guiren_desc:0 "이 인물은 귀인의 반열에 올라 금인자수를 받았으며, 후궁에서 황후 다음가는 자리에 있습니다."
 WJ_harem_meiren:0 "미인"
 WJ_harem_gongren:0 "궁인"
 WJ_harem_cainv:0 "채녀"
 WJ_harem_unranked_desc:0 "이 인물은 액정의 궁적에 이름이 올라 있으나 아직 작질이 없어, 때마다 하사품을 받을 뿐입니다."
 SanGong_CeliHuanghou_interaction:0 "황후 책립"
 WJ_harem_crown_desc:0 "이 사람을 황후로 책립하여 중궁의 자리를 바로 세웁니다."
 SanGong_divorce_character_interaction:0 "황후 폐출"
 WJ_harem_depose_desc:0 "황후를 폐하고 인연을 끊습니다."
 WJ_harem_rank_interaction:0 "위분 흠정"
 WJ_harem_rank_title:0 "내궁 위호 흠정"
 WJ_harem_rank_desc:0 "[recipient.GetFirstNameNoTooltip]의 이름이 액정 명부에 적혀 있으나, 그 옆의 위호 칸은 아직 비어 있다. 시자는 몇 가지 칭호를 읊다가 멈추었다. 한 글자라도 더 말하면 그것이 곧 당신의 뜻으로 여겨질까 두려운 듯했다.\n\n당신은 그 이름을 다시 한번 바라보았다. 귀인, 미인, 궁인, 채녀. 글자 수는 별 차이가 없으나, 훗날 궁중 사람들의 입에 오를 때의 무게는 저마다 다를 것이다. 오늘 정해 버린다면 그 소식은 정식 문서보다도 빨리 퍼지리라.\n\n붓은 이미 준비되었고, 문밖에서 답을 기다리는 이도 오래 서 있었다."
 WJ_harem.003.a:0 "귀인으로 책봉한다."
 WJ_harem.003.b:0 "미인으로 봉한다."
 WJ_harem.003.c:0 "궁인으로 올린다."
 WJ_harem.003.d:0 "채녀의 반열에 둔다."
 WJ_harem_rank_notice:0 "내궁 위호 결정"
 WJ_harem_rank_notice_desc:0 "이제부터 궁중에서는 [recipient.Custom('WJ_GetUIName')](이)라 부르게 되었습니다."
 QianSan_chuGong_interaction:0 "출궁시킴"
 WJ_harem_crown_title:0 "황후 책립 조서"
 WJ_harem_crown_notice:0 "책문의 선포가 끝나자 [huanghou.Custom('WJ_GetUIName')](이)가 중궁의 자리에 올랐다. 시자가 새로 정해진 칭호를 읊는 소리는 평소보다 조금 느렸고, 곁에 있던 이들도 훗날 잘못 부르지 않으려 귀를 기울였다.\n\n당신은 책문을 한 번 훑어보고 책상 가장자리에 내려놓았다. 위호 하나가 정해지면 궁중의 수많은 자잘한 일들의 경중도 따라서 바뀐다. 누구에게 먼저 아뢰는지, 어디에서 알현을 기다리는지, 누구의 말 한마디가 거듭 곱씹을 만한지, 앞으로 모두 사람들의 입에 오르내릴 것이다.\n\n의례는 마무리되었으니 책문은 보관해도 좋다. 다만 궁문 안에서 아직 입 밖에 나오지 않은 말들은 아마 오늘에야 비로소 시작되었을 것이다."
 WJ_harem_depose_title:0 "황후 폐위 조서"
 WJ_harem_depose_notice:0 "[huanghou.GetFirstNameNoTooltip](을)를 폐한다는 조서가 이미 내려졌다. 시자가 새로 고친 명부를 가져와 읽다가, 예전의 위호에 이르러 잠시 멈칫한 뒤에야 고쳐 정한 호칭으로 바꾸어 읽었다.\n\n당신은 그 고친 자국을 보고서야 이 조서가 이미 궁 안으로 전해졌음을 실감했다. 앞으로의 알현과 보고, 예법은 모두 그에 맞추어 바꾸어야 한다. 남몰래 한숨 돌리는 이도 있겠지만, 원망을 끝까지 가슴속에 묻어 두지 않을 이도 있으리라.\n\n처분은 정해졌으나 궁중의 일은 여전히 평소처럼 돌아가야 한다. 문밖의 사람들은 여전히 새 분부를 기다리고 있었다."
 WJ_harem_ack:0 "담당자는 시행하라"
 SanGong_ShiQin:0 "후궁 소행"
 WJ_harem_intimacy_title:0 "내궁 기거"
 WJ_harem_intimacy_desc:0 "당신은 [ShiQie.Custom('WJ_GetUIName')](와)과 마주 앉았다. 문밖에서 답을 재촉하던 소리도 마침내 멀어졌다. 등잔 심지가 가볍게 타닥거리자, 그제야 낮에 미처 다 하지 못한 말이 아직 마음속에 남아 있음을 깨달았다.\n\n당신은 어깨의 힘을 풀고 곁의 사람을 바라보았다. 궁중에서 황사를 고대하는 눈은 언제나 적지 않다. 오늘 밤 자연의 이치에 맡길 것인지, 잠시 그런 생각을 접어 둘 것인지는 오직 당신의 마음에 달렸다.\n\n등불 그림자가 휘장 가에서 흔들렸다. 당신은 손을 뻗어 책상 위의 작은 잔을 바로 놓고는, 한참 동안 사람을 부르지 않았다."
 WJ_harem_allow_birth:0 "자연에 맡겨 종사를 잇는다."
 WJ_harem_prevent_birth:0 "곁에 있기만을 바랄 뿐, 아직 후사는 구하지 않는다."
 SanGong_XuanXiu_decisions:0 "궁녀 선발"
 WJ_harem_selection_decision_desc:0 "후궁이 오래 비어 있으니, 황사를 이을 책임이 액정에 달려 있습니다. 한나라의 고사에 따라 중대부와 액정승, 관상가를 보내 민간의 여인들을 살피고, 용모가 단정하고 아름다우며 관상법에 맞는 이를 골라 후궁으로 데려오게 합니다."
 WJ_harem_selection_confirm:0 "담당 관청에 선발을 명함"
 WJ_harem_selection_title:0 "선발 명부 도착"
 WJ_harem_selection_desc:0 "시자는 마지막 이름까지 부르고서야 비로소 멈추었다. 하나하나 들으면 기억할 수 있으리라 여겼건만, 그가 분부를 묻자 머릿속에서는 벌써 여러 이름이 한데 뒤섞여 있었다.\n\n새로 뽑힌 채녀들은 모두 입궁했고, 본적과 내력도 저마다 적혀 있다. 당신은 명부를 두고 가게 하며 나중에 다시 보겠다고 했다. 그 자리에서 서둘러 거취와 위호를 정할 필요는 없다. 궁중에서는 말이 가장 빨리 퍼지니, 무심코 던진 칭찬 한마디도 사람들이 두고두고 헤아릴 것이다.\n\n시자가 물러나자 당신은 다시 첫 장으로 넘겼다. 방금 이름을 부를 때 저마다 잠시 머뭇거리던 순간은, 이제 몇 줄의 글자로만 남아 있었다."
 SanGong_FaSongXiuNV_decisions:0 "선발되지 않은 궁인 귀가"
 WJ_harem_release_desc:0 "액정의 채녀들이 입궁한 지 오래되었으나, 부름을 받지 못한 이들은 깊은 궁궐에서 헛되이 나이만 먹고 있습니다. 차라리 집으로 돌려보내 혼인을 허락함이 낫겠습니다."
 WJ_harem_release_confirm:0 "귀가를 허락함"

 HouGong_ShiHao.001_t: "대행 [HuangHou.Custom('WJ_HaremRank')] 붕서"
 HouGong_ShiHao.001_d_start:0 "[HuangHou.Custom('WJ_HaremRank')]의 부고가 궁중에 전해지자, 평소 익숙하던 오가는 소리들이 문득 모두 잠잠해졌다.\n\n"
 HouGong_ShiHao.001_d1:0 "당신은 담당 관리가 아뢰는 상례 절차를 다 듣고서, 아직 처리할 일이 무엇인지 다시 한번 물었다. 황후의 자리는 궁중의 예법 질서와도, 오래전부터 당연하게 여겨 온 수많은 일상과도 얽혀 있다. 이제 그 사람이 없으니, 예전에는 물을 필요도 없던 자잘한 일들에도 새로 답할 사람이 있어야 했다.\n\n슬픔 때문에 정무를 모두 멈출 수는 없지만, 그렇다고 관례대로 비용을 적은 장부 한 권만 남겨서도 안 될 일이다. 당신은 담당 관청에 예법대로 처리하되, 장례에 필요한 것과 사후의 시호 논의를 함께 진행하라고 명했다. 고인을 위해 해 줄 수 있는 일은 이제 많지 않으니, 이 마지막 몇 가지만큼은 소홀히 하고 싶지 않았다."
 HouGong_ShiHao.001_d2:0 "담당 관리가 상례 절차를 아뢰는 동안, 당신은 몇 번이고 말소리가 들려오는 쪽을 바라보았다. 마치 태후가 여느 때처럼 사람을 보내 자신의 뜻을 전해 올 것만 같았다. 잠시 기다리고서야 당신은 깨달았다. 이제 그 어떤 안배에도 그녀의 대답은 다시 돌아오지 않으리라는 것을.\n\n궁중의 존위는 예법에 따라 전책에 기록되어야 하고, 사후의 시호도 엄숙히 의논하여 정해야 한다. 그러나 지금 가장 먼저 처리할 것은, 슬프다고 해서 맡을 사람 없이 내버려 둘 수 없는 상사였다.\n\n당신은 필요한 비용을 적게 하고 차례대로 처리하게 했다. 조정에는 조정의 예법 질서가 있지만, 한 어른이 남긴 빈자리는 그것으로 채워지지 않을 것이다."
 HouGong_ShiHao.001_d3:0 "태황태후의 부음이 궁중에 이르자, 오래 시중들던 이들은 한동안 무엇부터 해야 할지 알지 못했다. 그녀가 이 궁궐에서 보낸 세월은 당신보다도 길었고, 어떤 옛 관례의 유래는 그녀 곁의 늙은 시종들만이 기억하고 있었다.\n\n당신은 담당 관청에 예법대로 안배를 밝히게 하여, 해야 할 일부터 먼저 정해 두었다. 슬픔이 여기저기서 서로 눈치만 보는 일로 번지지 않게 하려는 것이었다. 사후의 시호는 따로 의논해야 하지만, 눈앞의 상례와 비용은 더는 지체할 수 없었다.\n\n문서를 다 읽고 나자 전각 안은 다시 고요해졌다. 존위는 전책에 적어 넣을 수 있으나, 오래도록 곁에 있던 사람이 다시 돌아오지 않는다는 사실에 익숙해지려면 오랜 시간이 걸릴 것이다."
 HouGong_ShiHao.001.a:0 "예법대로 장례를 치르고 금화 백 냥을 마련한 뒤, 존시를 다시 의논한다."
 HouGong_ShiHao.011_t: "시호 의정"
 HouGong_ShiHao.011_d_start:0 "상례의 안배가 끝나자 담당 관청은 이어서 시호 의안을 올리고, 당신이 고인의 사후 호칭을 골라 주기를 기다렸다.\n\n"
 HouGong_ShiHao.011_d1:0 "황후라는 호칭은 지난날 늘 귓가에 들리던 것이었는데, 이제 예관이 묻는 것은 그 뒤에 어떤 글자를 덧붙일 것인가였다. 당신은 후보 시호 글자들을 받아 한참 바라보다가, 앞쪽의 생애를 적은 장으로 다시 넘겼다.\n\n어떤 글자는 너무 무겁고, 어떤 글자는 뜻을 다 담지 못하는 듯했다. 당하에서는 이미 많은 이유가 오갔으나, 당신은 예문에 적히지 않은 몇 가지 소소한 일을 떠올리고는 한동안 대답하지 않았다.\n\n예관의 붓은 여전히 기다리고 있다. 앞으로 다른 이들은 이 글자로 그녀를 부르겠지만, 정작 그녀 자신은 다시는 들을 수 없을 것이다."
 HouGong_ShiHao.011_d2:0 "태후의 존위는 이미 기록되었고, 예관은 이어서 사후의 시호를 물었다. 당신은 후보들을 하나하나 살펴보았다. 익숙한 몇 글자가 입가까지 맴돌았으나 곧바로 말이 되어 나오지는 않았다.\n\n지난날 결정하기 어려운 일이 있으면 그녀의 뜻을 들어 볼 수 있었다. 오늘 이 글자들은 모두 그녀에 관한 것인데, 전각 안에는 그녀를 대신해 답해 줄 이가 아무도 없다. 예관은 당신이 잘 듣지 못한 줄 알고 다시 읽으려 했으나, 당신은 손을 들어 잠시 기다리게 했다.\n\n당신은 문서를 평평하게 내려놓았다. 결국 남게 될 그 호칭을, 한 번 더 진지하게 생각해 보고 싶었다."
 HouGong_ShiHao.011_d3:0 "태황태후의 시호 의안이 책상 앞에 놓였다. 담당 관청은 이제 의물의 많고 적음을 묻지 않고, 앞으로 그녀를 어떻게 부를지만을 물었다. 평소 부르는 데 익숙해진 존호에도 갑자기 당신이 정해야 할 부분이 생긴 것이다.\n\n당신은 후보 글자들을 바라보며, 궁중의 늙은 시종들이 그녀를 이야기할 때의 표정을 떠올렸다. 어떤 옛일은 당신조차 직접 겪지 못해, 그들이 천천히 들려주는 것을 들을 수밖에 없었다. 그 이야기를 듣고 나니 눈앞의 이 몇 글자를 더욱 함부로 고를 수 없었다.\n\n예관이 기다리고 있고, 명목도 모두 갖추어졌다. 이 사후의 예의를 위해, 후세에 전할 수 있는 호칭 하나를 정해야만 한다."
