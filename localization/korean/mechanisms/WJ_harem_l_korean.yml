 HouGong_ShiHao.012_t: "시호 책봉"
 HouGong_ShiHao.012_d:0 "후보 글자들은 잠시 밀어 두고, 시호는 당신이 직접 정하기로 했다. 예관은 붓을 가지런히 내려놓고 반걸음 물러섰다. 그칠 줄 모르던 설명도 함께 멎었다.\n\n당신은 책상 앞의 빈 종이를 바라보다가, 문득 지난날 누군가 그녀를 부르던 목소리를 떠올렸다. 사후의 시호는 단 한 글자. 앞으로 사람들이 그녀를 이야기할 때면 오늘 당신이 쓴 이 한 글자를 덧붙일 것이다. 그러나 어떻게 쓰든, 그녀는 다시는 대답하지 않으리라."
 HouGong_ShiHao.012.a: "시호를 정했으니, 담당자는 시행하라."
 WJ_harem_selection_origin_desc:0 "명부가 아직 나가기 전, 시자가 먼저 출신을 여쭈러 왔다. 양가의 여인을 뽑을 것인지, 아니면 명문가에서 먼저 고를 것인지. 그의 말이 끝나자마자, 당신은 그의 소맷자락 옆에 이미 붓이 준비되어 있는 것을 보았다.\n\n이 분부가 내려지면 기뻐하는 이도 있고, 속을 헤아리는 이도 있을 것이다. 아직 빈 명부를 바라보며, 당신은 훗날 궁중의 성씨 하나하나 뒤에 문을 두드려 소식을 묻는 이들이 몇씩 더 생겨날지도 모른다고 생각했다. 명문가의 딸이 모자라면 양가의 여인으로 채워야 하겠지만, 거취와 위호는 아직 나중의 일이다.\n\n시자는 더 말하지 않고 당신이 입을 열기만을 기다렸다."
 WJ_harem_selection_commoner: "양가의 딸을 고른다."
 WJ_harem_selection_noble: "명문가의 딸을 고른다."
