 # 新增通用事件 1009–1012（主人）
 WJ_qingyi_all_honest_attendees:0 "자리에 있는 모든 정직한 손님"

 WJ_qingyi.1009.t:0 "당고의 옛일"
 WJ_qingyi.1009.desc:0 "의논이 한창 무르익을 무렵, [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')](이)가 문득 당고의 옛일을 꺼냈다. 지난날 이응, 범방 등이 청의 때문에 죄를 얻어 종신 금고에 처해졌고, 끝내 옥중에서 죽기까지 했다는 것이다.\n\n좌중이 단번에 조용해졌다. 이 일은 지금도 금기이니, 자리에 있는 이들은 모두 당신의 태도를 기다리고 있었다. 너무 곧이곧대로 말하면 들어서는 안 될 사람의 귀에 들어갈 것이고, 너무 애매하게 말하면 사람들에게 얕보일 것이다."
 WJ_qingyi.1009.a:0 "금기를 피하지 않고 그들의 원통함을 바로 말한다."
 WJ_qingyi.1009.a.success:0 "강개한 진술에 좌중이 숙연해짐"
 WJ_qingyi.1009.a.failure:0 "말이 너무 격해 스스로도 오히려 가슴이 철렁함"
 WJ_qingyi.1009.b:0 "옛일을 빌려 지금을 빗대되, 넌지시 말하고 그친다."
 WJ_qingyi.1009.b.success:0 "화제를 슬쩍 돌려 흔적을 남기지 않음"
 WJ_qingyi.1009.b.failure:0 "딴청을 피우다가 속내를 들킴"
 WJ_qingyi.1009.c:0 "“이 자리에서는 조정의 일을 논하지 않소.”"
 WJ_qingyi_log_1009_a_success:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 당고의 원통함을 바로 논하자, [TARGET_CHARACTER.Custom('WJ_GetUIName')](이)가 이에 탄복했음"
 WJ_qingyi_log_1009_a_success_title:0 "$WJ_qingyi.1009.t$"
 WJ_qingyi_log_1009_a_failure:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 당고를 논하며 지나치게 격해져, 나중에 꽤나 불안해했음"
 WJ_qingyi_log_1009_a_failure_title:0 "$WJ_qingyi.1009.t$"
 WJ_qingyi_log_1009_b_success:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 옛일을 빌려 지금을 빗대며 당고의 논의를 가볍게 넘겼음"
 WJ_qingyi_log_1009_b_success_title:0 "$WJ_qingyi.1009.t$"
 WJ_qingyi_log_1009_b_failure:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 당고에 관한 물음을 회피하여 [TARGET_CHARACTER.Custom('WJ_GetUIName')]에게 얕보였음"
 WJ_qingyi_log_1009_b_failure_title:0 "$WJ_qingyi.1009.t$"
 WJ_qingyi_log_1009_c:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 이 자리에서 조정의 일을 논하지 않도록 명했음"
 WJ_qingyi_log_1009_c_title:0 "$WJ_qingyi.1009.t$"

 WJ_qingyi.1010.t:0 "경전을 들고 묻다"
 WJ_qingyi.1010.desc:0 "젊은 [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')](이)가 경서 한 권을 받쳐 들고 당신의 자리 앞으로 와서, 공손히 예를 올린 뒤 그중 한 대목을 풀이해 달라고 청했다.\n\n이 대목은 예로부터 해석이 분분했고, 곁에는 벌써 들으려고 다가온 이들이 있다. 잘 풀이하면 이 후생은 평생 기억할 것이고, 잘못 풀이하면 망신당하는 것은 당신 한 사람만이 아닐 것이다."
 WJ_qingyi.1010.a:0 "한 글자씩 풀이한다."
 WJ_qingyi.1010.a.success:0 "조목조목 분석하니 후생이 감복함"
 WJ_qingyi.1010.a.failure:0 "인용에 착오가 있어 남에게 지적받음"
 WJ_qingyi.1010.b:0 "되물어 일깨워 스스로 깨닫게 한다."
 WJ_qingyi.1010.c:0 "자리에 있는 명사에게 대신 풀이해 달라고 청한다."
 WJ_qingyi_log_1010_a_success:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 [TARGET_CHARACTER.Custom('WJ_GetUIName')]에게 경전의 뜻을 풀이해 주어, 후자가 크게 깨달음을 얻었음"
 WJ_qingyi_log_1010_a_success_title:0 "$WJ_qingyi.1010.t$"
 WJ_qingyi_log_1010_a_failure:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 경전을 강론하다 인용에 착오가 있어 그 자리에서 지적받았음"
 WJ_qingyi_log_1010_a_failure_title:0 "$WJ_qingyi.1010.t$"
 WJ_qingyi_log_1010_b:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 되물음으로 [TARGET_CHARACTER.Custom('WJ_GetUIName')](을)를 일깨워 스스로 경전의 뜻을 깨닫게 했음"
 WJ_qingyi_log_1010_b_title:0 "$WJ_qingyi.1010.t$"
 WJ_qingyi_log_1010_c:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 [TARGET_CHARACTER.Custom('WJ_GetUIName')]에게 대신 경전을 풀이해 달라고 청하여, 그 명사의 이름이 더욱 높아졌음"
 WJ_qingyi_log_1010_c_title:0 "$WJ_qingyi.1010.t$"

 WJ_qingyi.1011.t:0 "청탁의 분별"
 WJ_qingyi.1011.desc:0 "[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')](이)가 책상을 치며 일어나 말했다. 지금 조정에는 맑은 이와 탁한 이가 뒤섞여, 환관의 자제들이 주군을 차지하고 청류는 도리어 밖으로 밀려났는데, 좌중의 여러분은 어찌 아직도 현리만 논하고 있느냐는 것이다.\n\n몇몇 손님이 맞장구를 쳤고, 눈살을 찌푸리는 이도 있었다. 청탁의 구분은 사림의 대의이지만, 천하 사람을 일률적으로 두 부류로 나누는 것이 꼭 공평하다고는 할 수 없다."
 WJ_qingyi.1011.a:0 "탁한 것을 물리치고 맑은 것을 드높일 때가 바로 지금이다."
 WJ_qingyi.1011.b:0 "맑은 이와 탁한 이는 저마다 있으니, 가문으로 사람을 정해서는 안 된다."
 WJ_qingyi.1011.b.success:0 "공정한 논지로 모두의 칭찬을 받음"
 WJ_qingyi.1011.b.failure:0 "향원이라는 비난을 받음"
 WJ_qingyi.1011.c:0 "웃어넘긴다."
 WJ_qingyi_log_1011_a:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 탁한 것을 물리치고 맑은 것을 드높이자고 주창하니, 자리의 청류들이 깊이 수긍했음"
 WJ_qingyi_log_1011_a_title:0 "$WJ_qingyi.1011.t$"
 WJ_qingyi_log_1011_b_success:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 청탁을 공평하게 논하니, [TARGET_CHARACTER.Custom('WJ_GetUIName')]조차 반박하지 못했음"
 WJ_qingyi_log_1011_b_success_title:0 "$WJ_qingyi.1011.t$"
 WJ_qingyi_log_1011_b_failure:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 [TARGET_CHARACTER.Custom('WJ_GetUIName')]에게 향원이라는 비난을 받았음"
 WJ_qingyi_log_1011_b_failure_title:0 "$WJ_qingyi.1011.t$"
 WJ_qingyi_log_1011_c:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 청탁의 논쟁을 웃어넘겼음"
 WJ_qingyi_log_1011_c_title:0 "$WJ_qingyi.1011.t$"

 WJ_qingyi.1012.t:0 "아가와 투호"
 WJ_qingyi.1012.desc:0 "연일 이어진 논의 끝에 모두 조금씩 지쳐 있었다. [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')](이)가 투호를 벌이자고 제안했고, 누군가는 거문고를 가져왔다.\n\n청의라고 늘 칼을 겨누듯 팽팽할 필요는 없다. 주인인 당신이 어떻게 어울리는지, 손님들은 모두 지켜보고 있었다."
 WJ_qingyi.1012.a:0 "직접 화살을 들고 투호를 한다."
 WJ_qingyi.1012.a.success:0 "연달아 몇 발을 넣어 좌중이 갈채함"
 WJ_qingyi.1012.a.failure:0 "거듭 던져도 들어가지 않아 모두의 웃음을 삼"
 WJ_qingyi.1012.b:0 "장단을 맞추며 노래하여 모두와 함께 즐긴다."
 WJ_qingyi.1012.c:0 "조용히 앉아 지켜본다."
 WJ_qingyi_log_1012_a_success:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 투호에서 연달아 맞혀 [TARGET_CHARACTER.Custom('WJ_GetUIName')](을)를 눌렀음"
 WJ_qingyi_log_1012_a_success_title:0 "$WJ_qingyi.1012.t$"
 WJ_qingyi_log_1012_a_failure:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 투호에서 거듭 빗나가, [TARGET_CHARACTER.Custom('WJ_GetUIName')](와)과 마주 보며 크게 웃었음"
 WJ_qingyi_log_1012_a_failure_title:0 "$WJ_qingyi.1012.t$"
 WJ_qingyi_log_1012_b:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 장단을 맞추며 노래하니, 손님과 주인이 모두 즐거워했음"
 WJ_qingyi_log_1012_b_title:0 "$WJ_qingyi.1012.t$"
 WJ_qingyi_log_1012_c:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 조용히 앉아 지켜보며 주인의 분수를 잃지 않았음"
 WJ_qingyi_log_1012_c_title:0 "$WJ_qingyi.1012.t$"

 # 新增通用事件 2009–2012（宾客）
 WJ_qingyi.2009.t:0 "명사 알현"
 WJ_qingyi.2009.desc:0 "좌중에서 학문이 가장 깊은 이는 [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]이다. 자리가 파한 뒤에도 그의 곁에는 늘 한 무리의 사람들이 둘러싸고 있었다. 가르침을 청하는 이도 있고, 그저 인상을 남기고 싶은 이도 있었다.\n\n당신도 다가가고 싶었지만, 어떤 태도로 나설지 아직 정하지 못했다."
 WJ_qingyi.2009.a:0 "제자의 예를 갖추어 가르침을 청한다."
 WJ_qingyi.2009.a.success:0 "그의 가르침을 얻어 단번에 깨달음"
 WJ_qingyi.2009.a.failure:0 "물음이 얕아 몇 마디 의례적인 말만 들음"
 WJ_qingyi.2009.b:0 "내 견해로 그와 문답을 나눈다."
 WJ_qingyi.2009.b.success:0 "몇 차례 주고받으니 상대가 다시 보게 됨"
 WJ_qingyi.2009.b.failure:0 "논쟁에서 이기지 못해 웃음거리만 남김"
 WJ_qingyi.2009.c:0 "멀리서 듣는 것으로 족하다."
 WJ_qingyi_log_2009_a_success:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 [TARGET_CHARACTER.Custom('WJ_GetUIName')]에게 경전을 들고 가르침을 청해 얻은 바가 많았음"
 WJ_qingyi_log_2009_a_success_title:0 "$WJ_qingyi.2009.t$"
 WJ_qingyi_log_2009_a_failure:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 명사에게 가르침을 청했으나 얻은 것이 적었음"
 WJ_qingyi_log_2009_a_failure_title:0 "$WJ_qingyi.2009.t$"
 WJ_qingyi_log_2009_b_success:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 [TARGET_CHARACTER.Custom('WJ_GetUIName')](와)과 논쟁을 주고받으며 밀리지 않았음"
 WJ_qingyi_log_2009_b_success_title:0 "$WJ_qingyi.2009.t$"
 WJ_qingyi_log_2009_b_failure:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 [TARGET_CHARACTER.Custom('WJ_GetUIName')](와)과의 논쟁에서 졌음"
 WJ_qingyi_log_2009_b_failure_title:0 "$WJ_qingyi.2009.t$"

 WJ_qingyi.2010.t:0 "청담 야화"
 WJ_qingyi.2010.desc:0 "밤이 깊어 손님들 대부분은 이미 방으로 돌아갔고, 회랑 아래에는 당신과 [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]만 남았다. 달빛이 고왔고, 낮의 논쟁은 이제 아득히 멀게 느껴졌다.\n\n상대가 차 두 잔을 따르며 요즘 어떻게 지내느냐고 물었다."
 WJ_qingyi.2010.a:0 "속마음을 털어놓는다."
 WJ_qingyi.2010.b:0 "현리만 이야기하고 사사로운 일에는 미치지 않는다."
 WJ_qingyi.2010.c:0 "핑계를 대고 먼저 잠자리에 든다."
 WJ_qingyi_log_2010_a:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 [TARGET_CHARACTER.Custom('WJ_GetUIName')](와)과 달빛 아래 밤 이야기를 나누며 속마음을 털어놓았음"
 WJ_qingyi_log_2010_a_title:0 "$WJ_qingyi.2010.t$"
 WJ_qingyi_log_2010_b:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 밤새 현리를 이야기하며 마음이 점차 평온해졌음"
 WJ_qingyi_log_2010_b_title:0 "$WJ_qingyi.2010.t$"

 WJ_qingyi.2011.t:0 "당대 인물 논평"
 WJ_qingyi.2011.desc:0 "주인 [host.Custom('WJ_GetLinkedUIName')](이)가 문득 당신을 돌아보며 [wj_qingyi_subject.Custom('WJ_GetLinkedUIName')](을)를 어떻게 보느냐고 물었다.\n\n좌중이 조용해졌다. 인물을 품평하는 것은 청의에서 흔한 일이지만, 그 사람은 어디까지나 주인의 다스림 아래 있는 사람이니 당신의 말은 언젠가 그 본인의 귀에 들어갈 것이다."
 WJ_qingyi.2011.a:0 "그의 단점을 솔직히 말한다."
 WJ_qingyi.2011.b:0 "그의 장점을 드높인다."
 WJ_qingyi.2011.c:0 "한마디도 하지 않는다."
 WJ_qingyi.2011.c.success:0 "침묵을 평으로 삼으니 모두가 그 뜻을 알아챔"
 WJ_qingyi.2011.c.failure:0 "너무 오래 침묵하여 겁먹은 듯 보임"
 WJ_qingyi_log_2011_a:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 사람들 앞에서 [TARGET_CHARACTER.Custom('WJ_GetUIName')]의 단점을 솔직히 말했음"
 WJ_qingyi_log_2011_a_title:0 "$WJ_qingyi.2011.t$"
 WJ_qingyi_log_2011_b:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 [TARGET_CHARACTER.Custom('WJ_GetUIName')]의 명성을 높여 주었음"
 WJ_qingyi_log_2011_b_title:0 "$WJ_qingyi.2011.t$"
 WJ_qingyi_log_2011_c_success:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 침묵으로 평을 대신하니, 모두가 그 뜻을 알아챘음"
 WJ_qingyi_log_2011_c_success_title:0 "$WJ_qingyi.2011.t$"
 WJ_qingyi_log_2011_c_failure:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 당대 인물에 대한 물음을 받고 한참 대답하지 못했음"
 WJ_qingyi_log_2011_c_failure_title:0 "$WJ_qingyi.2011.t$"

 WJ_qingyi.2012.t:0 "자리다툼"
 WJ_qingyi.2012.desc:0 "자리에 들 때, [wj_qingyi_partner.Custom('WJ_GetLinkedUIName')](이)가 곧장 당신보다 앞자리에 앉더니, 문벌과 관질로 따지면 마땅히 그래야 한다고 말했다.\n\n주위 사람들이 모두 두 사람을 지켜보았다. 자리의 차례는 작은 일이지만, 사인들의 눈에는 체면이 걸린 일이다."
