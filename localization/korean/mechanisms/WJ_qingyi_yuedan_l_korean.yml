 # 3001 论时事·提名
 WJ_qingyi.3001.t:0 "월단평: 시사를 논하다"
 WJ_qingyi.3001.desc.host:0 "사람들은 한동안 시국을 논했다. 주군의 도적 이야기에서 조정의 인사 이야기까지 이어지다가, 화제가 점차 인물에게로 모였다. 당신은 주미를 내려놓고 좌중에 일렀다. 오늘은 청담만 할 것이 아니라, 여남의 고사를 본받아 당대의 인물을 품평하고 한 사람을 제일로 추대하겠노라고.\n\n당신은 미리 정해 둔 명단을 알리고, 이어질 논의에서 여러분이 세세히 품평해 주기를 청했다."
 WJ_qingyi.3001.desc.guest:0 "사람들이 한동안 시국을 논하는데, 주인 [host.Custom('WJ_GetLinkedUIName')](이)가 문득 주미를 내려놓더니, 오늘은 여남의 고사를 본받아 당대의 인물을 품평하고 좌중이 한 사람을 제일로 추대하자고 했다.\n\n좌석은 처음에는 조용했으나, 곧 의논이 분분해졌다. 주인이 미리 정해 둔 명단을 알렸다."
 WJ_qingyi.3001.desc.end:0 "\n\n명단이 나오자 고개를 끄덕이는 이도 있었고, 냉소하는 이도 있었다. 앞으로 며칠 동안 명단에 오른 이들의 출신과 행적, 득실이 거듭 입에 오르내릴 것이다."
 WJ_qingyi.3001.a:0 "여러분이 어떻게 품평하는지 들어 봅시다."

 # 3101 投票
 WJ_qingyi.3101.t:0 "월단평: 투표"
 WJ_qingyi.3101.desc:0 "논의는 충분히 이루어졌으니, 이제 자신의 태도를 밝힐 때다. 시자가 각 자리 앞에 죽간을 놓고, 손님마다 자신이 추대할 사람을 적어 달라고 청했다.\n\n이 한 표로 판가름이 나지는 않겠지만, 적어 낸 이름은 결국 사람들에게 기억될 것이다."
 WJ_qingyi.3101.c1:0 "[wj_yd_c1.Custom('WJ_GetUIName')](을)를 추대"
 WJ_qingyi.3101.c2:0 "[wj_yd_c2.Custom('WJ_GetUIName')](을)를 추대"
 WJ_qingyi.3101.c3:0 "[wj_yd_c3.Custom('WJ_GetUIName')](을)를 추대"
 WJ_qingyi.3101.c4:0 "[wj_yd_c4.Custom('WJ_GetUIName')](을)를 추대"
 WJ_qingyi.3101.c5:0 "[wj_yd_c5.Custom('WJ_GetUIName')](을)를 추대"
 WJ_qingyi.3101.c6:0 "[wj_yd_c6.Custom('WJ_GetUIName')](을)를 추대"
 WJ_qingyi.3101.c7:0 "[wj_yd_c7.Custom('WJ_GetUIName')](을)를 추대"
 WJ_qingyi.3101.c8:0 "[wj_yd_c8.Custom('WJ_GetUIName')](을)를 추대"
 WJ_qingyi.3101.vote_tt:0 "당신은 이 사람의 이름을 죽간에 적습니다. 이후에도 그를 위해 한바탕 뛰어다닐 수 있을지 모릅니다."
 WJ_qingyi.3101.abstain:0 "평소의 호오대로 붓을 든다."
 WJ_qingyi.3101.abstain_tt:0 "당신은 더 생각하지 않고, 때가 되면 평소의 호오와 교분에 따라 이름 하나를 적습니다."

 # 3102 拉票
 WJ_qingyi.3102.t:0 "월단평: 표 모으기"
 WJ_qingyi.3102.desc:0 "죽간은 이미 제출되었고, 이번 논의가 끝나야 셈하게 된다. 당신이 추대한 [wj_yd_target.Custom('WJ_GetLinkedUIName')](이)가 이길 수 있을지는, 어쩌면 당신이 이제부터 어떻게 하느냐에 달렸을지도 모른다."
 WJ_qingyi.3102.a:0 "내 명성을 걸고 그를 보증하겠다."
 WJ_qingyi.3102.b:0 "권문을 찾아다니며 그를 위해 유세한다."
 WJ_qingyi.3102.c:0 "그 자리에서 논쟁을 벌여 그의 기세를 높인다."
 WJ_qingyi.3102.c.success:0 "날카로운 언변에 좌중이 감동함"
 WJ_qingyi.3102.c.failure:0 "말이 많아 실수가 생겨 도리어 힐난을 받음"
 WJ_qingyi.3102.d:0 "더 말할 필요 없다."
 WJ_qingyi.3102.plus2_tt:0 "#P 좌중의 적지 않은 이들이 이 때문에 [wj_yd_target.Custom('WJ_GetUIName')](을)를 추대하는 쪽으로 돌아섰습니다#!"
 WJ_qingyi.3102.plus3_tt:0 "#P 좌중이 모두 감동하여 많은 이가 [wj_yd_target.Custom('WJ_GetUIName')](을)를 추대하는 쪽으로 돌아섰습니다#!"
 WJ_qingyi.3102.minus1_tt:0 "#N 오히려 이 때문에 [wj_yd_target.Custom('WJ_GetUIName')](을)를 추대하지 않으려는 이가 생겼습니다#!"

 # 3201 品人物
 WJ_qingyi.3201.t:0 "월단평: 인물 품평"
 WJ_qingyi.3201.desc:0 "요 며칠의 논의는 모두 명단에 오른 이름들을 둘러싸고 이루어졌다. 어떤 이는 그들의 옛일을 끌어오고, 어떤 이는 근황을 전했다. 포폄이 오가는 사이에 각자의 품평이 점차 모양을 갖추었다."
 WJ_qingyi.3201.desc.end:0 "\n\n미리 약속한 대로, 이번 논의가 끝나면 각자 한 표씩 던져 가장 많은 표를 얻은 네 사람이 최종 평가에 오른다."
 WJ_qingyi.3201.a:0 "내 마음속에는 이미 정한 사람이 있다."

 # 3301 定评
 WJ_qingyi.3301.t:0 "월단평: 최종 평가"
 WJ_qingyi.3301.desc:0 "명단에는 이제 네 사람만 남았다. 좌중의 분위기는 며칠 전보다 더 팽팽했다. 모두 알고 있었다. 다음 셈이 끝나면 제일의 명호가 온 주군에 퍼지리라는 것을. 마지막 품평은 다음과 같았다."
 WJ_qingyi.3301.desc.end:0 "\n\n이번에는 단 한 사람만 추대할 수 있다."
 WJ_qingyi.3301.a:0 "붓을 들어 평을 정한다."

 # 3401 揭晓
 WJ_qingyi.3401.t:0 "월단평: 한마디로 품평을 정하다"
 WJ_qingyi.3401.desc:0 "죽간을 다 셈하니, 좌중은 [wj_yd_winner.Custom('WJ_GetLinkedUIName')](을)를 이번 월단평의 제일로 공인했다. 평어가 모두 앞에서 낭독되었다.\n\n“[wj_yd_winner.Custom('WJ_qingyi_yd_comment')]”\n\n이 평어는 곧 베껴져 퍼져 나갈 것이다. 이후 각 주군에서 당대의 인물을 논할 때면, 누구나 먼저 이 이름을 꺼내게 되리라."
 WJ_qingyi.3401.desc.self:0 "죽간을 다 셈하니, 좌중이 공인한 제일은 뜻밖에도 당신이었다. 평어가 모두 앞에서 낭독되었다.\n\n“[wj_yd_winner.Custom('WJ_qingyi_yd_comment')]”\n\n좌중의 시선이 모두 당신에게 쏠렸다. 이제부터 이 평어는 당신의 이름을 따라 천하에 퍼질 것이다."
 WJ_qingyi.3401.a:0 "어찌 힘쓰지 않으리오."
 WJ_qingyi.3401.b:0 "이름난 자에게 헛된 선비는 없는 법이지."

 # 3501 闻月旦（缺席）
 WJ_qingyi.3501.t:0 "월단평 소식"
 WJ_qingyi.3501.desc.winner:0 "[host.Custom('WJ_GetLinkedUIName')]의 처소에서 온 손님이 전하기를, 그곳에서 최근 월단평이 열렸는데 좌중의 현인들이 당대의 인물을 품평한 끝에 뜻밖에도 당신을 제일로 추대했다고 한다.\n\n“[wj_yd_winner.Custom('WJ_qingyi_yd_comment')]”\n\n이 평어는 이미 널리 퍼졌다고 한다. 당신은 그 자리에 없었으나, 명성이 먼저 도착한 셈이다."
 WJ_qingyi.3501.desc.finalist:0 "[host.Custom('WJ_GetLinkedUIName')]의 처소에서 온 손님이 전하기를, 그곳에서 최근 월단평이 열렸는데 당신도 최종 평가의 네 사람 안에 들었으며, 마지막에 제일은 [wj_yd_winner.Custom('WJ_GetLinkedUIName')]에게 돌아갔다고 한다.\n\n제일을 얻지는 못했으나 최종 평가에 든 것만으로도, 천하 사인들의 눈에는 하나의 명성으로 여겨진다."
 WJ_qingyi.3501.a:0 "평을 주관한 이에게 글을 보내 겸손히 사양하며 감사한다."
 WJ_qingyi.3501.b:0 "담담히 받아들인다."

 # 活动记录
 WJ_qingyi_yd_log_nominate:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 여남의 고사를 본받아 당대의 인물 여덟 명을 지명하고 월단평을 열었음"
 WJ_qingyi_yd_log_nominate_title:0 "월단평 개최"
 WJ_qingyi_yd_log_round_two:0 "인물 품평이 끝나고, 여덟 명 중 네 명이 최종 평가에 오름"
