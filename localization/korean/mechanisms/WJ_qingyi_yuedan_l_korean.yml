# 清议重制·月旦评（2026-10-08）。意图、阶段与筹备选项的键仍在 WJ_scholars_l_simp_chinese.yml。

 # 特质
 trait_hd_yuedan_mingshi:0 "명사"
 trait_hd_yuedan_mingshi_desc:0 "이 인물은 월단평에서 여러 현인에게 제일로 공인받은 적이 있습니다. 한번 품평을 받자 몸값이 열 배로 뛰었고, 천하의 사인들이 모두 그와 사귀기를 원합니다."

 # 品评类别
 WJ_qingyi_yd_class_1:0 "웅주"
 WJ_qingyi_yd_class_2:0 "간웅"
 WJ_qingyi_yd_class_3:0 "명장"
 WJ_qingyi_yd_class_4:0 "능신"
 WJ_qingyi_yd_class_5:0 "모사"
 WJ_qingyi_yd_class_6:0 "명유"

 # 品评评语（6 类 × 3 句）
 WJ_qingyi_yd_comment_1_1:0 "한 지방을 차지하였으나 뜻은 한 지방에 그치지 않는다. 기량이 넓고 커서 아랫사람들을 너그러이 품을 수 있다."
 WJ_qingyi_yd_comment_1_2:0 "남의 장점을 쓸 줄 알고, 남의 재능을 시기하지 않는다. 천하가 돌아갈 곳이 있다면 아마 이 사람일 것이다."
 WJ_qingyi_yd_comment_1_3:0 "사방을 진무하니 호령이 나는 곳마다 사민이 그림자처럼 따른다. 아깝게도 생각하는 바가 크니, 잃는 것 또한 작은 데에 있을지 모른다."
 WJ_qingyi_yd_comment_2_1:0 "치세의 능신이요, 난세의 간웅이다."
 WJ_qingyi_yd_comment_2_2:0 "임기응변이 무궁하고 희로를 얼굴에 드러내지 않는다. 함께 일하는 자는 그 이로움을 얻되, 그 칼끝 또한 경계해야 한다."
 WJ_qingyi_yd_comment_2_3:0 "가슴에는 갑병을 품고 입으로는 인의를 말한다. 그 마음은 헤아리기 어렵고, 그 재주는 감추기 어렵다."
 WJ_qingyi_yd_comment_3_1:0 "진에 임하면 과단성 있어 사졸들이 기꺼이 그를 위해 죽는다. 삼군 가운데 깃발이 향하는 곳이 곧 이 사람이다."
 WJ_qingyi_yd_comment_3_2:0 "용맹이 한 시대에 으뜸이니 만 명을 당해 낼 만하다. 밝은 군주를 만나 부림을 받는다면 그 공업은 헤아릴 수 없으리라."
 WJ_qingyi_yd_comment_3_3:0 "병법을 알되 무력을 함부로 쓰지 않고, 잘 싸우되 군을 온전히 지킨다. 옛 명장이라 해도 이에 지나지 않으리라."
 WJ_qingyi_yd_comment_4_1:0 "청렴하면서도 번다한 일을 능히 다스리니, 가는 곳마다 창고가 가득 차고 송사가 그친다."
 WJ_qingyi_yd_comment_4_2:0 "왕을 보좌할 재목이다. 주군을 맡기면 주군이 다스려지고, 대각을 맡기면 대각이 맑아진다."
 WJ_qingyi_yd_comment_4_3:0 "문장으로 자신을 드러내지 않으나, 장부와 전곡에 모두 조리가 있다. 치세가 의지하는 것은 바로 이런 사람이다."
 WJ_qingyi_yd_comment_5_1:0 "깊이 꾀하고 멀리 내다보아 계산에 빠짐이 없다. 일이 일어나기 전에 말하고, 일이 일어난 뒤에 증명된다."
 WJ_qingyi_yd_comment_5_2:0 "과묵하여 말이 적으나, 한마디 하면 정곡을 찌른다. 함께 큰일을 도모할 수는 있으되, 작은 예절로 다툴 상대는 아니다."
 WJ_qingyi_yd_comment_5_3:0 "사람의 마음을 잘 살피고 권변에 능하다. 알맞게 쓴다면 십만 대군보다 낫다."
 WJ_qingyi_yd_comment_6_1:0 "경전에 밝고 행실이 닦여 있어 온 천하가 우러른다. 문하에서 배우려는 자가 천 리를 멀다 않고 찾아온다."
 WJ_qingyi_yd_comment_6_2:0 "말에는 알맹이가 있고 행실에는 한결같음이 있으니, 청의가 중히 여기는 것이 바로 이 사람이다."
 WJ_qingyi_yd_comment_6_3:0 "말씨가 단아하고 바르며 나아가고 물러남에 법도가 있다. 한 시대 사림의 본보기가 될 만하다."

