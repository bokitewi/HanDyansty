 SanGong_DianZhang.015.a:0 "담당자는 시행하라"
 SanGong_DianZhang.015.b:0 "신들은 머리를 조아려 조서를 받드옵니다"
 SanGong_DianZhang.015.desc:0 "저사를 책립하는 조문이 [taizi.GetName]의 이름에 이르자, 그 자리의 몇몇 사람이 약속이나 한 듯 고개를 들었다. 앞서의 길고 장황한 예사가 마치 여기에 이르러서야 매듭을 찾은 듯했다.\n\n이제부터 동궁의 명분은 이 이름에 걸리게 된다. 오늘 이 이름을 들은 이들은 내일이면 그것을 더 많은 곳으로 가져갈 것이다. 종묘의 계승을 떠올리는 이도 있겠고, 어쩌면 더 가까운 것을 생각하는 이도 있으리라.\n\n낭독하는 목소리는 여전히 차분했으나, 주위의 안색은 방금 전과 꼭 같지는 않았다. 당신은 알고 있다. 한 이름이 저위 앞에 놓이는 순간, 아직 일어나지 않은 많은 일들을 벌써 기다리기 시작하는 이들이 있다는 것을."
 SanGong_DianZhang.015.t:0 "태자 책립 조서"
 SanGong_DianZhang.018.a:0 "조서가 내려졌으니, 동궁은 마침내 비었다."
 SanGong_DianZhang.018.desc:0 "저사를 폐하는 조명이 이미 반포되어, [taizi.GetName](은)는 이제 더 이상 태자의 신분으로 동궁에 머물지 않는다. 조서를 전한 이가 낭독을 마치자 주위에는 한동안 아무도 소리를 내지 않았고, 그 몇 글자가 아직 허공에 걸려 있는 듯했다.\n\n당신은 주위를 둘러보았다. 시선을 떨구는 이도 있고, 입을 열려는 듯한 이도 있었으나, 끝내 아무도 말하지 않았다. 지난날 저위로 인해 생겨났던 친소의 관계는 앞으로 모두 다른 모습으로 바뀔 것이다.\n\n조서는 계속 전해져야 하지만, 예전의 호칭은 더 이상 쓸 수 없다. 이 소식이 궁문을 나서면 얼마나 많은 의논을 불러일으킬지는, 눈앞의 이 짧은 정적으로 가릴 수 있는 것이 아니다."
 SanGong_DianZhang.018.t:0 "태자 폐위 조서"
