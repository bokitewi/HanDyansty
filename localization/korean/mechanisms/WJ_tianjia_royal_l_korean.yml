 mem_add_taizi_desc:0 "[owner.GetFirstName](이)가 저군으로 책봉되어 동궁에 들었다. 책문에 이르기를, “나라의 큰 근본은 무엇보다 저사를 세우는 데 있다. 너는 성품이 어질고 효성스러우며 기량과 식견이 단정하고 굳으니, 덕행을 힘써 닦고 신하의 예의를 삼가 지켜 종묘의 무거움을 이어받으라.”"
