 WJ_kaoke_bad_opinion:0 "고과가 열등하여 맡긴 바를 저버림"
 WJ_kaoke_candidate_desc:0 "최근 5년 고과"
 WJ_kaoke_candidate_summary:0 "\n지방 관원 선발 가산점: [ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_candidate_value')|0] (본 조정의 가장 최근 고과 등급 기준)."
 WJ_kaoke_chosen_candidate_tt:0 "당신의 고과 실적이 담당 관청에 보고됩니다. 다음 고과 전까지 지방 관원을 선발할 때 더 우대받게 됩니다."
 WJ_kaoke_civil_gain_tt:0 "이 일은 당신의 고과에 공 하나로 기록됩니다."
 WJ_kaoke_civil_loss_tt:0 "이 일은 당신의 고과에 과 하나로 기록됩니다."
 WJ_kaoke_civil_unscored_tt:0 "이 일은 당신의 고과에 기록되나, 공과로 계산되지 않습니다."
 WJ_kaoke_close_book:0 "고과부 덮기"
 WJ_kaoke_current_page:0 "공과 실록으로 돌아가기"
 WJ_kaoke_current_summary:0 "이번 기는 [ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_days_value')|0]일이 지났고, [ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_remaining_value')|0]일이 남았습니다. 공무 [ROOT.Char.MakeScope.Var('wj_kaoke_civil_count').GetValue|0]건 / [ROOT.Char.MakeScope.Var('wj_kaoke_civil_points').GetValue|0]점. 전투 [ROOT.Char.MakeScope.Var('wj_kaoke_battles').GetValue|0]회, [ROOT.Char.MakeScope.Var('wj_kaoke_wins').GetValue|0]승 [ROOT.Char.MakeScope.Var('wj_kaoke_losses').GetValue|0]패, 군공 원점수 [ROOT.Char.MakeScope.Var('wj_kaoke_military_points').GetValue|0], 반영 [ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_military_value')|0]점. 이치 [ROOT.Char.MakeScope.Var('wj_kaoke_choice_count').GetValue|0]회 / [ROOT.Char.MakeScope.Var('wj_kaoke_choice_points').GetValue|0]점.[ROOT.Char.Custom('WJKaokeCentral')]$WJ_ai_kaoke_superior_summary$\n이번 기 [ROOT.Char.Custom('WJKaokeCurrentGrade')], 총점 [ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_score_value')|0] (기본 50 포함).\n"
 WJ_kaoke_cycle_rules:0 "고과 대상은 본 조정의 왕국급 이하 지방관에 한하며, 제국급, 자립한 자, 봉지가 없는 자는 해당하지 않습니다. 5년에 한 번 고과하며, 같은 조정 안에서 전임해도 기간이 끊기지 않습니다. 자격을 잃거나 왕조가 바뀌면 이전 기간은 무효가 되어 고과 포상을 받을 수 없으며, 자격을 다시 얻으면 새로 5년을 시작합니다."
 WJ_kaoke_grade_none:0 "고과 전"
 WJ_kaoke_last_summary:0 "지난 기: [ROOT.Char.Custom('WJKaokeGrade')], 총점 [ROOT.Char.MakeScope.Var('wj_kaoke_last_score').GetValue|0]. 공무 [ROOT.Char.MakeScope.Var('wj_kaoke_last_civil_count').GetValue|0]건 / [ROOT.Char.MakeScope.Var('wj_kaoke_last_civil_points').GetValue|0]점. 전투 [ROOT.Char.MakeScope.Var('wj_kaoke_last_battles').GetValue|0]회, [ROOT.Char.MakeScope.Var('wj_kaoke_last_wins').GetValue|0]승 [ROOT.Char.MakeScope.Var('wj_kaoke_last_losses').GetValue|0]패. 이치 [ROOT.Char.MakeScope.Var('wj_kaoke_last_choice_points').GetValue|0]점.[ROOT.Char.Custom('WJKaokeLastCentral')]$WJ_ai_kaoke_last_superior_summary$\n고과 포상: [ROOT.Char.Custom('WJKaokeReward')].\n"
 WJ_kaoke_legacy_history:0 "\n예전의 고과 등급은 새 법에 따라 환산되었으며, 지난 상벌은 다시 고치지 않습니다."
 WJ_kaoke_no_history:0 "아직 완전한 5년 고과 등급이 없습니다.\n"
 WJ_kaoke_open_book_tt:0 "고과부를 펼쳐 이번 기의 공과를 확인합니다."
 WJ_kaoke_poor_opinion:0 "고과가 차등이라 일 처리가 부적절함"
 WJ_kaoke_resume_reward:0 "가장 최근의 고과 포상 수령"
 WJ_kaoke_reward_candidate_choice:0 "이 실적을 기록하여 발탁에 대비해 주십시오."
 WJ_kaoke_reward_cha:0 "당신의 고과 등급은 차등으로 매겨졌습니다. 담당 관청은 당신의 일 처리가 미흡하다고 꾸짖었고, 상관도 당신에게 적잖은 불만을 품었습니다. 앞으로 몇 해 동안 당신의 봉급과 현망이 다소 타격을 받을 것입니다.\n"
 WJ_kaoke_reward_liang:0 "당신의 고과 등급은 양등으로 매겨져, 관례에 따라 담당 관청에 고과 포상 하나를 골라 청할 수 있습니다.\n"
 WJ_kaoke_reward_lie:0 "당신의 고과 등급은 열등으로 매겨졌습니다. 담당 관청은 당신의 봉급을 깎고 관리 기강을 바로잡으라 명했으며, 상관 또한 크게 불만을 품었습니다. 앞으로 몇 해 동안 봉급과 현망이 모두 깎여, 벼슬길이 나아지기는 어려울 듯합니다.\n"
 WJ_kaoke_reward_merit_choice:0 "선정 정표를 내려 주십시오."
 WJ_kaoke_reward_ping:0 "당신의 고과 등급은 평등으로 매겨졌습니다. 공도 과도 없으니, 상도 벌도 없습니다.\n"
 WJ_kaoke_reward_treasury_choice:0 "치소의 경비를 내려 주십시오."
 WJ_kaoke_reward_xp_choice:0 "옛 현인들의 치정법을 연구하고자 합니다."
 WJ_kaoke_reward_you:0 "당신의 고과 등급은 우등으로 매겨져, 관례에 따라 담당 관청에 고과 포상 하나를 골라 청할 수 있습니다.\n"
 WJ_kaoke_rules_page:0 "어떤 일이 공이 되고, 어떤 일이 과가 되는가?"
 WJ_kaoke_scoring_rules:0 "고과는 50점을 기본으로 하여 공무, 군공, 이치, 그리고 조정이 조정한 점수를 더합니다. 군공의 증감은 각각 60점을 한도로 합니다. 100점 이상은 우, 80점 이상은 양, 50점 이상은 평, 30점 이상은 차, 30점 미만은 열입니다.\n양과 우는 고과 포상 하나를 골라 청할 수 있습니다. 담당 관청에 천거되어 발탁에 대비하거나, 국고 경비를 청하거나, 선정 정표를 청하거나, 치정법을 연구할 수 있으며, 우등은 더 많이 얻습니다. 차와 열은 5년 동안 봉급과 현망이 모두 깎이고 상관도 불만을 품으며, 열등은 그 두 배입니다. 이미 가진 현망은 깎지 않으며, 역대 고과 등급도 누적되지 않습니다.\n"
 WJ_kaoke_settlement_end:0 "\n옛 장부는 여기서 봉해지고, 새 기가 처음부터 다시 기록됩니다. 양이나 우를 얻었다면 고과 포상 하나를 골라 청할 수 있습니다. 당장 정하지 못했다면 나중에 고과부를 펼쳐 추가로 받을 수 있으나, 다음 고과가 지나면 무효가 됩니다."
 WJ_kaoke_settlement_intro:0 "5년 동안 일을 맡은 장부가 이미 한데 모였다. 서리는 공과를 항목별로 대조한 뒤, 이번 기의 고과 등급을 당신 앞에 올렸다.\n\n"
 WJ_kaoke_task_rules:0 "공무는 지방 통치의 일을 마쳐야 기록되며, 한 건에 한 번 기록하고 건설 공사는 따로 계산하지 않습니다. 공과는 선택한 처분에 따라 정해집니다. 군공은 직접 병력을 이끄는 지휘관이나 기사로서 전투에 나서야 하며, 이기면 공 10점, 지면 과 10점이 기록됩니다. 이치는 해마다 한 건씩이며, 책임을 다하면 공이 되고, 절충하면 증감이 없으며, 사익을 꾀하면 감점됩니다. 재능을 시험하는 일은 성공할 수도, 실패할 수도 있습니다.\n"
 WJ_kaoke_trial_continue:0 "시수 고과가 양등에 미치지 못하여, 다음 고과까지 시수를 이어갈 수밖에 없습니다.\n"
 WJ_kaoke_trial_maocai:0 "당신은 시수 고과에서 우등을 받아 무재로 천거되었고, 이제 정식으로 출사합니다.\n"
 WJ_kaoke_trial_rules:0 "당신은 아직 시수 중입니다. 고과에서 양등을 받으면 효렴으로, 우등을 받으면 무재로 천거될 수 있습니다. 양등에 미치지 못하면 시수를 이어가며 다시 고과를 받습니다.\n"
 WJ_kaoke_trial_xiaolian:0 "당신은 시수 고과에서 양등을 받아 효렴으로 천거되었고, 이제 정식으로 출사합니다.\n"

