 WJ_kaoke_award_merit:0 "현망 정표 수령함"
 WJ_kaoke_award_none:0 "직접 고른 고과 포상 없음"
 WJ_kaoke_award_pending:0 "수령 대기"
 WJ_kaoke_award_treasury:0 "국고 지원금 수령함"
