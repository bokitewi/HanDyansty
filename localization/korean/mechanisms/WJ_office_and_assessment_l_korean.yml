# 汉晋风华：按类型整合；键名与现行文本保留。来源逐键见本批manifest。

 # 来源：localization/simp_chinese/WJ_ai_routes_l_simp_chinese.yml
 WJ_ai_bizhao_letter:0 "오래전부터 그대의 재주와 식견을 들어 왔소. 마침 막부에 막직 하나가 비어 있어, 막부로 들어와 함께 일하기를 청하오. 요즘 문서가 책상에 산더미처럼 쌓였는데, 속리들은 저마다 장기가 있으나 차분히 의논할 만한 사람이 없소. 결정하기 어려운 일이 있을 때마다 그대가 떠오르오.\n\n몇 마디 지나친 칭찬만으로 모시려는 것은 아니오. 맡길 직무와 보수는 모두 글 뒤에 적어 두었소. 응해 준다면 약속대로 일을 맡아 주고, 이견이 있으면 얼굴을 마주하고 말해 주기를 바라오.\n\n이 글로 구하는 것은 나와 함께 일을 짊어질 동료이지, 술자리에서 고개만 끄덕이며 좋다고 하는 손님이 아니오. 오고 감은 친히 답해 주기를 바라며, 막부는 자리를 비워 두고 기다리겠소."
 WJ_ai_bizhao_role_1:0 "\n맡길 막직: [scope:actor.Custom('WJ_mufu_role_1')]."
 WJ_ai_bizhao_role_2:0 "\n맡길 막직: [scope:actor.Custom('WJ_mufu_role_2')]."
 WJ_ai_bizhao_role_3:0 "\n맡길 막직: [scope:actor.Custom('WJ_mufu_role_3')]."
 WJ_ai_bizhao_role_4:0 "\n맡길 막직: [scope:actor.Custom('WJ_mufu_role_4')]."
 WJ_ai_bizhao_role_5:0 "\n맡길 막직: [scope:actor.Custom('WJ_mufu_role_5')]."
 WJ_ai_bizhao_strong_hook:0 "\n다만 내 막부에 들어오면 곧 막부의 사람이니, 앞으로의 행동거지는 부디 막부를 먼저 생각해 주기 바라오."
 WJ_ai_kaoke_accept:0 "이 금을 기꺼이 받고 점수를 더해 준다."
 WJ_ai_kaoke_award:0 "관원 포상"
 WJ_ai_kaoke_award_desc:0 "가까운 관원의 이번 기 정적을 칭찬하여 고과에 공 하나를 기록합니다."
 WJ_ai_kaoke_awarded:0 "[scope:actor.Custom('WJ_GetLinkedUIName')](이)가 고과부에 당신에 대한 칭찬을 한 줄 적어 주었음"
 WJ_ai_kaoke_desc:0 "[scope:actor.Custom('WJ_GetLinkedUIName')](은)는 처음에는 일을 맡기가 어렵다는 말만 늘어놓았다. 한참을 돌고 돌아서야 금화 삼백 냥을 당신 앞으로 밀었다. “이번 기 고과의 등급은 부디 잘 보살펴 주십시오.”\n\n당신은 손을 내밀지 않고 먼저 고과부를 힐끗 보았다. 그가 바라는 것은 몇 점 더하는 것뿐이다. 붓으로 몇 획만 그으면, 어느 것이 정적에서 나왔고 어느 것이 눈앞의 이 후한 예물에서 나왔는지 남들은 가려내기 어려울 것이다. 당신이 대답하지 않자, 그는 목소리를 조금 더 낮추었다.\n\n문밖으로 발소리가 지나가는 듯하자 예물을 내밀던 손이 곧바로 멈추었다. 당신은 금을 보고, 다시 고과부를 보았다. 받든 거절하든 한마디면 된다. 다만 훗날 누군가 묵은 장부를 뒤진다면, 그때도 이처럼 가벼이 넘어갈 수 있을지는 알 수 없다."
 WJ_ai_kaoke_just_tt:0 "공정한 관원은 사사로이 이 점수 요청을 승인하지 않습니다."
 WJ_ai_kaoke_last_superior_summary:0 "\n지난 기 상급자의 인정: [ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_last_superior_value')|=+0]점."
 WJ_ai_kaoke_personality:0 "승인자의 성격: $VALUE|=+0$"
 WJ_ai_kaoke_superior_summary:0 "\n상급자의 인정: [ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_superior_value')|=+0]점."
 WJ_ai_kaoke_title:0 "사사로운 청탁"
 WJ_ai_maocai_letter:0 "삼가 글을 올려 무재로 천거해 주시기를 청합니다. 평소 일을 논할 때마다 제 소견이 술자리에만 머무는 것이 늘 아쉬웠습니다. 이제 임용의 후보에 올라 배운 바를 실제 정무에 시험해 보고자 하니, 더는 평범한 안부 인사로 이 글의 뜻을 가리지 않겠습니다.\n\n재주가 어떠한지는 명공께서 살펴 주셔야 할 일이며, 저도 감히 못 할 일이 없다고 장담하지는 않겠습니다. 다만 한 번도 시험받을 기회를 얻지 못한다면, 훗날 득실이 있다 한들 남에게 알릴 길이 없을 것입니다.\n\n의논한 보답은 글 뒤에 붙였으니 헤아려 주시기 바랍니다. 천거해 주신다면 마땅히 힘을 다해 일하겠으며, 허락하지 않으신다면 그 또한 분명히 알려 주십시오. 세상살이가 쉽지 않으나, 오늘 이 청을 글로 적은 것은 더는 남이 우연히 떠올려 주기만을 기다리고 싶지 않기 때문입니다."
 WJ_ai_offer_gold:0 "\n글 뒤에 예물 목록 한 장을 따로 붙여 작은 성의를 표합니다."
 WJ_ai_offer_hook:0 "\n응해 주신다면 이 은혜는 반드시 마음에 새길 것이며, 훗날 부탁하실 일이 있으면 감히 사양하지 않겠습니다."
 WJ_ai_xiaolian_letter:0 "삼가 글을 올려 효렴으로 천거해 주시기를 청합니다. 이 일은 본래 남을 통해 완곡하게 말씀드릴 수도 있었으나, 거듭 생각한 끝에 직접 밝혀 적기로 했습니다. 평소 지키고 배운 바로써 벼슬길에 나아갈 길 하나를 얻고자 합니다.\n\n고을의 평판이 모두 좋은 말뿐이라고는 감히 말씀드리지 못하겠습니다. 의심스러운 점이 있다면 기꺼이 물음에 답하겠습니다. 다만 오래 기다려도 문이 열리지 않으니, 일을 맡고자 하는 마음이 있어도 끝내 스스로 나아가기 어려워 외람되이 글을 올리오니, 살펴 기록해 주시기 바랍니다.\n\n의논한 보답은 뒤에 붙였으니, 명공께서 함께 헤아려 주십시오. 천거해 주신다면 알아주신 은혜를 마땅히 기억할 것이며, 지금 허락하지 않으신다면 그 또한 답을 주시어, 제가 날마다 기다리며 나아갈지 물러날지 모르는 일이 없게 해 주십시오."

