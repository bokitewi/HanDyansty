 WJ_LUZHI_DESC_CHU_NO_ROAD:0 "당신은 관직도 없고, 벽소, 효렴, 무재의 출신도 없으므로 [wj_chushi|E]입니다. 현망은 훗날 맡을 수 있는 관직의 상한을 높일 뿐입니다. 먼저 출사 출신을 얻고 임명을 받아야 [wj_luyi|E](을)를 논할 수 있습니다."
 WJ_LUZHI_DESC_CHU_WITH_ROAD:0 "당신은 이미 출사 출신이 있지만 지금은 관직을 맡고 있지 않으므로, 여전히 [wj_chushi|E]의 신분으로 지내고 있습니다. 아래에 나열된 현망 임관 상한은 당신이 임명받을 수 있는 최고 범위일 뿐입니다. 임명을 받아야 관직에 따라 [wj_luyi|E](이)가 정해집니다."
 WJ_LUZHI_DESC_OFFICIAL:0 "당신은 현재 [Character.Custom('WJ_BandWord')]이며, 이는 당신이 맡은 최고 관직에 따라 정해진 [wj_luyi|E]입니다. 출사 출신은 관원 선발 후보에 오를 수 있는지를, 현망은 임명받을 수 있는 최고 범위를 결정합니다. 둘 다 관직을 건너뛰어 당신의 녹질을 바꿀 수는 없습니다."
 WJ_LUZHI_DESC_SHI_NO_ROAD:0 "당신은 지금 관직을 맡고 있지 않으며, 벽소, 효렴, 무재의 출신도 아직 없습니다. 영지가 없는 사족이므로 [wj_shizu|E](으)로 표시되지만, 사족이라는 이름은 관직도 녹질도 아닙니다. 먼저 출사 출신을 얻고 임명을 받아야 관직에 따라 [wj_luyi|E](이)가 정해집니다."
 WJ_LUZHI_DESC_SHI_WITH_ROAD:0 "당신은 이미 출사 출신이 있지만 지금은 관직을 맡고 있지 않습니다. 영지가 없는 사족이므로 [wj_shizu|E](으)로 표시됩니다. 아래에 나열된 현망 임관 상한은 당신이 임명받을 수 있는 최고 범위일 뿐입니다. 임명을 받아야 관직에 따라 [wj_luyi|E](이)가 정해집니다."
 WJ_LUZHI_DESC_SHOU:0 "당신은 이미 관직을 맡았으나 벽소, 효렴, 무재의 출신이 아직 없어, 당분간 [wj_shishou|E](으)로 일할 수밖에 없으며 이 직에 걸맞은 [wj_luyi|E](을)를 얻지 못했습니다. 아래에 나열된 현망 임관 상한은 명망이 허락하는 최고 범위일 뿐, 지금의 녹질이 아닙니다. 시수를 1년 채우고 고과를 통과해야 출사 출신을 얻고, 그때 맡은 관직에 따라 정식으로 녹질이 정해집니다."
 WJ_road_heading_hanjin:0 "출사의 길"
 WJ_tooltip_explain_hanjin:0 "[wj_luyi|E](은)는 맡은 관직의 품질이고, [wj_mingwang|E](은)는 사림에서의 명성이니, 둘을 혼동해서는 안 됩니다."
 WJ_xianwang_0:0 "알려진 명성 없음"
 WJ_XIANWANG_APPOINTMENT_CHAO:0 "$BULLET$현망 임관 상한: 정식 출사 자격을 얻은 뒤 [wj_luzhi_wanshi|E] (이하) 관직에 임명될 수 있으며, 성부 임명 후보에 오를 수 있음"
 WJ_XIANWANG_APPOINTMENT_GONG:0 "$BULLET$현망 임관 상한: 정식 출사 자격을 얻은 뒤 삼공의 자격을 얻으며, [wj_luzhi_wanshi|E] (이하) 관직에 임명될 수 있음"
 WJ_XIANWANG_APPOINTMENT_JUN:0 "$BULLET$현망 임관 상한: 정식 출사 자격을 얻은 뒤 [wj_luzhi_bierqian|E] (이하) 관직에 임명될 수 있음"
 WJ_XIANWANG_APPOINTMENT_NONE:0 "$BULLET$현망 임관 상한: 아직 현망만으로 정식 관직에 임명되기에는 부족함"
