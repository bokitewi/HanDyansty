 WJ_kaoke_request_50:0 "이번 기 고과 +50점"
 WJ_kaoke_request_burden_reason:0 "요청한 고과 가산점"
 WJ_kaoke_request_gain_20_tt:0 "이번 기 고과에 #P 20#!점 추가"
 WJ_kaoke_request_gain_30_tt:0 "이번 기 고과에 #P 30#!점 추가"
 WJ_kaoke_request_gain_50_tt:0 "이번 기 고과에 #P 50#!점 추가"
 WJ_kaoke_request_one_score_tt:0 "가산점 등급을 반드시 하나만 골라야 함"
 WJ_kaoke_request_options:0 "가산점 등급을 하나 고르고, 추가로 대가를 붙일 수 있음"
 WJ_kaoke_request_period_tt:0 "당신은 이번 기 고과 대상이어야 하며, 이번 기에 아직 청탁에 성공하지 않았어야 함"
 WJ_kaoke_request_secret_known_tt:0 "당신은 상대가 사사로이 부정을 저지른 약점을 쥐게 되며, 이번 기에는 더 이상 청탁할 수 없음"
 WJ_kaoke_request_secret_owner_tt:0 "고과 부정의 비밀을 하나 떠안게 되며, 청탁한 자가 이를 알게 됨"
 WJ_kaoke_request_willingness_tt:0 "상대가 이 일을 기꺼이 받아들여야 함"
 WJ_kaoke_result_desc:0 "서리가 고과부의 마지막 장을 건넸다. 당신이 고친 곳은 하나하나 장부에 옮겨 적혀 있었다. 당신이 다 보고 장부를 거두라는 눈짓을 했으나, 그는 봉하기 전에 이름을 한 번 더 대조했다.\n\n붓으로 고친 자취는 결국 남았고, 각 관원의 고과 포상은 그들이 저마다 임기를 채울 때까지 기다려야 한다. 훗날 누군가 이 평어들의 내력을 물으러 올지는, 지금으로서는 아무도 입에 올리지 않았다. 문서를 거두어 가자 책상 위가 문득 훨씬 휑해졌다. 앞으로 몇 해 동안 이 고과부에는 다시 손대기 어려울 것이다."
 WJ_kaoke_result_emperor_desc:0 "마지막 고과부까지 모두 거두어졌다. 서리는 고친 곳을 사람마다 읽어 나가다가, 어느 이름에 이르러 다시 멈추고 당신을 바라보았다. 마치 당신의 얼굴에서 확실한 한마디를 더 얻어 내려는 듯했다.\n\n당신은 그에게 이미 정한 기록대로 장부에 올리고 더 묻지 말라고 했다. 멀리 주현에 있는 이들은 아직 듣지 못했겠지만, 훗날의 등급에는 오늘 어전에서 그은 한 획이 이미 더해졌다. 정식 고과 포상은 여전히 각 관원이 임기를 채울 때까지 기다려야 한다. 앞으로 몇 해 동안은 당신이 직접 고과부에 관여하기 어려울 것이다."
 WJ_kaoke_result_title:0 "고과부 보관"
 WJ_kaoke_result_ack:0 "장부를 봉하여 보관한다."

 # 来源：localization/simp_chinese/WJ_kaoke_duties_l_simp_chinese.yml
 wj_kaoke_duties.invalid:0 "이 문서는 이미 나의 직무가 아니니, 돌려보내 보관하라."
 wj_kaoke_duties.invalid.tt:0 "문서가 이미 당신의 직무 범위 밖에 있어, 돌려보내 보관할 수밖에 없습니다."

