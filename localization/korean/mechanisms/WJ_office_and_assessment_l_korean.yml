 # 来源：localization/simp_chinese/WJ_kaoke_assessment_additions_l_simp_chinese.yml
 WJ_kaoke_active_disfavor_opinion:0 "고과 억압"
 WJ_kaoke_active_favor_opinion:0 "고과 발탁"
 WJ_kaoke_trial_notice_maocai:0 "시수에 대한 평정이 내려왔다. 우등으로 매겨져 무재로 천거되었다. 당신은 문서를 두 번 읽고서야 비로소 실감했다. 그동안 시험을 기다리던 신분이 오늘에야 마침내 매듭지어진 것이다.\n\n앞으로 일을 맡아도 공과는 여전히 스스로 짊어져야 하며, 종이 한 장의 출신만 믿고 모르는 것이 없다고 자부해서는 안 된다. 그러나 지난 몇 해 동안 한 일이 헛되지 않았고, 이 인정만으로도 정무를 물으러 오는 이들을 한결 떳떳하게 대할 수 있을 것이다. 당신은 문서를 잘 챙겨 두고 다시 책상 앞으로 돌아가, 처리해야 할 일들을 보았다."
 WJ_kaoke_trial_notice_title:0 "시수 고과 결과"
 WJ_kaoke_trial_notice_xiaolian:0 "시수는 양등으로 평가되어 효렴으로 천거되었다. 문서를 가져온 이는 다 읽고 나서도 곁에서 당신의 대답을 기다렸지만, 당신은 적혀 있는 평어부터 처음부터 다시 읽었다.\n\n그 안에는 칭찬도 있고 질책도 있었다. 시수가 여기까지 왔으니 더는 같은 신분으로 다음 시험을 기다릴 필요가 없다. 그러나 정식으로 출사하는 것과 앞으로 모든 일을 빈틈없이 해내는 것 사이에는 여전히 많은 노력이 놓여 있다. 당신은 문서를 챙겨 두고, 온 사람에게 지금 맡은 사무를 이어서 아뢰게 했다."

 # 来源：localization/simp_chinese/WJ_kaoke_central_l_simp_chinese.yml
 WJ_kaoke_case_arrest:0 "율법에 따라 체포하여 하옥하고 죄를 묻는다."
 WJ_kaoke_case_desc:0 "[wj_kaoke_offender.Custom('WJ_GetLinkedUIName')](이)가 사사로이 고과 문서를 고친 사건이 마침내 당신의 책상에 올라왔다. 서리가 고친 곳 몇 군데를 가리키며 읽어 나가자, 당신은 절반쯤 듣다가 그 장을 펴 놓게 하고 직접 다시 살폈다.\n\n증거는 확실하나, 어떻게 처분할지는 오로지 당신의 한마디에 달렸다. 너그럽게 봐주든, 하옥하여 죄를 묻든, 아니면 사안을 일단 보류하여 훗날로 미루든. 다만 고과부에서 고쳐진 평어와 이미 남의 손에 넘어간 재물은 이 처분 한마디로 되돌아오지 않을 것이다."
 WJ_kaoke_case_dismiss:0 "문서는 일단 보관하고 나중에 다시 의논한다."
 WJ_kaoke_case_forgive:0 "지난날의 노고를 생각하여 일단 너그러이 용서한다."
