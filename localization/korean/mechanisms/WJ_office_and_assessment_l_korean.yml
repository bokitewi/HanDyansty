 action_wj_temp_official_kaoke_ready:0 "$wj_temp_official_kaoke_decision$"
 action_wj_temp_official_kaoke_ready_click:0 "#I 클릭하여 고과 결단 보기#!"
 action_wj_temp_official_kaoke_ready_desc:0 "당신은 가리로서 시수한 지 1년이 되었으니, 고과를 청해야 합니다. 통과하면 정식으로 출사할 수 있고, 통과하지 못하면 1년 더 시수하고 내년에 다시 고과를 받아야 합니다."
 action_wj_temp_official_kaoke_ready_label:0 "@merit_icon!가리 시수 기간 만료"
 activity_qingyi_conclusion_desc_lundao_loser:0 "도를 논함에 부족함이 있었으나, 도를 깨치는 데는 선후가 있는 법. 훗날 다시 만나리라."
