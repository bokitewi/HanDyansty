 WJ_kaoke_malpractice_secret:0 "고과에서 사사로이 부정을 저지름"
 WJ_kaoke_malpractice_secret_desc:0 "[TARGET_CHARACTER.Custom('WJ_GetLinkedUIName')] 휘하 관원의 고과를 사사로이 고친 적이 있습니다."
