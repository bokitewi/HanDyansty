# 汉晋风华：按类型整合；键名与现行文本保留。来源逐键见本批manifest。

 # 来源：localization/simp_chinese/WJ_qingyi_loc_l_simp_chinese.yml
 activity_window_character_ming_shi:0 "특별 초빙 명사\n[Character.Custom('WJ_GetUIName')|U]"
 activity_wj_qingyi:0 "청의"
 activity_wj_qingyi_conclusion_desc:0 "손님과 주인이 소매를 거두고 일어나니, 오늘의 말은 이미 월단평이 되었고 남은 논의는 계속 전해질 것이다."
 activity_wj_qingyi_desc:0 "뜻을 같이하는 이들을 초빙하고 자리를 마련하여, 현리를 이야기하고 명교를 분석하며 인물을 품평하고 경세를 논합니다. 좌중의 말 한두 마디가 누군가의 명성을 단번에 드높일 수도, 틈을 심을 수도 있습니다."
 activity_wj_qingyi_destination_selection:0 "손님과 주인이 청담을 나눌 수 있는 관사가 있는 장소를 고르십시오."
 activity_wj_qingyi_guest_desc:0 "\n$BULLET_WITH_TAB$참가자는 [prestige_i][prestige|E](와)과 [merit_i][merit|E](을)를 얻을 수 있음\n$BULLET_WITH_TAB$이미 벼슬길에 들어서 청망을 지닌 자는 청의 [trait_level_track_xp|E](이)가 늘어날 수 있음\n$BULLET_WITH_TAB$참가자는 [intent|E]에 따라 가르침을 청하거나, 교유하거나, 근심을 풀 기회를 얻을 수 있음"
 activity_wj_qingyi_guest_help_text:0 "[activity_guests|E](은)는 자리에서 힐난을 받거나, 명사에게 가르침을 청하거나, 인물을 품평하고 동지를 사귀며, 자리가 파한 뒤의 귓속말에 휘말릴 수도 있습니다."
 activity_wj_qingyi_guest_rewards:0 "\n$BULLET_WITH_TAB$손님은 [prestige_i][prestige|E](와)과 [merit_i][merit|E](을)를 얻을 수 있음\n$BULLET_WITH_TAB$1년 안에 청의 [trait_level_track_xp|E](은)는 첫 번째 청의에서만 늘어남"
 activity_wj_qingyi_host_an_a:0 "$articleblank_article$"
 activity_wj_qingyi_host_desc:0 "$activity_wj_qingyi_host_rewards$$activity_wj_qingyi_guest_rewards$"
 activity_wj_qingyi_host_rewards:0 "\n$BULLET_WITH_TAB$주인은 [prestige_i][prestige|E](와)과 [merit_i][merit|E](을)를 얻을 수 있음\n$BULLET_WITH_TAB$이미 벼슬길에 들어서 청망을 지닌 자는 청의 [trait_level_track_xp|E](이)가 늘어날 수 있음\n$BULLET_WITH_TAB$'월단평'을 열면 주인은 많은 [prestige_i][prestige|E](을)를 얻을 수 있음. 선정된 자는 명성이 크게 떨치며, 추가로 [influence|E](와)과 '명사'의 영예를 얻음"
 activity_wj_qingyi_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U] 청의"
 activity_wj_qingyi_owner:0 "청의 주인"
 activity_wj_qingyi_plural:0 "청의"
 activity_wj_qingyi_predicted_cost:0 "예상 비용"
 activity_wj_qingyi_province_desc:0 "당신은 [ROOT.Province.GetName]에서 청의를 엽니다. 관사가 고요하고 손님의 왕래가 편한 곳이야말로 오래 앉아 도를 논하기에 가장 좋습니다."
 activity_wj_qingyi_selection_tooltip:0 "[GetActivityType('activity_wj_qingyi').GetName](을)를 열어 명사를 맞이하고, 현리를 논하며 인물을 품평합니다."
 ming_shi:0 "특별 초빙 명사"
 ming_shi_desc:0 "명망이 뛰어난 명사입니다. 그의 한마디 감식에 좌중이 귀를 기울이고, 자리에서 가르침을 청하거나 품평하는 일도 그 덕분에 더 많아집니다."
 ming_shi_desc_for_host:0 "$ming_shi_desc$"
 ming_shi_for_host:0 "특별 초빙 명사"
 qingyi_guest_learning_intent:0 "배움 추구"
 qingyi_guest_learning_intent_desc:0 "당신은 이번 청의를 통해 명사와 동지에게 경전을 들고 묻고 따져, 자리가 파할 때 학문에서 나아진 바가 있기를 바랍니다."
 qingyi_yuedan_intent:0 "월단평"
 qingyi_yuedan_intent_desc:0 "당신은 여남 허자장의 고사를 본받아 월단으로 당대의 인물을 품평하려 합니다. 먼저 여덟 명을 지명하고, 참석한 손님들이 두 차례 품평하여 여덟에서 넷을 남기고, 넷에서 하나를 정합니다. 선정된 자는 명성이 크게 떨치며 '명사'의 영예를 누립니다."
 qingyi_option_tea:0 "다과 준비"
 qingyi_option_tea_desc:0 "차 연기가 맑고 윤택하여 정신을 기르며 오래 앉아 있을 수 있습니다. 다과가 정갈하면 손님들은 자리에 들자마자 주인에게 호감을 한층 더 갖게 되고, 명사와 배우기를 좋아하는 이들도 책을 펼치고 깊이 이야기하기를 더 원합니다."
 qingyi_option_topic_depth:0 "논제의 깊이"
 qingyi_option_topic_depth_desc:0 "이번에 이야기할 현리, 경의, 정론의 깊이를 정합니다. 논제가 깊을수록 가르침을 청하거나 날카로운 문답이 벌어지기 쉽고, 월단평에서 누군가의 기세를 높여 줄 때도 뭇 의견을 더 잘 굴복시킬 수 있습니다."
 qingyi_option_wine:0 "좋은 술 대접"
 qingyi_option_wine_desc:0 "자리에서 술로 흥을 돋울지 정합니다. 술이 있으면 손님들이 더 기꺼이 모임에 오고, 청담으로 근심을 풀려는 이도 가슴속 응어리를 더 잘 풀 수 있습니다. 다만 술기운이 오른 뒤에는 방달하여 실례를 범하는 이가 없으리라 장담하기 어렵습니다."
 qingyi_phase_conclusion:0 "품제산석"
 qingyi_phase_conclusion_desc:0 "뭇 말을 거두어 오늘의 인물을 품평하여 정하고, 이 모임에 마지막 한 획을 남깁니다."
 qingyi_phase_lunshi:0 "시사 논의"
 qingyi_phase_lunshi_desc:0 "손님과 주인이 자리에 앉아 먼저 시국과 경의를 논합니다. 월단평을 연다면 주인은 이때 인물 여덟 명을 제시합니다."
 qingyi_phase_pinren:0 "인물 품평"
 qingyi_phase_pinren_desc:0 "당대의 인물을 하나하나 품평합니다. 월단평을 연다면 이 차례의 논의가 끝난 뒤 여덟 명 중 넷만 남습니다."
 qingyi_phase_dingping:0 "최종 평가"
 qingyi_phase_dingping_desc:0 "최종 평가의 네 명 중 한 사람을 제일로 추대합니다."
 qingyi_relief_intent:0 "청담으로 근심 풀기"
 qingyi_relief_intent_desc:0 "당신은 잠시 문서와 분쟁에서 벗어나, 현언과 차와 술, 그리고 동지와의 교유를 통해 가슴에 쌓인 [stress|E](을)를 풀고자 합니다."
 qingyi_tea_refined:0 "정성껏 다과 준비"
 qingyi_tea_refined_desc:0 "물을 골라 차를 달이고 과자를 세심히 준비하여, 명사와 배우기를 좋아하는 이들이 책을 펼치고 깊이 이야기하기를 더 원하게 합니다."
 qingyi_tea_simple:0 "간소한 다과 준비"
 qingyi_tea_simple_desc:0 "과자 몇 접시와 맑은 차 한 잔으로, 손님과 주인이 먹고 마시는 데 마음을 빼앗기지 않게 합니다."
 qingyi_topic_deep:0 "고상하고 깊은 논제"
 qingyi_topic_deep_desc:0 "유무, 명교와 자연 같은 현리의 깊은 곳으로 곧장 들어가, 가르침을 청하거나 날카로운 문답이 벌어지기 더 쉽습니다."
 qingyi_topic_plain:0 "평이한 논제"
 qingyi_topic_plain_desc:0 "친근하고 피부에 와닿는 인물과 일상의 이치부터 이야기하여 교유에 더 이롭고, 체면을 꺾는 다툼도 적습니다."
 qingyi_wine_generous:0 "술을 갖추어 흥을 돋움"
 qingyi_wine_generous_desc:0 "좋은 술을 넉넉히 갖추어 손님들이 주미를 휘두르며 마음껏 말하게 하니, 방달하거나 실례를 범하는 일이 더 쉽게 생깁니다."
 qingyi_wine_none:0 "술 대신 차"
 qingyi_wine_none_desc:0 "술잔을 놓지 않고 차로 마음을 맑게 하니, 말이 비교적 절제됩니다."
 WJ_qingyi_all_attending_guests:0 "자리에 있는 모든 손님"
 WJ_qingyi_guest_reward_log:0 "자리에 있던 손님들이 처음부터 끝까지 모임에 참여하여, 뭇 말과 교유 속에서 저마다 얻은 바가 있음"
 WJ_qingyi_guest_reward_log_title:0 "손님들이 가득 얻어 돌아감"
 WJ_qingyi_host_reward_log:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 청의를 성공적으로 주관하여 여러 현인의 칭찬을 받고, 명성과 청망이 모두 늘었음"
 WJ_qingyi_host_reward_log_title:0 "주인이 뭇 말을 거둠"
 WJ_qingyi_opening_log:0 "[CHARACTER.Custom('WJ_GetUIName')](이)가 옷매무새를 가다듬고 자리에 들어 주미를 들고 말을 꺼내니, 오늘의 청의가 이로써 시작되었음"
 WJ_qingyi_opening_log_title:0 "청의 개막"

