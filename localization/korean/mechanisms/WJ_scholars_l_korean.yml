 WJ_yangwang.custom:0 "차라리 스스로 호를 짓는 것이 낫겠다."
 WJ_yangwang.custom.desc:0 "당신은 이미 마련된 몇 가지 호를 한쪽으로 밀어 두고, 직접 짓기로 마음먹었다. 이 호는 앞으로 당신이 홀로 지낼 때나 사람을 사귈 때나 늘 따라다닐 것이다. 굳이 기이함을 좇을 필요는 없고, 그저 훗날 붓을 들어 서명할 때 스스로 어색하지 않기만 하면 된다.\n\n당장 마땅한 것이 떠오르지 않으면, 붓을 내려놓아도 괜찮다."
 WJ_yangwang.dongshan:0 "동산은사"
 WJ_yangwang.keep:0 "옛 호를 그대로 쓴다."
 WJ_yangwang.naming.desc:0 "산에 살며 책을 읽으니, 아호 하나쯤은 있어야 하리라. 남들이 어떻게 평할지는 아직 알 수 없으나, 적어도 이 호는 당신이 지금 어떻게 살고자 하는지를 말해 주어야 한다. 아직 은거하지 않았다면, 호를 정하는 날이 곧 세상의 일을 떠나 문을 닫고 명망을 기르는 때가 될 것이다.\n\n산거와 임천의 뜻을 취해도 좋고, 수월의 정취를 담아도 좋으며, 스스로 새롭게 지어도 좋다. 이미 옛 호가 있다면 그대로 써도 무방하다. 당장 마땅한 것이 떠오르지 않으면 잠시 붓을 내려놓아도 괜찮다."
 WJ_yangwang.naming.title:0 "산중에서 무엇이라 부를까"
