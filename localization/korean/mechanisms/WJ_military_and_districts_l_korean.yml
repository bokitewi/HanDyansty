 WJ_mr_picker_desc:0 "여러 군호가 차례로 당신의 책상 앞에 놓여 있다. 당신은 [WJ_mr_target.Custom('WJ_GetLinkedUIName')]에게 그의 관직과 치소에 걸맞은 칭호를 하나 골라 주어야 한다. 단계별로 살펴볼 수도 있고, 손 가는 대로 집어 들 수도 있다."
