 WJ_dd_defence_notice_title:0 "관할 구역 관원이 선전포고를 받음"
 WJ_dd_dispatch_available_tt:0 "관할 구역에 파견할 수 있는 공작급 또는 왕국급 무관이 있어야 하며, 그가 구원받는 자가 주도하는 전쟁에 참여할 수 있어야 함"
 WJ_dd_join_personally_available_tt:0 "관할 구역 관원이 주도하는 전쟁이어야 하며, 도독 본인이 참전할 수 있어야 함"
