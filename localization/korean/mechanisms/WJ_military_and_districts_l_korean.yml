 # 来源：localization/simp_chinese/WJ_military_transfer_l_simp_chinese.yml
 wj_district_management_filter_tag_desc:0 "관할 구역 무관의 군무와 병적 조정"
 wj_military_transfer_filter_tag_desc:0 "병적 조정의 이전 측과 접수 측 선택"
 WJ_mt_chance_base:0 "기본 의향: #P +50#!"
 WJ_mt_chance_factors:0 "이전 측의 당신에 대한 의견: [GetPlayer.MakeScope.ScriptValue('WJ_mt_opinion_score')|+=0]\n친우, 문생 및 속관: [GetPlayer.MakeScope.ScriptValue('WJ_mt_trust_score')|+=0]\n원한: [GetPlayer.MakeScope.ScriptValue('WJ_mt_hostility_score')|+=0]\n군권과 명령 거부의 결과: [GetPlayer.MakeScope.ScriptValue('WJ_mt_authority_score')|+=0]\n이전 측의 현재 전쟁: [GetPlayer.MakeScope.ScriptValue('WJ_mt_war_score')|+=0]\n이번에 이동할 연대 수: [GetPlayer.MakeScope.ScriptValue('WJ_mt_count_score')|+=0]\n이동하는 병력의 비율: [GetPlayer.MakeScope.ScriptValue('WJ_mt_fraction_score')|+=0]\n\n이전 측의 의향은 최저 5%, 최고 95%입니다."
 WJ_mt_chance_header:0 "#T 수락 확률: [GetPlayer.MakeScope.Var('wj_mt_chance').GetValue|0]%#!"
 WJ_mt_chance_self:0 "자신의 연대를 이동: #P 반드시 수락#!\n그래도 병력원, 작위, 군권, 국고가 모두 충분해야 합니다."
 WJ_mt_confirm_requires:0 "내보낼 작위와 받을 작위, 그리고 이동할 연대를 적어도 하나 골라야 하며, 군권, 병력원, 국고가 모두 충분해야 합니다."
 WJ_mt_copy_failed:0 "새 군적을 편성하지 못하여 병력 이동은 무산되었습니다. 원래 병력은 각자 본영으로 돌아갔고, 국고에서는 한 푼도 지출되지 않았으며, 이 일로 죄를 입은 사람도 없습니다."
 WJ_mt_declined_desc:0 "[wj_mt_source.Custom('WJ_GetLinkedUIName')](이)가 병력 이동 명령을 받들지 않아 단 한 명의 병사도 움직이지 않았습니다. 명을 거역한 자가 천자 본인이 아니라면 군법 위반으로 처벌해야 합니다."
 WJ_mt_declined_title:0 "병력 이동 명령 불복"
 WJ_mt_invalid_desc:0 "인선, 작위, 병력원 또는 군권이 이미 바뀌었거나 국고가 부족하여 이동 명령을 시행하지 못했으며, 이 일로 죄를 입은 사람은 없습니다. 앞서 정한 인선도 함께 취소되었으니 다시 골라야 합니다."
 WJ_mt_invalid_title:0 "이동 명령 시행 불가"
 WJ_mt_need_pair:0 "먼저 인물 상호작용 메뉴에서 내보내는 측과 받는 측을 정해야 하며, 두 사람 모두 당신의 군권이 미치는 범위 안에 있어야 합니다. 군국병은 양쪽 모두 공작 이상이어야 하며, 부곡은 백작이 내보낼 수 있습니다."
 WJ_mt_order_menu:0 "병적 조도"
 WJ_mt_person_gate:0 "현재 당신이 지휘할 권한이 있는 본 조정의 인물을 고르십시오."
 WJ_mt_hanjin_tt:0 "군국제 정체를 채택해야 함."
 WJ_mt_authority_role_tt:0 "당신은 본 조정의 천자, 도독중외, 또는 현임 지방 도독이어야 함."
 WJ_mt_baton_tt:0 "지방 도독은 가절, 지절 또는 사지절을 지녀야 함."
 WJ_mt_settled_district_tt:0 "도독 구역이 아직 설치 중이므로 확정될 때까지 기다려야 함."
 WJ_mt_no_rebellion_tt:0 "지방 도독은 최고 주군과 교전 중일 때 병력을 이동시킬 수 없음."
 WJ_mt_has_command_tt:0 "선택한 인물은 영지가 있거나, 군국병을 둘 수 있는 공작 이상의 실직 작위를 보유해야 함."
 WJ_mt_same_realm_tt:0 "선택한 인물은 당신과 같은 최고 주군의 관할에 속해야 함."
 WJ_mt_central_target_tt:0 "중앙 지휘에서는 본인, 황제, 또는 본 조정의 무관만 선택할 수 있음."
 WJ_mt_local_military_tt:0 "지방 도독은 본인이나 관할 구역의 무관만 선택할 수 있음."
 WJ_mt_local_district_tt:0 "선택한 무관은 당신의 도독 구역에 속해야 함."
 WJ_mt_local_tier_tt:0 "사지절은 주급 이하의 무관을 지휘할 수 있고, 지절은 군급 이하로 한정되며, 가절은 전쟁 중이어야 함."
 WJ_mt_title_tier_tt:0 "군국병을 내보내는 측과 두 종류의 받는 측은 공작 이상의 작위를 보유해야 함."
 WJ_mt_success_desc:0 "[wj_mt_source.Custom('WJ_GetLinkedUIName')](이)가 내보낸 군대가 명령대로 [wj_mt_receiver.Custom('WJ_GetLinkedUIName')]의 휘하에 편입되었고, 이전의 병적은 말소되었습니다. 부곡을 개편한 경우라면 국고에서 원래 주인에게 보상금을 지급했습니다."
 WJ_mt_success_title:0 "군적 확정"
 WJ_mt_trait_ambitious:0 "$trait_ambitious$：#N -20#!"
 WJ_mt_trait_arrogant:0 "$trait_arrogant$：#N -8#!"
 WJ_mt_trait_calm:0 "$trait_calm$：#P +5#!"
 WJ_mt_trait_content:0 "$trait_content$：#P +15#!"
 WJ_mt_trait_disloyal:0 "$trait_disloyal$：#N -25#!"
 WJ_mt_trait_generous:0 "$trait_generous$：#P +8#!"
 WJ_mt_trait_greedy:0 "$trait_greedy$：#N -10#!"
 WJ_mt_trait_humble:0 "$trait_humble$：#P +8#!"
 WJ_mt_trait_loyal:0 "$trait_loyal$：#P +30#!"
 WJ_mt_trait_patient:0 "$trait_patient$：#P +5#!"
 WJ_mt_trait_stubborn:0 "$trait_stubborn$：#N -8#!"
 WJ_mt_trait_wrathful:0 "$trait_wrathful$：#N -5#!"
 WJ_mt_zhongwai_exclusive_tt:0 "도독중외가 재임 중일 때는 병적 조정을 그가 관장하며, 천자와 지방 도독 모두 함부로 병력을 움직일 수 없음."
 WJ_zw_request_aid_desc:0 "$celestial_request_military_aid_interaction_desc$\n\n도독중외제군사가 재임 중일 때는 이러한 구원 요청을 그가 천자를 대신하여 재결합니다."
 WJ_zw_send_aid_desc:0 "$celestial_send_military_aid_interaction_desc$\n\n도독중외제군사가 재임 중일 때는 이 명령을 그가 천자를 대신하여 반포합니다."
 WJ_zw_takeover_tt:0 "군정은 이미 도독중외제군사에게 넘어갔으니, 천자가 직접 관여하기 어려움"

 # 来源：localization/simp_chinese/WJ_sili_l_simp_chinese.yml
 WJ_celestial_province_sili:0 "@WJ_sili_administration!사례"
 WJ_celestial_province_sili_benefits:0 "#emphasis #bold 관원 혜택:#!#!\n$EFFECT_LIST_BULLET$직할 세수 #P +15%#!, 개발도 증가 #P +15%#!\n$EFFECT_LIST_BULLET$[GetLaw('celestial_military_appointment_succession_law').GetName](을)를 사용하며, 작위 등급에 따라 작위 병력을 보유함\n$EFFECT_LIST_BULLET$납부한 세금과 작위 병력에 따라 현망을 얻음\n\n#alert_trial @alert_icon!한 천조에 최대 한 명. 경사가 있는 왕국을 보유해야 함.#!"
 WJ_celestial_province_sili_desc:0 "#low 경기는 번성하고 백관이 모여든다. 사례는 경기의 통치와 군사를 함께 관장하며, 이로움을 일으키고 백성을 편안히 하며 조정을 호위하는 것을 소임으로 삼는다.#!"
 WJ_celestial_province_sili_short:0 "사례"
 WJ_celestial_province_sili_text_icon:0 "@WJ_sili_administration!"
 WJ_sili_arrest_reserved_tt:0 "조정이 아직 사례에게 체포의 권한을 허락하지 않음"
 WJ_sili_capital_kingdom_required_tt:0 "천조의 성년 지방관이어야 하며, 경사가 있는 왕국을 보유해야 함(주 작위일 필요는 없음)"
 WJ_sili_office_husband:0 "사례교위의 남편"
 WJ_sili_office_title:0 "사례교위"
 WJ_sili_office_wife:0 "사례교위 부인"
 WJ_sili_realm_suffix:0 "사례"
 WJ_sili_unique_tt:0 "본 조정에 다른 사례가 없거나, 이 인물이 이미 본 조정의 사례임."

 WJ_mr_grant_opening:0 "군직 수여 명령"
 WJ_mr_grant_letter_desc:0 "[ROOT.Char.Custom('WJ_GetLinkedUIName')]에게:\n\n이제 그대에게 [ROOT.Char.Custom('WJMRName')]의 칭호를 내린다. 직분을 삼가 지키고 군대를 정돈하여, 맡긴 바를 저버리지 말라."
 WJ_mr_grant_acknowledge:0 "삼가 명을 받드옵니다."
