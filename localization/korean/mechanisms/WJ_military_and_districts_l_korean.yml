 WJ_dd_aid_available_tt:0 "전쟁의 주도자여야 하며, 도독이 친정할 수 있거나 관할 구역에 아직 부릴 수 있는 장수가 있어야 함. 같은 조정의 내전에서는 단계를 건너뛰어 구원을 청할 수 없음"
 WJ_dd_central_route_tt:0 "도독 구역 안의 관원은 본 구역의 도독에게 구원을 청해야 하며, 도독 본인만이 조정에 직접 구원을 청할 수 있음"
