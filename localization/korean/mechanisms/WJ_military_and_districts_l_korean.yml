 # 来源：localization/simp_chinese/WJ_district_ui_l_simp_chinese.yml
 WJ_dd_civilian_contract_blocked_tt:0 "현임 도독은 군현의 직으로 바꾸어 수여할 수 없음. 먼저 도독을 교체하거나 도독 구역을 폐지해야 함. 도독중외가 재임 중일 때는 삼절과 개부의 일을 그가 관장함"
 WJ_dd_remove_connected_tt:0 "이 왕국을 제외한 뒤에도 나머지 관할 구역은 도독의 치소와 이어져 있어야 함"
 WJ_dd_ui_rules:0 "도독의 군법은 관할 구역의 무관에게만 미치며, 직속 여부는 따지지 않습니다. 문관도 구역에 들어와 구원을 청할 수 있습니다. 조정과 적대하는 동안에는 조정의 이름을 빌려 천자에게 충성하는 관원을 부리거나 처분할 수 없습니다."

