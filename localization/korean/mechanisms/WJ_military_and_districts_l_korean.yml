 WJ_mr_amend:0 "수여할 만하나, 다른 직을 고르라."
 WJ_mr_approval_desc:0 "삼가 아뢰옵니다. [WJ_mr_target.Custom('WJ_GetLinkedUIName')]에게 [WJ_mr_target.Custom('WJMRChoice')]의 칭호를 내려 주시기를 청하옵니다.\n\n정한 칭호는 거듭 숙고한 것으로, 그의 관직과 치소에 제법 걸맞사옵니다. 윤허해 주신다면 앞으로 군중과 관서에서 이 칭호로 부를 것이옵고, 마땅치 않다 여기시면 다른 직을 골라 내려 주시옵소서.\n\n엎드려 재가를 기다리옵니다."
