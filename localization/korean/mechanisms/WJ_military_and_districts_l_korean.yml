 # 来源：localization/simp_chinese/WJ_district_expansion_l_simp_chinese.yml
 WJ_dd_custom_name_1:0 "[ROOT.Title.GetHolder.GetLocalizedText('wj_dd_custom_name_1')]"
 WJ_dd_custom_name_2:0 "[ROOT.Title.GetHolder.GetLocalizedText('wj_dd_custom_name_2')]"
 WJ_dd_petition_acceptance_tt:0 "천자가 당신에게 두는 신임과 당신의 무훈 및 명망이 청하는 절에 걸맞아야 함. 가절이 가장 쉽고, 지절이 그다음이며, 사지절이 가장 어렵고, 구역 확장 요청은 지절과 같음. 충성스러운 자나 천자와 같은 종친인 자는 더 쉽게 허락받고, 불충한 자는 어려움"
 WJ_dd_petition_approve:0 "제왈: 가하다. 청한 대로 하라."
 WJ_dd_petition_approved_opinion:0 "표주 윤허"
 WJ_dd_petition_create_letter:0 "신이 거느린 한 방면의 군무는 흔히 이웃 경계의 여러 군과 얽혀 있사옵니다. 장병들은 비록 각기 소속이 있으나, 길과 수비는 딱 잘라 나누기 어려워, 급한 일이 있을 때마다 다시 사람을 보내 오가며 청하다 보면 구원이 늦어지기 일쑤이옵니다.\n\n삼가 청하옵건대, 신이 거느린 군부를 중심으로 도독을 두어 주군의 여러 군사를 감독하게 하시고, 아울러 모절을 내려 주시어 신이 군무를 총괄할 수 있게 해 주시옵소서.\n\n만약 윤허해 주신다면 신은 내려 주신 권한을 삼가 지키고, 감히 군을 맡은 임무를 가업으로 여기지 않겠사옵니다. 시행 여부는 엎드려 재가를 기다리옵니다."
 WJ_dd_petition_create_letter_1:0 "$WJ_dd_petition_create_letter$\n\n신이 외람되이 가절을 내려 주시기를 청하옵니다."
 WJ_dd_petition_create_letter_2:0 "$WJ_dd_petition_create_letter$\n\n신이 외람되이 지절을 내려 주시기를 청하옵니다."
 WJ_dd_petition_create_letter_3:0 "$WJ_dd_petition_create_letter$\n\n신이 외람되이 사지절을 내려 주시기를 청하옵니다."
 WJ_dd_petition_decline:0 "이 의논은 윤허하지 않으니, 옛 제도를 그대로 지키라."
 WJ_dd_petition_declined_opinion:0 "표주 거부됨"
 WJ_dd_petition_expand_letter:0 "신이 거느린 도독 구역은 [wj_dd_petitioner.MakeScope.Var('wj_dd_petition_target').Char.Custom('WJ_GetLinkedUIName')]의 관할 구역과 맞닿아 있사옵니다. 근래 방어와 구원을 논할 때마다 구역을 넘나들어야 하니, 군령과 길을 함께 돌보기 어렵사옵니다.\n\n삼가 청하옵건대, 그가 거느린 곳 중 본 구역과 이어져 있으면서 다른 구역에 들지 않은 주군을 아울러 신의 절제에 귀속시키시어, 통일하여 조처할 수 있게 해 주시옵소서. 이 의논은 군무의 통속에만 관한 것이며, 봉토와는 관련이 없사옵니다.\n\n청하는 바는 여기까지이옵니다. 엎드려 윤허를 기다리오며, 마땅치 않다 여기시면 신은 지금의 관할 구역을 지키며 직분을 다하겠사옵니다."
 WJ_dd_qinwang_gate:0 "천자가 지원을 받을 수 있는 전쟁의 주도자여야 하며, 충분한 영향력, 위신, 정통성을 갖추어야 함. 이 인물은 본 조정의 현임 도독이어야 하며, 참전할 수 있어야 함"
 WJ_dd_rename_desc:0 "당신은 붓을 들어 이 도독 구역에 새 이름을 지었다. 새 이름은 도독 구역의 장부에만 적힐 뿐, 관할 범위와 통속 관계는 바뀌지 않는다. 훗날 도독이 바뀌어도 이 이름은 그대로 유지된다.\n\n#weak 구역 이름 옆의 이름 변경 아이콘을 우클릭하면 원래 이름으로 되돌릴 수 있습니다.#!"
 WJ_dd_rename_title:0 "도독 구역 이름 변경"
 WJ_dd_reset_name:0 "원래 이름 복원"

 # 来源：localization/simp_chinese/WJ_district_l_simp_chinese.yml
 WJ_dd_add:0 "그 왕국을 관할 구역에 편입"
 WJ_dd_choose_chijie:0 "지절 수여"
 WJ_dd_choose_jiajie:0 "가절 수여"
 WJ_dd_choose_jie_tt:0 "가절, 지절, 사지절 중 하나를 골라야 함"
 WJ_dd_choose_shichijie:0 "사지절 수여"
 WJ_dd_create_failed:0 "도독 구역 설치 실패"
 WJ_dd_create_failed_desc:0 "모절을 수여하지 못하여 도독을 두자는 의논은 무산되었고, 여러 주의 관할 범위는 예전 그대로입니다."
 WJ_dd_lawful_detention_reason:0 "군법 위반 죄인을 법에 따라 이송함"
 WJ_dd_remove:0 "그 왕국을 관할 구역에서 제외"
 WJ_dd_remove_disconnected:0 "관할 구역은 끊어질 수 없음"
 WJ_dd_remove_disconnected_desc:0 "이 주를 빼면 남은 관할 범위가 끊어지므로 조정을 시행하지 못했습니다. 바깥쪽 주부터 정리하거나, 도독 구역을 아예 폐지해야 합니다."
 WJ_dd_replace:0 "이 구역의 도독직을 잇도록 명함"
 WJ_dd_replace_failed:0 "도독 교체 실패"
 WJ_dd_replace_failed_desc:0 "새 도독에게 모절을 수여하지 못하여 도독 교체는 무산되었고, 원래 도독과 관할 구역은 모두 예전 그대로입니다."

 # 来源：localization/simp_chinese/WJ_district_orders_l_simp_chinese.yml
 WJ_dd_action_execute:0 "즉결 참수하여 깃발에 제사 지냄"
 WJ_dd_action_execute_tt:0 "전시의 사지절 도독이어야 하며, 대상은 관할 구역에서 군법을 어긴 관원이어야 함. 가황월을 받은 자는 평시에 조정 전체의 관원에게, 전시에는 본 조정의 모든 봉신과 조신에게까지 미침. 천자와 섭정은 예외임"
 WJ_dd_action_force:0 "군법 위반 선포"
 WJ_dd_action_force_tt:0 "전시의 사지절 도독이어야 하며, 대상은 관할 구역의 관원이어야 함. 가황월을 받은 자는 평시에 조정 전체의 문무 관원에게, 전시에는 본 조정의 모든 봉신과 조신에게까지 미침. 천자와 섭정은 예외임. 대상은 투옥되지 않았고 군법 죄명이 아직 없어야 함"
 WJ_dd_action_justice:0 "정위에게 넘겨 구금"
 WJ_dd_action_justice_tt:0 "대상은 본 조정의 군법을 어겼고, 당신의 모절이나 황월이 미치는 범위 안에 있으며, 투옥되지 않았어야 함. 본 조정의 정위가 직무를 볼 수 있어야 함. 가절을 받은 자는 전시에만 시행 가능"
 WJ_dd_action_self:0 "본부에서 구금"
 WJ_dd_action_self_tt:0 "전시의 사지절 도독이거나 황월을 지녀야 함. 대상은 권한이 미치는 범위 안에 있고, 본 조정의 군법을 어겼으며, 투옥되지 않았어야 함"
 WJ_dd_cancel:0 "취소 / 군령이 이미 효력을 잃음"
 WJ_dd_jie_acceptance_reason:0 "도독 모절의 위엄"
 WJ_dd_order_invalid_desc:0 "군령이 내려질 즈음 관직, 관할 구역, 모절 또는 전황이 이미 바뀌어 이 명령을 시행하지 못했습니다. 천자와 적대하는 동안에는 조정의 이름을 빌려 천자에게 충성하는 관원을 처분할 수도 없습니다."
