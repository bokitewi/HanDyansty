# 汉晋风华：按类型整合；键名与现行文本保留。来源逐键见本批manifest。

 # 来源：localization/simp_chinese/WJ_conquest_l_simp_chinese.yml
 WJ_conquest_accepted_desc:0 "정토의 명은 이미 받들어 행하였소. 나는 이미 [secondary_recipient.Custom('WJ_GetLinkedUIName')] 치하의 [target.GetName]에 선전포고하였기에 삼가 먼저 알리오.\n\n군령이 내려졌으니 군량과 각 부대의 진퇴는 모두 적의 형세에 따라 조처해야 하오. 사자가 길을 떠날 무렵 군중의 일이 한창 번다하니, 이 출사의 보고를 아직 승전보로 쓸 수는 없소. 이후의 득실은 차차 아뢰겠소.\n\n얻은 땅은 정토의 제도에 따라 조정에 귀속하오. 군을 이끄는 책임을 이미 짊어졌으니, 감히 다시 명확한 명령을 받지 못했다는 말로 핑계 삼지 않겠소."
 WJ_conquest_acknowledge:0 "잘 알았다."
 WJ_conquest_commission_accept_tt:0 "이 싸움에서 이기면 [target.GetNameNoTier](은)는 조정에 귀속됩니다."
 WJ_conquest_commission_decline_tt:0 "명을 거역하고 출병하지 않으면 조정에서 비난을 면하기 어렵습니다."
 WJ_conquest_commission_proposal:0 "그대에게 휘하 부대를 이끌고 [target.GetNameNoTier](을)를 정토하라 명한다. 얻은 땅은 조정에 귀속한다."
 WJ_conquest_declined_desc:0 "정토의 명은 받았소. 거듭 생각해 보았으나 이번에는 역시 받들 수 없기에, 삼가 먼저 글을 올려 분명히 말씀드리오.\n\n군 앞에서 오래 기다리게 해서는 안 됨을 알기에, 사양의 말을 좀 더 완곡하게 쓰려 했소. 그러나 말을 아무리 많이 늘어놓은들, 결국 이 편지와 함께 출발할 병마는 없소. 조정이 내가 아직 준비하는 중이라 오해하게 하느니, 출전할 수 없다는 말을 먼저 해 두는 편이 낫겠소.\n\n이번 정토는 다른 안배를 해 주시고, 더는 내가 명을 받들기를 기다리지 마시오. 사자가 서둘러 전하여, 본래 정한 배치가 나 때문에 다시 지체되는 일이 없기를 바라오."
 WJ_conquest_invalid_desc:0 "군 앞으로 보내려던 문서가 다시 당신의 책상 위로 돌아왔다. 속관이 그중 몇몇 명목을 가리키며 설명했다. 오가는 사이에 절제의 관계와 목표가 모두 바뀌어, 이 정토의 명은 이제 시행할 수 없게 되었다는 것이다.\n\n당신은 그에게 다시 한번 말하게 한 뒤에야 문서를 내려놓았다. 앞서의 기세는 이미 널리 알려졌지만, 그렇다고 군대가 움직인 것은 아니었다. 예전 명령대로 재촉한들, 아래에서는 십중팔구 같은 반려 문서를 다시 올려 보낼 것이다.\n\n당신은 원래 의안 옆에 '중지'라는 두 글자를 적었으나, 시선은 여전히 이루지 못한 그 목표에 머물러 있었다. 이를 위해 소모한 위신은 되돌릴 수 없고, 이 일을 당분간 다시 꺼내기도 어려우니, 다른 계획을 세울 수밖에 없다."
 WJ_conquest_invalid_title:0 "정토 중지"
 WJ_conquest_no_target_tt:0 "명을 받은 도독의 관할 구역이 경계 밖의 어느 공작령과 맞닿아 있어야 함"
 WJ_conquest_reply_opening:0 "[recipient.Custom2('AppropriateGreetingPositive', ROOT.Char)]"

