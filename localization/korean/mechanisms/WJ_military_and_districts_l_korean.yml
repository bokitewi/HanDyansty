 WJ_zw_grant_failed_desc:0 "황월을 수여하지 못하여 중외를 총독하라는 명은 무산되었습니다. 본 조정의 현임 섭정이어야만 다시 조서를 청할 수 있습니다. 이번 청원에서는 아무것도 소모되지 않았습니다."
