l_korean:
 WJ_peerage_trait:0 "세습 작위"
 WJ_peerage_trait_desc:0 "이 인물은 천자의 책명을 받아 작위의 반열에 올랐으며, 봉읍의 녹봉을 받아 생활합니다."
 WJ_peer_grant_interaction:0 "책명 봉작"
 WJ_peer_open_tt:0 "봉지를 나열하여 이 사람의 작위 등급과 식읍을 의논하여 정함"
 WJ_peer_choose_rank_tt:0 "작위 등급을 정한 뒤, 봉호와 식읍을 고릅니다."
 WJ_peer_choose_place_tt:0 "주군이라면 그 안으로 들어가 세세히 고르고, 봉할 수 있는 땅이라면 곧바로 이곳으로 조서를 내려 책봉합니다."
 WJ_peer_navigation_tt:0 "지도와 장부를 뒤져 다른 곳을 고릅니다."
 WJ_peer_cancel_tt:0 "이번 책봉은 일단 그만둡니다. 아무것도 수여하지 않으며, 아무것도 소모하지 않습니다."
 WJ_peer_revoke_interaction:0 "작위 박탈"
 WJ_peer_designate_interaction:0 "작위 계승자 지정"
 WJ_peer_rank_desc:0 "당신은 [ROOT.Char.MakeScope.Var('wj_peer_target').Char.GetFirstNameNoTooltip]의 작호를 정해야 합니다. 공신은 훈업으로 작위를 받고, 종실의 여인은 친족의 정으로 공주에 봉해집니다. 작위에는 그 칭호가 있고 식읍에는 그 고을이 있으나, 봉함을 받은 자가 그 땅을 다스리지는 않으며, 원래 맡던 관직도 이로 인해 바뀌지 않습니다."
 WJ_peer_pick_title:0 "봉지를 골라 책봉"
 WJ_peer_pick_desc:0 "담당 관청이 지도와 장부를 펼쳐, 아직 분봉할 수 있는 주군현읍을 하나하나 나열했습니다. 봉호와 식읍을 고르면 곧 책봉의 조서를 내릴 수 있습니다."
 WJ_peer_next:0 "다음 페이지"
 WJ_peer_back:0 "이전 단계로 돌아가기"
 WJ_peer_restart:0 "작위 등급 다시 선택"
 WJ_peer_confirm_title:0 "봉작 조명 반포"
 WJ_peer_confirm:0 "정식으로 수여"
 WJ_peer_awarded:0 "봉작 조명"
 WJ_peer_inherited:0 "작위 계승"
 WJ_peer_awarded_desc:0 "책서가 도착하자, 당신은 낭독을 다 듣고서야 그것을 받아 들었다. #high [ROOT.Char.Custom('WJ_PeerName')]#!이라는 몇 글자가 눈앞에 놓였고, 해마다의 녹봉은 [ROOT.Char.MakeScope.Var('wj_peer_food').Title.GetBaseNameNoTierNoTooltip]에 걸리게 되었다. 앞으로의 호칭과 집안 살림에 모두 새로운 근거가 생긴 것이다.\n\n시자가 책서를 어디에 보관할지 물었으나, 당신은 한동안 대답하지 않고 새 호칭을 다시 한번 바라보았다. 앞으로 찾아오는 이들이 명함을 내밀고 가문을 이야기할 때면, 아마 먼저 이 몇 글자를 덧붙이게 될 것이다.\n\n식읍은 해마다의 녹봉만을 대줄 뿐, 그 땅이 이로써 당신의 다스림 아래 들어오는 것은 아니며, 원래의 관직과 봉지도 모두 예전 그대로다. 그래도 책서를 덮을 때, 당신은 그것이 책상 위의 다른 물건들과는 어딘가 다르다고 느꼈다."
 WJ_peer_removed:0 "작위 삭제됨"
 WJ_peer_removed_desc:0 "처분 문서의 낭독은 끝났지만, 서리는 여전히 책상 앞에 서서 앞으로의 호칭을 확인해 주기를 기다렸다. 당신은 그제야 그가 새로 옮겨 적은 명부를 보았다. 예전 작호가 있던 자리는 이미 비어 있었다.\n\n어떤 호칭은 오래 듣다 보면, 그것도 거두어질 수 있다는 사실을 잊게 된다. 식읍과 작록이 함께 혁파되었으니, 집안의 씀씀이와 후손을 위한 계획도 더는 예전처럼 셈할 수 없다. 남들이 여전히 옛 호칭으로 부른다면, 이 빈자리만 더욱 눈에 거슬릴 뿐이다.\n\n당신은 그에게 문서를 두고 가게 했다. 관직과 봉지는 이로 인해 바뀌지 않았으니, 보내올 공무는 내일도 그대로 올 것이다. 다만 그 문서들의 첫머리에는 다시는 예전의 그 몇 글자를 쓸 수 없으리라."
 WJ_peer_income:0 "식읍 세록"
 WJ_peer_income_desc:0 "서리가 와서 아뢰기를, 올해 식읍의 세록은 모두 금화 [ROOT.Char.MakeScope.Var('wj_peer_amount').GetValue|0]이며, 이미 부고에 들였다고 했다. 당신은 다른 지출 문서를 넘겨 보던 중이었는데, 듣고 나서 그에게 증빙을 가까이 가져오게 했다.\n\n이 돈은 식읍의 부세에서 나온 것으로, 그곳의 영주가 바뀌더라도 작록은 옛 제도대로 지급된다. 당신은 그 내력을 한 번 훑어보고서야 증빙을 돌려주었다. 줄곧 미뤄 두었던 몇 가지 씀씀이도 이제야 융통할 여지가 생겼다.\n\n시자가 또 할 일이 있는지 묻자 당신은 손을 저어 물러가게 했으나, 시선은 다시 그 지출 문서로 돌아갔다. 새로 들어온 수입도 오래 한가하게 남아 있지는 않을 것이다."
 WJ_peer_ack:0 "알았다"
