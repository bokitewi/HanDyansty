 WJ_peer_grant_failed:0 "책봉 실패"
 WJ_peer_grant_failed_desc:0 "책서가 완성될 무렵 담당 관청이 와서 아뢰었다. 고른 땅이 이미 다른 이에게 속했거나, 봉함을 받을 사람의 사정이 바뀌어 이 책명은 끝내 내릴 수 없게 되었다는 것이다.\n\n이번에는 아무것도 소모되지 않았다. 다른 땅을 고를 수도 있고, 이대로 그만둘 수도 있다."
 WJ_peer_inherited_desc:0 "선대의 책서와 인수가 이제 당신의 손에 넘어왔다. #high [ROOT.Char.Custom('WJ_PeerName')]#!이라는 이 작호를, [ROOT.Char.MakeScope.Var('wj_peer_food').Title.GetBaseNameNoTierNoTooltip]의 세록과 함께 이제부터 당신이 이어받는다.\n\n집안의 늙은 하인이 옛 책서를 받쳐 들고 나와, 그 위에 대대로 적힌 이름들을 가리키며 보여 주었다. 이름은 여러 번 바뀌었으나, 작호는 줄곧 이것 하나였다.\n\n앞으로 누군가 당신의 가문을 이야기할 때 먼저 입에 올리는 것도, 아마 여전히 이 몇 글자일 것이다."
 WJ_peer_grant_interaction_desc:0 "천자의 명으로 이 사람의 작위 등급과 식읍을 의논하여 정합니다."
 WJ_peer_revoke_interaction_desc:0 "이 사람의 작호를 삭탈하고 식읍의 세록을 거두어들입니다."
 SanGong_SeparatedCloseKin_modifier_desc:0 "이 집안은 황실의 가까운 방계에서 나와, 비록 따로 가문을 세웠으나 여전히 종친의 반열에 있습니다."
