l_korean:
# 汉晋风华：按类型整合；键名与现行文本保留。来源逐键见本批manifest。

 # 来源：localization/simp_chinese/WJ_contract_privileges_l_simp_chinese.yml
 WJ_chijie:0 "지절"
 WJ_chijie_desc:0 "#emphasis 특권:#!\n$EFFECT_LIST_BULLET$평시와 전시 모두 관할 구역의 공작급 이하 관원을 절제할 수 있음\n$EFFECT_LIST_BULLET$구역 내 원군을 징발할 수 있으며, 명을 받은 자는 기한 내에 출병해야 함\n$EFFECT_LIST_BULLET$군법을 어긴 자를 정위에게 넘겨 구금할 수 있음\n$EFFECT_LIST_BULLET$관할 구역의 작위 병력을 이동시켜 사병으로 개편할 수 있음$WJ_mt_jie_transfer_rules$\n\n#flavor 지절을 받은 자는 평시와 전시를 가리지 않고 장수들을 절제할 수 있으니, 그 권한이 가절보다 위에 있다.#!"
 WJ_chijie_short:0 "지절"
 WJ_huangyue_grant:0 "가황월 수여"
 WJ_huangyue_grant_desc:0 "#emphasis 특권:#!\n$EFFECT_LIST_BULLET$평시에는 조정 전체의 왕국급 이하 문무 관원에게 군법을 시행할 수 있음\n$EFFECT_LIST_BULLET$전시에는 본 조정의 모든 봉신과 조신에게 미치나, 천자와 섭정 본인은 예외임\n$EFFECT_LIST_BULLET$곧바로 죄를 정하고 구금할 수 있으며, 투옥하지 않고 참하여 깃발에 제사 지낼 수도 있음\n$EFFECT_LIST_BULLET$도독중외제군사와 함께 수여되고 함께 해임됨. 섭정의 자리를 잃으면 즉시 회수됨\n\n#flavor 황월은 본래 천자의 도끼이다. 이를 신하에게 빌려준다는 것은 천자를 대신하여 군법을 행하고 주벌을 전단하도록 허락한다는 뜻이다.#!"
 WJ_huangyue_grant_short:0 "가황월"
 WJ_huangyue_none:0 "가황월 없음"
 WJ_huangyue_none_desc:0 "#flavor 가황월을 받지 않았다. 이 권한은 조서를 받들어 중외제군사를 총독할 때 함께 수여되어야 하며, 따로 계약을 고쳐 열 수 없다.#!"
 WJ_huangyue_none_short:0 "미수여"
 WJ_jiajie:0 "가절"
 WJ_jiajie_desc:0 "#emphasis 특권:#!\n$EFFECT_LIST_BULLET$전시에 관할 구역의 공작급 이하 관원을 절제할 수 있음\n$EFFECT_LIST_BULLET$구역 내 원군을 징발할 수 있음\n$EFFECT_LIST_BULLET$군법을 어긴 자를 정위에게 넘겨 구금할 수 있음\n$EFFECT_LIST_BULLET$관할 구역의 작위 병력을 이동시켜 사병으로 개편할 수 있음$WJ_mt_jie_transfer_rules$\n\n#flavor 가절을 받은 자는 오직 군중에서, 오직 전시에만 장수들을 절제할 수 있다.#!"
 WJ_jiajie_short:0 "가절"
 WJ_kaifu_grant:0 "개부 수여"
 WJ_kaifu_grant_desc:0 "#emphasis 특권:#!\n$EFFECT_LIST_BULLET$부를 열고 속관을 두어 사인을 막부로 불러들일 수 있음\n$EFFECT_LIST_BULLET$훗날 공부의 직을 내려놓더라도 자격이 남아 있는 한 이 특별 수여는 그대로 유지됨\n\n#flavor 개부한 자는 장사와 연속을 스스로 둘 수 있으니, 마치 조정 안의 또 하나의 작은 조정과 같다.#!"
 WJ_kaifu_grant_short:0 "개부"
 WJ_kaifu_none:0 "별도 개부 수여 없음"
 WJ_kaifu_none_desc:0 "#flavor 개부를 특별히 수여받지 않았다. 삼공, 대장군 등 여섯 직에 있으면 여전히 직에 따라 개부할 수 있다.#!"
 WJ_kaifu_none_short:0 "별도 수여 없음"
 WJ_kaifu_office:0 "재임 개부"
 WJ_kaifu_office_grant:0 "여섯 직 재임 개부"
 WJ_kaifu_office_grant_desc:0 "#flavor 대장군, 태부, 승상, 사도, 사공, 태위는 재임하는 동안 개부할 수 있으며, 직에서 물러나면 폐지된다.#!"
 WJ_kaifu_office_grant_short:0 "재임 개부"
 WJ_kaifu_office_none:0 "재임 개부 없음"
 WJ_kaifu_office_none_desc:0 "#flavor 여섯 직에 있지 않으니, 직에 따른 개부의 권한이 없다.#!"
 WJ_kaifu_office_none_short:0 "재임 개부 없음"
 WJ_mt_jie_transfer_rules:0 "\n$EFFECT_LIST_BULLET$병력 이동은 관할 구역 안으로 한정됨. 이동 명령을 거역하는 자는 군법으로 죄를 물음"
 WJ_privilege_kaifu_locked_tt:0 "여섯 직에 있는 자는 직에 따라 개부하며 변경할 수 없음. 별도로 특별 수여된 개부는 그대로 유지됨"
 WJ_privilege_kaifu_rank_tt:0 "본 조정의 현임 조신이거나, 왕국급 이상의 지방 장관이어야 함"
 WJ_privilege_sanjie_eligible_tt:0 "현임 도독이어야 함. 모절은 도독 구역을 설치할 때 처음 수여해야 함"
 WJ_privilege_six_offices_tt:0 "대장군, 태부, 승상, 사도, 사공, 태위가 재임 중일 때만 가황월을 수여할 수 있음"
 WJ_sanjie_none_desc:0 "#flavor 도독이 아니므로 절제의 권한을 행사할 수 없다. 모절은 도독 구역을 설치할 때 처음 수여해야 하며, 그 뒤에야 바꾸어 수여할 수 있다.#!"
 WJ_shichijie:0 "사지절"
 WJ_shichijie_desc:0 "#emphasis 특권:#!\n$EFFECT_LIST_BULLET$평시와 전시 모두 관할 구역의 왕국급 이하 관원을 지휘할 수 있음\n$EFFECT_LIST_BULLET$관할 구역의 작위 병력을 이동시켜 사병으로 개편할 수 있음$WJ_mt_jie_transfer_rules$\n$EFFECT_LIST_BULLET$전시에는 곧바로 죄를 정할 수 있으나, [tyranny|E](와)과 [dread|E](을)를 초래함\n$EFFECT_LIST_BULLET$죄인은 정위에게 넘기거나, 직접 가두거나, 즉시 참하여 깃발에 제사 지내 군의 위엄을 떨칠 수 있음\n$EFFECT_LIST_BULLET$군법으로 정한 죄는 전쟁이 끝나도 저절로 사라지지 않음\n\n#flavor 사지절을 받은 자는 절월을 손에 쥐었으니, 군중에 명을 어기는 자가 있으면 먼저 베고 나중에 아뢸 수 있다.#!"
 WJ_shichijie_short:0 "사지절"

 # 来源：localization/simp_chinese/WJ_province_boundary_l_simp_chinese.yml
 WJ_province_type_closed_hanjin_tt:0 "한나라 제도에는 감, 도회, 도호의 설치가 없으며, 군현, 군수, 사례만 있습니다."

 # 来源：localization/simp_chinese/WJ1_laws_l_simp_chinese.yml

 WJ_zhoumu:0 "[wj_zhoumu|E]"
 WJ_zhoumu_none:0 "자사 유임"
 WJ_zhoumu_none_short:0 "자사"
 WJ_zhoumu_none_desc:0 "군수의 옛 임무를 따라 여전히 자사로서 주를 다스리며, 주목의 증봉과 병력 정원은 누리지 못합니다."
 WJ_zhoumu_grant:0 "주목 발탁"
 WJ_zhoumu_grant_short:0 "주목"
 WJ_zhoumu_grant_desc:0 "#emphasis 특권:#!\n$EFFECT_LIST_BULLET$봉록과 작위 병력 정원이 늘어남\n$EFFECT_LIST_BULLET$천자가 그 권세를 경계하고 두려워함\n$EFFECT_LIST_BULLET$도독의 권한을 겸하지 않으며, 절월, 개부, 군직도 따르지 않음\n$EFFECT_LIST_BULLET$본인이 스스로 청할 경우 천자에 대한 [hook|E](을)를 사용해야 하며, 천자가 직접 수여하면 필요 없음\n\n#flavor 자사에서 주목이 되면 봉록은 더 두텁고 병력은 더 많아지니, 이를 지켜보는 천자는 꺼리는 마음을 품지 않을 수 없다.#!"
 WJ_zhoumu_eligible_tt:0 "한진 천조의 왕국급 지방 군수 관원이어야 하며, 조신이나 사족의 가장이 아니어야 하고, 황제의 수도가 속한 법리상 왕국을 보유하지 않아야 함"
 WJ_zhoumu_batch_tt:0 "발탁은 본 조정의 황제가 처리해야 하며, 신청자는 주목 자격을 갖추어야 함. 같은 수정에서 비군수 계약으로 전환할 수 없음"
 WJ_zhoumu_hook_tt:0 "스스로 주목이 되기를 청하려면 천자에 대한 당신의 [hook|E](을)를 사용해야 함"
 WJ_zhoumu_imperial_distrust:0 "주목의 권세가 무거움"
