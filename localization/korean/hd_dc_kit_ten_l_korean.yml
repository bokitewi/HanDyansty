l_korean:
 # 天朝循环·时代特色：紧张期套件（docs/天朝循环_时代特色重制计划.md §3.3）

 # ---------- 决议 ----------
 hd_dc_kit_ten_restoration_decision: "중흥 개혁"
 hd_dc_kit_ten_restoration_decision_desc: "국세가 쇠퇴하고 인심은 변화를 바란다. 모든 것을 걸고 조정의 기강을 바로잡고 호족을 억누르며 부고를 채운다면 중흥을 다시 이룰 수 있을지도 모른다. 그러나 실패한다면 오히려 몰락을 재촉할까 두렵다."
 hd_dc_kit_ten_restoration_decision_tooltip: "조정의 기강을 바로잡아 중흥을 다시 이루고자 함"
 hd_dc_kit_ten_restoration_decision_confirm: "중흥에 힘씀"
 hd_dc_kit_ten_restoration_decision_effect_tt: "이후 10년 동안 관리의 기강, 호족, 재정 등의 문제가 잇달아 닥칠 것입니다. 성패는 당신의 역량, 공경들의 재능, 존왕 세력의 기세에 달려 있으며, 현재 성공 가능성은 약 #high [ROOT.Char.MakeScope.ScriptValue('hd_dc_kit_ten_restoration_chance_value')|0]%#! 입니다. 중흥에 성공하면 천하가 다시 치세로 돌아가고, 실패하면 몰락이 눈앞에 닥칠 것입니다."
 hd_dc_kit_ten_if_success_tt: "중흥에 성공하면:"
 hd_dc_kit_ten_if_failure_tt: "막바지에 실패하면:"
 hd_dc_kit_ten_restoration_once_tt: "당신은 아직 중흥 개혁을 시도한 적이 없음"
 hd_dc_kit_ten_restoration_legitimacy_tt: "당신의 [legitimacy|E](이)가 아직 최하 단계로 떨어지지 않았음"
 hd_dc_kit_ten_prohibition_decision: "당고"
 hd_dc_kit_ten_prohibition_decision_desc: "당인들이 서로 결탁하여 조정을 비방하고 있다. 그중 한 당을 골라 벼슬길을 막아 금고하거나, 일망타진한다."
 hd_dc_kit_ten_prohibition_decision_tooltip: "붕당 하나를 골라 당고를 시행함"
 hd_dc_kit_ten_prohibition_decision_confirm: "당고의 옥사를 일으킴"
 hd_dc_kit_ten_prohibition_decision_effect_tt: "조정의 한 당을 고른 뒤 처벌의 수위를 정합니다. 그 관직을 모두 파하고 집에 금고하거나, 그 당수를 옥에 가두고 일망타진할 수 있습니다. 어느 쪽이든 조정의 정국은 이로 인해 크게 무너질 것입니다."
 hd_dc_kit_ten_prohibition_party_tt: "조정에 당수를 세운 붕당이 있음"

 # ---------- 修正 ----------
 hd_dc_kit_ten_chaos_consort_modifier: "난상: 외척 전권"
 hd_dc_kit_ten_chaos_consort_modifier_desc: "외척이 요직을 차지하여 정사가 사가에서 나오니, 천자의 위신이 날로 떨어진다. 외척당의 기세가 크게 오르고, 그 당수는 공명을 손쉽게 얻는다."
 hd_dc_kit_ten_chaos_eunuch_modifier: "난상: 환관 간정"
 hd_dc_kit_ten_chaos_eunuch_modifier_desc: "환관이 궁중을 드나들며 천자의 말을 제멋대로 전하니, 안팎이 막혀 버렸다. 환관당의 기세가 크게 오르고, 때때로 내탕을 착복하는 일이 생기며, 대신들은 날로 마음이 떠난다."
 hd_dc_kit_ten_chaos_warlord_modifier: "난상: 권신과 번진"
 hd_dc_kit_ten_chaos_warlord_modifier_desc: "권신이 병력을 끼고 번진이 발호하니, 조정의 호령이 경기 밖으로 나가지 못한다. 무훈당의 기세가 크게 오르고, 제후들이 앞다투어 사병을 늘린다."
 hd_dc_kit_ten_chaos_partisan_modifier: "난상: 당쟁 내분"
 hd_dc_kit_ten_chaos_partisan_modifier_desc: "붕당이 서로 공격하여 시비가 벌떼처럼 일어난다. 여러 당의 원한이 날로 깊어지니, 논의하는 신하들이 서로 헐뜯느라 지쳐 정무에 마음을 두지 못한다."
 hd_dc_kit_ten_warlord_vassal_modifier: "번진의 자중"
 hd_dc_kit_ten_warlord_vassal_modifier_desc: "조정이 지방의 병력에 크게 의지하니, 제후들이 사병을 늘릴 수 있다."
 hd_dc_kit_ten_partisan_official_modifier: "당쟁으로 산만함"
 hd_dc_kit_ten_partisan_official_modifier_desc: "당쟁이 한창이라, 이 자는 쏟아지는 공격에 대응하느라 지쳐 본업에 마음을 두지 못한다."
 hd_dc_kit_ten_consort_leader_modifier: "외척의 귀성"
 hd_dc_kit_ten_consort_leader_modifier_desc: "외척의 권세가 하늘을 찌르고 문하에 빌붙는 자가 많아, 공명을 손쉽게 얻는다."
 hd_dc_kit_ten_restoration_success_modifier: "중흥의 치세"
 hd_dc_kit_ten_restoration_success_modifier_desc: "개혁이 큰 성과를 거두어 기강이 다시 서니, 천하가 한목소리로 중흥을 칭송한다."
 hd_dc_kit_ten_restoration_failed_modifier: "좌절된 중흥의 꿈"
 hd_dc_kit_ten_restoration_failed_modifier_desc: "개혁이 막바지에 실패하여 인심이 더욱 흩어졌다."
 hd_dc_kit_ten_forged_evidence_modifier: "죄증 날조"
 hd_dc_kit_ten_forged_evidence_modifier_desc: "한 무더기의 죄증을 꾸며 내어 탄핵문에 더 무게가 실리지만, 그만큼 들통나기도 쉽다."
 hd_dc_kit_ten_forged_evidence_2_modifier: "위증 재조작"
 hd_dc_kit_ten_forged_evidence_2_modifier_desc: "$hd_dc_kit_ten_forged_evidence_modifier_desc$"

 # ---------- 好感 ----------
 hd_dc_kit_ten_impeached_me_opinion: "나를 탄핵한 적이 있음"
 hd_dc_kit_ten_forged_against_me_opinion: "죄명을 꾸며 나를 모함함"
 hd_dc_kit_ten_forgery_disgrace_opinion: "죄증 날조"
 hd_dc_kit_ten_prohibition_opinion: "당고로 금고됨"
 hd_dc_kit_ten_purge_opinion: "당인들이 일망타진됨"
 hd_dc_kit_ten_qjc_rebel_opinion: "군사를 일으켜 궁궐을 범함"
 hd_dc_kit_ten_qjc_removed_opinion: "청군측을 명분으로 나를 쫓아냄"
 hd_dc_kit_ten_eunuch_meddling_opinion: "환관의 간정"
 hd_dc_kit_ten_favor_opinion: "은혜로운 대우를 받음"
 hd_dc_kit_ten_slight_opinion: "냉대를 받음"
 hd_dc_kit_ten_reprimand_opinion: "질책을 받음"

 # ---------- 弹劾（阴谋） ----------
 hd_dc_ten_impeach: "탄핵"
 hd_dc_ten_impeach_action: "탄핵"
 hd_dc_ten_impeach_desc: "나는 [SCHEME.GetTargetCharacter.GetShortUINamePossessive] 죄증을 모아 탄핵 상소를 올릴 준비를 하고 있다"
 hd_dc_ten_impeach_desc_general: "$hd_dc_ten_impeach$ [scheme|E](은)는 권신의 죄상을 수집하여 탄핵 상소를 올림으로써, 그를 파면하고 옥에 가두는 것을 목표로 합니다.\n\n모은 죄증이 많을수록 탄핵문에 무게가 실립니다. 돈을 들여 죄증을 날조할 수도 있지만, 위증이 한번 들통나면 탄핵은 반드시 실패하고 당신도 신세를 망치게 됩니다."
 HD_DC_TEN_IMPEACH_SUCCESS_DESC: "탄핵문이 상달되어 권신이 파면되고 옥에 갇힘"
 HD_DC_TEN_IMPEACH_DISCOVERY_DESC: "탄핵 모의가 발각됨"
 HD_DC_TEN_IMPEACH_VS_STRONG: "권신의 세력이 큼"
 HD_DC_TEN_IMPEACH_EMPEROR_DISLIKES: "천자가 본래 이 자를 좋아하지 않음"
 hd_dc_ten_impeach_invalidated_title: "@scheme_icon!탄핵 중단"
 hd_dc_ten_impeach_invalidated_tt: "상대가 이미 권력을 잃었거나 당신이 더 이상 천자의 조정에 있지 않아, 탄핵할 이유가 없어졌습니다."
 hd_dc_ten_start_impeach_interaction: "탄핵#weak (모략)#!"
 hd_dc_ten_start_impeach_interaction_desc: "[recipient.GetShortUINamePossessive] 죄증을 모아 탄핵 상소를 올립니다. 탄핵문이 받아들여지면 [recipient.GetSheHe](은)는 파면되고 옥에 갇힙니다."
 start_hd_dc_ten_impeach_notification: "탄핵"
 hd_dc_ten_impeach_vip_tt: "중요 인물(왕후, 당수, 재상 등)만이 탄핵 상소를 올릴 수 있음"

 # ---------- 清君侧 ----------
 hd_dc_ten_qingjunce_interaction: "늑병입조·청군측"
 hd_dc_ten_qingjunce_interaction_desc: "“청군측”을 명분으로 [recipient.GetShortUIName](을)를 간신으로 지목하고, 군사를 일으켜 천자에게 그 자를 내놓으라 요구합니다."
 hd_dc_ten_qingjunce_interaction_tt: "당신은 “청군측”을 명분으로 천자에게 군사를 일으킵니다. 승리하면 간신은 파면되어 옥에 갇히고, 당신은 천자의 종신 [regent|E](이)가 됩니다. 패배하면 당신이 옥에 갇힙니다. 이 전쟁은 간신을 제거하기 위한 것일 뿐, 성지를 다투지 않습니다."
 hd_dc_ten_qjc_peace_tt: "당신은 현재 천자와 교전 중이 아님"
 hd_dc_ten_qingjunce_cb: "청군측"
 hd_dc_ten_qingjunce_cb_desc: "간신을 제거한다는 명분으로 군사를 일으켜 천자에게 그 자를 내놓으라 요구합니다."
 HD_DC_TEN_QJC_CB_NAME: "청군측"
 HD_DC_TEN_QJC_WAR_NAME: "[ATTACKER.GetShortUIName]의 청군측 전쟁"
 HD_DC_TEN_QJC_WAR_NAME_BASE: "청군측 전쟁"
 hd_dc_ten_qingjunce_cb_victory_desc: "권신은 파면되어 옥에 갇히고, [attacker.GetShortUIName](은)는 천자의 종신 [regent|E](이)가 됩니다."
 hd_dc_ten_qingjunce_cb_white_peace_desc: "양측이 군사를 거두고, 권신은 여전히 그 자리에 남습니다."
 hd_dc_ten_qingjunce_cb_defeat_desc: "[attacker.GetShortUIName](은)는 패배하여 천자에게 감금됩니다."

 # ---------- 宦官贪墨 ----------
 hd_dc_ten_embezzle_toast: "환관이 내탕을 착복함"
 hd_dc_ten_embezzle_toast_tt: "환관이 출납의 편의를 틈타 내탕의 일부를 착복했습니다."

 # ---------- 通用提示 ----------
 hd_dc_ten_restoration_chance_up_tt: "중흥에 대한 가망이 몇 푼 더 늘어남"
 hd_dc_ten_restoration_chance_up_small_tt: "중흥에 대한 가망이 조금 늘어남"
 hd_dc_ten_restoration_chance_down_tt: "중흥이 또 몇 푼 더 어려워짐"
 hd_dc_ten_remove_minister_tt: "관직을 파하고 옥에 가두어 죄를 묻습니다."

 # ---------- 中兴改革事件 ----------
 hd_dc_ten.0001.t: "중흥에 힘씀"
 hd_dc_ten.0001.desc: "조서가 반포되었다. 관리의 기강을 바로잡고, 호족을 억누르며, 부고를 채우라는 것이다. 조정의 문무백관이 서로 얼굴만 바라보았다. 이것이 조정이 스스로를 구할 마지막 기회임을 누구나 알고 있었다."
 hd_dc_ten.0001.a: "성패는 이 한 번에 달렸다."
 hd_dc_ten.0001.a.tt: "10년 뒤면 성패가 절로 드러날 것입니다. 현재 성공 가능성은 약 #high [ROOT.Char.MakeScope.ScriptValue('hd_dc_kit_ten_restoration_chance_value')|0]%#! 입니다."
 hd_dc_ten.0002.t: "관리 기강 확립"
 hd_dc_ten.0002.desc: "개혁의 시작은 무엇보다 관리의 기강에 있다. 어사가 아뢰기를, 각지의 관리들 사이에 탐욕과 부패가 만연하여 엄히 다스리지 않으면 새 정책을 시행할 길이 없다고 한다. 다만 기강을 바로잡으면 반드시 많은 이들의 미움을 사게 될 것이다."
 hd_dc_ten.0002.a: "관리의 기강을 바로잡되, 권세가라 해서 피하지 않는다."
 hd_dc_ten.0002.b: "옛 관례를 따라 천천히 도모한다."
 hd_dc_ten.0003.t: "호족의 방해"
 hd_dc_ten.0003.desc: "개혁이 지방 호족의 이익을 건드렸다. [hd_dc_ten_magnate.GetShortUIName](이)가 공공연히 새 정책에 맞서자, 각지의 호족들이 일제히 형세를 관망하고 있다."
 hd_dc_ten.0003.a: "호족을 쳐서 본보기로 삼는다."
 hd_dc_ten.0003.b: "잠시 타협하여 그들의 마음을 안심시킨다."
 hd_dc_ten.0004.t: "재정 부족"
 hd_dc_ten.0004.desc: "개혁이 막바지에 이르렀으나 부고는 이미 바닥을 드러냈다. 대사농이 상주하여, 재물과 군량을 마련해 큰 공을 끝맺게 해 달라고 청하였다."
 hd_dc_ten.0004.a: "내탕을 풀어 나라의 재용을 돕는다."
 hd_dc_ten.0004.b: "세금을 더 거두어 급한 데 쓴다."
 hd_dc_ten.0004.c: "씀씀이를 줄여 간신히 버틴다."
 hd_dc_ten.0005.t: "중흥의 성패"
 hd_dc_ten.0005.desc_success: "십 년 동안 힘을 기르고, 십 년 동안 가르쳤다. 기강이 다시 서고 부고가 가득 찼으며 호족은 자취를 감추니, 사방이 한목소리로 중흥의 군주라 칭송한다."
 hd_dc_ten.0005.desc_failure: "십 년의 고심이 끝내 물거품이 되었다. 쌓인 폐단은 되돌릴 수 없고 인심은 더욱 흩어지니, 조정은 더 이상 하늘의 뜻을 돌이킬 힘이 없다."
 hd_dc_ten.0005.a: "하늘의 뜻이 이러하구나."
 hd_dc_ten.0005.a_success: "조종의 영령이 보살피시니, 사직의 복이로다."

 # ---------- 党锢事件 ----------
 hd_dc_ten.0011.t: "당고"
 hd_dc_ten.0011.desc: "당인들이 서로 결탁하여 조정을 비방하니, 이제는 처치하지 않을 수 없는 지경에 이르렀다. 어느 당부터 칼을 댈 것인가?"
 hd_dc_ten.0011.huanguan: "환관당을 다스린다."
 hd_dc_ten.0011.waiqi: "외척당을 다스린다."
 hd_dc_ten.0011.wuxun: "무훈당을 다스린다."
 hd_dc_ten.0011.shizu: "세족당을 다스린다."
 hd_dc_ten.0011.hanmen: "한문당을 다스린다."
 hd_dc_ten.0011.cancel: "이 일은 나중에 다시 논의하겠다."
 hd_dc_ten.0012.t: "당고의 옥"
 hd_dc_ten.0012.desc: "[hd_dc_ten_party_leader.GetShortUIName](와)과 그 일당의 명단이 이미 올라왔다. 너그럽게 할지 엄하게 할지는 오직 한 생각에 달렸다."
 hd_dc_ten.0012.a: "그 당을 금고하여 벼슬길에 나아가지 못하게 한다."
 hd_dc_ten.0012.a.tt: "[hd_dc_ten_party_leader.GetShortUIName]의 일당은 모두 파면되고 10년 동안 집에 금고되어 다시 벼슬할 수 없습니다. 당인들은 모두 당신에게 이를 갈 것입니다."
 hd_dc_ten.0012.b: "일망타진하라!"
 hd_dc_ten.0012.b.tt: "당수 [hd_dc_ten_party_leader.GetShortUIName](와)과 당의 요인들이 모두 옥에 갇히고, 그 당의 세력은 연기처럼 사라져 10년 동안 다시 당을 이루지 못합니다. 남은 당인들은 뼈에 사무치도록 당신을 원망할 것입니다.\n#EMP 당 안에서 병력을 쥔 자가 “청군측”을 명분으로 군사를 일으킬 수도 있습니다.#!"
 hd_dc_ten.0013.t: "당인들의 부탁"
 hd_dc_ten.0013.desc: "당인들이 일망타진되었다는 소식이 전해지자, 화를 면한 자들이 앞다투어 찾아와 당신을 우두머리로 추대하며, “청군측”을 명분으로 [hd_dc_ten_pm_pick.GetShortUIName](을)를 주살해 달라고 청한다."
 hd_dc_ten.0013.a: "군사를 일으켜 군측을 깨끗이 하리라!"
 hd_dc_ten.0013.b: "참고 드러내지 않는다."

 # ---------- 弹劾事件 ----------
 hd_dc_ten.0021.t: "갖추어지는 죄증"
 hd_dc_ten.0021.desc: "[hd_dc_ten_impeach_target_preview.GetShortUIName](을)를 탄핵할 죄증이 당신의 책상 위에 또 하나 늘었다. 지금 바로 상소를 올릴 것인가, 아니면 좀 더 기다릴 것인가? 증거가 빈약하다 여긴다면, 대신 “채워” 주겠다는 이도 있다. 값만 맞는다면 말이다."
 hd_dc_ten.0021.a: "탄핵 상소를 올린다!"
 hd_dc_ten.0021.a.tt: "탄핵문이 올라가면 천자가 결정합니다. 죄증이 충분할수록 받아들여지기 쉽습니다. 상소가 받아들여지면 [hd_dc_ten_impeach_target_preview.GetShortUIName](은)는 파면되어 옥에 갇히고, 당신의 명성도 크게 높아집니다:"
 hd_dc_ten.0021.b: "거금을 들여 위증을 사들인다."
 hd_dc_ten.0021.b.tt: "#EMP 위증이 한번 들통나면 탄핵은 반드시 실패하고, 당신도 신세를 망치게 됩니다.#!"
 hd_dc_ten.0021.c: "좀 더 시간을 들여 모은다."
 hd_dc_ten.0022.t: "탄핵 이후"
 hd_dc_ten.0022.desc_success: "탄핵문이 올라가자 천자께서 크게 노하셨다. [hd_dc_ten_impeach_target.GetShortUIName](은)는 관직을 박탈당하고 옥에 갇혀 죄를 추궁받게 되었다."
 hd_dc_ten.0022.desc_forged: "탄핵문에 열거된 죄증을 담당 관청에서 다시 조사해 보니, 뜻밖에도 허점이 여럿 드러났다. 날조한 일이 탄로 나 탄핵은 흐지부지되었고, 오히려 당신이 뭇사람의 표적이 되었다."
 hd_dc_ten.0022.desc_failure: "탄핵문은 올라가자마자 감감무소식이 되었다. [hd_dc_ten_impeach_target.GetShortUIName](은)는 여전히 그 자리에 편안히 앉아 있으며, 뒤에서 누가 일을 꾸몄는지도 이미 알고 있다."
 hd_dc_ten.0022.a: "앞으로의 일을 지켜보자."
 hd_dc_ten.0023.t: "탄핵당하다"
 hd_dc_ten.0023.desc_success: "[hd_dc_ten_impeach_owner.GetShortUIName](이)가 탄핵 상소를 올렸고, 천자께서 이를 받아들이셨다. 당신은 관직을 박탈당하고 옥에 갇혔다."
 hd_dc_ten.0023.desc_forged: "[hd_dc_ten_impeach_owner.GetShortUIName](이)가 당신을 탄핵하는 상소를 올렸으나, 열거된 죄증은 날조된 것이었고 담당 관청에 이미 간파되었다."
 hd_dc_ten.0023.desc_failure: "[hd_dc_ten_impeach_owner.GetShortUIName](이)가 당신을 탄핵하는 상소를 올렸으나, 다행히 천자께서 받아들이지 않으셨다."
 hd_dc_ten.0023.a: "이 원수는 반드시 갚으리라."

 # ---------- 乱象更替 ----------
 hd_dc_ten.0041.t: "난상"
 hd_dc_ten.0041.desc_consort: "외척 세력이 이미 조정의 여러 당을 압도하여, 정사가 사가에서 나오고 있다. #high 외척 전권#!의 형세가 굳어졌다."
 hd_dc_ten.0041.desc_eunuch: "환관이 궁중을 드나들며 안팎을 가로막으니, 조정 신하들은 천자의 얼굴을 뵙기조차 어렵다. #high 환관 간정#!의 형세가 굳어졌다."
 hd_dc_ten.0041.desc_warlord: "무신들은 대군을 손에 쥐고 제후들은 저마다 사병을 거느리니, 조정의 호령이 날로 먹히지 않는다. #high 권신과 번진#!의 형세가 굳어졌다."
 hd_dc_ten.0041.desc_partisan: "조정의 여러 당이 세력이 엇비슷하여 서로 헐뜯으니, 정사가 이로 인해 황폐해졌다. #high 당쟁 내분#!의 형세가 굳어졌다."
 hd_dc_ten.0041.a: "시세가 이러하니 어찌하겠는가."

 # ---------- 废立 ----------
 hd_dc_ten.0051.t: "폐립"
 hd_dc_ten.0051.desc: "오랜 모의 끝에 마침내 일이 이루어졌다. [target.GetShortUIName](은)는 폐위되어 감금되었고, 대위의 주인이 바뀌었다."
 hd_dc_ten.0051.desc_huangdi: "궁문은 굳게 닫히고 갑사들이 빙 둘러섰다. 백관은 겁에 질려 입을 다문 채 [target.GetShortUIName](이)가 폐위되어 감금되는 것을 지켜볼 뿐이었다. 천자를 신하가 폐립할 수 있다니, 이 천하는 이미 예전의 천하가 아니다."
 hd_dc_ten.0051.a: "천명은 나에게 있다."

 # ---------- 外戚专权 ----------
 hd_dc_ten.0101.t: "외척 봉후"
 hd_dc_ten.0101.desc: "[hd_dc_ten_waiqi_leader.GetShortUIName](이)가 표문을 올려 아우와 조카들을 후로 봉해 달라고 청하였다. 조정이 모두 곁눈질하였으나 감히 말하는 이는 없었다."
 hd_dc_ten.0101.a: "청한 대로 허락한다."
 hd_dc_ten.0101.b: "고조의 약조가 있다. 공이 없으면 후에 봉할 수 없노라."
 hd_dc_ten.0102.t: "태후의 임조"
 hd_dc_ten.0102.desc: "[hd_dc_ten_dowager.GetShortUIName](이)가 또다시 당신을 건너뛰고 직접 대신들을 불러 만나고 상주문에 비답을 내렸다. 조정 신하들은 이제 먼저 후궁에 아뢴 뒤에야 천자에게 보고하는 데 익숙해졌다."
 hd_dc_ten.0102.a: "태후의 뜻을 따른다."
 hd_dc_ten.0102.b: "짐이 친히 조정을 다스리리라."
 hd_dc_ten.0103.t: "외척의 폐립 모의"
 hd_dc_ten.0103.desc: "밀고가 들어왔다. [hd_dc_ten_waiqi_leader.GetShortUIName](이)가 자기 저택에 심복들을 불러 모아 새 군주를 세우는 일을 의논하고 있다는 것이다. 이것이 사실이라면 큰 화가 눈앞에 닥쳤다."
 hd_dc_ten.0103.a: "선수를 친다!"
 hd_dc_ten.0103.b: "후한 상을 내려 그 마음을 안심시킨다."
 hd_dc_ten.0103.c: "참고 드러내지 않는다."

 # ---------- 宦官干政 ----------
 hd_dc_ten.0111.t: "십상시"
 hd_dc_ten.0111.desc: "[hd_dc_ten_eunuch_leader.GetShortUIName] 등 환관들이 궁중을 장악하여, 상주문은 그들의 손을 거쳐야만 위로 올라가고 조령도 대부분 그들의 입에서 나온다. 외조의 대신들은 원망의 소리가 자자하다."
 hd_dc_ten.0111.a: "이들은 충성스러우니, 예전처럼 총애하고 신임한다."
 hd_dc_ten.0111.b: "외조와 함께 정사를 논의하라는 조령을 내린다."
 hd_dc_ten.0112.t: "환관 감군"
 hd_dc_ten.0112.desc: "[hd_dc_ten_eunuch_leader.GetShortUIName](이)가 내신을 보내 군을 감독하게 해 달라고 청하며, 천자를 대신하여 대군을 쥔 장수들을 지켜보겠다고 한다. 장수들은 이 소식을 듣고 크게 불만을 품었다."
 hd_dc_ten.0112.a: "상주를 허락한다."
 hd_dc_ten.0112.b: "군중에서는 손발을 묶을 수 없다."
 hd_dc_ten.0113.t: "환관의 교조"
 hd_dc_ten.0113.desc: "어느 대신이 은밀히 아뢰었다. 근래 반포된 몇 통의 조서는 천자의 뜻에서 나온 것이 아니라, [hd_dc_ten_eunuch_leader.GetShortUIName] 일당이 군명을 사칭한 것이라고 한다."
 hd_dc_ten.0113.a: "엄히 처벌하여 용서하지 않는다!"
 hd_dc_ten.0113.b: "흐지부지 넘어간다."

 # ---------- 权臣藩镇 ----------
 hd_dc_ten.0121.t: "변진의 옹병"
 hd_dc_ten.0121.desc: "[hd_dc_ten_strong_vassal.GetShortUIName](은)는 대군을 끼고 앉아 근래 또 사병을 크게 모으고 있으니, 조정의 조령이 그 관할 지역에서는 이미 빈 문서나 다름없다."
 hd_dc_ten.0121.a: "후한 상을 내려 회유한다."
 hd_dc_ten.0121.b: "조서를 내려 엄히 꾸짖는다."
 hd_dc_ten.0122.t: "관직 세습 청원"
 hd_dc_ten.0122.desc: "[hd_dc_ten_strong_vassal.GetShortUIName](이)가 표문을 올려, 자제들이 자신의 관직을 세습하고 관할 아래의 관리를 스스로 임면할 수 있도록 허락해 달라고 청하였다."
 hd_dc_ten.0122.a: "관용을 베푸는 것이 상책이다."
 hd_dc_ten.0122.b: "단호히 거절한다."
 hd_dc_ten.0123.t: "권신의 전횡"
 hd_dc_ten.0123.desc: "[hd_dc_ten_wuxun_leader.GetShortUIName](은)는 공을 믿고 교만 방자하여, 입조할 때 종종걸음을 하지 않고 일을 아뢸 때 이름을 대지 않으니, 마치 스스로를 천자로 여기는 듯하다."
 hd_dc_ten.0123.a: "병권을 빼앗고 관직을 파하라!"
 hd_dc_ten.0123.b: "참는다."

 # ---------- 党争内耗 ----------
 hd_dc_ten.0131.t: "붕당의 상호 비방"
 hd_dc_ten.0131.desc: "[hd_dc_ten_la.GetShortUIName](와)과 [hd_dc_ten_lb.GetShortUIName](이)가 조정에서 서로 헐뜯으니, 각자의 문하에서 올라온 상주문이 눈송이처럼 날아들며 모두 천자께 공정한 판단을 내려 달라고 한다."
 hd_dc_ten.0131.a: "[hd_dc_ten_la.GetShortUIName](을)를 감싼다."
 hd_dc_ten.0131.b: "[hd_dc_ten_lb.GetShortUIName](을)를 감싼다."
 hd_dc_ten.0131.c: "양쪽 모두 잘못을 꾸짖고, 어느 쪽도 편들지 않는다."
 hd_dc_ten.0132.t: "부실한 선거"
 hd_dc_ten.0132.desc: "올해 찰거에서 천거된 효렴과 무재는 대부분 권문세가의 자제라, 한미한 선비들의 원성이 자자하다. 태학의 제생들이 무리를 지어 상소를 올려, 군수가 세가의 청탁을 받았다고 지목하였다. 이 일은 이미 온 도성에 파다하게 퍼졌다."
 hd_dc_ten.0132.a: "끝까지 엄히 조사한다."
 hd_dc_ten.0132.b: "이 사건을 덮어 둔다."
 hd_dc_ten.0133.t: "당인의 인물평"
 hd_dc_ten.0133.desc: "청류 사인들이 사사로이 공경들을 품평하니, 월단평이 한번 나오면 “탁류”로 평가받은 자는 벼슬길이 어두워진다. 조정 신하들은 이를 존경하면서도 두려워한다."
 hd_dc_ten.0133.a: "청의에는 본디 공론이 있으니, 그 품평을 받아들인다."
 hd_dc_ten.0133.b: "사사로운 논의를 금한다."
