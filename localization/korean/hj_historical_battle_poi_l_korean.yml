l_korean:
 HJ_BattlePoIHistoricalNameChangShao: "장작 전투"
 HJ_BattlePoIHistoricalDescChangShao: "#emp 승자: 노나라\n패자: 제나라\n연대: 노 장공 10년#!\n#weak 노군은 군사를 움직이지 않고 처음 들이닥친 제군의 예기를 피하다가, 제나라 군대가 북을 세 번 울리고 사기가 다한 뒤에야 북을 울려 반격하여 적은 병력으로 많은 적을 이겼다.\n\n#italic “싸움은 용기로 하는 것이다. 첫 북에 기세를 일으키고, 두 번째에 쇠하고, 세 번째에 다한다.”#!——《춘추좌씨전》#!"
 HJ_BattlePoIHistoricalNameChengPu: "성복 전투"
 HJ_BattlePoIHistoricalDescChengPu: "#emp 승자: 진나라\n패자: 초나라\n연대: 노 희공 28년#!\n#weak 진 문공은 망명 시절 초왕에게 한 약속을 잊지 않아, 두 군대가 마주치자 삼사를 물러나 초군을 깊숙이 끌어들였다. 이어 진군은 여러 군을 정비하여 초군의 양 날개를 나누어 쳐 크게 무찔렀고, 진나라는 이로써 중원의 패자가 되었다.\n\n#italic “큰 병거 열 대가 앞장서 길을 여네.”#!——《시경·소아·유월》#!"
 HJ_BattlePoIHistoricalNameYanLing: "언릉 전투"
 HJ_BattlePoIHistoricalDescYanLing: "#emp 승자: 진나라\n패자: 초나라\n연대: 노 성공 16년#!\n#weak 진과 초가 다시 패권을 다투었다. 진군은 초군의 중군이 약함을 간파하고 병력을 모아 돌격했다. 초 공왕이 화살에 눈을 맞자, 초군은 밤새 달아났다.\n\n#italic “늠름한 무사여, 공후의 방패요 성벽이로다.”#!——《시경·주남·토저》#!"
 HJ_BattlePoIHistoricalNameGuiLing: "계릉 전투"
 HJ_BattlePoIHistoricalDescGuiLing: "#emp 승자: 제나라\n패자: 위나라\n연대: 위 혜왕 17년~18년#!\n#weak 위군이 조나라 도읍 한단을 포위하자, 손빈은 한단으로 가서 정면으로 포위를 풀지 않고 곧장 위나라 도읍 대량으로 향했다. 위군이 자국을 구하러 회군하자 제군은 계릉에서 이를 요격해 크게 무찔렀으니, 세상은 이를 ‘위위구조’라 불렀다.\n\n#italic “저 네 필 수말을 모니, 네 필 수말이 늠름하도다. 군자는 그에 기대고, 소인은 그 뒤를 따르네.”#!——《시경·소아·채미》#!"
 HJ_BattlePoIHistoricalNameYiQue: "이궐 전투"
 HJ_BattlePoIHistoricalDescYiQue: "#emp 승자: 진나라\n패자: 한·위 연합군\n연대: 진 소왕 14년#!\n#weak 백기는 강한 곳을 피하고 약한 곳을 쳐, 먼저 비교적 약한 한군을 깨뜨린 뒤 군사를 돌려 위군을 협공했다. 한·위 연합군은 곧 무너졌고, 베어 낸 목이 24만에 달했다.\n\n#italic “오나라 창을 쥐고 무소 갑옷을 걸치니, 수레바퀴 엇갈리며 짧은 병기로 맞붙는다.”#!——굴원《구가·국상》#!"
 HJ_BattlePoIHistoricalNameChangPing: "장평 전투"
 HJ_BattlePoIHistoricalDescChangPing: "#emp 승자: 진나라\n패자: 조나라\n연대: 진 소왕 47년#!\n#weak 진과 조가 3년간 대치하던 중, 진군은 거짓으로 패하여 적을 꾀어내고 조군의 군량 길을 끊어 장평에서 포위했다. 조나라 병사들은 46일 동안 굶주린 끝에 진에 항복했고, 생매장당한 자가 40여만에 이르렀다.\n\n#italic “성 남쪽에서 싸우다 성곽 북쪽에서 죽으니, 들판에서 죽어 묻히지 못하고 까마귀 밥이 되었네.”#!——한나라 악부《전성남》#!"
 HJ_BattlePoIHistoricalNameZui: "최 땅 전투"
 HJ_BattlePoIHistoricalDescZui: "#emp 승자: 진나라\n패자: 조·초·위·연·한 5국 연합군\n연대: 진왕 정 6년#!\n#weak 5국이 합종하여 진을 공격해 대군이 최 땅까지 깊숙이 들어왔으나, 끝내 제후들이 저마다 다른 속셈을 품고 진퇴가 엇갈려 군사를 물렸다. 이후 산동의 제후들은 다시는 합종하여 진에 맞설 힘이 없었다.\n\n#italic “북소리 둥둥 울리니, 뛰어올라 병기를 휘두르네.”#!——《시경·패풍·격고》#!"
 HJ_BattlePoIHistoricalNameJuLu: "거록 전투"
 HJ_BattlePoIHistoricalDescJuLu: "#emp 승자: 초군과 제후들의 군대\n패자: 진군\n연대: 진 이세 3년#!\n#weak 항우는 군사를 이끌고 강을 건넌 뒤 배를 가라앉히고 솥을 깨뜨리고 막사를 불태워, 사흘 치 식량만 지니고 필사의 각오를 보였다. 진군과 아홉 번 싸워 거록의 포위를 풀자, 제후의 장수들은 군문에 들어와 알현할 때 모두 무릎으로 기어 나아가며 감히 고개를 들지 못했다.\n\n#italic “참으로 용맹하고 또 굳세니, 끝까지 강건하여 꺾을 수 없도다.”#!——굴원《구가·국상》#!"
 HJ_BattlePoIHistoricalNamePengCheng: "팽성 전투"
 HJ_BattlePoIHistoricalDescPengCheng: "#emp 승자: 서초\n패자: 한왕과 제후들의 군대\n연대: 한 2년#!\n#weak 한왕은 항우가 북쪽으로 제나라를 치는 틈을 타 제후의 군사를 이끌고 팽성에 쳐들어가, 날마다 술자리를 벌이고 성대한 연회를 열었다. 항우가 몸소 정예 기병 3만을 이끌고 급히 돌아와 새벽에 들이치자, 한군은 크게 무너져 죽은 자가 10여만에 이르렀고, 수수가 그 때문에 흐르지 못했다.\n\n#italic “힘은 산을 뽑고 기개는 세상을 덮었도다.”#!——항우《해하가》#!"
 HJ_BattlePoIHistoricalNameJingXing: "정형 전투"
 HJ_BattlePoIHistoricalDescJingXing: "#emp 승자: 한군\n패자: 조군\n연대: 한 3년#!\n#weak 한신은 강을 등지고 진을 쳐 병사들이 물러설 곳 없이 모두 죽기로 싸우게 했다. 또 미리 경기병을 조군 진영에 잠입시켜 조나라 깃발을 뽑고 한나라의 붉은 깃발을 세우니, 조군은 크게 혼란에 빠졌고 한군이 앞뒤로 협공해 조군을 크게 무찔렀다.\n\n#italic “나가서는 들어오지 못하고 가서는 돌아오지 못하니, 평원은 아득하고 길은 멀기만 하구나.”#!——굴원《구가·국상》#!"
 HJ_BattlePoIHistoricalNameGaiXia: "해하 전투"
 HJ_BattlePoIHistoricalDescGaiXia: "#emp 승자: 한왕과 제후들의 군대\n패자: 서초\n연대: 한 5년#!\n#weak 한군이 초군을 겹겹이 포위하고 밤마다 사방에서 초나라 노래를 부르니, 초군의 군심이 흩어졌다. 항우는 포위를 뚫고 남쪽으로 달아나 오강에 이르러 스스로 목을 찔렀고, 초한의 다툼은 이로써 끝이 났다.\n\n#italic “때가 불리하니 추마도 나아가지 않는구나. 추마가 나아가지 않으니 어찌하리오!”#!——항우《해하가》#!"
 HJ_BattlePoIHistoricalNameBaiDeng: "백등 포위전"
 HJ_BattlePoIHistoricalDescBaiDeng: "#emp 우세한 쪽: 흉노\n포위된 쪽: 한군\n연대: 고황제 7년#!\n#weak 고황제는 가벼운 군사로 흉노를 추격하다가 묵돌 선우의 정예 기병에게 백등산에서 7일 동안 포위되었고, 이후 진평의 계책을 써서야 겨우 포위를 풀었다. 이후 한나라는 흉노와 화친하여 북쪽 국경을 안정시켰다.\n\n#italic “평성 아래서 참으로 괴로웠다네. 이레를 굶으니 쇠뇌도 당기지 못하였네.”#!——한나라 초기 민요#!"
 HJ_BattlePoIHistoricalNameHeXi: "하서 전투"
 HJ_BattlePoIHistoricalDescHeXi: "#emp 승자: 한군\n패자: 흉노 혼야왕·휴도왕의 부\n연대: 효무황제 원수 2년#!\n#weak 표기장군 곽거병은 한 해에 두 차례 하서로 출격하여, 언지산을 넘고 기련산 깊숙이 들어가 흉노 혼야·휴도 등 여러 부를 크게 무찔렀다. 혼야왕이 무리를 이끌고 한에 항복하자, 조정은 하서에 군현을 설치했다.\n\n#italic “흉노가 아직 멸하지 않았는데, 어찌 집을 돌보겠는가.”#!——표기장군 곽거병의 말#!"
 HJ_BattlePoIHistoricalNamePanYu: "번우 전투"
 HJ_BattlePoIHistoricalDescPanYu: "#emp 승자: 한군\n패자: 남월\n연대: 효무황제 원정 6년#!\n#weak 복파장군 노박덕과 누선장군 양복이 길을 나누어 남하해 합류한 뒤 번우를 포위 공격했다. 남월의 도성이 함락되자, 영남은 이로부터 모두 한나라의 군현이 되었다.\n\n#italic “남쪽에 높은 나무 있어도 그 아래 쉴 수 없고, 한수에 노니는 여인 있어도 구할 수 없네.”#!——《시경·주남·한광》#!"
 HJ_BattlePoIHistoricalNameWangXian: "왕험성 전투"
 HJ_BattlePoIHistoricalDescWangXian: "#emp 승자: 한군\n패자: 조선왕 우거\n연대: 효무황제 원봉 3년#!\n#weak 한군은 수륙으로 함께 진격했으나 왕험성을 오래 포위하고도 함락하지 못했다. 그러다 성안의 대신들이 변을 일으켜 조선왕 우거를 죽이고 항복해 오자, 한나라는 그 옛 땅에 군현을 설치했다.\n\n#italic “강수와 한수 넘실넘실 흐르고, 무사들 굳세고 용맹하도다. 사방을 경영하여, 왕께 공을 아뢰는구나.”#!——《시경·대아·강한》#!"
 HJ_BattlePoIHistoricalNameDaYuan: "대완 전투"
 HJ_BattlePoIHistoricalDescDaYuan: "#emp 승자: 한군\n패자: 대완\n연대: 효무황제 태초 원년~3년#!\n#weak 이사장군 이광리는 두 차례 대완으로 원정했다. 두 번째 원정에서 대군을 이끌고 도성을 포위하고 성안의 수원을 끊자, 대완의 귀족들은 왕을 죽이고 항복을 청하며 좋은 말을 바쳤다.\n\n#italic “천마가 서쪽 끝에서 오는구나, 만 리를 지나 덕 있는 이에게 돌아오도다.”#!——효무황제《서극천마가》#!"
 HJ_BattlePoIHistoricalNameLunTai: "윤대 전투"
 HJ_BattlePoIHistoricalDescLunTai: "#emp 승자: 한군\n패자: 윤대\n연대: 효무황제 태초 3년#!\n#weak 두 번째 대완 원정 도중 윤대가 성문을 닫고 한군에 물자를 대지 않자, 이사장군이 며칠 동안 공격하여 성을 도륙했다. 이에 연도의 여러 나라가 모두 두려워 떨며 성문을 열고 물자를 바쳤다.\n\n#italic “예전 내가 떠날 때는 기장과 피가 한창 꽃피었더니, 이제 내가 돌아오매 눈비가 길을 덮었구나.”#!——《시경·소아·출거》#!"
 HJ_BattlePoIHistoricalNameJuShi: "거사 전투"
 HJ_BattlePoIHistoricalDescJuShi: "#emp 승자: 한군과 성곽 국가들의 군대\n패자: 거사\n연대: 효선황제 지절 연간#!\n#weak 정길은 거리에서 둔전하던 병사들을 이끌고, 또 서역 성곽 국가들의 군사를 징발하여 거사를 공격했다. 거사왕이 항복을 청하자, 한나라는 이로써 천산 남북의 길을 열었다.\n\n#italic “어찌 옷이 없다 하리오? 그대와 전포를 함께하리라. 왕께서 군사를 일으키시니, 나의 창과 세모창을 손질하리라.”#!——《시경·진풍·무의》#!"
 HJ_BattlePoIHistoricalNameZhiZhi: "질지성 전투"
 HJ_BattlePoIHistoricalDescZhiZhi: "#emp 승자: 한군과 서역 여러 나라의 군대\n패자: 질지 선우\n연대: 효원황제 건소 3년#!\n#weak 서역 부교위 진탕은 도호 감연수와 함께 조서를 꾸며 군사를 일으켜, 멀리 강거 경내의 질지성을 기습했다. 성을 깨뜨리고 질지 선우의 목을 베어 수도로 보내니, 서역에서 질지의 세력은 이로써 멸망했다.\n\n#italic “강한 한나라를 범하는 자는 비록 멀리 있더라도 반드시 주살하리라!”#!——진탕의 상소#!"
 HJ_BattlePoIHistoricalNameKunYang: "곤양 전투"
 HJ_BattlePoIHistoricalDescKunYang: "#emp 승자: 한군\n패자: 왕망군\n연대: 경시 원년#!\n#weak 광무황제가 결사대 3천을 이끌고 왕망 대군의 중군을 들이치자, 곤양의 수비군도 동시에 성을 나와 협공했다. 왕망군의 총수 왕심이 전사하자, 백만을 칭하던 대군은 곧 무너져 흩어졌다.\n\n#italic “은상의 군대가 숲처럼 모였으나, 목야에서 맹세하니 우리가 일어나리라.”#!——《시경·대아·대명》#!"
 HJ_BattlePoIHistoricalNameLangBo: "낭박 전투"
 HJ_BattlePoIHistoricalDescLangBo: "#emp 승자: 한군\n패자: 징측, 징이\n연대: 광무황제 건무 18년#!\n#weak 복파장군 마원이 군사를 이끌고 낭박에 이르러 징측과 징이의 주력을 격파하고, 이어 남은 무리를 추격해 소탕하니 교지의 난이 마침내 평정되었다.\n\n#italic “사나이는 마땅히 변방 들판에서 죽어, 말가죽에 시신을 싸서 돌아와 묻힐 뿐이다.”#!——복파장군 마원의 말#!"
 HJ_BattlePoIHistoricalNameYiWuLu: "이오로 전투"
 HJ_BattlePoIHistoricalDescYiWuLu: "#emp 승자: 한군\n패자: 북흉노\n연대: 효명황제 영평 16년#!\n#weak 봉거도위 두고와 부장 경충이 주천새를 나서 북흉노의 호연왕을 격파하고 이오로 땅을 빼앗았으며, 의화도위를 두어 둔전하게 하니, 한나라는 이로써 서역으로 다시 돌아갔다.\n\n#italic “대장부가 달리 큰 뜻이 없다면, 마땅히 부개자와 장건을 본받아 이역에서 공을 세워야 하리라.”#!——반초의 말#!"
 HJ_BattlePoIHistoricalNameTianShan: "천산 전투"
 HJ_BattlePoIHistoricalDescTianShan: "#emp 승자: 한군\n패자: 북흉노 호연왕의 부\n연대: 효명황제 영평 16년#!\n#weak 두고가 군사를 이끌고 주천을 나서 천산에서 북흉노 호연왕의 부를 격파하고 포류해까지 추격하여, 한나라가 서역으로 돌아갈 길을 열었다.\n\n#italic “빛나고 미더운 방숙이여, 험윤을 정벌하니 형만도 와서 두려워하네.”#!——《시경·소아·채기》#!"
 HJ_BattlePoIHistoricalNameShuLe: "소륵성 방어전"
 HJ_BattlePoIHistoricalDescShuLe: "#emp 수비 측: 무기교위 경공\n공격 측: 북흉노와 거사의 군대\n연대: 효명황제 영평 18년#!\n#weak 경공은 고립된 군사를 이끌고 소륵성을 굳게 지켰다. 흉노가 계곡물을 끊자 성안에서 우물을 열다섯 길이나 팠으나 물을 얻지 못했다. 경공이 옷매무새를 가다듬고 우물을 향해 두 번 절하니, 놀랍게도 샘물이 솟구쳐 나왔다. 해를 넘기는 포위 끝에 마침내 원군이 왔으나, 그를 따라 동쪽 옥문관으로 돌아온 이는 고작 열세 명뿐이었다.\n\n#italic “듣건대 옛날 이사장군이 차고 있던 칼을 뽑아 산을 찌르니 샘물이 솟았다 한다. 지금 한나라의 덕이 신명하니 어찌 다함이 있겠는가!”#!——경공의 말#!"
