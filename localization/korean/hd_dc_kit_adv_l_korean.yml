l_korean:
 # 天朝循环·时代特色：进取期套件（docs/天朝循环_时代特色重制计划.md §3.2）

 # ---------- 决议 ----------
 hd_dc_kit_adv_compile_canon_decision: "대전 편찬"
 hd_dc_kit_adv_compile_canon_decision_desc: "성세에 전적을 편찬함은 후세에 본보기를 남기기 위함이다. 수찬관을 열어 천하의 노성한 유학자들을 불러 모으고, 뭇 서적을 모아 한 시대의 대전으로 엮는다."
 hd_dc_kit_adv_compile_canon_decision_tooltip: "관을 열어 책을 편찬하여 한 시대의 대전을 엮습니다"
 hd_dc_kit_adv_compile_canon_decision_confirm: "관을 열어 책을 편찬하라"
 hd_dc_kit_adv_compile_canon_decision_effect_tt: "사관을 열라는 조서를 내리고, 조정에서 학식이 가장 깊은 신하와 봉신 몇 명을 불러 편찬에 참여시킵니다. 5년 후 대전이 완성되면 편찬에 참여한 학자들의 학문이 더욱 깊어지고, 대전은 당신의 비각에 소장되며, 본족의 문풍도 크게 진작됩니다:"
 hd_dc_kit_adv_compile_code_decision: "율령 산정"
 hd_dc_kit_adv_compile_code_decision_desc: "형률이 번잡하고 가혹하니 관리들이 이를 틈타 간악을 저지른다. 유사에게 명하여 번잡한 것을 덜고 간명하게 하여 한 시대의 율령을 산정하고 천하에 반포하게 한다."
 hd_dc_kit_adv_compile_code_decision_tooltip: "번잡한 것을 덜고 간명하게 하여 한 시대의 율령을 산정합니다"
 hd_dc_kit_adv_compile_code_decision_confirm: "율령 산정"
 hd_dc_kit_adv_compile_code_decision_effect_tt: "유사가 새 율령을 산정하여 1년 후 천하에 반포하고, 한 부의 전적으로 간행하여 당신의 비각에 소장합니다:"
 hd_dc_kit_adv_reform_decision: "변법도강"
 hd_dc_kit_adv_reform_decision_desc: "쌓인 폐단이 날로 깊어지니, 고쳐 펴지 않고서는 다시 일어설 수 없다. 유능한 신하를 골라 신법을 주관하게 하여 전답을 측량하고 부역을 고르게 하려 한다. 다만 세가대족이 결코 순순히 받아들이지 않을 것이다."
 hd_dc_kit_adv_reform_decision_tooltip: "전답을 측량하고 부역을 고르게 합니다"
 hd_dc_kit_adv_reform_decision_confirm: "신법을 시행하라는 조서를 내린다"
 hd_dc_kit_adv_reform_decision_effect_tt: "천조의 대신 가운데 재정에 가장 밝은 자가 신법을 주관합니다. 이후 5년간 한문과 세족이 끊임없이 겨루며, 당신의 대응이 성패를 좌우합니다. 한문의 세력이 세족보다 강하고 주관하는 신하가 재정에 정통할수록 신법을 시행하기 쉬워집니다. 현재 약 #high [ROOT.Char.MakeScope.ScriptValue('hd_dc_kit_adv_reform_chance_value')|0]%#!의 승산이 있습니다."
 hd_dc_kit_adv_if_success_tt: "신법이 시행된다면:"
 hd_dc_kit_adv_if_failure_tt: "신법이 좌절된다면:"
 hd_dc_kit_adv_reform_county_tt: "당신이 직할하는 모든 [county|E]"
 hd_dc_kit_adv_compile_cd_tt: "20년 내에 대전이나 율령을 편찬한 적이 없음"
 hd_dc_kit_adv_compiling_tt: "사관에 미완성 서적이 없음"
 hd_dc_kit_adv_reform_once_tt: "아직 변법을 시행한 적이 없음"

 # ---------- 修正 ----------
 hd_dc_kit_adv_code_modifier: "율령 반포"
 hd_dc_kit_adv_code_modifier_desc: "새 율령이 간명하여 관리의 다스림이 맑고 정령이 막힘없이 통한다."
 hd_dc_kit_adv_reform_modifier: "신법의 성과"
 hd_dc_kit_adv_reform_modifier_desc: "신법이 성공적으로 시행되어 부역이 고르고 부고가 넉넉하다."
 hd_dc_kit_adv_reform_failed_modifier: "신법 좌절"
 hd_dc_kit_adv_reform_failed_modifier_desc: "변법이 성공을 눈앞에 두고 무너지니, 조정과 재야가 실망하였다."
 hd_dc_kit_adv_canon_culture_modifier: "대전의 유포"
 hd_dc_kit_adv_canon_culture_modifier_desc: "흠정 대전이 천하에 반포되니, 사림이 앞다투어 베껴 쓴다."
 hd_dc_kit_adv_taixue_student_modifier: "태학의 성황"
 hd_dc_kit_adv_taixue_student_modifier_desc: "문치의 성세라 태학에 글 읽는 소리가 그치지 않고 학생들이 나날이 나아간다."

 # ---------- 好感 ----------
 hd_dc_kit_adv_gathering_opinion: "문회 창화"
 hd_dc_kit_adv_compile_opinion: "대전 편찬 참여"
 hd_dc_kit_adv_reform_angered_opinion: "신법 강행"
 hd_dc_kit_adv_reform_promoted_opinion: "신법 추진"
 hd_dc_kit_adv_poem_praised_opinion: "시부로 뜻이 맞음"
 hd_dc_kit_adv_poem_mocked_opinion: "공개적인 조롱"
 hd_dc_kit_adv_qingyi_heeded_opinion: "간언을 흐르는 물처럼 받아들임"
 hd_dc_kit_adv_qingyi_suppressed_opinion: "청의 억압"
 hd_dc_kit_adv_recommend_opinion: "인재 천거의 공"
 hd_party_hostile_half_opinion: "붕당 대립(성세로 완화)"
 hd_party_hostile_double_opinion: "붕당 대립(당쟁으로 소모)"
 hd_party_coop_double_opinion: "붕당 협력(성세의 화합)"

 # ---------- 典籍宝物 ----------
 hd_dc_adv_canon_book_name: "흠정 대전"
 hd_dc_adv_canon_book_desc: "성세에 편찬된 한 시대의 대전. 경사자집을 망라하여 권질이 방대하니, 후세 학자들이 종주로 삼는다."
 hd_dc_adv_code_book_name: "흠정 율령"
 hd_dc_adv_code_book_desc: "산정하여 반포한 한 시대의 율령. 조목이 간명하고 형명에 기준이 있어 천하가 법을 지키는 근본이 된다."

 # ---------- 修典事件 ----------
 hd_dc_adv.0001.t: "관을 열어 책을 편찬하라"
 hd_dc_adv.0001.desc: "조서가 내려지자 사관이 크게 열렸다. 천하의 장서가 끊임없이 경사로 실려 오고, 노성한 유학자와 학사들이 부문을 나누어 엮고 오류를 교감한다.\n\n이는 여러 해에 걸친 대업이 될 것이다."
 hd_dc_adv.0001.a: "반드시 정밀하게 살펴 후세에 전하라."
 hd_dc_adv.0001.a.tt: "대전이 완성되기까지 약 5년이 걸립니다."
 hd_dc_adv.0002.t: "금고문 논쟁"
 hd_dc_adv.0002.desc: "대전의 편찬이 경부에 이르자, 관의 학자들이 고문을 쓸지 금문을 쓸지를 두고 다툼이 그치지 않는다. 고문을 받드는 이들은 대개 세가의 옛 가문 출신이고, 금문을 주장하는 이들은 대개 한미한 신진이다. 저마다 제 주장을 굽히지 않으니 원고가 그대로 멈추어 있다."
 hd_dc_adv.0002.a: "고문을 받들어 선왕의 옛것을 보존하라."
 hd_dc_adv.0002.b: "금문을 세워 당대의 쓰임에 통하게 하라."
 hd_dc_adv.0002.c: "여러 설을 두루 취하고 한 학파에 치우치지 말라."
 hd_dc_adv.0003.t: "대전 완성"
 hd_dc_adv.0003.desc: "다섯 해에 걸쳐 대전이 마침내 완성되었다. 총찬관이 여러 학자를 이끌고 책을 받들어 전각에 오르니, 권질이 단지에 가득 쌓였다.\n\n이제부터 천하의 학자들은 모두 이 책을 종주로 삼을 것이다."
 hd_dc_adv.0003.a: "비각에 소장하고 부본을 천하에 반포하라."
 hd_dc_adv.0011.t: "율령 반포"
 hd_dc_adv.0011.desc: "새 율령의 산정이 끝났다. 조목은 간명하고 형명에는 기준이 섰다. 유사가 새 율령을 책으로 간행하여 군현에 반포한다."
 hd_dc_adv.0011.a: "지금부터는 오로지 새 율령을 따르라."

 # ---------- 变法事件 ----------
 hd_dc_adv.0021.t: "신법을 시행하라는 조서를 내린다"
 hd_dc_adv.0021.desc: "변법의 조서가 내려지자 조정과 재야가 들끓었다. [hd_dc_adv_reform_minister_scope.GetShortUIName](이)가 명을 받들어 신법을 주관하니, 전답을 측량하고 부역을 고르게 하는 조령이 차례로 시행된다.\n\n한문의 선비들은 손뼉을 치며 기뻐하나, 세가대족은 은밀히 결탁하고 있다. 5년 안에 성패가 어찌 될지는 아직 알 수 없다."
 hd_dc_adv.0021.desc_nominister: "변법의 조서가 내려지자 조정과 재야가 들끓었다. 그러나 조정에는 신법을 주관할 천조의 대신이 없어 천자가 친히 독려할 수밖에 없다. 전답을 측량하고 부역을 고르게 하는 조령이 차례로 시행되나, 세가대족은 은밀히 결탁하고 있다. 5년 안에 성패가 어찌 될지는 아직 알 수 없다."
 hd_dc_adv.0021.a: "짐의 뜻은 이미 정해졌다."
 hd_dc_adv.0021.a.tt: "5년 후면 신법의 성패가 저절로 드러날 것입니다. 현재 약 #high [ROOT.Char.MakeScope.ScriptValue('hd_dc_kit_adv_reform_chance_value')|0]%#!의 승산이 있습니다."
 hd_dc_adv.0022.t: "세족의 저항"
 hd_dc_adv.0022.desc: "전답 측량이 세가대족의 근본을 건드렸다. 각지의 호족들은 전답을 숨기고 측량을 방해하며, 세족당 인사들은 조정에서 연이어 상소를 올려 신법이 백성을 괴롭힌다고 지탄한다."
 hd_dc_adv.0022.a: "서슬 퍼렇게 밀어붙여, 감히 신법을 막는 자는 엄벌에 처하라."
 hd_dc_adv.0022.b: "조금 너그러움을 보이며 천천히 뒷날의 효과를 도모하라."
 hd_dc_adv.0023.t: "한문의 신진"
 hd_dc_adv.0023.desc: "신법을 시행한 지 수년, 각지에서 신법에 밝은 한문 출신의 유능한 관리들이 대거 나타났다. 주관 대신이 상주하여, 이들을 파격적으로 발탁해 신법을 추진할 인력을 채우자고 청한다."
 hd_dc_adv.0023.a: "파격적으로 발탁하라."
 hd_dc_adv.0023.b: "그래도 마땅히 자격과 순서를 따라야 한다."
 hd_dc_adv.0023.c: "주관 대신을 보내 군현을 순행하며 신법을 감독하게 하라."
 hd_dc_adv.0024.t: "신법의 성패"
 hd_dc_adv.0024.desc_success: "5년이 지나 신법은 마침내 뿌리를 내렸다. 전답 측량이 끝나고 숨어 있던 호구가 잇달아 호적에 오르며, 부고는 날로 넉넉해진다. 세가대족이 원망을 품었으나 이미 형세를 되돌릴 힘이 없다."
 hd_dc_adv.0024.desc_failure: "5년이 지났으나 신법은 끝내 시행되지 못했다. 호족들은 겉으로 따르는 척하며 뒤로는 어기고, 지방 관리들은 건성으로 책임을 미루니, 신법은 이름만 남고 실속은 사라졌다. 조정과 재야에 실망의 목소리가 가득하다."
 hd_dc_adv.0024.a: "일이 이렇게 되었구나."
 hd_dc_adv.0024.a_success: "신법이 섰으니 잘 지켜 나가라."
 hd_dc_adv_reform_chance_up_tt: "신법의 승산이 조금 더 높아졌습니다"
 hd_dc_adv_reform_chance_down_tt: "신법이 또 조금 더 어려워졌습니다"

 # ---------- 文会雅集 ----------
 hd_dc_adv.0101.t: "곡수유상"
 hd_dc_adv.0101.desc: "논변이 잠시 쉬는 사이, 사람들은 후원으로 자리를 옮겼다. 물을 끌어 도랑을 내고 깃 모양의 술잔을 물결에 띄우니, 잔이 멈추는 자리의 사람이 그 자리에서 시를 지어야 한다.\n\n술잔이 느릿느릿 맴돌다가 마침 당신 앞에 멈추었다."
 hd_dc_adv.0101.a: "잔을 들어 단숨에 마시고 붓을 잡아 곧바로 시를 짓는다."
 hd_dc_adv.0101.b: "좋은 구절을 [hd_dc_adv_guest.GetShortUIName]에게 양보한다."
 hd_dc_adv.0102.t: "현리의 청담"
 hd_dc_adv.0102.desc: "[hd_dc_adv_guest.GetShortUIName](이)가 주미를 쥐고 담론하니, 유무의 분별에서 언의의 구분에 이르기까지 온 좌중이 귀를 기울인다. 이윽고 화제가 바뀌자 모든 이의 시선이 당신에게 쏠렸다."
 hd_dc_adv.0102.a: "유학을 현학에 끌어들여 명교로 꺾는다."
 hd_dc_adv.0102.b: "그가 이끄는 대로 따라가며 함께 유무를 논한다."
 hd_dc_adv.0103.t: "시 겨루기"
 hd_dc_adv.0103.desc: "당신이 막 한 수를 읊고 나자, [hd_dc_adv_guest.GetShortUIName](이)가 손뼉을 치며 냉소하기를, 이 시는 격조가 비루하고 약하여 남의 말을 주워 담은 것에 지나지 않는다고 한다. 좌중이 순간 조용해졌다."
 hd_dc_adv.0103.a: "되받아 비꼰다."
 hd_dc_adv.0103.b: "웃어넘긴다."
 hd_dc_adv.0104.t: "제벽"
 hd_dc_adv.0104.desc: "회관의 흰 벽에는 이미 옛사람들의 시구가 빼곡히 적혀 있는데, 먹 자국이 새것과 옛것으로 저마다 다르다. 주인이 붓과 먹을 받쳐 들고 와서 모두에게 한 수씩 남겨 주기를 청한다."
 hd_dc_adv.0104.a: "붓을 휘둘러 벽에 시를 쓴다."
 hd_dc_adv.0104.b: "옛사람들의 제영을 찬찬히 읽는다."

 # ---------- 太学 ----------
 hd_dc_adv.0201.t: "태학생의 출사"
 hd_dc_adv.0201.desc: "태학의 과시에서 [hd_dc_adv_student.GetShortUIName](이)가 높은 등수에 올라 그 글솜씨가 경사에 널리 알려졌다. 박사들이 잇달아 천거하며, 이 사람은 크게 쓸 만하다고 말한다."
 hd_dc_adv.0201.a: "불러서 연속으로 삼는다."
 hd_dc_adv.0201.b: "천자께 천거한다."
 hd_dc_adv.0202.t: "태학 청의"
 hd_dc_adv.0202.desc: "태학의 제생이 강당에 모여 공경을 품평하고 조정의 정사를 논하는데, 언사가 몹시 격렬하다. 누군가 제생의 논의를 베껴 첩으로 만들었고, 이것이 이미 성안에 퍼지고 있다."
 hd_dc_adv.0202.a: "청의는 공론이 있는 곳이니, 그 직언을 받아들인다."
 hd_dc_adv.0202.b: "학생들이 함부로 조정을 논하니, 마땅히 금지해야 한다."
