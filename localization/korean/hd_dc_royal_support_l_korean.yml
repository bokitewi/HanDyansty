l_korean:
 hd_dc_request_royal_support_interaction: "왕위 지지 요청"
 hd_dc_request_royal_support_interaction_desc: "서신 한 통을 써서 사례금을 약속하고, 상대에게 당신의 명분을 공개적으로 지지해 달라고 청합니다."
 hd_dc_support_reward_g1: "30금을 약속함"
 hd_dc_support_reward_g2: "100금을 약속함"
 hd_dc_support_reward_g3: "300금을 약속함"
 hd_dc_support.0008.t: "그대의 도움을 청하오"
 hd_dc_support.0008.desc: "[hd_dc_support_claimant.GetTitledFirstName]의 편지는 단도직입적이었다. 가족의 안부를 묻고 나서, 종이 위에는 대위에 대한 [hd_dc_support_claimant.GetHerHis] 주장과 당신에게 공개적으로 가담해 달라고 청하는 파가 적혀 있었다.\n\n편지 끝에 약속한 사례금도 분명히 적혀 있었다. [hd_dc_support.Var('hd_dc_support_reward_gold').GetValue|0]금을, 당신의 이름이 지지자 명단에 오르기만 하면 즉시 바치겠다는 것이다.\n\n이 편지를 받았다고 해서 응낙한 것은 아니다. 이 주장 아래 자신의 이름을 올릴지는 당신이 스스로 결정해야 한다."
 hd_dc_support.0008.a: "이름을 올려, 기꺼이 뒤를 따르겠소."
 hd_dc_support.0008.c: "내 마음은 여전히 금상께 있소."
 hd_dc_support.0008.invalid: "시세가 바뀌어 이 편지는 더 이상 논할 것이 없음."
 hd_dc_support.0108.t: "이름이 정해진 뒤"
 hd_dc_support.0108.paid: "답신과 명부가 모두 도착했다. [hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName]의 이름이 [hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]의 파에 올랐고, 약속한 사례금도 [hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]의 사고에서 액수대로 보내졌다.\n\n이번 포섭은 성사된 셈이다. 앞으로의 전쟁의 승패는 천하의 대세에 달린 것이지, 한 통의 답신으로 정해질 수 있는 것이 아니다."
 hd_dc_support.0108.unpaid: "[hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName](은)는 이미 [hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]의 파에 이름을 올렸으나, 약속한 사례금은 액수대로 전달되지 못했다.\n\n일을 맡은 이는 빚진 액수를 장부에 적어 두었을 뿐, 두 번째 지급 증서를 끊지는 않았다. 이 빚은 언젠가는 정리되어야 할 것이다."
 hd_dc_support.0108.refused: "답신에는 분명히 적혀 있었다. [hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName](은)는 여전히 금상을 받들며, [hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]의 파에 가담하지 않겠다는 것이다.\n\n명부에는 아무도 더해지지 않았고, 사례금도 한 푼 움직이지 않았다. 서로의 뜻을 이미 알았으니, 이 편지는 당분간 다시 보낼 필요가 없다."
 hd_dc_support.0108.failed: "답신은 이미 도착했으나, [hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName](은)는 끝내 [hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]의 파 명부에 오르지 못했다.\n\n일을 맡은 이는 사례금 지급을 멈추었고, 말뿐인 응낙을 이미 손에 넣은 지지로 여기지 않았다."
 hd_dc_support.0108.a: "마음에 새겨 두자."
