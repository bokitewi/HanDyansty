l_korean:
 #苦竹新增特殊文化
 culture_parameter_kuzhu_stewardship_logistics_bonus: "관리 교육 특성이 등급에 따라 전투 능력도 올려 줍니다"
 kuzhu_tradition_mengan_mouke_name: "맹안모극"
 kuzhu_tradition_mengan_mouke_desc: "군과 민이 하나 되어 농사도 짓고 싸움도 하며, 나랏일에만 힘쓰고 사사로운 근심을 품지 않는다."
 tradition_kuzhu_proved_by_sword_name: "무력으로 정통을 증명함"
 tradition_kuzhu_proved_by_sword_desc: "왕후장상의 씨가 따로 있다더냐? 시운일 뿐이다. 나라에 정해진 주인은 없으니, 병사가 강하고 말이 튼튼한 자가 차지할 뿐이로다!" 
 tradition_kuzhu_minor_china_name: "소중화"
 tradition_kuzhu_minor_china_desc: "이 문화는 의관과 예악을 모두 중국을 본받고, 성현의 책을 읽고 주공과 공자의 가르침을 행하며, 그 백성 또한 스스로를 화하의 후손으로 여깁니다."
 tradition_kuzhu_praise_literature_name: "문장취사"
 tradition_kuzhu_praise_literature_desc: "큰 나라는 무가 아닌 문으로 다스리는 법이니, 군주는 문장의 재주로 천하의 명사를 헤아려 그중 뛰어난 자를 골라 써야 합니다."
 culture_parameter_kuzhu_confucian_education_add_merit_level: "[GetTrait('confucian_education').GetName( GetNullCharacter )] 특성이 현능 [merit_level|E] 상한을 제공합니다."
 cannot_have_tradition_loyal_soldiers: "[GetCultureTradition('tradition_loyal_soldiers').GetName] 전통을 동시에 가질 수 없음"
 cannot_have_tradition_scholar_officials: "[GetCultureTradition('tradition_scholar_officials').GetName] 전통을 동시에 가질 수 없음"
