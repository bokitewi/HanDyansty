 hd_dc_cha_border_raid_cb_victory_desc: "[attacker.GetShortUIName|U](이)가 [defender.GetShortUIName]에게서 [gold|E](와)과 [prestige|E](을)를 약탈하지만, 영지는 빼앗지 않습니다."
 hd_dc_cha_border_raid_cb_white_peace_desc: "양측이 전쟁을 멈추고, [attacker.GetShortUIName](이)가 [prestige|E](을)를 조금 잃습니다."
 hd_dc_cha_border_raid_cb_defeat_desc: "[attacker.GetShortUIName|U](이)가 약탈에 실패하여 [defender.GetShortUIName]에게 배상금을 지불하고 [prestige|E](을)를 잃습니다."
 hd_dc_cha_border_raid_truce_tt: "양측이 2년간 [truce|E]"
