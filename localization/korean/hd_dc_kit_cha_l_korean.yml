 # 请求入侵（照搬原版，开放到斗争期与对峙期）
 hd_dc_cha_request_incursion_interaction: "침입 요청"
 hd_dc_cha_request_incursion_interaction_desc: "군웅이 서로 다투는 때에 상대와 국경을 맞댄 사이 부족이나 유목 통치자에게 자금을 대어, 침입하여 상대의 [duchy|E](군) 하나를 빼앗게 합니다.\n이 일이 드러나면 이리를 집 안에 끌어들인 죄가 됩니다."
 recipient_secondary_hd_dc_cha_request_incursion_interaction: "@trebuchet_icon!침입자"
 hd_dc_cha_incursion_result_tt: "[secondary_recipient.GetShortUIName|U](이)가 $hd_siyi_raid_cb$의 명분으로 [text_title.GetName](을)를 침범합니다. 승리하면 해당 [duchy|E] 안에서 [recipient.GetShortUIName]에게 속한 모든 [county|E](을)를 빼앗습니다"
 hd_dc_cha_incursion_negative_gold_tt: "침입자의 병력이 이미 이번 지원에 필요한 수준을 넘어 더 이상 자금을 추가할 수 없습니다"

 # 边境劫掠 CB
 hd_dc_cha_border_raid_cb: "국경 약탈"
