 # 取得宣称
 hd_dc_cha_buy_claim_interaction: "명분 획득"
 hd_dc_cha_buy_claim_interaction_desc: "군웅이 각축하는 때에 금백과 위신, 인맥을 동원해 구실을 마련하여, 상대의 어느 [duchy|E](군)이나 [kingdom|E](주)에 대한 [claim|E](을)를 스스로 얻습니다."
 hd_dc_cha_buy_claim_already_claimed_tt: "당신은 이미 해당 작위에 대한 [claim|E](을)를 가지고 있습니다"
 hd_dc_cha_buy_claim_cost_desc: "명분 획득"
 hd_dc_cha_buy_claim_interaction.toast: "명분 획득"
 hd_dc_cha_claim_bought_opinion: "나의 봉토를 넘봄"

 # 招纳叛将
 hd_dc_cha_lure_vassal_interaction: "배반 장수 포섭"
 hd_dc_cha_lure_vassal_interaction_desc: "거금이나 봉지로 다른 나라의 [vassal|E](을)를 끌어들여, 주인을 바꾸고 영지째로 와서 의탁하게 합니다."
 hd_dc_cha_lure_vassal_interaction_notification: "[actor.GetShortUIName|U](이)가 은밀히 사자를 보내 후한 이익을 약속하며, 옛 주군을 버리고 투항하라고 권합니다."
 hd_dc_cha_lure_vassal_border_tt: "상대의 영지가 당신의 [realm|E](와)과 맞닿아 있어야 합니다"
 hd_dc_cha_lure_vassal_tier_tt: "당신의 작위 등급이 상대보다 높아야 합니다"
 hd_dc_cha_lure_vassal_options_heading: "어떤 보상을 약속할 것인가"
 hd_dc_cha_lure_option_gold: "@gold_icon!후한 뇌물"
 hd_dc_cha_lure_option_gold_desc: "거금으로 매수하며, 상대가 투항해 오면 지불합니다"
 hd_dc_cha_lure_not_enough_gold_tt: "당신의 [gold|E](이)가 상대를 후하게 매수하기에 부족합니다"
 hd_dc_cha_lure_option_title: "@titles_icon!봉지 약속"
 hd_dc_cha_lure_option_title_desc: "상대가 투항해 오면, 당신이 고른 직할 [county|E] 하나를 상대에게 봉해 줍니다"
 hd_dc_cha_lure_needs_title_tt: "먼저 봉해 줄 직할 [county|E](을)를 골라야 합니다"
 hd_dc_cha_lure_choose_option_tt: "보상을 하나 골라야 합니다"
 hd_dc_cha_lure_vassal_interaction.toast: "배반 장수의 투항"
 hd_dc_cha_lure_vassal_interaction.toast_liege: "봉신이 다른 이에게 배반하여 투항함"
 hd_dc_cha_lure_vassal_interaction.declined: "상대가 주인을 바꾸기를 거절했습니다"
 hd_dc_cha_lure_ai_liege_opinion: "현 주군에 대한 [opinion|E]"
 hd_dc_cha_lure_ai_gold: "후한 뇌물"
 hd_dc_cha_lure_ai_title: "봉지 약속"
 hd_dc_cha_lure_ai_ambitious: "야심만만함"
 hd_dc_cha_lure_ai_greedy: "탐욕"
 hd_dc_cha_lure_ai_loyal: "충성"
 hd_dc_cha_lure_ai_disloyal: "불충"
 hd_dc_cha_lure_ai_same_dynasty: "현 주군과 같은 가문"
 hd_dc_cha_lure_ai_stronger: "새 주군의 군세가 강성함"
