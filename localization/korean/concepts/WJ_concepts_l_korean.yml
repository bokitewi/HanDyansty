l_korean:
# 汉晋风华：按类型整合；键名与现行文本保留。来源逐键见本批manifest。

 # 来源：localization/simp_chinese/WJ_contract_privileges_l_simp_chinese.yml
 game_concept_wj_kaifu:0 "개부"
 game_concept_wj_zhoumu:0 "주목 발탁"
 game_concept_wj_zhoumu_desc:0 "$WJ_zhoumu_grant_desc$"
 game_concept_wj_huangyue:0 "가황월"
 game_concept_wj_huangyue_desc:0 "$WJ_huangyue_grant_desc$"
 game_concept_wj_kaifu_desc:0 "개부는 조정이 계약으로 특별히 수여하는 것으로, 스스로 막료를 두고 연사를 벽소할 수 있습니다. 대장군, 태부, 승상, 사도, 사공, 태위는 재임하면 곧 개부할 수 있고, 그 밖의 중신은 따로 수여받아야 합니다."
 game_concept_wj_maojie:0 "모절"
 game_concept_wj_maojie_desc:0 "모절은 가절, 지절, 사지절의 세 등급으로 나뉘며, 한 사람은 그중 하나만 지닙니다. 천자는 군사 창의 ‘도독구’ 페이지에서 도독구를 설치하고 절을 수여하며, 재임 중에 고쳐 수여할 수는 있지만 아무것도 없는 상태로 거둘 수는 없습니다. 핵심 실직이 정상적으로 승계되면 신임자가 그 절을 이어받고 전임자는 곧 해임됩니다. 절을 지닌 자의 호령은 직속 여부와 관계없이 이 도독구의 모든 자격 있는 관원에게 미칩니다. 군사를 일으켜 조정에 반역하면 더 이상 조정의 명을 빌려 충신을 호령할 수 없습니다. 군법은 ‘도독 군령 반포’로 시행하며, 개부 여부는 따로 판정합니다."

 # 来源：localization/simp_chinese/WJ_merit_flavor_loc_l_simp_chinese.yml
 game_concept_wj_chushi:0 "처사"
 game_concept_wj_chushi_desc:0 "아직 관직이 없고 영지 없는 사족도 아닌 사람을 [wj_chushi|E](이)라 하며, 조정과 재야 사이에 있습니다. 출사 자격을 갖추었다고 해서 이미 [wj_luyi|E](이)가 있는 것은 아닙니다."
 game_concept_wj_guanyuan:0 "관원"
 game_concept_wj_guanyuan_desc:0 "[wj_guanyuan|E](은)는 [wj_junguozhi|E] 아래에서 명을 받들어 지방을 다스리는 [liege|E]의 봉신입니다. 관원은 주군이 임명하며, [governor_efficiency|E](을)를 이용해 [realm|E] 안의 토지를 관리합니다. 문관과 무관의 구분은 맡은 속주의 계약을 기준으로 합니다.\n\n관원의 [title|E](와)과 그 아래의 [counties|E](이)가 [province|E](을)를 이루며, 관할 내의 [governance_issues|E](은)는 재임 관원이 처리합니다.\n\n관원은 [influence|E](을)를 쌓아 다른 관직의 [succession|E]에 영향을 줄 수 있습니다.\n\n#F 그 자리에 있으면 그 일을 맡고, 조서를 받들어 땅을 지키며, 기한에 따라 고과를 받는다.#!"
 game_concept_wj_junguozhi:0 "군국제"
 game_concept_wj_junguozhi_desc:0 "[GetGovernment('celestial_government').GetRuleInfo][GetGovernment('celestial_government').GetFlagInfo]\n[wj_junguozhi|E](은)는 한진의 [government_bureaucratic_type|E] [government_form|E]입니다. 천자가 조정을 총괄하고, [liege|E](이)가 [wj_guanyuan|E](을)를 임명해 지방을 다스리며, 수여한 계약에 따라 주군, 군수, 사례로 나뉩니다.\n\n인물은 [influence|E], [noble_families|E], [family_estates|E], [treasury|E](을)를 사용합니다. 독립 [rulers|E](은)는 [legitimacy|E](을)를 가지며, 신하는 [merit|E](으)로 벼슬길을 올라갑니다.\n\n사인은 벽소, 효렴 천거, 무재 천거, 청담, 고과 등의 길로 출사하며, 과거는 두지 않습니다. 지방의 [title_men_at_arms|E](은)는 작위 등급에 따라 주어지며, 현급 작위는 작위 병력을 거느리지 않습니다.\n\n#F 군과 국이 나란히 행해지되 권한은 천자에게 돌아간다. 중앙의 공경은 정사를 보좌하고, 지방의 주군은 조서를 받들어 백성을 다스린다.#!"
 game_concept_wj_luyi:0 "녹질"
 game_concept_wj_luyi_desc:0 "[wj_luyi|E](은)는 관직으로 질을 정하고 녹은 관직을 따라 옮겨 가는 것으로, 인물이 맡은 관직에 해당하는 봉록 등급을 나타냅니다.\n\n남작급 관직은 [wj_luzhi_liubaishi|E], 백작급은 [wj_luzhi_qianerbai|E], 공작령급은 [wj_luzhi_bierqian|E], 왕국급은 [wj_luzhi_zhongerqian|E], 제국급 이상은 [wj_luzhi_wanshi|E]입니다.\n\n아직 관직이 없는 이는 [wj_chushi|E] 또는 [wj_shizu|E](이)라 합니다. 정식 출사 경로를 거치지 않고 먼저 관직을 맡은 이는 잠시 [wj_shishou|E](이)가 되며, 기한이 차면 능력 고과를 받아야 합니다."
 game_concept_wj_luyi_i:0 "@merit_icon!"
 game_concept_wj_luzhi_bierqian:0 "비이천석"
 game_concept_wj_luzhi_bierqian_desc:0 "[wj_luzhi_bierqian|E](은)는 공작령급 관직의 질입니다."
 game_concept_wj_luzhi_liubaishi:0 "육백석"
 game_concept_wj_luzhi_liubaishi_desc:0 "[wj_luzhi_liubaishi|E](은)는 남작급 관직의 질입니다."
 game_concept_wj_luzhi_qianerbai:0 "천이백석"
 game_concept_wj_luzhi_qianerbai_desc:0 "[wj_luzhi_qianerbai|E](은)는 백작급 관직의 질입니다."
 game_concept_wj_luzhi_wanshi:0 "만석"
 game_concept_wj_luzhi_wanshi_desc:0 "[wj_luzhi_wanshi|E](은)는 제국급 이상 관직의 질입니다."
 game_concept_wj_luzhi_zhongerqian:0 "중이천석"
 game_concept_wj_luzhi_zhongerqian_desc:0 "[wj_luzhi_zhongerqian|E](은)는 왕국급 관직의 질입니다."
 game_concept_wj_mingwang:0 "현망"
 game_concept_wj_mingwang_desc:0 "현망은 사인의 덕행, 명성, 공업에서 비롯됩니다. 청담은 재학을 남에게 알리고, 천거는 명성을 조야에 퍼뜨리며, 재직과 고과는 일을 다스리는 능력을 검증합니다.\n\n[merit|E](이)가 높을수록 조정과 사림의 추중을 받기 쉽고, 맡을 수 있는 관직도 무거워집니다. 명성이 아무리 높아도 정식 임명을 거쳐야만 직무를 맡을 수 있습니다."
 game_concept_wj_mingwang_i:0 "@merit_icon!"
 game_concept_wj_ruzhi:0 "출사의 길"
 game_concept_wj_ruzhi_desc:0 "한진의 출사 길은 셋입니다.\n\n벽소 — 거주의 막부에 들어가 그의 이끌어 줌을 받아 출사합니다.\n\n효렴 천거 — 공작령급 관원이 아직 관직이 없는 사람을 찰거하여 낭관서에 들이며, 고교에 합격하면 효렴 출신이 됩니다.\n\n무재 천거 — 왕국급 이상 관원이 재사를 찰거합니다. 현임 관원, 효렴 및 벽소 출신도 천거받을 수 있으며, 더 높은 출사 자격을 얻습니다.\n\n정식 출사 경로 없이 먼저 관직을 맡은 이는 잠시 시수하며, 기한이 차면 능력 고과를 받습니다. 남작급, 백작급 관직에서 합격하면 효렴을, 공작령급 이상 관직에서 합격하면 무재를 받습니다."
 game_concept_wj_ruzhi_i:0 "@merit_icon!"
 game_concept_wj_shishou:0 "시수"
 game_concept_wj_shishou_desc:0 "정식 출사 경로 없이 먼저 실직을 맡은 이는 잠시 [wj_shishou|E](을)를 행합니다. 시수 기간에는 가리의 불이익을 받으며, 기한이 차면 능력 고과를 통과해야만 정식 출사 자격을 얻을 수 있습니다."
 game_concept_wj_shizu:0 "사족"
 game_concept_wj_shizu_desc:0 "영지 없는 사족 가문 작위를 가지고 있으나 관직을 맡지 않은 이를 [wj_shizu|E](이)라 합니다. 이미 정식 출사 자격을 갖춘 이가 관직을 맡으면 맡은 관직에 따라 [wj_luyi|E](을)를 정하고, 자격 없이 먼저 관직을 맡은 이는 여전히 [wj_shishou|E](으)로 고과를 기다립니다."
 game_concept_wj_xianwang_level_chao:0 "해내칭예"
 game_concept_wj_xianwang_level_chao_desc:0 "이름이 해내에 드러나 조야의 중시를 받습니다. 그 덕망과 치적에 모두 근거가 있어 공경의 후보에 오를 수 있고, 조정의 중요한 업무를 맡을 수 있습니다."
 game_concept_wj_xianwang_level_gong:0 "천하소종"
 game_concept_wj_xianwang_level_gong_desc:0 "천하가 우러르는 바이며, 사림에서 명망이 높습니다. 덕행, 공업, 명성이 뛰어나 공보의 후보로 족하며, 임명을 받은 뒤에야 해당 직무를 맡을 수 있습니다."
 game_concept_wj_xianwang_level_jun:0 "군중문달"
 game_concept_wj_xianwang_level_jun_desc:0 "명성이 군에 알려지고 일을 다스림에 칭찬이 있습니다. 군의 현사와 관원들이 점차 그 재능을 알게 되어, 한 군의 직임에 천거될 만합니다."
 game_concept_wj_xianwang_level_xian:0 "향리칭선"
 game_concept_wj_xianwang_level_xian_desc:0 "재주와 행실이 처음 드러나 고을에서 칭찬합니다. 사인이 이미 한 지방의 신뢰를 얻어 현무의 후보가 될 만하나, 임명받을 수 있는지는 여전히 조정의 명을 받들어야 합니다."
 game_concept_wj_xianwang_level_zhou:0 "사림소칭"
 game_concept_wj_xianwang_level_zhou_desc:0 "사림의 추중을 받아 칭송이 주 경내에 가득합니다. 재학과 공업이 이미 한 주에 알려져, 지방 중임의 후보에 오르기에 족합니다."

 # 来源：localization/simp_chinese/WJ_office_roads_loc_l_simp_chinese.yml
 game_concept_WJ_maocai:0 "무재 천거"
 game_concept_WJ_maocai_desc:0 "왕국급 이상 관원은 같은 천조의 재사를 무재로 찰거할 수 있습니다. 현임 관원, 효렴 및 벽소 출신도 다시 무재로 천거될 수 있지만, 이미 무재인 이는 거듭 천거받을 수 없습니다. 천거받은 이는 곧 정식 출사 자격을 얻으며, 녹질은 여전히 맡은 관직에 따라 정해집니다. 천거한 이는 찰거를 기회로 그를 문생으로 거둘 수도 있습니다."
