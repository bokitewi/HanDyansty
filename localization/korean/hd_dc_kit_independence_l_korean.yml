l_korean:
 # 天朝循环·时代特色：乱世「要求独立」（2026-10-08）
 hd_dc_demand_independence_interaction: "독립 요구"
 hd_dc_demand_independence_interaction_desc: "천하가 크게 어지러우니, [recipient.GetShortUIName]에게 신속 관계를 끊고 스스로 일어서겠다고 요구합니다. 거절당하더라도 당신은 독립하지만, 상대는 역도를 토벌한다며 군사를 일으킬 수 있습니다."
 hd_dc_demand_independence_interaction_notification: "난세에 저는 스스로 일어서고자 하니, 주공께서 허락해 주시기 바랍니다."
 hd_dc_demand_independence_decline_tt: "[actor.GetShortUIName|U](은)는 그래도 독립합니다. 이후 10년 동안 [recipient.GetShortUINamePossessive] 기업의 주인은 #V 토역#!의 명분으로 군사를 일으킬 수 있으며, 승리하면 그를 영지와 함께 다시 복속시키고 본인은 옥에 가둡니다."
 hd_dc_demand_indep_ai_strength_1: "그의 병력이 우리보다 약하지 않음"
 hd_dc_demand_indep_ai_strength_05: "그의 병력이 우리의 절반 이상임"
 hd_dc_demand_indep_ai_strength_weak: "그의 병력이 우리의 4분의 1에도 못 미침"
 HD_DC_TRUCE_DEMAND_INDEPENDENCE: "독립 허가됨"
 # 2026-10-11 独立/招降过频修复
 hd_dc_demand_independence_interaction_desc_sub: "천하가 크게 어지러우니, [recipient.GetShortUIName]에게 그 휘하를 떠나 그의 상관에게 몸을 의탁하겠다고 청합니다. 허락 여부와 관계없이 당신은 상관에게 의탁하게 되지만, 이로써 독립하지는 않습니다."
 hd_dc_demand_indep_recently_submitted_tt: "새로 귀부하였으므로 5년 안에는 떠나기를 청할 수 없음"
 hd_dc_demand_indep_min_size_tt: "두 현 이상을 보유해야 함"
 hd_dc_left_for_overlord_opinion: "나를 버리고 상관에게 의탁함"
 hd_dc_demand_independence_interaction_notification_sub: "난세에 저는 곧바로 상관의 휘하로 들어가고자 하니, 주공께서 허락해 주시기 바랍니다."
