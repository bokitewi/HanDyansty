l_korean:
 hd_dc_par_tax_relief_modifier: "진휼 감세 시범 시행"
 hd_dc_policy_silenced_opinion: "정견이 좌절됨"
 hd_dc_policy_retained_opinion: "상주가 받아들여짐"
 hd_dc_policy_trial_selected_opinion: "새 정책의 시범 시행을 명받음"
 hd_dc_policy_trial_passed_over_opinion: "조정이 다른 의견을 먼저 채택함"
 hd_dc_par.1101.t: "군에 내려간 감세령"
 hd_dc_par.1101.desc: "[hd_dc_policy_county.GetName]의 영수증이 책상 앞에 도착했다. 백금이 이미 인계되었고, 현지에서도 감세를 시작했다.\n\n장부에는 따로 한 칸을 남겨, 1년 뒤 그때의 통치와 생계를 기록하기로 했다. 오늘 확실히 알 수 있는 것은 이 정령이 이미 시행되었다는 것뿐이다. 그것이 과연 얼마나 효과를 거둘지는 앞으로 지방의 형편을 보아야 한다."
 hd_dc_par.1101.a: "증빙을 잘 보관하고, 1년 뒤 다시 검증한다."
 hd_dc_par.1201.t: "시범 시행 만료"
 hd_dc_par.1201.fulfilled: "[hd_dc_policy_county.GetName]의 시범 장부에 마침내 마지막 장이 더해졌다. 1년의 기한이 찼고, 일을 맡은 이는 줄곧 자리를 지켰으며, 감세도 중단된 적이 없었다.\n\n시작할 때와 기한이 찼을 때의 지방 형편이 각각 기록되었다. 장부는 현지의 변화를 사실대로 적고 있으며, 이 일이 끝났음을 보여 줄 뿐, 어느 파를 대신하여 “어디서나 통한다”는 단정을 내려 주지는 않는다."
 hd_dc_par.1201.authority_lost: "[hd_dc_policy_county.GetName]의 시범 장부가 돌아왔으나, 마지막 장은 예상했던 검수가 아니었다. 일을 맡은 이가 이미 그 자리에 없어, 이 약조는 더 이상 원래대로 진행될 수 없게 된 것이다.\n\n감세는 이것으로 중단되었다. 앞서 인계된 돈은 여전히 증빙으로 확인할 수 있지만, 이번에는 끝내 처음과 끝을 잘 맺었다고 할 수 없다."
 hd_dc_par.1201.interrupted: "[hd_dc_policy_county.GetName]의 시범 시행이 도중에 끊겼다. 감세가 기한까지 버티지 못했으니, 이번 차례는 미완으로 끝날 수밖에 없다.\n\n앞서의 돈은 여전히 증빙으로 확인할 수 있으며, 회계 담당도 이 때문에 한 푼을 더 내려 보내지 않았다."
 hd_dc_par.1201.a: "그 시말을 기록하여 약조 뒤에 붙인다."
 hd_dc_par.1001.t: "먼저 한 군에 묻다"
 hd_dc_par.1001.desc: "책상 위에 책문 한 통이 도착했는데, 봉니에는 아직 사자의 손가락 자국이 남아 있었다. [hd_dc_case_county.GetName]에 실로 재해가 있으니, 조정은 당신에게 이에 대해 상주하라고 한다.\n\n[hd_dc_case_ruler.GetTitledFirstName]의 물음은 분명했다. 먼저 1년간 세금을 늦추어 지방이 숨을 돌리게 할 것인가, 아니면 종전대로 거두어 관부의 비용을 지킬 것인가? 이번에는 선을 권하고 악을 징계하자는 빈말 몇 마디만 적을 수는 없다. 상주문에는 당신의 이름이 올라갈 것이다."
 hd_dc_par.1001.a: "먼저 세금을 줄여야 하오. 이름을 걸고 상주하겠소."
 hd_dc_par.1001.a.tt: "당신의 상주문은 다른 영수의 의견과 함께 어전에 올라갑니다."
 hd_dc_par.1001.b: "종전대로 거두되, 먼저 재물과 군량의 출입부터 밝히겠소."
 hd_dc_par.1001.b.tt: "당신의 상주문은 다른 영수의 의견과 함께 어전에 올라갑니다."
 hd_dc_par.1001.c: "이 사안은 내가 앞장서 논하고 싶지 않소."
 hd_dc_par.window_closed: "이 사안은 이미 따로 처리됨."
 hd_dc_par01_local_relief_terms: "[hd_dc_proposer.GetTitledFirstName](이)가 백금을 내어 [hd_dc_recipient.GetTitledFirstName]에게 맡기고, 재해를 입은 군에서 1년간 세금을 줄여 백성의 곤궁을 덜게 함. 돈이 도착하는 즉시 시행하며, 기한이 차는 날 현지의 통치와 생계를 갖추어 보고함. 이 약조는 새 관직을 주지 않으며, 지방이 반드시 나아진다고 보장하지도 않음. 석 달 안에 답이 없으면 이 제의는 무효가 됨."
 hd_dc_par_tax_relief_modifier_desc: "조정이 이 군의 세금을 잠시 줄여, 민력이 조금 회복되기를 기다리고 있다."
 hd_dc_par01_relief_leadership_terms: "[hd_dc_proposer.GetTitledFirstName](이)가 [hd_dc_recipient.GetTitledFirstName]에게 감세 논의를 앞장서 주관해 달라고 청하며, 1년간 시범 시행한 뒤 기한이 차면 함께 검증함. 조정이 따로 백금을 내어 재해를 입은 군의 수령에게 시행을 맡기며, 수령이 응한 뒤에야 지급함. 이 약조는 관작을 주지 않으며, 조정이 이로써 한 당을 편든다는 뜻도 아님. 석 달 안에 답이 없으면 이 제의는 무효가 됨."
 hd_dc_par.1202.t: "시행되지 못한 시범 정책"
 hd_dc_par.1202.rejected: "[hd_dc_policy_county.GetName](으)로 보낸 문서가 되돌아왔다. 답서에는 분명히 적혀 있었다. 이 일은 맡지 않겠으며, 약조 뒤에도 도장을 찍지 않았다는 것이다.\n\n감세의 주장은 여전히 상주문에 남아 있지만, 주장하는 것과 이 소임을 떠맡는 것은 별개의 일이다. 이 논의는 여기서 끝이다."
 hd_dc_par.1202.expired: "서리가 [hd_dc_policy_county.GetName]의 그 문서를 처리 대기 함에서 꺼냈다. 답신 기한은 이미 오래전에 지났고, 서명란은 여전히 비어 있었다.\n\n조정은 돈을 내려 보내지 않았고, 현지도 이에 따라 감세하지 않았다. 훗날 다시 논의하게 되더라도, 오늘의 침묵을 그때의 응낙으로 여길 수는 없다."
 hd_dc_par.1202.funding_failed: "[hd_dc_policy_county.GetName]의 서명은 도착했으나, 회계 담당이 돈을 액수대로 내려 보내지 못했다. 감세는 아직 시작되지 않았고, 1년의 시범 시행도 셈할 수 없게 되었다.\n\n일을 맡은 이는 이미 오간 액수만 그대로 적어 두었다. 내보내지 않은 돈은 지급한 것으로 적지 않는다."
 hd_dc_par.1202.invalidated: "[hd_dc_policy_county.GetName] 사안의 문서가 다시 왔을 때는 이미 상황이 바뀌어 있었다. 일을 맡은 사람이나 시정의 권한, 혹은 이 사안 자체가 처음과 달라진 것이다.\n\n이 약조는 더 이상 진행하지 않는다. 서리는 변고의 까닭을 옛 문서 뒤에 붙여, 후세 사람들이 휴지 조각이 된 약조를 이미 이룬 치적으로 여기지 않게 했다."
 hd_dc_par.1202.a: "원래 문서와 답서를 함께 보관한다."
