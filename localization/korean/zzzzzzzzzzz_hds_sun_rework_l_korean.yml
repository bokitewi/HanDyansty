l_korean:
 hds_sq_base_army:0 "손씨 토역 옛 부대"
 hds.5100.t:0 "현산에서 목숨을 잃다"
 hds.5100.desc:0 "원술의 군령 한 장에 당신은 남하하여 유표를 토벌하게 되었습니다. 당신은 연전연승하며 한수를 건너 양양을 물샐틈없이 포위했습니다.\n\n이날 밤 당신은 기병 몇 명만 데리고 진영을 나서, 달빛을 틈타 현산에 올라 성안의 허실을 살펴보려 했습니다. 산길은 좁고 대숲은 빽빽했으며, 사방은 이상하리만치 고요했습니다.\n\n활시위 소리가 숲속에서 일제히 울렸습니다. 형주의 복병이 이미 이곳에서 기다리고 있었고, 말머리를 돌리기엔 이미 늦었습니다. 어지러이 날아드는 화살 속에서 당신이 마지막으로 본 것은 양양 성루에서 흔들리는 불빛이었습니다."
 hds.5100.a:0 "백부…… 강동은…… 너에게 맡기마……"
 hds.4100.t:0 "강동을 이어받다"
 hds.4100.desc:0 "형님은 너무도 갑작스럽게 떠났습니다. 어제만 해도 연무장에서 활을 당기던 형님이었는데, 오늘 영문에는 흰 깃발이 가득 걸렸습니다.\n\n휘하 장수들이 모두 당신을 바라봅니다. 형님은 임종 때 인수를 당신 손에 쥐여 주며 한마디만 했습니다. 강동의 무리를 이끌고 두 진영 사이에서 기회를 결단하여 천하와 패권을 다투는 일은 네가 나만 못하나, 어진 이를 들어 쓰고 능한 이에게 맡겨 저마다 마음을 다하게 하여 강동을 지키는 일은 내가 너만 못하다.\n\n당신은 그 인수를 꽉 움켜쥡니다. 아버지와 형님이 다 걷지 못한 길을, 이제 당신이 걸어야 합니다."
 hds.4100.a:0 "부형의 대업을 이어 강동을 평정하리라."
