 building_jiaodong_crystal_mines_01:0 "교동 수정광"
 building_jiaodong_crystal_mines_01_desc:0 "$building_type_jiaodong_crystal_mines_01_desc$"
 building_jiaodong_crystal_mines_02:0 "증축된 교동 수정광"
 building_jiaodong_crystal_mines_02_desc:0 "광굴이 산속으로 뻗어 나가 캐내는 아름다운 돌이 날로 늘어나니, 성안에 오로지 갈고 다듬는 일을 하는 옥공들도 점차 모여듭니다."
 building_linzi_iron_mines_01:0 "임치 철광"
 building_linzi_iron_mines_01_desc:0 "$building_type_linzi_iron_mines_01_desc$"
 building_xuzhou_iron_mines_01:0 "서주 철광"
 building_xuzhou_iron_mines_01_desc:0 "$building_type_xuzhou_iron_mines_01_desc$"
 building_xuzhou_iron_mines_02:0 "증축된 서주 철광"
 building_xuzhou_iron_mines_02_desc:0 "갱도가 해마다 넓어져 철관이 더 많은 공도와 제련로를 갖추니, 나오는 철료가 날로 늘어납니다."
 building_xuzhou_iron_mines_03:0 "대형 서주 철광"
 building_xuzhou_iron_mines_03_desc:0 "제철 작방이 산을 따라 펼쳐지고 바람을 넣는 가죽 풀무가 밤낮으로 멈추지 않으니, 주조한 쟁기와 호미, 칼과 창이 사방으로 실려 나갑니다."
 building_xuzhou_iron_mines_04:0 "서주 철광군"
 building_xuzhou_iron_mines_04_desc:0 "갱도와 제련소가 잇닿아 화롯불이 산마루 절반을 붉게 비추니, 이곳의 철은 한 주의 농기구와 병갑을 대기에 충분합니다."
