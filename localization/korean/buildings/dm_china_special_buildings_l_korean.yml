l_korean:
 building_baijing_01:0 "백형"
 building_baijing_01_desc:0 "하내 공현 북쪽, 태항산 속에 돌을 깎아 낸 산길 하나가 깎아지른 절벽 사이를 구불구불 돌아 동쪽으로는 하내로 나가고 서쪽으로는 상당으로 들어갑니다. 길의 바위는 수레바퀴와 말발굽에 닳아 반들반들하니, 태평한 때에는 상인과 나그네가 오가는 지름길이고, 전쟁이 일어나면 틀어막아 지키는 요충이 됩니다."
 building_dagu_01:0 "대곡관"
 building_dagu_01_desc:0 "낙양 동남쪽 산들 사이에 깊은 골짜기 하나가 끼어 있는데, 옛 이름은 통곡으로, 경사에서 남쪽 영천과 여남으로 내려가는 지름길입니다. 골짜기 길이 좁고 길어 그 안에 복병을 두면 남북의 왕래를 끊을 수 있으니, 조정이 경사 사방에 관을 둘 때 이곳이 그중 하나였습니다."
 building_dasanguan_01:0 "대산관"
 building_dasanguan_01_desc:0 "산관은 진창 남쪽의 대산령 위에 있으며, 주나라 때 산국의 관문이었다고 전해집니다. 북쪽으로 내려가면 관중의 기름진 들판이고, 남쪽으로 나가면 고도를 거쳐 곧장 한중에 이를 수 있습니다. 옛날 고조가 고도로 북쪽으로 나와 옹왕 장함을 습격해 깨뜨렸을 때 지난 길이 바로 이 길입니다."
 building_dasuisai_01:0 "대수새"
 building_dasuisai_01_desc:0 "회수 남쪽, 대별의 여러 산 사이에 있는 애구로, 옛사람들은 흔히 이곳을 직원, 명액과 함께 일컬었습니다. 춘추 시대 오왕 합려가 초를 칠 때, 초의 신하 심윤술은 오나라 사람들의 배를 부수고 다시 대수, 직원, 명액을 막아 그들의 퇴로를 끊자는 계책을 올린 적이 있습니다."
 building_dujiangyan_01:0 "도강언"
 building_dujiangyan_01_desc:0 "진나라 때 촉군 태수 이빙이 강을 막아 둑을 쌓고 민강을 둘로 나누어 물을 끌어 성도 평야를 지나게 하니, 배를 띄울 수도 있고 밭에 물을 댈 수도 있었습니다. 이로부터 촉 땅은 가뭄과 홍수가 사람의 뜻대로 되어 굶주림을 몰랐으니, 당시 사람들은 이곳을 천부라 불렀습니다."
 building_fengyue_01:0 "봉악관"
 building_fengyue_01_desc:0 "위군 무안 서쪽에서 부수가 산 아래로부터 솟아나고, 두 산이 마주 솟은 가운데 좁은 입구 하나가 나 있으니 부구라 합니다. 업성에서 서쪽으로 태항산을 넘어 상당으로 갈 때 대개 이 길을 택합니다."
 building_guancheng_01:0 "관성"
 building_guancheng_01_desc:0 "여수 북쪽에 천자의 광성원이 있고, 원 남쪽에 두 산이 내 하나를 끼고 있어 조정이 여기에 관을 두어 경사에서 남쪽으로 여수와 영수로 나가는 길을 지킵니다. 마융은 일찍이 『광성송』을 지어 이곳 원유에서의 사냥이 얼마나 성대했는지를 펼쳐 보였습니다."
 building_type_guancheng_01_desc:0 "$building_guancheng_01_desc$"
 building_hanguguan_01:0 "함곡관"
 building_hanguguan_01_desc:0 "효산 사이의 골짜기가 함처럼 깊어 수레가 나란히 갈 수 없고 말도 나란히 몰 수 없으니, 관중이 동쪽으로 나가는 관문입니다. 진나라 사람들은 이곳에 의지해 동쪽을 향했고, 육국 합종의 군사는 관을 두드렸으나 들어오지 못했습니다. 효무황제 때 누선장군 양복은 관 밖의 백성인 것을 부끄러워하여, 관성을 동쪽 신안으로 옮기자고 주청했습니다."
 building_hongzhisai_01:0 "홍지새"
 building_hongzhisai_01_desc:0 "상산군 서북쪽 태항산 속에 봉우리들이 마주 솟고 산길이 가파르게 끊어져 있어, 전국 시대 조나라 사람들이 이미 이곳에 요새를 두었습니다. 이 요새는 북쪽으로 대군과 통하고 남쪽으로 상산을 지키니, 연조 땅이 서쪽으로 나가는 험한 길목입니다."
 building_huangjintai_01:0 "황금대"
 building_huangjintai_01_desc:0 "연 소왕은 제나라에 원수를 갚고자 곽외를 위해 궁을 짓고 스승의 예로 대우했습니다. 이에 악의가 위나라에서, 추연이 제나라에서, 극신이 조나라에서 찾아오니, 천하의 현사들이 다투어 연나라로 갔습니다. 후인들은 소왕이 높은 대를 쌓고 그 위에 황금을 두어 현재를 불러 모았다고 전하니, 이 높은 대의 이름이 이로써 생겼습니다."
 building_hulaoguan_01:0 "호뢰관"
 building_hulaoguan_01_desc:0 "성고는 옛날 호뢰라 불렸으니, 주 목왕이 사냥으로 잡은 맹호를 이곳에 가두어 길렀다고 전해집니다. 성은 산마루에 자리 잡고 북쪽으로 대하에 임하니 낙양 동쪽의 가장 중요한 관문입니다. 초한이 다툴 때 고조와 항우가 이곳을 두고 뺏고 빼앗기며 여러 해를 대치했습니다."
 building_jianmenguan_01:0 "검각"
 building_jianmenguan_01_desc:0 "대검산과 소검산 사이에 절벽이 끊어져 두 벼랑이 문처럼 마주 섰습니다. 석우도가 그 가운데를 지나고, 산길은 절벽을 따라 구불구불 올라가니 나그네는 기어오르듯 지나가야 합니다. 한 사람이 지키면 만 명도 넘기 어렵습니다."
 building_jingjinguan_01:0 "정형관"
 building_jingjinguan_01_desc:0 "상산군 정형현은 태항산 속에 사방이 높고 가운데가 낮아 우물 바닥 같으므로 정형이라 하며, 천하 구새의 하나로 꼽힙니다. 옛날 한신이 군사를 이끌고 이 형을 지나 강을 등지고 진을 쳐서 한 번 싸움에 조나라를 깨뜨렸습니다."
 building_Jixiaxuegong_01:0 "직하학궁"
 building_Jixiaxuegong_01_desc:0 "제나라 도읍 임치의 직문 아래에서 제 선왕은 천하의 문학과 유세하는 선비들을 널리 불러 모아 저택을 내리고, 일을 맡기지 않은 채 국정을 논하게 하니 제자백가의 설이 이곳에서 다투어 울렸습니다. 순경은 나이와 항렬이 가장 높아 세 번이나 좨주가 되었습니다."
 building_juyongguan_01:0 "거용관"
 building_juyongguan_01_desc:0 "상곡군 거용현 남쪽, 군도산 속에 긴 골짜기 하나가 수십 리를 구불구불 이어지고 양쪽에는 높은 산이 벽처럼 서 있는데, 관성이 그 골짜기 안에 있으니 천하 구새의 하나로 꼽힙니다. 이곳은 계성에서 북쪽으로 새외로 나가는 요로이고, 호기가 남하할 때에도 흔히 이곳에서 관을 두드립니다."
 building_lingqu_01:0 "영거"
 building_lingqu_01_desc:0 "시황제가 군사를 보내 백월을 남정할 때 감록에게 명하여 수로를 파게 하니, 상수와 이수가 서로 통하게 되어 누선과 군량이 이로부터 강한에서 곧장 영남으로 내려갈 수 있게 되었습니다. 수로는 좁지만 남북의 물길을 이어 주어, 영남은 이로부터 더 이상 멀리 떨어진 곳이 아니게 되었습니다."
 building_loufan_01:0 "누번관"
 building_loufan_01_desc:0 "누번은 본래 북방 호인의 부족 이름으로, 말 타고 활 쏘기에 능했습니다. 조 무령왕이 북쪽으로 누번을 깨뜨리고 분수 상류의 산골짜기에 관을 두어 호인에 대비했습니다. 관성은 북쪽으로 안문을 누르고 남쪽으로 태원을 지킵니다."
 building_mengjin_01:0 "맹진"
 building_mengjin_01_desc:0 "낙양 북쪽 대하의 나루로, 다른 글자를 써서 맹진이라고도 합니다. 무왕이 주를 칠 때 제후들이 약속하지 않고도 이곳에 모였고, 이어 강을 건너 북상했다고 전해집니다. 이곳은 강물이 잔잔하여 경사 북쪽의 가장 중요한 나루이니, 조정이 경사 사방에 관을 둘 때 맹진도 그 가운데 있었습니다."
 building_mineguan_01:0 "맹액관"
 building_mineguan_01_desc:0 "명액은 맹새라고도 하며, 회수와 한수 사이 대별의 여러 산 가운데 있는 험한 길목으로, 『여씨춘추』는 이를 천하 구새의 하나로 꼽았습니다. 남쪽으로는 강한을 가리고 북쪽으로는 중원을 바라보니, 춘추 시대 오와 초가 싸울 때 초나라 사람들은 이 관을 막을 계책을 세운 적이 있습니다."
 building_piantou_01:0 "편두관"
 building_piantou_01_desc:0 "대하가 새외에서 동쪽으로 흘러와 이곳에서 꺾여 남쪽으로 흐르는데, 동쪽 기슭의 산줄기가 동쪽은 높고 서쪽은 낮아 지세가 한쪽으로 기울었습니다. 이곳은 안문과 서하 사이에 있어 흉노 기병이 겨울에 강이 얼면 강을 건너 남하하곤 하니, 병주 서북 변방의 요충입니다."
 building_tianjing_01:0 "천정관"
 building_tianjing_01_desc:0 "상당군 고도현 남쪽, 태항산 꼭대기에 관성이 있고 관 앞에 깊이를 헤아릴 수 없는 샘물 우물이 셋 있으므로 천정이라 합니다. 여기서 남쪽으로 내려가면 하내이고 북쪽으로 올라가면 상당으로 들어가니, 태항산 남쪽 끝의 자물쇠입니다."
 building_tongguan_01:0 "동관"
 building_tongguan_01_desc:0 "화산 동북쪽, 대하 남쪽 기슭의 높은 언덕이 깊은 골에 잘려 길은 골 바닥과 강기슭을 따라 구불구불 나 있을 뿐이니 지세가 험하고 좁습니다. 이곳은 옛날 도림새라 불렸으니, 무왕이 상나라를 이긴 뒤 이곳 도림의 들에 소를 풀어 천하에 다시는 군사를 쓰지 않을 것임을 보였다고 전해집니다."
 building_wuguan_01:0 "무관"
 building_wuguan_01_desc:0 "무관은 상현 동쪽 단수 하곡에 있으며, 춘추 시대에는 소습이라 불렸으니 관중 동남쪽에서 남양과 형초로 통하는 목구멍입니다. 진 소왕은 이곳에서 초 회왕을 꾀어 사로잡았고, 고조가 서쪽으로 함양에 들어갈 때에도 먼저 이 관을 깨뜨리고 나아갔습니다."
 building_wushengguan_01:0 "무승관"
 building_wushengguan_01_desc:0 "직원은 대별의 여러 산 가운데 있는 애구로, 두 산이 마주 솟은 가운데 길 하나가 나 있어 예로부터 회수 남쪽 남북 왕래의 큰길이었습니다. 춘추 시대에는 대수, 명액과 함께 초나라 북쪽의 방벽이었으니, 초나라 사람들은 이에 의지해 북방을 막았습니다."
 building_xiameng_01:0 "하문관"
 building_xiameng_01_desc:0 "광한군 가맹현은 서한수와 백수가 여기서 합류하고 뭇 산이 둘러싸고 있습니다. 이곳은 옛날 저후의 나라였으며, 진 혜왕이 촉을 칠 때 촉왕이 패한 곳이 바로 가맹입니다. 성은 북쪽으로 한중과 통하고 남쪽으로 성도로 내려가니, 촉으로 들어가는 요충입니다."
 building_xiaoguan_01:0 "소관"
 building_xiaoguan_01_desc:0 "소관은 안정군 조나현 경내에 있으며, 농산을 등지고 경수 상류의 하곡을 지키니 관중 서북쪽의 자물쇠입니다. 효문황제 때 흉노가 이 관을 깨뜨리자 봉화가 감천궁까지 이르러 조야가 크게 놀랐습니다."
 building_xiaopingjin_01:0 "소평진"
 building_xiaopingjin_01_desc:0 "낙양 북쪽의 또 하나의 대하 나루로, 그 지위가 맹진 다음이므로 소평진이라 합니다. 강 가운데 모래톱이 들쭉날쭉하고 물살이 잔잔하니, 조정이 경사 사방에 관을 둘 때 이 나루에도 도위가 주둔하여 지켰습니다."
 building_xuanmen_01:0 "선문관"
 building_xuanmen_01_desc:0 "성고 서쪽은 산비탈이 구불구불 돌아 마치 문과 같으므로 선문이라 합니다. 반소가 아들을 따라 동쪽으로 가다 이곳을 지나며, 하수와 낙수가 만나는 모습과 성고 선문의 경치를 『동정부』에 써넣었습니다. 낙양에서 동쪽으로 나가면 이곳을 지난 뒤로는 더 이상 지킬 만한 험지가 없습니다."
 building_xuanyuan_01:0 "헌원관"
 building_xuanyuan_01_desc:0 "태실산과 소실산 사이에서 산길이 구불구불 돌아, 떠나는 듯하다가 다시 돌아오므로 환원이라 합니다. 이 길은 낙양 동남쪽에서 영천으로 통하는 지름길이니, 조정이 경사 사방에 관을 둘 때 환원도 그 가운데 있었습니다."
 building_yangguan_01:0 "양관"
 building_yangguan_01_desc:0 "돈황군 용륵현 경내에 있으며 옥문관의 남쪽에 있으므로 양관이라 하니, 새외로 나가 서쪽으로 가는 남도의 관문입니다. 관 밖은 모래벌판이 아득하고 물과 풀이 드물어, 사절과 상인들은 이곳에 이르면 중원에 작별을 고해야 했습니다."
 building_yangping_01:0 "양평관"
 building_yangping_01_desc:0 "한중군 서쪽 경계의 산골짜기 안, 한수 북쪽 기슭에 두 산이 마주 솟아 있고, 관성은 한중에서 서쪽으로 무도로 나가고 북쪽으로 진창으로 올라가는 길을 지킵니다. 이곳은 한중의 서문이니, 여기를 지켜야 남정이 편히 잠들 수 있습니다."
 building_yanmenguan_01:0 "안문관"
 building_yanmenguan_01_desc:0 "구주산이 안문군 남쪽에 가로놓여 있는데 산세가 가파르고 그 가운데 애구가 있으니, 기러기가 남북으로 오갈 때 모두 이곳을 지나 날아간다고 전해집니다. 산 위에는 구주새가 있어 천하 구새의 하나로 꼽히며, 병주 북변에서 호기를 막는 가장 중요한 방벽입니다."
 building_yaoguan_01:0 "요관"
 building_yaoguan_01_desc:0 "남전현 남쪽, 요산과 궤산 사이의 험한 관으로, 무관도가 관중으로 들어가는 마지막 관문입니다. 고조가 서쪽으로 함양에 들어갈 때 먼저 귀한 보물로 진나라 장수를 꾀고, 다시 요관을 돌아 궤산을 넘어 진군을 깨뜨리니, 이에 곧장 패상에 이르렀습니다."
 building_yijue_01:0 "이궐관"
 building_yijue_01_desc:0 "낙양 남쪽에 두 산이 동서로 마주 솟고 이수가 그 가운데를 뚫고 흐르니, 바라보면 궁궐의 문루 같으므로 이궐이라 합니다. 전국 시대 진나라 장수 백기가 이곳에서 한과 위의 군사를 크게 깨뜨렸으며, 조정이 경사 사방에 관을 둘 때 이궐도 그 가운데 있었습니다."
 building_yumen_01:0 "옥문관"
 building_yumen_01_desc:0 "효무황제가 하서의 여러 군을 개설하고 요새를 쌓아 돈황까지 이르게 한 뒤 옥문관을 두어 서역과 통하게 하니, 여러 나라의 사절과 호상이 모두 이곳으로 새내에 들어왔습니다. 관 밖은 천 리에 걸친 유사입니다. 반초는 오랫동안 서역을 지키다가 만년에 글을 올려, 그저 살아서 옥문관에 들어가기만을 청했습니다."
 building_zhanghuagong_01:0 "장화궁"
 building_zhanghuagong_01_desc:0 "초 영왕이 지은 이궁의 높은 대로, 대는 높고 넓으며 궁실은 웅장하고 화려하여 낙성하는 날 제후들을 불러 함께 경축하였습니다. 영왕이 가는 허리를 좋아하니 궁중 사람들이 날씬해지려다 굶어 죽은 이가 많았고, 후인들은 늘 이를 경계로 삼았습니다."
 building_zhugong_01:0 "저궁"
 building_zhugong_01_desc:0 "초나라의 별궁으로, 영도 동남쪽 강 가운데 섬 위에 자리 잡고 있습니다. 초왕은 이곳에서 강에 임하여 정사를 들으며, 대강과 한수 위를 오가는 배들을 살필 수 있었고, 남쪽을 순행할 때 머무르는 곳으로도 삼았습니다."
 building_gusugong_01:0 "고소대"
 building_gusugong_01_desc:0 "오왕 합려가 처음 쌓고 부차가 증축한 높은 대로, 오현 서남쪽의 고소산 위에 있습니다. 대 위에는 궁관이 이어져 있어 오르면 태호의 안개 낀 물결과 들판의 마을을 내려다볼 수 있었습니다. 오나라가 망한 뒤 대와 정자는 차츰 폐허가 되어, 옛터만 남아 사람들이 회고하게 합니다."
 building_zhennan_01:0 "진남관"
 building_zhennan_01_desc:0 "울림과 교지 사이에는 뭇 산이 겹겹이 쌓이고 숲은 깊고 골짜기는 어두운데, 산 사이에 애구 하나가 있어 영남의 육로가 교지로 통하는 요충입니다. 광무황제 때 복파장군 마원이 남정하면서 산을 따라 길을 내니, 대군이 비로소 남하할 수 있었습니다."
 building_zhouwanggong_01:0 "주왕궁"
 building_zhouwanggong_01_desc:0 "주 평왕이 동쪽으로 천도한 뒤, 천자는 낙읍의 왕성에 거하였습니다. 전각은 우뚝하고 긴 회랑이 둘러 있었으며, 천자는 이곳에서 제후의 조회를 받고 천지에 제사 지냈습니다. 왕성의 옛터는 하남현에 있어, 지금도 노인들은 그때 궁궐이 있던 자리를 가리킬 수 있습니다."
 building_zijin_01:0 "자형관"
 building_zijin_01_desc:0 "역수 상류의 산골짜기에 두 산이 끼어 있고 비탈에는 자형이 많이 자라며, 관성은 비탈에 기대고 물가에 붙어 세워졌습니다. 이 관은 탁군에서 서쪽으로 태항산에 들어가 대 땅으로 통하는 애구이니, 북쪽 변방에 경보가 있으면 흔히 대군이 이곳에 주둔하여 지켰습니다."

 building_jiaodong_golden_mines_01:0 "교동 금광"
 building_jiaodong_golden_mines_01_desc:0 "$building_type_jiaodong_golden_mines_01_desc$"
 building_jiaodong_golden_mines_02:0 "증축된 교동 금광"
 building_jiaodong_golden_mines_02_desc:0 "갱도를 팔수록 깊어지니, 장인들이 나무를 대어 갱벽을 받치고 금맥을 따라 땅속 더 깊은 곳을 좇습니다."
 building_jiaodong_golden_mines_03:0 "대형 교동 금광"
 building_jiaodong_golden_mines_03_desc:0 "금을 캐는 집이 날로 늘어 산 아래에 세광장과 제련로가 줄지어 세워지고, 녹여 만든 금병이 차례차례 군부로 운반됩니다."
 building_jiaodong_golden_mines_04:0 "교동 금광군"
 building_jiaodong_golden_mines_04_desc:0 "갱도가 산과 들에 널려 있고 채굴, 세광, 주조를 각기 전담하는 사람이 있으니, 이곳에서 나는 황금이 끊임없이 부고로 들어갑니다."
