l_korean:
 mcpe.13.t:0 "공개적인 모욕"
 mcpe.13.d.no_bully_fallback:0 "뜰에서 한 아이가 사람들 앞에서 당신을 비웃었다. 말이 신랄하여 한마디 한마디가 가슴을 찔렀다. 주위 사람들은 모두 입을 다문 채, 당신이 어떻게 대응하는지 지켜보고 있었다."
 mcpe.13.d.bully:0 "뜰에서 [bully.GetTitledFirstName|U](이)가 사람들 앞에서 당신을 비웃었다. 말이 신랄하여 한마디 한마디가 가슴을 찔렀다. 주위 사람들은 모두 입을 다문 채, 당신이 어떻게 대응하는지 지켜보고 있었다."
 mcpe.13.a:0 "나를 모욕한 자에게는 주먹으로 갚아 주마!"
 mcpe.13.b:0 "이 모욕은 기억해 두었다가, 훗날 반드시 갚겠다."
 mcpe.13.c:0 "입으로 하는 말 따위, 마음에 둘 것 없다."
 mcpegr.13.d_bully:0 "[child.GetTitledFirstName|U](이)가 당신을 찾아와, [bully.GetTitledFirstName](이)가 여러 아이들 앞에서 [child.GetHerHim](을)를 비웃었다고 말했습니다.\n\n"
 mcpegr.13.d_no_bully_fallback:0 "[child.GetTitledFirstName|U](이)가 당신을 찾아와, 어떤 아이가 사람들 앞에서 [child.GetHerHim](을)를 비웃었다고 말했습니다.\n\n"
 mcpegr.13.d_wrathful:0 "[child.GetSheHe|U](은)는 참지 않고 그 자리에서 곧바로 주먹을 휘둘렀습니다."
 mcpegr.13.d_vengeful:0 "[child.GetSheHe|U](은)는 그때는 참고 드러내지 않았지만, 언젠가 반드시 상대에게 대가를 치르게 하겠다고 남몰래 맹세했습니다."
 mcpegr.13.d_calm:0 "[child.GetSheHe|U](은)는 그것을 하찮은 도발로 여기고 웃어넘겼으며, 마음에 두지 않았습니다."
 mcpegr.13.confirm_wrathful:0 "모욕을 당했으면 맞서 싸우는 것이 당연하지."
 mcpegr.13.confirm_vengeful:0 "좋다. 이 모욕은 잊어서도, 용서해서도 안 된다."
 mcpegr.13.confirm_calm:0 "현명하구나. 하찮은 험담이 어찌 [child.GetHerHim](을)를 다치게 하겠느냐."
 mcpegr.13.wrathful_change:0 "[child.GetFirstNameNoTooltip|U], 이런 큰 모욕을 당하고 어찌 참는단 말이냐!"
 mcpegr.13.vengeful_change:0 "이 원수는 마음에 새겨 두었다가 훗날 갚아야 한다."
 mcpegr.13.calm_change:0 "쓸데없는 말 몇 마디에 화낼 필요는 없다."
 mcpe.14.t:0 "원수 같은 부부의 다툼"
 mcpe.14.d:0 "당신은 부중에서 혼인한 지 여러 해 된 하인 부부가 다투는 것을 우연히 보았다. 두 사람은 다툼의 발단은 잊은 지 오래였으나 여전히 서로를 끝없이 탓했고, 심지어 둘 다 그때 이 혼인을 한 것이 평생 가장 큰 실수라고 말했다."
 mcpe.14.a:0 "사랑이 결국 이런 것이라면, 차라리 없는 편이 낫겠다."
 mcpe.14.b:0 "보아하니 사람은 모두 자기만 생각하는구나."
 mcpe.14.c:0 "서로 상대의 말을 끝까지 들어 주기만 하면 될 텐데."
 mcpegr.14.d:0 "당신은 [child.GetTitledFirstName](이)가 하인 부부가 다투는 것을 우연히 보았다는 이야기를 들었습니다. 두 사람은 사소한 일로 서로를 탓하며, 애초에 혼인하지 말았어야 했다고 말했다고 합니다.\n\n"
 mcpegr.14.d_chaste:0 "[child.GetFirstNameNoTooltip|U](은)는 이른바 사랑이 결국 다툼만 남는 것이라면 차라리 없는 편이 낫다고 말했습니다."
 mcpegr.14.d_cynical:0 "[child.GetFirstNameNoTooltip|U](은)는 이것이야말로 누구나 마음속으로 자기부터 생각한다는 증거라고 말했습니다."
 mcpegr.14.d_patient:0 "[child.GetFirstNameNoTooltip|U](은)는 두 사람이 참을성 있게 서로의 말을 끝까지 들어 주기만 하면 일은 언제든 풀릴 수 있다고 말했습니다."
 mcpegr.14.confirm_chaste:0 "그런 생각도 나무랄 데는 없지."
 mcpegr.14.confirm_cynical:0 "세상 인심이 그러하니, 이 교훈을 기억해 두거라."
 mcpegr.14.confirm_patient:0 "세상 사람들이 모두 이렇게 사리에 밝다면 좋으련만……."
 mcpegr.14.chaste_change:0 "사랑이 그런 것이라면, 무엇에 쓰겠느냐?"
 mcpegr.14.cynical_change:0 "결국 사람은 모두 자기만 생각하는 법이다."
 mcpegr.14.patient_change:0 "두 사람이 서로 귀 기울여 주기만 하면 될 텐데."
 mcpe.15.t:0 "지루한 강의"
 mcpe.15.d:0 "당신은 어쩔 수 없이 단정히 앉아 경사의 강학을 들어야 했다. 그 목소리는 느리고 단조로워, 한 문장이 채 끝나기도 전에 앞에서 무슨 말을 했는지 잊어버렸다. 정말이지 더는 앉아 있을 수가 없었다……."
 mcpe.15.a:0 "선생님, 요점만 말씀해 주십시오!"
 mcpe.15.b:0 "아무리 힘들어도 집중해서 끝까지 들어야 한다."
 mcpe.15.c:0 "핑계를 대고 물러났다가, 또 핑계를 대고 돌아가지 않는다."
 mcpegr.15.d:0 "당신은 [child.GetTitledFirstName]에게 지루하기로 이름난 경사의 강학을 듣게 하고, [child.GetSheHe](이)가 어떻게 대처하는지도 보고자 했습니다.\n\n"
 mcpegr.15.d_impatient:0 "[child.GetSheHe|U](은)는 얼마 지나지 않아 경사의 말을 끊고, 이 수업이 정말 재미없다고 대놓고 말했습니다."
 mcpegr.15.d_diligent:0 "[child.GetSheHe|U](은)는 놀랍게도 처음부터 끝까지 열심히 강의를 들었습니다."
 mcpegr.15.d_deceitful:0 "[child.GetSheHe|U](은)는 핑계를 대고 자리를 떴다가, 또 다른 이유를 지어내고는 다시 돌아오지 않았습니다."
 mcpegr.15.confirm_impatient:0 "그렇다. 남이 세월을 헛되이 쓰게 둘 수는 없지!"
 mcpegr.15.confirm_diligent:0 "아주 좋구나, [child.GetFirstNameNoTooltip]. 참으로 기특하다."
 mcpegr.15.confirm_deceitful:0 "하! [child.GetFirstNameNoTooltip], 제법 영리하구나."
 mcpegr.15.impatient_change:0 "어찌 남이 네 세월을 헛되이 쓰게 둔단 말이냐!"
 mcpegr.15.diligent_change:0 "[child.GetFirstNameNoTooltip|U], 더욱 힘써 공부해야 하느니라!"
 mcpegr.15.deceitful_change:0 "핑계를 대고 자리를 뜨면 그만이지."
 mcpe.16.t:0 "첫사랑"
 mcpe.16.d.no_crush:0 "당신은 평범한 [child.Custom('servant_for_romance')] 한 사람을 좋아하게 되었는데, 그 집안이 머지않아 먼 길을 떠난다고 한다. 지금 마음을 털어놓지 않으면, 앞으로 다시는 보지 못할지도 모른다."
 mcpe.16.d.crush:0 "당신의 마음속에는 [crush.GetTitledFirstName](이)가 있다. 지금이야말로 마음을 털어놓기 좋은 때이지만, 말이 입가에 맴돌 때마다 겁이 조금씩 났다."
 mcpe.16.a:0 "때를 보아 얼굴을 마주하고 솔직히 마음을 전한다."
 mcpe.16.b:0 "우선 몰래 살펴보기나 하자……."
 mcpe.16.c:0 "문을 닫고 나가지 않으며, 아무도 눈치채지 않기를 바란다."
 mcpegr.16.d:0 "당신은 [child.GetTitledFirstName](이)가 [crush.GetTitledFirstName]에게 마음이 움직인 듯하다는 것을 알아차렸습니다.\n\n"
 mcpegr.16.d.no_crush:0 "당신은 [child.GetTitledFirstName](이)가 평범한 [child.Custom('servant_for_romance')] 한 사람에게 마음이 움직인 듯하다는 것을 알아차렸습니다.\n\n"
 mcpegr.16.d_brave:0 "[child.GetFirstNameNoTooltip|U](은)는 마침내 용기를 내어 얼굴을 마주하고 마음을 털어놓았습니다."
 mcpegr.16.d_lustful:0 "[child.GetFirstNameNoTooltip|U](은)는 고백하지 않고, 오히려 자주 숨어서 상대를 몰래 훔쳐보았습니다."
 mcpegr.16.d_shy:0 "[child.GetFirstNameNoTooltip|U](은)는 방에 틀어박혀, 아무도 이 마음을 눈치채지 않기만을 바랐습니다."
 mcpegr.16.confirm_brave:0 "마땅히 그래야지. 떳떳하게."
 mcpegr.16.confirm_lustful:0 "하! 젊은 마음이란 누구에게나 있는 법이지."
 mcpegr.16.confirm_shy:0 "그것은 사람의 당연한 정이다."
 mcpegr.16.brave_change:0 "[child.GetFirstNameNoTooltip|U], 마음은 떳떳하게 말해야 한다!"
 mcpegr.16.lustful_change:0 "먼저 몰래 자세히 살펴보는 게 어떻겠느냐?"
 mcpegr.16.shy_change:0 "이런 마음은 방 안에 감춰 두면 그만이다."
 mcpe.17.t:0 "시장에서 강탈당함"
 mcpe.17.d:0 "당신은 하인 집안의 아이 하나가 담 모퉁이에 웅크린 채 울고 있는 것을 보았다. 물어보니, 그 아이는 시장에 먹을 것을 사러 갔다가 강탈을 당해, 지금 무섭고 당황하여 어찌할 바를 모르고 있었다."
 mcpe.17.a:0 "바깥세상이 이토록 험하다니……."
 mcpe.17.b:0 "이 일이 나와 무슨 상관이냐?"
 mcpe.17.c:0 "울지 마라, 내가 먹을 것을 좀 나누어 주마."
 mcpegr.17.d:0 "[child.GetTitledFirstName|U](이)가 하인 집안의 아이가 시장에서 강탈당해 그치지 않고 우는 것을 보았습니다. 당신이 [child.GetFirstNameNoTooltip]에게 어떻게 할 생각인지 묻자, [child.GetSheHe](이)가 대답했습니다.\n\n"
 mcpegr.17.d_craven:0 "“바깥이 이렇게 험한 줄은 몰랐어요. 앞으로는 더욱 조심해야겠어요.”"
 mcpegr.17.d_callous:0 "“그게 나랑 무슨 상관이죠? 왜 이런 일로 날 귀찮게 해요?”"
 mcpegr.17.d_generous:0 "“저 사람들에게 먹을 걸 좀 나눠 줘요. 굶게 둘 수는 없잖아요.”"
 mcpegr.17.confirm_craven:0 "그렇다, 바깥은 참으로 험하지."
 mcpegr.17.confirm_callous:0 "그렇다, 우리와 무슨 상관이냐."
 mcpegr.17.confirm_generous:0 "남에게 먹을 것을 나누는 것은 선행이니라."
 mcpegr.17.craven_change:0 "바깥이 얼마나 험한지 정녕 모른단 말이냐?"
 mcpegr.17.callous_change:0 "그 일이 우리와 또 무슨 상관이냐?"
 mcpegr.17.generous_change:0 "저들에게 먹을 것을 나누어 주어야 한다."
 mcpe.18.t:0 "이국의 진미"
 mcpe.18.d:0 "연회에서 누군가 값비싼 이국의 진미를 맛보라고 권합니다. 한 입 먹자마자 도저히 삼키기 어렵다는 것을 느끼지만, 배는 고프고 주인은 곁에서 당신의 평을 기다리고 있습니다."
 mcpe.18.a:0 "맛은 없어도 배를 채우는 게 중요하지."
 mcpe.18.b:0 "이게 진미라고? 끔찍한 맛이군!"
 mcpe.18.c:0 "진미가 귀하다 한들 안 먹으면 그만……."
 mcpegr.18.d:0 "당신은 [child.GetTitledFirstName](와)과 함께 연회에 갔습니다. 자리에서 누군가 [child.GetHerHim]에게 값비싼 이국의 진미를 맛보라 권했는데, [child.GetHerHis] 표정이 이미 모든 것을 말해 주었습니다.\n\n"
 mcpegr.18.d_gluttonous:0 "입에 맞지 않았지만 [child.GetSheHe](은)는 접시에 담긴 것을 깨끗이 먹어 치웠습니다."
 mcpegr.18.d_honest:0 "[child.GetSheHe|U](은)는 사람들 앞에서 이른바 진미라는 이 요리가 도저히 삼키기 어렵다고 대놓고 말했습니다."
 mcpegr.18.d_temperate:0 "[child.GetSheHe|U](은)는 젓가락을 내려놓고, 귀한 음식이라고 해서 많이 먹을 가치가 있는 것은 아니라고 여겼습니다."
 mcpegr.18.confirm_gluttonous:0 "맛이 없긴 해도 결국 배는 채워 주지."
 mcpegr.18.confirm_honest:0 "잘 말했다! 거리낌 없이 말해도 좋다, [child.GetFirstNameNoTooltip]!"
 mcpegr.18.confirm_temperate:0 "음식을 절제할 줄 알면 그로써 족하다."
 mcpegr.18.gluttonous_change:0 "아무리 맛없어도 음식은 음식이다!"
 mcpegr.18.honest_change:0 "맛없으면 맛없다고 바로 말하거라!"
 mcpegr.18.temperate_change:0 "어쩌면 진미는 본디 [child.GetFirstNameNoTooltip]의 취향이 아닌가 보구나."
 mcpe.19.t:0 "좀도둑의 침입"
 mcpe.19.d:0 "좀도둑 하나가 당신의 거처에 숨어들어 재물을 뒤지다가 많은 물건을 망가뜨렸습니다. 경비병들이 곧 그를 붙잡아 당신 앞에 끌고 와 처분을 기다립니다."
 mcpe.19.a:0 "네가 망가뜨린 것은 네 손으로 고쳐 놓아라."
 mcpe.19.b:0 "뼈저리게 고통을 맛보게 해 주마!"
 mcpe.19.c:0 "다시는 하지 않겠다고 맹세하면 가거라."
 mcpegr.19.d:0 "좀도둑 하나가 [child.GetTitledFirstNamePossessive] 거처에 침입해 많은 재물을 망가뜨렸습니다. 경비병들이 그를 붙잡자, 당신은 [child.GetFirstNameNoTooltip]에게 어떻게 처분해야 할지 물었습니다.\n\n"
 mcpegr.19.d_just:0 "[child.GetSheHe|U](은)는 좀도둑이 자기가 망가뜨린 물건을 직접 고쳐 놓게 해야 한다고 생각했습니다."
 mcpegr.19.d_sadistic:0 "[child.GetSheHe|U](은)는 그저 그 좀도둑이 뼈저린 고통을 겪기만을 바랐습니다."
 mcpegr.19.d_forgiving:0 "[child.GetSheHe|U](은)는 다시는 하지 않겠다고 약속만 한다면 좀도둑을 놓아주고자 했습니다."
 mcpegr.19.confirm_just:0 "죄에 맞는 벌이니, 참으로 공정하구나."
 mcpegr.19.confirm_sadistic:0 "그렇다, 뼈저리게 후회하게 만들어야지."
 mcpegr.19.confirm_forgiving:0 "이토록 너그럽다니, 기특하구나."
 mcpegr.19.just_change:0 "아니다, 형벌은 죄에 걸맞아야 한다!"
 mcpegr.19.sadistic_change:0 "아니다, 뼈저린 고통을 맛보게 해야 한다!"
 mcpegr.19.forgiving_change:0 "아니다, 너그러이 용서해야 한다!"
 mcpe.20.t:0 "장난감 고르기"
 mcpe.20.d:0 "[guardian.GetTitledFirstName|U](이)가 당신을 데리고 장터로 새 장난감을 고르러 갔습니다. 노점에 갖가지 물건이 가득해 눈이 어지러울 지경이지만, 고를 수 있는 것은 하나뿐입니다."
 mcpe.20.a:0 "이런 하찮은 물건들이 어찌 내게 어울리겠어!"
 mcpe.20.b:0 "제일 비싼 걸로 할래!"
 mcpe.20.c:0 "저거! 아니, 이거! 아니아니, 역시 저거!"
 mcpegr.20.d:0 "당신은 [child.GetTitledFirstName](을)를 데리고 장터로 새 장난감을 고르러 가서, [child.GetHerHim]에게 직접 고르게 해 주겠다고 약속했습니다.\n\n"
 mcpegr.20.d_arrogant:0 "[child.GetSheHe|U](은)는 노점을 샅샅이 둘러보더니, 자기에게 어울리는 물건이 하나도 없다고 말했습니다."
 mcpegr.20.d_greedy:0 "[child.GetSheHe|U](은)는 눈 하나 깜짝하지 않고 가장 값비싼 물건을 골랐습니다."
 mcpegr.20.d_fickle:0 "[child.GetSheHe|U](은)는 좀처럼 마음을 정하지 못하고, 새 장난감을 볼 때마다 마음을 바꾸었습니다."
 mcpegr.20.confirm_arrogant:0 "그래, 눈이 좀 높아도 괜찮다."
 mcpegr.20.confirm_greedy:0 "[child.GetFirstNameNoTooltip|U](은)는 귀한 것을 알아보는구나."
 mcpegr.20.confirm_fickle:0 "여러 가지를 둘러보는 것도 나쁘지 않지."
 mcpegr.20.arrogant_change:0 "[child.GetFirstNameNoTooltip|U](은)는 눈을 좀 더 높여야 한다!"
 mcpegr.20.greedy_change:0 "[child.GetFirstNameNoTooltip|U](은)는 재물의 귀함을 알아야 한다!"
 mcpegr.20.fickle_change:0 "여러 가지를 더 둘러본 뒤에 정해도 늦지 않다."
 mcpe.21.t:0 "고을 순행"
 mcpe.21.d:0 "[guardian.GetTitledFirstName|U](이)가 당신을 데리고 가문의 영지를 둘러보며 그곳의 논밭과 백성을 익히게 해 줍니다. 여정이 끝나갈 무렵, [guardian.GetSheHe](은)는 당신에게 더 가 보고 싶은 곳이 있는지 묻습니다."
 mcpe.21.a:0 "고을 사람들과 이야기해 보고 싶어요!"
 mcpe.21.b:0 "행인들 눈빛이 수상해요. 어서 돌아가요."
 mcpe.21.c:0 "그만 갈래요, 오늘은 지쳤어요."
 mcpegr.21.d:0 "당신은 [child.GetTitledFirstName](을)를 데리고 가문의 영지를 둘러보며 [child.GetHerHim]에게 그곳의 논밭과 백성을 익히게 했습니다. 여정이 끝나갈 무렵, 당신은 [child.GetSheHe]에게 어떻게 하고 싶은지 물었습니다.\n\n"
 mcpegr.21.d_gregarious:0 "[child.GetFirstNameNoTooltip|U](은)는 그곳 사람들과 이야기를 나누며 그들이 어떻게 살아가는지 직접 듣고 싶어 했습니다."
 mcpegr.21.d_paranoid:0 "[child.GetFirstNameNoTooltip|U](은)는 행인들이 몰래 당신들을 지켜보고 있다고 의심하며, 당장 돌아가자고 고집했습니다."
 mcpegr.21.d_lazy:0 "[child.GetFirstNameNoTooltip|U](은)는 이미 걷다 지쳐서, 이 순행이 어서 끝나기만을 바랐습니다."
 mcpegr.21.confirm_gregarious:0 "좋다, 마땅히 고을 사람들과 가까이 지내야지."
 mcpegr.21.confirm_paranoid:0 "조심해서 나쁠 것은 없지."
 mcpegr.21.confirm_lazy:0 "그래, 돌아가서 쉬자꾸나."
 mcpegr.21.gregarious_change:0 "고을 사람들과 이야기를 나눠 보는 게 어떠냐?"
 mcpegr.21.paranoid_change:0 "밖에 나오면 늘 경계를 늦추지 말아야 한다!"
 mcpegr.21.lazy_change:0 "이만큼 걸었으니 이제 쉴 때도 되었지."
 mcpe.22.t:0 "천벌이라는 소문"
 mcpe.22.d:0 "근처에 홀로 떨어져 사는 어떤 사람이 몰래 신령을 공경하지 않는다는 소문이 줄곧 돌았지만, 증거는 끝내 나오지 않았습니다. 며칠 전 그 사람의 집에 불이 나자, 사람들은 모두 그것이 업보라고 말합니다."
 mcpe.22.a:0 "하늘의 경고이니, 신을 업신여기는 자는 경계하라!"
 mcpe.22.b:0 "소문만으로 어찌 남을 함부로 깔볼 수 있겠어요?"
 mcpe.22.c:0 "소문이 어떻든, 집을 다시 짓도록 도와야 해요."
 mcpegr.22.d:0 "근처에 홀로 사는 어떤 사람이 신령을 공경하지 않는다는 비난이 줄곧 있었지만 증거는 없었습니다. 며칠 전 그 사람의 집에 불이 났는데, 이 소식을 들은 [child.GetTitledFirstName](이)가 당신에게 말했습니다.\n\n"
 mcpegr.22.d_zealous:0 "“이건 분명 하늘의 경고예요. 신을 업신여긴 그 사람이 결국 벌을 받은 거예요!”"
 mcpegr.22.d_humble:0 "“소문으로는 아무것도 증명할 수 없어요. 남의 사람됨을 다 안다고 자만해서는 안 돼요.”"
 mcpegr.22.d_compassionate:0 "“소문이 참이든 거짓이든, 우리는 그 불쌍한 사람이 집을 다시 짓도록 도와야 해요.”"
 mcpegr.22.confirm_zealous:0 "그렇다, 죄인은 응당 그 대가를 받는 법이지!"
 mcpegr.22.confirm_humble:0 "그렇다, 남을 함부로 깔봐서는 안 된다."
 mcpegr.22.confirm_compassionate:0 "그렇다, 위태로운 이를 돕고 곤궁한 이를 구제함은 마땅한 도리다."
 mcpegr.22.zealous_change:0 "[child.GetFirstNameNoTooltip|U], 하늘의 뜻을 어찌 의심하느냐!"
 mcpegr.22.humble_change:0 "그 사람의 품행이 어떤지 누가 단언할 수 있겠느냐?"
 mcpegr.22.compassionate_change:0 "이 불쌍한 사람을 도와야 한다!"
 mcpe.23.t:0 "이른 하교"
 mcpe.23.d:0 "스승에게 글을 배우던 중 창밖에서 다른 아이들이 뛰노는 소리가 들려옵니다. 당신이 딴생각을 하는 것을 눈치챈 스승은, 오늘은 일찍 마쳐도 되며 누가 물으면 자신이 책임지겠다고 말합니다."
 mcpe.23.a:0 "감사합니다, 선생님!"
 mcpe.23.b:0 "다 배우기로 했으니 끝까지 배울래요."
 mcpe.23.c:0 "선생님이 허락하든 말든 저는 갈 거예요."
 mcpegr.23.d:0 "아이들 몇이 밖에서 뛰노는 모습이 보이는데, [child.GetTitledFirstName](은)는 지금 스승에게 글을 배우고 있어야 할 때입니다.\n\n"
 mcpegr.23.d_trusting:0 "얼마 지나지 않아 [child.GetSheHe]도 달려가 아이들과 어울려 놀았습니다. 나중에 스승은 자신이 수업을 일찍 끝냈다고 당신에게 털어놓았습니다."
 mcpegr.23.d_stubborn:0 "그러나 [child.GetSheHe|U](은)는 끝내 자리를 뜨지 않았습니다. 나중에 스승은 [child.GetFirstNameNoTooltip](이)가 미리 약속했다는 이유로 그날 수업을 끝까지 마치겠다고 고집했다고 전했습니다."
 mcpegr.23.d_arbitrary:0 "얼마 지나지 않아 [child.GetSheHe]도 달려가 아이들과 어울려 놀았습니다. 나중에 스승은 [child.GetFirstNameNoTooltip](이)가 전혀 허락을 받지 않았다고 당신에게 알렸습니다."
 mcpegr.23.confirm_trusting:0 "가끔 한 번 일찍 마치는 것은 괜찮다."
 mcpegr.23.confirm_stubborn:0 "좋다! 말했으면 반드시 지켜야지, [child.GetFirstNameNoTooltip]!"
 mcpegr.23.confirm_arbitrary:0 "[child.GetFirstNameNoTooltip|U](이)가 가고 머무는 데 어찌 남의 허락이 필요하겠느냐?"
 mcpegr.23.trusting_change:0 "[child.GetFirstNameNoTooltip|U](은)는 선생님께 말씀드리고 가야 한다!"
 mcpegr.23.stubborn_change:0 "[child.GetFirstNameNoTooltip|U](은)는 수업을 끝까지 마쳐야 한다!"
 mcpegr.23.arbitrary_change:0 "[child.GetFirstNameNoTooltip|U](은)는 가고 싶으면 가면 그만이다!"
 mcpe.24.t:0 "군주가 된 꿈"
 mcpe.24.d:0 "당신은 막 꿈에서 깨어났습니다. 꿈속에서 당신은 드넓은 땅을 거느린 일방의 패자였는데, 가장 잊을 수 없는 것은……."
 mcpe.24.a:0 "……그 더할 나위 없는 권세와 경외."
 mcpe.24.b:0 "……헤아릴 수 없는 금과 비단과 재물."
 mcpe.24.c:0 "……태평하게 살아가는 백성의 웃는 얼굴."
 mcpegr.24.d:0 "[child.GetTitledFirstName|U](이)가 당신에게, [child.GetSheHe] 자신이 드넓은 땅을 거느린 일방의 패자가 되는 꿈을 꾸었다고 말했습니다.\n\n"
 mcpegr.24.d_ambitious:0 "[child.GetSheHe|U](은)는 꿈속의 권세와 경외를 가장 잊지 못하며, 언젠가 그것이 현실이 되기를 바랐습니다."
 mcpegr.24.d_greedy:0 "[child.GetSheHe|U](은)는 꿈속의 헤아릴 수 없는 재물을 가장 잊지 못하며, 언젠가 모두 자기 것이 되기를 바랐습니다."
 mcpegr.24.d_compassionate:0 "[child.GetSheHe|U](은)는 백성이 태평하게 살아가던 광경을 가장 잊지 못하며, 세상이 정말 그리 되기를 바랐습니다."
 mcpegr.24.confirm_ambitious:0 "권세야말로 다툴 만한 것이지."
 mcpegr.24.confirm_greedy:0 "재물이야말로 구할 만한 것이지."
 mcpegr.24.confirm_compassionate:0 "백성의 안락이야말로 가장 구할 만한 것이지."
 mcpegr.24.ambitious_change:0 "구해야 할 것은 권세로다!"
 mcpegr.24.greedy_change:0 "구해야 할 것은 재물이로다!"
 mcpegr.24.compassionate_change:0 "구해야 할 것은 백성의 안락이로다!"
 mcpe.25.t:0 "어둠 속의 시선"
 mcpe.25.d:0 "요즘 평범한 [child.Custom('servant_for_romance')] 하나가 늘 멀찍이서 당신을 훔쳐보다가, 당신이 눈치채기만 하면 허둥지둥 몸을 숨깁니다. 혹시 누군가 남몰래 당신을 연모하는 것일까요?"
 mcpe.25.a:0 "이토록 정성이라니, 기분이 꽤 좋은걸!"
 mcpe.25.b:0 "이렇게 엿보다니, 불쾌하군."
 mcpe.25.c:0 "……나를 해치러 온 건 아니겠지."
 mcpegr.25.d:0 "평범한 [child.Custom('servant_for_romance')] 하나가 몰래 [child.GetTitledFirstName](을)를 지켜보다가 들키면 숨는 것을 당신이 알아챘습니다. 보아하니 [child.GetFirstNameNoTooltip]에게 연모하는 이가 생긴 모양입니다.\n\n"
 mcpegr.25.d_lustful:0 "[child.GetSheHe|U](은)는 이 관심을 꽤 즐기는 듯합니다."
 mcpegr.25.d_chaste:0 "이런 엿봄은 [child.GetHerHim](을)를 온몸이 불편하게 만들었습니다."
 mcpegr.25.d_paranoid:0 "그러나 [child.GetSheHe|U](은)는 이것이 연모가 아니라 누군가 자신을 해치려는 꾀라고 단정했습니다."
 mcpegr.25.confirm_lustful:0 "안 될 게 무엇이냐? 즐기면 그만이지."
 mcpegr.25.confirm_chaste:0 "마땅히 그래야지, 무례한 짓이다."
 mcpegr.25.confirm_paranoid:0 "그렇다, 사람은 겉모습만으로 알 수 없는 법."
 mcpegr.25.lustful_change:0 "즐기면 그만이지, 무얼 그리 조심하느냐!"
 mcpegr.25.chaste_change:0 "이런 유혹은 단호히 물리쳐야 한다!"
 mcpegr.25.paranoid_change:0 "제 몸의 안위를 더 염려해야 한다!"
 mcpe.26.t:0 "몰래 나간 외출"
 mcpe.26.d:0 "아이들 몇이 당신에게 몰래 저택을 빠져나가 들판에서 홀로 한동안 지내 보라고 부추깁니다. 그래야 호위 없이도 제 몸을 지킬 수 있다는 것이 증명된다면서요. 문제는 당신에게 그럴 배짱이 있느냐는 것입니다."
 mcpe.26.a:0 "못 할 게 뭐야? 바깥 따위 하나도 안 무서워!"
 mcpe.26.b:0 "호위 없이 나가라고? 너무 위험해, 안 가!"
 mcpe.26.c:0 "가긴 가되, 몰래 호위를 따라오게 해야지."
 mcpegr.26.d:0 "어제 당신은 [child.GetTitledFirstName](을)를 아무리 찾아도 찾을 수 없었습니다. 마침내 누군가가 아이들 몇과 어울려 저택을 빠져나가는 [child.GetHerHim](을)를 본 것 같다고 말했습니다.\n\n"
 mcpegr.26.d_brave:0 "오늘 [child.GetFirstNameNoTooltip](와)과 아이들이 무사히 돌아왔습니다. 모두 [child.GetHerHis] 배짱을 칭찬하며 이 모험담을 여기저기 이야기하고 다닙니다."
 mcpegr.26.d_craven:0 "오늘 당신은 낡은 옷궤 안에서 [child.GetFirstNameNoTooltip](을)를 찾아냈습니다. 알고 보니 [child.GetSheHe](은)는 바깥이 무서워 따라가지도 않았던 것입니다."
 mcpegr.26.d_deceitful:0 "오늘 [child.GetFirstNameNoTooltip](와)과 아이들이 무사히 돌아왔습니다. 뒤이어 호위들이 말하길, [child.GetSheHe](이)가 진작 몰래 그들에게 줄곧 뒤따르라고 일러두었다고 합니다."
 mcpegr.26.confirm_brave:0 "하! [child.GetFirstNameNoTooltip|U](은)는 과연 하늘도 땅도 두려워하지 않는구나!"
 mcpegr.26.confirm_craven:0 "[child.GetFirstNameNoTooltip|U](이)가 화를 피할 줄 아니 좋구나."
 mcpegr.26.confirm_deceitful:0 "배짱도 보이고 위험도 피했으니, 영리하구나."
 mcpegr.26.brave_change:0 "[child.GetFirstNameNoTooltip|U](은)는 배짱을 보여야 한다!"
 mcpegr.26.craven_change:0 "[child.GetFirstNameNoTooltip|U](은)는 화를 멀리해야 한다!"
 mcpegr.26.deceitful_change:0 "[child.GetFirstNameNoTooltip|U], 적당히 거짓말 한마디 둘러대면 그만이다!"
 mcpe.27.t:0 "가복의 죽음"
 mcpe.27.d:0 "저택의 충직한 늙은 하인이 세상을 떠났습니다. 장례식에서 낯익은 이가 이렇게 떠나는 것을 보며, 당신은 처음으로 귀천을 막론하고 사람은 결국 죽는다는 사실을 진지하게 생각합니다."
 mcpe.27.a:0 "……신령의 보살핌이 없다면 사람은 한낱 티끌일 뿐."
 mcpe.27.b:0 "……권세와 영화도 결국엔 모두 헛된 것."
 mcpe.27.c:0 "……이 장례식은 지루하고 짜증나."
 mcpegr.27.d:0 "저택의 충직한 늙은 하인이 세상을 떠났습니다. 장례식에서 [child.GetTitledFirstName](이)가 생각에 잠긴 듯하여, 당신은 [child.GetHerHim]에게 삶과 죽음을 어떻게 보는지 물었습니다.\n\n"
 mcpegr.27.d_zealous:0 "[child.GetSheHe|U](은)는 인생은 짧아서 신령의 인도가 없으면 아무 의미가 없으며, 오직 경건한 믿음으로만 귀의처를 찾을 수 있다고 말했습니다."
 mcpegr.27.d_content:0 "[child.GetSheHe|U](은)는 사람이 결국 죽는 이상, 권세와 영화는 평생을 바쳐 좇을 가치가 없다고 말했습니다."
 mcpegr.27.d_callous:0 "[child.GetSheHe|U](은)는 장례식이 그저 지루하고 짜증날 뿐이며, 어차피 죽은 이는 누가 곁에 있든 개의치 않을 것이라고 여겼습니다."
 mcpegr.27.confirm_zealous:0 "옳은 말이다, [child.GetFirstNameNoTooltip|U]."
 mcpegr.27.confirm_content:0 "그렇다, 권세와 영화는 모두 지나가는 구름과 연기일 뿐."
 mcpegr.27.confirm_callous:0 "내 생각도 같다. 무엇하러 거기 멀뚱히 서 있겠느냐?"
 mcpegr.27.zealous_change:0 "장례는 큰 예법이거늘, 어찌 소홀히 하느냐!"
 mcpegr.27.content_change:0 "권세와 영화는 결국 지나가는 구름과 연기일 뿐이다!"
 mcpegr.27.callous_change:0 "고작 장례식 하나, 신경 쓸 것 있느냐?"
 mcpe.28.t:0 "방물장수의 방문"
 mcpe.28.d:0 "사방을 떠돌아다니는 방물장수 하나가 저택에 와서 당신에게 이국의 먹거리와 장난감, 부적을 팔려 하며 물건마다 아슬아슬한 내력을 덧붙입니다. [guardian.GetTitledFirstName](이)가 왔을 때, 방물장수는 당신에게 어느 것이 마음에 드느냐고 묻고 있었습니다."
 mcpe.28.a:0 "이 먹거리 냄새가 너무 좋아요, 먹어 볼래요!"
 mcpe.28.b:0 "그 신기한 부적을 갖고 싶어요!"
 mcpe.28.c:0 "난 바보가 아니야. 그런 헛소리에 안 속아."
 mcpegr.28.d:0 "방물장수 하나가 저택에 와서 [child.GetTitledFirstName]에게 갖가지 이국 물건을 팔려 하며 기이한 이야기도 잔뜩 늘어놓았습니다.\n\n"
 mcpegr.28.d_gluttonous:0 "[child.GetSheHe|U](은)는 신비로운 부적에는 조금도 관심이 없고, 줄곧 이국의 먹거리만 바라보았습니다."
 mcpegr.28.d_trusting:0 "[child.GetSheHe|U](은)는 방물장수의 이야기를 믿고, 먼 곳에서 왔다는 부적을 사 달라고 당신에게 졸랐습니다."
 mcpegr.28.d_cynical:0 "[child.GetSheHe|U](은)는 방물장수의 허풍을 꿰뚫어 보고, 이른바 신통한 효험이란 모두 속임수라고 단정했습니다."
 mcpegr.28.confirm_gluttonous:0 "잘 먹는 게 무슨 잘못이겠느냐!"
 mcpegr.28.confirm_trusting:0 "좋다, 네 마음대로 하거라."
 mcpegr.28.confirm_cynical:0 "[child.GetFirstNameNoTooltip|U](은)는 쉽게 속지 않는구나."
 mcpegr.28.gluttonous_change:0 "[child.GetFirstNameNoTooltip|U], 그 먹거리를 맛보거라!"
 mcpegr.28.trusting_change:0 "그 부적을 받아 두는 게 어떠냐?"
 mcpegr.28.cynical_change:0 "이런 헛소리를 너는 믿는단 말이냐?"
 mcpe.29.t:0 "손님의 감사"
 mcpe.29.d:0 "먼 길을 온 나그네 일가가 저택에 묵게 되었습니다. 그 집 아이가 당신을 찾아와, 며칠간의 환대에 어떻게 보답하면 좋을지 자못 진지하게 묻습니다."
 mcpe.29.a:0 "손님 대접은 주인의 도리이니 고마워할 것 없어."
 mcpe.29.b:0 "그럼 나 대신 잡일 좀 해 줄래?"
 mcpe.29.c:0 "……왜, 왜 나한테 말을 거는 거야?"
 mcpegr.29.d:0 "먼 길을 온 나그네 일가가 저택에 묵게 되었습니다. 그 집 아이가 [child.GetTitledFirstName](을)를 찾아와 저택의 환대에 어떻게 보답하면 좋을지 물었습니다.\n\n"
 mcpegr.29.d_just:0 "[child.GetFirstNameNoTooltip|U](은)는 나그네를 대접하는 것은 본디 주인의 본분이니 따로 보답할 필요가 없다고 말했습니다."
 mcpegr.29.d_lazy:0 "[child.GetFirstNameNoTooltip|U](은)는 상대에게 자기 대신 잡일 몇 가지를 해 달라고 부탁했습니다."
 mcpegr.29.d_shy:0 "[child.GetFirstNameNoTooltip|U](은)는 어떻게 대답해야 할지 몰라, 그 뒤로 줄곧 자기 방에 숨어 있었습니다."
 mcpegr.29.confirm_just:0 "그렇다, 본디 그래야 하는 법이지."
 mcpegr.29.confirm_lazy:0 "음, 저들에게 일손을 좀 빌려도 나쁠 건 없지……."
 mcpegr.29.confirm_shy:0 "[child.GetHerHim](을)를 잠시 혼자 조용히 있게 두자."
 mcpegr.29.just_change:0 "손님 대접은 본디 우리의 책임이다!"
 mcpegr.29.lazy_change:0 "저들에게 우리 잡일을 좀 맡겨도 괜찮다."
 mcpegr.29.shy_change:0 "우리는 남에게 방해받고 싶지 않다!"
 mcpe.30.t:0 "학업의 약속"
 mcpe.30.d:0 "스승이 당신에게, 학업에 더 힘쓰겠다고 약속하지 않았느냐며 요즘도 도무지 나아지는 기색이 없다고 일깨웁니다. 스승의 가르침이 서툴렀을 수도 있지만, 약속한 사람은 어디까지나 당신입니다."
 mcpe.30.a:0 "그 약속은 이제 상관없어요."
 mcpe.30.b:0 "좋아요, 더 배울게요. 말했으면 지켜야죠."
 mcpe.30.c:0 "네가 무능한 탓이거늘, 감히 내게 허물을 돌리느냐?!"
 mcpegr.30.d:0 "[child.GetTitledFirstName|U](은)는 스승에게 더 열심히 공부하겠다고 약속했지만, 요즘도 나아지는 기색이 없습니다. 당신은 [child.GetSheHe](이)가 그 약속을 어떻게 생각하는지 알고 싶어 직접 물었습니다.\n\n"
 mcpegr.30.d_arbitrary:0 "[child.GetSheHe|U](은)는 처음의 약속 따위 이미 마음에 두지 않았습니다."
 mcpegr.30.d_diligent:0 "[child.GetSheHe|U](은)는 여전히 처음의 약속을 중히 여기며, 앞으로 더욱 부지런히 하겠다고 다짐했습니다."
 mcpegr.30.d_wrathful:0 "[child.GetSheHe|U](은)는 모든 잘못을 스승에게 돌리며, 스승이 무능한 탓에 자기 학업이 조금도 나아지지 않았다고 단정했습니다."
 mcpegr.30.confirm_arbitrary:0 "어떤 약속은 본디 깨라고 있는 것이다."
 mcpegr.30.confirm_diligent:0 "아주 좋다, [child.GetFirstNameNoTooltip|U], 계속 정진하거라."
 mcpegr.30.confirm_wrathful:0 "그 분노는 이해할 만하구나."
 mcpegr.30.arbitrary_change:0 "그 약속을 무엇하러 신경 쓰느냐?"
 mcpegr.30.diligent_change:0 "말했으면 지켜야지, 계속 열심히 하거라!"
 mcpegr.30.wrathful_change:0 "그 용렬한 스승이 너를 그르쳤거늘, 화도 나지 않느냐?"
 mcpe.31.t:0 "뒷소문"
 mcpe.31.d.no_bully_fallback:0 "어떤 아이가 뒤에서 당신에 대한 악랄한 소문을 줄곧 퍼뜨리고 있습니다. 관심을 끌고 싶어서인지, 아니면 질투 때문인지 모르지만, 까닭이 무엇이든 일은 이미 벌어졌습니다."
 mcpe.31.d.bully:0 "[bully.GetTitledFirstName|U](이)가 뒤에서 당신에 대한 악랄한 소문을 줄곧 퍼뜨리고 있습니다. [bully.GetSheHe](이)가 관심을 끌고 싶어서인지, 아니면 질투 때문인지 모르지만, 까닭이 무엇이든 일은 이미 벌어졌습니다."
 mcpe.31.a:0 "……처지가 달랐다면 우리는 친구가 될 수도 있었을 텐데."
 mcpe.31.b:0 "……나를 모욕한 자는 까닭이 무엇이든 반드시 대가를 치를 것이다."
 mcpe.31.c:0 "……아랫것들이 나를 어떻게 보든 무슨 상관이냐."
 mcpegr.31.d.no_bully_fallback:0 "어떤 아이가 [child.GetTitledFirstName]에 대한 악랄한 소문을 줄곧 퍼뜨리고 있습니다. [child.GetFirstNameNoTooltip](은)는 상대가 관심을 끌고 싶어서이거나, 아니면 질투 때문일 것이라 생각합니다.\n\n"
 mcpegr.31.d.bully:0 "[bully.GetTitledFirstName|U](이)가 [child.GetTitledFirstName]에 대한 악랄한 소문을 줄곧 퍼뜨리고 있습니다. [child.GetFirstNameNoTooltip](은)는 [bully.GetFirstNameNoTooltip](이)가 관심을 끌고 싶어서이거나, 아니면 질투 때문일 것이라 생각합니다.\n\n"
 mcpegr.31.d_forgiving:0 "[child.GetSheHe|U](은)는 그런 짓이 참으로 딱하다고 여기며, 이 일로 상대에게 오래 원한을 품고 싶지 않았습니다."
 mcpegr.31.d_vengeful:0 "[child.GetSheHe|U](은)는 상대가 무슨 까닭에서였든, 자신을 모욕한 자는 반드시 대가를 치러야 한다고만 생각했습니다."
 mcpegr.31.d_arrogant:0 "[child.GetSheHe|U](은)는 소문 따위 아예 마음에 두지 않았습니다. [child.GetSheHe](이)가 보기에 자기보다 한참 못한 자들은 상대할 가치도 없었습니다."
 mcpegr.31.confirm_forgiving:0 "그렇다, 맺을 수 있었던 우정이 아깝구나."
 mcpegr.31.confirm_vengeful:0 "옳다, 저들이 대가를 치르게 해야지."
 mcpegr.31.confirm_arrogant:0 "그렇다, 무엇하러 저들을 상대하겠느냐."
 mcpegr.31.forgiving_change:0 "너희는 좋은 친구가 될 수도 있었다!"
 mcpegr.31.vengeful_change:0 "누구도 너를 업신여기게 두어서는 안 된다!"
 mcpegr.31.arrogant_change:0 "아랫것들의 말을 무엇하러 마음에 두느냐?"
 mcpe.32.t:0 "굶주린 아이의 도둑질"
 mcpe.32.d:0 "장터에서 당신은 누더기를 걸친 아이 하나가 짐 더미 뒤에 숨어 있다가 틈을 타 먹을 것을 훔치는 것을 봅니다. [guardian.GetTitledFirstName|U]도 그것을 보고, 당신이 무어라 하는지 지켜보고 있습니다."
 mcpe.32.a:0 "상인에게 저 아이가 도둑질했다고 알려야 해요!"
 mcpe.32.b:0 "저 아이를 찾아내서 부하로 삼아요."
 mcpe.32.c:0 "이 불쌍한 아이에게 먹을 걸 좀 줘요!"
 mcpegr.32.d:0 "장터에서 당신은 누더기를 걸친 아이 하나가 틈을 타 먹을 것을 훔치는 것을 보았습니다. [child.GetTitledFirstName|U]도 그것을 보고 당신에게 말했습니다.\n\n"
 mcpegr.32.d_honest:0 "“그 상인에게 누가 물건을 훔쳤는지 알려 줘야 해요.”"
 mcpegr.32.d_ambitious:0 "“그 아이를 찾기만 하면 먹을 것 조금으로 우리 일을 시킬 수 있어요.”"
 mcpegr.32.d_generous:0 "“그 아이가 다시는 훔치지 않도록 먹을 것을 좀 줘야 해요.”"
 mcpegr.32.confirm_honest:0 "그렇다, 도둑은 잡아야지."
 mcpegr.32.confirm_ambitious:0 "좋은 생각이다, [child.GetFirstNameNoTooltip|U]."
 mcpegr.32.confirm_generous:0 "좋다, 그럼 그 아이를 좀 도와주자꾸나."
 mcpegr.32.honest_change:0 "상인에게 누가 훔쳤는지 알려야 한다!"
 mcpegr.32.ambitious_change:0 "그 아이를 우리 밑에서 일하게 하면 어떻겠느냐?"
 mcpegr.32.generous_change:0 "아니다, 그 불쌍한 아이에게 먹을 것을 주거라!"
 mcpe.33.t:0 "꽃나무 가꾸기"
 mcpe.33.d:0 "당신은 요즘 꽃나무 가꾸기를 배우고 있지만, 직접 돌보는 모종이 좀처럼 자라지 않습니다. 스승은 초목에도 저마다 때가 있다고 하지만, 당신이 보기에는 길고 지루한 기다림일 뿐입니다."
 mcpe.33.a:0 "너무 지루해. 이런 데 쓸 시간 없어."
 mcpe.33.b:0 "이 일로 속 끓일 필요는 없지."
 mcpe.33.c:0 "꽃과 풀을 가꾸는 것만으로도 만족해."
 mcpegr.33.d:0 "[child.GetTitledFirstName|U](은)는 요즘 꽃나무 가꾸기를 배우고 있지만, 직접 돌보는 모종이 좀처럼 자라지 않습니다. 당신이 [child.GetHerHim]에게 이 일을 이야기하자, [child.GetSheHe](은)는 이렇게 말했습니다.\n\n"
 mcpegr.33.d_impatient:0 "“너무 지루해요. 계속 기다릴 시간 같은 건 없어요!”"
 mcpegr.33.d_calm:0 "“서두를 필요 없어요. 누구도 모든 걸 한 번에 배울 수는 없잖아요.”"
 mcpegr.33.d_content:0 "“꽃과 풀을 가꾸는 것만으로도 충분히 만족스러워요. 사람들이 왜 굳이 권세와 영화를 좇는지 정말 모르겠어요.”"
 mcpegr.33.confirm_impatient:0 "그래, 그럼 다른 걸 해 보자꾸나."
 mcpegr.33.confirm_calm:0 "그렇다, 부끄러워할 일은 아니다."
 mcpegr.33.confirm_content:0 "그렇다, 만족할 줄 알면 늘 즐거운 법이지."
 mcpegr.33.impatient_change:0 "무엇하러 이런 데 세월을 허비하느냐."
 mcpegr.33.calm_change:0 "이 일로 속 끓일 필요는 없지."
 mcpegr.33.content_change:0 "이제 권세와 이익을 다투는 것이 부질없음을 알겠느냐?"
 mcpe.34.t:0 "연병장의 휴식"
 mcpe.34.d:0 "당신은 오전 내내 병사들이 연병장에서 훈련하는 모습을 지켜보았습니다. 점심 무렵 쉬는 틈에, 당신은 그들에게 다가가 몇 마디 나누기로 합니다."
 mcpe.34.a:0 "새롭고 재미있는 이야기를 해 줘!"
 mcpe.34.b:0 "여러분 수고가 많아요. 정말 존경해요!"
 mcpe.34.c:0 "게으름 피우지 말고 계속 훈련해라!"
 mcpegr.34.d:0 "[child.GetTitledFirstName|U](은)는 오전 내내 병사들이 훈련하는 모습을 지켜보았습니다. 점심 무렵 쉬는 틈에, [child.GetSheHe](은)는 먼저 다가가 그들과 이야기를 나누었습니다.\n\n"
 mcpegr.34.d_gregarious:0 "[child.GetSheHe|U](은)는 병사들과 주거니 받거니 이야기를 나누며 금세 그들과 한데 어울렸습니다."
 mcpegr.34.d_humble:0 "[child.GetSheHe|U](은)는 모두를 지켜 주는 병사들에게 감사를 표했고, 이 칭찬에 병사들은 꽤 흐뭇해했습니다."
 mcpegr.34.d_sadistic:0 "[child.GetSheHe|U](은)는 병사들에게 게으름 피우지 말고 계속 훈련하라고 호통쳐서 모두의 원성을 샀습니다."
 mcpegr.34.confirm_gregarious:0 "이야기를 나누는 것은 물론 즐거운 일이지."
 mcpegr.34.confirm_humble:0 "병사들을 존중하다니, 아주 좋구나."
 mcpegr.34.confirm_sadistic:0 "[child.GetHerHim]의 말을 들었으렷다, 모두 돌아가 훈련하라!"
 mcpegr.34.gregarious_change:0 "[child.GetFirstNameNoTooltip|U](은)는 사람들과 어울리는 법을 배워야 한다!"
 mcpegr.34.humble_change:0 "[child.GetFirstNameNoTooltip|U](은)는 병사들을 존중해야 한다!"
 mcpegr.34.sadistic_change:0 "[child.GetFirstNameNoTooltip|U](은)는 저들의 게으름을 꾸짖어야 한다!"
 mcpe.35.t:0 "어리다고 무시당함"
 mcpe.35.d:0 "어른들은 늘 당신이 어리다는 핑계로 당신의 말을 진지하게 들어 주지 않습니다. 이런 무시라면 이미 신물이 났으니, 저들의 생각을 바꿀 방도를 찾아야겠습니다."
 mcpe.35.a:0 "남이 나를 어른으로 대하길 바란다면 먼저 어른다운 모습을 보여야지."
 mcpe.35.b:0 "내가 크게 소리치면 저들도 들을 수밖에 없을 거야!"
 mcpe.35.c:0 "서두를 것 없어. 내가 자라면 자연히 해결될 거야."
 mcpegr.35.d:0 "[child.GetTitledFirstName|U](은)는 어른들이 늘 어리다는 핑계로 [child.GetHerHim](을)를 무시하는 것이 불만이었습니다. 한참을 곰곰이 생각한 끝에 [child.GetSheHe](은)는 당신에게 말했습니다.\n\n"
 mcpegr.35.d_temperate:0 "“저들이 저를 어른으로 봐 주길 바란다면, 먼저 제가 어른다운 모습을 보여야 해요.”"
 mcpegr.35.d_stubborn:0 "“제 목소리만 크면 저들도 언젠가는 제 말을 들을 수밖에 없을 거예요!”"
 mcpegr.35.d_patient:0 "“이 일은 서두를 수 없어요. 제가 자라면 자연히 문제가 안 될 거예요.”"
 mcpegr.35.confirm_temperate:0 "그렇다, 어른다운 모습을 갖춰야지."
 mcpegr.35.confirm_stubborn:0 "그렇다, 바로 그거다."
 mcpegr.35.confirm_patient:0 "그렇다, 걱정할 것 없다."
 mcpegr.35.temperate_change:0 "너도 이제 어른다운 모습을 보여야 한다!"
 mcpegr.35.stubborn_change:0 "거리낌 없이 소리 높여 말하면 된다!"
 mcpegr.35.patient_change:0 "조금만 더 기다리면 된다!"
