l_korean:
 rule_embattle_side_advantage_multiplier:0 "포진 — 구버전 우위 배수(비활성화됨)"
 setting_embattle_side_advantage_1x:0 "구버전 옵션"
 setting_embattle_side_advantage_1x_desc:0 "구버전 텍스트 호환용입니다. 현행 부장 전투 수정치는 전투 평균 공식을 사용합니다."
 setting_embattle_side_advantage_0.5x:0 "구버전 옵션"
 setting_embattle_side_advantage_0.5x_desc:0 "구버전 텍스트 호환용입니다. 현행 부장 전투 수정치는 전투 평균 공식을 사용합니다."
 rule_embattle_side_commander_traits_sharing:0 "포진 — 부장 전투 특성 공유"
 setting_embattle_side_commander_traits_sharing_enable:0 "활성화"
 setting_embattle_side_commander_traits_sharing_enable_desc:0 "휘하 군대의 주장은 교전 시 부장의 지정된 전투 특성을 빌려 쓸 수 있습니다. 같은 특성은 경험이 가장 높은 단계 하나만 적용되며 중복되지 않습니다."
 setting_embattle_side_commander_traits_sharing_disable:0 "비활성화"
 setting_embattle_side_commander_traits_sharing_disable_desc:0 "주장이 부장의 전투 특성을 빌리지 않습니다. 부장의 임명과 전투 평균 보너스에는 영향이 없습니다. 이미 빌린 특성은 다음 군대 정비 때 제거됩니다."
 rule_embattle_side_commander_appointor:0 "포진 — 부장 수동 임면"
 setting_embattle_side_commander_appointor_ai_only_except_own_troop:0 "친정 부대만"
 setting_embattle_side_commander_appointor_ai_only_except_own_troop_desc:0 "직접 통솔하는 군대의 부장만 직접 임면할 수 있으며, 나머지 군대의 부장은 자동으로 보충됩니다."
 setting_embattle_side_commander_appointor_player_exempt:0 "모든 아군 부대"
 setting_embattle_side_commander_appointor_player_exempt_desc:0 "직접 주장을 맡지 않아도 휘하 어느 군대의 부장이든 직접 임면할 수 있습니다."
 rule_embattle_tactic:0 "포진 — 구버전 전술(제거됨)"
 setting_embattle_tactic_enabled:0 "비활성화됨(구 저장 파일 호환)"
 setting_embattle_tactic_enabled_desc:0 "부가 전술은 폐지되었으며, 이 옵션을 선택해도 다시 활성화되지 않습니다."
 setting_embattle_tactic_disabled:0 "비활성화됨"
 setting_embattle_tactic_disabled_desc:0 "부가 전술은 폐지되었습니다."
 rule_embattle_side_commanders_trait_xp:0 "포진 — 부장 추가 특성 경험"
 setting_embattle_side_commanders_trait_xp_enabled:0 "활성화"
 setting_embattle_side_commanders_trait_xp_enabled_desc:0 "부장은 행군, 공성, 약탈 시 해당 특성의 경험을 추가로 얻을 수 있습니다. 행군 경험은 휘하 군대의 부장에게만 주어지며, 공성과 약탈 경험은 모든 세력의 군대에 주어집니다. 부장은 본군에 남아 있어야 하며 해당 특성을 이미 갖추고 있어야 합니다."
 setting_embattle_side_commanders_trait_xp_disabled:0 "비활성화"
 setting_embattle_side_commanders_trait_xp_disabled_desc:0 "부장은 더 이상 행군, 공성, 약탈 경험을 추가로 얻지 않습니다. 주장의 경험 획득은 평소와 같습니다."
 rule_embattle_acotw_compatch:0 "포진 — 구 호환 옵션(비활성화됨)"
 setting_embattle_acotw_compatch_enabled:0 "비활성화됨(구 저장 파일 호환)"
 setting_embattle_acotw_compatch_enabled_desc:0 "이 옵션은 비활성화되었습니다. 부장의 선임은 본군 안에서만 이루어지며, 보충하지 못하면 잠시 공석으로 둡니다."
 setting_embattle_acotw_compatch_disabled:0 "비활성화됨"
 setting_embattle_acotw_compatch_disabled_desc:0 "이 옵션은 비활성화되었으며, 부장의 자동 임명에 영향을 주지 않습니다."
