l_korean:
 # 衣冠南渡·局势窗口（docs/衣冠南渡_重做设计.md §1 第 10 轮、§5.12 模块 F；gui/window_hd_yiguan.gui）

 # ---------- 标题栏与阶段大图 ----------
 hd_yiguan_gui_participants_tt:0 "查看五方参与者名录"
 hd_yiguan_gui_map_situation_tt:0 "切换到局势地图：按参与的各方着色"
 hd_yiguan_gui_map_realms_tt:0 "返回国家地图"
 hd_yiguan_gui_current_phase:0 "当前阶段"
 hd_yiguan_gui_years:0 "衣冠南渡已历[Situation.MakeScope.Var('hd_yiguan_years').GetValue|0]年 · 本阶段始于[SituationPhase.GetStartDate.GetStringShort]"
 hd_yiguan_gui_years_new:0 "衣冠南渡初起 · 本阶段始于[SituationPhase.GetStartDate.GetStringShort]"
 hd_yiguan_gui_fallback_note:0 "满二百年仍未了结，将按北方八州归属自动定局"
 hd_yiguan_gui_phase_unlocks:0 "本阶段开放："

 # ---------- 你的组 ----------
 hd_yiguan_gui_my_group_header:0 "你的立场"
 hd_yiguan_gui_my_group_sub:0 "你所在的组"
 hd_yiguan_gui_no_group:0 "你置身于这场南渡之外。只有都城在北方八州或荆扬的独立君主（公爵级以上），以及尚未汉化的胡人君主治下、都城在北方八州的汉人封臣（伯爵级以上）和宅邸在北方八州的无地汉人世族，才会卷入其中。"
 hd_yiguan_gui_view_participants:0 "查看各方"

 # ---------- 去向与诱因 ----------
 hd_yiguan_gui_future_header:0 "天下去向"
 hd_yiguan_gui_future_hint:0 "某一去向积满一千点，天下即转入该阶段，此后各去向重新计数。点击卡片可查看推动它的诱因，悬停可查看该阶段各方境况。"
 hd_yiguan_gui_leading_tt:0 "当前领先的去向"
 hd_yiguan_gui_phase_points:0 "[FutureSituationPhase.GetProgress]/[FutureSituationPhase.GetTakeoverPoints]"
 hd_yiguan_gui_catalyst_header:0 "推动「[SituationPhaseType.GetNameNoTooltip]」的诱因"
 hd_yiguan_gui_catalyst_hint:0 "同一诱因每年至多计三次（时间流逝除外）。右侧为本阶段内已触发的次数。"
 hd_yiguan_gui_catalyst_none:0 "眼下没有能推动这一去向的诱因。"
 hd_yiguan_gui_catalyst_count:0 "[Select_CString( GreaterThan_int32( SituationPhase.GetNumCompletionsOfCatalystForPhase( SituationPhaseType.Self, SituationCatalystEntry.GetCatalyst ), '(int32)0' ), '#COLOR_GREEN ', '#COLOR_GRAY ' )]×[SituationPhase.GetNumCompletionsOfCatalystForPhase( SituationPhaseType.Self, SituationCatalystEntry.GetCatalyst )]#!"
 hd_yiguan_gui_catalyst_back:0 "返回"
 hd_yiguan_gui_catalyst_back_tt:0 "取消选择，改看当前领先的去向"

 # ---------- 本阶段各组效果 ----------
 hd_yiguan_gui_effects_header:0 "「[SituationPhaseType.GetNameNoTooltip]」之时，各方境况"
 hd_yiguan_gui_effects_yours:0 "（你所在的组）"
 hd_yiguan_gui_effects_none:0 "此阶段对这一方没有特别的影响。"
 hd_yiguan_gui_effects_pick:0 "点击上方页签，查看各方在本阶段的境况。"

 # ---------- 本组可用决议 ----------
 hd_yiguan_gui_decisions_header:0 "本组可用决议"
 hd_yiguan_gui_decisions_hint:0 "灰色为暂不满足条件；悬停查看说明，点击查看全部条件。"
 hd_yiguan_gui_decisions_none:0 "你所在的一方眼下没有可用的衣冠南渡决议。"

 # ---------- 结局 ----------
 hd_yiguan_gui_endings_header:0 "结局"
 hd_yiguan_gui_endings_hint:0 "符合条件者可宣布结局，衣冠南渡随之了结。点击卡片查看全部条件。"
 hd_yiguan_gui_endings_ready:0 "时势已至，有结局可以宣布！"
 hd_yiguan_gui_end_possible:0 "可以宣布"
 hd_yiguan_gui_end_blocked:0 "条件未满足"
 hd_yiguan_gui_end_not_eligible:0 "你无宣布资格"
 hd_yiguan_gui_end_phase_taowang_ok:0 "当前正值逃亡期"
 hd_yiguan_gui_end_phase_taowang_bad:0 "须待逃亡期"
 hd_yiguan_gui_end_phase_chongtu_ok:0 "当前正值冲突期"
 hd_yiguan_gui_end_phase_chongtu_bad:0 "须待冲突期"
 hd_yiguan_gui_end_phase_tingzhi_ok:0 "当前正值停滞期"
 hd_yiguan_gui_end_phase_tingzhi_bad:0 "须待停滞期"
 hd_yiguan_gui_end_cond_guangfu:0 "南方政权或北方汉人的独立君主（王国级以上），本人势力占北方八州六成以上的县，且据有洛阳或长安。"
 hd_yiguan_gui_end_cond_heliu:0 "诸汉化政权合计占北方八州六成以上的县，由其中势力最大者宣布。"
 hd_yiguan_gui_end_cond_lunsang:0 "胡人政权的独立君主（王国级以上），本人势力占北方七成以上的县，兼据洛阳与长安；北方属汉人政权的县不足一成。"
 # 实时进度（只在有资格且正值对应阶段时显示；占比、门槛读 A2 脚本值，两京判定同结局决议 holder.top_liege = 本人）
 hd_yiguan_gui_end_prog_guangfu:0 "本人势力占北方：#high [GetPlayer.MakeScope.ScriptValue('hd_yiguan_realm_north_pct_value')|1]%#!（需 [GetPlayer.MakeScope.ScriptValue('hd_yiguan_end_guangfu_pct_value')|0]%）\n洛阳：[Select_CString( ObjectsEqual( GetTitleByKey('c_luoyang').GetHolder.GetTopLiege, GetPlayer ), '#P 已据#!', '#N 未据#!' )]　长安：[Select_CString( ObjectsEqual( GetTitleByKey('c_uuii_p_867').GetHolder.GetTopLiege, GetPlayer ), '#P 已据#!', '#N 未据#!' )]（据其一即可）"
 hd_yiguan_gui_end_prog_heliu:0 "诸汉化政权合计占北方：#high [GetPlayer.MakeScope.ScriptValue('hd_yiguan_north_sin_pct_value')|1]%#!（需 [GetPlayer.MakeScope.ScriptValue('hd_yiguan_end_heliu_pct_value')|0]%）"
 hd_yiguan_gui_end_prog_lunsang:0 "本人势力占北方：#high [GetPlayer.MakeScope.ScriptValue('hd_yiguan_realm_north_pct_value')|1]%#!（需 [GetPlayer.MakeScope.ScriptValue('hd_yiguan_end_lunsang_pct_value')|0]%）\n汉人政权占北方：#high [GetPlayer.MakeScope.ScriptValue('hd_yiguan_north_han_pct_value')|1]%#!（须低于 [GetPlayer.MakeScope.ScriptValue('hd_yiguan_end_lunsang_han_max_pct_value')|0]%）\n洛阳：[Select_CString( ObjectsEqual( GetTitleByKey('c_luoyang').GetHolder.GetTopLiege, GetPlayer ), '#P 已据#!', '#N 未据#!' )]　长安：[Select_CString( ObjectsEqual( GetTitleByKey('c_uuii_p_867').GetHolder.GetTopLiege, GetPlayer ), '#P 已据#!', '#N 未据#!' )]（须兼据）"
