 # 2026-10-25：190 历史事件新增——蒯越献策平定江南（hd190.0002~0005）、李傕郭汜相攻（hd190.0006~0007）
 hd190.0002.t:0 "괴월의 헌책"
 hd190.0002.desc:0 "초평 원년, 당신은 조서를 받아 형주자사가 되었습니다. 이때 강남에는 종적이 크게 일어나, 소대는 장사태수를 자처하고 화용장 패우와 함께 각기 병사를 끼고 난을 일으켰으며, 강하의 도적 장호와 진생은 무리를 모아 양양성을 차지하고 있습니다. 게다가 원술이 노양에 군사를 주둔시켜 길이 막혔으니, 자사는 임지에 들어갈 수조차 없습니다.\n\n당신은 홀로 말을 타고 의성에 들어가 남군의 명사 괴량과 괴월을 청해 함께 대책을 논의했습니다. 괴월이 진언했습니다. \"태평한 세상을 다스리는 자는 인의를 앞세우고, 어지러운 세상을 다스리는 자는 권모를 앞세웁니다. 종적의 우두머리들은 대개 탐욕스럽고 포악하여 아랫사람들에게도 미움을 받습니다. 제가 평소 길러 둔 사람들을 시켜 이익을 보여 주면 반드시 무리를 이끌고 올 것입니다. 그대가 무도한 자를 베고 나머지를 어루만져 쓰신다면, 온 주의 백성이 살아갈 즐거움을 품을 것입니다. 병사가 모이고 무리가 따르면, 남으로 강릉에 웅거하고 북으로 양양을 지켜, 형주 여덟 군을 격문 한 장으로 평정할 수 있습니다.\""
 hd190.0002.a:0 "이도의 계책을 따르겠다."
 hd190.0002.a.tt:0 "반년 뒤 강남 종적의 우두머리들은 부름에 응해 연회에 왔다가 처형되고, 장호와 진생은 항복하여 막하에 들어옵니다. 장사, 남평, 양양, 남향은 모두 당신의 직할이 되며, 당신은 치소를 양양으로 옮깁니다."
 hd190.0002.b:0 "종적의 일은 잠시 미뤄 두자."
 hd190.0002.b.tt:0 "괴월의 계책을 쓰지 않습니다. 강남의 우두머리들은 훗날 무력으로 평정해야 합니다."
 hd190.0003.t:0 "의성의 연회"
 hd190.0003.desc:0 "유표가 보낸 사자가 서신을 들고 왔습니다. 형주가 막 안정되었으니 군 안의 호걸들과 함께 대사를 도모하고 싶다며, 의성 연회에 당신을 초청하고 관작을 내리겠다고 약속합니다. 사자의 말로는 부름에 응해 길을 떠난 강남의 우두머리가 이미 수십 명이라 합니다.\n\n휘하의 한 사람이 목소리를 낮추어 말립니다. 유경승은 홀로 말을 타고 형주에 들어와 손에 쥔 병사도 변변치 않을 터인데, 어찌 종적의 우두머리들을 이리도 후하게 대접한단 말입니까?"
 hd190.0003.a:0 "연회에 간다."
 hd190.0003.b:0 "병을 핑계로 가지 않는다."
 hd190.0003.b.tt:0 "유표가 군사를 일으켜 공격해 옵니다."
 hd190.0004.t:0 "홀로 말을 달려 항복을 권하다"
 hd190.0004.desc:0 "괴월과 방계 두 사람이 병사 하나 거느리지 않고 홀로 말을 타고 진영 앞에 와서 면회를 청합니다. 괴월은 이해를 따져 말합니다. 연회의 부름에 응한 강남의 우두머리들은 모두 처형되었고, 유 사군께는 병사가 모이고 무리가 따르고 있으며, 당신이 지키는 것은 외딴 성 하나뿐이니 조만간 함락될 것이라고. 갑옷을 벗고 항복한다면 목숨을 보전하고 막하에 이름을 올릴 수 있다고 합니다."
 hd190.0004.a:0 "갑옷을 벗고 항복한다."
 hd190.0004.b:0 "성에 의지해 끝까지 지킨다."
 hd190.0004.b.tt:0 "유표가 군사를 일으켜 공격해 옵니다."
 hd190.0005.t:0 "강남이 모두 평정되다"
 hd190.0005.desc:0 "괴월의 계책에 따라 당신은 강남 종적의 우두머리들을 두루 의성 연회에 초청했습니다. 부름에 응해 온 자들은 자리에서 모두 처형되었고, 그들의 부곡은 모두 휘하에 들어왔습니다. 괴월과 방계는 또 홀로 말을 달려 양양으로 가서 설득했고, 장호와 진생이 잇달아 항복했습니다.\n\n명에 응한 자들은 모두 평정되었고, 끝내 오지 않은 자에게는 군사로 임할 수밖에 없습니다. 형주 여덟 군은 이제 격문 한 장으로 평정할 수 있습니다."
 hd190.0005.a:0 "이도의 계책이 십만 대군보다 낫구나."
 hd190.0006.t:0 "이각과 곽사가 서로 싸우다"
 hd190.0006.desc_fan:0 "흥평 2년 봄, 당신은 연회 자리에서 호봉을 시켜 번조를 끌어내 죽였고, 이로부터 장수들은 저마다 의심과 두려움을 품었습니다. 곽사는 자주 당신에게 와서 술을 마시고 때로는 묵고 돌아가지 않았습니다. 곽사의 아내는 당신이 시비와 첩으로 남편의 마음을 빼앗을까 두려워, 당신이 보낸 술과 음식에 메주를 넣어 독처럼 꾸며 곽사에게 보여 주며 한 둥지에 두 수컷은 살 수 없다고 했습니다. 훗날 당신이 다시 곽사를 술자리에 청하자, 곽사는 크게 취해 돌아가 독을 탔다고 의심했고 분즙을 마시고서야 겨우 토해 냈습니다.\n\n이리하여 곽사는 군사를 정비해 당신과 서로 공격하게 되었습니다. 당신은 [hd190_lg_li_duchy.GetName]에 웅거하고, 곽사는 [hd190_lg_guo_duchy.GetName]로 물러났습니다. 관중의 나머지 현들은 각자 스스로를 지킬 뿐 더는 명을 따르지 않습니다."
 hd190.0006.desc:0 "흥평 2년 봄, 곽사는 자주 당신에게 와서 술을 마시고 때로는 묵고 돌아가지 않았습니다. 곽사의 아내는 당신이 시비와 첩으로 남편의 마음을 빼앗을까 두려워, 당신이 보낸 술과 음식에 메주를 넣어 독처럼 꾸며 곽사에게 보여 주며 한 둥지에 두 수컷은 살 수 없다고 했습니다. 훗날 당신이 다시 곽사를 술자리에 청하자, 곽사는 크게 취해 돌아가 독을 탔다고 의심했고 분즙을 마시고서야 겨우 토해 냈습니다.\n\n이리하여 곽사는 군사를 정비해 당신과 서로 공격하게 되었습니다. 당신은 [hd190_lg_li_duchy.GetName]에 웅거하고, 곽사는 [hd190_lg_guo_duchy.GetName]로 물러났습니다. 관중의 나머지 현들은 각자 스스로를 지킬 뿐 더는 명을 따르지 않습니다."
 hd190.0006.a:0 "이놈이 감히 이럴 수가!"
 hd190.0007.t:0 "한 둥지에 두 수컷은 없다"
 hd190.0007.desc_fan:0 "흥평 2년 봄, 이각은 연회 자리에서 호봉을 시켜 번조를 끌어내 죽였고, 이로부터 장수들은 저마다 의심과 두려움을 품었습니다. 당신은 자주 이각에게 가서 술을 마시고 때로는 묵고 돌아가지 않았습니다. 당신의 아내는 이각이 시비와 첩으로 당신의 마음을 빼앗을까 두려워, 이각이 보낸 술과 음식에 메주를 넣어 독처럼 꾸며 당신에게 보여 주며 한 둥지에 두 수컷은 살 수 없다고 했습니다. 훗날 이각이 다시 당신을 술자리에 청하자, 당신은 크게 취해 돌아와 독을 탔다고 의심했고 분즙을 마시고서야 겨우 토해 냈습니다.\n\n이제 당신은 [hd190_lg_guo_duchy.GetName]로 물러나 이각과 각기 한 군씩 차지하고 있으며, 관중의 나머지 현들은 각자 스스로를 지키고 있습니다. 당장 군사를 일으켜 이각을 치겠습니까?"
 hd190.0007.desc:0 "흥평 2년 봄, 당신은 자주 이각에게 가서 술을 마시고 때로는 묵고 돌아가지 않았습니다. 당신의 아내는 이각이 시비와 첩으로 당신의 마음을 빼앗을까 두려워, 이각이 보낸 술과 음식에 메주를 넣어 독처럼 꾸며 당신에게 보여 주며 한 둥지에 두 수컷은 살 수 없다고 했습니다. 훗날 이각이 다시 당신을 술자리에 청하자, 당신은 크게 취해 돌아와 독을 탔다고 의심했고 분즙을 마시고서야 겨우 토해 냈습니다.\n\n이제 당신은 [hd190_lg_guo_duchy.GetName]로 물러나 이각과 각기 한 군씩 차지하고 있으며, 관중의 나머지 현들은 각자 스스로를 지키고 있습니다. 당장 군사를 일으켜 이각을 치겠습니까?"
 hd190.0007.a:0 "당장 군사를 일으켜라!"
 hd190.0007.a.tt:0 "'병탄'으로 이각에게 선전포고합니다. 전쟁이 시작되면 중보병 35대, 중기병 60대의 부대를 얻습니다."
 hd190.0007.b:0 "당분간 군사를 움직이지 않는다."
 hd190.0008.t:0 "곽사가 부풍을 차지하다"
 hd190.0008.desc:0 "흥평 2년 봄, 이각과 곽사는 장안에서 서로 독살을 의심하다 군사를 맞부딪쳤습니다. 곽사는 무리를 이끌고 서쪽으로 달아나 미현에 웅거하고 부풍 땅을 모두 차지했습니다.\n\n부풍에 있던 당신의 영지는 곽사에게 빼앗겼거나, 아니면 곽사를 주군으로 받들 수밖에 없게 되었습니다."
 hd190.0008.a:0 "난병이 길을 막으니 어쩔 도리가 없구나."
 hd190_rival_li_guo:0 "[CHARACTER.GetShortUIName]와(과) [TARGET_CHARACTER.GetShortUIName]은(는) 술자리에서 서로 독살을 의심하다 끝내 군사를 맞부딪쳤습니다"
 hd190_rival_li_guo_corresponding:0 "[TARGET_CHARACTER.GetShortUIName]와(과) [CHARACTER.GetShortUIName]은(는) 술자리에서 서로 독살을 의심하다 끝내 군사를 맞부딪쳤습니다"
 hd190_guo_si_event_troops:0 "곽사의 부중"
