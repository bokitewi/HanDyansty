 hd190_sun_jian_army:0 "손견의 부곡"
 hd190.0001.t:0 "장로, 한중을 차지하다"
 hd190.0001.desc:0 "초평 2년 봄, 오두미도의 사군 장로는 장수와 함께 남정을 습격하여 한중태수 소고를 죽였습니다. 장로는 곧바로 사곡의 잔도를 끊고 한중에 웅거하여 자립하였으며, 더는 주목 유언의 명을 따르지 않습니다.\n\n이로써 파와 한 사이는 별천지가 되었습니다. 장로는 귀도로 백성을 가르치며, 관리를 두지 않고 좨주를 두어 다스립니다."
 hd190.0001.a:0 "한중은 이제 독자의 길을 갑니다."
