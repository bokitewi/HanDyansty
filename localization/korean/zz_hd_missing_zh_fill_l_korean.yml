 hd_dc_pressure_character_5:0 "위기의 임계점"
 hd_dc_pressure_county_2:0 "적폐가 드러남"
 hd_dc_pressure_county_3:0 "의심과 시기가 얽힘"
 hd_dc_pressure_county_4:0 "공공연한 질서 붕괴"
 hd_dc_pressure_county_5:0 "위기의 임계점"
 hd_dc_pressure_status:0 "위세: [Situation.MakeScope.Var('hd_dc_pressure_percent').GetValue|1]/100 · 제 [Situation.MakeScope.Var('hd_dc_pressure_band').GetValue|0]단계"
 hd_dc_pressure_status_tt:0 "위세 시기에는 조정에 누적된 폐단을 평가하고, 앞 시대가 남긴 요소를 보존하며, 치세에 이르면 그에 따라 조정합니다. 촉매 사건이 일어나면 그 대가는 현재 시대의 환산율로 계산되며, 할거 지역은 계속 위세 시대의 수치를 따릅니다. 위기의 다섯 단계와 치리의 상벌은 모두 이곳의 수치로 결정되며, 단계도의 촉매 진행도는 따로 유지됩니다.\n\n장악력과 개발도는 이번 주기의 기준선에 따라 군마다 누적 차감됩니다. 더 높은 단계가 아직 처리되지 않았을 때만 이후에 차액을 차감합니다. 수치가 내려갔다가 같은 단계로 돌아와도 중복 차감되지 않습니다. 제1단계가 60개월 지속되면 다음 주기에 기준선을 다시 계산합니다."
 hd_dc_prosperity_status:0 "번영: [Situation.MakeScope.Var('hd_dc_prosperity_percent').GetValue|1]/100"
 hd_dc_prosperity_status_tt:0 "번영 기록은 치리를 회복한 성과를 반영하며, 시대마다 독립된 하한과 상한이 있고 범위는 0에서 100까지입니다. 두 값은 동시에 오르내릴 수 있습니다. 촉매는 조정이 선호하는 개발 또는 확장 방향에 따라 번영 쪽으로 진행되며, 한 번에 한 방향만 고려합니다. 조정에 일시적으로 주인이 없을 때는 이전의 방향을 따릅니다. 시대가 바뀌어도 수치는 초기화되지 않습니다.\n\n단계도는 원래 시대의 진행도를 계속 표시합니다. 이곳의 번영 수치로 시대가 직접 바뀌지는 않으며, 할거에서 벗어나려면 여전히 실제 영토와 안정 기간의 조건을 충족해야 합니다."
 hd_dc_ritual_register_title:0 "왕실의 예서"
 hd_dc_ritual_register_tt:0 "종실 구성원이 분쟁할 때 근거로 삼는 예서 명부입니다. 처음 확인할 때는 최고 작위 등급과 나이에 따라 배열하며, 등급과 나이가 같으면 동렬로 둡니다. 이후에는 기존 순서를 유지하고, 천자가 실제로 내린 석차를 따로 기록합니다. 앞으로 종실에 관한 모든 의사에는 현재의 예서에 따라 자격을 갖춘 친족을 초청합니다."
 hd_dc_ritual_register_row:0 "제 [Scope.Var('hd_dc_ritual_rank').GetValue|0]위, [Scope.Var('hd_dc_actor').Char.GetName] · 이전 순위 제 [Scope.Var('hd_dc_ritual_old_rank').GetValue|0]위"
 hd_dc_roy_end.governance_pending_tt:0 "이미 일어난 정치적 결과만 기록하고 이번 급성 위기를 해소합니다. 작위를 다시 이전하지 않고, 속신을 해방하지 않으며, 평화 보상도 지급하지 않습니다. 최종 보상은 실제 전쟁, 조약 이행, 안정 기간과 위약의 기록을 참고하여 결정합니다."
 hdpc_soft_pressure_modifier:0 "잠시 민간에 거함"
 hdpc_soft_pressure_modifier_desc:0 "인구 조절 기간 동안 일시적으로 인물 풀에 놓였습니다. 이 출산 조정은 최대 10년간 지속되며, 조정으로 돌아오거나 관직을 맡거나 보호 구역에 들어가면 다음 연간 정비 때 해제됩니다. 이 조정은 건강을 깎지 않으며 직접 죽음을 초래하지도 않습니다."
 hdpc_high_pressure_modifier:0 "가족 확장 연기"
 hdpc_high_pressure_modifier_desc:0 "인물이 속한 인구가 조절 목표를 넘을 때 적용되는 임시 출산 조정입니다. 이 효과는 최대 10년간 지속되며, 전임 등의 상황으로 일찍 해제될 수 있습니다. 이 조정은 영구 불임을 일으키거나 특성을 바꾸지 않으며, 직접 죽음을 초래하지도 않습니다."

 # ===== 入关 / 反摄政 / 奉迎 =====
 hd_anti_regent.0100.a:0 "계속 진군한다."
 hd_anti_regent.0200.t:0 "입관 이후의 천하"
 hd_anti_regent.0200.desc:0 "관문이 마침내 활짝 열리고, 섭정의 직할령이 연합군의 손에 들어왔다. 장수들이 장막 앞에 저마다의 군공 장부를 올리며 전리품의 분배를 기다린다. 이제 동맹의 주인으로서 나는 분봉을 주관하여 섭정의 조정 장악을 끝내야 한다."
 hd_anti_regent.0200.a:0 "공을 따져 봉한다."
 hd_enter_the_passes_victory_desc:0 "연합군이 관중을 깨뜨리고 섭정의 직할령을 빼앗았습니다."
 hd_enter_the_passes_white_peace_desc:0 "침공 전쟁이 백색 평화로 끝나고 동맹은 와해되었습니다."
 hd_enter_the_passes_defeat_desc:0 "침공이 격퇴되어 섭정이 조정을 지켜 냈습니다."
 HD_ENTER_THE_PASSES_WAR_NAME:0 "입관 전쟁"
 hd_fengying.0001.alt_desc:0 "천자가 관중을 탈출할 수밖에 없게 되었다. 그러나 나에게는 아직 독립된 영지가 없어 조정을 내 치소로 맞아들일 수 없다. 여전히 군사를 보내 호송하며 형세를 지켜볼 수도 있고, 개입을 분명히 거절할 수도 있다."
 hd_fengying_cao_control:0 "조정을 단단히 틀어쥔다."

