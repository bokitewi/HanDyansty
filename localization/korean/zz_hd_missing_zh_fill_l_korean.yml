 xiali_adj:0 "하례"
 xiali_adherent:0 "육국"
 xiali_adherent_plural:0 "육국"
 xiali_desc:0 "하례는 하나라의 예제를 가리키며, 가장 이른 예악 제도이다. 하례는 상나라와 주나라 예악 문화의 기초를 놓았을 뿐 아니라, 사실상 화하 예악 문명 전체의 근간을 확립했다."
 xiali_religious_head_title:0 "후"
 xiali_religious_head_title_name:0 "하"
 yinli:0 "은례"
 yinli_adj:0 "은례"
 yinli_adherent:0 "육국"
 yinli_adherent_plural:0 "육국"
 yinli_desc:0 "은례는 상나라의 예제를 가리키며, 은나라 사람들이 하례를 본보기로 삼아 덜고 보태어 만든 산물이다."
 yinli_religious_head_title:0 "제"
 yinli_religious_head_title_name:0 "상"
 xizhouli:0 "서주례"
 xizhouli_adj:0 "서주례"
 xizhouli_adherent:0 "육국"
 xizhouli_adherent_plural:0 "육국"
 xizhouli_desc:0 "주나라 초기, 정치적으로 서주의 통치를 유지하는 봉건 제도를 뒷받침하기 위해 주공 단은 사상 분야를 전면적으로 개혁했다. 그는 상고 시대부터 상나라에 이르는 예악을 폭넓게 정리하고 개조하여, 음식, 거처, 제사, 상장 등 사회생활의 모든 방면을 아우르는 구체적이고 실행 가능한 예악 제도 일체를 확립하고, 이를 모두 ‘예’의 범위 안에 두었다."
 xizhouli_religious_head_title:0 "천자"
 xizhouli_religious_head_title_name:0 "주"
 dongzhouli:0 "동주례"
 dongzhouli_adj:0 "동주례"
 dongzhouli_adherent:0 "육국"
 dongzhouli_adherent_plural:0 "육국"
 dongzhouli_desc:0 "여산의 화 이후, 신후와 증후 등 제후들이 폐위된 태자 희의구를 주 천자로 옹립했다. 이로부터 화하의 대지는 예가 무너지고 악이 무너지며 제후들이 패권을 다투는 시대로 접어들었다. 야심만만한 수많은 제후가 더 이상 옛 예제의 구속을 달가워하지 않고, 권모술수와 전쟁으로 뜻을 이루려 했다."
 dongzhouli_religious_head_title:0 "천자"
 dongzhouli_religious_head_title_name:0 "주"

