 lijiao_religion_adjerent:0 "육국"
 lijiao_religion_adjerent_plural:0 "육국"
 lijiao_religion_desc:0 "고대 중국에서 ‘예’는 사회의 근본 제도이자 도덕 규범이었다. 국가 제도로서 예는 사회의 정치 질서를 반영하고, 상부 구조와 그 틀 안에서 사람과 사람이 교류하는 예의를 유지했다. 도덕 준칙으로서 예는 국가의 통치자와 귀족, 그리고 사회의 다른 모든 구성원의 행동 기준과 요구를 규정했다."
