 # ===== 朝代循环 =====
 hd_dc_theft_pending_credit_tt:0 "국고에서 이미 공제된 금액이 아직 모두 도착하지 않았습니다. 도착하지 않은 부분은 이번 인출 항목에 계속 기록되며, 같은 기록을 다시 처리해도 새로운 공제가 발생하지 않습니다."
 hd_dc_era_control_status:0 "조정 장악: [Situation.MakeScope.Var('hd_dc_controlled_counties').GetValue|0]/[Situation.MakeScope.Var('hd_dc_total_counties').GetValue|0]개 군([Situation.MakeScope.Var('hd_dc_control_percent').GetValue|1]%)"
 hd_dc_era_no_holder_status:0 "현재 패권을 쥔 이가 없어 장악률이 적용되지 않음"
 hd_dc_era_invalid_status:0 "정치 데이터가 아직 확인되지 않아 시대 판정이 중지됨"
 hd_dc_par.1201.q.tt:0 "이 임무의 실제 이행으로 해당 위기에 +5 치리 점수(Q)가 기록되었으며, 단 한 번만 정산됩니다. 이 영수증을 다시 읽어도 점수는 추가되지 않습니다."
 hd_dc_par.1201.no_q.tt:0 "이번에는 새로운 치리 점수가 기록되지 않았습니다. 실제 지급 기록은 보존되며, 이 영수증은 추가 지급이나 환불을 승인하지 않습니다."

 hd_dc_review_governance_decision:0 "위기 수습 검증"
 hd_dc_review_governance_decision_desc:0 "전황 보고는 더 이상 재촉하지 않지만, 앞서 한 약속들은 여전히 하나하나 검증해야 한다. 지금 어떤 옛 사건을 봉인하느냐가, 조정이 더 오래 이어질 태평을 맞이할 수 있을지를 결정할 것이다."
 hd_dc_review_governance_decision_tooltip:0 "최종적으로 종결할 수 있는 위기를 살펴보고, 종결하거나 계속 지켜볼지 선택합니다."
 hd_dc_review_governance_decision_confirm:0 "검증된 문서를 올림"
 hd_dc_governance_review_ready_tt:0 "적어도 하나의 정치적 결과가 확정되었고, 핵심 전쟁이 실제로 끝났으며, 처리할 행동이나 의무가 없고, 검증된 위기가 있음. 치리 수치가 20에 도달함. 또는 검증 후 시정되지 않은 중대한 위약이 있음."
 hd_dc_gov.0001.t:0 "이 문서는 언제 봉인하는가?"
 hd_dc_gov.0001.desc:0 "서리가 검증된 사항을 하나하나 짚고, 아직 확인에 시간이 필요한 부분은 한쪽으로 미루어 두었다. 승패는 한 가지 일이고, 백성이 편히 살 수 있는지, 약속이 지켜졌는지는 또 다른 일이다.\n\n이번 위기의 사건 번호는 [hd_dc_governance_instance.Var('hd_dc_instance_id').GetValue|0]이며, 실제 치리 수치는 [hd_dc_governance_instance.Var('hd_dc_q').GetValue|0]이다. 지금 문서를 봉인하여 현재의 성과대로 최종 결과를 기록할 수도 있고, 조금 더 기다려 이 안정이 시간의 시험을 견딜 수 있음을 증명할 수도 있다."
 hd_dc_gov.0001.a:0 "지금까지의 성과대로 종결한다."
 hd_dc_gov.0001.a.tt:0 "최종 정산은 단 한 번만 이루어집니다. 시정되지 않은 중대한 위약이 우선하여 위기 −10, 번영은 변동 없음. 그렇지 않으면, 치리 ≥60이고 5년 연속 완전 이행 시 위기 −35, 번영 +30. 치리 ≥40이고 3년 연속 실제 안정 시 위기 −20, 번영 +15. 치리 ≥20이고 핵심 전쟁이 끝났다면 위기 −10, 번영 +5. 반란 평정이 진압 결과만 얻었다면 정산 상한은 최하 단계입니다. 기다리기만 해서는 군권과 녹봉 개혁을 대신할 수 없습니다. 종결 후에는 더 높은 단계의 보상을 받을 수 없습니다."
 hd_dc_gov.0001.b:0 "계속 지켜보며 서둘러 문서를 덮지 않는다."
 hd_dc_gov.0001.b.tt:0 "이 사건을 잠시 보류하고 정산하지 않습니다. 실제로 최고 단계에 도달하면 자동으로 정산됩니다. 새로운 관련 전쟁이나 이행되지 않은 의무가 생기면 연속 안정 기간의 계산이 끊깁니다. 후속 행동을 기다리는 동안 이미 해소된 급성 위기 할당량은 더 이상 차지되지 않습니다."
 hd_dc_gov.0002.t:0 "문서 봉인 이후"
 hd_dc_gov.0002.high:0 "5년 동안 휴전은 확인할 수 있는 기록을 남겼고, 약속도 하나하나 지켜졌다. 담당 관리가 마지막 장에 결어를 적고, 새 문서와 옛 문서를 한데 묶었다.\n\n이 사건의 치리 최고 보상이 기록되었습니다: 위기 −35, 번영 +30. 정치적 승패는 여전히 실제 상황에 따라 기록되며, 이번 평정으로 바뀌지 않습니다."
 hd_dc_gov.0002.medium:0 "3년간의 안정으로 마침내 충분한 기록이 쌓였다. 아직 완벽하지 않은 부분이 있지만, 이미 실행된 휴전과 치안 조치는 지워져서는 안 된다.\n\n이 사건의 유효한 안정에 상응하는 보상이 주어졌습니다: 위기 −20, 번영 +15. 이 사건은 이후 다시 보상을 받을 자격이 없습니다."
 hd_dc_gov.0002.low:0 "전쟁은 분명히 끝났고 수습 조치도 검증되었다. 지금 종결한다면 기록되는 것은 제한적인 완화일 뿐, 오래 이어질 태평이라고 선언할 수는 없다.\n\n이 사건의 제한적인 완화가 기록되었습니다: 위기 −10, 번영 +5. 이 사건은 더 이상 보상을 받을 자격이 없습니다."
 hd_dc_gov.0002.breach:0 "장부에는 아직 이행되지 않은 중대한 협정이 하나 남아 있다. 이후의 죽음이나 계승, 승리로 지워지지도 않았고, 실제로 시정되지도 않았다. 문서에 유리한 면만 남겨 둘 수는 없다.\n\n이 사건은 최종적으로 시정되지 않은 중대한 위약으로 기록됩니다: 위기 +10, 번영은 변동 없음. 긍정적인 치리 보상은 함께 지급되지 않습니다."
 hd_dc_gov.0002.a:0 "이대로 보관한다."

 hd_dc_pressure_character_2:0 "적폐가 드러남"
 hd_dc_pressure_character_3:0 "의심과 시기가 얽힘"
