l_simp_chinese:
 hd_dc_debug_decision: "王朝循环调试"
 hd_dc_debug_decision_desc: "查看王朝循环的当前状态，调整危世与盛世，并检查实际事件流程。此入口只在调试模式出现。"
 hd_dc_debug_decision_tooltip: "打开王朝循环调试菜单"
 hd_dc_debug_decision_confirm: "打开调试菜单"
 hd_dc_debug.0001.t: "王朝循环调试"
 hd_dc_debug.0001.desc: "选择要检查的项目。查看状态不会推进事件；调整点数会立即刷新已接入的区域影响。\n\n实际付款、人物答复与等待期限仍按正常流程处理。"
 hd_dc_debug.status: "查看当前状态"
 hd_dc_debug.w: "调整危世 W"
 hd_dc_debug.h: "调整盛世 H"
 hd_dc_debug.events: "触发现有合法事件"
 hd_dc_debug.prepare: "准备测试场景"
 hd_dc_debug.0030.desc: "以下操作会实际改变当前世界。只有点击相应场景才会执行；新人物、关系和资金不会在关闭菜单后自动撤销。场景准备完成后，仍须从事件菜单发起正式流程。"
 hd_dc_debug.prepare_ord19: "准备 ORD-19 的三人场景"
 hd_dc_debug.prepare_ord19.tt: "生成45岁父亲、20岁青年和40岁保证人并加入你的宫廷；你与父亲在此刻建立仇敌关系，青年保留独立的个人关系与罪责。为你、青年和保证人之间所需的四个方向添加五年+100好感，并给你300金。每名玩家角色只准备一次，不自动替任何人接受提案。"
 hd_dc_debug_trust_opinion: "调试场景：共同信任"
 hd_dc_debug_rival_reason: "[TARGET_CHARACTER.GetShortUIName]与[CHARACTER.GetShortUIName]因调试场景准备成为仇敌"
 hd_dc_debug.close: "关闭"
 hd_dc_debug.back: "返回调试菜单"
 hd_dc_debug.refresh: "执行一次正式观察与刷新"
 hd_dc_debug.refresh.tt: "按正式观察流程更新区域快照、危世影响、事件池及在途事项；这项操作会改变游戏状态，但不会伪造经过的年月。"
 hd_dc_debug.0002.t: "当前王朝循环状态"
 hd_dc_debug.0002.ready: "危世 W：[scope:hd_dc_debug_region.Var('hd_dc_pressure_percent').GetValue|1] / 100\n盛世 H：[scope:hd_dc_debug_region.Var('hd_dc_prosperity_percent').GetValue|1] / 100\n危世档位：[scope:hd_dc_debug_region.Var('hd_dc_pressure_band').GetValue|0]\n你当前适用的事件F：[SCOPE.GetValue('hd_dc_debug_f')|2]；派系P：[SCOPE.GetValue('hd_dc_debug_p')|2]；计谋合并倍率：[SCOPE.GetValue('hd_dc_debug_scheme_f')|2]。不在适用区域时为1。疫病D按郡判定，五档1／1.05／1.10／1.15／1.20。\n\n最近一次 W 请求／实际增量：[scope:hd_dc_debug_region.Var('hd_dc_last_w_requested').GetValue|0] / [scope:hd_dc_debug_region.Var('hd_dc_last_w_actual').GetValue|0]\n最近一次 H 请求／实际增量：[scope:hd_dc_debug_region.Var('hd_dc_last_h_requested').GetValue|0] / [scope:hd_dc_debug_region.Var('hd_dc_last_h_actual').GetValue|0]\n上列增量为内部点数，每20点等于界面1点。"
 hd_dc_debug.0002.waiting: "王朝循环已经存在，W/H 尚未初始化。等待正式月度观察，或选择执行一次正式观察与刷新。"
 hd_dc_debug.points.desc: "调整值以界面点数计，范围为0至100。危世在20、40、60、80进入更高一档。\n\n点数变化经过统一写入与影响刷新；调低危世不会返还已损失的控制力或发展度，也不会直接改变时代。"
 hd_dc_debug.minus_10: "减少10点"
 hd_dc_debug.minus_1: "减少1点"
 hd_dc_debug.plus_1: "增加1点"
 hd_dc_debug.plus_10: "增加10点"
 hd_dc_debug.set_0: "设为0"
 hd_dc_debug.set_20: "设为20"
 hd_dc_debug.set_40: "设为40"
 hd_dc_debug.set_60: "设为60"
 hd_dc_debug.set_80: "设为80"
 hd_dc_debug.set_100: "设为100"
 hd_dc_debug.0020.desc: "手动发起一次正式事件，跳过年度抽签等待。人物资格、当前待答复事项与实际履行条件仍然有效。不可选的项目保留在菜单中，可查看缺少的条件。"
 hd_dc_debug.ord09: "ORD-09：赎回亲族"
 hd_dc_debug.ord09.tt: "需要实际被囚的合格亲族、合法囚禁者和当前行动权限；已有待答复普通事件时不可另开。"
 hd_dc_debug.ord13: "ORD-13：案牍与坏消息"
 hd_dc_debug.ord13.tt: "需要区域内在位成年统治者、至少第二级压力，以及持有控制力不足50之郡的合格直属封臣。已有待答复普通事件时不可另开。"
 hd_dc_debug.ord19: "ORD-19：仇敌的孩子"
 hd_dc_debug.ord19.tt: "需要实际在廷的成年旧敌子女，且此人没有可供你监禁的个人罪责，也不是你的私人仇敌。有限合作另需双方共同信任的保证人。已有待答复普通事件时不可另开。"
