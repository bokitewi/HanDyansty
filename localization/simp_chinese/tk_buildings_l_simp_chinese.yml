l_simp_chinese:

 #####三国新增建筑
 building_type_TK_20_10_WaHuangGong: "陵墓祖地"
 building_type_TK_20_10_WaHuangGong_desc: "先王圣贤长眠或受祀之所，后人岁时至此致祭，追念先祖功德。"
 TK_20_10_WaHuangGong: "娲皇宫"
 building_TK_20_10_WaHuangGong: "$TK_20_10_WaHuangGong$"
 building_TK_20_10_WaHuangGong_desc: "相传女娲在此抟土造人、炼石补天，山崖之间至今留有她的遗迹。每到暮春，远近乡人便携香登山，向娲皇祈求子嗣与年丰。"
 building_type_TK_20_10_FuXiMiao: "陵墓祖地"
 building_type_TK_20_10_FuXiMiao_desc: "先王圣贤长眠或受祀之所，后人岁时至此致祭，追念先祖功德。"
 TK_20_10_FuXiMiao: "伏羲庙"
 building_TK_20_10_FuXiMiao: "$TK_20_10_FuXiMiao$"
 building_TK_20_10_FuXiMiao_desc: "陈地相传是太昊伏羲氏的旧都。伏羲画八卦、结网罟、定嫁娶，被尊为人祖，每逢正月，四乡百姓结伴来此“朝人宗”，香烟终日不散。"
 building_type_TK_20_10_HuangDiLing: "陵墓祖地"
 building_type_TK_20_10_HuangDiLing_desc: "先王圣贤长眠或受祀之所，后人岁时至此致祭，追念先祖功德。"
 TK_20_10_HuangDiLing: "黄帝陵"
 building_TK_20_10_HuangDiLing: "$TK_20_10_HuangDiLing$"
 building_TK_20_10_HuangDiLing_desc: "桥山之上有黄帝冢。相传黄帝乘龙升天，群臣只得葬其衣冠于此；孝武皇帝北巡朔方归来，也曾亲至山下致祭。"
 building_type_TK_20_10_YanDiLing: "陵墓祖地"
 building_type_TK_20_10_YanDiLing_desc: "先王圣贤长眠或受祀之所，后人岁时至此致祭，追念先祖功德。"
 TK_20_10_YanDiLing: "炎帝陵"
 building_TK_20_10_YanDiLing: "$TK_20_10_YanDiLing$"
 building_TK_20_10_YanDiLing_desc: "相传炎帝神农氏尝百草、教民稼穑，晚年巡行南方，崩葬于此。乡民奉他为农耕之祖，春耕之前必来致祭。"
 building_type_TK_20_10_DaYuLing: "陵墓祖地"
 building_type_TK_20_10_DaYuLing_desc: "先王圣贤长眠或受祀之所，后人岁时至此致祭，追念先祖功德。"
 TK_20_10_DaYuLing: "大禹陵"
 building_TK_20_10_DaYuLing: "$TK_20_10_DaYuLing$"
 building_TK_20_10_DaYuLing_desc: "大禹治平洪水，会诸侯于江南，计功而崩，便葬在会稽山下，山上有禹穴。太史公年少时曾登会稽、探禹穴，越人世代守护祭祀。"
 building_type_TK_20_10_MaZuMiao: "陵墓祖地"
 building_type_TK_20_10_MaZuMiao_desc: "先王圣贤长眠或受祀之所，后人岁时至此致祭，追念先祖功德。"
 TK_20_10_MaZuMiao: "妈祖庙"
 building_TK_20_10_MaZuMiao: "$TK_20_10_MaZuMiao$"
 building_TK_20_10_MaZuMiao_desc: "闽中海外有湄洲屿，孤悬于风涛之间。往来渔人望岛而行，每遇风浪，便向海神叩祷，祈求平安归航。"
 building_type_TK_20_10_DaHuaiShu: "陵墓祖地"
 building_type_TK_20_10_DaHuaiShu_desc: "先王圣贤长眠或受祀之所，后人岁时至此致祭，追念先祖功德。"
 TK_20_10_DaHuaiShu: "大槐树"
 building_TK_20_10_DaHuaiShu: "$TK_20_10_DaHuaiShu$"
 building_TK_20_10_DaHuaiShu_desc: "河东汾水之畔，地近尧都平阳，自古人烟稠密。村口古槐参天，枝叶如盖，往来行旅多在树下歇脚，远行之人临别总要回望一眼。"
 building_type_TK_20_10_QianLing: "陵墓祖地"
 building_type_TK_20_10_QianLing_desc: "先王圣贤长眠或受祀之所，后人岁时至此致祭，追念先祖功德。"
 TK_20_10_QianLing: "乾陵"
 building_TK_20_10_QianLing: "$TK_20_10_QianLing$"
 building_TK_20_10_QianLing_desc: "梁山在扶风好畤之北，三峰并峙，北峰最高，南面两峰对立如阙。始皇帝曾在此修筑梁山宫，登临远眺。"
 building_type_TK_20_20_TianZhaoShenGong: "寺庙神社"
 building_type_TK_20_20_TianZhaoShenGong_desc: "奉祀神明之所，香火终年不绝，四方信众不远千里前来礼拜。"
 TK_20_20_TianZhaoShenGong: "天照神宫"
 building_TK_20_20_TianZhaoShenGong: "$TK_20_20_TianZhaoShenGong$"
 building_TK_20_20_TianZhaoShenGong_desc: "海东倭国的女王卑弥呼事鬼道，能惑众，年长不嫁，深居宫中，罕有人得见。倭人在此奉祀日神，以为国运所系。"
 building_type_TK_20_20_BaiMaSi: "寺庙神社"
 building_type_TK_20_20_BaiMaSi_desc: "奉祀神明之所，香火终年不绝，四方信众不远千里前来礼拜。"
 TK_20_20_BaiMaSi: "白马寺"
 building_TK_20_20_BaiMaSi: "$TK_20_20_BaiMaSi$"
 building_TK_20_20_BaiMaSi_desc: "孝明皇帝夜梦金人，遣使西求佛法，迎来摄摩腾、竺法兰两位沙门，以白马驮经至洛阳，因立此寺。寺中译出的经卷，是中土最早的浮屠之书。"
 building_type_TK_20_20_FaMenSi: "寺庙神社"
 building_type_TK_20_20_FaMenSi_desc: "奉祀神明之所，香火终年不绝，四方信众不远千里前来礼拜。"
 TK_20_20_FaMenSi: "法门寺"
 building_TK_20_20_FaMenSi: "$TK_20_20_FaMenSi$"
 building_TK_20_20_FaMenSi_desc: "相传扶风美阳之地藏有佛陀的指骨舍利，是天竺阿育王分舍利起塔所及之处。桓、灵之际，有浮屠之徒在此结庐守护，时人称之为阿育王寺。"
 building_type_TK_20_20_ChuYunDaShe: "寺庙神社"
 building_type_TK_20_20_ChuYunDaShe_desc: "奉祀神明之所，香火终年不绝，四方信众不远千里前来礼拜。"
 TK_20_20_ChuYunDaShe: "出云大社"
 building_TK_20_20_ChuYunDaShe: "$TK_20_20_ChuYunDaShe$"
 building_TK_20_20_ChuYunDaShe_desc: "倭地出云，奉祀开拓国土、执掌幽冥的大国主之神。传说每年十月，诸神都会聚集于此，共议人间之事。"
 building_type_TK_20_20_HaiYinSi: "寺庙神社"
 building_type_TK_20_20_HaiYinSi_desc: "奉祀神明之所，香火终年不绝，四方信众不远千里前来礼拜。"
 TK_20_20_HaiYinSi: "海印寺"
 building_TK_20_20_HaiYinSi: "$TK_20_20_HaiYinSi$"
 building_TK_20_20_HaiYinSi_desc: "伽耶山在弁韩之地，峰峦层叠，林木幽深。三韩之俗敬事鬼神，每岁播种之后，乡民便聚于山间祭祀，歌舞饮酒，昼夜不休。"
 building_type_TK_20_20_WuDangShanDaoGuan: "寺庙神社"
 building_type_TK_20_20_WuDangShanDaoGuan_desc: "奉祀神明之所，香火终年不绝，四方信众不远千里前来礼拜。"
 TK_20_20_WuDangShanDaoGuan: "武当山道观"
 building_TK_20_20_WuDangShanDaoGuan: "$TK_20_20_WuDangShanDaoGuan$"
 building_TK_20_20_WuDangShanDaoGuan_desc: "武当山诸峰朝拱天柱，岩壑幽深，自古便有方士隐者在此结庐修炼。山中的宫观依峰傍崖而建，钟磬之声终日回荡于林间。"
 building_type_TK_20_20_ShaoLinSi: "寺庙神社"
 building_type_TK_20_20_ShaoLinSi_desc: "奉祀神明之所，香火终年不绝，四方信众不远千里前来礼拜。"
 TK_20_20_ShaoLinSi: "少林寺"
 building_TK_20_20_ShaoLinSi: "$TK_20_20_ShaoLinSi$"
 building_TK_20_20_ShaoLinSi_desc: "少室山在嵩高之西，与太室并峙，相传因大禹的妻妹曾居于此而得名。峰峦如削，林木茂密，常有隐者入山修道。"
 building_type_TK_20_20_LingYinSi: "寺庙神社"
 building_type_TK_20_20_LingYinSi_desc: "奉祀神明之所，香火终年不绝，四方信众不远千里前来礼拜。"
 TK_20_20_LingYinSi: "灵隐寺"
 building_TK_20_20_LingYinSi: "$TK_20_20_LingYinSi$"
 building_TK_20_20_LingYinSi_desc: "钱唐县西有武林山，武林水由此流出。山中峰石嶙峋，洞壑幽深，林泉清绝，是吴越之间的隐逸胜地。"
 building_type_TK_20_20_DaYanTa: "寺庙神社"
 building_type_TK_20_20_DaYanTa_desc: "奉祀神明之所，香火终年不绝，四方信众不远千里前来礼拜。"
 TK_20_20_DaYanTa: "大雁塔"
 building_TK_20_20_DaYanTa: "$TK_20_20_DaYanTa$"
 building_TK_20_20_DaYanTa_desc: "长安城东南原隰起伏，近有曲江池水。孝武皇帝曾在此营建宜春苑，于池畔游猎宴饮。"
 building_type_TK_20_20_XuanKongSi: "寺庙神社"
 building_type_TK_20_20_XuanKongSi_desc: "奉祀神明之所，香火终年不绝，四方信众不远千里前来礼拜。"
 TK_20_20_XuanKongSi: "悬空寺"
 building_TK_20_20_XuanKongSi: "$TK_20_20_XuanKongSi$"
 building_TK_20_20_XuanKongSi_desc: "恒山脚下峡谷深险，两崖壁立如削，谷中仅容一线山道。北地商旅与戍卒往来，都须从此峡穿行。"
 building_type_TK_20_20_YanDaoShenShe_01: "寺庙神社"
 building_type_TK_20_20_YanDaoShenShe_01_desc: "奉祀神明之所，香火终年不绝，四方信众不远千里前来礼拜。"
 TK_20_20_YanDaoShenShe_01: "严岛神社"
 building_TK_20_20_YanDaoShenShe_01: "$TK_20_20_YanDaoShenShe_01$"
 building_TK_20_20_YanDaoShenShe_01_desc: "倭地内海之中有一座小岛，山林葱郁，潮涨时海水漫上沙渚。倭人视全岛为神明所居，不敢在岛上耕作砍伐。"
 building_type_TK_20_20_YanDaoShenShe_02: "寺庙神社"
 building_type_TK_20_20_YanDaoShenShe_02_desc: "奉祀神明之所，香火终年不绝，四方信众不远千里前来礼拜。"
 TK_20_20_YanDaoShenShe_02: "严岛神社高级"
 building_TK_20_20_YanDaoShenShe_02: "$TK_20_20_YanDaoShenShe_02$"
 building_TK_20_20_YanDaoShenShe_02_desc: "倭地内海之中有一座小岛，山林葱郁，潮涨时海水漫上沙渚。倭人视全岛为神明所居，不敢在岛上耕作砍伐。"
 building_type_TK_20_20_YiShiShenGong: "寺庙神社"
 building_type_TK_20_20_YiShiShenGong_desc: "奉祀神明之所，香火终年不绝，四方信众不远千里前来礼拜。"
 TK_20_20_YiShiShenGong: "伊势神宫"
 building_TK_20_20_YiShiShenGong: "$TK_20_20_YiShiShenGong$"
 building_TK_20_20_YiShiShenGong_desc: "倭地东方有一条清冽的川水，两岸林木森然。传说日神择此清净之地安居，倭人便在川畔奉祀，不敢稍有亵渎。"
 building_type_TK_20_20_HuangLongSi: "寺庙神社"
 building_type_TK_20_20_HuangLongSi_desc: "奉祀神明之所，香火终年不绝，四方信众不远千里前来礼拜。"
 TK_20_20_HuangLongSi: "皇龙寺"
 building_TK_20_20_HuangLongSi: "$TK_20_20_HuangLongSi$"
 building_TK_20_20_HuangLongSi_desc: "辰韩斯卢国都邑附近的平野，土地肥美，河流环绕。辰韩之人善种五谷，晓蚕桑，能织缣布，邑落多聚于此间。"
 building_type_TK_20_20_TianTaiZongSiYuan: "寺庙神社"
 building_type_TK_20_20_TianTaiZongSiYuan_desc: "奉祀神明之所，香火终年不绝，四方信众不远千里前来礼拜。"
 TK_20_20_TianTaiZongSiYuan: "天台宗寺院"
 building_TK_20_20_TianTaiZongSiYuan: "$TK_20_20_TianTaiZongSiYuan$"
 building_TK_20_20_TianTaiZongSiYuan_desc: "会稽东南群山深处，有巨岩拔地而起，四面绝壁，岩顶却平旷如台。登顶夜望，星月似在咫尺之间。"
 building_type_TK_20_20_NanHuaSi: "寺庙神社"
 building_type_TK_20_20_NanHuaSi_desc: "奉祀神明之所，香火终年不绝，四方信众不远千里前来礼拜。"
 TK_20_20_NanHuaSi: "南华寺"
 building_TK_20_20_NanHuaSi: "$TK_20_20_NanHuaSi$"
 building_TK_20_20_NanHuaSi_desc: "曲江县南有曹溪，溪水清浅，两岸山林幽静，岭南的炎热至此稍减，往来行旅常在溪边歇息。"
 building_type_TK_20_20_DaZhaoSi: "寺庙神社"
 building_type_TK_20_20_DaZhaoSi_desc: "奉祀神明之所，香火终年不绝，四方信众不远千里前来礼拜。"
 TK_20_20_DaZhaoSi: "大昭寺"
 building_TK_20_20_DaZhaoSi: "$TK_20_20_DaZhaoSi$"
 building_TK_20_20_DaZhaoSi_desc: "西南极远之地，雪山环抱着一片高原河谷，土人以牧牛羊为生，敬奉山川湖泊之神。中原之人罕有至者，只闻其地苦寒而多奇异。"
 building_type_TK_20_21_ChangAnCheng: "文化古城"
 building_type_TK_20_21_ChangAnCheng_desc: "城郭久立，前代王侯曾在此建都立国，市井之间犹存旧时风物。"
 TK_20_21_ChangAnCheng: "长安城"
 building_TK_20_21_ChangAnCheng: "$TK_20_21_ChangAnCheng$"
 building_TK_20_21_ChangAnCheng_desc: "汉家西京，高祖定鼎于此，未央、长乐两宫巍然，八水环绕，关中沃野千里，号称天府。光武中兴迁都洛阳之后，西京虽不复为帝居，宗庙陵寝仍在，三辅依旧繁盛。"
 building_type_TK_20_21_LuoYangCheng: "文化古城"
 building_type_TK_20_21_LuoYangCheng_desc: "城郭久立，前代王侯曾在此建都立国，市井之间犹存旧时风物。"
 TK_20_21_LuoYangCheng: "洛阳城"
 building_TK_20_21_LuoYangCheng: "$TK_20_21_LuoYangCheng$"
 building_TK_20_21_LuoYangCheng_desc: "洛阳居天下之中，北依邙山，南临洛水，自周公营建洛邑以来便是王者之都。光武中兴定都于此，南北两宫相望，四方贡赋与游学士子辐辏于此。"
 building_type_TK_20_21_ZiJinCheng: "文化古城"
 building_type_TK_20_21_ZiJinCheng_desc: "城郭久立，前代王侯曾在此建都立国，市井之间犹存旧时风物。"
 TK_20_21_ZiJinCheng: "紫禁城"
 building_TK_20_21_ZiJinCheng: "$TK_20_21_ZiJinCheng$"
 building_TK_20_21_ZiJinCheng_desc: "蓟城是燕国旧都、幽州治所，北倚燕山，扼守塞外通往中原的门户，胡汉商旅与戍边兵马都在此会聚。"
 building_type_TK_20_21_JinGuanCheng: "文化古城"
 building_type_TK_20_21_JinGuanCheng_desc: "城郭久立，前代王侯曾在此建都立国，市井之间犹存旧时风物。"
 TK_20_21_JinGuanCheng: "锦官城"
 building_TK_20_21_JinGuanCheng: "$TK_20_21_JinGuanCheng$"
 building_TK_20_21_JinGuanCheng_desc: "成都为蜀郡治所，相传是张仪依咸阳之制筑成。城中织锦之业兴盛，官府专设锦官督造，蜀锦行销天下；城外渠堰纵横，沃野千里，水旱从人。"
 building_type_TK_20_21_GuSuCheng: "文化古城"
 building_type_TK_20_21_GuSuCheng_desc: "城郭久立，前代王侯曾在此建都立国，市井之间犹存旧时风物。"
 TK_20_21_GuSuCheng: "姑苏城"
 building_TK_20_21_GuSuCheng: "$TK_20_21_GuSuCheng$"
 building_TK_20_21_GuSuCheng_desc: "吴县为吴郡治所，相传伍子胥受吴王阖闾之命相土尝水、筑此大城。城西有姑苏台，太湖烟波在侧，水道纵横，舟楫往来如织。"
 building_type_TK_20_21_YangZhouCheng: "文化古城"
 building_type_TK_20_21_YangZhouCheng_desc: "城郭久立，前代王侯曾在此建都立国，市井之间犹存旧时风物。"
 TK_20_21_YangZhouCheng: "扬州城"
 building_TK_20_21_YangZhouCheng: "$TK_20_21_YangZhouCheng$"
 building_TK_20_21_YangZhouCheng_desc: "广陵城始于吴王夫差所筑的邗城，夫差又凿邗沟，连通江淮。高祖时吴王刘濞都于此，煮海为盐，即山铸钱，富甲东南。"
 building_type_TK_20_21_JingZhouCheng: "文化古城"
 building_type_TK_20_21_JingZhouCheng_desc: "城郭久立，前代王侯曾在此建都立国，市井之间犹存旧时风物。"
 TK_20_21_JingZhouCheng: "荆州城"
 building_TK_20_21_JingZhouCheng: "$TK_20_21_JingZhouCheng$"
 building_TK_20_21_JingZhouCheng_desc: "江陵为南郡治所，地近楚国旧都郢城。北据汉沔，南临大江，西通巴蜀，东连吴会，是荆楚的门户、用武之地。"
 building_type_TK_20_21_ShiTouCheng: "文化古城"
 building_type_TK_20_21_ShiTouCheng_desc: "城郭久立，前代王侯曾在此建都立国，市井之间犹存旧时风物。"
 TK_20_21_ShiTouCheng: "石头城"
 building_TK_20_21_ShiTouCheng: "$TK_20_21_ShiTouCheng$"
 building_TK_20_21_ShiTouCheng_desc: "秣陵西临大江，有石头山壁立江边，相传楚威王曾在此置金陵邑。山势险峻，下临江水，据此可扼大江上下，是用兵者必争之地。"
 building_type_TK_20_21_KaiFengHuangCheng: "文化古城"
 building_type_TK_20_21_KaiFengHuangCheng_desc: "城郭久立，前代王侯曾在此建都立国，市井之间犹存旧时风物。"
 TK_20_21_KaiFengHuangCheng: "开封皇城"
 building_TK_20_21_KaiFengHuangCheng: "$TK_20_21_KaiFengHuangCheng$"
 building_TK_20_21_KaiFengHuangCheng_desc: "陈留浚仪，是战国时魏国都城大梁的旧地。魏惠王自安邑迁都于此，开鸿沟引河水，城郭雄壮，后为秦将王贲引河水灌城而破。"
 building_type_TK_20_21_LinAnHuangCheng: "文化古城"
 building_type_TK_20_21_LinAnHuangCheng_desc: "城郭久立，前代王侯曾在此建都立国，市井之间犹存旧时风物。"
 TK_20_21_LinAnHuangCheng: "临安皇城"
 building_TK_20_21_LinAnHuangCheng: "$TK_20_21_LinAnHuangCheng$"
 building_TK_20_21_LinAnHuangCheng_desc: "钱唐江畔有山，形如凤凰展翅，东临大江，北望湖水。江潮每至，声势如雷，乡人传说那是伍子胥的怒魂驱水为涛。"
 building_type_TK_20_21_PingYaoGuCheng: "文化古城"
 building_type_TK_20_21_PingYaoGuCheng_desc: "城郭久立，前代王侯曾在此建都立国，市井之间犹存旧时风物。"
 TK_20_21_PingYaoGuCheng: "平遥古城"
 building_TK_20_21_PingYaoGuCheng: "$TK_20_21_PingYaoGuCheng$"
 building_TK_20_21_PingYaoGuCheng_desc: "平陶县城，相传周宣王时大将尹吉甫北伐猃狁，曾驻兵筑城于此。城垣方正，四周平畴沃野，是汾水东岸的一方重镇。"
 building_type_TK_20_21_FengDuGuiCheng: "文化古城"
 building_type_TK_20_21_FengDuGuiCheng_desc: "城郭久立，前代王侯曾在此建都立国，市井之间犹存旧时风物。"
 TK_20_21_FengDuGuiCheng: "丰都鬼城"
 building_TK_20_21_FengDuGuiCheng: "$TK_20_21_FengDuGuiCheng$"
 building_TK_20_21_FengDuGuiCheng_desc: "巴郡平都山临江而立，林木森然。相传方士王方平、阴长生在此修道，终得飞升，夜里山间阴风飒飒，乡人多不敢独行。"
 building_type_TK_20_21_LouLanGuGuo: "文化古城"
 building_type_TK_20_21_LouLanGuGuo_desc: "城郭久立，前代王侯曾在此建都立国，市井之间犹存旧时风物。"
 TK_20_21_LouLanGuGuo: "楼兰古国"
 building_TK_20_21_LouLanGuGuo: "$TK_20_21_LouLanGuGuo$"
 building_TK_20_21_LouLanGuGuo_desc: "楼兰在盐泽之西，当西域南北两道的冲要，胡商驼队必经于此。孝昭皇帝时傅介子斩楼兰王，朝廷更其国名为鄯善，自此归附汉家。"
 building_type_TK_20_21_JingJueGuCheng: "文化古城"
 building_type_TK_20_21_JingJueGuCheng_desc: "城郭久立，前代王侯曾在此建都立国，市井之间犹存旧时风物。"
 TK_20_21_JingJueGuCheng: "精绝古城"
 building_TK_20_21_JingJueGuCheng: "$TK_20_21_JingJueGuCheng$"
 building_TK_20_21_JingJueGuCheng_desc: "精绝是西域南道上的小国，王城坐落于一条小河之畔，四面皆是流沙。国中户口不多，却因商旅往来而颇为富庶，如今已为鄯善所并。"
 building_type_TK_20_21_GaoChangGuCheng: "文化古城"
 building_type_TK_20_21_GaoChangGuCheng_desc: "城郭久立，前代王侯曾在此建都立国，市井之间犹存旧时风物。"
 TK_20_21_GaoChangGuCheng: "高昌故城"
 building_TK_20_21_GaoChangGuCheng: "$TK_20_21_GaoChangGuCheng$"
 building_TK_20_21_GaoChangGuCheng_desc: "高昌壁在车师前国境内，地势高敞，人庶昌盛，故名。朝廷遣戊己校尉在此屯田戍守，扼守西域北道的要冲。"
 building_type_TK_20_21_GeShengGuCheng: "文化古城"
 building_type_TK_20_21_GeShengGuCheng_desc: "城郭久立，前代王侯曾在此建都立国，市井之间犹存旧时风物。"
 TK_20_21_GeShengGuCheng: "纥升骨城"
 building_TK_20_21_GeShengGuCheng: "$TK_20_21_GeShengGuCheng$"
 building_TK_20_21_GeShengGuCheng_desc: "高句骊始祖朱蒙自夫余南奔，在卒本川边建国称王，筑城于此山之上。城依山势而建，四面险峻，易守难攻。"
 building_type_TK_20_21_MingTiePeiGuCheng: "文化古城"
 building_type_TK_20_21_MingTiePeiGuCheng_desc: "城郭久立，前代王侯曾在此建都立国，市井之间犹存旧时风物。"
 TK_20_21_MingTiePeiGuCheng: "明铁佩古城"
 building_TK_20_21_MingTiePeiGuCheng: "$TK_20_21_MingTiePeiGuCheng$"
 building_TK_20_21_MingTiePeiGuCheng_desc: "大宛境内最大的城邑，城郭坚固，街衢与工坊井然。大宛多善马，汗血天马即出于此，孝武皇帝曾遣贰师将军远征，夺其良马而还。"
 building_type_TK_20_21_AiLaoGuGuo: "文化古城"
 building_type_TK_20_21_AiLaoGuGuo_desc: "城郭久立，前代王侯曾在此建都立国，市井之间犹存旧时风物。"
 TK_20_21_AiLaoGuGuo: "哀牢古国"
 building_TK_20_21_AiLaoGuGuo: "$TK_20_21_AiLaoGuGuo$"
 building_TK_20_21_AiLaoGuGuo_desc: "相传哀牢夷的始祖母沙壹在水中触沉木而有孕，生下十子，幼子九隆被推为王。孝明皇帝时哀牢王柳貌率众内附，朝廷在其地设永昌郡。"
 building_type_TK_20_21_WuGeKu: "文化古城"
 building_type_TK_20_21_WuGeKu_desc: "城郭久立，前代王侯曾在此建都立国，市井之间犹存旧时风物。"
 TK_20_21_WuGeKu: "吴哥窟"
 building_TK_20_21_WuGeKu: "$TK_20_21_WuGeKu$"
 building_TK_20_21_WuGeKu_desc: "南海之外有扶南国，国中大湖广阔，每逢夏秋多雨之时湖水倒涨，鱼虾极丰。相传其开国之君混填渡海而来，娶女王柳叶为妻，从此立国。"
 building_type_TK_20_21_GongShanCheng: "文化古城"
 building_type_TK_20_21_GongShanCheng_desc: "城郭久立，前代王侯曾在此建都立国，市井之间犹存旧时风物。"
 TK_20_21_GongShanCheng: "公山城"
 building_TK_20_21_GongShanCheng: "$TK_20_21_GongShanCheng$"
 building_TK_20_21_GongShanCheng_desc: "马韩之地有一座临江的山冈，江水绕山而流，山形陡峭。马韩诸国散居山海之间，各有长帅，此地居高临水，正是可以据守之处。"
 building_type_TK_20_21_PingAnJing: "文化古城"
 building_type_TK_20_21_PingAnJing_desc: "城郭久立，前代王侯曾在此建都立国，市井之间犹存旧时风物。"
 TK_20_21_PingAnJing: "平安京"
 building_TK_20_21_PingAnJing: "$TK_20_21_PingAnJing$"
 building_TK_20_21_PingAnJing_desc: "倭地有一片四山环抱的平川，几条河水自山间流出，土地平旷，宜于耕作，倭人的邑落散布其间。"
 building_type_TK_20_21_ShengLongHuangCheng01: "文化古城"
 building_type_TK_20_21_ShengLongHuangCheng01_desc: "城郭久立，前代王侯曾在此建都立国，市井之间犹存旧时风物。"
 TK_20_21_ShengLongHuangCheng01: "升龙城"
 building_TK_20_21_ShengLongHuangCheng01: "$TK_20_21_ShengLongHuangCheng01$"
 building_TK_20_21_ShengLongHuangCheng01_desc: "交趾郡治坐落于大河之畔，地势平坦，稻田一年两熟。中原士人避乱南来，多在此栖身，城中颇有文教之风。"
 building_type_TK_20_21_ShengLongHuangCheng02: "文化古城"
 building_type_TK_20_21_ShengLongHuangCheng02_desc: "城郭久立，前代王侯曾在此建都立国，市井之间犹存旧时风物。"
 TK_20_21_ShengLongHuangCheng02: "升龙皇城"
 building_TK_20_21_ShengLongHuangCheng02: "$TK_20_21_ShengLongHuangCheng02$"
 building_TK_20_21_ShengLongHuangCheng02_desc: "交趾郡治坐落于大河之畔，地势平坦，稻田一年两熟。中原士人避乱南来，多在此栖身，城中颇有文教之风。"
 building_type_TK_20_22_DaWenKouYiZhi: "村落遗址"
 building_type_TK_20_22_DaWenKouYiZhi_desc: "上古先民聚居的旧址，荒草间常能掘出陶器石器，父老相传是远古之民所遗。"
 TK_20_22_DaWenKouYiZhi: "大汶口遗址"
 building_TK_20_22_DaWenKouYiZhi: "$TK_20_22_DaWenKouYiZhi$"
 building_TK_20_22_DaWenKouYiZhi_desc: "汶水之滨的高阜上，乡人耕田时常掘出古陶与石斧，形制与今日器物迥异。父老相传，此处是上古先民聚居与埋葬之地。"
 building_type_TK_20_22_BanPoYiZhi: "村落遗址"
 building_type_TK_20_22_BanPoYiZhi_desc: "上古先民聚居的旧址，荒草间常能掘出陶器石器，父老相传是远古之民所遗。"
 TK_20_22_BanPoYiZhi: "半坡遗址"
 building_TK_20_22_BanPoYiZhi: "$TK_20_22_BanPoYiZhi$"
 building_TK_20_22_BanPoYiZhi_desc: "浐水东岸的原上，时有圆形的屋基与彩绘陶器出土。长安父老说，这是远在三代之前的先民村落。"
 building_type_TK_20_22_HeMuDuYiZhi: "村落遗址"
 building_type_TK_20_22_HeMuDuYiZhi_desc: "上古先民聚居的旧址，荒草间常能掘出陶器石器，父老相传是远古之民所遗。"
 TK_20_22_HeMuDuYiZhi: "河姆渡遗址"
 building_TK_20_22_HeMuDuYiZhi: "$TK_20_22_HeMuDuYiZhi$"
 building_TK_20_22_HeMuDuYiZhi_desc: "会稽余姚江畔的低地，乡人掘地时常见腐朽的木桩、焦黑的稻谷与骨器层层堆叠，似是上古越人屋舍的遗存。"
 building_type_TK_20_22_ShiGangPingYuan: "村落遗址"
 building_type_TK_20_22_ShiGangPingYuan_desc: "上古先民聚居的旧址，荒草间常能掘出陶器石器，父老相传是远古之民所遗。"
 TK_20_22_ShiGangPingYuan: "石缸平原"
 building_TK_20_22_ShiGangPingYuan: "$TK_20_22_ShiGangPingYuan$"
 building_TK_20_22_ShiGangPingYuan_desc: "西南夷之外的深山中有一片高原，遍地散布着巨大的石缸，大者可容数人。土人说这是古时巨人酿酒所用，至于何人所凿，已无人知晓。"
 building_type_TK_20_23_BaiLuDongShuYuan: "书院大学"
 building_type_TK_20_23_BaiLuDongShuYuan_desc: "学者聚徒讲学之所，经籍满架，四方士子负笈而来。"
 TK_20_23_BaiLuDongShuYuan: "白鹿洞书院"
 building_TK_20_23_BaiLuDongShuYuan: "$TK_20_23_BaiLuDongShuYuan$"
 building_TK_20_23_BaiLuDongShuYuan_desc: "庐山五老峰南麓，四山环合，溪涧清幽，远离尘嚣，正是隐士读书讲学的好去处。"
 building_type_TK_20_23_ShiGuShuYuan: "书院大学"
 building_type_TK_20_23_ShiGuShuYuan_desc: "学者聚徒讲学之所，经籍满架，四方士子负笈而来。"
 TK_20_23_ShiGuShuYuan: "石鼓书院"
 building_TK_20_23_ShiGuShuYuan: "$TK_20_23_ShiGuShuYuan$"
 building_TK_20_23_ShiGuShuYuan_desc: "蒸水与湘水在此交汇，江边一山形如石鼓，三面临水。乡人传说山上的石鼓每逢兵戈将起，便会自鸣。"
 building_type_TK_20_23_CuLaiShuYuan: "书院大学"
 building_type_TK_20_23_CuLaiShuYuan_desc: "学者聚徒讲学之所，经籍满架，四方士子负笈而来。"
 TK_20_23_CuLaiShuYuan: "徂徕书院"
 building_TK_20_23_CuLaiShuYuan: "$TK_20_23_CuLaiShuYuan$"
 building_TK_20_23_CuLaiShuYuan_desc: "徂徕山与泰山南北相望，山中松柏苍翠，《诗》中鲁人所颂的“徂来之松”便出于此。山居清静，宜于闭门治学。"
 building_type_TK_20_23_LiZeShuYuan: "书院大学"
 building_type_TK_20_23_LiZeShuYuan_desc: "学者聚徒讲学之所，经籍满架，四方士子负笈而来。"
 TK_20_23_LiZeShuYuan: "丽泽书院"
 building_TK_20_23_LiZeShuYuan: "$TK_20_23_LiZeShuYuan$"
 building_TK_20_23_LiZeShuYuan_desc: "会稽西部的山水之间，两湖相连，水光相映。《易》说“丽泽，兑；君子以朋友讲习”，两泽相附、彼此滋润，正合友朋聚首切磋之意。"
 building_type_TK_20_23_MaoShanShuYuan: "书院大学"
 building_type_TK_20_23_MaoShanShuYuan_desc: "学者聚徒讲学之所，经籍满架，四方士子负笈而来。"
 TK_20_23_MaoShanShuYuan: "茅山书院"
 building_TK_20_23_MaoShanShuYuan: "$TK_20_23_MaoShanShuYuan$"
 building_TK_20_23_MaoShanShuYuan_desc: "句曲山相传是茅盈、茅固、茅衷三兄弟修道成仙之处，故又称三茅山。山中清幽，道者与读书人都爱在此结庐。"
 building_type_TK_20_23_JiXiaXueGong: "书院大学"
 building_type_TK_20_23_JiXiaXueGong_desc: "学者聚徒讲学之所，经籍满架，四方士子负笈而来。"
 TK_20_23_JiXiaXueGong: "稷下学宫"
 building_TK_20_23_JiXiaXueGong: "$TK_20_23_JiXiaXueGong$"
 building_TK_20_23_JiXiaXueGong_desc: "齐国都城临淄的稷门之下，宣王时广招天下文学游说之士，邹衍、淳于髡、田骈、荀卿之徒都曾在此议论讲学，不治事而论国政，号为稷下先生。"
 building_type_TK_20_23_JiXianShuYuan: "书院大学"
 building_type_TK_20_23_JiXianShuYuan_desc: "学者聚徒讲学之所，经籍满架，四方士子负笈而来。"
 TK_20_23_JiXianShuYuan: "集贤书院"
 building_TK_20_23_JiXianShuYuan: "$TK_20_23_JiXianShuYuan$"
 building_TK_20_23_JiXianShuYuan_desc: "宫中典藏图籍之所，天下秘书汇聚于此，博学之士在这里校勘经传、撰著史书，烛火常彻夜不熄。"
 building_type_TK_20_23_NiShanShuYuan: "书院大学"
 building_type_TK_20_23_NiShanShuYuan_desc: "学者聚徒讲学之所，经籍满架，四方士子负笈而来。"
 TK_20_23_NiShanShuYuan: "尼山书院"
 building_TK_20_23_NiShanShuYuan: "$TK_20_23_NiShanShuYuan$"
 building_TK_20_23_NiShanShuYuan_desc: "鲁国昌平乡的尼丘山，相传孔子的父母曾在山中祈祷而得孔子，故孔子名丘、字仲尼。鲁地儒生常来此瞻仰。"
 building_type_TK_20_23_SongYangShuYuan: "书院大学"
 building_type_TK_20_23_SongYangShuYuan_desc: "学者聚徒讲学之所，经籍满架，四方士子负笈而来。"
 TK_20_23_SongYangShuYuan: "嵩阳书院"
 building_TK_20_23_SongYangShuYuan: "$TK_20_23_SongYangShuYuan$"
 building_TK_20_23_SongYangShuYuan_desc: "太室山南麓，古柏参天。相传孝武皇帝游嵩高时见此柏高大，封之为将军，乡人至今称为将军柏。"
 building_type_TK_20_23_YuLuShuYuan: "书院大学"
 building_type_TK_20_23_YuLuShuYuan_desc: "学者聚徒讲学之所，经籍满架，四方士子负笈而来。"
 TK_20_23_YuLuShuYuan: "岳麓书院"
 building_TK_20_23_YuLuShuYuan: "$TK_20_23_YuLuShuYuan$"
 building_TK_20_23_YuLuShuYuan_desc: "临湘城隔湘水西望，有山林木苍翠，是南岳衡山的余脉，故称岳麓。山前湘水北去，橘洲横卧江心。"
 building_type_TK_20_23_YingTianShuYuan: "书院大学"
 building_type_TK_20_23_YingTianShuYuan_desc: "学者聚徒讲学之所，经籍满架，四方士子负笈而来。"
 TK_20_23_YingTianShuYuan: "应天书院"
 building_TK_20_23_YingTianShuYuan: "$TK_20_23_YingTianShuYuan$"
 building_TK_20_23_YingTianShuYuan_desc: "梁国睢阳，昔年梁孝王在此大治宫室苑囿，筑兔园，招延四方豪杰，枚乘、司马相如、邹阳等名士都曾在此作赋游宴。"
 building_type_TK_20_23_AnDingShuYuan: "书院大学"
 building_type_TK_20_23_AnDingShuYuan_desc: "学者聚徒讲学之所，经籍满架，四方士子负笈而来。"
 TK_20_23_AnDingShuYuan: "安定书院"
 building_TK_20_23_AnDingShuYuan: "$TK_20_23_AnDingShuYuan$"
 building_TK_20_23_AnDingShuYuan_desc: "广陵东境的海陵，地近海滨，素有煮盐之利，仓廪丰实，吴王刘濞之时已有“海陵之仓”的名声。"
 building_type_TK_20_23_WanSongShuYuan: "书院大学"
 building_type_TK_20_23_WanSongShuYuan_desc: "学者聚徒讲学之所，经籍满架，四方士子负笈而来。"
 TK_20_23_WanSongShuYuan: "万松书院"
 building_TK_20_23_WanSongShuYuan: "$TK_20_23_WanSongShuYuan$"
 building_TK_20_23_WanSongShuYuan_desc: "钱唐城南的山岭上，松林连绵，风过时松涛如海。岭下湖水与大江遥遥相望，山居清幽，宜于读书。"
 building_type_TK_20_23_EHuShuYuan: "书院大学"
 building_type_TK_20_23_EHuShuYuan_desc: "学者聚徒讲学之所，经籍满架，四方士子负笈而来。"
 TK_20_23_EHuShuYuan: "鹅湖书院"
 building_TK_20_23_EHuShuYuan: "$TK_20_23_EHuShuYuan$"
 building_TK_20_23_EHuShuYuan_desc: "鄱阳东南群山之中有一座山，山顶有一片湖泊，四周林木葱茏，云气缭绕，人迹罕至，是隐居讲学的清幽之地。"
 building_type_TK_20_23_LiZhengShuYuan: "书院大学"
 building_type_TK_20_23_LiZhengShuYuan_desc: "学者聚徒讲学之所，经籍满架，四方士子负笈而来。"
 TK_20_23_LiZhengShuYuan: "丽正书院"
 building_TK_20_23_LiZhengShuYuan: "$TK_20_23_LiZhengShuYuan$"
 building_TK_20_23_LiZhengShuYuan_desc: "宫中修书之所，取《易》“重明以丽乎正”之义为名。学士们在此搜求遗书、校订典籍，以备天子顾问。"
 building_type_TK_20_24_YangGuangDaJinTa: "标建遗址"
 building_type_TK_20_24_YangGuangDaJinTa_desc: "一处闻名遐迩的楼阁古迹，过往行旅至此，无不驻足观望。"
 TK_20_24_YangGuangDaJinTa: "仰光大金塔"
 building_TK_20_24_YangGuangDaJinTa: "$TK_20_24_YangGuangDaJinTa$"
 building_TK_20_24_YangGuangDaJinTa_desc: "南海之滨的一座小山上，相传佛陀在世时，有两位商贾兄弟从天竺带回佛陀的头发，供奉于此。土人奉之为圣地，远近朝拜者络绎不绝。"
 building_type_TK_20_24_WuHouCi: "标建遗址"
 building_type_TK_20_24_WuHouCi_desc: "一处闻名遐迩的楼阁古迹，过往行旅至此，无不驻足观望。"
 TK_20_24_WuHouCi: "武侯祠"
 building_TK_20_24_WuHouCi: "$TK_20_24_WuHouCi$"
 building_TK_20_24_WuHouCi_desc: "锦官城南，古柏森森。蜀人在此立祠，奉祀一位鞠躬尽瘁的贤相，四时香火不绝，士民至此，无不肃然。"
 building_type_TK_20_24_YingXianMuTa: "标建遗址"
 building_type_TK_20_24_YingXianMuTa_desc: "一处闻名遐迩的楼阁古迹，过往行旅至此，无不驻足观望。"
 TK_20_24_YingXianMuTa: "应县木塔"
 building_TK_20_24_YingXianMuTa: "$TK_20_24_YingXianMuTa$"
 building_TK_20_24_YingXianMuTa_desc: "雁门郡南境的河谷平野，地势平旷，北望长城，南倚恒山，是胡骑南下与边军北出都要经过的地方。"
 building_type_TK_20_24_ZhaoZhouQiao: "标建遗址"
 building_type_TK_20_24_ZhaoZhouQiao_desc: "一处闻名遐迩的楼阁古迹，过往行旅至此，无不驻足观望。"
 TK_20_24_ZhaoZhouQiao: "赵州桥"
 building_TK_20_24_ZhaoZhouQiao: "$TK_20_24_ZhaoZhouQiao$"
 building_TK_20_24_ZhaoZhouQiao_desc: "常山平棘城南有洨水流过，水势不大，夏秋涨水时却常冲毁渡桥，往来行人只得涉水而过。"
 building_type_TK_20_24_FaShiLvGuan: "标建遗址"
 building_type_TK_20_24_FaShiLvGuan_desc: "一处闻名遐迩的楼阁古迹，过往行旅至此，无不驻足观望。"
 TK_20_24_FaShiLvGuan: "法师旅馆"
 building_TK_20_24_FaShiLvGuan: "$TK_20_24_FaShiLvGuan$"
 building_TK_20_24_FaShiLvGuan_desc: "倭地北方的山中有温泉涌出，泉水温热，土人相信能疗疾祛病，常有远道而来的人在泉边歇宿沐浴。"
 building_type_TK_20_24_GuangZhouFanFang: "标建遗址"
 building_type_TK_20_24_GuangZhouFanFang_desc: "一处闻名遐迩的楼阁古迹，过往行旅至此，无不驻足观望。"
 TK_20_24_GuangZhouFanFang: "广州蕃坊"
 building_TK_20_24_GuangZhouFanFang: "$TK_20_24_GuangZhouFanFang$"
 building_TK_20_24_GuangZhouFanFang_desc: "番禺为南海郡治，濒临大海，是岭南的都会。犀角、象齿、玳瑁、珠玑等海外珍货多在此集散，胡商蛮客往来不绝。"
 building_type_TK_20_24_DaLiShiKu: "标建遗址"
 building_type_TK_20_24_DaLiShiKu_desc: "一处闻名遐迩的楼阁古迹，过往行旅至此，无不驻足观望。"
 TK_20_24_DaLiShiKu: "大理三塔"
 building_TK_20_24_DaLiShiKu: "$TK_20_24_DaLiShiKu$"
 building_TK_20_24_DaLiShiKu_desc: "点苍山东麓、叶榆泽西岸之间，是一片狭长的平野，溪水纵横，田畴相接，叶榆县城便坐落于此。"
 building_type_TK_20_24_CangZhouTieShiZi: "标建遗址"
 building_type_TK_20_24_CangZhouTieShiZi_desc: "一处闻名遐迩的楼阁古迹，过往行旅至此，无不驻足观望。"
 TK_20_24_CangZhouTieShiZi: "沧州铁狮子"
 building_TK_20_24_CangZhouTieShiZi: "$TK_20_24_CangZhouTieShiZi$"
 building_TK_20_24_CangZhouTieShiZi_desc: "渤海之滨，地势卑湿，海潮时常倒灌。煮盐之利虽厚，水患亦多，滨海百姓年年都要与潮水相争。"
 building_type_TK_20_24_YueYangLou: "标建遗址"
 building_type_TK_20_24_YueYangLou_desc: "一处闻名遐迩的楼阁古迹，过往行旅至此，无不驻足观望。"
 TK_20_24_YueYangLou: "岳阳楼"
 building_TK_20_24_YueYangLou: "$TK_20_24_YueYangLou$"
 building_TK_20_24_YueYangLou_desc: "巴丘城临洞庭湖口，登城西望，湖水浩渺，君山浮于波心。此地扼湘水入江之口，舟师驻泊于此，可控荆南。"
 building_type_TK_20_24_HuangHeLou: "标建遗址"
 building_type_TK_20_24_HuangHeLou_desc: "一处闻名遐迩的楼阁古迹，过往行旅至此，无不驻足观望。"
 TK_20_24_HuangHeLou: "黄鹤楼"
 building_TK_20_24_HuangHeLou: "$TK_20_24_HuangHeLou$"
 building_TK_20_24_HuangHeLou_desc: "江夏黄鹄山临大江，北岸汉水在此汇入，登高可尽览江汉合流之势。相传曾有仙人乘黄鹄从此飞过，山因此得名。"
 building_type_TK_20_24_TengWangGe: "标建遗址"
 building_type_TK_20_24_TengWangGe_desc: "一处闻名遐迩的楼阁古迹，过往行旅至此，无不驻足观望。"
 TK_20_24_TengWangGe: "滕王阁"
 building_TK_20_24_TengWangGe: "$TK_20_24_TengWangGe$"
 building_TK_20_24_TengWangGe_desc: "豫章郡治南昌城西临赣水，江面开阔，西岸群山连绵。郡中多樟木，相传豫章之名便由此而来。"
 building_type_TK_20_24_PengLaiGe: "标建遗址"
 building_type_TK_20_24_PengLaiGe_desc: "一处闻名遐迩的楼阁古迹，过往行旅至此，无不驻足观望。"
 TK_20_24_PengLaiGe: "蓬莱阁"
 building_TK_20_24_PengLaiGe: "$TK_20_24_PengLaiGe$"
 building_TK_20_24_PengLaiGe_desc: "东莱海滨的丹崖之上，下临大海，春夏之交常见海市，楼台城郭隐现于波涛之间。相传孝武皇帝东巡至此，遥望海中的蓬莱仙山，久久不忍离去。"
 building_type_TK_20_24_GuanQueLou: "标建遗址"
 building_type_TK_20_24_GuanQueLou_desc: "一处闻名遐迩的楼阁古迹，过往行旅至此，无不驻足观望。"
 TK_20_24_GuanQueLou: "鹳雀楼"
 building_TK_20_24_GuanQueLou: "$TK_20_24_GuanQueLou$"
 building_TK_20_24_GuanQueLou_desc: "河东蒲坂城西临大河，相传舜曾建都于此。河岸高处常有鹳雀栖息，登高西望，可见大河自北奔流而下。"
 building_type_TK_20_30_MingTiaoZhiZhan: "古战场"
 building_type_TK_20_30_MingTiaoZhiZhan_desc: "昔日两军鏖战之地，荒野间至今还能拾到断戟残镞，过客每每凭吊兴叹。"
 TK_20_30_MingTiaoZhiZhan: "鸣条之战"
 building_TK_20_30_MingTiaoZhiZhan: "$TK_20_30_MingTiaoZhiZhan$"
 building_TK_20_30_MingTiaoZhiZhan_desc: "商汤伐夏桀，两军决战于鸣条之野。夏师大败，桀出奔南巢，商自此代夏而有天下。"
 building_type_TK_20_30_MuYeZhiZhan: "古战场"
 building_type_TK_20_30_MuYeZhiZhan_desc: "昔日两军鏖战之地，荒野间至今还能拾到断戟残镞，过客每每凭吊兴叹。"
 TK_20_30_MuYeZhiZhan: "牧野之战"
 building_TK_20_30_MuYeZhiZhan: "$TK_20_30_MuYeZhiZhan$"
 building_TK_20_30_MuYeZhiZhan_desc: "周武王会诸侯伐纣，誓师于牧野。商军阵前倒戈，纣王登鹿台自焚，周室八百年的基业由此而开。"
 building_type_TK_20_30_ChangShaoZhiZhan: "古战场"
 building_type_TK_20_30_ChangShaoZhiZhan_desc: "昔日两军鏖战之地，荒野间至今还能拾到断戟残镞，过客每每凭吊兴叹。"
 TK_20_30_ChangShaoZhiZhan: "长勺之战"
 building_TK_20_30_ChangShaoZhiZhan: "$TK_20_30_ChangShaoZhiZhan$"
 building_TK_20_30_ChangShaoZhiZhan_desc: "齐师伐鲁，鲁庄公迎战于长勺。曹刿待齐人三鼓之后方才进击，所谓一鼓作气，再而衰，三而竭，鲁师遂大破齐军。"
 building_type_TK_20_30_ChangPingZhiZhan: "古战场"
 building_type_TK_20_30_ChangPingZhiZhan_desc: "昔日两军鏖战之地，荒野间至今还能拾到断戟残镞，过客每每凭吊兴叹。"
 TK_20_30_ChangPingZhiZhan: "长平之战"
 building_TK_20_30_ChangPingZhiZhan: "$TK_20_30_ChangPingZhiZhan$"
 building_TK_20_30_ChangPingZhiZhan_desc: "秦赵相争上党，相持于长平。赵王中了反间之计，以赵括代廉颇为将，赵括兵败身死，四十余万降卒尽被白起坑杀，至今山野间仍常掘出枯骨。"
 building_type_TK_20_30_GaiXiaZhiZhan: "古战场"
 building_type_TK_20_30_GaiXiaZhiZhan_desc: "昔日两军鏖战之地，荒野间至今还能拾到断戟残镞，过客每每凭吊兴叹。"
 TK_20_30_GaiXiaZhiZhan: "垓下之战"
 building_TK_20_30_GaiXiaZhiZhan: "$TK_20_30_GaiXiaZhiZhan$"
 building_TK_20_30_GaiXiaZhiZhan_desc: "高祖会诸侯之兵，困项羽于垓下。夜闻四面楚歌，项王在帐中悲歌饮酒，与虞姬诀别，突围南走，终自刎于乌江，汉家天下由此而定。"
 building_type_TK_20_30_KunYangZhiZhan: "古战场"
 building_type_TK_20_30_KunYangZhiZhan_desc: "昔日两军鏖战之地，荒野间至今还能拾到断戟残镞，过客每每凭吊兴叹。"
 TK_20_30_KunYangZhiZhan: "昆阳之战"
 building_TK_20_30_KunYangZhiZhan: "$TK_20_30_KunYangZhiZhan$"
 building_TK_20_30_KunYangZhiZhan_desc: "王莽遣大军围攻昆阳，旌旗辎重绵延千里。光武皇帝率敢死之士冲阵，恰逢雷雨大作，莽军溃散，自相践踏，汉室由此中兴。"
 building_type_TK_20_30_ChiBiZhiZhan: "古战场"
 building_type_TK_20_30_ChiBiZhiZhan_desc: "昔日两军鏖战之地，荒野间至今还能拾到断戟残镞，过客每每凭吊兴叹。"
 TK_20_30_ChiBiZhiZhan: "赤壁之战"
 building_TK_20_30_ChiBiZhiZhan: "$TK_20_30_ChiBiZhiZhan$"
 building_TK_20_30_ChiBiZhiZhan_desc: "大江流经此地，南岸赤崖壁立如削，北岸乌林与之相望。江面开阔，风向无常，舟师若在此相持，胜负往往系于一阵东风。"
 building_type_TK_20_30_YiLingZhiZhan: "古战场"
 building_type_TK_20_30_YiLingZhiZhan_desc: "昔日两军鏖战之地，荒野间至今还能拾到断戟残镞，过客每每凭吊兴叹。"
 TK_20_30_YiLingZhiZhan: "夷陵之战"
 building_TK_20_30_YiLingZhiZhan: "$TK_20_30_YiLingZhiZhan$"
 building_TK_20_30_YiLingZhiZhan_desc: "大江出峡之后，夷陵、猇亭一带山势犹自险峻，林木茂密，蜀中东出荆楚皆由此过。若在此连营山间，一旦遇火，便首尾难顾。"
 building_type_TK_20_30_FeiShuiZhiZhan: "古战场"
 building_type_TK_20_30_FeiShuiZhiZhan_desc: "昔日两军鏖战之地，荒野间至今还能拾到断戟残镞，过客每每凭吊兴叹。"
 TK_20_30_FeiShuiZhiZhan: "淝水之战"
 building_TK_20_30_FeiShuiZhiZhan: "$TK_20_30_FeiShuiZhiZhan$"
 building_TK_20_30_FeiShuiZhiZhan_desc: "淝水流经寿春城下，北入淮水，是江淮之间南北交兵的必经之地。城北八公山相传是淮南王刘安与八位门客炼丹升仙之处。"
 building_type_TK_20_30_CanHePoZhiZhan: "古战场"
 building_type_TK_20_30_CanHePoZhiZhan_desc: "昔日两军鏖战之地，荒野间至今还能拾到断戟残镞，过客每每凭吊兴叹。"
 TK_20_30_CanHePoZhiZhan: "参合陂之战"
 building_TK_20_30_CanHePoZhiZhan: "$TK_20_30_CanHePoZhiZhan$"
 building_TK_20_30_CanHePoZhiZhan_desc: "代郡参合县境，塞上湖陂连绵，水草丰美，是胡骑南下的要道。高祖时韩王信勾结匈奴叛乱，汉将柴武在此大破其军，斩信于参合。"
 building_type_TK_20_30_BaiJiangKouZhiZhan: "古战场"
 building_type_TK_20_30_BaiJiangKouZhiZhan_desc: "昔日两军鏖战之地，荒野间至今还能拾到断戟残镞，过客每每凭吊兴叹。"
 TK_20_30_BaiJiangKouZhiZhan: "白江口之战"
 building_TK_20_30_BaiJiangKouZhiZhan: "$TK_20_30_BaiJiangKouZhiZhan$"
 building_TK_20_30_BaiJiangKouZhiZhan_desc: "马韩之地，大江在此入海，江口宽阔，潮汐涨落极大。泥滩连绵，舟船出入须候潮水，稍有不慎便会搁浅。"
 building_type_TK_20_30_XiangJiSiZhiZhan: "古战场"
 building_type_TK_20_30_XiangJiSiZhiZhan_desc: "昔日两军鏖战之地，荒野间至今还能拾到断戟残镞，过客每每凭吊兴叹。"
 TK_20_30_XiangJiSiZhiZhan: "香积寺之战"
 building_TK_20_30_XiangJiSiZhiZhan: "$TK_20_30_XiangJiSiZhiZhan$"
 building_TK_20_30_XiangJiSiZhiZhan_desc: "长安城南的沣水、潏水之间，原野平坦开阔，南倚终南山，北望长安城阙，是京畿南面的门户。"
 building_type_TK_20_30_GaoLiangHeZhiZhan: "古战场"
 building_type_TK_20_30_GaoLiangHeZhiZhan_desc: "昔日两军鏖战之地，荒野间至今还能拾到断戟残镞，过客每每凭吊兴叹。"
 TK_20_30_GaoLiangHeZhiZhan: "高粱河之战"
 building_TK_20_30_GaoLiangHeZhiZhan: "$TK_20_30_GaoLiangHeZhiZhan$"
 building_TK_20_30_GaoLiangHeZhiZhan_desc: "蓟城西郊有一条小河，流经平野与沼泽之间，河边芦苇丛生，地势低洼泥泞，大队人马在此难以施展。"
 building_type_TK_20_31_DuJiangYan: "水利工程"
 building_type_TK_20_31_DuJiangYan_desc: "前人开渠筑堰、导水灌田之功，沿岸田亩赖之免于旱涝，百姓世代感念。"
 TK_20_31_DuJiangYan: "都江堰"
 building_TK_20_31_DuJiangYan: "$TK_20_31_DuJiangYan$"
 building_TK_20_31_DuJiangYan_desc: "蜀郡太守李冰凿离堆，分岷江之水，筑堰导流，灌溉蜀中千里沃野。从此蜀地水旱从人，不知饥馑，天下谓之天府。"
 building_type_TK_20_31_LingQu: "水利工程"
 building_type_TK_20_31_LingQu_desc: "前人开渠筑堰、导水灌田之功，沿岸田亩赖之免于旱涝，百姓世代感念。"
 TK_20_31_LingQu: "灵渠"
 building_TK_20_31_LingQu: "$TK_20_31_LingQu$"
 building_TK_20_31_LingQu_desc: "始皇帝南征百越，命监禄凿渠，沟通湘水与漓水，使楼船粮秣得以由大江直入岭南。渠道虽窄，却连通了南北两方的水路。"
 building_type_TK_20_31_KanErJing: "水利工程"
 building_type_TK_20_31_KanErJing_desc: "前人开渠筑堰、导水灌田之功，沿岸田亩赖之免于旱涝，百姓世代感念。"
 TK_20_31_KanErJing: "坎儿井"
 building_TK_20_31_KanErJing: "$TK_20_31_KanErJing$"
 building_TK_20_31_KanErJing_desc: "西域干旱少雨，土人与屯田的汉军在地下开凿暗渠，每隔一段便凿一竖井相连，引雪山之水自地下流出灌溉田亩，称为井渠。"
 building_type_TK_20_32_MoGaoKu: "窟碑古刻"
 building_type_TK_20_32_MoGaoKu_desc: "依山凿石之所，斧凿痕迹之间，可见前人的虔诚与技艺。"
 TK_20_32_MoGaoKu: "莫高窟"
 building_TK_20_32_MoGaoKu: "$TK_20_32_MoGaoKu$"
 building_TK_20_32_MoGaoKu_desc: "敦煌城东南有鸣沙山，沙岭起伏，人马行过便发出轰鸣之声。山下崖壁临着一条小河，对面的三危山相传是舜流放三苗之处。"
 building_type_TK_20_32_YunGangShiKu: "窟碑古刻"
 building_type_TK_20_32_YunGangShiKu_desc: "依山凿石之所，斧凿痕迹之间，可见前人的虔诚与技艺。"
 TK_20_32_YunGangShiKu: "云冈石窟"
 building_TK_20_32_YunGangShiKu: "$TK_20_32_YunGangShiKu$"
 building_TK_20_32_YunGangShiKu_desc: "雁门郡平城以西有武州山，山下设武州塞，是汉家扼守塞外的要隘。孝武皇帝时设马邑之谋，匈奴单于率十万骑便是由此入塞。"
 building_type_TK_20_32_LongMenShiKu: "窟碑古刻"
 building_type_TK_20_32_LongMenShiKu_desc: "依山凿石之所，斧凿痕迹之间，可见前人的虔诚与技艺。"
 TK_20_32_LongMenShiKu: "龙门石窟"
 building_TK_20_32_LongMenShiKu: "$TK_20_32_LongMenShiKu$"
 building_TK_20_32_LongMenShiKu_desc: "洛阳之南，伊水从两山之间穿流而过，两山对峙如阙门，故称伊阙。相传是大禹治水时凿开此山，以导伊水北流。"
 building_type_TK_20_32_DaZuShiKe: "窟碑古刻"
 building_type_TK_20_32_DaZuShiKe_desc: "依山凿石之所，斧凿痕迹之间，可见前人的虔诚与技艺。"
 TK_20_32_DaZuShiKe: "大足石刻"
 building_TK_20_32_DaZuShiKe: "$TK_20_32_DaZuShiKe$"
 building_TK_20_32_DaZuShiKe_desc: "巴郡西部的丘陵之间，山不甚高而岩石裸露，溪流纵横，乡民依山垦田，民风质朴。"
 building_type_TK_20_32_LeShanDaFu: "窟碑古刻"
 building_type_TK_20_32_LeShanDaFu_desc: "依山凿石之所，斧凿痕迹之间，可见前人的虔诚与技艺。"
 TK_20_32_LeShanDaFu: "乐山大佛"
 building_TK_20_32_LeShanDaFu: "$TK_20_32_LeShanDaFu$"
 building_TK_20_32_LeShanDaFu_desc: "犍为南安城外，沫水、青衣水与岷江在此汇流，水势汹涌，常有舟船覆没。临江的山崖壁立如削，舟人过此无不屏息。"
 building_type_TK_20_32_MaiJiShanShiKu: "窟碑古刻"
 building_type_TK_20_32_MaiJiShanShiKu_desc: "依山凿石之所，斧凿痕迹之间，可见前人的虔诚与技艺。"
 TK_20_32_MaiJiShanShiKu: "麦积山石窟"
 building_TK_20_32_MaiJiShanShiKu: "$TK_20_32_MaiJiShanShiKu$"
 building_TK_20_32_MaiJiShanShiKu_desc: "汉阳郡南的群山之中，一座孤峰拔地而起，形如农家堆积的麦垛，乡人便称之为麦积山。山上松柏苍翠，云雾时起时散。"
 building_type_TK_20_36_YanMenGuan: "关卡险隘"
 building_type_TK_20_36_YanMenGuan_desc: "据山川之险设关立隘，一夫当关，万夫莫开，往来行旅须验过符传方能通行。"
 TK_20_36_YanMenGuan: "雁门关"
 building_TK_20_36_YanMenGuan: "$TK_20_36_YanMenGuan$"
 building_TK_20_36_YanMenGuan_desc: "雁门郡南有句注山，两山对峙，其形如门，相传鸿雁南飞北归都从此穿过。山上设句注塞，扼守胡骑南下太原的要道，名列天下九塞。"
 building_type_TK_20_36_YuMenGuan: "关卡险隘"
 building_type_TK_20_36_YuMenGuan_desc: "据山川之险设关立隘，一夫当关，万夫莫开，往来行旅须验过符传方能通行。"
 TK_20_36_YuMenGuan: "玉门关"
 building_TK_20_36_YuMenGuan: "$TK_20_36_YuMenGuan$"
 building_TK_20_36_YuMenGuan_desc: "敦煌郡西北的关隘，孝武皇帝时设立。西域诸国的使节与商旅都经此关入塞，相传于阗美玉亦由此输入，故名玉门；出关之后，便是流沙千里。"
 building_type_TK_20_36_YangGuan: "关卡险隘"
 building_type_TK_20_36_YangGuan_desc: "据山川之险设关立隘，一夫当关，万夫莫开，往来行旅须验过符传方能通行。"
 TK_20_36_YangGuan: "阳关"
 building_TK_20_36_YangGuan: "$TK_20_36_YangGuan$"
 building_TK_20_36_YangGuan_desc: "阳关在玉门关之南，故称阳关，是西出西域南道的门户。关外沙碛茫茫，水草稀少，送行之人往往在此止步。"
 building_type_TK_20_36_JianMenGuan: "关卡险隘"
 building_type_TK_20_36_JianMenGuan_desc: "据山川之险设关立隘，一夫当关，万夫莫开，往来行旅须验过符传方能通行。"
 TK_20_36_JianMenGuan: "剑门关"
 building_TK_20_36_JianMenGuan: "$TK_20_36_JianMenGuan$"
 building_TK_20_36_JianMenGuan_desc: "大剑、小剑二山之间，两崖相对如剑，中间仅容一线通行，正如一道石门。秦人开石牛道入蜀，便由此穿过，一人守之，万人难越。"
 building_type_TK_20_36_WuGuan: "关卡险隘"
 building_type_TK_20_36_WuGuan_desc: "据山川之险设关立隘，一夫当关，万夫莫开，往来行旅须验过符传方能通行。"
 TK_20_36_WuGuan: "武关"
 building_TK_20_36_WuGuan: "$TK_20_36_WuGuan$"
 building_TK_20_36_WuGuan_desc: "武关地处秦岭东南的山谷之中，春秋时称少习，是关中通往南阳、荆楚的咽喉。秦昭王曾在此诱执楚怀王，高祖入关也是由此破关而进。"
 building_type_TK_20_36_HuLaoGuan: "关卡险隘"
 building_type_TK_20_36_HuLaoGuan_desc: "据山川之险设关立隘，一夫当关，万夫莫开，往来行旅须验过符传方能通行。"
 TK_20_36_HuLaoGuan: "虎牢关"
 building_TK_20_36_HuLaoGuan: "$TK_20_36_HuLaoGuan$"
 building_TK_20_36_HuLaoGuan_desc: "成皋之险，南连嵩高，北临大河，山岭交错，是洛阳东面的门户。相传周穆王曾在此圈养猛虎，故称虎牢；楚汉之际，高祖与项羽在此相持经年。"
 building_type_TK_20_36_DaSanGuan: "关卡险隘"
 building_type_TK_20_36_DaSanGuan_desc: "据山川之险设关立隘，一夫当关，万夫莫开，往来行旅须验过符传方能通行。"
 TK_20_36_DaSanGuan: "大散关"
 building_TK_20_36_DaSanGuan: "$TK_20_36_DaSanGuan$"
 building_TK_20_36_DaSanGuan_desc: "散关在陈仓之南的大散岭上，扼守关中进入汉中、巴蜀的道路。当年高祖从汉中出兵还定三秦，便是取道于此，一路北上。"
 building_type_TK_20_36_TongGuan: "关卡险隘"
 building_type_TK_20_36_TongGuan_desc: "据山川之险设关立隘，一夫当关，万夫莫开，往来行旅须验过符传方能通行。"
 TK_20_36_TongGuan: "潼关"
 building_TK_20_36_TongGuan: "$TK_20_36_TongGuan$"
 building_TK_20_36_TongGuan_desc: "大河自北南流至此，折而东去，河水激荡关山，故称潼。此地北临大河，南倚秦岭，扼守长安与洛阳之间的通道，形势险要。"
 building_type_TK_20_36_ShanHaiGuan: "关卡险隘"
 building_type_TK_20_36_ShanHaiGuan_desc: "据山川之险设关立隘，一夫当关，万夫莫开，往来行旅须验过符传方能通行。"
 TK_20_36_ShanHaiGuan: "山海关"
 building_TK_20_36_ShanHaiGuan: "$TK_20_36_ShanHaiGuan$"
 building_TK_20_36_ShanHaiGuan_desc: "辽西郡临渝县，燕山余脉在此直抵海滨，山海之间只留一线通道，是幽州通往辽东的必经之路。相传始皇帝与孝武皇帝东巡时，都曾登上海边的碣石观海。"
 building_type_TK_20_36_XiaoGuan: "关卡险隘"
 building_type_TK_20_36_XiaoGuan_desc: "据山川之险设关立隘，一夫当关，万夫莫开，往来行旅须验过符传方能通行。"
 TK_20_36_XiaoGuan: "萧关"
 building_TK_20_36_XiaoGuan: "$TK_20_36_XiaoGuan$"
 building_TK_20_36_XiaoGuan_desc: "萧关在安定郡境内，背倚陇山，扼守泾水河谷，是陇西、北地通往关中的门户。孝文皇帝时，匈奴十四万骑攻破萧关，游骑直抵甘泉。"
 building_type_TK_20_37_QuanZhouGang: "港口渡峡"
 building_type_TK_20_37_QuanZhouGang_desc: "舟楫辐辏的津渡港湾，商旅由此往来，百货在此集散。"
 TK_20_37_QuanZhouGang: "泉州港"
 building_TK_20_37_QuanZhouGang: "$TK_20_37_QuanZhouGang$"
 building_TK_20_37_QuanZhouGang_desc: "闽中一条大江入海之处，港湾曲折，可避风涛。闽越旧民善于操舟，沿海渔船往来于海湾之间。"
 building_type_TK_20_37_BoDuoGang: "港口渡峡"
 building_type_TK_20_37_BoDuoGang_desc: "舟楫辐辏的津渡港湾，商旅由此往来，百货在此集散。"
 TK_20_37_BoDuoGang: "博多港"
 building_TK_20_37_BoDuoGang: "$TK_20_37_BoDuoGang$"
 building_TK_20_37_BoDuoGang_desc: "倭地奴国所在的海湾，背山面海，风浪平静，是倭人渡海前往三韩、乐浪的出发之地。光武皇帝时，奴国曾遣使奉贡，受赐金印。"
 building_type_TK_20_37_BiLanDu: "港口渡峡"
 building_type_TK_20_37_BiLanDu_desc: "舟楫辐辏的津渡港湾，商旅由此往来，百货在此集散。"
 TK_20_37_BiLanDu: "碧澜渡"
 building_TK_20_37_BiLanDu: "$TK_20_37_BiLanDu$"
 building_TK_20_37_BiLanDu_desc: "乐浪郡南境，一条大江在此汇入西海，江口宽阔，潮水涨落时可容大船出入。往来于乐浪与三韩之间的商船，多在此停泊。"
 building_type_TK_20_40_DongYueTaiShan: "五岳"
 building_type_TK_20_40_DongYueTaiShan_desc: "五岳镇守天下四方与中央，天子巡狩，必致祭于此，群山莫能及之。"
 TK_20_40_DongYueTaiShan: "东岳泰山"
 building_TK_20_40_DongYueTaiShan: "$TK_20_40_DongYueTaiShan$"
 building_TK_20_40_DongYueTaiShan_desc: "泰山为五岳之长，古来受命的帝王必登泰山封禅，告成功于天，始皇帝、孝武皇帝与光武皇帝都曾在此行封禅之礼。世人又相传，人死之后魂归泰山。"
 building_type_TK_20_40_NanYueHengShan: "五岳"
 building_type_TK_20_40_NanYueHengShan_desc: "五岳镇守天下四方与中央，天子巡狩，必致祭于此，群山莫能及之。"
 TK_20_40_NanYueHengShan: "南岳衡山"
 building_TK_20_40_NanYueHengShan: "$TK_20_40_NanYueHengShan$"
 building_TK_20_40_NanYueHengShan_desc: "衡山七十二峰连绵起伏，相传其位上应星宿，如秤衡可称量天地，故名衡山。舜帝南巡，曾至南岳致祭。"
 building_type_TK_20_40_XiYueHuaShan: "五岳"
 building_type_TK_20_40_XiYueHuaShan_desc: "五岳镇守天下四方与中央，天子巡狩，必致祭于此，群山莫能及之。"
 TK_20_40_XiYueHuaShan: "西岳华山"
 building_TK_20_40_XiYueHuaShan: "$TK_20_40_XiYueHuaShan$"
 building_TK_20_40_XiYueHuaShan_desc: "华山在弘农华阴县南，五峰耸立，四面如削，险峻冠于诸山。山下有西岳庙，朝廷岁时遣使致祭，庙中碑碣林立。"
 building_type_TK_20_40_BeiYueHengShan: "五岳"
 building_type_TK_20_40_BeiYueHengShan_desc: "五岳镇守天下四方与中央，天子巡狩，必致祭于此，群山莫能及之。"
 TK_20_40_BeiYueHengShan: "北岳恒山"
 building_TK_20_40_BeiYueHengShan: "$TK_20_40_BeiYueHengShan$"
 building_TK_20_40_BeiYueHengShan_desc: "北岳本名恒山，为避孝文皇帝名讳改称常山。群峰叠嶂，横亘于代地与冀州之间，是北方诸山之宗，天子岁时遣使致祭。"
 building_type_TK_20_40_ZhongYueSongShan: "五岳"
 building_type_TK_20_40_ZhongYueSongShan_desc: "五岳镇守天下四方与中央，天子巡狩，必致祭于此，群山莫能及之。"
 TK_20_40_ZhongYueSongShan: "中岳嵩山"
 building_TK_20_40_ZhongYueSongShan: "$TK_20_40_ZhongYueSongShan$"
 building_TK_20_40_ZhongYueSongShan_desc: "嵩高居天下之中，太室、少室两山东西对峙。孝武皇帝登临太室，相传从官在山下听见了三呼万岁之声，于是以山下三百户奉祀，号为崇高邑。"
 building_type_TK_20_41_HuangShan: "名山"
 building_type_TK_20_41_HuangShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_HuangShan: "黄山"
 building_TK_20_41_HuangShan: "$TK_20_41_HuangShan$"
 building_TK_20_41_HuangShan_desc: "丹阳郡黟县境内有黟山，峰岩青黑，远望苍黛，故以黟为名。山中奇松怪石，云海翻涌，相传黄帝曾在此炼丹。"
 building_type_TK_20_41_LuShan: "名山"
 building_type_TK_20_41_LuShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_LuShan: "庐山"
 building_TK_20_41_LuShan: "$TK_20_41_LuShan$"
 building_TK_20_41_LuShan_desc: "庐山在彭蠡泽之西，相传周时有匡俗兄弟结庐于此修道，故又名匡庐。太史公曾南登庐山，观大禹所疏的九江。"
 building_type_TK_20_41_ShenNongShan: "名山"
 building_type_TK_20_41_ShenNongShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_ShenNongShan: "神农山"
 building_TK_20_41_ShenNongShan: "$TK_20_41_ShenNongShan$"
 building_TK_20_41_ShenNongShan_desc: "河内郡北的太行山中，相传炎帝神农氏曾在此辨五谷、尝百草，筑坛祭天。山势险峻，峰如龙脊，蜿蜒于云雾之间。"
 building_type_TK_20_41_LaoJunShan: "名山"
 building_type_TK_20_41_LaoJunShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_LaoJunShan: "老君山"
 building_TK_20_41_LaoJunShan: "$TK_20_41_LaoJunShan$"
 building_TK_20_41_LaoJunShan_desc: "景室山为伏牛群山的主峰，相传老子西出函谷之前，曾在此山隐居修炼。山上云雾缭绕，修道之人多慕名而来。"
 building_type_TK_20_41_WuDangShan: "名山"
 building_type_TK_20_41_WuDangShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_WuDangShan: "武当山"
 building_TK_20_41_WuDangShan: "$TK_20_41_WuDangShan$"
 building_TK_20_41_WuDangShan_desc: "武当山在南阳郡武当县境，群峰环拱主峰，岩壑幽深，古称太和山。相传周时尹喜曾在此隐居，山中常有方士结庐修炼。"
 building_type_TK_20_41_LongHuShan: "名山"
 building_type_TK_20_41_LongHuShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_LongHuShan: "龙虎山"
 building_TK_20_41_LongHuShan: "$TK_20_41_LongHuShan$"
 building_TK_20_41_LongHuShan_desc: "豫章东部的群山之中，丹崖碧水，两峰相对，如龙盘虎踞，故名龙虎。相传张道陵曾在此炼丹，丹成而龙虎现。"
 building_type_TK_20_41_QingChengShan: "名山"
 building_type_TK_20_41_QingChengShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_QingChengShan: "青城山"
 building_TK_20_41_QingChengShan: "$TK_20_41_QingChengShan$"
 building_TK_20_41_QingChengShan_desc: "青城山诸峰环峙，状如城郭，林木四季青翠，相传黄帝曾在此拜宁封子为五岳丈人。顺帝时张道陵入蜀，在鹤鸣、青城一带传道，信众遍布巴蜀汉中。"
 building_type_TK_20_41_QiYunShan: "名山"
 building_type_TK_20_41_QiYunShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_QiYunShan: "齐云山"
 building_TK_20_41_QiYunShan: "$TK_20_41_QiYunShan$"
 building_TK_20_41_QiYunShan_desc: "丹阳郡南境有一座白岳，峰顶与云齐平，崖壁色赤如丹，山间清泉飞瀑，人迹罕至。"
 building_type_TK_20_41_JingFuShan: "名山"
 building_type_TK_20_41_JingFuShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_JingFuShan: "景福山"
 building_TK_20_41_JingFuShan: "$TK_20_41_JingFuShan$"
 building_TK_20_41_JingFuShan_desc: "扶风汧县西境的龙门山，峰峦叠翠，岩洞深幽，相传古时有仙人栖于岩中，故又称灵仙岩。"
 building_type_TK_20_41_MaoShan: "名山"
 building_type_TK_20_41_MaoShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_MaoShan: "茅山"
 building_TK_20_41_MaoShan: "$TK_20_41_MaoShan$"
 building_TK_20_41_MaoShan_desc: "句曲山山势曲折，形如“己”字，故名句曲。相传孝景皇帝时有茅盈、茅固、茅衷三兄弟在此修道行善，乡人感念其德，改称三茅山。"
 building_type_TK_20_41_WuTaiShan: "名山"
 building_type_TK_20_41_WuTaiShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_WuTaiShan: "五台山"
 building_TK_20_41_WuTaiShan: "$TK_20_41_WuTaiShan$"
 building_TK_20_41_WuTaiShan_desc: "五座山峰环列，峰顶平坦如台，盛夏犹有积雪，古时方士称之为紫府山，在此修炼。相传孝明皇帝时，西来的沙门也曾在此建寺讲经。"
 building_type_TK_20_41_EMeiShan: "名山"
 building_type_TK_20_41_EMeiShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_EMeiShan: "峨眉山"
 building_TK_20_41_EMeiShan: "$TK_20_41_EMeiShan$"
 building_TK_20_41_EMeiShan_desc: "峨眉山在犍为郡南安县境，两峰相对如蛾眉，故名。山高入云，林木幽深，相传周时仙人葛由骑木羊入蜀，追随他的人都在此山一带得道成仙。"
 building_type_TK_20_41_PuTuoShan: "名山"
 building_type_TK_20_41_PuTuoShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_PuTuoShan: "普陀山"
 building_TK_20_41_PuTuoShan: "$TK_20_41_PuTuoShan$"
 building_TK_20_41_PuTuoShan_desc: "会稽东海之中有一座小岛，岛上山石嶙峋，林木葱郁。相传王莽擅政之时，南昌尉梅福弃家出走，隐居于此炼丹，岛上的山便称为梅岑。"
 building_type_TK_20_41_JiuHuaShan: "名山"
 building_type_TK_20_41_JiuHuaShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_JiuHuaShan: "九华山"
 building_TK_20_41_JiuHuaShan: "$TK_20_41_JiuHuaShan$"
 building_TK_20_41_JiuHuaShan_desc: "江南群山之中，九座峰峦并峙，峰顶常在云雾之中隐现，林深泉幽，罕有人迹。"
 building_type_TK_20_41_FanJingShan: "名山"
 building_type_TK_20_41_FanJingShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_FanJingShan: "梵净山"
 building_TK_20_41_FanJingShan: "$TK_20_41_FanJingShan$"
 building_TK_20_41_FanJingShan_desc: "武陵郡西部的深山之中，群峰拔地而起，常年云雾缭绕。武陵蛮人奉之为神山，每逢祭祀便聚于山下。"
 building_type_TK_20_41_KongDongShan: "名山"
 building_type_TK_20_41_KongDongShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_KongDongShan: "崆峒山"
 building_TK_20_41_KongDongShan: "$TK_20_41_KongDongShan$"
 building_TK_20_41_KongDongShan_desc: "崆峒山在安定郡境，相传黄帝曾亲至此山，向仙人广成子问治身之道。孝武皇帝西巡时，也曾越陇山、登崆峒。"
 building_type_TK_20_41_XuanWuShan: "名山"
 building_type_TK_20_41_XuanWuShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_XuanWuShan: "玄武山"
 building_TK_20_41_XuanWuShan: "$TK_20_41_XuanWuShan$"
 building_TK_20_41_XuanWuShan_desc: "南海郡东境的海滨有一座小山冈，冈上林木葱郁，南面便是茫茫大海。渔人出海归来，远远望见此冈，便知到了家乡。"
 building_type_TK_20_41_YanDangShan: "名山"
 building_type_TK_20_41_YanDangShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_YanDangShan: "雁荡山"
 building_TK_20_41_YanDangShan: "$TK_20_41_YanDangShan$"
 building_TK_20_41_YanDangShan_desc: "会稽南部的海滨群山，奇峰怪石林立。相传山顶有一湖，芦苇丛生，秋来鸿雁多栖宿于此，因名雁荡。"
 building_type_TK_20_41_SanQingShan: "名山"
 building_type_TK_20_41_SanQingShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_SanQingShan: "三清山"
 building_TK_20_41_SanQingShan: "$TK_20_41_SanQingShan$"
 building_TK_20_41_SanQingShan_desc: "鄱阳东境有一座山，三峰并立，宛如三位尊神列坐于山巅。山中奇峰怪石，云雾终年不散。"
 building_type_TK_20_41_LaoShan: "名山"
 building_type_TK_20_41_LaoShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_LaoShan: "崂山"
 building_TK_20_41_LaoShan: "$TK_20_41_LaoShan$"
 building_TK_20_41_LaoShan_desc: "东莱郡不其县东南，崂山临海拔起，号称海上名山。战国以来便有方士在此修炼，孝武皇帝东巡时，曾在山下的不其县立祠祀神。"
 building_type_TK_20_41_ZhongNanShan: "名山"
 building_type_TK_20_41_ZhongNanShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_ZhongNanShan: "终南山"
 building_TK_20_41_ZhongNanShan: "$TK_20_41_ZhongNanShan$"
 building_TK_20_41_ZhongNanShan_desc: "终南山横亘于长安之南，又称南山，绵延数百里，峰峦重叠。山中多隐士方士，相传老子曾在山北的楼观为尹喜讲授道德五千言。"
 building_type_TK_20_41_MangDangShan: "名山"
 building_type_TK_20_41_MangDangShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_MangDangShan: "芒砀山"
 building_TK_20_41_MangDangShan: "$TK_20_41_MangDangShan$"
 building_TK_20_41_MangDangShan_desc: "芒砀山在梁国境内，山泽深险。高祖未起事时，曾亡匿于芒砀山泽之间，所居之处常有云气笼罩；后来梁孝王以下历代梁王多凿山为陵，长眠于此。"
 building_type_TK_20_41_KunLunShan: "名山"
 building_type_TK_20_41_KunLunShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_KunLunShan: "昆仑山"
 building_TK_20_41_KunLunShan: "$TK_20_41_KunLunShan$"
 building_TK_20_41_KunLunShan_desc: "昆仑在西方极远之处，相传是天帝的下都，西王母所居，河水便发源于此。孝武皇帝按古图书，将于阗南面河水所出的大山命名为昆仑。"
 building_type_TK_20_41_QiLianDaXueShan: "名山"
 building_type_TK_20_41_QiLianDaXueShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_QiLianDaXueShan: "祁连大雪山"
 building_TK_20_41_QiLianDaXueShan: "$TK_20_41_QiLianDaXueShan$"
 building_TK_20_41_QiLianDaXueShan_desc: "祁连山横亘于河西诸郡之南，山顶终年积雪，雪水消融，滋养着山下的牧场。匈奴失此山后曾悲歌：“亡我祁连山，使我六畜不蕃息。”"
 building_type_TK_20_41_ZhuMuLangMaFeng: "名山"
 building_type_TK_20_41_ZhuMuLangMaFeng_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_ZhuMuLangMaFeng: "珠穆朗玛峰"
 building_TK_20_41_ZhuMuLangMaFeng: "$TK_20_41_ZhuMuLangMaFeng$"
 building_TK_20_41_ZhuMuLangMaFeng_desc: "西南极远之处，雪山层层叠叠，其中一峰最为高峻，终年冰雪覆盖，直插云霄。当地土人奉之为神女所居，不敢轻易靠近。"
 building_type_TK_20_41_BaiTouShan: "名山"
 building_type_TK_20_41_BaiTouShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_BaiTouShan: "白头山"
 building_TK_20_41_BaiTouShan: "$TK_20_41_BaiTouShan$"
 building_TK_20_41_BaiTouShan_desc: "东北极远之处有不咸山，山顶终年积雪，远望一片皓白。《山海经》说肃慎之国就在此山附近，土人奉之为神山。"
 building_type_TK_20_41_WuLiangShan: "名山"
 building_type_TK_20_41_WuLiangShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_WuLiangShan: "无量山"
 building_TK_20_41_WuLiangShan: "$TK_20_41_WuLiangShan$"
 building_TK_20_41_WuLiangShan_desc: "益州西南的群山之中，蒙乐山峰峦连绵，不知其数，故有无量之称。山中林木参天，瘴气弥漫，珍禽异兽出没其间。"
 building_type_TK_20_41_DianCangShan: "名山"
 building_type_TK_20_41_DianCangShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_DianCangShan: "点苍山"
 building_TK_20_41_DianCangShan: "$TK_20_41_DianCangShan$"
 building_TK_20_41_DianCangShan_desc: "点苍山诸峰南北绵延，峰顶积雪经年不化，山色苍翠，故得此名。山间溪涧东流，尽数注入叶榆泽。"
 building_type_TK_20_41_YaoShan: "名山"
 building_type_TK_20_41_YaoShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_YaoShan: "尧山"
 building_TK_20_41_YaoShan: "$TK_20_41_YaoShan$"
 building_TK_20_41_YaoShan_desc: "鲁阳县西的尧山，相传尧帝的后裔刘累曾在此立祠祭祀先祖，故名尧山。刘氏子孙视此为祖地，山中峰石奇秀，林泉清幽。"
 building_type_TK_20_41_LangJiXuShan: "名山"
 building_type_TK_20_41_LangJiXuShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_LangJiXuShan: "狼居胥山"
 building_TK_20_41_LangJiXuShan: "$TK_20_41_LangJiXuShan$"
 building_TK_20_41_LangJiXuShan_desc: "漠北的狼居胥山。孝武皇帝时，骠骑将军霍去病远征匈奴，大破左贤王，封狼居胥山，禅于姑衍，登临瀚海而还，自此封狼居胥成了天下将士梦寐以求的功业。"
 building_type_TK_20_41_ZiJinShan: "名山"
 building_type_TK_20_41_ZiJinShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_ZiJinShan: "紫金山"
 building_TK_20_41_ZiJinShan: "$TK_20_41_ZiJinShan$"
 building_TK_20_41_ZiJinShan_desc: "秣陵城东的钟山，山势盘曲如龙，岩石在日光下隐隐泛出紫色，是江东的名山。"
 building_type_TK_20_41_JinGangShan: "名山"
 building_type_TK_20_41_JinGangShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_JinGangShan: "金刚山"
 building_TK_20_41_JinGangShan: "$TK_20_41_JinGangShan$"
 building_TK_20_41_JinGangShan_desc: "濊人之地的海滨群山，峰峦万千，岩石如削，四季景致各异，秋来满山红叶如火。"
 building_type_TK_20_41_FuShiShan: "名山"
 building_type_TK_20_41_FuShiShan_desc: "名山高耸入云，自古便是方士隐者栖身之所，山中流传着许多神仙故事。"
 TK_20_41_FuShiShan: "富士山"
 building_TK_20_41_FuShiShan: "$TK_20_41_FuShiShan$"
 building_TK_20_41_FuShiShan_desc: "倭地东方有一座高山，形如倒扣的斗笠，山顶终年积雪，时而吐出烟火。倭人视之为神山，远远望见便要礼拜。"
 building_type_TK_20_50_ChangBaiShanTianChi: "湖泊水泽"
 building_type_TK_20_50_ChangBaiShanTianChi_desc: "大泽浩渺，鱼虾菱藕取之不尽，水滨的百姓以渔猎舟楫为生。"
 TK_20_50_ChangBaiShanTianChi: "长白山天池"
 building_TK_20_50_ChangBaiShanTianChi: "$TK_20_50_ChangBaiShanTianChi$"
 building_TK_20_50_ChangBaiShanTianChi_desc: "不咸山顶有一池深水，四面群峰环抱，水色深碧，寒气逼人，几条大水都从山中流出。土人视之为神池，不敢轻易靠近。"
 building_type_TK_20_50_XiHu: "湖泊水泽"
 building_type_TK_20_50_XiHu_desc: "大泽浩渺，鱼虾菱藕取之不尽，水滨的百姓以渔猎舟楫为生。"
 TK_20_50_XiHu: "西湖"
 building_TK_20_50_XiHu: "$TK_20_50_XiHu$"
 building_TK_20_50_XiHu_desc: "钱唐县西有一片湖水，三面环山，东邻城郭，相传曾有金牛出没其中，故又称明圣湖。湖光山色，四时皆宜。"
 building_type_TK_20_50_QingHaiHu: "湖泊水泽"
 building_type_TK_20_50_QingHaiHu_desc: "大泽浩渺，鱼虾菱藕取之不尽，水滨的百姓以渔猎舟楫为生。"
 TK_20_50_QingHaiHu: "青海湖"
 building_TK_20_50_QingHaiHu: "$TK_20_50_QingHaiHu$"
 building_TK_20_50_QingHaiHu_desc: "湟中以西有一片大湖，湖水苦咸，碧波浩渺，羌人称之为卑禾羌海。王莽时诱使羌人献地，在湖边设西海郡，不久便告荒废。"
 building_type_TK_20_50_YunMengZe: "湖泊水泽"
 building_type_TK_20_50_YunMengZe_desc: "大泽浩渺，鱼虾菱藕取之不尽，水滨的百姓以渔猎舟楫为生。"
 TK_20_50_YunMengZe: "云梦泽"
 building_TK_20_50_YunMengZe: "$TK_20_50_YunMengZe$"
 building_TK_20_50_YunMengZe_desc: "楚国旧时的大泽，湖沼相连，芦荻丛生。司马相如在《子虚赋》中说云梦方九百里，楚王常在泽中游猎。"
 building_type_TK_20_50_DongTingHu: "湖泊水泽"
 building_type_TK_20_50_DongTingHu_desc: "大泽浩渺，鱼虾菱藕取之不尽，水滨的百姓以渔猎舟楫为生。"
 TK_20_50_DongTingHu: "洞庭湖"
 building_TK_20_50_DongTingHu: "$TK_20_50_DongTingHu$"
 building_TK_20_50_DongTingHu_desc: "洞庭湖在长沙郡北，湘、资、沅、澧诸水汇注其中，烟波浩渺。湖中君山相传是湘君所居，舜帝南巡崩于苍梧，二妃追寻至此，泪洒竹上，化为斑竹。"
 building_type_TK_20_50_TaiHu: "湖泊水泽"
 building_type_TK_20_50_TaiHu_desc: "大泽浩渺，鱼虾菱藕取之不尽，水滨的百姓以渔猎舟楫为生。"
 TK_20_50_TaiHu: "太湖"
 building_TK_20_50_TaiHu: "$TK_20_50_TaiHu$"
 building_TK_20_50_TaiHu_desc: "太湖古称震泽、具区，跨吴郡与丹阳之间，湖中岛屿星罗棋布。吴王夫差曾在湖中夫椒大败越军，越王勾践灭吴之后，范蠡便泛舟五湖而去。"
 building_type_TK_20_50_ChaoHu: "湖泊水泽"
 building_type_TK_20_50_ChaoHu_desc: "大泽浩渺，鱼虾菱藕取之不尽，水滨的百姓以渔猎舟楫为生。"
 TK_20_50_ChaoHu: "巢湖"
 building_TK_20_50_ChaoHu: "$TK_20_50_ChaoHu$"
 building_TK_20_50_ChaoHu_desc: "巢湖在居巢县南，湖面广阔，有八百里湖天之称。相传古时居巢城一夜陷为大湖，焦姥舍身唤醒乡民，乡人感念，称之为焦湖，湖中的小山便叫姥山。"
 building_type_TK_20_50_PoYangHu: "湖泊水泽"
 building_type_TK_20_50_PoYangHu_desc: "大泽浩渺，鱼虾菱藕取之不尽，水滨的百姓以渔猎舟楫为生。"
 TK_20_50_PoYangHu: "鄱阳湖"
 building_TK_20_50_PoYangHu: "$TK_20_50_PoYangHu$"
 building_TK_20_50_PoYangHu_desc: "彭蠡泽在豫章郡北、大江之南，湖面浩渺。《禹贡》说“彭蠡既潴”，大禹治水之后，众水便在此汇聚。湖中有鄱阳山孤峙水上，舟人往来，常以此山为识。"
 building_type_TK_20_50_RiYueTan: "湖泊水泽"
 building_type_TK_20_50_RiYueTan_desc: "大泽浩渺，鱼虾菱藕取之不尽，水滨的百姓以渔猎舟楫为生。"
 TK_20_50_RiYueTan: "日月潭"
 building_TK_20_50_RiYueTan: "$TK_20_50_RiYueTan$"
 building_TK_20_50_RiYueTan_desc: "东海之外的夷洲岛上，群山环抱一片深潭，潭中有一小岛，北半湖形如圆日，南半湖状似弯月。岛上土人以渔猎为生，乘独木舟出没于水上。"
 building_type_TK_20_50_YueYaQuan: "湖泊水泽"
 building_type_TK_20_50_YueYaQuan_desc: "大泽浩渺，鱼虾菱藕取之不尽，水滨的百姓以渔猎舟楫为生。"
 TK_20_50_YueYaQuan: "月牙泉"
 building_TK_20_50_YueYaQuan: "$TK_20_50_YueYaQuan$"
 building_TK_20_50_YueYaQuan_desc: "敦煌城南鸣沙山下有一泓泉水，形似新月，四面皆是流沙，泉水却始终不被沙掩，人称沙井。泉边水草丰美，往来商旅常在此饮马。"
 building_type_TK_20_50_LuGuHu: "湖泊水泽"
 building_type_TK_20_50_LuGuHu_desc: "大泽浩渺，鱼虾菱藕取之不尽，水滨的百姓以渔猎舟楫为生。"
 TK_20_50_LuGuHu: "泸沽湖"
 building_TK_20_50_LuGuHu: "$TK_20_50_LuGuHu$"
 building_TK_20_50_LuGuHu_desc: "越巂郡西南的深山之中，有一片高山湖泊，湖水清澈，四面青山倒映其中。湖畔的夷人以舟楫往来，婚嫁之俗与中原迥异。"
 building_type_TK_20_50_SaiLiMuHu: "湖泊水泽"
 building_type_TK_20_50_SaiLiMuHu_desc: "大泽浩渺，鱼虾菱藕取之不尽，水滨的百姓以渔猎舟楫为生。"
 TK_20_50_SaiLiMuHu: "赛里木湖"
 building_TK_20_50_SaiLiMuHu: "$TK_20_50_SaiLiMuHu$"
 building_TK_20_50_SaiLiMuHu_desc: "乌孙国境内天山北麓的高处有一片大湖，湖水清冷透彻，可见湖底，水中不生鱼虾，乌孙牧人在湖边草场放牧马群。"
 building_type_TK_20_51_HuangGuoShuPuBu: "瀑布激流"
 building_type_TK_20_51_HuangGuoShuPuBu_desc: "水自高崖倾泻而下，声如雷鸣，水雾弥漫，数里之外犹可听闻。"
 TK_20_51_HuangGuoShuPuBu: "黄果树瀑布"
 building_TK_20_51_HuangGuoShuPuBu: "$TK_20_51_HuangGuoShuPuBu$"
 building_TK_20_51_HuangGuoShuPuBu_desc: "牂柯郡境的深山之中，白水河至此骤然跌落，飞瀑倾泻入潭，声如雷鸣，水雾弥漫数里之外。土人相传瀑边曾有一棵结黄果的神树。"
 building_type_TK_20_51_HuKouPuBu: "瀑布激流"
 building_type_TK_20_51_HuKouPuBu_desc: "水自高崖倾泻而下，声如雷鸣，水雾弥漫，数里之外犹可听闻。"
 TK_20_51_HuKouPuBu: "壶口瀑布"
 building_TK_20_51_HuKouPuBu: "$TK_20_51_HuKouPuBu$"
 building_TK_20_51_HuKouPuBu_desc: "大河奔流至此，两岸石壁收束，河口狭窄如壶口，浊浪自高崖倾泻而下，声震数里，烟雾升腾。《禹贡》所载的壶口，便是此处。"
 building_type_TK_20_52_QinHuaiHe: "水上风光"
 building_type_TK_20_52_QinHuaiHe_desc: "一川流水，两岸人烟，舟行其上，风物如画。"
 TK_20_52_QinHuaiHe: "秦淮河"
 building_TK_20_52_QinHuaiHe: "$TK_20_52_QinHuaiHe$"
 building_TK_20_52_QinHuaiHe_desc: "淮水自东南群山流来，蜿蜒穿过秣陵，汇入大江。相传始皇帝东巡时望见金陵有天子气，便命人凿开方山，引淮水穿流而过，以泄其气。"
 building_type_TK_20_52_MiLuoJiang: "水上风光"
 building_type_TK_20_52_MiLuoJiang_desc: "一川流水，两岸人烟，舟行其上，风物如画。"
 TK_20_52_MiLuoJiang: "汨罗江"
 building_TK_20_52_MiLuoJiang: "$TK_20_52_MiLuoJiang$"
 building_TK_20_52_MiLuoJiang_desc: "汨水与罗水在长沙郡罗县境内相汇，故名汨罗。楚国三闾大夫屈原被放逐江南，郢都被秦军攻破后，怀石自投于此江。每逢五月初五，楚人竞渡江上，相传便是为了打捞屈原。"
 building_type_TK_20_52_LiJiang: "水上风光"
 building_type_TK_20_52_LiJiang_desc: "一川流水，两岸人烟，舟行其上，风物如画。"
 TK_20_52_LiJiang: "漓江"
 building_TK_20_52_LiJiang: "$TK_20_52_LiJiang$"
 building_TK_20_52_LiJiang_desc: "漓水发源于越城峤，经始皇帝所开的灵渠与湘水相通，南流入苍梧。两岸奇峰林立，如笋如簪，江水碧绿清澈。"
 building_type_TK_20_60_JiuZhaiGou: "综合景区"
 building_type_TK_20_60_JiuZhaiGou_desc: "深山之中，湖池林泉层叠相映，景致奇丽，罕有人至。"
 TK_20_60_JiuZhaiGou: "九寨沟"
 building_TK_20_60_JiuZhaiGou: "$TK_20_60_JiuZhaiGou$"
 building_TK_20_60_JiuZhaiGou_desc: "岷山以北的深山之中，沟谷之间湖泊层叠，水色碧蓝斑斓，宛若珠串。氐羌诸部散居谷中，世代以耕牧为生。"
 building_type_TK_20_60_HuangLongJingQu: "综合景区"
 building_type_TK_20_60_HuangLongJingQu_desc: "深山之中，湖池林泉层叠相映，景致奇丽，罕有人至。"
 TK_20_60_HuangLongJingQu: "黄龙景区"
 building_TK_20_60_HuangLongJingQu: "$TK_20_60_HuangLongJingQu$"
 building_TK_20_60_HuangLongJingQu_desc: "岷山深处，一道山脊上层层叠叠铺满金黄色的石池，水流其间，远望宛如一条黄龙自雪山蜿蜒而下。羌人视之为神迹，岁时祭祀。"
 building_type_TK_20_61_CangShanErHai: "水光山色"
 building_type_TK_20_61_CangShanErHai_desc: "山水相映，风物清嘉，文人雅士与往来行旅常在此流连忘返。"
 TK_20_61_CangShanErHai: "苍山洱海"
 building_TK_20_61_CangShanErHai: "$TK_20_61_CangShanErHai$"
 building_TK_20_61_CangShanErHai_desc: "叶榆泽碧波浩荡，西岸点苍山倒映其中，山水相映，风物绝佳。泽畔的昆明诸部以渔猎耕牧为生。"
 building_type_TK_20_61_TianYaHaiJiao: "水光山色"
 building_type_TK_20_61_TianYaHaiJiao_desc: "山水相映，风物清嘉，文人雅士与往来行旅常在此流连忘返。"
 TK_20_61_TianYaHaiJiao: "天涯海角"
 building_TK_20_61_TianYaHaiJiao: "$TK_20_61_TianYaHaiJiao$"
 building_TK_20_61_TianYaHaiJiao_desc: "南海之中的大岛，孝武皇帝平定南越后在此设珠崖、儋耳二郡，后因叛乱屡起而罢弃。岛的南端海滩上巨石嶙峋，面对茫茫大海，仿佛已到了天的尽头。"
 building_type_TK_20_61_CaiShiJi: "水光山色"
 building_type_TK_20_61_CaiShiJi_desc: "山水相映，风物清嘉，文人雅士与往来行旅常在此流连忘返。"
 TK_20_61_CaiShiJi: "采石矶"
 building_TK_20_61_CaiShiJi: "$TK_20_61_CaiShiJi$"
 building_TK_20_61_CaiShiJi_desc: "牛渚山突入大江，绝壁临水，江流至此湍急。此地是江东与江北之间的要津，兵家渡江往往取道于此。"
 building_type_TK_20_61_GuLangYu: "水光山色"
 building_type_TK_20_61_GuLangYu_desc: "山水相映，风物清嘉，文人雅士与往来行旅常在此流连忘返。"
 TK_20_61_GuLangYu: "鼓浪屿"
 building_TK_20_61_GuLangYu: "$TK_20_61_GuLangYu$"
 building_TK_20_61_GuLangYu_desc: "闽地海湾中的一座小岛，岛西南有礁石，每逢潮涨，浪击礁石，声若擂鼓。"
 building_type_TK_20_61_KeKeXiLi: "水光山色"
 building_type_TK_20_61_KeKeXiLi_desc: "山水相映，风物清嘉，文人雅士与往来行旅常在此流连忘返。"
 TK_20_61_KeKeXiLi: "可可西里"
 building_TK_20_61_KeKeXiLi: "$TK_20_61_KeKeXiLi$"
 building_TK_20_61_KeKeXiLi_desc: "西羌之地以西，是一片寒冷荒凉的高原，地势高峻，人迹罕至。原上成群的野牦牛与羚羊奔走，偶有猎人追逐而来，也多畏于寒风而折返。"
 building_type_TK_20_61_LanYanJing: "水光山色"
 building_type_TK_20_61_LanYanJing_desc: "山水相映，风物清嘉，文人雅士与往来行旅常在此流连忘返。"
 TK_20_61_LanYanJing: "蓝眼睛"
 building_TK_20_61_LanYanJing: "$TK_20_61_LanYanJing$"
 building_TK_20_61_LanYanJing_desc: "匈奴北境的北海，湖水深广，寒冬冰封如镜。孝武皇帝时，苏武出使匈奴不屈，被流放到北海边牧羊，十九年持节不失。"
 building_type_TK_20_62_XuanLanJiGuang: "自然景观"
 building_type_TK_20_62_XuanLanJiGuang_desc: "天地造化的奇景，非人力所能及，见者无不惊叹。"
 TK_20_62_XuanLanJiGuang: "绚烂极光"
 building_TK_20_62_XuanLanJiGuang: "$TK_20_62_XuanLanJiGuang$"
 building_TK_20_62_XuanLanJiGuang_desc: "北方极远之地，冬夜天空常现五彩光气，如帷如幕，忽明忽暗，如旗幡飘舞。有人说，这便是《山海经》中衔烛照耀北方幽冥的烛龙。"
 building_type_TK_20_62_ChiLeChuan: "自然景观"
 building_type_TK_20_62_ChiLeChuan_desc: "天地造化的奇景，非人力所能及，见者无不惊叹。"
 TK_20_62_ChiLeChuan: "敕勒川"
 building_TK_20_62_ChiLeChuan: "$TK_20_62_ChiLeChuan$"
 building_TK_20_62_ChiLeChuan_desc: "阴山脚下的大川，水草丰美，一望无际，风过之处草浪起伏，牛羊隐现其间。匈奴冒顿单于曾依阻阴山，以此为苑囿。"
 building_type_TK_20_62_DaoChengYaDingJingQu: "自然景观"
 building_type_TK_20_62_DaoChengYaDingJingQu_desc: "天地造化的奇景，非人力所能及，见者无不惊叹。"
 TK_20_62_DaoChengYaDingJingQu: "稻城亚丁景区"
 building_TK_20_62_DaoChengYaDingJingQu: "$TK_20_62_DaoChengYaDingJingQu$"
 building_TK_20_62_DaoChengYaDingJingQu_desc: "西南徼外的雪域深处，三座雪山鼎足而立，峰顶终年积雪。山下湖泊澄碧，芳草如茵，土人视三山为神灵。"
 building_type_TK_20_62_ShuNanZhuHai: "自然景观"
 building_type_TK_20_62_ShuNanZhuHai_desc: "天地造化的奇景，非人力所能及，见者无不惊叹。"
 TK_20_62_ShuNanZhuHai: "蜀南竹海"
 building_TK_20_62_ShuNanZhuHai: "$TK_20_62_ShuNanZhuHai$"
 building_TK_20_62_ShuNanZhuHai_desc: "犍为郡僰道县南的山岭之间，竹林连绵数百里，风过时竹涛如海。僰人在林间伐竹为屋、编竹为器。"
 building_type_TK_20_62_LinZhiTaoHuaYuan: "自然景观"
 building_type_TK_20_62_LinZhiTaoHuaYuan_desc: "天地造化的奇景，非人力所能及，见者无不惊叹。"
 TK_20_62_LinZhiTaoHuaYuan: "林芝桃花源"
 building_TK_20_62_LinZhiTaoHuaYuan: "$TK_20_62_LinZhiTaoHuaYuan$"
 building_TK_20_62_LinZhiTaoHuaYuan_desc: "西南雪山深处有一处河谷，江水碧绿如玉，春来桃花遍野，雪峰隐现于云雾之间，宛如世外。"
 building_type_TK_20_62_LinHaiXueYuan: "自然景观"
 building_type_TK_20_62_LinHaiXueYuan_desc: "天地造化的奇景，非人力所能及，见者无不惊叹。"
 TK_20_62_LinHaiXueYuan: "林海雪原"
 building_TK_20_62_LinHaiXueYuan: "$TK_20_62_LinHaiXueYuan$"
 building_TK_20_62_LinHaiXueYuan_desc: "夫余以北、挹娄所居的深山之中，林木蔽日，冬季积雪深可没膝。挹娄人穴居山林，善射，冬日以猪膏涂身御寒。"
 building_type_TK_20_63_WuXia: "河谷风光"
 building_type_TK_20_63_WuXia_desc: "大河穿山而过，两岸峰峦夹峙，谷中水声终日不绝。"
 TK_20_63_WuXia: "巫峡"
 building_TK_20_63_WuXia: "$TK_20_63_WuXia$"
 building_TK_20_63_WuXia_desc: "大江穿巫山而过，两岸群峰连绵，重岩叠嶂，隐天蔽日，猿声终日不绝。相传巫山神女朝为行云、暮为行雨，楚王曾在梦中与她相会。"
 building_type_TK_20_63_YiLiHeGu: "河谷风光"
 building_type_TK_20_63_YiLiHeGu_desc: "大河穿山而过，两岸峰峦夹峙，谷中水声终日不绝。"
 TK_20_63_YiLiHeGu: "伊犁河谷"
 building_TK_20_63_YiLiHeGu: "$TK_20_63_YiLiHeGu$"
 building_TK_20_63_YiLiHeGu_desc: "乌孙国所居的河谷，三面环山，河水西流，草场肥美，马匹繁盛。孝武皇帝时，细君公主与解忧公主先后远嫁乌孙，汉家与乌孙由此结为婚姻之国。"
 building_type_TK_20_63_YaLuCangBuDaXiaGu: "河谷风光"
 building_type_TK_20_63_YaLuCangBuDaXiaGu_desc: "大河穿山而过，两岸峰峦夹峙，谷中水声终日不绝。"
 TK_20_63_YaLuCangBuDaXiaGu: "雅鲁藏布大峡谷"
 building_TK_20_63_YaLuCangBuDaXiaGu: "$TK_20_63_YaLuCangBuDaXiaGu$"
 building_TK_20_63_YaLuCangBuDaXiaGu_desc: "西南雪域之中，一条大江在群山之间劈出深峡，两岸绝壁万仞，坚冰悬垂，江水奔腾咆哮。峡中林木蔽日，猛兽出没，人迹罕至。"
