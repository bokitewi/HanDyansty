 building_lishui_golden_mines_01_desc:0 "$building_type_lishui_golden_mines_01_desc$"
 building_lishui_golden_mines_02:0 "扩建的丽水金矿"
 building_lishui_golden_mines_02_desc:0 "$building_jiaodong_golden_mines_02_desc$"
 building_lishui_golden_mines_03:0 "大型丽水金矿"
 building_lishui_golden_mines_03_desc:0 "$building_jiaodong_golden_mines_03_desc$"
 building_lishui_golden_mines_04:0 "丽水金矿群"
 building_lishui_golden_mines_04_desc:0 "$building_jiaodong_golden_mines_04_desc$"
 building_yaan_golden_mines_01:0 "雅安金矿"
 building_yaan_golden_mines_01_desc:0 "$building_type_yaan_golden_mines_01_desc$"
 building_yaan_golden_mines_02:0 "扩建的雅安金矿"
 building_yaan_golden_mines_02_desc:0 "$building_jiaodong_golden_mines_02_desc$"
 building_yaan_golden_mines_03:0 "大型雅安金矿"
 building_yaan_golden_mines_03_desc:0 "$building_jiaodong_golden_mines_03_desc$"
 building_yaan_golden_mines_04:0 "雅安金矿群"
 building_yaan_golden_mines_04_desc:0 "$building_jiaodong_golden_mines_04_desc$"
 building_jiaodong_crystal_mines_01:0 "胶东水晶矿"
 building_jiaodong_crystal_mines_01_desc:0 "$building_type_jiaodong_crystal_mines_01_desc$"
 building_jiaodong_crystal_mines_02:0 "扩建的胶东水晶矿"
 building_jiaodong_crystal_mines_02_desc:0 "矿洞向山腹延伸，开采出的美石日多，城中专事琢磨的玉工也渐渐聚集起来。"
 building_linzi_iron_mines_01:0 "临淄铁矿"
 building_linzi_iron_mines_01_desc:0 "$building_type_linzi_iron_mines_01_desc$"
 building_xuzhou_iron_mines_01:0 "徐州铁矿"
 building_xuzhou_iron_mines_01_desc:0 "$building_type_xuzhou_iron_mines_01_desc$"
 building_xuzhou_iron_mines_02:0 "扩建的徐州铁矿"
 building_xuzhou_iron_mines_02_desc:0 "矿坑逐年扩展，铁官添置了更多工徒与冶炉，所出铁料日渐增多。"
 building_xuzhou_iron_mines_03:0 "大型徐州铁矿"
 building_xuzhou_iron_mines_03_desc:0 "冶铁作坊沿山铺开，鼓风的皮橐昼夜不停，铸成的犁锄刀戟运往四方。"
 building_xuzhou_iron_mines_04:0 "徐州铁矿群"
 building_xuzhou_iron_mines_04_desc:0 "坑冶相连，炉火映红了半边山岭，此地之铁足以供给一州的农器与兵甲。"
