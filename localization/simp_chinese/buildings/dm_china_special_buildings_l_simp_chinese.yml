l_simp_chinese:
 building_baijing_01:0 "白陉"
 building_baijing_01_desc:0 "河内共县以北，太行山中有一条凿石开出的山道，盘折于绝壁之间，东出河内，西入上党。道上石面被车辙马蹄磨得光滑，太平时是商旅往来的捷径，兵兴时便成了扼守的要隘。"
 building_dagu_01:0 "大谷关"
 building_dagu_01_desc:0 "洛阳东南的群山之间夹着一道深谷，旧名通谷，是京师南下颍川、汝南的捷径。谷道狭长，伏兵其中便可断绝南北往来，朝廷于京师四面设关，此为其一。"
 building_dasanguan_01:0 "大散关"
 building_dasanguan_01_desc:0 "散关在陈仓之南的大散岭上，相传是周时散国的关隘。北下便是关中沃野，南出可经故道直抵汉中；昔年高祖从故道北出，袭破雍王章邯，所行正是此路。"
 building_dasuisai_01:0 "大隧塞"
 building_dasuisai_01_desc:0 "淮水之南、大别诸山之间的一道隘口，古人常将它与直辕、冥阨并提。春秋时吴王阖闾伐楚，楚臣沈尹戌曾献计，要毁去吴人的舟船，再堵塞大隧、直辕、冥阨，断其归路。"
 building_dujiangyan_01:0 "都江堰"
 building_dujiangyan_01_desc:0 "秦时蜀守李冰壅江作堋，将岷江一分为二，引水穿过成都平野，既可行舟，又可灌田。自此蜀中水旱从人，不知饥馑，时人称之为天府。"
 building_fengyue_01:0 "封岳关"
 building_fengyue_01_desc:0 "魏郡武安以西，滏水自山下涌出，两山对峙，中间留出一道狭口，名为滏口。自邺城西越太行、前往上党，多取此道。"
 building_guancheng_01:0 "关城"
 building_guancheng_01_desc:0 "汝水之北有天子的广成苑，苑南两山夹一川，朝廷于此置关，扼守京师南出汝、颍的道路。马融曾作《广成颂》，铺陈此地苑囿田猎之盛。"
 building_type_guancheng_01_desc:0 "$building_guancheng_01_desc$"
 building_hanguguan_01:0 "函谷关"
 building_hanguguan_01_desc:0 "崤山之间谷深如函，车不能并行，马不能并辔，是关中东出的门户。秦人据此东向，六国合纵之兵叩关而不能入；孝武皇帝时，楼船将军杨仆耻为关外之民，奏请将关城东移至新安。"
 building_hongzhisai_01:0 "鸿池塞"
 building_hongzhisai_01_desc:0 "常山郡西北的太行山中，峰峦夹峙，山路陡绝，战国时赵人已在此设塞。此塞北通代郡，南护常山，是燕赵之地西出的险隘。"
 building_huangjintai_01:0 "黄金台"
 building_huangjintai_01_desc:0 "燕昭王欲报齐仇，为郭隗筑宫而以师礼待之，于是乐毅自魏往，邹衍自齐往，剧辛自赵往，天下贤士争相赴燕。后人传说昭王曾筑高台、置黄金于其上以招揽贤才，这座高台便由此得名。"
 building_hulaoguan_01:0 "虎牢关"
 building_hulaoguan_01_desc:0 "成皋旧称虎牢，相传周穆王曾在此圈养猎得的猛虎。城据山岭，北临大河，是洛阳东面最要紧的门户；楚汉相争之时，高祖与项羽在此往复争夺，相持经年。"
 building_jianmenguan_01:0 "剑阁"
 building_jianmenguan_01_desc:0 "大剑山与小剑山之间，峭壁中断，两崖相对如门。石牛道从中穿过，山路沿着绝壁盘曲而上，行旅攀援而过，一人据守，万众难越。"
 building_jingjinguan_01:0 "井陉关"
 building_jingjinguan_01_desc:0 "常山郡井陉县，太行山中四面高、中央低，形如井底，故名井陉，名列天下九塞。昔年韩信率军穿过此陉，背水为阵，一战破赵。"
 building_Jixiaxuegong_01:0 "稷下学宫"
 building_Jixiaxuegong_01_desc:0 "齐都临淄的稷门之下，齐宣王广招天下文学游说之士，赐以宅第，使之不治事而议论国政，百家之说在此争鸣。荀卿年辈最尊，曾三为祭酒。"
 building_juyongguan_01:0 "居庸关"
 building_juyongguan_01_desc:0 "上谷郡居庸县南，军都山中一条长谷蜿蜒数十里，两侧高山壁立，关城便设在谷中，名列天下九塞。这是蓟城北出塞外的要道，胡骑南下，也往往由此叩关。"
 building_lingqu_01:0 "灵渠"
 building_lingqu_01_desc:0 "始皇帝发兵南征百越，命监禄凿渠，引湘水与漓水相通，楼船粮秣从此可由江汉直下岭南。渠道虽窄，却使南北水路相连，岭南从此不再远隔。"
 building_loufan_01:0 "楼烦关"
 building_loufan_01_desc:0 "楼烦本是北方胡人的部名，善于骑射。赵武灵王北破楼烦，在汾水上游的山谷间设关以备胡人；关城北控雁门，南护太原。"
 building_mengjin_01:0 "孟津"
 building_mengjin_01_desc:0 "洛阳以北的大河渡口，又名盟津。相传武王伐纣，诸侯不期而会于此，随后渡河北上。此处河面平缓，是京师北面最要紧的津渡，朝廷于京师四面设关，孟津亦在其中。"
 building_mineguan_01:0 "黾阨关"
 building_mineguan_01_desc:0 "冥阨又作黾塞，是淮水与汉水之间大别诸山中的险隘，《吕氏春秋》列为天下九塞之一。它南屏江汉，北望中原，春秋时吴楚交兵，楚人便曾谋划堵塞此关。"
 building_piantou_01:0 "偏头关"
 building_piantou_01_desc:0 "大河自塞外东来，至此折而南流，东岸山岭东高西低，地势偏斜。此地在雁门与西河之间，匈奴骑兵常趁冬日河冰渡河南下，是并州西北边防的要害。"
 building_tianjing_01:0 "天井关"
 building_tianjing_01_desc:0 "上党郡高都县南，太行山之巅设有关城，关前有三眼深不可测的泉井，故名天井。由此南下便是河内，北上则入上党，是太行南端的锁钥。"
 building_tongguan_01:0 "潼关"
 building_tongguan_01_desc:0 "华山东北、大河南岸的高阜被深沟切开，道路只能沿着沟底与河岸蜿蜒而行，地势险窄。这里古称桃林之塞，相传武王克商之后，曾在此放牛于桃林之野，以示天下不复用兵。"
 building_wuguan_01:0 "武关"
 building_wuguan_01_desc:0 "武关在商县以东的丹水河谷中，春秋时称少习，是关中东南通往南阳、荆楚的咽喉。秦昭王曾在此诱执楚怀王；高祖西入咸阳，也是先破此关而进。"
 building_wushengguan_01:0 "武胜关"
 building_wushengguan_01_desc:0 "直辕是大别诸山中的一道隘口，两山夹峙，中通一道，自古是淮水以南南北往来的大路。春秋时它与大隧、冥阨同为楚国北面的屏障，楚人倚之以御北方。"
 building_xiameng_01:0 "夏门关"
 building_xiameng_01_desc:0 "广汉郡葭萌县，西汉水与白水在此交汇，群山环抱。此地古为苴侯之国，秦惠王伐蜀，蜀王便是在葭萌兵败。城北通汉中，南下成都，是入蜀的要冲。"
 building_xiaoguan_01:0 "萧关"
 building_xiaoguan_01_desc:0 "萧关在安定郡朝那县境内，背倚陇山，扼守泾水上游的河谷，是关中西北的锁钥。孝文皇帝时匈奴攻破此关，烽火一直传到甘泉宫，朝野为之震动。"
 building_xiaopingjin_01:0 "小平津"
 building_xiaopingjin_01_desc:0 "洛阳以北的又一处大河渡口，地位仅次于孟津，故称小平津。河中沙洲错落，水流平缓，朝廷于京师四面设关，此津亦有都尉屯守。"
 building_xuanmen_01:0 "旋门关"
 building_xuanmen_01_desc:0 "成皋以西，山坂曲折回旋，宛如门户，故称旋门。班昭随子东行，途经此地，曾将河洛交流、成皋旋门之景写入《东征赋》；东出洛阳，过此便再无险阻可守。"
 building_xuanyuan_01:0 "轩辕关"
 building_xuanyuan_01_desc:0 "太室山与少室山之间，山道曲折回环，将去复还，故称轘辕。此道是洛阳东南通往颍川的捷径，朝廷于京师四面设关，轘辕亦在其中。"
 building_yangguan_01:0 "阳关"
 building_yangguan_01_desc:0 "敦煌郡龙勒县境内，因在玉门关之南，故称阳关，是出塞西行南道的门户。关外沙碛茫茫，水草稀少，使节与商旅到了这里，便要辞别中原了。"
 building_yangping_01:0 "阳平关"
 building_yangping_01_desc:0 "汉中郡西境的山谷之中，汉水北岸两山夹峙，关城扼守汉中西出武都、北上陈仓的道路。此地是汉中的西门，守住这里，南郑方能安枕。"
 building_yanmenguan_01:0 "雁门关"
 building_yanmenguan_01_desc:0 "句注山横亘雁门郡南，山势陡绝，中有隘口，相传鸿雁南北往来都从此飞过。山上设有句注塞，名列天下九塞，是并州北边抵御胡骑最要紧的屏障。"
 building_yaoguan_01:0 "峣关"
 building_yaoguan_01_desc:0 "蓝田县南，峣山与蒉山之间的险关，是武关道进入关中的最后一道门户。高祖西入咸阳之时，先以重宝诱秦将，又绕过峣关，越蒉山击破秦军，于是直抵霸上。"
 building_yijue_01:0 "伊阙关"
 building_yijue_01_desc:0 "洛阳之南，两山东西对峙，伊水从中穿流而过，望之如同宫阙，故称伊阙。战国时秦将白起曾在此大破韩魏之师；朝廷于京师四面设关，伊阙亦在其中。"
 building_yumen_01:0 "玉门关"
 building_yumen_01_desc:0 "孝武皇帝开置河西诸郡，筑塞直抵敦煌，设玉门关以通西域，诸国使节与胡商皆由此入塞。关外流沙千里；班超久戍西域，晚年上书，只求能生入玉门关。"
 building_zhanghuagong_01:0 "章华宫"
 building_zhanghuagong_01_desc:0 "楚灵王所筑的离宫高台，台高而广，宫室壮丽，落成之日曾邀诸侯前来同庆。灵王好细腰，宫中之人为求纤瘦，多有饿死者，后人每每以此为戒。"
 building_zhugong_01:0 "渚宫"
 building_zhugong_01_desc:0 "楚国的别宫，坐落在郢都东南的江渚之上。楚王在此临江听政，既能监看大江与汉水上的舟楫往来，也可作为南巡时的驻跸之所。"
 building_gusugong_01:0 "姑苏台"
 building_gusugong_01_desc:0 "吴王阖闾始筑、夫差增修的高台，在吴县西南的姑苏山上。台上宫馆相连，登临可俯瞰太湖烟波与田野村落；吴亡之后，台榭渐成废墟，只余故址供人凭吊。"
 building_zhennan_01:0 "镇南关"
 building_zhennan_01_desc:0 "郁林与交趾之间群山重叠，林深谷暗，山间有一道隘口，是岭南陆路通往交趾的要冲。光武皇帝时伏波将军马援南征，曾随山开道，大军方得南下。"
 building_zhouwanggong_01:0 "周王宫"
 building_zhouwanggong_01_desc:0 "周平王东迁之后，天子居于洛邑王城，殿宇巍峨，长廊回环，天子在此朝会诸侯、祭祀天地。王城旧址就在河南县，父老至今还能指出当年宫阙的所在。"
 building_zijin_01:0 "紫荆关"
 building_zijin_01_desc:0 "易水上源的山谷中，两山相夹，坡上多生紫荆，关城依坡傍水而建。此关是涿郡西入太行、通往代地的隘口，北边有警时，常有重兵屯守于此。"

 building_jiaodong_golden_mines_01:0 "胶东金矿"
 building_jiaodong_golden_mines_01_desc:0 "$building_type_jiaodong_golden_mines_01_desc$"
 building_jiaodong_golden_mines_02:0 "扩建的胶东金矿"
 building_jiaodong_golden_mines_02_desc:0 "矿坑越凿越深，工匠架木支撑坑壁，循着金脉向地下更深处追寻。"
 building_jiaodong_golden_mines_03:0 "大型胶东金矿"
 building_jiaodong_golden_mines_03_desc:0 "采金的人家日渐增多，山下建起成排的淘洗场与冶炉，熔成的金饼一批批运往郡府。"
 building_jiaodong_golden_mines_04:0 "胶东金矿群"
 building_jiaodong_golden_mines_04_desc:0 "矿坑遍布山野，开采、淘洗、熔铸各有专人，此地所出的黄金源源不断地输入府库。"
