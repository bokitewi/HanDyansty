l_simp_chinese:
 game_concept_embattle:0 "布阵"
 game_concept_embattle_desc:0 "每支军队可设左右两名副将，从本军的骑士中选任。副将出缺时，各方军队都会自动补任；若一时无人可补，便暂且搁置，你可以通过“重新检查副将空缺”决议重新点检。"
 game_concept_embattle_side_advantage_modifier:0 "副将军事修正"
 game_concept_embattle_side_advantage_modifier_desc:0 "副将的军事才能会影响你麾下军队的战斗优势。有两名副将时，额外优势为主将与两名副将军事的平均值减去主将的军事；只有一名副将时，为主副将军事的平均值减2，再减去主将的军事；没有副将时通常为-5，叛军首领与没有骑士名额的统治者不受此罚。只有仍在本军中的副将才会计入；副将军事不如主将时，额外优势可能为负。"
 game_concept_embattle_tactic:0 "战术（已移除）"
 game_concept_embattle_tactic_desc:0 "布阵附加战术已经废止。战斗中的兵种克制与胜负之数一如常例。"
 game_concept_embattle_tactic_counter:0 "旧版战术克制"
 game_concept_embattle_tactic_counter_desc:0 "附加战术之间的克制已经废止，不再影响战斗优势。"
 game_concept_embattle_general_tactic_group:0 "旧版常规战术组"
 game_concept_embattle_general_tactic_group_desc:0 "此战术组已经废止。"
 game_concept_embattle_clumsy_tactic_group:0 "旧版拙劣战术组"
 game_concept_embattle_clumsy_tactic_group_desc:0 "此战术组已经废止。"
 game_concept_a_culling_of_the_weak:0 "优胜劣汰兼容说明"
 game_concept_a_culling_of_the_weak_desc:0 "副将的选任与维护只在本军之内进行；补任不成便暂且搁置，直到再次点检。"
