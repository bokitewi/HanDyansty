l_simp_chinese:
 game_concept_embattle:0 "布阵"
 game_concept_embattle_desc:0 "每支军队保存左右两名副将，可从本军队骑士中任命。玩家与AI均可自动任命；无法补齐后停止自动重试。玩家可通过“重新检查副将空缺”决议重新尝试。附加战术机制已移除。"
 game_concept_embattle_side_advantage_modifier:0 "副将军事修正"
 game_concept_embattle_side_advantage_modifier_desc:0 "保留现有玩家军队战斗加成范围。两名副将：额外优势等于主将与两名副将军事的平均值减主将军事。一名副将：主副将军事平均后再扣2，并减主将军事。没有副将通常为-5，保留原有豁免。仅当前合法副将参与计算；弱副将可能降低军事项。"
 game_concept_embattle_tactic:0 "战术（已移除）"
 game_concept_embattle_tactic_desc:0 "本补丁已移除布阵附加战术的抽选、兵种统计、延迟轮询、克制和多样性奖励。CK3原有兵种克制与战斗机制未在此补丁中修改。"
 game_concept_embattle_tactic_counter:0 "旧版战术克制"
 game_concept_embattle_tactic_counter_desc:0 "附加战术克制已停用，不再产生优势惩罚。"
 game_concept_embattle_general_tactic_group:0 "旧版常规战术组"
 game_concept_embattle_general_tactic_group_desc:0 "该战术组已停用，不再按兵种生成或抽选。"
 game_concept_embattle_clumsy_tactic_group:0 "旧版拙劣战术组"
 game_concept_embattle_clumsy_tactic_group_desc:0 "该战术组已停用，不再补足战术数量或施加惩罚。"
 game_concept_a_culling_of_the_weak:0 "优胜劣汰兼容说明"
 game_concept_a_culling_of_the_weak_desc:0 "旧版布阵曾使用第三方遮蔽特质筛选。本补丁不再依赖该特质；副将维护改为单军队和失败暂停。"
 game_concept_embattle_volly_tactic:0 "齐射（已移除）"
 game_concept_embattle_volly_tactic_desc:0 "旧版布阵附加战术已停用；此定义仅保留旧文本引用，不再产生数值效果。"
