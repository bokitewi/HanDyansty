 # 531 年剧本「信都起兵」。计划见 /mnt/project-files/531高欢剧本_计划.md。
 bm_hd_531: "信都起兵"
 bm_hd_531_desc: "普泰元年。去年秋天，孝庄帝在明光殿手刃尔朱荣，尔朱兆随即攻入洛阳，缢杀天子于晋阳。尔朱世隆废掉长广王，另立广陵王元恭，改元普泰。尔朱氏四人分据天下：兆据并州，世隆专朝政，天光据关右，仲远擅徐兖。\n\n六月庚子，统领六镇降户的晋州刺史高欢在信都举兵。渤海高乾、高昂兄弟与封隆之已先据冀州，赵郡李元忠也在殷州响应。高欢此时还不曾公开与尔朱氏决裂，但河北的人心，已经不在洛阳了。\n\n南方，梁武帝在位三十年，昭明太子新丧，晋安王萧纲刚被立为太子。\n\n#bold 北魏的天下，将在三年之内一分为二。#!"

 bm_hd_531_gao_huan: "高欢"
 bm_hd_531_gao_huan_subheading: "渤海王、东道大行台"
 bm_hd_531_gao_huan_desc: "高欢字贺六浑，世居怀朔镇，娶鲜卑贵女娄昭君。尔朱荣死后，他向尔朱兆讨来六镇降户十余万，东出太行，就食山东。如今冀州豪族都站在他这边，可尔朱兆的大军就在西面，手里能战的兵也还不多。"

 bm_hd_531_erzhu_zhao: "尔朱兆"
 bm_hd_531_erzhu_zhao_subheading: "颍川王，据并州"
 bm_hd_531_erzhu_zhao_desc: "尔朱荣的从子，骁勇善战而少谋略。去年他率先攻入洛阳，擒杀孝庄帝，自恃功高，与洛阳的尔朱世隆并不和睦。晋阳兵强马壮，北边侯景、侯渊替他镇守定、幽二州，信都的高欢却已经不再听他调遣。"

 bm_hd_531_erzhu_shilong: "尔朱世隆"
 bm_hd_531_erzhu_shilong_subheading: "尚书令，专擅朝政"
 bm_hd_531_erzhu_shilong_desc: "尔朱荣的从弟，节闵帝就是他扶立的。天子在洛阳，号令却出自他的尚书省。他能左右朝廷，却管不住晋阳、长安、彭城的几位兄弟，而河北的叛乱正一天天逼近。"

 bm_hd_531_erzhu_tianguang: "尔朱天光"
 bm_hd_531_erzhu_tianguang_subheading: "关右大行台"
 bm_hd_531_erzhu_tianguang_desc: "尔朱荣的从祖兄子，带着贺拔岳、侯莫陈悦平定万俟丑奴和宿勤明达，关陇尽入掌握。长安离洛阳不远，离信都却很远，他未必愿意为兄弟们东征。"

 bm_hd_531_erzhu_zhongyuan: "尔朱仲远"
 bm_hd_531_erzhu_zhongyuan_subheading: "彭城王，擅徐兖"
 bm_hd_531_erzhu_zhongyuan_desc: "尔朱荣的从弟，坐镇彭城，以贪暴著称，徐、兖一带的豪族富户多被他诬以谋反、籍没家产。东南与梁接壤，北面是高欢，他的地盘富庶，却没有多少人愿意替他卖命。"

 bm_hd_531_heba_yue: "贺拔岳"
 bm_hd_531_heba_yue_subheading: "泾州刺史，天光部将"
 bm_hd_531_heba_yue_desc: "武川镇人，与兄贺拔胜都以勇武知名。他随尔朱天光入关，平定关陇的战功多出自他手。关中将士信服他胜过信服天光，帐下还有一个叫宇文泰的年轻人。"

 bm_hd_531_hou_jing: "侯景"
 bm_hd_531_hou_jing_subheading: "定州刺史"
 bm_hd_531_hou_jing_desc: "怀朔镇人，与高欢是旧识。他跛足，却善于用兵，跟随尔朱荣擒葛荣，得任定州刺史。如今他名义上听命于尔朱兆，可他从来只替能赢的人打仗。"

 bm_hd_531_yuan_gong: "元恭"
 bm_hd_531_yuan_gong_subheading: "节闵帝"
 bm_hd_531_yuan_gong_desc: "广陵王元羽之子，因为孝明帝时的乱政装哑八年，避祸龙华寺。尔朱世隆嫌长广王疏远，把他请出来做了皇帝。他读书明理，知道自己只是尔朱氏手里的一枚印章。"

 bm_hd_531_xiao_yan: "萧衍"
 bm_hd_531_xiao_yan_subheading: "梁武帝"
 bm_hd_531_xiao_yan_desc: "兰陵萧氏，齐末起兵襄阳，夺了南齐的天下，在位已三十年。他精通儒、佛、文学，躬身节俭，几度舍身同泰寺。北方大乱，正是梁朝收复淮北的机会；可他已经六十八岁，太子萧统又刚刚去世。"

 bm_hd_531_a_na_gui: "阿那瓌"
 bm_hd_531_a_na_gui_subheading: "敕连头兵豆伐可汗"
 bm_hd_531_a_na_gui_desc: "柔然可汗，当年兵败逃奔北魏，靠魏军复国。六镇之乱中他还替北魏出兵平叛。如今漠北又归柔然，北魏一分为二，正是他左右逢源的时候。"

 bm_hd_531_yuwen_tai: "宇文泰"
 bm_hd_531_yuwen_tai_subheading: "直阁将军，行原州事"
 bm_hd_531_yuwen_tai_desc: "武川镇人，宇文鲜卑之后，随贺拔岳入关，平定万俟丑奴后代理原州。他才二十五岁，只有朝那一隅，可贺拔岳事无大小都与他商量。"

 hd_531_liuzhen_army_name: "六镇降户"
 hd_531_gaohuan_army_name: "高欢所部"
 hd_531_erzhu_army_name: "尔朱联军"
 hd_531_mandate_lock_tt: "尔朱四家分据天下，名义上都奉洛阳天子（韩陵之战以后才可终结乱世）"

