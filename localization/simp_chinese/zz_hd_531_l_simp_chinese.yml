 hd_531.0110.t: "信都立帝"
 hd_531.0110.desc: "高乾、孙腾说到元朗时，原本还在争论兵粮的人都安静了。他们劝我另奉一位宗室：洛阳的天子由尔朱氏扶立，河北若始终奉同一道号令，举兵的名义便难以向各州说明。\n\n我让人细问元朗的处境。宗室的名字可以写进檄文，但接到军前的人，是一个活着的君主，未必只肯做我手中一面旗帜。眼下诸军需要聚在一起，河北士人也需要知道自己正在替谁效力；另立天子，正可给他们一个答案。我看向仍在等候的两人。这一声奉戴说出去，与尔朱氏之间，便再不能只称几句旧日情分。"
 hd_531.0110.a: "迎元朗即位，改元中兴。"
 hd_531.0110.b: "还不到与尔朱氏公开决裂的时候。"

 hd_531.0120.t: "进攻邺城"
 hd_531.0120.desc: "谈到邺城，诸将把河北的道路又连着说了一遍。冀州虽已可以立足，往南去的粮运与人马，却仍受刘诞所守之城牵制；想让各处真正接成一片，就不能永远绕开这一处。\n\n我叫人将城中守备的消息取来。能募得多少兵、带得去多少粮，都得先问清楚；刘诞肯不肯退让，却不能由我代他答应。邺城是要地，攻取它也必然会把冲突推得更远。请战的人说已经可以出发，主张谨慎的人则要先保住冀州。我听着两边的声音，将手中的军报放下。今日若下进兵令，下一次便须用真正的战果作答。"
 hd_531.0120.a: "引兵攻邺。"
 hd_531.0120.b: "先守住冀州再说。"

 hd_531.0130.t: "会师邺南"
 hd_531.0130.desc: "会师的军队一部接一部报到，诸将说起高欢时，声音比先前更响：邺城虽在他手里，兵众却远少于我方，只消合军进击，便可将河北夺回。\n\n我望着各部不同的旗号，听见他们争论谁当前锋，谁守粮道。众人都姓尔朱，心里却各有旧怨与盘算；昨日已经答应的行程，今日也有人借故更改。高欢能不能被擒，还在战后，这些兵马能不能听从同一道号令，却须先在眼前解决。若现在出兵，就要带着这份不和一起走；若不去，便是任由他继续坐大。报事的将领仍站在近前，等我定下是否进军。"
 hd_531.0130.a: "合兵进攻邺城。"
 hd_531.0130.b: "各家都各怀心思，不去。"

 hd_531.0140.t: "韩陵兵败"
 hd_531.0140.desc: "听到韩陵溃败的消息，我先叫人收住城门，门外却仍有人悄悄离开。昨日还能报上来的兵众，今日已经缺了许多；问起去向，各营回答得含糊，仿佛只要不说清，便还可以把他们算在军籍里。\n\n有人劝我南下投梁，说总比留在这里等高欢来强。如今这句话忽然变得切近：弃城南奔，或许还能从败局中脱身，却须将手中的州郡与多年经营一起舍下。我望向那些仍肯留下的部下，他们想知道我会不会也走。高欢的兵尚未到眼前，可去留不能等到被围时再定。是趁此时向南，还是留在城中，与他们共守这一处？"
 hd_531.0140.a: "弃城南奔，投梁。"
 hd_531.0140.b: "据城死守。"

 hd_531.0150.t: "入洛立帝"
 hd_531.0150.desc: "斛斯椿派来的人没有在军前久留，只说洛阳已有接应，等我南下便可动手。我听完，把他遣开，转而问起入城以后该奉谁为帝。众人的答复，渐渐落到了平阳王元修身上。\n\n韩陵得胜，已经让尔朱氏不再有先前的声势；可我若只站在河北，洛阳的名位与诏令便仍由别人使用。入洛拥立元修，能使朝廷的大权也落入我手中，也会让新的天子与我彼此牵制。我记起先前用以聚众的名义，知道每换一位拥立的天子，便要再向追随者说明一次。南下的路已经有人替我打开，是否沿着它走进洛阳，该由我定了。"
 hd_531.0150.a: "入洛，奉平阳王即位。"
 hd_531.0150.b: "不入洛，仍据河北自立。"

 hd_531.0160.t: "斛斯椿之变"
 hd_531.0160.desc: "守门人跑回来，说外面的道路已经被兵士截住。我起身往门口走，身边人却拦住了我：斛斯椿在洛阳发难，正搜捕尔朱氏的人，此刻出去，未必还有机会再回来。\n\n韩陵的败讯刚到，旧日还肯往来的面孔便纷纷不见了。我问家中能聚起多少护卫，又问往封地去的路是否还能走；两边都有人答话，却谁也不敢说一定安全。留在朝廷所得的权势，如今已经成了追兵辨认我的凭据。趁夜离开，或能退回封地，保住自己的兵马；闭门抵抗，则要同高欢真正打一场。门外又传来叩击声，这次没有先报姓名。"
 hd_531.0160.a: "趁夜出奔，回自己的封地。"
 hd_531.0160.b: "闭门死守，与高欢决一死战。"

 hd_531.0170.t: "禅位"
 hd_531.0170.desc: "高欢派来的人请我让位，说我是尔朱氏所立，天下人心不附，宜将帝位交给平阳王。他说得恭敬，殿外的兵马却使每一句恭敬都显得不必再多作解释。\n\n我听见平阳王的名号，又看向在场的臣子。尔朱氏扶我登极时，他们也曾站在这里称贺；如今掌兵的人换了，便又有人替我拟好离开御座的措辞。下诏禅位，至少还能避免眼前立刻兵戎相见，可天子的国统与权柄，也将一并交出。我若拒绝，便须承受高欢军队的攻势。来使仍伏着等候，催我给出一份能够带回军前的答复。"
 hd_531.0170.a: "下诏禅位。"
 hd_531.0170.b: "朕是天子，不让。"
