l_simp_chinese:
 hd_tuntian:0 "屯田"
 hd_tuntian_short:0 "屯田"
 hd_tuntian_text_icon:0 "@celestial_military_administration!"
 hd_tuntian_desc:0 "军屯兼领郡国，以耕战相济，筹粮练卒。屯田官守其职而不参与后续升迁调任，君主仍可依现有任免制度更换人选。"
 hd_tuntian_benefits:0 "$EFFECT_LIST_BULLET$军事类型编制，可招募头衔兵士\n$EFFECT_LIST_BULLET$无固定任期，谢绝后续任命\n$EFFECT_LIST_BULLET$仅公国级（郡国级）直属封臣可使用，王国与伯爵级封臣不可使用\n$EFFECT_LIST_BULLET$王国级君主最多拥有#V 1#!位屯田直属封臣；帝国与霸权级君主最多拥有#V 3#!位\n$EFFECT_LIST_BULLET$征召兵补员速度#P +15%#!，发展度增长#P +12%#!\n$EFFECT_LIST_BULLET$直辖地产税收#N -5%#!，征召兵数量#N -5%#!\n$EFFECT_LIST_BULLET$建筑工期#P -5%#!，建筑花费#P -8%#!"
 hd_tuntian_liege_tier_tt:0 "直属君主须为王国、帝国或霸权级，不要求其为最高领主"
 hd_tuntian_exact_tier_tt:0 "受封者的最高头衔必须恰为公国级（郡国级），王国与伯爵级封臣不可使用"
 hd_tuntian_limit_tt:0 "王国级君主最多拥有一位屯田直属封臣，帝国与霸权级君主最多拥有三位；保留已有屯田不算新增"
 hd_tuntian_request_blocked_tt:0 "屯田须由直属君主设立，封臣不能自行申请改为屯田"
 hd_special_contract_resume_blocked_tt:0 "屯田官及军事殖民领主在该契约存续期间不接受后续任命"
 hd_military_colony:0 "军事殖民"
 hd_military_colony_short:0 "军事殖民"
 hd_military_colony_text_icon:0 "@celestial_military_administration!"
 hd_military_colony_desc:0 "主君授地于同一文化传承的部众，使其携家属、私兵定居守土。领地依长子继承规则世袭，不使用天朝官员继任池。"
 hd_military_colony_benefits:0 "$EFFECT_LIST_BULLET$军事类型编制，只能招募私人部曲，不能招募头衔兵士\n$EFFECT_LIST_BULLET$私人部曲军团上限#P +2#!，每团规模#P +2#!\n$EFFECT_LIST_BULLET$征召兵数量#P +10%#!，大众好感#N -20#!\n$EFFECT_LIST_BULLET$推广文化与伯爵领改信任务速度#P +10%#!\n$EFFECT_LIST_BULLET$依长子继承规则世袭，不参与天朝任命\n$EFFECT_LIST_BULLET$仅非中华文化传承的领主可以设立，受封者须与其同文化传承"
 hd_military_colony_liege_heritage_tt:0 "设立军事殖民的领主不能属于中华文化传承"
 hd_military_colony_same_heritage_tt:0 "受封者必须与领主属于同一文化传承"
 hd_military_colony_succession_law:0 "军事殖民长子继承制"
 hd_military_colony_succession_law_subname:0 "最年长的合格子嗣继承全部适用头衔"
 hd_military_colony_succession_law_desc:0 "按原版长子继承规则，由最年长的合格子嗣继承全部适用头衔。继承资格仍遵循现行性别法及原版亲属继承规则，不进入天朝官员继任池。"
 hd_military_colony_succession_law_effects:0 "$hd_military_colony_succession_law_desc$"
 HD_MILITARY_COLONY_CONVERSION_SPEED:0 "军事殖民"
