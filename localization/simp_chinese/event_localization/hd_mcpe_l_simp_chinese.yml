l_simp_chinese:
 mcpe.13.t:0 "当众受辱"
 mcpe.13.d.no_bully_fallback:0 "庭院里，一个孩子当着众人的面讥笑你，言语刻薄，句句扎心。旁人都噤了声，只等着看你如何应对。"
 mcpe.13.d.bully:0 "庭院里，[bully.GetTitledFirstName|U]当着众人的面讥笑你，言语刻薄，句句扎心。旁人都噤了声，只等着看你如何应对。"
 mcpe.13.a:0 "辱我者，以拳还之！"
 mcpe.13.b:0 "此辱且记下，来日必报。"
 mcpe.13.c:0 "口舌之言，何足挂怀。"
 mcpegr.13.d_bully:0 "[child.GetTitledFirstName|U]来找你，说[bully.GetTitledFirstName]当着一众孩童的面讥笑了[child.GetHerHim]。\n\n"
 mcpegr.13.d_no_bully_fallback:0 "[child.GetTitledFirstName|U]来找你，说有个孩子当众讥笑了[child.GetHerHim]。\n\n"
 mcpegr.13.d_wrathful:0 "[child.GetSheHe|U]没有忍让，当场便挥拳打了过去。"
 mcpegr.13.d_vengeful:0 "[child.GetSheHe|U]当时隐忍未发，却暗暗立誓，迟早要让对方付出代价。"
 mcpegr.13.d_calm:0 "[child.GetSheHe|U]只当那是无聊的挑衅，一笑置之，并未放在心上。"
 mcpegr.13.confirm_wrathful:0 "受辱还击，理所当然。"
 mcpegr.13.confirm_vengeful:0 "善。此辱不可忘，亦不可恕。"
 mcpegr.13.confirm_calm:0 "明智。区区恶语，何能伤[child.GetHerHim]。"
 mcpegr.13.wrathful_change:0 "[child.GetFirstNameNoTooltip|U]，受此大辱，何须隐忍！"
 mcpegr.13.vengeful_change:0 "此仇当记在心，来日再报。"
 mcpegr.13.calm_change:0 "几句闲话，犯不着动气。"
 mcpe.14.t:0 "怨偶相争"
 mcpe.14.d:0 "你撞见府中一对成婚多年的仆役夫妇在争吵。两人早忘了起因，却仍互相数落不休，甚至都说当年结这门亲是此生最大的错。"
 mcpe.14.a:0 "若情爱终究如此，不要也罢。"
 mcpe.14.b:0 "可见人皆只顾自己。"
 mcpe.14.c:0 "彼此肯听对方说完便好了。"
 mcpegr.14.d:0 "你听说[child.GetTitledFirstName]撞见一对仆役夫妇争吵。两人为些琐事互相数落，还说当初就不该成亲。\n\n"
 mcpegr.14.d_chaste:0 "[child.GetFirstNameNoTooltip|U]说，若所谓情爱到头来只剩争吵，那还不如不要。"
 mcpegr.14.d_cynical:0 "[child.GetFirstNameNoTooltip|U]说，这正说明人人心里先想着的都是自己。"
 mcpegr.14.d_patient:0 "[child.GetFirstNameNoTooltip|U]说，只要两人肯耐着性子听完对方的话，事情总能解开。"
 mcpegr.14.confirm_chaste:0 "此念无可厚非。"
 mcpegr.14.confirm_cynical:0 "世情如此，记下这一课。"
 mcpegr.14.confirm_patient:0 "但愿世人皆有此明达……"
 mcpegr.14.chaste_change:0 "情爱若是如此，要它何用？"
 mcpegr.14.cynical_change:0 "说到底，人皆只顾自己。"
 mcpegr.14.patient_change:0 "两人肯彼此倾听便好了。"
 mcpe.15.t:0 "枯坐听讲"
 mcpe.15.d:0 "你不得不端坐着听经师讲学。那声音又慢又平，一句话还没讲完，你已忘了开头说的是什么。你实在坐不住了……"
 mcpe.15.a:0 "先生，请直言要旨！"
 mcpe.15.b:0 "再难，也须专心听完。"
 mcpe.15.c:0 "寻个由头告退，再寻个由头不归。"
 mcpegr.15.d:0 "你安排[child.GetTitledFirstName]去听一位出了名乏味的经师讲学，也想看看[child.GetSheHe]如何应付。\n\n"
 mcpegr.15.d_impatient:0 "[child.GetSheHe|U]没多久便打断经师，直言这堂课实在无趣。"
 mcpegr.15.d_diligent:0 "[child.GetSheHe|U]竟从头到尾都在用心听讲。"
 mcpegr.15.d_deceitful:0 "[child.GetSheHe|U]找了个借口离席，又编了个理由，再没回来。"
 mcpegr.15.confirm_impatient:0 "然。光阴岂容他人虚掷！"
 mcpegr.15.confirm_diligent:0 "甚好，[child.GetFirstNameNoTooltip]，难能可贵。"
 mcpegr.15.confirm_deceitful:0 "哈！[child.GetFirstNameNoTooltip]，倒是机灵。"
 mcpegr.15.impatient_change:0 "何必容人虚耗你的光阴！"
 mcpegr.15.diligent_change:0 "[child.GetFirstNameNoTooltip|U]，当更用功才是！"
 mcpegr.15.deceitful_change:0 "寻个由头离席便是了。"
 mcpe.16.t:0 "情窦初开"
 mcpe.16.d.no_crush:0 "你喜欢上了一名寻常的[child.Custom('servant_for_romance')]，可对方一家不日就要远行。若此时不把心意说出口，往后怕是再也见不着了。"
 mcpe.16.d.crush:0 "你心里装着[crush.GetTitledFirstName]。眼下正是吐露心意的好时机，可每回话到嘴边，你又生出几分怯意。"
 mcpe.16.a:0 "觅个时机，当面直陈心意。"
 mcpe.16.b:0 "且先暗中窥看一番……"
 mcpe.16.c:0 "闭门不出，但愿无人察觉。"
 mcpegr.16.d:0 "你发觉[child.GetTitledFirstName]似乎对[crush.GetTitledFirstName]动了心。\n\n"
 mcpegr.16.d.no_crush:0 "你发觉[child.GetTitledFirstName]似乎对一名寻常的[child.Custom('servant_for_romance')]动了心。\n\n"
 mcpegr.16.d_brave:0 "[child.GetFirstNameNoTooltip|U]终于鼓起勇气，当面说出了心意。"
 mcpegr.16.d_lustful:0 "[child.GetFirstNameNoTooltip|U]并未表白，倒常在暗处偷偷打量对方。"
 mcpegr.16.d_shy:0 "[child.GetFirstNameNoTooltip|U]把自己关在房里，只盼没人看出这份心思。"
 mcpegr.16.confirm_brave:0 "理当如此，坦坦荡荡。"
 mcpegr.16.confirm_lustful:0 "哈！少年心性，人皆有之。"
 mcpegr.16.confirm_shy:0 "此乃人之常情。"
 mcpegr.16.brave_change:0 "[child.GetFirstNameNoTooltip|U]，心意当坦然说出！"
 mcpegr.16.lustful_change:0 "何不先暗中看个仔细？"
 mcpegr.16.shy_change:0 "此等心事，藏在房中便好。"
 mcpe.17.t:0 "市中遭劫"
 mcpe.17.d:0 "你撞见一名仆役家的孩子缩在墙角哭泣。一问才知，那孩子去市上买吃食时遭人抢了，如今又怕又慌，不知如何是好。"
 mcpe.17.a:0 "原来外头这般凶险……"
 mcpe.17.b:0 "此事与我何干？"
 mcpe.17.c:0 "莫哭，我分你些吃食。"
 mcpegr.17.d:0 "[child.GetTitledFirstName|U]撞见一名仆役家的孩子在市上遭劫，正哭个不停。你问[child.GetFirstNameNoTooltip]打算如何处置，[child.GetSheHe]答道：\n\n"
 mcpegr.17.d_craven:0 "“我竟不知外头这样凶险。往后我们可得加倍小心。”"
 mcpegr.17.d_callous:0 "“这与我何干？何必拿这种事来烦我？”"
 mcpegr.17.d_generous:0 "“我们分些吃食给他们吧，总不能叫人饿着。”"
 mcpegr.17.confirm_craven:0 "不错，外头确实凶险。"
 mcpegr.17.confirm_callous:0 "正是，与我等何干。"
 mcpegr.17.confirm_generous:0 "分食于人，是为善举。"
 mcpegr.17.craven_change:0 "你竟不知外头何等凶险？"
 mcpegr.17.callous_change:0 "此事又与我等何干？"
 mcpegr.17.generous_change:0 "当分些吃食与他们。"
 mcpe.18.t:0 "异域珍馐"
 mcpe.18.d:0 "宴席上，有人请你尝一道价钱不菲的异域珍馐。你才吃一口便觉难以下咽，可腹中正饿，主人又在一旁等着听你品评。"
 mcpe.18.a:0 "滋味虽差，饱腹要紧。"
 mcpe.18.b:0 "这也叫珍馐？难吃至极！"
 mcpe.18.c:0 "珍馐虽贵，不吃也罢……"
 mcpegr.18.d:0 "你带[child.GetTitledFirstName]赴宴。席间有人请[child.GetHerHim]尝一道价钱不菲的异域珍馐，[child.GetHerHis]脸色却已说明了一切。\n\n"
 mcpegr.18.d_gluttonous:0 "尽管不合口味，[child.GetSheHe]还是把盘中之物吃了个精光。"
 mcpegr.18.d_honest:0 "[child.GetSheHe|U]当众直言，这道所谓的珍馐实在难以下咽。"
 mcpegr.18.d_temperate:0 "[child.GetSheHe|U]放下了箸，认定贵重的吃食未必值得多吃。"
 mcpegr.18.confirm_gluttonous:0 "难吃归难吃，终究能果腹。"
 mcpegr.18.confirm_honest:0 "说得好！直言无妨，[child.GetFirstNameNoTooltip]！"
 mcpegr.18.confirm_temperate:0 "饮食有节，足矣。"
 mcpegr.18.gluttonous_change:0 "再难吃也是吃食！"
 mcpegr.18.honest_change:0 "难吃便直说难吃！"
 mcpegr.18.temperate_change:0 "或许珍馐本非[child.GetFirstNameNoTooltip]所好。"
 mcpe.19.t:0 "小贼入室"
 mcpe.19.d:0 "一名小贼潜入你的居室翻找财物，毁坏了不少东西。守卫很快将人拿住，押到你面前，听凭你发落。"
 mcpe.19.a:0 "汝所毁之物，须亲手修复。"
 mcpe.19.b:0 "定叫汝吃尽苦头！"
 mcpe.19.c:0 "发誓不再犯，便去罢。"
 mcpegr.19.d:0 "一名小贼闯入[child.GetTitledFirstNamePossessive]的居室，毁坏了不少财物。守卫将人拿住后，你问[child.GetFirstNameNoTooltip]当如何发落。\n\n"
 mcpegr.19.d_just:0 "[child.GetSheHe|U]认为，该让小贼亲手修补自己弄坏的东西。"
 mcpegr.19.d_sadistic:0 "[child.GetSheHe|U]只想让那小贼吃尽苦头。"
 mcpegr.19.d_forgiving:0 "[child.GetSheHe|U]愿意放那小贼离去，只要对方保证不再犯。"
 mcpegr.19.confirm_just:0 "罚当其罪，甚是公允。"
 mcpegr.19.confirm_sadistic:0 "正是，要叫他追悔莫及。"
 mcpegr.19.confirm_forgiving:0 "宽仁如此，难得。"
 mcpegr.19.just_change:0 "不可，刑罚须与罪相当！"
 mcpegr.19.sadistic_change:0 "不可，当叫他吃尽苦头！"
 mcpegr.19.forgiving_change:0 "不可，当以宽恕为怀！"
 mcpe.20.t:0 "挑选玩物"
 mcpe.20.d:0 "[guardian.GetTitledFirstName|U]带你去市上挑一件新玩物。摊上琳琅满目，看得你眼花缭乱，可只能挑一样。"
 mcpe.20.a:0 "这些俗物，哪配得上我！"
 mcpe.20.b:0 "我只要最贵的那件！"
 mcpe.20.c:0 "要那个！不，要这个！不不，还是那个！"
 mcpegr.20.d:0 "你带[child.GetTitledFirstName]去市上挑一件新玩物，并答应由[child.GetHerHim]自己选。\n\n"
 mcpegr.20.d_arrogant:0 "[child.GetSheHe|U]把摊子看了个遍，却说没有一样配得上自己。"
 mcpegr.20.d_greedy:0 "[child.GetSheHe|U]专挑了最贵重的一件，眼都不眨一下。"
 mcpegr.20.d_fickle:0 "[child.GetSheHe|U]迟迟拿不定主意，每见一件新玩物便改一次心思。"
 mcpegr.20.confirm_arrogant:0 "也罢，眼界高些无妨。"
 mcpegr.20.confirm_greedy:0 "[child.GetFirstNameNoTooltip|U]倒识得贵贱。"
 mcpegr.20.confirm_fickle:0 "多看几样，并无坏处。"
 mcpegr.20.arrogant_change:0 "[child.GetFirstNameNoTooltip|U]眼界该再高些！"
 mcpegr.20.greedy_change:0 "[child.GetFirstNameNoTooltip|U]当识得财货之贵！"
 mcpegr.20.fickle_change:0 "不妨多看几样，再作定夺。"
 mcpe.21.t:0 "巡行乡里"
 mcpe.21.d:0 "[guardian.GetTitledFirstName|U]带你巡视家中的封地，让你认一认这里的田亩与百姓。行程将尽时，[guardian.GetSheHe]问你还想去哪里看看。"
 mcpe.21.a:0 "我想同乡人说说话！"
 mcpe.21.b:0 "路人目光不善，速速回府。"
 mcpe.21.c:0 "不去了，今日已乏。"
 mcpegr.21.d:0 "你带[child.GetTitledFirstName]巡视家中的封地，让[child.GetHerHim]认一认这里的田亩与百姓。行程将尽时，你问[child.GetSheHe]还有什么打算。\n\n"
 mcpegr.21.d_gregarious:0 "[child.GetFirstNameNoTooltip|U]想同当地人聊聊，亲耳听听他们怎样过活。"
 mcpegr.21.d_paranoid:0 "[child.GetFirstNameNoTooltip|U]总疑心路人在暗中盯着你们，执意要立刻回府。"
 mcpegr.21.d_lazy:0 "[child.GetFirstNameNoTooltip|U]早已走乏了，只盼这趟巡视快些结束。"
 mcpegr.21.confirm_gregarious:0 "善，正该与乡人亲近。"
 mcpegr.21.confirm_paranoid:0 "谨慎些，总无大错。"
 mcpegr.21.confirm_lazy:0 "也好，回去歇着吧。"
 mcpegr.21.gregarious_change:0 "何不去与乡人谈谈？"
 mcpegr.21.paranoid_change:0 "出门在外，当多留个心眼！"
 mcpegr.21.lazy_change:0 "走了这许久，是该歇歇了。"
 mcpe.22.t:0 "天谴之说"
 mcpe.22.d:0 "近旁一直有人传言，说有个离群独居之人私下不敬鬼神，却始终拿不出凭据。前些日子，那人的屋舍失了火，众人都说这是报应。"
 mcpe.22.a:0 "此乃上天示警，慢神者戒！"
 mcpe.22.b:0 "仅凭流言，岂可轻视他人？"
 mcpe.22.c:0 "不论人言如何，都该助他重建。"
 mcpegr.22.d:0 "近旁一直有人指责某个独居之人不敬鬼神，却拿不出凭据。前些日子那人的屋舍失了火，[child.GetTitledFirstName]听说后对你说道：\n\n"
 mcpegr.22.d_zealous:0 "“这定是上天示警。那个慢神之人，终究遭了报应！”"
 mcpegr.22.d_humble:0 "“流言证明不了什么。我们不该自以为看透了别人的为人。”"
 mcpegr.22.d_compassionate:0 "“不管传言是真是假，我们都该帮这可怜人把屋子重新盖起来。”"
 mcpegr.22.confirm_zealous:0 "然，罪人自有其报！"
 mcpegr.22.confirm_humble:0 "然，不可轻视他人。"
 mcpegr.22.confirm_compassionate:0 "然，扶危济困，理所应当。"
 mcpegr.22.zealous_change:0 "[child.GetFirstNameNoTooltip|U]，天意岂容置疑！"
 mcpegr.22.humble_change:0 "其人品行如何，谁能断言？"
 mcpegr.22.compassionate_change:0 "当扶助这可怜之人！"
 mcpe.23.t:0 "提早散学"
 mcpe.23.d:0 "你正跟着师傅读书，窗外却传来别的孩子嬉闹的声音。师傅看出你心不在焉，便说今日可以早些散学，若有人问起，自有师傅担待。"
 mcpe.23.a:0 "多谢先生！"
 mcpe.23.b:0 "说好学完，便要学完。"
 mcpe.23.c:0 "不论先生许否，我自去便是。"
 mcpegr.23.d:0 "你看见几个孩子在外头嬉戏，而[child.GetTitledFirstName]此时本该随师傅读书。\n\n"
 mcpegr.23.d_trusting:0 "不多时，[child.GetSheHe]也跑去与他们玩在一处。事后师傅向你坦言，是自己提早散的课。"
 mcpegr.23.d_stubborn:0 "[child.GetSheHe|U]却始终没有离席。师傅事后告诉你，[child.GetFirstNameNoTooltip]执意要把当日的课上完，只因事先说好了。"
 mcpegr.23.d_arbitrary:0 "不多时，[child.GetSheHe]也跑去与他们玩在一处。师傅事后告诉你，[child.GetFirstNameNoTooltip]根本没有得到允许。"
 mcpegr.23.confirm_trusting:0 "偶尔早散一回，无妨。"
 mcpegr.23.confirm_stubborn:0 "善！言出必行，[child.GetFirstNameNoTooltip]！"
 mcpegr.23.confirm_arbitrary:0 "[child.GetFirstNameNoTooltip|U]去留，何须他人应允？"
 mcpegr.23.trusting_change:0 "[child.GetFirstNameNoTooltip|U]该向先生告假再走！"
 mcpegr.23.stubborn_change:0 "[child.GetFirstNameNoTooltip|U]该把课上完！"
 mcpegr.23.arbitrary_change:0 "[child.GetFirstNameNoTooltip|U]想走便走就是！"
 mcpe.24.t:0 "一梦为君"
 mcpe.24.d:0 "你刚从一场梦中醒来。梦里，你是坐拥广土的一方雄主，而最叫你难以忘怀的是……"
 mcpe.24.a:0 "……那无上的权柄与敬畏。"
 mcpe.24.b:0 "……那数不尽的金帛财货。"
 mcpe.24.c:0 "……百姓安居乐业的笑颜。"
 mcpegr.24.d:0 "[child.GetTitledFirstName|U]告诉你，[child.GetSheHe]梦见自己成了坐拥广土的一方雄主。\n\n"
 mcpegr.24.d_ambitious:0 "[child.GetSheHe|U]最念念不忘的是梦里的权柄与敬畏，还盼着有朝一日能够成真。"
 mcpegr.24.d_greedy:0 "[child.GetSheHe|U]最念念不忘的是梦里数不尽的财货，还盼着有朝一日尽归己有。"
 mcpegr.24.d_compassionate:0 "[child.GetSheHe|U]最难忘的是百姓安居乐业的景象，也盼着世间真能如此。"
 mcpegr.24.confirm_ambitious:0 "权柄，正值得一争。"
 mcpegr.24.confirm_greedy:0 "财货，正值得一求。"
 mcpegr.24.confirm_compassionate:0 "百姓安乐，最值得求。"
 mcpegr.24.ambitious_change:0 "当求者，权柄也！"
 mcpegr.24.greedy_change:0 "当求者，财货也！"
 mcpegr.24.compassionate_change:0 "当求者，百姓安乐也！"
 mcpe.25.t:0 "暗处的目光"
 mcpe.25.d:0 "近来，总有一名寻常的[child.Custom('servant_for_romance')]远远地偷看你，一被你察觉便慌忙躲开。莫非有人暗中倾慕于你？"
 mcpe.25.a:0 "如此殷勤，我甚是受用！"
 mcpe.25.b:0 "这般窥看，令人不快。"
 mcpe.25.c:0 "……怕不是要来害我。"
 mcpegr.25.d:0 "你发现一名寻常的[child.Custom('servant_for_romance')]常在暗中注视[child.GetTitledFirstName]，一被察觉便躲开。看来[child.GetFirstNameNoTooltip]有了一位倾慕者。\n\n"
 mcpegr.25.d_lustful:0 "[child.GetSheHe|U]似乎颇为享受这份殷勤。"
 mcpegr.25.d_chaste:0 "这般窥看让[child.GetHerHim]浑身不自在。"
 mcpegr.25.d_paranoid:0 "[child.GetSheHe|U]却认定这不是倾慕，而是有人图谋加害自己。"
 mcpegr.25.confirm_lustful:0 "有何不可？受用便是。"
 mcpegr.25.confirm_chaste:0 "理当如此，此举失礼。"
 mcpegr.25.confirm_paranoid:0 "然，人不可貌相。"
 mcpegr.25.lustful_change:0 "受用便是，何必拘谨！"
 mcpegr.25.chaste_change:0 "此等诱惑，当断然拒之！"
 mcpegr.25.paranoid_change:0 "当多为自身安危着想！"
 mcpe.26.t:0 "私出府门"
 mcpe.26.d:0 "几个孩子撺掇你偷偷溜出府去，到野外独自待上一阵，说这样才算证明你不靠护卫也能照料自己——只看你有没有这个胆子。"
 mcpe.26.a:0 "有何不敢？外头又吓不倒我！"
 mcpe.26.b:0 "不带护卫出门？太凶险，不去！"
 mcpe.26.c:0 "去便去，暗中再叫护卫跟着。"
 mcpegr.26.d:0 "昨日，你遍寻不见[child.GetTitledFirstName]。最后有人说，曾看见[child.GetHerHim]和几个孩子结伴，似是一道溜出了府。\n\n"
 mcpegr.26.d_brave:0 "今日，[child.GetFirstNameNoTooltip]与那些孩子平安归来。众人都在夸[child.GetHerHis]胆大，还四处说起这番历险。"
 mcpegr.26.d_craven:0 "今日，你在一只旧衣箱里找到了[child.GetFirstNameNoTooltip]。原来[child.GetSheHe]怕外头凶险，根本没跟着去。"
 mcpegr.26.d_deceitful:0 "今日，[child.GetFirstNameNoTooltip]与那些孩子平安归来。护卫随后告诉你，[child.GetSheHe]早就暗中吩咐他们一路尾随。"
 mcpegr.26.confirm_brave:0 "哈！[child.GetFirstNameNoTooltip|U]果然天不怕地不怕！"
 mcpegr.26.confirm_craven:0 "[child.GetFirstNameNoTooltip|U]懂得避祸，不错。"
 mcpegr.26.confirm_deceitful:0 "既显胆色，又不涉险，聪明。"
 mcpegr.26.brave_change:0 "[child.GetFirstNameNoTooltip|U]当拿出胆色来！"
 mcpegr.26.craven_change:0 "[child.GetFirstNameNoTooltip|U]当远离祸事！"
 mcpegr.26.deceitful_change:0 "[child.GetFirstNameNoTooltip|U]，随口扯个谎便是！"
 mcpe.27.t:0 "家仆之丧"
 mcpe.27.d:0 "府中一位忠心的老仆过世了。丧礼上，你看着这熟悉的人就此离去，头一回认真想到：无论贵贱，人终有一死。"
 mcpe.27.a:0 "……若无神灵护佑，人不过尘土。"
 mcpe.27.b:0 "……权势荣华，到头皆空。"
 mcpe.27.c:0 "……这丧礼又闷又烦。"
 mcpegr.27.d:0 "府中一位忠心的老仆过世了。丧礼上，[child.GetTitledFirstName]若有所思，你便问[child.GetHerHim]如何看待生死。\n\n"
 mcpegr.27.d_zealous:0 "[child.GetSheHe|U]说，人生短暂，若无神灵指引便毫无意义，唯有虔信方能找到归宿。"
 mcpegr.27.d_content:0 "[child.GetSheHe|U]说，人既终有一死，权势与荣华便不值得穷尽一生去追逐。"
 mcpegr.27.d_callous:0 "[child.GetSheHe|U]只觉得丧礼又闷又烦，反正死者也不会在意有没有人陪着。"
 mcpegr.27.confirm_zealous:0 "所言甚是，[child.GetFirstNameNoTooltip|U]。"
 mcpegr.27.confirm_content:0 "然，权势荣华皆过眼云烟。"
 mcpegr.27.confirm_callous:0 "所见略同。何苦在那里枯站？"
 mcpegr.27.zealous_change:0 "丧葬乃是大礼，岂可轻忽！"
 mcpegr.27.content_change:0 "权势荣华，终是过眼云烟！"
 mcpegr.27.callous_change:0 "区区丧礼，何须在意？"
 mcpe.28.t:0 "货郎登门"
 mcpe.28.d:0 "一个走南闯北的货郎来到府中，向你兜售异域的吃食、玩物和符箓，每件都配上一段惊险的来历。[guardian.GetTitledFirstName]赶来时，货郎正问你看中了哪样。"
 mcpe.28.a:0 "这吃食看着好香，我要尝尝！"
 mcpe.28.b:0 "我要那枚神奇的护身符！"
 mcpe.28.c:0 "我可不傻，这些鬼话骗不了我。"
 mcpegr.28.d:0 "一个货郎来到府中，向[child.GetTitledFirstName]兜售各色异域货物，还讲了不少离奇故事。\n\n"
 mcpegr.28.d_gluttonous:0 "[child.GetSheHe|U]对那些神秘符箓毫无兴趣，眼睛始终盯着异域的吃食。"
 mcpegr.28.d_trusting:0 "[child.GetSheHe|U]信了货郎的故事，央你买下一枚据说来自远方的护身符。"
 mcpegr.28.d_cynical:0 "[child.GetSheHe|U]看穿了货郎的吹嘘，断定那些所谓的神效全是骗人的。"
 mcpegr.28.confirm_gluttonous:0 "吃得好些，有何不可！"
 mcpegr.28.confirm_trusting:0 "好，随你心意。"
 mcpegr.28.confirm_cynical:0 "[child.GetFirstNameNoTooltip|U]可不是好骗的。"
 mcpegr.28.gluttonous_change:0 "[child.GetFirstNameNoTooltip|U]，尝尝那吃食吧！"
 mcpegr.28.trusting_change:0 "何不收下那枚护身符？"
 mcpegr.28.cynical_change:0 "这等鬼话，你也信？"
 mcpe.29.t:0 "客中之谢"
 mcpe.29.d:0 "一户远道而来的旅人借住府中。他们的孩子找到你，一本正经地问，该如何报答这几日的款待。"
 mcpe.29.a:0 "待客本是主人之责，不必言谢。"
 mcpe.29.b:0 "那便替我做些杂活吧？"
 mcpe.29.c:0 "……为、为何找我说话？"
 mcpegr.29.d:0 "一户远道而来的旅人借住府中。他们的孩子找到[child.GetTitledFirstName]，问该如何报答府上的款待。\n\n"
 mcpegr.29.d_just:0 "[child.GetFirstNameNoTooltip|U]说，款待旅人本是主人的本分，不必另行报答。"
 mcpegr.29.d_lazy:0 "[child.GetFirstNameNoTooltip|U]请对方替自己做了几件杂活。"
 mcpegr.29.d_shy:0 "[child.GetFirstNameNoTooltip|U]不知如何应答，此后便一直躲在自己房里。"
 mcpegr.29.confirm_just:0 "然，本该如此。"
 mcpegr.29.confirm_lazy:0 "嗯，让他们搭把手也无妨……"
 mcpegr.29.confirm_shy:0 "且让[child.GetHerHim]独自静一静。"
 mcpegr.29.just_change:0 "待客之道，本是我等之责！"
 mcpegr.29.lazy_change:0 "不妨让他们替我们做些杂活。"
 mcpegr.29.shy_change:0 "我们可不愿被人搅扰！"
 mcpe.30.t:0 "向学之诺"
 mcpe.30.d:0 "师傅提醒你，你曾答应在学业上多下功夫，可近来仍不见长进。或许是师傅教得不好，可许下承诺的毕竟是你。"
 mcpe.30.a:0 "那句承诺，我已不在意了。"
 mcpe.30.b:0 "也罢，再多学些。言出须行。"
 mcpe.30.c:0 "尔自无能，安敢归咎于我？！"
 mcpegr.30.d:0 "[child.GetTitledFirstName|U]曾答应师傅要更加用功，可近来仍不见长进。你想知道[child.GetSheHe]如何看待这个承诺，便亲自去问。\n\n"
 mcpegr.30.d_arbitrary:0 "[child.GetSheHe|U]早已不把当初的承诺放在心上。"
 mcpegr.30.d_diligent:0 "[child.GetSheHe|U]仍看重当初的承诺，决意今后更加勤勉。"
 mcpegr.30.d_wrathful:0 "[child.GetSheHe|U]把过错全推给师傅，认定是对方无能，才让自己的学业毫无长进。"
 mcpegr.30.confirm_arbitrary:0 "有些承诺，本就当破。"
 mcpegr.30.confirm_diligent:0 "甚好，[child.GetFirstNameNoTooltip|U]，坚持下去。"
 mcpegr.30.confirm_wrathful:0 "此怒情有可原。"
 mcpegr.30.arbitrary_change:0 "那句承诺，何必在意？"
 mcpegr.30.diligent_change:0 "言出必行，接着用功！"
 mcpegr.30.wrathful_change:0 "那庸师误你，你竟不恼？"
 mcpe.31.t:0 "流言蜚语"
 mcpe.31.d.no_bully_fallback:0 "有个孩子一直在背后散布关于你的恶毒流言。或许是想引人注目，又或许是出于嫉妒，可无论缘由如何，事情终究已经发生。"
 mcpe.31.d.bully:0 "[bully.GetTitledFirstName|U]一直在背后散布关于你的恶毒流言。或许[bully.GetSheHe]是想引人注目，又或许是出于嫉妒，可无论缘由如何，事情终究已经发生。"
 mcpe.31.a:0 "……换个境遇，我们本可为友。"
 mcpe.31.b:0 "……辱我者，不论何故，必付代价。"
 mcpe.31.c:0 "……下人如何看我，与我何干。"
 mcpegr.31.d.no_bully_fallback:0 "有个孩子一直在散布关于[child.GetTitledFirstName]的恶毒流言。[child.GetFirstNameNoTooltip]觉得，对方或许是想引人注目，又或许是出于嫉妒。\n\n"
 mcpegr.31.d.bully:0 "[bully.GetTitledFirstName|U]一直在散布关于[child.GetTitledFirstName]的恶毒流言。[child.GetFirstNameNoTooltip]觉得，[bully.GetFirstNameNoTooltip]或许是想引人注目，又或许是出于嫉妒。\n\n"
 mcpegr.31.d_forgiving:0 "[child.GetSheHe|U]觉得这般行径着实可怜，也不愿为此长久记恨对方。"
 mcpegr.31.d_vengeful:0 "[child.GetSheHe|U]不管对方出于何故，只知道冒犯自己的人必须付出代价。"
 mcpegr.31.d_arrogant:0 "[child.GetSheHe|U]根本没把流言放在心上，在[child.GetSheHe]看来，远不如自己的人不值得理会。"
 mcpegr.31.confirm_forgiving:0 "正是，可惜了一段交情。"
 mcpegr.31.confirm_vengeful:0 "不错，要叫他们付出代价。"
 mcpegr.31.confirm_arrogant:0 "然，何必理会他们。"
 mcpegr.31.forgiving_change:0 "你们本可结为好友！"
 mcpegr.31.vengeful_change:0 "绝不容任何人轻慢于你！"
 mcpegr.31.arrogant_change:0 "下人之言，何须挂怀？"
 mcpe.32.t:0 "饥童窃食"
 mcpe.32.d:0 "市上，你看见一个衣衫褴褛的孩子躲在货堆后，趁人不备偷了些吃食。[guardian.GetTitledFirstName|U]也瞧见了，正等着看你怎么说。"
 mcpe.32.a:0 "当告知商贩，此子行窃！"
 mcpe.32.b:0 "寻到那孩子，收为己用。"
 mcpe.32.c:0 "给这可怜孩子些吃食吧！"
 mcpegr.32.d:0 "市上，你看见一个衣衫褴褛的孩子趁人不备偷了些吃食。[child.GetTitledFirstName|U]也瞧见了，对你说道：\n\n"
 mcpegr.32.d_honest:0 "“该让那商贩知道是谁偷了东西。”"
 mcpegr.32.d_ambitious:0 "“只要找到那孩子，拿些吃食就能让他替我们办事。”"
 mcpegr.32.d_generous:0 "“我们该给那孩子些吃食，免得他再去偷。”"
 mcpegr.32.confirm_honest:0 "然，窃贼须得拿住。"
 mcpegr.32.confirm_ambitious:0 "好主意，[child.GetFirstNameNoTooltip|U]。"
 mcpegr.32.confirm_generous:0 "善，那便周济他些。"
 mcpegr.32.honest_change:0 "当让商贩知道是谁偷的！"
 mcpegr.32.ambitious_change:0 "何不让那孩子为我们效力？"
 mcpegr.32.generous_change:0 "不，给那可怜孩子些吃食吧！"
 mcpe.33.t:0 "学种花木"
 mcpe.33.d:0 "你近来跟着学种花木，可亲手照料的苗子迟迟不见长高。师傅说草木自有时节，但在你看来，这不过是漫长又无趣的等待。"
 mcpe.33.a:0 "无聊至极，我没工夫耗在这上头。"
 mcpe.33.b:0 "不必为此烦心。"
 mcpe.33.c:0 "侍弄花草，便已知足。"
 mcpegr.33.d:0 "[child.GetTitledFirstName|U]近来跟着学种花木，可亲手照料的苗子迟迟不见长高。你同[child.GetHerHim]说起此事时，[child.GetSheHe]道：\n\n"
 mcpegr.33.d_impatient:0 "“太无趣了，我可没工夫一直等下去！”"
 mcpegr.33.d_calm:0 "“不必着急。谁也不可能一下子学会所有事情。”"
 mcpegr.33.d_content:0 "“侍弄花草就已经很叫人满足了，真不明白人们为何还要去追逐权势与荣华。”"
 mcpegr.33.confirm_impatient:0 "也好，那便做些别的。"
 mcpegr.33.confirm_calm:0 "然，这并无可耻之处。"
 mcpegr.33.confirm_content:0 "然，知足常乐。"
 mcpegr.33.impatient_change:0 "何必在这上头虚耗光阴。"
 mcpegr.33.calm_change:0 "不必为此烦心。"
 mcpegr.33.content_change:0 "如今可知争权逐利之无谓了？"
 mcpe.34.t:0 "校场歇息"
 mcpe.34.d:0 "你看士卒们在校场上操练了一上午。午间歇息时，你决定上前同他们说几句话。"
 mcpe.34.a:0 "讲些新奇有趣的故事！"
 mcpe.34.b:0 "诸位辛苦，我甚敬佩！"
 mcpe.34.c:0 "休得偷懒，接着操练！"
 mcpegr.34.d:0 "[child.GetTitledFirstName|U]看士卒们操练了一上午。午间歇息时，[child.GetSheHe]主动上前与他们攀谈。\n\n"
 mcpegr.34.d_gregarious:0 "[child.GetSheHe|U]与士卒们你一言我一语地讲起故事，很快便和众人打成一片。"
 mcpegr.34.d_humble:0 "[child.GetSheHe|U]感谢士卒们守护众人，这番称许让他们颇为受用。"
 mcpegr.34.d_sadistic:0 "[child.GetSheHe|U]喝令士卒们不许偷懒、接着操练，惹得众人满腹怨气。"
 mcpegr.34.confirm_gregarious:0 "讲讲故事，自是乐事。"
 mcpegr.34.confirm_humble:0 "敬重士卒，甚好。"
 mcpegr.34.confirm_sadistic:0 "听见[child.GetHerHim]的话了，都回去操练！"
 mcpegr.34.gregarious_change:0 "[child.GetFirstNameNoTooltip|U]当学着与人往来！"
 mcpegr.34.humble_change:0 "[child.GetFirstNameNoTooltip|U]当敬重士卒！"
 mcpegr.34.sadistic_change:0 "[child.GetFirstNameNoTooltip|U]当喝止他们偷懒！"
 mcpe.35.t:0 "人微言轻"
 mcpe.35.d:0 "大人们总拿你年纪小作由头，不肯认真听你说话。你早已受够了这般轻视，也该想个法子叫他们改观。"
 mcpe.35.a:0 "欲人以成人待我，当先有成人之态。"
 mcpe.35.b:0 "我喊得够响，他们便不得不听！"
 mcpe.35.c:0 "何必着急，待我长成，自然无事。"
 mcpegr.35.d:0 "[child.GetTitledFirstName|U]不满大人们总拿年纪小作由头轻看[child.GetHerHim]。思量许久后，[child.GetSheHe]对你说：\n\n"
 mcpegr.35.d_temperate:0 "“若想让他们把我当大人看，我得先有个大人的样子。”"
 mcpegr.35.d_stubborn:0 "“只要我嗓门够大，他们迟早得听我的！”"
 mcpegr.35.d_patient:0 "“这事急不得。等我长大了，自然就不成问题了。”"
 mcpegr.35.confirm_temperate:0 "然，当有成人之态。"
 mcpegr.35.confirm_stubborn:0 "然，正是如此。"
 mcpegr.35.confirm_patient:0 "然，不必忧心。"
 mcpegr.35.temperate_change:0 "你也该有个大人样了！"
 mcpegr.35.stubborn_change:0 "只管放声去说便是！"
 mcpegr.35.patient_change:0 "再等些时日便是！"
 tradition_hd_mcpe_dummy_name:0 "MCPE兼容参数"
 tradition_hd_mcpe_dummy_desc:0 "供儿童性格事件系统使用的隐藏兼容定义。"
