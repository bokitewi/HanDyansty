l_simp_chinese:
 hd_dc_roy_end.0001.t: "争位落幕"
 hd_dc_enthronement_support_opinion: "曾拥立新君"
 hd_dc_faithful_royal_opinion: "守约不渝"
 hd_dc_roy_end.0001.enthroned: "登殿那日，你看见熟悉的宗亲立在御座两旁。有些人曾为你奔走，有些人直到兵戈止息，才肯承认眼前的结果。\n\n这一回改换天命，凭的是沙场上的胜负，争位之战也已平息。可把天下交到你手里的人，都还记得当初说过的话——今日可以践祚，旧日的许诺，却不能就此当作已经兑现。"
 hd_dc_roy_end.0001.defended: "最后一封战报送到了案前：宗亲兴起的争位之战已经落败，你仍坐在原来的位子上。\n\n御座保住了，宗庙里的裂痕却不会自己弥合。军中、家中和诏书里留下的事，还得一件件料理。那些没有附逆的宗亲，也不该只因同姓，便被夺去封地。"
 hd_dc_roy_end.0001.a: "胜负已定，旧诺容后清理。"
 hd_dc_roy_end.0002.t: "宫城传来的消息"
 hd_dc_roy_end.0002.enthroned: "宫城传来了新君践祚的消息。与这场争位相连的战事已经结束，御座换了主人。\n\n对你来说，这不是一句轻巧的了结。从前说过的话、站过的队，以及尚未兑现的承诺，都不会随着新颁的诏令一笔勾销。"
 hd_dc_roy_end.0002.defended: "朝廷保住了御座，争位之战已经结束。可宗庙里的座次与亲疏，不是一纸战报能够写定的。\n\n你做过什么，便要承担什么；同姓之人，也并非人人都作了同一个选择。"
 hd_dc_roy_end.0002.a: "且观其后行止。"
