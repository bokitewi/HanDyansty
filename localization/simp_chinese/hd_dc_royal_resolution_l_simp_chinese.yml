l_simp_chinese:
 hd_dc_roy_end.0001.t: "殿上的人，案上的账"
 hd_dc_enthronement_support_opinion: "曾拥立新君"
 hd_dc_faithful_royal_opinion: "守约得到了认可"
 hd_dc_roy_end.0001.enthroned: "登殿时，我看见熟悉的宗亲站在御座两旁。有些人曾替我奔走，有些人直到战事结束才肯承认眼前的结果。\n\n这一次换君已有真实战果为据，相关争位战争也已结束。但把天下交到我手里的人，仍记得此前说过的话。今日可以记下践祚，还不能把旧承诺一并写成已经兑现。"
 hd_dc_roy_end.0001.defended: "最后一份战报送到案前。宗亲发动的争位战争已经落败，我仍坐在原来的位置。\n\n御座保住了，宗庙里的分歧却不会因此自动消失。军中、家中和诏书上留下的事情，仍须一件件处理。没有参战的宗亲，也不该只因同姓便被夺去封地。"
 hd_dc_roy_end.0001.a: "战果据实记下，承诺另行核验。"
 hd_dc_roy_end.governance_pending_tt: "只记录已发生的政治结果，并解除本实例的急性危机占位。不会再次转移头衔、释放封臣或发放和平奖励；治理终奖另查真实战争、履约、稳定期及毁约记录。"
 hd_dc_roy_end.0002.t: "从宫城传来的结语"
 hd_dc_roy_end.0002.enthroned: "宫城传来了新君践祚的消息。先前与这场争位相连的战争已经结束，御座的主人也因战果而改变。\n\n对我而言，这不是一句轻巧的结语。此前说过的话、站过的位置，以及仍有待履行的承诺，都没有随新诏令消失。"
 hd_dc_roy_end.0002.defended: "朝廷保住了御座，相关争位战争已经结束。宗庙中的座次和亲疏，却不是战报能够一次写定的。\n\n我仍要按自己实际做过的事承担结果；同姓并不意味着人人都作了同一个选择。"
 hd_dc_roy_end.0002.a: "此后，还要看他们如何行事。"
