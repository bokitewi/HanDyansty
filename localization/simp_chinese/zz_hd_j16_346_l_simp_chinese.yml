l_simp_chinese:
 hd_j16.1001.t:0 "东宫之变"
 hd_j16.1001.desc:0 "邺城传出骇人的消息：太子石宣遣刺客夜入佛寺，杀死了同母弟、秦公石韬。[hd_news_a.GetName]悲愤交加，下令车裂石宣，连东宫僚属一并诛灭，改立幼子石世为储。\n\n赵国的储位一夜之间落到一个十岁孩童手里。宗室诸王各怀心思，边将们也开始掂量：天王年事已高，这个国家还能撑多久。"
 hd_j16.1002.t:0 "东宫血案"
 hd_j16.1002.desc:0 "秦公石韬死在佛寺里，刀痕犹新。审讯的人回报说，凶手是东宫的人，主使正是太子石宣。宫中都在等你的话：他是你亲手立的储君，如今却杀了你最宠爱的儿子。\n\n你可以照律处置，也可以另立长子，甚至可以装作不知道。无论哪一种，邺城的人都会记住你今天的决定。"
 hd_j16.1002.a:0 "车裂石宣，改立幼子石世为储。"
 hd_j16.1002.b:0 "处置石宣，立年长的石遵为储。"
 hd_j16.1002.c:0 "韬已死，宣不可再失。宽宥太子。"
 hd_j16.1003.t:0 "东宫之谋"
 hd_j16.1003.desc:0 "父王越来越偏爱石韬，赏赐、兵权、宅第都向他倾斜，朝中已有人私下议论储位将易。宿卫杨杯愿为你冒死，只等你一句话：趁石韬夜宿佛寺，取他的性命。\n\n事成之后，父王必定震怒。你可以赌一把，也可以继续忍下去，等那一天自己到来。"
 hd_j16.1003.a:0 "遣杨杯夜入佛寺。"
 hd_j16.1003.b:0 "隐忍不发。"
 hd_j16.1004.t:0 "即皇帝位"
 hd_j16.1004.desc:0 "你以天王之号统御河北、关中已十余年，群臣联名上表，请你正位称帝，改元太宁。邺城的宫殿早已按帝制营建，缺的只是一道诏书。"
 hd_j16.1004.a:0 "即皇帝位，改元太宁。"
 hd_j16.1004.b:0 "天王之号足矣。"
 hd_j16.1005.t:0 "石虎称帝"
 hd_j16.1005.desc:0 "[hd_news_a.GetName]在邺城即皇帝位，改元太宁。赵国去天王之号，正式与建康的晋室分庭抗礼。人们注意到，新帝登坛时已病容满面。"
 hd_j16.1010.t:0 "李城举兵"
 hd_j16.1010.desc:0 "[hd_news_a.GetName]与诸将会于李城，以清君侧为名回师邺城，废黜年幼的[hd_news_b.GetName]，自立为主。太后刘氏与辅政的张豺相继被杀。\n\n石虎死去不过一月，他的儿子们已经开始互相刀兵。"
 hd_j16.1011.t:0 "石遵兵临邺城"
 hd_j16.1011.desc:0 "兄长石遵带着讨伐梁犊归来的大军驻在城外，扬言要诛张豺、清君侧。城中守军人心浮动，辅政大臣们已经在打点退路。\n\n你还太小，能做的选择不多：开门让位，或许可以保全性命；闭门拒守，就是骨肉相残的内战。"
 hd_j16.1011.a:0 "开城逊位，以保全性命。"
 hd_j16.1011.b:0 "闭城拒之！"
 hd_j16.1012.t:0 "李城之议"
 hd_j16.1012.desc:0 "诸将在李城劝你回师邺城：张豺专权，幼主不足以守国，只要你振臂一呼，邺城的门会自己打开。冉闵、李农都已表示愿为前驱。"
 hd_j16.1012.a:0 "回师邺城，废幼主自立，以冉闵掌兵。"
 hd_j16.1012.b:0 "不可，仍奉幼主。"
 hd_j16.1015.t:0 "蓟城之议"
 hd_j16.1015.desc:0 "石遵在邺城废立自专，蓟城的僚佐劝你起兵讨逆：你镇守幽州，兵马不弱，若迟疑下去，下一个被收拾的就是你。"
 hd_j16.1015.a:0 "起兵讨遵！"
 hd_j16.1015.b:0 "奉表称贺，静观其变。"
 hd_j16.1020.t:0 "宫中异动"
 hd_j16.1020.desc:0 "有人密报，义阳王石鉴近来与冉闵往来频繁，宫中宿卫多是冉闵的旧部。你曾许冉闵太子之位而未兑现，他的怨气满朝皆知。\n\n先下手除掉冉闵，石鉴便无兵可用；但冉闵手握禁兵，一旦失手，后果难料。"
 hd_j16.1020.a:0 "先诛冉闵！"
 hd_j16.1020.b:0 "冉闵不过一介武夫，不足为虑。"
 hd_j16.1021.t:0 "琨华殿之谋"
 hd_j16.1021.desc:0 "石遵猜忌日深，冉闵已暗中许诺：只要你点头，宿卫今夜便可入宫。你若取而代之，赵国就是你的；若再等下去，石遵的刀迟早落到你头上。"
 hd_j16.1021.a:0 "就在今夜。"
 hd_j16.1021.b:0 "兄弟相残，于心不忍。"
 hd_j16.1025.t:0 "石鉴弑遵"
 hd_j16.1025.desc:0 "[hd_news_a.GetName]借冉闵的宿卫杀死了[hd_news_b.GetName]，在邺城即位。半年之间，赵国已三易其主，真正握着兵权的，是那位不姓石的将军。"
 hd_j16.1030.t:0 "杀胡令"
 hd_j16.1030.desc:0 "孙伏都率羯士攻入宫中，被你击退。城中胡汉相疑已到极点，诸将请你下令：凡胡人敢持兵者，杀无赦；能斩胡首者，文官进位三等，武职悉拜牙门。\n\n这道令一出，邺城内外再无回头路。"
 hd_j16.1030.a:0 "下令，内外六夷敢称兵杖者斩！"
 hd_j16.1030.b:0 "只诛孙伏都一党。"
 hd_j16.1031.t:0 "邺城杀胡"
 hd_j16.1031.desc:0 "[hd_news_a.GetName]在邺城下令诛杀胡羯，一日之间死者数万。依附赵国的氐、羌各部闻讯，或拥众西归，或据地自守，石氏的天下已四分五裂。"
 hd_j16.1040.t:0 "围攻襄国"
 hd_j16.1040.desc:0 "石祗在襄国称帝，遣使四出求援。诸将请趁其羽翼未丰，发兵围城，一举荡平石氏余孽。"
 hd_j16.1040.a:0 "进围襄国！"
 hd_j16.1040.b:0 "暂且按兵。"
 hd_j16.1041.t:0 "襄国求援"
 hd_j16.1041.desc:0 "石祗的使者到了你的帐前，言辞恳切：冉闵若破襄国，下一个便是燕。愿去帝号，称赵王，以求援兵。"
 hd_j16.1041.a:0 "遣悦绾率军救赵。"
 hd_j16.1041.b:0 "坐观二虎相斗。"
 hd_j16.1045.t:0 "襄国称尊"
 hd_j16.1045.desc:0 "邺城已落入冉闵之手，石氏宗亲与旧臣纷纷投奔襄国。他们推你为主，请你即皇帝位，延续大赵的国统。"
 hd_j16.1045.a:0 "即皇帝位，以续赵祚。"
 hd_j16.1045.b:0 "称赵王，不敢僭越。"
 hd_j16.1046.t:0 "石祗称帝"
 hd_j16.1046.desc:0 "[hd_news_a.GetName]在襄国即帝位，与邺城的冉闵相持。河北从此一地两主，城池之间只剩刀兵。"
 hd_j16.1050.t:0 "刘显弑主"
 hd_j16.1050.desc:0 "襄国大将[hd_news_a.GetName]率军回城，杀死了[hd_news_b.GetName]，将首级送往邺城，向冉闵请降。石氏在河北的最后一点国统，断送在自家将军手里。"
 hd_j16.1051.t:0 "刘显复叛"
 hd_j16.1051.desc:0 "刘显降而复叛，据襄国自称尊号。诸将请再出兵，彻底了结这桩反复无常的祸患。"
 hd_j16.1051.a:0 "讨平刘显！"
 hd_j16.1051.b:0 "暂且容他。"
 hd_j16.1110.t:0 "廉台之议"
 hd_j16.1110.desc:0 "冉闵四处征战，兵力日疲，正在中山一带就食。慕容恪请率精骑南下，以铁锁连马结成方阵，与他决战。"
 hd_j16.1110.a:0 "遣慕容恪讨冉闵！"
 hd_j16.1110.b:0 "冉闵骁勇，不可轻战。"
 hd_j16.1111.t:0 "廉台之战"
 hd_j16.1111.desc:0 "[hd_news_a.GetName]的大军在廉台击败了[hd_news_b.GetName]。冉闵十战十胜之后，终于力竭被擒，押往龙城。邺城只剩他的儿子和一座孤城。"
 hd_j16.1112.t:0 "燕军压城"
 hd_j16.1112.desc:0 "燕军已经到了邺城之下，城中粮尽，人相食。蒋干劝你死守待晋援，也有人劝你开城请降，保全宗族。"
 hd_j16.1112.a:0 "开城出降，归附燕国。"
 hd_j16.1112.b:0 "死守邺城！"
 hd_j16.1113.t:0 "进围邺城"
 hd_j16.1113.desc:0 "冉闵已擒，邺城只剩他的儿子冉智与蒋干守着。诸将请乘胜进围，一举收取河北的心脏。"
 hd_j16.1113.a:0 "进围邺城！"
 hd_j16.1113.b:0 "暂且罢兵休整。"
 hd_j16.1114.t:0 "燕克邺城"
 hd_j16.1114.desc:0 "[hd_news_a.GetName]的军队攻入邺城，冉魏覆亡。传国玉玺随蒋干南奔建康，而河北的宫阙换上了慕容氏的旗帜。"
 hd_j16.1120.t:0 "元玺之议"
 hd_j16.1120.desc:0 "燕军已据有幽冀，群臣上表：石氏、冉氏相继覆亡，中原无主，请你即皇帝位，改元元玺，不必再向江东称臣。"
 hd_j16.1120.a:0 "即皇帝位，改元元玺。"
 hd_j16.1120.b:0 "仍称燕王。"
 hd_j16.1121.t:0 "慕容儁称帝"
 hd_j16.1121.desc:0 "[hd_news_a.GetName]即皇帝位，改元元玺，并对晋使说：「汝还白汝天子，我承人乏，为中国所推，已为帝矣。」燕国从此不再奉晋正朔。"
 hd_j16.1125.t:0 "据青州"
 hd_j16.1125.desc:0 "赵国大乱，青州无主。部众劝你据广固自立，称齐王，同时上表建康，奉晋正朔，以为外援。"
 hd_j16.1125.a:0 "据广固，称齐王。"
 hd_j16.1125.b:0 "仍奉赵命。"
 hd_j16.1126.t:0 "段龛据齐"
 hd_j16.1126.desc:0 "鲜卑段部的[hd_news_a.GetName]据广固，自称齐王，并遣使向晋称藩。青州成了燕、晋之间又一块必争之地。"
 hd_j16.1130.t:0 "广固之役"
 hd_j16.1130.desc:0 "段龛据广固称齐，屡与燕军争地。慕容恪请率军东征，围城而不急攻，以待其困。"
 hd_j16.1130.a:0 "遣慕容恪围广固！"
 hd_j16.1130.b:0 "青州偏远，暂且不问。"
 hd_j16.1135.t:0 "迁都邺城"
 hd_j16.1135.desc:0 "邺城宫阙宏丽，扼河北之要。群臣请你自蓟迁都于此，以示燕国已居中原之主。"
 hd_j16.1135.a:0 "迁都邺城。"
 hd_j16.1135.b:0 "仍都蓟城。"
 hd_j16.1140.t:0 "西取洛阳"
 hd_j16.1140.desc:0 "晋军守洛阳的兵力单薄，慕容恪请率军西进，夺取这座旧都。拿下洛阳，燕国的疆界便与关中的秦相接。"
 hd_j16.1140.a:0 "取洛阳！"
 hd_j16.1140.b:0 "洛阳残破，取之无益。"
 hd_j16.1150.t:0 "猜忌"
 hd_j16.1150.desc:0 "枋头之战后，你的威名盖过了朝中所有人，而太傅慕容评和可足浑太后正在商议除掉你。世子慕容令劝你出奔：秦王苻坚礼贤下士，必能相容。\n\n留下来，你可以在朝中自辩，但未必有人听；走出去，你就成了燕国的叛臣。"
 hd_j16.1150.a:0 "带上令儿，西奔秦国。"
 hd_j16.1150.b:0 "留下自辩，问心无愧。"
 hd_j16.1151.t:0 "吴王之功"
 hd_j16.1151.desc:0 "慕容垂在枋头大破晋军，声望如日中天。太傅慕容评与太后却屡次进言，说他功高难制，请早作处置。"
 hd_j16.1151.a:0 "功高震主，不可不防。"
 hd_j16.1151.b:0 "国之干城，委以兵柄。"
 hd_j16.1152.t:0 "慕容垂奔秦"
 hd_j16.1152.desc:0 "燕国名将[hd_news_a.GetName]带着儿子投奔了长安。苻坚亲自出郊迎接，待以上宾之礼。王猛却在一旁沉默不语。"
 hd_j16.1205.t:0 "三秦王"
 hd_j16.1205.desc:0 "赵国崩解，关中无主。部众劝你自称大单于、三秦王，西归关中，另立基业。也有人劝你遣使建康，接受晋室的封号。"
 hd_j16.1205.a:0 "自称三秦王！"
 hd_j16.1205.b:0 "遣使降晋，受其封号。"
 hd_j16.1206.t:0 "苻洪称三秦王"
 hd_j16.1206.desc:0 "氐人首领[hd_news_a.GetName]在枋头自称大单于、三秦王，准备率部众西归关中。"
 hd_j16.1210.t:0 "兄长苻法"
 hd_j16.1210.desc:0 "你已登上大位，可母亲苟太后放心不下兄长苻法：他是庶长子，素有人望，宾客盈门。她已经命人赐死，只等你点头。"
 hd_j16.1210.a:0 "母命难违。"
 hd_j16.1210.b:0 "力保兄长性命。"
 hd_j16.1215.t:0 "皇始之议"
 hd_j16.1215.desc:0 "关中已定，群臣请你去天王之号，即皇帝位，改元皇始，与东晋、燕国并立。"
 hd_j16.1215.a:0 "即皇帝位，改元皇始。"
 hd_j16.1215.b:0 "仍称天王。"
 hd_j16.1216.t:0 "苻健称帝"
 hd_j16.1216.desc:0 "[hd_news_a.GetName]在长安即皇帝位，国号大秦。关中自此有了一个新的朝廷。"
 hd_j16.1220.t:0 "北海王景略"
 hd_j16.1220.desc:0 "吕婆楼向你推荐一位隐居华阴的寒士王猛，说他胸有经纬，桓温曾邀他南归而不就。你召他一谈，竟如刘备之遇孔明。"
 hd_j16.1220.a:0 "拜为中书侍郎，委以机要。"
 hd_j16.1220.b:0 "寒门之士，不宜骤用。"
 hd_j16.1225.t:0 "并州张平"
 hd_j16.1225.desc:0 "张平据并州，在燕、秦之间反复依违。诸将请出兵讨伐，收其部众，他帐下有个养子张蚝，号称万人之敌。"
 hd_j16.1225.a:0 "讨伐张平！"
 hd_j16.1225.b:0 "暂且羁縻。"
 hd_j16.1230.t:0 "四公之乱"
 hd_j16.1230.desc:0 "苻柳据蒲阪，苻双据上邽，苻廋据陕城，苻武据安定，四公同时举兵。王猛请你速发大军，各个击破；也有人劝你念骨肉之情，遣使招抚。"
 hd_j16.1230.a:0 "发兵讨伐！"
 hd_j16.1230.b:0 "遣使招抚，许以不死。"
 hd_j16.1250.t:0 "山桑之谋"
 hd_j16.1250.desc:0 "殷浩猜忌你，屡遣刺客，又想夺你的部众。如今他亲率大军北伐，必经山桑。部将劝你设伏截击，一雪前耻。"
 hd_j16.1250.a:0 "伏兵山桑，袭殷浩！"
 hd_j16.1250.b:0 "仍守盟约。"
 hd_j16.1251.t:0 "父亲的遗言"
 hd_j16.1251.desc:0 "父亲姚弋仲临终前叮嘱你：我本以晋室大乱，石氏待我厚，故为之尽力；石氏既灭，你当归晋，勿为不义之事。部众在等你的决定。"
 hd_j16.1251.a:0 "遵父遗命，遣使归晋。"
 hd_j16.1251.b:0 "拥兵自守。"
 hd_j16.1255.t:0 "三原之役"
 hd_j16.1255.desc:0 "姚襄率羌众西入关中，进屯杏城，扬言要夺回先人旧地。邓羌、苻黄眉请率军迎击于三原。"
 hd_j16.1255.a:0 "迎击姚襄！"
 hd_j16.1255.b:0 "坚壁不战。"
 hd_j16.1280.t:0 "北伐之议"
 hd_j16.1280.desc:0 "石虎新死，河北大乱，北方遗民纷纷南来。徐兖二州的将士请出兵彭城，接应遗民，收复故土。"
 hd_j16.1280.a:0 "出兵北伐！"
 hd_j16.1280.b:0 "时机未至。"
 hd_j16.1282.t:0 "收复许洛"
 hd_j16.1282.desc:0 "胡人自相残杀，许昌、洛阳一带守备空虚。朝廷属意以中军将军北伐，收复旧都，以挫桓温在上游的声势。"
 hd_j16.1282.a:0 "北伐许洛！"
 hd_j16.1282.b:0 "兵者凶器，不可轻举。"
 hd_j16.1283.t:0 "北伐败归"
 hd_j16.1283.desc:0 "北伐大败，辎重尽失。桓温上疏弹劾殷浩，请废为庶人。朝中议论纷纷，都在看你如何处置。"
 hd_j16.1283.a:0 "废殷浩为庶人。"
 hd_j16.1283.b:0 "胜败乃兵家常事，宽宥之。"
 hd_j16.1284.t:0 "咄咄怪事"
 hd_j16.1284.desc:0 "北伐大败，桓温上疏弹劾你，朝廷有意废你为庶人，徙居东阳。你可以俯首认罪，也可以据扬州不受诏。"
 hd_j16.1284.a:0 "认罪，交还扬州。"
 hd_j16.1284.b:0 "抗命不受。"
 hd_j16.1285.t:0 "殷浩被废"
 hd_j16.1285.desc:0 "北伐败归的[hd_news_a.GetName]被废为庶人，徙居东阳。据说他终日以手指在空中写字，人们凑近一看，写的是「咄咄怪事」四字。朝中再也没有人能与桓温抗衡了。"
 hd_j16.1286.t:0 "西伐关中"
 hd_j16.1286.desc:0 "苻健新据关中，根基未稳。荆州诸将请自武关西出，直捣长安。"
 hd_j16.1286.a:0 "西伐苻秦！"
 hd_j16.1286.b:0 "关中险远，不宜劳师。"
 hd_j16.1287.t:0 "扪虱而谈"
 hd_j16.1287.desc:0 "军至灞上，有个穿着粗布短衣的书生来营中求见，一面捉着身上的虱子，一面纵谈天下大势，旁若无人。他叫王猛，北海人。你问他三秦豪杰为何不来相见，他答：您不渡灞水去取长安，百姓不知您的心意。"
 hd_j16.1287.a:0 "邀他随军南归。"
 hd_j16.1287.b:0 "狂生而已。"
 hd_j16.1288.t:0 "录尚书事"
 hd_j16.1288.desc:0 "桓温上疏请求北伐，又讽朝廷加授他侍中、大司马、都督中外诸军事、录尚书事。他手握荆扬之兵，满朝公卿无人敢说一个不字。"
 hd_j16.1288.a:0 "加授，以安其心。"
 hd_j16.1288.b:0 "政出于朝，不可假人。"
 hd_j16.1289.t:0 "加授之诏"
 hd_j16.1289.desc:0 "朝廷的诏书到了：加授你侍中、大司马、都督中外诸军事，录尚书事。从此内外大权都在你一身。"
 hd_j16.1289.a:0 "受命。"
 hd_j16.1289.b:0 "辞让不受。"
 hd_j16.1290.t:0 "枋头之议"
 hd_j16.1290.desc:0 "慕容恪已死，燕国朝政落在贪鄙的慕容评手里。将士们请自姑孰北上，经金乡、枋头直抵邺城，一举收复河北。"
 hd_j16.1290.a:0 "大举北伐！"
 hd_j16.1290.b:0 "粮道难继，暂缓。"
 hd_j16.1291.t:0 "桓温秉政"
 hd_j16.1291.desc:0 "[hd_news_a.GetName]加侍中、大司马、都督中外诸军事、录尚书事。天子垂拱于建康宫中，政令都出自大司马府。"
 hd_j16.1292.t:0 "燕使求援"
 hd_j16.1292.desc:0 "晋军大举北伐，燕国遣使求救，许以虎牢以西之地。王猛说：燕若亡于晋，晋势将不可当；不如出兵救之，待其两败，再作打算。"
 hd_j16.1292.a:0 "遣苟池、邓羌救燕。"
 hd_j16.1292.b:0 "坐观成败。"
 hd_j16.1293.t:0 "枋头之败"
 hd_j16.1293.desc:0 "晋军在枋头粮尽而退，[hd_news_a.GetName]率骑兵追至襄邑，大破晋军，斩首三万。桓温的威名一落千丈，而战胜者的名字，从此让燕国的权贵坐立不安。"
 hd_j16.1294.t:0 "国本之议"
 hd_j16.1294.desc:0 "你的身体每况愈下，群臣上表，请早定储君，以安社稷。按礼法，皇位当传给你的兄弟或族中长者。"
 hd_j16.1294.a:0 "朕知道了。"
 hd_j16_346_army_zhao_name:0 "赵军"
 hd_j16_346_army_wei_name:0 "魏军"
 hd_j16_346_army_yan_name:0 "燕军"
 hd_j16_346_army_qin_name:0 "秦军"
 hd_j16_346_army_jin_name:0 "晋军"
 hd_j16_346_army_qiang_name:0 "羌骑"
 hd_j16_beifen_modifier:0 "悲愤"
 hd_j16_beifen_modifier_desc:0 "一日之间失去两个儿子，忧愤成疾。"
 hd_j16_shahu_modifier:0 "杀胡令"
 hd_j16_shahu_modifier_desc:0 "胡汉之间已成血仇，同族者奋勇相从，异族者无不切齿。"
 hd_j16_xiezhu_modifier:0 "挟主"
 hd_j16_xiezhu_modifier_desc:0 "废立之事都在其手，威势日盛，旁人侧目。"
 hd_j16_b4_jin_fanchen_modifier:0 "奉晋正朔"
 hd_j16_b4_jin_fanchen_modifier_desc:0 "遥奉建康的晋室为正统，以示不忘中国。"
 hd_j16_qiangbu_modifier:0 "羌部"
 hd_j16_qiangbu_modifier_desc:0 "率领烧当羌的部众，人人善战。"
 hd_j16_shansang_modifier:0 "山桑之败"
 hd_j16_shansang_modifier_desc:0 "在山桑遭到伏击，辎重尽失，军心离散。"
 hd_j16_wangmeng_de_modifier:0 "得王景略"
 hd_j16_wangmeng_de_modifier_desc:0 "得到王猛辅佐，如鱼之有水。"
 hd_j16_wanrendi_modifier:0 "万人敌"
 hd_j16_wanrendi_modifier_desc:0 "勇冠三军，号称万人之敌。"
 hd_j16_dudu_zhongwai_modifier:0 "都督中外"
 hd_j16_dudu_zhongwai_modifier_desc:0 "朝中再无掣肘，内外兵权尽在掌握。"
 hd_j16_murong_ping_zhuanquan_modifier:0 "慕容评专权"
 hd_j16_murong_ping_zhuanquan_modifier_desc:0 "太傅慕容评专擅朝政，贪鄙无度，府库日空，人心离散。"
 hd_j16_fangtou_ru_modifier:0 "枋头之辱"
 hd_j16_fangtou_ru_modifier_desc:0 "枋头大败，威名受挫。"
 hd_j16_donggong_opinion:0 "东宫之变"
 hd_j16_chanjian_opinion:0 "谗间"
 hd_j16_chui_trusted_opinion:0 "委以兵柄"
 hd_j16_sigong_pardon_opinion:0 "赦免之恩"
 hd_j16_sigong_lenient_opinion:0 "姑息养奸"
 hd_j16_yinhao_restraint_opinion:0 "按兵不动"
 hd_j16_yinhao_timid_opinion:0 "畏缩不前"
 hd_j16_yinhao_defiant_opinion:0 "抗命不受"
 hd_j16_huanwen_rebuffed_opinion:0 "拒授大权"
 hd_j16_mensi_opinion:0 "扪虱之谈"
 dynn_title_hd_j16_qi:0 "齐"
 dynn_title_hd_j16_qi_adj:0 "齐"
 hd_j16.1006.t:0 "托孤之臣"
 hd_j16.1006.desc:0 "你已病入膏肓，储君石世年方十一。石世外家的旧人张豺在榻前侍奉汤药，屡次进言：幼主即位，须有老成之臣镇抚内外，他愿以死相报。\n\n他是你的老将，也是幼主的外戚。把朝政交给他，幼主有了依靠；可邺城的诸王未必服他。"
 hd_j16.1006.a:0 "以张豺为镇卫大将军，辅佐幼主。"
 hd_j16.1006.b:0 "朝政自有安排，不必专委一人。"
 hd_j16.1013.t:0 "邺城内战"
 hd_j16.1013.desc:0 "[hd_news_b.GetName]闭城拒守，不肯让位。[hd_news_a.GetName]自李城举兵，诸将与冉闵为前驱，兵锋直指邺城。\n\n石虎的灵柩尚未下葬，他的儿子们已在都城下兵戎相见。"
 hd_j16.1016.t:0 "蓟城起兵"
 hd_j16.1016.desc:0 "镇守幽州的[hd_news_a.GetName]不服邺城的废立，传檄远近，率众南下讨伐[hd_news_b.GetName]。邺城急遣冉闵、李农北上迎击。\n\n石氏兄弟的刀，又一次指向了自家人。"
 hd_j16.1022.t:0 "石鉴起兵"
 hd_j16.1022.desc:0 "宫中之谋败露，[hd_news_a.GetName]索性举兵自立，与[hd_news_b.GetName]公然决裂。赵国再陷内战，诸将观望，手握禁兵的冉闵态度暧昧。"
 hd_j16.1155.t:0 "太原王恪"
 hd_j16.1155.desc:0 "你自知时日无多，太子慕容暐尚在冲龄。群臣都看向你的弟弟、太原王慕容恪：他屡建大功，为人谦退，军中无不敬服。\n\n你可以把幼子与国事托付给他，也可以另作安排。"
 hd_j16.1155.a:0 "以国事托付太原王。"
 hd_j16.1155.b:0 "朕自有安排。"
 hd_j16.1156.t:0 "太傅慕容评"
 hd_j16.1156.desc:0 "太原王慕容恪去世了，满朝失去了主心骨。叔祖、太傅慕容评资望最高，又得太后信任，请求总揽朝政。可他贪鄙好财，人所共知。\n\n把朝政交给他，省你操心，却难免府库空虚、人心离散；自己揽过来，又要得罪这位宗室长辈。"
 hd_j16.1156.a:0 "委政于太傅。"
 hd_j16.1156.b:0 "朕当亲理朝政。"
 hd_j16_ping_slighted_opinion:0 "见疏"
