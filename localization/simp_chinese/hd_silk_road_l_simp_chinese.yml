 # 四个实际局势子区域
 silk_road_situation_sub_region_region_silk_road_eastern_section:0 "东段"
 silk_road_situation_sub_region_region_silk_road_eastern_section_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak 商旅自长安西行，历河西武威、张掖、酒泉、敦煌四郡，出玉门关或阳关而入西域。丝帛、良马与新知，岁岁往来于此道。#!"
 silk_road_situation_sub_region_region_silk_road_middle_northern_route:0 "中段北道"
 silk_road_situation_sub_region_region_silk_road_middle_northern_route_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak 北道自楼兰起行，傍北山南麓西去，历尉犁、乌垒、轮台、龟兹、姑墨，终至疏勒。#!"
 silk_road_situation_sub_region_region_silk_road_middle_southern_route:0 "中段南道"
 silk_road_situation_sub_region_region_silk_road_middle_southern_route_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak 南道自楼兰傍南山北麓西行，历且末、精绝、扞弥、于阗、皮山、莎车，终至疏勒。#!"
 silk_road_situation_sub_region_region_silk_road_western_section:0 "西段"
 silk_road_situation_sub_region_region_silk_road_western_section_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak 南北二道会于疏勒，西逾葱岭，商队由此进入大宛的城郭与市镇。#!"

 # 四座可访问市场
 visit_silk_road_market_decision_loulan:0 "$building_uuii_loulan_market_01$ #weak （[GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_middle_northern_route').MakeScope.Var('innovation').CultureInnovationType.GetName]）#!"
 visit_silk_road_market_decision_khotan:0 "$building_uuii_khotan_market_01$ #weak （[GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_middle_southern_route').MakeScope.Var('innovation').CultureInnovationType.GetName]）#!"
 visit_silk_road_market_decision_dayuan:0 "$building_uuii_dayuan_market_01$ #weak （[GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_western_section').MakeScope.Var('innovation').CultureInnovationType.GetName]）#!"

 building_type_uuii_loulan_market_01:0 "$building_uuii_loulan_market_01$"
 building_type_uuii_loulan_market_01_desc:0 "$building_uuii_loulan_market_01_desc$"
 building_uuii_loulan_market_01:0 "楼兰市集"
 building_uuii_loulan_market_01_desc:0 "楼兰城临蒲昌海西北，当西域南北二道分途之处。出玉门而来的驼队在此饮水歇脚、整备行装，再各自取道西行。"
 building_uuii_loulan_market_02:0 "繁盛的楼兰市集"
 building_uuii_loulan_market_02_desc:0 "楼兰城外邸舍栉比，井泉与驿舍环市而立，东来西往的商旅终年不绝。"
 building_uuii_loulan_market_01_destination_desc:0 "[GetBuilding('uuii_loulan_market_01').GetName]聚集着将走北道或南道的商队，驼铃声、议价声与胡汉杂语昼夜不息。"

 building_type_uuii_khotan_market_01:0 "$building_uuii_khotan_market_01$"
 building_type_uuii_khotan_market_01_desc:0 "$building_uuii_khotan_market_01_desc$"
 building_uuii_khotan_market_01:0 "于阗市集"
 building_uuii_khotan_market_01_desc:0 "于阗城郭倚昆仑之麓，以美玉、丝帛与南道商贸闻名。远方诸国的贾客在此交换货物，也交换见闻。"
 building_uuii_khotan_market_02:0 "繁盛的于阗市集"
 building_uuii_khotan_market_02_desc:0 "于阗市集扩至数条街巷，琢玉作坊、货栈与客舍日夜迎送穿越流沙而来的商旅。"
 building_uuii_khotan_market_01_destination_desc:0 "[GetBuilding('uuii_khotan_market_01').GetName]陈列着昆仑美玉、丝帛与异域香料，是南道上最为耀眼的商埠。"

 building_type_uuii_dayuan_market_01:0 "$building_uuii_dayuan_market_01$"
 building_type_uuii_dayuan_market_01_desc:0 "$building_uuii_dayuan_market_01_desc$"
 building_uuii_dayuan_market_01:0 "大宛市集"
 building_uuii_dayuan_market_01_desc:0 "越过葱岭的商队在大宛重新集结。汗血良马、铁器、葡萄酒与东来的丝帛，在这里的城邑间辗转易手。"
 building_uuii_dayuan_market_02:0 "繁盛的大宛市集"
 building_uuii_dayuan_market_02_desc:0 "大宛市集已是葱岭以西商路上的一大都会，宽阔的货场上停满驮队，马商与远客在此议定下一段行程。"
 building_uuii_dayuan_market_01_destination_desc:0 "[GetBuilding('uuii_dayuan_market_01').GetName]以良马和翻越葱岭的远途贸易著称，汉地与康居、安息的货物在此交汇。"
