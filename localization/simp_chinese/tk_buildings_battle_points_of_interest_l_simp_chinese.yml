l_simp_chinese:

 #####三国新增建筑战场本地化

 BattlePoIHistoricalNameZhuoLu: "涿鹿之战"
 BattlePoIHistoricalDescZhuoLu: "#emp 胜者：黄帝\n败者：蚩尤\n日期：黄帝之时#!\n#weak 蚩尤作乱，不用帝命，黄帝于是征发诸侯之师，与蚩尤战于涿鹿之野，终将蚩尤擒杀。\n\n诸侯由此共尊黄帝为天子，代神农氏而有天下。#!"
 BattlePoIHistoricalNameMingTiao: "鸣条之战"
 BattlePoIHistoricalDescMingTiao: "#emp 胜者：商汤\n败者：夏桀\n日期：夏桀之末#!\n#weak 夏桀荒淫无道，百姓怨叛；商汤得伊尹辅佐，修德行仁，诸侯纷纷归附。汤举兵伐桀，两军战于鸣条之野，夏师大败。\n\n桀出奔南巢，汤遂代夏而有天下。#!"
 BattlePoIHistoricalNameChangShao: "长勺之战"
 BattlePoIHistoricalDescChangShao: "#emp 胜者：鲁庄公\n败者：齐桓公\n日期：鲁庄公十年#!\n#weak 齐桓公即位之初，因鲁国曾助公子纠争位，次年便兴兵伐鲁。鲁人曹刿请见庄公，随军至长勺，待齐人三通鼓罢方才进击，齐师败绩。\n\n曹刿说：“夫战，勇气也。一鼓作气，再而衰，三而竭。”此战以弱胜强，向为兵家所称道。#!"
 BattlePoIHistoricalNameChangPing: "长平之战"
 BattlePoIHistoricalDescChangPing: "#emp 胜者：秦昭王\n败者：赵孝成王\n日期：秦昭王四十七年#!\n#weak 秦攻韩国上党，上党守冯亭举郡降赵，秦赵两军由此在长平对峙。赵将廉颇坚壁不出，赵王中了秦人的反间之计，以赵括代之；赵括轻出求战，被白起断绝粮道，团团围困。\n\n赵卒断粮四十六日，终于降秦，四十余万人尽被坑杀，赵国自此一蹶不振。#!"
 BattlePoIHistoricalNameGaiXia: "垓下之战"
 BattlePoIHistoricalDescGaiXia: "#emp 胜者：汉王\n败者：项羽\n日期：汉五年#!\n#weak 楚汉约定以鸿沟为界，项羽引兵东归。张良、陈平劝汉王趁楚军疲惫追击，汉王会合韩信、彭越诸军，将项羽重重围困于垓下。\n\n项羽兵败，自刎于乌江，天下由此归汉。#!"
 BattlePoIHistoricalNameKunYang: "昆阳之战"
 BattlePoIHistoricalDescKunYang: "#emp 胜者：汉军\n败者：王莽军\n日期：更始元年#!\n#weak 王莽遣大司空王邑、司徒王寻率大军围攻昆阳，城中诸将惶恐欲散。光武皇帝时为偏将军，力劝诸将固守，自己突围出城征集援兵。\n\n援兵既至，光武亲率敢死之士冲击敌阵，城中守军鼓噪而出，内外夹击，王寻战死，莽军大溃。天下由此纷纷响应，王莽不久便覆亡了。#!"


