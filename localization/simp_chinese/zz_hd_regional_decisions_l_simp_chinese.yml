l_simp_chinese:
 hd_repair_shu_roads_decision: "修缮蜀道"
 hd_repair_shu_roads_decision_desc: "蜀地群山横绝，栈道常因雨雪与兵燹损毁。拨付钱帛，征发工匠，可择一条要道重新修治。"
 hd_repair_shu_roads_decision_tooltip: "选择一条位于你领地内的蜀道，花费#V 1000#!金币，使当地获得持续三十年的道路增益。"
 hd_repair_shu_roads_decision_confirm:0 "修治蜀道"
 hd_tuntian_tazhong_decision: "屯田沓中"
 hd_tuntian_tazhong_decision_desc: "沓中谷地可耕可守。若修渠筑仓，使军民相杂而居，既可供给边军，也能渐成沃野。"
 hd_tuntian_tazhong_decision_tooltip: "花费#V 1200#!金币，使沓中获得持续三十年的屯田增益；再次执行会刷新期限而不会叠加数值。"
 hd_tuntian_tazhong_decision_confirm:0 "开渠屯田"
 hd_consume_wushisan_decision: "服用五石散"
 hd_consume_wushisan_decision_desc: "药末在盏中泛起细白的光。医者说它能使精神畅快、形神俱散——至少在药力消退以前如此。"
 hd_consume_wushisan_decision_tooltip: "服下五石散以缓解压力，并在两年内陷入药后昏沉。"
 hd_consume_wushisan_decision_confirm:0 "服散"

 hd_repaired_shu_road_modifier: "蜀道修缮"
 hd_repaired_shu_road_modifier_desc: "栈道、桥梁与沿途驿站已经整修，军旅和行人得以安全通行。"
 hd_tazhong_tuntian_modifier: "沓中屯田"
 hd_tazhong_tuntian_modifier_desc: "军户修渠垦殖，谷物就近入仓，使这片边地同时承担耕作与军需。"
 hd_satisfied_nanman_modifier: "满意的蛮族"
 hd_satisfied_nanman_modifier_desc: "本地首领得到承认，部众暂时愿意向新秩序缴纳贡赋并提供兵员。"
 hd_inward_migration_modifier: "外族内迁"
 hd_inward_migration_modifier_desc: "新迁入的部众带来了牲畜、劳力与善战之士，也重新开垦了荒废土地。"

 hd_regional_decisions.10.t: "散发"
 hd_regional_decisions.10.desc:0 "服散之后，积在胸中的烦闷似乎渐渐退远，身边人的话也像隔着一层帷幕。方才反复思量的难处，此刻竟暂时抓不住我的心神。\n\n我扶着案沿起身，才发觉指尖有些发颤，脚下也不像平日那样稳妥。那份轻快来得突然，并没有替我办完一件公务，更没有使案上那些文书自行消失。\n\n左右见我神色稍缓，便不再催问。我让他们先退下，披衣缓行。眼前的忧思可以暂歇，这副身体却仍须承受药后留下的不适，不能当作什么也没有发生。"
 hd_regional_decisions.10.a: "且披衣徐行，任药力散去。"

 hd_regional_decisions.100.t: "六道入蜀"
 hd_regional_decisions.100.desc:0 "蜀道修缮的图籍铺满案前，坏损之处都另作了标记。我顺着一条路看到尽头，尚未问话，书吏已将木石、役夫与钱粮所需递了过来。\n\n一段栈道在图上不过寸许，真要修好，却不知要让多少人负重入山。六条道路各有来报，谁都说自己那一处最急；府库的钱却不能随这些急字一同增多。\n\n我把图角压住，叫他们先停一停。这次选哪一条、付出一千金修缮，或暂且搁下，都须我定。再让他们齐声说下去，怕是连案前这点空地也要堵死了。"
 hd_regional_decisions.100.a: "修缮米仓道"
 hd_regional_decisions.100.b: "修缮关城道"
 hd_regional_decisions.100.c: "修缮褒斜道"
 hd_regional_decisions.100.d: "修缮两当、陈仓道"
 hd_regional_decisions.100.e: "修缮子午道"
 hd_regional_decisions.100.f: "修缮傥骆道"
 hd_regional_decisions.100.cancel: "此事暂且缓议。"

 hd_pacify_nanman_decision: "安抚南蛮"
 hd_pacify_nanman_decision_desc: "宁州山川阻隔，旧日郡县之名未必能服众。若承认一位本地首领，以部落旧俗治理其乡土，或可换来数十年的安定。"
 hd_pacify_nanman_decision_tooltip: "从你亲自持有的宁州法理公国中选择一处，册立一名直属部落公爵。每个公国只能安抚一次，成功后冷却五年。"
 hd_pacify_nanman_decision_confirm:0 "因俗而治"
 hd_nanman_acceptance_gain: "安抚南蛮"
 hd_regional_decisions.200.t: "因俗而治"
 hd_regional_decisions.200.desc:0 "南方诸郡的来人等在堂下，译者说一句，他们便彼此交换一眼。问到治理之事，几位首领忽然都安静了，仿佛终于谈到他们真正等着的一句话。\n\n若授一地使其依旧俗治众，往后许多官署难以直接料理的事，便可另有着落。可是哪一郡先行，印信交到谁手里，我还须从眼前列出的地方中定下一处。\n\n我没有催译者继续，先看向案上的名单。同是点一次头，落在不同名字之后，堂下的神色大概也会全然不同。此刻仍可缓议，不必让所有人都误以为已得了允诺。"
 hd_regional_decisions.200.yunnan: "册立云南本地首领"
 hd_regional_decisions.200.jianning: "册立建宁本地首领"
 hd_regional_decisions.200.zangke: "册立牂柯本地首领"
 hd_regional_decisions.200.wuling: "册立武陵本地首领"
 hd_regional_decisions.200.fuling: "册立涪陵本地首领"
 hd_regional_decisions.200.yuexi: "册立越巂本地首领"
 hd_regional_decisions.200.bajun: "册立巴郡本地首领"
 hd_regional_decisions.200.yongchang: "册立永昌本地首领"
 hd_regional_decisions.200.cancel: "此议关系重大，容后再定。"

 hd_move_foreign_peoples_inward_decision: "外族内迁"
 hd_move_foreign_peoples_inward_decision_desc:0 "塞外诸部请求携牲畜与家眷入境。在他们的安置地授予一县，使其首领成为直属封臣，既可充实荒地，也能从中征募善战之士。只是胡人聚居，日后未必安分。"
 hd_move_foreign_peoples_inward_decision_tooltip:0 "选择一个胡族，再从该族安置区内自己或直属封臣的非首都伯爵领中选择封地（发展度从低到高）。该伯爵领的文化与信仰改为该胡族的。成功后冷却十年。"
 hd_move_foreign_peoples_inward_decision_confirm:0 "接见塞外来使"
 hd_regional_decisions.300.t: "塞外来客"
 hd_regional_decisions.300.desc:0 "北方诸部的来使接连求见，刚报完首领的名号，便问内迁之众可安顿在哪里。我叫译者先别急，将各家的来意分开说清。\n\n匈奴、鲜卑、羯、氐、羌与乌桓，部属多少、旧日往来、所习语言都不相同。席间却总有人只说一个“胡”字，仿佛这样便省去了后面所有安排。\n\n我让书吏将几份来书依次摊开。先决定接纳哪一方，再议实际授出的县土；若眼下不宜，也可到此止住。堂下那些盼望的眼神，不能替我把这一步选过去。"
 hd_regional_decisions.300.xiongnu: "准许匈奴部众内迁"
 hd_regional_decisions.300.xianbei: "准许鲜卑部众内迁"
 hd_regional_decisions.300.qiang: "准许羌人部众内迁"
 hd_regional_decisions.300.jieren:0 "准许羯人部众内迁"
 hd_regional_decisions.300.diren:0 "准许氐人部众内迁"
 hd_move_foreign_peoples_inward_decision_effect_tt:0 "选择要接纳的胡族与安置的伯爵领。若割让直属封臣的伯爵领，该封臣好感 -20（五年）"
 hd_regional_decisions.300.wuhuan: "准许乌桓部众内迁"
 hd_regional_decisions.300.cancel: "边地尚未准备妥当。"
 hd_regional_decisions.310.t: "择地安置"
 hd_regional_decisions.310.desc:0 "接纳哪一方已经定下，书吏紧接着问：“授哪一县？”他将该族旧日聚居之地、由我或直属封臣治理而又不作首府的县列了出来，方才尚显得从容的一句话，顿时有了沉甸甸的去处。\n\n我沿名单看下去，每一个县名都牵着原有住民与官吏。若是从封臣手里割出来，那位封臣心里也不会痛快。迁来的人要安顿，附近的人也要知道往后向谁听令。\n\n笔停在案边，来人还等着回报。我可以选定一地交付，也可以暂缓授土。"
 hd_regional_decisions.310.a: "将[scope:hd_migration_county_1.GetNameNoTier]授予他们"
 hd_regional_decisions.310.b: "将[scope:hd_migration_county_2.GetNameNoTier]授予他们"
 hd_regional_decisions.310.c: "将[scope:hd_migration_county_3.GetNameNoTier]授予他们"
 hd_regional_decisions.310.d: "将[scope:hd_migration_county_4.GetNameNoTier]授予他们"
 hd_regional_decisions.310.e: "将[scope:hd_migration_county_5.GetNameNoTier]授予他们"
 hd_regional_decisions.310.f: "将[scope:hd_migration_county_6.GetNameNoTier]授予他们"
 hd_regional_decisions.310.g: "将[scope:hd_migration_county_7.GetNameNoTier]授予他们"
 hd_regional_decisions.310.h: "将[scope:hd_migration_county_8.GetNameNoTier]授予他们"
 hd_regional_decisions.310.cancel: "暂不授土。"

 hd_explore_far_west_decision: "探索极西"
 hd_explore_far_west_decision_desc: "凉州商旅传来层层转述的消息：越过葱岭与无数城邦，在日落之处尚有自称大秦的国度。组织一支使团，或能把那里的人与见闻带回东方。"
 hd_explore_far_west_decision_tooltip: "花费#V 1500#!金币派出一支为期约五年的极西使团。成功前可以重试；全世界只能成功一次。"
 hd_explore_far_west_decision_confirm:0 "遣使西行"
 hd_regional_decisions.400.t: "向日落之地"
 hd_regional_decisions.400.desc:0 "西行使团的行装已经齐备，译者在临行前又核了一遍所携文书。来告别的人把沿途道路指给我看，说到更远处时，却只能凭旧日商旅的转述。\n\n我问清粮资与接应安排，嘱咐他们将亲见与听闻分别记下。向西每过一处关津，文字、礼俗与道路都会有所不同；远方国名可以传得很响，真正能够带回来的见闻，却得靠一程程走过去。\n\n使团启程以后，案前不会很快再有他们的回书。我将留存的路线图收好，等下一回来自西方的消息。"
 hd_regional_decisions.400.a: "持节西去，将所见所闻带回来。"
 hd_regional_decisions.401.t: "流沙断粮"
 hd_regional_decisions.401.desc:0 "西行使团的回报送到，封边已磨得起毛。风沙坏了原定行程，粮水也难按旧额支撑；读到求援之处，我才将文书拿近些。\n\n他们在路上遇到的是缺水，送到我案前便成了二百金。出这笔钱，可以就地补足所需；不出，就得让使团另算现有粮资，靠调度撑过这一程。\n\n我把路线图展开，手指却只能停在报讯所标的地方。人在那么远处，口渴与疲惫都不能由我代受，回书却仍得由我决定怎样写。"
 hd_regional_decisions.401.safe: "再拨二百金，就地采买粮水。"
 hd_regional_decisions.401.risk: "依照既定粮册分队穿越。"
 hd_regional_decisions.402.t: "诸城关津"
 hd_regional_decisions.402.desc:0 "使团刚过粮水之难，又被一处商路城邑拦住。来信说当地索要厚礼，译者交涉许久，对方仍只肯把同一番话重复一遍。\n\n我读到索价，忍不住将文书翻回前面，再看是否真非过此不可。二百金足以换得这一关稳妥通行；若舍不得，便只能让使者凭国书与言辞继续争取。\n\n出发时议的是远方见闻，如今却总在问下一处门要用多少钱推开。我将信放平。是再付一笔，还是相信使团能把话说通，总须给那群候在城外的人一个答复。"
 hd_regional_decisions.402.safe: "拨二百金，依礼赠予当地首领。"
 hd_regional_decisions.402.risk: "让译者陈明国书，不受无名之税。"
 hd_regional_decisions.403.t: "陌生文字"
 hd_regional_decisions.403.desc:0 "同一个地名，竟被向导指向两条路。使团的回报把争议并列写来，读到后面，我也只能对着旧图皱眉，哪一条都不像可以轻易划去的错笔。\n\n再拨二百金，可以延请通晓当地文字与道路的人核实；若不愿添费，便由使团凭现有学识比勘，自担认错的风险。\n\n我将两份记述放在一处，忽然很想叫那个最先画图的人来问问。可案前无人知道远处的路，能做的仍是选定一种办法，把回书送出去。"
 hd_regional_decisions.403.safe: "拨二百金，延请当地学者。"
 hd_regional_decisions.403.risk: "比对旧图与口述，继续向西。"
 hd_regional_decisions.404.t: "大秦来客"
 hd_regional_decisions.404.desc:0 "多年之后，使团终于带着新的见闻归来。同行的远方学者被引到我面前，行装尚带旅尘，谈起商路与海岸，却说得比许多旧图更有条理。\n\n我请译者慢些，把能够亲证的事情一件件记清。那些从前只在转述中出现的名字，如今终于有人能说明它们之间怎样通行、当地人怎样生活。\n\n学者愿留下共事，所携文字也可继续校读。我命人先为远客安顿住处。此次西行得来的不该只是一个值得夸耀的远方国名，而是能够在往后真正使用的见闻。"
 hd_regional_decisions.404.a: "为这位远客备席。"
 hd_regional_decisions.409.t: "西使不返"
 hd_regional_decisions.409.desc:0 "归来的使者没有先报喜，只将残存的记录放下。我等了片刻，他才说，西去的行程已经无法继续。\n\n纸上还写着尚未到达的地方，后面却没有新的记述。沿途的挫折终于耗尽余地，能够回来的，只有眼前这些人和这几卷文书。我问到几处经过，他答得很慢，每次停顿都比名字更难听清。\n\n我将记录收在一边。钱粮已经花去，远路也确实走过，可原定的使命仍未完成。这次西行，到此便只能收住了。"
 hd_regional_decisions.409.a: "整顿记录，日后可以再遣使团。"

 hd_explore_yizhou_decision: "探索夷州"
 hd_explore_yizhou_decision_desc: "会稽海民传说，东南大海之外尚有广阔岛屿。建造海船、招募熟悉潮汐的人，或可让朝廷第一次得到可信的夷州航路。"
 hd_explore_yizhou_decision_tooltip: "花费#V 800#!金币派出一支为期约两年的船队。成功前可以重试；全世界只能成功一次。"
 hd_explore_yizhou_decision_confirm:0 "扬帆出海"
 hd_regional_decisions.500.t: "帆出会稽"
 hd_regional_decisions.500.desc:0 "出海的船队已经整装，领航者最后一次核对沿岸标记与回程的约定。送来的起航回报上，写满了船只、粮水与随行之人的名数。\n\n我将他们所知的海路问清，更远的方向却仍有许多空白。夷州之名早有传闻，真正怎样抵达、何处可以停泊，不能只靠岸上听来的几句说法。\n\n这次远航既已开始，我嘱他们沿途留记，不把猜测写成亲见。往后消息往返不会迅速，船上遇到的难处，也只能凭先前准备与陆续送达的安排去应付。"
 hd_regional_decisions.500.a: "循潮而行，务必留下航海记录。"
 hd_regional_decisions.501.t: "淡水将尽"
 hd_regional_decisions.501.desc:0 "船队出海后的回报终于到了，最先写的却不是所见，而是水粮。逆风拖长了行程，领队算过配给，仍请我增拨资财。\n\n一百金可以使他们补足这一程所需；若不添费，就得依现有物资重新分派，撑不撑得住，还要看调度。我将报讯翻回页首，发现自己连着两次都先看了“水”字。\n\n船已经走远，案前却只剩几行干燥的墨。我可以让他们采买，也可以命其节用继续。回书不长，船上的人却要靠它过完接下来一段海路。"
 hd_regional_decisions.501.safe: "拨一百金，沿途采买补给。"
 hd_regional_decisions.501.risk: "削减每日配给，坚持既定航程。"
 hd_regional_decisions.502.t: "失去陆影"
 hd_regional_decisions.502.desc:0 "粮水一关过去，船队又在新海域遇到分歧。沿岸舟人说的去路与旧记不同，领航者把两种说法送回，让我裁定。\n\n我看着那份航图，忽然觉得岸上画得分明的线，到了海里竟如此靠不住。出一百金聘熟路之人，可以稳妥引航；若让船队自行辨认，便须凭旧图、星位与见闻担一回险。\n\n来人问回书何时可发，我将图角压平。不能只写一句“小心前行”便算给了答复，前方真正缺的，是该信哪一条路。"
 hd_regional_decisions.502.safe: "拨一百金，雇请当地领航者。"
 hd_regional_decisions.502.risk: "校正潮汐与星位，自行寻路。"
 hd_regional_decisions.503.t:0 "风浪将至"
 hd_regional_decisions.503.desc:0 "领航者的回报附着船身、索具待修的细目，末尾又说前路风浪渐重，附近有湾口可以暂泊。我读过那些损处，先前催他们继续前行的话便停在嘴边。\n\n拨一百金，可以入湾修整、避过此险；若不再添费，就让舟师整队依原路前进，靠操舟与调度过关。\n\n先前是粮水，后来是方向，如今连船也要开口索钱。我将旧报一并取出，看着这支越走越远的队伍。已经花下的钱不能替他们挡风，接下来这笔，仍须我来舍得或舍不得。"
 hd_regional_decisions.503.safe: "拨一百金，入湾修船避风。"
 hd_regional_decisions.503.risk:0 "由舟师整肃队列，冒险继续前行。"
 hd_regional_decisions.504.t: "夷州归帆"
 hd_regional_decisions.504.desc:0 "船队终于归来，先前几次只见于回报的水粮、迷航与风浪，此刻都变成了船身上实在的磨损。随行者将记录呈上，又引来一名出身夷州的向导。\n\n我请他说明图上的海岸与停泊处，译者跟着一句句记下。岛上的港湾、部众与行船经验，终于不再只是出发前模糊的传闻。\n\n向导愿意留在这里，我便让人安顿住处，将带回的记录妥善收存。这场远航到今日才算落定，所得也应留给后来的人使用，而不只供眼前席间谈奇。"
 hd_regional_decisions.504.a: "收存海图，请他入廷。"
 hd_regional_decisions.509.t: "折帆而返"
 hd_regional_decisions.509.desc:0 "归船的回报送来，比启航时少了许多热闹。领队呈上残存记录，说到无法再向前时，声音低下去，半晌没有续上。\n\n我将那些记述一页页翻过，水粮、辨路、风浪，原先每封信里尚有可再试的办法，如今都聚成同一个结果：这次远航已不能完成。\n\n来人似乎还想说几句宽慰的话，我先让他将经过说清。船尚可修，文书尚可留下，未到的地方却终究未到。我把最后一页压好，叫人先收起这一次的航图。"
 hd_regional_decisions.509.a: "修整船厂，来日尚可再试。"

 hd_partition_han_decision: "两汉分治"
 hd_partition_han_decision_desc: "疆域过于辽阔，诏书从洛阳传至凉州已需数月。既然一位天子难以兼顾东西，何不效法古人，将天下分作东、西两汉，由同宗二帝各治一方？"
 hd_partition_han_decision_tooltip: "将完整控制的汉帝国分为以洛阳为都的东汉和以长安为都的西汉。该决议全世界只能执行一次。"
 hd_partition_han_decision_confirm:0 "议分东西"
 hd_regional_decisions.600.t: "东西二京"
 hd_regional_decisions.600.desc:0 "雒阳与长安的两幅舆图并列展开，关于分治的议论也到了须由我表态的时候。若此策行下，关中、凉州与益州归西汉，其余天下归东汉，两方将各有天子与都城。\n\n我先看向雒阳，又将手移到长安。留在哪一边，决定的不只是以后在何处临朝，也决定了哪些土地与臣属由我继续掌握，哪些交给另一位同宗之人。\n\n诏书尚未发出，眼下仍能将这场议论收住；若选定自己的去处，下一步便须认真决定，由谁承担另一半基业。"
 hd_regional_decisions.600.east: "我留在洛阳，统治东汉。"
 hd_regional_decisions.600.west: "我迁往长安，统治西汉。"
 hd_regional_decisions.600.cancel: "把两幅舆图收起来。"
 hd_regional_decisions.610.t: "择立另一汉帝"
 hd_regional_decisions.610.desc:0 "东西分治的意向已经定下，我所留的一方也已选好，诏书上却还空着另一个最要紧的名字。\n\n面前列出的宗室，将有人取得另一方的都城与疆土，以独立的帝号与我并立。这不是随手加封一个尊贵称谓，而是将原先同出一处的号令，真正分作两边。\n\n我把名单从头看过。若亲近支系中无人合适，便须另择同宗成年人承当。书吏持笔等候，我却没有叫他先写一段颂辞；此时最应想明白的，仍是那个将被填入空处的人。"
 hd_regional_decisions.610.a: "命[scope:hd_partition_child_1.GetShortUINameNoTooltip]承统另一汉"
 hd_regional_decisions.610.b: "命[scope:hd_partition_child_2.GetShortUINameNoTooltip]承统另一汉"
 hd_regional_decisions.610.c: "命[scope:hd_partition_child_3.GetShortUINameNoTooltip]承统另一汉"
 hd_regional_decisions.610.d: "命[scope:hd_partition_child_4.GetShortUINameNoTooltip]承统另一汉"
 hd_regional_decisions.610.e: "命[scope:hd_partition_child_5.GetShortUINameNoTooltip]承统另一汉"
 hd_regional_decisions.610.f: "命[scope:hd_partition_child_6.GetShortUINameNoTooltip]承统另一汉"
