l_simp_chinese:
 hd_repair_shu_roads_decision: "修缮蜀道"
 hd_repair_shu_roads_decision_desc: "蜀地群山横绝，栈道常因雨雪与兵燹损毁。拨付钱帛，征发工匠，可择一条要道重新修治。"
 hd_repair_shu_roads_decision_tooltip: "择一条境内蜀道，征发工匠，重修栈阁"
 hd_repair_shu_roads_decision_confirm:0 "即日兴工！"
 hd_tuntian_tazhong_decision: "屯田沓中"
 hd_tuntian_tazhong_decision_desc: "沓中谷地可耕可守。若修渠筑仓，使军民相杂而居，既可供给边军，也能渐成沃野。"
 hd_tuntian_tazhong_decision_tooltip: "在沓中开渠垦田，使军民就地屯种"
 hd_tuntian_tazhong_decision_confirm:0 "开渠屯田！"
 hd_consume_wushisan_decision: "服用五石散"
 hd_consume_wushisan_decision_desc: "药末在盏中泛起细白的光。医者说它能使精神畅快、形神俱散——至少在药力消退以前如此。"
 hd_consume_wushisan_decision_tooltip: "服下五石散，暂忘胸中烦忧"
 hd_consume_wushisan_decision_confirm:0 "服散"

 hd_repaired_shu_road_modifier: "蜀道修缮"
 hd_repaired_shu_road_modifier_desc: "栈道、桥梁与沿途驿站已经整修，军旅和行人得以安全通行。"
 hd_tazhong_tuntian_modifier: "沓中屯田"
 hd_tazhong_tuntian_modifier_desc: "军户修渠垦殖，谷物就近入仓，使这片边地同时承担耕作与军需。"
 hd_satisfied_nanman_modifier: "满意的蛮族"
 hd_satisfied_nanman_modifier_desc: "本地首领得到朝廷承认，部众暂愿输纳贡赋、应征从军。"
 hd_inward_migration_modifier: "外族内迁"
 hd_inward_migration_modifier_desc: "新迁入的部众带来了牲畜、劳力与善战之士，也重新开垦了荒废土地。"

 hd_regional_decisions.10.t: "散发"
 hd_regional_decisions.10.desc:0 "服散之后，积在胸中的烦闷渐渐退远，左右说话的声音也像隔了一层帷幕。方才反复思量的难处，此刻竟抓不住你的心神。\n\n你扶着案沿起身，才觉指尖微颤，脚下也不似平日稳妥。那份轻快来得突然，却没有替你办完一件公务，案上的文书也不曾自行消失。\n\n左右见你神色稍缓，便不再催问。你挥退众人，披衣缓行。眼前的忧思可以暂歇，药后的燥热与不适，却终须这副身体自己承受。"
 hd_regional_decisions.10.a: "且披衣徐行，任药力散去。"

 hd_regional_decisions.100.t: "六道入蜀"
 hd_regional_decisions.100.desc:0 "蜀道的图籍铺满案前，损坏之处都用朱笔圈出。你顺着一条路看到尽头，还未开口，书吏已将木石、役夫与钱粮所需递了上来。\n\n一段栈道在图上不过寸许，真要修好，却不知要让多少人负重入山。六条道路各有来报，谁都说自己那一处最急，府库的钱却不会随这些“急”字一同增多。\n\n你压住图角，叫众人先停一停。这一回修哪一条，还是暂且搁下，都须你来定夺。"
 hd_regional_decisions.100.a: "修缮米仓道"
 hd_regional_decisions.100.b: "修缮关城道"
 hd_regional_decisions.100.c: "修缮褒斜道"
 hd_regional_decisions.100.d: "修缮两当、陈仓道"
 hd_regional_decisions.100.e: "修缮子午道"
 hd_regional_decisions.100.f: "修缮傥骆道"
 hd_regional_decisions.100.cancel: "此事暂且缓议。"

 hd_pacify_nanman_decision: "安抚南蛮"
 hd_pacify_nanman_decision_desc: "宁州山川阻隔，旧日郡县之名未必能服众。若承认一位本地首领，以部落旧俗治理其乡土，或可换来数十年的安定。"
 hd_pacify_nanman_decision_tooltip: "择宁州一郡，册立本地首领为你的部落封臣，因其旧俗而治"
 hd_pacify_nanman_decision_confirm:0 "因俗而治"
 hd_nanman_acceptance_gain: "安抚南蛮"
 hd_regional_decisions.200.t: "因俗而治"
 hd_regional_decisions.200.desc:0 "南中诸郡的来人等在堂下，译者说一句，他们便彼此交换一个眼神。问到治理之事，几位首领忽然都安静下来，仿佛终于等到了真正想听的那一句。\n\n若授一地，许其依旧俗治众，往后许多郡县难以料理的事便另有着落。可哪一郡先行，印信交到谁手里，还须你从列出的地方中定下一处。\n\n你没有催译者往下说，先看向案上的名单。同样是点一次头，落在不同的名字之后，堂下的神色大概也会全然不同。"
 hd_regional_decisions.200.yunnan: "册立云南本地首领"
 hd_regional_decisions.200.jianning: "册立建宁本地首领"
 hd_regional_decisions.200.zangke: "册立牂柯本地首领"
 hd_regional_decisions.200.wuling: "册立武陵本地首领"
 hd_regional_decisions.200.fuling: "册立涪陵本地首领"
 hd_regional_decisions.200.yuexi: "册立越巂本地首领"
 hd_regional_decisions.200.bajun: "册立巴郡本地首领"
 hd_regional_decisions.200.yongchang: "册立永昌本地首领"
 hd_regional_decisions.200.cancel: "此议关系重大，容后再定。"

 hd_move_foreign_peoples_inward_decision: "外族内迁"
 hd_move_foreign_peoples_inward_decision_desc:0 "塞外诸部请求携牲畜与家眷入境。在他们的安置地授予一县，使其首领成为直属封臣，既可充实荒地，也能从中征募善战之士。只是胡人聚居，日后未必安分。"
 hd_move_foreign_peoples_inward_decision_tooltip:0 "接纳塞外一族内迁，授其一县安置，以其首领为你的直属封臣"
 hd_move_foreign_peoples_inward_decision_confirm:0 "接见塞外来使"
 hd_regional_decisions.300.t: "塞外来客"
 hd_regional_decisions.300.desc:0 "北方诸部的来使接连求见，刚报完首领的名号，便问内迁的部众可安顿在何处。你叫译者先别急，将各家来意分开说清。\n\n匈奴、鲜卑、羯、氐、羌与乌桓，部众多寡、旧日往来、所操言语各不相同，席间却总有人只说一个“胡”字，仿佛如此便省去了后面所有安排。\n\n你让书吏将几份来书依次摊开。先定接纳哪一方，再议授出哪一县。堂下那些盼望的眼神，替不了你做这个决断。"
 hd_regional_decisions.300.xiongnu: "准许匈奴部众内迁"
 hd_regional_decisions.300.xianbei: "准许鲜卑部众内迁"
 hd_regional_decisions.300.qiang: "准许羌人部众内迁"
 hd_regional_decisions.300.jieren:0 "准许羯人部众内迁"
 hd_regional_decisions.300.diren:0 "准许氐人部众内迁"
 hd_move_foreign_peoples_inward_decision_effect_tt:0 "你将接见塞外诸部的来使，择定内迁之族与安置之地。若所授之县原属封臣，其人难免心怀不平。"
 hd_regional_decisions.300.wuhuan: "准许乌桓部众内迁"
 hd_regional_decisions.300.cancel: "边地尚未准备妥当。"
 hd_regional_decisions.310.t: "择地安置"
 hd_regional_decisions.310.desc:0 "接纳哪一方既已定下，书吏紧接着便问：“授哪一县？”他将该族旧日聚居之地中，由你或直属封臣治理、又非首府的县一一列出，方才那句从容的应允，顿时有了沉甸甸的去处。\n\n你沿着名单看下去，每一个县名都牵着原有的住民与官吏。若是从封臣手里割出来，那位封臣心里也不会痛快。迁来的人要安顿，左近的人也要知道往后该听谁的号令。\n\n笔停在案边，来使还在等候回报。"
 hd_regional_decisions.310.a: "以[scope:hd_migration_county_1.GetNameNoTier]授之"
 hd_regional_decisions.310.b: "以[scope:hd_migration_county_2.GetNameNoTier]授之"
 hd_regional_decisions.310.c: "以[scope:hd_migration_county_3.GetNameNoTier]授之"
 hd_regional_decisions.310.d: "以[scope:hd_migration_county_4.GetNameNoTier]授之"
 hd_regional_decisions.310.e: "以[scope:hd_migration_county_5.GetNameNoTier]授之"
 hd_regional_decisions.310.f: "以[scope:hd_migration_county_6.GetNameNoTier]授之"
 hd_regional_decisions.310.g: "以[scope:hd_migration_county_7.GetNameNoTier]授之"
 hd_regional_decisions.310.h: "以[scope:hd_migration_county_8.GetNameNoTier]授之"
 hd_regional_decisions.310.cancel: "暂不授土。"

 hd_explore_far_west_decision: "探索极西"
 hd_explore_far_west_decision_desc: "凉州商旅传来层层转述的消息：越过葱岭与无数城邦，在日落之处尚有自称大秦的国度。组织一支使团，或能把那里的人与见闻带回东方。"
 hd_explore_far_west_decision_tooltip: "遣使西出葱岭，寻访日落之处的大秦"
 hd_explore_far_west_decision_confirm:0 "遣使西行"
 hd_regional_decisions.400.t: "向日落之地"
 hd_regional_decisions.400.desc:0 "西行使团行装已备，译者临行前又将所携文书点过一遍。来辞行的人把沿途道路指给你看，说到更远之处，却只能凭旧日商旅的转述。\n\n你问清粮资与接应的安排，嘱咐他们将亲见与听闻分别记下。向西每过一处关津，文字、礼俗与道路都会不同；远方的国名可以传得很响，真能带回来的见闻，却得一程一程走出来。\n\n使团启程之后，案前不会很快再有他们的回书。你将留存的路线图收好，静候来自西方的消息。"
 hd_regional_decisions.400.a: "持节西去，务录所见。"
 hd_regional_decisions.401.t: "流沙断粮"
 hd_regional_decisions.401.desc:0 "西行使团的回报送到，封边已磨得起毛。风沙坏了原定行程，粮水也难再按旧额支撑；读到求援之处，你不由将文书拿近了些。\n\n你展开路线图，手指却只能停在报讯所标的地方。人在那么远处，口渴与疲惫都不能由你代受，回书却仍须由你来写。"
 hd_regional_decisions.401.safe: "再拨二百金，就地采买粮水。"
 hd_regional_decisions.401.risk: "依旧册分队，冒沙而进。"
 hd_regional_decisions.risk.tt:0 "#EMP 此举成败难料；若再三受挫，此行恐难为继。#!"
 hd_regional_decisions.402.t: "诸城关津"
 hd_regional_decisions.402.desc:0 "使团刚过粮水之难，又被一处商路城邑拦住。来信说当地索要厚礼，译者交涉许久，对方仍只肯把同一番话重复一遍。\n\n你读到索价，忍不住将文书翻回前面，再看是否真非过此不可。出发时议的是远方见闻，如今却总在问下一道门要多少钱才推得开。\n\n你将信放平。城外那群候着的人，总要等到你一句答复。"
 hd_regional_decisions.402.safe: "拨二百金，依礼赠予当地首领。"
 hd_regional_decisions.402.risk: "陈明国书，不纳无名之税。"
 hd_regional_decisions.403.t: "陌生文字"
 hd_regional_decisions.403.desc:0 "同一个地名，竟被向导指向两条路。使团的回报将两种说法并列写来，读到后面，你也只能对着旧图皱眉——哪一条都不像可以轻易划去的错笔。\n\n你将两份记述放在一处，忽然很想叫那个最先画图的人来问问。可案前无人识得远方的路，能做的仍是定下一个办法，把回书送出去。"
 hd_regional_decisions.403.safe: "拨二百金，延请当地学者。"
 hd_regional_decisions.403.risk: "参校旧图，循路西进。"
 hd_regional_decisions.404.t: "大秦来客"
 hd_regional_decisions.404.desc:0 "多年之后，使团终于带着新的见闻归来。同行的远方学者被引到你面前，行装尚带旅尘，谈起商路与海岸，却比许多旧图更有条理。\n\n你请译者放慢些，把能亲证的事一件件记清。那些从前只在转述中出现的名字，如今终于有人能说明它们之间如何通行、当地人如何过活。\n\n学者愿意留下共事，所携典籍也可慢慢校读。你命人先为远客安顿住处。此番西行所得，不该只是一个可供夸耀的远国之名。"
 hd_regional_decisions.404.a: "为远客设席。"
 hd_regional_decisions.409.t: "西使不返"
 hd_regional_decisions.409.desc:0 "归来的使者没有先报喜，只将残存的记录放在案上。你等了片刻，他才说，西去的行程已无法继续。\n\n纸上还写着尚未到达的地方，后面却再没有新的记述。沿途的挫折终于耗尽了余地，能回来的只有眼前这些人和这几卷文书。你问起几处经过，他答得很慢，每一次停顿都比那些地名更难听清。\n\n你将记录收在一旁。钱粮已经花去，远路也确实走过，原定的使命却终究未成。"
 hd_regional_decisions.409.a: "收存残卷，以待来日。"

 hd_explore_yizhou_decision: "探索夷州"
 hd_explore_yizhou_decision_desc: "会稽海民传说，东南大海之外尚有广阔岛屿。建造海船、招募熟悉潮汐的人，或可让朝廷第一次得到可信的夷州航路。"
 hd_explore_yizhou_decision_tooltip: "遣船队出会稽，寻访海外夷州"
 hd_explore_yizhou_decision_confirm:0 "扬帆出海"
 hd_regional_decisions.500.t: "帆出会稽"
 hd_regional_decisions.500.desc:0 "出海的船队已经整装，领航者最后一次核对沿岸的山形水势与回程的约定。送来的启航回报上，写满了船只、粮水与随行之人的名数。\n\n你将他们所知的海路一一问清，更远的方向却仍是大片空白。夷州之名早有传闻，究竟怎样抵达、何处可以停泊，却不能只凭岸上听来的几句说法。\n\n远航既已开始，你嘱咐他们沿途留记，莫把猜测写成亲见。此后消息往返不会迅速，船上遇到的难处，也只能凭先前的准备与陆续送达的安排去应付。"
 hd_regional_decisions.500.a: "循潮而行，务留航记。"
 hd_regional_decisions.501.t: "淡水将尽"
 hd_regional_decisions.501.desc:0 "船队出海后的回报终于到了，开头写的却不是所见，而是水粮。逆风拖长了行程，领队算过配给，仍请你增拨资财。\n\n你把报讯翻回页首，发觉自己连着两次都先看了那个“水”字。船已经走远，案前只剩几行干燥的墨；回书不长，船上的人却要靠它撑过接下来的一段海路。"
 hd_regional_decisions.501.safe: "拨一百金，沿途采买补给。"
 hd_regional_decisions.501.risk: "减其日给，不改航程。"
 hd_regional_decisions.502.t: "失去陆影"
 hd_regional_decisions.502.desc:0 "粮水一关刚过，船队又在新的海域生出分歧。沿岸舟人所说的去路与旧记不同，领航者把两种说法一并送回，请你裁断。\n\n你看着那份航图，忽然觉得岸上画得分明的线，到了海里竟如此靠不住。来人问回书何时可发，你将图角压平。不能只写一句“小心前行”便算答复，前方真正缺的，是该信哪一条路。"
 hd_regional_decisions.502.safe: "拨一百金，雇请当地领航者。"
 hd_regional_decisions.502.risk: "测潮观星，自寻其路。"
 hd_regional_decisions.503.t:0 "风浪将至"
 hd_regional_decisions.503.desc:0 "领航者的回报附着船身、索具待修的细目，末尾又说前路风浪渐重，附近恰有湾口可以暂泊。你读过那些损处，先前催他们前行的话便停在了嘴边。\n\n先是粮水，后是方向，如今连船也要开口索钱。你把旧报一并取出，看着这支越走越远的队伍。已经花下的钱替他们挡不了风，接下来这一笔，仍须你来定夺。"
 hd_regional_decisions.503.safe: "拨一百金，入湾修船避风。"
 hd_regional_decisions.503.risk:0 "整肃舟师，冒浪而进。"
 hd_regional_decisions.504.t: "夷州归帆"
 hd_regional_decisions.504.desc:0 "船队终于归来，先前只见于回报的水粮、迷航与风浪，此刻都化作船身上实实在在的磨损。随行者将记录呈上，又引来一名出身夷州的向导。\n\n你请他说明图上的海岸与泊处，译者在旁一句句记下。岛上的港湾、部众与行船的门道，终于不再只是出发前模糊的传闻。\n\n向导愿意留下，你便命人安顿住处，将带回的记录妥善收存。这场远航至此方算落定，所得也该留给后来之人，而不只供席间谈奇。"
 hd_regional_decisions.504.a: "收存海图，请他入廷。"
 hd_regional_decisions.509.t: "折帆而返"
 hd_regional_decisions.509.desc:0 "归船的回报送来，比启航时冷清了许多。领队呈上残存的记录，说到无法再往前时，声音低了下去，半晌没有接上。\n\n你将那些记述一页页翻过。水粮、辨路、风浪，先前每封信里尚有可再试的办法，如今都汇成同一个结果：这一次远航，已不能完成。\n\n来人似乎还想说几句宽慰的话，你先让他把经过说清。船尚可修，文书尚可留，未到的地方却终究未到。"
 hd_regional_decisions.509.a: "修整船厂，以待来日。"

 hd_partition_han_decision: "两汉分治"
 hd_partition_han_decision_desc: "疆域过于辽阔，诏书从洛阳传至凉州已需数月。既然一位天子难以兼顾东西，何不效法古人，将天下分作东、西两汉，由同宗二帝各治一方？"
 hd_partition_han_decision_tooltip: "分天下为东、西两汉，以洛阳、长安为二京"
 hd_partition_han_decision_confirm:0 "议分东西"
 hd_regional_decisions.600.t: "东西二京"
 hd_regional_decisions.600.desc:0 "雒阳与长安的两幅舆图并列展开，分治之议也到了须你表态的时候。此策若行，关中、凉州与益州归西汉，其余天下归东汉，两方各有天子与都城。\n\n你先看向雒阳，又将手移到长安。留在哪一边，决定的不只是日后在何处临朝，也决定了哪些土地与臣属仍由你掌握，哪些要交给另一位同宗之人。\n\n诏书尚未发出，这番议论此时还收得住。"
 hd_regional_decisions.600.east: "朕留洛阳，君临东汉。"
 hd_regional_decisions.600.west: "朕迁长安，君临西汉。"
 hd_regional_decisions.600.cancel: "收起舆图，此议作罢。"
 hd_regional_decisions.610.t: "择立另一汉帝"
 hd_regional_decisions.610.desc:0 "东西分治之意已定，你所留的一方也已选好，诏书上却还空着另一个最要紧的名字。\n\n名单上的宗室之中，将有一人取得另一方的都城与疆土，以帝号与你并立。这不是随手加封的一个尊号，而是要将原本同出一处的号令，真正分作两边。\n\n你把名单从头看过。书吏持笔候着，你却没有叫他先写颂辞。此刻最该想明白的，仍是那个将要填进空处的人。"
 hd_regional_decisions.610.a: "命[scope:hd_partition_child_1.GetShortUINameNoTooltip]承统另一汉"
 hd_regional_decisions.610.b: "命[scope:hd_partition_child_2.GetShortUINameNoTooltip]承统另一汉"
 hd_regional_decisions.610.c: "命[scope:hd_partition_child_3.GetShortUINameNoTooltip]承统另一汉"
 hd_regional_decisions.610.d: "命[scope:hd_partition_child_4.GetShortUINameNoTooltip]承统另一汉"
 hd_regional_decisions.610.e: "命[scope:hd_partition_child_5.GetShortUINameNoTooltip]承统另一汉"
 hd_regional_decisions.610.f: "命[scope:hd_partition_child_6.GetShortUINameNoTooltip]承统另一汉"
 hd_regional_decisions.610.g: "命[scope:hd_partition_child_7.GetShortUINameNoTooltip]承统另一汉"
 hd_regional_decisions.610.h: "命[scope:hd_partition_child_8.GetShortUINameNoTooltip]承统另一汉"
 hd_regional_decisions.610.fallback: "宗室无可任者，另择同宗之人。"
