l_simp_chinese:
 # 2026-10-26：190 曹操陈留—兖州接力（hd190.0102~0103）
 hd190.0102.t:0 "陈留之谋"
 hd190.0102.desc:0 "董卓已死，联军早散，各家都回去守自己的郡县。你在陈留西境只有己吾、襄邑、雍丘几座小城，屯兵其间，粮秣全仰仗[hd190_relay_def.GetName]接济。

帐下有人进言：「陈留四通之地，[hd190_relay_def.GetName]虽与明公旧好，然其性宽而无断，非守土之主。今诸侯各怀异志，明公不取，他人必取之。据陈留，则兖州可图。」"
 hd190.0102.a:0 "陈留不可不取，即日进兵。"
 hd190.0102.a.tt:0 "以吞并对[hd190_relay_def.GetName]宣战，目标为其全部领地。胜后可接着向兖州诸郡用兵"
 hd190.0102.b:0 "孟卓是旧交，此事从缓。"
 hd190.0103.t:0 "东略兖州"
 hd190.0103.desc:0 "新得的城邑还未安顿妥当，探马又报：兖州诸郡各自为守，彼此不相统属，[hd190_relay_def.GetName]的兵马就在境外。

谋士们说，兖州是天下之中，四战之地，不先据有，便无立足之本；趁诸家尚未合力，正可逐一取之。"
 hd190.0103.a:0 "乘胜东进，兵发[hd190_relay_def.GetName]。"
 hd190.0103.a.tt:0 "以吞并对[hd190_relay_def.GetName]宣战，目标为其在兖州的领地。胜后继续东进，直到实控兖州七成县"
 hd190.0103.b:0 "兵已疲敝，暂且休整。"
