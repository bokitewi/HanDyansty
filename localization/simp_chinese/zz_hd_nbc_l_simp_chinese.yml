 # 史实主线事件
 hd_nbc.0100.t: "病笃"
 hd_nbc.0100.desc: "药汁已经凉了，我仍没有力气把碗端稳。侍者接过去时，指尖碰到我的手，随即低下头去。门外的脚步比往日更轻，隔着帷幕，我听见近臣压低声音，问今夜还该由谁守候。\n\n我唤了一声，屋里立刻静了。医者上前诊视，回答得很谨慎，只说须安心静养；可那些没有说出口的话，都留在他的停顿里。还有许多事未曾交代，也有些人，我原想再见一面。胸中的气息愈发短促，眼前的人等着我示意，是放下这份牵挂，还是再把药送来，试着撑过眼前这一夜。"
 hd_nbc.0100.a: "天命如此，交代后事吧。"
 hd_nbc.0100.b: "我还不能死！（再撑一年）"
 hd_nbc.0110.t: "成汉亡"
 hd_nbc.0110.desc: "降人来到军门时，抬棺的脚步声压过了四周的私语。李势缚着双手，站在成都城外，昔日的君臣都不再争辩。我看了他片刻，命人先把城门内外的秩序报清楚。\n\n一路溯江入蜀，所受的疑虑与阻拦，此刻终于有了答复。可军士望着城中的府库，蜀人望着城外的旌旗，等待的并不是同一件事。胜仗若化作抢掠，归附便只是一纸空文。我要接管蜀地，也要让建康知道，我不仅打得下成都，还能让这里安定下来。报捷的人已经候在马旁，只等我将军令一并交给他。"
 hd_nbc.0110.a: "露布告捷，送李势入建康。"
 hd_nbc.0120.t: "燕军南下"
 hd_nbc.0120.desc: "南来的探骑带回几封文书，落款各不相同，写的却都是赵国内争、守将难以自保。诸将听到蓟城的消息，纷纷上前请战，连敌军过去坚守的关隘，也被他们指作可以长驱而入的道路。\n\n我没有立即让他们散去。石虎死后留下的混乱，确实给了燕军南下的机会；但一处守军退走，并不等于沿途城邑都会开门迎接。兵马离开旧境，粮食与接应便要一路跟上。我逐个听取他们的筹划，直到请战的声音渐渐停住。此刻发兵，或许能趁赵国内乱夺取城池；留兵自守，也仍来得及。"
 hd_nbc.0120.a: "三道并进，先取蓟城！"
 hd_nbc.0120.b: "按兵不动，静观其变。"
 hd_nbc.0130.t: "冉闵诛石鉴"
 hd_nbc.0130.desc: "宫门那边又传来兵器相击的声音，守门人却说一切如常。我知道，石鉴不会甘心让自己的诏令事事受阻；他要除掉我的消息，早已随着宫人的低语传到了军中。\n\n邺城的主人换得太快，昨日尚在称臣的人，今日便可能死在另一道命令之下。跟随我的将士挤满阶前，问我还要等到何时。我看着通向宫城的道路：向前一步，便不再是替石氏掌兵，而是亲手夺取他们的国统。那些等候的人愿意为我动手，也会从此把自己的前程系在我身上。城门已近，最后一道命令还未出口。"
 hd_nbc.0130.a: "诛石鉴，即帝位，国号大魏！"
 hd_nbc.0130.b: "我终究是石家养大的。"
 hd_nbc.0140.t: "西入关中"
 hd_nbc.0140.desc: "父亲留下的话，又被身边的人提起：西取关中。枋头的营地里，车辆已经收拾起来，老人牵着孩子在马匹之间等候，都想知道今后往哪里走。麻秋留下的祸事尚未平息，我却不能让众人一直守着丧帐。\n\n关中有可耕的田土，也有各自据地的兵众。它不是一块等着我们去取的空地，可比起在这里受人牵制，向西至少还有重新立足的可能。我让人把沿途关津逐一指出，问清随行部众带了多少粮食。若今日举众西行，枋头的旧业便须舍下；这条路走出去，就得由我带着大家走到底。"
 hd_nbc.0140.a: "焚桥西进，入长安！"
 hd_nbc.0140.b: "留在枋头，再等等。"
 hd_nbc.0150.t: "北伐"
 hd_nbc.0150.desc: "北上的道路说到洛阳时，军议里有人提起旧都，声音忽然低了下去。我顺着舆图看过南阳与伊水，问诸将，哪一路能行军，哪一路能运粮。接下来便不能只靠追怀往事来带兵。\n\n平蜀以后，许多人看我的眼光变了；如今若再克复中原，建康也不能不听这支军队说话。但出师的声势越大，无功而还的代价也越重。我走到营前，望着已经编好的行伍。将士等的是前进或停驻的号令，我得让他们知道，这次北上究竟要把旗帜插到哪里。"
 hd_nbc.0150.desc_yishui: "探马回报：姚襄已据洛阳，部众屯在伊水之北。此人当年也曾向朝廷称臣，如今却拥兵中原，扼住了旧都的门户。军议上有人劝我先取许昌，再缓缓北进；也有人说姚襄的士卒精悍，不宜与他争锋。\n\n我看着舆图上那条细细的伊水。要回洛阳，就绕不开它；要让建康知道这支兵马为谁而战，也只能从这里打过去。将士们在等号令，我得告诉他们：渡不渡伊水。"
 hd_nbc.0150.a: "兵发伊洛，收复旧都！"
 hd_nbc.0150.b: "时机未到。"
 hd_nbc.0160.t: "投鞭断流"
 hd_nbc.0160.desc: "一说到江南，有人立刻称贺天下将定，也有人始终没有离席请战。我让反对的人把话说完：晋廷尚有臣民效命，大江也不会因为北方归一，就变成容易越过的浅水。王猛临终的劝告，忽然又在耳边响起。\n\n我看向阶前诸将。他们来自不同的部族与旧国，如今都听我号令；如此兵势，若仍不能向南，何时才算时机成熟？可人多，并不能替粮车赶路，也不能让水军立即熟悉江流。众人的目光都落到我身上。是让诸军南下，还是暂缓出兵，再听听反对者的理由？"
 hd_nbc.0160.a: "大举南征！"
 hd_nbc.0160.b: "王景略的话，还是听吧。"
 hd_nbc.0161.t: "淝水之后"
 hd_nbc.0161.desc: "有人将一面散失后寻回的军旗送来，旗角已经烧焦。我伸手接住，才发现周围的人都在等我开口。退回北方以来，沿途报失的兵众尚未数清，新的急报却已接连赶到：昔日受命的封臣，如今不再听我调遣。\n\n淝水一场败仗，竟使许多原本不肯明说的心思，如今都敢公开自立了。我问最近的一路使者何时回来，回答的人迟疑了片刻。我知道他也未必等得到回信。眼前还能聚拢多少人、还能守住哪些城邑，都须重新清点。还有许多将士流落在外，连他们的生死，我都没有问清。"
 hd_nbc.0161.a: "朕何负于他们……"
 hd_nbc.0210.t: "覆舟山"
 hd_nbc.0210.desc: "溃兵挤进道路的时候，我还在等覆舟山的回报。有人丢了兵器，有人只顾牵马，传来的说法彼此矛盾，却都说刘裕的兵已经逼近。方才还劝我亲自临阵的人，此刻也不再开口。\n\n殷仲文走到近前，压低声音，请我奉着晋帝西去江陵。那里还有桓氏经营的根本，总比困在建康等待城门失守要强。我回头看向宫中的方向：车驾、随从、舟船，都要在混乱中凑齐。退走意味着将都城让给起兵者，留下却须面对眼前溃散的军队。催问去留的人已经到了门口，我不能再让他们等下去。"
 hd_nbc.0210.a: "弃建康，挟天子西走江陵。"
 hd_nbc.0210.b: "死守建康！"
 hd_nbc.0220.t: "峥嵘洲"
 hd_nbc.0220.desc: "水军送来的消息里，桓玄的楼船停在峥嵘洲一带。刘毅、何无忌领兵溯江而上，沿途的回报时有迟滞，每一次停顿，都叫等候的人重新猜测荆州的动向。\n\n我让人细问对方舟师的位置。桓玄虽已离开建康，仍握着兵众，也仍挟着晋室的车驾；只要他还能沿江发号施令，所谓复兴便不能算稳固。若不能尽快击败他，那些尚在观望的州郡，恐怕仍不肯听命于朝廷。诸军已经走到此处，往后是继续进击，还是暂缓攻势，该由我把命令送到江上去了。"
 hd_nbc.0220.a: "进讨桓玄，奉迎天子！"
 hd_nbc.0220.b: "先稳住江东再说。"
 hd_nbc.0230.t: "浮海南下"
 hd_nbc.0230.desc: "船舷上挂着晒不干的衣物，部众却已围着南来的航路争论起来。自孙恩死后，他们推我为主，随我浮海转徙，能带走的粮物越来越少，等一个落脚之地的心思却越来越急。\n\n有人说番禺可以取，江东正乱，广州未必能从容集兵相拒。我望向停泊的船只：继续在海上辗转，风浪与饥饿迟早会先找上来；一旦登岸攻城，便须带着这些人打下一处能够安家的地方。请战的人说完，又指了指船后等候的家属。我接下他们递来的水囊，心里盘算的，已经不只是下一段航程。"
 hd_nbc.0230.a: "扬帆南下，袭取番禺！"
 hd_nbc.0230.b: "海上自在，何必登岸。"
 hd_nbc.0240.t: "伐南燕"
 hd_nbc.0240.desc: "被掳人家的陈诉送到军前，有人连亲属的名字都说不下去。我让记录的人等他喘过气，再问清南燕兵从何处来、往何处去。淮北的道路不该只任对方来去，这件事总须有个答复。\n\n朝中反对出征的声音，我已经听过了。北地强敌并未消失，深入敌境也有失去粮道的危险；可若只因如此便守着疆界，南燕下一次仍会照样南来。我把广固附近的山川与道路再看一遍，听诸将报上所备的军粮。机会与风险都已摆明，如今要定的，是不是让这支军队越过边界。"
 hd_nbc.0240.a: "北伐广固！"
 hd_nbc.0240.b: "不宜轻出。"
 hd_nbc.0250.t: "伐后秦"
 hd_nbc.0250.desc: "军报写到姚兴之死，随后便是诸子争权、关中动荡。我把几份消息放在一处对照，叫熟悉北地的人逐一辨认，哪些道路可以通行，哪些城邑仍有兵众把守。洛阳与长安的名字，终于又近到了可以谈论行军的时候。\n\n将士说起旧都，往往只恨不能即日出发；我却还须看水陆诸军能否接应，粮食能否随军而上。北方的纷乱是机会，也可能转眼便换了局面。各路人马已经集结，若再迟疑，他们便要在营中消耗本可用于进军的粮食。我叫人取来军令，准备定下此次北行的去留。"
 hd_nbc.0250.a: "水陆并进，收复两京！"
 hd_nbc.0250.b: "再养几年兵。"
 hd_nbc.0260.t: "禅让"
 hd_nbc.0260.desc: "傅亮捧来禅位的文书，我接到手中，厅里便静了下来。他没有再长篇陈说功业，只将禅位的措辞指给我看，随后退后一步，与在场诸人一同等候。\n\n我读过晋帝的名号，又读过文书中为我安排的位置。这些年征战带回的兵众与声望，如今都被写成了改换国统的理由；昔日以复晋之名追随我的人，也已在劝我接受另一个名号。用印、告庙、朝贺，都有人筹备，只有这一声允诺还不能由旁人代说。我将文书合拢，望向傅亮。接下它，或让他再等一年，都要从我口中说出来。"
 hd_nbc.0260.a: "受禅，国号大宋。"
 hd_nbc.0260.b: "再等等。"
 # 天下通报
 hd_nbc.0901.t: "桓温平蜀"
 hd_nbc.0901.desc: "成都城门开了，成汉的国统随之断绝。晋荆州刺史[hd_news_a.GetName]溯江入蜀，攻破成都，将巴蜀重新置于晋廷的名义之下。那条曾被视为险阻的长江水路，终于成了胜军向西进取的道路。\n\n平蜀二字，使人们说起桓温时少了许多从前的轻慢。这份功业归于晋室，带兵完成它的人，却会因此得到更难忽视的声望。蜀中的旧臣要决定如何面对新朝，建康的朝臣也要重新看待这位立功的将领。昨日尚能凭门第与名位压住的人，今日已经拿出了真正的战果。往后朝中再议军务，那些曾轻视他的人，只怕也得先听他说完。"
 hd_nbc.0902.t: "前秦南征得胜"
 hd_nbc.0902.desc: "淮淝之间，晋军败了。[hd_news_a.GetName]率军南征得胜，将一场被反复争论的渡江之议，变成了已经发生的战果。人们谈起南北强弱时，再不能只将偏安或一统挂在嘴边。\n\n原以为江淮能够隔开战祸的人，开始将衣物与家书放进包裹，反复商量往哪里避难；也有人不肯走，守着田宅，盼望胜军过后不再征发。北来的将士终于能够高声称贺，南边等候家人归来的妇孺，却还在辨认败兵中的面孔。渡口边有人打听渡船，问还能带走多少东西；方才慷慨议论进退的人，也忽然低下了声音。旧日使他们安心留下的天险，此时已不能挡住追来的兵马。"
 hd_nbc.0903.t: "淝水之战"
 hd_nbc.0903.desc: "淝水败后，[hd_news_a.GetName]的南征大军溃退，北方各族降将纷纷自立。先前聚在同一道号令之下的兵马，又竖起了各自的旗帜；曾经跨过重重疆界的秦廷诏命，如今未必走得出眼前的关隘。\n\n人们复述败兵的惊惶，说风声与鸟鸣也会使他们回头奔逃。然而与惊惶一同传开的，还有忽然重新活过来的旧国名号。被征服者曾经低头，并不等于已经忘了自己的兵众与故土；一旦强者露出破绽，先前的归附便有了别的解释。昨日前往邻郡尚属同国，今日或许已经越境。北方的分裂，不只见于战场上，也见于每一道重新盘问行旅的城门。"
 hd_nbc.0904.t: "冉闵称帝"
 hd_nbc.0904.desc: "邺城又换了主人。[hd_news_a.GetName]诛杀石鉴，自立为帝，国号大魏；赵廷宗室间的争夺，终于被一位原在其下掌兵的人截断。新的国号已经传开，河北的兵争却仍未止息。\n\n人们又一次改口称帝。旧主的名号留在诏书上时曾何等尊贵，握不住兵权以后，却连自己的宫门也难保。依附石氏的人未必肯就此归顺，曾受石氏驱使的人，也未必都会随新旗而去。邺城的胜者可以当日登极，城外各处的人却还要决定，是否把家业与性命系在他的号令上。有人接过新诏，改口称大魏；也有人听见石氏的名字便避开，悄悄收起仍留着旧日称号的书信。"
 hd_nbc.0905.t: "苻健入关"
 hd_nbc.0905.desc: "[hd_news_a.GetName]率氐、羌部众西入关中，据长安，自称天王，国号大秦。随军转徙的人终于可以解下行囊，向孩子指出落脚的城邑，不必再用“往西去”回答他们的追问。\n\n可旧住的人也在望着这些车辆与马匹。他们关心的，是新来者要住在哪里，会不会占去田地，村口熟悉的水渠往后还能不能照旧取水。“安身”二字被人反复提起，竟各有各的意思：一路迁来的人求一处容身之地，已经住在这里的人，却怕自家的根本因此不保。长安已经有了天王，迁来的人仍在寻住处，原住的人则守在门前，打量着这些陌生的面孔。"
 hd_nbc.0910.t: "桓玄西走"
 hd_nbc.0910.desc: "楚军在覆舟山溃败，[hd_news_a.GetName]进入建康，[hd_news_b.GetName]却挟着晋安帝西走江陵。都城与天子的车驾分在了两处，沿江诸郡也不得不面对两边传来的号令。\n\n桓玄才以登极之礼据有宫阙，如今便须离开；刘裕带来的军队拿到了建康，迎回晋帝的事却仍未完成。那些一度按楚朝名号行事的人，此刻未必只为旧晋复兴而欢喜，也要担心自己从前留下的言语与文书。兵马改变了都城的主人，晋帝的车驾却仍在桓玄手中。有人急着称贺，有人急着改口，江上的舟船仍将这场争夺带向尚未安定的西方。"
 hd_nbc.0911.t: "晋室复兴"
 hd_nbc.0911.desc: "义熙的年号已经颁下。[hd_news_b.GetName]复位，[hd_news_a.GetName]录尚书事，执掌朝政；桓玄兵败身死，晋室的仪仗与诏命终于从这场篡夺中恢复了原来的名号。\n\n人们又称说晋臣了，可不久之前，他们还在两种国号之间迟疑。同一班朝臣回到殿上，同一批军士仍握着兵器，只是能够决定朝廷去留的人已经不同。恢复旧号，使一些人得以松一口气，也使另一些人不得不面对自己曾经投向楚朝的往事。复位的诏书能将名分重新接上，却不能将经历过的恐惧与选择一笔抹去。君臣今日再相见，许多话便只能留在称贺之后。"
 hd_nbc.0920.t: "刘宋代晋"
 hd_nbc.0920.desc: "晋廷的禅位诏书已经用印。[hd_news_a.GetName]受禅即帝位，国号大宋；曾经以恢复晋室聚拢兵众的人，如今已经成了新朝的开国之君。宫中的礼仪仍然郑重，礼仪所奉的君主却已经不同。\n\n人们想起这些年反复响起的忠义之言。讨桓、复晋、北伐所得的声望，最终都成了劝进的理由；昨日以晋臣自居的人，今日也将站进宋朝的班次。有人相信功业足以承受这份尊号，也有人只是不敢违逆已经定下的形势。晋室留在宗庙与旧人记忆中的岁月，不会因一道诏书消失，但此后真正颁发号令的，已经是另一个朝廷。"

 # 书签新增人物
 bm_hd_346_shi_hu: "石虎"
 bm_hd_346_shi_hu_subheading: "大赵天王"
 bm_hd_346_shi_hu_desc: "石虎是石勒的侄子，以残暴善战闻名。他废杀石勒之子自立，迁都于邺，关东、河北、关中都在他手里，是天下最强的君主。可他年过五十，诸子已经各怀异心。"
 bm_hd_346_murong_huang: "慕容皝"
 bm_hd_346_murong_huang_subheading: "燕王"
 bm_hd_346_murong_huang_desc: "慕容皝称燕王，都龙城，东破高句丽，北灭宇文部，又在这一年击破夫余。他奉晋正朔，却已有入主中原的打算，只等石赵露出破绽。"
 bm_hd_346_zhang_zhonghua: "张重华"
 bm_hd_346_zhang_zhonghua_subheading: "凉州牧、西平公"
 bm_hd_346_zhang_zhonghua_desc: "张氏据凉州已经四代，奉晋正朔、保境安民。张重华今年刚刚嗣位，年方弱冠，后赵的麻秋已经攻到枹罕城下。"
 bm_hd_404_yao_xing: "姚兴"
 bm_hd_404_yao_xing_subheading: "后秦天王"
 bm_hd_404_yao_xing_desc: "姚兴继父位以来，灭前秦残部，降后凉，取洛阳，关中、陇右尽归后秦。他崇佛礼贤，自降帝号为天王，西秦、南凉都向他称臣。只是柴壁一战败于北魏，东进之路已被挡住。"
 bm_hd_404_tuoba_gui: "拓跋珪"
 bm_hd_404_tuoba_gui_subheading: "魏帝"
 bm_hd_404_tuoba_gui_desc: "拓跋珪少年复国，参合陂坑杀燕军，夺取并州、河北，398 年定都平城称帝。他雄才大略，却日渐猜忌暴虐，宫中人人自危。"
 bm_hd_404_murong_de: "慕容德"
 bm_hd_404_murong_de_subheading: "南燕皇帝"
 bm_hd_404_murong_de_desc: "后燕被北魏打散后，慕容德率众南渡黄河，夺取青州，在广固称帝。他已年近七十，膝下无子，侄子慕容超远在长安。"
 hd_nbc.0145.t: "云龙门之变"
 hd_nbc.0145.desc: "夜已深了，来人仍不肯当着侍者说话。我屏退左右，他才报出宫中愿意接应者的姓名：只要我肯动手，今夜便有人打开宫门。话说完，他一直望着地面，连呼吸也放轻了。\n\n苻生近来的杀戮，使朝臣不敢直言，也使宗室人人自危。劝我早作决断的人，说的是保全苻氏；可宫门打开以后，走进去的终究是我，成败也终究要落在我身上。我将他所说的人名又问了一遍，听远处更鼓响起。天亮之后，未必还有同样的机会。是借这道门夺取大权，还是回绝他们，继续守着臣子的本分？"
 hd_nbc.0145.a: "举兵入宫，废暴君！"
 hd_nbc.0145.b: "君臣之分，不可逾越。"
 hd_nbc.0906.t: "苻坚即位"
 hd_nbc.0906.desc: "长安的宫门在夜里易手。[hd_news_a.GetName]入宫夺权，废杀旧主，自称大秦天王。原先使朝臣噤声的暴虐，终于成为众人公开说出的废主理由，而宫中的刀兵也已替这番声讨作了结。\n\n新主即位，那些曾在殿上避开目光的人，也须再次入朝。昨日不敢说的话，今日忽然可以出口；可他们熟悉的近臣、护卫与宗室，并不会随着一声贺礼便全换成另一群人。有人盼着不再因一句话获罪，也有人担心自己从前的迎合会被追究。宫门既开，活下来的人便要走进新的朝堂；他们所等的，不只是天王换了姓名，而是今后能不能安心把话说完。"
