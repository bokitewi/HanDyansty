 # 史实主线事件
 hd_nbc.0100.t: "病笃"
 hd_nbc.0100.desc: "入秋以来，你的病一天重过一天。太医退出寝殿时不敢抬头，左右近臣已经在私下议论后事。\n\n史书上，你的寿数到此为止。"
 hd_nbc.0100.a: "天命如此，交代后事吧。"
 hd_nbc.0100.b: "我还不能死！（再撑一年）"
 hd_nbc.0110.t: "成汉亡"
 hd_nbc.0110.desc: "三战三捷，大军直抵成都城下。李势面缚舆榇，出降军门。蜀地自李特据有，传国四十余年，至此复归晋土。\n\n捷报传到建康，朝野震动。从此以后，再没有人能小看你。"
 hd_nbc.0110.a: "露布告捷，送李势入建康。"
 hd_nbc.0120.t: "燕军南下"
 hd_nbc.0120.desc: "石虎一死，赵国诸子相残，河北大乱。幽州的守将或降或走，蓟城门户大开。\n\n诸将都说：中原无主，正是燕国入关的时候。"
 hd_nbc.0120.a: "三道并进，先取蓟城！"
 hd_nbc.0120.b: "按兵不动，静观其变。"
 hd_nbc.0130.t: "冉闵诛石鉴"
 hd_nbc.0130.desc: "石虎死后不到一年，邺城换了三个主人。新君石鉴想除掉你，却连刺客都派不出宫门。\n\n满城的赵人都在等你一句话。只要动手，邺城就是你的。"
 hd_nbc.0130.a: "诛石鉴，即帝位，国号大魏！"
 hd_nbc.0130.b: "我终究是石家养大的。"
 hd_nbc.0140.t: "西入关中"
 hd_nbc.0140.desc: "父亲苻洪被麻秋毒杀，临终嘱你西取关中。枋头的氐、羌部众都在等你下令。\n\n关中如今群雄并起，没人能挡住你们。"
 hd_nbc.0140.a: "焚桥西进，入长安！"
 hd_nbc.0140.b: "留在枋头，再等等。"
 hd_nbc.0150.t: "北伐"
 hd_nbc.0150.desc: "洛阳沦陷已近四十年，五陵荒废。你上表请求北伐，朝廷不敢不准。\n\n大军自江陵出发，经南阳北上，直指伊水。"
 hd_nbc.0150.a: "兵发伊洛，收复旧都！"
 hd_nbc.0150.b: "时机未到。"
 hd_nbc.0160.t: "投鞭断流"
 hd_nbc.0160.desc: "北方已定，只剩江南一隅。你召群臣议事，问攻晋之策。\n\n王猛临终曾说，晋虽偏安，正朔相承，不可轻图。可你手下百万之众，投鞭于江，足断其流。"
 hd_nbc.0160.a: "大举南征！"
 hd_nbc.0160.b: "王景略的话，还是听吧。"
 hd_nbc.0161.t: "淝水之后"
 hd_nbc.0161.desc: "淝水一败，风声鹤唳，草木皆兵。你逃回北方时，身边只剩一千多骑。\n\n各族降将原本就是暂时屈服，如今看出你已无力约束，一个个都离开了。"
 hd_nbc.0161.a: "朕何负于他们……"
 hd_nbc.0210.t: "覆舟山"
 hd_nbc.0210.desc: "京口起兵不过数日，北府义军已经杀到建康城北。覆舟山上，你的大军不战自溃，刘裕的旗帜插上了蒋山。\n\n殷仲文劝你挟天子西走江陵，那里还有桓氏的根本。"
 hd_nbc.0210.a: "弃建康，挟天子西走江陵。"
 hd_nbc.0210.b: "死守建康！"
 hd_nbc.0220.t: "峥嵘洲"
 hd_nbc.0220.desc: "桓玄西走以后，荆州诸郡还在观望。刘毅、何无忌率水军溯江而上，在峥嵘洲遇上桓玄的楼船。\n\n这一仗打赢了，晋室就能复兴。"
 hd_nbc.0220.a: "进讨桓玄，奉迎天子！"
 hd_nbc.0220.b: "先稳住江东再说。"
 hd_nbc.0230.t: "浮海南下"
 hd_nbc.0230.desc: "孙恩死后，残部推你为主，在海上漂泊多年。如今江东大乱，广州空虚，刺史吴隐之手下只有几千人。\n\n部众请你南下番禺，在岭南立足。"
 hd_nbc.0230.a: "扬帆南下，袭取番禺！"
 hd_nbc.0230.b: "海上自在，何必登岸。"
 hd_nbc.0240.t: "伐南燕"
 hd_nbc.0240.desc: "南燕慕容超屡次南侵淮北，掳掠百姓。朝中多数人认为，北方强敌环伺，不可轻出。\n\n你却看出，慕容超骄纵，广固孤城可下。"
 hd_nbc.0240.a: "北伐广固！"
 hd_nbc.0240.b: "不宜轻出。"
 hd_nbc.0250.t: "伐后秦"
 hd_nbc.0250.desc: "后秦姚兴死，诸子争位，关中人心离散。洛阳、长安两座旧都，就在眼前。\n\n水陆诸军已经集结，只等你一声令下。"
 hd_nbc.0250.a: "水陆并进，收复两京！"
 hd_nbc.0250.b: "再养几年兵。"
 hd_nbc.0260.t: "禅让"
 hd_nbc.0260.desc: "南平卢循，北灭燕、秦，你的功业已经超过了历代权臣。傅亮已经拟好了禅位诏书，就等你点头。\n\n晋室传国一百五十余年，到此为止。"
 hd_nbc.0260.a: "受禅，国号大宋。"
 hd_nbc.0260.b: "再等等。"
 # 天下通报
 hd_nbc.0901.t: "桓温平蜀"
 hd_nbc.0901.desc: "晋荆州刺史[hd_news_a.GetName]溯江入蜀，攻破成都，成汉亡。"
 hd_nbc.0902.t: "前秦南征得胜"
 hd_nbc.0902.desc: "[hd_news_a.GetName]大举南征，在淮淝之间击败晋军。南北之势，从此改观。"
 hd_nbc.0903.t: "淝水之战"
 hd_nbc.0903.desc: "[hd_news_a.GetName]百万大军在淝水溃败，风声鹤唳，草木皆兵。各族降将纷纷自立，北方再次分裂。"
 hd_nbc.0904.t: "冉闵称帝"
 hd_nbc.0904.desc: "[hd_news_a.GetName]在邺城诛杀石鉴，自立为帝，国号大魏。河北大乱。"
 hd_nbc.0905.t: "苻健入关"
 hd_nbc.0905.desc: "[hd_news_a.GetName]率氐、羌部众西入关中，据长安，自称天王，国号大秦。"
 hd_nbc.0910.t: "桓玄西走"
 hd_nbc.0910.desc: "[hd_news_a.GetName]在覆舟山击溃楚军，进入建康。[hd_news_b.GetName]挟持晋安帝西走江陵。"
 hd_nbc.0911.t: "晋室复兴"
 hd_nbc.0911.desc: "桓玄兵败峥嵘洲，被杀。[hd_news_b.GetName]复位，改元义熙。[hd_news_a.GetName]录尚书事，执掌朝政。"
 hd_nbc.0920.t: "刘宋代晋"
 hd_nbc.0920.desc: "[hd_news_a.GetName]受晋禅，即皇帝位，国号大宋。晋室传国一百五十余年，至此而终。"

 # 书签新增人物
 bm_hd_346_shi_hu: "虎"
 bm_hd_346_shi_hu_subheading: "大赵天王"
 bm_hd_346_shi_hu_desc: "石虎是石勒的侄子，以残暴善战闻名。他废杀石勒之子自立，迁都于邺，关东、河北、关中都在他手里，是天下最强的君主。可他年过五十，诸子已经各怀异心。"
 bm_hd_346_murong_huang: "皝"
 bm_hd_346_murong_huang_subheading: "燕王"
 bm_hd_346_murong_huang_desc: "慕容皝称燕王于龙城，东破高句丽，北灭宇文部，又在这一年击破夫余。他奉晋正朔，却已有入主中原的打算，只等石赵露出破绽。"
 bm_hd_346_zhang_zhonghua: "重华"
 bm_hd_346_zhang_zhonghua_subheading: "凉州牧、西平公"
 bm_hd_346_zhang_zhonghua_desc: "张氏据凉州已经四代，奉晋正朔、保境安民。张重华今年刚刚嗣位，才二十一岁，后赵的麻秋已经攻到枹罕城下。"
 bm_hd_404_yao_xing: "兴"
 bm_hd_404_yao_xing_subheading: "后秦天王"
 bm_hd_404_yao_xing_desc: "姚兴继父位以来，灭前秦残部，降后凉，取洛阳，关中、陇右尽归后秦。他崇佛礼贤，自降帝号为天王，西秦、南凉都向他称臣。只是柴壁一战败于北魏，东进之路已被挡住。"
 bm_hd_404_tuoba_gui: "珪"
 bm_hd_404_tuoba_gui_subheading: "魏帝"
 bm_hd_404_tuoba_gui_desc: "拓跋珪少年复国，参合陂坑杀燕军，夺取并州、河北，398 年定都平城称帝。他雄才大略，却日渐猜忌暴虐，宫中人人自危。"
 bm_hd_404_murong_de: "德"
 bm_hd_404_murong_de_subheading: "南燕皇帝"
 bm_hd_404_murong_de_desc: "后燕被北魏打散后，慕容德率众南渡黄河，夺取青州，在广固称帝。他已年近七十，膝下无子，侄子慕容超远在长安。"
 hd_nbc.0145.t: "云龙门之变"
 hd_nbc.0145.desc: "苻生即位以来，酗酒嗜杀，朝臣人人自危。王猛、吕婆楼劝你早作打算，说再迟一步，苻氏宗室就要被他杀光了。\n\n禁军中已经有人愿意为你打开宫门。"
 hd_nbc.0145.a: "举兵入宫，废暴君！"
 hd_nbc.0145.b: "君臣之分，不可逾越。"
 hd_nbc.0906.t: "苻坚即位"
 hd_nbc.0906.desc: "[hd_news_a.GetName]夜入长安宫城，废杀暴君，自称大秦天王。"
