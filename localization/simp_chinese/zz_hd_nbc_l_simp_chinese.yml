 # 五城水口兵变
 hd_nbc_xishu_army_name: "蜀中乱兵"
 hd_nbc.0001.t: "五城水口"
 hd_nbc.0001.desc: "蜀兵奉毛璩之命东下讨桓，行至五城水口，军中怨声四起。益州是边州，蜀人久苦征役，何必为江东卖命？\n\n侯晖、阳昧带着一群军士闯入你的营帐，跪地请你为主，要回师袭取成都。拒绝，他们未必放过你；答应，你就是第二个李特。"
 hd_nbc.0001.a: "既然如此，回师成都！"
 hd_nbc.0001.b: "我不能做这等事。（投水求去）"
