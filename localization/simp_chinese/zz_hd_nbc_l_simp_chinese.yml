 # 南北朝剧本（346「戡定岷峨」、404「京口起兵」）。计划见 docs/南北朝剧本_整合计划.md。
 bm_hd_group_nbc: "南北朝"
 bm_hd_346: "戡定岷峨"
 bm_hd_346_desc: "永和二年冬，石虎据邺称赵天王，关东、河北、关中尽为其有；慕容皝称燕王于辽西，张重华新嗣凉州，李势在成都荒淫失众。江左晋室幼主在位，褚太后临朝。\n\n十一月辛未，荆州刺史桓温不待朝命，自江陵溯江伐蜀。\n\n#bold 南北对峙之局，自此开端。#!"
 bm_hd_404: "京口起兵"
 bm_hd_404_desc: "元兴二年冬，桓玄废晋安帝，自立为楚帝。北方拓跋珪立魏于平城，姚兴据关中，慕容德立燕于广固，河西诸凉并立。\n\n元兴三年二月乙卯，北府旧将刘裕与刘毅、何无忌、孟昶等二十余人，于京口斩徐州刺史桓脩，举义讨玄。\n\n#bold 楚祚能否久长，晋室能否再造，皆在此时。#!"
 bm_hd_346_huan_wen: "桓温"
 bm_hd_346_huan_wen_subheading: "安西将军、荆州刺史"
 bm_hd_346_huan_wen_desc: "桓温尚南康长公主，三十四岁出镇荆州。成汉政乱，他上表即行，率偏师溯江入蜀。此战若成，他的威名将压倒朝中诸公。"
 bm_hd_346_yin_hao: "殷浩"
 bm_hd_346_yin_hao_subheading: "建武将军、扬州刺史"
 bm_hd_346_yin_hao_desc: "殷浩隐居十年，以清谈负盛名，被会稽王司马昱请出，执掌扬州以制衡桓温。他要证明名士也能治国用兵。"
 bm_hd_346_liu_qun: "刘群"
 bm_hd_346_liu_qun_subheading: "秦州刺史"
 bm_hd_346_liu_qun_desc: "刘群是晋司空刘琨之子，父死后流落河北，事石氏为官。身在胡廷，他仍不忘中原旧人。"
 bm_hd_346_liu_xuan: "刘玄"
 bm_hd_346_liu_xuan_subheading: "汉安乐公"
 bm_hd_346_liu_xuan_desc: "刘玄是蜀汉昭烈帝的曾孙、甘陵王刘永之孙。永嘉大乱，刘氏子孙几乎绝灭，唯他奔蜀，李雄封他为安乐公，奉后主之祀。无地无兵，只有一个姓氏。"
 bm_hd_346_yang_chu: "杨初"
 bm_hd_346_yang_chu_subheading: "仇池公"
 bm_hd_346_yang_chu_desc: "白马氐杨氏据仇池山已逾百年，在晋、赵、凉、成之间左右逢源。杨初要让这座山城在大国夹缝中继续存在。"
 bm_hd_404_huan_xuan: "桓玄"
 bm_hd_404_huan_xuan_subheading: "楚帝"
 bm_hd_404_huan_xuan_desc: "桓玄是桓温幼子，承父余烈，篡晋称楚不过三月。宗室子弟分镇诸州，京口却传来兵变的消息。"
 bm_hd_404_liu_yu: "刘裕"
 bm_hd_404_liu_yu_subheading: "建武将军、彭城内史"
 bm_hd_404_liu_yu_desc: "刘裕出身寒微，以北府兵起家，平孙恩之乱成名。如今他在京口举义，手下只有百余同谋，要以一隅之兵挑战整个桓楚。"
 bm_hd_404_fu_hong: "苻宏"
 bm_hd_404_fu_hong_subheading: "梁州刺史"
 bm_hd_404_fu_hong_desc: "苻宏曾是前秦太子，淝水之后流亡江南，如今是桓楚的梁州刺史。故国早已不在，他只能把命运押在桓玄身上。"
 hd_nbc_beifu_army_name: "北府义军"
 hd_nbc_war_cb: "南北征伐"
 hd_nbc_war_cb_desc: "南北朝的史实战争，只能由剧情发起。"
 HD_NBC_WAR_NAME: "[ATTACKER.GetPrimaryTitle.GetNameNoTierNoTooltip]伐[DEFENDER.GetPrimaryTitle.GetNameNoTierNoTooltip]之战"
 hd_nbc_war_victory_desc: "[attacker.GetShortUIName|U]夺取所争之地。"
 hd_nbc_war_white_peace_desc: "双方罢兵，各守故土。"
 hd_nbc_war_defeat_desc: "[attacker.GetShortUIName|U]兵败而还。"
