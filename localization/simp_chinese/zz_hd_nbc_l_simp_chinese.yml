 # 五城水口兵变
 hd_nbc_xishu_army_name: "蜀中乱兵"
 hd_nbc.0001.t: "五城水口"
 hd_nbc.0001.desc: "侯晖、阳昧进来时，后面跟着一群没有卸甲的军士。我才问了半句话，他们便齐齐跪下，请我领众回成都。帐外有人高声说起家中的田地，说蜀人受够了征发，不愿再顺江东下替别人送命。\n\n我认得这些一路同行的面孔，此刻却不敢叫任何一人起身。奉毛璩之命讨桓的军队，如今却宁愿违令返乡，也不肯再向前走；他们求我为主，也要我替所有人担下反叛的罪名。我往后退了一步，门前的兵刃便轻轻相碰。眼下若不答应，他们还会容我独自离开么？"
 hd_nbc.0001.a: "既然如此，回师成都！"
 hd_nbc.0001.b: "我不能做这等事。（投水求去）"
