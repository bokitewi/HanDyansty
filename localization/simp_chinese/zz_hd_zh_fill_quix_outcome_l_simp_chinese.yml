l_simp_chinese:
 quix_murder_outcome.1201.a:0 "会水者，世所罕见。"
 quix_murder_outcome.1201.b:0 "此计未免太过。"
 quix_murder_outcome.1201.desc:0 "你的心腹[acting_agent.GetTitledFirstName]探知幼童[target.GetTitledFirstName]将留宿湖畔别院。趁其无人看管，[acting_agent.GetSheHe]便可引其入水，使此事看来只是一场失足溺亡。"
 quix_murder_outcome.1201.no_acting_agent:0 "你的同谋探知幼童[target.GetTitledFirstName]将留宿湖畔别院。待无人留意之时，便可将孩童引入水中，使此案看来只是一场失足溺亡。"
 quix_murder_outcome.1201.t:0 "湖畔习水"
 quix_murder_outcome.1202.a:0 "奥德修斯若悦，吾亦欣然。"
 quix_murder_outcome.1202.b:0 "非此本意。"
 quix_murder_outcome.1202.desc:0 "你的心腹[acting_agent.GetTitledFirstName]备下一匹精巧的木马，欲暗中送与[target.GetTitledFirstName]。木马腹中藏有毒蛛，待孩童把玩之时机关发动，使死因看来只是一场不幸的虫咬。"
 quix_murder_outcome.1202.no_acting_agent:0 "你的同谋正欲暗中将一匹精巧的特洛伊木马送与[target.GetTitledFirstName]。木马腹中藏有毒蛛，待孩童把玩之时机关发动，使死因看来只是一场不幸的虫咬。"
 quix_murder_outcome.1202.t:0 "特洛伊木马"
 quix_murder_outcome.1203.a:0 "此事须用谋略。"
 quix_murder_outcome.1203.b:0 "此计吾不喜。"
 quix_murder_outcome.1203.desc:0 "你的心腹[acting_agent.GetTitledFirstName]已得[target.GetTitledFirstName]的笔迹，可仿其手书一封离府之信。只要将这懵懂孩童诓骗离去，旁人便只会以为[target.GetSheHe]是自行出走。"
 quix_murder_outcome.1203.no_acting_agent:0 "你的同谋已得[target.GetTitledFirstName]的笔迹，可仿其手书一封离府之信。只要将这懵懂孩童诓骗离去，旁人便只会以为[target.GetSheHe]是自行出走。"
 quix_murder_outcome.1203.t:0 "伪造出走书"
 quix_murder_outcome.1204.a:0 "此处最宜幼子。"
 quix_murder_outcome.1204.b:0 "此计太过浅陋。"
 quix_murder_outcome.1204.desc:0 "你的心腹[acting_agent.GetTitledFirstName]已买通[target.GetTitledFirstName]的一名守卫，许以事后助其脱身。守卫只需趁无人注目之时，将婴孩投入护城河中。"
 quix_murder_outcome.1204.no_acting_agent:0 "你的同谋已买通[target.GetTitledFirstName]处的一名乳母，许以事后助其脱身。乳母只需趁无人留意之际，将婴孩投入护城河中。"
 quix_murder_outcome.1204.t:0 "倒水连婴"
 quix_murder_outcome.1205.a:0 "情之为物，最是险恶。"
 quix_murder_outcome.1205.b:0 "此说不然。"
 quix_murder_outcome.1205.desc:0 "你的心腹[acting_agent.GetTitledFirstName]探知幼童[target.GetFirstNameNoTooltip]已有心上之人，便可假扮其情郎，约其子夜私会。等候[target.GetHerHim]的，将不是心上之人，而是你的人。"
 quix_murder_outcome.1205.no_acting_agent:0 "你的同谋探知幼童[target.GetFirstNameNoTooltip]已有心上之人，你便可假扮其情郎，约其子夜私会。等候[target.GetHerHim]的，将不是心上之人，而是你的人。"
 quix_murder_outcome.1205.t:0 "子夜之约"
 quix_murder_outcome.1206.a:0 "且将此事记下。"
 quix_murder_outcome.1206.b:0 "再思量一番。"
 quix_murder_outcome.1206.desc:0 "你的心腹[acting_agent.GetTitledFirstName]正谋夜入育儿室，悄悄将[target.GetTitledFirstName]带走。只要这孩童被送至远离宫城之处，此后便无人能寻得。"
 quix_murder_outcome.1206.no_acting_agent:0 "你的同谋正谋夜入育儿室，悄悄将[target.GetTitledFirstName]带走。只要这孩童被送至远离宫城之处，此后便无人能寻得。"
 quix_murder_outcome.1206.t:0 "夜半掳童"
 quix_murder_outcome.1301.a:0 "少养一口，[prison_owner.GetFirstNameNoTooltip]当不介意。"
 quix_murder_outcome.1301.b:0 "时机未至，且缓。"
 quix_murder_outcome.1301.desc:0 "[target.GetTitledFirstName]被囚于[prison_owner.GetTitledFirstNamePossessive]地牢之中，而你已买通了送饭之人。每日掺入少许毒药，循序渐进，[target.GetHerHis]之死便会被误认为囚中所染的重病。"
 quix_murder_outcome.1301.t:0 "地牢瘴气"
 quix_murder_outcome.1302.a:0 "甚好，但须用山贼，且勿告知其雇主为谁。"
 quix_murder_outcome.1302.b:0 "此计太险，不可行。"
 quix_murder_outcome.1302.desc:0 "[target.GetTitledFirstName]软禁之中，身边常有守卫看守。你的人可假作前来营救[target.GetHerHim]，再趁乱设下致命之局。此乃少数能够接近[target.GetHerHim]的法子。"
 quix_murder_outcome.1302.t:0 "假意营救"
 quix_murder_outcome.1303.a:0 "须折损几人？"
 quix_murder_outcome.1303.b:0 "此计岂是良策？"
 quix_murder_outcome.1303.desc:0 "外人难以潜入[prison_owner.GetTitledFirstNamePossessive]地牢，然而消息可自墙基的裂隙中传递。你已许诺照料某囚犯的家眷，作为交换，其愿为你除去与其同囚一室的[target.GetTitledFirstName]。"
 quix_murder_outcome.1303.t:0 "狱中交易"
 quix_murder_outcome.1304.a:0 "吾心如焚！"
 quix_murder_outcome.1304.b:0 "此计恐非善策。"
 quix_murder_outcome.1304.desc:0 "[target.GetTitledFirstName]软禁之中，守备森严。你的人正备好火油，欲在后门纵火，逼[target.GetHerHim]从正门逃出，而伏于屋顶的弓手便将伺机而发。"
 quix_murder_outcome.1304.t:0 "焚屋之计"
 quix_murder_outcome.2201.a:0 "少了一桩麻烦。"
 quix_murder_outcome.2201.a.discovered:0 "可见习水之术，何等要紧！"
 quix_murder_outcome.2201.opening:0 "[target.GetTitledFirstName]已溺水身亡！\n\n[target.GetHerHis|U]在水中的最后挣扎终归于沉寂，尸身沉入湖底，直至次日方被发觉。"
 quix_murder_outcome.2201.scheme_owner_known:0 "\n\n然而似有目击者将全过程看在眼里！你的刺客已被擒下，此番黑幕如今众人皆知，你亦难以置身事外。"
 quix_murder_outcome.2201.scheme_unknown:0 "\n\n一切迹象皆指向一场惨烈意外。至少无人疑心到你头上。"
 quix_murder_outcome.2201.t:0 "习水失手"
 quix_murder_outcome.2202.a:0 "此法永不过时。"
 quix_murder_outcome.2202.a.discovered:0 "连我也驾驭不住此蛛！"
 quix_murder_outcome.2202.opening:0 "[target.GetTitledFirstName]已然毙命！\n\n你那只名为希腊小蛛的毒物自藏身之处爬出，毒液止住了[target.GetHerHis]幼小的心跳。"
 quix_murder_outcome.2202.scheme_owner_known:0 "\n\n可惜此计并不如你想象般万无一失。藏有毒物的木马一经发现，运送的刺客便被查获擒下！如今众人皆知此事与你有所牵连。"
 quix_murder_outcome.2202.scheme_unknown:0 "\n\n似乎无人察觉孩童之死背后的阴毒用心。"
 quix_murder_outcome.2202.t:0 "莫信木马"
 quix_murder_outcome.2203.a:0 "世道险恶啊。"
 quix_murder_outcome.2203.a.discovered:0 "想来小儿不日便会归府！"
 quix_murder_outcome.2203.opening:0 "愚蠢的[target.GetTitledFirstName]已遭杀害！\n\n[target.GetTitledFirstName]独自行走时遭人伏击。刺客将尸首运往远处，埋于隐秘之地。又仿孩童笔迹留下一封书信，言其心中怨恨众人，只愿独处。"
 quix_murder_outcome.2203.scheme_owner_known:0 "\n\n然而坏消息是，此事竟以你那蠢笨刺客自己的印信封缄！这拙劣之计已被揭穿，你的牵连人尽皆知。"
 quix_murder_outcome.2203.scheme_unknown:0 "这般年纪的孩童大多离家出走，谁会起疑！\n\n"
 quix_murder_outcome.2203.t:0 "一去不返"
 quix_murder_outcome.2204.a:0 "依吾看来，此乃仁德之举。"
 quix_murder_outcome.2204.a.discovered:0 "荒谬！是她自己失手，如今还要推诿！"
 quix_murder_outcome.2204.opening:0 "小[target.GetTitledFirstName]已不在人世！\n\n这无助的孩童被从窗中抛下，死于浑浊不流的护城河中。真是残酷的命运。"
 quix_murder_outcome.2204.scheme_owner_known:0 "\n\n不幸的是，数十名证人亲眼见那乳母将婴孩从窗中抛下！她很快便被拿下，审讯之下即刻崩溃！你在此事中的角色已然全部暴露。"
 quix_murder_outcome.2204.scheme_unknown:0 "\n\n乳母已然脱身，此事看来不过是一场残酷的悲剧。"
 quix_murder_outcome.2204.t:0 "倒水连婴"
 quix_murder_outcome.2205.a:0 "情战之道，本无常理。"
 quix_murder_outcome.2205.a.discovered:0 "此事甚是不便。"
 quix_murder_outcome.2205.opening:0 "你的刺客已成功除去幼童[target.GetTitledFirstName]。\n\n[target.GetTitledFirstName]刚抵达约定之地不久，一名刺客便自暗影中闪出，以巨石将其砸死。"
 quix_murder_outcome.2205.scheme_owner_known:0 "\n\n然而孩童临死前的哭喊惊动了守卫，刺客当即被擒！此番惨事之中，你的身份已然暴露。"
 quix_murder_outcome.2205.scheme_unknown:0 "\n\n处理完尸首后，刺客趁夜色悄然离去，无人知晓。"
 quix_murder_outcome.2205.t:0 "夜会遇刺"
 quix_murder_outcome.2206.a:0 "天道残酷。"
 quix_murder_outcome.2206.a.discovered:0 "我？荒谬至极！"
 quix_murder_outcome.2206.opening:0 "幼小的[target.GetTitledFirstName]已不在府中。\n\n计划进行得十分顺利，孩童被带往乡间一座深山的峰顶，弃在那里，任其听天由命。"
 quix_murder_outcome.2206.scheme_owner_known:0 "\n\n不幸的是，刺客的罪行留下了线索，直指你！"
 quix_murder_outcome.2206.scheme_unknown:0 "在众人眼中，那孩子不过是凭空消失了。\n\n"
 quix_murder_outcome.2206.t:0 "山巅弃童"
 quix_murder_outcome.2301.a:0 "且去继续今日之事。"
 quix_murder_outcome.2301.a.discovered:0 "吾实不解，众人何以如此不快。"
 quix_murder_outcome.2301.heh:0 "说来实在，我倒希望这痛楚能再持续得久一些。"
 quix_murder_outcome.2301.no_awareness_1:0 "\n\n表面看来，这不过又是地下恶气熏蒸下的又一名牺牲者罢了。"
 quix_murder_outcome.2301.opening_1:0 "[target.GetTitledFirstName]在[prison_owner.GetTitledFirstName]的地牢中突然倒地，似是染上了可怖的急症。不过数日，[target.GetHerHim]的性命便渐渐离去了。"
 quix_murder_outcome.2301.owner_is_known_1:0 "\n\n然而坏消息是，地牢守卫当即被疑受贿，经不住逼问而崩溃！你的计谋已被[prison_owner.GetTitledFirstName]查明揭露。"
 quix_murder_outcome.2301.t:0 "地牢瘴气"
 quix_murder_outcome.2302.a:0 "救出！不错，正是如此！"
 quix_murder_outcome.2302.a.discovered:0 "尔等竟信乱民，不信于我？"
 quix_murder_outcome.2302.no_awareness_1:0 "\n\n此计似已成功：无人以为这是一场暗杀，反倒当作一场英勇营救，只可惜中途出了岔子！不言而喻，无人怀疑你有心营救[target.GetHerHim]。"
 quix_murder_outcome.2302.opening_1:0 "[target.GetTitledFirstName]已遭杀害！所谓的救援之人冲入府中，制服守卫，擒下[target.GetFirstNameNoTooltip]，将[target.GetHerHim]扶上马背，意欲逃走。逃脱之后，刺客才以箭矢将[target.GetTitledFirstName]射伤，又将尸身弃于路旁，使此事看来似是行动出了差错。"
 quix_murder_outcome.2302.owner_is_known_1:0 "\n\n此计太过干净。可惜那雇来的人彻夜吹嘘此事！不幸的是，这秘密如今已是人尽皆知。"
 quix_murder_outcome.2302.t:0 "假意营救"
 quix_murder_outcome.2303.a:0 "这下可以松一口气了。"
 quix_murder_outcome.2303.a.discovered:0 "此等指控，全属无稽！"
 quix_murder_outcome.2303.heh:0 "我甚至能听见自己喉管咯咯作响！耳中似有乐声奏起。\n\n"
 quix_murder_outcome.2303.no_awareness_1:0 "\n\n那囚徒困于狱中，如同坑中之鼠。无人会信此事与你有半点干系。"
 quix_murder_outcome.2303.opening_1:0 "[target.GetTitledFirstName]已然毙命！被另一名囚徒勒死。这般无耻之人，得了个同样无耻的结局！"
 quix_murder_outcome.2303.owner_is_known_1:0 "\n\n然而并非全是好消息。虽则得手，谈话似已被人偷听，你的刺客亦已被擒！他们指认你才是这一切的幕后主谋。"
 quix_murder_outcome.2303.t:0 "狱中交易"
 quix_murder_outcome.2304.a:0 "烧得好，烧得透！"
 quix_murder_outcome.2304.a.discovered:0 "尔等竟信那群凶手？"
 quix_murder_outcome.2304.no_awareness_1:0 "\n\n烈焰很快失去控制，尸身尽被焚毁！看来无人察觉这是刺客的谋害……"
 quix_murder_outcome.2304.opening_1:0 "[target.GetTitledFirstName]于深夜自烈火中逃出时，[target.GetSheHe]被一名埋伏的弓手射杀。数支箭矢正中要害，[target.GetSheHe]倒在台阶之上，血染了[target.GetHerHis]的衣襟。"
 quix_murder_outcome.2304.owner_is_known_1:0 "\n\n然而事情并未照计划行事，弓手很快被擒，受刑之下招供，将你牵扯了进来！"
 quix_murder_outcome.2304.t:0 "焚屋之计"
 quix_murder_outcome.4201.a:0 "须将其按入水中！"
 quix_murder_outcome.4201.a.discovered:0 "吾只为护童，免遭水厄！"
 quix_murder_outcome.4201.agent.scheme_owner_known:0 "[acting_agent.GetFirstNameNoTooltip]为愧疚所压，竟已将你的计划尽数吐露！"
 quix_murder_outcome.4201.agent.scheme_unknown:0 "然而[acting_agent.GetFirstNameNoTooltip]恐怕再教不得习水之课了。所幸无人看出这是一场阴谋。"
 quix_murder_outcome.4201.failure_declaration_1:0 "小[target.GetTitledFirstName]又活过来了！看来这小家伙如今竟能像鱼儿一般游水了！"
 quix_murder_outcome.4201.failure_declaration_2:0 "可恶！那讨厌的孩子[target.GetTitledFirstName]躲过了我们的计划！刺客以为得手，直到几分钟后，那孩子却从湖的另一侧爬了出来。"
 quix_murder_outcome.4201.failure_declaration_3:0 "[target.GetTitledFirstName]确已落水，可惜溺得不够深！路人将孩童救起，又设法救活了那已无气息的身躯，此计遂告失败！"
 quix_murder_outcome.4201.noagent.scheme_owner_known:0 "然而你的刺客为愧疚所压，竟背叛了你的计划！"
 quix_murder_outcome.4201.noagent.scheme_unknown:0 "然而所幸此番失败的阴谋尚无人知晓。"
 quix_murder_outcome.4201.t:0 "湖畔习水"
 quix_murder_outcome.4202.a:0 "吾喜蛛，但勿近吾身。"
 quix_murder_outcome.4202.a.discovered:0 "尽是谎言！此等蠢计，吾绝不许。"
 quix_murder_outcome.4202.agent.scheme_owner_known:0 "[acting_agent.GetFirstNameNoTooltip]为愧疚所压，竟已将你的计划尽数吐露！"
 quix_murder_outcome.4202.agent.scheme_unknown:0 "所幸无人看出这是一场阴谋，至少不是你的阴谋。"
 quix_murder_outcome.4202.failure_declaration_1:0 "刺杀[target.GetTitledFirstName]之计已然失败！那孩子不屑收下礼物，竟命人将它撤走了！"
 quix_murder_outcome.4202.failure_declaration_2:0 "看来那匹载满毒蛛的木马未能杀死幼童[target.GetTitledFirstName]。是机关失灵，还是毒蛛未能被唤醒以行其事，无人得知。"
 quix_murder_outcome.4202.failure_declaration_3:0 "[target.GetTitledFirstName]尚未除去，倒是那毒蛛误杀了一名洒扫妇人！"
 quix_murder_outcome.4202.noagent.scheme_owner_known:0 "然而你的刺客为愧疚所压，竟背叛了你的计划！"
 quix_murder_outcome.4202.noagent.scheme_unknown:0 "所幸此番蠢举并未使人察觉你的干系，否则可就颇为尴尬了。"
 quix_murder_outcome.4202.t:0 "特洛伊木马"
 quix_murder_outcome.4203.a:0 "下回，当干脆利落些。"
 quix_murder_outcome.4203.a.discovered:0 "吾？尔等已擒此徒，与吾何干！"
 quix_murder_outcome.4203.agent.scheme_owner_known:0 "[acting_agent.GetFirstNameNoTooltip]当场被擒，连同往来书信一并落入人手！"
 quix_murder_outcome.4203.agent.scheme_unknown:0 "你的刺客戴着面罩，这一次竟得脱身！你的身份仍未暴露，只是下回未必有此好运。"
 quix_murder_outcome.4203.failure_declaration_1:0 "不幸的是，你的刺客刺杀[target.GetTitledFirstName]失手。这孩子已近似少年，竟奋力反抗，刺客的小腿在搏斗中被伤得厉害！"
 quix_murder_outcome.4203.failure_declaration_2:0 "失败了。[target.GetTitledFirstName]仍然活着，依旧是你的心腹之患。刺客刚一离去，字条便被人发现，搜寻之人随即出动，孩童及时获救！"
 quix_murder_outcome.4203.failure_declaration_3:0 "惨败！[target.GetTitledFirstName]非但未死，连一根毫毛也未曾伤到！这孩子竟得以脱身，避过刺客，呼救求援，坏了你的大计！"
 quix_murder_outcome.4203.noagent.scheme_owner_known:0 "你那愚蠢的刺客已被擒获，身上带着你的密令！此事如今已为众人所知。"
 quix_murder_outcome.4203.noagent.scheme_unknown:0 "你的刺客罩着兜帽、戴着面甲，得以匿名遁去。于这残酷的棋局中，也算是一份幸运。"
 quix_murder_outcome.4203.t:0 "逃之夭夭"
 quix_murder_outcome.4204.a:0 "且再从长计议。"
 quix_murder_outcome.4204.a.discovered:0 "此乃精心设局，欲陷吾于罪！"
 quix_murder_outcome.4204.agent.scheme_owner_known:0 "看守被擒，供出了[acting_agent.GetFirstNameNoTooltip]，此人正在送你的书信时被拿下！你的干系已然暴露。"
 quix_murder_outcome.4204.agent.scheme_unknown:0 "所幸[acting_agent.GetFirstNameNoTooltip]及时看见那看守已经逃走，你的干系尚无人知。"
 quix_murder_outcome.4204.failure_declaration_1:0 "刺杀幼童[target.GetTitledFirstName]之计已然失败！孩童被掷出窗外落入护城河中，很快便被一名路人救起！"
 quix_murder_outcome.4204.failure_declaration_2:0 "全盘皆输。[target.GetTitledFirstName]并未溺毙，那看护之人竟未能成事！"
 quix_murder_outcome.4204.failure_declaration_3:0 "吾早料此计太过容易！[target.GetTitledFirstName]仍然活着。计划起初虽然得手，看来孩童却被城中守卫发现，自水中捞起，竟还是救活了！"
 quix_murder_outcome.4204.noagent.scheme_owner_known:0 "看守已被擒获，供出了你的刺客，那刺客正在给你写信时被捕！你的干系已然暴露。"
 quix_murder_outcome.4204.noagent.scheme_unknown:0 "所幸那看守安然脱身，你在此事中的角色仍无人知晓。"
 quix_murder_outcome.4204.t:0 "倒水连婴"
 quix_murder_outcome.4205.a:0 "吾亦寄望于此计。"
 quix_murder_outcome.4205.a.discovered:0 "吾何故要害[target.GetTitledFirstName]？"
 quix_murder_outcome.4205.agent.scheme_owner_known:0 "[acting_agent.GetFirstNameNoTooltip]与你的刺客皆已落网，此案来龙去脉已然暴露。"
 quix_murder_outcome.4205.agent.scheme_unknown:0 "所幸刺客已悄然脱身，未被发觉。"
 quix_murder_outcome.4205.failure_declaration_1:0 "你的刺客未能杀死[target.GetTitledFirstName]！那孩子走到约定之地时，竟已逃脱！"
 quix_murder_outcome.4205.failure_declaration_2:0 "刺杀[target.GetTitledFirstName]之事失败了。看来这孩子竟然奋起反抗！"
 quix_murder_outcome.4205.failure_declaration_3:0 "可叹[target.GetTitledFirstName]仍然活着！这整件事竟是为刺客们设下的圈套！"
 quix_murder_outcome.4205.noagent.scheme_owner_known:0 "你的刺客已被生擒，那叛徒指认你乃幕后主谋。"
 quix_murder_outcome.4205.noagent.scheme_unknown:0 "所幸刺客已悄然脱身，未被发觉。"
 quix_murder_outcome.4205.t:0 "暗中倾慕"
 quix_murder_outcome.4206.a:0 "此计确实简陋。"
 quix_murder_outcome.4206.a.discovered:0 "胡言！此乃勒索！"
 quix_murder_outcome.4206.agent.scheme_owner_known:0 "[acting_agent.GetFirstNameNoTooltip]在行动中被截下逮捕。受审之时，[acting_agent.GetSheHe]供出了你的部分计划！"
 quix_murder_outcome.4206.agent.scheme_unknown:0 "虽则刺客可以悄然脱身，然孩童夜间所受守护远超预料，此计恐难如愿。"
 quix_murder_outcome.4206.failure_declaration_1:0 "可惜，[target.GetTitledFirstName]尚未解决！"
 quix_murder_outcome.4206.failure_declaration_2:0 "小[target.GetTitledFirstName]仍然活着！"
 quix_murder_outcome.4206.failure_declaration_3:0 "刺杀[target.GetTitledFirstName]之事失败了。"
 quix_murder_outcome.4206.noagent.scheme_owner_known:0 "你的刺客在行动中被拿下。受审之后，那叛徒供出了你的名字。"
 quix_murder_outcome.4206.noagent.scheme_unknown:0 "虽则刺客可以悄然脱身，然孩童夜间所受守护远超预料，此计恐难如愿。"
 quix_murder_outcome.4206.t:0 "事泄"
 quix_murder_outcome.4301.a:0 "罢了，罢了。"
 quix_murder_outcome.4301.a.discovered:0 "胡说！吾何罪之有？"
 quix_murder_outcome.4301.failure:0 "不幸的是，[target.GetTitledFirstName]仍被牢牢锁在里头。你所得之物似乎毫无效用；据传[target.GetTitledFirstName]如今反倒比先前更加康健。"
 quix_murder_outcome.4301.scheme_owner_known:0 "\n\n然而此计比白费功夫还要糟糕：狱卒因莫名暴富而被疑受贿，审讯之中，竟将你的角色尽数供出！你心如刀割。"
 quix_murder_outcome.4301.scheme_unknown:0 "\n\n所幸无人知晓你原先的图谋。只是那狱卒似已被与你的干系吓破了胆，今后纵有何事，他也不再肯接应了。"
 quix_murder_outcome.4301.t:0 "地牢瘴气"
 quix_murder_outcome.4302.a:0 "早该一把火烧了那处……"
 quix_murder_outcome.4302.a.discovered:0 "不错，是吾所为！吾只想救[target.GetHerHim]出狱！"
 quix_murder_outcome.4302.failure:0 "[target.GetTitledFirstName]仍然活着！你为[target.GetHerHim]所布的繁复调度尽数落空。守卫抵死拒守，很快又得了增援。机会已然错过，攻者只得败退。"
 quix_murder_outcome.4302.scheme_owner_known:0 "\n\n他们在战中欲要撤退，然而援兵渐至，终被包围而降！他们竟供出你是雇主！"
 quix_murder_outcome.4302.scheme_unknown:0 "\n\n至少放士卒逃生，也算存了一丝仁心。他们战时声称是来营救[target.GetTitledFirstName]的，这搅乱了局面，无人推断出你的牵连。"
 quix_murder_outcome.4302.t:0 "假意营救"
 quix_murder_outcome.4303.a:0 "无甚珍贵之物受损。"
 quix_murder_outcome.4303.a.discovered:0 "吾早知此不过是一场戏言！"
 quix_murder_outcome.4303.failure:0 "任由几名囚徒胡乱去刺杀[target.GetTitledFirstName]，那本就薄弱的阴谋，果然毫无结果。"
 quix_murder_outcome.4303.scheme_owner_known:0 "\n\n事实证明，此囚徒根本不存在！你那些愚蠢的刺客竟与守卫攀谈，所言之事指的是营房而非地牢，如今已尽数被擒！"
 quix_murder_outcome.4303.scheme_unknown:0 "看来你的刺客在搏斗中已被打死，头颅撞碎在石地上！这便是那些刺客的底细。至少随他们一同殒命的，还有对其动机的一切理解……\n\n"
 quix_murder_outcome.4303.t:0 "狱中交易"
 quix_murder_outcome.4304.a:0 "或许该更直接一些？"
 quix_murder_outcome.4304.a.discovered:0 "显然，此人乃是来陷害吾的！"
 quix_murder_outcome.4304.failure:0 "刺杀[target.GetTitledFirstName]之计失败了。那些刺客不顾严寒，决意强行推进，然而草车点不燃，他们在欲直冲屋宇之时被人发现，终是徒劳。"
 quix_murder_outcome.4304.scheme_owner_known:0 "更糟的是，这些蠢货逃不得几步便被擒下！他们供称你亦牵涉其中，你的角色已然泄露！\n\n"
 quix_murder_outcome.4304.scheme_unknown:0 "\n\n所幸他们能够解释其可疑的举动，并迅速脱身。至少你与此事的干系仍不为人知。"
 quix_murder_outcome.4304.t:0 "焚屋之计"
 quix_murder_outcome.5001.generic:0 "一名刺客忽然现身于你面前。你只来得及感到一阵惊恐，便已明白敌人得手了。意识渐渐远去之际，你心头最后掠过的，是那死后未知的幽冥。"
 quix_murder_outcome.5002.generic:0 "一名可靠之人刚入帐来报，说有人欲来行刺你，却被识破阻止了！那班狗贼若想抓你，须得更加卖力才行！"
