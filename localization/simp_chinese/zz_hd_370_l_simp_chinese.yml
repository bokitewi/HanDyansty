 hd_370.0110.t: "金墉之围"
 hd_370.0110.desc: "王猛的信送进城来，写得客气，说洛阳孤悬在外，救兵未必能到，不如早作打算。我把信看了两遍，又叫人去城头看看石门那边的烽火。\n\n乐安王的援军确实来了，却迟迟没有消息。城中粮草还够吃一阵，人心却比粮草消耗得快。开城投降，我和城里的人或许都能活下来，燕国却要失去洛阳；守下去，就得指望援军真的打得过秦人。"
 hd_370.0110.a: "开城降秦。"
 hd_370.0110.b: "固守金墉，等候援军。"

 hd_370.0120.t: "东征燕国"
 hd_370.0120.desc: "王猛把行军的路线摊在案上：出蒲阪，过壶关，取晋阳，再直下邺城。他说燕国看上去庞大，其实君臣离心，慕容评只知道敛财，真打起来未必有人肯为他卖命。\n\n可这一仗一旦打响，就没有回头路了。秦国的兵力远不如燕，若是顿兵坚城之下，关中也会跟着空虚。王猛等我开口。"
 hd_370.0120.a: "命王猛东征。"
 hd_370.0120.b: "时机未到，暂且休兵。"

 hd_370.0130.t: "邺城失守"
 hd_370.0130.desc: "夜里北门忽然打开，城中的扶余质子放秦兵进了城。等我被人从睡梦中叫醒，宫外已经到处是火光。\n\n身边的人劝我趁乱出城，往北回龙城去，那里是慕容氏起家的地方，还能重新聚起人马；也有人说秦王向来宽厚，出城请降，至少能保全宗族。我手里只剩下这一座宫城，究竟该往哪里去？"
 hd_370.0130.a: "出城请降。"
 hd_370.0130.b: "趁乱北走龙城。"

 hd_370.0135.t: "燕国覆亡"
 hd_370.0135.desc: "邺城已经陷落，天子出降的消息传来，我身边的人一夜之间散了大半。秦人一定会追究潞川的败军之罪，也会清算我这些年敛下的财货。\n\n东边的高句丽还能收留我，只是寄人篱下，前途难料；留下来向秦王请罪，生死就全凭他一念之间了。"
 hd_370.0135.a: "投奔高句丽。"
 hd_370.0135.b: "留下来听候发落。"

 hd_370.0140.t: "征讨寿春"
 hd_370.0140.desc: "大司马的表章送进宫来，说袁氏据寿春叛国，勾结燕、秦，请朝廷下诏讨伐。表章写得义正辞严，谁都知道，这一仗打完，桓温的声势又要高上一层。\n\n可是寿春若一直留在叛贼手里，淮南就永无宁日。下诏讨伐，是替国家除患，也是替大司马添功；不下诏，大司马未必就不会自己动手。"
 hd_370.0140.a: "下诏讨伐寿春。"
 hd_370.0140.b: "朝廷不出兵。"

 hd_370.0145.t: "寿春之役"
 hd_370.0145.desc: "朝廷的诏书到了广陵，要我领兵讨伐寿春。枋头一败，我正需要一场胜仗挽回声望；可寿春城坚粮足，袁氏又有燕、秦两边的援兵，一旦久攻不下，只会更让人看笑话。\n\n郗超劝我出兵，说只要拿下寿春，天下人就会忘了枋头。将士们也在等我的命令。"
 hd_370.0145.a: "亲率大军围攻寿春。"
 hd_370.0145.b: "让朝廷自己去打。"

 hd_370.0148.t: "寿春被围"
 hd_370.0148.desc: "晋军已经在城外扎下营寨，壕沟一天比一天深。燕国答应的援兵还没有到，秦国的使者来了又走，只留下几句空话。\n\n城里的将士还肯听我号令，粮仓也还没有见底。死守下去，或许能等到转机；开城投降，朝廷未必会饶过叛逆之罪。"
 hd_370.0148.a: "死守寿春。"
 hd_370.0148.b: "开城出降。"

 hd_370.0150.t: "废立之议"
 hd_370.0150.desc: "郗超夜里来见，说枋头之后，人心已经不如从前，要想重新立威，只有行伊尹、霍光之事。天子在位以来并无过失，他便提议从宫闱里找出一个能让人相信的理由。\n\n会稽王素有清名，若由他继位，朝野大概不会有太多异议。这件事一旦做了，便再也没有退路；若是不做，我这些年积下的威望，也许就会一点点散去。"
 hd_370.0150.a: "废掉海西公，改立会稽王。"
 hd_370.0150.b: "此事不可行。"

 hd_370.0160.t: "太后之令"
 hd_370.0160.desc: "大司马带着百官入宫，请太后下令废黜我，说我「不能人道」，宫中子嗣都不是我的骨肉。殿上没有一个人站出来替我说话，连平日最亲近的侍从也低着头。\n\n我若顺从，便是答应交出帝位；此后如何安身，也只能由别人安排。我若不从，就只能指望宫外还有人肯为天子拼命，而桓温的大军就在城外。"
 hd_370.0160.a: "答应逊位。"
 hd_370.0160.b: "朕是天子，绝不退位。"

 hd_370.0170.t: "受命为帝"
 hd_370.0170.desc: "百官奉着玉玺来到会稽王府，请我即皇帝位。我知道这不是天命，而是大司马的意思；从今往后，龙椅上坐着的是我，朝政却未必由我做主。\n\n推辞，或许能保住多年的清名，可桓温另选的人未必比我更合适；接受，便要在大司马的注视下，做一个小心翼翼的天子。"
 hd_370.0170.a: "即皇帝位。"
 hd_370.0170.b: "坚辞不受。"
