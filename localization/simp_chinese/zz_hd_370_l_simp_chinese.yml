l_simp_chinese:
 # 370 年剧本「王猛伐燕」。计划见 docs/370苻坚剧本_计划.md。
 bm_hd_370: "王猛伐燕"
 bm_hd_370_desc: "太和五年正月。去年秋天，桓温北伐至枋头，前燕倾国才将他击退。燕人请秦出兵相救，许以虎牢以西之地，事后却反悔不给；立了大功的吴王慕容垂反遭太傅慕容评与太后猜忌，带着儿子们连夜投奔长安。\n\n苻坚亲自出郊迎接这位燕国名将。冬天，他派辅国将军王猛率步骑三万东出，此刻正围着洛阳的金墉城。燕的乐安王慕容臧带兵来救，屯在石门、荥阳一带。\n\n江南，大司马桓温兵败归来，把罪责推给豫州刺史袁真，袁真索性据寿春叛晋，投了燕国。建康的天子是海西公司马奕，朝中大事都由桓温说了算。\n\n#bold 关东最富庶的燕国，将在这一年里亡于关中的秦。#!"

 bm_hd_370_fu_jian: "苻坚"
 bm_hd_370_fu_jian_subheading: "大秦天王"
 bm_hd_370_fu_jian_desc: "略阳氐人，苻洪之孙。十三年前他杀了暴虐的堂兄苻生，自称天王，重用出身寒微的王猛，整顿吏治，劝课农桑，关中渐渐富足。燕国人口是秦的数倍，可燕国的朝廷正在自己拆自己的台。"

 bm_hd_370_wang_meng: "王猛"
 bm_hd_370_wang_meng_subheading: "辅国将军、司隶校尉"
 bm_hd_370_wang_meng_desc: "北海剧县人，少时以卖畚箕为生。当年桓温入关，他披着粗布短衣去见，一边捉虱子一边纵论天下。苻坚得了他，说是如同刘备得了孔明。如今他领兵在洛阳城下，下一步就是整个关东。"

 bm_hd_370_murong_chui: "慕容垂"
 bm_hd_370_murong_chui_subheading: "宾都侯，奔秦的燕国名将"
 bm_hd_370_murong_chui_desc: "慕容皝之子，枋头一战击败桓温，威名震动南北。功劳越大，慕容评和可足浑太后越容不下他，他只好带着妻儿出奔长安。苻坚待他极厚，王猛却劝苻坚除掉他，说此人终非池中之物。"

 bm_hd_370_murong_wei: "慕容暐"
 bm_hd_370_murong_wei_subheading: "燕帝"
 bm_hd_370_murong_wei_desc: "慕容儁之子，十一岁即位，靠叔父慕容恪辅政才坐稳江山。慕容恪死后，朝政落到叔祖慕容评手里。如今他二十岁了，国库空虚，宿将离心，秦军已经到了洛阳。"

 bm_hd_370_murong_ping: "慕容评"
 bm_hd_370_murong_ping_subheading: "太傅、上庸王"
 bm_hd_370_murong_ping_desc: "慕容廆之子，燕国宗室中辈分最高的长者。他贪财好货，连军中用的山泉薪柴都要收钱。逼走慕容垂的是他，如今要领兵抵御王猛的，多半也是他。"

 bm_hd_370_huan_wen: "桓温"
 bm_hd_370_huan_wen_subheading: "大司马，专晋政"
 bm_hd_370_huan_wen_desc: "谯国龙亢人，西灭成汉，两次北伐，威势无人能及。枋头之败折损了他的声望，他想用废立天子的大事重新立威。眼下寿春的袁真还没收拾，朝中的谢安、王坦之也未必肯听话。"

 bm_hd_370_sima_yi: "司马奕"
 bm_hd_370_sima_yi_subheading: "晋帝（海西公）"
 bm_hd_370_sima_yi_desc: "晋成帝之子，兄长哀帝死后被立为天子，在位五年，处处小心，从无过失。可桓温要的不是他有没有过失，而是一个可以拿来立威的借口。"

 bm_hd_370_sima_yu: "司马昱"
 bm_hd_370_sima_yu_subheading: "会稽王，录尚书事"
 bm_hd_370_sima_yu_desc: "晋元帝的幼子，历事数朝，清谈名士都爱与他往来。他辅政多年，却从不与桓温正面相争。如果桓温真要另立天子，宗室里最合适的人选，就是他自己。"

 bm_hd_370_xie_an: "谢安"
 bm_hd_370_xie_an_subheading: "侍中，陈郡谢氏家主"
 bm_hd_370_xie_an_desc: "陈郡谢氏，早年高卧会稽东山，屡征不起，四十岁才出仕做了桓温的司马。如今他在建康为侍中，对桓温恭敬有礼，心里却另有打算。谢氏子弟正在成长，他的侄子谢玄日后会练出一支北府兵。"

 bm_hd_370_zhang_tianxi: "张天锡"
 bm_hd_370_zhang_tianxi_subheading: "西平公，凉州牧"
 bm_hd_370_zhang_tianxi_desc: "张轨的曾孙，七年前杀侄子张玄靓自立。前凉僻处河西，遥奉晋朝正朔，至今还用着升平年号。东边的秦国一年比一年强，河西的好日子不会太长了。"

 bm_hd_370_tuoba_shiyijian: "拓跋什翼犍"
 bm_hd_370_tuoba_shiyijian_subheading: "代王"
 bm_hd_370_tuoba_shiyijian_desc: "拓跋鲜卑的首领，年轻时在后赵做过十年人质，回国后设百官、定法令，把代国经营成北方草原上的强国。他与燕国联姻，与秦国争夺河套的铁弗部，如今已年过五十。"

 hd_370_wangmeng_army_name: "王猛所部"
