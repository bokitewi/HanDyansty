l_simp_chinese:
 activity_wj_coronation:0 "中国进位礼"
 activity_wj_coronation_desc:0 "召集臣属，议定仪注，以册书、玺绶和朝会昭示君位。进位的名分在整套仪式完成后才正式确立。"
 activity_wj_coronation_host_desc:0 "完成后依身份取得已进位为王或即皇帝位法律，再议定国号；旧朝所授军职同时撤下。"
 activity_wj_coronation_guest_desc:0 "赴会见证进位，向新君陈述臣属之责。"
 WJ_cr_type_king:0 "进位为王"
 WJ_cr_type_king_desc:0 "独立的州级统治者接受王号；未完成仪式前仍沿用旧官称。"
 WJ_cr_type_usurp:0 "僭越称帝"
 WJ_cr_type_usurp_desc:0 "天下仍有天子，而我将自立帝号。不夺取现存霸权，也不因仪式自动发动战争。"
 WJ_cr_type_found:0 "定鼎开国"
 WJ_cr_type_found_desc:0 "旧霸权已不复存在，以帝国之基定鼎建国。"
 WJ_cr_type_accession:0 "践祚即位"
 WJ_cr_type_accession_desc:0 "已经承接皇位，依正统程序告庙、受玺、临朝。"
 WJ_cr_location_desc:0 "在自己的都城举行进位礼，不要求宗教圣地或教会主持人。"
 WJ_cr_phase_preparation:0 "议礼备仪"
 WJ_cr_phase_preparation_desc:0 "集议仪注、校订册书，等候臣属赴会。"
 WJ_cr_phase_investiture:0 "受册临朝"
 WJ_cr_phase_investiture_desc:0 "宣读册书，授受玺绶，接受臣属朝贺。"
 WJ_cr_phase_banquet:0 "燕飨告成"
 WJ_cr_phase_banquet_desc:0 "与臣属燕飨，申明新政，完成礼仪。"
 WJ_cr_conclusion_desc:0 "进位礼已经告成；法律与国号按本次仪式实际结果结算。"
 WJ_cr.1.t:0 "议礼备仪"
 WJ_cr.1.desc:0 "礼官将历代仪注列在案前，臣属的车驾也渐次入城。此次进位，不只是在册书上添一个称号：朝会次序、玺绶制度与臣属名分，都要让在场的人看得明白。\n\n我命人核对仪注。繁简可以斟酌，受册与宣告的要节却不可略去。"
 WJ_cr.1.a:0 "参酌旧章，使仪注完备。"
 WJ_cr.1.b:0 "裁去浮费，礼之大节不可废。"
 WJ_cr.2.t:0 "受册临朝"
 WJ_cr.2.desc:0 "册书既定，玺绶陈于御案。礼官宣读仪文，臣属依次趋前，列拜称贺。\n\n我接过玺绶，望向殿下。今日所受，不仅是荣耀；此后号令与治乱，都将以这个君位的名义传于四方。待燕飨告成，新的名分才会写入朝廷的制度。"
 WJ_cr.2.a:0 "受册临朝，与众人共任治世之责。"
 WJ_cr.3.t:0 "燕飨申诫"
 WJ_cr.3.desc:0 "礼毕设席，臣属在席间相互致贺。新君可以听见许多颂辞，却不能只听颂辞。\n\n我举杯止住喧声，将今后的施政之意告于众人。今日的承诺，将沿用原生加冕誓约的制度约束我；它不应只是宴席上的漂亮话。"
 WJ_cr.3.a:0 "上下以诚相待，慎守信义。"
 WJ_cr.3.b:0 "整饬财赋，务使国计有常。"
 WJ_cr.4.t:0 "进位礼成"
 WJ_cr.4.desc:0 "册书、受玺、朝贺与燕飨已经完成。礼官将新的君位名分记入制度，随后呈上国号候选。\n\n直到此刻，进位才算告成；旧朝所授的军职也随之撤下。"
 WJ_cr.4.a:0 "礼成，议定国号。"
 WJ_cr_crowned_king_male:0 "王"
 WJ_cr_crowned_king_female:0 "王"
 WJ_cr_king_country:0 "国"
 WJ_cr_crowned_king_law:0 "已进位为王"
 WJ_cr_crowned_emperor_law:0 "即皇帝位"

