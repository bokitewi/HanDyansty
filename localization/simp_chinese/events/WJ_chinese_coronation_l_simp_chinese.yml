 WJ_cr_empire_found_t:0 "开国称帝"
 WJ_council_independent_chancellor:0 "尚书令"
 WJ_council_independent_steward:0 "司农"
 WJ_council_independent_marshal:0 "大将军"
 WJ_cr_empire_found_tt:0 "王号既立，今承其基业建帝位，获得1000正统性。此项仅在首次建立帝位时结算。"
 WJ_cr_empire_usurp_t:0 "僭越称帝"
 WJ_cr_empire_usurp_tt:0 "未先立王号而径称帝位，失去1000正统性。此项仅在首次建立帝位时结算。"

