l_simp_chinese:
 activity_wj_coronation:0 "中国进位礼"
 activity_wj_coronation_desc:0 "召集臣属，议定仪注，以册书、玺绶和朝会昭示君位。进位的名分在整套仪式完成后才正式确立。"
 activity_wj_coronation_host_desc:0 "完成后依身份取得已进位为王或即皇帝位法律，再议定国号；旧朝所授军职同时撤下。"
 activity_wj_coronation_guest_desc:0 "赴会见证进位，向新君陈述臣属之责。"
 WJ_cr_type_king:0 "进位为王"
 WJ_cr_type_king_desc:0 "独立的州级统治者接受王号；未完成仪式前仍沿用旧官称。"
 WJ_cr_type_usurp:0 "僭越称帝"
 WJ_cr_type_usurp_desc:0 "天下仍有天子，而我将自立帝号。不夺取现存霸权，也不因仪式自动发动战争。"
 WJ_cr_type_found:0 "定鼎开国"
 WJ_cr_type_found_desc:0 "旧霸权已不复存在，以帝国之基定鼎建国。"
 WJ_cr_type_accession:0 "践祚即位"
 WJ_cr_type_accession_desc:0 "已经承接皇位，依正统程序告庙、受玺、临朝。"
 WJ_cr_location_desc:0 "在自己的都城举行进位礼，不要求宗教圣地或教会主持人。"
 WJ_cr_phase_preparation:0 "议礼备仪"
 WJ_cr_phase_preparation_desc:0 "集议仪注、校订册书，等候臣属赴会。"
 WJ_cr_phase_investiture:0 "告庙临朝"
 WJ_cr_phase_investiture_desc:0 "奉告宗庙，宣读进位之书，接受臣属朝贺。"
 WJ_cr_phase_banquet:0 "燕飨告成"
 WJ_cr_phase_banquet_desc:0 "与臣属燕飨，申明新政，完成礼仪。"
 WJ_cr_conclusion_desc:0 "进位礼已经告成；法律与国号按本次仪式实际结果结算。"
 WJ_cr.6.t:0 "备礼告期"
 WJ_cr.6.desc:0 "进位之议既定，礼官已奉命修订仪注，向臣属发出赴会之书。都城将为此次典礼备下朝堂、礼器与宴席。\n\n臣属尚须入城，册书尚须校定。此刻只是备礼之始，须待告庙、临朝与燕飨告成，新的君位才正式载入制度。"
 WJ_cr.6.a:0 "命有司备礼，等候臣属赴会。"
 WJ_cr.1.t:0 "议礼备仪"
 WJ_cr.1.desc:0 "礼官将历代仪注列在案前，臣属的车驾也渐次入城。此次进位，不只是在册书上添一个称号：朝会次序、玺绶制度与臣属名分，都要让在场的人看得明白。\n\n我命人核对仪注。繁简可以斟酌，受册与宣告的要节却不可略去。"
 WJ_cr.1.a:0 "参酌旧章，使仪注完备。"
 WJ_cr.1.b:0 "裁去浮费，礼之大节不可废。"
 WJ_cr.2.t:0 "告庙临朝"
 WJ_cr.2.desc.king:0 "进位之书已定，有司奉告宗庙，将王者所用的玺绶陈于案前。臣属依次趋入朝堂，列拜称贺。\n\n州郡的旧官号，自此将不再是我名分的尽头。这份王号不是天子赐下的恩命，而是我与臣属今日共同申明的国中之尊；待典礼告成，四方才会收到进位的文书。"
 WJ_cr.2.desc.accession:0 "先帝之位已由我承接，今日所行，是告庙、奉玺与临朝之礼，而非另立帝号。礼官读罢即位之书，臣属依班入殿。\n\n我望向御座与殿下的朝臣。承继的不只是尊位，也是先朝未竟的政事；从此，天下的奏报与诏命都将汇于此处。"
 WJ_cr.2.desc.usurp:0 "天下尚有天子，我却已命有司奉告宗庙，宣示自立帝号之意。臣属依次入殿，拜贺新君；这份称贺之外，仍有旧朝的名分横在天下人心中。\n\n我知道今日所行将被旧朝视为僭越。典礼能昭示我的选择，却不能凭空替我赢得四方的承认。"
 WJ_cr.2.desc.found:0 "旧朝的统绪已无天子承持。有司奉告宗庙，宣读开国即帝位之书，臣属依班入殿，拜贺新君。\n\n宫室、州郡与兵马，往日只是我所据的基业；今日之后，它们将共同承载一个新朝的名分。朝廷能否安定，仍要看此后的号令与治绩。"
 WJ_cr.2.a:0 "昭告四方，临朝受贺。"
 WJ_cr.3.t:0 "燕飨申诫"
 WJ_cr.3.desc:0 "礼毕设席，臣属在席间相互致贺。新君可以听见许多颂辞，却不能只听颂辞。\n\n我举杯止住喧声，将今后的施政之意告于众人。信义关乎上下相待，财赋关乎军国用度；今日所许，来日都要见于施行，不能只是宴席上的漂亮话。"
 WJ_cr.3.a:0 "上下以诚相待，慎守信义。"
 WJ_cr.3.b:0 "整饬财赋，务使国计有常。"
 WJ_cr.4.t:0 "进位礼成"
 WJ_cr.4.desc:0 "册书、受玺、朝贺与燕飨已经完成。礼官将新的君位名分记入制度，随后呈上国号候选。\n\n直到此刻，进位才算告成；旧朝所授的军职也随之撤下。"
 WJ_cr.4.a:0 "礼成，议定国号。"
 WJ_cr.5.t:0 "进位礼中止"
 WJ_cr.5.desc:0 "君位、赴会者或主持典礼的情形已有变化，原定仪式未能继续。礼官收起未行的仪注，遣人将中止之事告知臣属。\n\n此次没有完成进位，不授予新的进位法律，也不因此更定国号。待条件具备之后，仍可重新议礼。"
 WJ_cr.5.a:0 "暂罢此礼，来日再议。"
 WJ_cr_crowned_king_male:0 "王"
 WJ_cr_crowned_king_female:0 "王"
 WJ_cr_king_country:0 "国"
 WJ_cr_crowned_king_law:0 "已进位为王"
 WJ_cr_crowned_emperor_law:0 "即皇帝位"
 WJ_cr_native_crowned_king_law:0 "已加冕的君主"
 WJ_cr_native_crowned_emperor_law:0 "受傅油的君主"

