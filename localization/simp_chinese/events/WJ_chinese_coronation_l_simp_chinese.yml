l_simp_chinese:
 activity_wj_coronation:0 "中国即位礼"
 activity_wj_coronation_desc:0 "召集臣属，议定仪注，以告庙、奉玺和朝会完成即位之礼。帝号由真实帝国及独立身份决定，不等待加冕法律。"
 activity_wj_coronation_host_desc:0 "完成后取得即皇帝位法律，沿原有流程议定国号；旧朝所授军职同时撤下。"
 activity_wj_coronation_guest_desc:0 "赴会见证即位，向君主陈述臣属之责。"
 WJ_cr_type_accession:0 "登极即位"
 WJ_cr_type_accession_desc:0 "已经承接皇位，依正统程序告庙、受玺、临朝。"
 WJ_cr_location_desc:0 "在自己的都城举行即位礼，不要求宗教圣地或教会主持人。"
 WJ_cr_phase_preparation:0 "议礼备仪"
 WJ_cr_phase_preparation_desc:0 "集议仪注、校订册书，等候臣属赴会。"
 WJ_cr_phase_investiture:0 "告庙临朝"
 WJ_cr_phase_investiture_desc:0 "奉告宗庙，宣读即位之书，接受臣属朝贺。"
 WJ_cr_phase_banquet:0 "燕飨告成"
 WJ_cr_phase_banquet_desc:0 "与臣属燕飨，申明新政，完成礼仪。"
 WJ_cr_conclusion_desc:0 "即位礼已经告成；礼仪法律与国号按本次仪式实际结果结算。"
 WJ_cr.6.t:0 "备礼告期"
 WJ_cr.6.desc:0 "皇位既承，礼官已奉命修订仪注，向臣属发出赴会之书。都城将为此次典礼备下朝堂、礼器与宴席。\n\n臣属尚须入城，册书尚须校定。此刻只是备礼之始，告庙、临朝与燕飨尚未告成；帝号不因备礼未毕而改变。"
 WJ_cr.6.a:0 "命有司备礼，等候臣属赴会。"
 WJ_cr.1.t:0 "议礼备仪"
 WJ_cr.1.desc:0 "礼官将历代仪注列在案前，臣属的车驾也渐次入城。此次即位礼，不是临时改换一个称号：朝会次序、玺绶制度与臣属名分，都要让在场的人看得明白。\n\n我命人核对仪注。繁简可以斟酌，奉玺与宣告的要节却不可略去。"
 WJ_cr.1.a:0 "参酌旧章，使仪注完备。"
 WJ_cr.1.b:0 "裁去浮费，礼之大节不可废。"
 WJ_cr.2.t:0 "告庙临朝"
 WJ_cr.2.desc.accession:0 "皇位已由我承持，今日所行，是告庙、奉玺与临朝之礼。礼官读罢即位之书，臣属依班入殿。\n\n我望向御座与殿下的朝臣。尊位之上，不只是玺绶与冠服，也是州郡万民与军国政事；天下的奏报与诏命，都将汇于此处。"
 WJ_cr.2.a:0 "昭告四方，临朝受贺。"
 WJ_cr.3.t:0 "燕飨申诫"
 WJ_cr.3.desc:0 "礼毕设席，臣属在席间相互致贺。新君可以听见许多颂辞，却不能只听颂辞。\n\n我举杯止住喧声，将今后的施政之意告于众人。信义关乎上下相待，财赋关乎军国用度；今日所许，来日都要见于施行，不能只是宴席上的漂亮话。"
 WJ_cr.3.a:0 "上下以诚相待，慎守信义。"
 WJ_cr.3.b:0 "整饬财赋，务使国计有常。"
 WJ_cr.4.t:0 "即位礼成"
 WJ_cr.4.desc:0 "册书、奉玺、朝贺与燕飨已经完成。礼官将礼成之事记入制度，随后呈上国号候选。\n\n即位之礼至此告成；旧朝所授的军职也随之撤下。"
 WJ_cr.4.a:0 "礼成，议定国号。"
 WJ_cr.5.t:0 "即位礼中止"
 WJ_cr.5.desc:0 "君位、赴会者或主持典礼的情形已有变化，原定仪式未能继续。礼官收起未行的仪注，遣人将中止之事告知臣属。\n\n此次不授予即位礼法律，也不因此更定国号；原有帝号不会仅因礼仪中止而撤去。待条件具备之后，仍可重新议礼。"
 WJ_cr.5.a:0 "暂罢此礼，来日再议。"
 WJ_cr_crowned_king_male:0 "王"
 WJ_cr_crowned_king_female:0 "王"
 WJ_cr_king_country:0 "国"
 WJ_cr_crowned_king_law:0 "已加冕的君主"
 WJ_cr_crowned_emperor_law:0 "即皇帝位"
 WJ_cr_native_crowned_king_law:0 "已加冕的君主"
 WJ_cr_native_crowned_emperor_law:0 "受傅油的君主"
 WJ_cr_advance_king_decision:0 "进位为王"
 WJ_cr_advance_king_decision_desc:0 "州郡已连成广阔疆域，旧官号不足以申明国中之尊。我将进位为王，沿现有地区候选议定国号。\n\n王号系于主头衔，由继承人承接，不授予加冕法律，不新建帝国头衔。"
 WJ_cr_advance_king_decision_tooltip:0 "主头衔取得世袭王号，随后选择国号；旧朝军职撤下。"
 WJ_cr_advance_king_decision_confirm:0 "进位为王，议定国号"
 WJ_cr_advance_king_valid_tt:0 "是独立的郡国制地方王国统治者，尚未进位，实际全境至少有110个县，且没有未完成的国号选择。"
