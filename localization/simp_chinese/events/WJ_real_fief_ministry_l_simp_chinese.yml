l_simp_chinese:
 WJ_rf_ministry_grant:0 "承爵复任"
 WJ_rf_ministry_grant_desc:0 "朝廷使者奉诏而来，捧着的印绶，正是先君生前任职的凭信。\n\n封国之爵已由你承袭，如今朝廷又命你接掌[wj_rf_inherited_office.GetNameNoTierNoTooltip]之职。府中旧吏相顾而喜：若能续掌朝政，先君留下的基业便不止于一国之内。\n\n诏书既下，现任者便要交还印绶，由你赴任。"
 WJ_rf_ministry_accept:0 "谨奉诏命，承任其职。"
 WJ_rf_ministry_refused:0 "朝廷不予补授"
 WJ_rf_ministry_refused_desc:0 "朝廷的回音到了：[wj_rf_inherited_office.GetNameNoTierNoTooltip]之职，不予补授于你。\n\n封爵可以承袭，朝职却不是爵位的附庸。先君在朝时的权势，并没有随印绶一同落到你的手里。这一职位已归朝廷另行处置，你须另寻立足之道。"
 WJ_rf_ministry_refused_accept:0 "此事暂且记下。"
