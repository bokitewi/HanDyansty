 HuangDi_miaoshi.082_d:0 "#bold 今依古制黜陟之礼，令太常详考谥法，议定谥号；若从存祀特例，亦可一并拟定庙号，然不祔本朝太庙，止许前朝遗裔私庙奉祀，彰褒贬之公道。"
 HuangDi_miaoshi.082_t:0 "议前朝废帝谥号"
 HuangDi_miaoshi.092.a:0 "钦定此自定谥号"
 HuangDi_miaoshi.shturl:0 "治典不杀曰简，定先帝谥号为 $Color_EHuang$ #bold 简"
 HuangDi_miaoshi_012_d:0 "朝臣集议尊号，议定大行皇帝#color_dark_gray 【[XianDi.GetName]】#!\n\n尊号：$Color_EHuang$ #BOLD [XianDi.GetNicknameNoTooltip]皇帝"
 HuangDi_miaoshi_012_t:0 "议定尊号"
 HuangDi_miaoshi_014_d:0 "朝臣集议尊号，议定大行皇帝#color_dark_gray 【[XianDi.GetName]】#!\n\n尊号：$Color_EHuang$ #BOLD [XianDi.GetNicknameNoTooltip]"
 SG_right_portrait_event:0 "[Character.Custom('WJ_GetUIName')]\n[Character.GetRelationToString( GetPlayer )]"
 SanGong_HunJun_desc:0 "昏庸乱政，怠弃万机，祸延宗社，为败德亡家之主。"
 SanGong_KaiGuo_desc:0 "开基肇统，戡乱定鼎，拓土垂统，为一代开创之祖。"
 SanGong_ShouCheng_desc:0 "守成继体，遵制守文，安邦固本，为承平持盈之主。"
 SanGong_XiongZhu_desc:0 "圣明治世，励精图治，海内晏安，为天下有道之君。"
 SanGong_YouZhu_desc:0 "冲龄践祚，未亲万机，委政辅弼，为幼主临朝之君。"
 SanGong_Zdy_WangHao_text:0 ""
 SanGong_ZhongXing_desc:0 "中兴定鼎，扶倾定危，光复宗社，为社稷再兴之主。"
 SanGong_miaohao_01_desc:0 "肇造区夏、始受天命，曰太"
 SanGong_miaohao_02_desc:0 "德覆万方、首启皇基，曰高"
 SanGong_miaohao_05_desc:0 "有功安民，秉德遵业，曰烈"
 SanGong_miaohao_09_desc:0 "安民立政、肇成洪业，曰成"
 SanGong_miaohao_21_desc:0 "中兴社稷、再定江山，曰世"
 SanGong_miaohao_22_desc:0 "匡辅社稷、中兴帝业，曰中"
 SanGong_miaohao_23_desc:0 "中兴社稷、再定江山，乃避太宗之讳，故曰代"
 SanGong_miaohao_27_desc:0 "功德莫过、其业煌煌，曰太"
 SanGong_miaohao_28_desc:0 "中兴有为、德高可尊，曰高"
 SanGong_miaohao_29_desc:0 "中兴有功、百世不迁，曰世"
 SanGong_miaohao_30_desc:0 "中兴有功、百世不迁，避太宗皇帝讳，故曰代"
 SanGong_miaohao_31_desc:0 "中兴神器、复振宗祚，曰中"
 SanGong_miaohao_32_desc:0 "盛德巍巍、於穆不已，曰仁"
 SanGong_miaohao_33_desc:0 "功光四海、仁行千载，曰显"
 SanGong_miaohao_34_desc:0 "乃圣乃神、益称尧德，曰神"
 SanGong_miaohao_35_desc:0 "无所不通、峻德垂统，曰圣"
 SanGong_miaohao_36_desc:0 "刚德克就、重明六合，曰肃"
 SanGong_miaohao_37_desc:0 "至仁至孝、善继善述，曰孝"
 SanGong_miaohao_38_desc:0 "惟天聪明，惟圣时宪，曰宪"
 SanGong_miaohao_39_desc:0 "圣善周闻、政教广布，曰宣"
 SanGong_miaohao_40_desc:0 "烈宗成德、受命溥将，曰烈"
 SanGong_miaohao_41_desc:0 "照临四方、德象神尧，曰明"
 SanGong_miaohao_42_desc:0 "立成功成、奄有四方，曰成"
 SanGong_miaohao_43_desc:0 "安乐抚民、庶几成康，曰康"
 SanGong_miaohao_44_desc:0 "至道至真、玄之又玄，曰玄"
 SanGong_miaohao_45_desc:0 "治近至道、德以称宗，曰真"
 SanGong_miaohao_46_desc:0 "克定祸乱、刑民克服，曰武"
 SanGong_miaohao_47_desc:0 "经天纬地、慈惠爱民，曰文"
 SanGong_miaohao_48_desc:0 "英异之主、出类拔萃，曰英"
 SanGong_miaohao_49_desc:0 "惟睿作圣、智虑深远，曰睿"
 SanGong_miaohao_50_desc:0 "尧曰知人、世有哲王，曰哲"
 SanGong_miaohao_51_desc:0 "坟史征德、生安允迪，曰德"
 SanGong_miaohao_52_desc:0 "崇德报本，尊祖隆宗，曰崇"
 SanGong_miaohao_53_desc:0 "布德执以、德容静深，曰穆"
 SanGong_miaohao_54_desc:0 "光大有功、能绍前业，曰光"
 SanGong_miaohao_55_desc:0 "由义而济、光有令绪，曰景"
 SanGong_miaohao_56_desc:0 "不为而成、不疾而速，曰顺"
 SanGong_miaohao_57_desc:0 "善合法典、庄敬严威，曰敬"
 SanGong_miaohao_58_desc:0 "渊衷湛一、宁考安康，曰宁"
 SanGong_miaohao_59_desc:0 "兴有大业、圣图丕振，曰兴"
 SanGong_miaohao_60_desc:0 "体道得一，天纵自然，曰道"
 SanGong_miaohao_61_desc:0 "法度明大、出言有文，曰章"
 SanGong_miaohao_62_desc:0 "温和圣善、爱民质渊，曰懿"
 SanGong_miaohao_63_desc:0 "法度明大、出言有文，曰章"
 SanGong_miaohao_64_desc:0 "果敢坚毅，秉性刚断，曰毅"
 SanGong_miaohao_65_desc:0 "宽仁得众，厚德承统，曰裕"
 SanGong_miaohao_66_desc:0 "政平刑肃、表章道术，曰理"
 SanGong_miaohao_67_desc:0 "胜敌志强、威仪不忒，曰庄"
 SanGong_miaohao_68_desc:0 "盛明熙和、敬德光辉，曰熙"
 SanGong_miaohao_69_desc:0 "和气广敷、有功安人，曰熹"
 SanGong_miaohao_70_desc:0 "质渊受谏、慈惠爱亲，曰僖"
 SanGong_miaohao_71_desc:0 "博闻多能，惠而内德，曰献"
 SanGong_miaohao_72_desc:0 "道德纯一、体仁长民，曰元"
 SanGong_miaohao_73_desc:0 "福庆绵延，善继承宗，曰庆"
 SanGong_miaohao_74_desc:0 "奉义顺则，恭俭庄敬，曰礼"
 SanGong_miaohao_75_desc:0 "元德充美、雅韵昭彰，曰徽"
 SanGong_miaohao_76_desc:0 "容仪恭美，昭德有劳，曰昭"
 SanGong_miaohao_77_desc:0 "爱民好与、柔质受谏，曰惠"
 SanGong_miaohao_78_desc:0 "强毅执政、庄以临下，曰威"
 SanGong_miaohao_79_desc:0 "尊贤贵义、正德美容，曰恭"
 SanGong_miaohao_80_desc:0 "好和不争、兆民宁赖，曰安"
 SanGong_miaohao_81_desc:0 "疏远继位、绍继前业，曰熹"
 SanGong_miaohao_82_desc:0 "威仪悉备、敬事节用，曰钦"
 SanGong_miaohao_83_desc:0 "虑深通敏、追悔前过，曰思"
 SanGong_miaohao_84_desc:0 "进退可轨、从容有常，曰度"
 SanGong_miaohao_85_desc:0 "守礼执义、圣修式化，曰端"
 SanGong_miaohao_86_desc:0 "克敬勤民、能成武志，曰桓"
 SanGong_miaohao_87_desc:0 "甲胄有劳、协赞有成，曰襄"
 SanGong_miaohao_88_desc:0 "统承大绪，总御万方，曰统"
 SanGong_miaohao_89_desc:0 "安民大虑，纯行不二，曰定"
 SanGong_miaohao_zdy_desc:0 "庙号：[ROOT.Char.GetLocalizedText( 'SanGong_miaohao_zdy_text' )]"
