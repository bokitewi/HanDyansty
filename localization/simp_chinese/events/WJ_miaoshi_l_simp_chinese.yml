 HuangDi_miaoshi.011_d:0 "礼官又呈上一份文书，这一回议的是身后之谥。候选的字与字义并排列着，你沿着看下去，忽然觉得每个短短的字背后，都站着不同的说法。\n\n有人看重功业，有人更顾哀敬，前面的议论已经说了许多。你没有让他们重新争起来，只把先帝的记录放在手边，再看眼前的名目。\n\n殿中静候裁定。无论取哪一个，往后的礼文都将以此相称；此刻，先由你把它念出来。"
