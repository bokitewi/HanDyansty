 HuangDi_miaoshi.081.p:0 "名实不爽，中正无邪曰质，谥 #Y 【质】"
 HuangDi_miaoshi.081_d:0 "读到先帝的年岁时，礼官稍稍停顿了一下。你低头看那份生平记录，才发觉案上的纸，比事先备下的颂辞还要短。\n\n许多事尚未来得及做，便已无人可问。有人试着说起先前的期许，话到一半又收住了，转而请你看候选的谥号。\n\n你把那几个字逐一读过。这样短的一段年月，竟也到了要为它留下身后称呼的时候。"
 HuangDi_miaoshi.081_t:0 "幼主之谥"
 HuangDi_miaoshi.082.a:0 "暴虐无亲，曰厉，定谥号为$Color_EHuang$ #bold 厉帝"
 HuangDi_miaoshi.082.b:0 "壅遏不通，曰幽，定谥号为$Color_EHuang$ #bold 幽帝"
 HuangDi_miaoshi.082.c:0 "去礼远众，曰炀，定谥号为$Color_EHuang$ #bold 炀帝"
 HuangDi_miaoshi.082.d:0 "乱而不损，曰灵，定谥号为$Color_EHuang$ #bold 灵帝"
 HuangDi_miaoshi.082.e:0 "耽乐怠政，曰荒，定谥号为$Color_EHuang$ #bold 荒帝"
 HuangDi_miaoshi.082.f:0 "怙威肆行，曰戾，定谥号为$Color_EHuang$ #bold 戾帝"
 HuangDi_miaoshi.082.g:0 "名实乖违，曰缪，定谥号为$Color_EHuang$ #bold 缪帝"
 HuangDi_miaoshi.082.h:0 "政令轻佻，曰躁，定谥号为$Color_EHuang$ #bold 躁帝"
 HuangDi_miaoshi.082.i:0 "纵欲废礼，曰荡，定谥号为$Color_EHuang$ #bold 荡帝"
 HuangDi_miaoshi.082.j:0 "残虐肆杀，曰暴，定谥号为$Color_EHuang$ #bold 暴帝"
 HuangDi_miaoshi.082_d:0 "前代废帝的褒贬与存祀，有司请你再作裁定。这不只是取一字为谥，也关乎是否破例为他另存庙号，以及这份名分该归于何处。\n\n你把呈上的礼议看清。即便为他存祀，也不祔入本朝太庙，只由前朝后裔奉祀；留下一个称号，与接续本朝宗统，原本不是一回事。\n\n褒贬一经定下，便不能因一时哀悯而轻改。你让礼官依次读过诸议，要把这份身后名分定得清清楚楚。"
 HuangDi_miaoshi.082_t:0 "议前朝废帝谥号"
 HuangDi_miaoshi.092.a:0 "就以此为谥。"
 HuangDi_miaoshi.shturl:0 "治典不杀曰简，定谥为 $Color_EHuang$ #bold 简"
 HuangDi_miaoshi_012_d:0 "礼官将议定的尊谥重新宣读了一遍。先前那些纷纭的褒贬与追念，到此终于有了一个众口如一的称呼。\n\n#high [XianDi.GetName]： [XianDi.GetNicknameNoTooltip]皇帝#!\n\n你听完，又亲自看过誊本。名字仍是那个名字，添在后面的字，却只能由别人来称说了。礼官等你示意，便将文书收存，去办余下的礼事。"
 HuangDi_miaoshi_012_t:0 "议定尊号"
 HuangDi_miaoshi_014_d:0 "议定的身后称谓呈了上来，礼官在你面前最后读了一遍。堂中再无人争议，只有笔落在誊本上的轻响。\n\n#high [XianDi.GetName]： [XianDi.GetNicknameNoTooltip]#!\n\n你从头看过，将文书交回。先前争论不休时，总觉得只要再添几句便能说尽；如今名号真正落定，殿中却仍空着一处说不清的地方。余下的礼事，便依此办理。"
