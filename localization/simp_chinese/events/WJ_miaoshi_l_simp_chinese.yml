 HuangDi_miaoshi.081.c:0 "在国逢难，使民折伤曰愍，谥 #Y 【愍】"
 HuangDi_miaoshi.081.d:0 "在国逢难，使民折伤曰闵，谥 #Y 【闵】"
 HuangDi_miaoshi.081.e:0 "蚤孤短折，恭仁短折曰哀，谥 #Y 【哀】"
 HuangDi_miaoshi.081.f:0 "不显尸国，隐拂不成曰隐，谥 #Y 【隐】"
 HuangDi_miaoshi.081.g:0 "好更改旧，轻变成法曰易，谥 #Y 【易】"
 HuangDi_miaoshi.081.h:0 "思愆深远，戒慎忧思曰惧，谥 #Y 【惧】"
 HuangDi_miaoshi.081.i:0 "不生其国，誉闻远达曰声，谥 #Y 【声】"
 HuangDi_miaoshi.081.j:0 "谋虑不成，欲为而止曰息，谥 #Y 【息】"
 HuangDi_miaoshi.081.k:0 "述义不克，迷而不悌曰丁，谥 #Y 【丁】"
 HuangDi_miaoshi.081.l:0 "举事而迟，从容安和曰舒，谥 #Y 【舒】"
 HuangDi_miaoshi.081.m:0 "幼少短折，怀虚守静曰冲，谥 #Y 【冲】"
