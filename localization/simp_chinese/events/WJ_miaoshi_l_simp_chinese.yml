 SanGong_HunJun_desc:0 "该角色怠弃万机，昏庸乱政，以致祸延宗社。"
 SanGong_KaiGuo_desc:0 "该角色开基肇统，戡乱定鼎，是一代开创之主。"
 SanGong_ShouCheng_desc:0 "该角色继体守文，遵循成法，使天下承平安定。"
 SanGong_XiongZhu_desc:0 "该角色励精图治，海内晏然，世称有道之君。"
 SanGong_YouZhu_desc:0 "该角色冲龄践祚，未及亲理万机，朝政多委于辅弼。"
 SanGong_Zdy_WangHao_text:0 ""
 SanGong_ZhongXing_desc:0 "该角色扶危定倾，光复宗社，使国祚得以再兴。"
 SanGong_miaohao_01_desc:0 "肇造区夏、始受天命，故上庙号曰太祖。"
 SanGong_miaohao_02_desc:0 "德覆万方、首启皇基，故上庙号曰高祖。"
 SanGong_miaohao_05_desc:0 "有功安民、秉德遵业，故上庙号曰烈祖。"
 SanGong_miaohao_09_desc:0 "安民立政、肇成洪业，故上庙号曰成祖。"
 SanGong_miaohao_21_desc:0 "中兴社稷、再定江山，故上庙号曰世祖。"
 SanGong_miaohao_22_desc:0 "匡辅社稷、中兴帝业，故上庙号曰中祖。"
 SanGong_miaohao_23_desc:0 "中兴社稷、再定江山，故上庙号曰代祖。"
 SanGong_miaohao_27_desc:0 "功德莫过、其业煌煌，故上庙号曰太宗。"
 SanGong_miaohao_28_desc:0 "中兴有为、德高可尊，故上庙号曰高宗。"
 SanGong_miaohao_29_desc:0 "中兴有功、百世不迁，故上庙号曰世宗。"
 SanGong_miaohao_30_desc:0 "中兴有功、百世不迁，故上庙号曰代宗。"
 SanGong_miaohao_31_desc:0 "中兴神器、复振宗祚，故上庙号曰中宗。"
 SanGong_miaohao_32_desc:0 "盛德巍巍、於穆不已，故上庙号曰仁宗。"
 SanGong_miaohao_33_desc:0 "功光四海、仁行千载，故上庙号曰显宗。"
 SanGong_miaohao_34_desc:0 "乃圣乃神、益称尧德，故上庙号曰神宗。"
 SanGong_miaohao_35_desc:0 "无所不通、峻德垂统，故上庙号曰圣宗。"
 SanGong_miaohao_36_desc:0 "刚德克就、重明六合，故上庙号曰肃宗。"
 SanGong_miaohao_37_desc:0 "至仁至孝、善继善述，故上庙号曰孝宗。"
 SanGong_miaohao_38_desc:0 "惟天聪明、惟圣时宪，故上庙号曰宪宗。"
 SanGong_miaohao_39_desc:0 "圣善周闻、政教广布，故上庙号曰宣宗。"
 SanGong_miaohao_40_desc:0 "有功安民、受命溥将，故上庙号曰烈宗。"
 SanGong_miaohao_41_desc:0 "照临四方、德象神尧，故上庙号曰明宗。"
 SanGong_miaohao_42_desc:0 "立成功成、奄有四方，故上庙号曰成宗。"
 SanGong_miaohao_43_desc:0 "安乐抚民、庶几成康，故上庙号曰康宗。"
 SanGong_miaohao_44_desc:0 "至道至真、玄之又玄，故上庙号曰玄宗。"
 SanGong_miaohao_45_desc:0 "治近至道、德以称宗，故上庙号曰真宗。"
 SanGong_miaohao_46_desc:0 "克定祸乱、刑民克服，故上庙号曰武宗。"
 SanGong_miaohao_47_desc:0 "经天纬地、慈惠爱民，故上庙号曰文宗。"
 SanGong_miaohao_48_desc:0 "英异之主、出类拔萃，故上庙号曰英宗。"
 SanGong_miaohao_49_desc:0 "惟睿作圣、智虑深远，故上庙号曰睿宗。"
 SanGong_miaohao_50_desc:0 "尧曰知人、世有哲王，故上庙号曰哲宗。"
 SanGong_miaohao_51_desc:0 "坟史征德、生安允迪，故上庙号曰德宗。"
 SanGong_miaohao_52_desc:0 "崇德报本、尊祖隆宗，故上庙号曰崇宗。"
 SanGong_miaohao_53_desc:0 "布德执义、德容静深，故上庙号曰穆宗。"
 SanGong_miaohao_54_desc:0 "光大有功、能绍前业，故上庙号曰光宗。"
 SanGong_miaohao_55_desc:0 "由义而济、光有令绪，故上庙号曰景宗。"
 SanGong_miaohao_56_desc:0 "不为而成、不疾而速，故上庙号曰顺宗。"
 SanGong_miaohao_57_desc:0 "善合法典、庄敬严威，故上庙号曰敬宗。"
 SanGong_miaohao_58_desc:0 "渊衷湛一、宁考安康，故上庙号曰宁宗。"
 SanGong_miaohao_59_desc:0 "兴有大业、圣图丕振，故上庙号曰兴宗。"
 SanGong_miaohao_60_desc:0 "体道得一、天纵自然，故上庙号曰道宗。"
 SanGong_miaohao_61_desc:0 "法度明大、出言有文，故上庙号曰章宗。"
 SanGong_miaohao_62_desc:0 "温和圣善、爱民质渊，故上庙号曰懿宗。"
 SanGong_miaohao_63_desc:0 "法度明大、出言有文，故上庙号曰章宗。"
 SanGong_miaohao_64_desc:0 "果敢坚毅、秉性刚断，故上庙号曰毅宗。"
 SanGong_miaohao_65_desc:0 "宽仁得众、厚德承统，故上庙号曰裕宗。"
 SanGong_miaohao_66_desc:0 "政平刑肃、表章道术，故上庙号曰理宗。"
 SanGong_miaohao_67_desc:0 "胜敌志强、威仪不忒，故上庙号曰庄宗。"
 SanGong_miaohao_68_desc:0 "盛明熙和、敬德光辉，故上庙号曰熙宗。"
 SanGong_miaohao_69_desc:0 "和气广敷、有功安人，故上庙号曰熹宗。"
 SanGong_miaohao_70_desc:0 "质渊受谏、慈惠爱亲，故上庙号曰僖宗。"
 SanGong_miaohao_71_desc:0 "博闻多能、惠而内德，故上庙号曰献宗。"
 SanGong_miaohao_72_desc:0 "道德纯一、体仁长民，故上庙号曰元宗。"
 SanGong_miaohao_73_desc:0 "福庆绵延、善继承宗，故上庙号曰庆宗。"
 SanGong_miaohao_74_desc:0 "奉义顺则、恭俭庄敬，故上庙号曰礼宗。"
 SanGong_miaohao_75_desc:0 "元德充美、雅韵昭彰，故上庙号曰徽宗。"
 SanGong_miaohao_76_desc:0 "容仪恭美、昭德有劳，故上庙号曰昭宗。"
 SanGong_miaohao_77_desc:0 "爱民好与、柔质受谏，故上庙号曰惠宗。"
 SanGong_miaohao_78_desc:0 "强毅执政、庄以临下，故上庙号曰威宗。"
 SanGong_miaohao_79_desc:0 "尊贤贵义、正德美容，故上庙号曰恭宗。"
 SanGong_miaohao_80_desc:0 "好和不争、兆民宁赖，故上庙号曰安宗。"
 SanGong_miaohao_81_desc:0 "疏远继位、绍继前业，故上庙号曰绍宗。"
 SanGong_miaohao_82_desc:0 "威仪悉备、敬事节用，故上庙号曰钦宗。"
 SanGong_miaohao_83_desc:0 "虑深通敏、追悔前过，故上庙号曰思宗。"
 SanGong_miaohao_84_desc:0 "进退可轨、从容有常，故上庙号曰度宗。"
 SanGong_miaohao_85_desc:0 "守礼执义、圣修式化，故上庙号曰端宗。"
 SanGong_miaohao_86_desc:0 "克敬勤民、能成武志，故上庙号曰桓宗。"
 SanGong_miaohao_87_desc:0 "甲胄有劳、协赞有成，故上庙号曰襄宗。"
 SanGong_miaohao_88_desc:0 "统承大绪、总御万方，故上庙号曰统宗。"
 SanGong_miaohao_89_desc:0 "安民大虑、纯行不二，故上庙号曰定宗。"
 SanGong_miaohao_zdy_desc:0 "嗣君亲拟庙号，取「[ROOT.Char.GetLocalizedText( 'SanGong_miaohao_zdy_text' )]」字。"
