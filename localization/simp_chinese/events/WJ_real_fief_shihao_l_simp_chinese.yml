l_simp_chinese:
 WJ_rf_shihao.title:0 "议定先君之谥"
 WJ_rf_shihao.desc:0 "[XianDi.GetUIName]已经辞世。掌故之官将先君治国行事的记录呈到案前，请你议定谥号。\n\n谥以彰行，不因嗣君的亲疏而改写前人的功过，你须据其生平择字。封国之君，礼不称帝，也不立庙号，能为先君议定的，只有这寥寥一两个谥字。"
 WJ_rf_shihao.finish:0 "以此定谥，告成礼典。"
 WJ_rf_shihao.double:0 "一字未尽，再议一字。"
 WJ_rf_shihao.custom:0 "另拟一谥。"
 WJ_rf_shihao.granted_tt:0 "先君之谥，自此载入谱牒。"
