l_simp_chinese:
 WJ_ab_decision:0 "膺禅登极"
 WJ_ab_decision_desc:0 "朝廷大权已归于我，天子亦受我节制。若以天下公议奉禅，便可承接帝统；然而授受之际，辞让与礼节亦将决定新朝的声望。\n\n受禅须在群雄割据之前举行，斗争与对峙阶段不可使用。"
 WJ_ab_before_division_tt:0 "尚未进入群雄割据（斗争或对峙阶段）"
 WJ_ab_decision_tooltip:0 "开始三辞三让的受禅诏书流程"
 WJ_ab_decision_confirm:0 "令礼官议定禅仪"
 WJ_ab.1.t:0 "奉禅诏书"
 WJ_ab.1.desc:0 "天子的使者捧来诏书：帝位非一家私器，今众望有所归，愿以天下大统相授。殿中百官屏息以待，案上的印绶近在咫尺。\n\n这是第[ROOT.Char.MakeScope.Var('wj_ab_round').GetValue|0]次诏命。此前已经辞让[ROOT.Char.MakeScope.Var('wj_ab_declines').GetValue|0]次。"
 WJ_ab.accept:0 "奉诏，承接大统。"
 WJ_ab.decline:0 "臣德薄，未敢当此重任。"
 WJ_ab.2.t:0 "礼不可废"
 WJ_ab.2.desc:0 "诏书虽至，近臣却进言：天下将据今日授受论定新朝。若闻命便受，恐有急于取位之讥；宜再表辞让，使群臣知陛下非贪天子之尊。"
 WJ_ab.insist:0 "天下不可久无所主，不必再辞。"
 WJ_ab.accept_advice:0 "此言有理，具表再辞。"
 WJ_ab.early_accept_tt:0 "第一次诏书便受禅，扣2000正统性；第二次便受禅，扣1000。基础正统性为1000，每次实际辞让再加1000，只在皇位交接成功后统一结算。"
 WJ_ab.3.t:0 "三让既毕"
 WJ_ab.3.desc:0 "三次诏命，三次辞让。群臣再拜劝进：授受之礼已备，不可复使天下久待。请即皇帝位，奉宗庙而定国号。"
 WJ_ab.final_accept:0 "谨奉诏命，告于天地。"
 WJ_ab.4.t:0 "安置逊帝"
 WJ_ab.4.desc:0 "帝统已授，原有州郡与臣属随大统归于新朝。逊帝的亲族与旧廷臣不另行迁徙。现在须议定逊帝的虚封名号与食邑，以全授受之礼；安置完成后，撤去受禅期间的临时保护。"
 WJ_ab.place_village:0 "封乡公，择乡亭为食邑。"
 WJ_ab.place_commandery:0 "封郡公，择郡为封号。"
 WJ_ab.place_king:0 "封王，择郡为王号。"
 WJ_ab.village_duke:0 "乡公"
 WJ_ab_protection:0 "禅仪期间的护卫"
 WJ_ab_new_country_name:0 "[ROOT.Char.Custom('WJ_ab_country_name')]"
 WJ_ab_fief_country_name:0 "[ROOT.Char.MakeScope.Var('wj_ab_country_stem').Title.Custom('WJ_rf_title_stem')]"
 WJ_ab_other_country_name:0 "[ROOT.Char.MakeScope.Var('wj_ab_country_stem').Title.GetBaseNameNoTierNoTooltip]"
