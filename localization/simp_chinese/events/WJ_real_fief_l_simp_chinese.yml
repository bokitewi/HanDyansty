 WJ_rf_request_valid_tt:0 "你须身居丞相、大将军或三公之位，已受侯爵，并以天子为你的[puppet|E]；录尚书事须由你或你的门生、幕僚担任，侍中、大司马、尚书令三职中至少两职须在你的门生、幕僚手中"
