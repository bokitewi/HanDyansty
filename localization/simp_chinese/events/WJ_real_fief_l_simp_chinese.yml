 WJ_rf_no_pending_tt:0 "眼下没有尚未议定的封国之事"
 WJ_rf_marquis_tt:0 "本人持有有效侯爵或更高个人爵位"
 WJ_rf_six_offices_tt:0 "本人实际持有丞相、大将军、太尉、司徒、司空五职之一的官署头衔"
 WJ_rf_puppet_tt:0 "最高领主天子是由本人控制的原生傀儡"
 WJ_rf_secretariat_tt:0 "天子现任录尚书事是本人、本人门生或有效直接幕僚"
 WJ_rf_two_seats_tt:0 "侍中、大司马、尚书令三席中，至少两席由本人的门生或有效直接幕僚担任（本人不计；按席位计数）"
 WJ_rf_hegemony_tt:0 "最高领主为实际霸权天子，而非普通帝国皇帝"
 WJ_rf_not_king_tt:0 "本人尚未持有实封王爵"
 WJ_rf_holds_duchy_fief_tt:0 "本人持有王国级的实封公国；普通州或官署不能代替"
 WJ_rf_not_dynasty_tt:0 "本人不属于天子的宗族"
 WJ_rf_hundred_counties_tt:0 "本人一个实封公国的实际辖区达到100县，计入本人与封臣实际控制的县；仅有法理不算"
