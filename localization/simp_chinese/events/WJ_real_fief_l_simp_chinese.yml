l_simp_chinese:
 WJ_rf_grant:0 "册封实封公"
 WJ_rf_grant_desc:0 "割三郡为此人建立世袭封国。"
 WJ_rf_request_decision:0 "申请封公"
 WJ_rf_request_decision_desc:0 "若天子已在我掌中，台阁要职也尽是我的门生故吏，寻常爵禄便不足以相酬了。到那时，正可请天子割郡建国，让我的家门世守一方。"
 WJ_rf_request_decision_tooltip:0 "请天子割三郡，为你建立世袭封国"
 WJ_rf_request_decision_confirm:0 "请封建国！"
 WJ_rf_expand_decision:0 "申请扩国"
 WJ_rf_expand_decision_desc:0 "请将本朝毗邻封国的一郡并入国中。若封地已经全失，爵号仍在，可重新自选本朝一郡立足；不受旧疆界限制，仍不能选择京畿、外朝及他人的封国。每次仅一郡，成功后须再等三年。"
 WJ_rf_expand_decision_tooltip:0 "并入一处接壤郡；封地全失时可自选本朝合法郡"
 WJ_rf_no_choice:0 "当前没有符合条件的郡"
 WJ_rf_no_choice_tt:0 "有封地时须陆地接壤；无封地时可自由选郡，但该郡及郡治须在本朝，且不属京畿或他人封国。此次不交地，不开始三年冷却。"
 WJ_rf_expand_decision_confirm:0 "请益封！"
 WJ_rf_promote_decision:0 "请求晋封为王"
 WJ_rf_promote_decision_desc:0 "封国日渐广大，朝中再无人能与我比肩。区区公爵，已配不上如今的权势——只差一步，便可进爵为王。"
 WJ_rf_promote_decision_tooltip:0 "进爵为王，原有封国仍归你所有"
 WJ_rf_promote_decision_confirm:0 "进爵为王！"
 WJ_rf_pick:0 "划定封国疆域"
 WJ_rf_pick_desc:0 "舆图在案上铺开，[ROOT.Char.MakeScope.Var('wj_rf_target').Char.GetUIName]的封国疆界，便要从这几郡之间划定。\n\n[ROOT.Char.Custom('WJ_rf_step_desc')]\n\n诸郡并入封国之后，旧有的长吏大多仍守其职，只是从此改隶封国。"
 WJ_rf_success:0 "诏命已下"
 WJ_rf_success_desc:0 "诏书已下，[wj_rf_beneficiary.GetUIName]封国的疆域与名号，自此载入朝廷的版籍。"
 WJ_rf_failed:0 "封国之议中辍"
 WJ_rf_failed_desc:0 "诏书虽已拟就，诸郡的交割却未能如议办成。封国之事只得暂且搁置，朝廷未因此有所耗损，来日仍可再议。"
 WJ_rf_promote_ineligible_desc:0 "晋王之议尚未具备条件，未能颁下诏命。\n\n你须持有实封公国，仍为本朝臣属；最高领主须持有霸权，且是由你控制的傀儡。录尚书事须由你本人、你的现任门生或直接所属幕僚担任，公国实际辖区还须达到一百个县。\n\n这些条件在实际授爵时仍会核验；仅跳过决议入口的限制，并不会直接建立王号。此次未改动任何头衔。"
 WJ_rf_duke_rank:0 "公"
 WJ_rf_dynamic_name:0 "[ROOT.Char.Custom('WJ_rf_selected_name')]国"
 WJ_rf_held_name_dispatch:0 "[ROOT.Char.Custom('WJ_rf_held_name')]"
 WJ_rf_native_stem:0 "[ROOT.Char.MakeScope.Var('wj_rf_owned_title').Title.Custom('WJ_rf_title_stem')]"
 WJ_rf_held_name_prefix:0 "[ROOT.Char.Custom('WJ_rf_held_name')] "
 WJ_rf_promoted_name:0 "[wj_rf_new_fief.Custom('WJ_rf_title_stem')]国"
 WJ_rf_county_name:0 "[ROOT.Char.MakeScope.Var('wj_rf_capital').Title.GetNameNoTierNoTooltip]"
 WJ_rf_title_county_name:0 "[ROOT.Title.MakeScope.Var('wj_rf_stem_capital').Title.GetNameNoTierNoTooltip]"
 WJ_rf_real_duke_name:0 "[ROOT.Char.MakeScope.Var('wj_rf_owned_title').Title.Custom('WJ_rf_title_stem')]公"
 WJ_rf_real_king_name:0 "[ROOT.Char.MakeScope.Var('wj_rf_owned_title').Title.Custom('WJ_rf_title_stem')]王"
 WJ_rf_real_duke_prefix:0 " [ROOT.Char.Custom('WJ_rf_held_name')]"
 WJ_rf_stage_0:0 "先择封国所在之州。"
 WJ_rf_stage_1:0 "再择国都所在之郡。"
 WJ_rf_stage_2:0 "再择一郡，须与国都所在之郡接壤。"
 WJ_rf_stage_3:0 "最后择一郡，须与已选诸郡接壤。择定之后，封国即告建立。"
 WJ_rf_stage_expand:0 "择一与封国接壤之郡，并入国中。"
 WJ_rf_stage_reseat_0:0 "封地虽失，爵号尚存。先择一州，再选本朝可用之郡重立封国。此次只授一郡，不重新册爵。"
 WJ_rf_stage_reseat_1:0 "择一郡重立封国，郡治授你直辖。京畿、外朝与他人封国仍不可选；成功后，扩郡须再等三年。"
