l_simp_chinese:
 WJ_rf_grant:0 "册封实封公"
 WJ_rf_grant_desc:0 "割三郡为此人建立世袭封国。"
 WJ_rf_request_decision:0 "申请封公"
 WJ_rf_request_decision_desc:0 "若天子已在我掌中，台阁要职也尽是我的门生故吏，寻常爵禄便不足以相酬了。到那时，正可请天子割郡建国，让我的家门世守一方。"
 WJ_rf_request_decision_tooltip:0 "请天子割三郡，为你建立世袭封国"
 WJ_rf_request_decision_confirm:0 "请封建国！"
 WJ_rf_expand_decision:0 "申请扩国"
 WJ_rf_expand_decision_desc:0 "封国初立，疆土尚狭。若能把毗邻的一郡也并入国中，这份基业才算立得稳当。"
 WJ_rf_expand_decision_tooltip:0 "将一处与封国接壤的郡并入封国"
 WJ_rf_expand_decision_confirm:0 "请益封！"
 WJ_rf_promote_decision:0 "请求晋封为王"
 WJ_rf_promote_decision_desc:0 "封国日渐广大，朝中再无人能与我比肩。区区公爵，已配不上如今的权势——只差一步，便可进爵为王。"
 WJ_rf_promote_decision_tooltip:0 "进爵为王，原有封国仍归你所有"
 WJ_rf_promote_decision_confirm:0 "进爵为王！"
 WJ_rf_pick:0 "划定封国疆域"
 WJ_rf_pick_desc:0 "舆图在案上铺开，[ROOT.Char.MakeScope.Var('wj_rf_target').Char.GetUIName]的封国疆界，便要从这几郡之间划定。\n\n[ROOT.Char.Custom('WJ_rf_step_desc')]\n\n诸郡并入封国之后，旧有的长吏大多仍守其职，只是从此改隶封国。"
 WJ_rf_success:0 "诏命已下"
 WJ_rf_success_desc:0 "诏书已下，[wj_rf_beneficiary.GetUIName]封国的疆域与名号，自此载入朝廷的版籍。"
 WJ_rf_failed:0 "封国之议中辍"
 WJ_rf_failed_desc:0 "诏书虽已拟就，诸郡的交割却未能如议办成。封国之事只得暂且搁置，朝廷未因此有所耗损，来日仍可再议。"
 WJ_rf_duke_rank:0 "公"
