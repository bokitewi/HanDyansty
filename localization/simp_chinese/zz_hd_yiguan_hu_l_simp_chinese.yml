l_simp_chinese:
 # 衣冠南渡·胡人侧（推行汉化 / 推行胡化 / 建天朝制）
 # 3001–3004 的标题、正文、选项沿用天子版 hd_dc_con.0201–0204（hd_dc_kit_con_l_simp_chinese.yml）

 # ---------- 决议：推行汉化 ----------
 hd_yiguan_sinicization_decision:0 "推行汉化"
 hd_yiguan_sinicization_decision_desc:0 "入主中原日久，马上得之，终不能马上治之。效法古之贤主，迁都汉地，改着汉家衣冠，易胡姓为汉姓，禁胡语于朝堂，以夏变夷，收中原士民之心。\n\n改制一经颁行便次第推进，每一步都会激起本族勋贵的不满，甚至兵变。"
 hd_yiguan_sinicization_decision_tooltip:0 "颁行汉化改制，分四步推进，可传嗣君"
 hd_yiguan_sinicization_decision_confirm:0 "诏行汉化"
 hd_yiguan_sinicization_decision_effect_tt:0 "迁都、易服、改姓、禁胡语四道诏令，每隔两三年次第颁行，每一步都可中止。本族勋贵会一步步心生怨望，#EMP 甚或举兵作乱#!；汉人封臣则日渐归心。四事俱成，你的王朝便成为#P 汉化王朝#!，你改从胡汉合流之俗，领内各县不再受沦陷减益。\n改制随国传承：你若中道而殁，由主继承人接续；失去全部封地则改制中止。推行期间不能推行胡化。\n每推行一步："
 hd_yiguan_sinicization_next_step_tt:0 "下一道诏令将在两三年后颁行"
 hd_yiguan_sinicization_done_tt:0 "汉化改制告成：你的王朝成为#P 汉化王朝#!，在衣冠南渡中归入#V 汉化政权#!，领内各县不再受沦陷减益"

 # ---------- 决议：推行胡化 ----------
 hd_yiguan_huhua_decision:0 "推行胡化"
 hd_yiguan_huhua_decision_desc:0 "汉人恋其故俗，终不肯与我同心。与其处处迁就，不如令境内汉地改从本族之俗：编户、祠祀、婚丧、冠服，一依我族旧制。日久年深，汉地亦将成为我族之地。\n\n此令必为汉人所怨：治下汉人封臣将心生不满，沦陷之地也更易生变。"
 hd_yiguan_huhua_decision_tooltip:0 "令境内汉地改从本族风俗"
 hd_yiguan_huhua_decision_confirm:0 "胡俗为尊"
 hd_yiguan_huhua_decision_effect_tt:0 "此后二十年，每年有 #V 25%#! 的几率，把你领内（含封臣领地）#V 1~3#! 个北方的汉文化沦陷县改为你的文化（信仰不变，优先选与本族文化县接壤者），改后即不再受沦陷减益。每位统治者累计至多 #V 30#! 县。\n推行期间新归附、新受封的汉人封臣同样心怀不满；推行期满或胡化之县满 30 时，这份不满随之消解。\n推行期间不能推行汉化。"
 hd_yiguan_huhua_han_vassals_tt:0 "每位汉人[vassal|E]（含次级封臣）"
 hd_yiguan_huhua_uprising_tt:0 "推行期间，你治下沦陷区汉人#N 举兵起义#!的代价减半"

 # ---------- 决议条件 ----------
 hd_yiguan_hu_reform_phase_tt:0 "衣冠南渡处于#V 停滞#!阶段，且你属于#V 胡人政权#!"
 hd_yiguan_huhua_blocks_reform_tt:0 "未在推行胡化"
 hd_yiguan_huhua_active_tt:0 "胡化尚未在推行中"
 hd_yiguan_reform_blocks_huhua_tt:0 "未在推行汉化改制"
 hd_yiguan_huhua_cap_tt:0 "累计胡化之县未满 30"
 hd_yiguan_huhua_target_tt:0 "领内有北方的汉文化沦陷县"

 # ---------- 决议：建天朝制 ----------
 hd_yiguan_celestial_decision:0 "建天朝制"
 hd_yiguan_celestial_decision_desc:0 "我的王朝已易服改姓、尽行汉制，是时候仿效中原的典章，建立天朝的体制了。"
 hd_yiguan_celestial_decision_tooltip:0 "改行[GetGovernment('celestial_government').GetName]"
 hd_yiguan_celestial_decision_confirm:0 "建制立朝！"
 hd_yiguan_celestial_decision_effect_tt:0 "你将改行[GetGovernment('celestial_government').GetName]。"

 # ---------- 提示 ----------
 hd_yiguan_sinicization_lapsed_toast:0 "改制中止"
 hd_yiguan_sinicization_lapsed_toast_tt:0 "你已失去全部封地，汉化改制无以为继，就此中止。"
 hd_yiguan_sinicization_abandoned_toast:0 "北朝罢改制"
 hd_yiguan_sinicization_abandoned_toast_tt:0 "[hd_yiguan_hu_actor.GetShortUIName]已罢废汉化改制。"
 hd_yiguan_huhua_county_toast:0 "胡化渐行"
 hd_yiguan_huhua_county_toast_tt:0 "[hd_yiguan_hh_county.GetName]已改从[hd_yiguan_hh_ruler.GetCulture.GetName]风俗，不再算作沦陷之地。"
 hd_yiguan_huhua_county_holder_toast:0 "治下改俗"
 hd_yiguan_reform_decreed_toast:0 "汉化诏下"
 hd_yiguan_reform_decreed_toast_tt:0 "[hd_yiguan_hu_actor.GetShortUIName]下诏推行汉化改制：迁都、易服、改姓、禁胡语四事，将每隔两三年次第颁行。"
 hd_yiguan_reform_done_toast:0 "汉化告成"
 hd_yiguan_reform_done_toast_tt:0 "[hd_yiguan_hu_actor.GetShortUIName]的汉化改制已经告成：其王朝成为#P 汉化王朝#!，在衣冠南渡中归入#V 汉化政权#!，其境内各县不再受沦陷减益。"
 hd_yiguan_huhua_decreed_toast:0 "胡化令下"
 hd_yiguan_huhua_decreed_toast_tt:0 "[hd_yiguan_hu_actor.GetShortUIName]下令推行胡化：此后二十年，其境内北方的汉文化沦陷县将陆续改从[hd_yiguan_hu_actor.GetCulture.GetName]风俗。"
 hd_yiguan_huhua_county_holder_toast_tt:0 "奉[hd_yiguan_hh_ruler.GetShortUIName]胡化之令，[hd_yiguan_hh_county.GetName]已改从[hd_yiguan_hh_ruler.GetCulture.GetName]风俗。"

 # ---------- 事件：汉化通知 ----------
 hd_yiguan.3010.t:0 "胡主改制"
 hd_yiguan.3010.desc:0 "北来的商旅带回一则消息：[hd_yiguan_hu_actor.GetShortUIName]下诏，将尽革本族旧俗，迁都汉地，改着汉家衣冠，连宗室勋贵的复姓也要一并改易。传话的人说得兴起，又压低声音补了一句：那边的本族老臣多有不平，朝中议论汹汹。\n\n身边的人各有看法。有人冷笑，以为胡人沐猴而冠，不过一时兴起；也有人神色凝重，说若真让北方的汉民认了这位新主，往后南北之间的事，就不是单凭兵马能说清的了。\n\n我让人记下此事。往后北方的每一道诏令，都须有人留心。"
 hd_yiguan.3010.a:0 "且看此人能行到几步。"
 hd_yiguan.3011.t:0 "北朝易俗"
 hd_yiguan.3011.desc:0 "[hd_yiguan_hu_actor.GetShortUIName]的最后一道诏令已经颁行：朝堂之上不复闻北语，宗室改用汉姓，冠服礼仪一依中原旧制。北方传来的文书，措辞已与江左的公文相去不远。\n\n使者说，那边的汉人士族纷纷出仕，有人甚至以为正朔已在北方。这句话说出口时，殿中一时无人接话。\n\n胡汉之别，从前是一道看得见的界线；如今这条界线在北方渐渐模糊，往后可争的，便只剩谁能承中原之统这一件事。"
 hd_yiguan.3011.a:0 "衣冠可易，正统难移。"
 hd_yiguan.3012.t:0 "改制告成"
 hd_yiguan.3012.desc:0 "禁胡语的诏书颁下之后，朝会第一次全用正音。几位老臣开口时仍有些生涩，说到要紧处，还会不自觉地停下来寻字；年轻的宗室子弟倒已应对自如，仿佛生来就在这样的朝堂上。\n\n迁都、易服、改姓、禁胡语，四道诏令前后历时多年，每一步都有人反对，也有人因此离心。如今回头看去，旧日的帐幕与部落旗号已远，留下来的，是一座肯接纳中原士人的朝廷。\n\n史官问这一年当如何记载。我想了想，只让他写下：自此以后，胡汉同为一国之民。"
 hd_yiguan.3012.a:0 "四海一家，自此始矣。"
 hd_yiguan.3012.a.tt:0 "你的王朝已成为#P 汉化王朝#!，在衣冠南渡中属于#V 汉化政权#!。若你是独立的王国级以上统治者，可以颁行「建天朝制」。"
 hd_yiguan.3014.t:0 "先君遗诏"
 hd_yiguan.3014.desc:0 "先君的灵柩尚未下葬，朝中便有人来问汉化改制之事。先君在日力主改制，诏令只颁行了一部分，余下的几步，如今都要由我来定夺。\n\n本族勋贵趁新君初立，纷纷进言请罢新政，说先君已逝，不必再勉强众人；汉人士族则请我继志述事，莫使前功尽弃。两边口中说的都是先君，却各自记得先君不同的样子。"
 hd_yiguan.3014.desc.s0:0 "\n\n先君已下改制之诏，迁都之议尚未付诸施行。"
 hd_yiguan.3014.desc.s1:0 "\n\n都城已迁于汉地，易服、改姓、禁胡语三事尚未颁行。"
 hd_yiguan.3014.desc.s2:0 "\n\n迁都、易服两事已成，改姓、禁胡语尚待颁行。"
 hd_yiguan.3014.desc.s3:0 "\n\n迁都、易服、改姓三事已成，只差禁胡语一道诏令。"
 hd_yiguan.3014.a:0 "先君之志，不可中辍。"
 hd_yiguan.3014.a.tt:0 "汉化改制照旧推进，下一道诏令将在数月至数年后颁行"
 hd_yiguan.3014.b:0 "新君初立，宜安众心，罢议改制。"

 # ---------- 事件：推行胡化 ----------
 hd_yiguan.3201.t:0 "胡化之令"
 hd_yiguan.3201.desc:0 "北方来的流民说，[hd_yiguan_hu_actor.GetShortUIName]已下令在汉人聚居的郡县推行本族风俗：编户改从部落之制，祠祀、婚丧、服饰皆依胡俗，不从者或夺其田宅，或迁往他处。\n\n他们说起这些时语气平平，好像早已惯了。只有说到家乡的祖坟，才停下来，望着南边不再说话。\n\n北方的汉人从此更难安身，南来的人怕是还要更多；而那些留下来的人心里积下的怨气，终有一日要寻个出处。"
 hd_yiguan.3201.a:0 "中原衣冠，竟至于此。"
 hd_yiguan.3202.t:0 "胡化之令"
 hd_yiguan.3202.desc:0 "宗主的诏令送到时，族中长辈正在祠堂里议事。诏书写得明白：境内汉人所居之地，此后俗从本族，编户、祠祀、婚丧、冠服都要改易。传诏的使者站在阶下，等着看我如何接令。\n\n祠堂里一时无人出声。我知道，接了这道诏令，往后我治下的乡里会一处接一处地改了模样；不接，眼前便是抗命。族中年轻人的目光，却已越过使者，望向了门外。"
 hd_yiguan.3202.a:0 "接令。留得此身，才有来日。"
 hd_yiguan.3202.b:0 "上书力陈，汉俗不可尽废。"
 hd_yiguan.3202.c:0 "暗中联络义士，以备不时。"
 hd_yiguan.3202.desc.rule:0 "\n\n宗主推行胡化期间，治下沦陷区汉人举兵起义的代价减半。"
 hd_yiguan.3203.t:0 "胡化稍息"
 hd_yiguan.3203.desc:0 "推行胡化的诏令已行二十年。最初几年，各地屡有汉户逃散、抗命之事；如今那些改了风俗的县里，年轻一辈说着本族的言语长大，祭祀时也不再有人提起从前的样子。\n\n主事的官吏前来请示，问此事是否就此告一段落。二十年间改易之地已有不少，再要推行下去，所费的心力怕也不同往日。\n\n我让他们把这些年的户籍呈上来。往后如何，可以再议。"
 hd_yiguan.3203.desc.cap:0 "推行胡化至今，境内已有三十县改从本族之俗。主事的官吏呈上户籍，说余下的汉人州县民心不稳，若再强行改易，恐生大变。\n\n我翻着那一册册改过的户籍，名字、祠祀、婚俗，都已与从前不同。能做的已经做了，余下的，只能交给岁月。"
 hd_yiguan.3203.a:0 "风俗既成，不必再强求。"
 hd_yiguan.3210.t:0 "汉户流散"
 hd_yiguan.3210.desc:0 "[hd_yiguan_hh_county.GetName]改从本族之俗后，地方官报来消息：不少汉户趁夜收拾细软，携家带口往山中或南方逃去，留下的人家也闭门不出，田里的活计无人照管。\n\n本族将领主张派兵把守要道，逃者一律追回；也有人劝我暂免此地赋役，让留下的人先安下心来。还有人说，愿走的就让他们走，空出来的田地，正好分给本族的牧户。"
 hd_yiguan.3210.a:0 "严禁逃亡，逃者追回治罪。"
 hd_yiguan.3210.b:0 "蠲免赋役，以安其心。"
 hd_yiguan.3210.c:0 "任其去留，空地另行安置。"
