 hd_party.0020.t: "迫其归心"
 hd_party.0020.desc: "[hd_party_target_leader.GetShortUIName]与其党羽在朝中自成一派。若能迫其俯首，此党便会改奉“尊王”，直到其党魁易人，或你不复在位。\n\n只是强压之下，未必人人心服。"
 hd_party.0020.a: "挟权势以逼之"
 hd_party.0020.b: "以名分大义责之"
 hd_party.0020.c: "以威望压之"
 hd_party.0020.d: "倾尽声望，强令俯首"
 hd_party.0020.e: "执其把柄以胁之"
 hd_party.0020.f: "此事且缓"
 hd_party.0101.t: "解除党锢"
 hd_party.0101.desc: "黄巾之乱骤起，四方震动。中常侍吕强向你进言：党锢积怨已久，若不赦宥，党人恐与张角合谋，为祸更烈。"
 hd_party.0101.a: "大赦党人"
 hd_party.0101.a.tt: "被禁锢的士人得以还归故里，寒门之中人心稍安。"
 hd_party_chain.11.t: "中常侍得宠"
 hd_party_chain.11.desc: "[hd_party_chain_leader.GetShortUIName]日夜侍奉在你左右，小心恭谨，深得你的欢心。宫中诸人私下都说：中常侍之位，非此人莫属。"
 hd_party_chain.11.a: "拜为中常侍"
 hd_party_chain.11.b: "赐以钱帛，以酬其劳"
 hd_party_chain.11.c: "宫闱之事，不宜多议"
 hd_party_chain.12.t: "西园典兵"
 hd_party_chain.12.desc: "[hd_party_chain_leader.GetShortUIName]上言，请于西园置八校尉，由宦官统领禁兵，以备非常。消息传出，武人多有不平。"
 hd_party_chain.12.a: "准其所请"
 hd_party_chain.12.b: "赐以名号，不授兵权"
 hd_party_chain.12.c: "兵者国之大事，不可轻授"
 hd_party_chain.13.t: "宦官干政"
 hd_party_chain.13.desc: "诸常侍联名上奏，请代你批阅章奏，“以省主上之劳”。若许之，号令将出于宫禁；若不许，诸宦恐生怨望。"
 hd_party_chain.13.a: "委以章奏"
 hd_party_chain.13.c: "此事断不可行"
 hd_party_chain.21.t: "后族封侯"
 hd_party_chain.21.desc: "后族[hd_party_chain_leader.GetShortUIName]屡有功劳，朝臣纷纷上书，请你以侯爵相酬。"
 hd_party_chain.21.a: "裂土封之"
 hd_party_chain.21.b: "厚赐金帛"
 hd_party_chain.21.c: "无功不可封侯"
 hd_party_chain.22.t: "外戚掌兵"
 hd_party_chain.22.desc: "[hd_party_chain_leader.GetShortUIName]请领将军之号，统摄禁兵，宿卫京师。"
 hd_party_chain.22.a: "拜为将军"
 hd_party_chain.22.b: "赐以荣名"
 hd_party_chain.22.c: "兵权不可假人"
 hd_party_chain.23.t: "外戚辅政"
 hd_party_chain.23.desc: "外戚之势日隆。[hd_party_chain_leader.GetShortUIName]上表，请录尚书事，辅理朝政。"
 hd_party_chain.23.a: "委以辅政"
 hd_party_chain.23.c: "吾当亲理朝政"
 hd_party_chain.51.t: "察举拔擢"
 hd_party_chain.51.desc: "寒门士人联名上书，请你广开察举，拔擢孤寒之士。"
 hd_party_chain.51.a: "广开察举，不拘门第"
 hd_party_chain.51.b: "略取一二"
 hd_party_chain.51.c: "仕途自有成规"
 hd_party_chain.52.t: "清议成风"
 hd_party_chain.52.desc: "太学诸生品核公卿，裁量执政，清议之声遍于朝野，连你的施政也在其评说之列。"
 hd_party_chain.52.a: "嘉其直言"
 hd_party_chain.52.b: "听之而已"
 hd_party_chain.52.c: "妄议朝政者，当禁"
 hd_party_chain.53.t: "寒门入台阁"
 hd_party_chain.53.desc: "寒门之望[hd_party_chain_leader.GetShortUIName]声名日著，众人都请你引其入台阁，参预机务。"
 hd_party_chain.53.a: "引入台阁"
 hd_party_chain.53.c: "资望尚浅"
 hd_party_chain.41.t: "门第荐举"
 hd_party_chain.41.desc: "世族诸公彼此荐引，请以门第子弟充任郎官。"
 hd_party_chain.41.a: "准其所荐"
 hd_party_chain.41.b: "择优而用"
 hd_party_chain.41.c: "选官当论才德"
 hd_party_chain.42.t: "兼并田产"
 hd_party_chain.42.desc: "豪右之家广占田土，奴客动以千计。有司请加禁约，世族诸公却纷纷向你求情。"
 hd_party_chain.42.a: "听其所为"
 hd_party_chain.42.b: "略加约束"
 hd_party_chain.42.c: "严禁兼并"
 hd_party_chain.43.t: "门阀垄断仕途"
 hd_party_chain.43.desc: "世族诸公请定品第之法，以门第高下定官品，寒门子弟从此几无进身之路。"
 hd_party_chain.43.a: "定为成法"
 hd_party_chain.43.c: "此法断不可行"
 hd_party_chain.31.t: "拜将封侯"
 hd_party_chain.31.desc: "[hd_party_chain_leader.GetShortUIName]屡立战功，麾下将士纷纷请你拜之为将、厚加封赏，以励三军。"
 hd_party_chain.31.a: "拜为将军"
 hd_party_chain.31.b: "厚加赏赐"
 hd_party_chain.31.c: "功未及此"
 hd_party_chain.32.t: "边将拥兵"
 hd_party_chain.32.desc: "诸边将上书，请各领部曲、自募兵马，以御外侮。"
 hd_party_chain.32.a: "准其自募"
 hd_party_chain.32.b: "赐以钱粮"
 hd_party_chain.32.c: "兵归朝廷"
 hd_party_chain.33.t: "武人跋扈"
 hd_party_chain.33.desc: "诸将恃功而骄，屡有不法之举。若加纵容，武人将愈发跋扈；若加裁抑，又恐激生兵变。"
 hd_party_chain.33.a: "姑且容之"
 hd_party_chain.33.c: "严加裁抑"
