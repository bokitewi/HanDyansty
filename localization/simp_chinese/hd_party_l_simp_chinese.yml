 hd_party_debate.0020.fail: "一时语塞"
 hd_party_debate.0023.success: "驳得对方哑口无言"
 hd_party_debate.0023.fail: "反被抓住了破绽"
 hd_party_debate.0030.success: "你方大胜"
 hd_party_debate.0030.fail: "你方落于下风"
