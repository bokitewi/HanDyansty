 HD_PARTY_ATTITUDE_WUXUN_TT: "#T 武勋对君主的态度：[SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_wuxun_attitude').GetFlagName, 'support' ), 'hd_party_attitude_support_name', SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_wuxun_attitude').GetFlagName, 'oppose' ), 'hd_party_attitude_oppose_name', 'hd_party_attitude_neutral_name' ) )]#!\n拥护分：[Character.MakeScope.Var('hd_party_wuxun_score').GetValue|0]（≥ 50 转为拥护，≤ −50 转为对抗；已拥护者低于 20、已对抗者高于 −20 时回到中立）\n\n拥护时君主获得：征召兵 #P +15%#!、征召兵恢复 #P +20%#!、兵士团数上限 #P +1#!、兵士维护 #P −10%#!\n对抗时君主承受：征召兵 #N −22.5%#!、征召兵恢复 #N −30%#!、兵士团数上限 #N −2#!、兵士维护 #N +15%#!\n\n#weak 一党势力若不足朝中一成，其向背便无关大局。#!"
