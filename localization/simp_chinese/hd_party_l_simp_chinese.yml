 HD_PARTY_STANCE_ZUNWANG_TT: "#T 尊王#!\n此党奉君主为尊：党人不结派系，不举兵犯上，对领主好感 #P +15#!，也极少对领主暗施阴谋；领主拿问其党人时少遇抗拒；党中武臣愿随君出征，文臣出任总督，效率 #P +10%#!。其党人为封臣，多持“宫廷礼制”的[vassal_stance|E]。"
 hd_party_stance_zunwang: "尊王"
 HD_PARTY_STANCE_KAITUO_TT: "#T 开拓#!\n此党力主开疆拓土：向主上请愿、议论国政时，多求扩充军旅、增置军镇、广纳保护国；其党人为封臣，多持“尚武好斗”的[vassal_stance|E]。"
 hd_party_stance_kaituo: "开拓"
 HD_PARTY_STANCE_JINQU_TT: "#T 进取#!\n此党力主兴利除弊：请愿、议政多求扩充官署、开科取士、增加俸禄；其党人为封臣，多持“本乡本土”的[vassal_stance|E]。"
 hd_party_stance_jinqu: "进取"
 HD_PARTY_STANCE_SHOUJIU_TT: "#T 守旧#!\n此党力主恪守祖制：请愿、议政多着眼于致仕之法、诸曹用度与选官资格；其党人为封臣，多持“追名逐利”的[vassal_stance|E]。"
 hd_party_stance_shoujiu: "守旧"
 HD_PARTY_STANCE_ZHONGLI_TT: "#T 中立#!\n此党不涉纷争，于朝政无所偏执。"
 hd_party_stance_zhongli: "中立"
 HD_PARTY_RELATION_COOP_TT: "#T 合作#!\n两党立场相近（进取与开拓、中立与守旧、尊王与拥护君主者），两党党魁与各自前三位要人彼此亲善，互有 #P +10#! 好感。"
 HD_PARTY_RELATION_NONE_TT: "#T 无#!\n两党既不对立，也不合作。"
 HD_PARTY_RELATION_HOSTILE_TT: "#T 对立#!\n两党立场相悖（进取与守旧、开拓与守旧、尊王与对抗君主者），两党党魁与各自前三位要人彼此嫌恶，互有 #N −15#! 好感，党争或由此而起。"
 HD_PARTY_POLICY_BAN_TT: "#T 政治运作：查禁#!\n禁锢此党，不许其党人仕进：其成员影响力 #N −50%#!、威望与正统获取 #N −30%#!、任命与继承分数 #N −50#!，对君主好感 #N −30#!；君主可随意拿问其党人，其党人及门下廷臣也更易出走。\n每月耗费：影响力 3（无影响力的政体耗威望 5）。\n\n#weak 政令既下，五年之内不得更易（复归中立不在此限）。#!"
 HD_PARTY_POLICY_RESTRICT_TT: "#T 政治运作：限制#!\n压制此党：其成员影响力 #N −20%#!、威望与正统获取 #N −10%#!、任命与继承分数 #N −20#!，对君主好感 #N −10#!。\n每月耗费：影响力 1（无影响力的政体耗威望 2）。\n\n#weak 政令既下，五年之内不得更易（复归中立不在此限）。#!"
 HD_PARTY_POLICY_NEUTRAL_TT: "#T 政治运作：中立#!\n不加扶抑，听其自然，无需耗费。\n\n#weak 政令既下，五年之内不得更易（复归中立不在此限）。#!"
 HD_PARTY_POLICY_PROMOTE_TT: "#T 政治运作：促进#!\n扶持此党：其成员影响力 #P +20%#!、威望与正统获取 #P +10%#!、任命与继承分数 #P +20#!，对君主好感 #P +10#!。\n每月耗费：影响力 1（无影响力的政体耗威望 2）。\n\n#weak 政令既下，五年之内不得更易（复归中立不在此限）。#!"
 HD_PARTY_ATTITUDE_HUANGUAN_TT: "#T 宦官对君主的态度：[SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_huanguan_attitude').GetFlagName, 'support' ), 'hd_party_attitude_support_name', SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_huanguan_attitude').GetFlagName, 'oppose' ), 'hd_party_attitude_oppose_name', 'hd_party_attitude_neutral_name' ) )]#!\n拥护分：[Character.MakeScope.Var('hd_party_huanguan_score').GetValue|0]（≥ 50 转为拥护，≤ −50 转为对抗；已拥护者低于 20、已对抗者高于 −20 时回到中立）\n\n拥护时君主获得：影响力获取 #P +15%#!、恐怖值基线 #P +10#!、敌对计谋成功率 #P +10%#!\n对抗时君主承受：影响力获取 #N −22.5%#!、恐怖值基线 #N −15#!、敌对计谋成功率 #N −15%#!\n\n#weak 一党势力若不足朝中一成，其向背便无关大局。#!"
 HD_PARTY_PANEL_POWER_HUANGUAN: "势力 [Character.MakeScope.Var('hd_party_huanguan_power').GetValue|0] · 占比 [Character.MakeScope.Var('hd_party_huanguan_share').GetValue|0]%"
 HD_PARTY_PANEL_SATISFACTION_HUANGUAN: "满意度：[Character.MakeScope.Var('hd_party_huanguan_satisfaction').GetValue|0]"
 HD_PARTY_OVERVIEW_NUMBERS_HUANGUAN: "满意 [Character.MakeScope.Var('hd_party_huanguan_satisfaction').GetValue|0] · 占比 [Character.MakeScope.Var('hd_party_huanguan_share').GetValue|0]%"
 HD_PARTY_ATTITUDE_WAIQI_TT: "#T 外戚对君主的态度：[SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_waiqi_attitude').GetFlagName, 'support' ), 'hd_party_attitude_support_name', SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_waiqi_attitude').GetFlagName, 'oppose' ), 'hd_party_attitude_oppose_name', 'hd_party_attitude_neutral_name' ) )]#!\n拥护分：[Character.MakeScope.Var('hd_party_waiqi_score').GetValue|0]（≥ 50 转为拥护，≤ −50 转为对抗；已拥护者低于 20、已对抗者高于 −20 时回到中立）\n\n拥护时君主获得：宣称者派系不满增长 #P −30%#!、总督效率 #P +5%#!、直属封臣与廷臣好感 #P +5#!\n对抗时君主承受：宣称者派系不满增长 #N +45%#!、总督效率 #N −7.5%#!、直属封臣与廷臣好感 #N −7.5#!\n\n#weak 一党势力若不足朝中一成，其向背便无关大局。#!"
