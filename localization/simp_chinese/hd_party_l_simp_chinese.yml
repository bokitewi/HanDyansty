 hd_party_debate.0010.t: "廷辩在即"
 hd_party_debate.0010.desc: "距廷辩尚有月余，朝中已是暗流涌动。同党待你登高一呼，中立之士犹在观望，对手的门客也正四处奔走。"
 hd_party_debate.0010.a: "遍邀同党，共商对策"
 hd_party_debate.0010.b: "登门拜谒中立之士"
 hd_party_debate.0010.c: "暗中散布流言"
 hd_party_debate.0020.t: "引经据典"
 hd_party_debate.0020.desc: "[hd_party_debate_rival.GetShortUIName]援引《春秋》大义向你发难，满座的目光都落在你身上。"
 hd_party_debate.0020.a: "以经义还诘之"
 hd_party_debate.0021.t: "清议声援"
 hd_party_debate.0021.desc: "太学诸生闻讯，纷纷为你张目，清议之声不绝于耳。"
 hd_party_debate.0021.a: "人心可用"
 hd_party_debate.0022.t: "酒宴拉拢"
 hd_party_debate.0022.desc: "你打算在府中设宴，款待诸位同僚。酒酣耳热之际，或可多得几分支持。"
 hd_party_debate.0022.a: "大开筵席，广邀同僚"
 hd_party_debate.0022.b: "不必如此"
 hd_party_debate.0023.t: "当廷驳斥"
 hd_party_debate.0023.desc: "[hd_party_debate_rival.GetShortUIName]当廷发难，斥你所言有违祖制。"
 hd_party_debate.0023.a: "据理力驳"
 hd_party_debate.0023.b: "暂避锋芒"
 hd_party_debate.0024.t: "援引祖制"
 hd_party_debate.0024.desc: "反对者纷纷援引祖宗成法，守旧之论一时占了上风。"
 hd_party_debate.0024.a: "且容其得意一时"
 hd_party_debate.0025.t: "群情汹汹"
 hd_party_debate.0025.desc: "堂下议论纷纷，有人按捺不住，当场表明了态度。"
 hd_party_debate.0025.a: "且看风向"
 hd_party_debate.0030.t: "决胜之辩"
 hd_party_debate.0030.desc: "辩论已至紧要关头。你与[hd_party_debate_rival.GetShortUIName]当面交锋，胜负在此一举。"
 hd_party_debate.0030.a: "全力以赴"
 hd_party_debate.0031.t: "临阵倒戈"
 hd_party_debate.0031.desc: "廷辩正酣，席间忽有人起身，改换了阵营。"
 hd_party_debate.0031.a: "世事难料"
 hd_party_debate.0032.t: "拂袖而去"
 hd_party_debate.0032.desc: "[hd_party_debate_rival.GetShortUIName]辩之不过，拂袖而去，反对者气势大挫。"
 hd_party_debate.0032.a: "妙哉"
 hd_party_debate.0033.t: "据理力争"
 hd_party_debate.0033.desc: "众人将信将疑。你若肯以自身声望为之作保，或可说动更多人。"
 hd_party_debate.0033.a: "以一身声望作保"
 hd_party_debate.0033.b: "姑且不必"
 hd_party_debate.0040.t: "廷辩之中"
 hd_party_debate.0040.desc: "廷辩正酣，你所在的一方正需助力。"
 hd_party_debate.0040.a: "解囊相助"
 hd_party_debate.0040.b: "以声望为之张目"
 hd_party_debate.0040.c: "静观其变"
 hd_party_debate.0050.t: "请君裁断"
 hd_party_debate.0050.desc: "[host.GetShortUIName]发起的立场之辩相持不下，双方都在等你表态。你若开口，胜负便定了大半。"
 hd_party_debate.0050.a: "发起人所言有理"
 hd_party_debate.0050.b: "反对者所言有理"
 hd_party_debate.0050.c: "不置可否"
 hd_party_debate.0090.t: "辩论得胜"
 hd_party_debate.0090.desc: "廷辩以你方胜出告终。自今日起，本党改奉新的立场。"
 hd_party_debate.0090.a: "众望所归"
 hd_party_debate.0091.t: "辩论落败"
 hd_party_debate.0091.desc: "廷辩以你方落败告终。同党对你颇有微词，此后经年，你再难领袖群伦。"
 hd_party_debate.0091.a: "时也命也"
