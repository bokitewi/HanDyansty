 HD_PARTY_ATTITUDE_SHIZU_TT: "#T 世族对君主的态度：[SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_shizu_attitude').GetFlagName, 'support' ), 'hd_party_attitude_support_name', SelectLocalization( EqualTo_string( Character.MakeScope.Var('hd_party_shizu_attitude').GetFlagName, 'oppose' ), 'hd_party_attitude_oppose_name', 'hd_party_attitude_neutral_name' ) )]#!\n拥护分：[Character.MakeScope.Var('hd_party_shizu_score').GetValue|0]（≥ 50 转为拥护，≤ −50 转为对抗；已拥护者低于 20、已对抗者高于 −20 时回到中立）\n\n拥护时君主获得：直辖领税收、威望与正统获取 #P +10%#!，首都发展与控制增长 #P +0.1#!\n对抗时君主承受：直辖领税收、威望与正统获取 #N −15%#!，首都发展与控制增长 #N −0.15#!\n\n#weak 一党势力若不足朝中一成，其向背便无关大局。#!"
