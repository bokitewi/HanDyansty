 # 22 年剧本「光武中兴」。计划见 /mnt/project-files/22光武中兴剧本_计划.md。
 bm_hd_22: "光武中兴"
 bm_hd_22_desc: "新地皇三年冬。王莽代汉已经十四年，改币制、复井田、更官名，越改越乱；连年蝗旱，关东人相食。荆州的饥民聚在绿林山中，一场疫病之后分作新市、下江两支；东方的樊崇以朱涂眉，号为赤眉，刚刚在成昌大破新军，斩了更始将军廉丹。\n\n南阳舂陵的刘縯素来轻财好士，见天下将乱，召集宗族宾客七八千人起兵，绛衣大冠，号称柱天都部。他的弟弟刘秀本是个勤于稼穑的书生，这时也从宛城回到舂陵，跟着兄长披甲上马。新市、平林的兵马已经答应合兵。\n\n常安城里的王莽仍坐拥天下，宛城的前队大夫甄阜、属正梁丘赐正集结兵马，要把这几千人一举扑灭。\n\n#bold 两年之内，新朝将覆灭于长安渐台，天下复归刘氏。#!"

 bm_hd_22_liu_yan: "刘縯"
 bm_hd_22_liu_yan_subheading: "舂陵兵首领，柱天都部"
 bm_hd_22_liu_yan_desc: "字伯升，汉景帝之后，南阳舂陵人。性情刚毅，慷慨有大节，王莽篡汉以后常怀复汉之志，不事家业，倾身结交天下雄俊。如今他终于举起了旗帜，可起兵的人里，并不是人人都愿意奉他为主。"

 bm_hd_22_liu_xiu: "刘秀"
 bm_hd_22_liu_xiu_subheading: "刘縯之弟"
 bm_hd_22_liu_xiu_desc: "字文叔，刘縯的三弟。少年时在长安读过《尚书》，回乡后勤于农事，兄长常笑他像汉高祖的二哥刘仲。宗族子弟起初害怕起兵，见连谨厚的刘秀都穿上了绛衣，才放下心来。他说过一句话：仕宦当作执金吾，娶妻当得阴丽华。"

 bm_hd_22_wang_mang: "王莽"
 bm_hd_22_wang_mang_subheading: "新朝皇帝"
 bm_hd_22_wang_mang_desc: "元帝皇后王政君之侄，以谦恭好学、礼贤下士得天下赞誉，由大司马而安汉公、假皇帝，终于受汉禅让，国号曰新。他想照着《周礼》重造天下，诏令一道接一道，百姓却越来越活不下去。如今他已六十多岁，四方的叛乱奏报每天都送到常安。"

 bm_hd_22_wang_kuang: "王匡"
 bm_hd_22_wang_kuang_subheading: "新市兵首领"
 bm_hd_22_wang_kuang_desc: "新市人，地皇初年与王凤调解乡里饥民的纷争，被推为渠帅，聚众于绿林山。去年疾疫流行，绿林兵分散，他与王凤带着一支北入南阳，号新市兵。这些人起兵是为了一口饭吃，谁做皇帝，他们要看哪一个更好拿捏。"

 bm_hd_22_chen_mu: "陈牧"
 bm_hd_22_chen_mu_subheading: "平林兵首领"
 bm_hd_22_chen_mu_desc: "平林人，与廖湛聚众千余人响应新市兵，号平林兵。军中有个落魄的刘氏宗室刘玄，做着安集掾的小官。陈牧不会想到，这个不起眼的人日后会被推上皇帝的宝座。"

 bm_hd_22_wang_chang: "王常"
 bm_hd_22_wang_chang_subheading: "下江兵首领"
 bm_hd_22_wang_chang_desc: "字颜卿，颍川舞阳人，为父报仇亡命江夏，入了绿林。绿林兵分散后，他与成丹、张卬西入南郡，号下江兵。下江诸将自负勇悍，不愿屈居人下，唯有王常看出刘縯兄弟非同寻常。"

 bm_hd_22_fan_chong: "樊崇"
 bm_hd_22_fan_chong_subheading: "赤眉首领"
 bm_hd_22_fan_chong_desc: "琅琊人，天凤五年在莒县起事，以泰山为据点，部众以朱涂眉，与新军相识别，号赤眉。他们没有文书号令，只约定杀人者死、伤人者偿。刚刚在成昌大破廉丹、王匡的十万大军，如今众逾十万，往来青徐之间。"

 bm_hd_22_gongsun_shu: "公孙述"
 bm_hd_22_gongsun_shu_subheading: "新朝导江卒正（蜀郡太守）"
 bm_hd_22_gongsun_shu_desc: "字子阳，扶风茂陵人，治临邛，以能干闻名。蜀地险固，沃野千里，又远离中原的战火。只要天下再乱一些，这位太守就不必再向任何人称臣。"

 bm_hd_22_ma_yuan: "马援"
 bm_hd_22_ma_yuan_subheading: "新朝新成大尹（汉中太守）"
 bm_hd_22_ma_yuan_desc: "字文渊，扶风茂陵人，伏波将军马援的名字此刻还无人知晓。他年轻时在北地放牧，宾客数百家，常说：丈夫为志，穷当益坚，老当益壮。如今他在汉中为王莽守郡，冷眼看着天下大势。"

