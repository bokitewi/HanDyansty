 # 事件
 hd_22.0110.t: "宜秋之会"
 hd_22.0110.desc: "刘縯兄弟与甄阜相持于南阳，兵力单薄。听说下江兵屯在宜秋，刘縯亲自登门，陈说合兵的利害。下江诸将多不以为然，只有王常一力主张：王莽苛酷，人心思汉，刘氏兄弟必成大事。"
 hd_22.0110.a: "与舂陵兵合力，共击甄阜"
 hd_22.0110.b: "下江兵自有去处"
 hd_22.0120.t: "共立刘玄"
 hd_22.0120.desc: "绿林诸将要立一位刘氏宗室为天子，来号令天下。刘縯威名太盛，新市、平林的将领怕他做了皇帝难以驾驭，便推出了懦弱的刘玄。淯水之滨筑起坛场，刘玄即皇帝位，改元更始。你要奉他为主吗？"
 hd_22.0120.a: "奉更始为天子"
 hd_22.0120.b: "不奉此人，自行其是"
 hd_22.0130.t: "昆阳之围"
 hd_22.0130.desc: "王莽遣大司空王邑、司徒王寻大举发兵，旌旗辎重千里不绝，把昆阳围了几十重。城中兵粮有限，诸将都想弃城而走。我按住案上的舆图，劝道：‘城里兵少粮乏，分散逃走，只会让敌军逐个追上。合力守住昆阳，才还有一线胜机。’"
 hd_22.0130.a: "坚守昆阳，合力御敌。"
 hd_22.0130.b: "众寡悬殊，弃城而走"
 hd_22.0140.t: "蜀中自立"
 hd_22.0140.desc: "昆阳的消息传来以后，四方豪杰纷纷杀了新朝的牧守，自称将军，用汉家年号。蜀中的豪杰也来劝你：天下扰乱，蜀地险固，可以据守观变。"
 hd_22.0140.a: "据蜀自立"
 hd_22.0140.b: "仍事新朝"
 hd_22.0145.t: "四方叛去"
 hd_22.0145.desc: "各地的奏报一封接一封：天水隗嚣起兵，蜀郡公孙述自立，关东的郡守有的杀了使者，有的干脆开城迎汉。宫中的方士劝你拜天哭告，大臣劝你赦免天下以收人心。"
 hd_22.0145.a: "下诏讨逆，严惩叛臣"
 hd_22.0145.b: "大赦天下，以安人心"
 hd_22.0150.t: "常安陷落"
 hd_22.0150.desc: "汉兵从宣平门入城，城中少年朱弟、张鱼等纵火烧作室门，火势蔓延到掖庭。你抱着威斗坐在宣室前殿，喃喃说：天生德于予，汉兵其如予何？群臣劝你移驾渐台，也有人劝你趁乱出奔。"
 hd_22.0150.a: "弃城出奔，天命让与汉家"
 hd_22.0150.b: "天命在我，死守不去"
 hd_22.0155.t: "西入武关"
 hd_22.0155.desc: "四方郡守纷纷叛新，关中的豪杰也在等着汉兵到来。析县人邓晔、于匡已经起兵响应，愿为前驱。是时候遣将西入武关，直取常安了。"
 hd_22.0155.a: "遣将西入武关"
 hd_22.0155.b: "关中险固，暂不进兵"
