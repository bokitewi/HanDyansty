 # 事件
 hd_22.0110.t: "宜秋之会"
 hd_22.0110.desc: "刘縯兄弟与甄阜相持于南阳，兵力单薄。听说下江兵屯在宜秋，刘縯亲自登门，陈说合兵的利害。下江诸将多不以为然，只有王常一力主张：王莽苛酷，人心思汉，刘氏兄弟必成大事。"
 hd_22.0110.a: "与舂陵兵合力，共击甄阜"
 hd_22.0110.b: "下江兵自有去处"
 hd_22.0120.t: "共立刘玄"
 hd_22.0120.desc: "绿林诸将要立一位刘氏宗室为天子，来号令天下。刘縯威名太盛，新市、平林的将领怕他做了皇帝难以驾驭，便推出了懦弱的刘玄。淯水之滨筑起坛场，刘玄即皇帝位，改元更始。你要奉他为主吗？"
 hd_22.0120.a: "奉更始为天子"
 hd_22.0120.b: "不奉此人，自行其是"
 hd_22.0130.t: "昆阳之围"
 hd_22.0130.desc: "王莽遣大司空王邑、司徒王寻大举发兵，旌旗辎重千里不绝，把昆阳围了几十重。城中兵粮有限，诸将都想弃城而走。我按住案上的舆图，劝道：‘城里兵少粮乏，分散逃走，只会让敌军逐个追上。合力守住昆阳，才还有一线胜机。’"
 hd_22.0130.a: "坚守昆阳，合力御敌。"
 hd_22.0130.b: "众寡悬殊，弃城而走"
 hd_22.0140.t: "蜀中自立"
 hd_22.0140.desc: "昆阳的消息传来以后，四方豪杰纷纷杀了新朝的牧守，自称将军，用汉家年号。蜀中的豪杰也来劝你：天下扰乱，蜀地险固，可以据守观变。"
 hd_22.0140.a: "据蜀自立"
 hd_22.0140.b: "仍事新朝"
 hd_22.0145.t: "四方叛去"
 hd_22.0145.desc: "各地的奏报一封接一封：天水隗嚣起兵，蜀郡公孙述自立，关东的郡守有的杀了使者，有的干脆开城迎汉。宫中的方士劝你拜天哭告，大臣劝你赦免天下以收人心。"
 hd_22.0145.a: "下诏讨逆，严惩叛臣"
 hd_22.0145.b: "大赦天下，以安人心"
 hd_22.0150.t: "常安陷落"
 hd_22.0150.desc: "汉兵从宣平门入城，城中少年朱弟、张鱼等纵火烧作室门，火势蔓延到掖庭。你抱着威斗坐在宣室前殿，喃喃说：天生德于予，汉兵其如予何？群臣劝你移驾渐台，也有人劝你趁乱出奔。"
 hd_22.0150.a: "弃城出奔，天命让与汉家"
 hd_22.0150.b: "天命在我，死守不去"
 hd_22.0155.t: "西入武关"
 hd_22.0155.desc: "四方郡守纷纷叛新，关中的豪杰也在等着汉兵到来。析县人邓晔、于匡已经起兵响应，愿为前驱。是时候遣将西入武关，直取常安了。"
 hd_22.0155.a: "遣将西入武关"
 hd_22.0155.b: "关中险固，暂不进兵"
 # 刘秀成长与独立起兵事件链（/mnt/project-files/22刘秀成长事件链_计划.md）
 hd_22_xiao_title: "萧"
 hd_22_xiao_title_adj: "萧"
 hd_22_hebei_army_name: "北渡河北之众"
 hd_22_handan_army_name: "围邯郸之军"
 hd_22.0200.t: "颍川诸将"
 hd_22.0200.desc: "昆阳一战，你以数千之众破王邑四十万大军，威名震动天下。经略颍川的时候，父城的冯异献城来归，颍阳县吏祭遵、王霸，郏人铫期，襄城的坚镡，还有马成、傅俊、臧宫，都愿意追随你。老友朱祐也一直在你身边。"
 hd_22.0200.a: "得此诸君，何愁大事不成"
 hd_22.0205.t: "伯升之死"
 hd_22.0205.desc: "更始帝听信新市、平林诸将的谗言，杀了你的兄长刘縯。消息传到父城，你连夜驰回宛城向更始谢罪。司徒府的旧部来吊唁，你不与他们私语，也不为兄长服丧，饮食言笑一如平常，只在夜里独自垂泪，枕席尽湿。"
 hd_22.0205.a: "隐忍谢罪，以待来日"
 hd_22.0205.b: "此仇不共戴天（与更始反目；北渡得郡后即可自立）"
 hd_22.0210.t: "持节北渡"
 hd_22.0210.desc: "更始帝定都洛阳，要派一位亲近的大将去镇抚河北州郡。左丞相曹竟、大司徒刘赐都举荐你，更始以你行大司马事，持节北渡黄河。这是脱身的机会：离开洛阳，离开那些忌恨你的人。\n\n#weak 北渡后你将取信都为据点，湖阳、昆阳等南阳之地交还主君，你本人改归更始直辖。#!"
 hd_22.0210.a: "持节北渡，镇慰河北"
 hd_22.0210.b: "留在南阳，不去河北"
 hd_22.0220.t: "萧王辞召"
 hd_22.0220.desc: "更始帝封你为萧王，命你罢兵还朝。耿弇在温明殿私下进言：更始政乱，诸将擅命，百姓不知所归，大王应当自己打算。河北的兵马都在你手里，回长安，就是把自己交到那些人手上。"
 hd_22.0220.a: "以河北未平辞不就征，自立"
 hd_22.0220.b: "奉诏还朝"
 hd_22.0225.t: "刘秀辞召"
 hd_22.0225.desc: "派往河北的使者回来了，刘秀以河北未平为辞，不肯奉诏还朝。河北的州郡、兵马，如今只听萧王一人号令。"
 hd_22.0225.a: "这个刘文叔……"
 hd_22.0230.t: "进兵邯郸"
 hd_22.0230.desc: "邯郸城里的伪天子王郎，自称成帝之子刘子舆，悬赏十万户购你的首级。上谷的耿弇、寇恂，渔阳的吴汉、盖延带着突骑南下，已经到了广阿。是时候围攻邯郸了。"
 hd_22.0230.a: "合兵围攻邯郸"
 hd_22.0230.b: "暂不进兵"
 hd_22.0240.t: "千秋亭即位"
 hd_22.0240.desc: "诸将再三劝进，你都推辞。旧日同学强华从关中捧来《赤伏符》，上面写着：刘秀发兵捕不道，四夷云集龙斗野，四七之际火为主。群臣说，这是天命。高邑城南千秋亭的坛场已经筑好了。"
 hd_22.0240.a: "即皇帝位，建元建武"
 hd_22.0240.b: "天下未定，暂不称帝"
 hd_22.0200.desc_b: "你经略颍川的时候，父城的冯异献城来归，颍阳县吏祭遵、王霸，郏人铫期，襄城的坚镡，还有马成、傅俊、臧宫，都愿意追随你。老友朱祐也一直在你身边。"
 hd_22.0215.t: "刘秀请北渡"
 hd_22.0215.desc: "更始帝要派刘秀持节北渡河北，镇慰州郡。他是你麾下的人，此去要取信都为据点，把湖阳、昆阳等地交还给你，从此直属天子。准还是不准？"
 hd_22.0215.a: "准其北渡"
 hd_22.0215.b: "留他在麾下"
