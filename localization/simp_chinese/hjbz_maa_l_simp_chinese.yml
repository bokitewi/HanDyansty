l_simp_chinese:
 # ══════════════════════════════════════════════════════════════════
 # 汉晋春秋 · 兵戈志 —— 禁军兵士与重建决议 本地化（hjbz_）
 #
 # 计 18 条：兵士 4×2（名 + 描述）＋ 决议 2×5（名/述/提示/确认/效果）
 # 文风：参《后汉书》—— 用典取自《百官志》《光武帝纪》《皇后纪》
 # ══════════════════════════════════════════════════════════════════

 # ────────────────────── 兵士 · 羽林 ──────────────────────

 hjbz_yulin_wei:0 "羽林卫"
 hjbz_yulin_wei_flavor:0 "#F 羽林者，取「为国羽翼，如林之盛」之义。汉武帝初置建章营骑，后更名羽林，又取从军死事之子孙养于羽林，教以五兵，号羽林孤儿。其人身被重甲，持盾而前，列为方阵，不以驰逐为能，而以不动为功。#!"

 hjbz_yulin_qi:0 "羽林骑"
 hjbz_yulin_qi_flavor:0 "#F 羽林旧有骑，与郎分领宿卫。其人皆选良家子，材力过人，习鞍马而不离宫禁。平日侍从舆辇，有事则为中军之翼；马不必重甲，然进退有节，非徒以迅疾取势。#!"

 # ──────────────────── 兵士 · 执金吾 ────────────────────

 hjbz_zhijinwu_jishi:0 "执金吾持戟士"
 hjbz_zhijinwu_jishi_flavor:0 "#F 执金吾掌宫外戒、司非常水火之事，月三绕行宫外，兼主兵器。其属有持戟之士，列于道侧，所以备非常而肃都邑。此辈非野战之卒，然当京师有事，能持戟而当街而立，使行者不敢横。#!"

 hjbz_zhijinwu_tiqi:0 "执金吾缇骑"
 hjbz_zhijinwu_tiqi_flavor:0 "#F 缇者，丹黄色也。执金吾属有缇骑二百人，服色特异，以别于他军。光武微时尝叹曰：「仕宦当作执金吾。」盖其舆服导从，光满道路，群僚之中最为壮盛。然其职在徼循禁暴，不在摧锋陷阵。#!"

 # ────────────── 决议一 · 重建羽林军 ──────────────

 hjbz_rebuild_yulin_decision:0 "重建羽林军"
 hjbz_rebuild_yulin_decision_desc:0 "羽林之设，本以宿卫宫禁、备非常。武帝取从军死事之子孙养之，教以五兵，使不失其世业；宣、元以降，遂为禁中劲旅。今其名犹在，而其制久废，宿卫之职或委之他军，非所以重根本也。\n\n臣闻为国者必有羽翼，犹林之有木，相扶而后盛。若复其旧制，选良家子之材力过人者，别为二军：一被重甲而持盾，列为方阵，以守宫阙；一习鞍马而善射，侍从舆辇，以备驰逐。二者并立，则中军有所恃，而京师之众不敢轻动。\n\n然此非一纸之令所能就。军籍、甲械、给养皆须有常，主之者亦须得人。愿陛下先立其制，而后徐议其众。"

 hjbz_rebuild_yulin_decision_tooltip:0 "重建羽林军之制。立制之后，可招募#Y 羽林卫#!与#Y 羽林骑#!。\n\n#EMP 须先具其柄：#!既为中华霸权之主，尚须集权于己 —— 天朝官僚须至「有限行政」以上，军制须至「中外分掌制」以上；威望三等、影响力三等、正统性七等，皆不可缺。\n\n又须内外无隙：强力封臣皆当输诚（好感皆过五十），司隶之柄当在己手或得其心。若与共治者分享权柄，则须其忠诚不贰，或权力天平未至偏侧。"

 hjbz_rebuild_yulin_decision_confirm:0 "输国库五百、威望一千以立其制。本决议不即得军团。"
 hjbz_rebuild_yulin_decision_effect:0 "羽林军之制已立。自此可募羽林卫与羽林骑。"

 # ────────────── 决议二 · 重建执金吾 ──────────────

 hjbz_rebuild_zhijinwu_decision:0 "重建执金吾"
 hjbz_rebuild_zhijinwu_decision_desc:0 "执金吾一人，中二千石，掌宫外戒，司非常水火之事。月三绕行宫外，及主兵器。其属有缇骑二百人、持戟五百二十人，舆服导从，光满道路。光武微时尝叹曰：「仕宦当作执金吾」，其盛可知也。\n\n自京师屡更，此官徒存空名，宫外之戒无所统属。夫宫阙之严，不在墙垣之高，而在循行有人、非常有备。若复置其职，选材力之士持戟列道，别以缇骑徼循街陌，则火烛之警、闾巷之奸，皆有所归。\n\n然其制非远人可以遥领。必都城之内、辇毂之下，乃可施行。洛阳、长安，旧皆帝都，当视其居而建之。"

 hjbz_rebuild_zhijinwu_decision_tooltip:0 "重建执金吾之制。立制之后，可招募#Y 执金吾持戟士#!与#Y 执金吾缇骑#!。\n\n#EMP 须先固其本：#!既为中华霸权之主，当都于#Y 洛阳#!或#Y 长安#!，且都城控制当过于八十；威望二等、影响力二等，皆不可缺。\n\n又须权柄在己：若与共治者分享权柄，则须其忠诚不贰，或权力天平未至偏侧。"
 hjbz_rebuild_zhijinwu_decision_confirm:0 "输金二百、威望三百以立其制。本决议不即得军团。"
 hjbz_rebuild_zhijinwu_decision_effect:0 "执金吾之制已立。自此可募执金吾持戟士与执金吾缇骑。"
