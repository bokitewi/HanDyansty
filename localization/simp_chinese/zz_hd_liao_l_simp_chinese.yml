l_simp_chinese:
 # 僚人入蜀（见 docs/五胡内附_僚人入蜀_设计草案.md 第 3 节）

 rule_hd_liao_migration_rule: "僚人入蜀"
 setting_hd_liao_rule_historical: "#high 史实#!"
 setting_hd_liao_rule_historical_desc: "280 年以后，王朝循环处于动荡、乱世或崩溃阶段，且蜀地守方兵力不超过僚帅（含事件军）两倍时，电脑每年有 10% 的几率发动僚人入蜀。"
 setting_hd_liao_rule_random: "#high 随机#!"
 setting_hd_liao_rule_random_desc: "不看年份，只要条件满足，电脑就可能发动僚人入蜀。"
 setting_hd_liao_rule_player_only: "#high 仅玩家#!"
 setting_hd_liao_rule_player_only_desc: "电脑不会发动僚人入蜀，只有玩家可以通过决定发起。"
 setting_hd_liao_rule_off: "#high 关闭#!"
 setting_hd_liao_rule_off_desc: "停用僚人入蜀。"

 hd_liao_migration_decision: "率众入蜀"
 hd_liao_migration_decision_desc: "蜀地连年战乱，田野荒芜，城邑空虚。山谷里的僚人越聚越多，旧地已经养不活这么多人。北面的巴蜀沃野，正等着有人去开垦。"
 hd_liao_migration_decision_tooltip: "举族北上，占据蜀地"
 hd_liao_migration_decision_confirm: "传令各部，整装北上！"
 hd_liao_migration_decision_flavour_effect: "你获得一次性的[hd_liao_migration_casus_belli|E]"
 hd_liao_migration_decision_year_ok: "已到 280 年（随机规则下不限年份）"
 hd_liao_migration_decision_phase_ok: "王朝循环处于动荡、新朝征服、斗争、对峙或崩溃阶段"

 hd_liao.0001.t: "僚人入蜀"
 hd_liao.0001.desc: "山里的日子一年比一年难过。各洞各寨的人口越来越多，可耕的坡地却还是那么些。\n\n探子从北边回来说，蜀中经过多年战乱，许多郡县已经没剩多少人家，田地荒着没人种，官府也顾不过来。\n\n我们若举族北上，整个族群就能在巴蜀扎下根来。"
 hd_liao.0001.a: "向蜀地进发！"
 hd_liao.0001.a.tt: "你可以对蜀地的统治者使用一次性的特殊[hd_liao_migration_casus_belli|E]"
 hd_liao.0002.desc: "我的封臣[hd_liao_invader.GetShortUIName]出人意料地召集了所有僚人部众，要整族北上，迁进蜀地。\n\n这件事一旦办成，我对那一带的控制可能就保不住了。"
 hd_liao.0002.a: "有勇无谋！"
 hd_liao.0002.a.tt: "僚人开始[hd_liao_migration|E]"
 hd_liao.0003.desc: "南边传来坏消息。[hd_liao_invader.GetShortUIName]，一位僚人首领，聚起了手下所有的人马，打算大举北上，占据蜀地。\n\n此刻，僚人各部正在集结……"
 hd_liao.0003.a: "山里人还能翻过来不成？"

 HD_LIAO_MIGRATION_WAR_NAME: "僚人入[TITLE.GetBaseName]"
 HD_LIAO_MIGRATION_WAR_NAME_BASE: ""
 HD_LIAO_MIGRATION_CB_NAME: "僚人入蜀"
 hd_liao_migration_cb: "$HD_LIAO_MIGRATION_CB_NAME$"
 hd_liao_migration_war_victory_desc_attacker: "你会夺取[defender.GetShortUINamePossessive]在蜀地的所有头衔。蜀地以外的领地都将放弃。"
 hd_liao_migration_war_victory_desc: "夺取[defender.GetShortUINamePossessive]在蜀地的所有头衔。蜀地以外的领地都将放弃。"
 hd_liao_migration_war_warning_desc: "\n\n#X 一局游戏只有一次僚人入蜀的机会。#!"

 game_concept_hd_liao_migration_casus_belli: "$HD_LIAO_MIGRATION_CB_NAME$宣战理由"
 game_concept_hd_liao_migration: "$HD_LIAO_MIGRATION_CB_NAME$"
 game_concept_hd_liao_migration_casus_belli_desc: "一局游戏只能使用一次的强力[casus_belli|E]，征服目标在蜀地腹心与巴西的全部领土。\n\n胜利后，僚帅迁都蜀地，新首都变为僚人文化，此后周边的伯爵领会逐渐僚化。蜀地以外的封臣与领地都将放弃，留给当地的军阀。"

 hd_liao_migration_effect.tt.new_capital: "迁都到蜀地发展度最高的直辖伯爵领"
 hd_liao_migration_effect.tt.capital_culture: "新首都所在[county|E]变为$liaoren$文化"
 hd_liao_migration_effect.tt.destroy_other_kingdoms: "除[primary_title|E]外，持有的其他[kingdoms|E]都被销毁"
 hd_liao_migration_effect.tt.non_liao_vassals: "蜀地以外的非$liaoren$[vassals|E][independent|E]"
 hd_liao_migration_effect.tt.liao_vassals: "蜀地以外的$liaoren$[vassals|E]从蜀地新得的头衔中分得[titles|E]"
 hd_liao_migration_effect.tt.former_territories: "蜀地以外的故地交给当地军阀"
 hd_liao_migration_effect.tt.settlement_story: "此后每年都可能有一个邻近的[county|E]变为$liaoren$文化"

 hd_liao_horde_title_name: "僚部"
 hd_liao_horde_title_adj: "僚"
 hd_liao_conquer_army_name: "入蜀僚兵"
 hd_liao_hold_army_name: "僚部留守兵"

 hd_foreign_settlement_county_modifier: "外族杂居"
 hd_foreign_settlement_county_modifier_desc: "新迁来的外族部众与原有住民杂居一处，彼此磨合需要时间。"
