 game_concept_hd_liao_migration_casus_belli_desc: "一局游戏只能使用一次的强力[casus_belli|E]，征服目标在蜀地腹心与巴西的全部领土。\n\n胜利后，僚帅迁都蜀地，新首都变为僚人文化，此后周边的伯爵领会逐渐僚化。蜀地以外的封臣与领地都将放弃，留给当地的军阀。"

