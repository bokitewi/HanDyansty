l_simp_chinese:
 hd_j16.1300.t:0 "麻秋压境"
 hd_j16.1300.desc:0 "先公新丧，你嗣位未久，赵将麻秋便领兵出金城，直扑枹罕。河西诸将多主坚守，宿将张瓘请缨，主簿谢艾也上书自荐，说只需步骑数千，便可破敌。也有人劝你遣使求和，花些钱帛，暂解边患。"
 hd_j16.1300.a:0 "拔擢谢艾为中坚将军，命他出兵。"
 hd_j16.1300.b:0 "委任宿将张瓘，以老成持重。"
 hd_j16.1300.c:0 "遣使求和，许以钱帛。"
 hd_j16.1301.t:0 "枹罕再战"
 hd_j16.1301.desc:0 "赵人不肯罢休。石虎又遣石宁领兵与麻秋会合，号称二万，再犯枹罕。河西人心浮动，诸将又来请命。"
 hd_j16.1301.a:0 "仍命谢艾御敌。"
 hd_j16.1301.b:0 "改命张瓘统兵。"
 hd_j16.1301.c:0 "再遣使求和。"
 hd_j16.1302.t:0 "谢艾遭谗"
 hd_j16.1302.desc:0 "谢艾两破麻秋，声望日隆。你的庶兄张祚和左右近臣屡进谗言，说谢艾功高难制，迟早生变。有人劝你把他外放为酒泉太守，也有人说谗言不足信，良将不可远离。"
 hd_j16.1302.a:0 "外放谢艾为酒泉太守。"
 hd_j16.1302.b:0 "谗言不足信，留谢艾在朝。"
 hd_j16.1303.t:0 "假凉王"
 hd_j16.1303.desc:0 "石虎已死，关东大乱，江东的诏书仍旧迟迟不到。河西文武联名上表，请你自称凉王，置百官，以安人心。只是如此一来，张氏累世奉晋的名分便要打折扣，建康那边也不会高兴。"
 hd_j16.1303.a:0 "称假凉王，以安河西。"
 hd_j16.1303.b:0 "仍称西平公，不失臣节。"
 hd_j16.1304.t:0 "东伐秦地"
 hd_j16.1304.desc:0 "苻氏新据关中，陇右诸郡人心未附。诸将请遣宋修、张弘东出，趁秦人立足未稳，取天水一带。也有人以为秦兵正锐，不如保境息民。"
 hd_j16.1304.a:0 "遣宋修、张弘东伐。"
 hd_j16.1304.b:0 "保境息民，暂不出兵。"
 hd_j16.1305.t:0 "西讨凉州"
 hd_j16.1305.desc:0 "赵主有命：河西张氏新君嗣位，人心未定，正可乘机西进，夺取枹罕。金城兵马都在你手里，该你动手了。"
 hd_j16.1305.a:0 "奉命西征。"
 hd_j16.1305.b:0 "按兵不动，再看时机。"
 hd_j16.1310.t:0 "张祚逼宫"
 hd_j16.1310.desc:0 "先王才下葬，伯父张祚就勾结宫中，联络重臣，要废你另立。你年纪尚小，左右能依靠的人不多。谢艾若在，召他回师讨逆，也许还有一线生机。"
 hd_j16.1310.a:0 "让出凉州，但求保全性命。"
 hd_j16.1310.b:0 "召谢艾回师讨逆。"
 hd_j16.1311.t:0 "幼主可欺"
 hd_j16.1311.desc:0 "先王已逝，嗣君还是个孩子。宫中有人愿为内应，朝中也有人看你的脸色行事。只要你点头，凉州便归你了。"
 hd_j16.1311.a:0 "废幼主，自立。"
 hd_j16.1311.b:0 "仍尽心辅佐幼主。"
 hd_j16.1312.t:0 "凉王之号"
 hd_j16.1312.desc:0 "你已坐稳了凉州，近臣请你正式称凉王，改元建制，不必再以晋臣自居。"
 hd_j16.1312.a:0 "称凉王。"
 hd_j16.1312.b:0 "暂不称王。"
 hd_j16.1313.t:0 "张瓘起兵"
 hd_j16.1313.desc:0 "河州刺史张瓘传檄四方，说你淫虐无道，要立先王之子为主。他已经举兵东来。"
 hd_j16.1313.a:0 "那就打吧。"
 hd_j16.1314.t:0 "姑臧之变"
 hd_j16.1314.desc:0 "凉主年少，国事全在权臣手里。你身为宗室，手下有人劝你先下手为强，废掉这个侄子，自己执掌河西。"
 hd_j16.1314.a:0 "废幼主，自立。"
 hd_j16.1314.b:0 "不可。"
 hd_j16.1315.t:0 "诛张瓘"
 hd_j16.1315.desc:0 "张瓘专权日久，猜忌大臣，听说已经起了篡夺之心。你手下兵马不多，但宫中和城中都有人愿意响应。"
 hd_j16.1315.a:0 "起兵诛张瓘。"
 hd_j16.1315.b:0 "按兵不动。"
 hd_j16.1316.t:0 "讨张祚"
 hd_j16.1316.desc:0 "张祚弑主篡位，淫虐无道，河西人心早已离散。你坐镇河州，兵强马壮，正可举兵东进，另立先王之子。"
 hd_j16.1316.a:0 "举兵讨逆。"
 hd_j16.1316.b:0 "暂且观望。"
 hd_j16.1350.t:0 "两头受封"
 hd_j16.1350.desc:0 "仇池地处晋、赵之间。建康派人来，许你征南将军、仇池公之号；邺城那边也送来了赵的封号。两边都想拉你，你得决定站在哪一边。"
 hd_j16.1350.a:0 "附晋，受征南将军、仇池公。"
 hd_j16.1350.b:0 "仍附于赵。"
 hd_j16.1350.c:0 "两边都不理，闭关自守。"
 hd_j16.1352.t:0 "袭西城"
 hd_j16.1352.desc:0 "苻氏刚入关中，西边防备空虚。诸将请你出兵袭取边城，趁机扩地。"
 hd_j16.1352.a:0 "出兵袭城。"
 hd_j16.1352.b:0 "不出兵。"
 hd_j16.1354.t:0 "从叔异动"
 hd_j16.1354.desc:0 "近来有人密报：从叔杨宋奴与他的姑子梁式王来往频繁，似有图谋。杨宋奴是你的长辈，在族中颇有声望，轻易动他，恐怕会寒了宗族的心。"
 hd_j16.1354.a:0 "先发制人，拿下杨宋奴。"
 hd_j16.1354.b:0 "骨肉至亲，不必多疑。"
 hd_j16.1354.c:0 "厚加赏赐，先稳住他。"
 hd_j16.1354.a.success:0 "杨宋奴已下狱"
 hd_j16.1354.a.fail:0 "事机泄露，刺客已至"
 hd_j16.1356.t:0 "杨俊异动"
 hd_j16.1356.desc:0 "你的叔父杨俊在族中党羽日多，近来频频与诸将密会。有人劝你早作防备，也有人说不过是小人挑拨。"
 hd_j16.1356.a:0 "严加防备。"
 hd_j16.1356.b:0 "不过小人挑拨，不必理会。"
 hd_j16.1356.a.success:0 "杨俊的图谋未能得逞"
 hd_j16.1356.a.fail:0 "防备不及，杨俊已经起兵"
 hd_j16.1357.t:0 "仇池之主"
 hd_j16.1357.desc:0 "侄儿杨国新立不久，威望不足，族中不少人更愿意追随你。只要你下定决心，仇池就是你的。"
 hd_j16.1357.a:0 "取而代之。"
 hd_j16.1357.b:0 "仍奉杨国为主。"
 hd_j16.1380.t:0 "秦州何去何从"
 hd_j16.1380.desc:0 "石虎死后，他的几个儿子在邺城自相残杀，赵国眼看就要散了。你据守秦州，手中有兵有地。冉闵在邺城招揽人才，晋室在江东也念着你父亲刘越石的忠义，你也可以干脆据陇自守。"
 hd_j16.1380.a:0 "以秦州归附冉闵。"
 hd_j16.1380.b:0 "南附晋室，不负先父。"
 hd_j16.1380.c:0 "据陇自守。"
 hd_j16.1380.d:0 "仍奉赵主。"
 hd_j16.1382.t:0 "苻健西来"
 hd_j16.1382.desc:0 "苻健已经入关，据有长安，兵锋正向陇右逼来。秦州孤悬西陲，是降是战，要早作决断。"
 hd_j16.1382.a:0 "归附苻秦。"
 hd_j16.1382.b:0 "据险抗秦。"
 hd_j16.1400.t:0 "孙盛访安乐公"
 hd_j16.1400.desc:0 "成汉已亡，桓温幕中的孙盛特地来拜访你。他说，昭烈帝的血脉流落蜀中，桓公很愿意请你随军东归建康，朝廷必定以礼相待。也有成都的故旧劝你留下，说蜀人不忘汉家。"
 hd_j16.1400.desc_card:0 "\n\n你心里还装着一件事：复刘氏之汉。去建康，便是天子座下的一位闲散公侯；留在蜀中，或许还有机会。"
 hd_j16.1400.desc_nocard:0 ""
 hd_j16.1400.a:0 "随桓温东归建康。"
 hd_j16.1400.b:0 "留在成都。"
 hd_j16.1400.c:0 "闭门隐居，不问世事。"
 hd_j16.1401.t:0 "蜀中起兵"
 hd_j16.1401.desc:0 "你在蜀中举起了刘氏的旗号。旧日的部曲闻讯来投，一座县城已在你手中，下一步便是夺回整个郡。"
 hd_j16.1401.a:0 "汉祚当续。"
 hd_j16_xieai_modifier:0 "谢艾用兵"
 hd_j16_xieai_modifier_desc:0 "谢艾以数千之众两破麻秋，河西无人不知其善用兵。"
 hd_j16_jin_fanchen_modifier:0 "晋室藩臣"
 hd_j16_jin_fanchen_modifier_desc:0 "此人奉晋正朔，受晋官爵，远在边陲，仍以晋臣自居。"
 hd_j16_zhao_fenghao_modifier:0 "受赵封号"
 hd_j16_zhao_fenghao_modifier_desc:0 "此人接受了赵国的封号，奉邺城为主。"
 hd_j16_yuesi_modifier:0 "越石之子"
 hd_j16_yuesi_modifier_desc:0 "此人是晋司空刘琨的儿子。刘琨孤守并州、死节幽州，忠义之名天下皆知，士人因此对其子另眼相看。"
 hd_j16_hanshi_yuyin_modifier:0 "汉室余胤"
 hd_j16_hanshi_yuyin_modifier_desc:0 "此人是昭烈帝的后裔。蜀人追念先主，对他格外亲近。"
 hd_j16_anle_gong_modifier:0 "安乐公"
 hd_j16_anle_gong_modifier_desc:0 "此人以昭烈帝后裔的身份客居建康，袭安乐公旧号，朝廷以礼相待。"
 hd_j16_yinju_modifier:0 "闭门隐居"
 hd_j16_yinju_modifier_desc:0 "此人闭门读书，不问世事。"
 hd_j16_yinnue_modifier:0 "淫虐"
 hd_j16_yinnue_modifier_desc:0 "此人荒淫暴虐，臣下离心。"
 hd_j16_bayu_opinion:0 "拔擢之恩"
 hd_j16_weiren_opinion:0 "委以重任"
 hd_j16_chanxing_opinion:0 "谗言得行"
 hd_j16_chanfei_opinion:0 "谗言不行"
 hd_j16_jiawang_opinion:0 "僭称王号"
 hd_j16_fanchen_opinion:0 "晋室藩臣"
 hd_j16_fengzhao_opinion:0 "奉赵正朔"
 hd_j16_yuesi_opinion:0 "越石之子"
 hd_j16_anle_opinion:0 "安乐公来归"
 hd_j16_laifu_opinion:0 "以秦州来附"
 hd_j16_lxuan_juhanzhi_decision:0 "举汉帜"
 hd_j16_lxuan_juhanzhi_decision_desc:0 "昭烈帝的后人在蜀中立足，便该亮出刘氏之汉的旗号。尚为人臣，就先摆脱宗主；已能自主，就定下国号。"
 hd_j16_lxuan_juhanzhi_decision_tooltip:0 "复刘氏之汉"
 hd_j16_lxuan_juhanzhi_decision_confirm:0 "举汉帜！"
 hd_j16_lxuan_holds_yizhou_tt:0 "持有益州任一县"
 hd_j16_lxuan_indep_war_tt:0 "近五年内没有用此决议挑起独立战争"
 hd_j16_lxuan_juhanzhi_indep_effect_tt:0 "向宗主发起独立战争；独立之后可再用此决议定国号"
 hd_j16_lxuan_juhanzhi_name_effect_tt:0 "主头衔国号改为「汉」，称王"
 hd_j16_lxuan_qibing_decision:0 "蜀中起兵"
 hd_j16_lxuan_qibing_decision_desc:0 "你身无寸土，却还有刘氏的名分和旧部的人心。花些钱，冒些险，在蜀中夺下一座县城，就有了立足之地。"
 hd_j16_lxuan_qibing_decision_tooltip:0 "在蜀中夺一县起事"
 hd_j16_lxuan_qibing_decision_confirm:0 "起兵！"
 hd_j16_lxuan_in_yizhou_tt:0 "身在益州"
 hd_j16_lxuan_qibing_county_tt:0 "益州有可取之县（由非独立的 AI 郡守持有，且不是其首府）"
 hd_j16_lxuan_qibing_effect_tt:0 "夺取益州一县（优先你所在之县，其次蜀郡）并自立，得该县所在郡的宣称，在当地召集 3000 兵"
 hd_j16_346c_army_maqiu:0 "麻秋军"
 hd_j16_346c_army_xieai:0 "谢艾军"
 hd_j16_346c_army_shining:0 "石宁援军"
 hd_j16_346c_army_songxiu:0 "宋修军"
 hd_j16_346c_army_fuxiong:0 "苻雄军"
 hd_j16_346c_army_qiuchi:0 "仇池兵"
 hd_j16_346c_army_yangjun:0 "杨俊兵"
 hd_j16_346c_army_lxuan:0 "汉帜义兵"
