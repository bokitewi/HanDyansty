 # ══════════════════════════════════════════════════════════════════
 # 汉晋春秋 · 兵戈志 —— 禁军事件与修正 本地化（hjbz_）
 #
 # 内容：事件 4×3（题/述/选项）＋ 修正 4×2（名/述）＋ 旅行选项 1×2
 # 文风：参《后汉书》
 # ══════════════════════════════════════════════════════════════════

 # ────────────────── 事件一 · 重建羽林军 ──────────────────

 hjbz_guard.0001.t:0 "重建羽林军"
 hjbz_guard.0001.desc:0 "羽林之制既复，乃选良家子之材力过人者以充之。是日，陈甲于宫门之外，旌旗相属，鼓铎有声。\n\n主将率诸校北面再拜，自校尉以下皆解剑顿首，誓以死卫宫禁。有司读册，赐以军号，声达于阙。上临观之，见其行列齐整、甲仗鲜明，顾左右曰：「此吾之羽翼也。」"
 hjbz_guard.0001.a:0 "有此一军，朕可安寝矣。"

 # ────────────────── 事件二 · 重建执金吾 ──────────────────

 hjbz_guard.0002.t:0 "重建执金吾"
 hjbz_guard.0002.desc:0 "执金吾既复，废旧易新。初，官舍倾颓，卒徒散佚，街陌之间盗贼白昼而行，行者相戒不敢夜出。\n\n及是，缇骑循行，持戟列道，月三绕宫。夜有火警，应时而至，无所稽留。居人数月，始敢夜行。有司上言：「都城之内，桴鼓不鸣。」"
 hjbz_guard.0002.a:0 "辇毂之下，当如是也。"

 # ────────────────── 事件三 · 瘫痪的羽林军 ──────────────────

 hjbz_guard.0003.t:0 "瘫痪的羽林军"
 hjbz_guard.0003.desc:0 "上失其柄，诏令不出于宫。羽林诸营，或受他人之檄，或闭垒自守，不复应命。\n\n宿卫之臣更相引去，甲仗委于廊庑。向之北面誓死者，今皆散于四方。殿门之外，唯余老卒数人，执戟而立，见上而泣。"
 hjbz_guard.0003.a:0 "羽翼既折，朕何所恃？"

 # ────────────────── 事件四 · 崩溃的执金吾 ──────────────────

 hjbz_guard.0004.t:0 "崩溃的执金吾"
 hjbz_guard.0004.desc:0 "执金吾之职既废，缇骑持戟之徒无所统属。黠者投于权门，为爪牙以凌同列；拙者流落街陌，与盗贼相倚，反为民害。\n\n宫外之戒无人复司，火起而救者不至。旧所建官舍，今为博徒酒徒之所聚。识者过之，未尝不叹息。"
 hjbz_guard.0004.a:0 "宫外之事，竟至于是。"

 # ────────────────── 角色修正 ──────────────────

 hjbz_yulin_rebuilder_modifier:0 "羽林军重建者"
 hjbz_yulin_rebuilder_modifier_desc:0 "此人复羽林之旧制，选良家子以充宿卫，宫禁之防由是加密。军中闻其名者，多愿为之用；而奸人欲逞其谋，亦先自量其力。"

 hjbz_yulin_guard_modifier:0 "羽林军"
 hjbz_yulin_guard_modifier_desc:0 "羽林之军常在其左右。甲仗既备，宿卫有人，故行止之间，敌人无从窥其隙。"

 # ────────────────── 伯爵领修正 ──────────────────

 hjbz_zhijinwu_renewed_modifier:0 "焕然一新的执金吾"
 hjbz_zhijinwu_renewed_modifier_desc:0 "执金吾既复，缇骑循行，持戟列道，月三绕宫。桴鼓不鸣，行者夜出而无虞，市里之间渐复旧观。"

 hjbz_zhijinwu_collapsed_modifier:0 "崩溃的执金吾"
 hjbz_zhijinwu_collapsed_modifier_desc:0 "执金吾废而无人司其职。缇骑持戟之徒散于四方，黠者为权门爪牙，拙者与盗贼相依，闾巷之间白昼亦不免于剽掠。"

 # ────────────────── 旅行选项 ──────────────────

 hjbz_yulin_escort_travel_option:0 "羽林军护卫"
 hjbz_yulin_escort_travel_option_desc:0 "选羽林之士以从行。其人皆宿卫之旧，习于戒备，所过之处先觇虚实；途中虽有奸人，亦无所施其技。"
