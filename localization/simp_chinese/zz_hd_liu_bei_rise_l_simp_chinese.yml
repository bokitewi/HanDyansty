l_simp_chinese:
 hd_liu_bei_rise.0100.t:0 "黄巾蜂起"
 hd_liu_bei_rise.0100.desc:0 "黄巾举众而起，州郡告急。各路义军已经与汉军交战，我等也到了决定去留的时候。若要扶危济困，便当以兵锋对抗黄巾。"
 hd_liu_bei_rise.0100.a:0 "当率义众，为国讨贼！"
 hd_liu_bei_rise.0100.b:0 "暂且整顿部众。"
 hd_liu_bei_rise.0200.t:0 "关东义兵"
 hd_liu_bei_rise.0200.desc:0 "关东诸侯已经结盟讨伐董卓。我虽未列于诸侯会盟之中，也可率自己的部众参加讨董之战，与义军并肩而战。"
 hd_liu_bei_rise.0200.a:0 "董贼不除，汉室何安！"
 hd_liu_bei_rise.0200.b:0 "此时不宜卷入。"
 hd_liu_bei_rise.0300.t:0 "故人刘玄德"
 hd_liu_bei_rise.0300.desc:0 "讨董联盟解散已三十日。我想起刘玄德及其部众：与其任他四处漂泊，不如邀来共谋大事。若他愿意，我当与他结盟，并请其营地迁至我如今的治所。"
 hd_liu_bei_rise.0300.a:0 "遣使邀请玄德。"
 hd_liu_bei_rise.0300.b:0 "眼下还是各行其是。"
 hd_liu_bei_rise.0301.t:0 "伯圭相邀"
 hd_liu_bei_rise.0301.desc:0 "公孙瓒遣使相邀，愿与我结盟，并请我率部前往他现在的治所驻营。此行仍由我统率自己的部众，并非出仕为臣。"
 hd_liu_bei_rise.0301.a:0 "伯圭相召，岂可不往。"
 hd_liu_bei_rise.0301.b:0 "我另有去处。"
 hd_liu_bei_rise.0400.t:0 "常山赵子龙"
 hd_liu_bei_rise.0400.desc:0 "驻营公孙瓒境内之际，我与其麾下的赵云相谈甚欢。他谈及安民之志，言辞恳切，令人敬重。数番交往之后，我已将他视作可以相托之友。"
 hd_liu_bei_rise.0400.a:0 "得与子龙相交，实为幸事。"
 hd_liu_bei_rise.0410.t:0 "子龙来投"
 hd_liu_bei_rise.0410.desc:0 "赵云已经离开公孙瓒的宫廷，如今来到我这里。既是旧友，他愿与我一道奔走，为乱世中的百姓寻求一条生路。"
 hd_liu_bei_rise.0410.a:0 "子龙既来，我心甚慰！"
 hd_liu_bei_rise.0500.t:0 "徐州备御"
 hd_liu_bei_rise.0500.desc:0 "曹操已经控制兖州，又将势力伸入豫州或青州。徐州不可不备。我可以修整州内城防、充实守备，并邀请刘备率其部众前来相助。"
 hd_liu_bei_rise.0500.a:0 "整饬守备，遣使请刘备。"
 hd_liu_bei_rise.0500.b:0 "暂不另作安排。"
 hd_liu_bei_rise.0501.t:0 "徐州来使"
 hd_liu_bei_rise.0501.desc:0 "陶谦遣来使者，愿与我结盟，邀我率部前往徐州。若应允，我的营地将迁往他在徐州的治所；若治所已不在州内，则择其仍控制的徐州县城驻营。"
 hd_liu_bei_rise.0501.a:0 "陶使君相邀，我当往援。"
 hd_liu_bei_rise.0501.b:0 "此事不可轻入。"
 hd_liu_bei_rise.0600.t:0 "东海麋氏"
 hd_liu_bei_rise.0600.desc:0 "身在徐州，我有机会拜访麋竺，与他商议乱世中的去向。麋竺、麋芳若能离开现职，便可加入我的宫廷或营地；若麋氏家中有未婚成年女子，且双方婚姻条件允许，亦可结为姻亲。"
 hd_liu_bei_rise.0600.a:0 "愿与麋氏同心共济。"
 hd_liu_bei_rise.0600.b:0 "延请二君，婚事暂且不议。"
 hd_liu_bei_rise.0700.t:0 "徐州相托"
 hd_liu_bei_rise.0700.desc:0 "病势沉重，我已无力再担徐州之任。刘备如今身在州内，若将治下领地与封臣交付于他，或能免去身后纷争。此事不包括我所持有的世族身份头衔。"
 hd_liu_bei_rise.0700.a:0 "以徐州相托，望玄德善待百姓。"
 hd_liu_bei_rise.0700.b:0 "仍依原定继承安排。"
 hd_liu_bei_rise.0701.t:0 "受命徐州"
 hd_liu_bei_rise.0701.desc:0 "陶谦病势已危，愿将所掌握的领地与封臣交付于我。世族身份与家族继承仍归其族人。若我接受，须先完成领地交接，再为陶使君料理后事。"
 hd_liu_bei_rise.0701.a:0 "谨受重托，保境安民。"
 hd_liu_bei_rise.0701.b:0 "此重任，我不能受。"
 HD_LIU_BEI_RISE_STORY_STATUS:0 "刘备崛起：黄巾从军、讨董、故人相邀、子龙与麋氏、徐州相托。各节点依人物和局势条件推进，不强制复活人物或夺取其既有领地。"
 hd_lb_xuzhou_prepared_defenses:0 "徐州整饬守备"
 hd_lb_xuzhou_prepared_defenses_desc:0 "经陶谦整修的城防与守备。"
 hd_lb_no_effect_tt:0 "不改变结盟、战争、头衔或营地；本次邀请不再重复。"
 hd_lb_yellow_join_tt:0 "加入当前仍在进行、且可以加入的黄巾战争防御方；不新建战争，不改变已加入的阵营。"
 hd_lb_dong_join_tt:0 "参加讨董战争的进攻方；若战争尚未开始，则在正式开战后加入。不会成为讨董联盟的正式成员。"
 hd_lb_gongsun_send_tt:0 "向刘备发送结盟与迁营邀请，由刘备决定是否接受。"
 hd_lb_gongsun_accept_tt:0 "与公孙瓒结盟；仍为冒险者时，将现有营地迁往他当前的首府，已有领地则不改变。正在旅行时，迁营延后至旅行结束后的检查。"
 hd_lb_zhao_friend_tt:0 "刘备与赵云成为好友；赵云仍留在公孙瓒宫廷，不在此事件中被强行调走。"
 hd_lb_zhao_join_tt:0 "仍为无地且能够自由行动的赵云加入刘备的宫廷或营地，不剥夺其已有领地。"
 hd_lb_tao_defense_tt:0 "陶谦实际控制的徐州法理伯爵领获得5年守备修正：堡垒等级+1、驻军规模+20%。同时邀请刘备。"
 hd_lb_tao_accept_tt:0 "与陶谦结盟；仍为冒险者时，迁营至其控制的徐州县城，已有领地则不改变。不因此加入其所有战争。"
 hd_lb_mi_visit_tt:0 "麋竺、麋芳在无地、未被囚禁且可行动时加入。优先选择麋氏作为婚配对象，否则从麋竺同一宗族选择合法的未婚成年女子；无合适对象则只投效、不结婚。"
 hd_lb_mi_recruit_only_tt:0 "只处理麋竺、麋芳投效，不安排婚姻。受旅行、囚禁或领地身份阻碍者，在条件允许后再投效。"
 hd_lb_bequest_tao_tt:0 "将陶谦当前持有的所有正常领土头衔及相应封臣移交刘备，排除世族与无地特殊头衔。交接完成后陶谦病逝。若刘备也是玩家，须由其另行接受。"
 hd_lb_bequest_liu_tt:0 "先移交并核对陶谦的全部正常领土头衔与封臣，保留世族头衔，再处理陶谦病逝。刘备成为有地统治者并使用天朝制。"
 hd_lb_bequest_decline_tt:0 "不转移任何头衔，不强制陶谦死亡，本次让徐州事件结束。"
