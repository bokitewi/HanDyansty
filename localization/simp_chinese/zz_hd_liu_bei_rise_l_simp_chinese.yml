l_simp_chinese:
 hd_liu_bei_rise.0100.t:0 "黄旗遍野"
 hd_liu_bei_rise.0100.desc:0 "急报上的地名一个接着一个，黄巾所到之处，官军已与乱众交上了手。报信的人说起逃难的百姓，抬袖擦了擦脸，再开口时，嗓子都哑了。\n\n你让他坐下喝口水，自己又把军报看了一遍。这些州县有远有近，可逃难的人，哪一个不是为了保住妻儿？若今日只因兵少便收起旗号，往后又拿什么去向愿意追随你的人开口？\n\n帐外有人问要往何处去。你望着那些等候的面孔，忽觉这一句话比平日更重。要去救人，也须带着眼前这些人一道去。"
 hd_liu_bei_rise.0100.a:0 "率众从军，共讨黄巾。"
 hd_liu_bei_rise.0100.b:0 "兵微将寡，且保部众。"
 hd_liu_bei_rise.0200.t:0 "关东义旗"
 hd_liu_bei_rise.0200.desc:0 "关东诸侯起兵讨董的消息传到了。来人说起盟书上的名号，指点着各家旌旗说得兴起，问到你的旗号时，却一下子顿住了。\n\n你不在那些诸侯的席位之中，麾下兵众也不能与各路大军相比。可董卓挟持朝廷，远近皆知；若只因盟书上没有你的名字，便认定此事与你无关，往日说过的话又值几何？\n\n你听完军情，命人清点行装。部众仍由你统领，他们要听的，是你自己的决断。"
 hd_liu_bei_rise.0200.a:0 "盟书无名，讨贼有心。"
 hd_liu_bei_rise.0200.b:0 "此番讨董，不预其事。"
 hd_liu_bei_rise.0300.t:0 "一封故人书"
 hd_liu_bei_rise.0300.desc:0 "“刘玄德如今在何处？”讨董诸军散去一月，你翻到他的消息，便把书吏叫住。旁人都在清点各自带回多少兵粮，你倒想知道这位昔日同窗又落脚何方。\n\n玄德谈起志向，底气总比手中的兵马足些。这未必是坏事，只是乱世之中，光凭一口志气，撑不起一座营盘。你这里若多一个肯相助的人，南面的军务也多一分照应。\n\n你让书吏取来新简，措辞却不必像征召属吏那般生硬。既是邀请故人，就把结盟之意写明白；他若仍带着营众四处奔走，你这里也容得下。"
 hd_liu_bei_rise.0300.a:0 "致书玄德，邀其北来。"
 hd_liu_bei_rise.0300.b:0 "暂不相邀，各安其事。"
 hd_liu_bei_rise.0301.t:0 "伯圭来书"
 hd_liu_bei_rise.0301.desc:0 "“伯圭兄还记着我。”读到信中相邀的那一句，你的嘴角已先松开了。使者随后说起结盟之事，又说你若还带着营众奔走，可到公孙瓒的治所驻扎。\n\n你请他坐近些，问起故人近况。一路辗转，听惯了嫌你兵少、嫌你名轻的话，这封信倒没有先问你能带去多少人马。可一旦应下，便不能只把那里当作借宿的去处；伯圭有事，你也须尽一份力。\n\n信纸在手中微微卷起。你抚平边角，再望向使者。既是故人来问，回话便该出自本心，不能只叫他带回几句客套。"
 hd_liu_bei_rise.0301.a:0 "愿与伯圭共济，移营北上。"
 hd_liu_bei_rise.0301.b:0 "谢伯圭厚意，另作他图。"
 hd_liu_bei_rise.0400.t:0 "相知子龙"
 hd_liu_bei_rise.0400.desc:0 "在公孙瓒境内住了些日子，你渐渐熟识了军中一些面孔。赵云便是其中之一：谈起兵事从不夸耀，问到乡里与流民，却总肯多说几句。\n\n这日闲谈，又说到从军的缘由。他说，人逢乱世，总盼着追随一位能让百姓安顿下来的人。你本已起身，听到这一句，又坐回了原处。这样的话说出来不难，难的是说过之后，遇到利害还肯记得。\n\n他如今仍在伯圭麾下任事，你也无意立刻向故人讨要一员部将。今日先得一位知心的朋友，已是难得的收获。"
 hd_liu_bei_rise.0400.a:0 "子龙之志，与我相合。"
 hd_liu_bei_rise.0410.t:0 "旧友叩门"
 hd_liu_bei_rise.0410.desc:0 "来人还没报完姓名，你已从门边站了起来。赵云到了，随身带着行装，神色仍和初识时一样沉静。\n\n自从在伯圭那里相交，你们便知道彼此想做什么，只是各有去处，不能因一句惺惺相惜就改变所有安排。如今他已离开旧处，可以自行择主，这才来到你这里，问你是否还愿与他同行。\n\n你看了看他带来的行装，本想说几句郑重的延聘之辞，话到嘴边，却只问他一路上可曾歇息。朋友愿把往后的路交给你一道走，这比许多慷慨的誓言都重。"
 hd_liu_bei_rise.0410.a:0 "愿子龙留此，共图大事。"
 hd_liu_bei_rise.0500.t:0 "徐州城下的阴影"
 hd_liu_bei_rise.0500.desc:0 "曹操据有兖州，又把势力伸向邻州。州府收到的军报一封紧似一封，徐州的城池与粮道，已不能再照平日的样子处置。\n\n你命人重查所领诸县的守备，坍坏的城堞、空缺的戍卒，都一一列在簿上。修缮可以先做，外援却须有人肯来。刘玄德素有扶危济困之志，若遣使相邀，他或许愿与你订盟，来徐州相助。\n\n案上同时摆着守城的簿册与尚未封口的书信。若再不作安排，下一回听到的，便可能不是邻州的消息了。"
 hd_liu_bei_rise.0500.a:0 "缮治城守，遣使延请玄德。"
 hd_liu_bei_rise.0500.b:0 "守备如旧，暂不相邀。"
 hd_liu_bei_rise.0501.t:0 "来自徐州的邀约"
 hd_liu_bei_rise.0501.desc:0 "陶谦的使者站在你面前，衣上的尘土还没掸净，说起徐州守备，却顾不上先讨一口水喝。“使君所望，正在玄德。”他说完，仍不肯坐下。\n\n你接过来书，又请他把州中情形说得细些。那些地名落到耳中，你想到的不只是城池，还有城里尚不知大军将至的百姓。可你身后也有部众，也有人指望你替他们寻一条出路。\n\n陶使君愿与你结盟相助；你若仍率营众漂泊，他也愿接纳你移营徐州。你把信合上。应下这一声“玄德”，往后便要拿出真正的援手，不能只叫来人空欢喜一场。"
 hd_liu_bei_rise.0501.a:0 "愿与陶使君同心，移营徐州。"
 hd_liu_bei_rise.0501.b:0 "此约难以遽应，烦君转达。"
 hd_liu_bei_rise.0600.t:0 "麋氏的心意"
 hd_liu_bei_rise.0600.desc:0 "麋竺说起相助，没有急着问你能许他什么官位，倒先问你的部众如今如何安顿。你答过了，他才说起麋芳，又把话慢慢引到两家的婚事上。\n\n你放下酒盏，郑重地向他一揖。奔走以来，少有人肯把自家门户的打算也同你系在一处，这份心意不能轻看。只是人各有牵挂，麋氏兄弟能否离开原处，这门婚事是否合宜，都要先说个明白。\n\n子仲仍在等你答话。人才你愿意延请，情义你愿意领受；至于是否结亲，却不能只因席间投契，便替旁人定下一生。"
 hd_liu_bei_rise.0600.a:0 "愿得二君相助，亦结秦晋之好。"
 hd_liu_bei_rise.0600.b:0 "愿请二君相助，婚事不议。"
 hd_liu_bei_rise.0700.t:0 "病榻上的州印"
 hd_liu_bei_rise.0700.desc:0 "一叠待阅的文书送到榻前，你看了许久，连最上面那一卷也没能展开。病势一日重似一日，州中大小事务，已不是凭一口气强撑便能料理的了。\n\n刘备如今就在徐州。若将你所掌的州郡与部众托付给他，或许能免去身后仓促的争夺。可这终究不同于借一队兵、请一次援；一旦交了出去，治下官吏往后听谁号令，便有了新的答案。\n\n你让人把州印放得近些。陶家自有陶家的承继，徐州的军民，却需要一个还能坐在堂上决事的人。"
 hd_liu_bei_rise.0700.a:0 "非刘备不能安此州也。"
 hd_liu_bei_rise.0700.b:0 "家业自有所归，不必让州。"
 hd_liu_bei_rise.0701.t:0 "托付徐州"
 hd_liu_bei_rise.0701.desc:0 "使者把陶谦的意思说了两遍，你仍没有伸手去接那份州郡簿籍。当初来徐州，答应的是相助；谁知今日，竟要接过陶使君肩上的整副担子。\n\n“此非虚让。”来人说得很轻，却又把文书往前推了一寸。你望见上面密密麻麻的县名，眼前仿佛便是城门、村舍，还有那些盼着守军不再更换旗号的人。陶家的家业另有承继，交到你手里的，是这些州郡往后的安危。\n\n你起身走了两步，又回到案前。推辞容易，可陶使君还在病中等着回音，徐州也总得有人担起来。"
 hd_liu_bei_rise.0701.a:0 "受此重托，不敢有负。"
 hd_liu_bei_rise.0701.b:0 "此任太重，备不敢当。"
 HD_LIU_BEI_RISE_STORY_STATUS:0 "当前篇章：#V [Story.MakeScope.Var('hd_liu_bei_life_phase').GetFlagName]#!\n刘玄德起于涿郡，织席贩履出身，却自称中山靖王之后。乱世之中，他带着一群肯同生共死的人辗转四方，寻一处能够安顿部众、施展抱负的地方。"
 hd_liu_bei_phase_yellow_turban:0 "从讨黄巾"
 hd_liu_bei_phase_wandering:0 "辗转四方"
 hd_liu_bei_phase_anti_dong:0 "随军讨董"
 hd_liu_bei_phase_gongsun:0 "依附伯圭"
 hd_liu_bei_phase_zhao_yun:0 "结识子龙"
 hd_liu_bei_phase_xuzhou:0 "客居徐州"
 hd_liu_bei_phase_xuzhou_lord:0 "领有徐州"
 hd_lb_xuzhou_prepared_defenses:0 "徐州整饬守备"
 hd_lb_xuzhou_prepared_defenses_desc:0 "陶谦命人缮治城堞、增补戍卒，此地守备为之一新。"
 hd_lb_yellow_join_tt:0 "你率部投入官军，与黄巾作战。"
 hd_lb_dong_join_tt:0 "你将随关东诸军进讨董卓，虽然盟书上并没有你的名字。"
 hd_lb_gongsun_send_tt:0 "书信将送到玄德手中，应与不应，由他自定。"
 hd_lb_gongsun_accept_tt:0 "若你仍率营众漂泊，便移营北上，到伯圭的治所驻扎。"
 hd_lb_tao_defense_tt:0 "你遣使往见刘玄德，请他前来徐州相助。"
 hd_lb_tao_accept_tt:0 "若你仍率营众漂泊，便移营入徐州，就近相助。"
 hd_lb_mi_visit_tt:0 "麋竺、麋芳将陆续投到你的帐下；麋家若有合宜的女子，便许你为妻。"
 hd_lb_mi_recruit_only_tt:0 "麋竺、麋芳将陆续投到你的帐下。"
 hd_lb_bequest_tao_tt:0 "你将所领州郡与部众尽数托付给刘玄德。#EMP 交割既毕，你也将撒手人寰。#!"
 hd_lb_bequest_liu_tt:0 "你接过陶谦所领的州郡与部众，成为徐州之主。交割既毕，陶使君便溘然长逝。"
