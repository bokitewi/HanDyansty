 hd_dc_debug.neg01.desc: "谋杀的原生自动发起概率已接危险率换算，保留动态基础概率与原生目标资格。F为1／1.15／1.40／1.80／2.30；群雄割据的既定倍率另行合并，上限3。\n\n请用真实目标的谋杀交互检查实际计谋；玩家手动点击不代表AI自动发生率样本。菜单没有用另一个随机池代替原生抽样。"
 hd_dc_debug.neg02.desc: "绑架原生发起入口保留能力、合法目标与计谋条件，F为1／1.15／1.40／1.80／2.30。没有绑架能力的人仍不能执行。\n\n请从真实人物的绑架交互检查计谋；不得把立即囚禁当作绑架成功。本菜单尚无完整的自动抽样测试场景。"
 hd_dc_debug.neg03.desc: "勒索入口保留真实秘密、知情者和原生动态基础值，F为1／1.15／1.40／1.80／2.30。正式发出勒索后仍由实际对方答复。\n\n真实场景页可对具名合格廷臣新增一项原生秘密并让你知情，再右键此人正式勒索。准备操作明确发生在当下，不编造旧罪；不直接发放把柄，也不把手动提案当作AI概率样本。"
 hd_dc_debug.neg04.desc: "未完成：盗库的原生标题目标计谋仍被旧稳定性修补禁用，禁用说明涉及185年初代理槽位访问冲突，尚未查明安全恢复所需条件。\n\n提款记账已保留各阶段与终局独立提款、实际扣款与到账及待清算差额，并按批准规则保留透支。禁用入口未恢复，不能算可玩覆盖。"
 hd_dc_debug.neg05.desc: "民粹派系的合法发难读取P，五档为1／1.10／1.25／1.50／1.80。创建采用已批准的新规则：保留原生自动创建；W≥20时，每政权每年另抽一次基础10%、经P换算的机会，在实际合法类型中等权选择，最多创建一个。\n\n民粹类型使用真实郡的原生创建资格；不替换原生最终创建概率。年度检查页显示实际记录，场景页另可准备真实派系，不直接开始或赢得起义。"
 hd_dc_debug.neg06.desc: "农民派系的合法发难读取P，五档为1／1.10／1.25／1.50／1.80。普通农民类型已接入额外年度创建机会：W≥20、基础10%经P换算，与其他合法类型共享每政权每年最多一个的上限；原生创建保留。\n\n升级农民派系仍由原生已有起义升级流程创建，保留真实领袖与郡转接。额外机会不伪造前置起义、军队或胜利。"
 hd_dc_debug.neg07.desc: "创建已改用批准的额外年度机会：保留原生自动创建，W≥20时每政权每年基础10%经P换算，成功后在实际合法类型中等权选一个，最多创建一个，失败不重抽。候选人数不增加类型权重。\n\n普通角色、郡起义及真实宣称者分别核验原生创建资格。已有同类派系排除；关闭的日本机制继续按现行条件排除，升级农民保留原生升级流程。此处不声称读取或替换引擎最终创建概率。可进入年度检查页查看真实抽样与创建结果。"
 hd_dc_debug.neg08.desc: "原生派系发难入口已按逐类型动态基础值接入P；五档为1／1.10／1.25／1.50／1.80。已存在派系还须达到其力量、不满与其他前提，0与100端点保持原意。\n\n真实派系页可对具名非暂停宣称者派系增加实际不满并回读净变化，显示原生当前是否可发难；必须从原生派系界面发送，调试不跳过首次发难的内部状态。ROY-08D暂停守卫继续有效。"
 hd_dc_debug.neg09.desc: "已接入原生修正：人物压力增长五档为0／+10%／+20%／+35%／+50%。适用于本系统区域内的情况参与人物，初始化与月度观察刷新档位，离区移除；与其他压力修正的叠加及实际变化由原生规则处理。\n\n先记录人物当前压力，再用下方操作实际提交基础+10压力，比较操作前后的真实压力读数与当前修正。"
 hd_dc_debug.neg10.desc: "已接入原生修正：人物正统性增长五档为0／−10%／−20%／−35%／−50%。适用于本系统区域内的情况参与人物，与其他正统性修正的叠加及实际增长由原生规则处理。\n\n切换W档并刷新后查看人物修正；记录正统性当前值，再完成真实会增加正统性的行动，比较前后实际读数。"
 hd_dc_debug.neg11.desc: "已接入原生修正：人物正统性损失五档为0／+10%／+25%／+50%／+80%。适用于本系统区域内的情况参与人物，与其他正统性修正的叠加及实际损失由原生规则处理。\n\n记录人物当前正统性，再完成真实会降低正统性的行动，比较前后实际读数；换档替换本系统修正，离区移除。"
 hd_dc_debug.neg12.desc: "七种原生疫病各强度的合法发生入口已接D，五档1／1.05／1.10／1.15／1.20。\n\n真实场景页现可依次选择七种灾种、三个强度，再确认具名郡；复用原生真实发生效果并回读感染。DLC、同病冷却、原生基础与黑死病规则仍生效，历史黑死病在当前地图无法满足发生地时明确阻止。21个菜单组合不代表21种场景在任意规则下都合法，手动创建也不证明自然D概率或引擎传播。"
 hd_dc_debug.neg13.desc: "已恢复真实地震与洪灾入口及现有中华、黄河、长江地理映射。调试页复用正式郡资格与发生接口，保留发展至少2、同郡地震和同河洪灾排除，不伪造灾害情况。\n\n手动场景明确建立真实灾害，后续应对仍由原生情况运行；自然D倍率、季节与运行回调需分别检查，不能用手动发生一次证明自然概率。"
 hd_dc_debug.neg14.desc: "部分接入：既有成年饮酒机会、行政长官12类候选，以及巡游宴饮、成人教育、灵感失败的原生负面特质结果池接入F。保留合法候选、互斥和一次抽样；非遗传抑郁不改成遗传疾病。巡游宴饮的死亡概率保持1%，不合法的特质份额回到普通醉酒结果；区域外保留原生规则。并未覆盖所有原生负面特质入口。\n\n真实场景页可执行一次合格饮酒抽样并看概率账；压力与冷却合格时也可发起完整原生压力事件。其他结果池需要原事件完整上下文，不伪造候选标记代替剧情。"
 hd_dc_debug.neg15.desc: "控制力以本轮首次进入危世时的实际值为基准，累计扣除0／5／10／15／20%。只补最高已处理档位以上的差额；反复刷新、换领主、降低再升回旧档不重复扣除。低档稳定60个月才结束本损失周期。\n\n记录首都郡控制力，按20→80→40→80调W并重复刷新，核对已处理与已扣总额。损失不会随降档返还。"
 hd_dc_debug.neg16.desc: "发展度按本周期实际基准累计扣除0／2／4／6／8%，累计目标取整后只补新增差额。正常发展继续保留，换领主不清账，重复月度刷新不复利扣除。\n\n与控制力一起切档检查；发展基准较低时，取整后可能没有新增损失。"
 hd_dc_debug.neg17.desc: "部分接入：实际婚姻争端入口、九处既有敌对分支、宴会6501的两处关系结果池和儿童聚会5002的一处争端读取真实亲属或配偶关系，F为1／1.15／1.40／1.80／2.30。同一对既是亲属又有旧怨时只乘一次；非亲属且无旧怨时不放大。保留人物性格带来的原生动态概率、儿童资格与真实后果。\n\n家族争端场景页可通过完整adultery.0001入口发起真实伴侣怀疑链；原事件选择实际对象并保留五年对象冷却，拒认后的原生分支才实际抽样。其他混合事件池未声称覆盖。"
 hd_dc_debug.neg18.desc: "部分接入：既有九处仇敌分支、宴会6501的两处关系结果池和儿童聚会5002的一处争端，核验实际旧怨与负面好感后使用F。真实仇敌场景页可经yearly.1010完整入口发生仇敌劫走亲友的真实事件链，保留亲友、仇敌、追索人的资格及十年标记；其后果可能包含死亡。ORD-19另有青年与保证人流程。其余原生仇敌链未声称覆盖。"
 hd_dc_debug.neg19.desc: "已接入：当前实际加载的脚本中，家族团结负向或可变正负写入使用1／1.10／1.25／1.50／1.80，固定正向增量不放大。保留原人物归属、原生说明与量程处理。\n\n没有真实团结机制的政府不适用。合格家族可在下方实际提交基础−10团结，分别检查五档与家族变化记录；此测试不改变政府来伪造团结机制。"
 hd_dc_debug.test_unity: "实际提交基础−10家族团结"
 hd_dc_debug.test_unity.tt: "需要你在王朝循环区域内、有真实家族且当前政府拥有原生团结机制。实际减少家族团结，按当前P只乘一次；不会自动返还。"
 hd_dc_debug.unity_change: "王朝循环调试：实际团结损失"
 hd_dc_debug.neg20.desc: "当前区域郡民意使用单一来源，五档0／−5／−10／−15／−20。换档先移除旧档再加新档，离开适用区域清理本来源。\n\n可重复刷新核对同档不叠加；人物好感不属于此郡级民意。"
 hd_dc_debug.refresh_stocks: "执行正式郡级影响刷新"
 hd_dc_debug.refresh_stocks.tt: "实际刷新区域控制力、发展度和民意来源。首次升档会发生应扣存量损失；重复调用须保持同一最高已处理档位。"
 hd_dc_debug.test_stress: "实际提交基础+10压力"
 hd_dc_debug.test_stress.tt: "会增加真实压力，可能达到原生压力事件阈值。其他原生修正仍然参与计算。"
 hd_dc_debug.test_native_breakdown: "发起合格的原生压力事件"
 hd_dc_debug.test_native_breakdown.tt: "需要当前压力等级与对应原生冷却允许。一天后再次核验资格，再由原生压力事件选择实际内容；不强制给予特质。"
 hd_dc_debug.counties: "查看首都郡的实际影响账"
 hd_dc_debug.counties.desc: "当前查看[scope:hd_dc_debug_county.GetName]。此页不改控制力、发展度、民意或政策。没有损失周期字段时，不把缺少记录当成已经扣过。"
 hd_dc_debug.counties.loss: "\n控制力基准：[scope:hd_dc_debug_county.Var('hd_dc_control_baseline').GetValue|2]\n发展度基准：[scope:hd_dc_debug_county.Var('hd_dc_development_baseline').GetValue|0]\n最高已处理档位：[scope:hd_dc_debug_county.Var('hd_dc_highest_loss_band').GetValue|0]\n累计控制力实扣：[scope:hd_dc_debug_county.Var('hd_dc_control_paid').GetValue|2]\n累计发展度实扣：[scope:hd_dc_debug_county.Var('hd_dc_development_paid').GetValue|0]"
 hd_dc_debug.counties.recovery: "\n本周期正在低档恢复观察期，尚未连续满足60个月。"
 hd_dc_debug.counties.policy: "\n此郡正在本系统正式政策试行中，不能重复占用。"
