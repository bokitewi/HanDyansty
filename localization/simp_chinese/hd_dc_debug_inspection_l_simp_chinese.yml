 hd_dc_debug.fields.petitioner: "\nORD-13请愿者：[scope:hd_dc_debug_record.Var('hd_dc_petitioner').Char.GetShortUIName]"
 hd_dc_debug.fields.help: "\n亲友实际答复：[scope:hd_dc_debug_record.Var('hd_dc_help_answer').GetFlagKey]"
 hd_dc_debug.fields.help_stress: "\n已记人格压力净增量：[scope:hd_dc_debug_record.Var('hd_dc_personality_stress_actual').GetValue|2]"
 hd_dc_debug.fields.cooperation: "\nORD-19青年：[scope:hd_dc_debug_record.Var('hd_dc_visitor').Char.GetShortUIName]\n保证人：[scope:hd_dc_debug_record.Var('hd_dc_guarantor').Char.GetShortUIName]"
 hd_dc_debug.fields.pay_parties: "\n实际付款方：[scope:hd_dc_debug_record.Var('hd_dc_payer').Char.GetShortUIName]\n实际收款方：[scope:hd_dc_debug_record.Var('hd_dc_payee').Char.GetShortUIName]"
 hd_dc_debug.fields.proposal: "\n提案当前状态：[scope:hd_dc_debug_record.Var('hd_dc_proposal_state').GetFlagKey]"
 hd_dc_debug.fields.from_signature: "\n发起方真实签署：[scope:hd_dc_debug_record.Var('hd_dc_from_signature').Char.GetShortUIName]"
 hd_dc_debug.fields.to_signature: "\n接收方真实签署：[scope:hd_dc_debug_record.Var('hd_dc_to_signature').Char.GetShortUIName]"
 hd_dc_debug.fields.trait: "\n特质抽样来源：[scope:hd_dc_debug_record.Var('hd_dc_trait_source').GetFlagKey]\n基础概率：[scope:hd_dc_debug_record.Var('hd_dc_trait_base_chance').GetValue|2]%\n倍率：[scope:hd_dc_debug_record.Var('hd_dc_trait_multiplier').GetValue|2]\n实际概率：[scope:hd_dc_debug_record.Var('hd_dc_trait_actual_chance').GetValue|2]%\n实际结果：[scope:hd_dc_debug_record.Var('hd_dc_trait_result').GetFlagKey]"
 hd_dc_debug.native_scene.desc: "此页显示具体对象。点击后会实际改变新局世界，返回菜单不撤销。原生增量与特质抽样可检查当前档位；手动准备秘密或疫情不代表自然发生率抽样，也不代表所有二十类接口已经完成。"
 hd_dc_debug.native_scene.secret_target: "\n拟加入真实秘密的人物：[scope:hd_dc_debug_secret_target.GetShortUIName]。秘密类型由原版按此人信仰、现有特质与秘密资格选择。"
 hd_dc_debug.native_scene.no_secret_target: "\n秘密场景缺少对象：你的宫廷中没有存活、成年、自由且通过原版可新增勒索秘密检查的人物。需先招募合格廷臣；此页不会将已有把柄冒充秘密。"
 hd_dc_debug.native_scene.no_legitimacy: "\n正统性增量不可执行：当前人物没有原生正统性机制。不会修改政府来伪造资格。"
 hd_dc_debug.native_scene.no_drunkard: "\n饮酒抽样不可执行：未通过原生 can_be_drunkard 检查。成年、已有酒鬼特质、互斥与信仰条件仍由原版检查，不能重复授予。"
 hd_dc_debug.native_scene.secret: "为具名廷臣准备一项真实可勒索秘密"
 hd_dc_debug.native_scene.secret.tt: "为上方人物按原版资格生成真实秘密并让你知情。不会发放把柄、扣钱或替人物答应勒索。随后右键该人物，通过正式勒索交互发出提案。"
 hd_dc_debug.native_scene.secret_created: "已执行秘密生成并取得原生秘密对象，知情者为你，对象为[scope:hd_dc_debug_secret_target.GetShortUIName]。\n秘密内容：[scope:new_secret.Custom('SecretDescriptionThirdPerson')]\n\n请查看秘密面板，再右键此人发出勒索。交互仍检查秘密是否暴露、是否可勒索、现有把柄和待答复状态；只有当事人的正式答复能决定结果。"
 hd_dc_debug.native_scene.secret_failed: "没有取得原生秘密对象；不能报告生成成功。请检查目标当前资格和日志，此页没有补发把柄或代填结果。"
 hd_dc_debug.native_scene.legitimacy_gain: "实际提交基础＋10正统性并读取前后值"
 hd_dc_debug.native_scene.legitimacy_loss: "实际提交基础−10正统性并读取前后值"
 hd_dc_debug.native_scene.drunkard: "执行一次合法饮酒特质抽样（基础10%）"
 hd_dc_debug.native_scene.drunkard.tt: "调用正式饮酒抽样接口，按当前F换算一次；未抽中也是合法结果。实际授予酒鬼后不可重复取得；账页保留基础概率、倍率、实际概率与授予结果。不是所有负面特质入口覆盖证明。"
 hd_dc_debug.native_delta: "本次原生增量的实际读数"
 hd_dc_debug.native_delta.desc: "执行前：[SCOPE.GetValue('hd_dc_debug_before_amount')|2]\n执行后：[SCOPE.GetValue('hd_dc_debug_after_amount')|2]\n本次净变化：[SCOPE.GetValue('hd_dc_debug_actual_delta')|2]\n\n读取发生在同一个效果链，包含原生修正和量程钳制。此页是刚才操作的观察值，不补记为自然来源，也不证明所有来源的最终增量拦截已经闭合。"
 hd_dc_debug.native_scene.outbreak_county: "\n拟发生所选疫情的真实郡：[scope:hd_dc_debug_outbreak_county.GetName]，位置为该郡首府省份。"
 hd_dc_debug.native_scene.no_outbreak_county: "\n没有可准备本组合的区域郡：要求封臣领郡、领主存活自由、没有现存疫情或本系统试行/减税占用；所选强度的原生基础、倍率和近期疫情因子须允许发生。另保留麻疹/痢疾/圣火病DLC锁、圣火病同病冷却、黑死病禁用/单次已发生/正在发生/历史地理限制。教学或开局宽限导致基础为零时不改日期；肺痨、麻疹地方病加值仍按原生次序读取。"
 hd_dc_debug.native_scene.outbreak: "选择七种疫病与三个强度"
 hd_dc_debug.native_scene.outbreak.tt: "复用原生省份create_epidemic_outbreak实际创建上方灾种与强度，点击时再次检查同一具名郡。不会修改自然发生率或额外抽样，也不会给郡添加假疫情修正。发生后读取真实疫情；传播、患病和死亡由原生系统处理。"
 hd_dc_debug.native_scene.outbreak_created: "已在[scope:hd_dc_debug_outbreak_county.GetName]读取到真实疫情。刚才请求的是[SCOPE.GetFlagName('hd_dc_debug_epidemic_name')]／[SCOPE.GetFlagName('hd_dc_debug_epidemic_intensity')]；请在疫情地图核对实际类型、强度与传播。其他疫情的自然合并仍由引擎处理，郡感染回读本身不证明它们不会合并。\n\n如需PAR双郡对照，再准备另一没有疫情的合格郡，然后进入场景准备菜单。不会自动填答复、支付救济款或跳过12个月试行。"
 hd_dc_debug.native_scene.outbreak_unconfirmed: "已向[scope:hd_dc_debug_outbreak_county.GetName]首府提交原生疫情发生效果，但当前效果链尚未读取到受感染省份。不能报告疫情已确认，也不会添加郡修正冒充。请让原生疫情更新后查看地图与真实受灾资格，再准备PAR场景。"
 hd_dc_debug.history_unavailable: "\n#N 历史记录警告：至少一次 W/H 写入时没有存活的簿籍保管人，该次仅保留区域最后写入明细。此提示不代表补记成功。#!"
 hd_dc_debug.roy01: "ROY-01：发起礼序争议"
 hd_dc_debug.roy01.tt: "需要你是在位天子、区域快照有效、至少两名原生资格合格的宗亲候选、皇室类型未在冷却中，且没有占用区域的当前或待建实例。正式建档会建立实际宣称与派系，并启动50年类型冷却。"
 hd_dc_debug.roy08: "ROY-08：请合格宗亲向我发出邀约"
 hd_dc_debug.roy08.tt: "需要已有最近一期皇室实例及仍有效的实际宣称派系。你必须是可以加入该派系的合格收件人，不能是天子、候选人本人、已加入者或正在与双方交战者；同一对人物不得有待答复邀约、已加入记录或重试冷却。暂停中的派系不能招募。"
 hd_dc_debug.par01: "PAR-01：发起两党政策询问"
 hd_dc_debug.par01.tt: "需要你是在位天子、区域空闲且党争类型未在冷却中；两组真实朋党各有至少3名在职成员、势力占比至少20%，领袖相互敌对；另需有受真实疫病或灾害影响且可施政的封臣领郡。先询问两党魁；实际答复相反才建立主实例，不代填任何人的政策。"
 hd_dc_debug.prepare_roy: "准备 ROY-01：激化两名现有宗亲的不满"
 hd_dc_debug.prepare_roy.tt: "仅使用两名已有领地、同属天子宗族且满足原生派系权限的成年自由宗亲。各自获得五年对天子−200好感及300金，你获得300金。不会创建人物、改宗族、分配领地或伪造旧罪；不足两人时不可准备。随后从合法事件菜单正式建档。"
 hd_dc_debug.prepare_support: "准备 ROY-08：资金与真实人情把柄"
 hd_dc_debug.prepare_support.tt: "从最近一期皇室实例选择一名能依法向你发出邀请的真实候选。你与该候选各获得300金；若允许建立把柄，你获得针对该候选的人情把柄。把柄须在正式D选项中实际使用；不提前暂停，也不自动签订保护承诺。"
 hd_dc_debug.prepare_ord09: "准备 ORD-09：真实亲族与交换囚犯"
 hd_dc_debug.prepare_ord09.tt: "在区域内选取另一位合格在位统治者作为囚禁者，生成你的一名18岁子女与该人物的一名18岁子女；前者由对方软禁，后者由你软禁。你获得300金。囚禁、亲属关系与人物都实际存在，关闭菜单不会撤销。随后仍须发出提案并获得囚禁者真实答复。"
 hd_dc_debug.prepare_ord13: "准备 ORD-13：低控制领郡、压力与亲友"
 hd_dc_debug.prepare_par: "准备 PAR-01：真实两党与受灾郡对照"
 hd_dc_debug.prepare_par.tt: "必须已经有两组人数、官职与实际势力合格的原生朋党，以及两个真实受灾且可施政的封臣领郡。两党魁获得五年相互−200好感；将第二郡的当前发展与控制力调为第一郡相同值，你获得300金及五年+16管理。不会制造疫情、伪造党派人数或代填政策答复。随后通过正式询问产生实际政策分歧。"
 hd_dc_debug_party_grievance_opinion: "调试场景：两党新生的嫌隙"
 hd_dc_debug_policy_training: "调试场景：政策管理准备"
 hd_dc_debug.prepare_ord13.tt: "选择一名现有成年自由直属封臣，将其一郡控制力设为40；生成35岁亲友加入你的宫廷并建立朋友关系，你获得300金并将压力至少提高到200，可能触发原生压力事件。现任掌玺大臣对你获得五年+100好感；未任命大臣时仍须自行任命。"
 hd_dc_debug_friend_reason: "[CHARACTER.GetShortUIName]与[TARGET_CHARACTER.GetShortUIName]因调试场景准备结为朋友"
 hd_dc_debug_roy_grievance_opinion: "调试场景：新生的宗亲不满"
 hd_dc_debug.impacts: "二十类危世影响与检查入口"
 hd_dc_debug.results: "检查当前实例与实际收据"
 hd_dc_debug.region: "区域、时代与入口限制"
 hd_dc_debug.region.desc: "核心郡数：[scope:hd_dc_debug_region.Var('hd_dc_total_counties').GetValue|0]\n实际控制郡数：[scope:hd_dc_debug_region.Var('hd_dc_controlled_counties').GetValue|0]\n真实控制率：[scope:hd_dc_debug_region.Var('hd_dc_control_percent').GetValue|1]%\n\n无霸权满12个月，或真实控制率不足50%满24个月，方由正式判定器进入群雄割据；恢复65%并稳定60个月后退出。朝贡不算实际控制。W/H调整不直接切换时代。\n以下仅列当前成立的限制："
 hd_dc_debug.region.chaos: "\n当前时代为群雄割据。"
 hd_dc_debug.region.locked: "\n区域主危机槽位已被实际实例占用，不可覆盖。"
 hd_dc_debug.region.prepared: "\n存在尚未完成建档的政治实例，不可重复建立。"
 hd_dc_debug.region.party_wait: "\n两党政策询问尚未结束，正在等待实际答复。"
 hd_dc_debug.region.roy_cooldown: "\n皇室类型50年冷却尚未结束。"
 hd_dc_debug.region.par_cooldown: "\n党争类型50年冷却尚未结束。"
 hd_dc_debug.region.ordinary_wait: "\n你有待答复普通事件，不可另开普通节点。"
 hd_dc_debug.region.invalid: "\n区域快照无效；先执行正式观察并检查世界中实际领地。"
 hd_dc_debug.details: "查看这张收据的结果"
 hd_dc_debug.older: "查看上一张收据"
 hd_dc_debug.latest: "回到最新收据"
 hd_dc_debug.receipt.desc: "区域收据编号：[scope:hd_dc_debug_record.Var('hd_dc_record_id').GetValue|0]\n记录版本：[scope:hd_dc_debug_record.Var('hd_dc_record_version').GetValue|0]\n记录类型标识：[scope:hd_dc_debug_record.Var('hd_dc_record_kind').GetFlagKey]\n\n此页读取保留的真实记录。翻页不会扣款、补签、推进日期或结算。未出现的项目表示此记录没有对应字段，不表示已经履行。"
 hd_dc_debug.receipt.empty: "没有符合当前翻页范围的记录。可回到最新收据；自然或手动正式流程建立的记录会保留在区域名册中。"
 hd_dc_debug.receipt.instance: "\n主实例：治理Q [scope:hd_dc_debug_record.Var('hd_dc_q').GetValue|0]，烈度X [scope:hd_dc_debug_record.Var('hd_dc_x').GetValue|0]，未结义务 [scope:hd_dc_debug_record.Var('hd_dc_open_obligations').GetValue|0]。"
 hd_dc_debug.receipt.payment: "\n支付应付：[scope:hd_dc_debug_record.Var('hd_dc_amount_due').GetValue|2]\n实际扣款：[scope:hd_dc_debug_record.Var('hd_dc_actual_debit').GetValue|2]\n实际到账：[scope:hd_dc_debug_record.Var('hd_dc_actual_credit').GetValue|2]\n支付双方与政治答复是分别记录的；足额到账本身不代表所有非金钱义务已经完成。"
 hd_dc_debug.receipt.refund: "\n仍未返还的扣款：[scope:hd_dc_debug_record.Var('hd_dc_unreturned_debit').GetValue|2]。关闭事件不抹去此余额。"
 hd_dc_debug.receipt.protection: "\n具名保护签订于[scope:hd_dc_debug_record.Var('hd_dc_protection_date_year').GetValue|0]年[scope:hd_dc_debug_record.Var('hd_dc_protection_date_month').GetValue|0]月[scope:hd_dc_debug_record.Var('hd_dc_protection_date_day').GetValue|0]日，期限五年。保护对象为签约时收件人及其当时仍在世的近亲；头衔也在签约时冻结，后出生人物与后取得头衔不自动加入。"
 hd_dc_debug.receipt.protection_wait: "\n五年保护期限仍在进行。日期由游戏推进，菜单不缩短期限。"
 hd_dc_debug.receipt.audit_pending: "\n存在无法核验处罚前合法依据的实际侵害记录，正在待核；不得记作守约完成。"
 hd_dc_debug.receipt.pause: "\n已实际消耗把柄；一年动员暂停起于[scope:hd_dc_debug_record.Var('hd_dc_pause_date_year').GetValue|0]年[scope:hd_dc_debug_record.Var('hd_dc_pause_date_month').GetValue|0]月[scope:hd_dc_debug_record.Var('hd_dc_pause_date_day').GetValue|0]日。到期重新核验原派系与角色；不取消已发生的战争。"
 hd_dc_debug.receipt.trial: "\n第一地方实际收款于[scope:hd_dc_debug_record.Var('hd_dc_audit_first_date_year').GetValue|0]年[scope:hd_dc_debug_record.Var('hd_dc_audit_first_date_month').GetValue|0]月[scope:hd_dc_debug_record.Var('hd_dc_audit_first_date_day').GetValue|0]日。对照试行各郡分别追踪12个月；一方失效不意味着另一方履行完毕，期满还要等待两位党魁核账。"
 hd_dc_debug.receipt.letters: "\n此记录属于ORD-19。两人先在三个月内分别接受，实际支付30金后进入另一个三个月的具名通信期；只有两份实际答复齐备才结算W−2。"
 hd_dc_debug.receipt.closed: "\n此普通节点已结案；支付与未清偿记录仍在名册中。"
 hd_dc_debug.receipt.subject: "\n签约时冻结的保护对象：[scope:hd_dc_debug_record.Var('hd_dc_protected_person').Char.GetShortUIName]。\n所属保护收据：[scope:hd_dc_debug_record.Var('hd_dc_protection_contract').Var('hd_dc_record_id').GetValue|0]。"
 hd_dc_debug.receipt.points: "\n点数流水号：[scope:hd_dc_debug_record.Var('hd_dc_point_sequence').GetValue|0]\n来源标识：[scope:hd_dc_debug_record.Var('hd_dc_point_source').GetFlagKey]\n日期：[scope:hd_dc_debug_record.Var('hd_dc_point_date_year').GetValue|0]年[scope:hd_dc_debug_record.Var('hd_dc_point_date_month').GetValue|0]月[scope:hd_dc_debug_record.Var('hd_dc_point_date_day').GetValue|0]日\nW 请求／实际：[scope:hd_dc_debug_record.Var('hd_dc_w_requested').GetValue|0]／[scope:hd_dc_debug_record.Var('hd_dc_w_committed').GetValue|0]\nH 请求／实际：[scope:hd_dc_debug_record.Var('hd_dc_h_requested').GetValue|0]／[scope:hd_dc_debug_record.Var('hd_dc_h_committed').GetValue|0]\n写入后 W／H：[scope:hd_dc_debug_record.Var('hd_dc_w_after').GetValue|0]／[scope:hd_dc_debug_record.Var('hd_dc_h_after').GetValue|0]\n以上为内部点数，每20点对应界面1点。此流水不参与月度义务处理。"
 hd_dc_debug.result.roy_code: "\n皇室礼序实际结案标识：[scope:hd_dc_debug_record.Var('hd_dc_roy01_result').GetFlagKey]"
 hd_dc_debug.result.par_code: "\n政策节点实际结案标识：[scope:hd_dc_debug_record.Var('hd_dc_par01_result').GetFlagKey]"
 hd_dc_debug.result.ordinary_code: "\n普通节点实际结案标识：[scope:hd_dc_debug_record.Var('hd_dc_ordinary_result').GetFlagKey]"
 hd_dc_debug.result.protection_code: "\n具名保护实际结案标识：[scope:hd_dc_debug_record.Var('hd_dc_protection_result').GetFlagKey]"
 hd_dc_debug.result.pause_code: "\n动员暂停实际结案标识：[scope:hd_dc_debug_record.Var('hd_dc_pause_result').GetFlagKey]"
 hd_dc_debug.details.desc: "以下只列本记录中已经发生或已经记账的结果。空白不表示成功；没有对应结果的事项可能仍在等待，或不属于这种记录。"
 hd_dc_debug.result.fulfilled: "\n五年保护已经守约结束。"
 hd_dc_debug.result.breached: "\n已记录无合法依据的实际侵害，保护毁约。"
