 hd_dc_debug.fields.ransom: "\nORD-09亲族：[scope:hd_dc_debug_record.Var('hd_dc_prisoner').Char.GetShortUIName]\n囚禁者：[scope:hd_dc_debug_record.Var('hd_dc_captor').Char.GetShortUIName]"
