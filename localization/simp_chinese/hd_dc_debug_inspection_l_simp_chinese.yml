 hd_dc_debug.epidemic.menu: "选择真实疫情灾种"
 hd_dc_debug.epidemic.menu.desc: "选择灾种后还须选择强度，并在具名郡确认页明确执行。前两步只选择参数，不发生疫情。七种原生疫病各有三个强度入口；DLC、规则、黑死病及同病冷却仍按实际条件阻止。"
 hd_dc_debug.epidemic.smallpox: "天花"
 hd_dc_debug.epidemic.bubonic_plague: "腺鼠疫"
 hd_dc_debug.epidemic.typhus: "斑疹伤寒"
 hd_dc_debug.epidemic.consumption: "肺痨"
 hd_dc_debug.epidemic.measles: "麻疹"
 hd_dc_debug.epidemic.dysentery: "痢疾"
 hd_dc_debug.epidemic.ergotism: "圣火病"
 hd_dc_debug.epidemic.minor: "轻微"
 hd_dc_debug.epidemic.major: "严重"
 hd_dc_debug.epidemic.apocalyptic: "毁灭性"
 hd_dc_debug.epidemic.intensity: "选择真实疫情强度"
 hd_dc_debug.epidemic.intensity.desc: "已选灾种：[SCOPE.GetFlagName('hd_dc_debug_epidemic_name')]。\n\n三个选项分别对应原生minor、major、apocalyptic。毁灭性腺鼠疫属于黑死病，保留其独立规则、实际已发生状态与当前地图的地理限制；并非所有规则组合都能找到合法发生郡。"
 hd_dc_debug.epidemic.confirm: "确认实际发生的疫情"
 hd_dc_debug.epidemic.confirm.desc: "灾种：[SCOPE.GetFlagName('hd_dc_debug_epidemic_name')]\n强度：[SCOPE.GetFlagName('hd_dc_debug_epidemic_intensity')]\n\n此页已按所选组合检查真实区域郡。只有点击下方确认才实际创建疫情，可能传播、使人物患病或死亡。手动场景不抽取自然D概率，不会修改已有疫情、DLC、规则、经过日期或政治义务。"
 hd_dc_debug.epidemic.create: "确认：在具名郡实际创建所选疫情"
 hd_dc_debug.epidemic.historical_block: "\n#N 本组合被实际地图合同阻止：历史黑死病发生地分支在当前加载的自定义地图中为不可用。因此历史发生规则下不能准备毁灭性腺鼠疫；不会临时改规则或越过1346年/地理限制。#!"
 hd_dc_debug.epidemic.dlc_block: "\n#N 此灾种需要原生legends_of_the_dead功能许可，当前未满足。按钮不会绕过DLC锁。#!"
 hd_dc_debug.epidemic.active_block: "\n#N 原生黑死病正在发生，不能再创建毁灭性腺鼠疫。#!"
 hd_dc_debug.epidemic.never_block: "\n#N 当前规则禁止黑死病，不能创建毁灭性腺鼠疫。#!"
 hd_dc_debug.epidemic.once_block: "\n#N 当前规则只允许黑死病发生一次，且实际已发生标记存在。不会清除此记录再创建。#!"
 hd_dc_debug.faction_scene.populist_county: "\n合格民粹创建郡：[scope:hd_dc_debug_populist_county.GetName]。实际针对你。"
 hd_dc_debug.faction_scene.peasant_county: "\n合格农民创建郡：[scope:hd_dc_debug_peasant_county.GetName]。实际针对你。"
 hd_dc_debug.faction_scene.no_populist: "\n区域中没有通过原生can_title_create_faction的民粹郡：需要真实郡与针对对象满足原生政府、信仰/文化、成员和现存组织约束；不会改宗改文化或抹掉已有起义来凑资格。"
 hd_dc_debug.faction_scene.no_peasant: "\n区域中没有通过原生can_title_create_faction的农民郡：真实郡、针对对象及现存组织约束未满足。可检查原生派系界面，不会直接开战替代创建。"
 hd_dc_debug.faction_scene.populist: "从具名合格郡实际创建民粹派系"
 hd_dc_debug.faction_scene.peasant: "从具名合格郡实际创建农民派系"
 hd_dc_debug.fields.disaster: "\n真实灾害关联编号：[scope:hd_dc_debug_record.Var('hd_dc_disaster_identity').GetValue|0]\n灾种：[scope:hd_dc_debug_record.Var('hd_dc_disaster_type').GetFlagKey]\n本条实际阶段：[scope:hd_dc_debug_record.Var('hd_dc_disaster_stage').GetFlagKey]\n发生与恢复为同一灾害的不同真实流水，恢复记录不代表你已完成任何政治试行。"
 hd_dc_debug.fields.disaster_county: "\n真实受灾中心：[scope:hd_dc_debug_record.Var('hd_dc_disaster_epicenter').Title.GetName]"
 hd_dc_debug.relation_scene: "进入真实家族争端或仇敌事件"
 hd_dc_debug.relation_scene.desc: "只从完整原生入口进入，原事件负责选择实际对象与后续答复。这里不另建随机池，不强行设置奸情、旧怨、绑架成功或关系结果。完成前提后，事件中的具名人物与每个选择都真实改变世界。"
 hd_dc_debug.relation_scene.family: "发起合格的原生伴侣怀疑链"
 hd_dc_debug.relation_scene.family.tt: "调用adultery.0001；原事件选择真实伴侣并对被怀疑者设置原有5年限制，再让你决定是否当面质问。对方否认时才进入已接F的实际怀疑分支；不能替对方选择否认。秘密不实也由原生剧情处理，不杜撰奸情。"
 hd_dc_debug.relation_scene.no_family: "\n家族争端前提不足：你必须在区域内且符合原生年度人物资格、不是轻信者；至少一位身体可行动的成年真实配偶未被近期怀疑，且你多疑，或原生伴侣有淫荡/勾引者特质或真实不忠迹象；信仰不能无惩罚接受通奸。原5年对象冷却不清除。"
 hd_dc_debug.relation_scene.rival: "发起合格的原生仇敌劫走亲友链"
 hd_dc_debug.relation_scene.rival.tt: "调用yearly.1010，由原事件选取实际仇敌、你宫廷中的亲友与追索人。此链可能真实囚禁、受伤、死亡、支付和改变关系；并非绑架阴谋发起率测试。保留原10年发生限制，不代填亲友自愿出走与否或解救结果。"
 hd_dc_debug.relation_scene.no_rival: "\n仇敌事件前提不足：原10年发生标记必须不存在；需成年可行动AI仇敌，有领地或是其领主继承人，且领主存在并非你；你的宫廷须有可行动成年AI配偶/亲属/情人且不与你为仇敌；另需可行动且非重伤的AI军事统帅，或实际猎手营地官职。"
 hd_dc_debug.faction_scene: "真实派系创建与最后通牒"
 hd_dc_debug.faction_scene.desc: "创建按钮复用原生can_create_faction，只有人物、领主、政府与派系资格全部成立才真正建派；不能清除现有派系或强制入派。此为机制检查，NEG-05至07最终创建概率接口仍未闭合。最后通牒需要真实派系已达到原生可发难门槛，不能用直接宣战代替。"
 hd_dc_debug.faction_scene.liege: "\n创建派系的实际针对对象：[ROOT.Char.GetLiege.GetShortUIName]。"
 hd_dc_debug.faction_scene.demand_target: "\n拟向你发送最后通牒的实际领袖：[scope:hd_dc_debug_demand_leader.GetShortUIName]。"
 hd_dc_debug.faction_scene.no_demand: "\n没有可准备的宣称者派系：须真实针对你、领袖/候选/目标头衔仍存在、没有现存战争且没有ROY-08暂停。先通过ROY-01合法建档；本菜单不补造领袖、宣称或头衔。"
 hd_dc_debug.faction_scene.ready: "\n原生当前可发难检查：已通过。切换上方具名领袖，使用派系界面的正式最后通牒按钮，或等原生AI选择。调试不直接派发通牒事件，以保留引擎首次发难状态。"
 hd_dc_debug.faction_scene.not_ready: "\n原生当前可发难检查：未通过。可明确增加实际不满，但力量、日期及其他资格仍需实际满足；不能认为不满增加就已经发难。"
 hd_dc_debug.faction_scene.independence: "实际创建针对当前领主的独立派系"
 hd_dc_debug.faction_scene.liberty: "实际创建针对当前领主的自由派系"
 hd_dc_debug.faction_scene.demand: "准备发难：具名实际派系不满＋25"
 hd_dc_debug.faction_scene.demand.tt: "真实增加该派系25不满，并读取前后数值；不增加军力或伪造日期。不直接调用通牒回调，不添加自造已发送标记。完成准备后重新查看本页资格，再切换领袖从原生派系界面正式发难。"
 hd_dc_debug.region.not_emperor: "\nROY-01／PAR-01入口不合格：你不是当前天子。切换实际天子才可发起，不替换持有者。"
 hd_dc_debug.region.no_royals: "\nROY-01缺少候选：不足两名通过正式宗亲候选检查的真实人物。仍须存活成年自由、同宗有领、原生派系许可及不满；准备菜单只激化已存在合格宗亲，不造领地或宗族。"
 hd_dc_debug.region.no_parties: "\nPAR-01缺少两组真实合格朋党：各组须有至少3名在职成员、有效成年自由党魁、今年仍吻合的成员与实际势力快照，且各自势力至少占20%。不能用两个人互为仇敌代替组织。"
 hd_dc_debug.region.no_affected_county: "\nPAR-01缺少真实可施政受灾郡：须在区域名册内、有真实疫情或灾害情况、为天子的封臣领郡且领主存活自由，没有现存试行或减税占用。可先通过真实场景页准备疫病或灾害，再重新检查。"
 hd_dc_debug.region.no_roy_instance: "\nROY-08缺少正式皇室实例。必须先由ROY-01合法建档形成真实候选派系，再切换能够加入该派系的收件角色。"
 hd_dc_debug.region.outside: "\n你不在王朝循环情况参与者中；人物增量与普通节点不能将区域外角色当作合格角色。"
 hd_dc_debug.scheme_scene: "准备真实谋杀或绑架计谋"
 hd_dc_debug.scheme_scene.desc: "从王朝循环实际参与者中选择通过原生 can_start_scheme 的具名AI目标。点击后实际发起阴谋，成功率、阶段、同谋和结果仍由原生计谋系统决定；不直接杀人或囚禁，不视为AI自动发起危险率抽样。请在阴谋面板查看真实计谋。"
 hd_dc_debug.scheme_scene.murder_target: "\n拟谋杀目标：[scope:hd_dc_debug_murder_target.GetShortUIName]。"
 hd_dc_debug.scheme_scene.abduct_target: "\n拟绑架目标：[scope:hd_dc_debug_abduct_target.GetShortUIName]。"
 hd_dc_debug.scheme_scene.no_murder: "\n没有原生合法谋杀目标：检查人物资格、阴谋名额、已有同目标计谋、冷却、外交范围及亲属限制。只选区域内存活AI，目标不能拥有针对你的强把柄；不会清掉现存阴谋。"
 hd_dc_debug.scheme_scene.no_abduct: "\n没有原生合法绑架目标：行动者必须拥有绑匪技能、营地解锁或相应斗争许可，并为成年自由的可玩统治者；目标不能在囚或为人质，需要实际位置与外交范围，仍检查子女限制、无能和原生冷却/名额。不会添加技能来伪造资格。"
 hd_dc_debug.scheme_scene.murder: "对具名目标实际发起谋杀阴谋"
 hd_dc_debug.scheme_scene.abduct: "对具名目标实际发起绑架阴谋"
 hd_dc_debug.disaster_scene: "准备真实地震或洪灾场景"
 hd_dc_debug.disaster_scene.desc: "下方明确显示将受灾的郡。选择后调用正式原生灾害发生入口，建立真实灾害情况与后续应对。场景显式发生灾害，不等待自然维护抽中；不会修改经过日期、既存政治实例、签署、应对结果或试行期限。此操作不是自然D倍率抽样。"
 hd_dc_debug.disaster_scene.earthquake_target: "\n地震目标：[scope:hd_dc_debug_earthquake_county.GetName]。"
 hd_dc_debug.disaster_scene.flood_target: "\n洪灾目标：[scope:hd_dc_debug_flood_county.GetName]。"
 hd_dc_debug.disaster_scene.no_earthquake: "\n地震缺少合格郡：必须在王朝循环郡名册内、实际发展至少2、位于原生中华地理范围，并且没有正在发生的地震情况。"
 hd_dc_debug.disaster_scene.no_flood: "\n洪灾缺少合格郡：必须在王朝循环郡名册内、实际发展至少2、位于全局洪水区域及已初始化的真实黄河或长江河区，并且该河区没有现存洪灾。不会以改郡修正替代河流。"
 hd_dc_debug.disaster_scene.earthquake: "让具名郡实际发生地震"
 hd_dc_debug.disaster_scene.flood: "让具名郡所在真实河区实际发生洪灾"
 hd_dc_debug.disaster_scene.created: "正式发生入口已返回真实灾害情况，并通过灾害类型回读。请查看地图与灾害情况界面，选择实际应对；PAR准备仍需真实受灾且可施政的封臣郡与真实两党，灾害存在不替代这些条件。"
 hd_dc_debug.disaster_scene.unconfirmed: "正式发生入口没有返回可核验的真实灾害情况，不能报告发生成功。请检查目标地理、发展、现存灾害、初始化和日志。本菜单没有写入受灾修正或伪造应对失败。"
