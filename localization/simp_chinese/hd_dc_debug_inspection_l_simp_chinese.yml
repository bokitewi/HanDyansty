 hd_dc_debug.result.expired: "\n答复期已经届满。"
 hd_dc_debug.result.partial: "\n存在部分履行或未返还账项，应继续查看付款与地方记录。"
 hd_dc_debug.result.verified: "\n两位具名党魁已完成实际核账，当前政策节点已按约结算。"
 hd_dc_debug.result.rejected: "\n地方或党魁已经拒绝；未计作全体履行。"
 hd_dc_debug.result.released: "\n已核验实际释放亲族。"
 hd_dc_debug.result.writing: "\n双方接受并支付后，正在等待具名通信。"
 hd_dc_debug.result.youth_letter: "\n已收到青年的具名答复。"
