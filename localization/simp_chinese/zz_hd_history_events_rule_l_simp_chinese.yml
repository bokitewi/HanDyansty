 # 历史事件 游戏规则（计划 /mnt/project-files/历史事件开关/历史事件开关_计划.md）
 rule_hd_history_events_rule: "历史事件"
 setting_hd_history_events_on: "#high 开启#!"
 setting_hd_history_events_on_desc: "各剧本的史实事件按年份和条件陆续发生，例如灵帝驾崩、讨董联盟、曹丕受禅、钟会伐蜀、淝水之战、刘宋代晋、唐国受禅。"
 setting_hd_history_events_off: "#high 关闭#!"
 setting_hd_history_events_off_desc: "开局局面不变，开局当天的战争（含 184 黄巾起义）照常进行。此后各剧本的史实事件、史实战争、废立禅代、人物来投和史实卒年都不再发生，终结乱世的限制按原定年份解除。五胡乱华、僚人入蜀、衣冠南渡和历史入侵另有各自的规则。"
 hd_hev_window_rule_off: "#X 本局已在游戏规则中关闭历史事件：除开局当天的战争外，各剧本史实事件不再发生；「长线通用」组的五胡、衣冠南渡、僚人入蜀仍按各自规则。#!"
