l_simp_chinese:
 HJ_BattlePoIHistoricalNameChangShao: "长勺之战"
 HJ_BattlePoIHistoricalDescChangShao: "#emp 胜者：鲁国\n败者：齐国\n年代：鲁庄公十年#!\n#weak 鲁军按兵不动，避开齐军初来的锐气，待齐人三通鼓罢、士气衰竭，方才击鼓反攻，以少胜多。\n\n#italic “夫战，勇气也。一鼓作气，再而衰，三而竭。”#!——《春秋左氏传》#!"
 HJ_BattlePoIHistoricalNameChengPu: "城濮之战"
 HJ_BattlePoIHistoricalDescChengPu: "#emp 胜者：晋国\n败者：楚国\n年代：鲁僖公二十八年#!\n#weak 晋文公不忘流亡时对楚王的许诺，两军相遇便退避三舍，诱楚军深入；随后晋军整饬诸军、分击楚师两翼，大破楚军，晋国由此称霸中原。\n\n#italic “元戎十乘，以先启行。”#!——《诗经·小雅·六月》#!"
 HJ_BattlePoIHistoricalNameYanLing: "鄢陵之战"
 HJ_BattlePoIHistoricalDescYanLing: "#emp 胜者：晋国\n败者：楚国\n年代：鲁成公十六年#!\n#weak 晋楚再度争霸，晋军看出楚军中军薄弱，集中兵力突击；楚共王中箭伤目，楚师连夜遁去。\n\n#italic “赳赳武夫，公侯干城。”#!——《诗经·周南·兔罝》#!"
 HJ_BattlePoIHistoricalNameGuiLing: "桂陵之战"
 HJ_BattlePoIHistoricalDescGuiLing: "#emp 胜者：齐国\n败者：魏国\n年代：魏惠王十七年至十八年#!\n#weak 魏军围攻赵都邯郸，孙膑不往邯郸正面解围，转而直趋魏都大梁；待魏军回师自救，齐军在桂陵截击，大破魏军，世人称之为“围魏救赵”。\n\n#italic “驾彼四牡，四牡骙骙。君子所依，小人所腓。”#!——《诗经·小雅·采薇》#!"
 HJ_BattlePoIHistoricalNameYiQue: "伊阙之战"
 HJ_BattlePoIHistoricalDescYiQue: "#emp 胜者：秦国\n败者：韩、魏之师\n年代：秦昭王十四年#!\n#weak 白起避实击虚，先破较弱的韩军，再回师夹击魏军，韩魏之师随即溃散，斩首二十四万。\n\n#italic “操吴戈兮被犀甲，车错毂兮短兵接。”#!——屈原《九歌·国殇》#!"
 HJ_BattlePoIHistoricalNameChangPing: "长平之战"
 HJ_BattlePoIHistoricalDescChangPing: "#emp 胜者：秦国\n败者：赵国\n年代：秦昭王四十七年#!\n#weak 秦赵相持三年，秦军佯败诱敌，截断赵军粮道，将赵军合围于长平。赵卒断粮四十六日，终于降秦，被坑杀者四十余万。\n\n#italic “战城南，死郭北，野死不葬乌可食。”#!——汉乐府《战城南》#!"
 HJ_BattlePoIHistoricalNameZui: "蕞地之战"
 HJ_BattlePoIHistoricalDescZui: "#emp 胜者：秦国\n败者：赵、楚、魏、燕、韩五国之师\n年代：秦王政六年#!\n#weak 五国合纵攻秦，大军深入至蕞地，终因诸侯各怀异心、进退不一而退兵。此后山东诸侯再也无力合纵抗秦。\n\n#italic “击鼓其镗，踊跃用兵。”#!——《诗经·邶风·击鼓》#!"
 HJ_BattlePoIHistoricalNameJuLu: "巨鹿之战"
 HJ_BattlePoIHistoricalDescJuLu: "#emp 胜者：楚军及诸侯之师\n败者：秦军\n年代：秦二世三年#!\n#weak 项羽引兵渡河，沉船破釜，烧毁庐舍，只带三日之粮，以示必死；九战秦军，解巨鹿之围，诸侯将领入辕门拜见时，无不膝行而前，莫敢仰视。\n\n#italic “诚既勇兮又以武，终刚强兮不可凌。”#!——屈原《九歌·国殇》#!"
 HJ_BattlePoIHistoricalNamePengCheng: "彭城之战"
 HJ_BattlePoIHistoricalDescPengCheng: "#emp 胜者：西楚\n败者：汉王及诸侯之师\n年代：汉二年#!\n#weak 汉王趁项羽北击齐国，率诸侯之兵攻入彭城，日日置酒高会。项羽亲率三万精骑疾驰回援，清晨发难，汉军大溃，死者十余万，睢水为之不流。\n\n#italic “力拔山兮气盖世。”#!——项羽《垓下歌》#!"
 HJ_BattlePoIHistoricalNameJingXing: "井陉之战"
 HJ_BattlePoIHistoricalDescJingXing: "#emp 胜者：汉军\n败者：赵军\n年代：汉三年#!\n#weak 韩信背水列阵，使军士无路可退，人人死战；又预先遣轻骑潜入赵营，拔赵旗、立汉家赤帜，赵军大乱，汉军前后夹击，大破赵军。\n\n#italic “出不入兮往不反，平原忽兮路超远。”#!——屈原《九歌·国殇》#!"
 HJ_BattlePoIHistoricalNameGaiXia: "垓下之战"
 HJ_BattlePoIHistoricalDescGaiXia: "#emp 胜者：汉王及诸侯之师\n败者：西楚\n年代：汉五年#!\n#weak 汉军将楚军重重合围，夜间四面皆作楚歌，楚军军心离散；项羽突围南走，至乌江自刎，楚汉之争至此终结。\n\n#italic “时不利兮骓不逝，骓不逝兮可奈何！”#!——项羽《垓下歌》#!"
 HJ_BattlePoIHistoricalNameBaiDeng: "白登之围"
 HJ_BattlePoIHistoricalDescBaiDeng: "#emp 占优者：匈奴\n被围者：汉军\n年代：高皇帝七年#!\n#weak 高皇帝轻兵追击匈奴，被冒顿单于的精骑围困于白登山七日，后用陈平之计方得解围；此后汉家与匈奴和亲，以安北境。\n\n#italic “平城之下亦诚苦，七日不食，不能彀弩。”#!——汉初民谣#!"
 HJ_BattlePoIHistoricalNameHeXi: "河西之战"
 HJ_BattlePoIHistoricalDescHeXi: "#emp 胜者：汉军\n败者：匈奴浑邪王、休屠王部\n年代：孝武皇帝元狩二年#!\n#weak 骠骑将军霍去病一年之内两度出击河西，越过焉支山、深入祁连山，大破匈奴浑邪、休屠诸部；浑邪王率众降汉，朝廷于是在河西开置郡县。\n\n#italic “匈奴未灭，无以家为也。”#!——骠骑将军霍去病语#!"
 HJ_BattlePoIHistoricalNamePanYu: "番禺之战"
 HJ_BattlePoIHistoricalDescPanYu: "#emp 胜者：汉军\n败者：南越\n年代：孝武皇帝元鼎六年#!\n#weak 伏波将军路博德、楼船将军杨仆分路南下，会师围攻番禺；南越都城陷落，岭南从此尽为汉家郡县。\n\n#italic “南有乔木，不可休思；汉有游女，不可求思。”#!——《诗经·周南·汉广》#!"
 HJ_BattlePoIHistoricalNameWangXian: "王险城之战"
 HJ_BattlePoIHistoricalDescWangXian: "#emp 胜者：汉军\n败者：朝鲜王右渠\n年代：孝武皇帝元封三年#!\n#weak 汉军水陆并进，久围王险城不下；城中大臣内变，杀朝鲜王右渠来降，汉家于是在其故地设置郡县。\n\n#italic “江汉汤汤，武夫洸洸。经营四方，告成于王。”#!——《诗经·大雅·江汉》#!"
 HJ_BattlePoIHistoricalNameDaYuan: "大宛之战"
 HJ_BattlePoIHistoricalDescDaYuan: "#emp 胜者：汉军\n败者：大宛\n年代：孝武皇帝太初元年至三年#!\n#weak 贰师将军李广利两度远征大宛，第二次率大军围攻其都城，断绝城中水源；大宛贵人杀其王请降，献出良马。\n\n#italic “天马徕兮从西极，经万里兮归有德。”#!——孝武皇帝《西极天马之歌》#!"
 HJ_BattlePoIHistoricalNameLunTai: "轮台之战"
 HJ_BattlePoIHistoricalDescLunTai: "#emp 胜者：汉军\n败者：轮台\n年代：孝武皇帝太初三年#!\n#weak 第二次征伐大宛途中，轮台闭城，不肯供给汉军，贰师将军攻之数日，屠其城；沿途诸国由是震恐，无不开城供应。\n\n#italic “昔我往矣，黍稷方华。今我来思，雨雪载涂。”#!——《诗经·小雅·出车》#!"
 HJ_BattlePoIHistoricalNameJuShi: "车师之战"
 HJ_BattlePoIHistoricalDescJuShi: "#emp 胜者：汉军及城郭诸国之兵\n败者：车师\n年代：孝宣皇帝地节年间#!\n#weak 郑吉率渠犁屯田的士卒，又征发西域城郭诸国之兵进攻车师，车师王请降，汉家由此打通了天山南北的道路。\n\n#italic “岂曰无衣？与子同袍。王于兴师，修我戈矛。”#!——《诗经·秦风·无衣》#!"
 HJ_BattlePoIHistoricalNameZhiZhi: "郅支城之战"
 HJ_BattlePoIHistoricalDescZhiZhi: "#emp 胜者：汉军及西域诸国之兵\n败者：郅支单于\n年代：孝元皇帝建昭三年#!\n#weak 西域副校尉陈汤与都护甘延寿矫诏发兵，远袭康居境内的郅支城，破城斩郅支单于，传首京师，郅支在西域的势力就此覆灭。\n\n#italic “明犯强汉者，虽远必诛！”#!——陈汤上疏#!"
 HJ_BattlePoIHistoricalNameKunYang: "昆阳之战"
 HJ_BattlePoIHistoricalDescKunYang: "#emp 胜者：汉军\n败者：王莽军\n年代：更始元年#!\n#weak 光武皇帝率三千敢死之士冲击王莽大军的中坚，昆阳守军同时出城夹击；莽军主帅王寻战死，号称百万的大军随即溃散。\n\n#italic “殷商之旅，其会如林。矢于牧野，维予侯兴。”#!——《诗经·大雅·大明》#!"
 HJ_BattlePoIHistoricalNameLangBo: "浪泊之战"
 HJ_BattlePoIHistoricalDescLangBo: "#emp 胜者：汉军\n败者：征侧、征贰\n年代：光武皇帝建武十八年#!\n#weak 伏波将军马援率军至浪泊，击破征侧、征贰的主力，继而追剿余众，交趾之乱遂平。\n\n#italic “男儿要当死于边野，以马革裹尸还葬耳。”#!——伏波将军马援语#!"
 HJ_BattlePoIHistoricalNameYiWuLu: "伊吾卢之战"
 HJ_BattlePoIHistoricalDescYiWuLu: "#emp 胜者：汉军\n败者：北匈奴\n年代：孝明皇帝永平十六年#!\n#weak 奉车都尉窦固、副将耿忠出酒泉塞，击败北匈奴呼衍王，夺取伊吾卢之地，设置宜禾都尉屯田，汉家由此重返西域。\n\n#italic “大丈夫无它志略，犹当效傅介子、张骞立功异域。”#!——班超语#!"
 HJ_BattlePoIHistoricalNameTianShan: "天山之战"
 HJ_BattlePoIHistoricalDescTianShan: "#emp 胜者：汉军\n败者：北匈奴呼衍王部\n年代：孝明皇帝永平十六年#!\n#weak 窦固率军出酒泉，在天山击破北匈奴呼衍王部，一路追至蒲类海，为汉家重返西域打开了道路。\n\n#italic “显允方叔，征伐猃狁，蛮荆来威。”#!——《诗经·小雅·采芑》#!"
 HJ_BattlePoIHistoricalNameShuLe: "疏勒城保卫战"
 HJ_BattlePoIHistoricalDescShuLe: "#emp 守方：戊己校尉耿恭\n攻方：北匈奴及车师之兵\n年代：孝明皇帝永平十八年#!\n#weak 耿恭率孤军坚守疏勒城，匈奴断绝涧水，城中掘井十五丈仍不得水，耿恭整衣向井再拜，泉水竟奔涌而出。被围经年，援军终至，随他东归玉门的只剩十三人。\n\n#italic “闻昔贰师将军拔佩刀刺山，飞泉涌出；今汉德神明，岂有穷哉！”#!——耿恭语#!"
