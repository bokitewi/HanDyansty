l_simp_chinese:
 HJ_BattlePoIHistoricalNameChangShao: "长勺之战"
 HJ_BattlePoIHistoricalDescChangShao: "#emp 胜者：鲁国\n败者：齐国\n年代：公元前684年#!\n#weak 鲁军避开齐军初锐，待其再三击鼓、士气衰竭之后反攻，以少胜多。\n\n#italic “岂曰无衣？与子同袍。王于兴师，修我戈矛。”#!——《诗经·秦风·无衣》#!"
 HJ_BattlePoIHistoricalNameChengPu: "城濮之战"
 HJ_BattlePoIHistoricalDescChengPu: "#emp 胜者：晋国\n败者：楚国\n年代：公元前632年#!\n#weak 晋文公践诺退避三舍，诱楚军深入；晋军整饬诸军、分击楚翼，奠定晋国中原霸业。\n\n#italic “元戎十乘，以先启行。”#!——《诗经·小雅·六月》#!"
 HJ_BattlePoIHistoricalNameYanLing: "鄢陵之战"
 HJ_BattlePoIHistoricalDescYanLing: "#emp 胜者：晋国\n败者：楚国\n年代：公元前575年#!\n#weak 晋楚争霸再起，晋军窥得楚军中军薄弱之处，集中兵力突击；楚共王中箭负伤，楚师夜遁。\n\n#italic “赳赳武夫，公侯干城。”#!——《诗经·周南·兔罝》#!"
 HJ_BattlePoIHistoricalNameGuiLing: "桂陵之战"
 HJ_BattlePoIHistoricalDescGuiLing: "#emp 胜者：齐国\n败者：魏国\n年代：公元前354年至前353年#!\n#weak 孙膑不赴邯郸正面解围，而攻魏都大梁、伏击回援魏军，以“围魏救赵”名垂兵史。\n\n#italic “驾彼四牡，四牡骙骙。君子所依，小人所腓。”#!——《诗经·小雅·采薇》#!"
 HJ_BattlePoIHistoricalNameYiQue: "伊阙之战"
 HJ_BattlePoIHistoricalDescYiQue: "#emp 胜者：秦国\n败者：韩魏联军\n年代：公元前293年#!\n#weak 白起避实击虚，先破较弱的韩军，再回师夹击魏军，韩魏联军遂告崩溃。\n\n#italic “操吴戈兮被犀甲，车错毂兮短兵接。”#!——屈原《九歌·国殇》#!"
 HJ_BattlePoIHistoricalNameChangPing: "长平之战"
 HJ_BattlePoIHistoricalDescChangPing: "#emp 胜者：秦国\n败者：赵国\n年代：公元前260年#!\n#weak 秦赵相持三年，秦军佯败诱敌、截断赵军粮道，最终合围赵军；此役成为战国最惨烈的决战之一。\n\n#italic “战城南，死郭北，野死不葬乌可食。”#!——汉乐府《战城南》#!"
 HJ_BattlePoIHistoricalNameZui: "蕞地之战"
 HJ_BattlePoIHistoricalDescZui: "#emp 胜者：秦国\n败者：赵楚魏韩燕联军\n年代：公元前241年#!\n#weak 五国合纵攻秦，联军深入至蕞地，终因诸侯异心、协同不济而退，这是战国最后一次大规模合纵。\n\n#italic “击鼓其镗，踊跃用兵。”#!——《诗经·邶风·击鼓》#!"
 HJ_BattlePoIHistoricalNameJuLu: "巨鹿之战"
 HJ_BattlePoIHistoricalDescJuLu: "#emp 胜者：楚军及诸侯联军\n败者：秦军\n年代：公元前207年#!\n#weak 项羽渡河后破釜沉舟，只携三日粮，九战秦军，解巨鹿之围并摧折秦军主力。\n\n#italic “诚既勇兮又以武，终刚强兮不可凌。”#!——屈原《九歌·国殇》#!"
 HJ_BattlePoIHistoricalNamePengCheng: "彭城之战"
 HJ_BattlePoIHistoricalDescPengCheng: "#emp 胜者：西楚\n败者：汉军诸侯联军\n年代：公元前205年#!\n#weak 项羽率精骑疾驰回援，以少击众，乘汉军宴饮松懈之际突袭彭城，刘邦仓促败走。\n\n#italic “力拔山兮气盖世。”#!——项羽《垓下歌》#!"
 HJ_BattlePoIHistoricalNameJingXing: "井陉之战"
 HJ_BattlePoIHistoricalDescJingXing: "#emp 胜者：汉军\n败者：赵军\n年代：公元前204年#!\n#weak 韩信背水列阵，使军士无退路而奋战；另遣轻骑夺取赵营，前后夹击，大破赵军。\n\n#italic “出不入兮往不反，平原忽兮路超远。”#!——屈原《九歌·国殇》#!"
 HJ_BattlePoIHistoricalNameGaiXia: "垓下之战"
 HJ_BattlePoIHistoricalDescGaiXia: "#emp 胜者：汉军诸侯联军\n败者：西楚\n年代：公元前202年#!\n#weak 汉军重重合围楚军，夜闻四面楚歌，楚军军心离散；项羽突围至乌江而亡，楚汉战争至此终结。\n\n#italic “时不利兮骓不逝，骓不逝兮可奈何！”#!——项羽《垓下歌》#!"
 HJ_BattlePoIHistoricalNameBaiDeng: "白登之围"
 HJ_BattlePoIHistoricalDescBaiDeng: "#emp 占优者：匈奴\n被围者：汉军\n年代：公元前200年#!\n#weak 刘邦轻进追敌，被冒顿单于骑兵围困白登七日，最终以计解围；此后汉廷转而以和亲缓和北境。\n\n#italic “胡马依北风，越鸟巢南枝。”#!——《古诗十九首·行行重行行》#!"
 HJ_BattlePoIHistoricalNameHeXi: "河西之战"
 HJ_BattlePoIHistoricalDescHeXi: "#emp 胜者：汉军\n败者：匈奴浑邪、休屠部\n年代：公元前121年#!\n#weak 霍去病两度出击河西，穿越焉支、祁连之间，击破匈奴诸部，使汉朝得以经营河西走廊。\n\n#italic “燕支黄叶落，妾望自登台。”#!——李白《秋思》#!"
 HJ_BattlePoIHistoricalNamePanYu: "番禺之战"
 HJ_BattlePoIHistoricalDescPanYu: "#emp 胜者：汉军\n败者：南越国\n年代：公元前111年#!\n#weak 路博德、杨仆等分路南下，会师围攻番禺；南越都城陷落，岭南遂纳入汉朝郡县。\n\n#italic “南有乔木，不可休思；汉有游女，不可求思。”#!——《诗经·周南·汉广》#!"
 HJ_BattlePoIHistoricalNameWangXian: "王险城之战"
 HJ_BattlePoIHistoricalDescWangXian: "#emp 胜者：汉军\n败者：卫氏朝鲜\n年代：公元前108年#!\n#weak 汉军水陆并进，久围王险城；城中贵族内变后城破，汉朝随后在其故地设置郡县。\n\n#italic “渡辽水，此去咸阳五千里。”#!——王建《渡辽水》#!"
 HJ_BattlePoIHistoricalNameDaYuan: "大宛之战"
 HJ_BattlePoIHistoricalDescDaYuan: "#emp 胜者：汉军\n败者：大宛\n年代：公元前104年至前102年#!\n#weak 李广利两度远征大宛，第二次率军围攻贰师城，断绝水源，迫使大宛交出良马并求和。\n\n#italic “天马徕兮从西极，经万里兮归有德。”#!——汉武帝《西极天马之歌》#!"
 HJ_BattlePoIHistoricalNameLunTai: "轮台之战"
 HJ_BattlePoIHistoricalDescLunTai: "#emp 胜者：汉军\n败者：轮台守军\n年代：公元前102年#!\n#weak 第二次大宛远征途中，轮台拒绝向汉军供给，李广利攻破其城，以此震慑沿途诸国。\n\n#italic “轮台九月风夜吼，一川碎石大如斗。”#!——岑参《走马川行奉送封大夫出师西征》#!"
 HJ_BattlePoIHistoricalNameJuShi: "车师之战"
 HJ_BattlePoIHistoricalDescJuShi: "#emp 胜者：汉及乌孙联军\n败者：车师\n年代：公元前67年#!\n#weak 郑吉率屯田兵并联合西域诸国进攻车师，车师王降汉，汉朝由此加强了对天山南北交通的控制。\n\n#italic “大漠风尘日色昏，红旗半卷出辕门。”#!——王昌龄《从军行》#!"
 HJ_BattlePoIHistoricalNameZhiZhi: "郅支城之战"
 HJ_BattlePoIHistoricalDescZhiZhi: "#emp 胜者：汉及西域联军\n败者：郅支单于\n年代：公元前36年#!\n#weak 陈汤、甘延寿矫制发兵，远袭康居境内郅支城；联军破城斩郅支单于，结束其在西域的扩张。\n\n#italic “大漠孤烟直，长河落日圆。”#!——王维《使至塞上》#!"
 HJ_BattlePoIHistoricalNameKunYang: "昆阳之战"
 HJ_BattlePoIHistoricalDescKunYang: "#emp 胜者：绿林汉军\n败者：新朝军\n年代：公元23年#!\n#weak 刘秀率少数援军突击新军中坚，昆阳守军同时出城夹击；新军主帅王寻战死，号称百万的大军随即溃散。\n\n#italic “白水真人居，万商罗鄽闤。”#!——李白《南都行》#!"
 HJ_BattlePoIHistoricalNameLangBo: "浪泊之战"
 HJ_BattlePoIHistoricalDescLangBo: "#emp 胜者：东汉军\n败者：二征起义军\n年代：公元42年#!\n#weak 马援率军在浪泊击破征侧、征贰主力，继而进军麋泠；交趾叛乱最终被东汉平定。\n\n#italic “伏波惟愿裹尸还，定远何须生入关。”#!——李益《塞下曲》#!"
 HJ_BattlePoIHistoricalNameYiWuLu: "伊吾卢之战"
 HJ_BattlePoIHistoricalDescYiWuLu: "#emp 胜者：东汉军\n败者：北匈奴守军\n年代：公元73年#!\n#weak 窦固、耿忠出酒泉，击败呼衍王并夺取伊吾卢，设置宜禾都尉，东汉由此重新踏入西域。\n\n#italic “愿将腰下剑，直为斩楼兰。”#!——李白《塞下曲》#!"
 HJ_BattlePoIHistoricalNameTianShan: "天山之战"
 HJ_BattlePoIHistoricalDescTianShan: "#emp 胜者：东汉军\n败者：北匈奴军\n年代：公元73年#!\n#weak 窦固率军出酒泉，在天山击破北匈奴呼衍王部，追至蒲类海，为东汉重返西域打开道路。\n\n#italic “明月出天山，苍茫云海间。”#!——李白《关山月》#!"
 HJ_BattlePoIHistoricalNameShuLe: "疏勒城保卫战"
 HJ_BattlePoIHistoricalDescShuLe: "#emp 守方：东汉疏勒守军\n攻方：北匈奴及焉耆联军\n年代：公元75年#!\n#weak 耿恭率孤军坚守疏勒城，以毒箭和少量粮水抵抗长期围攻，最终等到援军并率残部东归。\n\n#italic “黄沙百战穿金甲，不破楼兰终不还。”#!——王昌龄《从军行》#!"
