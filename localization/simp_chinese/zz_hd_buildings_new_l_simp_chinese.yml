l_simp_chinese:
 # 2026-10-09 从旧版原版副本 buildings_l_simp_chinese.yml 拆出的 mod 新增建筑键
 building_type_Storehouse_01: "粮仓"
 building_type_Storehouse_01_desc: "积储粮谷的仓廪。仓廪实而知礼节，一地有了余粮，方能养兵济民，从容应对水旱兵荒。"
 building_Storehouse_01: "地下窖"
 building_Storehouse_01_desc: "就地掘土为窖，以火烧烤坑壁，使之坚实干燥，再铺上草席与谷糠，谷物藏于其中，可经年不坏。"
 building_Storehouse_02: "地下仓"
 building_Storehouse_02_desc: "窖穴越掘越深越广，口小腹大，上覆土木，一窖所藏便足供一乡之食。"
 building_Storehouse_03: "储藏分类"
 building_Storehouse_03_desc: "仓中开始分门别类：粟麦入窖，菽豆入囷，干肉、腌菜与盐另置别室，各有仓吏看守登记。"
 building_Storehouse_04: "地下仓群"
 building_Storehouse_04_desc: "此地粮食丰足，城外掘出成片的窖穴，排列整齐，由仓吏按簿籍出纳。"
 building_Storehouse_05: "地上仓库"
 building_Storehouse_05_desc: "地下窖穴已不敷使用，于是在高燥之处筑起廪仓，夯土为基，架木为屋，四壁开窗通风，仓中谷物堆积如山。"
 building_Storehouse_06: "资源储存"
 building_Storehouse_06_desc: "除了粮食，盐铁、布帛、薪炭、刍藁等物也需收储，官府增建库房，分类藏纳，以备不时之需。"
 building_Storehouse_07: "巨型仓库"
 building_Storehouse_07_desc: "城中富足，粮食与百货多有盈余，于是修筑起宏大的仓城，墙垣环绕，仓房成列，望之如同一座小城。"
 building_Storehouse_08: "储藏综合体"
 building_Storehouse_08_desc: "仓城规模宏大，足以与京师的太仓相比。窖口以草泥层层封固，所藏之粟陈陈相因，历数十年而不腐。"
 building_type_swahili_port_pembas: "$building_swahili_port_pemba$"
