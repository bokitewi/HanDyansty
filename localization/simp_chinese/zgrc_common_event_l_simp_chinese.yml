l_simp_chinese:
 # ============================================================
 # 事件：入乡随俗
 # ============================================================
 zgrc_common.0002.t:0 "入乡随俗"
 zgrc_common.0002.desc:0 "你客居此地已有多年，饮食起居、言谈腔调，不知不觉间都染上了本地的风气。故乡的口音与旧俗，如今还剩下几分？"
 zgrc_common.0002.a:0 "入乡随俗，从其土风。"
 zgrc_common.0002.b:0 "安土重迁，不改故俗。"

 # ============================================================
 # 事件：天下响应 —— 非常时期封臣表态（1010）
 # ============================================================
 zgrc_common.1010.t:0 "天下响应"
 zgrc_common.1010.desc_foreign:0 "外寇举倾国之众犯境，烽燧连天，兵锋直指[ROOT.Char.GetTopLiege.GetName]的社稷。\n\n你世受国恩，封土于此。檄书传到时，乡中父老已聚在门外，都在等你拿个主意。"
 zgrc_common.1010.desc_civil:0 "同是华夏衣冠，如今却同室操戈。来犯者兵锋直指[ROOT.Char.GetTopLiege.GetName]的社稷，争的是天命谁属。\n\n你世受国恩，封土于此。檄书传到时，乡中父老已聚在门外，都在等你拿个主意。"
 zgrc_common.1010.a:0 "散家财，起乡勇，即刻勤王！"
 zgrc_common.1010.a_locked:0 "家无余财，勤王无资。"
 zgrc_common.1010.b:0 "王侯将相，宁有种乎？"
 zgrc_common.1010.b_locked:0 "兵微地远，举义无凭。"
 zgrc_common.1010.c:0 "兵凶战危，且观其变。"
 zgrc_common.2001.t:0 "义军来投"
 zgrc_common.2001.desc:0 "此战所争，本是汉家故土。消息传开，当地义民纷纷揭竿来附，愿为前驱，共复旧疆。\n\n义军的头领已候在帐外，听你发落。"
 zgrc_common.2001.a:0 "且随军前驱，事毕归乡。"
 zgrc_common.2001.b:0 "厚给粮饷，编入行伍。"
 zgrc_common.2001.c:0 "温言抚慰，遣归乡里。"
 # 民粹/农民战争直接来投的事件兵军队名
 zgrc_yijun_army_name:0 "乡勇义军"

 # ============================================================
 # 传言系统 —— 旅行听闻（3001-3004）
 # ============================================================
 # 3001 美名·忠义传闻
 zgrc_common.3001.t:0 "义声入耳"
 zgrc_common.3001.desc:0 "你行经[ROOT.Var('zgrc_wen_county').Title.GetName]，道旁的乡老拉着你说起旧事：当年兵戈骤起，[zgrc_wen_hero.GetName]散尽家财，招募乡勇，赶去赴君父之难。邑中百姓至今传颂此人的义举。"
 zgrc_common.3001.desc_late:0 "你行经[ROOT.Var('zgrc_wen_county').Title.GetName]，道旁的乡老拉着你说起旧事：当年兵戈骤起，[zgrc_wen_hero.GetName]散尽家财，招募乡勇，赶去赴君父之难。如今此人坟上的树都已合抱，乡人说起这段义举，仍不免肃然起敬。"
 zgrc_common.3001.a:0 "捐资立祠，以旌忠烈。"
 zgrc_common.3001.a_renew:0 "续捐香火，以光前贤。"
 zgrc_common.3001.b:0 "礼敬其贤，心向往之。"
 zgrc_common.3001.c:0 "行路匆匆，不以为意。"
 # 3002 美名·仁德传闻
 zgrc_common.3002.t:0 "仁声入耳"
 zgrc_common.3002.desc:0 "你行经[ROOT.Var('zgrc_wen_county').Title.GetName]，乡人在道旁说起旧事：当年义军过境，[zgrc_wen_hero.GetName]没有驱他们去阵前送死，而是好言抚慰，遣归乡里，保全了一方百姓。乡人至今感念此人的恩德。"
 zgrc_common.3002.desc_late:0 "你行经[ROOT.Var('zgrc_wen_county').Title.GetName]，乡人在道旁说起旧事：当年义军过境，[zgrc_wen_hero.GetName]没有驱他们去阵前送死，而是好言抚慰，遣归乡里，保全了一方百姓。如今斯人已逝，乡人说起来，还会落泪。"
 zgrc_common.3002.a:0 "捐资立祠，以彰仁德。"
 zgrc_common.3002.a_renew:0 "续捐香火，以光前贤。"
 zgrc_common.3002.b:0 "礼敬其贤，心向往之。"
 zgrc_common.3002.c:0 "行路匆匆，不以为意。"
 # 3003 恶名·野心传闻
 zgrc_common.3003.t:0 "逆耳之言"
 zgrc_common.3003.desc:0 "你行经[ROOT.Var('zgrc_wen_county').Title.GetName]，听见里巷中有人压低了声音议论：当年天下有变，[zgrc_wen_hero.GetName]不思报国，反倒趁乱背主，举旗自立，与来犯者合兵一处。说话的人不时四下张望，听的人个个心惊。"
 zgrc_common.3003.desc_late:0 "你行经[ROOT.Var('zgrc_wen_county').Title.GetName]，听见里巷中有人压低了声音议论：当年天下有变，[zgrc_wen_hero.GetName]不思报国，反倒趁乱背主，举旗自立，与来犯者合兵一处。此人虽早已化作枯骨，乡人提起来，仍恨得咬牙切齿。"
 zgrc_common.3003.a:0 "捐资铸其罪像，以警来者。"
 zgrc_common.3003.a_renew:0 "续修罪像，长警后人。"
 zgrc_common.3003.b:0 "广而告之，一吐为快。"
 zgrc_common.3003.c:0 "事不关己，不足为虑。"
 # 3004 恶名·附逆传闻
 zgrc_common.3004.t:0 "遗臭之闻"
 zgrc_common.3004.desc:0 "你行经[ROOT.Var('zgrc_wen_county').Title.GetName]，父老指着一片废墟告诉你：当年外寇入境，[zgrc_wen_hero.GetName]甘为前驱，引兵残害桑梓。乡人至今恨不得食其肉。"
 zgrc_common.3004.desc_late:0 "你行经[ROOT.Var('zgrc_wen_county').Title.GetName]，父老指着一片废墟告诉你：当年外寇入境，[zgrc_wen_hero.GetName]甘为前驱，引兵残害桑梓。如今此人坟上的树都已合抱，乡人路过那座坟垄，仍要啐上一口。"
 zgrc_common.3004.a:0 "捐资铸像，使千载共唾。"
 zgrc_common.3004.a_renew:0 "续修此像，使其遗臭万年。"
 zgrc_common.3004.b:0 "广而告之，一泄心头之恨。"
 zgrc_common.3004.c:0 "行路匆匆，只当耳旁风。"

 # 大复仇：亲属得知凶手后的抉择
 zgrc_common.4001.t:0 "悲报传来"
 zgrc_common.4001.desc:0 "噩耗传来——你的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('zgrc_victim'))][zgrc_victim.GetName]死于非命，凶手便是那[zgrc_killer.GetName]。\n\n九世之仇尚且要报，何况至亲之痛？"
 zgrc_common.4001.a:0 "此仇不报，誓不为人！"
 zgrc_common.4001.b:0 "含垢忍辱，此恨深埋。"
