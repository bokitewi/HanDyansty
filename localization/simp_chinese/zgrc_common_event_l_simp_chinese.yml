l_simp_chinese:
 # ============================================================
 # 事件：入乡随俗
 # ============================================================
 zgrc_common.0002.t:0 "入乡随俗"
 zgrc_common.0002.desc:0 "久居此地，风土人情已渐染此身。乡音故俗，尚留几分？"
 zgrc_common.0002.a:0 "入乡随俗，改从当地风俗"
 zgrc_common.0002.b:0 "安土重迁，保留故俗"

 # ============================================================
 # 事件：天下响应 —— 非常时期封臣表态（1010）
 # ============================================================
 zgrc_common.1010.t:0 "天下响应"
 zgrc_common.1010.desc_foreign:0 "[ROOT.Char.GetLiege.GetName]的社稷危在旦夕。胡骑叩关，烽燧连天，来犯者举倾国之众压境，直指汉家山河。\n\n[ROOT.Char.GetName]，你封土于此，世代食汉之禄。是执戈勤王，是另立义旗，还是闭门自守？"
 zgrc_common.1010.desc_civil:0 "[ROOT.Char.GetLiege.GetName]的社稷危在旦夕。同为汉家衣冠，却已同室操戈——兵戈相问，争的是天命谁属。\n\n[ROOT.Char.GetName]，你封土于此，世代食汉之禄。是执戈勤王，是另立义旗，还是闭门自守？"
 zgrc_common.1010.a:0 "散家财，起乡勇，即刻勤王！"
 zgrc_common.1010.a_locked:0 "勤王（家资不足以散财募勇）"
 zgrc_common.1010.b:0 "王侯将相，宁有种乎？"
 zgrc_common.1010.b_locked:0 "举义（本钱不足，或战火未及）"
 zgrc_common.1010.c:0 "兵凶战危，且观其变。"
 zgrc_common.2001.t:0 "义军来投"
 zgrc_common.2001.desc:0 "此战所图，皆汉家故土。义民闻风来附，愿为前驱，共复汉家山河。面对这支义军你该如何处理？"
 zgrc_common.2001.a:0 "当为我之助力！"
 zgrc_common.2001.b:0 "收留来投义军，编入麾下！"
 zgrc_common.2001.c:0 "温言安抚，让他们安居乡里。"
 # 民粹/农民战争直接来投的事件兵军队名
 zgrc_yijun_army_name:0 "乡勇义军"

 # ============================================================
 # 传言系统 —— 旅行听闻（3001-3004）
 # ============================================================
 # 3001 美名·忠义传闻
 zgrc_common.3001.t:0 "义声入耳"
 zgrc_common.3001.desc:0 "行过[ROOT.Var('zgrc_wen_county').Title.GetName]，乡老于道旁相告：昔年兵戈骤起，[ROOT.Var('zgrc_wen_county').Var('zgrc_wen_hero_zhongyi').Char.GetName]散家财、起乡勇，以赴君父之难。邑人至今颂之。"
 zgrc_common.3001.desc_late:0 "行过[ROOT.Var('zgrc_wen_county').Title.GetName]，乡老于道旁相告：昔年兵戈骤起，[ROOT.Var('zgrc_wen_county').Var('zgrc_wen_hero_zhongyi').Char.GetName]散家财、起乡勇，以赴君父之难。墓木已拱，而乡人道其义事，犹肃然起敬。"
 zgrc_common.3001.a:0 "捐资倡修忠烈之祠"
 zgrc_common.3001.a_renew:0 "续捐香火，以光前贤"
 zgrc_common.3001.b:0 "礼敬其贤，心向往之"
 zgrc_common.3001.c:0 "行路匆匆，不以为意"
 # 3002 美名·仁德传闻
 zgrc_common.3002.t:0 "仁声入耳"
 zgrc_common.3002.desc:0 "行过[ROOT.Var('zgrc_wen_county').Title.GetName]，乡人于道旁相告：昔年义军过境，[ROOT.Var('zgrc_wen_county').Var('zgrc_wen_hero_rende').Char.GetName]温言抚遣，不驱锋镝，全活一方。乡人至今感其德。"
 zgrc_common.3002.desc_late:0 "行过[ROOT.Var('zgrc_wen_county').Title.GetName]，乡人于道旁相告：昔年义军过境，[ROOT.Var('zgrc_wen_county').Var('zgrc_wen_hero_rende').Char.GetName]温言抚遣，不驱锋镝，全活一方。斯人已逝，乡人言之犹泣下。"
 zgrc_common.3002.a:0 "捐资倡修怀仁之祠"
 zgrc_common.3002.a_renew:0 "续捐香火，以光前贤"
 zgrc_common.3002.b:0 "礼敬其贤，心向往之"
 zgrc_common.3002.c:0 "行路匆匆，不以为意"
 # 3003 恶名·野心传闻
 zgrc_common.3003.t:0 "逆耳之言"
 zgrc_common.3003.desc:0 "行过[ROOT.Var('zgrc_wen_county').Title.GetName]，里巷私语入耳：[ROOT.Var('zgrc_wen_county').Var('zgrc_wen_hero_yexin').Char.GetName]久怀不臣，阴养死士，志在非分。言者四顾，闻者心惊。"
 zgrc_common.3003.desc_late:0 "行过[ROOT.Var('zgrc_wen_county').Title.GetName]，里巷私语入耳：[ROOT.Var('zgrc_wen_county').Var('zgrc_wen_hero_yexin').Char.GetName]久怀不臣，阴养死士，志在非分。斯人已朽，乡人说起来仍恨得牙痒。"
 zgrc_common.3003.a:0 "捐资倡铸铁罪之像，使过者知警"
 zgrc_common.3003.a_renew:0 "续捐其像，使恶名长警后人"
 zgrc_common.3003.b:0 "广而告之，使世人共知其所为"
 zgrc_common.3003.c:0 "事不关己，不足为虑"
 # 3004 恶名·附逆传闻
 zgrc_common.3004.t:0 "遗臭之闻"
 zgrc_common.3004.desc:0 "行过[ROOT.Var('zgrc_wen_county').Title.GetName]，父老指墟里相告：胡骑之至也，[ROOT.Var('zgrc_wen_county').Var('zgrc_wen_hero_funi').Char.GetName]为之前驱，桑梓受其荼毒。乡人至今唾之，恨不食其肉。"
 zgrc_common.3004.desc_late:0 "行过[ROOT.Var('zgrc_wen_county').Title.GetName]，父老指墟里相告：胡骑之至也，[ROOT.Var('zgrc_wen_county').Var('zgrc_wen_hero_funi').Char.GetName]为之前驱，桑梓受其荼毒。墓木虽拱，乡人过其垄犹唾之。"
 zgrc_common.3004.a:0 "捐资倡铸唾逆之像，使千载共唾"
 zgrc_common.3004.a_renew:0 "续捐其像，使遗臭万年"
 zgrc_common.3004.b:0 "广而告之，使世人共弃之"
 zgrc_common.3004.c:0 "行路匆匆，只当耳旁风"

