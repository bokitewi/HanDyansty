l_simp_chinese:
 # ============================================================
 # 事件：入乡随俗
 # ============================================================
 zgrc_common.0002.t:0 "入乡随俗"
 zgrc_common.0002.desc:0 "久居此地，风土人情已渐染此身。乡音故俗，尚留几分？"
 zgrc_common.0002.a:0 "入乡随俗，改从当地风俗"
 zgrc_common.0002.b:0 "安土重迁，保留故俗"
 # ============================================================
 # 事件：厚生慎死·极端爆发（非常时期人物响应）
 # ============================================================
 zgrc_common.1001.t:0 "四方民变"
 zgrc_common.1001.desc:0 "[Root.Liege.GetName]的治下民变蜂起，四方响应。乱世将至，[Root.GetName]，你将如何自处？"
 zgrc_common.1001.a:0 "食君之禄，忠君之事，即刻勤王！"
 zgrc_common.1001.b:0 "王侯将相，宁有种乎？"
 zgrc_common.1001.c:0 "事不关己，静观其变。"

 zgrc_common.1002.t:0 "苗越作乱"
 zgrc_common.1002.desc:0 "苗、越土司蜂起作乱，[Root.Liege.GetName]的疆土为之震动。[Root.GetName]，你将如何自处？"
 zgrc_common.1002.a:0 "保境安民，即刻勤王！"
 zgrc_common.1002.b:0 "王侯将相，宁有种乎？"
 zgrc_common.1002.c:0 "事不关己，静观其变。"

 zgrc_common.1003.t:0 "蛮夷犯境"
 zgrc_common.1003.desc:0 "[Root.Liege.GetName]的疆土正遭蛮夷进犯，声索王爵之重。国难当头，[Root.GetName]，你将如何自处？"
 zgrc_common.1003.a:0 "我世代食汉禄，不敢背义！"
 zgrc_common.1003.b:0 "王侯将相，宁有种乎？"
 zgrc_common.1003.c:0 "事不关己，静观其变。"

 zgrc_common.1004.t:0 "宗室之乱"
 zgrc_common.1004.desc:0 "同宗藩王兴兵犯上，直指[Root.Liege.GetName]。宗庙当前，[Root.GetName]，你将如何自处？"
 zgrc_common.1004.a:0 "卫护宗庙，即刻勤王！"
 zgrc_common.1004.b:0 "王侯将相，宁有种乎？"
 zgrc_common.1004.c:0 "事不关己，静观其变。"

 zgrc_common.1005.t:0 "诸侯犯上"
 zgrc_common.1005.desc:0 "诸侯兴兵犯上，天下震动，直指[Root.Liege.GetName]。天命之争，[Root.GetName]，你将如何自处？"
 zgrc_common.1005.a:0 "尊王攘夷，即刻勤王！"
 zgrc_common.1005.b:0 "王侯将相，宁有种乎？"
 zgrc_common.1005.c:0 "事不关己，静观其变。"

 zgrc_common.1006.t:0 "义旗遍野"
 zgrc_common.1006.desc:0 "汉家豪杰聚义而起，红巾遍野，直指[Root.Liege.GetName]。大乱将至，[Root.GetName]，你将何去何从？"
 zgrc_common.1006.a:0 "食君之禄，忠君之事。"
 zgrc_common.1006.b:0 "驱除鞑虏，恢复中华！"
 zgrc_common.1006.c:0 "静观其变。"

 zgrc_common.2001.t:0 "义军来投"
 zgrc_common.2001.desc:0 "此战所图，皆汉家故土。义民闻风来附，愿为前驱，共复汉家山河。面对这支义军你该如何处理？"
 zgrc_common.2001.a:0 "当为我之助力！"
 zgrc_common.2001.b:0 "收留来投义军，编入麾下！"
 zgrc_common.2001.c:0 "温言安抚，让他们安居乡里。"
 # 民粹/农民战争直接来投的事件兵军队名
 zgrc_yijun_army_name:0 "乡勇义军"
