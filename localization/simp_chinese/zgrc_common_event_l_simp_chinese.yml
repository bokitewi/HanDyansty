l_simp_chinese:
 # ============================================================
 # 事件：入乡随俗
 # ============================================================
 zgrc_common.0002.t:0 "入乡随俗"
 zgrc_common.0002.desc:0 "你客居此地已有多年，饮食起居、言谈腔调，不知不觉间都染上了本地的风气。故乡的口音与旧俗，如今还剩下几分？"
 zgrc_common.0002.a:0 "入乡随俗，从其土风。"
 zgrc_common.0002.b:0 "安土重迁，不改故俗。"

 # ============================================================
 # 事件：天下响应 —— 非常时期封臣表态（1010）
 # ============================================================
 zgrc_common.1010.t:0 "天下响应"
 zgrc_common.1010.desc_foreign:0 "外寇举倾国之众犯境，烽燧连天，兵锋直指[ROOT.Char.GetTopLiege.GetName]的社稷。\n\n你世受国恩，封土于此。檄书传到时，乡中父老已聚在门外，都在等你拿个主意。"
 zgrc_common.1010.desc_civil:0 "同是华夏衣冠，如今却同室操戈。来犯者兵锋直指[ROOT.Char.GetTopLiege.GetName]的社稷，争的是天命谁属。\n\n你世受国恩，封土于此。檄书传到时，乡中父老已聚在门外，都在等你拿个主意。"
 zgrc_common.1010.a:0 "散家财，起乡勇，即刻勤王！"
 zgrc_common.1010.a_locked:0 "家无余财，勤王无资。"
 zgrc_common.1010.b:0 "王侯将相，宁有种乎？"
 zgrc_common.1010.b_locked:0 "兵微地远，举义无凭。"
 zgrc_common.1010.c:0 "兵凶战危，且观其变。"
 zgrc_common.2001.t:0 "义军来投"
 zgrc_common.2001.desc:0 "此战所争，本是汉家故土。消息传开，当地义民纷纷揭竿来附，愿为前驱，共复旧疆。\n\n义军的头领已候在帐外，听你发落。"
 zgrc_common.2001.a:0 "且随军前驱，事毕归乡。"
 zgrc_common.2001.b:0 "厚给粮饷，编入行伍。"
 zgrc_common.2001.c:0 "温言抚慰，遣归乡里。"
 # 民粹/农民战争直接来投的事件兵军队名
 zgrc_yijun_army_name:0 "乡勇义军"

 # ============================================================
 # 传言系统 —— 旅行听闻（3001-3004）
 # ============================================================
 # 3001 美名·忠义传闻
 zgrc_common.3001.t:0 "义声入耳"
 zgrc_common.3001.desc:0 "你行经[ROOT.Var('zgrc_wen_county').Title.GetName]，道旁的乡老拉着你说起旧事：当年兵戈骤起，[zgrc_wen_hero.GetName]散尽家财，招募乡勇，赶去赴君父之难。邑中百姓至今传颂此人的义举。"
 zgrc_common.3001.desc_late:0 "你行经[ROOT.Var('zgrc_wen_county').Title.GetName]，道旁的乡老拉着你说起旧事：当年兵戈骤起，[zgrc_wen_hero.GetName]散尽家财，招募乡勇，赶去赴君父之难。如今此人坟上的树都已合抱，乡人说起这段义举，仍不免肃然起敬。"
 zgrc_common.3001.a:0 "捐资立祠，以旌忠烈。"
 zgrc_common.3001.a_renew:0 "续捐香火，以光前贤。"
 zgrc_common.3001.b:0 "礼敬其贤，心向往之。"
 zgrc_common.3001.c:0 "行路匆匆，不以为意。"
 # 3002 美名·仁德传闻
 zgrc_common.3002.t:0 "仁声入耳"
 zgrc_common.3002.desc:0 "你行经[ROOT.Var('zgrc_wen_county').Title.GetName]，乡人在道旁说起旧事：当年义军过境，[zgrc_wen_hero.GetName]没有驱他们去阵前送死，而是好言抚慰，遣归乡里，保全了一方百姓。乡人至今感念此人的恩德。"
 zgrc_common.3002.desc_late:0 "你行经[ROOT.Var('zgrc_wen_county').Title.GetName]，乡人在道旁说起旧事：当年义军过境，[zgrc_wen_hero.GetName]没有驱他们去阵前送死，而是好言抚慰，遣归乡里，保全了一方百姓。如今斯人已逝，乡人说起来，还会落泪。"
 zgrc_common.3002.a:0 "捐资立祠，以彰仁德。"
 zgrc_common.3002.a_renew:0 "续捐香火，以光前贤。"
 zgrc_common.3002.b:0 "礼敬其贤，心向往之。"
 zgrc_common.3002.c:0 "行路匆匆，不以为意。"
 # 3003 恶名·野心传闻
 zgrc_common.3003.t:0 "逆耳之言"
 zgrc_common.3003.desc:0 "你行经[ROOT.Var('zgrc_wen_county').Title.GetName]，听见里巷中有人压低了声音议论：当年天下有变，[zgrc_wen_hero.GetName]不思报国，反倒趁乱背主，举旗自立，与来犯者合兵一处。说话的人不时四下张望，听的人个个心惊。"
 zgrc_common.3003.desc_late:0 "你行经[ROOT.Var('zgrc_wen_county').Title.GetName]，听见里巷中有人压低了声音议论：当年天下有变，[zgrc_wen_hero.GetName]不思报国，反倒趁乱背主，举旗自立，与来犯者合兵一处。此人虽早已化作枯骨，乡人提起来，仍恨得咬牙切齿。"
 zgrc_common.3003.a:0 "捐资铸其罪像，以警来者。"
 zgrc_common.3003.a_renew:0 "续修罪像，长警后人。"
 zgrc_common.3003.b:0 "广而告之，一吐为快。"
 zgrc_common.3003.c:0 "事不关己，不足为虑。"
 # 3004 恶名·附逆传闻
 zgrc_common.3004.t:0 "遗臭之闻"
 zgrc_common.3004.desc:0 "你行经[ROOT.Var('zgrc_wen_county').Title.GetName]，父老指着一片废墟告诉你：当年外寇入境，[zgrc_wen_hero.GetName]甘为前驱，引兵残害桑梓。乡人至今恨不得食其肉。"
 zgrc_common.3004.desc_late:0 "你行经[ROOT.Var('zgrc_wen_county').Title.GetName]，父老指着一片废墟告诉你：当年外寇入境，[zgrc_wen_hero.GetName]甘为前驱，引兵残害桑梓。如今此人坟上的树都已合抱，乡人路过那座坟垄，仍要啐上一口。"
 zgrc_common.3004.a:0 "捐资铸像，使千载共唾。"
 zgrc_common.3004.a_renew:0 "续修此像，使其遗臭万年。"
 zgrc_common.3004.b:0 "广而告之，一泄心头之恨。"
 zgrc_common.3004.c:0 "行路匆匆，只当耳旁风。"

 # 大复仇：亲属得知凶手后的抉择
 zgrc_common.4001.t:0 "悲报传来"
 zgrc_common.4001.desc:0 "噩耗传来——你的[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('zgrc_victim'))][zgrc_victim.GetName]死于非命，凶手便是那[zgrc_killer.GetName]。\n\n九世之仇尚且要报，何况至亲之痛？"
 zgrc_common.4001.a:0 "此仇不报，誓不为人！"
 zgrc_common.4001.b:0 "含垢忍辱，此恨深埋。"

 # 2026-11-01 汉地风俗 1.5.3（创意工坊 3812432062）并入的新键
 zgrc_common.5040.title:0 "朝堂议论"
 zgrc_common.5040.desc:0 "朕召集群臣，宣示以本族归籍华夏之意。\n话音未落，殿上已是一片哗然——有嘘声，有窃窃私议，亦有几声掩不住的轻笑。此议一出，满朝震动。"
 zgrc_common.5040.a:0 "肃静"
 zgrc_common.5041.title:0 "朝堂议论"
 zgrc_common.5041.intro:0 "殿上渐渐安静下来。朕环视群臣：\n“此事关乎我族将来，诸卿有何看法？畅所欲言。”\n"
 zgrc_common.5041.desc.1:0 "话音未落，[zgrc_arguer.GetName]已抢步出班，泣曰：\n“陛下！归籍汉家，后人便只知汉人，不知我等自何处来。此非辱没先祖乎？”"
 zgrc_common.5041.desc.2:0 "[zgrc_arguer.GetName]出班，面露难色：\n“陛下！改汉姓之后，后人再不知祖先名讳。他日九泉之下，何以见先人？”"
 zgrc_common.5041.desc.3:0 "[zgrc_arguer.GetName]摇头：\n“陛下！语言既改，后人只道自己是汉人；名字既改，后人更不知祖先为谁。我族之名，自此绝矣。”"
 zgrc_common.5041.a:0 "还有没有其他人建言？"
 zgrc_common.5042.title:0 "朝堂议论"
 zgrc_common.5042.desc.han:0 "[zgrc_supporter.GetName]出班，朗声道：\n“《孟子》曰：‘吾闻用夏变夷者，未闻变于夷者也。’陛下此举，非舍旧，乃登高。臣请陛下速断，勿疑。”"
 zgrc_common.5042.desc.hu:0 "[zgrc_supporter.GetName]出班，拱手道：\n“臣以为可。非汉不能治书算；书算不理，则赋税不明，赋税不明，则国不可得而治。陛下所见甚远，非臣等所及。”"
 zgrc_common.5042.a:0 "天子圣裁"
 zgrc_common.5043.title:0 "天子圣裁"
 zgrc_common.5043.desc:0 "群臣之言，朕已尽闻。有忧辱没先祖者，有言非汉不能治者，亦有默然不语者。\n然我族久染汉风，市井乡野之间，早已难辨胡夷；名分未正，终非长久之计。\n今日之议，朕意已决——"
 zgrc_common.5043.a:0 "归籍华夏"
 zgrc_common.5043.b:0 "不入汉家"
 zgrc_common.5030.title:0 "朝堂议论"
 zgrc_common.5030.desc:0 "朕观治下向化之族，欲纳其归籍华夏。\n诏令既下，殿上已是一片哗然——或言其俗已同，当归；或言名分大事，不可轻议。"
 zgrc_common.5030.a:0 "肃静"
 zgrc_common.5031.title:0 "朝堂议论"
 zgrc_common.5031.intro:0 "殿上渐渐安静下来。朕环视群臣：\n“此事关乎华夷之辨，诸卿有何看法？畅所欲言。”\n"
 zgrc_common.5031.desc.ru:0 "[zgrc_arguer.GetName]出班奏曰：\n“《春秋》之义，夷狄进于中国则中国之。彼族久染汉风，市井乡野难辨胡夷，纳之，正所以昭圣化。”"
 zgrc_common.5031.desc.dao:0 "[zgrc_arguer.GetName]出班，抚须曰：\n“道法自然。彼既向化，顺而纳之，不亦可乎？”"
 zgrc_common.5031.desc.fo:0 "[zgrc_arguer.GetName]出班，合掌曰：\n“万法缘起，随方毗尼。彼既向化，纳之，是结善缘。”"
 zgrc_common.5031.a:0 "还有没有其他人建言？"
 zgrc_common.5032.title:0 "朝堂议论"
 zgrc_common.5032.desc:0 "[zgrc_opposer.GetName]出班，拱手曰：\n“陛下！彼族虽久染汉风，然其语言文字犹存。遽纳之，恐华夷混杂，礼法不纯；且名分一正，他日难返。”"
 zgrc_common.5032.a:0 "天子圣裁"
 zgrc_common.5033.title:0 "天子圣裁"
 zgrc_common.5033.desc:0 "群臣之言，朕已尽闻。有言其俗已同、当归者；有言名分大事、不可轻议者。\n然向化之族，市井乡野既已难辨胡夷，名分久悬，非所以安之。\n朕意已决——"
 zgrc_common.5033.a:0 "归籍华夏"
 zgrc_common.5033.b:0 "不入汉家"
 zgrc_common.5050.title:0 "上书朝廷"
 zgrc_common.5050.desc:0 "[ROOT.Var('zgrc_requestor').Char.GetName]上书朝廷，自陈其族久染汉风，皆通汉音，晓礼仪；民间交融，市井乡野之间，难辨胡夷。\n请归籍华夏，列于诸夏。朕览其表，命群臣议之。"
 zgrc_common.5050.a:0 "召群臣议之"
 zgrc_common.5060.title:0 "汉风猎猎"
 zgrc_common.5060.intro:0 "[zgrc_han_leader.GetName]决意全面推行汉化：讲汉语，读经书，子嗣皆入汉籍！"
 zgrc_common.5060.desc.north:0 "四下张望，帐内的是陪你茹毛饮血的部众。不禁想起了祖辈在苍狼白鹿下的誓言。\n往后出生的子嗣，怕是都要去读经书做汉人了。苍狼白鹿的誓言，终究要被遗忘了。"
 zgrc_common.5060.desc.east:0 "海风吹过祭坛前神木，眼前是世代供奉的部众。想起了先祖在浪涛中留下的传说。\n往后出生的子嗣，都要去读汉家经卷了。海神与先祖的故事，怕是没人再传唱了。"
 zgrc_common.5060.desc.west:0 "绿洲外驼铃阵阵，城郭里是世代经商的族人。想起了祖辈在风沙中建立的荣光。\n往后出生的子嗣，都要去学中原雅言了。这片绿洲的旧日胡音，终究要随风散了。"
 zgrc_common.5060.desc.south:0 "闷热的雨林中，是身上纹着图腾的部众。想起了祖先在这片水网留下的野性。\n往后出生的子嗣，都要去学那拗口的汉话了。雨林里的图腾，怕是要慢慢褪去了。"
 zgrc_common.5060.desc.other:0 "环顾熟悉的王庭，眼前是追随多年的部众。想起了历代先祖传承下来的基业。\n往后出生的子嗣，都将入汉家户籍。祖辈留下的本俗，终究要在岁月里消散了。"
 zgrc_common.5060.outro:0 "看着案上摆放的汉家冠带，我当何去何从？"
 zgrc_common.5060.a:0 "浸染汉风"
 zgrc_common.5060.a_tt:0 "接受汉化。"
 zgrc_common.5060.b:0 "传承守俗"
 zgrc_common.5060.b_tt:0 "你与近亲、非统治者配偶获得#high 守俗人#!：子嗣不入汉籍，父系相传。"
