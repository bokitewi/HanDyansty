l_simp_chinese:
 # 汉代风味内容（2026-10-25）。计划：/mnt/project-files/汉代风味内容/汉代风味内容_计划.md

 # ===== 6.1 考课公务 K1~K11 =====
 hd_hanfl.kaoke.good.tt:0 "郡中当以此为善政，记入今岁考课。"
 hd_hanfl.kaoke.normal.tt:0 "此事照例录入考簿，不功不过。"
 hd_hanfl.kaoke.bad.tt:0 "此事一旦传开，考课之时恐成污点。"
 hd_hanfl.kaoke.duel_success.tt:0 "处置得宜，考课时可记上一笔。"
 hd_hanfl.kaoke.duel_failure.tt:0 "处置失当，考课时难免记过。"

 hd_hanfl.1001.t:0 "上计簿"
 hd_hanfl.1001.desc:0 "[wj_duty_person.GetFirstName]将上计新簿呈来，户口、垦田、仓粟，无一项不胜去年。他在此经手钱谷多年，每逢结账，总能把零碎数目归得齐整。\n\n我随手抽出一张旧券，便见迁走的人家仍在纳税，早已报损的仓粮却又添回实数。问起缘故，他没有争辩，只从袖中取出另一册小簿。\n\n“新任未必查得清旧账。若府君愿给些时日……”他的声音低了下去。小簿中夹着一张兑钱的券，数目恰与短少的钱谷相近。"
 hd_hanfl.1001.a:0 "逐项重核。查验之费我出，亏空由经手人补足。"
 hd_hanfl.1001.b:0 "亏空照实写入，不许再向民户摊补。"
 hd_hanfl.1001.c:0 "钱券留下，这份新簿便照原样封发。"
 hd_hanfl.1001.d:0 "先别封簿。我亲自对券，看钱谷流到何处。"
 hd_hanfl.1001.d.success:0 "旧券互证，隐去的钱谷追回了一部分"
 hd_hanfl.1001.d.failure:0 "经手凭券互相遮掩，核查徒费时日"
 hd_hanfl.1001.src:0 "事见《汉书·宣帝纪》：黄龙元年诏曰「上计簿，具文而已，务为欺谩，以避其课」。"

 hd_hanfl.1002.t:0 "强项令"
 hd_hanfl.1002.desc:0 "[wj_kaoke_duty_county.GetName]市中出了人命，告牒却几度退回。巡吏终于将涉案门客[wj_duty_person.GetFirstName]唤到堂前，他仍抱臂立着，先看主人脸色，不看告牒。\n\n家主[wj_duty_other.GetFirstName]也来了。他没有穿着盛服，却将一封旧荐书压在案角：“本家与上府往来已久。此人留在我这里，自会管束，何劳府君费心？”\n\n门外有死者家人候告。门内，一匣钱已推到我面前。巡吏握着绳索，只等一句话。"
 hd_hanfl.1002.a:0 "收进狱中。此处问的是案，不是门第。"
 hd_hanfl.1002.b:0 "先收系核供，案未勘明，谁也不得领人。"
 hd_hanfl.1002.c:0 "钱且留下。人由你领回，告牒我来处置。"
 hd_hanfl.1002.d:0 "主人与门客当堂对证，抚恤之资也须说清。"
 hd_hanfl.1002.d.success:0 "门客入狱，主家认付抚恤，荐书未能遮案"
 hd_hanfl.1002.d.failure:0 "供辞互相回护，门客仍须收系候勘"
 hd_hanfl.1002.src:0 "事见《后汉书·酷吏列传·董宣传》：湖阳公主苍头白日杀人，匿主家，董宣候于夏门亭，叱奴下车格杀之。帝令宣叩头谢主，宣两手据地，终不肯俯，帝敕「强项令出」。"

 hd_hanfl.1003.t:0 "女子报仇"
 hd_hanfl.1003.desc:0 "狱吏将[hd_hanfl_revenge_woman.GetFirstName]引至堂下。她衣袖的血痕尚未洗净，供辞却说得清楚：父亲遇害，告官未获伸理，仇家昨日已死在她手中。\n\n“父仇既报，愿伏其罪。”她俯首待断。随案送来的旧告牍仍夹在卷中，纸边已经磨破，末尾却寻不着当年的批语。\n\n案旁另有一袋封好的家资。掌案者将赎金数目写在封条背面，迟迟没有递到她眼前。"
 hd_hanfl.1003.a:0 "旧案失察在先，此女可原。"
 hd_hanfl.1003.b:0 "杀人有律，依律处断。"
 hd_hanfl.1003.c:0 "家资留下，此案便不再深究。"
 hd_hanfl.1003.d:0 "取旧案与律本来，我要为她辩明。"
 hd_hanfl.1003.d.success:0 "辩议得伸，[hd_hanfl_revenge_woman.GetFirstName]获免归乡"
 hd_hanfl.1003.d.failure:0 "引律未合，[hd_hanfl_revenge_woman.GetFirstName]终未得免"
 hd_hanfl.1003.src:0 "事见《后汉书·列女传·庞淯母》：赵娥父为同县人所杀，娥于都亭刺杀仇人，诣县自首。禄福长尹嘉义之，解印绶欲与俱亡，娥不肯去，会赦得免。"

 hd_hanfl.1004.t:0 "杀牛祭神"
 hd_hanfl.1004.desc:0 "[wj_kaoke_duty_county.GetName]的乡人将耕牛牵到祠前，祭簿上不止一户。巫祝说，今年须多献几头，才足以答神；出牛的人却挤在人群后，不肯先开口。\n\n一个老人指着牛颈的旧轭痕，说那是家中仅有的耕畜。巫祝随即举起愿书：“各家都押了手印，难道是我强索？”老人将手藏进袖中，没有接话。\n\n若留祭礼，如何不再伤及生计？若骤然强禁，乡愿与官令，又有谁肯先退一步？"
 hd_hanfl.1004.a:0 "官府出资备祭，耕牛留下；不得再向贫户索牲。"
 hd_hanfl.1004.b:0 "乡愿暂从旧例，官府不再额外征发。"
 hd_hanfl.1004.c:0 "薄礼留下，祭事仍由你们主持。"
 hd_hanfl.1004.d:0 "请父老与耕户同坐，把敬神与伤农分说清楚。"
 hd_hanfl.1004.d.success:0 "乡人改用薄祭，耕牛不再列入祭簿"
 hd_hanfl.1004.d.failure:0 "祭议不协，乡中争执反而更盛"
 hd_hanfl.1004.src:0 "事见《后汉书·第五伦传》：「会稽俗多淫祀，好卜筮。民常以牛祭神，百姓财产以之困匮……伦到官，移书属县，晓告百姓……其后遂断绝，百姓以安。」"

 hd_hanfl.1005.t:0 "墓道孝子"
 hd_hanfl.1005.desc:0 "[wj_kaoke_duty_county.GetName]的乡评称[wj_duty_person.GetFirstName]守父墓三载，晨昏哭奠，足为乡里表率。他来候见时，袖中捧着的赞辞已誊清数遍，连奉赠的钱券也一并备好。\n\n随他来的母亲[wj_duty_other.GetFirstName]却没有坐下。问起家中生计，她只说替邻家缝补，尚能度日。再问乡里送去的米钱，儿子先答了：“墓前不能无人，来往也须应酬。”\n\n老人将磨破的袖口向内折了折，不愿再说。赞辞上写满了奉亲之事，却唯独没有她眼下的日子。"
 hd_hanfl.1005.a:0 "养亲之资我出。先奉养生者，再谈墓前孝名。"
 hd_hanfl.1005.b:0 "既有乡评，照录其行，不另作核访。"
 hd_hanfl.1005.c:0 "乡赠先拿来养母，不能只供墓前应酬。"
 hd_hanfl.1005.d:0 "请邻里分开说，平日究竟是谁供养其母？"
 hd_hanfl.1005.d.success:0 "访录互证，养亲之资终于落在实处"
 hd_hanfl.1005.d.failure:0 "问辞相左，母子与乡邻反添嫌隙"
 hd_hanfl.1005.src:0 "事见《后汉书·陈蕃传》：赵宣葬亲而不闭埏隧，居其中行服二十余年，「而宣五子皆服中所生」，蕃遂致其罪。时谚又云「举秀才，不知书；察孝廉，父别居」（《抱朴子·审举》）。"

 WJ_hanfl_hunt_hurt:0 "校猎受伤"
 WJ_hanfl_hunt_safe:0 "校猎而归"
 hd_hanfl.1006.t:0 "狱牍覆核"
 hd_hanfl.1006.desc:0 "狱吏呈来一卷牵连供辞，末尾添着[wj_duty_person.GetFirstName]的名字。人已收系，家中托送的旧役牒却与供辞相抵：所谓同谋聚会那一日，他正在别处服役。\n\n“供上有名，便不能不问。”经手小吏说。可问供者据何处见闻，答的又是另一名囚徒的话；再向前翻，两份口供竟都出自同一次拷讯。\n\n[wj_duty_person.GetFirstName]隔着门递来役牒，字迹写得端正。他没有替旁人分辩，只请我看清上面的日期。"
 hd_hanfl.1006.a:0 "覆核之费与返家之资由我出，无凭者放归。"
 hd_hanfl.1006.b:0 "只勘这一供，暂留待核，不得再旁牵人户。"
 hd_hanfl.1006.c:0 "押入地牢严讯，我要一份说得清楚的供辞。"
 hd_hanfl.1006.d:0 "把役籍与历次供辞取齐，我亲自逐条覆对。"
 hd_hanfl.1006.d.success:0 "旧籍破了牵连之辞，[wj_duty_person.GetFirstName]得释"
 hd_hanfl.1006.d.failure:0 "供辞与旧籍仍有抵牾，覆核未能结案"
 hd_hanfl.1006.src:0 "事见《后汉书·寒朗传》：楚狱辞所连及，朗心伤其冤，上言诸人无奸、专为颜忠王平所诬，曰「臣知言之必族，然不敢自欺」。后二日，明帝亲幸洛阳狱录囚徒，理出千余人。"

 hd_hanfl.1007.t:0 "珠还合浦"
 hd_hanfl.1007.desc:0 "[wj_kaoke_duty_county.GetName]的老珠户[wj_duty_person.GetFirstName]带来几袋空蚌，旁边站着经销海珠的[wj_duty_other.GetFirstName]。采额逐年加重，珠户的分成却仍照多年前的旧数。\n\n商贾摊开经手簿，船费、栈费、催办费，一项也不少：“少了这些，珠还出得了港么？”珠户将泡裂的手放在簿旁，问多采的那一份去了何处。\n\n我再看采簿，近岸得珠已少，人却被催往更深的水处。想保住这一门生计，眼前的采额与经手的规矩，都不能只看今年一张收簿。"
 hd_hanfl.1007.a:0 "修采具的钱我出，经手多取的，也须退还珠户。"
 hd_hanfl.1007.b:0 "先减采额，让珠户与近岸珠场休养。"
 hd_hanfl.1007.c:0 "钱留下，采额就按商家所请加上去。"
 hd_hanfl.1007.d:0 "当着珠户，把市价与各项经手费逐笔算明。"
 hd_hanfl.1007.d.success:0 "议价有成，商家退费，珠业渐复旧规"
 hd_hanfl.1007.d.failure:0 "费项争持不下，商旅滞留，珠市暂阻"
 hd_hanfl.1007.src:0 "事见《后汉书·循吏列传·孟尝传》：「先时宰守并多贪秽，诡人采求，不知纪极，珠遂渐徙于交阯郡界……尝到官，革易前敝……曾未逾岁，去珠复还。」"

 hd_hanfl.1008.t:0 "三互之禁"
 hd_hanfl.1008.desc:0 "[wj_kaoke_duty_county.GetName]书吏缺员，催办的文书已叠到案沿。[wj_duty_person.GetFirstName]呈来的籍册上，籍贯、婚里各圈着一笔朱色；禁例越添越密，能办事的人，反倒迟迟不得署用。\n\n我还未开口，他已将一卷错简排好，又指出两处重计的户数。“官印不敢求，”他说，“这批文书，总得有人写完。”\n\n掾吏另推来一册待结的案牍，问可否先雇其誊校。官籍与雇直本是两事，可一旦私谢夹进来，案头也未必比名籍干净。"
 hd_hanfl.1008.a:0 "籍册逐项查清，雇直由我出，先把积牍理完。"
 hd_hanfl.1008.b:0 "名籍未明，暂且不用；积牍另寻办法。"
 hd_hanfl.1008.c:0 "钱券留下，往后的案牍便由你经手。"
 hd_hanfl.1008.d:0 "籍贯、婚里与禁文一一对过，再议用人。"
 hd_hanfl.1008.d.success:0 "禁文辨明，[wj_duty_person.GetFirstName]得以受雇理牍"
 hd_hanfl.1008.d.failure:0 "籍册仍有抵牾，人未留住，积牍也未解"
 hd_hanfl.1008.src:0 "事见《后汉书·蔡邕传》：「至是复有三互法，禁忌转密，选用艰难。幽、冀二州，久缺不补。」邕上疏言「三互之禁，禁之薄者」，书奏不省。"

 hd_hanfl.1009.t:0 "严刑之议"
 hd_hanfl.1009.desc:0 "[wj_kaoke_duty_county.GetName]的两卷供辞，一并送到我案前。[wj_duty_person.GetFirstName]与人争斗，推搡间伤了邻人；[wj_duty_other.GetFirstName]则聚众劫路，供下还有一条人命。罪状原不相同，拟断处却都写着“从重”。\n\n前者认了伤人，却不断指着伤验，说邻人早已归家。后者把劫路推给同伴，直到掌案吏读出失物藏处，才不再接话。\n\n“新官初临，用一番重法，后来就好办了。”掌案吏将两卷并拢。若只求众人畏惧，轻重倒确实不必再分。"
 hd_hanfl.1009.a:0 "另出覆核之费，轻者释归，劫杀者转入重狱。"
 hd_hanfl.1009.b:0 "两案继续收系，各按原卷候断，不增旁坐。"
 hd_hanfl.1009.c:0 "两人一并处决，榜示属县，以儆后来。"
 hd_hanfl.1009.d:0 "把伤验、赃验与各人供辞分开复问。"
 hd_hanfl.1009.d.success:0 "轻重核清，伤人者获释，劫杀者转入地牢"
 hd_hanfl.1009.d.failure:0 "复问未能结案，两人仍被收系"
 hd_hanfl.1009.src:0 "事见《后汉书·酷吏列传·王吉传》：「凡杀人皆磔尸车上，随其罪目，宣示属县。夏月腐烂，则以绳连其骨，周遍一郡乃止，见者骇惧。」"

 hd_hanfl.1010.t:0 "轻侮之法"
 hd_hanfl.1010.desc:0 "[wj_duty_person.GetFirstName]杀人后，自称是为父雪辱。他援来一道旧赦，称先前有人因父受侮而杀人，得蒙宽宥，自己亦当援例。\n\n被害之家的[wj_duty_other.GetFirstName]却捧着尸格不肯退：“一句轻侮，便能抵掉一条人命么？”掌案吏将旧赦与现案并排，赦语确在，却没有后来人人可以比用的字样。\n\n[wj_duty_person.GetFirstName]承认下手，也愿拿钱息事；只是说到家属求偿，便又把那道赦文举得更高。"
 hd_hanfl.1010.a:0 "不可比赦为律；凶者收重狱，遗属由我抚恤。"
 hd_hanfl.1010.b:0 "这次从轻，但须先把赔偿交到遗属手中。"
 hd_hanfl.1010.c:0 "私谢留下，赦文便足以为你开脱。"
 hd_hanfl.1010.d:0 "参校旧赦与现律，罪责和赔偿都不能含混。"
 hd_hanfl.1010.d.success:0 "罪责与赔偿核定，遗属得款，凶者仍受监押"
 hd_hanfl.1010.d.failure:0 "比附仍有争议，遗属忧愤，案件继续收系"
 hd_hanfl.1010.src:0 "事见《后汉书·张敏传》：建初中有人侮辱人父者，其子杀之，肃宗贳其死刑，「自后因以为比，是时遂定其议，以为轻侮法」。敏驳议曰：「夫轻侮之法，先帝一切之恩，不有成科班之律令也。」"

 hd_hanfl.1011.t:0 "修宫钱"
 hd_hanfl.1011.desc:0 "[wj_kaoke_duty_county.GetName]修宫钱的催牒，与本岁常赋一同送到。限日写得分明，掾吏已拟好催征簿，只等我的印。\n\n乡人推来[wj_duty_person.GetFirstName]陈情。他捧着自家的钱券，先把常赋与修宫加派分作两堆，又将买种、修耒的数目写在旁边：“不是敢抗，只是今日一并输尽，来年又拿什么种田？”\n\n催办的差役将旧期限又指了一遍。掾吏低声说，若再添一笔经手钱，簿面也一样写得下。"
 hd_hanfl.1011.a:0 "动我的私财抵派，不再向本县加取。"
 hd_hanfl.1011.b:0 "按催牒取数，常赋与加派分别记清。"
 hd_hanfl.1011.c:0 "再收一笔经手钱，六十金归我。"
 hd_hanfl.1011.d:0 "逐项核支，我与乡户各担一半，不许另添经手钱。"
 hd_hanfl.1011.d.success:0 "核支有成，私财与乡户各担一半"
 hd_hanfl.1011.d.failure:0 "核支未成，乡户仍须照额出钱"
 hd_hanfl.1011.src:0 "事见《后汉书·宦者列传·张让传》：钜鹿太守司马直新除，被诏减责三百万，怅然曰「为民父母，而反割剥百姓，以称时求，吾不忍也」，行至孟津，上书极陈当世之失，即吞药自杀。书奏，帝为暂绝修宫钱。"


 # ===== D5 天人感应 =====
 hd_hanfl.1101.t:0 "灾异示警"
 hd_hanfl.1101.desc_disaster:0 "地方的奏报接连送进宫来：山崩地裂，河水决溢，田庐漂没，饥民塞路。太史令跪在阶下，说天降灾异，是在谴告人君。\n\n朝中议论纷纷。有人说该下诏罪己，有人说灾异责在三公，也有人说这不过是天时偶然，不必大惊小怪。\n\n群臣都在等你开口。"
 hd_hanfl.1101.desc_eclipse:0 "日中之时，天色忽然暗了下来，太阳缺了一角，渐渐被吞去大半。宫中钟鼓齐鸣，百官伐鼓救日，乱作一团。\n\n太史令奏道：日者，人君之象；日有食之，是阴侵阳、臣掩君之兆。朝中议论纷纷，有人说该下诏罪己，有人说灾异责在三公。\n\n群臣都在等你开口。"
 hd_hanfl.1101.desc_comet:0 "一连数夜，西北天际出现了一颗长尾的星，光芒扫过紫微垣。太史令说，这是彗星，主除旧布新，又主兵丧。\n\n消息传开，京中人心惶惶，市井间已有了谶语。朝中议论纷纷，有人说该下诏罪己，有人说灾异责在三公。\n\n群臣都在等你开口。"
 hd_hanfl.1101.a:0 "下诏罪己，减膳避殿。"
 hd_hanfl.1101.b:0 "灾异之咎，三公当之。"
 hd_hanfl.1101.c:0 "下诏求直言极谏之士。"
 hd_hanfl.1101.c.tt:0 "过些日子，会有人上书指斥时政。"
 hd_hanfl.1101.d:0 "天道远，人道迩，置之不问。"
 hd_hanfl.1101.src:0 "事见《汉书·文帝纪》：日食之后诏曰「人主不德，布政不均，则天示之灾，以诫不治」，令举贤良方正能直言极谏者。"
 hd_hanfl.1101.b.src:0 "事见《后汉书·徐防传》：永初元年，以寇贼雨水，策免太尉徐防，「凡三公以灾异免，始自防也」。"

 hd_hanfl.1102.t:0 "直言极谏"
 hd_hanfl.1102.desc:0 "求言的诏书下了月余，[hd_hanfl_zhijian.GetTitledFirstName]的奏书送到了你的案前，写得满满当当。\n\n奏书里说，灾异之起，是因为宫中用度奢靡，近臣专权，郡国赋敛无度；又说百姓困苦，皆在朝廷，不在天时。有几句话说得极重，近侍念到一半便不敢再念下去。\n\n[hd_hanfl_zhijian.GetFirstName]在殿外候着，听候发落。"
 hd_hanfl.1102.a:0 "忠言逆耳，朕当纳之。"
 hd_hanfl.1102.b:0 "妄议朝政，斥退之。"

 hd_hanfl.1103.t:0 "策免"
 hd_hanfl.1103.desc:0 "使者捧着策书来到你的府上。策书里说天降灾异，阴阳失和，你身居三公之位，燮理无方，即日免官。\n\n你知道天象与你无干。可灾异总要有人担着，[hd_hanfl_emperor.GetTitledFirstName]选了你。\n\n你交还印绶的时候，门外已经冷清了下来。"
 hd_hanfl.1103.a:0 "臣之罪也。"

 hd_hanfl.1104.t:0 "祥瑞"
 hd_hanfl.1104.desc_intro:0 "[hd_hanfl_reporter.GetTitledFirstName]派人飞马入京，奏称境内出现了祥瑞："
 hd_hanfl.1104.desc_dragon:0 "有黄龙见于郡中陂泽，鳞甲灿然，乡民数百人亲眼所见。"
 hd_hanfl.1104.desc_ganlu:0 "甘露降于郡中林木，凝如膏脂，味甘如饴。"
 hd_hanfl.1104.desc_phoenix:0 "有凤凰集于郡中高树，群鸟随之，数日方去。"
 hd_hanfl.1104.desc_jiahe:0 "郡中田里生出嘉禾，一茎九穗，连根献上。"
 hd_hanfl.1104.desc_end:0 "\n\n奏书说，这是圣德感天所致，请群臣上表称贺。朝中已有人在拟贺表了，也有几位老臣面色不豫。"
 hd_hanfl.1104.a:0 "天降嘉瑞，受群臣之贺。"
 hd_hanfl.1104.b:0 "因瑞改元，以应天命。"
 hd_hanfl.1104.c:0 "祥瑞不足恃，斥为虚饰。"
 hd_hanfl.1104.src:0 "事见《论衡·讲瑞》：王充以为「瑞物皆起和气而生，生于常类之中」，郡国所上符瑞，未必真是天降。"

 hd_hanfl.1105.t:0 "祥瑞造假"
 hd_hanfl.1105.desc:0 "当年[hd_hanfl_reporter.GetTitledFirstName]奏报的那桩祥瑞，如今有了下文。有人告发，所谓祥瑞，原是他命人连夜布置的；见过的乡民，也都收过他的钱。\n\n此事已经传遍京中。当年领头上表称贺的，正是朝中重臣；改元的诏书，也早已颁行天下。\n\n若是追究，便要承认当日受贺有误；若不追究，此后人人都会去造祥瑞。"
 hd_hanfl.1105.a:0 "欺天罔上，下狱问罪。"
 hd_hanfl.1105.b:0 "事已至此，隐忍不发。"

 # ===== D9 毁淫祀 =====
 hd_hanfl_destroy_yinsi_decision:0 "禁断淫祀"
 hd_hanfl_destroy_yinsi_decision_desc:0 "辖境之内，祠祀泛滥，巫祝以鬼神诈怖愚民，百姓的财产大半耗在祠前。前代循吏常以毁淫祀为善政，可百姓未必领情。"
 hd_hanfl_destroy_yinsi_decision_tooltip:0 "下令拆毁境内不在祀典的祠庙。"
 hd_hanfl_destroy_yinsi_decision_confirm:0 "毁之"
 hd_hanfl_destroy_yinsi_decision_effect_tooltip:0 "你直辖各县的「淫祀之风」都会除去。祠庙拆后，百姓是安是怨，要过些日子才知道。"
 hd_hanfl.1201.t:0 "毁祠"
 hd_hanfl.1201.desc:0 "吏卒拿着你的文书下到乡里，把那些不在祀典的祠庙一座座拆了，神像推倒，祭器收官，巫祝逐出境外。"
 hd_hanfl.1201.desc_chengyang:0 "济南境内的城阳景王祠，据说有六百余所。前相在任时曾把它们尽数毁去，去官之后，祠祀又一处处兴了起来，商人还用二千石的车服扮作景王出巡。你的吏卒这一回又把它们拆了，神像推倒，巫祝逐出境外。"
 hd_hanfl.1201.desc_calm:0 "\n\n起初乡里颇有些惶恐，过了一季，也不见有什么灾祸。百姓省下了祭祀的钱，春耕时多了几头耕牛。"
 hd_hanfl.1201.desc_curse:0 "\n\n被逐的巫祝临走前当街诅咒你，说神必降祸。你嘴上不说，夜里却总睡不安稳。"
 hd_hanfl.1201.desc_resent:0 "\n\n乡里的老人说，祖宗几代都在那里祭祀，如今连个祈雨的地方都没有了。怨言渐渐多了起来。"
 hd_hanfl.1201.a:0 "移风易俗，非一日之功。"
 hd_hanfl.1201.b:0 "出钱抚恤，另立社坛以安民心。"
 hd_hanfl.1201.src:0 "事见《三国志·魏书·武帝纪》注引《魏书》：济南城阳景王祠，「至六百余祠，贾人或假二千石舆服导从作倡乐」，曹操为济南相，皆毁坏祠屋，止绝官吏民不得祠祀。"

 # ===== D11 定德运 =====
 hd_hanfl.1301.t:0 "五德之次"
 hd_hanfl.1301.desc_intro:0 "新朝初建，太史令与博士们连日争论一件事：本朝当承何德，服色尚何，正朔用何。\n\n"
 hd_hanfl.1301.desc_prev_huo:0 "前朝以火德王。老博士引刘向父子之说，五德相生，火生土，本朝当以土德继之，色尚黄。也有人说五德之说本无定论，何必拘泥。"
 hd_hanfl.1301.desc_prev_tu:0 "前朝以土德王。老博士引刘向父子之说，五德相生，土生金，本朝当以金德继之，色尚白。也有人说五德之说本无定论，何必拘泥。"
 hd_hanfl.1301.desc_prev_jin:0 "前朝以金德王。老博士引刘向父子之说，五德相生，金生水，本朝当以水德继之，色尚黑。也有人说五德之说本无定论，何必拘泥。"
 hd_hanfl.1301.desc_prev_shui:0 "前朝以水德王。老博士引刘向父子之说，五德相生，水生木，本朝当以木德继之，色尚青。也有人说五德之说本无定论，何必拘泥。"
 hd_hanfl.1301.desc_prev_mu:0 "前朝以木德王。老博士引刘向父子之说，五德相生，木生火，本朝当以火德继之，色尚赤。也有人说五德之说本无定论，何必拘泥。"
 hd_hanfl.1301.desc_prev_none:0 "本朝并非受禅于谁，无所承继。博士们各执一词，有说当法天之运的，有说当顺地之宜的，吵了几日也没有结论。"
 hd_hanfl.1301.tu:0 "以土德王，色尚黄。"
 hd_hanfl.1301.jin:0 "以金德王，色尚白。"
 hd_hanfl.1301.shui:0 "以水德王，色尚黑。"
 hd_hanfl.1301.mu:0 "以木德王，色尚青。"
 hd_hanfl.1301.huo:0 "以火德王，色尚赤。"
 hd_hanfl_dewu_right_tt:0 "合五德相生之次，天下以为得正。"
 hd_hanfl_dewu_wrong_tt:0 "不合五德之次，儒生私下议论。"

 # ===== 6.3 州郡风物 =====
 hd_hanfl.2001.t:0 "火井"
 hd_hanfl.2001.desc:0 "临邛山中有一口井，井中有火。乡人用竹筒把井里的气引出来，一点就着，拿来煮盐，比柴火旺得多。\n\n盐官说，若多开几口这样的井，郡中的盐利能翻上一番。可乡里的老人说，火井是山神的口，开得多了，山神要发怒。"
 hd_hanfl.2001.a:0 "广开盐井，以足国用。"
 hd_hanfl.2001.b:0 "敬畏山川，不扰其地。"
 hd_hanfl.2001.src:0 "事见《华阳国志·蜀志》：临邛县「有火井，夜时光映上昭。民欲其火，先以家火投之，顷许如雷声，火焰出，通耀数十里，以竹筒盛其光藏之，可拽行终日不灭也」。"

 hd_hanfl.2002.t:0 "蜀锦"
 hd_hanfl.2002.desc:0 "成都锦官城里机杼声日夜不绝。新织成的锦在江水里一濯，颜色越发鲜明，别处的水便濯不出这样的光彩。\n\n锦官送来了今年的新样，说京中的贵人争着要，价比黄金。"
 hd_hanfl.2002.a:0 "命锦官多织，售之四方。"
 hd_hanfl.2002.b:0 "以锦分赐将吏。"
 hd_hanfl.2002.src:0 "事见《华阳国志·蜀志》：成都「其道西城，故锦官也。锦工织锦，濯以江流而鲜明，他江则不好，故命曰锦里也」。"

 hd_hanfl.2003.t:0 "水排"
 hd_hanfl.2003.desc:0 "郡中的冶铁作坊用上了一种新器：借流水转动轮轴，推动皮囊鼓风，不用再让人或马整日踩踏。一处作坊省下的人力，抵得上从前几十人。\n\n据说是前代一位太守创制的，百姓感念他，叫他杜母。工匠问你，要不要在郡中各处都造起来。"
 hd_hanfl.2003.a:0 "推广水排，以利铸冶。"
 hd_hanfl.2003.b:0 "恐伤农时，徐徐图之。"
 hd_hanfl.2003.src:0 "事见《后汉书·杜诗传》：杜诗为南阳太守，「造作水排，铸为农器，用力少，见功多，百姓便之」，时人方于召信臣，「故南阳为之语曰：前有召父，后有杜母」。"

 hd_hanfl.2004.t:0 "争水"
 hd_hanfl.2004.desc:0 "入夏久旱，渠水一日比一日浅。上游的豪家把渠口堵了大半，下游的田里已经裂开了口子。两边的人在渠边打了起来，伤了好几个。\n\n这条渠是前代修的，歌谣里还唱着「郑国在前，白渠起后」。如今渠还在，规矩却没人守了。"
 hd_hanfl.2004.a:0 "立石定规，均水于民。"
 hd_hanfl.2004.b:0 "豪右多力，从其所请。"
 hd_hanfl.2004.src:0 "事见《汉书·沟洫志》：白渠成，民歌之曰「田于何所？池阳谷口。郑国在前，白渠起后……衣食京师，亿万之口」。"

 hd_hanfl.2005.t:0 "烽燧"
 hd_hanfl.2005.desc:0 "半夜里，塞上燃起了烽火，一座接一座，从居延一直传到你的城下。戍卒说，匈奴的骑兵在塞外游弋，不知是来劫掠，还是来探虚实。\n\n天亮时，烽燧上的戍卒送来了一束简牍，上面记着几更几点见敌几人，字迹潦草，却一丝不苟。"
 hd_hanfl.2005.a:0 "亲巡亭燧，以壮士气。"
 hd_hanfl.2005.b:0 "核其簿籍，以明虚实。"
 hd_hanfl.2005.src:0 "事见居延汉简《塞上烽火品约》：敌人入塞，昼举烽、夜举火，以敌之多少、远近为品，「燔一积薪」「燔二积薪」，各有定制。"

 hd_hanfl.2006.t:0 "悬泉置"
 hd_hanfl.2006.desc:0 "敦煌东边的悬泉置迎来了一队西域使者，车马驼队排出好远，说是要入京朝贡。置中的厨啬夫愁眉苦脸地来报：使者人多，粮草和酒肉都不够了，按例只能供给几日。\n\n使者的首领倒是十分客气，送来了几匹好马，说久闻中国富庶。"
 hd_hanfl.2006.a:0 "厚加款待，以示怀远。"
 hd_hanfl.2006.b:0 "循例供给，不失其礼。"
 hd_hanfl.2006.src:0 "事见敦煌悬泉置汉简：置中有《过长罗侯费用簿》等，逐项记载过往使者、官吏的饭食酒肉与马匹刍茭，是汉代驿置的实账。"

 hd_hanfl.2007.t:0 "胡市"
 hd_hanfl.2007.desc:0 "上谷宁城的胡市又开了。乌桓、鲜卑的人赶着牛羊马匹，换取汉地的缯帛和铁器。市上人声鼎沸，也有人趁乱刺探塞内的虚实。\n\n护乌桓校尉的属吏来问：今年的胡市，是照旧开着，还是关了以防奸细？"
 hd_hanfl.2007.a:0 "开市通货，以羁縻之。"
 hd_hanfl.2007.b:0 "闭市严防，以绝奸细。"
 hd_hanfl.2007.src:0 "事见《后汉书·乌桓鲜卑列传》：建武年间复置护乌桓校尉于上谷宁城，「开营府，并领鲜卑，赏赐质子，岁时互市焉」。"

 hd_hanfl.2008.t:0 "凉州三明"
 hd_hanfl.2008.desc:0 "羌人又反了，从陇西一直扰到三辅。凉州的将吏聚在你的帐中，各执一词。\n\n有人说当学皇甫规，以恩信招抚，羌人也是人，逼急了才反；有人说当学张奂，恩威并用，先打后抚；也有人说当学段颎，羌人反复无常，非尽诛不可。三人都是凉州出身，时人号为凉州三明。"
 hd_hanfl.2008.a:0 "推以恩信，招而抚之。"
 hd_hanfl.2008.b:0 "恩威并用，先剿后抚。"
 hd_hanfl.2008.c:0 "长矛挟胁，白刃加颈。"
 hd_hanfl.2008.src:0 "事见《后汉书·皇甫张段列传》：皇甫规字威明、张奂字然明、段颎字纪明，并知名，「显达京师，称为凉州三明」。段颎上言「臣以为狼子野心，难以恩纳……唯当长矛挟胁，白刃加颈耳」。"

 hd_hanfl.2009.t:0 "荀氏八龙"
 hd_hanfl.2009.desc:0 "颍川荀氏的老家主有八个儿子，个个有才名，乡里称为八龙。县令把他们住的里巷改名作高阳里，说是比古时的高阳氏才子。\n\n荀家的子弟如今多在郡中，有人劝你礼聘一两位入府；也有人提醒你，名门子弟眼界高，未必肯屈就。"
 hd_hanfl.2009.a:0 "备礼延聘，以重儒雅。"
 hd_hanfl.2009.b:0 "名族自重，敬而远之。"
 hd_hanfl.2009.src:0 "事见《后汉书·荀淑传》：荀淑有子八人，「并有名称，时人谓之八龙」。县令苑康以昔高阳氏有才子八人，遂署其里为高阳里。"

 hd_hanfl.2010.t:0 "太学"
 hd_hanfl.2010.desc:0 "洛阳城南的太学里，诸生多到了三万余人。讲堂里经义没人细听，廊下倒是热闹：品评公卿，议论朝政，一句话说得漂亮，转眼就传遍京城。\n\n博士们向你抱怨，章句之学日渐疏废，诸生只会浮华交游。诸生却说，天下的清议，就在太学。"
 hd_hanfl.2010.a:0 "正其章句，以崇实学。"
 hd_hanfl.2010.b:0 "清议所在，任其议论。"
 hd_hanfl.2010.src:0 "事见《后汉书·儒林列传》：顺帝更修黉宇，「自是游学增盛，至三万余生。然章句渐疏，而多以浮华相尚，儒者之风盖衰矣」。"

 hd_hanfl.2011.t:0 "方士"
 hd_hanfl.2011.desc:0 "一个自称从海上仙山回来的方士登门求见。他说东海中有蓬莱、方丈、瀛洲三山，山上有不死之药，只要备下楼船童男童女，他愿再走一趟。\n\n他还当场献上一丸丹药，说服之可以延年。左右的人将信将疑，有人想起了当年徐福的故事。"
 hd_hanfl.2011.a:0 "姑且信之，求其仙方。"
 hd_hanfl.2011.a.success:0 "那丸丹药服下，你竟觉得身子轻快了许多"
 hd_hanfl.2011.a.failure:0 "方士拿了钱财，从此再没有回来"
 hd_hanfl.2011.b:0 "神仙之说，皆妄也。"
 hd_hanfl.2011.src:0 "事见《史记·秦始皇本纪》：齐人徐市等上书，言海中有三神山，名曰蓬莱、方丈、瀛洲，仙人居之，请得斋戒，与童男女求之。"

 hd_hanfl.2012.t:0 "山越"
 hd_hanfl.2012.desc:0 "山里的越人又出来了。他们依山阻险，不纳王租，平日躲在深山里种田冶铁，年景不好就下山劫掠。郡兵追进山里，往往连人影都找不到。\n\n郡中的将吏说，与其年年追剿，不如招他们出山，编户为民，强壮的还能补作兵员；也有人说，越人反复，只能打。"
 hd_hanfl.2012.a:0 "招其出山，编为兵户。"
 hd_hanfl.2012.b:0 "发兵入山，进剿之。"
 hd_hanfl.2012.src:0 "事见《三国志·吴书·诸葛恪传》：丹杨山险，民多果劲，「其幽邃民人，未尝入城邑，对长吏，皆仗兵野逸」。恪围而不战，俟其谷稼将熟，纵兵芟刈，山民饥穷，渐出降首，得甲士四万。"


 # ===== A4 幸阙里：活动 =====
 activity_hd_hanfl_queli:0 "幸阙里"
 activity_hd_hanfl_queli_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]幸阙里"
 activity_hd_hanfl_queli_desc:0 "车驾东巡，过鲁而幸阙里，以太牢祠孔子与七十二弟子，大会孔氏子孙，命儒者讲经。天子亲屈万乘，所敬的是先师，所示的是天下尊儒之意。"
 activity_hd_hanfl_queli_owner:0 "幸阙里的君主"
 activity_hd_hanfl_queli_plural:0 "幸阙里"
 activity_hd_hanfl_queli_host_an_a:0 "$articleblank_article$"
 activity_hd_hanfl_queli_predicted_cost:0 "预计花费"
 activity_hd_hanfl_queli_destination_selection:0 "阙里在鲁国曲阜，孔子旧宅犹存。"
 activity_hd_hanfl_queli_province_desc:0 "你将驾临[ROOT.Province.GetName]，祠孔子于阙里。"
 activity_hd_hanfl_queli_selection_tooltip:0 "举行[GetActivityType('activity_hd_hanfl_queli').GetName]，祠孔子，会孔氏，请讲经。"
 activity_hd_hanfl_queli_conclusion_desc:0 "讲席既罢，车驾西还。阙里的老人说，自高皇帝以来，天子亲至者不过数人。"
 activity_hd_hanfl_queli_host_desc:0 "\n$BULLET_WITH_TAB$主人可获得[legitimacy|E]、[prestige_i][prestige|E]与学识生活方式经验\n$BULLET_WITH_TAB$孔氏家主到场时，可加恩于孔氏"
 activity_hd_hanfl_queli_guest_desc:0 "\n$BULLET_WITH_TAB$随驾者对主人的[opinion|E]会提高"
 activity_hd_hanfl_queli_guest_help_text:0 "[activity_guests|E]随驾谒祠、听讲。"
 hd_hanfl_queli_need_qufu_tt:0 "曲阜在你的治下"
 hd_hanfl_kongshi:0 "孔氏家主"
 hd_hanfl_kongshi_for_host:0 "孔氏家主"
 hd_hanfl_kongshi_desc:0 "孔子的后人，世守阙里祠堂。"
 hd_hanfl_kongshi_desc_for_host:0 "$hd_hanfl_kongshi_desc$"
 activity_window_character_hd_hanfl_kongshi:0 "孔氏家主\n[Character.Custom('WJ_GetUIName')|U]"
 hd_hanfl_queli_phase_ye:0 "谒祠"
 hd_hanfl_queli_phase_ye_desc:0 "以太牢祠孔子与七十二弟子。"
 hd_hanfl_queli_phase_hui:0 "大会孔氏"
 hd_hanfl_queli_phase_hui_desc:0 "召见孔氏子孙，加以恩赏。"
 hd_hanfl_queli_phase_jiang:0 "请讲经"
 hd_hanfl_queli_phase_jiang_desc:0 "命儒者讲《论语》，讲毕车驾还宫。"

 # ===== A4 幸阙里：事件 =====
 hd_hanfl.3001.t:0 "谒祠"
 hd_hanfl.3001.desc:0 "孔子旧宅前，陈设着太牢之礼，牛、羊、豕各一。堂上奉着孔子与七十二弟子的神位，香烟缭绕。乐工奏起六代之乐，钟磬之声在庭院里回荡。\n\n有司请你示下：是亲自登堂行礼，还是依旧例遣大臣代祭？"
 hd_hanfl.3001.a:0 "亲升堂上，再拜先师。"
 hd_hanfl.3001.b:0 "遣大臣代祭，礼不可废。"
 hd_hanfl.3001.src:0 "事见《后汉书·儒林列传》：元和二年，章帝东巡还过鲁，幸阙里，以太牢祠孔子及七十二弟子，作六代之乐，大会孔氏男子，命儒者讲《论语》。"

 hd_hanfl.3002.t:0 "大会孔氏"
 hd_hanfl.3002.desc:0 "孔氏子孙齐集堂下，长幼有序。[hd_hanfl_kong.GetTitledFirstName]上前谢恩，说陛下亲屈万乘，辱临敝里，是崇礼先师、增辉圣德，至于孔氏的荣光，实在不敢承当。\n\n你听了大笑。当年章帝也听过这样的话，他说：「非圣者子孙，焉有斯言乎！」\n\n左右都看着你，等你加恩。"
 hd_hanfl.3002.a:0 "赐以爵秩，荣其宗族。"
 hd_hanfl.3002.b:0 "赐钱帛，以养先师之后。"
 hd_hanfl.3002.c:0 "出孔子屐，与之共观。"
 hd_hanfl.3002.d:0 "孔氏无人，怅然而罢。"

 hd_hanfl.3003.t:0 "请讲经"
 hd_hanfl.3003.desc:0 "讲席设在孔子旧堂。[hd_hanfl_kong.GetTitledFirstName]正襟危坐，从「学而时习之」讲起，一章一章讲下去。随驾的公卿、近侍都屏息听着，连堂外的老人也挤在门边。\n\n讲到「为政以德，譬如北辰」一章，你想起了朝中的许多事。"
 hd_hanfl.3003.a:0 "圣人之道，朕当铭之。"

 # ===== A5 狩猎 =====
 hd_hanfl.3101.t:0 "上林校猎"
 hd_hanfl.3101.desc:0 "苑中旌旗蔽野，属车千乘，羽林郎执戟夹道。猎犬撒开，鹰隼升空，虎豹在林间奔突，鹿群被赶向围场。\n\n随行的文士已经备好了笔札，说今日之盛，正好作一篇赋。左右也在劝你亲自驰射，以壮声势。"
 hd_hanfl.3101.a:0 "引弓驰射，亲逐猛兽。"
 hd_hanfl.3101.b:0 "命文士作赋，以记其盛。"
 hd_hanfl.3101.src:0 "事见《汉书·司马相如传》：相如作《上林赋》，极言天子校猎之盛，卒章却借天子之口叹道「嗟乎，此泰奢侈」，以为讽谏。"

 hd_hanfl.3102.t:0 "羽林郎"
 hd_hanfl.3102.desc:0 "围场里一头野彘冲破了阵脚，从骑纷纷避让。[hd_hanfl_yulin.GetTitledFirstName]纵马迎上去，一矛刺中，翻身下马，又补了一刀。\n\n你在高处看得清楚。这人年纪尚轻，身手却好。"
 hd_hanfl.3102.a:0 "壮哉！擢为羽林郎。"
 hd_hanfl.3102.b:0 "匹夫之勇，不足道也。"

 # ===== A5 宴会 =====
 hd_hanfl.3111.t:0 "角抵百戏"
 hd_hanfl.3111.desc:0 "酒过三巡，伶人入场。角抵之士赤膊相扑，跳丸者手中七丸上下翻飞，走索的女伎在绳上往来如履平地。最后一出是鱼龙曼延，彩布扎成的巨鱼在庭中翻腾，转眼化作一条黄龙。\n\n满座喝彩。也有一两位老臣低头饮酒，不发一言。"
 hd_hanfl.3111.a:0 "厚赏伶人，与众同乐。"
 hd_hanfl.3111.b:0 "百戏靡费，撤之。"
 hd_hanfl.3111.src:0 "事见《汉书·武帝纪》：元封三年春，「作角抵戏，三百里内皆观」。"

 hd_hanfl.3112.t:0 "六博"
 hd_hanfl.3112.desc:0 "席间有人摆出了博局。[hd_hanfl_bo_rival.GetTitledFirstName]拱手相邀，说愿与你对博一局，以助酒兴。\n\n掷箸、行棋、枭散，一局下来，输赢往往只在一念之间。围观的人已经下了注。"
 hd_hanfl.3112.a:0 "请！以钱为注。"
 hd_hanfl.3112.a.success:0 "你连枭两棋，满座称妙"
 hd_hanfl.3112.a.failure:0 "你一着失算，输得干干净净"
 hd_hanfl.3112.b:0 "博戏争道，易生嫌隙，不博。"
 hd_hanfl.3112.src:0 "事见《史记·吴王濞列传》：吴太子入见，侍皇太子饮博，「争道，不恭，皇太子引博局提吴太子，杀之」，吴楚之祸由此而起。"

 hd_hanfl.3113.t:0 "斗鸡走狗"
 hd_hanfl.3113.desc:0 "后庭传来一阵哄笑。[hd_hanfl_wanku.GetTitledFirstName]和几个少年把斗鸡抱进了园子，正比谁家的鸡距更利、谁家的狗跑得更快。赌注一回比一回大。\n\n见你过来，众人一时都住了手。"
 hd_hanfl.3113.a:0 "也押一注，与诸君同乐。"
 hd_hanfl.3113.b:0 "少年游荡，正色训诫。"
 hd_hanfl.3113.src:0 "事见《汉书·宣帝纪》：宣帝少时「喜游侠，斗鸡走马，具知闾里奸邪，吏治得失」。"

 # ===== A5 葬礼 =====
 hd_hanfl.3121.t:0 "厚葬与薄葬"
 hd_hanfl.3121.desc:0 "[deceased.GetFirstName]的灵柩停在堂上。主事的官员呈上了葬仪的单子：玉衣、明器、车马、珍宝，墓中还要起回廊、立石阙。照这样办，耗费不小，可旁人都会说你尽了孝道、全了体面。\n\n也有人劝你从简。世人以厚葬为德，可厚葬之墓，向来最招盗贼。"
 hd_hanfl.3121.a:0 "厚葬，以尽人子之心。"
 hd_hanfl.3121.a.tt:0 "墓中藏物丰厚，日后或招盗掘。"
 hd_hanfl.3121.b:0 "薄葬，不藏金玉。"
 hd_hanfl.3121.b_zhongzhi:0 "遵先帝《终制》，薄葬。"
 hd_hanfl.3121.src:0 "事见《后汉书·光武帝纪》：建武七年诏曰「世以厚葬为德，薄终为鄙，至于富者奢僭，贫者单财」，令天下知薄葬送终之义。"

 hd_hanfl.3122.t:0 "陵墓被盗"
 hd_hanfl.3122.desc:0 "守陵的吏卒连夜赶来报信：[hd_hanfl_tomb_owner.GetFirstName]的陵墓被人掘开了。盗洞从封土侧面打进去，墓中的金玉明器被洗劫一空，连棺椁也被撬开。\n\n消息已经传开，市井间都在议论当年那场葬礼有多么奢华。"
 hd_hanfl.3122.a:0 "悬赏缉拿，必得盗贼！"
 hd_hanfl.3122.b:0 "改葬薄送，不复藏宝。"
 hd_hanfl.3122.src:0 "事见《三国志·魏书·文帝纪》：曹丕作《终制》曰「自古及今，未有不亡之国，亦无不掘之墓也」。"

 # ===== A6 封禅：活动 =====
 activity_hd_hanfl_fengshan:0 "封禅大典"
 activity_hd_hanfl_fengshan_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]封禅泰山"
 activity_hd_hanfl_fengshan_desc:0 "登泰山而封，告成功于天；降禅梁父，报功于地。自秦皇汉武以来，唯功业大成、天下太平之主方敢行此大典。\n\n光武帝即位三十年时，群臣请封禅，他下诏说：「百姓怨气满腹，吾谁欺，欺天乎？」德不配位而强行封禅，只会招来天下的讥议。"
 activity_hd_hanfl_fengshan_owner:0 "封禅的天子"
 activity_hd_hanfl_fengshan_plural:0 "封禅大典"
 activity_hd_hanfl_fengshan_host_an_a:0 "$articleblank_article$"
 activity_hd_hanfl_fengshan_predicted_cost:0 "预计花费"
 activity_hd_hanfl_fengshan_destination_selection:0 "封禅只在泰山。"
 activity_hd_hanfl_fengshan_province_desc:0 "你将驾临[ROOT.Province.GetName]，登泰山，禅梁父。"
 activity_hd_hanfl_fengshan_selection_tooltip:0 "举行[GetActivityType('activity_hd_hanfl_fengshan').GetName]，告成功于天地。"
 activity_hd_hanfl_fengshan_conclusion_desc:0 "玉牒既封，石检既刻。从此史书会记下：某年某月，天子封泰山。"
 activity_hd_hanfl_fengshan_host_desc:0 "\n$BULLET_WITH_TAB$主人可获得大量[legitimacy|E]与[prestige_i][prestige|E]，并得「封禅玉牒」\n$BULLET_WITH_TAB$若开始时[legitimacy|E]不足，大典会被讥为「德不配位」，反失[legitimacy|E]\n$BULLET_WITH_TAB$同一王朝三十年内只能封禅一次"
 activity_hd_hanfl_fengshan_guest_desc:0 "\n$BULLET_WITH_TAB$随驾者可亲见封禅之礼"
 activity_hd_hanfl_fengshan_guest_help_text:0 "[activity_guests|E]随驾登封。"
 hd_hanfl_fengshan_need_taishan_tt:0 "泰山脚下的奉高在你的治下"
 hd_hanfl_fengshan_recent_tt:0 "你的王朝近三十年内没有封禅过"
 hd_hanfl_fengshan_phase_zhai:0 "斋戒"
 hd_hanfl_fengshan_phase_zhai_desc:0 "沐浴斋戒，议定告天之辞。"
 hd_hanfl_fengshan_phase_feng:0 "登封"
 hd_hanfl_fengshan_phase_feng_desc:0 "登泰山之巅，筑坛祭天，刻石纪功。"
 hd_hanfl_fengshan_phase_shan:0 "禅梁父"
 hd_hanfl_fengshan_phase_shan_desc:0 "下山至梁父，除地祭地，封藏玉牒，大典告成。"

 # ===== A6 封禅：事件 =====
 hd_hanfl.3201.t:0 "斋戒"
 hd_hanfl.3201.desc:0 "大典之前，你在行宫斋戒。太常送来了告天之辞的草稿，问要不要在辞中引图谶符命，说陛下受命，早有谶文为证。\n\n引谶，天下人便知你是天命所归；可朝中通经的儒臣，向来有人不信这一套。"
 hd_hanfl.3201.a:0 "宣示图谶，以明天命。"
 hd_hanfl.3201.b:0 "不言符命，但告成功。"
 hd_hanfl.3201.src:0 "事见《后汉书·祭祀志》：光武夜读《河图会昌符》，见「赤刘之九，会命岱宗」，有感于此，遂定封禅之议。"

 hd_hanfl.3202.t:0 "登封"
 hd_hanfl.3202.desc:0 "天还没亮，你便从山下起驾。山路陡峭，车马上不去，只好步行，左右扶着你攀过一道道石磴。"
 hd_hanfl.3202.desc_clear:0 "\n\n到了山顶，正赶上日出，云海翻涌，天地一色。坛已筑好，石工候在一旁，只等你定下刻石的文字。"
 hd_hanfl.3202.desc_storm:0 "\n\n走到半山，忽然狂风大作，暴雨倾盆，一行人只好躲在大树下。当年秦始皇登封，也是在半山遇上了风雨，儒生们为此讥笑了他许多年。\n\n雨停之后，你终于到了山顶。随行的人面面相觑，不知这风雨是吉是凶。"
 hd_hanfl.3202.a:0 "刻石颂功，昭示万世。"
 hd_hanfl.3202.b:0 "刻石自省，勉以修德。"
 hd_hanfl.3202.c:0 "风雨洗尘，天意嘉之。"
 hd_hanfl.3202.d:0 "此天谴也，朕当省躬。"

 hd_hanfl.3203.t:0 "禅梁父"
 hd_hanfl.3203.desc:0 "你从泰山下来，到梁父山除地祭地。玉牒书已经封进了石函，用金绳缠了，再以玉检封印，藏在坛下。\n\n礼毕之时，百官山呼万岁，声震山谷。这一刻，你是告成功于天地的天子。"
 hd_hanfl.3203.desc_unworthy:0 "你从泰山下来，到梁父山除地祭地。玉牒书封进了石函，百官依礼山呼万岁。\n\n可这一路上，你也听到了些别的话。有人说天下未安，百姓未足，此时封禅，不过是粉饰太平；也有人把光武帝当年那句「吾谁欺，欺天乎」抄了出来，在京中传看。"
 hd_hanfl.3203.a:0 "大典告成。"
 hd_hanfl.3203.src:0 "事见《史记·封禅书》：武帝封泰山，「封广丈二尺，高九尺，其下则有玉牒书，书秘」。"

 hd_hanfl.3204.t:0 "臣不读谶"
 hd_hanfl.3204.desc:0 "朝会上议起一件事，你说想以谶文来决断。殿上安静了片刻，[hd_hanfl_budu.GetTitledFirstName]出班奏道：「臣不读谶。」\n\n你问他为什么。他便直言谶书都是后人伪托，并非圣人之言，不可用来决断国事。满朝文武都低下了头。"
 hd_hanfl.3204.a:0 "人各有志，朕不罪汝。"
 hd_hanfl.3204.b:0 "非圣无法，下狱治罪！"
 hd_hanfl.3204.src:0 "事见《后汉书·桓谭传》：光武欲以谶决灵台所处，桓谭默然良久，曰「臣不读谶」，又极言谶之非经。帝大怒，曰「桓谭非圣无法，将下斩之」，谭叩头流血，良久乃得解。"

 # ===== A6 元会：活动 =====
 activity_hd_hanfl_yuanhui:0 "元会"
 activity_hd_hanfl_yuanhui_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]元会"
 activity_hd_hanfl_yuanhui_desc:0 "正月旦，天子临轩，公卿百官陪位朝贺，四夷来献，郡国上计吏入殿陈述一年的户口垦田、钱谷刑狱。礼毕设宴，九宾陈列，百戏杂陈。\n\n高皇帝初定朝仪那天，见群臣肃然，叹道：「吾乃今日知为皇帝之贵也。」"
 activity_hd_hanfl_yuanhui_owner:0 "受朝的天子"
 activity_hd_hanfl_yuanhui_plural:0 "元会"
 activity_hd_hanfl_yuanhui_host_an_a:0 "$articleblank_article$"
 activity_hd_hanfl_yuanhui_predicted_cost:0 "预计花费"
 activity_hd_hanfl_yuanhui_destination_selection:0 "元会在京师举行。"
 activity_hd_hanfl_yuanhui_province_desc:0 "你将在[ROOT.Province.GetName]受百官朝贺。"
 activity_hd_hanfl_yuanhui_selection_tooltip:0 "举行[GetActivityType('activity_hd_hanfl_yuanhui').GetName]，受朝贺，听上计。"
 activity_hd_hanfl_yuanhui_conclusion_desc:0 "庭燎渐熄，百官散去。新的一年，便从这一天开始了。"
 activity_hd_hanfl_yuanhui_host_desc:0 "\n$BULLET_WITH_TAB$主人可获得[prestige_i][prestige|E]，有朝贡国君主到场时更多\n$BULLET_WITH_TAB$上计时可减免或问责一位封臣"
 activity_hd_hanfl_yuanhui_guest_desc:0 "\n$BULLET_WITH_TAB$到场的封臣对主人的[opinion|E]会提高"
 activity_hd_hanfl_yuanhui_guest_help_text:0 "[activity_guests|E]入朝上寿、陪位观礼。"
 hd_hanfl_yuanhui_need_january_tt:0 "现在是正月"
 hd_hanfl_yuanhui_phase_he:0 "朝贺"
 hd_hanfl_yuanhui_phase_he_desc:0 "百官上寿，依次就位。"
 hd_hanfl_yuanhui_phase_ji:0 "上计"
 hd_hanfl_yuanhui_phase_ji_desc:0 "郡国上计吏入殿，陈述一年政事。"
 hd_hanfl_yuanhui_phase_yue:0 "九宾散乐"
 hd_hanfl_yuanhui_phase_yue_desc:0 "设宴陈乐，元会告终。"

 # ===== A6 元会：事件 =====
 hd_hanfl.3301.t:0 "位次之争"
 hd_hanfl.3301.desc:0 "百官依次入殿上寿，到了就位的时候却出了岔子。[hd_hanfl_seat_a.GetTitledFirstName]和[hd_hanfl_seat_b.GetTitledFirstName]都说自己的位次该在前头，一个论爵秩，一个论功劳，谁也不肯相让，在殿上争得面红耳赤。\n\n谒者不敢做主，只好请你裁断。"
 hd_hanfl.3301.a:0 "[hd_hanfl_seat_a.GetFirstName]当在前。"
 hd_hanfl.3301.b:0 "[hd_hanfl_seat_b.GetFirstName]当在前。"

 hd_hanfl.3302.t:0 "上计"
 hd_hanfl.3302.desc:0 "郡国上计吏依次入殿。轮到[hd_hanfl_shangji.GetTitledFirstName]治下来的计吏，他捧着计簿跪在阶下，说今年境内收成不好，流民渐多，户口比去年少了，请朝廷宽免赋税。\n\n侍御史在旁边低声提醒你：这一处去年的计簿就有虚报，今年也未必全是实情。"
 hd_hanfl.3302.a:0 "民生艰难，蠲免其租赋。"
 hd_hanfl.3302.b:0 "计簿不实，问责守令。"
 hd_hanfl.3302.b.tt:0 "[hd_hanfl_shangji.GetFirstName]今年的考课，怕是要受此事连累。"

 hd_hanfl.3303.t:0 "九宾散乐"
 hd_hanfl.3303.desc:0 "朝贺、上计都已结束，殿中设下了大宴。九宾陈列，四夷的使者捧着方物依次进献；殿下奏起雅乐，又有百戏杂陈。庭燎通明，照得满殿如同白昼。\n\n你举起酒爵，群臣齐声上寿。"
 hd_hanfl.3303.a:0 "与群臣共饮此爵。"
 hd_hanfl.3303.src:0 "事见《后汉书·礼仪志》注引蔡质《汉仪》：正月旦，天子幸德阳殿临轩，公卿百官陪位朝贺，蛮、貊、胡、羌朝贡毕，见属郡计吏，皆陛觐，庭燎。"

 # ===== 6.2 剧本时间线：22 新莽弊政 =====
 hd_hanfl.4001.t:0 "宝货"
 hd_hanfl.4001.desc:0 "新朝的宝货之制已经行之有年。金、银、龟、贝、钱、布，大大小小数十品，名目繁杂，连市上的老商贾也算不清楚。百姓嫌其不便，私下仍用五铢旧钱交易，官府搜捕盗铸的人，监狱里关得满满的。\n\n市井间怨声载道，有人说钱法一日一变，田里的谷子都换不来一匹布。"
 hd_hanfl.4001.a:0 "新制乃复古之道，不可改易。"
 hd_hanfl.4001.b:0 "稍宽其禁，以安百姓。"
 hd_hanfl.4001.c:0 "上表颂扬新制。"
 hd_hanfl.4001.d:0 "私铸取利，各凭本事。"
 hd_hanfl.4001.src:0 "事见《汉书·食货志》：王莽更作宝货，五物六名二十八品，「百姓愦乱，其货不行」。"

 hd_hanfl.4003.t:0 "王田"
 hd_hanfl.4003.desc:0 "诏书改天下田为「王田」，奴婢为「私属」，一律不许买卖。一家田产超过定额的，要把多余的田分给九族乡邻。\n\n诏令颁下多年，豪强照旧兼并，小民却因私卖田宅被捕下狱，从诸侯卿大夫到庶民，抵罪的人数也数不清。"
 hd_hanfl.4003.a:0 "井田圣制，必行无疑。"
 hd_hanfl.4003.b:0 "暂弛买卖之禁。"
 hd_hanfl.4003.c:0 "奉行王田，以示忠诚。"
 hd_hanfl.4003.d:0 "暗中置田，以待时变。"
 hd_hanfl.4003.src:0 "事见《汉书·王莽传》：更名天下田曰「王田」，奴婢曰「私属」，皆不得卖买，「自诸侯卿大夫至于庶民，抵罪者不可胜数」。"

 hd_hanfl.4004.t:0 "河决"
 hd_hanfl.4004.desc:0 "当年黄河在魏郡决口，大水向东泛滥清河以东数郡，至今没有堵塞。朝中有人说，河水既然东去，元城的王氏祖坟便没有水患了，所以不必兴役堤塞。\n\n于是河水年年改道，田庐尽成泽国。流民扶老携幼，向南向东逃去，聚在山泽之间。"
 hd_hanfl.4004.a:0 "河水东去，于祖茔无害。"
 hd_hanfl.4004.b:0 "发卒塞河，以救民命。"
 hd_hanfl.4004.c:0 "眼看流民塞路，徒然忧叹。"
 hd_hanfl.4004.d:0 "开仓赈济乡里。"
 hd_hanfl.4004.src:0 "事见《汉书·王莽传》：「河决魏郡，泛清河以东数郡。先是，莽恐河决为元城冢墓害。及决东去，元城不忧水，故遂不堤塞。」"

 # ===== 22 始正火德 =====
 hd_hanfl.4002.t:0 "始正火德"
 hd_hanfl.4002.desc:0 "你已经即了皇帝位，有司来请定德运。\n\n博士们说，汉家本是火德，尧后火运，所以王莽才自称以土德代火；如今汉室中兴，正当复归火德，色尚赤。也有人翻出汉初张苍的旧说，说汉承秦后，应当仍用水德。"
 hd_hanfl.4002.a:0 "汉为火德，色尚赤。"
 hd_hanfl.4002.b:0 "依张苍旧说，仍用水德。"
 hd_hanfl.4002.src:0 "事见《后汉书·光武帝纪》：建武二年，「始正火德，色尚赤」。"

 # ===== 89 班昭续书、《汉书》成 =====
 hd_hanfl.4101.t:0 "班昭续书"
 hd_hanfl.4101.desc:0 "班固死后，他未写完的《汉书》还剩八表和《天文志》没有成稿，书稿散在家中。有人向你举荐他的妹妹班昭，说她博学高才，家学渊源，可以续成此书。\n\n东观藏书阁里有朝廷的图籍，若下诏让她入阁，书稿或许能够完成。"
 hd_hanfl.4101.a:0 "诏班昭入东观，续成其书。"
 hd_hanfl.4101.a.tt:0 "过几年，《汉书》可成。"
 hd_hanfl.4101.b:0 "妇人修史，于礼不合。"
 hd_hanfl.4101.src:0 "事见《后汉书·列女传》：班固著《汉书》，「其八表及天文志未及竟而卒，和帝诏昭就东观藏书阁踵而成之」。"

 hd_hanfl.4111.t:0 "入东观"
 hd_hanfl.4111.desc:0 "天子下诏，召你入东观藏书阁，续成兄长未竟的《汉书》。\n\n阁中图籍堆积如山，兄长的旧稿也一并送了过来，字迹犹新。你在案前坐下，铺开竹简，从八表的第一表写起。"
 hd_hanfl.4111.a:0 "当竟先兄之业。"

 hd_hanfl.4102.t:0 "《汉书》成"
 hd_hanfl.4102.desc:0 "班昭将续成的《汉书》进呈御前。从高祖到王莽，二百余年间的纪、表、志、传，至此全部完备。\n\n书一出来，京中的学者争相传抄，却多有读不通的地方。听说连马融那样的大儒，也要伏在阁下，跟着班昭一句一句受读。"
 hd_hanfl.4102.a:0 "藏之秘府，传之后世。"
 hd_hanfl.4102.src:0 "事见《后汉书·列女传》：「时《汉书》始出，多未能通者，同郡马融伏于阁下，从昭受读。」"

 # ===== 89 蔡侯纸、宋贵人旧案 =====
 hd_hanfl.4103.t:0 "蔡侯纸"
 hd_hanfl.4103.desc:0 "尚方令蔡伦捧着一叠东西进来，请你过目。那是用树皮、麻头、破布和旧渔网捣烂了抄成的纸，薄而有韧，可以书写。\n\n从前书写多用竹简，笨重难携；用缣帛，又太贵。蔡伦说，这种纸取材低贱，天下都用得起。"
 hd_hanfl.4103.a:0 "善！颁行天下。"
 hd_hanfl.4103.b:0 "小技耳，姑且收下。"
 hd_hanfl.4103.src:0 "事见《后汉书·宦者列传》：蔡伦「用树肤、麻头及敝布、鱼网以为纸」，元兴元年奏上之，帝善其能，「自是莫不从用焉，故天下咸称『蔡侯纸』」。"

 hd_hanfl.4108.t:0 "天子嘉之"
 hd_hanfl.4108.desc:0 "你造的纸得到了天子的嘉许，诏令天下仿造。宫中尚方的工匠日夜赶制，京中的书肆也开始用纸抄书了。\n\n人们管这种纸叫「蔡侯纸」。"
 hd_hanfl.4108.a:0 "臣不敢当。"

 hd_hanfl.4104.t:0 "宋贵人旧案"
 hd_hanfl.4104.desc:0 "你亲政之后，有人翻出了当年的一桩旧案：章帝时，宋贵人被诬陷挟邪媚道，被迫饮药自尽。宋贵人是你的祖母，而当年奉窦太后之命罗织罪名的，正是如今受封龙亭侯的[hd_hanfl_cai_lun.GetTitledFirstName]。\n\n朝中的人都在看你如何处置。"
 hd_hanfl.4104.a:0 "敕令自诣廷尉。"
 hd_hanfl.4104.b:0 "事隔多年，宽免之。"
 hd_hanfl.4104.src:0 "事见《后汉书·宦者列传》：安帝亲政，「敕使自致廷尉。伦耻受辱，乃沐浴，整衣冠，饮药而死」。"

 hd_hanfl.4109.t:0 "敕诣廷尉"
 hd_hanfl.4109.desc:0 "诏书送到了你的府上：命你自诣廷尉，对质当年宋贵人一案。\n\n你知道廷尉狱是什么地方。进去了，就再难体面地出来。你造纸的功劳，天下人都记着；可这桩旧案，天子也记着。"
 hd_hanfl.4109.a:0 "沐浴整衣，饮药而死。"
 hd_hanfl.4109.b:0 "诣阙自陈，以待天裁。"
 hd_hanfl.4109.b.tt:0 "天子会再作决断。"

 hd_hanfl.4110.t:0 "蔡伦自陈"
 hd_hanfl.4110.desc:0 "[hd_hanfl_cai_lun.GetTitledFirstName]没有去廷尉，而是跪在阙下，求见天颜。他说当年之事，是奉了太后的旨意，身不由己；又说自己造纸有功于天下，求陛下念其微劳。\n\n他已经老了，伏在地上，白发散乱。"
 hd_hanfl.4110.a:0 "念其旧功，赦之。"
 hd_hanfl.4110.b:0 "罪不可赦，下廷尉狱。"

 # ===== 89 候风地动仪、陇西地动 =====
 hd_hanfl.4105.t:0 "候风地动仪"
 hd_hanfl.4105.desc:0 "太史令张衡造成了一件铜器，请你去灵台观看。器形似酒尊，周身铸着八条龙，口中各衔一枚铜丸，下面蹲着八只蟾蜍，张口向上。张衡说，哪一方地动，那一方的龙口便会吐丸，落进蟾蜍口中。\n\n左右的人都觉得新奇，也有人暗暗不以为然。"
 hd_hanfl.4105.a:0 "置于灵台，以候地动。"
 hd_hanfl.4105.b:0 "奇技之器，置之可也。"
 hd_hanfl.4105.src:0 "事见《后汉书·张衡传》：阳嘉元年，张衡「复造候风地动仪。以精铜铸成，员径八尺，合盖隆起，形似酒尊」。"

 hd_hanfl.4106.t:0 "陇西地动"
 hd_hanfl.4106.desc:0 "灵台上的地动仪忽然有一条龙吐了丸。可京师并没有人觉得地动，学者们都说这器物不灵，议论纷纷。\n\n几天之后，驿使飞马而来，奏报陇西地震。"
 hd_hanfl.4106.a:0 "神乎其技！"
 hd_hanfl.4106.b:0 "巧合而已。"
 hd_hanfl.4106.src:0 "事见《后汉书·张衡传》：「尝一龙机发而地不觉动，京师学者咸怪其无征，后数日驿至，果地震陇西，于是皆服其妙。」"

 # ===== 89 弃凉州之议 =====
 hd_hanfl.4107.t:0 "弃凉州之议"
 hd_hanfl.4107.desc:0 "羌乱连年不息，并州、凉州残破，军费把府库耗得一空。大将军邓骘在朝会上提出：凉州地远难守，不如弃之，并力经营北边。公卿多有附和的。\n\n郎中虞诩却去见太尉李脩，说先帝开拓疆土，劳苦而后得之，如今怕花费便要弃了它；凉州一弃，三辅便成了边塞，园陵就暴露在外。\n\n此事最后要由你来定。"
 hd_hanfl.4107.a:0 "弃凉州，并力北边。"
 hd_hanfl.4107.b:0 "凉州不可弃，坚守之。"
 hd_hanfl.4107.c:0 "招抚羌众，徐图安辑。"
 hd_hanfl.4107.src:0 "事见《后汉书·虞诩传》：邓骘欲弃凉州，虞诩以为「凉州既弃，即以三辅为塞；三辅为塞，则园陵单外」，又引谚曰「关西出将，关东出相」。"

 # ===== 190 坏五铢、千里草 =====
 hd_hanfl.4201.t:0 "坏五铢"
 hd_hanfl.4201.desc:0 "从长安传来的消息说，董卓下令销毁五铢钱，又把城中的铜人、钟虡都椎碎了，熔铸成小钱。新钱又小又薄，没有轮郭文章，不耐摩挲。\n\n钱一下子不值钱了，关中的谷价一日数涨，市上拿着一袋钱也买不到几斗米。"
 hd_hanfl.4201.a:0 "钱法一坏，民何以堪。"
 hd_hanfl.4201.src:0 "事见《三国志·魏书·董卓传》：卓「悉椎破铜人、钟虡，及坏五铢钱，更铸为小钱」，「于是货轻而物贵，谷一斛至数十万」。"

 hd_hanfl.4202.t:0 "千里草"
 hd_hanfl.4202.desc:0 "京中的小儿近来都在传唱一首童谣：\n\n「千里草，何青青，十日卜，不得生。」\n\n有人私下拆字：千里草是一个「董」字，十日卜是一个「卓」字。这话不敢大声说，却已经传遍了街巷。"
 hd_hanfl.4202.a:0 "童谣无端，天意可畏。"
 hd_hanfl.4202.src:0 "事见《后汉书·五行志》：献帝践祚之初，京都童谣曰「千里草，何青青，十日卜，不得生」，「案千里草为董，十日卜为卓」。"

 # ===== 190 蔡邕之死 =====
 hd_hanfl.4203.t:0 "闻卓死而叹"
 hd_hanfl.4203.desc:0 "董卓被诛的消息传来时，你正坐在司徒王允的席上。满座的人都在额手相庆，你却想起董卓当年三日之内连擢你三官，待你不薄。\n\n一声叹息几乎就要出口。"
 hd_hanfl.4203.a:0 "不觉叹息，形于颜色。"
 hd_hanfl.4203.a.tt:0 "这一声叹息，王允听见了。"
 hd_hanfl.4203.b:0 "隐忍不言。"
 hd_hanfl.4203.src:0 "事见《后汉书·蔡邕传》：「及卓被诛，邕在司徒王允坐，殊不意言之而叹，有动于色。」"

 hd_hanfl.4204.t:0 "王允收蔡邕"
 hd_hanfl.4204.desc:0 "董卓伏诛，满座称快，唯独[hd_hanfl_cai_yong.GetTitledFirstName]在席上叹了一口气，脸色也变了。\n\n你勃然大怒。董卓是国之大贼，几乎倾覆汉室，他身为王臣，不同仇敌忾，反而怀其私遇，为之伤痛，这与逆贼何异？"
 hd_hanfl.4204.a:0 "收付廷尉治罪！"
 hd_hanfl.4204.a.tt:0 "蔡邕恐将死于狱中。"
 hd_hanfl.4204.b:0 "一叹而已，宽宥之。"

 hd_hanfl.4206.t:0 "狱中"
 hd_hanfl.4206.desc:0 "你被关进了廷尉狱。公卿中有不少人替你求情，太尉马日磾也去见了王允，可王允不为所动。\n\n你想到了那部还没写完的汉史。若能留下这条命，哪怕受黥首刖足之刑，你也要把它写完。"
 hd_hanfl.4206.a:0 "乞黥首刖足，继成汉史。"
 hd_hanfl.4206.a.tt:0 "王允会再作决断。"
 hd_hanfl.4206.b:0 "默然待死。"
 hd_hanfl.4206.b.tt:0 "你将死于狱中。"

 hd_hanfl.4207.t:0 "蔡邕请继成汉史"
 hd_hanfl.4207.desc:0 "[hd_hanfl_cai_yong.GetTitledFirstName]从狱中上书，说情愿受黥首刖足之刑，只求留下性命，续成汉史。马日磾也来劝你，说蔡邕是旷世逸才，熟知汉事，杀了他，只怕会失去人望。\n\n你想起了当年武帝不杀司马迁，结果留下了一部谤书。"
 hd_hanfl.4207.a:0 "许之，令其续史。"
 hd_hanfl.4207.b:0 "不可令佞臣执笔在幼主左右。"
 hd_hanfl.4207.src:0 "事见《后汉书·蔡邕传》：王允曰「昔武帝不杀司马迁，使作谤书，流于后世。方今国祚中衰，神器不固，不可令佞臣执笔在幼主左右」，邕遂死狱中。"

 # ===== 190 张机著书 =====
 hd_hanfl.4205.t:0 "伤寒杂病论"
 hd_hanfl.4205.desc:0 "你的宗族本来人丁兴旺，可这些年疫病接连不断，族人死去了大半，其中十之七八死于伤寒。你行医多年，眼看着许多人本可以救活，却因医者不明病理而枉死。\n\n于是你勤求古训，博采众方，把平生所学所验整理成书。如今书稿已经写成了。"
 hd_hanfl.4205.a:0 "愿此书活人无数。"
 hd_hanfl.4205.src:0 "事见张机《伤寒杂病论·序》：「感往昔之沦丧，伤横夭之莫救，乃勤求古训，博采众方。」"

 # ===== 218 肉刑之议、终制 =====
 hd_hanfl.4301.t:0 "肉刑之议"
 hd_hanfl.4301.desc:0 "你召集群臣商议，要不要恢复肉刑。\n\n陈群说，自文帝废肉刑以来，该受宫刑、刖刑的人都改成了死刑，看似宽仁，其实杀人更多；不如复设肉刑，既可惩恶，又能保全性命。王朗等人却说，天下未定，复用肉刑恐失民心，等太平之后再议不迟。\n\n两边各有道理，群臣都在看你。"
 hd_hanfl.4301.a:0 "从陈群之议，复肉刑。"
 hd_hanfl.4301.b:0 "军事未罢，且寝其议。"
 hd_hanfl.4301.src:0 "事见《三国志·魏书·陈群传》：太祖议复肉刑，钟繇与陈群议同，王朗及议者多以为未可行，「太祖深善繇、群言，以军事未罢，顾众议，故且寝」。"

 hd_hanfl.4302.t:0 "终制"
 hd_hanfl.4302.desc:0 "你在首阳山东边选好了寿陵的地方。有司送来了陵寝的图样，封土要高，墓道要深，明器要备齐。\n\n你看着图样，想起了这些年见过的一座座被掘开的古墓：金玉被盗，骸骨被弃，连汉家的帝陵也没能幸免。"
 hd_hanfl.4302.a:0 "作《终制》，务从俭薄。"
 hd_hanfl.4302.b:0 "依旧制营陵。"
 hd_hanfl.4302.src:0 "事见《三国志·魏书·文帝纪》：黄初三年作《终制》曰「骨无痛痒之知，冢非栖神之宅」，「为棺椁足以朽骨，衣衾足以朽肉而已」。"

 # ===== 6.5 疫中施治 =====
 hd_hanfl.5001.t:0 "伤寒十居其七"
 hd_hanfl.5001.desc:0 "疫病在境内蔓延开来，先是发热恶寒，继而头痛身疼，不过数日便有人死去。城中棺木都卖得精光，有的人家一门尽殁，连收殓的人都没有。"
 hd_hanfl.5001.desc_zhang_ji:0 "\n\n[hd_hanfl_physician.GetTitledFirstName]求见，说此病是伤寒，辨明病在何经，按方施药，大多能救；只是药材要早备，医工要遍派到乡里去。"
 hd_hanfl.5001.desc_book:0 "\n\n你案头有一部《伤寒杂病论》。书中说此病当辨明病在何经，按方施药，大多能救；只是药材要早备，医工要遍派到乡里去。"
 hd_hanfl.5001.a:0 "依方施治，遍及乡里。"
 hd_hanfl.5001.b:0 "紧闭宫门，只顾宫中。"
 hd_hanfl.5001.src:0 "事见张机《伤寒杂病论·序》：「建安纪年以来，犹未十稔，其死亡者，三分有二，伤寒十居其七。」"

 # ===== 修正 =====
 hd_hanfl_yinsi_modifier:0 "淫祀之风"
 hd_hanfl_yinsi_modifier_desc:0 "此地乡民竞相立祠祭鬼，杀牛宰羊，倾家祷祝，巫祝借此敛财。"
 hd_hanfl_yinsi_resent_modifier:0 "毁祠之怨"
 hd_hanfl_yinsi_resent_modifier_desc:0 "官府拆毁了乡里的祠庙，乡民心中惴惴，怨言不绝。"
 hd_hanfl_xinmang_modifier:0 "新莽弊政"
 hd_hanfl_xinmang_modifier_desc:0 "钱法屡变，田不得卖，河决不塞，百姓困苦，盗贼蜂起。"
 hd_hanfl_wuzhu_modifier:0 "钱轻物贵"
 hd_hanfl_wuzhu_modifier_desc:0 "五铢钱被毁，小钱不值钱，谷价飞涨，市井萧条。"
 hd_hanfl_juanmian_modifier:0 "蠲免"
 hd_hanfl_juanmian_modifier_desc:0 "朝廷念此地民生艰难，宽免了租赋。"
 hd_hanfl_kaoke_clean_modifier:0 "吏治清明"
 hd_hanfl_kaoke_clean_modifier_desc:0 "守令清廉，案牍不留，百姓称便。"
 hd_hanfl_kaoke_harsh_modifier:0 "酷吏之治"
 hd_hanfl_kaoke_harsh_modifier_desc:0 "官府用法严峻，盗贼屏迹，百姓却畏之如虎。"
 hd_hanfl_kaoke_pearl_modifier:0 "珠还合浦"
 hd_hanfl_kaoke_pearl_modifier_desc:0 "革除了采珠的苛政，迁徙他处的珠蚌又回来了，商旅往来不绝。"
 hd_hanfl_kaoke_custom_modifier:0 "移风易俗"
 hd_hanfl_kaoke_custom_modifier_desc:0 "守令教化有方，乡里渐知礼义。"
 hd_hanfl_region_saltwell_modifier:0 "火井煮盐"
 hd_hanfl_region_saltwell_modifier_desc:0 "以火井之火煮卤成盐，盐利大兴。"
 hd_hanfl_region_waterpump_modifier:0 "水排鼓铸"
 hd_hanfl_region_waterpump_modifier_desc:0 "以水力鼓动风囊冶铁，用力少而见功多，百姓便之。"
 hd_hanfl_region_canal_modifier:0 "均水之约"
 hd_hanfl_region_canal_modifier_desc:0 "官府定下了分水的约束，上下游各得其水，乡里不再相争。"
 hd_hanfl_region_haoyou_modifier:0 "豪右擅水"
 hd_hanfl_region_haoyou_modifier_desc:0 "豪强把持了渠水，小民的田地干涸，怨声载道。"
 hd_hanfl_region_market_modifier:0 "胡市兴盛"
 hd_hanfl_region_market_modifier_desc:0 "关市大开，胡汉交易，牛马皮货络绎而来。"
 hd_hanfl_region_closed_market_modifier:0 "关市闭绝"
 hd_hanfl_region_closed_market_modifier_desc:0 "关市已闭，边塞戒严，奸人难以出入。"
 hd_hanfl_region_shanyue_modifier:0 "山越入籍"
 hd_hanfl_region_shanyue_modifier_desc:0 "出山的山越编入户籍，强壮的充作兵卒。"
 hd_hanfl_region_shanyue_war_modifier:0 "山越未平"
 hd_hanfl_region_shanyue_war_modifier_desc:0 "官军入山征讨，山越据险而守，乡里不得安宁。"
 hd_hanfl_zuiji_modifier:0 "下诏罪己"
 hd_hanfl_zuiji_modifier_desc:0 "该角色因灾异下诏罪己，减膳避殿，引过自责，心中反倒坦然了些。"
 hd_hanfl_fangbing_modifier:0 "按方救疫"
 hd_hanfl_fangbing_modifier_desc:0 "该角色依方施药，宫中早备药材，疫气难侵。"
 hd_hanfl_caihouzhi_modifier:0 "蔡侯纸"
 hd_hanfl_caihouzhi_modifier_desc:0 "新纸轻便价廉，书写抄录比竹简缣帛容易多了。"
 hd_hanfl_xianfang_modifier:0 "仙方"
 hd_hanfl_xianfang_modifier_desc:0 "该角色服了方士所献的仙方，自觉身轻体健。"
 hd_hanfl_dewu_tu_modifier:0 "土德"
 hd_hanfl_dewu_tu_modifier_desc:0 "此家以土德受命，色尚黄。"
 hd_hanfl_dewu_jin_modifier:0 "金德"
 hd_hanfl_dewu_jin_modifier_desc:0 "此家以金德受命，色尚白。"
 hd_hanfl_dewu_shui_modifier:0 "水德"
 hd_hanfl_dewu_shui_modifier_desc:0 "此家以水德受命，色尚黑。"
 hd_hanfl_dewu_mu_modifier:0 "木德"
 hd_hanfl_dewu_mu_modifier_desc:0 "此家以木德受命，色尚青。"
 hd_hanfl_dewu_huo_modifier:0 "火德"
 hd_hanfl_dewu_huo_modifier_desc:0 "此家以火德受命，色尚赤。"

 # ===== 好感 =====
 hd_hanfl_scapegoat_opinion:0 "代君受过"

 # ===== 宝物 =====
 hd_hanfl_artifact_hanshu_name:0 "汉书"
 hd_hanfl_artifact_hanshu_description:0 "班固著，班昭续成。起自高祖，终于王莽，纪、表、志、传俱备，为断代之史。书初出时，学者多读不通，马融也要伏于阁下从班昭受读。"
 hd_hanfl_artifact_yudie_name:0 "封禅玉牒"
 hd_hanfl_artifact_yudie_description:0 "封禅泰山时所用的玉牒书副本，以金绳缠束，玉检封印。正本藏在泰山坛下的石函中，书辞秘不示人。"
 hd_hanfl.1006.a.result:0 "役牒核明，[wj_duty_person.GetFirstName]获释并领得返家钱"
 hd_hanfl.1006.b.result:0 "牵连止于此牍，[wj_duty_person.GetFirstName]仍被收系待核"
 hd_hanfl.1006.c.result:0 "[wj_duty_person.GetFirstName]负伤受讯，乡里更加不安"
 hd_hanfl.1001.a.result:0 "核簿追补，短少钱谷重新用于县务"
 hd_hanfl.1001.b.result:0 "亏空实数入簿，县用仍有短缺"
 hd_hanfl.1001.c.result:0 "[wj_duty_person.GetFirstName]付钱过关，县簿仍有虚数"
 hd_hanfl.1002.a.result:0 "[wj_duty_person.GetFirstName]被收监，权门再难私领其人"
 hd_hanfl.1002.b.result:0 "[wj_duty_person.GetFirstName]收系待勘，尚未作终断"
 hd_hanfl.1002.c.result:0 "[wj_duty_other.GetFirstName]付钱领人，权门愈发无忌"
 hd_hanfl.1003.a.result:0 "[hd_hanfl_revenge_woman.GetFirstName]获免归乡，乡人感其恤情"
 hd_hanfl.1003.b.result:0 "[hd_hanfl_revenge_woman.GetFirstName]伏法，地方知其法禁"
 hd_hanfl.1003.c.result:0 "家资入囊，[hd_hanfl_revenge_woman.GetFirstName]倾产得免"
 hd_hanfl.1004.a.result:0 "另备祭物，耕牛得保，乡里生产有望"
 hd_hanfl.1004.b.result:0 "旧祭照行，乡情暂安，祭费仍损民力"
 hd_hanfl.1004.c.result:0 "馈礼入囊，祭簿上的耕牛仍未保住"
 hd_hanfl.1005.a.result:0 "养亲钱交到[wj_duty_other.GetFirstName]手中，乡评重归实处"
 hd_hanfl.1005.b.result:0 "[wj_duty_person.GetFirstName]孝名更盛，母亲仍有难言之苦"
 hd_hanfl.1005.c.result:0 "[wj_duty_person.GetFirstName]拨出乡赠，[wj_duty_other.GetFirstName]得以度日"
 hd_hanfl.1007.a.result:0 "采具修整，浮费退回，珠户渐得安业"
 hd_hanfl.1007.b.result:0 "采额暂减，珠户得歇，本县收入有所收缩"
 hd_hanfl.1007.c.result:0 "商贾付钱加额，珠户被催往深水"
 hd_hanfl.1008.a.result:0 "[wj_duty_person.GetFirstName]受雇入廷，积牍渐清"
 hd_hanfl.1008.b.result:0 "[wj_duty_person.GetFirstName]离去，待办文书继续积压"
 hd_hanfl.1008.c.result:0 "私谢入囊，[wj_duty_person.GetFirstName]留廷经手文书"
 hd_hanfl.1009.a.result:0 "[wj_duty_person.GetFirstName]释归，[wj_duty_other.GetFirstName]转入地牢"
 hd_hanfl.1009.b.result:0 "两人仍在软禁，轻重之议暂未定下"
 hd_hanfl.1009.c.result:0 "两名囚徒皆被处决，严威之下乡里失望"
 hd_hanfl.1010.a.result:0 "[wj_duty_person.GetFirstName]转入地牢，遗属领得抚恤"
 hd_hanfl.1010.b.result:0 "[wj_duty_other.GetFirstName]领得赔偿，[wj_duty_person.GetFirstName]获释"
 hd_hanfl.1010.c.result:0 "私谢入囊，凶者获释，遗属空手而归"
 hd_hanfl.1011.a.result:0 "私财抵了加派，乡人暂得喘息"
 hd_hanfl.1011.b.result:0 "[wj_duty_person.GetFirstName]照额出钱，加派之怨留在乡里"
 hd_hanfl.1011.c.result:0 "加派照收，六十金另入私囊"

 hd_hanfl.1001.adviser:0 "\n\n[wj_event_adviser.Custom2('MyCharacterIntroduction', ROOT.Char)]对过仓数，将几处朱点连在一起：“不是算错。每一笔，都有人算得很明白。”"
 hd_hanfl.1002.adviser:0 "\n\n[wj_event_adviser.Custom2('MyCharacterIntroduction', ROOT.Char)]将屡被退回的告牒展开，低声道：“有些人等的，就是官府先低头。”"
 hd_hanfl.1003.adviser:0 "\n\n[wj_event_adviser.Custom2('MyCharacterIntroduction', ROOT.Char)]翻过旧牍，低声问我：“旧案未理，如今又添一命。情与法，今日该如何两全？”"
 hd_hanfl.1004.adviser:0 "\n\n[wj_event_adviser.Custom2('MyCharacterIntroduction', ROOT.Char)]翻过祭簿，问得直截了当：“杀牛之后，明年的田，拿什么来耕？”"
 hd_hanfl.1005.adviser:0 "\n\n[wj_event_adviser.Custom2('MyCharacterIntroduction', ROOT.Char)]放下乡评，望了望母子二人：“墓前有哭声，堂上也该有饭香。”"
 hd_hanfl.1006.adviser:0 "\n\n[wj_event_adviser.Custom2('MyCharacterIntroduction', ROOT.Char)]将两牍并排：“若这一处错了，后面连上的人名，又该凭什么作准？”"
 hd_hanfl.1007.adviser:0 "\n\n[wj_event_adviser.Custom2('MyCharacterIntroduction', ROOT.Char)]取过两本账：“若珠户年年难以为继，这些经手费，往后又向谁收？”"
 hd_hanfl.1008.adviser:0 "\n\n[wj_event_adviser.Custom2('MyCharacterIntroduction', ROOT.Char)]翻着他校出的错处：“禁例须核，眼前的差务也不能只靠催字。”"
 hd_hanfl.1009.adviser:0 "\n\n[wj_event_adviser.Custom2('MyCharacterIntroduction', ROOT.Char)]把两卷重新分开：“伤验、赃验都在，不能因同日结案，便写成同一罪。”"
 hd_hanfl.1010.adviser:0 "\n\n[wj_event_adviser.Custom2('MyCharacterIntroduction', ROOT.Char)]按住赦文一角：“恩宥可以一时为之，断案却总要有据。”"
 hd_hanfl.1011.adviser:0 "\n\n[wj_event_adviser.Custom2('MyCharacterIntroduction', ROOT.Char)]按住催征簿：“私库尚可抵一部分；若照数取尽，怨与缺口却都留在县里。”"
 hd_hanfl.1003.closing:0 "\n\n我将新供与旧牍并置。堂下的女子抬起头，等着听我发话。"
 hd_hanfl.1003.e:0 "解去桎梏，来我廷中效力。"
 hd_hanfl.1003.e.result:0 "[hd_hanfl_revenge_woman.GetFirstName]受赦留廷，愿以效力报恩"
 hd_hanfl.1003.invalid:0 "案情既变，此牍撤下。"
 hd_hanfl.1003.invalid.result:0 "此案不再由你裁断"
 hd_hanfl.1003.invalid.tt:0 "任职、辖地或当事人的处境已经改变，原有裁断不再适用。"
 hd_hanfl_revenge_mercy_modifier:0 "原情慎断"
 hd_hanfl_revenge_mercy_modifier_desc:0 "官府重阅旧牍，参酌案中情由，乡人感其慎断。"
 hd_hanfl.1001.closing:0 "\n\n发簿的封泥已经备好。[wj_duty_person.GetFirstName]看着我手中的钱券，等我决定这笔旧账究竟如何了结。"
 hd_hanfl.1001.e:0 "旧账补上。你来我廷中，往后不许再作假。"
 hd_hanfl.1001.e.result:0 "[wj_duty_person.GetFirstName]补账留廷，旧习尚须提防"
 hd_hanfl.1002.closing:0 "\n\n[wj_duty_other.GetFirstName]将旧荐书向前挪了一寸。门客仍站着，仿佛这张案上只有主人的话值得听。"
 hd_hanfl.1004.closing:0 "\n\n牛低头拱着阶前的草。乡老、巫祝与出牛的人家都望了过来，等我开口。"
 hd_hanfl.1004.e:0 "严禁屠杀耕牛。官令到处，不许再索牲畜。"
 hd_hanfl.1004.e.result:0 "杀牛之祭被强行止住，乡人未尽心服"
 WJ_duty_accounts_verified_modifier:0 "簿实仓明"
 WJ_duty_accounts_verified_modifier_desc:0 "钱谷按实核定，隐去的县用追回，催征与支用渐有准数。"
 WJ_duty_accounts_deficit_modifier:0 "县用短缺"
 WJ_duty_accounts_deficit_modifier_desc:0 "钱谷亏空尚未补齐，县中征收与日常支用受到影响。"
 WJ_duty_gate_law_modifier:0 "不避权门"
 WJ_duty_gate_law_modifier_desc:0 "豪家门客也须受官府拘押，乡人渐信告牒不再只看门第。"
 WJ_duty_cattle_preserved_modifier:0 "耕牛得保"
 WJ_duty_cattle_preserved_modifier_desc:0 "祭物另备，耕牛得以留用，贫户不再因索牲而废耕。"
 WJ_duty_ritual_dispute_modifier:0 "祭议不协"
 WJ_duty_ritual_dispute_modifier_desc:0 "官府、巫祝与乡人未能议定祭礼，彼此多有猜怨。"
 WJ_duty_sacrifice_banned_modifier:0 "严禁索牲"
 WJ_duty_sacrifice_banned_modifier_desc:0 "官府以严令禁止杀牛祭神，征发受制，乡中却未尽心服。"
 hd_hanfl.1005.closing:0 "\n\n[wj_duty_person.GetFirstName]仍捧着那卷赞辞，母亲却只问可否早些回去。我的评语还未落笔。"
 hd_hanfl.1005.e:0 "可愿来我廷中听用？母亲也一并接来。"
 hd_hanfl.1005.e.result:0 "[wj_duty_person.GetFirstName]与母亲领得安置钱，一同入廷"
 hd_hanfl.1006.closing:0 "\n\n催结的签押已送到案前。放人、留勘，还是继续索供，都将从这一笔开始。"
 hd_hanfl.1006.e:0 "先解桎梏；你可愿留廷誊录，不再困在这卷供辞里？"
 hd_hanfl.1006.e.result:0 "[wj_duty_person.GetFirstName]获释留廷，旧役牒仍为清白之证"
 hd_hanfl.1007.closing:0 "\n\n[wj_duty_person.GetFirstName]掂了掂最后一枚碎珠。[wj_duty_other.GetFirstName]将另一只封好的钱袋留在账旁，等我定采额。"
 hd_hanfl.1007.e:0 "你的水路见识另有用处，可愿来我廷中听用？"
 hd_hanfl.1007.e.result:0 "[wj_duty_person.GetFirstName]领得安置钱，愿留廷听用"
 WJ_duty_filial_grounded_modifier:0 "孝行归实"
 WJ_duty_filial_grounded_modifier_desc:0 "乡评不再只听墓前哭声，奉养生亲也须拿出实据。"
 WJ_duty_pearl_rest_modifier:0 "珠户休养"
 WJ_duty_pearl_rest_modifier_desc:0 "采额暂减，珠户与近岸珠场得歇，本县眼前收入亦随之减少。"
 WJ_duty_pearl_depleted_modifier:0 "过采伤业"
 WJ_duty_pearl_depleted_modifier_desc:0 "采额催迫过甚，珠户不安，珠场与地方生计渐受损害。"
 WJ_duty_pearl_stalled_modifier:0 "珠市暂阻"
 WJ_duty_pearl_stalled_modifier_desc:0 "采价与经手费争议未定，交易滞留，本县收入和生业受到影响。"

 hd_hanfl.1008.closing:0 "\n\n[wj_duty_person.GetFirstName]把笔搁在籍册旁，袖里却露出一角封好的钱券。我还未决定让他以何种身份留下。"
 hd_hanfl.1008.e:0 "先随我入廷誊录，县署缺务另议。"
 hd_hanfl.1008.e.result:0 "[wj_duty_person.GetFirstName]领得雇直，入廷听用"
 hd_hanfl.1009.closing:0 "\n\n两人仍被收系候断。门外等着发示的差役催问，可要将两份罪目抄在同一张榜上。"
 hd_hanfl.1010.closing:0 "\n\n[wj_duty_other.GetFirstName]问我，这一次究竟是在断她家的案，还是又要留给后来人一个新例。"
 hd_hanfl.1010.e:0 "暂不援例放人，两家也不得再以私斗求断。"
 hd_hanfl.1010.e.result:0 "凶者仍被软禁，两家等候进一步断议"
 WJ_duty_clerk_ready_modifier:0 "积牍渐清"
 WJ_duty_clerk_ready_modifier_desc:0 "雇直有着，文书有人誊校，催征与差务渐能按籍办理。"
 WJ_duty_clerk_backlog_modifier:0 "案牍壅积"
 WJ_duty_clerk_backlog_modifier_desc:0 "可办事者迟迟未能补入，催办文书日积，地方差务与收入随之受损。"
 WJ_duty_measured_justice_modifier:0 "刑有轻重"
 WJ_duty_measured_justice_modifier_desc:0 "供辞与证验分别覆核，乡人渐信断议不只图一时严威。"
 WJ_duty_case_settlement_modifier:0 "两家息讼"
 WJ_duty_case_settlement_modifier_desc:0 "赔偿已交到遗属手中，怨愤暂息，乡里不再围绕此案相争。"
 WJ_duty_private_favor_modifier:0 "私谢坏公"
 WJ_duty_private_favor_modifier_desc:0 "钱财能够左右案头文书，乡人渐不信官府所断。"
 hd_hanfl.1011.closing:0 "\n\n[wj_duty_person.GetFirstName]仍捧着钱券。我的私库、他的生计和案头的期限，这一次不能各算各的。"
 hd_hanfl.1011.e:0 "先停本县催征，问责由我担。"
 hd_hanfl.1011.e.result:0 "催征暂止，声望有损，乡里记下这份担当"