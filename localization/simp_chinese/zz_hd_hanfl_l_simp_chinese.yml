 hd_hanfl_kongshi_desc_for_host:0 "$hd_hanfl_kongshi_desc$"
 activity_window_character_hd_hanfl_kongshi:0 "孔氏家主\n[Character.Custom('WJ_GetUIName')|U]"
 hd_hanfl_queli_phase_ye:0 "谒祠"
