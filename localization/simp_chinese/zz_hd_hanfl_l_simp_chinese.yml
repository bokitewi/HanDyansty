l_simp_chinese:
 # 汉代风味内容（2026-10-25）。计划：/mnt/project-files/汉代风味内容/汉代风味内容_计划.md

 # ===== 6.1 考课公务 K1~K11 =====
 hd_hanfl.kaoke.good.tt:0 "郡中当以此为善政，记入今岁考课。"
 hd_hanfl.kaoke.normal.tt:0 "此事照例录入考簿，不功不过。"
 hd_hanfl.kaoke.bad.tt:0 "此事一旦传开，考课之时恐成污点。"
 hd_hanfl.kaoke.duel_success.tt:0 "处置得宜，考课时可记上一笔。"
 hd_hanfl.kaoke.duel_failure.tt:0 "处置失当，考课时难免记过。"

 hd_hanfl.1001.t:0 "上计簿"
 hd_hanfl.1001.desc:0 "岁末上计，计吏捧着一卷簿书跪在你面前。户口、垦田、钱谷，一项项写得齐整，比去年还多出不少。\n\n你翻到后面，流民尚未归乡，荒田也未复垦，簿上的数却一笔不缺。计吏低声说，邻郡都是这样报的，上府只看簿上的数；若据实上报，今岁考课便要落在人后。\n\n朱笔悬在半空。簿书可以做得好看，一郡的户口，终究要靠人一户一户去数。"
 hd_hanfl.1001.a:0 "据实上报，自补亏空。"
 hd_hanfl.1001.b:0 "照旧例上计。"
 hd_hanfl.1001.c:0 "虚增户口，以邀上第。"
 hd_hanfl.1001.d:0 "亲核簿籍，查出真数。"
 hd_hanfl.1001.d.success:0 "乡亭簿籍一一对上，流民之数也查得明白"
 hd_hanfl.1001.d.failure:0 "簿籍多年未清，越查越乱，反误了上计之期"
 hd_hanfl.1001.src:0 "事见《汉书·宣帝纪》：黄龙元年诏曰「上计簿，具文而已，务为欺谩，以避其课」。"

 hd_hanfl.1002.t:0 "强项令"
 hd_hanfl.1002.desc:0 "县里出了命案：一个豪家的苍头白日当街杀人，事后躲进主人府中，吏卒到了门前便不敢再进。\n\n这家主人与朝中贵戚往来甚密，门客早已托人递话，说不过一个奴仆，何必伤了和气。苦主的家人却天天跪在你的府门外。\n\n你想起前代那位洛阳令，宁可叩头流血，也不肯低头认错。今日轮到你了。"
 hd_hanfl.1002.a:0 "候其出门，格杀于前。"
 hd_hanfl.1002.b:0 "具文上报，听候上司。"
 hd_hanfl.1002.c:0 "受其厚礼，纵奴不问。"
 hd_hanfl.1002.d:0 "登门理论，迫其交人。"
 hd_hanfl.1002.d.success:0 "你据法力争，那家人只得把凶奴交了出来"
 hd_hanfl.1002.d.failure:0 "你话说得太硬，豪家记恨在心，告到了你上司那里"
 hd_hanfl.1002.src:0 "事见《后汉书·酷吏列传·董宣传》：湖阳公主苍头白日杀人，匿主家，董宣候于夏门亭，叱奴下车格杀之。帝令宣叩头谢主，宣两手据地，终不肯俯，帝敕「强项令出」。"

 hd_hanfl.1003.t:0 "女子报仇"
 hd_hanfl.1003.desc:0 "一个女子披发来到县廷，手里还握着带血的刀。她说仇人杀了她的父亲，多年逍遥法外，今日在都亭前被她亲手刺死，特来自首，听凭处置。\n\n围观的人越聚越多，有人叹她孝烈，有人说杀人偿命自有王法。县丞把律令翻开摆在你案上，按律当死。\n\n那女子只是跪着，不哭，也不求。"
 hd_hanfl.1003.a:0 "解印绶，愿与俱去。"
 hd_hanfl.1003.a.tt:0 "你为她弃官的名声会传得很远，只是这一次考课无从记功。"
 hd_hanfl.1003.b:0 "依律上请，待朝廷裁断。"
 hd_hanfl.1003.c:0 "系之于狱，令其纳赎。"
 hd_hanfl.1003.d:0 "援引经义，上书求赦。"
 hd_hanfl.1003.d.success:0 "你援《春秋》复仇之义，朝廷竟准了特赦"
 hd_hanfl.1003.d.failure:0 "上府以为经义不能乱法，驳回了你的奏书"
 hd_hanfl.1003.src:0 "事见《后汉书·列女传·庞淯母》：赵娥父为同县人所杀，娥于都亭刺杀仇人，诣县自首。禄福长尹嘉义之，解印绶欲与俱亡，娥不肯去，会赦得免。"

 hd_hanfl.1004.t:0 "杀牛祭神"
 hd_hanfl.1004.desc:0 "春耕将至，乡里又在杀牛祭神。巫祝说，谁家吃了牛肉而不拿去荐神，便要得病，临死前还会学牛叫。百姓怕了，宁可把耕牛牵到祠前，也不敢不祭。\n\n年年如此，许多人家没了耕牛，只好卖田典屋，巫祝倒是越来越富。\n\n祠前香火正旺。你若禁了，百姓一时惊惧；你若不禁，来年田里怕是更少了牛。"
 hd_hanfl.1004.a:0 "移书严禁，出钱帛助耕。"
 hd_hanfl.1004.b:0 "乡俗如此，置之不问。"
 hd_hanfl.1004.c:0 "受巫祝之馈，任其祠祀。"
 hd_hanfl.1004.d:0 "亲往乡里，劝谕移风。"
 hd_hanfl.1004.d.success:0 "乡老被你说动，带头把耕牛牵回了田里"
 hd_hanfl.1004.d.failure:0 "百姓怕神甚于怕官，祠前的牛反而更多了"
 hd_hanfl.1004.src:0 "事见《后汉书·第五伦传》：「会稽俗多淫祀，好卜筮。民常以牛祭神，百姓财产以之困匮……伦到官，移书属县，晓告百姓……其后遂断绝，百姓以安。」"

 hd_hanfl.1005.t:0 "墓道孝子"
 hd_hanfl.1005.desc:0 "乡里联名举荐一人为孝廉。据说他葬亲之后不闭墓道，就住在墓道里守丧，至今已二十余年，乡邑无不称孝，州郡也几次礼请。\n\n举荐的文书写得声情并茂，功曹却私下提醒你：这样的孝子，近年各郡都举出过几个，有的守着墓道，家里照样生儿育女。\n\n今岁察举的名额，只有一个。"
 hd_hanfl.1005.a:0 "亲往墓道，问其妻子。"
 hd_hanfl.1005.a.tt:0 "若是虚名，你会当场揭破；若是真孝，你也不至错过。"
 hd_hanfl.1005.b:0 "依乡评举之。"
 hd_hanfl.1005.c:0 "受其家馈赠，荐之于朝。"
 hd_hanfl.1005.d:0 "遣人暗访其家。"
 hd_hanfl.1005.d.success:0 "暗访的人回报，墓道里的孝子早在服中生了好几个儿子"
 hd_hanfl.1005.d.failure:0 "暗访的人被乡里认出，反传你不敬孝子"
 hd_hanfl.1005.src:0 "事见《后汉书·陈蕃传》：赵宣葬亲而不闭埏隧，居其中行服二十余年，「而宣五子皆服中所生」，蕃遂致其罪。时谚又云「举秀才，不知书；察孝廉，父别居」（《抱朴子·审举》）。"

 hd_hanfl.1006.t:0 "大狱牵连"
 hd_hanfl.1006.desc:0 "京中大狱又起，主犯在狱中受刑不过，供出了一长串名字。名单辗转送到你的案头，郡中有十几户人家都在上面，限期拘捕。\n\n其中几位你是认得的，平日并无劣迹，与主犯也素无往来。狱吏说，这名单是犯人随口攀扯的，可谁也不敢说破；替人鸣冤，便是自居同党。\n\n名单墨迹犹新，捕役已在门外候命。"
 hd_hanfl.1006.a:0 "冒死上书，为之陈冤。"
 hd_hanfl.1006.b:0 "依名单拘捕。"
 hd_hanfl.1006.c:0 "借机株连，以报宿怨。"
 hd_hanfl.1006.d:0 "只拘首犯，余者缓之。"
 hd_hanfl.1006.d.success:0 "你只拘了确有实证的人，上府也没有深究"
 hd_hanfl.1006.d.failure:0 "上府认为你有意包庇，严词责问"
 hd_hanfl.1006.src:0 "事见《后汉书·寒朗传》：楚狱辞所连及，朗心伤其冤，上言诸人无奸、专为颜忠王平所诬，曰「臣知言之必族，然不敢自欺」。后二日，明帝亲幸洛阳狱录囚徒，理出千余人。"

 hd_hanfl.1007.t:0 "珠还合浦"
 hd_hanfl.1007.desc:0 "郡里不产谷米，百姓靠采珠换粮。前几任太守贪得无厌，逼着珠民没日没夜地采，珠蚌渐渐迁到了邻郡的海里。\n\n如今商旅不来，米价飞涨，路边已有饿死的人。上府的文书却照旧催要贡珠，一颗也不肯少。\n\n海边的珠民望着你，像是在等一句话。"
 hd_hanfl.1007.a:0 "禁绝滥采，复其旧规。"
 hd_hanfl.1007.b:0 "照数征珠。"
 hd_hanfl.1007.c:0 "加派珠户，多采以献。"
 hd_hanfl.1007.d:0 "召集商贾，议定珠价。"
 hd_hanfl.1007.d.success:0 "商贾见有利可图，又开始往来郡中"
 hd_hanfl.1007.d.failure:0 "商贾压价太狠，珠民反倒更苦了"
 hd_hanfl.1007.src:0 "事见《后汉书·循吏列传·孟尝传》：「先时宰守并多贪秽，诡人采求，不知纪极，珠遂渐徙于交阯郡界……尝到官，革易前敝……曾未逾岁，去珠复还。」"

 hd_hanfl.1008.t:0 "三互之禁"
 hd_hanfl.1008.desc:0 "属县长吏出缺已经大半年，迟迟补不上人。按朝廷的回避之法，婚姻之家不得相互监临，后来又加了三互之禁，层层禁忌，合格的人几乎挑不出来。\n\n县里没有长官，盗贼渐起，词讼堆积。功曹拿来几个名字，都是能吏，可每一个都犯了某条禁忌。\n\n你若破例举用，上府追究起来，便是你担干系。"
 hd_hanfl.1008.a:0 "自请变通，责在吾身。"
 hd_hanfl.1008.b:0 "谨守禁令，宁缺勿滥。"
 hd_hanfl.1008.c:0 "以亲故权署其职。"
 hd_hanfl.1008.d:0 "上书朝廷，请宽禁令。"
 hd_hanfl.1008.d.success:0 "朝廷准了你的奏请，属县总算补上了长吏"
 hd_hanfl.1008.d.failure:0 "朝议以为成法不可轻改，你的奏书石沉大海"
 hd_hanfl.1008.src:0 "事见《后汉书·蔡邕传》：「至是复有三互法，禁忌转密，选用艰难。幽、冀二州，久缺不补。」邕上疏言「三互之禁，禁之薄者」，书奏不省。"

 hd_hanfl.1009.t:0 "磔尸示众"
 hd_hanfl.1009.desc:0 "上府新来的长官以严酷出名，到任不过数月，便杀了许多人。他把犯人的尸首放在车上，写明罪名，一县一县拉去示众；入夏腐烂了，就用绳子把骨头串起来接着走。\n\n他写信给你，说你郡中盗贼不绝，是因为下手太软，叫你照他的法子办。信末还说，考课的时候，他会记得谁听话。\n\n你的狱中正关着几个尚未定罪的人。"
 hd_hanfl.1009.a:0 "宽猛相济，婉拒其意。"
 hd_hanfl.1009.b:0 "勉强从命，择重者行之。"
 hd_hanfl.1009.c:0 "效其酷烈，以威服众。"
 hd_hanfl.1009.d:0 "阳奉阴违，敷衍其事。"
 hd_hanfl.1009.d.success:0 "你报上去的文书做得周全，上府没有看出破绽"
 hd_hanfl.1009.d.failure:0 "上府察觉你在敷衍，来信严加斥责"
 hd_hanfl.1009.src:0 "事见《后汉书·酷吏列传·王吉传》：「凡杀人皆磔尸车上，随其罪目，宣示属县。夏月腐烂，则以绳连其骨，周遍一郡乃止，见者骇惧。」"

 hd_hanfl.1010.t:0 "轻侮之法"
 hd_hanfl.1010.desc:0 "一个年轻人当街杀了人。他说死者辱骂他的父亲，他忍无可忍。\n\n讼师援引前朝成例：先帝曾赦过一个为父雪辱而杀人的人，此后便以此为比，称作轻侮之法，照此他可以免死。也有人说，若人人以受辱为由杀人，往后行凶的只要编一句辱骂的说辞就够了。\n\n死者的家人在堂下哭，凶手的家人也在堂下哭。"
 hd_hanfl.1010.a:0 "依律论罪，上书驳之。"
 hd_hanfl.1010.b:0 "援轻侮之比，免其一死。"
 hd_hanfl.1010.c:0 "受其家贿，改判轻罪。"
 hd_hanfl.1010.d:0 "援经义折中，量刑而断。"
 hd_hanfl.1010.d.success:0 "你的判词引经据典，两家都无话可说"
 hd_hanfl.1010.d.failure:0 "你的折中两头不讨好，两家都告到了上府"
 hd_hanfl.1010.src:0 "事见《后汉书·张敏传》：建初中有人侮辱人父者，其子杀之，肃宗贳其死刑，「自后因以为比，是时遂定其议，以为轻侮法」。敏驳议曰：「夫轻侮之法，先帝一切之恩，不有成科班之律令也。」"

 hd_hanfl.1011.t:0 "修宫钱"
 hd_hanfl.1011.desc:0 "朝廷的诏书到了：凡郡守县令，都要缴纳助军修宫钱，新除者更须先缴，才许赴任。摊到你头上的数目大得吓人，远非俸禄所能支应。\n\n前些日子，邻郡一位以清廉著称的太守接到同样的诏书，叹道为民父母反要割剥百姓，行至半途，服药自尽了。\n\n郡中的仓吏已经开始算，摊到每户该出多少。"
 hd_hanfl.1011.a:0 "倾家输纳，不取于民。"
 hd_hanfl.1011.b:0 "摊派于民，如数缴纳。"
 hd_hanfl.1011.c:0 "加倍搜刮，以饱私囊。"
 hd_hanfl.1011.d:0 "上书极谏，请罢此钱。"
 hd_hanfl.1011.d.success:0 "你的奏书言辞恳切，朝廷竟暂缓了你郡中的修宫钱"
 hd_hanfl.1011.d.failure:0 "奏书被宦官压下，你反落了个不识时务的名声"
 hd_hanfl.1011.src:0 "事见《后汉书·宦者列传·张让传》：钜鹿太守司马直新除，被诏减责三百万，怅然曰「为民父母，而反割剥百姓，以称时求，吾不忍也」，行至孟津，上书极陈当世之失，即吞药自杀。书奏，帝为暂绝修宫钱。"


 # ===== D5 天人感应 =====
 hd_hanfl.1101.t:0 "灾异示警"
 hd_hanfl.1101.desc_disaster:0 "地方的奏报接连送进宫来：山崩地裂，河水决溢，田庐漂没，饥民塞路。太史令跪在阶下，说天降灾异，是在谴告人君。\n\n朝中议论纷纷。有人说该下诏罪己，有人说灾异责在三公，也有人说这不过是天时偶然，不必大惊小怪。\n\n群臣都在等你开口。"
 hd_hanfl.1101.desc_eclipse:0 "日中之时，天色忽然暗了下来，太阳缺了一角，渐渐被吞去大半。宫中钟鼓齐鸣，百官伐鼓救日，乱作一团。\n\n太史令奏道：日者，人君之象；日有食之，是阴侵阳、臣掩君之兆。朝中议论纷纷，有人说该下诏罪己，有人说灾异责在三公。\n\n群臣都在等你开口。"
 hd_hanfl.1101.desc_comet:0 "一连数夜，西北天际出现了一颗长尾的星，光芒扫过紫微垣。太史令说，这是彗星，主除旧布新，又主兵丧。\n\n消息传开，京中人心惶惶，市井间已有了谶语。朝中议论纷纷，有人说该下诏罪己，有人说灾异责在三公。\n\n群臣都在等你开口。"
 hd_hanfl.1101.a:0 "下诏罪己，减膳避殿。"
 hd_hanfl.1101.b:0 "灾异之咎，三公当之。"
 hd_hanfl.1101.c:0 "下诏求直言极谏之士。"
 hd_hanfl.1101.c.tt:0 "过些日子，会有人上书指斥时政。"
 hd_hanfl.1101.d:0 "天道远，人道迩，置之不问。"
 hd_hanfl.1101.src:0 "事见《汉书·文帝纪》：日食之后诏曰「人主不德，布政不均，则天示之灾，以诫不治」，令举贤良方正能直言极谏者。"
 hd_hanfl.1101.b.src:0 "事见《后汉书·徐防传》：永初元年，以寇贼雨水，策免太尉徐防，「凡三公以灾异免，始自防也」。"

 hd_hanfl.1102.t:0 "直言极谏"
 hd_hanfl.1102.desc:0 "求言的诏书下了月余，[hd_hanfl_zhijian.GetTitledFirstName]的奏书送到了你的案前，写得满满当当。\n\n奏书里说，灾异之起，是因为宫中用度奢靡，近臣专权，郡国赋敛无度；又说百姓困苦，皆在朝廷，不在天时。有几句话说得极重，近侍念到一半便不敢再念下去。\n\n[hd_hanfl_zhijian.GetFirstName]在殿外候着，听候发落。"
 hd_hanfl.1102.a:0 "忠言逆耳，朕当纳之。"
 hd_hanfl.1102.b:0 "妄议朝政，斥退之。"

 hd_hanfl.1103.t:0 "策免"
 hd_hanfl.1103.desc:0 "使者捧着策书来到你的府上。策书里说天降灾异，阴阳失和，你身居三公之位，燮理无方，即日免官。\n\n你知道天象与你无干。可灾异总要有人担着，[hd_hanfl_emperor.GetTitledFirstName]选了你。\n\n你交还印绶的时候，门外已经冷清了下来。"
 hd_hanfl.1103.a:0 "臣之罪也。"

 hd_hanfl.1104.t:0 "祥瑞"
 hd_hanfl.1104.desc_intro:0 "[hd_hanfl_reporter.GetTitledFirstName]派人飞马入京，奏称境内出现了祥瑞："
 hd_hanfl.1104.desc_dragon:0 "有黄龙见于郡中陂泽，鳞甲灿然，乡民数百人亲眼所见。"
 hd_hanfl.1104.desc_ganlu:0 "甘露降于郡中林木，凝如膏脂，味甘如饴。"
 hd_hanfl.1104.desc_phoenix:0 "有凤凰集于郡中高树，群鸟随之，数日方去。"
 hd_hanfl.1104.desc_jiahe:0 "郡中田里生出嘉禾，一茎九穗，连根献上。"
 hd_hanfl.1104.desc_end:0 "\n\n奏书说，这是圣德感天所致，请群臣上表称贺。朝中已有人在拟贺表了，也有几位老臣面色不豫。"
 hd_hanfl.1104.a:0 "天降嘉瑞，受群臣之贺。"
 hd_hanfl.1104.b:0 "因瑞改元，以应天命。"
 hd_hanfl.1104.c:0 "祥瑞不足恃，斥为虚饰。"
 hd_hanfl.1104.src:0 "事见《论衡·讲瑞》：王充以为「瑞物皆起和气而生，生于常类之中」，郡国所上符瑞，未必真是天降。"

 hd_hanfl.1105.t:0 "祥瑞造假"
 hd_hanfl.1105.desc:0 "当年[hd_hanfl_reporter.GetTitledFirstName]奏报的那桩祥瑞，如今有了下文。有人告发，所谓祥瑞，原是他命人连夜布置的；见过的乡民，也都收过他的钱。\n\n此事已经传遍京中。当年领头上表称贺的，正是朝中重臣；改元的诏书，也早已颁行天下。\n\n若是追究，便要承认当日受贺有误；若不追究，此后人人都会去造祥瑞。"
 hd_hanfl.1105.a:0 "欺天罔上，下狱问罪。"
 hd_hanfl.1105.b:0 "事已至此，隐忍不发。"

 # ===== D9 毁淫祀 =====
 hd_hanfl_destroy_yinsi_decision:0 "禁断淫祀"
 hd_hanfl_destroy_yinsi_decision_desc:0 "辖境之内，祠祀泛滥，巫祝以鬼神诈怖愚民，百姓的财产大半耗在祠前。前代循吏常以毁淫祀为善政，可百姓未必领情。"
 hd_hanfl_destroy_yinsi_decision_tooltip:0 "下令拆毁境内不在祀典的祠庙。"
 hd_hanfl_destroy_yinsi_decision_confirm:0 "毁之"
 hd_hanfl_destroy_yinsi_decision_effect_tooltip:0 "你直辖各县的「淫祀之风」都会除去。祠庙拆后，百姓是安是怨，要过些日子才知道。"
 hd_hanfl.1201.t:0 "毁祠"
 hd_hanfl.1201.desc:0 "吏卒拿着你的文书下到乡里，把那些不在祀典的祠庙一座座拆了，神像推倒，祭器收官，巫祝逐出境外。"
 hd_hanfl.1201.desc_chengyang:0 "济南境内的城阳景王祠，据说有六百余所。前相在任时曾把它们尽数毁去，去官之后，祠祀又一处处兴了起来，商人还用二千石的车服扮作景王出巡。你的吏卒这一回又把它们拆了，神像推倒，巫祝逐出境外。"
 hd_hanfl.1201.desc_calm:0 "\n\n起初乡里颇有些惶恐，过了一季，也不见有什么灾祸。百姓省下了祭祀的钱，春耕时多了几头耕牛。"
 hd_hanfl.1201.desc_curse:0 "\n\n被逐的巫祝临走前当街诅咒你，说神必降祸。你嘴上不说，夜里却总睡不安稳。"
 hd_hanfl.1201.desc_resent:0 "\n\n乡里的老人说，祖宗几代都在那里祭祀，如今连个祈雨的地方都没有了。怨言渐渐多了起来。"
 hd_hanfl.1201.a:0 "移风易俗，非一日之功。"
 hd_hanfl.1201.b:0 "出钱抚恤，另立社坛以安民心。"
 hd_hanfl.1201.src:0 "事见《三国志·魏书·武帝纪》注引《魏书》：济南城阳景王祠，「至六百余祠，贾人或假二千石舆服导从作倡乐」，曹操为济南相，皆毁坏祠屋，止绝官吏民不得祠祀。"

 # ===== D11 定德运 =====
 hd_hanfl.1301.t:0 "五德之次"
 hd_hanfl.1301.desc_intro:0 "新朝初建，太史令与博士们连日争论一件事：本朝当承何德，服色尚何，正朔用何。\n\n"
 hd_hanfl.1301.desc_prev_huo:0 "前朝以火德王。老博士引刘向父子之说，五德相生，火生土，本朝当以土德继之，色尚黄。也有人说五德之说本无定论，何必拘泥。"
 hd_hanfl.1301.desc_prev_tu:0 "前朝以土德王。老博士引刘向父子之说，五德相生，土生金，本朝当以金德继之，色尚白。也有人说五德之说本无定论，何必拘泥。"
 hd_hanfl.1301.desc_prev_jin:0 "前朝以金德王。老博士引刘向父子之说，五德相生，金生水，本朝当以水德继之，色尚黑。也有人说五德之说本无定论，何必拘泥。"
 hd_hanfl.1301.desc_prev_shui:0 "前朝以水德王。老博士引刘向父子之说，五德相生，水生木，本朝当以木德继之，色尚青。也有人说五德之说本无定论，何必拘泥。"
 hd_hanfl.1301.desc_prev_mu:0 "前朝以木德王。老博士引刘向父子之说，五德相生，木生火，本朝当以火德继之，色尚赤。也有人说五德之说本无定论，何必拘泥。"
 hd_hanfl.1301.desc_prev_none:0 "本朝并非受禅于谁，无所承继。博士们各执一词，有说当法天之运的，有说当顺地之宜的，吵了几日也没有结论。"
 hd_hanfl.1301.tu:0 "以土德王，色尚黄。"
 hd_hanfl.1301.jin:0 "以金德王，色尚白。"
 hd_hanfl.1301.shui:0 "以水德王，色尚黑。"
 hd_hanfl.1301.mu:0 "以木德王，色尚青。"
 hd_hanfl.1301.huo:0 "以火德王，色尚赤。"
 hd_hanfl_dewu_right_tt:0 "合五德相生之次，天下以为得正。"
 hd_hanfl_dewu_wrong_tt:0 "不合五德之次，儒生私下议论。"

 # ===== 6.3 州郡风物 =====
 hd_hanfl.2001.t:0 "火井"
 hd_hanfl.2001.desc:0 "临邛山中有一口井，井中有火。乡人用竹筒把井里的气引出来，一点就着，拿来煮盐，比柴火旺得多。\n\n盐官说，若多开几口这样的井，郡中的盐利能翻上一番。可乡里的老人说，火井是山神的口，开得多了，山神要发怒。"
 hd_hanfl.2001.a:0 "广开盐井，以足国用。"
 hd_hanfl.2001.b:0 "敬畏山川，不扰其地。"
 hd_hanfl.2001.src:0 "事见《华阳国志·蜀志》：临邛县「有火井，夜时光映上昭。民欲其火，先以家火投之，顷许如雷声，火焰出，通耀数十里，以竹筒盛其光藏之，可拽行终日不灭也」。"

 hd_hanfl.2002.t:0 "蜀锦"
 hd_hanfl.2002.desc:0 "成都锦官城里机杼声日夜不绝。新织成的锦在江水里一濯，颜色越发鲜明，别处的水便濯不出这样的光彩。\n\n锦官送来了今年的新样，说京中的贵人争着要，价比黄金。"
 hd_hanfl.2002.a:0 "命锦官多织，售之四方。"
 hd_hanfl.2002.b:0 "以锦分赐将吏。"
 hd_hanfl.2002.src:0 "事见《华阳国志·蜀志》：成都「其道西城，故锦官也。锦工织锦，濯以江流而鲜明，他江则不好，故命曰锦里也」。"

 hd_hanfl.2003.t:0 "水排"
 hd_hanfl.2003.desc:0 "郡中的冶铁作坊用上了一种新器：借流水转动轮轴，推动皮囊鼓风，不用再让人或马整日踩踏。一处作坊省下的人力，抵得上从前几十人。\n\n据说是前代一位太守创制的，百姓感念他，叫他杜母。工匠问你，要不要在郡中各处都造起来。"
 hd_hanfl.2003.a:0 "推广水排，以利铸冶。"
 hd_hanfl.2003.b:0 "恐伤农时，徐徐图之。"
 hd_hanfl.2003.src:0 "事见《后汉书·杜诗传》：杜诗为南阳太守，「造作水排，铸为农器，用力少，见功多，百姓便之」，时人方于召信臣，「故南阳为之语曰：前有召父，后有杜母」。"

 hd_hanfl.2004.t:0 "争水"
 hd_hanfl.2004.desc:0 "入夏久旱，渠水一日比一日浅。上游的豪家把渠口堵了大半，下游的田里已经裂开了口子。两边的人在渠边打了起来，伤了好几个。\n\n这条渠是前代修的，歌谣里还唱着「郑国在前，白渠起后」。如今渠还在，规矩却没人守了。"
 hd_hanfl.2004.a:0 "立石定规，均水于民。"
 hd_hanfl.2004.b:0 "豪右多力，从其所请。"
 hd_hanfl.2004.src:0 "事见《汉书·沟洫志》：白渠成，民歌之曰「田于何所？池阳谷口。郑国在前，白渠起后……衣食京师，亿万之口」。"

 hd_hanfl.2005.t:0 "烽燧"
 hd_hanfl.2005.desc:0 "半夜里，塞上燃起了烽火，一座接一座，从居延一直传到你的城下。戍卒说，匈奴的骑兵在塞外游弋，不知是来劫掠，还是来探虚实。\n\n天亮时，烽燧上的戍卒送来了一束简牍，上面记着几更几点见敌几人，字迹潦草，却一丝不苟。"
 hd_hanfl.2005.a:0 "亲巡亭燧，以壮士气。"
 hd_hanfl.2005.b:0 "核其簿籍，以明虚实。"
 hd_hanfl.2005.src:0 "事见居延汉简《塞上烽火品约》：敌人入塞，昼举烽、夜举火，以敌之多少、远近为品，「燔一积薪」「燔二积薪」，各有定制。"

 hd_hanfl.2006.t:0 "悬泉置"
 hd_hanfl.2006.desc:0 "敦煌东边的悬泉置迎来了一队西域使者，车马驼队排出好远，说是要入京朝贡。置中的厨啬夫愁眉苦脸地来报：使者人多，粮草和酒肉都不够了，按例只能供给几日。\n\n使者的首领倒是十分客气，送来了几匹好马，说久闻中国富庶。"
 hd_hanfl.2006.a:0 "厚加款待，以示怀远。"
 hd_hanfl.2006.b:0 "循例供给，不失其礼。"
 hd_hanfl.2006.src:0 "事见敦煌悬泉置汉简：置中有《过长罗侯费用簿》等，逐项记载过往使者、官吏的饭食酒肉与马匹刍茭，是汉代驿置的实账。"

 hd_hanfl.2007.t:0 "胡市"
 hd_hanfl.2007.desc:0 "上谷宁城的胡市又开了。乌桓、鲜卑的人赶着牛羊马匹，换取汉地的缯帛和铁器。市上人声鼎沸，也有人趁乱刺探塞内的虚实。\n\n护乌桓校尉的属吏来问：今年的胡市，是照旧开着，还是关了以防奸细？"
 hd_hanfl.2007.a:0 "开市通货，以羁縻之。"
 hd_hanfl.2007.b:0 "闭市严防，以绝奸细。"
 hd_hanfl.2007.src:0 "事见《后汉书·乌桓鲜卑列传》：建武年间复置护乌桓校尉于上谷宁城，「开营府，并领鲜卑，赏赐质子，岁时互市焉」。"

 hd_hanfl.2008.t:0 "凉州三明"
 hd_hanfl.2008.desc:0 "羌人又反了，从陇西一直扰到三辅。凉州的将吏聚在你的帐中，各执一词。\n\n有人说当学皇甫规，以恩信招抚，羌人也是人，逼急了才反；有人说当学张奂，恩威并用，先打后抚；也有人说当学段颎，羌人反复无常，非尽诛不可。三人都是凉州出身，时人号为凉州三明。"
 hd_hanfl.2008.a:0 "推以恩信，招而抚之。"
 hd_hanfl.2008.b:0 "恩威并用，先剿后抚。"
 hd_hanfl.2008.c:0 "长矛挟胁，白刃加颈。"
 hd_hanfl.2008.src:0 "事见《后汉书·皇甫张段列传》：皇甫规字威明、张奂字然明、段颎字纪明，并知名，「显达京师，称为凉州三明」。段颎上言「臣以为狼子野心，难以恩纳……唯当长矛挟胁，白刃加颈耳」。"

 hd_hanfl.2009.t:0 "荀氏八龙"
 hd_hanfl.2009.desc:0 "颍川荀氏的老家主有八个儿子，个个有才名，乡里称为八龙。县令把他们住的里巷改名作高阳里，说是比古时的高阳氏才子。\n\n荀家的子弟如今多在郡中，有人劝你礼聘一两位入府；也有人提醒你，名门子弟眼界高，未必肯屈就。"
 hd_hanfl.2009.a:0 "备礼延聘，以重儒雅。"
 hd_hanfl.2009.b:0 "名族自重，敬而远之。"
 hd_hanfl.2009.src:0 "事见《后汉书·荀淑传》：荀淑有子八人，「并有名称，时人谓之八龙」。县令苑康以昔高阳氏有才子八人，遂署其里为高阳里。"

 hd_hanfl.2010.t:0 "太学"
 hd_hanfl.2010.desc:0 "洛阳城南的太学里，诸生多到了三万余人。讲堂里经义没人细听，廊下倒是热闹：品评公卿，议论朝政，一句话说得漂亮，转眼就传遍京城。\n\n博士们向你抱怨，章句之学日渐疏废，诸生只会浮华交游。诸生却说，天下的清议，就在太学。"
 hd_hanfl.2010.a:0 "正其章句，以崇实学。"
 hd_hanfl.2010.b:0 "清议所在，任其议论。"
 hd_hanfl.2010.src:0 "事见《后汉书·儒林列传》：顺帝更修黉宇，「自是游学增盛，至三万余生。然章句渐疏，而多以浮华相尚，儒者之风盖衰矣」。"

 hd_hanfl.2011.t:0 "方士"
 hd_hanfl.2011.desc:0 "一个自称从海上仙山回来的方士登门求见。他说东海中有蓬莱、方丈、瀛洲三山，山上有不死之药，只要备下楼船童男童女，他愿再走一趟。\n\n他还当场献上一丸丹药，说服之可以延年。左右的人将信将疑，有人想起了当年徐福的故事。"
 hd_hanfl.2011.a:0 "姑且信之，求其仙方。"
 hd_hanfl.2011.a.success:0 "那丸丹药服下，你竟觉得身子轻快了许多"
 hd_hanfl.2011.a.failure:0 "方士拿了钱财，从此再没有回来"
 hd_hanfl.2011.b:0 "神仙之说，皆妄也。"
 hd_hanfl.2011.src:0 "事见《史记·秦始皇本纪》：齐人徐市等上书，言海中有三神山，名曰蓬莱、方丈、瀛洲，仙人居之，请得斋戒，与童男女求之。"

 hd_hanfl.2012.t:0 "山越"
 hd_hanfl.2012.desc:0 "山里的越人又出来了。他们依山阻险，不纳王租，平日躲在深山里种田冶铁，年景不好就下山劫掠。郡兵追进山里，往往连人影都找不到。\n\n郡中的将吏说，与其年年追剿，不如招他们出山，编户为民，强壮的还能补作兵员；也有人说，越人反复，只能打。"
 hd_hanfl.2012.a:0 "招其出山，编为兵户。"
 hd_hanfl.2012.b:0 "发兵入山，进剿之。"
 hd_hanfl.2012.src:0 "事见《三国志·吴书·诸葛恪传》：丹杨山险，民多果劲，「其幽邃民人，未尝入城邑，对长吏，皆仗兵野逸」。恪围而不战，俟其谷稼将熟，纵兵芟刈，山民饥穷，渐出降首，得甲士四万。"


 # ===== A4 幸阙里：活动 =====
 activity_hd_hanfl_queli:0 "幸阙里"
