 hd_hanfl_queli_phase_hui:0 "大会孔氏"
 hd_hanfl_queli_phase_hui_desc:0 "召见孔氏子孙，加以恩赏。"
 hd_hanfl_queli_phase_jiang:0 "请讲经"
 hd_hanfl_queli_phase_jiang_desc:0 "命儒者讲《论语》，讲毕车驾还宫。"

 # ===== A4 幸阙里：事件 =====
 hd_hanfl.3001.t:0 "谒祠"
 hd_hanfl.3001.desc:0 "孔子旧宅前，陈设着太牢之礼，牛、羊、豕各一。堂上奉着孔子与七十二弟子的神位，香烟缭绕。乐工奏起六代之乐，钟磬之声在庭院里回荡。\n\n有司请你示下：是亲自登堂行礼，还是依旧例遣大臣代祭？"
 hd_hanfl.3001.a:0 "亲升堂上，再拜先师。"
 hd_hanfl.3001.b:0 "遣大臣代祭，礼不可废。"
 hd_hanfl.3001.src:0 "事见《后汉书·儒林列传》：元和二年，章帝东巡还过鲁，幸阙里，以太牢祠孔子及七十二弟子，作六代之乐，大会孔氏男子，命儒者讲《论语》。"

 hd_hanfl.3002.t:0 "大会孔氏"
 hd_hanfl.3002.desc:0 "孔氏子孙齐集堂下，长幼有序。[hd_hanfl_kong.GetTitledFirstName]上前谢恩，说陛下亲屈万乘，辱临敝里，是崇礼先师、增辉圣德，至于孔氏的荣光，实在不敢承当。\n\n你听了大笑。当年章帝也听过这样的话，他说：「非圣者子孙，焉有斯言乎！」\n\n左右都看着你，等你加恩。"
 hd_hanfl.3002.a:0 "赐以爵秩，荣其宗族。"
 hd_hanfl.3002.b:0 "赐钱帛，以养先师之后。"
 hd_hanfl.3002.c:0 "出孔子屐，与之共观。"
 hd_hanfl.3002.d:0 "孔氏无人，怅然而罢。"

 hd_hanfl.3003.t:0 "请讲经"
 hd_hanfl.3003.desc:0 "讲席设在孔子旧堂。[hd_hanfl_kong.GetTitledFirstName]正襟危坐，从「学而时习之」讲起，一章一章讲下去。随驾的公卿、近侍都屏息听着，连堂外的老人也挤在门边。\n\n讲到「为政以德，譬如北辰」一章，你想起了朝中的许多事。"
 hd_hanfl.3003.a:0 "圣人之道，朕当铭之。"

 # ===== A5 狩猎 =====
 hd_hanfl.3101.t:0 "上林校猎"
 hd_hanfl.3101.desc:0 "苑中旌旗蔽野，属车千乘，羽林郎执戟夹道。猎犬撒开，鹰隼升空，虎豹在林间奔突，鹿群被赶向围场。\n\n随行的文士已经备好了笔札，说今日之盛，正好作一篇赋。左右也在劝你亲自驰射，以壮声势。"
 hd_hanfl.3101.a:0 "引弓驰射，亲逐猛兽。"
 hd_hanfl.3101.b:0 "命文士作赋，以记其盛。"
 hd_hanfl.3101.src:0 "事见《汉书·司马相如传》：相如作《上林赋》，极言天子校猎之盛，卒章却借天子之口叹道「嗟乎，此泰奢侈」，以为讽谏。"

 hd_hanfl.3102.t:0 "羽林郎"
 hd_hanfl.3102.desc:0 "围场里一头野彘冲破了阵脚，从骑纷纷避让。[hd_hanfl_yulin.GetTitledFirstName]纵马迎上去，一矛刺中，翻身下马，又补了一刀。\n\n你在高处看得清楚。这人年纪尚轻，身手却好。"
 hd_hanfl.3102.a:0 "壮哉！擢为羽林郎。"
 hd_hanfl.3102.b:0 "匹夫之勇，不足道也。"

 # ===== A5 宴会 =====
 hd_hanfl.3111.t:0 "角抵百戏"
 hd_hanfl.3111.desc:0 "酒过三巡，伶人入场。角抵之士赤膊相扑，跳丸者手中七丸上下翻飞，走索的女伎在绳上往来如履平地。最后一出是鱼龙曼延，彩布扎成的巨鱼在庭中翻腾，转眼化作一条黄龙。\n\n满座喝彩。也有一两位老臣低头饮酒，不发一言。"
 hd_hanfl.3111.a:0 "厚赏伶人，与众同乐。"
 hd_hanfl.3111.b:0 "百戏靡费，撤之。"
 hd_hanfl.3111.src:0 "事见《汉书·武帝纪》：元封三年春，「作角抵戏，三百里内皆观」。"

 hd_hanfl.3112.t:0 "六博"
 hd_hanfl.3112.desc:0 "席间有人摆出了博局。[hd_hanfl_bo_rival.GetTitledFirstName]拱手相邀，说愿与你对博一局，以助酒兴。\n\n掷箸、行棋、枭散，一局下来，输赢往往只在一念之间。围观的人已经下了注。"
 hd_hanfl.3112.a:0 "请！以钱为注。"
 hd_hanfl.3112.a.success:0 "你连枭两棋，满座称妙"
 hd_hanfl.3112.a.failure:0 "你一着失算，输得干干净净"
 hd_hanfl.3112.b:0 "博戏争道，易生嫌隙，不博。"
 hd_hanfl.3112.src:0 "事见《史记·吴王濞列传》：吴太子入见，侍皇太子饮博，「争道，不恭，皇太子引博局提吴太子，杀之」，吴楚之祸由此而起。"

 hd_hanfl.3113.t:0 "斗鸡走狗"
 hd_hanfl.3113.desc:0 "后庭传来一阵哄笑。[hd_hanfl_wanku.GetTitledFirstName]和几个少年把斗鸡抱进了园子，正比谁家的鸡距更利、谁家的狗跑得更快。赌注一回比一回大。\n\n见你过来，众人一时都住了手。"
 hd_hanfl.3113.a:0 "也押一注，与诸君同乐。"
 hd_hanfl.3113.b:0 "少年游荡，正色训诫。"
 hd_hanfl.3113.src:0 "事见《汉书·宣帝纪》：宣帝少时「喜游侠，斗鸡走马，具知闾里奸邪，吏治得失」。"

 # ===== A5 葬礼 =====
 hd_hanfl.3121.t:0 "厚葬与薄葬"
 hd_hanfl.3121.desc:0 "[deceased.GetFirstName]的灵柩停在堂上。主事的官员呈上了葬仪的单子：玉衣、明器、车马、珍宝，墓中还要起回廊、立石阙。照这样办，耗费不小，可旁人都会说你尽了孝道、全了体面。\n\n也有人劝你从简。世人以厚葬为德，可厚葬之墓，向来最招盗贼。"
 hd_hanfl.3121.a:0 "厚葬，以尽人子之心。"
 hd_hanfl.3121.a.tt:0 "墓中藏物丰厚，日后或招盗掘。"
 hd_hanfl.3121.b:0 "薄葬，不藏金玉。"
 hd_hanfl.3121.b_zhongzhi:0 "遵先帝《终制》，薄葬。"
 hd_hanfl.3121.src:0 "事见《后汉书·光武帝纪》：建武七年诏曰「世以厚葬为德，薄终为鄙，至于富者奢僭，贫者单财」，令天下知薄葬送终之义。"

 hd_hanfl.3122.t:0 "陵墓被盗"
 hd_hanfl.3122.desc:0 "守陵的吏卒连夜赶来报信：[hd_hanfl_tomb_owner.GetFirstName]的陵墓被人掘开了。盗洞从封土侧面打进去，墓中的金玉明器被洗劫一空，连棺椁也被撬开。\n\n消息已经传开，市井间都在议论当年那场葬礼有多么奢华。"
 hd_hanfl.3122.a:0 "悬赏缉拿，必得盗贼！"
 hd_hanfl.3122.b:0 "改葬薄送，不复藏宝。"
 hd_hanfl.3122.src:0 "事见《三国志·魏书·文帝纪》：曹丕作《终制》曰「自古及今，未有不亡之国，亦无不掘之墓也」。"

 # ===== A6 封禅：活动 =====
 activity_hd_hanfl_fengshan:0 "封禅大典"
 activity_hd_hanfl_fengshan_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]封禅泰山"
 activity_hd_hanfl_fengshan_desc:0 "登泰山而封，告成功于天；降禅梁父，报功于地。自秦皇汉武以来，唯功业大成、天下太平之主方敢行此大典。\n\n光武帝即位三十年时，群臣请封禅，他下诏说：「百姓怨气满腹，吾谁欺，欺天乎？」德不配位而强行封禅，只会招来天下的讥议。"
 activity_hd_hanfl_fengshan_owner:0 "封禅的天子"
 activity_hd_hanfl_fengshan_plural:0 "封禅大典"
 activity_hd_hanfl_fengshan_host_an_a:0 "$articleblank_article$"
 activity_hd_hanfl_fengshan_predicted_cost:0 "预计花费"
 activity_hd_hanfl_fengshan_destination_selection:0 "封禅只在泰山。"
 activity_hd_hanfl_fengshan_province_desc:0 "你将驾临[ROOT.Province.GetName]，登泰山，禅梁父。"
 activity_hd_hanfl_fengshan_selection_tooltip:0 "举行[GetActivityType('activity_hd_hanfl_fengshan').GetName]，告成功于天地。"
 activity_hd_hanfl_fengshan_conclusion_desc:0 "玉牒既封，石检既刻。从此史书会记下：某年某月，天子封泰山。"
 activity_hd_hanfl_fengshan_host_desc:0 "\n$BULLET_WITH_TAB$主人可获得大量[legitimacy|E]与[prestige_i][prestige|E]，并得「封禅玉牒」\n$BULLET_WITH_TAB$若开始时[legitimacy|E]不足，大典会被讥为「德不配位」，反失[legitimacy|E]\n$BULLET_WITH_TAB$同一王朝三十年内只能封禅一次"
 activity_hd_hanfl_fengshan_guest_desc:0 "\n$BULLET_WITH_TAB$随驾者可亲见封禅之礼"
 activity_hd_hanfl_fengshan_guest_help_text:0 "[activity_guests|E]随驾登封。"
 hd_hanfl_fengshan_need_taishan_tt:0 "泰山脚下的奉高在你的治下"
 hd_hanfl_fengshan_recent_tt:0 "你的王朝近三十年内没有封禅过"
 hd_hanfl_fengshan_phase_zhai:0 "斋戒"
 hd_hanfl_fengshan_phase_zhai_desc:0 "沐浴斋戒，议定告天之辞。"
 hd_hanfl_fengshan_phase_feng:0 "登封"
 hd_hanfl_fengshan_phase_feng_desc:0 "登泰山之巅，筑坛祭天，刻石纪功。"
 hd_hanfl_fengshan_phase_shan:0 "禅梁父"
 hd_hanfl_fengshan_phase_shan_desc:0 "下山至梁父，除地祭地，封藏玉牒，大典告成。"

 # ===== A6 封禅：事件 =====
 hd_hanfl.3201.t:0 "斋戒"
 hd_hanfl.3201.desc:0 "大典之前，你在行宫斋戒。太常送来了告天之辞的草稿，问要不要在辞中引图谶符命，说陛下受命，早有谶文为证。\n\n引谶，天下人便知你是天命所归；可朝中通经的儒臣，向来有人不信这一套。"
 hd_hanfl.3201.a:0 "宣示图谶，以明天命。"
 hd_hanfl.3201.b:0 "不言符命，但告成功。"
 hd_hanfl.3201.src:0 "事见《后汉书·祭祀志》：光武夜读《河图会昌符》，见「赤刘之九，会命岱宗」，有感于此，遂定封禅之议。"

 hd_hanfl.3202.t:0 "登封"
 hd_hanfl.3202.desc:0 "天还没亮，你便从山下起驾。山路陡峭，车马上不去，只好步行，左右扶着你攀过一道道石磴。"
 hd_hanfl.3202.desc_clear:0 "\n\n到了山顶，正赶上日出，云海翻涌，天地一色。坛已筑好，石工候在一旁，只等你定下刻石的文字。"
 hd_hanfl.3202.desc_storm:0 "\n\n走到半山，忽然狂风大作，暴雨倾盆，一行人只好躲在大树下。当年秦始皇登封，也是在半山遇上了风雨，儒生们为此讥笑了他许多年。\n\n雨停之后，你终于到了山顶。随行的人面面相觑，不知这风雨是吉是凶。"
 hd_hanfl.3202.a:0 "刻石颂功，昭示万世。"
 hd_hanfl.3202.b:0 "刻石自省，勉以修德。"
 hd_hanfl.3202.c:0 "风雨洗尘，天意嘉之。"
 hd_hanfl.3202.d:0 "此天谴也，朕当省躬。"

 hd_hanfl.3203.t:0 "禅梁父"
 hd_hanfl.3203.desc:0 "你从泰山下来，到梁父山除地祭地。玉牒书已经封进了石函，用金绳缠了，再以玉检封印，藏在坛下。\n\n礼毕之时，百官山呼万岁，声震山谷。这一刻，你是告成功于天地的天子。"
 hd_hanfl.3203.desc_unworthy:0 "你从泰山下来，到梁父山除地祭地。玉牒书封进了石函，百官依礼山呼万岁。\n\n可这一路上，你也听到了些别的话。有人说天下未安，百姓未足，此时封禅，不过是粉饰太平；也有人把光武帝当年那句「吾谁欺，欺天乎」抄了出来，在京中传看。"
 hd_hanfl.3203.a:0 "大典告成。"
 hd_hanfl.3203.src:0 "事见《史记·封禅书》：武帝封泰山，「封广丈二尺，高九尺，其下则有玉牒书，书秘」。"

 hd_hanfl.3204.t:0 "臣不读谶"
 hd_hanfl.3204.desc:0 "朝会上议起一件事，你说想以谶文来决断。殿上安静了片刻，[hd_hanfl_budu.GetTitledFirstName]出班奏道：「臣不读谶。」\n\n你问他为什么。他便直言谶书都是后人伪托，并非圣人之言，不可用来决断国事。满朝文武都低下了头。"
 hd_hanfl.3204.a:0 "人各有志，朕不罪汝。"
 hd_hanfl.3204.b:0 "非圣无法，下狱治罪！"
 hd_hanfl.3204.src:0 "事见《后汉书·桓谭传》：光武欲以谶决灵台所处，桓谭默然良久，曰「臣不读谶」，又极言谶之非经。帝大怒，曰「桓谭非圣无法，将下斩之」，谭叩头流血，良久乃得解。"

 # ===== A6 元会：活动 =====
 activity_hd_hanfl_yuanhui:0 "元会"
 activity_hd_hanfl_yuanhui_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]元会"
 activity_hd_hanfl_yuanhui_desc:0 "正月旦，天子临轩，公卿百官陪位朝贺，四夷来献，郡国上计吏入殿陈述一年的户口垦田、钱谷刑狱。礼毕设宴，九宾陈列，百戏杂陈。\n\n高皇帝初定朝仪那天，见群臣肃然，叹道：「吾乃今日知为皇帝之贵也。」"
 activity_hd_hanfl_yuanhui_owner:0 "受朝的天子"
 activity_hd_hanfl_yuanhui_plural:0 "元会"
 activity_hd_hanfl_yuanhui_host_an_a:0 "$articleblank_article$"
 activity_hd_hanfl_yuanhui_predicted_cost:0 "预计花费"
 activity_hd_hanfl_yuanhui_destination_selection:0 "元会在京师举行。"
 activity_hd_hanfl_yuanhui_province_desc:0 "你将在[ROOT.Province.GetName]受百官朝贺。"
 activity_hd_hanfl_yuanhui_selection_tooltip:0 "举行[GetActivityType('activity_hd_hanfl_yuanhui').GetName]，受朝贺，听上计。"
 activity_hd_hanfl_yuanhui_conclusion_desc:0 "庭燎渐熄，百官散去。新的一年，便从这一天开始了。"
 activity_hd_hanfl_yuanhui_host_desc:0 "\n$BULLET_WITH_TAB$主人可获得[prestige_i][prestige|E]，有朝贡国君主到场时更多\n$BULLET_WITH_TAB$上计时可减免或问责一位封臣"
 activity_hd_hanfl_yuanhui_guest_desc:0 "\n$BULLET_WITH_TAB$到场的封臣对主人的[opinion|E]会提高"
 activity_hd_hanfl_yuanhui_guest_help_text:0 "[activity_guests|E]入朝上寿、陪位观礼。"
 hd_hanfl_yuanhui_need_january_tt:0 "现在是正月"
 hd_hanfl_yuanhui_phase_he:0 "朝贺"
 hd_hanfl_yuanhui_phase_he_desc:0 "百官上寿，依次就位。"
 hd_hanfl_yuanhui_phase_ji:0 "上计"
 hd_hanfl_yuanhui_phase_ji_desc:0 "郡国上计吏入殿，陈述一年政事。"
 hd_hanfl_yuanhui_phase_yue:0 "九宾散乐"
 hd_hanfl_yuanhui_phase_yue_desc:0 "设宴陈乐，元会告终。"

 # ===== A6 元会：事件 =====
 hd_hanfl.3301.t:0 "位次之争"
 hd_hanfl.3301.desc:0 "百官依次入殿上寿，到了就位的时候却出了岔子。[hd_hanfl_seat_a.GetTitledFirstName]和[hd_hanfl_seat_b.GetTitledFirstName]都说自己的位次该在前头，一个论爵秩，一个论功劳，谁也不肯相让，在殿上争得面红耳赤。\n\n谒者不敢做主，只好请你裁断。"
 hd_hanfl.3301.a:0 "[hd_hanfl_seat_a.GetFirstName]当在前。"
 hd_hanfl.3301.b:0 "[hd_hanfl_seat_b.GetFirstName]当在前。"

 hd_hanfl.3302.t:0 "上计"
 hd_hanfl.3302.desc:0 "郡国上计吏依次入殿。轮到[hd_hanfl_shangji.GetTitledFirstName]治下来的计吏，他捧着计簿跪在阶下，说今年境内收成不好，流民渐多，户口比去年少了，请朝廷宽免赋税。\n\n侍御史在旁边低声提醒你：这一处去年的计簿就有虚报，今年也未必全是实情。"
 hd_hanfl.3302.a:0 "民生艰难，蠲免其租赋。"
 hd_hanfl.3302.b:0 "计簿不实，问责守令。"
 hd_hanfl.3302.b.tt:0 "[hd_hanfl_shangji.GetFirstName]今年的考课，怕是要受此事连累。"

 hd_hanfl.3303.t:0 "九宾散乐"
 hd_hanfl.3303.desc:0 "朝贺、上计都已结束，殿中设下了大宴。九宾陈列，四夷的使者捧着方物依次进献；殿下奏起雅乐，又有百戏杂陈。庭燎通明，照得满殿如同白昼。\n\n你举起酒爵，群臣齐声上寿。"
 hd_hanfl.3303.a:0 "与群臣共饮此爵。"
 hd_hanfl.3303.src:0 "事见《后汉书·礼仪志》注引蔡质《汉仪》：正月旦，天子幸德阳殿临轩，公卿百官陪位朝贺，蛮、貊、胡、羌朝贡毕，见属郡计吏，皆陛觐，庭燎。"

 # ===== 6.2 剧本时间线：22 新莽弊政 =====
 hd_hanfl.4001.t:0 "宝货"
 hd_hanfl.4001.desc:0 "新朝的宝货之制已经行之有年。金、银、龟、贝、钱、布，大大小小数十品，名目繁杂，连市上的老商贾也算不清楚。百姓嫌其不便，私下仍用五铢旧钱交易，官府搜捕盗铸的人，监狱里关得满满的。\n\n市井间怨声载道，有人说钱法一日一变，田里的谷子都换不来一匹布。"
 hd_hanfl.4001.a:0 "新制乃复古之道，不可改易。"
 hd_hanfl.4001.b:0 "稍宽其禁，以安百姓。"
 hd_hanfl.4001.c:0 "上表颂扬新制。"
 hd_hanfl.4001.d:0 "私铸取利，各凭本事。"
 hd_hanfl.4001.src:0 "事见《汉书·食货志》：王莽更作宝货，五物六名二十八品，「百姓愦乱，其货不行」。"

 hd_hanfl.4003.t:0 "王田"
 hd_hanfl.4003.desc:0 "诏书改天下田为「王田」，奴婢为「私属」，一律不许买卖。一家田产超过定额的，要把多余的田分给九族乡邻。\n\n诏令颁下多年，豪强照旧兼并，小民却因私卖田宅被捕下狱，从诸侯卿大夫到庶民，抵罪的人数也数不清。"
 hd_hanfl.4003.a:0 "井田圣制，必行无疑。"
 hd_hanfl.4003.b:0 "暂弛买卖之禁。"
 hd_hanfl.4003.c:0 "奉行王田，以示忠诚。"
 hd_hanfl.4003.d:0 "暗中置田，以待时变。"
 hd_hanfl.4003.src:0 "事见《汉书·王莽传》：更名天下田曰「王田」，奴婢曰「私属」，皆不得卖买，「自诸侯卿大夫至于庶民，抵罪者不可胜数」。"

 hd_hanfl.4004.t:0 "河决"
 hd_hanfl.4004.desc:0 "当年黄河在魏郡决口，大水向东泛滥清河以东数郡，至今没有堵塞。朝中有人说，河水既然东去，元城的王氏祖坟便没有水患了，所以不必兴役堤塞。\n\n于是河水年年改道，田庐尽成泽国。流民扶老携幼，向南向东逃去，聚在山泽之间。"
 hd_hanfl.4004.a:0 "河水东去，于祖茔无害。"
 hd_hanfl.4004.b:0 "发卒塞河，以救民命。"
 hd_hanfl.4004.c:0 "眼看流民塞路，徒然忧叹。"
 hd_hanfl.4004.d:0 "开仓赈济乡里。"
 hd_hanfl.4004.src:0 "事见《汉书·王莽传》：「河决魏郡，泛清河以东数郡。先是，莽恐河决为元城冢墓害。及决东去，元城不忧水，故遂不堤塞。」"

 # ===== 22 始正火德 =====
 hd_hanfl.4002.t:0 "始正火德"
 hd_hanfl.4002.desc:0 "你已经即了皇帝位，有司来请定德运。\n\n博士们说，汉家本是火德，尧后火运，所以王莽才自称以土德代火；如今汉室中兴，正当复归火德，色尚赤。也有人翻出汉初张苍的旧说，说汉承秦后，应当仍用水德。"
 hd_hanfl.4002.a:0 "汉为火德，色尚赤。"
 hd_hanfl.4002.b:0 "依张苍旧说，仍用水德。"
 hd_hanfl.4002.src:0 "事见《后汉书·光武帝纪》：建武二年，「始正火德，色尚赤」。"

 # ===== 89 班昭续书、《汉书》成 =====
 hd_hanfl.4101.t:0 "班昭续书"
 hd_hanfl.4101.desc:0 "班固死后，他未写完的《汉书》还剩八表和《天文志》没有成稿，书稿散在家中。有人向你举荐他的妹妹班昭，说她博学高才，家学渊源，可以续成此书。\n\n东观藏书阁里有朝廷的图籍，若下诏让她入阁，书稿或许能够完成。"
 hd_hanfl.4101.a:0 "诏班昭入东观，续成其书。"
 hd_hanfl.4101.a.tt:0 "过几年，《汉书》可成。"
 hd_hanfl.4101.b:0 "妇人修史，于礼不合。"
 hd_hanfl.4101.src:0 "事见《后汉书·列女传》：班固著《汉书》，「其八表及天文志未及竟而卒，和帝诏昭就东观藏书阁踵而成之」。"

 hd_hanfl.4111.t:0 "入东观"
 hd_hanfl.4111.desc:0 "天子下诏，召你入东观藏书阁，续成兄长未竟的《汉书》。\n\n阁中图籍堆积如山，兄长的旧稿也一并送了过来，字迹犹新。你在案前坐下，铺开竹简，从八表的第一表写起。"
 hd_hanfl.4111.a:0 "当竟先兄之业。"

 hd_hanfl.4102.t:0 "《汉书》成"
 hd_hanfl.4102.desc:0 "班昭将续成的《汉书》进呈御前。从高祖到王莽，二百余年间的纪、表、志、传，至此全部完备。\n\n书一出来，京中的学者争相传抄，却多有读不通的地方。听说连马融那样的大儒，也要伏在阁下，跟着班昭一句一句受读。"
 hd_hanfl.4102.a:0 "藏之秘府，传之后世。"
 hd_hanfl.4102.src:0 "事见《后汉书·列女传》：「时《汉书》始出，多未能通者，同郡马融伏于阁下，从昭受读。」"

 # ===== 89 蔡侯纸、宋贵人旧案 =====
 hd_hanfl.4103.t:0 "蔡侯纸"
 hd_hanfl.4103.desc:0 "尚方令蔡伦捧着一叠东西进来，请你过目。那是用树皮、麻头、破布和旧渔网捣烂了抄成的纸，薄而有韧，可以书写。\n\n从前书写多用竹简，笨重难携；用缣帛，又太贵。蔡伦说，这种纸取材低贱，天下都用得起。"
 hd_hanfl.4103.a:0 "善！颁行天下。"
 hd_hanfl.4103.b:0 "小技耳，姑且收下。"
 hd_hanfl.4103.src:0 "事见《后汉书·宦者列传》：蔡伦「用树肤、麻头及敝布、鱼网以为纸」，元兴元年奏上之，帝善其能，「自是莫不从用焉，故天下咸称『蔡侯纸』」。"

 hd_hanfl.4108.t:0 "天子嘉之"
 hd_hanfl.4108.desc:0 "你造的纸得到了天子的嘉许，诏令天下仿造。宫中尚方的工匠日夜赶制，京中的书肆也开始用纸抄书了。\n\n人们管这种纸叫「蔡侯纸」。"
 hd_hanfl.4108.a:0 "臣不敢当。"

 hd_hanfl.4104.t:0 "宋贵人旧案"
 hd_hanfl.4104.desc:0 "你亲政之后，有人翻出了当年的一桩旧案：章帝时，宋贵人被诬陷挟邪媚道，被迫饮药自尽。宋贵人是你的祖母，而当年奉窦太后之命罗织罪名的，正是如今受封龙亭侯的[hd_hanfl_cai_lun.GetTitledFirstName]。\n\n朝中的人都在看你如何处置。"
 hd_hanfl.4104.a:0 "敕令自诣廷尉。"
 hd_hanfl.4104.b:0 "事隔多年，宽免之。"
 hd_hanfl.4104.src:0 "事见《后汉书·宦者列传》：安帝亲政，「敕使自致廷尉。伦耻受辱，乃沐浴，整衣冠，饮药而死」。"

 hd_hanfl.4109.t:0 "敕诣廷尉"
 hd_hanfl.4109.desc:0 "诏书送到了你的府上：命你自诣廷尉，对质当年宋贵人一案。\n\n你知道廷尉狱是什么地方。进去了，就再难体面地出来。你造纸的功劳，天下人都记着；可这桩旧案，天子也记着。"
 hd_hanfl.4109.a:0 "沐浴整衣，饮药而死。"
 hd_hanfl.4109.b:0 "诣阙自陈，以待天裁。"
 hd_hanfl.4109.b.tt:0 "天子会再作决断。"

 hd_hanfl.4110.t:0 "蔡伦自陈"
 hd_hanfl.4110.desc:0 "[hd_hanfl_cai_lun.GetTitledFirstName]没有去廷尉，而是跪在阙下，求见天颜。他说当年之事，是奉了太后的旨意，身不由己；又说自己造纸有功于天下，求陛下念其微劳。\n\n他已经老了，伏在地上，白发散乱。"
 hd_hanfl.4110.a:0 "念其旧功，赦之。"
 hd_hanfl.4110.b:0 "罪不可赦，下廷尉狱。"

 # ===== 89 候风地动仪、陇西地动 =====
 hd_hanfl.4105.t:0 "候风地动仪"
 hd_hanfl.4105.desc:0 "太史令张衡造成了一件铜器，请你去灵台观看。器形似酒尊，周身铸着八条龙，口中各衔一枚铜丸，下面蹲着八只蟾蜍，张口向上。张衡说，哪一方地动，那一方的龙口便会吐丸，落进蟾蜍口中。\n\n左右的人都觉得新奇，也有人暗暗不以为然。"
 hd_hanfl.4105.a:0 "置于灵台，以候地动。"
 hd_hanfl.4105.b:0 "奇技之器，置之可也。"
 hd_hanfl.4105.src:0 "事见《后汉书·张衡传》：阳嘉元年，张衡「复造候风地动仪。以精铜铸成，员径八尺，合盖隆起，形似酒尊」。"

 hd_hanfl.4106.t:0 "陇西地动"
 hd_hanfl.4106.desc:0 "灵台上的地动仪忽然有一条龙吐了丸。可京师并没有人觉得地动，学者们都说这器物不灵，议论纷纷。\n\n几天之后，驿使飞马而来，奏报陇西地震。"
 hd_hanfl.4106.a:0 "神乎其技！"
 hd_hanfl.4106.b:0 "巧合而已。"
 hd_hanfl.4106.src:0 "事见《后汉书·张衡传》：「尝一龙机发而地不觉动，京师学者咸怪其无征，后数日驿至，果地震陇西，于是皆服其妙。」"

 # ===== 89 弃凉州之议 =====
 hd_hanfl.4107.t:0 "弃凉州之议"
 hd_hanfl.4107.desc:0 "羌乱连年不息，并州、凉州残破，军费把府库耗得一空。大将军邓骘在朝会上提出：凉州地远难守，不如弃之，并力经营北边。公卿多有附和的。\n\n郎中虞诩却去见太尉李脩，说先帝开拓疆土，劳苦而后得之，如今怕花费便要弃了它；凉州一弃，三辅便成了边塞，园陵就暴露在外。\n\n此事最后要由你来定。"
 hd_hanfl.4107.a:0 "弃凉州，并力北边。"
 hd_hanfl.4107.b:0 "凉州不可弃，坚守之。"
 hd_hanfl.4107.c:0 "招抚羌众，徐图安辑。"
 hd_hanfl.4107.src:0 "事见《后汉书·虞诩传》：邓骘欲弃凉州，虞诩以为「凉州既弃，即以三辅为塞；三辅为塞，则园陵单外」，又引谚曰「关西出将，关东出相」。"

 # ===== 190 坏五铢、千里草 =====
 hd_hanfl.4201.t:0 "坏五铢"
 hd_hanfl.4201.desc:0 "从长安传来的消息说，董卓下令销毁五铢钱，又把城中的铜人、钟虡都椎碎了，熔铸成小钱。新钱又小又薄，没有轮郭文章，不耐摩挲。\n\n钱一下子不值钱了，关中的谷价一日数涨，市上拿着一袋钱也买不到几斗米。"
 hd_hanfl.4201.a:0 "钱法一坏，民何以堪。"
 hd_hanfl.4201.src:0 "事见《三国志·魏书·董卓传》：卓「悉椎破铜人、钟虡，及坏五铢钱，更铸为小钱」，「于是货轻而物贵，谷一斛至数十万」。"

 hd_hanfl.4202.t:0 "千里草"
 hd_hanfl.4202.desc:0 "京中的小儿近来都在传唱一首童谣：\n\n「千里草，何青青，十日卜，不得生。」\n\n有人私下拆字：千里草是一个「董」字，十日卜是一个「卓」字。这话不敢大声说，却已经传遍了街巷。"
 hd_hanfl.4202.a:0 "童谣无端，天意可畏。"
 hd_hanfl.4202.src:0 "事见《后汉书·五行志》：献帝践祚之初，京都童谣曰「千里草，何青青，十日卜，不得生」，「案千里草为董，十日卜为卓」。"

 # ===== 190 蔡邕之死 =====
 hd_hanfl.4203.t:0 "闻卓死而叹"
 hd_hanfl.4203.desc:0 "董卓被诛的消息传来时，你正坐在司徒王允的席上。满座的人都在额手相庆，你却想起董卓当年三日之内连擢你三官，待你不薄。\n\n一声叹息几乎就要出口。"
 hd_hanfl.4203.a:0 "不觉叹息，形于颜色。"
 hd_hanfl.4203.a.tt:0 "这一声叹息，王允听见了。"
 hd_hanfl.4203.b:0 "隐忍不言。"
 hd_hanfl.4203.src:0 "事见《后汉书·蔡邕传》：「及卓被诛，邕在司徒王允坐，殊不意言之而叹，有动于色。」"

 hd_hanfl.4204.t:0 "王允收蔡邕"
 hd_hanfl.4204.desc:0 "董卓伏诛，满座称快，唯独[hd_hanfl_cai_yong.GetTitledFirstName]在席上叹了一口气，脸色也变了。\n\n你勃然大怒。董卓是国之大贼，几乎倾覆汉室，他身为王臣，不同仇敌忾，反而怀其私遇，为之伤痛，这与逆贼何异？"
 hd_hanfl.4204.a:0 "收付廷尉治罪！"
 hd_hanfl.4204.a.tt:0 "蔡邕恐将死于狱中。"
 hd_hanfl.4204.b:0 "一叹而已，宽宥之。"

 hd_hanfl.4206.t:0 "狱中"
 hd_hanfl.4206.desc:0 "你被关进了廷尉狱。公卿中有不少人替你求情，太尉马日磾也去见了王允，可王允不为所动。\n\n你想到了那部还没写完的汉史。若能留下这条命，哪怕受黥首刖足之刑，你也要把它写完。"
 hd_hanfl.4206.a:0 "乞黥首刖足，继成汉史。"
 hd_hanfl.4206.a.tt:0 "王允会再作决断。"
 hd_hanfl.4206.b:0 "默然待死。"
 hd_hanfl.4206.b.tt:0 "你将死于狱中。"

 hd_hanfl.4207.t:0 "蔡邕请继成汉史"
 hd_hanfl.4207.desc:0 "[hd_hanfl_cai_yong.GetTitledFirstName]从狱中上书，说情愿受黥首刖足之刑，只求留下性命，续成汉史。马日磾也来劝你，说蔡邕是旷世逸才，熟知汉事，杀了他，只怕会失去人望。\n\n你想起了当年武帝不杀司马迁，结果留下了一部谤书。"
 hd_hanfl.4207.a:0 "许之，令其续史。"
 hd_hanfl.4207.b:0 "不可令佞臣执笔在幼主左右。"
 hd_hanfl.4207.src:0 "事见《后汉书·蔡邕传》：王允曰「昔武帝不杀司马迁，使作谤书，流于后世。方今国祚中衰，神器不固，不可令佞臣执笔在幼主左右」，邕遂死狱中。"

 # ===== 190 张机著书 =====
 hd_hanfl.4205.t:0 "伤寒杂病论"
 hd_hanfl.4205.desc:0 "你的宗族本来人丁兴旺，可这些年疫病接连不断，族人死去了大半，其中十之七八死于伤寒。你行医多年，眼看着许多人本可以救活，却因医者不明病理而枉死。\n\n于是你勤求古训，博采众方，把平生所学所验整理成书。如今书稿已经写成了。"
 hd_hanfl.4205.a:0 "愿此书活人无数。"
 hd_hanfl.4205.src:0 "事见张机《伤寒杂病论·序》：「感往昔之沦丧，伤横夭之莫救，乃勤求古训，博采众方。」"

 # ===== 218 肉刑之议、终制 =====
 hd_hanfl.4301.t:0 "肉刑之议"
 hd_hanfl.4301.desc:0 "你召集群臣商议，要不要恢复肉刑。\n\n陈群说，自文帝废肉刑以来，该受宫刑、刖刑的人都改成了死刑，看似宽仁，其实杀人更多；不如复设肉刑，既可惩恶，又能保全性命。王朗等人却说，天下未定，复用肉刑恐失民心，等太平之后再议不迟。\n\n两边各有道理，群臣都在看你。"
 hd_hanfl.4301.a:0 "从陈群之议，复肉刑。"
 hd_hanfl.4301.b:0 "军事未罢，且寝其议。"
 hd_hanfl.4301.src:0 "事见《三国志·魏书·陈群传》：太祖议复肉刑，钟繇与陈群议同，王朗及议者多以为未可行，「太祖深善繇、群言，以军事未罢，顾众议，故且寝」。"

 hd_hanfl.4302.t:0 "终制"
 hd_hanfl.4302.desc:0 "你在首阳山东边选好了寿陵的地方。有司送来了陵寝的图样，封土要高，墓道要深，明器要备齐。\n\n你看着图样，想起了这些年见过的一座座被掘开的古墓：金玉被盗，骸骨被弃，连汉家的帝陵也没能幸免。"
 hd_hanfl.4302.a:0 "作《终制》，务从俭薄。"
 hd_hanfl.4302.b:0 "依旧制营陵。"
 hd_hanfl.4302.src:0 "事见《三国志·魏书·文帝纪》：黄初三年作《终制》曰「骨无痛痒之知，冢非栖神之宅」，「为棺椁足以朽骨，衣衾足以朽肉而已」。"

 # ===== 6.5 疫中施治 =====
 hd_hanfl.5001.t:0 "伤寒十居其七"
 hd_hanfl.5001.desc:0 "疫病在境内蔓延开来，先是发热恶寒，继而头痛身疼，不过数日便有人死去。城中棺木都卖得精光，有的人家一门尽殁，连收殓的人都没有。"
 hd_hanfl.5001.desc_zhang_ji:0 "\n\n[hd_hanfl_physician.GetTitledFirstName]求见，说此病是伤寒，辨明病在何经，按方施药，大多能救；只是药材要早备，医工要遍派到乡里去。"
 hd_hanfl.5001.desc_book:0 "\n\n你案头有一部《伤寒杂病论》。书中说此病当辨明病在何经，按方施药，大多能救；只是药材要早备，医工要遍派到乡里去。"
 hd_hanfl.5001.a:0 "依方施治，遍及乡里。"
 hd_hanfl.5001.b:0 "紧闭宫门，只顾宫中。"
 hd_hanfl.5001.src:0 "事见张机《伤寒杂病论·序》：「建安纪年以来，犹未十稔，其死亡者，三分有二，伤寒十居其七。」"

 # ===== 修正 =====
 hd_hanfl_yinsi_modifier:0 "淫祀之风"
 hd_hanfl_yinsi_modifier_desc:0 "此地乡民竞相立祠祭鬼，杀牛宰羊，倾家祷祝，巫祝借此敛财。"
 hd_hanfl_yinsi_resent_modifier:0 "毁祠之怨"
 hd_hanfl_yinsi_resent_modifier_desc:0 "官府拆毁了乡里的祠庙，乡民心中惴惴，怨言不绝。"
 hd_hanfl_xinmang_modifier:0 "新莽弊政"
 hd_hanfl_xinmang_modifier_desc:0 "钱法屡变，田不得卖，河决不塞，百姓困苦，盗贼蜂起。"
 hd_hanfl_wuzhu_modifier:0 "钱轻物贵"
 hd_hanfl_wuzhu_modifier_desc:0 "五铢钱被毁，小钱不值钱，谷价飞涨，市井萧条。"
 hd_hanfl_juanmian_modifier:0 "蠲免"
 hd_hanfl_juanmian_modifier_desc:0 "朝廷念此地民生艰难，宽免了租赋。"
 hd_hanfl_kaoke_clean_modifier:0 "吏治清明"
 hd_hanfl_kaoke_clean_modifier_desc:0 "守令清廉，案牍不留，百姓称便。"
 hd_hanfl_kaoke_harsh_modifier:0 "酷吏之治"
 hd_hanfl_kaoke_harsh_modifier_desc:0 "官府用法严峻，盗贼屏迹，百姓却畏之如虎。"
 hd_hanfl_kaoke_pearl_modifier:0 "珠还合浦"
 hd_hanfl_kaoke_pearl_modifier_desc:0 "革除了采珠的苛政，迁徙他处的珠蚌又回来了，商旅往来不绝。"
 hd_hanfl_kaoke_custom_modifier:0 "移风易俗"
 hd_hanfl_kaoke_custom_modifier_desc:0 "守令教化有方，乡里渐知礼义。"
 hd_hanfl_region_saltwell_modifier:0 "火井煮盐"
 hd_hanfl_region_saltwell_modifier_desc:0 "以火井之火煮卤成盐，盐利大兴。"
 hd_hanfl_region_waterpump_modifier:0 "水排鼓铸"
 hd_hanfl_region_waterpump_modifier_desc:0 "以水力鼓动风囊冶铁，用力少而见功多，百姓便之。"
 hd_hanfl_region_canal_modifier:0 "均水之约"
 hd_hanfl_region_canal_modifier_desc:0 "官府定下了分水的约束，上下游各得其水，乡里不再相争。"
 hd_hanfl_region_haoyou_modifier:0 "豪右擅水"
 hd_hanfl_region_haoyou_modifier_desc:0 "豪强把持了渠水，小民的田地干涸，怨声载道。"
 hd_hanfl_region_market_modifier:0 "胡市兴盛"
 hd_hanfl_region_market_modifier_desc:0 "关市大开，胡汉交易，牛马皮货络绎而来。"
 hd_hanfl_region_closed_market_modifier:0 "关市闭绝"
 hd_hanfl_region_closed_market_modifier_desc:0 "关市已闭，边塞戒严，奸人难以出入。"
 hd_hanfl_region_shanyue_modifier:0 "山越入籍"
 hd_hanfl_region_shanyue_modifier_desc:0 "出山的山越编入户籍，强壮的充作兵卒。"
 hd_hanfl_region_shanyue_war_modifier:0 "山越未平"
 hd_hanfl_region_shanyue_war_modifier_desc:0 "官军入山征讨，山越据险而守，乡里不得安宁。"
 hd_hanfl_zuiji_modifier:0 "下诏罪己"
 hd_hanfl_zuiji_modifier_desc:0 "该角色因灾异下诏罪己，减膳避殿，引过自责，心中反倒坦然了些。"
 hd_hanfl_fangbing_modifier:0 "按方救疫"
 hd_hanfl_fangbing_modifier_desc:0 "该角色依方施药，宫中早备药材，疫气难侵。"
 hd_hanfl_caihouzhi_modifier:0 "蔡侯纸"
 hd_hanfl_caihouzhi_modifier_desc:0 "新纸轻便价廉，书写抄录比竹简缣帛容易多了。"
 hd_hanfl_xianfang_modifier:0 "仙方"
 hd_hanfl_xianfang_modifier_desc:0 "该角色服了方士所献的仙方，自觉身轻体健。"
 hd_hanfl_dewu_tu_modifier:0 "土德"
 hd_hanfl_dewu_tu_modifier_desc:0 "此家以土德受命，色尚黄。"
 hd_hanfl_dewu_jin_modifier:0 "金德"
 hd_hanfl_dewu_jin_modifier_desc:0 "此家以金德受命，色尚白。"
 hd_hanfl_dewu_shui_modifier:0 "水德"
 hd_hanfl_dewu_shui_modifier_desc:0 "此家以水德受命，色尚黑。"
 hd_hanfl_dewu_mu_modifier:0 "木德"
 hd_hanfl_dewu_mu_modifier_desc:0 "此家以木德受命，色尚青。"
 hd_hanfl_dewu_huo_modifier:0 "火德"
 hd_hanfl_dewu_huo_modifier_desc:0 "此家以火德受命，色尚赤。"

 # ===== 好感 =====
 hd_hanfl_scapegoat_opinion:0 "代君受过"

 # ===== 宝物 =====
 hd_hanfl_artifact_hanshu_name:0 "汉书"
 hd_hanfl_artifact_hanshu_description:0 "班固著，班昭续成。起自高祖，终于王莽，纪、表、志、传俱备，为断代之史。书初出时，学者多读不通，马融也要伏于阁下从班昭受读。"
 hd_hanfl_artifact_yudie_name:0 "封禅玉牒"
 hd_hanfl_artifact_yudie_description:0 "封禅泰山时所用的玉牒书副本，以金绳缠束，玉检封印。正本藏在泰山坛下的石函中，书辞秘不示人。"

