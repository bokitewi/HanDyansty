 building_TK_20_80_DanYangTongKuang1Ji_desc: "丹阳郡山中铜矿丰厚，朝廷在此设铜官专掌采炼。所出之铜号称天下善铜，工匠铸镜，镜背常铸上“汉有善铜出丹阳”之铭。眼下只开得几处浅坑，冶炉寥寥。"
