 building_TK_20_84_HeDongChiYan1Ji: "$TK_20_84_HeDongChiYan1Ji$"
 building_TK_20_84_HeDongChiYan1Ji_desc: "河东郡安邑城西南有大盐池，绵延数十里，池水咸苦。每到夏日南风吹起，池面便自行结出盐来，不必煎煮，朝廷为此在安邑设有盐官。眼下只有少数盐户在此取盐，所出仅够近邑之用。"
