 building_type_TK_20_64_ZhangYeDanXiaDiMao: "地貌景观"
 building_type_TK_20_64_ZhangYeDanXiaDiMao_desc: "山石奇形怪状，非人力所能为，乡人多以神怪之说附会其来历。"
 TK_20_64_ZhangYeDanXiaDiMao: "张掖丹霞地貌"
 building_TK_20_64_ZhangYeDanXiaDiMao: "$TK_20_64_ZhangYeDanXiaDiMao$"
 building_TK_20_64_ZhangYeDanXiaDiMao_desc: "张掖郡南面祁连山下的丘陵之间，山岩层层叠叠，赤、黄、青、白诸色相间，宛如铺开的锦缎。每当日出日落，满山如火，往来的戍卒与商旅远远望见，无不称奇。"
 building_type_TK_20_64_BaDanJiLinShaMo: "地貌景观"
 building_type_TK_20_64_BaDanJiLinShaMo_desc: "山石奇形怪状，非人力所能为，乡人多以神怪之说附会其来历。"
 TK_20_64_BaDanJiLinShaMo: "巴丹吉林沙漠"
 building_TK_20_64_BaDanJiLinShaMo: "$TK_20_64_BaDanJiLinShaMo$"
 building_TK_20_64_BaDanJiLinShaMo_desc: "居延泽以南、弱水以东，黄沙连绵不知几千里，沙丘高耸如山，风过时沙鸣如雷。沙山之间却藏着许多碧绿的小湖，水草丰美，胡人牧者偶尔驱马来饮。"
 building_type_TK_20_64_GuiLinQiXingYan: "地貌景观"
 building_type_TK_20_64_GuiLinQiXingYan_desc: "山石奇形怪状，非人力所能为，乡人多以神怪之说附会其来历。"
 TK_20_64_GuiLinQiXingYan: "桂林七星岩"
 building_TK_20_64_GuiLinQiXingYan: "$TK_20_64_GuiLinQiXingYan$"
 building_TK_20_64_GuiLinQiXingYan_desc: "零陵郡始安县东有七座石峰，排列如北斗七星。峰腹之中藏着幽深的岩洞，洞内钟乳倒垂，石笋林立，晶莹如玉雪，脚下还有暗河潺潺流过。"
 building_type_TK_20_64_WuLingYuan: "地貌景观"
 building_type_TK_20_64_WuLingYuan_desc: "山石奇形怪状，非人力所能为，乡人多以神怪之说附会其来历。"
 TK_20_64_WuLingYuan: "武陵源"
 building_TK_20_64_WuLingYuan: "$TK_20_64_WuLingYuan$"
 building_TK_20_64_WuLingYuan_desc: "武陵郡充县的深山之中，千百座石峰拔地而起，如笋如柱，峰顶生着苍松，终年云雾缭绕。山下溪涧纵横，洞穴幽深，猿猴麋鹿出没其间，只有武陵蛮人知道进出的路径。"
 building_type_TK_20_64_YunNanShiLin: "地貌景观"
 building_type_TK_20_64_YunNanShiLin_desc: "山石奇形怪状，非人力所能为，乡人多以神怪之说附会其来历。"
 TK_20_64_YunNanShiLin: "云南石林"
 building_TK_20_64_YunNanShiLin: "$TK_20_64_YunNanShiLin$"
 building_TK_20_64_YunNanShiLin_desc: "益州郡滇池东南的山野之间，灰白的石峰成片拔地而起，高的有十余丈，密密匝匝如同林木。人行其间如入迷阵，往往转了半日仍寻不到出路。"
 building_type_TK_20_64_HaiShangShiLin: "地貌景观"
 building_type_TK_20_64_HaiShangShiLin_desc: "山石奇形怪状，非人力所能为，乡人多以神怪之说附会其来历。"
 TK_20_64_HaiShangShiLin: "海上石林"
 building_TK_20_64_HaiShangShiLin: "$TK_20_64_HaiShangShiLin$"
 building_TK_20_64_HaiShangShiLin_desc: "交趾郡东面的海湾中，千百座石岛从碧波里突兀而起，有的如柱，有的如屏，远远望去仿佛海上生出一片石林。岛上岩洞幽深，钟乳垂挂，渔人常驾小舟入洞避风。"
 building_type_TK_20_80_ShouShanTongKuang1Ji: "铜矿"
 building_type_TK_20_80_ShouShanTongKuang1Ji_desc: "铜为铸钱造器之本，此地矿脉丰厚，采炼的炉火终年映红山谷。"
 TK_20_80_ShouShanTongKuang1Ji: "首山铜矿Ⅰ级"
 building_TK_20_80_ShouShanTongKuang1Ji: "$TK_20_80_ShouShanTongKuang1Ji$"
 building_TK_20_80_ShouShanTongKuang1Ji_desc: "太史公记载，黄帝采首山之铜，在荆山下铸成宝鼎，鼎成之日，有龙垂下胡髯迎黄帝升天，首山之铜由此名闻天下。眼下只开得几处浅坑，冶炉寥寥。"
 building_type_TK_20_80_ShouShanTongKuang2Ji: "铜矿"
 building_type_TK_20_80_ShouShanTongKuang2Ji_desc: "铜为铸钱造器之本，此地矿脉丰厚，采炼的炉火终年映红山谷。"
