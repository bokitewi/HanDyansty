 TK_20_81_WuAnTieKuang1Ji: "武安铁矿Ⅰ级"
 building_TK_20_81_WuAnTieKuang1Ji: "$TK_20_81_WuAnTieKuang1Ji$"
 building_TK_20_81_WuAnTieKuang1Ji_desc: "魏郡武安县西倚太行，山中铁矿丰富，战国时赵国便在此冶铁。孝武皇帝时，朝廷在此设立了铁官。眼下只开得几处浅坑，冶炉寥寥。"
