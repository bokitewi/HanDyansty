 building_TK_20_81_WanChengTieKuang1Ji_desc: "南阳郡治宛城自古以冶铁闻名，楚人用宛地的钢铁铸矛，锋利得像蜂虿之刺。秦时梁人孔氏迁居于此，大兴鼓铸，家资巨富，如今朝廷又在宛城设有铁官。眼下只开得几处浅坑，冶炉寥寥。"
