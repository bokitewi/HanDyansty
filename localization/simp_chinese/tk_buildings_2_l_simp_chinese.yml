 building_TK_20_84_HeDongChiYan4Ji: "$TK_20_84_HeDongChiYan4Ji$"
 building_TK_20_84_HeDongChiYan4Ji_desc: "河东郡安邑城西南有大盐池，绵延数十里，池水咸苦。每到夏日南风吹起，池面便自行结出盐来，不必煎煮，朝廷为此在安邑设有盐官。盐利之厚，足以富饶一方，四方商贾辐辏而至。"
