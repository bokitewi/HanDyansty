 building_TK_20_83_HanJiaJinKuang1Ji_desc: "蜀郡属国的汉嘉县旧名青衣，孝顺皇帝阳嘉年间改为今名。青衣水两岸的山中出金，淘金之人散居水滨。眼下只有零星金户在此淘洗，所得无几。"
