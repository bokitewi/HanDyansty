 building_TK_20_81_LinQiongTieKuang1Ji: "$TK_20_81_LinQiongTieKuang1Ji$"
 building_TK_20_81_LinQiongTieKuang1Ji_desc: "秦破赵国时，赵人卓氏被迁至蜀郡临邛，见县中有铁山，便即山鼓铸，役使僮仆多至千人，富甲一方。朝廷后来在临邛设立铁官，卓王孙之女文君当垆卖酒的旧事至今还流传在乡里。眼下只开得几处浅坑，冶炉寥寥。"
