 building_TK_20_83_BoNanJinKuang2Ji_desc: "永昌郡博南县是孝明皇帝时所置，县南的兰仓水沙中出金。行人翻越博南山、渡过兰仓水，一路艰险，民间有歌谣唱道：“度博南，越兰津，度兰仓，为他人。”金户渐多，水滨的棚舍一处连着一处。"
