 TK_20_80_TongLvShanKuang1Ji: "铜绿山矿Ⅰ级"
 building_TK_20_80_TongLvShanKuang1Ji: "$TK_20_80_TongLvShanKuang1Ji$"
 building_TK_20_80_TongLvShanKuang1Ji_desc: "江夏郡鄂县境内有一座小山，每逢大雨过后，山坡上便泛出点点铜绿，乡人因此称之为铜绿山。山中有许多极古的矿井与炼渣，父老相传，殷周之时便有人在此采铜。眼下只开得几处浅坑，冶炉寥寥。"
