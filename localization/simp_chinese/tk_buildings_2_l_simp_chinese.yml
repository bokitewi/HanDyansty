 building_type_TK_20_84_ZiGongJingYan1Ji_desc: "盐为百姓日用所不可缺，凿井汲卤、煮海晒池，其利之厚，向为官府所重。"
 TK_20_84_ZiGongJingYan1Ji: "自贡井盐Ⅰ级"
 building_TK_20_84_ZiGongJingYan1Ji: "$TK_20_84_ZiGongJingYan1Ji$"
 building_TK_20_84_ZiGongJingYan1Ji_desc: "犍为郡江阳县的山间多咸泉，乡人凿井汲卤，架灶煎煮成盐。蜀中凿井取盐之法，相传始于秦时蜀守李冰。眼下只有少数盐户在此取盐，所出仅够近邑之用。"
