 building_TK_20_81_WuAnTieKuang4Ji: "$TK_20_81_WuAnTieKuang4Ji$"
 building_TK_20_81_WuAnTieKuang4Ji_desc: "魏郡武安县西倚太行，山中铁矿丰富，战国时赵国便在此冶铁。孝武皇帝时，朝廷在此设立了铁官。坑冶遍布山谷，匠役不可胜数，所出足以供给一方。"
