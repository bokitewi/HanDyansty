 building_TK_20_80_DeXingTongKuang1Ji_desc: "豫章郡鄱阳县东境群山环抱，山间有几处泉水味苦色青，流经之处石上都泛出铜色，乡人由此知道山下藏着铜矿。眼下只开得几处浅坑，冶炉寥寥。"
