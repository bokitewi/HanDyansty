 building_TK_20_81_TangXiTieKuang1Ji: "$TK_20_81_TangXiTieKuang1Ji$"
 building_TK_20_81_TangXiTieKuang1Ji_desc: "汝南郡西平县的棠溪是战国时韩国的铸剑之地，苏秦游说韩王时曾夸耀，韩卒的剑戟出于冥山、棠溪、墨阳诸地，陆断牛马，水击鹄雁。本朝在西平县设有铁官。眼下只开得几处浅坑，冶炉寥寥。"
