l_simp_chinese:
 hd_dc_ord.0009.t: "归家必须支付的代价"
 hd_dc_ord.0009.desc: "送来的文书上写着[hd_dc_prisoner.GetTitledFirstName]的名字。人仍被扣在[hd_dc_captor.GetTitledFirstName]手中，亲族打听了几回，得到的答话始终绕不开一个‘价’字。\n\n我可以提出以一百金换人，也可以暂且拒绝这场交易。倘若对方的亲属也在我的牢中，便还有交换的余地。无论怎样写，文书都得送到真正能放人的人手里。"
 hd_dc_ord.0009.a: "以一百金赎回，不附带政治效忠。"
 hd_dc_ord.0009.a.tt: "向当前扣押者提出100金赎买，等待其本人接受或拒绝，三个月未答复则取消。接受后复检资金与实际囚禁，扣款、收款及释放均完成才结算：获释者及其存活近亲对你+25，收款方对你+5，持续5年。发送提案不付钱、不放人、不增加治理分。"
 hd_dc_ord.0009.b: "拒绝这次交易，另寻办法。"
 hd_dc_ord.0009.b.tt: "危世+1；被囚者的存活近亲对你−15，若有主张强硬的真实近臣则其对你+10，持续5年。俘虏仍由原扣押者关押，此选项不会使其死亡。"
 hd_dc_ord.0009.c: "提出交换双方实际扣押的亲属。"
 hd_dc_ord.0009.c.tt: "必须双方都持有可合法释放的真实俘虏。对方实际接受后复检并释放文书中的两人，不收费；两人均已获释才危世−1，双方家属分别对释放其亲属的统治者+10，反对放人的真实仇敌近臣对你−15，持续5年。拒绝、转押或任何一人未释放都不算完成交换。"
 hd_dc_ord09_a_terms: "[hd_dc_proposer.GetTitledFirstName]提出以100金私产赎回仍由[hd_dc_recipient.GetTitledFirstName]扣押的[hd_dc_prisoner.GetTitledFirstName]。这份文书只有金钱与释放条款，不附效忠、把柄或未来支持。三个月内答复；接受后仍要复检囚禁与资金。"
 hd_dc_ord09_c_terms: "[hd_dc_recipient.GetTitledFirstName]释放[hd_dc_prisoner.GetTitledFirstName]；[hd_dc_proposer.GetTitledFirstName]释放[hd_dc_exchange_prisoner.GetTitledFirstName]。两人须仍由各自一方实际扣押且可合法释放。不另索金钱、效忠或人质；两人都获释才算履约。三个月内答复。"
 hd_dc_ord.0209.t: "回信送到之后"
 hd_dc_ord.0209.ransomed: "收款与放人的回报已经核对。此次提出的赎金确已交到扣押者手中，我要赎回的人也已解除囚禁。\n\n亲族终于可以筹备接应，案上的这份文书可以收起来了。"
 hd_dc_ord.0209.exchanged: "两处都送来了放人的回报。文书上写明的两名俘虏已经分别解除囚禁，没有多添一个替代的人名。\n\n双方都履行了这一次交换。至于其他争执，还须留待以后。"
 hd_dc_ord.0209.rejected: "对方退回了文书，没有在约定下落印。\n\n赎金并未交出，也没有人因这份未成立的约定获释。我还得另外设法。"
 hd_dc_ord.0209.partial: "回报只确认了一方已经放人，另一方的释放尚未落实。\n\n这不是一次完成的交换。经手人已将实际经过分开记下，不能用一句‘彼此履约’抹平缺口。"
 hd_dc_ord.0209.unpaid: "文书虽已答应，付款却没有完整兑现。经手人停止了放人安排，按实际收付核对可退金额。\n\n此次赎买没有完成，不能据此记作救人有功。"
 hd_dc_ord.0209.failed: "付款后的放人回报没有通过核验。经手人已经核对退回实际收款的账目；仍有差额的部分保留在原账中。\n\n没有收到真实获释的凭据，这桩事便不能记作完成。"
 hd_dc_ord.0209.cancelled: "在约定落实以前，等待期限或人物处境已经改变。旧文书不再足以要求任何人交款或放人。\n\n经手人已将这次提案取消，不会拿它冒充一份仍然有效的约定。"
 hd_dc_ord.0209.a: "按实际结果记下。"
 hd_dc_ord.0019.t: "仇敌的孩子走进你的厅堂"
 hd_dc_ord.0019.desc: "[hd_dc_visitor.GetTitledFirstName]在阶前停住，报上自己的名字。我早已知道[hd_dc_visitor.GetSheHe]是谁的孩子。[hd_dc_enemy_parent.GetTitledFirstName]这个名字，在我这里总牵着另一段往事。\n\n但查过来客本人的情形，眼下并没有已知的合法拘押事由。旧账属于谁，今天又该怎样待人，是两件需要分别作答的事。"
 hd_dc_ord.0019.a: "只按此人的行为待[hd_dc_visitor.GetHerHim]。"
 hd_dc_ord.0019.a.tt: "危世−1，来客对你+20；若有与其父辈确为仇敌的复仇近臣，则该近臣对你−15，持续5年。保留你与父辈的真实仇敌关系，不向来客授予免罪、头衔或政治权力。"
 hd_dc_ord.0019.b: "我还记得你家做过的事。"
 hd_dc_ord.0019.b.tt: "危世+2，来客因这次敌意接待对你−30；若有与其父辈确为仇敌的复仇近臣，则该近臣对你+15，持续5年。本案没有合法拘押事由，因此不会囚禁、处死或剥夺来客头衔，也不会自动将其设为仇敌。"
 hd_dc_ord.0013.t: "案上的奏章越来越高"
 hd_dc_ord.0013.desc: "[hd_dc_petitioner.GetTitledFirstName]递来的文书又添在案头。其直辖地方的控制已经不足一半，请示却仍要由我逐项批下。\n\n我把最上面的一卷翻开，看了两行，又合上。疲惫并不会因为公事紧迫就自行退去。门外还站着人，案上的事情也总得有人处理。"
 hd_dc_ord.0013.a: "承认需要帮助，按明确权限分担政务。"
 hd_dc_ord.0013.a.tt: "从私产支出30金用于案牍与办事人手，让现任议政官实际负责原生内政事务。任务确认后压力−15，协助者对你+15，被延后请示的封臣对你−10，持续5年；危世不变。傲慢者另承受一次基础20的压力增加，受实际压力增益修正影响。此项会改变该议政官当前的内阁任务；任务失败则退还实际支出，不减压。"
 hd_dc_ord.0013.b: "把怒气发泄在最后一个报坏消息的人身上。"
 hd_dc_ord.0013.b.tt: "压力−5，危世+1；受斥者对你−25，若有具名奉承者则其对你+10，持续5年。慈悲或宽恕者另承受一次基础20的压力增加，受实际压力增益修正影响，两种性格不重复收费。若此后仍有压力等级且对应原生精神崩溃未在冷却中，次日交由原生流程选择符合资格的事件，其选择及实际后果照常处理。"
 hd_dc_ord.0013.c: "向信得过的人坦白，关键决定仍由我来做。"
 hd_dc_ord.0013.c.tt: "向当前外交范围内的真实朋友或可信近亲求助，由其本人在三个月内答复，无须身在同一宫廷。实际帮助后压力−20、危世−1，帮助者对你+20；正参与针对你的宣称派系的封臣对你−10，持续5年。偏执者在坦白时另承受一次基础20的压力增加，受实际压力增益修正影响。求助本身不减压，也不授予摄政权。"
 hd_dc_ord.invalidated: "眼下的情形已经不同，这份请求作罢。"
 hd_dc_ord.0113.t: "那些没有写在奏章上的话"
 hd_dc_ord.0113.desc: "[hd_dc_ordinary_ruler.GetTitledFirstName]送来的私信没有用公文的套话。\n\n“我不是要你替我决定。只是有些话，想找一个信得过的人说。”接下来几页写满了案牍、请示，以及夜里迟迟不能入睡的缘故。\n\n字里行间尽是倦意。我可以认真读完，写下自己的劝解，也可以坦言此刻无力分担。回信该怎么写，得由我自己决定。"
 hd_dc_ord.0113.a: "逐条写下我的想法，让这封信伴你渡过难关。"
 hd_dc_ord.0113.a.tt: "实际阅读私信、梳理心事并回信劝解：对方压力−20、区域危世−1，你对其好感+20，持续5年。没有移交任何统治权。"
 hd_dc_ord.0113.b: "抱歉，我今天也没有余力承受这些。"
 hd_dc_ord.0213.t: "案头留出的一点空处"
 hd_dc_ord.0213.helped: "读完回信，案上的奏章一卷也没有凭空消失，但我终于能分清哪几件必须今天决定，哪几件可以等到明日。\n\n有人认真读过那些烦忧，还逐条写了劝解，这已使我轻松了许多。作出决定的仍是我；下一封诏令该写什么，我也比方才更清楚了。"
 hd_dc_ord.0213.declined: "求助没有得到我期待的回应。回信说明对方眼下无力分担，我便没有再催促。\n\n案上的卷册还在原处。这次请求没有替我减轻压力，却也不该被写成一项从未许下的承诺。"
 hd_dc_ord.0213.a: "把今日该办的事继续办下去。"
 hd_dc_ordinary_response_opinion: "案牍与私下回应"
