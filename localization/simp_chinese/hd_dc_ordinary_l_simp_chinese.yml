l_simp_chinese:
 hd_dc_ord.0009.t: "囹圄中的亲人"
 hd_dc_ord.0009.desc: "送来的文书上写着[hd_dc_prisoner.GetTitledFirstName]的名字。人还关在[hd_dc_captor.GetTitledFirstName]的牢里，家中亲族托人打听了几回，带回来的话总绕不开一个“价”字。\n\n亲族们都望着你，等你拿个主意。赎金不是小数，可牢里的日子更难熬；何况你自己的牢中，或许也正关着对方放心不下的人。"
 hd_dc_ord.0009.a: "百金赎之，勿复多言。"
 hd_dc_ord.0009.a.tt: "若[hd_dc_captor.GetTitledFirstName]收下赎金、放人归来："
 hd_dc_ord.0009.b: "此价不可许，容再图之。"
 hd_dc_ord.0009.c: "以俘易俘，各归其主。"
 hd_dc_ord.0009.c.tt: "若[hd_dc_captor.GetTitledFirstName]应允交换，你也须放还牢中[hd_dc_captor.GetHerHis]的一位亲人："
 hd_dc_ord09_a_terms: "[hd_dc_proposer.GetTitledFirstName]致书[hd_dc_recipient.GetTitledFirstName]：愿出百金，赎回[hd_dc_prisoner.GetTitledFirstName]。金到之日，便请放人归家。书中只论赎金与放人，不求效忠，不讨人质，亦不约来日之助。三月不复，此议作罢。"
 hd_dc_ord09_c_terms: "[hd_dc_proposer.GetTitledFirstName]致书[hd_dc_recipient.GetTitledFirstName]：两家各放一人——[hd_dc_recipient.GetTitledFirstName]放还[hd_dc_prisoner.GetTitledFirstName]，[hd_dc_proposer.GetTitledFirstName]放还[hd_dc_exchange_prisoner.GetTitledFirstName]。以人易人，不索金帛，不求效忠；须两人都出了牢门，此约方算成了。三月不复，此议作罢。"
 hd_dc_ord.0209.t: "赎书的回音"
 hd_dc_ord.0209.ransomed: "赎金已经送到[scope:hd_dc_ordinary.Var('hd_dc_captor').Char.GetTitledFirstName]手中，牢门也随之打开。[scope:hd_dc_ordinary.Var('hd_dc_prisoner').Char.GetTitledFirstName]蓬头垢面地走了出来，由家人搀上了车。\n\n亲族们已经在张罗接风的酒食。这一桩心事，总算放下了。"
 hd_dc_ord.0209.exchanged: "两处的牢门在同一日打开。[scope:hd_dc_ordinary.Var('hd_dc_prisoner').Char.GetTitledFirstName]回到了家中，你牢里的[scope:hd_dc_ordinary.Var('hd_dc_exchange_prisoner').Char.GetTitledFirstName]也被送还给了[scope:hd_dc_ordinary.Var('hd_dc_captor').Char.GetTitledFirstName]。\n\n两家各得其人，旧怨却未必就此了结。"
 hd_dc_ord.0209.rejected: "使者带着原封未动的文书回来了：[scope:hd_dc_ordinary.Var('hd_dc_captor').Char.GetTitledFirstName]不肯答应。\n\n赎金还在你的库中，人也还在对方的牢里。此事只能另想办法。"
 hd_dc_ord.0209.partial: "约定是两边一同放人。[scope:hd_dc_ordinary.Var('hd_dc_prisoner').Char.GetTitledFirstName]已经回到家中，可你这边该放的人，却没能走出牢门。\n\n这算不得一场成了的交换。经手的人把前后经过一一记下，往后两家少不得还要为此争执。"
 hd_dc_ord.0209.unpaid: "[scope:hd_dc_ordinary.Var('hd_dc_captor').Char.GetTitledFirstName]虽已应允，赎金却没能足数送到。经手的人停下了放人的安排，把送出去的钱能追回的都追了回来。\n\n人没有赎回来，此事只得作罢。"
 hd_dc_ord.0209.failed: "约定虽成，[scope:hd_dc_ordinary.Var('hd_dc_prisoner').Char.GetTitledFirstName]却终究没能走出牢门。若已有钱财送出，经手的人也已设法讨回，能讨回的都讨回了。\n\n人仍在对方牢中，此事只得另作打算。"
 hd_dc_ord.0209.cancelled: "文书还在路上，情形已经变了——或是人已不在原处，或是期限已过。旧日的约定，再也做不得数。\n\n这一回赎人之事，就此作罢。"
 hd_dc_ord.0209.a: "此事且记下。"
 hd_dc_ord.0019.t: "仇家之后"
 hd_dc_ord.0019.desc: "[hd_dc_visitor.GetTitledFirstName]在阶前站定，报上了自己的名字。其实不必报，你早知道[hd_dc_visitor.GetSheHe]是谁的孩子——[hd_dc_enemy_parent.GetTitledFirstName]这个名字，在你心里一直连着另一段旧事。\n\n可眼前这人自己并没有犯下什么过错。父辈的旧账该记在谁的头上，今日又该如何待[hd_dc_visitor.GetHerHim]，堂上的人都在等你开口。"
 hd_dc_ord.0019.a: "论人当论其行，不论其父。"
 hd_dc_ord.0019.b: "汝家所为，吾未敢忘。"
 hd_dc_ord.0013.t: "案牍如山"
 hd_dc_ord.0013.desc: "[hd_dc_petitioner.GetTitledFirstName]的文书又添在了案头。其治下的地方已经管束不住，事无巨细，却仍要一件件报到你这里来批。\n\n你翻开最上面的一卷，看了两行，又合上了。连日的疲惫不会因为公事紧迫就自行退去；门外还候着人，案上的事也总得有人料理。"
 hd_dc_ord.0013.a: "政务繁剧，请重臣分劳。"
 hd_dc_ord.0013.b: "迁怒于报信之人。"
 hd_dc_ord.0013.b.tt: "#EMP 一时之怒发泄出去，心头的郁结却未必就此平复。#!"
 hd_dc_ord.0013.c: "向知交吐露心事，大事仍由己断。"
 hd_dc_ord.0013.c.tt: "若知交肯回信相劝："
 hd_dc_ord.invalidated: "时移事易，此事作罢。"
 hd_dc_ord.0113.t: "奏章之外的话"
 hd_dc_ord.0113.desc: "[hd_dc_ordinary_ruler.GetTitledFirstName]送来的是一封私信，通篇不见公文的套话。\n\n“不是要你替我拿主意，只是有些话，想找个信得过的人说说。”接下来的几页，写满了案牍、请示，和夜里迟迟不能入睡的缘故。\n\n信读到最后，纸上的倦意几乎要溢出来。这封信该怎样回，得由你自己掂量。"
 hd_dc_ord.0113.a: "逐条回信，为之分忧。"
 hd_dc_ord.0113.b: "吾亦自顾不暇，愧难相助。"
 hd_dc_ord.0213.t: "案头的一点空处"
 hd_dc_ord.0213.helped: "回信读完，案上的奏章一卷也没少，可你总算分得清哪几件今日必须定夺，哪几件可以留到明天。\n\n有人认真读过你的烦忧，还逐条写下了劝解，心头便松快了许多。主意仍是你自己拿；下一道诏令该怎么写，你也比先前清楚了。"
 hd_dc_ord.0213.declined: "回信到了，说的是对方眼下也无力分担。你没有再去催。\n\n案上的卷册还在原处，心头的重负也还压着。这一回，只能自己扛下去了。"
 hd_dc_ord.0213.a: "今日之事，今日毕之。"
 hd_dc_ordinary_response_opinion: "近日往来"
