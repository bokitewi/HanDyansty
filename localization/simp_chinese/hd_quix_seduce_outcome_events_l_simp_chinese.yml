l_simp_chinese:
 quix_seduce_outcome.2000.t:0 "攀龙附凤"
 quix_seduce_outcome.2000.desc:0 "你候在[target.GetTitledFirstNamePossessive]的内室里，身旁只有一案酒浆、几盘果品。\n\n[target.GetSheHe|U]进门见到你，并不意外，反倒含笑走近。几句试探过后，你们便不再掩饰彼此的心意。"
 quix_seduce_outcome.2000.a:0 "富贵温柔，愿常伴左右。"
 quix_seduce_outcome.2000.b:0 "一夕之欢，不必挂怀。"
 hd_quix_seduce_outcome.2010.t:0 "以虐为欢"
 quix_seduce_outcome.2010.desc:0 "[target.GetTitledFirstName]约你到囚室里私会。你到时，里头已点起烛火，刑具旁竟还撒着花瓣——显然[target.GetSheHe]早有安排。\n\n“今夜听我的。”[target.GetSheHe]说。接下来的事证明，[target.GetHerHis]所好远不止寻常的欢愉。"
 quix_seduce_outcome.2010.a:0 "下回，该轮到吾执鞭了。"
 quix_seduce_outcome.2020.t:0 "草料房里"
 quix_seduce_outcome.2020.desc:0 "你与[target.GetName]总寻不到独处的机会，只好托人捎去一封短笺，约[target.GetHerHim]到马厩上头的草料房相见。\n\n牲口的响动遮住了你们的低语。[target.GetSheHe|U]朝你靠过来时，你已经知道这场私会会如何收场。"
 quix_seduce_outcome.2020.a:0 "下回须寻个像样去处。"
 quix_seduce_outcome.2020.b:0 "且去沐浴，就此别过。"
 quix_seduce_outcome.2021.t:0 "祠中私语"
 quix_seduce_outcome.2021.desc:0 "[target.GetName]以斋戒祈福为名，邀你同往一座祠庙。你傍晚赶到时，殿中除了一身素服的[target.GetHerHim]，再无旁人。\n\n[target.GetSheHe|U]本想与你谈些情爱与虔敬的道理，可没说几句，你们便都忘了事先备好的说辞。这一场祈福，最后成了另一回事。"
 quix_seduce_outcome.2021.a:0 "神明在上，此心不渝。"
 quix_seduce_outcome.2021.b:0 "就当是神明成全一回。"
 quix_seduce_outcome.2022.t:0 "别业午后"
 quix_seduce_outcome.2022.desc:0 "一位旧识邀你去城外的别业小住。到了你才发现，真正在那里等你的是[target.GetTitledFirstName]。\n\n你们一同游园、用饭，话也渐渐说得私密起来。午后，[target.GetSheHe]邀你上楼再叙。那位名义上的主人，一连几日都没有露面。"
 quix_seduce_outcome.2022.a:0 "情投意合，自当长久。"
 quix_seduce_outcome.2022.b:0 "今日之欢，留作念想。"
 quix_seduce_outcome.2023.t:0 "古冢幽情"
 quix_seduce_outcome.2023.desc:0 "为了避开仆从与廷臣的耳目，你约[target.GetTitledFirstName]到一座荒废古冢的墓道里相见。此处阴冷，却绝不会有人打扰。\n\n你刚要开口表明心意，[target.GetSheHe]却抢先说出了同样的话。此后良久的沉默，已无须再多解释。"
 quix_seduce_outcome.2023.a:0 "下回，总该换个去处。"
 quix_seduce_outcome.2023.b:0 "古人安眠，不复相扰。"
 quix_seduce_outcome.2024.t:0 "山中茅屋"
 quix_seduce_outcome.2024.desc:0 "[target.GetTitledFirstName]答应与你在山野间的一座茅屋里私会。这里没有仆从，也没有窥探的眼睛，你们终于能把话说开。\n\n入夜后，[target.GetSheHe]径直问起你的心意。你没有回避，[target.GetSheHe]也接受了你的回答。"
 quix_seduce_outcome.2024.b:0 "山中一夜，永志不忘。"
 quix_seduce_outcome.2025.t:0 "乡居闲日"
 quix_seduce_outcome.2025.desc:0 "你邀[target.GetTitledFirstName]到乡间的庄院小住，盼着清静日子能让你们更近一步。\n\n一整天的闲游与长谈之后，你们在廊下看着天色渐暗。[target.GetSheHe|U]终于不再掩饰，主动吻了你。"
 quix_seduce_outcome.2025.a:0 "得卿相伴，愿岁岁如此。"
 quix_seduce_outcome.2025.b:0 "片刻清欢，足慰我心。"
 quix_seduce_outcome.2026.t:0 "夜泛轻舟"
 quix_seduce_outcome.2026.desc:0 "你借来一条游船，邀[target.GetTitledFirstName]单独出游。用过晚饭，你们在挂满灯笼的船头闲谈。\n\n[target.GetSheHe|U]谢你安排了这番相聚，话音刚落便吻了你。最初的惊愕很快散去，你们谁也不急着靠岸。"
 quix_seduce_outcome.2026.a:0 "改日再与卿同泛。"
 quix_seduce_outcome.2026.b:0 "风波摇荡，此舟不坐也罢。"
 quix_seduce_outcome.2027.t:0 "窖中私会"
 quix_seduce_outcome.2027.desc:0 "几个月的试探已经够了。你约[target.GetTitledFirstName]到藏酒的地窖相见，那里偏僻，不会有人来寻。\n\n[target.GetSheHe|U]刚顺着梯子下来，便向你吐露了心意。你也坦然相告，这场相会很快便越过了言语。"
 quix_seduce_outcome.2027.a:0 "此窖往后，便是吾二人之所。"
 quix_seduce_outcome.2027.b:0 "带坛酒走，就此别过。"
 quix_seduce_outcome.2028.t:0 "开诚相见"
 quix_seduce_outcome.2028.desc:0 "你思量许久，决定向[target.GetTitledFirstName]直言自己的心意。私下相见时，[target.GetSheHe]起初一脸困惑，却始终没有走开。\n\n听完你的话，[target.GetSheHe]以一吻作答。原来[target.GetSheHe]早有此意，只是不知你是否当真。"
 quix_seduce_outcome.2028.a:0 "开诚相见，从此同心。"
 quix_seduce_outcome.2028.b:0 "转念一想，就此为止。"
 quix_seduce_outcome.2029.t:0 "当面说破"
 quix_seduce_outcome.2029.desc:0 "[target.GetTitledFirstName]对你若即若离，你早已厌倦，便安排了一场私会，要[target.GetHerHim]给个准话。\n\n[target.GetSheHe|U]连声否认是在戏弄你，又承认自己早已有意。误会一消，你们相视而笑，随即拥在了一起。"
 quix_seduce_outcome.2029.a:0 "早该说破，从此相守。"
 quix_seduce_outcome.2029.b:0 "话已说开，各自珍重。"
 quix_seduce_outcome.2030.t:0 "情欲难禁"
 quix_seduce_outcome.2030.a:0 "与卿缠绵，乐此不疲！"
 quix_seduce_outcome.2030.b:0 "一夕之欢，足矣。"
 quix_seduce_outcome.2031.t:0 "四下无人"
 quix_seduce_outcome.2031.desc:0 "你看得出[target.GetTitledFirstName]对你有意，可宴席上始终人来人往。你凑到[target.GetHerHis]耳边，低声提议一同离开，你们便趁人不备，悄悄溜出了宴席。\n\n远离众人之后，[target.GetSheHe]才承认，自己整晚都在寻这样一个机会。你们终于不必再遮遮掩掩。"
 quix_seduce_outcome.2031.a:0 "下回离席，还得编个由头！"
 quix_seduce_outcome.2031.b:0 "就此别过，莫再相寻。"
 quix_seduce_outcome.2301.t:0 "密室幽会"
 quix_seduce_outcome.2301.desc:0 "你的耳目替你备好了一处隐秘的宅子，好让你与[target.GetTitledFirstName]避开旁人相见。\n\n你确认无人尾随，才推门进去，却见[target.GetSheHe]早已坐在火盆旁等着。“把外袍脱了吧。”看来你的心思，从来没瞒过[target.GetHerHim]。"
 quix_seduce_outcome.2301.b:0 "隔墙有耳，下不为例。"
 quix_seduce_outcome.2302.t:0 "潜身仆舍"
 quix_seduce_outcome.2302.a:0 "容吾再留几日。"
 quix_seduce_outcome.2302.b:0 "天明之前，各自归去。"
 quix_seduce_outcome.2303.t:0 "巫山云雨"
 quix_seduce_outcome.2303.desc:0 "你借林中夜祀之名，邀[target.GetTitledFirstName]半夜到一处隐秘的林地来。你们心里都明白，这场聚会另有所图。\n\n巫觋们击鼓起舞，祝歌声声。[target.GetSheHe]应了你的暗示，你们便在歌声里，以各自的方式完成了这场隐秘的祭礼。"
 quix_seduce_outcome.2303.a:0 "此咒既成，卿当属我！"
 quix_seduce_outcome.2303.b:0 "歌声聒耳，下回免了。"
 quix_seduce_outcome.2304.t:0 "社日欢会"
 quix_seduce_outcome.2304.desc:0 "每逢社日，[target.GetName]总会独自去乡间赶会。今年你也混进了人群。你们一同饮酒、看赛神的鼓舞，很快便把平日的身份抛在了脑后。\n\n回到城外歇脚的帷帐里，你终于说出了心意。[target.GetSheHe|U]只是笑着答道：“我早就看出来了。”"
 quix_seduce_outcome.2304.a:0 "年年社日，与卿同来！"
 quix_seduce_outcome.2304.b:0 "乡野之乐，尽兴而归。"
 quix_seduce_outcome.2305.t:0 "他乡宴罢"
 quix_seduce_outcome.2305.desc:0 "你与[target.GetName]同受邀赴远方的一场宴会。离了熟悉的廷臣与耳目，你们整晚都坐在一处饮酒闲谈。\n\n宴罢，[target.GetSheHe]悄悄碰了碰你的手。你们先后离席，最后在你的住处重逢。这一回，[target.GetSheHe]没有再掩饰自己的渴望。"
 quix_seduce_outcome.2305.a:0 "何不多留几日？"
 quix_seduce_outcome.2305.b:0 "此间之事，此间了之。"
 quix_seduce_outcome.3000.desc:0 "你回到内室时，[owner.GetTitledFirstName]已候在那里，案上摆着酒浆与果品。\n\n你含笑上前，亲手拈了果子喂到[owner.GetHerHim]嘴边。[owner.GetSheHe|U]没有推辞，你们很快便不再掩饰彼此的心意。"
 quix_seduce_outcome.3000.a:0 "此人甚合吾意，留之。"
 quix_seduce_outcome.3010.desc:0 "[owner.GetTitledFirstName]追求你已有数月。你决定在囚室里给[owner.GetHerHim]最后一番考验：烛火、花瓣、刑具，一一备好。\n\n“今夜听我的。”你对[owner.GetHerHim]说。[owner.GetSheHe|U]应了邀，也受下了你安排的一切。"
 quix_seduce_outcome.3010.a:0 "此人耐得住，可留。"
 quix_seduce_outcome.3020.desc:0 "[owner.GetTitledFirstNamePossessive]的殷勤，你早已看在眼里。这一回[owner.GetSheHe]托人捎来一封短笺，约你到马厩上头的草料房相见，你终于去了。\n\n牲口的响动遮住了你们的低语。[owner.GetSheHe|U]靠过来时，你也不再故作矜持。"
 quix_seduce_outcome.3020.a:0 "下回，吾自潜入卿房中。"
 quix_seduce_outcome.3021.desc:0 "你以斋戒祈福为名，邀[owner.GetTitledFirstName]同往一座偏僻的祠庙。傍晚时分，殿中除了你们二人，再无旁人。\n\n你原想先谈些情爱与虔敬的道理，可[owner.GetSheHe]很快便明白了你真正的来意。备好的说辞，最后一句也没用上。"
 quix_seduce_outcome.3021.a:0 "此后祈福，还请同来。"
 quix_seduce_outcome.3022.desc:0 "[owner.GetName]追求你已有些时日。你便借一位旧识在城外的别业，安排了这场私会——那位主人自然不会到场。\n\n你们一同游园、用饭，话也渐渐说得私密起来。午后，你邀[owner.GetHerHim]上楼再叙，[owner.GetSheHe]欣然从命。"
 quix_seduce_outcome.3022.a:0 "此园甚好，可常来。"
 quix_seduce_outcome.3023.desc:0 "[owner.GetTitledFirstName]约你到一座荒废古冢的墓道里相见。此处阴冷，却绝不会有人打扰。\n\n[owner.GetSheHe|U]刚要说明来意，你便抢先吐露了自己的心思。原来，这正是[owner.GetHerHis]约你前来的缘故。"
 quix_seduce_outcome.3023.a:0 "地下古人，权作媒妁。"
 quix_seduce_outcome.3024.desc:0 "你答应与[owner.GetTitledFirstName]在山野间的一座茅屋里私会。这里没有仆从，也没有窥探的眼睛，你们终于能把话说开。\n\n入夜后，你径直问起[owner.GetHerHis]的来意。[owner.GetSheHe|U]坦然认了自己的情意，你也接受了。"
 quix_seduce_outcome.2024.a:0 "此生得卿，夫复何求！"
 quix_seduce_outcome.3025.desc:0 "[owner.GetTitledFirstName]邀你到乡间的庄院小住。你知道[owner.GetSheHe]有意于你，只是想听[owner.GetHerHim]亲口说出来。\n\n一整天的闲游与长谈之后，[owner.GetSheHe]仍迟迟不肯开口。你不愿再等，便在廊下主动吻了[owner.GetHerHim]。"
 quix_seduce_outcome.3025.a:0 "如此良辰，但愿常有。"
 quix_seduce_outcome.3026.desc:0 "[owner.GetTitledFirstName]邀你乘船出游，你知道[owner.GetSheHe]是想借此与你独处。用过晚饭，你们在挂满灯笼的船头闲谈。\n\n你谢[owner.GetHerHim]安排了这番相聚，话音刚落便吻了[owner.GetHerHim]。[owner.GetSheHe|U]没有躲开，你们谁也不急着靠岸。"
 quix_seduce_outcome.3026.a:0 "此舟甚好，当常泛之。"
 quix_seduce_outcome.3027.desc:0 "[owner.GetTitledFirstName]约你到藏酒的地窖相见。你本就想找个机会表白，便独自按时去了。\n\n你刚顺着梯子下来，便向[owner.GetHerHim]吐露了心意。[owner.GetSheHe|U]默默点头，你们之间最后的迟疑也随之散去。"
 quix_seduce_outcome.3027.a:0 "此乐何极，愿得长久！"
 quix_seduce_outcome.3028.desc:0 "[owner.GetTitledFirstName]约你私下相见，开门见山地吐露了对你的情意。\n\n你以一吻作答。其实你早有此心，只是不知[owner.GetSheHe]是否当真；如今已不必再疑。"
 quix_seduce_outcome.3028.a:0 "心意既明，愿长相守。"
 quix_seduce_outcome.3029.desc:0 "[owner.GetTitledFirstName]约你私会，一见面便责怪你明知[owner.GetHerHis]的心意，却故意拖着不答。\n\n你连忙否认——你何尝不是一直暗中倾慕[owner.GetHerHim]。误会一消，你们相视而笑，随即拥在了一起。"
 quix_seduce_outcome.3029.a:0 "往后不必再相瞒了。"
 quix_seduce_outcome.3030.a:0 "此身此夜，皆付与卿。"
 quix_seduce_outcome.3301.desc:0 "[owner.GetTitledFirstName]备好了一处隐秘的宅子，邀你避开耳目前去相会。[owner.GetHerHis]的用意你猜得到，也正合你的心思。\n\n你确认无人尾随，便先进屋等候。[owner.GetSheHe|U]一进门，你只说了一句：“把外袍脱了吧。”"
 quix_seduce_outcome.2301.a:0 "此间灯火，当为卿常留。"
 quix_seduce_outcome.3302.a:0 "多留几日再走吧。"
 quix_seduce_outcome.3303.desc:0 "[owner.GetTitledFirstName]邀你半夜去林中夜祀。你们心里都明白，这场林间聚会另有所图。\n\n巫觋们击鼓起舞，祝歌声声。你应了[owner.GetHerHis]的暗示，你们便在歌声里，以各自的方式完成了这场隐秘的祭礼。"
 quix_seduce_outcome.3303.a:0 "此曲甚妙，愿常闻之。"
 quix_seduce_outcome.3304.desc:0 "每逢社日，你总会独自去乡间赶会，暂且抛开府中的烦扰。今年，[owner.GetTitledFirstName]也出现在了人群里。\n\n你们一同饮酒、看赛神的鼓舞，后来又一起回到城外歇脚的帷帐。[owner.GetSheHe|U]终于说出了心意，你只是笑着答道：“我早就看出来了。”"
 quix_seduce_outcome.3304.a:0 "来年社日，再与卿会。"
 quix_seduce_outcome.3305.desc:0 "你与[owner.GetName]同受邀赴远方的一场宴会。你知道[owner.GetSheHe]一直有意于你，而远离了熟悉的耳目，正好给了你们机会。\n\n你们整晚都坐在一处饮酒闲谈。宴罢，你悄悄碰了碰[owner.GetHerHis]的手；你们先后离席，最后在[owner.GetHerHis]的住处重逢。"
 quix_seduce_outcome.3305.a:0 "良宵苦短，且再留些时日。"
