l_simp_chinese:
 hd_j16.1420.t:0 "秦军出关"
 hd_j16.1420.desc:0 "长安又在点兵。[hd_news_a.GetName]的军令一道道发往诸营，粮车先行，骑兵随后，兵锋所指是[hd_news_b.GetName]的地界。\n\n我听见市上的人在算日子：哪一年秦人入关，哪一年又往外打。他们已经不问秦军会不会出来，只问这一回往哪边去。"
 hd_j16.1420.t_s1:0 "秦收关中"
 hd_j16.1420.desc_s1:0 "苻氏入长安称号以后，关中仍有不少城邑各自闭门观望。[hd_news_a.GetName]不再等他们来降，遣将四出，先向[hd_news_b.GetName]的地方动手。\n\n渭水两岸的村落里，人们把粮食藏进地窖，又把地窖口重新填平。我问一个老农怕不怕，他说怕也没用：这些年关中换了几回主人，每一回都说是最后一回。"
 hd_j16.1420.t_s2:0 "秦兵西上陇坂"
 hd_j16.1420.desc_s2:0 "关中初定，[hd_news_a.GetName]的兵马便越过陇山，往天水、南安一带去了。陇上诸郡本来各有依附，[hd_news_b.GetName]首当其冲。\n\n陇坂道窄，驮粮的牲口一匹接一匹，从坡下望上去，像一条不见尾的绳子。山里的羌、氐部落派人下来打探，回去时带走的话只有一句：秦人这回是要把陇右收进来。"
 hd_j16.1420.t_s3:0 "秦军东收燕地"
 hd_j16.1420.desc_s3:0 "邺城既下，燕室的余众仍散在河北、幽州的城邑里，有人据城自守，有人观望去就。[hd_news_a.GetName]遣兵东出，先找上了[hd_news_b.GetName]。\n\n从关中开来的兵车沿着旧日燕军南下的路往回走。路边的人看了几年燕旗，如今又看秦旗，有人已经学会在门楣上什么都不挂。"
 hd_j16.1420.t_s4:0 "秦伐仇池"
 hd_j16.1420.desc_s4:0 "仇池山四面绝壁，杨氏据此数十年，在晋、秦之间左右逢源。如今[hd_news_a.GetName]不再容它两属，大军南指武都，[hd_news_b.GetName]只能据险一战。\n\n山下的人说，仇池上面有田有泉，守得住一年半载。可他们也知道，守得住山，守不住山下的路；路一断，山上的人迟早要下来。"
 hd_j16.1420.t_s6:0 "秦军西指姑臧"
 hd_j16.1420.desc_s6:0 "张氏据河西已经几代，向来奉晋正朔，与关中隔着一条黄河相望。[hd_news_a.GetName]的兵马终于渡河西进，与[hd_news_b.GetName]兵戎相见。\n\n河西商旅最先听到消息，走到半路的驼队纷纷折回。姑臧城里有人说凉州自有山河之固，也有人悄悄打听，秦人对降者怎样安置。"
 hd_j16.1420.t_s7:0 "秦兵北出云中"
 hd_j16.1420.desc_s7:0 "代北草原上，拓跋部与诸部的恩怨由来已久。[hd_news_a.GetName]趁其内外不和，遣兵北出，矛头指向[hd_news_b.GetName]。\n\n秋草正长，牧人把马群往北赶，帐篷一夜之间拔起一片。南来的兵马走得慢，可他们背后有关中的粮，这一点，草原上的人比谁都看得明白。"
 hd_j16_border_cb:0 "边境争地"
 hd_j16_border_cb_desc:0 "两国边境上的小规模争夺，只争一县之地，只能由剧情发起。"
 HD_J16_BORDER_WAR_NAME:0 "[ATTACKER.GetPrimaryTitle.GetNameNoTierNoTooltip]犯[DEFENDER.GetPrimaryTitle.GetNameNoTierNoTooltip]边之战"
 hd_j16_border_victory_desc:0 "[attacker.GetShortUIName|U]夺取所争之县，双方约定三年不再交兵。"
 hd_j16_border_white_peace_desc:0 "双方罢兵，[attacker.GetShortUIName|U]略付赔偿，三年不再交兵。"
 hd_j16_border_defeat_desc:0 "[attacker.GetShortUIName|U]兵败而还，须向守方赔偿，三年不再交兵。"
