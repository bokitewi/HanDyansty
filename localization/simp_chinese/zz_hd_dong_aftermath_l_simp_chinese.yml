l_simp_chinese:
 hd_dong_aftermath.0010.t:0 "宫门换戍"
 hd_dong_aftermath.0010.desc:0 "宫门外的甲兵声稍稍平息，王允入殿禀报董卓已死，吕布立在阶下，身后的军士换了号令。那一刻，你几乎以为连日压在殿中的那口气也松开了。\n\n可随后呈上来的，是朝政与军镇的新安排：王允主持政务，吕布掌握长安一带的兵众；四方州郡却并没有因为董卓伏诛，便把印信与兵权重新奉还御前。\n\n你听他们逐项说完，望向殿外。杀死一个挟持天子的人，与让天子能够发号施令，原来并不是一回事。眼下能先守住的，仍只是这几重宫门，和尚肯听命的这些人。"
 hd_dong_aftermath.0010.a:0 "先安宫城，再图朝政。"
 hd_li_jue_changan_cb:0 "夺取长安"
 hd_li_jue_changan_cb_name:0 "夺取长安"
 HD_LI_JUE_CHANGAN_WAR_NAME:0 "李傕进攻长安之战"
 hd_li_jue_event_troops:0 "凉州旧部"
 hd_li_jue_changan_victory_desc:0 "李傕取得京兆，以长安为都；王允及其在天子境内的亲族、妻室，连同养女貂蝉，尽遭诛戮。"
 hd_li_jue_changan_no_victory_desc:0 "李傕未能攻取长安。"
 hd_dong_aftermath.0020.t:0 "未央之约"
 hd_dong_aftermath.0020.desc:0 "天子病愈，诏百官会于未央殿。王允亲自来请，说一切仪注都已备好。\n\n可昨夜有人在府门外留下一块写着「吕」字的布。近来奉先见你，总是低着头答话。"
 hd_dong_aftermath.0020.a:0 "照常入朝。"
 hd_dong_aftermath.0020.b:0 "称病不出，过些时日再说。"
 hd_dong_aftermath.0021.t:0 "诛董之期"
 hd_dong_aftermath.0021.desc:0 "天子病愈，百官将会于未央殿，董卓必定入朝。诏书已经备下，并州的亲兵也换上了卫士的衣甲，守在北掖门。\n\n这样的机会不会再有第二次。"
 hd_dong_aftermath.0021.a:0 "就在今日动手。"
 hd_dong_aftermath.0021.b:0 "时机未到，再等一等。"
