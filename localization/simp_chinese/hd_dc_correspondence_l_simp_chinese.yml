l_simp_chinese:
 hd_dc_ord.0019.c: "请共同信任的人担保，先往来一封公开书信。"
 hd_dc_ord.0019.c.tt: "选择一位你与青年相互好感均至少60的实际保证人。青年与保证人须分别在三个月内接受，之后实际支付青年30金作为书信事务费用；再给两人三个月提交具名公开答复。两份齐备后，危世−2，二人对你好感各+15，实际怀有旧怨的偏激家臣可能对你−10。拒绝、失效或逾期不获得成功奖励；已经发生的收付保留记录。"
 hd_dc_ord.0119.t: "两处待落的署名"
 hd_dc_ord.0119.desc: "使者展开一封没有密封的书信。纸上没有官职，也没有兵马，只请我公开写明愿意如何与对方往来。\n\n[scope:hd_dc_ordinary.Var('hd_dc_actor').Char.GetTitledFirstName]请青年和保证人各自答复；两个人的名字齐了，才会拨付办理书信的费用。父辈的旧怨仍在，这封信却要由眼前的人自己落笔。"
 hd_dc_ord.0119.a: "我愿署名，也会亲自答复。"
 hd_dc_ord.0119.b: "我不愿替这次往来作出承诺。"
 hd_dc_ord.0219.t: "该由我落笔了"
 hd_dc_ord.0219.desc: "两份同意的答复已经送达，书信事务的费用也已实际交付青年。书吏把纸推到我面前，等我写下自己的名字。\n\n我可以公开确认愿意进行这次有限往来，也可以承认自己已不愿继续。这一笔将记作我本人的答复，不能再由旁人代签。"
 hd_dc_ord.0219.a: "写明来往之意，署上我的名字。"
 hd_dc_ord.0219.b: "停笔。我不能继续这个承诺。"
 hd_dc_ord.0319.t: "书信归档"
 hd_dc_ord.0319.completed: "书吏将两份具名答复并在一起。青年与保证人都完成了自己答应的事，办理费用也有实际收付记录。\n\n这一次往来已经办结。它没有抹去父辈的旧怨，却留下了眼前这些人可以据以相处的一件新事。"
 hd_dc_ord.0319.rejected: "拒绝的答复已经归档。所需的同意没有齐备，办理费用没有因此付出，也没有人被记作完成了合作。"
 hd_dc_ord.0319.unpaid: "书吏在收支栏停下了笔：办理费用没有完整收付。书信合作不能按已获经费继续。已经实际扣走或到账的金额仍留在账上，不能用一笔成功结案覆盖。"
 hd_dc_ord.0319.withdrawn: "有人在落笔前撤回了承诺。已经送出的答复仍保留具名记录，尚未完成的部分也如实留白。\n\n这次合作没有完成。收付另有账目，不能因为归档就当作钱从未交过。"
 hd_dc_ord.0319.expired: "期限到了，书吏仍未收齐所需的答复。归档的纸页记录了谁曾同意、谁实际回信，以及已经发生的收付；空白处不会被补写成成功。"
 hd_dc_ord.0319.invalidated: "原先约定往来的人已经不能按原条件继续。书吏停止催信，把现有答复与收支记录一并归档。\n\n未完成的合作不产生成功奖励，已有账目也不会被抹去。"
 hd_dc_ord.0319.a: "按实际经过归档。"
