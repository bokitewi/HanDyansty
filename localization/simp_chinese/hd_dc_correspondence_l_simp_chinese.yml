l_simp_chinese:
 hd_dc_ord.0019.c: "请共信之人作保，先通书信。"
 hd_dc_ord.0019.c.tt: "若[hd_dc_visitor.GetTitledFirstName]与保人都肯应允，你便赠[hd_dc_visitor.GetHerHim]一份薄礼以示诚意，再与之书信往来："
 hd_dc_ord.0119.t: "一封未封的信"
 hd_dc_ord.0119.desc: "使者展开一封没有封口的信。信上不谈官职，也不提兵马，只问愿不愿意坦坦荡荡地往来一回。\n\n[scope:hd_dc_ordinary.Var('hd_dc_actor').Char.GetTitledFirstName]在信里说得明白：与[scope:hd_dc_ordinary.Var('hd_dc_visitor').Char.GetTitledFirstName]父辈的旧怨，暂且放在一边；此番请[scope:hd_dc_ordinary.Var('hd_dc_guarantor').Char.GetTitledFirstName]居中作保。两人都点了头，书信才能往来，[scope:hd_dc_ordinary.Var('hd_dc_actor').Char.GetSheHe]也将备一份薄礼，以示诚意。\n\n旧账尚未算清，这一笔，却要由眼前的人自己落下。"
 hd_dc_ord.0119.a: "愿署其名，亲自作答。"
 hd_dc_ord.0119.a.tt: "#EMP 须两人都应允，书信方能往来。#!"
 hd_dc_ord.0119.b: "此约，恕难应承。"
 hd_dc_ord.0219.t: "轮到你落笔"
 hd_dc_ord.0219.desc: "两人都已应允，[scope:hd_dc_ordinary.Var('hd_dc_actor').Char.GetTitledFirstName]的礼物也已送到[scope:hd_dc_ordinary.Var('hd_dc_visitor').Char.GetTitledFirstName]手中。书吏把纸推到你面前，等你写下自己的名字。\n\n这封信写出去，便是当众表明心迹；若此刻反悔，也还来得及。只是这一笔，旁人代签不得。"
 hd_dc_ord.0219.a: "写明来往之意，署上己名。"
 hd_dc_ord.0219.b: "搁笔。此诺，吾不能践。"
 hd_dc_ord_correspondence_archive_title: "一束书信"
 hd_dc_ord.0319.completed: "[scope:hd_dc_ordinary.Var('hd_dc_visitor').Char.GetTitledFirstName]与[scope:hd_dc_ordinary.Var('hd_dc_guarantor').Char.GetTitledFirstName]的回信都送到了。书吏把它们与[scope:hd_dc_ordinary.Var('hd_dc_actor').Char.GetTitledFirstName]的去信并在一处，用丝绳束好。\n\n父辈的旧怨没有因此一笔勾销，可眼前这几个人之间，总算有了一桩可以据以相处的新事。"
 hd_dc_ord.0319.rejected: "有人回绝了这封信，没能两边都点头。礼物没有送出，书信也就无从往来。\n\n这一回的好意，只能先收起来了。"
 hd_dc_ord.0319.unpaid: "两人都已应允，那份薄礼却没能如数送到。书吏在账簿上停了笔，书信往来也就此搁下。\n\n礼没送全，信也没能往来，这桩好事只得半途而止。"
 hd_dc_ord.0319.withdrawn: "信写到一半，有人搁了笔，收回了先前的应允。\n\n礼物已经送出，书信却终究没能往来。这一回的和解，到底差了最后一步。"
 hd_dc_ord.0319.expired: "日子一天天过去，该来的回信始终没有收齐。\n\n书吏把已到的几封叠好收起。没写完的那一半，就这么空着。"
 hd_dc_ord.0319.invalidated: "情形已经变了，原先约定往来的人，有的已不能再照原样行事。书吏不再催信，把已有的几封收在一处。\n\n这一回的往来，没能有个结果。"
 hd_dc_ord.0319.a: "且将书信收好。"
