l_simp_chinese:
 hds_nr.1.t:0 "南阳黄巾来降"
 hds_nr.1.desc:0 "自我据有南阳，已过三十日。郡中流散的黄巾军遣使而至，请求归附。\n\n刘辟、黄邵、何仪、何曼等人的部众愿受整编，列入麾下。可收编的农民兵共计三万五千九百四十九人；仍在人世且能离开原处的诸将，也将陆续入廷听命。"
 hds_nr.1.a:0 "纳其归降，整编诸部！"
 hds_nr_nanyang_yellow_turbans:0 "南阳黄巾降军"
 hds_nr_sun_jian_mortal_risk:0 "江东猛虎的险途"
 hds_nr_sun_jian_mortal_risk_desc:0 "讨董联军散去后，孙坚仍屡冒锋镝，身处险局。常规战死分支权重提高，健康、谋略防范与旅途安全下降。"
