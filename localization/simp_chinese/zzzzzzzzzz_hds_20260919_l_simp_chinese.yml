l_simp_chinese:
 hds_nr.1.t:0 "南阳黄巾来降"
 hds_nr.1.desc:0 "南阳流散的黄巾部众遣人前来请降。名册念到后来，来人已口干舌燥，你叫他先停下喝口水，自己翻看后面的名字。\n\n人数报得一丝不差，真要编起伍来，却不知还得费多少工夫。刘辟、黄邵、何仪、何曼等旧部也列在其中；肯来相从的将领，自会陆续报到，不必都挤进今日这一份许诺里。\n\n你将名册留在案前。营门不能只管放人进来，谁领哪一队、谁听哪道令，都得接着分明。人既肯归，总比让他们散在乡间、与你的兵隔着田埂相望要好。"
 hds_nr.1.a:0 "收其众，编其伍。"
 hds_nr_nanyang_yellow_turbans:0 "南阳黄巾降军"
 hds_nr_sun_jian_mortal_risk:0 "江东猛虎的险途"
 hds_nr_sun_jian_mortal_risk_desc:0 "讨董诸军散去之后，该角色仍屡冒锋镝、出入险地，左右常为之捏一把汗。"
