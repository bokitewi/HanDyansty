l_simp_chinese:
 building_type_hd_shouchun_city_01:0 "寿春城"
 building_type_hd_shouchun_city_01_desc:0 "寿春在淮水南岸，背倚八公山，肥水绕城北流入淮。楚考烈王东徙都于此，仍号为郢；汉兴之后，淮南王刘安亦都于此，招致宾客方士，著书论道，此城遂为淮南第一都会。"
 building_hd_shouchun_city_01:0 "$building_type_hd_shouchun_city_01$"
 building_hd_shouchun_city_01_desc:0 "$building_type_hd_shouchun_city_01_desc$"
 building_type_hd_jinyang_city_01:0 "晋阳城"
 building_type_hd_jinyang_city_01_desc:0 "晋阳是赵简子家臣董安于所筑的古城，智伯曾引水灌城，城中悬釜而炊，赵襄子仍坚守不降，终灭智氏。城在汾水之畔，如今为太原郡治所、并州重镇。"
 building_hd_jinyang_city_01:0 "$building_type_hd_jinyang_city_01$"
 building_hd_jinyang_city_01_desc:0 "$building_type_hd_jinyang_city_01_desc$"
 building_type_hd_yubi_city_01:0 "玉璧城"
 building_type_hd_yubi_city_01_desc:0 "河东郡汾水南岸有一片高阜，阜上平坦，四周沟壑深陷，宛如天然的城垣。站在阜上可以俯瞰汾水河谷，往来于太原与平阳之间的行旅都在眼底。"
 building_hd_yubi_city_01:0 "$building_type_hd_yubi_city_01$"
 building_hd_yubi_city_01_desc:0 "$building_type_hd_yubi_city_01_desc$"
 building_type_hd_baidi_city_01:0 "白帝城"
 building_type_hd_baidi_city_01_desc:0 "巴郡鱼复县，大江在此冲开峡口，山崖壁立。相传公孙述据蜀之时，见井中白气如龙，自号白帝，于山上筑城；城高踞峡口，扼守巴蜀东出荆楚的水路。"
 building_hd_baidi_city_01:0 "$building_type_hd_baidi_city_01$"
 building_hd_baidi_city_01_desc:0 "$building_type_hd_baidi_city_01_desc$"
 building_type_hd_yecheng_city_01:0 "邺城"
 building_type_hd_yecheng_city_01_desc:0 "邺是齐桓公所筑的古城。战国时西门豹为邺令，破除河伯娶妇的陋俗，又开渠引漳水灌田，邺地由此富饶。如今为魏郡治所，城郭严整，市里繁盛，是河北数一数二的大城。"
 building_hd_yecheng_city_01:0 "$building_type_hd_yecheng_city_01$"
 building_hd_yecheng_city_01_desc:0 "$building_type_hd_yecheng_city_01_desc$"
 building_type_hd_yecheng_three_platforms_01:0 "邺城三台"
 building_type_hd_yecheng_three_platforms_01_desc:0 "邺城西北隅城垣高厚，地势高爽，登城北望可见漳水东流，西眺则太行横亘。此处正宜筑台观览，若有雄主在此起高台、会宾客，必将名动天下。"
 building_hd_yecheng_three_platforms_01:0 "$building_type_hd_yecheng_three_platforms_01$"
 building_hd_yecheng_three_platforms_01_desc:0 "$building_type_hd_yecheng_three_platforms_01_desc$"
 building_type_hd_pengcheng_city_01:0 "彭城"
 building_type_hd_pengcheng_city_01_desc:0 "彭城相传是彭祖的封国，西楚霸王项羽也曾建都于此。城据泗水与获水交汇之处，北控齐鲁，南通江淮，城垣高大，市坊环列，如今为彭城国都。"
 building_hd_pengcheng_city_01:0 "$building_type_hd_pengcheng_city_01$"
 building_hd_pengcheng_city_01_desc:0 "$building_type_hd_pengcheng_city_01_desc$"
 building_type_hd_linzi_city_01:0 "临淄城"
 building_type_hd_linzi_city_01_desc:0 "临淄是齐国故都，大城与小城相连，宫殿、宗庙与市里各安其位。苏秦曾说此城街上车毂相击，行人摩肩，举袖可以成幕，挥汗可以成雨，至今仍是东方首屈一指的大都会。"
 building_hd_linzi_city_01:0 "$building_type_hd_linzi_city_01$"
 building_hd_linzi_city_01_desc:0 "$building_type_hd_linzi_city_01_desc$"
 building_type_hd_tongwan_city_01:0 "统万城"
 building_type_hd_tongwan_city_01_desc:0 "上郡以北，奢延水畔有一片白土高地，四面沙碛与水草相杂，匈奴与羌胡的部众常在此游牧。此地土色白而坚实，夯筑起来坚如砥石。"
 building_hd_tongwan_city_01:0 "$building_type_hd_tongwan_city_01$"
 building_hd_tongwan_city_01_desc:0 "$building_type_hd_tongwan_city_01_desc$"
 building_type_hd_zuoguo_city_01:0 "左国城"
 building_type_hd_zuoguo_city_01_desc:0 "西河郡离石以北的左国城，是南匈奴部众聚居之地。城垣环列，城中民居稀疏，毡帐与牧群散布四野，一派塞上荒凉气象。"
 building_hd_zuoguo_city_01:0 "$building_type_hd_zuoguo_city_01$"
 building_hd_zuoguo_city_01_desc:0 "$building_type_hd_zuoguo_city_01_desc$"
 building_type_hd_xiangyang_city_01:0 "襄阳城"
 building_type_hd_xiangyang_city_01_desc:0 "襄阳城北临汉水，与樊城隔江相望，城南有岘山屏障，城高池深。南阳通往江陵的大道由此经过，是江汉之间扼守南北的要冲。"
 building_hd_xiangyang_city_01:0 "$building_type_hd_xiangyang_city_01$"
 building_hd_xiangyang_city_01_desc:0 "$building_type_hd_xiangyang_city_01_desc$"
 building_type_hd_hefei_city_01:0 "合肥城"
 building_type_hd_hefei_city_01_desc:0 "合肥地处江淮之间，夏日水涨，施水与肥水在此相合，故名合肥。南方的皮革、鲍鱼与木材都在这里集散，是江淮之间的商贸都会。"
 building_hd_hefei_city_01:0 "$building_type_hd_hefei_city_01$"
 building_hd_hefei_city_01_desc:0 "$building_type_hd_hefei_city_01_desc$"
