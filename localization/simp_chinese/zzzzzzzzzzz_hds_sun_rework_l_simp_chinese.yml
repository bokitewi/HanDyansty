l_simp_chinese:
 hds_sq_base_army:0 "孙氏讨逆旧部"
 hds.5100.t:0 "岘山殒命"
 hds.5100.desc:0 "袁术一纸军令，命你南下讨伐刘表。你一路连战连捷，渡过汉水，把襄阳围了个水泄不通。\n\n这一夜你只带了几骑出营，想趁月色登上岘山，看一看城中虚实。山道狭窄，竹林森森，四下静得出奇。\n\n弓弦声是从林子里同时响起的。荆州的伏兵早已等在这里，你拨马回身已来不及。乱箭之中，你最后望见的，是襄阳城头摇曳的火光。"
 hds.5100.a:0 "伯符……江东，就交给你了……"
 hds.4100.t:0 "接掌江东"
 hds.4100.desc:0 "兄长走得太突然。前一日他还在校场上挽弓，今日营门已挂满了白幡。\n\n帐下诸将都望着你。兄长临终把印绶交到你手里，只说了一句：举江东之众，决机于两陈之间，与天下争衡，你不如我；举贤任能，各尽其心，以保江东，我不如你。\n\n你攥紧了那方印绶。父兄没有走完的路，如今要由你来走。"
 hds.4100.a:0 "承父兄之业，定江东。"
