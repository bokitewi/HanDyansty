l_simp_chinese:
 hds_sq_base_army:0 "孙氏讨逆旧部"
 hds.5100.t:0 "岘山殒命"
 hds.5100.desc:0 "前面的山路越走越窄，我抬手示意后骑靠拢，林中忽然响起弓弦声。\n\n箭矢擦过马颈，坐骑猛地侧身，把我撞向道旁。亲兵扑来扶我，肩头却先中了一箭。我们原要探看荆州军的动静，如今两侧尽是伏兵，来时尚能容马转身的路，也被滚下的木石堵住。\n\n我拔剑让众人往低处退，喊声很快被林间的呼喝压了下去。胸腹间一阵剧痛，握剑的手也开始发沉。我想起伯符，还有许多家事没来得及交代。若有人能从这里逃出去，务必要告诉他：先收拢旧部，不要急着报仇。"
 hds.5100.a:0 "伯符……江东，就交给你了……"
 hds.4100.t:0 "接掌江东"
 hds.4100.desc:0 "兄长留下的印绶交到我面前，绶带上还有经手者未掸净的灰。来人照旧禀报部众与家业，说到请谁裁断时，才停下来望着我。\n\n我曾跟在父兄身边听他们议事，这些声音我早已熟悉，可从前总有父兄作主，如今却要我拿主意。眼下有人问粮，有人问守备，还有人只想知道旧日的许诺是否仍算数；他们等的不是一句哀痛的话。\n\n孙氏还有多少事未定，不能靠父兄的名字便替我办妥。眼前这些人肯留下，已是孙氏此刻最可倚仗的力量。我把印绶收近些，请来人继续往下说。兄长未能安排完的事，须先一件件弄明白，再谈往后的去处。"
 hds.4100.a:0 "承父兄之业，定江东。"
