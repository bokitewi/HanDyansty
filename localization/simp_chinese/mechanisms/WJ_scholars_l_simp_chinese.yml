 WJ_yangwang.custom:0 "自题雅号"
 WJ_yangwang.custom.desc:0 "候选暂且收起，我决定亲拟雅号。这个名字将用于往后的自处与交游，不必刻意写得奇僻，先使自己真正愿意沿用便好。\n\n请填写非空的单行文字，再确认采用。若现在取消，已确认的旧名仍会保留，尚未定下的草稿不作替换。"
 WJ_yangwang.dongshan:0 "东山隐士"
 WJ_yangwang.keep:0 "仍用旧号。"
 WJ_yangwang.naming.desc:0 "暂谢尘务之后，我想为这段读书自处的日子定一个雅号。旁人怎样品评尚难预料，至少这个名字应当说明我此刻愿意怎样生活。\n\n可从下列类别选取，也可亲自拟定；已有确认的雅号，则可沿用。选名与确认之后才按此次安排办理，翻看候选不等于已经改变称号。若仍未想妥，可以取消，不必为凑一个雅名而仓促落笔。"
