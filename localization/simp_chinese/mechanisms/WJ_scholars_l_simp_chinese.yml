 WJ_yangwang.custom:0 "不如自题一号。"
 WJ_yangwang.custom.desc:0 "你把几组现成的名号推到一边，决意亲自题写。这个名号往后要随你自处与交游，不必刻意求奇，但求日后提笔署名时，自己不觉生分。\n\n若一时想不妥，搁笔也无妨。"
 WJ_yangwang.dongshan:0 "东山隐士"
 WJ_yangwang.keep:0 "仍用旧号。"
 WJ_yangwang.naming.desc:0 "山居读书，总该有个雅号。旁人如何品评尚难预料，至少这个名号应当说出你此刻愿意怎样生活；若你尚未归隐，名号定下之日，便是你辞别尘务、闭门养望之时。\n\n或取山居林泉之意，或寄水月志趣之思，也可自出机杼；若已有旧号，仍署旧号亦无不可。倘若一时想不妥，不妨暂且搁笔。"
 WJ_yangwang.naming.title:0 "山中何名"
