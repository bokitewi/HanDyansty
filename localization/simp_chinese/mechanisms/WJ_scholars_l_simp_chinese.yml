l_simp_chinese:
# 汉晋风华：按类型整合；键名与现行文本保留。来源逐键见本批manifest。

 # 来源：localization/simp_chinese/WJ_qingyi_loc_l_simp_chinese.yml
 activity_window_character_ming_shi:0 "特邀名士\n[Character.Custom('WJ_GetUIName')|U]"
 activity_wj_qingyi:0 "清议"
 activity_wj_qingyi_conclusion_desc:0 "宾主敛袖而起，今日之言已成月旦，余论仍将流传。"
 activity_wj_qingyi_desc:0 "延请同道，陈设几席，谈玄理，析名教，品人物，论经世。席间的片言只语，或可使人声名鹊起，亦可能种下嫌隙。"
 activity_wj_qingyi_destination_selection:0 "选择一处有馆舍可容宾主清谈的地点。"
 activity_wj_qingyi_guest_desc:0 "\n$BULLET_WITH_TAB$参与者可能获得[prestige_i][prestige|E]与[merit_i][merit|E]\n$BULLET_WITH_TAB$已入仕途、负有清望者，可能增长清议[trait_level_track_xp|E]\n$BULLET_WITH_TAB$参与者可能根据其[intent|E]获得请益、交游或解忧的机会"
 activity_wj_qingyi_guest_help_text:0 "[activity_guests|E]在席间或受人诘难，或向名士请益，或品评人物、结交同道，也可能卷入席后的私语。"
 activity_wj_qingyi_guest_rewards:0 "\n$BULLET_WITH_TAB$宾客可获得[prestige_i][prestige|E]与[merit_i][merit|E]\n$BULLET_WITH_TAB$一年之内，清议[trait_level_track_xp|E]只在首场清议中增长"
 activity_wj_qingyi_host_an_a:0 "$articleblank_article$"
 activity_wj_qingyi_host_desc:0 "$activity_wj_qingyi_host_rewards$$activity_wj_qingyi_guest_rewards$"
 activity_wj_qingyi_host_rewards:0 "\n$BULLET_WITH_TAB$主人可获得[prestige_i][prestige|E]与[merit_i][merit|E]\n$BULLET_WITH_TAB$已入仕途、负有清望者，可增长清议[trait_level_track_xp|E]\n$BULLET_WITH_TAB$若开“月旦评”，主人可获得大量[prestige_i][prestige|E]；当选者声名大振，另得[influence|E]与“名士”之誉"
 activity_wj_qingyi_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]的清议"
 activity_wj_qingyi_owner:0 "清议主人"
 activity_wj_qingyi_plural:0 "清议"
 activity_wj_qingyi_predicted_cost:0 "预计花费"
 activity_wj_qingyi_province_desc:0 "你将在[ROOT.Province.GetName]举行清议。馆舍清静、宾客往来便利之地，最宜长坐论道。"
 activity_wj_qingyi_selection_tooltip:0 "举办[GetActivityType('activity_wj_qingyi').GetName]，延揽名士，谈玄品人。"
 ming_shi:0 "特邀名士"
 ming_shi_desc:0 "一位声望卓著的名士。其一言之鉴可使满座倾听，席间求教与品题之事也因之更多。"
 ming_shi_desc_for_host:0 "$ming_shi_desc$"
 ming_shi_for_host:0 "特邀名士"
 qingyi_guest_learning_intent:0 "求学"
 qingyi_guest_learning_intent_desc:0 "你希望借此清议向名士与同道执经问难，散席时在学问上有所长进。"
 qingyi_yuedan_intent:0 "月旦评"
 qingyi_yuedan_intent_desc:0 "你欲效汝南许子将故事，月旦品评当世人物：先提名八人，再由与会宾客两度品第，八人留四，四人定一。当选者声名大振，得享“名士”之誉。"
 qingyi_option_tea:0 "茶点准备"
 qingyi_option_tea_desc:0 "茶烟清润，可以养神久坐。茶点精洁，宾客入席便先对主人多一分好感，名士与好学者也更愿展卷深谈。"
 qingyi_option_topic_depth:0 "论题深度"
 qingyi_option_topic_depth_desc:0 "定下此番所谈玄理、经义与政论的深浅。论题愈深，愈易招来请益与机锋，月旦评中为人张目时也更能折服众议。"
 qingyi_option_wine:0 "美酒款待"
 qingyi_option_wine_desc:0 "定下席间是否以酒助兴。有酒则宾客更乐于赴会，借清谈解忧者也更能一舒胸中块垒，只是酒酣之后，难保无人放达失仪。"
 qingyi_phase_conclusion:0 "品题散席"
 qingyi_phase_conclusion_desc:0 "收束群言，品定今日人物，也为此会留下最后一笔。"
 qingyi_phase_lunshi:0 "论时事"
 qingyi_phase_lunshi_desc:0 "宾主据席，先论时局与经义。若开月旦之评，主人便在此时提出八位人物。"
 qingyi_phase_pinren:0 "品人物"
 qingyi_phase_pinren_desc:0 "逐一品题当世人物。若开月旦之评，此轮议毕，八人之中只留其四。"
 qingyi_phase_dingping:0 "定评"
 qingyi_phase_dingping_desc:0 "终评四人，推举一人为第一。"
 qingyi_relief_intent:0 "清谈解忧"
 qingyi_relief_intent_desc:0 "你希望暂离案牍与纷争，借玄言、茶酒与同道之交，舒缓胸中积郁的[stress|E]。"
 qingyi_tea_refined:0 "精备茶点"
 qingyi_tea_refined_desc:0 "择水烹茶，细备果饵，使名士与好学者更愿展卷深谈。"
 qingyi_tea_simple:0 "简备茶点"
 qingyi_tea_simple_desc:0 "数盘果饵，一盏清茶，宾主不以口腹分心。"
 qingyi_topic_deep:0 "高深论题"
 qingyi_topic_deep_desc:0 "直入有无、名教与自然等玄理深处，更易招来请益与机锋。"
 qingyi_topic_plain:0 "平实论题"
 qingyi_topic_plain_desc:0 "从可亲可感的人物与日用之理谈起，更利交游，也少有折角之争。"
 qingyi_wine_generous:0 "备酒助兴"
 qingyi_wine_generous_desc:0 "多备美酒，任宾客挥麈纵言，更易生出放达与失仪之事。"
 qingyi_wine_none:0 "以茶代酒"
 qingyi_wine_none_desc:0 "不设酒盏，以茶清心，言谈较为克制。"
 WJ_qingyi_all_attending_guests:0 "所有在席宾客"
 WJ_qingyi_guest_reward_log:0 "在席宾客自始至终与会，于群言交游之中各有所得"
 WJ_qingyi_guest_reward_log_title:0 "宾客满载而归"
 WJ_qingyi_host_reward_log:0 "[CHARACTER.Custom('WJ_GetUIName')]主持清议告成，群贤称善，声名清望俱有所增"
 WJ_qingyi_host_reward_log_title:0 "主人收束群言"
 WJ_qingyi_opening_log:0 "[CHARACTER.Custom('WJ_GetUIName')]整衣入席，举麈发言，今日清议由此开始"
 WJ_qingyi_opening_log_title:0 "清议开席"

