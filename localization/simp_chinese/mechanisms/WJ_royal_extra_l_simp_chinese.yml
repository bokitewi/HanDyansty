 ZongWang_ShiHao.020.event_title: "追谥太子"
 ZongWang_ShiHao.020.event_desc:0 "太子身后的礼议呈到案前，有司请定其谥。你听见“东宫”二字，先想到的仍是那些尚未办完的事，片刻之后，才把目光移到候选的谥字上。\n\n人已不在，礼官却还得按次序问下去。曾经为往后所作的种种打算，如今只剩下如何写进身后的记录；生平这一页翻过，后面再没有新事可添。\n\n你将候选又看了一遍。礼官持笔候着，不敢催促，可那空白处终究要留下一个称呼。"
 ZongWang_ShiHao.020.a0: "$Color_ZanBai$不循旧谥，亲为拟定"
