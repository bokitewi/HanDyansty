 ZongWang_ShiHao.021.event_title: "追谥太子"
 ZongWang_ShiHao.021.event_desc:0 "太子年幼而逝，东宫的许多安排尚未展开，便已转成了身后之事。有司呈上谥字的候选，声音比平日放得更轻，仿佛怕这些郑重的字眼也会压得太重。\n\n你看着那份短短的生平记录，不愿把尚未来得及发生的事填进去。一个孩子未能长成，并不需要先有一段圆满的功业，才值得被认真哀悼。\n\n谥号终究要定下。落笔之时，你想留下的，是这一段短暂却确曾有过的生命，而不是众人曾替他设想过的将来。"
