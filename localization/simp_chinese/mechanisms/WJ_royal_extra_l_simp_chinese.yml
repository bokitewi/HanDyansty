 ZongWang_ShiHao.022_t: "亲拟谥号"
 ZongWang_ShiHao.022_d:0 "候选既已收起，案上只剩笔墨与一处空白。那些关于储位与身后礼制的解说，也终于暂时停了。\n\n你将手搁在案边，迟迟没有握笔。生前那么多人替东宫设想往后，如今都退到一旁，等你写下这最后一个称呼。"
 ZongWang_ShiHao.022.a: "就以此为谥。"
 SanGong_Zongzu.002.t: "册立太孙"
 SanGong_Zongzu.002.d:0 "[Taizi.GetName]已逝，丧事尚在料理，储嗣的名册便又送到你面前。你听见那熟悉的称呼，手指在案边停了一下，才让来人接着念下去。\n\n这一支后嗣之中，是否另择一人承续储位？名字一个个读过，你试着把每一张面孔想清楚。亡者留下的是一处空缺，站到那里的人，却不该只被当作填补空缺的一笔。\n\n你把名册留在手边，没有催人起草颂辞。堂下等着的只是一个名字，你想到的，却是那人从此再也回不去的寻常日子。"
 SanGong_Zongzu.002.a: "立为太孙"
 SanGong_Zongzu.002.b: "不立太孙，另择储君"
