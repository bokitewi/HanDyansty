 WJ_qingyi.2011.t:0 "臧否时人"
 WJ_qingyi.2011.desc:0 "主人[host.Custom('WJ_GetLinkedUIName')]忽然转向你，问你对[wj_qingyi_subject.Custom('WJ_GetLinkedUIName')]有何看法。\n\n席间安静下来。品评人物本是清议常事，可此人毕竟是主人治下之人，你的话迟早会传到其本人耳中。"
 WJ_qingyi.2011.a:0 "直陈其短。"
 WJ_qingyi.2011.b:0 "扬其所长。"
 WJ_qingyi.2011.c:0 "不置一词。"
