 WJ_qingyi.2010.t:0 "清谈夜话"
 WJ_qingyi.2010.desc:0 "夜深了，大多数宾客已经回房，廊下只剩你和[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]。月色很好，白天的争论此刻显得很远。\n\n对方斟了两盏茶，问你近来过得怎样。"
 WJ_qingyi.2010.a:0 "倾吐心事。"
 WJ_qingyi.2010.b:0 "但谈玄理，不及私事。"
 WJ_qingyi.2010.c:0 "托辞先寝。"
 WJ_qingyi_log_2010_a:0 "[CHARACTER.Custom('WJ_GetUIName')]与[TARGET_CHARACTER.Custom('WJ_GetUIName')]月下夜话，倾吐心事"
