l_simp_chinese:
# 清议重制·月旦评（2026-10-08）。意图、阶段与筹备选项的键仍在 WJ_scholars_l_simp_chinese.yml。

 # 特质
 trait_hd_yuedan_mingshi:0 "名士"
 trait_hd_yuedan_mingshi_desc:0 "该角色曾在月旦评中被诸贤公推为第一。一经品题，身价十倍，天下士人皆愿与之交游。"

 # 品评类别
 WJ_qingyi_yd_class_1:0 "雄主"
 WJ_qingyi_yd_class_2:0 "奸雄"
 WJ_qingyi_yd_class_3:0 "名将"
 WJ_qingyi_yd_class_4:0 "能臣"
 WJ_qingyi_yd_class_5:0 "谋士"
 WJ_qingyi_yd_class_6:0 "名儒"

 # 品评评语（6 类 × 3 句）
 WJ_qingyi_yd_comment_1_1:0 "据有一方，而志不止于一方。气度恢弘，可以包容群下。"
 WJ_qingyi_yd_comment_1_2:0 "能用人之所长，而不忌人之所能。天下若有所归，或在此人。"
 WJ_qingyi_yd_comment_1_3:0 "坐镇四方，号令所出，士民景从。惜其所虑者大，所失者亦或在细处。"
 WJ_qingyi_yd_comment_2_1:0 "治世之能臣，乱世之奸雄。"
 WJ_qingyi_yd_comment_2_2:0 "机变百出，喜怒不形于色。与之共事者，得其利，亦当防其锋。"
 WJ_qingyi_yd_comment_2_3:0 "胸藏甲兵，口称仁义。其心难测，其才难掩。"
 WJ_qingyi_yd_comment_3_1:0 "临阵果决，士卒乐为之死。三军之中，旌旗所向即是此人。"
 WJ_qingyi_yd_comment_3_2:0 "勇冠一时，可当万人。若得明主驾驭，功业未可量也。"
 WJ_qingyi_yd_comment_3_3:0 "知兵而不黩武，善战而能全军。古之良将，不过如此。"
 WJ_qingyi_yd_comment_4_1:0 "清能理剧，所至之处，仓廪实而讼狱息。"
 WJ_qingyi_yd_comment_4_2:0 "王佐之才。任以州郡则郡治，任以台阁则台阁清。"
 WJ_qingyi_yd_comment_4_3:0 "不以文辞自见，而簿书钱谷皆有条理。治世所倚，正在此等人。"
 WJ_qingyi_yd_comment_5_1:0 "深谋远虑，算无遗策。言出于未然之前，事验于既然之后。"
 WJ_qingyi_yd_comment_5_2:0 "沉默寡言，一语则中的。可与图大事，不可与争小节。"
 WJ_qingyi_yd_comment_5_3:0 "善察人心，长于权变。用之得宜，胜于十万之师。"
 WJ_qingyi_yd_comment_6_1:0 "经明行修，海内宗仰。门下受业者，不远千里而至。"
 WJ_qingyi_yd_comment_6_2:0 "言有物而行有恒，清议所重，正在其人。"
 WJ_qingyi_yd_comment_6_3:0 "辞令雅正，进退有度。可以为一时士林之表率。"

