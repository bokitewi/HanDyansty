 # 3001 论时事·提名
 WJ_qingyi.3001.t:0 "月旦评：论时事"
 WJ_qingyi.3001.desc.host:0 "众人议论了一回时局，从州郡的盗贼说到朝中的人事，话头渐渐都落到了人物身上。你放下麈尾，告诉在座诸位：今日不只清谈，还要效仿汝南故事，品评当世人物，推举一人为第一。\n\n你报出拟好的名单，请诸君在接下来的议论中细加品评："
 WJ_qingyi.3001.desc.guest:0 "众人议论了一回时局，主人[host.Custom('WJ_GetLinkedUIName')]忽然放下麈尾，说今日要效仿汝南故事，品评当世人物，由在座诸君推举一人为第一。\n\n席间先是一静，随即议论纷纷。主人报出了拟好的名单："
 WJ_qingyi.3001.desc.end:0 "\n\n名单一出，有人点头，有人冷笑。接下来几天，名单上这些人的出身、行事与得失，都会被反复拿出来议论。"
 WJ_qingyi.3001.a:0 "且听诸君如何品题。"

 # 3101 投票
 WJ_qingyi.3101.t:0 "月旦评：投票"
 WJ_qingyi.3101.desc:0 "议论已经足够，该表明自己的态度了。侍者在各席前放好竹简，请每位宾客写下自己推举之人。\n\n这一票未必能定局，但写下的名字终究会被人记住。"
 WJ_qingyi.3101.c1:0 "推举[wj_yd_c1.Custom('WJ_GetUIName')]"
 WJ_qingyi.3101.c2:0 "推举[wj_yd_c2.Custom('WJ_GetUIName')]"
 WJ_qingyi.3101.c3:0 "推举[wj_yd_c3.Custom('WJ_GetUIName')]"
 WJ_qingyi.3101.c4:0 "推举[wj_yd_c4.Custom('WJ_GetUIName')]"
 WJ_qingyi.3101.c5:0 "推举[wj_yd_c5.Custom('WJ_GetUIName')]"
 WJ_qingyi.3101.c6:0 "推举[wj_yd_c6.Custom('WJ_GetUIName')]"
 WJ_qingyi.3101.c7:0 "推举[wj_yd_c7.Custom('WJ_GetUIName')]"
 WJ_qingyi.3101.c8:0 "推举[wj_yd_c8.Custom('WJ_GetUIName')]"
 WJ_qingyi.3101.vote_tt:0 "你将此人之名写上竹简，此后或许还能为其奔走一番。"
 WJ_qingyi.3101.abstain:0 "凭平日好恶落笔。"
 WJ_qingyi.3101.abstain_tt:0 "你不再多想，到时凭平日的好恶与交情写下一个名字。"

 # 3102 拉票
 WJ_qingyi.3102.t:0 "月旦评：拉票"
 WJ_qingyi.3102.desc:0 "竹简已经交了上去，要等这一轮议论结束才会点算。你推举的[wj_yd_target.Custom('WJ_GetLinkedUIName')]能否胜出，或许还要看你接下来怎么做。"
 WJ_qingyi.3102.a:0 "以吾声名为之作保。"
 WJ_qingyi.3102.b:0 "奔走权门，为之游说。"
 WJ_qingyi.3102.c:0 "当席辩难，为之张目。"
 WJ_qingyi.3102.c.success:0 "辞锋所至，满座动容"
 WJ_qingyi.3102.c.failure:0 "言多有失，反遭诘难"
 WJ_qingyi.3102.d:0 "不必多言。"
 WJ_qingyi.3102.plus2_tt:0 "#P 席间不少人因此转而推举[wj_yd_target.Custom('WJ_GetUIName')]#!"
 WJ_qingyi.3102.plus3_tt:0 "#P 满座为之动容，多有转而推举[wj_yd_target.Custom('WJ_GetUIName')]者#!"
 WJ_qingyi.3102.minus1_tt:0 "#N 反倒有人因此不愿推举[wj_yd_target.Custom('WJ_GetUIName')]了#!"

 # 3201 品人物
 WJ_qingyi.3201.t:0 "月旦评：品人物"
 WJ_qingyi.3201.desc:0 "这几日的议论都围绕着名单上的那些名字。有人引其旧事，有人述其近况，褒贬之间，各家的品题渐渐成形："
 WJ_qingyi.3201.desc.end:0 "\n\n按事先的约定，这一轮议毕便各投一票，得票最多的四人进入终评。"
 WJ_qingyi.3201.a:0 "吾心中已有人选。"

 # 3301 定评
 WJ_qingyi.3301.t:0 "月旦评：定评"
 WJ_qingyi.3301.desc:0 "名单上只剩下四人。席间的气氛比前几日更紧，众人都知道，下一次点算之后，第一的名号就会传遍各州郡。最后的品题如下："
 WJ_qingyi.3301.desc.end:0 "\n\n这一次只能推举一人。"
 WJ_qingyi.3301.a:0 "落笔定评。"

 # 3401 揭晓
 WJ_qingyi.3401.t:0 "月旦评：一言定品"
 WJ_qingyi.3401.desc:0 "竹简点算完毕，众人公推[wj_yd_winner.Custom('WJ_GetLinkedUIName')]为本次月旦第一。评语当众念了出来：\n\n“[wj_yd_winner.Custom('WJ_qingyi_yd_comment')]”\n\n这句评语很快会被抄录传开。此后各州郡谈论当世人物，都免不了先提到这个名字。"
 WJ_qingyi.3401.desc.self:0 "竹简点算完毕，众人公推的第一，竟是你。评语当众念了出来：\n\n“[wj_yd_winner.Custom('WJ_qingyi_yd_comment')]”\n\n满座的目光都落到你身上。从今往后，这句评语会跟着你的名字传遍天下。"
 WJ_qingyi.3401.a:0 "敢不勉之。"
 WJ_qingyi.3401.b:0 "名下无虚士。"

 # 3501 闻月旦（缺席）
 WJ_qingyi.3501.t:0 "闻月旦"
 WJ_qingyi.3501.desc.winner:0 "有客从[host.Custom('WJ_GetLinkedUIName')]处来，说那里新近办了一场月旦评，在座诸贤品评当世人物，最后竟推你为第一。\n\n“[wj_yd_winner.Custom('WJ_qingyi_yd_comment')]”\n\n这句评语据说已经传开了。你并未在场，名声却已先到了。"
 WJ_qingyi.3501.desc.finalist:0 "有客从[host.Custom('WJ_GetLinkedUIName')]处来，说那里新近办了一场月旦评，你也在终评的四人之中，最后第一归了[wj_yd_winner.Custom('WJ_GetLinkedUIName')]。\n\n未得第一，能入终评，在天下士人眼中也算一份声名。"
 WJ_qingyi.3501.a:0 "致书评主，谦辞以谢。"
 WJ_qingyi.3501.b:0 "坦然受之。"

 # 活动记录
 WJ_qingyi_yd_log_nominate:0 "[CHARACTER.Custom('WJ_GetUIName')]效仿汝南故事，提名八位当世人物，开月旦之评"
 WJ_qingyi_yd_log_nominate_title:0 "月旦开评"
 WJ_qingyi_yd_log_round_two:0 "品人物议毕，八人之中四人入终评"
 WJ_qingyi_yd_log_round_two_title:0 "八进其四"
 WJ_qingyi_yd_log_winner:0 "诸贤公推[CHARACTER.Custom('WJ_GetUIName')]为月旦第一，[TARGET_CHARACTER.Custom('WJ_GetUIName')]亲为品题"
 WJ_qingyi_yd_log_winner_title:0 "一言定品"
 WJ_qingyi_yd_log_finalists:0 "终评落选者亦因入围而声名渐起"
 WJ_qingyi_yd_log_finalists_title:0 "终评诸贤"
 WJ_qingyi_yd_all_finalists:0 "所有落选的终评者"

 # 消息
 WJ_qingyi_yd_msg_title:0 "月旦评定"
 WJ_qingyi_yd_msg_desc:0 "[host.Custom('WJ_GetUIName')]主持月旦评，诸贤公推[wj_yd_winner.Custom('WJ_GetUIName')]为当世第一"

 # 新增通用事件 1009–1012（主人）
 WJ_qingyi_all_honest_attendees:0 "所有诚实的在席宾客"

 WJ_qingyi.1009.t:0 "党锢旧事"
 WJ_qingyi.1009.desc:0 "议论正热，[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]忽然提起了党锢旧事：当年李膺、范滂等人因清议获罪，禁锢终身，乃至死于狱中。\n\n席间一下子安静下来。这件事至今仍是忌讳，在座的人都在等你表态。说得太直，难免传到不该听的人耳中；说得太含糊，又难免被人看轻。"
 WJ_qingyi.1009.a:0 "直言其冤，不避忌讳。"
 WJ_qingyi.1009.a.success:0 "慷慨陈词，满座肃然"
 WJ_qingyi.1009.a.failure:0 "言辞激切，自己反倒心惊"
 WJ_qingyi.1009.b:0 "借古喻今，点到即止。"
 WJ_qingyi.1009.b.success:0 "话锋一转，不留痕迹"
 WJ_qingyi.1009.b.failure:0 "顾左右而言他，被人看穿"
 WJ_qingyi.1009.c:0 "“此席不论朝政。”"
 WJ_qingyi_log_1009_a_success:0 "[CHARACTER.Custom('WJ_GetUIName')]直论党锢之冤，[TARGET_CHARACTER.Custom('WJ_GetUIName')]为之敬服"
 WJ_qingyi_log_1009_a_success_title:0 "$WJ_qingyi.1009.t$"
 WJ_qingyi_log_1009_a_failure:0 "[CHARACTER.Custom('WJ_GetUIName')]论党锢失之激切，事后颇为不安"
 WJ_qingyi_log_1009_a_failure_title:0 "$WJ_qingyi.1009.t$"
 WJ_qingyi_log_1009_b_success:0 "[CHARACTER.Custom('WJ_GetUIName')]借古喻今，将党锢之论轻轻带过"
 WJ_qingyi_log_1009_b_success_title:0 "$WJ_qingyi.1009.t$"
 WJ_qingyi_log_1009_b_failure:0 "[CHARACTER.Custom('WJ_GetUIName')]回避党锢之问，被[TARGET_CHARACTER.Custom('WJ_GetUIName')]看轻"
 WJ_qingyi_log_1009_b_failure_title:0 "$WJ_qingyi.1009.t$"
 WJ_qingyi_log_1009_c:0 "[CHARACTER.Custom('WJ_GetUIName')]明令此席不论朝政"
 WJ_qingyi_log_1009_c_title:0 "$WJ_qingyi.1009.t$"

 WJ_qingyi.1010.t:0 "执经问难"
 WJ_qingyi.1010.desc:0 "年轻的[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]捧着一卷经书走到你席前，恭恭敬敬地行了礼，请你解释其中一段文字。\n\n这段话历来众说纷纭，旁边已经有人凑过来听。讲得好，这位后生会记一辈子；讲得不好，丢脸的也不只你一人。"
 WJ_qingyi.1010.a:0 "逐字讲疏。"
 WJ_qingyi.1010.a.success:0 "条分缕析，后生拜服"
 WJ_qingyi.1010.a.failure:0 "引证有误，被人指出"
 WJ_qingyi.1010.b:0 "反问启之，使其自悟。"
 WJ_qingyi.1010.c:0 "请座上名士代为解之。"
 WJ_qingyi_log_1010_a_success:0 "[CHARACTER.Custom('WJ_GetUIName')]为[TARGET_CHARACTER.Custom('WJ_GetUIName')]讲疏经义，后者大受启发"
 WJ_qingyi_log_1010_a_success_title:0 "$WJ_qingyi.1010.t$"
 WJ_qingyi_log_1010_a_failure:0 "[CHARACTER.Custom('WJ_GetUIName')]讲经时引证有误，当场被人指出"
 WJ_qingyi_log_1010_a_failure_title:0 "$WJ_qingyi.1010.t$"
 WJ_qingyi_log_1010_b:0 "[CHARACTER.Custom('WJ_GetUIName')]以反问启发[TARGET_CHARACTER.Custom('WJ_GetUIName')]自悟经义"
 WJ_qingyi_log_1010_b_title:0 "$WJ_qingyi.1010.t$"
 WJ_qingyi_log_1010_c:0 "[CHARACTER.Custom('WJ_GetUIName')]请[TARGET_CHARACTER.Custom('WJ_GetUIName')]代为解经，名士之名更盛"
 WJ_qingyi_log_1010_c_title:0 "$WJ_qingyi.1010.t$"

 WJ_qingyi.1011.t:0 "清浊之辨"
 WJ_qingyi.1011.desc:0 "[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]拍案而起，说当今朝中清浊混杂，宦官子弟占据州郡，清流反被排斥在外，在座诸君怎能还只谈玄理。\n\n几位宾客跟着附和，也有人皱起了眉头。清浊之分是士林大义，但把天下人一概分成两类，未必公允。"
 WJ_qingyi.1011.a:0 "激浊扬清，正当其时。"
 WJ_qingyi.1011.b:0 "清浊各有其人，不可以门户定人。"
 WJ_qingyi.1011.b.success:0 "持论公允，众人称善"
 WJ_qingyi.1011.b.failure:0 "被斥为乡愿"
 WJ_qingyi.1011.c:0 "付之一笑。"
 WJ_qingyi_log_1011_a:0 "[CHARACTER.Custom('WJ_GetUIName')]倡言激浊扬清，在座清流深以为然"
 WJ_qingyi_log_1011_a_title:0 "$WJ_qingyi.1011.t$"
 WJ_qingyi_log_1011_b_success:0 "[CHARACTER.Custom('WJ_GetUIName')]论清浊持平，连[TARGET_CHARACTER.Custom('WJ_GetUIName')]也无以反驳"
 WJ_qingyi_log_1011_b_success_title:0 "$WJ_qingyi.1011.t$"
