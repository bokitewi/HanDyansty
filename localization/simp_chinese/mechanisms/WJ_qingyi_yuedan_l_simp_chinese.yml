 # 新增通用事件 2009–2012（宾客）
 WJ_qingyi.2009.t:0 "求见名士"
 WJ_qingyi.2009.desc:0 "席间学问最深的是[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]。散席之后，此人身边总围着一圈人，有人请教，有人只想留个印象。\n\n你也想上前，却还没想好以什么姿态。"
 WJ_qingyi.2009.a:0 "执弟子礼请教。"
 WJ_qingyi.2009.a.success:0 "得其指点，豁然开朗"
 WJ_qingyi.2009.a.failure:0 "所问浅陋，只得了几句客套"
 WJ_qingyi.2009.b:0 "以己见相质。"
 WJ_qingyi.2009.b.success:0 "往复数番，对方另眼相看"
