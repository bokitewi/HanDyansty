 WJ_qingyi.1012.t:0 "雅歌投壶"
 WJ_qingyi.1012.desc:0 "连日议论之后，众人都有些倦了。[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]提议摆出投壶，又有人取来了琴。\n\n清议本不必时时剑拔弩张，你这个主人怎样参与，宾客们都看在眼里。"
