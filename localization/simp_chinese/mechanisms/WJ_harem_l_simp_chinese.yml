 HouGong_ShiHao.012_t: "册谥"
 HouGong_ShiHao.012_d:0 "候选的字暂且搁下，谥字由你亲拟。礼官将笔放好，退开半步，先前不绝的解释声也随之停了。\n\n你望着案前的空白，忽然想起往日有人唤她时的声音。身后之谥，只取一字；往后旁人再提起她，便会添上你今日写下的这一个字。可无论怎样写，她都不会再应一声了。"
 HouGong_ShiHao.012.a: "谥字已定，主者施行。"
 WJ_harem_selection_origin_desc:0 "名册尚未发出，侍者先来请示出身：是取良家女子，还是先从名门之中择选？他话音才落，你便瞥见他袖边早已备好了笔。\n\n这道吩咐一出，便有人欢喜，有人揣测。你望着尚空的名册，想到日后宫中每一个姓氏背后，都可能多出几个登门问讯的人。名门之女若是不足，仍须以良家补齐；至于去留与位号，还在以后。\n\n侍者不再多言，只等你开口。"
 WJ_harem_selection_commoner: "择良家之女。"
 WJ_harem_selection_noble: "择名门之女。"
 DongGongTaiHou_court_position: "嫡母皇太后"
 DongGongTaiHou_court_position_desc: "奉先帝正后为嫡母皇太后，尊养于宫中。"
 XiGongTaiHou_court_position: "生母皇太后"
 XiGongTaiHou_court_position_desc: "奉皇帝生母为皇太后，尊养于宫中。"
 TaiHuangTaiHou_court_position: "太皇太后"
 TaiHuangTaiHou_court_position_desc: "奉皇帝祖辈的皇太后为太皇太后。"
