 HouGong_ShiHao.001_t: "大行[HuangHou.Custom('WJ_HaremRank')]崩逝"
 HouGong_ShiHao.001_d_start: "#V #bold “天不憗遗，大行[HuangHou.Custom('WJ_HaremRank')]崩逝！”#!\n\n"
 HouGong_ShiHao.001_d1: "皇后淑慎柔嘉，夙娴内则，作配朕躬。奄忽长逝，震悼良深。\n\n惟皇后仁孝出于天性，恭俭本于自然。上承宗庙之重，下睦宫闱之欢。鸡鸣儆戒，不忘夙夜之心；鱼贯进御，不私宠爱之渥。阴教聿宣，六宫承式；母仪昭著，四海归仁。\n\n今者遽捐馆舍，永隔幽明。朕念偕老之愿莫遂，悼贤佐之云亡，中心惨怛，不能自已。爰命有司，祗奉彝典，务从优厚，称朕意焉。"
 HouGong_ShiHao.001_d2: "圣母上仙之讣传于四海，朕哀慕摧绝，五内分崩，擗踊哭泣，不知所为。\n\n伏念圣母慈仁懋著，淑慎其身，辅佐先朝，母仪天下。昔在先帝，夙夜忧勤，赞襄万机；逮朕纂承，慈训谆切，保乂邦家。数十年间，宫闱之内，雍雍肃肃；四海之广，咸被其泽。\n\n方期颐养遐年，永承慈荫，岂意一旦弃养，中外衔哀。殿宇阒寂，銮辂将迁；缙绅缟素，兆民雨泣。朕茕茕在疚，荼毒何堪！仰瞻慈颜，邈不可得；抚膺号恸，痛何可言！\n\n呜呼哀哉！山河改色，日月无光。谨遣有司，具陈丧礼，务从优厚，以申朕罔极之情。"
 HouGong_ShiHao.001_d3: "伏以圣祖母太皇太后，淑慎柔嘉，含弘光大。备位坤仪，三朝母范；承天永命，四海慈尊。\n\n昔我祖考，嗣守鸿图，赖其内助之功，以成雍熙之治；逮我先帝，嗣膺宝历，资其保祐之德，以底绥靖之功；暨朕纂承，复蒙慈训，教诲谆切，罔有不至。\n\n方期颐养于深宫，永享康宁之福；岂意奄忽于大故，遽兴遐弃之悲。朕茕茕在疚，痛何可言！\n\n国有彝典，不可废也。其令有司，具上尊谥，务从优厚，以称朕尊崇之意。"
 HouGong_ShiHao.001.a: "呜呼哀哉！"
 HouGong_ShiHao.011_t: "拟谥号"
 HouGong_ShiHao.011_d_start: "#V #bold “天不憗遗，大行[HuangHou.Custom('WJ_HaremRank')]崩逝，懿范长存，朕眷怀淑德，痛悼曷胜。”#!\n\n"
 HouGong_ShiHao.011_d1: "伏惟皇后，坤元合德，巽体含章。毓秀名门，作配朕躬。鸡鸣有儆戒之诗，鹊巢著均一之化。佐理宫闱，夙夜匪懈；母仪四海，慈惠旁流。\n今者遽捐馆舍，永隔幽明。朕览遗衣而增欷，顾虚殿以伤心。\n稽诸彝典，国有常仪。皇后之丧，必上尊谥。爰命有司，博考往册，择淑慎温恭之字，表柔嘉维则之德。庶几徽音不沫，与金石而长存；懿范常新，共河山而永固。\n#weak 谥曰：孝【谥号】皇后"
 HouGong_ShiHao.011_d2: "呜呼！朕自少小，受太后慈训，数十年如一日。太后仁孝出于天性，恭俭本于自然。事先帝尽妇道，辅朕躬尽母道。\n\n国有旧典，不可废也。其令儒臣，恭上尊谥，以彰太后之盛德于不朽。\n#weak 谥曰：孝【谥号】皇后"
 HouGong_ShiHao.011_d3: "大行太皇太后，淑慎柔嘉，含弘光大。作配圣祖，肇基王业；拥佑先帝，克济艰难；保翼眇躬，底于绥靖。三朝母范，四海慈尊。盛德大业，振古莫伦。\n今者奄忽大故，遐弃万邦。朕茕茕在疚，痛何可言！\n其令太常卿、翰林学士，稽诸典礼，考诸谥法，务极尊崇之典，以称朕追慕不忘之意。\n#weak 谥曰：孝【谥号】皇后"
