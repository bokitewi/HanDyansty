l_simp_chinese:
 WJ_harem_guiren:0 "贵人"
 WJ_harem_guiren_desc:0 "该角色位列贵人，金印紫绶，于后宫之中仅次于皇后。"
 WJ_harem_meiren:0 "美人"
 WJ_harem_gongren:0 "宫人"
 WJ_harem_cainv:0 "采女"
 WJ_harem_unranked_desc:0 "该角色名列掖庭宫籍，尚无爵秩，岁时唯受赏赐而已。"
 SanGong_CeliHuanghou_interaction:0 "册立皇后"
 WJ_harem_crown_desc:0 "册立此人为皇后，正位中宫。"
 SanGong_divorce_character_interaction:0 "废黜皇后"
 WJ_harem_depose_desc:0 "废黜皇后，与之离绝。"
 WJ_harem_rank_interaction:0 "钦定位份"
 WJ_harem_rank_title:0 "钦定内宫位号"
 WJ_harem_rank_desc:0 "[recipient.GetFirstNameNoTooltip]的名字写在掖庭名册上，旁边的位号还空着。侍者念过几个称谓便停住了，仿佛多说一个字，也会被人当作你的意思。\n\n你又看了一眼那个名字。贵人、美人、宫人、采女，字数相差无几，往后宫中人说出口时，分量却各不相同。今日若是定下，消息只怕比正式的文书传得还快。\n\n笔已备好，门外候着回话的人，也已等了许久。"
 WJ_harem.003.a:0 "册为贵人。"
 WJ_harem.003.b:0 "封为美人。"
 WJ_harem.003.c:0 "录为宫人。"
 WJ_harem.003.d:0 "列为采女。"
 WJ_harem_rank_notice:0 "内宫位号已定"
 WJ_harem_rank_notice_desc:0 "宫中自此改称[recipient.Custom('WJ_GetUIName')]。"
 QianSan_chuGong_interaction:0 "遣散出宫"
 WJ_harem_crown_title:0 "册立皇后诏"
 WJ_harem_crown_notice:0 "册文宣毕，[huanghou.Custom('WJ_GetUIName')]正位中宫。侍者念起新定的称谓，比平日慢了几分，连近旁的人也侧耳听着，免得往后叫错。\n\n你将册文读过一遍，放回案边。一个位号落定，宫中许多细事便随之换了轻重：先向谁禀报，在何处候见，谁的一句话值得反复揣摩——往后都会有人议论。\n\n礼已办妥，册文可以入藏了。至于宫门之内那些尚未说出口的话，怕是今日才刚刚开始。"
 WJ_harem_depose_title:0 "废后诏"
 WJ_harem_depose_notice:0 "废黜[huanghou.GetFirstNameNoTooltip]的诏书已经颁下。侍者将新改的名册送来，读到原先的位号时顿了一顿，才换成改定后的称呼。\n\n你看着那一处涂改，才觉得这道诏书已经传进了宫里。往后的请见、禀报与礼数，都须跟着改过；有人会暗暗松一口气，也有人未必肯把怨言一直压在心底。\n\n处分已定，宫务却还得照常。门外的人仍在等候新的吩咐。"
 WJ_harem_ack:0 "主者施行"
 SanGong_ShiQin:0 "召幸后宫"
 WJ_harem_intimacy_title:0 "内宫起居"
 WJ_harem_intimacy_desc:0 "你与[ShiQie.Custom('WJ_GetUIName')]相对坐下，门外催促回话的声音终于远了。灯芯轻轻一响，你才发觉白日里那句没说完的话，竟还攥在心里。\n\n你放松肩背，望向身旁之人。宫中盼着皇嗣的眼睛向来不少；今夜是顺其自然，还是暂且不作此想，只在你一念之间。\n\n灯影在帷边摇动。你伸手拨正案上的小盏，迟迟没有唤人进来。"
 WJ_harem_allow_birth:0 "顺其自然，以续宗祧。"
 WJ_harem_prevent_birth:0 "但求相伴，暂不求嗣。"
 SanGong_XuanXiu_decisions:0 "采选入宫"
 WJ_harem_selection_decision_desc:0 "后宫久虚，皇嗣之托系于掖庭。依汉家故事，当遣中大夫与掖庭丞及相工，阅视民间女子，择其姿色端丽、合于法相者，载还后宫。"
 WJ_harem_selection_confirm:0 "命有司采选"
 WJ_harem_selection_title:0 "采选名册已至"
 WJ_harem_selection_desc:0 "侍者唱名唱到最后一个，才终于停下。你原以为一一听过便能记住，等他问有何吩咐，脑中却已有好几个名字混在了一处。\n\n新选的采女都已入宫，籍贯来历也各自列明。你让他把名册留下，日后再看，不必急着当场定下去留与位号——宫中传话最快，随口一句称许，也会被人反复揣测。\n\n侍者退下，你又翻回第一页。方才唱名时每人那一瞬的停顿，如今都只剩下几行字了。"
 SanGong_FaSongXiuNV_decisions:0 "遣还未选宫人"
 WJ_harem_release_desc:0 "掖庭采女入宫已久，未蒙召幸者，年华空老于深宫。不如放还其家，听其婚嫁。"
 WJ_harem_release_confirm:0 "准予遣还"

 HouGong_ShiHao.001_t: "大行[HuangHou.Custom('WJ_HaremRank')]崩逝"
 HouGong_ShiHao.001_d_start:0 "[HuangHou.Custom('WJ_HaremRank')]崩逝的讣告传入宫中，往日熟悉的往来声，忽然都静了下来。\n\n"
 HouGong_ShiHao.001_d1:0 "你听完有司陈说丧仪，又问了一遍尚待办理的事。皇后之位牵着宫中礼序，也牵着许多早已习以为常的日常；如今人不在了，从前不必过问的细事，竟都须重新有人回答。\n\n哀痛不能让政务全停，却也不该只剩一份照例开销的簿册。你命有司依礼料理，丧葬所需与身后议谥一并办理。能为逝者做的事已经不多，你不愿在这最后几件上草草了事。"
 HouGong_ShiHao.001_d2:0 "有司陈说丧仪时，你几次望向话音传来的方向，仿佛太后还会像往常一样，遣人送来一句她的意思。等了片刻，你才想起，如今所有的安排，都不会再有她的答复了。\n\n宫中尊位须依礼载入典册，身后之谥也要郑重议定。但眼下最先要办的，是那些不能因为悲痛便无人料理的丧事。\n\n你让人记下所需用度，依次办理。朝廷自有朝廷的礼序，一位长者留下的空处，却不会就此填满。"
 HouGong_ShiHao.001_d3:0 "太皇太后的丧报送入宫中，许多侍奉已久的人一时不知该先做哪件事。她在这宫里度过的年月比你更长，有些旧例的来历，也只有她身边的老人还记得。\n\n你命有司依礼陈明安排，先把该办的事定下来，不让哀伤变成各处彼此观望。身后之谥尚须另议，眼前的丧仪与用度却已耽搁不得。\n\n文书读完，殿中又静了下来。尊位可以写进典册，一位长久在场的人不再回来，却要过许久才能习惯。"
 HouGong_ShiHao.001.a:0 "依礼治丧，备资百金，再议尊谥。"
 HouGong_ShiHao.011_t: "拟谥号"
 HouGong_ShiHao.011_d_start:0 "丧仪已有安排，有司接着呈上谥议，等你为逝者择定身后的称呼。\n\n"
 HouGong_ShiHao.011_d1:0 "皇后的称谓往日常在耳边，如今礼官问起，问的却是该添上哪一个身后之字。你接过候选的谥字看了片刻，又翻回前面记述生平的那一页。\n\n有些字太重，有些字又似乎不能尽意。堂下已说过许多理由，你却想起几件不曾写进礼文的小事，一时没有答话。\n\n礼官的笔仍候着。往后旁人会照着这个字称呼她，她自己却再也听不见了。"
 HouGong_ShiHao.011_d2:0 "太后的尊位已经载明，礼官接着问身后之谥。你逐一看过候选，几个熟悉的字到了嘴边，又没有立刻说出口。\n\n往日若有难决之事，还能听一听她的意思；今日这些字都与她相关，殿中却再无人能替她作答。礼官以为你没有听清，正要重读，你抬手让他稍候。\n\n你将文书放平，想把那个终将留下来的称呼，再认真想一遍。"
 HouGong_ShiHao.011_d3:0 "太皇太后的谥议送到案前，有司不再问仪物多寡，只问往后如何称呼她。平日早已叫惯的尊号，忽然也有了须由你定下的部分。\n\n你望着候选的字，想起宫中老人说起她时的神情。有些旧事连你也不曾亲历，只能听他们慢慢讲来；听过之后，眼前这几个字反倒更不敢轻易取用。\n\n礼官候着，名目也已列齐。总要为这一场身后礼议，定下一个能够传下去的称呼。"
