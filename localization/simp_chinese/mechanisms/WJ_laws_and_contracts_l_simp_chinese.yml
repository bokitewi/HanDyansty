l_simp_chinese:
# 汉晋风华：按类型整合；键名与现行文本保留。来源逐键见本批manifest。

 # 来源：localization/simp_chinese/WJ_contract_privileges_l_simp_chinese.yml
 WJ_chijie:0 "持节"
 WJ_chijie_desc:0 "#emphasis 特权：#!\n$EFFECT_LIST_BULLET$平时与战时，皆可节制本区公爵级及以下官员\n$EFFECT_LIST_BULLET$可征召区内援军，奉令者须如期出兵\n$EFFECT_LIST_BULLET$可将犯军法者交廷尉羁押\n$EFFECT_LIST_BULLET$可调拨本区头衔兵，改编私兵$WJ_mt_jie_transfer_rules$\n\n#flavor 持节者，平时与战时皆得节制诸将，权在假节之上。#!"
 WJ_chijie_short:0 "持节"
 WJ_huangyue_grant:0 "授予假黄钺"
 WJ_huangyue_grant_desc:0 "#emphasis 特权：#!\n$EFFECT_LIST_BULLET$平时可对全朝王国级及以下文武官员行军法\n$EFFECT_LIST_BULLET$战时可及于本朝一切封臣与朝臣，唯天子与摄政本人不在此列\n$EFFECT_LIST_BULLET$可径行定罪、羁押，乃至不经下狱而斩之祭旗\n$EFFECT_LIST_BULLET$与都督中外诸军事同授同罢；一旦失去摄政之位，即行收回\n\n#flavor 黄钺本是天子之钺。假之于臣，便是许其代天子行军法、专诛罚。#!"
 WJ_huangyue_grant_short:0 "假黄钺"
 WJ_huangyue_none:0 "未假黄钺"
 WJ_huangyue_none_desc:0 "#flavor 未假黄钺。此权须奉诏总督中外诸军事时一并授予，不能另行改约开启。#!"
 WJ_huangyue_none_short:0 "未授予"
 WJ_jiajie:0 "假节"
 WJ_jiajie_desc:0 "#emphasis 特权：#!\n$EFFECT_LIST_BULLET$战时可节制本区公爵级及以下官员\n$EFFECT_LIST_BULLET$可征召区内援军\n$EFFECT_LIST_BULLET$可将犯军法者交廷尉羁押\n$EFFECT_LIST_BULLET$可调拨本区头衔兵，改编私兵$WJ_mt_jie_transfer_rules$\n\n#flavor 假节者，唯在军中、唯值战时，方得节制诸将。#!"
 WJ_jiajie_short:0 "假节"
 WJ_kaifu_grant:0 "授予开府"
 WJ_kaifu_grant_desc:0 "#emphasis 特权：#!\n$EFFECT_LIST_BULLET$可开府置僚属，辟召士人入幕\n$EFFECT_LIST_BULLET$日后纵然卸去公府之职，只要仍有资格，此项特授依旧保留\n\n#flavor 开府者，得自置长史、掾属，俨然朝中又一小朝。#!"
 WJ_kaifu_grant_short:0 "开府"
 WJ_kaifu_none:0 "未另授开府"
 WJ_kaifu_none_desc:0 "#flavor 未蒙特授开府。若身居三公、大将军等六职，仍可依职开府。#!"
 WJ_kaifu_none_short:0 "未另授"
 WJ_kaifu_office:0 "在任开府"
 WJ_kaifu_office_grant:0 "六职在任开府"
 WJ_kaifu_office_grant_desc:0 "#flavor 大将军、太傅、丞相、司徒、司空、太尉，在任即得开府，去职则罢。#!"
 WJ_kaifu_office_grant_short:0 "在任开府"
 WJ_kaifu_office_none:0 "无在任开府"
 WJ_kaifu_office_none_desc:0 "#flavor 不居六职，无依职开府之权。#!"
 WJ_kaifu_office_none_short:0 "无在任开府"
 WJ_mt_jie_transfer_rules:0 "\n$EFFECT_LIST_BULLET$调兵只限本区；受调者抗命不奉，以军法论罪"
 WJ_privilege_kaifu_locked_tt:0 "身居六职者依职开府，不可更改；另行特授的开府照旧保留"
 WJ_privilege_kaifu_rank_tt:0 "须为本朝现任朝臣，或身任王国级以上的地方长官"
 WJ_privilege_sanjie_eligible_tt:0 "须为现任都督；旄节须在设立都督区时初授"
 WJ_privilege_six_offices_tt:0 "仅大将军、太傅、丞相、司徒、司空、太尉在任可授假黄钺"
 WJ_sanjie_none_desc:0 "#flavor 未任都督，不得专节制之权。旄节须在设立都督区时初授，此后方可改授。#!"
 WJ_shichijie:0 "使持节"
 WJ_shichijie_desc:0 "#emphasis 特权：#!\n$EFFECT_LIST_BULLET$平时与战时，皆可调度本区王国级及以下官员\n$EFFECT_LIST_BULLET$可调拨本区头衔兵，改编私兵$WJ_mt_jie_transfer_rules$\n$EFFECT_LIST_BULLET$战时可径行定罪，但会招致[tyranny|E]与[dread|E]\n$EFFECT_LIST_BULLET$有罪者可交廷尉，可自行囚禁，亦可立斩祭旗以振军威\n$EFFECT_LIST_BULLET$所定军法之罪，战后不会自行消除\n\n#flavor 使持节者，节钺在手，军中有犯令者，可先斩后奏。#!"
 WJ_shichijie_short:0 "使持节"

 # 来源：localization/simp_chinese/WJ_province_boundary_l_simp_chinese.yml
 WJ_province_type_closed_hanjin_tt:0 "汉制无监、都会与都护之设，只有郡县、军戍与司隶。"

 # 来源：localization/simp_chinese/WJ1_laws_l_simp_chinese.yml

 WJ_zhoumu:0 "[wj_zhoumu|E]"
 WJ_zhoumu_none:0 "仍任刺史"
 WJ_zhoumu_none_short:0 "刺史"
 WJ_zhoumu_none_desc:0 "循军戍旧任，仍以刺史治州，不享州牧之增俸与兵额。"
 WJ_zhoumu_grant:0 "擢任州牧"
 WJ_zhoumu_grant_short:0 "州牧"
 WJ_zhoumu_grant_desc:0 "#emphasis 特权：#!\n$EFFECT_LIST_BULLET$增其俸给与头衔兵额\n$EFFECT_LIST_BULLET$天子对其权势心存戒惧\n$EFFECT_LIST_BULLET$不兼都督之权，也不附带节钺、开府或军职\n$EFFECT_LIST_BULLET$若由本人自请，须动用对天子的[hook|E]；天子亲授则不必\n\n#flavor 由刺史而为州牧，俸禄更厚，兵额更多，天子看在眼里，难免心生忌惮。#!"
 WJ_zhoumu_eligible_tt:0 "须为汉晋天朝王国级地方军戍官员，非朝臣、非士族家主，且不持有皇帝首都所属的法理王国"
 WJ_zhoumu_batch_tt:0 "擢任须由本朝皇帝处理，申请者须符合州牧资格；同次修改不可转为非军戍契约"
 WJ_zhoumu_hook_tt:0 "自请为州牧，须动用你对天子的[hook|E]"
 WJ_zhoumu_imperial_distrust:0 "州牧权重"
