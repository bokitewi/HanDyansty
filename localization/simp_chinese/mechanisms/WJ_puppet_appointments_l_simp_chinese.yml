 WJ_appointment_nominee_realm_tt:0 "被推荐者与推荐人同属一位最高领主，或是没有领主／宫廷雇主的独立无地者"
 WJ_recommendation_dasima_not_incumbent_tt:0 "此人尚未担任这位天子的大司马"

 WJ_recommend_council_interaction:0 "荐任内阁"
 WJ_recommend_court_interaction:0 "荐任宫廷职位"
 WJ_recommend_dasima_interaction:0 "荐为大司马"
 WJ_recommend_council_desc:0 "向本朝天子推荐此人。先选定人选，再选择内阁职位；不合任职条件的岗位不可选。天子可以批准或拒绝，任职资格、替换限制与原有费用不变。丞相不在荐任范围，仍须经正式授相流程。"
 WJ_recommend_court_desc:0 "向本朝天子推荐此人担任宫廷职位，包括其朝廷实际开放的侍中等岗位。是否可任仍按天子的宫廷、岗位资格、名额和费用判断；不转移有地者的土地或臣属关系。"
 WJ_recommend_dasima_desc:0 "向本朝天子推荐此人为大司马。人选仍须达到王国级、为天子直属臣，并符合原有任职资格；天子可以拒绝，批准后才按既有规则换任。"
 WJ_recommend_council_proposal:0 "[actor.GetShortUIName]举荐[recipient.GetShortUIName]担任你的[target.GetPositionName]。是否准许这项任命？"
 WJ_recommend_court_proposal:0 "[actor.GetShortUIName]举荐[recipient.GetShortUIName]担任你的[target.GetName]。是否准许这项任命？"
 WJ_recommend_dasima_proposal:0 "[actor.GetShortUIName]举荐[recipient.GetShortUIName]担任大司马。是否准许这项任命？"
 WJ_recommendation_no_chancellor_tt:0 "丞相须由正式授相流程启用，不能通过任职推荐取得"
 WJ_recommendation_trust_reason:0 "天子对举荐者的信任"
 WJ_recommendation_nominee_reason:0 "天子对被荐者的看法"
 WJ_recommendation_appointed_title:0 "荐任获准"
