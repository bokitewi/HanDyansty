 SanGong_DianZhang.015.b:0 "臣等顿首奉诏"
 SanGong_DianZhang.015.desc:0 "#v #bold 门下：\n自古帝王建储贰、重东宫，所以系四海之心，绵万世之统。稽之彝章，典故昭然。\n\n朕嫡子[taizi.GetName]，资禀岐嶷，性履温恭。仁孝发于自然，器度凝于夙成。亲侍帷幄，恪谨无违；诵习经训，德业日新。询于廷臣，众论佥同，堪膺储副之寄。\n\n今循祖宗成宪，册[taizi.GetName]为皇太子，正位东宫。俾朝夕讲学，历练庶务，敬承宗庙，永固邦基。\n\n遣使持节，奉册宝，告于天地、宗庙、社稷。中外臣庶，当协心翊赞，共扶元良。\n播告遐迩，咸使知悉。"
 SanGong_DianZhang.015.t:0 "册立太子诏"
 SanGong_DianZhang.018.a:0 "钦此！"
 SanGong_DianZhang.018.desc:0 "#v 诏曰：\n\n朕承天受命，临御万方，夙兴夜寐，惟念宗社之安，黎元之福。国本之重，系于东宫；储君之贤，关乎万世。昔者册立[taizi.GetName]为皇太子，冀其承宗庙之统，抚四海之民，勤修德业，历练政事。朕倾心力教诲，赐良师辅弼，期其成栋梁之器，固国本之基。\n\n奈何[taizi.GetName]自居储位以来，日渐骄纵，不修德操；亲奸佞，远贤臣，沉迷逸乐，荒废学业。行事乖张，罔顾礼法；仁孝尽失，骨肉疏离。既无经邦济世之才，亦无监国抚军之能，反怀私念，结党营私，紊乱朝纲，动摇国本。朕屡加训诫，冀其悔悟，然其执迷不悟，怙恶不悛，若仍居东宫之位，必贻祸宗社，殃及兆民，负天地之托，违臣民之望。\n\n朕痛心疾首，反复权衡，为宗庙计，为万民计，不得不废其储位，以正纲纪。今诏告天下，废[taizi.GetName]皇太子之位，贬为庶人，闭门思过。\n\n布告天下，咸使闻知。钦此。#!"
 SanGong_DianZhang.018.t:0 "废太子诏"
