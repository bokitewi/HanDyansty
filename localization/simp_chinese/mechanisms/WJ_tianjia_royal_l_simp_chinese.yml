 SanGong_DianZhang.015.a:0 "主者施行"
 SanGong_DianZhang.015.b:0 "臣等顿首奉诏"
 SanGong_DianZhang.015.desc:0 "册立储嗣的文书呈来，宣读到[taizi.GetName]时，堂中几个人不约而同地抬起头。我也将目光停在那里，前面的礼辞仿佛忽然都有了去处。\n\n往后东宫的名分将系在这个名字上。今日听诏的人，明日便会把它带到更多地方，有人想起宗庙承继，有人想的或许更近。\n\n我将册文再看一遍。诵读的声音仍平稳，周围的神色却已不全像方才。一个名字被放到储位之前，许多尚未发生的事，便已有人开始等着了。"
 SanGong_DianZhang.015.t:0 "册立太子诏"
 SanGong_DianZhang.018.a:0 "钦此！"
 SanGong_DianZhang.018.desc:0 "废黜储嗣的诏命已经颁下，[taizi.GetName]不再以太子身份居于东宫。传诏者读完，堂中一时无人说话，反倒显得那几个字仍悬在半空。\n\n我看着呈来的文书，又望了一眼周围。有人垂下目光，有人似乎想说什么，最终都没有开口。先前因储位而起的亲近与疏远，往后怕都要换一副样子。\n\n文书仍须继续传出，旧称已不能沿用。消息一离开这里，会引起多少议论，便不再只是案前这片短暂的安静了。"
