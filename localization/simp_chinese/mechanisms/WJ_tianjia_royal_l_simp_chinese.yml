 mem_add_taizi_desc:0 "门下：国之大本，首在建储。咨尔[owner.GetFirstName]，秉性仁孝，器识端凝，素有令誉。循稽旧制，特册为储君，入居储闱，代监国本。勉修德行，谨守臣仪，以承宗庙之重。主者施行"
