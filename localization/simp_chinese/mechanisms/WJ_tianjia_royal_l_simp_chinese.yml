 mem_add_taizi:0 "册立储君"
 mem_add_taizi_desc:0 "[owner.GetFirstName]受册为储君，入居东宫。册文有云：“国之大本，首在建储。尔秉性仁孝，器识端凝，其勉修德行，谨守臣仪，以承宗庙之重。”"
