 SanGong_DianZhang.015.a:0 "主者施行"
 SanGong_DianZhang.015.b:0 "臣等顿首奉诏"
 SanGong_DianZhang.015.desc:0 "册立储嗣的诏文读到[taizi.GetName]的名字时，在场几个人不约而同地抬起头来。前面那些冗长的礼辞，仿佛到这里才有了着落。\n\n自此以后，东宫的名分便要系在这个名字上。今日听到它的人，明日就会把它带往更多地方：有人想到宗庙承继，有人想的或许更近一些。\n\n诵读的声音依旧平稳，四下的神色却已不全似方才。你明白，一个名字被放到储位之前，许多尚未发生的事，便已有人开始等着了。"
 SanGong_DianZhang.015.t:0 "册立太子诏"
 SanGong_DianZhang.018.a:0 "诏书既下，东宫遂虚。"
 SanGong_DianZhang.018.desc:0 "废黜储嗣的诏命已经颁下，[taizi.GetName]从此不再以太子之身居于东宫。传诏者读罢，四下一时无人作声，那几个字仿佛仍悬在半空。\n\n你望了一眼周围。有人垂下目光，有人似欲开口，终究都没有说话。先前因储位而起的亲近与疏远，往后怕都要换一副样子。\n\n诏书还要接着传下去，旧日的称呼却不能再用了。消息一出宫门会惹起多少议论，便不是眼前这片短暂的寂静所能遮住的了。"
 SanGong_DianZhang.018.t:0 "废太子诏"
