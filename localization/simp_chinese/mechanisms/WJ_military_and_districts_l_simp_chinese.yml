 # 来源：localization/simp_chinese/WJ_conquest_l_simp_chinese.yml
 WJ_conquest_accepted_desc:0 "征讨之命已经奉行：我已向[secondary_recipient.Custom('WJ_GetLinkedUIName')]治下的[target.GetName]宣战，谨先报知。\n\n军令既出，粮秣与诸部进退都须随敌情调度。使者启程之时，军中事务正繁，这封出师之报，还不能写成捷报；此后得失，自当陆续奏闻。\n\n所得之地，依征讨之制归于朝廷。领兵之责既已担下，我不敢再以未奉明令为辞。"
 WJ_conquest_acknowledge:0 "知悉。"
 WJ_conquest_commission_accept_tt:0 "此战若胜，[target.GetNameNoTier]将归于朝廷。"
 WJ_conquest_commission_decline_tt:0 "抗命不出，难免为朝中所议。"
 WJ_conquest_commission_proposal:0 "命你率部征讨[target.GetNameNoTier]，所得之地，归于朝廷。"
 WJ_conquest_declined_desc:0 "征讨之命已收。再三思量，此番仍不能领受，谨先奉书明告。\n\n我知道军前不宜久候，本想把辞谢写得婉转些；可话说得再多，终究没有兵马随这封信一道出发。与其让朝廷误以为我尚在筹措，不如将不能出战的话说在前头。\n\n此番征讨，请另作安排，勿再候我应命。愿使者速速奉达，免得原定的部署因我再受耽搁。"
 WJ_conquest_invalid_desc:0 "原拟发往军前的文书又回到了你的案上。属官指着其中几处名目解释：往返之间，节制与目标都已生变，这道征讨之命，如今办不下去了。\n\n你让他再说一遍，听罢才将文书放下。先前的声势早已张扬出去，兵却没有因此出动；若还照旧令催促，下面多半只会把同一封退回的文书再递上来。\n\n你在原议旁批了“作罢”二字，目光仍停在那个未能达成的目标上。为此耗去的威望已收不回来，此事一时也不便重提，只能另作打算。"
 WJ_conquest_invalid_title:0 "征讨作罢"
 WJ_conquest_no_target_tt:0 "受命都督的辖境须与境外某一公国接壤"
 WJ_conquest_reply_opening:0 "[recipient.Custom2('AppropriateGreetingPositive', ROOT.Char)]"

