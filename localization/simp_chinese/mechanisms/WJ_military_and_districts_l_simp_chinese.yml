 # 来源：localization/simp_chinese/WJ_district_orders_l_simp_chinese.yml
 WJ_dd_action_execute:0 "斩立决，祭旗"
 WJ_dd_action_execute_tt:0 "须为战时的使持节都督，对象为本区犯有军法之罪的官员；假黄钺者平时可及全朝官员，战时更及本朝诸封臣与朝臣。天子与摄政不在此列"
 WJ_dd_action_force:0 "宣布违犯军法"
 WJ_dd_action_force_tt:0 "须为战时的使持节都督，对象为本区官员；假黄钺者平时可及全朝文武，战时更及本朝诸封臣与朝臣。天子与摄政不在此列；对象须未被囚禁，且尚无军法罪名"
 WJ_dd_action_justice:0 "移交廷尉羁押"
 WJ_dd_action_justice_tt:0 "对象须犯有本朝军法之罪、在你的旄节或黄钺所及之内，且未被囚禁；本朝廷尉须能视事。假节者唯战时可行"
 WJ_dd_action_self:0 "由本府羁押"
 WJ_dd_action_self_tt:0 "须为战时的使持节都督，或持有黄钺；对象须在所及之内，犯有本朝军法之罪且未被囚禁"
 WJ_dd_cancel:0 "取消／军令已失效"
 WJ_dd_jie_acceptance_reason:0 "都督旄节之威"
 WJ_dd_order_invalid_desc:0 "军令发出之际，官职、辖区、旄节或战局已经生变，此令未能施行。与天子为敌之时，也不能再借朝廷之名处置忠于天子的官员。"
