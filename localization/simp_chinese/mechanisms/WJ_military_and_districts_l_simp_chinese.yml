 # 来源：localization/simp_chinese/WJ_district_expansion_l_simp_chinese.yml
 WJ_dd_custom_name_1:0 "[ROOT.Title.GetHolder.GetLocalizedText('wj_dd_custom_name_1')]"
 WJ_dd_custom_name_2:0 "[ROOT.Title.GetHolder.GetLocalizedText('wj_dd_custom_name_2')]"
 WJ_dd_petition_acceptance_tt:0 "天子对你的信重与你的武勋资望，须足以当所请之节：假节最易，持节次之，使持节最难，扩区之请与持节相当。忠诚之人、与天子同宗者更易见许，不忠之人则难"
 WJ_dd_petition_approve:0 "制曰：可。其依所请。"
 WJ_dd_petition_approved_opinion:0 "表奏获准"
 WJ_dd_petition_create_letter:0 "臣所领一方军务，往往牵连邻境诸军。将士虽各有统属，道路与守备却难截然分开，每遇事急，再遣人往返请示，常使援应迟滞。\n\n谨请以臣所领军府为核心，置都督，督州郡诸军事，并授旄节，使臣得以统筹军务。\n\n若蒙允准，臣当谨守所授之权，不敢将临军之任视为家业。可否施行，伏候裁定。"
 WJ_dd_petition_create_letter_1:0 "$WJ_dd_petition_create_letter$\n\n臣斗胆，请授假节。"
 WJ_dd_petition_create_letter_2:0 "$WJ_dd_petition_create_letter$\n\n臣斗胆，请授持节。"
 WJ_dd_petition_create_letter_3:0 "$WJ_dd_petition_create_letter$\n\n臣斗胆，请授使持节。"
 WJ_dd_petition_decline:0 "此议未允，仍守旧制。"
 WJ_dd_petition_declined_opinion:0 "表奏被却"
 WJ_dd_petition_expand_letter:0 "臣所领都督区与[scope:wj_dd_petitioner.MakeScope.Var('wj_dd_petition_target').Char.Custom('WJ_GetLinkedUIName')]辖境相接。近来议及防守援应，常须跨区往返，军令与道路难以兼顾。\n\n谨请将其所领、与本区相连而未入他区的州郡一并归臣节制，以便统一调度。此议只关军务统属，不涉封土。\n\n所请止于此，伏候允准；若以为不宜，臣仍守现有辖境尽职。"
 WJ_dd_qinwang_gate:0 "天子须正为一场可获支援的战争之首，并有足够的影响力、威望与正统性；此人须为本朝现任都督，且能够参战"
 WJ_dd_rename_desc:0 "你提笔为此都督区另拟名号。新名只题于都督区簿册之上，不改辖境与统属；日后都督更替，此名照旧。\n\n#weak 右键点击区名旁的改名图标，可恢复原有的称呼。#!"
 WJ_dd_rename_title:0 "更定都督区名"
 WJ_dd_reset_name:0 "复名"

