 wj_district_management_filter_tag_desc:0 "辖区武官军务与兵籍调度"
 wj_military_transfer_filter_tag_desc:0 "选定兵籍调度的转移方与接收方"
 WJ_mt_chance_base:0 "基本意愿：#P +50#!"
 WJ_mt_chance_factors:0 "转出方对你的好感：[GetPlayer.MakeScope.ScriptValue('WJ_mt_opinion_score')|+=0]\n亲友、门生及僚属：[GetPlayer.MakeScope.ScriptValue('WJ_mt_trust_score')|+=0]\n仇怨：[GetPlayer.MakeScope.ScriptValue('WJ_mt_hostility_score')|+=0]\n军权与拒令后果：[GetPlayer.MakeScope.ScriptValue('WJ_mt_authority_score')|+=0]\n转出方当前战事：[GetPlayer.MakeScope.ScriptValue('WJ_mt_war_score')|+=0]\n本次待调团数：[GetPlayer.MakeScope.ScriptValue('WJ_mt_count_score')|+=0]\n调出兵力占比：[GetPlayer.MakeScope.ScriptValue('WJ_mt_fraction_score')|+=0]\n\n转出方的意愿最低5%，最高95%。"
 WJ_mt_chance_header:0 "#T 接受概率：[GetPlayer.MakeScope.Var('wj_mt_chance').GetValue|0]%#!"
 WJ_mt_chance_self:0 "调出自己的兵团：#P 必定接受#!\n仍须兵源、头衔、军权与国库俱足。"
 WJ_mt_confirm_requires:0 "须选定调出与接收的头衔及至少一支待调兵团，且军权、兵源与国库俱足。"
 WJ_mt_copy_failed:0 "新军籍未能编成，调兵之事作罢：原兵各归本营，国库未支分文，也无人因此获罪。"
 WJ_mt_declined_desc:0 "[scope:wj_mt_source.Custom('WJ_GetLinkedUIName')]不肯奉令调兵，一兵一卒都未移动。抗命者若非天子本人，便当以违犯军法论处。"
 WJ_mt_declined_title:0 "移军之令未奉"
 WJ_mt_invalid_desc:0 "人选、头衔、兵源或军权已经生变，或国库不足，调令未能施行，也无人因此获罪。先前所拟人选已一并撤去，须重新择定。"
 WJ_mt_invalid_title:0 "调令未能施行"
 WJ_mt_need_pair:0 "须先在人物交互菜单中选定调出方与接收方，二人皆须在你的军权所及之内。郡国兵两端须为公爵以上；部曲可由伯爵调出。"
 WJ_mt_order_menu:0 "兵籍调度"
 WJ_mt_person_gate:0 "选择你当前有权调度的本朝人物。"
 WJ_mt_hanjin_tt:0 "须采用郡国制政体。"
 WJ_mt_authority_role_tt:0 "你须为本朝天子、都督中外，或在任的地方都督。"
 WJ_mt_baton_tt:0 "地方都督须持有假节、持节或使持节。"
 WJ_mt_settled_district_tt:0 "都督区尚在设置之中，须待其落定。"
 WJ_mt_no_rebellion_tt:0 "地方都督不能在与最高领主交战时调兵。"
 WJ_mt_has_command_tt:0 "所选人物须有领地，或持有可承载郡国兵的公爵及以上实职头衔。"
 WJ_mt_same_realm_tt:0 "所选人物须与你同属一个最高领主辖区。"
 WJ_mt_central_target_tt:0 "中央调度仅可选择本人、皇帝或本朝武官。"
 WJ_mt_local_military_tt:0 "地方都督仅能选择本人或本区武官。"
 WJ_mt_local_district_tt:0 "所选武官须属于你的都督区。"
 WJ_mt_local_tier_tt:0 "使持节可调度州级及以下武官；持节限郡级及以下；假节还须处于战争中。"
 WJ_mt_title_tier_tt:0 "郡国兵调出方及两类调入方须持有公爵及以上头衔。"
 WJ_mt_success_desc:0 "[scope:wj_mt_source.Custom('WJ_GetLinkedUIName')]所出之军已依令编入[scope:wj_mt_receiver.Custom('WJ_GetLinkedUIName')]麾下，旧日兵籍随之注销。若系部曲改编，国库已将补偿付与原主。"
