l_simp_chinese:
 WJ_qingyi_mingli_capacity_modifier:0 "辨名析理"
 WJ_qingyi_mingli_capacity_modifier_desc:0 "在清谈中厘清名实、贯通义理，贤望数值上限增加1级。此修正不直接增加现有贤望，也不直接跨越任官品级。"
 WJ_qingyi_huitong_capacity_modifier:0 "会通群言"
 WJ_qingyi_huitong_capacity_modifier_desc:0 "不囿一家之说，能从异论中融会贯通，贤望数值上限增加1级。此修正不直接增加现有贤望，也不直接跨越任官品级。"
 WJ_qingyi_jingyi_capacity_modifier:0 "经义有得"
 WJ_qingyi_jingyi_capacity_modifier_desc:0 "经义之学有所新得，足以自立一说，贤望数值上限增加1级。此修正不直接增加现有贤望，也不直接跨越任官品级。"
 WJ_yinshi_zhushu_capacity_modifier:0 "著述成篇"
 WJ_yinshi_zhushu_capacity_modifier_desc:0 "潜心著述，终于将多年所学整理成篇，贤望数值上限增加1级。此修正不直接增加现有贤望，也不直接跨越任官品级。"
 WJ_yinshi_xiangwang_capacity_modifier:0 "乡里推重"
 WJ_yinshi_xiangwang_capacity_modifier_desc:0 "以德行与见识取信乡人，不仕亦有清望，贤望数值上限增加1级。此修正不直接增加现有贤望，也不直接跨越任官品级。"
 WJ_yinshi_jiangxue_capacity_modifier:0 "讲学传道"
 WJ_yinshi_jiangxue_capacity_modifier_desc:0 "山居授徒，教学相长，贤望数值上限增加1级。此修正不直接增加现有贤望，也不直接跨越任官品级。"
 WJ_yuedan_nominated_capacity_modifier:0 "士林见知"
 WJ_yuedan_nominated_capacity_modifier_desc:0 "列入月旦评名录，才行始为士林所知，贤望数值上限增加1级。同系列评价只保留最高一档，不重复累积。"
 WJ_yuedan_finalist_capacity_modifier:0 "清誉卓著"
 WJ_yuedan_finalist_capacity_modifier_desc:0 "进入月旦评终评，清誉渐著，贤望数值上限增加2级。同系列评价只保留最高一档，不重复累积。"
 WJ_yuedan_winner_capacity_modifier:0 "一时冠冕"
 WJ_yuedan_winner_capacity_modifier_desc:0 "当选本次月旦评名士，为一时人物之冠，贤望数值上限增加3级。同系列评价只保留最高一档，不重复累积。"
 WJ_qingyi.4101.t:0 "名实之间"
 WJ_qingyi.4101.desc:0 "一番论辩之后，席间诸人仍各执一词。有人重名，有人重实，争到最后，反将所论之事搁在一旁。\n\n我重新梳理他们的说法，忽然发现，纷争未必出在道理本身，而在同一字眼之下，各人指称的竟不是同一件事。若能将此分说清楚，今日所得便不止是一时胜负。"
 WJ_qingyi.4101.a:0 "厘清名实，再立论断。"
 WJ_qingyi.4101.b:0 "先将这番见解说与众人听。"
 WJ_qingyi.4102.t:0 "异说相逢"
 WJ_qingyi.4102.desc:0 "两家之说针锋相对，席间几乎无人肯退让。我本也已有成见，却在倾听时察觉：各家所长，恰能补另一家的偏失。\n\n要博得满座喝彩，驳倒一方就够了；要真正有所进益，则须放下门户之见，将两说细细参验。"
 WJ_qingyi.4102.a:0 "不争门户，取其所长。"
 WJ_qingyi.4102.b:0 "记下诸家说法，留待日后研习。"
 WJ_qingyi.4103.t:0 "经义新解"
 WJ_qingyi.4103.desc:0 "一处向来熟读的经文，在今日讨论中竟显出了不同的意味。旧注仍有可取之处，却无法尽释眼前之疑。\n\n众人逐渐转向别的话题，我心中那个新解却越发清晰。若将前后篇章重新贯通，或许能够写成一篇足以自立的论说。"
 WJ_qingyi.4103.a:0 "细究章句，将新解写成一论。"
 WJ_qingyi.4103.b:0 "今日已颇有所得，不妨从容相谈。"
 WJ_yinshi.6001.t:0 "残篇成书"
 WJ_yinshi.6001.desc:0 "案上积着多年札记，有的是读书心得，有的是世事得失，也有几页只写了半截便被搁下。如今远离官府，我终于有暇逐篇检视。\n\n看似零散的片段之间，渐渐显出一条贯通的脉络。若肯再费心订补，这些残篇便不再只是自家笔记，而能成为一部可供后人参验的著述。"
 WJ_yinshi.6001.a:0 "删繁补阙，成一家之言。"
 WJ_yinshi.6001.b:0 "先整理旧学，不必急于成书。"
 WJ_yinshi.6002.t:0 "乡论所归"
 WJ_yinshi.6002.desc:0 "乡里有了争执，几位父老登门请我评说。我虽久不仕宦，他们却愿意将难断之事托付于我。\n\n若只是劝双方息争，今日便能了事；若将事情的来龙去脉一一理清，以公论取信于人，今后乡里也许会少些类似的纷扰。"
 WJ_yinshi.6002.a:0 "不徇亲疏，立一番公论。"
 WJ_yinshi.6002.b:0 "先劝两家和解，莫使争端扩大。"
 WJ_yinshi.6003.t:0 "山居讲席"
 WJ_yinshi.6003.desc:0 "几位后生辗转寻来，愿在此处听我讲学。他们并非个个聪敏，所问却常切中我从未细想的地方。\n\n授人一卷书不难，要将其中道理讲得明白，却须重新审视自己所学。我开始明白，远离仕途并不意味着学问就此停步。"
 WJ_yinshi.6003.a:0 "设席授业，也借此反求诸己。"
 WJ_yinshi.6003.b:0 "先与后生从容问答。"
 WJ_qingyi_yd_log_capacity:0 "月旦评依最终名次定誉：入选者士林见知，入围者清誉卓著，当选者一时冠冕。"
