 WJ_kaoke_malpractice_opinion:0 "考课徇私舞弊"
 WJ_kaoke_malpractice_secret:0 "考课徇私舞弊"
 WJ_kaoke_malpractice_secret_desc:0 "曾徇私改动[TARGET_CHARACTER.Custom('WJ_GetLinkedUIName')]治下官员的考课。"
 WJ_kaoke_malpractice_secret_tooltip_desc:0 "[CHARACTER.Custom('WJ_GetLinkedUIName')|U]曾徇私改动中央考课。"
 WJ_kaoke_malpractice_secret_type_desc:0 "该角色利用中央职权徇私改动官员考课。"
 WJ_kaoke_request_20:0 "本期考课 +20分"
 WJ_kaoke_request_30:0 "本期考课 +30分"
 WJ_kaoke_request_50:0 "本期考课 +50分"
 WJ_kaoke_request_burden_reason:0 "所请求的考课加分"
 WJ_kaoke_request_gain_20_tt:0 "本期考课添#P 20#!分"
 WJ_kaoke_request_gain_30_tt:0 "本期考课添#P 30#!分"
 WJ_kaoke_request_gain_50_tt:0 "本期考课添#P 50#!分"
 WJ_kaoke_request_one_score_tt:0 "须且只能择定一档加分"
 WJ_kaoke_request_options:0 "择定一档加分，另可附上筹码"
 WJ_kaoke_request_period_tt:0 "你须身在本期考课之中，且本期尚未请托得手"
 WJ_kaoke_request_secret_known_tt:0 "你将握有对方徇私的把柄，本期不得再行请托"
 WJ_kaoke_request_secret_owner_tt:0 "背上一桩考课舞弊的秘密，且为请托者所知"
 WJ_kaoke_request_willingness_tt:0 "对方须愿意受理此事"
 WJ_kaoke_result_desc:0 "书吏将最后一页考课簿递来，你改定之处已一一誊入簿中。你看过，示意收卷，他却在封存之前又把名字核了一遍。\n\n笔下的改动终究留下了痕迹，各官的考赏还要等到他们各自考满之时。至于日后会不会有人来问这些评语的来由，此刻谁也没有提起。文书收走，案上倒忽然空了许多。此后数年，这本课簿你是不便再动了。"
 WJ_kaoke_result_emperor_desc:0 "最后一份考课簿也已收齐。书吏将改定之处逐人念过，念到某个名字时，又停下来看你，仿佛想从你脸上再讨一句准话。\n\n你让他照已定的记录归簿，不必再问。那些远在州县的人眼下尚未听闻，日后的课第却已添上了今日御前这一笔。正式的考赏，仍待各官考满之时。此后数年，你不便再亲自过问课簿了。"
 WJ_kaoke_result_title:0 "课簿归档"
 WJ_kaoke_result_ack:0 "封簿归档。"

