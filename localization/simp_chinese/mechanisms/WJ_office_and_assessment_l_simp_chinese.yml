 WJ_kaoke_bad_opinion:0 "考课劣等，有负所托"
 WJ_kaoke_candidate_desc:0 "最近五年考课"
 WJ_kaoke_candidate_summary:0 "目前地方任命候选加分：[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_candidate_value')|0]。只取本朝最近一考，不累加历届考第，不保证获得任命。"
 WJ_kaoke_chosen_candidate_tt:0 "本朝最近考第的地方任命候选分提高[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_reward_candidate_value')|0]，保留至下次结算或失去考课身份，不保证获得任命。"
 WJ_kaoke_civil_gain_tt:0 "考课：公务完成+1件，公务功过#P +20#!分。实际完成后即可查阅考课簿。"
 WJ_kaoke_civil_loss_tt:0 "考课：公务完成+1件，公务功过#N -20#!分。实际完成后即可查阅考课簿。"
 WJ_kaoke_civil_unscored_tt:0 "考课：公务完成+1件，本次不增减分数。实际完成后即可查阅考课簿。"
 WJ_kaoke_close_book:0 "合上考课簿"
 WJ_kaoke_current_page:0 "返回功过实录"
 WJ_kaoke_current_summary:0 "本期已过[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_days_value')|0]日，距五年考课[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_remaining_value')|0]日。\n公务完成：[ROOT.Char.MakeScope.Var('wj_kaoke_civil_count').GetValue|0]件，公务功过[ROOT.Char.MakeScope.Var('wj_kaoke_civil_points').GetValue|0]分。\n亲历战斗：[ROOT.Char.MakeScope.Var('wj_kaoke_battles').GetValue|0]场，胜[ROOT.Char.MakeScope.Var('wj_kaoke_wins').GetValue|0]、败[ROOT.Char.MakeScope.Var('wj_kaoke_losses').GetValue|0]；军功原值[ROOT.Char.MakeScope.Var('wj_kaoke_military_points').GetValue|0]，计入评分[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_military_value')|0]分。\n吏治抉择：[ROOT.Char.MakeScope.Var('wj_kaoke_choice_count').GetValue|0]次，功过[ROOT.Char.MakeScope.Var('wj_kaoke_choice_points').GetValue|0]分。[ROOT.Char.Custom('WJKaokeCentral')]$WJ_ai_kaoke_superior_summary$\n当前考第：[ROOT.Char.Custom('WJKaokeCurrentGrade')]。\n#bold 本期考课总分：[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_score_value')|0]#!（含基础50分）。\n\n"
 WJ_kaoke_cycle_rules:0 "仅汉晋天朝、最高头衔不超过王国的地方契约官员参与。帝国级及以上、独立君主和无地人物排除。\n地方官之间转任不断期；丢失资格或改属另一朝廷则清空，不领奖。重新符合才开启新的五年。"
 WJ_kaoke_grade_none:0 "未考"
 WJ_kaoke_last_summary:0 "最近结算：考第#bold [ROOT.Char.Custom('WJKaokeGrade')]#!，总分[ROOT.Char.MakeScope.Var('wj_kaoke_last_score').GetValue|0]。\n公务[ROOT.Char.MakeScope.Var('wj_kaoke_last_civil_count').GetValue|0]件，功过[ROOT.Char.MakeScope.Var('wj_kaoke_last_civil_points').GetValue|0]分；亲历战斗[ROOT.Char.MakeScope.Var('wj_kaoke_last_battles').GetValue|0]场，胜[ROOT.Char.MakeScope.Var('wj_kaoke_last_wins').GetValue|0]、败[ROOT.Char.MakeScope.Var('wj_kaoke_last_losses').GetValue|0]；吏治抉择功过[ROOT.Char.MakeScope.Var('wj_kaoke_last_choice_points').GetValue|0]分。[ROOT.Char.Custom('WJKaokeLastCentral')]$WJ_ai_kaoke_last_superior_summary$\n本次考赏：[ROOT.Char.Custom('WJKaokeReward')]。\n\n"
 WJ_kaoke_legacy_history:0 "\n旧制记录已按十分制换算；旧考第和已发放奖惩保留，不按新门槛追溯改判或重新领奖。"
 WJ_kaoke_no_history:0 "尚无完整五年考第；不补造以往任务记录。\n\n"
 WJ_kaoke_open_book_tt:0 "打开考课簿；查阅不领奖，也不清空记录。"
 WJ_kaoke_poor_opinion:0 "考课差等，治事失当"
 WJ_kaoke_resume_reward:0 "领取最近一次考赏"
 WJ_kaoke_reward_candidate_choice:0 "愿录其绩，荐于有司。（候选分+[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_reward_candidate_value')|0]）"
 WJ_kaoke_reward_cha:0 "考第差：候选分固定-15，直接领主对你的好感-10；五年内每月贤望获取-5%、俸禄基础比例-2.5个百分点。不直接扣除已有贤望，不强制撤官。\n"
 WJ_kaoke_reward_liang:0 "考第良：可从荐举、国库拨款、贤望旌表、宦海研习中择一领取，不会全部发放。\n"
 WJ_kaoke_reward_lie:0 "考第劣：候选分固定-30，直接领主对你的好感-20；五年内每月贤望获取-10%、俸禄基础比例-5个百分点。不直接扣除已有贤望，不强制撤官。\n"
 WJ_kaoke_reward_merit_choice:0 "请颁善政旌表。（贤望+[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_reward_merit_value')|0]）"
 WJ_kaoke_reward_ping:0 "考第平：功过相衡，无奖励或处罚，地方任命候选分为0。\n"
 WJ_kaoke_reward_treasury_choice:0 "请拨治所经费。（国库+[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_reward_treasury_value')|0]）"
 WJ_kaoke_reward_xp:0 "仅本次结算前已正式入仕、拥有宦海沉浮特质且对应线路未满级者可选；优最多3点、良最多2点，按本次考第的文武身份记治绩或武勋，不补发试守期经验。"
 WJ_kaoke_reward_xp_choice:0 "愿研习前贤治政之法。（宦海经验+[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_reward_xp_value')|0]）"
 WJ_kaoke_reward_you:0 "考第优：可从荐举、国库拨款、贤望旌表、宦海研习中择一领取，不会全部发放。\n"
 WJ_kaoke_rules_page:0 "哪些事有功，哪些事有过？"
 WJ_kaoke_scoring_rules:0 "考课总分＝基础50＋公务功过＋军功（计入分数限-60至+60）＋吏治抉择功过＋中央朝廷调分。\n优：100及以上；良：80—99；平：50—79；差：30—49；劣：低于30。\n良优考赏四选一：候选分30/60，国库150/300，贤望75/150，正式官员宦海经验2/3。只有选择荐举才获得相应候选加分。\n差劣固定扣候选分15/30、直接领主好感10/20，并施加五年减益；不扣现有贤望。不叠加历届考第。\n\n"
 WJ_kaoke_settlement_end:0 "\n本期已结案清零，新一期五年从基础50分开始。差劣处罚已经生效；良优需在下方选择一项考赏。未领取时可从考课簿重新打开，最迟保留至下次结算；丢失考课身份则清除。"
 WJ_kaoke_settlement_intro:0 "五载案牍，今付有司。书吏将公务、军功与历年抉择逐项勾稽，功不相掩，过不相饰。\n\n"
 WJ_kaoke_task_rules:0 "公务：完成地图治理任务记一件；接受、预览与单纯取消不算。处置结果按选项提示增减20分，部分结果不增减；同一合同只记一次，工程不记考课。\n军功：亲任指挥官或骑士的每场实际战斗记一次，胜+10、败-10；不因领主参战凭空得功。\n吏治：每年一道官场抉择。尽责可得功，折衷可持平，谋私会减分；能力挑战可能成功或失败。选项明确显示条件、概率与实际功过。\n\n"
 WJ_kaoke_trial_continue:0 "试守尚未达到良，继续试守，参加下一次五年考课。\n"
 WJ_kaoke_trial_maocai:0 "试守考第优：有司举为茂才，正式入仕。本次不补发试守期宦海经验。\n"
 WJ_kaoke_trial_rules:0 "当前尚未正式入仕：随本周期结算，良举孝廉、优举茂才；未达到良则继续试守。转正不消耗自选考赏。\n\n"
 WJ_kaoke_trial_xiaolian:0 "试守考第良：有司举为孝廉，正式入仕。本次不补发试守期宦海经验。\n"

