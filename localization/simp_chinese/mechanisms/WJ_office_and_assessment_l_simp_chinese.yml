 WJ_kaoke_acknowledge:0 "收阅考第，谨记得失。"
 WJ_kaoke_award_candidate:0 "已选荐举"
 WJ_kaoke_award_legacy:0 "旧制考赏已发放"
 WJ_kaoke_award_merit:0 "已领贤望旌表"
