 # 来源：localization/simp_chinese/WJ_kaoke_tasks_l_simp_chinese.yml
 WJ_kaoke_tasks_coverage:0 "地图公务考课覆盖"
 WJ_kaoke_tasks_coverage_desc:0 "普通行政、天朝治理、地方军需与灾害救济公务，在原生奖励实际结算后计入考课。每份契约仅记录一次：公务完成+1件，按处理结果考课+20、考课-20或考课不增减。仅累计公务完成件数与分值；秘密私利不公开加分。资格由考课核心统一核验。"
 WJ_kaoke_tasks_limits_desc:0 "仅覆盖原生真实结算路径；奖励预览、失效回调和未被调用的备用奖励不计数。冒险者、游牧迁徙与曼荼罗仪式不属于本项公务覆盖。原生事件作用域错误及尚未进入真实结算的任务不会由考课接线补偿。"
 WJ_kaoke_tasks_scope_desc:0 "记账对象为契约的实际完成者；不依赖接单时的任期、官职、地点或临时作用域。公务中的修桥、修坝、灾后救援按整件公务结果记录，不另记工程次数。军事公务不等于真实参战。"

