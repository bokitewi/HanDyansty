 WJ_kaoke_award_xp:0 "已领宦海研习"
 WJ_kaoke_bad_opinion:0 "考课劣等，有负所托"
 WJ_kaoke_candidate_desc:0 "最近五年考课"
 WJ_kaoke_candidate_summary:0 "\n地方择官加分：[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_candidate_value')|0]（以本朝最近一次考第为准）。"
 WJ_kaoke_chosen_candidate_tt:0 "你的考绩将呈报有司；直到下次考课之前，地方择官时你会更受青睐。"
 WJ_kaoke_civil_gain_tt:0 "此事将记入你的考课，算作一功。"
 WJ_kaoke_civil_loss_tt:0 "此事将记入你的考课，算作一过。"
 WJ_kaoke_civil_unscored_tt:0 "此事将记入你的考课，不计功过。"
 WJ_kaoke_close_book:0 "合上考课簿"
 WJ_kaoke_current_page:0 "返回功过实录"
 WJ_kaoke_current_summary:0 "本期已过[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_days_value')|0]日，余[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_remaining_value')|0]日。公务[ROOT.Char.MakeScope.Var('wj_kaoke_civil_count').GetValue|0]件／[ROOT.Char.MakeScope.Var('wj_kaoke_civil_points').GetValue|0]分；战斗[ROOT.Char.MakeScope.Var('wj_kaoke_battles').GetValue|0]场，胜[ROOT.Char.MakeScope.Var('wj_kaoke_wins').GetValue|0]败[ROOT.Char.MakeScope.Var('wj_kaoke_losses').GetValue|0]，军功原值[ROOT.Char.MakeScope.Var('wj_kaoke_military_points').GetValue|0]、计入[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_military_value')|0]分；吏治[ROOT.Char.MakeScope.Var('wj_kaoke_choice_count').GetValue|0]次／[ROOT.Char.MakeScope.Var('wj_kaoke_choice_points').GetValue|0]分。[ROOT.Char.Custom('WJKaokeCentral')]$WJ_ai_kaoke_superior_summary$\n本期[ROOT.Char.Custom('WJKaokeCurrentGrade')]，总分[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_score_value')|0]（含基础50）。\n"
 WJ_kaoke_cycle_rules:0 "凡受考者，限本朝王国级以下的地方官；帝国级、自立及无封地者不与。五年一考，同朝转任不断期；若失去资格或改朝换代，则旧期作废、不得考赏，重获资格后另起五年。"
 WJ_kaoke_grade_none:0 "未考"
 WJ_kaoke_last_summary:0 "上期：[ROOT.Char.Custom('WJKaokeGrade')]，总分[ROOT.Char.MakeScope.Var('wj_kaoke_last_score').GetValue|0]。公务[ROOT.Char.MakeScope.Var('wj_kaoke_last_civil_count').GetValue|0]件／[ROOT.Char.MakeScope.Var('wj_kaoke_last_civil_points').GetValue|0]分；战斗[ROOT.Char.MakeScope.Var('wj_kaoke_last_battles').GetValue|0]场，胜[ROOT.Char.MakeScope.Var('wj_kaoke_last_wins').GetValue|0]败[ROOT.Char.MakeScope.Var('wj_kaoke_last_losses').GetValue|0]；吏治[ROOT.Char.MakeScope.Var('wj_kaoke_last_choice_points').GetValue|0]分。[ROOT.Char.Custom('WJKaokeLastCentral')]$WJ_ai_kaoke_last_superior_summary$\n考赏：[ROOT.Char.Custom('WJKaokeReward')]。\n"
 WJ_kaoke_legacy_history:0 "\n旧日考第已按新法折算，既往赏罚不再追改。"
 WJ_kaoke_no_history:0 "尚无完整五年考第。\n"
 WJ_kaoke_open_book_tt:0 "翻开考课簿，查看本期功过。"
 WJ_kaoke_poor_opinion:0 "考课差等，治事失当"
 WJ_kaoke_resume_reward:0 "领取最近一次考赏"
 WJ_kaoke_reward_candidate_choice:0 "请录此绩，以备擢用。"
 WJ_kaoke_reward_cha:0 "你的考第列为差等。有司责你治事未周，上官对你也颇有微词；此后数年，你的俸给与贤望都要受些拖累。\n"
 WJ_kaoke_reward_liang:0 "你的考第列为良等，按例可向有司择请一项考赏。\n"
 WJ_kaoke_reward_lie:0 "你的考第列为劣等。有司削你俸给，令你整饬吏治，上官亦深为不满；此后数年，俸给与贤望俱受贬抑，仕途怕是难有起色。\n"
 WJ_kaoke_reward_merit_choice:0 "请颁善政旌表。"
 WJ_kaoke_reward_ping:0 "你的考第列为平等，无功无过，不赏不罚。\n"
 WJ_kaoke_reward_treasury_choice:0 "请拨治所经费。"
 WJ_kaoke_reward_xp_choice:0 "愿研习前贤治政之法。"
 WJ_kaoke_reward_you:0 "你的考第列为优等，按例可向有司择请一项考赏。\n"
 WJ_kaoke_rules_page:0 "哪些事有功，哪些事有过？"
 WJ_kaoke_scoring_rules:0 "凡考课，以五十分为基，加公务、军功、吏治与朝廷所调之分；军功增减，各以六十分为限。百分以上为优，八十以上为良，五十以上为平，三十以上为差，不及三十为劣。\n良、优者得择请考赏一项：或荐于有司以备擢用，或请拨国库经费，或请颁善政旌表，或研习治政之法，优等所得更厚。差、劣者五年之内俸给与贤望俱受贬抑，上官亦生不满，劣等加倍；已有的贤望不予扣除，历届考第也不累加。\n"
 WJ_kaoke_settlement_end:0 "\n旧簿至此封存，新的一期又从头记起。若得良、优，可择请一项考赏；一时未决，日后翻开考课簿仍可补领，过了下次考课便作罢。"
 WJ_kaoke_settlement_intro:0 "五年任事的簿册已经合到一处。书吏逐项核过功过，将本期课第呈到你面前。\n\n"
 WJ_kaoke_task_rules:0 "凡公务，须办毕地方治理的差事方得记录，一事一记，修造工程不单独计；功过随所选处置而定。凡军功，须亲为统兵将领或骑士临阵：胜则记功十分，败则记过十分。凡吏治，每年一案：尽责者有功，折衷者不增不减，谋私者减分；才具所试，或成或败。\n"
 WJ_kaoke_trial_continue:0 "试守未及良等，只得续守，以待下次考课。\n"
 WJ_kaoke_trial_maocai:0 "你试守考在优等，已举茂才，从此正式入仕。\n"
 WJ_kaoke_trial_rules:0 "你尚在试守：考在良等可举孝廉，考在优等可举茂才；未及良等，则续守再考。\n"
 WJ_kaoke_trial_xiaolian:0 "你试守考在良等，已举孝廉，从此正式入仕。\n"

