 # 来源：localization/simp_chinese/WJ_kaoke_assessment_additions_l_simp_chinese.yml
 WJ_kaoke_active_disfavor_opinion:0 "考课打压"
 WJ_kaoke_active_favor_opinion:0 "考课提携"
 WJ_kaoke_trial_notice_maocai:0 "试守的评定已经下来：列为优等，举为茂才。你把文书看了两遍，才真正明白，先前那尚待考验的身份，到今日总算有了交代。\n\n此后任事，仍须自担功过，不能凭一纸出身便自以为无所不通。但这些年所做的并未落空，这份认可也足以让你更坦然地面对来问政务的人。你将文书收好，又回到案前，处理那些该办的事。"
 WJ_kaoke_trial_notice_title:0 "试守考成"
 WJ_kaoke_trial_notice_xiaolian:0 "试守评为良等，举为孝廉。送文书的人读罢，仍在一旁等你回话，你却先把列明的评语从头又看了一遍。\n\n其中有褒有贬。试守至此，总算不必再以同样的身份等待下一回考验；可是能够正式入仕，与日后每件事都办得妥当，中间仍隔着许多工夫。你收好文书，让来人接着禀报手头的事务。"

 # 来源：localization/simp_chinese/WJ_kaoke_central_l_simp_chinese.yml
 WJ_kaoke_case_arrest:0 "依律收捕，下狱问罪。"
 WJ_kaoke_case_desc:0 "[wj_kaoke_offender.Custom('WJ_GetLinkedUIName')]徇私改动考课的案卷，终于摆上了你的案头。书吏指着几处涂改念下去，你听到一半，便叫他将那页摊平，亲自再看一遍。\n\n证据确凿，如何处置却全凭你一言：网开一面也好，下狱问罪也罢，或是先将案由收着，留待来日。只是课簿上被改过的评语、早已转手的钱财，都不会因这一句处分而复原。"
 WJ_kaoke_case_dismiss:0 "案卷暂存，容后再议。"
 WJ_kaoke_case_forgive:0 "念其旧劳，姑且宽宥。"
 WJ_kaoke_case_title:0 "考课舞弊案"
 WJ_kaoke_central_negative:0 "\n来自中央朝廷的不满 −[ROOT.Char.MakeScope.ScriptValue('WJ_kaoke_central_abs_value')|0]分。"
