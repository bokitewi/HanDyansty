 WJ_luyi_shizu:0 "[wj_shizu|E]"
 WJ_LUZHI_DESC_CHU_NO_ROAD:0 "你既无官职在身，也没有辟召、孝廉或茂才的出身，故为[wj_chushi|E]。贤望只能抬高日后可任之官的上限；须先取得入仕出身，再蒙任命，方有[wj_luyi|E]可言。"
 WJ_LUZHI_DESC_CHU_WITH_ROAD:0 "你虽已有入仕出身，眼下却未任官职，故仍以[wj_chushi|E]身份居于朝野。下方所列的贤望任官上限，只是你可受任的最高范围；须蒙任命，方按官职定其[wj_luyi|E]。"
 WJ_LUZHI_DESC_OFFICIAL:0 "你现为[Character.Custom('WJ_BandWord')]，这是依你所任最高官职而定的[wj_luyi|E]。入仕出身决定你能否列入择官之选，贤望决定你可受任的最高范围；二者都不能越过官职，径自改变你的禄秩。"
 WJ_LUZHI_DESC_SHI_NO_ROAD:0 "你眼下未任官职，也尚无辟召、孝廉或茂才的出身；因是无地士族，故显示为[wj_shizu|E]，但士族之名既非官职，也非禄秩。须先取得入仕出身，再蒙任命，方按官职定其[wj_luyi|E]。"
 WJ_LUZHI_DESC_SHI_WITH_ROAD:0 "你虽已有入仕出身，眼下却未任官职；因是无地士族，故显示为[wj_shizu|E]。下方所列的贤望任官上限，只是你可受任的最高范围；须蒙任命，方按官职定其[wj_luyi|E]。"
 WJ_LUZHI_DESC_SHOU:0 "你已任官职，却尚无辟召、孝廉或茂才的出身，只能暂以[wj_shishou|E]任事，未得此职应有的[wj_luyi|E]。下方所列的贤望任官上限，只是声望所许的最高范围，并非眼下的禄秩；试守满一年并通过考课，方得入仕出身，按届时所任官职正式定秩。"
 WJ_road_heading_hanjin:0 "入仕之途"
 WJ_tooltip_explain_hanjin:0 "[wj_luyi|E]是所任官职的品秩，[wj_mingwang|E]是士林中的声望，二者不可混同。"
 WJ_xianwang_0:0 "未有声闻"
