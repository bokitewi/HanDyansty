l_simp_chinese:
 WJ_peerage_trait:0 "世袭爵位"
 WJ_peerage_trait_desc:0 "爵号取自所绑定地区的现名；爵位及岁禄随士族头衔传承。"
 WJ_peer_grant_interaction:0 "策命封爵"
 WJ_peer_open_tt:0 "进入授爵。浏览上级地区与取消不收费；点击合资格的末级封地即册封并绑定士族头衔。"
 WJ_peer_choose_rank_tt:0 "亭侯选男爵、县侯与县公主选县；郡公、王与郡公主选郡，岁禄县自动取该郡法理首府。公主限授爵者同王朝女性，不要求功勋。王爵沿旧费用：50金币、50虔诚、50影响力，并须有50威望。"
 WJ_peer_choose_place_tt:0 "选择上级地区进入下一级；选择末级封地立即册封。须仍在本次选择范围内且食邑仍属本朝，爵源与食邑未被占用。整县食邑与县内亭侯食邑互斥；郡公、王和郡公主不得共用同一郡，县侯与县公主不得共用同一县。"
 WJ_peer_navigation_tt:0 "继续选择，不授爵、不扣费。"
 WJ_peer_cancel_tt:0 "结束本次选择，不授爵、不扣费。"
 WJ_peer_confirm_tt:0 "正式授予所选爵位并绑定食邑，每年结算5—50金币。宗室王爵此时支付50金币、50虔诚、50影响力；不会转移土地、封臣或官职。"
 WJ_peer_revoke_interaction:0 "削夺爵位"
 WJ_peer_designate_interaction:0 "指定袭爵人"
 WJ_peer_rank_desc:0 "为[ROOT.Char.MakeScope.Var('wj_peer_target').Char.GetFirstNameNoTooltip]择定爵等。普通男性的亭侯、县侯、郡公分别需要军功或政绩至少25、50、75；王爵限既定近亲男性。同王朝女性可封县公主或郡公主，均称公主。每人、每个士族头衔至多一爵。"
 WJ_peer_requirements:0 "资格或资费不足。亭侯、县侯、郡公分别要求武勋或政绩达到25、50、75。宗室王爵要求50金币、50虔诚、50影响力，并有50威望；仅正式授予时支付前三项。"
 WJ_peer_pick_title:0 "择地册封"
 WJ_peer_pick_desc:0 "从授爵者及各级封臣实际持有的疆域中选择，按王国、郡、县、亭逐级分组。仅列出合资格地点；未建设、非本朝、已占用及没有可授地点的分支均不显示。公、王及郡公主还须控制对应法理首府县。点击末级封地即册封，无须再次确认。"
 WJ_peer_next:0 "下一页"
 WJ_peer_back:0 "返回上一级"
 WJ_peer_restart:0 "重选爵等"
 WJ_peer_confirm_title:0 "颁下封爵诏命"
 WJ_peer_confirm_desc:0 "爵号来源：[ROOT.Char.MakeScope.Var('wj_peer_pending_name').Title.GetBaseNameNoTierNoTooltip]\n食邑：[ROOT.Char.MakeScope.Var('wj_peer_pending_food').Title.GetBaseNameNoTierNoTooltip]\n受封者：[ROOT.Char.MakeScope.Var('wj_peer_target').Char.Custom('WJ_GetUIName')]\n不会转移土地、封臣，亦不改变政体及继承法。"
 WJ_peer_confirm:0 "正式授予"
 WJ_peer_awarded:0 "封爵诏命"
 WJ_peer_inherited:0 "承袭爵位"
 WJ_peer_awarded_desc:0 "爵命送到，我先听完宣读，才接过文书。#high [ROOT.Char.Custom('WJ_PeerName')]#!几个字落在眼前，岁禄系于[ROOT.Char.MakeScope.Var('wj_peer_food').Title.GetBaseNameNoTierNoTooltip]，连今后的家中承传也有了新的凭据。\n\n侍者问该收在何处，我一时没有答，仍把新称谓又看了一遍。往后来人递上名刺、谈起家门，大概都要先添上这几个字了。\n\n食邑供禄，那里并不因此改由我亲治，既有官职与实土也仍照旧。可我将文书合起时，仍觉得它与案上其他东西有些不同。"
 WJ_peer_removed:0 "爵位已除"
 WJ_peer_removed_desc:0 "处分文书已经读完，书吏却仍站在案前，等我确认往后的称谓。我这才看见他重誊的名册：旧日爵号所在，已经空了。\n\n有些话听惯了，竟会忘记它也能被收回。原有食邑与袭爵安排一并解除，家中用度和后人的打算，都不能再照旧算。旁人若仍沿用旧称，也只会使这一处空白更加刺眼。\n\n我让他把文书留下。官职与实际土地未因此变动，该送来的事务明日照样会送来；只是那些文书开头，再不能写原先的几字了。"
 WJ_peer_income:0 "食邑岁禄"
 WJ_peer_income_desc:0 "书吏报岁禄到账，我原本还在翻另一份文书，听到[ROOT.Char.MakeScope.Var('wj_peer_amount').GetValue|0]金币，便让他把凭据放近些。\n\n这笔钱系于食邑的营建与发展，即便当地改换领主，爵禄仍可依制核发。我将来路与数目核过，才把凭据交回。此前几项一直拖着未定的用度，如今总算又有了腾挪余地。\n\n钱已经入账，侍者仍问还有何事。我挥手让他退下，目光却又落回方才那份开支文书。新得的进项，大概也清闲不了多久。"
 WJ_peer_ack:0 "知悉"
 SanGong_SeparatedCloseKin_modifier:0 "近宗支"
