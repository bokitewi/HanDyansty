 WJ_peer_grant_failed:0 "册封未成"
 WJ_peer_grant_failed_desc:0 "册书将成之时，有司来报：所择之地已另有所属，或是受封之人的情形有了变化，这道册命终究颁不下去。\n\n此番未曾有所耗费。你可以另择一地，也可以就此作罢。"
 WJ_peer_inherited_desc:0 "先人的册书与印绶，如今交到了你的手上。#high [ROOT.Char.Custom('WJ_PeerName')]#!这个爵号，连同[ROOT.Char.MakeScope.Var('wj_peer_food').Title.GetBaseNameNoTierNoTooltip]的岁禄，从此由你承袭。\n\n家中老仆把旧册捧出来，指着上面一代代的名字给你看。名字换了几回，爵号却始终是这一个。\n\n往后有人提起你的家门，先说出口的，大概仍是这几个字。"
 WJ_peer_grant_interaction_desc:0 "以天子之命议定爵等与食邑，宗室资格、爵籍和费用均按天子计算。君权旁落时由丞相代行；天子资源不足，可逐项勾选补足差额。取消册封不扣费。"
 WJ_peer_revoke_interaction_desc:0 "收回爵号与食邑岁禄，不夺实地。天子亲办须君权至少2级且无君权旁落；失权天子的丞相代办不受君权门槛。王爵：800威望、500金币、200影响力；侯与公主：500威望、300金币、100影响力。费用先用天子资源；不足项目可勾选由丞相补差。"
 WJ_peer_revoke_authority_tt:0 "君权至少为2级"
 WJ_peer_revoke_effect_tt:0 "褫夺目标当前爵位，收回食邑岁禄并解除爵源占用；不移除其官职、家族或实际领地。"
 SanGong_SeparatedCloseKin_modifier_desc:0 "此家出自皇室近支，虽已别立门户，仍在宗亲之列。"

 WJ_peer_cover_gold:0 "由我补足金币差额"
 WJ_peer_cover_prestige:0 "由我补足威望差额"
 WJ_peer_cover_piety:0 "由我补足虔诚差额"
 WJ_peer_cover_influence:0 "由我补足影响力差额"
