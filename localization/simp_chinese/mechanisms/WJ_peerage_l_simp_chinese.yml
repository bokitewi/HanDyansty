 WJ_peer_grant_failed_desc:0 "授封对象、封地占用与归属，或本人士族头衔的最终检查未通过。本次未扣取册封费用，也未绑定爵位。可以返回上一级重新选择，或取消册封；若刚建立了家族分支，该分支仍然保留。"
