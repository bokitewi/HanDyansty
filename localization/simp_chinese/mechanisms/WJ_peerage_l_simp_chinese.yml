l_simp_chinese:
 WJ_peerage_trait:0 "世袭爵位"
 WJ_peerage_trait_desc:0 "该角色受天子策命，列于爵位，坐食封邑之禄。"
 WJ_peer_grant_interaction:0 "策命封爵"
 WJ_peer_open_tt:0 "开列封地，为此人议定爵等与食邑"
 WJ_peer_choose_rank_tt:0 "议定爵等，再择封号与食邑。"
 WJ_peer_choose_place_tt:0 "若是州郡，便入其中细择；若是可封之地，即以此颁诏册封。"
 WJ_peer_navigation_tt:0 "翻检舆籍，另择他处。"
 WJ_peer_cancel_tt:0 "此番册封暂且作罢，一无所授，亦无所费。"
 WJ_peer_revoke_interaction:0 "褫夺爵位"
 WJ_peer_designate_interaction:0 "指定袭爵人"
 WJ_peer_rank_desc:0 "你要为[ROOT.Char.MakeScope.Var('wj_peer_target').Char.GetFirstNameNoTooltip]议定爵号。功臣以勋业受爵，宗女以亲谊封为公主。爵有其号，食有其邑，受封者却不领其地，原任官职也不因此改易。"
 WJ_peer_pick_title:0 "择地册封"
 WJ_peer_pick_desc:0 "有司摊开舆图与簿籍，将尚可分封的州郡县邑一一列出。封号与食邑一经择定，册封的诏书便可颁下。"
 WJ_peer_next:0 "下一页"
 WJ_peer_back:0 "返回上一级"
 WJ_peer_restart:0 "重选爵等"
 WJ_peer_confirm_title:0 "颁下封爵诏命"
 WJ_peer_confirm:0 "正式授予"
 WJ_peer_awarded:0 "封爵诏命"
 WJ_peer_inherited:0 "承袭爵位"
 WJ_peer_awarded_desc:0 "册书送到，你先听完宣读，才把它接过来。#high [ROOT.Char.Custom('WJ_PeerName')]#!几个字落在眼前，岁禄则系于[ROOT.Char.MakeScope.Var('wj_peer_food').Title.GetBaseNameNoTierNoTooltip]，往后的称谓与家用，都有了新的凭据。\n\n侍者问册书该收在何处，你一时没有回答，又把新的称谓看了一遍。往后来人递上名刺、谈起家门，大概都要先添上这几个字了。\n\n食邑只供岁禄，那里并不因此归你治理，你原有的官职与封地也一切如旧。可把册书合上时，你仍觉得它与案上其他东西有些不同。"
 WJ_peer_removed:0 "爵位已除"
 WJ_peer_removed_desc:0 "处分的文书已经读完，书吏却仍站在案前，等你确认往后的称谓。你这才看见他重新誊过的名册：旧日爵号所在之处，已经空了。\n\n有些称呼听惯了，竟会忘了它也能被收回。食邑与爵禄一并革除，家中的用度和后人的打算，都不能再照旧盘算。旁人若仍以旧称相呼，只会让这一处空白更加刺眼。\n\n你让他把文书留下。官职与封地并未因此变动，该送来的公事明日照样会送来；只是那些文书的开头，再也不能写原先那几个字了。"
 WJ_peer_income:0 "食邑岁禄"
 WJ_peer_income_desc:0 "暮色入市，酒旗在檐下轻摇。临窗的案几刚温好一壶酒，[wj_peer_income_food.GetName]的计簿便送到了。我拂去封泥上的尘土，展开竹简；这一年的[wj_peer_income|E]，都记在细密的墨迹之间。"
 WJ_peer_income_official_desc:0 "\n\n[wj_peer_income_official.GetTitledFirstName]隔案落座，先说收成，再说乡里的徭役。说到补修陂塘、备置农具处，[wj_peer_income_official.GetSheHe]的手指在简上停了停，却没有再往下说，只将账簿轻轻推到我面前。"
 WJ_peer_income_clerk_desc:0 "\n\n随簿而来的书吏逐项唱过数目，又低声说起乡里补修陂塘、备置农具的事。话到此处，他便垂手候着，只留案上的酒气缓缓升起。"
 WJ_peer_income_close_desc:0 "\n\n府中自有府中的用度，乡里也有乡里的难处。我看了一眼简末尚空的签押处，将笔提了起来。"
 WJ_peer_income_take_all:0 "依簿领讫，解入府库。"
 WJ_peer_income_take_half:0 "取其半，余者留济乡里。"
 WJ_peer_income_leave_all:0 "今岁之禄，悉留本邑。"
 WJ_peer_income_void:0 "此簿须重核，暂且封存。"
 WJ_peer_income_void_tt:0 "本次岁禄已经处理，或爵籍、食邑已变；不再发放金钱或增益。"
 WJ_peer_income_settled:0 "岁禄落簿"
 WJ_peer_income_result_full_tt:0 "已领取全部本期[wj_peer_income|E]，没有附加后果。"
 WJ_peer_income_result_half_tt:0 "已领取一半本期[wj_peer_income|E]；余禄留邑，食邑所在伯爵领获得一年的小幅增益。"
 WJ_peer_income_result_relief_tt:0 "本期[wj_peer_income|E]全部留邑，食邑所在伯爵领获得一年的较高增益；在世经办官员感念此举。"
 WJ_peer_half_relief_modifier:0 "分禄惠里"
 WJ_peer_half_relief_modifier_desc:0 "食邑之主留下一半岁禄，助乡民修治田亩、整备乡兵。"
 WJ_peer_full_relief_modifier:0 "尽禄济民"
 WJ_peer_full_relief_modifier_desc:0 "食邑之主尽留当岁爵禄，用于民生与乡兵，乡里因此获益。"
 WJ_peer_relief_gratitude:0 "留禄济民"
 game_concept_wj_peer_income:0 "食邑岁禄"
 game_concept_wj_peer_income_desc:0 "有效爵位所系食邑每年提供爵禄，数额沿该食邑的建设、[development|E]与爵等计算，为5至50[gold|E]。拥有爵禄不等于治理当地。\n\n岁禄结算时可以全领、领取一半，或全部留邑。全领没有附加后果；半领使食邑所在[county|E]获得一年大众好感＋5、[levies|E]规模＋5%、发展度增长＋5%；全留则分别为＋10、＋10%、＋10%，并使在世经办官员对你[opinion|E]＋15，为期五年。地方增益不叠加，同类好感不重复累加。具体所得在各选项中显示，作出选择后才结算。"
 WJ_peer_ack:0 "知悉"
