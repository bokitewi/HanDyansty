l_simp_chinese:
 hd_j16.5600.t:0 "称天王"
 hd_j16.5600.desc:0 "龟兹的金银、西域的骏马都随大军回到了姑臧。如今河西已定，诸将劝你更进一步：上承苻氏天王之号，建元改制，告诉天下河西自有其主。"
 hd_j16.5600.a:0 "即天王位，国号大凉。"
 hd_j16.5600.b:0 "暂守三河王之号。"
 hd_j16.5610.t:0 "西平王"
 hd_j16.5610.desc:0 "河西鲜卑的部众已经聚在你的大纛之下，吕氏的使者还在讨要岁贡。是时候给这份基业一个名号了：自称大都统、西平王，以白土为治所。"
 hd_j16.5610.a:0 "称西平王，定都白土。"
 hd_j16.5610.b:0 "不必急于称号。"
 hd_j16.5620.t:0 "推段业为主"
 hd_j16.5620.desc:0 "建康太守段业是个儒雅的书生，为人宽和，不擅兵事。你的部众虽强，沮渠氏起兵终究名分不足。若推段业为凉州牧，借他的名望收拢汉人士族，兵权仍在你手。"
 hd_j16.5620.a:0 "推段业为主，自领兵马。"
 hd_j16.5620.b:0 "沮渠氏自领其众。"
 hd_j16.5630.t:0 "敦煌太守"
 hd_j16.5630.desc:0 "敦煌太守出缺，郡中豪右宋繇等人联名推举你。朝廷有意顺水推舟，以你为敦煌太守，镇守西陲。"
 hd_j16.5630.a:0 "受命出守敦煌。"
 hd_j16.5630.b:0 "辞谢不就。"
 hd_j16.5640.t:0 "镇朔方"
 hd_j16.5640.desc:0 "秦主见你仪表魁伟、谈吐不凡，有意以你为安北将军，配以鲜卑、杂胡数万落，镇守朔方。朝中有人劝谏说此人不可近，但秦主不听。"
 hd_j16.5640.a:0 "受命镇守朔方。"
 hd_j16.5640.b:0 "辞谢不受。"
 hd_j16.5650.t:0 "兄终弟及"
 hd_j16.5650.desc:0 "乌孤临终有言：国家多难，宜立长君。部中耆老都看向利鹿孤，说秃发氏的规矩是兄终弟及，请你让出大位。"
 hd_j16.5650.a:0 "依先王遗命，让位于利鹿孤。"
 hd_j16.5650.b:0 "大位已定，不让。"
 hd_j16.5651.t:0 "兄终弟及"
 hd_j16.5651.desc:0 "利鹿孤病逝前把国事托付给弟弟傉檀，说他才略过人，可以保全秃发氏的基业。部中耆老请你依遗命让位。"
 hd_j16.5651.a:0 "依遗命，让位于傉檀。"
 hd_j16.5651.b:0 "大位已定，不让。"
 hd_j16.5660.t:0 "吕纂入宫"
 hd_j16.5660.desc:0 "天王尸骨未寒，太原公吕纂已带兵入宫，宫门内外都是他的人。他说国家多难，不能让一个书生守着姑臧。"
 hd_j16.5660.a:0 "交出玺绶，让位于吕纂。"
 hd_j16.5660.b:0 "据宫门死守，绝不相让。"
 hd_j16.5670.t:0 "自立于敦煌"
 hd_j16.5670.desc:0 "北边的段业与沮渠氏互相猜忌，凉州已经没有能号令诸郡的人。晋昌太守唐瑶传檄六郡，推你为大都督、凉公，宋繇也劝你早做决断。"
 hd_j16.5670.a:0 "自称凉公，建元庚子。"
 hd_j16.5670.b:0 "仍守太守之职。"
 hd_j16.5680.t:0 "吕超请立吕隆"
 hd_j16.5680.desc:0 "吕纂醉后被杀，宫中大乱。吕超手握禁兵，说他的兄长吕隆素有人望，请你把位子交给吕隆，以安人心。"
 hd_j16.5680.a:0 "让位于吕隆。"
 hd_j16.5680.b:0 "拒之，严守宫禁。"
 hd_j16.5681.t:0 "番禾之谋"
 hd_j16.5681.desc:0 "番禾太守吕超擅自出兵，你召他问罪，他却与兄长吕隆往来密切。宫中有人劝你小心：吕超手下的人已经混进了禁兵，不如趁早把位子让给吕隆，保全性命。"
 hd_j16.5681.a:0 "退位让贤，交国于吕隆。"
 hd_j16.5681.b:0 "我是天王，谁敢动我？"
 hd_j16.5690.t:0 "除段业"
 hd_j16.5690.desc:0 "段业对沮渠氏越来越猜忌，听说他想借故除掉男成。与其坐等，不如反客为主：先让段业杀男成，再以为男成报仇为名起兵，把凉州真正收归沮渠氏。"
 hd_j16.5690.a:0 "行此计，除去段业。"
 hd_j16.5690.b:0 "名分要紧，留着段业。"
 hd_j16.5700.t:0 "丘豆伐可汗"
 hd_j16.5700.desc:0 "漠北诸部已经尽数归附，高车诸姓也被你远远赶开。部众请你立号可汗，号丘豆伐，意为驾驭开张，从此柔然有了自己的君长。"
 hd_j16.5700.a:0 "立号丘豆伐可汗。"
 hd_j16.5700.b:0 "暂不立号。"
 hd_j16.5710.t:0 "东迁酒泉"
 hd_j16.5710.desc:0 "敦煌偏在西陲，北凉的兵马却一年年逼近。群臣建议把都城东迁酒泉，靠近前线，也便于经营东方。同时不妨与沮渠氏通好，先求几年安定。"
 hd_j16.5710.a:0 "迁都酒泉，与北凉通好。"
 hd_j16.5710.b:0 "仍以敦煌为根本。"
 hd_j16.5720.t:0 "复称凉王"
 hd_j16.5720.desc:0 "姚弼率秦军西来，在姑臧城下被你击退。长安的使者再来，口气已大不如前。姚兴自顾不暇，关中多事，你奉秦正朔、去王号也已经四年。诸将劝你复称凉王，不再受秦节制。"
 hd_j16.5720.a:0 "复称凉王，不再奉秦正朔。"
 hd_j16.5720.b:0 "仍为秦臣。"
 hd_j16.5730.t:0 "复国"
 hd_j16.5730.desc:0 "你在长安寄人篱下已有多年，秦主日渐衰老，关中人心浮动。旧部在苑川还等着你。这正是回去收拾旧山河的时候。"
 hd_j16.5730.a:0 "举众西归，复称秦王。"
 hd_j16.5730.b:0 "仍留秦为臣。"
 hd_j16.5740.t:0 "图姑臧"
 hd_j16.5740.desc:0 "姑臧是凉州的根本，如今却在秃发氏手里。傉檀连年用兵，国中疲敝，正是夺取姑臧的好时机。"
 hd_j16.5740.a:0 "发兵东进，夺取姑臧。"
 hd_j16.5740.b:0 "再等一等。"
 hd_j16.5741.t:0 "沮渠兵至"
 hd_j16.5741.desc:0 "北凉蒙逊大举东来，前锋已经逼近姑臧。城中粮草不多，人心惶惶。"
 hd_j16.5741.a:0 "整军迎敌。"
 hd_j16.5742.t:0 "入姑臧"
 hd_j16.5742.desc:0 "姑臧已经在你手中。群臣请你迁都于此，称河西王，从此号令整个河西。"
 hd_j16.5742.a:0 "迁都姑臧，称河西王。"
 hd_j16.5742.b:0 "不必迁都。"
 hd_j16.5750.t:0 "斛律继立"
 hd_j16.5750.desc:0 "丘豆伐可汗去世，其子年幼，部众推举可汗之弟斛律继位，请你让出可汗之位。"
 hd_j16.5750.a:0 "让位于斛律。"
 hd_j16.5750.b:0 "不让。"
 hd_j16.5751.t:0 "大檀继立"
 hd_j16.5751.desc:0 "斛律死后，步鹿真趁乱夺位，又被大檀所杀。大檀素得部众之心，诸部都请他为可汗，要你让位。"
 hd_j16.5751.a:0 "让位于大檀。"
 hd_j16.5751.b:0 "不让。"
 hd_j16.5760.t:0 "炽磐继立"
 hd_j16.5760.desc:0 "乾归遇害，凶手是他的侄子公府。太子炽磐正从枹罕赶回，诸将都愿奉他为主，讨伐公府。"
 hd_j16.5760.a:0 "奉炽磐为主。"
 hd_j16.5760.b:0 "不让。"
 hd_j16.5770.t:0 "统万城"
 hd_j16.5770.desc:0 "叱干阿利督工营建的新都已经落成，城墙蒸土筑成，锥刺不入。你为它取名统万，意为统一天下、君临万邦。"
 hd_j16.5770.a:0 "迁都统万。"
 hd_j16.5770.b:0 "暂不迁都。"
 hd_j16.5780.t:0 "袭乐都"
 hd_j16.5780.desc:0 "傉檀率主力西征乙弗，国中空虚，只留太子虎台守乐都。这是一举吞并南凉的机会。"
 hd_j16.5780.a:0 "发兵袭取乐都。"
 hd_j16.5780.b:0 "再等一等。"
 hd_j16.5781.t:0 "西秦兵至"
 hd_j16.5781.desc:0 "西秦大军压境，乐都告急。"
 hd_j16.5781.a:0 "整军迎敌。"
 hd_j16.5790.t:0 "灞上称帝"
 hd_j16.5790.desc:0 "长安已经落入你手。群臣在灞上筑坛，请你即皇帝位，以统万为北都，长安为南台。"
 hd_j16.5790.a:0 "即皇帝位。"
 hd_j16.5790.b:0 "暂不称帝。"
 hd_j16.5795.t:0 "诱李歆"
 hd_j16.5795.desc:0 "你佯装南伐西秦，暗中屯兵川岩。西凉李歆年少轻躁，若听说北凉空虚，必定出兵来攻，正好设伏破之。"
 hd_j16.5795.a:0 "依计行事，伐西凉。"
 hd_j16.5795.b:0 "再等一等。"
 hd_j16.5796.t:0 "北凉来犯"
 hd_j16.5796.desc:0 "北凉大军突然出现在境内，蒙逊南伐原来是诈。"
 hd_j16.5796.a:0 "整军迎敌。"
 hd_j16_duanye_mingyi_modifier:0 "北凉名义之主"
 hd_j16_duanye_mingyi_modifier_desc:0 "沮渠氏推戴的凉州牧，名为一国之主，兵权却在别人手里。"
 hd_j16_xia_duoma_modifier:0 "夺马"
 hd_j16_xia_duoma_modifier_desc:0 "截下柔然献给秦主的八千匹马，骑兵由此大盛。"
 hd_j16_rouran_khagan_modifier:0 "丘豆伐可汗"
 hd_j16_rouran_khagan_modifier_desc:0 "立号可汗，漠北诸部尽数归附。"
 hd_j16_duanye_nominal_opinion:0 "名义之主"
 hd_j16_xiliang_tonghao_opinion:0 "西凉北凉通好"
 hd_j16_n2_army_guzang_name:0 "蒙逊所部"
 hd_j16_n2_army_ledu_name:0 "炽磐所部"
 hd_j16_n2_army_xiliang_name:0 "北凉伏兵"
