 # 89 年剧本「燕然勒石」。计划见 /mnt/project-files/89窦宪北伐剧本_计划.md。
 bm_hd_89: "燕然勒石"
 bm_hd_89_desc: "章和二年二月，章帝崩于章德前殿，十岁的太子刘肇即位，窦太后临朝称制。太后的长兄窦宪以侍中掌机密，因为嫉恨都乡侯刘畅得宠，竟遣刺客把他杀在屯卫之中。事发之后，窦宪被禁闭在内宫，他上书自请出击北匈奴，以赎死罪。\n\n恰在此时，南单于屯屠何上书朝廷：北庭连年饥蝗，又被鲜卑杀了优留单于，八十一部二十余万人南来投降，正是一举荡平北庭的时机。朝中三公九卿连章谏阻，太后不听，拜窦宪为车骑将军，以执金吾耿秉为副，发北军五校、缘边十二郡骑士与羌胡兵出塞。\n\n永元元年正月，诏书已下，大军在朔方集结。远在西域的将兵长史班超，仍守着疏勒盘橐城，等着中原的消息。\n\n#bold 这一年夏天，汉军将在燕然山上刻下班固的铭文；三年之后，窦氏满门将在北宫的诏狱前覆灭。#!"

 bm_hd_89_dou_xian: "窦宪"
 bm_hd_89_dou_xian_subheading: "车骑将军，北伐主帅"
 bm_hd_89_dou_xian_desc: "字伯度，扶风平陵人，窦融的曾孙。父亲窦勋早年死于狱中，妹妹入宫为后，窦氏才重新显赫起来。他性情果急，睚眦之怨无不报复，连沁水公主的园田都敢强占。如今他戴罪出征，要用北庭的人头洗清刘畅的血；一旦得胜，洛阳城里就再没有人能压得住他。"

 bm_hd_89_liu_zhao: "刘肇"
 bm_hd_89_liu_zhao_subheading: "天子（窦太后临朝）"
 bm_hd_89_liu_zhao_desc: "章帝第四子，生母梁贵人被窦后构陷而死，他由窦后抚养长大，自己并不知情。十岁登基，朝政出于太后，机密出于窦宪，连诏书都要经窦氏兄弟之手。他身边只有一个沉默的中常侍郑众。总有一天，他会知道自己的生母是谁，也会知道该相信谁。"

 bm_hd_89_tun_tu_he: "屯屠何"
 bm_hd_89_tun_tu_he_subheading: "休兰尸逐侯鞮单于，南匈奴"
 bm_hd_89_tun_tu_he_desc: "醢落尸逐鞮单于比之子，章和二年立为南单于，单于庭在西河美稷。南匈奴内附四十年，与北庭世为仇敌。北庭新乱、降众南来，他看见了一统匈奴的机会，上书请与汉军并力北征。若北庭灭亡，漠北的草场将重归单于之子孙；只是汉家天子未必愿意看到一个强大的单于。"

 bm_hd_89_bei_chanyu: "北单于"
 bm_hd_89_bei_chanyu_subheading: "北匈奴单于（史失其名）"
 bm_hd_89_bei_chanyu_desc: "优留单于被鲜卑击杀之后，他在一片混乱中被推上单于之位。连年饥蝗，部众不断南逃，东有鲜卑，南有汉军与南匈奴。燕然山下的单于庭仍然悬着冒顿传下的旗帜，可是能为它拼死的人，已经一年比一年少了。"

 bm_hd_89_ban_chao: "班超"
 bm_hd_89_ban_chao_subheading: "将兵长史，屯疏勒"
 bm_hd_89_ban_chao_desc: "字仲升，班彪少子，班固之弟。少时为官府抄书，投笔叹息：大丈夫当效傅介子、张骞立功异域。永平十六年随窦固出征，带着三十六人深入西域，在鄯善夜斩匈奴使者。十多年来，他以疏勒为根本，收于阗，破莎车，西域南道已为汉有。北道的龟兹、焉耆，仍站在匈奴一边。"

 bm_hd_89_deng_xun: "邓训"
 bm_hd_89_deng_xun_subheading: "护羌校尉，屯湟中"
 bm_hd_89_deng_xun_desc: "字平叔，南阳新野人，高密侯邓禹第六子。章和二年接任护羌校尉，他不用屠戮立威，而是开门收养被烧当羌驱逐的小月氏胡与湟中诸羌，羌胡感恩，愿为他效死。烧当羌迷唐仍盘踞在大小榆谷，等着他出兵。"

 bm_hd_89_mi_tang: "迷唐"
 bm_hd_89_mi_tang_subheading: "烧当羌首领"
 bm_hd_89_mi_tang_desc: "烧当羌豪迷吾之子。章和元年，迷吾被护羌校尉张纡在会盟的酒席上毒杀，迷唐从此与汉家结下血仇。他据有大小榆谷，联结诸种，屡寇金城、陇西。邓训来了以后，羌胡人心渐渐向汉，他不得不退往赐支河曲，图谋卷土重来。"

 bm_hd_89_gong: "宫"
 bm_hd_89_gong_subheading: "高句丽太祖王"
 bm_hd_89_gong_desc: "高句丽第六代君主，七岁即位，在位已三十余年。他征服东沃沮，臣服周边诸部，国势空前强盛。辽东、玄菟的汉家城塞就在眼前；中原若是有事，便是他西进的时机。"

