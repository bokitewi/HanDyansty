 # 修正
 hd_89_yanran_modifier: "燕然勒石"
 hd_89_yanran_modifier_desc: "登燕然山，刻石纪功，令班固作铭。从此以后，再没有人敢提刘畅的事。"
 hd_89_beiting_modifier: "北庭离散"
 hd_89_beiting_modifier_desc: "稽落山一败，部众或降或逃，单于庭四周只剩下最后的亲族。"
 hd_89_duhu_modifier: "西域都护"
 hd_89_duhu_modifier_desc: "复置西域都护，居龟兹它乾城，五十余国的质子都要经他的手送往洛阳。"
 hd_89_shishi_modifier: "失势"
 hd_89_shishi_modifier_desc: "交出大将军印绶，退归封地。门前的车马，一夜之间少了大半。"

 # 节点事件
 hd_89.0110.t: "出塞"
 hd_89.0110.desc: "六月，朔方塞外的草已经长高了。北军五校、缘边诸郡的骑士和羌胡义从都已集结在鸡鹿塞下，南单于的使者也来约定会师的日期。只要一声令下，大军便可出塞，直指涿邪山。"
 hd_89.0110.a: "出鸡鹿塞，北击单于"
 hd_89.0110.b: "时机未到，暂缓出兵"
 hd_89.0115.t: "会师涿邪山"
 hd_89.0115.desc: "汉军已经出塞，使者带来车骑将军的军令：各部按约出塞，会师于涿邪山下，合击北庭。"
 hd_89.0115.a: "率部出塞，如约会师"
 hd_89.0115.b: "按兵不动"
 hd_89.0210.t: "金微山"
 hd_89.0210.desc: "北单于在稽落山大败之后，仍带着残部游荡在金微山一带。有人说穷寇莫追，也有人说除恶务尽，若不趁此时一举犁庭，北庭迟早会恢复元气。精骑八百可以从居延塞出发，绕行五千余里，直捣单于的营帐。"
 hd_89.0210.a: "出居延塞，直捣金微山"
 hd_89.0210.b: "北庭已残，不必穷追"
 hd_89.0230.t: "金微山之败"
 hd_89.0230.desc: "汉军从天而降，母亲阏氏和名王以下五千余人被俘。东边的部落已经开始改称鲜卑，向新的主人献上马匹。你可以带着最后的亲族向西远走，寻找新的草场；也可以遣使入塞，向汉家天子称臣。"
 hd_89.0230.a: "向西远走，另寻草场"
 hd_89.0230.b: "遣使入塞，奉汉为宗主"
 hd_89.0310.t: "西域都护"
 hd_89.0310.desc: "北庭溃败的消息传到天山南北，姑墨、温宿的使者已经悄悄去见班超。汉家复置西域都护，大军就在疏勒。是继续倚靠已经不存在的匈奴，还是遣子入侍，奉汉为宗主？"
 hd_89.0310.a: "遣子入侍，奉汉为宗主"
 hd_89.0310.b: "不降，据城自守"
 hd_89.0320.t: "款塞"
 hd_89.0320.desc: "兄长已经不知所终，你带着残部停在蒲类海边。汉军的使者说：只要遣使款塞、奉汉为宗主，天子便可以立你为单于，就像当年立南单于一样。"
 hd_89.0320.a: "遣使款塞，受汉印绶"
 hd_89.0320.b: "宁死不做汉家的藩臣"
 hd_89.0410.t: "北宫闭门"
 hd_89.0410.desc: "窦宪班师回京，大将军府的门客塞满了洛阳。中常侍郑众在无人时低声说：窦氏兄弟与邓叠、郭举日夜往来，图谋不轨。陛下已经十四岁了，若此时不动手，以后就再没有机会。"
 hd_89.0410.a: "诏执金吾、五校勒兵，收大将军印绶"
 hd_89.0410.b: "隐忍不发"
 hd_89.0420.t: "收印绶"
 hd_89.0420.desc: "北宫闭了门，邓叠、郭举已被收捕下狱。谒者仆射手持诏书来到大将军府，要收回你的印绶，令你即日就国。门外的禁兵是天子的人，可你麾下的北军五校，也还记得燕然山上的那一天。"
 hd_89.0420.a: "交出印绶，退归封国"
 hd_89.0420.b: "起兵自保"
 hd_89.0510.t: "讨焉耆"
 hd_89.0510.desc: "龟兹、鄯善等八国的兵马已经聚在疏勒城下。焉耆王广从前与匈奴一道攻杀过都护陈睦，至今不肯降服，他拆断了苇桥，要凭借山河拒守。是时候用兵了吗？"
 hd_89.0510.a: "发八国兵，讨焉耆"
 hd_89.0510.b: "暂且安抚，不动刀兵"
 hd_89.0560.t: "城下之盟"
 hd_89.0560.desc: "汉军已经渡过了水，员渠城下尽是都护的旌旗。班超派人传话：遣子入侍、奉汉为宗主，可以保全宗庙；不然，左侯元孟就在军中，随时可以立为新王。"
 hd_89.0560.a: "遣子入侍，奉汉为宗主"
 hd_89.0560.b: "让位于元孟，出城归降"

 # 天下通报
 hd_89.0610.t: "大军出塞"
 hd_89.0610.desc: "朔方传来消息：[hd_news_a.GetName]统领北军五校与缘边义从出鸡鹿塞，南单于出满夷谷，度辽将军出稒阳塞，三路会于涿邪山，北击[hd_news_b.GetName]。草原上的部落开始收拢牛羊，没人知道这一次汉军会走多远。"
 hd_89.0615.t: "燕然勒石"
 hd_89.0615.desc: "汉军在稽落山大破北匈奴，斩首一万三千级，降者二十余万。[hd_news_a.GetName]登上燕然山，命中护军班固作铭，刻石而还：铄王师兮征荒裔，剿凶虐兮截海外。消息传回洛阳，大将军的门前车马如流。"
 hd_89.0620.t: "出居延塞"
 hd_89.0620.desc: "汉军再一次出塞，这一回从居延出发，绕行五千余里，直指金微山下[hd_news_b.GetName]的营帐。"
 hd_89.0625.t: "北单于逃走"
 hd_89.0625.desc: "金微山一战，北单于的母亲阏氏被俘，名王以下五千余人被斩。单于本人逃走，不知所在。漠北的草场空了出来，东边的鲜卑正一部一部地迁进去。"
 hd_89.0630.t: "复置西域都护"
 hd_89.0630.desc: "朝廷复置西域都护、骑都尉、戊己校尉，以[hd_news_a.GetName]为都护。龟兹、姑墨、温宿相继归降，侍子被送往洛阳。距离陈睦被杀、都护覆没，已经十六年了。"
 hd_89.0640.t: "诛窦"
 hd_89.0640.desc: "洛阳北宫闭门，执金吾与五校的兵马列满宫墙。[hd_news_a.GetName]下诏收大将军[hd_news_b.GetName]印绶，遣其就国，随即迫令自杀；邓叠、郭举等人下狱处死，窦氏宾客奔走四散。中常侍郑众以功封侯，宦官从此用权。"
 hd_89.0650.t: "讨焉耆"
 hd_89.0650.desc: "[hd_news_a.GetName]发龟兹、鄯善等八国之兵七万人，讨伐焉耆、危须、尉犁。西域最后一个拒不归附的国家，已经被围在群山之中。"
