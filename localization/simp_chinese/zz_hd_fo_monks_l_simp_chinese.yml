 hd_fo_bio_she_mo_teng:0 "中天竺沙门，善风仪，随汉使以白马驮经东来。"
 hd_fo_bio_zhu_fa_lan:0 "天竺学者之师，诵经论数万章，不顾学徒挽留，间行而来。"
 hd_fo_bio_an_shi_gao:0 "安息王子，让国于叔，出家东游，通医方异术、七曜五行。"
 hd_fo_bio_zhi_lou_jia_chen:0 "月氏沙门，操行纯深，以精勤著称，传大乘般若之学。"
 hd_fo_bio_zhu_fo_shuo:0 "天竺沙门，携《道行经》至洛，与支谶共译。"
 hd_fo_bio_an_xuan:0 "安息优婆塞，经商至洛，以功号骑都尉，性贞白而深沉。"
 hd_fo_bio_yan_fo_tiao:0 "临淮人，少年颖悟，敏而好学，剃度为汉人沙门之始。"
 hd_fo_bio_zhi_yao:0 "月氏沙门，于洛阳译《成具光明定意经》。"
 hd_fo_bio_kang_ju:0 "康居沙门，心存游化，译文言直理旨，不加润饰。"
 hd_fo_bio_kang_meng_xiang:0 "康居沙门，译《中本起经》，文辞弘赡雅畅。"
 hd_fo_bio_mou_zi:0 "苍梧学者，博通经传，兼研老子，避乱交趾，作《理惑论》答难。"
 hd_fo_bio_zhi_qian:0 "月氏后裔，生于汉地，通六国语，博览经籍，人称「支郎眼中黄」。"
 hd_fo_bio_wei_qi_nan:0 "天竺沙门，本事火神，见沙门神术而改宗，携《法句经》而来。"
 hd_fo_bio_kang_seng_hui:0 "先世康居，父商于交趾，设像行道，誓求舍利以示吴主。"
 hd_fo_bio_tan_ke_jia_luo:0 "中天竺沙门，幼而才悟，善四韦陀，欲立中土受戒之法。"
 hd_fo_bio_kang_seng_kai:0 "外国沙门，嘉平末至洛阳，传译《无量寿经》。"
 hd_fo_bio_zhu_shi_xing:0 "颍川人，坚正方直，劝阻不能移其志，誓往西域求经。"
 hd_fo_bio_zhu_fa_hu:0 "世居敦煌的月氏人，通西域三十六国语，号「敦煌菩萨」。"
 hd_fo_bio_bo_yuan:0 "河内人，聪敏，日诵八九千言，筑精舍于长安讲经。"
 hd_fo_bio_fo_tu_cheng:0 "西域沙门，善诵神咒，能知吉凶，欲以道术化导胡主。"
 hd_fo_bio_zhu_dao_qian:0 "琅琊王氏子弟，风姿堂堂，舍朱门而入空门。"
 hd_fo_bio_dao_an:0 "常山人，形貌甚陋而过目成诵，志在整饬僧团。"
 hd_fo_bio_zhi_dun:0 "陈留人，精于清谈，注《逍遥游》，名士争与之交。"
 hd_fo_bio_hui_yuan:0 "雁门人，少为儒生，闻道安讲经而叹「儒道九流，皆糠秕耳」。"
 hd_fo_bio_jiu_mo_luo_shi:0 "父天竺人，母龟兹王妹，七岁出家，日诵千偈。"
 hd_fo_bio_seng_zhao:0 "京兆人，家贫以替人抄书为业，遍读经史，闻罗什在凉州而往从之。"
 hd_fo_bio_fa_xian:0 "平阳人，年幼出家，慨律藏残缺，立志西行。"
 hd_fo_bio_dao_sheng:0 "钜鹿人，幼而颖悟，十五登座讲经。"
 hd_fo_bio_tan_wu_chen:0 "中天竺沙门，号「大咒师」，携《大般涅槃经》前分而来。"
 hd_fo_bio_tan_yao:0 "凉州沙门，灭佛之时坚守法服，誓待复兴。"
 hd_fo_bio_ba_tuo:0 "天竺沙门，性爱幽栖，来游北土。"
 hd_fo_bio_pu_ti_liu_zhi:0 "北天竺沙门，遍通三藏，志在弘法。"
 hd_fo_bio_pu_ti_da_mo:0 "南天竺沙门，渡海至南越，传壁观禅法。"
 hd_fo_bio_hui_ke:0 "虎牢人，少为儒生，博览诗书，后弃俗出家。"
 hd_fo_bio_bao_zhi:0 "神异之僧，赤足锦袍，杖头挂剪刀与镜，言多预兆。"
 hd_fo_bio_seng_you:0 "建业人，入定林寺，精于律学，擅造佛像。"
 hd_fo_bio_tan_luan:0 "雁门人，少游五台，学四论。"
 hd_fo_bio_zhen_di:0 "西天竺优禅尼人，携梵本二百四十夹渡海而来。"
 hd_fo_bio_hui_si:0 "武津人，十五出家，专修禅定。"
 hd_fo_bio_zhi_yi:0 "荆州华容人，十八出家，聪慧过人。"
 hd_fo_bio_ji_zang:0 "安息后裔，生于金陵，貌象西梵而言实东华。"
 hd_fo_bio_xin_xing:0 "魏郡人，十七出家，以苦行著称。"
 hd_fo_bio_dao_xin:0 "河内人，少年即从僧璨习禅。"
 hd_fo_bio_du_shun:0 "雍州万年人，十八出家，以神异治病著称。"
 hd_fo_bio_dao_xuan:0 "吴兴人，十六落发，专精律部。"
