 hd_unity.0001.t: "族内倾轧"
 hd_unity.0001.desc: "族中人心不齐，各房为了职司、田产与荫补争执不休，[hd_unity_branch.GetShortUIName]一房闹得尤凶。私下串联、互相攻讦之声，已传到了你的耳中。再不处置，只怕家丑就要外扬。"
 hd_unity.0001.a: "召集宗亲，居中调停。"
 hd_unity.0001.b: "[hd_unity_branch.GetShortUIName]一房所言有理。"
 hd_unity.0001.c: "家务琐事，不必过问。"
 hd_unity.0002.t: "树大招风"
 hd_unity.0002.desc: "你家上下同心，宗族兴旺，子弟遍布朝堂州郡。然而盛极易衰，[hd_unity_liege.GetShortUIName]近来对你家多有疑忌，朝中已有人借题发挥：“强宗大族，不可不防。”"
 hd_unity.0002.a: "约束子弟，敛迹自守。"
 hd_unity.0002.b: "献上厚礼，以表忠心。"
 hd_unity.0002.c: "清者自清，何须理会。"
 hd_unity.0003.t: "分门立户"
 hd_unity.0003.desc: "族内离心已久，[hd_unity_branch.GetShortUIName]一房屡次提出要别立门户、自开宗支。强行拦阻，恐伤骨肉之情；放任不管，家族又将日渐衰微。"
 hd_unity.0003.a: "允其分门，另立宗支。"
 hd_unity.0003.b: "家法在此，不许分家。"
 hd_unity.0003.c: "此事且搁置不论。"
