l_simp_chinese:
 # 历史入侵 × 两晋十六国统一史实线（p5-C）：新条目西燕、南燕、孙恩的规则与事件文本；A6-F10 国号名字键（数据侧在 zz_hd_hi_data_effects.txt）
 rule_hd_hi_rule_murongchong:0 "历史入侵·西燕慕容冲"
 setting_hd_hi_murongchong_on:0 "#high 开启#!"
 setting_hd_hi_murongchong_on_desc:0 "384 年至 390 年间，慕容冲会看准时势起兵；两晋十六国剧本中改在前秦瓦解之后依次登场。时势不利时，他会舍下根基，带着旧部和名分在外伺机而动。"
 setting_hd_hi_murongchong_off:0 "#high 关闭#!"
 setting_hd_hi_murongchong_off_desc:0 "西燕慕容冲不会发生。"
 rule_hd_hi_rule_murongde:0 "历史入侵·南燕慕容德"
 setting_hd_hi_murongde_on:0 "#high 开启#!"
 setting_hd_hi_murongde_on_desc:0 "397 年至 405 年间，慕容德会看准时势起兵；两晋十六国剧本中改在河北燕都失守之后起事。时势不利时，他会舍下根基，带着旧部和名分在外伺机而动。"
 setting_hd_hi_murongde_off:0 "#high 关闭#!"
 setting_hd_hi_murongde_off_desc:0 "南燕慕容德不会发生。"
 rule_hd_hi_rule_sunen:0 "历史入侵·孙恩之乱"
 setting_hd_hi_sunen_on:0 "#high 开启#!"
 setting_hd_hi_sunen_on_desc:0 "399 年至 402 年间，天师道首领孙恩会看准时势起兵；时势不利时，他会舍下根基，带着旧部和名分在外伺机而动。"
 setting_hd_hi_sunen_off:0 "#high 关闭#!"
 setting_hd_hi_sunen_off_desc:0 "孙恩之乱不会发生。"
 hd_hi.murongchong.t:0 "西燕起兵"
 hd_hi.murongchong.ctx:0 "燕亡之后，慕容冲兄弟随族人迁入关中，寄人篱下多年。如今秦军新败，关中的鲜卑旧部又在私下往来，只等有人登高一呼。"
 hd_hi.murongchong.rise:0 "\n\n慕容泓先在华阴聚众，慕容冲随即举兵相应。关中鲜卑闻风而起，旌旗直指长安。"
 hd_hi.murongchong.wait:0 "\n\n关中守备尚严，慕容冲只能隐忍，在鲜卑旧部中暗暗收拢人心。"
 hd_hi.murongde.t:0 "南燕立国"
 hd_hi.murongde.ctx:0 "慕容德是慕容垂的幼弟，久历战阵，素有威名。燕都中山失守，河北诸郡人心离散，他手下的部众却还完整。"
 hd_hi.murongde.rise:0 "\n\n慕容德率部南渡黄河，据滑台称燕王，随后东取青齐，以广固为都。"
 hd_hi.murongde.wait:0 "\n\n形势未明，慕容德只得暂守现地，收拾溃散的燕兵，等待南下的时机。"
 hd_hi.sunen.t:0 "孙恩之乱"
 hd_hi.sunen.ctx:0 "孙恩出身琅琊孙氏，世奉五斗米道。叔父孙泰被朝廷诛杀后，他逃入海岛，信众暗中接济，聚集的人越来越多。"
 hd_hi.sunen.rise:0 "\n\n孙恩率众从海上登岸，攻下会稽，三吴各郡的信众杀官响应，旬日之间聚众数十万。"
 hd_hi.sunen.wait:0 "\n\n江东兵马尚强，孙恩只能留在海岛上，等待朝廷与地方生隙的时机。"
