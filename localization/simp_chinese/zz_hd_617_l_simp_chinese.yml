l_simp_chinese:
 # 617 年剧本「晋阳起兵」。计划见 /mnt/project-files/617隋末群雄剧本_计划.md。
 bm_hd_group_suitang: "隋末唐初"
 bm_hd_617: "晋阳起兵"
 bm_hd_617_desc: "大业十三年。三征高丽之后，天下盗贼蜂起，炀帝去年秋天南幸江都，再不肯北还。越王杨侗留守东都，代王杨侑留守西京，诏令出了江都，就只到得这两座城。\n\n瓦岗的李密据洛口仓，号魏公，数十万众围着东都；窦建德在乐寿称长乐王，薛举在金城称西秦霸王，刘武周、梁师都北面称臣突厥，林士弘在豫章称帝。五月甲子，太原留守、唐国公李渊收副留守王威、高君雅下狱，在晋阳举兵。\n\n#bold 隋室的天下，还剩不到一年。#!"
 bm_hd_617_li_yuan: "李渊"
 bm_hd_617_li_yuan_subheading: "唐国公、太原留守"
 bm_hd_617_li_yuan_desc: "陇西李氏，七岁袭封唐国公，是炀帝的表兄。他在太原手握重兵，北边是称臣突厥的刘武周，西南是隋室重镇河东与关中。次子世民早劝他起事，如今他终于点了头：先取西河，再西图关中。"
 bm_hd_617_li_shimin: "李世民"
 bm_hd_617_li_shimin_subheading: "唐国公次子"
 bm_hd_617_li_shimin_desc: "李渊次子，年方十九，喜结豪杰，晋阳起兵的谋划多出自他与刘文静。父亲给了他一县作根本，往后的仗，要靠他一场一场去打。"
 bm_hd_617_li_mi: "李密"
 bm_hd_617_li_mi_subheading: "魏公，据洛口"
 bm_hd_617_li_mi_desc: "关陇贵胄出身，杨玄感起兵时的谋主。事败亡命，投入翟让的瓦岗军，破张须陀、取洛口仓，开仓放粮，从者如云，翟让也推他为主。东都近在眼前，可越王的城墙比他想的更难攻。"
 bm_hd_617_dou_jiande: "窦建德"
 bm_hd_617_dou_jiande_subheading: "长乐王，据乐寿"
 bm_hd_617_dou_jiande_desc: "清河漳南人，乡里称其仗义。高士达死后他收拢余众，在河间一带站稳了脚跟，今年正月称长乐王。他善待隋朝降官，河北的士人开始到他这里来了。"
 bm_hd_617_yang_guang: "杨广"
 bm_hd_617_yang_guang_subheading: "隋炀帝"
 bm_hd_617_yang_guang_desc: "开皇之治的继承者，修东都、开运河、三征高丽。如今他滞留江都，跟着他的骁果军士多是关中人，日夜思归。天下州郡还挂着隋的旗号，可肯听命的已经不多了。"
 bm_hd_617_wang_shichong: "王世充"
 bm_hd_617_wang_shichong_subheading: "江都通守"
 bm_hd_617_wang_shichong_desc: "本姓支，西域胡人，随母改嫁冒姓王氏。他善于揣摩上意，在江都很得炀帝欢心，镇压江淮盗贼也颇有手段。东都告急，炀帝要他北上——这一去，或许就不必再回江都了。"
 bm_hd_617_xue_ju: "薛举"
 bm_hd_617_xue_ju_subheading: "西秦霸王"
 bm_hd_617_xue_ju_desc: "金城豪族，骁勇多财。四月他在金城劫了县令起兵，自号西秦霸王，枹罕、西平都已归他。长子仁杲勇冠三军，父子都盯着东面的天水和关中。"
 bm_hd_617_liu_wuzhou: "刘武周"
 bm_hd_617_liu_wuzhou_subheading: "定杨可汗，据马邑"
 bm_hd_617_liu_wuzhou_desc: "马邑鹰扬府校尉，二月杀太守王仁恭起事，破楼烦、取汾阳宫，把宫人献给突厥。始毕可汗册他为定杨可汗，他转身就在马邑称了帝。晋阳的李渊，是他南下路上的第一块石头。"
 bm_hd_617_liang_shidu: "梁师都"
 bm_hd_617_liang_shidu_subheading: "梁帝，据朔方"
 bm_hd_617_liang_shidu_desc: "朔方豪强，隋末为鹰扬郎将。二月他杀郡丞起兵，取雕阴、弘化、延安，国号梁，称臣突厥，号大度毗伽可汗。他的地盘贫瘠，却有突厥铁骑在背后撑腰。"
 bm_hd_617_du_fuwei: "杜伏威"
 bm_hd_617_du_fuwei_subheading: "江淮义军首领"
 bm_hd_617_du_fuwei_desc: "齐州章丘人，少年时与辅公祏结为刎颈之交，十六岁起兵为盗，转战江淮。今年他在历阳击败隋将陈稜，自称总管。江都就在江对岸，炀帝的骁果军却不敢出城。"
 bm_hd_617_lin_shihong: "林士弘"
 bm_hd_617_lin_shihong_subheading: "楚帝，据豫章"
 bm_hd_617_lin_shihong_desc: "鄱阳人，随操师乞起兵。操师乞战死，他接过人马，在彭蠡湖大破隋军，去年十二月称帝，国号楚。豫章、鄱阳、庐陵都已归他，北至九江，南面的岭南也在望。"
 bm_hd_617_xiao_xian: "萧铣"
 bm_hd_617_xiao_xian_subheading: "罗县令"
 bm_hd_617_xiao_xian_desc: "后梁宣帝的曾孙，萧皇后的族侄，家贫，以佣书养母。他如今只是巴陵郡一个小县的县令，可巴陵的豪杰们已经在商量，要推这位梁朝宗室出来做主。"

 hd_617_truce: "群雄并起"
 hd_617_mandate_lock_tt: "隋室尚在，群雄多奉其正朔（唐建国以后或 620 年才可终结乱世）"

