 hd_617.0110.t: "诏救东都"
 hd_617.0110.desc: "东都告急的表章一封接一封送到江都。炀帝召见[ROOT.Char.GetFirstName]，要他率江淮劲卒北上，与东都的越王合力击破李密。\n\n江都繁华，是天子身边；东都却是四战之地。北上，就是把身家押在洛阳城头。"
 hd_617.0110.a: "奉诏北上"
 hd_617.0110.b: "江都要紧，暂不北上"
 hd_617.0120.t: "西图关中"
 hd_617.0120.desc: "西河已经拿下，晋阳仓廪充实。刘文静从突厥回来，带回了始毕可汗的许诺。世民劝道：关中是天下根本，代王年幼，正可西进。\n\n可西进要过霍邑的宋老生、河东的屈突通，太原又只留元吉守着。"
 hd_617.0120.a: "誓师西进"
 hd_617.0120.b: "先固守太原"
 hd_617.0121.t: "唐公兵临长安"
 hd_617.0121.desc: "唐国公的大军渡过黄河，关中豪杰纷纷响应，连平阳公主也在鄠县聚起了一支娘子军。卫文昇已经病倒，留守诸官面面相觑。\n\n城中还有兵，也还有粮，只是不知道能守到几时。"
 hd_617.0121.a: "死守长安"
 hd_617.0121.b: "开城迎唐公"
 hd_617.0130.t: "巴陵豪杰"
 hd_617.0130.desc: "巴陵校尉董景珍等人深夜来见：天下大乱，隋室将亡，诸将商议推举首领，都说[ROOT.Char.GetFirstName]是梁朝宗室，宽厚仁爱，众望所归。\n\n县令的印绶还在案上，城外已经有人在打梁的旗号了。"
 hd_617.0130.a: "起兵复梁"
 hd_617.0130.b: "仍事隋室"
 hd_617.0160.t: "鸿门之宴"
 hd_617.0160.desc: "房彦藻、郑颋密报：翟让的兄长翟弘劝翟让自为天子，翟让也嫌[ROOT.Char.GetFirstName]夺了他的位子。瓦岗旧部只认翟让，若不早图，必生后患。\n\n翟让是推你为主的人，可一山终究容不下二虎。"
 hd_617.0160.a: "设宴除之"
 hd_617.0160.b: "念其旧恩，不忍下手"
 hd_617.0170.t: "江都之变"
 hd_617.0170.desc: "骁果军士多是关中人，久留江都，日夜思归。宇文化及、司马德戡趁众心浮动，夜里打开了宫门。\n\n宫外火光冲天，侍卫纷纷逃散。"
 hd_617.0170.a: "召集左右，抵抗乱兵"
 hd_617.0180.t: "受禅"
 hd_617.0180.desc: "长安的百官三次上表劝进，恭帝也下诏逊位，要把天命交到[ROOT.Char.GetFirstName]手中。\n\n隋室的名号还在，天下却早已不归一家。太极殿前，百官都在候着。"
 hd_617.0180.a: "即皇帝位，国号唐"
 hd_617.0180.b: "时机未到，暂不称帝"
 hd_617.0190.t: "郑王逼禅"
 hd_617.0190.desc: "王世充已经是郑王，朝中诸事都出自他的相府。今天他的使者送来了禅位的诏书底稿，只等[ROOT.Char.GetFirstName]用印。\n\n殿外站着的禁军，都是他的人。"
 hd_617.0190.a: "用印逊位"
 hd_617.0190.b: "宁死不禅"
 hd_617.0191.t: "群下劝进"
 hd_617.0191.desc: "段达、云定兴等人联名上表，说皇泰主年幼，天命已移，请郑王顺天应人。道士桓法嗣也献上了图谶，说王氏当代杨氏。\n\n皇泰主还坐在含凉殿里，殿外却全是你的兵。"
 hd_617.0191.a: "受禅即位，国号郑"
 hd_617.0191.b: "名分未定，不可操之过急"
