 # ============================================================
 # 汉文明基础兵种革新
 # ============================================================
 innovation_zgrc_han_bingfa:0 "华夏兵法"
 innovation_zgrc_han_bingfa_desc:0 "承李卫公问对之遗教，兵法教育传承不绝；唐制武备：陌刀斩马、玄甲精锐。"
 innovation_zgrc_han_wubei:0 "帝国武备"
 innovation_zgrc_han_wubei_desc:0 "锻铁技艺大进，重甲步骑成军——背嵬重步、背嵬重骑，宋室武备之极。"

 # ============================================================
 # 领地 modifier
 # ============================================================
 zgrc_rende_modifier:0 "仁德君子"
 zgrc_rende_modifier_desc:0 "义军来投，不忍驱之锋镝，仁德之名大震。"
 zgrc_gouquan_modifier:0 "苟全性命"
 zgrc_gouquan_modifier_desc:0 "兵凶战危，明哲保身。虽能安养天年，然同袍赴难之时隐忍不出，心中难安。"
