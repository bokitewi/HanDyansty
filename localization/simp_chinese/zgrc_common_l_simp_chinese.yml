 # 2026-11-01 汉地风俗 1.5.3（创意工坊 3812432062）并入的新键
 trait_zgrc_hanjia_guandai_character_desc_female:0 "鬓挽青玉金步摇，丝帛流光曳长裙；\n举止端方寸，服章映芳华。"
 trait_zgrc_hanjia_guandai_character_desc_north:0 "烈马弯刀常在手，诗书礼乐已入心；\n不愧漠北血，同铸华夏魂。"
 trait_zgrc_hanjia_guandai_character_desc_south:0 "雨林深处识王化，蛮荒亦有华夏魂；\n不坠先祖志，同为九州臣。"
 trait_zgrc_hanjia_guandai_character_desc_west:0 "丝路风沙磨不去，神州市井启新篇；\n不悔西来路，同为汉家贤。"
 trait_zgrc_hanjia_guandai_character_desc_east:0 "海东望断中原路，如今亦是画中人；\n不负祖上灵，同享礼乐春。"
 trait_zgrc_hanjia_guandai_character_desc_generic:0 "八方风土皆入夏，四海奇珍尽衣冠；\n不弃故园土，同砌华夏城。"
 trait_zgrc_shou_su_ren:0 "守俗人"
 trait_zgrc_shou_su_ren_desc:0 "恪守本俗，子嗣不入汉家。"
 trait_zgrc_shou_su_ren_character_desc_north:0 "他恪守漠北风俗，纵居汉地，子嗣亦不入汉家。"
 trait_zgrc_shou_su_ren_character_desc_south:0 "他恪守岭南风俗，纵居汉地，子嗣亦不入汉家。"
 trait_zgrc_shou_su_ren_character_desc_west:0 "他恪守西域风俗，纵居汉地，子嗣亦不入汉家。"
 trait_zgrc_shou_su_ren_character_desc_east:0 "他恪守海东风俗，纵居汉地，子嗣亦不入汉家。"
 trait_zgrc_shou_su_ren_character_desc_generic:0 "他恪守本土风俗，纵居汉地，子嗣亦不入汉家。"
 zgrc_decision_jin_ran_han_feng:0 "浸染汉风"
 zgrc_decision_jin_ran_han_feng_desc:0 "据其土而不变其俗，非真主也。朕既统御华夏，当行汉礼，习汉语，吾族尽随汉风，后世不复以夷称。"
 zgrc_decision_jin_ran_han_feng_tooltip:0 "获得[GetCultureTradition('tradition_zgrc_yong_xia_bian_yi').GetName]：子嗣生于汉地，尽从汉俗。"
 zgrc_decision_jin_ran_han_feng_confirm:0 "浸染汉风"
 zgrc_decision_jin_ran_han_feng_subject:0 "浸染汉风"
 zgrc_decision_jin_ran_han_feng_subject_desc:0 "我族世居汉地，衣冠渐改，言语已通。虽名为藩属，实与汉人无异。\n与其抱残守缺，使族人两头不靠，不如举族从汉俗——上不负天子教化，下不负子弟前程。"
 zgrc_decision_jin_ran_han_feng_subject_tooltip:0 "获得[GetCultureTradition('tradition_zgrc_yong_xia_bian_yi').GetName]：子嗣生于汉地，尽从汉俗。"
 zgrc_decision_jin_ran_han_feng_subject_confirm:0 "浸染汉风"
 zgrc_yong_xia_bian_yi_need_culture_head:0 "须为[culture_head|E]"
 zgrc_decision_guang_bu_han_feng:0 "广布汉风"
 zgrc_decision_guang_bu_han_feng_desc:0 "《春秋》之治，质文递进；至太平世，则远近大小若一。今内附之族，从汉日久，宜授礼乐、启其向化。殊俗同风，遐迩一体，斯为太平。"
 zgrc_decision_guang_bu_han_feng_tooltip:0 "治下一个文化获得[GetCultureTradition('tradition_zgrc_yong_xia_bian_yi').GetName]：子嗣生于汉地，尽从汉俗。"
 zgrc_decision_guang_bu_han_feng_confirm:0 "广布汉风"
 zgrc_guang_bu_han_feng_need_culture:0 "须有内附而未汉化之族，其[culture_head|E]已附天朝"
 zgrc_decision_fu_wo_ben_su:0 "复我本俗"
 zgrc_decision_fu_wo_ben_su_desc:0 "吾族之俗，受之先祖；岂以一时慕华，便弃之？吾族既自立，当复我本俗，使子孙不忘先祖之勇。"
 zgrc_decision_fu_wo_ben_su_tooltip:0 "自身文化移除[GetCultureTradition('tradition_zgrc_yong_xia_bian_yi').GetName]。"
 zgrc_decision_fu_wo_ben_su_confirm:0 "复我本俗"
 zgrc_fu_wo_ben_su_need_culture_head:0 "须为[culture_head|E]"
 zgrc_decision_chuan_cheng_shou_su:0 "传承守俗"
 zgrc_decision_chuan_cheng_shou_su_desc:0 "衣冠如故，言语如故。宁守旧俗以终，不为汉风所染。"
 zgrc_decision_chuan_cheng_shou_su_tooltip:0 "获得[GetTrait('zgrc_shou_su_ren').GetName( GetNullCharacter )]：子嗣坚守本俗。"
 zgrc_decision_chuan_cheng_shou_su_confirm:0 "传承守俗"
 zgrc_decision_mu_hua_gui_xin:0 "慕化归心"
 zgrc_decision_mu_hua_gui_xin_desc:0 "吾闻用夏变夷者。\n今已守俗经年，唯见汉风猎猎，乃去旧俗，与诸夏同。"
 zgrc_decision_mu_hua_gui_xin_tooltip:0 "移除[GetTrait('zgrc_shou_su_ren').GetName( GetNullCharacter )]：子嗣随汉化转籍。"
 zgrc_decision_mu_hua_gui_xin_confirm:0 "慕化归心"
 zgrc_decision_yong_xia_bian_yi:0 "用夏变夷"
 zgrc_decision_yong_xia_bian_yi_desc:0 "我族[ROOT.Char.GetCulture.GetName]，久染汉风，皆通汉音，晓礼仪。民间交融久矣，市井乡野之间，难辨胡夷。当议我等归籍华夏事宜。"
 zgrc_decision_yong_xia_bian_yi_tooltip:0 "自身文化归籍华夏，得[GetCultureTradition('tradition_zgrc_hua_xia_li_yue').GetName]：习汉语、改汉名，传承改归中华，文化领袖之王朝记为已汉化。"
 zgrc_decision_yong_xia_bian_yi_confirm:0 "召集群臣"
 zgrc_decision_yong_xia_bian_yi_petition:0 "用夏变夷"
 zgrc_decision_yong_xia_bian_yi_petition_desc:0 "我族[ROOT.Char.GetCulture.GetName]，久染汉风，皆通汉音，晓礼仪。民间交融久矣，市井乡野之间，难辨胡夷。当上书请归籍华夏。"
 zgrc_decision_yong_xia_bian_yi_petition_tooltip:0 "请示天子：若允，自身文化归籍华夏，得[GetCultureTradition('tradition_zgrc_hua_xia_li_yue').GetName]，习汉语、改汉名，传承改归中华，文化领袖之王朝记为已汉化。"
 zgrc_decision_yong_xia_bian_yi_petition_confirm:0 "上书朝廷"
 zgrc_decision_yong_xia_bian_yi_grant:0 "用夏变夷"
 zgrc_decision_yong_xia_bian_yi_grant_desc:0 "朕观治下向化之族，久染汉风，其人皆通汉音，晓礼仪。民间交融久矣，市井乡野之间，难辨胡夷。当议其归籍华夏事宜。"
 zgrc_decision_yong_xia_bian_yi_grant_tooltip:0 "治下一个[GetCultureTradition('tradition_zgrc_yong_xia_bian_yi').GetName]之族归籍华夏，得[GetCultureTradition('tradition_zgrc_hua_xia_li_yue').GetName]：习汉语、改汉名，传承改归中华，其文化领袖之王朝记为已汉化。"
 zgrc_decision_yong_xia_bian_yi_grant_confirm:0 "召集群臣"
 zgrc_grant_need_culture:0 "须有治下已浸染汉风且交好汉人之族(接受度不低于60)"
 zgrc_common.5011.title:0 "四海之内皆兄弟"
 zgrc_common.5011.desc:0 "[zgrc_notify_culture.GetName]人久染汉风，其人通汉音，晓礼仪。民间交融久矣，市井乡野之间，难辨胡夷。\n远近大小如一，此太平世也！其心既已归，风俗自可纳。\n今天子降诏，顺天应人，纳为王化之民。四海同风，天下共贯也。\n\n八方风土皆入夏，四海奇珍尽衣冠；不弃故园土，同砌华夏城!\n\n我们即是 #EMP 华夏#!!!!"
 zgrc_common.5011.a:0 "归籍华夏"
