 # ============================================================
 # 特质：汉家冠带
 # ============================================================
 trait_zgrc_hanjia_guandai:0 "汉家冠带"
 trait_zgrc_hanjia_guandai_desc:0 "此角色为汉家冠带之族，行止有礼，衣冠得体。"
 trait_zgrc_hanjia_guandai_character_desc:0 "汉家冠带，礼乐之民，有身份之人。"

 # ============================================================
 # 游戏决议
 # ============================================================
 decision_group_type_zgrc:0 "汉人地区风俗决议"

 zgrc_debug_distribute_hanjia_guandai_decision:0 "Debug：重新分发汉家冠带"
 zgrc_debug_distribute_hanjia_guandai_decision_desc:0 "（调试）手动为所有华夏礼乐文化的家族重新分发「汉家冠带」特质。"
 zgrc_debug_distribute_hanjia_guandai_decision_tooltip:0 "为所有华夏礼乐文化的家族重新分发「汉家冠带」特质。"
 zgrc_debug_distribute_hanjia_guandai_decision_confirm:0 "重新分发汉家冠带"

 zgrc_debug_distribute_regional_customs_decision:0 "Debug：初始化各地风俗"
 zgrc_debug_distribute_regional_customs_decision_desc:0 "（调试）按《汉书》地理志分区，为各公国领地与头衔持有者改写为对应汉文化分支。"
 zgrc_debug_distribute_regional_customs_decision_tooltip:0 "将各公国领地与头衔持有者（中华传承）及宫廷改写为对应汉文化分支。"
 zgrc_debug_distribute_regional_customs_decision_confirm:0 "初始化各地风俗"

