 # ============================================================
 # 汉文明基础兵种革新
 # ============================================================
 innovation_zgrc_han_bingfa:0 "华夏兵法"
 innovation_zgrc_han_bingfa_desc:0 "孙吴之略，司马之法，代有传习。教阅明整，令行禁止。"
 innovation_zgrc_han_wubei:0 "帝国武备"
 innovation_zgrc_han_wubei_desc:0 "冶锻之艺精熟，甲杖弓弩之制完备。重甲步骑，成军有制。"

 # ============================================================
 # 人物 modifier
 # ============================================================
 zgrc_rende_modifier:0 "仁德君子"
 zgrc_rende_modifier_desc:0 "义军来投，不忍驱之锋镝，仁德之名大震。"
 zgrc_gouquan_modifier:0 "苟全性命"
 zgrc_gouquan_modifier_desc:0 "兵凶战危，明哲保身。虽能安养天年，然同袍赴难之时隐忍不出，心中难安。"
 zgrc_zhongyi_modifier:0 "忠义"
 zgrc_zhongyi_modifier_desc:0 "毁家纾难，散财起兵以救君父之难。乡党称其义，士民归其心。"
 zgrc_yexin_modifier:0 "野心"
 zgrc_yexin_modifier_desc:0 "该角色背弃旧主，举旗自立。有人畏其兵锋，也有人鄙其为人。"
 # ============================================================
 # 传言系统 —— 祠/像（县 modifier）
 # ============================================================
 zgrc_ci_zhong:0 "忠烈之祠"
 zgrc_ci_zhong_desc:0 "乡人立祠，祭祀忠烈。义声所被，民心思奋。"
 zgrc_ci_ren:0 "怀仁之祠"
 zgrc_ci_ren_desc:0 "乡人立祠，感念仁德。仁声所被，民安其业。"
 zgrc_xiang_zui:0 "罪像"
 zgrc_xiang_zui_desc:0 "铸铁为像，书其罪状，使过者知警。"
 zgrc_xiang_ni:0 "唾逆之像"
 zgrc_xiang_ni_desc:0 "铸铁为像，乡人过者辄唾之，遗臭未已。"
 # ============================================================
 # 传言系统 —— 主角 modifier
 # ============================================================
 zgrc_shengci_modifier:0 "生祠香火"
 zgrc_shengci_modifier_desc:0 "乡人立祠祀之，香火不绝。贤名远播，四方称颂。"
 zgrc_tuozhi_modifier:0 "人人得而唾之"
 zgrc_tuozhi_modifier_desc:0 "恶名昭著，乡里铸铁唾之。过街之人，无不侧目。"
 zgrc_tuozhi_ni_modifier:0 "遗臭乡邦"
 zgrc_tuozhi_ni_modifier_desc:0 "附逆之罪，乡党共弃。生为乡人唾，死恐戮及魂。"
 zgrc_jidan_modifier:0 "有所忌惮"
 zgrc_jidan_modifier_desc:0 "恶名在外，人人防之。敛迹藏锋，不敢复张。"
 # ============================================================
 # 传言系统 —— 好感修正（opinion modifier）
 # 时长见 common/opinion_modifiers/zgrc_opinion_modifiers.txt
 # 数值由事件按情节轻重在 add_opinion 调用处给定
 # ============================================================
 zgrc_opinion_zhongyi:0 "忠义之名"
 zgrc_opinion_rende:0 "仁德之名"
 zgrc_opinion_yexin:0 "野心之名"
 zgrc_opinion_funi:0 "附逆之名"

 # ============================================================
 # 祖风 · 跨大区迁居（30 条：名称按源区一致，描述逐方向各异）
 # ============================================================
 zgrc_zufeng_yanzhao_qilu_modifier:0 "燕赵祖风"
 zgrc_zufeng_yanzhao_qilu_modifier_desc:0 "血气犹存，难入舒缓之俗；礼数不合，心气难平。"
 zgrc_zufeng_yanzhao_sanhe_modifier:0 "燕赵祖风"
 zgrc_zufeng_yanzhao_sanhe_modifier_desc:0 "锋芒太露，乡党侧目；权略与言谈皆不得展。"
 zgrc_zufeng_yanzhao_qinlong_modifier:0 "燕赵祖风"
 zgrc_zufeng_yanzhao_qinlong_modifier_desc:0 "弓马如旧，乡音不通；归思日切，郁郁寡欢。"
 zgrc_zufeng_yanzhao_jingwu_modifier:0 "燕赵祖风"
 zgrc_zufeng_yanzhao_jingwu_modifier_desc:0 "勇力未减，人情不亲；权略难展，心绪难安。"
 zgrc_zufeng_yanzhao_dongyi_modifier:0 "燕赵祖风"
 zgrc_zufeng_yanzhao_dongyi_modifier_desc:0 "弓马之勇犹在；塞外音俗隔阂，人情疏淡。"

 zgrc_zufeng_qilu_yanzhao_modifier:0 "齐鲁祖风"
 zgrc_zufeng_qilu_yanzhao_modifier_desc:0 "弦歌之习尚存，剽悍之乡轻文；礼数无可施，权略无以展。"
 zgrc_zufeng_qilu_sanhe_modifier:0 "齐鲁祖风"
 zgrc_zufeng_qilu_sanhe_modifier_desc:0 "文教本相承，礼法森严；权略难展，言语易失。"
 zgrc_zufeng_qilu_qinlong_modifier:0 "齐鲁祖风"
 zgrc_zufeng_qilu_qinlong_modifier_desc:0 "关山险远，语异俗殊；书剑飘零，郁郁难解。"
 zgrc_zufeng_qilu_jingwu_modifier:0 "齐鲁祖风"
 zgrc_zufeng_qilu_jingwu_modifier_desc:0 "诗书之教犹在，卑湿人情隔膜；权略不彰，心绪难安。"
 zgrc_zufeng_qilu_dongyi_modifier:0 "齐鲁祖风"
 zgrc_zufeng_qilu_dongyi_modifier_desc:0 "章句之业不弃；辽海音俗隔阂，人情疏淡。"

 zgrc_zufeng_sanhe_yanzhao_modifier:0 "三河祖风"
 zgrc_zufeng_sanhe_yanzhao_modifier_desc:0 "勤厚之性犹存，剽悍之地不尚稳重；礼数难行，心气难平。"
 zgrc_zufeng_sanhe_qilu_modifier:0 "三河祖风"
 zgrc_zufeng_sanhe_qilu_modifier_desc:0 "农桑之习相近，礼数周旋终隔一层；心气难平。"
 zgrc_zufeng_sanhe_qinlong_modifier:0 "三河祖风"
 zgrc_zufeng_sanhe_qinlong_modifier_desc:0 "关山阻隔，乡音渐改；西望故园，愁思难解。"
 zgrc_zufeng_sanhe_jingwu_modifier:0 "三河祖风"
 zgrc_zufeng_sanhe_jingwu_modifier_desc:0 "生计虽勤，江湖人情难测；权略不彰，心绪难安。"
 zgrc_zufeng_sanhe_dongyi_modifier:0 "三河祖风"
 zgrc_zufeng_sanhe_dongyi_modifier_desc:0 "寒徼之地旧俗难施；音俗隔阂，人情疏淡。"

 zgrc_zufeng_qinlong_yanzhao_modifier:0 "秦陇祖风"
 zgrc_zufeng_qinlong_yanzhao_modifier_desc:0 "驰驱之能犹在，剽悍之乡轻文；礼数无处可施，权略不得展。"
 zgrc_zufeng_qinlong_qilu_modifier:0 "秦陇祖风"
 zgrc_zufeng_qinlong_qilu_modifier_desc:0 "鞍马之习犹存，揖让之邦周旋不合；心气难平。"
 zgrc_zufeng_qinlong_sanhe_modifier:0 "秦陇祖风"
 zgrc_zufeng_qinlong_sanhe_modifier_desc:0 "驰驱之性难容中原礼法；权略与言语皆不得展。"
 zgrc_zufeng_qinlong_jingwu_modifier:0 "秦陇祖风"
 zgrc_zufeng_qinlong_jingwu_modifier_desc:0 "鞍马易为舟楫，行止难合；权略不彰，心绪难安。"
 zgrc_zufeng_qinlong_dongyi_modifier:0 "秦陇祖风"
 zgrc_zufeng_qinlong_dongyi_modifier_desc:0 "关山万里，旧艺无所施；音俗隔阂，人情疏淡。"

 zgrc_zufeng_jingwu_yanzhao_modifier:0 "荆吴祖风"
 zgrc_zufeng_jingwu_yanzhao_modifier_desc:0 "江湖体魄犹健，剽悍之乡不尚柔婉，礼数难行。"
 zgrc_zufeng_jingwu_qilu_modifier:0 "荆吴祖风"
 zgrc_zufeng_jingwu_qilu_modifier_desc:0 "弄潮之勇犹在，礼义之邦周旋不合，心气难平。"
 zgrc_zufeng_jingwu_sanhe_modifier:0 "荆吴祖风"
 zgrc_zufeng_jingwu_sanhe_modifier_desc:0 "轻矫之性难容中原重厚；权略与言语皆不得展。"
 zgrc_zufeng_jingwu_qinlong_modifier:0 "荆吴祖风"
 zgrc_zufeng_jingwu_qinlong_modifier_desc:0 "弃舟上马，风土迥异；言语不通，郁郁难解。"
 zgrc_zufeng_jingwu_dongyi_modifier:0 "荆吴祖风"
 zgrc_zufeng_jingwu_dongyi_modifier_desc:0 "风物大异江南；音俗隔阂，人情疏淡。"

 zgrc_zufeng_dongyi_yanzhao_modifier:0 "东夷祖风"
 zgrc_zufeng_dongyi_yanzhao_modifier_desc:0 "柔顺贞信之习犹存，尚气之地动辄得咎；权略无处可施。"
 zgrc_zufeng_dongyi_qilu_modifier:0 "东夷祖风"
 zgrc_zufeng_dongyi_qilu_modifier_desc:0 "礼义本自相通，唯言语礼节尚须迁就。"
 zgrc_zufeng_dongyi_sanhe_modifier:0 "东夷祖风"
 zgrc_zufeng_dongyi_sanhe_modifier_desc:0 "规矩森严，权略难展，言语易失。"
 zgrc_zufeng_dongyi_qinlong_modifier:0 "东夷祖风"
