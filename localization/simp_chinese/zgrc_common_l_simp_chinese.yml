 # ============================================================
 # 入乡随俗 —— 久居时限
 # ============================================================
 rule_zgrc_ruxiang_time:0 "入乡随俗：久居时限"
 setting_zgrc_ruxiang_time_5:0 "5 年"
 setting_zgrc_ruxiang_time_5_desc:0 "客居异乡者，需连续居住满 #high 5#! 年，方可入乡随俗。"
 setting_zgrc_ruxiang_time_10:0 "10 年"
 setting_zgrc_ruxiang_time_10_desc:0 "客居异乡者，需连续居住满 #high 10#! 年，方可入乡随俗。"
 setting_zgrc_ruxiang_time_30:0 "30 年"
 setting_zgrc_ruxiang_time_30_desc:0 "客居异乡者，需连续居住满 #high 30#! 年，方可入乡随俗。"

 # ============================================================
 # 开局初始化 —— 地域风俗/汉家冠带分发
 # ============================================================
 rule_zgrc_init_on_start:0 "开局初始化"
 setting_zgrc_init_on_start_enabled:0 "启用"
 setting_zgrc_init_on_start_enabled_desc:0 "游戏开局时，为拥有华夏礼乐传统的文化补充革新，并向这些文化的统治者所属家族分发#EMP 汉家冠带#!。地域风俗传统与文化分布由开局设定决定。"
 setting_zgrc_init_on_start_disabled:0 "禁用"
 setting_zgrc_init_on_start_disabled_desc:0 "不执行本模块的开局革新补充与汉家冠带分发。地域风俗传统、文化分布及主模组原有开局革新不受影响。"

 # ============================================================
 # 革新同步 —— 开关
 # ============================================================
 rule_zgrc_innovation_sync:0 "革新同步"
 setting_zgrc_innovation_sync_enabled:0 "启用"
 setting_zgrc_innovation_sync_enabled_desc:0 "定期将#EMP 汉文明共有革新#!同步至各汉地文化。"
 setting_zgrc_innovation_sync_disabled:0 "禁用"
 setting_zgrc_innovation_sync_disabled_desc:0 "关闭革新同步，各文化须自行钻研全部革新。"

 # ============================================================
 # 革新同步 —— 阈值（每 N 年同步一次）
 # ============================================================
 rule_zgrc_innovation_sync_threshold:0 "革新同步：周期"
 setting_zgrc_innovation_sync_threshold_1:0 "每 1 年"
 setting_zgrc_innovation_sync_threshold_1_desc:0 "每 #high 1#! 年执行一次革新同步。"
 setting_zgrc_innovation_sync_threshold_3:0 "每 3 年"
 setting_zgrc_innovation_sync_threshold_3_desc:0 "每 #high 3#! 年执行一次革新同步。"
 setting_zgrc_innovation_sync_threshold_5:0 "每 5 年"
 setting_zgrc_innovation_sync_threshold_5_desc:0 "每 #high 5#! 年执行一次革新同步。"

 # ============================================================
 # 消息通知
 # ============================================================
 zgrc_innovation_sync_toast_title:0 "华夏革新传来"
 zgrc_innovation_sync_toast_desc:0 "华夏诸邦互通有无，一项革新之制已传至贵邦。"
 # ============================================================
 # 新增士兵
 # ============================================================
 zgrc_hanjia_yiyong:0 "汉家义勇"
 zgrc_hanjia_yiyong_flavor:0 "这些乡勇平日务农，烽火一起便执枪相从。枪阵虽简陋却密集难破，攻城时也乐于填壕陷阵。"

 zgrc_yuyang_tuqi:0 "河朔飞骑"
 zgrc_yuyang_tuqi_flavor:0 "河朔边郡的弓骑以骑射见长，箭雨轻快而不绝，且极善于追击溃逃之敌，让入寇的骑兵难以脱身。"
 zgrc_liujun_liangjiazi:0 "六郡铁骑"
 zgrc_liujun_liangjiazi_flavor:0 "天水、陇西等六郡的良家子弟，材力过人，自幼习射。他们披上重甲便是精锐铁骑，冲阵时势不可挡。"
 zgrc_hexi_muqi:0 "河西突骑"
 zgrc_hexi_muqi_flavor:0 "河西凉州水草丰美，所出轻骑轻装善射。他们常年巡戍边塞，来去如风，极善于袭扰和追击。"
 zgrc_jingchu_weishi:0 "荆楚卫士"
 zgrc_jingchu_weishi_flavor:0 "荆楚之地素以劲弩著称，山泽之间善弩者众。卫士们据水结阵，连弩齐发，矢雨蔽空。"
 zgrc_wuyue_jianshi:0 "吴越剑士"
 zgrc_wuyue_jianshi_flavor:0 " 吴越之地自古尚剑，这些剑士短兵相接时快如疾风，擅长在林泽之间突进搏杀，勇悍而轻死。"
 zgrc_wuling_caiguan:0 "五陵材官"
 zgrc_wuling_caiguan_flavor:0 "关中五陵之间，豪右并兼，良家子弟选为材官。材官蹶张强弩，身被重甲，持盾如墙，号为关中精锐。"
 zgrc_zhongyuan_jieshi:0 "中原介士"
 zgrc_zhongyuan_jieshi_flavor:0 "介者甲也。中原介士披轻甲而迅捷，来去如风，善搏击于田垄街巷之间，聚则成阵，散则难寻。"

 zgrc_beiwei_zhongbu:0 "背嵬重步"
 zgrc_beiwei_zhongbu_flavor:0 "背嵬之卒重甲如墙，人言撼山易而撼此军难。临阵稳如山岳，进则摧破敌锋。"
 zgrc_beiwei_zhongqi:0 "背嵬重骑"
 zgrc_beiwei_zhongqi_flavor:0 "背嵬之骑铁甲如林，人言撼山易而撼此军难。临阵势若雷霆，进则踏破敌营。"

 # 华夏锐士 / 华夏突骑 —— 汉传兵法基础兵种（独立兵种）
 zgrc_han_ruishi:0 "华夏锐士"
 zgrc_han_ruishi_flavor:0 "身披重甲的锐士手持双手长刃，兼具防护与杀伤，尤擅近身搏杀中斩马破阵，令敌军前列溃散。"
 zgrc_han_tuqi:0 "华夏突骑"
 zgrc_han_tuqi_flavor:0 "身披重甲的精锐骑手冲击敌阵如雷霆贯耳。他们既能在平原冲锋中碾碎敌列，也能掩护友军侧翼。"

