l_simp_chinese:
 # 天子礼仪君主（2026-10-24，历史志向任务卡 D43~D50）：「还政天子」「另立天子」派系与相关提示
 hd_cer_restore_faction_name:0 "还政天子"
 hd_cer_claimant_faction_name:0 "另立天子"
 hd_cer_restore_faction_desc:0 "$restore_ceremonial_liege_faction_name$[faction|E]的成员不满权臣专擅朝政，要求其交还天命，奉[ceremonial_liege|E]复位。\n\n#S 最后通牒#!\n[ceremonial_liege|E]复掌天命；权臣交出霸权，连同领地向其称臣；礼仪头衔随之撤销"
 hd_cer_claimant_faction_desc:0 "$ceremonial_claimant_faction_name$[faction|E]的成员要拥立另一人坐上礼仪君主之位。\n\n#S 最后通牒#!\n[claimant|E]取代现任[ceremonial_liege|E]，权臣照旧秉政"
 hd_cer_restore_reward_tt:0 "[ceremonial_liege|E]复掌天命；权臣交出霸权，连同领地向其称臣；礼仪头衔随之撤销"
 hd_cer_restore_war_name:0 "奉迎[CLAIMANT.GetTitledFirstName]还朝之战"
 hd_cer_restore_war_victory_desc:0 "[defender.GetShortUIName|U]交出天命，被[imprisoned|E]，并连同领地向[ceremonial_liege|E]称臣。"
 hd_cer_restore_demand_opening:0 "还政天子"
 hd_cer_restore_demand_desc:0 "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n天子在上，你却把持名器，政令皆出你门。我等今日共举义旗，请你交还天命，奉[ceremonial_liege.GetTitledFirstName]复掌朝政。\n\n你若识时务，便退归藩位，尚可保全宗族；否则，只好兵戎相见。"
 hd_cer_restore_demand.a:0 "天命本属陛下，我愿退归藩位。"
 hd_cer_restore_demand.b:0 "竖子安敢胁我！"
 hd_cer_restore_accepted_opening:0 "还政天子：所请已允"
 hd_cer_restore_accepted_desc:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n我辅政以来，未尝一日不为社稷操劳，你们却疑我不忠。罢了，天命交还[ceremonial_liege.GetTitledFirstName]，我退归藩位便是。只望诸君好自为之。"
 hd_cer_restore_accepted.a:0 "天子复位，社稷之幸。"
 hd_cer_restore_refused_opening:0 "还政天子：所请被拒"
 hd_cer_restore_refused_desc:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n放肆！我为朝廷扫平群丑，你们坐享其成，如今反来指摘我？假借天子之名作乱，其罪当诛。既要兵戎相见，我奉陪到底！"
 hd_cer_restore_refused.a:0 "那便兵戎相见！"
 hd_cer_restore_refused.b:0 "唯有一战。"
 hd_cer_restore_notice_opening:0 "还政天子"
 hd_cer_restore_notice_desc:0 "[faction_leader.Custom2('AppropriateGreetingPositive', ROOT.Char)]\n\n[faction_target.GetTitledFirstName]专擅朝政已久，天子形同虚设。檄文已经备好，不日便递到其案前，请其交还天命。若其不从，还望你与我同心协力，共讨国贼。"
 hd_cer_restore_notice.a:0 "愿附骥尾。"
 hd_cer_restore_victory.t:0 "奉迎天子"
 hd_cer_restore_victory.desc:0 "[defender.GetTitledFirstName]兵败被擒，昔日专擅朝政之人，如今身陷囹圄。宫门重开，[ceremonial_liege.GetTitledFirstName]端坐御座，百官重新列班朝拜。\n\n天子执我之手，良久无言。从今往后，天下都知道是我替天子讨回了天命。"
 hd_cer_restore_victory.a:0 "陛下万岁！"
 hd_cer_restored_msg:0 "天子复掌天命"
 hd_cer_restored_msg_desc:0 "[hd_cer_restored_tianzi.GetTitledFirstName]重掌天命，[hd_cer_old_regent.GetTitledFirstName]交出霸权，退为藩臣。"
