 hd_join_defensive_league_interaction_desc:0 "加入[recipient.GetTitledFirstName]领导的防御联盟。"
 hd_demand_defensive_league_vote_interaction:0 "要求联盟投票支持"
 hd_demand_defensive_league_vote_interaction_desc:0 "利用牵制或同盟关系迫使成员在下届盟主选举中投票支持你。"
 hd_call_defensive_league_to_war_interaction:0 "召集联盟参战"
 hd_call_defensive_league_to_war_interaction_desc:0 "花费威望，召集该联盟成员加入你当前领导的所有进攻战争。"
 hd_leave_defensive_league_decision:0 "退出防御联盟"
 hd_leave_defensive_league_decision_desc:0 "联盟已经不再符合我的利益。"
 hd_leave_defensive_league_decision_tooltip:0 "退出当前防御联盟，付出威望代价。"
 hd_unify_defensive_league_decision:0 "统一联盟"
 hd_unify_defensive_league_decision_desc:0 "将长期合作的防御联盟整合为一个真正的王国。"
 hd_unify_defensive_league_decision_tooltip:0 "满足条件后创建或夺取首都所在的法理王国。"
 hd_confederation.0500.t:0 "联盟统一"
 hd_confederation.0500.desc:0 "旧日会盟的文书仍在，今日送来的却已是统合诸地的新安排。首府所在的疆域渐渐连成一片，盟中诸家也已从相互援应，走到共同听从一个号令的地步。\n\n我看着新定的名位与所属，知道从此不能再把每件事都推回各家的盟誓。土地、兵众与民生既合到一起，所要承担的责任也一并落下；称号可以在今日取得，长久的服从却须靠往后的治理维持。\n\n堂下等待宣告的人已齐。我将旧盟书置于新文书旁，叫人将统合之事说清。今日以后，原先松散的约定，便有了更实在的归属。"
 hd_confederation.0500.a:0 "宣告统合，承其名位与责任。"
 hd_confederation_subjugation_victory_desc:0 "联盟征服战争胜利，目标统治者将加入联盟。"
 hd_confederation_subjugation_white_peace_desc:0 "联盟征服战争以白和平结束。"
 hd_confederation_subjugation_defeat_desc:0 "联盟征服战争失败。"
 hd_anti_regent.0001.t:0 "号召联盟"
 hd_anti_regent.0001.desc:0 "众人推我为盟主，礼辞说了一轮又一轮，我也依次答过。等终于议到出兵，席间的声音却不如方才齐整了。\n\n这一家缺粮，那一家须留兵守境，刚才还恨不得亲斩董卓的人，忽然都多了难处。我端着酒盏听他们说，脸上仍留着笑。让诸侯肯坐到一处，袁氏的名望已经办到；往后要他们随同一道号令，却还得看我。\n\n我将酒盏放下，席间才渐渐静了。名分既定，便不宜再让每个人都把自己的话说成最后一句。请诸君先听盟主的安排。"
 hd_anti_regent.0001.a:0 "以盟主之名，号召诸侯讨董。"
 hd_anti_regent.0002.t:0 "盟书四出"
 hd_anti_regent.0002.desc:0 "盟书封好，驿骑便从不同道路出发。每送走一封，我面前便多留下一份抄录，空着的答复处，像是一列尚未到齐的旗号。\n\n诸侯各有自己的迟疑。有的要先问邻境动静，有的顾念旧日隶属，也有人恐怕董卓倒下之后，接掌大权的会是另一个人。我不能指望所有回书都写同一个字，更不能让举兵之期随每一份迟疑往后挪。\n\n三个月的集结期限已经定下。眼前要做的，是等候愿来之人、准备能够出发的兵马，把盟书上的慷慨变成实在的行程。"
 hd_anti_regent.0002.a:0 "依期集结，不待人人应盟。"
 hd_anti_regent.0003.t:0 "讨董盟书"
 hd_anti_regent.0003.desc:0 "[scope:hd_anti_regent_inviter_scope.GetTitledFirstName]的盟书送到，封上写着共讨董卓、扶持汉室。来使说完各路兵势，便停下等我答复。\n\n我没有立刻落笔。应盟不只是说一句董卓当诛：此后须离开原有隶属，加入联盟，与诸军共同出战。留在旧有位置，也可以明确反对此盟，或暂不选边，各守自己的疆土。\n\n堂下的人都知道，这封回书会传到邻境，也会传到董卓耳中。可是听见这些名字以后，究竟由谁带着兵马承担后果，仍得由我自己决定。"
 hd_anti_regent.0003.a:0 "脱离旧属，入盟讨董。"
 hd_anti_regent.0003.b:0 "不承认此盟，仍守原属。"
 hd_anti_regent.0003.c:0 "不入此争，暂持中立。"
 hd_anti_regent.0009.t:0 "整顿渤海"
 hd_anti_regent.0009.desc:0 "渤海来见我的人挤满门外。先报部众的想谈功劳，先送钱粮的想留姓名，至于袁氏准备怎样起兵，他们倒都愿等我最后开口。\n\n我叫书吏逐一记下：三千金，五千重步兵。离开雒阳时，董卓大概以为少了一个敢在殿上按剑的人，便能高枕无忧。如今这些人肯聚到我这里，便是最好的答复。\n\n门外又报来客，我将军籍推给左右，整衣迎出。袁氏累世的声望，今日正该用在此处；先把愿意相从的人接住，再让董卓听见他们的脚步。"
 hd_anti_regent.0009.a:0 "收整钱粮兵众，以渤海为基。"
 hd_anti_regent.0012.t:0 "诸军会盟"
 hd_anti_regent.0012.desc:0 "三个月的集结之期已到，营前各家的旗帜随风展开。我接掌盟军号令时，来报的人先称兵众，再报粮数，最后才说起尚未赶到的队伍。\n\n等候不能没有尽头。董卓仍把持朝廷，盟书上的讨贼之言若迟迟不能落实，便会先在自己营中失去分量。我已令诸军出动，帐外随即响起整队与催发辎重的呼喝。\n\n此刻再望那些并不相同的旗号，我知道自己不能替所有人消去私心，却须让他们先走过同一段道路。今日起，会盟便成了战争。"
 hd_anti_regent.0012.a:0 "号令已下，诸军向前。"
 hd_anti_regent.0004.t:0 "举兵讨董"
 hd_anti_regent.0004.desc:0 "出兵的号令已经传下。辎重车缓缓经过营门，披甲的兵士沿道成列，方才仍在帐中议论的讨董之战，转眼便成了眼前的脚步声。\n\n我听取各部回报，问完粮道，又问前军到何处会合。口中同称清君侧的人，未必都肯承担同样的险；但大军既动，便不能再靠席间的慷慨来维系。\n\n董卓的兵马守着朝廷，我们的旗帜向京师展开。我将最后一份军报合起，命人追上先行队伍。盟誓能否作数，接下来要在真正的交锋里见分晓。"
 hd_anti_regent.0004.a:0 "整肃诸军，共向董卓。"
 hd_yuan_bohai_armored_army:0 "渤海重步兵"
 hd_anti_regent.0100.t:0 "联军收兵"
 hd_anti_regent.0100.desc:0 "讨董之战已经告捷，河南诸县归入盟主治下，继续向关中进兵的议论却渐渐少了。营中来往的人换了话头：自己的粮还够几日，旧地是否安稳，何时可以收兵。\n\n我看着一面面陆续撤下的旗帜。董卓仍在关中，而将我们聚到一起的盟誓，已经不能让各家再多留几天。有人忙着道别，有人不等道别便先遣辎重上路。\n\n这场胜利留下了土地，也留下了各自掌兵的诸侯。我收起旧盟书，知道往后再与这些人相见，未必还会站在同一边。"
 hd_anti_regent.0100.b:0 "收兵各归，盟事至此。"
 hd_anti_regent_punitive_victory_desc:0 "盟主取得河南公国及其全部法理伯爵领，联军随后解散，各路诸侯收兵，不再进军关中。"
 hd_anti_regent_punitive_white_peace_desc:0 "讨伐战争以白和平结束，联军因此解体。"
 hd_anti_regent_punitive_defeat_desc:0 "讨伐战争失败，摄政击退了联军。"
 HD_CONFEDERATION_SUBJUGATION_WAR_NAME:0 "联盟征服战争"
 HD_ANTI_REGENT_PUNITIVE_WAR_NAME:0 "讨伐"
