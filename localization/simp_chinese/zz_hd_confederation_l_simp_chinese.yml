l_simp_chinese:
 HD_DEFENSIVE_LEAGUE_NAME:0 "防御联盟"
 HD_ANTI_REGENT_LEAGUE_NAME:0 "讨董联盟"
 hd_league_member_modifier:0 "同盟诸侯"
 hd_league_member_modifier_desc:0 "该角色身在盟约之中，与诸侯同进同退。"
 hd_league_leader_modifier:0 "执牛耳"
 hd_league_leader_modifier_desc:0 "该角色为诸侯所推，执盟主之位。"
 hd_league_disorganized_modifier:0 "盟心涣散"
 hd_league_disorganized_modifier_desc:0 "盟中诸侯各怀异志，号令难行。"
 hd_offer_defensive_league_interaction:0 "提议组建防御联盟"
 hd_offer_defensive_league_interaction_desc:0 "与对方约为盟好，共御外侮。"
 hd_offer_defensive_league_interaction_notification:0 "[actor.GetTitledFirstName]遣使前来，约你结盟，共御外侮。"
 hd_join_defensive_league_interaction:0 "加入防御联盟"
 hd_join_defensive_league_interaction_desc:0 "投身[recipient.GetTitledFirstName]主盟的防御联盟。"
 hd_demand_defensive_league_vote_interaction:0 "要求联盟投票支持"
 hd_demand_defensive_league_vote_interaction_desc:0 "凭借把柄或盟好之谊，要对方在推举盟主时支持你。"
 hd_call_defensive_league_to_war_interaction:0 "召集联盟参战"
 hd_call_defensive_league_to_war_interaction_desc:0 "以盟主之名，召盟中诸侯随你出征。"
 hd_leave_defensive_league_decision:0 "退出防御联盟"
 hd_leave_defensive_league_decision_desc:0 "当初的盟约，如今只剩掣肘。与其勉强同行，不如就此别过，各自珍重。"
 hd_leave_defensive_league_decision_tooltip:0 "退出你所在的防御联盟"
 hd_unify_defensive_league_decision:0 "统一联盟"
 hd_unify_defensive_league_decision_desc:0 "盟约维系多年，诸家早已同进同退。与其岁岁会盟，不如合为一国，令出一门。"
 hd_unify_defensive_league_decision_tooltip:0 "合盟为一，取你都城所在之州，盟中诸侯皆奉你为主"
 hd_confederation.0500.t:0 "合盟为国"
 hd_confederation.0500.desc:0 "旧日会盟的文书还在，今日送来的却已是统合诸地的新章程。你都城所在的疆域渐渐连成一片，盟中诸家也从彼此援应，走到了共听一人号令的地步。\n\n你看着新定的名位与隶属，知道从此不能再把每件事都推回各家的盟誓。土地、兵众与民生既已合到一处，所要担的责任也一并落到你的肩上；名号可以今日取得，长久的服从却要靠往后的治理来维系。\n\n堂下等候宣告的人已经到齐。你把旧盟书放在新文书旁边，命人宣读统合之事。从今往后，原先松散的约定，便有了实在的归属。"
 hd_confederation.0500.a:0 "合盟为国，号令归一。"
 hd_confederation_subjugation_victory_desc:0 "战败者须加入联盟。"
 hd_confederation_subjugation_white_peace_desc:0 "双方罢兵，对方仍不入盟。"
 hd_confederation_subjugation_defeat_desc:0 "征讨失利，对方不必入盟。"
 hd_anti_regent.0001.t:0 "推为盟主"
 hd_anti_regent.0001.desc:0 "众人推你为盟主，推辞的话说了一轮又一轮，你也一一答过。等终于议到出兵，席间的声音却不如方才齐整了。\n\n这一家缺粮，那一家须留兵守境，刚才还恨不得亲手斩下董卓首级的人，忽然都多了难处。你端着酒盏听他们说，脸上仍带着笑。能让诸侯坐到一处，靠的是一腔讨贼的义愤；往后要他们随同一道号令行事，却还得看你。\n\n你把酒盏放下，席间才渐渐静了。名分既定，便不宜再让每个人都把自己的话当成最后一句。请诸君先听盟主的安排。"
 hd_anti_regent.0001.a:0 "歃血为盟，共讨董贼。"
 hd_anti_regent.0002.t:0 "盟书四出"
 hd_anti_regent.0002.desc:0 "盟书封好，驿骑便从不同的道路出发了。每送走一封，你面前便多留下一份抄录，空着的答复处，像是一列尚未到齐的旗号。\n\n诸侯各有各的迟疑：有的要先看邻境动静，有的顾念旧日的隶属，也有人担心董卓倒下之后，接掌大权的会是另一个人。你不能指望每一封回书都写着同一个字，更不能让举兵之期随着每一份迟疑往后拖。\n\n集结之期已经定下。眼下要做的，是等候愿来的人、整备能出发的兵马，把盟书上的慷慨之辞，变成实在的行程。"
 hd_anti_regent.0002.a:0 "如期会兵，不待人人应盟。"
 hd_anti_regent.0003.t:0 "讨董盟书"
 hd_anti_regent.0003.desc:0 "[scope:hd_anti_regent_inviter_scope.GetTitledFirstName]的盟书送到了，封上写着共讨董卓、匡扶汉室。来使说完各路兵势，便住了口，等你答复。\n\n你没有立刻落笔。应盟不只是说一句董卓当诛：盟书一旦署名，你便要脱离旧日的统属，随诸军西向。回书若是一口回绝，盟主必然记恨，董卓那边倒会念你这份情；若只含糊推托，也不过是暂且置身事外。\n\n堂下的人都知道，这封回书会传遍关东。究竟由谁带着兵马去承担后果，终究得由你自己决定。"
 hd_anti_regent.0003.a:0 "脱离旧属，入盟讨董。"
 hd_anti_regent.0003.a.tt:0 "你将脱离旧日统属，自立一方，与诸侯同举讨董之兵。"
 hd_anti_regent.0003.b:0 "此盟未奉诏命，恕难从命。"
 hd_anti_regent.0003.c:0 "闭境自守，静观其变。"
 hd_anti_regent.0009.t:0 "整顿渤海"
 hd_anti_regent.0009.desc:0 "渤海来见你的人挤满了门外。先报部曲的想谈功劳，先送钱粮的想留姓名，至于袁氏要怎样起兵，他们倒都愿意等你最后开口。\n\n你命书吏一一记下：钱帛几何，甲士几何，又有哪些名士愿来相从。离开雒阳时，董卓大概以为少了一个敢在殿上按剑的人，便可高枕无忧；如今这些人肯聚到你这里，便是最好的答复。\n\n门外又报有客到，你把军籍推给左右，整衣出迎。袁氏四世三公的声望，今日正该用在此处——先把愿意相从的人接住，再让董卓听见他们的脚步声。"
 hd_anti_regent.0009.a:0 "收兵聚粮，以渤海为基。"
 hd_anti_regent.0012.t:0 "诸军会盟"
 hd_anti_regent.0012.desc:0 "集结之期已到，营前各家的旗帜迎风展开。你接掌盟军号令时，来报的人先报兵数，再报粮数，最后才说起尚未赶到的队伍。\n\n等候不能没有尽头。董卓仍把持着朝廷，盟书上的讨贼之言若迟迟不能落实，便会先在自家营中失了分量。你已下令诸军开拔，帐外随即响起整队与催发辎重的呼喝。\n\n再看那些各不相同的旗号，你知道自己替不了所有人消去私心，却须让他们先走上同一段路。从今日起，会盟便成了战争。"
 hd_anti_regent.0012.a:0 "号令已下，诸军向前。"
 hd_anti_regent.0004.t:0 "举兵讨董"
 hd_anti_regent.0004.desc:0 "出兵的号令已经传下。辎重车缓缓驶过营门，披甲的兵士沿道列队，方才还在帐中议论的讨董之战，转眼便成了眼前的脚步声。\n\n你听取各部回报，问过粮道，又问前军在何处会合。口中同称清君侧的人，未必都肯担同样的风险；可大军既已开动，便不能再靠席间的慷慨来维系。\n\n董卓的兵马守着朝廷，联军的旗帜向京师展开。你合上最后一份军报，命人去追先行的队伍。盟誓作不作数，接下来便要在交锋里见分晓。"
 hd_anti_regent.0004.a:0 "整肃诸军，共向董卓。"
 hd_yuan_bohai_armored_army:0 "渤海重步兵"
 hd_anti_regent.0100.t:0 "联军收兵"
 hd_anti_regent.0100.desc:0 "讨董之战已经告捷，河南诸县归入你的治下，继续向关中进兵的议论却渐渐少了。营中往来的人换了话题：自家的粮还够几日，旧地是否安稳，何时可以收兵。\n\n你看着一面面陆续撤下的旗帜。董卓仍在关中，而将众人聚到一处的盟誓，已经留不住各家多待几天。有人忙着道别，有人不等道别，便先遣辎重上了路。\n\n这场胜利留下了土地，也留下了各自拥兵的诸侯。你收起旧盟书，知道往后再与这些人相见，未必还会站在同一边。"
 hd_anti_regent.0100.b:0 "收兵各归，盟事至此。"
 hd_anti_regent_punitive_victory_desc:0 "盟主取得河南，参战诸侯声威大振；联军随即解散，诸侯各自收兵。"
 hd_anti_regent_punitive_white_peace_desc:0 "双方罢兵，联军无功而散。"
 hd_anti_regent_punitive_defeat_desc:0 "权臣击退联军，守方诸将声威大振；联军就此瓦解。"
 HD_CONFEDERATION_SUBJUGATION_WAR_NAME:0 "联盟征服战争"
 HD_ANTI_REGENT_PUNITIVE_WAR_NAME:0 "讨伐"
