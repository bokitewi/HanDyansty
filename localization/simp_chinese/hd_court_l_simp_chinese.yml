l_simp_chinese:
 # 乱世霸权·天子与权臣（2026-10-10）

 # 挟天子 CB
 hd_court_xietianzi_cb: "挟天子"
 hd_court_xietianzi_cb_war_name: "[ATTACKER.GetShortUINamePossessive]迎驾之战"
 hd_court_xietianzi_cb_victory_desc: "[attacker.GetShortUIName|U]将天子迎入自己掌中，从此以天子之名号令诸侯。"
 hd_court_xietianzi_cb_white_peace_desc: "双方罢兵，天子仍在原处。"
 hd_court_xietianzi_cb_defeat_desc: "[attacker.GetShortUIName|U]迎驾不成，须向[defender.GetShortUIName]支付赔款。"

 # 傀儡
 hd_court_puppet: "挟持的天子"
 hd_court_puppet_desc: "天子仍坐在御座上，诏书却出自你的幕府。借他的名义，你可以征伐、封拜、下狱与赦免。"
 puppet_action_description_hd_court_puppet_action_grant_titles: "以天子名义使用 #V [GetPlayer.GetPlayerInteractionName('grant_titles_interaction')]#! [interaction|E]，把天子名下的[titles|E]分封给他人"
 puppet_action_description_hd_court_puppet_action_revoke_title: "以天子名义使用 #V [GetPlayer.GetPlayerInteractionName('revoke_title_interaction')]#! [interaction|E]，收回天子[vassals|E]的[titles|E]"
 hd_court_puppet_placeholder_interaction: "挟持天子"

 # 挟天子成立
 hd_court.0001.t: "天子蒙尘"
 hd_court.0001.desc: "京城的消息传来时，城门已经换了守军。[hd_court_new_regent.GetTitledFirstName]的兵马进驻宫城，[hd_court_emperor.GetTitledFirstName]的车驾被迎入新的行在。\n\n诏书仍以天子的口吻写成，盖的也仍是天子的玺印。可谁都明白，从今往后，执笔的是另一只手。"
 hd_court.0001.a: "天子在谁手中，天下便看向谁。"

 # 弃天子自立
 hd_court_abandon_emperor_decision: "弃天子自立"
 hd_court_abandon_emperor_decision_desc: "奉着天子，诸侯便不敢公然与我为敌，可这面旗帜也缚住了我的手脚。朝堂上的礼数、群臣的眼色、天子那张沉默的脸……也许是时候把这一切交还给他了。"
 hd_court_abandon_emperor_decision_tooltip: "辞去辅政，带领地离开天子，自立一方"
 hd_court_abandon_emperor_decision_confirm: "此后各行其是！"
 hd_court_abandon_emperor_decision_effect_tt: "你辞去丞相与辅政之职，带着自己的领地离开天子，天子从此不再受你节制"
 hd_court_abandoned_emperor_opinion: "背弃天子"

 # 第 3 期：立场
 hd_court_stance_zunhan_modifier: "尊汉"
 hd_court_stance_zunhan_modifier_desc: "此人仍奉汉家正朔，以讨逆安汉为己任。"
 hd_court_stance_moni_modifier: "谋逆"
 hd_court_stance_moni_modifier_desc: "此人眼中已无汉家天子，只信手中的刀兵。"
 hd_court_declare_zunhan_decision: "奉汉家正朔"
 hd_court_declare_zunhan_decision_desc: "汉祚虽衰，天子犹在。我愿奉其正朔，讨不臣，安社稷——至少，天下人会这样看我。"
 hd_court_declare_zunhan_decision_tooltip: "宣告尊奉汉室，以讨逆安汉为己任"
 hd_court_declare_zunhan_decision_confirm: "汉室不可不扶！"
 hd_court_declare_moni_decision: "不复奉诏"
 hd_court_declare_moni_decision_desc: "所谓诏书，不过是挟持天子之人借来的名义。天命无常，唯有德者居之，而德，是要用刀枪去争的。"
 hd_court_declare_moni_decision_tooltip: "宣告不再听从朝廷号令"
 hd_court_declare_moni_decision_confirm: "天下，有能者居之！"
 hd_court_stance_cooldown_tt: "你近来已表明过立场，不宜朝令夕改"

 # 第 3 期：朝廷特权
 hd_court_grant_rank_interaction: "授以将军号"
 hd_court_grant_rank_interaction_desc: "以朝廷名义，授[recipient.GetShortUIName]一个将军名号"
 hd_court_grant_rank_interaction_notification: "朝廷授[recipient.GetShortUIName]将军之号"
 hd_court_already_has_rank_tt: "[recipient.GetShortUIName]已有将军名号"
 hd_court_yaoling_interaction: "遥领其州"
 hd_court_yaoling_interaction_desc: "以朝廷名义，命[recipient.GetShortUIName]遥领[secondary_recipient.GetShortUIName]所据之州，使其对那里的各郡有了[claims|E]"
 hd_court_yaoling_interaction_notification: "朝廷命[recipient.GetShortUIName]遥领一州"
 hd_court_order_campaign_interaction: "诏令征伐"
 hd_court_order_campaign_interaction_desc: "以朝廷名义，命[recipient.GetShortUIName]讨伐[secondary_recipient.GetShortUIName]"
 hd_court_order_campaign_interaction_notification: "朝廷诏令[recipient.GetShortUIName]讨伐[secondary_recipient.GetShortUIName]"
 hd_court_order_campaign_decline_tt: "抗诏不遵，天下诸侯将以此为口实"
 hd_court_demand_tribute_interaction: "令其进贡"
 hd_court_demand_tribute_interaction_desc: "以朝廷名义，令[recipient.GetShortUIName]输送钱粮入朝"
 hd_court_demand_tribute_interaction_notification: "朝廷令[recipient.GetShortUIName]进贡"
 hd_court_emperor_prestige_tt: "天子须有足够的[prestige|E]，诸侯才会把诏令当回事"
 hd_court_request_campaign_interaction: "请诏讨伐"
 hd_court_request_campaign_interaction_desc: "请朝廷降诏，许你讨伐[secondary_recipient.GetShortUIName]"
 hd_court_request_campaign_interaction_notification: "[actor.GetShortUIName]请诏讨伐[secondary_recipient.GetShortUIName]"
 hd_court_return_land_interaction: "献地于朝廷"
 hd_court_return_land_interaction_desc: "把[target.GetName]交还天子，由朝廷另行分封"
 hd_court_return_land_interaction_notification: "[actor.GetShortUIName]把领地献于朝廷"

 hd_court_reason_zunhan: "尊奉汉室"
 hd_court_reason_moni: "不奉汉诏"
 hd_court_reason_friend_of_target: "与对方交好"
 hd_court_reason_rival_of_target: "与对方有隙"
 hd_court_reason_target_moni: "对方是谋逆之人"
 hd_court_reason_weaker_than_target: "兵力不及对方"
 hd_court_reason_at_war: "正在征战"
 hd_court_reason_asker_zunhan: "请诏者尊奉汉室"
 hd_court_reason_target_friend_of_court: "对方与朝廷交好"
 hd_court_reason_zunhan_to_emperor: "愿归天子"
 hd_court_reason_same_zunhan: "同奉汉室"
 hd_court_reason_zunhan_vs_moni: "耻与谋逆者为伍"
 hd_court_reason_moni_vs_emperor: "不屑归附天子"

 hd_court_defied_edict_modifier: "抗诏"
 hd_court_defied_edict_modifier_desc: "此人拒不奉诏，天下人都在看朝廷与诸侯如何待他。"
 hd_court_defied_edict_opinion: "抗诏不遵"
 hd_court_honored_by_court_opinion: "朝廷恩遇"
 hd_court_returned_land_opinion: "献地之功"

 # 奉诏讨伐 CB
 hd_court_fengzhao_cb: "奉诏讨伐"
 hd_court_fengzhao_cb_war_name: "[ATTACKER.GetShortUINamePossessive]奉诏之战"
 hd_court_fengzhao_cb_victory_desc: "[attacker.GetShortUIName|U]夺取目标郡中[defender.GetShortUINamePossessive]所据的各县。"
 hd_court_fengzhao_cb_white_peace_desc: "双方罢兵言和。"
 hd_court_fengzhao_cb_defeat_desc: "[attacker.GetShortUIName|U]讨伐失败，须向[defender.GetShortUIName]支付赔款。"

 # 第 4 期：天子反击
 hd_court_suborn_interaction: "暗中结纳"
 hd_court_suborn_interaction_desc: "以金帛私下结纳[recipient.GetShortUIName]，引为日后诛除权臣的同党"
 hd_court_suborn_interaction_notification: "天子暗中结纳[recipient.GetShortUIName]"
 hd_court_suborn_exposed_tt: "#EMP 此事若被权臣察觉，只会让他更加提防你。#!"
 hd_court_secret_edict_interaction: "衣带诏"
 hd_court_secret_edict_interaction_desc: "以血书密诏缝于衣带，托人带给[recipient.GetShortUIName]，命其起兵讨贼"
 hd_court_secret_edict_interaction_notification: "[recipient.GetShortUIName]接到了天子的衣带诏"
 hd_court_secret_edict_exposed_tt: "#EMP 密诏一旦泄露，宫中必有人为此丧命。#!"
 hd_court_flee_interaction: "出奔"
 hd_court_flee_interaction_desc: "趁夜潜出宫城，投奔[recipient.GetShortUIName]"
 hd_court_flee_interaction_notification: "天子欲出奔[recipient.GetShortUIName]处"
 hd_court_flee_success_tt: "若能脱身，[recipient.GetShortUIName]将接你入其境内，代你辅政"
 hd_court_flee_failure_tt: "若被拦截，你将被看管得更严"
 hd_court_closely_watched_tt: "你正被权臣严加看管"
 hd_court_reason_loyal: "忠于其主"
 hd_court_reason_greedy: "贪图金帛"
 hd_court_reason_ambitious: "心怀大志"
 hd_court_reason_rival_of_regent: "与权臣有隙"
 hd_court_reason_weaker_than_regent: "兵力不及权臣"

 hd_court_palace_coup_decision: "诛除权臣"
 hd_court_palace_coup_decision_desc: "宫门的守卫里有我的人，权臣的门下也有我的人。只等一个时机——他入宫奏事的那一天。"
 hd_court_palace_coup_decision_tooltip: "与暗中结纳的同党一同发难，诛杀权臣"
 hd_court_palace_coup_decision_confirm: "今日必诛此贼！"
 hd_court_palace_coup_decision_effect_tt: "#EMP 成则亲政，败则同党尽死。同党越多、你的[intrigue|E]越胜于权臣，胜算越大。#!"
 hd_court_coup_supporters_tt: "须有至少三名仍在世的同党"
 hd_court_raise_guards_decision: "募亲兵近卫"
 hd_court_raise_guards_decision_desc: "宫中的卫士换了一批又一批，没有一个是我的人。若能亲自挑选几名勇士宿卫左右，至少夜里能睡得安稳些。"
 hd_court_raise_guards_decision_tooltip: "召募两名勇武之士入宫宿卫，日后可为诛除权臣的同党"
 hd_court_raise_guards_decision_confirm: "选其勇者，宿卫宫禁！"
 hd_court_guards_cooldown_tt: "你近来已召募过近卫"

 hd_court_closely_watched_modifier: "严加看管"
 hd_court_closely_watched_modifier_desc: "此人身边的每一个人都可能是权臣的耳目。"
 hd_court_restored_emperor_opinion: "还政之恩"
 hd_court_plotted_against_opinion: "图谋于我"
 hd_court_suspicious_opinion: "心生猜疑"

 hd_court.0010.t: "迎还天子"
 hd_court.0010.desc: "贼党已破，宫门大开。[hd_court_restore_emperor.GetTitledFirstName]站在殿前，手里还攥着那条衣带。他看着你，没有说话。\n\n当初你是奉诏而来。如今诏书上的事已经办完，接下来的事，诏书上没有写。"
 hd_court.0010.a: "臣奉诏讨贼，今当还政于陛下。"
 hd_court.0010.b: "天下未定，陛下还须有人辅佐。"
 hd_court.0011.t: "殿上伏甲"
 hd_court.0011.desc: "权臣如往常一样入宫奏事，解剑脱履，步上殿阶。埋伏在帷幕后的甲士一拥而上。\n\n血迹还没擦净，你已经坐回了御座。这一次，没有人站在你身后替你说话了。"
 hd_court.0011.a: "朕，今日始亲政。"
 hd_court.0012.t: "事泄"
 hd_court.0012.desc: "约定的时辰到了，殿外却迟迟没有动静。等来的是权臣的甲士，他们押着你的同党一个个走过殿前。\n\n没有人来押你。权臣只是派人告诉你：陛下近来劳累，宜在宫中静养。"
 hd_court.0012.a: "……"
 hd_court.0014.t: "夜出宫门"
 hd_court.0014.desc: "车驾在夜色中出了城，沿途换了三次马。天明时分，接应的兵马已在道旁列队。\n\n你终于离开了那座宫城。前方迎你的人会不会成为下一个权臣，此刻已顾不上了。"
 hd_court.0014.a: "且先脱此樊笼。"
 hd_court.0015.t: "追还"
 hd_court.0015.desc: "车驾刚出城门不远，追兵便到了。随行的人被一一带走，你被“请”回了宫中。\n\n从那天起，你寝殿外的守卫多了一倍。"
 hd_court.0015.a: "天不助我。"

 hd_court_welcome_army_toast: "喜迎王师"
 hd_court_welcome_army_toast_desc: "城中父老箪食壶浆，迎接勤王之师。"

 # 第 5 期：篡位与僭号
 hd_court_abdication_decision: "逼宫受禅"
 hd_court_abdication_decision_desc: "辅政多年，天下早已知道诏书出自谁手。坛场已经筑好，百官的劝进表也堆满了案头。只差天子亲手捧出那枚玉玺。"
 hd_court_abdication_decision_tooltip: "令天子禅位于你，你取天命，旧天子降为公"
 hd_court_abdication_decision_confirm: "天命在我！"
 hd_court_abdication_decision_effect_tt: "你登上帝位，取得天命；旧天子退居封国。此举名分不正，天下尊汉之人必不服你，诸侯也将以讨篡为名兴兵"
 hd_court_depose_ceremonial_decision: "废为虚位"
 hd_court_depose_ceremonial_decision_desc: "何必费心筑坛受禅？天子仍可住在宫里，照旧受百官朝拜，只是从此不必再过问天下的事。"
 hd_court_depose_ceremonial_decision_tooltip: "自取天命，留旧天子一个虚位"
 hd_court_depose_ceremonial_decision_confirm: "陛下宜善自珍重。"
 hd_court_depose_ceremonial_decision_effect_tt: "你取得天命，旧天子保有虚位、受你节制。此举比受禅更难服众，天下尊汉之人必不服你，诸侯也将以讨篡为名兴兵"
 hd_court_regent_tenure_tt: "你辅政未久，人心未附"
 hd_court_abdicated_title_name: "山阳"
 hd_court_ceremonial_title_name: "汉室"
 hd_court_ceremonial_monarch_modifier: "虚位天子"
 hd_court_ceremonial_monarch_modifier_desc: "此人仍受百官朝拜，却已不能过问天下之事。"
 hd_court_usurper_opinion: "篡汉之贼"

 hd_court_proclaim_emperor_decision: "僭号称帝"
 hd_court_proclaim_emperor_decision_desc: "汉室衰微已久，天子不过是别人手中的一枚印信。我据有一方，兵精粮足，百姓归心，为何不能自立名号？"
 hd_court_proclaim_emperor_decision_tooltip: "自立帝号，与汉天子分庭抗礼"
 hd_court_proclaim_emperor_decision_confirm: "代汉者，当涂高也！"
 hd_court_proclaim_emperor_decision_effect_tt: "你自立为帝，分走汉天子一半的正统；从此你便是谋逆之人，尊汉的邻国将奉诏讨伐你"
 hd_court_proclaim_size_tt: "须据有至少三十县之地"
 hd_court_proclaim_army_tt: "兵力须不弱于天子（或挟天子者）"
 hd_court_proclaim_popular_tt: "治下多数县份须民心归附"
 hd_court_pseudo_empire_name: "[hd_court_pseudo_founder.GetPrimaryTitle.GetBaseName]"
 hd_court_pseudo_emperor_modifier: "僭号称帝"
 hd_court_pseudo_emperor_modifier_desc: "此人自立帝号，与汉天子分庭抗礼。"
 hd_court_pseudo_emperor_opinion: "僭号之贼"

 hd_court.0020.t: "汉祚移易"
 hd_court.0020.desc: "消息传遍天下：[hd_court_usurper.GetTitledFirstName]已登上帝位，[hd_court_deposed_emperor.GetTitledFirstName]交出了玉玺。\n\n有人说这是天命所归，有人说这是篡逆。各地的州郡都在观望，不少人已经开始寻找讨伐的名义。"
 hd_court.0020.a: "天命之说，向来由胜者书写。"
 hd_court.0021.t: "僭号"
 hd_court.0021.desc: "[hd_court_pseudo_founder.GetTitledFirstName]筑坛祭天，自立为帝，改元建号，置百官，立宗庙。\n\n汉天子尚在，天下便有了两个天子。尊奉汉室的人纷纷上书，请求讨伐这个僭越之徒。"
 hd_court.0021.a: "天有二日，民有二主。"

 hd_court_taocuan_cb: "讨篡"
 hd_court_taocuan_cb_war_name: "[ATTACKER.GetShortUINamePossessive]讨篡之战"
 hd_court_taocuan_cb_victory_desc: "[attacker.GetShortUIName|U]讨平篡逆，取天命而代之。"
 hd_court_taocuan_cb_white_peace_desc: "双方罢兵言和。"
 hd_court_taocuan_cb_defeat_desc: "[attacker.GetShortUIName|U]讨篡失败，须向[defender.GetShortUIName]支付赔款。"

 # 第 6 期：都督区
 hd_court_dudu_grant_claim_interaction: "遥授宣称"
 hd_court_dudu_grant_claim_interaction_desc: "以朝廷名义，许[recipient.GetShortUIName]对邻境一郡的[claims|E]，由其自行择机征讨"
 hd_court_dudu_grant_claim_interaction_notification: "朝廷许[recipient.GetShortUIName]征讨邻郡"

 # 复核补充：被挟持的天子锁权
 hd_court_emperor_held_blocked_tt: "你受制于权臣，不能对他下手"
