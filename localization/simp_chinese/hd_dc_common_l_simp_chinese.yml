l_simp_chinese:
 hd_dc_com.0004.t: "落印之前"
 hd_dc_com.0004.desc: "案上并排放着两份文书，一份留给[hd_dc_proposer.GetTitledFirstName]，另一份送往[hd_dc_recipient.GetTitledFirstName]处。使者没有催促，只把尚未落印的地方转向了我。\n\n[SCOPE.GetFlagName('hd_dc_proposal_terms')]\n\n纸上的字可以写得周全。落印以后，谁先把承诺变成事实，才是众人真正等着看的事。"
 hd_dc_com.0004.a: "按这些明确条款签署。"
 hd_dc_com.0004.a.tt: "签署这份约定。款项、职权和军事安排须依约实际执行，随后才能核算履约成果。"
 hd_dc_com.0004.b: "还需要这项对等保证，才能接受。"
 hd_dc_com.0004.b.tt: "提出修订条款，等待另一方答复：\n[SCOPE.GetFlagName('hd_dc_counter_terms')]"
 hd_dc_com.0004.c: "这些条件不能接受。"
 hd_dc_signed_terms_opinion: "共同签署约定"
 hd_dc_counter_terms_opinion: "要求追加保证"
 hd_dc_rejected_terms_opinion: "拒绝所提条件"
 hd_dc_theft_pending_credit_tt: "国库已实际扣走的款项尚未全部到账。未到账部分保留在本次提款记录中；再次处理同一记录不会重新扣款。"
