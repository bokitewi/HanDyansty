l_simp_chinese:
 hd_dc_com.0004.t: "落印之前"
 hd_dc_com.0004.desc: "文书在[hd_dc_proposer.GetTitledFirstName]与[hd_dc_recipient.GetTitledFirstName]之间往返，如今送到了你的案前。使者没有催促，只把尚未落印的地方转向了你。\n\n[SCOPE.GetFlagName('hd_dc_proposal_terms')]\n\n话可以写得周全。落了印之后，谁先把承诺做成实事，才是众人真正在看的。"
 hd_dc_com.0004.a: "依此落印。"
 hd_dc_com.0004.a.tt: "落印之后，彼此便须依约行事："
 hd_dc_com.0004.b: "须再添一层保证，方可应允。"
 hd_dc_com.0004.b.tt: "改以下列条件复书，请对方再议：\n[SCOPE.GetFlagName('hd_dc_counter_terms')]"
 hd_dc_com.0004.c: "此约不可许。"
 hd_dc_signed_terms_opinion: "同署一约"
 hd_dc_counter_terms_opinion: "要求追加保证"
 hd_dc_rejected_terms_opinion: "拒绝所提条件"
