 wj_kaoke_table_decision:0 "查阅全朝考课表"
 wj_kaoke_table_decision_confirm:0 "呈上考课表"
 wj_kaoke_table_decision_desc:0 "尚书台将本朝地方官的课簿汇成一表，呈到你的案前。孰勤孰怠，一览可知。"
 wj_kaoke_table_decision_tooltip:0 "翻阅本朝地方官的考课"

 # 来源：localization/simp_chinese/WJ_kaoke_l_simp_chinese.yml
 wj_kaoke_ledger_decision:0 "查阅考课簿"
 wj_kaoke_ledger_decision_confirm:0 "呈上簿册"
 wj_kaoke_ledger_decision_desc:0 "书吏捧来你的考课簿：本期办过的公务、亲历的战阵、断过的案牍，都一一记在你的名下。纵使转任他处，这本簿子也随你而行。"
 wj_kaoke_ledger_decision_tooltip:0 "翻阅本期功过、上次考第与考功之法"

 # 来源：localization/simp_chinese/WJ_military_governance_l_simp_chinese.yml
 WJ_zw_acquire_decision:0 "请诏总督中外"
 WJ_zw_acquire_decision_confirm:0 "上表请诏"
 WJ_zw_acquire_decision_desc:0 "内掌尚书之奏，外系将相之望。既承录尚书事之重，朝中要职又多有相与之人，今可请降诏命，总督中外诸军事，假黄钺以一军令。\n\n须为天子直属的在任摄政；侍中、大将军、尚书令、大司马四席中至少三席由你本人、门生、直接幕僚或同宗族者担任，且本朝无人已任都督中外。此处按席计数，一人兼任可以占多席，并非控制天子所需的两名不同支持者。"
 WJ_zw_acquire_decision_tooltip:0 "请颁总督中外诸军事、假黄钺的诏命"

 # 来源：localization/simp_chinese/WJ_ministry_l_simp_chinese.yml
 wj_create_cheng_xiang_decision:0 "拜相秉政"
 wj_create_cheng_xiang_decision_confirm:0 "拜相秉政"
 wj_create_cheng_xiang_decision_desc:0 "丞相之位久虚。非常之时，当有非常之人总揽朝政。以我今日之望，正可请天子拜我为相，入阁秉政，代行万机。\n\n须为汉廷霸权治下、最高头衔为王国级的郡国制人物，丞相官署尚未设立，并符合现行内阁任职、贤望及剧本限制。隐居、辞谢任命或留任限制未解除时不能请拜。\n\n受拜后保留本人原有地方头衔、封臣与治所，不改法理，也不因此取得新的头衔兵权限。以丞相摄政法入掌录尚书事后，同授都督中外诸军事、假黄钺，不必另行请诏或取得三席支持。调拨限天子与本人之间，依原规则接收兵士，不凭空生成军队。"
 wj_create_cheng_xiang_decision_tooltip:0 "受拜丞相，入阁秉政，成为天子的摄政"
 WJ_chengxiang_government_tt:0 "本人实行郡国制"
 WJ_chengxiang_rank_tt:0 "本人当前最高头衔恰为王国级（州级），而非帝国级朝臣或实封王"
 WJ_chengxiang_court_tt:0 "汉廷霸权仍有持有人，且其为本人的最高领主"
 WJ_chengxiang_ministry_tt:0 "本朝仍使用朝廷内阁制度"
 WJ_chengxiang_vacant_tt:0 "丞相官署尚未设立，不能以此决议替换现任丞相"
 WJ_chengxiang_installed_title:0 "拜相秉政"
 WJ_chengxiang_installed_tt:0 "你已受拜丞相，入阁秉政；原地方头衔、封臣与治所保留，法理和头衔兵权限不变。"

 # 来源：localization/simp_chinese/WJ_office_roads_loc_l_simp_chinese.yml
 wj_langguan_kaoxiao_decision:0 "郎官考校"
 wj_langguan_kaoxiao_decision_confirm:0 "入署受考"
 wj_langguan_kaoxiao_decision_desc:0 "郎官署的考校又要开始了。经义、律令、奏对，三场下来，方知这些年的学问是否扎实。若能过关，便以孝廉出身离署入仕；若不能，只好留署一年，来年再考。"
 wj_langguan_kaoxiao_decision_tooltip:0 "参加郎官考校"
 wj_temp_official_kaoke_decision:0 "奏请考课"
 wj_temp_official_kaoke_decision_confirm:0 "呈牍受考"
 wj_temp_official_kaoke_decision_desc:0 "以假吏之身试守，转眼已满一年。如今正可将任内的簿书与治绩呈报有司，听候考课。考课重在治事之才；若能过关，便按现任官职的高下，得举孝廉或茂才出身。"
 wj_temp_official_kaoke_decision_tooltip:0 "呈报治绩，接受考课，以求正式入仕"

 # 来源：localization/simp_chinese/WJ_yangwang_l_simp_chinese.yml
 WJ_yangwang_rename_decision:0 "更改雅号"
 WJ_yangwang_rename_decision_confirm:0 "另择雅号"
 WJ_yangwang_rename_decision_desc:0 "旧号用得久了，未必还合今日的心境。另取一个雅号，聊寄胸中所怀。"
 WJ_yangwang_rename_decision_tooltip:0 "更改隐士特质显示的雅号"
