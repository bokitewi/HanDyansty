l_simp_chinese:
 # 2026-10-25：190 历史事件新增——蒯越献策平定江南（hd190.0002~0005）、李傕郭汜相攻（hd190.0006~0007）
 hd190.0002.t:0 "蒯越献策"
 hd190.0002.desc:0 "初平元年，你受诏为荆州刺史。其时江南宗贼大盛：苏代领长沙太守，贝羽为华容长，各自阻兵作乱；江夏贼张虎、陈生拥众据襄阳城。袁术又屯兵鲁阳，道路梗塞，刺史不得入治。\n\n你单马入宜城，请南郡名士蒯良、蒯越共谋。蒯越进言：「治平者先仁义，治乱者先权谋。宗贼帅多贪暴，为下所患。越有所素养者，使示之以利，必以众来。君诛其无道，抚而用之，一州之人有乐存之心。兵集众附，南据江陵，北守襄阳，荆州八郡可传檄而定。」"
 hd190.0002.a:0 "依异度之计。"
 hd190.0002.a.tt:0 "半年之后，江南宗贼帅将应召赴宴伏诛，张虎、陈生将受降入幕；长沙、南平、襄阳、南乡尽归你直辖，你将移治襄阳。"
 hd190.0002.b:0 "宗贼之事，且从缓议。"
 hd190.0002.b.tt:0 "不用蒯越之计，江南诸帅留待日后以兵戈平定。"
 hd190.0003.t:0 "宜城之宴"
 hd190.0003.desc:0 "刘表遣使持书而来，说荆州初定，愿与郡中豪帅共图大事，邀你赴宜城宴会，并许以官爵。使者又说，江南诸帅应召动身的已有数十人。\n\n帐下有人低声相劝：刘景升单马入荆州，手中并无多少兵马，何以厚待宗帅至此？"
 hd190.0003.a:0 "赴宴。"
 hd190.0003.b:0 "托病不往。"
 hd190.0003.b.tt:0 "刘表将兴兵来攻。"
 hd190.0004.t:0 "单骑说降"
 hd190.0004.desc:0 "蒯越与庞季二人不带一兵一卒，单骑来到营前求见。蒯越陈说利害：江南宗帅应召赴宴者已尽数伏诛，刘使君兵集众附，你据守的不过是一座孤城，旦夕可下；若肯解甲归降，仍可保全性命，身列幕府。"
 hd190.0004.a:0 "解甲归降。"
 hd190.0004.b:0 "据城死守。"
 hd190.0004.b.tt:0 "刘表将兴兵来攻。"
 hd190.0005.t:0 "江南悉平"
 hd190.0005.desc:0 "依蒯越之计，你遣人遍邀江南宗贼帅赴宜城之宴。应召而来者，席间尽数伏诛，其部曲悉归麾下；蒯越、庞季又单骑往说襄阳，张虎、陈生相继请降。\n\n应命者皆已平定，仍有拒命不至的，唯有以兵临之。荆州八郡，至此可传檄而定。"
 hd190.0005.a:0 "异度之谋，胜过十万之师。"
 hd190.0006.t:0 "李郭相攻"
 hd190.0006.desc_fan:0 "兴平二年春，你于座中使胡封拉杀樊稠，诸将由是各怀疑惧。郭汜常来你处宴饮，有时留宿不归。郭汜之妻怕你以婢妾夺其所爱，便在你送去的酒食里置豉为药，指给郭汜看，说一栖不容两雄。后来你又请郭汜饮酒，郭汜大醉而归，疑你下毒，饮粪汁方才解去。\n\n于是郭汜治兵与你相攻。你留据[hd190_lg_li_duchy.GetName]，郭汜退据[hd190_lg_guo_duchy.GetName]；关中其余诸县各自为守，不再听命。"
 hd190.0006.desc:0 "兴平二年春，郭汜常来你处宴饮，有时留宿不归。郭汜之妻怕你以婢妾夺其所爱，便在你送去的酒食里置豉为药，指给郭汜看，说一栖不容两雄。后来你又请郭汜饮酒，郭汜大醉而归，疑你下毒，饮粪汁方才解去。\n\n于是郭汜治兵与你相攻。你留据[hd190_lg_li_duchy.GetName]，郭汜退据[hd190_lg_guo_duchy.GetName]；关中其余诸县各自为守，不再听命。"
 hd190.0006.a:0 "竖子安敢如此！"
 hd190.0007.t:0 "一栖不两雄"
 hd190.0007.desc_fan:0 "兴平二年春，李傕于座中使胡封拉杀樊稠，诸将由是各怀疑惧。你常去李傕处宴饮，有时留宿不归。你的妻子怕李傕以婢妾夺你所爱，便在李傕送来的酒食里置豉为药，指给你看，说一栖不容两雄。后来李傕又请你饮酒，你大醉而归，疑他下毒，饮粪汁方才解去。\n\n如今你已退据[hd190_lg_guo_duchy.GetName]，与李傕各领一郡；关中其余诸县各自为守。是否即刻举兵攻打李傕？"
 hd190.0007.desc:0 "兴平二年春，你常去李傕处宴饮，有时留宿不归。你的妻子怕李傕以婢妾夺你所爱，便在李傕送来的酒食里置豉为药，指给你看，说一栖不容两雄。后来李傕又请你饮酒，你大醉而归，疑他下毒，饮粪汁方才解去。\n\n如今你已退据[hd190_lg_guo_duchy.GetName]，与李傕各领一郡；关中其余诸县各自为守。是否即刻举兵攻打李傕？"
 hd190.0007.a:0 "即刻举兵！"
 hd190.0007.a.tt:0 "以「吞并」对李傕宣战；开战后得一支部众（重步兵35队、重骑兵60队）。"
 hd190.0007.b:0 "暂且按兵不动。"
 hd190.0008.t:0 "郭汜据扶风"
 hd190.0008.desc:0 "兴平二年春，李傕、郭汜在长安互疑下毒，治兵相攻。郭汜率众西走，据郿，尽有扶风之地。\n\n你在扶风的领地，或已为郭汜所夺，或只得改奉郭汜为主。"
 hd190.0008.a:0 "乱兵当道，无可奈何。"
