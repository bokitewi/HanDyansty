l_simp_chinese:
 hd_story_cao_expansion:0 "曹操：势力扩张"
 hd_story_cao_expansion_desc:0 "讨董联盟已经落幕。曹操以一州为当前进军方向，逐步整合各地独立势力。"
 HD_CAO_EXPANSION_STORY_STATUS:0 "当前地区的扩张脉冲每60天检查一次。AI曹操在现有战争少于3场时，最多对一名军力不超过自身两倍的合法目标宣战。完全控制当前地区，或已无符合军力条件的独立势力且没有该地区待决进攻战争时，进入下一轮“势力扩张”。玩家曹操需要自行宣战。"
 hd_cao_expansion.0001.t:0 "势力扩张"
 hd_cao_expansion.0001.desc:0 "这一阶段的进军已经告一段落。或是州郡已归于麾下，或是余下势力尚非此时可以进取，旧有部署应当暂告结束。\n\n我展开舆图，重新审视豫州、青州与徐州的形势。接下来，军旗应当指向何方？"
 hd_cao_expansion.0001.a:0 "向豫州进军"
 hd_cao_expansion.0001.b:0 "向青州进军"
 hd_cao_expansion.0001.c:0 "向徐州进军"
 hd_cao_expansion.0001.d:0 "三州已定，整饬疆土。"
 hd_cao_expansion.yuzhou_tt:0 "取得豫州王国的宣称（已经持有该头衔或宣称时不重复授予），并开启豫州60日扩张脉冲。当前脉冲结束后，“势力扩张”将再次出现。"
 hd_cao_expansion.qingzhou_tt:0 "取得青州王国的宣称（已经持有该头衔或宣称时不重复授予），并开启青州60日扩张脉冲。当前脉冲结束后，“势力扩张”将再次出现。"
 hd_cao_expansion.xuzhou_tt:0 "取得徐州王国的宣称（已经持有该头衔或宣称时不重复授予），并开启徐州60日扩张脉冲。当前脉冲结束后，“势力扩张”将再次出现。"
 hd_cao_expansion.finished_tt:0 "豫州、青州、徐州的法理伯爵领均已纳入你的领国。地区扩张故事到此结束，不再自动开启新脉冲。"
 hd_cao_expansion_cb:0 "势力扩张"
 hd_cao_expansion_cb_name:0 "势力扩张"
 hd_cao_expansion_cb_war:0 "曹操的地区扩张战争"
 hd_cao_expansion_cb_war_name:0 "曹操的地区扩张战争"
 hd_cao_expansion_cb_victory_desc:0 "曹操取得防守方在本次战争目标王国法理范围内的伯爵领，所属男爵封臣随领转移；不取得州外土地，也不自动夺取王国头衔。"
 hd_cao_expansion_cb_white_peace_desc:0 "双方停战，不转移任何领地。"
 hd_cao_expansion_cb_defeat_desc:0 "曹操的此次扩张失败，双方停战，不转移任何领地。"
 hd_cao_expansion_cb_invalidated_desc:0 "扩张战争因主角失效、敌对关系消失或原战争目标已不存在而终止，不转移领地。"
