l_simp_chinese:
 hd_story_cao_expansion:0 "曹操：势力扩张"
 hd_story_cao_expansion_desc:0 "讨董联盟已然散去。曹操每以一州为进军方向，逐一收服各地割据之众。"
 HD_CAO_EXPANSION_STORY_STATUS:0 "曹操正以一州为方向用兵；待此州平定，或州中再无可图之敌，便另议下一路。此路战事，须由曹操亲自下令兴兵。"
 hd_cao_expansion.0001.t:0 "兵锋所向"
 hd_cao_expansion.0001.desc:0 "诸将把上一路军务禀完，你却没有让他们退下。图还铺着，兵粮也已核过，正好议一议，接下来该让哪一处先听见你的鼓声。\n\n豫州、青州、徐州，名字念出来都很轻，真要取下，却得把大军一里一里地带过去。你问过守军与粮道，听见有人又开始重复旧议，便抬手止住。旧令办到了哪里，心中有数即可，不必再拿来填满今日。\n\n三州之中，若尚有未定者，便择其要者先行；若都已在手，便该让所得真正为你所用。你把一枚令签捏在指间，等最后一份军情说完。"
 hd_cao_expansion.0001.a:0 "兵进豫州。"
 hd_cao_expansion.0001.b:0 "兵进青州。"
 hd_cao_expansion.0001.c:0 "兵进徐州。"
 hd_cao_expansion.0001.d:0 "三州已定，整饬疆土。"
 hd_cao_expansion.yuzhou_tt:0 "你将兵锋指向豫州；待此路事毕，再议下一步。"
 hd_cao_expansion.qingzhou_tt:0 "你将兵锋东指青州；待此路事毕，再议下一步。"
 hd_cao_expansion.xuzhou_tt:0 "你将兵锋转向徐州；待此路事毕，再议下一步。"
 hd_cao_expansion.finished_tt:0 "豫、青、徐三州已尽入你的版图，你不再四出征伐，转而整饬所得疆土。"
 hd_cao_expansion_cb:0 "势力扩张"
 hd_cao_expansion_cb_name:0 "势力扩张"
 hd_cao_expansion_cb_war:0 "曹操的地区扩张战争"
 hd_cao_expansion_cb_war_name:0 "曹操的地区扩张战争"
 hd_cao_expansion_cb_victory_desc:0 "曹操夺取目标州内敌方所据之地，当地封臣随之改投。"
 hd_cao_expansion_cb_white_peace_desc:0 "双方罢兵，各守原境。"
 hd_cao_expansion_cb_defeat_desc:0 "曹操此番进军无功而返，各守原境。"
 hd_cao_expansion_cb_invalidated_desc:0 "此战失了名目，就此作罢，各守原境。"
