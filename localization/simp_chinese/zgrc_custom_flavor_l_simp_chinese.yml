l_simp_chinese:

 # 2026-11-01 汉地风俗 1.5.3（创意工坊 3812432062）并入的新键
 zgrc_custom_flavor.0001.t:0 "风俗纪要"
 zgrc_custom_flavor.0001.desc:0 "里中父老来告：今岁风俗之会已定仪注，请[ROOT.Char.GetName]莅临观礼。\n\n（占位文本：传统・风味事件样张，用于验证自定义事件背景图。）"
 zgrc_custom_flavor.0001.a:0 "好，且去一观。"
 zgrc_custom_flavor.1001.t:0 "巫觋叩门"
 zgrc_custom_flavor.1001.desc:0 "门外站着个巫者，一路风尘，开口便是楚地的腔调。\n\n楚人尚鬼，乡里来一两个巫觋本不稀奇。稀奇的是，他张口便唤出了[zgrc_hun_target.GetName]的名字。\n\n「形还在，魂走了。」他往屋里探了探头，「这不是病，是丢了。我有法子些。」\n\n说完他便把手拢进袖里，不言语了——像是要看我到底有几分诚心。"
 zgrc_custom_flavor.1001.a:0 "请进。香火钱少不了你的。"
 zgrc_custom_flavor.1001.b:0 "一派胡言。"
 zgrc_custom_flavor.1002.t:0 "魂兮归来"
 zgrc_custom_flavor.1002.desc:0 "空阔之地，夜色如墨。\n\n我照着那巫者教的法子，唤[zgrc_hun_target.GetName]的名字：\n\n「魂兮归来！」\n「去君之恒干，何为四方些？」\n\n声音散进夜色，四野寂然。"
 zgrc_custom_flavor.1002.a:0 "魂兮归来！"
 zgrc_custom_flavor.1002.b:0 "不过镜花水月。"
 zgrc_custom_flavor.1003.t:0 "魂兮何往"
 zgrc_custom_flavor.1003.desc:0 "恍惚之中，有一声呼唤自极远处传来，一声，又一声。\n\n我听出来了——是[zgrc_hun_helper.GetName]。\n是他在唤我的名字。\n\n我仿佛离体已久，不知身在何方。四方昏昧，唯有一线微光可循。\n\n我该往哪儿去？"
 zgrc_custom_flavor.1003.dong:0 "东方？"
 zgrc_custom_flavor.1003.nan:0 "南方？"
 zgrc_custom_flavor.1003.xi:0 "西方？"
 zgrc_custom_flavor.1003.bei:0 "北方？"
 zgrc_custom_flavor.1003.none:0 "四方已遍，魂无所之"
 zgrc_custom_flavor.1004.t:0 "魂兮归去"
 zgrc_custom_flavor.1004.desc_dong:0 "东方不可以托些。\n长人千仞，惟魂是索些。\n十日代出，流金铄石些。\n彼皆习之，魂往必释些。\n归来兮！不可以托些。\n\n我循着那线微光而行。脚下是无尽的金色荒原。"
 zgrc_custom_flavor.1004.desc_nan:0 "南方不可以止些。\n蝮蛇蓁蓁，封狐千里些。\n雄虺九首，往来倏忽，吞人以益其心些。\n归来兮！不可以久淫些。\n\n我循着那线微光而行。风里尽是焦热与腥甜。"
 zgrc_custom_flavor.1004.desc_xi:0 "西方之害，流沙千里些。\n旋入雷渊，爢散而不可止些。\n幸而得脱，其外旷宇些。\n\n我循着那线微光而行。眼前幻境层叠，如水如镜。"
 zgrc_custom_flavor.1004.desc_bei:0 "北方不可以止些。\n增冰峨峨，飞雪千里些。\n归来兮！不可以久些。\n\n我循着那线微光而行。天地间只余风雪。"
 zgrc_custom_flavor.1004.a:0 "循声而行。"
 zgrc_custom_flavor.1005.t:0 "返故居些"
 zgrc_custom_flavor.1005.desc:0 "一声呼唤忽至，如绳索引我归返。\n\n我猛地睁眼。先动的是手指，再是手臂——四肢百骸，重归我有。我几乎笑出声来。\n\n那呼唤犹在耳畔。是[zgrc_hun_helper.GetName]的声音。\n\n是他，一声一声，把我从四方唤了回来。"
 zgrc_custom_flavor.1005.a:0 "我醒来了！"
 zgrc_custom_flavor.1006.t:0 "重逢"
 zgrc_custom_flavor.1006.desc:0 "门外有人。\n\n是[zgrc_hun_target.GetName]。他扶着门框站着，脸色还白，气息也弱。\n\n看见我，他眼里亮了一下。这些日子我唤过千百遍的名字，此刻就站在眼前。"
 zgrc_custom_flavor.1006.a:0 "你终于回来了。"
 zgrc_custom_flavor.1007.t:0 "重逢"
 zgrc_custom_flavor.1007.desc:0 "我循着那声音找了过去。\n\n他就在那里——像是已经喊了千百遍，见我来了，唇动了动，却什么也没说出来。\n\n千山万里，我到底还是回来了。"
 zgrc_custom_flavor.1007.a:0 "我回来了。"
 zgrc_custom_flavor.1008.t:0 "重归死寂"
 zgrc_custom_flavor.1008.desc:0 "那呼唤停了。\n\n起初我还在等下一声，等它再响起来。可旷野无声，一声也没有了。\n\n四方之暗重新合拢，掩住最后一线微光。\n\n死寂。重归死寂。"
 zgrc_custom_flavor.1008.a:0 "……"
 zgrc_custom_flavor.1011.t:0 "巫觋叩门"
 zgrc_custom_flavor.1011.desc:0 "又是那个楚地的巫者，风尘满面地叩门。\n\n我提起[zgrc_hun_target.GetName]。他眯起眼，摇了摇头：\n\n「去了的人，魂早散在四方了。招得回活人，招不回死者些。」\n\n「不过——」他顿了顿，把手拢进袖里，「你若真有诚心，法子我照教。」\n\n他没有再说话，只是等着。"
 zgrc_custom_flavor.1011.a:0 "招。香火钱少不了你的。"
 zgrc_custom_flavor.1011.b:0 "人死如灯灭，不必了。"
 zgrc_custom_flavor.1012.t:0 "魂兮归来"
 zgrc_custom_flavor.1012.desc:0 "我照着那巫者教的法子，唤[zgrc_hun_target.GetName]的名字：\n\n「魂兮归来！」\n「返故居些。」\n\n旷野无声。"
 zgrc_custom_flavor.1012.a:0 "魂兮归来！"
 zgrc_custom_flavor.1012.b:0 "不过镜花水月。"
 zgrc_custom_flavor.3001.t:0 "吴越剑客"
 zgrc_custom_flavor.3001.desc:0 "一名佩剑的汉子拦在道旁。衣衫半旧，剑鞘却擦得极干净，像是日日拂拭。\n\n「客官。」他解下腰间长剑，抽出半寸——寒光里有一线暗痕，不是锈。\n\n「吴越之剑，天下无出其右。我落难到此，别无长物，只这一把还值些钱。」\n\n他握剑的手很稳，指节泛白。眼里没有半分乞求，倒像在等我的反应。"
 zgrc_custom_flavor.3001.a:0 "这剑，我买了。"
 zgrc_custom_flavor.3001.b:0 "拔剑吧。"
 zgrc_custom_flavor.3001.b_tt:0 "与他单挑。胜者得剑，#EMP 生死由命#!。"
 zgrc_custom_flavor.3001.c:0 "留下吧，做我的客卿。"
 zgrc_custom_flavor.3001.d:0 "擦肩而过。"
 zgrc_custom_flavor.3001.win_t:0 "宝剑有德者居之"
 zgrc_custom_flavor.3001.win_tt:0 "他倒下时，手还按在剑柄上。你俯身取剑，剑身尚有余温。"
 zgrc_custom_flavor.3001.lose_t:0 "技不如人"
 zgrc_custom_flavor.3001.lose_tt:0 "剑锋擦着耳侧掠过。他收剑入鞘，看了你一眼，什么也没说，转身走了。"
 zgrc_custom_flavor.3101.t:0 "山阴石罅"
 zgrc_custom_flavor.3101.desc:0 "石壁裂开一线，冷气从里头渗出来，带着铁腥。\n\n缝口散着碎铁锈屑，阶石塌了半边，草从石缝里长出来。\n\n铁腥不是石头该有的味道。"
 zgrc_custom_flavor.3101.a:0 "进去看看。"
 zgrc_custom_flavor.3101.b:0 "不惹这晦气。"
 zgrc_custom_flavor.3102.t:0 "寒泉剑匣"
 zgrc_custom_flavor.3102.desc:0 "洞里冷得厉害，说话能看见白气。\n\n石案上搁着一只铜匣，锁扣早烂没了，只剩一道机簧咬着匣沿。\n\n匣面锈迹斑斑，依稀刻着四个汉字，被锈蚀得辨不出了。"
 zgrc_custom_flavor.3102.a:0 "开匣。"
 zgrc_custom_flavor.3102.b:0 "退出去。"
 zgrc_custom_flavor.3103.t:0 "雌雄双剑"
 zgrc_custom_flavor.3103.desc:0 "匣盖一开，寒气扑面。\n两柄剑并排躺着，一雄一雌，光在剑脊上走了一遭。\n竟是#EMP 干将、莫邪#!。\n\n\n#flavor 楚王命干将铸剑，三年乃成。干将知王必杀己，藏其雄而献其雌。时妻莫邪有孕，临行嘱曰:'若生男，告之——出户望南山，松生石上，剑在其背。'\n干将既死，其子名赤（世称赤比），及壮，依言得雄剑。楚王梦其欲报仇，悬赏千金购其头。赤比逃亡途中遇一义士，客曰:'闻王购子头千金，将子头与剑来，为子报之。'赤比遂自刎，奉头与剑。\n客持头见王。王烹头于鼎，三日不烂，头跃出汤中，怒目而视。客请王临视，斩王，头堕于鼎；客亦自刎。三头俱烂，莫能辨，分而葬之，是为三王墓。#!"
 zgrc_custom_flavor.3103.a:0 "收了。"
 zgrc_custom_flavor.3101.avoid_tt:0 "脚底下一虚。我停住，把重心移回实处，才看清那级石阶已经酥了。"
 zgrc_custom_flavor.3101.hurt_tt:0 "石阶塌了。我顺着坡滚下去，手肘在石头上磨掉一层皮。"
 zgrc_custom_flavor.3101.collapse_tt:0 "石屑落定，洞口已看不出原来的样子。"
 zgrc_custom_flavor.3102.avoid_tt:0 "那道机簧还咬着劲。我按住簧片，才把匣盖提起来。"
 zgrc_custom_flavor.3102.hurt_tt:0 "机簧弹开，一根锈刺扎进掌心。"
 zgrc_custom_flavor.3104.t:0 "宝剑现世"
 zgrc_custom_flavor.3104.desc:0 "乡里近来传一句话：宝剑出世。说是[ROOT.Var('zgrc_sword_finder').Char.GetName]从石缝里起出一对剑，一雄一雌，剑上错着名字。\n「干将、莫邪。」乡野之言本不足信。可这两个名字，不是乡下铁匠撑得起的。\n\n\n#flavor 楚王命干将铸剑，三年乃成。干将知王必杀己，藏其雄而献其雌。时妻莫邪有孕，临行嘱曰:'若生男，告之——出户望南山，松生石上，剑在其背。'\n干将既死，其子名赤（世称赤比），及壮，依言得雄剑。楚王梦其欲报仇，悬赏千金购其头。赤比逃亡途中遇一义士，客曰:'闻王购子头千金，将子头与剑来，为子报之。'赤比遂自刎，奉头与剑。\n客持头见王。王烹头于鼎，三日不烂，头跃出汤中，怒目而视。客请王临视，斩王，头堕于鼎；客亦自刎。三头俱烂，莫能辨，分而葬之，是为三王墓。#!"
 zgrc_custom_flavor.3104.a:0 "去信索要，许以重金。"
 zgrc_custom_flavor.3104.b:0 "此乃祥瑞，当布告天下。"
 zgrc_custom_flavor.3105.t:0 "索剑"
 zgrc_custom_flavor.3105.desc:0 "[ROOT.Var('zgrc_sword_liege').Char.GetName]的书信，送到了。\n\n信上说，听闻我得了两柄剑；他对宝剑颇有涉猎，让我把剑送去，并许诺重金答谢。\n\n墨迹很新，折痕却深——这信写过不止一遍。"
 zgrc_custom_flavor.3105.a:0 "全都送去。"
 zgrc_custom_flavor.3105.b:0 "卖了罢。"
 zgrc_custom_flavor.3105.c:0 "雌剑送去。"
 zgrc_custom_flavor.3105.d:0 "托词不给。"
 zgrc_custom_flavor.3106.t:0 "空手而归"
 zgrc_custom_flavor.3106.desc:0 "回话的人说，那两柄剑粗劣得很，不是干将、莫邪。\n\n「都是乡间乱传，大人误会了。」"
 zgrc_custom_flavor.3106.a:0 "替他编一个罪名。"
 zgrc_custom_flavor.3106.b:0 "罢了。"
