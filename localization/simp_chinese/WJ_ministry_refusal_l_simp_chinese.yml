l_simp_chinese:
 WJ_ministry_refuse_decision:0 "谢绝朝廷任命"
 WJ_ministry_refuse_decision_desc:0 "我愿保留眼下的职责与生活，暂不接受新的朝官任命。此举不会使我辞去现职，也不会转交我已有的领地；若心意改变，我可再行声明愿意入朝。"
 WJ_ministry_refuse_decision_tooltip:0 "声明谢绝新的朝官任命"
 WJ_ministry_refuse_decision_confirm:0 "暂辞朝命"
 WJ_ministry_refuse_decision_effect_tt:0 "在常规选任中谢绝新的中央朝职。已有官职、地方授官与领地继承不因此改变。你可通过“恢复接受朝廷任命”撤回此意向。"
 WJ_ministry_resume_decision:0 "恢复接受朝廷任命"
 WJ_ministry_resume_decision_desc:0 "如今我愿重新考虑朝廷的任命。撤回此前的谢绝声明后，我将依照原有资格参与朝官选任；此举本身不会授予官职，也不会改变现有领地。"
 WJ_ministry_resume_decision_tooltip:0 "重新接受朝廷的选任"
 WJ_ministry_resume_decision_confirm:0 "愿候朝命"
 WJ_ministry_resume_decision_effect_tt:0 "撤回谢绝声明，恢复参与常规朝官选任。已有官职与领地不变。"
 WJ_ministry_refusal_blocks_appointment_tt:0 "此人未声明谢绝新的朝官任命"
