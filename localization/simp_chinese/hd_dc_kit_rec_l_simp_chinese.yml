l_simp_chinese:
 # 天朝循环·时代特色：恢复期（中兴再造）套件

 # ---------- 轻徭薄赋 ----------
 hd_dc_rec_light_taxes_decision: "轻徭薄赋"
 hd_dc_rec_light_taxes_decision_desc: "丧乱之后，户口凋零，田野荒芜。效法文景之治，省刑罚、薄税敛，与民休息，使天下元气得以恢复。"
 hd_dc_rec_light_taxes_decision_tooltip: "诏减天下租赋，与民休息。"
 hd_dc_rec_light_taxes_decision_confirm: "诏减天下租赋"
 hd_dc_rec_light_taxes_active_tt: "轻徭薄赋之诏正在施行"
 hd_dc_rec_light_taxes_county_tt: "天子之国的每个[county|E]"

 hd_dc_rec_cancel_light_taxes_decision: "中止轻徭薄赋"
 hd_dc_rec_cancel_light_taxes_decision_desc: "国用不足，府库空虚。提前废止减免租赋之诏，恢复旧日税额——然而百姓必以为朝廷失信，视之为苛政。"
 hd_dc_rec_cancel_light_taxes_decision_tooltip: "提前废止减赋之诏，复征旧额。"
 hd_dc_rec_cancel_light_taxes_decision_confirm: "复征旧额"
 hd_dc_rec_cancel_light_taxes_county_tt: "仍在减赋的每个[county|E]"

 hd_dc_rec_light_taxes_modifier: "轻徭薄赋"
 hd_dc_rec_light_taxes_modifier_desc: "朝廷减免天下租赋，与民休息。"
 hd_dc_rec_light_taxes_county_modifier: "轻徭薄赋"
 hd_dc_rec_light_taxes_county_modifier_desc: "朝廷减免租赋，百姓得以休养生息。"

 # ---------- 招抚流民 ----------
 hd_dc_rec_resettle_refugees_decision: "招抚流民"
 hd_dc_rec_resettle_refugees_decision_desc: "兵燹之后，流民塞道。择一州之地，由官府给田授种、贷以耕牛，招徕流亡还乡复业，使荒地重为良田。"
 hd_dc_rec_resettle_refugees_decision_tooltip: "选定一州，招徕流亡归乡复业。"
 hd_dc_rec_resettle_refugees_decision_confirm: "招徕流亡"
 hd_dc_rec_resettle_refugees_pick_tt: "须选定一个至少有一县属于天子之国的州"
 hd_dc_rec_resettle_refugees_county_tt: "该州内属于天子之国的每个[county|E]"
 hd_dc_rec_resettle_refugees_county_modifier: "招抚流民"
 hd_dc_rec_resettle_refugees_county_modifier_desc: "流民归业，荒田复垦，户口渐增。"

 # ---------- 大赦天下 ----------
 hd_dc_rec_grand_amnesty_decision: "大赦天下"
 hd_dc_rec_grand_amnesty_decision_desc: "中兴之际，与天下更始。颁大赦之诏，宽宥囚系，以示天子仁德，收拾人心。"
 hd_dc_rec_grand_amnesty_decision_tooltip: "大赦囚徒，以宽仁收拾人心。"
 hd_dc_rec_grand_amnesty_decision_confirm: "颁大赦诏"
 hd_dc_rec_grand_amnesty_no_prisoner_tt: "天子或其封臣至少关押着一名囚犯"
 hd_dc_rec_grand_amnesty_decision_effect_tt: "朝议大赦之广狭：或只赦朝廷所系之囚，或连诸侯郡国的狱囚一并宽宥。"

 hd_dc_rec.0001.t: "大赦天下"
 hd_dc_rec.0001.desc: "诏书已拟就，只待用玺。尚书令奏道：“大赦之恩，是只及于朝廷所系之囚，还是连诸侯郡国的狱囚一并宽宥？若普天同赦，固然恩泽更广，只怕诸侯以为朝廷越俎代庖，心生怨望。”"
 hd_dc_rec.0001.a: "只赦朝廷之囚"
 hd_dc_rec.0001.b: "普天同赦，诸侯之囚一并释放"
 hd_dc_rec.0001.c: "狱中已空，收回成命"

 hd_dc_rec_amnesty_opinion: "大赦天下"
 hd_dc_rec_prisoners_released_opinion: "强放我的囚犯"

 # ---------- 求贤诏 ----------
 hd_dc_rec_seek_talent_decision: "求贤诏"
 hd_dc_rec_seek_talent_decision_desc: "国家中兴，首在得人。下诏州郡举贤良方正、明经茂才，凡有一技之长者，皆可诣阙自荐。"
 hd_dc_rec_seek_talent_decision_tooltip: "下诏求贤，招揽四方才俊入朝。"
 hd_dc_rec_seek_talent_decision_confirm: "诏举贤良"
 hd_dc_rec_seek_talent_decision_effect_tt: "四方之士闻诏而来，#EMP 或有一至三人#!应召入朝，各有过人之长。"

 hd_dc_rec.0002.t: "四方贤士"
 hd_dc_rec.0002.desc_1: "求贤之诏下达州郡不过数月，便有一位才俊应诏而来，诣阙上书，自陈所学。"
 hd_dc_rec.0002.desc_2: "求贤之诏下达州郡不过数月，便有两位才俊结伴入京，诣阙上书，各陈所长。"
 hd_dc_rec.0002.desc_3: "求贤之诏下达州郡不过数月，四方之士闻风而至，竟有三人同日诣阙，济济一堂。"
 hd_dc_rec.0002.a: "国家得人，社稷之幸"
 hd_dc_rec_talent_summoned_opinion: "应诏入朝"
