 # 263「钟会伐蜀」剧本（计划 /mnt/project-files/263钟会伐蜀剧本_计划.md）
 bm_hd_263: "钟会伐蜀"
 bm_hd_263_desc: "景元四年秋，大将军司马昭定议伐蜀。镇西将军钟会统十余万众，分从斜谷、骆谷、子午谷入汉中；征西将军邓艾出狄道，直趋沓中，牵住姜维；雍州刺史诸葛绪出祁山，断其归路。\n\n成都城里，后主刘禅还在听信黄皓的巫言，以为敌兵终不自来。姜维避祸屯田沓中，屡次上表请守阳安关口、阴平桥头，朝中不报。东边的建业，吴主孙休闻讯，只能遣将虚张声势。\n\n三路大军已经开拔。剑阁之险，阴平之道，汉祚四十三年，系于这一秋一冬。\n\n#bold 是钟会先入成都，还是姜维守住剑阁？#!"
 bm_hd_263_zhong_hui: "钟会"
 bm_hd_263_zhong_hui_subheading: "镇西将军、都督关中"
 bm_hd_263_zhong_hui_desc: "钟会是太傅钟繇幼子，少有才名，为司马昭谋主，号称「子房」。满朝都说蜀不可伐，只有他力赞其议。十余万大军交到他手里，他心里想的却未必只是灭蜀。"
 bm_hd_263_deng_ai: "邓艾"
 bm_hd_263_deng_ai_subheading: "征西将军、都督陇右"
 bm_hd_263_deng_ai_desc: "邓艾出身寒微，口吃，当年牧牛时就爱看高山大泽、指画营垒。他在陇右与姜维周旋十年，段谷一战大破蜀军。这一回他要去沓中缠住姜维，再找一条别人不敢走的路。"
 bm_hd_263_jiang_wei: "姜维"
 bm_hd_263_jiang_wei_subheading: "汉大将军、使持节"
 bm_hd_263_jiang_wei_desc: "姜维承诸葛丞相遗志，九伐中原，功少过多。去岁侯和一败，又为黄皓所忌，只得屯田沓中避祸。魏军三路并至，他必须先摆脱邓艾，赶回剑阁。"
 bm_hd_263_liu_chan: "刘禅"
 bm_hd_263_liu_chan_subheading: "汉帝"
 bm_hd_263_liu_chan_desc: "刘禅在位四十一年，前有丞相，后有蒋、费，向来垂拱无为。如今宦官黄皓用事，姜维的告急表章被压了下来。魏军已经出发，成都还不知道。"
 bm_hd_263_si_ma_zhao: "司马昭"
 bm_hd_263_si_ma_zhao_subheading: "大将军、录尚书事"
 bm_hd_263_si_ma_zhao_desc: "司马昭继兄掌魏政已近九年，三年前南阙之变，曹髦死于成济之手，天下侧目。他九次辞让晋公之封，只等一场大功来堵住众人之口，灭蜀就是这场大功。"
 bm_hd_263_sun_xiu: "孙休"
 bm_hd_263_sun_xiu_subheading: "吴帝"
 bm_hd_263_sun_xiu_desc: "孙休诛孙綝而亲政，好学而不善兵。交趾吕兴刚刚杀太守、举郡附魏，西边唇亡齿寒的蜀国又将不保，他能做的只是遣将牵制，坐看大局。"

 hd263_jin_state_name: "晋"
 hd263_jin_state_name_adj: "晋"
 SG_nianhao_jingyuan: "景元"
 SG_nianhao_jingyuan_tt: "寓意『景仰元始』#weak (魏元帝曹奂年号)#!"
 SG_nianhao_xianxi: "咸熙"
 SG_nianhao_xianxi_tt: "寓意『咸归和熙』#weak (魏元帝曹奂年号)#!"

 hd263_zhonghui_army_name: "钟会军"
 hd263_dengai_army_name: "邓艾军"
 hd263_zhugexu_army_name: "诸葛绪军"
 hd263_rebel_army_name: "举事之师"

 # 伐蜀
 hd263.0100.t: "灭蜀之议"
 hd263.0100.desc: "朝议伐蜀，众人都说蜀道艰险、不可轻动，唯有钟会与你意见相合。算来蜀兵不过九万，姜维又在沓中屯田，正是可乘之机。只要一道令下，三路大军便可出关。"
 hd263.0100.a: "三道并进，一举灭蜀"
 hd263.0100.b: "蜀道艰险，且缓图之"
 hd263.0105.t: "大将军请伐蜀"
 hd263.0105.desc: "大将军司马昭上表请伐蜀：钟会出斜谷、骆谷，邓艾、诸葛绪出陇右，三道并进。表章到了御前，名义上要由你来准奏。"
 hd263.0105.a: "准奏"
 hd263.0105.b: "不准"
 hd263.0110.t: "受命伐蜀"
 hd263.0110.desc: "诏书到了：三路伐蜀，你领一路。部曲已在营中待命，只等你一句话。"
 hd263.0110.a: "受命出师"
 hd263.0110.b: "称疾不行"

 # 出降
 hd263.0200.t: "舆榇出降"
 hd263.0200.desc: "魏军已入腹地，成都震恐。群臣有劝奔吴的，有劝南入南中的，光禄大夫谯周力主出降。北地王刘谌却说：「就算理穷力屈，也当父子君臣背城一战，同死社稷。」"
 hd263.0200.a: "舆榇自缚，诣军门降"
 hd263.0200.b: "背城一战"
 hd263.0210.t: "后主已降"
 hd263.0210.desc: "敕令从成都传来，命诸军投戈放甲，诣钟会、邓艾降。将士们拔刀砍石，咬牙切齿。你手中还有兵，也还有剑阁。"
 hd263.0210.a: "奉诏，诣钟会降"
 hd263.0210.b: "拔刀斫石，拒不奉诏"

 # 邓艾被收
 hd263.0300.t: "密告邓艾"
 hd263.0300.desc: "邓艾入成都之后，承制拜官，又上书说要乘胜东下伐吴，口气越来越大。卫瓘、胡烈、师纂都对他不满。你只需一道密表，说他有反状，他就再也挡不住你的路。"
 hd263.0300.a: "上表告其谋反"
 hd263.0300.b: "罢了"
 hd263.0305.t: "钟会告邓艾反"
 hd263.0305.desc: "钟会的表章送到：邓艾专擅蜀地，承制拜官，意在自立。邓艾自己的表章也说他只是权宜行事。槛车征艾，还是不征，全在你一念之间。"
 hd263.0305.a: "槛车征艾"
 hd263.0305.b: "不准"
 hd263.0310.t: "槛车将至"
 hd263.0310.desc: "卫瓘持诏入营，要收你下狱，钟会的大军就在身后。你一生自认忠于魏室，此刻却百口莫辩。"
 hd263.0310.a: "束手就征"
 hd263.0310.b: "拒命"

 # 钟会之乱
 hd263.0400.t: "据蜀自立"
 hd263.0400.desc: "邓艾已被槛车送走，蜀中尽在你手，姜维也愿为你所用。可是司马昭已亲率大军屯于长安。你自觉功名盖世，不甘再居人下。"
 hd263.0400.a: "起兵"
 hd263.0400.b: "罢了，安守臣节"
 hd263.0410.t: "复国之计"
 hd263.0410.desc: "钟会对你推心置腹，他有异志，你看得清清楚楚。若劝他起事，再伺机除掉他，汉祚或许还能复兴。只是诸将未必肯从。"
 hd263.0410.a: "劝他反，伺机图之"
 hd263.0410.b: "不从"
 hd263.0415.t: "兵变之后"
 hd263.0415.desc: "成都乱兵四起，钟会已死于胡烈、丘建部下之手。城中大乱，没有人在看着你。"
 hd263.0415.a: "趁乱举兵，兴复汉室"
 hd263.0415.b: "事不可为"

 # 晋公、晋王
 hd263.0500.t: "九锡之命"
 hd263.0500.desc: "公卿又一次劝进，请加九锡、封晋公，以并州诸郡为晋国。你已辞让九次。灭蜀之功在前，这一次似乎不必再辞了。"
 hd263.0500.a: "受命"
 hd263.0500.b: "再辞"
 hd263.0505.t: "请封晋公"
 hd263.0505.desc: "公卿联名上表，请加大将军司马昭九锡，封为晋公，以并州诸郡为晋国。这道诏书由你下，可谁都知道该怎么下。"
 hd263.0505.a: "准奏"
 hd263.0505.b: "不准"
 hd263.0600.t: "进爵为王"
 hd263.0600.desc: "朝廷又下诏，进晋公为晋王。离那最后一步，只剩一层窗纸。"
 hd263.0600.a: "受命"
 hd263.0600.b: "辞让"

 # 司马炎接任
 hd263.0700.t: "晋王薨"
 hd263.0700.desc: "晋王司马昭薨了。世子司马炎在洛阳候命，满朝公卿都看着你，等你下诏让他嗣位相国。"
 hd263.0700.a: "以司马炎嗣相国、晋王"
 hd263.0700.b: "亲揽朝政"
 hd263.0710.t: "嗣父之位"
 hd263.0710.desc: "父亲去世，相国、晋王之位都在等你接过来。"
 hd263.0710.a: "嗣位"
 hd263.0710.b: "辞让"

 # 禅代
 hd263.0800.t: "受禅"
 hd263.0800.desc: "魏帝遣使奉策，要禅位于晋。南郊的受禅台已经筑好，百官都在等你。"
 hd263.0800.a: "受禅"
 hd263.0800.b: "不受"
 hd263.0805.t: "禅位"
 hd263.0805.desc: "晋王威震天下，魏的天命已尽。公卿请你效汉献帝故事，设坛南郊，禅位于晋。"
 hd263.0805.a: "设坛南郊，禅位于晋"
 hd263.0805.b: "不禅"

 # 全局通报
 hd263.0900.t: "魏军伐蜀"
 hd263.0900.desc: "[hd_news_a.GetName]下诏伐蜀，钟会、邓艾、诸葛绪三路并进，[hd_news_b.GetName]的江山岌岌可危。"
 hd263.0910.t: "蜀汉亡"
 hd263.0910.desc: "[hd_news_a.GetName]舆榇自缚，出城投降。昭烈帝所建的汉，至此而亡。"
 hd263.0920.t: "邓艾被收"
 hd263.0920.desc: "[hd_news_a.GetName]告[hd_news_b.GetName]谋反，平蜀首功之臣被槛车征还。"
 hd263.0930.t: "钟会之乱"
 hd263.0930.desc: "[hd_news_b.GetName]据成都谋反，诸将兵变，乱兵所至，钟会、姜维皆死。"
 hd263.0935.t: "钟会据蜀"
 hd263.0935.desc: "[hd_news_a.GetName]据蜀起兵，与[hd_news_b.GetName]决裂。"
 hd263.0950.t: "司马昭封晋公"
 hd263.0950.desc: "[hd_news_b.GetName]下诏，加[hd_news_a.GetName]九锡，封晋公，以并州诸郡为晋国。"
 hd263.0960.t: "司马昭进爵晋王"
 hd263.0960.desc: "[hd_news_a.GetName]进爵为晋王，魏改元咸熙。"
 hd263.0980.t: "魏晋禅代"
 hd263.0980.desc: "[hd_news_b.GetName]设坛南郊，禅位于[hd_news_a.GetName]。魏亡，晋兴，改元泰始。"
