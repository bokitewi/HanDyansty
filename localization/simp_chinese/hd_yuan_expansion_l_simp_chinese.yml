l_simp_chinese:
 hd_story_yuan_expansion:0 "袁绍：北方扩张"
 hd_story_yuan_expansion_desc:0 "以冀州为根基，进取冀州、幽州、青州，并控制上党、河内、乐平、太原、新兴、雁门、西河七个要郡公国。各方向进军由一个独立的六十日扩张脉冲依次驱动。"
 HD_YUAN_EXPANSION_STORY_STATUS:0 "当前目标每60日检查一次。AI袁绍在参加战争少于3场时，最多向一名军力不超过自身两倍的合法独立目标宣战。目标完成或已无战略目标后，关闭本轮脉冲并再次选择方向。玩家袁绍需要自行宣战。"
 HD_YUAN_NORTHERN_LIFE_STORY_STATUS:0 "$HD_YUAN_LIFE_STORY_STATUS$\n\n北方扩张：讨董结束并完成韩馥让冀州后，韩馥与公孙瓒的旧战立即结束，不会转移给袁绍；随后选择尚未平定的冀州、幽州、青州、上党、河内、乐平、太原、新兴、雁门、西河。各轮每60日检查；AI袁绍在参加战争少于3场时，每次检查最多发动一场目标战争。每次目标脉冲结束后，都会再次出现“北方扩张”。十个目标全部归附后，此扩张系统终止。"
 hd_yuan_expansion.1000.t:0 "北方扩张"
 hd_yuan_expansion.1000.desc:0 "这一阶段的进军暂告一段落。或是州郡已归于麾下，或是剩余势力仍须等待时机，旧有军令已应重新部署。\n\n冀、幽、青三州为河北根本；上党、河内、乐平、太原、新兴、雁门、西河则扼控并州、太行与北疆。望着案前舆图，我召集诸将商议：下一步，应当向何处进军？"
 hd_yuan_expansion.1000.a:0 "冀州尚未平定。"
 hd_yuan_expansion.1000.b:0 "兵进幽州。"
 hd_yuan_expansion.1000.c:0 "东取青州。"
 hd_yuan_expansion.1000.d:0 "夺取上党。"
 hd_yuan_expansion.1000.e:0 "进取河内。"
 hd_yuan_expansion.1000.f:0 "平定乐平。"
 hd_yuan_expansion.1000.g:0 "夺取太原。"
 hd_yuan_expansion.1000.h:0 "进取新兴。"
 hd_yuan_expansion.1000.i:0 "控制雁门。"
 hd_yuan_expansion.1000.j:0 "平定西河。"
 hd_yuan_expansion.1000.k:0 "河北诸地已定，天下可图。"
 hd_yuan_expansion.jizhou_tt:0 "获得冀州王国的宣称（已持有头衔或宣称时不重复授予），开启新的60日冀州扩张脉冲。可以再次进取尚未完全控制的冀州。本轮结束后，“北方扩张”将再次出现。"
 hd_yuan_expansion.youzhou_tt:0 "获得幽州王国的宣称（已持有头衔或宣称时不重复授予），开启新的60日幽州扩张脉冲。本轮结束后，“北方扩张”将再次出现。"
 hd_yuan_expansion.qingzhou_tt:0 "获得青州王国的宣称（已持有头衔或宣称时不重复授予），开启新的60日青州扩张脉冲。本轮结束后，“北方扩张”将再次出现。"
 hd_yuan_expansion.shangdang_tt:0 "获得上党公国的宣称（已持有头衔或宣称时不重复授予），开启新的60日上党扩张脉冲。本轮结束后，“北方扩张”将再次出现。"
 hd_yuan_expansion.henei_tt:0 "获得河内公国的宣称（已持有头衔或宣称时不重复授予），开启新的60日河内扩张脉冲。本轮结束后，“北方扩张”将再次出现。"
 hd_yuan_expansion.leping_tt:0 "获得乐平公国的宣称（已持有头衔或宣称时不重复授予），开启新的60日乐平扩张脉冲。本轮结束后，“北方扩张”将再次出现。"
 hd_yuan_expansion.taiyuan_tt:0 "获得太原公国的宣称（已持有头衔或宣称时不重复授予），开启新的60日太原扩张脉冲。本轮结束后，“北方扩张”将再次出现。"
 hd_yuan_expansion.xinxing_tt:0 "获得新兴公国的宣称（已持有头衔或宣称时不重复授予），开启新的60日新兴扩张脉冲。本轮结束后，“北方扩张”将再次出现。"
 hd_yuan_expansion.yanmen_tt:0 "获得雁门公国的宣称（已持有头衔或宣称时不重复授予），开启新的60日雁门扩张脉冲。本轮结束后，“北方扩张”将再次出现。"
 hd_yuan_expansion.xihe_tt:0 "获得西河公国的宣称（已持有头衔或宣称时不重复授予），开启新的60日西河扩张脉冲。本轮结束后，“北方扩张”将再次出现。"
 hd_yuan_expansion.finished_tt:0 "冀州、幽州、青州，以及上党、河内、乐平、太原、新兴、雁门、西河的全部法理伯爵领已由袁绍本人或其各级封臣持有。结束北方扩张，不再自动重启；其余历史故事继续按原有条件推进。"
 hd_yuan_expansion_cb:0 "北方扩张"
 hd_yuan_expansion_cb_name:0 "北方扩张"
 hd_yuan_expansion_cb_war:0 "袁绍的北方扩张战争"
 hd_yuan_expansion_cb_war_name:0 "袁绍的北方扩张战争"
 hd_yuan_expansion_cb_victory_desc:0 "袁绍取得防守方在本次战争目标头衔法理范围内的伯爵领，县下男爵封臣依原生头衔事务随领转移；不夺取目标法理范围以外的领地，不自动夺取目标王国或公国头衔，也不取得第三方的土地。"
 hd_yuan_expansion_cb_white_peace_desc:0 "双方停战，不转移任何领地。"
 hd_yuan_expansion_cb_defeat_desc:0 "袁绍的此次进军失败，双方停战，不转移任何领地。"
 hd_yuan_expansion_cb_invalidated_desc:0 "本次目标战争因袁绍失效、双方不再属于敌对领国或原目标领地已不存在而终止，不转移任何领地。"
