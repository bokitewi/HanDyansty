l_simp_chinese:
 hd_story_yuan_expansion:0 "袁绍：北方扩张"
 hd_story_yuan_expansion_desc:0 "袁绍以冀州为根本，北收幽州，东取青州，西出太行，经营上党、河内、乐平、太原、新兴、雁门、西河诸郡，欲尽有河北之地。"
 HD_YUAN_EXPANSION_STORY_STATUS:0 "袁绍正循选定的方向用兵；待此路平定，或其间再无可图之敌，便另议下一路。此路战事，须由袁绍亲自下令兴兵。"
 HD_YUAN_NORTHERN_LIFE_STORY_STATUS:0 "$HD_YUAN_LIFE_STORY_STATUS$\n\n冀、幽、青三州与太行以西的诸郡，是本初念兹在兹的河北根本。谁能尽有其地，谁便握住了北方。"
 hd_yuan_expansion.1000.t:0 "河北军议"
 hd_yuan_expansion.1000.desc:0 "河北的图籍重新铺好。你看着先前那些各据一方的名字，有的已归袁氏节制，有的仍顽固地占着一角。左右先禀报上一路军务，你听完，才问下一步往哪里走。\n\n冀、幽、青三州尚有可经营之处，太行以西也连着并州与北疆。军中愿战的人不少，只是粮道不能同时通向每个人所指的方向。\n\n你示意诸将不必一齐开口。今日要定的，是哪一路先行；已定之地自有安置。兵粮既都等着你发令，便不该让这场军议散成一桌各不相让的主张。"
 hd_yuan_expansion.1000.a:0 "先定冀州。"
 hd_yuan_expansion.1000.b:0 "兵进幽州。"
 hd_yuan_expansion.1000.c:0 "东取青州。"
 hd_yuan_expansion.1000.d:0 "夺取上党。"
 hd_yuan_expansion.1000.e:0 "进取河内。"
 hd_yuan_expansion.1000.f:0 "平定乐平。"
 hd_yuan_expansion.1000.g:0 "夺取太原。"
 hd_yuan_expansion.1000.h:0 "进取新兴。"
 hd_yuan_expansion.1000.i:0 "北控雁门。"
 hd_yuan_expansion.1000.j:0 "平定西河。"
 hd_yuan_expansion.1000.k:0 "河北诸地已定，天下可图。"
 hd_yuan_expansion.jizhou_tt:0 "你将兵锋先指向冀州境内尚未归附之地；待此路事毕，再议下一步。"
 hd_yuan_expansion.youzhou_tt:0 "你将兵锋北转幽州；待此路事毕，再议下一步。"
 hd_yuan_expansion.qingzhou_tt:0 "你将兵锋东指青州；待此路事毕，再议下一步。"
 hd_yuan_expansion.shangdang_tt:0 "你将兵锋西出太行，直指上党；待此路事毕，再议下一步。"
 hd_yuan_expansion.henei_tt:0 "你将兵锋南向河内；待此路事毕，再议下一步。"
 hd_yuan_expansion.leping_tt:0 "你将兵锋指向乐平；待此路事毕，再议下一步。"
 hd_yuan_expansion.taiyuan_tt:0 "你将兵锋西指太原；待此路事毕，再议下一步。"
 hd_yuan_expansion.xinxing_tt:0 "你将兵锋北向新兴；待此路事毕，再议下一步。"
 hd_yuan_expansion.yanmen_tt:0 "你将兵锋北指雁门；待此路事毕，再议下一步。"
 hd_yuan_expansion.xihe_tt:0 "你将兵锋西向西河；待此路事毕，再议下一步。"
 hd_yuan_expansion.finished_tt:0 "河北诸州郡尽归袁氏，北方经略之事至此告一段落。"
 hd_yuan_expansion_cb:0 "北方扩张"
 hd_yuan_expansion_cb_name:0 "北方扩张"
 hd_yuan_expansion_cb_war:0 "袁绍的北方扩张战争"
 hd_yuan_expansion_cb_war_name:0 "袁绍的北方扩张战争"
 hd_yuan_expansion_cb_victory_desc:0 "袁绍夺取目标疆域内敌方所据之地，当地封臣随之改投。"
 hd_yuan_expansion_cb_white_peace_desc:0 "双方罢兵，各守原境。"
 hd_yuan_expansion_cb_defeat_desc:0 "袁绍此番进军无功而返，各守原境。"
 hd_yuan_expansion_cb_invalidated_desc:0 "此战失了名目，就此作罢，各守原境。"
