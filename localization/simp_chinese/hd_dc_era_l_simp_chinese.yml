l_simp_chinese:
 hd_dc_era.0001.t: "诏令未至之地"
 hd_dc_era.0001.desc: "案上的舆图已许久没有换过，各地送来的文书却渐渐改了称谓。有的仍奉朝廷正朔，有的只谈本境军粮，还有几处迟迟不见回音。\n\n这些界线并非今日才出现。经年的离散，终于成了无人能够回避的局面。新的盟约、征伐与建国之议，将从这些已经改变的关系中生长出来，你也须在其中寻到自己的去处。"
 hd_dc_era.0001.a: "且观天下之变，再定行止。"
 hd_dc_era_rules_tt: "以下情形，天下即刻陷入群雄逐鹿（[tributaries|E]的领地与战时占领之地，不算作[son_of_heaven|E]所掌控）：\n$BULLET$局势紧张之时，[son_of_heaven|E]掌控的天下法理[counties|E]不足两成\n$BULLET$天下崩坏之时，中华[hegemony|E]无主，或[son_of_heaven|E]掌控的天下法理[counties|E]不足四成，或其君权未臻最高一级\n乱世唯有借「终结乱世」[decision|E]收束：须掌控天下八成法理[counties|E]，[tributaries|E]治下亦计在内。"
 hd_dc_era_no_sovereignty_change_tt: "旧日名分虽在，诸侯却已各怀去就：天子的直属[vassals|E]各自拥地自立，天子只余直辖之地；乱世之中，[vassals|E]可向主君「要求独立」，主君若允，便和平分立；若不允，彼亦自立，而主君可兴兵「讨逆」。"
 hd_dc_mandate_observation_tt: "天命虽复归于你，这场乱世中的封赏你已领受过，不再重赐。"
 hd_dc_mandate_once_per_era_tt: "你在这场乱世中尚未领受天命之赏，或你并未持有中华[hegemony|E]"
