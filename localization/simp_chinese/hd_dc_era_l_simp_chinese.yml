l_simp_chinese:
 hd_dc_era.0001.t: "诏令未至之地"
 hd_dc_era.0001.desc: "案上的舆图已许久没有换过，各地送来的文书却渐渐改了称谓。有的仍奉朝廷正朔，有的只谈本境军粮，还有几处迟迟不见回音。\n\n这些界线并非今日才出现。经年的离散，终于成了无人能够回避的局面。新的盟约、征伐与建国之议，将从这些已经改变的关系中生长出来。"
 hd_dc_era.0001.a: "先看清天下，再定自己的去路。"
 hd_dc_era_no_sovereignty_change_tt: "群雄割据时代确认已经形成的政治局势，并开放相应机制；此次时代切换不会移交头衔、改变直属领主或自动建立朝贡关系。"
 hd_dc_era_rules_tt: "霸权持续无主12个月，或其真实领地控制不足固定中华法理郡的50%并持续24个月，才进入群雄割据。朝贡与军事占领不计入控制率。恢复控制至少65%，并在没有霸权争位战争的情况下持续60个月，才退出；争位战争重启会清零恢复期。"
 hd_dc_mandate_observation_tt: "政权交接照常执行；同一人在本次群雄割据期间只领取一次宣告天命的奖励，日后重新取得霸权不受此限制。群雄割据是否结束，由实际领地控制与持续稳定时间另行判定。"
 hd_dc_mandate_once_per_era_tt: "你尚未领取本次天命奖励，或当前尚未持有中华霸权"
 hd_dc_era_control_status: "朝廷实控：[Situation.MakeScope.Var('hd_dc_controlled_counties').GetValue|0]/[Situation.MakeScope.Var('hd_dc_total_counties').GetValue|0]郡（[Situation.MakeScope.Var('hd_dc_control_percent').GetValue|1]%）"
 hd_dc_era_no_holder_status: "霸权当前无主，控制率不适用"
 hd_dc_era_invalid_status: "政治资料尚未核实，时代判定暂停"
 situation_dynastic_cycle_phase_chaos_desc_short: "朝廷权威已难以维系天下，各方势力按实际领地、盟约与兵力决定进退。"
 situation_dynastic_cycle_phase_chaos_desc: "$situation_dynastic_cycle_phase_chaos_desc_short$\n\n$hd_dc_era_rules_tt$\n\n时代确认本身不废黜天子、不销毁头衔，也不改变封臣与朝贡关系。独立、拥立与征服须由相应政治行动或真实战争达成。危世点数衡量秩序所承受的压力，不单独决定天下是否割据。"
