l_simp_chinese:
 # 天朝循环·时代特色：崩溃期（天下大乱 + 大厦将倾）套件

 # ---------- 招募流民 ----------
 hd_dc_col_recruit_refugees_decision: "招募流民"
 hd_dc_col_recruit_refugees_decision_desc: "饥民流徙，所在为盗。与其坐视其聚众为乱，不如由官府募其丁壮为兵、安其老弱垦荒，既得兵源，又安地方。"
 hd_dc_col_recruit_refugees_decision_tooltip: "募流民为兵，安其老弱于田亩。"
 hd_dc_col_recruit_refugees_decision_confirm: "募流民为兵"
 hd_dc_col_recruit_refugees_county_tt: "天子之国的每个[county|E]"
 hd_dc_col_refugee_army_name: "流民军"
 hd_dc_col_refugees_county_modifier: "招募流民"
 hd_dc_col_refugees_county_modifier_desc: "官府募流民为兵、安其老弱，地方稍得安辑。"

 # ---------- 勤王诏 ----------
 hd_dc_col_qinwang_decision: "勤王诏"
 hd_dc_col_qinwang_decision_desc: "寇盗交侵，社稷危殆。天子以血书诏告天下诸侯：凡忠义之士，速起兵入援，共赴国难。"
 hd_dc_col_qinwang_decision_tooltip: "诏告天下诸侯起兵勤王，共赴国难。"
 hd_dc_col_qinwang_decision_confirm: "诏天下勤王"
 hd_dc_col_qinwang_no_war_tt: "你正在一场战争中坚守，且尚未为这场战争颁过勤王诏"
 hd_dc_col_qinwang_legitimacy_tt: "你的[legitimacy|E]至少须有 #V [ROOT.Char.MakeScope.ScriptValue('hd_dc_col_qinwang_legitimacy_cost_value')|0]#!"
 hd_dc_col_qinwang_invite_tt: "诏书将传至对你尚存忠心的诸侯，应诏者将起兵加入这场战争。若王师得胜，勤王诸侯必得厚报。"
 hd_dc_col_qinwang_joined_msg: "[hd_dc_col_qinwang_joiner.GetShortUIName]起兵勤王"
 hd_dc_col_qinwang_opinion: "勤王之功"

 hd_dc_col.0001.t: "勤王诏至"
 hd_dc_col.0001.desc: "天子的诏使星夜驰至，呈上一道墨迹犹湿的诏书：寇盗交侵，京师危急，[hd_dc_col_qinwang_emperor.GetTitledFirstName]号召天下忠义之士起兵入援。\n\n麾下诸将面面相觑——此去是建勤王之功，还是徒为他人作嫁？"
 hd_dc_col.0001.a: "君父有难，岂可坐视！"
 hd_dc_col.0001.a.tt: "你将率部加入天子一方。若王师得胜，天子必不忘你勤王之功："
 hd_dc_col.0001.b: "按兵观望"

 # ---------- 赈灾 ----------
 hd_dc_col_disaster_relief_decision: "赈灾"
 hd_dc_col_disaster_relief_decision_desc: "天灾流行，饿殍载道。开太仓之粟，遣使分赴灾区，赈济饥民、修复屋舍，使百姓知朝廷未弃之。"
 hd_dc_col_disaster_relief_decision_tooltip: "开太仓之粟，赈济天子之国的受灾诸县。"
 hd_dc_col_disaster_relief_decision_confirm: "开仓放粮"
 hd_dc_col_relief_no_disaster_tt: "天子之国内有受自然灾害或饥荒影响的县"
 hd_dc_col_disaster_relief_county_tt: "天子之国内每个受灾的[county|E]，灾伤尽数平复"
 hd_dc_col_relief_county_modifier: "开仓赈济"
 hd_dc_col_relief_county_modifier_desc: "朝廷开仓赈济，灾民感戴。"

 # ---------- 地方自强 ----------
 hd_dc_col_local_selfstrengthen_decision: "地方自强"
 hd_dc_col_local_selfstrengthen_decision_desc: "朝廷自顾不暇，盗贼四起。与其坐待朝廷救援，不如自募乡勇、修缮城堡，保境安民——只是天子未必乐见地方坐大。"
 hd_dc_col_local_selfstrengthen_decision_tooltip: "自募乡勇、修缮城堡以保境安民，但天子会因此猜忌你。"
 hd_dc_col_local_selfstrengthen_decision_confirm: "募兵自保"
 hd_dc_col_militia_active_tt: "尚未处于 #V 地方自强#! 或 #V 授权募兵#! 之中"
 hd_dc_col_selfstrengthen_modifier: "地方自强"
 hd_dc_col_selfstrengthen_modifier_desc: "自募乡勇，保境安民。"
 hd_dc_col_selfstrengthen_opinion: "擅自募兵"

 # ---------- 授权募兵 ----------
 hd_dc_col_authorize_militia_interaction: "授权募兵"
 hd_dc_col_authorize_militia_interaction_desc: "授权这名封臣自行募兵，许其截留部分赋税以充军资。"
 hd_dc_col_authorize_militia_notification: "[actor.GetTitledFirstName]授权你自行募兵，并许你截留部分赋税以充军资。"
 hd_dc_col_authorize_militia_tax_tt: "此后朝廷每年须将该封臣所缴赋税返还其半，以充军资。"
 hd_dc_col_authorized_militia_modifier: "授权募兵"
 hd_dc_col_authorized_militia_modifier_desc: "奉天子之命募兵，截留部分赋税以充军资。"
 hd_dc_col_authorized_militia_opinion: "授权募兵"

 # ---------- 招安 ----------
 hd_dc_col_amnesty_rebels_interaction: "招安"
 hd_dc_col_amnesty_rebels_interaction_desc: "遣使招安这名叛军首领，许以官爵或土地，换其罢兵归顺。对方若受招安，这场叛乱便以[white_peace|E]告终。"
 hd_dc_col_amnesty_rebels_notification: "[actor.GetTitledFirstName]遣使前来，许以官爵土地，劝你罢兵归顺。"
 hd_dc_col_amnesty_option_office: "封官"
 hd_dc_col_amnesty_option_office_desc: "厚赐金帛，授以官身；若对方无地，便召入朝中为臣。"
 hd_dc_col_amnesty_option_fief: "封地"
 hd_dc_col_amnesty_option_fief_desc: "割你直辖中最贫瘠的一县（都城除外）封给对方，使其成为你的封臣。"
 hd_dc_col_amnesty_office_gold_tt: "拥有足够的金钱支付封官赏赐"
 hd_dc_col_amnesty_must_select_tt: "须选择招安方式：封官或封地"
 hd_dc_col_amnesty_no_fief_tt: "除都城所在县外，还直辖至少一个县"
 hd_dc_col_amnesty_declined_msg: "[recipient.GetShortUIName]拒绝了招安"
 hd_dc_col_amnesty_ai_warscore_reason: "战局"
 hd_dc_col_amnesty_ai_fief_reason: "得授土地"
 hd_dc_col_amnesty_ai_greedy_reason: "贪图赏赐"
 hd_dc_col_amnesty_ai_content_reason: "安于现状"
 hd_dc_col_amnesty_ai_craven_reason: "畏战"
 hd_dc_col_amnesty_ai_ambitious_reason: "野心勃勃"
 hd_dc_col_amnesty_ai_arrogant_reason: "傲慢自大"
 hd_dc_col_amnesty_office_modifier: "受招安授官"
 hd_dc_col_amnesty_office_modifier_desc: "接受招安，罢兵归顺，得授官职。"
 hd_dc_col_amnesty_accepted_opinion: "招安之恩"
