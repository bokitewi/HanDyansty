l_simp_chinese:
 quix_murder_outcome.1001.t:0 "逆旅夜火"
 quix_murder_outcome.1001.d:0 "你的同谋探得，[target.GetTitledFirstName]此番出行，要在道旁一处逆旅歇宿。那客舍梁柱尽是陈年朽木，檐下又堆满了柴草，只消夜半一把火，[target.GetSheHe]便插翅难逃。到了天明，人人都只当是一场失火。"
 quix_murder_outcome.1001.a:0 "一炬焚之。"
 quix_murder_outcome.1001.b:0 "那家逆旅吾常歇脚，且罢。"
 quix_murder_outcome.1002.t:0 "楼头冷箭"
 quix_murder_outcome.1002.d:0 "[target.GetTitledFirstName]每日午后总爱独自凭栏，在楼台上站上好一阵。街对面恰有一间酒肆，楼上正藏得下一名弓手。两处相距不远，一箭便能了结此事。"
 quix_murder_outcome.1002.a:0 "召善射者来。"
 quix_murder_outcome.1002.b:0 "[target.GetFirstNameNoTooltip]不配死得这般痛快。"
 quix_murder_outcome.1003.t:0 "一壶醇醪"
 quix_murder_outcome.1003.d:0 "人人都知道[target.GetName]嗜酒。你大可备一坛难得的佳酿，暗中下毒，再假托仰慕者之名送去。"
 quix_murder_outcome.1003.a:0 "此礼正合其意。"
 quix_murder_outcome.1003.b:0 "这坛鸩酒，留待他日。"
 quix_murder_outcome.1004.t:0 "夜路难行"
 quix_murder_outcome.1004.d:0 "你的同谋发现，[target.GetName]有独自夜行散步的习惯。只要预先伏在道旁，便能叫[target.GetHerHim]悄无声息地消失。"
 quix_murder_outcome.1004.a:0 "惜乎无人得见其惊惧之色。"
 quix_murder_outcome.1004.b:0 "此计太易，当有更妙者。"
 quix_murder_outcome.1005.t:0 "危墙之下"
 quix_murder_outcome.1005.d:0 "[target.GetName]常在城墙下的院中小憩。那段城墙年久失修，只要事先撬松几块大石，石头坠下时正好砸在[target.GetHerHim]身上。"
 quix_murder_outcome.1005.a:0 "去，松其墙石。"
 quix_murder_outcome.1005.b:0 "为[target.GetFirstNameNoTooltip]毁我城墙，不值。"
 quix_murder_outcome.1006.t:0 "开门揖盗"
 quix_murder_outcome.1006.d:0 "[target.GetTitledFirstName]府中一名仆役收了你的钱，答应夜里替你的人打开寝门。只要此人守约，[target.GetSheHe]便活不过今夜。"
 quix_murder_outcome.1006.a:0 "但令此奴缄口即可。"
 quix_murder_outcome.1006.b:0 "恐是圈套，不可。"
 quix_murder_outcome.1007.t:0 "穴地夜袭"
 quix_murder_outcome.1007.d:0 "有一条隐秘的地道，能直通[target.GetTitledFirstName]的住处。你的人打算从地道潜入，制住门前守卫，杀了[target.GetHerHim]，再原路撤回。"
 quix_murder_outcome.1007.a:0 "壮哉诸君，愿天佑之！"
 quix_murder_outcome.1007.b:0 "此计太险，当谨慎行事。"
 quix_murder_outcome.1008.t:0 "夜骑截杀"
 quix_murder_outcome.1008.d:0 "[target.GetName]即将前往邻近城邑，回程时天必已黑。你的人可以骑快马在半道截杀[target.GetHerHim]，再赶在追兵到来之前远遁。"
 quix_murder_outcome.1008.a:0 "遣最善骑者，乘吾最快之马。"
 quix_murder_outcome.1008.b:0 "此计太卑劣，不为也。"
 quix_murder_outcome.1009.t:0 "假医"
 quix_murder_outcome.1009.d:0 "[target.GetTitledFirstName]正延请一位以砭石刺血治病出名的医工，往来的书信已经落到了你手里。只要派人冒名赴约，[target.GetSheHe]便会亲手把性命交出来。"
 quix_murder_outcome.1009.a:0 "[target.GetTitledFirstNameNoTooltip]自投罗网，依计行事。"
 quix_murder_outcome.1009.b:0 "万一反治好了[target.GetHerHim]，如何是好？"
 quix_murder_outcome.1010.t:0 "傩面刺客"
 quix_murder_outcome.1010.d:0 "城中将行大傩，[target.GetTitledFirstName]要去观傩赴宴。到时满场都是戴着傩面的舞者，你的人只消戴上面具混入其中，便能近到[target.GetHerHim]身边，而不惹人生疑。"
 quix_murder_outcome.1010.a:0 "既是傩戏，便多遣几人同舞。"
 quix_murder_outcome.1010.b:0 "太过容易，恐是圈套。"
 quix_murder_outcome.1011.t:0 "胡客"
 quix_murder_outcome.1011.d:0 "你的同谋结识了一名远道而来的胡人武士。此人武艺高强，又惯于隐匿行踪，只要价钱合适，取[target.GetTitledFirstName]的性命应当不在话下。"
 quix_murder_outcome.1011.a:0 "宜雇一与本地无亲无故之人。"
 quix_murder_outcome.1011.b:0 "事关重大，不可托于生人。"
 quix_murder_outcome.1012.t:0 "嗾獒"
 quix_murder_outcome.1012.d:0 "[target.GetName]喜欢独自在野外漫步。你的人可以放出几条驯熟的猛犬，再把[target.GetHerHis]的死说成是遇上了野兽。"
 quix_murder_outcome.1012.a:0 "择其最猛者，饿之数日。"
 quix_murder_outcome.1012.b:0 "畜生之事，不足为凭。"
 quix_murder_outcome.1013.t:0 "汤泉"
 quix_murder_outcome.1013.d:0 "[target.GetName]常独自去城外的汤泉沐浴。那里没有护卫，[target.GetSheHe]身上也不带兵刃，正是下手的好时机。"
 quix_murder_outcome.1013.a:0 "静候其殒命汤泉之讯。"
 quix_murder_outcome.1013.b:0 "吾心有不祥之感。"
 quix_murder_outcome.1014.t:0 "临河偶遇"
 quix_murder_outcome.1014.d:0 "你在途中偶然撞见[target.GetName]独自立在河岸边。河水湍急，四下无人——你只消从背后推上一把。"
 quix_murder_outcome.1014.a:0 "不如送[target.GetTitledFirstNameNoTooltip]一程。"
 quix_murder_outcome.1014.b:0 "虽是良机，吾手不可沾血。"
 quix_murder_outcome.1015.t:0 "白日行刺"
 quix_murder_outcome.1015.d:0 "你已经等得够久了。既然想不出更巧妙的法子，就派人当街袭杀[target.GetTitledFirstName]。这法子虽然简单，却也最难遮掩。"
 quix_murder_outcome.1015.a:0 "令刺客即刻动手。"
 quix_murder_outcome.1015.b:0 "不可，当另筹万全之策。"
 quix_murder_outcome.1016.t:0 "矫令收捕"
 quix_murder_outcome.1016.d:0 "你的人打算伪造一道文书，假称奉命收捕，当街把[target.GetTitledFirstName]带走。只要瞒过围观之人与护卫，便能把[target.GetHerHim]押到无人过问的地方处置。"
 quix_murder_outcome.1016.a:0 "此计可行。"
 quix_murder_outcome.1016.b:0 "此计不可行。"
 quix_murder_outcome.1017.t:0 "吹箭"
 quix_murder_outcome.1017.d:0 "你的人弄到了一件南中蛮夷的奇巧兵器：一根竹管，能从远处吹出细小的飞针。只要在针上淬毒，甚至不必近身，就能取了[target.GetName]的性命。"
 quix_murder_outcome.1017.a:0 "妙哉此器。"
 quix_murder_outcome.1017.b:0 "大事岂可托于一截空竹！"
 quix_murder_outcome.1018.t:0 "亲操匕首"
 quix_murder_outcome.1018.d:0 "同谋们争来争去，你已经听够了。既然知道[target.GetTitledFirstName]睡在哪里，你大可以亲自翻窗而入，趁[target.GetSheHe]未醒，一了百了。"
 quix_murder_outcome.1018.a:0 "取吾头巾与匕首来！"
 quix_murder_outcome.1018.b:0 "万一败露，身名俱裂，不可。"
 quix_murder_outcome.1019.t:0 "哑力士"
 quix_murder_outcome.1019.d:0 "一名身强体壮的外乡角抵力士流落到你的地界谋生。此人不通本地言语，又因旧伤口不能言，正好替你去做那桩无声的勾当，除掉[target.GetTitledFirstName]。"
 quix_murder_outcome.1019.a:0 "此人当乐为吾用！"
 quix_murder_outcome.1019.b:0 "此等粗人，难当大任。"
 quix_murder_outcome.1020.t:0 "探丸之党"
 quix_murder_outcome.1020.d:0 "你的同谋搭上了一伙神秘的闾里少年。这伙人受钱杀人，动手之前要相与探丸，摸到哪颗便杀哪个，从不失手。他们自称能替你除掉[target.GetTitledFirstName]。你对他们几乎一无所知，可他们办事干净的名声，确非虚传。"
 quix_murder_outcome.1020.a:0 "如此神秘，倒要看看其能否成事。"
 quix_murder_outcome.1020.b:0 "如此神秘，吾不放心。"
 quix_murder_outcome.2001.t:0 "逆旅夜火"
 quix_murder_outcome.2001.opening_1:0 "[target.GetName]葬身火海。"
 quix_murder_outcome.2001.opening_2:0 "火起得比预想的早，纵火之人索性把几名住客连同[target.GetName]一并堵在了门里。只能怪[target.GetSheHe]那夜偏偏宿在此处。"
 quix_murder_outcome.2001.opening_3:0 "大火烧了整整一夜，把那逆旅烧成一片白地。[target.GetName]连逃的机会都没有。"
 quix_murder_outcome.2001.heh:0 "\n\n想起那冲天的火光，你竟觉得有几分好看。"
 quix_murder_outcome.2001.owner_is_known_1:0 "\n\n然而人人都认定，这场“失火”是你一手安排的。"
 quix_murder_outcome.2001.owner_is_known_2:0 "\n\n不知是谁走漏了风声，如今街头巷尾都在传，是你要了[target.GetTitledFirstName]的命。"
 quix_murder_outcome.2001.no_awareness_1:0 "\n\n幸而客舍烧得片瓦不存，没有人疑心到你头上。"
 quix_murder_outcome.2001.no_awareness_2:0 "\n\n见过纵火之人的，都随那客舍一起化成了灰。"
 quix_murder_outcome.2001.a.discovered:0 "纵火者自是狂徒，与吾何干！"
 quix_murder_outcome.2001.a:0 "今后榻边须常备水瓮。"
 quix_murder_outcome.2002.t:0 "楼头冷箭"
 quix_murder_outcome.2002.opening_1:0 "听说那一箭正中[target.GetName]的咽喉，[target.GetSheHe]是被自己的血呛死的。"
 quix_murder_outcome.2002.opening_2:0 "听说[target.GetName]中箭之后翻过栏杆，从楼上直坠下去，恰好砸在一辆路过的辎车上……"
 quix_murder_outcome.2002.opening_3:0 "[target.GetName]腹部中箭，拖着伤躯挣回屋内，没过多久便伤重而亡。"
 quix_murder_outcome.2002.owner_is_known_1:0 "\n\n可惜弓手被人拿住，把你供了出来。"
 quix_murder_outcome.2002.owner_is_known_2:0 "\n\n这一箭射得太漂亮，弓手自己也得意忘形，逢人便夸是你出重金请他取了[target.GetTitledFirstName]的性命！"
 quix_murder_outcome.2002.no_awareness_1:0 "\n\n明眼人都看得出这是行刺，却没有人猜到主使是你。"
 quix_murder_outcome.2002.no_awareness_2:0 "\n\n最要紧的是，弓手干干净净地脱身了。"
 quix_murder_outcome.2002.a.discovered:0 "吾只令他射驴，岂料误会至此！"
 quix_murder_outcome.2002.a:0 "今夜不登楼了。"
 quix_murder_outcome.2003.t:0 "一壶醇醪"
 quix_murder_outcome.2003.opening_1:0 "[target.GetName]昨夜在睡梦中死去。"
 quix_murder_outcome.2003.opening_2:0 "听说[target.GetTitledFirstName]醉后神志错乱，癫狂了好几个时辰，最后呕血而死。"
 quix_murder_outcome.2003.opening_3:0 "[target.GetTitledFirstName]死了。临终那几个时辰苦不堪言，又是嘶喊，又是咳血，又是狂吼。"
 quix_murder_outcome.2003.owner_is_known_1:0 "\n\n坏消息是，送酒之人把你牵扯了进去——还没动刑，他就全招了。"
 quix_murder_outcome.2003.owner_is_known_2:0 "\n\n你犯了个要命的疏忽：酒坛底上竟刻着你家的名号。实在是愚不可及。"
 quix_murder_outcome.2003.no_awareness_1:0 "\n\n看来没有人疑心这是谋杀，更没有人疑心到你。"
 quix_murder_outcome.2003.no_awareness_2:0 "\n\n参与其事的人都守口如瓶，你在其中的角色无人知晓。"
 quix_murder_outcome.2003.a.discovered:0 "那酒有毒？幸而吾未曾饮！"
 quix_murder_outcome.2003.a:0 "终是死于贪杯。"
 quix_murder_outcome.2004.t:0 "夜路难行"
 quix_murder_outcome.2004.opening_1:0 "[target.GetName]照例在傍晚出门散步，你的刺客握着短刀从暗处扑出。[target.GetTitledFirstName]拔腿想逃，却在黑暗中被撞翻在地，一刀毙命。"
 quix_murder_outcome.2004.opening_2:0 "[target.GetTitledFirstName]还没回过神来，冰冷的刀锋已经刺进了[target.GetHerHis]的咽喉。片刻之后，[target.GetSheHe]便倒在了自己的血泊里。"
 quix_murder_outcome.2004.opening_3:0 "刺客在暗处尾随了[target.GetTitledFirstName]一路。[target.GetSheHe]惊觉之后慌不择路，逃进了荒野，终究是徒劳——刺客追上去，从背后狠狠捅了一刀。"
 quix_murder_outcome.2004.owner_is_known_1:0 "\n\n可惜事情并非一帆风顺：附近一名巡夜的亭卒当场擒住了刺客。用不了多久，人人都会知道你牵涉其中。"
 quix_murder_outcome.2004.owner_is_known_2:0 "\n\n不多时尸首便被人发现，刺客也落了网，供出了你的名字。"
 quix_murder_outcome.2004.no_awareness_1:0 "\n\n刺客又顺手搜空了[target.GetTitledFirstName]的钱袋，看上去不过是一桩劫财害命的寻常案子。"
 quix_murder_outcome.2004.no_awareness_2:0 "\n\n刺客借着夜色从容脱身，现场只留下一具渐渐冰冷的尸首。"
 quix_murder_outcome.2004.a.discovered:0 "夜路凶险，难免有此横祸。"
 quix_murder_outcome.2004.a:0 "甚好，夜路果然难行。"
 quix_murder_outcome.2005.t:0 "危墙之下"
 quix_murder_outcome.2005.opening_1:0 "落石当头砸下，[target.GetTitledFirstName]当场毙命，至死都不知道自己是怎么死的。"
 quix_murder_outcome.2005.opening_2:0 "[target.GetTitledFirstName]死了。[target.GetSheHe]被巨石压得筋断骨折、肢体残缺，没等卫士把[target.GetHerHim]刨出来便已断气。"
 quix_murder_outcome.2005.opening_3:0 "听说[target.GetTitledFirstName]在最后一刻听见了砖石碎裂之声，刚转过身来，巨石便当头压下，只留下一声凄厉的惨叫。"
 quix_murder_outcome.2005.owner_is_known_1:0 "\n\n不幸的是，你的人也从城墙上失足跌落，被卫士活捉。用不了多久，人人都会知道你牵涉其中。"
 quix_murder_outcome.2005.owner_is_known_2:0 "\n\n然而你的人正要从城墙上爬下来时，被卫士发现擒获。用不了多久，人人都会知道是你主使。"
 quix_murder_outcome.2005.no_awareness_1:0 "\n\n人人都说这不过是一场意外……你也深以为然。"
 quix_murder_outcome.2005.no_awareness_2:0 "\n\n看来只是一场不幸的意外。即便有人心生疑窦，也绝不会疑到你身上。"
 quix_murder_outcome.2005.a.discovered:0 "唤匠人来，吾城墙亦当修葺。"
 quix_murder_outcome.2005.a:0 "惜乎未能亲见其状。"
 quix_murder_outcome.2006.t:0 "开门揖盗"
 quix_murder_outcome.2006.opening_1:0 "杀[target.GetName]的事办得十分顺手。那仆役收了钱，天亮之前便把你的刺客放进了卧房。"
 quix_murder_outcome.2006.opening_2:0 "[target.GetTitledFirstName]临死前一把揪住了出卖[target.GetHerHim]的仆役。咽气之前，[target.GetSheHe]咒骂的是那个叛奴，而不是刺客。"
 quix_murder_outcome.2006.opening_3:0 "不忠的仆役打开了房门，[target.GetTitledFirstName]便死了！[target.GetSheHe]当时正在内室，毫无防备，直到门扇洞开，刺客闯了进来。"
 quix_murder_outcome.2006.owner_is_known_1:0 "\n\n不幸的是，这一刀并非悄无声息，刺客惊动了守卫！你得做好最坏的打算。"
 quix_murder_outcome.2006.owner_is_known_2:0 "\n\n刺客事后不久就被擒，等尸首被人发现，人人都会知道是你主使。"
 quix_murder_outcome.2006.no_awareness_1:0 "\n\n有那仆役帮衬，事情顺利得多。守卫还没察觉，你的刺客早已得手脱身。"
 quix_murder_outcome.2006.no_awareness_2:0 "\n\n得手之后，刺客悄然离开了[target.GetTitledFirstName]的宅邸。"
 quix_murder_outcome.2006.a.discovered:0 "家奴弑主，干吾何事！"
 quix_murder_outcome.2006.a:0 "得力之人，诚难得也。"
 quix_murder_outcome.2007.t:0 "穴地夜袭"
 quix_murder_outcome.2007.opening_1:0 "你的勇士们在卧房里砍下了[target.GetTitledFirstName]的首级！这次夜袭大获成功。"
 quix_murder_outcome.2007.opening_2:0 "你的人发现[target.GetName]正在熟睡，一刀割断了[target.GetHerHis]的喉咙！"
 quix_murder_outcome.2007.opening_3:0 "你的人闯进去时，[target.GetTitledFirstName]正与人同衾共枕，被当场砍倒在榻上！"
 quix_murder_outcome.2007.owner_is_known_1:0 "\n\n可惜事情并不全照计划：众人一进门就被守卫撞见，只得仓皇撤退。有人受了伤，落入敌手，已经全招了！"
 quix_murder_outcome.2007.owner_is_known_2:0 "\n\n夜袭本身虽然顺利，同去的人里却有人不够忠心。此人收了别人的贿赂，把计划的来龙去脉连同你的名字一并泄露了出去！卑鄙的背信之徒！"
 quix_murder_outcome.2007.no_awareness_1:0 "\n\n众人制服了所有挡路之人，又从来路撤走，前后不过一盏茶的工夫。"
 quix_murder_outcome.2007.no_awareness_2:0 "\n\n得手之后，撤退时却惊动了守卫，众人只得一路死战！幸而他们冲到马厩，夺马扬长而去。无一人被擒，袭击者是谁，至今无人知晓。"
 quix_murder_outcome.2007.a.discovered:0 "彼等恨我何妨，畏我足矣。"
 quix_murder_outcome.2007.a:0 "诸君辛苦，今夜可安枕矣。"
 quix_murder_outcome.2008.t:0 "夜骑截杀"
 quix_murder_outcome.2008.opening_1:0 "你的骑手杀了[target.GetTitledFirstName]。他从一间废弃的草屋里冲出，掠过[target.GetTitledFirstName]的随从，众人还没回过神来，长矛已经刺穿了[target.GetHerHis]的心口！"
 quix_murder_outcome.2008.opening_2:0 "[target.GetName]已死。你的骑手从林中放了一箭，当场射杀了[target.GetHerHim]！"
 quix_murder_outcome.2008.opening_3:0 "[target.GetName]终于死了。你的骑手纵马从随从身旁疾驰而过，临近时才拔出刀来，一刀斩了[target.GetTitledFirstName]，随即绝尘而去。"
 quix_murder_outcome.2008.owner_is_known_1:0 "\n\n不幸的是，那马一个踉跄，把骑手甩下了鞍。人被拿住，你的谋划也就败露了！"
 quix_murder_outcome.2008.owner_is_known_2:0 "\n\n偏偏骑手一头撞上了闻声赶来的巡逻卫士！阴谋已经败露。"
 quix_murder_outcome.2008.no_awareness_1:0 "\n\n骑手胯下是你最好的骏马，追兵根本望尘莫及，他一转眼便消失在林中！"
 quix_murder_outcome.2008.no_awareness_2:0 "\n\n众人还没弄清发生了什么，你的骑手早已去远了！"
 quix_murder_outcome.2008.a.discovered:0 "夜黑难辨，误作猛兽耳！"
 quix_murder_outcome.2008.a:0 "此路果然凶险。"
 quix_murder_outcome.2009.t:0 "假医"
 quix_murder_outcome.2009.opening_1:0 "[target.GetName]死了！你派去的假医工放干了[target.GetHerHis]的血，临走前还嘱咐家人：病人要沉沉睡上许久，切勿打扰。"
 quix_murder_outcome.2009.opening_2:0 "[target.GetName]被你派去的冒牌医工送上了黄泉路！[target.GetSheHe]把手腕交给对方，最后一次合上双眼，枕着几只软枕安然睡去。"
 quix_murder_outcome.2009.opening_3:0 "[target.GetName]把冒名的医工迎进家门，还主动伸出手腕让其放血。直到血流过多，[target.GetSheHe]才明白自己信错了人。"
 quix_murder_outcome.2009.owner_is_known_1:0 "\n\n可那冒牌货还没出门，就被一个认得真医工的人识破了！你的阴谋就此败露。"
 quix_murder_outcome.2009.owner_is_known_2:0 "\n\n可还没出门，你的人就被发现拿下了！如今整件事已人尽皆知。"
 quix_murder_outcome.2009.no_awareness_1:0 "\n\n你的假医工就这么大摇大摆地出了门，消失在夜色之中！"
 quix_murder_outcome.2009.no_awareness_2:0 "\n\n还没来得及走，宅中又有几人请他诊治！他只得给众人挨个刺血，忙了整整一夜，直到天快亮时才脱身而去。"
 quix_murder_outcome.2009.a.discovered:0 "吾荐良医于彼，岂有他意！"
 quix_murder_outcome.2009.a:0 "其病尽除，永无后患。"
 quix_murder_outcome.2010.t:0 "傩面刺客"
 quix_murder_outcome.2010.opening_1:0 "傩舞正到酣处，[target.GetName]在场中被杀了！你的刺客混在舞者之中，引开了旁人的目光，一刀刺进了[target.GetTitledFirstName]的后背！"
 quix_murder_outcome.2010.opening_2:0 "[target.GetName]当着满座宾客的面被杀。刀锋没入[target.GetHerHis]胸膛的时候，众人都怔在那里，还以为是傩戏里什么古怪的把戏！"
 quix_murder_outcome.2010.opening_3:0 "你的刺客从人群中把[target.GetName]拖进了一间僻静的屋子，[target.GetSheHe]惨叫着断了气！"
 quix_murder_outcome.2010.owner_is_known_1:0 "\n\n你的人大都逃了，却有一个满手是血的被当场拿住！你牵涉其中的事已经人尽皆知！"
 quix_murder_outcome.2010.owner_is_known_2:0 "\n\n不巧人群里有不少好勇斗狠之辈，[target.GetName]一叫出声，场中便乱作一团！你的几个人受了伤，被人擒住，这条计策已经无人不知了！"
 quix_murder_outcome.2010.no_awareness_1:0 "\n\n你的人趁乱散去，一到暗处便扔了面具、脱了舞衣、擦净血迹，各自悄悄离开，无一人被擒！"
 quix_murder_outcome.2010.no_awareness_2:0 "\n\n众人戴着面具，谁也认不出谁，拦路的人都被他们一一撂倒。无一人被擒，似乎也没有人察觉此事与你有关。"
 quix_murder_outcome.2010.a.discovered:0 "不过是傩戏闹过了头，与吾何干？"
 quix_murder_outcome.2010.a:0 "惜乎吾未亲往，当甚有趣。"
 quix_murder_outcome.2011.t:0 "胡客"
 quix_murder_outcome.2011.opening_1:0 "[target.GetName]死了！事实证明，这胡客正如传闻一般，是个好刺客。"
 quix_murder_outcome.2011.opening_2:0 "胡客那把古怪的弯刀割开了[target.GetTitledFirstName]的喉咙，这桩买卖就此了结。"
 quix_murder_outcome.2011.opening_3:0 "你雇来的胡客悄悄潜入[target.GetName]的住处，结果了[target.GetHerHis]的性命！"
 quix_murder_outcome.2011.owner_is_known_1:0 "\n\n然而这胡人并不像传闻中那么善于脱身，他被拿住了！"
 quix_murder_outcome.2011.owner_is_known_2:0 "\n\n可惜刺客虽然逃出了府邸，却因人生地不熟，没走多远就被擒获！"
 quix_murder_outcome.2011.no_awareness_1:0 "\n\n得手之后，那胡客便如凭空消失了一般——至少卫士们是这么说的。你与此事的牵连，以及诸多内情，都无人知晓！"
 quix_murder_outcome.2011.no_awareness_2:0 "\n\n那胡客一出城便混进了西去的商队，从此杳无音讯。没有人想到他背后还有雇主。"
 quix_murder_outcome.2011.a.discovered:0 "下回当用自家人。"
 quix_murder_outcome.2011.a:0 "今夜请他同饮一杯。"
 quix_murder_outcome.2012.t:0 "嗾獒"
 quix_murder_outcome.2012.opening_1:0 "[target.GetTitledFirstName]惨叫着被猛犬撕成了碎块。"
 quix_murder_outcome.2012.opening_2:0 "[target.GetTitledFirstName]挣出了犬群，可终究跑不过那些畜生。"
 quix_murder_outcome.2012.opening_3:0 "猛犬撕开了[target.GetTitledFirstName]的喉咙。你终于除掉了[target.GetHerHim]。"
 quix_murder_outcome.2012.owner_is_known_1:0 "\n\n但[target.GetSheHe]的呼救声惊动了守卫。猛犬被当场格杀，驯犬人也被拿下，受审时供出了你的名字。"
 quix_murder_outcome.2012.owner_is_known_2:0 "\n\n事后那几条饿极了的狗竟不顾驯犬人的呵斥，当场啃食起来，没过多久，这骇人的一幕就被人撞见，驯犬人因此被擒！一番逼问之下，他似乎说出了你的名字。"
 quix_murder_outcome.2012.no_awareness_1:0 "\n\n驯犬人牵着狗从原路回来，一路上没有任何人拦阻。"
 quix_murder_outcome.2012.no_awareness_2:0 "\n\n一切顺利，人们多半会把这笔账算到豺狼虎豹头上。"
 quix_murder_outcome.2012.a.discovered:0 "畜生伤人，岂能怪吾？"
 quix_murder_outcome.2012.a:0 "善哉，好犬。"
 quix_murder_outcome.2013.t:0 "汤泉"
 quix_murder_outcome.2013.opening_1:0 "[target.GetTitledFirstName]在沐浴时被你的人杀了。他们趁[target.GetHerHim]孤身一人、毫无防备之际下手，虽费了些周折，终究得手了。"
 quix_murder_outcome.2013.opening_2:0 "今日，[target.GetName]的血染红了汤泉。"
 quix_murder_outcome.2013.opening_3:0 "[target.GetTitledFirstName]赤手空拳与你的人搏斗了一阵，出人意料地凶悍，最后还是被按进池中溺死了。"
 quix_murder_outcome.2013.owner_is_known_1:0 "\n\n可[target.GetTitledFirstName]的惨叫在浴堂里回荡，惊动了卫士，你的人当场被擒！"
 quix_murder_outcome.2013.owner_is_known_2:0 "\n\n这一番搏斗让你的刺客也溅了满身血。他们没顾上洗净便逃，不久就被人撞见浑身是血，当场拿下。如今你在其中的角色已经人尽皆知。"
 quix_murder_outcome.2013.no_awareness_1:0 "\n\n你的人全身而退，没有人知道你牵涉其中。"
 quix_murder_outcome.2013.no_awareness_2:0 "\n\n打斗声引来了几名同在汤泉的浴客，也都被刺客一并打发了。既无活口，就再也查不到你头上！"
 quix_murder_outcome.2013.a.discovered:0 "吾自清白，何须洗之！"
 quix_murder_outcome.2013.a:0 "[target.GetFirstNameNoTooltip]此番洗得干净了。"
 quix_murder_outcome.2014.t:0 "临河偶遇"
 quix_murder_outcome.2014.opening_1:0 "你径直走到[target.GetName]身后。[target.GetSheHe]正望着河水出神，一动不动。你猛一伸手，把[target.GetHerHim]推进了湍急的激流！在[target.GetHerHis]的头最后一次沉下去之前，你们对视了片刻。你想，那时你大概是笑着的。"
 quix_murder_outcome.2014.opening_2:0 "你本想悄无声息地靠近，[target.GetName]却像是听见了脚步声，在最后一刻转过身来。“别过了。”你轻声说着，一把将[target.GetHerHim]推入了湍急的河水！"
 quix_murder_outcome.2014.opening_3:0 "你助跑几步，使尽全身力气一脚踹在[target.GetTitledFirstName]身上，把[target.GetHerHim]踹进了湍急的河里。[target.GetSheHe]重重地撞在礁石上，随即像一截枯木般向下游漂去。"
 quix_murder_outcome.2014.owner_is_known_1:0 "\n\n可惜你胆子太大了——这桩罪行，有一个你没看见的目击者！"
 quix_murder_outcome.2014.owner_is_known_2:0 "\n\n[target.GetSheHe]一度攀住了水中的一块礁石，冲着岸上的路人大喊，是你推了[target.GetHerHim]！片刻之后便力气不支，又滑回了河里，多半已被冲入大江了。"
 quix_murder_outcome.2014.no_awareness_1:0 "\n\n你继续赶路，度过了一个再惬意不过的下午。"
 quix_murder_outcome.2014.no_awareness_2:0 "\n\n看来众人一致认定，[target.GetName]是自己失足落水的！"
 quix_murder_outcome.2014.a.discovered:0 "彼非吾也，必有人冒名构陷！"
 quix_murder_outcome.2014.a:0 "原来大费周章，不如一推。"
 quix_murder_outcome.2015.t:0 "白日行刺"
 quix_murder_outcome.2015.opening_1:0 "[target.GetName]在市集上被你的人截住，拖进一处拐角，转眼就被了结了。"
 quix_murder_outcome.2015.opening_2:0 "你的人与[target.GetName]起了冲突，当街把[target.GetHerHim]杀了，满街的人都惊呆了。"
 quix_murder_outcome.2015.opening_3:0 "你的刺客在市中摆了个摊子，等[target.GetName]踱到跟前，猛地一矛刺穿了[target.GetHerHis]的心口。"
 quix_murder_outcome.2015.owner_is_known_1:0 "\n\n叫喊声很快四起，你的一个手下被拿住了。看样子，他已经供出了你的名字！"
 quix_murder_outcome.2015.owner_is_known_2:0 "\n\n不料市人群起围堵，你的人有几个在逃跑时被擒！你牵涉其中的事，看来已经泄露了。"
 quix_murder_outcome.2015.no_awareness_1:0 "\n\n你的人徒步逃散，没有人知道你牵涉其中。"
 quix_murder_outcome.2015.no_awareness_2:0 "\n\n这一刀竟不知怎的激起了一场骚乱！幸而你的人趁乱脱身，你在其中的角色无人知晓！"
 quix_murder_outcome.2015.a.discovered:0 "吾岂会如此明目张胆！"
 quix_murder_outcome.2015.a:0 "上策者，直截而已。"
 quix_murder_outcome.2016.t:0 "矫令收捕"
 quix_murder_outcome.2016.opening_1:0 "[target.GetTitledFirstName]被押到了你面前！你的人亮出那道文书，又胡乱列了几条罪名，[target.GetName]便束手就擒，连抵抗都没有。说话的工夫，刽子手已经在囚室里磨着斧子了。[target.GetSheHe]与死人无异。"
 quix_murder_outcome.2016.opening_2:0 "你的人已经拿住了[target.GetTitledFirstName]。他们赶着一辆与[target.GetSheHe]预想中一模一样的辎车停在面前！等[target.GetSheHe]终于问起车往何处去时，已经太迟了。"
 quix_murder_outcome.2016.opening_3:0 "你的人已经拿住了[target.GetTitledFirstName]。说到底，只用了一只麻袋套头，外加近旁一辆草车。[target.GetTitledFirstName]正忙着求饶，你的手下已在准备行刑。你倒很喜欢听这声音。"
 quix_murder_outcome.2016.owner_is_known_1:0 "\n\n不幸的是，其中一人被人收买，泄露了你的身份！卑鄙的叛徒！"
 quix_murder_outcome.2016.owner_is_known_2:0 "\n\n偏偏你的一个刺客管不住嘴，把这条妙计四处夸耀！如今你牵涉其中已是尽人皆知。"
 quix_murder_outcome.2016.no_awareness_1:0 "\n\n似乎没有人能追查到你身上。"
 quix_murder_outcome.2016.no_awareness_2:0 "\n\n从此，你可以在一个没有[target.GetName]的世上悠然度日了！"
 quix_murder_outcome.2016.a.discovered:0 "吾只欲吓之，岂料失手！"
 quix_murder_outcome.2016.a:0 "惜乎那番数罪之辞，竟未用上。"
 quix_murder_outcome.2017.t:0 "吹箭"
 quix_murder_outcome.2017.opening_1:0 "[target.GetName]中针之后面色发青，随即气绝。你的刺客在[target.GetHerHis]窗外伏了好几个时辰，才等到出手的时机。"
 quix_murder_outcome.2017.opening_2:0 "这件古怪兵器果然管用。藏在暗处的刺客吹出一枚小针，只沾了一点毒，便要了[target.GetName]的命。"
 quix_murder_outcome.2017.opening_3:0 "这东西看着新奇，用起来却极有效。[target.GetName]从敞开的窗里挨了一针，周身发青而死。大功告成！"
 quix_murder_outcome.2017.owner_is_known_1:0 "\n\n可惜你的刺客远不如那兵器好使，事后逃跑时很快就被抓住了！"
 quix_murder_outcome.2017.owner_is_known_2:0 "\n\n刺客起初躲过了搜捕，可他身上搜出的飞针与[target.GetName]身上那枚一模一样，足以定他的罪——他又把你也供了出来！"
 quix_murder_outcome.2017.no_awareness_1:0 "\n\n看来[target.GetName]起初并没把那枚小针当回事，死前随手拔掉了。没有人知道你牵涉其中！"
 quix_murder_outcome.2017.no_awareness_2:0 "\n\n看来替[target.GetName]收殓的人都没发现那枚飞针，死因成了一桩悬案！"
 quix_murder_outcome.2017.a.discovered:0 "此事……颇为尴尬。"
 quix_murder_outcome.2017.a:0 "此物之妙，名不虚传。"
 quix_murder_outcome.2018.t:0 "亲操匕首"
 quix_murder_outcome.2018.opening_1:0 "日落时分，你换上最不起眼的衣裳，怀揣匕首，从住处的窗口溜出，摸到了[target.GetName]的住处。你见[target.GetHerHim]正靠着火盆歇息，便一手捂住[target.GetHerHis]的嘴，凑到[target.GetHerHis]耳边低声道：“永别了，[target.GetName]。”好叫[target.GetSheHe]知道是你。片刻之后，[target.GetHerHis]的血便淌满了膝头！"
 quix_murder_outcome.2018.opening_2:0 "[target.GetTitledFirstName]的最后时刻……恍如一梦。你悄悄溜进[target.GetHerHis]的屋子，见[target.GetHerHim]正坐在火盆边的案前。你不声不响地走上前，在[target.GetTitledFirstName]对面坐下，[target.GetSheHe]一抬头看见你，惊得说不出话来。一阵难堪的沉默之后，[target.GetSheHe]问你是不是来杀[target.GetHerHim]的。你点头称是，又平平静静地说出了缘由。[target.GetName]竟就这么……认了。把将要发生的事说清楚，再去杀一个毫不反抗的人，这滋味实在古怪。"
 quix_murder_outcome.2018.opening_3:0 "你觉得最好先在一处热闹的客舍落脚，等到夜深人静，才从头到脚裹一身黑衣出门。你衔着匕首攀上[target.GetTitledFirstName]屋外的楼台，从虚掩的窗缝里往里窥看，见[target.GetHerHim]正在熟睡，便迅速下了手。"
 quix_murder_outcome.2018.owner_is_known_1:0 "\n\n你花了些工夫洗净血迹、平复心绪才离开，可鬼使神差地，竟把匕首落在了那里！柄上刻着你的私印，他们一定会知道是你干的！"
 quix_murder_outcome.2018.owner_is_known_2:0 "\n\n一切都顺顺当当……直到一个路人撞见你翻窗而出！更糟的是，那人一眼就认出了你，当场大呼起来！你好不容易才逃了回来。"
 quix_murder_outcome.2018.no_awareness_1:0 "\n\n你不慌不忙地翻检了[target.GetTitledFirstName]的随身之物，甚至还尝了几口[target.GetHerHis]的饭食。事毕，你大摇大摆地走了出去，没有一个人看见你。你自觉是个顶好的刺客……"
 quix_murder_outcome.2018.no_awareness_2:0 "\n\n你出手利落，又从窗口悄然消失。最难的倒是经过几名卫士身旁时，还得强压住心头的得意！"
 quix_murder_outcome.2018.a.discovered:0 "似吾者多矣，安知是吾？"
 quix_murder_outcome.2018.a:0 "欲成其事，必躬亲之。"
 quix_murder_outcome.2019.t:0 "哑力士"
 quix_murder_outcome.2019.opening_1:0 "[target.GetName]死了！[target.GetSheHe]外出闲逛时，被你那力士一双大手活活扼死。事情办妥了！"
 quix_murder_outcome.2019.opening_2:0 "[target.GetName]有气无力地还了几下手，可哪里是你雇来的力士的对手！真想亲眼看看那一幕。听说[target.GetName]被打得面目全非，若不是身上有块胎记，连家人都认不出来。"
 quix_murder_outcome.2019.opening_3:0 "说句公道话，[target.GetName]竟敢与你的力士正面交手，以两人悬殊的身手而论，[target.GetSheHe]撑得算是够久了。最后，力士一记重拳破开了[target.GetHerHis]的架势，把[target.GetHerHim]掼倒在硬地上，再补上狠狠一脚，了结了此事。"
 quix_murder_outcome.2019.owner_is_known_1:0 "\n\n可惜这力士杀人时全不知避人耳目，当场就有人看见！没过多久，他便被拿住了。"
 quix_murder_outcome.2019.owner_is_known_2:0 "\n\n力士行凶后徒步逃走，却被人一路追上擒获！他已经伏法，你牵涉其中的事也已败露。"
 quix_murder_outcome.2019.no_awareness_1:0 "\n\n[target.GetName]当时孤身一人，似乎没有人看见你的人。整桩事办得干干净净。"
 quix_murder_outcome.2019.no_awareness_2:0 "\n\n[target.GetName]的护卫想上前拦截，也都被力士一一打翻！他从容离去，一路揉着生疼的指节。"
 quix_murder_outcome.2019.a.discovered:0 "吾素不识此人，想是被打坏了脑子！"
 quix_murder_outcome.2019.a:0 "死法可怖，妙哉。"
 quix_murder_outcome.2020.t:0 "探丸之党"
 quix_murder_outcome.2020.opening_1:0 "[target.GetName]死了！听说[target.GetSheHe]如厕时，刺客从厕中暴起，一刀结果了[target.GetHerHim]。死得这般不体面。"
 quix_murder_outcome.2020.opening_2:0 "[target.GetTitledFirstName]夜里被人割断了喉咙！你终于摆脱了[target.GetHerHim]。那伙不知来历的人，果然依约办成了此事……"
 quix_murder_outcome.2020.opening_3:0 "这伙藏头露尾的人，杀起人来竟如此利落。[target.GetName]在一场宴集上被杀了！"
 quix_murder_outcome.2020.owner_is_known_1:0 "\n\n可刺客并不像你所期望的那般隐秘，转眼就被拘拿，已经说出了你的名字。"
 quix_murder_outcome.2020.owner_is_known_2:0 "\n\n不料对方故意留下了一份约书的副本，把罪责全推到你头上。看来这桩买卖从一开始，就是冲着你设下的圈套。"
 quix_murder_outcome.2020.no_awareness_1:0 "\n\n看来刺客来去都没被人察觉，你在此事中的作用也就无从查起。"
 quix_murder_outcome.2020.no_awareness_2:0 "\n\n刺客如鬼魅一般，全无踪迹可寻。没有人发现一丝一毫与你有关的线索。"
 quix_murder_outcome.2020.a.discovered:0 "必是有人暗中主使，嫁祸于吾！"
 quix_murder_outcome.2020.a:0 "此辈来去无踪，可畏可畏。"
 quix_murder_outcome.4001.t:0 "逆旅夜火"
 quix_murder_outcome.4001.failure_declaration_1:0 "[target.GetTitledFirstName]竟然还活着！"
 quix_murder_outcome.4001.failure_declaration_2:0 "你要取[target.GetTitledFirstName]性命的谋划，落空了。"
 quix_murder_outcome.4001.failure_declaration_3:0 "杀[target.GetTitledFirstName]远不如你想得那么容易——[target.GetSheHe]还活着。"
 quix_murder_outcome.4001.desc:0 "\n\n纵火之人认错了客舍。[target.GetName]毫发无伤，甚至还走到街上，看了半宿的热闹。"
 quix_murder_outcome.4001.exposed_scheme:0 "\n\n纵火之人当场被擒，把你供了出来。"
 quix_murder_outcome.4001.not_exposed_scheme:0 "\n\n纵火之人险些被拿住，好歹徒步逃脱了。只是[target.GetName]从此必定处处提防。"
 quix_murder_outcome.4001.a.discovered:0 "吾岂屑行此下作之事？必是误会。"
 quix_murder_outcome.4001.a:0 "算[target.GetFirstNameNoTooltip]命大，此事作罢。"
 quix_murder_outcome.4001.b:0 "百密一疏，再图之。"
 quix_murder_outcome.4002.t:0 "楼头冷箭"
 quix_murder_outcome.4002.failure_declaration_1:0 "箭失了准头！[target.GetName]还活着。"
 quix_murder_outcome.4002.failure_declaration_2:0 "那一箭终究没能要了[target.GetTitledFirstName]的命。"
 quix_murder_outcome.4002.failure_declaration_3:0 "以一箭取[target.GetTitledFirstName]性命的盘算，就此落空，可惜。"
 quix_murder_outcome.4002.desc:0 "\n\n弓手松弦的一刹，恰有一只鸽子掠过，生生替[target.GetTitledFirstName]挡下了这一箭。"
 quix_murder_outcome.4002.exposed_scheme:0 "\n\n[target.GetName]当即惊觉，弓手被搜出拿下，供出了你。"
 quix_murder_outcome.4002.not_exposed_scheme:0 "\n\n幸好弓手腿脚利索，赶在追兵到来之前溜之大吉，没有人知道你牵涉其中。"
 quix_murder_outcome.4002.a.discovered:0 "吾家仆不过射鸽充庖，何罪之有！"
 quix_murder_outcome.4002.a:0 "[target.GetFirstNameNoTooltip]之事，就此作罢。"
 quix_murder_outcome.4002.b:0 "当令弓手再发一矢。"
 quix_murder_outcome.4003.t:0 "一壶醇醪"
 quix_murder_outcome.4003.failure_declaration_1:0 "[target.GetTitledFirstName]还活得好好的。"
 quix_murder_outcome.4003.failure_declaration_2:0 "你原以为一坛好酒定能引[target.GetTitledFirstName]上钩，可惜算盘落空。"
 quix_murder_outcome.4003.failure_declaration_3:0 "[target.GetTitledFirstName]这辈子的最后一杯酒，还没有喝下去。[target.GetSheHe]还活着——至少眼下如此。"
 quix_murder_outcome.4003.desc:0 "\n\n[target.GetName]深谙此酒滋味，酒未入口便察觉有异。谁能想到，救了[target.GetHerHim]一命的，正是[target.GetHerHis]那点酒癖。"
 quix_murder_outcome.4003.exposed_scheme:0 "\n\n更糟的是，你一时疏忽，竟在随酒附上的书信末尾署了自己的名字！真是蠢到了家。"
 quix_murder_outcome.4003.not_exposed_scheme:0 "\n\n幸好谁也查不出这酒是你送的。权当此事从未发生过。"
 quix_murder_outcome.4003.a.discovered:0 "此非毒酒……不信可试饮！"
 quix_murder_outcome.4003.a:0 "可惜了那坛好酒。罢了。"
 quix_murder_outcome.4003.b:0 "下回须更狠些。"
 quix_murder_outcome.4004.t:0 "夜路难行"
 quix_murder_outcome.4004.failure_declaration_1:0 "趁[target.GetTitledFirstName]夜间散步下手的谋划，失败了！"
 quix_murder_outcome.4004.failure_declaration_2:0 "你的刺客没能取走[target.GetTitledFirstName]的性命！"
 quix_murder_outcome.4004.failure_declaration_3:0 "杀[target.GetTitledFirstName]的谋划落空，一番苦心尽付东流！"
 quix_murder_outcome.4004.desc:0 "\n\n[target.GetName]早早察觉了伏在暗处的刺客，不等对方近身，便高声唤来了卫士。"
 quix_murder_outcome.4004.exposed_scheme:0 "\n\n卫士拿住了刺客，那叛徒当场便招了。如今人人都知道了这桩阴谋。"
 quix_murder_outcome.4004.not_exposed_scheme:0 "\n\n幸而刺客赶在被擒之前，借着夜色溜走了。"
 quix_murder_outcome.4004.a.discovered:0 "扰吾清夜，可恼！"
 quix_murder_outcome.4004.a:0 "此等把戏，吾已厌矣。"
 quix_murder_outcome.4004.b:0 "下回，汝未必如此侥幸。"
 quix_murder_outcome.4005.t:0 "危墙之下"
 quix_murder_outcome.4005.failure_declaration_1:0 "你想让[target.GetTitledFirstName]像虫豸一样被压死在石下，可惜没能如愿。"
 quix_murder_outcome.4005.failure_declaration_2:0 "这一天开头就不顺：消息传来，[target.GetTitledFirstName]并没有被石头压死！"
 quix_murder_outcome.4005.failure_declaration_3:0 "巨石没能压死[target.GetTitledFirstName]！"
 quix_murder_outcome.4005.desc:0 "\n\n同谋迟迟撬不动那几块巨石。等石头终于坠下，[target.GetName]早已起身离去，只能眼看着自己方才坐过的地方被砸得粉碎。"
 quix_murder_outcome.4005.exposed_scheme:0 "\n\n你的人当即被擒，供出了你的名字！"
 quix_murder_outcome.4005.not_exposed_scheme:0 "\n\n幸而那不中用的家伙从城墙跳上了邻近的屋顶，甩掉了追兵。你在其中的角色无人知晓。"
 quix_murder_outcome.4005.a.discovered:0 "墙老石坠，与吾何干？"
 quix_murder_outcome.4005.a:0 "罢了，压死也太便宜[target.GetFirstNameNoTooltip]。"
 quix_murder_outcome.4005.b:0 "下回当另择简易之法。"
 quix_murder_outcome.4006.t:0 "开门揖盗"
 quix_murder_outcome.4006.failure_declaration_1:0 "唉，你要结果[target.GetName]的谋划，失败了。"
 quix_murder_outcome.4006.failure_declaration_2:0 "时运不济！[target.GetTitledFirstName]没能如期丧命。"
 quix_murder_outcome.4006.failure_declaration_3:0 "失手了！[target.GetTitledFirstName]还活着。"
 quix_murder_outcome.4006.desc:0 "\n\n那仆役根本没打算守约。房中早已埋伏停当，守卫们正等着你的人自投罗网。"
 quix_murder_outcome.4006.exposed_scheme:0 "\n\n这整件事就是个圈套！如今[target.GetTitledFirstName]已经知道了你的谋划。"
 quix_murder_outcome.4006.not_exposed_scheme:0 "\n\n不过，你的刺客竟拼死逃了出来。追兵身披甲胄、手执兵刃，脚下跑不快，被他在巷陌间甩脱；他又东躲西藏了一整夜，终究没被拿住。"
 quix_murder_outcome.4006.a.discovered:0 "此乃构陷！"
 quix_murder_outcome.4006.a:0 "[target.GetFirstNameNoTooltip]比看上去精明，罢了。"
 quix_murder_outcome.4006.b:0 "小挫而已，再作计较。"
 quix_murder_outcome.4007.t:0 "穴地夜袭"
 quix_murder_outcome.4007.failure_declaration_1:0 "你早知其中凶险——杀[target.GetTitledFirstName]的夜袭，终究失败了。"
 quix_murder_outcome.4007.failure_declaration_2:0 "对[target.GetTitledFirstName]的夜袭以失败告终！"
 quix_murder_outcome.4007.failure_declaration_3:0 "你的人没能杀死[target.GetTitledFirstName]！这次夜袭简直是一场灾祸。"
 quix_murder_outcome.4007.desc:0 "\n\n你的人潜入[target.GetTitledFirstName]的住处后接连撞见仆婢，一片混乱很快惊动了守卫，[target.GetTitledFirstName]也趁乱逃脱了。"
 quix_murder_outcome.4007.exposed_scheme:0 "\n\n众人被困在一间屋里，眼见突围无望，只得弃械投降，把你供了出来！"
 quix_murder_outcome.4007.not_exposed_scheme:0 "\n\n唯一的好消息是，众人赶在被擒之前逃了出来。"
 quix_murder_outcome.4007.a.discovered:0 "也好，教[target.GetFirstNameNoTooltip]知吾之可畏！"
 quix_murder_outcome.4007.a:0 "吾倦矣，此事作罢。"
 quix_murder_outcome.4007.b:0 "早晚之事，[target.GetFirstNameNoTooltip]且等着！"
 quix_murder_outcome.4008.t:0 "夜骑截杀"
 quix_murder_outcome.4008.failure_declaration_1:0 "[target.GetTitledFirstName]没有死在你的骑手手里！"
 quix_murder_outcome.4008.failure_declaration_2:0 "截杀[target.GetTitledFirstName]的埋伏，失败了！"
 quix_murder_outcome.4008.failure_declaration_3:0 "可恨！[target.GetTitledFirstName]还活着，你的骑手没能杀了[target.GetHerHim]！"
 quix_murder_outcome.4008.desc:0 "\n\n[target.GetName]身边恰好跟着一名神射手。骑手还没冲到近前，就被一箭射落马下。"
 quix_murder_outcome.4008.exposed_scheme:0 "\n\n骑手被生擒，受审时供出了你的名字！"
 quix_murder_outcome.4008.not_exposed_scheme:0 "\n\n唯一可堪告慰的是，那人坠马时摔断了脖子，再也供不出你来。"
 quix_murder_outcome.4008.a.discovered:0 "夜路多盗，岂能尽归咎于吾？"
 quix_murder_outcome.4008.a:0 "罢了，算[target.GetFirstNameNoTooltip]走运。"
 quix_murder_outcome.4008.b:0 "可惜了那匹好马。再图之。"
 quix_murder_outcome.4009.t:0 "假医"
 quix_murder_outcome.4009.failure_declaration_1:0 "[target.GetTitledFirstName]还活着——至少眼下如此。"
 quix_murder_outcome.4009.failure_declaration_2:0 "唉，[target.GetTitledFirstName]终究没有流血而死。真是可惜。"
 quix_murder_outcome.4009.failure_declaration_3:0 "派人冒充医工去杀[target.GetTitledFirstName]，这一计看来是落空了。"
 quix_murder_outcome.4009.desc:0 "\n\n就在要下砭石之际，真正的医工忽然登门。冒名者当场露了馅，[target.GetTitledFirstName]也立刻被人护住。"
 quix_murder_outcome.4009.exposed_scheme:0 "\n\n冒名者情急之下，招认自己是你派来的刺客，一时满座哗然！"
 quix_murder_outcome.4009.not_exposed_scheme:0 "\n\n幸好你那位假医工还能装出一副仰慕名医、冒名求教的样子！支吾几句之后，他收拾了东西，匆匆告辞。"
 quix_murder_outcome.4009.a.discovered:0 "荒唐，荒唐！"
 quix_murder_outcome.4009.a:0 "本想教[target.GetFirstNameNoTooltip]血尽而亡，罢了。"
 quix_murder_outcome.4009.b:0 "时运不济耳，容后再图。"
 quix_murder_outcome.4010.t:0 "傩面刺客"
 quix_murder_outcome.4010.failure_declaration_1:0 "令你大为恼火的是，[target.GetTitledFirstName]还活着。"
 quix_murder_outcome.4010.failure_declaration_2:0 "趁驱傩之宴杀[target.GetTitledFirstName]的谋划，彻底失败了。"
 quix_murder_outcome.4010.failure_declaration_3:0 "真是晦气！[target.GetTitledFirstName]并没有死在你的刺客手里！"
 quix_murder_outcome.4010.desc:0 "\n\n满场宾客都戴着傩面，你的人始终分不清哪一个才是[target.GetTitledFirstName]。直到宴散，刺客也没找到目标。"
 quix_murder_outcome.4010.exposed_scheme:0 "\n\n折腾了好几个时辰，他们最后盯上的竟是个认错的人！[target.GetTitledFirstName]压根就没来赴宴！你的人很快被擒，其中有人管不住嘴，全说了。"
 quix_murder_outcome.4010.not_exposed_scheme:0 "\n\n除了让你那几个不中用的刺客白白看了一夜傩戏之外，什么也没发生！"
 quix_murder_outcome.4010.a.discovered:0 "不过认错了人罢了！"
 quix_murder_outcome.4010.a:0 "众人尽兴，独吾徒劳，罢了。"
 quix_murder_outcome.4010.b:0 "当待他日再图。"
 quix_murder_outcome.4011.t:0 "胡客"
 quix_murder_outcome.4011.failure_declaration_1:0 "你雇的刺客没能杀了[target.GetTitledFirstName]！"
 quix_murder_outcome.4011.failure_declaration_2:0 "刺杀[target.GetTitledFirstName]的谋划失败了！那胡客远不如你所期望的那般得力。"
 quix_murder_outcome.4011.failure_declaration_3:0 "得知[target.GetTitledFirstName]没死在那古怪胡客手里，你心中好不懊恼！"
 quix_murder_outcome.4011.desc:0 "\n\n那胡人的装束与兵器太过扎眼，很快便招来守卫盘问。一搜身，又搜出了你给的路线图，谋杀之计就此败露。"
 quix_murder_outcome.4011.not_exposed_scheme:0 "\n\n好在这事牵连不到你——他连你姓甚名谁都不知道！"
 quix_murder_outcome.4011.exposed_scheme:0 "\n\n那图里还夹着付钱的细目和给你回信的门路！不幸的是，上面写着你的名字。"
 quix_murder_outcome.4011.a.discovered:0 "彼言语不通，必是传译有误！"
 quix_murder_outcome.4011.a:0 "吾倦矣，不复为此。"
 quix_murder_outcome.4011.b:0 "下回遣两人同往。"
 quix_murder_outcome.4012.t:0 "嗾獒"
 quix_murder_outcome.4012.failure_declaration_1:0 "你想让[target.GetTitledFirstName]葬身犬腹，可惜没能如愿。"
 quix_murder_outcome.4012.failure_declaration_2:0 "单是想象[target.GetTitledFirstName]被群犬撕咬的情形，就叫你快意不已——可惜，计划落空了。"
 quix_murder_outcome.4012.failure_declaration_3:0 "放狗去杀[target.GetTitledFirstName]，或许本就算不上什么好主意。"
 quix_murder_outcome.4012.desc:0 "\n\n[target.GetName]身上恰好带着肉脯，及时扔出去安抚了猛犬。饿犬转而扑向驯犬人，此计彻底落空。"
 quix_murder_outcome.4012.exposed_scheme:0 "\n\n驯犬人被咬得遍体鳞伤后被擒。对方作势要再放一次狗，他便说出了你的名字！"
 quix_murder_outcome.4012.not_exposed_scheme:0 "\n\n今日唯一的幸事是，那人还没来得及牵连到你，就被自己的狗咬死了！"
 quix_murder_outcome.4012.a.discovered:0 "此恶犬也，非吾所遣！"
 quix_murder_outcome.4012.a:0 "算[target.GetFirstNameNoTooltip]逃过一劫，罢了。"
 quix_murder_outcome.4012.b:0 "勿以此败兴，来日再图。"
 quix_murder_outcome.4013.t:0 "汤泉"
 quix_murder_outcome.4013.failure_declaration_1:0 "可惜，[target.GetTitledFirstName]还没有离开这个世界。"
 quix_murder_outcome.4013.failure_declaration_2:0 "你多盼着今夜能在一个没有[target.GetName]的世上安然入睡——可惜事与愿违。"
 quix_murder_outcome.4013.failure_declaration_3:0 "[target.GetTitledFirstName]滑得像条泥鳅！你以为已经拿住了[target.GetHerHim]，[target.GetSheHe]却还活着。"
 quix_murder_outcome.4013.desc:0 "\n\n刺客从浴巾里抽出短刀的同时，[target.GetTitledFirstName]也摸出了预先藏好的兵刃。[target.GetSheHe]挡住了袭击，一直撑到卫士闻声赶来。"
 quix_murder_outcome.4013.exposed_scheme:0 "\n\n刺客仓皇逃出浴堂，可在场的人认出了他们，也知道他们是受你指使。"
 quix_murder_outcome.4013.not_exposed_scheme:0 "\n\n刺客用浴巾蒙着脸逃出浴堂。没有人认出他们，自然也无人察觉你牵涉其中。"
 quix_murder_outcome.4013.a.discovered:0 "浴中口角，竟归罪于吾？"
 quix_murder_outcome.4013.a:0 "众人受此一辱，也算够了。"
 quix_murder_outcome.4013.b:0 "此番权当试手，再来。"
 quix_murder_outcome.4014.t:0 "临河偶遇"
 quix_murder_outcome.4014.failure_declaration_1:0 "你使尽了浑身解数，[target.GetTitledFirstName]却还是没有淹死在那条河里！"
 quix_murder_outcome.4014.failure_declaration_2:0 "事与愿违，[target.GetTitledFirstName]并没有被湍急的河水冲走！"
 quix_murder_outcome.4014.failure_declaration_3:0 "你原以为[target.GetTitledFirstName]落进河里必死无疑，可你错了！"
 quix_murder_outcome.4014.desc:0 "\n\n你从背后猛推了[target.GetHerHim]一把，[target.GetSheHe]却没有跌进河里，只是滚下斜坡，停在了岸边。"
 quix_murder_outcome.4014.exposed_scheme:0 "\n\n你追上去时自己失足落水，和[target.GetHerHim]一同被卷入激流！幸亏桥上有个渔人正放下渔网，你们抓着网被拖上岸，都在大口喘气。你一爬起来便拔腿就走，可[target.GetTitledFirstName]已经知道是你要杀[target.GetHerHim]！"
 quix_murder_outcome.4014.not_exposed_scheme:0 "\n\n[target.GetSheHe]落在礁石上方一片浅滩上，只受了些轻伤，随即大声呼救。你赶在旁人看见之前溜走了。好歹搅了[target.GetTitledFirstName]一整天的兴致，算是聊以自慰，可你想要的远不止这些！"
 quix_murder_outcome.4014.a.discovered:0 "吾失足滑倒耳！"
 quix_murder_outcome.4014.a:0 "可恨[target.GetFirstNameNoTooltip]命硬，罢了！"
 quix_murder_outcome.4014.b:0 "下回当按其入水。"
 quix_murder_outcome.4015.t:0 "白日行刺"
 quix_murder_outcome.4015.failure_declaration_1:0 "你的人没能杀了[target.GetTitledFirstName]。"
 quix_murder_outcome.4015.failure_declaration_2:0 "在市中刺杀[target.GetTitledFirstName]的谋划失败了！"
 quix_murder_outcome.4015.failure_declaration_3:0 "唉，没能得手。还有什么计策比当街杀了[target.GetTitledFirstName]更直截了当呢？"
 quix_murder_outcome.4015.desc:0 "\n\n[target.GetName]始终被人群簇拥着。刺客好不容易挤到近前，立刻被众人拦住，只得作罢。"
 quix_murder_outcome.4015.exposed_scheme:0 "\n\n一个卖菜的老妪抄起拐杖冲出摊子，对着刺客一阵乱打，竟把其中一人打晕了过去！其余的人逃了，可被擒的那个已经把你供了出来！"
 quix_murder_outcome.4015.not_exposed_scheme:0 "\n\n你的刺客被一群愤怒的市人追着逃出了市集，又被骑马的人追了一整天，最后总算溜掉了。至少，你与此事的牵连还无人知晓。"
 quix_murder_outcome.4015.a.discovered:0 "吾等竟成笑柄矣！"
 quix_murder_outcome.4015.a:0 "诚不幸也，罢了。"
 quix_murder_outcome.4015.b:0 "勿馁，再图之。"
 quix_murder_outcome.4016.t:0 "矫令收捕"
 quix_murder_outcome.4016.failure_declaration_1:0 "收捕并处死[target.GetTitledFirstName]的谋划，没能得逞。"
 quix_murder_outcome.4016.failure_declaration_2:0 "败了！[target.GetTitledFirstName]还活着，还……好端端的。"
 quix_murder_outcome.4016.failure_declaration_3:0 "[target.GetTitledFirstName]既没被抓走，也没被杀死！真叫人失望透顶。"
 quix_murder_outcome.4016.desc:0 "\n\n[target.GetName]本已信了那道假文书，偏偏同谋随口提到的那位官员就在附近。骗局当场被揭穿，冒充差役的人只得四散奔逃。"
 quix_murder_outcome.4016.exposed_scheme:0 "\n\n事情急转直下，你的人被拿住，熬不过拷问，全招了！"
 quix_murder_outcome.4016.not_exposed_scheme:0 "\n\n唯一的好处是，众人把这事推作一场传错了话的误会，匆匆退走了。好在你在这桩蠢事里的角色，至今无人知晓。"
 quix_murder_outcome.4016.a.discovered:0 "吾倒想一睹[target.GetTitledFirstName]当时神色！"
 quix_murder_outcome.4016.a:0 "何其令人失望，罢了。"
 quix_murder_outcome.4016.b:0 "又须从头来过。"
 quix_murder_outcome.4017.t:0 "吹箭"
 quix_murder_outcome.4017.failure_declaration_1:0 "[target.GetTitledFirstName]没有死在你的刺客手里！"
 quix_murder_outcome.4017.failure_declaration_2:0 "看来还是该用些寻常兵器——[target.GetTitledFirstName]并没有死！"
 quix_murder_outcome.4017.failure_declaration_3:0 "那枚古怪的小针，没能了结[target.GetTitledFirstName]的性命！"
 quix_murder_outcome.4017.desc:0 "\n\n刺客从没试过这件兵器，临到发射时竟把气吸反了。毒针钻进了他自己的喉咙，[target.GetName]却毫发无伤。"
 quix_murder_outcome.4017.exposed_scheme:0 "\n\n刺客倒在地上抽搐了许久才断气，身旁那根竹管和几封书信都落到了[target.GetName]手里，顺藤摸瓜，便查到了你。"
 quix_murder_outcome.4017.not_exposed_scheme:0 "\n\n幸好刺客几乎当场毙命。他本就是个无人认得的生面孔，没人能把他和你联系起来！"
 quix_murder_outcome.4017.a.discovered:0 "竖子不足与谋！"
 quix_murder_outcome.4017.a:0 "时运太差，罢了。"
 quix_murder_outcome.4017.b:0 "还是用寻常法子，再图之。"
 quix_murder_outcome.4018.t:0 "亲操匕首"
 quix_murder_outcome.4018.failure_declaration_1:0 "你怎会如此莽撞？如此愚蠢？杀[target.GetTitledFirstName]的谋划已经失败了。"
 quix_murder_outcome.4018.failure_declaration_2:0 "造化弄人！你没能杀死[target.GetTitledFirstName]。"
 quix_murder_outcome.4018.failure_declaration_3:0 "你杀[target.GetTitledFirstName]的这一计，到底不太靠谱……"
 quix_murder_outcome.4018.desc:0 "\n\n你顺利翻窗进了卧房，可快走到榻前时，被一名侍婢撞见。她一声尖叫惊醒了[target.GetTitledFirstName]，你只得立即逃走。"
 quix_murder_outcome.4018.not_exposed_scheme:0 "\n\n你急忙拉低头巾，从窗口一跃而出，跳上了邻近的屋顶。那侍婢从没见过你，天色又黑，你确信自己没被认出来。往后可不能再这般轻敌了……"
 quix_murder_outcome.4018.a.discovered:0 "吾真愚人也！"
 quix_murder_outcome.4018.a:0 "古语误吾，罢了。"
 quix_murder_outcome.4018.b:0 "此事还是交给行家罢。"
 quix_murder_outcome.4019.t:0 "哑力士"
 quix_murder_outcome.4019.failure_declaration_1:0 "[target.GetTitledFirstName]没有死在你雇的那个莽汉手里！"
 quix_murder_outcome.4019.failure_declaration_2:0 "你雇来杀[target.GetTitledFirstName]的人，没能得手。"
 quix_murder_outcome.4019.failure_declaration_3:0 "[target.GetTitledFirstName]还活着——全拜你雇来的那个彪形大汉无能所赐。"
 quix_murder_outcome.4019.desc:0 "\n\n那力士找到[target.GetName]后，竟先比比画画，要对方认下自己的身份。[target.GetTitledFirstName]连连摇头，又朝别处一指，就这么轻轻松松躲过了一劫。"
 quix_murder_outcome.4019.exposed_scheme:0 "\n\n[target.GetTitledFirstName]随即去寻了守卫。他们拿住了那个蠢汉，他比画着把你供了出来！如今人人都知道你参与了这桩阴谋。"
 quix_murder_outcome.4019.not_exposed_scheme:0 "\n\n[target.GetTitledFirstName]一声呼喊，你那力士只得躲进城郊一座空坟，一直藏到天黑！所幸他躲过了搜捕，夹着尾巴溜了回来。至少，这桩蠢事还牵连不到你。"
 quix_murder_outcome.4019.a.discovered:0 "此人脑子早被打坏，其言岂足信！"
 quix_murder_outcome.4019.a:0 "可惜。然人生尚有更要紧之事。"
 quix_murder_outcome.4019.b:0 "无妨，成事本须几番周折。"
 quix_murder_outcome.4020.t:0 "探丸之党"
 quix_murder_outcome.4020.failure_declaration_1:0 "[target.GetTitledFirstName]并没有死在你雇的刺客手里！"
 quix_murder_outcome.4020.failure_declaration_2:0 "[target.GetTitledFirstName]没有死！"
 quix_murder_outcome.4020.failure_declaration_3:0 "可惜，[target.GetTitledFirstName]还活着。"
 quix_murder_outcome.4020.desc:0 "\n\n那伙神秘人收了钱，便从此杳无踪影。从头到尾，这就是一场骗局。"
 quix_murder_outcome.4020.exposed_scheme:0 "\n\n或许你打交道的，本就是忠于[target.GetTitledFirstName]的人？又或是某个不知名的第三方？不管是谁，他们已经把计划的来龙去脉告诉了[target.GetTitledFirstName]，如今整件事已尽人皆知。"
 quix_murder_outcome.4020.not_exposed_scheme:0 "\n\n与那伙人约定的门路全都断了。你派去盯梢的人回报说，他们根本没打算动手，就这么消失了。是骗局？是圈套？还是一桩落空的阴谋？你只能暗自揣测。所幸似乎没有什么后患：既没有人拿此事要挟你，[target.GetTitledFirstName]也没听到风声。这件事，至今仍是个谜……"
 quix_murder_outcome.4020.a.discovered:0 "尔等看不出此乃有人罗织构陷乎？"
 quix_murder_outcome.4020.a:0 "吾为人所欺矣！"
 quix_murder_outcome.4020.b:0 "好一门生意。下回另寻可靠之人。"
 hd_quix_defer_murder_setup_tt:0 "暂且收手，另俟时机。只是先前的布置是否已露形迹，尚难逆料。"
