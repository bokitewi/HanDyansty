l_simp_chinese:
 # 2026-10-24 boki：徐州内斗削弱刘备（徐州未附、丹阳兵之乱），见 zz_hd_lbxz_effects.txt 节点 0、2b
 hd_lbxz_xuzhou_unsettled:0 "徐州未附"
 hd_lbxz_xuzhou_unsettled_desc:0 "陶谦新丧，丹阳旧部与徐州士族都不服这位外来之主，征发与赋税处处掣肘。"
 hd_lbxz.0210.t:0 "丹阳兵之乱"
 hd_lbxz.0210.desc_killed:0 "急报送到营中：你领兵在外，张飞与下邳相曹豹争执，一怒之下杀了曹豹。城中丹阳兵本是陶使君旧部，素来不服你这个外来之主，中郎将[hd_lbxz_dy_leader_e.GetName]连夜闭门作乱，据了州城。\n\n徐州士民观望不前，留守诸将多半降了乱兵。张飞护着家眷杀出城来，伏地请罪。陶使君托付的徐州，到底没能守住。"
 hd_lbxz.0210.desc:0 "急报送到营中：你领兵在外，城中丹阳兵哗变。这些人本是陶使君旧部，素来不服你这个外来之主，[hd_lbxz_dy_leader_e.GetName]趁机闭门作乱，据了州城。\n\n徐州士民观望不前，留守诸将多半降了乱兵。陶使君托付的徐州，到底没能守住。"
 hd_lbxz.0210.a:0 "收拾余众，暂往小沛。"
 hd_lbxz_danyang_tt:0 "[hd_lbxz_dy_leader_e.GetName]接手你的全部领地与电脑封臣，取代你的位置；你率部众复为流寓之军，屯驻小沛。玩家封臣就地独立。"
