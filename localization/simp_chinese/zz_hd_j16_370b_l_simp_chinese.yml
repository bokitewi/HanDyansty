l_simp_chinese:
 # 两晋十六国统一史实线 370 节·东晋段（5-A2）：事件 hd_j16.4500–4595、5000–5043，修正、好感、事件兵名

 hd_j16.4500.t:0 "遗诏不至"
 hd_j16.4500.desc:0 "简文帝崩于式乾殿。临终欲以周公居摄之事托付，王坦之当御床毁诏，改作「家国事一禀大司马，如诸葛武侯、王丞相故事」。太子即位，太后临朝，所谓禅让、居摄，皆成虚语。\n\n大司马望绝于内，怒形于外，扬言谢安、王坦之所为。"
 hd_j16.4500.a:0 "怏怏而已，徐图后举"
 hd_j16.4500.b:0 "入朝问罪，看他二人如何应对"

 hd_j16.4501.t:0 "孝武即位"
 hd_j16.4501.desc:0 "简文帝崩，太子[hd_news_a.GetName]即皇帝位，时年十岁。崇德太后褚氏复临朝称制，朝政委于大司马与王、谢诸公。"

 hd_j16.4510.t:0 "新亭之会"
 hd_j16.4510.desc:0 "大司马桓温自姑孰入朝，屯兵新亭，诏百官拜于道侧。京师汹汹，皆言桓公此来，将诛王、谢以移晋祚。王坦之汗流沾衣，倒执手版。\n\n你当如何赴会？"
 hd_j16.4510.a:0 "从容就席，作洛生咏「浩浩洪流」"
 hd_j16.4510.b:0 "卑辞厚礼，依附桓氏"
 hd_j16.4510.c:0 "称疾不往"

 hd_j16.4511.t:0 "新亭之会"
 hd_j16.4511.desc:0 "你屯兵新亭，百官拜于道侧。谢安从容就席，谓曰：「安闻诸侯有道，守在四邻，明公何须壁后置人邪？」\n\n帐后伏甲，只在一声令下。"
 hd_j16.4511.a:0 "笑撤伏甲，解兵还镇"
 hd_j16.4511.b:0 "王、谢不除，大事不成"

 hd_j16.4520.t:0 "求九锡"
 hd_j16.4520.desc:0 "你病笃，讽朝廷加九锡，命袁宏草诏。谢安、王坦之每见其文，辄令改之，旬日不成。"
 hd_j16.4520.a:0 "遣使催促，不容再拖"
 hd_j16.4520.b:0 "罢了，此事作罢"

 hd_j16.4521.t:0 "九锡之文"
 hd_j16.4521.desc:0 "大司马病笃，讽朝廷加九锡。袁宏草成锡文，呈于你览。桓公之病日甚一日，此文早成一日，晋室便危一分。"
 hd_j16.4521.a:0 "屡改其文，拖延时日"
 hd_j16.4521.b:0 "速予九锡，免生事端"

 hd_j16.4530.t:0 "桓温卒"
 hd_j16.4530.desc:0 "大司马桓温薨于姑孰，遗命以弟桓冲统其众，少子桓玄袭南郡公。世子桓熙谋害叔父，事泄被徙长沙。荆、徐兵柄，自此归于桓冲。"

 hd_j16.4540.t:0 "谁秉国政"
 hd_j16.4540.desc:0 "桓温既卒，朝廷无主。谢安素有重望，王坦之忠亮，众议宜以谢安总揽朝政，王坦之辅之。"
 hd_j16.4540.a:0 "委政谢安，以王坦之为中书令"
 hd_j16.4540.b:0 "朕当亲揽庶政"

 hd_j16.4541.t:0 "桓冲解扬州"
 hd_j16.4541.desc:0 "兄长既殁，你总统桓氏之众，内居扬州。僚佐劝你专擅朝权，诛除谢安。你却素以忠恕自持。"
 hd_j16.4541.a:0 "解扬州，出镇于外"
 hd_j16.4541.b:0 "据位不让"

 hd_j16.4550.t:0 "太后归政"
 hd_j16.4550.desc:0 "[hd_news_a.GetName]年已长成，崇德太后褚氏下诏归政，退居崇德宫。天子始亲万机。"

 hd_j16.4560.t:0 "举贤不避亲"
 hd_j16.4560.desc:0 "秦人屡寇淮泗，朝廷诏求文武良将可以镇御北方者。你的侄儿谢玄有经国才略，然而举荐子侄，难免招人物议。"
 hd_j16.4560.a:0 "举贤不避亲，荐谢玄镇广陵"
 hd_j16.4560.b:0 "另荐他人"

 hd_j16.4561.t:0 "谢安荐谢玄"
 hd_j16.4561.desc:0 "谢安上表，荐兄子谢玄监江北诸军事，镇广陵，招募京口、晋陵骁勇以御秦寇。郗超闻之叹曰：「安违众举亲，明也；玄必不负举，才也。」"
 hd_j16.4561.a:0 "准奏"
 hd_j16.4561.b:0 "不准"

 hd_j16.4580.t:0 "乘胜北伐"
 hd_j16.4580.desc:0 "秦军新败于淝水，北方震动，淮北诸郡人心浮动。谢安上疏请乘胜经略中原，朝廷命你都督诸军北伐。"
 hd_j16.4580.a:0 "挥师北上"
 hd_j16.4580.b:0 "保境安民"

 hd_j16.4590.t:0 "出镇广陵"
 hd_j16.4590.desc:0 "会稽王司马道子渐专朝政，群小附之，日夜构你于天子之前。功高见忌，你当如何自处？"
 hd_j16.4590.a:0 "自请出镇广陵，以避其锋"
 hd_j16.4590.b:0 "留朝相争"

 hd_j16.4595.t:0 "委政道子"
 hd_j16.4595.desc:0 "谢安既薨，朝中无人主持。会稽王司马道子是你的同母弟，众议宜以他录尚书事，总领朝政。"
 hd_j16.4595.a:0 "委政于道子"
 hd_j16.4595.b:0 "不委"

 hd_j16.5000.t:0 "孝武暴崩"
 hd_j16.5000.desc:0 "孝武帝醉后戏言，张贵人衔恨，夜中以被蒙帝面，弑之，诈称魇崩。太子[hd_news_a.GetName]即位。新帝口不能言，寒暑不辨，朝政尽归会稽王父子。"

 hd_j16.5010.t:0 "王恭举兵"
 hd_j16.5010.desc:0 "前将军王恭自京口上表，数王国宝之罪，举兵向阙。王国宝惶惧，计无所出。"
 hd_j16.5010.a:0 "收王国宝付廷尉赐死，以谢王恭"
 hd_j16.5010.b:0 "拒之，与王恭一战"

 hd_j16.5011.t:0 "兵指建康"
 hd_j16.5011.desc:0 "你上表数王国宝之罪，举兵京口。会稽王遣使来报，愿诛王国宝以谢天下，请你罢兵。"
 hd_j16.5011.a:0 "国贼既诛，罢兵还镇"
 hd_j16.5011.b:0 "进兵建康，清君侧"

 hd_j16.5012.t:0 "王国宝伏诛"
 hd_j16.5012.desc:0 "王恭举兵京口，会稽王惧，收王国宝付廷尉赐死，斩王绪于市，深谢愆失。[hd_news_a.GetName]乃罢兵还镇。"

 hd_j16.5020.t:0 "再举"
 hd_j16.5020.desc:0 "司马元显用事，割江州四郡授王愉，藩镇皆怨。殷仲堪、桓玄、杨佺期遣使相约，推你为盟主，再举向阙。"
 hd_j16.5020.a:0 "再举向阙"
 hd_j16.5020.b:0 "不举"

 hd_j16.5021.t:0 "临阵倒戈"
 hd_j16.5021.desc:0 "王恭以你为前锋。司马元显遣人以重利相啖，许以王恭之位。王恭素以门第自高，待你不过一介武夫。"
 hd_j16.5021.a:0 "倒戈，反攻王恭"
 hd_j16.5021.b:0 "从王恭到底"

 hd_j16.5022.t:0 "刘牢之倒戈"
 hd_j16.5022.desc:0 "北府将[hd_news_a.GetName]临阵倒戈，反袭王恭。王恭众溃，单骑走曲阿，为人所执，送于建康。"

 hd_j16.5025.t:0 "袭殷杨"
 hd_j16.5025.desc:0 "你与殷仲堪、杨佺期名为盟友，实相猜忌。荆州水潦，仲堪散仓廪赈饥，兵食俱乏。可乘之机，正在此时。"
 hd_j16.5025.a:0 "顺流袭江陵"
 hd_j16.5025.b:0 "按兵不动"

 hd_j16.5026.t:0 "桓玄据荆江"
 hd_j16.5026.desc:0 "[hd_news_a.GetName]袭破江陵，殷仲堪、杨佺期皆死。桓玄遂都督荆江八州，兵强一时，朝廷不能制。"

 hd_j16.5030.t:0 "讨桓玄"
 hd_j16.5030.desc:0 "桓玄据有荆江，贡赋不入，表疏骄悖。司马元显欲奉诏讨之，以刘牢之为前锋。张法顺劝曰：「玄据上流，宜早图之。」"
 hd_j16.5030.a:0 "下诏讨之"
 hd_j16.5030.b:0 "加以殊礼，安抚之"

 hd_j16.5031.t:0 "临阵倒戈"
 hd_j16.5031.desc:0 "你率北府兵为讨桓前锋，屯于溧洲。桓玄遣你族舅何穆来说：「自古戴震主之威，挟不赏之功，而能全者谁邪？」"
 hd_j16.5031.a:0 "倒戈，降于桓玄"
 hd_j16.5031.b:0 "死战"

 hd_j16.5032.t:0 "举兵东下"
 hd_j16.5032.desc:0 "司马元显矫诏数你之罪，将发兵来讨。你据上流之势，舟师可直下建康。"
 hd_j16.5032.a:0 "传檄讨元显，顺流东下"
 hd_j16.5032.b:0 "按兵不动"

 hd_j16.5033.t:0 "桓玄入建康"
 hd_j16.5033.desc:0 "[hd_news_a.GetName]入建康，自为太尉、总百揆，录尚书事。司马元显伏诛，会稽王道子徙安成。晋室之政，尽归桓氏。"

 hd_j16.5034.t:0 "刘牢之倒戈"
 hd_j16.5034.desc:0 "北府将[hd_news_a.GetName]临阵降于桓玄，元显之众不战而溃。"

 hd_j16.5040.t:0 "受禅"
 hd_j16.5040.desc:0 "你总揽朝政已久，进位相国，封楚王，加九锡。百官劝进，晋帝将禅位于你。"
 hd_j16.5040.a:0 "受禅，国号曰楚"
 hd_j16.5040.b:0 "固辞不受"

 hd_j16.5041.t:0 "桓玄篡晋"
 hd_j16.5041.desc:0 "[hd_news_a.GetName]筑坛于九井山北，受晋禅即皇帝位，国号楚，改元永始。迁晋帝于浔阳。"

 hd_j16_wangjue_modifier:0 "望绝"
 hd_j16_wangjue_modifier_desc:0 "遗诏不至，禅让、居摄皆成泡影。"
 hd_j16_shaxin_modifier:0 "杀心"
 hd_j16_shaxin_modifier_desc:0 "新亭伏甲未撤，王、谢之命悬于一线。"
 hd_j16_jiuxi_modifier:0 "九锡"
 hd_j16_jiuxi_modifier_desc:0 "车马、衣服、乐县、朱户、纳陛、虎贲、弓矢、鈇钺、秬鬯，人臣之极。"
 hd_j16_liufang_modifier:0 "流徙"
 hd_j16_liufang_modifier_desc:0 "谋害叔父事泄，被徙远方。"
 hd_j16_beifu_modifier:0 "北府兵"
 hd_j16_beifu_modifier_desc:0 "招募京口、晋陵骁勇，号为北府兵，百战百胜，敌人畏之。"
 hd_j16_fanfu_modifier:0 "反覆"
 hd_j16_fanfu_modifier_desc:0 "一人而三反，人皆疑之。"
 hd_j16_xunyang_modifier:0 "迁于浔阳"
 hd_j16_xunyang_modifier_desc:0 "禅位之后被迁于浔阳，形同软禁。"

 hd_j16_xinting_calm_opinion:0 "新亭从容"
 hd_j16_xinting_yifu_opinion:0 "依附桓氏"
 hd_j16_shaxin_opinion:0 "欲诛王谢"
 hd_j16_huanxi_plot_opinion:0 "谋害叔父"
 hd_j16_huanchong_rang_opinion:0 "解扬州"
 hd_j16_huanchong_juwei_opinion:0 "据位不让"
 hd_j16_daozi_xiang_opinion:0 "留朝相争"
 hd_j16_daoge_opinion:0 "临阵倒戈"
 hd_j16_zhu_guobao_opinion:0 "诛王国宝以谢"

 hd_j16_370b_beifu_army_name:0 "北府兵"
 hd_j16_370b_wanggong_army_name:0 "京口兵"
 hd_j16_370b_huanxuan_army_name:0 "荆江兵"
