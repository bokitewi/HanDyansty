l_simp_chinese:
 hd_yuan_jizhou.0001.t:0 "借兵图冀"
 hd_yuan_jizhou.0001.desc:0 "讨董诸军已经散去，渤海的粮道却仍握在韩馥手里。若要立足河北，便不能长久受制于人。\n\n我遣使北上，请公孙瓒出兵冀州。待白马义从压境，韩馥若求自保，就该知道向谁求援。"
 hd_yuan_jizhou.0001.a:0 "遣使北上。"
 hd_yuan_jizhou.0002.t:0 "冀州易主"
 hd_yuan_jizhou.0002.desc:0 "公孙瓒与韩馥交兵已有一月。我派去的说客直入韩馥府中：北方兵锋逼近，冀州虽富，谁能替他守住？\n\n韩馥终于交出印绶，将所领州郡与部众一并让与我，自身入府安置。我得到了冀州，也接下了尚未平息的兵争。公孙瓒原想分取州郡，如今眼见我独得其利，岂肯善罢甘休。"
 hd_yuan_jizhou.0002.a:0 "接掌州府，整顿诸军。"
 hd_yuan_jizhou_cb:0 "争夺冀州"
 HD_YUAN_JIZHOU_WAR_NAME:0 "[ATTACKER.GetShortUIName]争夺冀州之战"
 hd_yuan_jizhou_victory_desc:0 "进攻方夺取冀州战争目标及相应领土与封臣。"
 hd_yuan_jizhou_no_conquest_desc:0 "进攻方未能夺取冀州；已完成的韩馥让地不会撤销。"
 hd_yuan_life_jizhou:0 "入主冀州"
