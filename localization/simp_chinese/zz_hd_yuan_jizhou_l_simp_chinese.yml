l_simp_chinese:
 hd_yuan_jizhou.0001.t:0 "借兵图冀"
 hd_yuan_jizhou.0001.desc:0 "讨董诸军散去，渤海的粮道却仍要看韩馥的脸色。你听完催粮的回报，转而问起冀州北面的动静。\n\n韩馥坐拥富庶州郡，若无外患，未必肯认真听你“相助”之言。公孙瓒的兵马恰在北方；邀他南下，既可逼韩馥重新掂量自己的处境，也能叫你不必永远守着渤海等人周济。\n\n北上的书信已经发出。纸上写的是共图进取，真正落子之后，却还要看韩馥如何求援、公孙瓒如何用兵。你把回书的位置空在案上，等那两处的消息先后送来。"
 hd_yuan_jizhou.0001.a:0 "且观伯圭兵势，静候冀州回音。"
 hd_yuan_jizhou.0002.t:0 "冀州易主"
 hd_yuan_jizhou.0002.desc:0 "韩馥的州印终于摆到你面前。接过时，手上竟没有想象中沉，倒是随同交来的簿籍一卷接着一卷，铺满了几案。\n\n他的州郡与部众如今归你节制，本人也已入府安置。北边的旧战随之停下，公孙瓒盼着的好处，却没有照先前那样落到他手里。左右提起此事，你只叫他们先把冀州的交割办妥。\n\n粮道不必再仰人鼻息，袁氏终于握住了一州根本。至于伯圭，他愿意怎么想，自有日后的来书。今日这方州印，先由你收好了。"
 hd_yuan_jizhou.0002.a:0 "收印入怀，料理冀州。"
 hd_yuan_jizhou_cb:0 "争夺冀州"
 HD_YUAN_JIZHOU_WAR_NAME:0 "[ATTACKER.GetShortUIName]争夺冀州之战"
 hd_yuan_jizhou_victory_desc:0 "公孙瓒夺取冀州境内韩馥所据之地，当地封臣随之改投。"
 hd_yuan_jizhou_no_conquest_desc:0 "两家罢兵，冀州之争就此作罢。"
 hd_yuan_jizhou_handover_peace_desc:0 "冀州形势已变，此战失了名目，就此作罢。"
 hd_yuan_life_jizhou:0 "入主冀州"
