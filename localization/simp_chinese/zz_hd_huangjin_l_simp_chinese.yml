l_simp_chinese:
 hd_subdue_qingzhou_huangjin_decision:0 "招降青州黄巾"
 hd_subdue_qingzhou_huangjin_decision_desc:0 "青州黄巾百万之众，正辗转于青、兖之间，且战且饥。遣使招抚，收其精壮，可成一支劲旅。\n\n然而能否收其众、安其食、结其心，尽在三验：阅其营垒（军事），屯其就食（管理），盟其渠帅（外交）。每验有成，得青州军4000人；三验俱成，更增10000人，直辖诸县亦蒙屯垦之利。\n\n#weak 此议天下仅有三次尝试之机，一人毕生只可一试。任一验出现大成功，或有人三验俱成，此议即对天下永久关闭。#!"
 hd_subdue_qingzhou_huangjin_decision_tooltip:0 "通过军事、管理、外交三重鉴定，收编青州黄巾的精壮为青州军。"
 hd_subdue_qingzhou_huangjin_decision_confirm:0 "受降如受战：阅其众、安其食、结其心，三验定成败。"
 hd_hj_qingzhou_army:0 "青州军"
 hd_hj_qingzhou_reclaim_county_modifier:0 "青州军屯"
 hd_hj_qingzhou_reclaim_county_modifier_desc:0 "受降的黄巾部众被编为军屯，且耕且战，乡野日渐繁庶。"
 hd_huangjin.1.t:0 "辕门受降"
 hd_huangjin.1.desc_fail:0 "辕门外，鼓声敲过三通。一个白发老卒捧着半坛浊酒跪在雪泥里，身后是望不到头的连营——青州黄巾男女百余万口，沿着河滩一直扎到天边。\n\n“只求条活路。”老卒说。话不假，可你按辔行过连营，越看心越沉：伍不成伍，队不成队，兵器是锄头改的枪，甲衣缀满补丁。渠帅们眼巴巴望着你的将旗——这样的兵拉上战场，是添战力，还是添累赘？"
 hd_huangjin.1.desc_success:0 "辕门外，鼓声敲过三通。白发老卒捧酒跪于雪泥，身后连营百余万口，望不到头。\n\n你与麾下诸将按剑行于营中，一路点视：阵虽不整，行伍间却有一股亡命求生的狠劲；挑出来的精壮，大半是种过田、也打过仗的汉子。老卒仰起脸：“肯给活路的人，俺们跟定。”随行诸将低声道——稍加操练，此众可得数万可用之兵。收，还是不收，就在今日。"
 hd_huangjin.1.desc_crit:0 "辕门外，鼓声敲过三通。白发老卒捧酒跪于雪泥，身后连营百余万口，望不到头。\n\n演武开始，你原只当会看一场乱民的闹剧——可鼓声起处，各营应声而动，进退分合，竟隐隐有章法！领兵的渠帅出身行伍，令旗所至，万人如一。你勒马高坡，胸中如闻惊雷：这不是流寇，这是一柄铸成一半的利剑，只待执剑之人。\n\n自今日起，天下将知这百万之众归于谁手。"
 hd_huangjin.1.a:0 "传令受降，先安其食"
 hd_huangjin.2.t:0 "且耕且战"
 hd_huangjin.2.desc_fail:0 "粮车在辕门外排成长队，一斗一斗往营里搬，像往漏了底的瓮里注水。\n\n总管把册子摊开在你面前：百余万口，日食何止千石；府库之粟，撑不过百日。“主公，养兵先养粮。没有粮，再好的兵，开春之前也是一场大乱——别忘了，他们可是反过一次的人。”营外粥棚黑压压的人头，一直排到河滩上。"
 hd_huangjin.2.desc_success:0 "粮车在辕门外排成长队，而总管带来的不只是粮册。\n\n他连夜清点降众，议定章程：老弱编入屯户，分与无主荒田；精壮另立军籍，春夏务农，秋冬操练。“以屯养兵，且耕且战。”他用炭笔在地图上圈出河滩与荒地，“不出两年，这百万张嘴，能给主公养出一支大军。”册子递到你面前，只差落印。"
 hd_huangjin.2.desc_crit:0 "粮车在辕门外排成长队，而总管带来的不止是粮册。\n\n他督着降众清渠引水，按什伍编籍授田。旬月之间，荒滩上升起炊烟；冬修水利，春垦青兖，昔日劫掠郡县的流寇，如今为着一季收成早出晚归。岁末盘账，屯田竟有盈余可输军前——百万张嘴，就这样变成了百万双开渠垦荒的手。\n\n总管捧着账册，声音发颤：“主公，此天以衣食资将军也。”"
 hd_huangjin.2.a:0 "用印。再召诸渠帅歃血"
 hd_huangjin.3.t:0 "歃血为誓"
 hd_huangjin.3.desc_fail:0 "渠帅的大帐里，牛耳尖刀在案，血酒在碗，可你环视诸人，读出的全是疑惧。\n\n有人盯着你腰间的剑，有人借口更衣离席。当初那个捧酒跪雪的老卒把酒一饮而尽，却终究不肯对天起誓。当夜，几股人马悄悄拔营，重新落草去了——青兖之间从此多了几股流寇，而你的招抚，成了群雄口中的笑谈。"
 hd_huangjin.3.desc_success:0 "渠帅的大帐里，牛耳尖刀在案，血酒在碗。\n\n你举碗论天下：黄天也好，苍天也罢，百姓要的不过一口饭吃。帐中静了半晌，当初捧酒跪雪的老卒起身，一刀割破指端，血滴入酒：“从今往后，俺们的命，就是将军的了。”诸渠帅次第歃血。三验至此，降众之心，终于落定。"
 hd_huangjin.3.desc_crit:0 "渠帅的大帐里，牛耳尖刀在案，血酒在碗。\n\n你没有谈条件，而是当众解开了被缚的老渠帅，扶他上座，自陈天下饥馑、庙堂失道。言及阵亡的乡亲，帐中恸哭成一片。而后你举碗立誓：黄巾旧部，今日之后皆为编户之民，一视同仁。\n\n满帐渠帅纳头便拜。次日清点，诸部尽数易帜——青州军之名，自此立于天下。"
 hd_huangjin.3.a:0 "传令：择壮编伍！"
 hd_huangjin.3.reward_full:0 "三验俱成！得青州军22000人（每验4000，全过另增10000）；直辖诸县发展度增长+30%，为期20年。"
 hd_huangjin.3.reward_8000:0 "得青州军8000人。"
 hd_huangjin.3.reward_4000:0 "得青州军4000人。"
 hd_huangjin.3.reward_none:0 "三验皆败，降众散去，一无所获。"
 hd_huangjin.3.closed_crit:0 "鉴定中出现大成功——“招降青州黄巾”决议已对天下所有人永久关闭。"
 hd_huangjin.3.closed_full:0 "三验全过——“招降青州黄巾”决议已对天下所有人永久关闭。"
 hd_huangjin.3.closed_third:0 "此为天下第三次尝试——“招降青州黄巾”决议已彻底关闭。"
