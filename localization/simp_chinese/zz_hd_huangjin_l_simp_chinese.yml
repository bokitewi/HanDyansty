l_simp_chinese:
 hd_subdue_qingzhou_huangjin_decision:0 "招降青州黄巾"
 hd_subdue_qingzhou_huangjin_decision_desc:0 "青州黄巾号称百万之众，正辗转于青、兖之间，且战且饥。若能遣使招抚，收其精壮，便可得一支劲旅。\n\n只是受降如受敌：要收其众，须亲阅其营垒；要安其食，须筹措屯田与口粮；要结其心，还得与诸渠帅歃血为盟。三事各有成败，所得多寡，全看这几番交涉。\n\n这样的机缘，一生只得一回。青州降众也只有一份：一旦有人招抚得法，或几番招抚之后人心散尽，此事便再无可为。"
 hd_subdue_qingzhou_huangjin_decision_tooltip:0 "遣使招抚青州黄巾，收其精壮为青州军"
 hd_subdue_qingzhou_huangjin_decision_confirm:0 "受降如受敌，不可轻忽！"
 hd_hj_qingzhou_army:0 "青州军"
 hd_hj_qingzhou_reclaim_county_modifier:0 "青州军屯"
 hd_hj_qingzhou_reclaim_county_modifier_desc:0 "受降的黄巾部众被编为军屯，且耕且战，乡野日渐繁庶。"
 hd_huangjin.1.t:0 "辕门受降"
 hd_huangjin.1.desc_fail:0 "鼓声已经响过，后列还在乱动。你立在辕门前，看着一面令旗竟传不动这许多人，方才那点收得强兵的期待也冷了下来。\n\n走近了才看清：兵器残缺，行伍不明，许多人不过是跟着人群讨口饭吃。渠帅急着分辩，你抬手叫他住口——连自己的部众都数不清，到了阵前，又拿谁来听令？\n\n他垂下头，周围也再没人吭声。你把阅众的事暂且收住。军中要的是能用之兵，可营外这许多张嘴，还等着吃饭。明日先议粮食，看看这场招抚究竟还能留住什么。"
 hd_huangjin.1.desc_success:0 "鼓令传了几遍，降众才渐渐排齐。你沿着行伍走过去，有人还在找自己该站的位置，也有人一听喝令便立刻收住脚步。\n\n“后面那些，是用得上的。”你指给左右看，没有因前列混乱便把所有人一概赶开。兵器可以配，营伍可以整；乱世之中，还肯听号令、拿得动刀枪的人，不该轻易放过。\n\n渠帅见你开始记名，忙问何时能入营。你没有立刻许下军额，只问他们有多少口人要吃饭。话音一落，四下比方才整队时还静。原来他们最怕的，始终是这一问没有下文。"
 hd_huangjin.1.desc_crit:0 "辕门外降众列得密密层层。你原以为还得吼上几遍，不料鼓声一起，前后各队竟依次站定，连旗尾的人也纹丝不动。\n\n你沿队走过，在几个肩背结实的军士面前停下。他们手里的兵器杂乱，望向令旗的眼神却毫不含糊。“从前便是这样列阵的？”你问。渠帅赶忙答话，语气里终于有了几分底气。\n\n这些人若只当流散饥民放走，倒是你看走了眼。你回身叫人记下可用之众，又问营中还剩多少口粮。要他们替你打仗，总得先让他们明白，归来之后有路可走。"
 hd_huangjin.1.a:0 "阅众已毕，明日议粮。"
 hd_huangjin.2.t:0 "且耕且战"
 hd_huangjin.2.desc_fail:0 "昨日的鼓声还在耳边，今日摊开的粮簿却先给你泼了一盆冷水。报来多少口人，便得拿出多少粮；那些尚未开垦的田，眼下连一顿饭也抵不了。\n\n书吏算到第三遍，声音越来越低。你指出他写错的一处，改过之后，缺口反倒更清楚了。营外又有人来问接济，左右面面相觑，谁也不愿先出去答话。\n\n你按住簿册，叫人把难处照直记下。明日还要见诸渠帅，今日这笔粮账却怎么也糊弄不过去。招人时一句收留说来容易，真要让他们留下，竟如此费力。"
 hd_huangjin.2.desc_success:0 "今日不再试弓刀，先算饭食。随营的老弱与精壮各有名数，你一项项问过，最不愿听的，便是有人把所有口人都报作兵额。\n\n几番核对，总算议出安置的办法：能战的编入行伍，其余另行安顿，眼前存粮与日后耕作都勉强接得上。你叫书吏重誊一份，空处宁可留着，也别为讨一句好话添出并不存在的粮。\n\n章程放回案上，你又看了一眼。算得过来，未必就办得顺；明日还须与诸渠帅当面说清，让他们知道你肯给什么，也知道归你号令便须守什么。"
 hd_huangjin.2.desc_crit:0 "昨日阅众之后，你已叫人把口数与田亩分别查报。今日几份簿册铺开，先前各说各话的数目，竟能一项项对上。\n\n能战者入伍，其余人众安置耕作，眼前的接济也找到了可行的门路。你听到最后，亲手提笔对了两处，那口一直提着的气才落了下去。若只把人聚来吃粮，再大的府库也养不起一场没有尽头的受降。\n\n“照此办理。”你把簿册递了回去。地里还没有收成，但至少不必再拿空话去应付饥民了。明日见诸渠帅，你终于有些靠得住的话可说。"
 hd_huangjin.2.a:0 "簿册既定，明日与渠帅立约。"
 hd_huangjin.3.t:0 "歃血为誓"
 hd_huangjin.3.desc_fail:0 "话说到长久听命，诸渠帅的答复便慢了下来。有的望着地面，有的只说愿暂且留下，方才还肯应声的人，也把嘴闭得紧紧的。\n\n你把条件重说一遍，耐心却已不如开头。“入了军中，便不能各行其令。”此话一出，帐内越发安静。直到散去，也没有一人肯给你一句靠得住的话。\n\n你看着空下的坐席，把前两日的军籍与安置簿取回案前。能留下多少人，还得从这两日的所得里去找；若连可用的精壮与给养都没有着落，这场招抚便真要空手而归了。"
 hd_huangjin.3.desc_success:0 "诸渠帅进帐后，你先讲这两日查核所得，再把军中约束一条条说清。有人听到后面，终于忍不住问：“若有冤抑，还许我等再来陈说么？”\n\n你看了他一眼，让他把话讲完。他肯问，总胜过低着头唯唯诺诺。几番往返之后，众人终于愿意立约，先前绷紧的肩背也松了些。\n\n你端起手边的水，才觉得说得口干。人心暂且稳住了，接着便要把可用之众与粮食安置两相对过，定下最后的军额。帐外已有候令的人，今日不必再让他们带着疑虑散去。"
 hd_huangjin.3.desc_crit:0 "诸渠帅依约入帐，起初都坐得拘谨。你没有催他们起誓，先把编伍、安置与军中约束一条条说开，问还有哪处不明白。\n\n终于有人抬头，问家口能否安顿；又有人问入营以后听谁号令。话一多，先前那层防备倒渐渐散了。最后一人应诺时，旁人也跟着俯身，声音比来时齐整得多。\n\n你叫他们起身，心里已开始掂量前两日留下的名册与粮数。肯归心是好事；究竟能留多少人执兵，还要看挑得出多少精壮、安置得了多少口人。今日这番话，总算没有白说。"
 hd_huangjin.3.a:0 "定下军额，收整降众。"
 hd_huangjin.3.reward_none:0 "降众终究散去，你此番一无所得。"
 hd_huangjin.3.closed_crit:0 "你招抚得法，青州降众的人心已为你所收，旁人再难插手此事。"
 hd_huangjin.3.closed_full:0 "青州降众尽归你麾下，此后天下再无第二家能招抚他们。"
 hd_huangjin.3.closed_third:0 "青州黄巾屡经招抚，人心已散，此后再无人能以招安之名收其众。"
 hd_subdue_qingzhou_huangjin_decision_effect_tt:0 "你将亲赴青、兖之间受降：阅其众，安其食，结其心。\n#EMP 此番招抚成败难料，所得多寡，全看三番交涉的分寸。#!"
