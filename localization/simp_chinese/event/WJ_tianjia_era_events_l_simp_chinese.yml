l_simp_chinese:
 SG_Nianhao_event.001_t:0 "改元$Color_ZanBai$「[SCOPE.sC('wj_era_author').Custom('SanGong_NianHao')]」诏"
 SG_Nianhao_event.001_d:0 "#v 门下：\n\n朕以凉德，嗣守鸿图，夙夜祗惧，弗克负荷。仰惟上天眷命之隆，俯念四海生民之重，励精求理，于兹有年。\n\n朕祗承天序，恭御宸极，爰以\n$Color_ZanBai$「[SCOPE.sC('wj_era_author').Custom('SanGong_NianHao')]」#!#v 纪元\n[SCOPE.sC('wj_era_author').Custom('SanGong_NianHao_tt')]\n自今年正月朔旦为始。庶几政化惟新，万姓咸宁，永绥厥位。\n\n布告中外，咸使闻知。"
 SG_Nianhao_event.001.a:0 "改元布新"
 SG_Nianhao_event.002_t:0 "择定年号"
 SG_Nianhao_event.002_d:0 "#v 自三代以降，王者受命而兴，必立年号以纪岁、以正朔、以明政教之始。今陛下承天之祚，当择一美号，昭示四方，垂法后世。\n陛下欲取何意为号？"
 SG_Nianhao_event.002.a:0 "祥瑞符应"
