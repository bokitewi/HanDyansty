 # 来源：localization/simp_chinese/WJ_office_roads_loc_l_simp_chinese.yml
 WJ_langguan_xuncha.0001.a:0 "整饬仪仗，巡视四境。"
 WJ_langguan_xuncha.0001.desc:0 "你率属吏出城巡察，沿途吏民夹道相迎。"
 WJ_langguan_xuncha.0001.t:0 "郎官出巡·巡察"
 WJ_langguan_xuncha.0002.a:0 "升堂问案，明断是非。"
 WJ_langguan_xuncha.0002.desc:0 "县衙里积案如山，吏民争讼不休。"
 WJ_langguan_xuncha.0002.t:0 "郎官出巡·断案"
 WJ_langguan_xuncha.0003.a:0 "访贫问苦，体察民情。"
 WJ_langguan_xuncha.0003.desc:0 "田间老农与市井商贩，各有苦乐。"
 WJ_langguan_xuncha.0003.t:0 "郎官出巡·问民情"
 WJ_langguan_xuncha.0100.a:0 "此番出巡，获益良多。"
 WJ_langguan_xuncha.0100.desc:0 "巡行数月，政事渐熟，贤望渐增。"
 WJ_langguan_xuncha.0100.t:0 "郎官出巡·返署"
 WJ_recommendation_reply.0001.a:0 "善，当为朝廷得一士。"
 WJ_recommendation_reply.0001.t:0 "孝廉察举之复"
 WJ_recommendation_reply.0002.a:0 "既不愿受举，本年名额仍在。"
 WJ_recommendation_reply.0002.desc:0 "明公雅意，铭感于心。只是眼下实有未竟之事，不敢贸然奉举入署，还请容我辞谢。"
 WJ_recommendation_reply.0002.t:0 "孝廉察举之复"
 WJ_recommendation_reply.0101.a:0 "谨谢知遇。"
 WJ_recommendation_reply.0101.t:0 "请求举孝廉之复"
 WJ_recommendation_reply.0102.a:0 "只得另候机缘。"
 WJ_recommendation_reply.0102.desc:0 "来请已阅。察举关乎乡论与官箴，眼下我尚不能以本年名额举[secondary_actor.Custom('WJ_GetLinkedUIName')]为孝廉，此议作罢。"
 WJ_recommendation_reply.0102.t:0 "请求举孝廉之复"
 WJ_recommendation_reply.0201.a:0 "此举当不负公论。"
 WJ_recommendation_reply.0201.desc:0 "承蒙明公不以我才疏，愿奉察举为茂才，听候朝廷任使。所议诸项，亦当一并践行。"
 WJ_recommendation_reply.0201.t:0 "茂才察举之复"
 WJ_recommendation_reply.0202.a:0 "既如此，本年名额仍在。"
 WJ_recommendation_reply.0202.desc:0 "明公推举之恩，不敢轻忘。只是眼下志业未定，尚不能奉举为茂才，还请容我辞谢。"
 WJ_recommendation_reply.0202.t:0 "茂才察举之复"
 WJ_recommendation_reply.0301.a:0 "谨谢举主。"
 WJ_recommendation_reply.0301.desc:0 "来请已阅。[secondary_actor.Custom('WJ_GetLinkedUIName')]才望可观，我愿以本年名额举其为茂才，使列朝廷任用之选。所议诸项，就此为定。"
 WJ_recommendation_reply.0301.t:0 "请求举茂才之复"
 WJ_recommendation_reply.0302.a:0 "只得另访举主。"
 WJ_recommendation_reply.0302.desc:0 "来请已阅。茂才之举不可轻授，眼下我尚不能以本年名额举[secondary_actor.Custom('WJ_GetLinkedUIName')]，此议作罢。"
 WJ_recommendation_reply.0302.t:0 "请求举茂才之复"
 wj_temp_official.1000.a:0 "逐项勾稽，直指数目相悖之处"
 wj_temp_official.1000.b:0 "依旧式复核，只呈确定无疑之误"
 wj_temp_official.1000.desc:0 "[scope:wj_assessment_examiner.Custom('WJ_GetLinkedUIName')]先命你核验一册郡县计簿。户口、田租与仓谷数目彼此牵连，其中还夹着数处刻意留下的舛误。"
 wj_temp_official.1000.t:0 "假吏考课：清核簿书"
 wj_temp_official.1001.a:0 "权衡缓急，提出一套可行章程"
 wj_temp_official.1001.b:0 "谨循常例，先赈后征"
 wj_temp_official.1001.desc:0 "继而问以治事：水旱之后，仓储有限，豪强又争先请贷。你必须安排赈给、催科与治安的先后，而不能只说空泛善政。"
 wj_temp_official.1001.t:0 "假吏考课：临事处断"
 wj_temp_official.1002.a:0 "据实陈奏，并条列后续改弦之策"
 wj_temp_official.1002.b:0 "只答成例与已成之事，不作虚言"
 wj_temp_official.1002.desc:0 "最后，[scope:wj_assessment_examiner.Custom('WJ_GetLinkedUIName')]追问你试守以来的得失：何事办成，何事失当，又当如何补救。虚饰容易，直陈最难。"
 wj_temp_official.1002.t:0 "假吏考课：吏部奏对"
 wj_temp_official.1005.a:0 "奉受课第，正式入仕"
 wj_temp_official.1005.b:0 "谨记所失，来年复考"
 wj_temp_official.1005.desc:0 "簿书、治事与奏对皆已考毕，吏部据你的临场应对与平日贤望合定课第。"
 wj_temp_official.1005.desc_fail:0 "你的簿书或治事仍有疏漏，课第未及合格。官职暂予保留，但仍以假吏试守，来年复考。"
 wj_temp_official.1005.desc_good:0 "你的治事大体周备，课第良好。朝廷据你现任官职正式定其出身。"
 wj_temp_official.1005.desc_high:0 "你的簿书无误，处事有方，奏对亦能直陈利害，课第优异。朝廷据你现任官职正式定其出身。"
 wj_temp_official.1005.desc_pass:0 "你的应对虽不出众，却足以任事，课第合格。朝廷据你现任官职正式定其出身。"
 wj_temp_official.1005.t:0 "假吏考课：定课"

 # 来源：localization/simp_chinese/WJ_qingyi_loc_l_simp_chinese.yml
 WJ_qingyi.0001.a:0 "且待诸贤毕至。"
 WJ_qingyi.0001.desc.guest:0 "我抵达馆舍时，主人已命人铺好坐席，案上陈着经卷、茶汤与麈尾。先到的宾客在廊下低声叙旧，后来者尚在途中；今日所议虽未开题，人物高下却仿佛已经在众目之间。"
 WJ_qingyi.0001.desc.host:0 "仆役们撤去高案，铺开坐席，又将经卷、麈尾、茶炉与酒具一一安置妥当。馆舍里暂且清静，远来的宾客却已陆续抵达；我在廊下稍作歇息，只待诸贤毕至，便可举麈发端。"
 WJ_qingyi.0001.t:0 "清议：虚席以待"
 WJ_qingyi.0002.a:0 "诸君，请各陈所见。"
 WJ_qingyi.0002.desc:0 "诸贤依次入席，衣冠与麈尾映在竹帘筛下的日光里。寒暄渐止，我环顾满座，举麈轻叩案沿：今日不问爵秩，不拘章句；玄理、名教、人物与时务，但有所见，皆可直陈。馆舍顿时安静下来，第一番高论只等有人开口。"
 WJ_qingyi.0002.t:0 "清议：宾主既集"
 WJ_qingyi.0003.a:0 "且看今日有何高论。"
 WJ_qingyi.0003.desc:0 "宾客们已经依次就席。主人举麈致意，言明今日不以官爵压人，也不以旧说禁言；席间有人展卷，有人把盏，也有人只含笑打量诸贤。第一道论题尚未说尽，机锋与品题便已隐约可闻。"
 WJ_qingyi.0003.t:0 "清议：入席论道"
 WJ_qingyi.1001.a:0 "循有入无，以玄理答之"
 WJ_qingyi.1001.a.failure:0 "言辞游移，反被追问"
 WJ_qingyi.1001.a.success:0 "义理贯通，满座首肯"
 WJ_qingyi.1001.b:0 "以治事之实，验玄言之虚"
 WJ_qingyi.1001.b.failure:0 "事例支离，未能自圆"
 WJ_qingyi.1001.b.success:0 "经世之论切中事理"
 WJ_qingyi.1001.c:0 "且引诸家旧说，让众人各陈所见"
 WJ_qingyi.1001.desc:0 "我才举麈开言，[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]便接过话头：若万物因有而用，何以又须以无为本？满座目光随之转向我，开席第一论已无从敷衍。"
 WJ_qingyi.1001.t:0 "清虚发端"
 WJ_qingyi.1002.a:0 "迎其锋芒，当席析明"
 WJ_qingyi.1002.a.failure:0 "越辩越窘，声势尽失"
 WJ_qingyi.1002.a.success:0 "数语解结，反使诘难者折服"
 WJ_qingyi.1002.b:0 "先解其意，再化其锋"
 WJ_qingyi.1002.b.failure:0 "话虽圆润，却未解根本"
 WJ_qingyi.1002.b.success:0 "温言转圜，宾主皆得体面"
 WJ_qingyi.1002.c:0 "无礼！清议岂容这般相逼？"
 WJ_qingyi.1002.desc:0 "[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]忽然前倾，举出我话中一处矛盾，问得又快又直。席间原有的低语顿时止住——这一问若答不好，今日主人便要先折一角。"
 WJ_qingyi.1002.t:0 "折角之问"
 WJ_qingyi.1003.a:0 "本末相贯，经义自可用于时务"
 WJ_qingyi.1003.a.failure:0 "拘泥章句，难应现实之问"
 WJ_qingyi.1003.a.success:0 "引经断事，义理与政务相合"
 WJ_qingyi.1003.b:0 "请席间最博学者为众人申说"
 WJ_qingyi.1003.c:0 "此处我亦有疑，何妨共求其解"
 WJ_qingyi.1003.desc:0 "谈到礼法，[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]将经中一句落到今日州郡之政：古义若不能施于吏治，究竟只是章句，还是仍有可用之本？茶汤渐凉，众人却都在等一个能通经世的回答。"
 WJ_qingyi.1003.t:0 "经义与时务"
 WJ_qingyi.1004.a:0 "愿闻其详，我当虚心受教"
 WJ_qingyi.1004.b:0 "辞与理本可相成，不妨当席再论"
 WJ_qingyi.1004.b.failure:0 "强为机锋，反显轻薄"
 WJ_qingyi.1004.b.success:0 "应对明澈，名士亦为之改观"
 WJ_qingyi.1004.c:0 "高论留在心中便好，今日且从容"
 WJ_qingyi.1004.desc:0 "特邀名士[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]听我良久，只以麈尾轻点案前，道：‘辞胜于理，未必能服人；理胜于辞，亦未必能行世。’一言既出，满座都在看我如何领会。"
 WJ_qingyi.1004.t:0 "一言之鉴"
 WJ_qingyi.1005.a:0 "此人有器，足任一方"
 WJ_qingyi.1005.b:0 "才有所长，亦有所短，不必过誉"
 WJ_qingyi.1005.c:0 "品人须见根本，让我直言"
 WJ_qingyi.1005.c.failure:0 "言过其实，反伤彼此"
 WJ_qingyi.1005.c.success:0 "品题入骨，无人能驳"
 WJ_qingyi.1005.desc:0 "话锋从玄理转到人物，[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]的品行与才具忽然成了满座议论之题。众人请我作一语月旦；这一句话，足以为其增价，也可能让我们从此相恶。"
 WJ_qingyi.1005.t:0 "席间月旦"
 WJ_qingyi.1006.a:0 "任其纵意，何必以礼绳人"
 WJ_qingyi.1006.b:0 "清谈贵在自然，也不可失度"
 WJ_qingyi.1006.c:0 "顺势接过话头，把放言化作妙论"
 WJ_qingyi.1006.c.failure:0 "未能收束，反失主人风度"
 WJ_qingyi.1006.c.success:0 "谈笑收放自如，满座称快"
 WJ_qingyi.1006.desc.tea:0 "茶过数巡，[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]渐渐放松，笑谈间少了官场拘束。虽无酒意，席间也生出几分难得的自在。"
 WJ_qingyi.1006.desc.wine:0 "酒行数巡，[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]已不再拘礼，倚案纵论，妙语与狂言相杂。众人既觉快意，又怕这份任达越过分寸。"
 WJ_qingyi.1006.t:0 "酒至微醺"
 WJ_qingyi.1007.a:0 "道同心契，愿以友相待"
 WJ_qingyi.1007.b:0 "赠些盘缠，助其从容问学"
 WJ_qingyi.1007.c:0 "今日相知，来日再叙"
 WJ_qingyi.1007.desc:0 "众声稍歇，我与[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]移到竹影下续谈。此处无须论官爵，也不必争胜负；几番推心置腹后，彼此竟有忘年之感。"
 WJ_qingyi.1007.t:0 "竹下忘年"
 WJ_qingyi.1008.a:0 "既有所求，总该留下财货"
 WJ_qingyi.1008.b:0 "清议不可作进身之门，当众拒绝"
 WJ_qingyi.1008.c:0 "钱可不取，但这份人情须记下"
 WJ_qingyi.1008.desc:0 "散坐之间，[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]避开众目，低声谈起一桩官场请托。玄言仍在堂上回荡，帷后却已有利害盘算；我必须决定这场清议是否容得下它。"
 WJ_qingyi.1008.t:0 "清议之外"
 WJ_qingyi.2001.a:0 "名教本于人情，自然不外名教"
 WJ_qingyi.2001.a.failure:0 "强分名实，终究自相矛盾"
 WJ_qingyi.2001.a.success:0 "义理缜密，主人亦点头称许"
 WJ_qingyi.2001.b:0 "礼法能否成立，当看其治世之效"
 WJ_qingyi.2001.b.failure:0 "只见末务，未达本旨"
 WJ_qingyi.2001.b.success:0 "以政事证理，切中肯綮"
 WJ_qingyi.2001.c:0 "先静听诸贤之说，再自求其意"
 WJ_qingyi.2001.desc:0 "主人[host.Custom('WJ_GetLinkedUIName')]问我：名教出于自然，还是反以礼法拘束自然？这并非书斋中的空话——满座都在借我的回答衡量才识与立场。"
 WJ_qingyi.2001.t:0 "名教与自然"
 WJ_qingyi.2002.a:0 "以学问正面折其锋"
 WJ_qingyi.2002.a.failure:0 "旁征博引，却漏了要害"
 WJ_qingyi.2002.a.success:0 "引证精当，反客为主"
 WJ_qingyi.2002.b:0 "先称其一善，再解其一误"
 WJ_qingyi.2002.b.failure:0 "委曲太过，反被视作心虚"
 WJ_qingyi.2002.b.success:0 "既明是非，又全彼此颜面"
 WJ_qingyi.2002.c:0 "借其话中漏洞，暗设机锋"
 WJ_qingyi.2002.c.failure:0 "机关反噬，我成了席间笑柄"
 WJ_qingyi.2002.c.success:0 "一语反制，使对方难以接续"
 WJ_qingyi.2002.desc:0 "[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]忽然以一句旧说逼我表态，还请满座共作评断。退让会被视为辞穷，逞强也可能当场结怨；无数目光已把这片席地变成进退无路之处。"
 WJ_qingyi.2002.t:0 "众目相逼"
 WJ_qingyi.2003.a:0 "请特邀名士为我开解"
 WJ_qingyi.2003.a.failure:0 "一时未悟，却也记下关节"
 WJ_qingyi.2003.a.success:0 "问得其门，名士倾心指点"
 WJ_qingyi.2003.b:0 "与席间最博学者互释疑义"
 WJ_qingyi.2003.c:0 "且记诸说，退席后独自参详"
 WJ_qingyi.2003.desc:0 "我展开随身经卷，把困惑已久的一处义理呈在席间。清谈不只争口舌之胜；若肯低首请益，也许今日所得远过一场虚名。"
 WJ_qingyi.2003.t:0 "执经请益"
 WJ_qingyi.2004.a:0 "承此赞许，更当自勉"
 WJ_qingyi.2004.b:0 "谨受规劝，返求诸己"
 WJ_qingyi.2004.c:0 "请容我申明本意"
 WJ_qingyi.2004.c.failure:0 "强辩失度，名士拂然"
 WJ_qingyi.2004.c.success:0 "申说有据，名士不复轻看"
 WJ_qingyi.2004.desc:0 "特邀名士[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]忽然点到我的名字，先称我一处可取，又指出言下尚有未尽。满座因这一顾而重新端详我；赞许与规劝，都足以改变今日声价。"
 WJ_qingyi.2004.t:0 "名士一顾"
 WJ_qingyi.2005.a:0 "先称许眼前之人，不必争一席高下"
 WJ_qingyi.2005.b:0 "品第当凭识鉴，让我说个明白"
 WJ_qingyi.2005.b.failure:0 "欲求公允，反得罪席中之人"
 WJ_qingyi.2005.b.success:0 "言辞周全，品题使众人信服"
 WJ_qingyi.2005.c:0 "人物自有长短，我不参与排次"
 WJ_qingyi.2005.desc:0 "月旦渐盛，[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]问我：满座人物若分高下，谁可当上品？这等品题看似游戏，落在世间却能左右贤望与仕途。"
 WJ_qingyi.2005.t:0 "谁为上品"
 WJ_qingyi.2006.a:0 "且随此兴，任达一回"
 WJ_qingyi.2006.b:0 "清醒自持，听人放言即可"
 WJ_qingyi.2006.c:0 "与眼前人对坐畅谈"
 WJ_qingyi.2006.desc.tea:0 "虽只捧着茶盏，席间也已渐去拘束。[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]邀我放下官场形迹，试以山林人的心境纵谈。"
 WJ_qingyi.2006.desc.wine:0 "酒意浮上面颊，席间礼数也随之松动。[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]以杯相邀，要我暂忘官场形迹，像山林中人一般纵谈。"
 WJ_qingyi.2006.t:0 "杯中任达"
 WJ_qingyi.2007.a:0 "心契如此，何妨结为知交"
 WJ_qingyi.2007.b:0 "赠以薄资，表我相知之意"
 WJ_qingyi.2007.c:0 "若蒙相助，我必记下这份情谊"
 WJ_qingyi.2007.desc:0 "我与[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]越谈越近，从玄理说到平生志趣，不觉已避开满座喧声。世间交游多出于门第官爵，像这样的倾心之谈却难得。"
 WJ_qingyi.2007.t:0 "抵掌而谈"
 WJ_qingyi.2008.a:0 "此事当告知主人"
 WJ_qingyi.2008.b:0 "我自记在心中，不必惊动旁人"
 WJ_qingyi.2008.c:0 "守口如瓶，总该有些代价"
 WJ_qingyi.2008.desc:0 "帷后传来压低的声音，[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]无意间泄出一桩尚未见光的旧事。秘密既已入耳，交给主人、留在自己心中，或借此索取财货，都将改变席后的人情。"
 WJ_qingyi.2008.t:0 "帷幕后语"
 WJ_qingyi.9001.a:0 "玄理既明，愿使此论传于郡国"
 WJ_qingyi.9001.b:0 "人物相知，胜过一时辞锋"
 WJ_qingyi.9001.c:0 "群言终须归于经世之用"
 WJ_qingyi.9001.desc:0 "烛影已短，宾客陆续整衣。今日玄言、机锋与人物月旦总要有一处归结；我最后的一番话，将决定众人如何记住这场清议。"
 WJ_qingyi.9001.t:0 "品题散席"
 WJ_qingyi.9002.a:0 "记下今日玄理，日后再参"
 WJ_qingyi.9002.b:0 "珍重主人相待之情"
 WJ_qingyi.9002.c:0 "把案牍俗务暂留身后"
 WJ_qingyi.9002.desc:0 "我随众人步出席间，风过衣袖，方才的妙语与诘难仍在耳边。此行究竟带走一段玄理、一份交情，还是片刻轻松，只有我自己能够决定。"
 WJ_qingyi.9002.t:0 "余音在耳"

 # 来源：localization/simp_chinese/WJ_yangwang_l_simp_chinese.yml
 WJ_yangwang.0101.a:0 "收拾书卷，随使者赴府。"
 WJ_yangwang.0101.b:0 "谨谢知遇，此身尚不能出。"
 WJ_yangwang.0101.desc:0 "庭中尚带宿雨，门外忽有车马停下。来使拂去衣上尘土，奉上[scope:wj_yangwang_actor.GetName]的辟书：府中留有实缺，愿请我出山共议事务。书中没有铺陈官禄，只说天下未宁，读书之人亦当有所担当。\n\n我将书置于案头，久久未答。闭门可以守住一己志趣，却不能使世事也停在门外；应召或可稍展所学，也须从此面对府主的知遇与责任。使者仍在阶下候着，等我写下回书。"
 WJ_yangwang.0101.t:0 "辟书叩衡门"
 WJ_yangwang.0102.a:0 "受此乡举，日后更当自勉。"
 WJ_yangwang.0102.b:0 "德行未充，请另举乡中贤者。"
 WJ_yangwang.0102.desc:0 "来访的乡老说，我虽少赴宴集，名字却已在乡里议论中传开。有人称许操守，也有人说，世家子弟受乡党扶持，终须为乡党做些事情。如今[scope:wj_yangwang_actor.GetName]愿据此举我为孝廉，荐于[scope:wj_yangwang_actor.GetTopLiege.GetPrimaryTitle.GetNameNoTier]。\n\n举状送到了面前，末尾尚待我的答复。受荐并不等于立刻束带赴官，但这份乡评一旦归于我名下，往后言行便不再只是自家之事。"
 WJ_yangwang.0102.t:0 "乡论入郡府"
 WJ_yangwang.0103.a:0 "愿受荐举，出处仍待其时。"
 WJ_yangwang.0103.b:0 "名实未副，不敢以虚誉居先。"
 WJ_yangwang.0103.desc:0 "[scope:wj_yangwang_actor.GetName]的来书压在一卷旧注之上。信中提及我近来的议论，说山林中不乏识时务之人，愿以茂才荐我。纸上几句称许，偏偏都是我以为无人留意的见解。\n\n我本不愿以文章干进，却也未曾认定所学只能留在书斋。受下荐举，是承认这番学问仍可见用于世；至于何时出仕、为谁效力，仍当慎重自择。"
 WJ_yangwang.0103.t:0 "山中亦有经世学"
 WJ_yangwang.0104.a:0 "学须有用，且与君论可行之事。"
 WJ_yangwang.0104.b:0 "先明所守，仕与不仕皆不必自欺。"
 WJ_yangwang.0104.desc:0 "[scope:wj_yangwang_actor.GetName]来访，我扫榻设席，只备清水与薄食。起初我们各举经中数语，相互辨难；谈到后来，话却落在读书人的出处上。\n\n客人问：若以不仕为高，谁来济世？若以济世为名，又如何不为利禄所移？窗外日影渐斜，侍坐的后学不再翻卷，都等着我作答。这不是几句漂亮话便能遮过去的问题。"
 WJ_yangwang.0104.t:0 "席间问出处"
 WJ_yangwang.0105.a:0 "逐条辨明异同，今夜便成此论。"
 WJ_yangwang.0105.b:0 "先校定文字，疑处不妨仍存其疑。"
 WJ_yangwang.0105.desc:0 "借来的抄本终于送到，几处文字却与家中旧卷不同。同一章句，一家重礼制，一家辨名实；门下后学各执一说，连午食时也争论不休。\n\n夜深后，我仍对着两份抄本。贸然立异，容易博得一时声名；但明知旧解未安而不发一言，也算不得诚于学问。灯芯烧短了一截，案上还留着足够写下新解的空纸。"
 WJ_yangwang.0105.t:0 "灯下校古注"
 WJ_yangwang.0106.a:0 "付出定本，所言自当由我承担。"
 WJ_yangwang.0106.b:0 "请友人暂缓传抄，容我从容改定。"
 WJ_yangwang.0106.desc:0 "我未出门，旧日一篇短论却已随友人的行箧传到郡中。来信有人赞其切直，也有人追问其中影射何人；更有抄本把未定的句子当成了定论。\n\n隐居并不能令文字也隐去。若亲自校定，让众人知道我的本意，名字难免更受注意；若暂缓传写，或能免去无谓争执，却也要忍住被人误读的不快。"
 WJ_yangwang.0106.t:0 "素书先出山"
 WJ_yangwang.0107.a:0 "请两家坐下，把旧约与眼前急难说明白。"
 WJ_yangwang.0107.b:0 "列出轮用之法，请乡老与两家自行议定。"
 WJ_yangwang.0107.desc:0 "两户乡人带着各家的长者来到门前，为共用水道的先后争执不下。一方持旧约，一方说田中禾苗已不能再等。众人不愿先诉于官，推说我读过书，又与两家都无私怨，盼我评个公道。\n\n我没有官印，不能替县中断案。但若一句『隐者不问俗事』便将人推开，所谓乡里清望，又究竟落在何处？"
 WJ_yangwang.0107.t:0 "衡门前的乡争"
 WJ_yangwang.0108.a:0 "详论所问，知己之间不必避讳。"
 WJ_yangwang.0108.b:0 "先叙故情；莫让一时进退耗尽心神。"
 WJ_yangwang.0108.desc:0 "暮雨中，行人带来[scope:wj_yangwang_actor.GetName]的一封书札。前半叙别后近况，后半谈到进退之难：顺众意未必心安，独持己见又恐失却相知。写到末尾，只问我山中近来读些什么。\n\n我把信读了两遍。故交并非缺少一番大道理，不过想知道，旧日同席论学的人是否还肯认真听。回书该论世事，还是先劝其保重自身？"
 WJ_yangwang.0108.t:0 "暮雨到书札"
 WJ_yangwang.0109.a:0 "写下出处之意，不以含混养名。"
 WJ_yangwang.0109.b:0 "明日仍开卷，任人议论去吧。"
 WJ_yangwang.0109.desc:0 "来客转述郡中的一句议论：『名声越大，闭门便越有价。』说话者疑我并非真想远离仕途，不过借不出来等待更隆重的礼聘。也有人替我辩解，反使争论传得更广。\n\n清誉原由他人口中而来，自然也会被他人口中的疑问摇动。我可以写明所守，让人无从曲解；也可以照旧读书授徒，不再为每一句品评改动自己的日常。"
 WJ_yangwang.0109.t:0 "高卧亦受人评"
 WJ_yangwang.0110.a:0 "与后学共读，慢慢说透一章。"
 WJ_yangwang.0110.b:0 "暂掩书卷，到庭中料理畦蔬。"
 WJ_yangwang.0110.desc:0 "晨起时，庭前的脚印只有昨日留下的几行。这些日子没有冠盖登门，也没有值得抄传的新论。后学照常来问章句，园中畦蔬照常需要料理，一天便在这些琐事间过去。\n\n从前以为隐居须有山川奇趣，如今才知，能不因无人称许而荒废所学，亦是不易。我收好案边散卷，听见檐外风声：今日既不必赴谁的约，也不必扮给谁看。"
 WJ_yangwang.0110.t:0 "书卷与畦蔬"

 # 来源：localization/simp_chinese/WJ_yangwang_life_l_simp_chinese.yml
 WJ_yangwang.0111.a:0 "另作辨疑，旧说与我的异议一并留存。"
 WJ_yangwang.0111.b:0 "先补全旧注，让后人看清家学本来的面目。"
 WJ_yangwang.0111.desc:0 "翻检旧箧时，我找出一卷家中传下的经注。纸边已有虫蚀，几处批语仍能辨认：有的是前人郑重下笔，有的只是读到兴起时的疑问。如今再读，那些曾被奉为定论的解释，竟与我近年的见闻颇有抵牾。屋外风过竹叶，案上的旧字却让我迟迟不能翻页。\n\n若另写新说，后来读书的人或许能少走弯路，却也可能只记得我的辩驳，忘了旧学原有的长处。若只补缀残缺，家学便能完整传下，但我心中的疑问终究无处安放。灯下两张素纸，一张可写辨疑，一张可录旧注；今夜总要先落笔。"
 WJ_yangwang.0111.t:0 "旧注重开"
 WJ_yangwang.0112.a:0 "分抄稀见篇章，让书种随不同道路散去。"
 WJ_yangwang.0112.b:0 "按篇次整护全帙，先拟一份携书的次序。"
 WJ_yangwang.0112.desc:0 "山下又有人议论道路不靖，传闻几经转述，已分不清哪一处关津真正断了行旅。我清点架上的书卷，才发觉有些仅此一抄，有些虽常读，却散见于别家的藏书。若仓促离山，衣食还能随身带走，这些沉重的文字却未必容得我逐卷挑选。\n\n把最稀见的篇章分别抄出，托往来之人带向不同去处，或能留下书种，只是零篇断简难免失次。若将全帙收拢封护，携在自己身边，则经注首尾尚全，却也把存亡押在一条道路上。我展开包书的布，第一次觉得取舍比抄写更难。"
 WJ_yangwang.0112.t:0 "乱中书种"
 WJ_yangwang.0113.a:0 "定下短课，从一部经书的句读慢慢教起。"
 WJ_yangwang.0113.b:0 "先教读写日用文字，使他们今日便有所用。"
 WJ_yangwang.0113.desc:0 "几名乡中少年结伴到门前，带来的不是束脩，而是一叠练字的废纸。他们识得些常用字，读起短章却常把句读分错。领头的少年问，若白日还要帮家里劳作，是否就学不得经书。我望着他们指间的墨痕，想起自己初学时也曾被长篇章句吓住。\n\n照旧日师法，从一部经书逐字讲起，根基虽稳，未必有人能把漫长的课业坚持到底。若先取书信、契券中用得着的语句教他们，读书很快便能帮上家中，却也容易止于应付眼前事务。门外的脚步仍未散去，我该给他们怎样一个开头？"
 WJ_yangwang.0113.t:0 "蒙童叩门"
 WJ_yangwang.0114.a:0 "写明自己的处境，不让清名变成责人的尺度。"
 WJ_yangwang.0114.b:0 "暂不作自辩，以往后的日常往来回答。"
 WJ_yangwang.0114.desc:0 "市集归来的人说，乡里近来常把我的闭门读书当作谈资。有人赞我不慕荣进，也有人说，家计尚可的人才有余地谈清高。话传到山中，称许与讥刺都比当面说时尖了几分。我本想付之一笑，却记起沿途那些为生计奔走、无暇辩解的人。\n\n写一篇自叙，说明隐居只是此时的选择，或能免去旁人借我的名声责难勤于谋生者；但文章一出，又像是急于为自己争名。若暂且搁笔，往后多做些乡里看得见的寻常事，误会或会慢慢消散，只是这段沉默也可能被解释为自矜。"
 WJ_yangwang.0114.t:0 "迟来的乡论"
 WJ_yangwang.0115.a:0 "明言不当以财物厚薄衡量孝心。"
 WJ_yangwang.0115.b:0 "逐项分说礼意与器用，留出因家制宜的余地。"
 WJ_yangwang.0115.desc:0 "乡中有人议论丧葬，说近来几家竞相厚备棺椁，连家境窘迫者也怕被指作不孝。另一种说法则引古人薄葬之言，主张一概从简。议论并非因我家有丧，却仍有人请我写几句话作参考。我翻过礼书，发现书上详列仪节，未替每一户人家量过生计。\n\n若直陈厚葬之弊，或可替困窘之家卸下一层重担，却容易被说成轻看亲情。若分别论明哀敬与器用，让各家依其所能行礼，言辞更周全，也可能被好奢者借来替旧习开脱。我不愿用别人的哀痛成就自己的议论，只能把每个字写得更慎重。"
 WJ_yangwang.0115.t:0 "送终之议"
 WJ_yangwang.0116.a:0 "留札列出疑问，请友人有暇时赐复。"
 WJ_yangwang.0116.b:0 "只留问安短句，把长谈留给下一次相见。"
 WJ_yangwang.0116.desc:0 "循着旧日记得的小径访友，我到时却只见柴门虚掩，院中晾着新洗的布，炉灰早已冷了。隔篱问讯，也只得一句外出未归。来前积了许多想说的话，从一处经义到路上所见，此刻都悬在心里。山色渐暗，等候似乎也成了这趟行程的一部分。\n\n我可以在门旁留下短札，把最要紧的疑问写清，改日不必再让友人猜测我的来意；也可以先收住议论，只留一句问安，待彼此都有闲暇时再面对面细谈。纸上容得下长篇道理，却未必容得下交谈中那些迟疑、停顿与会心的一笑。"
 WJ_yangwang.0116.t:0 "柴门留札"
 WJ_yangwang.0117.a:0 "重新理弦，依旧曲慢慢寻回指下功夫。"
 WJ_yangwang.0117.b:0 "记下断音时的心绪，不急着续成旧曲。"
 WJ_yangwang.0117.desc:0 "久置的琴终于被我从布囊中取出，才试数声，一根旧弦便松断了。窗外有风，断音散得很快，指下却仍留着方才未成的曲意。近来读书总想求一个明白的结论，连抚琴也不知不觉急于成章。我将琴平放案上，才觉这份急切与山居并不相称。\n\n重新理弦，逐段辨听旧曲，可以把手上生疏的功夫一点点拾回；顺着未成的音调写几句自记，则不必强求复原旧貌。前者使我回到规矩之中，后者容我直面今日的心绪。琴旁还有半卷未读的书，今夜的工夫足够用心做成一件小事。"
 WJ_yangwang.0117.t:0 "断弦之后"
 WJ_yangwang.0118.a:0 "留在田间逐次观察，先把本地经验记实。"
 WJ_yangwang.0118.b:0 "带着垄上的疑问回去读书，辨明成说的限度。"
 WJ_yangwang.0118.desc:0 "清早走到田边，我看见同一片坡地上的禾苗有高有低。乡人谈起土色、日照与雨水去向，所用的词并不见于我熟读的篇章，判断却往往切中眼前情形。我问得仔细，才知道自己过去一句笼统的顺天时，放到垄亩之间竟须拆成许多不同的工夫。\n\n把今日听来的经验依次记下，再于不同天气时回来看，或能留成一份可信的农事札记。若先去翻检旧书中论稼穑的文字，逐条与乡人的说法相较，也许能辨出哪些成说只适用于别处。泥土沾在履边，我不愿回屋之后便把这些话当作闲谈忘掉。"
 WJ_yangwang.0118.t:0 "垄上问学"
 WJ_yangwang.0119.a:0 "择一读法入正文，另注选择的理由。"
 WJ_yangwang.0119.b:0 "两说并存，把不能断定之处明白标出。"
 WJ_yangwang.0119.desc:0 "借来的一卷抄本与我手边旧本互有出入。同一句话，换了一个字，意思便从劝人持重变成催人进取；旁边的小注又像是后人误抄进了正文。我反复读了几遍，两种说法竟各有可通之处。纸页的磨损、墨色的深浅，都不能替我轻易判定谁先谁后。\n\n若选定一种读法誊入正文，读者不必处处分心，却会把我的判断当成古书本有的面貌。若并列异文，把取舍暂留给后来者，文字固然显得繁碎，却能让疑处继续被看见。案上摊着两卷书，我忽然不愿再用一个干脆的改字遮住抄传的曲折。"
 WJ_yangwang.0119.t:0 "两本异文"
 WJ_yangwang.0120.a:0 "拟一份周急次序，只向负责照应的人说明。"
 WJ_yangwang.0120.b:0 "由近邻私下问候，让求助不必当众开口。"
 WJ_yangwang.0120.desc:0 "连日道路泥泞，几户人家的柴粮一时接续不上。乡里并非无人愿意相助，只是各自听来的情形不同，有人反复受到照看，也有人不好意思开口，直到邻人偶然提起才被记住。来问主意的人坐在檐下，我听完才明白，眼前所缺的不全是慷慨。\n\n先把急需照应的情形逐户问清，再商定轮流探望，能够少些遗漏，却须格外谨慎，不使窘况成了众人的谈资。若只请熟悉各家的近邻私下相通，颜面较易保全，彼此掌握的消息又未必齐全。纸上可排出先后，人心却不能像数目一样轻易归拢。"
 WJ_yangwang.0120.t:0 "周急有序"
 WJ_yangwang.0121.a:0 "不作序，另写一封认真商榷的回信。"
 WJ_yangwang.0121.b:0 "为可取之处作序，同时明言尚待商榷。"
 WJ_yangwang.0121.desc:0 "一封辗转送来的书札请我替一篇文章作序。写信的人有旧交之谊，文中又多称许我的清望，读来很难不动情。可是细看所附篇章，几处论断失之偏颇，还把传闻写得过于确实。我知道，一旦在卷首署名，旁人未必分得清我赞的是情谊还是见解。\n\n婉辞作序而详写修改意见，可以守住自己的判断，却可能让对方觉得我以学问自高。若仍为其作序，只说文章的可取之处，并把保留意见交代清楚，旧情或可顾全，但读者也可能略过那些限制。山中得以从容下笔，不等于每一笔都能两全。"
 WJ_yangwang.0121.t:0 "故人所托"
 WJ_yangwang.0122.a:0 "先循水痕查漏，把小患逐处记清。"
 WJ_yangwang.0122.b:0 "重排屋内陈设，先学会与这间旧屋相处。"
 WJ_yangwang.0122.desc:0 "夜雨忽紧，屋角滴水落在席边，我挪开书箧，才发现旧日随手塞入的草束早已腐软。天亮后檐下积着浅水，平常最合宜读书的位置倒成了最须避让的地方。近来我常谈安贫自守，如今面对一间漏雨的屋子，这四个字总得有些具体的做法。\n\n趁雨歇循着水痕逐处查看，先把眼前破漏理清，日后起居便少些仓促；若先重排书卷与卧席，分出遇雨时能够迅速收拢的几处，虽不能一劳永逸，也可从容应付天气变化。我卷起湿席，想到山居的秩序未必起于高论，有时只起于一滴水。"
 WJ_yangwang.0122.t:0 "雨漏书庐"
 WJ_yangwang.0123.a:0 "从候火学起，把寻常饭食认真做好。"
 WJ_yangwang.0123.b:0 "重读饮食之说，分清节俭与自苦的界限。"
 WJ_yangwang.0123.desc:0 "做饭时我添柴过急，锅中谷粒尚未熟透，灶口已窜起高火。待把火势收住，饭香里仍夹着淡淡焦气。平日觉得这些不过是家常琐事，轮到自己照管，才知候火、添水、起锅各有分寸，不能因读过几篇论养生的文字，便以为懂得一餐一饭。\n\n把今日失手的缘故记下，往后按火候反复试过，能使日常少些浪费；也可以借这顿不甚可口的饭，重读古人谈饮食节度的文字，看那些道理究竟怎样落在口腹之间。粗粝不必装点成清高，料理得宜也未必就是贪图享受，我该先承认手上的生疏。"
 WJ_yangwang.0123.t:0 "灶下余温"
 WJ_yangwang.0124.a:0 "请众人依抵岸先后，各守一个明白次序。"
 WJ_yangwang.0124.b:0 "先问清急难，再替不敢开口的人陈说。"
 WJ_yangwang.0124.desc:0 "经过渡口时，几名行人正为先后次序争执。携物多的说不便久候，赶远路的说日暮难行，还有人早已等在岸边，却始终插不上话。没有谁愿意先认自己占了便宜，越辩越把小事说成了品行。我站在一旁，忽觉书中礼让二字到这里也须有个落脚处。\n\n按到岸早晚排次序，办法最明白，也能让不善言辞的人有所依凭；若先照顾眼前确有急难者，或更近乎体恤，却须把缘由讲清，免得人人都争称紧迫。水面上已有归鸟掠过，再拖延下去谁也难行。我可以劝他们守一条共同认可的次序，也可以先替沉默者说话。"
 WJ_yangwang.0124.t:0 "渡口让路"
 WJ_yangwang.0125.a:0 "宁可留白，只记能够核实的人名与事迹。"
 WJ_yangwang.0125.b:0 "分录各支传说，每条都注明来处与疑处。"
 WJ_yangwang.0125.desc:0 "整理家中旧记时，我发现几代人的名字之间夹着大片空白。有的只留下迁居的地名，有的连生卒也无从查考，旁人却劝我依照辈次推补，免得谱系看着零落。我知道，纸上接续得越整齐，后人越容易信以为真；那些推测也会渐渐失去推测的痕迹。\n\n若只录确知之事，空白虽多，至少不把猜想留作家学的凭据。若广收各支口传，将来历不同的说法分别注明，也许能保住散失前的线索，却须容忍彼此抵牾。名字之外还有迁徙、读书与谋生的片语，我不愿只为排成一列，就把真实而杂乱的往事削去。"
 WJ_yangwang.0125.t:0 "旧谱留白"
 WJ_yangwang.0126.a:0 "课业不减，许各人依家中情形分次完成。"
 WJ_yangwang.0126.b:0 "增设口授复述，让学习不尽系于抄写。"
 WJ_yangwang.0126.desc:0 "来听讲的少年中，有人抄书极快，有人一日只能写成几行。课后收拾案席时，我才听说，后者常须替家中看顾幼小，夜间又没有多少工夫温习。若只看今日答问，勤惰似乎一目了然；把各人的处境放在一起，那些轻易作出的评语便显得过于省事。\n\n仍定同样的课业而许其分次完成，可以保全众人共学的次序，也免得当面揭出谁家窘迫。若另设口授与复述，使无暇抄写者也能参与，进路会更宽，却须我重新安排讲授的轻重。授徒不是替所有人消去艰难，但也不该把已有的艰难再当作责罚。"
 WJ_yangwang.0126.t:0 "束脩之外"
 WJ_yangwang.0127.a:0 "留下谈乡事，让席间渐渐不再围着酒杯转。"
 WJ_yangwang.0127.b:0 "明言亲疏不在杯数，请各人量力而饮。"
 WJ_yangwang.0127.desc:0 "乡社相聚，席间有人依旧例劝饮，说不尽杯便是疏远乡情。我并非厌恶与人同坐，只是看见几位不善饮者勉强应酬，笑意渐渐变得拘谨。若我此时起身辞席，旁人或会把养望之人想成不肯亲近乡里的冷客；若仍随众相劝，又与心中所见不合。\n\n留在席上谈些农时与旧闻，借着话头缓下劝饮，或能让众人不伤和气地换一种相聚法。若当面说明饮量各异，不应以杯数论亲疏，道理更为清楚，也免不了使守旧例者一时难堪。杯中酒还未凉，我愿意与人相近，却不愿把勉强也叫作礼数。"
 WJ_yangwang.0127.t:0 "社饮之间"
 WJ_yangwang.0128.a:0 "说明急用，按原约请其尽快归还。"
 WJ_yangwang.0128.b:0 "另寻抄本续读，重新约定一个能践行的归期。"
 WJ_yangwang.0128.desc:0 "借出的书过了约期仍未送回，我案上正在写的札记因而缺了两处引文。想起对方来借时那份郑重，我不愿轻易疑人；但山路辗转，口信稍有差池，书卷就可能被忘在别处。若人人都只凭一时好意借取，藏书再丰也难供长久往还。\n\n写信催还并说明急用之处，既守约定，也让对方知道迟延确有不便，只怕语气稍重便损了相借的情分。若暂借另一抄本继续校读，再与对方另约归期，眼前较为宽缓，却也不能让期限从此成了空话。我取出旧借札，把责人的句子改了又改。"
 WJ_yangwang.0128.t:0 "借书的期限"
 WJ_yangwang.0129.a:0 "致书直问，以旧交之分求一个明白答复。"
 WJ_yangwang.0129.b:0 "暂缓往还，也不把未明之事传给第三人。"
 WJ_yangwang.0129.desc:0 "有人劝我少与一位旧识往来，说此人近来依附权门，名声已不如从前。我所知道的却只是早年相处的几件小事，既不能替如今的行止作保，也不愿把乡谈当作亲见。闭门之后，世事总隔着几层传闻抵达，偏偏关于节义的判断又最催人表态。\n\n若先致书询问，坦言所闻与疑惑，至少给旧交一个自陈的机会，却可能被外人看作曲为回护。若暂缓往来而不随众品评，可以守住自己的分寸，也可能在对方最需要直言时失了朋友之责。我把未写完的称谓停在纸头，觉得真正难守的是不轻率。"
 WJ_yangwang.0129.t:0 "清名与旧识"
 WJ_yangwang.0130.a:0 "细察旧径险处，写清雨后应当怎样绕行。"
 WJ_yangwang.0130.b:0 "分别踏看两条新路，让行人依担荷轻重选择。"
 WJ_yangwang.0130.desc:0 "惯走的山径被雨水冲坏了一段，松动的土沿下露出树根。熟路的人尚能绕过，挑担者却须多费许多工夫。有人提议另辟近道，也有人说，新路会穿过容易积水的低处。我沿着坡势走了一遭，发觉纸上看似省下的路程，到了脚下未必真能省力。\n\n顺着旧径察看排水与落脚处，先把险段的位置说明，可以保留众人熟悉的走法，但往后仍要随雨水查看。若把两条绕路各走一遍，记下晴雨时的差别，再供行人自择，眼前较为稳妥，却不能替所有人的担荷找到同一个答案。归途鞋履尽湿，我倒比来时更明白。"
 WJ_yangwang.0130.t:0 "樵径改道"
 WJ_yangwang.0131.a:0 "只录可辨原文，不替零星记事补造来历。"
 WJ_yangwang.0131.b:0 "保留整页原貌，把正反两面的文字一同编目。"
 WJ_yangwang.0131.desc:0 "裁理旧纸时，我在一页经文背面看到几行日用记事：某日借谷，某日返还，又有一句久雨难行的抱怨。字迹潦草，显然不是为留名而写。若照平常习惯裁去破边，最先消失的正是这些零散小字；但它们让我看见了正面端整章句之外的一段日子。\n\n把纸背杂记另行誊存，可以留下寻常人的劳作与往还，却须避免凭几句话猜出一整段身世。若将原页完整夹藏，只在目录中注明有杂记，后来的读者还能自己辨认笔迹与先后，只是查阅时不如抄成一卷便利。我停下裁纸的手，不愿再把无名当作无用。"
 WJ_yangwang.0131.t:0 "纸背另有春秋"
 WJ_yangwang.0132.a:0 "记疑收卷，留待精神清明时再辨。"
 WJ_yangwang.0132.b:0 "暂放逐字争论，以诵读重听全篇的文气。"
 WJ_yangwang.0132.desc:0 "读到夜深，灯焰渐低，白日看得流畅的一段文字忽然处处可疑。我添过一次灯油，仍旧反复回到同一句上，仿佛只要今夜不肯罢休，明日便能少一分愚钝。窗外虫声断续，案边未收的笔已经干了；这份执着究竟是在求学，还是不肯承认自己疲倦？\n\n把疑处记下，收书安寝，待晨光中再读，也许能看出夜里纠缠不休的只是一个误分的句读。若暂不求解，改为低声诵读全篇，让首尾文气带着我经过难处，今夜仍可有所得。山居没有人催促我的进度，我却渐渐学会怎样不把从容过成另一种逼迫。"
 WJ_yangwang.0132.t:0 "灯尽以前"
 WJ_yangwang.0133.a:0 "先辨界标，不能确知的地方不仓促落定。"
 WJ_yangwang.0133.b:0 "先约定篱边如何共用，让往来不被小争隔断。"
 WJ_yangwang.0133.desc:0 "修整篱边杂草时，我发现一丛新竹生在两处旧界标之间。邻里说法不一：有人认树根为界，有人只记得多年前小径的位置。竹笋眼下还不值多少，争的却是往后该依什么作准。我本可闭门不问，但若只劝众人宽厚，今日含混之处来年还会重新长出来。\n\n同看旧标与地势，把能够确认的边界先记明，再把难定之处留待共议，可以少些日后的争执，却要容忍眼前仍有空缺。若先议定篱边共同行走与取用的办法，暂不争这一尺归谁，邻情或更容易保全，只是便利的约定也需要众人长久记得。"
 WJ_yangwang.0133.t:0 "篱边一尺"
 WJ_yangwang.0134.a:0 "先定共同短课，让各家都能从眼前做起。"
 WJ_yangwang.0134.b:0 "分席授读，但让先学者负起照应初学者的责任。"
 WJ_yangwang.0134.desc:0 "乡中议起借一处空屋让少年共读，难处却不在有没有书。各家愿教的篇目不同，有人看重识字写札，有人坚持先读经书，还有人担心农忙时课业中断，反叫孩子落下怠学的名声。我听罢众人的说法，才知一间小小书屋，也承着许多不同的指望。\n\n先选人人用得上的短章，约定闲时聚读、忙时各自温习，较容易让这件事开始，却未必能使有余力者读得深入。若按程度分作几席，由先学者领着初学者复述，就能兼顾进退，只须防止课席高下变成孩子间的轻慢。书可以分卷，人却不该因起步早晚便被分出贵贱。"
 WJ_yangwang.0134.t:0 "乡塾共读"
 WJ_yangwang.0135.a:0 "修篱开径，使读书起居有一套安稳的次序。"
 WJ_yangwang.0135.b:0 "只扶危处，让新枝与鸟雀留住各自的去路。"
 WJ_yangwang.0135.desc:0 "春雨过后，旧篱脚下冒出新芽，几根枯枝却已撑不住横木。若照原样密密补齐，庭院看着齐整，出入也有定处；只是去年野草最盛的角落，如今恰有小鸟衔草往还。我拿着收拢的枝条站了半晌，觉得所谓整治，也未必要把每一处空隙都封严。\n\n趁晴逐段理好旧篱，留一条明白的小径，往后搬书晒席便不必踩过湿泥，院落也更便于照管。若只扶正真正倾倒的几处，把新生枝叶留下，园中会少些规整，却能看清草木如何随时令自己成形。我原是来修一段篱笆，最后倒须先想明白自己要怎样住在这里。"
 WJ_yangwang.0135.t:0 "春篱留隙"
