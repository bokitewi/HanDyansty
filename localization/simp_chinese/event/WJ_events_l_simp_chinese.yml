 # 来源：localization/simp_chinese/WJ_yangwang_life_l_simp_chinese.yml
 wj_kaoke_duties.1001.war:0 "\n\n军书催粮的印泥未干。战事未息，缓运或缓修，都须有人承担后果。"
 wj_kaoke_duties.1001.a.result:0 "私财付工，旧堤修复，沿河田亩得保"
 wj_kaoke_duties.1001.b.result:0 "粮队如期启程，旧堤仍待修补"
 wj_kaoke_duties.1001.c.result:0 "役钱入了私囊，重役却落在薄户身上"
 wj_kaoke_duties.1002.a.result:0 "旧界勘明，[wj_duty_other.GetFirstName]赔付[wj_duty_person.GetFirstName]的误耕损失"
 wj_kaoke_duties.1002.b.result:0 "两家立券息讼，各守约定田界"
 wj_kaoke_duties.1002.c.result:0 "[wj_duty_other.GetFirstName]付钱得了断语，[wj_duty_person.GetFirstName]含愤离堂"
 wj_kaoke_duties.1003.a.result:0 "私财雇运，疲卒得歇，传舍轮替有序"
 wj_kaoke_duties.1003.b.result:0 "私托文书退回，役户少了一重催逼"
 wj_kaoke_duties.1003.c.result:0 "免役钱入囊，[wj_duty_person.GetFirstName]仍被迫兼差"

 wj_kaoke_duties.1001.adviser:0 "\n\n[wj_event_adviser.Custom2('MyCharacterIntroduction', ROOT.Char)]翻到免役券那页，指尖停在一枚旧印上：“这些券，也该验一验了。”"
 wj_kaoke_duties.1002.adviser:0 "\n\n[wj_event_adviser.Custom2('MyCharacterIntroduction', ROOT.Char)]将钱袋推回新图旁，低声道：“丈田自有公费。这一袋，究竟该记在谁的账上？”"
 wj_kaoke_duties.1003.adviser:0 "\n\n[wj_event_adviser.Custom2('MyCharacterIntroduction', ROOT.Char)]取过那份私托，问是谁添进急递中的。[wj_duty_person.GetFirstName]只答：“印信不小，不敢退。”"
 wj_kaoke_duties.1001.closing:0 "\n\n[wj_duty_person.GetFirstName]将朽桩向旁边挪了挪，给两份文牒让出地方，等我定夺。"
 wj_kaoke_duties.1001.e:0 "先拨一段试工。事后留廷，我还有用你之处。"
 wj_kaoke_duties.1001.e.result:0 "[wj_duty_person.GetFirstName]试筑有成，受雇留廷"
 wj_kaoke_duties.1002.closing:0 "\n\n门外牵着的耕牛叫了一声。[wj_duty_person.GetFirstName]攥紧旧券，富户则拢袖候着我的断语。"
 wj_kaoke_duties.1003.closing:0 "\n\n我把三道牒分开放在案上。哪件先行，哪件退回，又由谁承担下一程，都得在这里定下。"
 wj_kaoke_duties.1003.e:0 "你不必再兼差了。可愿来我廷中效力？"
 wj_kaoke_duties.1003.e.result:0 "[wj_duty_person.GetFirstName]领了安置钱，愿留廷听用"
 wj_kaoke_duties.withdrawn:0 "人事或财用有变，此议暂罢"
 WJ_duty_rebuilt_dike_modifier:0 "堤渠修复"
 WJ_duty_rebuilt_dike_modifier_desc:0 "朽桩换新，险段补固，沿河田亩得免水患之忧。"
 WJ_duty_unrepaired_dike_modifier:0 "旧堤待修"
 WJ_duty_unrepaired_dike_modifier_desc:0 "人手先付粮运，旧堤险段仍未补固，沿河生产有所顾虑。"
 WJ_duty_land_compromise_modifier:0 "立券息讼"
 WJ_duty_land_compromise_modifier_desc:0 "官府调停分耕，两家立券息讼，乡人得见纷争也有和解之道。"
 WJ_duty_post_relay_modifier:0 "驿递轮替"
 WJ_duty_post_relay_modifier_desc:0 "人马分段接续，交符有常，役户不再接连兼差。"
 WJ_duty_post_trimmed_modifier:0 "驿传裁冗"
 WJ_duty_post_trimmed_modifier_desc:0 "急递先行，私托退回，乡户少受无谓征发。"
