 WJ_langguan_xuncha.0001.a:0 "整饬仪仗，巡视四境。"
 WJ_langguan_xuncha.0001.desc:0 "你率属吏出城巡察，沿途吏民夹道相迎。"
 WJ_langguan_xuncha.0001.t:0 "郎官出巡·巡察"
 WJ_langguan_xuncha.0002.a:0 "升堂问案，明断是非。"
 WJ_langguan_xuncha.0002.desc:0 "县衙里积案如山，吏民争讼不休。"
 WJ_langguan_xuncha.0002.t:0 "郎官出巡·断案"
 WJ_langguan_xuncha.0003.a:0 "访贫问苦，体察民情。"
 WJ_langguan_xuncha.0003.desc:0 "田间老农与市井商贩，各有苦乐。"
 WJ_langguan_xuncha.0003.t:0 "郎官出巡·问民情"
 WJ_langguan_xuncha.0100.a:0 "此番出巡，获益良多。"
 WJ_langguan_xuncha.0100.desc:0 "巡行数月，政事渐熟，贤望渐增。"
 WJ_langguan_xuncha.0100.t:0 "郎官出巡·返署"
 WJ_recommendation_reply.0001.a:0 "善，当为朝廷得一士。"
 WJ_recommendation_reply.0001.t:0 "孝廉察举之复"
 WJ_recommendation_reply.0002.a:0 "人各有志，另择贤者。"
 WJ_recommendation_reply.0002.desc:0 "明公举我为孝廉的来书已经读过，盛意甚厚。只是此番实不敢应受，故郑重奉复，好教明公早知。\n\n写下“辞谢”二字并不容易，我也知道这一个名额来之不易。可若一时感激应下，日后又因迟疑让举主另费周折，反倒更辜负今日的相许。举状之上，请勿列我之名，另求贤者便是。\n\n未能受举，知遇之情仍铭记在心。谨此奉告，望明公勿以为念。"
 WJ_recommendation_reply.0002.t:0 "孝廉察举之复"
 WJ_recommendation_reply.0101.a:0 "谨谢知遇。"
 WJ_recommendation_reply.0101.t:0 "请求举孝廉之复"
 WJ_recommendation_reply.0102.a:0 "只得另候机缘。"
 WJ_recommendation_reply.0102.desc:0 "来请已经细看。今岁孝廉之选，我不能举[secondary_actor.Custom('WJ_GetLinkedUIName')]，回书直言，望勿以为怠慢。\n\n受人请托，最容易留一句转圜的话；可对方既将仕进寄望于此，我若迟迟不肯明说，只会使人空等。眼下我还不能为其作此推许，宁可在举状未定之前说个明白。\n\n此事请就此作罢。日后若另有机缘，自可再议。"
 WJ_recommendation_reply.0102.t:0 "请求举孝廉之复"
 WJ_recommendation_reply.0201.a:0 "此举当不负公论。"
 WJ_recommendation_reply.0201.desc:0 "蒙明公举为茂才，我愿应受。来书读罢，往日只在案头琢磨的那些事，忽然都像有了一试的机会。\n\n平日论政，尽可说得从容；到了任事之时，才见学问究竟有几分用处。我不敢凭一纸荐书便夸口能料理万端，可若一味辞让，也辜负了明公今日的推许。\n\n所议诸事，我皆明白，自当践诺。谨先奉此书，以明应举之意。明公的知遇，往后当以政绩相报，不使所举之人只剩一个好听的名字。"
 WJ_recommendation_reply.0201.t:0 "茂才察举之复"
 WJ_recommendation_reply.0202.a:0 "既如此，另访贤才。"
 WJ_recommendation_reply.0202.desc:0 "明公愿举我为茂才，来书已收，厚意不敢轻忘。只是此番实不能受，故先奉书辞谢，免得举状上还为我空着一处。\n\n得人推许本是喜事，提笔回绝之前，我也犹豫再三。然而眼下既不能定心担当，便不该先取其名，日后再寻由头推脱。若因此教明公失望，亦非我所愿。\n\n荐举之事，还请另择其人。未能相从，明公肯以此相许的厚意，我始终感念。"
 WJ_recommendation_reply.0202.t:0 "茂才察举之复"
 WJ_recommendation_reply.0301.a:0 "谨谢举主。"
 WJ_recommendation_reply.0301.desc:0 "来请已阅。今岁茂才，我愿举[secondary_actor.Custom('WJ_GetLinkedUIName')]，此意已定，不必再候。\n\n荐人于朝，说到底也是把自己的眼光一并交了出去。我肯作此推许，正是盼受举之人有施展之地；日后再闻其名，愿听到的不只是旧日才名，还有可观的政绩。\n\n所议诸事，一并照办。请代传我的允诺，也传我这一层期望：今日替他开了一扇门，往后能走多远，还须凭他自己的脚步。"
 WJ_recommendation_reply.0301.t:0 "请求举茂才之复"
 WJ_recommendation_reply.0302.a:0 "只得另访举主。"
 WJ_recommendation_reply.0302.desc:0 "所请举茂才一事，我已思量过了：今岁不能举[secondary_actor.Custom('WJ_GetLinkedUIName')]，谨书明告。\n\n来人陈说恳切，我都听了，只是还不足以让我在荐书上落笔。若先许一句“再议”，让诸位继续为此奔走，日后又不能兑现，反倒更伤情分。既不能应允，便不该借迟复来躲避辞谢。\n\n此事到此为止，请勿再为今年的荐书等候。厚意我心领了。"
 WJ_recommendation_reply.0302.t:0 "请求举茂才之复"
 wj_temp_official.1000.a:0 "逐项勾稽，直指相悖之处。"
 wj_temp_official.1000.b:0 "依旧式复核，只呈确凿之误。"
 wj_temp_official.1000.desc:0 "[scope:wj_assessment_examiner.Custom('WJ_GetLinkedUIName')]将一册计簿推到你面前，不问治国之道，只叫你看其中户口、田租与仓谷的数目。\n\n你翻过几页，发觉前后有几处对不上。若逐项勾稽，或许能揪出有人刻意藏下的舛误，却也可能因判断失当，反露出自己平日任事的疏漏；若只依旧式复核，出错的机会少些，也难凭此博得出色的评语。\n\n考官并不催促，案旁的笔却已备好。这一轮要呈上的，须是你当真看明白的东西，一段空泛的善政之言搪塞不过去。"
 wj_temp_official.1000.t:0 "假吏考课：清核簿书"
 wj_temp_official.1001.a:0 "权衡缓急，另拟章程。"
 wj_temp_official.1001.b:0 "谨循常例，先赈后征。"
 wj_temp_official.1001.desc:0 "计簿刚收走，考官又换了一问：水旱之后，仓中粮食有限，来请赈贷的人却不少，地方豪强还想先分一份，你当如何处置？\n\n方才面对的只是簿上的数目，如今每一个先后都牵着不同的人。若另拟一套章程，就得顾及赈给、催科与治安之间的牵连；若谨守常例，虽稳妥些，得到的也不过是个不出错的回答。\n\n你把到了嘴边的“仁政”二字咽了回去。考官要听的不是你如何善待百姓，而是粮食当真不够时，你准备先做哪一件事。"
 wj_temp_official.1001.t:0 "假吏考课：临事处断"
 wj_temp_official.1002.a:0 "直陈得失，条列改弦之策。"
 wj_temp_official.1002.b:0 "只陈成例，不作虚言。"
 wj_temp_official.1002.desc:0 "簿书与治事两问已过，[scope:wj_assessment_examiner.Custom('WJ_GetLinkedUIName')]却没有放下笔：“说说你自己。试守以来，哪件事办得最好，哪件最该改？”\n\n你原先备下的几句套话，忽然都说不出口了。前两问尚可谈论别处的县邑、假设中的灾荒，这一问却连人名与经过都有据可查。讲得深些，或能显出本领；讲得不好，便是亲手把平日藏住的疏漏递了过去。\n\n你坐直身子，停了一息。是循旧式只谈那些稳妥之事，还是把心中想过的改弦之策和盘托出？考官的笔尖仍悬着，等你开口。"
 wj_temp_official.1002.t:0 "假吏考课：吏部奏对"
 wj_temp_official.1005.a:0 "拜受课第，正式入仕。"
 wj_temp_official.1005.b:0 "谨记所失，来年复考。"
 wj_temp_official.1005.desc:0 "簿书、治事与最后的陈奏都已结束。考官把几轮记录合在一处，又参看你平日的贤望，这才将课第递到你面前。\n\n方才还能凭言语补救的地方，如今都已落在纸上。你望着那份评定，等候关于试守去留的最后一句话。\n\n"
 wj_temp_official.1005.desc_fail:0 "“未及合格。”你先看见这几个字，才读清下文：官职暂留，仍以假吏试守，来年再考。方才答得不稳的地方一齐涌上心头，可此时再说一遍，已没有人替你记入课第了。"
 wj_temp_official.1005.desc_good:0 "课第列良，你试守之职就此真除。看到这里，悬了许久的心终于落下。评语中虽还有可改之处，却不妨碍你将这份结果好好收起。"
 wj_temp_official.1005.desc_high:0 "课第列优，你试守之职就此真除。你把那个“优”字看了两遍，才发觉来人还等着收走簿册。考前反复斟酌的那些话，总算没有白费。"
 wj_temp_official.1005.desc_pass:0 "课第合格，你试守之职就此真除。你顺着评语往下读，几处失当仍赫然在目，好在最终没有将你拦在门外。这一回，总算是过了。"
 wj_temp_official.1005.t:0 "假吏考课：定课"

