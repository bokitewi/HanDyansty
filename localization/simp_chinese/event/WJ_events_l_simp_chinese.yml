 # 来源：localization/replace/simp_chinese/WJ_xiaolian_direct_qualification_l_simp_chinese.yml
 WJ_recommendation_reply.0001.desc:0 "承蒙明公察知操行，愿受孝廉之举。所议诸项，亦当一并践行，不负知遇。"
 WJ_recommendation_reply.0101.desc:0 "来请已阅。[secondary_actor.Custom('WJ_GetLinkedUIName')]尚堪察举，我愿以本年名额举其为孝廉。所议诸项，就此为定。"

 # 来源：localization/simp_chinese/WJ_bizhao_reply_l_simp_chinese.yml
 WJ_bizhao_reply.0001.a:0 "得卿相助，甚好。"
 WJ_bizhao_reply.0001.desc:0 "[scope:recipient.Custom('WJ_GetLinkedUIName')]谨复：\n\n承蒙垂顾，辟我入幕，敢不尽心效力。今已应召，愿听府中差遣。"
 WJ_bizhao_reply.0002.a:0 "既如此，不必强求。"
 WJ_bizhao_reply.0002.desc:0 "蒙公厚意，感佩于心。然此次辟召，恕我未能应允，谨此奉复。"

 # 来源：localization/simp_chinese/WJ_district_war_l_simp_chinese.yml
 WJ_district.200.desc:0 "本区战事紧迫，恳请都督调遣援军支援。我请求援助的是当前领衔且符合援助条件的战争。"
 WJ_district.200.dispatch:0 "本督另派一位辖区武官。"
 WJ_district.200.personal:0 "本督亲率兵马支援。"
 WJ_district.201.desc:0 "本督已安排[SCOPE.sC('wj_dd_target').Custom('WJ_GetLinkedUIName')]加入你领衔且符合条件的战争，共同应敌。"
 WJ_district.202.desc:0 "援助[SCOPE.sC('wj_dd_beneficiary').Custom('WJ_GetLinkedUIName')]的部署已经落实，你已加入其领衔且符合条件的战争。"

 # 来源：localization/simp_chinese/WJ_kaoke_duties_l_simp_chinese.yml
 wj_kaoke_duties.1001.a:0 "我出私钱补粮，重核受灾户籍。"
 wj_kaoke_duties.1001.a.tt:0 "管理至少12、持有至少120金。支付120金，压力增加30；案发县控制力提高10，获得三年“核灾赈户”（民众好感+10）。年度吏治功过#P +20#!。"
 wj_kaoke_duties.1001.b:0 "如实申报缺额，分期输纳，先保春耕。"
 wj_kaoke_duties.1001.b.tt:0 "向上府申明灾情，亲自承担往返解释之劳；压力增加10，不改变金钱、威望或县份状态。年度吏治功过#V 0#!，记作一次处置。"
 wj_kaoke_duties.1001.c:0 "按旧额催足，再收一笔办纳钱。"
 wj_kaoke_duties.1001.c.tt:0 "获得25金；案发县控制力降低10，获得三年“苛敛伤民”（民众好感-15）。年度吏治功过#N -20#!。"
 wj_kaoke_duties.1001.d:0 "亲核仓簿、追索积欠，试着补上缺额。"
 wj_kaoke_duties.1001.d.failure:0 "积欠已无从追索，催征反而失了次序"
 wj_kaoke_duties.1001.d.failure.tt:0 "压力增加30；案发县控制力降低5。年度吏治功过#N -10#!；不扣金钱。"
 wj_kaoke_duties.1001.d.success:0 "仓簿互证，追回了侵隐的税粮"
 wj_kaoke_duties.1001.d.success.tt:0 "压力增加15；案发县控制力提高5，获得两年“核灾赈户”（民众好感+10）。年度吏治功过#P +10#!。"
 wj_kaoke_duties.1001.desc:0 "计吏把应解的税粮数写在木牍上，仓曹却把一只空斛推到了案前。春水淹了低田，秋收又折了一成；上府的催文只认旧额，不问田里剩下多少。\n\n门下掾建议把缺数匀给尚未逃散的人户。乡老听罢伏地，说去年替邻户垫粮的人，今年已经卖了耕牛。若由我出资买粮、重核灾户，便能免去这轮摊派；也可亲自清查仓簿、追索积欠，只是未必找得出足够的粮。\n\n牍尾留着署名的位置。账能做平，来年的田却未必还能有人耕。"
 wj_kaoke_duties.1001.t:0 "考课·簿上足，仓中空"
 wj_kaoke_duties.1002.a:0 "出资丈田，退回保状，按旧券断界。"
 wj_kaoke_duties.1002.a.tt:0 "外交至少12、持有至少80金与150威望。支付80金，损失150威望；案发县控制力提高10，获得三年“田界清明”（民众好感+15）。年度吏治功过#P +20#!。"
 wj_kaoke_duties.1002.b:0 "封存争议田界，先许原户耕种，候复勘。"
 wj_kaoke_duties.1002.b.tt:0 "暂止侵夺，也不仓促断案；压力增加10，不改变金钱、威望或县份状态。年度吏治功过#V 0#!，记作一次处置。"
 wj_kaoke_duties.1002.c:0 "新簿既有官印，旧券便不必再查了。"
 wj_kaoke_duties.1002.c.tt:0 "获得40金谢仪；案发县控制力降低10，获得三年“苛敛伤民”（民众好感-15）。年度吏治功过#N -20#!。"
 wj_kaoke_duties.1002.d:0 "传集里正与邻田人，当堂质证旧界。"
 wj_kaoke_duties.1002.d.failure:0 "证人翻供，官府的断语反被乡中取笑"
 wj_kaoke_duties.1002.d.failure.tt:0 "压力增加30；案发县控制力降低5。年度吏治功过#N -10#!；不扣金钱。"
 wj_kaoke_duties.1002.d.success:0 "证词与旧券相合，豪右退还侵田"
 wj_kaoke_duties.1002.d.success.tt:0 "压力增加15；案发县控制力提高5，获得两年“田界清明”（民众好感+15）。年度吏治功过#P +10#!。"
 wj_kaoke_duties.1002.desc:0 "几户小民带着旧券来告：乡中大姓重立界石，把他们的田并进了自家庄园。对方送来的新簿印记齐备，落笔的书佐却正是那家的姻亲。案卷上看不出刀兵，田埂外已经无人敢下种。\n\n若彻查旧券、丈量田亩，我须自出丈量与误农的费用，还要当众驳回地方名流的保状。另一条路，是传集里正与邻田之人当面对质；陈说能否压住门第声势，便要看我的本领。\n\n大姓愿先停工议界，也另备了一份谢仪。小民只问：明年还能不能回原来的田里？"
 wj_kaoke_duties.1002.t:0 "考课·阡陌之间"
 wj_kaoke_duties.1003.a:0 "垫资雇运，我来重排程限并督办。"
 wj_kaoke_duties.1003.a.tt:0 "管理或军事至少12、持有至少100金。支付100金，压力增加35；案发县控制力提高10，获得三年“驿役有序”（民众好感+10）。年度吏治功过#P +20#!。"
 wj_kaoke_duties.1003.b:0 "先办急差，逐件申报缓期，不擅自加役。"
 wj_kaoke_duties.1003.b.tt:0 "依缓急调度既有差役，承担催文往返之劳；压力增加10，不改变金钱、威望或县份状态。年度吏治功过#V 0#!，记作一次处置。"
 wj_kaoke_duties.1003.c:0 "照额点夫，自备口粮，另收免役钱。"
 wj_kaoke_duties.1003.c.tt:0 "获得20金免役钱；案发县控制力降低10，获得三年“苛敛伤民”（民众好感-15）。年度吏治功过#N -20#!。"
 wj_kaoke_duties.1003.d:0 "我赴传舍，合并差次、分段轮替接运。"
 wj_kaoke_duties.1003.d.failure:0 "交接失期，人马困顿，沿途秩序受损"
 wj_kaoke_duties.1003.d.failure.tt:0 "压力增加30；案发县控制力降低5。年度吏治功过#N -10#!；不扣金钱。"
 wj_kaoke_duties.1003.d.success:0 "人马轮替有序，急差如期交割"
 wj_kaoke_duties.1003.d.success.tt:0 "压力增加15；案发县控制力提高5，获得两年“驿役有序”（民众好感+10）。年度吏治功过#P +10#!。"
 wj_kaoke_duties.1003.desc:0 "驿吏呈上三封急牒：一封催送府库粮物，一封要接续传车，还有一封催索沿途夫役。到期的日子挤在一起，驿马已经瘦得露骨。乡间正忙农事，再抽走一批壮丁，这一季的收成便要耽搁。\n\n都吏说，可以花钱雇车募夫；也可亲赴传舍，合并重复的差次，分段轮替接运。前者要我垫资，后者要我担起误程之责。若逐件申报缓急、请上府裁定，虽保得住眼下的农时，案牍往来却少不了。\n\n驿门外，候差的人把农具倚在墙根。他们等我签下的，既是这几日的路程，也是家中田地空着的日子。"
 wj_kaoke_duties.1003.t:0 "考课·传舍无闲人"

