 # 来源：localization/replace/simp_chinese/WJ_xiaolian_direct_qualification_l_simp_chinese.yml
 WJ_recommendation_reply.0001.desc:0 "蒙明公举我为孝廉，谨奉书应受。\n\n来书初至，我反复读了几遍，才敢信自己的名字果真列入了举状。乡里的评说，往日只是零星听闻；今日得明公一言推许，欣喜之外，也知往后一言一行都要比从前更受人瞩目。\n\n前日所议诸事，自当一一践诺。知遇之情，非一书可尽，谨先以此告明公：我愿应举。"
 WJ_recommendation_reply.0101.desc:0 "来书所请，我已应允：今岁孝廉，便举[secondary_actor.Custom('WJ_GetLinkedUIName')]。\n\n举状之上，人们看的不只是受举之人，也看举主的眼力。我既肯为此署名，便不敢以此为轻；只是日后如何立身任事，终须其人自己担当。\n\n所议诸事，一并照办。请代我转告：今日一纸举状，不过替他开了一扇门。"

 # 来源：localization/simp_chinese/WJ_bizhao_reply_l_simp_chinese.yml
 WJ_bizhao_reply.0001.a:0 "得卿相助，甚好。"
 WJ_bizhao_reply.0001.desc:0 "辟书已至，读罢甚喜。承明公不弃，我愿应召入幕，所议诸事，皆当遵行。\n\n往日听人说起府中事务，总隔着一层传闻；如今得以亲历，虽有惶恐，也怀期待。到任之后，还望将旧日簿书与未竟之事一并交付，使我早些熟悉，不致虚占一席。\n\n知遇之恩，铭感于心，不敢多作客套。待共事日久，再请明公看我究竟堪用几分。"
 WJ_bizhao_reply.0002.a:0 "既如此，不必强求。"
 WJ_bizhao_reply.0002.desc:0 "辟书已经收到，盛意殷殷，反复读过，不能无感。只是此番实难应召，迟迟未复，也是怕一纸辞谢显得轻慢。\n\n思量再三，终究不敢先应下一个自己尚担不起的职任。府中既然急需用人，若我只因情面点头，日后再生推诿，反倒误了诸君。幕中之席，请另择贤者，不必为我虚留。\n\n此番不能共事，并非不领相邀之情。谨书奉复，望明公见谅。"

 # 来源：localization/simp_chinese/WJ_district_war_l_simp_chinese.yml
 WJ_district.200.desc:0 "军前战事未息，谨向都督请援。\n\n各部尚能相持，只是久凭现有兵众周旋，恐难兼顾，故遣使陈明所需，不敢等到山穷水尽才仓促告急。\n\n若都督能亲率大军前来，自是军中上下所盼；若别有军务缠身，也请选派本区可战之将来援，我好与之互通敌情，共商接应。翘首以待回音。"
 WJ_district.200.dispatch:0 "另遣部将往援。"
 WJ_district.200.personal:0 "吾当亲率本部往援。"
 WJ_district.201.desc:0 "前书请援，今已有了着落：[SCOPE.sC('wj_dd_target').Custom('WJ_GetLinkedUIName')]已率部加入你的战事。\n\n军前最怕久候无音，故不待战果，先使人报知此讯。此后两军当互通敌情、接续军令，使各部知道彼此所在，莫要各守一隅，临敌时才相互寻找。\n\n进退之宜，仍须审度兵势与道路而定。愿你接书之后，早与援军通报所需。"
 WJ_district.202.desc:0 "[SCOPE.sC('wj_dd_beneficiary').Custom('WJ_GetLinkedUIName')]告急求援，今命你率部加入其战事。\n\n受援一方久候回音，你须尽早使其知道援军已在路上。往后军情、道路与接应诸事，彼此务要说得明白，莫要只在文书上同列一军，临敌时却互不相知。\n\n进退之宜，自当审势而行。此书只授你援战之责，胜负还看阵前。"

 # 来源：localization/simp_chinese/WJ_kaoke_duties_l_simp_chinese.yml
 wj_kaoke_duties.1001.a:0 "解私囊补粮，重核灾户。"
 wj_kaoke_duties.1001.a.tt:0 "郡中当以此为善政，记入今岁考课。"
 wj_kaoke_duties.1001.b:0 "具陈灾情，请分期输纳。"
 wj_kaoke_duties.1001.b.tt:0 "此事照例录入考簿，不功不过。"
 wj_kaoke_duties.1001.c:0 "照旧额催征，另收办纳钱。"
 wj_kaoke_duties.1001.c.tt:0 "苛敛之名传开，考课之时恐成污点。"
 wj_kaoke_duties.1001.d:0 "亲核仓簿，追索积欠。"
 wj_kaoke_duties.1001.d.failure:0 "积欠已无从追索，催征反而失了次序"
 wj_kaoke_duties.1001.d.failure.tt:0 "催征失序，考课时难免记过。"
 wj_kaoke_duties.1001.d.success:0 "仓簿互证，追回了侵隐的税粮"
 wj_kaoke_duties.1001.d.success.tt:0 "追欠有功，考课时可记上一笔。"
 wj_kaoke_duties.1001.desc:0 "计吏把应解的税粮数写在木牍上，仓曹却把一只空斛推到了你的案前。春水淹了低田，秋收又折了一成；上府的催文只认旧额，不问田里还剩多少。\n\n门下掾建议把缺额摊给尚未逃散的人户。乡老听罢伏地，说去年替邻户垫粮的人，今年已经卖了耕牛。仓簿里的积欠年深日久，谁也说不清究竟还能追回几成。\n\n牍尾空着署名之处。账可以做平，来年的田里，却未必还有人耕。"
 wj_kaoke_duties.1001.t:0 "簿上足，仓中空"
 wj_kaoke_duties.1002.a:0 "出资丈田，驳还保状。"
 wj_kaoke_duties.1002.a.tt:0 "田界断得清明，考课之时当记一功。"
 wj_kaoke_duties.1002.b:0 "封存田界，许原户先耕。"
 wj_kaoke_duties.1002.b.tt:0 "案牍录入考簿，未见功过。"
 wj_kaoke_duties.1002.c:0 "收其谢仪，依新簿结案。"
 wj_kaoke_duties.1002.c.tt:0 "受礼枉断之事，考课之时恐难遮掩。"
 wj_kaoke_duties.1002.d:0 "传集里正邻人，当堂质证。"
 wj_kaoke_duties.1002.d.failure:0 "证人翻供，官府的断语反被乡中取笑"
 wj_kaoke_duties.1002.d.failure.tt:0 "断语被乡里传为笑谈，考课时难免记过。"
 wj_kaoke_duties.1002.d.success:0 "证词与旧券相合，豪右退还侵田"
 wj_kaoke_duties.1002.d.success.tt:0 "当堂断明，考课时可记上一笔。"
 wj_kaoke_duties.1002.desc:0 "几户小民带着旧券来告：乡中大姓重立界石，把他们的田并进了自家庄园。对方送来的新簿印记齐备，落笔的书佐却正是那家的姻亲。案卷上看不见刀兵，田埂那头却已无人敢下种。\n\n主簿低声提醒你，大姓递来的保状上署着好几位地方名流的名字，哪一位都不好轻易驳回。旧券虽在，若无里正与邻田之人当堂作证，界址也难断清。\n\n大姓愿先停工议界，另备了一份谢仪。小民只问一句：明年，还能不能回原来的田里？"
 wj_kaoke_duties.1002.t:0 "阡陌之间"
 wj_kaoke_duties.1003.a:0 "垫资雇运，亲排程限。"
 wj_kaoke_duties.1003.a.tt:0 "驿路畅通，考课之时当记一功。"
 wj_kaoke_duties.1003.b:0 "先办急差，余者申报缓期。"
 wj_kaoke_duties.1003.b.tt:0 "此事照常录入考簿，无功无过。"
 wj_kaoke_duties.1003.c:0 "照额点夫，另收免役钱。"
 wj_kaoke_duties.1003.c.tt:0 "加役敛钱，考课之时恐成污点。"
 wj_kaoke_duties.1003.d:0 "亲赴传舍，分段轮替。"
 wj_kaoke_duties.1003.d.failure:0 "交接失期，人马困顿，沿途秩序受损"
 wj_kaoke_duties.1003.d.failure.tt:0 "误了期限，考课时难免记过。"
 wj_kaoke_duties.1003.d.success:0 "人马轮替有序，急差如期交割"
 wj_kaoke_duties.1003.d.success.tt:0 "调度得宜，考课时可记上一笔。"
 wj_kaoke_duties.1003.desc:0 "驿吏呈上三封急牒：一封催送府库粮物，一封要接续传车，还有一封催索沿途夫役。几处期限挤在一起，驿马已瘦得露出骨来。乡间正忙农事，再抽走一批壮丁，这一季的收成便要耽搁。\n\n都吏掰着指头算给你听：雇车募夫要钱，合并差次、分段接运要有人担起误期之责，逐件申报缓急，又少不了与上府往来的文书。\n\n驿门外，候差的人把农具倚在墙根。他们等你签下的，既是这几日的路程，也是家中田地空着的日子。"
 wj_kaoke_duties.1003.t:0 "传舍无闲人"

