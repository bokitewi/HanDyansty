 # 来源：localization/simp_chinese/WJ_langguan_loc_l_simp_chinese.yml
 wj_langguan.1000.a:0 "直陈己见，以经义折衷其理"
 wj_langguan.1000.b:0 "谨守旧注，不作险解"
 wj_langguan.1000.desc:0 "[scope:wj_assessment_examiner.Custom('WJ_GetLinkedUIName')]命你释读经传，辨章句异同，再以经义断一桩伦常疑案。此问看似只论训诂，实则要看你能否引经而不泥古。"
 wj_langguan.1000.t:0 "郎官考校：通经明义"
 wj_langguan.1001.a:0 "参酌经义与律令，具陈断狱之法"
 wj_langguan.1001.b:0 "循成案而判，务求无失"
 wj_langguan.1001.desc:0 "第二问转入律令：同案数人，情有轻重，法有正条。主考令你当堂拟判，既不可纵情废法，也不可执法害义。"
 wj_langguan.1001.t:0 "郎官考校：律令断事"
 wj_langguan.1002.a:0 "援古证今，陈一套救弊之策"
 wj_langguan.1002.b:0 "只陈最稳妥的赈恤常法"
 wj_langguan.1002.desc:0 "最后一问是奏对。主考假设郡国灾歉、盗贼并起，而朝廷财用不足，命你在片刻间条陈先后缓急。满座寂然，只听竹简轻响。"
 wj_langguan.1002.t:0 "郎官考校：殿前奏对"
 wj_langguan.1005.a:0 "谨受考第，自此出署"
 wj_langguan.1005.b:0 "留署习业，来年再试"
 wj_langguan.1005.desc:0 "三问既毕，主考合起卷牍，当面评定你的经术、法意与奏对。"
 wj_langguan.1005.desc_fail:0 "你的答辞或失于拘泥，或疏于法意，尚不足以离署。主考令你再习一年，来岁复校。"
 wj_langguan.1005.desc_good:0 "你的答辞条理明白，偶有可取新意，评语列为良好，足以正式取得孝廉出身。"
 wj_langguan.1005.desc_high:0 "你的答辞贯通经法，且能切中时务，评语列为优异。自此离署出身，朝中亦记住了你的名字。"
 wj_langguan.1005.desc_pass:0 "你的答辞虽少锋芒，却无大失，评语列为合格，准予正式取得孝廉出身。"
 wj_langguan.1005.t:0 "郎官考校：定等"

 # 来源：localization/simp_chinese/WJ_military_governance_l_simp_chinese.yml
 WJ_zhongwai.0001.a:0 "奉受任命，总督中外军务。"
 WJ_zhongwai.0001.desc:0 "总督中外诸军事的诏命读完，我仍望着面前的符节。往后诸军相争节制、前后难以援应，都将有人把文书送到我这里，不许我只说那是别署的事。\n\n宣诏者稍停，等我奉受。殿中几道目光也随之移来，有人看我，有人看节，分不清究竟在估量什么。我整了整衣襟，心里已想到几份不久便要改送到案前的军报。\n\n此权随录尚书事之任，并非家门可以私传的东西。然而眼下，能够统筹中外军务的人将是我。最后一句奉命，应当说得让他们都听清。"
 WJ_zhongwai.0001.t:0 "诏总中外"
 WJ_zhongwai.0002.a:0 "谨奉诏命。"
 WJ_zhongwai.0002.desc:0 "诏命宣下，[scope:wj_zw_holder.Custom('WJ_GetLinkedUIName')]总督中外诸军事，并假黄钺。方才还低声交谈的人渐渐住口，这几个字比前面的礼辞更能使人抬头。\n\n我听着新定节制，想起先前那些被各署来回推转的军报。从此谁能发令、谁须请示，都要重新记清；一份还按旧路送出的文书，也许便会被原封退回。\n\n传诏者继续往下读，周围各有神色。我没有急着与旁人交换议论，只将这个名字记在心里。下次军中有事，该向哪一处陈请，今日已经不同了。"

