l_simp_chinese:
 # ==========================================================================
 # 隐士故事循环（养望重制，2026-10-09）
 # ==========================================================================
 story_WJ_yinshi:0 "隐居"
 WJ_YINSHI_STORY_INFORMATION_STRING:0 "你隐居山林，读书交游，不应征辟。山中日子看似平淡，却总有经卷里的疑难、乡里的纷争、故人的书札找上门来；偶尔，也会有车马停在柴门之外。"

 WJ_yinshi_enter_decision:0 "隐居养望"
 WJ_yinshi_enter_decision_desc:0 "宦途风波，终非久计。不如辞去官职，闭门读书，与乡里故交往还，以学问操守自养清望。他日天下有道，再出未迟。"
 WJ_yinshi_enter_decision_tooltip:0 "辞去官职，归隐山林，闭门养望"
 WJ_yinshi_enter_decision_confirm:0 "归欤！"
 WJ_yinshi_enter_decision_effect_tt:0 "你将自题一个雅号，从此闭门读书，谢绝一切征辟与任命，也不再执掌兵马。"
 WJ_yinshi_enter_decision_resign_tt:0 "你所领的官职与封地，连同其下属，将尽数交还主上。"
 WJ_yinshi_cooldown_tt:0 "你出山未满十五年，须至 [GetPlayer.MakeScope.Var('wj_yinshi_cooldown_end').GetValue|0] 年方可再度归隐"
 WJ_yinshi_blocked_tt:0 "此人正在隐居，不受任命"

 WJ_yinshi_exit_decision:0 "出山"
 WJ_yinshi_exit_decision_desc:0 "山中岁月已久，天下事却未尝稍歇。是时候整衣出山，再应朝廷与州郡的征召了。"
 WJ_yinshi_exit_decision_tooltip:0 "结束隐居，复应征辟"
 WJ_yinshi_exit_decision_confirm:0 "整衣出山"
 WJ_yinshi_exit_decision_effect_tt:0 "你将辞别山居，重回尘世。此番出山，多年之内不宜再言归隐。"

 WJ_yinshi_risk_success:0 "所为有成"
 WJ_yinshi_risk_fail:0 "事与愿违"
 WJ_yinshi_friend_reason:0 "隐居时相知"
 WJ_yinshi_friend_safe_result:0 "故交相慰"
 WJ_yinshi_friend_success_result:0 "倾谈有得"
 WJ_yinshi_friend_failed_result:0 "言不投契"
 WJ_yinshi_friend_received_result:0 "山居故交的往来"
 WJ_yinshi_trait_result:0 "持身有得"

 # ---------------------------------------------------------------- 学习
 WJ_yinshi.1001.t:0 "灯下校古注"
 WJ_yinshi.1001.desc:0 "两本旧注摊在灯下，门人忽指着同一处笑道：“先儒竟将自家的话也驳了。”\n\n我凑近看，一本将旁注接入正文，另一本却缺了半行。几人已循此辩了许久，越辩引文越多，最初那一字反倒无人再问。\n\n案旁空纸尚在。我把引来作证的诸书稍稍推开，重新读了一遍原文。"
 WJ_yinshi.1001.a:0 "先校字句，异处各自留下。"
 WJ_yinshi.1001.b:0 "试写一篇新解，给诸君诘问。"
 WJ_yinshi.1001.c:0 "添些灯油，今晚将诸本对完。"

 WJ_yinshi.1002.t:0 "旧注与新说"
 WJ_yinshi.1002.desc:0 "家藏旧注有一处说不通，我以别本相校，数行新解竟将前后疑窒一并解开。正待落笔，翻到卷末，又见师承的旧题记。\n\n门人问为何还不改。我将他引到案前：新说在此处明快，到了下一章却未必相合。\n\n他读了两遍，低声问：“那么，后来的读书人该信哪一处？”"
 WJ_yinshi.1002.a:0 "旧文不删，将所疑并注于旁。"
 WJ_yinshi.1002.b:0 "另撰辨疑，将新说传出求教。"

 WJ_yinshi.1003.t:0 "两本异文"
 WJ_yinshi.1003.desc:0 "借来的两本书只许留到明日。同一句话，一本少一字，一本多一字，读来竟是相反的意思。\n\n借书人劝我挑顺口的抄下，免误归期。我却在别处找到了同一句引文，恰好缺着最要紧的那字。\n\n门人已将新卷编好，只等我定下这最后一行。"
 WJ_yinshi.1003.a:0 "两说并录，疑字空着。"
 WJ_yinshi.1003.b:0 "择一入文，把取舍的缘由写明。"
 WJ_yinshi.1003.c:0 "先抄异处，再求别本相校。"

 WJ_yinshi.1004.t:0 "夜诵"
 WJ_yinshi.1004.desc:0 "门人一口气诵完旧篇，合卷之后，却将前后两章讲成了一个意思。我欲纠正，翻回原文，自己也在一处停住。\n\n“此句先生上次似乎不是这样说的。”他小心提醒。窗外已经报更，案上的灯油只剩浅浅一层。\n\n我将书卷重新展开，才发觉困住我们的不止这一句。"
 WJ_yinshi.1004.a:0 "今日只讲通此章，余下明日再读。"
 WJ_yinshi.1004.b:0 "前后通读一遍，今夜将它讲明。"

 WJ_yinshi.1005.t:0 "临碑习字"
 WJ_yinshi.1005.desc:0 "新得的碑拓摊开，缺损处恰在一字转折。门人照缺口摹下，问这是否便是古人的笔意。\n\n我提笔示范，写到那处也不自觉断了笔。再看邻字，收势却全不相同。\n\n纸已写满半幅，越像拓本，倒越不像一个完整的字。"
 WJ_yinshi.1005.a:0 "先循完整的字练熟笔法。"
 WJ_yinshi.1005.b:0 "参看上下字势，另写一幅。"

 WJ_yinshi.1006.t:0 "读律辨条"
 WJ_yinshi.1006.desc:0 "乡人送来田券，指着书肆抄来的律条，说自己明明占理。条后所署年月，却比田券晚了许久。\n\n我取出家藏律本，发现乡人所引还漏了前一句。听说要另寻凭据，他脸色顿时黯下：“那我这几日岂不是白跑？”\n\n几张纸压在案边，最像凭据的一张，偏偏错得最多。"
 WJ_yinshi.1006.a:0 "抄出现行条文，年月也一并写明。"
 WJ_yinshi.1006.b:0 "新旧条令比勘，替他理清疑处。"
 WJ_yinshi.1006.c:0 "逐条覆校，莫让半句话误了人。"

 WJ_yinshi.1007.t:0 "九章与田亩"
 WJ_yinshi.1007.desc:0 "分田草图送来，长广与亩数各写得清楚，筹数一合，却平白多出一角田。掌簿者断言旧法无误，拿来的几张往年草图也都是这样算的。\n\n我依图在席上摆筹，才见那片田并非方形。门人移开一根筹，问：“若先割去这一角呢？”\n\n旧算法就在书中，眼前田形却似乎另有解法。"
 WJ_yinshi.1007.a:0 "依书中本法复算，不留错数。"
 WJ_yinshi.1007.b:0 "照这田形另求简法，算给大家看。"

 WJ_yinshi.1008.t:0 "观星记历"
 WJ_yinshi.1008.desc:0 "门人举着灯，我对照星图，第三次记下同一处差数。他问是否云气遮蔽，我便翻出前两夜的札记——其中一夜，天清如洗。\n\n旧历与实测相差虽小，积起来却不知将误到何处。观测的器具在风中微晃，门人又扶紧了一些。\n\n窗前备着新纸，今夜尚可再记一轮。"
 WJ_yinshi.1008.a:0 "旧数与实测并记，留待后来相验。"
 WJ_yinshi.1008.b:0 "再观一轮，连夜推求差数。"

 # ---------------------------------------------------------------- 探究
 WJ_yinshi.2001.t:0 "垄上问学"
 WJ_yinshi.2001.desc:0 "我照书中所载下种，两畦苗色却判若两地。老农蹲下捻土，没先问我用了哪家之说，只问昨夜浇过几次水。\n\n我取书给他看。他读不了几字，倒能将田头积水的去向说得清清楚楚。\n\n“先生若要试，先留这一小畦。”他拨开土块，“莫将整片都赔进去。”"
 WJ_yinshi.2001.a:0 "先记土性与水候，听老农细说。"
 WJ_yinshi.2001.b:0 "就试这一畦，看书中之说可否行通。"

 WJ_yinshi.2002.t:0 "采药识草"
 WJ_yinshi.2002.desc:0 "山翁将两束草并置竹篮，说一束可入药，另一束碰不得。我循药书看叶形，竟觉得两束都合。\n\n他折开一根，递来让我闻：“纸上可写了这个气味？”我重看书页，旁注果然只说“状如某草”，却没解释究竟像在哪里。\n\n篮底还有数株尚未拣开，门人已拿来了笔。"
 WJ_yinshi.2002.a:0 "随翁辨根叶，先把形性记全。"
 WJ_yinshi.2002.b:0 "将药书取齐，逐株参验。"

 WJ_yinshi.2003.t:0 "纸背旧事"
 WJ_yinshi.2003.desc:0 "抄书旧纸翻过来，背面竟露出半行官牍。官名、年号与正面的题记互不相合，末尾一枚残印却格外清楚。\n\n门人欲将纸裁齐，我忙按住刀尺。再拼上邻页，半个姓名又接了出来。\n\n这些被当作废纸的字，或许比正面抄下的经文还难再寻。"
 WJ_yinshi.2003.a:0 "正背一同抄存，勿伤残字。"
 WJ_yinshi.2003.b:0 "从官名与年月查起，考其来历。"

 WJ_yinshi.2004.t:0 "山川地志"
 WJ_yinshi.2004.desc:0 "行商看过我的地志，笑着将指头从旧渡移到图外：“如今在这里过河。”两部书所记相反，竟各有一段还说得通。\n\n他报出沿途村名，我逐一注下，才发现旧图那条支流早已没有人走。\n\n门外水声正急，行商临去又道：“若依图赶路，先生怕要在荒滩等船。”"
 WJ_yinshi.2004.a:0 "将旧说与行人口述分别录下。"
 WJ_yinshi.2004.b:0 "循水一探，把新津旧渡核清。"

 WJ_yinshi.2005.t:0 "问疾求方"
 WJ_yinshi.2005.desc:0 "邻人携旧方来问，说病家照服数日仍不见好。我翻出医经，同名病证之下，竟列着相反的治法。\n\n延来的医者听完，先问起居饮食，再看药包，竟将其中一味拨到一旁。邻人急问是否换方，医者却要先去看看病者。\n\n我手中那页纸，忽然显得薄得很。"
 WJ_yinshi.2005.a:0 "将医经借他参考，请医者细看。"
 WJ_yinshi.2005.b:0 "随医问证，把诸方异同记下来。"

 WJ_yinshi.2006.t:0 "导引养身"
 WJ_yinshi.2006.desc:0 "客人谈吐纳导引，说得几乎无病不可去。我请他演示，才做数遍，他便停下抚膝，笑道今日走山路走多了。\n\n门人忍不住问：“不是说可使筋骨长健么？”客人不恼，只答须逐日持守，不能指望一句口诀。\n\n我挪开席上书卷，请他再从第一式教起。"
 WJ_yinshi.2006.a:0 "先记法度，量力而习。"
 WJ_yinshi.2006.b:0 "从今日定下作息，亲自试行。"

 WJ_yinshi.2007.t:0 "清谈辨难"
 WJ_yinshi.2007.desc:0 "清谈席上，客人说万物齐同，争执不过各有所执。话音未落，旁人借走了他的坐席，他却立刻争了起来。\n\n众人笑过，又把方才的话题推到我面前。那客人抚平衣裾，仍道此是两回事。\n\n我倒了半杯水，问他：“那么，两事究竟分在何处？”"
 WJ_yinshi.2007.a:0 "姑录其说，留待再思。"
 WJ_yinshi.2007.b:0 "就从这件小事问下去。"
 WJ_yinshi.2007.c:0 "且让他坐定，听其慢慢说完。"

 WJ_yinshi.2008.t:0 "闭门自省"
 WJ_yinshi.2008.desc:0 "翻检旧札，我见一封与人争辩的书信，满篇都在责人失言。读到末尾，却忽然记起自己先说的那句刻薄话，信上一个字也没有。\n\n再翻另一封，也是如此。我将两札并置，几处自称“不得已”的地方，看起来竟格外相似。\n\n新纸就在旁边，迟迟未能下笔。"
 WJ_yinshi.2008.a:0 "先记下这处遗漏，仍循日课。"
 WJ_yinshi.2008.b:0 "将旧事逐件写全，不替自己讳饰。"
 WJ_yinshi.2008.c:0 "心平些再写，怨话且不要入纸。"

 # ---------------------------------------------------------------- 当地人
 WJ_yinshi.3001.t:0 "旧约与乡争"
 WJ_yinshi.3001.desc:0 "两家争渠水，半张旧约从东家取出，另半张却在西家。拼起来，放水的日次倒清楚，遇旱如何相让却只字未提。\n\n乡老请我说句公道话，东家已将茶递来，西家又把茶盏移远，仿佛我喝了这一口，便算应了哪家。\n\n门外水声不大，两边嗓门却一声高过一声。"
 WJ_yinshi.3001.a:0 "先请乡老劝止争吵。"
 WJ_yinshi.3001.b:0 "将旧约补议清楚，轮日引水。"
 WJ_yinshi.3001.c:0 "茶先不喝，依旧约把曲直说明。"

 WJ_yinshi.3002.t:0 "蒙童叩门"
 WJ_yinshi.3002.desc:0 "几个孩子携书叩门。一个已背得数章，另一个却连自己的名字也写不全；家长都说“但凭先生教”，所带的书却各不相同。\n\n我问为何来学，有人答要读经，有人只想替家中看懂借券。最小的那个指着门旁题字，问是不是也得先会这一行。\n\n案头只铺得下一卷书，孩子们却都挤近了些。"
 WJ_yinshi.3002.a:0 "先教姓名、书札与契券常用的字。"
 WJ_yinshi.3002.b:0 "按深浅分授，把句读根基打好。"

 WJ_yinshi.3003.t:0 "渡口让路"
 WJ_yinshi.3003.desc:0 "渡船尚在对岸，这边已争起先后。挑果的人怕货坏，扶病者的人怕误时，先到的行客则将脚下石头一指，称自己站在这里已有半晌。\n\n船夫隔水招手，只说一船装不下。人群将我挤到前面，仿佛请谁先上船，总得有个人担这句话。\n\n病者咳了一阵，挑果的人也不再喊，却仍紧攥着担绳。"
 WJ_yinshi.3003.a:0 "照到岸先后，分次等船。"
 WJ_yinshi.3003.b:0 "先替病者陈情，请众人让一步。"

 WJ_yinshi.3004.t:0 "送终之议"
 WJ_yinshi.3004.desc:0 "丧家借来一张厚葬器物单，数目比家中余财多出数倍。孝子问我哪几项可省，说到最后，声音却越压越低。\n\n门外亲戚已议论邻家的排场，连尚未下订的器物也替他添进单里。乡老请我写几句劝诫，又悄悄叮嘱莫提任何人名。\n\n纸上“尽哀”二字，几乎要被器物的名目淹没。"
 WJ_yinshi.3004.a:0 "就这一家说礼，先免勉强举债。"
 WJ_yinshi.3004.b:0 "请乡老共议薄葬，不再彼此争奢。"

 WJ_yinshi.3005.t:0 "周急有序"
 WJ_yinshi.3005.desc:0 "送粮的人又到了常受周济的那一家，转身才听邻人说，巷尾另有一户已两日未举火。\n\n我问为何无人早说。邻人看着那扇紧闭的门，答：“他家从前也曾济人，不愿如今开口。”众人肯相助，却谁也不知还有几家如此。\n\n手中的粮袋尚有余，门后却一直没有动静。"
 WJ_yinshi.3005.a:0 "托近邻私下送去，不问其家难处。"
 WJ_yinshi.3005.b:0 "请乡邻分担照应，别只济肯开口的。"
 WJ_yinshi.3005.c:0 "我另出一份钱，先解这几家的急。"

 WJ_yinshi.3006.t:0 "篱边一尺"
 WJ_yinshi.3006.desc:0 "篱边新笋长了一片，两位邻人却为一尺地争得面红。各自指认的旧界石都还在，只是中间那道篱笆重扎过，谁也说不清原在何处。\n\n一人拿来残契，另一人便讲起先父的口约。说着说着，争的已不是笋，而是哪家从来爱占便宜。\n\n乡老请我到篱边看看，莫让两家日后连门也不肯相对。"
 WJ_yinshi.3006.a:0 "先约共用这片笋，别伤邻情。"
 WJ_yinshi.3006.b:0 "同验旧石与残契，将可辨处写成约。"

 WJ_yinshi.3007.t:0 "乡塾共读"
 WJ_yinshi.3007.desc:0 "借作乡塾的屋舍已扫净，约来的人却只到了半数。门外有人放下农具便来听讲，才识几个字；窗边几名后生已能通读，却嫌今日所讲太浅。\n\n[wj_duty_person.GetFirstName]将自己抄的书递给我。前半卷字迹工整，后半卷却换成细碎的算式——家中催他回去记田账，白日再难常来。“若能先替初学者认字，我晚些再向先生问难，可使得？”\n\n父老指着屋内的空席，说农闲并不与每家同日。书可以凑，灯油、纸墨与一个长久照应讲席的人，却还没有着落。\n\n我将诸人的抄卷分作两叠。[wj_duty_person.GetFirstName]仍等着答复：这间乡塾，是偶来听一席话，还是往后真有地方可读书？"
 WJ_yinshi.3007.a:0 "先排农闲短课，能来一日，便教一日。"
 WJ_yinshi.3007.b:0 "纸墨灯油我来筹，分席授读，试办一所长塾。"

 WJ_yinshi.3008.t:0 "社饮之间"
 WJ_yinshi.3008.desc:0 "乡社饮酒，主人执杯劝一位不善饮的乡人，说若不尽饮便是见外。那人已红了眼，仍勉强举杯，旁边几人只顾笑。\n\n我将自己的杯放下，主人立刻转向我：“先生总肯赏脸罢？”\n\n一席忽然安静，连方才说笑的人也等着看这一杯如何收场。"
 WJ_yinshi.3008.a:0 "先说几句农时，缓一缓这杯酒。"
 WJ_yinshi.3008.b:0 "赏脸也得量力，莫以杯数论亲疏。"
 WJ_yinshi.3008.c:0 "我陪主人叙话，让他歇一歇。"

 # ---------------------------------------------------------------- 朋友
 WJ_yinshi.4001.t:0 "暮雨到书札"
 WJ_yinshi.4001.desc:0 "[wj_yinshi_friend.Custom2('MyCharacterIntroduction', ROOT.Char)]的来札被雨洇了一角，问安诸语之外，只剩末尾一句格外清楚：“众人皆如此说，我当从之否？”\n\n我读到纸边，才见那句话后还有半行，写了又涂去。对方未肯明说的顾虑，倒比所问更难回答。\n\n回札已经铺好，檐下仍落着水。"
 WJ_yinshi.4001.a:0 "先叙别后故情，劝其珍重。"
 WJ_yinshi.4001.b:0 "既来问我，便将所见直言相告。"

 WJ_yinshi.4002.t:0 "半页来札"
 WJ_yinshi.4002.desc:0 "[wj_yinshi_friend.GetName]寄来半页札记，两处经义都只引到最难的一句，末尾却道“余不足论”。\n\n我取旧书相校，发觉那两处恰好也曾令我踌躇。依其前后所引，似乎已经另有一番见解，却偏不肯写尽。\n\n纸下还压着一张问安短札，字迹比正文从容得多。"
 WJ_yinshi.4002.a:0 "先复问安，疑义留待来日。"
 WJ_yinshi.4002.b:0 "将我的疑处也写去，请他莫再藏半句。"

 WJ_yinshi.4003.t:0 "故人求序"
 WJ_yinshi.4003.desc:0 "[wj_yinshi_friend.Custom2('MyCharacterIntroduction', ROOT.Char)]寄来文稿，请我作序。篇中乡事颇有可采，论及近来人物，却将数则传闻写成定论。\n\n附札只道：“得君一言，此书便足取信。”我回看卷中那些斩钉截铁的句子，逐一圈出所无凭据之处。\n\n文稿末页已为我的署名留白，空处竟比写满的地方更扎眼。"
 WJ_yinshi.4003.a:0 "只序亲见之事，不替传闻作保。"
 WJ_yinshi.4003.b:0 "先改这几处，再谈作序。"
 WJ_yinshi.4003.c:0 "此序恕不能作，容我具札辞谢。"

 WJ_yinshi.4004.t:0 "借书的期限"
 WJ_yinshi.4004.desc:0 "借给[wj_yinshi_friend.GetName]的书过了归期，新札却比书先到。信中详谈某章异义，正是我眼下急着要查的那一卷。\n\n我翻出原借札，上面写着归还之日；再看新札，又有数处引文颇可商榷。\n\n门人问回信是否只需两个字：“还书。”我忍不住笑，却仍将笔提了起来。"
 WJ_yinshi.4004.a:0 "书迟些无妨，先叙别情。"
 WJ_yinshi.4004.b:0 "答其疑处，也把归期说清楚。"

 WJ_yinshi.4005.t:0 "清名与旧识"
 WJ_yinshi.4005.desc:0 "[wj_yinshi_friend.GetName]近来少有音问，寄来的新札却格外周到，问遍起居，独独避开我们上次谈过的那件事。\n\n我欲回信直问，又想到当日分别时，对方也曾欲言而止。\n\n旧札仍夹在案边，一处墨痕被反复描重，几乎透到了纸背。"
 WJ_yinshi.4005.a:0 "先叙旧情，勿逼问难言之事。"
 WJ_yinshi.4005.b:0 "把疑处说开，总好过彼此猜测。"

 WJ_yinshi.4006.t:0 "断弦会友"
 WJ_yinshi.4006.desc:0 "[wj_yinshi_friend.Custom2('MyCharacterIntroduction', ROOT.Char)]将琴推过来，说新得一曲，偏在收尾处听来不畅。我依谱抚到半途，对方忽然轻敲案沿，拍子竟与谱上不同。\n\n两人各试一遍，谁也未能说服谁。窗外有鸟声插入，反倒恰好接住了停下的末音。\n\n对方笑道：“难道还须请它来定谱？”"
 WJ_yinshi.4006.a:0 "且随意抚一曲，不争谱上得失。"
 WJ_yinshi.4006.b:0 "参校新旧之谱，把这一曲合通。"

 WJ_yinshi.4007.t:0 "竹林清谈"
 WJ_yinshi.4007.desc:0 "席间议论正盛，[wj_yinshi_friend.GetName]忽将话头转给我，问我如何解其中一处。众人方才各说各的，此时却都停下来等答。\n\n我刚引出半句，邻席已举了反例；再看原说，那反例似乎也不尽合。\n\n[wj_yinshi_friend.GetName]将杯移到一旁：“今日总要把这一层说通。”"
 WJ_yinshi.4007.a:0 "先听诸论，只将所见稍作补充。"
 WJ_yinshi.4007.b:0 "逐条应答，亦请对方续辨。"

 WJ_yinshi.4008.t:0 "雪夜续札"
 WJ_yinshi.4008.desc:0 "雪落半夜，翻到[wj_yinshi_friend.GetName]的旧札，我才想起上次回信漏答了一问。再读那句笑语，竟仿佛对方仍在案前。\n\n门人已备好明日送信的行囊，见我提笔，便问是否还要添札。窗纸被雪光映白，案上倒比往常更亮些。\n\n我将旧信翻到背面，那里还有半页空白。"
 WJ_yinshi.4008.a:0 "添几句问安，约在雪霁再叙。"
 WJ_yinshi.4008.b:0 "今夜续完这封信，莫再留半句话。"

 # ---------------------------------------------------------------- 邀请
 WJ_yinshi.5001.t:0 "辟书叩衡门"
 WJ_yinshi.5001.desc:0 "[actor.Custom2('MyCharacterIntroduction', ROOT.Char)]遣使奉来辟书。书中不多谈山林高致，却将府中待办之事逐项列明，末尾问我肯否出山相助。\n\n使者见我读毕，又取出复札所用的纸，置于案旁。他未催促，只说府中还在等这一席。\n\n门外车马俱备，书案上的旧卷却刚读到一半。"
 WJ_yinshi.5001.a:0 "受此辟书，愿往府中任事。"
 WJ_yinshi.5001.b:0 "知遇之意谨领，仍请许我守此山居。"

 WJ_yinshi.5002.t:0 "乡论入郡府"
 WJ_yinshi.5002.desc:0 "[actor.Custom2('MyCharacterIntroduction', ROOT.Char)]遣人送来举状，愿以孝廉荐我。乡评、行事俱有记录，数处连我自己也几乎忘却。\n\n来人请我核过，若无异议，便将此状送上。他指着一段过誉之辞，说举主已改过两遍，仍以为不宜删去。\n\n我将举状读完，案上的回札尚未写一字。"
 WJ_yinshi.5002.a:0 "受荐出山，愿以任事答此乡评。"
 WJ_yinshi.5002.b:0 "此誉未敢当，请举主另求贤者。"

 WJ_yinshi.5003.t:0 "山中亦有经世学"
 WJ_yinshi.5003.desc:0 "[actor.Custom2('MyCharacterIntroduction', ROOT.Char)]来书，愿以茂才荐我。所述长处并非泛泛称许，竟引了我早年论事的一封旧札。\n\n末尾另问，如今再遇此事，当日所言是否仍可行。我将旧札寻出，重读一遍，许多未虑及之处，此时都看得更清楚了。\n\n回信既要答其荐意，也得答这最后一问。"
 WJ_yinshi.5003.a:0 "愿受此荐，以所学试于任事。"
 WJ_yinshi.5003.b:0 "承君知遇，只是此时仍欲闭门。"
 WJ_yinshi_invite_lapsed_tt:0 "来书所许已成空言，你仍就此出山。"

 WJ_yinshi.5101.t:0 "官诰到门"
 WJ_yinshi.5101.desc:0 "官诰送到山居，来者将印绶郑重置于案前。门人本欲照旧辞谢，读过诰文，才知这次已非问我肯否应召。\n\n案上旧卷尚摊着，印绶就搁在未校完的一行旁。来者退到阶下，等我收印，或写下辞不就的复文。\n\n窗外鸟声如常，门前却已多了一辆待发的车。"
 WJ_yinshi.5101.a:0 "收此印绶，出山承命。"
 WJ_yinshi.5101.b:0 "印绶奉还，我仍不就。"
