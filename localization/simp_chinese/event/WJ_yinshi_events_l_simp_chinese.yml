l_simp_chinese:
 # ==========================================================================
 # 隐士故事循环（养望重制，2026-10-09）
 # ==========================================================================
 story_WJ_yinshi:0 "隐居"
 WJ_YINSHI_STORY_INFORMATION_STRING:0 "你隐居山林，读书交游，不应征辟。山中日子看似平淡，却总有经卷里的疑难、乡里的纷争、故人的书札找上门来；偶尔，也会有车马停在柴门之外。"

 WJ_yinshi_enter_decision:0 "隐居养望"
 WJ_yinshi_enter_decision_desc:0 "宦途风波，终非久计。不如辞去官职，闭门读书，与乡里故交往还，以学问操守自养清望。他日天下有道，再出未迟。"
 WJ_yinshi_enter_decision_tooltip:0 "辞去官职，归隐山林，闭门养望"
 WJ_yinshi_enter_decision_confirm:0 "归欤！"
 WJ_yinshi_enter_decision_effect_tt:0 "你将自题一个雅号，从此闭门读书，谢绝一切征辟与任命，也不再执掌兵马。"
 WJ_yinshi_enter_decision_resign_tt:0 "你所领的官职与封地，连同其下属，将尽数交还主上。"
 WJ_yinshi_cooldown_tt:0 "你出山未满十五年，须至 [GetPlayer.MakeScope.Var('wj_yinshi_cooldown_end').GetValue|0] 年方可再度归隐"
 WJ_yinshi_blocked_tt:0 "此人正在隐居，不受任命"

 WJ_yinshi_exit_decision:0 "出山"
 WJ_yinshi_exit_decision_desc:0 "山中岁月已久，天下事却未尝稍歇。是时候整衣出山，再应朝廷与州郡的征召了。"
 WJ_yinshi_exit_decision_tooltip:0 "结束隐居，复应征辟"
 WJ_yinshi_exit_decision_confirm:0 "整衣出山"
 WJ_yinshi_exit_decision_effect_tt:0 "你将辞别山居，重回尘世。此番出山，多年之内不宜再言归隐。"

 WJ_yinshi_risk_success:0 "所为有成"
 WJ_yinshi_risk_fail:0 "事与愿违"
 WJ_yinshi_friend_reason:0 "隐居时相知"

 # ---------------------------------------------------------------- 学习
 WJ_yinshi.1001.t:0 "灯下校古注"
 WJ_yinshi.1001.desc:0 "借来的抄本终于送到，几处文字却与家中旧卷不同。同一章句，一家重礼制，一家辨名实；门下后学各执一说，连午食时也争论不休。\n\n夜深后，你仍对着两份抄本。贸然立异，容易博得一时声名；但明知旧解未安而不发一言，也算不得诚于学问。灯芯烧短了一截，案上还留着足够写下新解的空纸。"
 WJ_yinshi.1001.a:0 "先校文字，疑者存疑。"
 WJ_yinshi.1001.b:0 "逐条辨析，今夜成论。"
 WJ_yinshi.1001.c:0 "对勘达旦，一字不苟。"

 WJ_yinshi.1002.t:0 "旧注重开"
 WJ_yinshi.1002.desc:0 "翻检旧箧时，你找出一卷家中传下的经注。纸边已有虫蚀，几处批语仍能辨认：有的是前人郑重下笔，有的只是读到兴起时的疑问。如今再读，那些曾被奉为定论的解释，竟与你近年的见闻颇有抵牾。屋外风过竹叶，案上的旧字却让你迟迟不能翻页。\n\n若另写新说，后来读书的人或许能少走弯路，却也可能只记得你的辩驳，忘了旧学原有的长处。若只补缀残缺，家学便能完整传下，但你心中的疑问终究无处安放。灯下两张素纸，一张可写辨疑，一张可录旧注；今夜总要先落笔。"
 WJ_yinshi.1002.a:0 "补全旧注，存家学本来面目。"
 WJ_yinshi.1002.b:0 "另作辨疑，与旧说并传。"

 WJ_yinshi.1003.t:0 "两本异文"
 WJ_yinshi.1003.desc:0 "借来的一卷抄本与你手边旧本互有出入。同一句话，换了一个字，意思便从劝人持重变成催人进取；旁边的小注又像是后人误抄进了正文。你反复读了几遍，两种说法竟各有可通之处。纸页的磨损、墨色的深浅，都不能替你轻易断定谁先谁后。\n\n若选定一种读法誊入正文，读者不必处处分心，却会把你的取舍当成古书本有的面貌。若并列异文，把取舍暂留给后来者，文字固然显得繁碎，却能让疑处继续被看见。案上摊着两卷书，你忽然不愿再用一个干脆的改字遮住抄传的曲折。"
 WJ_yinshi.1003.a:0 "两说并存，阙疑以待。"
 WJ_yinshi.1003.b:0 "择一入正文，别注其由。"
 WJ_yinshi.1003.c:0 "暂不论断，广借诸本。"

 WJ_yinshi.1004.t:0 "夜诵"
 WJ_yinshi.1004.desc:0 "入夜后山中格外安静，只听得见檐下滴水。白日里读过的一章经文，句句都认得，合上书却说不出它前后如何连贯。少年时师长要求熟诵，你曾嫌它笨拙；如今才觉，许多道理要在口中反复过几遍，才肯在心里落定。\n\n灯油还够烧到下半夜。这一章尚未读熟，后面却还有长长的一篇在等着，倦意已经悄悄爬上了眉头。"
 WJ_yinshi.1004.a:0 "且熟此章，明日再进。"
 WJ_yinshi.1004.b:0 "通宵诵读，务求贯通。"

 WJ_yinshi.1005.t:0 "临碑习字"
 WJ_yinshi.1005.desc:0 "友人托樵夫捎来一份旧碑拓本，墨色浓淡不匀，有几处字口已经漫漶。笔画间的气象却很开阔，与时下流行的书风颇不相同。你铺纸试写了几行，手腕总不听使唤，写出来的字只得其形。\n\n老辈人说，学书须先老老实实摹上几年；也有人说，到了一定地步，便该丢开范本，写出自己的面目。拓本摊在案头，墨已经研好了。"
 WJ_yinshi.1005.a:0 "日摹一纸，先求形似。"
 WJ_yinshi.1005.b:0 "舍帖自运，试出己意。"

 WJ_yinshi.1006.t:0 "读律"
 WJ_yinshi.1006.desc:0 "乡里有人因一桩田产官司来问律文，你才发觉自己读了许多经书，对现行律令反倒生疏。借来的律本条目繁杂，同一桩事前后几条规定，轻重竟不一样。读书人常说律令是刀笔吏的学问，可乡人吃亏，往往正是吃在不明律文上。\n\n律本厚厚一叠，逐条抄读已要花上许多工夫；若想把各条之间的道理疏通明白，写成乡人也看得懂的文字，更不知要熬上几夜。"
 WJ_yinshi.1006.a:0 "先抄读一过，熟其条目。"
 WJ_yinshi.1006.b:0 "疏通律意，为乡人作解。"
 WJ_yinshi.1006.c:0 "为乡人逐条比勘，务求公允。"

 WJ_yinshi.1007.t:0 "九章算术"
 WJ_yinshi.1007.desc:0 "检书时翻出一部《九章算术》，是早年为应付课业买来的，书页几乎没有翻动过。随手看了几题，均输、方田都与乡中实事相关：分摊徭役、丈量田亩，都离不开这些算法。乡里的账目常有争执，多半也是因为没人算得清。\n\n书中的算题一道一道演过去，总能练熟；只是你隐隐觉得，若把这些法则推到眼前的实事上，或许能求出一种更简便的算术来。"
 WJ_yinshi.1007.a:0 "从头演算，先熟本法。"
 WJ_yinshi.1007.b:0 "推之实事，别求新术。"

 WJ_yinshi.1008.t:0 "观星记历"
 WJ_yinshi.1008.desc:0 "连日晴夜，星象格外分明。你对照手边的历书，发觉书中所载节气与眼前所见有一两日的出入。历法关系农时与祭祀，一向由太史掌管，山中隐者本不必过问；但这点出入若是真的，乡人播种便可能差上几天。\n\n夜风已经有些凉了。若要查明出入所在，便得连着几夜守在星空底下，亲自推步。"
 WJ_yinshi.1008.a:0 "先录历书，留待参验。"
 WJ_yinshi.1008.b:0 "连夜观测，推步求真。"

 # ---------------------------------------------------------------- 探究
 WJ_yinshi.2001.t:0 "垄上问学"
 WJ_yinshi.2001.desc:0 "清早走到田边，你看见同一片坡地上的禾苗有高有低。乡人谈起土色、日照与雨水去向，所用的词并不见于你熟读的篇章，判别却往往切中眼前情形。你问得仔细，才知道自己过去一句笼统的顺天时，放到垄亩之间竟须拆成许多不同的工夫。\n\n把今日听来的经验依次记下，再于不同天气时回来看，或能留成一份可信的农事札记。若亲自借一块薄田试种，也许能辨出哪些成说只适用于别处，只是一季的收成便押在了上头。泥土沾在履边，你不愿回屋之后便把这些话当作闲谈忘掉。"
 WJ_yinshi.2001.a:0 "留在田间，先记乡人之言。"
 WJ_yinshi.2001.b:0 "借田试种，躬验新法。"

 WJ_yinshi.2002.t:0 "采药识草"
 WJ_yinshi.2002.desc:0 "山后有位采药的老人，常背着竹篓从屋前经过。今日他停下来讨水，篓里的草叶你大半叫不出名字。老人说哪种可以退热，哪种只有晒干才能入药，哪种看着相似却会害人，说得头头是道，却说不出在哪本书里。\n\n老人喝完水便要上山。篓里那几株草还带着露水，古书所载的药性与老人的说法究竟合不合，只有亲口尝过才知道。"
 WJ_yinshi.2002.a:0 "随老人上山，且看且记。"
 WJ_yinshi.2002.b:0 "携草归来，按书亲尝。"

 WJ_yinshi.2003.t:0 "纸背另有春秋"
 WJ_yinshi.2003.desc:0 "裁理旧纸时，你在一页经文背面看到几行日用记事：某日借谷，某日返还，又有一句久雨难行的抱怨。字迹潦草，显然不是为留名而写。若照平常习惯裁去破边，最先消失的正是这些零散小字；但它们让你看见了正面端整章句之外的一段日子。\n\n将原页完整夹藏，只在目录中注明有杂记，后来的读者还能自己辨认笔迹与先后。若要追查这些杂记出自何时何人，便得翻遍旧箧、比对笔迹，还须提防凭几句话臆造出一整段身世。你停下裁纸的手，不愿再把无名当作无用。"
 WJ_yinshi.2003.a:0 "存其原貌，正背同录。"
 WJ_yinshi.2003.b:0 "追索来历，考其年月。"

 WJ_yinshi.2004.t:0 "山川地志"
 WJ_yinshi.2004.desc:0 "读地志时，你发觉书中记载的水道与乡人所说并不一致：书上说某水东流入河，乡人却说那条水早已改道，如今往南汇入另一条溪。地志多是前人辗转抄来，未必有人亲自走过。\n\n几种地志的说法抄在一处，异同自见；可究竟哪一说对，终究要有人沿着水道走上几日才能知道。山路崎岖，溪边多有险处。"
 WJ_yinshi.2004.a:0 "汇录诸志，注其异同。"
 WJ_yinshi.2004.b:0 "循水踏勘，亲验其道。"

 WJ_yinshi.2005.t:0 "问疾"
 WJ_yinshi.2005.desc:0 "邻家孩子发热数日不退，家人请不起医者，便来问你书中有没有方子。你读过几卷医经，却从未替人诊过病。医书所言阴阳表里，落到一个发烫的孩子身上，竟不知从何处下手。\n\n孩子的母亲站在门口，眼里满是指望。你知道书上的话未必靠得住，可远处的医者一时也请不来。"
 WJ_yinshi.2005.a:0 "检出医经，劝其延医。"
 WJ_yinshi.2005.b:0 "亲往诊视，依方试治。"

 WJ_yinshi.2006.t:0 "樵径改道"
 WJ_yinshi.2006.desc:0 "惯走的山径被雨水冲坏了一段，松动的土沿下露出树根。熟路的人尚能绕过，挑担者却须多费许多工夫。有人提议另辟近道，也有人说，新路会穿过容易积水的低处。你沿着坡势走了一遭，发觉纸上看似省下的路程，到了脚下未必真能省力。\n\n顺着旧径察看排水与落脚处，先把险段的位置说明，可以保留众人熟悉的走法，但往后仍要随雨水查看。若把两条新路各走一遍，记下晴雨时的差别，或能勘出一条更好走的道，只是山中奔走，难免要吃些苦头。归途鞋履尽湿，你倒比来时更明白了。"
 WJ_yinshi.2006.a:0 "细察旧径，标明险处。"
 WJ_yinshi.2006.b:0 "遍踏新路，勘定一途。"

 WJ_yinshi.2007.t:0 "谈玄"
 WJ_yinshi.2007.desc:0 "一位云游的道人借宿一晚，夜里与你对坐。他不谈符箓丹药，只问你读《老子》《庄子》读到了哪里。你说了几句平日的体会，他笑说那些都是书上的话。\n\n灯花爆了一下。道人捻须不语，似乎在等你再说些什么。"
 WJ_yinshi.2007.a:0 "姑妄听之，各读其书。"
 WJ_yinshi.2007.b:0 "放下成见，与之彻夜论道。"
 WJ_yinshi.2007.c:0 "得失由他，安然听之。"

 WJ_yinshi.2008.t:0 "自省"
 WJ_yinshi.2008.desc:0 "雨天不能出门，你翻看去年写下的几页日札。有些话如今读来幼稚，有些当时以为想通了的事，至今仍在反复。隐居原是为了读书，可读得越多，越觉得自己的脾性比书上任何一个难题都难解。\n\n雨声不歇。案头的书还摊着，砚中的墨却已经干了。"
 WJ_yinshi.2008.a:0 "照常读书，不必深究。"
 WJ_yinshi.2008.b:0 "闭门数日，尽录心中所思。"
 WJ_yinshi.2008.c:0 "心平气和，自见本来。"

 # ---------------------------------------------------------------- 当地人
 WJ_yinshi.3001.t:0 "衡门前的乡争"
 WJ_yinshi.3001.desc:0 "两户乡人带着各家的长者来到门前，为共用水道的先后争执不下。一方持旧约，一方说田中禾苗已不能再等。众人不愿先诉于官，推说你读过书，又与两家都无私怨，盼你评个公道。\n\n你没有官印，不能替县中断案。但若一句『隐者不问俗事』便将人推开，所谓乡里清望，又究竟落在何处？"
 WJ_yinshi.3001.a:0 "请乡老共议，不越俎代庖。"
 WJ_yinshi.3001.b:0 "查明旧约，亲断曲直。"
 WJ_yinshi.3001.c:0 "据约秉公，不偏不倚。"

 WJ_yinshi.3002.t:0 "蒙童叩门"
 WJ_yinshi.3002.desc:0 "几名乡中少年结伴到门前，带来的不是束脩，而是一叠练字的废纸。他们识得些常用字，读起短章却常把句读分错。领头的少年问，若白日还要帮家里劳作，是否就学不得经书。你望着他们指间的墨痕，想起自己初学时也曾被长篇章句吓住。\n\n照旧日师法，从一部经书逐字讲起，根基虽稳，未必有人能把漫长的课业坚持到底。若先取书信、契券中用得着的语句教他们，读书很快便能帮上家中，却也容易止于应付眼前事务。门外的脚步仍未散去，你该给他们怎样一个开头？"
 WJ_yinshi.3002.a:0 "先教日用文字，学以致用。"
 WJ_yinshi.3002.b:0 "授以经书，从句读教起。"

 WJ_yinshi.3003.t:0 "渡口让路"
 WJ_yinshi.3003.desc:0 "经过渡口时，几名行人正为先后次序争执。携物多的说不便久候，赶远路的说日暮难行，还有人早已等在岸边，却始终插不上话。没有谁愿意先认自己占了便宜，越辩越把小事说成了品行。你站在一旁，忽觉书中礼让二字到这里也须有个落脚处。\n\n按到岸早晚排次序，办法最明白，也能让不善言辞的人有所依凭；若先照顾眼前确有急难者，或更近乎体恤，却须把缘由讲清，免得人人都争称紧迫。水面上已有归鸟掠过，再拖延下去，谁也难行。"
 WJ_yinshi.3003.a:0 "依抵岸先后，各守其序。"
 WJ_yinshi.3003.b:0 "先问急难，代不言者陈情。"

 WJ_yinshi.3004.t:0 "送终之议"
 WJ_yinshi.3004.desc:0 "乡中有人议论丧葬，说近来几家竞相厚备棺椁，连家境窘迫者也怕被指作不孝。另一种说法则引古人薄葬之言，主张一概从简。议论并非因你家有丧，却仍有人请你写几句话作参考。你翻过礼书，发现书上详列仪节，却未替每一户人家量过生计。\n\n若直陈厚葬之弊，或可替困窘之家卸下一层重担，却容易被说成轻看亲情。若分别论明哀敬与器用，让各家依其所能行礼，言辞更周全，也可能被好奢者借来替旧习开脱。你不愿用别人的哀痛成就自己的议论，只能把每个字写得更慎重。"
 WJ_yinshi.3004.a:0 "分说礼意器用，因家制宜。"
 WJ_yinshi.3004.b:0 "直陈厚葬之弊，劝乡里从简。"

 WJ_yinshi.3005.t:0 "周急有序"
 WJ_yinshi.3005.desc:0 "连日道路泥泞，几户人家的柴粮一时接续不上。乡里并非无人愿意相助，只是各自听来的情形不同，有人反复受到照看，也有人不好意思开口，直到邻人偶然提起才被记住。来问主意的人坐在檐下，你听完才明白，眼前所缺的不全是慷慨。\n\n先把急需照应的情形逐户问清，再商定轮流探望，能够少些遗漏，却须格外谨慎，不使窘况成了众人的谈资。若只请熟悉各家的近邻私下相通，颜面较易保全，彼此掌握的消息又未必齐全。纸上可排出先后，人心却不能像数目一样轻易归拢。"
 WJ_yinshi.3005.a:0 "托近邻私下问候，免其当众开口。"
 WJ_yinshi.3005.b:0 "召集乡人，共议周急之序。"
 WJ_yinshi.3005.c:0 "先开自家仓廪以济其急。"

 WJ_yinshi.3006.t:0 "篱边一尺"
 WJ_yinshi.3006.desc:0 "修整篱边杂草时，你发现一丛新竹生在两处旧界标之间。邻里说法不一：有人认树根为界，有人只记得多年前小径的位置。竹笋眼下还不值多少，争的却是往后该依什么作准。你本可闭门不问，但若只劝众人宽厚，今日含混之处来年还会重新长出来。\n\n同看旧标与地势，把能够确认的边界先记明，再把难定之处留待共议，可以少些日后的争执，却要容忍眼前仍有空缺。若先议定篱边共同行走与取用的办法，暂不争这一尺归谁，邻情或更容易保全，只是便利的约定也需要众人长久记得。"
 WJ_yinshi.3006.a:0 "先约篱边共用，勿以小争伤邻。"
 WJ_yinshi.3006.b:0 "同看旧标地势，辨清界址。"

 WJ_yinshi.3007.t:0 "乡塾共读"
 WJ_yinshi.3007.desc:0 "乡中议起借一处空屋让少年共读，难处却不在有没有书。各家愿教的篇目不同，有人看重识字写札，有人坚持先读经书，还有人担心农忙时课业中断，反叫孩子落下怠学的名声。你听罢众人的说法，才知一间小小书屋，也承着许多不同的指望。\n\n先选人人用得上的短章，约定闲时聚读、忙时各自温习，较容易让这件事开始，却未必能使有余力者读得深入。若按程度分作几席，由先学者领着初学者复述，就能兼顾进退，只须防止课席高下变成孩子间的轻慢。书可以分卷，人却不该因起步早晚便被分出贵贱。"
 WJ_yinshi.3007.a:0 "先定短课，各家皆可从之。"
 WJ_yinshi.3007.b:0 "亲主乡塾，分席授读。"

 WJ_yinshi.3008.t:0 "社饮之间"
 WJ_yinshi.3008.desc:0 "乡社相聚，席间有人依旧例劝饮，说不尽杯便是疏远乡情。你并非厌恶与人同坐，只是看见几位不善饮者勉强应酬，笑意渐渐变得拘谨。若此时起身辞席，旁人或会把养望之人想成不肯亲近乡里的冷客；若仍随众相劝，又与心中所见不合。\n\n留在席上谈些农时与旧闻，借着话头缓下劝饮，或能让众人不伤和气地换一种相聚法。若当面说明饮量各异，不应以杯数论亲疏，道理更为清楚，也免不了使守旧例者一时难堪。杯中酒还未凉，你愿意与人相近，却不愿把勉强也叫作礼数。"
 WJ_yinshi.3008.a:0 "留席闲话乡事，徐缓劝饮。"
 WJ_yinshi.3008.b:0 "明言亲疏不在杯数，各随其量。"
 WJ_yinshi.3008.c:0 "举杯同乐，一席尽欢。"

 # ---------------------------------------------------------------- 朋友
 WJ_yinshi.4001.t:0 "暮雨到书札"
 WJ_yinshi.4001.desc:0 "暮雨中，行人带来[wj_yinshi_friend.GetName]的一封书札。前半叙别后近况，后半谈到进退之难：顺众意未必心安，独持己见又恐失却相知。写到末尾，只问你山中近来读些什么。\n\n你把信读了两遍。故交并非缺少一番大道理，不过想知道，旧日同席论学的人是否还肯认真听。回书该论世事，还是先劝其保重自身？"
 WJ_yinshi.4001.a:0 "先叙故情，劝其自重。"
 WJ_yinshi.4001.b:0 "详论所问，知己无讳。"

 WJ_yinshi.4002.t:0 "柴门留札"
 WJ_yinshi.4002.desc:0 "循着旧日记得的小径去访[wj_yinshi_friend.GetName]，你到时却只见柴门虚掩，院中晾着新洗的布，炉灰早已冷了。隔篱问讯，也只得一句外出未归。来前积了许多想说的话，从一处经义到路上所见，此刻都悬在心里。山色渐暗，等候似乎也成了这趟行程的一部分。\n\n在门旁留一张短札，把最要紧的疑问写清，再在附近寻个住处等人归来，或许能把话说透；只留一句问安便走，长谈便留给下一回相见。纸上容得下长篇道理，却未必容得下交谈中那些迟疑、停顿与会心的一笑。"
 WJ_yinshi.4002.a:0 "留一句问安，长谈待之来日。"
 WJ_yinshi.4002.b:0 "留札陈疑，候[wj_yinshi_friend.GetFirstName]归来。"

 WJ_yinshi.4003.t:0 "故人所托"
 WJ_yinshi.4003.desc:0 "一封辗转送来的书札，请你替一篇文章作序。写信的[wj_yinshi_friend.GetName]与你有旧交之谊，文中又多称许你的清望，读来很难不动情。可是细看所附篇章，几处论断失之偏颇，还把传闻写得过于确凿。你知道，一旦在卷首署名，旁人未必分得清你赞的是情谊还是见解。\n\n婉辞作序而详写商榷之意，可以守住自己的判断，却可能让对方觉得你以学问自高。若仍为其作序，只说文章的可取之处，并把保留意见交代清楚，旧情或可顾全，但读者也可能略过那些保留。山中得以从容下笔，不等于每一笔都能两全。"
 WJ_yinshi.4003.a:0 "为其作序，并明言可商之处。"
 WJ_yinshi.4003.b:0 "辞不作序，复书详加商榷。"
 WJ_yinshi.4003.c:0 "直言其失，不作违心之语。"

 WJ_yinshi.4004.t:0 "借书的期限"
 WJ_yinshi.4004.desc:0 "借给[wj_yinshi_friend.GetName]的书过了约期仍未送回，你案上正在写的札记因而缺了两处引文。想起对方来借时那份郑重，你不愿轻易疑人；但山路辗转，口信稍有差池，书卷就可能被忘在别处。若人人都只凭一时好意借取，藏书再丰也难供长久往还。\n\n写信催还并说明急用之处，既守约定，也让对方知道迟延确有不便，只怕语气稍重便损了相借的情分。若暂借另一抄本继续校读，再与对方另约归期，眼前较为宽缓，却也不能让期限从此成了空话。你取出旧借札，把责人的句子改了又改。"
 WJ_yinshi.4004.a:0 "另借抄本续读，再约归期。"
 WJ_yinshi.4004.b:0 "言明急用，请[wj_yinshi_friend.GetFirstName]依约归还。"

 WJ_yinshi.4005.t:0 "清名与旧识"
 WJ_yinshi.4005.desc:0 "有人劝你少与[wj_yinshi_friend.GetName]往来，说此人近来依附权门，名声已不如从前。你所知道的却只是早年相处的几件小事，既不能替如今的行止作保，也不愿把乡谈当作亲见。闭门之后，世事总隔着几层传闻抵达，偏偏关于节义的评断又最催人表态。\n\n若先致书询问，坦言所闻与疑惑，至少给旧交一个自陈的机会，却可能被外人看作曲为回护。若暂缓往来而不随众品评，可以守住自己的分寸，也可能在对方最需要直言时失了朋友之责。你把未写完的称谓停在纸头，觉得真正难守的是不轻率。"
 WJ_yinshi.4005.a:0 "暂缓往还，不传未明之言。"
 WJ_yinshi.4005.b:0 "致书直问，求一明白。"

 WJ_yinshi.4006.t:0 "断弦会友"
 WJ_yinshi.4006.desc:0 "[wj_yinshi_friend.GetName]来访时，你正好把久置的琴从布囊中取出，才试数声，一根旧弦便松断了。[wj_yinshi_friend.GetFirstName]笑说来得不巧，又说自己也许久不曾抚琴。窗外有风，断音散得很快，指下却还留着方才未成的曲意。\n\n案上还有备用的弦，旧谱也压在书底；可那断弦后的一点余音，却在两人心头绕着，迟迟不肯散去。"
 WJ_yinshi.4006.a:0 "共理新弦，寻回旧曲。"
 WJ_yinshi.4006.b:0 "就此余音，即席合奏新曲。"

 WJ_yinshi.4007.t:0 "竹林清谈"
 WJ_yinshi.4007.desc:0 "几位朋友约在竹林边小坐，[wj_yinshi_friend.GetName]也在其中。话题从一句经义谈到时局，又从时局谈回人性善恶，越谈越远。有人辞锋犀利，有人只是含笑不语。轮到你时，众人都静了下来。\n\n近来你确有些心得，在心里压了许久；只是一开口，这一席的走向恐怕便由不得旁人了。"
 WJ_yinshi.4007.a:0 "静听众论，偶插一言。"
 WJ_yinshi.4007.b:0 "接过话头，主此一席。"

 WJ_yinshi.4008.t:0 "雪夜访友"
 WJ_yinshi.4008.desc:0 "夜里落了一场大雪，推窗只见四野皆白。你忽然很想见一见[wj_yinshi_friend.GetName]，同其围炉说话。可是雪深路远，此时动身，到时恐怕已经天明，对方未必在家，也未必方便。\n\n炉火将熄，窗外的雪光却亮得叫人睡不着。"
 WJ_yinshi.4008.a:0 "修书一封，约以雪霁。"
 WJ_yinshi.4008.b:0 "乘兴而往，至门再说。"

 # ---------------------------------------------------------------- 邀请
 WJ_yinshi.5001.t:0 "辟书叩衡门"
 WJ_yinshi.5001.desc:0 "庭中尚带宿雨，门外忽有车马停下。来使拂去衣上尘土，奉上[actor.GetName]的辟书：府中虚位以待，愿请你出山共议事务。书中没有铺陈官禄，只说天下未宁，读书之人亦当有所担当。\n\n你将书置于案头，久久未答。闭门可以守住一己志趣，却不能使世事也停在门外；应召或可稍展所学，也须从此担起府主的知遇与托付。使者仍在阶下候着，等你写下回书。"
 WJ_yinshi.5001.a:0 "收拾书卷，随使者赴府。"
 WJ_yinshi.5001.b:0 "谨谢知遇，此身未能出。"

 WJ_yinshi.5002.t:0 "乡论入郡府"
 WJ_yinshi.5002.desc:0 "来访的乡老说，你虽少赴宴集，名字却已在乡里议论中传开。有人称许操守，也有人说，世家子弟受乡党扶持，终须为乡党做些事情。如今[actor.GetName]愿据此举你为孝廉，荐于[actor.GetTopLiege.GetPrimaryTitle.GetNameNoTier]。\n\n举状送到了面前，末尾尚待你的答复。受荐并不等于立刻束带赴官，但这份乡评一旦归于你名下，往后言行便不再只是自家之事。"
 WJ_yinshi.5002.a:0 "受此乡举，就此出山。"
 WJ_yinshi.5002.b:0 "德行未充，请举他贤。"

 WJ_yinshi.5003.t:0 "山中亦有经世学"
 WJ_yinshi.5003.desc:0 "[actor.GetName]的来书压在一卷旧注之上。信中提及你近来的议论，说山林中不乏识时务之人，愿以茂才荐你。纸上几句称许，偏偏都是你以为无人留意的见解。\n\n你本不愿以文章干进，却也未曾认定所学只能留在书斋。受下荐举，是承认这番学问仍可见用于世；至于何时出仕、为谁效力，仍当慎重自择。"
 WJ_yinshi.5003.a:0 "受此荐举，就此出山。"
 WJ_yinshi.5003.b:0 "名实未副，不敢居先。"
 WJ_yinshi_invite_lapsed_tt:0 "来书所许已成空言，你仍就此出山。"

 WJ_yinshi.5101.t:0 "官诰到门"
 WJ_yinshi.5101.desc:0 "使者送来的文书写得明白：你名下添了一份官守，催你即日赴任。乡人闻讯都来道贺，说隐者终究还是要出来做事的。你看着案上未读完的书，一时不知该先放下哪一件。\n\n受下这份官职，便是出山，往后的日子不再只属于自己；若辞而不受，便将印绶原封送还，依旧过你的山居日子。"
 WJ_yinshi.5101.a:0 "受命出山，不负所托。"
 WJ_yinshi.5101.b:0 "辞官不受，封还印绶。"
