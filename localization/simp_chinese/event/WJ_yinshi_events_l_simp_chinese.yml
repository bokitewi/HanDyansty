 WJ_yinshi.3005.collapse:0 "\n\n如今乡道阻隔，送粮的人几次往返不得。我手边也添了几张久候回音的求助札。"
 WJ_yinshi.4005.opposed:0 "\n\n旧日同朝论事，我与对方所见本就相左。若直问此事，难免又翻出往日的争论。"

 WJ_yinshi.4006.distant:0 "[wj_yinshi_friend.GetName]寄来新谱，在收尾一处连标数笔，说此处无论如何弹来都不畅。我循谱试过，果然在同一处断住。\n\n附札笑问，莫非我们上次听曲时都记错了拍子。我取出旧谱，竟又有另一种记法。\n\n琴还摆在席前，回札上已列了半行疑处。"
 WJ_yinshi.4007.distant:0 "[wj_yinshi_friend.GetName]将一席辨难写成来札，诸人之说列得分明，自己的断语却放在最后，请我评议。\n\n我刚在纸旁注下半句，往下一读，竟又有人举出相反的例证。隔着这一封信，席间的争论似乎仍未散去。\n\n回札留白甚多，对方显然不只等我写个“是”字。"
 WJ_yinshi.4001.received_good:0 "故交来札相慰，所见亦有相契"
 WJ_yinshi.4001.received_bad:0 "直言未合，来札令人不快"

 WJ_yinshi.4002.received_good:0 "经义互证，来札解开旧疑"
 WJ_yinshi.4002.received_bad:0 "经义商榷，来札未能释疑"

 WJ_yinshi.4004.received_good:0 "借书事已说开，交谊未疏"
 WJ_yinshi.4004.received_bad:0 "催书言辞不合，交谊受损"

 WJ_yinshi.4005.received_good:0 "旧事说开，故交相契"
 WJ_yinshi.4005.received_bad:0 "旧事重提，来札触及芥蒂"

 WJ_yinshi.4006.received_good:0 "合曲相得，交谊更深"
 WJ_yinshi.4006.received_bad:0 "曲意不合，一席稍有不欢"

 WJ_yinshi.4007.received_good:0 "辨难相契，相知更深"
 WJ_yinshi.4007.received_bad:0 "席间辞锋相抵，心生不悦"

 WJ_yinshi.4008.received_good:0 "雪夜续札，故情相契"
 WJ_yinshi.4008.received_bad:0 "续札失言，故交不悦"

 WJ_yinshi.3007.a.result:0 "农闲短课排定，后生先从浅处学起"
 WJ_yinshi.3007.c:0 "乡塾尚难齐集，你先带这份课抄回去。"
 WJ_yinshi.3007.c.result:0 "后生领得课抄与纸墨钱，私下继续研读"
 WJ_yinshi.3007.d:0 "浅课由你照应，我另教深义；雇直也由我出。"
