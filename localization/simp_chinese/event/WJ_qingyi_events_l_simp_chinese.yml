l_simp_chinese:
# 清议开场 / 会期 / 散席事件文本（2026-10-08 重写）。
# 月旦评专属事件（3xxx）与新增事件（1009–1012、2009–2012）在 mechanisms/WJ_qingyi_yuedan_l_simp_chinese.yml。

 # ---------------------------------------------------------------- 通用提示
 WJ_qingyi_yd_nudge_plus1_tt:0 "#P 席间有人因此更愿推举[wj_qingyi_subject.Custom('WJ_GetUIName')]#!"
 WJ_qingyi_yd_nudge_plus2_tt:0 "#P 席间不少人因此转而推举[wj_qingyi_subject.Custom('WJ_GetUIName')]#!"
 WJ_qingyi_yd_nudge_minus1_tt:0 "#N 席间有人因此不再看好此人#!"

 # ---------------------------------------------------------------- 0001 候客
 WJ_qingyi.0001.t:0 "清议：虚席以待"
 WJ_qingyi.0001.desc.host:0 "馆舍已经洒扫干净，坐席沿两廊铺开，案上放着几卷经书，茶具也已备齐。你从门口走到内堂，又从内堂走回门口，生怕哪里有疏漏。\n\n先到的几位宾客在廊下叙旧。发请柬时，你只想着该请哪些人；等人真的陆续来了，才想到这些人彼此之间未必都合得来。\n\n做主人的难处，从此刻就开始了。"
 WJ_qingyi.0001.desc.host_yuedan:0 "馆舍已经洒扫干净，坐席沿两廊铺开。这一回的请柬上写得明白：除了清谈，还要品评当世人物。\n\n不少宾客正是为此而来。有人在廊下低声打听你会提谁的名字，有人只是拱手寒暄，眼睛却一直瞟着门外，看还有谁会到。\n\n名单你心里已有个大概。等人到齐，便可开席。"
 WJ_qingyi.0001.desc.guest:0 "你在门口报了姓名，侍者引你入内。廊下已经坐了几位客人，有相识的，也有只闻其名的。\n\n主人[host.Custom('WJ_GetLinkedUIName')]还在内堂照料，案上的经卷尚未展开，众人谈的多是路上见闻和各地近况。\n\n正经的议论还没开始。你寻了个位置坐下，先听听这里的人都在关心些什么。"
 WJ_qingyi.0001.a:0 "且待诸贤毕至。"

 # ---------------------------------------------------------------- 0002 主人开席
 WJ_qingyi.0002.t:0 "清议：宾主既集"
 WJ_qingyi.0002.desc:0 "宾客终于到齐，门外的通报声也停了。你请众人就座，等最后几句寒暄落下，才开口道：\n\n“今日在座诸君，不以官爵论高下。有疑便问，有见便说。”\n\n这话每回清议都要说一遍，真能做到的却不多。第一个论题由谁提出，往往定下了这几日的风气。"
 WJ_qingyi.0002.desc.yuedan:0 "宾客终于到齐。你请众人就座，却不急着出题，先把话说在前头：\n\n“今日先论时事，再品人物。诸君这几日所言，最后都要落到几个名字上。月旦一出，便是公论，望诸君慎言，也望诸君直言。”\n\n席间静了片刻，随即响起一阵低语。"
 WJ_qingyi.0002.desc.learning:0 "宾客终于到齐。你请众人就座，开门见山地说，今日请诸君前来，是想借诸位之长，补自己之短。\n\n“经义有不明处，时务有不通处，在座诸君但讲无妨，吾当洗耳恭听。”\n\n见你这个主人自居后学，客人们反倒拘谨了片刻。好在不久便有人接过了话头。"
 WJ_qingyi.0002.a:0 "吾先发一题。"
 WJ_qingyi.0002.b:0 "请[wj_qingyi_opening_guest.Custom('WJ_GetUIName')]先发其端。"

 # ---------------------------------------------------------------- 0003 宾客入席
 WJ_qingyi.0003.t:0 "清议：入席论道"
 WJ_qingyi.0003.desc:0 "主人[host.Custom('WJ_GetLinkedUIName')]请众人就座，宣布清议开始：席间不论官爵，有疑可问，有见可陈。\n\n你在自己的席位上坐定。同席的人里，有的早闻其名，有的今日才初次见面。这几日的议论会是什么光景，眼下还说不准。\n\n来之前你已想好此行所为何事，此刻该着手了。"
 WJ_qingyi.0003.a:0 "依礼入座，静听开题。"
 WJ_qingyi.0003.b:0 "先执礼请教于主人。"
 WJ_qingyi.0003.c:0 "择一静处而坐。"

 # ---------------------------------------------------------------- 1001 清虚发端
 WJ_qingyi.1001.t:0 "清虚发端"
 WJ_qingyi.1001.desc:0 "你刚提出今日的论题，[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]便接口问道：“万物因有而见其用。那么器中之空，算不算用？”\n\n几位客人不约而同地看向案上的空杯。这一问看似玩笑，实则是有无之辨的老题目。答得好，今日的议论便有了根基；答得不好，你这个主人的分量便轻了。"
 WJ_qingyi.1001.a:0 "以玄理作答：有之以为利，无之以为用。"
 WJ_qingyi.1001.a.success:0 "义理贯通，满座首肯"
 WJ_qingyi.1001.a.failure:0 "言辞游移，反被追问"
 WJ_qingyi.1001.b:0 "以实事验之：空杯能盛水，空仓能积粟。"
 WJ_qingyi.1001.b.success:0 "以小见大，众人称妙"
 WJ_qingyi.1001.b.failure:0 "譬喻失当，未能服人"
 WJ_qingyi.1001.c:0 "请在座诸君各陈所见。"

 # ---------------------------------------------------------------- 1002 折角之问
 WJ_qingyi.1002.t:0 "折角之问"
 WJ_qingyi.1002.desc:0 "[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]听完你的开题，并不往下接，而是挑出其中一句，当席反问：照主人这么说，岂不是自相矛盾？\n\n这一问来得又快又准，在座的人都放下了杯子。对方显然有备而来，未必存心为难你，但无论如何，这一问非答不可。"
 WJ_qingyi.1002.a:0 "正色驳之。"
 WJ_qingyi.1002.a.success:0 "层层剖析，对方折服"
 WJ_qingyi.1002.a.failure:0 "被对方抓住破绽"
 WJ_qingyi.1002.b:0 "一笑而转其锋。"
 WJ_qingyi.1002.b.success:0 "举重若轻，席间一笑"
 WJ_qingyi.1002.b.failure:0 "显得有些勉强"
 WJ_qingyi.1002.c:0 "“客人未免失礼。”"

 # ---------------------------------------------------------------- 1003 经义与时务
 WJ_qingyi.1003.t:0 "经义与时务"
 WJ_qingyi.1003.desc:0 "席上学问最深的[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]由《春秋》讲到近年州郡的赋役，说经义若不能用于当世，读得再熟也是空文。\n\n这话说得在理，可其中有几处引证，你觉得并不妥当。是当场与之商榷，还是借机向其请教？"
 WJ_qingyi.1003.a:0 "引经断事，与之商榷。"
 WJ_qingyi.1003.a.success:0 "引证精当，对方叹服"
 WJ_qingyi.1003.a.failure:0 "反被对方纠正"
 WJ_qingyi.1003.b:0 "虚心求教。"
 WJ_qingyi.1003.c:0 "经义时务，各有所长，何必较其高下。"

 # ---------------------------------------------------------------- 1004 一言之鉴
 WJ_qingyi.1004.t:0 "一言之鉴"
 WJ_qingyi.1004.desc:0 "特邀的名士[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]一直很少开口，此刻却放下茶盏，对你说了一句评语。话不长，却正说中了你平日不愿承认的地方。\n\n满座都在看你如何回应。"
 WJ_qingyi.1004.desc.yuedan:0 "特邀的名士[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]一直很少开口。议论到名单上的[wj_qingyi_subject.Custom('WJ_GetLinkedUIName')]时，名士放下茶盏，只说了一句称许的话，满座随即安静下来。\n\n名士之言分量极重。你身为评主，是附和还是反驳，都会左右众人对此人的看法。"
 WJ_qingyi.1004.a:0 "拜受其言。"
 WJ_qingyi.1004.b:0 "与之往复论辩。"
 WJ_qingyi.1004.b.success:0 "往复数番，平分秋色"
 WJ_qingyi.1004.b.failure:0 "辩之不胜，徒显浅薄"
 WJ_qingyi.1004.c:0 "附议名士之评。"
 WJ_qingyi.1004.d:0 "当席驳之。"
 WJ_qingyi.1004.d.success:0 "驳得有理有据"
 WJ_qingyi.1004.d.failure:0 "反被名士问住"
 WJ_qingyi.1004.e:0 "一笑置之。"

 # ---------------------------------------------------------------- 1005 席间月旦
 WJ_qingyi.1005.t:0 "席间月旦"
 WJ_qingyi.1005.desc:0 "议论转到了人物身上。有人提起[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]近来的作为，随即有人附和，也有人摇头。\n\n众人渐渐都看向你，等你这个主人说一句话。当着本人的面品评，褒贬都得掂量分寸。"
 WJ_qingyi.1005.desc.yuedan:0 "议论转到名单上的[wj_qingyi_subject.Custom('WJ_GetLinkedUIName')]。有人举其旧事称道，有人说其近来所为未必如传闻那样好。\n\n[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]请你这位评主先下一句断语。你的话，众人投票时多少会记在心里。"
 WJ_qingyi.1005.a:0 "褒其所长。"
 WJ_qingyi.1005.b:0 "直指其短。"
 WJ_qingyi.1005.b.success:0 "所言中肯，无人能驳"
 WJ_qingyi.1005.b.failure:0 "言语伤人，结下嫌隙"
 WJ_qingyi.1005.c:0 "称许其人。"
 WJ_qingyi.1005.d:0 "贬抑其人。"
 WJ_qingyi.1005.d.success:0 "论据充分，众人信服"
 WJ_qingyi.1005.d.failure:0 "空口贬人，反失公允"
 WJ_qingyi.1005.e:0 "存而不论。"

 # ---------------------------------------------------------------- 1006 酒至微醺
 WJ_qingyi.1006.t:0 "兴酣之际"
 WJ_qingyi.1006.desc.wine:0 "酒过数巡，席间说话的声音大了起来。[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]举杯来敬，说清议说到这一步，也该放下几分拘束了。\n\n酒能让人说真话，也能让人说错话。你这个主人喝到几分，客人们都看在眼里。"
 WJ_qingyi.1006.desc.tea:0 "茶换了几道，议论也缓了下来。[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]端着茶盏过来，说几日争论下来，难得有这样的清闲。\n\n席间的气氛松了，正是说些平日不便说的话的时候。"
 WJ_qingyi.1006.a:0 "举杯同乐。"
 WJ_qingyi.1006.b:0 "守礼自持。"
 WJ_qingyi.1006.c:0 "乘兴臧否人物。"
 WJ_qingyi.1006.c.success:0 "妙语连珠，满座称快"
 WJ_qingyi.1006.c.failure:0 "失言于众"

 # ---------------------------------------------------------------- 1007 竹下忘年
 WJ_qingyi.1007.t:0 "竹下忘年"
 WJ_qingyi.1007.desc:0 "散席后，[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]没有走，与你一同坐在院中竹下。没有旁人，说的话也随意了：从年少读书的旧事，说到这些年各自的际遇。\n\n不知不觉已是深夜。主客之分，此刻似乎已无关紧要。"
 WJ_qingyi.1007.a:0 "引为知交。"
 WJ_qingyi.1007.b:0 "以家藏书卷相赠。"
 WJ_qingyi.1007.c:0 "一夕之谈，足矣。"

 # ---------------------------------------------------------------- 1008 清议之外
 WJ_qingyi.1008.t:0 "清议之外"
 WJ_qingyi.1008.desc:0 "[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]等众人散去才来找你，先说了几句客套话，随即话锋一转，请你在某件事上行个方便，又说备了一份薄礼。\n\n清议之名本为清流所重，席后的请托却从来不曾少过。"
 WJ_qingyi.1008.desc.yuedan:0 "[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]等众人散去才来找你。寒暄几句之后，对方压低声音，说名单上的[wj_qingyi_subject.Custom('WJ_GetLinkedUIName')]是难得的人才，望评主在众人面前多说几句好话，又说备了一份薄礼。\n\n月旦评一旦掺进私情，便不再是公论了。"
 WJ_qingyi.1008.a:0 "受其馈赠。"
 WJ_qingyi.1008.b:0 "当众拒之。"
 WJ_qingyi.1008.c:0 "虚与委蛇，留此人情。"

 # ---------------------------------------------------------------- 2001 名教与自然
 WJ_qingyi.2001.t:0 "名教与自然"
 WJ_qingyi.2001.desc:0 "主人[host.Custom('WJ_GetLinkedUIName')]忽然点到你，问道：礼法名教，是出于人的本性，还是圣人为治世而定下的？\n\n这是近来士林争论最多的题目之一，在座不少人早有成见。主人特意问你，大概是想听一个不一样的说法。"
 WJ_qingyi.2001.a:0 "名教出于自然。"
 WJ_qingyi.2001.a.success:0 "说理圆融，主人颔首"
 WJ_qingyi.2001.a.failure:0 "言不及义"
 WJ_qingyi.2001.b:0 "名教所以治世。"
 WJ_qingyi.2001.b.success:0 "切中时弊"
 WJ_qingyi.2001.b.failure:0 "举例不当"
 WJ_qingyi.2001.c:0 "请主人先言。"

 # ---------------------------------------------------------------- 2002 众目相逼
 WJ_qingyi.2002.t:0 "众目相逼"
 WJ_qingyi.2002.desc:0 "你刚说完自己的看法，[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]便站了起来，一条一条地驳，语气越来越重，最后干脆问你到底读没读过原书。\n\n满座的目光都转到你身上。此时退一步，往后在这些人面前就很难再开口了。"
 WJ_qingyi.2002.a:0 "以学问应之。"
 WJ_qingyi.2002.a.success:0 "引据详明，对方无言"
 WJ_qingyi.2002.a.failure:0 "被问得哑口无言"
 WJ_qingyi.2002.b:0 "以辞令化之。"
 WJ_qingyi.2002.b.success:0 "一句玩笑化解僵局"
 WJ_qingyi.2002.b.failure:0 "未能平息"
 WJ_qingyi.2002.c:0 "反问其所短。"
 WJ_qingyi.2002.c.success:0 "反将一军"
 WJ_qingyi.2002.c.failure:0 "弄巧成拙"

 # ---------------------------------------------------------------- 2003 执经请益
 WJ_qingyi.2003.t:0 "执经请益"
 WJ_qingyi.2003.desc:0 "你带来的那卷书里，有几处一直没读明白。今日[wj_qingyi_luminary.Custom('WJ_GetLinkedUIName')]也在座，此人学问精深，平日难得一见，正可借机解惑。\n\n只是当众请教，难免显出自己的不足。"
 WJ_qingyi.2003.a:0 "当面请益。"
 WJ_qingyi.2003.a.success:0 "疑处顿解"
 WJ_qingyi.2003.a.failure:0 "所问未得要领"
 WJ_qingyi.2003.b:0 "录其说，归而细读。"
 WJ_qingyi.2003.c:0 "留待他日。"

 # ---------------------------------------------------------------- 2004 名士一顾
 WJ_qingyi.2004.t:0 "名士一顾"
 WJ_qingyi.2004.desc:0 "特邀的名士[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]听完你的一番话，转头多看了你一眼，说了一句：“此君可与言。”\n\n这句话不长，在座的人却都听见了。名士一顾，往往比十篇文章更能让人记住一个名字。"
 WJ_qingyi.2004.a:0 "欣然受之。"
 WJ_qingyi.2004.b:0 "谦谢不敢当。"
 WJ_qingyi.2004.c:0 "趁势一展所学。"
 WJ_qingyi.2004.c.success:0 "名士击节称赏"
 WJ_qingyi.2004.c.failure:0 "画蛇添足"

 # ---------------------------------------------------------------- 2005 谁为上品
 WJ_qingyi.2005.t:0 "谁为上品"
 WJ_qingyi.2005.desc:0 "不知是谁先起的头，席间议论起在座诸人的高下。[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]半开玩笑地说，以今日的表现，你与其谁更胜一筹，不妨请大家评一评。\n\n玩笑归玩笑，众人却真的在等着看。"
 WJ_qingyi.2005.desc.yuedan:0 "众人正在争论名单上的[wj_qingyi_subject.Custom('WJ_GetLinkedUIName')]。[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]说得最起劲，转头问你怎么看。\n\n你一个人的话定不了结果，但说得有力，总能让几个人改变主意。"
 WJ_qingyi.2005.a:0 "推君为上。"
 WJ_qingyi.2005.b:0 "自陈所长。"
 WJ_qingyi.2005.b.success:0 "言之成理"
 WJ_qingyi.2005.b.failure:0 "自夸太过"
 WJ_qingyi.2005.c:0 "力为其人张目。"
 WJ_qingyi.2005.c.success:0 "说动了几位宾客"
 WJ_qingyi.2005.c.failure:0 "无人附和"
 WJ_qingyi.2005.d:0 "力陈其人之短。"
 WJ_qingyi.2005.d.success:0 "所言切中要害"
 WJ_qingyi.2005.d.failure:0 "被斥为挟私"
 WJ_qingyi.2005.e:0 "不与人争。"

 # ---------------------------------------------------------------- 2006 杯中任达
 WJ_qingyi.2006.t:0 "杯中任达"
 WJ_qingyi.2006.desc.wine:0 "酒越喝越多，有人解了衣带，有人击案而歌。[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]把一大杯酒推到你面前，说清谈之士，何必拘于俗礼。\n\n放达是名士风度，失态也是。分寸全在你自己。"
 WJ_qingyi.2006.desc.tea:0 "席间只有茶，众人却也谈得兴起。[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]把坐席挪近，说难得遇上谈得来的人，今晚不必早散。\n\n这样的时候，是放开胸怀还是守着规矩，全看你自己。"
 WJ_qingyi.2006.a:0 "放怀任达。"
 WJ_qingyi.2006.b:0 "持杯自守。"
 WJ_qingyi.2006.c:0 "与邻座对饮。"

 # ---------------------------------------------------------------- 2007 抵掌而谈
 WJ_qingyi.2007.t:0 "抵掌而谈"
 WJ_qingyi.2007.desc:0 "散席后，[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]拉住你接着谈。说到投机处，对方抵掌大笑，说这几日见了这么多人，难得有一个想法与自己如此相近。\n\n萍水相逢，能否结成长久的交情，就看今晚了。"
 WJ_qingyi.2007.a:0 "引为同道。"
 WJ_qingyi.2007.b:0 "赠以财帛。"
 WJ_qingyi.2007.c:0 "点到为止。"

 # ---------------------------------------------------------------- 2008 帷幕后语
 WJ_qingyi.2008.t:0 "帷幕后语"
 WJ_qingyi.2008.desc:0 "分坐说话时，[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]一句无心之言，露出了一件旧事的端倪。对方察觉你听出来了，立刻压低声音，脸色也变了。\n\n这件事主人恐怕还不知道。你是装作没听见，还是另作打算？"
 WJ_qingyi.2008.a:0 "当以此事告知主人。"
 WJ_qingyi.2008.b:0 "默记于心，不惊旁人。"
 WJ_qingyi.2008.c:0 "守口如瓶，须有所酬。"

 # ---------------------------------------------------------------- 2011 补：月旦评版本
 WJ_qingyi.2011.desc.yuedan:0 "主人[host.Custom('WJ_GetLinkedUIName')]忽然转向你，问你对名单上的[wj_qingyi_subject.Custom('WJ_GetLinkedUIName')]有何看法。\n\n席间安静下来。月旦评正在进行，你这一句话，或许就会改变几个人手中的票。"

 # ---------------------------------------------------------------- 9001 / 9002 散席
 WJ_qingyi.9001.t:0 "品题散席"
 WJ_qingyi.9001.desc:0 "宾客们陆续整衣起身，这几日的议论终于告一段落。侍者开始收拾坐席，你还要以主人的身份说最后几句话。\n\n这一场清议留下什么，传出去的是哪几句话，多少取决于你此刻如何收尾。"
 WJ_qingyi.9001.desc.yuedan:0 "宾客们陆续整衣起身。这一场清议，人们记得最清楚的，大概是[wj_qingyi_yd_winner.Custom('WJ_GetLinkedUIName')]被推为第一时满座的反应。\n\n月旦评的结果不久便会传遍各地，你这个评主的名字也会随之被人提起。最后几句话，你还要想想怎么说。"
 WJ_qingyi.9001.a:0 "录诸贤之言，传于士林"
 WJ_qingyi.9001.b:0 "亲送宾客出门。"
 WJ_qingyi.9001.c:0 "择其可用之才，荐之于朝"
 WJ_qingyi.9002.t:0 "余音在耳"
 WJ_qingyi.9002.desc:0 "清议将散，你随众人起身，这才觉出坐得太久，腿脚有些发僵。廊外的风迎面吹来，这几日争得最热烈的几句话还在耳边。\n\n此行有何收获，要等回去之后才能慢慢想明白。"
 WJ_qingyi.9002.desc.yuedan:0 "清议将散，众人还在谈论[wj_qingyi_yd_winner.Custom('WJ_GetLinkedUIName')]当选一事，有人心服，有人不以为然。\n\n这次月旦评你也投了票。不管结果如何，日后有人说起这一场品评，你也算是在场之人。"
 WJ_qingyi.9002.a:0 "录所学而归。"
 WJ_qingyi.9002.b:0 "拜谢主人。"
 WJ_qingyi.9002.c:0 "飘然而去。"

