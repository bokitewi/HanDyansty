l_simp_chinese:
# 清议开场 / 会期 / 散席事件文本（2026-10-08 重写）。
# 月旦评专属事件（3xxx）与新增事件（1009–1012、2009–2012）在 mechanisms/WJ_qingyi_yuedan_l_simp_chinese.yml。

 # ---------------------------------------------------------------- 通用提示
 WJ_qingyi_yd_nudge_plus1_tt:0 "[wj_qingyi_subject.Custom('WJ_GetUIName')]在月旦评本轮得票 #P +1#!"
 WJ_qingyi_yd_nudge_plus2_tt:0 "[wj_qingyi_subject.Custom('WJ_GetUIName')]在月旦评本轮得票 #P +2#!"
 WJ_qingyi_yd_nudge_minus1_tt:0 "此人在月旦评本轮得票 #N -1#!"

 # ---------------------------------------------------------------- 0001 候客
 WJ_qingyi.0001.t:0 "清议：虚席以待"
 WJ_qingyi.0001.desc.host:0 "馆舍已经洒扫干净，坐席沿两廊铺开，案上放着几卷经书，茶具也已备齐。我从门口走到内堂，又走回来，确认没有遗漏。\n\n先到的几位宾客在廊下叙旧。请柬发出去时，我只想着请哪些人；人真的陆续来了，才想到这些人彼此之间未必都合得来。\n\n主人的事，从此刻就开始了。"
 WJ_qingyi.0001.desc.host_yuedan:0 "馆舍已经洒扫干净，坐席沿两廊铺开。今日的请柬上写得明白：除了清谈，还要品评当世人物。\n\n不少宾客正是为此而来。有人在廊下低声打听我会提名谁，有人只是拱手寒暄，眼睛却一直在看还有谁会到。\n\n名单我心里已有个大概。等人齐了，便可以开始。"
 WJ_qingyi.0001.desc.guest:0 "我在门口报了姓名，侍者引我入内。廊下已经坐了几位客人，有相识的，也有只闻其名的。\n\n主人[host.Custom('WJ_GetLinkedUIName')]还在内堂照料，案上的经卷没有打开，大家谈的多是路上的见闻和各地的近况。\n\n正式的议论还没开始。我找了个位置坐下，先听一听这里的人都在关心什么。"
 WJ_qingyi.0001.a:0 "且待诸贤毕至。"

 # ---------------------------------------------------------------- 0002 主人开席
 WJ_qingyi.0002.t:0 "清议：宾主既集"
 WJ_qingyi.0002.desc:0 "宾客终于到齐，门外的通报声停了。我请众人就座，等最后几句寒暄落下。\n\n“今日在座诸君，不以官爵论高下。有疑便问，有见便说。”\n\n这样的话每次清议都要说一遍，可真正做到的并不多。第一个论题由谁提出，往往决定了这几日的风气。"
 WJ_qingyi.0002.desc.yuedan:0 "宾客终于到齐。我请众人就座，没有急着出题，而是先把话说在前面：\n\n“今日先论时事，再品人物。诸君这几日所言，最后都要落到几个名字上。月旦一出，便是公论，望诸君慎言，也望诸君直言。”\n\n席间安静了一会儿，接着响起一阵低语。"
 WJ_qingyi.0002.desc.learning:0 "宾客终于到齐。我请众人就座，开门见山地说，今日邀诸君前来，是想借诸位之长补我之短。\n\n“经义有不明处，时务有不通处，在座诸君但讲无妨，我洗耳恭听。”\n\n主人自居后学，客人们反倒拘谨了片刻。好在很快就有人接过了话头。"
 WJ_qingyi.0002.a:0 "由我先出一题。"
 WJ_qingyi.0002.b:0 "请[wj_qingyi_opening_guest.Custom('WJ_GetUIName')]先开题。"

 # ---------------------------------------------------------------- 0003 宾客入席
 WJ_qingyi.0003.t:0 "清议：入席论道"
 WJ_qingyi.0003.desc:0 "主人[host.Custom('WJ_GetLinkedUIName')]请众人就座，宣布清议开始。席间不论官爵，有疑可问，有见可陈。\n\n我在自己的位置上坐定。同席的人里，有的我早闻其名，有的今天才第一次见。这几日的议论会是什么样子，现在还说不准。\n\n来之前我想好了此行要做什么，此刻该开始了。"
 WJ_qingyi.0003.a:0 "依礼入座，静听开题。"
 WJ_qingyi.0003.b:0 "先向主人执礼请教。"
 WJ_qingyi.0003.c:0 "寻一处清静的位置坐下。"

 # ---------------------------------------------------------------- 1001 清虚发端
 WJ_qingyi.1001.t:0 "清虚发端"
 WJ_qingyi.1001.desc:0 "我刚提出今日的论题，[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]便接口问道：“万物因有而见其用。那么器中之空，算不算用？”\n\n几个客人不约而同地看向案上的空杯。这个问题看似玩笑，实则是有无之辨的老题目。答得好，今日的议论便有了根基；答得不好，主人的分量就轻了。"
 WJ_qingyi.1001.a:0 "以玄理作答：有之以为利，无之以为用。"
 WJ_qingyi.1001.a.success:0 "义理贯通，满座首肯"
 WJ_qingyi.1001.a.failure:0 "言辞游移，反被追问"
 WJ_qingyi.1001.b:0 "以实事验之：空杯能盛水，空仓能积粟。"
 WJ_qingyi.1001.b.success:0 "以小见大，众人称妙"
 WJ_qingyi.1001.b.failure:0 "譬喻失当，未能服人"
 WJ_qingyi.1001.c:0 "请在座诸君各陈所见。"

 # ---------------------------------------------------------------- 1002 折角之问
 WJ_qingyi.1002.t:0 "折角之问"
 WJ_qingyi.1002.desc:0 "[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]听完我的开题，没有接着往下谈，而是挑出其中一句，当席反问：照主人这么说，岂不是自相矛盾？\n\n这一问来得很快，也很准。在座的人都放下了杯子。对方显然是有备而来，未必是要为难我，但无论如何，这一问必须回答。"
 WJ_qingyi.1002.a:0 "正面驳回去"
 WJ_qingyi.1002.a.success:0 "层层剖析，对方折服"
 WJ_qingyi.1002.a.failure:0 "被对方抓住破绽"
 WJ_qingyi.1002.b:0 "笑着把话头转开"
 WJ_qingyi.1002.b.success:0 "举重若轻，席间一笑"
 WJ_qingyi.1002.b.failure:0 "显得有些勉强"
 WJ_qingyi.1002.c:0 "“客人未免失礼。”"

 # ---------------------------------------------------------------- 1003 经义与时务
 WJ_qingyi.1003.t:0 "经义与时务"
 WJ_qingyi.1003.desc:0 "席上学问最深的[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]由《春秋》讲到近年州郡的赋役，说经义若不能用于当世，读得再熟也是空文。\n\n这话说得有理，可其中有几处引证，我觉得并不妥当。是当场商榷，还是借机向对方请教？"
 WJ_qingyi.1003.a:0 "引经断事，与之商榷"
 WJ_qingyi.1003.a.success:0 "引证精当，对方叹服"
 WJ_qingyi.1003.a.failure:0 "反被对方纠正"
 WJ_qingyi.1003.b:0 "虚心求教"
 WJ_qingyi.1003.c:0 "经义时务，各有所长，不必分出高下"

 # ---------------------------------------------------------------- 1004 一言之鉴
 WJ_qingyi.1004.t:0 "一言之鉴"
 WJ_qingyi.1004.desc:0 "特邀的名士[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]一直很少开口，此刻却放下茶盏，对我说了一句评语。话不长，却说中了我平日不愿承认的地方。\n\n满座都在看我怎样回应。"
 WJ_qingyi.1004.desc.yuedan:0 "特邀的名士[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]一直很少开口。议论到名单上的[wj_qingyi_subject.Custom('WJ_GetLinkedUIName')]时，此人放下茶盏，只说了一句评语，满座随即安静下来。\n\n名士之言分量极重。我身为评主，附和还是反驳，都会影响众人对此人的看法。"
 WJ_qingyi.1004.a:0 "拜受其言"
 WJ_qingyi.1004.b:0 "与之论辩"
 WJ_qingyi.1004.b.success:0 "往复数番，平分秋色"
 WJ_qingyi.1004.b.failure:0 "辩之不胜，徒显浅薄"
 WJ_qingyi.1004.c:0 "附议名士之评"
 WJ_qingyi.1004.d:0 "当席驳之"
 WJ_qingyi.1004.d.success:0 "驳得有理有据"
 WJ_qingyi.1004.d.failure:0 "反被名士问住"
 WJ_qingyi.1004.e:0 "一笑置之"

 # ---------------------------------------------------------------- 1005 席间月旦
 WJ_qingyi.1005.t:0 "席间月旦"
 WJ_qingyi.1005.desc:0 "议论转到了人物身上。有人提起[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]近来的作为，随即有人附和，也有人摇头。\n\n众人渐渐都看向我，等主人说一句。当着本人的面品评，褒贬都要掂量分寸。"
 WJ_qingyi.1005.desc.yuedan:0 "议论转到名单上的[wj_qingyi_subject.Custom('WJ_GetLinkedUIName')]。有人举其旧事称道，有人说其近来所为未必如传闻那样好。\n\n[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]请我这个评主先下一句断语。主人的话，众人投票时多少会记在心里。"
 WJ_qingyi.1005.a:0 "褒其所长"
 WJ_qingyi.1005.b:0 "直指其短"
 WJ_qingyi.1005.b.success:0 "所言中肯，无人能驳"
 WJ_qingyi.1005.b.failure:0 "言语伤人，结下嫌隙"
 WJ_qingyi.1005.c:0 "称许此人"
 WJ_qingyi.1005.d:0 "贬抑此人"
 WJ_qingyi.1005.d.success:0 "论据充分，众人信服"
 WJ_qingyi.1005.d.failure:0 "空口贬人，反失公允"
 WJ_qingyi.1005.e:0 "存而不论"

 # ---------------------------------------------------------------- 1006 酒至微醺
 WJ_qingyi.1006.t:0 "酒至微醺"
 WJ_qingyi.1006.desc.wine:0 "酒过数巡，席间说话的声音大了起来。[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]举杯来敬，说清议说到这一步，也该放下几分拘束了。\n\n酒能让人说真话，也能让人说错话。主人喝到什么程度，客人们都看着。"
 WJ_qingyi.1006.desc.tea:0 "茶换了几道，议论也缓了下来。[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]端着茶盏过来，说几日争论下来，难得有这样的清闲。\n\n席间的气氛松了，正是说些平日不便说的话的时候。"
 WJ_qingyi.1006.a:0 "举杯同乐"
 WJ_qingyi.1006.b:0 "守礼节饮"
 WJ_qingyi.1006.c:0 "借着酒兴品评几个人"
 WJ_qingyi.1006.c.success:0 "妙语连珠，满座称快"
 WJ_qingyi.1006.c.failure:0 "失言于众"

 # ---------------------------------------------------------------- 1007 竹下忘年
 WJ_qingyi.1007.t:0 "竹下忘年"
 WJ_qingyi.1007.desc:0 "散席后，[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]没有走，和我一起坐在院中竹下。没有旁人，说的话也随意了：从年少读书的事，说到这些年各自的经历。\n\n不知不觉夜深了。主客之分，此刻似乎已经不重要。"
 WJ_qingyi.1007.a:0 "引为知交"
 WJ_qingyi.1007.b:0 "以家藏书卷相赠"
 WJ_qingyi.1007.c:0 "只作一夕之谈"

 # ---------------------------------------------------------------- 1008 清议之外
 WJ_qingyi.1008.t:0 "清议之外"
 WJ_qingyi.1008.desc:0 "[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]等众人散去才来找我，先说了几句客套话，然后话锋一转，请我在某件事上行个方便，又说备了一份薄礼。\n\n清议之名本是清流所重，席后的请托却从来没有少过。"
 WJ_qingyi.1008.desc.yuedan:0 "[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]等众人散去才来找我。寒暄几句之后，对方压低声音，说名单上的[wj_qingyi_subject.Custom('WJ_GetLinkedUIName')]是难得的人才，望评主在众人面前多说几句好话，又说备了一份薄礼。\n\n月旦评一旦掺进私情，就不再是公论了。"
 WJ_qingyi.1008.a:0 "收下馈赠"
 WJ_qingyi.1008.b:0 "当众拒绝"
 WJ_qingyi.1008.c:0 "虚与委蛇，留个人情"

 # ---------------------------------------------------------------- 2001 名教与自然
 WJ_qingyi.2001.t:0 "名教与自然"
 WJ_qingyi.2001.desc:0 "主人[host.Custom('WJ_GetLinkedUIName')]忽然点到我，问：礼法名教，是出于人的本性，还是圣人为了治世才定下的？\n\n这是近来士林争论最多的题目之一，在座不少人都有成见。主人特意问我，大概是想听一个不一样的说法。"
 WJ_qingyi.2001.a:0 "名教出于自然"
 WJ_qingyi.2001.a.success:0 "说理圆融，主人颔首"
 WJ_qingyi.2001.a.failure:0 "言不及义"
 WJ_qingyi.2001.b:0 "名教所以治世"
 WJ_qingyi.2001.b.success:0 "切中时弊"
 WJ_qingyi.2001.b.failure:0 "举例不当"
 WJ_qingyi.2001.c:0 "请主人先言"

 # ---------------------------------------------------------------- 2002 众目相逼
 WJ_qingyi.2002.t:0 "众目相逼"
 WJ_qingyi.2002.desc:0 "我刚说完自己的看法，[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]便站起来，一条一条地驳，语气越来越重，最后干脆问我到底读没读过原书。\n\n满座的目光都转到我身上。这时候退一步，以后在这些人面前就很难再开口了。"
 WJ_qingyi.2002.a:0 "以学问应之"
 WJ_qingyi.2002.a.success:0 "引据详明，对方无言"
 WJ_qingyi.2002.a.failure:0 "被问得哑口无言"
 WJ_qingyi.2002.b:0 "以辞令化之"
 WJ_qingyi.2002.b.success:0 "一句玩笑化解僵局"
 WJ_qingyi.2002.b.failure:0 "未能平息"
 WJ_qingyi.2002.c:0 "反问其所短"
 WJ_qingyi.2002.c.success:0 "反将一军"
 WJ_qingyi.2002.c.failure:0 "弄巧成拙"

 # ---------------------------------------------------------------- 2003 执经请益
 WJ_qingyi.2003.t:0 "执经请益"
 WJ_qingyi.2003.desc:0 "我带来的那卷书里，有几处一直没读明白。今日在座学问最深的是[wj_qingyi_luminary.Custom('WJ_GetLinkedUIName')]，机会难得。\n\n只是当众请教，难免显出自己的不足。"
 WJ_qingyi.2003.a:0 "当面请益"
 WJ_qingyi.2003.a.success:0 "疑处顿解"
 WJ_qingyi.2003.a.failure:0 "所问未得要领"
 WJ_qingyi.2003.b:0 "抄录其说，回去细读"
 WJ_qingyi.2003.c:0 "留待改日"

 # ---------------------------------------------------------------- 2004 名士一顾
 WJ_qingyi.2004.t:0 "名士一顾"
 WJ_qingyi.2004.desc:0 "特邀的名士[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]听完我的一番话，转头多看了我一眼，说了一句：“此君可与言。”\n\n这句话不长，在座的人却都听见了。名士一顾，往往比十篇文章更能让人记住一个名字。"
 WJ_qingyi.2004.a:0 "欣然领受"
 WJ_qingyi.2004.b:0 "谦辞不敢当"
 WJ_qingyi.2004.c:0 "趁势一展所学"
 WJ_qingyi.2004.c.success:0 "名士击节称赏"
 WJ_qingyi.2004.c.failure:0 "画蛇添足"

 # ---------------------------------------------------------------- 2005 谁为上品
 WJ_qingyi.2005.t:0 "谁为上品"
 WJ_qingyi.2005.desc:0 "不知是谁先起的头，席间议论起在座诸人的高下。[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]半开玩笑地说，以今日的表现，我和对方谁更胜一筹，不妨请大家评一评。\n\n玩笑归玩笑，众人是真的在等着看。"
 WJ_qingyi.2005.desc.yuedan:0 "众人正在争论名单上的[wj_qingyi_subject.Custom('WJ_GetLinkedUIName')]。[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]说得最起劲，转头问我怎么看。\n\n我一个人的话左右不了计票，但说得有力，总能让几个人改变主意。"
 WJ_qingyi.2005.a:0 "推对方为上"
 WJ_qingyi.2005.b:0 "自陈所长"
 WJ_qingyi.2005.b.success:0 "言之成理"
 WJ_qingyi.2005.b.failure:0 "自夸太过"
 WJ_qingyi.2005.c:0 "力挺此人"
 WJ_qingyi.2005.c.success:0 "说动了几位宾客"
 WJ_qingyi.2005.c.failure:0 "无人附和"
 WJ_qingyi.2005.d:0 "力贬此人"
 WJ_qingyi.2005.d.success:0 "所言切中要害"
 WJ_qingyi.2005.d.failure:0 "被斥为挟私"
 WJ_qingyi.2005.e:0 "不与人争"

 # ---------------------------------------------------------------- 2006 杯中任达
 WJ_qingyi.2006.t:0 "杯中任达"
 WJ_qingyi.2006.desc.wine:0 "酒越喝越多，有人解了衣带，有人击案而歌。[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]把一大杯酒推到我面前，说清谈之士，何必拘于俗礼。\n\n放达是名士风度，失态也是。分寸全在自己。"
 WJ_qingyi.2006.desc.tea:0 "席间只有茶，众人却也谈得兴起。[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]把坐席挪近，说难得遇上谈得来的人，今晚不必早散。\n\n这样的时候，是放开胸怀还是守着规矩，全看自己。"
 WJ_qingyi.2006.a:0 "放怀任达"
 WJ_qingyi.2006.b:0 "持杯自守"
 WJ_qingyi.2006.c:0 "与邻座对饮"

 # ---------------------------------------------------------------- 2007 抵掌而谈
 WJ_qingyi.2007.t:0 "抵掌而谈"
 WJ_qingyi.2007.desc:0 "散席后，[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]拉住我继续谈。说到投机处，对方抵掌大笑，说这几日见了这么多人，难得有一个想法与自己这样相近。\n\n萍水相逢，能否成为长久的交情，就看今晚了。"
 WJ_qingyi.2007.a:0 "引为同道"
 WJ_qingyi.2007.b:0 "以财物相赠"
 WJ_qingyi.2007.c:0 "点到为止"

 # ---------------------------------------------------------------- 2008 帷幕后语
 WJ_qingyi.2008.t:0 "帷幕后语"
 WJ_qingyi.2008.desc:0 "分坐说话时，[wj_qingyi_partner.Custom('WJ_GetLinkedUIName')]一句无心之言，露出了一件旧事的端倪。对方发觉我听出来了，立刻压低了声音，脸色也变了。\n\n这件事主人恐怕还不知道。我是装作没听见，还是另作打算？"
 WJ_qingyi.2008.a:0 "此事应当告知主人"
 WJ_qingyi.2008.b:0 "记在心里，不惊动旁人"
 WJ_qingyi.2008.c:0 "守口如瓶，总该有些代价"

 # ---------------------------------------------------------------- 2011 补：月旦评版本
 WJ_qingyi.2011.desc.yuedan:0 "主人[host.Custom('WJ_GetLinkedUIName')]忽然转向我，问我对名单上的[wj_qingyi_subject.Custom('WJ_GetLinkedUIName')]有什么看法。\n\n席间安静下来。月旦评正在进行，我这一句话，或许就会改变几个人手中的票。"

 # ---------------------------------------------------------------- 9001 / 9002 散席
 WJ_qingyi.9001.t:0 "品题散席"
 WJ_qingyi.9001.desc:0 "宾客们陆续整衣起身，这几日的议论终于告一段落。侍者开始收拾坐席，我还要以主人的身份说最后几句话。\n\n这一场清议留下什么，传出去的是哪几句话，多少取决于我此刻怎样收尾。"
 WJ_qingyi.9001.desc.yuedan:0 "宾客们陆续整衣起身。这一场清议，人们记得最清楚的，大概是[wj_qingyi_yd_winner.Custom('WJ_GetLinkedUIName')]被推为第一时满座的反应。\n\n月旦评的结果不久就会传遍各地。评主是我，这个名字也会和我的名字一起被人提起。最后几句话，我还要想想怎么说。"
 WJ_qingyi.9001.a:0 "录诸贤之言，传于士林"
 WJ_qingyi.9001.b:0 "亲送宾客出门"
 WJ_qingyi.9001.c:0 "择其可用之才，荐之于朝"
 WJ_qingyi.9002.t:0 "余音在耳"
 WJ_qingyi.9002.desc:0 "清议将散，我随众人起身，这才觉得坐了太久，腿脚有些发僵。廊外的风迎面吹来，这几日争论得最热烈的几句话还在耳边。\n\n此行收获了什么，要等回去之后才能慢慢想明白。"
 WJ_qingyi.9002.desc.yuedan:0 "清议将散，众人还在谈论[wj_qingyi_yd_winner.Custom('WJ_GetLinkedUIName')]当选一事，有人心服，有人不以为然。\n\n这次月旦评我也投了票。不管结果如何，日后有人说起这一场品评，我也算是在场的人。"
 WJ_qingyi.9002.a:0 "记下所学"
 WJ_qingyi.9002.b:0 "向主人致谢"
 WJ_qingyi.9002.c:0 "一身轻快地离开"

