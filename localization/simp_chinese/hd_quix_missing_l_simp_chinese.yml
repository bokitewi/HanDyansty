l_simp_chinese:
 quix_murder_outcome.4018.exposed_scheme:0 "\n\n不巧你一转身，一头撞在了房梁上！你被撞得眼冒金星，坐在地上发愣。[target.GetName]在榻上坐起，难以置信地瞪着你，你们四目相对了好一阵，直到外头传来杂乱的脚步声，你才回过神来，跌跌撞撞地翻窗而逃。那一眼，[target.GetSheHe]已认清了你的脸。对方放出猎犬追你，你只好在泥沼里躲了一夜！"
 quix_seduce_outcome.2010.b:0 "痛快淋漓，一夜足矣。"
 quix_seduce_outcome.2301.a.tt:0 "自此以后，那处宅子便常有人夜访了。"
 quix_seduce_outcome.3301.a.tt:0 "自此以后，那处宅子的灯火常常亮到天明。"
 quix_seduce_outcome.2030.a.desc:0 "你与[target.GetTitledFirstName]都清楚彼此想要什么，再试探下去已毫无意义。心腹替你们寻了一处无人打扰的所在。"
 quix_seduce_outcome.2030.alcohol.desc:0 "几杯酒下肚，你们愈发没了顾忌。"
 quix_seduce_outcome.2030.b.desc:0 "\n\n你刚要开口剖白，[target.GetFirstName]便伸出一指按住了你的唇。此后的相会炽热而直截，谁也没再提什么承诺。"
 quix_seduce_outcome.2302.desc_court_owner:0 "你与[target.GetTitledFirstName]相隔太远，总寻不到机会。于是你托言出门祭祀名山，一路改换行装，混进了[target.GetTitledFirstNamePossessive]的府邸，藏身在仆役住的偏舍里。"
 quix_seduce_outcome.2302.desc_end:0 "\n\n你们趁夜说了半宿的话，谁也没有点破来意。可各自散去之后，[target.GetFirstName]又悄悄摸到了你的床边。"
 quix_seduce_outcome.2302.desc_not_court_owner:0 "你与[target.GetTitledFirstName]相隔太远，总寻不到机会。于是你托言出门祭祀名山，一路打听到[target.GetSheHe]寄居的府邸，扮作仆役混了进去，藏身在偏舍里。"
 quix_seduce_outcome.3023.b:0 "今夜之事，留在此间。"
 quix_seduce_outcome.3030.a.desc:0 "你与[owner.GetTitledFirstName]都清楚彼此想要什么，再试探下去已毫无意义。心腹替你们寻了一处无人打扰的所在。"
 quix_seduce_outcome.3030.alcohol.desc:0 "几杯酒下肚，你们脸上都泛起了红晕。"
 quix_seduce_outcome.3030.b.desc:0 "\n\n[owner.GetSheHe|U]刚要开口剖白，你便伸出一指按住了[owner.GetHerHis]的唇。此后的相会炽热而直截，谁也没再提什么承诺。"
 quix_seduce_outcome.3031.a.desc:0 "宴席上人来人往，你与[owner.GetTitledFirstName]始终说不上几句体己话。[owner.GetSheHe|U]忽然凑到你耳边，低声提议一同离开。"
 quix_seduce_outcome.3031.alcohol.desc:0 "你借着几分酒意，想也没想便点了头。"
 quix_seduce_outcome.3031.b.desc:0 "\n\n你们趁人不备溜出了宴席。远离众人之后，你才承认，自己整晚都在寻这样一个机会。你们终于不必再遮遮掩掩。"
 quix_seduce_outcome.3302.desc_court_owner:0 "这一回，[owner.GetSheHe]竟托言出门祭祀，一路改换行装，混进了你的府中，藏身在仆役住的偏舍里。"
 quix_seduce_outcome.3302.desc_end:0 "\n\n你们趁夜说了半宿的话，谁也没有点破来意。可各自散去之后，你又改了主意，悄悄摸到了[owner.GetFirstName]的床边。"
 quix_seduce_outcome.3302.desc_not_court_owner:0 "这一回，[owner.GetSheHe]竟托言出门祭祀，一路打听到你寄居的府邸，扮作仆役混了进来。"
 quix_seduce_outcome.3302.desc_opening:0 "[owner.GetTitledFirstName]一向对你有意，只是你们相隔太远。"
