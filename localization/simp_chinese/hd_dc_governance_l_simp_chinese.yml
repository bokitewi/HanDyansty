l_simp_chinese:
 hd_dc_review_governance_decision: "核定危机善后"
 hd_dc_review_governance_decision_desc: "战报不再催促，先前写下的承诺却仍要逐条核验。把哪一桩旧案在此时封卷，关系到朝廷能否等来更长久的安定。"
 hd_dc_review_governance_decision_tooltip: "查看一桩可以最终结算的危机，选择结案或继续观察"
 hd_dc_review_governance_decision_confirm: "呈上已核验的案卷"
 hd_dc_governance_review_ready_tt: "至少有一桩政治结果已经确定、核心战争真实结束、没有待决行动或义务且已完成核验的危机，治理值达到20，或存在经核验的重大未纠正毁约。"
 hd_dc_gov.0001.t: "这一卷何时封存"
 hd_dc_gov.0001.desc: "案吏把已经核过的条目逐一指出，又把尚需时间证明的部分留在旁边。胜负是一回事，百姓是否能安居、许下的话是否真的做到，是另一回事。\n\n这桩危机的案号是[hd_dc_governance_instance.Var('hd_dc_instance_id').GetValue|0]，实际治理值为[hd_dc_governance_instance.Var('hd_dc_q').GetValue|0]。此时封卷，便按现在的真实成果最终入账；再等一等，也许能证明这份安定经得起年月。"
 hd_dc_gov.0001.a: "按眼下已经做到的事结案。"
 hd_dc_gov.0001.a.tt: "最终只结算一次：重大未纠正毁约优先，危世+10、繁盛不变；否则治理值≥60且完整履约连续5年，危世−35、繁盛+30；治理值≥40且实际稳定连续3年，危世−20、繁盛+15；治理值≥20且核心战争结束，危世−10、繁盛+5。削藩保位若仅有镇压战果，最多按低档结算；等待本身不能代替军权与俸禄改革。结案后不能再领取更高档。"
 hd_dc_gov.0001.b: "继续观察，不急于封卷。"
 hd_dc_gov.0001.b.tt: "保留本案，暂不结算。最高档真实达标后自动结算；新的相关战争或未完成义务会中断连续稳定计时。不会因等待善后而继续占用已经解除的急性危机名额。"
 hd_dc_gov.0002.t: "封卷之后"
 hd_dc_gov.0002.high: "五年间，停战有迹可查，承诺也已逐项兑现。案吏在最后一页写下结语，将新旧文书合在一处。\n\n此案的最高治理终奖已入账：危世−35，繁盛+30。政治上的胜负另据实际局势记载，不因这份评定改写。"
 hd_dc_gov.0002.medium: "三年的安定终于有了足够的记录。还有未能做到尽善的地方，但已经实行的停兵与安全安排不该被抹去。\n\n此案的有效稳定终奖已入账：危世−20，繁盛+15。本案不再重复领奖。"
 hd_dc_gov.0002.low: "战事已经真正结束，已落实的善后也有据可查。此时结案，记下的是有限的缓和，尚不能断言长久太平。\n\n此案的有限缓和终奖已入账：危世−10，繁盛+5。本案不再重复领奖。"
 hd_dc_gov.0002.breach: "账上仍有一项重大的失约，没有被后来发生的死亡、继位或胜负抹去，也没有得到实际纠正。案卷不能只留下好看的部分。\n\n此案最终按重大未纠正毁约入账：危世+10，繁盛不变。不会同时发放正向治理奖励。"
 hd_dc_gov.0002.a: "据实存档。"
