l_simp_chinese:
 building_type_TK_HD_TaiXue: "国立大学"
 building_type_TK_HD_TaiXue_desc: "天子所立的学宫，博士以经术教授诸生，天下士人皆以入太学受业为荣。"
 TK_HD_TaiXue: "太学"
 building_TK_HD_TaiXue: "$TK_HD_TaiXue$"
 building_TK_HD_TaiXue_desc: "天子立于京师的学宫。孝武皇帝时始置五经博士，教授弟子，通经者得补郎吏；此后学舍屡有增筑，四方负笈而来的诸生云集于此。太学生讲论经义、品评人物，清议之风由此而盛。"
 hd_taixue_student_modifier: "太学受业"
 hd_taixue_student_modifier_desc: "该角色的尊长主持太学，使其得以随博士与诸生一同受业。"
 hd_build_taixue_luoyang_decision: "兴办太学（洛阳）"
 hd_build_taixue_luoyang_decision_desc: "天下之治，本于教化。洛阳为天子所居、四方士子仰望之地，我欲在城东择地广起学舍，延请经师，置博士弟子，使负笈而来的士子有所归依。"
 hd_build_taixue_luoyang_decision_tooltip: "于洛阳以东兴建太学，延聘经师，广收诸生。"
 hd_build_taixue_changan_decision: "兴办太学（长安）"
 hd_build_taixue_changan_decision_desc: "长安是高帝定鼎之地，孝武皇帝也在此初立太学，可惜旧日的弦诵之声早已不闻。我欲在此重起学舍，延请经师，使关中子弟也能就近受业。"
 hd_build_taixue_changan_decision_tooltip: "于长安重建太学，延聘经师，广收诸生。"
 hd_build_taixue_decision_confirm: "兴学育才！"
