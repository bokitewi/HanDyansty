l_simp_chinese:
 hd_youzhou_tuqi:0 "幽州突骑"
 hd_youzhou_tuqi_flavor:0 "#F 幽州边郡的骑士久经塞上战事，善于疾驰突击。#!"
 hd_establish_youzhou_tuqi_decision:0 "建立幽州突骑军制"
 hd_establish_youzhou_tuqi_decision_desc:0 "幽州边郡的骑士久经塞上战事，善于疾驰突击。\n\n我可以整顿幽州的军籍，建立幽州突骑军制。军制建立后，只要兵源充足，便可自行招募和扩编。"
 hd_establish_youzhou_tuqi_decision_tooltip:0 "建立幽州突骑军制。需要幽州至少24个有效伯爵领；控制力不低于50，异文化地区的文化接受度高于20。失去兵源只会暂停招募和扩编，不会解散现有军团。"
 hd_establish_youzhou_tuqi_decision_confirm:0 "支付150金币和300威望建立军制；本决议不会直接获得军团。"
 hd_establish_youzhou_tuqi_decision_effect:0 "建立幽州突骑军制。兵源充足时可招募和扩编该兵种。"
 hd_maa_source.0001.t:0 "幽州突骑兵源断绝"
 hd_maa_source.0001.desc:0 "我已无法从幽州征调骑士与马户。现有幽州突骑仍会效命，但在恢复兵源前不能招募或扩编。"
 hd_maa_source.0001.a:0 "现有军士仍可维持。"
 hd_maa_source.0002.t:0 "幽州突骑兵源恢复"
 hd_maa_source.0002.desc:0 "我再次控制了足够的幽州兵源，幽州突骑的招募和扩编已经恢复。"
 hd_maa_source.0002.a:0 "我可再次征募他们。"
