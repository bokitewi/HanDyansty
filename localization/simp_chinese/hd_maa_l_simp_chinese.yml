l_simp_chinese:
 hd_youzhou_tuqi:0 "幽州突骑"
 hd_youzhou_tuqi_flavor:0 "#F 幽州近塞，民生鞍马之间，骁勇善冲。光武帝当年发渔阳、上谷突骑平定河北，自此天下论及精骑，必先推幽州。#!"
 hd_maa_source.0001.t:0 "幽州募骑中辍"
 hd_maa_source.0001.desc:0 "幽州传来的消息让你沉默良久。那里的郡县，如今或已不在你的掌握之中，或是乱后人心未定，你派去募骑的使者走遍乡里，应者寥寥。\n\n已编入军中的突骑仍在你的旗下听令，只是往后再想添募，一时无处征发。塞上的好马与骑手都还在那里，却已不再为你所用。"
 hd_maa_source.0001.a:0 "且恃现有之骑。"
 hd_maa_source.0002.t:0 "幽州复可募骑"
 hd_maa_source.0002.desc:0 "幽州诸县重归安定，郡中豪杰也肯应你的征召了。消息传来时，帐下几名老骑卒相顾而笑，说家乡的子弟又能来投军了。\n\n新骑不会自己赶到营前，招募与扩编都还要另拨钱粮。但只要你舍得花这笔钱，幽州的突骑便又能源源而来。"
 hd_maa_source.0002.a:0 "幽燕突骑，复为我用。"
 hd_baima_yicong:0 "白马义从"
 hd_baima_yicong_flavor:0 "#F 右北平地当塞下，郡中善射之士结为义从，人人乘白马，挟弓而驰。白马成群奔突之时，塞外诸胡远远望见，便知不可轻犯。#!"
 hd_gongsun_baima_event_army:0 "公孙瓒白马义从"
 hd_maa_source.0003.t:0 "白马不复北来"
 hd_maa_source.0003.desc:0 "右北平的使者跪在阶下，说郡中已无人应募。那片边郡如今或不在你的治下，或是兵乱之后人心离散，善射的子弟或避乱远走，或另投他主。\n\n营中的白马义从仍听你号令，旗上的白马也还鲜亮。只是想再添新骑，须等右北平重归你的掌握。"
 hd_maa_source.0003.a:0 "白马之名，且由旧部守之。"
 hd_maa_source.0004.t:0 "白马复聚"
 hd_maa_source.0004.desc:0 "右北平重新安定下来，郡中善射之士又陆续前来投效。听说有人牵着自家的白马，在营门外等了整整一日。\n\n要把他们编成义从，仍须另备鞍马、甲械与粮饷。但这支白马骑军，终于不必只靠那些老卒撑着名号了。"
 hd_maa_source.0004.a:0 "可再招募义从。"
 hd_wuhuan_qicong:0 "乌桓骑从"
 hd_wuhuan_qicong_flavor:0 "#F 乌桓人逐水草而居，男子自幼能骑善射。汉家常募其部众为骑从，随军征伐四方，来去迅疾，最长于袭扰与追亡逐北。#!"
 hd_maa_source.0005.t:0 "乌桓诸部离散"
 hd_maa_source.0005.desc:0 "北边的乌桓部落不再应你的征发了。上谷、渔阳至辽东一带，或已不在你的掌握之中，或是诸部离心，你派去的使者带回来的只有推托之辞。\n\n已经随你征战的乌桓骑从仍在军中，骑射如故。可这样的骑手是从小在马背上长大的，步营里换一面旗，凑不出一个来。"
 hd_maa_source.0005.a:0 "暂缓增募，以待其归。"
 hd_maa_source.0006.t:0 "乌桓复附"
 hd_maa_source.0006.desc:0 "乌桓诸部的大人遣使来见，表示愿意再为你出骑从。使者说话直截：只要粮饷给足，部中子弟随时可以上马。\n\n骑从尚未到营，招募与扩编仍须另拨钱粮。但北边这条骑兵的来路，已经重新通了。"
 hd_maa_source.0006.a:0 "乌桓之骑，复可征发。"
 hd_jizhou_qiangnu:0 "冀州强弩"
 hd_jizhou_qiangnu_flavor:0 "#F 冀州材官习于蹶张，所用皆是须以足踏开的强弩。弩手分列轮发，矢如飞蝗，纵是披甲冲阵之士，也难近前。#!"
 hd_maa_source.0007.t:0 "冀州弩手难募"
 hd_maa_source.0007.desc:0 "冀州诸郡的募兵文书被原样退了回来。那一带或已不在你的治下，或是兵乱之后户口流散，懂得蹶张开弩的壮丁，一时找不出几个。\n\n弩机还可以叫匠人去造，射弩的人却不能凭空添上。已经成军的冀州弩手仍可调遣，往后布阵，你只能按手头这些人来算了。"
 hd_maa_source.0007.a:0 "按现有弩手布阵。"
 hd_maa_source.0008.t:0 "冀州弩手复集"
 hd_maa_source.0008.desc:0 "冀州诸郡渐复旧观，郡吏报说，乡里习弩的材官又肯应募了。你想起先前因缺人而搁下的那几幅阵图。\n\n弩机、矢箙与粮饷都要另花钱筹办，新弩手不会自己列到阵前。但这一次，至少不必再听人说「有械无人」了。"
 hd_maa_source.0008.a:0 "可再筹募弩手。"
 hd_xiandeng_ruishi:0 "先登锐士"
 hd_xiandeng_ruishi_flavor:0 "#F 攻城陷阵，必有先登。冀州锐士披坚执盾，冒矢石争登城头、抢入敌阵，以首登之功博取封赏。#!"
 hd_maa_source.0009.t:0 "先登无人"
 hd_maa_source.0009.desc:0 "冀州传来的消息说，先登锐士已经选募不成了。清河、巨鹿一带或已易手，或是人心未定，肯冒矢石争登城头的敢死之士，再也募不到了。\n\n营中现有的锐士仍听你调遣。只是往后攻城陷阵，打头阵的人只能从现有的几营里挑选。"
 hd_maa_source.0009.a:0 "先登之士，暂不增募。"
 hd_maa_source.0010.t:0 "先登复募"
 hd_maa_source.0010.desc:0 "冀州诸郡重归安定，乡里那些不甘贫贱、想凭战功出头的年轻人，又开始打听你的募兵告示了。\n\n甲械与赏钱仍须另备，新营也非一日可成。但下一次有人问谁来先登，你不必只看着现有的几营人发愁了。"
 hd_maa_source.0010.a:0 "再选敢战之士。"
 hd_qingzhou_bing:0 "青州兵"
 hd_qingzhou_bing_flavor:0 "#F 青州滨海，民风剽悍，每逢乱世便聚众自保。其众勇于搏战而难于约束，一旦号令严明、编伍得法，便是一支可观的步军。#!"
 hd_maa_source.0011.t:0 "青州兵源告竭"
 hd_maa_source.0011.desc:0 "青州的募兵使者空手而回。齐国、北海一带或已不在你的掌握之中，或是兵乱之后流民四散，原想再编入营的那一批壮丁，已无从找起。\n\n已经成军的青州兵仍听你号令。可军籍上多写一个数，营中也不会因此多站一个人；往后用兵，只能按现有的人马筹划了。"
 hd_maa_source.0011.a:0 "军额从实，勿虚其数。"
 hd_maa_source.0012.t:0 "青州复可征兵"
 hd_maa_source.0012.desc:0 "青州诸郡重归安定，流散的百姓陆续返乡，郡吏报说又有壮丁可征了。那里的人剽悍好斗，只要号令严明，便是好兵。\n\n新兵还须钱粮来招，甲械来配，不会自己走进营里。但青州这条兵源，终于又通了。"
 hd_maa_source.0012.a:0 "青州之众，复可征发。"
 hd_liujun_liangjiazi:0 "六郡良家子"
 hd_liujun_liangjiazi_flavor:0 "#F 陇西、天水、安定、北地、上郡、西河六郡迫近戎狄，民俗修习战备，崇尚气力，以骑射为先。汉家羽林、期门多选于此，名将亦多出其间。#!"
 hd_maa_source.0013.t:0 "六郡子弟不至"
 hd_maa_source.0013.desc:0 "陇西、北地诸郡的消息传来，良家子弟已不再应你的征召。那一带或已易手，或是羌乱未息、乡里残破，骑射出众的少年，大多另有去处了。\n\n营中现有的六郡骑士仍然听令，只是再想扩编，一时无从着手。善骑之士从来不是招呼一声便有的，这句老话，今日落到了你自己头上。"
 hd_maa_source.0013.a:0 "骑阵暂按旧额。"
 hd_maa_source.0014.t:0 "六郡子弟复来"
 hd_maa_source.0014.desc:0 "六郡重归安定，乡里的良家子又纷纷背弓牵马，来营前应募。有人自称祖上曾入羽林，说起话来颇为自负。\n\n要把他们编成骑阵，仍须另筹马匹与粮饷。但往后再议扩军，六郡又是一条靠得住的来路了。"
 hd_maa_source.0014.a:0 "六郡弓马，复入我籍。"
 hd_huangzhong_yicong:0 "湟中义从"
 hd_huangzhong_yicong_flavor:0 "#F 湟中月氏胡依附汉家，号为义从。他们熟知河湟山川，弓马娴熟，常随汉军征讨诸羌，散开可以侦敌，聚合便能陷阵。#!"
 hd_maa_source.0015.t:0 "湟中义从离散"
 hd_maa_source.0015.desc:0 "金城、湟中一带的义从胡不再应你的征召了。那里或已不在你的掌握之中，或是诸部离心，你派去的使者连部落大人的面都没能见着。\n\n已经随军的义从仍在你麾下，熟知边路，骑射如故。只是图上那些等着有人去探的路，比你原先打算的多出了好几条。"
 hd_maa_source.0015.a:0 "且用现有义从。"
 hd_maa_source.0016.t:0 "湟中复遣义从"
 hd_maa_source.0016.desc:0 "湟中诸部重新归附，部落大人遣子弟前来，愿为你出骑从。这些人认得河湟的每一条山谷，说起羌人的去向，比斥候还要清楚。\n\n招集他们仍要花一笔钱粮，新骑也须编练才能成军。但边路上缺人的日子，总算可以结束了。"
 hd_maa_source.0016.a:0 "湟中义从，可再招集。"
 hd_bandun_congbing:0 "板楯賨兵"
 hd_bandun_congbing_flavor:0 "#F 巴郡板楯蛮以木板为楯，天性劲勇，阵前好为歌舞。高祖当年用之还定三秦；汉世羌人屡犯汉川，也多赖其兵击退，号为神兵。#!"
 hd_maa_source.0017.t:0 "巴郡賨人不应"
 hd_maa_source.0017.desc:0 "巴郡的募兵使者回来了，身后没有带来一个賨人。那一带或已易手，或是诸部离心，板楯诸姓的首领都推说部中无人可出。\n\n营中现有的板楯賨兵仍听你调遣。只是往后那些山路险道上的差遣，只能交给手里这几营人了。"
 hd_maa_source.0017.a:0 "且用现有板楯之兵。"
 hd_maa_source.0018.t:0 "賨人复出"
 hd_maa_source.0018.desc:0 "巴郡重归安定，板楯诸姓的首领带着族中子弟前来，在营前击鼓而歌，愿再为你出兵。\n\n盾牌、兵器与粮饷仍须另行筹备。但那些狭路险隘，又有人可以替你去守了。"
 hd_maa_source.0018.a:0 "巴賨劲勇，可再添人。"
 hd_wudang_feijun:0 "无当飞军"
 hd_wudang_feijun_flavor:0 "#F 南中山深林密，诸部劲卒翻山越岭如履平地，弓弩短兵兼习，所当无前，故以飞军相称。大军难以展开的崎岖之地，正是他们接战之所。#!"
 hd_maa_source.0019.t:0 "南中劲卒难征"
 hd_maa_source.0019.desc:0 "南中的消息传来：建宁、牂牁一带或已不在你的掌握之中，或是诸部叛服不定，那些惯走山险的劲卒，已经征不到了。\n\n现有的无当飞军仍听你号令。只是山路不等人，军中缺下的人手，也不能凭飞军的名声补齐。"
 hd_maa_source.0019.a:0 "山地用兵，先量现有之兵。"
 hd_maa_source.0020.t:0 "南中劲卒复至"
 hd_maa_source.0020.desc:0 "南中诸郡重归安定，各部又肯遣出劲卒应你的征召了。使者说，这些人翻山越岭如履平地，弓弩短兵都使得。\n\n招募他们仍须钱粮，编练成军也要些时日。但下次再遇险地用兵，你不必只从现有诸营里抽人了。"
 hd_maa_source.0020.a:0 "飞军可再征集。"
 hd_wuxi_manbing:0 "五溪蛮兵"
 hd_wuxi_manbing_flavor:0 "#F 武陵五溪之间，蛮人依山傍水而居，惯于林中潜行、溪畔设伏。伏波将军马援南征至此，困于瘴疠，终于不返。#!"
 hd_maa_source.0021.t:0 "五溪诸蛮不附"
 hd_maa_source.0021.desc:0 "武陵五溪的蛮人不再应你的征发了。那一带或已易手，或是诸蛮离心，你派去的使者在溪边等了半月，只等来几句推托。\n\n营中现有的五溪军士仍然听调。可图上那几条蜿蜒的水道，原本都等着同一批新兵；如今只能另作安排了。"
 hd_maa_source.0021.a_keep:0 "暂缓增募五溪之兵。"
 hd_maa_source.0022.t:0 "五溪诸蛮复附"
 hd_maa_source.0022.desc:0 "五溪诸蛮重新归附，各处首领遣人来营前应募。他们说起林中的小路与溪边的伏处，如数家珍。\n\n新兵尚须钱粮招集，也要编练才能成军。但林泽之间的用兵难处，总算又有了可以倚靠的人。"
 hd_maa_source.0022.a:0 "山溪之间，复有可募之人。"
 hd_shanyue_jiashi:0 "山越甲士"
 hd_shanyue_jiashi_flavor:0 "#F 山越依阻山险，不纳王租，山中出铜铁，便自铸甲兵。降服之后，其强壮者编入军伍，披甲执兵，惯于在林岭间搏战。#!"
 hd_maa_source.0023.t:0 "山越不复出山"
 hd_maa_source.0023.desc:0 "丹阳、会稽、豫章一带的山越不再下山应募了。那些山地或已不在你的掌握之中，或是诸宗部又据险自守，你派去的人连山口都没能进去。\n\n已经编入军伍的山越甲士仍听你号令。只是再想添兵，一时无人可选。"
 hd_maa_source.0023.a:0 "现有甲士，照旧听令。"
 hd_maa_source.0024.t:0 "山越复出"
 hd_maa_source.0024.desc:0 "山中诸宗部重新归附，强壮的子弟又被送下山来，在营前等候挑选。他们个个背着自家铸的刀，神情倔强。\n\n要给他们披甲编伍，仍须另花钱粮。但能够征募与无从征募，毕竟是两回事。"
 hd_maa_source.0024.a:0 "再选强健者披甲。"
 hd_danyang_jingbing:0 "丹阳精兵"
 hd_danyang_jingbing_flavor:0 "#F 丹阳山险，民多果劲，好武习战，崇尚气力。天下言精兵，常推丹阳；州郡有急，往往遣使来此募兵。#!"
 hd_maa_source.0025.t:0 "丹阳募兵无门"
 hd_maa_source.0025.desc:0 "丹阳传来的消息让你皱起了眉头。郡中或已易手，或是兵乱之后人心未定，往年争着投军的山民子弟，如今一个也募不到了。\n\n营中现有的丹阳精兵仍归你调遣。可先前几项靠新兵撑起来的部署，只能重新筹划了。"
 hd_maa_source.0025.a:0 "用兵先计实数。"
 hd_maa_source.0026.t:0 "丹阳复可募兵"
 hd_maa_source.0026.desc:0 "丹阳重归安定，郡吏报说，山中的子弟又肯出来投军了。丹阳兵的名声天下皆知，消息一传开，帐下诸将都来打听这一回能分到多少人。\n\n添一营兵仍要花钱，是否立刻增募，还要你来定。但这条兵源，终于又握回了你的手中。"
 hd_maa_source.0026.a:0 "丹阳精兵，可以再募。"
 hd_fuling_liannushi:0 "涪陵连弩士"
 hd_fuling_liannushi_flavor:0 "#F 涪陵山民多戆勇，惯于射猎。他们以连弩轮番发矢，箭簇相续不绝，扼守山口狭路时，来敌难以乘隙近前。#!"
 hd_maa_source.0027.t:0 "涪陵弩士难募"
 hd_maa_source.0027.desc:0 "涪陵的消息传来：那一带或已不在你的掌握之中，或是山民离心，惯于射猎的壮丁都躲进了深山。连弩可以让匠人照样打造，会用它的人却征不来了。\n\n营中现有的连弩士仍听号令。往后扼守山口，只能靠手里这些弩阵了。"
 hd_maa_source.0027.a:0 "且以现有弩士守备。"
 hd_maa_source.0028.t:0 "涪陵弩士复集"
 hd_maa_source.0028.desc:0 "涪陵重归安定，山中的猎户又肯下山应募了。他们拿起连弩试射，箭矢一支接一支钉在靶上，看得你帐下的匠人连连点头。\n\n招募与编练仍要另付钱粮，新军也不会自己到来。但那一叠因无人可用而搁下的守备之议，终于可以重新拿出来了。"
 hd_maa_source.0028.a:0 "弩士可募，旧议可续。"
 hd_qiang_qi:0 "羌骑"
 hd_qiang_qi_flavor:0 "#F 西羌诸种散居陇右、河湟，以畜牧射猎为生。羌骑来去如风，聚则成阵，散则难追，凉州豪杰起事，多倚之为爪牙。#!"
 hd_maa_source.0029.t:0 "羌骑不至"
 hd_maa_source.0029.desc:0 "陇右诸羌不再应你的征发了。金城、陇西一带或已易手，或是诸种叛服不定，你派去的使者带回来的，只有几张羊皮和一番推托。\n\n营中现有的羌骑仍听你调遣。只是往后需要快骑的地方，只能让这几营人一趟接一趟地奔走了。"
 hd_maa_source.0029.a:0 "且按现有羌骑筹划。"
 hd_maa_source.0030.t:0 "诸羌复附"
 hd_maa_source.0030.desc:0 "陇右诸羌重新归附，各部豪帅遣子弟前来，愿为你出骑。他们在营前纵马驰射，来去如风，看得汉家骑卒也暗暗叫好。\n\n招集他们仍须钱粮，编伍也要些时日。但再需要快骑的时候，你不必只让现有部伍来回奔走了。"
 hd_maa_source.0030.a:0 "西羌骑手，复可征集。"
 hd_bingzhou_bianqi:0 "并州边骑"
 hd_bingzhou_bianqi_flavor:0 "#F 并州北临匈奴、鲜卑，边民生长于鞍马之间，识塞路、惯驰逐。天下有事，并州骑常是诸侯争相罗致的劲旅。#!"
 hd_maa_source.0031.t:0 "并州边骑难募"
 hd_maa_source.0031.desc:0 "并州传来的消息说，边骑已经募不到了。雁门、云中一带或已不在你的掌握之中，或是胡骑出没、边民流散，那些生于鞍马之间的边地子弟，已经不知去向。\n\n营中现有的并州边骑仍听调遣。只是下一路军令的先后，你得重新斟酌了。"
 hd_maa_source.0031.a:0 "量骑而后发令。"
 hd_maa_source.0032.t:0 "并州复可募骑"
 hd_maa_source.0032.desc:0 "并州边地重归安定，郡吏报说边民又肯应募了。那些识得塞路、惯于驰逐的年轻人，背着弓，牵着马，已经在郡城外聚了好几拨。\n\n要把他们编成骑阵，仍须另作投入。但若确有需要，你已经可以着手了。"
 hd_maa_source.0032.a:0 "边骑可募，行军复多余地。"
 hd_tengjia:0 "藤甲兵"
 hd_tengjia_flavor:0 "#F 永昌蛮人采山藤浸油，反复曝晒，编成甲胄，轻便坚韧，刀箭难入，渡水不沉。只是藤甲最忌火攻，也受不得北地的严寒。#!"
 hd_maa_source.0033.t:0 "永昌藤甲难继"
 hd_maa_source.0033.desc:0 "永昌传来的消息说，藤甲兵已经征不到了。那一带或已不在你的掌握之中，或是诸部叛服不定，会采藤浸油、编制藤甲的匠人，与能穿着它上阵的蛮兵，都已不再听你召唤。\n\n营中现有的藤甲兵仍可调遣。只是往后用兵，只能按现有的人数来算了。"
 hd_maa_source.0033.a:0 "现有部伍，照旧听调。"
 hd_maa_source.0034.t:0 "藤甲复出"
 hd_maa_source.0034.desc:0 "永昌诸部重新归附，山中又送来了成捆的老藤和会编甲的匠人。部中的蛮兵披着新制的藤甲在营前列队，油光发亮。\n\n要编成新营，甲械与军士仍须另花钱粮。但原来只能搁着的事，今日又能着手了。"
 hd_maa_source.0034.a:0 "藤甲之士，可以再募。"
 hd_maa_training_no_valid_trainer:0 "麾下一时无人能当选练之任，此事只得作罢。"
 hd_maa_training_invest_0_tt:0 "#EMP 新军将在你的首府成军。所费既省，精粗多寡，多半看选练者的本事，也有几分运气。#!"
 hd_maa_training_invest_10_tt:0 "#EMP 新军将在你的首府成军。赏赐丰厚，或能多得几分精锐。#!"
 hd_maa_training_invest_20_tt:0 "#EMP 新军将在你的首府成军。倾力供给，所得当更为可观。#!"
 hd_debug_prepare_youzhou_tuqi_decision:0 "【调试】建立幽州突骑军制"
 hd_debug_prepare_youzhou_tuqi_decision_desc:0 "无视常规条件建立幽州突骑军制，并补足直辖兵源测试所需的控制力。"
 hd_debug_prepare_youzhou_tuqi_decision_tooltip:0 "用于测试幽州突骑的招募、扩编和兵源变化。"
 hd_debug_prepare_youzhou_tuqi_decision_effect:0 "幽州突骑测试条件已经建立。"
 hd_debug_train_xianzhenying_decision:0 "【调试】操练陷阵营"
 hd_debug_train_xianzhenying_decision_desc:0 "以我本人为训练者，直接进入陷阵营训练事件。"
 hd_debug_train_xianzhenying_decision_tooltip:0 "用于测试陷阵营的投入和成军结果。"
 hd_xianzhenying:0 "陷阵营"
 hd_xianzhenying_flavor:0 "#F 高顺所部人数不多，铠甲器械却精练齐整，每有攻击，无不破者，世称陷阵营。重甲相接，号令不紊，是破阵的利刃。#!"
 hd_xianzhenying_army:0 "陷阵营"
 hd_maa_training.1000.t:0 "操练陷阵营"
 hd_maa_training.1000.desc:0 "[hd_maa_trainer.GetTitledFirstName]将选练之议呈到你的案前，开口先说的不是勇力，而是军纪。陷阵之士要敢于迎着刀锋向前，更要肯在同伴身旁站住；只挑最先冲出去的人，未必挑得出能一同回来的人。\n\n甲片、盾牌、赏钱，[hd_maa_trainer.GetSheHe]一项项指给你看。好手肯来投效，看的不只是赏钱，也看你肯不肯亲自出面，以自己的名望许他们一个前程。花得越省，可挑的人便越少。\n\n这支军队尚未成形，开支倒已先排成了阵。"
 hd_maa_training.1000.a:0 "量力而行，择勇成军。"
 hd_maa_training.1000.b:0 "厚赏选卒，备足甲械。"
 hd_maa_training.1000.c:0 "不吝府库，尽选锐士！"
 hd_maa_training.1001.t:0 "陷阵营成军"
 hd_maa_training.1001.desc_tier1:0 "校场上，新编的陷阵营列成了阵。[hd_maa_trainer.GetTitledFirstName]陪你看完操演，并不讳言其中的毛病：转阵稍慢，前后相接也不够紧密。\n\n这支军队终究是成了，不必再从一个空名起步。只是往后派他们去哪里，你得记着今日看到的这些迟疑，不能让一个响亮的军号遮住了眼睛。"
 hd_maa_training.1001.desc_tier2:0 "新编的陷阵营在校场上操演了一遍。甲械齐备，行伍有序，进退大体能随号令；[hd_maa_trainer.GetTitledFirstName]的评语很平实，末了只说一句「可以听用」。\n\n这便够了。陷阵之名不是喊给自家人听的，到了阵前，还得靠盾后每一个人守住自己的位置。从此再有人问谁能向前，你多了一支可以考虑的部伍。"
 hd_maa_training.1001.desc_tier3:0 "鼓声一起，陷阵营前列举盾，后队接进，收兵时也无一人只顾争先。你在将台上看着，不知不觉松开了按在栏杆上的手。\n\n这不是一群披了甲的好勇之徒，而是一支号令贯通前后的军队。先前付出的钱粮与名望，总算有了看得见的着落。"
 hd_maa_training.1001.desc_tier4:0 "操演到最后，鼓声转急，陷阵营整营收阵，末一列也没有乱。[hd_maa_trainer.GetTitledFirstName]回身向你行礼，脸上难得露出几分得意。\n\n前列接敌，后队补上，号令一转，整营又能依次退回。你看着这支新军，已经忍不住想把他们写进下一次的军议里了。"
 hd_maa_training.1001.a:0 "陷阵之士，听我军令。"
 hd_hubaoqi:0 "虎豹骑"
 hd_hubaoqi_flavor:0 "#F 曹氏亲领的精骑，士卒多从百人将中拔擢，号为天下骁锐。他们披甲驰突，长于在开阔之地一鼓破阵、穷追败军。#!"
 hd_hubaoqi_army:0 "虎豹骑"
 hd_maa_training.1100.t:0 "操练虎豹骑"
 hd_maa_training.1100.desc:0 "[hd_maa_trainer.GetTitledFirstName]谈起选练虎豹骑，先把马价指给你看，又添上甲械与选募之费，钱粮簿上几乎没有一项可以轻轻带过。\n\n「骑者敢进，马也须进得去。」[hd_maa_trainer.GetSheHe]说。虎豹骑的士卒向来从百人将中拔擢，这些人肯舍了旧部来投，图的不只是赏赐，还有追随一位名重一时的主君。\n\n驰向敌阵之前，这支骑军得先从你的府库前走过。"
 hd_maa_training.1100.a:0 "就现有骑者择优。"
 hd_maa_training.1100.b:0 "厚赏骑士，充实马甲。"
 hd_maa_training.1100.c:0 "良马锐士，不吝资财！"
 hd_maa_training.1101.t:0 "虎豹骑成军"
 hd_maa_training.1101.desc_tier1:0 "虎豹骑已经成军，操演却不如你想象中痛快。骑者各有本领，合在一处变换阵势时，前后仍有参差，鼓声一响，并非人人同进同退。\n\n你略有些失望，却也没有拂袖而去。新骑毕竟已经可用，不再只是一纸筹划。真要派他们接敌时，你得记住今日看到的这些迟疑。"
 hd_maa_training.1101.desc_tier2:0 "虎豹骑在校场上驰过一圈，最让你留意的，是骑队前后接续，没有乱了次序。能催马向前的人不少，肯依号令收住的人，同样难得。\n\n甲械与编伍都已妥当。你没有因此夸口下一战必胜；不过再议平原上的接战时，你手里总算多了一份分量。"
 hd_maa_training.1101.desc_tier3:0 "鼓声中，虎豹骑展开阵列，突进之后又随令收转，骑者与坐骑配合得严丝合缝。你原本绷着的脸色，终于松动了。\n\n这不是只凭一身胆气凑成的部伍。选练时花出去的钱帛，如今都化成了听命的马蹄。你在心里盘算，该让他们先去哪一面接敌。"
 hd_maa_training.1101.desc_tier4:0 "虎豹骑自校场一端疾驰而来，到了将台前齐齐勒马，蹄声戛然而止，扬起的尘土好一会儿才落定。[hd_maa_trainer.GetTitledFirstName]在你身旁低声道：「天下骁锐，尽在于此。」\n\n甲械、马匹与阵列，样样都挑不出毛病。起初看着颇为沉重的那笔开支，此刻想来，竟也不算什么了。"
 hd_maa_training.1101.a:0 "虎豹已集，待令驰突。"
 hd_baier:0 "白毦"
 hd_baier_flavor:0 "#F 白毦是刘备帐下亲兵，以白色毦饰为号。陈到统领此军，与赵云并以忠勇著称；临危护主，从不轻离本阵。#!"
 hd_baier_army:0 "白毦"
 hd_maa_training.1200.t:0 "操练白毦"
 hd_maa_training.1200.desc:0 "[hd_maa_trainer.GetTitledFirstName]将白毦选练之议呈上。你问有多少勇士可选，[hd_maa_trainer.GetSheHe]却先谈遇敌时谁来补上空处，谁来掩护收队。\n\n护卫之军不只要甲好力强，还得在旁人后退时守住自己的位置。这样的人难找，肯来的人也要看主君值不值得托付性命，你的名望，便是许给他们的凭信。\n\n若只图省事，随意编出一队，到了最需要他们的时候，军号再好听也无济于事。"
 hd_maa_training.1200.a:0 "依现有资用，选练护卫。"
 hd_maa_training.1200.b:0 "厚赏优选，备足甲械。"
 hd_maa_training.1200.c:0 "护卫之军，尽力供给。"
 hd_maa_training.1201.t:0 "白毦成军"
 hd_maa_training.1201.desc_tier1:0 "白毦已经编成，操演中却有几处相互掩护不够利落，你看到那里，不自觉地皱起了眉头。\n\n护卫之军最怕的，便是在该补位时迟疑。但这支新军并非不可用，不能因你期望更高，就当这一番选练全无所得。往后把他们放在哪里，须照眼下的本领来安排，不能只凭白毦二字便放心背过身去。"
 hd_maa_training.1201.desc_tier2:0 "白毦在校场上操演了一遍：列伍不乱，前后能够相持，收队时也有人照应后列。你看完才发觉，自己最在意的始终是最后那一段。\n\n他们未必个个都能独当一面，编在一处，却已像一支有统属的护卫，而不是各自逞勇的人群。原先几处难以兼顾的守备，如今可以再想一想了。"
 hd_maa_training.1201.desc_tier3:0 "操演中有一处让你看得格外仔细：前列收转时，后队及时接住空隙，直到整队完毕，也没有失了照应。\n\n能在进退之间守住同伴的人，才值得托付身后的路。这一番选练的结果比你原先所望的更好，花出去的钱帛，你再也不觉得冤枉了。"
 hd_maa_training.1201.desc_tier4:0 "操演将毕，你叫人再演一遍后队接住前列的那一段。旁人都在看军容，你却唯独在意这个细节。\n\n进退严整，收转时彼此相护。若有一天军前不得不退，你希望看见的正是这样的队伍，而不是人人只认得自己脚下的路。方才还觉得这笔选练之费沉重，此刻却很难再挑出一句不值。"
 hd_maa_training.1201.a:0 "白毦成军，可托阵后。"
 hd_jiefanbing:0 "解烦兵"
 hd_jiefanbing_flavor:0 "#F 解烦兵是孙吴中军劲旅，取为主上解除烦难之意。每有急警，便由亲信将领统率，星夜驰援，于林泽之间转战自如。#!"
 hd_jiefanbing_army:0 "解烦兵"
 hd_maa_training.1300.t:0 "操练解烦兵"
 hd_maa_training.1300.desc:0 "[hd_maa_trainer.GetTitledFirstName]展开选练之议，讲解烦兵该如何拆队接应、遇敌再合。你听着，想起那些一封比一封催得急的军报。\n\n快，并不只是跑得快。兵器与行装不能拖累脚步，小队离开大阵，也须认得号令，否则赶到得早，散得也早。[hd_maa_trainer.GetSheHe]说，这样的好手各处都在争，想要他们来投，除了赏钱，还得靠你的名声招揽。\n\n要替军中解烦，倒得先解开眼前这笔账。"
 hd_maa_training.1300.a:0 "就现有军士择优。"
 hd_maa_training.1300.b:0 "厚赏选募，充实部伍。"
 hd_maa_training.1300.c:0 "应急之军，尽力筹备！"
 hd_maa_training.1301.t:0 "解烦兵成军"
 hd_maa_training.1301.desc_tier1:0 "解烦兵已经编成，操演中转队时却呼应不够迅速。你看在眼里，把原先打算交给他们的一项急务暂且放回了案边。\n\n这支军队不能说一无所得，只是要他们在紧迫之际独自应变，还不宜抱太满的指望。军号已经立下，往后怎样把他们用得恰当，仍要你多费心。"
 hd_maa_training.1301.desc_tier2:0 "解烦兵在校场上分合了几回，各队能散能聚，接到号令也能及时转向，没有谁只顾往前跑而失了照应。\n\n这一支新军未必能包办所有急务，却已是可以调遣的人手。你把先前那些拆东补西的打算重新看了一遍，心里松快了些。"
 hd_maa_training.1301.desc_tier3:0 "操演时，解烦兵各队交替进退，接应与收束都做得利落。你原本担心他们一分便散，此刻才放下心来。\n\n既有奔走之力，也听得见同伴的号令，这才像一支应急之军，而不是换了名号的寻常步卒。能不能及时赶上真正的急难，还要看你的调遣；但军中确实多了可用之才。"
 hd_maa_training.1301.desc_tier4:0 "[hd_maa_trainer.GetTitledFirstName]在舆图上一一指明各队去向：哪一路分出去截敌，哪一路绕后接应，最后又在何处合拢。校场上的解烦兵果然分毫不差，每一路都按时合回。\n\n你想起从前处处缺人、怎样挪都嫌慢的日子。如今，你已经忍不住在想，第一道真正交给他们的军令该是什么了。"
 hd_maa_training.1301.a:0 "军中有急，可调解烦。"
 hd_quyi_xiandeng:0 "麴义先登"
 hd_quyi_xiandeng_flavor:0 "#F 麴义久在凉州，晓习羌斗。界桥之战，他令先登之士伏于盾下，强弩夹阵相承，待敌骑驰近方才齐发，大破白马义从。#!"
 hd_quyi_xiandeng_army:0 "麴义先登"
 hd_maa_training.1400.t:0 "操练麴义先登"
 hd_maa_training.1400.desc:0 "[hd_maa_trainer.GetTitledFirstName]说起操练先登弩军，先问军士能否在敌骑逼近时稳住手。你原本正看着弩机的价钱，听到这里才抬起头来。\n\n强弩可以买来，肯伏在盾下等号令的人却须细挑。[hd_maa_trainer.GetSheHe]要把持盾、张弩与齐射连成一气，不能各练各的。敢死之士肯把性命交出来，也要看领兵的主君是否名重一时，值得他们效死。\n\n帐外有人候着传令，案上只差你最后一句话。"
 hd_maa_training.1400.a:0 "依现有资用，选练弩阵。"
 hd_maa_training.1400.b:0 "厚赏择人，备足弩械。"
 hd_maa_training.1400.c:0 "尽力供给，练成先登！"
 hd_maa_training.1401.t:0 "麴义先登成军"
 hd_maa_training.1401.desc_tier1:0 "先登弩军已经编成，操演中却有几回号令未下便先放了矢。你记下这几处，不愿让「强弩破骑」的好名声盖过了它们。\n\n阵列总算有了根基，只是临敌时能稳到哪一步，还不能照你所愿夸大。往后真要他们迎击骑阵，你得先记住今日的这些迟疑。"
 hd_maa_training.1401.desc_tier2:0 "盾列与弩手已能相互照应，齐射时也听得进号令。你看完操演，点了点头。\n\n还谈不上能在任何敌阵前不动如山，却已有一支弩军该有的规矩。下一次再议及骑兵之患，你不必只想着如何避开；不过真正交锋以前，射向靶场的弩矢，仍不能替你预先赢下一仗。"
 hd_maa_training.1401.desc_tier3:0 "操演中，弩阵等令、齐发、重整，次序分明，你最担心的抢射与散乱，一处也没有出现。\n\n盾与弩不再各自为战。只要选好接敌之处，便有望让来犯的骑兵付出代价。先登之法不再只是一句壮语，而是你手中一支可以发令的军队了。"
 hd_maa_training.1401.desc_tier4:0 "「令未下，弩阵无人先发。」[hd_maa_trainer.GetTitledFirstName]说这话时，校场上的弩手正伏在盾下，一动不动。鼓声一落，万矢齐发，靶垛顷刻间插满了箭杆。\n\n你想起先前面对骑军时不得不一再更改的部署，指尖不觉将袖口捏紧。那些原先只好避让的道路，今日可以再仔细看一看了。"
 hd_maa_training.1401.a:0 "令至齐发，勿乱阵脚。"
 hd_suwei_hushi:0 "宿卫虎士"
 hd_suwei_hushi_flavor:0 "#F 许褚所统宿卫，号为虎士，多是随他起事的豪侠壮士。他们日夜随侍主君左右，刺客与乱兵皆不得近前。#!"
 hd_suwei_hushi_army:0 "宿卫虎士"
 hd_maa_training.1500.t:0 "操练宿卫虎士"
 hd_maa_training.1500.desc:0 "[hd_maa_trainer.GetTitledFirstName]来议虎士选练，行过礼后仍立在你近旁。你看着这个将要替你挑选近卫的人，忽然觉得钱粮簿上的数目也没那么刺眼了。\n\n[hd_maa_trainer.GetSheHe]的办法很明白：先择勇健，再看能否守令，甲械与赏赐也须相称。肯以性命护卫主君的豪侠之士，看重的是知遇之恩；你若不亲自出面、以名望相许，再多的钱也请不来。\n\n近卫若只在无事时好看，便不值得另立军号。"
 hd_maa_training.1500.a:0 "依现有资用，择勇为卫。"
 hd_maa_training.1500.b:0 "厚赏优选，充实近卫。"
 hd_maa_training.1500.c:0 "近身之军，不惜资用。"
 hd_maa_training.1501.t:0 "宿卫虎士成军"
 hd_maa_training.1501.desc_tier1:0 "虎士已经成军，操演中却仍有几处衔接迟缓。近卫站得离你最近，细小的疏漏也显得格外扎眼。\n\n但这支军队毕竟已经成形，不能因为未尽你意，就当这一番选练白费。哪里可以托付，哪里还须小心，你得记得比旁人更清楚，不能只凭虎士二字便安心。"
 hd_maa_training.1501.desc_tier2:0 "虎士在你面前操演了一遍：甲械齐备，换列有序，号令前后相接。看到末尾，你才发觉一直按在剑柄上的手已经松开了。\n\n这支新军不必被说成无所不能，只要守得住自己的位置，便值得留下。先前几项难以兼顾的护卫安排，如今可以重新商议了。"
 hd_maa_training.1501.desc_tier3:0 "接令、换列、相互掩护，虎士操演的每一处，都没有只靠几句好话敷衍。你不由向前走了两步，看得更仔细些。\n\n所付的钱粮终究换来了像样的护卫。想到若有急变，不必再临时从别处抽人填补，你心里那根绷紧的弦才略略松下。"
 hd_maa_training.1501.desc_tier4:0 "操演方毕，虎士齐齐收兵立定，甲叶相击之声戛然而止。[hd_maa_trainer.GetTitledFirstName]上前禀报，你却先回头看了一眼身后。谈起宿卫，人最先想到的，终究是离自己最近的那几步路。\n\n换列、掩护与号令，样样都挑不出毛病。那笔钱确实没有白花。至少今日，知道有这样一支部伍守在身边，你已经可以安心几分。"
 hd_maa_training.1501.a:0 "虎士听命，宿卫有备。"
 hd_nanman_xiangbing:0 "南蛮象兵"
 hd_nanman_xiangbing_flavor:0 "#F 南中徼外诸部驯象为兵，驭手踞于象背，驱之冲阵。巨象所过，行列崩散；中原兵马初见此物，往往未战先惊。#!"
 hd_nanman_xiangbing_army:0 "南蛮象兵"
 hd_maa_training.1600.t:0 "操练南蛮象兵"
 hd_maa_training.1600.desc:0 "[hd_maa_trainer.GetTitledFirstName]将象兵的开支列在案上：草料、装具、驭手，一项接着一项。你看过那份数目，险些以为军中要养的不只是象，还有一张永远填不满的嘴。\n\n[hd_maa_trainer.GetSheHe]却先谈进退的号令。战象能冲开前路，也须有人叫它停下、转向；若只会催它向前，站在后面的军士同样不会安心。南中诸部的驭象好手不轻易出山，请动他们，靠的不只是钱，还有你的名声。\n\n象军所需甚巨，最后一句话，得由你来说。"
 hd_maa_training.1600.a:0 "依现有资用筹办象军。"
 hd_maa_training.1600.b:0 "增拨资财，充实选练。"
 hd_maa_training.1600.c:0 "象军所需，尽力供给。"
 hd_maa_training.1601.t:0 "南蛮象兵成军"
 hd_maa_training.1601.desc_tier1:0 "象兵已经成军，操演中却有几回转向不够顺畅。那些庞大的身躯在校场上迟疑地打着转，你看着不由停了一停。\n\n驭手与部伍都已编列，只是火候未到。派往何处、如何接战，都不能只看它们声势骇人便随意决定；军令若安排不当，先受惊的未必是敌人。"
 hd_maa_training.1601.desc_tier2:0 "驭手随令驱象前进、收转，护从也已编列妥当。你反复看了几遍，才放下先前对这支新军的顾虑。\n\n这样的威势，不能拿寻常步阵的办法估量。真正接敌时，要给它们留够施展的地方，也要顾好后队。所费的资财，总算有了着落。"
 hd_maa_training.1601.desc_tier3:0 "象兵的驱进、转向与收束都有板有眼，驭手和护从配合默契。你看完一遍，才觉得那笔沉重的开支换来了分量相当的东西。\n\n它们的威势不再只是远望时令人惊叹，已经能够随军令调遣。今日所得越好，往后越不能因草率调遣白白毁了它。"
 hd_maa_training.1601.desc_tier4:0 "象阵缓缓驱进，到了将台前一声长鸣，齐齐止步。[hd_maa_trainer.GetTitledFirstName]张开双臂比划象阵的宽度，见你看着，又急忙放下。你反倒笑了，叫[hd_maa_trainer.GetSheHe]接着说，尤其要把如何收转讲清楚。\n\n起初那张近乎吓人的资用簿，总算换来了同样有分量的东西。若有一天敌军真望见象阵向前，但愿他们脸上的神情，也值得这样细细报来。"
 hd_maa_training.1601.a:0 "象军成列，待令而进。"
 hd_baiyibing:0 "白衣兵"
 hd_baiyibing_flavor:0 "#F 吕蒙袭取江陵时，令精兵伏于船中，摇橹者皆着白衣，扮作商贾，昼夜兼行，沿江烽候尽被擒获而不觉。此后轻装奇袭之兵，多以白衣为号。#!"
 hd_baiyibing_army:0 "白衣兵"
 hd_maa_training.1700.t:0 "操练白衣兵"
 hd_maa_training.1700.desc:0 "[hd_maa_trainer.GetTitledFirstName]说起白衣兵的选练，没有先数甲械，而是问谁能辨路，谁能在离开大队之后，仍记得约定的去处。\n\n你伸手将舆图上的一面小旗挪到路旁。轻装不是少带几件东西便算数，分队也不是把人随意撒出去；若到时彼此找不着，再快的脚步也只会把队伍带得更散。这样的好手，要靠赏钱，也要靠你的名望去招揽。\n\n临敌时要他们走得轻，眼下的钱粮却不能不掂量。"
 hd_maa_training.1700.a:0 "就现有军士择优选练。"
 hd_maa_training.1700.b:0 "厚赏好手，充实部伍。"
 hd_maa_training.1700.c:0 "精练轻兵，尽力支持。"
 hd_maa_training.1701.t:0 "白衣兵成军"
 hd_maa_training.1701.desc_tier1:0 "白衣兵已经编成，操演中却有几处接应不够利落。你看过之后，把原想交给他们的一项冒险差事暂且搁下了。\n\n轻捷之长并非全无所得，只是散开后如何再聚，还不像你原先想的那样省心。若只因军号好听便把他们送得太远，吃亏的终究还是你的兵。"
 hd_maa_training.1701.desc_tier2:0 "白衣兵操演得颇为平稳：分队与接应都能依令，没有谁只顾争快便失了同伴。你把先前的担心略略放下。\n\n这支队伍还当不起「来去无踪」的夸赞，却已经能派上用场。往后遇到要追踪或掩护的军务，不必总让笨重的大队兼顾了。"
 hd_maa_training.1701.desc_tier3:0 "白衣兵各队离合有序，接应及时，转移时也没有露出你原先担心的散乱。你看完操演，觉得这一次选练很值得。\n\n脚力之外，还有一套能彼此衔接的号令。若要在林岭间追敌、截路或掩护收兵，如今总算有了合用的部伍。越是不靠正面声势取胜的队伍，第一道军令越要想清楚。"
 hd_maa_training.1701.desc_tier4:0 "操演开始不久，白衣兵便从校场上消失得无影无踪。你正疑惑，[hd_maa_trainer.GetTitledFirstName]却请你回头：几队轻兵不知何时已绕到将台之后，按令列好了队。\n\n你顺着舆图上的小路看过去，那些不起眼的岔道忽然都有了用处。若到临敌时，能让对方直到兵至才明白谁来了，那才真正值得你记住。"
 hd_maa_training.1701.a:0 "轻兵已备，慎定进退。"
