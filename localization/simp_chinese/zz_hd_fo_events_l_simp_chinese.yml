l_simp_chinese:
 # 佛教东传（hd_fo，2026-10-25）：事件、好感修正、死因。人名与介绍见 zz_hd_fo_monks_*，寺院与决策见 zz_hd_fo_buildings_*。

 hd_fo.0001.t:0 "高僧远来"
 hd_fo.0001.desc:0 "有僧人自远方而来，叩门求见。来者是[hd_fo_monk.GetName]——[hd_fo_monk.Custom('HdFoBio')]\n\n是否留他在宫中供养？"
 hd_fo.0001.a:0 "延入供养，以礼相待"
 hd_fo.0001.b:0 "婉言辞谢，任其他往"
 hd_fo.0001.c:0 "斥为左道，逐出境外"

 hd_fo.1001.t:0 "浮屠仁祠"
 hd_fo.1001.desc:0 "楚王遣使奉黄缣白纨诣国相请罪。天子下诏：「楚王诵黄老之微言，尚浮屠之仁祠，洁斋三月，与神为誓，何嫌何疑，当有悔吝？」还其所赎，以助伊蒲塞、桑门之盛馔。"
 hd_fo.1001.a:0 "斋戒奉佛"

 hd_fo.1002.t:0 "白马驮经"
 hd_fo.1002.desc:0 "孝明皇帝夜梦金人，身有日光，飞行殿前。明旦问于群臣，傅毅以为西方有神，其名曰佛。于是遣使天竺，迎得沙门摄摩腾、竺法兰，以白马负经而还，乃于洛阳城西立寺，号曰白马。"
 hd_fo.1002.a:0 "中土有佛，自此始"

 hd_fo.1004.t:0 "黄老浮屠之祠"
 hd_fo.1004.desc:0 "宫中濯龙园设华盖之座，并祠黄老与浮屠，用郊天之乐。襄楷上书谏曰：「此道清虚，贵尚无为，好生恶杀，省欲去奢。今陛下嗜欲不去，杀罚过理，既乖其道，岂获其祚哉！」"
 hd_fo.1004.a:0 "姑且听之"

 hd_fo.1005.t:0 "道行般若"
 hd_fo.1005.desc:0 "月氏沙门支娄迦谶与天竺沙门竺佛朔在洛阳译出《道行般若经》《般舟三昧经》，大乘般若之学自此传入中土。"
 hd_fo.1005.a:0 "善"

 hd_fo.1009.t:0 "下邳浮屠祠"
 hd_fo.1009.desc:0 "于下邳大起浮屠祠，以铜为人，黄金涂身，衣以锦采，堂阁周回可容三千余人。令界内及旁郡好佛者皆来听受，免其徭役以招致之，远近前后至者五千余户。每浴佛，多设酒饭，布席于路，经数十里，来观及就食者且万人。"
 hd_fo.1009.a:0 "浴佛之日，万人空巷"

 hd_fo.1015.t:0 "鱼山梵呗"
 hd_fo.1015.desc:0 "登东阿鱼山，闻岩岫间有诵经之声，清扬哀婉，遂摹其音节，写为梵呗，传之后世。"
 hd_fo.1015.a:0 "以声传法"

 hd_fo.1016.t:0 "建初寺"
 hd_fo.1016.desc:0 "康僧会至建业，营立茅茨，设像行道。吴主疑其矫异，召而诘之。僧会置铜瓶于案，烧香礼请，三七日暮，瓶中铿然有声，舍利五色光炎照耀瓶上。吴主大为叹服，即为建塔，号建初寺，江左大法自此兴起。"
 hd_fo.1016.a:0 "大法兴于江左"

 hd_fo.1019.t:0 "欲毁佛寺"
 hd_fo.1019.desc:0 "法令既严，有司议毁境内淫祠，并及佛寺。群臣有言：「佛之威力，不同余神。康会感瑞，大皇创寺，今若轻毁，恐贻后悔。」乃遣人至寺中诘问康僧会。是毁是留？"
 hd_fo.1019.a:0 "毁之，勿留余迹"
 hd_fo.1019.b:0 "听僧会之言，罢议"

 hd_fo.1021.t:0 "神僧"
 hd_fo.1021.desc:0 "佛图澄知胡主不达深理，正可以道术为征，乃取钵盛水，烧香咒之，须臾钵中生青莲花，光色曜目。主上由此信服，凡有大事，必先咨之。"
 hd_fo.1021.a:0 "请大和尚常留左右"

 hd_fo.1022.t:0 "佛是戎神"
 hd_fo.1022.desc:0 "著作郎王度上奏：「佛出西域，外国之神，非诸华所应祠奉。汉明感梦，初传其道，唯听西域人得立寺都邑，汉人皆不出家。」诏答曰：「朕生自边壤，忝君诸夏，至于飨祀，应兼从本俗。佛是戎神，正所应奉。其夷赵百蛮有乐事佛者，悉听为道。」"
 hd_fo.1022.a:0 "自此汉人亦可出家"

 hd_fo.1023.t:0 "大和尚圆寂"
 hd_fo.1023.desc:0 "[hd_fo_monk.GetName]圆寂了。他一生以神异化导胡主，屡劝少杀，门下弟子遍于河北，所立佛寺不可胜数。"
 hd_fo.1023.a:0 "哀哉"

 hd_fo.1026.t:0 "一人半"
 hd_fo.1026.desc:0 "王师既克襄阳，得释道安，大喜曰：「朕以十万之师取襄阳，所得唯一人半。」左右问之，答曰：「安公一人，习凿齿半人也。」"
 hd_fo.1026.a:0 "迎安公入宫"

 hd_fo.1028.t:0 "东林寺"
 hd_fo.1028.desc:0 "慧远本欲往罗浮山，行至浔阳，见庐山清静，足以息心，遂止于山中。江州刺史为之更立房殿于山东，号东林寺。慧远自此影不出山，迹不入俗。"
 hd_fo.1028.a:0 "善"

 hd_fo.1030.t:0 "逍遥园译场"
 hd_fo.1030.desc:0 "鸠摩罗什入长安，待以国师之礼，处之逍遥园西明阁，集义学沙门八百余人共译经论。旧译多有乖谬，至此大畅其义。"
 hd_fo.1030.a:0 "大开译场"

 hd_fo.1031.t:0 "白莲社"
 hd_fo.1031.desc:0 "慧远与刘遗民、雷次宗等百二十三人，于庐山般若台精舍阿弥陀像前建斋立誓，共期往生西方净土，时人号曰白莲社。\n\n#P 净土之教兴起，世人可以改信净土。#!"
 hd_fo.1031.a:0 "念佛往生"

 hd_fo.1032.t:0 "沙门敬王者"
 hd_fo.1032.desc:0 "朝中议沙汰沙门，又令沙门致敬王者。慧远作书答之，以为出家者隐居以求其志，变俗以达其道，故不敬王者，辞旨恳切。是坚持前议，还是从其所论？"
 hd_fo.1032.a:0 "坚持沙汰，令其致敬"
 hd_fo.1032.b:0 "从慧远之论，罢议"

 hd_fo.1033.t:0 "大般涅槃"
 hd_fo.1033.desc:0 "昙无谶译出《大般涅槃经》，言一切众生悉有佛性。北土义学为之一振。"
 hd_fo.1033.a:0 "善"

 hd_fo.1035.t:0 "灭佛之议"
 hd_fo.1035.desc:0 "关中乱起，官军于佛寺中搜得弓矢兵器，又有酿酒之具与豪富所寄藏之物，复见窟室匿有妇女。权臣进言，以为佛法虚诞，为世费害，宜悉除之。\n\n是否下诏灭佛？"
 hd_fo.1035.a:0 "诏天下尽毁佛寺，沙门还俗"
 hd_fo.1035.b:0 "不从此议"

 hd_fo.1036.t:0 "复法"
 hd_fo.1036.desc:0 "新君下诏复兴佛法，听各郡县立寺，好乐道法欲为沙门者，听其出家。\n\n#P 灭佛时被毁的寺院可以按旧日规制重建（见决策）。#!"
 hd_fo.1036.a:0 "佛法复兴"

 hd_fo.1136.t:0 "云冈五窟"
 hd_fo.1136.desc:0 "沙门统昙曜白于上，于京城西武州塞凿山石壁，开窟五所，镌建佛像各一，高者七十尺，次六十尺，雕饰奇伟，冠于一世。"
 hd_fo.1136.a:0 "千佛同光"

 hd_fo.1037.t:0 "少林寺"
 hd_fo.1037.desc:0 "天竺沙门跋陀性爱幽栖，屡往嵩岳。主上为之于少室山阴立寺以居之，号曰少林。"
 hd_fo.1037.a:0 "善"

 hd_fo.1038.t:0 "永宁寺"
 hd_fo.1038.desc:0 "于宫前阊阖门南立永宁寺，中有九层浮图，架木为之，去京师百里已遥见之。僧房楼观一千余间，雕梁粉壁，为京师寺塔之冠。"
 hd_fo.1038.a:0 "壮哉"

 hd_fo.1039.t:0 "一苇渡江"
 hd_fo.1039.desc:0 "南天竺沙门菩提达摩见南朝天子，天子问造寺写经有何功德，答曰：「并无功德。」不契而去，一苇渡江，北至嵩山，面壁而坐。有僧神光立雪断臂以求法，达摩为之易名慧可。\n\n#P 禅宗兴起，世人可以改信禅宗。#!"
 hd_fo.1039.a:0 "直指人心"

 hd_fo.1040.t:0 "舍身同泰寺"
 hd_fo.1040.desc:0 "于台城北立同泰寺，开大通门以对寺之南门。天子亲至寺中，脱下御服，披上法衣，舍身为寺奴。群臣以钱一亿万奉赎，方才还宫。"
 hd_fo.1040.a:0 "回向三宝"

 hd_fo.1140.t:0 "再度舍身"
 hd_fo.1140.desc:0 "天子又至同泰寺，舍身为奴，升座讲经。群臣只得再以巨万之钱奉赎，经学之士多有微词。"
 hd_fo.1140.a:0 "回向三宝"

 hd_fo.1042.t:0 "断佛道二教"
 hd_fo.1042.desc:0 "群臣争论三教先后，佛道相攻不已。有人以为僧徒耗费国力，蠹政害民，请尽断佛、道二教，经像悉毁，沙门道士并令还俗。\n\n是否下诏？"
 hd_fo.1042.a:0 "断佛道二教，沙门还俗"
 hd_fo.1042.b:0 "不从此议"

 hd_fo.1043.t:0 "入天台"
 hd_fo.1043.desc:0 "智顗辞别金陵，入天台山，于华顶峰头陀行道，以《法华》为宗，止观双运。\n\n#P 天台宗兴起，世人可以改信天台。#!"
 hd_fo.1043.a:0 "止观双运"

 hd_fo.1143.t:0 "国清寺"
 hd_fo.1143.desc:0 "智顗临终留下寺图，嘱于天台山下立寺。其后依图营建，初名天台寺，后改国清，天台宗以此为根本道场。"
 hd_fo.1143.a:0 "寺若成，国即清"

 hd_fo.1044.t:0 "智者"
 hd_fo.1044.desc:0 "智顗为王授菩萨戒，王赐号「智者」，自此人称智者大师。"
 hd_fo.1044.a:0 "善"

 hd_fo.1045.t:0 "仁寿舍利"
 hd_fo.1045.desc:0 "天子颁舍利于诸州，诏三十州同日起塔供养，钟磬梵音遍于天下。"
 hd_fo.1045.a:0 "天下同庆"

 hd_fo.1046.t:0 "三阶教被禁"
 hd_fo.1046.desc:0 "信行所创三阶教，以为末法之世，一切众生皆当普敬。有司以其言乖于经义，奏请禁断，诏不许其传。"
 hd_fo.1046.a:0 "知道了"

 hd_fo.1047.t:0 "重修白马寺"
 hd_fo.1047.desc:0 "洛阳经董卓之乱，宫室焚荡，白马寺亦毁。今重修其寺，旧日经台复见香火。"
 hd_fo.1047.a:0 "善"

 hd_fo.1048.t:0 "开皇复法"
 hd_fo.1048.desc:0 "新朝初立，下诏听任出家，令民间计口出钱营造经像，佛法复兴于天下。\n\n#P 灭佛时被毁的寺院可以按旧日规制重建（见决策）。#!"
 hd_fo.1048.a:0 "佛法复兴"

 hd_fo.1049.t:0 "阿育王寺"
 hd_fo.1049.desc:0 "相传扶风美阳藏有佛陀指骨舍利，是天竺阿育王分舍利起塔所及之处。有浮屠之徒在此结庐守护，人称阿育王寺，后世名曰法门寺。"
 hd_fo.1049.a:0 "善"

 hd_fo.1050.t:0 "莫高窟"
 hd_fo.1050.desc:0 "沙门乐僔行至敦煌三危山，忽见金光如千佛之状，遂于鸣沙山崖架空凿岩，造窟一龛。其后继之者不绝，窟龛日增。"
 hd_fo.1050.a:0 "千佛之光"

 hd_fo.1051.t:0 "麦积山"
 hd_fo.1051.desc:0 "秦州麦积山孤峰突起，状如麦垛。时人于崖上凿窟造像，栈道凌空，号麦积崖。"
 hd_fo.1051.a:0 "善"

 hd_fo.1052.t:0 "悬空寺"
 hd_fo.1052.desc:0 "于恒山金龙峡西崖峭壁间凭空架木，建寺一所，上载危岩，下临深谷，楼阁悬于半空，故号悬空寺。"
 hd_fo.1052.a:0 "善"

 hd_fo.1053.t:0 "开塔供养"
 hd_fo.1053.desc:0 "法门寺开塔，迎出佛骨供养，四方士女竞来瞻礼，寺宇因此增修。"
 hd_fo.1053.a:0 "善"

 hd_fo.1056.t:0 "南山律"
 hd_fo.1056.desc:0 "道宣隐居终南山，专研《四分律》，撰《行事钞》以为僧众规范。\n\n#P 律宗兴起，世人可以改信律宗。#!"
 hd_fo.1056.a:0 "持戒为本"

 hd_fo.1057.t:0 "法界观门"
 hd_fo.1057.desc:0 "杜顺依《华严经》立法界观门，开华严一宗之端绪。\n\n#P 华严宗兴起，世人可以改信华严。#!"
 hd_fo.1057.a:0 "一即一切"

 hd_fo.1058.t:0 "取经归来"
 hd_fo.1058.desc:0 "玄奘西行十七年，历百余国，携梵本六百五十七部归来。唯识之学由此大明。\n\n#P 唯识宗兴起，世人可以改信唯识。#!"
 hd_fo.1058.a:0 "善"

 # 好感修正
 hd_fo_expelled_monk_jingxue_opinion:0 "驱逐胡僧"
 hd_fo_expelled_monk_buddhist_opinion:0 "驱逐高僧"
 hd_fo_persecutor_opinion:0 "灭佛"
 hd_fo_sheshen_jingxue_opinion:0 "舍身佛寺"
 hd_fo_shatai_opinion:0 "沙汰沙门"
 hd_fo_dharma_friend_opinion:0 "方外之交"
 hd_fo_revered_monk_opinion:0 "敬事神僧"

 # 死因
 death_hd_fo_bo_yuan:0 "不肯还俗，被杀"
 death_hd_fo_bo_yuan_killer:0 "不肯还俗，被[TARGET_CHARACTER.GetUIName]所杀"
 death_hd_fo_tan_wu_chen:0 "欲西行求经，遇刺身亡"
 death_hd_fo_tan_wu_chen_killer:0 "欲西行求经，被[TARGET_CHARACTER.GetUIName]遣人所杀"
