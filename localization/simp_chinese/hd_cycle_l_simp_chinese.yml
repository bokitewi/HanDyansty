 # ===== 崩溃期事件 =====
 hd_collapse.1001.t: "诸侯请立"
 hd_collapse.1001.desc: "朝纲不振，数位封臣联名上表，请求脱离朝廷、自立一方。若不允，他们便要兵戎相见。"
 hd_collapse.1001.a: "罢了，由他们去吧"
 hd_collapse.1001.b: "乱臣贼子，岂敢要挟朝廷！"
 hd_collapse.1002.t: "密约自立"
 hd_collapse.1002.desc: "几位与你一样心怀不满的封臣，邀你一同起兵，脱离[liege.GetShortUIName]的统治。"
 hd_collapse.1002.a: "共举大事"
 hd_collapse.1002.b: "此事我不参与"
 hd_collapse.2002.t: "拥立新主"
 hd_collapse.2002.desc: "有人私下串联，欲拥立一位强藩取代天子，邀你加入。"
 hd_collapse.2002.a: "愿附骥尾"
 hd_collapse.2002.b: "我仍忠于朝廷"
 hd_collapse.4001.t: "朝廷威信扫地"
 hd_collapse.4001.desc: "州郡各自为政，诏令不出京畿。朝廷必须作出取舍，方能苟延残喘。"
 hd_collapse.4001.a: "放权地方，换取安宁"
 hd_collapse.4001.b: "下诏罪己，收拾人心"
 hd_collapse.4001.c: "强压群臣，不失威权"

