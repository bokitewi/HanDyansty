l_simp_chinese:
 # ===== 天朝循环大修：新时代 =====
 situation_dynastic_cycle_phase_hd_recovery: "百废待兴"
 situation_dynastic_cycle_phase_hd_recovery_icon: "@hd_dc_dynastic_cycle_recovery_icon!$situation_dynastic_cycle_phase_hd_recovery$"
 situation_dynastic_cycle_phase_hd_recovery_desc_short: "乱世方歇，百废待兴。干戈渐息，田亩复垦，人心思定。"
 situation_dynastic_cycle_phase_hd_recovery_desc: "$situation_dynastic_cycle_phase_hd_recovery_desc_short$\n\n这一[dynastic_cycle_era_short|E]，兵戈渐息，流民归田，郡县日渐殷实。若朝政清明，天下可望步入政通人和或开疆拓土之世；若处置失当，暗流复起，便将重陷局势紧张。\n\n天下之内，唯有[son_of_heaven|E]可以创建[kingdom|E]，[empire|E]则不得新立。"
 dynastic_cycle_situation_dynastic_cycle_phase_hd_recovery_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"

 situation_dynastic_cycle_phase_hd_collapse: "天下崩坏"
 situation_dynastic_cycle_phase_hd_collapse_icon: "@hd_dc_dynastic_cycle_collapse_icon!$situation_dynastic_cycle_phase_hd_collapse$"
 situation_dynastic_cycle_phase_hd_collapse_desc_short: "王朝末世，纲纪废弛。灾异频仍，盗贼蜂起，州郡各怀异心。"
 situation_dynastic_cycle_phase_hd_collapse_desc: "$situation_dynastic_cycle_phase_hd_collapse_desc_short$\n\n这一[dynastic_cycle_era_short|E]，朝廷每隔两年便要经历一场危机：诸侯联名请立、强藩谋篡称帝、黎庶揭竿而起，或朝廷威信扫地。天灾与流寇亦时有所闻。\n\n若中华[hegemony|E]无主，或[son_of_heaven|E]掌控的天下法理[counties|E]不足四成，或其君权未臻最高一级，天下便即刻陷入群雄逐鹿。若[son_of_heaven|E]能平定危机、重振纲纪，尚可挽回至局势紧张。"
 dynastic_cycle_situation_dynastic_cycle_phase_hd_collapse_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"

 situation_dynastic_cycle_phase_hd_standoff: "鼎足对峙"
 situation_dynastic_cycle_phase_hd_standoff_icon: "@hd_dc_dynastic_cycle_standoff_icon!$situation_dynastic_cycle_phase_hd_standoff$"
  situation_dynastic_cycle_phase_instability_conquest_icon: "@hd_dc_dynastic_cycle_new_dynasty_icon!$situation_dynastic_cycle_phase_instability_conquest$"
 situation_dynastic_cycle_phase_hd_standoff_desc_short: "群雄已定，诸强割据一方，互相牵制，天下陷入漫长的对峙。"
 situation_dynastic_cycle_phase_hd_standoff_desc: "$situation_dynastic_cycle_phase_hd_standoff_desc_short$\n\n这一[dynastic_cycle_era_short|E]，诸方府库渐丰、正统日固，却无一日不在窥伺邻邦。若有人背盟毁约、策反敌臣、举兵内乱、一战而大有斩获，或幼主嗣位、四夷入寇得逞、强藩林立，天下便将重归群雄逐鹿；遣子为质、纳币求和，则能暂缓干戈。\n\n唯有掌控天下八成法理[counties|E]、已行加冕，并有足够[legitimacy|E]或威望的统治者，方可终结乱世。"
 dynastic_cycle_situation_dynastic_cycle_phase_hd_standoff_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"

