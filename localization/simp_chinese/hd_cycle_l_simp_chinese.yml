 # ===== 崩溃期事件 =====
 hd_collapse.1001.t: "诸侯请立"
 hd_collapse.1001.desc: "朝纲不振，州郡离心。数位封臣联名上表，请求脱离朝廷、自立一方。表文措辞恭谨，字里行间却隐隐透出刀兵之气：你若不允，他们便要兴兵相见。"
 hd_collapse.1001.a: "罢了，任其自去。"
 hd_collapse.1001.b: "乱臣贼子，安敢要挟朝廷！"
 hd_collapse.1001.b.tt: "上表的诸侯将暗中串联，一旦聚众，便要举兵来犯。"
 hd_collapse.1002.t: "密约自立"
 hd_collapse.1002.desc: "几位与你一样心怀不满的封臣暗中遣使而来，邀你一同起兵，脱离[liege.GetShortUIName]的统治。"
 hd_collapse.1002.a: "愿共举大事。"
 hd_collapse.1002.b: "此事吾不与闻。"
 hd_collapse.2002.t: "拥立新主"
 hd_collapse.2002.desc: "有人私下串联，欲拥立一位强藩取代天子。密使已到了你的府上，请你共襄此举。"
 hd_collapse.2002.a: "愿附骥尾。"
 hd_collapse.2002.b: "吾仍忠于朝廷。"
 hd_collapse.4001.t: "朝廷威信扫地"
 hd_collapse.4001.desc: "州郡各自为政，诏令不出京畿，朝堂上的奏对也越来越敷衍。你心里明白，若不作出取舍，朝廷连眼下这点体面也难以维持。"
 hd_collapse.4001.a: "放权州郡，以求苟安。"
 hd_collapse.4001.b: "下诏罪己，收拾人心。"
 hd_collapse.4001.c: "强压群臣，不失威权。"

