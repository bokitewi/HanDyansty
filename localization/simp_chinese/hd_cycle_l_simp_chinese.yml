l_simp_chinese:
 # ===== 天朝循环大修：新时代 =====
 situation_dynastic_cycle_phase_hd_recovery: "百废待兴"
 situation_dynastic_cycle_phase_hd_recovery_icon: "@tgp_dynastic_cycle_expansion_icon!$situation_dynastic_cycle_phase_hd_recovery$"
 situation_dynastic_cycle_phase_hd_recovery_desc_short: "乱世方歇，百废待兴。干戈渐息，田亩复垦，人心思定。"
 situation_dynastic_cycle_phase_hd_recovery_desc: "$situation_dynastic_cycle_phase_hd_recovery_desc_short$\n\n恢复期中各方军事冲突趋于缓和，经济稳步回升，但若处置失当，也会重新陷入暗流涌动的[dynastic_cycle_era_short|E]。\n\n汉地之内，只有天子可以创建王国与帝国。"
 dynastic_cycle_situation_dynastic_cycle_phase_hd_recovery_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"

 situation_dynastic_cycle_phase_hd_collapse: "天下崩坏"
 situation_dynastic_cycle_phase_hd_collapse_icon: "@tgp_dynastic_cycle_instability_icon!$situation_dynastic_cycle_phase_hd_collapse$"
 situation_dynastic_cycle_phase_hd_collapse_desc_short: "王朝末世，纲纪废弛。灾异频仍，盗贼蜂起，州郡各怀异心。"
 situation_dynastic_cycle_phase_hd_collapse_desc: "$situation_dynastic_cycle_phase_hd_collapse_desc_short$\n\n崩溃期每隔两年会爆发一场危机：集体独立、军阀称帝、大规模民变或朝廷权威动摇。天灾与流寇也会不时出现。\n\n一旦霸权头衔无主、天子所控法理伯爵领不足四成，或天子君权未达最高一级，天下立即进入群雄割据；若天子平定危机、重振正统，则可转回局势紧张。"
 dynastic_cycle_situation_dynastic_cycle_phase_hd_collapse_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"

 situation_dynastic_cycle_phase_hd_standoff: "鼎足对峙"
 situation_dynastic_cycle_phase_hd_standoff_icon: "@tgp_dynastic_cycle_conquest_icon!$situation_dynastic_cycle_phase_hd_standoff$"
 situation_dynastic_cycle_phase_hd_standoff_desc_short: "群雄已定，诸强割据一方，互相牵制，天下陷入漫长的对峙。"
 situation_dynastic_cycle_phase_hd_standoff_desc: "$situation_dynastic_cycle_phase_hd_standoff_desc_short$\n\n对峙期中宣战代价高昂，各方更倾向于休养生息。若强藩并起、幼主继位或四夷入寇得逞，天下将重归群雄逐鹿。\n\n唯有控制汉地八成伯爵领、已加冕并具备足够威望或正统的统治者，方可终结乱世。"
 dynastic_cycle_situation_dynastic_cycle_phase_hd_standoff_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"

