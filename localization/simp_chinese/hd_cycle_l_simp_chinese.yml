 hd_famine.0001.t: "岁大饥"
 hd_famine.0001.desc: "治下多地颗粒无收，粮价一日三涨，城外饥民扶老携幼，沿路乞食。官吏们捧着灾报候在堂下，等你示下。"
 hd_famine.0001.a: "开仓放粮，以活饥民。"
 hd_famine.0001.b: "灾年亦须催科，以充府库。"
 hd_famine.0001.c: "天灾非人力可挽。"

