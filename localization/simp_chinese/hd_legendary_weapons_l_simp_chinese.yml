l_simp_chinese:
 hd_cixiong_shuanggujian_name:0 "雌雄双股剑"
 hd_cixiong_shuanggujian_description:0 "一对形制相异而气韵相合的长剑，雄剑厚重，雌剑轻灵，可分可合。相传刘备素爱此剑，常将二剑并执于一手，以此号令义众、扶危济困。"
 hd_zhangba_shemao_name:0 "丈八蛇矛"
 hd_zhangba_shemao_description:0 "矛长丈八，锋刃蜿蜒如游蛇，长柄沉稳，进退之间变化难测。此矛最宜张飞那般刚猛无前的勇士，可于万军之中破阵夺旗。"
 hd_liangyin_qiang_name:0 "亮银枪"
 hd_liangyin_qiang_description:0 "枪身银亮，锋刃清寒，装饰简洁而不失锐气。赵云持之临阵，枪影往复如流光，守御周全而攻势迅疾。"
 hd_shenwei_longdan_qiang_name:0 "神威龙胆枪"
 hd_shenwei_longdan_qiang_description:0 "良工以精铁与白银层层镶嵌而成的长枪，枪锋与吞口相接处宛如银龙昂首。临阵举之，威仪足以震慑敌胆；藏于武库，亦堪为传家重宝。"
 hd_hao_longdan_name:0 "豪龙胆"
 hd_hao_longdan_description:0 "枪刃宽阔挺拔，金纹沿锋脊盘旋而上，刚健之中自有华贵气象。此枪重在一击破敌，最能彰显持枪者的胆略与武名。"
 hd_wushuang_fangtian_huaji_name:0 "无双方天画戟"
 hd_wushuang_fangtian_huaji_description:0 "戟锋高耸，两侧月牙旁刃舒展如翼，通体透出凌厉的杀伐之气。相传唯有吕布那般膂力绝伦之人，方能将它舞动如飞。"
