 WJ_nickname_han_nick_the_chronicler: "秉笔"
 WJ_nickname_native_nick_the_chronicler: "撰史者"
 nick_the_chronicler_desc: "[CHARACTER.Custom('WJ_nick_the_chronicler_desc')]"
 WJ_nickname_han_nick_the_chronicler_desc: "勤记时事，留心掌故，以著述闻名。"
 WJ_nickname_native_nick_the_chronicler_desc: "子孙后代定会庆幸于[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]对文献记载一丝不苟的发掘。"

 nick_the_truthseeker: "[CHARACTER.Custom('WJ_nick_the_truthseeker')]"
 WJ_nickname_han_nick_the_truthseeker: "求实"
 WJ_nickname_native_nick_the_truthseeker: "求真者"
 nick_the_truthseeker_desc: "[CHARACTER.Custom('WJ_nick_the_truthseeker_desc')]"
 WJ_nickname_han_nick_the_truthseeker_desc: "追问实情，不轻信浮言，务求明白事理。"
 WJ_nickname_native_nick_the_truthseeker_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]以追求真相闻名于世，无论结果如何，也无论代价如何。"

 nick_the_sage: "[CHARACTER.Custom('WJ_nick_the_sage')]"
 WJ_nickname_han_nick_the_sage: "睿识"
 WJ_nickname_native_nick_the_sage: "智者"
 nick_the_sage_desc: "[CHARACTER.Custom('WJ_nick_the_sage_desc')]"
 WJ_nickname_han_nick_the_sage_desc: "见识过人，常能洞察常人未见之理。"
 WJ_nickname_native_nick_the_sage_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]知识渊博，而且非常乐意将知识传授给年轻人。"

 nick_the_historian: "[CHARACTER.Custom('WJ_nick_the_historian')]"
 WJ_nickname_han_nick_the_historian: "博古"
 WJ_nickname_native_nick_the_historian: "史学家"
 nick_the_historian_desc: "[CHARACTER.Custom('WJ_nick_the_historian_desc')]"
 WJ_nickname_han_nick_the_historian_desc: "熟悉旧事，勤究史籍，掌故之学为人所重。"
 WJ_nickname_native_nick_the_historian_desc: "那些试都不试下从历史中学习的人注定要重蹈覆辙。"

 nick_the_sly: "[CHARACTER.Custom('WJ_nick_the_sly')]"
 WJ_nickname_han_nick_the_sly: "狡黠"
 WJ_nickname_native_nick_the_sly: "狡黠者"
 nick_the_sly_desc: "[CHARACTER.Custom('WJ_nick_the_sly_desc')]"
 WJ_nickname_han_nick_the_sly_desc: "心计灵巧，言行常藏机锋。"
 WJ_nickname_native_nick_the_sly_desc: "嗯？哦，那神情？没什么。别担心。"

 nick_the_peaceful: "[CHARACTER.Custom('WJ_nick_the_peaceful')]"
 WJ_nickname_han_nick_the_peaceful: "尚和"
 WJ_nickname_native_nick_the_peaceful: "和平者"
 nick_the_peaceful_desc: "[CHARACTER.Custom('WJ_nick_the_peaceful_desc')]"
 WJ_nickname_han_nick_the_peaceful_desc: "不喜争斗，乐见相安，以和善闻名。"
 WJ_nickname_native_nick_the_peaceful_desc: "我们就不能和睦相处吗？"

 nick_the_builder: "[CHARACTER.Custom('WJ_nick_the_builder')]"
 WJ_nickname_han_nick_the_builder: "兴造"
 WJ_nickname_native_nick_the_builder: "建造者"
 nick_the_builder_desc: "[CHARACTER.Custom('WJ_nick_the_builder_desc')]"
 WJ_nickname_han_nick_the_builder_desc: "兴工营建，多有建树，遂以此名传于人间。"
 WJ_nickname_native_nick_the_builder_desc: "大多数统治者谈及建设他们的领土都纯粹是出于理论的角度。[Select_CString(CHARACTER.IsLocalPlayer,'你',Select_CString(CHARACTER.IsFemale,'她','他'))|U]却不一样。"

 nick_the_girthy: "[CHARACTER.Custom('WJ_nick_the_girthy')]"
 WJ_nickname_han_nick_the_girthy: "壮硕"
 WJ_nickname_native_nick_the_girthy: "膀大腰圆者"
 nick_the_girthy_desc: "[CHARACTER.Custom('WJ_nick_the_girthy_desc')]"
 WJ_nickname_han_nick_the_girthy_desc: "膀阔腰粗，体格壮硕，颇为引人注目。"
 WJ_nickname_native_nick_the_girthy_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U]庞然的体型、扛揍的块头和巨大的体重是[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]所造访的每一个城镇的话题。"

 nick_the_vanquisher: "[CHARACTER.Custom('WJ_nick_the_vanquisher')]"
 WJ_nickname_han_nick_the_vanquisher: "克敌"
 WJ_nickname_native_nick_the_vanquisher: "克胜者"
 nick_the_vanquisher_desc: "[CHARACTER.Custom('WJ_nick_the_vanquisher_desc')]"
 WJ_nickname_han_nick_the_vanquisher_desc: "击破强敌，战功为众人所传颂。"
 WJ_nickname_native_nick_the_vanquisher_desc: "让所有有意反对[CHARACTER.GetShortUINameNoTooltipNoFormat]的人都放马过来吧——[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]就是[CHARACTER.GetFaith.DeathDeityName]的镰刀。"

 nick_the_bloody: "[CHARACTER.Custom('WJ_nick_the_bloody')]"
 WJ_nickname_han_nick_the_bloody: "嗜血"
 WJ_nickname_native_nick_the_bloody: "嗜血者"
 nick_the_bloody_desc: "[CHARACTER.Custom('WJ_nick_the_bloody_desc')]"
 WJ_nickname_han_nick_the_bloody_desc: "杀戮之名广为流传，令人不寒而栗。"
 WJ_nickname_native_nick_the_bloody_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]不会被一点点麻烦所吓倒——不管以前有过多少人被这吓倒过。"

 nick_the_shy: "[CHARACTER.Custom('WJ_nick_the_shy')]"
 WJ_nickname_han_nick_the_shy: "含羞"
 WJ_nickname_native_nick_the_shy: "害羞之人"
 nick_the_shy_desc: "[CHARACTER.Custom('WJ_nick_the_shy_desc')]"
 WJ_nickname_han_nick_the_shy_desc: "面对众人常有羞怯之态，不善自显。"
 WJ_nickname_native_nick_the_shy_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]的露面是如此少见，以至于[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的名祖就是大多数人关于[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]所知的全部信息了。"

 nick_the_oppressor: "[CHARACTER.Custom('WJ_nick_the_oppressor')]"
 WJ_nickname_han_nick_the_oppressor: "苛虐"
 WJ_nickname_native_nick_the_oppressor: "压迫者"
 nick_the_oppressor_desc: "[CHARACTER.Custom('WJ_nick_the_oppressor_desc')]"
 WJ_nickname_han_nick_the_oppressor_desc: "压迫治下之人，苛刻之名令人怨恨。"
 WJ_nickname_native_nick_the_oppressor_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]并不是[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]臣民有过的最广为传颂的统治者。"

 nick_the_defiant: "[CHARACTER.Custom('WJ_nick_the_defiant')]"
 WJ_nickname_han_nick_the_defiant: "抗命"
 WJ_nickname_native_nick_the_defiant: "狂傲者"
 nick_the_defiant_desc: "[CHARACTER.Custom('WJ_nick_the_defiant_desc')]"
 WJ_nickname_han_nick_the_defiant_desc: "不肯顺从，屡与权威相抗。"
 WJ_nickname_native_nick_the_defiant_desc: "让他们来，让他们全都来！[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U]的道就是正道，[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]会杀掉尽可能的人来证明这一点！"

 nick_the_stonefaced: "[CHARACTER.Custom('WJ_nick_the_stonefaced')]"
 WJ_nickname_han_nick_the_stonefaced: "铁面"
 WJ_nickname_native_nick_the_stonefaced: "面瘫脸"
 nick_the_stonefaced_desc: "[CHARACTER.Custom('WJ_nick_the_stonefaced_desc')]"
 WJ_nickname_han_nick_the_stonefaced_desc: "神情冷峻，喜怒不露于面。"
 WJ_nickname_native_nick_the_stonefaced_desc: "笑一个。拜托？就一次？"

 nick_the_joyless: "[CHARACTER.Custom('WJ_nick_the_joyless')]"
 WJ_nickname_han_nick_the_joyless: "少欢"
 WJ_nickname_native_nick_the_joyless: "毫无幽默者"
 nick_the_joyless_desc: "[CHARACTER.Custom('WJ_nick_the_joyless_desc')]"
 WJ_nickname_han_nick_the_joyless_desc: "少见欢容，亦不喜他人戏谑。"
 WJ_nickname_native_nick_the_joyless_desc: "任何成天与[CHARACTER.GetShortUINameNoTooltipNoFormat]打交道的人很快就会学会在措辞上准确无误，因为[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]可以理解的东西不能有丝毫偏差。"

 nick_lacks_laughs: "[CHARACTER.Custom('WJ_nick_lacks_laughs')]"
 WJ_nickname_han_nick_lacks_laughs: "不苟笑"
 WJ_nickname_native_nick_lacks_laughs: "不苟言笑者"
 nick_lacks_laughs_desc: "[CHARACTER.Custom('WJ_nick_lacks_laughs_desc')]"
 WJ_nickname_han_nick_lacks_laughs_desc: "平日罕有笑容，众人便以此相称。"
 WJ_nickname_native_nick_lacks_laughs_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]是出了名地严肃，据说[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]直到完全成年，才听到一声人笑。[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]还以为是他们恶疾发作了。"

 nick_the_dull: "[CHARACTER.Custom('WJ_nick_the_dull')]"
 WJ_nickname_han_nick_the_dull: "木讷"
 WJ_nickname_native_nick_the_dull: "木讷脸"
 nick_the_dull_desc: "[CHARACTER.Custom('WJ_nick_the_dull_desc')]"
 WJ_nickname_han_nick_the_dull_desc: "言语迟缓，不善应对，显得少有机锋。"
 WJ_nickname_native_nick_the_dull_desc: "没有人真正记得[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]第一次被称为“$nick_the_dull$”的确切原因。所有人都一致认为这真的不值得被记住。"

 nick_the_wary: "[CHARACTER.Custom('WJ_nick_the_wary')]"
 WJ_nickname_han_nick_the_wary: "谨慎"
 WJ_nickname_native_nick_the_wary: "慎重者"
 nick_the_wary_desc: "[CHARACTER.Custom('WJ_nick_the_wary_desc')]"
 WJ_nickname_han_nick_the_wary_desc: "行事常留余地，不轻涉险境。"
 WJ_nickname_native_nick_the_wary_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat]那乱瞟的[CHARACTER.Custom('EyeEyes')]和多疑的表情是人们对[Select_CString(CHARACTER.IsLocalPlayer,'你',Select_CString(CHARACTER.IsFemale,'她','他'))|U]印象最深的地方。"

 nick_the_wake: "[CHARACTER.Custom('WJ_nick_the_wake')]"
 WJ_nickname_han_nick_the_wake: "警敏"
 WJ_nickname_native_nick_the_wake: "警觉者"
 nick_the_wake_desc: "[CHARACTER.Custom('WJ_nick_the_wake_desc')]"
 WJ_nickname_han_nick_the_wake_desc: "常怀警觉，善察近旁动静。"
 WJ_nickname_native_nick_the_wake_desc: "[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的[CHARACTER.Custom('EyeEyes')|U]时刻警惕着不公，只有一提起这名号，外国的征服者和本地的叛徒都会感到战栗！"

 nick_the_linguist: "[CHARACTER.Custom('WJ_nick_the_linguist')]"
 WJ_nickname_han_nick_the_linguist: "通语"
 WJ_nickname_native_nick_the_linguist: "语言学家"
 nick_the_linguist_desc: "[CHARACTER.Custom('WJ_nick_the_linguist_desc')]"
 WJ_nickname_han_nick_the_linguist_desc: "熟谙多种语言，往来异乡亦能与人交谈。"
 WJ_nickname_native_nick_the_linguist_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]会说的语言比[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]一些臣民的牙都要多。"

 nick_the_clumsy: "[CHARACTER.Custom('WJ_nick_the_clumsy')]"
 WJ_nickname_han_nick_the_clumsy: "笨拙"
 WJ_nickname_native_nick_the_clumsy: "笨拙者"
 nick_the_clumsy_desc: "[CHARACTER.Custom('WJ_nick_the_clumsy_desc')]"
 WJ_nickname_han_nick_the_clumsy_desc: "动作欠灵巧，做事常有失手。"
 WJ_nickname_native_nick_the_clumsy_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]并不十分以[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的灵巧著称。"

 nick_the_graceful: "[CHARACTER.Custom('WJ_nick_the_graceful')]"
 WJ_nickname_han_nick_the_graceful: "风雅"
 WJ_nickname_native_nick_the_graceful: "雅士"
 nick_the_graceful_desc: "[CHARACTER.Custom('WJ_nick_the_graceful_desc')]"
 WJ_nickname_han_nick_the_graceful_desc: "举止文雅，进退有度，使人见之心悦。"
 WJ_nickname_native_nick_the_graceful_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U]的步态，[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的言谈，[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]纯粹的#EMP 仪表#!令旁观者交口称赞。"

 nick_the_heart_throb: "[CHARACTER.Custom('WJ_nick_the_heart_throb')]"
 WJ_nickname_han_nick_the_heart_throb: "倾心"
 WJ_nickname_native_nick_the_heart_throb: "万人迷"
 nick_the_heart_throb_desc: "[CHARACTER.Custom('WJ_nick_the_heart_throb_desc')]"
 WJ_nickname_han_nick_the_heart_throb_desc: "风姿动人，常使旁人心生爱慕。"
 WJ_nickname_native_nick_the_heart_throb_desc: "凡[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]所到之处很少有人会不怦然心动的。"

 nick_the_blushing: "[CHARACTER.Custom('WJ_nick_the_blushing')]"
 WJ_nickname_han_nick_the_blushing: "赧颜"
 WJ_nickname_native_nick_the_blushing: "赧颜者"
 nick_the_blushing_desc: "[CHARACTER.Custom('WJ_nick_the_blushing_desc')]"
 WJ_nickname_han_nick_the_blushing_desc: "一经注目便易红面，故有此称。"
 WJ_nickname_native_nick_the_blushing_desc: "社交场合有办法让[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的脸颊红得发亮。"

 nick_the_eloquent: "[CHARACTER.Custom('WJ_nick_the_eloquent')]"
 WJ_nickname_han_nick_the_eloquent: "善辩"
 WJ_nickname_native_nick_the_eloquent: "雄辩家"
 nick_the_eloquent_desc: "[CHARACTER.Custom('WJ_nick_the_eloquent_desc')]"
 WJ_nickname_han_nick_the_eloquent_desc: "口才敏捷，能以言辞服人。"
 WJ_nickname_native_nick_the_eloquent_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U]的言谈与[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的举止一样不凡。"

 nick_the_pragmatic: "[CHARACTER.Custom('WJ_nick_the_pragmatic')]"
 WJ_nickname_han_nick_the_pragmatic: "务实"
 WJ_nickname_native_nick_the_pragmatic: "务实者"
 nick_the_pragmatic_desc: "[CHARACTER.Custom('WJ_nick_the_pragmatic_desc')]"
 WJ_nickname_han_nick_the_pragmatic_desc: "重实际成效，不喜空言虚饰。"
 WJ_nickname_native_nick_the_pragmatic_desc: "最佳的解决方法就是当下最合适的解决方法。"

 nick_the_equitable: "[CHARACTER.Custom('WJ_nick_the_equitable')]"
 WJ_nickname_han_nick_the_equitable: "平允"
 WJ_nickname_native_nick_the_equitable: "衡平者"
 nick_the_equitable_desc: "[CHARACTER.Custom('WJ_nick_the_equitable_desc')]"
 WJ_nickname_han_nick_the_equitable_desc: "权衡得当，待人不偏，以公平著称。"
 WJ_nickname_native_nick_the_equitable_desc: "公平公正、不偏不倚的分割是[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]在所有事物上的偏好。"

 nick_the_thoughtless: "[CHARACTER.Custom('WJ_nick_the_thoughtless')]"
 WJ_nickname_han_nick_the_thoughtless: "少虑"
 WJ_nickname_native_nick_the_thoughtless: "不思者"
 nick_the_thoughtless_desc: "[CHARACTER.Custom('WJ_nick_the_thoughtless_desc')]"
 WJ_nickname_han_nick_the_thoughtless_desc: "行事欠缺思量，常未及深究便贸然行动。"
 WJ_nickname_native_nick_the_thoughtless_desc: "据说[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]不仅仅是在思考前就把话说出口——而是[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]根本就不思考。"

 nick_the_craven: "[CHARACTER.Custom('WJ_nick_the_craven')]"
 WJ_nickname_han_nick_the_craven: "怯阵"
 WJ_nickname_native_nick_the_craven: "怯懦者"
 nick_the_craven_desc: "[CHARACTER.Custom('WJ_nick_the_craven_desc')]"
 WJ_nickname_han_nick_the_craven_desc: "遇险畏惧，临阵退缩，勇名难立。"
 WJ_nickname_native_nick_the_craven_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]向来觉得智虑才是勇敢的最大要素。"

 nick_the_naysayer: "[CHARACTER.Custom('WJ_nick_the_naysayer')]"
 WJ_nickname_han_nick_the_naysayer: "好非"
 WJ_nickname_native_nick_the_naysayer: "唱反调者"
 nick_the_naysayer_desc: "[CHARACTER.Custom('WJ_nick_the_naysayer_desc')]"
 WJ_nickname_han_nick_the_naysayer_desc: "每逢议论便多有异词，惯于驳人所言。"
 WJ_nickname_native_nick_the_naysayer_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]站在[CHARACTER.GetFaith.HighGodName]和世界面前，背叛了[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]所做出的神圣承诺。"

 nick_the_resilient: "[CHARACTER.Custom('WJ_nick_the_resilient')]"
 WJ_nickname_han_nick_the_resilient: "坚忍"
 WJ_nickname_native_nick_the_resilient: "坚韧不拔者"
 nick_the_resilient_desc: "[CHARACTER.Custom('WJ_nick_the_resilient_desc')]"
 WJ_nickname_han_nick_the_resilient_desc: "能耐困厄，不轻言弃，久而为人所敬。"
 WJ_nickname_native_nick_the_resilient_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]在受到许多永久性伤害后表现出了极强的韧性，因此人们称[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]为“[CHARACTER.GetNicknameNoTooltip]”。"

 nick_the_persevering: "[CHARACTER.Custom('WJ_nick_the_persevering')]"
 WJ_nickname_han_nick_the_persevering: "笃行"
 WJ_nickname_native_nick_the_persevering: "百折不挠者"
 nick_the_persevering_desc: "[CHARACTER.Custom('WJ_nick_the_persevering_desc')]"
 WJ_nickname_han_nick_the_persevering_desc: "认定所行之事，便持之以恒，少有懈怠。"
 WJ_nickname_native_nick_the_persevering_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]在受到许多永久性伤害后表现出了极强的韧性，因此人们称[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]为“[CHARACTER.GetNicknameNoTooltip]”。"

 nick_the_ill_ruler: "[CHARACTER.Custom('WJ_nick_the_ill_ruler')]"
 WJ_nickname_han_nick_the_ill_ruler: "失政"
 WJ_nickname_native_nick_the_ill_ruler: "不称职者"
 nick_the_ill_ruler_desc: "[CHARACTER.Custom('WJ_nick_the_ill_ruler_desc')]"
 WJ_nickname_han_nick_the_ill_ruler_desc: "治理无方，政事多有失误，声名因此受损。"
