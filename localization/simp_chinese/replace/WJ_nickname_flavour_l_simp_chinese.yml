 WJ_nickname_native_nick_the_pirate_queen_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]，诸海之恐怖，所有胆敢冒险进入水域者都心怀畏惧。"

 nick_the_rhymer: "[CHARACTER.Custom('WJ_nick_the_rhymer')]"
 WJ_nickname_han_nick_the_rhymer: "吟章"
 WJ_nickname_native_nick_the_rhymer: "作韵诗者"
 nick_the_rhymer_desc: "[CHARACTER.Custom('WJ_nick_the_rhymer_desc')]"
 WJ_nickname_han_nick_the_rhymer_desc: "喜作韵文，以吟咏之事为人所知。"
 WJ_nickname_native_nick_the_rhymer_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat]拥有写出头韵和对仗的眼光，因为精炼的遣词造句而受其同行尊崇。"

 nick_the_elegist: "[CHARACTER.Custom('WJ_nick_the_elegist')]"
 WJ_nickname_han_nick_the_elegist: "哀吟"
 WJ_nickname_native_nick_the_elegist: "作挽歌者"
 nick_the_elegist_desc: "[CHARACTER.Custom('WJ_nick_the_elegist_desc')]"
 WJ_nickname_han_nick_the_elegist_desc: "擅作哀挽之篇，悲声令人动容。"
 WJ_nickname_native_nick_the_elegist_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat]以悲伤忧郁的诗句闻名于世，即使最铁石心肠的听众也会热泪盈眶。"

 nick_the_poetaster: "[CHARACTER.Custom('WJ_nick_the_poetaster')]"
 WJ_nickname_han_nick_the_poetaster: "拙诗"
 WJ_nickname_native_nick_the_poetaster: "蹩脚诗人"
 nick_the_poetaster_desc: "[CHARACTER.Custom('WJ_nick_the_poetaster_desc')]"
 WJ_nickname_han_nick_the_poetaster_desc: "好作诗文而才力不逮，遂遭此讥。"
 WJ_nickname_native_nick_the_poetaster_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat]的诗作很有名，但也许不是出于其想要的原因。"

 nick_the_corpulent: "[CHARACTER.Custom('WJ_nick_the_corpulent')]"
 WJ_nickname_han_nick_the_corpulent: "腴硕"
 WJ_nickname_native_nick_the_corpulent: "臃肿者"
 nick_the_corpulent_desc: "[CHARACTER.Custom('WJ_nick_the_corpulent_desc')]"
 WJ_nickname_han_nick_the_corpulent_desc: "体态肥厚，世人常以其形貌相称。"
 WJ_nickname_native_nick_the_corpulent_desc: "马匹和地板都在[CHARACTER.GetShortUINameNoTooltipNoFormat]这坨全是脂肪的肉山之下颤抖。"

 nick_the_insubordinate: "[CHARACTER.Custom('WJ_nick_the_insubordinate')]"
 WJ_nickname_han_nick_the_insubordinate: "桀骜"
 WJ_nickname_native_nick_the_insubordinate: "违命者"
 nick_the_insubordinate_desc: "[CHARACTER.Custom('WJ_nick_the_insubordinate_desc')]"
 WJ_nickname_han_nick_the_insubordinate_desc: "不肯驯服，屡违上命，傲气为众人所知。"
 WJ_nickname_native_nick_the_insubordinate_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]时刻做好了反抗和报复的准备，是个糟糕的仆人和不忠不信的封臣。"

 nick_the_backstabber: "[CHARACTER.Custom('WJ_nick_the_backstabber')]"
 WJ_nickname_han_nick_the_backstabber: "暗害"
 WJ_nickname_native_nick_the_backstabber: "背刺者"
 nick_the_backstabber_desc: "[CHARACTER.Custom('WJ_nick_the_backstabber_desc')]"
 WJ_nickname_han_nick_the_backstabber_desc: "惯在背后伤人，旧交亦不敢轻信。"
 WJ_nickname_native_nick_the_backstabber_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat]下令将许多字面或比喻意义上的利刃插进了别人的肩胛骨。"

 nick_the_corrupt: "[CHARACTER.Custom('WJ_nick_the_corrupt')]"
 WJ_nickname_han_nick_the_corrupt: "贪墨"
 WJ_nickname_native_nick_the_corrupt: "腐化者"
 nick_the_corrupt_desc: "[CHARACTER.Custom('WJ_nick_the_corrupt_desc')]"
 WJ_nickname_han_nick_the_corrupt_desc: "以权谋私，污秽之名已难掩饰。"
 WJ_nickname_native_nick_the_corrupt_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]是个聪明的家伙，蹲在一堆来源不明的黄金财宝上。"

 nick_the_incompetent: "[CHARACTER.Custom('WJ_nick_the_incompetent')]"
 WJ_nickname_han_nick_the_incompetent: "不才"
 WJ_nickname_native_nick_the_incompetent: "无能者"
 nick_the_incompetent_desc: "[CHARACTER.Custom('WJ_nick_the_incompetent_desc')]"
 WJ_nickname_han_nick_the_incompetent_desc: "处事无能，难当所托，故有此讥。"
 WJ_nickname_native_nick_the_incompetent_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]并不太适合掌握突然被塞进[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]手里的权力和责任。"

 nick_the_obscene: "[CHARACTER.Custom('WJ_nick_the_obscene')]"
 WJ_nickname_han_nick_the_obscene: "秽言"
 WJ_nickname_native_nick_the_obscene: "秽语者"
 nick_the_obscene_desc: "[CHARACTER.Custom('WJ_nick_the_obscene_desc')]"
 WJ_nickname_han_nick_the_obscene_desc: "言语粗秽，不知收敛，令人侧目。"
 WJ_nickname_native_nick_the_obscene_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]以直白嘴臭的粗俗而臭名昭著。纯洁的人在听力所及的范围内都活不下去。"

 nick_the_unfortunate: "[CHARACTER.Custom('WJ_nick_the_unfortunate')]"
 WJ_nickname_han_nick_the_unfortunate: "困厄"
 WJ_nickname_native_nick_the_unfortunate: "不幸者"
 nick_the_unfortunate_desc: "[CHARACTER.Custom('WJ_nick_the_unfortunate_desc')]"
 WJ_nickname_han_nick_the_unfortunate_desc: "遭遇多难，常为时势所困。"
 WJ_nickname_native_nick_the_unfortunate_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat]的存在本身就……非常不幸。站在[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]旌旗的阴影之下会浑身不舒服。"

 nick_the_exile: "[CHARACTER.Custom('WJ_nick_the_exile')]"
 WJ_nickname_han_nick_the_exile: "逐客"
 WJ_nickname_native_nick_the_exile: "流亡者"
 nick_the_exile_desc: "[CHARACTER.Custom('WJ_nick_the_exile_desc')]"
 WJ_nickname_han_nick_the_exile_desc: "离乡流亡，故国与旧事皆成身外。"
 WJ_nickname_native_nick_the_exile_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]不是被赶出了[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的祖国，就是为了逃避某些意料之外的负担而离去，到国外寻求庇护。"

 nick_the_mapmaker: "[CHARACTER.Custom('WJ_nick_the_mapmaker')]"
 WJ_nickname_han_nick_the_mapmaker: "绘舆"
 WJ_nickname_native_nick_the_mapmaker: "地图绘制者"
 nick_the_mapmaker_desc: "[CHARACTER.Custom('WJ_nick_the_mapmaker_desc')]"
 WJ_nickname_han_nick_the_mapmaker_desc: "勤于测绘山川道路，以制图之才闻名。"
 WJ_nickname_native_nick_the_mapmaker_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]不仅以游历广泛，还以花了相当多的时间为[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]所到访的地区绘制地图而闻名。"

 nick_the_ploughman: "[CHARACTER.Custom('WJ_nick_the_ploughman')]"
 WJ_nickname_han_nick_the_ploughman: "力田"
 WJ_nickname_native_nick_the_ploughman: "耕地者"
 nick_the_ploughman_desc: "[CHARACTER.Custom('WJ_nick_the_ploughman_desc')]"
 WJ_nickname_han_nick_the_ploughman_desc: "亲近田亩，勤于耕作，以务农之事见称。"
 WJ_nickname_native_nick_the_ploughman_desc: "当使者前来传[CHARACTER.GetShortUINameNoTooltipNoFormat|U]登位时，[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]还只不过是一介犁地的卑微农民。"

 nick_the_dreadful: "[CHARACTER.Custom('WJ_nick_the_dreadful')]"
 WJ_nickname_han_nick_the_dreadful: "凶威"
 WJ_nickname_native_nick_the_dreadful: "恐怖者"
 nick_the_dreadful_desc: "[CHARACTER.Custom('WJ_nick_the_dreadful_desc')]"
 WJ_nickname_han_nick_the_dreadful_desc: "威势可怖，使人闻名而心生畏惧。"
 WJ_nickname_native_nick_the_dreadful_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]相信只有恐惧才能带来尊重。"

 nick_the_rich: "[CHARACTER.Custom('WJ_nick_the_rich')]"
 WJ_nickname_han_nick_the_rich: "富赀"
 WJ_nickname_native_nick_the_rich: "富豪"
 nick_the_rich_desc: "[CHARACTER.Custom('WJ_nick_the_rich_desc')]"
 WJ_nickname_han_nick_the_rich_desc: "资财丰厚，富有之名远近皆知。"
 WJ_nickname_native_nick_the_rich_desc: "关于[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat]坐拥巨富、生活奢靡的名声早已传开。"

 nick_the_wonderful: "[CHARACTER.Custom('WJ_nick_the_wonderful')]"
 WJ_nickname_han_nick_the_wonderful: "嘉誉"
 WJ_nickname_native_nick_the_wonderful: "受誉者"
 nick_the_wonderful_desc: "[CHARACTER.Custom('WJ_nick_the_wonderful_desc')]"
 WJ_nickname_han_nick_the_wonderful_desc: "才行或功绩受到称誉，美名由此传开。"
 WJ_nickname_native_nick_the_wonderful_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat]的事迹让[CHARACTER.GetHerHim]赢得了民众的尊重。"

 nick_the_scribe: "[CHARACTER.Custom('WJ_nick_the_scribe')]"
 WJ_nickname_han_nick_the_scribe: "善书"
 WJ_nickname_native_nick_the_scribe: "书吏"
 nick_the_scribe_desc: "[CHARACTER.Custom('WJ_nick_the_scribe_desc')]"
 WJ_nickname_han_nick_the_scribe_desc: "以书写录事之才为人所知。"
 WJ_nickname_native_nick_the_scribe_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat]的手所抄写过、翻译过、誊写过的智慧在整片土地上都受人尊崇。"

