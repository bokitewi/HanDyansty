l_simp_chinese:
 # 2026-11-01: 通用绰号汉式名称及说明；原生历史专名、公王庙谥不改。
 # 非汉式人物沿原文；只在基础绰号键分流，不改取得事件、绰号定义或人物变量。
 WJ_nickname_han: "汉式绰号"
 WJ_nickname_native: "原生绰号"

 nick_the_affable: "[CHARACTER.Custom('WJ_nick_the_affable')]"
 WJ_nickname_han_nick_the_affable: "和易"
 WJ_nickname_native_nick_the_affable: "和蔼者"
 nick_the_affable_desc: "[CHARACTER.Custom('WJ_nick_the_affable_desc')]"
 WJ_nickname_han_nick_the_affable_desc: "待人和易，言语亲切，众人乐于与之相交。"
 WJ_nickname_native_nick_the_affable_desc: "冷静，随和，友善。[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]并不介意人们用什么别称来称呼[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]，但还好，几乎总是#EMP 美称#!。"

 nick_the_avenger: "[CHARACTER.Custom('WJ_nick_the_avenger')]"
 WJ_nickname_han_nick_the_avenger: "雪耻"
 WJ_nickname_native_nick_the_avenger: "复仇者"
 nick_the_avenger_desc: "[CHARACTER.Custom('WJ_nick_the_avenger_desc')]"
 WJ_nickname_han_nick_the_avenger_desc: "旧怨未尝忘怀，终以复仇雪耻闻名。"
 WJ_nickname_native_nick_the_avenger_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U]的敌人知道[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]是一股为了公正不惜一切代价且不依不饶的力量。"

 nick_the_bald: "[CHARACTER.Custom('WJ_nick_the_bald')]"
 WJ_nickname_han_nick_the_bald: "秃顶"
 WJ_nickname_native_nick_the_bald: "秃头"
 nick_the_bald_desc: "[CHARACTER.Custom('WJ_nick_the_bald_desc')]"
 WJ_nickname_han_nick_the_bald_desc: "顶上青丝早疏，世人遂以此相称。"
 WJ_nickname_native_nick_the_bald_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]头顶光秃秃一片，而且人们似乎都不想让[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]忘记这一点。"

 nick_the_bald_ironic: "[CHARACTER.Custom('WJ_nick_the_bald_ironic')]"
 WJ_nickname_han_nick_the_bald_ironic: "秃顶"
 WJ_nickname_native_nick_the_bald_ironic: "$nick_the_bald$"
 nick_the_bald_ironic_desc: "[CHARACTER.Custom('WJ_nick_the_bald_ironic_desc')]"
 WJ_nickname_han_nick_the_bald_ironic_desc: "世人偏取反语，将这一称呼传作笑谈。"
 WJ_nickname_native_nick_the_bald_ironic_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]在[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]一生中有很长一段时间没有一顶合适的冠冕来装饰[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的头顶，而宫里人拒绝让[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]忘记这一点。"

 nick_the_betrayer: "[CHARACTER.Custom('WJ_nick_the_betrayer')]"
 WJ_nickname_han_nick_the_betrayer: "背盟"
 WJ_nickname_native_nick_the_betrayer: "背叛者"
 nick_the_betrayer_desc: "[CHARACTER.Custom('WJ_nick_the_betrayer_desc')]"
 WJ_nickname_han_nick_the_betrayer_desc: "屡负所托，背盟弃信，名声由此而来。"
 WJ_nickname_native_nick_the_betrayer_desc: "所有人都知道[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的所作所为。"

 nick_the_black: "[CHARACTER.Custom('WJ_nick_the_black')]"
 WJ_nickname_han_nick_the_black: "玄鸦"
 WJ_nickname_native_nick_the_black: "黑暗者"
 nick_the_black_desc: "[CHARACTER.Custom('WJ_nick_the_black_desc')]"
 WJ_nickname_han_nick_the_black_desc: "阴沉难测的声名，仿佛暗处盘旋的玄鸦。"
 WJ_nickname_native_nick_the_black_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat]残忍的态度、人所共知的不公平交易，以及对同胞各方面的可憎举止，让[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]声名狼藉。"

 nick_the_bold: "[CHARACTER.Custom('WJ_nick_the_bold')]"
 WJ_nickname_han_nick_the_bold: "骁果"
 WJ_nickname_native_nick_the_bold: "英勇者"
 nick_the_bold_desc: "[CHARACTER.Custom('WJ_nick_the_bold_desc')]"
 WJ_nickname_han_nick_the_bold_desc: "临事果决，敢于争先，胆气为众人所知。"
 WJ_nickname_native_nick_the_bold_desc: "大胆、无畏、勇敢、骁悍、英武——[CHARACTER.GetShortUINameNoTooltipNoFormat]的名字是迅速采取直接行动的同义词。甚至[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的敌人都称[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]为“$nick_the_bold$”；它至少止住了这种同义词的浪潮。"

 nick_the_boneless: "[CHARACTER.Custom('WJ_nick_the_boneless')]"
 WJ_nickname_han_nick_the_boneless: "柔骨"
 WJ_nickname_native_nick_the_boneless: "无骨者"
 nick_the_boneless_desc: "[CHARACTER.Custom('WJ_nick_the_boneless_desc')]"
 WJ_nickname_han_nick_the_boneless_desc: "身骨异于常人，遂留下这个奇特的称呼。"
 WJ_nickname_native_nick_the_boneless_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U]虚弱的身骨掩盖住了[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]凶猛的思想和精神。"

 nick_the_brave: "[CHARACTER.Custom('WJ_nick_the_brave')]"
 WJ_nickname_han_nick_the_brave: "勇烈"
 WJ_nickname_native_nick_the_brave: "勇敢者"
 nick_the_brave_desc: "[CHARACTER.Custom('WJ_nick_the_brave_desc')]"
 WJ_nickname_han_nick_the_brave_desc: "临危不退，遇敌敢当，众人称其勇烈。"
 WJ_nickname_native_nick_the_brave_desc: "无论是哆嗦的大腿还是战栗的手腕都无法阻止[CHARACTER.GetShortUINameNoTooltipNoFormat]实现[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的目标。"

 nick_the_chaste: "[CHARACTER.Custom('WJ_nick_the_chaste')]"
 WJ_nickname_han_nick_the_chaste: "守贞"
 WJ_nickname_native_nick_the_chaste: "纯洁者"
 nick_the_chaste_desc: "[CHARACTER.Custom('WJ_nick_the_chaste_desc')]"
 WJ_nickname_han_nick_the_chaste_desc: "持身谨严，不轻纵情欲，以贞洁闻名。"
 WJ_nickname_native_nick_the_chaste_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]以[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]对睡一夜好觉的偏爱而著称。"

 nick_the_confessor: "[CHARACTER.Custom('WJ_nick_the_confessor')]"
 WJ_nickname_han_nick_the_confessor: "笃信"
 WJ_nickname_native_nick_the_confessor: "忏悔者"
 nick_the_confessor_desc: "[CHARACTER.Custom('WJ_nick_the_confessor_desc')]"
 WJ_nickname_han_nick_the_confessor_desc: "守持信仰，历困不改，众人因此称道。"
 WJ_nickname_native_nick_the_confessor_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]以[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]对哪怕是最轻微的罪过都痛悔而著称。"

 nick_the_conqueror: "[CHARACTER.Custom('WJ_nick_the_conqueror')]"
 WJ_nickname_han_nick_the_conqueror: "拓疆"
 WJ_nickname_native_nick_the_conqueror: "征服者"
 nick_the_conqueror_desc: "[CHARACTER.Custom('WJ_nick_the_conqueror_desc')]"
 WJ_nickname_han_nick_the_conqueror_desc: "屡以兵锋开拓疆土，声威传遍四方。"
 WJ_nickname_native_nick_the_conqueror_desc: "还有什么载入史册的事迹能比降服#EMP 一整个#!国家更伟大的吗？[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]当然不会让人们忘记[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的成就。"

 nick_the_cruel: "[CHARACTER.Custom('WJ_nick_the_cruel')]"
 WJ_nickname_han_nick_the_cruel: "酷烈"
 WJ_nickname_native_nick_the_cruel: "残忍者"
 nick_the_cruel_desc: "[CHARACTER.Custom('WJ_nick_the_cruel_desc')]"
 WJ_nickname_han_nick_the_cruel_desc: "行事严酷，不恤人命，使人闻名生畏。"
 WJ_nickname_native_nick_the_cruel_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]认为[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的性格相当阳光，真的。人们只是无法领会[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的#EMP 幽默#!感。"

 nick_the_destroyer: "[CHARACTER.Custom('WJ_nick_the_destroyer')]"
 WJ_nickname_han_nick_the_destroyer: "摧城"
 WJ_nickname_native_nick_the_destroyer: "破坏者"
 nick_the_destroyer_desc: "[CHARACTER.Custom('WJ_nick_the_destroyer_desc')]"
 WJ_nickname_han_nick_the_destroyer_desc: "所过多见残垣，摧毁之名随军而行。"
 WJ_nickname_native_nick_the_destroyer_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]以纵火焚烧地产、燃尽建筑、在土地上撒盐并留下累累尸骨而闻名。"

 nick_the_destroyer_prophecy: "[CHARACTER.Custom('WJ_nick_the_destroyer_prophecy')]"
 WJ_nickname_han_nick_the_destroyer_prophecy: "摧城"
 WJ_nickname_native_nick_the_destroyer_prophecy: "$nick_the_destroyer$"
 nick_the_destroyer_prophecy_desc: "[CHARACTER.Custom('WJ_nick_the_destroyer_prophecy_desc')]"
 WJ_nickname_han_nick_the_destroyer_prophecy_desc: "毁灭之名早已见于预言，如今更被众人传说。"
 WJ_nickname_native_nick_the_destroyer_prophecy_desc: "一个值得注意的预言赋予了[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]这个名祖。[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的命运是推翻腐败的秩序还是烧毁正义的秩序，这是一个有争议的问题。"

 nick_the_devil: "[CHARACTER.Custom('WJ_nick_the_devil')]"
 WJ_nickname_han_nick_the_devil: "凶煞"
 WJ_nickname_native_nick_the_devil: "恶魔"
 nick_the_devil_desc: "[CHARACTER.Custom('WJ_nick_the_devil_desc')]"
 WJ_nickname_han_nick_the_devil_desc: "恶名远播，世人视之如凶煞。"
 WJ_nickname_native_nick_the_devil_desc: "恶意像件斗篷一样笼罩着[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的行为，四方大地都抱着最大的恶意来想象[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的举动。"

 nick_the_drunkard: "[CHARACTER.Custom('WJ_nick_the_drunkard')]"
 WJ_nickname_han_nick_the_drunkard: "沉酣"
 WJ_nickname_native_nick_the_drunkard: "酒鬼"
 nick_the_drunkard_desc: "[CHARACTER.Custom('WJ_nick_the_drunkard_desc')]"
 WJ_nickname_han_nick_the_drunkard_desc: "常与杯中之物为伴，酒名渐胜人名。"
 WJ_nickname_native_nick_the_drunkard_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]用尽[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的一生都在寻求酒杯底部清晰可见。所有人都知道[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]永远都寻不到。"

 nick_the_fair: "[CHARACTER.Custom('WJ_nick_the_fair')]"
 WJ_nickname_han_nick_the_fair: "玉容"
 WJ_nickname_native_nick_the_fair: "美人"
 nick_the_fair_desc: "[CHARACTER.Custom('WJ_nick_the_fair_desc')]"
 WJ_nickname_han_nick_the_fair_desc: "容貌出众，见者难忘，遂有玉容之称。"
 WJ_nickname_native_nick_the_fair_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]被认为长着一张悦人眼目的面容。"

 nick_the_fat: "[CHARACTER.Custom('WJ_nick_the_fat')]"
 WJ_nickname_han_nick_the_fat: "肥硕"
 WJ_nickname_native_nick_the_fat: "胖子"
 nick_the_fat_desc: "[CHARACTER.Custom('WJ_nick_the_fat_desc')]"
 WJ_nickname_han_nick_the_fat_desc: "身躯肥硕，世人常以此相称。"
 WJ_nickname_native_nick_the_fat_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U]的双下巴号称偶尔会吐出整条鸡腿。"

 nick_the_fearless: "[CHARACTER.Custom('WJ_nick_the_fearless')]"
 WJ_nickname_han_nick_the_fearless: "无畏"
 WJ_nickname_native_nick_the_fearless: "无畏者"
 nick_the_fearless_desc: "[CHARACTER.Custom('WJ_nick_the_fearless_desc')]"
 WJ_nickname_han_nick_the_fearless_desc: "迎险而上，不见惧色，遂有无畏之名。"
 WJ_nickname_native_nick_the_fearless_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U]的士兵说他们从未见[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]有过退缩——无论是对人、对马，抑或是对飞石流矢。大多数人都相信他们说的。"

 nick_the_fowler: "[CHARACTER.Custom('WJ_nick_the_fowler')]"
 WJ_nickname_han_nick_the_fowler: "捕雀"
 WJ_nickname_native_nick_the_fowler: "捕鸟者"
 nick_the_fowler_desc: "[CHARACTER.Custom('WJ_nick_the_fowler_desc')]"
 WJ_nickname_han_nick_the_fowler_desc: "捕鸟之事广为人知，遂被用作别称。"
 WJ_nickname_native_nick_the_fowler_desc: "宫中流言传说[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]在猎捕野禽上所花的时间与[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]在治国理政上的一样多。"

 nick_the_gentle: "[CHARACTER.Custom('WJ_nick_the_gentle')]"
 WJ_nickname_han_nick_the_gentle: "温厚"
 WJ_nickname_native_nick_the_gentle: "温柔者"
 nick_the_gentle_desc: "[CHARACTER.Custom('WJ_nick_the_gentle_desc')]"
 WJ_nickname_han_nick_the_gentle_desc: "性情温和，待人宽厚，少有疾言厉色。"
 WJ_nickname_native_nick_the_gentle_desc: "当[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]做了正确的事时，人们就不确定[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]到底有没有做过了。"

 nick_the_good: "[CHARACTER.Custom('WJ_nick_the_good')]"
 WJ_nickname_han_nick_the_good: "仁善"
 WJ_nickname_native_nick_the_good: "好人"
 nick_the_good_desc: "[CHARACTER.Custom('WJ_nick_the_good_desc')]"
 WJ_nickname_han_nick_the_good_desc: "乐行善事，体恤他人，因此得名。"
 WJ_nickname_native_nick_the_good_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat]正直的品格和对[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的信仰价值观的忠诚让其他[CHARACTER.GetFaith.GetAdherentNamePluralNoTooltip]对[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]十分敬畏。"

 nick_the_gouty: "[CHARACTER.Custom('WJ_nick_the_gouty')]"
 WJ_nickname_han_nick_the_gouty: "痹足"
 WJ_nickname_native_nick_the_gouty: "痛风者"
 nick_the_gouty_desc: "[CHARACTER.Custom('WJ_nick_the_gouty_desc')]"
 WJ_nickname_han_nick_the_gouty_desc: "足疾缠身，行止多受其累。"
 WJ_nickname_native_nick_the_gouty_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat]发炎、肿胀的关节和因疼痛而扭曲的四肢表明[Select_CString(CHARACTER.IsLocalPlayer,'你',Select_CString(CHARACTER.IsFemale,'她','他'))|U]是社会奢侈上流阶层中的一员。也许#EMP 太#!奢侈了。"

 nick_the_great: "[CHARACTER.Custom('WJ_nick_the_great')]"
 WJ_nickname_han_nick_the_great: "雄杰"
 WJ_nickname_native_nick_the_great: "伟大者"
 nick_the_great_desc: "[CHARACTER.Custom('WJ_nick_the_great_desc')]"
 WJ_nickname_han_nick_the_great_desc: "功业卓著，声名出众，为世人所推重。"
 WJ_nickname_native_nick_the_great_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U]的成就堪称传奇——平民歌颂[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的事迹，贵族抱怨不公平的期望。"

 nick_the_hammer: "[CHARACTER.Custom('WJ_nick_the_hammer')]"
 WJ_nickname_han_nick_the_hammer: "铁锤"
 WJ_nickname_native_nick_the_hammer: "铁锤"
 nick_the_hammer_desc: "[CHARACTER.Custom('WJ_nick_the_hammer_desc')]"
 WJ_nickname_han_nick_the_hammer_desc: "攻势坚猛，仿佛铁锤落处无不摧折。"
 WJ_nickname_native_nick_the_hammer_desc: "任何想知道他们为什么把[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]称为“$nick_the_hammer$”的人，都只能去问[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]那些不幸的敌人了。"

 nick_the_handsome: "[CHARACTER.Custom('WJ_nick_the_handsome')]"
 WJ_nickname_han_nick_the_handsome: "玉貌"
 WJ_nickname_native_nick_the_handsome: "美男子"
 nick_the_handsome_desc: "[CHARACTER.Custom('WJ_nick_the_handsome_desc')]"
 WJ_nickname_han_nick_the_handsome_desc: "姿容俊美，风采常为人称道。"
 WJ_nickname_native_nick_the_handsome_desc: "#EMP 天呐#!。那棱角分明的下巴，那笔直的肩膀和那样美丽的[CHARACTER.Custom('EyeEyes')]真是世间少有。"

 nick_the_hunchback: "[CHARACTER.Custom('WJ_nick_the_hunchback')]"
 WJ_nickname_han_nick_the_hunchback: "曲背"
 WJ_nickname_native_nick_the_hunchback: "驼背"
 nick_the_hunchback_desc: "[CHARACTER.Custom('WJ_nick_the_hunchback_desc')]"
 WJ_nickname_han_nick_the_hunchback_desc: "脊背弯曲，世人遂以其形貌相称。"
 WJ_nickname_native_nick_the_hunchback_desc: "看到[CHARACTER.GetShortUINameNoTooltipNoFormat]的人没有一个能不注意到[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]极度隆起的后背以及[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]前伸的头颅。有时候，他们似乎只能看到这些。"

 nick_the_hunter: "[CHARACTER.Custom('WJ_nick_the_hunter')]"
 WJ_nickname_han_nick_the_hunter: "逐猎"
 WJ_nickname_native_nick_the_hunter: "猎人"
 nick_the_hunter_desc: "[CHARACTER.Custom('WJ_nick_the_hunter_desc')]"
 WJ_nickname_han_nick_the_hunter_desc: "惯于逐兽行猎，林野间留下许多传闻。"
 WJ_nickname_native_nick_the_hunter_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U]敏捷的射速和更为敏捷的眼力享誉四方。有人说，[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的声名传播到哪里，[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]弓箭就能射到哪里。"

 nick_the_ironside: "[CHARACTER.Custom('WJ_nick_the_ironside')]"
 WJ_nickname_han_nick_the_ironside: "铁壁"
 WJ_nickname_native_nick_the_ironside: "铁骨"
 nick_the_ironside_desc: "[CHARACTER.Custom('WJ_nick_the_ironside_desc')]"
 WJ_nickname_han_nick_the_ironside_desc: "临阵坚忍，犹如铁壁，难为敌锋所动。"
 WJ_nickname_native_nick_the_ironside_desc: "矛、斧、剑、矢——[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]号称能够躲开任何攻击，不论是最浩大的横扫还是刺客的利刃。"

 nick_the_just: "[CHARACTER.Custom('WJ_nick_the_just')]"
 WJ_nickname_han_nick_the_just: "持正"
 WJ_nickname_native_nick_the_just: "公正者"
 nick_the_just_desc: "[CHARACTER.Custom('WJ_nick_the_just_desc')]"
 WJ_nickname_han_nick_the_just_desc: "处事持平，赏罚有据，以公正著称。"
 WJ_nickname_native_nick_the_just_desc: "法律和秩序是生活中一切美好事物的基础。没有法律，秩序就会专横暴虐；没有秩序，法律就会软弱无力。"

 nick_the_kind: "[CHARACTER.Custom('WJ_nick_the_kind')]"
 WJ_nickname_han_nick_the_kind: "宽仁"
 WJ_nickname_native_nick_the_kind: "善良者"
 nick_the_kind_desc: "[CHARACTER.Custom('WJ_nick_the_kind_desc')]"
 WJ_nickname_han_nick_the_kind_desc: "待人宽和，乐于施惠，众人感其仁心。"
 WJ_nickname_native_nick_the_kind_desc: "一句平静的话语、一抹令人安心的微笑、一份寒日里的邀请——[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]相信这个世界能被一点一滴的同情所感动。"

 nick_the_lame: "[CHARACTER.Custom('WJ_nick_the_lame')]"
 WJ_nickname_han_nick_the_lame: "跛足"
 WJ_nickname_native_nick_the_lame: "瘸子"
 nick_the_lame_desc: "[CHARACTER.Custom('WJ_nick_the_lame_desc')]"
 WJ_nickname_han_nick_the_lame_desc: "步履不便，因足疾而得此称呼。"
 WJ_nickname_native_nick_the_lame_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat]饱受一条瘸腿的折磨，世人不仅拒绝提供方便，甚至不愿令其忘记。"

 nick_the_lawgiver: "[CHARACTER.Custom('WJ_nick_the_lawgiver')]"
 WJ_nickname_han_nick_the_lawgiver: "定律"
 WJ_nickname_native_nick_the_lawgiver: "立法者"
 nick_the_lawgiver_desc: "[CHARACTER.Custom('WJ_nick_the_lawgiver_desc')]"
 WJ_nickname_han_nick_the_lawgiver_desc: "以订立法度、整饬纲纪之功闻名。"
 WJ_nickname_native_nick_the_lawgiver_desc: "规则、秩序、正当的程序——[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]给[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]人民的赠礼太多了。"

 nick_the_liberator: "[CHARACTER.Custom('WJ_nick_the_liberator')]"
 WJ_nickname_han_nick_the_liberator: "解厄"
 WJ_nickname_native_nick_the_liberator: "解放者"
 nick_the_liberator_desc: "[CHARACTER.Custom('WJ_nick_the_liberator_desc')]"
 WJ_nickname_han_nick_the_liberator_desc: "使人脱离压迫与困厄，因而受到传颂。"
 WJ_nickname_native_nick_the_liberator_desc: "通过锋利的钢铁或雄辩的话语，[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]为那些受奴役的人赢得了巨大的自由。"

 nick_the_lion: "[CHARACTER.Custom('WJ_nick_the_lion')]"
 WJ_nickname_han_nick_the_lion: "狮威"
 WJ_nickname_native_nick_the_lion: "狮子"
 nick_the_lion_desc: "[CHARACTER.Custom('WJ_nick_the_lion_desc')]"
 WJ_nickname_han_nick_the_lion_desc: "威势凛然，临敌如狮，令人不敢轻犯。"
 WJ_nickname_native_nick_the_lion_desc: "高贵、凶猛、威严：如果说狮子是“万兽之王”，那么[CHARACTER.GetShortUINameNoTooltipNoFormat]与此兽明显的相似之处则表明[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的命运一片光明。"

 nick_the_lionheart: "[CHARACTER.Custom('WJ_nick_the_lionheart')]"
 WJ_nickname_han_nick_the_lionheart: "雄心"
 WJ_nickname_native_nick_the_lionheart: "狮心"
 nick_the_lionheart_desc: "[CHARACTER.Custom('WJ_nick_the_lionheart_desc')]"
 WJ_nickname_han_nick_the_lionheart_desc: "胆气壮盛，遇险不屈，勇名传于四方。"
 WJ_nickname_native_nick_the_lionheart_desc: "面对过错勇于承担，在战斗中所向披靡，在决斗中招招致命。那些想知道[CHARACTER.GetShortUINameNoTooltipNoFormat]是如何赢得这一名称的人显然从未见过[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]。"

 nick_the_magnificent: "[CHARACTER.Custom('WJ_nick_the_magnificent')]"
 WJ_nickname_han_nick_the_magnificent: "华盛"
 WJ_nickname_native_nick_the_magnificent: "华丽者"
 nick_the_magnificent_desc: "[CHARACTER.Custom('WJ_nick_the_magnificent_desc')]"
 WJ_nickname_han_nick_the_magnificent_desc: "气象恢宏，排场盛大，华贵之名远播。"
 WJ_nickname_native_nick_the_magnificent_desc: "[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的丰功伟绩从爱尔兰到契丹无人不知，无人不晓。"

 nick_the_merry: "[CHARACTER.Custom('WJ_nick_the_merry')]"
 WJ_nickname_han_nick_the_merry: "乐天"
 WJ_nickname_native_nick_the_merry: "欢乐者"
 nick_the_merry_desc: "[CHARACTER.Custom('WJ_nick_the_merry_desc')]"
 WJ_nickname_han_nick_the_merry_desc: "性情欢悦，常能自得其乐，亦使旁人开颜。"
 WJ_nickname_native_nick_the_merry_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]以[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的幽默风趣、妙语连珠和精彩聚会而闻名。"

 nick_the_honorable: "[CHARACTER.Custom('WJ_nick_the_honorable')]"
 WJ_nickname_han_nick_the_honorable: "守节"
 WJ_nickname_native_nick_the_honorable: "正直者"
 nick_the_honorable_desc: "[CHARACTER.Custom('WJ_nick_the_honorable_desc')]"
 WJ_nickname_han_nick_the_honorable_desc: "重信守义，不轻弃操守，为人所敬。"
 WJ_nickname_native_nick_the_honorable_desc: "当一项协议达成，当[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的诺言被许下，可以相信[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]会如钢铁一般坚定地信守它。"

 nick_the_greedy: "[CHARACTER.Custom('WJ_nick_the_greedy')]"
 WJ_nickname_han_nick_the_greedy: "聚敛"
 WJ_nickname_native_nick_the_greedy: "贪婪者"
 nick_the_greedy_desc: "[CHARACTER.Custom('WJ_nick_the_greedy_desc')]"
 WJ_nickname_han_nick_the_greedy_desc: "贪求财利，积蓄无厌，世人因而讥之。"
 WJ_nickname_native_nick_the_greedy_desc: "还有什么比一袋银子更好的吗？就是两袋银子！"

 nick_the_noble: "[CHARACTER.Custom('WJ_nick_the_noble')]"
 WJ_nickname_han_nick_the_noble: "高华"
 WJ_nickname_native_nick_the_noble: "高贵者"
 nick_the_noble_desc: "[CHARACTER.Custom('WJ_nick_the_noble_desc')]"
 WJ_nickname_han_nick_the_noble_desc: "举止高雅，气度不凡，常受众人称誉。"
 WJ_nickname_native_nick_the_noble_desc: "尽管这世上有着许多贵族，但几乎没有人能像[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]这样达到这个词所蕴含理想的高度。"

 nick_the_old: "[CHARACTER.Custom('WJ_nick_the_old')]"
 WJ_nickname_han_nick_the_old: "宿耆"
 WJ_nickname_native_nick_the_old: "老者"
 nick_the_old_desc: "[CHARACTER.Custom('WJ_nick_the_old_desc')]"
 WJ_nickname_han_nick_the_old_desc: "年岁既长，阅历深厚，故有此称。"
 WJ_nickname_native_nick_the_old_desc: "人们满怀惊讶地问候[CHARACTER.GetShortUINameNoTooltipNoFormat]，想不到[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]还活着，这种场景并不少见。"

 nick_the_pious: "[CHARACTER.Custom('WJ_nick_the_pious')]"
 WJ_nickname_han_nick_the_pious: "笃敬"
 WJ_nickname_native_nick_the_pious: "虔诚者"
 nick_the_pious_desc: "[CHARACTER.Custom('WJ_nick_the_pious_desc')]"
 WJ_nickname_han_nick_the_pious_desc: "敬奉信仰，践行礼仪，虔诚之名为众人所知。"
 WJ_nickname_native_nick_the_pious_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U]对[CHARACTER.GetFaith.GetName]的热忱和奉献被认为标志着浓厚而富有感召力的虔敬。"

 nick_the_proud: "[CHARACTER.Custom('WJ_nick_the_proud')]"
 WJ_nickname_han_nick_the_proud: "傲世"
 WJ_nickname_native_nick_the_proud: "骄傲者"
 nick_the_proud_desc: "[CHARACTER.Custom('WJ_nick_the_proud_desc')]"
 WJ_nickname_han_nick_the_proud_desc: "自视甚高，不肯轻易屈身于人。"
 WJ_nickname_native_nick_the_proud_desc: "大多数贵族都学会了如何一直保持腰板挺直，但几乎没人像[CHARACTER.GetShortUINameNoTooltipNoFormat]这样将其当作骄傲的重点。"

 nick_the_quarreller: "[CHARACTER.Custom('WJ_nick_the_quarreller')]"
 WJ_nickname_han_nick_the_quarreller: "好讼"
 WJ_nickname_native_nick_the_quarreller: "爱争吵者"
 nick_the_quarreller_desc: "[CHARACTER.Custom('WJ_nick_the_quarreller_desc')]"
 WJ_nickname_han_nick_the_quarreller_desc: "争执不断，动辄与人论短争长。"
 WJ_nickname_native_nick_the_quarreller_desc: "要明智点的话，就最好别与[CHARACTER.GetShortUINameNoTooltipNoFormat]开始一场对话，除非你有几个小时的空闲时间。有时甚至得花好几天。"

 nick_the_restorer: "[CHARACTER.Custom('WJ_nick_the_restorer')]"
 WJ_nickname_han_nick_the_restorer: "中兴"
 WJ_nickname_native_nick_the_restorer: "复兴者"
 nick_the_restorer_desc: "[CHARACTER.Custom('WJ_nick_the_restorer_desc')]"
 WJ_nickname_han_nick_the_restorer_desc: "力挽衰颓，使旧业重新兴盛，因而得名。"
 WJ_nickname_native_nick_the_restorer_desc: "当这片国度似乎迷失于黑暗之中时，#EMP [Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]#!的出现将它带回了光明。"

 nick_the_scholar: "[CHARACTER.Custom('WJ_nick_the_scholar')]"
 WJ_nickname_han_nick_the_scholar: "博学"
 WJ_nickname_native_nick_the_scholar: "学者"
 nick_the_scholar_desc: "[CHARACTER.Custom('WJ_nick_the_scholar_desc')]"
 WJ_nickname_han_nick_the_scholar_desc: "博览典籍，勤于问学，以学识见称。"
 WJ_nickname_native_nick_the_scholar_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U]的智慧与知识是许多学术院校文献总汇的一部分。"

 nick_the_silent: "[CHARACTER.Custom('WJ_nick_the_silent')]"
 WJ_nickname_han_nick_the_silent: "寡言"
 WJ_nickname_native_nick_the_silent: "沉默者"
 nick_the_silent_desc: "[CHARACTER.Custom('WJ_nick_the_silent_desc')]"
 WJ_nickname_han_nick_the_silent_desc: "言语不多，喜怒少形于色。"
 WJ_nickname_native_nick_the_silent_desc: "沉默是金，而[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]在这方面很富有。"

 nick_the_stammerer: "[CHARACTER.Custom('WJ_nick_the_stammerer')]"
 WJ_nickname_han_nick_the_stammerer: "蹇言"
 WJ_nickname_native_nick_the_stammerer: "口吃者"
 nick_the_stammerer_desc: "[CHARACTER.Custom('WJ_nick_the_stammerer_desc')]"
 WJ_nickname_han_nick_the_stammerer_desc: "言语时有滞涩，世人遂以此相称。"
 WJ_nickname_native_nick_the_stammerer_desc: "虽然[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的遣词造句可能很具有说服力，但[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的讲话方式仍有许多改进的余地。"

 nick_the_stranger: "[CHARACTER.Custom('WJ_nick_the_stranger')]"
 WJ_nickname_han_nick_the_stranger: "远客"
 WJ_nickname_native_nick_the_stranger: "外来者"
 nick_the_stranger_desc: "[CHARACTER.Custom('WJ_nick_the_stranger_desc')]"
 WJ_nickname_han_nick_the_stranger_desc: "来处遥远，身世与乡音引人注目。"
 WJ_nickname_native_nick_the_stranger_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]从远方来到[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的领地——时至今日，[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的言谈举止仍然奇特而异域。"

 nick_the_strong: "[CHARACTER.Custom('WJ_nick_the_strong')]"
 WJ_nickname_han_nick_the_strong: "膂力"
 WJ_nickname_native_nick_the_strong: "强壮者"
 nick_the_strong_desc: "[CHARACTER.Custom('WJ_nick_the_strong_desc')]"
 WJ_nickname_han_nick_the_strong_desc: "筋骨强健，力气过人，常为旁人惊叹。"
 WJ_nickname_native_nick_the_strong_desc: "世界上有许多人认为[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]有能力碎裂岩石。而且是用[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的牙齿。"

 nick_the_troubadour: "[CHARACTER.Custom('WJ_nick_the_troubadour')]"
 WJ_nickname_han_nick_the_troubadour: "行吟"
 WJ_nickname_native_nick_the_troubadour: "游唱诗人"
 nick_the_troubadour_desc: "[CHARACTER.Custom('WJ_nick_the_troubadour_desc')]"
 WJ_nickname_han_nick_the_troubadour_desc: "辗转四方，以诗歌寄情，声名随歌而远。"
 WJ_nickname_native_nick_the_troubadour_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]以[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]优美的歌喉和对音乐的倾向而闻名。至少为那些喜欢[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的人所熟知。"

 nick_the_unready: "[CHARACTER.Custom('WJ_nick_the_unready')]"
 WJ_nickname_han_nick_the_unready: "失策"
 WJ_nickname_native_nick_the_unready: "决策无方者"
 nick_the_unready_desc: "[CHARACTER.Custom('WJ_nick_the_unready_desc')]"
 WJ_nickname_han_nick_the_unready_desc: "谋划屡有失当，误事之名难以洗去。"
 WJ_nickname_native_nick_the_unready_desc: "很少能见到有什么冲突或讨论是不能将[CHARACTER.GetShortUINameNoTooltipNoFormat]完全压垮的。"

 nick_the_unready_anglo_saxon: "[CHARACTER.Custom('WJ_nick_the_unready_anglo_saxon')]"
 WJ_nickname_han_nick_the_unready_anglo_saxon: "失策"
 WJ_nickname_native_nick_the_unready_anglo_saxon: "$nick_the_unready$"
 nick_the_unready_anglo_saxon_desc: "[CHARACTER.Custom('WJ_nick_the_unready_anglo_saxon_desc')]"
 WJ_nickname_han_nick_the_unready_anglo_saxon_desc: "谋划屡有失当，误事之名难以洗去。"
 WJ_nickname_native_nick_the_unready_anglo_saxon_desc: "[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]名字的字面含义为“高贵的决策”。被称为“$E_thelrE_d$-昂雷德（高策-失策）”会让[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]生不小的气。大概是因为有人觉得语带双关很好玩。"

 nick_the_usurper: "[CHARACTER.Custom('WJ_nick_the_usurper')]"
 WJ_nickname_han_nick_the_usurper: "窃位"
 WJ_nickname_native_nick_the_usurper: "篡位者"
 nick_the_usurper_desc: "[CHARACTER.Custom('WJ_nick_the_usurper_desc')]"
 WJ_nickname_han_nick_the_usurper_desc: "夺取他人权位，故被世人以此相称。"
 WJ_nickname_native_nick_the_usurper_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]推翻了[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]领地的合法领主，用刀尖逼迫夺走了本应属于别人的东西。"

 nick_the_victorious: "[CHARACTER.Custom('WJ_nick_the_victorious')]"
 WJ_nickname_han_nick_the_victorious: "常胜"
 WJ_nickname_native_nick_the_victorious: "胜利者"
 nick_the_victorious_desc: "[CHARACTER.Custom('WJ_nick_the_victorious_desc')]"
 WJ_nickname_han_nick_the_victorious_desc: "屡获胜绩，凯旋之名传遍四方。"
 WJ_nickname_native_nick_the_victorious_desc: "胜利当然属于[CHARACTER.GetShortUINameNoTooltipNoFormat]，这是全世界都同意的。"

 nick_the_young: "[CHARACTER.Custom('WJ_nick_the_young')]"
 WJ_nickname_han_nick_the_young: "少壮"
 WJ_nickname_native_nick_the_young: "年轻者"
 nick_the_young_desc: "[CHARACTER.Custom('WJ_nick_the_young_desc')]"
 WJ_nickname_han_nick_the_young_desc: "年纪尚轻便已闻名，故有此称。"
 WJ_nickname_native_nick_the_young_desc: "作为一名年轻[CHARACTER.GetWomanMan]，[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]有了荣誉和知名度。不管多少年过去，[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]都确信这一别称会被叫开。"

 nick_the_younger: "[CHARACTER.Custom('WJ_nick_the_younger')]"
 WJ_nickname_han_nick_the_younger: "小辈"
 WJ_nickname_native_nick_the_younger: "青年"
 nick_the_younger_desc: "[CHARACTER.Custom('WJ_nick_the_younger_desc')]"
 WJ_nickname_han_nick_the_younger_desc: "与长辈同名，世人以此辨别。"
 WJ_nickname_native_nick_the_younger_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]不幸与另一位知名人士同名，因而被永远贬称为了#EMP “$nick_the_younger$”#![CHARACTER.GetFirstName]。"

 nick_the_cannibal: "[CHARACTER.Custom('WJ_nick_the_cannibal')]"
 WJ_nickname_han_nick_the_cannibal: "噬人"
 WJ_nickname_native_nick_the_cannibal: "食人者"
 nick_the_cannibal_desc: "[CHARACTER.Custom('WJ_nick_the_cannibal_desc')]"
 WJ_nickname_han_nick_the_cannibal_desc: "食人恶行传开之后，这一称呼便如影随形。"
 WJ_nickname_native_nick_the_cannibal_desc: "很少有人能忍受[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的露齿一笑，尤其是当鲜血从[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]保养良好的牙齿间溢出时。"

 nick_the_devourer: "[CHARACTER.Custom('WJ_nick_the_devourer')]"
 WJ_nickname_han_nick_the_devourer: "饕餮"
 WJ_nickname_native_nick_the_devourer: "吞食者"
 nick_the_devourer_desc: "[CHARACTER.Custom('WJ_nick_the_devourer_desc')]"
 WJ_nickname_han_nick_the_devourer_desc: "吞食无度，口腹之欲为人所知。"
 WJ_nickname_native_nick_the_devourer_desc: "一想到有多少生命掉进了[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]那深不见底的胃里，世界都会颤抖……"

 nick_the_bewitched: "[CHARACTER.Custom('WJ_nick_the_bewitched')]"
 WJ_nickname_han_nick_the_bewitched: "中魅"
 WJ_nickname_native_nick_the_bewitched: "着魔者"
 nick_the_bewitched_desc: "[CHARACTER.Custom('WJ_nick_the_bewitched_desc')]"
 WJ_nickname_han_nick_the_bewitched_desc: "被认为遭到邪魅纠缠，举止常引人猜疑。"
 WJ_nickname_native_nick_the_bewitched_desc: "被[CHARACTER.GetFaith.HighGodName]抛弃、受[CHARACTER.GetFaith.WitchGodName]诅咒，人们谈到[CHARACTER.GetShortUINameNoTooltipNoFormat]时，往往带着怜悯。"

 nick_the_unfaithful: "[CHARACTER.Custom('WJ_nick_the_unfaithful')]"
 WJ_nickname_han_nick_the_unfaithful: "负盟"
 WJ_nickname_native_nick_the_unfaithful: "不忠者"
 nick_the_unfaithful_desc: "[CHARACTER.Custom('WJ_nick_the_unfaithful_desc')]"
 WJ_nickname_han_nick_the_unfaithful_desc: "背弃情爱誓言，留下负心之名。"
 WJ_nickname_native_nick_the_unfaithful_desc: "照[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]看来，婚礼誓言更像……婚礼指引。"

 nick_the_unchaste: "[CHARACTER.Custom('WJ_nick_the_unchaste')]"
 WJ_nickname_han_nick_the_unchaste: "失贞"
 WJ_nickname_native_nick_the_unchaste: "不贞洁者"
 nick_the_unchaste_desc: "[CHARACTER.Custom('WJ_nick_the_unchaste_desc')]"
 WJ_nickname_han_nick_the_unchaste_desc: "私情与失节的传闻，使其蒙上这个称呼。"
 WJ_nickname_native_nick_the_unchaste_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]被认为是一个未婚的色鬼。"

 nick_the_beguiling: "[CHARACTER.Custom('WJ_nick_the_beguiling')]"
 WJ_nickname_han_nick_the_beguiling: "惑众"
 WJ_nickname_native_nick_the_beguiling: "迷人者"
 nick_the_beguiling_desc: "[CHARACTER.Custom('WJ_nick_the_beguiling_desc')]"
 WJ_nickname_han_nick_the_beguiling_desc: "言行富于魅力，常令人不觉倾心。"
 WJ_nickname_native_nick_the_beguiling_desc: "据说[CHARACTER.GetShortUINameNoTooltipNoFormat]端庄的一瞥就能让人……膝盖发软。"

 nick_the_temptress: "[CHARACTER.Custom('WJ_nick_the_temptress')]"
 WJ_nickname_han_nick_the_temptress: "蛊情"
 WJ_nickname_native_nick_the_temptress: "魅惑者"
 nick_the_temptress_desc: "[CHARACTER.Custom('WJ_nick_the_temptress_desc')]"
 WJ_nickname_han_nick_the_temptress_desc: "善以情意诱人，令人难以自持。"
 WJ_nickname_native_nick_the_temptress_desc: "[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的手指轻轻一勾，贵族和贫民都掉进了陷阱。"

 nick_the_seductress: "[CHARACTER.Custom('WJ_nick_the_seductress')]"
 WJ_nickname_han_nick_the_seductress: "撩情"
 WJ_nickname_native_nick_the_seductress: "勾引者"
 nick_the_seductress_desc: "[CHARACTER.Custom('WJ_nick_the_seductress_desc')]"
 WJ_nickname_han_nick_the_seductress_desc: "以风情引人倾倒，艳名因此流传。"
 WJ_nickname_native_nick_the_seductress_desc: "微微一笑便能道出千言万语——都是些当着文雅人的面说不出口的言语。"

 nick_the_lewd: "[CHARACTER.Custom('WJ_nick_the_lewd')]"
 WJ_nickname_han_nick_the_lewd: "耽色"
 WJ_nickname_native_nick_the_lewd: "色鬼"
 nick_the_lewd_desc: "[CHARACTER.Custom('WJ_nick_the_lewd_desc')]"
 WJ_nickname_han_nick_the_lewd_desc: "沉溺声色，不知检束，世人多以此讥之。"
 WJ_nickname_native_nick_the_lewd_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U]谈吐、举止和偶尔剧烈的肢体动作，即使往最好的方向去形容也是，不太含蓄。"

 nick_the_lecher: "[CHARACTER.Custom('WJ_nick_the_lecher')]"
 WJ_nickname_han_nick_the_lecher: "逐色"
 WJ_nickname_native_nick_the_lecher: "登徒子"
 nick_the_lecher_desc: "[CHARACTER.Custom('WJ_nick_the_lecher_desc')]"
 WJ_nickname_han_nick_the_lecher_desc: "追逐美色，屡有轻薄之举。"
 WJ_nickname_native_nick_the_lecher_desc: "[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]倾慕的人会习惯[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的唾液。不然他们就会离开。"

 nick_the_seducer: "[CHARACTER.Custom('WJ_nick_the_seducer')]"
 WJ_nickname_han_nick_the_seducer: "窃香"
 WJ_nickname_native_nick_the_seducer: "勾引者"
 nick_the_seducer_desc: "[CHARACTER.Custom('WJ_nick_the_seducer_desc')]"
 WJ_nickname_han_nick_the_seducer_desc: "善取他人欢心，风流之名随之而来。"
 WJ_nickname_native_nick_the_seducer_desc: "$nick_the_seductress_desc$"

 nick_the_shadow: "[CHARACTER.Custom('WJ_nick_the_shadow')]"
 WJ_nickname_han_nick_the_shadow: "潜影"
 WJ_nickname_native_nick_the_shadow: "诡影者"
 nick_the_shadow_desc: "[CHARACTER.Custom('WJ_nick_the_shadow_desc')]"
 WJ_nickname_han_nick_the_shadow_desc: "行事隐秘，踪迹难寻，仿佛暗处之影。"
 WJ_nickname_native_nick_the_shadow_desc: "有传言说不管黑暗降临于何处，都有[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的耳目。"

 nick_the_whisperer: "[CHARACTER.Custom('WJ_nick_the_whisperer')]"
 WJ_nickname_han_nick_the_whisperer: "耳语"
 WJ_nickname_native_nick_the_whisperer: "耳语者"
 nick_the_whisperer_desc: "[CHARACTER.Custom('WJ_nick_the_whisperer_desc')]"
 WJ_nickname_han_nick_the_whisperer_desc: "消息常从低语间流转，其人亦因此闻名。"
 WJ_nickname_native_nick_the_whisperer_desc: "之所以这么称呼，是因为[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]用在轻声细语上的时间多得不太合适。"

 nick_the_spider: "[CHARACTER.Custom('WJ_nick_the_spider')]"
 WJ_nickname_han_nick_the_spider: "结网"
 WJ_nickname_native_nick_the_spider: "蜘蛛"
 nick_the_spider_desc: "[CHARACTER.Custom('WJ_nick_the_spider_desc')]"
 WJ_nickname_han_nick_the_spider_desc: "善于暗结关系，布置谋划，如蛛结网。"
 WJ_nickname_native_nick_the_spider_desc: "他们说，在宫里要四处留神。无论你走到哪里，你都会发现“$nick_the_spider$”。"

 nick_the_fox: "[CHARACTER.Custom('WJ_nick_the_fox')]"
 WJ_nickname_han_nick_the_fox: "狡狐"
 WJ_nickname_native_nick_the_fox: "狐狸"
 nick_the_fox_desc: "[CHARACTER.Custom('WJ_nick_the_fox_desc')]"
 WJ_nickname_han_nick_the_fox_desc: "心思灵巧，惯于避实就虚，被人比作狡狐。"
 WJ_nickname_native_nick_the_fox_desc: "狡猾、精明、野心勃勃——[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的优点未必在于侠义，而#EMP 是#!在于高效。"

 nick_the_shrewd: "[CHARACTER.Custom('WJ_nick_the_shrewd')]"
 WJ_nickname_han_nick_the_shrewd: "明察"
 WJ_nickname_native_nick_the_shrewd: "精明者"
 nick_the_shrewd_desc: "[CHARACTER.Custom('WJ_nick_the_shrewd_desc')]"
 WJ_nickname_han_nick_the_shrewd_desc: "善察人情利害，行事精明，少为表象所惑。"
 WJ_nickname_native_nick_the_shrewd_desc: "永不和[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]玩牌是明智的——没几个人拿得准[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]留了多少后手。"

 nick_the_gracious: "[CHARACTER.Custom('WJ_nick_the_gracious')]"
 WJ_nickname_han_nick_the_gracious: "谦和"
 WJ_nickname_native_nick_the_gracious: "和蔼者"
 nick_the_gracious_desc: "[CHARACTER.Custom('WJ_nick_the_gracious_desc')]"
 WJ_nickname_han_nick_the_gracious_desc: "待人亲切有礼，使人如沐春风。"
 WJ_nickname_native_nick_the_gracious_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat]的彬彬有礼、高贵举止和端庄海涵使[Select_CString(CHARACTER.IsLocalPlayer,'你',Select_CString(CHARACTER.IsFemale,'她','他'))|U]成为了一个在大多数餐桌上都受到欢迎的[CHARACTER.GetWomanMan]。"

 nick_the_magnanimous: "[CHARACTER.Custom('WJ_nick_the_magnanimous')]"
 WJ_nickname_han_nick_the_magnanimous: "弘量"
 WJ_nickname_native_nick_the_magnanimous: "大度者"
 nick_the_magnanimous_desc: "[CHARACTER.Custom('WJ_nick_the_magnanimous_desc')]"
 WJ_nickname_han_nick_the_magnanimous_desc: "胸怀宽广，能容人过失，气量为众人所称。"
 WJ_nickname_native_nick_the_magnanimous_desc: "永远不要说[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]没有给予给定的。"

 nick_the_architect: "[CHARACTER.Custom('WJ_nick_the_architect')]"
 WJ_nickname_han_nick_the_architect: "营造"
 WJ_nickname_native_nick_the_architect: "建筑师"
 nick_the_architect_desc: "[CHARACTER.Custom('WJ_nick_the_architect_desc')]"
 WJ_nickname_han_nick_the_architect_desc: "精于筹划营建，以筑造之才闻名。"
 WJ_nickname_native_nick_the_architect_desc: "大多数人见到一堆砖石和木材，看到的都是一份劳工的工作。[Select_CString(CHARACTER.IsLocalPlayer,'你',Select_CString(CHARACTER.IsFemale,'她','他'))|U]却看到了#EMP 潜力#!。"

 nick_the_wise: "[CHARACTER.Custom('WJ_nick_the_wise')]"
 WJ_nickname_han_nick_the_wise: "明哲"
 WJ_nickname_native_nick_the_wise: "智者"
 nick_the_wise_desc: "[CHARACTER.Custom('WJ_nick_the_wise_desc')]"
 WJ_nickname_han_nick_the_wise_desc: "识见深远，处事审慎，常能明辨得失。"
 WJ_nickname_native_nick_the_wise_desc: "征求[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的意见被认为是明智的，要是[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]能被哄得给出意见的话。"

 nick_the_impaler: "[CHARACTER.Custom('WJ_nick_the_impaler')]"
 WJ_nickname_han_nick_the_impaler: "贯刑"
 WJ_nickname_native_nick_the_impaler: "穿刺者"
 nick_the_impaler_desc: "[CHARACTER.Custom('WJ_nick_the_impaler_desc')]"
 WJ_nickname_han_nick_the_impaler_desc: "以残酷的贯刺刑罚立威，恶名令人胆寒。"
 WJ_nickname_native_nick_the_impaler_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U]实现正义的方式可能很严酷，但再犯率#EMP 确实#!很低。"

 nick_the_tormentor: "[CHARACTER.Custom('WJ_nick_the_tormentor')]"
 WJ_nickname_han_nick_the_tormentor: "酷虐"
 WJ_nickname_native_nick_the_tormentor: "拷打者"
 nick_the_tormentor_desc: "[CHARACTER.Custom('WJ_nick_the_tormentor_desc')]"
 WJ_nickname_han_nick_the_tormentor_desc: "以折磨他人为能事，令人避之不及。"
 WJ_nickname_native_nick_the_tormentor_desc: "大多数人宁可死在执达吏的刀刃下，也不愿让自己被带进[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的地牢。"

 nick_the_depraved: "[CHARACTER.Custom('WJ_nick_the_depraved')]"
 WJ_nickname_han_nick_the_depraved: "悖德"
 WJ_nickname_native_nick_the_depraved: "堕邪者"
 nick_the_depraved_desc: "[CHARACTER.Custom('WJ_nick_the_depraved_desc')]"
 WJ_nickname_han_nick_the_depraved_desc: "行止败坏，不顾伦常，世人因此鄙薄。"
 WJ_nickname_native_nick_the_depraved_desc: "善良的人们私下说[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的欲望很反常。[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]认为那些欲望只是#EMP 优雅#!。"

 nick_the_monster: "[CHARACTER.Custom('WJ_nick_the_monster')]"
 WJ_nickname_han_nick_the_monster: "凶物"
 WJ_nickname_native_nick_the_monster: "怪物"
 nick_the_monster_desc: "[CHARACTER.Custom('WJ_nick_the_monster_desc')]"
 WJ_nickname_han_nick_the_monster_desc: "暴行骇人，以至世人不愿再以常人视之。"
 WJ_nickname_native_nick_the_monster_desc: "农民们认为[CHARACTER.GetShortUINameNoTooltipNoFormat]是一只食尸鬼，一个吸血的梦魇，来吸吮他们孩子的骨髓。希望他们是错的。"

 nick_the_wicked: "[CHARACTER.Custom('WJ_nick_the_wicked')]"
 WJ_nickname_han_nick_the_wicked: "险恶"
 WJ_nickname_native_nick_the_wicked: "妖邪者"
 nick_the_wicked_desc: "[CHARACTER.Custom('WJ_nick_the_wicked_desc')]"
 WJ_nickname_han_nick_the_wicked_desc: "心术不正，行事阴狠，恶名由此而生。"
 WJ_nickname_native_nick_the_wicked_desc: "虽然[CHARACTER.GetFaith.GetName]有许多限制，但[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]往往会打破它们。"

 nick_the_accursed: "[CHARACTER.Custom('WJ_nick_the_accursed')]"
 WJ_nickname_han_nick_the_accursed: "祸身"
 WJ_nickname_native_nick_the_accursed: "受诅咒者"
 nick_the_accursed_desc: "[CHARACTER.Custom('WJ_nick_the_accursed_desc')]"
 WJ_nickname_han_nick_the_accursed_desc: "灾祸与诅咒之说常伴其身。"
 WJ_nickname_native_nick_the_accursed_desc: "很少有[CHARACTER.GetFaith.PriestNeuter]能说出[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的名字而不朝尘土啐上一口的。"

 nick_the_able: "[CHARACTER.Custom('WJ_nick_the_able')]"
 WJ_nickname_han_nick_the_able: "干济"
 WJ_nickname_native_nick_the_able: "能人"
 nick_the_able_desc: "[CHARACTER.Custom('WJ_nick_the_able_desc')]"
 WJ_nickname_han_nick_the_able_desc: "临事有才，处置有方，能办旁人难办之事。"
 WJ_nickname_native_nick_the_able_desc: "统治领地？打仗？做饭？哄小孩？设计建筑？拔牙？只要[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]下决心去做，几乎没有什么是[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]做不到的。毕竟，专业分工是昆虫干的事。"

 nick_the_mad: "[CHARACTER.Custom('WJ_nick_the_mad')]"
 WJ_nickname_han_nick_the_mad: "狂疾"
 WJ_nickname_native_nick_the_mad: "疯子"
 nick_the_mad_desc: "[CHARACTER.Custom('WJ_nick_the_mad_desc')]"
 WJ_nickname_han_nick_the_mad_desc: "言行失常，难以揣测，世人遂以此称之。"
 WJ_nickname_native_nick_the_mad_desc: "如果他们只知道[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]所知道的，那么他们一样会发笑：整个这一生都是某个疯神的游戏。"

 nick_the_ruthless: "[CHARACTER.Custom('WJ_nick_the_ruthless')]"
 WJ_nickname_han_nick_the_ruthless: "绝情"
 WJ_nickname_native_nick_the_ruthless: "不仁者"
 nick_the_ruthless_desc: "[CHARACTER.Custom('WJ_nick_the_ruthless_desc')]"
 WJ_nickname_han_nick_the_ruthless_desc: "为达所图不惜伤人，少见怜悯退让。"
 WJ_nickname_native_nick_the_ruthless_desc: "并非所有人都有毅力去做需要完成的事的。并非所有人，但[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]却有。"

 nick_the_simple: "[CHARACTER.Custom('WJ_nick_the_simple')]"
 WJ_nickname_han_nick_the_simple: "愚直"
 WJ_nickname_native_nick_the_simple: "天真者"
 nick_the_simple_desc: "[CHARACTER.Custom('WJ_nick_the_simple_desc')]"
 WJ_nickname_han_nick_the_simple_desc: "心思浅直，不谙曲折，时被旁人轻视。"
 WJ_nickname_native_nick_the_simple_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U]想法可以被最为恰当地形容为“无忧无虑一身轻”。"

 nick_the_leper: "[CHARACTER.Custom('WJ_nick_the_leper')]"
 WJ_nickname_han_nick_the_leper: "疠疾"
 WJ_nickname_native_nick_the_leper: "癞病人"
 nick_the_leper_desc: "[CHARACTER.Custom('WJ_nick_the_leper_desc')]"
 WJ_nickname_han_nick_the_leper_desc: "恶疾侵身，病状亦成为世人的称呼。"
 WJ_nickname_native_nick_the_leper_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]永远也不会忘记这种消耗性疾病正在缓慢夺走[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的肉体。反正这个世界喜欢提醒[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]这一点。"

 nick_the_hideous: "[CHARACTER.Custom('WJ_nick_the_hideous')]"
 WJ_nickname_han_nick_the_hideous: "丑貌"
 WJ_nickname_native_nick_the_hideous: "丑八怪"
 nick_the_hideous_desc: "[CHARACTER.Custom('WJ_nick_the_hideous_desc')]"
 WJ_nickname_han_nick_the_hideous_desc: "容貌令人惊异，遂遭世人以此相称。"
 WJ_nickname_native_nick_the_hideous_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]的这张脸但愿至少有一位母亲能喜欢得起来。"

 nick_the_repulsive: "[CHARACTER.Custom('WJ_nick_the_repulsive')]"
 WJ_nickname_han_nick_the_repulsive: "可憎"
 WJ_nickname_native_nick_the_repulsive: "恶心之人"
 nick_the_repulsive_desc: "[CHARACTER.Custom('WJ_nick_the_repulsive_desc')]"
 WJ_nickname_han_nick_the_repulsive_desc: "形貌与举止引人厌恶，名声因此败坏。"
 WJ_nickname_native_nick_the_repulsive_desc: "[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]在周围的时候，过度拥挤很少会成问题。"

 nick_the_frail: "[CHARACTER.Custom('WJ_nick_the_frail')]"
 WJ_nickname_han_nick_the_frail: "羸弱"
 WJ_nickname_native_nick_the_frail: "虚弱者"
 nick_the_frail_desc: "[CHARACTER.Custom('WJ_nick_the_frail_desc')]"
 WJ_nickname_han_nick_the_frail_desc: "体质单薄，难耐劳苦，众人因此相称。"
 WJ_nickname_native_nick_the_frail_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U]的骨头常被说成是玻璃做的——至少，它们破碎起来会像玻璃一样。"

 nick_the_weak: "[CHARACTER.Custom('WJ_nick_the_weak')]"
 WJ_nickname_han_nick_the_weak: "孱弱"
 WJ_nickname_native_nick_the_weak: "羸弱者"
 nick_the_weak_desc: "[CHARACTER.Custom('WJ_nick_the_weak_desc')]"
 WJ_nickname_han_nick_the_weak_desc: "气力不足，体魄羸弱，少能与人争强。"
 WJ_nickname_native_nick_the_weak_desc: "某些自吹自擂的小孩觉得他们可与[CHARACTER.GetShortUINameNoTooltipNoFormat]摔跤取胜。[Select_CString(CHARACTER.IsLocalPlayer,'你',Select_CString(CHARACTER.IsFemale,'她','他'))|U]并不想检验这个理论。"

 nick_the_brute: "[CHARACTER.Custom('WJ_nick_the_brute')]"
 WJ_nickname_han_nick_the_brute: "悍蛮"
 WJ_nickname_native_nick_the_brute: "残忍者"
 nick_the_brute_desc: "[CHARACTER.Custom('WJ_nick_the_brute_desc')]"
 WJ_nickname_han_nick_the_brute_desc: "行事粗暴，惯恃蛮力，不问是非曲直。"
 WJ_nickname_native_nick_the_brute_desc: "[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]是个从不回避暴力的人，几乎不对身体上、社会上和精神上的伤害加以区分。反正最后伤到的都是同一个人，对吧？"

 nick_the_terrible: "[CHARACTER.Custom('WJ_nick_the_terrible')]"
 WJ_nickname_han_nick_the_terrible: "震怖"
 WJ_nickname_native_nick_the_terrible: "可怖者"
 nick_the_terrible_desc: "[CHARACTER.Custom('WJ_nick_the_terrible_desc')]"
 WJ_nickname_han_nick_the_terrible_desc: "威名令人战栗，所至常先闻惧声。"
 WJ_nickname_native_nick_the_terrible_desc: "据说，[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]经过时，小儿会啼哭，农民会战栗，鲜奶会变馊。"

 nick_the_tyrant: "[CHARACTER.Custom('WJ_nick_the_tyrant')]"
 WJ_nickname_han_nick_the_tyrant: "暴虐"
 WJ_nickname_native_nick_the_tyrant: "暴君"
 nick_the_tyrant_desc: "[CHARACTER.Custom('WJ_nick_the_tyrant_desc')]"
 WJ_nickname_han_nick_the_tyrant_desc: "恃权肆虐，使治下之人深受其苦。"
 WJ_nickname_native_nick_the_tyrant_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]#EMP 即#!国家，任何不同意这点的人都会了解到国家是如何处置叛徒的。"

 nick_the_benevolent: "[CHARACTER.Custom('WJ_nick_the_benevolent')]"
 WJ_nickname_han_nick_the_benevolent: "仁厚"
 WJ_nickname_native_nick_the_benevolent: "仁爱者"
 nick_the_benevolent_desc: "[CHARACTER.Custom('WJ_nick_the_benevolent_desc')]"
 WJ_nickname_han_nick_the_benevolent_desc: "体恤困苦，待人宽厚，以仁心著称。"
 WJ_nickname_native_nick_the_benevolent_desc: "只要[CHARACTER.GetShortUINameNoTooltipNoFormat|U]有机会，[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]就必定会参与到赞助与慈善活动中。"

 nick_the_philosopher: "[CHARACTER.Custom('WJ_nick_the_philosopher')]"
 WJ_nickname_han_nick_the_philosopher: "玄思"
 WJ_nickname_native_nick_the_philosopher: "哲学家"
 nick_the_philosopher_desc: "[CHARACTER.Custom('WJ_nick_the_philosopher_desc')]"
 WJ_nickname_han_nick_the_philosopher_desc: "勤于思索事理，不满足于流俗之见。"
 WJ_nickname_native_nick_the_philosopher_desc: "自然世界充满了珍奇、奥秘和谜团，而[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]正热爱畅谈这些。"

 nick_the_compassionate: "[CHARACTER.Custom('WJ_nick_the_compassionate')]"
 WJ_nickname_han_nick_the_compassionate: "恤人"
 WJ_nickname_native_nick_the_compassionate: "同情者"
 nick_the_compassionate_desc: "[CHARACTER.Custom('WJ_nick_the_compassionate_desc')]"
 WJ_nickname_han_nick_the_compassionate_desc: "常怀恻隐之心，不忍坐视他人受苦。"
 WJ_nickname_native_nick_the_compassionate_desc: "对[CHARACTER.GetShortUINameNoTooltipNoFormat]来说，人生中最美好的是什么？是化敌为友，看他们的仇恨在[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]面前屈服，并感受到和解带来的欢欣。"

 nick_the_theologian: "[CHARACTER.Custom('WJ_nick_the_theologian')]"
 WJ_nickname_han_nick_the_theologian: "通玄"
 WJ_nickname_native_nick_the_theologian: "神学家"
 nick_the_theologian_desc: "[CHARACTER.Custom('WJ_nick_the_theologian_desc')]"
 WJ_nickname_han_nick_the_theologian_desc: "精研信仰义理，擅长辨析幽微之说。"
 WJ_nickname_native_nick_the_theologian_desc: "若不探究[CHARACTER.GetFaith.CreatorName]的真正本性，生命还有何意义？"

 nick_the_enlightened: "[CHARACTER.Custom('WJ_nick_the_enlightened')]"
 WJ_nickname_han_nick_the_enlightened: "达识"
 WJ_nickname_native_nick_the_enlightened: "觉悟者"
 nick_the_enlightened_desc: "[CHARACTER.Custom('WJ_nick_the_enlightened_desc')]"
 WJ_nickname_han_nick_the_enlightened_desc: "识见通达，能超脱拘泥，故有此称。"
 WJ_nickname_native_nick_the_enlightened_desc: "高深的学问本身就是一种回报，但要凭此能为人所知也#EMP 是#!相当不错的。"

 nick_the_stalwart: "[CHARACTER.Custom('WJ_nick_the_stalwart')]"
 WJ_nickname_han_nick_the_stalwart: "坚毅"
 WJ_nickname_native_nick_the_stalwart: "坚守战士"
 nick_the_stalwart_desc: "[CHARACTER.Custom('WJ_nick_the_stalwart_desc')]"
 WJ_nickname_han_nick_the_stalwart_desc: "意志坚强，危难之中亦不轻易退却。"
 WJ_nickname_native_nick_the_stalwart_desc: "无论狂风暴雨、干戈满地还是尸横遍野，[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]都会坚守。[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]必须如此。"

 nick_the_merciless: "[CHARACTER.Custom('WJ_nick_the_merciless')]"
 WJ_nickname_han_nick_the_merciless: "无恤"
 WJ_nickname_native_nick_the_merciless: "残酷者"
 nick_the_merciless_desc: "[CHARACTER.Custom('WJ_nick_the_merciless_desc')]"
 WJ_nickname_han_nick_the_merciless_desc: "对敌少施怜悯，严酷之名远近皆知。"
 WJ_nickname_native_nick_the_merciless_desc: "从不心慈手软，也没人怀此期望。朋友称[CHARACTER.GetShortUINameNoTooltipNoFormat]为务实，敌人则称[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]毫无荣誉感。"

 nick_the_imperious: "[CHARACTER.Custom('WJ_nick_the_imperious')]"
 WJ_nickname_han_nick_the_imperious: "独断"
 WJ_nickname_native_nick_the_imperious: "专横者"
 nick_the_imperious_desc: "[CHARACTER.Custom('WJ_nick_the_imperious_desc')]"
 WJ_nickname_han_nick_the_imperious_desc: "惯于独掌权柄，不容他人置喙。"
 WJ_nickname_native_nick_the_imperious_desc: "强权即公理，因为[CHARACTER.GetShortUINameNoTooltipNoFormat]总是对的，[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]理应确保[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]被认为拥有着强权。"

 nick_the_cosmic_poet: "[CHARACTER.Custom('WJ_nick_the_cosmic_poet')]"
 WJ_nickname_han_nick_the_cosmic_poet: "咏天"
 WJ_nickname_native_nick_the_cosmic_poet: "宇宙诗人"
 nick_the_cosmic_poet_desc: "[CHARACTER.Custom('WJ_nick_the_cosmic_poet_desc')]"
 WJ_nickname_han_nick_the_cosmic_poet_desc: "以诗思探问天地，篇章常及星辰万象。"
 WJ_nickname_native_nick_the_cosmic_poet_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U]的头脑浮于云端，而[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的思绪散于星间。"

 nick_the_gardener: "[CHARACTER.Custom('WJ_nick_the_gardener')]"
 WJ_nickname_han_nick_the_gardener: "莳花"
 WJ_nickname_native_nick_the_gardener: "园丁"
 nick_the_gardener_desc: "[CHARACTER.Custom('WJ_nick_the_gardener_desc')]"
 WJ_nickname_han_nick_the_gardener_desc: "喜爱栽花植木，常亲自照料园圃。"
 WJ_nickname_native_nick_the_gardener_desc: "在[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]心目中，整个世界都是一座花园——栽培它，它就会成长。"

 nick_the_mindbreaker: "[CHARACTER.Custom('WJ_nick_the_mindbreaker')]"
 WJ_nickname_han_nick_the_mindbreaker: "摧心"
 WJ_nickname_native_nick_the_mindbreaker: "摧心者"
 nick_the_mindbreaker_desc: "[CHARACTER.Custom('WJ_nick_the_mindbreaker_desc')]"
 WJ_nickname_han_nick_the_mindbreaker_desc: "善使他人心志崩溃，恶名令人不安。"
 WJ_nickname_native_nick_the_mindbreaker_desc: "人们提心吊胆地窃窃私语着，担心那些经历过[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]恶意折磨的人会变成什么样子。"

 nick_the_meticulous: "[CHARACTER.Custom('WJ_nick_the_meticulous')]"
 WJ_nickname_han_nick_the_meticulous: "谨细"
 WJ_nickname_native_nick_the_meticulous: "细致者"
 nick_the_meticulous_desc: "[CHARACTER.Custom('WJ_nick_the_meticulous_desc')]"
 WJ_nickname_han_nick_the_meticulous_desc: "行事细密，不肯轻放微小疏漏。"
 WJ_nickname_native_nick_the_meticulous_desc: "对细节的关注很重要，而缺乏这种关注说明性格存在弱点——至少，据[CHARACTER.GetShortUINameNoTooltipNoFormat]所说是这样。"

 nick_the_heartbreaker: "[CHARACTER.Custom('WJ_nick_the_heartbreaker')]"
 WJ_nickname_han_nick_the_heartbreaker: "薄幸"
 WJ_nickname_native_nick_the_heartbreaker: "碎心者"
 nick_the_heartbreaker_desc: "[CHARACTER.Custom('WJ_nick_the_heartbreaker_desc')]"
 WJ_nickname_han_nick_the_heartbreaker_desc: "屡负他人真情，留下薄幸之名。"
 WJ_nickname_native_nick_the_heartbreaker_desc: "他们说[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]喜欢有点危险性的东西。"

 nick_the_bully: "[CHARACTER.Custom('WJ_nick_the_bully')]"
 WJ_nickname_han_nick_the_bully: "凌弱"
 WJ_nickname_native_nick_the_bully: "霸凌者"
 nick_the_bully_desc: "[CHARACTER.Custom('WJ_nick_the_bully_desc')]"
 WJ_nickname_han_nick_the_bully_desc: "惯于欺凌弱小，仗势压人。"
 WJ_nickname_native_nick_the_bully_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]喜欢刁难[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]认为地位低于[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的人。"

 nick_the_foolish: "[CHARACTER.Custom('WJ_nick_the_foolish')]"
 WJ_nickname_han_nick_the_foolish: "昏愚"
 WJ_nickname_native_nick_the_foolish: "蠢蛋"
 nick_the_foolish_desc: "[CHARACTER.Custom('WJ_nick_the_foolish_desc')]"
 WJ_nickname_han_nick_the_foolish_desc: "判断屡误，言行失当，成为旁人的笑谈。"
 WJ_nickname_native_nick_the_foolish_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]以[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]……#EMP 独特#!的决策方法而闻名。"

 nick_the_gullible: "[CHARACTER.Custom('WJ_nick_the_gullible')]"
 WJ_nickname_han_nick_the_gullible: "轻信"
 WJ_nickname_native_nick_the_gullible: "轻信者"
 nick_the_gullible_desc: "[CHARACTER.Custom('WJ_nick_the_gullible_desc')]"
 WJ_nickname_han_nick_the_gullible_desc: "轻信人言，易受蒙蔽，常为他人所乘。"
 WJ_nickname_native_nick_the_gullible_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]有点过于信赖他人，反而对其自身不利。"

 nick_the_undefeated: "[CHARACTER.Custom('WJ_nick_the_undefeated')]"
 WJ_nickname_han_nick_the_undefeated: "不败"
 WJ_nickname_native_nick_the_undefeated: "不败者"
 nick_the_undefeated_desc: "[CHARACTER.Custom('WJ_nick_the_undefeated_desc')]"
 WJ_nickname_han_nick_the_undefeated_desc: "未尝败绩，声威因连战得胜而日盛。"
 WJ_nickname_native_nick_the_undefeated_desc: "[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]完全彻底地在战斗中立于不败之地，从未尝受过可耻失败所带来的苦痛。"

 nick_the_triumphant: "[CHARACTER.Custom('WJ_nick_the_triumphant')]"
 WJ_nickname_han_nick_the_triumphant: "奏凯"
 WJ_nickname_native_nick_the_triumphant: "得胜者"
 nick_the_triumphant_desc: "[CHARACTER.Custom('WJ_nick_the_triumphant_desc')]"
 WJ_nickname_han_nick_the_triumphant_desc: "大获全胜，凯歌与声名一并流传。"
 WJ_nickname_native_nick_the_triumphant_desc: "当世界产生一个号称不可战胜的冠军时，[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]会将其打倒并将其传奇击碎。"

 nick_the_fury: "[CHARACTER.Custom('WJ_nick_the_fury')]"
 WJ_nickname_han_nick_the_fury: "烈怒"
 WJ_nickname_native_nick_the_fury: "狂怒者"
 nick_the_fury_desc: "[CHARACTER.Custom('WJ_nick_the_fury_desc')]"
 WJ_nickname_han_nick_the_fury_desc: "怒势难遏，令人见之生畏。"
 WJ_nickname_native_nick_the_fury_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U]的愤怒，[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的怨恨，[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的#EMP 报复#!都被认为是一种可怕的必然。这#EMP 就是#!不可避免的。"

 nick_the_trustworthy: "[CHARACTER.Custom('WJ_nick_the_trustworthy')]"
 WJ_nickname_han_nick_the_trustworthy: "重诺"
 WJ_nickname_native_nick_the_trustworthy: "信实者"
 nick_the_trustworthy_desc: "[CHARACTER.Custom('WJ_nick_the_trustworthy_desc')]"
 WJ_nickname_han_nick_the_trustworthy_desc: "言出必践，所诺不轻弃，为人所信。"
 WJ_nickname_native_nick_the_trustworthy_desc: "坚实、可靠、真诚得可爱——不过惊人地容易上[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]敌人的当。"

 nick_the_trustworthy_ironic: "[CHARACTER.Custom('WJ_nick_the_trustworthy_ironic')]"
 WJ_nickname_han_nick_the_trustworthy_ironic: "重诺"
 WJ_nickname_native_nick_the_trustworthy_ironic: "$nick_the_trustworthy$"
 nick_the_trustworthy_ironic_desc: "[CHARACTER.Custom('WJ_nick_the_trustworthy_ironic_desc')]"
 WJ_nickname_han_nick_the_trustworthy_ironic_desc: "世人故作反语，以守信之名讥其言行。"
 WJ_nickname_native_nick_the_trustworthy_ironic_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]在[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]一生中简直没说过一句谎。"

 nick_the_unrelenting: "[CHARACTER.Custom('WJ_nick_the_unrelenting')]"
 WJ_nickname_han_nick_the_unrelenting: "不屈"
 WJ_nickname_native_nick_the_unrelenting: "冷酷者"
 nick_the_unrelenting_desc: "[CHARACTER.Custom('WJ_nick_the_unrelenting_desc')]"
 WJ_nickname_han_nick_the_unrelenting_desc: "志意坚定，历经挫折亦不肯低头。"
 WJ_nickname_native_nick_the_unrelenting_desc: "当[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]下定[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的决心去做某件事时，[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]就会做成。不论要花多长的时间。"

 nick_the_glorious: "[CHARACTER.Custom('WJ_nick_the_glorious')]"
 WJ_nickname_han_nick_the_glorious: "显赫"
 WJ_nickname_native_nick_the_glorious: "荣耀者"
 nick_the_glorious_desc: "[CHARACTER.Custom('WJ_nick_the_glorious_desc')]"
 WJ_nickname_han_nick_the_glorious_desc: "功名炳著，声誉显赫，远近皆有耳闻。"
 WJ_nickname_native_nick_the_glorious_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]肯定会作为一直以来最为威重加身的人物之一而载入史册，为世界增光添彩。"

 nick_the_loyal: "[CHARACTER.Custom('WJ_nick_the_loyal')]"
 WJ_nickname_han_nick_the_loyal: "忠信"
 WJ_nickname_native_nick_the_loyal: "忠信者"
 nick_the_loyal_desc: "[CHARACTER.Custom('WJ_nick_the_loyal_desc')]"
 WJ_nickname_han_nick_the_loyal_desc: "忠于所事，不轻负托，信义为众人所称。"
 WJ_nickname_native_nick_the_loyal_desc: "无论或晴或雨，无论发生什么，[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的朋友知道[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]都会站在他们一边。"

 nick_troublemaker: "[CHARACTER.Custom('WJ_nick_troublemaker')]"
 WJ_nickname_han_nick_troublemaker: "生事"
 WJ_nickname_native_nick_troublemaker: "麻烦制造者"
 nick_troublemaker_desc: "[CHARACTER.Custom('WJ_nick_troublemaker_desc')]"
 WJ_nickname_han_nick_troublemaker_desc: "常挑起纷争，所到之处难得安宁。"
 WJ_nickname_native_nick_troublemaker_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]以[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]的观点、见解和音量而闻名。"

 nick_the_timid: "[CHARACTER.Custom('WJ_nick_the_timid')]"
 WJ_nickname_han_nick_the_timid: "畏缩"
 WJ_nickname_native_nick_the_timid: "羞怯者"
 nick_the_timid_desc: "[CHARACTER.Custom('WJ_nick_the_timid_desc')]"
 WJ_nickname_han_nick_the_timid_desc: "临事怯弱，惯于退避，少敢挺身而出。"
 WJ_nickname_native_nick_the_timid_desc: "[Select_CString(CHARACTER.IsLocalPlayer, '你', Select_CString(CHARACTER.IsFemale, '她', '他' ))]温文尔雅，甚至还有点神经兮兮，并不能很好地处理直接的对抗。"

 nick_the_truthspeaker: "[CHARACTER.Custom('WJ_nick_the_truthspeaker')]"
