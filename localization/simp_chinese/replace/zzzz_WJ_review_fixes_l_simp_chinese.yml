 WJ_emperor_puppet_decision:0 "控制天子"
 WJ_emperor_puppet_decision_desc:0 "以辅政之权总领中外，使本朝天子受我节制。须亲任摄政、摄政权力达到四级、威望等级高于三级，并为都督中外诸军事；又须获两名不同内廷重臣支持，或天子年幼、无能。\n\n沿用原生傀儡关系、DLC与名额，不得控制玩家天子。"
 WJ_emperor_puppet_qualification_tt:0 "亲任摄政，权力至少四级，威望高于三级，任都督中外诸军事；且大将军、侍中、大司马、中常侍中至少两名不同在任者为你的门生、直接幕僚或受你强牵制，或天子未成年／无能"
 WJ_emperor_puppet_decision_tooltip:0 "使本朝AI天子成为你的原生统治者傀儡。"
