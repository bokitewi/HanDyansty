l_simp_chinese:
 # 原「军府募兵制」系列（kuzhu_admin_recruit_*）2026-10-31 并入原版军队指挥体系：沿用其名称与说明，效果文本用原版
 celestial_army_liege_law_0: "军府募兵制"
 celestial_army_liege_law_0_subname: "各地军政长官自行招募、供养军队，中枢只保留名义上的统辖权。"
 celestial_army_liege_law_1: "中外分掌制"
 celestial_army_liege_law_1_subname: "中枢与地方共同负担兵员、军费和调度之责。"
 celestial_army_liege_law_2: "府兵制"
 celestial_army_liege_law_2_subname: "以田土供养编户军士，平时务农操练，战时奉诏出征。"
 celestial_army_liege_law_3: "禁军制"
 celestial_army_liege_law_3_subname: "精锐常备军由中枢直接供养、选将和调遣，地方难以染指。"
 celestial_army_vassal_law_0_subname: "君主将招募和供养军队之权交给地方长官。"
 celestial_army_vassal_law_1_subname: "君主与地方共同负担兵员、军费和调度之责。"
 celestial_army_vassal_law_2_subname: "以田土供养编户军士，令其按君主诏令出征。"
 celestial_army_vassal_law_3_subname: "兵权、军费与选将之权尽归中枢，地方长官不得自行干预。"
