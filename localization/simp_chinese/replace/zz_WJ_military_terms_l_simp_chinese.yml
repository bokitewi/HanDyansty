 trait_WJ_mr_zhonglang_fudong_desc:0 "抚慰东方军民，持节巡行，存问疾苦，安辑流亡。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循五品重号中郎将加职。"
 trait_WJ_mr_zhonglang_fujun_desc:0 "主抚慰军心，或于战后安辑士卒，存问伤病。"
 trait_WJ_mr_zhonglang_funan_desc:0 "抚慰南方军民，持节巡行，存问疾苦，安辑流亡。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循五品重号中郎将加职。"
 trait_WJ_mr_zhonglang_fuxi_desc:0 "抚慰西方军民，持节巡行，存问疾苦，安辑流亡。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循五品重号中郎将加职。"
 trait_WJ_mr_zhonglang_guanjun_desc:0 "勇冠三军，多授骁将，或与先锋共击。"
 trait_WJ_mr_zhonglang_guanwei_desc:0 "主关隘守卫，守备要塞，盘诘出入，以备非常。"
 trait_WJ_mr_zhonglang_huaihua_desc:0 "主怀柔教化，或纳降抚众，使归王化。"
 trait_WJ_mr_zhonglang_huben_desc:0 "主虎贲禁兵，掌宿卫侍从，皆为勇力之士，可出征为前锋精卒。"
 trait_WJ_mr_zhonglang_hujun_desc:0 "主护卫禁军，或监护诸将，司察违失。"
 trait_WJ_mr_zhonglang_human_desc:0 "监护南中蛮夷，持节督护，招纳降附，讨击不臣。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循五品重号中郎将加职。"
 trait_WJ_mr_zhonglang_huqi_desc:0 "主胡骑部队，掌内附胡人骑兵，骁勇善战。"
 trait_WJ_mr_zhonglang_huqiang_desc:0 "监护羌人诸部，持节镇抚，以恩威并施，和戎安边。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循五品重号中郎将加职。"
 trait_WJ_mr_zhonglang_huwei_desc:0 "威猛如虎，或领宿卫营兵，亦可出讨不庭。"
 trait_WJ_mr_zhonglang_huwuhuan_desc:0 "监护乌桓部众，开营府于要地，掌其渠帅封赏及征发从征。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循五品重号中郎将加职。"
 trait_WJ_mr_zhonglang_huxiongnu_desc:0 "监护匈奴部众，驻节边郡，持节督护，和辑抚纳，亦备征讨。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循五品重号中郎将加职。"
 trait_WJ_mr_zhonglang_huyi_desc:0 "监护东方夷人，持节督护，和辑诸部，捍御海疆。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循五品重号中郎将加职。"
 trait_WJ_mr_zhonglang_jianjun_desc:0 "主监督诸军，持节监临，司察功过，以肃军纪。"
 trait_WJ_mr_zhonglang_jianwu_desc:0 "主建立武功，或因新设营伍，建号以统之。"
 trait_WJ_mr_zhonglang_jingbei_desc:0 "绥靖北方，平定叛乱，以安疆场。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循五品重号中郎将加职。"
 trait_WJ_mr_zhonglang_jingdong_desc:0 "绥靖东方，平定叛乱，以安疆场。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循五品重号中郎将加职。"
 trait_WJ_mr_zhonglang_jingnan_desc:0 "绥靖南方，平定叛乱，以安疆场。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循五品重号中郎将加职。"
 trait_WJ_mr_zhonglang_jingnan_variant_2_desc:0 "主平定祸乱，或以危难之际受命，清君侧，安社稷。"
 trait_WJ_mr_zhonglang_jingxi_desc:0 "绥靖西方，平定叛乱，以安疆场。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循五品重号中郎将加职。"
 trait_WJ_mr_zhonglang_lingjun_desc:0 "主统领禁兵，或总摄中军诸营，宿卫宫省，亦常遣督外军。"
 trait_WJ_mr_zhonglang_longxiang_desc:0 "如龙腾骧，或领精兵猛将，为大军前锋。"
 trait_WJ_mr_zhonglang_louchuan_desc:0 "主水军战舰，统楼船、戈船诸部，习流而阵。"
 trait_WJ_mr_zhonglang_nan_desc:0 "出镇南方州郡，主持节督军，掌方面征伐镇戍之事。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循五品重号中郎将加职。"
 trait_WJ_mr_zhonglang_pinglu_desc:0 "主平定虏寇，或领边兵出塞，扫清朔方。"
 trait_WJ_mr_zhonglang_qingche_desc:0 "主车骑驰骋，统轻车锐卒，利在赴敌急速。"
 trait_WJ_mr_zhonglang_shesheng_desc:0 "主射声部队，掌弓弩手，以强弩射远制敌。"
 trait_WJ_mr_zhonglang_sima_desc:0 "主军事司马，参赞戎机，典兵曹文书律令。"
 trait_WJ_mr_zhonglang_taoni_desc:0 "主讨伐叛逆，或奉诏出征，以正刑典。"
 trait_WJ_mr_zhonglang_tianjin_desc:0 "主津渡要地，掌舟楫桥梁，以备军行转运。"
 trait_WJ_mr_zhonglang_tunqi_desc:0 "主屯驻骑兵，或戍守要地，以备非常。"
 trait_WJ_mr_zhonglang_wuguan_desc:0 "主五官郎，掌宫殿门户宿卫，亦主郎官选举勤务。"
 trait_WJ_mr_zhonglang_wuwei_desc:0 "主武卫禁兵，掌宫省宿卫，亦统中军精锐，可出讨叛逆。"
 trait_WJ_mr_zhonglang_xi_desc:0 "出镇西方州郡，主持节督军，掌方面征伐镇戍之事。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循五品重号中郎将加职。"
 trait_WJ_mr_zhonglang_xiaoqi_desc:0 "主骁锐骑兵，以精骑突驰，摧折敌锋。"
 trait_WJ_mr_zhonglang_xunwei_desc:0 "主巡防卫戍，或巡察京畿，以备奸盗。"
 trait_WJ_mr_zhonglang_yangwei_desc:0 "主宣扬威德，或以军威慑敌，不战而屈人之兵。"
 trait_WJ_mr_zhonglang_yingyang_desc:0 "如鹰飞扬，主伺机而动，领游军往来策应，出其不意。"
 trait_WJ_mr_zhonglang_you_desc:0 "主右署郎，掌守宫殿右掖门户，亦统禁旅，可遣戍外镇。"
 trait_WJ_mr_zhonglang_youji_desc:0 "主游击之兵，出没无常，以扰敌后，断其粮道。"
 trait_WJ_mr_zhonglang_yueqi_desc:0 "主越骑营兵，掌骑兵，或统内附越人骑士。"
 trait_WJ_mr_zhonglang_yulin_desc:0 "主羽林骑，掌宿卫侍从，拣选良家子及死事之孤充之，亦从征伐。"
 trait_WJ_mr_zhonglang_zhangjun_desc:0 "主禁中兵马，为重要禁卫武官。此为中央军体系将领，既可统领宫禁宿卫之中军，亦可领兵驻守地方要害之外军，拱卫朝廷疆域。"
 trait_WJ_mr_zhonglang_zhangshi_desc:0 "主军府长史事，掌书记机要，或代行将令，权任颇重。"
 trait_WJ_mr_zhonglang_zhechong_desc:0 "取折冲御侮之义，主方面守御，保境安民。"
 trait_WJ_mr_zhonglang_zhengdi_desc:0 "征讨北狄，统兵北伐，扫清朔漠，以张国威。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循五品重号中郎将加职。"
 trait_WJ_mr_zhonglang_zhengman_desc:0 "征讨南蛮，统兵南征，深入不毛，以绥南土。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循五品重号中郎将加职。"
 trait_WJ_mr_zhonglang_zhengrong_desc:0 "征讨西戎，统兵出塞，以兵威震慑，靖边安境。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循五品重号中郎将加职。"
 trait_WJ_mr_zhonglang_zhengyi_desc:0 "征讨东夷，统兵东伐，浮海击之，以清海隅。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循五品重号中郎将加职。"
 trait_WJ_mr_zhonglang_zhenjun_desc:0 "主镇守方面，或统兵戍边，以重威御敌。"
 trait_WJ_mr_zhonglang_zhenshuo_desc:0 "镇守北疆，督护边塞，谨烽火，御胡骑，以固朔方。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循五品重号中郎将加职。"
 trait_WJ_mr_zhonglang_zhenwei_desc:0 "主振奋军威，或督偏师征讨，持节假威，以镇方面。"
 trait_WJ_mr_zhonglang_zhenwu_desc:0 "主振兴武备，或整训疲卒，使之复振。"
 trait_WJ_mr_zhonglang_zhonglei_desc:0 "主中垒营兵，掌北军屯兵，亦主征伐营阵之事。"
 trait_WJ_mr_zhonglang_zuo_desc:0 "主左署郎，掌守宫殿左掖门户，亦领禁兵，可出镇督军。"
