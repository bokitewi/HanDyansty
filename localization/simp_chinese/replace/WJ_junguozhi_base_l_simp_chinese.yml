 game_concept_wj_junguozhi_desc:0 "[GetGovernment('celestial_government').GetRuleInfo][GetGovernment('celestial_government').GetFlagInfo]\n[wj_junguozhi|E]是本项目的基础[government_bureaucratic_type|E][government_form|E]，直接使用原天朝政体，不依赖额外官制法律。天子统摄朝廷，[liege|E]任命[wj_guanyuan|E]治理地方，依实际契约区分州郡、军戍与司隶。\n\n角色使用[influence|E]、[noble_families|E]、[family_estates|E]与[treasury|E]。独立[rulers|E]拥有[legitimacy|E]，臣属以[merit|E]进阶仕途。\n\n科举不作为本政体的入仕机制；既有辟召、举孝廉、举茂才、清谈和考课为默认制度。地方[title_men_at_arms|E]仍按真实爵级资格，县级头衔不承载头衔兵。\n\n#F 郡国并行而权归天子。中央公卿辅政，地方州郡奉诏治民。#!"
 game_concept_merit:0 "贤望"
 game_concept_meritorious:0 "贤望卓著"
 game_concept_merit_desc:0 "$game_concept_wj_mingwang_desc$"
 game_concept_wj_mingwang_desc:0 "贤望源于士人的德行、声誉与功业。清谈使才学为人所知，荐举使名声传于朝野，任职与考课则检验治事之能。\n\n[merit|E]越高，越易为朝廷与士林推重，所能承任的官职也越重；声誉虽盛，仍须经正式任命方能掌职。"
 game_concept_merit_level:0 "贤望等级"
 game_concept_merit_levels:0 "贤望等级"
 game_concept_merit_level_desc:0 "[merit_level|E]衡量角色的声誉及任官上限，不是当前实职。显示分为县、郡、州、卿、公五等：\n\n$EFFECT_LIST_BULLET$[wj_xianwang_level_xian|E]——县等\n$EFFECT_LIST_BULLET$[wj_xianwang_level_jun|E]——郡等\n$EFFECT_LIST_BULLET$[wj_xianwang_level_zhou|E]——州等\n$EFFECT_LIST_BULLET$[wj_xianwang_level_chao|E]——卿等\n$EFFECT_LIST_BULLET$[wj_xianwang_level_gong|E]——公等\n\n正式入仕资格与真实任职仍须分别取得，不能仅凭贤望生成官职。"
 game_concept_merit_level_impact:0 "贤望等级影响"
 game_concept_merit_level_impact_desc:0 "贤望等级影响提高或降低当前[merit_level|E]提供的[modifiers|E]。"
