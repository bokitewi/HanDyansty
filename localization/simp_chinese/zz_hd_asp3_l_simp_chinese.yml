 hd_asp_mod_xue_fangtou:0 "雪枋头之耻"
 hd_asp_mod_xue_fangtou_desc:0 "此人洗雪了枋头之败。"
 hd_asp.0330.t:0 "东嬴之志"
 hd_asp.0330.desc:0 "刘渊在左国城称王，并州的胡骑一日比一日多。粮仓见底，流民成群地往东走。你手里还有一支并州兵，眼下要往哪里去，得拿个主意了。"
 hd_asp.0330.a:0 "率并州之众东下就食，镇于邺城。"
 hd_asp.0330.b:0 "死守晋阳，做朝廷的北门锁钥。"
 hd_asp.0330.c:0 "并州是我的，谁也拿不走。"
 hd_asp.0331.t:0 "河间之志"
 hd_asp.0331.desc:0 "张方的兵马驻在洛阳，天子名义上还坐在太极殿里。关中是你的根本，朝廷却在千里之外。是把天子接到身边，还是守住关中？"
 hd_asp.0331.a:0 "挟天子西迁，都于长安。"
 hd_asp.0331.b:0 "关中山河四塞，足以自立。"
 hd_asp.0331.c:0 "张方骄横，此人不可久留。"
 hd_asp.0332.t:0 "成都之志"
 hd_asp.0332.desc:0 "邺城的宫阙仍在，你的皇太弟之位却已岌岌可危。王浚与鲜卑在北，东海王在南，河间王在西。你要为自己争一个怎样的结局？"
 hd_asp.0332.a:0 "复为皇太弟，入承大统。"
 hd_asp.0332.b:0 "改写邺城的结局，东山再起。"
 hd_asp.0332.c:0 "据有河北，自成一国。"
 hd_asp.0333.t:0 "东海之志"
 hd_asp.0333.desc:0 "天子蒙尘，诸王各怀鬼胎。你的檄文已经写好，范阳王、王浚都愿出兵。只是迎回天子之后，这天下该由谁来做主？"
 hd_asp.0333.a:0 "迎驾还洛，入朝秉政。"
 hd_asp.0333.b:0 "清君侧，权归一人。"
 hd_asp.0333.c:0 "保全社稷，挡住胡人。"
 hd_asp.0334.t:0 "彭祖之志"
 hd_asp.0334.desc:0 "幽州的鲜卑突骑是天下劲旅，诸王都想拉拢你。蓟城以北是你的天地，朝廷的诏书在这里不过是一纸空文。你想走多远？"
 hd_asp.0334.a:0 "自立于幽州，称尊北方。"
 hd_asp.0334.b:0 "做北方的屏障，挡住石勒。"
 hd_asp.0334.c:0 "收服鲜卑诸部，尽为我用。"
 hd_asp.0335.t:0 "仲儁之志"
 hd_asp.0335.desc:0 "成都已在你手中，流民们第一次有了安身之地。罗尚退守江阳，青城山的范长生派人送来了书信。你打算在蜀中成就怎样的基业？"
 hd_asp.0335.a:0 "即皇帝位，国号大成。"
 hd_asp.0335.b:0 "尽有巴蜀，北据汉中。"
 hd_asp.0335.c:0 "传位于子，基业永固。"
 hd_asp.0336.t:0 "士彦之志"
 hd_asp.0336.desc:0 "河西走廊风沙漫天，却是中原士人避难的乐土。洛阳的朝廷一年比一年衰弱，你的子孙会守着这片土地走多远？"
 hd_asp.0336.a:0 "保据河西，遥奉晋室。"
 hd_asp.0336.b:0 "西州之王，自成一国。"
 hd_asp.0336.c:0 "东出秦陇，屏障关中。"
 hd_asp.0337.t:0 "世龙之志"
 hd_asp.0337.desc:0 "你曾被人戴上枷锁，在茌平的田里耕作。如今你手下有了兵马，河北的豪杰都来投奔。你想过，一个奴隶最终能走到哪一步？"
 hd_asp.0337.a:0 "起于奴隶，终于天王。"
 hd_asp.0337.b:0 "收罗衣冠，建君子营。"
 hd_asp.0337.c:0 "饮马长江，一统中原。"
 hd_asp.0317.t:0 "昭烈遗胤"
 hd_asp.0317.desc:0 "你是昭烈皇帝的曾孙，却在李氏的成都做着安乐公。宗庙里的香火还在，城中仍有父老悄悄叫你一声「殿下」。复刘氏之汉，只是一个梦吗？"
 hd_asp.0317.a:0 "再造炎汉，复刘氏之汉。"
 hd_asp.0317.b:0 "梦就是梦，安乐度日罢了。"
 hd_asp.0318.t:0 "道明之志"
 hd_asp.0318.desc:0 "你寄身秦国，苻坚待你如上宾，王猛却视你如虎。燕国的宗庙还在邺城，可那里已容不下你。你这一生，究竟要为谁而战？"
 hd_asp.0318.a:0 "燕元复国，再造燕室。"
 hd_asp.0318.b:0 "报秦知遇，终老秦臣。"
 hd_asp.0318.c:0 "奉迎旧主，复立燕帝。"
 hd_asp.0319.t:0 "安石之志"
 hd_asp.0319.desc:0 "你从东山出来，已在朝中站稳了脚跟。桓温的野心人尽皆知，北方的秦国一天比一天强大。谢家的子弟都在看着你，你打算把他们带到哪里？"
 hd_asp.0319.a:0 "镇以和靖，御以长算，却敌于淝水。"
 hd_asp.0319.b:0 "北伐中原，还都洛阳。"
 hd_asp.0319.c:0 "门户永昌，谢氏子弟遍布方镇。"
 hd_asp.0320.t:0 "昭成之志"
 hd_asp.0320.desc:0 "你在盛乐建起了宫室，立了百官。可刘卫辰引来了秦国的兵马，南边的并州、冀州又是燕人的地盘。代国要在阴山下走多远？"
 hd_asp.0320.a:0 "建国代北，压服铁弗。"
 hd_asp.0320.b:0 "抗秦存代，守住云中。"
 hd_asp.0320.c:0 "南窥并冀，饮马汾晋。"
 hd_asp.0321.t:0 "元子晚志"
 hd_asp.0321.desc:0 "你已年近六十，三次北伐，有胜有败，枋头一役更是折尽了锐气。九锡迟迟不至，朝中的人都在看你下一步怎么走。"
 hd_asp.0321.a:0 "行伊霍之事，废立以立威。"
 hd_asp.0321.b:0 "受禅代晋，天命归我。"
 hd_asp.0321.c:0 "雪枋头之耻，收复两京。"
 hd_story_sima_teng_life:0 "司马腾本纪"
 hd_story_sima_teng_life_desc:0 "字元迈，河内温县人"
 HD_STORY_SIMA_TENG_LIFE_STATUS:0 "司马元迈是晋宣帝之弟司马馗的孙子，封东嬴公，以宁北将军都督并州诸军事，坐镇晋阳。匈奴刘渊已在左国城起兵，并州饥荒连年，百姓流离，他身后的路，似乎只剩东下一条。"
 hd_story_sima_yong_life:0 "司马颙本纪"
 hd_story_sima_yong_life_desc:0 "字文载，河内温县人"
 HD_STORY_SIMA_YONG_LIFE_STATUS:0 "司马文载是安平献王司马孚之孙，封河间王，镇关中。他先附赵王伦，又投齐王冏，再借成都王颖之力入主朝政。如今天子在他的将军张方手里，洛阳宫中的一举一动，都要先问长安的意思。"
 hd_story_sima_ying_life:0 "司马颖本纪"
 hd_story_sima_ying_life_desc:0 "字章度，河内温县人"
 HD_STORY_SIMA_YING_LIFE_STATUS:0 "司马章度是晋武帝第十六子，封成都王，镇邺城。他曾起兵讨赵王伦，名动天下；又受封皇太弟，遥执朝政。荡阴一战，天子落入他手，而王浚的鲜卑突骑已经南下。"
 hd_story_sima_yue_life:0 "司马越本纪"
 hd_story_sima_yue_life_desc:0 "字元超，河内温县人"
 HD_STORY_SIMA_YUE_LIFE_STATUS:0 "司马元超是高密文献王司马泰的长子，封东海王。他少有令名，谦恭好士，在诸王纷争中几度起落。如今天子被挟往西方，他在东海整顿兵马，传檄四方，准备迎驾。"
 hd_story_wang_jun_life:0 "王浚本纪"
 hd_story_wang_jun_life_desc:0 "字彭祖，太原晋阳人"
 HD_STORY_WANG_JUN_LIFE_STATUS:0 "王彭祖是司空王沈之子，以宁北将军、青州刺史起家，后都督幽州诸军事。他把女儿嫁给鲜卑段部和宇文部的首领，手握鲜卑突骑，在河北首屈一指。"
 hd_story_li_xiong_life:0 "李雄本纪"
 hd_story_li_xiong_life_desc:0 "字仲儁，巴西宕渠人"
 HD_STORY_LI_XIONG_LIFE_STATUS:0 "李仲儁是賨人，父亲李特率秦雍流民入蜀，与益州刺史罗尚连年交战。李特、李流相继死后，众人推他为主。他攻下成都，自称成都王，青城山的隐士范长生正在等他。"
 hd_story_zhang_gui_life:0 "张轨本纪"
 hd_story_zhang_gui_life_desc:0 "字士彦，安定乌氏人"
 HD_STORY_ZHANG_GUI_LIFE_STATUS:0 "张士彦是汉常山景王张耳的十七世孙，家世孝廉，以儒学知名。他见天下将乱，求为凉州刺史，保据河西。凉州的兵马和钱粮，此后屡屡越过陇山，去救援洛阳的朝廷。"
 hd_story_shi_le_life:0 "石勒本纪"
 hd_story_shi_le_life_desc:0 "字世龙，上党武乡人"
 HD_STORY_SHI_LE_LIFE_STATUS:0 "石世龙是羯人，少时被并州刺史掠卖为奴，在茌平耕田。他与汲桑招集牧人亡命，号「十八骑」，从此纵横河北。他不识字，却爱听人读史书。"
 hd_story_liu_xuan_life:0 "刘玄本纪"
 hd_story_liu_xuan_life_desc:0 "蜀汉昭烈帝曾孙"
 HD_STORY_LIU_XUAN_LIFE_STATUS:0 "刘玄是蜀汉昭烈帝的曾孙、甘陵王刘永之孙。蜀汉亡后，刘氏子孙流落各地，独他留在蜀中。李雄据蜀，封他为安乐公，奉后主之祀。成都城里仍有老人记得炎汉的旗号。"
 hd_story_murong_chui_life:0 "慕容垂本纪"
 hd_story_murong_chui_life_desc:0 "字道明，昌黎棘城人"
 HD_STORY_MURONG_CHUI_LIFE_STATUS:0 "慕容道明是前燕文明帝慕容皝第五子，本名霸，少有大志。枋头一战，他大破桓温，却遭太傅慕容评与太后猜忌，只得携子奔秦。苻坚亲自出城相迎，王猛却在一旁冷冷地看着他。"
 hd_story_xie_an_life:0 "谢安本纪"
 hd_story_xie_an_life_desc:0 "字安石，陈郡阳夏人"
 HD_STORY_XIE_AN_LIFE_STATUS:0 "谢安石少有重名，屡辞征辟，隐居会稽东山，与王羲之、许询等游山赏水。直到年过四十，家族中人凋零，他才应桓温之召出仕。人们说：「安石不肯出，将如苍生何！」"
 hd_story_shiyijian_life:0 "什翼犍本纪"
 hd_story_shiyijian_life_desc:0 "代王，拓跋氏"
 HD_STORY_SHIYIJIAN_LIFE_STATUS:0 "拓跋什翼犍是代王拓跋郁律之子，少年时作为人质在后赵襄国住了十年。归国即位后，他建元「建国」，始置百官，分掌众职，又在盛乐筑城。如今铁弗部的刘卫辰投向了秦国，阴山南北风声日紧。"
 nick_hd_asp_zhaolie_yiyin:0 "昭烈遗胤"
 nick_hd_asp_zhaolie_yiyin_desc:0 "以昭烈皇帝之后自居，在蜀中重举汉帜，蜀人称之为汉家遗胤。"
