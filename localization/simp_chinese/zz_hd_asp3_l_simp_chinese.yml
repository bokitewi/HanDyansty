 hd_asp_card_xan_feishui_desc:0 "#high 主要目标#!\n· 淝水之战晋方获胜或不分胜负，你在世且仍是晋臣；或太元九年（384 年）六月以后秦国已瓦解，寿春与广陵都在晋天子领内\n#high 额外目标#!\n· 谢玄持有广陵郡（北府）\n· 你身任尚书令（录尚书事）\n· 你曾在新亭之会从容自若，或桓冲在世且对你好感不低于 0\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_anshi_fengliu$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_xan_feishui:0 "事见《晋书·谢安传》：玄等既破坚，有驿书至，安方对客围棋，看书既竟，便摄放床上，了无喜色，棋如故。"
