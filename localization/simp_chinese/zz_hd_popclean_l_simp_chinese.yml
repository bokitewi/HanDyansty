l_simp_chinese:
 hd_popclean_decision:0 "清理冗余人口"
 hd_popclean_decision_desc:0 "天下宫廷与道路间充斥着无名无姓之辈。清理一批无王朝、无封地的廷臣与游荡者，以减轻游戏负担。"
 hd_popclean_decision_tooltip:0 "清理 7000 名无王朝、无封地的廷臣与游荡者。"
 hd_popclean_decision_confirm:0 "清理"
 hd_popclean_decision_effect_tt:0 "在今后三个月内，让 7000 名无王朝、无封地的廷臣与游荡者无声消失。优先清理霸权以外的伯爵与男爵宫廷，以及部落、封建、游牧、牧民宫廷；霸权以内的公爵及以上宫廷不受影响。统治者的配偶、妾室与子女，现任议员、官员、骑士与军官，历史人物，以及才能出众或有优良先天特质者，一律保留。"
 hd_popclean_message_title:0 "冗余人口清理已排期"
 hd_popclean_message_desc:0 "今后三个月内将有 [GetGlobalVariable('hd_popclean_scheduled').GetValue|0] 人无声消失。"
