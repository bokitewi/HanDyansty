l_simp_chinese:
 hd_qin_lun_name:0 "秦论"
 hd_qin_lun.0001.t:0 "异域来客"
 hd_qin_lun.0001.desc:0 "引见的人还未说完，堂下的外乡客已学着众人的样子行礼。他自称秦论，从大秦远道而来，经交趾辗转至此；说到海路，便用手在地上划出几段弯曲的航程。\n\n旁边有人打量他的面容，也有人追问那遥远国度的物产。我让他先讲来时经过的地方。他说出几个陌生名字，见我们未听明白，便换个说法，又请引见者帮着解释。先前低声议论的人也凑近了，想听清海那边的人怎样生活。\n\n秦论说愿为我效力，求一个安身之处。我还得再问问他熟悉什么，能在这里做什么。是让他留下，还是赠些盘缠送他继续赶路，总该给他一个明白的答复。"
 hd_qin_lun.0001.a:0 "此人有用，留之左右。"
 hd_qin_lun.0001.b:0 "赠以盘缠，送他上路。"
