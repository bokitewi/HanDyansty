 uuii_bm_group_184: "公元184年"
 bm_uuii_184: "184年"
 bm_uuii_184_desc: "光和七年，岁在甲子。汉室享国已近四百载，洛阳宫中，宦官与外戚明争暗斗，卖官鬻爵之风行于朝野；州郡之间，豪强兼并田土，连年的灾疫与徭役，早已把百姓逼到了绝处。\n\n太平道的符水与经文，在青、徐、幽、冀、荆、扬、兖、豫八州之间悄然流传，三十六方信众只待一声号令。京城寺门与州郡官府的墙上，不知何时已用白土写满了“甲子”二字。\n\n#bold 风雨欲来。你将匡扶摇摇欲坠的汉室，还是乘势而起，另立一番乾坤？#!"
uuii_book_cao_cao_name_subheading: "治世之能臣，乱世之奸雄"
uuii_book_liu_bei_name_subheading: "其德昭昭，其志烈烈"
uuii_book_yuan_shao_name_subheading: "高风义轨，冠冕海内"
uuii_book_sun_jian_name_subheading: "破虏将军"
uuii_book_zhang_jiao_name_subheading: "大贤良师"
 uuii_book_cao_cao_name_desc: "曹操出身沛国曹氏，才略过人，却因祖父曹腾是宦官，屡遭清流非议。显赫的家世为他打开了仕途，也成了他终身难以洗脱的出身。\n\n他早年任洛阳北部尉，棒杀犯禁的权宦亲属，声名由此鹊起；其后屡次上书直陈时弊，朝廷却不能用。眼见汉室日渐衰微，曹操胸中仍怀着一腔报国之志。\n\n#bold 你将成为治世之能臣，还是乱世之奸雄？#!"

 uuii_book_yuan_shao_name_desc: "汝南袁氏四世三公，门生故吏遍布天下。袁绍凭借家声与折节下士的名望，早已成为士人瞩目的人物，在洛阳的权力中心如鱼得水。\n\n宫中宦官与外戚的争斗日益激烈，朝野都在等待有人率先出手。袁绍有号召群士的声望，却必须决定，要把这份声望用在何处。\n\n#bold 你能否聚拢天下英杰，在这风雨飘摇之世，让汝南袁氏登上权力之巅？#!"

 uuii_book_liu_bei_name_desc: "刘备自称中山靖王之后，可这一支宗室早已衰落。他少年丧父，与母亲织席贩履为业，幸得同宗资助，才得以与公孙瓒一同拜入卢植门下求学。\n\n边地幽州人心浮动，不安的气氛四处蔓延。刘备素有匡扶汉室之志，又好结交豪侠，乡里少年争相依附；可除了宗室之后的名分与早年游侠积下的声望，他手中并无足以左右天下的力量。\n\n#bold 你能否从涿郡起步，聚拢愿与你并肩之人，为自己赢得一片立足之地，进而中兴汉室？#!"

 uuii_book_sun_jian_name_desc: "孙坚出身吴郡富春，十七岁时便只身驱散劫掠商旅的海贼，从此以果敢闻名；其后又随郡兵讨平会稽许昌之乱，历任盐渎、盱眙县丞，如今转任下邳。\n\n北方的动荡很快就会波及各州。孙坚须审慎择定自己在乱局中的立场：是奉汉廷之命征战四方，还是乘势扬名立万，为孙氏争取更远大的前程？\n\n#bold 你能否步步为营，在乱世中开创江东孙氏的基业？#!"

 uuii_book_zhang_jiao_name_desc: "张角目睹民间疾苦，自号大贤良师，奉事黄老之道，以符水咒说为人疗病。十余年间，太平道信众遍及八州，分为三十六方，大方万余人，小方六七千，皆视大贤良师为救世之人。\n\n起事的日子已经定下，京师的内应与各方渠帅都在暗中筹备。然而参与者越多，消息便越难保守；朝廷一旦察觉，一切布置都可能付诸东流。\n\n#bold 苍天已死，黄天当立。你能否以黄天之名，改写天命？#!"

