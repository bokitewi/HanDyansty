 uuii_bm_group_184: "东汉风云"
 bm_hd_group_sanguo: "三国鼎立"
 bm_uuii_184: "汉末群雄"
 bm_uuii_184_desc: "光和七年，岁在甲子。汉室享国已近四百载，洛阳宫中，宦官与外戚明争暗斗，卖官鬻爵之风行于朝野；州郡之间，豪强兼并田土，连年的灾疫与徭役，早已把百姓逼到了绝处。\n\n太平道的符水与经文，在青、徐、幽、冀、荆、扬、兖、豫八州之间悄然流传，三十六方信众只待一声号令。京城寺门与州郡官府的墙上，不知何时已用白土写满了“甲子”二字。\n\n#bold 风雨欲来。你将匡扶摇摇欲坠的汉室，还是乘势而起，另立一番乾坤？#!"
 bm_hd_190: "讨董群雄"
 bm_hd_190_desc: "初平元年，岁在庚午。董卓废少帝、立献帝，自居相国，纵兵劫掠雒阳；关东诸州牧守相继起兵，共推渤海太守袁绍为盟主，十余路诸侯会盟，誓师讨逆。\n\n董卓挟天子，据司隶，西凉铁骑横行关中；凉州诸将各自为政，并州无主，郡县离散。开春之后，联军北出河内、东趋成皋，雒阳与虎牢关首当其冲。\n\n#bold 汉祚岌岌。你将率义兵讨逆，还是趁乱割据，抑或在这大争之世另有所图？#!"
uuii_book_cao_cao_name_subheading: "治世之能臣，乱世之奸雄"
uuii_book_liu_bei_name_subheading: "其德昭昭，其志烈烈"
uuii_book_yuan_shao_name_subheading: "高风义轨，冠冕海内"
uuii_book_sun_jian_name_subheading: "破虏将军"
uuii_book_zhang_jiao_name_subheading: "大贤良师"
 uuii_book_cao_cao_name_desc: "曹操在陈留己吾散尽家财、募乡勇五千，起兵讨董。他与张邈、卫兹等人声气相通，却兵少地狭，只能寄身陈留一隅。\n\n关东联军名为同盟，实则各怀心思：盟主袁绍志在擅权，诸侯屯兵观望，谁也不肯先动。曹操心急如焚，却只能在这小小的根据地里厉兵秣马，等待时机。\n\n#bold 你能否在群雄之间立足，终有一日挟天子以令诸侯？#!"

 uuii_book_yuan_shao_name_desc: "汝南袁氏四世三公，门生故吏遍布天下。何进被杀、董卓入雒之后，袁绍弃官东出，被关东诸侯推为盟主，坐拥渤海一郡，号令十余路兵马。\n\n联军声势虽大，粮饷、名分与各路诸侯的猜忌，却时时牵制着盟主。冀州牧韩馥近在咫尺，既是助力，也是隐患。\n\n#bold 你能否凝聚联军、击败董卓，让汝南袁氏登上权力之巅？#!"

 uuii_book_liu_bei_name_desc: "刘备自称中山靖王之后，早年织席贩履，后随卢植读书。黄巾起事时，他与关羽、张飞桃园结义，招募乡勇，奔走于涿郡与幽州之间。\n\n如今天下大乱，诸侯并起，他仍是无地之人，手下不过数百义勇，却已与公孙瓒、陶谦等人多有往来。乱世之中，宗室的名分与旧友的情义，是他最大的本钱。\n\n#bold 你能否从一无所有起步，聚拢义士，为自己赢得一片立足之地，进而中兴汉室？#!"

 uuii_book_sun_jian_name_desc: "孙坚出身吴郡富春，十七岁驱散海贼，从此以勇武闻名；黄巾之乱中随朱儁转战立功，后任长沙太守，平定区星之乱。\n\n关东起兵之后，孙坚北上，逼死荆州刺史王叡、斩南阳太守张咨，率江东子弟到鲁阳投奔袁术，没有一寸自己的地盘。他是联军中最锋利的一把刀，却依附他人，处处受制。\n\n#bold 你能否在乱世中由一员战将，成为江东孙氏的开基之主？#!"

 uuii_book_zhang_jiao_name_desc: "张角目睹民间疾苦，自号大贤良师，奉事黄老之道，以符水咒说为人疗病。十余年间，太平道信众遍及八州，分为三十六方，大方万余人，小方六七千，皆视大贤良师为救世之人。\n\n起事的日子已经定下，京师的内应与各方渠帅都在暗中筹备。然而参与者越多，消息便越难保守；朝廷一旦察觉，一切布置都可能付诸东流。\n\n#bold 苍天已死，黄天当立。你能否以黄天之名，改写天命？#!"

 bm_uuii_218: "三足鼎立"
 bm_uuii_218_desc: "建安二十三年，岁在戊戌。曹操进爵魏王，挟天子于许都，冀、兖、青、徐、豫、司、并、凉、幽九州尽在掌中；刘备据有益州，与夏侯渊对峙汉中，关羽镇守荆州，虎视襄樊；孙权坐断江东，表面与刘备同盟，暗中却对荆州念念不忘。\n\n天下三分之势已成，可这三分谁也不肯认。汉中、襄樊、夷陵，一场接一场的大战就在眼前。\n\n#bold 汉祚将终。你将挟天子以终其事，兴复汉室于西南，还是割据江东、坐观成败？#!"

