 bm_hd_190_liu_xie:0 "刘协"
 bm_hd_190_liu_xie_subheading:0 "困龙承祚"
 bm_hd_190_liu_xie_desc:0 "少帝见废，陈留王践祚。幼主高居九重，而诏命出于相府；汉家四百年之统，系于一身。\n\n关东兵起，皆称扶汉。然谁为社稷，谁图私门，尚未可知。身在董卓掌中，你能否借群雄之势，收还天子之权？"
 bm_hd_190_dong_zhuo:0 "董卓"
 bm_hd_190_dong_zhuo_subheading:0 "虎踞汉廷"
 bm_hd_190_dong_zhuo_desc:0 "凉州铁骑入洛，废立之权遂归一人。董卓位居相国，挟幼帝而临百官，天下莫敢正视。\n\n关东诸侯会盟讨董，兵锋直指京畿。你能否凭掌中兵马，折群雄之势，令汉廷与天下尽入彀中？"
