l_simp_chinese:
 hd_dc_support.0008.b: "无保全家小封地之盟，不敢应命。"
 hd_dc_support.0008.b.tt: "若[hd_dc_support_claimant.GetTitledFirstName]肯签下保全你家人与封地的盟书："
 hd_dc_support.0208.t: "一纸保全之约"
 hd_dc_support.0208.desc: "回书里没有许诺兵马，先列明的是[scope:hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName]最放心不下的几件事：自身，眼下在世的至亲，以及这些人如今的封地。\n\n“连这些都不肯明言，我怎敢把一家老小，托付给一句来日的封赏？”\n\n对方要你亲自担保五年。日后添的后辈、新得的封地都不在此列；若真有人犯了罪，也照样可以依法处置。"
 hd_dc_support.0208.a: "依今日名册立约，五年为期。"
 hd_dc_support.0208.a.tt: "你以己名立誓：五年之内，保全盟书上的人与其封地。"
 hd_dc_support.0208.b: "此约束缚太甚，恕难从命。"
 hd_dc_support.0408.t: "盟书的回音"
 hd_dc_support.0408.accepted: "[scope:hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]亲笔签下了盟书。你与至亲的名字、各人名下的封地，都照签约这一日的情形一一录下，五年之期就此开始。\n\n这份盟书并不等于你已投入哪一派，也没有先付什么封赏。往后是否守约，要看签约的人究竟怎么做。"
 hd_dc_support.0408.rejected: "[scope:hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]退回了盟书，不肯担这五年的干系。\n\n你没有因此投入哪一派，也没有得到什么好处。这一番往来，就此作罢。"
 hd_dc_support.0408.a: "谨藏回书。"
