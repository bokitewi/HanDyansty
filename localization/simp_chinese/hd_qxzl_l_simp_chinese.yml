l_simp_chinese:
 hd_qxzl.0001.t:0 "群雄逐鹿"
 hd_qxzl.0001.desc:0 "讨董盟约既散，诸侯各归本镇，州郡之间再无一致号令。昔日共同举兵之人，如今各怀心志；朝廷诏令虽仍往来，真正能约束一方的，已是手中的兵马与治下的钱粮。\n\n我麾下自有属吏，境内亦有百姓。是继续奉事领主、静候天下之变，还是就此自掌州郡、不再受人节制？"
 hd_qxzl.0001.a:0 "今日起事"
 hd_qxzl.0001.b:0 "暂且观望"
 hd_qxzl_independence_tt:0 "立即脱离当前领主，成为独立统治者。"
 hd_qxzl_wait_tt:0 "维持现有隶属关系，不获得额外奖励或惩罚。"
 hd_qxzl_ineligible_tt:0 "你的头衔、隶属或领地条件已经变化，本次不再执行独立。"
