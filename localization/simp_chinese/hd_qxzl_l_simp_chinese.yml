l_simp_chinese:
 hd_qxzl.0001.t:0 "群雄逐鹿"
 hd_qxzl.0001.desc:0 "讨董的盟约散了之后，各地传来的号令越来越不一致。昔日一同起兵的人各归本镇，朝廷的文书仍在往来，可真正能让兵马动起来的，多半是各家手中的钱粮。\n\n你也有自己的属吏与治下百姓。继续奉事旧主，仍可凭原有的名分维系上下；若就此脱离节制，所领之地的安危便全由自己承担，再不能事事等候上面的答复。\n\n案前有人问，下一份文书仍该送往何处。你看着那封尚未封口的信，明白今日的抉择不在一句豪言，而在往后每一道命令，究竟由谁来落印。"
 hd_qxzl.0001.a:0 "自立门户，不复受制于人。"
 hd_qxzl.0001.b:0 "君臣之分，不可轻弃。"
 hd_qxzl_independence_tt:0 "你自此脱离旧主节制，自立一方。"
 hd_qxzl_ineligible_tt:0 "时移势易，自立之事已无从谈起。"
