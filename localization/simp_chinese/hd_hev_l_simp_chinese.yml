l_simp_chinese:
 hd_hev_btn_tt:0 "历史事件列表（调试）"
 hd_hev_btn_label:0 "史"
 hd_hev_window_title:0 "历史事件列表"
 hd_hev_window_help:0 "#weak 已触发＝该节点已经发生（战争以开战为准；事件弹出后玩家选了别的结局也算）。过期作废、尚未到时间显示未触发；玩家拒绝一般也显示未触发，个别“弹出即算”的行在提示里注明。不适用本局开局的事件显示非本局。鼠标移到事件名上看触发条件。#!"
 hd_hev_st_done:0 "#P 已触发#!"
 hd_hev_st_wait:0 "未触发"
 hd_hev_st_na:0 "#weak 非本局#!"
 hd_hev_grp_here:0 "#P （本局）#!"
 hd_hev_grp_22_name:0 "#high 东汉·舂陵起兵（22.11.13）#!"
 hd_hev_grp_89_name:0 "#high 东汉·燕然勒石（89.1.30）#!"
 hd_hev_grp_184_name:0 "#high 汉末风云（184.1.1）#!"
 hd_hev_grp_long_name:0 "#high 长线通用：五胡内徙、衣冠南渡、大秦来使（多个开局）#!"
 hd_hev_grp_218_name:0 "#high 三国鼎立（218.1.1）#!"
 hd_hev_grp_253_name:0 "#high 姜维北伐（253.3.1；218 开局 253.3.1 起接力；263 开局只有魏伐蜀一行适用）#!"
 hd_hev_grp_263_name:0 "#high 钟会伐蜀（263.9.20；218、253 开局 263.8.1 起接力）#!"
 hd_hev_grp_304_name:0 "#high 左国称王（304.11.20）#!"
 hd_hev_grp_346_name:0 "#high 南北朝·346（346.12.10）#!"
 hd_hev_grp_370_name:0 "#high 王猛伐燕（370.2.13）#!"
 hd_hev_grp_404_name:0 "#high 南北朝·404（404.3.24）#!"
 hd_hev_grp_531_name:0 "#high 信都起兵（531.7.1）#!"
 hd_hev_grp_617_name:0 "#high 晋阳起兵（617.6.23）#!"
 hd_hev_22_01_name:0 "舂陵起兵（宛城之战）"
 hd_hev_22_01_tt:0 "#high 舂陵起兵（宛城之战）#!\n22.11.13 开局当天（大厅之后）\n刘縯独立且甄阜仍持南阳郡时，对甄阜发动边境战争\n新市王匡、平林陈牧加入攻方\n战后宛城归汉军一方即为汉军胜，电脑甄阜、梁丘赐战死"
 hd_hev_22_02_name:0 "宜秋之会（下江合兵）"
 hd_hev_22_02_tt:0 "#high 宜秋之会（下江合兵）#!\n22.12.13 起，23.6.1 截止\n王常独立、有地、未参战，且刘縯仍在打宛城之战\n王常（下江兵）加入攻方，得 4000 兵\n玩家王常收到弹窗，可选合兵或自守"
 hd_hev_22_03_name:0 "共立刘玄（更始称帝）"
 hd_hev_22_03_tt:0 "#high 共立刘玄（更始称帝）#!\n23.3.11（更始元年二月）起，24.1.1 截止\n刘玄无地，且刘縯、王匡、陈牧、王常中至少 3 人独立有地\n刘玄得随县或应山，登汉帝位，改元更始\n四家奉立：电脑直接改投，玩家弹窗选择奉立或自立"
 hd_hev_22_04_name:0 "昆阳之围（昆阳之战）"
 hd_hev_22_04_tt:0 "#high 昆阳之围（昆阳之战）#!\n23.5.8 起，24.1.1 截止\n王莽仍持天下、刘玄已称帝、刘秀是更始一系的有地封臣\n昆阳交给刘秀，王邑率三万人来攻\n玩家刘秀收到弹窗，可选守城或弃城；汉军胜则王寻战死、王莽威望大减"
 hd_hev_22_05_name:0 "颍川诸将（颍川归心）"
 hd_hev_22_05_tt:0 "#high 颍川诸将（颍川归心）#!\n昆阳之战结束（或 23.8.1）起，24.6.1 截止\n刘秀在世且有地\n冯异、祭遵、王霸、铫期等颍川诸将陆续来投刘秀宫廷（只来电脑、无主的人）\n玩家刘秀收到一次通知"
 hd_hev_22_06_name:0 "伯升之死"
 hd_hev_22_06_tt:0 "#high 伯升之死#!\n23.7.7 起（昆阳结算后，或 24.1.1）\n昆阳汉军胜、刘玄仍为帝、刘縯是更始的电脑封臣\n更始杀刘縯\n玩家刘秀收到弹窗，可选隐忍谢罪或愤然离去（之后与更始为宿敌）"
 hd_hev_22_07_name:0 "刘歆、王涉谋劫王莽事泄"
 hd_hev_22_07_tt:0 "#high 刘歆、王涉谋劫王莽事泄#!\n23.8.1（地皇四年七月）\n王莽仍持天下才执行\n电脑刘歆、王涉自杀，董忠被王莽所杀（玩家角色不死）\n无弹窗"
 hd_hev_22_08_name:0 "四方叛去（天下响应）"
 hd_hev_22_08_tt:0 "#high 四方叛去（天下响应）#!\n23.8.1 起，24.1.1 截止\n王莽仍持天下\n隗嚣据天水自立；公孙述自立（玩家弹“蜀中自立”）；王莽直属的电脑郡守（司隶除外）各自独立\n玩家王莽收到“四方叛去”"
 hd_hev_22_09_name:0 "常安陷落（含西入武关）"
 hd_hev_22_09_tt:0 "#high 常安陷落（含西入武关）#!\n天下响应之后，由更始帝（或最强的起义军）西入武关攻京兆\n攻下常安后新朝灭亡：天下、玉玺转给执行人，电脑王莽死于渐台\n玩家执行人先收到“西入武关”；玩家王莽可选出奔或死守\n26.1.1 仍未攻下时由常安城中起事兜底（玩家王莽除外）"
 hd_hev_22_10_name:0 "持节北渡"
 hd_hev_22_10_tt:0 "#high 持节北渡#!\n23.11.1 起，25.1.1 截止\n刘秀在世且有地\n刘秀持节北渡，夺安平郡（信都），得 5000 兵；邓禹、任光、耿纯等河北诸将陆续来投\n玩家刘秀可选北渡或留下；直属主君是玩家时先请他批准\n（弹出即算：玩家拒绝或后续没办成也显示已触发）"
 hd_hev_22_11_name:0 "萧王辞召（河北自立）"
 hd_hev_22_11_tt:0 "#high 萧王辞召（河北自立）#!\n北渡后 120 天（或伯升死后愤然离去；25.8.5 起再试一次），27.1.1 截止\n刘秀持郡级以上头衔，且尚未独立\n刘秀脱离主君自立为萧王，得征服者\n玩家刘秀可选自立或奉诏；玩家主君收到通知"
 hd_hev_22_12_name:0 "进兵邯郸（平定河北）"
 hd_hev_22_12_tt:0 "#high 进兵邯郸（平定河北）#!\n刘秀自立之后，26.1.1 截止\n刘秀独立有地，邯郸不在自己手里\n刘秀进攻邯郸持有者（襄国郡），得 1 万兵；胜则电脑王郎死\n玩家刘秀可选进兵或暂缓；耿弇、吴汉等上谷、渔阳诸将来投"
 hd_hev_22_13_name:0 "千秋亭即位（鄗城称帝）"
 hd_hev_22_13_tt:0 "#high 千秋亭即位（鄗城称帝）#!\n25.8.5（建武元年六月）起，27.1.1 截止\n刘秀已独立且有地\n刘秀称帝（建幽燕帝国头衔或沿用天下），改元建武；马武、岑彭来投\n玩家刘秀可选称帝或暂缓（26.6.1 再问一次）"
 hd_hev_89_01_name:0 "燕然勒石（出塞·稽落山之战）"
 hd_hev_89_01_tt:0 "#high 燕然勒石（出塞·稽落山之战）#!\n89.6.27 起，90.1.19 截止\n戈壁翁金郡有不属于天子的独立君主\n窦宪（窦宪不在则邓鸿，再不在则天子）出鸡鹿塞北伐，南单于、邓鸿从征\n胜则窦宪登燕然山刻石、拜大将军，翁金郡归朔方；玩家执行人可选出塞或暂缓"
 hd_hev_89_02_name:0 "金微山"
 hd_hev_89_02_tt:0 "#high 金微山#!\n91.3.9 起，92.1.27 截止\n北单于仍独立，且仍持戈壁阿尔泰郡（或嗢昆）\n窦宪遣耿夔、任尚出居延塞，南单于从征\n胜则北单于西遁（电脑）或由玩家选西遁或降汉；东部诸部自号鲜卑"
 hd_hev_89_03_name:0 "西域都护"
 hd_hev_89_03_tt:0 "#high 西域都护#!\n91.12.29（永元三年十二月）起，93.1.1 截止\n班超在世且有地\n班超任西域都护（得威望与修正）；龟兹不降汉时，电脑龟兹王被废、白霸立为王并奉汉\n玩家龟兹王收到弹窗，可选降或不降"
 hd_hev_89_04_name:0 "款塞（於除鞬奉汉）"
 hd_hev_89_04_tt:0 "#high 款塞（於除鞬奉汉）#!\n91.12.29 起（须金微山汉军已胜），93.1.1 截止\n於除鞬在世，且已独立有地\n於除鞬遣使款塞，奉汉为宗主\n玩家於除鞬收到弹窗，可选奉汉或自立"
 hd_hev_89_05_name:0 "北宫闭门（诛窦）"
 hd_hev_89_05_tt:0 "#high 北宫闭门（诛窦）#!\n92.8.14（永元四年六月）起，93.1.1 截止\n窦宪在世，天子在位\n和帝与郑众定议，收窦宪印绶；电脑窦氏兄弟交还领地后自杀，邓叠、郭举下狱死\n玩家天子可选诛窦或隐忍；玩家窦宪可选交印或起兵"
 hd_hev_89_06_name:0 "於除鞬叛汉被斩"
 hd_hev_89_06_tt:0 "#high 於除鞬叛汉被斩#!\n93.7.1（永元五年）\n於除鞬此前已奉汉，且是电脑\n於除鞬叛汉北还，被任尚追斩\n无弹窗"
 hd_hev_89_07_name:0 "讨焉耆（焉耆之战）"
 hd_hev_89_07_tt:0 "#high 讨焉耆（焉耆之战）#!\n94.8.1（永元六年秋）起，96.1.1 截止\n班超在世且有地，焉耆仍未奉汉\n班超发八国兵讨焉耆；胜则电脑焉耆王广被斩、元孟立为王并奉汉\n玩家班超可选出兵或作罢；玩家焉耆王可选称臣或让位"
 hd_hev_184_01_name:0 "苍天已死（黄巾起义）"
 hd_hev_184_01_tt:0 "#high 苍天已死（黄巾起义）#!\n184.1.1 开局后第 2 天\n马元义被处死，张角在冀州起事\n张角、张曼成、波才三路对汉宣战\n全体玩家收到「黄天当立」通报"
 hd_hev_184_02_name:0 "桃园结义（含后续「义旗初立」张世平、苏双资助）"
 hd_hev_184_02_tt:0 "#high 桃园结义（含后续「义旗初立」张世平、苏双资助）#!\n184 开局大厅结束后，由刘备人生故事派发\n需刘备、关羽、张飞都在世，且黄巾结局尚未定\n三人结为兄弟，关张转为刘备廷臣\n7~14 天后张世平、苏双资助金钱和兵马"
 hd_hev_184_03_name:0 "柱天将军（交趾屯兵反）"
 hd_hev_184_03_tt:0 "#high 柱天将军（交趾屯兵反）#!\n184.6~186.12 之间，每月判定\n前提：黄巾已起，交趾郡有在世郡主\n叛军对交趾郡主宣战\n只有守方是玩家时才弹出事件"
 hd_hev_184_04_name:0 "湟中羌胡反（北宫伯玉；含后续「迫于兵威」）"
 hd_hev_184_04_tt:0 "#high 湟中羌胡反（北宫伯玉；含后续「迫于兵威」）#!\n184.10~186.12 之间，每月判定\n前提：黄巾已起，金城或广魏有郡主\n北宫伯玉、韩遂等羌胡起兵\n胜后周边领主被迫臣服"
 hd_hev_184_05_name:0 "黄巾结局（「黄巾败亡」汉存 / 「黄巾得势」汉亡）"
 hd_hev_184_05_tt:0 "#high 黄巾结局（「黄巾败亡」汉存 / 「黄巾得势」汉亡）#!\n三路黄巾主战争全部结束且无一获胜：汉存\n任一路强制胜利：汉亡\n全体玩家收到结局事件\n汉存时接着进入宫廷危机排期"
 hd_hev_184_06_name:0 "黑山军起"
 hd_hev_184_06_tt:0 "#high 黑山军起#!\n185.2~188.12 之间，每月判定\n前提：黄巾已起，常山或赵国有郡主\n张燕等黑山军起事\n守方是玩家才弹出事件"
 hd_hev_184_07_name:0 "江夏蛮叛"
 hd_hev_184_07_tt:0 "#high 江夏蛮叛#!\n185.4~187.12 之间，每月判定\n前提：黄巾已起，江夏有郡主\n江夏蛮起兵\n守方是玩家才弹出事件"
 hd_hev_184_08_name:0 "王国举兵"
 hd_hev_184_08_tt:0 "#high 王国举兵#!\n187.4~189.12 之间，每月判定\n前提：黄巾已起，扶风有郡主\n王国起兵，可并入凉州叛乱战争\n守方是玩家才弹出事件"
 hd_hev_184_09_name:0 "张举称天子（张纯之乱）"
 hd_hev_184_09_tt:0 "#high 张举称天子（张纯之乱）#!\n187.6~189.12 之间，每月判定\n前提：黄巾已起，右北平、辽西、渔阳之一有郡主\n张举、张纯在幽州起兵\n守方是玩家才弹出事件"
 hd_hev_184_10_name:0 "镇抚荆州（刘表单骑入荆州）"
 hd_hev_184_10_tt:0 "#high 镇抚荆州（刘表单骑入荆州）#!\n188.1.1 前后（史实为 190 年）\n刘表在世、荆州有持有者\n刘表接管荆州王国及其法理领地、封臣\n刘表本人收到事件"
 hd_hev_184_11_name:0 "休屠各胡反（并州）"
 hd_hev_184_11_tt:0 "#high 休屠各胡反（并州）#!\n188.3~190.12 之间，每月判定\n前提：黄巾已起，西河或河西有郡主\n并州休屠各胡起兵\n守方是玩家才弹出事件"
 hd_hev_184_12_name:0 "益州黄巾（马相）"
 hd_hev_184_12_tt:0 "#high 益州黄巾（马相）#!\n188.6~190.12 之间，每月判定\n前提：黄巾已起，广汉、蜀郡、犍为之一有郡主\n马相在益州起兵\n守方是玩家才弹出事件"
 hd_hev_184_13_name:0 "灵帝驾崩"
 hd_hev_184_13_tt:0 "#high 灵帝驾崩#!\n最迟 189.5.13 强制病逝，也可能提前自然死亡\n头衔与直属封臣先转给刘辩，再让灵帝去世\n全体玩家收到「灵帝驾崩」通报\n随后尝试开启宫廷危机"
 hd_hev_184_14_name:0 "京中风声（何进召外兵、董卓奉召入京）"
 hd_hev_184_14_tt:0 "#high 京中风声（何进召外兵、董卓奉召入京）#!\n前提：黄巾结局为汉存，或灵帝已死\n由董卓作为控制者，35 天后弹出\n何进议召外兵，董卓奉召入京\n事件给董卓与何进"
 hd_hev_184_15_name:0 "宫门合拢（何进遇害）"
 hd_hev_184_15_tt:0 "#high 宫门合拢（何进遇害）#!\n董卓奉召后约 35 天\n张让（或赵忠）在宫中杀何进\n事件给何进本人\n35 天后转入诛宦官"
 hd_hev_184_16_name:0 "血染宫门（诛宦官）"
 hd_hev_184_16_tt:0 "#high 血染宫门（诛宦官）#!\n何进死后约 35 天\n袁绍（不在则曹操，再不在则董卓）诛杀十常侍\n执行者收到「血染宫门」\n35 天后董卓入雒"
 hd_hev_184_17_name:0 "凉州兵入雒（董卓入雒、取司隶）"
 hd_hev_184_17_tt:0 "#high 凉州兵入雒（董卓入雒、取司隶）#!\n诛宦官后约 35 天\n董卓移驻雒阳，接管司隶及其封臣\n董卓成为固定权臣（丞相）\n全体玩家收到「凉州兵入雒」通报"
 hd_hev_184_18_name:0 "并州旧部 / 近身之刃（吕布杀丁原，并州归董）"
 hd_hev_184_18_tt:0 "#high 并州旧部 / 近身之刃（吕布杀丁原，并州归董）#!\n代码顺序：废立后约 30 天（史实在废立之前，189.8）\n丁原收到事件，吕布受董卓收买\n吕布杀丁原，并州全部转给董卓\n吕布认董卓为义父"
 hd_hev_184_19_name:0 "废立（少帝被废、刘协即位；含隐藏后续：少帝与何太后遇害）"
 hd_hev_184_19_tt:0 "#high 废立（少帝被废、刘协即位；含隐藏后续：少帝与何太后遇害）#!\n董卓入雒后 365 天\n刘辩的头衔连同天下霸权转给刘协\n董卓继续任权臣\n5 天后刘辩、何太后遇害；全体玩家收到「董卓废立」"
 hd_hev_184_20_name:0 "横刀长揖（袁绍出奔渤海）"
 hd_hev_184_20_tt:0 "#high 横刀长揖（袁绍出奔渤海）#!\n废立后约 35 天\n袁绍在世且早期故事未完成\n袁绍与董卓决裂，出奔渤海\n事件给袁绍"
 hd_hev_184_21_name:0 "关东举兵（讨董联盟成立）"
 hd_hev_184_21_tt:0 "#high 关东举兵（讨董联盟成立）#!\n废立之后，由袁绍等人发起\n联盟正式成立后发出各路邀请\n联军对董卓宣战，全体玩家收到「关东举兵」\n联盟成立当天排期董卓焚雒"
 hd_hev_184_22_name:0 "焚雒西迁"
 hd_hev_184_22_tt:0 "#high 焚雒西迁#!\n讨董联盟成立后 1 天\n董卓焚毁雒阳，屠戮雒阳世家\n天子与董卓核心迁往长安\n全体玩家收到「焚雒西迁」"
 hd_hev_184_23_name:0 "联军收兵·讨董联盟解散（汉室之下：诸侯去留）"
 hd_hev_184_23_tt:0 "#high 联军收兵·讨董联盟解散（汉室之下：诸侯去留）#!\n讨董战争得胜、无功或董卓死亡，联盟终结\n联盟解散，天子麾下封臣按比例独立\n玩家封臣弹出「汉室之下」自选去留\n第 3 天复查，随后做飞地处理"
 hd_hev_184_24_name:0 "群雄并起（历史群雄独立；含「请据故地」）"
 hd_hev_184_24_tt:0 "#high 群雄并起（历史群雄独立；含「请据故地」）#!\n联盟解散并处理完飞地后 1 天\n张杨、袁绍、曹操、刘表等约 40 名首领在史实郡县起兵\n玩家首领自己决定是否起兵\n首领在玩家麾下时，由玩家决定是否放行\n（弹出即算：玩家拒绝或后续没办成也显示已触发）"
 hd_hev_184_25_name:0 "济北受降（曹操收编青州军）"
 hd_hev_184_25_tt:0 "#high 济北受降（曹操收编青州军）#!\n讨董联盟结束约一年后，且不早于 191 年\n曹操在世且有封地\n获得青州兵 22000，直辖县获青州屯田 20 年\n事件给曹操"
 hd_hev_184_26_name:0 "王允诛董（未央之约 / 诛董之期 / 宫门换戍）"
 hd_hev_184_26_tt:0 "#high 王允诛董（未央之约 / 诛董之期 / 宫门换戍）#!\n192.5.1 起判定：董卓是权臣且王允未被囚禁\n玩家董卓可称病推迟一年；玩家王允或吕布决定是否动手\n吕布在场时由吕布杀董卓，否则由王允\n吕布得京兆，王允任录尚书事，貂蝉归吕布"
 hd_hev_184_27_name:0 "西凉兵反攻长安（李傕郭汜之乱）"
 hd_hev_184_27_tt:0 "#high 西凉兵反攻长安（李傕郭汜之乱）#!\n董卓死后结算完毕，李傕获封弘农并独立\n次日李傕对京兆持有者（吕布）宣战\n郭汜并入李傕麾下\n全体玩家收到「西凉兵反攻长安」"
 hd_hev_184_28_name:0 "长安败走（长安陷落、吕布出奔，含陈宫来投）"
 hd_hev_184_28_tt:0 "#high 长安败走（长安陷落、吕布出奔，含陈宫来投）#!\n李傕赢得长安之战\n王允及其亲族被处死，李傕取京兆\n吕布失去封地，成为流浪营地，获得赠兵\n张辽、高顺随行，次日陈宫来投"
 hd_hev_184_29_name:0 "逃往关东（吕布东奔兖州）"
 hd_hev_184_29_tt:0 "#high 逃往关东（吕布东奔兖州）#!\n吕布营地组建完成（三将已处理、赠兵已到）\n营地迁往陈留，获得兖州、陈留宣称\n30 天后对陈留持有者宣战\n事件给吕布"
 hd_hev_184_30_name:0 "严白虎屯聚"
 hd_hev_184_30_tt:0 "#high 严白虎屯聚#!\n196.1~199.12 之间，每月判定\n前提：黄巾已起，吴郡有郡主\n严白虎在吴郡起事\n守方是玩家才弹出事件"
 hd_hev_184_31_name:0 "赤壁（荆州去就 / 赤壁之前 / 北军退却 / 江防已破）"
 hd_hev_184_31_tt:0 "#high 赤壁（荆州去就 / 赤壁之前 / 北军退却 / 江防已破）#!\n官渡结算后，曹操、孙权、刘备都在世\n荆州持有者决定降曹或抵抗\n曹操决定是否南下对孙权开战\n北军败：北军退却；孙权败：江防已破"
 hd_hev_184_32_name:0 "黄旗遍野（刘备从军讨黄巾）"
 hd_hev_184_32_tt:0 "#high 黄旗遍野（刘备从军讨黄巾）#!\n184 年黄巾之乱期间，汉帝与黄巾交战\n刘备（184 开局、成年、有地/营地、未被囚）收到\n应允后作为守方加入讨黄巾之战"
 hd_hev_184_33_name:0 "宫门血迹 / 满座泪痕（曹操谋董）"
 hd_hev_184_33_tt:0 "#high 宫门血迹 / 满座泪痕（曹操谋董）#!\n董卓废立（宫廷危机）后约 35 天\n曹操在世即触发，玩家/AI 均走事件\n伍孚刺董失败被杀，曹操开始谋划"
 hd_hev_184_34_name:0 "借刀 / 镜中寒光（献刀刺董）"
 hd_hev_184_34_tt:0 "#high 借刀 / 镜中寒光（献刀刺董）#!\n接上一节点约一个月后\n曹操从王允处得七星宝刀，行刺董卓未遂\n董卓与曹操结为宿敌"
 hd_hev_184_35_name:0 "途中旧血（吕伯奢之祸）"
 hd_hev_184_35_tt:0 "#high 途中旧血（吕伯奢之祸）#!\n刺董失败后逃归东郡（需已安置东武阳）\n曹操杀吕伯奢全家，陈宫若随行则离去\n曹操获冷酷特质"
 hd_hev_184_36_name:0 "关东义旗（刘备响应讨董）"
 hd_hev_184_36_tt:0 "#high 关东义旗（刘备响应讨董）#!\n讨董联军成立后\n刘备收到，应允后作为攻方加入讨董之战\n联军解散后不再触发"
 hd_hev_184_37_name:0 "东郡整众（曹操起家完成）"
 hd_hev_184_37_tt:0 "#high 东郡整众（曹操起家完成）#!\n吕伯奢事件后数日，曹操须有领地\n获征服者特质、6000 金、4000 丹阳精兵\n夏侯、曹氏宗亲来投"
 hd_hev_184_38_name:0 "整顿渤海（袁绍入渤海）"
 hd_hev_184_38_tt:0 "#high 整顿渤海（袁绍入渤海）#!\n讨董期间袁绍出奔渤海，定都清池并得冀州宣称\n安顿后获 3000 金、5000 甲士\n审配、田丰、沮授、颜良、文丑等来投"
 hd_hev_184_39_name:0 "袁术出奔南阳"
 hd_hev_184_39_tt:0 "#high 袁术出奔南阳#!\n董卓入洛阳后\n袁术在世未被囚即触发\n袁术庄园迁往南阳宛城"
 hd_hev_184_40_name:0 "袁术夺南阳、孙坚依附"
 hd_hev_184_40_tt:0 "#high 袁术夺南阳、孙坚依附#!\n袁术已到宛城、孙坚在世未被囚\n孙坚杀南阳太守，南阳郡全部归袁术\n孙坚交出领地、作为袁术封臣迁到宛城"
 hd_hev_184_41_name:0 "南阳黄巾来降"
 hd_hev_184_41_tt:0 "#high 南阳黄巾来降#!\n袁术取得南阳郡 30 天后\n袁术收到，得约 3.6 万南阳黄巾降军\n之后分两批招揽南阳人物"
 hd_hev_184_42_name:0 "孙坚得传国玉玺"
 hd_hev_184_42_tt:0 "#high 孙坚得传国玉玺#!\n讨董联军解散后\n孙坚在世、实际参加过讨董之战\n孙坚取得传国玉玺"
 hd_hev_184_43_name:0 "借兵图冀（公孙瓒南攻冀州）"
 hd_hev_184_43_tt:0 "#high 借兵图冀（公孙瓒南攻冀州）#!\n讨董链结束后，韩馥仍据冀州\n公孙瓒（持幽州）收到出兵邀请，应允后向韩馥宣战\n袁绍收到“借兵图冀”通报"
 hd_hev_184_44_name:0 "冀州易主（韩馥让冀州）"
 hd_hev_184_44_tt:0 "#high 冀州易主（韩馥让冀州）#!\n公孙瓒攻冀州约 30 天后\n韩馥与袁绍均在世：韩馥把冀州全境让给袁绍\n袁绍与公孙瓒结仇，袁绍收到通报"
 hd_hev_184_45_name:0 "伯圭来书（刘备投公孙瓒）"
 hd_hev_184_45_tt:0 "#high 伯圭来书（刘备投公孙瓒）#!\n讨董结束、群雄逐鹿开始约 30 天后\n公孙瓒（0300）先决定是否来书，刘备（0301）再决定\n结盟后刘备营地迁往公孙瓒都城"
 hd_hev_184_46_name:0 "相知子龙"
 hd_hev_184_46_tt:0 "#high 相知子龙#!\n刘备已与公孙瓒结盟并屯驻其境内\n赵云为公孙瓒廷臣\n刘备与赵云结为好友"
 hd_hev_184_47_name:0 "旧友叩门（赵云来投）"
 hd_hev_184_47_tt:0 "#high 旧友叩门（赵云来投）#!\n刘备与赵云为好友\n赵云无地、离开公孙瓒宫廷\n赵云投入刘备宫廷"
 hd_hev_184_48_name:0 "陶谦据徐州"
 hd_hev_184_48_tt:0 "#high 陶谦据徐州#!\n讨董链结束后\n陶谦在世：得徐州王国与州治并独立\n获 3000 丹阳精兵"
 hd_hev_184_49_name:0 "臧霸归附"
 hd_hev_184_49_tt:0 "#high 臧霸归附#!\n陶谦已据徐州，群雄逐鹿已开始\n臧霸在世，若为独立小领主则向陶谦称臣\n陶谦收到通报"
 hd_hev_184_50_name:0 "岘山殒命（孙坚之死）"
 hd_hev_184_50_tt:0 "#high 岘山殒命（孙坚之死）#!\n191.1–192.12 随机排期，联军已解散\n孙坚未自立、刘表在世未被囚\n孙坚征刘表，中黄祖伏兵阵亡"
 hd_hev_184_51_name:0 "袁术自立"
 hd_hev_184_51_tt:0 "#high 袁术自立#!\n袁术已取得南阳且联军已解散\n袁术脱离上级独立\n获豫州、扬州宣称并开始经略豫州"
 hd_hev_184_52_name:0 "公孙瓒败亡（冀州之战战败）"
 hd_hev_184_52_tt:0 "#high 公孙瓒败亡（冀州之战战败）#!\n公孙瓒发动的冀州之战以战败告终\n公孙瓒自尽，其封臣分别独立\n袁绍收到“公孙瓒败亡”通报"
 hd_hev_184_53_name:0 "徐州平定（陶谦保境）"
 hd_hev_184_53_tt:0 "#high 徐州平定（陶谦保境）#!\n陶谦据徐州后（AI 自动出兵兼并）\n徐州法理公国全部归陶谦阵营\n陶谦转为守境、不再扩张"
 hd_hev_184_54_name:0 "荆州平定（刘表保境）"
 hd_hev_184_54_tt:0 "#high 荆州平定（刘表保境）#!\n刘表入主荆州后逐步兼并\n荆州法理公国全部归刘表或其封臣\n刘表获“保境荆州”修正"
 hd_hev_184_55_name:0 "徐州城下的阴影 / 来自徐州的邀约（陶谦请刘备入徐州）"
 hd_hev_184_55_tt:0 "#high 徐州城下的阴影 / 来自徐州的邀约（陶谦请刘备入徐州）#!\n曹操控制兖州及豫州或青州，威胁徐州\n陶谦（0500）布防并邀请刘备，刘备（0501）应邀\n刘备与陶谦结盟，营地迁入徐州"
 hd_hev_184_56_name:0 "麋氏的心意（麋竺、麋芳来投）"
 hd_hev_184_56_tt:0 "#high 麋氏的心意（麋竺、麋芳来投）#!\n刘备营地或领地在徐州\n麋竺在世\n麋竺、麋芳入刘备宫廷，选 a 时另娶麋夫人"
 hd_hev_184_57_name:0 "托付徐州（陶谦让徐州）"
 hd_hev_184_57_tt:0 "#high 托付徐州（陶谦让徐州）#!\n194 年后陶谦病危（健康 ≤2），刘备仍为冒险者\n陶谦（0700）托付、刘备（0701）接受；两人都是 AI 时直接执行\n刘备尽得徐州，陶谦病故"
 hd_hev_184_58_name:0 "孙策继承父业"
 hd_hev_184_58_tt:0 "#high 孙策继承父业#!\n孙坚死后（2 天后移交）\n孙策在世：继承孙坚的家族头衔、领地与玉玺\n孙策收到通报"
 hd_hev_184_59_name:0 "孙策辞袁渡江"
 hd_hev_184_59_tt:0 "#high 孙策辞袁渡江#!\n孙策已继承父业、成年、未被囚，孙坚已死\n孙策以玉玺换兵，取于湖、脱离袁术独立\n获扬州宣称与兵马"
 hd_hev_184_60_name:0 "周瑜来投"
 hd_hev_184_60_tt:0 "#high 周瑜来投#!\n孙策已渡江独立\n周瑜（开局收编者）在世未被囚\n周瑜交出领地、投入孙策宫廷，孙策另得 2000 兵"
 hd_hev_184_61_name:0 "平定丹阳 / 江东"
 hd_hev_184_61_tt:0 "#high 平定丹阳 / 江东#!\n孙策渡江后向丹阳用兵（4003 授权）\n丹阳郡所有县归孙策或其封臣\n孙策转为经略扬州"
 hd_hev_184_62_name:0 "江东小霸王"
 hd_hev_184_62_tt:0 "#high 江东小霸王#!\n孙策首次获得王国级或更高头衔\n获“小霸王”绰号、威望、恐惧与 3000 兵\n一生一次"
 hd_hev_184_63_name:0 "吕布来投（穷鸟入怀）"
 hd_hev_184_63_tt:0 "#high 吕布来投（穷鸟入怀）#!\n195 年后，刘备据有徐州\n吕布为无地冒险者，未与刘备交战\n吕布（0100）求投、刘备（0101）收留，吕布屯小沛"
 hd_hev_184_64_name:0 "奉迎天子"
 hd_hev_184_64_tt:0 "#high 奉迎天子#!\n196 年后，曹操兵力过万、领地达标，刘协仍在位\n曹操收到，应允后向挟持天子者宣战\n胜后迎天子，接管朝廷"
 hd_hev_184_65_name:0 "下邳失守（吕布袭取徐州）"
 hd_hev_184_65_tt:0 "#high 下邳失守（吕布袭取徐州）#!\n吕布寄居满一年，需冒险者 DLC\n吕布（0200）决意、刘备（0201）应对\n吕布尽得徐州，刘备复为冒险者屯小沛"
 hd_hev_184_66_name:0 "南投荆州（刘备依刘表）"
 hd_hev_184_66_tt:0 "#high 南投荆州（刘备依刘表）#!\n刘备失徐州后流浪，刘表据有荆州\n刘备（0300）请投、刘表（0301）接纳\n刘备得新野为刘表封臣，或营地迁往襄阳并结盟"
 hd_hev_184_67_name:0 "孙坚自立图丹阳 / 玉玺之谋"
 hd_hev_184_67_tt:0 "#high 孙坚自立图丹阳 / 玉玺之谋#!\n非史实兜底：孙坚活到 200 年仍未自立\n孙坚脱离上级、建营，获扬州宣称与 5000 兵\n持玉玺时袁术、刘表合谋，孙坚遇害"
 hd_hev_184_68_name:0 "官渡之战"
 hd_hev_184_68_tt:0 "#high 官渡之战#!\n曹袁接壤，各超过 120 县或已到 200 年\n曹操收到出兵邀请，应允后宣战袁绍\n官渡开战（胜负见下一行）"
 hd_hev_184_69_name:0 "官渡大捷、袁绍忧愤"
 hd_hev_184_69_tt:0 "#high 官渡大捷、袁绍忧愤#!\n官渡之战曹操获胜\n曹操夺取目标公国并得袁绍头衔宣称\n袁绍负重伤、获忧愤修正"
 hd_hev_184_70_name:0 "袁氏分家"
 hd_hev_184_70_tt:0 "#high 袁氏分家#!\n官渡败后（已设分家预备标记）袁绍去世\n领地在成年诸子间平分\n诸子收到通报"
 hd_hev_184_71_name:0 "接掌江东（孙权继兄）"
 hd_hev_184_71_tt:0 "#high 接掌江东（孙权继兄）#!\n孙策（已继承孙坚）死亡，2 天后移交\n孙权在世：接掌孙策头衔、扬州宣称与部曲\n孙权收到通报"
 hd_hev_184_72_name:0 "三顾草庐 / 隆中对"
 hd_hev_184_72_tt:0 "#high 三顾草庐 / 隆中对#!\n201.7 后，刘备依附刘表满一年\n刘备（0400）三顾，玩家诸葛亮（0401）可拒\n诸葛亮出山入刘备宫廷，结为至交"
 hd_hev_184_73_name:0 "益州来使（入蜀之战）"
 hd_hev_184_73_tt:0 "#high 益州来使（入蜀之战）#!\n211 年后，隆中对已成或已跳过，赤壁未进行中\n刘备收到，必要时先脱离领主独立\n向成都之主宣战并获援军"
 hd_hev_184_74_name:0 "成都城下（取成都 / 刘璋出降）"
 hd_hev_184_74_tt:0 "#high 成都城下（取成都 / 刘璋出降）#!\n入蜀之战结束，成都归刘备或其封臣\n益州之主（玩家可拒）出降，交出全部领地入刘备宫廷\n刘备迁都成都"
 hd_hev_long_01_name:0 "南匈奴入居并州（胡部求附）"
 hd_hev_long_01_tt:0 "#high 南匈奴入居并州（胡部求附）#!\n188–226 年（随机规则下不限年份），游戏规则须为史实或随机\n并州休屠各叛乱已结算或已过期\n每年按概率触发，216 年起必定触发\n胡帅向平阳/太原（或西河）郡之主求地"
 hd_hev_long_02_name:0 "乌桓内徙（胡部求附）"
 hd_hev_long_02_tt:0 "#high 乌桓内徙（胡部求附）#!\n200–240 年，游戏规则须为史实或随机\n每年按概率触发，230 年起必定触发\n丘力居/蹋顿（或生成的乌桓胡帅）向幽州最弱的接壤郡之主求地"
 hd_hev_long_03_name:0 "徙武都氐入关中（胡部求附）"
 hd_hev_long_03_tt:0 "#high 徙武都氐入关中（胡部求附）#!\n200–250 年，游戏规则须为史实或随机\n每年按概率触发，240 年起必定触发\n氐帅（阿贵等）向扶风、天水中较弱一郡之主求地"
 hd_hev_long_04_name:0 "李特起兵（史实大单于·成）"
 hd_hev_long_04_tt:0 "#high 李特起兵（史实大单于·成）#!\n296 年起，天朝循环处于动乱/乱世/对峙阶段\n李特（或李雄）在世、成年、未被囚禁、不在战中\nAI 每年按概率起兵，玩家可用“起兵自立”决议\n起兵夺取益州王国，国号成"
 hd_hev_long_05_name:0 "刘渊起兵（史实大单于·汉）"
 hd_hev_long_05_tt:0 "#high 刘渊起兵（史实大单于·汉）#!\n299 年起，天朝循环处于动乱阶段\n刘渊（出场生成器生成的角色）在世、成年、不在战中\nAI 每年按概率起兵，玩家可用决议\n起兵夺取并州王国，国号汉"
 hd_hev_long_06_name:0 "石勒起兵（史实大单于·赵）"
 hd_hev_long_06_tt:0 "#high 石勒起兵（史实大单于·赵）#!\n305 年起，天朝循环处于动乱阶段\n石勒在世、成年、不在战中\nAI 每年按概率起兵，玩家可用决议\n起兵夺取冀州王国，国号赵"
 hd_hev_long_07_name:0 "衣冠南渡（局势开始）"
 hd_hev_long_07_tt:0 "#high 衣冠南渡（局势开始）#!\n衣冠南渡规则未关闭\n北方有 2 个以上胡族强权（或 1 个帝国级）\n北方区域至少 50 个县沦陷\n每月检查（304 线洛阳陷落时直接开启），全天下收通告"
 hd_hev_long_08_name:0 "僚人入蜀"
 hd_hev_long_08_tt:0 "#high 僚人入蜀#!\n280 年起（随机规则不限年份），天朝循环处于动乱阶段\nAI 每年 10% 概率：宁州/巴郡一带的僚帅（没有就生成一个）攻蜀\n玩家僚人统治者可用重大决议发起\n目标是益州"
 hd_hev_long_09_name:0 "苻洪起兵（史实大单于·秦）"
 hd_hev_long_09_tt:0 "#high 苻洪起兵（史实大单于·秦）#!\n344 年起，天朝循环处于动乱阶段\n苻洪（出场生成器生成的角色）在世、成年、不在战中\nAI 每年按概率起兵，玩家可用决议\n起兵夺取司隶，国号秦"
 hd_hev_long_10_name:0 "姚弋仲起兵（史实大单于·秦）"
 hd_hev_long_10_tt:0 "#high 姚弋仲起兵（史实大单于·秦）#!\n344 年起，天朝循环处于动乱阶段\n姚弋仲在世、成年、不在战中\nAI 每年按概率起兵，玩家可用决议\n起兵夺取司隶，以南安为根据地"
 hd_hev_long_11_name:0 "异域来客（大秦秦论）"
 hd_hev_long_11_tt:0 "#high 异域来客（大秦秦论）#!\n226 年后\n同时持扬州王国与 长沙郡 的统治者收到\n罗马人秦论来访，可收为廷臣"
 hd_hev_218_01_name:0 "男子当战，女子当运（汉中之战）"
 hd_hev_218_01_tt:0 "#high 男子当战，女子当运（汉中之战）#!\n218.1.1 开局当天由脚本令刘备对汉中郡持有者夏侯渊宣战（边境战争）\n开战成功即发给刘备：增派一支汉中军、征兵加成 2 年\n曹刘互给 3 年停战；首次心跳向其他玩家发「汉中之战」通报"
 hd_hev_218_02_name:0 "耿纪之变"
 hd_hev_218_02_tt:0 "#high 耿纪之变#!\n218.3.1 之前\n曹操在世且为权臣，耿纪（未下狱）与王必在世\n发给曹操：王必死；AI 诛耿纪党，玩家可改为下狱"
 hd_hev_218_03_name:0 "曹彰北征（含北方大定）"
 hd_hev_218_03_tt:0 "#high 曹彰北征（含北方大定）#!\n218.4.1 起；曹操、曹彰在世\n能臣氐持代郡且为曹操封臣时据郡叛魏\n发给曹操：AI 命曹彰讨伐（开战夺代郡），玩家可招抚\n战胜后通报「北方大定」"
 hd_hev_218_04_name:0 "侯音据宛"
 hd_hev_218_04_tt:0 "#high 侯音据宛#!\n218.10.1 起；曹操在世有地\n侯音持宛县且为曹操封臣时据宛叛魏\n发给曹操：AI 命曹仁讨伐，玩家可招抚"
 hd_hev_218_05_name:0 "定军山"
 hd_hev_218_05_tt:0 "#high 定军山#!\n219.1.1 起；汉中之战仍在进行\n黄忠、夏侯渊在世（不要求在军中），夏侯渊须为 AI\n发给汉中之战攻方（刘备）：黄忠斩夏侯渊，蜀军士气 1 年、魏王军心动摇 1 年"
 hd_hev_218_06_name:0 "汉中归属（含汉中之争）"
 hd_hev_218_06_tt:0 "#high 汉中归属（含汉中之争）#!\n汉中之战刘备一方获胜即触发\n战争白和或作废时视同刘备胜，魏王是玩家则先问是否割让（0066）\n汉中及上庸、房陵、魏兴三郡归蜀主；发给蜀主，通报「汉中易手」"
 hd_hev_218_07_name:0 "镇守汉中"
 hd_hev_218_07_tt:0 "#high 镇守汉中#!\n汉中归属后第 3 天\n魏延在世、未下狱、为蜀主廷臣或封臣\n发给蜀主：汉中郡与蜀主手中的汉中各县授魏延，魏延成为直属封臣"
 hd_hev_218_08_name:0 "襄樊之战"
 hd_hev_218_08_tt:0 "#high 襄樊之战#!\n刘备得汉中满 4 个月\n关羽在世并持荆州，襄阳守方不是自己人\n发给关羽：AI 北攻襄阳（附南阳），玩家可固守江陵\n通报「关羽北伐」"
 hd_hev_218_09_name:0 "水淹七军"
 hd_hev_218_09_tt:0 "#high 水淹七军#!\n襄樊之战进行中，七至十月\n关羽、于禁、庞德在世，于禁和庞德都在守方军中\n发给关羽：于禁被俘、威震华夏 3 年；AI 斩庞德，玩家可囚之"
 hd_hev_218_10_name:0 "刮骨疗毒"
 hd_hev_218_10_tt:0 "#high 刮骨疗毒#!\n无日期限制，一次\n关羽在世、未下狱、带负伤特质；开局另建的华佗在世未下狱\n发给关羽：伤愈，得威望、影响力与修正 2 年"
 hd_hev_218_11_name:0 "头疾（曹操头疾）"
 hd_hev_218_11_tt:0 "#high 头疾（曹操头疾）#!\n219.9.1 起曹操在世即发头疾（修正 5 年）\n关羽死讯或 220.3.1 仍在世时恶化\nAI 曹操 221.1.1 仍在世且未开颅成功则病逝\n只有玩家曹操会看到事件"
 hd_hev_218_12_name:0 "白衣渡江（孙权亲发入口）"
 hd_hev_218_12_tt:0 "#high 白衣渡江（孙权亲发入口）#!\n襄樊之战开打满 3 个月仍在进行\n关羽、吕蒙在世，孙权独立\n发给孙权：AI 袭取荆州（糜芳、士仁好感低于 10 献城），玩家可坐观\n开战成功才通报「白衣渡江」"
 hd_hev_218_13_name:0 "大都督吕蒙（吕蒙袭荆州）"
 hd_hev_218_13_tt:0 "#high 大都督吕蒙（吕蒙袭荆州）#!\n219.10.1 起，白衣渡江尚未发生\n入口一：汉中之战已结束而刘备没得汉中；入口二：刘备得汉中但襄樊已结束或到 220.6 仍未打\n关羽持荆州、吕蒙在世、孙权独立\n发给孙权：AI 拜吕蒙为大都督攻刘备，玩家可维持孙刘之好（一年后再问）"
 hd_hev_218_14_name:0 "败走麦城（关羽之死）"
 hd_hev_218_14_tt:0 "#high 败走麦城（关羽之死）#!\n白衣渡江之战孙权胜，或关羽被孙权一方俘虏\n关羽、孙权在世\n发给孙权：AI 斩关羽（通报「关羽之死」），玩家可囚而不杀"
 hd_hev_218_15_name:0 "哀悼关羽"
 hd_hev_218_15_tt:0 "#high 哀悼关羽#!\n关羽死亡（任何死因）时曹操在世\n10 天后发给曹操：以诸侯之礼葬之，得威望\n未开颅成功则头疾恶化"
 hd_hev_218_16_name:0 "开颅之议"
 hd_hev_218_16_tt:0 "#high 开颅之议#!\n曹操头疾已恶化、仍在世\n华佗在世未下狱\n发给曹操：AI 斩华佗；玩家可开颅（5% 痊愈、95% 身死）或遣华佗离去"
 hd_hev_218_17_name:0 "魏王嗣位"
 hd_hev_218_17_tt:0 "#high 魏王嗣位#!\n曹操死后第 3 天（任何死因，不强制 220 年）\n曹丕在世\n曹操的头衔与直属封臣交曹丕，曹丕接魏王与权臣；通报「魏王薨」"
 hd_hev_218_18_name:0 "曹丕受禅（受禅之议 / 禅位诏书 / 魏王逼宫）"
 hd_hev_218_18_tt:0 "#high 曹丕受禅（受禅之议 / 禅位诏书 / 魏王逼宫）#!\n魏王嗣位满 240 天\n曹丕在世、是权臣、不在战争中\n都是 AI 直接受禅；玩家曹丕可暂缓，玩家献帝可拒绝（拒两次后曹丕强行夺位、献帝下狱）\n曹丕得传国玉玺，国号“魏”；通报「汉魏禅代」"
 hd_hev_218_19_name:0 "刘备称帝（汉帝即位）"
 hd_hev_218_19_tt:0 "#high 刘备称帝（汉帝即位）#!\n天子已非献帝一族（受禅后）\n刘备在世、独立并持汉中王号\n发给刘备：AI 称帝并筹办践祚大典，大典完成改国号“汉”（两年未办成则直接称帝）\n玩家可暂缓，一年后再问"
 hd_hev_218_20_name:0 "张飞遇害"
 hd_hev_218_20_tt:0 "#high 张飞遇害#!\n221.6.1 起，刘备已定称帝\n张飞是 AI，张飞、张达在世\n发给蜀主：张达杀张飞投吴；通报「张飞遇害」"
 hd_hev_218_21_name:0 "夷陵之战"
 hd_hev_218_21_tt:0 "#high 夷陵之战#!\n221.7.1 起；关羽死于吴，刘备已定称帝且仍是蜀主\n孙权在世并持有荆州某郡\n发给刘备：AI 东征（主攻南郡），玩家可听谏（一年后再问）\n通报「夷陵之战」"
 hd_hev_218_22_name:0 "火烧连营"
 hd_hev_218_22_tt:0 "#high 火烧连营#!\n222.6.1 起，夷陵之战进行中\n刘备在攻方军中、陆逊在守方军中\n发给刘备：蜀军受挫 1 年，陆逊得威望；冯习、张南、傅肜、程畿若在军中则阵亡"
 hd_hev_218_23_name:0 "白帝托孤"
 hd_hev_218_23_tt:0 "#high 白帝托孤#!\n刘备死后第 3 天\n新蜀主（汉中王号持有者）在世且不是诸葛亮；诸葛亮在世、未下狱、身在益州\n发给新蜀主：诸葛亮任首辅，“受遗诏辅政”10 年"
 hd_hev_218_24_name:0 "南中叛乱"
 hd_hev_218_24_tt:0 "#high 南中叛乱#!\n刘备死后满 2 个月\n雍闿、高定、朱褒至少一人是 AI 蜀臣\n三人起兵独立，孟获附雍闿；发给蜀主，通报「南中叛乱」"
 hd_hev_218_25_name:0 "丞相南征"
 hd_hev_218_25_tt:0 "#high 丞相南征#!\n南中叛乱满 1 年，叛首仍有人独立\n诸葛亮受遗诏辅政\n发给蜀主：AI 对每个叛首各开一战，玩家可来年再议\n通报「丞相南征」"
 hd_hev_218_26_name:0 "七擒孟获"
 hd_hev_218_26_tt:0 "#high 七擒孟获#!\n南征已准、叛首都不再独立\n孟获、蜀主在世\n孟获归附蜀主，对诸葛亮好感 +50；通报「七擒孟获」"
 hd_hev_218_27_name:0 "出师表"
 hd_hev_218_27_tt:0 "#high 出师表#!\n刘备死后满 3 年，诸葛亮辅政，南中已平\n天水守方是独立于蜀的势力\n发给蜀主：AI 北伐（天水、南安、安定），玩家可来年再议\n通报「出师北伐」"
 hd_hev_218_28_name:0 "姜维归降"
 hd_hev_218_28_tt:0 "#high 姜维归降#!\n北伐进行中\n姜维在世、无地、未下狱、不是蜀主廷臣\n姜维入蜀主宫廷"
 hd_hev_218_29_name:0 "失街亭"
 hd_hev_218_29_tt:0 "#high 失街亭#!\n北伐开战满 2 个月，仍在进行\n马谡在世且在蜀军中\n发给蜀主：蜀军受挫 1 年；AI 多半挥泪斩马谡，也可免死夺职\n通报「失街亭」"
 hd_hev_218_30_name:0 "孙权称帝（吴帝即位）"
 hd_hev_218_30_tt:0 "#high 孙权称帝（吴帝即位）#!\n天子已非刘氏；蜀汉大典完成满 2 年，或蜀汉未称帝而已到 229.5.23\n孙权在世、独立，主头衔为吴王号，刘备一方没有正在筹办的大典\n发给孙权：AI 称帝并办践祚大典，完成改国号“吴”；玩家可暂缓"
 hd_hev_253_01_name:0 "姜维出洮西（出石营）"
 hd_hev_253_01_tt:0 "#high 姜维出洮西（出石营）#!\n253 开局当天（大厅结束后）\n姜维在世、持梁州、不在战中，洮西郡守是曹芳治下的封臣\n姜维以开局北伐理由攻洮西郡，全天下收到通报\n218/263 开局不触发"
 hd_hev_253_02_name:0 "诸葛恪围新城"
 hd_hev_253_02_tt:0 "#high 诸葛恪围新城#!\n253 开局当天\n诸葛恪、毌丘俭都在世有地，合肥由毌丘俭或其上级持有\n吴国诸葛恪攻毌丘俭、目标合肥，另给二万兵\n仅 253 开局"
 hd_hev_253_03_name:0 "孙峻设宴（诸葛恪被杀）"
 hd_hev_253_03_tt:0 "#high 孙峻设宴（诸葛恪被杀）#!\n253.10.1 起，新城之战已结束\n诸葛恪在世、不在战中，孙峻在世、未被囚\n事件发给诸葛恪：电脑赴宴被杀，玩家可以称疾不去\n218 接力还要求诸葛恪任吴帝首辅、吴帝是电脑"
 hd_hev_253_04_name:0 "废立之议（司马师废帝）"
 hd_hev_253_04_tt:0 "#high 废立之议（司马师废帝）#!\n254.10.1 起\n司马师任权臣，曹芳在位，曹髦在世且在魏境内\n事件给司马师（若司马师是电脑、曹芳是玩家，则改发曹芳）\n废曹芳、立曹髦，夏侯玄先被处死"
 hd_hev_253_05_name:0 "淮南起兵（毌丘俭、文钦）"
 hd_hev_253_05_tt:0 "#high 淮南起兵（毌丘俭、文钦）#!\n255.2.1 起\n毌丘俭在世有地、是天子治下封臣、不在战中\n事件给毌丘俭：电脑以独立战争起兵（另给一万五千兵），玩家可以隐忍\n218 接力还要求司马氏掌权、毌丘俭直属天子"
 hd_hev_253_06_name:0 "司马师病逝"
 hd_hev_253_06_tt:0 "#high 司马师病逝#!\n255.3.1 起，司马师是电脑、仍任权臣，司马昭在世有地、是天子封臣\n已废帝且淮南之乱已平（或已到 255.12.1）；未废帝时最迟 257.1.1\n218 接力未废帝时，还要求司马师已任权臣约 12 次心跳\n司马师病逝，全天下收到通报"
 hd_hev_253_07_name:0 "兄终弟及（司马昭继任辅政）"
 hd_hev_253_07_tt:0 "#high 兄终弟及（司马昭继任辅政）#!\n司马师任权臣时死亡（死因不限），3 天后触发\n天子是玩家时问天子是否让司马昭辅政，司马昭是玩家时问他是否接任，都是电脑时直接接任\n司马昭须在世有地、是天子封臣"
 hd_hev_253_08_name:0 "诸葛诞起兵（寿春）"
 hd_hev_253_08_tt:0 "#high 诸葛诞起兵（寿春）#!\n257.6.1 起\n诸葛诞在世有地、是天子治下封臣、不在战中\n事件给诸葛诞：电脑起兵（另给一万五千兵），吴帝是电脑时直接派兵援助\n吴帝是玩家时另弹请援事件\n218 接力还要求司马氏掌权、诸葛诞直属天子"
 hd_hev_253_09_name:0 "南阙之变（司马昭之心／大将军之权）"
 hd_hev_253_09_tt:0 "#high 南阙之变（司马昭之心／大将军之权）#!\n260.6.1 起\n曹髦在位，权臣是司马昭（司马师仍在世时为司马师）\n事件给曹髦：电脑亲自率领宿卫出讨，被成济所弑，改立曹奂；玩家可以隐忍\n权臣是玩家时由他决定弑君还是擒而废之"
 hd_hev_253_10_name:0 "魏伐蜀（灭蜀之议）"
 hd_hev_253_10_tt:0 "#high 魏伐蜀（灭蜀之议）#!\n253 路径：263.9.1–268.1.1，司马师或司马昭任权臣，汉帝独立且不在交战；事件给权臣，玩家天子可以不准；最多发兵 3 次\n263 路径：263 开局后立即发兵，264.1.16 前可再试一次\n魏天子攻汉，钟会、邓艾随军"
 hd_hev_263_01_name:0 "司马昭封晋公（九锡之命）"
 hd_hev_263_01_tt:0 "#high 司马昭封晋公（九锡之命）#!\n263.11.18 起（伐蜀成败不影响）\n司马昭在世有地、任权臣，曹奂在位\n玩家司马昭可以推辞，玩家天子可以不封\n并州授给司马昭，改称“晋”"
 hd_hev_263_02_name:0 "舆榇出降（蜀汉亡）"
 hd_hev_263_02_tt:0 "#high 舆榇出降（蜀汉亡）#!\n伐蜀之战打满约 60 天后攻方战分达到 50，或占领涪、绵竹、雒、成都之一，或已经得胜（263 开局 264.1.16 兜底，接力局打满约 120 天兜底）\n汉帝是电脑时直接出降，玩家可以背城一战\n姜维降钟会，益州交给邓艾"
 hd_hev_263_03_name:0 "邓艾被收"
 hd_hev_263_03_tt:0 "#high 邓艾被收#!\n出降之后约 30 天\n邓艾仍持益州，钟会在世有地，两人都是天子封臣\n依次询问玩家钟会、司马昭、邓艾，都同意后执行；截止 264.6.1（接力局为出降后 150 天）\n邓艾、邓忠被钟会囚禁"
 hd_hev_263_04_name:0 "钟会之乱（据蜀自立）"
 hd_hev_263_04_tt:0 "#high 钟会之乱（据蜀自立）#!\n邓艾被收后约 30 天\n钟会持益州、是封臣、不在战中；截止 264.9.1（接力局为出降后 240 天）\n电脑钟会起兵即败，与姜维等一同被杀\n玩家钟会可以真正起兵，玩家姜维可以趁乱复汉"
 hd_hev_263_05_name:0 "进爵为王（司马昭进爵晋王）"
 hd_hev_263_05_tt:0 "#high 进爵为王（司马昭进爵晋王）#!\n264.5.2 起，已封晋公\n司马昭在世、仍持晋（并州）\n玩家司马昭可以推辞\n称号改为王，魏改元咸熙"
 hd_hev_263_06_name:0 "晋王薨（司马炎嗣位）"
 hd_hev_263_06_tt:0 "#high 晋王薨（司马炎嗣位）#!\n电脑司马昭在 265.9.6 病逝（接力局还要等伐蜀了结，最迟 269.1.1）；司马昭因其他原因死亡也会触发\n死后 3 天由司马炎接任晋王与权臣\n天子是玩家时问天子，司马炎是玩家时问他"
 hd_hev_263_07_name:0 "魏晋禅代（受禅）"
 hd_hev_263_07_tt:0 "#high 魏晋禅代（受禅）#!\n266.2.8 起（接力局还要等伐蜀了结，最迟 269.6.1）\n曹奂在位，权臣是司马炎（或在世的玩家司马昭）\n玩家受禅者可以推辞，玩家曹奂可以不禅\n国号改为晋，改元泰始"
 hd_hev_304_01_name:0 "出镇建邺"
 hd_hev_304_01_tt:0 "#high 出镇建邺#!\n307 年 9 月起（永嘉元年）\n天子须是河内司马氏，司马睿在世且是臣属，丹阳郡归天子一系\n天子收到事件，准奏后司马睿领丹阳、移镇建邺"
 hd_hev_304_02_name:0 "往依刘渊（石勒归汉）"
 hd_hev_304_02_tt:0 "#high 往依刘渊（石勒归汉）#!\n307 年 10 月起\n汉主（并州王国的独立匈奴刘氏）在位，石勒成年、在世、未被囚、还不在汉国境内\n石勒收到事件；汉主是玩家时由汉主决定收不收"
 hd_hev_304_03_name:0 "即皇帝位（刘渊称帝）"
 hd_hev_304_03_tt:0 "#high 即皇帝位（刘渊称帝）#!\n308 年 11 月起\n刘渊在世、独立、未被囚\n刘渊收到事件，称帝后改元永凤，并迁都平阳"
 hd_hev_304_04_name:0 "围攻洛阳（永嘉之乱）"
 hd_hev_304_04_tt:0 "#high 围攻洛阳（永嘉之乱）#!\n311 年 5 月起\n汉主与天子接壤（或已据河东、平阳、河内等郡），洛阳仍归天子\n汉主收到事件，出兵后对天子开战，目标河南郡；战后汉主得洛阳且天子是电脑时，天子被俘，开启衣冠南渡"
 hd_hev_346_01_name:0 "成汉亡（桓温平蜀）"
 hd_hev_346_01_tt:0 "#high 成汉亡（桓温平蜀）#!\n346 开局：桓温、李势都在世，李势仍据益州，开局即出兵伐蜀\n伐蜀战胜后，桓温（在世时）收封赏事件\n巴蜀帝号归晋帝，李势被送到建康\n天下通报“桓温平蜀”"
 hd_hev_346_02_name:0 "冉闵诛石鉴（冉闵称帝）"
 hd_hev_346_02_tt:0 "#high 冉闵诛石鉴（冉闵称帝）#!\n350.2.1–352.1.1，石虎已死（史实卒年由脚本执行）\n冉闵在世、成年、无地，邺（魏郡）仍属石氏\n冉闵收事件：诛石鉴，取魏郡称帝，国号魏\n天下通报“冉闵称帝”\n（弹出即算：玩家拒绝或后续没办成也显示已触发）"
 hd_hev_346_03_name:0 "西入关中（苻健入关）"
 hd_hev_346_03_tt:0 "#high 西入关中（苻健入关）#!\n350.6.1–353.1.1，苻洪已死\n苻健在世，关中（京兆）不在晋帝或苻健手里\n苻健收事件：取关中五郡，称天王，国号秦\n天下通报“苻健入关”\n（弹出即算：玩家拒绝或后续没办成也显示已触发）"
 hd_hev_346_04_name:0 "燕军南下（前燕南下）"
 hd_hev_346_04_tt:0 "#high 燕军南下（前燕南下）#!\n351.1.1–356.1.1\n平州之主是慕容氏、独立、不在战中\n幽州不在他手里\n平州之主收事件，向幽州之主宣战"
 hd_hev_346_05_name:0 "北伐（桓温北伐）"
 hd_hev_346_05_tt:0 "#high 北伐（桓温北伐）#!\n356.1.1–362.1.1\n桓温在世、是晋臣、不在战中\n洛阳（河南郡）不在晋手里\n桓温收事件，北伐河南"
 hd_hev_346_06_name:0 "云龙门之变（苻坚夺位）"
 hd_hev_346_06_tt:0 "#high 云龙门之变（苻坚夺位）#!\n357.6.1–360.1.1\n苻坚在世、成年、未被囚禁\n长安之主是苻氏 AI 君主（苻生），而且不是苻坚\n苻坚收事件：弑主夺位，天下通报\n（弹出即算：玩家拒绝或后续没办成也显示已触发）"
 hd_hev_346_07_name:0 "投鞭断流（淝水之战）"
 hd_hev_346_07_tt:0 "#high 投鞭断流（淝水之战）#!\n383.6.1 起（386.1.1 前仍不满足条件则跳过）\n苻坚在世、独立、领地至少 100 县、不在战中\n苻坚收事件，向晋帝宣战，目标扬州\n战争结局全天下通报"
 hd_hev_346_08_name:0 "淝水之后（前秦瓦解）"
 hd_hev_346_08_tt:0 "#high 淝水之后（前秦瓦解）#!\n淝水之战苻坚战败或白和\n苻坚在世时收事件\n非氐族、公爵级以上的封臣全部自立\n天下通报“淝水之战”"
 hd_hev_370_01_name:0 "金墉之围（洛阳之战）"
 hd_hev_370_01_tt:0 "#high 金墉之围（洛阳之战）#!\n开局时秦燕洛阳之战已在进行\n370 年 3 月 14 日至 7 月 9 日，慕容筑仍守河南郡、秦燕仍在交战\n慕容筑收到事件（电脑直接降），降后金墉归秦；洛阳之战打完、金墉归秦也算"
 hd_hev_370_02_name:0 "东征燕国（王猛伐燕）"
 hd_hev_370_02_tt:0 "#high 东征燕国（王猛伐燕）#!\n370 年 7 月 21 日至 371 年 6 月 1 日\n苻坚、慕容暐都是独立君主，邺城仍归燕\n苻坚收到事件（电脑直接出兵），对燕开战，目标魏郡"
 hd_hev_370_03_name:0 "寿春之役（征讨寿春）"
 hd_hev_370_03_tt:0 "#high 寿春之役（征讨寿春）#!\n370 年 9 月 6 日至 371 年 6 月 1 日\n寿春（安丰郡）由袁氏独立据守，天子是司马氏\n天子收到事件，开战后桓温随征（玩家桓温另收事件），玩家袁氏可选死守或出降"
 hd_hev_370_04_name:0 "邺城失守（燕国覆亡）"
 hd_hev_370_04_tt:0 "#high 邺城失守（燕国覆亡）#!\n王猛东征获胜（邺城归秦）后触发\n燕主在世有地（慕容暐，或燕蓟帝国的持有者），苻坚在世\n燕主收到事件（电脑直接出降），燕的头衔全部归秦，冀州交王猛，慕容评奔高句丽"
 hd_hev_370_05_name:0 "废立之议（桓温废立）"
 hd_hev_370_05_tt:0 "#high 废立之议（桓温废立）#!\n371 年 12 月 24 日至 373 年 1 月 1 日\n桓温是司马奕的臣属，司马奕仍是天子，司马昱在世\n桓温、司马奕、司马昱依次表态（电脑直接照史实走），司马昱即位，改元咸安"
 hd_hev_404_01_name:0 "覆舟山（桓玄西走）"
 hd_hev_404_01_tt:0 "#high 覆舟山（桓玄西走）#!\n404 开局刘裕在京口起兵，5 天后桓玄收事件（兜底：404.3.29 以后心跳补发）\n条件：刘裕在世且仍在打独立战争，桓玄仍是天子\n独立战争以刘裕胜结束，五郡归刘裕，桓玄西走江陵\n天下通报“桓玄西走”"
 hd_hev_404_02_name:0 "峥嵘洲（晋室复兴）"
 hd_hev_404_02_tt:0 "#high 峥嵘洲（晋室复兴）#!\n404.6.10 起，桓玄已西走（覆舟山已发生）\n刘裕独立在世，桓玄仍是天子，晋安帝或司马德文在世\n刘裕收事件；桓玄是 AI 时直接奉迎晋帝复晋，是玩家时开战\n天下通报“晋室复兴”"
 hd_hev_404_03_name:0 "浮海南下（卢循据番禺）"
 hd_hev_404_03_tt:0 "#high 浮海南下（卢循据番禺）#!\n404.10.15 起\n卢循在世、成年、无地，番禺县不在他手里\n卢循收事件：据番禺自立，向南海郡之主宣战\n（弹出即算：玩家拒绝或后续没办成也显示已触发）"
 hd_hev_404_04_name:0 "五城水口（谯纵兵变）"
 hd_hev_404_04_tt:0 "#high 五城水口（谯纵兵变）#!\n404 开局时毛璩在世、谯纵无地，给谯纵排期 333 天（约 405 年二月）\n事件触发时：益州之主独立，成都仍在他治下\n谯纵收事件：受众人拥立，夺成都自立，攻益州\n（弹出即算：玩家拒绝或后续没办成也显示已触发）"
 hd_hev_404_05_name:0 "伐南燕（灭南燕）"
 hd_hev_404_05_tt:0 "#high 伐南燕（灭南燕）#!\n409.4.1–413.1.1\n刘裕在世、不在战中，是晋室权臣或独立的王国级以上君主\n青州之主独立，且不是刘裕的宗主\n刘裕收事件，北伐青州"
 hd_hev_404_06_name:0 "伐后秦（北伐后秦）"
 hd_hev_404_06_tt:0 "#high 伐后秦（北伐后秦）#!\n416.9.1–419.1.1\n刘裕条件同伐南燕\n司隶之主独立，且不是刘裕的宗主\n刘裕收事件，北伐司隶"
 hd_hev_404_07_name:0 "禅让（刘宋代晋）"
 hd_hev_404_07_tt:0 "#high 禅让（刘宋代晋）#!\n418.12.1 起，刘裕在世、不在战中，是晋室权臣（摄政）\nAI 刘裕直接受禅，玩家刘裕收事件，可推迟一年\n国号改为宋，天下通报“刘宋代晋”"
 hd_hev_531_01_name:0 "信都立帝"
 hd_hev_531_01_tt:0 "#high 信都立帝#!\n531 年 10 月 31 日起\n高欢独立、未被囚，元朗在世、不是天子\n高欢收到事件，立元朗后改元中兴、国号魏"
 hd_hev_531_02_name:0 "进攻邺城"
 hd_hev_531_02_tt:0 "#high 进攻邺城#!\n531 年 12 月 1 日起\n高欢独立，刘诞仍持魏郡\n高欢收到事件，出兵攻邺（信都得兵一万），胜后刘诞被斩"
 hd_hev_531_03_name:0 "会师邺南（韩陵之战）"
 hd_hev_531_03_tt:0 "#high 会师邺南（韩陵之战）#!\n532 年 4 月 20 日至 533 年 1 月 1 日\n高欢已据邺城，尔朱兆独立\n尔朱兆收到事件，合兵攻邺；高欢守住邺城算胜，尔朱仲远随后奔梁"
 hd_hev_531_04_name:0 "入洛立帝（斛斯椿之变、禅位）"
 hd_hev_531_04_tt:0 "#high 入洛立帝（斛斯椿之变、禅位）#!\n532 年 5 月起，须韩陵之战高欢获胜\n高欢独立，元恭仍是天子，元修在世\n高欢决定入洛；斛斯椿杀尔朱世隆等，元恭禅位给元修，高欢任丞相"
 hd_hev_531_05_name:0 "贺拔岳遇害，宇文泰接掌关中"
 hd_hev_531_05_tt:0 "#high 贺拔岳遇害，宇文泰接掌关中#!\n534 年 2 月起\n贺拔岳在世、是电脑、有地\n宇文泰在同一主君之下时先接收贺拔岳的全部领地，然后贺拔岳为侯莫陈悦所杀；不弹事件"
 hd_hev_617_01_name:0 "西河之战"
 hd_hev_617_01_tt:0 "#high 西河之战#!\n开局时李渊对西河郡丞高德儒开战\n战争结束后判胜负：兹氏归李渊一系算胜\n胜后西河郡归李渊，高德儒被斩"
 hd_hev_617_02_name:0 "东都之围"
 hd_hev_617_02_tt:0 "#high 东都之围#!\n开局时李密对越王杨侗开战，目标河南郡\n战争结束后判胜负：洛阳归李密一系算胜\n胜后河南郡归李密"
 hd_hev_617_03_name:0 "诏救东都"
 hd_hev_617_03_tt:0 "#high 诏救东都#!\n617 年 8 月 7 日至 618 年 4 月 1 日\n王世充持江都县，杨侗持洛阳和偃师\n王世充收到事件（电脑直接北上），改作杨侗封臣，得偃师，东都得江淮兵一万"
 hd_hev_617_04_name:0 "薛举称帝"
 hd_hev_617_04_tt:0 "#high 薛举称帝#!\n617 年 8 月 7 日起\n薛举在世且独立\n直接改称皇帝，不弹事件"
 hd_hev_617_05_name:0 "西图关中（唐公兵临长安）"
 hd_hev_617_05_tt:0 "#high 西图关中（唐公兵临长安）#!\n617 年 8 月 10 日至 618 年 6 月 1 日\n李渊独立、持太原，代王杨侑仍持京兆郡\n李渊收到事件（电脑直接西进），对杨侑开战；玩家杨侑可选开城，克长安后李渊称唐王"
 hd_hev_617_06_name:0 "李轨起兵"
 hd_hev_617_06_tt:0 "#high 李轨起兵#!\n617 年 8 月 14 日至 618 年 3 月 1 日\n李轨在世、不是独立君主，武威郡还没被别的起义者占\n直接得武威郡、独立，称河西大凉王，改元安乐；不弹事件"
 hd_hev_617_07_name:0 "巴陵豪杰（萧铣起兵）"
 hd_hev_617_07_tt:0 "#high 巴陵豪杰（萧铣起兵）#!\n617 年 11 月 4 日至 618 年 3 月 1 日\n萧铣在世、持罗县、不是独立君主\n萧铣收到事件（电脑直接起兵），得长沙郡、独立，称梁公"
 hd_hev_617_08_name:0 "鸿门之宴（翟让之死）"
 hd_hev_617_08_tt:0 "#high 鸿门之宴（翟让之死）#!\n617 年 12 月 4 日至 618 年 6 月 1 日\n翟让是电脑角色、在世，并且是李密的封臣\n李密收到事件（电脑直接动手），收回翟让的县，在宴上杀翟让"
 hd_hev_617_09_name:0 "窦建德称夏王"
 hd_hev_617_09_tt:0 "#high 窦建德称夏王#!\n618 年 2 月 1 日起\n窦建德在世且独立\n直接改国号夏、称王，改元五凤；不弹事件"
 hd_hev_617_10_name:0 "江都之变"
 hd_hev_617_10_tt:0 "#high 江都之变#!\n618 年 4 月 11 日至 619 年 1 月 1 日\n炀帝在世，仍持天下与广陵县；宇文化及在世\n电脑炀帝被缢，杨侗继位改元皇泰，王世充任丞相；玩家炀帝不死，但宇文化及据江都、起兵开战"
 hd_hev_617_11_name:0 "萧铣称帝"
 hd_hev_617_11_tt:0 "#high 萧铣称帝#!\n618 年 5 月 1 日起\n萧铣在世、独立，并且已经起兵（有起义标记）\n直接改称皇帝，改元鸣凤；不弹事件"
 hd_hev_617_12_name:0 "受禅（唐建国）"
 hd_hev_617_12_tt:0 "#high 受禅（唐建国）#!\n618 年 6 月 18 日至 619 年 6 月 1 日\n李渊独立、持长安，天下头衔在别人手里\n李渊收到事件（电脑直接受禅），得天下头衔，国号唐，改元武德"
 hd_hev_617_13_name:0 "郑王逼禅（群下劝进）"
 hd_hev_617_13_tt:0 "#high 郑王逼禅（群下劝进）#!\n619 年 5 月 1 日至 620 年 1 月 1 日\n王世充是杨侗的封臣，杨侗仍持洛阳\n玩家王世充或玩家杨侗收到事件（双方都是电脑时直接执行），王世充篡位，国号郑，改元开明"
