 hd_hev_grp_89_name:0 "#high 东汉·燕然勒石（89.1.30）#!"
 hd_hev_grp_184_name:0 "#high 汉末风云（184.1.1）#!"
 hd_hev_grp_long_name:0 "#high 长线通用：五胡内徙、衣冠南渡、大秦来使（多个开局）#!"
 hd_hev_grp_218_name:0 "#high 三国鼎立（218.1.1）#!"
 hd_hev_grp_253_name:0 "#high 姜维北伐（253.3.1；218 开局 253.3.1 起接力；263 开局只有魏伐蜀一行适用）#!"
 hd_hev_grp_263_name:0 "#high 钟会伐蜀（263.9.20；218、253 开局 263.8.1 起接力）#!"
 hd_hev_grp_304_name:0 "#high 西晋末·八王之乱与永嘉之乱（304–317；304 开局适用）#!"
 hd_hev_grp_346_name:0 "#high 后赵崩解与秦燕并起（346–370；304、346 开局适用）#!"
 hd_hev_grp_370_name:0 "#high 王猛伐燕与前秦一统（370–383；304、346、370 开局适用）#!"
 hd_hev_grp_404_name:0 "#high 刘裕北伐与晋宋禅代（404–421；四个两晋开局都适用）#!"
 hd_hev_grp_j16_e2_name:0 "#high 东晋初·二赵相争（317–346；304 开局适用）#!"
 hd_hev_grp_j16_e5j_name:0 "#high 东晋末·王恭、孙恩与桓玄（396–404；304、346、370 开局适用）#!"
 hd_hev_grp_j16_e5_name:0 "#high 北方诸国（395–412；参合陂至柴壁四行早于 404，404 开局显示开局前）#!"
 hd_hev_grp_531_name:0 "#high 信都起兵（531.7.1）#!"
 hd_hev_grp_617_name:0 "#high 晋阳起兵（617.6.23）#!"
 hd_hev_22_01_name:0 "舂陵起兵（宛城之战）"
 hd_hev_22_01_tt:0 "#high 舂陵起兵（宛城之战）#!\n22.11.13 开局当天（大厅之后）\n刘縯独立且甄阜仍持南阳郡时，对甄阜发动边境战争\n新市王匡、平林陈牧加入攻方\n战后宛城归汉军一方即为汉军胜，电脑甄阜、梁丘赐战死"
 hd_hev_22_02_name:0 "宜秋之会（下江合兵）"
 hd_hev_22_02_tt:0 "#high 宜秋之会（下江合兵）#!\n22.12.13 起，23.6.1 截止\n王常独立、有地、未参战，且刘縯仍在打宛城之战\n王常（下江兵）加入攻方，得 4000 兵\n玩家王常收到弹窗，可选合兵或自守"
 hd_hev_22_03_name:0 "共立刘玄（更始称帝）"
 hd_hev_22_03_tt:0 "#high 共立刘玄（更始称帝）#!\n23.3.11（更始元年二月）起，24.1.1 截止\n刘玄无地，且刘縯、王匡、陈牧、王常中至少 3 人独立有地\n刘玄得随县或应山，登汉帝位，改元更始\n四家奉立：电脑直接改投，玩家弹窗选择奉立或自立"
 hd_hev_22_04_name:0 "昆阳之围（昆阳之战）"
 hd_hev_22_04_tt:0 "#high 昆阳之围（昆阳之战）#!\n23.5.8 起，24.1.1 截止\n王莽仍持天下、刘玄已称帝、刘秀是更始一系的有地封臣\n昆阳交给刘秀，王邑率三万人来攻\n玩家刘秀收到弹窗，可选守城或弃城；汉军胜则王寻战死、王莽威望大减"
 hd_hev_22_05_name:0 "颍川诸将（颍川归心）"
 hd_hev_22_05_tt:0 "#high 颍川诸将（颍川归心）#!\n昆阳之战结束（或 23.8.1）起，24.6.1 截止\n刘秀在世且有地\n冯异、祭遵、王霸、铫期等颍川诸将陆续来投刘秀宫廷（只来电脑、无主的人）\n玩家刘秀收到一次通知"
 hd_hev_22_06_name:0 "伯升之死"
 hd_hev_22_06_tt:0 "#high 伯升之死#!\n23.7.7 起（昆阳结算后，或 24.1.1）\n昆阳汉军胜、刘玄仍为帝、刘縯是更始的电脑封臣\n更始杀刘縯\n玩家刘秀收到弹窗，可选隐忍谢罪或愤然离去（之后与更始为宿敌）"
 hd_hev_22_07_name:0 "刘歆、王涉谋劫王莽事泄"
 hd_hev_22_07_tt:0 "#high 刘歆、王涉谋劫王莽事泄#!\n23.8.1（地皇四年七月）\n王莽仍持天下才执行\n电脑刘歆、王涉自杀，董忠被王莽所杀（玩家角色不死）\n无弹窗"
 hd_hev_22_08_name:0 "四方叛去（天下响应）"
 hd_hev_22_08_tt:0 "#high 四方叛去（天下响应）#!\n23.8.1 起，24.1.1 截止\n王莽仍持天下\n隗嚣据天水自立；公孙述自立（玩家弹“蜀中自立”）；王莽直属的电脑郡守（司隶除外）各自独立\n玩家王莽收到“四方叛去”"
 hd_hev_22_09_name:0 "常安陷落（含西入武关）"
 hd_hev_22_09_tt:0 "#high 常安陷落（含西入武关）#!\n天下响应之后，由更始帝（或最强的起义军）西入武关攻京兆\n攻下常安后新朝灭亡：天下、玉玺转给执行人，电脑王莽死于渐台\n玩家执行人先收到“西入武关”；玩家王莽可选出奔或死守\n26.1.1 仍未攻下时由常安城中起事兜底（玩家王莽除外）"
 hd_hev_22_10_name:0 "持节北渡"
 hd_hev_22_10_tt:0 "#high 持节北渡#!\n23.11.1 起，25.1.1 截止\n刘秀在世且有地\n刘秀持节北渡，夺安平郡（信都），得 5000 兵；邓禹、任光、耿纯等河北诸将陆续来投\n玩家刘秀可选北渡或留下；直属主君是玩家时先请他批准\n（弹出即算：玩家拒绝或后续没办成也显示已触发）"
 hd_hev_22_11_name:0 "萧王辞召（河北自立）"
 hd_hev_22_11_tt:0 "#high 萧王辞召（河北自立）#!\n北渡后 120 天（或伯升死后愤然离去；25.8.5 起再试一次），27.1.1 截止\n刘秀持郡级以上头衔，且尚未独立\n刘秀脱离主君自立为萧王，得征服者\n玩家刘秀可选自立或奉诏；玩家主君收到通知"
 hd_hev_22_12_name:0 "进兵邯郸（平定河北）"
 hd_hev_22_12_tt:0 "#high 进兵邯郸（平定河北）#!\n刘秀自立之后，26.1.1 截止\n刘秀独立有地，邯郸不在自己手里\n刘秀进攻邯郸持有者（襄国郡），得 1 万兵；胜则电脑王郎死\n玩家刘秀可选进兵或暂缓；耿弇、吴汉等上谷、渔阳诸将来投"
 hd_hev_22_13_name:0 "千秋亭即位（鄗城称帝）"
 hd_hev_22_13_tt:0 "#high 千秋亭即位（鄗城称帝）#!\n25.8.5（建武元年六月）起，27.1.1 截止\n刘秀已独立且有地\n刘秀称帝（建幽燕帝国头衔或沿用天下），改元建武；马武、岑彭来投\n玩家刘秀可选称帝或暂缓（26.6.1 再问一次）"
 # 汉代风味内容（2026-10-25）手工加行；生成器 build_data.py 未同步，勿直接重跑
 hd_hev_22_14_name:0 "新莽弊政（宝货、王田、河决）"
 hd_hev_22_14_tt:0 "#high 新莽弊政（宝货、王田、河决）#!\n开局后第 20、80、140 天各发一件，23.6.1 截止\n王莽在世\n发给王莽和他领内的玩家；开局时新朝各县另挂「新莽弊政」三年（关历史事件开关则不挂）"
 hd_hev_22_15_name:0 "始正火德"
 hd_hev_22_15_tt:0 "#high 始正火德#!\n刘秀称帝后，时间线每 90 天查一次，30.1.1 截止\n刘秀在世，已有 hd_22_xiu_emperor\n刘秀定德运：火德（正统 +）或水德"
 hd_hev_89_01_name:0 "燕然勒石（出塞·稽落山之战）"
 hd_hev_89_01_tt:0 "#high 燕然勒石（出塞·稽落山之战）#!\n89.6.27 起，90.1.19 截止\n戈壁翁金郡有不属于天子的独立君主\n窦宪（窦宪不在则邓鸿，再不在则天子）出鸡鹿塞北伐，南单于、邓鸿从征\n胜则窦宪登燕然山刻石、拜大将军，翁金郡归朔方，北单于失去「最伟大的汗」；玩家执行人可选出塞或暂缓"
 hd_hev_89_02_name:0 "金微山"
 hd_hev_89_02_tt:0 "#high 金微山#!\n91.3.9 起，92.1.27 截止\n北单于仍独立，且仍持戈壁阿尔泰郡（或嗢昆）\n窦宪遣耿夔、任尚出居延塞，南单于从征\n胜则北单于西迁（电脑，或玩家选西遁；见「北匈奴西迁」），玩家北单于也可选降汉；东部诸部自号鲜卑"
 hd_hev_89_03_name:0 "西域都护"
 hd_hev_89_03_tt:0 "#high 西域都护#!\n91.12.29（永元三年十二月）起，93.1.1 截止\n班超在世且有地\n班超任西域都护：得威望、修正、西域王国头衔（仍为汉臣）与都护所部 8000；龟兹不降汉时开战（见「讨龟兹」）\n玩家龟兹王收到弹窗，可选降或不降"
 hd_hev_89_04_name:0 "款塞（於除鞬奉汉）"
 hd_hev_89_04_tt:0 "#high 款塞（於除鞬奉汉）#!\n91.12.29 起（须金微山汉军已胜），93.1.1 截止\n於除鞬在世，且已独立有地\n於除鞬遣使款塞，奉汉为宗主\n玩家於除鞬收到弹窗，可选奉汉或自立"
 hd_hev_89_05_name:0 "北宫闭门（诛窦）"
 hd_hev_89_05_tt:0 "#high 北宫闭门（诛窦）#!\n燕然、金微山两战都结束（含跳过）满一年后，且不早于 92.8.14\n窦宪在世，天子在位\n和帝与郑众定议，收窦宪印绶；电脑窦氏兄弟交还领地后自杀，邓叠、郭举下狱死\n玩家天子可选诛窦或隐忍；玩家窦宪可选交印或起兵"
 hd_hev_89_06_name:0 "於除鞬叛汉被斩"
 hd_hev_89_06_tt:0 "#high 於除鞬叛汉被斩#!\n93.7.1（永元五年）\n於除鞬此前已奉汉，且是电脑\n於除鞬叛汉北还，被任尚追斩\n无弹窗"
 hd_hev_89_07_name:0 "讨焉耆（焉耆之战）"
 hd_hev_89_07_tt:0 "#high 讨焉耆（焉耆之战）#!\n94.8.1（永元六年秋）起，96.1.1 截止\n班超在世且有地，焉耆仍未奉汉\n班超发八国兵讨焉耆；胜则电脑焉耆王广被斩、元孟立为王并奉汉\n玩家班超可选出兵或作罢；玩家焉耆王可选称臣或让位"
 hd_hev_89_08_name:0 "月氏来攻"
 hd_hev_89_08_tt:0 "#high 月氏来攻#!\n90.6.1 起，91.6.1 截止\n班超在世且有地\n月氏副王谢将兵七万攻班超；电脑班超坚壁清野，得威望与「月氏震服」\n玩家班超可选坚守或出战"
 hd_hev_89_09_name:0 "北匈奴西迁"
 hd_hev_89_09_tt:0 "#high 北匈奴西迁#!\n金微山汉军得胜后\n北单于为电脑，或玩家北单于选西遁\n於除鞬只留本部两郡自立；东部三郡自号鲜卑；高昌、车师后国、蒲昌自立；北单于带残部西迁双河，匈奴帝国头衔销毁；单于庭等漠北头衔与余下部帅归西鲜卑，漠北各县改鲜卑文化\n无弹窗（玩家北单于在金微山之败事件里选择）"
 hd_hev_89_10_name:0 "讨龟兹"
 hd_hev_89_10_tt:0 "#high 讨龟兹#!\n西域都护设立后，龟兹仍未归附，93.1.1 截止\n班超在世且有地\n班超领都护所部讨龟兹；胜则电脑龟兹王被废、白霸立为王并归附班超，它乾城所在的姑墨县归都护\n玩家班超可选出兵或安抚；玩家龟兹王可选称臣或让位"
 hd_hev_89_11_name:0 "定远侯"
 hd_hev_89_11_tt:0 "#high 定远侯#!\n95.3.1 起（须焉耆之战已胜），98.1.1 截止\n班超在世\n班超封定远侯：威望与「定远」军号\n玩家班超可选受封或辞让"
 hd_hev_89_12_name:0 "西使大秦"
 hd_hev_89_12_tt:0 "#high 西使大秦#!\n97.1.1 起，99.1.1 截止\n班超在世且有地\n班超遣甘英西使大秦，至条支临海而还：威望与「通使西极」\n玩家班超可选遣使或作罢"
 hd_hev_89_13_name:0 "生入玉门关"
 hd_hev_89_13_tt:0 "#high 生入玉门关#!\n100.6.1 上疏，102.8.1 交接\n班超在世且有地\n班超上疏求归；任尚接任都护，接收西域王国头衔、封臣与领地，电脑班超还洛阳\n玩家班超可选求归（保留治所，须至少两县）或留守"
 # 汉代风味内容（2026-10-25）手工加行；生成器 build_data.py 未同步，勿直接重跑
 hd_hev_89_14_name:0 "班昭续书"
 hd_hev_89_14_tt:0 "#high 班昭续书#!\n110.1.1 截止\n班固已死、班昭在世，有天子\n天子准许则 3~5 年后《汉书》成；玩家班昭另收「入东观」"
 hd_hev_89_15_name:0 "《汉书》成"
 hd_hev_89_15_tt:0 "#high 《汉书》成#!\n续书选「准」后 3~5 年，120.1.1 截止\n班昭在世\n天子得宝物《汉书》"
 hd_hev_89_16_name:0 "蔡侯纸"
 hd_hev_89_16_tt:0 "#high 蔡侯纸#!\n105.1.1 至 112.1.1\n蔡伦在世，有天子\n天子嘉之则得「蔡侯纸」五年；玩家蔡伦另收一则"
 hd_hev_89_17_name:0 "宋贵人旧案（蔡伦饮药）"
 hd_hev_89_17_tt:0 "#high 宋贵人旧案（蔡伦饮药）#!\n121.1.1 至 125.1.1\n蔡伦在世未囚，天子不是蔡伦\n天子敕诣廷尉：电脑蔡伦饮药自尽；玩家蔡伦可饮药或求见天子自陈"
 hd_hev_89_18_name:0 "候风地动仪（含陇西地动）"
 hd_hev_89_18_tt:0 "#high 候风地动仪（含陇西地动）#!\n132.1.1 至 138.1.1\n张衡在世，有天子\n天子得地动仪；置于灵台则 1~3 年后陇西地动（140.1.1 截止）"
 hd_hev_89_19_name:0 "弃凉州之议"
 hd_hev_89_19_tt:0 "#high 弃凉州之议#!\n110.1.1 至 113.1.1\n邓骘在世，天子领内有凉州县\n天子三选：弃（邓骘）/ 守（虞诩）/ 招抚"
 hd_hev_184_01_name:0 "苍天已死（黄巾起义）"
 hd_hev_184_01_tt:0 "#high 苍天已死（黄巾起义）#!\n184.1.1 开局后第 2 天\n马元义被处死，张角在冀州起事\n张角、张曼成、波才三路对汉宣战\n全体玩家收到「黄天当立」通报"
 hd_hev_184_02_name:0 "桃园结义（含后续「义旗初立」张世平、苏双资助）"
 hd_hev_184_02_tt:0 "#high 桃园结义（含后续「义旗初立」张世平、苏双资助）#!\n184 开局大厅结束后，由刘备人生故事派发\n需刘备、关羽、张飞都在世，且黄巾结局尚未定\n三人结为兄弟，关张转为刘备廷臣\n7~14 天后张世平、苏双资助金钱和兵马"
 hd_hev_184_03_name:0 "柱天将军（交趾屯兵反）"
 hd_hev_184_03_tt:0 "#high 柱天将军（交趾屯兵反）#!\n184.6~186.12 之间，每月判定\n前提：黄巾已起，交趾郡有在世郡主\n叛军对交趾郡主宣战\n只有守方是玩家时才弹出事件"
 hd_hev_184_04_name:0 "湟中羌胡反（北宫伯玉；含后续「迫于兵威」）"
 hd_hev_184_04_tt:0 "#high 湟中羌胡反（北宫伯玉；含后续「迫于兵威」）#!\n184.10~186.12 之间，每月判定\n前提：黄巾已起，金城或广魏有郡主\n北宫伯玉、韩遂等羌胡起兵\n胜后周边领主被迫臣服"
 hd_hev_184_05_name:0 "黄巾结局（「黄巾败亡」汉存 / 「黄巾得势」汉亡）"
 hd_hev_184_05_tt:0 "#high 黄巾结局（「黄巾败亡」汉存 / 「黄巾得势」汉亡）#!\n三路黄巾主战争全部结束且无一获胜：汉存\n任一路强制胜利：汉亡\n全体玩家收到结局事件\n汉存时接着进入宫廷危机排期"
 hd_hev_184_06_name:0 "黑山军起"
 hd_hev_184_06_tt:0 "#high 黑山军起#!\n185.2~188.12 之间，每月判定\n前提：黄巾已起，常山或赵国有郡主\n张燕等黑山军起事\n守方是玩家才弹出事件"
 hd_hev_184_07_name:0 "江夏蛮叛"
 hd_hev_184_07_tt:0 "#high 江夏蛮叛#!\n185.4~187.12 之间，每月判定\n前提：黄巾已起，江夏有郡主\n江夏蛮起兵\n守方是玩家才弹出事件"
 hd_hev_184_08_name:0 "王国举兵"
 hd_hev_184_08_tt:0 "#high 王国举兵#!\n187.4~189.12 之间，每月判定\n前提：黄巾已起，扶风有郡主\n王国起兵，可并入凉州叛乱战争\n守方是玩家才弹出事件"
 hd_hev_184_09_name:0 "张举称天子（张纯之乱）"
 hd_hev_184_09_tt:0 "#high 张举称天子（张纯之乱）#!\n187.6~189.12 之间，每月判定\n前提：黄巾已起，右北平、辽西、渔阳之一有郡主\n张举、张纯在幽州起兵\n守方是玩家才弹出事件"
 hd_hev_184_10_name:0 "镇抚荆州（刘表单骑入荆州）"
 hd_hev_184_10_tt:0 "#high 镇抚荆州（刘表单骑入荆州）#!\n188.1.1 前后（史实为 190 年）\n刘表在世、荆州有持有者\n刘表接管荆州王国及其法理领地、封臣\n刘表本人收到事件"
 hd_hev_184_11_name:0 "休屠各胡反（并州）"
 hd_hev_184_11_tt:0 "#high 休屠各胡反（并州）#!\n188.3~190.12 之间，每月判定\n前提：黄巾已起，西河或河西有郡主\n并州休屠各胡起兵\n守方是玩家才弹出事件"
 hd_hev_184_12_name:0 "益州黄巾（马相）"
 hd_hev_184_12_tt:0 "#high 益州黄巾（马相）#!\n188.6~190.12 之间，每月判定\n前提：黄巾已起，广汉、蜀郡、犍为之一有郡主\n马相在益州起兵\n守方是玩家才弹出事件"
 hd_hev_184_13_name:0 "灵帝驾崩"
 hd_hev_184_13_tt:0 "#high 灵帝驾崩#!\n最迟 189.5.13 强制病逝，也可能提前自然死亡\n头衔与直属封臣先转给刘辩，再让灵帝去世\n全体玩家收到「灵帝驾崩」通报\n随后尝试开启宫廷危机"
 hd_hev_184_14_name:0 "京中风声（何进召外兵、董卓奉召入京）"
 hd_hev_184_14_tt:0 "#high 京中风声（何进召外兵、董卓奉召入京）#!\n前提：黄巾结局为汉存，或灵帝已死\n由董卓作为控制者，35 天后弹出\n何进议召外兵，董卓奉召入京\n事件给董卓与何进"
 hd_hev_184_15_name:0 "宫门合拢（何进遇害）"
 hd_hev_184_15_tt:0 "#high 宫门合拢（何进遇害）#!\n董卓奉召后约 35 天\n张让（或赵忠）在宫中杀何进\n事件给何进本人\n35 天后转入诛宦官"
 hd_hev_184_16_name:0 "血染宫门（诛宦官）"
 hd_hev_184_16_tt:0 "#high 血染宫门（诛宦官）#!\n何进死后约 35 天\n袁绍（不在则曹操，再不在则董卓）诛杀十常侍\n执行者收到「血染宫门」\n35 天后董卓入雒"
 hd_hev_184_17_name:0 "凉州兵入雒（董卓入雒、取司隶）"
 hd_hev_184_17_tt:0 "#high 凉州兵入雒（董卓入雒、取司隶）#!\n诛宦官后约 35 天\n董卓移驻雒阳，接管司隶及其封臣\n董卓成为固定权臣（丞相）\n全体玩家收到「凉州兵入雒」通报"
 hd_hev_184_18_name:0 "并州旧部 / 近身之刃（吕布杀丁原，并州归董）"
 hd_hev_184_18_tt:0 "#high 并州旧部 / 近身之刃（吕布杀丁原，并州归董）#!\n代码顺序：废立后约 30 天（史实在废立之前，189.8）\n丁原收到事件，吕布受董卓收买\n吕布杀丁原，并州全部转给董卓\n吕布认董卓为义父"
 hd_hev_184_19_name:0 "废立（少帝被废、刘协即位；含隐藏后续：少帝与何太后遇害）"
 hd_hev_184_19_tt:0 "#high 废立（少帝被废、刘协即位；含隐藏后续：少帝与何太后遇害）#!\n董卓入雒后 365 天\n刘辩的头衔连同天下霸权转给刘协\n董卓继续任权臣\n5 天后刘辩、何太后遇害；全体玩家收到「董卓废立」"
 hd_hev_184_20_name:0 "横刀长揖（袁绍出奔渤海）"
 hd_hev_184_20_tt:0 "#high 横刀长揖（袁绍出奔渤海）#!\n废立后约 35 天\n袁绍在世且早期故事未完成\n袁绍与董卓决裂，出奔渤海\n事件给袁绍"
 hd_hev_184_21_name:0 "关东举兵（讨董联盟成立）"
 hd_hev_184_21_tt:0 "#high 关东举兵（讨董联盟成立）#!\n废立之后，由袁绍等人发起\n联盟正式成立后发出各路邀请\n联军对董卓宣战，全体玩家收到「关东举兵」\n联盟成立当天排期董卓焚雒"
 hd_hev_184_22_name:0 "焚雒西迁"
 hd_hev_184_22_tt:0 "#high 焚雒西迁#!\n讨董联盟成立后 1 天\n董卓焚毁雒阳，屠戮雒阳世家\n天子与董卓核心迁往长安\n全体玩家收到「焚雒西迁」"
 hd_hev_184_23_name:0 "联军收兵·讨董联盟解散（汉室之下：诸侯去留）"
 hd_hev_184_23_tt:0 "#high 联军收兵·讨董联盟解散（汉室之下：诸侯去留）#!\n讨董战争得胜、无功或董卓死亡，联盟终结\n联盟解散，天子麾下封臣按比例独立\n玩家封臣弹出「汉室之下」自选去留\n第 3 天复查，随后做飞地处理"
 hd_hev_184_24_name:0 "群雄并起（历史群雄独立；含「请据故地」）"
 hd_hev_184_24_tt:0 "#high 群雄并起（历史群雄独立；含「请据故地」）#!\n联盟解散并处理完飞地后 1 天\n张杨、袁绍、曹操、刘表等约 40 名首领在史实郡县起兵\n玩家首领自己决定是否起兵\n首领在玩家麾下时，由玩家决定是否放行\n（弹出即算：玩家拒绝或后续没办成也显示已触发）"
 hd_hev_184_25_name:0 "济北受降（曹操收编青州军）"
 hd_hev_184_25_tt:0 "#high 济北受降（曹操收编青州军）#!\n讨董联盟结束约一年后，且不早于 191 年\n曹操在世且有封地\n获得青州兵 22000，直辖县获青州屯田 20 年\n事件给曹操"
 hd_hev_184_26_name:0 "王允诛董（未央之约 / 诛董之期 / 宫门换戍）"
 hd_hev_184_26_tt:0 "#high 王允诛董（未央之约 / 诛董之期 / 宫门换戍）#!\n192.5.1 起判定：董卓是权臣且王允未被囚禁\n玩家董卓可称病推迟一年；玩家王允或吕布决定是否动手\n吕布在场时由吕布杀董卓，否则由王允\n吕布得京兆，王允任录尚书事，貂蝉归吕布"
 hd_hev_184_27_name:0 "西凉兵反攻长安（李傕郭汜之乱）"
 hd_hev_184_27_tt:0 "#high 西凉兵反攻长安（李傕郭汜之乱）#!\n董卓死后结算完毕，李傕获封弘农并独立\n次日李傕对京兆持有者（吕布）宣战\n郭汜并入李傕麾下\n全体玩家收到「西凉兵反攻长安」"
 hd_hev_184_28_name:0 "长安败走（长安陷落、吕布出奔，含陈宫来投）"
 hd_hev_184_28_tt:0 "#high 长安败走（长安陷落、吕布出奔，含陈宫来投）#!\n李傕赢得长安之战\n王允及其亲族被处死，李傕取京兆\n吕布失去封地，成为流浪营地，获得赠兵\n张辽、高顺随行，次日陈宫来投"
 hd_hev_184_29_name:0 "逃往关东（吕布东奔兖州）"
 hd_hev_184_29_tt:0 "#high 逃往关东（吕布东奔兖州）#!\n吕布营地组建完成（三将已处理、赠兵已到）\n营地迁往陈留，获得兖州、陈留宣称\n30 天后对陈留持有者宣战\n事件给吕布"
 hd_hev_184_30_name:0 "严白虎屯聚"
 hd_hev_184_30_tt:0 "#high 严白虎屯聚#!\n196.1~199.12 之间，每月判定\n前提：黄巾已起，吴郡有郡主\n严白虎在吴郡起事\n守方是玩家才弹出事件"
 hd_hev_184_31_name:0 "赤壁（荆州去就 / 赤壁之前 / 北军退却 / 江防已破）"
 hd_hev_184_31_tt:0 "#high 赤壁（荆州去就 / 赤壁之前 / 北军退却 / 江防已破）#!\n官渡结算后，曹操、孙权、刘备都在世\n荆州持有者决定降曹或抵抗\n曹操决定是否南下对孙权开战\n北军败：北军退却；孙权败：江防已破"
 hd_hev_184_32_name:0 "黄旗遍野（刘备从军讨黄巾）"
 hd_hev_184_32_tt:0 "#high 黄旗遍野（刘备从军讨黄巾）#!\n184 年黄巾之乱期间，汉帝与黄巾交战\n刘备（184 开局、成年、有地/营地、未被囚）收到\n应允后作为守方加入讨黄巾之战"
 hd_hev_184_33_name:0 "宫门血迹 / 满座泪痕（曹操谋董）"
 hd_hev_184_33_tt:0 "#high 宫门血迹 / 满座泪痕（曹操谋董）#!\n董卓废立（宫廷危机）后约 35 天\n曹操在世即触发，玩家/AI 均走事件\n伍孚刺董失败被杀，曹操开始谋划"
 hd_hev_184_34_name:0 "借刀 / 镜中寒光（献刀刺董）"
 hd_hev_184_34_tt:0 "#high 借刀 / 镜中寒光（献刀刺董）#!\n接上一节点约一个月后\n曹操从王允处得七星宝刀，行刺董卓未遂\n董卓与曹操结为宿敌"
 hd_hev_184_35_name:0 "途中旧血（吕伯奢之祸）"
 hd_hev_184_35_tt:0 "#high 途中旧血（吕伯奢之祸）#!\n刺董失败后逃归东郡（需已安置东武阳）\n曹操杀吕伯奢全家，陈宫若随行则离去\n曹操获冷酷特质"
 hd_hev_184_36_name:0 "关东义旗（刘备响应讨董）"
 hd_hev_184_36_tt:0 "#high 关东义旗（刘备响应讨董）#!\n讨董联军成立后\n刘备收到，应允后作为攻方加入讨董之战\n联军解散后不再触发"
 hd_hev_184_37_name:0 "东郡整众（曹操起家完成）"
 hd_hev_184_37_tt:0 "#high 东郡整众（曹操起家完成）#!\n吕伯奢事件后数日，曹操须有领地\n获征服者特质、6000 金、4000 丹阳精兵\n夏侯、曹氏宗亲来投"
 hd_hev_184_38_name:0 "整顿渤海（袁绍入渤海）"
 hd_hev_184_38_tt:0 "#high 整顿渤海（袁绍入渤海）#!\n讨董期间袁绍出奔渤海，定都清池并得冀州宣称\n安顿后获 3000 金、5000 甲士\n审配、田丰、沮授、颜良、文丑等来投"
 hd_hev_184_39_name:0 "袁术出奔南阳"
 hd_hev_184_39_tt:0 "#high 袁术出奔南阳#!\n董卓入洛阳后\n袁术在世未被囚即触发\n袁术庄园迁往南阳宛城"
 hd_hev_184_40_name:0 "袁术夺南阳、孙坚依附"
 hd_hev_184_40_tt:0 "#high 袁术夺南阳、孙坚依附#!\n袁术已到宛城、孙坚在世未被囚\n孙坚杀南阳太守，南阳郡全部归袁术\n孙坚交出领地、作为袁术封臣迁到宛城"
 hd_hev_184_41_name:0 "南阳黄巾来降"
 hd_hev_184_41_tt:0 "#high 南阳黄巾来降#!\n袁术取得南阳郡 30 天后\n袁术收到，得约 3.6 万南阳黄巾降军\n之后分两批招揽南阳人物"
 hd_hev_184_42_name:0 "孙坚得传国玉玺"
 hd_hev_184_42_tt:0 "#high 孙坚得传国玉玺#!\n讨董联军解散后\n孙坚在世、实际参加过讨董之战\n孙坚取得传国玉玺"
 hd_hev_184_43_name:0 "借兵图冀（公孙瓒南攻冀州）"
 hd_hev_184_43_tt:0 "#high 借兵图冀（公孙瓒南攻冀州）#!\n讨董链结束后，韩馥仍据冀州\n公孙瓒（持幽州）收到出兵邀请，应允后向韩馥宣战\n袁绍收到“借兵图冀”通报"
 hd_hev_184_44_name:0 "冀州易主（韩馥让冀州）"
 hd_hev_184_44_tt:0 "#high 冀州易主（韩馥让冀州）#!\n公孙瓒攻冀州约 30 天后\n韩馥与袁绍均在世：韩馥把冀州全境让给袁绍\n袁绍与公孙瓒结仇，袁绍收到通报"
 hd_hev_184_45_name:0 "伯圭来书（刘备投公孙瓒）"
 hd_hev_184_45_tt:0 "#high 伯圭来书（刘备投公孙瓒）#!\n讨董结束、群雄逐鹿开始约 30 天后\n公孙瓒（0300）先决定是否来书，刘备（0301）再决定\n结盟后刘备营地迁往公孙瓒都城"
 hd_hev_184_46_name:0 "相知子龙"
 hd_hev_184_46_tt:0 "#high 相知子龙#!\n刘备已与公孙瓒结盟并屯驻其境内\n赵云为公孙瓒廷臣\n刘备与赵云结为好友"
 hd_hev_184_47_name:0 "旧友叩门（赵云来投）"
 hd_hev_184_47_tt:0 "#high 旧友叩门（赵云来投）#!\n刘备与赵云为好友\n赵云无地、离开公孙瓒宫廷\n赵云投入刘备宫廷"
 hd_hev_184_48_name:0 "陶谦据徐州"
 hd_hev_184_48_tt:0 "#high 陶谦据徐州#!\n讨董链结束后\n陶谦在世：得徐州王国与州治并独立\n获 3000 丹阳精兵"
 hd_hev_184_49_name:0 "臧霸归附"
 hd_hev_184_49_tt:0 "#high 臧霸归附#!\n陶谦已据徐州，群雄逐鹿已开始\n臧霸在世，若为独立小领主则向陶谦称臣\n陶谦收到通报"
 hd_hev_184_50_name:0 "岘山殒命（孙坚之死）"
 hd_hev_184_50_tt:0 "#high 岘山殒命（孙坚之死）#!\n191.1–192.12 随机排期，联军已解散\n孙坚未自立、刘表在世未被囚\n孙坚征刘表，中黄祖伏兵阵亡"
 hd_hev_184_51_name:0 "袁术自立"
 hd_hev_184_51_tt:0 "#high 袁术自立#!\n袁术已取得南阳且联军已解散\n袁术脱离上级独立\n获豫州、扬州宣称并开始经略豫州"
 hd_hev_184_52_name:0 "公孙瓒败亡（冀州之战战败）"
 hd_hev_184_52_tt:0 "#high 公孙瓒败亡（冀州之战战败）#!\n公孙瓒发动的冀州之战以战败告终\n公孙瓒自尽，其封臣分别独立\n袁绍收到“公孙瓒败亡”通报"
 hd_hev_184_53_name:0 "徐州平定（陶谦保境）"
 hd_hev_184_53_tt:0 "#high 徐州平定（陶谦保境）#!\n陶谦据徐州后（AI 自动出兵兼并）\n徐州法理公国全部归陶谦阵营\n陶谦转为守境、不再扩张"
 hd_hev_184_54_name:0 "荆州平定（刘表保境）"
 hd_hev_184_54_tt:0 "#high 荆州平定（刘表保境）#!\n刘表入主荆州后逐步兼并\n荆州法理公国全部归刘表或其封臣\n刘表获“保境荆州”修正"
 hd_hev_184_55_name:0 "徐州城下的阴影 / 来自徐州的邀约（陶谦请刘备入徐州）"
 hd_hev_184_55_tt:0 "#high 徐州城下的阴影 / 来自徐州的邀约（陶谦请刘备入徐州）#!\n曹操控制兖州及豫州或青州，威胁徐州\n陶谦（0500）布防并邀请刘备，刘备（0501）应邀\n刘备与陶谦结盟，营地迁入徐州"
 hd_hev_184_56_name:0 "麋氏的心意（麋竺、麋芳来投）"
 hd_hev_184_56_tt:0 "#high 麋氏的心意（麋竺、麋芳来投）#!\n刘备营地或领地在徐州\n麋竺在世\n麋竺、麋芳入刘备宫廷，选 a 时另娶麋夫人"
 hd_hev_184_57_name:0 "托付徐州（陶谦让徐州）"
 hd_hev_184_57_tt:0 "#high 托付徐州（陶谦让徐州）#!\n194 年后陶谦病危（健康 ≤2），刘备仍为冒险者\n陶谦（0700）托付、刘备（0701）接受；两人都是 AI 时直接执行\n刘备尽得徐州，陶谦病故"
 hd_hev_184_58_name:0 "孙策继承父业"
 hd_hev_184_58_tt:0 "#high 孙策继承父业#!\n孙坚死后（2 天后移交）\n孙策在世：继承孙坚的家族头衔、领地与玉玺\n孙策收到通报"
 hd_hev_184_59_name:0 "孙策辞袁渡江"
 hd_hev_184_59_tt:0 "#high 孙策辞袁渡江#!\n孙策已继承父业、成年、未被囚，孙坚已死\n孙策以玉玺换兵，弃庄园、到历阳立营（冒险者）并脱离袁术\n获扬州宣称与兵马"
 hd_hev_184_60_name:0 "周瑜来投"
 hd_hev_184_60_tt:0 "#high 周瑜来投#!\n孙策已渡江独立\n周瑜（开局收编者）在世未被囚\n周瑜交出领地、投入孙策宫廷，孙策另得 2000 兵"
 hd_hev_184_61_name:0 "平定丹阳 / 江东"
 hd_hev_184_61_tt:0 "#high 平定丹阳 / 江东#!\n孙策渡江后向丹阳用兵（4003 授权）\n丹阳郡所有县归孙策或其封臣\n孙策转为经略扬州"
 hd_hev_184_62_name:0 "江东小霸王"
 hd_hev_184_62_tt:0 "#high 江东小霸王#!\n孙策首次获得王国级或更高头衔\n获“小霸王”绰号、威望、恐惧与 3000 兵\n一生一次"
 hd_hev_184_63_name:0 "吕布来投（穷鸟入怀）"
 hd_hev_184_63_tt:0 "#high 吕布来投（穷鸟入怀）#!\n195 年后，刘备据有徐州\n吕布为无地冒险者，未与刘备交战\n吕布（0100）求投、刘备（0101）收留，吕布屯小沛"
 hd_hev_184_64_name:0 "奉迎天子"
 hd_hev_184_64_tt:0 "#high 奉迎天子#!\n196 年后，曹操兵力过万、领地达标，刘协仍在位\n曹操收到，应允后向挟持天子者宣战\n胜后迎天子，接管朝廷"
 hd_hev_184_65_name:0 "下邳失守（吕布袭取徐州）"
 hd_hev_184_65_tt:0 "#high 下邳失守（吕布袭取徐州）#!\n吕布寄居满一年，需冒险者 DLC\n吕布（0200）决意、刘备（0201）应对\n吕布尽得徐州，刘备复为冒险者屯小沛"
 hd_hev_184_66_name:0 "南投荆州（刘备依刘表）"
 hd_hev_184_66_tt:0 "#high 南投荆州（刘备依刘表）#!\n刘备失徐州后流浪，刘表据有荆州\n刘备（0300）请投、刘表（0301）接纳\n刘备整郡领新野（新野不在刘表境内时另择荆州一郡）、自立，向刘表朝贡并结盟、互订二十年停战；无郡可给时营地迁往刘表都城并结盟"
 hd_hev_184_67_name:0 "孙坚自立图丹阳 / 玉玺之谋"
 hd_hev_184_67_tt:0 "#high 孙坚自立图丹阳 / 玉玺之谋#!\n非史实兜底：孙坚活到 200 年仍未自立\n孙坚脱离上级、建营，获扬州宣称与 5000 兵\n持玉玺时袁术、刘表合谋，孙坚遇害"
 hd_hev_184_68_name:0 "官渡之战"
 hd_hev_184_68_tt:0 "#high 官渡之战#!\n曹袁接壤，各超过 120 县或已到 200 年\n曹操收到出兵邀请，应允后宣战袁绍\n官渡开战（胜负见下一行）"
 hd_hev_184_69_name:0 "官渡大捷、袁绍忧愤"
 hd_hev_184_69_tt:0 "#high 官渡大捷、袁绍忧愤#!\n官渡之战曹操获胜\n曹操夺取目标公国并得袁绍头衔宣称\n袁绍负重伤、获忧愤修正"
 hd_hev_184_70_name:0 "袁氏分家"
 hd_hev_184_70_tt:0 "#high 袁氏分家#!\n官渡败后（已设分家预备标记）袁绍去世\n领地在成年诸子间平分\n诸子收到通报"
 hd_hev_184_71_name:0 "接掌江东（孙权继兄）"
 hd_hev_184_71_tt:0 "#high 接掌江东（孙权继兄）#!\n孙策（已继承孙坚）死亡，2 天后移交\n孙权在世：接掌孙策头衔、扬州宣称与部曲\n孙权收到通报"
 hd_hev_184_72_name:0 "三顾草庐 / 隆中对"
 hd_hev_184_72_tt:0 "#high 三顾草庐 / 隆中对#!\n201.7 后，刘备依附刘表满一年\n刘备（0400）三顾，玩家诸葛亮（0401）可拒\n诸葛亮出山入刘备宫廷，结为至交"
 hd_hev_184_73_name:0 "益州来使（入蜀之战）"
 hd_hev_184_73_tt:0 "#high 益州来使（入蜀之战）#!\n211 年后，隆中对已成或已跳过，赤壁未进行中\n刘备收到，必要时先脱离领主独立\n向成都之主宣战并获援军"
 hd_hev_184_74_name:0 "成都城下（取成都 / 刘璋出降）"
 hd_hev_184_74_tt:0 "#high 成都城下（取成都 / 刘璋出降）#!\n入蜀之战结束，成都归刘备或其封臣\n益州之主（玩家可拒）出降，交出全部领地入刘备宫廷\n刘备迁都成都"
 # 汉代风味内容（2026-10-25）手工加行；生成器 build_data.py 未同步，勿直接重跑
 hd_hev_184_75_name:0 "坏五铢"
 hd_hev_184_75_tt:0 "#high 坏五铢#!\n宫廷危机完成后，191.12.31 截止\n董卓在世\n全图通报；京兆、扶风、冯翊各县加「钱轻物贵」五年"
 hd_hev_184_76_name:0 "千里草（童谣）"
 hd_hev_184_76_tt:0 "#high 千里草（童谣）#!\n190.9.1 至 191.5.20\n董卓在世且为权臣\n全图通报童谣"
 hd_hev_184_77_name:0 "蔡邕之死"
 hd_hev_184_77_tt:0 "#high 蔡邕之死#!\n王允诛董后，200.1.1 截止\n蔡邕在世未囚，王允在世\n蔡邕叹息则王允收之下狱，三十天后死于狱中；玩家蔡邕可请黥首刖足续史"
 hd_hev_184_78_name:0 "伤寒杂病论（张机著书）"
 hd_hev_184_78_tt:0 "#high 伤寒杂病论（张机著书）#!\n205.1.1 至 215.1.1\n张机（190 开局新建）在世\n张机得宝物《伤寒杂病论》"
 hd_hev_long_01_name:0 "南匈奴入居并州（胡部求附）"
 hd_hev_long_01_tt:0 "#high 南匈奴入居并州（胡部求附）#!\n188–226 年（随机规则下不限年份），游戏规则须为史实或随机\n并州休屠各叛乱已结算或已过期\n每年按概率触发，216 年起必定触发\n胡帅向平阳/太原（或西河）郡之主求地"
 hd_hev_long_02_name:0 "乌桓内徙（胡部求附）"
 hd_hev_long_02_tt:0 "#high 乌桓内徙（胡部求附）#!\n200–240 年，游戏规则须为史实或随机\n每年按概率触发，230 年起必定触发\n丘力居/蹋顿（或生成的乌桓胡帅）向幽州最弱的接壤郡之主求地"
 hd_hev_long_03_name:0 "徙武都氐入关中（胡部求附）"
 hd_hev_long_03_tt:0 "#high 徙武都氐入关中（胡部求附）#!\n200–250 年，游戏规则须为史实或随机\n每年按概率触发，240 年起必定触发\n氐帅（阿贵等）向扶风、天水中较弱一郡之主求地"
 hd_hev_long_04_name:0 "李特起兵（史实大单于·成）"
 hd_hev_long_04_tt:0 "#high 李特起兵（史实大单于·成）#!\n296 年起，天朝循环处于动乱/乱世/对峙阶段\n李特（或李雄）在世、成年、未被囚禁、不在战中\nAI 每年按概率起兵，玩家可用“起兵自立”决议\n起兵夺取益州王国，国号成"
 hd_hev_long_05_name:0 "刘渊起兵（史实大单于·汉）"
 hd_hev_long_05_tt:0 "#high 刘渊起兵（史实大单于·汉）#!\n299 年起，天朝循环处于动乱阶段\n刘渊（出场生成器生成的角色）在世、成年、不在战中\nAI 每年按概率起兵，玩家可用决议\n起兵夺取并州王国，国号汉"
 hd_hev_long_06_name:0 "石勒起兵（史实大单于·赵）"
 hd_hev_long_06_tt:0 "#high 石勒起兵（史实大单于·赵）#!\n305 年起，天朝循环处于动乱阶段\n石勒在世、成年、不在战中\nAI 每年按概率起兵，玩家可用决议\n起兵夺取冀州王国，国号赵"
 hd_hev_long_07_name:0 "衣冠南渡（局势开始）"
 hd_hev_long_07_tt:0 "#high 衣冠南渡（局势开始）#!\n衣冠南渡规则未关闭\n北方有 2 个以上胡族强权（或 1 个帝国级）\n北方区域至少 50 个县沦陷\n每月检查（304 线洛阳陷落时直接开启），全天下收通告"
 hd_hev_long_08_name:0 "僚人入蜀"
 hd_hev_long_08_tt:0 "#high 僚人入蜀#!\n280 年起（随机规则不限年份），天朝循环处于动乱阶段\nAI 每年 10% 概率：宁州/巴郡一带的僚帅（没有就生成一个）攻蜀\n玩家僚人统治者可用重大决议发起\n目标是益州"
 hd_hev_long_09_name:0 "苻洪起兵（史实大单于·秦）"
 hd_hev_long_09_tt:0 "#high 苻洪起兵（史实大单于·秦）#!\n344 年起，天朝循环处于动乱阶段\n苻洪（出场生成器生成的角色）在世、成年、不在战中\nAI 每年按概率起兵，玩家可用决议\n起兵夺取司隶，国号秦"
 hd_hev_long_10_name:0 "姚弋仲起兵（史实大单于·秦）"
 hd_hev_long_10_tt:0 "#high 姚弋仲起兵（史实大单于·秦）#!\n344 年起，天朝循环处于动乱阶段\n姚弋仲在世、成年、不在战中\nAI 每年按概率起兵，玩家可用决议\n起兵夺取司隶，以南安为根据地"
 hd_hev_long_11_name:0 "异域来客（大秦秦论）"
 hd_hev_long_11_tt:0 "#high 异域来客（大秦秦论）#!\n226 年后\n同时持扬州王国与 长沙郡 的统治者收到\n罗马人秦论来访，可收为廷臣"
 hd_hev_218_01_name:0 "男子当战，女子当运（汉中之战）"
 hd_hev_218_01_tt:0 "#high 男子当战，女子当运（汉中之战）#!\n218.1.1 开局当天由脚本令刘备对汉中郡持有者夏侯渊宣战（边境战争）\n开战成功即发给刘备：增派一支汉中军、征兵加成 2 年\n曹刘互给 3 年停战；首次心跳向其他玩家发「汉中之战」通报"
 hd_hev_218_02_name:0 "耿纪之变"
 hd_hev_218_02_tt:0 "#high 耿纪之变#!\n218.3.1 之前\n曹操在世且为权臣，耿纪（未下狱）与王必在世\n发给曹操：王必死；AI 诛耿纪党，玩家可改为下狱"
 hd_hev_218_03_name:0 "曹彰北征（含北方大定）"
 hd_hev_218_03_tt:0 "#high 曹彰北征（含北方大定）#!\n218.4.1 起；曹操、曹彰在世\n能臣氐持代郡且为曹操封臣时据郡叛魏\n发给曹操：AI 命曹彰讨伐（开战夺代郡），玩家可招抚\n战胜后通报「北方大定」"
 hd_hev_218_04_name:0 "侯音据宛"
 hd_hev_218_04_tt:0 "#high 侯音据宛#!\n218.10.1 起；曹操在世有地\n侯音持宛县且为曹操封臣时据宛叛魏\n发给曹操：AI 命曹仁讨伐，玩家可招抚"
 hd_hev_218_05_name:0 "定军山"
 hd_hev_218_05_tt:0 "#high 定军山#!\n219.1.1 起；汉中之战仍在进行\n黄忠、夏侯渊在世（不要求在军中），夏侯渊须为 AI\n发给汉中之战攻方（刘备）：黄忠斩夏侯渊，蜀军士气 1 年、魏王军心动摇 1 年"
 hd_hev_218_06_name:0 "汉中归属（含汉中之争）"
 hd_hev_218_06_tt:0 "#high 汉中归属（含汉中之争）#!\n汉中之战刘备一方获胜即触发\n战争白和或作废时视同刘备胜，魏王是玩家则先问是否割让（0066）\n汉中及上庸、房陵、魏兴三郡归蜀主；发给蜀主，通报「汉中易手」"
 hd_hev_218_07_name:0 "镇守汉中"
 hd_hev_218_07_tt:0 "#high 镇守汉中#!\n汉中归属后第 3 天\n魏延在世、未下狱、为蜀主廷臣或封臣\n发给蜀主：汉中郡与蜀主手中的汉中各县授魏延，魏延成为直属封臣"
 hd_hev_218_08_name:0 "襄樊之战"
 hd_hev_218_08_tt:0 "#high 襄樊之战#!\n刘备得汉中满 4 个月\n关羽在世并持荆州，襄阳守方不是自己人\n发给关羽：AI 北攻襄阳（附南阳），玩家可固守江陵\n通报「关羽北伐」\n关羽作统帅或骑士打完襄樊之战第一场仗即负轻伤（引出刮骨疗毒）"
 hd_hev_218_09_name:0 "水淹七军"
 hd_hev_218_09_tt:0 "#high 水淹七军#!\n襄樊之战进行中，七至十月\n关羽、于禁、庞德在世，于禁和庞德都在守方军中\n发给关羽：于禁被俘、威震华夏 3 年；AI 斩庞德，玩家可囚之"
 hd_hev_218_10_name:0 "刮骨疗毒"
 hd_hev_218_10_tt:0 "#high 刮骨疗毒#!\n无日期限制，一次\n关羽在世、未下狱、带负伤特质；襄樊之战中关羽首战（不论胜负）必负轻伤，7 天后即查\n华佗已死或下狱时，在关羽所在地另建一个游方华佗（旧华佗消失）\n发给关羽：伤愈，得威望、影响力与修正 2 年"
 hd_hev_218_11_name:0 "头疾（曹操头疾）"
 hd_hev_218_11_tt:0 "#high 头疾（曹操头疾）#!\n219.9.1 起曹操在世即发头疾（修正 5 年）\n关羽死讯或 220.3.1 仍在世时恶化\nAI 曹操 221.1.1 仍在世且未开颅成功则病逝\n只有玩家曹操会看到事件"
 hd_hev_218_12_name:0 "白衣渡江（孙权亲发入口）"
 hd_hev_218_12_tt:0 "#high 白衣渡江（孙权亲发入口）#!\n襄樊之战开打满 3 个月仍在进行\n关羽、吕蒙在世，孙权独立\n发给孙权：AI 袭取荆州（糜芳、士仁好感低于 10 献城），玩家可坐观\n开战成功才通报「白衣渡江」"
 hd_hev_218_13_name:0 "大都督吕蒙（吕蒙袭荆州）"
 hd_hev_218_13_tt:0 "#high 大都督吕蒙（吕蒙袭荆州）#!\n219.10.1 起，白衣渡江尚未发生\n入口一：汉中之战已结束而刘备没得汉中；入口二：刘备得汉中但襄樊已结束或到 220.6 仍未打\n关羽持荆州、吕蒙在世、孙权独立\n发给孙权：AI 拜吕蒙为大都督攻刘备，玩家可维持孙刘之好（一年后再问）"
 hd_hev_218_14_name:0 "败走麦城（关羽之死）"
 hd_hev_218_14_tt:0 "#high 败走麦城（关羽之死）#!\n白衣渡江之战孙权胜，或关羽被孙权一方俘虏\n关羽、孙权在世\n发给孙权：AI 斩关羽（通报「关羽之死」），玩家可囚而不杀"
 hd_hev_218_15_name:0 "哀悼关羽"
 hd_hev_218_15_tt:0 "#high 哀悼关羽#!\n关羽死亡（任何死因）时曹操在世\n10 天后发给曹操：以诸侯之礼葬之，得威望\n未开颅成功则头疾恶化"
 hd_hev_218_16_name:0 "开颅之议"
 hd_hev_218_16_tt:0 "#high 开颅之议#!\n曹操头疾已恶化、仍在世\n华佗在世未下狱\n发给曹操：AI 斩华佗；玩家可开颅（5% 痊愈、95% 身死）或遣华佗离去"
 hd_hev_218_17_name:0 "魏王嗣位"
 hd_hev_218_17_tt:0 "#high 魏王嗣位#!\n曹操死后第 3 天（任何死因，不强制 220 年）\n曹丕在世\n曹操的头衔与直属封臣交曹丕，曹丕接魏王与权臣；通报「魏王薨」"
 hd_hev_218_18_name:0 "曹丕受禅（受禅之议 / 禅位诏书 / 魏王逼宫）"
 hd_hev_218_18_tt:0 "#high 曹丕受禅（受禅之议 / 禅位诏书 / 魏王逼宫）#!\n魏王嗣位满 240 天\n曹丕在世、是权臣、不在战争中\n都是 AI 直接受禅；玩家曹丕可暂缓，玩家献帝可拒绝（拒两次后曹丕强行夺位、献帝下狱）\n曹丕得传国玉玺，国号“魏”；通报「汉魏禅代」"
 hd_hev_218_19_name:0 "刘备称帝（汉帝即位）"
 hd_hev_218_19_tt:0 "#high 刘备称帝（汉帝即位）#!\n天子已非献帝一族（受禅后）\n刘备在世、独立并持汉中王号\n发给刘备：AI 称帝并筹办践祚大典，大典完成改国号“汉”（两年未办成则直接称帝）\n玩家可暂缓，一年后再问"
 hd_hev_218_20_name:0 "张飞遇害"
 hd_hev_218_20_tt:0 "#high 张飞遇害#!\n221.6.1 起，刘备已定称帝\n张飞是 AI，张飞、张达在世\n发给蜀主：张达杀张飞投吴；通报「张飞遇害」"
 hd_hev_218_21_name:0 "夷陵之战"
 hd_hev_218_21_tt:0 "#high 夷陵之战#!\n221.7.1 起；关羽死于吴，刘备已定称帝且仍是蜀主\n孙权在世并持有荆州某郡\n发给刘备：AI 东征（主攻南郡），玩家可听谏（一年后再问）\n通报「夷陵之战」"
 hd_hev_218_22_name:0 "火烧连营"
 hd_hev_218_22_tt:0 "#high 火烧连营#!\n222.6.1 起，夷陵之战进行中\n刘备在攻方军中、陆逊在守方军中\n发给刘备：蜀军受挫 1 年，陆逊得威望；冯习、张南、傅肜、程畿若在军中则阵亡"
 hd_hev_218_23_name:0 "白帝托孤"
 hd_hev_218_23_tt:0 "#high 白帝托孤#!\n刘备死后第 3 天\n新蜀主（汉中王号持有者）在世且不是诸葛亮；诸葛亮在世、未下狱、身在益州\n发给新蜀主：诸葛亮任首辅，“受遗诏辅政”10 年"
 hd_hev_218_24_name:0 "南中叛乱"
 hd_hev_218_24_tt:0 "#high 南中叛乱#!\n刘备死后满 2 个月\n雍闿、高定、朱褒至少一人是 AI 蜀臣\n三人起兵独立，孟获附雍闿；发给蜀主，通报「南中叛乱」"
 hd_hev_218_25_name:0 "丞相南征"
 hd_hev_218_25_tt:0 "#high 丞相南征#!\n南中叛乱满 1 年，叛首仍有人独立\n诸葛亮受遗诏辅政\n发给蜀主：AI 对每个叛首各开一战，玩家可来年再议\n通报「丞相南征」"
 hd_hev_218_26_name:0 "七擒孟获"
 hd_hev_218_26_tt:0 "#high 七擒孟获#!\n南征已准、叛首都不再独立\n孟获、蜀主在世\n孟获归附蜀主，对诸葛亮好感 +50；通报「七擒孟获」"
 hd_hev_218_27_name:0 "出师表"
 hd_hev_218_27_tt:0 "#high 出师表#!\n刘备死后满 3 年，诸葛亮辅政，南中已平\n天水守方是独立于蜀的势力\n发给蜀主：AI 北伐（天水、南安、安定），玩家可来年再议\n通报「出师北伐」"
 hd_hev_218_28_name:0 "姜维归降"
 hd_hev_218_28_tt:0 "#high 姜维归降#!\n北伐进行中\n姜维在世、无地、未下狱、不是蜀主廷臣\n姜维入蜀主宫廷"
 hd_hev_218_29_name:0 "失街亭"
 hd_hev_218_29_tt:0 "#high 失街亭#!\n北伐开战满 2 个月，仍在进行\n马谡在世且在蜀军中\n发给蜀主：蜀军受挫 1 年；AI 多半挥泪斩马谡，也可免死夺职\n通报「失街亭」"
 hd_hev_218_30_name:0 "孙权称帝（吴帝即位）"
 hd_hev_218_30_tt:0 "#high 孙权称帝（吴帝即位）#!\n天子已非刘氏；蜀汉大典完成满 2 年，或蜀汉未称帝而已到 229.5.23\n孙权在世、独立，主头衔为吴王号，刘备一方没有正在筹办的大典\n发给孙权：AI 称帝并办践祚大典，完成改国号“吴”；玩家可暂缓"
 # 汉代风味内容（2026-10-25）手工加行；生成器 build_data.py 未同步，勿直接重跑
 hd_hev_218_31_name:0 "肉刑之议"
 hd_hev_218_31_tt:0 "#high 肉刑之议#!\n218.6.1 至 219.12.31\n曹操在世\n曹操：复肉刑（陈群）/ 寝之（王朗）"
 hd_hev_218_32_name:0 "终制（曹丕薄葬）"
 hd_hev_218_32_tt:0 "#high 终制（曹丕薄葬）#!\n曹丕受禅后两年弹出，230.1.1 截止\n曹丕在世\n曹丕作《终制》，日后葬礼薄葬选项多一句「遵先帝终制」"
 hd_hev_253_01_name:0 "姜维出洮西（出石营）"
 hd_hev_253_01_tt:0 "#high 姜维出洮西（出石营）#!\n253 开局当天（大厅结束后）\n姜维在世、持梁州、不在战中，洮西郡守是曹芳治下的封臣\n姜维以开局北伐理由攻洮西郡，全天下收到通报\n218/263 开局不触发"
 hd_hev_253_02_name:0 "诸葛恪围新城"
 hd_hev_253_02_tt:0 "#high 诸葛恪围新城#!\n253 开局当天\n诸葛恪、毌丘俭都在世有地，合肥由毌丘俭或其上级持有\n吴国诸葛恪攻毌丘俭、目标合肥，另给二万兵\n仅 253 开局"
 hd_hev_253_03_name:0 "孙峻设宴（诸葛恪被杀）"
 hd_hev_253_03_tt:0 "#high 孙峻设宴（诸葛恪被杀）#!\n253.10.1 起，新城之战已结束\n诸葛恪在世、不在战中，孙峻在世、未被囚\n事件发给诸葛恪：电脑赴宴被杀，玩家可以称疾不去\n218 接力还要求诸葛恪任吴帝首辅、吴帝是电脑"
 hd_hev_253_04_name:0 "废立之议（司马师废帝）"
 hd_hev_253_04_tt:0 "#high 废立之议（司马师废帝）#!\n254.10.1 起\n司马师任权臣，曹芳在位，曹髦在世且在魏境内\n事件给司马师（若司马师是电脑、曹芳是玩家，则改发曹芳）\n废曹芳、立曹髦，夏侯玄先被处死"
 hd_hev_253_05_name:0 "淮南起兵（毌丘俭、文钦）"
 hd_hev_253_05_tt:0 "#high 淮南起兵（毌丘俭、文钦）#!\n255.2.1 起\n毌丘俭在世有地、是天子治下封臣、不在战中\n事件给毌丘俭：电脑以独立战争起兵（另给一万五千兵），玩家可以隐忍\n218 接力还要求司马氏掌权、毌丘俭直属天子"
 hd_hev_253_06_name:0 "司马师病逝"
 hd_hev_253_06_tt:0 "#high 司马师病逝#!\n255.3.1 起，司马师是电脑、仍任权臣，司马昭在世有地、是天子封臣\n已废帝且淮南之乱已平（或已到 255.12.1）；未废帝时最迟 257.1.1\n218 接力未废帝时，还要求司马师已任权臣约 12 次心跳\n司马师病逝，全天下收到通报"
 hd_hev_253_07_name:0 "兄终弟及（司马昭继任辅政）"
 hd_hev_253_07_tt:0 "#high 兄终弟及（司马昭继任辅政）#!\n司马师任权臣时死亡（死因不限），3 天后触发\n天子是玩家时问天子是否让司马昭辅政，司马昭是玩家时问他是否接任，都是电脑时直接接任\n司马昭须在世有地、是天子封臣"
 hd_hev_253_08_name:0 "诸葛诞起兵（寿春）"
 hd_hev_253_08_tt:0 "#high 诸葛诞起兵（寿春）#!\n257.6.1 起\n诸葛诞在世有地、是天子治下封臣、不在战中\n事件给诸葛诞：电脑起兵（另给一万五千兵），吴帝是电脑时直接派兵援助\n吴帝是玩家时另弹请援事件\n218 接力还要求司马氏掌权、诸葛诞直属天子"
 hd_hev_253_09_name:0 "南阙之变（司马昭之心／大将军之权）"
 hd_hev_253_09_tt:0 "#high 南阙之变（司马昭之心／大将军之权）#!\n260.6.1 起\n曹髦在位，权臣是司马昭（司马师仍在世时为司马师）\n事件给曹髦：电脑亲自率领宿卫出讨，被成济所弑，改立曹奂；玩家可以隐忍\n权臣是玩家时由他决定弑君还是擒而废之"
 hd_hev_253_10_name:0 "魏伐蜀（灭蜀之议）"
 hd_hev_253_10_tt:0 "#high 魏伐蜀（灭蜀之议）#!\n253 路径：263.9.1–268.1.1，司马师或司马昭任权臣，汉帝独立且不在交战；事件给权臣，玩家天子可以不准；最多发兵 3 次\n263 路径：263 开局后立即发兵，264.1.16 前可再试一次\n魏天子攻汉，钟会、邓艾随军"
 hd_hev_263_01_name:0 "司马昭封晋公（九锡之命）"
 hd_hev_263_01_tt:0 "#high 司马昭封晋公（九锡之命）#!\n263.11.18 起（伐蜀成败不影响）\n司马昭在世有地、任权臣，曹奂在位\n玩家司马昭可以推辞，玩家天子可以不封\n按实封公新建“晋国”（并州本部七郡）授司马昭；进王时再建晋王国套住公国，禅代后并入天子直辖"
 hd_hev_263_02_name:0 "舆榇出降（蜀汉亡）"
 hd_hev_263_02_tt:0 "#high 舆榇出降（蜀汉亡）#!\n伐蜀之战打满约 60 天后攻方战分达到 50，或占领涪、绵竹、雒、成都之一，或已经得胜（263 开局 264.1.16 兜底，接力局打满约 120 天兜底）\n汉帝是电脑时直接出降，玩家可以背城一战\n姜维降钟会，益州交给邓艾"
 hd_hev_263_03_name:0 "邓艾被收"
 hd_hev_263_03_tt:0 "#high 邓艾被收#!\n出降之后约 30 天\n邓艾仍持益州，钟会在世有地，两人都是天子封臣\n依次询问玩家钟会、司马昭、邓艾，都同意后执行；截止 264.6.1（接力局为出降后 150 天）\n邓艾、邓忠被钟会囚禁"
 hd_hev_263_04_name:0 "钟会之乱（据蜀自立）"
 hd_hev_263_04_tt:0 "#high 钟会之乱（据蜀自立）#!\n邓艾被收后约 30 天\n钟会持益州、是封臣、不在战中；截止 264.9.1（接力局为出降后 240 天）\n电脑钟会起兵即败，与姜维等一同被杀\n玩家钟会可以真正起兵，玩家姜维可以趁乱复汉"
 hd_hev_263_05_name:0 "进爵为王（司马昭进爵晋王）"
 hd_hev_263_05_tt:0 "#high 进爵为王（司马昭进爵晋王）#!\n264.5.2 起，已封晋公\n司马昭在世、仍持晋（并州）\n玩家司马昭可以推辞\n称号改为王，魏改元咸熙"
 hd_hev_263_06_name:0 "晋王薨（司马炎嗣位）"
 hd_hev_263_06_tt:0 "#high 晋王薨（司马炎嗣位）#!\n电脑司马昭在 265.9.6 病逝（接力局还要等伐蜀了结，最迟 269.1.1）；司马昭因其他原因死亡也会触发\n死后 3 天由司马炎接任晋王与权臣\n天子是玩家时问天子，司马炎是玩家时问他"
 hd_hev_263_07_name:0 "魏晋禅代（受禅）"
 hd_hev_263_07_tt:0 "#high 魏晋禅代（受禅）#!\n266.2.8 起（接力局还要等伐蜀了结，最迟 269.6.1）\n曹奂在位，权臣是司马炎（或在世的玩家司马昭）\n玩家受禅者可以推辞，玩家曹奂可以不禅\n国号改为晋，改元泰始"
 # 两晋十六国统一史实线（304–421）：F-1 手工维护（2026-10-27）；英文见 localization/english/zz_tr_hd_hev_l_english.yml，键一一对应
 # 西晋末·八王之乱与永嘉之乱（304–317；304 开局适用）
 hd_hev_j16_xiqian_name:0 "张方挟驾西迁"
 hd_hev_j16_xiqian_tt:0 "#high 张方挟驾西迁#!\n窗口 304.11.25 – 305.3.1\n河间王颙是权臣（或持京兆郡），张方在颙宫廷，京城仍在洛阳，天子在世\n电脑颙直接西迁长安；玩家颙可留驾洛阳"
 hd_hev_j16_yingjia_name:0 "东海王传檄迎驾"
 hd_hev_j16_yingjia_tt:0 "#high 东海王传檄迎驾#!\n窗口 305.7.1 – 306.6.1\n东海王越在世、独立（朝贡国也算）、未与天子交战；京城不在洛阳，或颙是权臣\n电脑越起兵（天子为名义守方，胜者只换权臣、不夺地）；玩家越可观望\n开战时点亮"
 hd_hev_j16_gongshi_name:0 "公师藩、汲桑起兵"
 hd_hev_j16_gongshi_tt:0 "#high 公师藩、汲桑起兵#!\n窗口 305.8.1 – 306.12.1\n成都王颖已失邺或无地；石勒、公师藩、汲桑在世\n电脑石勒投公师藩；玩家石勒可独行"
 hd_hev_j16_zongshe_name:0 "猗卢总摄三部"
 hd_hev_j16_zongshe_tt:0 "#high 猗卢总摄三部#!\n窗口 305.8.1 – 308.12.31\n猗㐌、禄官已不在世，猗卢在世、未被囚\n拓跋三郡中落在其他拓跋族电脑手里的，每跳至多一郡转给猗卢"
 hd_hev_j16_xuchang_name:0 "许昌之战"
 hd_hev_j16_xuchang_tt:0 "#high 许昌之战#!\n窗口 305.10.1 – 306.3.1\n刘乔、范阳王虓在世，虓持颍川郡，迎驾之战已开打\n电脑刘乔附颙攻虓；玩家刘乔可中立"
 hd_hev_j16_zhangfang_name:0 "颙杀张方求和"
 hd_hev_j16_zhangfang_tt:0 "#high 颙杀张方求和#!\n窗口 306.1.1 – 306.6.1\n张方在颙宫廷，迎驾之战已打满 90 天\n电脑颙杀张方求和；玩家颙可不杀（得张方兵 8000）"
 hd_hev_j16_wangmi_name:0 "王弥起事、投汉"
 hd_hev_j16_wangmi_tt:0 "#high 王弥起事、投汉#!\n窗口 306.3.1 – 308.6.1\n王弥在世、无地；汉主（并州王国的独立匈奴刘氏）存在\n电脑王弥入汉主宫廷，汉主得 5000 兵；玩家王弥可留晋"
 hd_hev_j16_huanluo_name:0 "迎驾还洛"
 hd_hev_j16_huanluo_tt:0 "#high 迎驾还洛#!\n窗口 306.4.1 – 307.6.1\n越尚非权臣；迎驾之战越方胜，或长安在越一方，或颙已死或失权\n越成为权臣、京城迁回洛阳；玩家越可奉驾于长安"
 hd_hev_j16_lixiong_emperor_name:0 "李雄称帝"
 hd_hev_j16_lixiong_emperor_tt:0 "#high 李雄称帝#!\n窗口 306.6.1 – 307.6.1\n李雄独立、未被囚、持蜀郡\n电脑直接称帝（国号成），范长生入其宫廷任宰相；玩家可仍称王"
 hd_hev_j16_yingsi_name:0 "成都王颖之死"
 hd_hev_j16_yingsi_tt:0 "#high 成都王颖之死#!\n窗口 306.9.1 – 306.12.31\n颖无地或被囚，刘舆在世\n电脑颖被刘舆矫诏赐死；玩家颖可引颈受死或亡命投石勒"
 hd_hev_j16_huaidi_name:0 "惠帝崩、怀帝立"
 hd_hev_j16_huaidi_tt:0 "#high 惠帝崩、怀帝立#!\n窗口 306.11.1 – 308.4.1\n电脑惠帝重立司马炽为储；惠帝崩后炽即位\n炽持天下、改元永嘉时点亮（颙、覃之死在同一节点处理）"
 hd_hev_j16_qinwang_name:0 "张轨遣北宫纯勤王"
 hd_hev_j16_qinwang_tt:0 "#high 张轨遣北宫纯勤王#!\n窗口 307.1.1 – 309.12.31，以及 311.1.1 – 311.6.1（永嘉入援）\n张轨持凉州王国、是天子臣属；天子在某场战争里是主防守方\n电脑张轨输金 100、加入天子守方，北宫纯所部 3000；玩家张轨可自守"
 hd_hev_j16_poye_name:0 "汲桑破邺杀腾"
 hd_hev_j16_poye_tt:0 "#high 汲桑破邺杀腾#!\n窗口 307.3.1 – 307.12.31\n东燕王腾持魏郡或冀州县；汲桑有雇主且雇主有地\n雇主攻邺（8000 兵），胜则腾被杀、邺宫焚毁\n开战时点亮"
 hd_hev_j16_zhuisang_name:0 "苟晞破汲桑"
 hd_hev_j16_zhuisang_tt:0 "#high 苟晞破汲桑#!\n窗口 307.7.1 – 308.3.1\n破邺攻方胜；苟晞在越宫廷或有地，汲桑在世\n电脑越遣苟晞讨之（1.2 万），胜则汲桑被杀、东郡授苟晞；玩家越可不遣\n开战时点亮"
 hd_hev_304_01_name:0 "出镇建邺"
 hd_hev_304_01_tt:0 "#high 出镇建邺#!\n窗口 307.9.1 – 312.1.1\n天子是河内司马氏；司马睿在世、是臣属、不是天子；丹阳郡在天子一系\n天子收事件（电脑照史实），准奏后司马睿领丹阳、移镇建邺；选史实项时点亮"
 hd_hev_304_02_name:0 "往依刘渊（石勒归汉）"
 hd_hev_304_02_tt:0 "#high 往依刘渊（石勒归汉）#!\n窗口 307.10.1 – 309.1.1\n大陵之战已开打或已了结；汉主（并州王国的独立匈奴刘氏）在位；石勒成年、未被囚、不在汉境\n石勒收事件；汉主是玩家时由汉主决定收不收；选史实项时点亮"
 hd_hev_j16_zhangbin_name:0 "张宾归石勒（君子营）"
 hd_hev_j16_zhangbin_tt:0 "#high 张宾归石勒（君子营）#!\n窗口 308.1.1 – 311.12.31\n石勒有地，张宾在世\n张宾入石勒宫廷任宰相，石勒得「君子营」30 年；无分支"
 hd_hev_304_03_name:0 "即皇帝位（刘渊称帝）"
 hd_hev_304_03_tt:0 "#high 即皇帝位（刘渊称帝）#!\n窗口 308.11.1 – 310.8.1\n刘渊独立、未被囚、有主头衔\n刘渊收事件，称帝后改元永凤并迁都平阳；可不称；选史实项时点亮"
 hd_hev_j16_duanbu_name:0 "段部内争（末波自立）"
 hd_hev_j16_duanbu_tt:0 "#high 段部内争（末波自立）#!\n窗口 309.1.1 – 325.12.31\n段部首领依次更替：务勿尘 → 疾陆眷 → 涉复辰 → 末波，死亡由卒年表执行\n节点逐步立储；末波袭杀涉复辰自立时点亮"
 hd_hev_j16_qingjun_name:0 "越入京清君侧"
 hd_hev_j16_qingjun_tt:0 "#high 越入京清君侧#!\n窗口 309.3.1 – 309.12.31\n越是权臣，怀帝持天下，缪播在世\n电脑越诛缪播、缪胤，得「专横」5 年；玩家越可容之"
 hd_hev_j16_daigong_name:0 "拓跋猗卢封代公"
 hd_hev_j16_daigong_tt:0 "#high 拓跋猗卢封代公#!\n窗口 310.1.1 – 315.6.1\n猗卢独立、未被囚、持拓跋诸郡之一\n建国号代、称公；刘琨（电脑）与之结盟"
 hd_hev_j16_qu_hanzhong_name:0 "罗尚死、成取汉中"
 hd_hev_j16_qu_hanzhong_tt:0 "#high 罗尚死、成取汉中#!\n窗口 310.7.20 – 315.12.31\n罗尚已死，李雄在世、有地\n电脑李雄得巴郡、汉中郡宣称；玩家可不取"
 hd_hev_j16_chutun_name:0 "越出屯项、密诏苟晞"
 hd_hev_j16_chutun_tt:0 "#high 越出屯项、密诏苟晞#!\n窗口 310.11.1 – 311.4.23\n越是权臣，石勒、苟晞有地\n越移驻陈县；电脑天子给苟晞衣带诏；无分支"
 hd_hev_j16_ningping_name:0 "宁平城之战"
 hd_hev_j16_ningping_tt:0 "#high 宁平城之战#!\n窗口 311.4.23 – 311.7.1\n越已死，石勒有地、未被囚，王衍在世\n电脑石勒截击：威望 +1000、得 5000 兵，王衍、司马毗被杀；玩家石勒可放过"
 hd_hev_304_04_name:0 "围攻洛阳（永嘉之乱）"
 hd_hev_304_04_tt:0 "#high 围攻洛阳（永嘉之乱）#!\n窗口 311.5.1 – 313.1.1\n刘聪立储已了结；汉主未被囚，与天子一系接壤或已据河东、平阳、河内、弘农、荥阳、汲郡之一；洛阳仍归天子\n电脑汉主直接出兵（玩家可不出），以河南、嵩山两郡开战；汉主得洛阳且天子是电脑时天子被俘，并开启衣冠南渡；开战时点亮\n另：311–322 年每年查一次，洛阳落入胡人政权之手也会开启衣冠南渡"
 hd_hev_j16_daiwang_name:0 "拓跋猗卢进爵代王"
 hd_hev_j16_daiwang_tt:0 "#high 拓跋猗卢进爵代王#!\n315.3.1 起，止于 315.6.1\n已封代公，猗卢仍独立有地\n称谓改为王"
 hd_hev_j16_gebei_name:0 "葛陂退兵、北据襄国"
 hd_hev_j16_gebei_tt:0 "#high 葛陂退兵、北据襄国#!\n窗口 312.2.1 – 312.12.31\n石勒有地，不持冀州县\n电脑北据襄国（襄国郡宣称、5000 兵）；玩家可南下建邺（只得 5000 兵）"
 hd_hev_j16_mindi_name:0 "愍帝长安即位"
 hd_hev_j16_mindi_tt:0 "#high 愍帝长安即位#!\n窗口 312.9.1 – 313.8.1\n怀帝已死或被胡人囚禁，司马邺在世，长安之主非胡\n司马邺入长安之主宫廷并被立为储；长安已失则改投司马睿、本行不亮"
 hd_hev_j16_zuti_name:0 "祖逖北伐"
 hd_hev_j16_zuti_tt:0 "#high 祖逖北伐#!\n窗口 313.8.1 – 321.11.22\n祖逖是晋臣，豫州有胡人所据之县\n一次性给 2000 兵和一个豫州胡占县的宣称"
 hd_hev_j16_jicheng_name:0 "袭蓟擒王浚"
 hd_hev_j16_jicheng_tt:0 "#high 袭蓟擒王浚#!\n窗口 314.1.1 – 314.6.1\n王浚持幽州县，石勒持冀州县，两国接壤\n电脑石勒诈降袭蓟（8000 兵），王浚「轻信」；玩家可不袭\n开战时点亮"
 hd_hev_j16_liuyi_fei_name:0 "刘乂之废"
 hd_hev_j16_liuyi_fei_tt:0 "#high 刘乂之废#!\n窗口 314.1.1 – 317.5.29\n汉主是刘聪，刘乂、刘粲在世\n电脑刘聪改立刘粲为储；刘乂 317 年由卒年表处死"
 hd_hev_j16_zhangshi_heir_name:0 "张轨卒、张寔嗣"
 hd_hev_j16_zhangshi_heir_tt:0 "#high 张轨卒、张寔嗣#!\n窗口 314.3.1 – 314.6.1\n张轨、张寔在世\n张轨立张寔为储（张轨 314.6.1 卒）"
 hd_hev_j16_liuxiu_name:0 "六修之乱"
 hd_hev_j16_liuxiu_tt:0 "#high 六修之乱#!\n窗口 316.3.1 – 316.6.30\n猗卢在世，死亡由卒年表执行\n猗卢立普根、普根立郁律；猗卢在窗口内身死时点亮"
 hd_hev_j16_changan316_name:0 "刘曜破长安、西晋亡"
 hd_hev_j16_changan316_tt:0 "#high 刘曜破长安、西晋亡#!\n窗口 316.6.1 – 317.3.1\n愍帝持天下、长安在其一方；刘曜有地、属匈奴刘氏，汉持平阳或河东\n刘曜出兵（2 万），目标京兆郡；玩家刘曜可不出\n开战时点亮"
 hd_hev_j16_bingzhou316_name:0 "取并州、刘琨奔段"
 hd_hev_j16_bingzhou316_tt:0 "#high 取并州、刘琨奔段#!\n窗口 316.10.1 – 317.6.1\n刘琨持并州县，石勒有地，两国接壤\n石勒出兵（8000）攻刘琨首府所在郡；胜则刘琨奔段匹磾\n开战时点亮"
 # 东晋初·二赵相争（317–346；304 开局适用）
 hd_hev_j16_tuyuhun3_name:0 "吐谷浑三代"
 hd_hev_j16_tuyuhun3_tt:0 "#high 吐谷浑三代#!\n窗口 316.11.2 – 329.12.31\n吐谷浑 → 吐延 → 叶延，死亡由卒年表执行\n节点逐代立储；吐延已死、叶延有地（嗣位）时点亮"
 hd_hev_j16_daitong_name:0 "代国继统至什翼犍"
 hd_hev_j16_daitong_tt:0 "#high 代国继统至什翼犍#!\n窗口 317.1.1 – 338.12.31\n郁律 → 贺傉 → 纥那 → 翳槐 → 什翼犍，死亡由卒年表执行\n节点逐代立储，什翼犍即代王、改元建国"
 hd_hev_j16_jinwang_name:0 "司马睿称晋王"
 hd_hev_j16_jinwang_tt:0 "#high 司马睿称晋王#!\n窗口 317.3.1 – 317.12.31\n天子位上没有自由的晋帝（无人、非司马氏，或被胡人囚禁），司马睿在世\n司马睿称晋王"
 hd_hev_j16_jinjian_name:0 "东晋建立（司马睿称帝）"
 hd_hev_j16_jinjian_tt:0 "#high 东晋建立（司马睿称帝）#!\n窗口 318.2.7 – 318.12.31\n晋王已立；被囚天子已死，司马睿在世、未被囚\n天下头衔已在睿手里则不动，无人或在胡人手里则转给睿；无分支"
 hd_hev_j16_baowang_name:0 "司马保称晋王于上邽"
 hd_hev_j16_baowang_tt:0 "#high 司马保称晋王于上邽#!\n窗口 318.3.1 – 320.6.1\n愍帝已死，司马保独立、持天水郡或其中一县\n主头衔改称晋、称王"
 hd_hev_j16_jinzhun_name:0 "靳准之乱"
 hd_hev_j16_jinzhun_tt:0 "#high 靳准之乱#!\n窗口 318.8.31 – 318.11.1\n刘聪已死；靳准在汉主宫廷或为其封臣\n靳准夺汉主之国（只转头衔与封臣，不当场杀人），称汉天王；刘粲由卒年表处死；无分支"
 hd_hev_j16_liuyao_ji_name:0 "刘曜即位"
 hd_hev_j16_liuyao_ji_tt:0 "#high 刘曜即位#!\n窗口 318.10.1 – 319.3.1\n靳准之乱已发生（或汉主已非匈奴刘氏），刘曜有地、持司隶县\n刘曜独立，得 1.5 万兵与并州王国宣称；石勒得平阳郡宣称"
 hd_hev_j16_murong_jicheng_name:0 "棘城破三国联军"
 hd_hev_j16_murong_jicheng_tt:0 "#high 棘城破三国联军#!\n窗口 319.1.1 – 319.12.31\n慕容廆（电脑）持昌黎，正作为守方作战\n廆首府得 8000 兵；廆是玩家则跳过"
 hd_hev_j16_qianzhao_name:0 "迁长安、改国号赵（前赵）"
 hd_hev_j16_qianzhao_tt:0 "#high 迁长安、改国号赵（前赵）#!\n窗口 319.6.1 – 320.6.1\n刘曜独立、持京兆郡或长安县\n国号改赵、称帝，迁都长安，立刘熙为储；玩家可仍称汉"
 hd_hev_j16_shile_wang_name:0 "石勒称赵王（后赵）"
 hd_hev_j16_shile_wang_tt:0 "#high 石勒称赵王（后赵）#!\n窗口 319.11.1 – 320.12.31\n汉已易主；石勒持襄国郡，或国内冀州县 12 个以上\n石勒独立、国号赵、称王；玩家可仍奉汉"
 hd_hev_j16_xizheng_name:0 "刘曜西征（张茂称藩）"
 hd_hev_j16_xizheng_tt:0 "#high 刘曜西征（张茂称藩）#!\n窗口 320.1.1 – 324.1.1\n刘曜、张茂都独立有地，张茂未向刘曜纳贡\n电脑张茂向刘曜纳贡称藩；玩家可拒"
 hd_hev_j16_duanpidi_name:0 "灭段匹磾、邵续"
 hd_hev_j16_duanpidi_tt:0 "#high 灭段匹磾、邵续#!\n窗口 320.1.1 – 321.12.31\n段匹磾有地，与石勒接壤\n石勒出兵（石虎 8000）攻匹磾首府所在郡；玩家可不出\n开战时点亮"
 hd_hev_j16_zhangmao_heir_name:0 "张寔被杀、张茂立"
 hd_hev_j16_zhangmao_heir_tt:0 "#high 张寔被杀、张茂立#!\n窗口 320.4.1 – 320.7.1\n张寔、张茂在世\n张寔改立弟张茂为储（张寔 320.7.15 为阎沙所杀）"
 hd_hev_j16_wangdun1_name:0 "王敦之乱（一）"
 hd_hev_j16_wangdun1_tt:0 "#high 王敦之乱（一）#!\n窗口 322.1.1 – 322.7.1\n王敦是元帝直属封臣、持荆州或扬州县，刘隗（或刁协）在世\n电脑王敦以清君侧起兵（1 万兵）；玩家可隐忍\n开战时点亮"
 hd_hev_j16_mingdi_name:0 "元帝崩、明帝立"
 hd_hev_j16_mingdi_tt:0 "#high 元帝崩、明帝立#!\n窗口 322.11.1 – 323.1.3\n元帝持天下，司马绍在世\n电脑元帝立绍为储；元帝 323.1.3 病逝"
 hd_hev_j16_liangwang_name:0 "张骏嗣位、假凉王"
 hd_hev_j16_liangwang_tt:0 "#high 张骏嗣位、假凉王#!\n窗口 324.3.1 – 346.6.1\n张茂立张骏为储（324）；345 年起张骏持凉州、未被囚\n张骏称假凉王时点亮"
 hd_hev_j16_wangdun2_name:0 "王敦之乱（二）"
 hd_hev_j16_wangdun2_tt:0 "#high 王敦之乱（二）#!\n窗口 324.5.1 – 324.10.1\n明帝持天下，王敦有地、在明帝一方\n电脑明帝讨伐（1 万兵）：王敦先解辅政、举兵独立；玩家可忍\n开战时点亮"
 hd_hev_j16_yuliang_name:0 "庾氏秉政"
 hd_hev_j16_yuliang_tt:0 "#high 庾氏秉政#!\n窗口 325.8.18 – 326.6.1\n明帝立司马衍为储；成帝即位，庾亮在世\n庾亮授尚书令；无分支"
 hd_hev_j16_sujun_name:0 "苏峻、祖约之乱"
 hd_hev_j16_sujun_tt:0 "#high 苏峻、祖约之乱#!\n窗口 327.10.1 – 329.3.1\n苏峻有地、在晋，庾亮在世\n电脑苏峻举兵攻建康（8000），祖约同叛，陶侃为盟主；玩家可隐忍\n开战时点亮"
 hd_hev_j16_luoyang328_name:0 "洛阳之战（刘曜被擒）"
 hd_hev_j16_luoyang328_tt:0 "#high 洛阳之战（刘曜被擒）#!\n窗口 328.7.1 – 329.2.1\n刘曜、石勒都独立有地、两国接壤\n石勒亲救洛阳（1.5 万对 1 万），胜则刘曜被俘；玩家可不出\n开战时点亮"
 hd_hev_j16_shanggui329_name:0 "前赵亡"
 hd_hev_j16_shanggui329_tt:0 "#high 前赵亡#!\n窗口 329.1.1 – 329.10.1\n刘曜已死或被囚，刘熙或刘胤有地，石虎有地\n石虎攻天水郡（1.5 万兵与宣称）\n开战时点亮"
 hd_hev_j16_shile_emperor_name:0 "石勒称帝"
 hd_hev_j16_shile_emperor_tt:0 "#high 石勒称帝#!\n窗口 330.2.1 – 330.12.31\n前赵已亡（或石勒持两个以上王国），石勒独立\n称帝（玩家改称天王也算），改元建平，立石弘为储"
 hd_hev_j16_murongren_name:0 "慕容仁之乱"
 hd_hev_j16_murongren_tt:0 "#high 慕容仁之乱#!\n窗口 333.4.13 – 336.2.17\n慕容廆立皝为储；廆卒后慕容仁持辽东郡县、尚非独立\n慕容仁起兵时点亮；之后皝与仁交战时皝得 8000 兵（踏冰渡海）"
 hd_hev_j16_shihu_zhuan_name:0 "石虎专权、石生起兵"
 hd_hev_j16_shihu_zhuan_tt:0 "#high 石虎专权、石生起兵#!\n窗口 333.8.17 – 334.3.1\n石勒已死，石弘独立，石虎在弘国内有地\n石虎得「专权」5 年并任宰相；石生得 5000 兵与宣称；无分支"
 hd_hev_j16_xidiqiang_name:0 "石虎徙氐羌"
 hd_hev_j16_xidiqiang_tt:0 "#high 石虎徙氐羌#!\n窗口 333.10.1 – 335.12.31\n石虎独立掌国，苻洪、姚弋仲至少一人在世\n二人（电脑）改投石虎为封臣，无地者入其宫廷"
 hd_hev_j16_jingzhen_name:0 "荆州镇守更替（陶侃 → 庾亮 → 庾翼）"
 hd_hev_j16_jingzhen_tt:0 "#high 荆州镇守更替（陶侃 → 庾亮 → 庾翼）#!\n第一跳 334.6.1 – 340.2.1，第二跳 340.1.1 – 345.7.1\n前任已死，后任在晋天子一方\n江陵所在郡交后任（电脑天子直接改授，玩家天子可自留）；第一跳了结时点亮"
 hd_hev_j16_liqi_name:0 "李期夺位"
 hd_hev_j16_liqi_tt:0 "#high 李期夺位#!\n窗口 334.6.1 – 335.3.1\n李雄立李班为储；李班被杀后成主不是李期\n李期夺位；李班之死由卒年表执行"
 hd_hev_j16_shihu_fei_name:0 "石虎废弘、居摄赵天王"
 hd_hev_j16_shihu_fei_tt:0 "#high 石虎废弘、居摄赵天王#!\n窗口 334.11.1 – 335.6.1\n石虎专权已发生（或实力过半），石弘独立有地\n石虎独立并接收弘的全部头衔，称天王、改元建武，迁都邺；无分支"
 hd_hev_j16_shisui_name:0 "石邃之死、立石宣"
 hd_hev_j16_shisui_tt:0 "#high 石邃之死、立石宣#!\n窗口 337.8.1 – 337.10.1\n石虎有地，石邃、石宣在世\n电脑石虎改立石宣为储；石邃 337.9 由卒年表处死"
 hd_hev_j16_yanwang_name:0 "慕容皝称燕王"
 hd_hev_j16_yanwang_tt:0 "#high 慕容皝称燕王#!\n窗口 337.10.1 – 338.6.1\n慕容皝独立、未被囚、持昌黎\n国号燕、称王；玩家可不称"
 hd_hev_j16_duanliao_name:0 "段辽之亡（赵燕夹击）"
 hd_hev_j16_duanliao_tt:0 "#high 段辽之亡（赵燕夹击）#!\n窗口 338.1.1 – 339.6.1\n段辽有地，石虎或慕容皝与之接壤\n攻方出兵（赵 2 万、燕 8000）攻段辽首府所在郡；玩家攻方可不出\n开战时点亮"
 hd_hev_j16_lishou_name:0 "李寿废期、改国号汉"
 hd_hev_j16_lishou_tt:0 "#high 李寿废期、改国号汉#!\n窗口 338.4.1 – 338.12.31\n李期独立、是电脑；李寿成年、持汉中郡县或涪城\n电脑李寿夺位，国号汉、称帝"
 hd_hev_j16_chengkang_name:0 "成帝、康帝两次继统"
 hd_hev_j16_chengkang_tt:0 "#high 成帝、康帝两次继统#!\n窗口 342.5.1 – 345.3.1\n成帝立司马岳、康帝立司马聃为储\n穆帝即位后点亮，何充授尚书令"
 hd_hev_j16_lishi_heir_name:0 "李势立"
 hd_hev_j16_lishi_heir_tt:0 "#high 李势立#!\n窗口 343.6.1 – 343.8.30\n李寿、李势在世\n李寿立李势为储（李寿 343.8.30 卒）"
 hd_hev_j16_yuwen344_name:0 "灭宇文部"
 hd_hev_j16_yuwen344_tt:0 "#high 灭宇文部#!\n窗口 344.1.1 – 345.6.1\n慕容皝持昌黎、逸豆归持宇文郡，两方未交战\n电脑皝出兵（1.5 万）攻宇文郡；玩家可不出\n开战时点亮"
 hd_hev_j16_huanwen_jing_name:0 "桓温出镇荆州"
 hd_hev_j16_huanwen_jing_tt:0 "#high 桓温出镇荆州#!\n窗口 345.7.1 – 346.12.9\n庾翼已死，桓温在晋天子一方\n江陵所在郡交桓温（规则同上一行）"
 # 后赵崩解与秦燕并起（346–370；304、346 开局适用）
 hd_hev_j16_maqiu_name:0 "麻秋压境"
 hd_hev_j16_maqiu_tt:0 "#high 麻秋压境#!\n窗口 346.5.1 – 347.12.31（346 局首跳即打）\n凉主、赵主都在，金城之主是赵主一系的电脑\n金城之主攻凉主（边境战争，目标枹罕）\n开战时点亮"
 hd_hev_346_01_name:0 "成汉亡（桓温平蜀）"
 hd_hev_346_01_tt:0 "#high 成汉亡（桓温平蜀）#!\n窗口 346.11.1 – 348.1.1\n桓温有地、是晋天子之臣；成汉之主（益州王国的独立巴賨李氏）存在\n桓温伐蜀（益州、巴蜀两路），司马勋、周抚、袁乔随征\n伐蜀战胜时点亮：巴蜀帝号废去，李势送建康"
 hd_hev_j16_yuesi_name:0 "刘越石之子（刘群）"
 hd_hev_j16_yuesi_tt:0 "#high 刘越石之子（刘群）#!\n窗口 346.12.10 – 347.6.1\n刘群在世\n刘群得「越石之子」修正，晋天子对其好感上升"
 hd_hev_j16_lxuan_qiuliu_name:0 "成汉亡后去留（孙盛访安乐公）"
 hd_hev_j16_lxuan_qiuliu_tt:0 "#high 成汉亡后去留（孙盛访安乐公）#!\n伐蜀出结局后 – 348.12.31\n成汉已不独立，刘玄在世\n电脑刘玄留蜀；玩家可随桓温入建康等"
 hd_hev_j16_maqiu2_name:0 "枹罕再战（石宁增兵）"
 hd_hev_j16_maqiu2_tt:0 "#high 枹罕再战（石宁增兵）#!\n窗口 347.3.1 – 347.12.31\n麻秋压境未以赵胜告终，麻秋在世，赵主是石虎\n旧战仍在：攻方追加 1 万兵；否则再开一战（2 万兵）"
 hd_hev_j16_qiuchi_fanchen_name:0 "杨初附晋（两头受封）"
 hd_hev_j16_qiuchi_fanchen_tt:0 "#high 杨初附晋（两头受封）#!\n窗口 347.3.1 – 352.12.31\n杨初独立；灭蜀已了结或石虎已死\n电脑杨初附晋（「晋室藩臣」修正，不改宗主）；玩家可附赵或自守"
 hd_hev_j16_xieai_chan_name:0 "谢艾遭谗"
 hd_hev_j16_xieai_chan_tt:0 "#high 谢艾遭谗#!\n窗口 347.6.1 – 352.12.31\n枹罕再战已了结；谢艾在凉主宫廷，张祚在世\n电脑凉主外放谢艾为酒泉太守；玩家可留谢艾在朝（影响张祚夺位）"
 hd_hev_j16_donggong_name:0 "东宫之变"
 hd_hev_j16_donggong_tt:0 "#high 东宫之变#!\n窗口 348.7.1 – 349.3.1\n赵主是石虎，石宣、石韬在世\n石宣杀石韬，石虎处死石宣、立石世（玩家石虎可另选）"
 hd_hev_j16_shihu_di_name:0 "石虎称帝"
 hd_hev_j16_shihu_di_tt:0 "#high 石虎称帝#!\n窗口 349.1.1 – 349.4.30\n赵主是石虎、尚未称帝\n称帝，改元太宁；玩家可仍称天王"
 hd_hev_j16_licheng_name:0 "李城举兵（石遵废石世）"
 hd_hev_j16_licheng_tt:0 "#high 李城举兵（石遵废石世）#!\n窗口 349.5.27 – 349.9.1\n赵主是石世，石遵在赵境内\n电脑石遵夺位，冉闵掌兵；石世、张豺、刘太后由卒年表处死"
 hd_hev_j16_shichong_name:0 "石冲蓟城之乱"
 hd_hev_j16_shichong_tt:0 "#high 石冲蓟城之乱#!\n窗口 349.6.1 – 349.10.1\n李城举兵已发生，石冲持广阳郡\n电脑石冲独立攻邺（1 万对 1.5 万）；玩家可奉遵\n开战时点亮"
 hd_hev_j16_chupou_name:0 "褚裒北伐（代陂之败）"
 hd_hev_j16_chupou_tt:0 "#high 褚裒北伐（代陂之败）#!\n窗口 349.6.1 – 349.12.1\n石虎已死，褚裒是晋臣、有地、与赵接壤\n褚裒攻彭城或下邳郡（1 万兵）；玩家可不出\n开战时点亮"
 hd_hev_j16_liuqun_zhandui_name:0 "刘群站队（以秦州附魏）"
 hd_hev_j16_liuqun_zhandui_tt:0 "#high 刘群站队（以秦州附魏）#!\n窗口 349.6.1 – 350.12.31\n石虎已死，刘群有地、是石氏封臣\n电脑刘群在冉魏建立后附魏；玩家可附魏、附晋、自守或仍奉赵"
 hd_hev_j16_liang_jiawang_name:0 "张重华称假凉王"
 hd_hev_j16_liang_jiawang_tt:0 "#high 张重华称假凉王#!\n窗口 349.6.1 – 350.12.31\n凉主是张重华、尚未称王，石虎已死\n称王，晋天子好感 −10；玩家可仍称西平公"
 hd_hev_j16_shijian_name:0 "石鉴弑遵"
 hd_hev_j16_shijian_tt:0 "#high 石鉴弑遵#!\n窗口 349.11.1 – 350.1.31\n赵主是石遵，石鉴在赵境内\n电脑石鉴夺位、冉闵「挟主」；玩家石遵不察时开内战"
 hd_hev_j16_shahu_name:0 "杀胡令"
 hd_hev_j16_shahu_tt:0 "#high 杀胡令#!\n窗口 349.12.1 – 350.3.1\n石鉴弑遵已发生，赵主石鉴是电脑，冉闵在赵境内\n冉闵下杀胡令（1.5 万兵），苻洪、姚弋仲各自独立；玩家冉闵可只诛孙伏都"
 hd_hev_j16_sanqin_name:0 "苻洪称三秦王"
 hd_hev_j16_sanqin_tt:0 "#high 苻洪称三秦王#!\n窗口 350.1.1 – 350.6.1\n苻洪独立有地\n国号秦、称王；玩家可降晋"
 hd_hev_346_02_name:0 "冉闵诛石鉴（冉闵称帝）"
 hd_hev_346_02_tt:0 "#high 冉闵诛石鉴（冉闵称帝）#!\n窗口 350.2.1 – 352.1.1\n石虎已死，杀胡令已了结；冉闵在世、成年、未下狱；邺仍属石氏且后赵仍在\n冉闵收事件：诛石鉴、取魏郡称帝，国号魏；选史实项时点亮"
 hd_hev_346_04_name:0 "燕军南下（前燕南下）"
 hd_hev_346_04_tt:0 "#high 燕军南下（前燕南下）#!\n窗口 350.2.1 – 356.1.1\n石虎已死、后赵已乱；平州之主是慕容氏、独立、不在战中；幽州不在他手里\n燕主向幽州之主宣战；开战时点亮"
 hd_hev_j16_shizhi_name:0 "石祗称帝于襄国"
 hd_hev_j16_shizhi_tt:0 "#high 石祗称帝于襄国#!\n窗口 350.3.1 – 350.12.31\n冉闵称帝已发生，襄国郡持有者属石氏\n持有者独立、称帝，国号赵；无主的石氏小君主改投他"
 hd_hev_346_03_name:0 "西入关中（苻健入关）"
 hd_hev_346_03_tt:0 "#high 西入关中（苻健入关）#!\n窗口 350.6.1 – 353.1.1\n苻洪已死，苻健在世；京兆不在晋帝或苻健手里；苻氏有地且关中无主时才立国\n苻健收事件：取关中五郡，称天王，国号秦（条件不全时降级处理）；选史实项时点亮"
 hd_hev_j16_duankan_name:0 "段龛据广固（齐）"
 hd_hev_j16_duankan_tt:0 "#high 段龛据广固（齐）#!\n窗口 350.6.1 – 351.12.31\n段龛有地、尚非独立，后赵已乱\n电脑段龛独立、国号齐、称王；玩家可仍奉赵"
 hd_hev_j16_liuqun_qin_name:0 "刘群降秦（苻健西来）"
 hd_hev_j16_liuqun_qin_tt:0 "#high 刘群降秦（苻健西来）#!\n窗口 350.8.1 – 352.6.1\n苻健已入关，刘群有地、不在秦一方、与秦接壤\n电脑刘群不动（交前秦导演）；只有玩家刘群选降秦或抗秦时点亮"
 hd_hev_j16_xiangguo351_name:0 "襄国之战"
 hd_hev_j16_xiangguo351_tt:0 "#high 襄国之战#!\n窗口 351.1.1 – 351.10.1\n冉魏之主与石祗接壤、未交战\n魏主围襄国，燕主、姚弋仲援赵（石祗得 1.5 万）；魏胜则石祗被杀；玩家魏主可不攻\n开战时点亮"
 hd_hev_j16_liuxian_coup_name:0 "刘显弑石祗"
 hd_hev_j16_liuxian_coup_tt:0 "#high 刘显弑石祗#!\n窗口 351.3.1 – 351.12.31\n襄国之战魏未胜；石祗独立、是电脑，刘显在其宫廷或领内\n刘显夺位，向魏称臣"
 hd_hev_j16_jiandi_name:0 "苻健称帝"
 hd_hev_j16_jiandi_tt:0 "#high 苻健称帝#!\n窗口 352.1.1 – 352.12.31\n秦主是苻健、尚未称帝\n称帝、改元皇始；玩家可仍称天王"
 hd_hev_j16_liuxian_name:0 "刘显亡于冉闵"
 hd_hev_j16_liuxian_tt:0 "#high 刘显亡于冉闵#!\n窗口 352.1.1 – 352.6.1\n刘显弑石祗已发生，刘显有地、与魏接壤\n魏主讨刘显，胜则刘显被杀、襄国归魏；玩家魏主可不讨\n开战时点亮"
 hd_hev_j16_liantai_name:0 "廉台之战"
 hd_hev_j16_liantai_tt:0 "#high 廉台之战#!\n窗口 352.2.1 – 352.12.31\n燕主与魏主接壤、无停战、未交战\n燕遣慕容恪攻中山或常山（1.5 万），胜则冉闵被杀；玩家燕主可不出\n开战时点亮"
 hd_hev_j16_yaoxiang_fujin_name:0 "姚弋仲卒、姚襄南附晋"
 hd_hev_j16_yaoxiang_fujin_tt:0 "#high 姚弋仲卒、姚襄南附晋#!\n窗口 352.3.1 – 352.12.31\n姚弋仲已死，姚襄独立有地\n电脑姚襄「奉晋正朔」、得谯郡宣称；玩家可自守"
 hd_hev_j16_longli_name:0 "凉伐秦（龙黎之败）"
 hd_hev_j16_longli_tt:0 "#high 凉伐秦（龙黎之败）#!\n窗口 352.3.1 – 352.12.31\n秦、凉在天水郡接壤\n电脑凉主五成概率出兵（边境战争）；玩家可不出\n开战时点亮"
 hd_hev_j16_xicheng_name:0 "杨初袭西城"
 hd_hev_j16_xicheng_tt:0 "#high 杨初袭西城#!\n窗口 352.3.1 – 353.6.1\n杨初有地、与秦接壤\n电脑五成概率出兵（边境战争，3000 兵）；玩家可不出\n开战时点亮"
 hd_hev_j16_yinhao_name:0 "殷浩北伐"
 hd_hev_j16_yinhao_tt:0 "#high 殷浩北伐#!\n窗口 352.6.1 – 353.12.31\n殷浩是晋臣、有地、不在战中\n殷浩攻颍川或河南郡（1 万兵），荀羡随征；玩家可不出\n开战时点亮"
 hd_hev_j16_yecheng352_name:0 "燕克邺、冉魏亡"
 hd_hev_j16_yecheng352_tt:0 "#high 燕克邺、冉魏亡#!\n廉台燕胜 30 天后 – 353.6.1\n魏主仍持魏郡，燕主与之接壤\n燕主围邺（玩家魏主可出降）\n开战时点亮"
 hd_hev_j16_yandi_name:0 "慕容儁称帝"
 hd_hev_j16_yandi_tt:0 "#high 慕容儁称帝#!\n窗口 352.11.1 – 353.12.31\n燕主独立，国内冀州、幽州县 12 个以上，尚未称帝\n称帝、改元元玺；玩家可仍称燕王"
 hd_hev_j16_shansang_name:0 "姚襄叛晋（山桑之战）"
 hd_hev_j16_shansang_tt:0 "#high 姚襄叛晋（山桑之战）#!\n窗口 353.9.1 – 354.6.1\n殷浩北伐已开战，姚襄有地\n北伐仍在：电脑姚襄倒戈（8000），殷浩「山桑之败」；北伐已了结则只给河南郡宣称"
 hd_hev_j16_zhangzuo_name:0 "张重华卒、张祚夺位"
 hd_hev_j16_zhangzuo_tt:0 "#high 张重华卒、张祚夺位#!\n窗口 353.9.1 – 355.2.1\n张重华已死，凉主是张耀灵，张祚在凉境内\n张祚夺位（耀灵、谢艾之死交卒年表）；谢艾在朝辅政时跳过"
 hd_hev_j16_yinhao_fei_name:0 "殷浩废为庶人"
 hd_hev_j16_yinhao_fei_tt:0 "#high 殷浩废为庶人#!\n殷浩北伐败后 – 354.6.1\n殷浩在世，天子存在\n天子收回扬州，桓温得「都督中外」；玩家殷浩可抗命"
 hd_hev_j16_zhangzuo_wang_name:0 "张祚称凉王"
 hd_hev_j16_zhangzuo_wang_tt:0 "#high 张祚称凉王#!\n窗口 354.1.1 – 354.12.31\n凉主是张祚\n称王、得「淫虐」10 年，改元和平；玩家可不称"
 hd_hev_j16_huanqin354_name:0 "桓温伐秦（蓝田、白鹿原）"
 hd_hev_j16_huanqin354_tt:0 "#high 桓温伐秦（蓝田、白鹿原）#!\n窗口 354.2.1 – 354.10.1\n桓温有地、不在战中，秦晋接壤\n桓温攻京兆或上洛（1.5 万对 1 万）；玩家可不出\n开战时点亮"
 hd_hev_j16_liangshiwang_name:0 "梁式王之变（杨宋奴刺杨初）"
 hd_hev_j16_liangshiwang_tt:0 "#high 梁式王之变（杨宋奴刺杨初）#!\n窗口 355.1.1 – 355.12.31\n杨初在世，杨宋奴在仇池境内\n杨初、杨宋奴之死交卒年表，立杨国为储"
 hd_hev_j16_zhangguan_name:0 "张瓘讨张祚、立张玄靓"
 hd_hev_j16_zhangguan_tt:0 "#high 张瓘讨张祚、立张玄靓#!\n窗口 355.6.1 – 356.6.1\n凉主是张祚，张瓘有地、在凉境内\n张祚被杀，凉主归张玄靓，张瓘专权；玩家张祚时打内战"
 hd_hev_346_05_name:0 "北伐（桓温北伐）"
 hd_hev_346_05_tt:0 "#high 北伐（桓温北伐）#!\n窗口 356.1.1 – 362.1.1\n桓温伐秦已了结；天子是河内司马氏，桓温是晋臣、不在战中；洛阳不在晋手里\n桓温收事件，北伐河南；开战时点亮"
 hd_hev_j16_guanggu_name:0 "燕伐段龛（广固之战）"
 hd_hev_j16_guanggu_tt:0 "#high 燕伐段龛（广固之战）#!\n窗口 356.1.1 – 357.12.31\n段龛独立有地，与燕接壤\n燕遣慕容恪围广固（1.5 万）；玩家燕主可不伐\n开战时点亮"
 hd_hev_j16_yangjun_name:0 "杨俊杀杨国、杨安奔秦"
 hd_hev_j16_yangjun_tt:0 "#high 杨俊杀杨国、杨安奔秦#!\n窗口 356.1.1 – 356.12.31\n仇池之主是杨国，杨俊在其境内\n杨俊夺位，杨安入秦；玩家杨国可防备"
 hd_hev_j16_sanyuan_name:0 "三原之战（姚襄败死、姚苌降秦）"
 hd_hev_j16_sanyuan_tt:0 "#high 三原之战（姚襄败死、姚苌降秦）#!\n窗口 357.2.1 – 357.12.31\n姚襄独立有地，与秦接壤\n秦主讨姚襄（1.2 万），胜则姚襄死、姚苌降秦；玩家秦主可不讨\n开战时点亮"
 hd_hev_346_06_name:0 "云龙门之变（苻坚夺位）"
 hd_hev_346_06_tt:0 "#high 云龙门之变（苻坚夺位）#!\n窗口 357.6.1 – 360.1.1\n苻健入关已了结；苻坚成年、未被囚；长安之主是苻氏电脑君主（苻生），不是苻坚\n苻坚收事件：弑主夺位，天下通报；选史实项时点亮"
 hd_hev_j16_wangmeng_name:0 "王猛入秦"
 hd_hev_j16_wangmeng_tt:0 "#high 王猛入秦#!\n窗口 357.6.1 – 358.12.31\n秦主是苻坚，王猛无地、未仕秦\n王猛入秦任宰相，苻坚得「得王景略」；玩家可不用"
 hd_hev_j16_qianye_name:0 "慕容儁迁都邺"
 hd_hev_j16_qianye_tt:0 "#high 慕容儁迁都邺#!\n窗口 357.11.1 – 358.12.31\n燕主直辖邺城县\n迁都邺；玩家可留都蓟"
 hd_hev_j16_zhangping_name:0 "张平降秦、张蚝入秦"
 hd_hev_j16_zhangping_tt:0 "#high 张平降秦、张蚝入秦#!\n窗口 358.1.1 – 359.8.1\n秦主是苻坚，张平在世\n张平独立有地则秦讨之；张蚝入秦得「万人敌」\n秦讨张平开战或张蚝入秦时点亮"
 hd_hev_j16_songhun_name:0 "宋混诛张瓘"
 hd_hev_j16_songhun_tt:0 "#high 宋混诛张瓘#!\n窗口 359.6.1 – 359.12.31\n凉主是张玄靓，张瓘、宋混在世\n张瓘自杀（交卒年表），宋混任丞相；玩家宋混可不动"
 hd_hev_j16_huanwen_regent_name:0 "桓温录尚书事、挟天子"
 hd_hev_j16_huanwen_regent_tt:0 "#high 桓温录尚书事、挟天子#!\n窗口 363.3.1 – 364.12.31\n桓温是天子直属封臣、有地，尚无权臣\n桓温为权臣兼丞相，天子固定在建康"
 hd_hev_j16_tianxi_name:0 "张天锡杀玄靓自立"
 hd_hev_j16_tianxi_tt:0 "#high 张天锡杀玄靓自立#!\n窗口 363.6.1 – 364.6.1\n凉主是张玄靓（电脑），张天锡成年、在凉境内\n张天锡夺位（玄靓之死交卒年表）；玩家可不动"
 hd_hev_j16_luoyang365_name:0 "燕取洛阳"
 hd_hev_j16_luoyang365_tt:0 "#high 燕取洛阳#!\n窗口 364.6.1 – 365.12.31\n桓温北伐已了结，洛阳归晋天子，燕晋接壤\n燕遣慕容恪攻河南郡（1.5 万）；玩家燕主可不取\n开战时点亮"
 hd_hev_j16_pingzhuan_name:0 "慕容恪卒、慕容评专权"
 hd_hev_j16_pingzhuan_tt:0 "#high 慕容恪卒、慕容评专权#!\n窗口 367.5.1 – 367.12.31\n慕容恪已死，慕容评在燕主处\n燕主得「评专权」，慕容评任宰相；玩家燕主自揽朝政时不亮"
 hd_hev_j16_sigong_name:0 "四公之乱"
 hd_hev_j16_sigong_tt:0 "#high 四公之乱#!\n窗口 367.10.1 – 368.12.31\n秦主是苻坚，苻柳、苻双、苻廋、苻武至少两人有地\n四公中领地最大者独立，苻坚讨之（1.5 万）；玩家苻坚可招抚\n开战时点亮"
 hd_hev_j16_fangtou_name:0 "枋头之战"
 hd_hev_j16_fangtou_tt:0 "#high 枋头之战#!\n窗口 369.4.1 – 369.12.31\n桓温有地、不在战中；燕与晋接壤，枋头所在汲郡属燕\n桓温攻汲郡（2 万对 1.5 万），秦遣苟池、邓羌援燕；玩家可不出\n开战时点亮"
 hd_hev_j16_chui_benqin_name:0 "慕容垂奔秦"
 hd_hev_j16_chui_benqin_tt:0 "#high 慕容垂奔秦#!\n窗口 369.10.1 – 370.2.12\n慕容垂在燕主处；枋头燕胜或垂有「枋头之功」；秦主存在\n垂奔秦、得华阴一县；玩家可留燕自辩"
 hd_hev_j16_dir_qin_s1_name:0 "前秦导演：关中收尾"
 hd_hev_j16_dir_qin_s1_tt:0 "#high 前秦导演：关中收尾#!\n前秦导演启动后的第一阶段\n秦主（长安之主，苻氏，独立）每月择郡开战，收取关中诸郡\n该阶段真正完成时点亮"
 hd_hev_j16_dir_qin_s2_name:0 "前秦导演：陇右、秦州收复"
 hd_hev_j16_dir_qin_s2_tt:0 "#high 前秦导演：陇右、秦州收复#!\n前秦导演第二阶段\n目标陇右、秦州诸郡\n该阶段真正完成时点亮"
 # 王猛伐燕与前秦一统（370–383；304、346、370 开局适用）
 hd_hev_j16_dir_qin_start_name:0 "前秦导演启动（秦军出关）"
 hd_hev_j16_dir_qin_start_tt:0 "#high 前秦导演启动（秦军出关）#!\n窗口 351.1.1 – 382.6.1（370 局首跳即启动）\n苻健入关已了结，能解析出秦主，前秦未瓦解\n导演启动，此后分阶段扩张"
 hd_hev_370_01_name:0 "金墉之围（洛阳之战）"
 hd_hev_370_01_tt:0 "#high 金墉之围（洛阳之战）#!\n窗口 369.12.1 – 370.7.9\n秦主（长安之主，独立苻氏）与燕主（河南郡之主，独立慕容氏）都在，金墉属燕\n秦燕开战（秦 1.5 万，燕 8000）；慕容筑出降，或洛阳之战打完金墉归秦时点亮"
 hd_hev_370_04_name:0 "邺城失守（燕国覆亡）"
 hd_hev_370_04_tt:0 "#high 邺城失守（燕国覆亡）#!\n窗口 369.12.1 – 372.1.1\n东征秦胜，或 371.6.1 前邺城已在秦主一系；燕主、秦主在世有地\n电脑燕主出降，燕的头衔归秦；玩家燕主可北走龙城"
 hd_hev_370_02_name:0 "东征燕国（王猛伐燕）"
 hd_hev_370_02_tt:0 "#high 东征燕国（王猛伐燕）#!\n窗口 370.7.21 – 371.6.1\n洛阳之战已开打或了结；秦主、燕主都独立，邺城在燕一系\n电脑秦主直接出兵（玩家可不出），目标魏郡、上党、阳阿；秦败后可再伐一次"
 hd_hev_370_03_name:0 "寿春之役（征讨寿春）"
 hd_hev_370_03_tt:0 "#high 寿春之役（征讨寿春）#!\n窗口 370.9.6 – 371.6.1\n寿春郡由陈郡袁氏独立据守，天子是河内司马氏；非 370 局另须枋头晋败、袁真获咎\n天子收事件，开战后桓温随征；玩家袁氏可死守或出降"
 hd_hev_j16_dir_qin_s3_name:0 "前秦导演：燕地余烬收尽"
 hd_hev_j16_dir_qin_s3_tt:0 "#high 前秦导演：燕地余烬收尽#!\n前燕亡后继续\n收取燕地余郡\n该阶段真正完成时点亮"
 hd_hev_370_05_name:0 "废立之议（桓温废立）"
 hd_hev_370_05_tt:0 "#high 废立之议（桓温废立）#!\n窗口 371.12.24 – 373.1.1\n桓温有地、是司马奕之臣，司马奕仍是天子，司马昱在世；早开局须桓温仍是权臣\n桓温、司马奕、司马昱依次表态（电脑照史实），司马昱即位，改元咸安"
 hd_hev_j16_dir_qin_s4_name:0 "前秦导演：仇池平定"
 hd_hev_j16_dir_qin_s4_tt:0 "#high 前秦导演：仇池平定#!\n仇池闸门打开后\n收取仇池\n武都归秦才点亮"
 hd_hev_j16_huanwen_dead_name:0 "桓温卒·遗命"
 hd_hev_j16_huanwen_dead_tt:0 "#high 桓温卒·遗命#!\n窗口 373.3.1 – 384.1.1\n窗口内桓温先在世、后身死\n桓温死后点亮（权臣交接受阻断）"
 hd_hev_j16_mieliang_name:0 "灭前凉"
 hd_hev_j16_mieliang_tt:0 "#high 灭前凉#!\n376.3.1 起开闸，到导演下线为止\n前凉之主独立、与秦接壤；张天锡拒命则开闸（玩家天锡可入朝称藩）\n姑臧归秦一系时点亮"
 hd_hev_j16_miedai_name:0 "灭代"
 hd_hev_j16_miedai_tt:0 "#high 灭代#!\n代地闸门打开后\n云中归秦一系即点亮\n善后窗口 376.6.1 – 379.1.1 内分代地给刘库仁、刘卫辰"
 hd_hev_j16_beifu_name:0 "北府兵"
 hd_hev_j16_beifu_tt:0 "#high 北府兵#!\n窗口 377.6.1 – 380.1.1\n谢玄在晋、不持郡；广陵郡由同政权电脑持有\n广陵授谢玄，组建北府兵"
 hd_hev_j16_xiangyang_name:0 "襄阳之战"
 hd_hev_j16_xiangyang_tt:0 "#high 襄阳之战#!\n窗口 377.10.1 – 380.1.1\n秦主独立，襄阳郡首府归晋天子，秦与襄阳郡接壤\n秦遣苻丕围襄阳（1.5 万）；玩家秦主可不伐\n秦胜时点亮，朱序入秦"
 hd_hev_j16_dir_qin_done_name:0 "前秦导演阶段表走完"
 hd_hev_j16_dir_qin_done_tt:0 "#high 前秦导演阶段表走完#!\n各阶段完成或作废后\n—\n导演收尾时点亮"
 hd_hev_346_07_name:0 "投鞭断流（淝水之战）"
 hd_hev_346_07_tt:0 "#high 投鞭断流（淝水之战）#!\n窗口 383.6.1 – 386.1.1\n天子存在；秦主独立、领地不少于 100 县、不是天子，未与天子交战、不在淝水战中\n秦主收事件，向晋帝宣战（目标扬州）；开战时点亮，结局天下通报"
 hd_hev_346_08_name:0 "淝水之后（前秦瓦解）"
 hd_hev_346_08_tt:0 "#high 淝水之后（前秦瓦解）#!\n淝水之战秦败或白和\n秦主在世时收事件\n非氐族、公爵级以上的封臣全部自立；天下通报"
 # 东晋末·王恭、孙恩与桓玄（396–404；304、346、370 开局适用）
 hd_hev_j16_wanggong_name:0 "王恭举兵（两次）"
 hd_hev_j16_wanggong_tt:0 "#high 王恭举兵（两次）#!\n初举 397.3.1 – 397.12.1；再举 398.6.1 – 399.3.1\n王恭有地、在晋，王国宝、司马道子在朝\n初举：道子杀王国宝谢天下；再举：刘牢之倒戈\n任一次发生即点亮"
 hd_hev_j16_sunen_name:0 "孙恩起事"
 hd_hev_j16_sunen_tt:0 "#high 孙恩起事#!\n399 – 402 年，历史入侵「孙恩」\n孙恩在世，入侵按年掷骰\n起兵时点亮（任何开局都可能设，非两晋开局显示非本局）"
 hd_hev_j16_huanxuan_name:0 "桓玄入建康·秉政"
 hd_hev_j16_huanxuan_tt:0 "#high 桓玄入建康·秉政#!\n窗口 401.12.1 – 403.1.1\n桓玄持郡、是晋臣，天子是司马氏、无权臣，司马元显在晋\n桓玄以清君侧开战（或和平秉政），成为权臣"
 hd_hev_j16_cuanchu_name:0 "桓玄篡楚"
 hd_hev_j16_cuanchu_tt:0 "#high 桓玄篡楚#!\n窗口 403.9.1 – 404.3.1\n桓玄秉政满一年，天子不是桓玄\n电脑桓玄受禅；玩家可不受"
 # 北方诸国（395–412；参合陂至柴壁四行早于 404，404 开局显示开局前）
 hd_hev_j16_canhe_name:0 "参合陂之战"
 hd_hev_j16_canhe_tt:0 "#high 参合陂之战#!\n窗口 395.5.1 – 396.3.1\n燕主、魏主接壤、未交战；西燕已灭或已不存在\n燕主遣慕容宝伐魏；玩家燕主可不伐\n开战时点亮"
 hd_hev_j16_zhongshan_name:0 "魏取中山"
 hd_hev_j16_zhongshan_tt:0 "#high 魏取中山#!\n窗口 397.1.1 – 398.6.1\n中山归魏主（由历史入侵「拓跋珪」打下）\n魏主得威望与燕府库，崔宏入魏"
 hd_hev_j16_nanyan_di_name:0 "南燕称帝"
 hd_hev_j16_nanyan_di_tt:0 "#high 南燕称帝#!\n窗口 399.6.1 – 401.6.1\n慕容德独立有地，广固在其一系\n称帝、改元建平，迁都广固"
 hd_hev_j16_chaibi_name:0 "柴壁之战"
 hd_hev_j16_chaibi_tt:0 "#high 柴壁之战#!\n窗口 402.3.1 – 403.6.1\n魏、后秦在平阳或河东接壤、未交战\n魏主出兵（边境战争）；玩家可不出或求和\n开战时点亮"
 hd_hev_j16_xia_open_name:0 "赫连勃勃建夏"
 hd_hev_j16_xia_open_tt:0 "#high 赫连勃勃建夏#!\n窗口 407.4.1 – 409.1.1\n勃勃有地（后秦封臣、后秦已亡或已独立）\n开历史入侵「赫连勃勃」；确已起兵时点亮"
 hd_hev_j16_guzang_juqu_name:0 "北凉入姑臧"
 hd_hev_j16_guzang_juqu_tt:0 "#high 北凉入姑臧#!\n窗口 410.1.1 – 413.6.1\n北凉、南凉接壤，姑臧在南凉\n北凉攻姑臧；姑臧实归北凉一系时点亮"
 # 刘裕北伐与晋宋禅代（404–421；四个两晋开局都适用）
 hd_hev_404_01_name:0 "覆舟山（桓玄西走）"
 hd_hev_404_01_tt:0 "#high 覆舟山（桓玄西走）#!\n京口起兵（404.2.1 – 405.1.1，各开局通用）后 5 天，桓玄收事件；兜底窗口 404.3.29 – 405.1.1\n刘裕正以独立战争攻桓玄，桓玄持天下\n桓玄弃都西走：选史实项时点亮"
 hd_hev_404_02_name:0 "峥嵘洲（晋室复兴）"
 hd_hev_404_02_tt:0 "#high 峥嵘洲（晋室复兴）#!\n窗口 404.6.10 – 405.6.1\n桓玄已西走，刘裕独立，桓玄持天下，安帝或司马德文在世\n刘裕收事件：桓玄是电脑时直接奉迎晋帝复晋，是玩家时开战；复晋或开战时点亮"
 hd_hev_j16_liuyu_regent_name:0 "刘裕秉政"
 hd_hev_j16_liuyu_regent_tt:0 "#high 刘裕秉政#!\n兜底窗口 404.7.1 – 409.4.1，且 408.2.1 以后\n刘裕在晋、不是天子，天子无有效权臣\n刘裕成为权臣；峥嵘洲复晋时装上权臣（正常路径）也点亮"
 hd_hev_404_03_name:0 "浮海南下（卢循据番禺）"
 hd_hev_404_03_tt:0 "#high 浮海南下（卢循据番禺）#!\n窗口 404.10.15 – 406.1.1\n卢循在世、成年、无地，番禺不在他手里\n卢循收事件：据番禺自立、攻南海郡；选史实项时点亮"
 hd_hev_404_04_name:0 "五城水口（谯纵兵变）"
 hd_hev_404_04_tt:0 "#high 五城水口（谯纵兵变）#!\n历史入侵「谯纵」，404 – 412 年按年掷骰\n谯纵在世\n入侵起兵时点亮（任何开局都可能设）"
 hd_hev_404_05_name:0 "伐南燕（灭南燕）"
 hd_hev_404_05_tt:0 "#high 伐南燕（灭南燕）#!\n窗口 409.4.1 – 413.1.1\n刘裕已秉政或已复晋，是权臣或独立王国级以上，不是任何史实战争的主攻方；南燕之主（广固或齐国郡的独立慕容氏）存在\n刘裕北伐青州；开战或胜负判定时点亮"
 hd_hev_j16_luxun_north_name:0 "卢循、徐道覆北上"
 hd_hev_j16_luxun_north_tt:0 "#high 卢循、徐道覆北上#!\n窗口 410.2.1 – 411.3.1\n卢循独立、持南海郡县，天子是司马氏；刘裕正伐南燕或已到 410.4.1\n电脑卢循北上；玩家卢循可守岭南\n开战时点亮"
 hd_hev_j16_tao_liuyi_name:0 "讨刘毅（王镇恶袭江陵）"
 hd_hev_j16_tao_liuyi_tt:0 "#high 讨刘毅（王镇恶袭江陵）#!\n窗口 412.9.1 – 413.3.1\n刘裕秉政，刘毅有地、是晋臣\n刘毅败死（交卒年表），南郡随后授司马休之"
 hd_hev_j16_pingshu_name:0 "朱龄石平蜀"
 hd_hev_j16_pingshu_tt:0 "#high 朱龄石平蜀#!\n窗口 412.12.1 – 414.6.1\n成都之主是独立的谯氏，刘裕秉政\n刘裕遣朱龄石伐蜀；谯纵入侵没发生则跳过\n开战时点亮"
 hd_hev_j16_tao_xiuzhi_name:0 "讨司马休之、鲁宗之"
 hd_hev_j16_tao_xiuzhi_tt:0 "#high 讨司马休之、鲁宗之#!\n窗口 415.1.1 – 416.3.1\n司马休之有地、是晋臣，刘裕秉政，鲁宗之在世\n收回休之一郡授刘道怜，休之出奔；玩家可起兵或不讨"
 hd_hev_404_06_name:0 "伐后秦（北伐后秦）"
 hd_hev_404_06_tt:0 "#high 伐后秦（北伐后秦）#!\n窗口 416.9.1 – 419.1.1\n灭南燕、讨休之已了结；刘裕条件同伐南燕；后秦之主（长安的独立姚氏）存在\n刘裕北伐司隶；开战或胜负判定时点亮"
 hd_hev_j16_songgong_name:0 "九锡、宋公"
 hd_hev_j16_songgong_tt:0 "#high 九锡、宋公#!\n窗口 418.6.1 – 419.12.1\n刘裕秉政、有地；后秦已灭或已到 418.12.1\n新建宋国（王国级）授刘裕；玩家可辞一次"
 hd_hev_j16_changan_lost_name:0 "长安失陷（青泥之败）"
 hd_hev_j16_changan_lost_tt:0 "#high 长安失陷（青泥之败）#!\n窗口 418.9.1 – 419.6.1\n关中镇守者在世、持京兆或长安；赫连勃勃独立、与之接壤\n勃勃取长安（已开战则只给夏兵 8000）"
 hd_hev_j16_gongdi_name:0 "安帝被弑、恭帝立"
 hd_hev_j16_gongdi_tt:0 "#high 安帝被弑、恭帝立#!\n窗口 418.12.1 – 419.6.1\n宋公已封，天子是安帝（电脑），司马德文在世\n安帝立德文为储（安帝 419.1.28 被弑）；德文即位、改元元熙时点亮"
 hd_hev_j16_songwang_name:0 "进爵宋王"
 hd_hev_j16_songwang_tt:0 "#high 进爵宋王#!\n窗口 419.7.1 – 420.6.1\n刘裕持宋国、秉政\n新建帝国级宋套住宋国；玩家可辞一次"
 hd_hev_404_07_name:0 "禅让（刘宋代晋）"
 hd_hev_404_07_tt:0 "#high 禅让（刘宋代晋）#!\n窗口 419.12.1 – 421.1.1\n刘裕是权臣；已进宋王或已到 420.6.1；天子不是安帝或已到 420.6.1\n电脑刘裕直接受禅（玩家可推迟一年），国号宋，天下通报"
 hd_hev_531_01_name:0 "信都立帝"
 hd_hev_531_01_tt:0 "#high 信都立帝#!\n531 年 10 月 31 日起\n高欢独立、未被囚，元朗在世、不是天子\n高欢收到事件，立元朗后改元中兴、国号魏"
 hd_hev_531_02_name:0 "进攻邺城"
 hd_hev_531_02_tt:0 "#high 进攻邺城#!\n531 年 12 月 1 日起\n高欢独立，刘诞仍持魏郡\n高欢收到事件，出兵攻邺（信都得兵一万），胜后刘诞被斩"
 hd_hev_531_03_name:0 "会师邺南（韩陵之战）"
 hd_hev_531_03_tt:0 "#high 会师邺南（韩陵之战）#!\n532 年 4 月 20 日至 533 年 1 月 1 日\n高欢已据邺城，尔朱兆独立\n尔朱兆收到事件，合兵攻邺；高欢守住邺城算胜，尔朱仲远随后奔梁"
 hd_hev_531_04_name:0 "入洛立帝（斛斯椿之变、禅位）"
 hd_hev_531_04_tt:0 "#high 入洛立帝（斛斯椿之变、禅位）#!\n532 年 5 月起，须韩陵之战高欢获胜\n高欢独立，元恭仍是天子，元修在世\n高欢决定入洛；斛斯椿杀尔朱世隆等，元恭禅位给元修，高欢任丞相"
 hd_hev_531_05_name:0 "贺拔岳遇害，宇文泰接掌关中"
 hd_hev_531_05_tt:0 "#high 贺拔岳遇害，宇文泰接掌关中#!\n534 年 2 月起\n贺拔岳在世、是电脑、有地\n宇文泰在同一主君之下时先接收贺拔岳的全部领地，然后贺拔岳为侯莫陈悦所杀；不弹事件"
 hd_hev_617_01_name:0 "西河之战"
 hd_hev_617_01_tt:0 "#high 西河之战#!\n开局时李渊对西河郡丞高德儒开战\n战争结束后判胜负：兹氏归李渊一系算胜\n胜后西河郡归李渊，高德儒被斩"
 hd_hev_617_02_name:0 "东都之围"
 hd_hev_617_02_tt:0 "#high 东都之围#!\n开局时李密对越王杨侗开战，目标河南郡\n战争结束后判胜负：洛阳归李密一系算胜\n胜后河南郡归李密"
 hd_hev_617_03_name:0 "诏救东都"
 hd_hev_617_03_tt:0 "#high 诏救东都#!\n617 年 8 月 7 日至 618 年 4 月 1 日\n王世充持江都县，杨侗持洛阳和偃师\n王世充收到事件（电脑直接北上），改作杨侗封臣，得偃师，东都得江淮兵一万"
 hd_hev_617_04_name:0 "薛举称帝"
 hd_hev_617_04_tt:0 "#high 薛举称帝#!\n617 年 8 月 7 日起\n薛举在世且独立\n直接改称皇帝，不弹事件"
 hd_hev_617_05_name:0 "西图关中（唐公兵临长安）"
 hd_hev_617_05_tt:0 "#high 西图关中（唐公兵临长安）#!\n617 年 8 月 10 日至 618 年 6 月 1 日\n李渊独立、持太原，代王杨侑仍持京兆郡\n李渊收到事件（电脑直接西进），对杨侑开战；玩家杨侑可选开城，克长安后李渊称唐王"
 hd_hev_617_06_name:0 "李轨起兵"
 hd_hev_617_06_tt:0 "#high 李轨起兵#!\n617 年 8 月 14 日至 618 年 3 月 1 日\n李轨在世、不是独立君主，武威郡还没被别的起义者占\n直接得武威郡、独立，称河西大凉王，改元安乐；不弹事件"
 hd_hev_617_07_name:0 "巴陵豪杰（萧铣起兵）"
 hd_hev_617_07_tt:0 "#high 巴陵豪杰（萧铣起兵）#!\n617 年 11 月 4 日至 618 年 3 月 1 日\n萧铣在世、持罗县、不是独立君主\n萧铣收到事件（电脑直接起兵），得长沙郡、独立，称梁公"
 hd_hev_617_08_name:0 "鸿门之宴（翟让之死）"
 hd_hev_617_08_tt:0 "#high 鸿门之宴（翟让之死）#!\n617 年 12 月 4 日至 618 年 6 月 1 日\n翟让是电脑角色、在世，并且是李密的封臣\n李密收到事件（电脑直接动手），收回翟让的县，在宴上杀翟让"
 hd_hev_617_09_name:0 "窦建德称夏王"
 hd_hev_617_09_tt:0 "#high 窦建德称夏王#!\n618 年 2 月 1 日起\n窦建德在世且独立\n直接改国号夏、称王，改元五凤；不弹事件"
 hd_hev_617_10_name:0 "江都之变"
 hd_hev_617_10_tt:0 "#high 江都之变#!\n618 年 4 月 11 日至 619 年 1 月 1 日\n炀帝在世，仍持天下与广陵县；宇文化及在世\n电脑炀帝被缢，杨侗继位改元皇泰，王世充任丞相；玩家炀帝不死，但宇文化及据江都、起兵开战"
 hd_hev_617_11_name:0 "萧铣称帝"
 hd_hev_617_11_tt:0 "#high 萧铣称帝#!\n618 年 5 月 1 日起\n萧铣在世、独立，并且已经起兵（有起义标记）\n直接改称皇帝，改元鸣凤；不弹事件"
 hd_hev_617_12_name:0 "受禅（唐建国）"
 hd_hev_617_12_tt:0 "#high 受禅（唐建国）#!\n618 年 6 月 18 日至 619 年 6 月 1 日\n李渊独立、持长安，天下头衔在别人手里\n李渊收到事件（电脑直接受禅），得天下头衔，国号唐，改元武德"
 hd_hev_617_13_name:0 "郑王逼禅（群下劝进）"
 hd_hev_617_13_tt:0 "#high 郑王逼禅（群下劝进）#!\n619 年 5 月 1 日至 620 年 1 月 1 日\n王世充是杨侗的封臣，杨侗仍持洛阳\n玩家王世充或玩家杨侗收到事件（双方都是电脑时直接执行），王世充篡位，国号郑，改元开明"
