 hd_hev_btn_tt:0 "历史事件列表（调试）"
 hd_hev_btn_label:0 "史"
 hd_hev_window_title:0 "历史事件列表"
 hd_hev_window_help:0 "#weak 已触发＝该节点已经发生（战争以开战为准；事件弹出后玩家选了别的结局也算）。过期作废、尚未到时间显示未触发；玩家拒绝一般也显示未触发，个别“弹出即算”的行在提示里注明。不适用本局开局的事件显示非本局。鼠标移到事件名上看触发条件。两晋十六国各组（304–421）中，早于本局开局的行显示「开局前」（开局前已成往事）。#!"
 hd_hev_st_done:0 "#P 已触发#!"
 hd_hev_st_wait:0 "未触发"
 hd_hev_st_na:0 "#weak 非本局#!"
 hd_hev_st_past:0 "#weak 开局前#!"
 hd_hev_st_past_tt:0 "开局前已成往事：此事早于本局开局日期，开局时已按史实视为发生，不会再触发。"
 hd_hev_grp_here:0 "#P （本局）#!"
