 game_concept_wj_ty_reward_scale:0 "奖励力度"
 game_concept_wj_ty_reward_scale_desc:0 "待遇轻重影响议臣的判断。\n\n$EFFECT_LIST_BULLET$低档：无额外影响\n$EFFECT_LIST_BULLET$中档：对受益者原有判断的#V 20%#!\n$EFFECT_LIST_BULLET$高档：对受益者原有判断的#V 40%#!\n\n原有判断取[wj_ty_opinion|E]、亲属师友、威望、[diplomacy|E]、虔诚、[Concept('merit', '贤望')|E]及本人受益。支持者可能更加支持，反对者也可能更加反对。提议者的影响与换取支持不随档位放大。"
 game_concept_wj_ty_reward_excess:0 "赏格之虑"
 game_concept_wj_ty_reward_excess_desc:0 "议臣对待遇超出资望的顾虑。\n\n$EFFECT_LIST_BULLET$低档：无此顾虑\n$EFFECT_LIST_BULLET$中档：以[Concept('merit_level', '贤望等级')|E]#V 4#!为衡量\n$EFFECT_LIST_BULLET$高档：以贤望等级#V 7#!为衡量\n$EFFECT_LIST_BULLET$每不足一级：#N −4#!态度\n\n达到相应等级便不扣分。此为议臣的考量，不是禁止授予的条件。"
 game_concept_wj_ty_topic:0 "议题"
 game_concept_wj_ty_topic_desc:0 "本次提交[wj_ty_deliberation|E]商议的事项。\n\n$EFFECT_LIST_BULLET$实际当事人的关系与声望\n$EFFECT_LIST_BULLET$职位变动及自身得失\n$EFFECT_LIST_BULLET$奖赏档位、资望与[crime|E]等考量\n\n本组各项相加为议题的综合影响；再与[wj_ty_proposer|E]的综合影响相加，得到[wj_ty_agreement|E]。"
