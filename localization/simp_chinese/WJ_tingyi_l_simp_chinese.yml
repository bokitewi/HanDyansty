 WJ_ty_catalog_TY23:0 "推议公卿"
 WJ_ty_catalog_TY23_desc:0 "• 职位：[councillor|E]、[court_position|E]\n• 补任[Concept('wj_ty_empty_seat','空位')|E]：[Concept('wj_ty_threshold','通过线')|E] #V 650#!\n• 替换现任：[Concept('wj_ty_threshold','通过线')|E] #V 700#!\n• 内阁调任：依职位办理转任或交换\n• 侍中、大司马：可兼任内阁本职"
 WJ_ty_catalog_TY48:0 "更定辅政"
 WJ_ty_catalog_TY48_desc:0 "• 议定事项：[regency|E]法律\n• 先选法律及对应在任者\n• 正式授相、撤相时的法律变更另依其规定\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY25:0 "废帝迎立"
 WJ_ty_catalog_TY25_desc:0 "• 新君：天子同[dynasty|E]成员\n• 旧帝：未满#V 16#!岁，或[crown_authority|E]低于#V 3#!级\n\n#bold 议定后#!\n• 新君承继天朝\n• 旧帝按二王三恪受封\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY38:0 "拜相秉政"
 WJ_ty_catalog_TY38_desc:0 "• [Concept('wj_ty_threshold','通过线')|E]：#V 800#!\n• 相位：#V 尚未设立#!\n• 人选：具备授相资格\n• 局势：允许设相\n\n#bold 授相#!\n• 授予丞相官职与官署头衔\n• 改用丞相[regency|E]法律\n• 授予都督中外、假黄钺"
 WJ_ty_catalog_TY49:0 "受禅"
 WJ_ty_catalog_TY49_desc:0 "• [Concept('wj_ty_deliberation','廷议')|E]通过后，举行三辞三让\n• 辞让礼成后交付帝位\n• 正统与礼遇依辞让结果结算\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY17:0 "罢免公卿"
 WJ_ty_catalog_TY17_desc:0 "罢免本朝公卿所任职务。\n\n$EFFECT_LIST_BULLET$罢黜朝臣：内阁本职及所属官署\n$EFFECT_LIST_BULLET$罢免内臣：全部解除目标由天子授予的宫廷职务\n$EFFECT_LIST_BULLET$丞相另议；私人爵产保留"
 WJ_ty_catalog_TY18:0 "撤换地方官员"
 WJ_ty_catalog_TY18_desc:0 "令本朝有地、公爵级及以上地方官退职。\n\n$EFFECT_LIST_BULLET$官职与任地依原继任规则交接\n$EFFECT_LIST_BULLET$不指定接任者\n$EFFECT_LIST_BULLET$私人爵产保留\n$EFFECT_LIST_BULLET$有罪减轻阻力；无罪仍可提出"
 WJ_ty_catalog_TY19:0 "禁锢仕途"
 WJ_ty_catalog_TY19_desc:0 "• 罢去官职\n• 移除入仕之途修正\n• [Concept('wj_ty_merit_cap','贤望上限')|E]：#N −99#!\n• 现有[merit|E]保留\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY20:0 "遥领其州"
 WJ_ty_catalog_TY20_desc:0 "• 须处于允许对外诏令的局势\n• 对象：认可本朝宗主的诸侯\n• 军号：至少杂号将军\n• 效果：授予选定州郡的宣称\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY21:0 "修改路行政"
 WJ_ty_catalog_TY21_desc:0 "• 对象：天子直属，且为王国级及以上\n• 选择行政安排后提交[Concept('wj_ty_deliberation','廷议')|E]\n• 其他对象仍由日常任政办理\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY22:0 "赦免"
 WJ_ty_catalog_TY22_desc:0 "• 选择可赦免的[crime|E]\n• 议定对方承担的赦免代价\n• 官身与旧职另行授予\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY47:0 "结盟"
 WJ_ty_catalog_TY47_desc:0 "• 选择天子拟结交的统治者\n• 本朝[Concept('wj_ty_deliberation','廷议')|E]通过\n• 对方同意后建立[alliance|E]\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY26:0 "命武官支援"
 WJ_ty_catalog_TY26_desc:0 "• 选择合资格武官\n• 选择当前战争\n• 命其支援所选战争\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY27:0 "授予军职"
 WJ_ty_catalog_TY27_desc:0 "• 授予军职：本朝合资格人物\n• 遣使授职：认可本朝宗主的诸侯\n• 先选具体军号，沿军号名额与任职资格办理\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY37:0 "请诏都督中外"
 WJ_ty_catalog_TY37_desc:0 "• 人选：本朝合资格受权人\n• 中外军权：尚无其他持有人\n• 授予都督中外与假黄钺\n• 无须兼任[regent|E]\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY44:0 "收回都督中外"
 WJ_ty_catalog_TY44_desc:0 "• 收回都督中外军权\n• 撤去附带假黄钺\n• 其余官职、爵位及土地保留\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY46:0 "褫夺军职"
 WJ_ty_catalog_TY46_desc:0 "• 对象：王国级及以上\n• 选择对方持有的军号\n• 仅褫夺所选军职\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY29:0 "宣战"
 WJ_ty_catalog_TY29_desc:0 "• 选择宣战对象\n• 选择[casus_belli|E]\n• 须满足宣战资格、停战及费用要求\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY30:0 "全族收系"
 WJ_ty_catalog_TY30_desc:0 "• 对象：有重[crime|E]者及规定范围内的族属\n• 被收系者须在本朝辖区内，且不属敌战一方\n• 由廷尉收监；廷尉空缺时由天子收监\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY31:0 "诏令征伐"
 WJ_ty_catalog_TY31_desc:0 "• 须处于允许对外诏令的局势\n• 选择符合宗主关系的双方\n• 双方各获讨伐对方的[casus_belli|E]\n• 是否出兵由双方自行决定\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY32:0 "令其进贡"
 WJ_ty_catalog_TY32_desc:0 "• 须处于允许对外诏令的局势\n• 对象：认可本朝宗主的诸侯\n• 索取一次贡金\n• 无军号要求\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY33:0 "囚禁"
 WJ_ty_catalog_TY33_desc:0 "• 中央官员须经[Concept('wj_ty_deliberation','廷议')|E]\n• 地方官：天子直属，且为王国级及以上\n• 其余对象沿日常囚禁办理\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY34:0 "抄家"
 WJ_ty_catalog_TY34_desc:0 "• 没收目标的全部私人[gold|E]\n• 没收目标可转移的[artifact|E]\n• 财物交归名义天子\n• 不取其家族及封臣的私人资产\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY35:0 "流放"
 WJ_ty_catalog_TY35_desc:0 "• 目标已被收监\n• 须满足流放资格\n• 依法处置；无合法理由时承担相应[tyranny|E]\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY02:0 "褒奖金帛"
 WJ_ty_catalog_TY02_desc:0 "• 赐金档位：#V 500#!／#V 1,000#!／#V 2,000#![gold|E]\n• 先支天子[treasury|E]\n• 国库不足，由天子私人金币补足"
 WJ_ty_catalog_TY03:0 "拔擢"
 WJ_ty_catalog_TY03_desc:0 "• [merit|E]：#P +2,000#!／#P +5,000#!／#P +10,000#!\n• [Concept('wj_ty_merit_cap','贤望上限')|E]：#P +1#!／#P +2#!／#P +3#!\n• 同源上限修正只保留最高档"
 WJ_ty_catalog_TY04:0 "恢复官身"
 WJ_ty_catalog_TY04_desc:0 "• 解除禁锢仕途\n• 补授举孝廉资格\n• 旧职须另行任命\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY05:0 "贤良方正"
 WJ_ty_catalog_TY05_desc:0 "• 授予举茂才资格\n• 门生、幕僚关系另行建立\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY06:0 "申饬"
 WJ_ty_catalog_TY06_desc:0 "• [merit|E]：#N −2,000#!／#N −5,000#!／#N −10,000#!\n• [Concept('wj_ty_merit_cap','贤望上限')|E]不变\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY07:0 "册封侯爵与公主"
 WJ_ty_catalog_TY07_desc:0 "• 人选须符合初封或功绩赐爵资格\n• 选定爵等、封号及食邑\n• 请托受理后，须在一年内议成册封\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY08:0 "册封王公"
 WJ_ty_catalog_TY08_desc:0 "• 选择合资格的虚封王、公爵等\n• 实封公及公升王另有议题\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY09:0 "褫夺侯爵与公主"
 WJ_ty_catalog_TY09_desc:0 "• 选择目标当前爵位\n• 解除对应爵籍与食邑\n• 官职与普通领地保留\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY10:0 "褫夺王公"
 WJ_ty_catalog_TY10_desc:0 "• 选择目标当前王、公爵位\n• 实封爵按封国撤销规定处理\n• 普通国家头衔不作爵号褫夺\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY11:0 "征用国库"
 WJ_ty_catalog_TY11_desc:0 "• 对象：天子直属，且为王国级及以上\n• 议定征用其[treasury|E]\n• 其余对象沿日常征用办理\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY12:0 "册立皇后"
 WJ_ty_catalog_TY12_desc:0 "• 选择符合册后资格的人选\n• [Concept('wj_ty_deliberation','廷议')|E]通过后册立\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY13:0 "废黜皇后"
 WJ_ty_catalog_TY13_desc:0 "• 须有针对皇后的合法拘捕理由\n• 废黜后承担对应的合法性与关系后果\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY14:0 "册立太子"
 WJ_ty_catalog_TY14_desc:0 "• 选择合资格的储君人选\n• 册立后通告朝廷\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY15:0 "废黜太子"
 WJ_ty_catalog_TY15_desc:0 "• 须有针对太子的合法拘捕理由\n• 议定后废去储位\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY39:0 "封为实封公"
 WJ_ty_catalog_TY39_desc:0 "• 人选持有有效侯爵\n• 效忠本朝，且未重复受封\n• 选定合资格封地\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY40:0 "扩大封国"
 WJ_ty_catalog_TY40_desc:0 "• 选择合资格郡地\n• 扩封冷却：#V 3年#!\n• 封地尽失时，可重新择郡\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY41:0 "实封公升王"
 WJ_ty_catalog_TY41_desc:0 "• 人选持有有效实封公爵\n• 实际封地：至少#V 100县#!\n• 须属天朝霸权朝廷\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY42:0 "赏赐宝物"
 WJ_ty_catalog_TY42_desc:0 "• 选择天子持有的[artifact|E]\n• 按宝物价值确定[Concept('wj_ty_threshold','通过线')|E]\n• #N 传国玉玺不可赏赐#!\n\n#N 暂未开放#!"
 WJ_ty_catalog_TY43:0 "加九锡"
