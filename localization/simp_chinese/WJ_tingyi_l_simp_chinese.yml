 WJ_ty_removal_fiefs_heading:0 "撤销实封国并交接封土、属臣："
 WJ_ty_tt_manager_line_2:0 "\n• [wj_ty_manager_weight|E]：[GetPlayer.MakeScope.ScriptValue('WJ_ty_tt_manager_2')|=+0]"
 WJ_ty_result_removal_full:0 "朝议既定，诏按罪黜[scope:wj_ty_target.GetShortUIName]之官，交还官署与任地，军职、节钺及都督差遣一并收回。\n\n爵号与私有封地，不在此诏处分之列。"
 WJ_ty_result_removal_targeted:0 "朝议既定，诏依议处分[scope:wj_ty_target.GetShortUIName]，有司已按所定范围办结撤任与交割。\n\n私人爵产仍旧；未在本议处分之列的兼任，仍须具备任职资格。"
 WJ_ty_result_removal_peerage:0 "朝议既定，诏黜[scope:wj_ty_target.GetShortUIName]诸官，并削其爵。军职、节钺与都督差遣收回，食邑岁禄随爵罢除；实封国撤销，封土与属臣依制交接。\n\n宗族仍存，不在本诏处分之列。"
 WJ_ty_result_removal_ordinary:0 "朝议既定，诏撤[scope:wj_ty_target.GetShortUIName]所议之任，有司交割印绶，依制清点官署。\n\n其余兼任仍依本职资格办理，私人爵产仍旧。"
 game_concept_wj_ty_single_removal:0 "罢黜朝臣"
 game_concept_wj_ty_single_removal_desc:0 "解除内阁本职，并交还相应官署。\n\n$EFFECT_LIST_BULLET$侍中失去本职资格时连带卸任\n$EFFECT_LIST_BULLET$其余合法兼职保留\n$EFFECT_LIST_BULLET$私人爵产保留\n$EFFECT_LIST_BULLET$丞相不列普通免换"
 game_concept_wj_ty_targeted_removal:0 "罢免内臣"
 game_concept_wj_ty_targeted_removal_desc:0 "全部解除目标由本朝天子授予的宫廷职务。\n\n$EFFECT_LIST_BULLET$自动纳入全部实际任职，无须逐项选择\n$EFFECT_LIST_BULLET$每项撤职分别计入态度\n$EFFECT_LIST_BULLET$确认议题后，再颁诏统一免除\n\n普通朝臣本职、私人爵产及其他雇主的职务保留。"
 game_concept_wj_ty_peerage_revocation:0 "褫夺爵位"
 game_concept_wj_ty_peerage_revocation_desc:0 "褫夺爵位，依爵制交还相应爵产。\n\n$EFFECT_LIST_BULLET$爵号、食邑与岁禄\n$EFFECT_LIST_BULLET$实封国及其封土、属臣依法交接\n$EFFECT_LIST_BULLET$宗族及支系保留\n\n须另议褫爵，不附于罢官事项。"
 WJ_ty_appointment_swap:0 "互换官职 · 需700分"
