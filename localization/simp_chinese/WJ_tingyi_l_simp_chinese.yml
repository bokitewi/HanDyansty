 WJ_ty_tt_blank:0 ""
 game_concept_wj_ty_agreement:0 "态度"
 game_concept_wj_ty_agreement_desc:0 "议臣对本议的赞否。\n\n$EFFECT_LIST_BULLET$提议者的影响：好感、亲属师友、声望及换取支持\n$EFFECT_LIST_BULLET$议题的影响：当事人、职位变动、自身利害、罪由与赏格\n$EFFECT_LIST_BULLET$两组均可增减，小计相加为总态度\n\n来源换算\n$EFFECT_LIST_BULLET$[opinion|E]：#V 30%#!\n$EFFECT_LIST_BULLET$[diplomacy|E]：#V 50%#!\n$EFFECT_LIST_BULLET$[prestige_level|E]基数：#V 50%#!\n$EFFECT_LIST_BULLET$同信仰[piety_level|E]基数：#V 40%#!\n$EFFECT_LIST_BULLET$亲属师友基础：#V 20%#!\n$EFFECT_LIST_BULLET$[Concept('merit', '贤望')|E]：每级#V 3#!\n$EFFECT_LIST_BULLET$有效[wj_ty_mufu_tie|E]：#V 20#!\n\n#P ≥75：强烈支持；25至不足75：支持#!\n大于−25且小于25：中立\n#N 大于−75至−25：反对；≤−75：强烈反对#!\n\n同人兼任共用态度，各席按其份额折算。"
 game_concept_wj_ty_lobby:0 "换取支持"
 game_concept_wj_ty_lobby_desc:0 "• 馈赠金帛：#P +30#!\n• 言语威胁：#P +20#!\n• 援引人脉：#P +20#!\n• 许以人情·[weak_hook|E]：#P +20#!\n• 许以重诺·[strong_hook|E]：#P +50#!\n• 使用[hook|E]：#P +100#!\n\n• 期限：#V 1年#!\n• 对象：本次[wj_ty_proposer|E]\n• 同人兼任：共用支持；同项不重复支付"
 game_concept_wj_ty_mufu_tie:0 "幕府从属"
 game_concept_wj_ty_mufu_tie_desc:0 "议臣与关联人具有有效的府主、幕僚关系。\n\n$EFFECT_LIST_BULLET$支持提议者或对方受益：#P +20#!\n$EFFECT_LIST_BULLET$对方失职失权：#N −20#!\n\n以当前有效隶属为准，同人同一关系不因兼任重复。"
 WJ_ty_tt_manager_line_0:0 "\n• [wj_ty_manager_weight|E]：[GetPlayer.MakeScope.ScriptValue('WJ_ty_tt_manager_0')|=+0]"
 WJ_ty_tt_manager_line_1:0 "\n• [wj_ty_manager_weight|E]：[GetPlayer.MakeScope.ScriptValue('WJ_ty_tt_manager_1')|=+0]"
 WJ_ty_tt_manager_line_5:0 "\n• [wj_ty_manager_weight|E]：[GetPlayer.MakeScope.ScriptValue('WJ_ty_tt_manager_5')|=+0]"
 WJ_ty_tt_military_weight_line:0 "\n• [wj_ty_military_weight|E]：[GetPlayer.MakeScope.ScriptValue('WJ_ty_military_weight')|=+0]"
 game_concept_wj_ty_seat_weight:0 "职位基础权重"
 game_concept_wj_ty_seat_weight_desc:0 "• 皇帝：[crown_authority|E]1—2级 #V 150#!；3级 #V 200#!；4级 #V 250#!\n• [Concept('diarch', '录尚书事')|E]：[diarchy|E]权力不足40为 #V 150#!；40至不足80为 #V 200#!；80及以上为 #V 250#!\n• 尚书令／大司马／大将军：各 #V 100#!\n• 侍中：#V 60#!\n• 中常侍：#V 40#!\n• [wj_ty_empty_seat|E]保留本职权重；录尚书事空席取 #V 150#!\n\n另计[wj_ty_manager_weight|E]与[wj_ty_military_weight|E]。"
 game_concept_wj_ty_manager_weight:0 "主管加权"
 game_concept_wj_ty_manager_weight_desc:0 "议题主管额外获得#V 200#!份额，依态度折算。\n\n$EFFECT_LIST_BULLET$拔擢、褒奖金帛：侍中\n$EFFECT_LIST_BULLET$推议公卿：录尚书事；缺席时归天子\n$EFFECT_LIST_BULLET$拜相：录尚书事\n$EFFECT_LIST_BULLET$罢相：天子\n$EFFECT_LIST_BULLET$罢免公卿、撤换地方官员：尚书令"
 game_concept_wj_ty_military_weight:0 "中外军权加权"
 game_concept_wj_ty_military_weight_desc:0 "实掌中外军权者额外获得#V 100#!份额。\n\n$EFFECT_LIST_BULLET$按持有者态度折算\n$EFFECT_LIST_BULLET$同人兼任只计一次\n$EFFECT_LIST_BULLET$境内无人持有中外军权时，亲政天子以首都军权获得此份额"
 game_concept_wj_ty_attitude:0 "态度换算"
 game_concept_wj_ty_attitude_desc:0 "• 强烈支持：#P ×100%#!\n• 支持：#P ×50%#!\n• 中立：×0%\n• 反对：#N ×−50%#!\n• 强烈反对：#N ×−100%#!\n\n作用于[wj_ty_seat_weight|E]、[wj_ty_manager_weight|E]及本席的[wj_ty_military_weight|E]。"
 game_concept_wj_ty_contribution:0 "总贡献"
