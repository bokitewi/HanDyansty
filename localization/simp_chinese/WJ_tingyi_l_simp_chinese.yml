 WJ_ty_removal_peerage_tt:0 "[wj_ty_peerage_revocation|E]\n\n#high 议定后果#!\n勾选后，爵号与食邑岁禄一并罢除，实封国依法撤销并交接封土、属臣。宗族仍存。\n\n未勾选则保留私人爵产。更改此项须重新确认议题。"
