 game_concept_wj_ty_deliberation:0 "廷议"
 game_concept_wj_ty_deliberation_desc:0 "朝廷诸臣就国事议决。各席以[wj_ty_agreement|E]决定[wj_ty_attitude|E]，再按职权计入[wj_ty_total|E]。"
 game_concept_wj_ty_proposer:0 "提议者"
 game_concept_wj_ty_proposer_desc:0 "提出本次[wj_ty_deliberation|E]的人。议臣的好感、关系与[wj_ty_lobby|E]均以此人为准。"
 game_concept_wj_ty_empty_seat:0 "空席"
 game_concept_wj_ty_empty_seat_desc:0 "无人担任的廷议席位。[wj_ty_agreement|E]按100计，保留该席的[wj_ty_seat_weight|E]。"
 game_concept_wj_ty_emperor_dependent:0 "天子旁落"
 game_concept_wj_ty_emperor_dependent_desc:0 "天子失去皇权或受他人控制时，沿当前辅政关系判断。\n\n$EFFECT_LIST_BULLET$天子本人提议：#P +100#!，不再计算其它来源\n$EFFECT_LIST_BULLET$提议者是天子的控制者：列[puppet|E]影响#P +1000#!，其它来源照常计算\n$EFFECT_LIST_BULLET$提议者不是控制者：保留随实际[Concept('diarch', '录尚书事')|E]态度的既定分流"
 game_concept_wj_ty_interest:0 "本题利害"
 game_concept_wj_ty_interest_desc:0 "本议对当事人的得失。\n\n$EFFECT_LIST_BULLET$本人受益：#P +40#!\n$EFFECT_LIST_BULLET$本人失职失权：#N −60#!\n$EFFECT_LIST_BULLET$每次职位变动只计一次；更替计离任，补空计新任\n$EFFECT_LIST_BULLET$任免不再另叠公卿身份分\n$EFFECT_LIST_BULLET$各当事人的关系与声望分别判断；转任不重算同一人的社会因素\n\n处分有适当罪由：#P +25#!；无适当罪由：#N −35#!。公正、专断只影响罪由判断。"
 game_concept_wj_ty_total:0 "廷议总分"
 game_concept_wj_ty_total_desc:0 "各席[wj_ty_contribution|E]之和；[wj_ty_military_weight|E]只计一次。达到[wj_ty_threshold|E]才能通过本议。"
 game_concept_wj_ty_threshold:0 "通过线"
 game_concept_wj_ty_threshold_desc:0 "• [wj_ty_total|E]达到本档要求\n• 主管[wj_ty_agreement|E]允许\n• 对象及子项资格满足\n• 费用足够\n• 已确认议题"
 game_concept_wj_ty_max:0 "全席支持时上限"
 game_concept_wj_ty_max_desc:0 "本次廷议全部席位强烈支持时的[wj_ty_total|E]，包含[wj_ty_manager_weight|E]和[wj_ty_military_weight|E]。"
 game_concept_wj_ty_merit_cap:0 "贤望上限"
 game_concept_wj_ty_merit_cap_desc:0 "拔擢使受益者的[wj_mingwang|E]上限永久提高。同类拔擢只保留最高档；已有较低加成时，仅增加两档的差额。同一人受此拔擢后，一年内不能再次获赐。"

 WJ_ty_luzhi_desc_chu_no_road:0 "既无官职在身，也没有辟召、孝廉或茂才的出身，故为[wj_chushi|E]。贤望只能抬高日后可任之官的上限；须先取得入仕出身，再蒙任命，方有[wj_luyi|E]可言。"
 WJ_ty_luzhi_desc_chu_with_road:0 "虽已有入仕出身，眼下却未任官职，故仍以[wj_chushi|E]身份居于朝野。下方所列的贤望任官上限，只是可受任的最高范围；须蒙任命，方按官职定其[wj_luyi|E]。"
 WJ_ty_luzhi_desc_official:0 "现为[Character.Custom('WJ_BandWord')]，这是依所任最高官职而定的[wj_luyi|E]。入仕出身决定能否列入择官之选，贤望决定可受任的最高范围；二者都不能越过官职，径自改变其禄秩。"
 WJ_ty_luzhi_desc_shi_no_road:0 "眼下未任官职，也尚无辟召、孝廉或茂才的出身；因是无地士族，故显示为[wj_shizu|E]，但士族之名既非官职，也非禄秩。须先取得入仕出身，再蒙任命，方按官职定其[wj_luyi|E]。"
 WJ_ty_luzhi_desc_shi_with_road:0 "虽已有入仕出身，眼下却未任官职；因是无地士族，故显示为[wj_shizu|E]。下方所列的贤望任官上限，只是可受任的最高范围；须蒙任命，方按官职定其[wj_luyi|E]。"
 WJ_ty_luzhi_desc_shou:0 "已任官职，却尚无辟召、孝廉或茂才的出身，只能暂以[wj_shishou|E]任事，未得此职应有的[wj_luyi|E]。贤望任官上限不等于眼下禄秩；地方试守随五年考课转正，良举孝廉、优举茂才，平续守、差劣卸任。不属地方考课范围的试守者另行一年三轮考试，四十分通过、失败续期，转正后依所任官职正式定秩。"
 WJ_ty_reward_small_favor:0 "蒙廷议嘉奖"
 WJ_ty_result_merit_1:0 "褒书至府，始知微劳亦见于朝廷。承此嘉奖，当益勉其所未能，不敢以今日之誉自足。"
 WJ_ty_result_merit_2:0 "有司录功，朝廷优加奖擢。一纸褒书，足慰平生勤勉；此后居官行事，尤不敢负此知遇。"
 WJ_ty_result_merit_3:0 "殊命忽至，门庭增光。受此隆恩，非寻常称许可比；知遇之重，当铭之于心，俟有事而报。"
 WJ_ty_result_gold_1:0 "使者持节而至，赍金入府。拜读褒诏，乃知朝廷不遗微劳；谨奉书称谢，惟愿更效绵薄。"
 WJ_ty_result_gold_2:0 "金帛随诏而来，府中上下皆以为荣。厚赐既受，感念知遇，今后自当勉力，以答此恩。"
 WJ_ty_result_gold_3:0 "使者宣诏，赐金盈庭。此番殊赉，恩礼隆重，非一纸谢书所能尽；若有所命，愿竭力相报。"
 WJ_ty_tt_reward_relations_1:0 "\n• 对[wj_ty_proposer|E]的[opinion|E]：#P +20#! · 5年"
 WJ_ty_tt_reward_relations_2:0 "\n• 对[wj_ty_proposer|E]的[opinion|E]：#P +50#! · 5年"
 game_concept_wj_ty_opinion:0 "双方的好感"
 game_concept_wj_ty_opinion_desc:0 "议臣对关联人的[opinion|E]所产生的态度影响。\n\n$EFFECT_LIST_BULLET$实际好感×#V 30%#!\n$EFFECT_LIST_BULLET$亲近提议者助支持，亲近受益者助支持\n$EFFECT_LIST_BULLET$亲近受损者增反对，仇敌方向相反\n\n亲属师友的政治亲附另按标准基础的#V 20%#!计入，强弱别名不重复；威望、[diplomacy|E]、同信仰虔诚、贤望与幕府关系分别列出。"

 WJ_ty_tier_requirements:0 "• [Concept('wj_ty_manager_weight', '主管')|E]：侍中，须在任\n• [Concept('wj_ty_agreement', '主管态度')|E]：[GetPlayer.Custom('WJ_ty_tt_manager_required')]\n• [Concept('character', '对象')|E]：本朝在世人物\n• [wj_ty_deliberation|E]：选定对象与档位后确认"

 WJ_ty_tt_manager_neutral:0 "至少中立"

 WJ_ty_tt_manager_support:0 "#P 至少支持#!"

 WJ_ty_tier_merit_cost:0 "\n• 费用：无额外支出\n• [wj_ty_merit_cap|E]：对象一年内未受本项拔擢"

