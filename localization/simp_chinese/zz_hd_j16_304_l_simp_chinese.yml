l_simp_chinese:
 hd_j16.0200.t:0 "江东劝进"
 hd_j16.0200.desc:0 "洛阳、长安相继陷没，天子落在胡人手里，生死未卜。江东的士人一次次上表劝进，王导侍立在侧，王敦拥兵上游，都在等你一句话。名分不早定下来，南渡的人心便要散了。"
 hd_j16.0200.a:0 "暂即王位，以系人心。"
 hd_j16.0200.b:0 "天子蒙尘，臣不敢僭。"
 hd_j16.0300.t:0 "大陵之役"
 hd_j16.0300.desc:0 "东嬴公司马腾遣将聂玄来攻，兵锋已到大陵。左国城中，五部豪帅齐聚帐下，只等你一声令下。晋室诸王自相屠戮，正是匈奴复兴的时候。"
 hd_j16.0300.a:0 "发五部之众，迎击大陵。"
 hd_j16.0300.b:0 "且按兵不动，静观其变。"
 hd_j16.0101.t:0 "挟驾西还"
 hd_j16.0101.desc:0 "张方的兵马驻在洛阳城中，掳掠无度，人心惶惶。他请你把天子迎到长安去：关中是你的根本，天子在手，诸王便不敢轻动。只是天子一旦离开洛阳，天下人都会说你挟持乘舆。"
 hd_j16.0101.a:0 "奉迎乘舆，西还长安。"
 hd_j16.0101.b:0 "天子不可轻动，仍留洛阳。"
 hd_j16.0102.t:0 "乘舆西迁"
 hd_j16.0102.desc:0 "张方纵兵入宫，挟你登车西去。宫人哭号相随，府库被抢掠一空。到长安以后，一切政令都出自河间王府。洛阳只留下荀藩、周馥等人主持留台，名义上仍算朝廷。"
 hd_j16.0102.a:0 "此行何日能还？"
 hd_j16.0103.t:0 "传檄迎驾"
 hd_j16.0103.desc:0 "河间王挟天子据守关中，政令出自私门。你身为宗室近属，镇守东方，山东诸侯都在看你的态度。王浚愿意派祁弘率领鲜卑突骑相助，范阳王也已经站到你这一边。"
 hd_j16.0103.a:0 "传檄四方，起兵迎驾。"
 hd_j16.0103.b:0 "暂且观望。"
 hd_j16.0104.t:0 "邺下余众"
 hd_j16.0104.desc:0 "成都王失了邺城，旧部四散。公师藩在赵、魏一带聚众数万，打出为成都王复仇的旗号；牧帅汲桑也带着人马来投，请你一起举事。"
 hd_j16.0104.a:0 "与汲桑同投公师藩。"
 hd_j16.0104.b:0 "不受旁人节制，自行其是。"
 hd_j16.0105.t:0 "许昌之争"
 hd_j16.0105.desc:0 "范阳王司马虓据守许昌，已经倒向东海王。河间王派人送来檄书，许诺只要你攻取颍川，就上表让你领豫州。刘琨兄弟正在许昌，他们手下的幽州突骑很不好对付。"
 hd_j16.0105.a:0 "依附河间王，进攻许昌。"
 hd_j16.0105.b:0 "两不相助，按兵自守。"
 hd_j16.0106.t:0 "张方之首"
 hd_j16.0106.desc:0 "东军越逼越近。有人献计：天下人都把罪过归在张方身上，只要斩了他，把首级送给东海王，和议就能谈成。可张方跟随你多年，关中的兵马大半在他手里。"
 hd_j16.0106.a:0 "斩张方，传首求和。"
 hd_j16.0106.b:0 "不杀张方，倚仗他再战。"
 hd_j16.0107.t:0 "迎驾还洛"
 hd_j16.0107.desc:0 "关中已经平定，天子就在你的军中。诸将都说应当奉驾回洛阳，以安天下人心。也有人劝你暂且留在长安，就近控制关中。"
 hd_j16.0107.a:0 "奉驾还洛，入朝秉政。"
 hd_j16.0107.b:0 "暂且奉驾留在长安。"
 hd_j16.0108.t:0 "顿丘之囚"
 hd_j16.0108.desc:0 "你在逃亡途中被顿丘太守冯嵩拿住，押往邺城。范阳王已死，长史刘舆怕邺中旧部拥戴你，正在谋划假传诏书赐你一死。看守里有人愿意趁夜放你出去。"
 hd_j16.0108.a:0 "事已至此，引颈就戮。"
 hd_j16.0108.b:0 "趁夜出逃，投奔石勒。"
 hd_j16.0110.t:0 "兵临邺城"
 hd_j16.0110.desc:0 "东燕王司马腾移镇邺城，库中储积丰厚，却吝于赏赐，将士怨声载道。汲桑请求以替成都王报仇为名，直取邺城。"
 hd_j16.0110.a:0 "发兵攻邺。"
 hd_j16.0110.b:0 "时机未到，暂不进兵。"
 hd_j16.0111.t:0 "遣将追讨"
 hd_j16.0111.desc:0 "汲桑攻破邺城，焚毁宫室，杀了东燕王，河北为之震动。苟晞在你帐下，善于用兵，人称屠伯，请求率领本部追讨。"
 hd_j16.0111.a:0 "命苟晞率兵追讨。"
 hd_j16.0111.b:0 "暂缓出兵。"
 hd_j16.0112.t:0 "论功授郡"
 hd_j16.0112.desc:0 "苟晞追击汲桑，连战连胜，河北大致平定。东海王上表，请求以东郡授给苟晞，让他坐镇兖州。"
 hd_j16.0112.a:0 "准奏，以东郡授苟晞。"
 hd_j16.0112.b:0 "功不至此，不予授郡。"
 hd_j16.0113.t:0 "清君侧"
 hd_j16.0113.desc:0 "天子身边的缪播、缪胤等人深得信任，你怀疑他们在暗中谋划对付你。你已经带兵入京，只要一声令下，就能把这些人当着天子的面收捕斩首。"
 hd_j16.0113.a:0 "收捕缪播等人，就地斩首。"
 hd_j16.0113.b:0 "暂且容忍。"
 hd_j16.0114.t:0 "殿前收人"
 hd_j16.0114.desc:0 "东海王带兵进入宫中，当着你的面把缪播、缪胤等十余人拿下处死。你只能看着，一句话也说不出。"
 hd_j16.0114.a:0 "朕何以为人君！"
 hd_j16.0116.t:0 "宁平城"
 hd_j16.0116.desc:0 "东海王死在项县，王衍等人护送灵柩东归，十几万将士、官属和宗室随行，毫无防备。你的骑兵已经在宁平城追上了他们。"
 hd_j16.0116.a:0 "纵骑围射，尽歼其众。"
 hd_j16.0116.b:0 "放他们过去。"
 hd_j16.0117.t:0 "东莱起事"
 hd_j16.0117.desc:0 "你跟着刘伯根在东莱起事，攻掠青、徐一带，晋军苦于应付。刘伯根战死之后，部众多半溃散。汉王刘渊派人来招降，许诺授你官爵。"
 hd_j16.0117.a:0 "西投汉王。"
 hd_j16.0117.b:0 "仍留在晋地。"
 hd_j16.0118.t:0 "凉州勤王"
 hd_j16.0118.desc:0 "京城被围，天子屡次下诏征兵，四方却很少有人响应。北宫纯请求率领凉州兵东下勤王。"
 hd_j16.0118.a:0 "遣北宫纯东援，再输金帛。"
 hd_j16.0118.b:0 "凉州路远，只能自守。"
 hd_j16.0700.t:0 "皇太弟之争"
 hd_j16.0700.desc:0 "天子没有成年的儿子，储位迟迟未定。成都王、豫章王、清河王都有各自的支持者，必须尽快定下一位。"
 hd_j16.0700.a:0 "立成都王颖为皇太弟。"
 hd_j16.0700.b:0 "立豫章王炽为皇太弟。"
 hd_j16.0700.c:0 "复立清河王覃。"
 hd_j16.0701.t:0 "请立储君"
 hd_j16.0701.desc:0 "有宗王上表，自请立为储君，说天下大乱，正需要年长的君主。准还是不准，都会得罪另一方。"
 hd_j16.0701.a:0 "准其所请。"
 hd_j16.0701.b:0 "储位已有定论。"
 hd_j16.0702.t:0 "请镇邺城"
 hd_j16.0702.desc:0 "并州连年饥荒，盗贼遍地。并州之主请求率领乞活之众东下邺城就食，并请朝廷把魏郡交给他镇守。"
 hd_j16.0702.a:0 "准其移镇邺城。"
 hd_j16.0702.b:0 "邺城不可轻授。"
 hd_j16_ruchao_decision:0 "入朝辅政"
 hd_j16_ruchao_decision_desc:0 "天子居于深宫，朝政由谁主持，诸王都想争。只要兵力足够、能够掌握京城，就可以入朝辅政，以天子的名义号令天下。"
 hd_j16_ruchao_decision_tooltip:0 "你将成为天子的封臣，并作为权臣主持朝政。原来的权臣罢官；如果他原本是朝贡王，则归藩重新朝贡。其他宗王会忌恨你。"
 hd_j16_ruchao_decision_confirm:0 "入朝！"
 hd_j16_ruchao_reach_tt:0 "京城或天子所在县在你的势力范围内；或者现在没有权臣，而你的领地里有京城所在郡的县"
 hd_j16_ruchao_army_tt:0 "你的兵力不少于现任权臣"
 hd_j16_ruchao_cd_tt:0 "你最近才出镇还藩"
 hd_j16_chuzhen_decision:0 "出镇还藩"
 hd_j16_chuzhen_decision_desc:0 "朝中积怨已深，藩国才是立身的根本。辞去朝政，回到藩国，依旧以朝贡王的身份奉事天子。"
 hd_j16_chuzhen_decision_tooltip:0 "你将辞去权臣与朝官，带着自己的封臣回到藩国，重新成为天子的朝贡王。三年内不能再入朝。"
 hd_j16_chuzhen_decision_confirm:0 "还藩。"
 hd_j16_chuzhen_defending_tt:0 "你没有在打防守战"
 hd_j16_xiqian_decision:0 "挟天子西迁"
 hd_j16_xiqian_decision_desc:0 "京城不在自己的根据地，终究受制于人。把天子迁到你的治所，诸王就更难插手。"
 hd_j16_xiqian_decision_tooltip:0 "京城改到你的首府县，天子移驻该地，并受「蒙尘」之累。其余宗王会对你不满。"
 hd_j16_xiqian_decision_confirm:0 "迁都！"
 hd_j16_xiqian_same_tt:0 "京城还不在你的首府县"
 hd_j16_chuanxi_decision:0 "传檄迎驾"
 hd_j16_chuanxi_decision_desc:0 "权臣挟持天子，专擅朝政。传檄四方，号召诸王一同起兵迎驾。"
 hd_j16_chuanxi_decision_tooltip:0 "你将结束对天子的朝贡，向天子与权臣一方宣战，并得到八千事件兵。与权臣不睦的宗王可能起兵响应。战场选在京城所在之郡；京城之郡夹有天子直辖或他王之地时，改在权臣首府所在之郡。此战只为迎驾秉政，得胜也不割取土地。若无处可战，就不会开战，威望如数退还。"
 hd_j16_chuanxi_decision_confirm:0 "传檄！"
 hd_j16_chuanxi_cd_tt:0 "你最近已经传过檄文"
 hd_j16_huanluo_decision:0 "迎驾还洛"
 hd_j16_huanluo_decision_desc:0 "洛阳是旧都，宗庙所在。奉天子回到洛阳，天下人心才能安定。"
 hd_j16_huanluo_decision_tooltip:0 "京城迁回洛阳，天子移驻洛阳。如果你还不是权臣，就同时入朝秉政。"
 hd_j16_huanluo_decision_confirm:0 "还洛！"
 hd_j16_huanluo_luoyang_tt:0 "洛阳在你或天子一方手中"
 hd_j16_taidi_decision:0 "皇太弟之争"
 hd_j16_taidi_decision_desc:0 "天子没有成年的儿子，储位悬而未决。天子或权臣可以直接定下储君，候选人也可以上表自请。"
 hd_j16_taidi_decision_tooltip:0 "天子或权臣：从成都王、豫章王、清河王中选立一人。候选人：向天子（或代答的权臣）请立自己。落选者会怨恨作决定的人。"
 hd_j16_taidi_decision_confirm:0 "定储！"
 hd_j16_taidi_noson_tt:0 "天子没有成年的儿子"
 hd_j16_taidi_two_tt:0 "成都王、豫章王、清河王中至少有两人在世"
 hd_j16_qihuo_decision:0 "收乞活"
 hd_j16_qihuo_decision_desc:0 "并州饥荒，流民成群结队，自称乞活。把他们收编成军，既能安抚流民，也能增强兵力。"
 hd_j16_qihuo_decision_tooltip:0 "在首府募得五千乞活兵（不可继承）。如果你据有并州之郡而邺城无主或属于天子，天子可能把魏郡授给你。"
 hd_j16_qihuo_decision_confirm:0 "收编！"
 hd_j16_mengchen_modifier:0 "蒙尘"
 hd_j16_mengchen_modifier_desc:0 "天子被迫离开京城，流离在外，威信大损。"
 hd_j16_yegong_burned_modifier:0 "邺宫焚毁"
 hd_j16_yegong_burned_modifier_desc:0 "邺城宫室被乱兵焚毁，元气大伤。"
 hd_j16_zhuanheng_modifier:0 "专横"
 hd_j16_zhuanheng_modifier_desc:0 "在天子面前擅杀近臣，朝野侧目。"
 hd_j16_zhuanshan_opinion:0 "专擅朝政"
 hd_j16_chuzhen_opinion:0 "辞政还藩"
 hd_j16_xiqian_opinion:0 "挟天子西迁"
 hd_j16_taidi_opinion:0 "储位落选"
 hd_j16_qingjun_opinion:0 "殿前擅杀"
 hd_j16_zhangfang_spared_opinion:0 "庇护张方"
 hd_j16_yingjia_army_name:0 "东海王军"
 hd_j16_xianbei_army_name:0 "鲜卑突骑"
 hd_j16_shile_army_name:0 "石勒骑兵"
 hd_j16_ying_army_name:0 "成都王旧部"
 hd_j16_xuchang_army_name:0 "刘乔军"
 hd_j16_youzhou_army_name:0 "幽州突骑"
 hd_j16_zhangfang_army_name:0 "张方部"
 hd_j16_poye_army_name:0 "汲桑军"
 hd_j16_gouxi_army_name:0 "苟晞军"
 hd_j16_qihuo_army_name:0 "乞活"
 hd_j16_wangmi_army_name:0 "王弥军"
 hd_j16_liangzhou_army_name:0 "凉州兵"
 hd_j16.0201.t:0 "长安孤城"
 hd_j16.0201.desc:0 "关中连年饥馑，长安城里斗米值金，愍帝的禁卫不满千人，麴允、索綝只能拆屋为薪。平阳传来诏令：只要你挥师西进，这座孤城便守不过一个冬天。"
 hd_j16.0201.a:0 "尽起关东之兵，西取长安。"
 hd_j16.0201.b:0 "长安不足取，且待来年。"
 hd_j16.0202.t:0 "清君侧"
 hd_j16.0202.desc:0 "刘隗、刁协日夜在天子耳边进言，要削王氏的兵权。你坐镇武昌，手握上游之师，帐下钱凤劝你东下：以诛刘隗为名，兵临石头，天下谁敢不从？"
 hd_j16.0202.a:0 "传檄建康，以诛刘隗为名东下。"
 hd_j16.0202.b:0 "君臣之分不可犯，暂且隐忍。"
 hd_j16.0203.t:0 "讨王敦"
 hd_j16.0203.desc:0 "王敦屯兵姑孰，自领扬州牧，朝中大小事都要先报他的军府。他病了，钱凤、沈充却在替他调兵。郗鉴、温峤都劝你：趁他病重，一战可定。"
 hd_j16.0203.a:0 "下诏讨逆，亲率六军。"
 hd_j16.0203.b:0 "朝廷兵少，不如再忍一时。"
 hd_j16.0204.t:0 "历阳兵变"
 hd_j16.0204.desc:0 "庾亮一定要召你入朝做大司农，名为升迁，实则夺你的兵。你手下的流民跟了你十几年，离了你便无处可去。祖约在寿春也憋着一口气，只等你先动。"
 hd_j16.0204.a:0 "以诛庾亮为名，举兵渡江。"
 hd_j16.0204.b:0 "奉诏入朝，听天由命。"
 hd_j16.0205.t:0 "荆州之任"
 hd_j16.0205.desc:0 "镇守荆州的大臣已经去世。荆州居长江上游，兵强粮足，向来是朝廷最放心不下的地方。朝中公议推举一位继任者，请你定夺。"
 hd_j16.0205.a:0 "依议授之，命其出镇。"
 hd_j16.0205.b:0 "荆州之地，朕自领之。"
 hd_j16.0301.t:0 "宫变"
 hd_j16.0301.desc:0 "先帝的灵柩还没下葬，靳准就带兵闯进了光极殿。你在后宫纵情声色的这些日子，宫门、禁军早已换成了他的人。\n\n他按剑立在阶下，请你「让位」。交出玺绶，或许还能保住性命；不肯交，就只能与他兵戎相见。"
 hd_j16.0301.a:0 "大势已去，交出玺绶，以保性命。"
 hd_j16.0301.b:0 "逆贼安敢！召集诸王，讨平靳氏！"
 hd_j16.0302.t:0 "更国号为赵"
 hd_j16.0302.desc:0 "平阳已是一片废墟，靳氏的乱党刚刚伏诛。群臣请你定都长安，并改换国号：匈奴的单于后裔，用不着再借刘汉的名义了。你早年受封中山王，中山本是赵地，就称「赵」吧。"
 hd_j16.0302.a:0 "定都长安，国号曰赵。"
 hd_j16.0302.b:0 "汉家名号，不可轻弃。"
 hd_j16.0303.t:0 "刘曜西来"
 hd_j16.0303.desc:0 "刘曜号称二十八万大军，营帐沿着黄河连绵百里，河西大震。参军马岌劝你亲出迎战；也有人说，凉州偏远，向他称藩纳贡，就能保全一方。"
 hd_j16.0303.a:0 "遣使称藩，保境安民。"
 hd_j16.0303.b:0 "据河而守，誓不称臣。"
 hd_j16.0304.t:0 "金墉之围"
 hd_j16.0304.desc:0 "刘曜亲率大军围攻金墉，石生困守待援，河北为之震动。程遐等人都劝你不要轻出，你却觉得刘曜屯兵坚城之下、日日纵酒，正是一举擒他的时候。"
 hd_j16.0304.a:0 "亲率大军，直趋洛阳。"
 hd_j16.0304.b:0 "坚守不出，以待其敝。"
 hd_j16.0305.t:0 "上邽余烬"
 hd_j16.0305.desc:0 "刘曜兵败被擒，赵国太子刘熙和南阳王刘胤弃了长安，逃奔上邽。关陇人心浮动，正是一举扫平的时候。"
 hd_j16.0305.a:0 "发兵西进，直取上邽。"
 hd_j16.0305.b:0 "穷寇勿追。"
 hd_j16.0351.t:0 "葛陂霖雨"
 hd_j16.0351.desc:0 "大军屯在葛陂，本想南下建邺，不料连下三个月大雨，营中饥疫交加，死者过半。张宾进言：邺城有三台之固，襄国依山凭险，不如北还，据河北以成霸业。"
 hd_j16.0351.a:0 "依张宾之策，北据襄国。"
 hd_j16.0351.b:0 "大丈夫当一战定江南！"
 hd_j16.0352.t:0 "诈降袭蓟"
 hd_j16.0352.desc:0 "王浚自以为天命在己，正想称帝。张宾献计：你只要卑辞厚礼，奉表称臣，王浚必然轻信。等他开城相迎，便可一举擒之。"
 hd_j16.0352.a:0 "依计而行，轻骑袭蓟。"
 hd_j16.0352.b:0 "此计太险，作罢。"
 hd_j16.0353.t:0 "取并州"
 hd_j16.0353.desc:0 "刘琨困守晋阳多年，部下离散，拓跋氏的援兵也因内乱北还。箕澹劝刘琨深沟高垒，刘琨却执意出战。并州唾手可得。"
 hd_j16.0353.a:0 "发兵北上，直取晋阳。"
 hd_j16.0353.b:0 "暂不北顾。"
 hd_j16.0354.t:0 "称赵王"
 hd_j16.0354.desc:0 "平阳的刘曜已经另立朝廷，迁都长安。张宾、程遐率文武百官上表，请你据有河北二十四郡，自称赵王，不再受他人节制。"
 hd_j16.0354.a:0 "即赵王位。"
 hd_j16.0354.b:0 "仍奉汉室正朔。"
 hd_j16.0355.t:0 "厌次之围"
 hd_j16.0355.desc:0 "段匹磾杀了刘琨，失尽人心，逃到厌次投靠邵续。石虎请命出征：只要拿下厌次，幽、冀之间就再无人能与你抗衡。"
 hd_j16.0355.a:0 "命石虎出征。"
 hd_j16.0355.b:0 "段氏已不足为患。"
 hd_j16.0356.t:0 "即皇帝位"
 hd_j16.0356.desc:0 "前赵已灭，关陇、河北尽入版图。群臣再三劝进，请你即皇帝位，改元建平。也有人说，先称天王、行皇帝事，更显谦退。"
 hd_j16.0356.a:0 "即皇帝位，改元建平。"
 hd_j16.0356.b:0 "先称天王，行皇帝事。"
 hd_j16.0357.t:0 "居摄"
 hd_j16.0357.desc:0 "石虎带兵入宫，把玺绶捧到你面前，请你「让位」。满朝文武都看着地面，没有一个人开口。\n\n逊位，或许还能以布衣之身苟全性命；拒绝，石虎就会回到他的镇所举兵，骨肉之间必有一战。"
 hd_j16.0357.a:0 "只能如此，逊位以保性命。"
 hd_j16.0357.b:0 "先帝的江山，岂能拱手让人！"
 hd_j16.0358.t:0 "令支之役"
 hd_j16.0358.desc:0 "段辽屡次犯边，又与慕容氏结仇。如今两家都想灭段，正可约定夹击，一举拿下令支。"
 hd_j16.0358.a:0 "发兵攻段。"
 hd_j16.0358.b:0 "不必劳师远征。"
 hd_j16_junziying_modifier:0 "君子营"
 hd_j16_junziying_modifier_desc:0 "收罗流散的衣冠士人，另立一营以礼相待，张宾为谋主。"
 hd_j16_qingxin_modifier:0 "轻信"
 hd_j16_qingxin_modifier_desc:0 "误信敌人诈降，城门大开，兵马不设防备。"
 hd_j16_zhuanquan_modifier:0 "专权"
 hd_j16_zhuanquan_modifier_desc:0 "总揽朝政，生杀予夺都出自一人之手。"
 hd_j16_zuti_army_name:0 "祖逖部曲"
 hd_j16_liuyao_army_name:0 "刘曜军"
 hd_j16_wangdun_army_name:0 "王敦军"
 hd_j16_jinjun_army_name:0 "六军"
 hd_j16_sujun_army_name:0 "苏峻军"
 hd_j16_taokan_army_name:0 "陶侃之师"
 hd_j16_shihu_army_name:0 "石虎军"
 hd_j16_jinzhun_army_name:0 "靳氏禁兵"
 hd_j16_shisheng_army_name:0 "石生军"
 hd_j16_murong_army_name:0 "慕容鲜卑"
 hd_j16_hejian_fief_name:0 "河间"
 hd_j16_hejian_fief_name_adj:0 "河间"
 hd_j16_xiqian_enter_tt:0 "司马颙入朝为天子封臣、任权臣，并以关中四郡实封#high 河间王#!"
