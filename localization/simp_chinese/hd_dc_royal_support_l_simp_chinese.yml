l_simp_chinese:
 hd_dc_request_royal_support_interaction: "请求支持王位"
 hd_dc_request_royal_support_interaction_desc: "修书一封，许以酬金，请对方公开支持你的宣称。"
 hd_dc_support_reward_g1: "许以三十金"
 hd_dc_support_reward_g2: "许以百金"
 hd_dc_support_reward_g3: "许以三百金"
 hd_dc_support.0008.t: "请君相助"
 hd_dc_support.0008.desc: "[hd_dc_support_claimant.GetTitledFirstName]的信写得开门见山。问过家眷安好，纸上便列出了[hd_dc_support_claimant.GetHerHis]对大位的主张，以及请你公开加入的那一派。\n\n信末许下的酬金写得清清楚楚：[hd_dc_support.Var('hd_dc_support_reward_gold').GetValue|0]金，只要你的名字列入支持者之中，便即奉上。\n\n收下这封信，还不等于答应。要不要让自己的名字出现在这份主张之下，得由你自己拿主意。"
 hd_dc_support.0008.a: "愿列名其中，以附骥尾。"
 hd_dc_support.0008.c: "吾心仍在今上。"
 hd_dc_support.0008.invalid: "时移事易，此信已无从谈起。"
 hd_dc_support.0108.t: "名字落定之后"
 hd_dc_support.0108.paid: "回信与名册都已送到。[scope:hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName]的名字列进了[scope:hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]一派，许下的酬金也已从[scope:hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]的私库中如数送出。\n\n这一笔招揽算是成了。至于往后的刀兵胜负，还得看天下大势，不是一封回信能写定的。"
 hd_dc_support.0108.unpaid: "[scope:hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName]已经列名[scope:hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]一派，许下的酬金却没能如数送到。\n\n经手的人把欠下的数目记在账上，没有再开第二张付款的条子。这笔账，迟早还要有个了结。"
 hd_dc_support.0108.refused: "回信写得明白：[scope:hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName]仍奉今上，不愿加入[scope:hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]一派。\n\n名册上没有添人，酬金也一文未动。彼此的心意既已知晓，这封信，暂且不必再寄。"
 hd_dc_support.0108.failed: "回信已经送到，可[scope:hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName]终究没能列入[scope:hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]一派的名册。\n\n经手的人停下了酬金的支付，没有把一句口头的应允，当成已经到手的支持。"
 hd_dc_support.0108.a: "且记于心。"
