 hd_form_saved_k_hezhou_decision:0 "设立河州"
 hd_form_saved_k_hezhou_decision_desc:0 "金城、陇西的使者相继来到庭前，带来的却仍是各郡的簿册。河州诸郡若能归于一署，沿河的关津、仓廪与兵役便有了共同的主事之人。\n\n#weak 须完整控制存档清单中至少4/5个公国；成立后恢复这些公国对河州的法理归属。#!"
