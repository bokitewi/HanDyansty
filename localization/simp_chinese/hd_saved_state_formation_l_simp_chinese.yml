 hd_form_saved_k_yongzhou_decision:0 "设立雍州"
 hd_form_saved_k_yongzhou_decision_desc:0 "安定与冯翊之间，郡县各有所属，往来文书却终须汇于一处。如今诸郡渐入我掌中，雍州之名也该有一道真正号令四境的州府。\n\n#weak 须完整控制存档清单中至少6/7个公国；成立后恢复这些公国对雍州的法理归属。#!"
 hd_form_saved_k_yongzhou_decision_tooltip:0 "统合存档清单中的诸郡，设立雍州。"
 hd_form_saved_k_yongzhou_decision_confirm:0 "立州定制。"
 hd_form_saved_k_yongzhou_decision_requirement:0 "你是独立的有地统治者；雍州无人持有；完整控制存档清单中至少6/7个公国（80%，向上取整）"
