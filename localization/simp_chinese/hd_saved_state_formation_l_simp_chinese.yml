 hd_form_saved_k_luozhou_decision_desc:0 "洛阳旧有的声望仍在，京畿诸郡却不能只凭一个旧名维系。我将召集属吏，重定州府统属，使四方来文有处可投，政令有路可行。\n\n#weak 须完整控制存档清单中至少5/6个公国；成立后恢复这些公国对洛州的法理归属。#!"
