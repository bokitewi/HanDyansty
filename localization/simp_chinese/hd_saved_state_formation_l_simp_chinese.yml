 hd_form_saved_k_xiangzhou_decision:0 "设立湘州"
 hd_form_saved_k_xiangzhou_decision_desc:0 "湘水两岸的使者在廊下等候，各自握着本郡的文书。我看过疆域图，知道这些地方不能永远各自为政。湘州的名号，将成为统合它们的开端。\n\n#weak 须完整控制存档清单中至少8/9个公国；成立后恢复这些公国对湘州的法理归属。#!"
