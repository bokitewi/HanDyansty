l_simp_chinese:
 hd_form_saved_k_yongzhou_decision:0 "设立雍州"
 hd_form_saved_k_yongzhou_decision_desc:0 "安定与冯翊之间，郡县各有所属，往来文书却终须汇于一处。如今诸郡渐入我掌中，雍州之名也该有一道真正号令四境的州府。"
 hd_form_saved_k_yongzhou_decision_tooltip:0 "统合旧辖诸郡，设立雍州"
 hd_form_saved_k_yongzhou_decision_confirm:0 "立州定制。"
 hd_form_saved_k_yongzhou_decision_requirement:0 "雍州尚无人执掌，且其旧辖七郡中至少有六郡已全境归你掌控"
 hd_form_saved_k_yongzhou_decision_effect:0 "你据有雍州，其旧辖七郡复归雍州的[de_jure|E]统属"
 hd_form_saved_k_qinzhou_decision:0 "设立秦州"
 hd_form_saved_k_qinzhou_decision_desc:0 "陇山以西，天水、武都诸郡扼着山川道路。若要让这里的军粮与政令不再各行其是，我便须把案上的疆界变成一州的章程。"
 hd_form_saved_k_qinzhou_decision_tooltip:0 "统合旧辖诸郡，设立秦州"
 hd_form_saved_k_qinzhou_decision_confirm:0 "立州定制。"
 hd_form_saved_k_qinzhou_decision_requirement:0 "秦州尚无人执掌，且其旧辖七郡中至少有六郡已全境归你掌控"
 hd_form_saved_k_qinzhou_decision_effect:0 "你据有秦州，其旧辖七郡复归秦州的[de_jure|E]统属"
 hd_form_saved_k_hezhou_decision:0 "设立河州"
 hd_form_saved_k_hezhou_decision_desc:0 "金城、陇西的使者相继来到庭前，带来的却仍是各郡的簿册。河州诸郡若能归于一署，沿河的关津、仓廪与兵役便有了共同的主事之人。"
 hd_form_saved_k_hezhou_decision_tooltip:0 "统合旧辖诸郡，设立河州"
 hd_form_saved_k_hezhou_decision_confirm:0 "立州定制。"
 hd_form_saved_k_hezhou_decision_requirement:0 "河州尚无人执掌，且其旧辖五郡中至少有四郡已全境归你掌控"
 hd_form_saved_k_hezhou_decision_effect:0 "你据有河州，其旧辖五郡复归河州的[de_jure|E]统属"
 hd_form_saved_k_luozhou_decision:0 "设立洛州"
 hd_form_saved_k_luozhou_decision_desc:0 "洛阳旧有的声望仍在，京畿诸郡却不能只凭一个旧名维系。我将召集属吏，重定州府统属，使四方来文有处可投，政令有路可行。"
 hd_form_saved_k_luozhou_decision_tooltip:0 "统合旧辖诸郡，设立洛州"
 hd_form_saved_k_luozhou_decision_confirm:0 "立州定制。"
 hd_form_saved_k_luozhou_decision_requirement:0 "洛州尚无人执掌，且其旧辖六郡中至少有五郡已全境归你掌控"
 hd_form_saved_k_luozhou_decision_effect:0 "你据有洛州，其旧辖六郡复归洛州的[de_jure|E]统属"
 hd_form_saved_k_sizhou_decision:0 "设立司州"
 hd_form_saved_k_sizhou_decision_desc:0 "魏郡、河内之间的道路已握在我手中，来往郡吏却仍各守一套旧例。我需要一个共同的州名，把这些郡县的赋役和号令重新联结起来。"
 hd_form_saved_k_sizhou_decision_tooltip:0 "统合旧辖诸郡，设立司州"
 hd_form_saved_k_sizhou_decision_confirm:0 "立州定制。"
 hd_form_saved_k_sizhou_decision_requirement:0 "司州尚无人执掌，且其旧辖五郡中至少有四郡已全境归你掌控"
 hd_form_saved_k_sizhou_decision_effect:0 "你据有司州，其旧辖五郡复归司州的[de_jure|E]统属"
 hd_form_saved_k_uuii_bingzhou_decision:0 "设立并州"
 hd_form_saved_k_uuii_bingzhou_decision_desc:0 "边郡的急报与太原的簿书并列案头，提醒着我：据有一地，还不等于能使诸郡同心。并州的州府若由我立定，这些军政事务便该有所归属。"
 hd_form_saved_k_uuii_bingzhou_decision_tooltip:0 "统合旧辖诸郡，设立并州"
 hd_form_saved_k_uuii_bingzhou_decision_confirm:0 "立州定制。"
 hd_form_saved_k_uuii_bingzhou_decision_requirement:0 "并州尚无人执掌，且其旧辖十二郡中至少有十郡已全境归你掌控"
 hd_form_saved_k_uuii_bingzhou_decision_effect:0 "你据有并州，其旧辖十二郡复归并州的[de_jure|E]统属"
 hd_form_saved_k_jiangzhou_decision:0 "设立江州"
 hd_form_saved_k_jiangzhou_decision_desc:0 "沿江郡县舟楫相通，政令却未必能随流水一道抵达。如今我已能统合其中大部，是时候以江州为名，设立一处总领诸郡的州府了。"
 hd_form_saved_k_jiangzhou_decision_tooltip:0 "统合旧辖诸郡，设立江州"
 hd_form_saved_k_jiangzhou_decision_confirm:0 "立州定制。"
 hd_form_saved_k_jiangzhou_decision_requirement:0 "江州尚无人执掌，且其旧辖十三郡中至少有十一郡已全境归你掌控"
 hd_form_saved_k_jiangzhou_decision_effect:0 "你据有江州，其旧辖十三郡复归江州的[de_jure|E]统属"
 hd_form_saved_k_xiangzhou_decision:0 "设立湘州"
 hd_form_saved_k_xiangzhou_decision_desc:0 "湘水两岸的使者在廊下等候，各自握着本郡的文书。我看过疆域图，知道这些地方不能永远各自为政。湘州的名号，将成为统合它们的开端。"
 hd_form_saved_k_xiangzhou_decision_tooltip:0 "统合旧辖诸郡，设立湘州"
 hd_form_saved_k_xiangzhou_decision_confirm:0 "立州定制。"
 hd_form_saved_k_xiangzhou_decision_requirement:0 "湘州尚无人执掌，且其旧辖九郡中至少有八郡已全境归你掌控"
 hd_form_saved_k_xiangzhou_decision_effect:0 "你据有湘州，其旧辖九郡复归湘州的[de_jure|E]统属"
 hd_form_saved_k_suozhou_decision:0 "设立朔州"
 hd_form_saved_k_suozhou_decision_desc:0 "北地与朔方的关塞连接着漫长边境。只靠诸郡各守门户，终究难以应付四面来事。我将以朔州为名，使军报、粮运与号令皆有所归。"
 hd_form_saved_k_suozhou_decision_tooltip:0 "统合旧辖诸郡，设立朔州"
 hd_form_saved_k_suozhou_decision_confirm:0 "立州定制。"
 hd_form_saved_k_suozhou_decision_requirement:0 "朔州尚无人执掌，且其旧辖十二郡中至少有十郡已全境归你掌控"
 hd_form_saved_k_suozhou_decision_effect:0 "你据有朔州，其旧辖十二郡复归朔州的[de_jure|E]统属"
 hd_form_saved_k_uuii_jiaozhou_decision:0 "设立交州"
 hd_form_saved_k_uuii_jiaozhou_decision_desc:0 "南方道路遥远，各郡使者抵达时，案上常已堆起数月的旧报。我若要长久经营此地，便须立定交州的统属，让远近郡县认得同一道印信。"
 hd_form_saved_k_uuii_jiaozhou_decision_tooltip:0 "统合旧辖诸郡，设立交州"
 hd_form_saved_k_uuii_jiaozhou_decision_confirm:0 "立州定制。"
 hd_form_saved_k_uuii_jiaozhou_decision_requirement:0 "交州尚无人执掌，且其旧辖六郡中至少有五郡已全境归你掌控"
 hd_form_saved_k_uuii_jiaozhou_decision_effect:0 "你据有交州，其旧辖六郡复归交州的[de_jure|E]统属"
 hd_form_saved_k_yingzhou_decision:0 "设立郢州"
 hd_form_saved_k_yingzhou_decision_desc:0 "南阳、南郡与江汉诸地的文书铺满案头。疆界既已渐次连成一片，我便不能任由政令仍在旧有分界前止步。郢州，将给这些郡县一个共同的州府。"
 hd_form_saved_k_yingzhou_decision_tooltip:0 "统合旧辖诸郡，设立郢州"
 hd_form_saved_k_yingzhou_decision_confirm:0 "立州定制。"
 hd_form_saved_k_yingzhou_decision_requirement:0 "郢州尚无人执掌，且其旧辖八郡中至少有七郡已全境归你掌控"
 hd_form_saved_k_yingzhou_decision_effect:0 "你据有郢州，其旧辖八郡复归郢州的[de_jure|E]统属"
 hd_form_saved_k_pingzhou_decision:0 "设立平州"
 hd_form_saved_k_pingzhou_decision_desc:0 "辽东诸郡远隔关山，传令往返殊为不易。如今这些地方已渐归我统辖，我将立起平州的州府，使边地诸郡不再各自应付四方来事。"
 hd_form_saved_k_pingzhou_decision_tooltip:0 "统合旧辖诸郡，设立平州"
 hd_form_saved_k_pingzhou_decision_confirm:0 "立州定制。"
 hd_form_saved_k_pingzhou_decision_requirement:0 "平州尚无人执掌，且其旧辖八郡中至少有七郡已全境归你掌控"
 hd_form_saved_k_pingzhou_decision_effect:0 "你据有平州，其旧辖八郡复归平州的[de_jure|E]统属"
