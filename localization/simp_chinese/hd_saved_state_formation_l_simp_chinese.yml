 hd_form_saved_k_uuii_jiaozhou_decision:0 "设立交州"
 hd_form_saved_k_uuii_jiaozhou_decision_desc:0 "南方道路遥远，各郡使者抵达时，案上常已堆起数月的旧报。我若要长久经营此地，便须立定交州的统属，让远近郡县认得同一道印信。\n\n#weak 须完整控制存档清单中至少5/6个公国；成立后恢复这些公国对交州的法理归属。#!"
