 trait_WJ_mr_xiaowei_tunqi_desc:0 "屯骑校尉为北军五校之一，统领骑士屯卫京师。该角色驭骑有方，部伍整肃。"
 trait_WJ_mr_xiaowei_weibei:0 "威北校尉"
 trait_WJ_mr_xiaowei_weibei_desc:0 "威北校尉，取威震北边之意。该角色骁勇敢战，盼使胡骑闻名而惮。"
 trait_WJ_mr_xiaowei_weidong:0 "威东校尉"
 trait_WJ_mr_xiaowei_weidong_desc:0 "威东校尉，取威震东方之意。该角色治营严峻，盼使一方盗贼敛迹。"
 trait_WJ_mr_xiaowei_weinan:0 "威南校尉"
 trait_WJ_mr_xiaowei_weinan_desc:0 "威南校尉，取威震南方之意。该角色以勇悍自许，盼扬名于江南。"
 trait_WJ_mr_xiaowei_weishuo:0 "卫朔校尉"
 trait_WJ_mr_xiaowei_weishuo_desc:0 "卫朔校尉，取护卫朔方之意。该角色领一营屯于朔方，冬日亦不废巡逻。"
 trait_WJ_mr_xiaowei_weixi:0 "威西校尉"
 trait_WJ_mr_xiaowei_weixi_desc:0 "威西校尉，取威震西陲之意。该角色驰骋陇右，盼使羌人望旗而避。"
 trait_WJ_mr_xiaowei_wuling:0 "武陵校尉"
 trait_WJ_mr_xiaowei_wuling_desc:0 "武陵校尉，因驻守武陵山地而得名。该角色熟悉五溪蛮情，剿抚并施。"
 trait_WJ_mr_xiaowei_wuwei:0 "武卫校尉"
 trait_WJ_mr_xiaowei_wuwei_desc:0 "以武卫为号的校尉，掌宿卫亲兵。该角色领一营亲兵值宿，夜不解甲。"
 trait_WJ_mr_xiaowei_wuyi:0 "武毅校尉"
 trait_WJ_mr_xiaowei_wuyi_desc:0 "以武毅为号的校尉。该角色性情刚强，宁折不弯。"
 trait_WJ_mr_xiaowei_xianfeng:0 "先锋校尉"
 trait_WJ_mr_xiaowei_xianfeng_desc:0 "先锋校尉领一营前驱。该角色每战率众先登，勇冠一军。"
 trait_WJ_mr_xiaowei_xiongjie:0 "熊节校尉"
 trait_WJ_mr_xiaowei_xiongjie_desc:0 "熊节校尉，取熊罴之勇。该角色体魄雄壮，膂力过人。"
 trait_WJ_mr_xiaowei_xiping:0 "西平校尉"
 trait_WJ_mr_xiaowei_xiping_desc:0 "西平校尉，取平定西陲之意。该角色驻守河湟之间，防备羌乱。"
 trait_WJ_mr_xiaowei_xuanfeng:0 "宣风校尉"
 trait_WJ_mr_xiaowei_xuanfeng_desc:0 "以宣风为号的校尉。该角色知书达理，治营之余亦讲礼义。"
 trait_WJ_mr_xiaowei_xuanrui:0 "宣锐校尉"
 trait_WJ_mr_xiaowei_xuanrui_desc:0 "以宣锐为号的校尉。该角色年轻气盛，常以豪言激励部下。"
 trait_WJ_mr_xiaowei_xuanwei:0 "宣威校尉"
 trait_WJ_mr_xiaowei_xuanwei_desc:0 "以宣威为号的校尉。该角色喜整肃军容，旗帜鲜明。"
 trait_WJ_mr_xiaowei_xuanyi:0 "宣义校尉"
 trait_WJ_mr_xiaowei_xuanyi_desc:0 "以宣义为号的校尉。该角色以忠义号召部众。"
 trait_WJ_mr_xiaowei_xunwei:0 "巡卫校尉"
 trait_WJ_mr_xiaowei_xunwei_desc:0 "巡卫校尉掌巡行警卫。该角色领一营沿街巡逻，缉拿奸宄。"
 trait_WJ_mr_xiaowei_yangwu:0 "扬武校尉"
 trait_WJ_mr_xiaowei_yangwu_desc:0 "以扬武为号的校尉。该角色好勇争先，每逢操演必拔头筹。"
 trait_WJ_mr_xiaowei_yaowei:0 "耀威校尉"
 trait_WJ_mr_xiaowei_yaowei_desc:0 "以耀威为号的校尉。该角色每出营巡行，必鲜衣怒马，以壮一营之威。"
 trait_WJ_mr_xiaowei_yaowu:0 "耀武校尉"
 trait_WJ_mr_xiaowei_yaowu_desc:0 "以耀武为号的校尉。该角色爱惜甲胄兵器，一营军容颇为光鲜。"
 trait_WJ_mr_xiaowei_yifeng:0 "翊军校尉"
 trait_WJ_mr_xiaowei_yifeng_desc:0 "以翊军为号的校尉。该角色领一营随侍中军，听候调遣。"
 trait_WJ_mr_xiaowei_yingyang:0 "鹰扬校尉"
 trait_WJ_mr_xiaowei_yingyang_desc:0 "以鹰扬为号的校尉。该角色眼明手快，善于捕捉稍纵即逝的战机。"
 trait_WJ_mr_xiaowei_yongchang:0 "永昌校尉"
 trait_WJ_mr_xiaowei_yongchang_desc:0 "永昌校尉，因镇守永昌边郡而得名。该角色远在西南极边，与哀牢诸夷杂处。"
 trait_WJ_mr_xiaowei_yueqi:0 "越骑校尉"
 trait_WJ_mr_xiaowei_yueqi_desc:0 "越骑校尉为北军五校之一，统领越骑。该角色常亲自挑选骁勇之士补入营中。"
 trait_WJ_mr_xiaowei_yulin:0 "羽林校尉"
 trait_WJ_mr_xiaowei_yulin_desc:0 "羽林校尉统领一营羽林骑士。该角色出身禁旅，少年便习弓马。"
 trait_WJ_mr_xiaowei_yuqi:0 "舆骑校尉"
 trait_WJ_mr_xiaowei_yuqi_desc:0 "舆骑校尉掌护卫乘舆的骑士。该角色随驾出入，仪仗整肃。"
 trait_WJ_mr_xiaowei_zhangshi:0 "长史校尉"
 trait_WJ_mr_xiaowei_zhangshi_desc:0 "长史校尉掌营中文书。该角色精于簿籍，为主将分忧。"
 trait_WJ_mr_xiaowei_zhangshui:0 "长水校尉"
 trait_WJ_mr_xiaowei_zhangshui_desc:0 "长水校尉为北军五校之一，统领长水胡骑。该角色出入营中，号令胡汉士卒，各得其用。"
 trait_WJ_mr_xiaowei_zhaowu:0 "昭武校尉"
 trait_WJ_mr_xiaowei_zhaowu_desc:0 "以昭武为号的校尉。该角色积功而进，名声渐显。"
 trait_WJ_mr_xiaowei_zhechong:0 "折冲校尉"
 trait_WJ_mr_xiaowei_zhechong_desc:0 "以折冲为号的校尉。该角色临阵沉着，一营之兵稳如磐石。"
 trait_WJ_mr_xiaowei_zhengdi:0 "征狄校尉"
 trait_WJ_mr_xiaowei_zhengdi_desc:0 "征狄校尉，专主讨伐北狄。该角色率轻骑出塞，追奔逐北。"
 trait_WJ_mr_xiaowei_zhenglu:0 "征虏校尉"
 trait_WJ_mr_xiaowei_zhenglu_desc:0 "征虏校尉，专主讨伐胡虏。该角色勇于冲锋，不惧强敌。"
 trait_WJ_mr_xiaowei_zhengman:0 "征蛮校尉"
 trait_WJ_mr_xiaowei_zhengman_desc:0 "征蛮校尉，专主讨伐南蛮。该角色领一营山地之兵，惯于林中作战。"
 trait_WJ_mr_xiaowei_zhengrong:0 "征戎校尉"
 trait_WJ_mr_xiaowei_zhengrong_desc:0 "征戎校尉，专主讨伐西戎。该角色领一营骑步，常随大军西征。"
 trait_WJ_mr_xiaowei_zhenguo:0 "镇国校尉"
 trait_WJ_mr_xiaowei_zhenguo_desc:0 "镇国校尉，取镇卫国家之意。该角色虽位卑，亦以保国为念。"
 trait_WJ_mr_xiaowei_zhengyi:0 "征夷校尉"
 trait_WJ_mr_xiaowei_zhengyi_desc:0 "征夷校尉，专主讨伐东夷。该角色熟悉东方山海道路，常为大军向导。"
 trait_WJ_mr_xiaowei_zhenshuo:0 "镇朔校尉"
 trait_WJ_mr_xiaowei_zhenshuo_desc:0 "镇朔校尉，取镇守朔方之意。该角色领一营屯驻塞下，以坚守为本。"
 trait_WJ_mr_xiaowei_zhenwei:0 "振威校尉"
 trait_WJ_mr_xiaowei_zhenwei_desc:0 "以振威为号的校尉。该角色能使疲惫之师重振士气。"
 trait_WJ_mr_xiaowei_zhenwu:0 "振武校尉"
 trait_WJ_mr_xiaowei_zhenwu_desc:0 "以振武为号的校尉。该角色初掌一营，每日亲自教习士卒击刺。"
 trait_WJ_mr_xiaowei_zhonglei:0 "中垒校尉"
 trait_WJ_mr_xiaowei_zhonglei_desc:0 "中垒校尉掌北军营垒之事。该角色日夜督察门禁，营中出入皆须验看。"
 trait_WJ_mr_zhonglang_anbei:0 "安北中郎将"
 trait_WJ_mr_zhonglang_anbei_desc:0 "安北中郎将，寄望安定北边。该角色领一部屯于塞下，当以修缮亭障为务。"
 trait_WJ_mr_zhonglang_anding:0 "安东中郎将"
 trait_WJ_mr_zhonglang_anding_desc:0 "安东中郎将，寄望安辑东土。该角色领一部屯驻海滨，当以保境安民为务。"
 trait_WJ_mr_zhonglang_annan:0 "安南中郎将"
 trait_WJ_mr_zhonglang_annan_desc:0 "安南中郎将，寄望绥靖南方。该角色领一部驻于江上，当以安定沿江郡县为务。"
 trait_WJ_mr_zhonglang_anxi:0 "安西中郎将"
 trait_WJ_mr_zhonglang_anxi_desc:0 "安西中郎将，寄望安定西陲。该角色领一部屯于河西，当以安辑诸郡为务。"
 trait_WJ_mr_zhonglang_anyi:0 "安夷中郎将"
 trait_WJ_mr_zhonglang_anyi_desc:0 "安夷之号，取安抚夷狄之意。该角色常与边地诸族打交道，当深谙羁縻之道。"
 trait_WJ_mr_zhonglang_bei:0 "北中郎将"
 trait_WJ_mr_zhonglang_bei_desc:0 "四方中郎将之一，受命专征北方。该角色虽位不及将军，亦当独当一面，统兵讨贼。"
 trait_WJ_mr_zhonglang_bingwei:0 "兵卫中郎将"
 trait_WJ_mr_zhonglang_bingwei_desc:0 "兵卫中郎将掌统领卫兵。该角色所部当精整有序，护卫一方安宁。"
 trait_WJ_mr_zhonglang_caiguan:0 "材官中郎将"
 trait_WJ_mr_zhonglang_caiguan_desc:0 "材官中郎将统领一部材官力士。该角色膂力过人，可开强弩。"
 trait_WJ_mr_zhonglang_changshui:0 "长水中郎将"
 trait_WJ_mr_zhonglang_changshui_desc:0 "长水之名，源自长水胡骑。该角色统领一部精骑，骑射之术当冠于诸军。"
 trait_WJ_mr_zhonglang_chengmen:0 "城门中郎将"
 trait_WJ_mr_zhonglang_chengmen_desc:0 "城门中郎将统领城门屯兵。该角色昼夜巡守诸门，盘诘出入，不敢懈怠。"
 trait_WJ_mr_zhonglang_chengwei:0 "城卫中郎将"
 trait_WJ_mr_zhonglang_chengwei_desc:0 "城卫中郎将掌守护城池。该角色当修缮城防、整饬守卒，使城垣固若金汤。"
 trait_WJ_mr_zhonglang_chijie:0 "持节中郎将"
 trait_WJ_mr_zhonglang_chijie_desc:0 "持节中郎将奉节而行，代朝廷宣示威命。该角色节旄所至，州郡皆当奉迎。"
 trait_WJ_mr_zhonglang_dianjun:0 "典军中郎将"
 trait_WJ_mr_zhonglang_dianjun_desc:0 "典军中郎将掌典领军务。该角色综理一部簿籍、部伍，当事无巨细了然于胸。"
 trait_WJ_mr_zhonglang_dianjunqi:0 "典军器中郎将"
 trait_WJ_mr_zhonglang_dianjunqi_desc:0 "典军器中郎将掌甲兵器械。该角色督造刀甲弓弩，务使军中器械精利。"
 trait_WJ_mr_zhonglang_dianma:0 "典马中郎将"
 trait_WJ_mr_zhonglang_dianma_desc:0 "典马中郎将掌军马牧养调度。该角色当善相马匹，使马政井然。"
 trait_WJ_mr_zhonglang_diannong:0 "典农中郎将"
 trait_WJ_mr_zhonglang_diannong_desc:0 "典农中郎将掌屯田积谷。该角色督率屯民耕战并举，为大军储备粮秣。"
 trait_WJ_mr_zhonglang_dingyuan:0 "定远中郎将"
 trait_WJ_mr_zhonglang_dingyuan_desc:0 "定远之号，令人遥想班超投笔从戎、立功绝域的旧事。该角色亦当怀万里之志。"
 trait_WJ_mr_zhonglang_dong:0 "东中郎将"
 trait_WJ_mr_zhonglang_dong_desc:0 "东、南、西、北四中郎将，各受命专征一方。东中郎将位虽不及将军，该角色却可独领一军，转战青徐之间。"
 trait_WJ_mr_zhonglang_fengche:0 "奉车中郎将"
 trait_WJ_mr_zhonglang_fengche_desc:0 "奉车中郎将掌御乘舆车驾。该角色出入随侍，非亲信近臣不得居此。"
 trait_WJ_mr_zhonglang_fenwei:0 "奋威中郎将"
 trait_WJ_mr_zhonglang_fenwei_desc:0 "以奋威为号的中郎将。该角色领一部锐卒，当锐意进取，临敌不怯。"
 trait_WJ_mr_zhonglang_fenwu:0 "奋武中郎将"
 trait_WJ_mr_zhonglang_fenwu_desc:0 "以奋武为号的中郎将。该角色领一部敢战之士，常请缨出战。"
 trait_WJ_mr_zhonglang_fubei:0 "抚北中郎将"
 trait_WJ_mr_zhonglang_fubei_desc:0 "抚北中郎将，以怀柔北边为任。该角色常在塞下迎送胡使，以礼相待。"
 trait_WJ_mr_zhonglang_fubo:0 "伏波中郎将"
 trait_WJ_mr_zhonglang_fubo_desc:0 "伏波中郎将领一部舟师。该角色出没于江河之上，以伏波为名，盼能平定风涛。"
 trait_WJ_mr_zhonglang_fudong:0 "抚东中郎将"
 trait_WJ_mr_zhonglang_fudong_desc:0 "抚东中郎将，以怀柔东土为任。该角色劝课农桑，招还流散之民。"
 trait_WJ_mr_zhonglang_fujun:0 "抚军中郎将"
 trait_WJ_mr_zhonglang_fujun_desc:0 "抚军之号，取抚循士卒之意。该角色体恤部众，士卒当乐为之用。"
 trait_WJ_mr_zhonglang_funan:0 "抚南中郎将"
 trait_WJ_mr_zhonglang_funan_desc:0 "抚南中郎将，以怀柔南土为任。该角色常遣使入山，馈赠盐布，招抚蛮夷。"
 trait_WJ_mr_zhonglang_fuxi:0 "抚西中郎将"
 trait_WJ_mr_zhonglang_fuxi_desc:0 "抚西中郎将，以怀柔西陲为任。该角色常与羌氐酋豪会盟饮宴，结以恩义。"
 trait_WJ_mr_zhonglang_guanjun:0 "冠军中郎将"
 trait_WJ_mr_zhonglang_guanjun_desc:0 "以冠军为号的中郎将。该角色武艺出众，常盼一战成名。"
 trait_WJ_mr_zhonglang_guanwei:0 "关卫中郎将"
 trait_WJ_mr_zhonglang_guanwei_desc:0 "关卫中郎将掌守卫关隘。该角色扼守要津，盘查往来，当有一夫当关之概。"
 trait_WJ_mr_zhonglang_huaihua:0 "怀化中郎将"
 trait_WJ_mr_zhonglang_huaihua_desc:0 "怀化之号，取怀柔归化之意。该角色多与归附的边族往来，当以恩义收其心。"
 trait_WJ_mr_zhonglang_huben:0 "虎贲中郎将"
 trait_WJ_mr_zhonglang_huben_desc:0 "虎贲者，勇士奔走如猛虎。该角色统领虎贲宿卫，侍卫君侧，当以忠勇见称。"
 trait_WJ_mr_zhonglang_hujun:0 "护军中郎将"
 trait_WJ_mr_zhonglang_hujun_desc:0 "护军中郎将随军监护诸将。该角色调和诸部进退，协理军中人事。"
 trait_WJ_mr_zhonglang_human:0 "护蛮中郎将"
 trait_WJ_mr_zhonglang_human_desc:0 "护蛮中郎将监护南方诸蛮。该角色往来荆南溪洞之间，抚其向化，讨其叛逆。"
 trait_WJ_mr_zhonglang_huqi:0 "胡骑中郎将"
 trait_WJ_mr_zhonglang_huqi_desc:0 "胡骑中郎将统领内附胡人骑士。该角色通晓胡俗，当能以恩威驾驭胡骑。"
 trait_WJ_mr_zhonglang_huqiang:0 "护羌中郎将"
 trait_WJ_mr_zhonglang_huqiang_desc:0 "护羌中郎将监护西方诸羌。该角色当熟知羌部种落恩怨，分化抚纳，各得其宜。"
 trait_WJ_mr_zhonglang_huwei:0 "虎威中郎将"
 trait_WJ_mr_zhonglang_huwei_desc:0 "以虎威为号的中郎将。该角色勇猛刚烈，临阵当令敌胆寒。"
 trait_WJ_mr_zhonglang_huwuhuan:0 "护乌桓中郎将"
 trait_WJ_mr_zhonglang_huwuhuan_desc:0 "护乌桓中郎将监护幽州塞外乌桓诸部。该角色往来长城内外，以恩威羁縻胡骑。"
 trait_WJ_mr_zhonglang_huxiongnu:0 "护匈奴中郎将"
 trait_WJ_mr_zhonglang_huxiongnu_desc:0 "护匈奴中郎将监护内附的匈奴诸部。该角色驻节并州，与单于往来周旋，监其动静。"
 trait_WJ_mr_zhonglang_huyi:0 "护夷中郎将"
 trait_WJ_mr_zhonglang_huyi_desc:0 "护夷中郎将监护西南诸夷。该角色出入南中山川，以恩信笼络夷帅。"
 trait_WJ_mr_zhonglang_jianjun:0 "监军中郎将"
 trait_WJ_mr_zhonglang_jianjun_desc:0 "监军中郎将受命监护诸军。该角色察诸将功过，为朝廷耳目。"
 trait_WJ_mr_zhonglang_jianwu:0 "建武中郎将"
 trait_WJ_mr_zhonglang_jianwu_desc:0 "以建武为号的中郎将。该角色日夜思建殊勋，以图更进一步。"
 trait_WJ_mr_zhonglang_jingbei:0 "靖北中郎将"
 trait_WJ_mr_zhonglang_jingbei_desc:0 "靖北中郎将，寄望肃清北边。该角色领一部巡塞逐寇，使边烽少警。"
 trait_WJ_mr_zhonglang_jingdong:0 "靖东中郎将"
 trait_WJ_mr_zhonglang_jingdong_desc:0 "靖东中郎将，寄望肃清东土。该角色领一部搜捕海盗山贼，使道路复通。"
 trait_WJ_mr_zhonglang_jingnan:0 "靖南中郎将"
 trait_WJ_mr_zhonglang_jingnan_desc:0 "靖南中郎将，寄望肃清南土。该角色领一部往来江湖，清剿水寇。"
 trait_WJ_mr_zhonglang_jingnan_variant_2:0 "靖难中郎将"
 trait_WJ_mr_zhonglang_jingnan_variant_2_desc:0 "以靖难为号的中郎将。该角色每逢变乱，便领本部疾驰赴援。"
 trait_WJ_mr_zhonglang_jingxi:0 "靖西中郎将"
 trait_WJ_mr_zhonglang_jingxi_desc:0 "靖西中郎将，寄望肃清西陲。该角色领一部屯于陇坂，弹压剽掠的羌胡。"
 trait_WJ_mr_zhonglang_lingjun:0 "领军中郎将"
 trait_WJ_mr_zhonglang_lingjun_desc:0 "领军中郎将统领一部禁军。该角色整饬部伍，治军严明。"
 trait_WJ_mr_zhonglang_longxiang:0 "龙骧中郎将"
 trait_WJ_mr_zhonglang_longxiang_desc:0 "以龙骧为号的中郎将。该角色意气昂扬，不甘久居人下。"
 trait_WJ_mr_zhonglang_louchuan:0 "楼船中郎将"
 trait_WJ_mr_zhonglang_louchuan_desc:0 "楼船中郎将领一部战船舟师。该角色久在船上，风浪之中亦能指挥若定。"
 trait_WJ_mr_zhonglang_nan:0 "南中郎将"
 trait_WJ_mr_zhonglang_nan_desc:0 "四方中郎将之一，受命专征南方。该角色领兵南下，当出没于江湖山泽，讨伐不庭。"
 trait_WJ_mr_zhonglang_pinglu:0 "平虏中郎将"
 trait_WJ_mr_zhonglang_pinglu_desc:0 "平虏之号，取平定胡虏之意。该角色常与胡骑交锋，深知其虚实。"
 trait_WJ_mr_zhonglang_qingche:0 "轻车中郎将"
 trait_WJ_mr_zhonglang_qingche_desc:0 "轻车中郎将领一部轻车锐卒。该角色善于奔袭，常出敌不意。"
 trait_WJ_mr_zhonglang_shesheng:0 "射声中郎将"
 trait_WJ_mr_zhonglang_shesheng_desc:0 "射声者，闻声即射而中。该角色统领善射之士，暗夜之中亦当箭无虚发。"
 trait_WJ_mr_zhonglang_sima:0 "司马中郎将"
 trait_WJ_mr_zhonglang_sima_desc:0 "司马中郎将掌军中赏罚与兵马调度。该角色当执法不阿，使军纪肃然。"
 trait_WJ_mr_zhonglang_taoni:0 "讨逆中郎将"
 trait_WJ_mr_zhonglang_taoni_desc:0 "讨逆之号，取讨伐叛逆之意。该角色以诛除不臣为己任，锋芒毕露。"
 trait_WJ_mr_zhonglang_tianjin:0 "渡津中郎将"
 trait_WJ_mr_zhonglang_tianjin_desc:0 "渡津中郎将掌守渡口津梁。该角色扼守河津，舟楫往来尽在掌握。"
 trait_WJ_mr_zhonglang_tunqi:0 "屯骑中郎将"
 trait_WJ_mr_zhonglang_tunqi_desc:0 "屯骑中郎将领一部屯驻骑士。该角色长于骑战，进退迅捷。"
 trait_WJ_mr_zhonglang_wuguan:0 "五官中郎将"
 trait_WJ_mr_zhonglang_wuguan_desc:0 "五官中郎将统领五官郎署，向为清贵之选。该角色居此职，进退皆为朝野瞩目。"
 trait_WJ_mr_zhonglang_wuwei:0 "武卫中郎将"
 trait_WJ_mr_zhonglang_wuwei_desc:0 "武卫中郎将统领亲卫之士，宿卫主上左右。该角色勇武忠谨，深得信重。"
 trait_WJ_mr_zhonglang_xi:0 "西中郎将"
 trait_WJ_mr_zhonglang_xi_desc:0 "四方中郎将之一，受命专征西方。该角色统军西向，当与羌胡周旋于关陇。"
 trait_WJ_mr_zhonglang_xiaoqi:0 "骁骑中郎将"
 trait_WJ_mr_zhonglang_xiaoqi_desc:0 "骁骑中郎将领一部骁勇骑士。该角色弓马娴熟，每战冲锋在前。"
 trait_WJ_mr_zhonglang_xunwei:0 "巡卫中郎将"
 trait_WJ_mr_zhonglang_xunwei_desc:0 "巡卫中郎将掌巡行警卫。该角色往来巡查，令宵小之徒不敢作乱。"
 trait_WJ_mr_zhonglang_yangwei:0 "扬威中郎将"
 trait_WJ_mr_zhonglang_yangwei_desc:0 "扬威之号，取宣扬军威之意。该角色喜陈兵耀武，以壮声势。"
 trait_WJ_mr_zhonglang_yingyang:0 "鹰扬中郎将"
 trait_WJ_mr_zhonglang_yingyang_desc:0 "以鹰扬为号的中郎将。该角色常登高审度敌阵，伺机而击。"
 trait_WJ_mr_zhonglang_you:0 "右中郎将"
 trait_WJ_mr_zhonglang_you_desc:0 "右中郎将与左中郎将分掌郎署宿卫。该角色出入禁闼，亦可受命统兵讨贼。"
 trait_WJ_mr_zhonglang_youji:0 "游击中郎将"
 trait_WJ_mr_zhonglang_youji_desc:0 "游击中郎将领一部游兵往来策应。该角色行踪不定，哪里吃紧便驰往哪里。"
 trait_WJ_mr_zhonglang_yueqi:0 "越骑中郎将"
 trait_WJ_mr_zhonglang_yueqi_desc:0 "越骑，取才力超越之骑士。该角色所领一部皆骁勇善骑之士，冲锋陷阵，当所向披靡。"
 trait_WJ_mr_zhonglang_yulin:0 "羽林中郎将"
 trait_WJ_mr_zhonglang_yulin_desc:0 "羽林中郎将统领羽林骑士，宿卫宫禁。该角色当弓马娴熟，号令整肃。"
 trait_WJ_mr_zhonglang_zhangjun:0 "掌军中郎将"
 trait_WJ_mr_zhonglang_zhangjun_desc:0 "掌军中郎将主掌一部号令。该角色治军有方，进退皆依法度。"
 trait_WJ_mr_zhonglang_zhangshi:0 "长史中郎将"
 trait_WJ_mr_zhonglang_zhangshi_desc:0 "长史中郎将佐理幕府诸务。该角色周密干练，主将倚为臂助。"
 trait_WJ_mr_zhonglang_zhechong:0 "折冲中郎将"
 trait_WJ_mr_zhonglang_zhechong_desc:0 "以折冲为号的中郎将。该角色领一部列阵于前，专挡敌军冲锋。"
 trait_WJ_mr_zhonglang_zhengdi:0 "征狄中郎将"
 trait_WJ_mr_zhonglang_zhengdi_desc:0 "征狄中郎将，专主讨伐北狄。该角色领一部驰骋塞外，与胡骑争锋。"
 trait_WJ_mr_zhonglang_zhengman:0 "征蛮中郎将"
 trait_WJ_mr_zhonglang_zhengman_desc:0 "征蛮中郎将，专主讨伐南蛮。该角色领一部跋涉瘴疠之地，平定溪洞之乱。"
 trait_WJ_mr_zhonglang_zhengrong:0 "征戎中郎将"
 trait_WJ_mr_zhonglang_zhengrong_desc:0 "征戎中郎将，专主讨伐西戎。该角色领一部转战河湟，与羌氐争锋。"
 trait_WJ_mr_zhonglang_zhengyi:0 "征夷中郎将"
 trait_WJ_mr_zhonglang_zhengyi_desc:0 "征夷中郎将，专主讨伐东夷。该角色领一部渡海越岭，宣威东方。"
 trait_WJ_mr_zhonglang_zhenjun:0 "镇军中郎将"
 trait_WJ_mr_zhonglang_zhenjun_desc:0 "镇军之号，取镇抚军旅之意。该角色坐镇一部，处变不惊。"
 trait_WJ_mr_zhonglang_zhenshuo:0 "镇朔中郎将"
 trait_WJ_mr_zhonglang_zhenshuo_desc:0 "镇朔中郎将，取镇守朔方之意。该角色常年戍边，风沙磨砺出一身坚毅。"
 trait_WJ_mr_zhonglang_zhenwei:0 "振威中郎将"
 trait_WJ_mr_zhonglang_zhenwei_desc:0 "以振威为号的中郎将。该角色治下一部，军容整肃，鼓角相闻。"
 trait_WJ_mr_zhonglang_zhenwu:0 "振武中郎将"
 trait_WJ_mr_zhonglang_zhenwu_desc:0 "以振武为号的中郎将。该角色督责部伍甚严，操演从不间断。"
 trait_WJ_mr_zhonglang_zhonglei:0 "中垒中郎将"
 trait_WJ_mr_zhonglang_zhonglei_desc:0 "中垒之名，取守卫军中营垒之意。该角色治营当严整，壁垒森然。"
 trait_WJ_mr_zhonglang_zuo:0 "左中郎将"
 trait_WJ_mr_zhonglang_zuo_desc:0 "左中郎将本统殿中郎署，为清显之职。逢此乱世，该角色出可统兵征伐，入可宿卫宫禁。"

 # 来源：localization/simp_chinese/WJ_mingshi_track_loc_l_simp_chinese.yml
 trait_track_jungong:0 "武勋"
 trait_track_jungong_desc:0 "亲历战阵、统军制胜、平定乱事，功名皆从刀兵中来。军中威信愈隆，麾下勇士愈肯效死。"
 trait_track_qingtan:0 "清议"
 trait_track_qingtan_desc:0 "清谈论辩、品题人物、交游士林，于纷纭毁誉之中，渐养成不为外物所动的气度。"
 trait_track_zhengji:0 "治绩"
 trait_track_zhengji_desc:0 "考课、巡行、兴作、赈济，政事一桩桩磨砺下来，簿书、人情与地方利害皆了然于胸，行事布局也愈发周密。"
 trait_track_zili:0 "仕历"
 trait_track_zili_desc:0 "久任官署、历练朝堂，熟谙朝章、人事与门径，进退之间自有声援。"

 # 来源：localization/simp_chinese/WJ_office_roads_loc_l_simp_chinese.yml
 trait_track_WJ_mingshi_trait:0 "宦海沉浮"
 trait_track_WJ_mingshi_trait_desc:0 "清议、仕历、武勋、治绩，四途共成一生仕履；兼通四途者，足以名重天下。"
 trait_WJ_langguan_trait:0 "郎官"
 trait_WJ_langguan_trait_desc:0 "该角色举孝廉入为郎官，执戟宿卫于殿中，静候考校，以待出补吏职。"
 trait_WJ_mingshi_trait:0 "宦海沉浮"
 trait_WJ_mingshi_trait_desc:0 "仕途如海，一朝显达不足以尽其人，一时沉沦也抹不去旧日声名。该角色自辟召、察举入仕以来，清谈品题、久任官署、临阵建功、牧民理政，桩桩件件都随其一生；纵经罢黜、失势乃至改朝换代，旧望仍在，若再逢时运，重登公卿亦不足为奇。"

 # 来源：localization/simp_chinese/WJ_yangwang_l_simp_chinese.yml
 WJ_yangwang_trait:0 "隐士"
 WJ_yangwang_trait_desc:0 "该角色辞官归隐，闭门读书，不应征辟，不就朝中官职，亦不预军旅之事，只与乡里故交往来。"
