l_simp_chinese:
# 汉晋风华：按类型整合；键名与现行文本保留。来源逐键见本批manifest。

 # 来源：localization/simp_chinese/WJ_kaoke_assessment_additions_l_simp_chinese.yml
 trait_WJ_kaoke_malpractice:0 "徇私舞弊"
 trait_WJ_kaoke_malpractice_desc:0 "该角色在考课中上下其手、徇私舞弊，事已败露。纵得宽宥，这一污名也将终身相随。"

 # 来源：localization/simp_chinese/WJ_military_governance_l_simp_chinese.yml
 trait_WJ_zhongwai:0 "都督中外诸军事"
 trait_WJ_zhongwai_desc:0 "该角色奉诏都督中外诸军事，假黄钺，总统六军、整肃军法。这份兵柄随辅政之位而来，也将随辅政之位而去。"

 # 来源：localization/simp_chinese/WJ_military_rank_l_simp_chinese.yml
 trait_WJ_mr_jiangjun_anbei:0 "安北将军"
 trait_WJ_mr_jiangjun_anbei_desc:0 "安北之号，以安定北边为名。朝廷授该角色此号，是望其守塞抚胡，令边民得以安枕。"
 trait_WJ_mr_jiangjun_andong:0 "安东将军"
 trait_WJ_mr_jiangjun_andong_desc:0 "安东之号，以安辑东土为名。朝廷授该角色此号，是望其绥抚青徐，使流散之民复归田里。"
 trait_WJ_mr_jiangjun_annan:0 "安南将军"
 trait_WJ_mr_jiangjun_annan_desc:0 "安南之号，以绥靖南土为名。朝廷授该角色此号，是望其镇抚江南山越，恩威并施。"
 trait_WJ_mr_jiangjun_anxi:0 "安西将军"
 trait_WJ_mr_jiangjun_anxi_desc:0 "安西之号，以安定西陲为名。朝廷授该角色此号，是望其屯戍陇右，使羌氐渐服王化。"
 trait_WJ_mr_jiangjun_caiguan:0 "材官将军"
 trait_WJ_mr_jiangjun_caiguan_desc:0 "材官本指能引强弩的力士，材官将军即以统领此辈得名。该角色以此号领兵，多倚步卒之力。"
 trait_WJ_mr_jiangjun_dangkou:0 "荡寇将军"
 trait_WJ_mr_jiangjun_dangkou_desc:0 "荡寇之号，取扫荡寇贼之意。该角色以此号专任讨捕，四方草寇当闻风而遁。"
 trait_WJ_mr_jiangjun_dingbei:0 "定北将军"
 trait_WJ_mr_jiangjun_dingbei_desc:0 "号曰定北，取戡定朔方之意。该角色既受此号，便须控弦塞上，使北虏远遁。"
 trait_WJ_mr_jiangjun_dingdong:0 "定东将军"
 trait_WJ_mr_jiangjun_dingdong_desc:0 "号曰定东，取戡定东土之意。该角色既受此号，便须威加淮海，令一方豪强敛手。"
 trait_WJ_mr_jiangjun_dingnan:0 "定南将军"
 trait_WJ_mr_jiangjun_dingnan_desc:0 "号曰定南，取戡定南疆之意。该角色既受此号，便须深入瘴疠之地，以兵威慑服诸蛮。"
 trait_WJ_mr_jiangjun_dingnan_variant_2:0 "定难将军"
 trait_WJ_mr_jiangjun_dingnan_variant_2_desc:0 "定难之号，取戡定祸难之意。该角色多于乱局中受命，须以一旅之众收拾残局。"
 trait_WJ_mr_jiangjun_dingxi:0 "定西将军"
 trait_WJ_mr_jiangjun_dingxi_desc:0 "号曰定西，取戡定西陲之意。该角色既受此号，便须驰骋河陇，令号令所及，羌胡莫敢不从。"
 trait_WJ_mr_jiangjun_duliao:0 "度辽将军"
 trait_WJ_mr_jiangjun_duliao_desc:0 "度辽之号，初为渡辽水出塞征讨而设，其后屯驻边郡、监护诸胡。该角色持此号，当熟悉边事，深知胡情。"
 trait_WJ_mr_jiangjun_fenwei:0 "奋威将军"
 trait_WJ_mr_jiangjun_fenwei_desc:0 "奋威之号，取奋扬威武之意。该角色锐气方刚，每战当奋勇争先。"
 trait_WJ_mr_jiangjun_fenwu:0 "奋武将军"
 trait_WJ_mr_jiangjun_fenwu_desc:0 "奋武之号，取奋发武勇之意。乱世之中，此号多授新起豪杰，该角色亦当以建功自期。"
 trait_WJ_mr_jiangjun_fubei:0 "抚北将军"
 trait_WJ_mr_jiangjun_fubei_desc:0 "抚北之号，重在怀柔北边。该角色持此号，宜通互市、结胡酋，以信义安定塞外。"
 trait_WJ_mr_jiangjun_fubo:0 "伏波将军"
 trait_WJ_mr_jiangjun_fubo_desc:0 "伏波之号，取降伏波涛之意；昔马援以此号南征交趾，威名远播。该角色得此号，当习水战，涉江海如履平地。"
 trait_WJ_mr_jiangjun_fudong:0 "抚东将军"
 trait_WJ_mr_jiangjun_fudong_desc:0 "抚东之号，重在怀柔东方。该角色持此号，宜宽严相济，以德意收海隅民心。"
 trait_WJ_mr_jiangjun_fuguo:0 "辅国将军"
 trait_WJ_mr_jiangjun_fuguo_desc:0 "辅国之号，取匡辅社稷之意。该角色以国之干城自期，名望隆于寻常诸将。"
 trait_WJ_mr_jiangjun_fujun:0 "辅军将军"
 trait_WJ_mr_jiangjun_fujun_desc:0 "辅军之号，取辅翼大军之意。该角色常佐主帅调度，进退有方。"
 trait_WJ_mr_jiangjun_funan:0 "抚南将军"
 trait_WJ_mr_jiangjun_funan_desc:0 "抚南之号，重在怀柔南土。该角色持此号，宜善待夷越，以恩信结远人之心。"
 trait_WJ_mr_jiangjun_fuxi:0 "抚西将军"
 trait_WJ_mr_jiangjun_fuxi_desc:0 "抚西之号，重在怀柔西陲。该角色持此号，宜羁縻羌氐，能以和代战者为上。"
 trait_WJ_mr_jiangjun_fuyuan:0 "抚远将军"
 trait_WJ_mr_jiangjun_fuyuan_desc:0 "抚远之号，取安抚远方之意。该角色多戍边徼，宜以恩信招徕远人。"
 trait_WJ_mr_jiangjun_guanjun:0 "冠军将军"
 trait_WJ_mr_jiangjun_guanjun_desc:0 "冠军之号，取勇冠三军之意。该角色以勇力自负，常思独当一面。"
 trait_WJ_mr_jiangjun_hengye:0 "横野将军"
 trait_WJ_mr_jiangjun_hengye_desc:0 "横野之号，取横行原野之意。该角色善率轻兵驰突旷野，来去如风。"
 trait_WJ_mr_jiangjun_hou:0 "后将军"
 trait_WJ_mr_jiangjun_hou_desc:0 "前、后、左、右四将军之一。后将军持重殿后，大军进退赖其稳固根本，该角色当以沉毅自持。"
 trait_WJ_mr_jiangjun_hujun:0 "护军将军"
 trait_WJ_mr_jiangjun_hujun_desc:0 "护军之职，掌监护诸将、铨选武官。该角色居此重号，周旋诸将之间，军中人事多须经其手。"
 trait_WJ_mr_jiangjun_huwei:0 "虎威将军"
 trait_WJ_mr_jiangjun_huwei_desc:0 "虎威之号，取猛虎之威。该角色统兵当如虎踞山林，令士卒望而生畏。"
 trait_WJ_mr_jiangjun_jianwei:0 "建威将军"
 trait_WJ_mr_jiangjun_jianwei_desc:0 "建威之号，取建立威名之意。该角色急于立功扬名，行军不避险阻。"
 trait_WJ_mr_jiangjun_jianwu:0 "建武将军"
 trait_WJ_mr_jiangjun_jianwu_desc:0 "建武之号，取建立武功之意。该角色以战功起家，戎马倥偬，未尝稍歇。"
 trait_WJ_mr_jiangjun_jianzhong:0 "建忠将军"
 trait_WJ_mr_jiangjun_jianzhong_desc:0 "建忠之号，取建立忠节之意。该角色以忠义自许，誓以身许国。"
 trait_WJ_mr_jiangjun_jingbei:0 "靖北将军"
 trait_WJ_mr_jiangjun_jingbei_desc:0 "以靖北为号，寄望肃清北边。该角色当严守关塞，使胡骑不敢叩边。"
 trait_WJ_mr_jiangjun_jingbian:0 "靖边将军"
 trait_WJ_mr_jiangjun_jingbian_desc:0 "靖边之号，取安靖边陲之意。该角色久在边地，熟知烽燧斥候之事。"
 trait_WJ_mr_jiangjun_jingdong:0 "靖东将军"
 trait_WJ_mr_jiangjun_jingdong_desc:0 "以靖东为号，寄望肃清东方。该角色治军当以严整为先，使海滨盗贼闻风而散。"
 trait_WJ_mr_jiangjun_jinglue:0 "经略将军"
 trait_WJ_mr_jiangjun_jinglue_desc:0 "经略之号，取经营筹略之意。该角色长于谋划，攻守进退皆有章法。"
 trait_WJ_mr_jiangjun_jingnan:0 "靖南将军"
 trait_WJ_mr_jiangjun_jingnan_desc:0 "以靖南为号，寄望肃清南土。该角色当剿抚并施，使江湖之间不复有啸聚之徒。"
 trait_WJ_mr_jiangjun_jingnan_zhong:0 "靖难将军"
 trait_WJ_mr_jiangjun_jingnan_zhong_desc:0 "靖难之号，取平定祸乱之意。该角色于危难之际受命，当挺身扶持倾覆。"
 trait_WJ_mr_jiangjun_jingxi:0 "靖西将军"
 trait_WJ_mr_jiangjun_jingxi_desc:0 "以靖西为号，寄望肃清西陲。该角色当巡边逐寇，使陇道重通商旅。"
 trait_WJ_mr_jiangjun_jinu:0 "积弩将军"
 trait_WJ_mr_jiangjun_jinu_desc:0 "积弩之号，以统领强弩之士为名。该角色善布弩阵，箭雨之下，敌骑难近。"
 trait_WJ_mr_jiangjun_lingjun:0 "宣威将军"
 trait_WJ_mr_jiangjun_lingjun_desc:0 "宣威之号，取宣扬国威之意。该角色或出使临边，或统兵出征，皆当以兵威彰显朝廷声势。"
 trait_WJ_mr_jiangjun_longxiang:0 "龙骧将军"
 trait_WJ_mr_jiangjun_longxiang_desc:0 "龙骧者，龙首高昂、腾跃而起之状。该角色得此重号，当气宇轩昂，怀吞吐风云之志。"
 trait_WJ_mr_jiangjun_louchuan:0 "楼船将军"
 trait_WJ_mr_jiangjun_louchuan_desc:0 "楼船之号，以统领舟师战舰为名。该角色熟谙水战，常率楼船浮江而下。"
 trait_WJ_mr_jiangjun_piaoyao:0 "嫖姚将军"
 trait_WJ_mr_jiangjun_piaoyao_desc:0 "嫖姚，劲疾之貌；昔霍去病以嫖姚校尉轻骑远袭，此号由是闻名。该角色得此重号，当以迅疾奔袭为能。"
 trait_WJ_mr_jiangjun_pingbei:0 "平北将军"
 trait_WJ_mr_jiangjun_pingbei_desc:0 "平北之号，意在扫平北疆。该角色以此号统兵，当出塞追亡，使胡尘不复南扬。"
 trait_WJ_mr_jiangjun_pingdong:0 "平东将军"
 trait_WJ_mr_jiangjun_pingdong_desc:0 "平东之号，意在扫平东方。该角色以此号统兵，当荡涤海岱余寇，令东土复归清晏。"
 trait_WJ_mr_jiangjun_pingnan:0 "平南将军"
 trait_WJ_mr_jiangjun_pingnan_desc:0 "平南之号，意在扫平南方。该角色以此号统兵，当南渡江汉，讨不庭而平叛乱。"
 trait_WJ_mr_jiangjun_pingxi:0 "平西将军"
 trait_WJ_mr_jiangjun_pingxi_desc:0 "平西之号，意在扫平西陲。该角色以此号统兵，当转战关陇，荡平羌乱。"
 trait_WJ_mr_jiangjun_qian:0 "前将军"
 trait_WJ_mr_jiangjun_qian_desc:0 "前、后、左、右四将军，皆为重号。前将军临阵为全军前驱，该角色当冲锋陷阵、身先士卒。"
 trait_WJ_mr_jiangjun_qingche:0 "轻车将军"
 trait_WJ_mr_jiangjun_qingche_desc:0 "轻车之号，以统领战车轻兵为名。该角色长于驰突，行军迅捷。"
 trait_WJ_mr_jiangjun_saoni:0 "扫逆将军"
 trait_WJ_mr_jiangjun_saoni_desc:0 "扫逆之号，取扫除逆乱之意。该角色以专讨叛逆为任，不臣之辈闻之惴惴。"
 trait_WJ_mr_jiangjun_tunqi:0 "屯骑将军"
 trait_WJ_mr_jiangjun_tunqi_desc:0 "屯骑之号，取统领屯驻骑士之意。该角色以此号独领一军骑士，驰骋于外。"
 trait_WJ_mr_jiangjun_weibei:0 "威北将军"
 trait_WJ_mr_jiangjun_weibei_desc:0 "威北之号，以兵威震慑北边。该角色大纛所向，塞外诸部当望尘而拜。"
 trait_WJ_mr_jiangjun_weidong:0 "威东将军"
 trait_WJ_mr_jiangjun_weidong_desc:0 "威东之号，以兵威震慑东方。该角色顶着这一赫赫名号，东土诸雄自当掂量再三，不敢轻动。"
 trait_WJ_mr_jiangjun_weinan:0 "威南将军"
 trait_WJ_mr_jiangjun_weinan_desc:0 "威南之号，以兵威震慑南土。该角色持此号临江，诸夷豪帅皆须掂量其兵锋。"
 trait_WJ_mr_jiangjun_weishuo:0 "卫朔将军"
 trait_WJ_mr_jiangjun_weishuo_desc:0 "卫朔之号，取护卫朔方之意。该角色受此重号，当久戍北边，风霜满面而志节不移。"
 trait_WJ_mr_jiangjun_weixi:0 "威西将军"
 trait_WJ_mr_jiangjun_weixi_desc:0 "威西之号，以兵威震慑西陲。该角色名号一出，陇坂之外的羌胡便知朝廷有人。"
 trait_WJ_mr_jiangjun_wuwei:0 "武卫将军"
 trait_WJ_mr_jiangjun_wuwei_desc:0 "武卫之号，掌宿卫禁中亲兵。该角色统领亲军，昼夜护卫君侧，非心腹不得居此。"
 trait_WJ_mr_jiangjun_wuyi:0 "武毅将军"
 trait_WJ_mr_jiangjun_wuyi_desc:0 "武毅之号，取刚毅果敢之意。该角色以此号自励，临阵当刚决不惧。"
 trait_WJ_mr_jiangjun_xiaoqi:0 "骁骑将军"
 trait_WJ_mr_jiangjun_xiaoqi_desc:0 "骁骑之号，取骑兵骁勇之意。该角色跨马挥戈，冲阵当如入无人之境。"
 trait_WJ_mr_jiangjun_xuanfeng:0 "宣风将军"
 trait_WJ_mr_jiangjun_xuanfeng_desc:0 "宣风之号，取宣扬风化之意。该角色当文武兼资，兵威与教化并行。"
 trait_WJ_mr_jiangjun_xuanrui:0 "宣锐将军"
 trait_WJ_mr_jiangjun_xuanrui_desc:0 "宣锐之号，取宣扬锐气之意。该角色善于激励士卒，临阵鼓噪，三军为之一振。"
 trait_WJ_mr_jiangjun_yangwu:0 "扬武将军"
 trait_WJ_mr_jiangjun_yangwu_desc:0 "扬武之号，取发扬武威之意。该角色意气风发，常以克敌扬名为念。"
 trait_WJ_mr_jiangjun_yaowu:0 "耀武将军"
 trait_WJ_mr_jiangjun_yaowu_desc:0 "耀武之号，取炫耀武威之意。该角色好陈兵列阵，以盛大军容慑服敌人。"
 trait_WJ_mr_jiangjun_yijun:0 "翊军将军"
 trait_WJ_mr_jiangjun_yijun_desc:0 "翊军之号，取翊卫大军之意。该角色常护卫主帅左右，忠勤可托。"
 trait_WJ_mr_jiangjun_yingyang:0 "鹰扬将军"
 trait_WJ_mr_jiangjun_yingyang_desc:0 "鹰扬之号，取鹰隼飞扬之势。该角色目光锐利，出击当如鹰隼搏兔。"
 trait_WJ_mr_jiangjun_you:0 "右将军"
 trait_WJ_mr_jiangjun_you_desc:0 "前、后、左、右四将军之一。右将军翼护中军之右，该角色当与左翼相为掎角，共护中军。"
 trait_WJ_mr_jiangjun_youji:0 "游击将军"
 trait_WJ_mr_jiangjun_youji_desc:0 "游击之号，以统率游兵往来策应为名。该角色不拘一处，专伺敌隙而出奇兵。"
 trait_WJ_mr_jiangjun_yulin:0 "羽林将军"
 trait_WJ_mr_jiangjun_yulin_desc:0 "羽林之名，取为国羽翼、如林之盛。该角色以此号统兵，军容之盛可比禁旅。"
 trait_WJ_mr_jiangjun_zhechong:0 "折冲将军"
 trait_WJ_mr_jiangjun_zhechong_desc:0 "折冲之号，取折敌冲锋之意。该角色善于摧坚破锐，令敌军锋芒顿挫。"
 trait_WJ_mr_jiangjun_zhenbei:0 "镇北将军"
 trait_WJ_mr_jiangjun_zhenbei_desc:0 "镇北为四镇之一，以坐镇一方为任。该角色身负此号，须守幽并边塞，令烽燧不惊。"
 trait_WJ_mr_jiangjun_zhendong:0 "镇东将军"
 trait_WJ_mr_jiangjun_zhendong_desc:0 "镇东为四镇之一，以坐镇一方为任。该角色身负此号，须屯兵淮泗、扼守海岱，使东土安堵如故。"
 trait_WJ_mr_jiangjun_zhengbei:0 "征北将军"
 trait_WJ_mr_jiangjun_zhengbei_desc:0 "征北位列四征，专主北疆征伐，为方面重任。该角色膺此重号，当坐控幽并，令胡骑不敢南下牧马。"
 trait_WJ_mr_jiangjun_zhengdong:0 "征东将军"
 trait_WJ_mr_jiangjun_zhengdong_desc:0 "征东位列四征，专主东方征伐，为方面重任。该角色膺此重号，当提兵东向，使青徐海岱尽归号令。"
 trait_WJ_mr_jiangjun_zhengnan:0 "征南将军"
 trait_WJ_mr_jiangjun_zhengnan_desc:0 "征南位列四征，专主南方征伐，为方面重任。该角色膺此重号，当浮舟江汉，令荆扬百越不敢违命。"
 trait_WJ_mr_jiangjun_zhenguo:0 "镇国将军"
 trait_WJ_mr_jiangjun_zhenguo_desc:0 "镇国之号，取镇卫国家之意。该角色身负此号，社稷安危系于一身，威望足以镇服一方。"
 trait_WJ_mr_jiangjun_zhengxi:0 "征西将军"
 trait_WJ_mr_jiangjun_zhengxi_desc:0 "征西位列四征，专主西陲征伐，为方面重任。该角色膺此重号，当西出关陇，使羌氐闻名而畏。"
 trait_WJ_mr_jiangjun_zhenjun:0 "镇军将军"
 trait_WJ_mr_jiangjun_zhenjun_desc:0 "镇军之号，取镇抚六军之意。该角色居此重号，当持重沉稳，为诸军所倚。"
 trait_WJ_mr_jiangjun_zhennan:0 "镇南将军"
 trait_WJ_mr_jiangjun_zhennan_desc:0 "镇南为四镇之一，以坐镇一方为任。该角色身负此号，须据江汉之险，为朝廷屏蔽荆扬。"
 trait_WJ_mr_jiangjun_zhenwei:0 "振威将军"
 trait_WJ_mr_jiangjun_zhenwei_desc:0 "振威之号，取振奋军威之意。该角色每至军中，士气当为之一新。"
