 trait_WJ_mr_zhonglang_jingxi_desc:0 "绥靖西方，平定叛乱，以安疆场。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循重号中郎将加职。"
 trait_WJ_mr_zhonglang_lingjun:0 "领军中郎将"
 trait_WJ_mr_zhonglang_lingjun_desc:0 "主统领禁兵，或总摄中军诸营，宿卫宫省，亦常遣督外军。"
 trait_WJ_mr_zhonglang_longxiang:0 "龙骧中郎将"
 trait_WJ_mr_zhonglang_longxiang_desc:0 "如龙腾骧，或领精兵猛将，为大军前锋。"
 trait_WJ_mr_zhonglang_louchuan:0 "楼船中郎将"
 trait_WJ_mr_zhonglang_louchuan_desc:0 "主水军战舰，统楼船、戈船诸部，习流而阵。"
 trait_WJ_mr_zhonglang_nan:0 "南中郎将"
 trait_WJ_mr_zhonglang_nan_desc:0 "出镇南方州郡，主持节督军，掌方面征伐镇戍之事。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循重号中郎将加职。"
 trait_WJ_mr_zhonglang_pinglu:0 "平虏中郎将"
 trait_WJ_mr_zhonglang_pinglu_desc:0 "主平定虏寇，或领边兵出塞，扫清朔方。"
 trait_WJ_mr_zhonglang_qingche:0 "轻车中郎将"
 trait_WJ_mr_zhonglang_qingche_desc:0 "主车骑驰骋，统轻车锐卒，利在赴敌急速。"
 trait_WJ_mr_zhonglang_shesheng:0 "射声中郎将"
 trait_WJ_mr_zhonglang_shesheng_desc:0 "主射声部队，掌弓弩手，以强弩射远制敌。"
 trait_WJ_mr_zhonglang_sima:0 "司马中郎将"
 trait_WJ_mr_zhonglang_sima_desc:0 "主军事司马，参赞戎机，典兵曹文书律令。"
 trait_WJ_mr_zhonglang_taoni:0 "讨逆中郎将"
 trait_WJ_mr_zhonglang_taoni_desc:0 "主讨伐叛逆，或奉诏出征，以正刑典。"
 trait_WJ_mr_zhonglang_tianjin:0 "渡津中郎将"
 trait_WJ_mr_zhonglang_tianjin_desc:0 "主津渡要地，掌舟楫桥梁，以备军行转运。"
 trait_WJ_mr_zhonglang_tunqi:0 "屯骑中郎将"
 trait_WJ_mr_zhonglang_tunqi_desc:0 "主屯驻骑兵，或戍守要地，以备非常。"
 trait_WJ_mr_zhonglang_wuguan:0 "五官中郎将"
 trait_WJ_mr_zhonglang_wuguan_desc:0 "主五官郎，掌宫殿门户宿卫，亦主郎官选举勤务。"
 trait_WJ_mr_zhonglang_wuwei:0 "武卫中郎将"
 trait_WJ_mr_zhonglang_wuwei_desc:0 "主武卫禁兵，掌宫省宿卫，亦统中军精锐，可出讨叛逆。"
 trait_WJ_mr_zhonglang_xi:0 "西中郎将"
 trait_WJ_mr_zhonglang_xi_desc:0 "出镇西方州郡，主持节督军，掌方面征伐镇戍之事。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循重号中郎将加职。"
 trait_WJ_mr_zhonglang_xiaoqi:0 "骁骑中郎将"
 trait_WJ_mr_zhonglang_xiaoqi_desc:0 "主骁锐骑兵，以精骑突驰，摧折敌锋。"
 trait_WJ_mr_zhonglang_xunwei:0 "巡卫中郎将"
 trait_WJ_mr_zhonglang_xunwei_desc:0 "主巡防卫戍，或巡察京畿，以备奸盗。"
 trait_WJ_mr_zhonglang_yangwei:0 "扬威中郎将"
 trait_WJ_mr_zhonglang_yangwei_desc:0 "主宣扬威德，或以军威慑敌，不战而屈人之兵。"
 trait_WJ_mr_zhonglang_yingyang:0 "鹰扬中郎将"
 trait_WJ_mr_zhonglang_yingyang_desc:0 "如鹰飞扬，主伺机而动，领游军往来策应，出其不意。"
 trait_WJ_mr_zhonglang_you:0 "右中郎将"
 trait_WJ_mr_zhonglang_you_desc:0 "主右署郎，掌守宫殿右掖门户，亦统禁旅，可遣戍外镇。"
 trait_WJ_mr_zhonglang_youji:0 "游击中郎将"
 trait_WJ_mr_zhonglang_youji_desc:0 "主游击之兵，出没无常，以扰敌后，断其粮道。"
 trait_WJ_mr_zhonglang_yueqi:0 "越骑中郎将"
 trait_WJ_mr_zhonglang_yueqi_desc:0 "主越骑营兵，掌骑兵，或统内附越人骑士。"
 trait_WJ_mr_zhonglang_yulin:0 "羽林中郎将"
 trait_WJ_mr_zhonglang_yulin_desc:0 "主羽林骑，掌宿卫侍从，拣选良家子及死事之孤充之，亦从征伐。"
 trait_WJ_mr_zhonglang_zhangjun:0 "掌军中郎将"
 trait_WJ_mr_zhonglang_zhangjun_desc:0 "主禁中兵马，为重要禁卫武官。此为中央军体系将领，既可统领宫禁宿卫之中军，亦可领兵驻守地方要害之外军，拱卫朝廷疆域。"
 trait_WJ_mr_zhonglang_zhangshi:0 "长史中郎将"
 trait_WJ_mr_zhonglang_zhangshi_desc:0 "主军府长史事，掌书记机要，或代行将令，权任颇重。"
 trait_WJ_mr_zhonglang_zhechong:0 "折冲中郎将"
 trait_WJ_mr_zhonglang_zhechong_desc:0 "取折冲御侮之义，主方面守御，保境安民。"
 trait_WJ_mr_zhonglang_zhengdi:0 "征狄中郎将"
 trait_WJ_mr_zhonglang_zhengdi_desc:0 "征讨北狄，统兵北伐，扫清朔漠，以张国威。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循重号中郎将加职。"
 trait_WJ_mr_zhonglang_zhengman:0 "征蛮中郎将"
 trait_WJ_mr_zhonglang_zhengman_desc:0 "征讨南蛮，统兵南征，深入不毛，以绥南土。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循重号中郎将加职。"
 trait_WJ_mr_zhonglang_zhengrong:0 "征戎中郎将"
 trait_WJ_mr_zhonglang_zhengrong_desc:0 "征讨西戎，统兵出塞，以兵威震慑，靖边安境。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循重号中郎将加职。"
 trait_WJ_mr_zhonglang_zhengyi:0 "征夷中郎将"
 trait_WJ_mr_zhonglang_zhengyi_desc:0 "征讨东夷，统兵东伐，浮海击之，以清海隅。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循重号中郎将加职。"
 trait_WJ_mr_zhonglang_zhenjun:0 "镇军中郎将"
 trait_WJ_mr_zhonglang_zhenjun_desc:0 "主镇守方面，或统兵戍边，以重威御敌。"
 trait_WJ_mr_zhonglang_zhenshuo:0 "镇朔中郎将"
 trait_WJ_mr_zhonglang_zhenshuo_desc:0 "镇守北疆，督护边塞，谨烽火，御胡骑，以固朔方。\n\n※ 此官非出镇方面者不轻授，若未膺方任，则循重号中郎将加职。"
 trait_WJ_mr_zhonglang_zhenwei:0 "振威中郎将"
 trait_WJ_mr_zhonglang_zhenwei_desc:0 "主振奋军威，或督偏师征讨，持节假威，以镇方面。"
 trait_WJ_mr_zhonglang_zhenwu:0 "振武中郎将"
 trait_WJ_mr_zhonglang_zhenwu_desc:0 "主振兴武备，或整训疲卒，使之复振。"
 trait_WJ_mr_zhonglang_zhonglei:0 "中垒中郎将"
 trait_WJ_mr_zhonglang_zhonglei_desc:0 "主中垒营兵，掌北军屯兵，亦主征伐营阵之事。"
 trait_WJ_mr_zhonglang_zuo:0 "左中郎将"
 trait_WJ_mr_zhonglang_zuo_desc:0 "主左署郎，掌守宫殿左掖门户，亦领禁兵，可出镇督军。"

 # 来源：localization/simp_chinese/WJ_mingshi_track_loc_l_simp_chinese.yml
 trait_track_jungong:0 "武勋"
 trait_track_jungong_desc:0 "亲历战阵、统军制胜、平定乱事，功名皆从刀兵中来。军中威信愈隆，麾下勇士愈肯效死。"
 trait_track_qingtan:0 "清议"
 trait_track_qingtan_desc:0 "清谈论辩、品题人物、交游士林，于纷纭毁誉之中，渐养成不为外物所动的气度。"
 trait_track_zhengji:0 "治绩"
 trait_track_zhengji_desc:0 "考课、巡行、兴作、赈济，政事一桩桩磨砺下来，簿书、人情与地方利害皆了然于胸，行事布局也愈发周密。"
 trait_track_zili:0 "仕历"
 trait_track_zili_desc:0 "久任官署、历练朝堂，熟谙朝章、人事与门径，进退之间自有声援。"

 # 来源：localization/simp_chinese/WJ_office_roads_loc_l_simp_chinese.yml
 trait_track_WJ_mingshi_trait:0 "宦海沉浮"
 trait_track_WJ_mingshi_trait_desc:0 "清议、仕历、武勋、治绩，四途共成一生仕履；兼通四途者，足以名重天下。"
 trait_WJ_langguan_trait:0 "郎官"
 trait_WJ_langguan_trait_desc:0 "该角色举孝廉入为郎官，执戟宿卫于殿中，静候考校，以待出补吏职。"
 trait_WJ_mingshi_trait:0 "宦海沉浮"
 trait_WJ_mingshi_trait_desc:0 "仕途如海，一朝显达不足以尽其人，一时沉沦也抹不去旧日声名。该角色自辟召、察举入仕以来，清谈品题、久任官署、临阵建功、牧民理政，桩桩件件都随其一生；纵经罢黜、失势乃至改朝换代，旧望仍在，若再逢时运，重登公卿亦不足为奇。"

 # 来源：localization/simp_chinese/WJ_yangwang_l_simp_chinese.yml
 WJ_yangwang_trait:0 "隐士"
 WJ_yangwang_trait_desc:0 "该角色辞官归隐，闭门读书，不应征辟，不就朝中官职，亦不预军旅之事，只与乡里故交往来。"

 trait_WJ_mr_jiangjun_polu:0 "破虏将军"
 trait_WJ_mr_jiangjun_polu_desc:0 "破虏之号，取摧锋破敌之意。汉末孙坚以此号领豫州刺史，治兵讨卓。受此军职者，以征讨建功为任。"
