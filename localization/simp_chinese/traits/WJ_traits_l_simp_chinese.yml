 # 来源：localization/simp_chinese/WJ_kaoke_assessment_additions_l_simp_chinese.yml
 trait_WJ_kaoke_malpractice:0 "徇私舞弊"
 trait_WJ_kaoke_malpractice_desc:0 "该角色在考课中上下其手、徇私舞弊，事已败露。纵得宽宥，这一污名也将终身相随。"

 # 来源：localization/simp_chinese/WJ_military_governance_l_simp_chinese.yml
 trait_WJ_zhongwai:0 "都督中外诸军事"
 trait_WJ_zhongwai_desc:0 "该角色奉诏都督中外诸军事，假黄钺，总统六军、整肃军法。这份兵柄随辅政之位而来，也将随辅政之位而去。"

 # 来源：localization/simp_chinese/WJ_military_rank_l_simp_chinese.yml
 trait_WJ_mr_jiangjun_anbei:0 "安北将军"
 trait_WJ_mr_jiangjun_anbei_desc:0 "安抚北方，主抚慰军民，安辑流亡。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_andong:0 "安东将军"
 trait_WJ_mr_jiangjun_andong_desc:0 "安抚东方，主抚慰军民，安辑流亡。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_annan:0 "安南将军"
 trait_WJ_mr_jiangjun_annan_desc:0 "安抚南方，主抚慰军民，安辑流亡。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_anxi:0 "安西将军"
 trait_WJ_mr_jiangjun_anxi_desc:0 "安抚西方，主抚慰军民，安辑流亡。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_caiguan:0 "材官将军"
 trait_WJ_mr_jiangjun_caiguan_desc:0 "主步兵材官，统郡国材官骑士，或督步卒征伐四方。"
 trait_WJ_mr_jiangjun_dangkou:0 "荡寇将军"
 trait_WJ_mr_jiangjun_dangkou_desc:0 "主荡平寇贼，或统州郡兵，搜捕逋逃，以安乡里。"
 trait_WJ_mr_jiangjun_dingbei:0 "定北将军"
 trait_WJ_mr_jiangjun_dingbei_desc:0 "安定北方边陲，主镇戍疆场，以固封守。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_dingdong:0 "定东将军"
 trait_WJ_mr_jiangjun_dingdong_desc:0 "安定东方边陲，主镇戍疆场，以固封守。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_dingnan:0 "定南将军"
 trait_WJ_mr_jiangjun_dingnan_desc:0 "安定南方边陲，主镇戍疆场，以固封守。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_dingnan_variant_2:0 "定难将军"
 trait_WJ_mr_jiangjun_dingnan_variant_2_desc:0 "主平定危难，或以危疑之际受命，安靖一方。"
 trait_WJ_mr_jiangjun_dingxi:0 "定西将军"
 trait_WJ_mr_jiangjun_dingxi_desc:0 "安定西方边陲，主镇戍疆场，以固封守。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_duliao:0 "度辽将军"
 trait_WJ_mr_jiangjun_duliao_desc:0 "主度辽营，镇抚北边，或以宗室重臣出任。"
 trait_WJ_mr_jiangjun_fenwei:0 "奋威将军"
 trait_WJ_mr_jiangjun_fenwei_desc:0 "主奋发威德，多统锐卒陷阵，以勇闻于军中。"
 trait_WJ_mr_jiangjun_fenwu:0 "奋武将军"
 trait_WJ_mr_jiangjun_fenwu_desc:0 "取奋发武勇之意，多统精兵为前驱，先登陷阵。"
 trait_WJ_mr_jiangjun_fubei:0 "抚北将军"
 trait_WJ_mr_jiangjun_fubei_desc:0 "抚慰北方军民，主持节巡行，存问疾苦。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_fubo:0 "伏波将军"
 trait_WJ_mr_jiangjun_fubo_desc:0 "主水陆征讨，或渡江越海，平南土之乱，威震海隅。"
 trait_WJ_mr_jiangjun_fudong:0 "抚东将军"
 trait_WJ_mr_jiangjun_fudong_desc:0 "抚慰东方军民，主持节巡行，存问疾苦。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_fuguo:0 "辅国将军"
 trait_WJ_mr_jiangjun_fuguo_desc:0 "主辅佐国政。此为高级将领，多授宗室重臣，或参赞帷幄，出督诸军。"
 trait_WJ_mr_jiangjun_fujun:0 "辅军将军"
 trait_WJ_mr_jiangjun_fujun_desc:0 "主辅佐军事。此为高级将领，多授资深宿将，参议戎机，匡赞军谋。"
 trait_WJ_mr_jiangjun_funan:0 "抚南将军"
 trait_WJ_mr_jiangjun_funan_desc:0 "抚慰南方军民，主持节巡行，存问疾苦。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_fuxi:0 "抚西将军"
 trait_WJ_mr_jiangjun_fuxi_desc:0 "抚慰西方军民，主持节巡行，存问疾苦。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_fuyuan:0 "抚远将军"
 trait_WJ_mr_jiangjun_fuyuan_desc:0 "主安抚远方，或持节巡行边郡，存问疾苦，安辑流亡。"
 trait_WJ_mr_jiangjun_guanjun:0 "冠军将军"
 trait_WJ_mr_jiangjun_guanjun_desc:0 "勇冠三军，多授功勋宿将，或督诸军为统帅。"
 trait_WJ_mr_jiangjun_hengye:0 "横野将军"
 trait_WJ_mr_jiangjun_hengye_desc:0 "取横野无敌之意，多统骑兵驰骋平原，摧折敌阵。"
 trait_WJ_mr_jiangjun_hou:0 "后将军"
 trait_WJ_mr_jiangjun_hou_desc:0 "四方将军之一，主征伐，典宿卫。此为高级将领，开府置吏，统兵征讨。"
 trait_WJ_mr_jiangjun_hujun:0 "护军将军"
 trait_WJ_mr_jiangjun_hujun_desc:0 "主掌禁兵，监护诸将。此为高级将领，典武官选举，亦可出督外军。"
 trait_WJ_mr_jiangjun_huwei:0 "虎威将军"
 trait_WJ_mr_jiangjun_huwei_desc:0 "威猛如虎，多授骁将，或督诸军征讨，领兵镇戍方面。"
 trait_WJ_mr_jiangjun_jianwei:0 "建威将军"
 trait_WJ_mr_jiangjun_jianwei_desc:0 "主树立军威，或以新设军号，建牙开府，督护诸军。"
 trait_WJ_mr_jiangjun_jianwu:0 "建武将军"
 trait_WJ_mr_jiangjun_jianwu_desc:0 "主建立武功，多因战功而拜，统兵征伐四方。"
 trait_WJ_mr_jiangjun_jianzhong:0 "建忠将军"
 trait_WJ_mr_jiangjun_jianzhong_desc:0 "主树立忠节，或以忠烈之后特拜，示朝廷褒崇忠义。"
 trait_WJ_mr_jiangjun_jingbei:0 "靖北将军"
 trait_WJ_mr_jiangjun_jingbei_desc:0 "绥靖北方边疆，主平定寇乱，以安疆场。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_jingbian:0 "靖边将军"
 trait_WJ_mr_jiangjun_jingbian_desc:0 "主安定边疆，镇守边塞，谨烽火，通斥候，以备胡虏。"
 trait_WJ_mr_jiangjun_jingdong:0 "靖东将军"
 trait_WJ_mr_jiangjun_jingdong_desc:0 "绥靖东方边疆，主平定寇乱，以安疆场。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_jinglue:0 "经略将军"
 trait_WJ_mr_jiangjun_jinglue_desc:0 "主经略一方，或假以便宜，统筹军民，权任颇重。"
 trait_WJ_mr_jiangjun_jingnan:0 "靖南将军"
 trait_WJ_mr_jiangjun_jingnan_desc:0 "绥靖南方边疆，主平定寇乱，以安疆场。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_jingnan_zhong:0 "靖难将军"
 trait_WJ_mr_jiangjun_jingnan_zhong_desc:0 "主平定国难。此为高级将领，危疑之际受命，忠诚柱石，以清祸乱。"
 trait_WJ_mr_jiangjun_jingxi:0 "靖西将军"
 trait_WJ_mr_jiangjun_jingxi_desc:0 "绥靖西方边疆，主平定寇乱，以安疆场。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_jinu:0 "积弩将军"
 trait_WJ_mr_jiangjun_jinu_desc:0 "主弓弩射击，统强弩士，以远射毙敌，守隘制胜。"
 trait_WJ_mr_jiangjun_lingjun:0 "宣威将军"
 trait_WJ_mr_jiangjun_lingjun_desc:0 "主掌练兵，典武选。此为高级将领，多授勋臣宿将，或持节镇戍，训齐军伍。"
 trait_WJ_mr_jiangjun_longxiang:0 "龙骧将军"
 trait_WJ_mr_jiangjun_longxiang_desc:0 "如龙腾骧，重号之选。此为高级将领，统精锐中军，亦可出督方面诸军事，权任甚重。"
 trait_WJ_mr_jiangjun_louchuan:0 "楼船将军"
 trait_WJ_mr_jiangjun_louchuan_desc:0 "主水军战舰，统楼船、戈船诸部，习流列阵，以备水战。"
 trait_WJ_mr_jiangjun_piaoyao:0 "嫖姚将军"
 trait_WJ_mr_jiangjun_piaoyao_desc:0 "取劲疾勇锐之意。此为高级将领，多授骁勇善战者，统精骑奔袭。"
 trait_WJ_mr_jiangjun_pingbei:0 "平北将军"
 trait_WJ_mr_jiangjun_pingbei_desc:0 "平定北方，主讨平叛乱，绥靖州郡。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_pingdong:0 "平东将军"
 trait_WJ_mr_jiangjun_pingdong_desc:0 "平定东方，主讨平叛乱，绥靖州郡。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_pingnan:0 "平南将军"
 trait_WJ_mr_jiangjun_pingnan_desc:0 "平定南方，主讨平叛乱，绥靖州郡。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_pingxi:0 "平西将军"
 trait_WJ_mr_jiangjun_pingxi_desc:0 "平定西方，主讨平叛乱，绥靖州郡。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_qian:0 "前将军"
 trait_WJ_mr_jiangjun_qian_desc:0 "四方将军之一，主征伐，典宿卫。此为高级将领，开府置吏，统兵征讨。"
 trait_WJ_mr_jiangjun_qingche:0 "轻车将军"
 trait_WJ_mr_jiangjun_qingche_desc:0 "主车骑驰骋，统轻车锐卒，利在赴敌急速，转战千里。"
 trait_WJ_mr_jiangjun_saoni:0 "扫逆将军"
 trait_WJ_mr_jiangjun_saoni_desc:0 "主扫荡叛逆，或以境内不臣，奉诏讨击，以清奸宄。"
 trait_WJ_mr_jiangjun_tunqi:0 "屯骑将军"
 trait_WJ_mr_jiangjun_tunqi_desc:0 "主屯驻骑兵，或戍守要地，以备非常，亦可随时征调。"
 trait_WJ_mr_jiangjun_weibei:0 "威北将军"
 trait_WJ_mr_jiangjun_weibei_desc:0 "威震北方诸郡，主以兵威慑敌，不战而屈人之兵。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_weidong:0 "威东将军"
 trait_WJ_mr_jiangjun_weidong_desc:0 "威震东方诸郡，主以兵威慑敌，不战而屈人之兵。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_weinan:0 "威南将军"
 trait_WJ_mr_jiangjun_weinan_desc:0 "威震南方诸郡，主以兵威慑敌，不战而屈人之兵。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_weishuo:0 "卫朔将军"
 trait_WJ_mr_jiangjun_weishuo_desc:0 "主护卫北疆。此为高级将领，镇守边塞，谨备胡虏，以固朔方。"
 trait_WJ_mr_jiangjun_weixi:0 "威西将军"
 trait_WJ_mr_jiangjun_weixi_desc:0 "威震西方诸郡，主以兵威慑敌，不战而屈人之兵。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_wuwei:0 "武卫将军"
 trait_WJ_mr_jiangjun_wuwei_desc:0 "掌武卫禁兵。此为高级将领，统中军精锐宿卫宫省，亦可出讨叛逆。"
 trait_WJ_mr_jiangjun_wuyi:0 "武毅将军"
 trait_WJ_mr_jiangjun_wuyi_desc:0 "主武勇刚毅。此为高级将领，多授果敢善战者，统陷阵死士。"
 trait_WJ_mr_jiangjun_xiaoqi:0 "骁骑将军"
 trait_WJ_mr_jiangjun_xiaoqi_desc:0 "主骁锐骑兵，统精骑突驰，摧折敌锋，为军之爪牙。"
 trait_WJ_mr_jiangjun_xuanfeng:0 "宣风将军"
 trait_WJ_mr_jiangjun_xuanfeng_desc:0 "主宣扬风化，或以文吏兼武，持节巡行，宣慰州郡。"
 trait_WJ_mr_jiangjun_xuanrui:0 "宣锐将军"
 trait_WJ_mr_jiangjun_xuanrui_desc:0 "主宣扬锐气，或统新练精卒，示敌以强，先声夺人。"
 trait_WJ_mr_jiangjun_yangwu:0 "扬武将军"
 trait_WJ_mr_jiangjun_yangwu_desc:0 "主宣扬武德，或统兵扬威，征讨不庭，以张国势。"
 trait_WJ_mr_jiangjun_yaowu:0 "耀武将军"
 trait_WJ_mr_jiangjun_yaowu_desc:0 "主耀武扬威，或以军容壮盛，震慑不庭，示强国威。"
 trait_WJ_mr_jiangjun_yijun:0 "翊军将军"
 trait_WJ_mr_jiangjun_yijun_desc:0 "主辅佐军事，擘画筹策，参赞帷幄，或以文吏兼武。"
 trait_WJ_mr_jiangjun_yingyang:0 "鹰扬将军"
 trait_WJ_mr_jiangjun_yingyang_desc:0 "如鹰之飞扬，主伺机奋击，多领精卒为军锋。"
 trait_WJ_mr_jiangjun_you:0 "右将军"
 trait_WJ_mr_jiangjun_you_desc:0 "四方将军之一，主征伐，典宿卫。此为高级将领，开府置吏，统兵征讨。"
 trait_WJ_mr_jiangjun_youji:0 "游击将军"
 trait_WJ_mr_jiangjun_youji_desc:0 "主游击之兵，出没无常，以扰敌后，断其粮道。"
 trait_WJ_mr_jiangjun_yulin:0 "羽林将军"
 trait_WJ_mr_jiangjun_yulin_desc:0 "主羽林军，统禁卫精骑，宿卫宫省，亦常从征四方。"
 trait_WJ_mr_jiangjun_zhechong:0 "折冲将军"
 trait_WJ_mr_jiangjun_zhechong_desc:0 "取折冲御侮之义，主方面守御，或统州郡兵以备寇。"
 trait_WJ_mr_jiangjun_zhenbei:0 "镇北将军"
 trait_WJ_mr_jiangjun_zhenbei_desc:0 "镇守北方，主方面镇戍，兼理军民，保境安民。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_zhendong:0 "镇东将军"
 trait_WJ_mr_jiangjun_zhendong_desc:0 "镇守东方，主方面镇戍，兼理军民，保境安民。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_zhengbei:0 "征北将军"
 trait_WJ_mr_jiangjun_zhengbei_desc:0 "征伐北方，主征讨之事，统兵出征，威震朔漠。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_zhengdong:0 "征东将军"
 trait_WJ_mr_jiangjun_zhengdong_desc:0 "征伐东方，主征讨之事，统兵出征，威震海隅。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_zhengnan:0 "征南将军"
 trait_WJ_mr_jiangjun_zhengnan_desc:0 "征伐南方，主征讨之事，统兵出征，威震南土。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_zhenguo:0 "镇国将军"
 trait_WJ_mr_jiangjun_zhenguo_desc:0 "主镇守国家。此为高级将领，多授元勋重臣，或督护诸军，以安社稷。"
 trait_WJ_mr_jiangjun_zhengxi:0 "征西将军"
 trait_WJ_mr_jiangjun_zhengxi_desc:0 "征伐西方，主征讨之事，统兵出征，威震西陲。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_zhenjun:0 "镇军将军"
 trait_WJ_mr_jiangjun_zhenjun_desc:0 "位次四镇，掌方面军事。此为高级将领，或镇戍要郡，统兵御敌。"
 trait_WJ_mr_jiangjun_zhennan:0 "镇南将军"
 trait_WJ_mr_jiangjun_zhennan_desc:0 "镇守南方，主方面镇戍，兼理军民，保境安民。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_zhenwei:0 "振威将军"
 trait_WJ_mr_jiangjun_zhenwei_desc:0 "主振奋军威，或临危受命，激励士气，以弱击强。"
 trait_WJ_mr_jiangjun_zhenwu:0 "振武将军"
 trait_WJ_mr_jiangjun_zhenwu_desc:0 "主振兴武备，或整军经武，缮治甲兵，以备征调。"
 trait_WJ_mr_jiangjun_zhenxi:0 "镇西将军"
 trait_WJ_mr_jiangjun_zhenxi_desc:0 "镇守西方，主方面镇戍，兼理军民，保境安民。此为出镇方面之重将。"
 trait_WJ_mr_jiangjun_zuo:0 "左将军"
 trait_WJ_mr_jiangjun_zuo_desc:0 "四方将军之一，主征伐，典宿卫。此为高级将领，开府置吏，统兵征讨。"
 trait_WJ_mr_xiaowei_anbei:0 "安北校尉"
 trait_WJ_mr_xiaowei_anbei_desc:0 "主安抚北方军事，持节镇抚，绥靖州郡，存问疾苦。\n\n※ 此职非镇守一方者不轻授，若未膺边任，则循重号校尉加职。"
 trait_WJ_mr_xiaowei_anding:0 "安东校尉"
 trait_WJ_mr_xiaowei_anding_desc:0 "主安抚东方军事，持节镇抚，绥靖州郡，存问疾苦。\n\n※ 此职非镇守一方者不轻授，若未膺边任，则循重号校尉加职。"
 trait_WJ_mr_xiaowei_andingyi:0 "定夷校尉"
 trait_WJ_mr_xiaowei_andingyi_desc:0 "主安定夷族，持节监临，绥靖东夷诸部，以固海疆。\n\n※ 此职非镇守一方者不轻授，若未膺边任，则循重号校尉加职。"
 trait_WJ_mr_xiaowei_annan:0 "安南校尉"
 trait_WJ_mr_xiaowei_annan_desc:0 "主安抚南方军事，持节镇抚，绥靖州郡，存问疾苦。\n\n※ 此职非镇守一方者不轻授，若未膺边任，则循重号校尉加职。"
 trait_WJ_mr_xiaowei_anxi:0 "安西校尉"
 trait_WJ_mr_xiaowei_anxi_desc:0 "主安抚西方军事，持节镇抚，绥靖州郡，存问疾苦。\n\n※ 此职非镇守一方者不轻授，若未膺边任，则循重号校尉加职。"
 trait_WJ_mr_xiaowei_bingbu:0 "步兵校尉"
 trait_WJ_mr_xiaowei_bingbu_desc:0 "主步兵，北军五校之一，掌上林苑门屯兵，亦统步卒征伐四方。"
 trait_WJ_mr_xiaowei_bingwei:0 "兵卫校尉"
