l_simp_chinese:
 hd_j16.0001.t:0 "大限将至"
 hd_j16.0001.desc:0 "刀光已近在咫尺。你这一生的恩怨，到此都要有个了结：仇家的脚步就在门外，左右的人已散去大半，再没有可以退的地方。"
 hd_j16.0001.desc_again:0 "上一回你咬着牙撑了过来，可这一回，门外的人不会再给你喘息的工夫。"
 hd_j16.0001.a:0 "生死有命，何惧之有。"
 hd_j16.0001.b:0 "大丈夫岂能坐以待毙！"
 hd_j16_core_sick_again_desc:0 "旧疾复发，来势比上一回更凶。医者跪在榻前不敢抬头，你心里明白，这一次是撑不过去了，该把身后事一件件交代清楚。"
 liaodongxianggong_desc:0 "慕容廆以晋辽东郡公终，晋廷追谥曰襄，后世称辽东襄公。"
