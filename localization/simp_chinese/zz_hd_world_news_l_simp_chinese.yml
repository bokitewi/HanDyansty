l_simp_chinese:
 hd_world_news.a: "天下又要变了"

 hd_world_news.0001.t: "黄天当立"
 hd_world_news.0001.desc: "冀州传来急报：太平道的密谋被唐周告发，马元义在雒阳车裂。[hd_news_a.GetName]不再等待，自称天公将军，在[hd_news_place.GetName]揭竿而起。\n\n同一时间，[hd_news_c.GetName]在[hd_news_place_c.GetName]、[hd_news_d.GetName]在[hd_news_place_d.GetName]相继举兵。三十六方头裹黄巾，州郡告急的文书一日数至。\n\n“苍天已死，黄天当立。”这句话，如今已传遍天下。"

 hd_world_news.0002.t: "灵帝驾崩"
 hd_world_news.0002.desc: "雒阳传出噩耗：天子[hd_news_a.GetName]崩于南宫。\n\n皇子[hd_news_b.GetName]在何进与何皇后扶持下嗣位，可宫中宦官与外戚早已势同水火。新君年幼，大将军与常侍们都在等对方先动手。\n\n天下人都把目光投向了[hd_news_place.GetName]。"

 hd_world_news.0003.t: "凉州兵入雒"
 hd_world_news.0003.desc: "何进死于宫门，袁绍兄弟屠尽宦官，雒阳大乱。混乱之中，[hd_news_a.GetName]率凉州铁骑抢先入城，在北邙迎回了出逃的天子。\n\n如今[hd_news_place.GetName]内外尽是西凉兵马，司隶诸郡改换门庭。朝中公卿看着这位不请自来的“救驾功臣”，谁也说不准天子还能自己做几分主。"

 hd_world_news.0004.t: "董卓废立"
 hd_world_news.0004.desc: "[hd_news_a.GetName]在[hd_news_place.GetName]召集百官，当众宣布废黜少帝，改立陈留王[hd_news_b.GetName]为天子。\n\n满朝公卿无人敢言，只有袁绍横刀长揖，出奔冀州。废立之事一出，关东州郡人心浮动，讨伐之议已在暗中酝酿。"

 hd_world_news.0005.t: "关东举兵"
 hd_world_news.0005.desc: "关东州郡歃血为盟，推[hd_news_a.GetName]为盟主，传檄天下，共讨国贼[hd_news_b.GetName]。\n\n盟军以[hd_news_place.GetName]为根本，各路兵马向雒阳方向开进。这场战争的胜负，将决定天子落在谁的手中。"

 hd_world_news.0006.t: "联军得胜"
 hd_world_news.0006.desc: "讨董联军击败了[hd_news_b.GetName]，盟主[hd_news_a.GetName]接管了河南之地，兵锋直抵[hd_news_place.GetName]。\n\n然而大功初成，诸侯之间的猜忌便浮上水面。董卓退据关中，联军各怀心思，天下并未因此安定。"

 hd_world_news.0007.t: "联军无功"
 hd_world_news.0007.desc: "关东联军久攻不下，盟主[hd_news_a.GetName]与诸侯日日置酒高会，终至粮尽兵散。[hd_news_b.GetName]依旧挟持天子，坐镇[hd_news_place.GetName]。\n\n诸侯纷纷引兵归去，转而互相攻伐。讨董之盟，到此名存实亡。"

 hd_world_news.0008.t: "焚雒西迁"
 hd_world_news.0008.desc: "为避关东兵锋，[hd_news_a.GetName]挟天子[hd_news_b.GetName]西迁，迁都[hd_news_place.GetName]。临行前纵火焚烧雒阳宫室，驱赶数百万百姓西行，沿途死者相枕于道。\n\n两百年帝都，一夕化为焦土。从此天子的诏令，要从长安发出了。"

 hd_world_news.0009.t: "国贼伏诛"
 hd_world_news.0009.desc: "长安传来消息：[hd_news_a.GetName]已经死了。\n\n这个挟持天子、焚毁雒阳的人一倒，西凉旧部群龙无首，关中局势顿时变得难以预料。"
 hd_world_news.0009.wang_desc: "长安传来消息：司徒[hd_news_b.GetName]与吕布合谋，在宫门前诛杀了[hd_news_a.GetName]。\n\n据说长安士民听闻此讯，歌舞于道，卖掉衣物换酒肉相庆。可董卓的西凉旧部仍拥兵在外，王允能否收拾这个局面，谁也不敢断言。"
 hd_world_news.0009.killed_desc: "长安传来消息：[hd_news_a.GetName]死在了[hd_news_b.GetName]手中。\n\n这个挟持天子、焚毁雒阳的人一倒，西凉旧部群龙无首，关中局势顿时变得难以预料。"

 hd_world_news.0010.t: "西凉兵反攻长安"
 hd_world_news.0010.desc: "董卓死后，西凉旧部惶惶不安。[hd_news_a.GetName]听从贾诩之计，收拢散兵，一路杀回关中，兵锋直指[hd_news_place.GetName]的[hd_news_b.GetName]。\n\n长安城中才刚刚松了一口气，转眼又要面对一场血战。"

 hd_world_news.0011.t: "奉迎天子"
 hd_world_news.0011.desc: "[hd_news_a.GetName]以奉迎天子为名，自[hd_news_place.GetName]起兵，向[hd_news_b.GetName]宣战。\n\n谁能把天子迎到自己身边，谁就能奉天子以令不臣。这场战争的结果，会让天下格局为之一变。"

 hd_world_news.0012.t: "天子东归"
 hd_world_news.0012.desc: "[hd_news_a.GetName]迎得天子[hd_news_b.GetName]，天子与朝廷随之迁到了[hd_news_place.GetName]。\n\n从此诏书出自[hd_news_a.GetFirstNameNoTooltip]之手。四方诸侯有的上表称贺，有的暗自切齿，也有人开始盘算怎样把天子再夺回来。"

 hd_world_news.0013.t: "官渡对峙"
 hd_world_news.0013.desc: "北方只剩下两雄。[hd_news_a.GetName]自[hd_news_place.GetName]出兵，[hd_news_b.GetName]起河北之众迎战，两军相持于官渡。\n\n此战胜者，将据有整个中原。"

 hd_world_news.0014.t: "官渡：袁军溃败"
 hd_world_news.0014.desc: "官渡一战，[hd_news_a.GetName]以少胜多，[hd_news_b.GetName]的大军一夕崩溃。\n\n河北诸州从此门户洞开，北方的主人已经换了。"

 hd_world_news.0015.t: "官渡：袁军得胜"
 hd_world_news.0015.desc: "官渡一战，[hd_news_a.GetName]挡住了[hd_news_b.GetName]的大军，曹军败退，河南之地人心动摇。\n\n与史书不同，这一次是河北袁氏占了上风。"

 hd_world_news.0016.t: "大军南下"
 hd_world_news.0016.desc: "[hd_news_a.GetName]挥师南下，水陆并进，向[hd_news_b.GetName]宣战，战船连绵数百里。孙刘两家结盟抗曹，坐镇[hd_news_place.GetName]的[hd_news_b.GetFirstNameNoTooltip]已无路可退，江东的命运系于此战。\n\n这一战若胜，天下将归于一统；若败，三分之势便定了。"

 hd_world_news.0017.t: "赤壁：北军退却"
 hd_world_news.0017.desc: "赤壁一把大火，烧尽了[hd_news_b.GetName]的战船。北军死伤大半，又逢疾疫，只得退回北方。\n\n[hd_news_a.GetName]守住了江东，天下三分之势，由此而定。"

 hd_world_news.0018.t: "赤壁：江防已破"
 hd_world_news.0018.desc: "与史书不同，[hd_news_a.GetName]的大军突破了长江防线，[hd_news_b.GetName]的江东基业岌岌可危。\n\n长江天险已破，天下离一统只差最后几步。"

 hd_world_news.0019.t: "地方叛乱"
 hd_world_news.0019.desc: "[hd_news_a.GetName]在[hd_news_place.GetName]举兵作乱，矛头直指[hd_news_b.GetName]。\n\n州郡的急报一封接一封送出，地方上已经乱了。"

 hd_world_news.0020.t: "胡骑南下"
 hd_world_news.0020.desc: "[hd_news_a.GetName]聚集部众，自[hd_news_place.GetName]起兵，要夺取[hd_news_title.GetName]，与[hd_news_b.GetName]一决雌雄。\n\n塞外胡骑越过旧日的边界，中原的门户已被叩开。"

 hd_hi.1001.where: "\n\n#weak 起兵之地：[hd_news_place.GetName]#!"
