l_simp_chinese:
 hd_world_news.a: "天下又要变了"

 hd_world_news.0001.t: "黄天当立"
 hd_world_news.0001.desc: "一块黄布被展开，原先用来祈福禳病的颜色，如今成了聚众的旗号。唐周告密，马元义死于雒阳，[hd_news_a.GetName]在[hd_news_place.GetName]提前举兵；我听到这里，身旁的人已不再议论符水是否灵验。\n\n[hd_news_c.GetName]起于[hd_news_place_c.GetName]，[hd_news_d.GetName]起于[hd_news_place_d.GetName]，三十六方的约定正随着黄旗传开。有人说乡里早有信众往来，有人忙着辩白，自家不过请他们治过一场病。方才还并坐的人，忽然都想同旁人隔开些。\n\n我看着那块黄布。戴上它便可能招来官兵，藏起它又未必能撇清干系；昔日同往祈福的邻人，如今也不得不留意彼此的神色。"
 hd_world_news.0001.missing_details_desc:0 "一块黄布被展开，原先用来祈福禳病的颜色，如今成了聚众的旗号。唐周告密，马元义死于雒阳，[hd_news_a.GetName]提前举兵；我听到这里，身旁的人已不再议论符水是否灵验。\n\n各地起兵的消息接连送来，三十六方的约定正随着黄旗传开。有人说乡里早有信众往来，有人忙着辩白，自家不过请他们治过一场病。方才还并坐的人，忽然都想同旁人隔开些。\n\n我看着那块黄布。戴上它便可能招来官兵，藏起它又未必能撇清干系；昔日同往祈福的邻人，如今也不得不留意彼此的神色。"

 hd_world_news.0002.t: "灵帝驾崩"
 hd_world_news.0002.desc: "天子[hd_news_a.GetName]崩于南宫的消息传来，方才说到一半的话全停了。从[hd_news_place.GetName]送出的文书中，[hd_news_b.GetName]的名字又被反复提起；谈到继位与辅政，人们总绕不开何进和何皇后。我整好衣襟，听着身旁的人压低声音。\n\n传出的丧讯，很快便夹杂着外戚与宦官的名字。讲到新君，有人只说年幼；讲到宫门，又有人忽然住了口。白衣可以依礼换上，御前那些互不相让的人，却不会随着一次举哀便消去旧怨。\n\n举哀时，众人依次俯首，起身后却又各有话说。我望着他们的神色，想到宫中的人也将如此：丧礼须照常举行，旧日的争执却不会随天子一同埋葬。"

 hd_world_news.0003.t: "凉州兵入雒"
 hd_world_news.0003.desc: "“救驾功臣”几个字被念得格外郑重，我听见后面紧接着的，却是凉州兵、宫门守卫与司隶诸郡。何进死后留下的空缺，已由[hd_news_a.GetName]率兵填上，[hd_news_place.GetName]内外开始听从新的号令。\n\n京师流传的说法里，公卿仍穿着从前的朝服，入宫时却须从陌生甲士面前走过。有人抬出家世与官位，守卒只认当日的军令；有人想斥责，又在看清刀柄之后将话咽了回去。朝廷没有少一重礼数，门前却多了一道谁也绕不过去的问话。\n\n我想起平日那些递进宫中的荐书。纸上的家世、名望与旧交，到了手握兵器的人面前，究竟还能替主人撑住多少体面？"

 hd_world_news.0004.t: "董卓废立"
 hd_world_news.0004.desc: "新诏书上的称谓，使诵读的人停顿了一下。[hd_news_a.GetName]在[hd_news_place.GetName]废黜少帝，改立陈留王[hd_news_b.GetName]。我看着那处改换的名号，耳边仍留着前些日子称颂先帝所立储君的话。\n\n礼官自能为新君排出朝仪，执笔的人也自能寻出合适的典故。真正难说出口的，是刀兵在侧时，百官的俯首究竟该算奉诏，还是屈从。有人把新诏捧得极高，仿佛只要礼数周全，就不必再望向宣告废立的那个人。\n\n我伸手扶住将要滑落的卷尾，诵读的人终于接了下去。方才的停顿再没有被提起，那个新换的称谓，却从此每次都要当着众人说出口，连惯于附和的人也须重新留意自己的舌头。"

 hd_world_news.0005.t: "关东举兵"
 hd_world_news.0005.desc: "讨贼的檄文传开，平日说话最谨慎的人，也敢将[hd_news_b.GetName]的罪状逐条念出。[hd_news_a.GetName]被推为盟主，关东诸军从[hd_news_place.GetName]一带相继进发，誓言护持汉室。\n\n我听到盟书上的名号，一个个都是有门第、有兵众的人。昨日尚须各自求人周旋的事，如今被说成诸公同心，仿佛只待军旗并列，宫门里的耻辱便可以洗净。念到歃血为盟，有人用指节轻叩席沿，忍不住接了一声好。\n\n这声好落下，屋里却静了片刻。说忠义容易，一旦同盟来求通行、求粮、求一队能够赴死的人，檄文上的每个字便都要落在活人身上。我将那份盟书重新展平，血誓还未干，往后各家的兵粮往来，都少不了再提起这些誓言。"

 hd_world_news.0006.t: "联军得胜"
 hd_world_news.0006.desc: "捷书念到[hd_news_b.GetName]败退，后面的颂辞便一声高过一声。[hd_news_a.GetName]的联军得胜，河南诸县却没有交到哪一家手中，[hd_news_place.GetName]一带各县自守，各立其主。几日前还并列的诸侯名字，如今在报捷文书上已有了先后。\n\n我将卷首读回去，才发现攻城、出粮、接应，每一件事都被写明是谁的功劳。结盟时说的是共扶汉室，受赏时却须分清哪一家出了多少力；同样几个人，换一种次序排在纸上，便能叫旁人品出许多意思。\n\n听到末尾，文书上又列出一串有功者的名字。董卓退守关中，河南诸县已各自为政；方才还齐声称贺的人，此时却听得格外仔细，直到最后一人念过，才慢慢坐了回去。"

 hd_world_news.0007.t: "联军无功"
 hd_world_news.0007.desc: "讨董的盟书被重新取了出来，封存时留下的折痕还很清楚。可[hd_news_a.GetName]终究未能使诸军取胜，兵马陆续散去；[hd_news_b.GetName]仍据[hd_news_place.GetName]，天子的处境也没有因那场盟誓得到解脱。\n\n我用手指抚过纸上密密的名号。起兵时，那些名字被念作朝廷的援手；如今人们说起他们，先问谁先退走，谁吝惜军粮，谁将别人的败阵当成了自己的便宜。原先指向一人的痛骂，转眼散到了昔日同盟身上。\n\n有人想把盟书收起，我仍按着卷角。哪怕无人再肯照它行事，那些誓言也确实被说出过。等散去的人重逢，再要像从前一样举杯，只怕又要想起今日这些怨言。"
 hd_world_news.0007.no_place_desc: "讨董的盟书被重新取了出来，封存时留下的折痕还很清楚。可[hd_news_a.GetName]终究未能使诸军取胜，兵马陆续散去；[hd_news_b.GetName]尚在人世，天子的处境也没有因那场盟誓得到解脱。\n\n我用手指抚过纸上密密的名号。起兵时，那些名字被念作朝廷的援手；如今人们说起他们，先问谁先退走，谁吝惜军粮，谁将别人的败阵当成了自己的便宜。原先指向一人的痛骂，转眼散到了昔日同盟身上。\n\n有人想把盟书收起，我仍按着卷角。哪怕无人再肯照它行事，那些誓言也确实被说出过。等散去的人重逢，再要像从前一样举杯，只怕又要想起今日这些怨言。"

 hd_world_news.0008.t: "焚雒西迁"
 hd_world_news.0008.desc: "说起雒阳，往日先说宫阙的人，如今先说火。被迫西行的人带着烧破的衣物，将祖先的木主裹在怀里；传到我耳中的哭诉里，有人找孩子，有人只求替家中老人留一处能歇脚的地方。\n\n[hd_news_a.GetName]挟天子[hd_news_b.GetName]迁往[hd_news_place.GetName]，雒阳的宫室遭到焚毁。一道迁都之令，可以让官吏改写诏书的来处，却不能替路上的人捡回丢失的家当。有人说京城还会重建，讲到自家门前那棵树时，却忽然说不下去了。\n\n我听着，伸手拢好眼前的灯火。讲到失散者的姓名，有人连问了两遍怎么写，郑重记在宫室焚毁的消息旁边。那几个字很小，写完以后，却迟迟没有人肯将这一页翻过去。"

 hd_world_news.0009.t: "国贼伏诛"
 hd_world_news.0009.desc: "董卓的死讯传开，周围的人一时竟不知道该怎样称呼他。[hd_news_a.GetName]已经不在了，方才还脱口而出的尊称被匆匆咽下，另有人试着说了一个贼字，说完便看向旁人的脸。\n\n死讯传开之后，昔日受过他荐举、依过他军势，或因他丢过亲族的人，都要重新盘算自己的处境。有人急着撇清旧日往来，有人却问西凉兵还认不认原来的号令。\n\n我没有接上那句骂声。一个活人使众人不敢说话，死后又使众人争着表态；宫门钥匙仍在，兵器也仍在，那些忽然可以放大的声音，真能越过门前的甲士么？"
 hd_world_news.0009.wang_desc: "司徒[hd_news_b.GetName]与吕布合谋诛杀[hd_news_a.GetName]，消息正在长安传开。有人拍手叫好，有人忙着向朝廷道贺；董卓的名字被人直呼出来，不再像昨日那样令人噤声。\n\n据说城中有人卖衣买酒，庆贺的杯盏一直传到街边。可说到城外的西凉兵，笑声便又低了些。诛贼之功可以在一日之间立下，旧部的甲兵、家属与积怨，却还要留给活着的人处置。\n\n我把已经举到手中的杯放低。杀董的消息值得人记住，宫门前那柄倒转的兵器也值得人记住；今日它替朝廷除去挟持者，明日长安要凭什么使握兵的人肯听号令？"
 hd_world_news.0009.killed_desc: "[hd_news_a.GetName]死在[hd_news_b.GetName]手中的消息，使几个正说话的人齐齐住了口。有人先问是谁亲自动手，另有人立刻改口，说这早该是董卓的下场。我听见那份急切，却分不清其中有多少是欢喜，多少是要赶在旁人前面表明态度。\n\n挟持天子的人倒下了，取他性命的名字也将被四处传说。可一同传开的，还有旧部报仇的议论、亲附者自辩的言辞，以及那些不愿再提昔日往来的沉默。杀死一个人，竟使许多人都忙着重新讲述自己的过去。\n\n我看向身旁刚刚改口的人。他避开目光，将余下的话咽了回去。方才人人争着说话，此刻却静了下来；旧日的往来，并不能靠几句痛骂便抹去。"

 hd_world_news.0010.t: "西凉兵反攻长安"
 hd_world_news.0010.desc: "长安方才出现的笑声，很快便被西凉兵重新集结的消息压了下去。[hd_news_a.GetName]收拢旧部，进攻[hd_news_place.GetName]，与[hd_news_b.GetName]交兵。董卓已死，跟随他的人却还带着兵器，也带着不肯交到旁人手里的性命。\n\n传出的两种说法彼此顶撞：城中说这是反攻朝廷，军中说不拼命便只能等人处置。贾诩劝他们收拢兵众、攻向长安的言辞，也被反复转述，越说越像一条只许向前的活路。\n\n我听到“活路”二字，想到的却是城门里的人。诛董时尚能分清谁是国贼，如今每一方都在说自己不能退让；若宫门又被撞开，站在御座旁的人还能拿出什么，使刀兵在面前停住？"

 hd_world_news.0011.t: "奉迎天子"
 hd_world_news.0011.desc: "“奉迎天子”的名目一出，许多寻常军务忽然都被说成了忠义。[hd_news_a.GetName]从[hd_news_place.GetName]发兵，向[hd_news_b.GetName]宣战；写在檄文里的，是护送车驾、尊奉朝廷，随军带去的却仍是攻城的器具。\n\n我听人争论该称这一行为救驾还是争权。说救驾的举出天子受制的旧事，说争权的反问，迎到身边以后，御前的军队难道便会自己散去？两边都能引出堂皇的道理，说到最后，反而争得比先前更加激烈。\n\n我将那句奉迎在心里又念了一遍。同样是请天子动身，由谁来请、车驾往哪座城去，便足以使一些人俯首称贺，使另一些人拔刀相拒。此刻，这句话已随着战鼓传向城下。"

 hd_world_news.0012.t: "天子东归"
 hd_world_news.0012.desc: "朝贺的表章里，颂扬天子的辞句仍旧熟悉，送往何处的题记却已换了。[hd_news_a.GetName]迎得天子[hd_news_b.GetName]，朝廷迁到[hd_news_place.GetName]。我看着那处新写的地名，才觉出一次迁徙能让多少人的礼数重新安排。\n\n有人说汉室终于得到护持，随即便有人提起，想把话送到御前，如今须先过[hd_news_a.GetFirstNameNoTooltip]这一关。先前可以彼此推托的诸侯，往后再接到诏命，便不能只说朝廷远在兵乱之中。诏书上的天子名号没有变，奉诏的人却都知道，背后多了一支能够催问他们的军队。\n\n我将表章的末尾看完。恭顺的辞句排得整齐，执笔的人却在一处应诺上留下了空白。他又蘸了一次墨，笔尖悬在那里，等着有人先把奉诏究竟要交出什么说清楚。"

 hd_world_news.0013.t: "官渡对峙"
 hd_world_news.0013.desc: "两家的兵旗被并排说起时，声音都不自觉地低了些。[hd_news_a.GetName]从[hd_news_place.GetName]出兵，[hd_news_b.GetName]率河北之众迎战，官渡已成了诸军相持之处。曾经在同一场盟会中出现的名号，如今分立两边。\n\n我听人算各家的兵数，算着算着，又翻出了旧日的交情：谁曾举荐谁，谁受过谁的周济，谁在诸侯之间有过怎样的名望。可这些足以使席间宾主相让的恩义，此刻都没有让一支军队停下来。\n\n有人说起故人，话到一半便改成了敌军。我听着这个新称呼，才觉出那些旧日恩义如今有多难开口。等两面旗帜之间响起战鼓，再想叙旧，也得先看自己站在哪一边。"

 hd_world_news.0014.t: "官渡：袁军溃败"
 hd_world_news.0014.desc: "官渡的胜负传开，先前还被人称道的袁军声势，忽然成了席上叹息的话柄。[hd_news_a.GetName]获胜，[hd_news_b.GetName]兵败，旧日倚重河北门第与兵势的人，此刻连一句辩解也说得艰难。\n\n我看见有人将本已取出的书信重新塞回袖里。那上面的称谓昨日还很妥当，今日便显得过于亲热；另有人谈起胜军时，将早先的迟疑轻轻略过，仿佛自己从未说过相反的话。兵马尚在收整，宾客的座次却已经先在众人口中换了一遍。\n\n我听完，没有催那封信再取出来。战败者失去城池与部众，依附其声势的人失去的，则是一种无需解释便有人肯听的分量。眼下每个人都在寻找新的说辞，生怕开口得比旁人晚了一步。"

 hd_world_news.0015.t: "官渡：袁军得胜"
 hd_world_news.0015.desc: "写着曹军败退的那几行字，使先前笃定的话都变了声调。[hd_news_a.GetName]守住官渡，[hd_news_b.GetName]未能取胜；河北的兵旗仍立着，袁氏先前备受称道的声望，如今又多了一场胜仗作为凭据。\n\n我听见有人重提袁氏的门第，又有人不耐地打断，说阵前的生死岂是几代公卿换来的。争论很快变得尖锐：一场胜败，使旧日被压下的怨言与辩解都找到了出口，各人说的似乎是两军，其实也在替自己过去的判断争一份体面。\n\n我垂眼看着那封战报。得胜的人自然有人称颂，退回去的人却还须面对部众、宾客与从前的承诺。同样一句“再作打算”，从败军口中说出，终究比旁人想的更重。"

 hd_world_news.0016.t: "大军南下"
 hd_world_news.0016.desc: "关于降与战的争论，随着南下的大军一同传开。[hd_news_a.GetName]向[hd_news_b.GetName]开战，孙刘两家结盟相拒；[hd_news_place.GetName]的[hd_news_b.GetFirstNameNoTooltip]，如今正面对水陆并进的兵势。\n\n我听到的劝降辞句都很相像：保全门户，少受兵灾，莫将一身之气换作满地性命。主战的人却反问，谁能替放下兵器的人担保，往后仍有开口说话的余地？那些话被旁人转述出来，仍足以使在座者彼此望上一眼。\n\n江水可以托起战船，也把许多人家隔在两岸。那些踏上船板的人，未必听过这番争论；只要战鼓响起，他们便得向着对岸去。想到这里，我又看了一眼文书上的降、战二字。"

 hd_world_news.0017.t: "赤壁：北军退却"
 hd_world_news.0017.desc: "最初传开的是火，随后才是败退与疫病。[hd_news_b.GetName]的北军离开江上，[hd_news_a.GetName]守住了江东。讲述的人说船一燃便难以靠近，水里有人呼救，岸上的人却也只顾奔走。\n\n我听着那些被反复转述的声音，才发现方才还在谈兵势的人，已经许久没有开口。胜报里有应当称颂的将领，败报里有必须承担罪责的人，可落水者喊出的多半只是一个能救命的名字，未必有人听见，更未必有人来得及记住。\n\n有人低声问，这些人还能不能回家。那一句比前面的军功与责难都轻，却使我想起许多等在门边的人：他们所盼的，或许从来不是一份足以传遍天下的捷书，只是一阵熟悉的叩门声。"

 hd_world_news.0018.t: "赤壁：江防已破"
 hd_world_news.0018.desc: "江防告破的消息，使许多倚仗大江的豪言忽然没有了回声。[hd_news_a.GetName]的军队渡过防线，[hd_news_b.GetName]未能将攻势挡住；往日被称作天险的江流，此刻成了军队能够继续向前的道路。\n\n我听人争说沿江门户该如何自处。守城者要人同心，携家者只想先留一条退路，惯于在两边往来的宾客则劝大家莫将话说绝。兵锋尚未抵到每一家门前，几种打算摆到同一张席上，谁也说服不了谁，连起身离去都显得别有用意。\n\n我将目光从门边收回。江水替人挡兵时，许多嫌隙都可以藏在“尚有天险”一句里；如今这句话说不出口，人们便须露出各自真正想保住的东西。"

 hd_world_news.0019.t: "地方叛乱"
 hd_world_news.0019.desc: "说起[hd_news_place.GetName]的兵乱，有人将一条道路上的地名连着念出，又猛然停在了其中一处。[hd_news_a.GetName]已举兵向[hd_news_b.GetName]发难，那人的亲眷恰在那里，方才置身事外的神情，转眼便消失了。\n\n我听他问哪里还能托人带信，身旁却有人催着讲叛军的兵势。他忍了片刻，终于问道：“若换作你家在那里，还只问有多少兵么？”这句话顶得对方一时无言，连旁边的人也将坐席挪开了些。\n\n起兵的名号传到这里，不过几句话；被牵进去的人，却各有自己不肯舍下的门户与亲属。我看着那个攥紧衣角的人，忽然明白，他急于知道的不是这场兵乱该叫什么，而是留在那里的亲人还能不能平安回信。"

 hd_world_news.0020.t: "胡骑南下"
 hd_world_news.0020.desc: "“他们这回要的，是整片疆土。”有人指着[hd_news_title.GetName]的名字，将话说得很慢。[hd_news_a.GetName]已在[hd_news_place.GetName]聚众起兵，与[hd_news_b.GetName]交战；骑队已经出动，旧日商议边界的办法，如今再也挡不住兵锋。\n\n我听到有人提起互市，也有人提起旧怨。往常谈这些事，尚可慢慢列出哪处失约、哪家受过损失；如今一说到军队，各人便急着用自己的遭遇解释所有人的打算，恨不得将几代人的争执一并算清。\n\n我抬起手，那些声音才略低下去。出征的部众已经动身，守军也要持械相迎，夹在其间的人却仍有田土与亲属要顾。一个刚才厉声争辩的人说到一半忽然停住，转而说起自己留在边地的兄长，再开口时，已经没有方才那样响亮。"

 hd_hi.1001.where: "\n\n#weak 起兵之地：[hd_news_place.GetName]#!"
