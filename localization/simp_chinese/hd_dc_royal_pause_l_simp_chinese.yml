l_simp_chinese:
 hd_dc_support.0008.d: "君昔欠我一诺，请罢兵一年为偿。"
 hd_dc_support.0008.d.tt: "[hd_dc_support_claimant.GetTitledFirstName]一派须按兵一年：既不递最后通牒，也不兴兵相向。"
 hd_dc_support.0308.t: "暂收兵谏"
 hd_dc_support.0308.desc: "往来的书信旁，添了一道一年的期限。[scope:hd_dc_support.Var('hd_dc_support_recipient').Char.GetTitledFirstName]拿出[scope:hd_dc_support.Var('hd_dc_support_claimant').Char.GetTitledFirstName]从前欠下的人情，换来了这一年的按兵不动，兴兵的文书暂且压了下来。\n\n派中的人并没有散去，心里的不平也还在。一年之后，此事还会再被提起；只是眼下，这一派不会因此动刀兵。"
 hd_dc_support.0308.a: "一年为期，谨记之。"
 hd_dc_support.paused_demand: "既有缓兵之约，此书且留中不发。"
