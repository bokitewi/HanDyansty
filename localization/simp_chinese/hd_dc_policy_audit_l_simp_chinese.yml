l_simp_chinese:
 hd_dc_par.0001.t: "一场赈济，两份奏章"
 hd_dc_par.0001.desc: "两份奏章谈的是同一处灾情，主张却背道而驰。一方请求减赋，让百姓先熬过眼下；另一方列出国库与军费的支用，认为此时更应守住现行税制。\n\n两位领袖已经分别写下自己的意见。接下来的诏令会交到真正管辖当地的人手里，不能只在朝堂上争一个名声。"
 hd_dc_par.0001.a: "分别提交可核验的支出与受益名单。"
 hd_dc_par.0001.a.tt: "承办官三个月内接受后实付30金，记录对应郡、具名收款人和实际收付；再由两党魁分别在三个月内核账。两份具名确认齐备才治理+10、争执−5。拒绝、失权、超时或付款不全不获完成分。"
 hd_dc_par.0001.b: "先准减赋，由主张此策的一方领衔办理。"
 hd_dc_par.0001.b.tt: "先由减赋派领袖接受原条款，再由实际地方官接受。两级分别三个月答复；实付100金后执行十二个月减赋。原条款只可接受或拒绝；实际期满完成才治理+5。"
 hd_dc_par.0001.c: "先守现行税制，两位都收敛一些。"
 hd_dc_par.0001.c.tt: "记录保留现策的真实命令，争执+10；两党魁因斥责对你−10，已署名支持保库者另因保留其政策对你+10。此次节点结束，不增加税率或治理分。"
 hd_dc_par.0001.d: "在两处相近的地方试行，再共同验收。"
 hd_dc_par.0001.d.tt: "需要两处真实受灾郡，发展差不超过3、控制差不超过10；你管理至少16，或受信任的承办官满足此能力。两位实际地方官分别接受后，各实付50金：原案郡减赋十二个月，另一郡保留现策十二个月。减赋税收−10%、发展增长+25%、民意+20。两郡实际履行且两党魁分别验收，才治理+20；不预定胜负、不凭空增加发展等级。"
 hd_dc_par.invalid: "情形已变，旧文书不能再照办。"
 hd_dc_par.1301.t: "落到地方的诏令"
 hd_dc_par.1301.audit: "朝廷要求核对[hd_dc_audit_county.GetName]的政策支出和受益对象，由我承办账册。接受后拨来三十金，收付记录与这处郡的实际情况一并交给两位党魁核查。\n\n我须在三个月内明确答复，不能只收下文书便让朝廷以为事情已经办妥。"
 hd_dc_par.1301.relief: "[hd_dc_audit_county.GetName]被选作减赋试行的一侧。朝廷拟拨五十金，由我实际执行十二个月减赋，与另一处相近受灾郡的现策相比较。\n\n两地分别答应后才拨款。我的名字将写在执行回报上，试行期间失去管辖或中途撤去减赋，都不能记作完整履行。"
 hd_dc_par.1301.reserve: "[hd_dc_audit_county.GetName]被选作保留现策的一侧。朝廷拟拨五十金，由我保留现行税制十二个月，记录控制与发展，与另一处减赋的受灾郡共同验收。\n\n我不必证明自己所属的一派永远正确，却必须对自己实际执行的事负责。"
 hd_dc_par.1301.a: "我接受这份明确的差遣。"
 hd_dc_par.1301.b: "这份差遣，我不能承接。"
 hd_dc_par.1302.t: "请在核账回报上署名"
 hd_dc_par.1302.first: "案卷列出的第一处是[scope:hd_dc_instance.Var('hd_dc_audit_first_county').Title.GetName]，承办人为[scope:hd_dc_instance.Var('hd_dc_audit_first_executor').Char.GetTitledFirstName]。实际拨出[scope:hd_dc_instance.Var('hd_dc_audit_first_payment').Var('hd_dc_actual_debit').GetValue|0]金，实际到账[scope:hd_dc_instance.Var('hd_dc_audit_first_payment').Var('hd_dc_actual_credit').GetValue|0]金。\n\n这些账目需要我亲自核对。另一位领袖也将单独提交答复，不能用我的落款代替。"
 hd_dc_par.1302.second: "\n\n另一处是[scope:hd_dc_instance.Var('hd_dc_audit_second_county').Title.GetName]，承办人为[scope:hd_dc_instance.Var('hd_dc_audit_second_executor').Char.GetTitledFirstName]。实际拨出[scope:hd_dc_instance.Var('hd_dc_audit_second_payment').Var('hd_dc_actual_debit').GetValue|0]金，实际到账[scope:hd_dc_instance.Var('hd_dc_audit_second_payment').Var('hd_dc_actual_credit').GetValue|0]金。\n\n两地十二个月的实际执行已经核验。第一处控制[scope:hd_dc_instance.Var('hd_dc_audit_first_start_control').GetValue|0]→[scope:hd_dc_instance.Var('hd_dc_audit_first_end_control').GetValue|0]，发展[scope:hd_dc_instance.Var('hd_dc_audit_first_start_development').GetValue|0]→[scope:hd_dc_instance.Var('hd_dc_audit_first_end_development').GetValue|0]；第二处控制[scope:hd_dc_instance.Var('hd_dc_audit_second_start_control').GetValue|0]→[scope:hd_dc_instance.Var('hd_dc_audit_second_end_control').GetValue|0]，发展[scope:hd_dc_instance.Var('hd_dc_audit_second_start_development').GetValue|0]→[scope:hd_dc_instance.Var('hd_dc_audit_second_end_development').GetValue|0]。这些变化并非都由试行造成，不能凭此夸称哪一派获胜。"
 hd_dc_par.1302.a: "我已逐项核过，同意署名。"
 hd_dc_par.1302.b: "我不在这份验收上署名。"
 hd_dc_par.1303.t: "这一案应当怎样记下"
 hd_dc_par.1303.verified: "收付凭据和两位领袖各自的署名已经齐备。经手人将此案按实际履行结清，所约治理分也只记这一次。\n\n案卷没有因此宣称天下已定，更没有替尚未解决的战争或承诺写下结局。"
 hd_dc_par.1303.partial: "两处试行未能同时完整履行。已付的钱、曾经执行的政策和中断的原因分别留在案卷中；实际尚未到账的差额继续留账。\n\n不能把一处的完成记作两处都完成，这次不发放整项治理分。"
 hd_dc_par.1303.failed: "这次差遣未能集齐所需的接受、履行与核账。经手人已记下终止原因，已发生的收付仍据实保留，欠缺的凭据不能用一纸结案补齐。\n\n此节点没有获得完成治理分。"
 hd_dc_par.1303.a: "按实情存卷。"
