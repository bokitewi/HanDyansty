l_simp_chinese:
 hd_dc_par.0001.t: "一场赈济，两份奏章"
 hd_dc_par.0001.desc: "两份奏章说的是同一处灾情，主张却南辕北辙。一方请求减赋，让百姓先熬过眼下；另一方列出国库与军费的开支，认为此时更该守住现行的税制。\n\n两位领袖各执一词，都在等你裁断。诏令终究要落到地方守令的手里，不能只在朝堂上争一个名声。"
 hd_dc_par.0001.a: "命双方各具出入之数，清查账目。"
 hd_dc_par.0001.a.tt: "若当地守令肯承办账目，再交两位领袖分别查验："
 hd_dc_par.0001.b: "先准减赋，由主其议者领衔。"
 hd_dc_par.0001.b.tt: "若主张减赋的领袖领命，当地守令也肯开办，减赋便可试行一年："
 hd_dc_par.0001.c: "仍守旧制，二卿各宜收敛。"
 hd_dc_par.0001.d: "择两处相近之郡，并试而验之。"
 hd_dc_par.0001.d.tt: "若两郡守令都肯承办——一郡减赋，一郡照旧——一年之后，再由两位领袖共同验看："
 hd_dc_par.invalid: "时移事易，旧书不可再行。"
 hd_dc_par.1301.t: "落到地方的诏令"
 hd_dc_par.1301.audit: "朝廷要清查[hd_dc_audit_county.GetName]的钱粮出入与受益之人，命你承办账册。你若应允，朝廷便拨来三十金，账目连同当地的情形，一并交两位领袖查验。\n\n三个月内须有个明白的答复，总不能收下文书，就让朝廷以为事情已经办妥。"
 hd_dc_par.1301.relief: "[hd_dc_audit_county.GetName]被选作减赋试行的一方。朝廷拟拨五十金，命你在此减赋一年，与另一处相近的受灾之郡两相比较。\n\n两地都应允之后，钱才会拨下来。回报之上将写着你的名字——试行期间若失了治权，或中途撤去减赋，都算不得善始善终。"
 hd_dc_par.1301.reserve: "[hd_dc_audit_county.GetName]被选作照旧征收的一方。朝廷拟拨五十金，命你一年之内维持现行的税制，记下当地的治理与生计，与另一处减赋之郡一同验看。\n\n你不必证明自己所属的那一派永远正确，却须对自己亲手办的事负责。"
 hd_dc_par.1301.a: "此差遣，吾愿承之。"
 hd_dc_par.1301.a.tt: "待各方都应允，朝廷的拨款便会送到："
 hd_dc_par.1301.b: "此差遣，恕难承接。"
 hd_dc_par.1302.t: "核账署名"
 hd_dc_par.1302.first: "案卷上的第一处是[scope:hd_dc_instance.Var('hd_dc_audit_first_county').Title.GetName]，由[scope:hd_dc_instance.Var('hd_dc_audit_first_executor').Char.GetTitledFirstName]承办。账上记着：拨出[scope:hd_dc_instance.Var('hd_dc_audit_first_payment').Var('hd_dc_actual_debit').GetValue|0]金，到账[scope:hd_dc_instance.Var('hd_dc_audit_first_payment').Var('hd_dc_actual_credit').GetValue|0]金。\n\n这些账目须你亲自核过。另一位领袖也会单独作答，谁也不能替谁落款。"
 hd_dc_par.1302.second: "\n\n另一处是[scope:hd_dc_instance.Var('hd_dc_audit_second_county').Title.GetName]，由[scope:hd_dc_instance.Var('hd_dc_audit_second_executor').Char.GetTitledFirstName]承办。账上记着：拨出[scope:hd_dc_instance.Var('hd_dc_audit_second_payment').Var('hd_dc_actual_debit').GetValue|0]金，到账[scope:hd_dc_instance.Var('hd_dc_audit_second_payment').Var('hd_dc_actual_credit').GetValue|0]金。\n\n两地一年的试行都已期满。第一处，控制由[scope:hd_dc_instance.Var('hd_dc_audit_first_start_control').GetValue|0]至[scope:hd_dc_instance.Var('hd_dc_audit_first_end_control').GetValue|0]，发展由[scope:hd_dc_instance.Var('hd_dc_audit_first_start_development').GetValue|0]至[scope:hd_dc_instance.Var('hd_dc_audit_first_end_development').GetValue|0]；第二处，控制由[scope:hd_dc_instance.Var('hd_dc_audit_second_start_control').GetValue|0]至[scope:hd_dc_instance.Var('hd_dc_audit_second_end_control').GetValue|0]，发展由[scope:hd_dc_instance.Var('hd_dc_audit_second_start_development').GetValue|0]至[scope:hd_dc_instance.Var('hd_dc_audit_second_end_development').GetValue|0]。这些变化未必都是试行之功，凭此夸称哪一派得胜，并不妥当。"
 hd_dc_par.1302.a: "逐项核毕，愿署其名。"
 hd_dc_par.1302.b: "此验收，吾不署名。"
 hd_dc_par.1303.t: "案卷合上之时"
 hd_dc_par.1303.verified: "钱款的凭据，和两位领袖各自的署名，都已齐备。经手的人将此案合卷，不再另拨钱款，也不再续行试办。\n\n案卷并没有因此宣称天下已定，更没有替尚未了结的战事与承诺写下结局。"
 hd_dc_par.1303.partial: "两处试行，没能同时办到期满。已拨的钱、推行过的政令、中途断绝的缘由，都分别记在案卷里；尚未到账的钱，也还挂在账上。\n\n一处办成了，算不得两处都办成。"
 hd_dc_par.1303.failed: "这件差遣，没能凑齐所需的应允、承办与查验。经手的人记下了中止的缘由，已经出入的钱款照旧留账；缺了的凭据，不能凭一纸结语补齐。"
 hd_dc_par.1303.a: "存卷备考。"
