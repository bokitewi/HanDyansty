l_simp_chinese:
 hd_dc_roy.0001.t: "宗庙之下，座次有别"
 hd_dc_roy.0001.desc: "礼官刚把席签铺开，[hd_dc_favored.GetTitledFirstName]便按住了离御座最近的那一张。\n\n“臣在外奔走多年，总不至于连一席之地也求不得。”[hd_dc_favored.GetSheHe]按着不放。[hd_dc_displaced.GetTitledFirstName]把名册推到你面前，指着原先排定的次序：“今日能移一席，明日还有什么不能移？”\n\n两人都在等你开口。帛册上其余的宗亲，也会从这句话里听出自己的分量。"
 hd_dc_roy.0001.a: "宗亲各有其位，悉依旧例。"
 hd_dc_roy.0001.b: "近席予卿，议事之时当为朕援。"
 hd_dc_roy.0001.b.tt: "若[hd_dc_favored.GetTitledFirstName]应允此约，其余宗亲难免心生怨望："
 hd_dc_roy.0001.c: "朕之席次，不容宗亲置喙。"
 hd_dc_roy.0001.d: "请宗中耆老主持礼序。"
 hd_dc_roy.0001.d.tt: "若宗中长辈应允出面，你须奉上一份谢仪。#EMP 长辈能否劝得双方心服，难以预料。#!"
 hd_dc_roy01_mediation_terms: "[hd_dc_proposer.GetTitledFirstName]敬请[hd_dc_recipient.GetTitledFirstName]以宗中长辈之尊，依旧日名册主持礼序，并劝请求近席的一方退让。劝得成也好，劝不成也罢，谢仪三十金照奉不误。三月不复，此请作罢。"
 hd_dc_roy01_mediation_written_terms: "[hd_dc_recipient.GetTitledFirstName]复书[hd_dc_proposer.GetTitledFirstName]：愿往主持，谢仪仍旧。唯请将见证之人、所作裁定，以及有谁不服，一并载入宗册，以昭后人。"
 hd_dc_roy.0101.mediation_success: "长辈把旧册摊开，一席一席地指出当初定下的次序。请求近席的宗亲还想争辩，听到最后，终于松开了手里的席签。\n\n礼官依裁定重排了名册，记下见证人的名字。三十金的谢仪如数送上，争执的两人也各自向对方行了礼。这一回，没有人再争。"
 hd_dc_roy.0101.mediation_failure: "长辈按旧册逐席作了裁定。礼官刚把名册收好，请求近席的宗亲便站了起来：“名次可以照写，臣却不服。”\n\n谢仪已经送上，裁定也已写入名册。事情办了，争执却没有就此平息；那位不服的宗亲，名字被另记在了册尾。"
 hd_dc_roy.0101.mediation_unpaid: "长辈已经应允，谢仪却没能如数送到。礼官拿着文书回来，不敢再往下办。\n\n名册仍照原样排着，这一场调停，就这样搁下了。"
 hd_dc_roy.0101.mediation_cancelled: "调停终究没能走到裁定那一步——或是长辈没有回音，或是婉言推辞，又或是如今已不便出面。\n\n礼官把往来书信封存起来。名册上，并没有添上一场不曾有过的和解。"
 hd_dc_roy.window_closed: "情势已变，此事须另行计议。"
 hd_dc_roy01_precedence_terms: "[hd_dc_proposer.GetTitledFirstName]以宗庙首席授予[hd_dc_recipient.GetTitledFirstName]，其余宗亲次序如旧。宗室议事之书送到之日，[hd_dc_recipient.GetTitledFirstName]当于三月之内具名回奏，共议各支所请。此席不及兵权俸禄，亦不必迁居京师。三月不复，此议作罢。"
 hd_dc_roy01_precedence_guarantee: "[hd_dc_recipient.GetTitledFirstName]复书[hd_dc_proposer.GetTitledFirstName]：首席之赐，愿拜受之；唯请一年之内，此席不复更易，名册亦不重排。议事之书到日，当于三月之内具名回奏。兵权俸禄，概不相求。"
 hd_dc_roy.0101.t: "席签与回书"
 hd_dc_roy.0101.accepted: "使者把落了印的文书送回案上。礼官照约定重排了席签，近席的那个名字，已经写进了名册。\n\n随名册一同送出的，还有给各支宗亲的议事邀书。印信已齐，接下来要看的是，得了首席的人会不会如约回奏。"
 hd_dc_roy.0101.rejected: "文书退了回来，落印处仍是一片空白。使者带回一句话：“席位与效力，不该写在同一张纸上。”\n\n礼官收起备好的席签，仍照旧册送出议事的邀书。近席没有易人，这番许诺也没有换来半分支持。"
 hd_dc_roy.0101.expired: "期限已过，回书的匣子仍是空的。礼官来问还要不要再等，你瞥了一眼那份始终没有落印的文书。\n\n此议就此作罢，席签仍照旧册排列。"
 hd_dc_roy.0101.invalidated: "礼官带回了那份近席的文书，却没有动名册——当初议定的人，有的已不能赴议，有的已经失势，这份约定再也无法照原样办下去。\n\n宗亲们的诉求还摆在那里，可旧文书已经做不得数了。"
 hd_dc_roy.0101.a: "录之于册。"
 hd_dc_roy.0102.t: "宗室议书"
 hd_dc_roy.0102.desc: "使者送来一封议书，封皮上写着你的礼序：第[SCOPE.GetValue('hd_dc_invitation_rank')|0]席。宗室名册已经排定，朝廷请你就各支的封赏与职任，写一份具名的回奏。\n\n这一回不必带着从人入宫，只消把意见写在纸上，便会列入议程。落印的地方，还空着。"
 hd_dc_roy.0102.a: "取纸笔来，当说之话须写明白。"
 hd_dc_roy.0102.a.tt: "你求取近席时许下的承诺，就此兑现。"
 hd_dc_roy.0102.b: "封还议书，不为此落印。"
 hd_dc_roy.0102.b.tt: "你曾以此为诺换来近席，如今却要食言。"
 hd_dc_ritual_fairness_opinion: "恢复宗室旧序"
 hd_dc_ritual_disappointment_opinion: "近席请求被驳回"
 hd_dc_ritual_command_opinion: "皇帝裁定礼序"
 hd_dc_ritual_precedence_opinion: "近席有所偏重"
 hd_dc_royal_cooperation_opinion: "宗室议论受到压制"
 hd_dc_royal_support_opinion: "争位中的立场"
