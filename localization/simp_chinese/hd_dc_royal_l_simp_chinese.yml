l_simp_chinese:
 hd_dc_ritual_register_title:0 "宗室礼序"
 hd_dc_roy.0001.t: "宗庙之下，座次有别"
 hd_dc_roy.0001.desc: "礼官刚把席签铺开，[hd_dc_favored.GetTitledFirstName]便按住了离御座最近的一张。\n\n“臣在外奔走，总不能连一席之地也求不得。”[hd_dc_favored.GetSheHe]没有松手。[hd_dc_displaced.GetTitledFirstName]将名册推到我面前，指着原已排定的次序：“今日能移一席，明日又有什么不能移？”\n\n两人都在等我的话。帛册上列着的其余宗亲，也会从这句话里听出自己的分量。"
 hd_dc_roy.0001.a: "宗亲皆有其位，按旧例重排。"
 hd_dc_roy.0001.a.tt: "恢复本次危机确认的旧礼序，暂缓近席优待。矛盾−5，治理+10；守旧序一方对你+10，请求近席者对你−10，持续5年。"
 hd_dc_roy.0001.b: "近席可以给你，议事时须有你的支持。"
 hd_dc_roy.0001.b.tt: "向具名宗亲提出近席与议事支持约定，等待真实答复。接受后才改变名册；其他竞争者动员+10、对你−15，受优待者对你+20，持续5年。签约本身另按共同签署的关系效果记账。拒绝、过期或失效不授予近席。"
 hd_dc_roy.0001.c: "朕的席次，不由宗亲议论。"
 hd_dc_roy.0001.d: "请最受敬重的长辈主持礼序。"
 hd_dc_roy.0001.d.tt: "邀请双方都信任、未参与争位的宗室长辈。长辈真实接受后支付30金，请其依本次冻结的旧序裁定。实际主持后治理+15，见证长辈对你+15；外交检定成功则矛盾−10、双方相互好感+10，失败则请求近席者拒绝裁定、矛盾+5。未接受或办理时余额不足不会记作成功。"
 hd_dc_roy01_mediation_terms: "请你作为共同见证人，依据本次宗室名册已经冻结的旧序主持裁定，并劝请求近席的一方接受。双方签署后，皇帝从私产支付你30金主持费用。劝说未成仍按实际主持结算；邀请本身不扣款、不改变席位。"
 hd_dc_roy01_mediation_written_terms: "主持费仍为30金，按本次冻结旧序裁定。请将具名见证人、实际裁定及是否有人拒绝一并写入名册，并向朝廷交付结果文书。皇帝确认这项书面记载后再行办理。"
 hd_dc_roy.0101.mediation_success: "长辈将旧册摊开，一席一席地指出当初确认的次序。请求近席的宗亲还想争辩，听到最后，终于松开了手里的席签。\n\n礼官已经照裁定重排名册，记下共同见证人的姓名。三十金主持费如数交付；双方也各自向对方执礼，这一回没有再争。"
 hd_dc_roy.0101.mediation_failure: "长辈按旧册逐席作了裁定。礼官刚将名册收好，请求近席的宗亲便起身道：“名次可以照写，臣却不能服。”\n\n主持费三十金已经交付，见证与裁定也已落册。事情确实办了，争执却没有因此平息；拒绝裁定者的姓名另记在册尾。"
 hd_dc_roy.0101.mediation_unpaid: "礼官拿着已签的文书回来，费用却未能如约结清。没有完整的付款凭据，这次调停不能继续按已办成的事记账。\n\n名册保留原来的席次，文书附着实际付款记录，留待朝廷核对。"
 hd_dc_roy.0101.mediation_cancelled: "调停文书未能办到裁定这一步。礼官把答复与办理记录一并封存：没有回应、明确回绝，或如今已经不具备主持条件，都不能写成双方和解。\n\n册上没有添入一场并未完成的调停。"
 hd_dc_roy.0001.c.tt: "确认现行名册，驳回双方争执。矛盾+10，获得少量威望；争执双方对你各−15，强硬外姓封臣对你+10，宗室协作好感−5，持续5年。"
 hd_dc_roy.window_closed: "情势已变，这份文书须重新办理。"
 hd_dc_roy01_precedence_terms: "皇帝授予请求者本次宗室礼序的第一席，其他宗亲维持相对次序。受授者承诺在议书送达后90日内以书面答复参加宗室议事，支持将各支诉求列入共同议程。此约不授兵权、不增俸禄，也不要求迁入宫廷。"
 hd_dc_roy01_precedence_guarantee: "皇帝授予请求者本次礼序的第一席，并保证一年内不得收回或重新分配这次礼序。受授者须在议书送达后90日内提交书面意见，支持将各支诉求列入共同议程。保障期间名册冻结；不授兵权、不增俸禄、不要求迁廷，两方重新确认后才执行。"
 hd_dc_roy.0101.t: "席签与回书"
 hd_dc_roy.0101.accepted: "使者将已落印的文书放回案上。礼官照着两方确认的条款重排了席签，近席的名字已写入名册。\n\n随名册送出的还有一封议事邀请。印信已经齐全，接下来要看的，是受授者会不会交来应允过的答复。"
 hd_dc_roy.0101.rejected: "文书退了回来，落印处仍是空白。使者带回一句话：“席位与效力，不该写在同一张纸上。”\n\n礼官收起预备换用的席签，仍依现行名册送出议事邀请。近席没有易人，这次提议也没有换来支持。"
 hd_dc_roy.0101.expired: "答复期限已过，案上的回书匣仍然空着。礼官请示是否还要等候，我看了一眼尚未落印的文书。\n\n此次提案就此作罢。席签仍按现行名册排列，未成交的约定不能记作一份支持。"
 hd_dc_roy.0101.invalidated: "礼官带回了近席文书，却没有改动名册。有人已不能赴议，或落印时的权位已经易手；这份约定如今无法照原样执行。\n\n案上留下了未能办理的记载。现任朝廷仍须面对宗亲的诉求，却不能把旧文书当成已经交付的恩赏。"
 hd_dc_roy.0101.a: "把实际办理的结果记入名册。"
 hd_dc_roy.0102.t: "依次送来的议书"
 hd_dc_roy.0102.desc: "使者送来议书，封上列着我的礼序：第[SCOPE.GetValue('hd_dc_invitation_rank')|0]席。宗室名册已经确认，朝廷请我就各支封赏与职任的诉求交一份具名答复。\n\n纸上留着可以落印的空处。这次不用携从人入宫；只要写下意见，朝廷便会把我的答复列入议程。"
 hd_dc_roy.0102.a: "取纸来。我会把该说的话写清楚。"
 hd_dc_roy.0102.a.tt: "在议书实际送达后90日内提交具名意见。若你此前以参加此次议事换取近席，这项书面答复义务即履行完毕。意见可以赞同或反对朝廷主张；提交答复不代表拥立或战争支持，不会自动加入派系或迁移宫廷。"
 hd_dc_roy.0102.b: "把议书退回去，我不为这次安排落印。"
 hd_dc_roy.0102.b.tt: "明确拒绝参加。若此前已签署本次议事支持约定，将留下具名失约记录；没有签约者只记录拒绝。"
 hd_dc_ritual_fairness_opinion: "恢复宗室旧序"
 hd_dc_ritual_disappointment_opinion: "近席请求被驳回"
 hd_dc_ritual_command_opinion: "皇帝裁定礼序"
 hd_dc_ritual_precedence_opinion: "近席有所偏重"
 hd_dc_royal_cooperation_opinion: "宗室议论受到压制"
 hd_dc_royal_support_opinion: "公开支持争位主张"
 hd_dc_ritual_register_tt:0 "本次宗室争议的礼序名册。初次确认时按最高头衔等级、年龄先后排列，同级同龄并列；此后保留旧序，另记天子实际授予的近席。后续宗室议事按现行礼序邀请仍有资格的宗亲。"
 hd_dc_ritual_register_row:0 "第[Scope.Var('hd_dc_ritual_rank').GetValue|0]位  [Scope.Var('hd_dc_actor').Char.GetName]  ·  旧序[Scope.Var('hd_dc_ritual_old_rank').GetValue|0]"
