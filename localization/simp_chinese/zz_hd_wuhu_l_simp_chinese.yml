l_simp_chinese:
 # 五胡内附（见 docs/五胡内附_僚人入蜀_设计草案.md 第 4 节）

 rule_hd_wuhu_rule: "五胡内附"
 setting_hd_wuhu_rule_historical: "#high 史实#!"
 setting_hd_wuhu_rule_historical_desc: "南匈奴、武都氐、乌桓按史实年份前来求地；280 年以后的乱世中，内附胡族会起兵自立，刘渊、石勒等人会在史实年份前后起兵。439 年起，边疆收留、通用求地、外族内迁决定和渐进胡化不再发生。"
 setting_hd_wuhu_rule_random: "#high 随机#!"
 setting_hd_wuhu_rule_random_desc: "不看年份窗口，只要条件满足就可能发生。439 年的截止仍然生效。"
 setting_hd_wuhu_rule_player_only: "#high 仅玩家#!"
 setting_hd_wuhu_rule_player_only_desc: "电脑不会主动求地、起兵或推动独立；边疆收留和渐进胡化照常发生，玩家仍可使用相关决定。"
 setting_hd_wuhu_rule_off: "#high 关闭#!"
 setting_hd_wuhu_rule_off_desc: "停用五胡内附。"

 hd_wuhu_land_seized_opinion: "强割封地安置胡人"

 ### 第二层：边疆收留链
 hd_wuhu.2000.t: "边疆胡部求附"
 hd_wuhu.2000.desc: "[hd_wuhu_nomads_county.GetNameNoTier]一带的胡人部众越界放牧，与当地百姓为争草场、水源闹得不可开交。\n\n今日，这群胡人的首领[turkic_leader.GetName]亲自前来见你。[turkic_leader.GetSheHe|U]说部众在塞外已待不下去，只求在你的地界里寻一块地方安身；作为回报，[turkic_leader.GetHerHis]的骑手愿意替你征战。"
 hd_wuhu.2000.a: "纳之，使为我用。"
 hd_wuhu.2000.b: "胡人反复，遣之出塞。"

 hd_wuhu.2001_opening: "主上钧鉴"
 hd_wuhu.2001_letter: "今送上孤儿二人。他们的父母已经饿死，只因[turkic_leader.GetCulture.GetName]人的马群践毁了他们家的田禾果园。主上既如此厚待胡人，想必也肯替胡人祸害过的人担起这份干系。"
 hd_wuhu.2001.a: "此人好生无礼……"
 hd_wuhu.2002_opening: "主上钧鉴"
 hd_wuhu.2002_letter: "前番胡人之事，是我失了分寸，至今追悔。听闻他们已离开[nomads_county.GetNameNoTier]，与百姓的争执也渐渐平息。我仍以为主上当提防胡人，谨献西域胡商带来的金饼数枚，聊表敬意。"
 hd_wuhu.2002.a: "礼既至，前事一笔勾销。"
 hd_wuhu.2002.b: "原物奉还，尔好自为之。"
 hd_wuhu.2003.t: "胡部的赋税"
 hd_wuhu.2003_beginning: "看来，你的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('greedy_chaplain'))][greedy_chaplain.GetFirstName]盯着[turkic_leader.GetName]和[turkic_leader.GetHerHis]的部众已有些日子了。\n\n“[ROOT.Char.Custom('FormOfAddressForLiege')]，”[greedy_chaplain.GetFirstNameNoTooltip]说道，“那些胡人住着我们的地，吃着我们的草，却不按编户纳赋。"
 hd_wuhu.2003_jizya: "依我看，应当让他们按人头另缴一份税钱。”\n\n"
 hd_wuhu.2003_not_jizya: "依我看，当令他们按帐落另输一份赋税。您待他们，已经够宽厚了。”\n\n"
 hd_wuhu.2003_ending: "“这不公道！”[turkic_leader.GetFirstNameNoTooltip]抗声道，“我带着部下的骑射手亲自替您效力。只要您不这样向我们征税，这份恩情，我必定记着。”"
 hd_wuhu.2003.a: "尔部私藏一文，亦当搜出！"
 hd_wuhu.2003.b: "[greedy_chaplain.GetFirstNameNoTooltip]所言有理，尔等当纳赋。"
 hd_wuhu.2003.c: "罢了，[turkic_leader.GetFirstNameNoTooltip]所言亦是。"
 hd_wuhu.2004.t: "胡骑留下的孤儿"
 hd_wuhu.2004.desc: "[orphan_girl.GetName]站在你面前，模样实在可怜；她的弟弟[orphan_boy.GetName]也是一样，浑身是伤。\n\n“求求您，[ROOT.Char.GetTitleTierName]，”她声音发抖，“我们已经好几天没吃东西了。能给我一点饭吗？哪怕是馊的也行……”\n\n再问下去，她其实也说不清该怪谁。“骑马的人踩坏了我们的庄稼，抢走了我们的羊……然后就不见了。我不知道以后该怎么办，也很抱歉[upset_vassal.GetTitledFirstName]拿这点小事来烦您。”"
 hd_wuhu.2004.a: "莫怕，留在我身边吧。"
 hd_wuhu.2004.b: "[turkic_leader.GetFirstNamePossessiveNoTooltip]部落当收养你们，方为公道。"
 hd_wuhu.2004.c: "送往寺观，托庇方外。"
 hd_wuhu.2004.d: "[upset_vassal.GetFirstNameNoTooltip]意欲何为？尔等另寻去处吧。"
 hd_wuhu.2005.t: "胡骑助战"
 hd_wuhu.2005.desc: "你正为战事发愁，[turkic_leader.GetName]带着一队骑手来了。\n\n“[ROOT.Char.GetTitleTierName]，”[turkic_leader.GetSheHe]行礼道，“我答应过支持您，我的部落也答应过。既然您正在打仗，我们愿再借给您一队精熟的骑射手，只助这一仗。等战事平息，他们要回到自己的帐落和家人身边。我们只求您别忘了这份人情。”"
 hd_wuhu.2005.a: "善，此情我记下了。"
 hd_wuhu.2005.b: "人情之说，休要再提！"
 hd_wuhu.2005.c: "心意领了，此战我自能应付。"
 hd_wuhu.2006.t: "流矢"
 hd_wuhu.2006_beginning: "[one_eyed_child.GetName]照常在[ROOT.Char.Custom('ResidenceBuilding')]里跑来跑去，不料出了事。[turkic_leader.GetName]正带着[turkic_leader.GetHerHis]的战士们练习射箭，一支流矢射中了你那顽皮的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('one_eyed_child'))]的眼睛。"
 hd_wuhu.2006_has_court_physician: "“[one_eyed_child.GetSheHe|U]性命无碍，”医者[scoped_physician.GetFirstName]说，“可惜这只眼睛保不住了。恕我直言，以后院子里最好少射些箭。”\n\n"
 hd_wuhu.2006_no_court_physician: "急忙请来的本地医者说[one_eyed_child.GetSheHe]会好起来，但那只眼睛永远看不见了。\n\n"
 hd_wuhu.2006_ending: "“这是意外，”[turkic_leader.GetFirstName]辩解道，“请别急着处罚我，[ROOT.Char.Custom('FormOfAddressForLiege')]。我们不操练，怎么替您守住这片土地？”"
 hd_wuhu.2006.a: "下狱，令其狱中自省箭术。"
 hd_wuhu.2006.b: "自今而后，[ROOT.Char.Custom('ResidenceBuilding')]左近禁止射箭。"
 hd_wuhu.2006.c: "此乃天意，非人之过。"
 hd_wuhu.2007.t: "商路遭劫"
 hd_wuhu.2007.desc: "“[ROOT.Char.GetTitleTierName]，”你的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('warmonger_councillor'))][warmonger_councillor.GetFirstName]说，“[bandits_county.GetName]的商人说遭了马贼劫掠。如今商队都绕着那一带走，生意全给耽误了。请让我去查办此事。”\n\n“不必，”[turkic_leader.GetName]抢着说，“我可以派我的战士长期护卫商路，只要以后许我们在[bandits_county.GetNameNoTierNoTooltip]放牧。这办法不是更好吗？”\n\n[warmonger_councillor.GetFirstNameNoTooltip]却表示反对：“小心，[ROOT.Char.Custom('FormOfAddressForLiege')]，百姓最恨您放任胡人四处游牧。”"
 hd_wuhu.2007.a: "[turkic_leader.GetFirstNamePossessiveNoTooltip]办法更妥。"
 hd_wuhu.2007.b: "此事便交由你查办。"
 hd_wuhu.2007.c: "且待时日，商旅自会复来。"

 hd_wuhu.2099.t: "[turkic_leader.GetFirstNamePossessiveNoTooltip]求封"
 hd_wuhu.2099.desc: "[turkic_leader.GetName]和[turkic_leader.GetHerHis]的部众已替你效力多年。今日，[turkic_leader.GetSheHe]郑重地前来见你。\n\n“[ROOT.Char.Custom('FormOfAddressForLiege')]，我们的人在您的地界里生了孩子、葬了老人，早把这里当成了家。可我们至今仍是寄人篱下。求您赏我们一块土地，让部众真正安顿下来。”\n\n这一次，[turkic_leader.GetSheHe]显然不肯再空手而回。"
 hd_wuhu.2099.a: "便以[hd_wuhu_grant_county_1.GetNameNoTier]赐你。"
 hd_wuhu.2099.b: "[hd_wuhu_grant_county_2.GetNameNoTier]如何？"
 hd_wuhu.2099.c: "唯[hd_wuhu_grant_county_3.GetNameNoTier]可与。"
 hd_wuhu.2099.d: "此事断不可行。"
 hd_wuhu.2099.d.tt: "#EMP [turkic_leader.GetFirstNameNoTooltip]或拂袖而去，或聚众作乱。#!"

 ### 第三层：胡帅带兵求地
 hd_wuhu.3001.t: "胡部求附"
 hd_wuhu.3001.desc: "塞外的[hd_wuhu_chief.GetCulture.GetNameNoTooltip]部众来到边上，首领[hd_wuhu_chief.GetName]遣人求见于你。他们想在[hd_wuhu_petition_target.GetNameNoTier]住下来，"
 hd_wuhu.3001.desc_vassal: "做你的臣属，战时替你出力，以换得在你治下安身。\n\n他们已走投无路，这是明摆着的。可正因无路可走，你一旦拒绝，冲突便在所难免。"
 hd_wuhu.3001.desc_independent: "奉你为主，替你出力，以换你治下的一块土地。\n\n他们或许已走投无路，可看看那些剽悍的骑兵，这与其说是请求，不如说是最后通牒。"
 hd_wuhu.3001.a: "听我号令，[hd_wuhu_petition_target.GetNameNoTierNoTooltip]便归尔等。"
 hd_wuhu.3001.b: "休想！寸土不让胡虏！"

 HD_WUHU_PETITION_CB_NAME: "胡部求地"
 HD_WUHU_PETITION_WAR_NAME: "[ATTACKER.GetCulture.GetNameNoTooltip]部求地[TITLE.GetNameNoTier]"
 hd_wuhu_petition_cb: "$HD_WUHU_PETITION_CB_NAME$"
 hd_wuhu_petition_cb_victory_desc: "胡部以武力夺取了争夺中的[titles|E]。"
 hd_wuhu_petition_cb_victory_desc_attacker: "你以武力夺取了争夺中的[titles|E]。"
 hd_wuhu_petition_cb_defeat_desc: "胡部被击溃，被迫离开你的土地。"
 hd_wuhu_petition_cb_defeat_desc_attacker: "你被迫另寻他处。"
 hd_wuhu_petition_cb_white_peace_desc: "胡部因其勇武被授予土地，成为你的封臣。"
 hd_wuhu_petition_cb_white_peace_desc_attacker: "你获得了一块可以定居的土地，并成为守方的封臣。"

 hd_wuhu_frontier_army_name: "归附胡骑"
 hd_wuhu_frontier_revolt_army_name: "叛胡"
 hd_wuhu_petition_army_name: "内附胡部"

 ### 史实大单于
 hd_wuhu_chanyu_decision: "起兵自立"
 hd_wuhu_chanyu_decision_desc: "天下大乱，晋室诸王互相攻伐，朝廷再也顾不上边地。我的族人散居塞内已经好几代，受尽了驱使和欺凌。如今正是号召部众、自立门户的时候。"
 hd_wuhu_chanyu_decision_tooltip: "号召部众起兵，建立自己的国家"
 hd_wuhu_chanyu_decision_confirm: "举兵！"
 hd_wuhu_chanyu_decision_year_ok: "已届起兵之年"
 hd_wuhu_chanyu_decision_phase_ok: "王朝循环处于动荡、新朝征服、斗争、对峙或崩溃阶段"
 hd_wuhu_chanyu_decision_effect_tt: "你将号召部众，向据有此州城邑最多的诸侯兴兵，四方胡骑闻风来投。若能得胜，便据其州而建国号。"

 HD_WUHU_CHANYU_CB_NAME: "起兵自立"
 HD_WUHU_CHANYU_WAR_NAME: "[ATTACKER.GetFirstNameNoTooltip]起兵据[TITLE.GetBaseName]"
 HD_WUHU_CHANYU_WAR_NAME_BASE: ""
 hd_wuhu_chanyu_cb: "$HD_WUHU_CHANYU_CB_NAME$"
 hd_wuhu_chanyu_war_victory_desc_attacker: "你会夺取[defender.GetShortUINamePossessive]在目标王国法理内的所有头衔，并取得该王国。"
 hd_wuhu_chanyu_war_victory_desc: "夺取[defender.GetShortUINamePossessive]在目标王国法理内的所有头衔，并取得该王国。"
 hd_wuhu_chanyu_war_victory_crown_tt: "进攻方取得或创建目标王国，并定下国号"
 hd_wuhu_chanyu_conquer_army_name: "起兵胡骑"
 hd_wuhu_chanyu_hold_army_name: "部众亲兵"
