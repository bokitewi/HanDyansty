l_simp_chinese:
 # 五胡内附（见 docs/五胡内附_僚人入蜀_设计草案.md 第 4 节）

 rule_hd_wuhu_rule: "五胡内附"
 setting_hd_wuhu_rule_historical: "#high 史实#!"
 setting_hd_wuhu_rule_historical_desc: "南匈奴、武都氐、乌桓按史实年份前来求地；280 年以后的乱世中，内附胡族会起兵自立，刘渊、石勒等人会在史实年份前后起兵。439 年起，边疆收留、通用求地、外族内迁决定和渐进胡化不再发生。"
 setting_hd_wuhu_rule_random: "#high 随机#!"
 setting_hd_wuhu_rule_random_desc: "不看年份窗口，只要条件满足就可能发生。439 年的截止仍然生效。"
 setting_hd_wuhu_rule_player_only: "#high 仅玩家#!"
 setting_hd_wuhu_rule_player_only_desc: "电脑不会主动求地、起兵或推动独立；边疆收留和渐进胡化照常发生，玩家仍可使用相关决定。"
 setting_hd_wuhu_rule_off: "#high 关闭#!"
 setting_hd_wuhu_rule_off_desc: "停用五胡内附。"

 hd_wuhu_land_seized_opinion: "强割封地安置胡人"

 ### 第二层：边疆收留链
 hd_wuhu.2000.t: "边疆胡部求附"
 hd_wuhu.2000.desc: "[hd_wuhu_nomads_county.GetNameNoTier]一带的胡人部众越过边界放牧，和当地百姓为了草场、水源闹得不可开交。\n\n今天，这群胡人的首领[turkic_leader.GetName]亲自来见我。[turkic_leader.GetSheHe|U]说部众在塞外待不下去了，只求在我的地界里有一块地方安身。作为回报，[turkic_leader.GetHerHis]的骑手愿意替我打仗。"
 hd_wuhu.2000.a: "收留他们，让他们替我效力。"
 hd_wuhu.2000.b: "胡人反复无常，打发他们走。"

 hd_wuhu.2001_opening: "主上钧鉴"
 hd_wuhu.2001_letter: "我给您送去两个可怜的孤儿。他们的爹娘饿死了，因为[turkic_leader.GetCulture.GetName]人的马群踩坏了他们家的庄稼和果园。您既然这么喜欢那些胡人，想必也会替胡人祸害过的人负起责任来吧。"
 hd_wuhu.2001.a: "这家伙……"
 hd_wuhu.2002_opening: "主上钧鉴"
 hd_wuhu.2002_letter: "我为自己在胡人一事上的举动感到后悔。他们确实已经离开了[nomads_county.GetNameNoTier]，听说他们和百姓之间的冲突也缓和了。我仍然认为您应当认真提防胡人，但还是想献上几块西域胡商带来的金饼，聊表敬意。"
 hd_wuhu.2002.a: "礼物不错。前事一笔勾销。"
 hd_wuhu.2002.b: "我不要你的东西，也不接受你的借口。"
 hd_wuhu.2003.t: "胡部的赋税"
 hd_wuhu.2003_beginning: "看来，我的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('greedy_chaplain'))][greedy_chaplain.GetFirstName]琢磨[turkic_leader.GetName]和[turkic_leader.GetHerHis]部众已经有些日子了。\n\n“[ROOT.Char.Custom('FormOfAddressForLiege')]，”[greedy_chaplain.GetFirstNameNoTooltip]说，“那些胡人住着我们的地，吃着我们的草，却不按编户纳赋。"
 hd_wuhu.2003_jizya: "依我看，应当让他们按人头另缴一份税钱。”\n\n"
 hd_wuhu.2003_not_jizya: "依我看，应当让他们按帐落另缴一份赋税，您待他们已经够宽厚了吧？”\n\n"
 hd_wuhu.2003_ending: "“这不公平，”[turkic_leader.GetFirstNameNoTooltip]抗议道，“我带着一百名骑射手亲自替您效力。只要您不这样向我们征税，我保证记得您的恩情。”"
 hd_wuhu.2003.a: "我们会把你们部落藏起来的每一文钱都找出来。"
 hd_wuhu.2003.b: "不，[greedy_chaplain.GetFirstNameNoTooltip]说得对，你们得纳税。"
 hd_wuhu.2003.c: "好吧，[turkic_leader.GetFirstNameNoTooltip]，这样也算公平。"
 hd_wuhu.2004.t: "胡骑留下的孤儿"
 hd_wuhu.2004.desc: "[orphan_girl.GetName]看起来实在可怜，她的弟弟[orphan_boy.GetName]也一样，浑身是伤。\n\n“求求您，[ROOT.Char.GetTitleTierName]，”她声音发抖，“我们已经好几天没吃东西了。能给我一点饭吗？哪怕是馊的也行……”\n\n再问下去，她其实也说不清该怪谁。“骑马的人踩坏了我们的庄稼，抢走了我们的羊……然后就不见了。我不知道以后该怎么办，也很抱歉[upset_vassal.GetTitledFirstName]拿这点小事来烦您。”"
 hd_wuhu.2004.a: "别怕，我收留你们。"
 hd_wuhu.2004.b: "让[turkic_leader.GetFirstNamePossessiveNoTooltip]的部落收养你们，才算公道。"
 hd_wuhu.2004.c: "我送你们去寺观里安身。"
 hd_wuhu.2004.d: "我不知道[upset_vassal.GetFirstNameNoTooltip]指望我做什么。你们另寻去处吧。"
 hd_wuhu.2005.t: "两百骑射手"
 hd_wuhu.2005.desc: "我正为战事发愁，[turkic_leader.GetName]带着几百名骑手来了。\n\n“[ROOT.Char.GetTitleTierName]，”[turkic_leader.GetSheHe]行礼说，“我答应过支持您，我的部落也答应过。既然您现在在打仗，我们可以再给您两百名精熟的骑射手，不过只打这一仗。等事情平息了，他们要回到自己的帐落和家人身边。我们只求您别忘了这份人情。”"
 hd_wuhu.2005.a: "我答应。"
 hd_wuhu.2005.b: "你这套人情话我听够了！"
 hd_wuhu.2005.c: "不用了，多谢，我自己能应付。"
 hd_wuhu.2006.t: "流矢"
 hd_wuhu.2006_beginning: "[one_eyed_child.GetName]照常在[ROOT.Char.Custom('ResidenceBuilding')]里跑来跑去，突然出了事。[turkic_leader.GetName]正带着[turkic_leader.GetHerHis]的战士们练习射箭，一支流矢射中了我那调皮的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('one_eyed_child'))]的眼睛。"
 hd_wuhu.2006_has_court_physician: "“[one_eyed_child.GetSheHe|U]性命无碍，”医者[scoped_physician.GetFirstName]说，“可惜这只眼睛保不住了。恕我直言，以后院子里最好少射些箭。”\n\n"
 hd_wuhu.2006_no_court_physician: "急忙请来的本地医者说[one_eyed_child.GetSheHe]会好起来，但那只眼睛永远看不见了。\n\n"
 hd_wuhu.2006_ending: "“这是意外，”[turkic_leader.GetFirstName]辩解道，“请别急着处罚我，[ROOT.Char.Custom('FormOfAddressForLiege')]。我们不操练，怎么替您守住这片土地？”"
 hd_wuhu.2006.a: "你去牢里慢慢琢磨你的箭术吧。"
 hd_wuhu.2006.b: "从今往后，[ROOT.Char.Custom('ResidenceBuilding')]附近不许射箭。"
 hd_wuhu.2006.c: "这大概是天意吧。"
 hd_wuhu.2007.t: "商路遭劫"
 hd_wuhu.2007.desc: "“[ROOT.Char.GetTitleTierName]，”我的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('warmonger_councillor'))][warmonger_councillor.GetFirstName]说，“[bandits_county.GetName]的商人说遭了马贼劫掠。现在商队都绕着那一带走，生意全给耽误了。请让我去查办这件事。”\n\n“不必，”[turkic_leader.GetName]抢着说，“我可以派我的战士长期护卫商路，只要以后让我们在[bandits_county.GetNameNoTierNoTooltip]放牧。这办法不是更好吗？”\n\n可[warmonger_councillor.GetFirstNameNoTooltip]表示反对：“小心，[ROOT.Char.Custom('FormOfAddressForLiege')]，百姓最恨您放任胡人到处游牧。”"
 hd_wuhu.2007.a: "不过，[turkic_leader.GetFirstNamePossessiveNoTooltip]的办法更好。"
 hd_wuhu.2007.b: "好吧，这件事交给你去办。"
 hd_wuhu.2007.c: "等等再说，商人总会回来的。"

 hd_wuhu.2099.t: "[turkic_leader.GetFirstNamePossessiveNoTooltip]求封"
 hd_wuhu.2099.desc: "[turkic_leader.GetName]和[turkic_leader.GetHerHis]的部众已经替我效力多年。今天[turkic_leader.GetSheHe]郑重地来见我。\n\n“[ROOT.Char.Custom('FormOfAddressForLiege')]，我们的人在您的地界里生了孩子、埋了老人，早把这里当成家了。可我们至今仍是寄人篱下。求您赏我们一块土地，让部众真正安顿下来。”\n\n这一次，[turkic_leader.GetSheHe]显然不会再空手而回。"
 hd_wuhu.2099.a: "[hd_wuhu_grant_county_1.GetNameNoTier]就赏给你了。"
 hd_wuhu.2099.b: "给你[hd_wuhu_grant_county_2.GetNameNoTier]怎么样？"
 hd_wuhu.2099.c: "我只能给你[hd_wuhu_grant_county_3.GetNameNoTier]。"
 hd_wuhu.2099.d: "不行。"
 hd_wuhu.2099.d.tt: "[turkic_leader.GetFirstNameNoTooltip]可能会失望离去，也可能带着部众起兵作乱——取决于[turkic_leader.GetHerHis]的性格和对你的好感"

 ### 第三层：胡帅带兵求地
 hd_wuhu.3001.t: "胡部求附"
 hd_wuhu.3001.desc: "塞外的[hd_wuhu_chief.GetCulture.GetNameNoTooltip]部众来到边上，首领[hd_wuhu_chief.GetName]派人求见。他们想在[hd_wuhu_petition_target.GetNameNoTier]住下来，"
 hd_wuhu.3001.desc_vassal: "做我的臣属，在战事中替我出力，换取在我治下安身。\n\n他们走投无路，这是明摆着的。可正因为无路可走，一旦拒绝，冲突也就在所难免。"
 hd_wuhu.3001.desc_independent: "以邻邦的身份为我出力，换我的一块土地。\n\n他们确实走投无路。但看看他们身后那些剽悍的骑兵，这与其说是请求，不如说是最后通牒。"
 hd_wuhu.3001.a: "只要你听从召唤，[hd_wuhu_petition_target.GetNameNoTierNoTooltip]就归你们。"
 hd_wuhu.3001.b: "休想！我的土地绝不让给你们这些胡虏！"

 HD_WUHU_PETITION_CB_NAME: "胡部求地"
 HD_WUHU_PETITION_WAR_NAME: "[ATTACKER.GetCulture.GetNameNoTooltip]部求地[TITLE.GetNameNoTier]"
 hd_wuhu_petition_cb: "$HD_WUHU_PETITION_CB_NAME$"
 hd_wuhu_petition_cb_victory_desc: "胡部以武力夺取了争夺中的[titles|E]。"
 hd_wuhu_petition_cb_victory_desc_attacker: "你以武力夺取了争夺中的[titles|E]。"
 hd_wuhu_petition_cb_defeat_desc: "胡部被击溃，被迫离开你的土地。"
 hd_wuhu_petition_cb_defeat_desc_attacker: "你被迫另寻他处。"
 hd_wuhu_petition_cb_white_peace_desc: "胡部因其勇武被授予土地，成为你的封臣。"
 hd_wuhu_petition_cb_white_peace_desc_attacker: "你获得了一块可以定居的土地，并成为守方的封臣。"

 hd_wuhu_frontier_army_name: "归附胡骑"
 hd_wuhu_frontier_revolt_army_name: "叛胡"
 hd_wuhu_petition_army_name: "内附胡部"

 ### 史实大单于
 hd_wuhu_chanyu_decision: "起兵自立"
 hd_wuhu_chanyu_decision_desc: "天下大乱，晋室诸王互相攻伐，朝廷再也顾不上边地。我的族人散居塞内已经好几代，受尽了驱使和欺凌。如今正是号召部众、自立门户的时候。"
 hd_wuhu_chanyu_decision_tooltip: "号召部众起兵，建立自己的国家"
 hd_wuhu_chanyu_decision_confirm: "举兵！"
 hd_wuhu_chanyu_decision_year_ok: "已到起兵的年份（史实年份前五年起；随机规则下不限）"
 hd_wuhu_chanyu_decision_phase_ok: "王朝循环处于动荡、新朝征服、斗争、对峙或崩溃阶段"
 hd_wuhu_chanyu_decision_effect_tt: "对目标王国内伯爵领最多的独立统治者开战，并获得大批事件军。胜利后取得该王国并定下国号"

 HD_WUHU_CHANYU_CB_NAME: "起兵自立"
 HD_WUHU_CHANYU_WAR_NAME: "[ATTACKER.GetFirstNameNoTooltip]起兵据[TITLE.GetBaseName]"
 HD_WUHU_CHANYU_WAR_NAME_BASE: ""
