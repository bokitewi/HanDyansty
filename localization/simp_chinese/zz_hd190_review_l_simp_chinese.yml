 hd190.0001.t:0 "张鲁据汉中"
 hd190.0001.desc:0 "初平二年春，五斗米道师君张鲁与张修率众袭击南郑，杀汉中太守苏固。张鲁旋即断绝斜谷阁道，据汉中自守，又西并武都，不再听命于州牧刘焉。\n\n巴、汉之间从此别为一方。张鲁以鬼道教民，不置长吏，以祭酒为治。"
 hd190.0001.a:0 "汉中自此另立门户。"
