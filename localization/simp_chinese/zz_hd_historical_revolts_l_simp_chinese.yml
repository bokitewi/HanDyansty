 hd_revolt_army_heishan:0 "黑山军"
 hd_revolt_army_jiangxia:0 "江夏蛮众"
 hd_revolt_army_wangguo:0 "凉州王国军"
 hd_revolt_army_zhangchun:0 "渔阳叛军"
