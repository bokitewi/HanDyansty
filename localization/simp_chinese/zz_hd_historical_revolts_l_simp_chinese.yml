 hd_historical_revolt_war_victory_desc:0 "[attacker.GetShortUIName|U]据有所争诸郡，自立一方，改行[GetGovernment('celestial_government').GetName]。"
 hd_historical_revolt_white_peace_desc:0 "双方罢兵，疆界如故，叛众各自散去。"
 hd_historical_revolt_defeat_desc:0 "叛乱平定，叛众溃散，疆土无损。"

