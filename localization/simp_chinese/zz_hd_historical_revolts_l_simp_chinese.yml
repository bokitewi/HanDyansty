 # REV-01 184.6 交趾柱天将军
 hd_historical_revolts.0001.t:0 "柱天将军"
 hd_historical_revolts.0001.desc:0 "交趾的急报送到：龙编屯兵已经举事，[hd_revolt_leader.GetName]被推为渠帅，自号柱天将军。报信的人先把沿途能走的道路说了一遍，竟比叛军的兵数还难说清。\n\n你看着舆图上相隔遥远的郡县。岭外山川阻隔，一处屯营生乱，邻近县邑未必立刻知道；等消息送到你这里，又有多少人已随叛旗改换了去向？\n\n堂下有人问这封急报该转交何处。你把它留在了案前。战火既已烧到你的治下，便不能只把“柱天将军”当作一个荒唐名号，笑过便算。"
 # REV-02 184.10 北宫伯玉
 hd_historical_revolts.0002.t:0 "湟中羌胡反"
 hd_historical_revolts.0002.desc:0 "金城方向的军报传来湟中、河关起兵的消息。[hd_revolt_leader.GetName]纠合诸部，凉州的道路与关隘，已不再像旧图上那样安稳。\n\n报信者说到骑兵的踪迹，伸手在图上连划了几处。你按住图角，让他分清哪些是亲眼所见，哪些是沿途传闻。边地每夸大一队骑卒，后方就可能白白撤走一处守军；可若因消息纷乱便迟疑不决，真正杀来的敌兵也不会等你。\n\n从凉州通往三辅的道路，此刻忽然都变得狭窄起来。你重新点出需要查探的地方。这场战事，已经避无可避。"
 # REV-03 185.2 黑山军
 hd_historical_revolts.0003.t:0 "黑山军起"
 hd_historical_revolts.0003.desc:0 "太行山中的部众不再只是零散劫道，已经打起了共同的旗号。[hd_revolt_leader.GetName]聚众起兵，关于黑山军的报讯从各处县署接连送来。\n\n你让书吏把山口与受扰之地标在一处，这才看出那些看似零散的消息，原来沿着山谷一处处连成了一片。平地上的军队容易查探，一旦入了山，几条岔路便足以让踪迹重新散去。\n\n有人仍习惯称他们为小股群盗，你指了指案上越积越厚的急报。名字可以照旧写得轻慢，防备却不能照旧。如今与你交兵的，已是能合起兵势的人了。"
 # REV-04 185.4 江夏蛮（设计性日期后移：史载主要叛乱约180年）
 hd_historical_revolts.0004.t:0 "江夏蛮叛"
 hd_historical_revolts.0004.desc:0 "江夏来报，竟陵附近诸部已聚众出山，[hd_revolt_leader.GetName]所领的人众开始侵扰县邑。急报之外，另有商旅递来改道的消息，水陆行程都比平日迟了。\n\n你询问军吏，哪里可以追击，哪里只宜扼守。他说起林莽与水泽，一处处都不是在舆图上画一道界线便能守住的。对方熟悉道路、进退自如，你们若处处尾随，反倒可能把军众拖散。\n\n案上两份报讯指向同一片地方，字里行间却各有轻重。你将它们并排摆好，先认清这个已向你举兵的敌人。"
 # REV-05 187.4 王国
 hd_historical_revolts.0005.t:0 "王国举兵"
 hd_historical_revolts.0005.desc:0 "汉阳方面传来消息，[hd_revolt_leader.GetName]已经举兵，兵锋直指陈仓。帐中原本在议论别处军务的人，听到这个地名，都停了一停。\n\n你取来关中以西的图籍，沿着道路一路看向凉州。先前那处战场究竟平定了没有，替不了眼前这股兵马作数；陈仓若受威胁，粮运与关隘便都须重新查报。\n\n来人问，是否仍照旧有的部署传令。你没有拿过去的捷报作答，而是让他先把这次敌军的动静说清楚。关门守不守得住，要靠今日守在那里的兵，不能靠昨日留在文书里的名声。"
 # REV-06 187.6 张纯、张举
 hd_historical_revolts.0006.t:0 "张举称天子"
 hd_historical_revolts.0006.desc:0 "肥如方向的急报送到：张举、张纯已与乌桓勾结，举兵作乱。报中一面列着他们新立的天子、将军名号，一面催问边郡该如何应敌。\n\n你把那些夸张的称号读过，目光停在后面的道路与城邑上。称帝的话一日之间便可传遍，真正让州郡不安的，却是随旗而来的骑兵，以及那些原本观望的人会不会就此响应。\n\n门外又有人求见，带来的仍是北方的消息。你吩咐书吏别只顾抄录檄文，务必把各处军情分开记清。对方已经以兵戈相向，你也不能只在名号上与他们争辩。"
 # REV-07 188.3 休屠各胡
 hd_historical_revolts.0007.t:0 "休屠各胡反"
 hd_historical_revolts.0007.desc:0 "美稷一带的动乱终于酿成了战事。休屠各诸部随[hd_revolt_leader.GetName]举兵，并州的急报一起送到，旧日回书里“道路平靖”的话，已不再可信。\n\n你听人逐项禀报诸部的去向，才发觉不能只凭旧有的归属判断谁还肯听令。有的部众仍守原地，有的已随新的号令而动，县署与军中报来的名字也未必对得上。\n\n你把几处含混的地方圈出来，叫来人重新查明。眼下最要紧的，是弄清哪条道路还能走、哪一处确有守军，而不是拿多年前的安置簿册，替今日的边地作保。"
 # REV-08 188.6 马相
 hd_historical_revolts.0008.t:0 "益州黄巾"
 hd_historical_revolts.0008.desc:0 "绵竹方面的急报先说黄巾聚众，后来的文书却已提到称帝。[hd_revolt_leader.GetName]的旗号在蜀中打了出来，县邑与道路的消息一封比一封急。\n\n你把先后两份急报对照着看，中间相隔的时日并不算长，情形却已大变。山川能阻挡外兵，也能让州内的告急来得更迟；等到一处真正失守，邻近的地方未必还有从容准备的余地。\n\n有人劝你先辨明这是否只是旧日黄巾余众换了个名目。你让他先去查兵众的去向。不论他们借哪一面旗号起事，如今都已是向你举兵的敌人。"
 # REV-09 196.1 严白虎
 hd_historical_revolts.0009.t:0 "严白虎屯聚"
 hd_historical_revolts.0009.desc:0 "吴郡各处的来报都提到了[hd_revolt_leader.GetName]。原先分据坞壁的人众正在聚拢，水陆要冲竖起了新的旗帜，过往的商旅也开始打听该向谁交涉。\n\n你看过各县的回信，发现写得最含糊的，恰是那些离城较远的地方。守住县城的城门是一回事，让山水之间的道路仍听同一道号令，又是另一回事。\n\n堂下有人仍把此事称作乡间屯聚，你让他看看已经送到的战报。江东的归属不能只写在县署的匾额上；那个能控扼往来、聚起兵众的人，已经在与你争夺这片土地了。"

 hd_historical_revolts.0010.t:0 "迫于兵威"
 hd_historical_revolts.0010.desc:0 "[hd_beigong_victor.GetName]的使者走进帐来，先把军中号令宣读了一遍，然后才说到你的去处。他要你归附，往后奉其为主，看样子并不打算再听一番长篇推辞。\n\n你低头看着手边的印信。名位还在，可凭它能驱使的人，已不足以将这道命令挡在境外。帐下无人接话，连来回传递文书的脚步也轻了许多。\n\n这不是以厚礼相邀的盟约。你可以不情愿，却无法凭这份不情愿改变已经压到眼前的兵势。如今能做的，是把归附之事谈妥，保住还能继续经营的地方。"
 hd_historical_revolts.0010.a:0 "领受号令，归其节制。"

 hd_historical_revolts.a:0 "传檄诸郡，严加戒备。"
