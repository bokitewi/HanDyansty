 # REV-01 184.6 交趾柱天将军
 hd_historical_revolts.0001.t:0 "柱天将军"
 hd_historical_revolts.0001.desc:0 "六月的交趾湿热难当，龙编的屯兵营中却先燃起了大火。\n\n戍卒们拘执了刺史与合浦太守，推立渠帅，自号“柱天将军”——檄文已经传遍九真、日南，岭外的驿道尽数断绝。\n\n史册甚至没有记下[hd_revolt_leader.GetName]的本名，但此刻他正带着六千屯卒，向交趾的秩序发起挑战。贾琮抚交的故事，要等到朝廷再派新刺史时才会重演；而现在，龙编城头竖起的是叛旗。"
 # REV-02 184.10 北宫伯玉
 hd_historical_revolts.0002.t:0 "湟中羌胡反"
 hd_historical_revolts.0002.desc:0 "湟中、河关的羌胡与北地先零羌并起，共推[hd_revolt_leader.GetName]为将军，匈奴人劫持了金城太守，护羌校尉死于乱军。\n\n金城郡治允吾告急，凉州通往三辅的通道眼看就要被掐断。斥候来报：叛军裹挟羌骑、胡骑数万，正向东推进。\n\n凉州，从来就不是安分的地方。"
 # REV-03 185.2 黑山军
 hd_historical_revolts.0003.t:0 "黑山军起"
 hd_historical_revolts.0003.desc:0 "太行山谷里的群盗终于推举出了自己的盟主。\n\n[hd_revolt_leader.GetName]与张牛角合军攻廮陶，博陵、赵郡处处火起。军中都说这位常山渠帅身轻如燕、骁勇果决，号曰“飞燕”。山谷相连，大小部曲各据险要，常山、赵郡的山道上全是他们的眼线。\n\n朝廷诏书里只写作“黑山贼”——但这支贼，很快就要让整个河北睡不着了。"
 # REV-04 185.4 江夏蛮（设计性日期后移：史载主要叛乱约180年）
 hd_historical_revolts.0004.t:0 "江夏蛮叛"
 hd_historical_revolts.0004.desc:0 "竟陵的群山里，蛮人各部聚集起来了。\n\n[hd_revolt_leader.GetName]驱众出山，攻破县邑。江夏蛮盘踞云梦、依阻山川，官军进讨则散入林莽，官军退去则复出掳掠。\n\n长江中游的漕运，又一次被掐在了蛮人手里。"
 # REV-05 187.4 王国
 hd_historical_revolts.0005.t:0 "王国举兵"
 hd_historical_revolts.0005.desc:0 "汉阳人[hd_revolt_leader.GetName]接过了凉州叛军的大旗。\n\n这一次兵锋直指陈仓——三辅的西大门。若湟中的战事未了，凉州的叛旗便又添一面；若那边已成定局，[hd_revolt_leader.GetName]便独自叩关。\n\n皇甫嵩当年平定凉州的旧事，朝中还有人记得。可如今，还记得的人越来越少了。"
 # REV-06 187.6 张纯、张举
 hd_historical_revolts.0006.t:0 "张举称天子"
 hd_historical_revolts.0006.desc:0 "前中山相张纯与前太山太守张举勾结乌桓大人丘力居，在肥如举兵。\n\n张举自称天子，张纯自号“弥天将军、安定王”，为乌桓诸部元帅。胡骑入塞，幽、冀数州并起烽火，护乌桓校尉、郡守接连被杀。\n\n北疆的秩序，正在从右北平开始崩塌。"
 # REV-07 188.3 休屠各胡
 hd_historical_revolts.0007.t:0 "休屠各胡反"
 hd_historical_revolts.0007.desc:0 "并州的美稷——南单于庭故地——燃起了叛火。\n\n休屠各胡[hd_revolt_leader.GetName]与南匈奴右部合兵十余万，兵锋直指单于庭。西河、上郡的道路俱断，并州胡汉震动。\n\n百年以来安置在边郡的胡部落，此刻成了插在帝国腹心的刀。"
 # REV-08 188.6 马相
 hd_historical_revolts.0008.t:0 "益州黄巾"
 hd_historical_revolts.0008.desc:0 "绵竹人[hd_revolt_leader.GetName]自称黄巾，旬月之间众至万余。\n\n叛军杀绵竹令，破雒城，益州刺史死于乱军。[hd_revolt_leader.GetName]乘胜自称天子，蜀郡、犍为望风而动。\n\n天府之国闭门自守的日子，到头了。"
 # REV-09 196.1 严白虎
 hd_historical_revolts.0009.t:0 "严白虎屯聚"
 hd_historical_revolts.0009.desc:0 "吴人严白虎，众各万余，处处屯聚。\n\n[hd_revolt_leader.GetName]与其党各据坞壁，扼守吴郡的水陆要冲。江东的汉家官署早已号令不出郡城，豪帅、宗部、寇帅各自为政。\n\n会稽与吴郡之间，新的秩序正在由刀剑书写。"

 hd_historical_revolts.a:0 "乱世群雄，各怀异志。"
