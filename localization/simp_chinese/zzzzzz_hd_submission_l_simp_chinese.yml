 hd_warlord_offer_vassalization_interaction:0 "劝其归附"
 hd_warlord_offer_vassalization_interaction_desc:0 "劝说相邻的独立诸侯奉你为主，保留其现有头衔和下属封臣。接受意愿取决于法理、性格、关系、好感、实力及兼并势头。"
 hd_sub_request_notification:0 "天下纷乱，独守一隅未必长久。愿与君定下君臣之分：君保有现有领地与属臣，我则承担庇护之责。君意如何？"
 hd_sub_accept_summary_tt:0 "接受后，受邀者将连同现有领地和下属封臣一并归附，不会将其头衔直接夺给发起者。发起者获得50威望；已有兼并势头的有效期刷新，但层数不增加。AI受邀者获得5年派系冷却。回复时仍须满足合法归附条件。"
 hd_sub_decline_summary_tt:0 "拒绝不会失去领地，也不会自动开战。同一发起者在2年内不能再次使用本互动邀请你。"
 hd_sub_no_personality_veto_tt:0 "AI不会归附仇敌或宿敌；狂热的AI不会归附异信仰或异文化传承者。玩家不受此性格否决限制。"
 hd_sub_no_outgoing_request_tt:0 "发起者没有另一份等待回复的归附请求。"
 hd_sub_inbox_free_tt:0 "受邀者没有待回复的归附请求，未处于针对本人的拒绝冷却，且玩家年度收件冷却已结束。"
