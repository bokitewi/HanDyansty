l_simp_chinese:
 building_type_jiaodong_golden_mines_01: "胶东金矿"
 building_type_jiaodong_golden_mines_01_desc: "东莱、胶东一带丘陵起伏，溪涧沙中常可淘得金屑。乡人结伴入山，凿石淘沙，所得虽不过点滴，积少成多，亦颇可观。"
 building_type_Xinglong_golden_mines_01: "河北兴隆金矿"
 building_type_Xinglong_golden_mines_01_desc: "渔阳以北的燕山深处，山谷中藏有金脉。矿工凿石取砂，在溪边反复淘洗，偶尔也能得到成块的金子。"
 building_type_lishui_golden_mines_01: "丽水金矿"
 building_type_lishui_golden_mines_01_desc: "荆南丽水之中产金，砂里淘洗，金粒可见。韩非子曾说，此地之人多私采金砂，官府禁之虽严，犯禁者仍不绝于途。"
 building_type_yaan_golden_mines_01: "雅安荣经金矿"
 building_type_yaan_golden_mines_01_desc: "蜀郡严道县的群山之中，溪流湍急，沙里藏有金屑。孝文皇帝曾将严道铜山赐给邓通铸钱，可见此地矿藏之丰，向来为蜀人所重。"

 building_type_jiaodong_crystal_mines_01: "水晶玛瑙玉矿"
 building_type_jiaodong_crystal_mines_01_desc: "此地山中出产水精、玛瑙与美玉，色泽晶莹，匠人琢为杯盏、带钩与佩饰，贵人争相购求。"
