 building_type_xibeiyanchi_salt_mines_01: "盐池"
 building_type_xibeiyanchi_salt_mines_01_desc: "西北边地多有盐池，池水干涸之处凝结成盐，称为戎盐，可供食用，也可入药。"
 building_type_bashu_salt_mines_01: "巴蜀盐井"
 building_type_bashu_salt_mines_01_desc: "巴蜀山中多有咸泉，乡人凿井汲卤，煎煮成盐。相传秦时蜀守李冰曾在广都开凿盐井，此后井盐之利遍及蜀中。"
 building_type_liaodong_salt_mines_01: "辽东盐场"
 building_type_liaodong_salt_mines_01_desc: "辽东海岸礁石嶙峋，可供煮盐的滩地狭小，所出海盐不多，却以洁白细腻见称。"
 building_type_jiaodong_salt_mines_01: "胶东盐场"
 building_type_jiaodong_salt_mines_01_desc: "胶东海湾多为岩岸，盐场狭小，所产不多，但也足以供给近海的乡里。"
 building_type_lubei_salt_mines_01: "鲁北盐区"
 building_type_lubei_salt_mines_01_desc: "齐国北面的海滨，地下卤水比海水更咸，煮之成盐。自管仲兴鱼盐之利，齐地便以此富甲天下。"
 building_type_wuyue_salt_mines_01: "吴越海盐区"
 building_type_wuyue_salt_mines_01_desc: "吴越滨海之地煮海为盐，产量极丰。高祖时吴王刘濞煮海为盐、即山铸钱，国用富饶，太史公称吴地“东有海盐之饶”。"

