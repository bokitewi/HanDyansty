 building_type_linzi_iron_mines_01: "小型铁矿"
 building_type_linzi_iron_mines_01_desc: "齐地自管仲以来便以盐铁之利富甲诸侯。临淄近郊有一处小小的铁矿，矿脉不深，所出不多，却也足以供给乡里的农具。"
 building_type_xuzhou_iron_mines_01: "大型铁矿区"
 building_type_xuzhou_iron_mines_01_desc: "彭城一带山中铁矿丰厚，朝廷在此设有铁官，役使工徒采石冶铁。年深日久，矿坑与冶炉连绵成片，四周聚起了大批以冶铸为业的人家。"
