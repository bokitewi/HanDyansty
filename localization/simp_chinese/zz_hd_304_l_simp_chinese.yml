l_simp_chinese:
 # 304 年剧本「左国称王」。计划见 docs/304刘渊剧本_计划.md。
 bm_hd_304: "左国称王"
 bm_hd_304_desc: "建武元年，八王相攻已近四年。成都王颖兵败邺城，挟惠帝奔洛阳，又为河间王颙的部将张方所制；东海王越退保东海，幽州王浚引鲜卑、乌桓南下，并州司马腾也与胡骑结援。天子困守洛阳，号令不出宫门。\n\n这年十月，匈奴左贤王刘渊回到左国城，五部之众推他为大单于。他筑坛南郊，自称汉王，追尊蜀后主，以兴复汉室为号。同月，李雄在成都称成都王。\n\n#bold 晋室分崩，五胡之乱自此始。#!"

 bm_hd_304_liu_yuan: "刘渊"
 bm_hd_304_liu_yuan_subheading: "汉王、大单于"
 bm_hd_304_liu_yuan_desc: "刘渊字元海，南匈奴单于之后，少年时在洛阳为质，通读经史，晋朝公卿多与他交往。成都王颖放他回并州，他却在左国城自立为汉王。手中只有西河一隅和五部胡骑，司马腾的大军已经北上。"

 bm_hd_304_si_ma_teng: "司马腾"
 bm_hd_304_si_ma_teng_subheading: "东嬴公、并州刺史"
 bm_hd_304_si_ma_teng_desc: "东海王越之弟，镇晋阳。并州连年饥荒，刘渊又在西河起兵，部将聂玄已经出兵大陵。北边的拓跋猗㐌愿意出兵相助，但能否守住并州，全看这一仗。"

 bm_hd_304_si_ma_yong: "司马颙"
 bm_hd_304_si_ma_yong_subheading: "河间王，都督关中"
 bm_hd_304_si_ma_yong_desc: "坐镇长安，部将张方带兵驻在洛阳，天子实际握在他手里。成都王颖新败、东海王越远在东海，眼下关中最强，但诸王都在等他犯错。"

 bm_hd_304_si_ma_ying: "司马颖"
 bm_hd_304_si_ma_ying_subheading: "成都王、皇太弟"
 bm_hd_304_si_ma_ying_desc: "荡阴一战俘获天子，名位已到皇太弟。不过八月邺城被王浚攻破，他带着天子逃到洛阳，又落到张方手中。河北旧部仍念他，能不能东山再起，要看还有多少人肯为他起兵。"

 bm_hd_304_si_ma_yue: "司马越"
 bm_hd_304_si_ma_yue_subheading: "东海王"
 bm_hd_304_si_ma_yue_desc: "七月挟天子北征邺城，在荡阴大败，单骑逃回东海国。两个弟弟分镇并州、青州，幽州王浚也站在他一边。只要重整兵马，下一个入洛辅政的未必不是他。"

 bm_hd_304_wang_jun: "王浚"
 bm_hd_304_wang_jun_subheading: "都督幽州诸军事"
 bm_hd_304_wang_jun_desc: "太原王氏子弟，以女儿嫁给段部鲜卑首领务勿尘，手下有鲜卑、乌桓骑兵。八月他攻破邺城，大掠而还，河北再没有能挡他的人。"

 bm_hd_304_li_xiong: "李雄"
 bm_hd_304_li_xiong_subheading: "成都王"
 bm_hd_304_li_xiong_desc: "巴氐流民首领李特之子。父亲和叔父相继战死后，他接统流民，攻下成都，赶走益州刺史罗尚，十月自称成都王。罗尚还守着巴郡，蜀地还没有平定。"

 bm_hd_304_zhang_gui: "张轨"
 bm_hd_304_zhang_gui_subheading: "凉州刺史"
 bm_hd_304_zhang_gui_desc: "安定张氏，出镇姑臧已有三年，兴学校、平鲜卑，凉州一方安定。中原诸王打成一团，河西反倒成了士民避难的地方。"

 bm_hd_304_shi_le: "石勒"
 bm_hd_304_shi_le_subheading: "羯人，被卖为奴"
 bm_hd_304_shi_le_desc: "上党武乡羯人。并州饥荒，司马腾捉胡人卖到山东换军粮，石勒也被卖到茌平为奴。他和牧帅汲桑相识，身边聚了十几个骑马的伙伴，正等着天下大乱。"

 bm_hd_304_liu_kun: "刘琨"
 bm_hd_304_liu_kun_subheading: "范阳王幕僚"
 bm_hd_304_liu_kun_desc: "中山刘琨，字越石，少年时与祖逖同被而眠、闻鸡起舞，名列金谷二十四友。此时在范阳王司马虓幕下。并州一旦失守，朝中能去收拾残局的人不多。"

 d_hd_304_shile_camp: "石勒部众"
 d_hd_304_shile_camp_adj: "石勒"
 d_hd_304_liukun_camp: "刘琨部曲"
 d_hd_304_liukun_camp_adj: "刘琨"


 hd_304_wubu_army_name: "五部匈奴"
 hd_304_shile_army_name: "石勒所部"
 hd_304_yongjia_army_name: "汉军"
 hd_304_mandate_lock_tt: "八王之乱方炽，诸王名为朝贡，实各拥兵自重，天子号令不出洛阳（永嘉之乱以后才可终结乱世）"

 SG_nianhao_yuanxi: "元熙"
 SG_nianhao_yuanxi_tt: "寓意『开创光明』#weak (汉赵刘渊年号)#!"

 hd_304.0110.t: "出镇建邺"
 hd_304.0110.desc: "东海王越上表，请以琅邪王睿为安东将军、都督扬州诸军事，出镇建邺。他的谋士王导说，江东殷实，北方一旦有变，这里可以存一线根本。"
 hd_304.0110.a: "准奏，琅邪王即日南下。"
 hd_304.0110.b: "宗室出镇已经太多，不准。"

 hd_304.0120.t: "往依刘渊"
 hd_304.0120.desc: "汲桑兵败，同伙四散。听说刘渊在河东招纳豪杰，你和张背督商量，不如投奔过去，借汉国的兵马打天下。"
 hd_304.0120.a: "投奔汉王。"
 hd_304.0120.b: "自己闯，不寄人篱下。"

 hd_304.0121.t: "胡将来投"
 hd_304.0121.desc: "羯人石勒带着部众前来投奔，说愿意替汉国攻取河北。这个人勇悍多谋，收下他，冀州可以不战而得；可他不是匈奴，以后未必肯听调遣。"
 hd_304.0121.a: "收下他，封辅汉将军。"
 hd_304.0121.b: "不收。"

 hd_304.0130.t: "即皇帝位"
 hd_304.0130.desc: "汉王即位已经四年，河东、平阳相继归附，群臣联名劝进。太史令说，平阳有紫气，可以在那里立都。"
 hd_304.0130.a: "即皇帝位，改元永凤。"
 hd_304.0130.b: "时机未到，仍称汉王。"

 hd_304.0140.t: "围攻洛阳"
 hd_304.0140.desc: "晋室诸王连年相攻，关东兵力耗尽，洛阳城中缺粮，天子几次想出城避难都走不脱。\n\n诸将都说，现在就是攻下洛阳的时候。"
 hd_304.0140.a: "遣刘曜、王弥、石勒合围洛阳。"
 hd_304.0140.b: "再等等。"
