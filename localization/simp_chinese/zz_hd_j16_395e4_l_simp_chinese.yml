l_simp_chinese:
 hd_j16.5800.t:0 "中山称尊"
 hd_j16.5800.desc:0 "燕国旧臣陆续从四方来投，中山城里冠盖相望。群臣联名上表，说秦主已死，天命归燕，请您正位称尊，以安河北人心。"
 hd_j16.5800.a:0 "即皇帝位，改元建兴。"
 hd_j16.5800.b:0 "且称燕王，大位徐图。"
 hd_j16.5810.t:0 "西燕易主"
 hd_j16.5810.desc:0 "慕容冲死后，关中鲜卑接连拥立又接连相杀，半年里换了好几位主人。最后众人推[hd_news_a.GetName]为主。他率四十余万鲜卑男女离开长安东归，打算在河东、上党一带立足。"
 hd_j16.5810.desc_player:0 "慕容冲死后，关中鲜卑人心浮动，几度有人谋立新主，都被[hd_news_a.GetName]压了下去。四十余万鲜卑男女日夜思归东土，河东、上党一带成了众人眼中的去处。"
 hd_j16.5820.t:0 "窟咄来争"
 hd_j16.5820.desc:0 "叔父拓跋窟咄借独孤部刘显的兵马南下，国中不少部落暗中响应，连帐下近臣也有人动摇。北边的贺兰部靠不住，能请来援兵的只有中山的燕国。"
 hd_j16.5820.a:0 "遣使中山，请燕发兵。"
 hd_j16.5820.b:0 "不假外援，自定内乱。"
 hd_j16.5840.t:0 "进讨西燕"
 hd_j16.5840.desc:0 "[hd_j16_e4b_xy.GetName]收拾关中东归的鲜卑余众，自立门户，与中山并立，天下就有了两个燕。河北已经安定，正可以腾出手来西讨，把慕容氏的旧地收归一家。"
 hd_j16.5840.a:0 "分道出兵，进讨西燕。"
 hd_j16.5840.b:0 "暂缓西讨，再观时变。"
 hd_j16.5841.t:0 "燕军压境"
 hd_j16.5841.desc:0 "探马急报，[hd_j16_e4b_yan.GetName]的燕军分几路西来，太行诸陉都有兵马出没，矛头直指我境。"
 hd_j16.5841.a:0 "据险固守。"
 hd_j16.5850.t:0 "牛川即位"
 hd_j16.5850.desc:0 "诸部大人在牛川会盟，推您为代王。如今部众日盛，长史张衮等人建议改称魏王，表明不只是旧代国的部落之长。"
 hd_j16.5850.a:0 "改称魏王。"
 hd_j16.5850.b:0 "仍称代王。"
 hd_j16.5860.t:0 "西讨铁弗"
 hd_j16.5860.desc:0 "刘卫辰派儿子刘直力鞮来犯，被我军击退。铁弗部就盘踞在黄河西边，自先代以来反复无常。趁他新败，正好渡河一举除掉这个祸患。"
 hd_j16.5860.a:0 "自五原渡河，直捣悦跋城。"
 hd_j16.5860.b:0 "暂且按兵，以待后图。"
 hd_j16.5861.t:0 "魏军渡河"
 hd_j16.5861.desc:0 "魏军从五原渡河西来，前锋已经离营帐不远。部众惊慌，有人已在暗中打算另投别家。"
 hd_j16.5861.a:0 "收拾部众迎敌。"
 hd_j16.5870.t:0 "长安称尊"
 hd_j16.5870.desc:0 "秦国旧都已归我手，诸将请您仿照前秦旧制即皇帝位，号令关中。尹纬等人也说，名号定下来，人心才能安定。"
 hd_j16.5870.a:0 "即皇帝位于长安，改元建初。"
 hd_j16.5870.b:0 "暂称秦王。"
 hd_j16.5880.t:0 "决战废桥"
 hd_j16.5880.desc:0 "[hd_j16_e4b_fd.GetName]带着前秦余部屡次来争，军中载着苻坚的神主，号称必死。斥候报告对方已经倾众东出，粮草不多。我军若先据废桥扼住水源，可以坐待其自乱。"
 hd_j16.5880.a:0 "据废桥以逸待劳。"
 hd_j16.5880.b:0 "暂且休兵，再观时变。"
 hd_j16.5881.t:0 "姚军来攻"
 hd_j16.5881.desc:0 "[hd_j16_e4b_hq.GetName]的大军抢先占了废桥，扼住了我军饮水的去路。军中缺水缺粮，将士们开始动摇。"
 hd_j16.5881.a:0 "整军死战。"
 hd_j16.5890.t:0 "群下推戴"
 hd_j16.5890.desc:0 "乞伏国仁去世，儿子年幼，部众担心无人统率。各部大人一同来请您继位，主持苑川的大局。"
 hd_j16.5890.desc_ruler:0 "乞伏国仁去世，您已承接他的部众。各部大人一同来请您正名号，称河南王，以安苑川人心。"
 hd_j16.5890.a:0 "受推戴，嗣位称河南王。"
 hd_j16.5890.b:0 "辞让，奉国仁之后。"
 hd_j16.5890.c:0 "名号可以缓议，暂不称王。"
 hd_j16.5892.t:0 "三河称王"
 hd_j16.5892.desc:0 "西域班师以后，您已坐稳姑臧，河西各郡都来归附。僚佐请您自立名号，以统领三河之地。"
 hd_j16.5892.a:0 "自称三河王，改元麟嘉。"
 hd_j16.5892.b:0 "仍以凉州牧自居。"
 hd_j16.5894.t:0 "更称秦王"
 hd_j16.5894.desc:0 "陇右诸部多已归附，苑川的势力一年比一年强。群臣请您改称秦王，承接秦的名号。"
 hd_j16.5894.a:0 "更称秦王。"
 hd_j16.5894.b:0 "仍称河南王。"
 hd_j16_yanwei_peace_modifier:0 "燕魏通好"
 hd_j16_yanwei_peace_modifier_desc:0 "燕、魏结为与国，约定不相侵犯。"
 hd_j16_xiyan_dongjin_modifier:0 "西燕东进"
 hd_j16_xiyan_dongjin_modifier_desc:0 "鲜卑部众离开关中东归，急需一块立足之地。"
 hd_j16_yanwei_peace_opinion:0 "燕魏通好"
 hd_j16_helan_support_opinion:0 "牛川推戴"
 hd_j16_e4b_army_xiyan_name:0 "燕军西讨"
 hd_j16_e4b_army_tiefu_name:0 "魏军西征"
 hd_j16_e4b_army_feiqiao_name:0 "姚军"
