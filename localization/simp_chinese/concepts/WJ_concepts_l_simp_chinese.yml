l_simp_chinese:
# 汉晋风华：按类型整合；键名与现行文本保留。来源逐键见本批manifest。

 # 来源：localization/simp_chinese/WJ_contract_privileges_l_simp_chinese.yml
 game_concept_wj_kaifu:0 "开府"
 game_concept_wj_zhoumu:0 "擢任州牧"
 game_concept_wj_zhoumu_desc:0 "$WJ_zhoumu_grant_desc$"
 game_concept_wj_huangyue:0 "假黄钺"
 game_concept_wj_huangyue_desc:0 "$WJ_huangyue_grant_desc$"
 game_concept_wj_kaifu_desc:0 "开府由朝廷以契约特授，得以自置僚属、辟召掾史。大将军、太傅、丞相、司徒、司空、太尉在任即得开府，其他重臣须另行授予。"
 game_concept_wj_maojie:0 "旄节"
 game_concept_wj_maojie_desc:0 "旄节分假节、持节、使持节三等，一人只持其一。天子于军事窗口“都督区”页建区授节，任内可以改授，却不能收归虚无；核心实职正常继任时，新任承其节，前任即罢。持节者号令及于本区所有合资格的官员，不限直属；若举兵反叛朝廷，便不得再假朝廷之命号令忠臣。军法以“颁行都督军令”施行，开府与否另行判定。"

 # 来源：localization/simp_chinese/WJ_merit_flavor_loc_l_simp_chinese.yml
 game_concept_wj_chushi:0 "处士"
 game_concept_wj_chushi_desc:0 "尚无官职、又非无地士族之人，称[wj_chushi|E]，居于朝野之间。具备入仕资格，并不等于已有[wj_luyi|E]。"
 game_concept_wj_guanyuan:0 "官员"
 game_concept_wj_guanyuan_desc:0 "[wj_guanyuan|E]是[wj_junguozhi|E]下奉命治理地方的[liege|E]封臣。官员由领主任命，利用[governor_efficiency|E]管理[realm|E]内的土地；文武之分，以所领省区的契约为准。\n\n官员的[title|E]及其下辖[counties|E]组成[province|E]，辖区内的[governance_issues|E]由任职官员处置。\n\n官员可以积累[influence|E]，影响其他官职的[succession|E]。\n\n#F 居其位而任其事，奉诏守土，按期考课。#!"
 game_concept_wj_junguozhi:0 "郡国制"
 game_concept_wj_junguozhi_desc:0 "[GetGovernment('celestial_government').GetRuleInfo][GetGovernment('celestial_government').GetFlagInfo]\n[wj_junguozhi|E]是汉晋的[government_bureaucratic_type|E][government_form|E]。天子统摄朝廷，[liege|E]任命[wj_guanyuan|E]治理地方，依所授契约分州郡、军戍与司隶。\n\n角色使用[influence|E]、[noble_families|E]、[family_estates|E]与[treasury|E]。独立[rulers|E]拥有[legitimacy|E]，臣属以[merit|E]进阶仕途。\n\n士人入仕，循辟召、举孝廉、举茂才、清谈与考课诸途，不设科举。地方[title_men_at_arms|E]依爵级授予，县级头衔不领头衔兵。\n\n#F 郡国并行而权归天子。中央公卿辅政，地方州郡奉诏治民。#!"
 game_concept_wj_luyi:0 "禄秩"
 game_concept_wj_luyi_desc:0 "[wj_luyi|E]以官定秩，禄随官迁，表示角色所任官职对应的俸禄等级。\n\n男爵级官职为[wj_luzhi_liubaishi|E]，伯爵级为[wj_luzhi_qianerbai|E]，公国级为[wj_luzhi_bierqian|E]，王国级为[wj_luzhi_zhongerqian|E]，帝国级及以上为[wj_luzhi_wanshi|E]。\n\n尚无官职者称[wj_chushi|E]或[wj_shizu|E]；未经正式入仕之途而先任官者暂为[wj_shishou|E]，期满后须受能力考课。"
 game_concept_wj_luyi_i:0 "@merit_icon!"
 game_concept_wj_luzhi_bierqian:0 "比二千石"
 game_concept_wj_luzhi_bierqian_desc:0 "[wj_luzhi_bierqian|E]为公国级官职之秩。"
 game_concept_wj_luzhi_liubaishi:0 "六百石"
 game_concept_wj_luzhi_liubaishi_desc:0 "[wj_luzhi_liubaishi|E]为男爵级官职之秩。"
 game_concept_wj_luzhi_qianerbai:0 "千二百石"
 game_concept_wj_luzhi_qianerbai_desc:0 "[wj_luzhi_qianerbai|E]为伯爵级官职之秩。"
 game_concept_wj_luzhi_wanshi:0 "万石"
 game_concept_wj_luzhi_wanshi_desc:0 "[wj_luzhi_wanshi|E]为帝国级及以上官职之秩。"
 game_concept_wj_luzhi_zhongerqian:0 "中二千石"
 game_concept_wj_luzhi_zhongerqian_desc:0 "[wj_luzhi_zhongerqian|E]为王国级官职之秩。"
 game_concept_wj_mingwang:0 "贤望"
 game_concept_wj_mingwang_desc:0 "贤望源于士人的德行、声誉与功业。清谈使才学为人所知，荐举使名声传于朝野，任职与考课则检验治事之能。\n\n[merit|E]越高，越易为朝廷与士林推重，所能承任的官职也越重；声誉虽盛，仍须经正式任命方能掌职。"
 game_concept_wj_mingwang_i:0 "@merit_icon!"
 game_concept_wj_ruzhi:0 "入仕之途"
 game_concept_wj_ruzhi_desc:0 "汉晋入仕之途有三：\n\n辟召——入举主幕府，受其提携出仕。\n\n举孝廉——公国级官员察举尚无官身之人入郎官署，经考校合格后取得孝廉出身。\n\n举茂才——王国级以上官员察举才士；现任官员、孝廉与辟召出身者亦可受举，取得更高的入仕资格。\n\n没有正式入仕途径而先任官者暂行试守，期满接受能力考课：男爵、伯爵级官职合格者授孝廉，公国级及以上官职合格者授茂才。"
 game_concept_wj_ruzhi_i:0 "@merit_icon!"
 game_concept_wj_shishou:0 "试守"
 game_concept_wj_shishou_desc:0 "没有正式入仕途径而先任实职者暂行[wj_shishou|E]。试守期间承担假吏惩罚，期满须通过能力考课，方可取得正式入仕资格。"
 game_concept_wj_shizu:0 "士族"
 game_concept_wj_shizu_desc:0 "持有无地士族家族头衔而未任官者，称[wj_shizu|E]。已具正式入仕资格者任官之后，按所任官职定其[wj_luyi|E]；未具资格而先任官者，仍以[wj_shishou|E]候考。"
 game_concept_wj_xianwang_level_chao:0 "海内称誉"
 game_concept_wj_xianwang_level_chao_desc:0 "名著海内，为朝野所重。其德望与治绩皆有凭据，可列公卿之选，承掌朝廷重务。"
 game_concept_wj_xianwang_level_gong:0 "天下所宗"
 game_concept_wj_xianwang_level_gong_desc:0 "天下所宗，望重士林。德行、功业与声誉卓然，足为公辅之选；受任之后，方可执掌相应职事。"
 game_concept_wj_xianwang_level_jun:0 "郡中闻达"
 game_concept_wj_xianwang_level_jun_desc:0 "声闻郡中，治事有称。郡中贤士与官员渐知其才，可荐膺一郡之任。"
 game_concept_wj_xianwang_level_xian:0 "乡里称善"
 game_concept_wj_xianwang_level_xian_desc:0 "才行初著，乡里称誉。士人已获一方信重，可为县务之选；能否受任，仍须奉朝廷之命。"
 game_concept_wj_xianwang_level_zhou:0 "士林所称"
 game_concept_wj_xianwang_level_zhou_desc:0 "士林推重，誉满州境。才学与功业已为一州所知，足以列于地方重任之选。"

 # 来源：localization/simp_chinese/WJ_office_roads_loc_l_simp_chinese.yml
 game_concept_WJ_maocai:0 "举茂才"
 game_concept_WJ_maocai_desc:0 "王国级以上官员可以察举同一天朝的才士为茂才。现任官员、孝廉及辟召出身者都可再举茂才，已是茂才者不得重复受举。受举者即得正式入仕资格，禄秩仍由所任官职而定；举主还可借察举之机收其为门生。"
