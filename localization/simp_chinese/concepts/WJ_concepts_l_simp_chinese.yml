l_simp_chinese:
# 汉晋风华：按类型整合；键名与现行文本保留。来源逐键见本批manifest。

 # 来源：localization/simp_chinese/WJ_contract_privileges_l_simp_chinese.yml
 game_concept_wj_kaifu:0 "开府"
 game_concept_wj_kaifu_desc:0 "开府通过契约授予。大将军、太傅、丞相、司徒、司空、太尉在任自动开府，其他合资格官员可另授；辟召以真实开府契约为准，不再使用开府修饰符。"
 game_concept_wj_maojie:0 "旄节"
 game_concept_wj_maojie_desc:0 "旄节分假节、持节、使持节，三者互斥。皇帝在军事窗口“都督区”页建区并初授，任内可改授但不可撤为空；核心实职正常继任时沿职继节，前任清节。职权覆盖本区合资格官员而不限直属；反叛朝廷时不得凭朝廷授权对忠臣行令。军法通过“颁行都督军令”办理，跨区调兵另待都督中外机制。开府独立判定。"

 # 来源：localization/simp_chinese/WJ_merit_flavor_loc_l_simp_chinese.yml
 game_concept_wj_chushi:0 "处士"
 game_concept_wj_chushi_desc:0 "尚无实际官职、又不属于无地士族者，以[wj_chushi|E]身份居于朝野之间。入仕资格本身不等同于实际[wj_luyi|E]。"
 game_concept_wj_guanyuan:0 "官员"
 game_concept_wj_guanyuan_desc:0 "[wj_guanyuan|E]是[wj_junguozhi|E]下奉命治理地方的[liege|E]封臣。官员由领主任命，利用[governor_efficiency|E]管理[realm|E]内的土地；文武职责以实际省区契约区分，不因领主或自身的称谓一概而定。\n\n官员的[title|E]及其下辖[counties|E]组成[province|E]，辖区内的[governance_issues|E]由任职官员处置。\n\n官员可以积累[influence|E]，影响其他官职的[succession|E]。\n\n#F 居其位而任其事，奉诏守土，按期考课。#!"
 game_concept_wj_junguozhi:0 "郡国制"
 game_concept_wj_junguozhi_desc:0 "[GetGovernment('celestial_government').GetRuleInfo][GetGovernment('celestial_government').GetFlagInfo]\n[wj_junguozhi|E]是汉晋法律下的[government_bureaucratic_type|E][government_form|E]。天子统摄朝廷，[liege|E]可以任命[wj_guanyuan|E]治理地方，依实际省区契约区分[civilian_governor_short|E]与[military_governor_short|E]。\n\n角色可以使用[influence|E]、[noble_families|E]、[family_estates|E]与[treasury|E]。独立[rulers|E]拥有[legitimacy|E]，臣属则以[wj_mingwang|E]进阶仕途。\n\n地方[title_men_at_arms|E]的最低头衔等级为公爵；伯爵可以担任武官、使用军事契约，但县级头衔不承载头衔兵。\n\n#F 郡国并行而权归天子。中央公卿辅政，地方州郡奉诏治民；此为制度称谓与叙述，不另设政体或改写契约、任命与继承规则。#!"
 game_concept_wj_luyi:0 "禄秩"
 game_concept_wj_luyi_desc:0 "[wj_luyi|E]以官定秩，禄随官迁，表示角色当前实际官职所对应的俸禄等级。\n\n男爵级官职为[wj_luzhi_liubaishi|E]，伯爵级为[wj_luzhi_qianerbai|E]，公国级为[wj_luzhi_bierqian|E]，王国级为[wj_luzhi_zhongerqian|E]，帝国级及以上为[wj_luzhi_wanshi|E]。\n\n尚无实际官职者显示为[wj_chushi|E]或[wj_shizu|E]；没有正式入仕途径而先任官者暂为[wj_shishou|E]，期满后须接受能力考课。"
 game_concept_wj_luyi_i:0 "@merit_icon!"
 game_concept_wj_luzhi_bierqian:0 "比二千石"
 game_concept_wj_luzhi_bierqian_desc:0 "[wj_luzhi_bierqian|E]对应公国级实际官职。"
 game_concept_wj_luzhi_liubaishi:0 "六百石"
 game_concept_wj_luzhi_liubaishi_desc:0 "[wj_luzhi_liubaishi|E]对应男爵级实际官职。"
 game_concept_wj_luzhi_qianerbai:0 "千二百石"
 game_concept_wj_luzhi_qianerbai_desc:0 "[wj_luzhi_qianerbai|E]对应伯爵级实际官职。"
 game_concept_wj_luzhi_wanshi:0 "万石"
 game_concept_wj_luzhi_wanshi_desc:0 "[wj_luzhi_wanshi|E]对应帝国级及以上实际官职。"
 game_concept_wj_luzhi_zhongerqian:0 "中二千石"
 game_concept_wj_luzhi_zhongerqian_desc:0 "[wj_luzhi_zhongerqian|E]对应王国级实际官职。"
 game_concept_wj_mingwang:0 "贤望"
 game_concept_wj_mingwang_desc:0 "[wj_mingwang|E]沿用原版九级数值与等级引擎作为底层机制，只在汉晋法律的独立界面中显示为士人的德行、声誉与功业。角色仍通过原版允许的官职、活动、关系与事件效果积累数值，并受原版等级上限、任命资格、候选分数和俸禄效果约束。"
 game_concept_wj_mingwang_i:0 "@merit_icon!"
 game_concept_wj_ruzhi:0 "入仕之途"
 game_concept_wj_ruzhi_desc:0 "汉晋入仕之途有三：\n\n辟召——入举主幕府，受其提携出仕。\n\n举孝廉——公国级官员察举尚无官身之人入郎官署，经考校合格后取得孝廉出身。\n\n举茂才——王国级以上官员察举才士；现任官员、孝廉与辟召出身者亦可受举，取得更高的入仕资格。\n\n没有正式入仕途径而先任官者暂行试守，期满接受能力考课：男爵、伯爵级官职合格者授孝廉，公国级及以上官职合格者授茂才。"
 game_concept_wj_ruzhi_i:0 "@merit_icon!"
 game_concept_wj_shishou:0 "试守"
 game_concept_wj_shishou_desc:0 "没有正式入仕途径而先任实职者暂行[wj_shishou|E]。试守期间承担假吏惩罚，期满须通过能力考课，方可取得正式入仕资格。"
 game_concept_wj_shizu:0 "士族"
 game_concept_wj_shizu_desc:0 "持有无地士族家族头衔而没有实际官职者显示为[wj_shizu|E]。已具正式入仕资格者取得官职后按实际[wj_luyi|E]显示；没有正式入仕资格而先任官者仍须以[wj_shishou|E]候考。"
 game_concept_wj_xianwang_level_chao:0 "海内称誉"
 game_concept_wj_xianwang_level_chao_desc:0 "[wj_xianwang_level_chao|E]为卿等贤望，涵盖贤望进程的第七、第八级。人物声誉已达海内，可向[wj_luzhi_wanshi|E]官职进阶，并列入省部任命之选；具体效果与任官资格仍按实际贤望等第结算。"
 game_concept_wj_xianwang_level_gong:0 "天下所宗"
 game_concept_wj_xianwang_level_gong_desc:0 "[wj_xianwang_level_gong|E]为公等贤望，对应贤望进程的最高一级。人物为天下士林所宗，获得三公资格，并可承任[wj_luzhi_wanshi|E]官职；具体效果与任官资格仍按实际贤望等第结算。"
 game_concept_wj_xianwang_level_jun:0 "郡中闻达"
 game_concept_wj_xianwang_level_jun_desc:0 "[wj_xianwang_level_jun|E]为郡等贤望，涵盖贤望进程的第三、第四级。人物声名已闻于郡中，可向[wj_luzhi_bierqian|E]官职进阶；具体效果与任官资格仍按实际贤望等第结算。"
 game_concept_wj_xianwang_level_xian:0 "乡里称善"
 game_concept_wj_xianwang_level_xian_desc:0 "[wj_xianwang_level_xian|E]为县等贤望，涵盖贤望进程的第一、第二级。人物声誉已为乡里所称，可在[wj_luzhi_qianerbai|E]范围内受任；具体效果与任官资格仍按实际贤望等第结算。"
 game_concept_wj_xianwang_level_zhou:0 "士林所称"
 game_concept_wj_xianwang_level_zhou_desc:0 "[wj_xianwang_level_zhou|E]为州等贤望，涵盖贤望进程的第五、第六级。人物已为士林推重，可向[wj_luzhi_zhongerqian|E]官职进阶；具体效果与任官资格仍按实际贤望等第结算。"

 # 来源：localization/simp_chinese/WJ_office_roads_loc_l_simp_chinese.yml
 game_concept_WJ_maocai:0 "举茂才"
 game_concept_WJ_maocai_desc:0 "汉晋制度下，王国级以上官员可以察举同一天朝的才士为茂才。现任官员、孝廉及辟召出身者均可再被举茂才；已是茂才者不可重复受举。受举者直接取得正式入仕资格，实际禄秩仍由所任官职决定；举主还可在察举时提出收其为门生。"
