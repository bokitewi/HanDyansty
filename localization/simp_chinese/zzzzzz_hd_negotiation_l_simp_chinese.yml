l_simp_chinese:
 # 归附谈判（2026-10-25）
 # 劝其归附：接受度条目
 hd_neg_reason_gold:0 "所许赐金：$VALUE|=+0$"
 hd_neg_reason_prestige:0 "所许威望：$VALUE|=+0$"
 hd_neg_reason_influence:0 "所让影响力：$VALUE|=+0$"
 hd_neg_reason_warlord:0 "许为军阀：$VALUE|=+0$"
 hd_neg_not_petitioning_tt:0 "对方没有正在向别人请求归附"
 # 劝其归附：窗口里的预先让步
 hd_neg_o_gold1:0 "赐金@gold_icon!$HD_NEG_GOLD1|0$（约半年岁入）"
 hd_neg_o_gold2:0 "赐金@gold_icon!$HD_NEG_GOLD2|0$（约一年岁入）"
 hd_neg_o_gold3:0 "赐金@gold_icon!$HD_NEG_GOLD3|0$（约两年岁入）"
 hd_neg_o_gold_desc:0 "归附当日从你的[gold|E]中付给对方，数额按对方的家底计。届时付不起，归附作罢。"
 hd_neg_o_prestige1:0 "赐威望@prestige_icon!$HD_NEG_PRESTIGE1|0$"
 hd_neg_o_prestige2:0 "赐威望@prestige_icon!$HD_NEG_PRESTIGE2|0$"
 hd_neg_o_prestige_desc:0 "加官进爵、厚礼相待：归附当日你失去这些[prestige|E]，对方得到同样多。届时付不起，归附作罢。"
 hd_neg_o_influence1:0 "让影响力@influence_icon!$HD_NEG_INFLUENCE1|0$"
 hd_neg_o_influence2:0 "让影响力@influence_icon!$HD_NEG_INFLUENCE2|0$"
 hd_neg_o_influence_desc:0 "归附当日你让出这些[influence|E]给对方。届时付不起，归附作罢。"
 hd_neg_o_warlord:0 "许为军阀"
 hd_neg_o_warlord_desc:0 "归附后对方即成军阀：不缴赋税、不出征召兵，改行欢呼继承制，你对其的好感也不会因此下降。\n十年内你若收回其权力，即为背约：[prestige|E]#N -350#!，全体封臣对你好感#N -15#!（五年内淡去）。"
 hd_neg_accept_terms_tt:0 "所许条件归附当日兑现。对方若贪婪、野心勃勃或傲慢，而你又未预先让步，可能趁机再开一价，不答应就不降。"
 hd_neg_decline_counter_tt:0 "若差距不大（接受度差 60 以内），对方会回信开出条件。"
 # 请求归附：接受度条目
 hd_neg_reason_cannot_pay:0 "付不起对方所开的条件：$VALUE|=+0$"
 hd_neg_reason_no_warlord:0 "不肯许其为军阀：$VALUE|=+0$"
 # 兑现
 hd_neg_warlord_term_tt:0 "归附后即成#V 军阀#!，十年内不收回其权力（提前收回即为背约）"
 hd_neg_void_title:0 "归附作罢"
 hd_neg_void_desc:0 "所许条件届时付不起，这笔交易作废。"
 hd_neg_haggle_ok_title:0 "还价成了"
 hd_neg_haggle_fail_title:0 "还价不成"
 hd_neg_haggle_fail_desc:0 "对方不肯让步，归附之议就此作罢。"
 hd_neg_petition_uncond_ok_title:0 "来使应允无条件归附"
 hd_neg_petition_uncond_fail_title:0 "来使拂袖而去"
 hd_neg_petition_uncond_fail_desc:0 "对方不肯无条件投靠，此事作罢。"
 hd_neg_warlord_refused_title:0 "所求不许"
 hd_neg_warlord_refused_desc:0 "对方不肯许你拥兵自重，谈判破裂。"
 # 背约
 hd_neg_breach_tt:0 "背弃了十年内不收回其权力的承诺"
 hd_neg_breach_opinion:0 "背约"
 # 条件清单（事件描述）
 hd_neg_terms_header:0 "\n\n所求条件："
 hd_neg_term_gold_line:0 "\n· 赐金@gold_icon!#V [hd_neg_v.MakeScope.Var('hd_neg_gold').GetValue|0]#!"
 hd_neg_term_prestige_line:0 "\n· 赐威望@prestige_icon!#V [hd_neg_v.MakeScope.Var('hd_neg_prestige').GetValue|0]#!"
 hd_neg_term_influence_line:0 "\n· 让影响力@influence_icon!#V [hd_neg_v.MakeScope.Var('hd_neg_influence').GetValue|0]#!"
 hd_neg_term_warlord_line:0 "\n· 许为#V 军阀#!，十年内不收回其权力"
 # hd_neg.0001 回信索价
 hd_neg.0001.t:0 "来使开价"
 hd_neg.0001.desc_gap:0 "[hd_neg_v.GetTitledFirstName]遣使回书：“明公厚意，敢不从命？只是部曲老小皆仰仆一人，空手归附，恐众心不安。若蒙明公允以下列诸事，仆即率所部来归。”"
 hd_neg.0001.desc_opportunist:0 "[hd_neg_v.GetTitledFirstName]答应归附，却又遣使附言：“归附之事，仆已许之。只是另有一事相求，还望明公成全。”"
 hd_neg.0001.a:0 "依其所请"
 hd_neg.0001.b:0 "讨价还价"
 hd_neg.0001.b.tt:0 "把对方最后要的一项降一档再谈（军阀改为让影响力或大额赐金，最低一档改为不给）。\n成功率#V [hd_neg_v.MakeScope.Var('hd_neg_haggle_chance').GetValue|0]%#!，不成则谈判破裂。"
 hd_neg.0001.c:0 "不必了"
 hd_neg.0001.c.tt:0 "归附之议就此作罢，两年内不便再提。"
 # hd_neg.0011 强邻劝降
 hd_neg.0011.t:0 "强邻劝降"
 hd_neg.0011.desc:0 "[hd_neg_l.GetTitledFirstName]遣使前来，劝我举地归附：“天下纷乱，独守一隅，恐难长久。愿与君定君臣之分，君之封土属臣，一仍其旧。”\n\n来使言辞恳切。归附与否、以何为条件，尚可商量。"
 hd_neg.0011.a:0 "无条件归附"
 hd_neg.0011.a.tt:0 "举地归附[hd_neg_l.GetTitledFirstName]，封土属臣一仍其旧。"
 hd_neg.0011.b:0 "要求赐金@gold_icon![ROOT.Char.MakeScope.Var('hd_neg_show_gold').GetValue|0]"
 hd_neg.0011.c:0 "要求赐威望@prestige_icon![ROOT.Char.MakeScope.Var('hd_neg_show_prestige').GetValue|0]"
 hd_neg.0011.d:0 "要求让影响力@influence_icon![ROOT.Char.MakeScope.Var('hd_neg_show_influence').GetValue|0]"
 hd_neg.0011.e:0 "要求许为军阀"
 hd_neg.0011.e.yes:0 "对方兵力足以压制你，当会应允：归附后你即成军阀，十年内不收回你的权力。"
 hd_neg.0011.e.no:0 "对方不会答应（兵力不足你的三倍、生性多疑或与你交恶），谈判将就此破裂。"
 hd_neg.0011.paid.tt:0 "对方付得起，当会应允，归附当日兑现。"
 hd_neg.0011.f:0 "婉言谢绝"
 # hd_neg.0021 附条件请降
 hd_neg.0021.t:0 "来使请降"
 hd_neg.0021.desc:0 "[hd_neg_v.GetTitledFirstName]遣使来书：“仆据地偏狭，兵微将寡，愿举所部归于麾下，世为藩辅。只是部众未必心服，还请明公允以下列诸事。”"
 hd_neg.0021.a:0 "依其所请，纳之"
 hd_neg.0021.b:0 "只许无条件归附"
 hd_neg.0021.b.tt:0 "对方接受的可能为#V [hd_neg_v.MakeScope.Var('hd_neg_haggle_chance').GetValue|0]%#!，不肯则作罢。"
 hd_neg.0021.b.must:0 "此人志大气高，不给条件必不肯来，此事将就此作罢。"
 hd_neg.0021.c:0 "不纳"
