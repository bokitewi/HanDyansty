l_simp_chinese:
 HD_UPRISING_WAR_NAME:0 "起义战争"
 hd_yellow_turban_rebellion_war:0 "黄巾起义"
 hd_peasant_populist_uprising_war_victory_desc:0 "起义军得胜，所占郡县各归其占领者，起义首领脱离原主自立。"
 hd_peasant_populist_uprising_war_white_peace_desc:0 "双方罢兵，郡县归属一如其旧。"
 hd_peasant_populist_uprising_war_defeat_desc:0 "起义溃败，起事者一无所得，首领沦为阶下之囚。"
 hd_uprising_war_victory_desc:0 "起义军得胜，首领脱离原主自立。"
 hd_yellow_turban_war_victory_desc:0 "这一路黄巾得胜，本方及盟友战中所夺郡县均归本路起义首领。"
 hd_uprising_war_white_peace_desc:0 "双方罢兵，战中易手的郡县各维现状。"
 hd_uprising_war_defeat_desc:0 "起义失败，起事者战中所夺郡县尽归原主。"
 hd_yellow_turban.0001.t:0 "苍天已死"
 hd_yellow_turban.0001.desc:0 "雒阳的急信送到，你才展开，便看见[tang_zhou.GetName]告密的消息。三十六方的布置已经败露，[ma_yuan_yi.GetName]也已被捕处死；原定举事的日子尚未到，官府的搜捕却不会等。\n\n传信的人伏在你面前，袖口尽是赶路沾的泥。你问还有多少人知情，他只是摇头。此刻多迟疑一日，便可能又少一路肯举黄旗的信众。\n\n南阳有张曼成，颍川有波才，各方虽分领部众，却还能同时起兵。你将急信按在案上，命人重传号令。既然已无路退回从前，那便不必再等到三月五日了。"
 hd_yellow_turban.0001.a:0 "苍天已死，黄天当立！"
 hd_yellow_turban.0002.t:0 "黄巾得势"
 hd_yellow_turban.0002.desc:0 "报信人一口气念完攻下的县名，停住等我发问。我将刚听过的几处地名再问一遍，他逐一答了，又补上一句：“这一战，汉军已经认败。”\n\n我接过文书。起兵时的三路黄旗，如今至少有一路守住了所得；可这封战报没有告诉我，别处的战事究竟如何，沿途的乡里又还有多少粮。门边有人听见“黄巾得胜”，便忍不住探头进来，想从我脸上看出这究竟算好消息还是坏消息。\n\n我没有立刻回答，只把战报摊平。往后再派人出门，就得先问清：沿途的县城，究竟换了谁的旗号？"
 hd_yellow_turban.0002.a:0 "天下自此多事矣。"
 hd_yellow_turban.0003.t:0 "黄巾败亡"
 hd_yellow_turban.0003.desc:0 "报信人说，三路黄巾大军都已败下阵来。我让他再说一遍，才将这封信和先前的消息放在一起。那些曾经接连告急的县邑，如今换了说法：收复、追捕，还有数不清的溃散人众。\n\n“路上能走了么？”有人在旁问。他迟疑片刻，答道，大股兵马虽散，小路上仍有人持械拦截，逃难的人也未必敢回去。方才围过来听消息的人渐渐不再说话，只剩报信人低声补说沿途见闻。\n\n我把信折回去。汉军报了胜，许多人的住处却还空着。这场起事终于有了胜负，可若要出门、运粮或寻回亲人，眼下仍得先打听清楚道路。"
 hd_yellow_turban.0003.a:0 "乱事虽平，疮痍未复。"
 hd_zhuojun_rangers:0 "涿郡义从"
 hd_zhuojun_rangers_adj:0 "涿郡义从"
