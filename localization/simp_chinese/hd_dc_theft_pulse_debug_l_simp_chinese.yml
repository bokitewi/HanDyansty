l_simp_chinese:
 hd_dc_theft_pulse_debug.title: "盗库检查记录"
 hd_dc_theft_pulse_debug.gates: "挪用国库的额外年度发起机会已移除。本页仅查看记录，不再提供额外检查或启动计谋的按钮。"
 hd_dc_theft_pulse_debug.actor: "\n\n受检角色：[scope:hd_dc_theft_debug_actor.GetName]。"
 hd_dc_theft_pulse_debug.no_actor: "\n\n区域内没有符合正式盗库年度资格的AI角色。"
 hd_dc_theft_pulse_debug.year: "\n最近检查年：[scope:hd_dc_theft_debug_actor.MakeScope.Var('hd_dc_theft_pulse_year').GetValue|0]。"
 hd_dc_theft_pulse_debug.no_record: "\n尚无可读取的年度检查记录。"
 hd_dc_theft_pulse_debug.probability: "\n实际选中目标：[scope:hd_dc_theft_debug_actor.MakeScope.Var('hd_dc_theft_pulse_target').Char.GetName]。\n基础机会：[scope:hd_dc_theft_debug_actor.MakeScope.Var('hd_dc_theft_pulse_p0').GetValue|3]%；调整后实际抽样机会：[scope:hd_dc_theft_debug_actor.MakeScope.Var('hd_dc_theft_pulse_probability').GetValue|3]%。"
 hd_dc_theft_pulse_debug.no_business_candidate: "\n检查结果：没有符合业务资格的候选，未计算概率、未抽样。"
 hd_dc_theft_pulse_debug.native_gate_failed: "\n检查结果：存在业务候选，但原生计谋启动检查未通过。现有禁用门仍生效；该结果也不绕过冷却和容量检查。"
 hd_dc_theft_pulse_debug.probability_failed: "\n检查结果：已有合法目标，实际概率抽样未中。"
 hd_dc_theft_pulse_debug.started: "\n最近检查结果：原生启动调用成功创建过真实计谋；是否仍存在见下方。"
 hd_dc_theft_pulse_debug.native_start_failed: "\n检查结果：通过抽样后，原生调用未返回新计谋。"
 hd_dc_theft_pulse_debug.scheme_exists: "\n真实计谋记录：所记录的计谋目前仍存在。"
 hd_dc_theft_pulse_debug.no_scheme: "\n真实计谋记录：没有当前仍存在的计谋引用，不据此推断历史成功。"
 hd_dc_theft_pulse_debug.refresh: "只读刷新当前角色"
 hd_dc_theft_pulse_debug.other: "只读改看另一名合格角色"
