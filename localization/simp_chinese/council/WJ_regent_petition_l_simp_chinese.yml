l_simp_chinese:
 WJ_pr_title:0 "权臣进请"
 WJ_pr_duke_desc:0 "[scope:wj_pr_actor.GetShortUIName]执掌中枢，今请赐实封公爵，以酬勋劳。朝局受制，此请并非寻常奏章。你愿径允，还是借礼议与谋略争取转圜？"
 WJ_pr_hereditary_desc:0 "[scope:wj_pr_actor.GetShortUIName]进请将相业定为世守，依世族继承法传承。允其所请，便将改变相位死亡后的去留；你也可以设法使其收回奏请。"
 WJ_pr_king_desc:0 "[scope:wj_pr_actor.GetShortUIName]已有封国，今再请进位为王。是否允其以现有封地升格，或先设法缓图？"
 WJ_pr_abdicate_desc:0 "[scope:wj_pr_actor.GetShortUIName]权势日盛，今以天下之望进请受禅。若允，礼官将依三辞三让之仪推进交位；你仍可在礼仪开始前尝试周旋。"
 WJ_pr_generic_desc:0 "权臣奏请已至御前，须对此次诉求作出裁定。"
 WJ_pr_agree:0 "依所请行之。"
 WJ_pr_agree_tt:0 "只批准本次权益，沿既有封爵、世袭或三辞三让流程办理；不会一次授予其它特权。"
 WJ_pr_ritual:0 "付诸礼议，徐图转圜。"
 WJ_pr_scheme:0 "暗筹应对，另觅转机。"
 WJ_pr_method_desc:0 "周旋须选定一策。选定后只尝试一次，期间不能重选；胜算取决于双方能力与摄政权势。得手则撤回本次奏请，失手则只能允其所请。"
 WJ_pr_learning:0 "引经据典，驳其礼制。"
 WJ_pr_diplomacy:0 "以名分大义婉转劝退。"
 WJ_pr_intrigue:0 "暗寻破绽，使其自退。"
 WJ_pr_allies:0 "联络可信近臣，合力劝止。"
 WJ_pr_learning_tt:0 "胜算[SCOPE.ScriptValue('WJ_pr_learning_chance')|0]%。7日后裁定：成功撤请、同项冷却12个月，摄政权力－5；失败批准本项、权力＋5。"
 WJ_pr_diplomacy_tt:0 "胜算[SCOPE.ScriptValue('WJ_pr_diplomacy_chance')|0]%。7日后裁定：成功撤请、同项冷却12个月，摄政权力－5；失败批准本项、权力＋5。"
 WJ_pr_intrigue_tt:0 "胜算[SCOPE.ScriptValue('WJ_pr_intrigue_chance')|0]%。14日后裁定：成功撤请、同项冷却24个月，摄政权力－10；失败批准本项、权力＋10。"
 WJ_pr_allies_tt:0 "胜算[SCOPE.ScriptValue('WJ_pr_allies_chance')|0]%。至多两名合格现任近臣各加5个百分点，已计入胜算。14日后裁定：成功撤请、同项冷却24个月，摄政权力－10；失败批准本项、权力＋10。"
 WJ_pr_back:0 "尚未定策，容朕再思。"
 WJ_pr_result_title:0 "进请已有裁断"
 WJ_pr_success_desc:0 "周旋奏效，权臣暂且撤回此次进请。你为朝局争得了喘息之机；相应请求已进入冷却，摄政权力也有所减退。"
 WJ_pr_failure_desc:0 "周旋未能奏效，权臣反借此巩固声势。此次请求将按原有规则办理，其余权益不会因此一并授出。"
 WJ_pr_result_ack:0 "朕已知晓。"
 WJ_pr_invalid_title:0 "进请失效"
 WJ_pr_invalid_tt:0 "天子、摄政或本次诉求资格已改变，未授予新权益。"
 WJ_pr_political_tt:0 "向玩家天子进请：本人须为有效录尚书事兼都督中外，摄政权力至少60、威望等级高于3；天子未成年／失能，或已有至少两名合格内廷支持者"
 WJ_pr_idle_tt:0 "本人及这位天子当前均没有尚待裁定的进请"
 WJ_pr_cooldown_tt:0 "同一天子与权臣的12个月进请冷却、以及本项另定的12／24个月冷却均已结束"
 WJ_pr_begin_tt:0 "皇帝须有君权旁落；符合本项资格后自动允请，沿既有结算办理，不弹出皇帝询问或周旋窗口。"
 WJ_pr_powerless_required_tt:0 "皇帝拥有君权旁落，现阶段自动允请；仍须满足本项原有资格"
