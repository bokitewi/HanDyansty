l_simp_chinese:
 WJ_chancellor_life_law:0 "终身授相"
 WJ_chancellor_life_law_effects:0 "此官署不循省部候选顺补。持有人死亡时撤相；正式罢免、离开本朝或官署销毁亦撤相，改行司徒摄政。唯另获世袭特权，死亡时才依世族继承法交接。"
 WJ_cx_name_title:0 "正名授职"
 WJ_cx_name_desc:0 "中枢之任、录尚书事与节钺之权既已授定，此后当以何职名总揽国政？可循丞相旧称，亦可酌定新号。职名虽异，权责仍依授命之制。"
 WJ_cx_name_chengxiang:0 "丞相"
 WJ_cx_name_taishi:0 "太师"
 WJ_cx_name_taifu:0 "太傅"
 WJ_cx_name_zhongzai:0 "冢宰"
 WJ_cx_name_xiangguo:0 "相国"
 WJ_cx_name_dazai:0 "大宰"
 WJ_cx_name_confirm:0 "依此职名颁行。"
 WJ_cx_name_keep_default:0 "仍用丞相旧称。"
 WJ_cx_name_from_text:0 "[ROOT.Char.GetLocalizedText('wj_cx_name')]"
 WJ_cx_name_from_flag:0 "[ROOT.Var('wj_cx_name').GetFlagKey]"
 WJ_cx_name_done:0 "中枢职名已定"
 WJ_cx_name_done_tt:0 "内阁职名现为[GetTitleByKey('e_WJ_minister_cheng_xiang').GetNameNoTierNoTooltip]，官署现称[GetTitleByKey('e_WJ_minister_cheng_xiang').GetName]；权限与继承规则不变。"
 WJ_cx_announcement_desc:0 "朝廷诏告百官：[scope:wj_cx_announced.GetShortUIName]拜相秉政，总领中枢，录尚书事，兼都督中外诸军事，假黄钺。其原有地方头衔、臣属与治所仍旧。"
 WJ_cx_announcement_ack:0 "诏命既下，布告中外。"
 WJ_cx_actual_regent_tt:0 "本人同时实际持有相位、担任该内阁职务，并为天子的录尚书事"
 WJ_cx_real_duke_tt:0 "本人至少已有实封公爵"
 WJ_cx_controls_emperor_tt:0 "天子是本人的傀儡；玩家天子另经进请事件处理"
 WJ_cx_not_hereditary_tt:0 "相位尚未改行世族继承法"
 WJ_cx_strong_regent_tt:0 "本人是天子现任录尚书事，尚未担任丞相，摄政权力至少60"
 WJ_cx_no_real_fief_tt:0 "本人尚未获封实封公或实封王"
 WJ_cx_low_crown_tt:0 "天子君权低于2级（当前须为1级）"
 WJ_cx_support_tt:0 "侍中、大司马、尚书令、中常侍、大将军五席中，至少三席由本人、门生、直接幕僚或近远亲占据；按席位计数"
 WJ_cx_army_tt:0 "本人当前军力至少3000，且不少于天子当前军力的150%；不累加未参战盟友的军力"
 WJ_cx_legal_heir_tt:0 "现持实封爵位的世族继承法已有能够实际任职的合法继承人"
 WJ_cx_hereditary_decision:0 "世守相业"
 WJ_cx_hereditary_decision_desc:0 "既掌中枢，又有封国，今可进请将相位定为世守。获准后沿世族继承法接续；法定继承人若不能实际任职，相位仍须撤销。罢免、离朝或毁相也不保留此特权。"
 WJ_cx_hereditary_decision_tooltip:0 "核对相位、实际摄政、封爵、控制天子及法定继承人五项条件"
 WJ_cx_hereditary_decision_confirm:0 "请定相业世承"
 WJ_cx_hereditary_done_tt:0 "相位改行世族继承法。仅死亡可传承；合格新任完整接掌相职，摄政权力从60起步。"
