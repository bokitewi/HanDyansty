l_simp_chinese:
 hd_dc_par_tax_relief_modifier: "赈济减赋试行"
 hd_dc_policy_silenced_opinion: "被责令停止争论"
 hd_dc_policy_retained_opinion: "朝廷保留了我具奏的政策"
 hd_dc_policy_trial_selected_opinion: "我的政策获准实际试行"
 hd_dc_policy_trial_passed_over_opinion: "朝廷先试行了对方的政策"
 hd_dc_par.1101.t: "减赋令已下郡"
 hd_dc_par.1101.desc: "[scope:hd_dc_policy_county.GetName]的收据送到了案前。一百金已经交割，地方也已按约开始减赋。\n\n簿上另留了一栏，写着一年后须核验的控制与生计情形。今日可以确认的是这道政令已经执行；它能收多少成效，还要等地方交出后来的实数。"
 hd_dc_par.1101.a: "收好开办的凭据，期满再核。"
 hd_dc_par.1101.a.tt: "本案100金已实际收付，减赋已开办：税收−10%、发展增长+25%、民意+20，期限12个月。治理分须待期满核验；本回执不另扣钱或加分。"
 hd_dc_par.1201.t: "试行案的末页"
 hd_dc_par.1201.fulfilled: "[scope:hd_dc_policy_county.GetName]的试行簿终于添上了末页。十二个月已满，承办者仍有施政权限，核验没有发现这项减赋在期限内中断。\n\n开办与期末的控制度、发展度已分别留档。簿册如实写着地方的变化；它证明此约已经做完，却不能替任何一派写下‘处处适用’的断语。"
 hd_dc_par.1201.authority_lost: "[scope:hd_dc_policy_county.GetName]的试行簿送回来了，末页却不是预定的验收。承办权限或本案结算条件已经改变，这份原约无法继续按原来的对象与权限核验。\n\n本案拥有的减赋已经结束。先前实际交割的钱仍有凭据，不能把终止写成履约，也不能把已付的款项写成从未发生。"
 hd_dc_par.1201.interrupted: "[scope:hd_dc_policy_county.GetName]的试行记录出现了断处。核验时，原约的减赋已不能按本案连续确认，这一轮须以未完成结案。\n\n收据仍归收据，未完成仍归未完成。账房留下实际交割记录，没有因这封回报再拨一笔钱，也没有替任何人记下已经返还的款项。"
 hd_dc_par.1201.a: "把核验结果附在原约之后。"
 hd_dc_par.1201.q.tt: "本次实际履约已向对应危机记入治理分Q+5，仅结算一次。阅读本回执不会再次加分。"
 hd_dc_par.1201.no_q.tt: "本次没有记入新的治理分。实际付款记录保留，本回执不执行额外付款或退款。"
 hd_dc_par.1001.t: "先问一郡"
 hd_dc_par.1001.desc: "案头送来一封问策书，封泥上仍留着使者拇指的印痕。[scope:hd_dc_case_county.GetName]确有灾患，朝廷要我就此具奏。\n\n[scope:hd_dc_case_ruler.GetTitledFirstName]问得很明白：是先缓一年的赋税，让地方喘息，还是维持现行征收，保全官府开支？这一次，不能只写几句劝善责恶的话；奏章上要留下我的名字。"
 hd_dc_par.1001.a: "先减赋。把这个主张写在我的奏章上。"
 hd_dc_par.1001.a.tt: "就这份具体政策案提交减赋主张。此时不拨款、不施政；若另一位党魁提出相反主张，再交朝廷处理。"
 hd_dc_par.1001.b: "维持现行征收，先说明钱从何来、用往何处。"
 hd_dc_par.1001.b.tt: "就同一政策案提交保库主张。此时不加税、不增加国库；你的主张与对方实际答复分别保存。"
 hd_dc_par.1001.c: "我不愿以本党名义领议此案。"
 hd_dc_par.1001.c.tt: "拒绝参加这次政策争论。本案不启动党争主危机，不记五十年冷却，也不把拒绝当作支持任何一方。"
 hd_dc_par.window_closed: "此案已经另行处置。"
 hd_dc_par01_local_relief_terms: "由提案者支付100金，交现任地方官用于本案受灾郡减赋试行。足额收款且仍有施政权后开办，试行12个月；期满记录实际控制度与发展度，再复核履行情况。此约不授予新官职，不保证地方情况必然改善。"
 hd_dc_par_tax_relief_modifier_desc: "本郡奉议试行减赋一年。地方官须保留施政记录，期满复核；此次试行不代表朝廷永久支持任何一党。"
 hd_dc_par01_relief_leadership_terms: "由主张减赋的具奏党魁主持本案十二个月试行与期满复核。接受此约后，朝廷另向本案现任地方官送交100金减赋执行提案；地方官仍须自行接受，足额交割后才开办。此约不转移头衔或朝廷职位，不构成永久支持本党，签署本身不拨款或记入治理分。"
 hd_dc_par.1202.t: "未能开办的试行"
 hd_dc_par.1202.rejected: "送往[scope:hd_dc_policy_county.GetName]一案的文书退回了。答复的人明确写下了拒绝，没有在约定后面落印。\n\n减赋的主张仍在原奏章里，但主张与愿意承担执行是两回事。这份提案到此为止，不能把没有接受的委托记作履约。"
 hd_dc_par.1202.expired: "案吏把[scope:hd_dc_policy_county.GetName]的文书从待办匣中取了出来。答复期限已经过去，空着的签署处仍旧空着。\n\n朝廷没有据此拨付执行款，地方也未依这份提案开始试行。若以后再议，不能拿今日的沉默当作旧日的承诺。"
 hd_dc_par.1202.funding_failed: "[scope:hd_dc_policy_county.GetName]一案的签署送到了，账房却没能交出足额收付的凭据。减赋尚未开办，原拟的一年核验也不能从纸上起算。\n\n经手人只留下实际发生的扣款与到账记录；没有发生的款项，不写成已经支付。"
 hd_dc_par.1202.invalidated: "[scope:hd_dc_policy_county.GetName]一案的文书再次送来时，原来据以签署的情形已经改变。如今的承办者、施政权限或政策案，已不能与送出时逐项相合。\n\n这份提案不再继续执行。案吏将变更缘由附在旧书之后，免得后来人把一份失效的约定当作已经办成的政绩。"
 hd_dc_par.1202.a: "保留原书与答复，如实归档。"
 hd_dc_par.1202.a.tt: "本提案未开办试行，不记治理分。本回执不会再拨款、补付或退款；已经实际发生的收付及未到账差额仍保留。"
