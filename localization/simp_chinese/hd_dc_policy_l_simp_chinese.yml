l_simp_chinese:
 hd_dc_par_tax_relief_modifier: "赈济减赋试行"
 hd_dc_policy_silenced_opinion: "政见受挫"
 hd_dc_policy_retained_opinion: "所奏见纳"
 hd_dc_policy_trial_selected_opinion: "受命试行新政"
 hd_dc_policy_trial_passed_over_opinion: "朝廷先行他议"
 hd_dc_par.1101.t: "减赋令已下郡"
 hd_dc_par.1101.desc: "[scope:hd_dc_policy_county.GetName]的收据送到了案前。一百金已经交割，当地也已开始减赋。\n\n簿册上另留了一栏，等一年之后，再记下那时的治理与生计。今日能确知的，只是这道政令已经推行下去；它究竟能收多少成效，还要看地方日后的光景。"
 hd_dc_par.1101.a: "收好凭据，期年再验。"
 hd_dc_par.1201.t: "试行期满"
 hd_dc_par.1201.fulfilled: "[scope:hd_dc_policy_county.GetName]的试行簿终于添上了最后一页。一年期满，承办的人始终在任，减赋也不曾中断。\n\n开办之初与期满之时的地方光景，都已分别记下。簿册如实写着当地的变化——它说明此事已经办完，却不能替哪一派写下“处处可行”的断语。"
 hd_dc_par.1201.authority_lost: "[scope:hd_dc_policy_county.GetName]的试行簿送回来了，末页却不是预想中的验收：承办的人已不在其位，这份约定再也无法照原样办下去。\n\n减赋就此停止。先前交割的钱款仍有凭据可查，可这一回，终究算不得善始善终。"
 hd_dc_par.1201.interrupted: "[scope:hd_dc_policy_county.GetName]的试行，在中途断了。减赋未能撑到期满，这一轮只能以未竟收场。\n\n先前的钱款仍有凭据可查，账房也没有因此再拨一文。"
 hd_dc_par.1201.a: "录其始末，附于约后。"
 hd_dc_par.1001.t: "先问一郡"
 hd_dc_par.1001.desc: "案头送来一封问策书，封泥上还留着使者的指印。[scope:hd_dc_case_county.GetName]确有灾患，朝廷要你就此具奏。\n\n[scope:hd_dc_case_ruler.GetTitledFirstName]问得很明白：是先缓一年赋税，让地方喘口气，还是照旧征收，保住官府的用度？这一回，不能只写几句劝善惩恶的空话——奏章上，要落你的名字。"
 hd_dc_par.1001.a: "宜先减赋，具名以奏。"
 hd_dc_par.1001.a.tt: "你的奏章将与另一位领袖的意见一同呈上御前。"
 hd_dc_par.1001.b: "仍旧征收，先明钱粮出入。"
 hd_dc_par.1001.b.tt: "你的奏章将与另一位领袖的意见一同呈上御前。"
 hd_dc_par.1001.c: "此案，吾不愿领议。"
 hd_dc_par.window_closed: "此案已另行处置。"
 hd_dc_par01_local_relief_terms: "[hd_dc_proposer.GetTitledFirstName]拨钱百金，交[hd_dc_recipient.GetTitledFirstName]于受灾之郡减赋一年，以苏民困。钱到即行开办；期满之日，具报当地的治理与生计。此约不授新职，也不担保地方必有起色。三月不复，此议作罢。"
 hd_dc_par_tax_relief_modifier_desc: "朝廷暂减此郡赋税，以待民力稍复。"
 hd_dc_par01_relief_leadership_terms: "[hd_dc_proposer.GetTitledFirstName]请[hd_dc_recipient.GetTitledFirstName]领衔主持减赋之议，试行一年，期满共验。朝廷另拨百金，托受灾之郡的守令开办，守令应允之后方才拨付。此约不授官爵，也不等于朝廷从此偏袒一党。三月不复，此议作罢。"
 hd_dc_par.1202.t: "未能开办的试行"
 hd_dc_par.1202.rejected: "送往[scope:hd_dc_policy_county.GetName]的文书退了回来。答书写得明白：此事不肯承办，约后也没有落印。\n\n减赋的主张仍在奏章里，可主张是一回事，肯担下这份差事又是另一回事。此议到此为止。"
 hd_dc_par.1202.expired: "案吏把[scope:hd_dc_policy_county.GetName]的那份文书从待办的匣子里取了出来。答复的期限早已过去，署名的地方仍然空着。\n\n朝廷没有拨钱，当地也没有据此减赋。日后若再议起，今日的沉默，算不得当初的应允。"
 hd_dc_par.1202.funding_failed: "[scope:hd_dc_policy_county.GetName]的署名送到了，账房却没能把钱足数拨过去。减赋尚未开办，一年的试行也无从算起。\n\n经手的人只把已经出入的数目如数记下；没有拨出的钱，不写作已付。"
 hd_dc_par.1202.invalidated: "[scope:hd_dc_policy_county.GetName]一案的文书再送来时，情形已经变了——承办的人、施政的权柄，或者此案本身，都已与当初不同。\n\n这份约定不再往下办。案吏把变故的缘由附在旧书之后，免得后人把一纸废约，当作已经办成的政绩。"
 hd_dc_par.1202.a: "原书答书，一并收存。"
