 xiali_religious_head_title_name:0 "夏"
 yinli:0 "殷礼"
 yinli_adj:0 "殷礼"
 yinli_adherent:0 "六国"
 yinli_adherent_plural:0 "六国"
 yinli_desc:0 "殷礼指商朝的礼制，是殷人在借鉴并损益夏礼的基础上创制的产物。"
 yinli_religious_head_title:0 "帝"
 yinli_religious_head_title_name:0 "商"
 xizhouli:0 "西周礼"
 xizhouli_adj:0 "西周礼"
 xizhouli_adherent:0 "六国"
 xizhouli_adherent_plural:0 "六国"
 xizhouli_desc:0 "周朝初年，为支撑在政治上维护西周统治的封建制度，周公旦对思想领域进行了全面改革。他广泛整理并改造了上古至商代的礼乐，确立了一整套具体而可操作的礼乐制度，涵盖饮食、起居、祭祀、丧葬等社会生活的方方面面，使之尽归于“礼”的范围之内。"
 xizhouli_religious_head_title:0 "天子"
 xizhouli_religious_head_title_name:0 "周"
 dongzhouli:0 "东周礼"
 dongzhouli_adj:0 "东周礼"
 dongzhouli_adherent:0 "六国"
 dongzhouli_adherent_plural:0 "六国"
 dongzhouli_desc:0 "骊山之祸后，申侯、曾侯等诸侯拥立被废的太子姬宜臼为周天子。自此，华夏大地进入礼崩乐坏、诸侯争雄的时代。大批野心勃勃的诸侯不再甘受旧礼制的约束，转而谋求权谋与战争以遂其志。"
 dongzhouli_religious_head_title:0 "天子"
 dongzhouli_religious_head_title_name:0 "周"

