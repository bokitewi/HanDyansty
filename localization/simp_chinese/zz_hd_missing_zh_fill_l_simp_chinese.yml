 xiali_adj:0 "夏礼"
 xiali_adherent:0 "六国"
 xiali_adherent_plural:0 "六国"
 xiali_desc:0 "夏礼指夏朝的礼制，是最早的礼乐制度。夏礼不仅奠定了商、周礼乐文化的基础，也实际上确立了整个华夏礼乐文明的根基。"
