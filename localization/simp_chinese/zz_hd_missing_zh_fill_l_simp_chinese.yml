 lijiao_religion_desc:0 "在古代中国，“礼”既是社会的根本制度，也是道德规范。作为国家制度，它反映社会政治秩序，维系上层建筑以及在此框架下人与人交往的礼仪；作为道德准则，它规定了国家统治者、贵族以及社会其他一切成员的行为标准与要求。"
