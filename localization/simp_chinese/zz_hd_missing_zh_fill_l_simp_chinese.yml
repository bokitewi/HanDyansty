 # ===== 朝代循环 =====
 hd_dc_theft_pending_credit_tt:0 "已从国库扣除的款项尚未全部到账。未到账的部分仍记录在本次提款条目中；再次处理同一记录不会触发新的扣款。"
 hd_dc_era_control_status:0 "朝廷控制：[Situation.MakeScope.Var('hd_dc_controlled_counties').GetValue|0]/[Situation.MakeScope.Var('hd_dc_total_counties').GetValue|0] 郡（[Situation.MakeScope.Var('hd_dc_control_percent').GetValue|1]%）"
 hd_dc_era_no_holder_status:0 "霸权目前无人执掌；控制率不适用"
 hd_dc_era_invalid_status:0 "政治数据尚未核实；时代判定暂停。"
 hd_dc_par.1201.q.tt:0 "此项任务的实际履行已在对应危机中记录 +5 治理点（Q），且仅结算一次。再次阅读此回执不会追加点数。"
 hd_dc_par.1201.no_q.tt:0 "本次未记录新的治理点。实际支付记录予以保留；此回执不授权追加支付或退款。"

 hd_dc_review_governance_decision:0 "核验危机善后"
 hd_dc_review_governance_decision_desc:0 "战报已不再催促，然而先前许下的诺言仍须逐一核验。此刻封存哪一桩旧案，将决定朝廷能否迎来更长久的太平。"
 hd_dc_review_governance_decision_tooltip:0 "查看可以最终了结的危机；选择结案或继续观察。"
 hd_dc_review_governance_decision_confirm:0 "呈上已核验的案卷"
 hd_dc_governance_review_ready_tt:0 "至少已有一项政治结果确定，核心战争已真正结束，没有待办行动或义务，且存在已核验的危机；治理值达到 20；或核验后存在重大未纠正的违约。"
 hd_dc_gov.0001.t:0 "此卷何时封存？"
 hd_dc_gov.0001.desc:0 "书吏逐条指出已核验的事项，而将仍需时间确认的部分搁置一旁。胜负是一回事，百姓能否安居、承诺是否兑现则是另一回事。\n\n本次危机的案号为 [hd_dc_governance_instance.Var('hd_dc_instance_id').GetValue|0]，实际治理值为 [hd_dc_governance_instance.Var('hd_dc_q').GetValue|0]。现在，可以封存案卷，按目前的成就记录最终结果；也可以再等一等，或许能证明这份安定经得起时间的考验。"
 hd_dc_gov.0001.a:0 "按已有成就结案。"
 hd_dc_gov.0001.a.tt:0 "最终结算只发生一次：重大未纠正违约优先，危机 −10，繁荣不变；否则，治理 ≥60 且连续 5 年完全履约，危机 −35，繁荣 +30；治理 ≥40 且连续 3 年实际安定，危机 −20，繁荣 +15；治理 ≥20 且核心战争结束，危机 −10，繁荣 +5。若平叛仅取得镇压结果，结算上限为最低一档；仅靠等待无法替代军权与俸禄改革。结案后，不可再领取更高档的奖励。"
 hd_dc_gov.0001.b:0 "继续观察，不急于合卷。"
 hd_dc_gov.0001.b.tt:0 "暂且保留此案，不予结算。一旦真正达到最高档，将自动结算；新的相关战争或未履行的义务会中断连续安定的计时。等待后续行动期间，已化解的急性危机配额不会被进一步占用。"
 hd_dc_gov.0002.t:0 "卷宗封存之后"
 hd_dc_gov.0002.high:0 "五年之间，休战留下了可查的记录，诺言也一条条兑现。案吏在末页写下结语，将新旧文书合订一处。\n\n此案治理的最高奖励已记录在案：危机 −35，繁荣 +30。政治上的胜负仍依实际情形记录，不会因本次评定而更改。"
 hd_dc_gov.0002.medium:0 "三年安定，终于积累了足够的记录。虽然仍有不尽完美之处，但已落实的休战与安保安排不应被抹去。\n\n此案的有效安定已获相应奖励：危机 −20，繁荣 +15。此案此后不再有资格重复领取奖励。"
 hd_dc_gov.0002.low:0 "战争确已结束，善后措施也已核验。此刻结案，记录的是有限的缓和，尚不能宣称长久太平。\n\n此案的有限缓和已记入：危机 −10，繁荣 +5。此案不会再有资格领取奖励。"
 hd_dc_gov.0002.breach:0 "账上仍有一项重大的未履行协议，既未因后来的死亡、继位或胜利而抹去，也未真正得到纠正。案卷不能只保留其有利的一面。\n\n此案最终记为重大未纠正的违约：危机 +10，繁荣不变。不会同时发放任何正面的治理奖励。"
 hd_dc_gov.0002.a:0 "照此存档。"

 hd_dc_pressure_character_2:0 "积弊渐显"
 hd_dc_pressure_character_3:0 "疑忌相连"
 hd_dc_pressure_character_4:0 "公然失序"
 hd_dc_pressure_character_5:0 "危机临界"
 hd_dc_pressure_county_2:0 "积弊渐显"
 hd_dc_pressure_county_3:0 "疑忌相连"
 hd_dc_pressure_county_4:0 "公然失序"
 hd_dc_pressure_county_5:0 "危机临界"
 hd_dc_pressure_status:0 "危世：[Situation.MakeScope.Var('hd_dc_pressure_percent').GetValue|1]/100 · 第 [Situation.MakeScope.Var('hd_dc_pressure_band').GetValue|0] 档"
 hd_dc_pressure_status_tt:0 "危世时期，评估朝廷累积的弊病，保留前代遗留的要素，并在治世时相应调整。催化事件发生时，其代价按当前时代的换算率计算；割据地区继续沿用危世时代的数值。危机的五个档位以及治理的奖惩，均由此处读数决定，而阶段图中的催化进度则单独保留。\n\n控制与发展按本轮基线对每个郡累计扣减：只有更高一档仍未处理时，才会在之后扣除差额。数值下降后回到同一档，不会重复扣减；第 1 档持续 60 个月后，将在下一轮重新计算基线。"
 hd_dc_prosperity_status:0 "繁荣：[Situation.MakeScope.Var('hd_dc_prosperity_percent').GetValue|1]/100"
 hd_dc_prosperity_status_tt:0 "繁荣记录反映恢复治理的成就，每个时代各有独立的下限与上限，范围为 0 至 100；两者可同时升降。催化按朝廷偏好的发展或扩张方向朝繁荣推进，每次只考虑一个方向；朝廷暂时无主时，沿用此前的方向。更换时代不会重置数值。\n\n阶段图继续显示原时代的进度；此处的繁荣读数不会直接切换时代，割据退出仍须满足实际领土与稳定时长的条件。"
 hd_dc_ritual_register_title:0 "王室礼序"
 hd_dc_ritual_register_tt:0 "这是宗室成员纷争时所依据的礼序名册。初次确认时，按最高头衔等级与年龄排列；等级与年龄相同者并列。此后保留原有次序，并另行记录天子实际赐予的席位。今后凡涉及宗室的议事，均按当前礼序邀请符合条件的亲属。"
 hd_dc_ritual_register_row:0 "第 [Scope.Var('hd_dc_ritual_rank').GetValue|0] 位，[Scope.Var('hd_dc_actor').Char.GetName] · 旧序第 [Scope.Var('hd_dc_ritual_old_rank').GetValue|0] 位"
 hd_dc_roy_end.governance_pending_tt:0 "仅记录已经发生的政治结果，并化解本次的急性危机。不会再次转移头衔，不会释放附庸，也不会发放和平奖励；终局奖励参照真实战争、条约履行、稳定时期和违约的记录来决定。"
 hdpc_soft_pressure_modifier:0 "暂居民间"
 hdpc_soft_pressure_modifier_desc:0 "在人口调控期间被暂时放入人物池。此项生育调整最长持续十年；回到朝廷、出任官职或进入受保护区域后，将在下一次年度维护时解除。此调整不扣除健康，也不会直接导致死亡。"
 hdpc_high_pressure_modifier:0 "推迟扩充家族"
 hdpc_high_pressure_modifier_desc:0 "当角色所在人口超过调控目标时施加的临时生育调整。此效果最长持续十年，可能因调任等情况而提前解除。此调整不会造成永久不育、改变特质，也不会直接致人死亡。"

 # ===== 入关 / 反摄政 / 奉迎 =====
 hd_anti_regent.0100.a:0 "继续进军。"
 hd_anti_regent.0200.t:0 "入关之后的天下"
 hd_anti_regent.0200.desc:0 "关门终于洞开，摄政直辖的领地落入联军之手。诸将在帐前呈上各自的军功簿，等待分配战利品。如今，身为联盟之主，我必须主持分封，终结摄政对朝廷的把持。"
 hd_anti_regent.0200.a:0 "论功行封。"
 hd_enter_the_passes_victory_desc:0 "联军攻破关中，夺取了摄政直辖的领地。"
 hd_enter_the_passes_white_peace_desc:0 "入侵战争以白和平告终，联盟随之瓦解。"
 hd_enter_the_passes_defeat_desc:0 "入侵被击退，摄政保住了朝廷。"
 HD_ENTER_THE_PASSES_WAR_NAME:0 "入关之战"
 hd_fengying.0001.alt_desc:0 "天子被迫逃出关中。然而我尚无独立的领地，无法将朝廷迎入自己的治所。我仍可派兵护送并观望局势，或明确拒绝介入。"
 hd_fengying_cao_control:0 "牢牢把持朝廷。"

 # ===== 地名形容词（取自对应中文地名） =====
