l_simp_chinese:
 hd_cao_chain.0001.t:0 "宫门血迹"
 hd_cao_chain.0001.desc:0 "伍孚行刺董卓未成，已遭处决。消息传来时，旁人先朝门外看了一眼，才压低声音，仿佛提到那把刀，也会招来杀身之祸。\n\n你听着行刺的经过，手指停在案沿。满朝痛骂董卓的人不少，敢走到他面前的，如今却成了众人不敢多谈的一具尸首。伍孚没能杀了他，反倒让他更有理由把兵士布满宫门，把猜忌加在每一个近身之人身上。\n\n若只肯等别人先动手，你们大概还能这样低声议论许多年。只是到了那时，朝廷里还能剩下谁？"
 hd_cao_chain.0001.a:0 "伍君之死，当引以为鉴。"
 hd_cao_chain.0002.t:0 "满座泪痕"
 hd_cao_chain.0002.desc:0 "伍孚死后，朝中的议论愈发小心。王允借宴饮召集旧臣，门一关上，席间便有人低下头，继而掩袖失声。酒还没喝上几口，哭声已经盖过了说话声。\n\n你听他们历数董卓的罪状：谁被逐，何事被夺，天子如何受制。说到后来，众人只剩一句汉室将亡，仿佛把悲痛说得足够真切，便算尽了臣子的本分。\n\n一声笑从你口中漏了出来。几双带泪的眼睛转向你，王允也收住了话头。满座终于不哭了，却都在等你解释，为何还笑得出来。"
 hd_cao_chain.0002.a:0 "夜哭到明，明哭到夜，能哭死董卓否？"
 hd_cao_chain.0003.t:0 "借刀"
 hd_cao_chain.0003.desc:0 "那场宴后，王允没有忘记你的笑声。再议诛董之事时，他先屏退左右，问你当日所言，究竟是一时激愤，还是已有打算。\n\n“哭不能除贼，刀或许能。”你把话说得很慢。董卓尚许你近身，旁人进不去的那道门，你还有机会走进去。王允许久不答，末了才取出七星宝刀，放在你们二人之间。\n\n你握住刀柄，略略抽开，寒光便映上了指节。借刀容易，真要拔出来时，却没有满座公卿替你担这份凶险。这一回，你得自己走到董卓面前。"
 hd_cao_chain.0003.a:0 "刀已在手，余事在我。"
 hd_cao_chain.0003.a.tt:0 "七星宝刀已佩在你的身侧。"
 hd_cao_chain.0004.t:0 "镜中寒光"
 hd_cao_chain.0004.desc:0 "七星刀藏在身侧，隔着衣料仍能觉出刀鞘的棱角。你走近董卓，等他移开目光，才缓缓握住刀柄。\n\n偏偏在刀锋出鞘之际，铜镜里闪过一点亮光。董卓猛然回头，问你持刀何为。你来不及多想，将刀横捧，俯身说是特来进献的宝物。那道目光仍停在你背上；多站片刻，方才的托词便未必经得起追问。\n\n你终于退到门外，掌心早已湿透。除贼的打算落了空，下一道传召却万万不能再接。眼下唯一要紧的，是在追骑出城之前走得足够远。"
 hd_cao_chain.0004.a:0 "事已不谐，速走！"
 hd_cao_chain.0006.t:0 "途中旧血"
 hd_cao_chain.0006.desc:0 "莱芜的屋舍已安顿妥当，门外终于不再有追骑的动静。你解下佩剑，才发觉自己仍在留意每一个经过门前的脚步。\n\n吕伯奢一家的血也跟着你到了这里。说客与流言各有一套说法，仿佛只要替你定下善恶，便能把那一夜重新过一遍。你却记得刀落下时，自己并没有他们说的那样从容。\n\n灯火把剑影投在案上。你伸手把剑拨开，唤门外的人进来。有人还肯追随，有人已等着看你如何败亡；这时候停下来向每个人辩白，倒真要遂了他们的心愿。"
 hd_cao_chain.0006.a:0 "宁我负人，毋人负我。"
 hd_cao_chain.0094.t:0 "莱芜整众"
 hd_cao_chain.0094.desc:0 "莱芜城外又添了营帐。宗族与旧部的消息陆续送来，能来相从的各携部曲家资，不能亲至的，也遣人来问军中所缺。几日前还得提防沿途追骑，如今已有人等你发令。\n\n钱粮与丹阳兵的名册送到案前，你逐项看过，压在舆图一角。立足之地既已有了，接下来要做的，便不只是躲过董卓的追索。散在四方的愤懑，总得有人把它变成军令、粮道和肯向前走的队伍。\n\n你命营中重新列伍。天下未定，曹氏不能只做一户暂有栖身之所的逃亡之家。"
 hd_cao_chain.0094.a:0 "以莱芜为基，整军待发。"
 hd_cao_chenliu_danyang_army:0 "莱芜丹阳兵"
