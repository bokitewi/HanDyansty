l_simp_chinese:
 hd_cao_chain.0001.t:0 "伍浮之死"
 hd_cao_chain.0001.desc:0 "伍浮在众目睽睽之下拔刀刺向董卓，却被亲兵当场制服。短暂的喧哗过后，只有一具被处决的尸体留在宫门前。曹操第一次真正看见了权臣的刀锋。"
 hd_cao_chain.0001.a:0 "这不是一场普通的争斗。"
 hd_cao_chain.0002.t:0 "王允宴会"
 hd_cao_chain.0002.desc:0 "王允设宴，满座大臣却只顾掩面哭泣。有人哭到天明，有人哭到夜半，仿佛眼泪便能替他们斩断董卓的权势。"
 hd_cao_chain.0002.a:0 "看他们还能哭多久。"
 hd_cao_chain.0003.t:0 "七星刀"
 hd_cao_chain.0003.desc:0 "王允问你为何发笑。你答道：夜哭到明，明哭到夜，能哭死董卓否？若不能，便该有人动手。王允沉默片刻，将七星刀交到你手中。"
 hd_cao_chain.0003.a:0 "我有一策。"
 hd_cao_chain.0004.t:0 "刺杀董卓"
 hd_cao_chain.0004.desc:0 "你持刀进入董卓的居所。刀锋刚刚出鞘，董卓便从铜镜中看见了寒光；他猛然回身，喝问你的来意。你借口献刀，转身夺马逃出雒阳。"
 hd_cao_chain.0004.a:0 "快马离开这里！"
 hd_cao_chain.0006.t:0 "陈留旧事"
 hd_cao_chain.0006.desc:0 "陈留城门在身后合拢，我才有余暇回想逃亡路上的血迹。中牟县令陈宫曾弃官随我，却因吕伯奢一家之死与我决裂。那一夜已经过去，彼此的仇怨却不会过去。"
 hd_cao_chain.0006.a:0 "旧事不必再提。"
 hd_cao_chain.0094.t:0 "陈留整众"
 hd_cao_chain.0094.desc:0 "陈留既定，夏侯惇率宗族部曲来归，夏侯渊、曹仁、曹洪、曹纯也携家眷投奔。曹氏与夏侯氏各守宗门，却愿同奉一主。旧交又送来六千金，并召集四千丹阳精兵听候差遣。"
 hd_cao_chain.0094.a:0 "宗亲并力，陈留可守。"
 hd_cao_chenliu_danyang_army:0 "陈留丹阳精兵"
