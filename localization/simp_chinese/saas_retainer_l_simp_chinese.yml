l_simp_chinese:
 saas_recruit_talent_edict_modifier: "招贤令"
 saas_recruit_talent_edict_modifier_desc: "此君正广求天下贤士，与同样悬令求贤的诸侯争相延揽。"
 saas_retainer_defense_reform_modifier: "守备整饬"
 saas_retainer_defense_reform_modifier_desc: "门客重订守备名册，整饬武库，操练乡兵，城防为之一新。"

 saas_retainer_patronage_opinion: "受到任用"
 saas_retainer_rejected_opinion: "建议遭拒"
 saas_retainer_project_success_opinion: "才能得到认可"
 saas_retainer_project_failure_opinion: "办事失利"
 saas_retainer_diplomatic_success_opinion: "使者斡旋"

 saas_recruit_talent_decision: "发布招贤令"
 saas_recruit_talent_decision_confirm: "悬令求贤！"
 saas_recruit_talent_decision_desc: "礼崩乐坏，士无定主。若能悬令四方，许以礼遇厚禄，天下怀才不遇之士，或将闻风来投。"
 saas_recruit_talent_decision_tooltip: "广发招贤之令，与天下诸侯争揽四方英才"
 saas_recruit_talent_decision_effect: "招贤之令传檄四方，怀才之士或将择主来投。"
 saas_retainer_project_pending_tt: "#EMP 此事成败，数月之后方见分晓。#!"

 saas_elite_guest_arrived_title: "名士来访"
 saas_elite_guest_arrived_desc: "[saas_elite_guest.GetShortUIName]慕名而来，已在你的宫廷中作客。"
 saas_elite_adventurer_spawned_title: "豪杰自立"
 saas_elite_adventurer_spawned_desc: "[saas_elite_guest.GetShortUIName]在你的领地中现身，却不愿屈居人下，已自聚部众，往四方闯荡去了。"

 saas_retainer.1100.t: "货殖之策"
 saas_retainer.1100.desc: "[retainer.GetShortUIName]呈上一份经营货殖的策书，说只消数月，便能使本钱翻倍。此人言之凿凿，颇有把握；可本钱若是蚀尽，亏空也只能由你承担。"
 saas_retainer.1100.a: "小试其才，略拨些许。"
 saas_retainer.1100.b: "量力拨付，观其成效。"
 saas_retainer.1100.c: "倾囊付之，成则大利。"
 saas_retainer.1100.d: "吾之钱财，另有所用。"
 saas_retainer.1101.t: "货殖之果"
 saas_retainer.1101.desc.success: "[retainer.GetShortUIName]带着一本清清楚楚的账册归来，所获颇丰——这番经营果然使本钱翻了一倍。"
 saas_retainer.1101.desc.failure: "[retainer.GetShortUIName]空手而归。行情与人心都没有照着预想走，投下的钱财再也追不回来了。"
 saas_retainer.1101.desc.invalid: "世事变迁，这桩经营已无从继续，账目与本钱也随之散失。"
 saas_retainer.1101.a: "此真吾所需之才。"
 saas_retainer.1101.b: "权作前车之鉴。"
 saas_retainer.1101.c: "此事已无从追究。"

 saas_retainer.1200.t: "请使邻邦"
 saas_retainer.1200.desc: "[retainer.GetShortUIName]请求出使[neighboring_ruler.GetShortUIName]的宫廷，自称凭三寸之舌与几份薄礼，足以化解两家的隔阂。"
 saas_retainer.1200.a: "备齐使费，遣之前往。"
 saas_retainer.1200.b: "此时不宜遣使。"
 saas_retainer.1201.t: "使者归来"
 saas_retainer.1201.desc.success: "[retainer.GetShortUIName]不辱使命。[neighboring_ruler.GetShortUIName]不但收下了礼物，还对你的诚意深表嘉许。"
 saas_retainer.1201.desc.failure: "[retainer.GetShortUIName]的辞令没能打动[neighboring_ruler.GetShortUIName]，这趟出使空手而回。"
 saas_retainer.1201.desc.invalid: "使团尚未完成使命，局势便已大变，这趟出使只得无功而返。"
 saas_retainer.1201.a: "善！两家由此修好。"
 saas_retainer.1201.b: "未生祸端，已属万幸。"
 saas_retainer.1201.c: "时势如此，非人力可为。"

 saas_retainer.1300.t: "整饬城防"
 saas_retainer.1300.desc: "[retainer.GetShortUIName]巡视过都城，指出武库、城门与征发名册多有废弛，请求由[retainer.GetHerHim]主持一番整顿。"
 saas_retainer.1300.a: "拨付钱粮，即行整顿。"
 saas_retainer.1300.b: "旧制尚堪守御，不必更张。"
 saas_retainer.1301.t: "城防新貌"
 saas_retainer.1301.desc.success: "[retainer.GetShortUIName]完成了整顿。城门戒备森严，武库井然有序，乡里的征发名册也已重新编定。"
 saas_retainer.1301.desc.failure: "整顿处处受阻。[retainer.GetShortUIName]耗尽心力，守备却始终不见起色。"
 saas_retainer.1301.desc.invalid: "局势骤变，原定的守备整顿已无法继续。"
 saas_retainer.1301.a: "都城可安，吾心甚慰。"
 saas_retainer.1301.b: "积弊难除，非一朝之功。"
 saas_retainer.1301.c: "且顾眼前之事。"

 saas_retainer.1400.t: "清查侵吞"
 saas_retainer.1400.desc: "[retainer.GetShortUIName]察觉账目之间有可疑的缺口，怀疑有人侵吞公帑，愿意暗中追查此事。"
 saas_retainer.1400.a: "予以经费，务必查明。"
 saas_retainer.1400.b: "勿使宫中人人自危。"
 saas_retainer.1401.t: "追赃之果"
 saas_retainer.1401.desc.success: "[retainer.GetShortUIName]顺着账目与口供，找到了藏匿的赃款。涉事之人已经伏罪，宫中上下也因此更畏惧你的耳目。"
 saas_retainer.1401.desc.failure: "线索到头来还是断了。[retainer.GetShortUIName]没能追回钱财，这场清查反倒惹得宫中有人心怀怨望。"
 saas_retainer.1401.desc.invalid: "主持清查的人事与局势都已改变，此事只能暂且搁置。"
 saas_retainer.1401.a: "赃款追回，法度亦立。"
 saas_retainer.1401.b: "就此作罢。"
 saas_retainer.1401.c: "旧卷封存，不复再提。"

 saas_retainer.1500.t: "校订典籍"
 saas_retainer.1500.desc: "[retainer.GetShortUIName]说旧典、农书与地方簿册散乱不堪，请求召集书吏逐一校订，使礼制与农政皆有章可循。"
 saas_retainer.1500.a: "拨付经费，从速校订。"
 saas_retainer.1500.b: "眼下尚无此余裕。"
 saas_retainer.1501.t: "新册告成"
 saas_retainer.1501.desc.success: "[retainer.GetShortUIName]将散佚的文书编成了条理分明的新册。官吏据此施政，士民也更明白礼法与农时。"
 saas_retainer.1501.desc.failure: "文书浩繁，又多相互抵牾。[retainer.GetShortUIName]终究没能在期限内编成可用的书册。"
 saas_retainer.1501.desc.invalid: "主事之人或局势已变，校订典籍之事就此中断。"
 saas_retainer.1501.a: "此书足以惠及后世。"
 saas_retainer.1501.b: "残稿且收。"
 saas_retainer.1501.c: "姑且置之。"
