 hd_story_liu_xie_life:0 "刘协本纪"
 hd_story_liu_xie_life_desc:0 "字伯和，汉灵帝中子"
 HD_LIU_XIE_LIFE_STORY_STATUS:0 "刘伯和九岁即位，自此便处在权臣的阴影之下。宫门内外尽是他人的甲士，天子能否重掌朝纲，要看他能否等到时机。"
 hd_story_ma_life:0 "马氏西凉基业"
 hd_story_ma_life_desc:0 "扶风茂陵马氏"
 HD_MA_LIFE_STORY_STATUS:0 "马氏世居扶风茂陵，是伏波将军马援之后。马寿成久在凉州，与羌胡杂处，部众骁勇善骑；西凉的基业，便在这父子手中。"
 hd_story_liu_chong_life:0 "刘宠本纪"
 hd_story_liu_chong_life_desc:0 "汉明帝之后，袭封陈王"
 HD_LIU_CHONG_LIFE_STORY_STATUS:0 "陈王刘宠善射，十发十中，又蓄有强弩数千张。天下大乱，郡县多弃城而走，陈国却因他坐镇，百姓不敢离散，四方来投者甚众。"
