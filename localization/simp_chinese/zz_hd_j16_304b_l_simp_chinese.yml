l_simp_chinese:
 hd_j16.0450.t:0 "成都即帝位"
 hd_j16.0450.desc:0 "你在成都称王已近两年，晋军退守巴郡，蜀中再无敌手。青城山的范长生德高望重，蜀人奉若神明，他也劝你早定尊号。群臣联名上表，请你即皇帝位，国号仍旧称成。"
 hd_j16.0450.a:0 "即皇帝位，请范长生入朝为相。"
 hd_j16.0450.b:0 "根基未稳，仍称成都王。"
 hd_j16.0451.t:0 "罗尚之死"
 hd_j16.0451.desc:0 "晋益州刺史罗尚死在巴郡，蜀中晋军群龙无首。汉中的守将也惶惶不安，有人已派人来成都探问消息。诸将都说，巴郡、汉中唾手可得。"
 hd_j16.0451.a:0 "传檄巴郡、汉中，准备进兵。"
 hd_j16.0451.b:0 "保境安民，暂不东出。"
 hd_j16.0452.t:0 "殡宫之变"
 hd_j16.0452.desc:0 "先帝大行，太子李班整日守在殡宫哭临，不问朝政。李越来找你，说李班不是先帝的亲子，凭什么坐这个位子？宫中禁卫已有一半听你们兄弟号令，只要趁夜动手，大位便是你的。"
 hd_j16.0452.a:0 "与李越举事，夺取大位。"
 hd_j16.0452.b:0 "先帝有遗命，不可负。"
 hd_j16.0453.t:0 "涪城举兵"
 hd_j16.0453.desc:0 "李期猜忌宗室，接连诛杀大臣，下一个就轮到镇守汉中、涪城的你了。部将劝你先下手为强：率兵直入成都，废掉李期，另立国号，把巴蜀从这个暴君手里救出来。"
 hd_j16.0453.a:0 "举兵入成都，废期称帝，改国号为汉。"
 hd_j16.0453.b:0 "君臣名分已定，按兵不动。"
 hd_j16.0500.t:0 "假凉王"
 hd_j16.0500.desc:0 "中原沦陷已久，江东的诏书一年也到不了姑臧一次。河西士民只认张氏，诸将请你称凉王，设置百官，以定人心。只是这样一来，张氏累世守着的晋臣名分便要打折扣了。"
 hd_j16.0500.a:0 "假凉王，置百官。"
 hd_j16.0500.b:0 "仍守晋臣之节。"
 hd_j16.0550.t:0 "总摄三部"
 hd_j16.0550.desc:0 "猗迤、禄官先后去世，拓跋三部各自为政，人心浮动。诸部大人推你出来，统领三部，号令诸部。只是各部首领手里的地盘，要一郡一郡地收回来。"
 hd_j16.0550.a:0 "总摄三部，号令诸部。"
 hd_j16.0550.b:0 "各部自治，不必相强。"
 hd_j16.0551.t:0 "封代公"
 hd_j16.0551.desc:0 "晋并州刺史刘琨被匈奴逼得走投无路，派人来请你出兵相助，并为你向朝廷请封代公，以代郡为封邑。你的骑兵正用得着晋朝的名号，刘琨也正用得着你的骑兵。"
 hd_j16.0551.a:0 "受封代公，与刘琨结盟。"
 hd_j16.0551.b:0 "鲜卑自有其主，不受晋封。"
 hd_j16.0552.t:0 "进爵代王"
 hd_j16.0552.desc:0 "长安的朝廷又派使者来，进你的爵位为代王，准你设置官属。拓跋部从此有了王号，与晋朝诸王平起平坐。"
 hd_j16.0552.a:0 "进爵代王。"
 hd_j16.0552.b:0 "仍称代公。"
 hd_j16.0553.t:0 "贺兰部之兵"
 hd_j16.0553.desc:0 "纥那在位以来，诸部多有怨言。你的舅家贺兰部愿出兵相助，诸部大人也暗中送来书信，只等你回去，就把纥那赶下台。"
 hd_j16.0553.a:0 "借贺兰部之力，逐纥那自立。"
 hd_j16.0553.b:0 "骨肉相残，非我所愿。"
 hd_j16.0554.t:0 "建国"
 hd_j16.0554.desc:0 "翳槐临终，遗命诸部大人迎立你。你从襄国回到代地，诸部在繁畤北迎你即位。群臣请你称代王，改元建国，设置百官，重整拓跋。"
 hd_j16.0554.a:0 "即代王位，改元建国。"
 hd_j16.0554.b:0 "暂不改元。"
 hd_j16.0600.t:0 "段部之争"
 hd_j16.0600.desc:0 "疾陆眷死了，段部的大位落到他叔父涉复辰手里。论能力，论兵马，他哪一样比得上你？跟随你的部众都在说，只要一夜之间袭杀涉复辰和他的子弟，段部就是你的。"
 hd_j16.0600.a:0 "袭杀涉复辰，自立为主。"
 hd_j16.0600.b:0 "奉涉复辰为主。"
 hd_j16.0601.t:0 "辽东之叛"
 hd_j16.0601.desc:0 "父亲去世，兄长慕容皝继位，对你们几个兄弟处处猜忌。慕容昭已经被赐死，下一个会是谁？你镇守辽东多年，平郭的兵马都听你的。不如据辽东自立，与兄长分庭抗礼。"
 hd_j16.0601.a:0 "据辽东自立。"
 hd_j16.0601.b:0 "仍奉兄长为主。"
 hd_j16.0602.t:0 "燕王"
 hd_j16.0602.desc:0 "慕容氏世代镇守辽东，奉晋朝正朔，晋廷却远在江东，鞭长莫及。封奕等人劝你自称燕王，设置百官，以号令诸部。"
 hd_j16.0602.a:0 "即燕王位。"
 hd_j16.0602.b:0 "仍奉晋朝正朔。"
 hd_j16.0603.t:0 "讨宇文部"
 hd_j16.0603.desc:0 "宇文逸豆归屡次侵扰边境，又与后赵勾结。慕容翰早年流亡宇文部，熟知其虚实。诸将都说，此时出兵，可以一举灭掉宇文部。"
 hd_j16.0603.a:0 "亲率大军，讨伐宇文部。"
 hd_j16.0603.b:0 "暂且休兵，不必远征。"
 hd_j16.0604.t:0 "以吐谷浑为氏"
 hd_j16.0604.desc:0 "你的祖父吐谷浑率部西迁，在这片草原上立下基业。你对诸部大人说：祖宗的名号，应当传给子孙。从今以后，子孙以吐谷浑为氏，部众也以吐谷浑为号。"
 hd_j16.0604.a:0 "以吐谷浑为氏。"
