 hd_hi.kebineng.t: "轲比能寇边"
 hd_hi.kebineng.ctx: "檀石槐死后，鲜卑诸部各自为政。小种出身的轲比能赏罚分明，渐渐收拢了漠南诸部，控弦十余万骑。"
 hd_hi.kebineng.rise: "\n\n轲比能聚集诸部骑兵，越过长城，直扑代郡与上谷。边塞烽燧一夜之间尽数燃起。"
 hd_hi.kebineng.wait: "\n\n汉家边郡守备尚严，轲比能不敢轻动，只在塞外收拢流散部众，打磨弓马，等待南下的时机。"
 hd_hi.shujineng.t: "树机能之乱"
 hd_hi.shujineng.ctx: "秦凉一带连年大旱，官府催逼赋役，河西鲜卑与诸羌积怨已深。秃发部的树机能勇武多谋，诸胡多愿听他号令。"
 hd_hi.shujineng.rise: "\n\n树机能斩杀前来镇压的刺史，河西诸胡群起响应，凉州道路断绝。"
 hd_hi.shujineng.wait: "\n\n朝廷在秦凉屯有重兵，树机能隐忍不发，暗中联络诸羌，把仇恨记在刀上。"
 hd_hi.muronghui.t: "慕容廆崛起"
 hd_hi.muronghui.ctx: "慕容部世居辽西，与段部、宇文部争雄。年轻的慕容廆继承部落后，教民农桑，招纳流亡的中原士人，部众日盛。"
 hd_hi.muronghui.rise: "\n\n慕容廆整顿部众，东伐扶余，西抗段、宇文，要把辽西辽东都收入慕容氏的帐下。"
 hd_hi.muronghui.wait: "\n\n辽东诸部势均力敌，慕容廆暂且收敛锋芒，一面安置流民，一面等待对手露出破绽。"
 hd_hi.murongjun.t: "前燕入主中原"
 hd_hi.murongjun.ctx: "中原大乱，冉闵屠胡，诸胡与汉人相互攻杀，河北一片焦土。辽西的慕容氏兵强马壮，正在长城以北观望。"
 hd_hi.murongjun.rise: "\n\n慕容儁兵分三路南下，越过卢龙塞，直取蓟城。燕军铁骑要把整个河北收入囊中。"
 hd_hi.murongjun.wait: "\n\n关内还算安定，慕容儁按兵不动，只在辽西厉兵秣马，静候中原生变。"
 hd_hi.tuobagui.t: "拓跋珪复代建魏"
 hd_hi.tuobagui.ctx: "代国亡后，拓跋氏子孙流落各部。少年拓跋珪寄人篱下，旧部却始终念着拓跋氏的恩义。"
 hd_hi.tuobagui.rise: "\n\n拓跋珪在牛川大会诸部，即代王位，随即改国号为魏。拓跋氏的骑兵再次奔驰在阴山脚下。"
 hd_hi.tuobagui.wait: "\n\n诸部豪帅各怀心思，拓跋珪羽翼未丰，只得藏身于亲族之间，一面结纳旧部，一面等待天时。"
 hd_hi.murongchui.t: "慕容垂复国"
 hd_hi.murongchui.ctx: "慕容垂当年为避祸投奔他国，一身本事无处施展。如今天下动荡，旧燕的遗民还在河北等着慕容氏回来。"
 hd_hi.murongchui.rise: "\n\n慕容垂在荥阳自称燕王，旧部闻风来投，大军北渡黄河，直指邺城。"
 hd_hi.murongchui.wait: "\n\n眼下时局未乱，慕容垂只能隐忍，收拢慕容氏的子弟，等待一个能够一呼百应的时机。"
 hd_hi.yaochang.t: "姚苌建秦"
 hd_hi.yaochang.ctx: "姚氏羌人世居关中，部众数万。姚苌随父兄征战半生，如今兄长俱亡，羌人的命运落在他一人身上。"
 hd_hi.yaochang.rise: "\n\n姚苌逃奔渭北，诸羌推他为盟主，自称大单于、万年秦王，关中再起刀兵。"
 hd_hi.yaochang.wait: "\n\n关中尚有强主坐镇，姚苌暂且低头，把羌人的豪帅一个个拉到自己身边。"
 hd_hi.qifuguoren.t: "乞伏国仁建西秦"
 hd_hi.qifuguoren.ctx: "乞伏部世居陇西，几度依附强邻。乞伏国仁勇略过人，部众都盼他带着乞伏氏自立门户。"
 hd_hi.qifuguoren.rise: "\n\n乞伏国仁召集陇西诸部，自称大都督、大单于，在勇士川筑城立国。"
 hd_hi.qifuguoren.wait: "\n\n陇右的强邻尚在，乞伏国仁只能虚与委蛇，暗中聚集陇西鲜卑。"
 hd_hi.lvguang.t: "吕光回师河西"
 hd_hi.lvguang.ctx: "吕光奉命西征，平定西域三十余国，带着两万骑兵、无数驼马和龟兹的宝货东归。途中传来消息：中原已经大乱。"
 hd_hi.lvguang.rise: "\n\n吕光大军开进玉门关，河西诸郡望风而降。他在姑臧自称凉州牧，河西从此改姓吕。"
 hd_hi.lvguang.wait: "\n\n河西守将尚能自保，吕光的大军只得暂驻敦煌，人困马乏，等待局势变化。"
 hd_hi.tufawugu.t: "秃发乌孤建南凉"
 hd_hi.tufawugu.ctx: "树机能败亡已过百年，秃发部却从未忘记先人的荣光。乌孤务农讲武，招纳贤才，部众日渐强盛。"
 hd_hi.tufawugu.rise: "\n\n秃发乌孤自称西平王，兵锋直指湟水与金城，河西鲜卑再一次举起刀枪。"
 hd_hi.tufawugu.wait: "\n\n凉州尚有强主，乌孤只得称臣纳贡，把野心藏在恭顺的言辞里。"
 hd_hi.juqumengxun.t: "沮渠蒙逊据凉"
 hd_hi.juqumengxun.ctx: "卢水胡沮渠氏世代为部落首领。蒙逊博涉群史，又通天文，部众都说他有雄杰之才。"
 hd_hi.juqumengxun.rise: "\n\n沮渠蒙逊聚众万人，屯据金山，与张掖的豪强合谋起事，河西诸郡震动。"
 hd_hi.juqumengxun.wait: "\n\n河西主人尚强，蒙逊只得假意臣服，暗地里一个个收拢卢水胡的部落。"
 hd_hi.helianbobo.t: "赫连勃勃建夏"
 hd_hi.helianbobo.ctx: "铁弗部被北魏击破时，少年勃勃侥幸逃生，辗转投靠他人。他身长八尺五寸，性情凶悍，从没忘记灭族之仇。"
 hd_hi.helianbobo.rise: "\n\n勃勃袭杀岳父，夺其部众，自称大夏天王。夏军来去如风，岭北诸城朝不保夕。"
 hd_hi.helianbobo.wait: "\n\n塞外诸强环伺，勃勃只能寄人篱下，把仇恨与野心一起压在心底。"
 hd_hi.shelun.t: "社仑称汗"
 hd_hi.shelun.ctx: "柔然部屡被北魏击败，社仑率残部远遁漠北。那里水草丰美，高车诸部散居各处，正是重振部落的好地方。"
 hd_hi.shelun.rise: "\n\n社仑吞并高车诸部，自号丘豆伐可汗，立下军法，千人为军，百人为幢。柔然的骑兵开始南下寇边。"
 hd_hi.shelun.wait: "\n\n南方的强敌兵锋正盛，社仑只能在漠北游牧，收服零散部落，等着南边露出破绽。"
 hd_hi.tande.t: "广开土王拓疆"
 hd_hi.tande.ctx: "高句丽在辽东与百济之间夹缝求存，几代君王都饮恨沙场。年轻的谈德即位，誓要为先王雪耻。"
 hd_hi.tande.rise: "\n\n谈德亲率步骑西渡辽水，又挥师南下，百济诸城接连陷落。高句丽人称他为广开土境平安好太王。"
 hd_hi.tande.wait: "\n\n辽东的强邻尚未衰弱，谈德只得整军经武，等待开疆拓土的良机。"
 hd_hi.balin.t: "六镇之乱"
 hd_hi.balin.ctx: "北边六镇的将士本是国家的爪牙，如今却沦为镇户，饥寒交迫，备受欺凌。沃野镇的破六韩拔陵在军中素有威望。"
 hd_hi.balin.rise: "\n\n拔陵聚众杀死镇将，改元真王。六镇饥民纷纷响应，北边燃起燎原大火。"
 hd_hi.balin.wait: "\n\n镇将尚能弹压，拔陵把怒火压在心底，暗中联络各镇的豪杰。"
 hd_hi.tumen.t: "突厥崛起"
 hd_hi.tumen.ctx: "突厥人世代为柔然锻铁，被称作锻奴。土门部众渐盛，向柔然可汗求婚，却换来一顿辱骂。"
 hd_hi.tumen.rise: "\n\n土门联合高车诸部大破柔然，自号伊利可汗。草原的主人从此换成了突厥。"
 hd_hi.tumen.wait: "\n\n柔然可汗兵势尚盛，土门只得忍辱负重，继续为柔然打铁，暗中收拢部众。"
 hd_hi.muhan.t: "木杆可汗南侵"
 hd_hi.muhan.ctx: "木杆可汗状貌奇异，刚勇多谋，西破嚈哒，东走契丹，北并契骨，威服塞外诸国。南方的两个国家都在争相讨好他。"
 hd_hi.muhan.rise: "\n\n木杆可汗率十万骑南下，与中原兵马合攻晋阳。突厥的铁骑第一次踏上并州的土地。"
 hd_hi.muhan.wait: "\n\n南方兵力尚强，木杆可汗只是坐收两国的岁币，静看他们互相厮杀。"
 hd_hi.shabolue.t: "沙钵略寇边"
 hd_hi.shabolue.ctx: "沙钵略可汗的可贺敦出自中原旧朝，旧朝覆灭，她日夜请求可汗为宗国复仇。"
 hd_hi.shabolue.rise: "\n\n沙钵略可汗与诸可汗合兵四十万，自木峡、石门两道入塞，河西、陇右、代北同时告急。"
 hd_hi.shabolue.wait: "\n\n中原新主根基未稳却兵势正盛，沙钵略只好按兵不动，听凭可贺敦日夜哭诉。"
 hd_hi.liuyu.t: "刘裕起兵京口"
 hd_hi.liuyu.ctx: "刘裕出身寒微，少年时以卖草鞋为生，靠战功在北府军中崭露头角。如今朝中权臣篡逆，天下人都在看谁敢第一个站出来。"
 hd_hi.liuyu.rise: "\n\n刘裕在京口聚集义士，斩杀守将，传檄四方。北府健儿随他渡江西进，一路势如破竹。"
 hd_hi.liuyu.wait: "\n\n朝中权臣根基正稳，刘裕只得隐忍，在北府军中结纳志同道合的兄弟。"
 hd_hi.erzhurong.t: "尔朱荣入洛"
 hd_hi.erzhurong.ctx: "尔朱氏世居秀容川，牛羊驼马漫山遍野。六镇乱起，尔朱荣散尽家财招募义勇，麾下已是北地最精锐的骑兵。"
 hd_hi.erzhurong.rise: "\n\n尔朱荣借口为先帝报仇，挥师南下，渡过黄河，直入洛阳。朝堂上的公卿人人自危。"
 hd_hi.erzhurong.wait: "\n\n洛阳朝廷还能号令四方，尔朱荣只得留在秀容，一面收编流民，一面窥伺朝局。"
 hd_hi.gaohuan.t: "高欢起兵信都"
 hd_hi.gaohuan.ctx: "高欢生长在怀朔镇，深知六镇将士的苦楚。他曾在尔朱氏帐下效力，如今手握二十万六镇降户。"
 hd_hi.gaohuan.rise: "\n\n高欢在信都起兵，与河北豪强结盟，誓要扫除尔朱氏，号令天下。"
 hd_hi.gaohuan.wait: "\n\n尔朱氏兵强马壮，高欢只得表面恭顺，把六镇降户牢牢握在手里。"
 hd_hi.yuwentai.t: "宇文泰据关中"
 hd_hi.yuwentai.ctx: "宇文泰出身武川镇，随军入关后屡立战功。关陇的将士都说他有识量，愿意跟随他。"
 hd_hi.yuwentai.rise: "\n\n宇文泰被诸将推为统帅，挥师东进，据有长安，关中从此自成一国。"
 hd_hi.yuwentai.wait: "\n\n关中主帅尚在，宇文泰只能隐忍不发，把武川的旧友一个个笼络到身边。"
 hd_hi.houjing.t: "侯景之乱"
 hd_hi.houjing.ctx: "侯景右足短，弓马并不出众，却以谋略见长。他辗转投靠南朝，如今屯兵寿阳，却得知自己可能被拿去交换俘虏。"
 hd_hi.houjing.rise: "\n\n侯景以清君侧为名，率八千人渡过长江，围困台城。江南百年的繁华就此化为灰烬。"
 hd_hi.houjing.wait: "\n\n江南朝廷兵力尚厚，侯景只能在寿阳收拢亡命之徒，静待时机。"
 hd_hi.yangjian.t: "杨坚代周"
 hd_hi.yangjian.ctx: "杨坚出身关陇武将世家，相貌奇伟，人称有帝王之相。幼主即位，朝中大权渐渐落到他手里。"
 hd_hi.yangjian.rise: "\n\n杨坚总揽朝政，平定三方叛乱，随即受禅称帝，国号曰隋。他的目光已经投向了长江以南。"
 hd_hi.yangjian.wait: "\n\n朝中宗室尚强，杨坚只能谨小慎微，把关陇的将领一个个拉拢过来。"

 hd_hi.0200.ok: "\n\n你等了很多年。如今四方的守备渐渐松弛，旧部和豪杰一批批找上门来，都在问同一件事：什么时候动手？"
 hd_hi.0200.bad: "\n\n你等了很多年，可眼下对手依旧强大，硬碰只会白白葬送部众。有人劝你舍下眼前的一切，带着心腹远走故地，挂着旧日的名分伺机而动。"
 hd_hi.0200.vassal: "\n\n一旦起事，你与主上的君臣名分便到此为止。"
 hd_hi.0200.a: "时不我待，举兵起事"
 hd_hi.0200.b: "舍地远走，伺机而动"
 hd_hi.0200.c: "暂避锋芒，以待天时"
 hd_hi.0200.d: "安守本分，按兵不动"

 hd_hi.0300.desc: "\n\n[hd_hi_leader.GetFirstNameNoTooltip]近来常与旧部往来。昨夜他来到你面前，请你放他离开，去做他一直想做的事。"
 hd_hi.0300.a: "人各有志，任其自去"
 hd_hi.0300.b: "此人不可放，强留不遣"

 hd_hi.1001.a: "静观其变"
 hd_hi.1001.b: "投身其中"

 hd_hi.1002.desc: "\n\n你治下的土地，已经被他记在了心上。"
 hd_hi.1002.a: "严加戒备"

