l_simp_chinese:
 # 天朝循环·时代特色：紧张期套件（docs/天朝循环_时代特色重制计划.md §3.3）

 # ---------- 决议 ----------
 hd_dc_kit_ten_restoration_decision: "中兴改革"
 hd_dc_kit_ten_restoration_decision_desc: "国势陵夷，人心思变。孤注一掷，整饬朝纲、抑制豪强、充实府库，或可再造中兴；若是不成，只怕加速倾覆。"
 hd_dc_kit_ten_restoration_decision_tooltip: "整饬朝纲，力图再造中兴"
 hd_dc_kit_ten_restoration_decision_confirm: "力图中兴"
 hd_dc_kit_ten_restoration_decision_effect_tt: "此后十年，吏治、豪强、财用诸事将接踵而来。成败系于你的才具、公卿的才干与尊王诸党的声势，眼下约有 #high [ROOT.Char.MakeScope.ScriptValue('hd_dc_kit_ten_restoration_chance_value')|0]%#! 的把握。中兴若成，天下将复归治世；若败，倾覆只在旦夕。"
 hd_dc_kit_ten_if_success_tt: "若中兴有成："
 hd_dc_kit_ten_if_failure_tt: "若功败垂成："
 hd_dc_kit_ten_restoration_once_tt: "你尚未试行过中兴改革"
 hd_dc_kit_ten_restoration_legitimacy_tt: "你的[legitimacy|E]尚未跌至最低一等"
 hd_dc_kit_ten_prohibition_decision: "党锢"
 hd_dc_kit_ten_prohibition_decision_desc: "党人交结，诽讪朝廷。择其一党，或禁锢不得仕进，或一网打尽。"
 hd_dc_kit_ten_prohibition_decision_tooltip: "择一朋党施以党锢"
 hd_dc_kit_ten_prohibition_decision_confirm: "兴党锢之狱"
 hd_dc_kit_ten_prohibition_decision_effect_tt: "择朝中一党，再定宽严：或尽罢其官、禁锢在家，或收其党魁下狱、一网打尽。无论宽严，朝局都将因此大坏。"
 hd_dc_kit_ten_prohibition_party_tt: "朝中有朋党已立党魁"

 # ---------- 修正 ----------
 hd_dc_kit_ten_chaos_consort_modifier: "乱象：外戚专权"
 hd_dc_kit_ten_chaos_consort_modifier_desc: "外戚盘踞要津，政出私门，天子威望日损。外戚一党声势大张，其党魁功名唾手可得。"
 hd_dc_kit_ten_chaos_eunuch_modifier: "乱象：宦官干政"
 hd_dc_kit_ten_chaos_eunuch_modifier_desc: "宦官出入禁中，口含天宪，内外隔绝。宦官一党声势大张，时有侵吞内帑之事，大臣日渐离心。"
 hd_dc_kit_ten_chaos_warlord_modifier: "乱象：权臣藩镇"
 hd_dc_kit_ten_chaos_warlord_modifier_desc: "权臣拥兵，藩镇跋扈，朝廷号令不出京畿。武勋一党声势大张，诸侯竞相扩充部曲。"
 hd_dc_kit_ten_chaos_partisan_modifier: "乱象：党争内耗"
 hd_dc_kit_ten_chaos_partisan_modifier_desc: "朋党交攻，是非蜂起。诸党相仇日深，议事诸臣疲于攻讦，无心政务。"
 hd_dc_kit_ten_warlord_vassal_modifier: "藩镇自重"
 hd_dc_kit_ten_warlord_vassal_modifier_desc: "朝廷倚重地方兵力，诸侯得以扩充部曲。"
 hd_dc_kit_ten_partisan_official_modifier: "党争分心"
 hd_dc_kit_ten_partisan_official_modifier_desc: "党争方炽，此人疲于应付攻讦，无心本职。"
 hd_dc_kit_ten_consort_leader_modifier: "外戚贵盛"
 hd_dc_kit_ten_consort_leader_modifier_desc: "外戚权势熏天，门下趋附者众，功名唾手可得。"
 hd_dc_kit_ten_restoration_success_modifier: "中兴之治"
 hd_dc_kit_ten_restoration_success_modifier_desc: "改革大见成效，纲纪复振，天下翕然称中兴。"
 hd_dc_kit_ten_restoration_failed_modifier: "中兴梦碎"
 hd_dc_kit_ten_restoration_failed_modifier_desc: "改革功败垂成，人心愈加离散。"
 hd_dc_kit_ten_forged_evidence_modifier: "伪造罪证"
 hd_dc_kit_ten_forged_evidence_modifier_desc: "罗织了一批罪证，弹章更有分量，但也更容易被识破。"
 hd_dc_kit_ten_forged_evidence_2_modifier: "再造伪证"
 hd_dc_kit_ten_forged_evidence_2_modifier_desc: "$hd_dc_kit_ten_forged_evidence_modifier_desc$"

 # ---------- 好感 ----------
 hd_dc_kit_ten_impeached_me_opinion: "弹劾过我"
 hd_dc_kit_ten_forged_against_me_opinion: "罗织罪名陷害我"
 hd_dc_kit_ten_forgery_disgrace_opinion: "伪造罪证"
 hd_dc_kit_ten_prohibition_opinion: "党锢禁锢"
 hd_dc_kit_ten_purge_opinion: "党人一网打尽"
 hd_dc_kit_ten_qjc_rebel_opinion: "举兵犯阙"
 hd_dc_kit_ten_qjc_removed_opinion: "以清君侧为名逐我"
 hd_dc_kit_ten_eunuch_meddling_opinion: "宦官干政"
 hd_dc_kit_ten_favor_opinion: "蒙受恩遇"
 hd_dc_kit_ten_slight_opinion: "受到冷落"
 hd_dc_kit_ten_reprimand_opinion: "遭到申斥"

 # ---------- 弹劾（阴谋） ----------
 hd_dc_ten_impeach: "弹劾"
 hd_dc_ten_impeach_action: "弹劾"
 hd_dc_ten_impeach_desc: "我正在搜集[SCHEME.GetTargetCharacter.GetShortUINamePossessive]的罪证，准备上书弹劾"
 hd_dc_ten_impeach_desc_general: "$hd_dc_ten_impeach$[scheme|E]意在搜罗权臣的罪状、上书弹劾，使其罢官下狱。\n\n罪证搜罗得越多，弹章便越有分量。你也可以出钱伪造罪证，但伪证一旦被识破，弹劾必败，你也将身败名裂。"
 HD_DC_TEN_IMPEACH_SUCCESS_DESC: "弹章上达，权臣罢官下狱"
 HD_DC_TEN_IMPEACH_DISCOVERY_DESC: "弹劾之谋已被察觉"
 HD_DC_TEN_IMPEACH_VS_STRONG: "权臣势大"
 HD_DC_TEN_IMPEACH_EMPEROR_DISLIKES: "天子本就不喜此人"
 hd_dc_ten_impeach_invalidated_title: "@scheme_icon!弹劾作罢"
 hd_dc_ten_impeach_invalidated_tt: "对方已失权柄，或你已不在天子朝中，弹劾之事无从说起。"
 hd_dc_ten_start_impeach_interaction: "弹劾#weak （计谋）#!"
 hd_dc_ten_start_impeach_interaction_desc: "搜集[recipient.GetShortUINamePossessive]的罪证上书弹劾。若弹章得准，[recipient.GetSheHe]将被罢官下狱。"
 start_hd_dc_ten_impeach_notification: "弹劾"
 hd_dc_ten_impeach_vip_tt: "只有重要人物（王侯、党魁、宰辅等）才能上书弹劾"

 # ---------- 清君侧 ----------
 hd_dc_ten_qingjunce_interaction: "勒兵入朝·清君侧"
 hd_dc_ten_qingjunce_interaction_desc: "以“清君侧”为名，指[recipient.GetShortUIName]为奸臣，举兵向天子要人。"
 hd_dc_ten_qingjunce_interaction_tt: "你将以“清君侧”为名向天子兴兵：胜则奸臣罢官下狱，你从此为天子终身[regent|E]；败则身陷囹圄。此战只为诛除奸臣，不争城池。"
 hd_dc_ten_qjc_peace_tt: "你没有正与天子交战"
 hd_dc_ten_qingjunce_cb: "清君侧"
 hd_dc_ten_qingjunce_cb_desc: "以诛除奸臣为名，举兵向天子要人。"
 HD_DC_TEN_QJC_CB_NAME: "清君侧"
 HD_DC_TEN_QJC_WAR_NAME: "[ATTACKER.GetShortUIName]清君侧之役"
 HD_DC_TEN_QJC_WAR_NAME_BASE: "清君侧之役"
 hd_dc_ten_qingjunce_cb_victory_desc: "权臣被罢官下狱，[attacker.GetShortUIName]成为天子的终身[regent|E]。"
 hd_dc_ten_qingjunce_cb_white_peace_desc: "双方罢兵，权臣仍在其位。"
 hd_dc_ten_qingjunce_cb_defeat_desc: "[attacker.GetShortUIName]兵败，被天子囚禁。"

 # ---------- 宦官贪墨 ----------
 hd_dc_ten_embezzle_toast: "宦官侵吞内帑"
 hd_dc_ten_embezzle_toast_tt: "宦官借出纳之便，侵吞了一笔内帑。"

 # ---------- 通用提示 ----------
 hd_dc_ten_restoration_chance_up_tt: "中兴之事更多了几分把握"
 hd_dc_ten_restoration_chance_up_small_tt: "中兴之事略添一分把握"
 hd_dc_ten_restoration_chance_down_tt: "中兴之事又难了几分"
 hd_dc_ten_remove_minister_tt: "罢其官职，下狱问罪。"

 # ---------- 中兴改革事件 ----------
 hd_dc_ten.0001.t: "力图中兴"
 hd_dc_ten.0001.desc: "诏书颁下：整饬吏治、抑制豪强、充实府库。满朝文武面面相觑——谁都明白，这是朝廷最后一次自救的机会。"
 hd_dc_ten.0001.a: "成败在此一举。"
 hd_dc_ten.0001.a.tt: "十年之后，成败自见分晓。眼下约有 #high [ROOT.Char.MakeScope.ScriptValue('hd_dc_kit_ten_restoration_chance_value')|0]%#! 的把握。"
 hd_dc_ten.0002.t: "整饬吏治"
 hd_dc_ten.0002.desc: "改革伊始，首在吏治。御史奏报，各地官吏贪墨成风，若不严加整肃，新政无从推行。只是整肃必然得罪一大批人。"
 hd_dc_ten.0002.a: "澄清吏治，不避权贵。"
 hd_dc_ten.0002.b: "循旧例，徐徐图之。"
 hd_dc_ten.0003.t: "豪强阻挠"
 hd_dc_ten.0003.desc: "改革触动了地方豪强的利益。[hd_dc_ten_magnate.GetShortUIName]公然抗拒新政，各地豪右纷纷观望。"
 hd_dc_ten.0003.a: "打击豪强，以儆效尤。"
 hd_dc_ten.0003.b: "暂且妥协，以安其心。"
 hd_dc_ten.0004.t: "财用不足"
 hd_dc_ten.0004.desc: "改革已近尾声，府库却已捉襟见肘。大司农上奏，请筹措钱粮，以竟全功。"
 hd_dc_ten.0004.a: "发内帑以济国用。"
 hd_dc_ten.0004.b: "加征赋税，以济急用。"
 hd_dc_ten.0004.c: "节省用度，勉力支撑。"
 hd_dc_ten.0005.t: "中兴成败"
 hd_dc_ten.0005.desc_success: "十年生聚，十年教训。纲纪复振，府库充盈，豪强敛迹，四方翕然称中兴之主。"
 hd_dc_ten.0005.desc_failure: "十年苦心，终究付诸东流。积弊难返，人心愈散，朝廷再也无力回天。"
 hd_dc_ten.0005.a: "天意如此。"
 hd_dc_ten.0005.a_success: "祖宗有灵，社稷之福。"

 # ---------- 党锢事件 ----------
 hd_dc_ten.0011.t: "党锢"
 hd_dc_ten.0011.desc: "党人交结，诽讪朝廷，已到了不得不处置的地步。该拿哪一党开刀？"
 hd_dc_ten.0011.huanguan: "治宦官之党。"
 hd_dc_ten.0011.waiqi: "治外戚之党。"
 hd_dc_ten.0011.wuxun: "治武勋之党。"
 hd_dc_ten.0011.shizu: "治世族之党。"
 hd_dc_ten.0011.hanmen: "治寒门之党。"
 hd_dc_ten.0011.cancel: "此事容后再议。"
 hd_dc_ten.0012.t: "党锢之狱"
 hd_dc_ten.0012.desc: "[hd_dc_ten_party_leader.GetShortUIName]及其党羽的名单已经呈上。处置宽严，全在一念之间。"
 hd_dc_ten.0012.a: "禁锢其党，不得仕进。"
 hd_dc_ten.0012.a.tt: "[hd_dc_ten_party_leader.GetShortUIName]一党尽数罢官，十年之内禁锢在家，不得复仕；党人无不对你切齿。"
 hd_dc_ten.0012.b: "一网打尽！"
 hd_dc_ten.0012.b.tt: "党魁[hd_dc_ten_party_leader.GetShortUIName]与党中要人尽数下狱，一党势力烟消云散，十年之内不复成党；余党恨你入骨。\n#EMP 党中手握兵马之人或将以“清君侧”为名起兵。#!"
 hd_dc_ten.0013.t: "党人之托"
 hd_dc_ten.0013.desc: "党人被一网打尽的消息传来，幸免者纷纷投奔，推你为首，请以“清君侧”为名，诛除[hd_dc_ten_pm_pick.GetShortUIName]。"
 hd_dc_ten.0013.a: "举兵清君侧！"
 hd_dc_ten.0013.b: "隐忍不发。"

 # ---------- 弹劾事件 ----------
 hd_dc_ten.0021.t: "罪证渐备"
 hd_dc_ten.0021.desc: "你案头弹劾[hd_dc_ten_impeach_target_preview.GetShortUIName]的罪证又添了一份。是即刻上书，还是再等些时日？若嫌证据单薄，也有人愿意替你“补齐”——只要价钱合适。"
 hd_dc_ten.0021.a: "上书弹劾！"
 hd_dc_ten.0021.a.tt: "弹章一上，便由天子定夺；罪证越足，越易得准。若得准奏，[hd_dc_ten_impeach_target_preview.GetShortUIName]将罢官下狱，你也声名大振："
 hd_dc_ten.0021.b: "重金购求伪证。"
 hd_dc_ten.0021.b.tt: "#EMP 伪证一旦被识破，弹劾必败，你也将身败名裂。#!"
 hd_dc_ten.0021.c: "再搜罗些时日。"
 hd_dc_ten.0022.t: "弹章之后"
 hd_dc_ten.0022.desc_success: "弹章上达，龙颜震怒。[hd_dc_ten_impeach_target.GetShortUIName]被罢去官职，下狱问罪。"
 hd_dc_ten.0022.desc_forged: "弹章所列罪证经有司覆按，竟有多处破绽。伪造之事败露，弹劾不了了之，你反倒成了众矢之的。"
 hd_dc_ten.0022.desc_failure: "弹章递上去便石沉大海。[hd_dc_ten_impeach_target.GetShortUIName]依然安坐其位，而且已经知道是谁在背后发难。"
 hd_dc_ten.0022.a: "且看后事。"
 hd_dc_ten.0023.t: "遭到弹劾"
 hd_dc_ten.0023.desc_success: "[hd_dc_ten_impeach_owner.GetShortUIName]上书弹劾，天子准奏。你被罢去官职，投入狱中。"
 hd_dc_ten.0023.desc_forged: "[hd_dc_ten_impeach_owner.GetShortUIName]上书弹劾你，所列罪证却是伪造的，已被有司识破。"
 hd_dc_ten.0023.desc_failure: "[hd_dc_ten_impeach_owner.GetShortUIName]上书弹劾你，幸而天子没有准奏。"
 hd_dc_ten.0023.a: "此仇必报。"

 # ---------- 乱象更替 ----------
 hd_dc_ten.0041.t: "乱象"
 hd_dc_ten.0041.desc_consort: "外戚势力已压倒朝中诸党，政出私门。#high 外戚专权#!之势已成。"
 hd_dc_ten.0041.desc_eunuch: "宦官出入禁中，内外隔绝，朝臣难得一见天颜。#high 宦官干政#!之势已成。"
 hd_dc_ten.0041.desc_warlord: "武臣手握重兵，诸侯各拥部曲，朝廷号令日益不行。#high 权臣藩镇#!之势已成。"
 hd_dc_ten.0041.desc_partisan: "朝中诸党势均力敌，相互攻讦，政事因此荒废。#high 党争内耗#!之势已成。"
 hd_dc_ten.0041.a: "时势如此，奈何。"

 # ---------- 废立 ----------
 hd_dc_ten.0051.t: "废立"
 hd_dc_ten.0051.desc: "谋划多时，终于得手。[target.GetShortUIName]被废黜囚禁，大位易主。"
 hd_dc_ten.0051.desc_huangdi: "宫门紧闭，甲士环列。百官噤若寒蝉，眼看着[target.GetShortUIName]被废黜囚禁。天子竟可由臣下废立——这个天下，已经不是原来的天下了。"
 hd_dc_ten.0051.a: "天命在我。"

 # ---------- 外戚专权 ----------
 hd_dc_ten.0101.t: "外戚封侯"
 hd_dc_ten.0101.desc: "[hd_dc_ten_waiqi_leader.GetShortUIName]上表，请为诸弟子侄封侯。满朝侧目，却无人敢言。"
 hd_dc_ten.0101.a: "准其所请。"
 hd_dc_ten.0101.b: "高祖之约：非有功不得侯。"
 hd_dc_ten.0102.t: "太后临朝"
 hd_dc_ten.0102.desc: "[hd_dc_ten_dowager.GetShortUIName]又一次越过你，径自召见大臣、批答奏章。朝臣们已经习惯先请示后宫，再来禀报天子。"
 hd_dc_ten.0102.a: "依从懿旨。"
 hd_dc_ten.0102.b: "朕当亲揽朝政。"
 hd_dc_ten.0103.t: "外戚废立"
 hd_dc_ten.0103.desc: "密报：[hd_dc_ten_waiqi_leader.GetShortUIName]在府中召集心腹，议论另立新君。此事若真，大祸近在眼前。"
 hd_dc_ten.0103.a: "先发制人！"
 hd_dc_ten.0103.b: "厚加赏赐，以安其心。"
 hd_dc_ten.0103.c: "隐忍不发。"

 # ---------- 宦官干政 ----------
 hd_dc_ten.0111.t: "十常侍"
 hd_dc_ten.0111.desc: "[hd_dc_ten_eunuch_leader.GetShortUIName]等宦官把持禁中，奏章须经其手方能上达，诏令也多由其口出。外朝大臣怨声载道。"
 hd_dc_ten.0111.a: "此辈忠心，宠信如故。"
 hd_dc_ten.0111.b: "诏令外朝共议政事。"
 hd_dc_ten.0112.t: "宦官监军"
 hd_dc_ten.0112.desc: "[hd_dc_ten_eunuch_leader.GetShortUIName]奏请派遣内臣监军，说是替天子看住手握重兵的将帅。将帅们闻讯，颇为不满。"
 hd_dc_ten.0112.a: "准奏。"
 hd_dc_ten.0112.b: "军中不可掣肘。"
 hd_dc_ten.0113.t: "宦官矫诏"
 hd_dc_ten.0113.desc: "有大臣密奏：近日所颁数道诏书，并非出自圣意，而是[hd_dc_ten_eunuch_leader.GetShortUIName]一伙假托君命。"
 hd_dc_ten.0113.a: "严惩不贷！"
 hd_dc_ten.0113.b: "不了了之。"

 # ---------- 权臣藩镇 ----------
 hd_dc_ten.0121.t: "边镇拥兵"
 hd_dc_ten.0121.desc: "[hd_dc_ten_strong_vassal.GetShortUIName]坐拥重兵，近来又大肆招募部曲，朝廷的诏令在其辖境已形同具文。"
 hd_dc_ten.0121.a: "厚加赏赉，以示笼络。"
 hd_dc_ten.0121.b: "下诏切责。"
 hd_dc_ten.0122.t: "请世其官"
 hd_dc_ten.0122.desc: "[hd_dc_ten_strong_vassal.GetShortUIName]上表，请准其子弟世袭其职，并自行任免辖下官吏。"
 hd_dc_ten.0122.a: "姑息为上。"
 hd_dc_ten.0122.b: "断然拒绝。"
 hd_dc_ten.0123.t: "权臣专横"
 hd_dc_ten.0123.desc: "[hd_dc_ten_wuxun_leader.GetShortUIName]恃功骄横，入朝不趋，奏事不名，俨然以天子自居。"
 hd_dc_ten.0123.a: "削其兵权，罢其官职！"
 hd_dc_ten.0123.b: "隐忍。"

 # ---------- 党争内耗 ----------
 hd_dc_ten.0131.t: "朋党互讦"
 hd_dc_ten.0131.desc: "[hd_dc_ten_la.GetShortUIName]与[hd_dc_ten_lb.GetShortUIName]在朝堂上相互攻讦，各自门下的奏章雪片般飞来，都要天子主持公道。"
 hd_dc_ten.0131.a: "袒护[hd_dc_ten_la.GetShortUIName]。"
 hd_dc_ten.0131.b: "袒护[hd_dc_ten_lb.GetShortUIName]。"
 hd_dc_ten.0131.c: "各责其过，两不偏袒。"
 hd_dc_ten.0132.t: "选举不实"
 hd_dc_ten.0132.desc: "今岁察举，所举孝廉、茂才多是权门子弟，寒素之士怨声载道。太学诸生聚众上书，指郡守受世家请托。此事已闹得满城风雨。"
 hd_dc_ten.0132.a: "严查到底。"
 hd_dc_ten.0132.b: "压下此案。"
 hd_dc_ten.0133.t: "党人评按"
 hd_dc_ten.0133.desc: "清流士人私下品评公卿，月旦一出，被评为“浊流”者便仕途黯淡。朝臣们对此又敬又怕。"
 hd_dc_ten.0133.a: "清议自有公论，采其评按。"
 hd_dc_ten.0133.b: "禁止私议。"
