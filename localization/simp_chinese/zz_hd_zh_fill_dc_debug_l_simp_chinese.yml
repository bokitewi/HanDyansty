 hd_dc_debug.fields.help_stress:0 "\n 已记录的人格压力净增量：[scope:hd_dc_debug_record.Var('hd_dc_personality_stress_actual').GetValue|2]"
 hd_dc_debug.fields.node:0 "\n 节点编号：[scope:hd_dc_debug_record.Var('hd_dc_node').GetValue|0]"
 hd_dc_debug.fields.par_choice:0 "\nPAR-01 所选行动：[scope:hd_dc_debug_record.Var('hd_dc_par01_action').GetFlagKey]"
 hd_dc_debug.fields.pay_parties:0 "\n 实际付款方：[scope:hd_dc_debug_record.Var('hd_dc_payer').Char.GetShortUIName]\n 实际收款方：[scope:hd_dc_debug_record.Var('hd_dc_payee').Char.GetShortUIName]"
 hd_dc_debug.fields.petitioner:0 "\n请愿人：[scope:hd_dc_debug_record.Var('hd_dc_petitioner').Char.GetShortUIName]"
 hd_dc_debug.fields.proposal:0 "\n 提案当前状态：[scope:hd_dc_debug_record.Var('hd_dc_proposal_state').GetFlagKey]"
 hd_dc_debug.fields.protection_signature:0 "\n 盟约真正签署人的保护者：[scope:hd_dc_debug_record.Var('hd_dc_protection_signature').Char.GetShortUIName]"
 hd_dc_debug.fields.ransom:0 "\n亲属：[scope:hd_dc_debug_record.Var('hd_dc_prisoner').Char.GetShortUIName]\n俘虏：[scope:hd_dc_debug_record.Var('hd_dc_captor').Char.GetShortUIName]"
 hd_dc_debug.fields.roy_choice:0 "\nROY-01 所选行动：[scope:hd_dc_debug_record.Var('hd_dc_roy01_action').GetFlagKey]"
 hd_dc_debug.fields.support:0 "\nROY-08 实际答复：[scope:hd_dc_debug_record.Var('hd_dc_support_answer').GetFlagKey]"
 hd_dc_debug.fields.to_signature:0 "\n 接收方的实际签名：[scope:hd_dc_debug_record.Var('hd_dc_to_signature').Char.GetShortUIName]"
 hd_dc_debug.fields.trait:0 "\n特质抽取来源：[scope:hd_dc_debug_record.Var('hd_dc_trait_source').GetFlagKey]\n基础几率：[scope:hd_dc_debug_record.Var('hd_dc_trait_base_chance').GetValue|2]%\n倍率：[scope:hd_dc_debug_record.Var('hd_dc_trait_multiplier').GetValue|2]\n实际几率：[scope:hd_dc_debug_record.Var('hd_dc_trait_actual_chance').GetValue|2]%\n实际结果：[scope:hd_dc_debug_record.Var('hd_dc_trait_result').GetFlagKey]"
 hd_dc_debug.fields.trial_first:0 "\n第一郡的实际审查结果：[scope:hd_dc_debug_record.Var('hd_dc_audit_first_result').GetFlagKey]"
 hd_dc_debug.fields.trial_second:0 "\n第二郡的实际审查结果：[scope:hd_dc_debug_record.Var('hd_dc_audit_second_result').GetFlagKey]"
 hd_dc_debug.history_unavailable:0 "\n#N 史录警告：至少一次W/H写入期间没有在场的留存记录人员；该区域只保留最后一次写入的详情。本提示不表示补充记录已成功。#!"
 hd_dc_debug.impact_detail:0 "[SCOPE.GetFlagName('hd_dc_debug_impact')]"
 hd_dc_debug.impacts:0 "二十类危险的世界影响及检查入口"
 hd_dc_debug.impacts.desc:0 "按编号查看实际连接点与验证方法。只列出现存可验证的入口为可执行项；接口未封闭的项目必须明确注明缺口，独立的随机事件不能替代原版发生率。"
 hd_dc_debug.latest:0 "返回最新回执"
 hd_dc_debug.native_delta:0 "本次原版增量的实际读数"
 hd_dc_debug.native_delta.desc:0 "执行前：[SCOPE.GetValue('hd_dc_debug_before_amount')|2]\n 执行后：[SCOPE.GetValue('hd_dc_debug_after_amount')|2]\n 本次净变化：[SCOPE.GetValue('hd_dc_debug_actual_delta')|2]\n\n 数值读取自同一效果链，已包括原版修正及范围限制。本页显示的是上一次操作的观测值；它并非记为自然来源，也不能证明所有来源的最终增量拦截均已关闭。"
 hd_dc_debug.native_scene:0 "真实情景与原版增量检查"
 hd_dc_debug.native_scene.desc:0 "本页显示具体对象。点击将实际改变新的世界；返回菜单并不能撤销此操作。原版增量与特质抽取可检查当前档位；手动准备秘密或瘟疫并不代表自然发生的抽样，也不意味着二十种界面类型已全部完成。"
 hd_dc_debug.native_scene.drunkard:0 "进行一次合法的嗜酒特质抽取（基础10%）"
 hd_dc_debug.native_scene.drunkard.tt:0 "调用正式的饮酒抽样界面，依据当前F转换一次；未抽中也是有效结果。一旦授予某人嗜酒，便不能再次获得；基础概率、倍率、实际概率及授予结果均保留在账目中。并非所有负面特质的入口都有证据覆盖。"
 hd_dc_debug.native_scene.legitimacy_gain:0 "实际提交+10 正统性，并读取前后数值"
 hd_dc_debug.native_scene.legitimacy_loss:0 "实际提交-10 正统性，并读取前后数值"
 hd_dc_debug.native_scene.no_drunkard:0 "\n无法执行饮酒抽样：未通过原版 can_be_drunkard 检查。成年状态、已有嗜酒特质、互斥条件及信仰要求仍由原系统检查；不允许重复授予。"
 hd_dc_debug.native_scene.no_legitimacy:0 "\n无法执行正统性提升：当前人物缺乏内在的正统性机制。不会为了伪造资格而修改政体。"
 hd_dc_debug.native_scene.no_outbreak_county:0 "\n 没有可用于准备此组合的地区或郡：要求附庸持有郡，领主在世且自由，当前没有现存瘟疫，也没有使用中的系统审查或税收减免；所选强度下的原版基础值、倍率及近期瘟疫因素必须允许发生。此外，仍保留麻疹/痢疾/圣火病的DLC锁定、圣火病同病冷却、黑死病的禁用/单次已发生/正在流行/历史地理限制。当新手教学或初始宽限期导致基础值为零时，日期不变；肺结核/麻疹的地方性加成仍按原版顺序读取。"
 hd_dc_debug.native_scene.no_secret_target:0 "\n秘密情景缺少对象：你的宫廷中没有在世、成年、自由且能被原版勒索秘密检查功能选中的人物。须先招募合格的廷臣；本页不会将现有筹码冒充为秘密。"
 hd_dc_debug.native_scene.outbreak:0 "选择七种瘟疫与三种强度"
 hd_dc_debug.native_scene.outbreak.tt:0 "复用原版省份的 create_epidemic_outbreak 实际创建上述灾害类型与强度。点击时会再次检查同名郡。不修改自然发生率或额外抽样，也不向郡中添加虚构的疫情修正。发生后将读取真实疫情；传播、感染与死亡由原版系统处理。"
 hd_dc_debug.native_scene.outbreak_county:0 "\n所选疫情拟定爆发的真实州郡：[scope:hd_dc_debug_outbreak_county.GetName]，位于该郡所属州的州治所在地。"
 hd_dc_debug.native_scene.outbreak_created:0 "已在[scope:hd_dc_debug_outbreak_county.GetName]读取到真实疫情。刚才的请求为[SCOPE.GetFlagName('hd_dc_debug_epidemic_name')]/[SCOPE.GetFlagName('hd_dc_debug_epidemic_intensity')]；请在疫情地图上核实实际类型、强度与传播情况。其他疫情的自然合并仍由引擎处理；在郡中读取到感染，并不能证明不会合并。\n\n 若需要PAR双郡对比，请另行准备一个没有疫情的合格郡，然后进入情景准备菜单。系统不会自动填写应对措施、支付赈济款项，也不会跳过12个月的审查期。"
 hd_dc_debug.native_scene.outbreak_unconfirmed:0 "原版疫情效果已提交至[scope:hd_dc_debug_outbreak_county.GetName]的州治，但当前效果链尚未检测到受感染的州。疫情不能报告为已确认，也不会为此添加郡级的修正以冒充。请在原版疫情更新后，核对地图与实际受灾资格，再准备PAR情景。"
 hd_dc_debug.native_scene.secret:0 "为指定的宫廷官员准备一个真实可用于勒索的秘密。"
 hd_dc_debug.native_scene.secret.tt:0 "依据该人物原本的资格为其生成真实秘密，并告知你。不会颁发证据、扣除金钱，也不会代该人物接受任何索求。之后右键点击该人物，通过正式的勒索互动提出请求。"
 hd_dc_debug.native_scene.secret_created:0 "秘密生成已执行，并已获得原版秘密对象；目前只有你知晓此事，针对对象为[scope:hd_dc_debug_secret_target.GetShortUIName]。\n秘密内容：[scope:new_secret.Custom('SecretDescriptionThirdPerson')]\n\n请查看秘密面板，然后右键点击此人以提出勒索要求。互动仍会检查秘密是否暴露、能否勒索、现有筹码以及待答复状态；只有对方的正式回复才决定结果。"
 hd_dc_debug.native_scene.secret_failed:0 "未获得原版秘密对象，因此不能报告生成成功。请检查目标当前的资格及日志。本页不支持重新分配对象引用或替换结果。"
 hd_dc_debug.native_scene.secret_target:0 "\n拟添加为真实秘密的人物：[scope:hd_dc_debug_secret_target.GetShortUIName]。秘密的类型由原版根据此人的信仰、现有特质及秘密资格来选定。"
 hd_dc_debug.neg01:0 "NEG-01 刺杀企图"
 hd_dc_debug.neg01.desc:0 "发起刺杀的基础概率已依据危险率换算，保留动态基础概率与原版目标资格。F为1/1.15/1.40/1.80/2.30；“群雄割据”中的固定倍率另行合并，最高为3。\n\n 请使用真实目标的刺杀互动检查来核实实际阴谋；玩家的手动点击不代表AI自动发生的概率样本。本菜单不会以另一个随机池替代原版抽样。"
 hd_dc_debug.neg02:0 "NEG-02 发起绑架"
 hd_dc_debug.neg02.desc:0 "绑架的原版发起者保留能力、合法目标及谋略条件；F为1/1.15/1.40/1.80/2.30。不具备绑架能力者仍无法执行。\n\n 真实谋略情景页面将搜索并显示指定的合法目标；发起前请再次核验原版资格，然后发起真实的绑架谋略。之后的行动与结果由谋略流程处理；手动发起一次不代表AI的自然发生率样本。"
 hd_dc_debug.neg03:0 "NEG-03 勒索提案"
 hd_dc_debug.neg03.desc:0 "勒索入口保留真实秘密、知情方及原版动态基础值，F为1/1.15/1.40/1.80/2.30。正式提出勒索请求后，仍取决于对方的实际答复。\n\n 真实情景页面允许为指定的合格宫廷官员添加一个新的原版秘密，并告知你；然后右键点击此人，正式提出勒索请求。准备操作明确发生在当下，不会编造过去的罪行；不颁发直接证据，手动提案也不计为AI概率样本。"
 hd_dc_debug.neg04:0 "NEG-04 盗取国库"
 hd_dc_debug.neg04.desc:0 "暂时不可用：根据本次更新的确认，被侵占的国库的四个原版入口仍然关闭。年度AI检测与动态概率、五年冷却、五个原版探子名额及取款记账均保留；检测时将报告原版入口已关闭，不会强行生成阴谋。\n\n 各阶段及终局的取款、实际扣除、实收金额与待结算差额，依据真实账目条目继续处理，并允许原版固定取款造成透支。现有崩溃数据无法证明旧有访问冲突的根本原因；被侵占的国库是否可玩，仍未经验证。"
 hd_dc_debug.neg05:0 "NEG-05 民众起义"
 hd_dc_debug.neg05.desc:0 "民众派系的合法性由P读取，共分五档，设为1/1.10/1.25/1.50/1.80。成立时采用新批准的规则：保留原版自动创建；当W≥20时，每个政体每年以10%为基础再抽取一次额外机会，经P换算，在实际合法的类型中平均选择，最多创建一个。\n\n 民众类型沿用真实郡的原版创建资格；不替代原版最终创建概率。年度检查页面显示实际记录，情景页面允许准备真实派系，但不会直接发动或获胜于起义。"
 hd_dc_debug.neg06:0 "NEG-06 农民起义"
 hd_dc_debug.neg06.desc:0 "农民派系的合法起义读取P，共分五档，设为1/1.10/1.25/1.50/1.80。普通农民类型现在享有额外的年度成立机会：W≥20时，以10%为基础，经P换算，与其他合法类型共享每个政体每年一个的上限；原版创建保持不变。\n\n 升级为农民派系仍遵循原版起义升级流程进行创建，保留真实领袖与郡的转移。额外机会不会虚构前提起义、军队或胜利。"
 hd_dc_debug.neg07:0 "NEG-07 派系创建"
 hd_dc_debug.neg07.desc:0 "使用修改后的设置，创建一次经批准的额外年度机会：保留原版自动创建，当W≥20时，每个政体每年以10%为基础，经P换算；成功后，在实际合法的类型中等权重选择一个，最多创建一个，失败时不重新抽取。候选数量不会增加类型权重。\n\n 分别核验普通人物、郡的起义与真实主张人的原版创建资格；排除同类型已有派系；已关闭的日本机制在现有条件下继续排除，而升级的农民则保留其原版升级流程。本条目不表示读取或替换引擎的最终创建概率。可进入年度检查页面查看实际抽样与创建结果。"
 hd_dc_debug.neg08:0 "NEG-08 派系起义"
 hd_dc_debug.neg08.desc:0 "原版派系的起义入口已动态关联至P中每种类型的基础值；五档为1/1.10/1.25/1.50/1.80。现有派系仍须满足其实力、不满度及其他前提；0与100两个端点保持原意。\n\n 真实派系页面可向指定的未暂停主张派系添加实际不满度，并重放净变化，同时显示原版派系当前能否起义；必须从原版派系界面发出，调试不会跳过首次起义的内部状态。ROY-08D暂停的保护仍然有效。"
 hd_dc_debug.neg09:0 "NEG-09 压力增加"
 hd_dc_debug.neg09.desc:0 "已整合原版修正：人物压力增加的档位设为0 / +10% / +20% / +35% / +50%。适用于参与系统范围内事件的人物；档位在每月观察时初始化并刷新，离开该范围后移除；与其他压力修正的叠加及实际变化由原版规则处理。\n\n 请先记录人物当前压力，然后使用下方操作提交基础+10压力增加，并将操作前后的实际压力读数与当前修正进行比较。"
 hd_dc_debug.neg10:0 "正统性提升"
 hd_dc_debug.neg10.desc:0 "已应用原版修正：人物正统性提升分五档，分别为0 / -10% / -20% / -35% / -50%。适用于参与系统范围内情境的人物；与其他正统性修正的叠加及实际增长由原版规则处理。\n\n 切换到W档并刷新，以查看人物修正；先记录当前正统性数值，再完成确实能提升正统性的行动，比较前后读数。"
 hd_dc_debug.neg11:0 "正统性损失"
 hd_dc_debug.neg11.desc:0 "已整合原版修正：人物正统性损失档位为0 / +10% / +25% / +50% / +80%。适用于系统范围内的人物；与其他正统性修正的叠加及实际损失由原版规则处理。\n\n 记录人物当前正统性；完成降低正统性的行动后，将比较前后读数；切换档位会替换此系统修正，离开该范围即移除。"
 hd_dc_debug.neg12:0 "NEG-12 疫病爆发"
 hd_dc_debug.neg12.desc:0 "原版七种疫病类型现已为每种强度提供有效入口，五档为1/1.05/1.10/1.15/1.20。\n\n 真实情景页面允许依次选择七种灾害类型、三种强度，并确认指定的郡；复用原版发生效果并重新读取感染数据。DLC、同种疾病冷却、原版基础规则及黑死病规定仍然有效；若历史黑死病无法在当前地图上找到其发生地点，则会明确阻止。21个菜单组合并不代表在任何规则集下都有效的21种情景，手动创建也不能证明自然D概率或引擎传播。"
 hd_dc_debug.neg13:0 "NEG-13 自然灾害"
 hd_dc_debug.neg13.desc:0 "已恢复真实的地震与洪水灾害入口，并沿用中国、黄河及长江现有的地理映射。调试页面复用正式的郡资格与事件生成接口；发展度保持最低2级，排除同一郡内的地震及同一流域内的洪水，不伪造灾害条件。\n\n 在手动情景中，真实灾害会被明确建立；其后的应对仍按原版条件运行。自然D倍率、季节及运行时回调须另行检查——手动触发一次不能验证自然概率。"
 hd_dc_debug.neg14:0 "NEG-14 负面特质机会"
 hd_dc_debug.neg14.desc:0 "此固定检查涵盖14类：嗜酒者、大麻使用者、放荡者、隐士、易怒者、挥霍者、慈善家、忏悔者、暴食者、厌食者、自虐者，以及非遗传的抑郁、疯狂与附身。包括已核实的人物属性、获取F值的自然随机机会、真实资格的保留、互斥性、动态分母与单次抽样；生成新人物、确定性选择及100%结果的条件保持原样。\n\n 饮酒、教育、宴会、灵感、决斗及宾客特质由实际事件情境处理。真实情景页面允许检查合格的饮酒抽样及概率记录；当压力与冷却符合条件时，可发起完整的压力事件。未能从合格机会中抽到特质属于正常结果。"
 hd_dc_debug.neg15:0 "NEG-15 控制力储备"
 hd_dc_debug.neg15.desc:0 "控制力以本周期首次进入危机时的实际值为基准，累计扣除0/5/10/15/20%。只补充超过已处理最高档位的差额；反复刷新、更换领主、先降后升回到之前档位，均不产生重复扣除。只有低档稳定状态持续60个月后，损失期才结束。\n\n 记录首都郡的控制力，按20→80→40→80的模式调整W并反复刷新，核实已处理及已扣除的总额。档位降低时，损失不予退还。"
 hd_dc_debug.neg16:0 "发展度储备"
 hd_dc_debug.neg16.desc:0 "发展进度以本周期的实际基准累计扣除0/2/4/6/8%；取整之后，只补偿新增的差额。正常发展仍然保留；领主更换时不进行结算，每月反复刷新也不会叠加扣除。\n\n 与控制力档位一并检查；当发展度基准较低时，取整可能导致没有新增损失。"
 hd_dc_debug.neg17:0 "NEG-17 家族关系"
 hd_dc_debug.neg17.desc:0 "婚姻纠纷、既有敌对支系、宴会、儿童聚会、比武破坏、巫术聚会，以及领主关系的混合池，均已纳入当前的调和池。读取实际的亲属或配偶关系；F值为1/1.15/1.40/1.80/2.30。若某一对同时符合亲属与旧怨的资格，则只应用一次。保留人物特质、契合度、子女资格及真实后果。\n\n 混合池保留原版的死亡与伤害分支，仅在普通结果可以分配的条件关系概率上进行调整；端点概率仍保持0%或100%。家族纠纷情景可以发起完整的 adultery.0001 猜疑链，保留实际目标及五年冷却。"
 hd_dc_debug.neg18:0 "NEG-18 敌对事件"
 hd_dc_debug.neg18.desc:0 "本次调和的关系概率来源已整合进16个位置，包括既有仇敌、宴会与儿童纠纷，以及新增的武艺比试、巫术聚会与 yearly.4001 非死亡条件池。核实实际旧怨与负面好感后，使用F，同一抽样实例内不重复放大。只有涉及死亡、伤害或必然结仇的分流路径，才保留原版的伤亡概率及100%端点条件\n\n。在真正的敌对情景中，可通过完整入口 yearly.1010 发起绑架亲友等事件，保留各方资格及年代标记；后果可能包括死亡。ORD-19 还设有单独的合作程序，分别由青年与担保人作答。"
 hd_dc_debug.neg19:0 "NEG-19 家族凝聚力丧失"
 hd_dc_debug.neg19.desc:0 "已经整合：在当前加载的脚本中，家族凝聚力的负向或正负可变写入采用1/1.10/1.25/1.50/1.80；固定的正向增量不予放大。保留原有人物归属、原版描述与范围处理。没有真实凝聚力机制的政体不适用于\n\n。合格的家族可提交基础-10凝聚力（如下），五档分别检查，并记录家族变化；本次测试不会改变政体以伪造凝聚力机制。"
 hd_dc_debug.neg20:0 "NEG-20 民心"
 hd_dc_debug.neg20.desc:0 "当前地区的郡与民众舆论采用单一来源，共五档：0/−5/−10/−15/−20。切换档位时先移除旧档位，再添加新档位；离开适用地区即清除该来源。\n\n 可反复刷新以核实同一档位不叠加；人物好感不属于此郡级舆论。"
 hd_dc_debug.next:0 "下一组影响"
 hd_dc_debug.older:0 "查看上一份回执"
 hd_dc_debug.par01:0 "PAR-01：发起双方的政策询问"
 hd_dc_debug.par01.tt:0 "你必须是在位皇帝，该地区须无人占领，且派系纷争不能处于冷却中；两个真实派系各须至少有3名活跃成员，实力占比各不低于20%，并且其领袖须彼此敌对；此外，须存在受真实瘟疫或灾害影响、且可施行治理的附庸郡。首先询问两位派系领袖；只有当其实际答复相反时，才会建立主要事件，不代替任何人填写政策。"
 hd_dc_debug.prepare_ord09:0 "准备 ORD-09：真正的亲缘关系与俘虏交换"
 hd_dc_debug.prepare_ord09.tt:0 "在该地区另选一位符合条件的在位统治者担任俘获者，生成你一名18岁的子女及该人一名18岁的子女；前者将被对方扣押，后者由你扣押。你获得300金。扣押、亲属关系与人物均为真实；关闭菜单不会撤销此操作。之后，你仍须提出请求，并获得俘获者的真实回应。"
 hd_dc_debug.prepare_ord13:0 "准备 ORD-13：低控制郡、压力与亲属"
 hd_dc_debug.prepare_ord13.tt:0 "选择一名现有的成年自由直属附庸，并将其对某郡的控制力设为40；生成一名35岁的亲属或朋友加入你的宫廷并建立友谊，获得300金，并使压力至少增加200，可能触发原版压力事件。现任掌玺者将在五年内对你好感+100；若尚未任命任何大臣，你须亲自任命一人。"
 hd_dc_debug.prepare_par:0 "准备 PAR-01：两个真实派系与受灾郡的比较"
 hd_dc_debug.prepare_par.tt:0 "须已存在两个原版派系，其成员数量、官职与实际影响力均合格；另有两个真实遭受灾害且有资格治理的附庸郡。两派领袖将互相获得为期五年的-200好感；第二郡当前的发展度与控制力将调整至与第一郡一致，并使你获得300金及为期五年的+16管理。不会产生疫情，也不会伪造派系成员人数或替换政策应对。之后，实际的政策分歧将通过正式询问产生。"
 hd_dc_debug.prepare_roy:0 "准备 ROY-01：激化两名现有宗亲的不满。"
 hd_dc_debug.prepare_roy.tt:0 "只能选择两名已拥有封地、属于皇室血脉并满足原版派系许可的成年自由宗亲。每人获得为期五年的对皇帝-200好感及300金；你获得300金。不会创建人物，不改变宗族，不重新分配封地，也不虚构过去的罪行。若可选人选不足两人，则无法进行准备。之后，须从正统事件菜单正式登记。"
 hd_dc_debug.prepare_support:0 "准备 ROY-08：资金与真实的人际筹码"
 hd_dc_debug.prepare_support.tt:0 "从最新的候选宗室名单中，选择一位能依法向你发出邀请的真实候选人。你与所选候选人各获得300金；若你允许建立筹码，将获得针对该候选人的个人筹码。筹码必须在实际的D选项中使用；不要过早暂停，也不要自动签署保护誓约。"
 hd_dc_debug.protection.actor:0 "\n记录的实际执行者：[scope:hd_dc_debug_record.Var('hd_dc_protection_harm_actor').Char.GetShortUIName]"
 hd_dc_debug.protection.execute:0 "\n记录死亡回调；是否属于实际处决，须在死亡后经正式观察判定。"
 hd_dc_debug.protection.illegal:0 "\n 事前依据：已核实无合法依据；只有实际执行后，违约才会被处理。"
 hd_dc_debug.protection.imprison:0 "\n 执行的操作：扣押。"
 hd_dc_debug.protection.legal:0 "\n 事前理由：已获得合法依据；此行动不构成违约。"
 hd_dc_debug.protection.revoke:0 "\n 执行的操作：冻结头衔转移。"
 hd_dc_debug.protection.title:0 "\n实际被转移出去的冻结头衔：[scope:hd_dc_debug_record.Var('hd_dc_protection_harm_title').Title.GetName]"
 hd_dc_debug.protection.unknown:0 "\n 事前依据：未知。不能推定其合法或非法，也不应因此发放履行义务的完成奖励。"
 hd_dc_debug.protection.unknown_actor:0 "\n原版回调未提供可核实的实际执行者，不会猜测头衔承受者或其他人物为指挥者。"
 hd_dc_debug.receipt.audit_pending:0 "\n存在实际处罚记录，但尚无法对照事前合法依据核验；待核验，不得记为已依约完成。你可以翻到对应的具名受保护对象记录，查看实际执行者与行动。"
 hd_dc_debug.receipt.closed:0 "\n此普通节点已关闭；付款与未付记录仍保留在登记簿中。"
 hd_dc_debug.receipt.desc:0 "地区回执编号：[scope:hd_dc_debug_record.Var('hd_dc_record_id').GetValue|0]\n 记录版本：[scope:hd_dc_debug_record.Var('hd_dc_record_version').GetValue|0]\n 记录类型标识：[scope:hd_dc_debug_record.Var('hd_dc_record_kind').GetFlagKey]\n\n 本页读取并保留原始记录。翻页不会扣除费用、要求补签、推进日期或结算账目。未出现的条目表示此记录缺少相应字段，并不代表已经履行。"
 hd_dc_debug.receipt.empty:0 "当前分页范围内没有匹配的记录。你可以返回最新回执；通过自然或手动正式程序建立的记录，将保留在地区登记簿中。"
 hd_dc_debug.receipt.instance:0 "\n主要实例：治理Q [scope:hd_dc_debug_record.Var('hd_dc_q').GetValue|0]，强度X [scope:hd_dc_debug_record.Var('hd_dc_x').GetValue|0]，未了结义务 [scope:hd_dc_debug_record.Var('hd_dc_open_obligations').GetValue|0]。"
 hd_dc_debug.receipt.letters:0 "\n 本记录属于ORD-19。双方先须在三个月内各自完成接受，随后实际支付30金，方可进入另一个为期三个月的指定通信期；W−2的结算仅在双方实际答复均已完成时发生。"
 hd_dc_debug.receipt.pause:0 "\n 已实际消耗筹码；动员暂停自[scope:hd_dc_debug_record.Var('hd_dc_pause_date_year').GetValue|0]/[scope:hd_dc_debug_record.Var('hd_dc_pause_date_month').GetValue|0]/[scope:hd_dc_debug_record.Var('hd_dc_pause_date_day').GetValue|0]开始。届时请重新核验原派系与人物；已发生的战争不予取消。"
 hd_dc_debug.receipt.payment:0 "\n 应付款：[scope:hd_dc_debug_record.Var('hd_dc_amount_due').GetValue|2]\n 实际扣除：[scope:hd_dc_debug_record.Var('hd_dc_actual_debit').GetValue|2]\n 实际收到：[scope:hd_dc_debug_record.Var('hd_dc_actual_credit').GetValue|2]\n 付款与政治答复分别记录；全额收讫并不表示所有非金钱义务均已履行。"
 hd_dc_debug.receipt.points:0 "\n点数序号：[scope:hd_dc_debug_record.Var('hd_dc_point_sequence').GetValue|0]\n来源标识：[scope:hd_dc_debug_record.Var('hd_dc_point_source').GetFlagKey]\n日期：[scope:hd_dc_debug_record.Var('hd_dc_point_date_year').GetValue|0]年[scope:hd_dc_debug_record.Var('hd_dc_point_date_month').GetValue|0]月[scope:hd_dc_debug_record.Var('hd_dc_point_date_day').GetValue|0]日\nW 请求/实际：[scope:hd_dc_debug_record.Var('hd_dc_w_requested').GetValue|0]/[scope:hd_dc_debug_record.Var('hd_dc_w_committed').GetValue|0]\nH 请求/实际：[scope:hd_dc_debug_record.Var('hd_dc_h_requested').GetValue|0]/[scope:hd_dc_debug_record.Var('hd_dc_h_committed').GetValue|0]\n写入后 W/H：[scope:hd_dc_debug_record.Var('hd_dc_w_after').GetValue|0]/[scope:hd_dc_debug_record.Var('hd_dc_h_after').GetValue|0]\n。以上为内部点数，每20点对应界面上的1点。此序号不参与每月义务处理。"
 hd_dc_debug.receipt.protection:0 "指定保护于\n在[scope:hd_dc_debug_record.Var('hd_dc_protection_date_year').GetValue|0]:[scope:hd_dc_debug_record.Var('hd_dc_protection_date_month').GetValue|0]:[scope:hd_dc_debug_record.Var('hd_dc_protection_date_day').GetValue|0]订立，期限为五年。受保护者包括订立时的对方及当时仍在世的近亲；头衔自订立之日起冻结，之后出生的人或之后取得头衔的人不会被自动纳入。"
 hd_dc_debug.receipt.protection_wait:0 "前一个五年保护期仍然有效。日期随游戏推进，本菜单不会缩短期限。\n"
 hd_dc_debug.receipt.refund:0 "\n 尚未退还的累计扣除：[scope:hd_dc_debug_record.Var('hd_dc_unreturned_debit').GetValue|2]。关闭事件并不会清除此余额。"
 hd_dc_debug.receipt.subject:0 "订立时冻结的受保护目标：\n。受保护回执所属者：[scope:hd_dc_debug_record.Var('hd_dc_protected_person').Char.GetShortUIName]。回执编号：\n。所有者：[scope:hd_dc_debug_record.Var('hd_dc_protection_contract').Var('hd_dc_record_id').GetValue|0]。"
 hd_dc_debug.receipt.trial:0 "\n第一地方当局实际收取资金的日期为[scope:hd_dc_debug_record.Var('hd_dc_audit_first_date_year').GetValue|0]年[scope:hd_dc_debug_record.Var('hd_dc_audit_first_date_month').GetValue|0]月[scope:hd_dc_debug_record.Var('hd_dc_audit_first_date_day').GetValue|0]日。对照审查，各郡分别追踪12个月；一方失效并不代表另一方已履行义务，期满后仍须等待双方领袖对账。"
 hd_dc_debug.refresh_stocks:0 "执行正式的郡级影响刷新"
 hd_dc_debug.refresh_stocks.tt:0 "实际刷新该地区的控制力、发展度及民心来源。首次升档将扣除既有储备的损失；重复调用时，须保持相同的已处理最高档位。"
 hd_dc_debug.region:0 "地区、时代与进入限制"
 hd_dc_debug.region.chaos:0 "\n当前时代为群雄割据、各据州郡的局面。"
 hd_dc_debug.region.desc:0 "核心郡数量：[scope:hd_dc_debug_region.Var('hd_dc_total_counties').GetValue|0]\n 实际控制的郡数量：[scope:hd_dc_debug_region.Var('hd_dc_controlled_counties').GetValue|0]\n 实际控制率：[scope:hd_dc_debug_region.Var('hd_dc_control_percent').GetValue|1]%\n\n 霸权仅在12个月无霸权、或24个月实际控制率低于50%后结束，此时官方裁定进入群雄时代；恢复至65%并稳定60个月后退出。进贡不计为实际控制。W/H调整不会直接切换时代。\n 以下仅列出当前生效的限制："
 hd_dc_debug.region.invalid:0 "地区\n的快照无效；请先进行正式观察，核实世界中的实际领土。"
 hd_dc_debug.region.locked:0 "地区\n的主要危机位已被实际实例占用，不能被覆盖。"
 hd_dc_debug.region.no_affected_county:0 "\nPAR-01 缺少真实的、可治理的受灾郡：须列入地区登记簿，存在真实的疫情或灾害，为天子属下附庸郡，领主在世且自由，并且当前未被现行审查措施或税收减免占用。可先通过真实情景页面准备疫情或灾害，再重新检查。"
 hd_dc_debug.region.no_parties:0 "\n PAR-01 缺少两个真实合格的派系：每个派系须至少有3名活跃成员、一位有效的成年自由派系领袖，成员须与本年度的实际实力快照相符，且各派系实力须占至少20%。两人互为仇敌不能替代一个组织。"
 hd_dc_debug.region.no_roy_instance:0 "\nROY-08 缺少正式的王室实例。须先合法确立ROY-01，形成真实的候选派系，然后才能切换到能够加入该派系的受邀人物。"
 hd_dc_debug.region.no_royals:0 "\nROY-01 缺少候选人：通过正式宗室候选人审查的真实人物不足两人。他们须健在、成年、自由，属于同一血脉并拥有封地，且获其原版派系许可；准备菜单只能强化现有合格宗亲，不会创建新的封地或宗族。"
 hd_dc_debug.region.not_emperor:0 "\nROY-01/PAR-01 资格不符：你不是现任皇帝。发起前请切换到实际的皇帝；持有者不会被替换。"
 hd_dc_debug.region.ordinary_wait:0 "\n你有一个待处理的普通事件，无法开启另一个普通节点。"
 hd_dc_debug.region.outside:0 "\n你不在朝代循环的参与者之列；人物增量与普通节点不能将地区之外的人物视为合格人物。"
 hd_dc_debug.region.par_cooldown:0 "\n50年的派系纷争冷却尚未结束。"
 hd_dc_debug.region.party_wait:0 "双方的政策询问仍在进行，等待正式答复。\n"
 hd_dc_debug.region.prepared:0 "\n的政治实体尚未建立，不能再次创建。"
 hd_dc_debug.region.roy_cooldown:0 "\n皇族类型的50年冷却尚未结束。"
 hd_dc_debug.relation_scene:0 "进入真实的家族纠纷或敌对事件"
 hd_dc_debug.relation_scene.desc:0 "只有通过完整的原版入口进入，原版事件才能选择实际对象并进行后续应对。此处不构建随机池，也不会强行设定私通、旧怨、绑架成功或关系结果。前提满足后，事件中指定的人物及每项选择都会真正改变世界。"
 hd_dc_debug.relation_scene.family:0 "发起一条合格的原版伴侣猜疑链。"
 hd_dc_debug.relation_scene.family.tt:0 "调用事件 adultery.0001；原版事件选项将选出真实伴侣，并对被猜疑者施加现有的五年限制，然后询问你是否直接对质。只有对方否认指控时，才会进入真正的猜疑分支；你不能替对方选择否认。若秘密属实为假，则由原版剧情处理，不会虚构不忠。"
 hd_dc_debug.relation_scene.no_family:0 "\n 家族纠纷前提不足：你须在该地区内，符合原版的年度人物资格，且不能是轻信之人；至少有一名身体健全的成年真实配偶未近期被猜疑，并且你须有猜忌之心，或你的原版伴侣须具有滥交/诱惑者特质，或显示出真实不忠的迹象；信仰不允许不受惩罚的通奸。原来的5年目标冷却不会被清除。"
 hd_dc_debug.relation_scene.no_rival:0 "\n敌对事件前提不足：不得存在原版的10年标记；须有成年、可操作的AI仇敌，该仇敌须拥有领地或是其领主的继承人，且该领主须存在并非你本人；你的宫廷中须有成年、可操作的AI配偶/亲属/情妇，且不是你的仇敌；此外，还须有可操作、未重伤的AI军事指挥官，或实际的猎营官职。"
 hd_dc_debug.relation_scene.rival:0 "发起一条合格的原版仇敌绑架家族链。"
 hd_dc_debug.relation_scene.rival.tt:0 "调用 yearly.1010，从原版事件中选出实际的仇敌、你宫廷中的亲友及追捕者。此链可能导致真实的监禁、伤害、死亡、付款或关系变化；这不是绑架阴谋发起率的测试。保留原版的10年发生限制；不替代亲友是否自愿离开或营救结果。"
 hd_dc_debug.result.breached:0 "\n已记录实际发生、无合法依据的侵害，且属于受保护的违约。"
 hd_dc_debug.result.expired:0 "\n的答复期限已经届满。"
 hd_dc_debug.result.fulfilled:0 "\n五年保护期已按照约定期满结束。"
 hd_dc_debug.result.guarantor_letter:0 "\n已收到担保人签署的回复。"
 hd_dc_debug.result.invalidated:0 "相关方、权力、地点或其他实际前提已失效；未发放完成奖励。\n"
 hd_dc_debug.result.ordinary_code:0 "\n普通节点实际结案标记：[scope:hd_dc_debug_record.Var('hd_dc_ordinary_result').GetFlagKey]"
 hd_dc_debug.result.par_code:0 "\n政策节点实际结案标记：[scope:hd_dc_debug_record.Var('hd_dc_par01_result').GetFlagKey]"
 hd_dc_debug.result.partial:0 "\n已部分履行或尚有账目未清；请继续核对付款与地方记录。"
 hd_dc_debug.result.pause_code:0 "\n动员暂停实际结案标志：[scope:hd_dc_debug_record.Var('hd_dc_pause_result').GetFlagKey]"
 hd_dc_debug.result.protection_code:0 "\n指定保护实际结案标记：[scope:hd_dc_debug_record.Var('hd_dc_protection_result').GetFlagKey]"
 hd_dc_debug.result.rejected:0 "地方或派系领袖拒绝；不视为全部履行。\n"
 hd_dc_debug.result.released:0 "\n已核实实际放还亲属。"
 hd_dc_debug.result.roy_code:0 "\n宫廷礼仪令实际结案标记：[scope:hd_dc_debug_record.Var('hd_dc_roy01_result').GetFlagKey]"
 hd_dc_debug.result.verified:0 "\n两位具名派系领袖均已完成实际结算；当前政策节点已按协议结清。"
 hd_dc_debug.result.writing:0 "\n双方均已接受并付款，现等待指定通信。"
 hd_dc_debug.result.youth_letter:0 "\n已收到青年签署的回复。"
 hd_dc_debug.results:0 "将当前实例与实际回执核对"
 hd_dc_debug.roy01:0 "ROY-01：发起礼制秩序之争"
 hd_dc_debug.roy01.tt:0 "你须为在位天子，拥有有效的地区快照，至少两名合格的原版宗室候选人，皇室类型不在冷却中，且该地区没有当前或待定的实例占用。正式成立后将产生真实的主张与派系，并启动50年的类型冷却。"
 hd_dc_debug.roy08:0 "ROY-08：请以我宗亲的合格邀请，邀我入局。"
 hd_dc_debug.roy08.tt:0 "需要存在近期的王朝实例，以及拥有活跃主张的现行有效派系。你须为有资格加入该派系的合格受邀者；你不能是皇帝、候选人本人、已加入者，或与任一方处于冲突中的一方。任何一对人物不得有待定邀请、既有加入记录或重试冷却。处于暂停状态的派系不能招募成员。"
 hd_dc_debug.scheme_scene:0 "准备真实的谋杀或绑架阴谋"
 hd_dc_debug.scheme_scene.abduct:0 "对指定目标发动真实的绑架阴谋"
 hd_dc_debug.scheme_scene.abduct_target:0 "\n拟定绑架目标：[scope:hd_dc_debug_abduct_target.GetShortUIName]。"
 hd_dc_debug.scheme_scene.desc:0 "从王朝循环的实际参与者中，选择一名原版上具备 can_start_scheme 资格的指定AI目标。点击即发起阴谋；成功率、阶段、同谋与结果仍由原版阴谋系统决定。它不会直接杀死或囚禁任何人，也不计为AI发起的危险率抽样。请在阴谋面板查看真实阴谋。"
 hd_dc_debug.scheme_scene.murder:0 "对指定目标发起真实的谋杀密谋"
 hd_dc_debug.scheme_scene.murder_target:0 "\n计划刺杀的目标：[scope:hd_dc_debug_murder_target.GetShortUIName]。"
 hd_dc_debug.scheme_scene.no_abduct:0 "\n 没有原版合法的绑架目标：行动者须拥有绑架者技能，其阵营已解锁，或持有相关的争夺许可；目标须为成年、自由且可操作的统治者。目标不能被囚禁或作为人质；须有实际所在地与外交范围。仍会检查儿童限制、丧失行为能力及原版冷却/配额。不会为了取得资格而添加技能。"
 hd_dc_debug.scheme_scene.no_murder:0 "\n没有原版合法的谋杀目标：核实人物资格、密谋名额、针对同一人的现有阴谋、冷却期、外交范围及亲缘限制。只选择当前在该地区内存活的AI人物；目标不得掌握对你的强力筹码；现有密谋不会被清除。"
 hd_dc_debug.test_native_breakdown:0 "发起一个合格的原版压力事件"
 hd_dc_debug.test_native_breakdown.tt:0 "需要当前的压力水平及相应的原版冷却余额。一天后重新核验资格，然后由原版压力事件选择实际内容；特质不会被强行授予。"
 hd_dc_debug.test_stress:0 "实际提交基础+10压力"
 hd_dc_debug.test_stress.tt:0 "此举将增加真实压力，并可能达到原版压力事件的阈值。其他原版修正仍参与计算。"
 hd_dc_debug.test_unity:0 "实际提交基础-10家族凝聚力"
 hd_dc_debug.test_unity.tt:0 "须位于朝代循环区域内，存在真实家族，且当前政体拥有内在凝聚力机制。家族凝聚力的实际减少每个当前P仅施加一次；不会自动退还。"
 hd_dc_debug.unity_change:0 "朝代循环调试：实际凝聚力损失"
