l_simp_chinese:
 hd_dc_debug.counties:0 "查看首都郡的实际影响账目。"
 hd_dc_debug.counties.desc:0 "当前查看[scope:hd_dc_debug_county.GetName]。本页面不影响控制力、发展度、民心或政策。若缺少损失周期字段，则缺失的记录不会被视为已扣除。"
 hd_dc_debug.counties.loss:0 "\n 控制力基准：[scope:hd_dc_debug_county.Var('hd_dc_control_baseline').GetValue|2]\n 发展度基准：[scope:hd_dc_debug_county.Var('hd_dc_development_baseline').GetValue|0]\n 已处理的最高档位：[scope:hd_dc_debug_county.Var('hd_dc_highest_loss_band').GetValue|0]\n 累计已扣除控制力：[scope:hd_dc_debug_county.Var('hd_dc_control_paid').GetValue|2]\n 累计已扣除发展度：[scope:hd_dc_debug_county.Var('hd_dc_development_paid').GetValue|0]"
 hd_dc_debug.counties.policy:0 "\n本郡目前正在接受官方制度政策的审查，不能再次被占领。"
 hd_dc_debug.counties.recovery:0 "\n 本周期目前处于低档恢复观察期，尚未连续满足60个月的要求。"
 hd_dc_debug.details:0 "查看本回执的内容"
 hd_dc_debug.details.desc:0 "以下列表仅包含本记录中已经发生或已登记的结果。空白条目并不代表成功；没有对应结果的条目可能仍在等待中，或不属于本记录。"
 hd_dc_debug.disaster_scene:0 "准备真实的地震或洪水灾害情景"
 hd_dc_debug.disaster_scene.created:0 "正式入口已返回实际灾害情况，并已按灾害类型回读。请查看地图和灾害界面，选择实际的应对措施。PAR准备仍需要受灾的附庸郡，且该郡须能实施治理，同时须存在两个真实的派系——灾害不能替代这些条件。"
 hd_dc_debug.disaster_scene.desc:0 "下方明确显示受灾郡。选择后，将调用官方原生灾害发生入口，建立真实的灾害情景及后续应对措施。灾害会在场景中直接发生，不等待自然的维护抽取；此操作不会改变已过去的日期、现有政治实体、诏令、应对结果或审查期。此操作不是自然的D率抽样。"
 hd_dc_debug.disaster_scene.earthquake:0 "在指定郡引发地震"
 hd_dc_debug.disaster_scene.earthquake_target:0 "\n地震目标：[scope:hd_dc_debug_earthquake_county.GetName]。"
 hd_dc_debug.disaster_scene.flood:0 "在指定郡所在的实际流域引发真实洪水。"
 hd_dc_debug.disaster_scene.flood_target:0 "\n洪水灾害目标：[scope:hd_dc_debug_flood_county.GetName]。"
 hd_dc_debug.disaster_scene.no_earthquake:0 "\n地震缺少合格的郡：必须在朝代循环的郡名单之内，实际已开发至少2级，位于中国本土地理范围之内，且当前没有进行中的地震。"
 hd_dc_debug.disaster_scene.no_flood:0 "\n洪水灾害缺少合格的郡：必须在朝代循环的郡名单之内，实际已开发至少2级，位于全球洪水区域内，并且是已初始化的真实黄河或长江河段，当前没有进行中的洪水灾害。不会以修正郡来替代河流。"
 hd_dc_debug.disaster_scene.unconfirmed:0 "正式入口无法确认实际灾害情况，因此不能报告灾害发生成功。请检查目标地理、发展状况、现有灾害、初始化情况及日志。本菜单不会写入损失修正，也不会伪造应对失败。"
 hd_dc_debug.epidemic.active_block:0 "\n#N 本地黑死病正在流行；无法再创建毁灭性瘟疫。#!"
 hd_dc_debug.epidemic.apocalyptic:0 "毁灭性"
 hd_dc_debug.epidemic.bubonic_plague:0 "鼠疫"
 hd_dc_debug.epidemic.confirm:0 "确认疫情的实际爆发。"
 hd_dc_debug.epidemic.confirm.desc:0 "灾害类型：[SCOPE.GetFlagName('hd_dc_debug_epidemic_name')]\n 强度：[SCOPE.GetFlagName('hd_dc_debug_epidemic_intensity')]\n\n 本页已按所选组合检查了真实的地区郡。只有点击下方“确认”，疫情才会真正产生，并可能扩散，使人物染病或死亡。手动情景不抽取自然D概率，也不会修改已有疫情、DLC、规则、已过去的日期或政治义务。"
 hd_dc_debug.epidemic.consumption:0 "肺结核"
 hd_dc_debug.epidemic.create:0 "确认：在指定郡中创建所选疫情。"
 hd_dc_debug.epidemic.dlc_block:0 "\n#N 该灾害类型需要原版《死者传奇》功能授权，目前未满足。按钮不会绕过DLC锁定。#!"
 hd_dc_debug.epidemic.dysentery:0 "痢疾"
 hd_dc_debug.epidemic.ergotism:0 "圣火病"
 hd_dc_debug.epidemic.historical_block:0 "\n#N 该组合受实际地图约束所阻：当前加载的自定义地图中没有历史黑死病爆发地点的分支。因此，依据历史事件规则，无法准备毁灭性鼻疽瘟疫；也不会临时更改规则或绕过1346年的地理限制。#!"
 hd_dc_debug.epidemic.intensity:0 "选择真实疫情强度"
 hd_dc_debug.epidemic.intensity.desc:0 "所选灾害：[SCOPE.GetFlagName('hd_dc_debug_epidemic_name')]。三个选项\n\n对应原版的轻微、严重和毁灭性。毁灭性鼻疽瘟疫属于黑死病，保留其独立规则、实际发生状况及当前地图的地理限制；并非所有规则组合都能找到合法发生的郡。"
 hd_dc_debug.epidemic.major:0 "严重"
 hd_dc_debug.epidemic.measles:0 "麻疹"
 hd_dc_debug.epidemic.menu:0 "选择真实疫病灾害类型"
 hd_dc_debug.epidemic.menu.desc:0 "选定灾害类型后，还须选择其强度，并在指定郡的执行页面确认。前两步只选择参数，不会触发疫情爆发。原版七种瘟疫各有三种强度入口；DLC、规则、黑死病及类似疾病仍会根据实际情况阻止其激活。"
 hd_dc_debug.epidemic.minor:0 "轻微"
 hd_dc_debug.epidemic.never_block:0 "\n#N 当前规则禁止黑死病；无法创建鼠疫起源的毁灭性瘟疫。#!"
 hd_dc_debug.epidemic.once_block:0 "\n#N 当前规则只允许黑死病发生一次，且发生标记已经存在，因此不会清除该记录后重新创建。#!"
 hd_dc_debug.epidemic.smallpox:0 "天花"
 hd_dc_debug.epidemic.typhus:0 "斑疹伤寒"
 hd_dc_debug.faction_scene:0 "真实派系创建与最后通牒"
 hd_dc_debug.faction_scene.demand:0 "准备发动起义：实际派系不满度 +25"
 hd_dc_debug.faction_scene.demand.tt:0 "真正将派系的不满度提高25，并同时读取变化前后的数值；不增加军事力量，也不改变成立日期。不直接调用最后通牒回调，也不添加自建的“已发送”标记。完成准备后，在本页重新检查资格，然后切换到原版派系界面中的领袖，正式发起进攻。"
 hd_dc_debug.faction_scene.demand_target:0 "\n，将实际向你发出最后通牒的领袖：[scope:hd_dc_debug_demand_leader.GetShortUIName]。"
 hd_dc_debug.faction_scene.desc:0 "“创建”按钮复用原版的 can_create_faction 函数；只有当人物、领主、政体及派系资格的所有条件均满足时，派系才会真正成立。NEG-05至07保留原版创建方式；当W≥20时，每个政体每年额外有10%的机会（经P换算），最多额外创建一个派系；实际抽样记录可在年度检查页面查看。最终的最后通牒仍需满足原版对实力、不满度与日期的要求。"
 hd_dc_debug.faction_scene.independence:0 "针对当前领主，实际创建一个独立派系。"
 hd_dc_debug.faction_scene.liberty:0 "针对当前领主，实际创建一个自由派系。"
 hd_dc_debug.faction_scene.liege:0 "\n派系创建的实际目标为：[ROOT.Char.GetLiege.GetShortUIName]。"
 hd_dc_debug.faction_scene.no_demand:0 "\n当前没有可准备的索取派系：必须确实针对你、领袖/候选人/目标头衔仍然存在、没有进行中的战争，且不处于ROY-08暂停状态。请先通过ROY-01合法成立；本菜单不会创建领袖、主张或头衔。"
 hd_dc_debug.faction_scene.no_peasant:0 "本区域内没有农民郡通过原版 can_title_create_faction 检查：不满足实际郡、目标及现有组织的约束条件。请查看原版派系界面；直接宣战不能替代派系创建。"
 hd_dc_debug.faction_scene.no_populist:0 "本区域内没有民众郡通过原版 can_title_create_faction 检查：它们须满足原版的政体、信仰/文化、成员及现有组织约束，并需要真实的郡与目标；不能通过改变宗教或文化、或取消既有起义来达到条件。"
 hd_dc_debug.faction_scene.not_ready:0 "\n 原版当前叛乱检查未通过。可以实际提高不满度，但实力、日期等资格仍须在现实中满足；仅提高不满度并不构成成功的叛乱。"
 hd_dc_debug.faction_scene.peasant:0 "从指定的合格郡实际创建一个农民派系。"
 hd_dc_debug.faction_scene.peasant_county:0 "\n合格的农民建立郡：[scope:hd_dc_debug_peasant_county.GetName]。实际针对你。"
 hd_dc_debug.faction_scene.populist:0 "从已实际成立的指定合格郡创建一个民众派系。"
 hd_dc_debug.faction_scene.populist_county:0 "\n合格的民众建立郡：[scope:hd_dc_debug_populist_county.GetName]。实际针对你。"
 hd_dc_debug.faction_scene.ready:0 "\n 原版当前叛乱检查：已通过。请切换到上方指定的领袖，使用派系界面中的正式最后通牒按钮，或等待原版AI自行选择。调试不会直接发出最后通牒事件，以保留引擎的初始叛乱状态。"
 hd_dc_debug.fields.actor:0 "\n记录行为人：[scope:hd_dc_debug_record.Var('hd_dc_actor').Char.GetShortUIName]"
 hd_dc_debug.fields.audit_first:0 "\n第一方的实际答复：[scope:hd_dc_debug_record.Var('hd_dc_audit_first_answer').GetFlagKey]"
 hd_dc_debug.fields.audit_second:0 "\n第二方的实际答复：[scope:hd_dc_debug_record.Var('hd_dc_audit_second_answer').GetFlagKey]"
 hd_dc_debug.fields.cooperation:0 "\nORD-19 青年：[scope:hd_dc_debug_record.Var('hd_dc_visitor').Char.GetShortUIName]\n 担保人：[scope:hd_dc_debug_record.Var('hd_dc_guarantor').Char.GetShortUIName]"
 hd_dc_debug.fields.disaster:0 "\n真实灾害关联编号：[scope:hd_dc_debug_record.Var('hd_dc_disaster_identity').GetValue|0]\n灾害类型：[scope:hd_dc_debug_record.Var('hd_dc_disaster_type').GetFlagKey]\n本条目的实际阶段：[scope:hd_dc_debug_record.Var('hd_dc_disaster_stage').GetFlagKey]\n发生与恢复记录代表同一灾害的不同真实序号；恢复记录并不表示你已完成任何政治审查。"
 hd_dc_debug.fields.disaster_county:0 "\n实际灾害中心：[scope:hd_dc_debug_record.Var('hd_dc_disaster_epicenter').Title.GetName]"
 hd_dc_debug.fields.exchange:0 "俘虏的交换也已通过正式程序核实并放还。\n"
