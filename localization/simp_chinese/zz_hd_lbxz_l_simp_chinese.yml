l_simp_chinese:
 hd_lbxz.0100.t:0 "穷鸟入怀"
 hd_lbxz.0100.desc:0 "兖州一败，营中能战之士已折了大半。陈宫劝你往东走：徐州新换了主人，刘玄德素以仁厚闻名，又与曹操有隙，未必不肯收容一支无处落脚的兵马。\n\n你并不喜欢向人低头，可营中粮秣只够再撑一个月。去徐州，至少能有一座城、一片田，让弟兄们喘一口气。"
 hd_lbxz.0100.a:0 "且往徐州，投刘玄德。"
 hd_lbxz.0100.b:0 "吕奉先岂肯寄人篱下！"
 hd_lbxz.0101.t:0 "吕布来投"
 hd_lbxz.0101.desc:0 "使者递上吕布的书信，言辞恭谨，说是兵败无归，愿托身于使君麾下，为徐州捍御西面。\n\n张飞在一旁冷笑，说此人先事丁原，后事董卓，两番弑主，收了他便是养虎。可吕布手下仍有张辽、高顺这样的人，营中骑卒也都是百战之余。徐州四面受敌，多一支能战之兵，总比多一个仇家要好。"
 hd_lbxz.0101.a:0 "穷途来归，岂可拒之。使他屯驻小沛。"
 hd_lbxz.0101.b:0 "此人反复，不可留。"
 hd_lbxz_shelter_tt:0 "吕布将移营入徐州，驻扎在刘备治下，两家结为同盟。"
 hd_lbxz.0200.t:0 "下邳空虚"
 hd_lbxz.0200.desc:0 "细作回报：刘备领兵在外，下邳城中只留张飞守备。张飞醉后鞭挞部将，曹豹一家早已怀恨，暗中遣人来说，只要你兵临城下，他便开门相迎。\n\n寄人篱下这一年，你看够了别人的脸色。徐州就在眼前，这一回，不必再等谁把城池交到你手上。"
 hd_lbxz.0200.a:0 "夜袭下邳，徐州归我！"
 hd_lbxz.0200.b:0 "玄德待我不薄，不可负之。"
 hd_lbxz.0201.t:0 "下邳失守"
 hd_lbxz.0201.desc:0 "急报一封接一封送到营中：吕布趁你领兵在外，夜袭下邳，曹豹开门接应，张飞拼死护着家眷杀出城来。\n\n众将都等你开口。回师死战，下邳城坚，吕布骁勇，未必能胜；暂且退避，便要把陶使君托付的徐州让给那个反复之人。"
 hd_lbxz.0201.a:0 "势不可为，收拾余众暂避。"
 hd_lbxz.0201.b:0 "早有防备，逐走吕布！"
 hd_lbxz_seize_tt:0 "吕布夺取刘备的全部领地与电脑封臣，取代刘备的位置；刘备率部众复为流寓之军，屯驻小沛。玩家封臣就地独立。若你此时正与他人交战，战事多半随之作废。"
 hd_lbxz_expel_tt:0 "你识破吕布之谋，与他断盟，吕布移营离开徐州。"
 hd_lbxz.0300.t:0 "南投荆州"
 hd_lbxz.0300.desc:0 "失了徐州，营中众人跟着你东奔西走，粮草一日少似一日。孙乾说，荆州牧刘景升与你同是汉室宗亲，坐拥荆襄，正缺人替他守北面门户。\n\n寄身他人帐下，终究不是长久之计。可眼下能有一处安顿部众的地方，已经难得。"
 hd_lbxz.0300.a:0 "遣孙乾先往荆州致意。"
 hd_lbxz.0300.b:0 "不去荆州，另寻出路。"
 hd_lbxz.0301.t:0 "刘备来投"
 hd_lbxz.0301.desc:0 "孙乾奉刘备之命来到襄阳，说他家主公失了徐州，愿率部众归附，为荆州捍御北方。\n\n蔡瑁私下进言，说刘备素有大志，关羽、张飞皆万人敌，留在身边，只怕日后尾大不掉。可北面曹操日益坐大，荆州正需一员能战之将守住门户。"
 hd_lbxz.0301.a:0 "同宗来归，当以礼相待。使屯新野。"
 hd_lbxz.0301.b:0 "荆州容不下此人。"
 hd_lbxz_jing_tt:0 "刘备投奔刘表：刘表授他荆州一县（优先新野），刘备成为刘表的封臣，定军阀契约（十年内刘表不会收回其权力）；刘表除都城外无县可授时，刘备移营荆州并与刘表结盟。"
 hd_liu_bei_phase_liu_biao:0 "依附景升"
 hd_lbxz.0400.t:0 "三顾草庐"
 hd_lbxz.0400.desc:0 "徐庶向你举荐一人：琅琊诸葛孔明，隐居隆中，自比管仲、乐毅，人称卧龙。徐庶说，此人可就见，不可屈致，将军宜枉驾顾之。\n\n你寄身荆州，髀肉复生，帐下虽有猛将，却始终没有一个能替你筹划全局的人。"
 hd_lbxz.0400.a:0 "备愿亲往，三顾草庐。"
 hd_lbxz.0400.b:0 "一介书生，不必如此。"
 hd_lbxz_zgl_tt:0 "诸葛亮出山，加入你的宫廷，与你结为至交。他若身任官职或执掌世族，会先交卸；若他另有主见，也可能婉拒。"
 hd_lbxz.0410.t:0 "隆中对"
 hd_lbxz.0410.desc:0 "第三次来到草庐，诸葛亮终于出来相见。屏退左右，他为你剖析天下：曹操已拥百万之众，挟天子以令诸侯，此诚不可与争锋；孙权据有江东已历三世，可以为援而不可图也。荆州北据汉沔，利尽南海，用武之国；益州险塞，沃野千里，其主暗弱，智能之士思得明君。\n\n若跨有荆、益，保其岩阻，西和诸戎，南抚夷越，外结孙权，内修政理，待天下有变，则霸业可成，汉室可兴。"
 hd_lbxz.0410.a:0 "孤之有孔明，犹鱼之有水也。"
 hd_lbxz.0500.t:0 "益州来使"
 hd_lbxz.0500.desc:0 "益州来的使者先后到了你帐中，说益州之主暗弱不能用人，北有强敌，人心思变，蜀中智能之士都盼着有一位明主入川。他们愿为内应，迎你入蜀。\n\n益州险塞，沃野千里，本就是成就霸业的根本。机会已经摆在眼前，只是夺人之地，难免招人非议。"
 hd_lbxz.0500.a:0 "天与不取，反受其咎。领兵入蜀！"
 hd_lbxz.0500.b:0 "夺人之地，不忍为也。"
 hd_lbxz_shu_tt:0 "若你仍是他人封臣，将先行独立，并与原领主互给五年停战（原领主若是益州之主一方则不给）。随后向益州之主宣战，争夺蜀郡；宣战成功后获得一支入蜀之师，人数为益州之主最大兵力的一半，最少六千、最多三万。拿下成都后，益州之主将被要求出降。"
 hd_lbxz.0501.t:0 "刘备自立"
 hd_lbxz.0501.desc:0 "刘备受益州之人邀请，领兵西去，从此不再奉你号令。他带走了自己的封地。"
 hd_lbxz.0501.a:0 "由他去吧。"
 hd_lbxz.0510.t:0 "成都城下"
 hd_lbxz.0510.desc:0 "刘备的大军已经进了成都，城中吏民都在等你的决断。有人劝你据守余下的郡县，再图恢复；也有人说，你据蜀多年，未有恩德及于百姓，再战下去，只会让更多的人死于兵火。"
 hd_lbxz.0510.a:0 "开城出降，免百姓兵祸。"
 hd_lbxz.0510.b:0 "据守余地，不降！"
 hd_lbxz_surrender_tt:0 "你交出全部领地与电脑封臣，归于刘备，本人入刘备宫廷（这多半意味着你将失去可扮演的角色）。你的玩家直属封臣先行独立，不随你归附。"
 hd_lbxz_shu_truce:0 "刘备入蜀"
 hd_lbxz_shu_army_name:0 "入蜀之师"
 hd_lbxz.0401.t:0 "刘皇叔三顾"
 hd_lbxz.0401.desc:0 "头一回你托辞不见，第二回你恰好出游。今日刘玄德冒着风雪第三次来到门前，关、张在外等得面有愠色，他却只是拱手立在阶下，等你相见。\n\n天下大势你早已了然于胸。眼前这位汉室宗亲兵微将寡、寄人篱下，可他的诚意，你已经看到了。"
 hd_lbxz.0401.a:0 "将军既不弃鄙贱，亮愿效犬马之劳。"
 hd_lbxz.0401.b:0 "亮久乐耕锄，懒于应世。"
 hd_lbxz_zgl_player_tt:0 "你将交出全部领地或营地：有上级则交还上级，独立则交给刘备；世族头衔交给族中他人，无人可接则废除；你的玩家封臣先行独立。随后你以廷臣身份加入刘备宫廷，与他结为至交。这意味着你将失去当前可扮演的角色。"
