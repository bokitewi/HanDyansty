l_simp_chinese:
 hdpc.9000.t:0 "人物数量调控：统计报告"
 hdpc.9000.desc:0 "#bold 本次普查#!\n全部活人：[GetGlobalVariable('hdpc_living').GetValue|0]\n其中角色池人数：[GetGlobalVariable('hdpc_pooled').GetValue|0]\n统治者人数：[GetGlobalVariable('hdpc_rulers').GetValue|0]\n\n#bold 最近年度清理#!\n已完成轮数：[GetGlobalVariable('hdpc_cycles').GetValue|0]\n年度死亡上限：[GetGlobalVariable('hdpc_death_budget').GetValue|0]\n实际清除：[GetGlobalVariable('hdpc_killed_last').GetValue|0]\n其中游荡人物：[GetGlobalVariable('hdpc_pool_killed_last').GetValue|0]\n其中游牧、部落闲置廷臣：[GetGlobalVariable('hdpc_court_killed_last').GetValue|0]\n死亡处理失败：[GetGlobalVariable('hdpc_failed_last').GetValue|0]\n检查宫廷：[GetGlobalVariable('hdpc_courts_last').GetValue|0]\n入选候选：[GetGlobalVariable('hdpc_candidates_last').GetValue|0]\n\n清理状态：[GetGlobalVariable('hdpc_active').GetValue|0]（0停止，1启用）\n暂停标志：[GetGlobalVariable('hdpc_disabled').GetValue|0]（0运行，1暂停）\n\n活人数超过10,000时启用年度清理，降至8,000时停止；超过11,000时年度上限由300提高到600。先处理角色池中的闲置低出生人物，再处理游牧、部落宫廷中的闲置低出生廷臣。30—49岁游荡人物每年额外死亡概率为10%，50岁及以上为25%；两类宫廷的相应概率为15%和30%。概率受年度人数上限、人口停止线及宫廷保留人数限制。历史人物、玩家及近亲、统治者、继承人和任职人物等受到保护。本报告只刷新普查，不执行清理。"
 hdpc.9000.a:0 "关闭"
