l_simp_chinese:
 hdpc_soft_pressure_modifier:0 "暂居民间"
 hdpc_soft_pressure_modifier_desc:0 "人口调控期间暂居角色池。此生育修正最长持续十年；重返宫廷、任职或进入保护范围后，在下一次年度维护时解除。本修正不扣除健康，也不直接造成死亡。"
 hdpc_high_pressure_modifier:0 "暂缓扩大家庭"
 hdpc_high_pressure_modifier_desc:0 "角色人口高于调控目标时的临时生育修正。最长持续十年，可因重新任职等情况提前解除。本修正不会永久绝育、改变特质或直接杀死角色。"
 hdpc.9000.t:0 "人物数量调控：统计报告"
 hdpc.9000.desc:0 "#bold 本次普查#!\n全部活人：[GetGlobalVariable('hdpc_living').GetValue|0]\n其中角色池人数：[GetGlobalVariable('hdpc_pooled').GetValue|0]\n统治者人数：[GetGlobalVariable('hdpc_rulers').GetValue|0]\n\n#bold 最近一轮调控#!\n已完成轮数：[GetGlobalVariable('hdpc_cycles').GetValue|0]\n离廷预算：[GetGlobalVariable('hdpc_move_budget').GetValue|0]\n实际离廷：[GetGlobalVariable('hdpc_moved_last').GetValue|0]\n未使用预算：[GetGlobalVariable('hdpc_unfilled_last').GetValue|0]\n移动失败：[GetGlobalVariable('hdpc_failed_last').GetValue|0]\n检查宫廷：[GetGlobalVariable('hdpc_courts_last').GetValue|0]\n入选候选：[GetGlobalVariable('hdpc_candidates_last').GetValue|0]\n上次维护时仍受临时修正影响：[GetGlobalVariable('hdpc_managed_count').GetValue|0]\n\n距上一轮已过年度脉冲：[GetGlobalVariable('hdpc_years_elapsed').GetValue|0] / 10\n暂停标志：[GetGlobalVariable('hdpc_disabled').GetValue|0]（0运行，1暂停）\n\n目标为8,000—11,000；仅在十年轮次普查高于10,000时处理。移入角色池不会立即减少全部活人数。本报告只刷新普查，不执行清理。"
 hdpc.9000.a:0 "关闭"
