 shihao_beiweixiaozhuang: "孝庄皇帝"
 shihao_beiweixiaozhuang_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 继志成事，胜敌志强，谥曰孝庄。\n\n初谥武怀。后（元修）改谥号为孝庄！\n\n“吾宁为高贵乡公死，不为常道乡公生”"
 shihao_chengwu: "成武皇帝"
 shihao_chengwu_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 礼乐明具，威疆叡德，谥曰成武"
 shihao_daowu: "道武皇帝"
 shihao_daowu_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 以德化民，克有天下，谥曰道武。\n\n初谥宣武，庙号烈祖。后（拓跋嗣）改谥号为道武，（元宏）改庙号为太祖"
 shihao_de: "德皇帝"
 shihao_de_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 贵而好礼，绥柔士民，谥曰德！"
 shihao_gao: "高皇帝"
 shihao_gao_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 功德盛大，五宗安之，谥曰高！"
 shihao_gong: "恭皇帝"
 shihao_gong_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 勤恤民隐，尊贤敬让，谥曰恭！"
 shihao_gongzong: "懿圣景穆皇帝"
 shihao_gongzong_desc: "先帝勤恤民隐，尊贤敬让，谥曰懿圣景穆！"
 shihao_guangwu: "光武皇帝"
 shihao_guangwu_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat]兴于匹庶，荡涤天下，诛锄暴乱，兴继祖宗。谥曰光武"
 shihao_he: "和皇帝"
 shihao_he_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 温厚无苛，推贤让能，谥曰和！"
 shihao_jianwen: "简文皇帝"
 shihao_jianwen_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 一德不懈，绍修圣绪，谥曰简文"
 shihao_jiemin: "节闵皇帝"
 shihao_jiemin_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 好廉自克，慈仁不寿，谥曰节闵"
 shihao_jing: "景皇帝"
 shihao_jing2: "静皇帝"
 shihao_jing2_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 厚德安贞，柔德考众，谥曰静"
 shihao_jing_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 耆意大虑，由义而济，谥曰景！"
 shihao_jingzhao: "景昭皇帝"
 shihao_jingzhao_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 布义行刚，柔德有光，谥曰景昭"
 shihao_ming: "明皇帝"
 shihao_ming_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 保民耆艾，弥年寿考，谥曰明！"
 shihao_mingyuan: "明元皇帝"
 shihao_mingyuan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 思虑果远，主义行德，谥曰明元"
 shihao_ruizong: "玄真大圣大兴孝皇帝"
 shihao_ruizong_desc: "先帝深思远虑，绥柔士民，谥曰玄真大圣大兴孝！"
 shihao_tai: "太皇帝"
 shihao_tai_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 克启行禩，靖民则法，谥曰太！"
 shihao_taiwu: "太武皇帝"
 shihao_taiwu_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 克启行禩，威强睿德，谥曰太武"
 shihao_wen: "文皇帝"
 shihao_wen_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 帝德运广，经纬天地，谥曰文！"
 shihao_wencheng: "文成皇帝"
 shihao_wencheng_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 帝德运广，内德纯备，谥曰文成"
 shihao_wu: "武皇帝"
 shihao_wu_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 威强恢远，夸志多穷，谥曰武！"
 shihao_wucheng: "武成皇帝"
 shihao_wucheng_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 克定祸乱，内德纯备，谥曰武成"
 shihao_wuyuan: "武元皇帝"
 shihao_wuyuan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 刚强直理，体干启祚，谥曰武元"
 shihao_wuzetian: "则天大圣皇帝"
 shihao_wuzetian_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 德象天地，行道化民，谥曰则天大圣\n\n谥曰则天大圣皇后。唐隆元年（710），改为天后；景云元年（710），改为大圣天后；延和元年（712），改为天后圣帝，未几，改为圣后；开元四年（716），改为则天皇后；天宝八载（749），加谥则天顺圣皇后。"
 shihao_xianwen: "献文皇帝"
 shihao_xianwen_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 聪明睿智，刚柔相济，谥曰献文"
 shihao_xiaocheng: "孝成皇帝"
 shihao_xiaocheng_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 慈爱忘劳，安民立政，谥曰孝成"
 shihao_xiaojing: "孝静皇帝"
 shihao_xiaojing_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 五宗安之，柔德考众，谥曰孝静"
 shihao_xiaomin2: "孝闵皇帝"
 shihao_xiaomin2_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 尊仁爱义，慈仁不寿，谥曰孝闵"
 shihao_xiaoming: "孝明皇帝"
 shihao_xiaoming_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 德加百姓，照临四方，谥曰孝明"
 shihao_xiaowen: "孝文皇帝"
 shihao_xiaowen_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 德通神明，经纬天地，谥曰孝文"
 shihao_xiaowu: "孝武皇帝"
 shihao_xiaowu_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 教刑四海，克定祸乱，谥曰孝武"
 shihao_xiaoxuan: "孝宣皇帝"
 shihao_xiaoxuan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 博施被物，能布令德，谥曰孝宣"
 shihao_xiaoyuan: "孝元皇帝"
 shihao_xiaoyuan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 尊仁爱义，道德纯一，谥曰孝元"
 shihao_xiaozhang: "孝章皇帝"
 shihao_xiaozhang_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 德通神明，温克令仪，谥曰孝章"
 shihao_xiaozhao: "孝昭皇帝"
 shihao_xiaozhao_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 慈惠爱亲，威仪恭明，谥曰孝昭"
 shihao_xiaozhi: "孝质皇帝"
 shihao_xiaozhi_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 协时肇享，忠正无邪，谥曰孝质"
 shihao_xuan: "宣皇帝"
 shihao_xuan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 圣善周闻，主义行德，谥曰宣！"
 shihao_xuanwu: "宣武皇帝"
 shihao_xuanwu_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 圣善周闻，威强恢远，谥曰宣武"
 shihao_xuanzhao: "宣昭皇帝"
 shihao_xuanzhao_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 施而不成，声闻宣远，谥曰宣昭"
 shihao_yang: "炀皇帝"
 shihao_yang_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 好内远礼，肆行劳神，谥曰炀！"
 shihao_yin: "隐皇帝"
 shihao_yin_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 隐括不成，不尸其位，谥曰隐"
 shihao_you: "幽皇帝"
 shihao_you_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 壅遏不通，暴民残义，谥曰幽"
 shihao_zhaowu: "昭武皇帝"
 shihao_zhaowu_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 威仪恭明，威强恢远，谥曰昭武"
 shundiruyinwang: "顺"
 shundiruyinwang_desc: "齐王践阼，封为汝阴王，待以不臣之礼。后殂于丹阳宫，时年十三。谥曰顺帝。"
