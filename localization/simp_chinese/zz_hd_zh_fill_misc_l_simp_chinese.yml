 hd_yiling_attack_wu:0 "起兵伐吴，为关羽报仇。"
 hd_yiling_delay_revenge:0 "暂缓复仇，且整军待时。"
 hd_yiling_demand_jingzhou:0 "先遣之使索还荆州。"
 hd_yiling_keep_alliance:0 "遥应其策，重修旧盟。"
 hd_yiling_reject_demand:0 "拒其所请。"
 hd_yiling_return_part_jingzhou:0 "归还部分争地。"
 hd_yiling_risk_camps_modifier:0 "连营百里"
 hd_yiling_risk_camps_modifier_desc:0 "营垒相连，军中难以迅速相互救援。"
 hd_yiling_risk_heat_modifier:0 "盛夏酷暑"
 hd_yiling_risk_heat_modifier_desc:0 "酷暑之气，正消磨远征之师的战力。"
 hd_yiling_risk_lu_xun_modifier:0 "陆逊统兵"
 hd_yiling_risk_lu_xun_modifier_desc:0 "陆逊正伺机反击。"
 hd_yiling_risk_mountain_modifier:0 "山关阻隔去路。"
 hd_yiling_risk_mountain_modifier_desc:0 "山地险峻，大军难以展开。"
 hd_yiling_risk_supply_modifier:0 "夷陵粮道"
 hd_yiling_risk_supply_modifier_desc:0 "攻吴之军的粮道狭窄而脆弱。"
 quix_murder_ongoing.3010.a:0 "[agent_in_question.GetFirstNameNoTooltip]此等热忱，正当为众人之楷模！"
 quix_murder_ongoing.3010.a.failure:0 "[agent_in_question.GetSheHe|U]自露行藏"
 quix_murder_ongoing.3010.a.success:0 "[agent_in_question.GetHerHis|U]这份执念，真可谓无价之宝。"
 quix_murder_ongoing.3010.b:0 "将[agent_in_question.GetTitledFirstNameNoTooltip]以皮带捆缚。"
 quix_murder_ongoing.3010.c:0 "此事我等概不担责。"
 quix_murder_ongoing.3010.desc:0 "[agent_in_question.GetTitledFirstName]所提之计，皆以折磨为务，杀[scheme.GetTarget.GetTitledFirstName]反倒成了次要之事。[agent_in_question.GetHerHis]之才干的确有用，但如此残忍，也可能使整个谋划暴露。"
 quix_murder_ongoing.3010.desc_hero:0 "[agent_in_question.GetTitledFirstName]所提之计，皆以折磨为先，杀[scheme.GetTarget.GetTitledFirstName]反倒成了次要之事。这般残忍，已激怒了[agent_hero_of_the_moment.GetTitledFirstName]——[scheme.GetTarget.GetTitleAsNamePossessiveNoTooltip][target.Custom2('RelationToMe', SCOPE.sC('agent_hero_of_the_moment'))]。若不加节制，二人恐怕都会毁了整个谋划。"
 quix_murder_ongoing.3010.desc_opening:0 "[agent_in_question.GetTitledFirstName]似乎在这场谋杀中投入了太多的热情。"
 quix_murder_ongoing.3010.t:0 "$murder_event_title$ 嗜虐刺客"
 quix_murder_ongoing.3301.a:0 "何事竟如此繁难！？"
 quix_murder_ongoing.3301.desc:0 "你费尽周折，暗中约同谋之人相会，商议如何除掉[target.GetTitledFirstName]。不料一夜争辩，终究未能议定，众人反倒比先前更加犹豫。"
 quix_murder_ongoing.3301.t:0 "$murder_event_title$ 议而不决"
 quix_seduce_outcome.2030.desc:0 "你与[target.GetTitledFirstName]彼此心意已明，再试探也是徒劳。你的心腹为你们安排了一处僻静之所。\n\n你正要开口表白，[target.GetFirstName]却以指按唇，止住了你。自此二人相会，热烈而直接，无需再许诺什么。"
 quix_seduce_outcome.2302.desc:0 "路途遥远，一直阻隔着你追求[target.GetTitledFirstName]，于是[target.GetSheHe]便托以进香之名，悄悄来到，暂居于一处不起眼的仆役房中。\n\n你们彻夜长谈，都未直言心意。然而待各自回房之后，[target.GetFirstName]又悄然来到你的床前。"
 quix_seduce_outcome.3030.desc:0 "你与[owner.GetTitledFirstName]彼此心意已明，再试探也是徒劳。一位可信的心腹为你们安排了一处僻静之所。正当\n\n[owner.GetSheHe|U]要开口表白时，你以手势止住了[owner.GetHerHis]。自此二人相会，热烈而直接，无需再许诺什么。"
 quix_seduce_outcome.3302.desc:0 "你知道[owner.GetTitledFirstName]早已心慕于你，于是暗中假托进香，前往[owner.GetHerHis]的府邸，在一处不起眼的仆役房中住下。\n\n你们谈至半夜，都未直言心意。待各自回房之后，你又改了主意，悄悄走到[owner.GetFirstName]的床前。"
