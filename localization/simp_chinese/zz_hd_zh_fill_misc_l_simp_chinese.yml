l_simp_chinese:
 HD_LIU_BEI_184_STORY_STATUS:0 "当前章节：#V 涿郡起兵#!\n本故事仅涵盖中平元年桃园结义与黄巾起事之开端。天下黄巾之局一经定下，故事即告终结。"
 HD_LIU_BEI_LIFE_STORY_STATUS:0 "当前章节：#V [Story.MakeScope.Var('hd_liu_bei_life_phase').GetFlagName]#!\n自涿郡举起义旗，至西蜀立足基业，刘备之抉择、誓约与征战，皆汇为一条个人的史脉。"
 MUSIC_PLAYER_PLAY_TRACK_TT:0 "点击播放[MusicTrack.GetName]"
 hd_dc_debug.0001.desc:0 "选择要检视的项目。查看状态不会推进事件；调整点数会立即刷新与之相关的地区。\n\n支付、应答与等候之期，仍照常规程序处理。"
 hd_dc_debug.0001.t:0 "王朝循环调试"
 hd_dc_debug.0002.ready:0 "乱世W：[hd_dc_debug_region.Var('hd_dc_pressure_percent').GetValue|1] / 100\n盛世H：[hd_dc_debug_region.Var('hd_dc_prosperity_percent').GetValue|1] / 100\n乱世等级：[hd_dc_debug_region.Var('hd_dc_pressure_band').GetValue|0]\n目前适用于你的事件F：[SCOPE.GetValue('hd_dc_debug_f')|2]；派系P：[SCOPE.GetValue('hd_dc_debug_p')|2]；策略合并倍率：[SCOPE.GetValue('hd_dc_debug_scheme_f')|2]。不在适用地区时为1。疫病D按郡而定，分五档为1/1.05/1.10/1.15/1.20。\n\n上次W请求/实际增量：[hd_dc_debug_region.Var('hd_dc_last_w_requested').GetValue|0] / [hd_dc_debug_region.Var('hd_dc_last_w_actual').GetValue|0]\n上次H请求/实际增量：[hd_dc_debug_region.Var('hd_dc_last_h_requested').GetValue|0] / [hd_dc_debug_region.Var('hd_dc_last_h_actual').GetValue|0]\n。以上增量均为内部点数，每20点折合界面1点。"
 hd_dc_debug.0002.t:0 "当前王朝循环状况"
 hd_dc_debug.0002.waiting:0 "王朝循环已然开启，然W/H尚未初始化。可待每月例行的正式考察，或选择即刻进行正式考察并刷新。"
 hd_dc_debug.0020.desc:0 "手动发起正式事件，跳过年度抽签的等待。人物资格、待应之事与履行条件依然有效。不可选之项仍留于菜单中，缺何条件可自行查看。"
 hd_dc_debug.0030.desc:0 "以下操作将真正改动当前世界。仅在点击对应场景时执行；关闭菜单后，新生成的人物、关系与钱财不会自动还原。场景布置妥当后，仍须从事件菜单正式发起流程。"
 hd_dc_debug.back:0 "返回调试菜单"
 hd_dc_debug.close:0 "关闭"
 hd_dc_debug.events:0 "已发现有效事件。"
 hd_dc_debug.h:0 "调整盛世H"
 hd_dc_debug.minus_1:0 "减少1点"
 hd_dc_debug.minus_10:0 "减少10点"
 hd_dc_debug.ord09:0 "ORD-09：赎回亲属"
 hd_dc_debug.ord09.tt:0 "需有符合条件的亲属确被囚禁，法定关押之人及当前行动之权俱备；若尚有待应答的寻常事件，则不可另行发起。"
 hd_dc_debug.ord13:0 "ORD-13：公文与凶讯"
 hd_dc_debug.ord13.tt:0 "需有成年君主在该地区，乱世压力至少二级，且有合格的直属封臣所领之郡，其控制度不足50。若尚有待应答的寻常事件，则不可开启。"
 hd_dc_debug.ord19:0 "ORD-19：仇人之子"
 hd_dc_debug.ord19.tt:0 "需有旧敌之成年子嗣确在朝中，且无可用以入狱的私罪，亦非你之私仇。若为有限合作，另需一名双方互信的担保人。若尚有待应答的寻常事件，则不可发起。"
 hd_dc_debug.plus_1:0 "增加1点"
 hd_dc_debug.plus_10:0 "增加10点"
 hd_dc_debug.points.desc:0 "调整值以界面点数计，范围0至100。乱世在20、40、60、80时升至更高一档。\n\n点数变动统一记录，并影响刷新；降低乱世并不会退还已失之控制度或发展度，亦不会直接改变时局。"
 hd_dc_debug.prepare:0 "布置测试场景"
 hd_dc_debug.prepare_ord19:0 "为ORD-19布置三人场景"
 hd_dc_debug.prepare_ord19.tt:0 "生成一位四十五岁的父亲、一位二十岁的少年与一位四十岁的担保人，入你之朝；此刻与父亲结为仇敌，少年则保留其独立的私人关系与罪责。你、少年与担保人之间所需的四条关系，各增五年之期，好感+100，另赐你黄金三百。每名玩家角色仅布置一次，且不会代任何人自动应允提议。"
 hd_dc_debug.refresh:0 "进行正式考察并刷新。"
 hd_dc_debug.refresh.tt:0 "依正式考察之程序更新地区态势、危机影响、事件池与待决之事；此举会改变局势，但不会虚增已过之年月。"
 hd_dc_debug.set_0:0 "设为0"
 hd_dc_debug.set_100:0 "设为100"
 hd_dc_debug.set_20:0 "设为20"
 hd_dc_debug.set_40:0 "设为40"
 hd_dc_debug.set_60:0 "设为60"
 hd_dc_debug.set_80:0 "设为80"
 hd_dc_debug.status:0 "查看当前状况"
 hd_dc_debug.w:0 "调整乱世W"
 hd_dc_debug_decision:0 "王朝循环调试"
 hd_dc_debug_decision_confirm:0 "打开调试菜单"
 hd_dc_debug_decision_desc:0 "查看王朝循环之当前状态，调整乱世与盛世，并检视事件之进程。此项仅在调试模式下出现。"
 hd_dc_debug_decision_tooltip:0 "打开王朝循环调试菜单"
 hd_dc_debug_rival_reason:0 "[TARGET_CHARACTER.GetShortUIName]与[CHARACTER.GetShortUIName]因场景调试之布置而结为仇敌"
 hd_dc_debug_trust_opinion:0 "调试场景：互信"
 hd_dc_extra_faction_created:0 "已载入新设立的派系。"
 hd_dc_extra_faction_creation_failed:0 "已选定类型，然成立之前资格复核未过，或成立结果读取失败；本年不再重抽。"
 hd_dc_extra_faction_low_w:0 "W不足20，未增加机会。"
 hd_dc_extra_faction_missed:0 "概率抽取未中"
 hd_dc_extra_faction_no_type:0 "有机会兴起，但无可成立的有效类型。"
 hd_dc_faction_pulse_debug.actor:0 "\n实际发起者：[hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_actor').Char.GetShortUIName]"
 hd_dc_faction_pulse_debug.check:0 "对此政权进行本年度的正式考察。"
 hd_dc_faction_pulse_debug.check.tt:0 "耗用此主要爵位本年一次考察之机会；失败则不得重抽。成功则成立正统的派系，其后可依原有程序挑起敌对。仅观看此页并不会成立派系。"
 hd_dc_faction_pulse_debug.claimant:0 "\n真正的求位者：[hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_claimant').Char.GetShortUIName]\n争夺的爵位：[hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_claimed_title').Title.GetName]"
 hd_dc_faction_pulse_debug.county:0 "\n实际发起之郡：[hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_county').Title.GetName]"
 hd_dc_faction_pulse_debug.desc:0 "保留原版的自动成立。W达到20时，每个政权每年额外获得10%的基础机会，经P按1−(1−p₀)^P换算；成功则从当时法定可用的类型中选一派系，至多成立一个。发起者须为AI；郡级起事采用确切的郡级资格。同类型已存在的派系不计在内，以防重复加速。\n\n拥立类派系须有确切的求位者与爵位。现行禁用日本派系之条件仍然有效；农民派系之升级，保留原版既有的起义升级程序。此机会不取代原版最终的成立概率，亦不直接发动叛乱或宣战。"
 hd_dc_faction_pulse_debug.low_w:0 "\n当前W低于20时，本年考察中派系机会不会增加。"
 hd_dc_faction_pulse_debug.no_record:0 "\n此主要爵位目前尚无年度考察记录。"
 hd_dc_faction_pulse_debug.no_title:0 "\n无法执行：当前人物没有主要爵位。"
 hd_dc_faction_pulse_debug.outside:0 "\n无法执行：当前人物不在王朝循环所涉之地区内。"
 hd_dc_faction_pulse_debug.record:0 "\n 政权：[hd_dc_debug_pulse_realm.GetName]\n 上次考察之年：[hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_year').GetValue|0]\n 实际抽样概率：[hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_chance').GetValue|2]% \n 结果：[SCOPE.GetFlagName('hd_dc_debug_pulse_result')]"
 hd_dc_faction_pulse_debug.title:0 "额外派系年度考察"
 hd_dc_faction_pulse_debug.type:0 "\n派系类型标识：[hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_type').GetFlagKey]"
 hd_dc_faction_pulse_debug.used:0 "\n 本年考察已用过。更换君主、重新打开此页或调整W，都不会为同一主要爵位恢复本年之机会。"
 hd_dc_ord.0009.b.tt:0 "乱世+1；被囚者尚存的近亲使你的影响力减少15。若你有一名确实主张强硬的近臣，其支持使你的影响力增加10，持续5年。俘虏仍由原先的擒获者看管，此选项不会令其死去。"
 hd_dc_ord.0013.a.tt:0 "自私财中支出30金，用于文书吏员与行政事务，使当前的参议得以依原版内政机制真正承担职事。任务确立后：压力−15；盟友对你好感+15；拖延请愿的封臣对你好感−10；持续5年；遇危机时不变。骄横之人另受基础压力+20，并受压力加成修正影响。此举改变该参议当前的内阁任务；若任务失败，所耗之金退还，但不减压力。"
 hd_dc_ord.0019.a.tt:0 "乱世−1；宾客对你好感+20。若有近臣欲向你父辈之仇敌寻仇，且此人确为仇敌，则该近臣对你的好感−15，持续5年。保留你与父辈仇敌之间的真正仇怨；不要授予宾客豁免、爵位或政治权力。"
 hd_dc_ord.0019.b.tt:0 "乱世+2；因你冷遇相待，宾客的名望−30。若有与其父有旧仇的近臣为之报复，则该近臣对你的名望+15，持续5年。因无法律依据可以拘留，你不会将宾客囚禁、处死或剥夺爵位，宾客也不会自动成为仇敌。"
 hd_dc_ord.0113.a.tt:0 "亲自阅读对方的私函，理清其所忧，并以良言回复：对方压力−20，地区危机−1，你对其好感+20，持续5年。此举并未移交任何治权。"
 hd_dc_par.0001.c.tt:0 "记录当前策略的确定决断；争议+10。两派领袖因你的斥责各受−10之罚。凡在保全府库之策上签名支持者，因你保留其策，对你的好感另+10。此节结束时不增加税率与治理点。"
 hd_dc_par.1001.c.tt:0 "不参与此次政策之辩。此案不会引发朋党之争危机，不会施加五十年之冷却，亦不会将拒绝视为支持任何一方。"
 hd_dc_par.1101.a.tt:0 "此案已了结，百金已付讫；减税之议即刻生效：税收−10%，发展增速+25%，民望+20，为期12个月。治理点数于期满时核定；此付讫之凭不另行收费，亦不调整点数。"
 hd_dc_par.1202.a.tt:0 "此议未经试行，亦不计入治理点数。此番应答不再产生支付、补偿或退款；已付之数与未结之差额，均不受影响。"
 hd_dc_roy.0001.a.tt:0 "恢复危机中所定的旧制，并暂停对近座之人的优待。矛盾−5，治理+10；支持旧制的派系对你好感+10，而请求近座之人对你好感−10。此效持续5年。"
 hd_dc_roy.0001.c.tt:0 "核对当前名册，驳回双方之争。矛盾+10，获少许威望；争讼双方对你的好感各−15，强势的非宗室封臣对你的好感+10，宗室协作之好感−5，持续5年。"
 hd_dc_support.0008.a.tt:0 "复核资格之后，必定加入信中所指真正求位者的派系；约定之私财，仅于成功之后支付。每人每场危机至多领一次动员之赏：首次以候选人身份成功入派，本人动员+15；候选人对你好感+25，现任者对你好感−20，其余候选人对你好感−10，持续5年。不另设拒绝抽签之限，也无十年不得退出之禁。"
 hd_dc_support.0008.c.tt:0 "明言拒绝此番招募：候选人动员值−5；现任者对你的名望+100，而候选人对你的名望−20，此效持续5年。两人两年之内不再受邀，亦不受罚，也不增添派系归属。"
 hd_dc_theft_pulse_debug.actor:0 "\n\n 受考察之人：[hd_dc_theft_debug_actor.GetName]。"
 hd_dc_theft_pulse_debug.check:0 "对此人进行本年度的正式考察。"
 hd_dc_theft_pulse_debug.check_tt:0 "启动正式的年度考核；保留此人本年的锁定、确有的候选条件、原版五年冷却与计谋上限。本年已考核之人不可再次重抽。已被禁用的门槛不会解除。"
 hd_dc_theft_pulse_debug.gates:0 "#warning 当前的Dakuo仍受四道原版禁用门槛所阻：策略允许、有效，以及交互之 is_shown、can_send。#!\n此页不解除禁用门槛，亦不证明历史上的槽位崩溃已经修复。只读进入不进行年度考核。"
 hd_dc_theft_pulse_debug.native_gate_failed:0 "\n 考核结果：存在营生候选者，但原版计谋发动检定未过。既有禁用门槛仍然有效；此结果亦跳过了冷却与上限之检定。"
 hd_dc_theft_pulse_debug.native_start_failed:0 "\n考核结果：抽样之后，原版调用未返回新的计谋。"
 hd_dc_theft_pulse_debug.no_actor:0 "区域内\n\n无合乎本年正式劫盗记录条件的AI人物。"
 hd_dc_theft_pulse_debug.no_business_candidate:0 "\n考核结果：无人合乎此职之候选资格；未进行概率计算与抽样。"
 hd_dc_theft_pulse_debug.no_record:0 "\n目前尚无可供查阅的年度考核记录。"
 hd_dc_theft_pulse_debug.no_scheme:0 "\n 计谋记录：目前并无现存的计谋引据；勿据此推断历史上曾经成功。"
 hd_dc_theft_pulse_debug.other:0 "仅阅读以查看另一位合格的人物"
 hd_dc_theft_pulse_debug.probability:0 "\n实际选定的目标：[hd_dc_theft_debug_actor.MakeScope.Var('hd_dc_theft_pulse_target').Char.GetName]。\n基础几率：[hd_dc_theft_debug_actor.MakeScope.Var('hd_dc_theft_pulse_p0').GetValue|3]%；调整后的实际抽样几率：[hd_dc_theft_debug_actor.MakeScope.Var('hd_dc_theft_pulse_probability').GetValue|3]%。"
 hd_dc_theft_pulse_debug.probability_failed:0 "\n考核结果：已存在有效目标；概率抽样未中。"
 hd_dc_theft_pulse_debug.refresh:0 "仅刷新当前人物"
 hd_dc_theft_pulse_debug.scheme_exists:0 "\n 计谋记录：所记之计谋现已存在。"
 hd_dc_theft_pulse_debug.started:0 "\n 最近考核结果：原版发动已成功生成计谋，计谋是否尚存，见下文。"
 hd_dc_theft_pulse_debug.title:0 "劫盗年度考核"
 hd_dc_theft_pulse_debug.year:0 "\n上次考核之年：[hd_dc_theft_debug_actor.MakeScope.Var('hd_dc_theft_pulse_year').GetValue|0]。"
 hd_fengying.0011.alt_desc:0 "机会已至，可迎天子，然你尚非拥有独立疆土之君，不能将朝廷迁至自家治所。或助之，或遥观，或阻他人，仍是你眼下切实可行的选择。"
 hd_fengying.0011.desc:0 "天子已失去强有力的盟援，而河北之兵马精锐，粮草充足。迎奉天子、扶持朝廷，可令你压倒群雄；然朝中公卿与宗室，也将是你军政之下最难安置的一群人。曹操同样在等待这一时机。"
 hd_fengying.0011.t:0 "天子或可迎归"
 hd_fengying_yuan_aid:0 "出车马辎重，略予相助。"
 hd_fengying_yuan_hesitate:0 "此事牵连甚繁，且观望一时。"
 hd_fengying_yuan_obstruct:0 "断其道路，使曹操不得成事。"
 hd_fengying_yuan_receive:0 "护送天子往河北。"
 hd_huangjin.3.reward_4000:0 "获青州军兵四千。"
 hd_huangjin.3.reward_8000:0 "获青州军兵八千。"
 hd_huangjin.3.reward_full:0 "三次考核尽皆通过！获青州军兵二万二千（每次考核四千，三次全过另加一万）；直辖诸郡之发展度增加30%，为期二十年。"
 hd_lb22_appoint_guan_yu_jingzhou:0 "任命关羽为荆州主君。"
 hd_lb22_keep_jingzhou_arrangement:0 "维持现有安排。"
 hd_lb24_align_cao:0 "遣使联络曹氏，求取些许利益。"
 hd_lb24_attack_jingzhou:0 "趁荆州空虚，夺取之。"
 hd_lb24_await_sun_decision:0 "江东之择，将定我军退路。"
 hd_lb24_keep_alliance:0 "不破盟约，仍守和好。"
 hd_lb24_wait:0 "且观北境之势。"
 hd_lb_bequest_decline_tt:0 "不移交爵位，陶谦亦不被杀。此让地之机会就此作罢。"
 hd_lb_no_effect_tt:0 "不生盟约、战事、爵位或阵营之变。此番相邀不会再有。"
 hd_lb_zhao_friend_tt:0 "刘备与赵云结为朋友。赵云暂留公孙瓒帐下。"
 hd_lb_zhao_join_tt:0 "赵云以无主无地之身投入刘备门下。已有之封地绝不没收。"
 hd_liu_bei_late.2200.desc:0 "益州之事已定，你须将荆州托付给一位能独当一面的至尊之主。关羽兼具此任所需的威望、资历与忠诚，然若任他为之，荆益两州之间的权势格局便要改易。"
 hd_liu_bei_late.2200.t:0 "镇守荆州"
 hd_liu_bei_late.2400.desc:0 "关羽已自荆州北上。江东、曹氏，以及留守的诸将，都在估量这道防线还能支撑多少压力。"
 hd_liu_bei_late.2400.t:0 "荆州北伐"
 hd_liu_bei_late.2410.alt_desc:0 "关羽北伐之事已推进至江东的抉择，然因现有的君臣关系、盟约或荆州归属，眼下不得直接攻取。或待，或守盟，或联络曹氏，仍可了结此一阶段。"
 hd_liu_bei_late.2410.desc:0 "关羽主力北进，荆州后方便出现空隙。夺取荆州，可除去上游对江东的威胁；但这样一来，孙刘之盟便会彻底毁去。"
 hd_liu_bei_late.2410.t:0 "荆州之隙"
 hd_liu_bei_late.2491.desc:0 "战事之中，荆州易了其主。关羽的命运，仍由战场、俘获，以及人之生死所定。"
 hd_liu_bei_late.2491.t:0 "荆州易主"
 hd_liu_bei_late.2492.desc:0 "曹操之军在战事中守住了荆州，改写了历史的走向。"
 hd_liu_bei_late.2492.t:0 "荆州保全"
 hd_liu_bei_late.2500.alt_desc:0 "关羽已殁，然复仇之议犹在。但眼下君臣之分、领地、盟约或荆州归属，皆不足以发动名正言顺的夷陵之战。仍可择取：和解、索还荆州，或暂缓报仇。"
 hd_liu_bei_late.2500.desc:0 "关羽已死，荆州已落入孙氏之手。复仇、结盟与各派之存续互相牵制；若出兵，粮道、山地、连营、暑热，以及吴军主将，都会切实影响战局。"
 hd_liu_bei_late.2500.t:0 "讨吴之议"
 hd_liu_bei_late.2510.desc:0 "刘备遣使索还荆州。若予之，可免大战，然江东上游的屏障便会因此削弱。"
 hd_liu_bei_late.2510.t:0 "索还荆州"
 hd_liu_bei_late.2590.desc:0 "刘备之军在战场上败北。漫长的粮道、山地之险与连营之患，终致大败。"
 hd_liu_bei_late.2590.t:0 "夷陵之败"
 hd_liu_bei_late.2591.desc:0 "刘备之军于战场获胜；荆州之争，将依正式的战争目标定夺。"
 hd_liu_bei_late.2591.t:0 "讨吴得胜"
 hd_liu_bei_phase_jingzhou:0 "荆州之失"
 hd_liu_bei_phase_yiling:0 "夷陵之争"
 hd_liu_bei_phase_yizhou:0 "立业西川"
 hd_story_liu_bei_lb24:0 "荆州之失"
