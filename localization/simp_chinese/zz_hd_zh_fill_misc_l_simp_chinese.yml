 sworn_brotherhood_ferocity_path_tt:0 "以勇武结义，我等将得战力与不移之志。此路效法张飞之武勇。"
 sworn_brotherhood_ferocity_strengthened_tt:0 "我等热血之义，已在时日的锤炼之中见其可贵。"
 sworn_brotherhood_humble_refusal_tt:0 "我等谦辞：此义无须再行礼仪，亦无须赏赐。"
 sworn_brotherhood_loyalty_path_tt:0 "以忠义结拜，我等将得军中之威，并使誓约更加牢固。此路效法关羽之忠义。"
 sworn_brotherhood_loyalty_strengthened_tt:0 "我等忠义之盟经受考验，比从前更加坚固。"
 sworn_brotherhood_righteous_path_tt:0 "以仁义结义，我等将得更多名望，并有机会愈发端正。此路承继刘备之遗风。"
 sworn_brotherhood_simple_path_tt:0 "立一桩质朴而真诚的结义之约，可得些许礼仪之荣。"
 sworn_brotherhood_tested_tt:0 "我等结义之盟经得起时日考验，因而愈发牢固。"
 uuii_claim_mandate_blocked_by_legitimate_hegemon_tt:0 "只要正统的天子仍居帝位，便不能宣称或夺取天命。"
 uuii_dynastic_cycle.0001.a:0 "天下大势，由此而变。"
 uuii_dynastic_cycle.0001.desc.high_authority_1:0 "天子的正统之威达于极盛，霸业得以延续。然而单一层级的皇权不足以驾驭诸侯，所有直属封臣皆宣告独立。其中先前追随霸主之人，转为天朝的朝贡之国。此时无人可宣称或夺取天命。"
 uuii_dynastic_cycle.0001.desc.high_authority_2:0 "天子的正统达于极盛，霸业得以延续。二级主权保证京畿法定辖区之内的封臣仍然臣服，其余直属封臣则各自独立；其中曾拥戴天子、力图维护其权威者，转为天朝的朝贡之国。此时无人可宣称或夺取天命。"
 uuii_dynastic_cycle.0001.desc.high_authority_3:0 "天子的正统达于极盛，霸业得以延续。三级主权保证京畿法定王国之内的封臣仍然臣服，其余直属封臣则各自独立；其中曾拥戴天子、力图维护其权威者，转为天朝的朝贡之国。此时无人可宣称或夺取天命。"
 uuii_dynastic_cycle.0001.desc.high_authority_4:0 "天子的正统达于极盛，霸业得以延续。四级皇权保证京畿法定帝国之内的封臣仍然臣服，其余直属封臣则各自独立；其中曾拥戴天子、力图维护其权威者，转为天朝的朝贡之国。此时无人可宣称或夺取天命。"
 uuii_dynastic_cycle.0001.desc.low_authority_1:0 "天子的正统不足，霸主之号随王朝倾颓而去，然天子并不被迫退位，仍保有直属与寻常的爵位。在一级主权之下，所有直属封臣皆宣告独立，天命又一次向天下开放竞逐。"
 uuii_dynastic_cycle.0001.desc.low_authority_2:0 "天子的正统不足，霸主之号随王朝倾颓而去；然天子并不被迫退位，仍保有直属与寻常的爵位。二级主权保证京畿法定公域之内的封臣继续服从，其余直属封臣则各自独立，天下重新向天命之争开放。"
 uuii_dynastic_cycle.0001.desc.low_authority_3:0 "天子的正统不足，霸主之号随王朝倾颓而去；然天子并不被迫退位，仍保有直属与寻常的爵位。三级主权保证京畿法定王国之内的封臣继续服从，其余直属封臣则各自独立，天下重新向天命之争开放。"
 uuii_dynastic_cycle.0001.desc.low_authority_4:0 "天子的正统不足，霸主之号随王朝倾颓而去；然天子并不被迫退位，仍保有直属与寻常的爵位。四级主权保证京畿法定帝国之内的封臣继续服从，其余直属封臣则各自独立，天下重新向天命之争开放。"
 uuii_dynastic_cycle.0001.t:0 "群雄割据，天下重分"
