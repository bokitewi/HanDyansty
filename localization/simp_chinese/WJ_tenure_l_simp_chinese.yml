l_simp_chinese:
 WJ_tenure_modifier:0 "敕命留任"
 WJ_tenure_modifier_desc:0 "奉命守其本职，暂缓普通调任、辞职及致仕。留任不传给继承者，亦不妨碍剧情另有任命；玩家可随时解除。"
 WJ_tenure_release_first_tt:0 "未受留任之命；可先解除留任限制"
 WJ_tenure.1.t:0 "责成久任"
 WJ_tenure.1.desc:0 "[scope:wj_tenure_appointee.GetName]既已受任，朝廷当定其任期。官无久任，或难竟其功；然久守一职，亦将暂止升迁。是否令其留守本职？"
 WJ_tenure.normal:0 "依常制任职，不另限任期。"
 WJ_tenure.ten_years:0 "责成十年，俾竟其功。"
 WJ_tenure.lifetime:0 "长任其职，非奉新命不去。"
 WJ_tenure.2.t:0 "奉诏留任"
 WJ_tenure.2.desc:0 "朝廷令我留守本职，暂缓升迁与辞职，盼我成其政事。我可奉诏，也可辞谢；奉诏之后，仍可自行解除留任。"
 WJ_tenure.accept:0 "谨奉明诏。"
 WJ_tenure.decline:0 "愿依常制任职。"
 WJ_tenure.keep_office:0 "留任之命尚在，不行卸职。"
 WJ_tenure_prompts_off_decision:0 "关闭任命留任询问"
 WJ_tenure_prompts_off_decision_desc:0 "今后主动任命不再询问任期；现有留任不受影响。"
 WJ_tenure_prompts_on_decision:0 "开启任命留任询问"
 WJ_tenure_prompts_on_decision_desc:0 "今后主动任命地方官或内阁成员成功后，询问正常任职、留任十年或长任。"
 WJ_tenure_release_decision:0 "解除留任"
 WJ_tenure_release_decision_desc:0 "解除自己的留任要求，恢复正常调任和离任规则，不因此免官，也不改写剧情进度。"
 WJ_tenure_revoke_interaction:0 "撤销留任敕命"
 WJ_tenure_revoke_interaction_desc:0 "解除其留任要求，不因此免官；原有正式入仕资格仍保留。"
