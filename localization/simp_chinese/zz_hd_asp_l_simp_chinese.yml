l_simp_chinese:
 rule_hd_asp_rule:0 "历史志向"
 setting_hd_asp_rule_all:0 "#high 全部#!"
 setting_hd_asp_rule_all_desc:0 "曹操、刘备、孙氏等史实人物开局各得一张野望任务卡；玩家立志三选一，AI 循史实而行，达成者皆有赏。"
 setting_hd_asp_rule_player:0 "仅玩家"
 setting_hd_asp_rule_player_desc:0 "只有玩家扮演这些人物时才会立志，AI 不领任务卡。"
 setting_hd_asp_rule_off:0 "关闭"
 setting_hd_asp_rule_off_desc:0 "不发任何野望任务卡。"
 game_concept_hd_asp_aspiration:0 "野望"
 game_concept_hd_asp_aspiration_desc:0 "乱世之中，英雄各有所图。曹操、刘备、孙氏等史实人物开局可立一志：或循史书所载，或另辟蹊径。野望一经立下便不可更改；主要目标达成之日，便是壮志得酬之时，额外目标则是锦上添花。\n\n文中所说某州、某郡、某县「入你掌中」，指其在你的疆域之内，由你或你的封臣持有皆可。孙氏、马氏的野望可由族中后人继承。每逢岁首，自见分晓。\n\n文中「你方疆域」指你所效忠的顶头君主的疆域，你若独立便是你自己的疆域。"
 action_hd_asp_aspiration:0 "[GetPlayer.Custom('hd_asp_action_title')]"
 action_hd_asp_aspiration_desc:0 "[GetPlayer.Custom('hd_asp_action_desc')]\n\n#weak 每逢岁首，自见分晓。#!"
 action_hd_asp_aspiration_click:0 "#I 点击查看人物#!"
 hd_asp_action_title_fallback:0 "[hd_asp_aspiration|E]"
 hd_asp_action_desc_fallback:0 "你心中另有所图。"
 hd_asp_fulfilled_name_fallback:0 "夙愿"
 hd_asp_reward_small:0 "威望[EmptyScope.ScriptValue('hd_asp_prestige_small')|0]、金钱[EmptyScope.ScriptValue('hd_asp_gold_small')|0]、王朝声望[EmptyScope.ScriptValue('hd_asp_dynasty_prestige_small')|0]；天朝制者另得影响力[EmptyScope.ScriptValue('hd_asp_influence_small')|0]"
 hd_asp_reward_medium:0 "威望[EmptyScope.ScriptValue('hd_asp_prestige_medium')|0]、金钱[EmptyScope.ScriptValue('hd_asp_gold_medium')|0]、王朝声望[EmptyScope.ScriptValue('hd_asp_dynasty_prestige_medium')|0]；天朝制者另得影响力[EmptyScope.ScriptValue('hd_asp_influence_medium')|0]"
 hd_asp_reward_large:0 "威望[EmptyScope.ScriptValue('hd_asp_prestige_large')|0]、金钱[EmptyScope.ScriptValue('hd_asp_gold_large')|0]、王朝声望[EmptyScope.ScriptValue('hd_asp_dynasty_prestige_large')|0]；天朝制者另得影响力[EmptyScope.ScriptValue('hd_asp_influence_large')|0]"
 hd_asp_lb_empire_name:0 "汉"
 hd_asp_name_sun_changjiang:0 "竟长江所极"
 hd_asp_card_sun_changjiang:0 "野望：$hd_asp_name_sun_changjiang$"
 hd_asp_card_sun_changjiang_desc:0 "#high 主要目标#!\n· 独立称帝，扬州、荆州皆入你掌中\n#high 额外目标#!\n· 扬州入你掌中\n· 江夏郡入你掌中\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_jiangdong$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_sun_changjiang:0 "事见《三国志·吴书·鲁肃传》：鲁肃榻上献策，「竟长江所极，据而有之，然后建号帝王以图天下」。"
 hd_asp.0100.desc.sun_changjiang:0 "大江上下，自巴丘至吴会，尽是你的旌旗。当年榻上所言，今日一一应验，你南面称尊，与中原分庭抗礼。"
 hd_asp_name_sun_qinwang:0 "勤王复汉"
 hd_asp_card_sun_qinwang:0 "野望：$hd_asp_name_sun_qinwang$"
 hd_asp_card_sun_qinwang_desc:0 "#high 主要目标#!\n· 董卓已死，洛阳在你手中，汉天子仍在位\n#high 额外目标#!\n· 位列朝廷三公或将军\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_zhonglie$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.sun_qinwang:0 "国贼伏诛，旧都重光。你亲手扫除宗庙瓦砾，汉家天子仍坐在他的位子上，天下人都记得是谁为他扫清了道路。"
 hd_asp_name_sun_zhongyuan:0 "北图中原"
 hd_asp_card_sun_zhongyuan:0 "野望：$hd_asp_name_sun_zhongyuan$"
 hd_asp_card_sun_zhongyuan_desc:0 "#high 主要目标#!\n· 豫州、徐州皆入你掌中\n#high 额外目标#!\n· 袁术已死，或已向你称臣\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_zhongyuan$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.sun_zhongyuan:0 "淮泗之间、汝颍之地，尽归你麾下。江东子弟饮马中原，再无人敢说南人只能偏安一隅。"
 hd_asp_name_lx_baituo:0 "摆脱权臣"
 hd_asp_card_lx_baituo:0 "野望：$hd_asp_name_lx_baituo$"
 hd_asp_card_lx_baituo_desc:0 "#high 主要目标#!\n· 你仍是天子，且朝中再无权臣挟制\n#high 额外目标#!\n· 曾挟制天子的权臣死于非命\n· 都城定于洛阳\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_qinzheng$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_lx_baituo:0 "事见《后汉书·孝献帝纪》：天子密授衣带诏，又自长安东归洛阳。"
 hd_asp.0100.desc.lx_baituo:0 "宫门终于由你自己打开。诏令出于御前，百官奏事不必再先向权臣府上递帖。你坐在殿上，第一次觉得这把御座是你的。"
 hd_asp_name_lx_zhongxing:0 "中兴汉室"
 hd_asp_card_lx_zhongxing:0 "野望：$hd_asp_name_lx_zhongxing$"
 hd_asp_card_lx_zhongxing_desc:0 "#high 主要目标#!\n· 你仍是天子，汉家疆域至少六州归心\n#high 额外目标#!\n· 天下再无他人僭称帝号\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_zhongxing$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.lx_zhongxing:0 "四方诸侯重新奉上正朔，郡国的计吏又一次风尘仆仆赶来上计。人们说，这是光武之后又一回中兴。"
 hd_asp_name_lx_zongmiao:0 "保全宗庙"
 hd_asp_card_lx_zongmiao:0 "野望：$hd_asp_name_lx_zongmiao$"
 hd_asp_card_lx_zongmiao_desc:0 "#high 主要目标#!\n· 年届五十，刘氏宗亲仍有封国\n#high 额外目标#!\n· 学识臻于十五\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_anming$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.lx_zongmiao:0 "风雨半生，你终究活了下来，刘氏的香火也没有断绝。有人笑你怯懦，你却知道，能在这乱世里守住宗庙，已属不易。"
 hd_asp_name_lb_xingfu:0 "兴复汉室"
 hd_asp_card_lb_xingfu:0 "野望：$hd_asp_name_lb_xingfu$"
 hd_asp_card_lb_xingfu_desc:0 "#high 主要目标#!\n· 独立，洛阳、长安两京皆在你手中\n#high 额外目标#!\n· 荆州、益州皆入你掌中\n· 称帝\n· 汉中郡入你掌中\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_rende$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_lb_xingfu:0 "事见《三国志·蜀书·诸葛亮传》：隆中对曰「跨有荆、益……则霸业可成，汉室可兴矣」。"
 hd_asp_name_lb_xuzhou:0 "据徐州成霸业"
 hd_asp_card_lb_xuzhou:0 "野望：$hd_asp_name_lb_xuzhou$"
 hd_asp_card_lb_xuzhou_desc:0 "#high 主要目标#!\n· 独立，徐州入你掌中\n#high 额外目标#!\n· 袁术已死，或失尽领地\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_xuzhoumu$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.lb_xuzhou:0 "陶公当年的托付，你没有辜负。淮泗之间兵精粮足，四方豪杰都在议论：徐州有主了。"
 hd_asp_name_lb_zhongchen:0 "为汉忠臣"
 hd_asp_card_lb_zhongchen:0 "野望：$hd_asp_name_lb_zhongchen$"
 hd_asp_card_lb_zhongchen_desc:0 "#high 主要目标#!\n· 位列朝廷三公（含大将军），且天子不受权臣挟制\n#high 额外目标#!\n· 曾挟制天子的权臣已死\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_hanshi_zhushi$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.lb_zhongchen:0 "你立于百官之首，天子执你之手，称你为汉室柱石。当年衣带诏上的名字，如今只剩你还站在这里。"
 hd_asp_name_cc_tongyi:0 "一统天下"
 hd_asp_card_cc_tongyi:0 "野望：$hd_asp_name_cc_tongyi$"
 hd_asp_card_cc_tongyi_desc:0 "#high 主要目标#!\n· 汉十三州至少十一州入你掌中\n#high 额外目标#!\n· 你是挟天子的权臣\n· 北方八州（冀、青、幽、并、兖、豫、徐、司隶）至少五州入你掌中\n· 受九锡，或封公、封王\n· 辽西郡入你掌中（北征乌桓）\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_tianxia_guixin$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_cc_tongyi:0 "曹操《短歌行》：「周公吐哺，天下归心。」建安十三年，挥师南下荆州。"
 hd_asp.0100.desc.cc_tongyi:0 "四海之内，旌旗所指，莫不宾服。你登高望远，想起少年时只盼封侯作征西将军，不禁失笑。周公吐哺，天下归心，原来是这般滋味。"
 hd_asp_name_cc_zhengxi:0 "汉征西将军"
 hd_asp_card_cc_zhengxi:0 "野望：$hd_asp_name_cc_zhengxi$"
 hd_asp_card_cc_zhengxi_desc:0 "#high 主要目标#!\n· 身为天子麾下的将军，凉州入你掌中，汉天子仍在位\n#high 额外目标#!\n· 功成之时，未称帝，亦未受九锡、封公王\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_han_zhongchen$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.cc_zhengxi:0 "羌乱平定，凉州安堵。你早已想好墓前的题字：汉故征西将军曹侯之墓。"
 hd_asp_name_cc_daihan:0 "代汉自立"
 hd_asp_card_cc_daihan:0 "野望：$hd_asp_name_cc_daihan$"
 hd_asp_card_cc_daihan_desc:0 "#high 主要目标#!\n· 称帝\n#high 额外目标#!\n· 洛阳或长安在你手中\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_weiwu$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.cc_daihan:0 "汉祚四百年，到你手中画上了句号。群臣山呼万岁，你却想起那些死在路上的旧友，一时无言。"
 hd_asp_name_yshao_zhengtianxia:0 "南向以争天下"
 hd_asp_card_yshao_zhengtianxia:0 "野望：$hd_asp_name_yshao_zhengtianxia$"
 hd_asp_card_yshao_zhengtianxia_desc:0 "#high 主要目标#!\n· 独立，冀、青、幽、并四州皆入你掌中\n#high 额外目标#!\n· 曹操已死，或已向你称臣\n· 你是挟天子的权臣\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_hebei$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_yshao_zhengtianxia:0 "事见《三国志·魏书·武帝纪》：袁绍谓曹操曰「吾南据河，北阻燕、代，兼戎狄之众，南向以争天下」。"
 hd_asp.0100.desc.yshao_zhengtianxia:0 "南据大河，北阻燕代，兼有戎狄之众。当年你在酸枣对孟德说的话，如今都成了真。天下英雄，谁还敢与袁氏争锋？"
 hd_asp_name_yshao_yongli:0 "拥立新君"
 hd_asp_card_yshao_yongli:0 "野望：$hd_asp_name_yshao_yongli$"
 hd_asp_card_yshao_yongli_desc:0 "#high 主要目标#!\n· 一位刘氏宗亲称帝，而你是他的臣属或挟天子的权臣\n#high 额外目标#!\n· 这位新君对你的好感不低于五十\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_dingce$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.yshao_yongli:0 "新君登基那日，执你之手不放。满朝文武都知道，这位天子是谁扶上去的。"
 hd_asp_name_yshao_chengdi:0 "代汉称帝"
 hd_asp_card_yshao_chengdi:0 "野望：$hd_asp_name_yshao_chengdi$"
 hd_asp_card_yshao_chengdi_desc:0 "#high 主要目标#!\n· 称帝\n#high 额外目标#!\n· 洛阳或长安在你手中\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_sishi_sangong$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.yshao_chengdi:0 "四世三公，终至九五之尊。袁氏门生故吏遍于天下，此刻无不俯首称臣。"
 hd_asp_name_yshu_zhongjia:0 "代汉称帝"
 hd_asp_card_yshu_zhongjia:0 "野望：$hd_asp_name_yshu_zhongjia$"
 hd_asp_card_yshu_zhongjia_desc:0 "#high 主要目标#!\n· 称帝，且扬州或豫州入你掌中\n#high 额外目标#!\n· 传国玉玺在你手中\n· 徐州入你掌中\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_zhongjia$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_yshu_zhongjia:0 "事见《三国志·魏书·袁术传》：建安二年，袁术于寿春称帝，号仲家。"
 hd_asp.0100.desc.yshu_zhongjia:0 "谶语应验，你登坛告天，国号仲家。只是阶下群臣的山呼声里，似乎少了几分真心。"
 hd_asp_name_yshu_huainan:0 "淮南霸主"
 hd_asp_card_yshu_huainan:0 "野望：$hd_asp_name_yshu_huainan$"
 hd_asp_card_yshu_huainan_desc:0 "#high 主要目标#!\n· 不称帝，扬州、豫州皆入你掌中\n#high 额外目标#!\n· 吕布或刘备失尽领地\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_huainan$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.yshu_huainan:0 "淮南膏腴之地尽在掌中，府库堆满钱粮。你终于明白，比起一顶冠冕，实打实的地盘才是根本。"
 hd_asp_name_yshu_yuanmen:0 "袁门之首"
 hd_asp_card_yshu_yuanmen:0 "野望：$hd_asp_name_yshu_yuanmen$"
 hd_asp_card_yshu_yuanmen_desc:0 "#high 主要目标#!\n· 袁绍已死，或已向你称臣\n#high 额外目标#!\n· 冀州任一郡入你掌中\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_sishi_sangong$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.yshu_yuanmen:0 "那个婢女所生的庶兄，终究没能压过你。从今往后，提起汝南袁氏，人们先想到的是你的名字。"
 hd_asp_name_ma_guanxi:0 "雄踞关西"
 hd_asp_card_ma_guanxi:0 "野望：$hd_asp_name_ma_guanxi$"
 hd_asp_card_ma_guanxi_desc:0 "#high 主要目标#!\n· 独立，凉州入你掌中\n#high 额外目标#!\n· 长安在你手中\n· 韩遂已死，或已向你称臣\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_xiliang$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_ma_guanxi:0 "事见《三国志·蜀书·马超传》：马腾割据凉州，马超起兵关中，战于潼关。"
 hd_asp.0100.desc.ma_guanxi:0 "凉州的烽燧都举着马家的旗号，羌、氐诸部的酋长牵着马来拜见你。关西之地，从此只有一个声音。"
 hd_asp_name_ma_fubo:0 "伏波遗风"
 hd_asp_card_ma_fubo:0 "野望：$hd_asp_name_ma_fubo$"
 hd_asp_card_ma_fubo_desc:0 "#high 主要目标#!\n· 身为天子麾下的将军，凉州入你掌中，凉州境内再无自立的羌、氐首领\n#high 额外目标#!\n· 天子不受权臣挟制\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_fubo$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.ma_fubo:0 "西陲平定，羌、氐诸部或降或散。你在祖先马援的祠前上香，心想总算没有辱没伏波将军的家声。"
 hd_asp_name_ma_bashu:0 "西取巴蜀"
 hd_asp_card_ma_bashu:0 "野望：$hd_asp_name_ma_bashu$"
 hd_asp_card_ma_bashu_desc:0 "#high 主要目标#!\n· 独立，汉中郡与益州皆入你掌中\n#high 额外目标#!\n· 张鲁、刘焉或刘璋之中，有人失尽领地\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_rushu$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.ma_bashu:0 "西凉铁骑越过秦岭，踏进了天府之国。蜀道虽难，终究挡不住马家的兵锋。"
 hd_asp_name_lc_baojing:0 "保境安民"
 hd_asp_card_lc_baojing:0 "野望：$hd_asp_name_lc_baojing$"
 hd_asp_card_lc_baojing_desc:0 "#high 主要目标#!\n· 董卓已死，陈郡仍在你手中，且你从未向袁术称臣\n#high 额外目标#!\n· 陈郡诸县平均发展度达到二十\n· 活过建安二年（197 年）\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_chenwang_qiangnu$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_lc_baojing:0 "事见《后汉书·孝明八王列传》：陈王刘宠善弩，黄巾起时郡县多弃城而走，陈国独得保全，百姓归之者十余万。"
 hd_asp.0100.desc.lc_baojing:0 "外面的世道换了几轮，陈国的城门始终没有被攻破。百姓说，有陈王在，就有一口安稳饭吃。"
 hd_asp_name_lc_jitong:0 "宗室继统"
 hd_asp_card_lc_jitong:0 "野望：$hd_asp_name_lc_jitong$"
 hd_asp_card_lc_jitong_desc:0 "#high 主要目标#!\n· 以刘氏宗亲之身称帝\n#high 额外目标#!\n· 洛阳或长安在你手中\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_guangwu$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.lc_jitong:0 "宗室之中，终究是你接过了这份大统。你想起光武皇帝也是从宗室旁支起身，不由得挺直了腰背。"
 hd_asp_name_lc_yuzhou:0 "豫州之主"
 hd_asp_card_lc_yuzhou:0 "野望：$hd_asp_name_lc_yuzhou$"
 hd_asp_card_lc_yuzhou_desc:0 "#high 主要目标#!\n· 独立，豫州入你掌中\n#high 额外目标#!\n· 袁术失尽领地\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_chenwang_qiangnu$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.lc_yuzhou:0 "陈国的强弩手跟着你走出了城墙，汝颍诸郡一一归附。豫州之地，如今都知道陈王的名号。"
 hd_asp_name_zgl_beiding:0 "北定中原"
 hd_asp_card_zgl_beiding:0 "野望：$hd_asp_name_zgl_beiding$"
 hd_asp_card_zgl_beiding_desc:0 "#high 主要目标#!\n· 长安、洛阳皆在你方疆域\n#high 额外目标#!\n· 任丞相\n· 南中诸郡（越巂、建宁、永昌、牂牁）皆在你方疆域\n· 天水郡在你方疆域\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_wolong$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_zgl_beiding:0 "事见诸葛亮《出师表》：「奖率三军，北定中原……兴复汉室，还于旧都。」"
 hd_asp.0100.desc.zgl_beiding:0 "旧都的宫阙重见汉家旌旗。你立在长安城头，想起当年隆中草庐里那番话，二十年间，一字一句都兑现了。"
 hd_asp_name_zgl_longzhong:0 "隆中之对"
 hd_asp_card_zgl_longzhong:0 "野望：$hd_asp_name_zgl_longzhong$"
 hd_asp_card_zgl_longzhong_desc:0 "#high 主要目标#!\n· 荆州、益州皆在你方疆域\n#high 额外目标#!\n· 你方君主与孙权（或孙氏后人）结盟\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_sanfen$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.zgl_longzhong:0 "跨有荆、益，保其岩阻，外结孙权，内修政理。草庐中画下的那幅天下图，如今已摊在你主公的案头。"
 hd_asp_name_zgl_jugong:0 "鞠躬尽瘁"
 hd_asp_card_zgl_jugong:0 "野望：$hd_asp_name_zgl_jugong$"
 hd_asp_card_zgl_jugong_desc:0 "#high 主要目标#!\n· 任丞相，年满五十四时你方仍据有益州\n#high 额外目标#!\n· 学识达到二十\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_jugong$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.zgl_jugong:0 "案上的文书仍堆得老高，你却已鬓发斑白。先帝托付的家国还在，你也还在，这便够了。"
 hd_asp_name_gy_weizhen:0 "威震华夏"
 hd_asp_card_gy_weizhen:0 "野望：$hd_asp_name_gy_weizhen$"
 hd_asp_card_gy_weizhen_desc:0 "#high 主要目标#!\n· 襄阳郡、南阳郡皆在你方疆域，且你仍事刘氏\n#high 额外目标#!\n· 于禁或庞德已死，或在你方牢中\n· 颍川郡（许都）在你方疆域\n· 南郡（江陵）在你方疆域\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_wusheng$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_gy_weizhen:0 "事见《三国志·蜀书·关羽传》：「羽威震华夏，曹公议徙许都以避其锐。」"
 hd_asp.0100.desc.gy_weizhen:0 "汉水暴涨，七军尽没。樊城、宛城望风而降，许都的人们夜里都在谈论你的名字。"
 hd_asp_name_gy_yibo:0 "义薄云天"
 hd_asp_card_gy_yibo:0 "野望：$hd_asp_name_gy_yibo$"
 hd_asp_card_gy_yibo_desc:0 "#high 主要目标#!\n· 年满六十，仍事刘氏（刘备或其后嗣）\n#high 额外目标#!\n· 张飞仍在世\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_yijue$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.gy_yibo:0 "桃园旧誓，半生不渝。你已鬓发如霜，身边仍是当年那几张熟悉的面孔。"
 hd_asp_name_gy_jingzhou:0 "荆州之主"
 hd_asp_card_gy_jingzhou:0 "野望：$hd_asp_name_gy_jingzhou$"
 hd_asp_card_gy_jingzhou_desc:0 "#high 主要目标#!\n· 你持有荆州州级头衔，且荆州全境在你方疆域\n#high 额外目标#!\n· 江夏郡、长沙郡皆在你方疆域\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_zhenjing$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.gy_jingzhou:0 "江陵、襄阳、长沙、武陵，荆楚之地尽在你的掌握。北人不敢南顾，东吴也只能望江兴叹。"
 hd_asp_name_jw_jiufa:0 "九伐中原"
 hd_asp_card_jw_jiufa:0 "野望：$hd_asp_name_jw_jiufa$"
 hd_asp_card_jw_jiufa_desc:0 "#high 主要目标#!\n· 凉州与长安皆在你方疆域，且你仍事刘氏\n#high 额外目标#!\n· 天水郡（故里）在你方疆域\n· 任大将军\n· 司马师或司马昭已死\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_liangzhou_shangshi$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_jw_jiufa:0 "事见《三国志·蜀书·姜维传》：姜维欲诱诸羌、胡以为羽翼，「谓自陇以西可断而有也」。"
 hd_asp.0100.desc.jw_jiufa:0 "陇右诸郡尽复，长安城头又插上了汉家的旗帜。丞相若在，也该笑了。"
 hd_asp_name_jw_baoshu:0 "保守巴蜀"
 hd_asp_card_jw_baoshu:0 "野望：$hd_asp_name_jw_baoshu$"
 hd_asp_card_jw_baoshu_desc:0 "#high 主要目标#!\n· 二七〇年时，刘氏君主仍据有成都与汉中郡，你仍事其主\n#high 额外目标#!\n· 武都郡、阴平郡皆在你方疆域\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_jiange$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.jw_baoshu:0 "剑阁依旧，成都依旧。你守了一辈子，蜀汉的宗庙终究没有断了香火。"
 hd_asp_name_jw_fuhan:0 "复汉之谋"
 hd_asp_card_jw_fuhan:0 "野望：$hd_asp_name_jw_fuhan$"
 hd_asp_card_jw_fuhan_desc:0 "#high 主要目标#!\n· 钟会已死或已称臣，且一位刘氏宗亲独立并据有成都\n#high 额外目标#!\n· 邓艾已死\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_guzhong$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.jw_fuhan:0 "社稷危而复安，日月幽而复明。你那封密信里的话，竟真的应验了。"
 hd_asp_name_sm_jinji:0 "晋室之基"
 hd_asp_card_sm_jinji:0 "野望：$hd_asp_name_sm_jinji$"
 hd_asp_card_sm_jinji_desc:0 "#high 主要目标#!\n· 曹氏天子受你挟制，且你受九锡、封公王\n#high 额外目标#!\n· 曹爽已死\n· 王凌、毌丘俭、诸葛诞皆已死\n· 刘氏不再持有成都\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_yingshi_langgu$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_sm_jinji:0 "事见习凿齿《汉晋春秋》：魏帝曹髦愤然曰「司马昭之心，路人所知也」。"
 hd_asp.0100.desc.sm_jinji:0 "九锡加身，王爵在握。洛阳城里人人都知道，魏室的江山已经换了主人，只差一道禅让的诏书。"
 hd_asp_name_sm_zhushi:0 "魏之柱石"
 hd_asp_card_sm_zhushi:0 "野望：$hd_asp_name_sm_zhushi$"
 hd_asp_card_sm_zhushi_desc:0 "#high 主要目标#!\n· 位列三公（含大将军），曹氏天子仍在位且天下至少九州归心\n#high 额外目标#!\n· 诸葛亮或姜维已死\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_sheji$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.sm_zhushi:0 "你历事数朝，始终站在魏室这边。朝臣们说，魏有今日，半是先帝之功，半是你的功劳。"
 hd_asp_name_sm_hunyi:0 "混一天下"
 hd_asp_card_sm_hunyi:0 "野望：$hd_asp_name_sm_hunyi$"
 hd_asp_card_sm_hunyi_desc:0 "#high 主要目标#!\n· 益州、扬州皆在你方疆域\n#high 额外目标#!\n· 成都在你方疆域\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_hunyi_gong$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.sm_hunyi:0 "蜀道已通，大江已渡，三分的天下又合在了一起。百年乱世，到你这一代终于结束了。"
 hd_asp_name_zh_jushu:0 "据蜀之志"
 hd_asp_card_zh_jushu:0 "野望：$hd_asp_name_zh_jushu$"
 hd_asp_card_zh_jushu_desc:0 "#high 主要目标#!\n· 你亲自持有成都所在的蜀郡\n#high 额外目标#!\n· 邓艾已死，或在你牢中\n· 姜维是你的臣属\n· 汉中郡入你掌中\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_zifang$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_zh_jushu:0 "事见《三国志·魏书·钟会传》：钟会「自谓功名盖世，不可复为人下」。"
 hd_asp.0100.desc.zh_jushu:0 "成都城在你脚下，蜀中的兵马、钱粮都归你调度。你忽然觉得，自己不该再为人下。"
 hd_asp_name_zh_mieshu:0 "灭蜀首功"
 hd_asp_card_zh_mieshu:0 "野望：$hd_asp_name_zh_mieshu$"
 hd_asp_card_zh_mieshu_desc:0 "#high 主要目标#!\n· 成都在你方疆域，且你受九锡或封公王\n#high 额外目标#!\n· 刘禅已归魏或已死\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_mieshu$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.zh_mieshu:0 "蜀汉的降表送到了洛阳，你的名字写在灭蜀功臣的第一行。"
 hd_asp_name_zh_wangzuo:0 "王佐之才"
 hd_asp_card_zh_wangzuo:0 "野望：$hd_asp_name_zh_wangzuo$"
 hd_asp_card_zh_wangzuo_desc:0 "#high 主要目标#!\n· 任三公或尚书令，且学识达到十八\n#high 额外目标#!\n· 学识达到二十二\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_wangzuo$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.zh_wangzuo:0 "朝中大事，多出你的谋划。人们说钟太傅后继有人，你却只想着更远的地方。"
 hd_asp_name_xiu_zhongxing:0 "光武中兴"
 hd_asp_card_xiu_zhongxing:0 "野望：$hd_asp_name_xiu_zhongxing$"
 hd_asp_card_xiu_zhongxing_desc:0 "#high 主要目标#!\n· 称帝，且洛阳在你手中\n#high 额外目标#!\n· 冀州、幽州皆入你掌中\n· 王莽已死\n· 隗嚣、公孙述皆已死，或已称臣\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_guangwu_di$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_xiu_zhongxing:0 "事见《后汉书·光武帝纪》：赤伏符曰「刘秀发兵捕不道，四夷云集龙斗野，四七之际火为主」。"
 hd_asp.0100.desc.xiu_zhongxing:0 "汉家的旗帜重新插上了洛阳城头。当年骑牛从军的南阳书生，如今受百官朝拜。"
 hd_asp_name_xiu_gengshi:0 "更始功臣"
 hd_asp_card_xiu_gengshi:0 "野望：$hd_asp_name_xiu_gengshi$"
 hd_asp_card_xiu_gengshi_desc:0 "#high 主要目标#!\n· 为更始帝刘玄之臣，位列三公（含大司马），且南阳郡在你方疆域\n#high 额外目标#!\n· 刘縯仍在世\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_gengshi$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.xiu_gengshi:0 "更始帝在殿上宣读你的功劳，兄长伯升站在你身旁。舂陵刘氏兄弟，终于在新朝站稳了脚跟。"
 hd_asp_name_xiu_lihua:0 "娶妻当得阴丽华"
 hd_asp_card_xiu_lihua:0 "野望：$hd_asp_name_xiu_lihua$"
 hd_asp_card_xiu_lihua_desc:0 "#high 主要目标#!\n· 娶阴丽华为妻，且身居朝廷要职或有将军号\n#high 额外目标#!\n· 与阴丽华生有子嗣\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_kangli$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_xiu_lihua:0 "事见《后汉书·皇后纪》：光武闻阴丽华美，叹曰「仕宦当作执金吾，娶妻当得阴丽华」。"
 hd_asp.0100.desc.xiu_lihua:0 "少年时随口一句心愿，如今都成了真。官做到了，人也娶到了，你已别无所求。"
 hd_asp_name_lyuan_shaohan:0 "绍汉"
 hd_asp_card_lyuan_shaohan:0 "野望：$hd_asp_name_lyuan_shaohan$"
 hd_asp_card_lyuan_shaohan_desc:0 "#high 主要目标#!\n· 称帝，且平阳郡与洛阳皆在你手中\n#high 额外目标#!\n· 并州全境入你掌中\n· 司马氏不再持有霸权\n· 长安在你手中\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_shaohan$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_lyuan_shaohan:0 "事见《晋书·刘元海载记》：刘渊曰「吾又汉氏之甥，约为兄弟，兄亡弟绍，不亦可乎」。"
 hd_asp.0100.desc.lyuan_shaohan:0 "你在平阳登坛告天，追尊刘禅为孝怀皇帝，立汉家三祖五宗的神主而祭之。汉的国号，在匈奴人手里又续上了。"
 hd_asp_name_lyuan_huhanye:0 "呼韩邪之业"
 hd_asp_card_lyuan_huhanye:0 "野望：$hd_asp_name_lyuan_huhanye$"
 hd_asp_card_lyuan_huhanye_desc:0 "#high 主要目标#!\n· 独立，并州全境入你掌中\n#high 额外目标#!\n· 拓跋氏已无自立之主\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_chanyu$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.lyuan_huhanye:0 "五部匈奴尽归麾下，并州的草场与城池都属于你。呼韩邪单于的子孙，又成了北方的主人。"
 hd_asp_name_lyuan_fanping:0 "晋之藩屏"
 hd_asp_card_lyuan_fanping:0 "野望：$hd_asp_name_lyuan_fanping$"
 hd_asp_card_lyuan_fanping_desc:0 "#high 主要目标#!\n· 仍为晋臣，位列三公或有将军号，且并州至少三郡入你掌中\n#high 额外目标#!\n· 学识达到十五\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_jin_fanping$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.lyuan_fanping:0 "晋室诸王争斗不休，你却稳稳守着并州。朝廷倚重你，五部也服你，这条路未必比称王更差。"
 hd_asp_name_zt_jiji:0 "中流击楫"
 hd_asp_card_zt_jiji:0 "野望：$hd_asp_name_zt_jiji$"
 hd_asp_card_zt_jiji_desc:0 "#high 主要目标#!\n· 豫州全境皆在你方疆域，且你仍为晋臣\n#high 额外目标#!\n· 谯县在你方疆域\n· 石勒不再持有豫州任何县\n· 刘琨仍在世\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_jiji$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_zt_jiji:0 "事见《晋书·祖逖传》：祖逖渡江，中流击楫而誓曰「祖逖不能清中原而复济者，有如大江」。"
 hd_asp.0100.desc.zt_jiji:0 "黄河以南尽为晋土，石勒的骑兵不敢再南下牧马。当年在大江中流击楫立誓，今日总算没有食言。"
 hd_asp_name_zt_fuluo:0 "北伐复洛"
 hd_asp_card_zt_fuluo:0 "野望：$hd_asp_name_zt_fuluo$"
 hd_asp_card_zt_fuluo_desc:0 "#high 主要目标#!\n· 洛阳在你方疆域，且你方君主为晋室\n#high 额外目标#!\n· 你持有豫州州级头衔\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_fuluo$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.zt_fuluo:0 "洛阳宫阙虽已残破，晋室的旗帜终究回到了故都。北地遗民扶老携幼，出城迎接王师。"
 hd_asp_name_zt_fanyang:0 "范阳之望"
 hd_asp_card_zt_fanyang:0 "野望：$hd_asp_name_zt_fanyang$"
 hd_asp_card_zt_fanyang_desc:0 "#high 主要目标#!\n· 持有至少三个郡，且涿郡（晋范阳国）在你方疆域\n#high 额外目标#!\n· 刘琨仍在世\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_fanyang_zu$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.zt_fanyang:0 "范阳祖氏的门楣，在你手里又光大了几分。故乡父老说起你，都说祖家出了个豪杰。"
 hd_asp_name_lk_gushou:0 "孤守并州"
 hd_asp_card_lk_gushou:0 "野望：$hd_asp_name_lk_gushou$"
 hd_asp_card_lk_gushou_desc:0 "#high 主要目标#!\n· 你持有太原郡与并州州级头衔，仍为晋臣，且未向刘渊或石勒称臣\n#high 额外目标#!\n· 刘渊已死\n· 拓跋氏与你结盟\n· 祖逖仍在世\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_zhenge$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_lk_gushou:0 "事见《晋书·刘琨传》：刘琨与亲故书曰「吾枕戈待旦，志枭逆虏，常恐祖生先吾著鞭」。"
 hd_asp.0100.desc.lk_gushou:0 "晋阳城外胡骑环伺，城头的晋旗却始终未倒。你在月下吹笳，胡人闻之流涕，竟弃围而去。"
 hd_asp_name_lk_liangjing:0 "收复两京"
 hd_asp_card_lk_liangjing:0 "野望：$hd_asp_name_lk_liangjing$"
 hd_asp_card_lk_liangjing_desc:0 "#high 主要目标#!\n· 洛阳、长安皆在你方疆域，且你方君主为晋室\n#high 额外目标#!\n· 刘聪已死\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_liangjing$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.lk_liangjing:0 "两京重归晋土。你站在洛阳残破的城楼上，想起金谷园里饮酒赋诗的旧友，已经所剩无几。"
 hd_asp_name_lk_fufeng:0 "扶风之歌"
 hd_asp_card_lk_fufeng:0 "野望：$hd_asp_name_lk_fufeng$"
 hd_asp_card_lk_fufeng_desc:0 "#high 主要目标#!\n· 外交与学识皆达到十五，且并州至少两郡入你掌中\n#high 额外目标#!\n· 段匹磾或拓跋氏与你结盟\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_fufeng$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.lk_fufeng:0 "你以诗文名动一时，又以信义结交胡汉诸部。乱世之中，竟也守住了一方安宁。"
 hd_asp_name_hw_sanfa:0 "三伐北土"
 hd_asp_card_hw_sanfa:0 "野望：$hd_asp_name_hw_sanfa$"
 hd_asp_card_hw_sanfa_desc:0 "#high 主要目标#!\n· 成都与洛阳皆在你手中\n#high 额外目标#!\n· 益州全境入你掌中（灭成汉）\n· 长安在你手中\n· 受九锡，或封公王\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_xuanwu$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_hw_sanfa:0 "事见《晋书·桓温传》：桓温抚枕而起曰「既不能流芳后世，不足复遗臭万载邪」。"
 hd_asp.0100.desc.hw_sanfa:0 "西平巴蜀，北复洛阳。你行经金城，见当年亲手所种的柳树已有十围，攀枝执条，泫然流涕：木犹如此，人何以堪！"
 hd_asp_name_hw_jingchu:0 "荆楚之主"
 hd_asp_card_hw_jingchu:0 "野望：$hd_asp_name_hw_jingchu$"
 hd_asp_card_hw_jingchu_desc:0 "#high 主要目标#!\n· 荆州、益州皆入你掌中，且你持有荆州州级头衔\n#high 额外目标#!\n· 襄阳郡入你掌中\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_jingchu$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.hw_jingchu:0 "上游之地尽归你手，建康的朝廷每有大事，都要先问一声荆州的意思。"
 hd_asp_name_hw_tongyi:0 "一统天下"
 hd_asp_card_hw_tongyi:0 "野望：$hd_asp_name_hw_tongyi$"
 hd_asp_card_hw_tongyi_desc:0 "#high 主要目标#!\n· 汉十三州至少十一州在你方疆域，且你方君主为晋室\n#high 额外目标#!\n· 洛阳、长安皆在你方疆域\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_hunyi_yunei$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.hw_tongyi:0 "南渡以来，晋室第一次重新拥有了天下。人们说起这番功业，都要提到你的名字。"
 hd_asp_name_yh_beizheng:0 "北征许洛"
 hd_asp_card_yh_beizheng:0 "野望：$hd_asp_name_yh_beizheng$"
 hd_asp_card_yh_beizheng_desc:0 "#high 主要目标#!\n· 颍川郡（许昌）与洛阳皆在你方疆域，且你方君主为晋室\n#high 额外目标#!\n· 寿春郡在你方疆域\n· 姚襄已死，或已向你称臣\n· 桓温不是你的君主，且未持有扬州州级头衔\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_fengliu$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_yh_beizheng:0 "事见《晋书·殷浩传》：永和年间，殷浩都督五州军事，上疏北征许、洛。"
 hd_asp.0100.desc.yh_beizheng:0 "许、洛相继光复，朝野都说殷深源不负众望。那些背后讥你只会清谈的人，如今都闭上了嘴。"
 hd_asp_name_yh_qingyan:0 "清言之宗"
 hd_asp_card_yh_qingyan:0 "野望：$hd_asp_name_yh_qingyan$"
 hd_asp_card_yh_qingyan_desc:0 "#high 主要目标#!\n· 学识达到十八，且威望等级达到三级\n#high 额外目标#!\n· 位列三公或任尚书令\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_qingtan$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.yh_qingyan:0 "清谈之席，你一开口，满座无声。江左名士都以与你对谈为荣。"
 hd_asp_name_yh_yangzhou:0 "扬州之重"
 hd_asp_card_yh_yangzhou:0 "野望：$hd_asp_name_yh_yangzhou$"
 hd_asp_card_yh_yangzhou_desc:0 "#high 主要目标#!\n· 你持有扬州州级头衔，且桓温不是你的君主\n#high 额外目标#!\n· 丹阳郡（建康）在你方疆域\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_yangzhou_zhong$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.yh_yangzhou:0 "扬州是朝廷的根本，如今牢牢握在你的手里。荆州的桓温再强，也不敢轻易东下。"
 hd_asp_name_fj_hunyi:0 "混一六合"
 hd_asp_card_fj_hunyi:0 "野望：$hd_asp_name_fj_hunyi$"
 hd_asp_card_fj_hunyi_desc:0 "#high 主要目标#!\n· 称尊号（以大秦天王或皇帝之号：持天下霸权，或以帝国为主头衔并行践祚之礼），且汉十三州至少十一州入你掌中\n#high 额外目标#!\n· 前燕已亡（慕容暐失尽领地或已称臣）\n· 前凉、代国皆亡（张天锡、拓跋什翼犍失尽领地或已称臣）\n· 王猛在世，且任你的丞相\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_qin_tianwang$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_fj_hunyi:0 "事见《晋书·苻坚载记》：苻坚曰「吾统承大业垂二十载……今四方略定，惟东南一隅未宾王化」。"
 hd_asp.0100.desc.fj_hunyi:0 "四海之内，车同轨，书同文。你登上长安城楼，望着万国来朝，觉得自己终于不负天王之号。"
 hd_asp_name_fj_guanzhong:0 "关中之治"
 hd_asp_card_fj_guanzhong:0 "野望：$hd_asp_name_fj_guanzhong$"
 hd_asp_card_fj_guanzhong_desc:0 "#high 主要目标#!\n· 雍州全境与长安皆在你掌中，且治国达到十五\n#high 额外目标#!\n· 王猛在世，且任你的丞相\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_guanzhong_zhi$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.fj_guanzhong:0 "关中百姓夜不闭户，长安通往各州的大路两旁都种上了槐柳。人们唱道：长安大街，夹树杨槐。"
 hd_asp_name_fj_beifang:0 "北方一统"
 hd_asp_card_fj_beifang:0 "野望：$hd_asp_name_fj_beifang$"
 hd_asp_card_fj_beifang_desc:0 "#high 主要目标#!\n· 冀、幽、并、雍、凉、司六州皆入你掌中\n#high 额外目标#!\n· 前燕已亡\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_beitu$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.fj_beifang:0 "黄河南北、长城内外，都是大秦的疆土。自永嘉之乱以来，北方第一次重归一统。"
 hd_asp_name_lyu_qitun:0 "气吞万里"
 hd_asp_card_lyu_qitun:0 "野望：$hd_asp_name_lyu_qitun$"
 hd_asp_card_lyu_qitun_desc:0 "#high 主要目标#!\n· 洛阳、长安皆在你手中\n#high 额外目标#!\n· 桓玄已死\n· 南燕已亡（慕容超失尽领地或已死）\n· 后秦已亡（姚泓失尽领地或已死）\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_qitun$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_lyu_qitun:0 "辛弃疾《永遇乐·京口北固亭怀古》：「想当年，金戈铁马，气吞万里如虎。」"
 hd_asp.0100.desc.lyu_qitun:0 "两京光复，关中父老箪食壶浆以迎王师。一个卖履出身的京口寄奴，走到了这一步。"
 hd_asp_name_lyu_kuangfu:0 "匡复晋室"
 hd_asp_card_lyu_kuangfu:0 "野望：$hd_asp_name_lyu_kuangfu$"
 hd_asp_card_lyu_kuangfu_desc:0 "#high 主要目标#!\n· 桓玄已死，司马氏重掌霸权，且你位列三公（含大将军）\n#high 额外目标#!\n· 卢循已死\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_zaizao$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.lyu_kuangfu:0 "篡位的桓玄已死，晋室天子重回建康。满朝文武都知道，这一切是谁的功劳。"
 hd_asp_name_lyu_beifu:0 "北府之主"
 hd_asp_card_lyu_beifu:0 "野望：$hd_asp_name_lyu_beifu$"
 hd_asp_card_lyu_beifu_desc:0 "#high 主要目标#!\n· 你持有扬州州级头衔，且毗陵郡（京口）入你掌中\n#high 额外目标#!\n· 徐州全境入你掌中\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_beifu$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.lyu_beifu:0 "京口的北府兵只听你一人号令。天下最精锐的军队在你手中，建康的朝廷也要看你的脸色。"
 hd_asp_name_hj_dajiangjun:0 "宇宙大将军"
 hd_asp_card_hj_dajiangjun:0 "野望：$hd_asp_name_hj_dajiangjun$"
 hd_asp_card_hj_dajiangjun_desc:0 "#high 主要目标#!\n· 建康在你手中，且梁朝天子受你挟制（是你的臣属，或在你牢中）\n#high 额外目标#!\n· 萧衍已死\n· 你持有豫州州级头衔（河南王）\n· 寿春郡入你掌中\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_yuzhou_dajiangjun$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_hj_dajiangjun:0 "事见《梁书·侯景传》：侯景「自称宇宙大将军、都督六合诸军事」。"
 hd_asp.0100.desc.hj_dajiangjun:0 "台城已破，梁帝在你掌中。你自加宇宙大将军、都督六合诸军事，天地四方，都要听你一人号令。"
 hd_asp_name_hj_henan:0 "河南之主"
 hd_asp_card_hj_henan:0 "野望：$hd_asp_name_hj_henan$"
 hd_asp_card_hj_henan_desc:0 "#high 主要目标#!\n· 豫州、兖州、洛州皆入你掌中\n#high 额外目标#!\n· 高欢已死\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_henan_wang$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.hj_henan:0 "河南诸州尽在你的麾下，东西两魏、南面梁朝，都不得不掂量你的分量。"
 hd_asp_name_hj_handi:0 "汉帝"
 hd_asp_card_hj_handi:0 "野望：$hd_asp_name_hj_handi$"
 hd_asp_card_hj_handi_desc:0 "#high 主要目标#!\n· 称帝，且建康在你手中\n#high 额外目标#!\n· 萧衍已死，或在你牢中\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_houhan$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.hj_handi:0 "你在建康即皇帝位，国号汉。只是朝堂之上，跪拜的人里少有真心。"
 hd_asp_name_xy_pusa:0 "皇帝菩萨"
 hd_asp_card_xy_pusa:0 "野望：$hd_asp_name_xy_pusa$"
 hd_asp_card_xy_pusa_desc:0 "#high 主要目标#!\n· 虔诚等级达到四级，且年满八十时仍为独立君主\n#high 额外目标#!\n· 学识达到十八\n· 洛阳入你掌中\n· 虔诚等级达到五级\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_pusa$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp_src_xy_pusa:0 "事见《梁书·武帝纪》：武帝屡幸同泰寺舍身，群臣以钱亿万奉赎。"
 hd_asp.0100.desc.xy_pusa:0 "你日止一食，诵经礼佛，同泰寺的钟声伴你走过了半生。江南四百八十寺，都在为你祈福。"
 hd_asp_name_xy_beifa:0 "北伐中原"
 hd_asp_card_xy_beifa:0 "野望：$hd_asp_name_xy_beifa$"
 hd_asp_card_xy_beifa_desc:0 "#high 主要目标#!\n· 洛阳与寿春郡皆入你掌中\n#high 额外目标#!\n· 彭城郡入你掌中\n#high 达成之赏#!\n主要目标：$hd_asp_reward_large$，并得「$hd_asp_mod_beifa_gong$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.xy_beifa:0 "王师北渡淮水，旧都洛阳又见南朝旌旗。你在建康听到捷报，久久不能平静。"
 hd_asp_name_xy_wenzhi:0 "文治江南"
 hd_asp_card_xy_wenzhi:0 "野望：$hd_asp_name_xy_wenzhi$"
 hd_asp_card_xy_wenzhi_desc:0 "#high 主要目标#!\n· 学识达到二十，且扬州、荆州皆入你掌中\n#high 额外目标#!\n· 年满八十\n#high 达成之赏#!\n主要目标：$hd_asp_reward_medium$，并得「$hd_asp_mod_tianjian$」\n每项额外目标：$hd_asp_reward_small$"
 hd_asp.0100.desc.xy_wenzhi:0 "天监年间，江南文物之盛冠绝一时。后世说起南朝的风雅，第一个想到的就是你。"
 hd_asp_name_cqz_baipao:0 "白袍"
 hd_asp_card_cqz_baipao:0 "野望：$hd_asp_name_cqz_baipao$"
