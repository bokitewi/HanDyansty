 hd_asp_mod_jiangdong:0 "江东之主"
 hd_asp_mod_jiangdong_desc:0 "此人坐断东南，舟师纵横江上。"
 hd_asp_mod_zhonglie:0 "忠烈"
 hd_asp_mod_zhonglie_desc:0 "此人勤王讨逆，忠烈之名为刘氏宗亲所重。"
 hd_asp_mod_zhongyuan:0 "中原之鹿"
 hd_asp_mod_zhongyuan_desc:0 "此人逐鹿中原，四方健儿争相投效。"
 hd_asp_mod_qinzheng:0 "天子亲政"
 hd_asp_mod_qinzheng_desc:0 "天子摆脱权臣，亲理朝政，百官复有所依。"
 hd_asp_mod_zhongxing:0 "中兴之主"
 hd_asp_mod_zhongxing_desc:0 "汉祚中兴，诸侯复奉正朔。"
 hd_asp_mod_anming:0 "安命"
 hd_asp_mod_anming_desc:0 "此人历尽沧桑，乐天知命，得以颐养天年。"
 hd_asp_mod_rende:0 "仁德之主"
 hd_asp_mod_rende_desc:0 "此人宽仁爱人，四方之士望风来附。"
 hd_asp_mod_xuzhoumu:0 "徐州牧"
 hd_asp_mod_xuzhoumu_desc:0 "此人领有徐州，据淮泗之饶，兵精粮足。"
 hd_asp_mod_hanshi_zhushi:0 "汉室柱石"
 hd_asp_mod_hanshi_zhushi_desc:0 "此人为汉室柱石，刘氏宗亲皆倚重之。"
 hd_asp_mod_tianxia_guixin:0 "天下归心"
 hd_asp_mod_tianxia_guixin_desc:0 "此人混一宇内，四海宾服。"
 hd_asp_mod_han_zhongchen:0 "汉之忠臣"
 hd_asp_mod_han_zhongchen_desc:0 "此人终身为汉臣，只求墓前题一句汉故征西将军。"
 hd_asp_mod_weiwu:0 "魏武"
 hd_asp_mod_weiwu_desc:0 "此人代汉而立，用兵如神。"
 hd_asp_mod_hebei:0 "河北之雄"
 hd_asp_mod_hebei_desc:0 "此人据有河北，带甲之士以十万计。"
 hd_asp_mod_dingce:0 "定策之臣"
 hd_asp_mod_dingce_desc:0 "此人拥立新君，有定策之功。"
 hd_asp_mod_sishi_sangong:0 "四世三公"
 hd_asp_mod_sishi_sangong_desc:0 "袁氏四世三公，门生故吏遍于天下。"
 hd_asp_mod_zhongjia:0 "仲家天命"
 hd_asp_mod_zhongjia_desc:0 "此人自谓代汉当涂，僭号仲家，人心多有不附。"
 hd_asp_mod_huainan:0 "淮南之雄"
 hd_asp_mod_huainan_desc:0 "此人据淮南膏腴之地，府库充盈。"
 hd_asp_mod_xiliang:0 "西凉铁骑"
 hd_asp_mod_xiliang_desc:0 "此人所部西凉铁骑，羌、氐诸部敬畏之。"
 hd_asp_mod_fubo:0 "伏波之后"
 hd_asp_mod_fubo_desc:0 "此人不坠伏波将军家声，威震西陲。"
 hd_asp_mod_rushu:0 "入蜀之将"
 hd_asp_mod_rushu_desc:0 "此人兵入巴蜀，据天府之饶。"
 hd_asp_mod_chenwang_qiangnu:0 "陈王强弩"
 hd_asp_mod_chenwang_qiangnu_desc:0 "陈国强弩之士，守城则坚不可破。"
 hd_asp_mod_guangwu:0 "光武之风"
 hd_asp_mod_guangwu_desc:0 "此人以宗室起而承大统，有光武中兴之风。"
 hd_asp_mod_wolong:0 "卧龙"
 hd_asp_mod_wolong_desc:0 "此人怀经天纬地之才，治国理政，井井有条。"
 hd_asp_mod_sanfen:0 "三分之策"
 hd_asp_mod_sanfen_desc:0 "此人早定三分天下之策，纵横捭阖，游刃有余。"
 hd_asp_mod_jugong:0 "鞠躬尽瘁"
 hd_asp_mod_jugong_desc:0 "此人事必躬亲，夙兴夜寐，府库因之充盈。"
 hd_asp_mod_wusheng:0 "武圣"
 hd_asp_mod_wusheng_desc:0 "此人勇冠三军，威震华夏，后人奉为武圣。"
 hd_asp_mod_yijue:0 "义绝"
 hd_asp_mod_yijue_desc:0 "此人义薄云天，忠贯日月，为天下所敬。"
 hd_asp_mod_zhenjing:0 "镇守荆州"
 hd_asp_mod_zhenjing_desc:0 "此人坐镇荆州，兵强城固。"
 hd_asp_mod_liangzhou_shangshi:0 "凉州上士"
 hd_asp_mod_liangzhou_shangshi_desc:0 "此人文武兼资，诸葛丞相称之为凉州上士。"
 hd_asp_mod_jiange:0 "剑阁之守"
 hd_asp_mod_jiange_desc:0 "剑阁天险，一夫当关，万夫莫开。"
 hd_asp_mod_guzhong:0 "孤忠"
 hd_asp_mod_guzhong_desc:0 "此人身处绝境，仍不忘故国，暗中谋划复兴。"
 hd_asp_mod_yingshi_langgu:0 "鹰视狼顾"
 hd_asp_mod_yingshi_langgu_desc:0 "此人深沉多谋，有鹰视狼顾之相，令人不敢逼视。"
 hd_asp_mod_sheji:0 "社稷之臣"
 hd_asp_mod_sheji_desc:0 "此人历事数朝，为国家柱石。"
 hd_asp_mod_hunyi_gong:0 "混一之功"
 hd_asp_mod_hunyi_gong_desc:0 "此人平定四方，四海之内无不知其名。"
 hd_asp_mod_zifang:0 "子房之才"
 hd_asp_mod_zifang_desc:0 "时人比之张子房，运筹帷幄，算无遗策。"
 hd_asp_mod_mieshu:0 "灭蜀之功"
 hd_asp_mod_mieshu_desc:0 "此人立灭蜀首功，声名远播。"
 hd_asp_mod_wangzuo:0 "王佐"
 hd_asp_mod_wangzuo_desc:0 "此人有王佐之才，擅理政务。"
 hd_asp_mod_guangwu_di:0 "光武"
 hd_asp_mod_guangwu_di_desc:0 "此人起于南阳，中兴汉室，天下归心。"
 hd_asp_mod_gengshi:0 "更始元勋"
 hd_asp_mod_gengshi_desc:0 "此人为更始朝元勋，朝野敬重。"
 hd_asp_mod_kangli:0 "伉俪情深"
 hd_asp_mod_kangli_desc:0 "此人夫妻相得，家中和乐。"
 hd_asp_mod_shaohan:0 "绍汉"
 hd_asp_mod_shaohan_desc:0 "此人以汉室之甥自居，承汉之国号，诸部归心。"
 hd_asp_mod_chanyu:0 "单于之业"
 hd_asp_mod_chanyu_desc:0 "此人复兴匈奴旧业，五部铁骑纵横并州。"
 hd_asp_mod_jin_fanping:0 "晋之藩屏"
 hd_asp_mod_jin_fanping_desc:0 "此人为晋室屏藩，朝廷倚重。"
 hd_asp_mod_jiji:0 "击楫中流"
 hd_asp_mod_jiji_desc:0 "此人中流击楫，誓清中原，将士感奋。"
 hd_asp_mod_fuluo:0 "复洛之功"
 hd_asp_mod_fuluo_desc:0 "此人收复故都洛阳，功在社稷。"
 hd_asp_mod_fanyang_zu:0 "范阳祖氏"
 hd_asp_mod_fanyang_zu_desc:0 "范阳祖氏因此人而门楣光大。"
 hd_asp_mod_zhenge:0 "枕戈待旦"
 hd_asp_mod_zhenge_desc:0 "此人枕戈待旦，志枭逆虏，孤城不坠。"
 hd_asp_mod_liangjing:0 "两京之复"
 hd_asp_mod_liangjing_desc:0 "此人收复两京，名动天下。"
 hd_asp_mod_fufeng:0 "扶风之歌"
 hd_asp_mod_fufeng_desc:0 "此人诗文传世，信义著于胡汉。"
 hd_asp_mod_xuanwu:0 "宣武"
 hd_asp_mod_xuanwu_desc:0 "此人西平巴蜀，北伐中原，威名赫赫。"
 hd_asp_mod_jingchu:0 "荆楚之雄"
 hd_asp_mod_jingchu_desc:0 "此人据有上游，荆楚兵强粮足。"
 hd_asp_mod_hunyi_yunei:0 "混一宇内"
 hd_asp_mod_hunyi_yunei_desc:0 "此人助晋室混一天下，四海宾服。"
 hd_asp_mod_fengliu:0 "风流所宗"
 hd_asp_mod_fengliu_desc:0 "此人为风流谈论者所宗，名士争相结交。"
 hd_asp_mod_qingtan:0 "清谈领袖"
 hd_asp_mod_qingtan_desc:0 "此人善谈玄理，一言既出，四座皆服。"
 hd_asp_mod_yangzhou_zhong:0 "扬州之重"
 hd_asp_mod_yangzhou_zhong_desc:0 "此人坐镇扬州，赋税充盈。"
 hd_asp_mod_qin_tianwang:0 "大秦天王"
 hd_asp_mod_qin_tianwang_desc:0 "此人以天王之号统御四方，胡汉同心。"
 hd_asp_mod_guanzhong_zhi:0 "关中之治"
 hd_asp_mod_guanzhong_zhi_desc:0 "关中大治，夜不闭户，道不拾遗。"
 hd_asp_mod_beitu:0 "北土之主"
 hd_asp_mod_beitu_desc:0 "此人一统北方，带甲百万。"
 hd_asp_mod_qitun:0 "气吞万里"
 hd_asp_mod_qitun_desc:0 "此人金戈铁马，气吞万里如虎。"
 hd_asp_mod_zaizao:0 "再造晋室"
 hd_asp_mod_zaizao_desc:0 "此人诛灭篡逆，再造晋室。"
 hd_asp_mod_beifu:0 "北府精兵"
 hd_asp_mod_beifu_desc:0 "北府兵骁勇善战，只听此人号令。"
 hd_asp_mod_yuzhou_dajiangjun:0 "宇宙大将军"
 hd_asp_mod_yuzhou_dajiangjun_desc:0 "此人自称宇宙大将军、都督六合诸军事，天下震恐。"
 hd_asp_mod_henan_wang:0 "河南王"
 hd_asp_mod_henan_wang_desc:0 "此人坐拥河南诸州，兵马强盛。"
 hd_asp_mod_houhan:0 "侯汉天命"
 hd_asp_mod_houhan_desc:0 "此人自立为汉帝，天下侧目，人心不附。"
 hd_asp_mod_pusa:0 "皇帝菩萨"
 hd_asp_mod_pusa_desc:0 "此人笃信佛法，被尊为皇帝菩萨。"
 hd_asp_mod_beifa_gong:0 "北伐之功"
 hd_asp_mod_beifa_gong_desc:0 "此人王师北渡，收复故都。"
 hd_asp_mod_tianjian:0 "天监之治"
 hd_asp_mod_tianjian_desc:0 "天监年间，江南文物鼎盛。"
 hd_asp_mod_baipao:0 "白袍"
 hd_asp_mod_baipao_desc:0 "千兵万马避白袍，此人所部行军迅疾。"
 hd_asp_mod_gancheng:0 "梁之干城"
 hd_asp_mod_gancheng_desc:0 "此人镇守边州，为梁朝屏障。"
 hd_asp_mod_rujiang:0 "儒将"
 hd_asp_mod_rujiang_desc:0 "此人不以弓马见长，而以谋略制胜。"
 hd_asp_mod_guiwei:0 "归魏之功"
 hd_asp_mod_guiwei_desc:0 "此人交还蜀地，朝廷论功行赏。"
 hd_asp_mod_shuhan_chengxiang:0 "蜀汉丞相"
 hd_asp_mod_shuhan_chengxiang_desc:0 "此人辅佐刘氏复兴汉室，总理朝政。"
 hd_asp_mod_zuozhen_guanzhong:0 "坐镇关中"
 hd_asp_mod_zuozhen_guanzhong_desc:0 "此人坐镇长安，经营关中，志在北伐。"
 hd_asp_opinion_zhonglie:0 "忠烈"
 hd_asp_opinion_han_zhongchen:0 "汉之忠臣"
 hd_asp_opinion_hanshi_zhushi:0 "汉室柱石"
 hd_asp_opinion_xiliang:0 "西凉铁骑"
 hd_asp.0001.t:0 "江东之志"
 hd_asp.0001.desc:0 "夜深灯冷，帐中只余你一人。麾下的将士、江东的子弟、这支百战之师，究竟该往何处去？有人劝你顺江而下，据有吴会；有人劝你挥师北上，勤王讨贼；也有人说，中原才是英雄用武之地。你心中渐渐有了答案。"
 hd_asp.0001.a:0 "竟长江所极，据而有之。"
 hd_asp.0001.b:0 "讨贼勤王，以安汉室。"
 hd_asp.0001.c:0 "北上中原，与群雄争衡。"
 hd_asp.0002.t:0 "天子之志"
 hd_asp.0002.desc:0 "宫门深锁，侍从屏息。你名为天子，诏令却未必出得了这道宫墙。夜读高祖、光武旧事，你不禁要问：这一生，你究竟要做个什么样的天子？"
 hd_asp.0002.a:0 "衣带藏诏，必除权奸。"
 hd_asp.0002.b:0 "再造汉室，重振纲纪。"
 hd_asp.0002.c:0 "但求宗庙不绝，余生可安。"
 hd_asp.0003.t:0 "匡扶之志"
 hd_asp.0003.desc:0 "你常抚髀长叹：身为汉室之胄，年岁渐长，功业未建。天下纷扰，正是大丈夫立志之时。是兴复汉室、还于旧都，是据一方以成霸业，还是入朝辅弼、做天子的忠臣？"
 hd_asp.0003.a:0 "兴复汉室，还于旧都。"
 hd_asp.0003.b:0 "据州郡以成霸业。"
 hd_asp.0003.c:0 "入朝辅政，为汉忠臣。"
 hd_asp.0004.t:0 "本志"
 hd_asp.0004.desc:0 "你少时不过想为国家讨贼立功，封侯作征西将军，死后墓前题一句「汉故征西将军曹侯之墓」。如今天下大乱，眼前的路却远比当年所想的宽阔，也更凶险。"
 hd_asp.0004.a:0 "奉天子，令不臣，混一天下。"
 hd_asp.0004.b:0 "不负本志，做汉家的征西将军。"
 hd_asp.0004.c:0 "汉祚已衰，何不取而代之。"
 hd_asp.0005.t:0 "河北之志"
 hd_asp.0005.desc:0 "袁氏四世三公，门生故吏遍于天下。诸侯推你为盟主，众望所归。只是讨董之后，这天下该如何收拾，你须早作打算。"
 hd_asp.0005.a:0 "南据河，北阻燕代，南向以争天下。"
 hd_asp.0005.b:0 "另立宗室贤王，以定社稷。"
 hd_asp.0005.c:0 "汉祚将终，袁氏当兴。"
 hd_asp.0006.t:0 "当涂之志"
 hd_asp.0006.desc:0 "谶语有云「代汉者，当涂高」。你名术、字公路，暗合其应，袁氏又是四世三公。每念及此，你便难以安枕。"
 hd_asp.0006.a:0 "应天顺人，自登大宝。"
 hd_asp.0006.b:0 "先据淮南，再图后事。"
 hd_asp.0006.c:0 "先压本初，再论天下。"
 hd_asp.0007.t:0 "关西之志"
 hd_asp.0007.desc:0 "凉州的风沙磨砺了马家的子弟，羌、氐诸部皆敬服马氏的威名。伏波将军马援的后人，该在这乱世里留下怎样的名声？"
 hd_asp.0007.a:0 "雄踞关西，与中原分庭抗礼。"
 hd_asp.0007.b:0 "效法先祖，为汉镇守西陲。"
 hd_asp.0007.c:0 "南下汉中，西取巴蜀。"
 hd_asp.0008.t:0 "陈王之志"
 hd_asp.0008.desc:0 "你在陈国经营多年，国中强弩之士足以拒敌。如今四方大乱，郡县多有弃城而走者，陈国百姓却都把身家性命托付于你。"
 hd_asp.0008.a:0 "保境安民，守住陈国。"
 hd_asp.0008.b:0 "宗室有人，大统可继。"
 hd_asp.0008.c:0 "豫州诸郡，当归陈王。"
 hd_asp.0301.t:0 "卧龙之志"
 hd_asp.0301.desc:0 "先主三顾草庐之日，你曾为他画下天下大势。如今荆、益在望，北方的曹氏依旧强大。你心里清楚，接下来的每一步，都关系着汉室的存亡。"
 hd_asp.0301.a:0 "北定中原，还于旧都。"
 hd_asp.0301.b:0 "跨有荆益，三分天下。"
 hd_asp.0301.c:0 "鞠躬尽瘁，死而后已。"
 hd_asp.0302.t:0 "武圣之志"
 hd_asp.0302.desc:0 "你镇守荆州已有数年，北面襄樊的曹军近在眼前，东边的孙权也心怀叵测。兄长远在汉中，荆州的安危，全系于你一身。"
 hd_asp.0302.a:0 "北攻襄樊，威震华夏。"
 hd_asp.0302.b:0 "此生只事兄长，义不相负。"
 hd_asp.0302.c:0 "固守荆州，寸土不让。"
 hd_asp.0303.t:0 "伯约之志"
 hd_asp.0303.desc:0 "丞相星落五丈原已有多年，北伐的大业落在了你的肩上。朝中有人主张休兵养民，也有人暗中盼着你失败。你该如何走下去？"
 hd_asp.0303.a:0 "九伐中原，收复陇右。"
 hd_asp.0303.b:0 "守住巴蜀，保全汉祚。"
 hd_asp.0303.c:0 "纵使事不可为，也要谋复汉室。"
 hd_asp.0304.t:0 "司马之志"
 hd_asp.0304.desc:0 "曹氏数代倚重司马家，你也早已是朝中举足轻重的人物。只是魏室的权柄，究竟该留在曹家，还是该握在自己手里？"
 hd_asp.0304.a:0 "晋室之基，由我而立。"
 hd_asp.0304.b:0 "做魏室的柱石，辅佐曹氏。"
 hd_asp.0304.c:0 "平吴灭蜀，混一天下。"
 hd_asp.0305.t:0 "士季之志"
 hd_asp.0305.desc:0 "大军已入汉中，蜀汉的门户就在眼前。你自负才华盖世，可功成之后，是做魏室的功臣，还是另作打算？"
 hd_asp.0305.a:0 "据蜀自立，不复为人下。"
 hd_asp.0305.b:0 "灭蜀立功，封公拜侯。"
 hd_asp.0305.c:0 "以王佐之才，位列三公。"
 hd_asp.0306.t:0 "文叔之志"
 hd_asp.0306.desc:0 "新莽倒行逆施，天下豪杰并起。兄长伯升已在舂陵举兵，你也骑着牛上了阵。你不禁想，这一生究竟要成就怎样的事业？"
 hd_asp.0306.a:0 "中兴汉室，重登大宝。"
 hd_asp.0306.b:0 "辅佐更始，做一代功臣。"
 hd_asp.0306.c:0 "仕宦当作执金吾，娶妻当得阴丽华。"
 hd_asp.0307.t:0 "元海之志"
 hd_asp.0307.desc:0 "你在左国城称汉王，五部匈奴都来拜见。晋室诸王自相残杀，中原空虚。这是千载难逢的时机，你打算怎样用它？"
 hd_asp.0307.a:0 "绍汉之业，入主中原。"
 hd_asp.0307.b:0 "复兴呼韩邪单于的旧业。"
 hd_asp.0307.c:0 "仍做晋室的藩屏。"
 hd_asp.0308.t:0 "士稚之志"
 hd_asp.0308.desc:0 "胡骑南下，中原沦陷，晋室的半壁江山已在风雨飘摇之中。你与刘琨夜半闻鸡起舞的日子仿佛就在昨天。你要怎样报效国家？"
 hd_asp.0308.a:0 "中流击楫，收复豫州。"
 hd_asp.0308.b:0 "北伐到底，光复洛阳。"
 hd_asp.0308.c:0 "先壮大范阳祖氏，以图后举。"
 hd_asp.0309.t:0 "越石之志"
 hd_asp.0309.desc:0 "天下大乱，胡人四起。你胸中满是匡扶晋室的志向，只怕祖逖比你先一步扬鞭。前路艰险，你打算如何走？"
 hd_asp.0309.a:0 "孤守并州，枕戈待旦。"
 hd_asp.0309.b:0 "收复两京，再造晋室。"
 hd_asp.0309.c:0 "以诗文与信义结交胡汉，保一方平安。"
 hd_asp.0310.t:0 "元子之志"
 hd_asp.0310.desc:0 "你坐镇荆州，手握重兵，朝廷对你既倚重又提防。西边的巴蜀、北方的故都，都在等着有人去收复。而你心底，还有一个不敢说出口的念头。"
 hd_asp.0310.a:0 "三伐北土，功业盖世。"
 hd_asp.0310.b:0 "据有荆楚，雄踞上游。"
 hd_asp.0310.c:0 "辅佐晋室，一统天下。"
 hd_asp.0311.t:0 "深源之志"
 hd_asp.0311.desc:0 "朝廷以扬州相委，要你牵制荆州的桓温。你素以清谈闻名，如今却要领兵北伐，满朝都在看你的笑话，也有人真心寄望于你。"
 hd_asp.0311.a:0 "北征许洛，以证所学。"
 hd_asp.0311.b:0 "做江左清谈的宗主。"
 hd_asp.0311.c:0 "握住扬州，与桓温相抗。"
 hd_asp.0312.t:0 "天王之志"
 hd_asp.0312.desc:0 "王猛整饬吏治，关中大治，大秦的兵锋已指向东方的燕国。你常对群臣说，天下本是一家，胡汉不应分彼此。这番抱负，你打算走到哪一步？"
 hd_asp.0312.a:0 "混一六合，四海归一。"
 hd_asp.0312.b:0 "先治关中，与民休息。"
 hd_asp.0312.c:0 "统一北方，再图江南。"
 hd_asp.0313.t:0 "寄奴之志"
 hd_asp.0313.desc:0 "京口起兵，桓玄西逃，建康已在你手中。北府的将士都看着你，天下人也在看着你。晋室还能再造吗？还是该有新的天命？"
 hd_asp.0313.a:0 "北伐中原，气吞万里。"
 hd_asp.0313.b:0 "匡复晋室，扶天子还朝。"
 hd_asp.0313.c:0 "握住北府，雄踞京口。"
 hd_asp.0314.t:0 "万景之志"
 hd_asp.0314.desc:0 "你右足偏短，不善骑射，却凭谋略在乱世中一路走到今天。北边的高欢、关中的贺拔岳、江南的梁朝，都不是久居之地。你要的，是天下人都不敢小觑你。"
 hd_asp.0314.a:0 "做宇宙大将军，令天地四方听命。"
 hd_asp.0314.b:0 "占据河南，自成一方。"
 hd_asp.0314.c:0 "自立为帝，国号为汉。"
 hd_asp.0315.t:0 "叔达之志"
 hd_asp.0315.desc:0 "你代齐建梁已近三十年，江南承平日久，文物鼎盛。年岁渐高，你越来越沉浸于佛法之中，可北方的旧都依然不在你手里。"
 hd_asp.0315.a:0 "皈依佛法，做皇帝菩萨。"
 hd_asp.0315.b:0 "北伐中原，收复旧都。"
 hd_asp.0315.c:0 "以文治江南，名垂后世。"
 hd_asp.0316.t:0 "子云之志"
 hd_asp.0316.desc:0 "你随侍萧衍多年，从未以弓马见长，却在北伐中以七千白袍纵横千里。如今你回到梁朝，朝廷上下都在议论你的下一步。"
 hd_asp.0316.a:0 "再率白袍，直取洛阳。"
 hd_asp.0316.b:0 "镇守边州，做梁朝的干城。"
 hd_asp.0316.c:0 "以谋略为将，做一代儒将。"
 hd_asp.0061.t:0 "继承遗志"
 hd_asp.0061.desc:0 "先人未竟的壮志，如今落在你的肩上。旧部们看着你，等你一句话。"
 hd_asp.0061.a:0 "敢不继之！"
 hd_asp.0062.t:0 "遗志未继"
 hd_asp.0062.desc:0 "先人的壮志，终究没能传到你手中。时移世易，你只能另寻自己的路。"
 hd_asp.0062.a:0 "时也，命也。"
 hd_asp.0100.t:0 "壮志得酬"
 hd_asp.0100.desc.fallback:0 "多年的夙愿，终于在今日得偿。"
 hd_asp.0100.a:0 "此志既酬，来日方长。"
 hd_asp.0101.t:0 "四方震动"
 hd_asp.0101.desc:0 "消息传来：[hd_asp_achiever.GetTitledFirstName]夙愿得偿，「[hd_asp_achiever.Custom('hd_asp_fulfilled_name')]」之志已成。四方诸侯，无不侧目。"
 hd_asp.0101.a:0 "且观其后。"
 hd_asp.0200.t:0 "还于旧都"
 hd_asp.0200.desc:0 "两京光复，旧日宫阙重见汉家旌旗。父老扶杖夹道，百官拜伏道左，人人都在等你一句话：这天下，往后由谁来坐？"
 hd_asp.0200.a:0 "天命在我，请陛下禅位。"
 hd_asp.0200.e:0 "国贼窃据神器，吾当正位讨之。"
 hd_asp.0200.f:0 "神器无主，当承大统。"
 hd_asp.0200.d:0 "两京既复，天命已归。"
 hd_asp.0200.b:0 "还政天子，吾为辅弼。"
 hd_asp.0200.c:0 "政由己出，天子垂拱。"
 hd_asp.0201.t:0 "禅代之议"
 hd_asp.0201.desc:0 "九锡已受，王爵已加。洛阳城中，劝进的表章一封接一封送到你的案头。天子坐在殿上，看你的眼神里只剩下畏惧。是时候做个决断了。"
 hd_asp.0201.a:0 "受禅代魏，开晋室之基。"
 hd_asp.0201.b:0 "天下已在掌中，名分留给子孙去取。"
 hd_asp.0202.t:0 "蜀中之变"
 hd_asp.0202.desc:0 "成都已在你手中，蜀中的兵马、钱粮尽归你调度。姜维私下来见，劝你据蜀自立；洛阳的诏书也在路上，催你交还兵权。你该如何抉择？"
 hd_asp.0202.a:0 "据蜀称帝，自成一国。"
 hd_asp.0202.b:0 "与姜维共谋，复立汉室。"
 hd_asp.0202.c:0 "交还成都，归魏请功。"
 hd_asp.0203.t:0 "宣武之决"
 hd_asp.0203.desc:0 "成都、洛阳先后归于你手，你的威望一时无两。朝中有人劝你受九锡、行禅代，也有人劝你废立以立威。你抚着胸口问自己：是流芳后世，还是遗臭万载？"
 hd_asp.0203.a:0 "受九锡，行禅代。"
 hd_asp.0203.b:0 "废黜今上，另立宗室。"
 hd_asp.0203.c:0 "功成身退，做晋室忠臣。"
 hd_asp.0204.t:0 "两京既复"
 hd_asp.0204.desc:0 "洛阳、长安相继光复，关中父老夹道相迎。可建康传来消息，留守的心腹病逝，朝中人心浮动。是南归建康、受禅称帝，还是留在长安、继续北伐？"
 hd_asp.0204.a:0 "南归受禅，承天命。"
 hd_asp.0204.b:0 "坐镇长安，继续北伐。"
 hd_asp_title_chenliu:0 "陈留"
 hd_asp_title_haixi:0 "海西"
 hd_asp_title_lingling:0 "零陵"
 hd_asp_zh_shu_empire_name:0 "蜀"
 hd_asp_sm_keep_tt:0 "天命暂不更易，你的家族得王朝声望"
 hd_asp_zh_fuhan_tt:0 "蜀郡交给刘氏宗亲，立其为汉帝；你向他称臣，总理朝政"
 hd_asp_zh_guiwei_tt:0 "蜀郡交还魏帝，你得威望与「归魏之功」"
 hd_asp_hw_feili_tt:0 "废黜当今天子，另立一位司马氏宗室为帝，你随即以权臣之身辅政，天下畏你"
 hd_asp_hw_zhongchen_tt:0 "你得威望与王朝声望，晋帝对你好感大增"
 hd_asp_ly_zuozhen_tt:0 "若你亲自持有长安，迁都长安；十年内得「坐镇关中」"
 hd_story_zhuge_liang_life:0 "诸葛亮本纪"
 hd_story_zhuge_liang_life_desc:0 "字孔明，琅邪阳都人"
 HD_STORY_ZHUGE_LIANG_LIFE_STATUS:0 "诸葛孔明躬耕陇亩，好为《梁父吟》，每自比于管仲、乐毅。三顾之后，他许先主以驱驰，从此以天下为己任。"
 hd_story_guan_yu_life:0 "关羽本纪"
 hd_story_guan_yu_life_desc:0 "字云长，河东解人"
 HD_STORY_GUAN_YU_LIFE_STATUS:0 "关云长亡命奔涿郡，从先主于微时，恩若兄弟。白马一战，他斩颜良于万众之中；如今坐镇荆州，北望襄樊。"
 hd_story_jiang_wei_life:0 "姜维本纪"
 hd_story_jiang_wei_life_desc:0 "字伯约，天水冀人"
 HD_STORY_JIANG_WEI_LIFE_STATUS:0 "姜伯约本是魏将，建兴六年归汉，诸葛亮称他为“凉州上士”。丞相既殁，他承其遗志，屡出陇西。"
 hd_story_sima_life:0 "司马氏晋室基业"
 hd_story_sima_life_desc:0 "河内温县司马氏"
 HD_STORY_SIMA_LIFE_STATUS:0 "司马氏世为河内著姓。司马仲达历事曹氏四世，深沉多谋；父子三人相继秉政，魏室的权柄渐渐移入其家。"
 hd_story_zhong_hui_life:0 "钟会本纪"
 hd_story_zhong_hui_life_desc:0 "字士季，颍川长社人"
 HD_STORY_ZHONG_HUI_LIFE_STATUS:0 "钟士季是太傅钟繇的少子，少敏惠夙成，精练名理。景元四年，他以镇西将军之职统大军伐蜀。"
 hd_story_liu_xiu_life:0 "刘秀本纪"
 hd_story_liu_xiu_life_desc:0 "字文叔，南阳蔡阳人"
 HD_STORY_LIU_XIU_LIFE_STATUS:0 "刘文叔是高祖九世孙，性勤于稼穑，兄长伯升常笑他像高祖之兄刘仲。新莽末年天下大乱，舂陵刘氏兄弟起兵，刘秀起初骑着牛跟在军中。"
 hd_story_liu_yuan_life:0 "匈奴刘氏基业"
 hd_story_liu_yuan_life_desc:0 "新兴匈奴刘氏"
 HD_STORY_LIU_YUAN_LIFE_STATUS:0 "刘元海是南匈奴单于之后，冒姓刘氏，以汉室之甥自居。他少好学，习《毛诗》《左传》与孙吴兵法；永兴元年在左国城称汉王，五部匈奴尽归麾下。"
 hd_story_zu_ti_life:0 "祖逖本纪"
 hd_story_zu_ti_life_desc:0 "字士稚，范阳遒人"
 HD_STORY_ZU_TI_LIFE_STATUS:0 "祖士稚性情豁达，轻财好侠。他与刘琨同为司州主簿，同被共寝；半夜听到鸡鸣，便踢醒刘琨说“此非恶声也”，二人起而舞剑。"
 hd_story_liu_kun_life:0 "刘琨本纪"
 hd_story_liu_kun_life_desc:0 "字越石，中山魏昌人"
 HD_STORY_LIU_KUN_LIFE_STATUS:0 "刘越石是中山靖王之后，少以雄豪著名，为金谷“二十四友”之一。如今天下大乱，他与祖逖同怀匡扶之志，只怕祖生先自己一步扬鞭。"
 hd_story_huan_wen_life:0 "桓温本纪"
 hd_story_huan_wen_life_desc:0 "字元子，谯国龙亢人"
 HD_STORY_HUAN_WEN_LIFE_STATUS:0 "桓元子少有豪气。父亲桓彝死于苏峻之乱，他枕戈泣血，十八岁时手刃仇家之子。他坐镇荆州，手握重兵，朝廷对他既倚重又提防。"
 hd_story_yin_hao_life:0 "殷浩本纪"
 hd_story_yin_hao_life_desc:0 "字深源，陈郡长平人"
 HD_STORY_YIN_HAO_LIFE_STATUS:0 "殷深源识度清远，善谈玄理。他屏居墓所近十年，时人比之管仲、诸葛亮；如今朝廷以扬州相委，想倚重他牵制荆州的桓温。"
 hd_story_fu_jian_life:0 "苻坚本纪"
 hd_story_fu_jian_life_desc:0 "字永固，略阳临渭人"
 HD_STORY_FU_JIAN_LIFE_STATUS:0 "苻永固是氐人，祖父苻洪起于略阳。他废杀暴虐的苻生，自号大秦天王，任用汉人王猛整饬吏治，关中由此大治。"
 hd_story_liu_yu_life:0 "刘裕本纪"
 hd_story_liu_yu_life_desc:0 "字德舆，彭城绥舆里人"
 HD_STORY_LIU_YU_LIFE_STATUS:0 "刘德舆小字寄奴，家贫，曾以卖履为业。他投身北府军，在讨伐孙恩时屡立战功；桓玄篡晋，他在京口起兵，已经攻入建康。"
 hd_story_hou_jing_life:0 "侯景本纪"
 hd_story_hou_jing_life_desc:0 "字万景，朔方人"
 HD_STORY_HOU_JING_LIFE_STATUS:0 "侯万景右足偏短，不善骑射，却以谋略见长。他起于怀朔镇兵，先附尔朱荣，屡立战功；如今天下纷扰，他冷眼观望，看何处可以容身。"
 hd_story_xiao_yan_life:0 "萧衍本纪"
 hd_story_xiao_yan_life_desc:0 "字叔达，南兰陵中都里人"
 HD_STORY_XIAO_YAN_LIFE_STATUS:0 "萧叔达博学多才，与沈约、谢朓等并称“竟陵八友”。他起兵襄阳，代齐建梁，在位已近三十年；晚年笃信佛法，日止一食，屡次舍身同泰寺。"
 hd_story_chen_qingzhi_life:0 "陈庆之本纪"
 hd_story_chen_qingzhi_life_desc:0 "字子云，义兴国山人"
 HD_STORY_CHEN_QINGZHI_LIFE_STATUS:0 "陈子云自幼随侍萧衍，不善骑射，射不穿札，却富于谋略。大通年间，他率七千白袍北上，转战千里，一度入据洛阳。"
