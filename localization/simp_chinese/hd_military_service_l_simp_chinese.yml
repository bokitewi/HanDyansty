l_simp_chinese:
 hd_vassal_military_service_eligible_tt: "有地封臣的最高头衔须低于公国级，或为具有武官契约的公国级"
 KNIGHT_RESTRICTIONS_TT: "#T 骑士限制#!\n只有你的直属[vassals|e]、[courtiers|e]或[followers|e]才能担任[knights|e]\n你的[culture|e]或[faith|e]决定了哪种性别能担任[knights|e]。\n\n以下人员不能担任骑士：\n——玩家、[child|e]、[prisoner|e]或[GetTrait('incapable').GetName(GetPlayer.Self)]特质者\n——[clergy|e]（除非[faith|e]或[culture|e]允许）\n——[master_assassin|e]或[GetTrait('blind').GetName(GetPlayer.Self)]角色（除非[culture|e]允许或其属于[GetTrait('order_member').GetName(GetPlayer.Self)]）\n——[diarch|e]或[ceremonial_liege|e]\n——王国级及以上的有地封臣\n——不具有武官契约的公国级有地封臣\n——行政制下持有公国级及以上头衔的无地角色，或无地[noble_family|e][house_head|e]\n\n公国级有地武官封臣，以及伯爵级、男爵级封臣仍须满足其他骑士条件。武官契约包括军制、都护府、司隶和军阀。爵位与武官契约限制适用于所有政体，文化传统不能豁免。\n\n文化[traditions|e]与事件可能解除其他部分限制"
