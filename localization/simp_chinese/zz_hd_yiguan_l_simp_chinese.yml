 hd_yiguan_beifu_yongbing_modifier: "北府拥兵"
 hd_yiguan_beifu_yongbing_modifier_desc: "北府将领手握重兵，朝廷号令难行于京口。"
 hd_yiguan_pianan_modifier: "偏安江左"
 hd_yiguan_pianan_modifier_desc: "中原既不可复，君臣但求保境息民于江南。"
 hd_yiguan_ruzhu_modifier: "入主中原"
 hd_yiguan_ruzhu_modifier_desc: "该角色据有中原故地，声威远播。"
 hd_yiguan_heliu_modifier: "胡汉合流"
 hd_yiguan_heliu_modifier_desc: "胡汉之间的隔阂渐消，同为编户之民。"
 hd_yiguan_zhongxing_modifier: "中兴"
