 # 衣冠南渡（docs/衣冠南渡_设计草案.md）

 # ---------- 游戏规则 ----------
 rule_hd_yiguan_rule: "衣冠南渡"
 setting_hd_yiguan_rule_on: "#high 开启#!"
 setting_hd_yiguan_rule_on_desc: "北方落入胡人之手后，天下将进入衣冠南渡的局势，直至中原光复、胡人汉化、中原沦丧或南北分治。"
 setting_hd_yiguan_rule_off: "#high 关闭#!"
 setting_hd_yiguan_rule_off_desc: "衣冠南渡不会发生。"

 # ---------- 局势 ----------
 situation_type_hd_yiguan_nandu: "衣冠南渡"
 situation_type_hd_yiguan_nandu_desc: "胡骑南下，中原板荡。北方的世家大族扶老携幼，渡淮过江，奔向江左；留在北方的汉人则在胡人治下忍辱求存，或据坞自守，或聚众举义。\n\n南方的君主收容流人、侨立州郡、编练北府；北方的胡人君主则在弹压与怀柔之间摇摆。这场大迁徙终将以中原光复、胡汉合流、中原沦丧或南北分治收场。"
 situation_hd_yiguan_nandu: "$situation_type_hd_yiguan_nandu$"
 situation_hd_yiguan_nandu_desc: "[SITUATION.GetType.GetDesc]"

 hd_yiguan_phase_sangluan: "丧乱"
 hd_yiguan_phase_sangluan_desc: "胡骑所至，城邑为墟。北方的士民成群结队地向南逃难，道路上尽是扶老携幼的流人。"
