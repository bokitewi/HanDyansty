 hd_yiguan_sinicization_decision_confirm: "$hd_dc_con_sinicization_decision_confirm$"
 hd_yiguan_celestial_decision: "建天朝制"
 hd_yiguan_celestial_decision_desc: "我的王朝已易服改姓、尽行汉制，是时候仿效中原的典章，建立天朝的体制了。"
