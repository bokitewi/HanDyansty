 # ---------- 通告 ----------
 hd_yiguan_toast_start: "北方沦于胡人，衣冠士族纷纷南渡。"
 hd_yiguan_toast_phase2: "南来的流人已在江左落脚。"
 hd_yiguan_toast_phase3: "南北隔江对峙之势已成。"
 hd_yiguan_toast_restored: "王师克复中原，衣冠南渡至此告终。"
 hd_yiguan_toast_sinicized: "北方胡人尽行汉制，胡汉渐归一体。"
 hd_yiguan_toast_lost: "中原尽入胡人之手，江左偏安一隅。"
 hd_yiguan_toast_partition: "南北分治已成定局。"

 hd_yiguan.0001.t: "衣冠南渡"
 hd_yiguan.0001.desc: "胡骑踏破中原的消息一封接一封地送到。北方的城邑接连陷落，胡人的君王在旧日的宫阙里登基称号。世家大族扶老携幼，渡淮过江，奔向南方；来不及走的，只能在胡人治下忍辱求存。\n\n渡口上挤满了南逃的车马，士族的衣冠与百姓的破絮混在一处。天下的重心，正在悄然南移。"
 hd_yiguan.0001.a: "天下将何去何从？"
 hd_yiguan.0002.t: "流人渐定"
 hd_yiguan.0002.desc: "丧乱稍定，南来的流人已在江左落脚。朝廷为他们侨立郡县，北方的旧族在新土上重建门第；南北士人同朝共事，却也时有龃龉。"
 hd_yiguan.0002.a: "且安顿下来。"
 hd_yiguan.0003.t: "南北对峙"
 hd_yiguan.0003.desc: "二十余年过去，南北的格局渐渐分明。江南练兵积粟，北方胡汉杂处，双方隔着淮水与大江相望。北伐与南侵的议论，从未在朝堂上平息。"
 hd_yiguan.0003.a: "来日方长。"
 hd_yiguan.0011.t: "中原光复"
 hd_yiguan.0011.desc: "王师北上，旌旗重新插上了中原的城头。流寓江南的士族遥望故土，不少人当场痛哭失声。衣冠南渡的岁月，至此画上了句号。"
 hd_yiguan.0011.a: "旧都重光！"
 hd_yiguan.0012.t: "胡汉合流"
 hd_yiguan.0012.desc: "北方的胡人君主易服改姓、推行汉制，昔日的胡汉之别日渐模糊。南方的士人仍自称正朔所在，可北方已不再是他们记忆里的胡尘之地。"
 hd_yiguan.0012.a: "礼乐所在，便是华夏。"
 hd_yiguan.0013.t: "中原沦丧"
 hd_yiguan.0013.desc: "北方最后的汉人据点相继陷落，中原尽入胡人之手。江左的君臣终于明白，北归的日子已遥遥无期，只能在江南守住这一隅衣冠。"
 hd_yiguan.0013.a: "神州陆沉，徒唤奈何。"
 hd_yiguan.0014.t: "南北分治"
 hd_yiguan.0014.desc: "自衣冠南渡以来，已过了一个半世纪。南北两方都无力吞并对方，隔江分治成了常态。江南的子弟早已生于斯长于斯，北方的旧梦，只留在族谱与诗赋里。"
 hd_yiguan.0014.a: "南北各安天命。"

 # ---------- 南方·难民 ----------
 hd_yiguan.1001.t: "洛阳士女"
 hd_yiguan.1001.desc: "城门外停满了北来的车马。领头的是几位北方故家的子弟，衣冠虽已破旧，谈吐间仍是中州名士的气度。他们身后跟着家人、部曲与依附的佃户，一眼望不到头。\n\n他们求你给一块安身之地，也愿出仕效力。"
 hd_yiguan.1001.a: "延揽名士，安其家族。"
 hd_yiguan.1001.b: "收其部曲，编入军伍。"
 hd_yiguan.1001.c: "城中无余地，请往他处。"
 hd_yiguan.1002.t: "流离道路"
 hd_yiguan.1002.desc: "入夏以来，北方的流民一批又一批涌入你的境内。他们衣不蔽体、饥肠辘辘，沿途已有不少老弱倒毙道旁。地方官吏的文书一封比一封急：若不早作安置，恐生变乱。"
 hd_yiguan.1002.a: "开仓放粮，以安流人。"
 hd_yiguan.1002.b: "择其丁壮，编为部曲。"
 hd_yiguan.1002.c: "闭关自守，不纳流民。"
 hd_yiguan.1003.t: "江北待渡"
 hd_yiguan.1003.desc: "江北岸聚集了大批北来的难民，渡船少而人多，日日有人为争一席之地落水而死，对岸的哭声隔水可闻。你的僚属建议多派官船过江，可那又是一笔不小的花费。"
 hd_yiguan.1003.d: "尽发官船，接渡北人。"
 hd_yiguan.1003.a: "开仓赈济，徐徐渡之。"
 hd_yiguan.1003.b: "择其丁壮，编为部曲。"
 hd_yiguan.1003.c: "江防要紧，不许擅渡。"

 # ---------- 南方·流民帅 ----------
 hd_yiguan.1101.t: "击楫中流"
 hd_yiguan.1101.desc: "[hd_yiguan_shuai.GetName]带着数百家乡党南来投你。此人在北方时便聚众自保，屡挫胡骑；渡江时曾在中流击楫立誓：不清中原而复济者，有如大江。\n\n他向你请求兵粮，好重返北方。"
 hd_yiguan.1101.a: "授以边县，镇守前线。"
 hd_yiguan.1101.b: "留为将领，统领流民。"
 hd_yiguan.1101.c: "资其北伐，以图恢复。"
 hd_yiguan.1101.d: "此人难制，不如拒之。"
 hd_yiguan.1102.t: "流民宗主"
 hd_yiguan.1102.desc: "[hd_yiguan_shuai.GetName]率领乡里千余家南来。他在北方乱中被众人推为宗主，饥荒时分粮共食，众人感念，誓死相随。此人持重有谋，既能安辑流人，也懂得调和各方。"
 hd_yiguan.1102.a: "授以边县，安辑流人。"
 hd_yiguan.1102.b: "留为将领，统其部众。"
 hd_yiguan.1102.c: "遣还北方，相机恢复。"
 hd_yiguan.1102.d: "境内无地可容。"
 hd_yiguan.1103.t: "骄兵悍将"
 hd_yiguan.1103.desc: "[hd_yiguan_shuai.GetName]带着一支剽悍的流民军来到你的境内。他的部众多是北方的亡命之徒，打仗凶狠，军纪却极坏，沿途已有劫掠的传闻。他本人言辞倨傲，要价不低。"
 hd_yiguan.1103.a: "给他一县，羁縻其众。"
 hd_yiguan.1103.b: "收入麾下，严加约束。"
 hd_yiguan.1103.c: "驱之北上，以毒攻毒。"
 hd_yiguan.1103.d: "此辈虎狼，断不可留。"
 hd_yiguan_shuai_refuse_tt: "#EMP 此人或将心怀怨望，日后作乱。#!"
 hd_yiguan.1111.t: "流民之乱"
 hd_yiguan.1111.desc: "当年被你拒之门外的[hd_yiguan_shuai.GetName]，如今竟在你的境内聚众起兵。他四处宣扬你薄待北人，走投无路的流民纷纷投到他的旗下。"
 hd_yiguan.1111.a: "竖子安敢！"

 # ---------- 南方·侨置 ----------
 hd_yiguan.1201.t: "侨立州郡"
 hd_yiguan.1201.desc: "北方故土虽已沦陷，南来的士族仍以故乡郡望自矜。有人上书请侨立[hd_yiguan_qiao_title.GetName]，使流寓之人有所统属，也让天下知道你不曾忘记北方。"
 hd_yiguan.1201.a: "侨立州郡，以系人心。"
 hd_yiguan.1201.b: "此事容后再议。"
 hd_yiguan.1202.t: "侨郡安户"
 hd_yiguan.1202.desc: "南来的流人散居各地，户籍混乱，赋役难征。你的僚属建议择一地侨立郡县，把这些北人登记在册、另行管辖，宽其赋役，使之安心垦殖。"
 hd_yiguan.1202.a: "侨立郡县，安置流人。"
 hd_yiguan.1202.b: "流人自当编入本地户籍。"
 hd_yiguan.1203.t: "侨旧之争"
 hd_yiguan.1203.desc: "堂上又起了争执。北来的侨姓士族看不起江南旧族，讥其粗鄙；江南的吴姓豪族则怨北人占了官位与良田。双方各执一词，都在看你的态度。"
 hd_yiguan.1203.a: "北来士族，国之栋梁。"
 hd_yiguan.1203.b: "江东旧族，立国之本。"
 hd_yiguan.1203.c: "厚加赏赐，两相调和。"
 hd_yiguan.1210.t: "土断"
 hd_yiguan.1210.desc: "侨郡侨县设立已久，流人早已在南方置田安家，却仍挂着北方的郡望，享受着减免的赋役。有人上书请行土断：废除侨置，把这些人一律编入所居郡县的户籍。\n\n此举必能充实府库，却也会让北来的士族大失所望。"
 hd_yiguan.1210.a: "以土断之，一体编户。"
 hd_yiguan.1210.b: "北人思归，不可遽断。"

 # ---------- 南方·北府军 ----------
 hd_yiguan.1301.t: "北府初建"
 hd_yiguan.1301.desc: "京口与广陵一带聚集着大批北来的流民，他们久经战阵，骁勇善斗。有人向你献策：何不就地招募这些北人，编练一支精兵，以御北方？"
 hd_yiguan.1301.a: "募北人为兵，号曰北府。"
 hd_yiguan.1301.a.tt: "#EMP 衣冠南渡期间，可在京口、广陵招募北府兵。#!"
 hd_yiguan.1302.t: "北府名将"
 hd_yiguan.1302.desc: "北府军中出了一员骁将[hd_yiguan_beifu_general.GetName]。他出身北方寒门，作战常身先士卒，北府将士都愿为他效死。如今诸将推举他统领北府，只等你点头。"
 hd_yiguan.1302.a: "委以兵权，专任北府。"
 hd_yiguan.1302.b: "兵权不可专于一人。"
 hd_yiguan.1303.t: "北府拥兵"
 hd_yiguan.1303.desc: "[hd_yiguan_beifu_general.GetName]统领北府多年，将士只知有将军，不知有朝廷。近来他屡屡违抗调令，京口的军报也越来越少。你的近臣忧心忡忡：北府若生异心，都城危矣。"
 hd_yiguan.1303.a: "夺其兵权，以绝后患。"
 hd_yiguan.1303.a.tt: "#EMP 此人或会据京口起兵。#!"
 hd_yiguan.1303.b: "加官晋爵，以安其心。"
 hd_yiguan.1303.c: "且由他去。"

 # ---------- 北方·流民逃窜 ----------
 hd_yiguan.2001.t: "汉民南奔"
 hd_yiguan.2001.desc: "治下的汉人又跑了一批。他们趁夜拖家带口，越过关隘往南方逃去，留下空荡荡的村落与无人收割的田地。你的部将请求发兵追赶。"
 hd_yiguan.2001.a: "发兵追回，以儆效尤。"
 hd_yiguan.2001.b: "跑便跑了，何足挂齿。"
 hd_yiguan.2001.c: "宽其赋役，安抚留民。"
 hd_yiguan.2002.t: "坞主出走"
 hd_yiguan.2002.desc: "[hd_yiguan_occ_county.GetName]的一位汉人坞主带着全坞部众弃堡南去。他临走前烧了坞中的粮仓，扬言宁死不做胡人的奴仆。"
 hd_yiguan.2002.a: "遣骑追之，勿使漏网。"
 hd_yiguan.2002.b: "由他去吧。"
 hd_yiguan.2002.c: "开仓抚民，以收人心。"
 hd_yiguan.2003.t: "边县空虚"
 hd_yiguan.2003.desc: "地方官报称，[hd_yiguan_occ_county.GetName]的汉人已逃去大半，田地荒芜，连赋税都收不上来。剩下的人也在观望，只等时机便要南下。"
 hd_yiguan.2003.a: "严查关津，追捕逃人。"
 hd_yiguan.2003.b: "听之任之。"
 hd_yiguan.2003.c: "开仓赈济，招徕流亡。"
 hd_yiguan.2011.t: "族人议南渡"
 hd_yiguan.2011.desc: "家中长辈聚在一处，商议是否让族中子弟南渡投奔江左。留在北方，终究要仰胡人鼻息；可举族南迁，祖宗坟墓与田产又怎舍得？最后，众人都看向了你。"
 hd_yiguan.2011.a: "遣子弟南渡，以存宗祀。"
 hd_yiguan.2011.b: "据坞自守，不离乡土。"
 hd_yiguan.2011.c: "劝谕乡里，安心事主。"
 hd_yiguan.2012.t: "父老请命"
 hd_yiguan.2012.desc: "乡里的父老跪在你的门前，说胡兵又来征粮抓丁，许多人家已经活不下去了。他们求你拿个主意：是逃往南方，还是在乡里筑坞自保？"
 hd_yiguan.2012.a: "遣子弟先行南下。"
 hd_yiguan.2012.b: "筑坞聚众，誓守乡里。"
 hd_yiguan.2012.c: "且忍一时，劝民归附。"
 hd_yiguan.2013.t: "南朝密使"
 hd_yiguan.2013.desc: "一位自称来自南朝的使者趁夜来访。他说南方虚位以待北方的忠义之士；你若有心，可先遣子弟南下，以示诚意。"
 hd_yiguan.2013.a: "遣子弟随使南归。"
 hd_yiguan.2013.b: "南朝路远，不如自守。"
 hd_yiguan.2013.c: "此事不可再提。"

 # ---------- 北方·义军起义 ----------
 hd_yiguan.2101.t: "坞堡起兵"
 hd_yiguan.2101.desc: "[hd_yiguan_occ_county.GetName]的汉人豪强[hd_yiguan_new_leader.GetName]据坞起兵，杀了你派去的官吏，号召乡里驱逐胡人。消息传来，附近的汉人都蠢蠢欲动。"
 hd_yiguan.2101.a: "发兵进剿！"
 hd_yiguan.2101.b: "许以官职，招安其众。"
 hd_yiguan.2101.c: "以财货散其部众。"
 hd_yiguan.2102.t: "乞活军"
 hd_yiguan.2102.desc: "一支自称乞活军的流民武装出现在[hd_yiguan_occ_county.GetName]。他们原是北方的饥民，结伙求食，如今由[hd_yiguan_new_leader.GetName]统领，转战各地，专与胡人为敌。"
 hd_yiguan.2102.a: "剿灭乞活，以安地方。"
 hd_yiguan.2102.b: "收为我用。"
 hd_yiguan.2102.c: "赐以钱粮，令其散去。"
 hd_yiguan.2103.t: "豪杰举义"
 hd_yiguan.2103.desc: "[hd_yiguan_new_leader.GetName]在[hd_yiguan_occ_county.GetName]振臂一呼，四方汉人云集响应。他打出诛灭胡虏的旗号，所过之处胡人尽遭屠戮，声势之盛远非寻常乱民可比。"
 hd_yiguan.2103.a: "倾国之兵，务必剿灭！"
 hd_yiguan.2103.b: "许以高位，以分其势。"
 hd_yiguan.2103.c: "重金赂之，暂缓其锋。"
 hd_yiguan.2111.t: "邻县举义"
 hd_yiguan.2111.desc: "邻近的[hd_yiguan_up_county.GetName]有人起兵反胡了。为首的[hd_yiguan_new_leader.GetName]传檄四方，号召各地汉人共举义旗。宗主尚不知你的态度，可这一步若踏错，便是灭门之祸。"
 hd_yiguan.2111.a: "共举义旗，驱逐胡虏。"
 hd_yiguan.2111.b: "告于宗主，以表忠心。"
 hd_yiguan.2111.c: "暗中输送粮械。"
 hd_yiguan.2112.t: "义军来使"
 hd_yiguan.2112.desc: "[hd_yiguan_new_leader.GetName]的使者乔装成商贩，悄悄来到你的府中，带来一封书信：义军已在[hd_yiguan_up_county.GetName]起事，只盼你登高一呼，里应外合。"
 hd_yiguan.2112.a: "里应外合，共襄义举。"
 hd_yiguan.2112.b: "缚其使者，献于宗主。"
 hd_yiguan.2112.c: "资以粮械，不露形迹。"
 hd_yiguan.2113.t: "故旧相邀"
 hd_yiguan.2113.desc: "举兵的[hd_yiguan_new_leader.GetName]是你的旧识。他托人捎来口信，说当年同窗时便约好要匡扶华夏，如今时机已到，问你是否还记得当日之约。"
 hd_yiguan.2113.a: "旧约在心，岂敢相负。"
 hd_yiguan.2113.b: "时移世易，恕难从命。"
 hd_yiguan.2113.c: "暗助故人一臂之力。"
 hd_yiguan.2120.t: "归南之议"
 hd_yiguan.2120.desc: "义军得胜，你已脱离胡人的羁绊。南方派人前来，请你率众归附，从此奉南朝正朔。也有人劝你自立门户，不必寄人篱下。"
 hd_yiguan.2120.a: "归附南朝，以全臣节。"
 hd_yiguan.2120.b: "自立门户，不必依人。"

 # ---------- 北方·胡汉对峙 ----------
 hd_yiguan.2201.t: "胡汉争田"
 hd_yiguan.2201.desc: "胡人部落与汉人农户为了田地又起冲突。胡人要放牧，汉人要耕种，双方械斗死了好几个人。两边的首领都跪在你的帐前，等你决断。"
 hd_yiguan.2201.a: "胡汉分治，各安其业。"
 hd_yiguan.2201.b: "汉人善治田亩，当用其长。"
 hd_yiguan.2201.c: "汉人刁顽，严加管束。"
 hd_yiguan.2202.t: "胡人凌汉"
 hd_yiguan.2202.desc: "你的本族将士在城中横行，抢夺汉人财物，欺凌汉家妇女。汉人敢怒不敢言，私下却在传唱南方的歌谣。"
 hd_yiguan.2202.a: "胡汉各归其所，不得相扰。"
 hd_yiguan.2202.b: "惩治本族，以收汉心。"
 hd_yiguan.2202.c: "汉人怨望，正当示之以威。"
 hd_yiguan.2203.t: "汉士进言"
 hd_yiguan.2203.desc: "一位汉人士人在你面前侃侃而谈：马上得天下，不可马上治之；若想长治久安，就得用汉人的典章，任汉人的贤才。你的本族将领在一旁冷笑不止。"
 hd_yiguan.2203.a: "胡有胡法，汉有汉制。"
 hd_yiguan.2203.b: "先生所言甚是。"
 hd_yiguan.2203.c: "腐儒妄言，逐出帐外。"
 hd_yiguan.2211.t: "胡吏凌辱"
 hd_yiguan.2211.desc: "宗主派来的胡人官吏在你的领地上作威作福，当众鞭打你的家人，扬言汉人不过是奴仆。你的族人都看着你，等你如何应对。"
 hd_yiguan.2211.a: "忍辱负重，暂且隐忍。"
 hd_yiguan.2211.b: "上书宗主，据理力争。"
 hd_yiguan.2211.c: "暗通南朝，以图后计。"
 hd_yiguan.2212.t: "宗主征发"
 hd_yiguan.2212.desc: "宗主又下令征发你领地上的丁壮与粮草，说是要南征。可征去的人很少有回来的，乡里已是怨声载道。"
 hd_yiguan.2212.a: "奉命唯谨，不敢有违。"
 hd_yiguan.2212.b: "民力已竭，请减征发。"
 hd_yiguan.2212.c: "阳奉阴违，密使南朝。"
 hd_yiguan.2213.t: "南音北传"
 hd_yiguan.2213.desc: "南方的诗文与消息辗转传到北方。江左的衣冠风流令你的族人心驰神往，也有人私下议论：与其在胡人治下苟活，不如早作打算。"
 hd_yiguan.2213.a: "慎言！祸从口出。"
 hd_yiguan.2213.b: "胡汉一体，宗主当善待汉人。"
 hd_yiguan.2213.c: "遣人南下，暗结江左。"

 # ---------- 举州归南·通知 ----------
 hd_yiguan.3101.t: "举州来归"
 hd_yiguan.3101.desc: "北方的[hd_yiguan_gn_vassal.GetName]起兵脱离胡人，派使者前来，愿举州归附于你。你已发兵北上接应。"
 hd_yiguan.3101.a: "王师北上，接应义士！"
