 hd_yiguan.0001.t: "衣冠南渡"
 hd_yiguan.0001.desc: "报信的人说到渡口，嗓子已经哑了：车轮陷在泥里，抱孩子的人挤不到船边，连往日不肯与人同席的士族，如今也在争一处落脚的地方。我让他歇一口气，他却急着问，后面的人还能往哪里去。\n\n北方的来信接连断了音讯，城邑易主、乡里离散的传闻越来越多。有人携着家谱南行，有人守着坞壁不走；同一个故乡的名字，正被写在相隔千里的求援书上。\n\n我听着门外仍未停息的通报。无论如何看待这场兵乱，此后要面对的，已不只是换了旗号的几座城。"
 hd_yiguan.0001.a: "天下将何去何从？"
 hd_yiguan.0002.t: "流人渐定"
 hd_yiguan.0002.desc: "来人报籍贯时，仍先说北方的旧郡名，停了一下，才补上如今寄居的县邑。我问他家中可还安稳，他说屋舍已有着落，孩子也认得附近的路了，只是长辈仍不肯把行装拆尽。\n\n从江左传来的消息里，逃难渐渐成了安家：有人开垦荒田，有人入仕，也有人为了田界、赋役和座次争执不下。侨立的州郡留住了故乡的名字，却不能凭空添出田地和粮食。\n\n我把新送来的消息又看了一遍。那些当初只求渡江活命的人，如今已在江南住下；怎样与当地人相处，成了新的难题。"
 hd_yiguan.0002.a: "且安顿下来。"
 hd_yiguan.0003.t: "南北对峙"
 hd_yiguan.0003.desc: "一位来客指着舆图上的淮水，说起某处渡口，仍叫得出沿岸村落的旧名；年轻的随从却要凑近细看，才知道那地方究竟在哪。兵乱拖得久了，同一条河，在不同人心里竟已隔着这样的距离。\n\n南方练兵积粟，北方调集人马，往来的消息总离不开渡河、守城与粮运。有人说恢复有望，有人说不宜轻动，话虽相反，都还不能让对岸的军队消失。\n\n我听见来客又提起一次未成的归乡之行。眼前的疆界还会不会改变，无人能向他担保；但南北各据一方的局面，已须当作眼下的实情来应对。"
 hd_yiguan.0003.a: "来日方长。"
 hd_yiguan.0011.t: "中原光复"
 hd_yiguan.0011.desc: "报捷的消息念到故都时，旁边一名老者忽然请人再念一遍。他问的不是斩获多少，而是通往旧乡的道路是否已经打开；得到答复后，他低头拭了拭眼角，许久没有说话。\n\n南方军队重新占据中原诸地，南迁以来悬在许多人心头的那件事，总算有了一个交代。我却还听见有人追问田契、坟茔与失散的亲人：城池可以收复，当年离开的人，未必都能原样回去。\n\n消息很快传开，听闻的人有喜有忧。我将战报收好，想到那些只凭家中口述才认得北方的后辈：对他们而言，这些旧乡的名字，终于不再只是故事里的地方。"
 hd_yiguan.0011.a: "旧都重光！"
 hd_yiguan.0012.t: "胡汉合流"
 hd_yiguan.0012.desc: "谈到北方的新政，来客拿出一封书信，请我看看上面的称谓与署名。他说，如今许多事情须依中原的礼法办理，过去隔在胡汉之间的界线，已经不像从前那样分明。旁边有人点头，也有人仍不肯轻信。\n\n我逐句读着，没有急着替谁下结论。改用衣冠、语言与典章，能够写进诏令；邻里肯不肯相亲，旧怨能否消解，却还要看日后的待人处事。只是把北方一概说成旧时模样，显然也已失实。\n\n来客等着我的答语。我把信折回原处：这场南渡留下的问题，如今有了一种不同于刀兵的回答。"
 hd_yiguan.0012.a: "礼乐所在，便是华夏。"
 hd_yiguan.0013.t: "中原沦丧"
 hd_yiguan.0013.desc: "最后一处北方据点失守的消息传来，先前还在争论援兵的人慢慢住了口。一名熟悉当地道路的来客问了几句，终于不再追问，只把随身带来的旧图卷了起来。\n\n这些年，许多人把留守、逃亡与举兵的希望寄在那里；如今城邑尽失，再说接应，连可以落脚的地方也难指出。江左传来的人还在争论是否能够再出兵，隔着江淮望向北方，却不得不承认眼前的兵势已经改变。\n\n我看着那卷被收起的地图。它没有因此少一条道路、一个乡名，可从今往后，谁若还要谈归去，就必须先说明，准备怎样越过如今横在其间的重重关隘。"
 hd_yiguan.0013.a: "神州陆沉，徒唤奈何。"
 hd_yiguan.0014.t: "南北分治"
 hd_yiguan.0014.desc: "一名年轻来客听人说起故乡，随口答的已是江南的县名。长辈纠正他，他便问：那片从未见过的土地，也算自己的故乡么？席间静了片刻，最后还是有人转开话头，谈起今年的收成。\n\n南渡以来岁月漫长，南北各守疆界，渡口依旧有行旅，军报也未停过，却再没有哪一方能轻易吞并对方。家谱里写着的北方郡望，与眼前置下的田宅，早已牵住不同的生活。\n\n我望着这一老一少，忽然明白，分治不只存在于两军之间。待到新一代长成，许多当年以为只是暂且忍受的事，已经成了他们自幼所知的天下。"
 hd_yiguan.0014.a: "南北各安天命。"

 # ---------- 南方·难民 ----------
 hd_yiguan.1001.t: "洛阳士女"
 hd_yiguan.1001.desc: "来客入见前，先在门边掸了掸衣上的尘土，行礼却仍一丝不苟。他报出北方的郡望，又说起失散的亲故；及至我问带来了多少人，他终于不再谈家世，转身指向门外候着的家眷、部曲与佃户。\n\n这些人一路护着老幼南来，车上除了铺盖，还有不肯丢下的书卷。领头者愿留下效力，只求一处能安顿众人的地方。属吏却提醒我，粮食与田地都须另作安排，其中的丁壮倒可充实军伍。\n\n我看见来客一直望着我的神色。方才那套从容的礼节，终究掩不住一家人等候答复的急切。"
 hd_yiguan.1001.a: "延揽名士，安其家族。"
 hd_yiguan.1001.b: "收其部曲，编入军伍。"
 hd_yiguan.1001.c: "城中无余地，请往他处。"
 hd_yiguan.1002.t: "流离道路"
 hd_yiguan.1002.desc: "巡路的吏员领来一对父子。孩子攥着半截草绳，绳的另一头原系着家中的牛，如今牛和行李都已不在，只剩父亲还不时回头，数着跟进来的人。这样的队伍，这个月已经来了几批。\n\n地方上请求拨粮的文书越来越急：有些人借宿村舍，有些挤在道路旁，附近住户也怕自家的存粮撑不到秋收。将吏看中了其中的丁壮，说若编入部曲，既有饭吃，也能添些可用之兵。\n\n我问那父亲有何打算。他没有答，只把孩子往身边拉近一点。收容、募兵，还是关上门户，都不能再拖着不说了。"
 hd_yiguan.1002.a: "开仓放粮，以安流人。"
 hd_yiguan.1002.b: "择其丁壮，编为部曲。"
 hd_yiguan.1002.c: "闭关自守，不纳流民。"
 hd_yiguan.1003.t: "江北待渡"
 hd_yiguan.1003.desc: "渡吏把一只捞起的布鞋带来，说争船时又有人落了水。我问救起几人，他低头报了数目，随后补上一句：江北还有许多老弱，已在岸上等了数日，船一靠近便争着往前挤。\n\n属吏请我调发官船，多跑几趟便能接回不少人；管粮者却算起船夫的口粮、安置的费用，劝我先赈济，再慢慢渡人。将吏另有主意，愿挑丁壮收进部曲，也有人担心往来失察，坏了江防。\n\n我望着那只还在滴水的鞋。对岸的人看不见这里怎样议论，可下一班船去还是不去，天黑以前就得有个准话。"
 hd_yiguan.1003.d: "尽发官船，接渡北人。"
 hd_yiguan.1003.a: "开仓赈济，徐徐渡之。"
 hd_yiguan.1003.b: "择其丁壮，编为部曲。"
 hd_yiguan.1003.c: "江防要紧，不许擅渡。"

 # ---------- 南方·流民帅 ----------
 hd_yiguan.1101.t: "击楫中流"
 hd_yiguan.1101.desc: "[hd_yiguan_shuai.GetName]走到堂中，没有先陈说家世，而是请我准他重返江北。随行者说，此人渡江时曾击楫立誓，不清中原，便不再渡回来；话音才落，他已把沿途可通行的道路逐一指给我看。\n\n数百家乡党随他南来，眼下还在等候安置。他求的是兵粮与名分，所说的却始终是北方，仿佛脚下只是一处歇息的渡口。部属提醒我，授县可以让他守边，留用可以统率流民，若资助他北去，便要为那支军队筹措粮械。\n\n他停下手，等我答复。那一番誓言究竟能走多远，须先看我肯让他迈出哪一步。"
 hd_yiguan.1101.a: "授以边县，镇守前线。"
 hd_yiguan.1101.b: "留为将领，统领流民。"
 hd_yiguan.1101.c: "资其北伐，以图恢复。"
 hd_yiguan.1101.d: "此人难制，不如拒之。"
 hd_yiguan.1102.t: "流民宗主"
 hd_yiguan.1102.desc: "[hd_yiguan_shuai.GetName]入见时，门外几位随行者还在争论各家该分多少口粮。他回身说了几句话，叫人先照老弱的人数记下，争执便暂时止住了。再转向我时，他才请罪，说乡党一路相随，不能只替自己求个去处。\n\n据随行者说，北方饥乱时，此人曾与众人分粮共食，因此千余家推他作主，直到如今仍不肯离散。他愿听候调遣，却盼这些人能聚居安业，不必再沿路求人。\n\n我打量着门外安静下来的队伍。这样的人可以镇守一县，也可以留作将领；只是安置了他，便也接下了那一群人的生计。"
 hd_yiguan.1102.a: "授以边县，安辑流人。"
 hd_yiguan.1102.b: "留为将领，统其部众。"
 hd_yiguan.1102.c: "遣还北方，相机恢复。"
 hd_yiguan.1102.d: "境内无地可容。"
 hd_yiguan.1103.t: "骄兵悍将"
 hd_yiguan.1103.desc: "[hd_yiguan_shuai.GetName]还未入见，随行军士已在门外与守卫争起坐骑的安放。他听见吵嚷，只回头喝了一声，便转向我谈起安置与粮食，语气仿佛是在议一场双方各有所需的买卖。\n\n这支流民军确实能战，沿路也有乡人来告，说他们强索粮物。其人辩称，部众若无饭吃，谁也约束不住，又说愿替我赴险出战，只须给一个可驻足的地方。身旁将吏听得各有神色，门外也渐渐安静下来。\n\n我没有立即答应。给他田县，或许能使其有所顾惜；收入军伍，便得亲自约束。至于让他北去，或索性拒纳，又各有难处。"
 hd_yiguan.1103.a: "给他一县，羁縻其众。"
 hd_yiguan.1103.b: "收入麾下，严加约束。"
 hd_yiguan.1103.c: "驱之北上，以毒攻毒。"
 hd_yiguan.1103.d: "此辈虎狼，断不可留。"
 hd_yiguan_shuai_refuse_tt: "#EMP 此人或将心怀怨望，日后作乱。#!"
 hd_yiguan.1111.t: "流民之乱"
 hd_yiguan.1111.desc: "守吏送来敌方传出的言辞，念到“薄待北人”时，忽然停了下来。我让他继续，才听清举兵的正是当初被我拒绝的[hd_yiguan_shuai.GetName]。如今那人已聚起兵众，向境内城邑发难。\n\n有人请我追究沿途接济者，有人说附近流民无处安身，才会受其鼓动。两边尚未争完，新报又到，确认这已不是几句怨言：兵马已动，地方正在请援，守城的人急候回报。\n\n我记得当日作答时，众人尚在争论可否容下这批来客。今日再论当初谁说得有理，已经救不了受兵的城邑。我只得让守吏先把眼前的军情说清楚。"
 hd_yiguan.1111.a: "竖子安敢！"

 # ---------- 南方·侨置 ----------
 hd_yiguan.1201.t: "侨立州郡"
 hd_yiguan.1201.desc: "请见的士人报完姓名，又郑重添上旧乡的郡望。我问南来已有几年，他略一迟疑，说家中幼子已不记得北方的屋舍，可祖辈传下的籍贯，总不能就此不认。随后，他呈上侨立[hd_yiguan_qiao_title.GetName]的请求。\n\n他盼流寓的同乡另有所属，也盼故土虽失，朝廷仍肯保留那个名字。属吏提醒我，侨置须有人主持，不能只添一块名号；地方上的人，也会问为何要在自己的地界内另立旧郡。\n\n我再次看向请见者。他所求的既是安顿众人的办法，也是一个可向乡党带回去的回答：南来以后，朝廷还认不认他们祖辈留下的籍贯。"
 hd_yiguan.1201.a: "侨立州郡，以系人心。"
 hd_yiguan.1201.b: "此事容后再议。"
 hd_yiguan.1202.t: "侨郡安户"
 hd_yiguan.1202.desc: "登记流人的吏员把几份名籍并列，请我看同一户人家：住处写在本县，籍贯却属北方，上一处落脚的地方又曾给他们记过一次。到了征役时，两边相互推问，谁也说不清该听哪里管。\n\n僚属建议另立侨郡，把散处的北人收在同一册内，暂宽赋役，让他们安心垦殖。另一人却问，既已住在此地，为何还要与本地百姓分开？同样耕田，所负的役不同，迟早会惹来争执。\n\n我翻到那户人家的名字，旁边还记着一个新添的孩子。名籍里的去留归属，正落在一户户已经开始过日子的人身上。"
 hd_yiguan.1202.a: "侨立郡县，安置流人。"
 hd_yiguan.1202.b: "暂不另立侨郡。"
 hd_yiguan.1203.t: "侨旧之争"
 hd_yiguan.1203.desc: "席间有人称许北方人物，一位江东士人便放下酒杯，问既然南土如此不足道，诸君当日又为何渡江。北来的客人脸色一变，随即说起祖辈官望，话中渐渐带出了对方不肯受的轻慢。\n\n我出言止住争执，才听见他们真正要说的事：一边盼朝廷任用故家的才士，一边怨官位与田地被南来者分去。方才还只是在争一句评语，此时双方的随从也都望向了我。\n\n谁都愿听一句公允之论，却都盼那句话先替自己撑腰。若要两边暂且和解，空说同心共事恐怕不够；我得决定，愿为这场争执拿出什么。"
 hd_yiguan.1203.a: "北来士族，国之栋梁。"
 hd_yiguan.1203.b: "江东旧族，立国之本。"
 hd_yiguan.1203.c: "厚加赏赐，两相调和。"
 hd_yiguan.1210.t: "土断"
 hd_yiguan.1210.desc: "核户的吏员指着一处田庄，说这家南来时尚无屋舍，如今已有田有宅，名籍却仍列在侨郡，赋役也照旧从轻。我正要问下去，陪坐的北来士人先开了口：故乡尚未收复，怎么就要替众人断了归路？\n\n僚属请行土断，以现居之地编户，使侨旧所负渐归一致；反对者却说，当年的安置原有承诺，今日骤然更改，只会教人觉得朝廷失信。\n\n我看着两套并行已久的名籍。有人借此免役，也有人仍当它是返乡的凭据；若落笔改定，增加的是可以征发的户口，触动的却不只是几个数字。"
 hd_yiguan.1210.a: "以土断之，一体编户。"
 hd_yiguan.1210.b: "北人思归，不可遽断。"

 # ---------- 南方·北府军 ----------
 hd_yiguan.1301.t: "北府初建"
 hd_yiguan.1301.desc: "谈起京口、广陵的北来人，献策的将吏忽然问我：这些人曾各自结众渡过兵乱，为何如今反倒任其散处，不加编练？他说其中不乏能战者，只是乡党各有首领，若无统一号令，临敌仍难彼此接应。\n\n我听他说明募兵之法。北方的故土可以使人奋起，也可能使人只肯追随本乡的将领；要练成可用的精兵，不能只给一个名号，还得使他们知道由谁统领、为何而战。\n\n将吏请就这一带招募北人，号为北府。我把目光移向在旁候命的人。军伍一旦编定，此后江防所倚，又将多出一支力量。"
 hd_yiguan.1301.a: "募北人为兵，号曰北府。"
 hd_yiguan.1301.a.tt: "#EMP 衣冠南渡期间，可在京口、广陵招募北府兵。#!"
 hd_yiguan.1302.t: "北府名将"
 hd_yiguan.1302.desc: "诸将推举[hd_yiguan_beifu_general.GetName]时，先说的是几次临阵的经过：别人尚在整队，此人已带兵趋前；战后分给士卒的东西，也总有人愿意记着。听到这些，他没有插话，只在被问及军务时才简短作答。\n\n荐者说，北府诸部肯服他，请我专任其事，省得号令不一。近臣却提醒，能使将士效死固然可贵，朝廷也不能只凭一个人的威望来节制军队。\n\n我看着这位新被推到众人面前的将领。把兵交到他手里，或许能收整军之效；若分授诸将，眼前的人情却不会毫无损伤。荐书已呈上，只等我定夺。"
 hd_yiguan.1302.a: "委以兵权，专任北府。"
 hd_yiguan.1302.b: "兵权不可专于一人。"
 hd_yiguan.1303.t: "北府拥兵"
 hd_yiguan.1303.desc: "催问军务的人又回来了，带回的仍是含糊的答复。[hd_yiguan_beifu_general.GetName]迟迟不按调令办事，京口送来的军情也渐渐稀少；有人说军中只认将军，我追问实据，近臣便指着几次未得执行的命令，让我自行判断。\n\n如今若派人夺其兵权，须防将士不服；若加以赏赐，可以缓和眼前的嫌隙，却未必使号令从此畅通。也有人劝我暂且容忍，莫在有敌之时先乱自己的军心。\n\n我重新问了一遍使者，对方可曾给出照令办理的确切日期。他摇头。无论那人心中如何打算，朝廷不能总在这里等一句迟来的回话。"
 hd_yiguan.1303.a: "夺其兵权，以绝后患。"
 hd_yiguan.1303.a.tt: "#EMP 此人或会据京口起兵。#!"
 hd_yiguan.1303.b: "厚加赏赐，以安其心。"
 hd_yiguan.1303.c: "且由他去。"

 # ---------- 北方·流民逃窜 ----------
 hd_yiguan.2001.t: "汉民南奔"
 hd_yiguan.2001.desc: "巡骑回来时，只带了几件从路边拾起的杂物：破草履、断了的车绳，还有一只没能带走的陶罐。村里又少了一批汉户，趁夜举家往南去了。部将请我派兵追赶，说放任此事，余下的人更不会安分。\n\n管田租的属吏想的却是另一层：人若不断离散，田地无人收割，留下的几户也承担不起原来的征敛。他请我先宽其负担，让尚在观望的人知道，留下来也能过活。\n\n我让人问清出走者经过的关口。是要用追兵把人赶回，还是花钱安顿尚未离乡的人，今日总须定下一种办法。"
 hd_yiguan.2001.a: "发兵追回，以儆效尤。"
 hd_yiguan.2001.b: "跑便跑了，何足挂齿。"
 hd_yiguan.2001.c: "宽其赋役，安抚留民。"
 hd_yiguan.2002.t: "坞主出走"
 hd_yiguan.2002.desc: "从[hd_yiguan_occ_county.GetName]回来的人身上还带着焦味。他说那位汉人坞主已带众南去，仓中的粮没运走，竟一把火烧了；留下的话更难听，宁可死在路上，也不肯再受我们的驱使。\n\n部将听罢便请追击，要让其余坞主知道，不能这样说走就走。属吏却问起附近的农户：粮仓既毁，未走的人拿什么度日？若只派骑兵过去，人人惊惧，恐怕又要少去几村户口。\n\n我不愿因为一句传回来的辱骂，就凭意气处置此事。可烧毁的粮食不会回来，空下的坞堡也得有人收拾，几种处置都摆在了眼前。"
 hd_yiguan.2002.a: "遣骑追之，勿使漏网。"
 hd_yiguan.2002.b: "由他去吧。"
 hd_yiguan.2002.c: "开仓抚民，以收人心。"
 hd_yiguan.2003.t: "边县空虚"
 hd_yiguan.2003.desc: "[hd_yiguan_occ_county.GetName]的地方官报到一半，便将声音压低了：田里还有成熟的庄稼，村中却凑不出足够的人手，连本期应输的粮也无处征取。我问那些人去了哪里，他只得答，多半已经往南。\n\n部将说应严查关津，再不能任人随意越境。地方官却求我先给剩下的人一条生路，若仍照原额催征，逃亡只会更多。两人争执时，一个在数可守的路口，一个在数尚未空掉的村落。\n\n我叫他们停下。边县的空虚，靠一句严令补不回来；可放任不问，也等于看着手中的田土一点点失去耕作的人。"
 hd_yiguan.2003.a: "严查关津，追捕逃人。"
 hd_yiguan.2003.b: "听之任之。"
 hd_yiguan.2003.c: "开仓赈济，招徕流亡。"
 hd_yiguan.2011.t: "族人议南渡"
 hd_yiguan.2011.desc: "家中长辈把几个子弟叫来，又叫他们先退到门外，才说起南渡的事。有人主张先送几人去江左，万一北方再乱，宗族总还有一处可投；另一人立刻问，若人都走了，祖坟和田宅交给谁守？\n\n我听着他们争论，知道此事还不是举族迁徙。肯走的子弟须有人接纳，留守的人也须能自保；筑坞聚众要费力，劝乡里奉事宗主，则难免被指为只顾眼前的安稳。\n\n门外响起低低的问话，显然年轻人也在等消息。我看向满座的族亲。由谁南下，由谁留下来应付此后的兵乱，不能只凭一句大义便定下。"
 hd_yiguan.2011.a: "遣子弟南渡，以存宗祀。"
 hd_yiguan.2011.b: "据坞自守，不离乡土。"
 hd_yiguan.2011.c: "劝谕乡里，安心事主。"
 hd_yiguan.2012.t: "父老请命"
 hd_yiguan.2012.desc: "父老来时，带着各家凑成的几份名册。老人指着上面的名字，说征粮、征丁一回接一回，几户人家连下田的人都难留下；末了又问，若要筑坞，是否还能赶在下一拨兵过境以前动工。\n\n也有人听说江左肯收北人，求我先送子弟过去打听。我提醒他们路途艰难，家眷未必能立刻跟上，老人却答，只要先有一人站住脚，总好过处处没有退路。旁边的人仍舍不得离开祖辈的土地。\n\n他们各有主张，却都不肯独自作决定。我望着那些名册，知道无论劝留、遣人南下还是聚众自守，乡里都会把我的话带回各家。"
 hd_yiguan.2012.a: "遣子弟先行南下。"
 hd_yiguan.2012.b: "筑坞聚众，誓守乡里。"
 hd_yiguan.2012.c: "且忍一时，劝民归附。"
 hd_yiguan.2013.t: "南朝密使"
 hd_yiguan.2013.desc: "来人进门后，先确认廊下无人，才说自己奉江左之命而来。我问他所求何事，他没有催我立刻起兵，只说南方愿接纳北方士人，若尚有疑虑，可以先遣族中子弟同去，看看那边究竟如何。\n\n这话比空许高位更切近眼前，却也并非全无危险。子弟一走，往来若被人察知，宗主必会追问；可若始终守着一处坞堡，下一次征发与兵乱又该怎样应付？\n\n我没有让他继续说那些堂皇的劝辞，先问清道路与接应之处。他一一回答后便住了口，等我决定，是要替家门留一条南路，还是仍把生计押在此地。"
 hd_yiguan.2013.a: "遣子弟随使南归。"
 hd_yiguan.2013.b: "南朝路远，不如自守。"
 hd_yiguan.2013.c: "此事不可再提。"

 # ---------- 北方·义军起义 ----------
 hd_yiguan.2101.t: "坞堡起兵"
 hd_yiguan.2101.desc: "逃回来的吏员不肯再往前走，说[hd_yiguan_occ_county.GetName]那处坞堡已经关门举兵，派去办事的人被杀，乡里正接到号召，要一同驱逐我们。报出的首领姓名，是[hd_yiguan_new_leader.GetName]。\n\n部将请立即发兵，趁附近各坞尚未响应，先打掉这处祸根。也有人劝我许以官职：这些豪强本就能聚众，若肯受命，未必不能反过来替我守住地方。管钱粮者提议拿出财货，试着劝聚来的人散去。\n\n我问坞中究竟有多少兵，来人只能说个大概。我让他坐下歇息，继续问沿途所见。消息尚不齐备，地方却等不得我把一切问清再作回应。"
 hd_yiguan.2101.a: "发兵进剿！"
 hd_yiguan.2101.b: "许以官职，招安其众。"
 hd_yiguan.2101.c: "以财货散其部众。"
 hd_yiguan.2102.t: "乞活军"
 hd_yiguan.2102.desc: "地方报来一个名字，叫作“乞活”。最初听见时，我还以为只是饥民求食，直到报信者说起[hd_yiguan_occ_county.GetName]被截断的道路，才明白他们如今已有兵刃，也有了统领之人：[hd_yiguan_new_leader.GetName]。\n\n据报，这群人携着家口转战求生，肯为粮食拼命，也不断招集流散者，与我们的兵马相抗。部将要出兵进剿，属吏却说，若能授其首领以职任，或给钱粮遣散，也许不必把每一个饥民都逼上战场。\n\n我让人再查他们驻留之处，也问附近还有多少人可能投去。所谓求活，究竟还容不容得下交涉，要看我准备先送去什么。"
 hd_yiguan.2102.a: "剿灭乞活，以安地方。"
 hd_yiguan.2102.b: "收为我用。"
 hd_yiguan.2102.c: "赐以钱粮，令其散去。"
 hd_yiguan.2103.t: "豪杰举义"
 hd_yiguan.2103.desc: "[hd_yiguan_occ_county.GetName]传来的消息越来越急。[hd_yiguan_new_leader.GetName]举兵之后，附近汉人相继响应，传来的檄文满是诛灭胡人的言辞；逃出当地的人更说，已有不少族人在乱中遭到杀害。\n\n将领请我集兵迎击，不能任其继续聚众。另一人却劝先以高位招揽，设法分化各路人马；若能暂缓锋芒，即使先送一笔财货，也比仓促迎战稳妥。两人说到激烈处，都要求我立刻表态。\n\n我先问逃来的人是否已得安置。眼前的威胁比寻常聚众更大，却也更不能只凭愤怒处置；一声发兵令下，便再难把此事当作地方纷争了。"
 hd_yiguan.2103.a: "倾国之兵，务必剿灭！"
 hd_yiguan.2103.b: "许以高位，以分其势。"
 hd_yiguan.2103.c: "重金赂之，暂缓其锋。"
 hd_yiguan.2111.t: "邻县举义"
 hd_yiguan.2111.desc: "邻近的[hd_yiguan_up_county.GetName]起兵了。[hd_yiguan_new_leader.GetName]的檄文被人悄悄送进来，宣称各地汉人应当一同举事。我读到末尾，身边的人便问，这份东西是要收好，还是交给宗主？\n\n若公开响应，我便须让自己的兵与义军并肩，成败都不能再置身事外；若告发，也许能换得宗主信任，却要同那些起兵者结下怨隙。有人低声提议，不如先送些粮械，不露自己的旗号。\n\n我抬头看向门口。此时外面仍像平日一样有人往来，送信者却还在里面候着，等着我说话。我要他带回去的答复，会决定下次见面时，我们究竟是同袍还是仇敌。"
 hd_yiguan.2111.a: "共举义旗，驱逐胡虏。"
 hd_yiguan.2111.b: "告于宗主，以表忠心。"
 hd_yiguan.2111.c: "暗中输送粮械。"
 hd_yiguan.2112.t: "义军来使"
 hd_yiguan.2112.desc: "卖货的人留到最后，等左右离开，才从包袱里取出[hd_yiguan_new_leader.GetName]的书信。他说义军已在[hd_yiguan_up_county.GetName]起事，请我出兵相应；若仍犹疑，至少不要使他们孤立无援。\n\n我没有立刻用印作答。公开举旗，就要与宗主兵刃相见；将书信呈给宗主，又等于亲手断了这边的往来。随从见我不语，补了一句，粮械也能救急，并非只有出兵一法。\n\n廊外有人经过，他立刻住口，把散在面前的小物件重新摆作货样。我等脚步远去，才示意他继续候着。这一次，他须带回去的不能只是一句含糊的话。"
 hd_yiguan.2112.a: "里应外合，共襄义举。"
 hd_yiguan.2112.b: "将来书呈报宗主。"
 hd_yiguan.2112.c: "资以粮械，不露形迹。"
 hd_yiguan.2113.t: "故旧相邀"
 hd_yiguan.2113.desc: "来人替[hd_yiguan_new_leader.GetName]带来口信，说北方同受兵乱之苦，请我看在同为华夏人的情分上，出兵相助。我先问清如今兵在哪里，粮食还能支撑多久。\n\n话说到实处，他才说明，义军盼我公开响应，若暂不能举旗，暗助粮械也好。这份求援，此刻落到我身上，便成了军伍的去向与家门的安危。将消息告于宗主，同样是一条不能轻易收回的路。\n\n我听完最后一句，仍让使者等着。求援的话他可以反复陈说，如何承担举兵的后果，却终须由我自己决定。"
 hd_yiguan.2113.a: "出兵响应，共担此事。"
 hd_yiguan.2113.b: "告于宗主，免累家门。"
 hd_yiguan.2113.c: "暗中资助义军。"
 hd_yiguan.2120.t: "归南之议"
 hd_yiguan.2120.desc: "庆贺得胜的人尚未散尽，南方来使便问起此后的归属。他说，既已挣脱旧主，何不率众归附江左，使南北同奉一处正朔？随我举兵的人却有人摇头，认为好不容易自立，不该又受别人号令。\n\n我看着这几张在战事中熬得消瘦的面孔。归附可以使眼前的胜利有个依托，日后也须承认新的上下之分；保持自立，许多应付邻境、筹粮守土的事，便仍要自己承担。\n\n来使等候答语，没有再催。战争替我取回了作决定的余地，却没有替我决定该怎样使用它。此番要送往南方的回应，就将定下此后的名分。"
 hd_yiguan.2120.a: "归附南朝，以全臣节。"
 hd_yiguan.2120.b: "自立门户，不必依人。"

 # ---------- 北方·胡汉对峙 ----------
 hd_yiguan.2201.t: "胡汉争田"
 hd_yiguan.2201.desc: "争田的两边把断木和受伤的人一同带来。一边说，牧畜经过的旧路被耕开，牲口无处去；另一边却说，刚长起的禾苗被践踏，若连田都保不住，全家今冬吃什么？话未说完，两边又互指先前械斗死伤的责任。\n\n我让各自的首领先约束众人。属吏建议划清所居所业，使胡汉各听各的官司；汉人士人却请按田亩实情裁处，让熟悉农事者参与治理。本族将领不以为然，只说不可纵容抗命。\n\n地上那截断木原是一道田界，如今两边争的，却是往后究竟该听谁的规矩。"
 hd_yiguan.2201.a: "胡汉分治，各安其业。"
 hd_yiguan.2201.b: "汉人善治田亩，当用其长。"
 hd_yiguan.2201.c: "汉人刁顽，严加管束。"
 hd_yiguan.2202.t: "胡人凌汉"
 hd_yiguan.2202.desc: "城中商户来告时，仍把被夺去的东西一件件念出来，念到家中妇人受辱，便说不下去了。我问是谁带的兵，随行者先看了看身旁的本族将领，才低声报出名号。将领却说，军士不过取些所需，何必听人夸大。\n\n人已告到这里，我不能假作没有听见。使胡汉各归其所，可以少些争端；任用熟悉地方的汉士，也许能让申诉不必再辗转至我面前。若只用威势压住怨言，眼下或许安静，往后又须怎样维持？\n\n我让告状者把未说完的话说完。周围的人都在听，我此刻的答复，也会很快传遍城里。"
 hd_yiguan.2202.a: "胡汉各归其所，不得相扰。"
 hd_yiguan.2202.b: "擢用汉士，整顿地方。"
 hd_yiguan.2202.c: "汉人怨望，正当示之以威。"
 hd_yiguan.2203.t: "汉士进言"
 hd_yiguan.2203.desc: "那位汉士说到田租与狱讼，起初还有些拘谨，见我肯听，便直言骑兵可以夺城，却不能日日靠刀兵收拾城中的事务。本族将领在旁冷笑，问若照他的办法，难道功劳最大的将士反要听那些书生指使？\n\n汉士没有退开，只请我看看，征粮、编户、断案，哪一件不须有人熟知地方。他所求的并非一场空谈，而是让汉人有参与治理的位置。也有人提议仍分开官司，各循其俗，免得骤改引起怨望。\n\n我把话头从争论拉回来，请他们先说眼前该交给谁办理。愿听一种道理容易，肯让说这道理的人任事，才要真正作出取舍。"
 hd_yiguan.2203.a: "胡有胡法，汉有汉制。"
 hd_yiguan.2203.b: "先生所言甚是。"
 hd_yiguan.2203.c: "腐儒妄言，逐出帐外。"
 hd_yiguan.2211.t: "胡吏凌辱"
 hd_yiguan.2211.desc: "家人回来时，袖上留着血痕。我还未问清，族人已抢着说，是宗主派来的官吏当众用鞭，辱骂汉人只是奴仆；有人要立刻去讨个说法，也有人先关了门，怕争执传出去，反惹来更重的处分。\n\n我让受伤的人坐下，听完事情经过。隐忍可以暂保家门，却还得承受众人难以出口的怨气；向宗主陈说是非，至少能表明我不肯任人凌辱，只是宗主肯不肯听，我也没有把握。南方的往来，此时又被悄悄提起。\n\n家人始终没有催我。可这一圈沉默的人，都在等着看，我还能用什么办法护住他们。"
 hd_yiguan.2211.a: "忍辱负重，暂且隐忍。"
 hd_yiguan.2211.b: "上书宗主，据理力争。"
 hd_yiguan.2211.c: "暗通南朝，以图后计。"
 hd_yiguan.2212.t: "宗主征发"
 hd_yiguan.2212.desc: "征发的命令传到乡里，几名父老便赶来求见。他们问本次要出多少丁壮、运多少粮，问完又把上回未归的人逐一数给我听，说田里尚有活计，家中也还有老幼，实在禁不起再抽一次。\n\n宗主催得急，送令者仍在候回话。奉命办理，眼前不致生出抗命之嫌，可乡里承受的疲敝不会因此减轻；上书请减，便得由我替这些人说出难处。有人趁左右退下时低声劝我，何妨另遣一人往江左看看。\n\n我让父老先将各家的实情留下。随后该以何种口气回报宗主，又该对门外等候的人说什么，已经不能再推给下一名吏员。"
 hd_yiguan.2212.a: "奉命唯谨，不敢有违。"
 hd_yiguan.2212.b: "民力已竭，请减征发。"
 hd_yiguan.2212.c: "遣使南朝，另寻依托。"
 hd_yiguan.2213.t: "南音北传"
 hd_yiguan.2213.desc: "族中年轻人读到一篇南来的文章，兴起争论江左人物，说那边士人可以从容清谈，不似我们处处受人节制。年长者连忙使眼色，见我进来，才把卷子收起，屋里忽然只剩下刻意压低的寒暄。\n\n我让他们不必藏着。纸上的风流自是一回事，流传来的消息也未必全真；可他们向往的，终究还有一份不愿明说的体面。只劝慎言，可以免去眼前口舌；向宗主陈情，或遣人南下，各会把这点不满带往不同的地方。\n\n年轻人仍望着我的手，等着看我会收走那卷文章，还是把它还给他。我知道自己将说的话，不会只被当作谈论文辞。"
 hd_yiguan.2213.a: "慎言！祸从口出。"
 hd_yiguan.2213.b: "胡汉一体，宗主当善待汉人。"
 hd_yiguan.2213.c: "遣人南下，暗结江左。"

 # ---------- 举州归南·通知 ----------
 hd_yiguan.3101.t: "举州来归"
 hd_yiguan.3101.desc: "北方的使者抵达时，鞋上还带着赶路的泥。他奉[hd_yiguan_gn_vassal.GetName]之命，说明起兵脱离旧主、举州来归之意。我问那边的兵粮与道路，他逐项作答，神色间终于有了一点盼见援军的急切。\n\n接应的军令已经发出，我此刻收到的并不是一份可以慢慢搁置的请托。北去的兵马要知道往何处会合，归附的一方也须知道援兵确在路上，免得各自等候，误了战机。\n\n我让人把双方所知的军情再核对一遍。来使带回去的，应当是清楚的消息：此处已应了他的来意，往后还要靠阵前的将士守住这份约定。"
 hd_yiguan.3101.a: "王师北上，接应义士！"
