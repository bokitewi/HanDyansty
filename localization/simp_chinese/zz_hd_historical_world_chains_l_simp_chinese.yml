 hd_fengying.0001.t:0 "奉迎天子"
 hd_fengying.0001.desc:0 "一说到奉迎天子，帐中忽然多了许多忠义之言。你听他们轮番说罢，只问了一句：“车驾由谁护送？到了之后，又驻跸何处？”这一回，众人便没有方才那样齐声了。\n\n你把长安与许昌之间的道路指给众人看。要迎天子，先须经营司隶、拿下长安，再将车驾安顿到许昌去。天子的名分在那里，可要让这名分号令四方，靠的是兵马钱粮，不是臣子的几行眼泪。\n\n也有人劝你只表护送之意，或干脆不问此事。你的手指停在许昌上，没有移开。这样的机会摆在眼前，你若不取，总会有别人去取。"
 hd_fengying_cao_receive:0 "经营司隶，奉迎车驾。"
 hd_fengying_cao_warfare_unlocked:0 "从此你可借奉迎天子之名，向据守长安之人兴兵问罪。"
 hd_fengying_cao_escort:0 "但表护驾之意，不揽朝政。"
 hd_fengying_cao_refuse:0 "此事不预，且顾眼前。"

 hd_cao_fengying_cb:0 "挟天子以令诸侯"
 hd_cao_fengying_cb_name:0 "挟天子以令诸侯"
 HD_CAO_FENGYING_WAR_NAME:0 "曹操夺取长安之战"
 hd_cao_fengying_victory_desc:0 "曹操夺取京兆及其辖下诸县。若许昌仍在其掌握之中，便迎天子驻跸许都，以摄政总揽朝政，天子直辖之地与诸侯尽归其节制，公卿百官仍直属天子；若许昌已失，则暂据长安，待重得许昌再迎车驾。"
 hd_cao_fengying_no_victory_desc:0 "曹操未能夺取长安。司隶的宣称仍在，[truce|E]期满之后，尚可再举。"
 hd_cao_fengying_start_war_decision:0 "发动挟天子以令诸侯"
 hd_cao_fengying_start_war_decision_desc:0 "京兆仍握在旁人手里。不先取长安，奉迎二字便只是一句空话。"
 hd_cao_fengying_start_war_decision_tooltip:0 "以“挟天子以令诸侯”为名，向据有京兆之人开战。"
 hd_cao_fengying_start_war_decision_confirm:0 "进取长安！"

 hd_historical_world.0100.t:0 "官渡之前"
 hd_historical_world.0100.desc:0 "军报又提到袁绍，帐中有人先叹了一口气。你让他把这口气省着，先将黄河两岸的守备说清楚。袁军人多固然吓人，却还不至于叫你的军议只剩下叹息。\n\n舆图上官渡一处，已被手指点过许多遍。你看着各路粮道，问敌营的动静，也问自家侧后。众人的议论渐渐分作几派：有人主战，有人主守，有人主和，也有人劝你先收拾别处的敌人。\n\n你听罢，指尖仍按着图角。本初不会因为你们议得周全便少来一队兵马；可这一阵声势该如何接下，也轮不到他替你做主。"
 hd_historical_world.0100.alt_desc:0 "官渡的军议说到一半，原拟的军令却发不出去了。疆界、旧约与上下统属的牵连一条条报上来，方才力主进兵的人，也开始改口。\n\n你把那份未发的文书折起。眼下既然不能这样开战，也不必再说一遍壮语，把众人留在帐里干等。\n\n“换个说法。”你示意诸将接着议。本初那边作何打算另当别论，你的兵马总不能一直等着一道发不出去的军令。官渡之议，该在今日有个了断了。"
 hd_historical_world.0100.small_realm_desc:0 "有人把官渡之议说得慷慨激昂，仿佛号角一响，便能惊动天下。你让他先把手中的军籍念一遍，帐中果然比方才安静了些。\n\n袁绍确须应付，可你手里的州县、兵粮也都摆在这里。要战，便凭这些家底去战；不战，也未必就是示弱。\n\n你把军籍推回案上。地盘虽小，进退之道却不能不想清楚。诸将已说得够多，该让他们听听你的安排了。"
 hd_guandu_decide_battle:0 "决战官渡，以拒本初。"
 hd_guandu_defend_yellow_river:0 "沿河固守，不与争锋。"
 hd_guandu_compromise:0 "暂且退让，与本初言和。"
 hd_guandu_clear_other_enemies:0 "先靖侧后，再图河北。"
 hd_historical_world.0190.t:0 "官渡：河北军退"
 hd_historical_world.0190.desc:0 "“袁军退了！”来人报到第二遍，你才真正放下手中的文书。帐外已有人欢呼起来，你笑着问他，是亲眼看见的，还是急着来讨赏？他忙把经过又细说了一遍。\n\n确是赢了。昨日还要掐着粮数熬日子，今日那些劝你先想退路的人，倒都急着议论河北。你让他们先把各部收拢、把粮道接上，别把刚到手的胜局又闹成一团。\n\n走出帐口，欢呼声更响了。你抬眼望向北方，胸中憋着的那口气这才吐尽。本初的根本还在；也好，往后该轮到他仔细读你的军报了。"
 hd_historical_world.0191.t:0 "官渡：袁军得胜"
 hd_historical_world.0191.desc:0 "曹军败了。捷报读到这一句，帐中静了片刻，随即贺声连成一片。你让来人再读一遍，尤其要把曹军如何退走说清楚。\n\n先前那些疑你用兵的人，此刻一个比一个恭谨。你没有当场翻他们的旧账，只把报捷文书放在案头最前，命左右清点所获、安顿将士。将士们替袁氏挣来的声势，不能只化作席间几杯酒。\n\n至于孟德还剩多少根本，可以随后再议。今日官渡已胜，便该让天下人都知道，这一场中原之争，究竟是谁先低了头。"

 hd_historical_world.0200.t:0 "赤壁之前"
 hd_historical_world.0200.desc:0 "荆州的答复已经收下，左右却仍围着江东水道各执一词。你让他们先把水军、粮道与军中情形列清楚，别只把对岸的城邑念给你听。\n\n有人请即刻进军，有人请再整顿一月。你把舟船与粮秣的簿册一一看过，问清哪些隐患已经料理，哪些还须提防。先前的话听过一遍便够了，今日行事，得有今日的凭据。\n\n江东就在眼前，收兵也仍是一条路。你将舆图铺开，不急着让任何人替你的雄心下结论。是进是整，还是到此为止，全军都在等你的号令。"
 hd_historical_world.0200.alt_desc:0 "渡江的军议又被一份新报打断。你读过其中领属与旧约的变化，把原拟的号令压在案下，帐中几人随即闭了口。\n\n他们大概在等着看你是否发怒。可怒了又能如何，难道江上的水道会照着旧图重新摆过？眼下既不能照原议与江东决战，便只好另作打算。\n\n你叫人换过一份文书。前一步走到了这里，并不等于下一步只剩一条路。总得让全军知道，今日究竟该做什么。"
 hd_chibi_continue_southeast:0 "挥师东下，直指江东。"
 hd_chibi_prepare_fleet:0 "整饬舟师粮道，月余再议。"
 hd_chibi_withdraw:0 "罢兵北还，休养士卒。"
 hd_chibi_hold_jingzhou:0 "适可而止，不复东进。"
 hd_historical_world.0210.t:0 "荆州去就"
 hd_historical_world.0210.desc:0 "曹军逼近的消息传入州府，议事的人分成了两派。一派说荆州山川可守，另一派反复盘算兵粮，说到最后，只剩一句“不如保全百姓”。\n\n你望着案上的州印。无论从前谁许诺过什么，如今执掌荆州的是你，降与守的决断，推不到一个不在场的人身上。\n\n堂外还在催问回话的时辰。你止住众人的争执，让他们先听你自己的决定。"
 hd_chibi_jingzhou_surrender:0 "举州归附，以全士民。"
 hd_chibi_jingzhou_resist:0 "据险固守，誓不降曹。"
 hd_historical_world.0290.t:0 "赤壁：北军退却"
 hd_historical_world.0290.desc:0 "北军退了。江上送来的战报一再印证此事，直到各处守军也报来同样的消息，帐中众人才真正松了一口气。\n\n你望着尚未平静的江面，听取伤亡与追击的回报。挡住了曹军，不等于往后的江防便可松懈；对岸仍有再起之力，你们自己也有须收拢的将士、须修补的舟船。\n\n有人已经说起要如何传扬此战，你先让他退下。先把活下来的人安顿好，再把守住的地方稳住。江东眼前这一关过了，往后的路还得接着走。"
 hd_historical_world.0291.t:0 "赤壁：江防已破"
 hd_historical_world.0291.desc:0 "江防已破。前军报捷的人说罢，帐中竟有片刻无人接话。你看着众人，终于笑出声来：“方才还劝我慢些，如今倒都说不出话了？”\n\n众人这才一齐称贺。你让他们先把舟船与兵粮清点明白，打了胜仗若只顾争功，后头一样会乱。可那些原本只在图上隔着的水道，今日总算不再是伸手也够不着的去处了。\n\n江东往后作何打算，自会有人来报。你把那张南方的舆图铺得更开些，听帐外的报捷声一阵高过一阵。先把眼前所得接稳，余下的路，便不必总照他们的意思走了。"


