 hd_historical_world.0188.t:0 "镇抚荆州"
 hd_historical_world.0188.desc:0 "接掌荆州的任命送到，我将文书读罢，随即问起旧任所领的官吏与郡县。一个州名可以写得简短，交到手中的事务却不会因此少去半分。\n\n旧印、军籍、府库与所属之人，都须逐项交割。江汉之间原有各自经营的势力，未必只听说新刺史的名字，便肯将旧有安排尽数改过。\n\n我让人将能够接续的地方先列出来，余下的情形另行查报。此去既领朝廷之命，便该真正承担一州之责；待坐到州府案前，再说不知地方难处，已经迟了。"
 hd_historical_world.0188.a:0 "领荆州之任，办理州郡交割。"

