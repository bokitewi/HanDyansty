l_simp_chinese:
 HD_HISTORICAL_WAR_NAME:0 "[ATTACKER.GetPrimaryTitle.GetNameNoTierNoTooltip]与[DEFENDER.GetPrimaryTitle.GetNameNoTierNoTooltip]之战"
 hd_historical_war_victory_desc:0 "进攻方夺取正式战争目标。"
 hd_historical_war_white_peace_desc:0 "双方罢兵，土地不发生转移。"
 hd_historical_war_defeat_desc:0 "进攻失败，土地不发生转移。"
 hd_chain_acknowledge:0 "天下大势，由此而变。"
 hd_historical_world.0188.t:0 "镇抚荆州"
 hd_historical_world.0188.desc:0 "朝廷命我接掌荆州，以安定江汉。旧任刺史所辖官吏、郡县与军府必须一并交割；自今日起，荆州诸事皆由我裁处。"
 hd_historical_world.0188.a:0 "接掌荆州，整顿州郡。"

 hd_guandu_xu_you_wuchao_modifier:0 "乌巢粮道泄露"
 hd_guandu_xu_you_wuchao_modifier_desc:0 "许攸带来的情报使袁军粮道遭受严重威胁。"
 hd_guandu_scout_wuchao_modifier:0 "粮道受扰"
 hd_guandu_scout_wuchao_modifier_desc:0 "敌军侦察到了部分粮道，但情报远不如内应精确。"
 hd_chibi_risk_disease_modifier:0 "军中疫病"
 hd_chibi_risk_disease_modifier_desc:0 "长期远征使军中疾病蔓延，削弱作战优势。"
 hd_chibi_risk_expedition_modifier:0 "远征疲惫"
 hd_chibi_risk_expedition_modifier_desc:0 "北军长途南下，已经人马俱疲。"
 hd_chibi_risk_naval_modifier:0 "不习水战"
 hd_chibi_risk_naval_modifier_desc:0 "军队缺乏江上作战经验。"
 hd_chibi_risk_jingzhou_loyalty_modifier:0 "荆州新附"
 hd_chibi_risk_jingzhou_loyalty_modifier_desc:0 "新近归附的荆州军心尚未稳固。"
 hd_chibi_risk_tied_ships_modifier:0 "舰船相连"
 hd_chibi_risk_tied_ships_modifier_desc:0 "舰船相连虽减轻颠簸，却限制了机动。"
 hd_chibi_risk_logistics_modifier:0 "粮道绵长"
 hd_chibi_risk_logistics_modifier_desc:0 "漫长粮道难以支撑持续江战。"
 hd_chibi_risk_huang_gai_modifier:0 "火攻隐患"
 hd_chibi_risk_huang_gai_modifier_desc:0 "黄盖仍在江东军中，火攻威胁尚未消除。"
 hd_yiling_risk_supply_modifier:0 "夷陵粮道"
 hd_yiling_risk_supply_modifier_desc:0 "伐吴军的补给线狭长而脆弱。"
 hd_yiling_risk_mountain_modifier:0 "山地阻隔"
 hd_yiling_risk_mountain_modifier_desc:0 "山地限制了大军展开。"
 hd_yiling_risk_camps_modifier:0 "连营百里"
 hd_yiling_risk_camps_modifier_desc:0 "绵延营垒使军队难以迅速相互支援。"
 hd_yiling_risk_lu_xun_modifier:0 "陆逊统军"
 hd_yiling_risk_lu_xun_modifier_desc:0 "陆逊正在寻找反击的时机。"
 hd_yiling_risk_heat_modifier:0 "盛夏酷暑"
 hd_yiling_risk_heat_modifier_desc:0 "暑热正在侵蚀远征军的战斗力。"

