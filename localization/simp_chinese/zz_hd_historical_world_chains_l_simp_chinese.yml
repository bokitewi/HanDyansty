 hd_fengying.0001.t:0 "奉迎天子"
 hd_fengying.0001.desc:0 "谈到奉迎天子，帐中忽然多了许多忠义之言。我听他们轮番说过，才问了一句：“车驾由谁护来，到后又驻何处？”这回便没有方才那么齐声了。\n\n我将长安与许昌的道路指给众人。若真要接掌朝廷，就须经营司隶、掌握长安，再将车驾安置于许昌。天子的名位在那里，能使那名位发出号令的兵粮，却不能只从臣子的眼泪里来。\n\n有人劝我只表明护送之意，或暂且不问此事。我看向图上许昌，手没有移开。如此机会摆在眼前，取与不取，总须想清楚谁会替我取去。"
 hd_fengying_cao_receive:0 "主张司隶，筹办奉迎并安置朝廷。"
 hd_fengying_cao_warfare_unlocked:0 "获得司隶王国宣称，并解锁战争理由“挟天子以令诸侯”。赢得战争后夺取京兆；若已持有京兆，则无需宣战。接管朝廷时仍须控制许昌。"
 hd_fengying_cao_escort:0 "只表明护送之意，不接掌朝廷。"
 hd_fengying_cao_refuse:0 "不参与奉迎，另顾自身。"
 hd_fengying.0011.t:0 "天子可迎"
 hd_fengying.0011.desc:0 "天子失去强援，而河北兵强粮足。迎奉朝廷足以压倒群雄，却也会使百官和皇室成为军府中最难安置的一股力量。曹操同样在等待这个机会。"
 hd_fengying.0011.alt_desc:0 "迎奉天子的机会已经出现，但我眼下并非拥有独立领地的统治者，不能把朝廷安置在自己的治所。援助、观望与阻断他人仍是现实选择。"
 hd_fengying_yuan_receive:0 "迎天子至河北。"
 hd_fengying_yuan_hesitate:0 "此事牵累太多，暂且观望。"
 hd_fengying_yuan_aid:0 "供给车马，只作有限援助。"
 hd_fengying_yuan_obstruct:0 "截断道路，不让曹操得手。"

 hd_cao_fengying_cb:0 "挟天子以令诸侯"
 hd_cao_fengying_cb_name:0 "挟天子以令诸侯"
 HD_CAO_FENGYING_WAR_NAME:0 "曹操夺取长安之战"
 hd_cao_fengying_victory_desc:0 "曹操夺取京兆公国及其全部法理伯爵领。若仍控制许昌，便获得关中帝国、臣属于汉帝并成为固化摄政；汉帝直辖土地及可转属的直属封臣归曹操，帝国级官员仍直属汉帝。汉帝保留汉霸权，以无地朝廷及庄园驻跸许都。若已失去许昌，则保留京兆，待重新控制许昌后接管朝廷。"
 hd_cao_fengying_no_victory_desc:0 "曹操未能夺取长安。奉迎天子的资格与司隶宣称仍然保留，可在停战结束后再次挑战。"
 hd_cao_fengying_start_war_decision:0 "发动挟天子以令诸侯"
 hd_cao_fengying_start_war_decision_desc:0 "京兆仍掌握在他人手中。以奉迎天子的名义，向京兆公国的现任持有人正式宣战。只有夺取长安后，才会触发接管朝廷的历史结算。"
 hd_cao_fengying_start_war_decision_tooltip:0 "向京兆公国的当前持有人发动“挟天子以令诸侯”战争。"
 hd_cao_fengying_start_war_decision_confirm:0 "夺取长安"

 hd_historical_world.0100.t:0 "官渡之前"
 hd_historical_world.0100.desc:0 "军报又提到袁绍，帐中有人先叹了一口气。我让他把那口气省着，先将黄河两岸的守备说清。兵多固然吓人，还不至于让我的军议只剩叹息。\n\n图上官渡所在已被指过许多次。我看着各路粮道，问敌营动静，也问自己侧后。众人的话渐渐分出几路：迎战、自守、退让，或先料理别处的敌人。\n\n我听完，指尖仍按着图角。本初不会因为我们议得周全便少来一队兵；可怎样接下这一阵声势，也轮不到他替我决定。"
 hd_historical_world.0100.alt_desc:0 "官渡的军议说到一半，原拟军令却传不下去。疆界、旧约与节制的牵连被逐项报来，方才主张立即进兵的人，也开始改口。\n\n我将那份未发出的文书折起。眼下既不能如此开战，便不必靠再说一遍壮语把人都留在帐里。沿河自守、让步缓和，或先顾侧后之敌，仍各有办法。\n\n“换一条说。”我示意诸将继续。本初那边如何打算另当别论，至少我的兵不能永远等着一份办不成的军令。此次官渡之议，该在这里定个收束了。"
 hd_historical_world.0100.small_realm_desc:0 "有人把官渡之议说得雄壮，仿佛军号一响，便能惊动整个天下。我让他先把手中的军籍念一遍，帐中果然比方才安静了些。\n\n袁绍确须应付，可我手里的州县、兵粮也都摆在这里。要战，就用这些实有的力量去战；若先沿河守住，忍一时退让，或转而料理侧后的敌人，也都还有路可走。\n\n我将军籍推回案中。地盘虽小，还不至于连自己怎样进退都不会想。诸将已说够了，接下来让他们听听我的安排。"
 hd_guandu_decide_battle:0 "于官渡应战，迎击袁绍。"
 hd_guandu_defend_yellow_river:0 "转入沿河防守，不开这场决战。"
 hd_guandu_compromise:0 "让步缓和争端，即使有损声望。"
 hd_guandu_clear_other_enemies:0 "放下此次决战之议，另顾侧后。"
 hd_historical_world.0190.t:0 "官渡：河北军退"
 hd_historical_world.0190.desc:0 "“袁军退了！”来人报到第二遍，我才真正放下手中的文书。帐外已有人欢呼，我笑着问他，是亲眼看见，还是只想早点来讨赏？他忙把经过又说了一遍。\n\n确实赢了。昨日还得算着粮数熬日子，今日那些劝我先想退路的人，倒都急着谈河北。我让他们先把各部收拢，粮道接续，别把刚得来的胜局又闹成一团忙乱。\n\n走出帐口时，呼声更响。我抬眼望向北方，胸中那口气才终于吐尽。本初的根本还在；好，往后便轮到他仔细读我的军报了。"
 hd_historical_world.0191.t:0 "官渡：袁军得胜"
 hd_historical_world.0191.desc:0 "曹军败了。捷报读到这一句，帐中忽然静了片刻，随后称贺之声便连成一片。我让来人再读，尤其把曹军如何退去的经过说清楚。\n\n先前那些疑我用兵的人，此刻一个比一个恭谨。我没有当场翻他们的旧话，只将报捷文书留在最前，命左右核清所获、安顿军众。兵士替袁氏争来的声势，不能只落成席间几盏酒。\n\n至于孟德，他还有多少根本，可以随后再议。今日官渡已胜，便该让天下都知道，这中原之争究竟谁先低了头。"

 hd_historical_world.0200.t:0 "赤壁之前"
 hd_historical_world.0200.desc:0 "荆州的答复已经收下，左右却仍围着江东水道各持一说。我让他们先把水军、粮道与军中情形列清，别只把对岸的城邑念给我听。\n\n有人愿立即进军，有人请再用一月整顿。我沿着舟船与补给的记录看过，问清哪些隐患已处理，哪些仍要防备。先前的话听过一遍便够，今日得有今日的根据。\n\n江东就在前面，收兵也仍是一条路。我将舆图铺开，不急着让任何人替我的雄心下结论。向前、暂整，还是到此为止，这支军队还在等我的号令。"
 hd_historical_world.0200.alt_desc:0 "渡江的军议又被一份新报打断。我读过领属与旧约的变化，将原拟发出的号令压在案下，帐中几人随即不再说话。\n\n他们大概等着看我是否发怒。怒了又能怎样，难道江上的水道便会照着旧图重新摆过？眼下不能依原议向江东决战，便可先整顿水军粮道，一月后再议；也可收兵，或到此止住远征。\n\n我叫人换一份文书。前一步走到了这里，并不使下一步只剩一种走法。总得让全军知道，今日究竟该做什么。"
 hd_chibi_continue_southeast:0 "继续东南进军。"
 hd_chibi_prepare_fleet:0 "整顿水军与粮道，一月后重议。"
 hd_chibi_withdraw:0 "结束此次远征，收兵整顿。"
 hd_chibi_hold_jingzhou:0 "不再东南决战，到此收住进军。"
 hd_historical_world.0210.t:0 "荆州去就"
 hd_historical_world.0210.desc:0 "曹军逼近的消息送入州府，议事的人分作两边。一边说荆州地势可守，另一边反复计算兵粮，谈到最后，只剩一句不如保全民众。\n\n我望着摆在案前的州印。无论旧日谁许过什么，眼下掌着荆州的人是我，交出与守住的决定，也不能推给一个不在这里的人。若举州归附，所领名位与部属便交由曹操；若拒绝，就须承担继续抵抗的后果。\n\n堂外还在催问回话的时辰。我将众人的争论止住，让他们先听完我自己的决定。"
 hd_chibi_jingzhou_surrender:0 "交出荆州，向曹操归附。"
 hd_chibi_jingzhou_resist:0 "拒绝交州，继续抵抗。"
 hd_historical_world.0290.t:0 "赤壁：北军退却"
 hd_historical_world.0290.desc:0 "北军退了。江上送来的战报反复确认着这个消息，直到各处守军也报来相同的结果，帐中的人方才真正松下一口气。\n\n我望着仍未平静的水面，听取损失与追击的回报。挡住曹军，不等于往后的江防便可废弛；对岸仍有能再起兵的根本，我们自己也有须收拢的将士与须修整的舟船。\n\n有人已经谈起如何传扬此战，我先让他退后。先把活下来的人安顿好，再把守住的地方稳住。江东眼前这一步走过了，往后的路还得继续走。"
 hd_historical_world.0291.t:0 "赤壁：江防失守"
 hd_historical_world.0291.desc:0 "江防已破。前军报捷的人说完，帐中竟有片刻无人接话，我看着他们，终于笑出声来：“方才还劝我慢些，如今倒都说不出话了？”\n\n众人这才一齐称贺。我让他们先将舟船与兵粮核清，胜仗之后若只顾争功，后面一样会乱。可那些原本隔在图上的水道，今日总算不再只是我伸手也摸不到的去处。\n\n孙、刘往后如何打算，自会有人来报。我将那张南方舆图铺得更开些，听帐外的报捷声一阵高过一阵。先把眼前所得接住，余下的路，便不必总照他们的意思走了。"

 hd_liu_bei_late.2200.t:0 "留镇荆州"
 hd_liu_bei_late.2200.desc:0 "益州大局已定，荆州必须交给一位能够独当一面的最高统治者。关羽威望、资历和忠诚俱足，但任命也会改变荆益两地的权力结构。"
 hd_lb22_appoint_guan_yu_jingzhou:0 "以关羽为荆州最高统治者。"
 hd_lb22_keep_jingzhou_arrangement:0 "维持现有安排。"
 hd_liu_bei_late.2400.t:0 "荆州北伐"
 hd_liu_bei_late.2400.desc:0 "关羽已经从荆州向北用兵。江东、曹氏与留守诸将都在衡量这道防线还能承受多少压力。"
 hd_lb24_await_sun_decision:0 "江东的选择将决定后路。"
 hd_liu_bei_late.2410.t:0 "荆州之隙"
 hd_liu_bei_late.2410.desc:0 "关羽主力北上，荆州后方显出空隙。袭取荆州可以解除江东上游之患，却会彻底破坏孙刘关系。"
 hd_liu_bei_late.2410.alt_desc:0 "关羽北伐的因果已经推进到江东抉择，但当前领主关系、联盟或荆州归属不允许直接袭取。观望、守盟或联络曹氏仍可结束这一阶段。"
 hd_lb24_attack_jingzhou:0 "趁虚袭取荆州。"
 hd_lb24_wait:0 "继续观望北线战况。"
 hd_lb24_keep_alliance:0 "不背盟约，维持同盟。"
 hd_lb24_align_cao:0 "联络曹氏，谋求有限利益。"
 hd_liu_bei_late.2491.t:0 "荆州易手"
 hd_liu_bei_late.2491.desc:0 "实际战争使荆州易手。关羽的命运仍由战场、俘虏和人物生死事实决定。"
 hd_liu_bei_late.2492.t:0 "荆州得守"
 hd_liu_bei_late.2492.desc:0 "关羽及其集团在实际战争中守住荆州，历史道路已经发生改变。"

 hd_liu_bei_late.2500.t:0 "伐吴之议"
 hd_liu_bei_late.2500.desc:0 "关羽已死，荆州落入孙氏。复仇、联盟和集团存亡彼此冲突；若出兵，补给、山地、连营、暑热与吴军统帅都会真实影响战局。"
 hd_liu_bei_late.2500.alt_desc:0 "关羽已死，复仇之议仍在，但当前领主关系、土地、盟约或荆州归属不足以发动合法的夷陵战争。和解、索还荆州或暂缓复仇仍可选择。"
 hd_yiling_attack_wu:0 "举兵伐吴，为关羽复仇。"
 hd_yiling_keep_alliance:0 "接受长远方略，重续联盟。"
 hd_yiling_demand_jingzhou:0 "先遣使索还荆州。"
 hd_yiling_delay_revenge:0 "暂缓复仇，整军待时。"
 hd_liu_bei_late.2510.t:0 "索还荆州"
 hd_liu_bei_late.2510.desc:0 "刘备遣使索还荆州。让步可以避免大战，却会削弱江东在上游的屏障。"
 hd_yiling_return_part_jingzhou:0 "归还部分争议领土。"
 hd_yiling_reject_demand:0 "拒绝要求。"
 hd_liu_bei_late.2590.t:0 "夷陵兵败"
 hd_liu_bei_late.2590.desc:0 "刘备军在实际战局中失败。漫长补给线、山地与连营的风险终于汇成败势。"
 hd_liu_bei_late.2591.t:0 "伐吴得胜"
 hd_liu_bei_late.2591.desc:0 "刘备军在实际战局中获胜，荆州诉求按正式战争目标结算。"
