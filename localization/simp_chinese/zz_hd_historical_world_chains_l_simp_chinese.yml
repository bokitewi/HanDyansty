 HD_HISTORICAL_WAR_NAME:0 "[ATTACKER.GetPrimaryTitle.GetNameNoTierNoTooltip]与[DEFENDER.GetPrimaryTitle.GetNameNoTierNoTooltip]之战"
 hd_historical_war_victory_desc:0 "[attacker.GetShortUIName|U]夺取所争之地。"
 hd_historical_war_white_peace_desc:0 "双方罢兵，疆界如故。"
 hd_historical_war_defeat_desc:0 "攻方无功而返，疆界如故。"
 hd_chain_acknowledge:0 "天下大势，由此而变。"
 hd_historical_world.0188.t:0 "镇抚荆州"
 hd_historical_world.0188.desc:0 "朝廷命你出镇荆州的诏书送到了。你将文书读罢，头一件事便是问起旧任留下的属吏与郡县。州名写在诏书上不过两个字，交到你手中的事务却一件也不会少。\n\n旧印、军籍、府库与所属之人，都须一一交割。江汉之间宗贼并起，各据坞壁，未必听说来了新刺史，便肯俯首听命。\n\n你命人先把能够接手的地方列出来，余下的再行查访。既受朝命，便要真正担起一州之责；等坐到州府案前才说不知地方难处，就太迟了。"
 hd_historical_world.0188.a:0 "奉诏赴任，接掌荆州。"

 hd_guandu_xu_you_wuchao_modifier:0 "乌巢屯粮"
 hd_guandu_xu_you_wuchao_modifier_desc:0 "大军粮秣多屯于乌巢，守备却不甚严密；帐下谋士又彼此不和，难保无人心怀怨望。"
 hd_guandu_scout_wuchao_modifier:0 "粮道受扰"
 hd_guandu_scout_wuchao_modifier_desc:0 "敌军斥候屡在粮道左近出没，转运时有阻滞。"
 hd_chibi_risk_disease_modifier:0 "军中疫病"
 hd_chibi_risk_disease_modifier_desc:0 "北方士卒水土不服，军中疾疫渐起。"
 hd_chibi_risk_expedition_modifier:0 "远征疲惫"
 hd_chibi_risk_expedition_modifier_desc:0 "北军长途南下，已经人马俱疲。"
 hd_chibi_risk_naval_modifier:0 "不习水战"
 hd_chibi_risk_naval_modifier_desc:0 "北方将士多不习舟楫，江上交锋，难展所长。"
 hd_chibi_risk_jingzhou_loyalty_modifier:0 "荆州新附"
 hd_chibi_risk_jingzhou_loyalty_modifier_desc:0 "荆州军新近归附，人心未定，未必肯为新主效死。"
 hd_chibi_risk_tied_ships_modifier:0 "舰船相连"
 hd_chibi_risk_tied_ships_modifier_desc:0 "为免士卒晕船，舰船首尾相连，行止虽稳，进退却难。"
 hd_chibi_risk_logistics_modifier:0 "粮道绵长"
 hd_chibi_risk_logistics_modifier_desc:0 "粮秣自北方千里转运而来，难以久持。"
 hd_chibi_risk_huang_gai_modifier:0 "江东宿将"
 hd_chibi_risk_huang_gai_modifier_desc:0 "黄盖仍在江东军中。此人久历战阵，深谙水战，常有出人意表之策。"

 hd_story_cao_life:0 "曹操本纪"
