 HD_LIU_BEI_LIFE_STORY_STATUS:0 "当前篇章：#V [Story.MakeScope.Var('hd_liu_bei_life_phase').GetFlagName]#!\n从涿郡举义到西川立业，刘备的选择、盟誓与战事将汇入同一条个人历史线。"
 HD_CAO_LIFE_STORY_STATUS:0 "当前篇章：#V [Story.MakeScope.Var('hd_cao_life_phase').GetFlagName]#!\n从洛阳任职到陈留立足、讨董、奉迎天子与官渡决战，曹操的经历汇入同一条终身故事。"
 HD_YUAN_LIFE_STORY_STATUS:0 "当前篇章：#V [Story.MakeScope.Var('hd_yuan_life_phase').GetFlagName]#!\n从洛阳政争到渤海立足、号召诸侯与官渡决战，袁绍的经历汇入同一条终身故事。"
 HD_DONG_ZHUO_LIFE_STORY_STATUS:0 "当前篇章：#V [Story.MakeScope.Var('hd_dong_zhuo_life_phase').GetFlagName]#!\n从凉州起家到进京秉政、迁都长安与迎战联军，董卓的经历汇入同一条终身故事。"
 HD_GONGSUN_ZAN_LIFE_STORY_STATUS:0 "当前篇章：#V [Story.MakeScope.Var('hd_gongsun_zan_life_phase').GetFlagName]#!\n讨董之后，公孙瓒将把目光投向幽州与整个北方。"
 HD_SUN_JIAN_LIFE_STORY_STATUS:0 "当前篇章：#V [Story.MakeScope.Var('hd_sun_life_phase').GetFlagName]#!\n孙坚开创的江东基业可以传至孙策，并引导孙氏夺取扬州、经营南方。"
 HD_LIU_BIAO_LIFE_STORY_STATUS:0 "当前篇章：#V [Story.MakeScope.Var('hd_liu_biao_life_phase').GetFlagName]#!\n刘表以镇守荆州、维持境内和平与秩序为首务。"
 HD_WANG_YUN_LIFE_STORY_STATUS:0 "当前篇章：#V [Story.MakeScope.Var('hd_wang_yun_life_phase').GetFlagName]#!\n讨董大势既定后，王允将拉拢吕布，并密谋诛除董卓。"
 HD_YUAN_SHU_LIFE_STORY_STATUS:0 "当前篇章：#V [Story.MakeScope.Var('hd_yuan_shu_life_phase').GetFlagName]#!\n汝南一旦纳入治下，袁术便会以权谋压服内外，向豫州、扬州扩张。"
