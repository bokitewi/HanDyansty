 hd_story_liu_biao_life:0 "刘表本纪"
 hd_story_wang_yun_life:0 "王允本纪"
 hd_story_yuan_shu_life:0 "袁术本纪"
 HD_CAO_LIFE_STORY_STATUS:0 "当前篇章：#V [Story.MakeScope.Var('hd_cao_life_phase').GetFlagName]#!\n曹孟德少机警，有权数，任侠放荡，不治行业。天下将乱之际，此人的一举一动，都牵动着中原的局势。"
 HD_YUAN_LIFE_STORY_STATUS:0 "当前篇章：#V [Story.MakeScope.Var('hd_yuan_life_phase').GetFlagName]#!\n袁本初出身四世三公之家，折节下士，门生故吏遍于天下。海内豪杰，多有望其旗号而起者。"
 HD_DONG_ZHUO_LIFE_STORY_STATUS:0 "当前篇章：#V [Story.MakeScope.Var('hd_dong_zhuo_life_phase').GetFlagName]#!\n董仲颖起于凉州边地，粗猛有谋，麾下多是久经战阵的羌胡精骑。"
 HD_GONGSUN_ZAN_LIFE_STORY_STATUS:0 "当前篇章：#V [Story.MakeScope.Var('hd_gongsun_zan_life_phase').GetFlagName]#!\n公孙伯圭久镇幽燕边塞，以白马义从威震胡虏，素有雄踞北方之志。"
 HD_SUN_JIAN_LIFE_STORY_STATUS:0 "当前篇章：#V [Story.MakeScope.Var('hd_sun_life_phase').GetFlagName]#!\n孙氏起于吴郡富春，以勇烈闻名于世。江东的基业，便从这一家人手中肇端。"
 HD_LIU_BIAO_LIFE_STORY_STATUS:0 "当前篇章：#V [Story.MakeScope.Var('hd_liu_biao_life_phase').GetFlagName]#!\n刘景升以名士之望出镇荆州，所求不过保境安民，不愿轻易卷入中原的纷争。"
 HD_WANG_YUN_LIFE_STORY_STATUS:0 "当前篇章：#V [Story.MakeScope.Var('hd_wang_yun_life_phase').GetFlagName]#!\n王子师立朝刚直，面上虽与权臣周旋，心中未尝一日忘却汉室。"
 HD_YUAN_SHU_LIFE_STORY_STATUS:0 "当前篇章：#V [Story.MakeScope.Var('hd_yuan_shu_life_phase').GetFlagName]#!\n袁公路自恃门第高贵，素有大志。汝南是袁氏故里，也是他念兹在兹的根本之地。"
