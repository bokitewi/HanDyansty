 hd_fengying.0001.t:0 "奉迎天子"
 hd_fengying.0001.desc:0 "天子辗转离开关中，朝廷残破，诏令不出近畿。若将天子迎入治下，我可以借汉室名义重整秩序，却也必须承担百官、供奉与天下猜疑。"
 hd_fengying.0001.alt_desc:0 "天子辗转离开关中，但我眼下并非拥有独立领地的统治者，无法把朝廷迎入自己的治所。仍可派兵护送、静观局势，或明确拒绝卷入。"
 hd_fengying_cao_receive:0 "迎天子，奉汉室以令诸侯。"
 hd_fengying_cao_escort:0 "只派兵护送，不把朝廷留在治下。"
 hd_fengying_cao_refuse:0 "乱局未定，不宜接纳朝廷。"
 hd_fengying_cao_control:0 "把朝廷牢牢掌握在手中。"
 hd_fengying.0011.t:0 "天子可迎"
 hd_fengying.0011.desc:0 "天子失去强援，而河北兵强粮足。迎奉朝廷足以压倒群雄，却也会使百官和皇室成为军府中最难安置的一股力量。曹操同样在等待这个机会。"
 hd_fengying.0011.alt_desc:0 "迎奉天子的机会已经出现，但我眼下并非拥有独立领地的统治者，不能把朝廷安置在自己的治所。援助、观望与阻断他人仍是现实选择。"
 hd_fengying_yuan_receive:0 "迎天子至河北。"
 hd_fengying_yuan_hesitate:0 "此事牵累太多，暂且观望。"
 hd_fengying_yuan_aid:0 "供给车马，只作有限援助。"
 hd_fengying_yuan_obstruct:0 "截断道路，不让曹操得手。"

 hd_historical_world.0100.t:0 "官渡之前"
 hd_historical_world.0100.desc:0 "袁绍已经整合河北，兵锋正指向中原。黄河可以成为屏障，也可能成为决定天下归属的战场。许攸是否来投、乌巢粮道是否暴露，都只能改变胜算，不能替任何一方预写结局。"
 hd_historical_world.0100.alt_desc:0 "曹操与袁绍的矛盾已经无法回避，但眼下的领主关系、土地或盟约不足以形成合法的官渡战争。仍可固守黄河、寻求妥协，或先处理其他敌人。"
 hd_historical_world.0100.small_realm_desc:0 "曹操与袁绍已经走向对立，但双方当前控制的领土尚不足以支撑史书中那样庞大的河北—中原决战。若仍选择开战，战场规模与权重将由现实势力决定。"
 hd_guandu_decide_battle:0 "在官渡迎战袁绍。"
 hd_guandu_defend_yellow_river:0 "固守黄河，不作孤注一掷。"
 hd_guandu_compromise:0 "以让步换取停战。"
 hd_guandu_clear_other_enemies:0 "先清除侧后之敌。"
 hd_historical_world.0190.t:0 "官渡：河北军退"
 hd_historical_world.0190.desc:0 "实际战局已经迫使袁军退却。河北仍在，却再不能掩饰军心和部属间的裂痕。"
 hd_historical_world.0191.t:0 "官渡：袁军得胜"
 hd_historical_world.0191.desc:0 "袁军在实际战局中取得胜利。胜果能否转化为天下权柄，仍取决于中原核心和天子归属。"

 hd_historical_world.0200.t:0 "赤壁之前"
 hd_historical_world.0200.desc:0 "江东与刘备已经形成共同抵抗，南征军却受疫病、水战经验、荆州新附军和漫长粮道拖累。继续进军并非必败，但每一项未解决的风险都可能在江面上索取代价。"
 hd_historical_world.0200.alt_desc:0 "南北对峙已经形成，但眼下的领主关系、土地或盟约不足以发动合法的赤壁战争。曹军仍可整顿水军、撤兵，或止步荆州完成这一阶段。"
 hd_chibi_continue_southeast:0 "继续东南进军。"
 hd_chibi_prepare_fleet:0 "整顿水军和粮道后再战。"
 hd_chibi_withdraw:0 "及时收兵，保存北军。"
 hd_chibi_hold_jingzhou:0 "止步荆州，不渡江决战。"
 hd_historical_world.0210.t:0 "荆州去就"
 hd_historical_world.0210.desc:0 "曹军已经压向荆州。此地如今由[ROOT.Char.GetShortUIName]实际掌握；是举州归附以保全军民，还是依托江汉继续抵抗，必须由眼下的统治者作出选择。若刘琮仍实际执掌荆州，他也只能在同样的现实条件下决断。"
 hd_chibi_jingzhou_surrender:0 "举荆州归附曹操。"
 hd_chibi_jingzhou_resist:0 "据江汉而守，绝不投降。"
 hd_historical_world.0290.t:0 "赤壁：北军退却"
 hd_historical_world.0290.desc:0 "疾病、火攻与江上战局迫使北军结束远征。损失和疲惫是真实的，但北方政权并未因此凭空崩溃。"
 hd_historical_world.0291.t:0 "赤壁：江防失守"
 hd_historical_world.0291.desc:0 "曹军在实际战局中突破江防。孙刘联盟仍须面对这场失败造成的现实后果。"

 hd_liu_bei_late.2200.t:0 "留镇荆州"
 hd_liu_bei_late.2200.desc:0 "益州大局已定，荆州必须交给一位能够独当一面的最高统治者。关羽威望、资历和忠诚俱足，但任命也会改变荆益两地的权力结构。"
 hd_lb22_appoint_guan_yu_jingzhou:0 "以关羽为荆州最高统治者。"
 hd_lb22_keep_jingzhou_arrangement:0 "维持现有安排。"
 hd_liu_bei_late.2400.t:0 "荆州北伐"
 hd_liu_bei_late.2400.desc:0 "关羽已经从荆州向北用兵。江东、曹氏与留守诸将都在衡量这道防线还能承受多少压力。"
 hd_lb24_await_sun_decision:0 "江东的选择将决定后路。"
 hd_liu_bei_late.2410.t:0 "荆州之隙"
 hd_liu_bei_late.2410.desc:0 "关羽主力北上，荆州后方显出空隙。袭取荆州可以解除江东上游之患，却会彻底破坏孙刘关系。"
 hd_liu_bei_late.2410.alt_desc:0 "关羽北伐的因果已经推进到江东抉择，但当前领主关系、联盟或荆州归属不允许直接袭取。观望、守盟或联络曹氏仍可结束这一阶段。"
 hd_lb24_attack_jingzhou:0 "趁虚袭取荆州。"
 hd_lb24_wait:0 "继续观望北线战况。"
 hd_lb24_keep_alliance:0 "不背盟约，维持同盟。"
 hd_lb24_align_cao:0 "联络曹氏，谋求有限利益。"
 hd_liu_bei_late.2491.t:0 "荆州易手"
 hd_liu_bei_late.2491.desc:0 "实际战争使荆州易手。关羽的命运仍由战场、俘虏和人物生死事实决定。"
 hd_liu_bei_late.2492.t:0 "荆州得守"
 hd_liu_bei_late.2492.desc:0 "关羽及其集团在实际战争中守住荆州，历史道路已经发生改变。"

 hd_liu_bei_late.2500.t:0 "伐吴之议"
 hd_liu_bei_late.2500.desc:0 "关羽已死，荆州落入孙氏。复仇、联盟和集团存亡彼此冲突；若出兵，补给、山地、连营、暑热与吴军统帅都会真实影响战局。"
 hd_liu_bei_late.2500.alt_desc:0 "关羽已死，复仇之议仍在，但当前领主关系、土地、盟约或荆州归属不足以发动合法的夷陵战争。和解、索还荆州或暂缓复仇仍可选择。"
 hd_yiling_attack_wu:0 "举兵伐吴，为关羽复仇。"
 hd_yiling_keep_alliance:0 "接受长远方略，重续联盟。"
 hd_yiling_demand_jingzhou:0 "先遣使索还荆州。"
 hd_yiling_delay_revenge:0 "暂缓复仇，整军待时。"
 hd_liu_bei_late.2510.t:0 "索还荆州"
 hd_liu_bei_late.2510.desc:0 "刘备遣使索还荆州。让步可以避免大战，却会削弱江东在上游的屏障。"
 hd_yiling_return_part_jingzhou:0 "归还部分争议领土。"
 hd_yiling_reject_demand:0 "拒绝要求。"
 hd_liu_bei_late.2590.t:0 "夷陵兵败"
 hd_liu_bei_late.2590.desc:0 "刘备军在实际战局中失败。漫长补给线、山地与连营的风险终于汇成败势。"
 hd_liu_bei_late.2591.t:0 "伐吴得胜"
 hd_liu_bei_late.2591.desc:0 "刘备军在实际战局中获胜，荆州诉求按正式战争目标结算。"
