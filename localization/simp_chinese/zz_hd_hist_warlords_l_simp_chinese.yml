l_simp_chinese:
 hd_hw.0001.t:0 "群雄并起"
 hd_hw.0001.desc:0 "讨董之盟已散，州郡各自为政。旧部与乡里豪杰陆续来见，都劝我据守故地，自立一方。\n\n此时起兵，便与朝廷再无上下之分；若再观望，那些郡县迟早落入旁人之手。"
 hd_hw.0001.a:0 "据守故地，自立一方。"
 hd_hw.0001.b:0 "暂且观望。"
 hd_hw.0002.t:0 "请据故地"
 hd_hw.0002.desc:0 "讨董之盟已散，州郡各自为政。[hd_hw_petitioner.GetName]遣使来见，请求回到故地自领一郡，从此不再受我节制。\n\n准了他，便少一个部属，多一个邻居；不准，他只得暂且留下。"
 hd_hw.0002.a:0 "准他自去。"
 hd_hw.0002.b:0 "不准。"
