l_simp_chinese:
 hd_story_lubu_exile:0 "吕布：长安败走"
 hd_story_lubu_exile_desc:0 "长安战败，吕布失去旧日官爵与领地，转而召集旧部，踏上流转天下的征途。"
 HD_LUBU_EXILE_STORY_STATUS:0 "长安既失，吕布收拾并州旧部，四方辗转，寻觅下一处立足之地。"
 hd_lbx_event_troops:0 "吕布并州旧部"
 hd_lubu_exile.0001.t:0 "长安败走"
 hd_lubu_exile.0001.desc:0 "长安守不住了。出城时还有人问府中的物件如何处置，你回头瞪了他一眼，催马便走。李傕占得了城，难道连你的手脚也能一并留下？\n\n披甲的旧部重新聚到旗下，点名声里却缺了几个熟悉的应答。你攥着缰绳听完，胸中的怒气愈发无处发泄；若眼下还能回去接战，何至于让这些人跟着你在城外寻宿处！\n\n可将士们都在等你开口。你把兵器提正，命各队收拢。天下未必处处肯收留你，却也没有大到能让你从此无处用武。先走出这里，再看谁还敢小看你吕奉先。"
 hd_lubu_exile.0001.a:0 "收拾旧部，另觅栖身之所。"
 hd_lubu_exile.0003.t:0 "逃往关东"
 hd_lubu_exile.0003.desc:0 "关中容不下你，天下却不止一个关中。\n\n陈宫在灯下摊开舆图，手指一路向东，停在兖州。他说那里曹操远在别处，诸郡守臣各怀心思，济阳一带更没有人真能镇得住；名分可以去争，只要手里有兵。\n\n旧部已经集结，粮车也已备好。你把戟往地上一拄，对众人道：往东去，先取济阳，再取兖州！"
 hd_lubu_exile.0003.a:0 "拔营东去，先取济阳。"
 hd_lubu_exile.0003.a.tt:0 "不久之后，你便将兴兵攻取济阳。"
