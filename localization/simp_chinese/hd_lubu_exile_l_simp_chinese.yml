l_simp_chinese:
 hd_story_lubu_exile:0 "吕布：长安败走"
 hd_story_lubu_exile_desc:0 "长安战败，吕布失去旧日官爵与领地，转而召集旧部，踏上流转天下的征途。"
 HD_LUBU_EXILE_STORY_STATUS:0 "长安失守之后，建立营地、召集旧部，并等待陈宫来投。吕布的下一处立足之地，仍有待争取。"
 hd_lbx_event_troops:0 "吕布并州旧部"
 hd_lubu_exile.0001.t:0 "长安败走"
 hd_lubu_exile.0001.desc:0 "长安守不住了。离城时还有人问府中物件如何处置，我回头瞪他一眼，催马便走。李傕占得了城，难道连我的手脚也能一并留下？\n\n三千披甲旧部重新聚到旗前，点名声里仍缺了几个熟悉的应答。我攥着缰绳听完，胸中的怒气愈发无处可去；若眼下还能回去接战，何至于让这些人跟着我在城外寻宿处！\n\n可军众都在等我的话。我将兵器提正，叫各队收拢。天下未必处处肯留我，却也没有大到能让我从此无处用武。先走出这里，再看谁还敢轻看奉先。"
 hd_lubu_exile.0001.a:0 "收拢旧部，另寻立足之地。"
