l_simp_chinese:
 # ============================================================
 # 共有传统（2 个）
 # ============================================================
 tradition_zgrc_hua_xia_li_yue_name:0 "华夏礼乐"
 tradition_zgrc_hua_xia_li_yue_desc:0 "服章之美谓之华，礼仪之大故称夏。该文化奉黄帝为始祖，以礼乐定尊卑、别亲疏。"
 zgrc_hua_xia_li_yue_heritage_discount_desc:0 "该[culture|E]本属华夏一脉"
 zgrc_hua_xia_li_yue_alien_penalty_desc:0 "该[culture|E]非华夏一脉，须先习礼乐法度"

 culture_parameter_zgrc_huayi_zhibian_effect:0 "解锁[GetTrait('zgrc_hanjia_guandai').GetName( GetNullCharacter )]，郡望豪族更倾向相互通婚。"
 culture_parameter_zgrc_ruxiang_suisu_effect:0 "角色的风俗随出生地而定，客居日久，也会入乡随俗。"

 tradition_zgrc_hou_sheng_shen_si_name:0 "厚生慎死"
 tradition_zgrc_hou_sheng_shen_si_desc:0 "正德利用以厚生，敬祖追远以慎死。该文化平日隐忍克己、安土重迁，一旦家国有难，则举乡相从，奋不顾身。"

 culture_parameter_zgrc_linnan_xiangying_effect:0 "社稷危难或收复故土之际，乡里会聚众举义，以[GetMaA('zgrc_hanjia_yiyong').GetName][men_at_arms|E]来投。"
 # ============================================================
 # 区域风俗传统（20 个）
 # ============================================================
 tradition_zgrc_yandan_legacy_name:0 "燕丹遗风"
 tradition_zgrc_yandan_legacy_desc:0 "敢于急人，燕丹遗风。该文化的人民义勇轻生，邻里有难则倾力驰援，守土从不后人。"
 tradition_zgrc_kangkai_beige_name:0 "慷慨悲歌"
 tradition_zgrc_kangkai_beige_desc:0 "丈夫相聚游戏，悲歌慷慨。该文化的人民高亢尚武、轻死重义，然亦不惜身命。"
 tradition_zgrc_qidi_jinxiu_name:0 "齐地锦绣"
 tradition_zgrc_qidi_jinxiu_desc:0 "织作冰纨绮绣，号为冠带衣履天下。该文化以织作致富，衣冠服饰为天下所效，其失则在夸奢朋党。"
 tradition_zgrc_sage_education_name:0 "圣人教化"
 tradition_zgrc_sage_education_desc:0 "齐一变至于鲁，鲁一变至于道。该文化承孔门师承，好学重礼，然礼文备而实寡。"
 tradition_zgrc_han_legalist_governance_name:0 "法术治民"
 tradition_zgrc_han_legalist_governance_desc:0 "申韩之烈，刻害馀风。该文化好文法而重吏治，信赏必罚，然民以争讼生分。"
 tradition_zgrc_wenguan_tianxia_name:0 "文冠天下"
 tradition_zgrc_wenguan_tianxia_desc:0 "文翁倡其教，相如为之师。该文化俗不愁苦，以文辞显名，文章冠天下。"
 tradition_zgrc_jizi_legacy_name:0 "箕子遗教"
 tradition_zgrc_jizi_legacy_desc:0 "箕子去之朝鲜，教民以礼义。该文化民不相盗、妇守贞信，柔顺而吏民相安。"
 tradition_zgrc_luhai_haoyou_name:0 "陆海豪右"
 tradition_zgrc_luhai_haoyou_desc:0 "号称陆海，为九州膏腴。该文化五方杂厝，世家好礼文、豪桀任侠，故风俗不纯。"

 tradition_zgrc_hexi_pastoral_frontier_name:0 "河西牧政"
 tradition_zgrc_hexi_pastoral_frontier_desc:0 "水草宜畜牧，凉州之畜为天下饶。该文化以马政保边，谷贱少盗、吏民相亲。"
 tradition_zgrc_frontier_chivalry_name:0 "边地任侠"
 tradition_zgrc_frontier_chivalry_desc:0 "尚气任侠，报仇过直。该文化的人民以剑与义立足，睚眦必报，然薄恩礼、好生分。"
 tradition_zgrc_zheng_wei_music_name:0 "郑卫之音"
 tradition_zgrc_zheng_wei_music_desc:0 "桑间濮上，男女亟聚会。该文化宴乐相尚、交游成风，其失则嫁取送死过度。"
 tradition_zgrc_wu_gui_fangshu_name:0 "巫鬼方术"
 tradition_zgrc_wu_gui_fangshu_desc:0 "好祭祀，用史巫，故其俗巫鬼。该文化祠祀广布、巫觋辈出，祝诅之术亦潜行其间。"
 tradition_zgrc_merchant_hubs_name:0 "商贾通衢"
 tradition_zgrc_merchant_hubs_desc:0 "都会辐辏，财货所聚。该文化的人民喜为商贾、逐利四方，然贵财贱义、高富下贫。"
 tradition_zgrc_classics_literature_name:0 "经术文章"
 tradition_zgrc_classics_literature_desc:0 "好经术，矜功名，舒缓阔达而足智。该文化弦歌不辍、著书立说，文教流于四方。"
 tradition_zgrc_hunting_warfare_name:0 "射猎战备"
 tradition_zgrc_hunting_warfare_desc:0 "迫近戎狄，修习战备，以射猎为先。该文化弓马娴熟、名将辈出，然鄙朴少礼文。"
 tradition_zgrc_wuyue_swordsmanship_name:0 "吴越剑风"
 tradition_zgrc_wuyue_swordsmanship_desc:0 "其君好勇，其民好用剑。该文化轻死易发，剑士辈出，斗将之风冠于东南。"
 tradition_zgrc_jingchu_watermanship_name:0 "荆楚水乡"
 tradition_zgrc_jingchu_watermanship_desc:0 "江汉川泽之饶，三江五湖之利。该文化以舟为马、渔稻自给，水战尽得地利。"
 tradition_zgrc_zhongyuan_houtu_name:0 "中原厚土"
 tradition_zgrc_zhongyuan_houtu_desc:0 "河洛之地，民性重厚。该文化阵列严整、守御如山，与边地轻骑之剽疾相为表里。"
 tradition_zgrc_grain_storage_name:0 "服田力穑"
 tradition_zgrc_grain_storage_desc:0 "好稼穑，恶衣食，以致畜藏。该文化务本力农，仓廪有蓄，凶年无饥。"
 tradition_zgrc_baoyuan_shouyi_name:0 "抱元守一"
 tradition_zgrc_baoyuan_shouyi_desc:0 "抱元守一，清静寡欲。该文化慕黄老之道，服食导引、方药养生，清心而寿考。"
