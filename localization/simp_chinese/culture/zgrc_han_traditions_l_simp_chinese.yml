l_simp_chinese:
 # ============================================================
 # 共有传统（2 个）
 # ============================================================
 tradition_zgrc_hua_xia_li_yue_name:0 "华夏礼乐"
 tradition_zgrc_hua_xia_li_yue_desc:0 "服章之美谓之华，礼仪之大故称夏。该文化共祖轩辕、炎黄二帝，通过礼乐确立秩序、分辨亲疏。"
 zgrc_hua_xia_li_yue_heritage_discount_desc:0 "华夏衣冠，礼乐所系，中华传承之族，费用减半。"
 zgrc_hua_xia_li_yue_alien_penalty_desc:0 "异族慕取天命，须承华夏礼乐法度，费用大增。"

 culture_parameter_zgrc_huayi_zhibian_effect:0 "解锁[GetTrait('zgrc_hanjia_guandai').GetName( GetNullCharacter )]，郡望豪族更倾向相互通婚。"
 culture_parameter_zgrc_ruxiang_suisu_effect:0 "角色风俗由出生地的决定，客居日久也会入乡随俗。"

 tradition_zgrc_hou_sheng_shen_si_name:0 "厚生慎死"
 tradition_zgrc_hou_sheng_shen_si_desc:0 "正德利用以厚生，敬祖追远以慎死。该文化具有长期克制与极端爆发并存的文化精神。"

 culture_parameter_zgrc_linnan_xiangying_effect:0 "在非常时期，会触发天下响应。"
 # ============================================================
 # 区域风俗传统（18 个）
 # ============================================================
 tradition_zgrc_yandan_legacy_name:0 "燕丹遗风"
 tradition_zgrc_yandan_legacy_desc:0 "敢于急人，燕丹遗风也——危难之际赴身相援，义勇之气冠于诸夏。"
 tradition_zgrc_kangkai_beige_name:0 "慷慨悲歌"
 tradition_zgrc_kangkai_beige_desc:0 "赵地慷慨悲歌，高气势，好气任侠——酒酣之际，慷慨赴义。"
 tradition_zgrc_qidi_jinxiu_name:0 "齐地锦绣"
 tradition_zgrc_qidi_jinxiu_desc:0 "齐地织作冰纨绮绣，号为冠带衣履天下——丝织工艺冠绝诸夏，财富与宫廷文化俱盛。"
 tradition_zgrc_sage_education_name:0 "圣人教化"
 tradition_zgrc_sage_education_desc:0 "鲁承圣人之教化，孔门师承，礼义廉耻为天下法——好学重礼，圣学正统。"
 tradition_zgrc_han_legalist_governance_name:0 "法术治民"
 tradition_zgrc_han_legalist_governance_desc:0 "韩地申韩遗烈，高士宦、好文法——以法术治民，文法精密，讼狱分明。"
 tradition_zgrc_wenguan_tianxia_name:0 "文冠天下"
 tradition_zgrc_wenguan_tianxia_desc:0 "文翁倡教于蜀，文章冠天下——文辞著述，教化传播，声望远扬。"
 tradition_zgrc_jizi_legacy_name:0 "箕子遗教"
 tradition_zgrc_jizi_legacy_desc:0 "箕子遗教东传，汉郡吏治相济——礼义教化与边郡治理并兴，吏民相安。"
 tradition_zgrc_luhai_haoyou_name:0 "陆海豪右"
 tradition_zgrc_luhai_haoyou_desc:0 "号称陆海，为九州膏腴——关中富庶，豪桀并兼之家聚于五陵，富甲一方，侠气纵横。"

 tradition_zgrc_hexi_pastoral_frontier_name:0 "河西牧政"
 tradition_zgrc_hexi_pastoral_frontier_desc:0 "河西水草宜畜牧，凉州之畜为天下饶——牧政与边塞治理相济，军民相亲。"
 tradition_zgrc_frontier_chivalry_name:0 "边地任侠"
 tradition_zgrc_frontier_chivalry_desc:0 "燕赵晋河内之民尚气任侠——地方武人凭剑与义立足乡里，报仇不避。"
 tradition_zgrc_zheng_wei_music_name:0 "郑卫之音"
 tradition_zgrc_zheng_wei_music_desc:0 "郑卫之音，桑间濮上——歌舞宴饮，男女交游，俗乐之盛冠于诸国。"
 tradition_zgrc_wu_gui_fangshu_name:0 "巫鬼方术"
 tradition_zgrc_wu_gui_fangshu_desc:0 "陈楚巫鬼之俗，好祭祀而重淫祀——史巫方术，祭祀神秘之事盛行。"
 tradition_zgrc_merchant_hubs_name:0 "商贾通衢"
 tradition_zgrc_merchant_hubs_desc:0 "周、南阳、粤皆商贾辐辏之地——城市繁盛，财货汇聚，通衢四方。"
 tradition_zgrc_classics_literature_name:0 "经术文章"
 tradition_zgrc_classics_literature_desc:0 "经术文章，文教谱系——好经术而重文章，文教声望流于四方。"
 tradition_zgrc_hunting_warfare_name:0 "射猎战备"
 tradition_zgrc_hunting_warfare_desc:0 "北地西北修习战备，高上气力——射猎为先，弓矢精熟，边境可守。"
 tradition_zgrc_wuyue_swordsmanship_name:0 "吴越剑风"
 tradition_zgrc_wuyue_swordsmanship_desc:0 "吴越之君好勇，其民好用剑，轻死易发——剑士之风，决斗为常。"
 tradition_zgrc_jingchu_watermanship_name:0 "荆楚水乡"
 tradition_zgrc_jingchu_watermanship_desc:0 "荆楚江汉川泽之饶，吴有三江五湖之利——水乡舟楫，水上为家。"
 tradition_zgrc_zhongyuan_houtu_name:0 "中原厚土"
 tradition_zgrc_zhongyuan_houtu_desc:0 "中原人性格厚重、行事稳健、阵列严整。重甲大盾，不过此「重厚」民风在乱世中的自然形质——河洛甲士如墙而进，与边地轻骑之剽疾相为表里。"

 tradition_zgrc_grain_storage_name:0 "服田力穑"
 tradition_zgrc_grain_storage_desc:0 "好稼穑而恶衣食，以致畜藏——重农积储，抗歉收而备灾荒。"
 tradition_zgrc_baoyuan_shouyi_name:0 "抱元守一"
 tradition_zgrc_baoyuan_shouyi_desc:0 "抱元守一，清静寡欲——服食导引，延年益寿，慕黄老之道。"
