l_simp_chinese:
 # ══════════════════════════════════════════════════════════════════
 # 汉晋春秋 · 兵制决议文本
 #
 # 范围：17 个「建立军制」决议 × 5 键 + 8 个「操练勋号兵」决议 × 4 键，另有共用提示 1 键
 #
 # 体例（2026-10-09 沉浸化重写）：
 #   · desc     —— 白话带古意，写此地何以出此兵、立制之意
 #   · tooltip  —— 一句概括所为之事；花费、条件、冷却由引擎显示，不在文案中复述
 #   · confirm  —— 短促决心语
 #   · effect   —— 立制后的非数值说明（兵源所出、随主头衔传承）
 # ══════════════════════════════════════════════════════════════════

 # ─────────────── 一、建立军制决议（17） ───────────────

 # 1. 幽州突骑
 hd_establish_youzhou_tuqi_decision:0 "立幽州突骑制"
 hd_establish_youzhou_tuqi_decision_desc:0 "幽州北接乌桓、鲜卑，涿郡、渔阳、上谷一带的百姓自幼在马背上长大，识得边路，惯于冲突驰逐。当年耿弇劝光武帝发渔阳、上谷突骑，河北因此平定，天下论精骑，至今仍推幽州为首。\n\n只是边郡之兵向来聚散无常，临敌仓促征发，往往人马不齐。若在当地编定军籍、积储刍粟，再以你的名望招揽边地豪杰，幽州突骑便能常备不辍。"
 hd_establish_youzhou_tuqi_decision_tooltip:0 "在幽州编定突骑军籍，以备征募"
 hd_establish_youzhou_tuqi_decision_confirm:0 "编突骑之籍！"
 hd_establish_youzhou_tuqi_decision_effect:0 "自此可招募幽州突骑为你的[men_at_arms|E]。其兵出自幽州，须当地仍有你亲领的县份、且民心安定，方能招募扩编；此制附于你的[primary_title|E]，随之传承。"

 # 2. 白马义从
 hd_establish_baima_yicong_decision:0 "立白马义从制"
 hd_establish_baima_yicong_decision_desc:0 "右北平地处塞下，与乌桓、鲜卑隔山相望。郡中子弟自小在马背上射猎，好结伴而行，以白马为号，彼此称作义从。\n\n他们敬重的是能领着他们建功的豪杰，而非一纸征调的文书。你须亲自出面，以自己的名望结纳其中的头领，再替他们编定军籍、备足马料，白马义从方能闻召即至。"
 hd_establish_baima_yicong_decision_tooltip:0 "为右北平的白马义从编定军籍，以备征募"
 hd_establish_baima_yicong_decision_confirm:0 "定义从之籍！"
 hd_establish_baima_yicong_decision_effect:0 "自此可招募白马义从为你的[men_at_arms|E]。其兵出自右北平，须当地仍有你亲领的县份、且民心安定，方能招募扩编；此制附于你的[primary_title|E]，随之传承。"

 # 3. 乌桓骑从
 hd_establish_wuhuan_qicong_decision:0 "立乌桓骑从制"
 hd_establish_wuhuan_qicong_decision_desc:0 "乌桓本是东胡余种，自孝武皇帝时迁居上谷、渔阳至辽东的塞外，逐水草而居，男子自幼能骑善射。汉家用兵北方，常募其部众为骑从，侦候、袭扰、追亡逐北，无不得力。\n\n乌桓诸部各有大人，向来只听从他们信服的人。你若遣使厚结诸部大人，定下征发之约，再于军中为其备下粮秣，乌桓骑从便可随时出塞相从。"
 hd_establish_wuhuan_qicong_decision_tooltip:0 "与乌桓诸部定下征发之约，以备征募骑从"
 hd_establish_wuhuan_qicong_decision_confirm:0 "与乌桓定约！"
 hd_establish_wuhuan_qicong_decision_effect:0 "自此可招募乌桓骑从为你的[men_at_arms|E]。其兵出自上谷至辽东的乌桓故地，须当地仍有你亲领的县份、且民心安定，方能招募扩编；此制附于你的[primary_title|E]，随之传承。"

 # 4. 冀州强弩
 hd_establish_jizhou_qiangnu_decision:0 "立冀州强弩制"
 hd_establish_jizhou_qiangnu_decision_desc:0 "冀州地广民殷，郡国多有材官，善用大黄、蹶张之类的强弩。这等弩非膂力过人、经年习练者拉不开；一列弩手轮番齐发，便足以挡住冲阵的甲骑。当年虞诩守武都，先令小弩示弱，诱羌人逼近，再以强弩齐射，所中皆倒——弩之所长，全在号令。\n\n若在冀州编定弩手军籍，配齐弩机箭簇，再以你的名望延请当地善射的老卒教习后进，冀州强弩便能代代相承。"
 hd_establish_jizhou_qiangnu_decision_tooltip:0 "为冀州弩手编定军籍，以备征募"
 hd_establish_jizhou_qiangnu_decision_confirm:0 "定强弩之籍！"
 hd_establish_jizhou_qiangnu_decision_effect:0 "自此可招募冀州强弩为你的[men_at_arms|E]。其兵出自冀州，须当地仍有你亲领的县份、且民心安定，方能招募扩编；此制附于你的[primary_title|E]，随之传承。"

 # 5. 先登锐士
 hd_establish_xiandeng_ruishi_decision:0 "立先登锐士制"
 hd_establish_xiandeng_ruishi_decision_desc:0 "每逢攻城，总有人振臂请为先登；可等到矢石交下，真能随他攀上城头的，往往寥寥无几。冀州民风劲悍，乡里豪侠素以敢死相尚，正是选募先登之地。\n\n若能从中选出敢战之士，按籍编伍，使同伍之人彼此相识、生死相托，进退便有依恃。你以自己的名望为此制作保，往后悬赏招募时，冀州锐士自会闻风而至。"
 hd_establish_xiandeng_ruishi_decision_tooltip:0 "在冀州立先登锐士之制，以备征募"
 hd_establish_xiandeng_ruishi_decision_confirm:0 "立先登之制！"
 hd_establish_xiandeng_ruishi_decision_effect:0 "自此可招募先登锐士为你的[men_at_arms|E]。其兵出自冀州，须当地仍有你亲领的县份、且民心安定，方能招募扩编；此制附于你的[primary_title|E]，随之传承。"

 # 6. 青州兵
 hd_establish_qingzhou_bing_decision:0 "立青州兵制"
 hd_establish_qingzhou_bing_decision_desc:0 "青州负海，本是齐国故地，田狭人稠，一遇荒年便多流民。乡里少年好勇斗狠，世乱时往往结寨相保，号令虽杂，敢斗之气却不输他州。\n\n这样的人，散则为盗，聚则为兵。若能收其丁壮、编定行伍，让他们知道该听谁的号令、从何处领粮，青州之众便是一支可用的步军。只是要他们甘心应募，还须你拿出足以服众的威望。"
 hd_establish_qingzhou_bing_decision_tooltip:0 "为青州丁壮编定军籍，以备征募"
 hd_establish_qingzhou_bing_decision_confirm:0 "定青州兵籍！"
 hd_establish_qingzhou_bing_decision_effect:0 "自此可招募青州兵为你的[men_at_arms|E]。其兵出自青州，须当地仍有你亲领的县份、且民心安定，方能招募扩编；此制附于你的[primary_title|E]，随之传承。"

 # 7. 六郡良家子
 hd_establish_liujun_liangjiazi_decision:0 "立六郡良家子制"
 hd_establish_liujun_liangjiazi_decision_desc:0 "六郡地近羌胡，家家习战，子弟自幼以骑射为业。朝廷选羽林、期门宿卫，多取六郡良家子；赵充国当年便是以此身份补为羽林，后来威震西羌。\n\n良家子弟出身清白，不肯与市井无赖同列，召之须有体面。若由你亲自出面延揽，为他们编定军籍、备齐鞍马弓矢，六郡子弟自当踊跃从军。"
 hd_establish_liujun_liangjiazi_decision_tooltip:0 "为六郡良家子编定军籍，以备征募"
 hd_establish_liujun_liangjiazi_decision_confirm:0 "定良家之籍！"
 hd_establish_liujun_liangjiazi_decision_effect:0 "自此可招募六郡良家子为你的[men_at_arms|E]。其兵出自六郡，须当地仍有你亲领的县份、且民心安定，方能招募扩编；此制附于你的[primary_title|E]，随之传承。"

 # 8. 湟中义从
 hd_establish_huangzhong_yicong_decision:0 "立湟中义从制"
 hd_establish_huangzhong_yicong_decision_desc:0 "湟中地处河湟之间，月氏余种与诸羌杂居，其中归附汉家、世代随军征战的胡骑，被称作义从。他们识得河湟的每一处水草，哪里可以饮马，哪里容得下一队人马回旋，往往比舆图还要清楚。\n\n义从胡重然诺，也重脸面。你若遣人与诸部渠帅定约，许以恩赏，再以自己的名望为保，湟中义从便肯随你的旗号出征。"
 hd_establish_huangzhong_yicong_decision_tooltip:0 "与湟中义从胡定下从征之约，以备征募"
 hd_establish_huangzhong_yicong_decision_confirm:0 "与义从定约！"
 hd_establish_huangzhong_yicong_decision_effect:0 "自此可招募湟中义从为你的[men_at_arms|E]。其兵出自湟中，须当地仍有你亲领的县份、且民心安定，方能招募扩编；此制附于你的[primary_title|E]，随之传承。"

 # 9. 板楯賨兵
 hd_establish_bandun_congbing_decision:0 "立板楯賨兵制"
 hd_establish_bandun_congbing_decision_desc:0 "巴郡山中的板楯蛮，以木板为楯，世代以勇健著称。他们向汉家缴纳賨钱以代赋役，故又称賨人；朝廷每逢羌乱，多发其兵，出入险阻如履平地。\n\n板楯蛮念旧恩，也记旧怨，朝廷待之薄时，他们便起而为乱。若你肯厚加抚赏，再以名望结纳其渠帅，便可将其子弟编为賨兵，随时征发。"
 hd_establish_bandun_congbing_decision_tooltip:0 "为巴地板楯蛮编定军籍，以备征募"
 hd_establish_bandun_congbing_decision_confirm:0 "定賨兵之籍！"
 hd_establish_bandun_congbing_decision_effect:0 "自此可招募板楯賨兵为你的[men_at_arms|E]。其兵出自巴地，须当地仍有你亲领的县份、且民心安定，方能招募扩编；此制附于你的[primary_title|E]，随之传承。"

 # 10. 无当飞军
 hd_establish_wudang_feijun_decision:0 "立无当飞军制"
 hd_establish_wudang_feijun_decision_desc:0 "南中远在益州之南，山高箐深，瘴雾终年不散，中原的大队人马到此，往往连阵都列不开。当地夷人却惯走羊肠小道，能负弩攀崖，来去如飞。\n\n若能在南中选募其中的劲卒，编定部伍，给以粮械，你便有一支能在山间往来驰突的兵马，不必每逢险阻便望山兴叹。只是南中诸部向来只服强者，你须有足够的威名，方能令其归心。"
 hd_establish_wudang_feijun_decision_tooltip:0 "在南中立无当飞军之制，以备征募"
 hd_establish_wudang_feijun_decision_confirm:0 "立飞军之制！"
 hd_establish_wudang_feijun_decision_effect:0 "自此可招募无当飞军为你的[men_at_arms|E]。其兵出自南中，须当地仍有你亲领的县份、且民心安定，方能招募扩编；此制附于你的[primary_title|E]，随之传承。"

 # 11. 五溪蛮兵
 hd_establish_wuxi_manbing_decision:0 "立五溪蛮兵制"
 hd_establish_wuxi_manbing_decision_desc:0 "武陵郡中，五条溪水穿行于群山之间，山路随溪水曲折，隔着一座山便听不见对面的鼓声。当年伏波将军马援南征五溪，大军困于溪谷，他本人也病殁军中。\n\n与其在溪谷间与诸蛮为敌，不如收其部众为己所用。若你遣使与诸部定约，以威名镇之、以恩赏抚之，再将其子弟编入军籍，五溪蛮兵便能为你引路开道。"
 hd_establish_wuxi_manbing_decision_tooltip:0 "与五溪诸部定下征发之约，以备征募蛮兵"
 hd_establish_wuxi_manbing_decision_confirm:0 "与五溪定约！"
 hd_establish_wuxi_manbing_decision_effect:0 "自此可招募五溪蛮兵为你的[men_at_arms|E]。其兵出自武陵五溪，须当地仍有你亲领的县份、且民心安定，方能招募扩编；此制附于你的[primary_title|E]，随之传承。"

 # 12. 山越甲士
 hd_establish_shanyue_jiashi_decision:0 "立山越甲士制"
 hd_establish_shanyue_jiashi_decision_desc:0 "江东的丹阳、会稽、豫章诸郡，山岭连绵数百里，山中宗部聚族而居，不服徭役，不纳租赋。官军来讨，他们便退入深山，据险而守；官军一去，又复出山。\n\n山越之中，强壮敢斗者甚多。若能招降其众、编入军籍，使其披甲执兵，便是一支惯于林岭搏战的劲旅。只是降众之心难以一时收服，须你恩威并用，以名望慑服其宗帅。"
 hd_establish_shanyue_jiashi_decision_tooltip:0 "为山越降众编定军籍，以备征募"
 hd_establish_shanyue_jiashi_decision_confirm:0 "定山越之籍！"
 hd_establish_shanyue_jiashi_decision_effect:0 "自此可招募山越甲士为你的[men_at_arms|E]。其兵出自江东山越诸郡，须当地仍有你亲领的县份、且民心安定，方能招募扩编；此制附于你的[primary_title|E]，随之传承。"

 # 13. 丹阳精兵
 hd_establish_danyang_jingbing_decision:0 "立丹阳精兵制"
 hd_establish_danyang_jingbing_decision_desc:0 "丹阳郡地处吴越之间，山多田少，百姓上山采铜、入林射猎，个个筋骨强健。乡里少年轻生重义，平日一言不合便拔刀相向，到了阵上却最肯拼命。\n\n只是丹阳兵名气虽大，名气本身却守不住一座营垒。若在当地立下募兵之制，编定军籍，给以常饷，再以你的名望延揽乡里豪杰为之统领，往后需要步卒时，便不必临时四处求人。"
 hd_establish_danyang_jingbing_decision_tooltip:0 "在丹阳立下募兵之制，以备征发"
 hd_establish_danyang_jingbing_decision_confirm:0 "立丹阳募制！"
 hd_establish_danyang_jingbing_decision_effect:0 "自此可招募丹阳精兵为你的[men_at_arms|E]。其兵出自丹阳，须当地仍有你亲领的县份、且民心安定，方能招募扩编；此制附于你的[primary_title|E]，随之传承。"

 # 14. 涪陵连弩士
 hd_establish_fuling_liannushi_decision:0 "立涪陵连弩士制"
 hd_establish_fuling_liannushi_decision_desc:0 "涪陵地处巴郡东南，江水在群山间穿行，两岸多是悬崖小径。山民世代在林间张弩射猎，弩机在他们手里，就像锄头在农夫手里一样熟。\n\n只是弩机精巧，须有熟手照料；箭簇消耗极快，须有工匠不断打造。若以你的名望召集涪陵善射的山民，编定军籍，再备齐弩机与箭簇的来路，这支连弩士方能随时听用。"
 hd_establish_fuling_liannushi_decision_tooltip:0 "在涪陵立连弩士之制，以备征募"
 hd_establish_fuling_liannushi_decision_confirm:0 "立连弩之制！"
 hd_establish_fuling_liannushi_decision_effect:0 "自此可招募涪陵连弩士为你的[men_at_arms|E]。其兵出自涪陵，须当地仍有你亲领的县份、且民心安定，方能招募扩编；此制附于你的[primary_title|E]，随之传承。"

 # 15. 羌骑
 hd_establish_qiang_qi_decision:0 "立羌骑制"
 hd_establish_qiang_qi_decision_desc:0 "金城、陇西的山谷之间，诸羌种落各据一方，逐水草放牧，男子人人善骑。他们来时尘土飞扬，退时散入远处的山谷，步卒在后面追赶，往往连他们去了哪里都不知道。\n\n若能与诸羌种落定下从征之约，许以恩赏，编其骑士入籍，你便有一支能与敌人比快慢的骑兵。羌人敬重勇武，也看重信义，此事须你以名望作保。"
 hd_establish_qiang_qi_decision_tooltip:0 "与陇右诸羌定下从征之约，以备征募羌骑"
 hd_establish_qiang_qi_decision_confirm:0 "与诸羌定约！"
 hd_establish_qiang_qi_decision_effect:0 "自此可招募羌骑为你的[men_at_arms|E]。其兵出自金城、陇西的羌中，须当地仍有你亲领的县份、且民心安定，方能招募扩编；此制附于你的[primary_title|E]，随之传承。"

 # 16. 并州边骑
 hd_establish_bingzhou_bianqi_decision:0 "立并州边骑制"
 hd_establish_bingzhou_bianqi_decision_desc:0 "雁门、云中、朔方诸郡都在并州极北，烽燧相望，胡骑时常犯塞。边郡子弟从小听惯了烽火的警报，骑马如同走路，知道何时该催马疾驰，何时该按辔蓄力。\n\n边骑若能编入常制，大军行进时便不必事事等步队赶到才有消息。征募、粮秣与军籍都须有人长久打理，不能只靠一时的重赏聚兵。以你的名望延揽边郡豪杰，再拨出钱粮立下规制，并州边骑方能常为你所用。"
 hd_establish_bingzhou_bianqi_decision_tooltip:0 "为并州边郡骑士编定军籍，以备征募"
 hd_establish_bingzhou_bianqi_decision_confirm:0 "编边骑之籍！"
 hd_establish_bingzhou_bianqi_decision_effect:0 "自此可招募并州边骑为你的[men_at_arms|E]。其兵出自并州边郡，须当地仍有你亲领的县份、且民心安定，方能招募扩编；此制附于你的[primary_title|E]，随之传承。"

 # 17. 藤甲兵
 hd_establish_tengjia_decision:0 "立藤甲兵制"
 hd_establish_tengjia_decision_desc:0 "永昌远在南中西陲，本是哀牢夷的故地。山中多老藤，夷人取来编成甲胄，穿着在密林间进退，比披挂铁甲的中原兵卒灵便得多。\n\n只是一领奇甲并不能让人刀枪不入，要紧的是披甲之后，部伍还能随着号令进退。若在永昌选募当地夷人，编定军籍，备齐藤甲，再以你的名望结纳诸部首领，藤甲兵方能为你所用。"
 hd_establish_tengjia_decision_tooltip:0 "在永昌立藤甲兵之制，以备征募"
 hd_establish_tengjia_decision_confirm:0 "立藤甲之制！"
 hd_establish_tengjia_decision_effect:0 "自此可招募藤甲兵为你的[men_at_arms|E]。其兵出自永昌，须当地仍有你亲领的县份、且民心安定，方能招募扩编；此制附于你的[primary_title|E]，随之传承。"

 # 操练勋号兵决议共用：决议效果提示（投入与花费在随后的选练事件中择定）
 hd_train_elite_decision_effect:0 "你将召来选练之将，与之商定投入多寡；所需钱粮与威望，届时再付。"

 # ─────────────── 二、操练勋号兵决议（8） ───────────────

 # 1. 陷阵营
 hd_train_xianzhenying_decision:0 "练陷阵营"
 hd_train_xianzhenying_decision_desc:0 "军中从不缺振臂请战的人，缺的是冲进敌阵之后，还听得见身后号令的人。重甲、坚盾、利刃都能用钱置办，可要让一营之众在刀锋前进退如一，非得有一位精于治军的将领日夜操练不可。\n\n这样的精兵只能逐个挑选、亲手练成，不是张榜招募便能凑足的；一旦遣散，便只能从头再练。你若有意组建一支破阵的利刃，便该先为它备下钱粮。"
 hd_train_xianzhenying_decision_tooltip:0 "择麾下能将，选练一支陷阵营"
 hd_train_xianzhenying_decision_confirm:0 "选练陷阵之士！"

 # 2. 虎豹骑
 hd_train_hubaoqi_decision:0 "练虎豹骑"
 hd_train_hubaoqi_decision_desc:0 "追击败兵是一回事，迎着敌阵策马冲进去又是另一回事。你想从骑兵中拔擢最骁勇的人另编一军，人马皆披重甲，专待决战之时一鼓破阵。\n\n人马甲械不能只求数目，统领他们的须是一员勇而知兵、临阵从不畏缩的骁将。这样的精骑只能择人而练，不能张榜扩充；一旦散去，便须重新练过。"
 hd_train_hubaoqi_decision_tooltip:0 "择麾下骁将，选练一支虎豹骑"
 hd_train_hubaoqi_decision_confirm:0 "选练虎豹之骑！"

 # 3. 白毦
 hd_train_baier_decision:0 "练白毦"
 hd_train_baier_decision_desc:0 "人人都愿意站在旗下领赏，可等敌军逼近，还肯站在原地不退的，才是真正可用的人。你需要一支披甲的亲卫：能稳住阵脚，也能在险路上护住同伴。\n\n此事须交给一位勇敢坚毅、善于守御的将领，从军中挑人操练。亲兵贵精不贵多，只能逐一挑选，不能张榜招募；一旦遣散，便须从头练起。"
 hd_train_baier_decision_tooltip:0 "择麾下忠勇之将，选练白毦亲兵"
 hd_train_baier_decision_confirm:0 "选练白毦亲兵！"

 # 4. 解烦兵
 hd_train_jiefanbing_decision:0 "练解烦兵"
 hd_train_jiefanbing_decision_desc:0 "急报送到才临时聚兵，往往队伍还没集齐，前线的情势早已变了。你想练一支解烦兵，专为危急之时驰援四方，在林泽之间也能转战自如。\n\n统领此军的须是一位随机应变、善于调度的将领，钱粮也须另行筹备。这样的兵只能专门操练，不能随常募扩充；散去之后，也须待来日再练。"
 hd_train_jiefanbing_decision_tooltip:0 "择麾下能将，选练一支解烦兵"
 hd_train_jiefanbing_decision_confirm:0 "选练解烦之兵！"

 # 5. 麴义先登
 hd_train_quyi_xiandeng_decision:0 "练麴义先登"
 hd_train_quyi_xiandeng_decision_desc:0 "敌骑一到，弩手先乱，再强的弩也只能射进泥里。你想仿照麴义先登之法，选练一支敢于迎着骑兵列阵、等到号令才发矢的部伍：前排伏于盾下，后排强弩相承。\n\n此事须交给一位敢战、又熟悉平原阵战的将领主持，选募与军械之费也须另备。这样的部伍不是悬一面军号就能常募的；一旦遣散，便只能从头再练。"
 hd_train_quyi_xiandeng_decision_tooltip:0 "择麾下能将，依麴义之法选练先登"
 hd_train_quyi_xiandeng_decision_confirm:0 "选练先登之士！"

 # 6. 宿卫虎士
 hd_train_suwei_hushi_decision:0 "练宿卫虎士"
 hd_train_suwei_hushi_decision_desc:0 "门前的卫士举止整肃，可你不想等到真有刺客闯进来，才知道他们能守多久。宿卫之士须勇健绝伦，更须忠心可托，不能只凭相貌魁梧挑人。\n\n此事只能交给一位勇力过人、对你忠心耿耿的猛士，由他亲自挑选、操练。这样的卫士不能张榜招募；一旦遣散，便须另行挑选、从头练起。"
 hd_train_suwei_hushi_decision_tooltip:0 "择麾下忠勇之士，选练宿卫虎士"
 hd_train_suwei_hushi_decision_confirm:0 "选练宿卫虎士！"

 # 7. 南蛮象兵
 hd_train_nanman_xiangbing_decision:0 "练南蛮象兵"
 hd_train_nanman_xiangbing_decision_desc:0 "战象的身影足以让敌阵为之骚动；可真正要担心的，是它受惊之后会冲向哪一边。若没有熟练的驭手和懂行的将领，巨象再雄壮，也未必冲向敌人。\n\n南中徼外诸部驯象为兵，只要你的疆域延及南中，便可从那里求得象群与驭手。统领此军的须是熟悉山地、善于调度的将领。这样的奇兵无法随常例招募扩充，一旦遣散，也只能从头再练。"
 hd_train_nanman_xiangbing_decision_tooltip:0 "择麾下能将，驯象选卒，练成南蛮象兵"
 hd_train_nanman_xiangbing_decision_confirm:0 "驯象练兵！"

 # 8. 白衣兵
 hd_train_baiyibing_decision:0 "练白衣兵"
 hd_train_baiyibing_decision_desc:0 "敌人望见旗号，才知道大军已到；若有人能抢先摸到近处，探明道路与退路，两军交锋时便不至于处处受制。你想练一支白衣兵，专在林岭之间追蹑、截击、掩护。\n\n统领此军的须是一位机变多谋、惯于奔袭的将领。所求的不是声势浩大的队伍，而是来得及时、退得干净的一部人马。这样的兵只能专门挑选操练，不能随常募扩编；一旦散去，也须从头再练。"
 hd_train_baiyibing_decision_tooltip:0 "择麾下能将，选练一支白衣兵"
 hd_train_baiyibing_decision_confirm:0 "选练白衣之兵！"
