l_simp_chinese:
 hd_miasma_county_modifier:0 "瘴气"
 hd_miasma_county_modifier_desc:0 "林莽深邃，湿热蒸郁，瘴疠横行。兵入其境，疾疫随之；民处其土，垦辟维艰。\n\n#X @warning_icon!一旦该[county|E]的[development|E]提升到#V 30#!或更高，其直辖领主便可通过[GetDecisionWithKey('hd_clear_miasma_decision').GetName][decision|E]根除此患！#!\n\n"
 hd_clear_miasma_decision:0 "清除瘴气"
 hd_clear_miasma_decision_desc:0 "江岭以南，卑湿暑热，瘴云不散。居人病疠，行者戒途。\n\n如今境内生齿日繁、阡陌渐辟，正可遣医工、疏水泽、焚腐草、迁病民，还此方水土一个清明。"
 hd_clear_miasma_decision_tooltip:0 "从治下已有相当[development|E]的直辖[counties|E]中驱除[GetModifier('hd_miasma_county_modifier').GetNameWithTooltip]"
 hd_clear_miasma_decision_confirm:0 "焚草疏泽！"
 hd_miasma_county_eligible_removal_tt:0 "至少一个直辖[county|E]拥有[GetModifier('hd_miasma_county_modifier').GetName][county_modifier|E]，且[development|E]不低于#V 30#!"
 hd_miasma_removal_tt:0 "所有[development|E]不低于#V 30#!的直辖[counties|E]将不再受[GetModifier('hd_miasma_county_modifier').GetNameWithTooltip]侵扰"
 hd_miasma_no_counties_meet_criteria_tt:0 "@alert_icon!#alert_trial 当前没有任何直辖伯爵领符合此标准！#!"
 hd_miasma_cleared.t:0 "瘴疠渐消"
 hd_miasma_cleared.desc:0 "[ROOT.Char.GetFullName]疏浚水泽、广遣医工，治下瘴疠之地重归清明。"
