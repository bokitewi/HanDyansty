 building_hd_pass_p_3121_01:0 "白水关"
 building_hd_pass_p_3121_01_desc:0 "广汉郡白水县，白水自西北流来，在此汇入西汉水。关城扼守自武都、汉中南下入蜀的北道，是益州北面的重要关隘。"
 building_hd_pass_p_3121_02:0 "白水关"
