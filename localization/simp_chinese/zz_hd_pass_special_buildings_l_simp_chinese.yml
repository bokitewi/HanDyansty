 building_hd_pass_p_3634_01:0 "子午关"
 building_hd_pass_p_3634_01_desc:0 "长安以南的秦岭之中，有一条贯通南北的谷道，王莽时开通，名为子午道，可直下汉中。关城设在北口，谷中栈道绵延不绝，险峻难行。"
 building_hd_pass_p_3634_02:0 "子午关"
 building_hd_pass_p_3634_02_desc:0 "$building_hd_pass_p_3634_01_desc$"
