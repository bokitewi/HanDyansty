 building_hd_pass_p_1135_01:0 "壶关"
 building_hd_pass_p_1135_01_desc:0 "上党郡壶关县，山形如壶，口窄腹宽，故名壶口。关城据太行之险，东下便是河北平原，是上党东出的门户；孝武皇帝时，壶关三老曾上书为戾太子鸣冤。"
 building_hd_pass_p_1135_02:0 "壶关"
