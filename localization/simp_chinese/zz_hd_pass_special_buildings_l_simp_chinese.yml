 building_hd_pass_p_4403_01:0 "江油关"
 building_hd_pass_p_4403_01_desc:0 "阴平山道的尽头，涪水之畔有一处小小的戍城，四周群山环抱。自北而来的险僻小径到此方才走出深山，南下便可直抵涪县与成都平野。"
 building_hd_pass_p_4403_02:0 "江油关"
