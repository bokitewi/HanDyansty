 # New major pass chains
 building_hd_pass_p_2203_01:0 "穆陵关"
 building_hd_pass_p_2203_01_desc:0 "大岘山上的穆陵关是齐地南面的门户，管仲答楚使时所说的“南至于穆陵”，便是此地。山路狭窄，车马难以并行，越过此关，北面便是一马平川的齐国腹地。"
 building_hd_pass_p_2203_02:0 "穆陵关"
 building_hd_pass_p_2203_02_desc:0 "$building_hd_pass_p_2203_01_desc$"
