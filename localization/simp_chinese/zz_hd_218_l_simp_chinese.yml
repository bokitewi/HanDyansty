 # 218 年剧本：人物修正
 hd_sg218_victory_momentum_modifier: "乘胜之势"
 hd_sg218_victory_momentum_modifier_desc: "大胜之后，将士奋勇，敌军闻风丧胆。"
 hd_sg218_army_shaken_modifier: "军心动摇"
 hd_sg218_army_shaken_modifier_desc: "大将阵亡、全军覆没的消息传遍营中，士卒人心惶惶。"
 hd_sg218_awe_huaxia_modifier: "威震华夏"
 hd_sg218_awe_huaxia_modifier_desc: "水淹七军之后，许都以南群盗遥受印号，为之支党，威名震动中原。"
 hd_sg218_lianying_modifier: "火烧连营"
 hd_sg218_lianying_modifier_desc: "七百里连营付之一炬，精锐丧尽，军资器械略尽。"
 hd_sg218_jieting_modifier: "街亭之失"
 hd_sg218_jieting_modifier_desc: "街亭失守，陇右诸郡复叛，大军进无所据。"
 hd_sg218_tuogu_modifier: "受遗诏辅政"
 hd_sg218_tuogu_modifier_desc: "先帝临终托孤，政事无巨细，咸决于此人。"
 hd_sg218_established_rule_modifier: "久据一方"
 hd_sg218_established_rule_modifier_desc: "割据经营多年，上下早已归心，新君初立的疑虑无从谈起。"
 hd_sg218_hanzhong_supply_modifier: "益州之资"
 hd_sg218_hanzhong_supply_modifier_desc: "巴蜀地饶民富，仓廪充实；转运不绝，凡大军出入山道，粮秣无忧。"
 hd_sg218_levy_modifier: "男子当战，女子当运"
 hd_sg218_levy_modifier_desc: "汉中之争，益州倾境而出：丁壮尽赴行伍，妇人转运粮秣。"
 # 218 年剧本：历史大事件
 hd_sg218.0010.t: "男子当战，女子当运"
 hd_sg218.0010.desc: "军吏将新编的兵籍铺在案上，帐外赶制军械的锤声尚未停歇。汉中山道险远，前线既缺援兵，也缺粮秣；诸县呈来的名册上，出征的男子与运粮的女子已分列成行。\n\n我抚过兵籍，想到仍在北面苦战的将士。男子当战，女子当运，益州上下须合力支撑这一战。新集的步卒、长枪兵与床弩已候命，只待我下令开拔。"
 hd_sg218.0010.a: "举益州之力，支援汉中！"
 hd_sg218.0010.troops_tt: "获得一支由#V 6000#!轻步兵、#V 300#!床弩、#V 2000#!长枪兵和#V 1500#!板楯賨兵组成的事件兵。这支部队消耗补给、不可继承，并在汉中之战结束后解散。"
 hd218_hanzhong_mobilized_army: "汉中援军"
 hd_sg218.0020.t: "耿纪之变"
 hd_sg218.0020.desc: "平乱的军报送到时，我先问王必在哪里。来人伏在地上，许久才答：营门起火，王必中箭，虽与严匡合兵平了叛乱，终究没能熬过箭伤。\n\n我把军报重新展开。耿纪、韦晃、吉本、金祎，几个人的名字挤在一处。他们带着家僮夜袭军营，打的却是奉迎天子、讨伐魏王的旗号。许都离前线这样远，刀竟从这里伸了出来。\n\n阶下的人还在等我的话。杀了这些主谋，可以让城中那些观望的人收起心思；留下他们，也许能问出这场夜袭背后还有谁。只是王必再也不能来回话了。"
 hd_sg218.0020.a: "尽诛其党，以儆效尤"
 hd_sg218.0020.b: "暂且下狱，从长计议"
 hd_sg218.0030.t: "曹彰北征"
 hd_sg218.0030.desc: "曹彰听完代郡的急报，没有退下。他向前一步，请我准他领兵北征。能臣氐已经反叛，边地若迟迟等不到援兵，恐怕还会有人跟着起事。\n\n我看着这个一心想做将军的儿子。他说起骑射与冲阵总是眉飞色舞，如今真要把一支军队交给他，考验的却不只是勇力。追敌多远，粮草够不够，军令能不能令行禁止，都不是杀得痛快便算了结。\n\n“居家为父子，受事为君臣。”我提醒他，“到了军中，便按王法行事。”曹彰收起笑意，俯身听命。我还可以先遣使招抚；若决定出兵，他就得担起这份差遣。"
 hd_sg218.0030.a: "命曹彰北征"
 hd_sg218.0030.b: "遣使招抚"
 hd_sg218.0040.t: "侯音据宛"
 hd_sg218.0040.desc: "南阳来的使者连衣上的泥都没来得及擦，便报出宛城反叛的消息。侯音与卫开聚众据城，太守也落在他们手里。我追问缘由，得到的回答是徭役繁重，吏民怨声已久。\n\n我让人取来地图。宛城扼住南阳要道，向南又通着荆州。如今有人传侯音正与关羽联络，是真是假尚待查明，却不能等关羽的兵出现在城下才作打算。只是再催一支军队过去，粮秣与夫役又要从哪里征发？\n\n曹仁可以奉命回师平叛，也可以先派人入城劝降。我看着地图上的宛城，催使者把城中情形再说清楚些。"
 hd_sg218.0040.a: "命曹仁回师讨之"
 hd_sg218.0040.b: "暂且招抚"
 hd_sg218.0050.t: "定军山"
 hd_sg218.0050.desc: "报捷的军士刚说出夏侯渊的名字，周围便静了下来。黄忠从高处率军压下，鼓声响彻山谷，魏军主将已在定军山阵亡。待他把消息再说一遍，近旁将士才忍不住欢呼起来。\n\n相持了这样久，总算等到这一日！我让军士起身，先取水给他，又细问黄忠所部的伤亡与曹军动向。斩将是大功，可敌军还有营垒，汉中的道路也不会因这一场胜仗便尽数敞开。\n\n欢呼声传到营外，我也终于松了口气。该记下黄忠这一功，更该趁敌军失去主将之际稳住胜势。越到这个时候，越不能让将士以为仗已经打完。"
 hd_sg218.0050.a: "老将黄忠，功冠三军！"
 hd_sg218.0060.t: "汉中归属"
 hd_sg218.0060.desc: "汉中的军报终于不再只是索粮与告急。曹军已退，城邑归入我的治下；上庸、房陵、魏兴也相继归附，东面的道路随之打通。有人高声贺道：“汉中尽归[ROOT.Char.GetShortUIName]！”我笑着受了贺，随即让他们把各郡的户籍与粮册一并送来。\n\n新得的地方，需要安抚百姓、修整守备，远道运来的粮食也还得一批批送到。将士们盼着歇息，我何尝不想？可汉中既是进取的门户，也是必须守住的屏障，不能只留下一场庆功宴。\n\n眼下最要紧的，是选一个能够独当一面的人。谁来替我守住这里？"
 hd_sg218.0060.a: "汉中既定，当择良将镇守。"
 hd_sg218.0065.t: "镇守汉中"
 hd_sg218.0065.desc: "汉中该由谁镇守，群臣已经议论了几日。有人推举宿将，也有人担心新得之地难以安定。我听完众人的话，把目光转向魏延。叫到他的名字时，席间有几个人抬起了头。\n\n“如今把这份重任交给你，你打算怎样守？”我问。\n\n魏延没有迟疑：“敌人若倾国而来，我为主公挡住；若只遣一支偏师，就请主公等我的捷报。”话说得很满，周围却一时无人接腔。我看着他，既要这份敢于任事的胆气，也要他知道这里容不得轻敌。\n\n任命就在眼前。把汉中交出去，交的可不只是一方印绶，还有这场苦战才换来的门户。"
 hd_sg218.0065.a: "汉中便托付给你了。"
 hd_sg218.0070.t: "襄樊之战"
 hd_sg218.0070.desc: "汉中得胜的消息传到荆州，将士们说起北伐，声音也比往日响亮了。我让人铺开地图，沿汉水往北看去：襄阳与樊城隔水相望，魏军据守其间。若能拔去这两处据点，荆州的兵锋便可再向中原推进。\n\n可军队一走，留下的江陵、公安又由谁守？我逐一问过守备与粮运，听完回报，仍没有收起地图。这一仗值得打，却不能把后方当成一块谁也不会来碰的地方。\n\n部将等着我下令。汉中那边已经取胜，我也不愿只守着荆州坐看时局；只是此刻发兵，便得同时顾住北面的敌军和身后的城池。"
 hd_sg218.0070.a: "北攻襄樊"
 hd_sg218.0070.b: "固守江陵，以待时变"
 hd_sg218.0080.t: "水淹七军"
 hd_sg218.0080.desc: "连日大雨终于停了，汉水却还淹着原来的道路。我乘船巡视，水上漂着断木与丢弃的军械，远处高地挤满无处可退的魏军。于禁已经投降，七军就这样被洪水困住，成批落入我手。\n\n庞德被押来时仍不肯屈膝。我问他愿不愿降，他昂着头，不肯应允。部将催我早作处置；后面还有许多俘虏，收押、看守、给粮，件件都要人手。\n\n这一场胜利来得惊人，我却还没有拿下樊城。眼前这个不肯低头的人，是杀了以绝后患，还是先押下去，等他改变心意？我示意押解的军士站稳，别急着动手。"
 hd_sg218.0080.a: "斩庞德"
 hd_sg218.0080.b: "囚之以待其降"
 hd_sg218.0090.t: "白衣渡江"
 hd_sg218.0090.desc: "吕蒙把江边的守备情形说完，提出了一个不像行军的办法：精兵藏在船中，让摇橹的人换上商贾衣装，借往来船只的掩护接近江岸。关羽正在北攻襄樊，若能出其不意夺下沿江哨所，荆州便未必来得及应对。\n\n我没有立即点头。糜芳、士仁与关羽不睦，确实可以设法招降，可他们会不会开城，谁也不能保证。更何况，夺城之后还要守城，与蜀中决裂的后果，也得由我承担。\n\n吕蒙停下来，等我裁决。我又问了一遍船只与兵员的安排。荆州近在眼前，但要拿下它，就不能只想着这一夜如何渡江。"
 hd_sg218.0090.a: "袭取荆州"
 hd_sg218.0090.b: "坐观成败"
 hd_sg218.0100.t: "败走麦城"
 hd_sg218.0100.desc: "关羽落入我手的消息传来，我把送信的人留下，重新问了一遍。他如何被擒，部下如今散在何处，我都要问清。往日令人忌惮的名将，如今也要等我的一句话决定生死。\n\n左右有人主张立即处死，免得日后再生变故；也有人劝我先关起来，留待局势明朗。我没有急着回答。此事传出去，蜀中会如何反应，眼下还不知道。杀了关羽，这一步便再也收不回来；留下他，同样需要严加看守，不能指望他轻易为我所用。\n\n我让众人停下争论。军报可以重读，眼前这道命令，却不能发出去再改。"
 hd_sg218.0100.a: "斩之以绝后患"
 hd_sg218.0100.b: "囚而不杀"
 hd_sg218.0110.t: "魏王嗣位"
 hd_sg218.0110.desc: "父王的遗令被一字一句读出：天下尚未安定，葬事从简，葬毕除服。听到这里，我低头看了一眼身上的丧服。连留给哀痛的日子，他也替我们算进了军国大事之中。\n\n随后是嗣位的文告，写着[ROOT.Char.GetName]承继魏王之位。群臣向我行礼，接着便有人请示军务，有人呈上尚未处置的奏报。我想再问一句父王临终时说过什么，话到嘴边，却先接过了那些文书。\n\n从前难以决断的事，总还可以等父王裁处。如今众人抬起头，等的是我的回答。我把最上面的一卷展开，让报事的人继续说下去。"
 hd_sg218.0110.a: "继先王之志"
 hd_sg218.0130.t: "刘备称帝"
 hd_sg218.0130.desc: "劝进的奏疏又送来了。群臣说，汉家天子的帝位已落入异姓之手，我应当承继汉统，不能再只以王号自居。还有人传言天子已经遇害，我追问消息从何而来，却始终得不到确实的回答。\n\n我把奏疏放在面前，没有立刻答应。多年来举兵征战，口口声声都是兴复汉室；如今若受这帝号，天下人会如何看我？可一味推辞，也不能让已经易手的朝廷回到从前。站在阶下的人等着一个足以号召众人的名分。\n\n成都的即位之礼可以筹备，国号也将归于“汉”。只是这道诏命，终究要由我亲口发出。"
 hd_sg218.0130.a: "即皇帝位于成都"
 hd_sg218.0130.b: "暂且推辞"
 hd_sg218.0150.t: "张飞遇害"
 hd_sg218.0150.desc: "来人一开口便伏地不起，声音被哽咽截断。我让他抬头，才听清阆中送来的噩耗：张飞死了。那位一声断喝便能惊退敌军的将军，竟没有倒在阵前，而是死在自己的卧处。\n\n报信者说，帐下张达等人趁他醉卧下手，随后顺流向孙权处逃去。来人又说，张飞平日严厉，责罚军士时常动鞭杖。我听着这些话，却不知道此刻再追问缘由，还能挽回什么。堂中诸人都不说话，原本等着发出的军令还摆在那里。我要怎样向将士宣告，他们熟悉的将军再也回不来了？"
 hd_sg218.0150.a: "噫！飞死矣。"
 hd_sg218.0160.t: "夷陵之战"
 hd_sg218.0160.desc: "东征的议论尚未说完，劝谏声便接连响起。有人将手指压在荆州舆图上，提醒我孙权夺走的城池；也有人转向北方，问我汉室的大敌究竟是谁。两边说的，我都听得分明。\n\n可云长被杀的消息并没有因为我登上帝位便淡去。每次看见旧日军中留下的器物，我仍会想起那个与我并肩走过险境的人。臣下说此时当防曹氏，先与孙权交兵，恐使旁人得利。我知道这不是胆怯；可一想到云长，我便很难把这些劝谏听到底。群臣等着我的答复：是下令东征，还是把这口气暂且忍下？"
 hd_sg218.0160.a: "东征孙权"
 hd_sg218.0160.b: "听群臣之谏"
 hd_sg218.0170.t: "火烧连营"
 hd_sg218.0170.desc: "烟先于败兵涌来，山间的风把火星卷得满天都是。我听见有人喊陆逊的兵到了，却辨不清声音来自哪一营。方才还能传递号令的道路，此时挤着弃械奔走的军士，连呼喊军号也压不住他们的脚步。\n\n近卫催我离开，接连送来的消息却让我难以挪步：营寨被火切断，舟船军资也在混乱中丢失，许多人尚未归队。出发时还列队听令的将士，如今只剩烟中断续的旗影。陆逊竟用这场火将我的大军打散！我还想收拢队伍，可前来报信的人已经找不到原来的将领。"
 hd_sg218.0170.a: "吾乃为逊所折辱，岂非天邪！"
 hd_sg218.0180.t: "白帝托孤"
 hd_sg218.0180.desc: "丧服的衣袖垂在膝上，诸葛亮来到我面前时，眼中仍带着倦意。先帝留下的嘱托被一字字读出：请丞相辅佐嗣君，扶持社稷。读到托付后事的地方，堂中只剩纸页轻动的声音。\n\n我接过遗命，才发觉如今每一道诏令都要由我发出。边地的守军、成都的官吏、尚未恢复元气的百姓，都不能随着这场大丧停下来。丞相俯身说，他愿竭尽股肱之力，至死不负所托。我听着这句话，心中稍稍安定下来。我向他望去：先帝交下的基业，眼下须由我们共同支撑。"
 hd_sg218.0180.a: "政事无巨细，咸决于丞相"
 hd_sg218.0190.t: "南中叛乱"
 hd_sg218.0190.desc: "守丧的静寂被南方急报打破。来使一路换马，话未说完便咳起来；随行军吏摊开地图，将几处不再听从朝廷号令的地方逐一指出。南中的乱事，终究没有停在传闻里。\n\n雍闿、高定、朱褒等人的名字接连传来，地方豪强与夷帅各拥其众，有人又提到孟获。哪些城邑还能送粮，哪些道路已经断绝，报信者也说不齐全。先帝新丧，朝中还在守制，边地却已趁这时局生变。立刻兴兵，国中未必承受得住；任其蔓延，留在南方的官吏与百姓又该向谁求援？眼下只能先遣人安抚，弄清各地情形，再作打算。"
 hd_sg218.0190.a: "国有大丧，宜先抚之"
 hd_sg218.0200.t: "丞相南征"
 hd_sg218.0200.desc: "诸葛亮将南中道路指给我看，手指沿着河谷缓缓移过，没有急着谈斩获。他说叛乱拖延已久，若只凭兵刃压下去，大军一走，旧患仍可能再起；这一次，还得设法安抚当地部众，让他们愿意归附。\n\n我记得前次急报送到时，国中尚在大丧，连出兵都难以议定。如今朝政渐稳，南方却仍有人不奉号令。丞相愿率众南征，谈到险道与转运时，把困难一项项说给我听。征战需要粮秣，也需要时间；继续等待，同样有代价。他收回手，立在舆图旁，等我准许这支军队动身。"
 hd_sg218.0200.a: "准丞相南征"
 hd_sg218.0200.b: "闭关息民，来年再议"
 hd_sg218.0205.t: "七擒孟获"
 hd_sg218.0205.desc: "南方送来的消息终于不再只是求援。报信的人说，诸葛亮让被擒的孟获看过军营，又放他回去再战；如此反复，直到孟获不肯再走，承认自己心服。听到这里，堂中几人才松了口气。\n\n七擒七纵的经过被讲得有声有色，我却更想知道，道路能否重新通行，地方的人是否愿意与朝廷相安。若胜利只留下一片惧怕，军队仍要长驻在那里。来使又转述孟获的话，说南人不复反了。我愿意听见这样的承诺，但它能否长久，还要看此后怎样待人、怎样治理。眼下，这场南征总算有了可以告知国中的结果。"
 hd_sg218.0205.a: "南中平定"
 hd_sg218.0210.t: "出师表"
 hd_sg218.0210.desc: "诸葛亮呈上的奏表，比寻常军报长得多。他从先帝创业未半说起，谈到留在朝中的臣下，又逐一陈明可以托付政务的人。我听着这些名字，才明白这封表不只是请战，也是离开之前的托付。\n\n南方已经安定，军中也备好了兵甲。他请率三军北出，将天水、南安、安定作为进兵之地，愿尽力兴复汉室。可隔着群山，粮道有多长，战事会拖多久，谁也不能在此刻说定。丞相立在阶下，等我的答复。我若准许，成都的政务与北面的征战便要同时撑起；若再缓一年，这次北伐又得重新筹划。"
 hd_sg218.0210.a: "准表出师"
 hd_sg218.0210.b: "国力未复，来年再议"
 hd_sg218.0211.t: "姜维归降"
 hd_sg218.0211.desc: "姜维被引到我面前时，衣上还留着赶路的尘土。他说原在天水任职，出城之后却遭郡守猜疑，回去无门，留在外面又无处立足。讲到这里，他停了一下，随即俯身，表明愿在我这里效力。\n\n我听过丞相对他的称许：思虑精密，办事勤谨，是凉州难得的人才。可一个刚从对方阵中走来的人，要怎样让这里的将士相信他，仍须凭日后的行事。姜维说完来意，便垂手等我发话。战事尚在进行，我需要熟悉陇右的人，也需要肯承担责任的人。这位年轻人既然已到眼前，我便要给他一个立足之处。"
 hd_sg218.0211.a: "得一良才"
 hd_sg218.0212.t: "失街亭"
 hd_sg218.0212.desc: "报信者说街亭失了，我一时以为自己听错，又让他重复了一遍。他低下头，讲马谡如何不依节度，离水上山；张郃断了汲水的道路，军士无水可饮，队伍终于溃散。军报只有短短几行，街亭一失，北伐大军却连立足之地都难保。\n\n马谡素以谈兵见长，如今这份本事却没能守住街亭。再漂亮的道理，也换不回守在那里的人，更补不上陇右军中的缺口。诸葛亮没有为他遮掩，将前后军情一并呈到我面前。我要处置的不是一次失言，而是违令所酿成的败局。军法不能当作空话，可要处死一个旧臣，我也无法轻易开口。"
 hd_sg218.0212.a: "挥泪斩马谡"
 hd_sg218.0212.b: "饶他性命"
 # 218 年剧本：全局通报
 hd_sg218.0510.t: "汉中之战"
 hd_sg218.0510.desc: "山间的栈道上，运粮的人侧身给迎面来的军士让路，车轮却陷在泥里，半晌挪不开一步。汉中开战了：[hd_news_a.GetName]进兵北上，与[hd_news_b.GetName]争夺益州通往秦川的关隘。那些往日由商旅反复走过的山口，如今处处有人点验、盘问。\n\n子弟从军、驮马被征，沿途的人谈着各自摊上的差事，话头很快又转到粮食还能卖什么价。我原先还在想着两军的强弱，此刻却也记住了这些抱怨；一支军队要走进去，许多人的日子便得跟着挪动。战争才刚开始，沿路已经留下了它的痕迹。"
 hd_sg218.0520.t: "许都之乱"
 hd_sg218.0520.desc: "许都的火已经扑灭，城中人却仍在谈论那一夜。[hd_news_b.GetName]等人举兵，欲借天子之名攻打[hd_news_a.GetName]；守军还击，叛乱败下，王必也在这场乱事中丧命。烧过的门扉与街巷，一时还来不及修补。\n\n那一夜的经历经人转述，各有不同：有人记得喊杀，有人只记得把家人藏到屋后，直到天亮才敢开门。说到这里，我身旁原本追问战况的人也渐渐安静下来。曾在同一条街上往来的官吏与邻人，如今连寒暄都多了迟疑。乱兵已经散去，举火的人如何发落尚未传定，许都却先失去了惯常的安静。"
 hd_sg218.0530.t: "乌桓复叛"
 hd_sg218.0530.desc: "代郡的乌桓又起兵了。[hd_news_b.GetName]纠集部众，向魏方发难，[hd_news_a.GetName]面前多了一场必须应对的边地变乱。归附之时曾经送到的誓言，如今被北方的马蹄声盖了过去。\n\n一位行商在我面前摊开行囊，里面的货物还未卖出。他抱怨原先能走的道路忽然多了关卡，驮着货物也得先问清前头是谁的人。军中则有人提起曹彰的勇武，盼他领兵北上；边地使者带来的，却还有牧草、马匹与部众去向的消息。刀兵尚未传遍各处，人与人之间的往来已经收紧，许多原本寻常的旅程都停在了半途。"
 hd_sg218.0535.t: "北方大定"
 hd_sg218.0535.desc: "北征的骑兵回来了，随军的消息也沿道路传开：[hd_news_a.GetName]击破乌桓，追奔逐北。鲜卑[hd_news_b.GetName]先前在旁观望，见乌桓败退，遂遣使请服，边地的使者开始往来，商议归附后的事宜。\n\n归来军士的经历被人反复转述，最先说的是追得多快，后来便说到喉咙里的尘土与胯下疲乏的马。我追问起伤者，人们才从捷讯说到归途。有人还想多谈斩获，也有人惦记着迟迟未归的同伴。使者们带来顺服的言辞，归来的兵卒带回自己的经历；同一场胜利，有人记住斩获，有人始终忘不了失散的同伴。"
 hd_sg218.0540.t: "宛城之变"
 hd_sg218.0540.desc: "宛城的门关了，城内的吏民随[hd_news_a.GetName]举兵反抗。南阳累于徭役，供军与转运积下的怨言终于化作刀兵，荆北的军队与道路都被这场变乱牵动。\n\n谈到宛城，先被提起的常是小事：一次迟归的征发、一辆还不回来的牛车，或一季来不及下种的田。我问起那些家的处境，回答却渐渐混进了战事。说到城中起兵，又有人立即压低声音，怕旁边听见。原先能够在门前争执的苦处，如今已经有了叛乱的名目；城墙隔开的不只是军队，也有仍在两边等候家人的百姓。"
 hd_sg218.0550.t: "定军山"
 hd_sg218.0550.desc: "黄忠在定军山斩杀夏侯渊的消息传开，汉中的军营里很快有人开始传唱这场进击。[hd_news_b.GetName]一方失去主将，守军受到重创，山间原先相持的兵势骤然有了变化。\n\n有人把黄忠的年岁说了一遍，随后提高声音，说老将临阵仍能如此。我身旁的年轻人原先满脸不信，此刻也忍不住跟着叫好。另一处谈话却在点数夏侯渊的部众与旧属，那些曾随他出征的人，从此再听不到他的号令。捷讯与死讯落在同一张军报上，传开时却走向不同的人。汉中的争夺仍在继续，黄忠与夏侯渊的名字已被两边军士牢牢记住。"
 hd_sg218.0560.t: "汉中易手"
 hd_sg218.0560.desc: "汉中已落入[hd_news_a.GetName]手中。两军围绕山口、营垒与城邑的争夺终于有了结果，关隘换了守兵，粮仓与道路也开始交接，巴蜀北面的门户由此改变了主人。\n\n商旅赶着打听新的通行规矩，从军者的家人则问，兵卒是否能回来过一阵安稳日子。这些问题随着捷讯一道到了我面前，比庆贺的话更难答得痛快。有人已经说到北出秦川，有人却只想知道自家粮食还要运到哪里。赢得汉中，对掌兵者是山川形势的改变，对沿途住民却先是眼前来往的人不同了。尘土中的旧旗撤下，新旗还在山风里舒展。"
 hd_sg218.0570.t: "关羽北伐"
 hd_sg218.0570.desc: "荆州的兵马向北开去。[hd_news_a.GetName]留兵备守南郡，亲率军队进攻襄樊，与[hd_news_b.GetName]一方的守军隔汉水相持。往日渡水载货的船，如今也被军中征集，两岸到处都在谈论这次北进。\n\n一位船工向我比画汉水上的行船，几句话没离开暗流与浅滩。别人谈起关羽的声名，他仍惦记船只怎样靠岸；军士说起城墙，留在后方的人则问南郡还剩多少守兵。同一条汉水，在他们口中各有不同的要紧之处。北上的号令已经发出，渡口的人仍在争论哪一处水浅，城下的军士却再等不得了。"
 hd_sg218.0580.t: "威震华夏"
 hd_sg218.0580.desc: "汉水暴涨，洪流吞没于禁所部，援军大败，于禁与庞德被俘。[hd_news_a.GetName]声势大振，[hd_news_b.GetName]一方承受的压力骤增，连迁徙许都以避锋芒的议论也传了出来。\n\n“七军”二字在街谈中反复响起。人们用手比画水有多高，一人说到肩头，另一人却举过了头顶。我听着这番议论，旁边忽然有人问起俘虏的姓名，想找一个同乡。众人这才停下比画，逐个念起那些名字。洪水裹走了兵甲与车马，留下的将士有的成为俘虏，有的仍不知下落；远处的人称道关羽威震华夏，失散者的家人却只盼听见亲人的消息。"
 hd_sg218.0590.t: "白衣渡江"
 hd_sg218.0590.desc: "江上出现了白衣船队。[hd_news_a.GetName]趁[hd_news_b.GetName]率军北攻襄樊，命吕蒙向荆州进取，军士藏起兵器，以行商装束沿江而上，企图逼近沿途守备。\n\n讲述传到我这里，反复提起的都是船上的白衣与藏起的兵器。它们与平常商船没有多少分别，正是这番装束使人久久谈论。码头上的货担、船舱里的低语，忽然都能引来猜疑；有人笑说这计策巧，也有人再看过往舟船时便收起了笑容。北方军士还在城下交战，身后的江路已经响起另一方的号令。荆州的战事，就这样从两面逼近了同一片土地。"
 hd_sg218.0600.t: "关羽之死"
 hd_sg218.0600.desc: "[hd_news_b.GetName]被[hd_news_a.GetName]处死。消息传来时，还有人在说起他往日临阵的勇武，话到一半，却不知该如何接下去。这个曾使敌军忌惮的名字，如今只剩一道无法挽回的死讯。\n\n我听着众人的议论，有人为他惋惜，也有人认为少了一个劲敌。谈到他的旧部与故交，声音渐渐低下来：曾经追随他的将士要另寻归处，与他结下的恩怨却未必就此了结。传话的人临走前，又被叫住，追问还有谁知道他的下落。问话者随即自己停了口，仿佛直到此时，才真正明白已经没有什么人可以等回来。"
 hd_sg218.0610.t: "魏王薨"
 hd_sg218.0610.desc: "魏王曹操薨逝，丧讯沿驿路传到各处。[hd_news_a.GetName]承继魏王之位，旧日奉曹操名义发出的号令，开始交到新的掌权者手中。官署行礼吊丧，军中也传下了继位的消息。\n\n吊唁者回忆早年的征战，仍习惯把魏方与曹操放在一句话里；说完才发觉，往后该改口了。我随众人行过礼，起身时，门外又有人带着待办的文书到来。服丧的人换下鲜明衣饰，往来办事者却仍带着急迫的军务。一个人的死使许多旧事忽然有了终点，眼前的道路、粮运与政事又不能一并停下。新魏王的名字，正在众人的称呼中慢慢取代旧主。"
 hd_sg218.0620.t: "汉魏禅代"
 hd_sg218.0620.desc: "[hd_news_a.GetName]筑坛受禅，登临帝位，[hd_news_b.GetName]退位。诏书与改元的文告送往各处，汉家四百年的国祚至此断绝，魏的名号写上了新的公文。\n\n我看见有人写到落款时顿了一下，把惯用的年号划去，重新补上。街上谈论此事的人，有的忙着问新朝规矩，有的仍把旧日称呼挂在嘴边；酒席间一旦说到天命，话语便比平日更难接续。受禅的仪节已经完成，各人的旧识与旧情却不会随文书一同改写。往后每一封表章、每一道诏令，都要让人重新面对这个变化。"
 hd_sg218.0630.t: "汉帝即位"
 hd_sg218.0630.desc: "成都又立起了汉家的帝号。[hd_news_a.GetName]在武担之南即皇帝位，以承续汉祚为名，不承认[hd_news_b.GetName]所据的帝位。北方与蜀中的文告各有纪年，同一个天下，如今听见了不同的帝王号令。\n\n来使向我郑重述说成都的典礼，旁边有人因此松了口气，也有人只默默记住新添的称谓。使者相见时，比往日更留意对方如何开口；书吏抄写文书，也得先问明它要送向何处。帝号不只出现在坛场与礼仪中，还会随着每一封来信走到众人眼前。有人借它寄托旧望，也有人因它添了新忧，彼此却未必说得出口。"
 hd_sg218.0650.t: "张飞遇害"
 hd_sg218.0650.desc: "[hd_news_b.GetName]遭帐下将张达杀害，张达随后投奔孙权。消息传到军中，原本整顿行装的人停了手，反复问那是否确实是张达所为。\n\n旧卒谈起他的勇武，也有人说到军中的严厉责罚，话语一阵高、一阵低。我再问起部众的情形，原先抢着说话的人反而迟疑起来。谋杀发生在自己人之间，令人难以像阵前交兵那样说清敌我；昨日还在同营奉令的人，今日便可能被反复问起。张达去了江东，留在原地的部众却还要重新听候调遣。那个临阵足以使敌军胆寒的将领，竟没能防住帐下之人的刀。"
 hd_sg218.0660.t: "夷陵之战"
 hd_sg218.0660.desc: "[hd_news_a.GetName]亲率大军东征[hd_news_b.GetName]，荆州的争夺与关羽之死又被带入军中号令。船队沿江推进，陆路的兵卒也开始跋涉，原先留在言语间的旧怨，如今变成了一场已经开打的战争。\n\n随军传来的家信里，有人记下送行时叮嘱早归的话，也有人说，此去定要讨回失去的地方。我读到后来，最常见的却仍是惦记家人的几句嘱托。这些家信写得匆忙，有的尚未说完，便已到了该动身的时候。山川不知谁有冤仇，运粮与渡水却都要有人去做。关羽之死牵动了两方掌权者，如今更多尚且活着的人，也随着这道号令离开了家。"
 hd_sg218.0670.t: "火烧连营"
 hd_sg218.0670.desc: "[hd_news_b.GetName]纵火进击，夷陵的连营遭破，[hd_news_a.GetName]大败退走。山林间的营垒烧成焦黑，原先相连的军队四散，东征时的声势骤然转为败局。\n\n归来者的讲述被递到我面前，写到那场火，最先记起的却是找不到同伴的呼喊。有人失了兵器，有人只带回一件原不属于自己的行装；问起留下的人，回答常常止在一个摇头。胜败可以用几句话传遍各处，失散的军士却要在漫长道路上一个个寻找归处。先前出发时有人许下的归期，如今也随着这一场大火变得难以兑现。"
 hd_sg218.0680.t: "白帝托孤"
 hd_sg218.0680.desc: "蜀中传出大丧与继位的消息。[hd_news_a.GetName]承继君位，[hd_news_b.GetName]受遗诏辅政，旧主留下的托付，已成为新君与辅臣接掌政事的依据。朝廷举哀，往来的文书却仍要继续递送。\n\n丧仪中的悼辞传到我这里，称颂死者功业的言语仍很庄重；礼毕之后，人们说起旧主，又不免夹着对眼前局面的忧虑。服丧者扶着衣带起身，新送来的军务又使办事者不能久留。死者留下的名位、旧臣与未了战事，一并到了新君面前。那位受托辅政的丞相，此后每下一道命令，都免不了被人拿来与旧主的托付相较。"
 hd_sg218.0690.t: "南中叛乱"
 hd_sg218.0690.desc: "蜀中大丧未过，南中诸郡又起变乱。当地大姓与部众首领举兵，[hd_news_a.GetName]新近承接的政事之中，骤然添了道路断绝、地方官府难以维持秩序的急报。\n\n从南边来的人提起亲族，一连说出几个我不熟悉的聚落。他急着解释谁仍守在家里，谁又被卷入兵众，话里全是分隔两地的牵挂。亲族分处两地，往来本为婚姻、买卖与求助，如今却都要解释自己为何走那条路。许多地名先前只随物产一起被提及，此刻换成了兵众与城邑的归属。朝廷仍在服丧，地方上的刀兵却没有随之停下，南部的消息一日比一日沉重。"
 hd_sg218.0700.t: "丞相南征"
 hd_sg218.0700.desc: "南征的号令已经发下。[hd_news_b.GetName]率军进入南中，征讨先前起兵的各方，蜀中开始为这次远行转运粮食、调集兵卒。久未通报消息的郡县，也重新进入军中谋划。\n\n军中有人问起南方的天气，熟悉当地的人说到河流与山路，年轻兵卒听得格外认真。这番问答辗转传到我这里，仍能觉出出征前的紧张。有人盼着战事早些平息，好让亲友重新来往；有人先担心携带的粮食够不够走完前路。出征已经成为事实。待军队走入那里，迎上来的会有敌兵，也有仍在寻找安稳日子的人。"
 hd_sg218.0705.t: "七擒孟获"
 hd_sg218.0705.desc: "孟获归服的消息传来，也带来了七擒七纵的故事。[hd_news_b.GetName]几度被擒，又得释放，最终表示心服，敬畏丞相的言语随着南征的经历一同传开。\n\n讲述者把擒获说得紧张，把释俘说得从容，说到第七次时，我身旁的人终于忍不住追问：为什么不在第一次便杀掉？也有人不谈胜负，只说，若真能使原先相抗的人重新来往，山路上的家眷便不必总为下一队兵马收拾行装。故事传得很快，每个人从中记住的部分却不同。讲到孟获终于归服，众人才暂且放下谁胜谁负的争论，问起南中的道路何时能够重新通行。"
 hd_sg218.0710.t: "出师北伐"
 hd_sg218.0710.desc: "[hd_news_a.GetName]准许出师，诸葛亮率军北上祁山，与[hd_news_b.GetName]一方争夺陇右。蜀中筹备的粮食装上车辆，军队沿道路进发，北伐不再只是朝廷中的谋议。\n\n军中传来的话里，还有送行者的追问：山外的道路究竟有多远？我读着记下的几句答话，笔迹到这里变得潦草，像是队伍已经催着人赶路。军中传诵出师的言辞，也有人只反复摸一摸家人塞进囊中的东西。对于掌兵者，那是通向陇右的进军；对于随行兵卒，却先是一段要靠双脚走完的路。祁山的名字传到了各处，许多从未见过那座山的人，也因这次出师记住了它。"
 hd_sg218.0712.t: "失街亭"
 hd_sg218.0712.desc: "街亭失守了。[hd_news_b.GetName]违背节度，舍水上山列营，遭敌军攻破，北伐部队失去原先倚赖的要处，进军与接应都受到影响。原本向前传递的军令，开始带上应对败局的急迫。\n\n说到山上缺水，我身旁一名从过军的人下意识端起碗，喝了一口便不再接话。原先争着谈兵的人看着他，声音也低了下去。败退者的行装被一件件辨认，伤兵也陆续送回；关于主将的议论很响，寻找同伴的人却只关心名字与去向。此前谈祁山时满是远行的期望，如今街亭的失守，已成了谁也绕不过去的一场败仗。问责的命令尚未传定，损失却已经摆在眼前。"
 # 218 年剧本：书签人物
 bm_218_cao_cao_name: "曹操"
 bm_218_cao_cao_name_subheading: "魏王"
 bm_218_cao_cao_name_desc: "曹操以丞相之尊进爵魏王，奉天子于许都，北方九州尽归其治。然而年事已高，汉中告急，许都城中仍有人心怀汉室。他能否在有生之年为曹氏打下不可动摇的根基？"
 bm_218_liu_bei_name: "刘备"
 bm_218_liu_bei_name_subheading: "汉中王"
 bm_218_liu_bei_name_desc: "半生颠沛的刘备终于在益州站稳脚跟，正与曹军争夺汉中。他以尊汉为旗号，荆州有关羽坐镇，蜀中有诸葛亮治理，兴复汉室的大业似乎第一次触手可及。"
 bm_218_sun_quan_name: "孙权"
 bm_218_sun_quan_name_subheading: "坐断东南"
 bm_218_sun_quan_name_desc: "孙权继父兄之业，据有江东已近二十年。与刘备的同盟日渐貌合神离，荆州上游的关羽让他寝食难安。是守盟约，还是趁虚而入？"
 bm_218_guan_yu_name: "关羽"
 bm_218_guan_yu_name_subheading: "荆州都督"
 bm_218_guan_yu_name_desc: "关羽持节都督荆州，糜芳、孟达、士仁皆在麾下。北有曹仁屯樊，东有孙权窥伺。他的威名足以震动华夏，可身后的荆州并不像看上去那样稳固。"
 bm_218_zhu_ge_liang_name: "诸葛亮"
 bm_218_zhu_ge_liang_name_subheading: "军师将军"
 bm_218_zhu_ge_liang_name_desc: "刘备北上争夺汉中，诸葛亮坐镇成都，署左将军府事，足食足兵以供前线。他是刘备最倚重的人，眼下却无尺寸封土。是尽心辅佐主公兴复汉室，还是终有一日独撑大局？"
 bm_218_si_ma_yi_name: "司马懿"
 bm_218_si_ma_yi_name_subheading: "太子中庶子"
 bm_218_si_ma_yi_name_desc: "出身河内温县的司马懿被曹操强征入仕，如今侍奉太子曹丕左右。曹操对他心存戒备，他却始终深藏不露。曹氏的基业，将来究竟会落到谁的手中？"
 hd_sg218_hanzhong_truce: "汉中边衅"
