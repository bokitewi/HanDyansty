 # 218 年剧本：开局王号称帝决议
 hd218_wang_proclaim_emperor_decision: "即皇帝位"
 hd218_wang_proclaim_emperor_decision_desc: "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]已据一方，群臣屡屡劝进。可以登坛受命，即皇帝位。"
 hd218_wang_proclaim_emperor_decision_tooltip: "由王改称皇帝。"
 hd218_wang_proclaim_emperor_decision_confirm: "登坛即位"
