 # 218 年剧本：历史战争
 hd_sg218_war_cb: "汉末争衡"
 hd_sg218_war_cb_desc: "三方争衡的史实战争，只能由剧情发起。"
 HD_SG218_WAR_NAME: "[ATTACKER.GetPrimaryTitle.GetNameNoTierNoTooltip]与[DEFENDER.GetPrimaryTitle.GetNameNoTierNoTooltip]之战"
 hd_sg218_war_victory_desc: "[attacker.GetShortUIName|U]夺取所争诸郡。"
 hd_sg218_war_white_peace_desc: "双方罢兵，疆界如故。"
 hd_sg218_war_defeat_desc: "攻方无功而返，疆界如故。"
 # 218 年剧本：人物修正
 hd_sg218_victory_momentum_modifier: "乘胜之势"
 hd_sg218_victory_momentum_modifier_desc: "大胜之后，将士奋勇，敌军闻风丧胆。"
 hd_sg218_army_shaken_modifier: "军心动摇"
 hd_sg218_army_shaken_modifier_desc: "大将阵亡、全军覆没的消息传遍营中，士卒人心惶惶。"
 hd_sg218_awe_huaxia_modifier: "威震华夏"
 hd_sg218_awe_huaxia_modifier_desc: "水淹七军之后，许都以南群盗遥受印号，为之支党，威名震动中原。"
 hd_sg218_lianying_modifier: "火烧连营"
 hd_sg218_lianying_modifier_desc: "七百里连营付之一炬，精锐丧尽，军资器械略尽。"
 hd_sg218_jieting_modifier: "街亭之失"
 hd_sg218_jieting_modifier_desc: "街亭失守，陇右诸郡复叛，大军进无所据。"
 hd_sg218_tuogu_modifier: "受遗诏辅政"
 hd_sg218_tuogu_modifier_desc: "先帝临终托孤，政事无巨细，咸决于此人。"
 hd_sg218_established_rule_modifier: "久据一方"
 hd_sg218_established_rule_modifier_desc: "割据经营多年，上下早已归心，新君初立的疑虑无从谈起。"
 # 218 年剧本：历史大事件
 hd_sg218.0020.t: "耿纪之变"
 hd_sg218.0020.desc: "建安二十三年正月，少府耿纪、司直韦晃、太医令吉本与金祎等谋挟天子以攻魏王，夜率家僮千余人烧长史王必营门。王必中箭，奔投典农中郎将严匡，合兵讨平乱党，然箭伤深重，数日而死。\n\n乱党尽数就擒，听候发落。"
 hd_sg218.0020.a: "尽诛其党，以儆效尤"
 hd_sg218.0020.b: "暂且下狱，从长计议"
 hd_sg218.0030.t: "曹彰北征"
 hd_sg218.0030.desc: "代郡乌桓能臣氐等反叛，北边震动。鄢陵侯曹彰请以北中郎将、行骁骑将军之职领兵出塞。\n\n临行前当告诫他：居家为父子，受事为君臣，动以王法从事。"
 hd_sg218.0030.a: "命曹彰北征"
 hd_sg218.0030.b: "遣使招抚"
 hd_sg218.0040.t: "侯音据宛"
 hd_sg218.0040.desc: "南阳吏民苦于繇役，宛城守将侯音与卫开等聚众据城而反，执太守，与关羽遥相呼应。宛城扼南阳之要，若不速平，荆北恐生大变。"
 hd_sg218.0040.a: "命曹仁回师讨之"
 hd_sg218.0040.b: "暂且招抚"
 hd_sg218.0050.t: "定军山"
 hd_sg218.0050.desc: "汉中之战相持经年。黄忠乘高鼓噪，金鼓振天，欢声动谷，一战斩夏侯渊于定军山。\n\n曹军失其主将，汉中门户洞开。"
 hd_sg218.0050.a: "老将黄忠，功冠三军！"
 hd_sg218.0060.t: "汉中归属"
 hd_sg218.0060.desc: "曹军退出汉中，汉中尽入[ROOT.Char.GetShortUIName]之手。\n\n东面房陵、上庸、西城诸郡仍为魏守。宜都太守孟达请率兵北上，与副军中郎将刘封会师，一举夺取东三郡。"
 hd_sg218.0060.a: "命孟达、刘封进取房陵、上庸"
 hd_sg218.0060.b: "休兵养民"
 hd_sg218.0070.t: "襄樊之战"
 hd_sg218.0070.desc: "汉中既定，荆州之兵久未出动。曹仁屯樊城，襄阳与樊城隔汉水相望，是北进中原的门户。\n\n是时候留兵备公安、南郡，亲率大军北攻襄樊了。"
 hd_sg218.0070.a: "北攻襄樊"
 hd_sg218.0070.b: "固守江陵，以待时变"
 hd_sg218.0080.t: "水淹七军"
 hd_sg218.0080.desc: "秋季大霖雨，汉水暴溢，平地水数丈。于禁所督七军皆没，于禁登高望水，无所回避，遂乞降。立义将军庞德被擒，立而不跪。\n\n一时之间，威震华夏。许都以南群盗或遥受印号，魏王甚至议徙许都以避其锐。"
 hd_sg218.0080.a: "斩庞德"
 hd_sg218.0080.b: "囚之以待其降"
 hd_sg218.0090.t: "白衣渡江"
 hd_sg218.0090.desc: "关羽倾荆州之兵北攻襄樊，后方空虚。吕蒙献策：伏精兵于舟船之中，使白衣摇橹，作商贾人服，昼夜兼行，尽收江边屯候。\n\n南郡糜芳、公安士仁素与关羽不睦，或可不战而下。"
 hd_sg218.0090.a: "袭取荆州"
 hd_sg218.0090.b: "坐观成败"
 hd_sg218.0100.t: "败走麦城"
 hd_sg218.0100.desc: "荆州既失，关羽退保麦城，士卒离散，西走至临沮，为潘璋部将马忠所擒。\n\n关羽当世名将，如何处置，事关重大。"
 hd_sg218.0100.a: "斩之以绝后患"
 hd_sg218.0100.b: "囚而不杀"
 hd_sg218.0110.t: "魏王嗣位"
 hd_sg218.0110.desc: "魏王曹操薨于洛阳，遗令天下尚未安定，未得遵古，葬毕皆除服。太子[ROOT.Char.GetName]嗣位为魏王、丞相，领冀州牧。"
 hd_sg218.0110.a: "继先王之志"
 hd_sg218.0130.t: "刘备称帝"
 hd_sg218.0130.desc: "传闻汉帝已被逼禅位于魏。群臣上言：曹丕篡弑，湮灭汉室，窃据神器；大王宜即帝位，以纂二祖，绍嗣昭穆。\n\n若即位，王号将改称「汉」。"
 hd_sg218.0130.a: "即皇帝位于成都"
 hd_sg218.0130.b: "暂且推辞"
 hd_sg218.0150.t: "张飞遇害"
 hd_sg218.0150.desc: "车骑将军张飞爱敬君子而不恤小人，常鞭挞健儿，又令在左右。帐下将张达、范强趁其醉卧，刺杀张飞，持其首顺流而奔孙权。"
 hd_sg218.0150.a: "噫！飞死矣。"
 hd_sg218.0160.t: "夷陵之战"
 hd_sg218.0160.desc: "关羽死于孙权之手，荆州尽失。群臣多谏，以为国贼是曹氏，非孙权也，不应置魏先与吴战。\n\n然而云长之仇，不可不报。"
 hd_sg218.0160.a: "东征孙权"
 hd_sg218.0160.b: "听群臣之谏"
 hd_sg218.0170.t: "火烧连营"
 hd_sg218.0170.desc: "蜀军自巫峡建平至夷陵界，立数十屯，连营七百余里。陆逊令各持一把茅，以火攻拔之，一时俱成，斩张南、冯习，破其四十余营。\n\n大军溃散，舟船器械，水步军资，一时略尽。"
 hd_sg218.0170.a: "吾乃为逊所折辱，岂非天邪！"
 hd_sg218.0180.t: "白帝托孤"
 hd_sg218.0180.desc: "先帝病笃，召丞相诸葛亮于永安，属以后事：君才十倍曹丕，必能安国，终定大事。若嗣子可辅，辅之；如其不才，君可自取。\n\n诸葛亮涕泣曰：臣敢竭股肱之力，效忠贞之节，继之以死！"
 hd_sg218.0180.a: "政事无巨细，咸决于丞相"
 hd_sg218.0190.t: "南中叛乱"
 hd_sg218.0190.desc: "先帝新丧，益州郡大姓雍闿杀太守，附于孙权；越嶲夷王高定、牂柯太守朱褒皆叛应之，孟获亦从雍闿。南中诸郡一时尽失。"
 hd_sg218.0190.a: "国有大丧，宜先抚之"
 hd_sg218.0200.t: "丞相南征"
 hd_sg218.0200.desc: "南中叛乱已有时日，国中渐安。丞相请率众南征：用兵之道，攻心为上，攻城为下；心战为上，兵战为下。"
 hd_sg218.0200.a: "准丞相南征"
 hd_sg218.0200.b: "闭关息民，来年再议"
 hd_sg218.0205.t: "七擒孟获"
 hd_sg218.0205.desc: "孟获为夷汉所服，丞相生致之，使观营陈，纵使更战。七纵七擒，而亮犹遣获。获止不去，曰：公，天威也，南人不复反矣。"
 hd_sg218.0205.a: "南中平定"
 hd_sg218.0210.t: "出师表"
 hd_sg218.0210.desc: "南方已定，兵甲已足。丞相上疏：当奖率三军，北定中原，庶竭驽钝，攘除奸凶，兴复汉室，还于旧都。\n\n大军将出祁山，取天水、南安、安定三郡。"
 hd_sg218.0210.a: "准表出师"
 hd_sg218.0210.b: "国力未复，来年再议"
 hd_sg218.0211.t: "姜维归降"
 hd_sg218.0211.desc: "天水中郎将姜维为郡守所疑，进退无路，遂诣丞相归降。丞相称其忠勤时事，思虑精密，乃凉州上士。"
 hd_sg218.0211.a: "得一良才"
 hd_sg218.0212.t: "失街亭"
 hd_sg218.0212.desc: "马谡违亮节度，舍水上山，举措烦扰。张郃绝其汲道，击大破之，士卒离散。街亭一失，大军进无所据。"
 hd_sg218.0212.a: "挥泪斩马谡"
 hd_sg218.0212.b: "免死夺职"
 # 218 年剧本：全局通报
 hd_sg218.0510.t: "汉中之战"
 hd_sg218.0510.desc: "建安二十三年，[hd_news_a.GetName]进兵汉中，与[hd_news_b.GetName]争夺这块益州的北门。\n\n汉中若失，巴蜀便可北出秦川；汉中若守，西南便永远被锁在群山之中。"
 hd_sg218.0520.t: "许都之乱"
 hd_sg218.0520.desc: "许都城中，[hd_news_b.GetName]等人举火作乱，欲挟天子攻[hd_news_a.GetName]，旋即被平定。\n\n汉室最后一次在许都里拔刀，也就此熄灭了。"
 hd_sg218.0530.t: "乌桓复叛"
 hd_sg218.0530.desc: "代郡乌桓[hd_news_b.GetName]起兵叛魏，[hd_news_a.GetName]命其子曹彰北征。"
 hd_sg218.0535.t: "北方大定"
 hd_sg218.0535.desc: "[hd_news_a.GetName]大破乌桓，追奔逐北。鲜卑[hd_news_b.GetName]在旁观望，见乌桓已破，遂遣使请服。"
 hd_sg218.0540.t: "宛城之变"
 hd_sg218.0540.desc: "南阳吏民苦于繇役，[hd_news_a.GetName]据宛城而反，荆北为之震动。"
 hd_sg218.0550.t: "定军山"
 hd_sg218.0550.desc: "黄忠于定军山斩杀夏侯渊，[hd_news_b.GetName]在汉中的守军失去了主将。"
 hd_sg218.0560.t: "汉中易手"
 hd_sg218.0560.desc: "汉中之战落下帷幕，[hd_news_a.GetName]尽得汉中，西南的门户从此打开。"
 hd_sg218.0570.t: "关羽北伐"
 hd_sg218.0570.desc: "[hd_news_a.GetName]留兵备南郡，亲率荆州之兵北攻襄樊，与[hd_news_b.GetName]的守军隔汉水相持。"
 hd_sg218.0580.t: "威震华夏"
 hd_sg218.0580.desc: "汉水暴溢，于禁七军尽没，庞德被擒。[hd_news_a.GetName]威震华夏，[hd_news_b.GetName]一度议徙许都以避其锐。"
 hd_sg218.0590.t: "白衣渡江"
 hd_sg218.0590.desc: "[hd_news_a.GetName]趁[hd_news_b.GetName]北伐之际，命吕蒙白衣渡江，偷袭荆州。"
 hd_sg218.0600.t: "关羽之死"
 hd_sg218.0600.desc: "[hd_news_b.GetName]败走麦城，为[hd_news_a.GetName]所擒，不屈而死。\n\n荆州之失、云长之死，这笔账迟早要算。"
 hd_sg218.0610.t: "魏王薨"
 hd_sg218.0610.desc: "魏王曹操薨逝，[hd_news_a.GetName]嗣位为魏王、丞相。"
 hd_sg218.0620.t: "汉魏禅代"
 hd_sg218.0620.desc: "[hd_news_a.GetName]筑坛受禅，[hd_news_b.GetName]逊位。四百年炎汉，至此改朝换代。"
 hd_sg218.0630.t: "汉帝即位"
 hd_sg218.0630.desc: "[hd_news_a.GetName]于成都武担之南即皇帝位，以续汉祚，不承认[hd_news_b.GetName]的禅代。"
 hd_sg218.0650.t: "张飞遇害"
 hd_sg218.0650.desc: "[hd_news_b.GetName]为帐下将张达所杀，张达持其首投奔孙权。"
 hd_sg218.0660.t: "夷陵之战"
 hd_sg218.0660.desc: "[hd_news_a.GetName]亲率大军东征[hd_news_b.GetName]，誓为关羽报仇。"
 hd_sg218.0670.t: "火烧连营"
 hd_sg218.0670.desc: "[hd_news_b.GetName]火烧连营七百里，[hd_news_a.GetName]大败而走。"
 hd_sg218.0680.t: "白帝托孤"
 hd_sg218.0680.desc: "[hd_news_a.GetName]嗣位，[hd_news_b.GetName]受遗诏辅政，政事无巨细，咸决于丞相。"
 hd_sg218.0690.t: "南中叛乱"
 hd_sg218.0690.desc: "[hd_news_a.GetName]国有大丧，南中诸郡大姓夷帅趁机叛乱。"
 hd_sg218.0700.t: "丞相南征"
 hd_sg218.0700.desc: "[hd_news_b.GetName]率众南征，平定南中叛乱。"
 hd_sg218.0705.t: "七擒孟获"
 hd_sg218.0705.desc: "[hd_news_b.GetName]七纵七擒，终于心服：公，天威也，南人不复反矣。"
 hd_sg218.0710.t: "出师北伐"
 hd_sg218.0710.desc: "[hd_news_a.GetName]出师北伐，大军出祁山，与[hd_news_b.GetName]争夺陇右。"
 hd_sg218.0712.t: "失街亭"
 hd_sg218.0712.desc: "[hd_news_b.GetName]违节度，舍水上山，街亭失守，北伐大军进无所据。"
 # 218 年剧本：书签人物
 bm_218_cao_cao_name: "操"
 bm_218_cao_cao_name_subheading: "魏王"
 bm_218_cao_cao_name_desc: "曹操以丞相之尊进爵魏王，奉天子于许都，北方九州尽归其治。然而年事已高，汉中告急，许都城中仍有人心怀汉室。他能否在有生之年为曹氏打下不可动摇的根基？"
 bm_218_liu_bei_name: "备"
 bm_218_liu_bei_name_subheading: "汉中王"
 bm_218_liu_bei_name_desc: "半生颠沛的刘备终于在益州站稳脚跟，正与曹军争夺汉中。他以尊汉为旗号，荆州有关羽坐镇，蜀中有诸葛亮治理，兴复汉室的大业似乎第一次触手可及。"
 bm_218_sun_quan_name: "权"
 bm_218_sun_quan_name_subheading: "坐断东南"
 bm_218_sun_quan_name_desc: "孙权继父兄之业，据有江东已近二十年。与刘备的同盟日渐貌合神离，荆州上游的关羽让他寝食难安。是守盟约，还是趁虚而入？"
 bm_218_guan_yu_name: "羽"
 bm_218_guan_yu_name_subheading: "荆州都督"
 bm_218_guan_yu_name_desc: "关羽持节都督荆州，糜芳、孟达、士仁皆在麾下。北有曹仁屯樊，东有孙权窥伺。他的威名足以震动华夏，可身后的荆州并不像看上去那样稳固。"
 bm_218_zhu_ge_liang_name: "亮"
 bm_218_zhu_ge_liang_name_subheading: "军师将军"
 bm_218_zhu_ge_liang_name_desc: "刘备北上争夺汉中，诸葛亮坐镇成都，署左将军府事，足食足兵以供前线。他是刘备最倚重的人，眼下却无尺寸封土。是尽心辅佐主公兴复汉室，还是终有一日独撑大局？"
 bm_218_si_ma_yi_name: "懿"
 bm_218_si_ma_yi_name_subheading: "太子中庶子"
 bm_218_si_ma_yi_name_desc: "出身河内温县的司马懿被曹操强征入仕，如今侍奉太子曹丕左右。曹操对他心存戒备，他却始终深藏不露。曹氏的基业，将来究竟会落到谁的手中？"
