l_simp_chinese:
 # 农民义军
 hd_peasant_army.0001.t: "乡民来投"
 hd_peasant_army.0001.desc: "连日来，营门外总有人扶老携幼而来。有的扛着锄头，有的只带一根削尖的竹竿，见了旗号便跪下，说家里的田早被豪强占了，县里的租税又逼得人活不下去。

他们说，听闻[ROOT.Char.GetFirstName]也是穷苦人出身，不欺乡里，愿意跟着走一条活路。点验下来，竟又凑成了一支队伍。"
 hd_peasant_army.0001.a: "都编进来，同吃一锅饭。"
 hd_peasant_army.0001.a.tt: "#P 乡民聚为一军，前来投奔#!（兵力 = 外交×管理×5，另有 1 队民兵枪兵）"
 hd_peasant_army_troops_name: "义军乡勇"
 hd_peasant_army_siege_toast: "乡民来投"
