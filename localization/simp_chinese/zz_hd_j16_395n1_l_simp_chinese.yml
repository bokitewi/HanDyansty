l_simp_chinese:
 hd_j16.5400.t:0 "伐魏之议"
 hd_j16.5400.desc:0 "拓跋珪背燕自立，屡扰塞上，朝中诸将请以太子慕容宝为帅，率慕容农、慕容麟等北伐，一举荡平代北。太史却说天象不利，宜缓图之。"
 hd_j16.5400.a:0 "遣太子率军伐魏。"
 hd_j16.5400.b:0 "天时未至，暂不北伐。"
 hd_j16.5401.t:0 "燕军压境"
 hd_j16.5401.desc:0 "燕军大举北来，旌旗蔽野，直指我国。诸部震恐，有人劝你远避其锋，有人请你据险邀击。"
 hd_j16.5401.a:0 "整军迎敌。"
 hd_j16.5405.t:0 "亲征平城"
 hd_j16.5405.desc:0 "参合陂一败，燕军精锐丧尽，太子仅以身免。你虽年老多病，却知道此时若不亲出，国中再无可用之将。诸将劝你凿山开道，出其不意，直取平城。"
 hd_j16.5405.a:0 "亲率大军，凿山出塞。"
 hd_j16.5405.b:0 "年老力衰，罢兵休养。"
 hd_j16.5410.t:0 "中山危急"
 hd_j16.5410.desc:0 "魏军四面合围，中山城中粮尽，人心离散。有人劝你趁夜突围，北归龙城旧都，保全宗庙；也有人说中山是根本之地，一弃便再难收复。"
 hd_j16.5410.a:0 "弃中山，北走龙城。"
 hd_j16.5410.b:0 "誓与中山共存亡。"
 hd_j16.5420.t:0 "兰汗来迎"
 hd_j16.5420.desc:0 "南征之师溃散，你一路北走。龙城的兰汗遣使来迎，说城中已扫除宫室，恭候圣驾。兰汗是你的舅祖，又是慕容盛的岳父，可左右有人低声提醒：段速骨之乱刚平，兰汗手握重兵，其心难测。"
 hd_j16.5420.a:0 "兰汗是至亲，回龙城。"
 hd_j16.5420.b:0 "暂驻城外，不入龙城。"
 hd_j16.5430.t:0 "燕丽交兵"
 hd_j16.5430.desc:0 "高句丽王[hd_news_b.GetName]屡侵辽东，燕主[hd_news_a.GetName]亲率大军东讨，连拔新城、南苏二城，开境七百余里，徙其民五千余户而还。"
 hd_j16.5431.t:0 "辽东城下"
 hd_j16.5431.desc:0 "燕主[hd_news_a.GetName]攻高句丽辽东城，城将陷，却下令先登者不得入城，要待铲平城墙、与皇后乘辇而入。城中趁机修城固守，燕军终不能克，[hd_news_b.GetName]保住了辽东。"
 hd_j16.5440.t:0 "宫门之变"
 hd_j16.5440.desc:0 "你为苻皇后营陵，倾尽国力，又在皇后灵车后徒步出城送葬。冯跋兄弟趁你出城，闭门拥立慕容云（高云）为主。城门已闭，随从溃散，你该怎么办？"
 hd_j16.5440.a:0 "大势已去，逊位于高云。"
 hd_j16.5440.a.tt:0 "交出燕位，退居宫中；然新主未必容得下旧君，逊位亦难免一死。"
 hd_j16.5440.b:0 "岂能拱手让人？誓夺回宫城！"
 hd_j16.5450.t:0 "众推冯跋"
 hd_j16.5450.desc:0 "天王高云被宠臣离班、桃仁刺杀于东堂。你领兵入宫，斩杀二人，平定乱局。群臣跪请你即天王位，以安人心。"
 hd_j16.5450.a:0 "天命所归，即天王位。"
 hd_j16.5450.b:0 "另立贤者，不居大位。"
 hd_j16.5470.t:0 "南奔广固"
 hd_j16.5470.desc:0 "你在长安装疯卖傻，以避秦人耳目。叔父慕容德在广固称帝，膝下无子，遣人秘密来迎，许你以储位。秦人若察觉，便是杀身之祸。"
 hd_j16.5470.a:0 "潜出长安，南奔叔父。"
 hd_j16.5470.b:0 "留在长安，不冒此险。"
 hd_j16.5500.t:0 "晋阳之失"
 hd_j16.5500.desc:0 "[hd_news_a.GetName]率步骑四十余万南出马邑，逾句注，旌旗二千余里，鼓行而前。燕并州守将弃晋阳东走，并州诸郡尽入于魏。"
 hd_j16.5510.t:0 "进取邺城"
 hd_j16.5510.desc:0 "中山既下，河北诸城望风归附，唯邺城尚在敌手。邺是魏武旧都，城坚粮足，拿下它，河北便尽为我有。"
 hd_j16.5510.a:0 "挥师南下，进取邺城。"
 hd_j16.5510.b:0 "休兵养马，不必急取。"
 hd_j16.5520.t:0 "秦兵东来"
 hd_j16.5520.desc:0 "秦主遣姚平率步骑四万东侵，攻陷乾壁，兵锋直指平阳。诸将请你亲率大军迎击，趁秦军孤军深入，围而歼之。"
 hd_j16.5520.a:0 "亲率大军迎击。"
 hd_j16.5520.b:0 "据守边城，不与交锋。"
 hd_j16.5521.t:0 "魏师西向"
 hd_j16.5521.desc:0 "魏主拓跋珪大举西来，平阳、河东一带边城告急。是发兵迎战，还是遣使求和、暂避其锋？"
 hd_j16.5521.a:0 "发兵迎战。"
 hd_j16.5521.b:0 "遣使求和，暂避其锋。"
 hd_j16.5540.t:0 "宫中之变"
 hd_j16.5540.desc:0 "父皇夜里在天安殿被弟弟拓跋绍弑杀。绍闭宫门，矫诏召集百官，人心惶惶。你在外避祸，卫士和朝臣纷纷前来投奔，请你入宫诛杀逆贼，继承大统。"
 hd_j16.5540.a:0 "率众入宫，诛杀逆贼。"
 hd_j16.5540.b:0 "局势未明，观望待变。"
 hd_j16.5550.t:0 "东取洛阳"
 hd_j16.5550.desc:0 "晋室内乱，洛阳孤悬河南，守兵单弱。姚崇请率步骑东出，一举收复旧都。"
 hd_j16.5550.a:0 "遣姚崇东取洛阳。"
 hd_j16.5550.b:0 "暂不东顾。"
 hd_j16.5551.t:0 "秦兵出关"
 hd_j16.5551.desc:0 "秦将率军东出，围攻洛阳。河南守将飞书告急，请朝廷速发援兵。"
 hd_j16.5551.a:0 "命诸将设法救援。"
 hd_j16.5560.t:0 "西讨乞伏"
 hd_j16.5560.desc:0 "乞伏乾归据有陇西，时附时叛。叔父姚硕德请率步骑西讨，迫其称藩。"
 hd_j16.5560.a:0 "遣姚硕德西讨。"
 hd_j16.5560.b:0 "暂且羁縻，不必用兵。"
 hd_j16.5561.t:0 "秦兵压境"
 hd_j16.5561.desc:0 "秦将姚硕德率大军西来，兵锋甚锐。部将劝你暂且称藩于秦，以存宗社，再图后举；也有人说乞伏氏世为一方之主，岂能俯首于羌人。"
 hd_j16.5561.a:0 "遣使称藩，保全宗社。"
 hd_j16.5561.b:0 "宁战不降。"
 hd_j16.5562.t:0 "兵败求和"
 hd_j16.5562.desc:0 "秦军大胜，我军溃散，都城危在旦夕。秦人遣使来说：若肯称藩，便许你保有旧地。"
 hd_j16.5562.a:0 "称藩于秦。"
 hd_j16.5562.b:0 "不从，收拾残部再战。"
 hd_j16.5570.t:0 "西讨吕氏"
 hd_j16.5570.desc:0 "吕氏据姑臧，国中屡生篡弑，又被南凉、北凉轮番侵扰，已是强弩之末。诸将请发兵西讨，迫其称藩。"
 hd_j16.5570.a:0 "发兵西讨吕氏。"
 hd_j16.5570.b:0 "暂不西顾。"
 hd_j16.5571.t:0 "秦兵西来"
 hd_j16.5571.desc:0 "秦军西来，姑臧城中人心惶惶，南北二凉又虎视在侧。群臣劝你称藩于秦，借秦之力自保。"
 hd_j16.5571.a:0 "遣使称藩于秦。"
 hd_j16.5571.b:0 "据城死守，宁战不降。"
 hd_j16.5572.t:0 "兵败求和"
 hd_j16.5572.desc:0 "秦军大胜，姑臧已成孤城。秦人遣使来说：若肯称藩，便许你保有旧地。"
 hd_j16.5572.a:0 "称藩于秦。"
 hd_j16.5572.b:0 "不从，再战。"
 hd_j16.5580.t:0 "储位之争"
 hd_j16.5580.desc:0 "你年事已高，太子姚泓仁厚而柔弱，次子姚弼却深得你宠爱，结党营私，屡谋夺嫡。朝臣纷纷进言，请你早定储位，以绝祸乱。"
 hd_j16.5580.a:0 "确立姚泓，严惩姚弼一党。"
 hd_j16.5580.b:0 "暂不处置。"
 hd_j16.5590.t:0 "易主之变"
 hd_j16.5590.desc:0 "[hd_j16_n1_abd_to.GetName]已在朝中握有大权，群臣纷纷倒向他，要你让出大位。"
 hd_j16.5590.desc_none:0 "朝中已有权臣握有大权，群臣纷纷倒向他，要你让出大位。"
 hd_j16.5590.desc_lanhan:0 "慕容宝已死，兰汗据龙城，自称大都督、大单于、昌黎王，诸将多附之。你孤立无援，他遣使来要你让出燕位。"
 hd_j16.5590.desc_sheng:0 "兰汗已死，慕容盛以先帝之子的名分收拾人心，宗室旧臣尽归其下。众人请你让位于他，以安社稷。"
 hd_j16.5590.desc_xi:0 "慕容盛遇害，丁太后与群臣议定迎立河间公慕容熙，以为国家多难，宜立长君。他们要你让出燕位。"
 hd_j16.5590.desc_gaoyun:0 "慕容熙已死，冯跋兄弟拥戴慕容云（高云）为主，龙城上下尽从其命，要你让位于他。"
 hd_j16.5590.desc_fengba:0 "高云遇刺，冯跋平定乱局，群臣都推他即天王位，要你让出大位。"
 hd_j16.5590.desc_tuobasi:0 "拓跋珪遇弑，拓跋嗣入宫诛杀逆贼，卫士、朝臣尽归其下，要你让出帝位。"
 hd_j16.5590.a:0 "大势已去，逊位。"
 hd_j16.5590.b:0 "拒之！"
 hd_j16_n1_army_canhe_name:0 "慕容宝所部"
 hd_j16_n1_army_pingcheng_name:0 "慕容垂亲军"
 hd_j16_n1_army_weiye_name:0 "魏军南路"
 hd_j16_n1_army_chaibi_wei_name:0 "拓跋珪所部"
 hd_j16_n1_army_chaibi_qin_name:0 "姚平所部"
 hd_j16_n1_army_yaoluo_name:0 "姚崇所部"
 hd_j16_canhe_shang_modifier:0 "参合之殇"
 hd_j16_canhe_shang_modifier_desc:0 "参合陂一战，燕军精锐尽丧，坑降卒数万，举国痛悼，补员艰难。"
 hd_j16_canhe_cuofeng_modifier:0 "挫锋"
 hd_j16_canhe_cuofeng_modifier_desc:0 "与燕军交锋失利，兵锋受挫，诸部观望。"
