 # ===== xinsanguo-MOD: WJ称谓显示 键值覆盖(仿OE生效路径, 无GUI文件)2026-08-16 =====
 # 原版这些GUI本地化键的值是 [Character.GetUINameNotMeNoTooltip] 等,
 # 这里把值替换为 WJ 自定义loc链 → 称谓显示顺序/格式改为汉式。
 # 键名与原版完全一致(按key覆盖, 后加载mod胜)。

 CHARACTER_VIEW_NAME: "[Character.Custom('WJ_GetUIName')], "
 CHARACTER_VIEW_NAME_SHORT: "[Character.Custom('WJ_GetShortUIName')], "
 CHARACTER_VIEW_NAME_TT: "[Character.Custom('WJ_GetUIName')]"
 CHARACTER_TT_NAME: "[Character.Custom('WJ_GetUIName')]"
 CHARACTER_TT_NAME_AGE: "[Character.Custom('WJ_GetUIName')]#medium ，[Character.GetAge]岁#!"
 CHARACTER_TITLED_FIRST_NAME: "[Character.Custom('WJ_GetTitledFirstName')]"
 WAR_PARTICIPANT_TOOLTIP: "#T [CHARACTER.Custom('WJ_GetUIName')]#!"
 OUTLINER_PINNED_CHARACTER: "[Character.Custom('WJ_GetShortUIName')]#medium ，[Character.GetAge]岁#!"
