 WJ_mufu_empty_short:0 "空缺；可调任本府僚属或另行辟召"
 WJ_mufu_history_detail:0 "#high 开府置属#!\n开府不只是另设一座官署，更涉及府主配置僚属、分曹处理政务的地位。汉代三公府设长史及诸曹掾属；将军府亦置长史、司马等官，分理府务、军政。\n\n府中各曹各有所司：有掌选举者，有理奏议、文书、簿籍者，职掌与员额随官府及时代而异，不宜视为历代不变的一套定制。\n\n汉末以来，辟召又成为延揽士人的重要途径。僚佐在府主身边参与议事、筹画与行政，府主与故吏之间也往往延续知遇和报效的关系。\n\n史料参考：《后汉书·百官志一》。"
 WJ_mufu_history_intro:0 "#high 开府与幕府#!\n汉代公府与将军府设僚属，分曹理事。长史综理府务，司马参掌军政；掾属佐理文书、选举等事。汉末军政多故，府主辟召士人，幕府兼为议事、参谋与延揽人才之所。府主与僚佐之间，亦由此形成任用与报知的联系。"

