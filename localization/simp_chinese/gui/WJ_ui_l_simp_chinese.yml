 WJ_mt_zhongwai_help:0 "都督中外空缺时，由天子亲掌全国调兵之权；地方都督仍可调度本区，其余人只可查阅。\n\n欲总督中外，须身为天子的摄政，且侍中、大将军、尚书令、大司马四席之中，至少三席由你本人、你的门生、府中僚属或同族之人执掌（一人兼任按席计）。本朝只设一人。\n\n以“请诏总督中外”决议奉诏，并假黄钺；四席只在受命时查验，一旦失去摄政之位，二者一并收回。"
