l_simp_chinese:
 hd_palace_crisis.0001.t:0 "京中风声"
 hd_palace_crisis.0001.desc:0 "雒阳传来的消息，比军报还要杂乱。何进与宦官相争，今日说已有定议，明日又说太后不许；每个传话的人，都先探问你这里愿意信哪一种说法。\n\n你把书信交给左右再看，自己走到帐口。凉州兵卒照旧点校马具，京师宫门里的一场争执，于他们不过是很远的事；可若朝中真有人想借外兵分出胜负，这些人便会忽然成了最要紧的筹码。\n\n信里还没有正式的召令。你不必急着替哪一方表态，只须留心：争执的人何时不再靠口舌，而要把你的兵马写进他们的盘算。"
 hd_palace_crisis.0001.a:0 "且静观京中之变。"
 hd_palace_crisis.0002.t:0 "外兵之议"
 hd_palace_crisis.0002.desc:0 "京中的争执终于有了新的门路。传来的消息说，袁绍劝何进召外兵入京，以兵势胁迫太后诛除宦官；被提到的领兵之人里，正有你。\n\n你把那几行字看了两遍。何进或许只想借一阵甲兵声，让久议不决的事落定，却未必想过，兵马一旦到了城下，便不再是一封可以收回的奏书。\n\n左右问是否即刻行动，你摆手止住。消息终究不是诏命。粮秣可以先查，道路可以先问，至于以什么名义入京，还得等那份真正送到军前的文书。"
 hd_palace_crisis.0002.a:0 "粮道先查，静候召书。"
 hd_palace_crisis.0003.t:0 "奉召入京"
 hd_palace_crisis.0003.desc:0 "召令终于到了。你展开文书，读到命你率军入京一句，便用手指按住那一处，让左右再听一遍。帐外一匹马嘶鸣起来，倒像比他们更早明白这是桩好事。\n\n朝里那些人争来争去，到头来还是要借你的兵。有人问到了雒阳该听谁节制，你抬眼看他；他连忙改口，转问起粮秣来。兵还没带到，倒先有人替别人想着如何约束你了。\n\n你卷起召令，在案沿上敲了敲。京师的宫门再深，也总有请人进去的时候。如今文书在手，甲兵在侧，还有什么好迟疑的？"
 hd_palace_crisis.0003.a:0 "奉诏进兵，即日启程。"
 hd_palace_crisis.0004.t:0 "宫门合拢"
 hd_palace_crisis.0004.desc:0 "宫门在身后合拢时，你还以为只是照例清道。直到前方也有人拦住去路，你才发觉，方才随行的声音已经听不见了。\n\n宦官们不再像往日那样委婉。他们提起将至的外兵，提起你与袁绍的密议，语气里已没有容你分辩的余地。你喝问谁敢阻拦大将军，回答你的却是逼近的脚步与出鞘的刀。\n\n你伸手按住衣带，忽然想起那些还在宫门外等候的人。他们看得见你的车马，却看不见此刻围上来的兵刃。那封召外兵的文书，终究来不及替你打开这一扇门。"
 hd_palace_crisis.0004.a:0 "门外的兵马……为何还不来？"
 hd_palace_crisis.0005.t:0 "血染宫门"
 hd_palace_crisis.0005.desc:0 "何进遇害的消息传出宫门，方才还在等候的兵士顿时乱了。你率众闯入，禁门后的呼喝声与奔逃声搅在一起，再没有谁肯停下来听完一道完整的号令。\n\n宦官及其党羽已被清剿，檐下与甬道间却仍留着血迹。你走过方才还有人把守的门，才明白拔刀除去一群人，并不等于有人能立刻接住朝廷的号令。\n\n城外又传来董卓兵马逼近的消息。当初请外兵来，是为了逼宫中退让；如今何进死了，宫门破了，接下来又有谁去告诉那支军队，它已经不必再进城？"
 hd_palace_crisis.0005.cao_desc:0 "袁绍已死，何进又在宫中遇害。消息一到，再等下去便是最危险的事。你率兵冲进禁门，先前彼此探问的低语，转眼都变成了追逐与喝令。\n\n宦官及其党羽已遭清剿。你站在一片狼藉的宫道上，却找不到一个能把残局说清的人：有人求你继续搜捕，有人只想知道天子何在，还有人忙着辩白自己从未与闻此事。\n\n董卓的兵马仍向雒阳逼近。宫里的仇敌虽已倒下，城外那道出自何进之手的召令，却不会随着他的死而作废。"
 hd_palace_crisis.0005.dong_desc:0 "袁绍、曹操皆已身死，何进也遭宦官杀害。京中送来的急报先是求援，后来便成了各处兵士自行搜捕的消息，连写信的人也说不清还有谁在主持朝局。\n\n你命人追究宦官及其党羽，清剿的结果很快报来。可这些名字从名册上划去以后，空出的宫门与失了节制的兵众，并没有因此恢复旧日的次序。\n\n你把军报收好，转而问起赴京的道路。召你来的人既已死了，宫里又无人收拾残局，这支军队入城之后该听谁的号令，便不必再照原来的打算。"
 hd_palace_crisis.0005.a:0 "清剿虽毕，残局未收。"
 hd_palace_crisis.0007.t:0 "凉州兵入雒"
 hd_palace_crisis.0007.desc:0 "雒阳城门就在前面。守卒望见旗号，先忙着通报，竟半晌说不清该向谁禀告。你听得不耐，将马往前催了一步。\n\n何进死了，宦官也伏诛了，满城的人倒像都在等别人先开口。朝廷用得着你的兵时，召令发得何等急切；如今兵到了，却连一个肯出来料理事情的人也找不到。\n\n你回头看了看身后的行伍，令前军依次入城。宫门要有人守，司隶的军政要有人掌。既然旁人都只会彼此张望，便让他们看清楚，往后该向谁回话。"
 hd_palace_crisis.0007.a:0 "兵入雒阳，总领司隶。"
 hd_palace_crisis.0015.t:0 "废立"
 hd_palace_crisis.0015.desc:0 "入京以来，宫门守卫与司隶军政渐渐都照你的意思运转，殿上的名位却仍横在每一道命令之前。群臣谈论祖制时，目光总是有意无意地转向御座。\n\n你把废立之议摆到了他们面前。废刘辩，立刘协，写进诏书不过寥寥数行；可这几行一旦落定，朝中那些尚存的迟疑与侥幸，便都得换一种说法。有人握紧了笏板，有人低头不语，等着你收回这番话。\n\n你没有收回。兵权已在手中，若连谁来坐那张御座都定不了，又谈何总揽朝政？"
 hd_palace_crisis.0015.a:0 "废刘辩，立刘协。"
 hd_palace_crisis.0016.t:0 "横刀长揖"
 hd_palace_crisis.0016.desc:0 "董卓把废立之议说出口，殿前竟有片刻无人应答。你看着那些避开目光的同僚，终于按剑上前，质问他凭什么擅自废立天子。\n\n话一出口，便再不能当作一场寻常的争论。董卓的兵在城中，你的怒气却变不成足以与他对峙的甲士。周围有人试图劝解，更多的人只盼你们不要当场拔刀。\n\n你横刀长揖，退出殿外，这才松开绷紧的手。留在这里，不过是把性命交给他的一时犹豫；渤海尚可经营，何必把往后的大事，全押在这一场无援的争执上。"
 hd_palace_crisis.0016.a:0 "悬节上东门，奔赴渤海。"
 hd_palace_crisis.0021.t:0 "并州旧部"
 hd_palace_crisis.0021.desc:0 "董卓的兵往前逼了几步，你身旁的吕布便迎了上去。望着对面忽然迟疑起来的阵势，你冷笑一声：凉州兵敢在京师横行，也不是没有怕的人。\n\n奉先退回来时，你叫他留心营中，把并州旧部收拢好。城里近来尽传董卓如何封赏，又有谁夜里往来，听得人心烦。朝廷的事还没理清，倒先有人忙着替自己找门路。\n\n吕布应了一声，没有多说。你看了他一眼，仍把下一道军令交到他手里。有他在身边，这场争执便还轮不到董卓说了算。"
 hd_palace_crisis.0021.a:0 "奉先，营中诸事还须你用心。"
 hd_palace_crisis.0022.t:0 "近身之刃"
 hd_palace_crisis.0022.desc:0 "吕布进帐时，你还当有新的军报，唤了一声奉先，叫他近前。他却没有行礼，手始终按在兵器上。\n\n“你这是何意？”话一出口，你才站起身来。他提到董卓，提到新的去处，那语气竟像是在回禀一桩已经办妥的军务。你猛地望向帐口，熟悉的营中声响仍在，却没有一个人进来。\n\n昨日他还替你挡住董卓，今日这柄兵器便对准了你。你伸手去按佩剑，怒意将余下的话全堵在了喉中。奉先——你叫他留心营中，竟是把自己的性命也交到了他手里！"
 hd_palace_crisis.0022.a:0 "奉先，你竟要向我动手？"
 hd_palace_crisis.0023.t:0 "焚雒西迁"
 hd_palace_crisis.0023.desc:0 "关东诸军已经举兵，讨董的檄文也传到了雒阳。那些先前各守州郡的人，如今把你的名字写在同一纸罪状上，倒比朝中群臣说得还齐整。\n\n左右劝你西迁长安，凭关中险固再作打算。你将军报掷在案上，殿下顿时没了声音。舍弃雒阳固然可恨，留在这里等诸军逼近，却更不合你的心意。\n\n宫室、府库与军民的迁徙，都要随这道命令一起动起来；城中那些不肯随行的富户豪门，也不必留给后来的人。你看着舆图上通往关中的道路，终于唤人近前：既然要走，便不能给追来的人留下一座可以从容接手的京师。"
 hd_palace_crisis.0023.a:0 "尽焚雒阳，西徙长安。"


