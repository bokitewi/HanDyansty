l_simp_chinese:
 hd_palace_crisis.0001.t:0 "宫廷阴影"
 hd_liu_hong_timeline_protection:0 "病势暂缓"
 hd_liu_hong_timeline_protection_desc:0 "天子病势暂缓，宫廷仍在维持表面的秩序。"
 hd_palace_crisis.0001.desc:0 "雒阳宫门之内，十常侍与大将军何进的争斗已经没有回头路。每一方都在寻找置对方于死地的机会，朝堂上下人人自危。你听见的每一句悄声交谈，都可能是下一场流血的前兆。"
 hd_palace_crisis.0001.a:0 "先看清谁会先拔刀。"
 hd_palace_crisis.0002.t:0 "最终手段"
 hd_palace_crisis.0002.desc:0 "袁绍将何进请到偏殿，提出一个危险的办法：既然宫中无法下手，不如召来凉州的兵马，以外兵震慑十常侍。此举或许能除掉宦官，也可能让刀兵从宫门一直烧遍天下。"
 hd_palace_crisis.0002.a:0 "把这封信送往凉州。"
 hd_palace_crisis.0003.t:0 "进京？"
 hd_palace_crisis.0003.desc:0 "诏令抵达凉州军中。军师低声提醒你，雒阳的召唤很可能是朝廷的最后一搏：进京可以改变天下，却也意味着把自己的军队交给一场宫廷豪赌。"
 hd_palace_crisis.0003.a:0 "进京。"
 hd_palace_crisis.0004.t:0 "宫门合拢"
 hd_palace_crisis.0004.desc:0 "十常侍得知外兵将至，抢先发动了刺杀。何进在宫门内落入陷阱，四周的门扉一扇接一扇合拢；他终于明白，自己已经没有机会活着走出这座宫城。"
 hd_palace_crisis.0004.a:0 "大势已去……"
 hd_palace_crisis.0005.t:0 "血染宫门"
 hd_palace_crisis.0005.desc:0 "何进被杀的消息传出，袁绍与曹操立刻率兵杀入宫中。禁门被撞开，火光照着仓皇逃窜的十常侍；这场宫廷斗争终于以鲜血收场。"
 hd_palace_crisis.0005.a:0 "一个也别放走。"
 hd_palace_crisis.0007.t:0 "凉州兵入雒"
 hd_palace_crisis.0007.desc:0 "雒阳城门在沉重的马蹄声中洞开。凉州军沿御道列阵，司隶诸官与郡县长吏捧着印绶候在道旁；你伸手接过司隶印信，宫门内再没有能够与你抗衡的兵马。"
 hd_palace_crisis.0007.a:0 "接掌司隶，入朝辅政。"
 hd_palace_crisis.0006.t:0 "风平浪静？"
 hd_palace_crisis.0006.desc:0 "何进已死，十常侍也被清洗。没有凉州军闯入宫门，司隶的权柄落到了你的手中；然而宫廷表面的平静，只是更大的风暴正在积蓄。"
 hd_palace_crisis.0006.a:0 "先稳住朝廷。"
 hd_palace_crisis.0010.t:0 "随军进京？"
 hd_palace_crisis.0010.desc:0 "凉州军已经拔营，向雒阳进发。主将给你的选择很简单：带着庄园与部曲同行，还是留在凉州守住自己的根基。"
 hd_palace_crisis.0010.a:0 "随主公进京。"
 hd_palace_crisis.0010.b:0 "我留在凉州。"
 hd_palace_crisis.0015.t:0 "废立"
 hd_palace_crisis.0015.desc:0 "摄政已经掌握宫门、兵马与司隶。天子的名位只剩下一纸诏书的距离；群臣震怒，而你必须决定是否把这张纸撕碎，另立一位刘氏宗亲。废立之后，宫中还将接连发生几桩无人宣告的血案。"
 hd_palace_crisis.0015.a:0 "更换皇帝。"
 hd_palace_crisis.0016.t:0 "公开对峙"
 hd_palace_crisis.0016.desc:0 "袁绍在殿前公开质问你的废立之举。他的声音震动群臣，却没有足够的兵马留在城中。对峙之后，他只能离开雒阳，前往渤海另谋大业。"
 hd_palace_crisis.0016.a:0 "让他走。"
 hd_palace_crisis.0021.t:0 "并州旧部"
 hd_palace_crisis.0021.desc:0 "丁原率并州旧部来见。吕布的威势竟使董卓暂时收敛锋芒，唯有吕布的沉默显出另一层危险：这场冲突不会由丁原的忠诚收场。"
 hd_palace_crisis.0021.a:0 "听吕布如何选择。"
 hd_palace_crisis.0022.t:0 "收买吕布"
 hd_palace_crisis.0022.desc:0 "董卓以重赏和前程动摇吕布。丁原尚未察觉身后的刀光，吕布却已经接受了这份交易；从此，他将以义子之名侍奉新的主君。"
 hd_palace_crisis.0022.a:0 "让丁原的旧部归于麾下。"
 hd_palace_crisis.0023.t:0 "迁都的怒火"
 hd_palace_crisis.0023.desc:0 "讨董檄文传遍诸郡，关东联军正在成形。谋士劝董卓暂避锋芒、迁都长安；董卓怒不可遏，却决定把雒阳连同反抗者一起留在身后。"
 hd_palace_crisis.0023.a:0 "迁都长安，焚毁雒阳。"


