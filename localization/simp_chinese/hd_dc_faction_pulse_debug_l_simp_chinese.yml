l_simp_chinese:
 hd_dc_faction_pulse_debug.title: "额外派系年度检查"
 hd_dc_faction_pulse_debug.desc: "保留原生自动创建。W达到20后，每个政权每年另有一次基础10%的机会，经P按1−(1−p₀)^P换算；抽中后在当时合法类型中等权选择，最多创建一个。角色发起者必须是AI，郡起义使用真实郡资格。已有同类派系则排除，不重复加速。\n\n拥立类必须有真实宣称人及头衔。现行关闭的日本派系条件继续生效；升级农民派系保留原生既有起义升级流程。此机会不替换原生最终创建概率，不直接发难或开战。"
 hd_dc_faction_pulse_debug.outside: "\n不能执行：当前人物不在王朝循环区域。"
 hd_dc_faction_pulse_debug.no_title: "\n不能执行：当前人物没有主要头衔。"
 hd_dc_faction_pulse_debug.low_w: "\n当前W低于20，本年度检查不会增加派系机会。"
 hd_dc_faction_pulse_debug.no_record: "\n当前主要头衔尚无年度检查记录。"
 hd_dc_faction_pulse_debug.record: "\n政权：[scope:hd_dc_debug_pulse_realm.GetName]\n最近检查年份：[scope:hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_year').GetValue|0]\n实际抽样概率：[scope:hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_chance').GetValue|2]%\n结果：[SCOPE.GetFlagName('hd_dc_debug_pulse_result')]"
 hd_dc_faction_pulse_debug.actor: "\n实际发起人：[scope:hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_actor').Char.GetShortUIName]"
 hd_dc_faction_pulse_debug.county: "\n实际发起郡：[scope:hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_county').Title.GetName]"
 hd_dc_faction_pulse_debug.type: "\n实际派系类型标识：[scope:hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_type').GetFlagKey]"
 hd_dc_faction_pulse_debug.claimant: "\n真实宣称人：[scope:hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_claimant').Char.GetShortUIName]\n争夺头衔：[scope:hd_dc_debug_pulse_realm.Var('hd_dc_extra_faction_claimed_title').Title.GetName]"
 hd_dc_faction_pulse_debug.used: "\n今年的检查已使用。更换统治者、反复打开此页或调整W不会恢复同一主要头衔的年度机会。"
 hd_dc_faction_pulse_debug.check: "执行本政权今年的正式检查"
 hd_dc_faction_pulse_debug.check.tt: "消耗本主要头衔本年度检查机会，失败不重抽。成功时创建真实合法派系，可能在以后按原生流程发难。查看此页本身不创建派系。"
 hd_dc_extra_faction_low_w: "W不足20，未增加机会"
 hd_dc_extra_faction_missed: "概率未抽中"
 hd_dc_extra_faction_no_type: "概率抽中，但没有可创建的合法类型"
 hd_dc_extra_faction_creation_failed: "已选类型，但创建前资格复检或创建结果读取失败；本年不重抽"
 hd_dc_extra_faction_created: "已读取到实际创建的派系"
