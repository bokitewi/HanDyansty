 # Peach Garden Oath Ceremony
 sworn_brotherhood_events.0001.t:0 "金兰之契"
 
 # Dynamic Event Descriptions
 sworn_brotherhood_events.0001.desc.intro:0 "香案已经设好，酒也斟满了。你与[blood_bro.GetTitledFirstName]相对而立，旁人渐渐止住了说笑。平日里叫惯了的称呼，到了今日，忽然多出一份郑重。\n\n"
 sworn_brotherhood_events.0001.desc.outro:0 "\n\n有人把酒盏递到你手中。誓词不必说尽天下好话，只须拣定最愿守住的那一句，往后照着它行事。"
 sworn_brotherhood_events.0001.desc.just:0 "谈到日后如何相待，话终究落在“信义”二字上。若只在得意时称兄道弟，到了利害关头便换一副面孔，今日的礼数再周全，也不过徒增笑柄。"
 sworn_brotherhood_events.0001.desc.brave:0 "说起往后的凶险，你们谁也没有回避。勇武能叫人向前，可在身旁之人遭难时是否仍肯向前，却是另一回事。今日这盏酒，该为后一件事而饮。"
 sworn_brotherhood_events.0001.desc.loyal:0 "相交至今，你们早已有了可以托付的信任。你不愿让这份信任只留在几句客套里——日后消息纷乱、利害相争之时，总该记得今日当面说定的话。"
 sworn_brotherhood_events.0001.desc.ambitious:0 "你们都不甘守着眼前的日子，谈起将来，各有要成的大事。志向相近固然使人相聚，可如何不因所求相近而反目，才值得今日郑重立誓。"
 sworn_brotherhood_events.0001.desc.generic:0 "你们未必事事同心，也未必处处相似，可相交以来，彼此都有不愿轻弃的情分。今日愿以兄弟相称，便是要把这份情分看得比寻常往来更重。"
 
 # Oath Options
 sworn_brotherhood_events.0001.a:0 "信义为先，皇天后土共鉴。"
 sworn_brotherhood_events.0001.b:0 "以忠相托，生死不负。"
 sworn_brotherhood_events.0001.c:0 "同赴险难，以勇相许。"
 sworn_brotherhood_events.0001.d:0 "一盏薄酒，足明此心。"
 
 # Oath Tooltips
 
 # Follow-up Event
 sworn_brotherhood_events.0002.t:0 "金兰之后"
 sworn_brotherhood_events.0002.desc:0 "自你与[blood_bro.GetTitledFirstName]结为兄弟，转眼已是数月。当日酒礼上的许多细节渐渐模糊，可那几句认真说过的话，每逢想起往后的来往，仍会重新浮上心头。\n\n誓言立下了，并不等于从此便不必再用心维系。近日你们又得相聚，席间有人提起当日的誓词，有人说共过险难方见真心，也有人笑说情分既在，何必再讲排场。\n\n你望着对面那张熟悉的面孔。此后如何相待，终究要由你们自己定下。"

 sworn_brotherhood_events.0002.a:0 "重申前誓，彼此以忠。"
 sworn_brotherhood_events.0002.b:0 "再许生死，同赴险难。"
 sworn_brotherhood_events.0002.c:0 "记取旧谊，厚结金兰。"
 sworn_brotherhood_events.0002.d:0 "情分已明，何须虚礼。"

 sworn_brotherhood_strengthened_tt:0 "我们结拜的情谊历经共患难而更加坚固。"
 
 # Modifier Names & Descriptions
 brotherhood_loyalty_modifier:0 "忠义相连"
 brotherhood_loyalty_modifier_desc:0 "该角色与结义兄弟以忠相托，誓言如金石不移。"
 
 brotherhood_ferocity_modifier:0 "勇烈兄弟"  
 brotherhood_ferocity_modifier_desc:0 "该角色与结义兄弟以勇相许，凡有人敢犯其兄弟，必奋不顾身。"
 
 tested_brotherhood_modifier:0 "历劫情谊"
 tested_brotherhood_modifier_desc:0 "历经岁月，这份金兰之谊愈见深厚。"
 
 brotherhood_ambition_modifier:0 "雄心之盟"
 brotherhood_ambition_modifier_desc:0 "已与血盟兄弟立下雄心之誓，为成就大业而联合。"
 
 # Oath Breaking Penalties
 oath_breaker_modifier:0 "背誓之人"
 oath_breaker_modifier_desc:0 "该角色背弃了金兰之誓，为世人所不齿，难再取信于人。"
 
 dishonorable_modifier:0 "无信之徒"
 dishonorable_modifier_desc:0 "该角色负义背盟，无信之名传遍四方。"
 
 # Oath-Breaking Events
 sworn_brotherhood_events.0003.t:0 "兄弟背誓"
 sworn_brotherhood_events.0003.desc.intro:0 "[betrayer.GetName]背弃兄弟誓言的消息传来了。你听来人说完，又让他再说一遍，直到再也找不出借口，把它当作一句传错的话。\n\n"
 sworn_brotherhood_events.0003.desc.just_betrayed:0 "你最不能容忍的，正是当日以信义相许，今日却任其作废。往后再听见旁人郑重立誓，只怕再难像从前那样毫无疑虑。"
 sworn_brotherhood_events.0003.desc.wrathful_betrayed:0 "一股怒气直冲上来，你几乎当即起身。最熟悉你的人，最知道刀该落在何处——这份背弃，也因此比寻常的敌意更难咽下。"
 sworn_brotherhood_events.0003.desc.cynical_betrayed:0 "你并非从未怀疑过誓言的分量，只是总以为眼前这一份可以例外。如今连这点侥幸，也被[betrayer.GetSheHe]亲手打消了。"
 sworn_brotherhood_events.0003.desc.generic_betrayed:0 "你想起当初相对举杯时的情形，试着把那一刻与眼前的消息放在一起，却怎么也拼不回原来的样子。"
 sworn_brotherhood_events.0003.desc.outro:0 "\n\n来人还在等你开口。旧誓已约束不了[betrayer.GetSheHe]，可你如何回应，仍将决定旁人如何看你，也决定你往后如何信人。"
 sworn_brotherhood_events.0003.a:0 "背誓之徒，当使天下共知。"
 sworn_brotherhood_events.0003.b:0 "既负于我，便是仇雠。"
 sworn_brotherhood_events.0003.c:0 "认清其人，无损我名。"
 sworn_brotherhood_events.0003.d:0 "恩断义绝，从此陌路。"
 
 # Betrayer Event
 sworn_brotherhood_events.0004.t:0 "誓言破碎"
 sworn_brotherhood_events.0004.desc:0 "你背弃了与[actor.GetName]立下的兄弟誓言。无论当时有何理由，失信的污名终将由你一身承担。"
 sworn_brotherhood_events.0004.a:0 "懊悔背叛之行"
 sworn_brotherhood_events.0004.b:0 "拥抱野心"
 
