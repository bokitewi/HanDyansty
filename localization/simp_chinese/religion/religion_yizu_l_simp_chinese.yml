 guiwu_desc:0 "巴人畏鬼而尚巫。相传幽都有土伯守门，虎首牛身，三目利角，手执九约追逐亡魂，巴、蜀诸部共奉之为鬼帝。每逢祭日，巫者击鼓踏歌，迎日禳灾。"

