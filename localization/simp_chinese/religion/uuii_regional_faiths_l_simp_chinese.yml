 yemaek_shamanism:0 "秽貊系原始萨满教"
 yemaek_shamanism_adj:0 "秽貊系原始萨满教"
 yemaek_shamanism_adherent:0 "秽貊萨满信众"
 yemaek_shamanism_adherent_plural:0 "秽貊萨满信众"
 yemaek_shamanism_desc:0 "秽貊、扶余与高句丽诸部敬天、祀山、尊祖灵。每岁大会祭天，扶余谓之迎鼓，高句丽谓之东盟，濊人谓之舞天，举国连日饮酒歌舞；巫者降神附体，为族人禳祟疗疾。"
 yemaek_shamanism_old:0 "旧秽貊系原始萨满教"
