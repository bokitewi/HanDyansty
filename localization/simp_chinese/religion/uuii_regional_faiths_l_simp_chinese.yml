 xianbei_polytheism_desc:0 "鲜卑诸部敬鬼神，祠天地日月、星辰山川，并祀先世以勇健知名的大人。其俗贵壮贱老，以战死为荣，相信死者魂魄将归于赤山，英名长留于部众祭歌之中。"
