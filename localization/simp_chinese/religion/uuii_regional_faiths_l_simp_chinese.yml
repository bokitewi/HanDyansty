 wugui_adherent_plural:0 "巫鬼信众"
 wugui_desc:0 "南中诸夷俗信巫鬼，好诅盟，投石结草以为约信。巫者附灵驱祟、占卜吉凶，安抚山谷间的幽魂；每逢大祭，杀牲聚饮，拜日迎神。"
