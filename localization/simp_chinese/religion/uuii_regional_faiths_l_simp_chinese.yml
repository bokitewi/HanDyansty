l_simp_chinese:
 wudoumidao:0 "五斗米道"
 wudoumidao_adj:0 "五斗米道"
 wudoumidao_adherent:0 "五斗米道信众"
 wudoumidao_adherent_plural:0 "五斗米道信众"
 wudoumidao_desc:0 "五斗米道奉老子为宗，以符水治病，令病者静室思过，书罪状于天、地、水三官。入道者出米五斗，各治由祭酒统领道众，又于道旁置义舍、悬米肉，以济行旅。"
 wudoumidao_religious_head_title:0 "天师"
 wudoumidao_religious_head_title_name:0 "五斗米道廷"

 fusang_pagan:0 "扶桑原始信仰"
 fusang_pagan_adj:0 "扶桑原始信仰"
 fusang_pagan_adherent:0 "扶桑原始信仰信众"
 fusang_pagan_adherent_plural:0 "扶桑原始信仰信众"
 fusang_pagan_desc:0 "倭人事鬼道，以为山海林石之间皆有神灵栖止，氏族祖灵亦护佑子孙。其俗重洁净，举事行来辄灼骨而卜；祭时献供聚饮，歌舞以娱神。"
