 samhan_shamanism_adj:0 "三韩萨满教"
 samhan_shamanism_adherent:0 "三韩萨满信众"
 samhan_shamanism_adherent_plural:0 "三韩萨满信众"
 samhan_shamanism_desc:0 "三韩之俗信鬼神，国邑各立一人主祭天神，号为天君；又设别邑，名曰苏涂，立大木、悬铃鼓以事鬼神。每年五月下种、十月农毕，众人群聚歌舞饮酒，以祭山川鬼神。"
 samhan_shamanism_old:0 "旧三韩萨满教"
