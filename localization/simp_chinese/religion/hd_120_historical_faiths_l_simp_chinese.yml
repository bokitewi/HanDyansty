 hd_han_taoism_faith_adherent_plural:0 "道众"
 hd_han_taoism_faith_desc:0 "奉道之人尊黄老，修身养性，以符水、斋醮为人祛病消灾。蜀中、汉中的五斗米道与关东的太平道皆出其门，信众遍于州郡。"
