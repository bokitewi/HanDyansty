 hd_nanfang_faith_adherent:0 "泛灵信徒"
 hd_nanfang_faith_adherent_plural:0 "泛灵信徒"
 hd_nanfang_faith_desc:0 "南方诸族祀祖灵、山川与日月，事鬼神而重巫祝。越人、楚人、巴人与南中诸夷各守其祭，巫风所及，自江汉直至岭外。"
 hd_han_taoism_faith:0 "汉代道教"
