l_simp_chinese:
 # 253「姜维北伐」剧本。计划见 docs/姜维剧本_计划.md。
 bm_hd_253: "姜维北伐"
 bm_hd_253_desc: "延熙十六年正月，汉寿岁首大会，魏降人郭循拔刃刺杀大将军费祎。自诸葛丞相身殁，蒋、费二公相继秉政，休兵养民十九年，如今只剩卫将军姜维一人还念着北伐。\n\n北边的洛阳，少帝曹芳在位，大将军司马师父子之威已压过曹氏；东边的建业，十岁的孙亮刚刚嗣位，太傅诸葛恪新破魏军于东兴，正倾国北上。\n\n这一年夏天，姜维出石营、围狄道，诸葛恪围合肥新城，魏国东西两面同时告急。\n\n#bold 丞相遗志未竟。陇右与淮南，哪一路先破？#!"

 bm_hd_253_jiang_wei: "姜维"
 bm_hd_253_jiang_wei_subheading: "卫将军、录尚书事"
 bm_hd_253_jiang_wei_desc: "姜维本是天水降将，受丞相亲授兵法。费祎在时，每次出兵不过万人；如今节制已去，汉中诸军尽在他手，大军已向狄道进发。"
 bm_hd_253_guo_huai: "郭淮"
 bm_hd_253_guo_huai_subheading: "车骑将军、都督雍凉"
 bm_hd_253_guo_huai_desc: "郭淮镇守关陇三十余年，诸葛亮、姜维都在他手下吃过亏。他年过七旬，蜀军又一次越过了陇山。"
 bm_hd_253_si_ma_shi: "司马师"
 bm_hd_253_si_ma_shi_subheading: "大将军、录尚书事"
 bm_hd_253_si_ma_shi_desc: "司马懿死后，长子司马师接掌兵权，朝政出于其门。去冬东兴一败，他引咎自责；夏侯玄、李丰等人正暗中谋他。"
 bm_hd_253_cao_fang: "曹芳"
 bm_hd_253_cao_fang_subheading: "魏帝"
 bm_hd_253_cao_fang_desc: "曹芳八岁即位，至今已二十有二，政事却从不由他做主。宫中近臣劝他除去司马氏，成败只在一念之间。"
 bm_hd_253_zhu_ge_ke: "诸葛恪"
 bm_hd_253_zhu_ge_ke_subheading: "太傅、荆扬州牧"
 bm_hd_253_zhu_ge_ke_desc: "诸葛恪是诸葛瑾长子，受孙权遗诏辅政。东兴一战大破魏军，他不顾满朝劝谏，倾国二十万众北围合肥新城。"
 bm_hd_253_guan_qiu_jian: "毌丘俭"
 bm_hd_253_guan_qiu_jian_subheading: "镇东将军、都督扬州"
 bm_hd_253_guan_qiu_jian_desc: "毌丘俭曾两度攻破高句丽丸都，如今镇守淮南，吴军正围新城。他受曹叡知遇之恩，对司马氏专权早已心怀不平。"

