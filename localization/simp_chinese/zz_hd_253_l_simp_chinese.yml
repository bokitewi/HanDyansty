 # 修正
 hd253_zhuge_legacy_modifier: "诸葛遗制"
 hd253_zhuge_legacy_modifier_desc: "丞相留下的军法、屯田与栈道仍在，汉中将士尚能一战。"
 hd253_beifa_rest_modifier: "休兵养士"
 hd253_beifa_rest_modifier_desc: "大军新还，将士疲敝，粮秣未继，一时难以再出。"
 hd253_grain_shortage_modifier: "粮秣不继"
 hd253_grain_shortage_modifier_desc: "蜀道运粮千里，前军已在节食，后方催粮的文书一封接一封。"

 # 事件：开局两战
 hd253.0010.t: "出石营"
 hd253.0010.desc: "费祎的丧事刚过，你就上表请兵。这一次朝中再无人拦你。\n\n数万蜀军出石营，翻过陇坻，直指陇西郡治狄道。羌胡诸部闻讯，派人送来了酒肉。"
 hd253.0010.a: "丞相之志，当自我继之。"
 hd253.0020.t: "围新城"
 hd253.0020.desc: "东兴大捷之后，你不顾朝臣苦谏，大发州郡二十万众北上。\n\n大军越过巢湖，把合肥新城团团围住。城中守将张特兵不过三千，可他一连几个月都没开门。"
 hd253.0020.a: "破此城，淮南可定。"

 # 事件：北伐
 hd253.0100.t: "羌胡来附"
 hd253.0100.desc: "你出兵陇右的消息传开，洮水、羌中的部落首领陆续来到营前，愿出骑兵助战，只是要些赏赐。"
 hd253.0100.a: "厚加赏赐，借其骑兵。"
 hd253.0100.b: "胡骑难制，不必用之。"
 hd253.0110.t: "粮尽"
 hd253.0110.desc: "大军在外已有八个月。汉中的粮车走一趟要一月，到营中时已所剩无几。军中开始杀马充饥，将领们来问你：还打不打？"
 hd253.0110.a: "粮尽矣，引兵还。"
 hd253.0110.b: "再撑一时，必有转机。"
 hd253.0120.t: "魏将来降"
 hd253.0120.desc: "[hd253_defector.GetName]在魏军中久不得志，见你兵锋正盛，带着几名亲随来到营门请降。"
 hd253.0120.desc_none: "魏军退去，所争之地尽归于你。营中清点战获，将士们难得有了几分喜色。"
 hd253.0120.a: "以礼相待，收归帐下。"
 hd253.0120.b: "此战得地而还。"

 # 事件：魏吴大事件
 hd253.0200.t: "孙峻设宴"
 hd253.0200.desc: "新城无功而还，朝野怨声四起。你回到建业，武卫将军孙峻请你入宫赴宴。\n\n临出门时，你的衣服无故沾湿，家中的狗也扯住你的衣角不放。"
 hd253.0200.a: "入宫赴宴。"
 hd253.0200.b: "称疾不入。"
 hd253.0300.t: "废立之议"
 hd253.0300.desc: "中书令李丰、太常夏侯玄谋除你的事泄露，你已将二人下狱处死。可天子曹芳与他们本是一伙，宫中仍有人劝他夺你兵权。\n\n叔父司马孚等人都看着你，等你一句话。"
 hd253.0300.a: "废帝为齐王，迎立高贵乡公。"
 hd253.0300.b: "此时废立，恐失人心。"
 hd253.0305.t: "废立之议"
 hd253.0305.desc: "中书令李丰、太常夏侯玄谋除司马师的事泄露了。司马师已把二人下狱，如今又带着太后的诏令入宫，要你退位为齐王，迎立高贵乡公。\n\n殿上甲士林立，近臣们都低着头。"
 hd253.0305.a: "忍辱退位，以保性命。"
 hd253.0305.b: "朕乃天子，岂受此辱！"
 hd253.0310.t: "退居齐王"
 hd253.0310.desc: "司马师以太后之命废你为齐王。你出太极殿时，送行的群臣有人掩面而泣，却没有一人敢上前说话。"
 hd253.0310.a: "（默然登车）"
 hd253.0400.t: "淮南起兵"
 hd253.0400.desc: "司马师擅行废立，你身受先帝厚恩，不能坐视。扬州刺史文钦也愿与你同举大事。\n\n只要矫太后诏传檄四方，淮南诸军便可一齐起兵。"
 hd253.0400.a: "矫太后诏，起兵讨司马。"
 hd253.0400.b: "时机未至，隐忍不发。"
 hd253.0500.t: "诸葛诞起兵"
 hd253.0500.desc: "毌丘俭、夏侯玄、王凌的下场你都看在眼里。如今司马氏又征你入朝为司空，你知道这一去便再回不来了。\n\n你手中有淮南十余万兵，吴国也愿遣兵来援。"
 hd253.0500.a: "敛兵据守，请救于吴。"
 hd253.0500.b: "奉诏入朝。"
 hd253.0505.t: "诸葛诞请援"
 hd253.0505.desc: "魏将[hd253_rebel.GetName]起兵讨司马氏，遣长史来建业，愿以淮南为吴藩屏，只求发兵相救。"
 hd253.0505.a: "发兵相救。"
 hd253.0505.b: "坐观成败。"
 hd253.0600.t: "大将军薨"
 hd253.0600.desc: "司马师病死于许昌军中。他的弟弟司马昭已领兵回到洛阳城外，朝臣们等你下诏，以谁辅政。"
 hd253.0600.a: "以司马昭为大将军，辅政如故。"
 hd253.0600.b: "朕当亲揽朝政。"
 hd253.0610.t: "兄终弟及"
 hd253.0610.desc: "兄长司马师病死于许昌。他手下的兵马、朝中的党羽都在等你一句话。"
 hd253.0610.a: "继兄之任，辅政天子。"
 hd253.0610.b: "辞让不受。"

 # 全局通报
 hd253.0510.t: "姜维围狄道"
 hd253.0510.desc: "汉卫将军[hd_news_a.GetName]出陇右，围攻[hd_news_b.GetName]所守的狄道。"
 hd253.0520.t: "诸葛恪围新城"
 hd253.0520.desc: "吴太傅[hd_news_a.GetName]率大军围攻合肥新城，[hd_news_b.GetName]闭城坚守。"
 hd253.0530.t: "诸葛恪被杀"
 hd253.0530.desc: "吴太傅[hd_news_a.GetName]入宫赴宴，被[hd_news_b.GetName]伏兵斩杀。"
 hd253.0540.t: "司马师废帝"
 hd253.0540.desc: "魏大将军[hd_news_a.GetName]以太后之命废黜天子[hd_news_b.GetName]，另立高贵乡公曹髦。"
 hd253.0550.t: "淮南起兵"
 hd253.0550.desc: "魏镇东将军[hd_news_a.GetName]在淮南起兵，声讨[hd_news_b.GetName]。"
 hd253.0560.t: "诸葛诞起兵"
 hd253.0560.desc: "魏将[hd_news_a.GetName]起兵淮南，与[hd_news_b.GetName]决裂，吴国发兵相援。"

 # 事件：曹髦之死、伐蜀
 hd253.0700.t: "司马昭之心"
 hd253.0700.desc: "司马昭专权日甚，朝中只知有大将军，不知有天子。你召来侍中王沈、尚书王经、散骑常侍王业，说出了那句话：司马昭之心，路人所知也。\n\n王经劝你忍耐。可你已不愿坐等被废。"
 hd253.0700.a: "宁死，不为常道乡公。"
 hd253.0700.b: "且再忍一时。"
 hd253.0705.t: "南阙之变"
 hd253.0705.desc: "天子亲率殿中宿卫、僮仆数百人，拔剑出宫来讨你。中护军贾充领兵在南阙下迎战，太子舍人成济问他该怎么办。\n\n贾充回头看你。"
 hd253.0705.a: "公畜养汝等，正为今日。"
 hd253.0705.b: "擒下天子，不得伤他性命。"
 hd253.0710.t: "灭蜀之议"
 hd253.0710.desc: "蜀中宦官黄皓用事，姜维屯田沓中避祸，汉中诸围空虚。司隶校尉钟会、征西将军邓艾都说时机已到。\n\n朝中仍有人以蜀道艰险相劝。"
 hd253.0710.a: "钟会出骆谷，邓艾趋沓中，分道并进。"
 hd253.0710.b: "蜀道艰险，且缓图之。"
 hd253.0720.t: "成都之降"
 hd253.0720.desc: "魏军已兵临城下。光禄大夫谯周劝你出降，北地王刘谌则哭着请你背城一战，君臣同死社稷。"
 hd253.0720.a: "舆榇出降，以全百姓。"
 hd253.0720.b: "背城一战！"
 hd253.0570.t: "曹髦遇弑"
 hd253.0570.desc: "魏天子[hd_news_b.GetName]亲率宿卫讨伐大将军[hd_news_a.GetName]，在南阙下遇弑。常道乡公曹奂被迎立为帝。"
 hd253.0580.t: "魏伐蜀"
 hd253.0580.desc: "魏发大军伐蜀，钟会、邓艾分道并进，汉帝[hd_news_b.GetName]危在旦夕。"
 hd253.0590.t: "汉帝出降"
 hd253.0590.desc: "汉帝[hd_news_a.GetName]舆榇出降，蜀汉立国四十三年，至此归魏。"
