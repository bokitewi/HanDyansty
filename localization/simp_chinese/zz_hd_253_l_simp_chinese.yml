 # 事件：开局两战
 hd253.0010.t: "出石营"
 hd253.0010.desc: "军士从石营前走过，兵刃在晨光里一闪一闪。我站在道旁，望着队伍翻越山道，许久才将目光收回。费祎的丧事过去不久，如今再没有那位总劝我少发兵、慎用国力的人，替我将这支军队按在汉中。\n\n洮西是此次进兵的方向。诸将报过道路与粮运，营前又有人送来羌胡部众的消息，愿与我方往来。我记得丞相当年筹划陇右时的言语，却也知道，这一次须用我自己的号令把人带过去。前队已经出发，身后的将士仍在等候。今日踏上这条路，就得由我亲自带他们走完，不能再只说是在继承丞相的遗志。"
 hd253.0010.a: "丞相之志，当自我继之。"
 hd253.0020.t: "围新城"
 hd253.0020.desc: "城上的守军没有因营外的鼓声而退去。我望着合肥新城的墙垣，听诸将报来各营的位置，叫他们先将围守、转运与攻城所需逐一说清。东兴以来的称贺还在耳边，今日却没有哪一句赞誉能替军士越过城壕。\n\n出兵之前，朝中不肯赞同的人不少；如今吴军已经在此，等待的也不再是一次可以随意收回的议论。张特守城的虚实，尚须继续探查，我不能因为自己带来的兵多，便将这座城看作已在掌中。城外各营的旗帜次第立起，我叫报事的人靠近。要让众人相信此行值得，先须把眼前的仗打下去。"
 hd253.0020.a: "破此城，淮南可定。"

 # 事件：北伐
 hd253.0100.t: "羌胡来附"
 hd253.0100.desc: "部落首领带来的骑手停在营前，不急着下马。领头的人上前行礼，说听闻我军在陇右用兵，愿带部众助战；谈到出多少人时，他却又提起赏赐，言语比方才谨慎了许多。\n\n我让他把所求说完。这些人熟悉山川道路，也能在我军之外添一股骑兵；只是他们随首领而来，未必肯照军中的每一道号令行事。身边将领各有意见，有人要借其声势，有人怕赏赐一开口便难收住。我看向营前那些等候的马匹。要留下他们，须今日便付出代价；若不愿借助他们，也只能让他们带着原来的部众回去。"
 hd253.0100.a: "厚加赏赐，借其骑兵。"
 hd253.0100.b: "胡骑难制，不必用之。"
 hd253.0110.t: "粮尽"
 hd253.0110.desc: "管粮的人把存粮的数目报了两遍，还是凑不够下一程的用度。出征已有八个月，后方送来的粮食赶不上前军消耗，营里今日少发的那一份，已经不能再称作暂时节用。\n\n将领们起初还在争论如何进兵，听到下一批粮车没有确切归期，便一个个停了下来。退兵能保住眼前的人马，也意味着这次争夺须到此为止；继续留在这里，则要让全军陪我承受粮秣不继的困顿。我叫他们将尚能支撑的日数再报一遍，没有人敢把话说满。敌军不会为此让出城邑，士卒却不能靠号令充饥。今日该发的是退军令，还是继续坚持的军令？"
 hd253.0110.a: "粮尽矣，引兵还。"
 hd253.0110.b: "再撑一时，必有转机。"
 hd253.0120.t: "魏将来降"
 hd253.0120.desc: "[hd253_defector.GetName]在营门交出兵器，才被带到我面前。衣上还有行路留下的尘土，几名随从站在外面，始终不敢向前。此人说在魏军中难获用任，如今见我军得胜，愿来帐下效力。\n\n我没有急着问忠心，只先问所知的道路、守备与军中旧事。有些回答很快，有些仍留着余地；一个刚刚离开旧主的人，未必能立刻把所有顾虑都说出来。但若来降者只得到猜忌，今后营门之外也不会再有人敢上前。我看着放在一旁的兵器，叫左右备下座位。如何让这份归附有个落脚处，是我此刻要作的事。"
 hd253.0120.desc_none: "清点战获的人进来时，嘴角仍压不住笑意。我让他慢些说，先把已经接管的城邑与尚未归队的将士报清。魏军退去，所争之地已经得手，营中许多人终于敢将悬着的一口气放下来。\n\n我走到外面，听见军士谈起沿途的劳苦，也谈起回去后能否见到家人。胜利落在他们嘴里，比军报上的几行字更实在；可新得的土地仍须守备，粮路也须重新接好，不能因为赢了一阵便任各营散去。跟随我打到这里的将士，都该得到应有的犒赏。我叫人将获胜的消息传下去，也将下一步收整的命令一并传开。"
 hd253.0120.a: "以礼相待，收归帐下。"
 hd253.0120.b: "此战得地而还。"

 # 事件：魏吴大事件
 hd253.0200.t: "孙峻设宴"
 hd253.0200.desc: "孙峻送来的请帖摆在我面前，约我入宫赴宴。我看过赴席的时辰，外面恰有人提起新城一役留下的怨言：征发的人多，久在军中的人疲惫，回到建业后，许多话便不再像东兴报捷时那样好听。\n\n临出门时，家犬扯住了我的衣角，侍者上前驱赶，它却仍不肯松口。我低头看着那片被拉皱的衣料，忽然不愿立刻迈过门槛。这只是寻常惊扰，还是我自己已对这场宴席有所疑虑？孙峻的来人仍在等候，赴宴意味着照旧示人以无惧，称疾推却又会让宫中添出新的猜测。今日这一席，该不该去？"
 hd253.0200.a: "入宫赴宴。"
 hd253.0200.b: "称疾不入。"
 hd253.0300.t: "废立之议"
 hd253.0300.desc: "谋议的供述又被送到近前，李丰、夏侯玄的名字赫然在其中。案中的话将曹芳也牵涉进来，左右请我决断，却没有人愿意先把“废帝”二字说出口。\n\n我看着那份供述，知道事到此处，已不只是处置几个近臣。天子仍在宫中，想收回兵权的人也不会因为一次查问便消失；可若改换帝位，天下人看到的，将是司马氏亲手决定曹氏的君主。有人请依太后之命迎立高贵乡公，也有人劝我留心人望。我让他们住口，将拟好的命令放在一旁。是以废立保住大权，还是暂且按住此事，众人都在等我的一句话。"
 hd253.0300.a: "废帝为齐王，迎立高贵乡公。"
 hd253.0300.b: "此时废立，恐失人心。"
 hd253.0305.t: "废立之议"
 hd253.0305.desc: "殿上的甲士没有退去。来人捧着太后的诏令，宣读废我为齐王、迎立高贵乡公的文字，读到我的名号时，声音反倒比方才更响。李丰、夏侯玄之事已被司马师拿来问罪，如今他要收去的，不只是几个近臣的位置。\n\n我看向身边的人，却只见他们低下头，避开了我的目光。御座仍在身后，诏令却已把我写成将要离开此处的人。忍下这场羞辱，或许还能保住性命；当殿拒绝，至少能让他们知道我不曾甘心。持诏的人停下来，等我答复。天子的最后一句话，究竟该用来顺从，还是用来抵抗？"
 hd253.0305.a: "忍辱退位，以保性命。"
 hd253.0305.b: "朕乃天子，岂受此辱！"
 hd253.0310.t: "退居齐王"
 hd253.0310.desc: "登车的踏板已经放好，我却在殿前停了一会儿。随行的人低声请我起行，口中用的是齐王的称呼；方才还属于我的仪仗与卫士，如今都留在身后，不再随着这辆车走。\n\n司马师奉太后之命废我的文辞，已经听过了，无须再由任何人解释。送行的群臣站在不远处，有人举袖遮面，有人始终望着地面，没有谁敢跨过这段空地走到我身边。我将手放在车边，想说几句话，最后却只听见车夫整顿缰绳的声音。那些曾经每日称万岁的人仍在那里，他们再开口时，却只能称我齐王了。该上车了。"
 hd253.0310.a: "（默然登车）"
 hd253.0400.t: "淮南起兵"
 hd253.0400.desc: "起兵的檄文摆在我手边，太后的名义写在最前。主张举兵的人指着这一行，说只要传到四方，淮南的兵众便有了声讨司马氏的名分。我听他读完，问的却是各营有多少人肯立即跟随。\n\n曹氏对我的知遇，我不能忘；朝中的废立与大将军的权势，也让我日夜难安。可矫诏一旦传出，便没有事后再称误会的余地，自己的身家与跟随者的性命，都要系在这道檄文上。有人已经准备派使者出门，我让他先候着。是将积在心里的不平变成兵马，还是继续把它压住，今日总须给众人一个答复。"
 hd253.0400.a: "矫太后诏，起兵讨司马。"
 hd253.0400.b: "时机未至，隐忍不发。"
 hd253.0500.t: "诸葛诞起兵"
 hd253.0500.desc: "征我入朝的诏书读完，近前的人仍没有退去。司空的名位看似尊贵，离开淮南以后，我还能不能再掌握眼前这些兵众，却没有写在诏中。左右劝我早作准备，有人请备行装，也有人只问城中尚有多少粮食。\n\n我将诏书卷起，听见厅外军士换守的脚步。手中的兵马足以据城，却未必足以独自承受司马氏的攻势；若向吴国求援，也须先把自己送到公开决裂的地步，才能等来对方的答复。这份任命已经把进退摆到面前。是聚兵固守，遣使求救，还是暂且忍下此诏，不在今日发动？"
 hd253.0500.a: "敛兵据守，请救于吴。"
 hd253.0500.b: "隐忍不发"
 hd253.0505.t: "诸葛诞请援"
 hd253.0505.desc: "使者解开裹在衣中的书信，举过头顶，请我发兵救援寿春。[hd253_rebel.GetName]已经与司马氏决裂，愿奉吴国为援，把淮南变成牵制北军的一道屏障。说到城中待援的兵众，他的声音比方才更急。\n\n我让他先起来。魏人自相攻伐，确是我方可以利用的机会；可派去的终究是吴国将士，越过边界以后，便要同对方共担这场战事。若袖手观望，或许能省下兵粮，也可能坐失在淮南立足的良机。使者仍不肯退去，只说城中正在等我的回音。该让他带着援军的承诺回去，还是让他独自返回？"
 hd253.0505.a: "发兵相救。"
 hd253.0505.b: "坐观成败。"
 hd253.0600.t: "大将军薨"
 hd253.0600.desc: "司马师的死讯送进宫中，殿上竟没有几个人敢先说话。我问朝廷该由谁接掌辅政，众人便纷纷提起司马昭，仿佛这道诏令只剩落笔这一件事。\n\n据报，司马昭已率军回到洛阳附近。兄长留下的兵权与故吏，不会因为一场丧事便各自散去；但大将军既死，朝政也并非一定要照旧交给他的弟弟。我看着尚未写定的任命，听群臣称说安定人心、不可骤改。究竟是安谁的心，他们不曾明言。若要亲自执掌政事，此刻便须由我说出那句与他们期待不同的话。"
 hd253.0600.a: "以司马昭为大将军，辅政如故。"
 hd253.0600.b: "朕当亲揽朝政。"
 hd253.0610.t: "兄终弟及"
 hd253.0610.desc: "兄长的遗物还没有收拾完，军中的将领便来问今后的号令。有人称我将军，有人只低声请示，朝中各处送来的消息也接连到了，都说大局不可无人主持。\n\n我认得他们迫切的神情。他们所保住的官位、兵众与身家，都系在司马氏继续掌权这件事上；而兄长留下的位置，如今正被他们一起推到我面前。接受，便要将这份权势与随之而来的怨恨一并担起；推辞，也不会使这些人的期待就此消失。我叫近前的人暂且住口，望了一眼尚未撤去的丧帷。今天该以什么身份走出去，须由我自己决定。"
 hd253.0610.a: "继兄之任，辅政天子。"
 hd253.0610.b: "辞让不受。"

 # 全局通报
 hd253.0510.t: "姜维出洮西"
 hd253.0510.desc: "陇右又响起了征战的鼓声。汉卫将军[hd_news_a.GetName]出兵，进逼[hd_news_b.GetName]所守的洮西；洮水两岸烽燧一举，原先往来于两边的人，也不得不停下脚步。\n\n我听到洮西这个名字，想到的却不只是一郡之地。关陇的道路将蜀军、魏军与羌胡诸部牵在一起：有人靠它运粮，有人靠它行商，也有人等着看谁能留下，才决定向谁交出自己的骑兵。如今两军已在洮水之畔相持，那些平日可以含糊应付的归属，也被兵锋逼得清楚起来。有人只把这当作又一次北伐，可对沿途那些人而言，今日还能回到哪一边的家，已经是切身之事。"
 hd253.0520.t: "诸葛恪围新城"
 hd253.0520.desc: "合肥新城之外，吴太傅[hd_news_a.GetName]的大军已经合围，[hd_news_b.GetName]仍闭城坚守。城里城外的人隔着壕堑相望，同样盼着这一仗早些结束，却各自等待着截然不同的结果。\n\n东兴的大捷，曾让人相信吴军足以再向前一步；如今一座城墙横在前面，声望也须由城下的将士去兑现。我听人说起此战，有人只数两边兵众多少，有人却先问，被征走的家人什么时候能回来。朝堂上的胜负之议，到了他们口中，只剩一个迟迟没有定日的归期。新城的城门还未打开，这支庞大军队所承受的，不只是守军从墙头射下来的箭。"
 hd253.0530.t: "诸葛恪被杀"
 hd253.0530.desc: "一场宫中的宴席，竟以拔刀杀人告终。吴太傅[hd_news_a.GetName]入宫赴宴，被[hd_news_b.GetName]伏兵斩杀；新城归来后的怨言，终于酿成了这场宫中的杀戮。\n\n“赴宴”二字，此刻听来竟比阵上的死讯更刺耳。受邀者本该卸下戒备，与主人共坐一席；如今侍酒的门内也可能藏着甲士，笑语与礼让都不能再使人安心。昨日还要仰太傅鼻息的人，今日便须寻别的依靠，昨日同他往来的亲故，也会重新掂量自己的处境。建业的大权已经换手，留下的却不只是一处空出来的位置。下一次入宫赴宴，谁还能放心？"
 hd253.0540.t: "司马师废帝"
 hd253.0540.desc: "齐王的称呼取代了天子的名号。魏大将军[hd_news_a.GetName]奉太后之命，废黜[hd_news_b.GetName]，另迎高贵乡公曹髦即位。诏令中仍满是宗庙与社稷，可御座上的人已经换了。\n\n人们说起旧帝，忽然不知该用从前的敬称，还是照新诏称王；这个细小的迟疑，比废立的文辞更显出眼前的变化。曹氏的君主能被一纸命令送下御座，掌兵的大将军却仍留在原处。有人将这一切说成奉诏行事，有人缄口不言。此后再听见臣子称说忠于天子，我便不能不想到：他们愿意忠于的，究竟是这个人，还是别人随时可以更换的名位？"
 hd253.0550.t: "淮南起兵"
 hd253.0550.desc: "淮南传出了公开讨伐的檄文。魏镇东将军[hd_news_a.GetName]举兵，声讨[hd_news_b.GetName]；原在同一方号令之下的兵马，如今将刀兵转向了彼此。\n\n这份檄文所争的，并非寻常一城一地。起兵者把朝廷的名分写在自己一边，对手却仍握着足以命人讨逆的权势。有人称“义兵”，也有人说“叛军”，同一支军队，竟只须换两个字，便有了全然不同的罪与功。淮南的军士可以随着主将走，沿途郡县却不能永远含糊：开门放行，便是接纳；闭门相拒，便是敌手。往日的同僚递来书信，也不再只是叙旧：他们要问的，是这一回究竟站在哪一边。"
 hd253.0560.t: "诸葛诞起兵"
 hd253.0560.desc: "[hd_news_a.GetName]在淮南起兵，与[hd_news_b.GetName]决裂，又遣使向吴国求援。寿春的城门挡着北来的兵锋，求救的书信却越过了曾经相拒的边界。\n\n从前以御吴为任的魏将，如今愿借吴兵保住自己的城池，这番转折使人再难只凭旧日名号区分敌友。那些在两国交战中失去亲人的人，听见“援军”时，未必能够立刻忘记这些兵马从何处来。吴国可以借此牵制司马氏，淮南也可能因此多一线生机，但遣去使者，还不等于援军已经启程。旧日守在边境两侧的将士，往后或许要在同一座城下相见；使者先行，城中的人仍在等吴国答复。"

 # 事件：曹髦之死、伐蜀
 hd253.0700.t: "司马昭之心"
 hd253.0700.desc: "“司马昭之心，路人所知也。”话出口后，殿中安静得能听见衣袖擦过坐席。我望向召来的近臣，终于不愿再把那个人的权势当作不可提及的事情。王经伏地劝阻，反复说兵力悬殊，请我再忍。\n\n我知道他怕的是什么。禁中的卫士未必肯随我，宫门之外更都是大将军的人；可一日日坐在这里，等候别人决定我的名位，又与已经被废有何分别？我握住身侧的剑，没有立刻起身。若今日走出宫门，未必还能回来；若再坐下去，这句天子之言，也可能永远只剩眼前几人听见。"
 hd253.0700.a: "宁死，不为常道乡公。"
 hd253.0700.b: "且再忍一时。"
 hd253.0705.t: "南阙之变"
 hd253.0705.desc: "报信的人说，天子已经拔剑出宫，带着宿卫与僮仆向南阙而来。我问他有多少人，他答得慌乱，又说迎面的兵士因看见御前的仪仗，一时不敢上前。\n\n贾充正在拦截，成济却仍在等一个能够承担后果的号令。传来的话停在这里，屋中几人都看向我。平日里替我守卫的刀兵，如今与天子的车驾正对在一处；让他们退，眼前的大权便未必守得住，让他们向前，所触犯的也绝不是一位寻常敌手。我把天子拔剑的经过又问了一遍，知道南阙下的人，已经没有多少工夫等我再想。"
 hd253.0705.a: "公畜养汝等，正为今日。"
 hd253.0705.b: "擒下天子，不得伤他性命。"
 hd253.0710.t: "灭蜀之议"
 hd253.0710.desc: "说到蜀中的守备，军议渐渐分成了两派。主战者指着汉中诸道，称姜维远驻沓中，成都朝政也多牵制；反对者却追问，山谷一旦断粮，数万将士又该如何退回。\n\n我听完各路进兵的筹划，没有让任何一方先散去。蜀地纵有内患，也不会因此少一重山险；可若只因前人屡次受阻，便永远不肯再试，这场伐蜀之议便又要搁下。我用手指循过图上的道路，分别问清粮运与接应。是让诸军分道入蜀，还是将此议暂缓，等候另一个机会，此刻便要定下来。"
 hd253.0710.a: "钟会出骆谷，邓艾趋沓中，分道并进。"
 hd253.0710.b: "蜀道艰险，且缓图之。"
 hd253.0720.t: "成都之降"
 hd253.0720.desc: "谯周把出降的利害说完，殿中便响起了哭声。有人请我保全成都的百姓，也有人坚持还可据城一战；那些熟悉的面孔此刻分在两边，却都把最后的答复留给了我。\n\n战败的消息已无法遮掩，城外的魏军也不会因为争论而退去。我看着近前摆着的印绶，想起这些年一道道从北方送来的军报。先帝交下的国统，终究走到了要由我亲口说出降或不降的地步。坚持守城会死伤多少人，出降又要承受怎样的羞辱，没有人能替我掂量。殿外有人再来催问，我示意他先候着，让众人听我的决定。"
 hd253.0720.a: "舆榇出降，以全百姓。"
 hd253.0720.b: "背城一战！"
 hd253.0570.t: "南阙之变"
 hd253.0570.desc: "魏天子[hd_news_b.GetName]亲率宿卫出宫，讨伐大将军[hd_news_a.GetName]，南阙下终于响起了宫中本不该有的兵刃声。此事传开，朝臣们谈到天子与大将军时，再难像从前那样从容。\n\n天子拔剑走出宫门这件事，使我久久不能释怀。诏令不能替他取回权柄，御座不能替他拦住军队，连宿卫也被带上了与大将军相争的道路。有人急着打听宫中的号令，有人仍停在南阙那一刻，不肯接下去。庙堂之间本可争论、可进谏、可退让的事情，如今竟要由兵刃作答。往后臣子再称说君臣之分，那道宫门前发生过的冲突，便不会轻易从人们心中消失。"
 hd253.0580.t: "魏伐蜀"
 hd253.0580.desc: "魏国的伐蜀大军已经进山，钟会、邓艾分道并进，汉帝[hd_news_b.GetName]所统的蜀地正承受这场攻势。骆谷、沓中这些往日只见于军报的地名，如今一道道连到了成都。\n\n先前谈起蜀地，人们总会说山川险阻，说外来的军队难以深入；可险阻护住城邑，也把各处守军隔在不同的谷道之中。一条道路失守，别处未必来得及援救。分道进军的消息越过山川，蜀中的人们也在等着北方的回音：一道守备能否顶住，可能就决定下一道关口要面对多少兵马。此次进兵所争的，已不只是边郡得失，而是成都的朝廷还能不能守住自己的国统。"
 hd253.0590.t: "汉帝出降"
 hd253.0590.desc: "棺木与印绶一同被带到了降礼之中。汉帝[hd_news_a.GetName]舆榇出降，蜀汉不再以独立之国与魏相抗；成都城中的官吏，如今也须听从魏廷的号令。\n\n我想到蜀中那些曾经送父兄北行的人。有人盼着从此不再征战，有人却会看着空下来的衣物，问多年付出的性命究竟换来了什么。兴复汉室的旗号曾使许多人相聚，如今还活着的人，终究要在降后的州郡里继续过日子。出降保住了谁，又辜负了谁，不会只有一种说法。只是棺木已被抬出，印绶已被交下；此后送往成都的文书，不会再是请蜀汉天子裁决的奏章了。"
