 # 来源：localization/simp_chinese/WJ_kaoke_duties_l_simp_chinese.yml
 wj_kaoke_duties_boundaries_modifier:0 "田界清明"
 wj_kaoke_duties_boundaries_modifier_desc:0 "旧券与田界得到公正核定，乡民重新相信官府能够主持公道。"
 wj_kaoke_duties_exactions_modifier:0 "苛敛伤民"
 wj_kaoke_duties_exactions_modifier_desc:0 "官府借税粮、田讼或差役牟利，使乡民对官府心生怨怼。"
 wj_kaoke_duties_post_roads_modifier:0 "驿役有序"
 wj_kaoke_duties_post_roads_modifier_desc:0 "接运与差役安排得宜，传舍得以周转，农户也保住了耕作时日。"
 wj_kaoke_duties_relief_modifier:0 "核灾赈户"
 wj_kaoke_duties_relief_modifier_desc:0 "地方官核实灾情，使灾户免于额外摊派，乡里得以安心耕作。"

 # 来源：localization/simp_chinese/WJ_kaoke_l_simp_chinese.yml
 WJ_kaoke_bad_modifier:0 "考课劣等"
 WJ_kaoke_bad_modifier_desc:0 "考簿所载，失多于得。有司削其俸给，令其整饬吏治。"
 WJ_kaoke_poor_modifier:0 "考课差等"
 WJ_kaoke_poor_modifier_desc:0 "有司责其治事未周，暂抑贤望与俸给，以观后效。"

