l_simp_chinese:
 han_artifact_sunzi_bingfa_name:0 "《孙子兵法》善本"
 han_artifact_sunzi_bingfa_description:0 "孙武所传兵法十三篇，言简而意深，自春秋以来，为将者无不诵习。这部善本简册齐整，丝绳编联，久藏秘阁，字迹犹新。"
 han_artifact_liutao_name:0 "《六韬》秘本"
 han_artifact_liutao_description:0 "相传为太公望所著，以文、武、龙、虎、豹、犬六韬论治国用兵之道。兵家世代传抄，奉为太公遗法，临阵决机，皆可师法。"
 han_artifact_sanlue_name:0 "《三略》秘本"
 han_artifact_sanlue_description:0 "相传黄石公于圯上授书张良，所授便是这三略。书中杂采诸家之言，专论将略与治国之要；其来历虽不可尽考，其法却确乎可用。"
 han_artifact_simafa_name:0 "《司马法》古本"
 han_artifact_simafa_description:0 "司马穰苴所传的古兵法，篇章虽已亡佚过半，犹存三代军礼古义。为将者读之，可知古人以仁为本、以义行师之道。"
 han_artifact_wuzi_name:0 "《吴子》古本"
 han_artifact_wuzi_description:0 "吴起与魏文侯论兵之言，主张内修文德、外治武备。选将练兵、严明军法，多以此书为范。"
 han_artifact_sunbin_bingfa_name:0 "《孙膑兵法》残卷"
 han_artifact_sunbin_bingfa_description:0 "孙膑遗著，久已散佚，这部残卷自古冢旧藏中重见天日。断简残编之间，围魏救赵、减灶诱敌的奇谋犹依稀可辨；只是编绳朽坏，简上墨迹日浅，再不整理，恐将化为尘土。"
 han_artifact_weiliaozi_name:0 "《尉缭子》校本"
 han_artifact_weiliaozi_description:0 "尉缭论兵刑政令之书。官修简册之上，前人以朱笔勘定文字，校记俨然。治军者读之，可知令行禁止、明法审令之要。"
 han_artifact_mengde_xinshu_name:0 "《孟德新书》"
 han_artifact_mengde_xinshu_description:0 "曹操集诸家兵法，参以平生用兵所得，撰为此书。简册之上时见朱批，字字皆从战阵中来。"
 han_artifact_bingfa_24_name:0 "《兵法二十四篇》"
 han_artifact_bingfa_24_description:0 "诸葛亮总平生用兵之要，著为二十四篇。行军、布阵、治戎之法，乃至八阵之图、木牛流马之制，皆散见篇中。"
 han_artifact_qingnang_shu_name:0 "《青囊书》"
 han_artifact_qingnang_shu_description:0 "华佗毕生医术尽录于此，刳腹湔肠、麻沸散之法俱在卷中。世间传本寥寥，得之者如得神医亲授，能活人所不能救之人。"
 han_artifact_shanghan_zabing_lun_name:0 "《伤寒杂病论》"
 han_artifact_shanghan_zabing_lun_description:0 "张仲景痛宗族多死于疫，乃勤求古训、博采众方而成此书。辨六经，析病机，方证俱备。医家得此一卷，胜得千金。"
 han_artifact_taiping_qingling_dao_name:0 "《太平清领道》"
 han_artifact_taiping_qingling_dao_description:0 "于吉所传道书，以符水治病，教人叩首思过。江东百姓奉之如神，官府却斥其妖妄惑众。是济世之书还是惑众之书，全看落在何人手中。"
 han_artifact_dunjia_tianshu_name:0 "《遁甲天书》"
 han_artifact_dunjia_tianshu_description:0 "方士秘传的奇书，载遁甲术数、推步占验之法。帛卷古旧，相传为山中隐者所授；习之可窥天机一角，也可能招来杀身之祸。"
 han_artifact_taiping_yaoshu_name:0 "《太平要术》"
 han_artifact_taiping_yaoshu_description:0 "相传为南华老仙授予张角的天书三卷，能呼风唤雨，以符水疗疾。张角凭此传道十余年，青、徐、幽、冀、荆、扬、兖、豫八州之人，莫不翕然相从。"
 han_artifact_shanhaijing_name:0 "《山海经》异本"
 han_artifact_shanhaijing_description:0 "记山川草木、异兽神祇的古书。这部异本与秘阁所藏互有出入：校书者可据以考订地理，好事者可据以畅谈奇闻，太史与方士皆视若珍宝。"
 han_artifact_xishu_map_name:0 "西蜀地形图"
 han_artifact_xishu_map_description:0 "益州官府所绘的蜀中山川险易之图，帛上以朱墨标注道路关隘。得之者入蜀如履平地，失之者纵有雄兵，也只能望蜀道而兴叹。帛图年久，墨色渐淡。"
 han_artifact_imperial_seal_name:0 "传国玉玺"
 han_artifact_imperial_seal_description:0 "秦始皇所制的传国之玺，相传以和氏璧琢成，上镌“受命于天，既寿永昌”八字。秦亡汉兴，玺归汉室，历代天子奉若神明。谁执此玺，便似天命所归；玺失其所，则天下共逐之。"
 han_artifact_wang_mang_head_name:0 "王莽头"
 han_artifact_wang_mang_head_description:0 "篡汉者王莽的首级。当年汉兵攻入长安，莽死于渐台，首级传至宛市，百姓争相掷击，甚至有人切而食其舌。其后首级藏于武库，与孔子屐、高祖斩蛇剑同列累代之宝，以示篡逆者的下场。"
 han_artifact_confucius_shoes_name:0 "孔子屐"
 han_artifact_confucius_shoes_description:0 "相传为孔子所着的木屐，圣人遗泽，儒生见之无不肃然。此屐藏于武库，与高祖斩蛇剑、王莽之首同为累代之宝。"
 han_artifact_zhou_ding_name:0 "周鼎"
 han_artifact_zhou_ding_description:0 "周室宗庙重器，饕餮蟠螭纹间隐见铭文，历数百年而威仪不改。鼎在德不在鼎——自古问鼎之轻重者，皆是不臣之辈。得此鼎者，宗庙生辉，宗族亦与有荣焉。"
 han_artifact_heshi_bi_name:0 "和氏璧"
 han_artifact_heshi_bi_description:0 "卞和于荆山得璞，三献楚王，两遭刖足，璞中之玉方得剖出。秦王曾愿以十五城相易，终为蔺相如完璧归赵。世人皆言传国玉玺即以此璧琢成，真伪难考，而天下至宝之名，历久不移。"
 han_artifact_four_spirits_mirror_name:0 "四灵文镜"
 han_artifact_four_spirits_mirror_description:0 "镜背铸青龙、白虎、朱雀、玄武四灵之象，铭带环绕，青铜莹然。时人谓此镜可照见精怪、辟除不祥，婚嫁之家更以为重礼。铜镜日久易生绿锈，须常加磨拭。"
 han_artifact_seismograph_name:0 "地动仪"
 han_artifact_seismograph_description:0 "阳嘉元年，太史令张衡铸成候风地动仪。其器圆腹如酒樽，八龙衔珠，蟾蜍承之，地动则龙口吐珠，以报其方位。曾有一龙吐珠而京师不觉地动，学者皆怪其无征；数日后驿使至，果报陇西地震，众乃叹服其妙。"
 han_artifact_zhinan_che_name:0 "指南车"
 han_artifact_zhinan_che_description:0 "车上木人伸臂指南，无论车行何向、山回路转，其手常指南方。相传黄帝作之以破蚩尤所起的大雾，历代名匠屡欲仿制，成者寥寥。机括精微，最忌风雨侵蚀。"
 han_artifact_white_feather_fan_name:0 "白羽扇"
 han_artifact_white_feather_fan_description:0 "素白羽片、竹木为柄的羽扇，形制古朴。名士清谈、谋臣运筹，常执此扇徐徐挥之，从容自若，仿佛千军万马都在一摇一摆之间。"
 han_artifact_shenshou_inkstone_name:0 "神兽砚"
 han_artifact_shenshou_inkstone_description:0 "兽形石砚，雕刻古拙，墨池深广，研面细腻。尚书台的郎官与文士用它起草诏令、校勘典籍，视为文房珍品，名士之间转相赠答。"
 han_artifact_bianzhong_name:0 "编钟"
 han_artifact_bianzhong_description:0 "木架悬列的成套青铜编钟，大小相次，宫商角徵羽依律而铸。宗庙祭祀、宫廷宴乐皆不可缺，钟声一响，礼乐自兴。乱世之中极易拆散流落，成套者尤为难得。"
 han_artifact_tongque_name:0 "铜雀"
 han_artifact_tongque_description:0 "邺城铜雀台上的铜雀，昂首振翅，若欲凌空飞去，锈色斑驳而气象雄浑。曹操筑台于漳水之滨，登临赋诗，以彰天下归心之志。"
 han_artifact_bronze_chariot_name:0 "铜马车"
 han_artifact_bronze_chariot_description:0 "依汉家车马制度铸成的小样铜车马，舆服轮辕，莫不合度。公卿列侯陈之于府第，以彰朝廷仪制之尊；亦有巧匠铸以献遗权贵，或随主人入于大墓。"
 han_artifact_boshanlu_name:0 "错金博山炉"
 han_artifact_boshanlu_description:0 "炉盖铸作海上仙山之形，错金为纹，峰峦叠嶂，烟孔隐布其间。焚香之时，青烟自山间袅袅升起，如云雾缭绕峰峦，满室若有仙气。宴饮雅集，以此炉为上品。"
 han_artifact_changxin_lamp_name:0 "长信宫灯"
 han_artifact_changxin_lamp_description:0 "西京长信宫旧藏的鎏金铜灯，宫女跪坐执灯，灯烟尽入袖中而不散于室，其巧思令人叹服。旧宫尘封多年，拂去浮尘，犹见当年宫闱气象。"
 han_artifact_crane_feather_fan_name:0 "鹤羽扇"
 han_artifact_crane_feather_fan_description:0 "以灰白鹤羽制成的长柄羽扇，较白羽扇更显凝练沉稳，非运筹帷幄之士不能相称。临阵徐徐挥之，号令三军如臂使指。"
