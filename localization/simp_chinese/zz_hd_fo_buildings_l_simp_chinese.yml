 building_hd_fo_guoqingsi_lv1:0 "国清寺"
 building_hd_fo_guoqingsi_lv1_desc:0 "智顗入天台山修禅，遗愿立寺。隋晋王杨广依其所画图样营建，初名天台寺，后改国清，天台宗由此为根本道场。"
