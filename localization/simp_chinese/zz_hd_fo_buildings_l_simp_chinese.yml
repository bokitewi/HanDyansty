 building_hd_fo_xiaoyaoyuan_lv1:0 "逍遥园"
 building_hd_fo_xiaoyaoyuan_lv1_desc:0 "后秦姚兴迎鸠摩罗什入长安，处之逍遥园西明阁，集义学沙门八百余人共译经论。后世于其地立草堂寺。"
