 building_hd_fo_mogaoku_lv1:0 "莫高窟"
 building_hd_fo_mogaoku_lv1_desc:0 "前秦建元二年，沙门乐僔行至敦煌三危山，忽见金光如千佛，遂于鸣沙山崖开凿第一窟。此后历代相继，窟龛日增。"
