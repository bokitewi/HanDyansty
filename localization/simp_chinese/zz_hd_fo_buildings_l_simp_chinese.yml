 building_hd_fo_jianchusi_lv1:0 "建初寺"
 building_hd_fo_jianchusi_lv1_desc:0 "赤乌十年，康僧会至建业，设像行道。孙权疑之，僧会誓求舍利，三七日乃得，五色光炎照耀瓶上。权大叹服，为之建塔，号建初寺，江南有寺自此始。"
