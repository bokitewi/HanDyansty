 building_hd_fo_donglinsi_lv1:0 "东林寺"
 building_hd_fo_donglinsi_lv1_desc:0 "慧远入庐山，江州刺史桓伊为之立寺于山东，号东林。慧远居此三十余年，影不出山，迹不入俗，与刘遗民等百二十三人结白莲社，誓往西方。"
