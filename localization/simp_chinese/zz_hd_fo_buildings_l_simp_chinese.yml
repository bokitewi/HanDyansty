 building_hd_fo_futuci_lv1:0 "浮屠祠"
 building_hd_fo_futuci_lv1_desc:0 "汉末笮融督广陵、彭城运漕，于下邳大起浮屠祠，以铜为人，黄金涂身，堂阁可容三千余人。每浴佛，布席于路数十里，来观及就食者且万人。"
