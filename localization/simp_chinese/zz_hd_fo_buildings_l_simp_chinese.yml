 building_hd_fo_yongningsi_lv1:0 "永宁寺"
 building_hd_fo_yongningsi_lv1_desc:0 "北魏胡太后所立，中有九层浮图，举高九十丈，去京师百里已遥见之。寺中僧房楼观一千余间，京师寺塔之冠。"
