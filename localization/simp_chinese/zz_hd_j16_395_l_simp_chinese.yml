l_simp_chinese:
 # 两晋十六国统一史实线 395 节南线（6-S）：事件 hd_j16.5245–5360、修正、封号、休战名、事件兵名

 hd_j16.5245.t:0 "录尚书事"
 hd_j16.5245.desc:0 "王谧故去，尚书省的印信空了出来。[hd_j16_ev_liu.GetName]自京口起兵、复晋于江陵，朝中大半的军将本是他的旧部，扬州的租调也要经他的手才能到建康。有人劝陛下早下诏书，请他入朝录尚书事；也有人低声说，权柄一旦交出去，就再难收回。\n\n诏书已经拟好，只差用印。"
 hd_j16.5245.a:0 "征其入朝，委以朝政"
 hd_j16.5245.b:0 "朝政仍由朕自理"

 hd_j16.5246.t:0 "刘裕录尚书事"
 hd_j16.5246.desc:0 "[hd_news_a.GetName]奉诏入朝，录尚书事，领扬州刺史。自此建康的诏令出于其府，北府旧将分守要镇，晋室的兵权与政柄都落在了这位京口起家的将军手中。"

 hd_j16.5253.t:0 "请镇方面"
 hd_j16.5253.desc:0 "[hd_j16_cz_who.GetName]上表，请出镇[hd_j16_cz_duchy.GetName]。桓氏余众尚在江汉之间流窜，上游诸郡久无可靠的守将；京口起兵的旧人若能分守要地，建康便多一重屏障。可方镇一旦交出去，日后能否调得回来，也是要掂量的事。"
 hd_j16.5253.a:0 "准其所请"
 hd_j16.5253.b:0 "暂且不许"

 hd_j16.5261.t:0 "岭南之事"
 hd_j16.5261.desc:0 "[hd_j16_ev_lu.GetName]据番禺已逾一年，遣使奉表，自称愿为晋臣。朝廷新经桓玄之乱，兵力疲惫，江陵、寻阳都还要人守；若此时远征岭南，只怕顾此失彼。可受了他的贡物，就等于默认南海诸郡归他所有。"
 hd_j16.5261.a:0 "授以广州刺史，暂安岭南"
 hd_j16.5261.b:0 "名为晋臣，实为孙恩余党，当发兵讨之"

 hd_j16.5262.t:0 "朝廷的诏书"
 hd_j16.5262.desc:0 "建康的使者到了番禺，带来诏书：授我广州刺史、平南将军。诏书写得客气，字里行间却看得出，朝廷是无力南顾才出此下策。道覆劝我先受了这道诏书，休养兵马，等待时机；也有人说，向晋廷俯首，便负了当年海上起事的初心。"
 hd_j16.5262.a:0 "受命，且养兵岭南"
 hd_j16.5262.b:0 "不受晋廷的官爵"

 hd_j16.5263.t:0 "卢循受广州刺史"
 hd_j16.5263.desc:0 "晋廷授[hd_news_a.GetName]广州刺史。番禺一带名义上又归了晋朝版图，但岭南的兵马、钱粮仍由卢循自己调度，朝廷派去的人只能在城外驿馆里等候回音。"

 hd_j16.5270.t:0 "广固陷落"
 hd_j16.5270.desc:0 "晋军围广固数月，城中粮尽，终于攻破。南燕之主被俘送建康，青州诸郡尽归晋土。[hd_news_a.GetName]的威名，自此震动河北。"

 hd_j16.5300.t:0 "北上之机"
 hd_j16.5300.desc:0 "探子从北边回来，说刘裕的大军尽在青州，围着广固不肯撤；建康城中留守的兵马不过数千。道覆连夜赶来，劝我趁此顺流而下：始兴的船已经造好，豫章、寻阳一带也未必能挡。若错过这一回，等刘裕班师，岭南便只能坐守了。"
 hd_j16.5300.a:0 "顺流北上，直取建康"
 hd_j16.5300.b:0 "保据岭南，不轻举妄动"

 hd_j16.5301.t:0 "卢循北上"
 hd_j16.5301.desc:0 "[hd_news_a.GetName]与徐道覆自岭南起兵，舟师顺赣水而下，直指江州。晋廷闻报大震，刘裕正在青州，留守的将领只能各自据城固守。"

 hd_j16.5302.t:0 "卢循退还寻阳"
 hd_j16.5302.desc:0 "[hd_news_a.GetName]的舟师终究没能攻下建康。刘裕自北方星夜赶回，守住了石头城；卢循犹豫不进，粮尽之后退还寻阳，军中已有离散之象。"

 hd_j16.5305.t:0 "浮海袭番禺"
 hd_j16.5305.desc:0 "卢循的主力还在江州与我相持，番禺却只留下老弱守城。孙处请领一支水军，从海道直趋广州，抄其后路。海上风涛难测，这支兵若一去不返，便是白白折损；可若成了，卢循便无家可归。"
 hd_j16.5305.a:0 "遣孙处浮海南下"
 hd_j16.5305.b:0 "海路太险，不遣"

 hd_j16.5306.t:0 "番禺克复"
 hd_j16.5306.desc:0 "晋军浮海突至，攻破番禺。卢循回救不及，部众离散，岭南诸郡相继归晋。[hd_news_a.GetName]一举荡平了孙恩、卢循两代经营的海上之乱。"

 hd_j16.5310.t:0 "刘毅求荆州"
 hd_j16.5310.desc:0 "[hd_j16_ev_yi.GetName]上表，请以道规病重，代镇荆州。荆州居长江上游，兵强马壮，历来是能与建康分庭抗礼的地方。他与我同起京口，素来不肯居人之下；把江陵交给他，是酬功，也是养虎。"
 hd_j16.5310.a:0 "许之"
 hd_j16.5310.b:0 "荆州不能给他"

 hd_j16.5311.t:0 "求镇荆州"
 hd_j16.5311.desc:0 "道规病重，荆州空虚。江陵居长江上游，若能移镇于此，便不必事事仰人鼻息。京口起兵时我与刘裕并肩，如今他总揽朝政，我却只守着姑孰一隅。这一表上去，朝中人人都会明白我的意思。"
 hd_j16.5311.a:0 "上表求镇荆州"
 hd_j16.5311.a.tt:0 "移镇江陵后，原领的淮南郡将收归朝廷。"
 hd_j16.5311.b:0 "安守本镇"

 hd_j16.5315.t:0 "江陵之变"
 hd_j16.5315.desc:0 "建康来人，说刘裕已经调兵西上，王镇恶的前锋旦夕可至。府中诸人议论纷纷：有人劝我轻舟入朝，当面谢罪，交还荆州，或可保全性命；也有人说，事已至此，退一步便是死地，不如据江陵与他一决。"
 hd_j16.5315.a:0 "入朝谢罪，交还南郡"
 hd_j16.5315.b:0 "据荆州起兵"

 hd_j16.5316.t:0 "刘毅之心"
 hd_j16.5316.desc:0 "[hd_j16_ev_yi.GetName]到了江陵，便大量调换府中僚属，又与朝中的旧人书信往来不绝。王镇恶请以轻兵百舸，诈称刘藩上任，乘其不备袭取江陵。此计若成，一战可定上游；若不成，便是与旧日同袍兵戎相见。"
 hd_j16.5316.a:0 "遣王镇恶袭江陵"
 hd_j16.5316.b:0 "且容他几年"

 hd_j16.5317.t:0 "王镇恶袭江陵"
 hd_j16.5317.desc:0 "王镇恶率百余舟溯江而上，诈称刘藩赴任，直抵江陵城下。刘毅仓促应战，兵溃出走，困于佛寺，自缢而死。京口起兵的旧人，从此只剩[hd_news_a.GetName]一人独揽大权。"

 hd_j16.5320.t:0 "伐蜀"
 hd_j16.5320.desc:0 "谯纵据蜀已近十年，又与桓谦、卢循相结，屡扰荆州。如今江南已定，正可西向。朱龄石资望尚浅，却沉稳多谋；若由我亲征，固然声势更盛，可建康又不能久离。"
 hd_j16.5320.a:0 "遣朱龄石为帅"
 hd_j16.5320.b:0 "亲率大军入蜀"

 hd_j16.5321.t:0 "平蜀"
 hd_j16.5321.desc:0 "晋军自外水直趋成都，谯纵弃城出走，自缢于涪城。蜀地复归晋土，[hd_news_a.GetName]的版图西抵岷山。"

 hd_j16.5325.t:0 "兵临江陵"
 hd_j16.5325.desc:0 "[hd_j16_ev_liu.GetName]的檄文已到：说我在荆州收买人心，图谋不轨。他的大军随后便到，雍州的鲁宗之虽愿与我同进退，兵力却远不能相敌。司马氏的宗室，如今连守一个荆州都难了。"
 hd_j16.5325.a:0 "弃江陵，北投他国"
 hd_j16.5325.b:0 "据荆州起兵相抗"

 hd_j16.5326.t:0 "讨司马休之"
 hd_j16.5326.desc:0 "[hd_j16_ev_xz.GetName]在荆州深得人心，又与雍州的鲁宗之往来甚密。宗室出镇上游，本是朝廷的屏藩，可若他不能为我所用，便是卧榻之侧的隐患。"
 hd_j16.5326.a:0 "发兵讨之"
 hd_j16.5326.b:0 "宗室之亲，不宜相逼"

 hd_j16.5327.t:0 "司马休之出奔"
 hd_j16.5327.desc:0 "[hd_news_a.GetName]兵败于江陵，与子侄出奔北方。荆州易手，晋室宗亲中最后一位能领兵出镇的人，也离开了江南。"

 hd_j16.5329.t:0 "襄阳孤城"
 hd_j16.5329.desc:0 "司马休之已经北走，晋军的前锋不日便到襄阳。我与轨儿守着这座孤城，进不能救江陵，退亦无路可走。北方的秦国，或许还肯收留我们。"
 hd_j16.5329.a:0 "弃襄阳北走"
 hd_j16.5329.b:0 "据襄阳起兵"

 hd_j16.5330.t:0 "克复洛阳"
 hd_j16.5330.desc:0 "晋军前锋入洛阳。百年故都重归晋土，城中父老出迎王师。[hd_news_a.GetName]遣使修谒五陵，置守卫而还。"

 hd_j16.5331.t:0 "后秦亡"
 hd_j16.5331.desc:0 "王镇恶率水军溯渭而上，直抵长安城下。秦主出降，后秦遂亡。自永嘉之乱以来，晋军第一次踏进了关中的旧都。[hd_news_a.GetName]的北伐，至此功成。"

 hd_j16.5335.t:0 "东还之议"
 hd_j16.5335.desc:0 "建康传来噩耗：刘穆之病逝。朝中无人坐镇，我若久留关中，只怕根本之地生变。可长安刚刚到手，关中诸将彼此不和，北边的赫连勃勃又虎视眈眈。留义真在此，他年方十二；我若自己留下，江南便要托付给旁人。"
 hd_j16.5335.a:0 "东还建康，留义真镇关中"
 hd_j16.5335.b:0 "自留长安，经营关中"

 hd_j16.5336.t:0 "刘裕东还"
 hd_j16.5336.desc:0 "[hd_news_a.GetName]闻刘穆之死讯，急还江南，留其子镇守长安，以王修、王镇恶、沈田子等辅佐。关中父老送至灞上，泣请留镇，终不能止。"

 hd_j16.5340.t:0 "九锡之命"
 hd_j16.5340.desc:0 "诏书到了：进我为宋公，加九锡，以彭城为国。这样的诏书，自王莽、曹操以来已有成例，人人都看得出它意味着什么。依故事当先上表辞让，再由朝廷固请；可辞得太久，又怕众心生变。"
 hd_j16.5340.a:0 "三辞而后受之"
 hd_j16.5340.b:0 "坚辞不受，且待来年"

 hd_j16.5341.t:0 "刘裕受九锡"
 hd_j16.5341.desc:0 "晋廷进[hd_news_a.GetName]为宋公，加九锡，以彭城为宋国。百官称贺之余，人人心里明白：晋室的气数，已经不在司马氏手中了。"

 hd_j16.5355.t:0 "进爵为王"
 hd_j16.5355.desc:0 "宋国已建一年，朝中又有人上表，请进我为宋王。公爵之上便是王爵，王爵之上只剩一个位置。群臣都在等我的答复。"
 hd_j16.5355.a:0 "受之"
 hd_j16.5355.b:0 "辞之，且待来年"

 hd_j16.5356.t:0 "宋王"
 hd_j16.5356.desc:0 "晋廷进[hd_news_a.GetName]爵为宋王。宋国的宫室、百官一如天子之制，建康的晋帝只剩下一座空殿。"

 hd_j16.5345.t:0 "长安告急"
 hd_j16.5345.desc:0 "关中诸将自相残杀，夏军乘虚南下，渭北诸城相继失守。城中粮草将尽，人心惶惶。东归的路还没有断，可一出长安，这座先帝旧都便要拱手让人。"
 hd_j16.5345.a:0 "弃长安东归"
 hd_j16.5345.b:0 "死守长安"

 hd_j16.5346.t:0 "长安失陷"
 hd_j16.5346.desc:0 "[hd_news_a.GetName]的大军攻入关中，晋军东撤途中在青泥大败，朱龄石、傅弘之等皆没于阵。刘裕北伐所得的关中，不到两年便又失去。"

 hd_j16.5350.t:0 "恭帝即位"
 hd_j16.5350.desc:0 "安帝崩于东堂。外间传言，是王韶之奉命以散衣缢杀。琅邪王[hd_news_a.GetName]即皇帝位，改元元熙。新帝即位之初，便知道自己不过是禅让诏书上要署的一个名字。"

 # 修正
 hd_j16_guangzhou_cishi_modifier:0 "广州刺史"
 hd_j16_guangzhou_cishi_modifier_desc:0 "名义受晋廷之命为广州刺史，实据岭南。"
 hd_j16_liuyi_xiezui_modifier:0 "入朝谢罪"
 hd_j16_liuyi_xiezui_modifier_desc:0 "交还方镇、入朝谢罪，声望大损。"

