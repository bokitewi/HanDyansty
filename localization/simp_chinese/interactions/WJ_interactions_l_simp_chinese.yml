l_simp_chinese:
# 汉晋风华：按类型整合；键名与现行文本保留。来源逐键见本批manifest。

 # 来源：localization/replace/simp_chinese/WJ_xiaolian_direct_qualification_l_simp_chinese.yml
 wj_request_xiaolian_interaction_desc:0 "请求公国级官员察举你本人，或你的一名男性廷臣、宾客为孝廉，直接授予正式入仕资格。你可以奉上财货、威望美言、承诺或影响力，也可以请被举者拜其为师。隐士不能被请求举荐。"
 wj_xiaolian_interaction_desc:0 "以本年度察举名额举荐此人为孝廉，直接授予正式入仕资格。你可以索取财货、承诺或影响力，或提出收其为门生；条件越苛刻，对方越可能辞谢。若对方是隐士，将由其自行决定是否出山应举。"

 # 来源：localization/simp_chinese/WJ_conquest_l_simp_chinese.yml
 WJ_conquest_commission_interaction:0 "指定征讨"
 WJ_conquest_commission_interaction_desc:0 "以皇帝或本朝现任大将军的身份，命现任都督[recipient.Custom('WJ_GetLinkedUIName')]征讨相邻境外公国。沿用原版朝廷征讨战争及领土结算，不另授私人宣战权，不在此移交援兵。"

 # 来源：localization/simp_chinese/WJ_district_expansion_l_simp_chinese.yml
 wj_dd_petition_create_ai:0 "表请建督"
 wj_dd_petition_create_ai_desc:0 "请皇帝以本人王国官署为核心设都督区。玩家自选三节，达标即准；不改变真实领地与领主关系。AI皇帝径予办理；玩家皇帝可在卷轴中允准或拒绝。"
 wj_dd_petition_create_player:0 "表请建督"
 wj_dd_petition_create_player_desc:0 "请皇帝以本人王国官署为核心设都督区。玩家自选三节，达标即准；不改变真实领地与领主关系。接受条件在确认处显示，红绿确定，不以概率决定。"
 wj_dd_petition_expand_ai:0 "表奏扩区"
 wj_dd_petition_expand_ai_desc:0 "请将相邻、尚未归入其他都督区的王国官员纳入本区。沿既有连通与唯一归属规则，不真实转封。AI皇帝径予办理；玩家皇帝可在卷轴中允准或拒绝。"
 wj_dd_petition_expand_player:0 "表奏扩区"
 wj_dd_petition_expand_player_desc:0 "请将相邻、尚未归入其他都督区的王国官员纳入本区。沿既有连通与唯一归属规则，不真实转封。接受条件在确认处显示，红绿确定，不以概率决定。"
 wj_dd_qinwang_interaction:0 "诏督勤王"
 wj_dd_qinwang_interaction_desc:0 "命此都督亲率本部，加入皇帝当前领衔且合资格的攻防战争。中外在任时由其代行军令。仅此都督参战，不连带调发全区，不追随以后新开的战争。费用仍由皇帝承担：影响力100、威望150、正统性25。"

 # 来源：localization/simp_chinese/WJ_district_l_simp_chinese.yml
 wj_dd_create_interaction:0 "设置都督区"
 wj_dd_create_interaction_desc:0 "以该官员的王国实职为核心设立都督区。必须选择一等旄节；不改变领地、封臣或军队归属。"
 wj_dd_dissolve_interaction:0 "撤销都督区"
 wj_dd_dissolve_interaction_desc:0 "撤销该都督区并收回都督的旄节；不撤实职、不改变领地、封臣、开府或军队归属。"
 wj_dd_manage_interaction:0 "调整都督区"
 wj_dd_manage_interaction_desc:0 "选择拟纳入辖区的王国官员。文官州亦可入区；新辖区须与本区接壤，且未属其他都督区。退出辖区与更换都督请打开成员王国的辖区详情。"

 # 来源：localization/simp_chinese/WJ_district_orders_l_simp_chinese.yml
 wj_dd_command_interaction:0 "颁行都督军令"
 wj_dd_command_interaction_desc:0 "按本区军务与现有旄节下达军令。仅对本区有效官员执行，最终确认时重新核验权限。"
 wj_dd_justice_detain_interaction:0 "依军法羁押"
 wj_dd_justice_detain_interaction_desc:0 "由本朝现任廷尉接续处理此人的军法公罪。囚犯归廷尉羁押，罪名不因羁押而消除。"
 wj_dd_pardon_interaction:0 "特赦军法罪"
 wj_dd_pardon_interaction_desc:0 "赦免此人的本朝军法罪名。不会抹去其他罪行，也不自动释放因其他原因被囚禁的人物。"
 wj_dd_request_aid_interaction:0 "请求都督支援"
 wj_dd_request_aid_interaction_desc:0 "请求本区都督调遣辖区武官，加入你领衔且符合原版条件的战争。区内求援免费；勾选亲征仅决定都督是否亲自出兵，未获亲征仍会派将。"
 wj_dd_request_pardon_interaction:0 "请求军法特赦"
 wj_dd_request_pardon_interaction_desc:0 "请求赦免本朝军法罪。向皇帝或摄政递呈时，优先交本朝现任廷尉核办；若无可办理的廷尉，仍由原请求对象处理。皇帝、摄政、廷尉亦可直接使用“特赦军法罪”。"

 # 来源：localization/simp_chinese/WJ_district_ui_l_simp_chinese.yml
 wj_dd_adjust_jie_interaction:0 "更授旄节"
 wj_dd_adjust_jie_interaction_desc:0 "奉制总摄军政，为此都督更定旄节。选择假节、持节或使持节后确认，仍使用原有三节契约与辖区规则。都督在任期间仍保有开府；此处不修改其他封臣契约。"
 wj_dd_promote_interaction:0 "升为都督"
 wj_dd_promote_interaction_desc:0 "任命此武官接掌本都督区，并重新选择所授旄节。辖区成员不变；原都督降为本区普通武官，收回原授旄节。"
 wj_dd_withdraw_interaction:0 "退出都督区"
 wj_dd_withdraw_interaction_desc:0 "将此王国移出当前都督区。其余辖区必须仍与都督的核心辖区连通；确认时将再次检查，不能留下飞地。"

 # 来源：localization/simp_chinese/WJ_district_war_l_simp_chinese.yml
 wj_dd_deploy_aid_interaction:0 "部署辖区援军"
 wj_dd_deploy_aid_interaction_desc:0 "选择本都督区的公爵或王国级武职官员，加入受援者领衔且符合原版条件的战争。任命与臣属关系在执行时再次核实；内部派将免费，受命者必定参战。"
 wj_dd_join_wars_01:0 "都督亲自参战"
 wj_dd_join_wars_01_desc:0 "由都督本人加入该辖区官员领衔的战争。参战条件与结果沿用部署辖区援军，不选择其他武官，也不另选单场战争。"

 # 来源：localization/simp_chinese/WJ_kaoke_central_l_simp_chinese.yml
 wj_kaoke_request_interaction:0 "请求考课加分"
 wj_kaoke_request_interaction_desc:0 "请求主管官员为本人本期考课加分。王国长官辖下的伯爵、公爵由实际王国长官审批；其他合格官员由尚书令审批，空缺时不转交皇帝。你可以奉上财货、威望美言、承诺或影响力；每人每考期只能成功一次。"
 wj_kaoke_request_interaction_send:0 "请求认可"

 # 来源：localization/simp_chinese/WJ_military_rank_l_simp_chinese.yml
 WJ_mr_propose:0 "拟定授予军号"
 WJ_mr_propose_desc:0 "为这位武官选择军号。皇帝、都督中外及有辖授权限的王国武官可直接授予；大将军的表奏交都督中外裁定，中外空缺则呈皇帝。未提交的同一份草案可从此继续。"
 WJ_mr_request:0 "请奏军号"
 WJ_mr_request_desc:0 "先选择为自己请奏的军号，再向主管提交。未提交的草案可从此继续。"
 WJ_mr_submit:0 "提交军号请奏"
 WJ_mr_submit_desc:0 "为[secondary_recipient.Custom('WJ_GetLinkedUIName')]请奏[secondary_recipient.Custom('WJMRChoice')]。请裁定原议或改授。"

