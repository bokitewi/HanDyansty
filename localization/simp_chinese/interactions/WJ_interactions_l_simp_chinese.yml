 WJ_mt_pick_private_receiver:0 "部曲：指定编入方"
 WJ_mt_pick_private_source:0 "部曲：指定编出方"
 WJ_mt_pick_title_receiver:0 "郡国兵：指定调入方"
 WJ_mt_pick_title_source:0 "郡国兵：指定调出方"

 # 来源：localization/simp_chinese/WJ_office_roads_loc_l_simp_chinese.yml
 wj_bizhao_interaction:0 "征辟入幕"
 wj_bizhao_interaction_desc:0 "征辟此人入己幕府，延揽为门生。"
 wj_huangdi_zhaoshu_interaction:0 "下诏书"
 wj_huangdi_zhaoshu_interaction_desc:0 "以天子之尊颁诏处置此人：可召入宫、拔擢贬谪、赏赐或惩戒。"
 wj_maocai_interaction:0 "举茂才"
 wj_maocai_interaction_desc:0 "以本年度的察举名额举荐此人为茂才，使其直接取得正式入仕资格并列入任命候选。实际禄秩仍由所任官职决定。茂才名额尤为难得，受举者基础意愿更高；索取财货、承诺、影响力或要求拜师则会降低其意愿。"
 wj_maocai_interaction_reply_item_key:0 "[CHARACTER.Custom('WJ_GetLinkedUIName')]举你为茂才，等待你的答复"
 wj_maocai_interaction_send_name:0 "举此人为茂才"
 wj_request_bizhao_interaction:0 "征辟入幕"
 wj_request_bizhao_interaction_desc:0 "以开府之名延揽贤才，请其入幕效力。"
 wj_request_maocai_interaction:0 "请求举茂才"
 wj_request_maocai_interaction_desc:0 "请求王国级以上官员察举你本人，或你的一名男性廷臣、宾客为茂才。你可以奉上财货、威望美言、承诺或影响力，也可以请被举者拜其为师。"
 wj_request_maocai_interaction_reply_item_key:0 "[CHARACTER.Custom('WJ_GetLinkedUIName')]请求你举荐一人为茂才"
 wj_request_maocai_interaction_send_name:0 "呈请举茂才"
 wj_request_xiaolian_interaction:0 "请求举孝廉"
 wj_request_xiaolian_interaction_reply_item_key:0 "[CHARACTER.Custom('WJ_GetLinkedUIName')]请求你举荐一人为孝廉"
 wj_request_xiaolian_interaction_send_name:0 "呈请举孝廉"
 wj_xiaolian_interaction:0 "举孝廉"
 wj_xiaolian_interaction_reply_item_key:0 "[CHARACTER.Custom('WJ_GetLinkedUIName')]举你为孝廉，等待你的答复"
 wj_xiaolian_interaction_send_name:0 "举此人为孝廉"

 # 来源：localization/simp_chinese/WJ_sili_l_simp_chinese.yml
 WJ_sili_arrest_capital_official_interaction:0 "逮捕在京官员"
 WJ_sili_arrest_capital_official_interaction_desc:0 "司隶专属交互的预留入口。京官资格、逮捕依据与司法处置规则将在后续补充；当前不能执行逮捕。"
