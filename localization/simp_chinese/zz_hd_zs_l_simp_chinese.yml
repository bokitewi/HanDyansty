l_simp_chinese:
 # 诸葛亮、司马懿事件链（boki 2026-10-31，设计见 docs/诸葛亮司马懿事件链_设计草案.md）
 hd_zgl.0010.t: "开府治事"
 hd_zgl.0010.desc: "主上命你开府治事，政事无巨细，咸决于丞相府。你封武乡侯，蒋琬等人入府为属。\n\n从此蜀中的兵、财、刑、赏，都要从你的案头过一遍。"
 hd_zgl.0010.a: "鞠躬尽瘁，死而后已"
 hd_zgl.0020.t: "李严求开府"
 hd_zgl.0020.desc: "李严与你同受遗诏，掌内外军事。如今他上书求开府辟召，又请割巴郡、江州等五郡另立巴州，自为刺史。\n\n府中有人说，一国不可有二府；也有人说，李正方手握重兵，不宜逼之太急。"
 hd_zgl.0020.a: "一国不可有二府，拒之"
 hd_zgl.0020.b: "许他开府，以安其心"
 hd_zgl.0030.t: "运粮不继"
 hd_zgl.0030.desc: "大军在前，后方粮草迟迟不至。督运的李严先是假传圣旨召你退兵，回到朝中又说是你自己要退，想把罪责推到督运属吏身上。\n\n他前后的书信都还在你手里。"
 hd_zgl.0030.a: "具表弹劾，废为庶人"
 hd_zgl.0030.b: "念其旧勋，暂且宽宥"
 hd_zgl.0031.t: "废为庶人"
 hd_zgl.0031.desc: "丞相具表弹劾你督运不力、诿过于人。诏书下来，你被免去官爵，废为庶人。"
 hd_zgl.0031.a: "臣罪当诛，伏惟宽宥"
 hd_zgl.0031.b: "此皆诸葛亮构陷"
 hd_zgl.0040.t: "子午谷奇谋"
 hd_zgl.0040.desc: "魏延献策：愿得精兵五千，负粮五千，直从褒中出，循秦岭而东，当子午而北，不过十日可到长安。守将怯而无谋，闻奇兵骤至，必弃城逃走。\n\n此计若成，咸阳以西可一举而定；若不成，五千人便葬在秦岭深谷里。"
 hd_zgl.0040.a: "此计悬危，不如安从坦道"
 hd_zgl.0040.b: "予魏延五千奇兵，出子午谷"
 hd_zgl.0050.t: "魏杨不和"
 hd_zgl.0050.desc: "魏延性矜高，诸将多避让他，唯独长史杨仪不肯相下。两人每有争论，魏延动辄举刀相向，杨仪便涕泪横流。\n\n你深惜杨仪干才，又倚重魏延骁勇，不忍偏废任何一人。"
 hd_zgl.0050.a: "两存之，各加抚慰"
 hd_zgl.0050.b: "杨仪理直，责魏延"
 hd_zgl.0050.c: "魏延功高，责杨仪"
 hd_zgl.0060.t: "魏延之乱"
 hd_zgl.0060.desc: "丞相死于军中，遗命杨仪率众退兵，以你断后。你大怒：「丞相虽亡，吾自见在，何可以一人之死废天下之事？且魏延何人，当为杨仪所部勒，作断后将乎！」\n\n你可以烧绝阁道、举兵相抗，也可以忍下这口气，奉丧还朝。"
 hd_zgl.0060.a: "烧绝阁道，举兵相抗"
 hd_zgl.0060.b: "忍辱奉丧，退兵还朝"
 hd_zgl.0070.t: "出使东吴"
 hd_zgl.0070.desc: "你奉命出使东吴。孙权性好嘲弄，席间与诸葛恪、羊衜等人轮番诘难，你辞顺义笃，据理以答，始终不屈。孙权大为器重，说你「必当股肱蜀朝，恐不能数来也」。"
 hd_zgl.0070.a: "不辱使命"
 hd_zgl.0080.t: "密表后主"
 hd_zgl.0080.desc: "你年过五十，夙兴夜寐，罚二十以上皆亲览，所啖食不至数升。身后之事，是时候想一想了。你可以密表主上，荐一人继你主政。"
 hd_zgl.0080.a: "臣若不幸，后事宜以付琬"
 hd_zgl.0080.b: "荐费祎"
 hd_zgl.0080.c: "此事当由主上圣裁"
 hd_zgl.0090.t: "遗表"
 hd_zgl.0090.desc: "丞相临终有密表，荐人继他主政。如今灵柩还都，群臣都在看你如何安排。"
 hd_zgl.0090.a: "依丞相遗表行事"
 hd_zgl.0090.b: "朕自有安排"
 hd_zgl.0100.t: "姜伯约"
 hd_zgl.0100.desc: "天水姜维归降，你与他谈论兵事，大为赞叹，称他「忠勤时事，思虑精密」，是凉州上士。你把他收在门下，教以兵法，又拨虎步军数千归他统带。"
 hd_zgl.0100.a: "得一凉州上士"
 hd_zgl.0200.a: "出师北伐"
 hd_zgl.0200.b: "暂且休养"
 hd_zgl.0201.t: "出师北伐"
 hd_zgl.0201.desc: "南方已定，兵甲已足，丞相上表请率三军北定中原。"
 hd_zgl.0210.t: "再出散关"
 hd_zgl.0210.desc: "前番北伐无功而还，丞相整军经武，请再出散关，围攻陈仓，进图扶风。"
 hd_zgl.0220.t: "取武都阴平"
 hd_zgl.0220.desc: "丞相请遣将攻取武都、阴平二郡，自率大军出建威接应。"
 hd_zgl.0230.t: "复出祁山"
 hd_zgl.0230.desc: "丞相请再出祁山，围攻天水、南安。木牛已经造成，可以济运军粮。"
 hd_zgl.0240.t: "屯兵五丈原"
 hd_zgl.0240.desc: "丞相请悉起大众，由斜谷出武功，据五丈原，分兵屯田渭滨，为久驻之计。"
 hd_zgl.0211.t: "郝昭守陈仓"
 hd_zgl.0211.desc: "陈仓守将郝昭只有千余人，却据城死守。云梯、冲车、地道轮番上阵，都被他一一破解，攻城二十余日，城仍未下，粮草渐尽。"
 hd_zgl.0211.a: "督军强攻"
 hd_zgl.0211.b: "粮尽，引兵还"
 hd_zgl.0300.a: "善"
 hd_zgl.0300.t: "科教严明"
 hd_zgl.0300.desc: "丞相府科教严明，赏罚必信，无恶不惩，无善不显。吏不容奸，人怀自厉，道不拾遗，强不侵弱。"
 hd_zgl.0310.t: "八阵图"
 hd_zgl.0310.desc: "你推演兵法，作八阵图，以天、地、风、云、龙、虎、鸟、蛇八阵相生，进退有度。"
 hd_zgl.0320.t: "诸葛连弩"
 hd_zgl.0320.desc: "丞相损益连弩，名曰元戎，以铁为矢，矢长八寸，一弩十矢俱发。"
 hd_zgl.0330.t: "木牛"
 hd_zgl.0330.desc: "丞相作木牛运粮，一牛载一岁粮，日行二十里，人不大劳，牛不饮食。"
 hd_zgl.0340.t: "流马"
 hd_zgl.0340.desc: "继木牛之后，丞相又作流马，转运更便，大军可以久驻。"
 hd_zgl.0400.t: "星落五丈原"
 hd_zgl.0400.desc: "丞相病笃，薨于军中。长史杨仪、司马费祎等人秘不发丧，请命于你：是整军退还，还是秘而不宣，继续与魏军相持？"
 hd_zgl.0400.a: "整军退还"
 hd_zgl.0400.b: "秘不发丧，继续相持"
 hd_zgl.0900.t: "开府治事"
 hd_zgl.0900.desc: "[hd_news_b.GetName]命[hd_news_a.GetName]开府治事，政事无巨细，咸决于丞相府。"
 hd_zgl.0910.t: "李严废为庶人"
 hd_zgl.0910.desc: "[hd_news_b.GetName]具表弹劾[hd_news_a.GetName]督运不力、诿过于人，[hd_news_a.GetName]被废为庶人。"
 hd_zgl.0920.t: "魏延之乱"
 hd_zgl.0920.desc: "丞相死后，[hd_news_a.GetName]不服[hd_news_b.GetName]节度，烧绝阁道，与之相攻，兵败被斩。"
 hd_zgl.0930.t: "星落五丈原"
 hd_zgl.0930.desc: "[hd_news_a.GetName]病笃，薨于军中。蜀军秘不发丧，整军退还。"
 hd_zgl.0940.t: "继掌朝政"
 hd_zgl.0940.desc: "依丞相遗表，[hd_news_b.GetName]以[hd_news_a.GetName]主持朝政。"
 hd_smy.0010.t: "太子四友"
 hd_smy.0010.desc: "你与陈群、吴质、朱铄都在世子身边，时人称为「太子四友」。曹丕待你甚厚，每有大事，常引你密议。"
 hd_smy.0010.a: "君臣相得"
 hd_smy.0020.t: "魏王嗣位"
 hd_smy.0020.desc: "魏王薨，世子嗣位。新王念你辅佐之功，迁你为丞相长史，参与机要。"
 hd_smy.0020.a: "谨慎从事"
 hd_smy.0030.t: "尚书之任"
 hd_smy.0030.desc: "受禅礼成。司马懿久在东宫，深沉多谋，可以典掌尚书台，总理文书机要。"
 hd_smy.0030.a: "以司马懿为尚书令"
 hd_smy.0030.b: "另择他人"
 hd_smy.0040.t: "抚军录尚书"
 hd_smy.0040.desc: "天子东征，诏你以抚军大将军、录尚书事留镇许昌，并改封舞阳侯，以河内为封域。天子说：「吾东，抚军当总西事；吾西，抚军当总东事。」"
 hd_smy.0040.a: "受命留镇"
 hd_smy.0040.b: "固辞不受"
 hd_smy.0050.t: "受遗诏辅政"
 hd_smy.0050.desc: "先帝临终，召曹真、曹休、陈群与司马懿受遗诏，辅佐嗣君。如今遗诏在前，用与不用，在你一念之间。"
 hd_smy.0050.a: "遵先帝遗诏"
 hd_smy.0050.b: "朕自亲政"
 hd_smy.0060.t: "都督雍凉"
 hd_smy.0060.desc: "蜀寇屡出，关中震动。群臣议以司马懿都督雍、凉二州诸军事，使持节，统摄关中、陇右诸郡，专力拒蜀。"
 hd_smy.0060.a: "以司马懿都督雍凉"
 hd_smy.0060.b: "另择良将"
 hd_smy.0061.t: "坚壁拒守"
 hd_smy.0061.desc: "两军相持已久。诸将屡屡请战，有人讥你「畏蜀如虎」。你却知道蜀军远来，利在速战，粮尽自退。"
 hd_smy.0061.a: "坚壁拒守，以待其弊"
 hd_smy.0061.b: "出营求战"
 hd_smy.0062.t: "巾帼之辱"
 hd_smy.0062.desc: "诸葛亮派人送来一套妇人的巾帼衣裳，讥你不敢出战，与妇人无异。帐下诸将无不愤恨，齐声请战。"
 hd_smy.0062.a: "笑而受之，坚守如故"
 hd_smy.0062.b: "上表请战，待天子诏止"
 hd_smy.0070.t: "讨辽东"
 hd_smy.0070.desc: "公孙渊据辽东自立，又诱鲜卑侵扰北方。司马懿请率步骑四万讨之：往百日，攻百日，还百日，以六十日为休息，一年足矣。"
 hd_smy.0070.a: "命司马懿讨辽东"
 hd_smy.0070.b: "辽东僻远，暂且不问"
 hd_smy.0071.t: "平辽东"
 hd_smy.0071.desc: "襄平城破，公孙渊父子授首。城中官吏、士卒数千人仍在你掌握之中，处置如何，全凭你一言。"
 hd_smy.0071.a: "尽诛之，筑为京观"
 hd_smy.0071.b: "赦其胁从"
 hd_smy.0080.t: "曹爽专权"
 hd_smy.0080.desc: "曹爽用何晏、邓飏、丁谧之谋，尊你为太傅，外示尊崇，内夺兵权。尚书奏事，先过曹爽。你的部将旧吏，渐被调离要职。"
 hd_smy.0080.a: "称病不出，以观其变"
 hd_smy.0080.b: "据理力争"
 hd_smy.0090.t: "高平陵之变"
 hd_smy.0090.desc: "曹爽兄弟奉天子出城谒高平陵，京城空虚。你称病已久，曹爽早已不疑。蒋济、高柔都愿从你。此刻发难，可一举而定。"
 hd_smy.0090.a: "勒兵闭城，奏免曹爽"
 hd_smy.0090.b: "时机未到，再忍一时"
 hd_smy.0100.t: "议加九锡"
 hd_smy.0100.desc: "天子诏以你为丞相，加九锡，封晋公，以并州诸郡为封国。群臣都在看你是否受命。"
 hd_smy.0100.a: "受命，建晋国"
 hd_smy.0100.b: "固辞不受"
 hd_smy.0101.t: "进爵晋王"
 hd_smy.0101.desc: "天子再下诏书，进你爵为晋王。王者之位，只差一步。"
 hd_smy.0101.a: "进爵为王"
 hd_smy.0101.b: "固辞不受"
 hd_smy.0900.t: "都督雍凉"
 hd_smy.0900.desc: "[hd_news_b.GetName]以[hd_news_a.GetName]都督雍、凉二州诸军事，统摄关中、陇右，专力拒蜀。"
 hd_smy.0910.t: "死诸葛走生仲达"
 hd_smy.0910.desc: "蜀军退兵，[hd_news_a.GetName]追之。蜀军反旗鸣鼓，作势欲战，[hd_news_a.GetName]不敢逼而退。百姓为之谚曰：「死诸葛走生仲达。」"
 hd_smy.0920.t: "高平陵之变"
 hd_smy.0920.desc: "[hd_news_b.GetName]奉天子谒高平陵，[hd_news_a.GetName]勒兵闭城，奏免其官。曹氏的权柄，从此移入司马氏之手。"
 hd_smy.0930.t: "平辽东"
 hd_smy.0930.desc: "[hd_news_a.GetName]攻破襄平，[hd_news_b.GetName]父子授首，辽东诸郡皆平。"
 hd_smy.0940.t: "受遗诏辅政"
 hd_smy.0940.desc: "先帝临终，[hd_news_a.GetName]与曹真、曹休、陈群同受遗诏，辅佐[hd_news_b.GetName]。"
 hd_zgl_ziwu_army_name: "子午谷奇兵"
 hd_zgl_hubu_army_name: "虎步军"
 hd_smy_dudu_army_name: "雍凉诸军"
 hd_smy_liaodong_army_name: "讨辽东步骑"
 hd_zs_unity_rise.desc: "族中有人位望日隆"
 hd_zgl_wuxiang_peer_name: "武乡侯"
 hd_zgl_kaifu_modifier: "开府治事"
 hd_zgl_kaifu_modifier_desc: "政事无巨细，咸决于丞相府。"
 hd_zgl_bazhen_modifier: "八阵图"
 hd_zgl_bazhen_modifier_desc: "推演兵法，作八阵图，进退有度。"
 hd_zgl_zhongduhu_modifier: "中都护"
 hd_zgl_zhongduhu_modifier_desc: "与丞相同受遗诏，统内外军事。"
 hd_zgl_bazhou_modifier: "开府巴州"
 hd_zgl_bazhou_modifier_desc: "许以开府辟召，镇于江州。"
 hd_zgl_shuren_modifier: "废为庶人"
 hd_zgl_shuren_modifier_desc: "被免去官爵，废为庶人。"
 hd_zgl_yangyang_modifier: "怏怏"
 hd_zgl_yangyang_modifier_desc: "奇谋不用，常谓丞相为怯，叹恨己才用之不尽。"
 hd_zgl_yuanwang_modifier: "怨望"
 hd_zgl_yuanwang_modifier_desc: "自以为功勋至大，宜代丞相秉政，常怀怨愤。"
 hd_zgl_kejiao_modifier: "科教严明"
 hd_zgl_kejiao_modifier_desc: "赏罚必信，吏不容奸，人怀自厉。"
 hd_zgl_muniu_modifier: "木牛"
 hd_zgl_muniu_modifier_desc: "以木牛运粮，人不大劳。"
 hd_zgl_liuma_modifier: "流马"
 hd_zgl_liuma_modifier_desc: "以流马转运，大军可以久驻。"
 hd_zgl_liannu_modifier: "诸葛连弩"
 hd_zgl_liannu_modifier_desc: "元戎连弩，一弩十矢俱发。"
 hd_zgl_tuntian_modifier: "屯田渭滨"
 hd_zgl_tuntian_modifier_desc: "分兵屯田，耕者杂于渭滨居民之间，为久驻之基。"
 hd_smy_fujun_modifier: "抚军录尚书"
 hd_smy_fujun_modifier_desc: "天子东征，留镇许昌，总理后方。"
 hd_smy_yizhao_modifier: "受遗诏辅政"
 hd_smy_yizhao_modifier_desc: "受先帝遗诏，辅佐嗣君。"
 hd_smy_dudu_modifier: "都督雍凉"
 hd_smy_dudu_modifier_desc: "都督雍、凉二州诸军事，使持节，专力拒蜀。"
 hd_smy_jianbi_modifier: "坚壁拒守"
 hd_smy_jianbi_modifier_desc: "深沟高垒，以待敌弊。"
 hd_smy_qiuzhan_modifier: "出营求战"
 hd_smy_qiuzhan_modifier_desc: "出营列阵，求与敌决战。"
 hd_smy_taifu_modifier: "太傅"
 hd_smy_taifu_modifier_desc: "外示尊崇，实无兵权。"
 hd_smy_chengbing_modifier: "称病不出"
 hd_smy_chengbing_modifier_desc: "称病闭门，以观其变。"
 hd_smy_yizhong_modifier: "朝野倚重"
 hd_smy_yizhong_modifier_desc: "蜀寇在外，朝野倚太傅为柱石。"
 hd_zs_shou_yizhao_opinion: "同受遗诏"
 hd_zs_refused_opinion: "所请被拒"
 hd_zs_favored_opinion: "见重"
 hd_zs_slighted_opinion: "见黜"
 hd_beifa_wei_line_text: "\n\n#high 北伐之威#! [GetGlobalVariable('hd_beifa_wei').GetValue|0]/100：[GetPlayer.Custom('hd_beifa_wei_tier')]"
 hd_beifa_wei_tier_1: "边境暂宁"
 hd_beifa_wei_tier_2: "蜀寇日炽"
 hd_beifa_wei_tier_3: "关中震动"
