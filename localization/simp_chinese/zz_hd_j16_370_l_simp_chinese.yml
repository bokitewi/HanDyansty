l_simp_chinese:
 hd_j16.4000.t:0 "金刀之计"
 hd_j16.4000.desc:0 "慕容垂父子奔秦，天王待之如上宾，朝野侧目。你看得分明：此人是人中之龙，终不为人用。此番东征洛阳，慕容令随军参谋，正好下手。只消买通其父的旧部金熙，带着慕容垂赠你的那把金刀去见慕容令，说他父亲已在长安待不下去，要他先回燕国。"
 hd_j16.4000.a:0 "遣金熙持金刀而往。"
 hd_j16.4000.b:0 "以诚待人，不行此计。"
 hd_j16.4001.t:0 "金刀之言"
 hd_j16.4001.desc:0 "父亲的旧部金熙夜里来到营中，手里拿着那把金刀，说是父亲的意思：秦人不可久处，你先走一步，父亲随后就到。金刀是父亲的随身之物，可王猛刚向父亲讨过它，这话真假难辨。"
 hd_j16.4001.a:0 "父命不可违，即刻东奔。"
 hd_j16.4001.b:0 "此中有诈，按兵不动。"
 hd_j16.4002.t:0 "令儿出奔"
 hd_j16.4002.desc:0 "消息传到长安：令儿自军中出奔燕国去了。满朝都在议论，说慕容氏父子本就首鼠两端。你百口莫辩，留下是等死，逃走又坐实了罪名。"
 hd_j16.4002.a:0 "惶惧东奔，听天由命。"
 hd_j16.4002.b:0 "束身待罪，听凭天王处置。"
 hd_j16.4010.t:0 "金刀余波"
 hd_j16.4010.desc:0 "金刀一事闹得满城风雨，令儿背上了叛子的骂名。天王召你入见，温言抚慰，说父子各有其志，不相连坐。你心里明白，这一局是王猛设的，可满朝无人肯替你说一句话。"
 hd_j16.4010.a:0 "吞声忍辱，来日方长。"
 hd_j16.4010.b:0 "当面谢罪，求出外郡。"
 hd_j16.4010.c:0 "此仇此恨，岂能忘怀。"
 hd_j16.4020.t:0 "王猛请诛慕容垂"
 hd_j16.4020.desc:0 "王猛又上密表：慕容垂父子本是燕国宗室，如今寄身秦廷，好比蛟龙猛兽，不可驯服，不如趁早除去。金刀一事之后，朝中附和的人越来越多。"
 hd_j16.4020.a:0 "朕方以义招徕天下英豪，怎能杀之。"
 hd_j16.4020.b:0 "景略所言是，诛之。"
 hd_j16.4020.c:0 "外放边郡，不使典兵。"
 hd_j16.4030.t:0 "秦使至仇池"
 hd_j16.4030.desc:0 "秦国使者到了仇池山下，要你遣子入质，岁岁称臣。苻雅、杨安的兵马已在陇右集结。仇池山险，四面绝壁，祖宗在此传了七代，凭什么向氐人苻氏低头？"
 hd_j16.4030.a:0 "杀使拒命，据险固守。"
 hd_j16.4030.b:0 "奉表称藩，保全宗族。"
 hd_j16.4040.t:0 "南图梁益"
 hd_j16.4040.desc:0 "仇池既平，汉中门户已开。梁、益二州的晋军孤悬在外，益州刺史新丧，人心未定。杨安熟悉氐羌山道，朱肜也请为前驱。"
 hd_j16.4040.a:0 "遣杨安、朱肜伐蜀。"
 hd_j16.4040.b:0 "暂缓南图，再观时变。"
 hd_j16.4041.t:0 "秦兵入汉中"
 hd_j16.4041.desc:0 "梁州急报：秦将杨安、朱肜率众出汉中，直指成都。梁、益二州兵少将寡，恐怕守不住了。"
 hd_j16.4041.a:0 "速发援兵。"
 hd_j16.4050.t:0 "王猛遗言"
 hd_j16.4050.desc:0 "王猛病笃时，你亲自到他床前问后事。他说：晋虽僻处江南，却是正朔所在，上下安和，臣死之后，愿陛下勿以晋为图；鲜卑、西羌是我们的仇敌，终为后患，应当慢慢除去，以利社稷。说完便断了气。"
 hd_j16.4050.a:0 "景略之言，朕当铭记。"
 hd_j16.4050.b:0 "天下未一，朕不能止步。"
 hd_j16.4060.t:0 "请秦出兵"
 hd_j16.4060.desc:0 "什翼犍连年兴兵来攻，你的部众死伤离散，已经快撑不住了。长安的天王正有意北顾，只要你开口，秦兵就会出塞。可是引狼入室，日后代地还会是你的吗？"
 hd_j16.4060.a:0 "遣使长安，请秦出兵。"
 hd_j16.4060.b:0 "再忍一时，暂不引秦。"
 hd_j16.4061.t:0 "秦兵将至"
 hd_j16.4061.desc:0 "刘卫辰投了秦国，引着秦兵来了。苻洛统大军出塞，声势浩大。你年岁已高，诸子不和，部落人心浮动。是战是和，要早作决断。"
 hd_j16.4061.a:0 "整军备战，与秦决于云中。"
 hd_j16.4061.b:0 "遣使称藩，以保宗庙。"
 hd_j16.4061.c:0 "遣燕凤使秦，以言辞缓兵。"
 hd_j16.4080.t:0 "征张天锡入朝"
 hd_j16.4080.desc:0 "秦使梁殊、阎负到了姑臧，传天王诏书，征你入朝。左右都说秦兵势大，不如称臣；也有人说张氏世守河西，宁死不能屈膝。"
 hd_j16.4080.a:0 "斩其使者，与秦决战。"
 hd_j16.4080.b:0 "奉诏入朝，以全一方。"
 hd_j16.4100.t:0 "襄阳之役"
 hd_j16.4100.desc:0 "梁、益既定，襄阳成了晋人的北门。朱序守在城里，兵不满万。苻丕请统诸军南下，苟苌、慕容垂、姚苌各领一路，愿为前驱。"
 hd_j16.4100.a:0 "遣苻丕统诸军围襄阳。"
 hd_j16.4100.b:0 "暂缓南伐，以养士卒。"
 hd_j16.4110.t:0 "君川之捷"
 hd_j16.4110.desc:0 "秦将彭超、俱难率众南犯淮南，围攻三阿，前锋逼近广陵。[hd_news_a.GetName]率北府兵自广陵出击，大破秦军于君川，彭超、俱难仅以身免。北府兵从此威名大振。"
 hd_j16.4130.t:0 "西域之役"
 hd_j16.4130.desc:0 "车师、鄯善的国王入朝，说西域诸国久已不通中国，愿为向导，请发兵平定。龟兹国有高僧鸠摩罗什，名闻天下。吕光请率七万之众出玉门。"
 hd_j16.4130.a:0 "遣吕光西征。"
 hd_j16.4130.b:0 "西域荒远，劳师无益。"
 hd_j16.4131.t:0 "吕光破龟兹"
 hd_j16.4131.desc:0 "[hd_news_a.GetName]率军西出流沙，三十余国望风归附。龟兹王闭城固守，诸胡来援，被秦军大破于城西。龟兹城破，高僧鸠摩罗什也落到了秦军手里。"
 hd_j16.4132.t:0 "东还"
 hd_j16.4132.desc:0 "龟兹已平，西域诸国纷纷遣使。有人劝你就此留镇西域，自成一方；也有人说中原消息断绝，天王生死未知，不如早日东归。"
 hd_j16.4132.a:0 "以骆驼二万载珍宝东还。"
 hd_j16.4132.b:0 "留镇西域，经略诸国。"
 hd_j16.4140.t:0 "小儿辈遂已破贼"
 hd_j16.4140.desc:0 "淝水捷书送到建康时，[hd_news_a.GetName]正与客人对局。看罢书信，随手放在床上，了无喜色，照旧下棋。客人忍不住问，他只淡淡地说：小儿辈遂已破贼。秦军百万之众，就此瓦解。"
 hd_j16.4140.b:0 "围棋如故。"
 hd_j16.4150.t:0 "淝水败后"
 hd_j16.4150.desc:0 "淝水一败，秦军百万之众一朝溃散，只有你这一军完好无损。天王带着千余骑逃到你的营中。慕容德、慕容宝都劝你：天赐良机，趁势杀了他，燕国就可以复兴了。"
 hd_j16.4150.a:0 "奉还兵马，护天王北还。"
 hd_j16.4150.b:0 "劫营自立，复我燕祚。"
 hd_j16.4150.c:0 "请往河北，镇抚旧部。"
 hd_j16.4160.t:0 "慕容垂请往河北"
 hd_j16.4160.desc:0 "慕容垂上表说：北方的人听说王师失利，不免轻举妄动，臣请奉诏前往，镇抚河北，顺便拜谒祖宗陵庙。权翼苦谏，说慕容垂是一只老鹰，饿了才肯依附于人，听到风声就要飞走，一旦放出去，再也收不回来。"
 hd_j16.4160.a:0 "朕已许之，岂可失信。"
 hd_j16.4160.b:0 "卿留长安，勿复多言。"
 hd_j16.4170.t:0 "苻丕即位晋阳"
 hd_j16.4170.desc:0 "天王遇害的消息传到晋阳，[hd_news_a.GetName]发丧，即皇帝位，改元大安，号令关东诸将，誓为先帝复仇。"
 hd_j16.4180.t:0 "苻登继统"
 hd_j16.4180.desc:0 "[hd_news_a.GetName]在陇东被诸将推为主帅，即皇帝位。他在军中立了苻坚的神主，每次出战都要先向神主祷告，将士们在矛上刻了「死休」二字，誓与姚苌决一死战。"
 hd_j16_n370_army_qiuchi_name:0 "伐仇池军"
 hd_j16_n370_army_yangan_name:0 "杨安所部"
 hd_j16_n370_army_fuluo_name:0 "苻洛所部"
 hd_j16_n370_army_liangxi_name:0 "梁熙所部"
 hd_j16_n370_army_fupi_name:0 "苻丕所部"
 hd_j16_n370_army_lvguang_name:0 "西征军"
 hd_j16_n370_army_murongchui_name:0 "慕容垂所部"
 hd_j16_jindao_yipan_modifier:0 "疑叛"
 hd_j16_jindao_yipan_modifier_desc:0 "自秦奔还，燕廷疑其为间，不敢重用。"
 hd_j16_chui_waifang_modifier:0 "外放边郡"
 hd_j16_chui_waifang_modifier_desc:0 "出为边郡守宰，不得典掌禁兵。"
 hd_j16_qiuchi_jiang_modifier:0 "受命征仇池"
 hd_j16_qiuchi_jiang_modifier_desc:0 "奉诏统兵，讨伐仇池杨氏。"
 hd_j16_dai_beizhan_modifier:0 "整军备战"
 hd_j16_dai_beizhan_modifier_desc:0 "秦兵将至，诸部倾巢而出。"
 hd_j16_tianxi_guiyi_modifier:0 "归义侯"
 hd_j16_tianxi_guiyi_modifier_desc:0 "以河西降秦，受封归义侯，优游长安。"
 hd_j16_feishui_zhenhou_modifier:0 "阵后一呼"
 hd_j16_feishui_zhenhou_modifier_desc:0 "朱序在秦军阵后大呼「秦兵败矣」，秦众惊溃。"
 hd_j16_fudeng_zhupai_modifier:0 "负坚主牌"
 hd_j16_fudeng_zhupai_modifier_desc:0 "军中载苻坚神主，将士刻矛为「死休」，誓报国仇。"
 hd_j16_jindao_pardon_opinion:0 "金刀之事，不予追究"
 hd_j16_jindao_grudge_opinion:0 "金刀之怨"
 hd_j16_chui_xiezui_opinion:0 "当面谢罪"
 hd_j16_qingzhu_xianbei_opinion:0 "诛杀慕容垂"
 hd_j16_yiyan_hu_opinion:0 "王猛遗言，猜忌诸胡"
 hd_j16_hujia_opinion:0 "淝水护驾"
 hd_j16_chui_betray_opinion:0 "劫营自立"
 hd_j16_xiyu_qiuci_opinion:0 "破龟兹之仇"
