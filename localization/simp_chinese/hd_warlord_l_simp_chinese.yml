l_simp_chinese:
 # 郡国制·军阀契约（2026-10-24）
 # 编制档位
 hd_warlord: "@celestial_military_administration!军阀"
 hd_warlord_short: "军阀"
 hd_warlord_text_icon: "@celestial_military_administration!"
 hd_warlord_desc: "#low 名为朝廷命官，实则拥兵割据：赋税不入朝廷，兵马不听调遣，子孙自相承袭。#!"
 hd_warlord_benefits: "#emphasis #bold 官员增益：#!#!\n$EFFECT_LIST_BULLET$不向主君缴纳赋税、不出征召兵；本应上缴的赋税每季从金钱转入自家国库，朝廷不再发放俸禄\n$EFFECT_LIST_BULLET$使用[GetLaw('hd_warlord_succession_law').GetName]，可自行指定继承人\n$EFFECT_LIST_BULLET$城防等级#P +2#!，守方优势#P +4#!，控制度增长#P +10%#!；发展度增长#N -20%#!\n$EFFECT_LIST_BULLET$[levy|E]规模#P +30%#!，[men_at_arms|E]维护费#P -15%#!，[men_at_arms|E]招募费用#P -30%#!，[men_at_arms|E][regiments|E]规模#P +3#!\n$EFFECT_LIST_BULLET$可拒绝主君或都督的调兵；朝廷召其参战须付三倍[influence|E]\n\n#alert_trial @alert_icon!只能由封臣以「拥兵自重」决议自请；主君只能以「收回权力」互动改回。#!"
 hd_warlord_contract_locked_tt: "不是军阀（军阀的编制只能以「收回权力」互动改动）"
 hd_warlord_level_locked_tt: "不是军阀"
 hd_warlord_level_decision_only_tt: "已以「拥兵自重」决议自请为军阀"

 # 继承法
 hd_warlord_succession_law: "欢呼继承制"
 hd_warlord_succession_law_subname: "候选分最高者继承，军阀所指定的继承人另加分"
 hd_warlord_succession_law_effects: "\n[appointment_succession_law|E]的一种。军阀死后，其[title|E]和相关[holdings|E]由[candidate_score|E]最高的候选人继承，打分同原版欢呼继承制；军阀亲自选定的[designated_heir|E]另加#P +100#!分。\n\n候选人包括军阀的近亲、军阀自己的有地[vassals|E]，以及同一[liege|E]治下的其他有地封臣和他们的家族成员（须低于该头衔的等级）。"
 hd_warlord_law_blocked_tt: "不是军阀"
 hd_warlord_law_requires_warlord_tt: "是军阀"
 hd_warlord_designated_heir_desc: "军阀指定的继承人"

 # 决议：拥兵自重
 hd_warlord_declare_decision: "拥兵自重"
 hd_warlord_declare_decision_desc: "朝廷鞭长莫及，兵马钱粮都握在我手里。与其年年把赋税解往京师，听候朝廷调遣，何不拥兵自重，自收赋税，让子孙世守此地？"
 hd_warlord_declare_decision_tooltip: "改为军阀：不缴赋税、不出征召兵，继承改为欢呼继承制"
 hd_warlord_declare_decision_confirm: "拥兵自重"
 hd_warlord_declare_military_tt: "是武官（军制管理或司隶编制）"
 hd_warlord_declare_cooldown_tt: "近五年内未被主君收回权力"
 hd_warlord_declare_centralization_tt: "直属主君的集权法不是[GetLaw('celestial_bureaucracy_3').GetName]（直属主君本身是封臣时不受此限）"
 hd_warlord_declare_tier_tt: "主头衔至少为郡级"
 hd_warlord_declare_support_tt: "至少半数[powerful_vassals|E]支持你：[obedient|E]、朋友或至交、对你的好感不低于 70，或对你[cowed|E]（没有强力封臣时不受此限）"
 hd_warlord_establish_effect_tt: "编制改为#high 军阀#!：不再向主君缴纳赋税、不出征召兵，本应上缴的赋税每季从金钱转入自家国库，朝廷不再发放俸禄；继承改为[GetLaw('hd_warlord_succession_law').GetName]，可自行指定继承人。"
 hd_warlord_declared_msg: "封臣拥兵自重"
 hd_warlord_declared_opinion: "拥兵自重"

 # 互动：收回权力
 hd_warlord_revoke_interaction: "收回权力"
 hd_warlord_revoke_interaction_desc: "要[recipient.GetShortUIName]交出兵权，改回朝廷任命的普通武官。对方若拒绝，你将获得对其的「讨不臣」[casus_belli|E]。"
 hd_warlord_revoke_interaction_notification: "朝廷法度不可久废。兵权，该交还了。"
 hd_warlord_revoke_to_military_tt: "编制改回#high 军制管理#!，继承改回[GetLaw('celestial_military_appointment_succession_law').GetName]；五年内不得再自请为军阀"
 hd_warlord_revoke_to_civil_tt: "无法改回军制管理（名额已满，或主君不能辖武官；都督区首领例外，一律改回军制管理），编制改为#high 标准管理#!的普通文官，继承改回[GetLaw('celestial_appointment_succession_law').GetName]；五年内不得再自请为军阀"
 hd_warlord_defy_effect_tt: "主君获得对其的「讨不臣」[casus_belli|E]，五年内有效"
 hd_warlord_revoke_ai_strength_strong: "兵力不逊于主君"
 hd_warlord_revoke_ai_strength_half: "兵力达主君一半以上"
 hd_warlord_revoke_ai_strength_weak: "兵力不及主君四分之一"

 # 宣战理由：讨不臣
 hd_warlord_revoke_cb: "讨不臣"
 hd_warlord_revoke_cb_war_name: "[ATTACKER.GetShortUINamePossessive]讨不臣之战"
 hd_warlord_revoke_cb_victory_desc: "[defender.GetShortUIName|U]被收回兵权，主头衔归[attacker.GetShortUIName]所有，本人被押入大牢。"
 hd_warlord_revoke_cb_white_peace_desc: "双方罢兵，[defender.GetShortUIName|U]仍为军阀；双方停战五年。"
 hd_warlord_revoke_cb_defeat_desc: "讨伐失利，[defender.GetShortUIName|U]仍为军阀；双方停战五年。"

 # 调兵与独立倾向（2026-10-24 追加）
 hd_warlord_summon_cost_desc: "召唤军阀"
 hd_warlord.0001.t: "调兵令到"
 hd_warlord.0001.desc: "[hd_wl_summoner.GetTitledFirstName]派人送来调令，要我发兵去助[hd_wl_beneficiary.GetTitledFirstName]作战。\n\n来使在堂下候着回话。兵是我一手练出来的，粮也是我自家筹的，凭什么替别人卖命？可调令上盖着官印，真要回绝，往后少不了被人记上一笔。"
 hd_warlord.0001.a: "发兵应召"
 hd_warlord.0001.b: "按兵不动"
 hd_warlord_summon_accepted_msg: "军阀应召出兵"
 hd_warlord_summon_refused_msg: "军阀拒绝出兵"
 hd_warlord_refused_summon_opinion: "拒绝应召"
 FACTION_REASON_HD_WARLORD: "拥兵自重的军阀"
