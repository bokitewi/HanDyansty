 hd_dc_pressure_status: "危世：[Situation.MakeScope.Var('hd_dc_pressure_percent').GetValue|1]/100 · 第[Situation.MakeScope.Var('hd_dc_pressure_band').GetValue|0]档"
 hd_dc_pressure_status_tt: "危世衡量朝局积弊，跨时代保留，并与盛世分别增减。催化发生时，依当时的时代换算入账；割据沿用危世时代的数值。危世五档、危机与治理奖惩以此处读数为准，阶段图中的催化进度另行保留。\n\n控制力和发展度按每郡本轮基准累计扣减：只有达到尚未处理的更高档位才补扣差额。下降后再回到同档不会重复扣除；第一档持续60个月后，下一轮才重新记录基准。"
 hd_dc_prosperity_status: "盛世：[Situation.MakeScope.Var('hd_dc_prosperity_percent').GetValue|1]/100"
 hd_dc_prosperity_status_tt: "盛世记录朝政恢复的成果，与危世各有0至100的上下限，二者可以同时上升或下降。催化依朝廷所偏好的发展或扩张路线计入盛世，每次只取一个方向；朝廷暂时无主时沿用上次方向。时代切换不会清零。\n\n阶段图继续显示原有时代进度；此处的盛世读数不会直接改换时代，割据退出仍须达到真实领地与稳定期限条件。"
