l_simp_chinese:
 # 184 剧本流程重制（2026-10-21）
 hd184r_freeze_minister_tt:0 "坐镇一州的州牧，此时不入朝任公卿"
 hd184r_freeze_appointment_desc:0 "现任州牧，不调任他州"
 hd184r_meiguo_name:0 "郿国"
 hd184r_meiguo_name_adj:0 "郿"
 hd184r_xiliang_army:0 "西凉军"
 hd184r_zhongjia_name:0 "陈"
 hd184r_zhongjia_name_adj:0 "陈"
 hd184r.0201.t:0 "徐州道上"
 hd184r.0201.desc:0 "琅琊道上传来凶信：[hd_news_a.GetName]的父亲避乱东来，辎重百余车，行至徐州境内，被护送的兵卒见财起意，连同家眷一并杀害。徐州的[hd_news_b.GetName]闻讯惶恐，急忙遣人辩白，可[hd_news_a.GetName]已缟素举哀，誓要为父报仇。\n\n沿途的人都说，泗水一带今后不得安宁了。"
 hd184r.0201.a:0 "父仇不共戴天。"
 hd184r.0202.t:0 "代汉者当涂高"
 hd184r.0202.desc:0 "术士又来求见，说谶书上写着「代汉者当涂高」，涂者路也，而你字公路，正应此谶。帐下有人附和，也有人低头不语。天子流离，汉家威令早已不出关中，九江、淮南的城邑都在你手里，袁氏四世三公，门生故吏遍于天下。\n\n只是一旦称尊，天下诸侯便都有了讨伐你的名目。"
 hd184r.0202.a:0 "天命在我，即日称尊。"
 hd184r.0202.b:0 "时机未到，且再隐忍。"
 hd184r.0203.t:0 "寿春称帝"
 hd184r.0203.desc:0 "[hd_news_a.GetName]在寿春设坛告天，自称天子，国号仲家，置公卿百官，郊祀天地。消息传开，各地诸侯无不哗然：汉室虽衰，天子尚在，竟有人敢僭号称尊。\n\n有人冷笑，有人暗自盘算，淮南的百姓则只担心今年的赋税又要加重几分。"
 hd184r.0203.a:0 "僭号者，天下共讨之。"
 hd184r.0204.t:0 "长安内讧"
 hd184r.0204.desc:0 "长安城里，[hd_news_a.GetName]与[hd_news_b.GetName]本是同乡同袍，如今却为争权互相猜忌。一场酒宴之后，[hd_news_a.GetName]疑心酒中有毒，回营便与[hd_news_b.GetName]刀兵相见，两军在城中混战数月，宫室被焚，尸积于道。\n\n天子趁乱出城东归，一路颠沛，终于回到焚毁过半的雒阳，百官披荆棘、依墙壁而居。"
 hd184r.0204.a:0 "汉室威仪，扫地尽矣。"
 hd184r.0205.t:0 "南海风波"
 hd184r.0205.desc:0 "交州刺史[hd_news_b.GetName]为政苛急，横征暴敛，终被当地夷民所杀。交州群龙无首，交趾太守[hd_news_a.GetName]素得人心，遂接掌州事，又表奏诸弟分任合浦、九真、南海太守，士氏一门雄长一州。\n\n中原战火正炽，岭南却因此得了几分安宁。"
 hd184r.0205.a:0 "岭外自有一方天地。"
 hd184r.0206.t:0 "名士来投"
 hd184r.0206.desc:0 "门外有客求见。来人是[hd184r_advisor.GetName]，风尘仆仆，却神色从容。寒暄过后，他说起自己辗转各处，见过不少当世豪杰，最终还是决意来投奔你，愿为你出谋划策。\n\n你与他谈到深夜，越谈越觉得此人不凡。"
 hd184r.0206.a:0 "得此人，大事可图。"
 hd184r_faction_freeze_tt:0 "天子在位，诸侯尚不敢公然结党逼宫"
